base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/037.yaml
  text: Then Eliakim son of Hilkiah[a], who was over the household, and Shebna the scribe, and Joah son of Asaph, the recorder, came to Hezekiah with their clothes torn and told him the words of the Rabshakeh.
translation:
  language: pt
  text: Então Eliaquim, filho de Hilquias, encarregado do palácio, Sebna, o secretário, e Joá, filho de Asafe, o cronista, foram até Ezequias com as roupas rasgadas e lhe transmitiram as palavras do rabsaqué.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rabsaqué é um título assírio para um alto oficial, possivelmente alguém como o copeiro-mor ou um porta-voz.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Então ... foram
  rationale: O verbo hebraico está no singular antes de um sujeito composto, construção narrativa comum. Em português, a concordância plural torna explícito que os três oficiais foram até Ezequias; “Então” expressa com naturalidade a progressão narrativa do waw.
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: encarregado do palácio
  rationale: A expressão designa o alto oficial responsável pela casa ou administração real. “Palácio” comunica o contexto régio com mais clareza do que uma tradução meramente literal por “casa”.
- source_word: הַסֹּפֵר
  choice: o secretário
  rationale: Neste contexto de corte, o termo indica um oficial letrado com funções administrativas; “secretário” é atual e inteligível, sem limitar a função à cópia de textos.
- source_word: הַמַּזְכִּיר
  choice: cronista do rei
  rationale: Trata-se do título de um oficial encarregado dos registros ou memoriais da corte. “Cronista do rei” distingue sua função da do secretário e torna claro o contexto oficial.
- source_word: קְרוּעֵי בְגָדִים
  choice: com as roupas rasgadas
  rationale: Preserva a imagem concreta e o gesto cultural de profunda aflição, sem acrescentar uma interpretação ao texto.
- source_word: וַיַּגִּדוּ לוֹ
  choice: lhe transmitiram
  rationale: O verbo descreve a comunicação formal do que haviam ouvido. “Transmitiram” se ajusta ao relatório dos oficiais e continua natural em português.
- source_word: דִּבְרֵי
  choice: as palavras de
  rationale: Mantém de perto a formulação hebraica e destaca que eles reproduziram o pronunciamento do oficial assírio.
- source_word: רַב שָׁקֵה
  choice: rabsaqué
  rationale: O termo é um título oficial assírio cuja função exata não é inteiramente segura. A transliteração tradicional evita identificá-lo de modo excessivamente específico; a nota explica seu caráter titular.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas de nomes amplamente reconhecíveis. Os títulos da corte foram vertidos funcionalmente para facilitar a compreensão, enquanto “rabsaqué” foi preservado como título transliterado por causa da incerteza quanto à equivalência exata. O marcador da nota foi colocado junto ao termo que ela explica.
