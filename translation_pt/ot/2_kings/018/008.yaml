  text: הֽוּא הִכָּ֧ה אֶת פְּלִשְׁתִּ֛ים עַד עַזָּ֖ה וְ/אֶת גְּבוּלֶ֑י/הָ מִ/מִּגְדַּ֥ל נוֹצְרִ֖ים עַד עִ֥יר מִבְצָֽר־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/008.yaml
  text: He struck the Philistines as far as Gaza and its territory[b][a], from watchtower to fortified city.
translation:
  language: pt
  text: Ele derrotou os filisteus até Gaza e seu território[b], desde a torre de vigia até a cidade fortificada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “desde a torre de vigia até a cidade fortificada”, expressão que abrange desde o menor posto avançado até o maior povoado protegido.
    reason: cultural_note
  - marker: b
    text: Ou “e suas fronteiras”. A palavra hebraica pode indicar tanto os limites quanto o território pertencente a uma cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: Ele
  rationale: Mantém o pronome explícito do hebraico, que destaca Ezequias como sujeito em continuidade com o contexto.
- source_word: הִכָּה
  choice: derrotou
  rationale: No contexto de uma campanha militar, נכה pode indicar golpear e, por extensão, derrotar. “Derrotou” comunica naturalmente o resultado da ação em português.
- source_word: פְּלִשְׁתִּים
  choice: os filisteus
  rationale: Designação étnica consagrada em português.
- source_word: עַד עַזָּה
  choice: até Gaza
  rationale: עַד assinala o limite ou alcance territorial da campanha.
- source_word: וְאֶת גְּבוּלֶיהָ
  choice: e seu território
  rationale: גְּבוּל pode designar tanto fronteira quanto território. Neste contexto, provavelmente indica a região pertencente a Gaza, sem excluir a alternativa lexical “fronteiras”.
- source_word: מִמִּגְדַּל נוֹצְרִים
  choice: desde a torre de vigia
  rationale: Expressa literalmente uma torre usada por sentinelas e constitui o primeiro polo da fórmula que abrange assentamentos de todos os tamanhos.
- source_word: עַד עִיר מִבְצָר
  choice: até a cidade fortificada
  rationale: Tradução natural de עִיר מִבְצָר e segundo polo da expressão abrangente, em contraste com a torre de vigia.
