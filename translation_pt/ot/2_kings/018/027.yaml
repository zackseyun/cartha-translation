translation_notes:
  register: Português atual, claro e digno, com legibilidade brasileira. O discurso mantém a brutalidade intencional da provocação assíria. Conserva-se a mudança do singular (“seu senhor”, “você”) para o plural (“vocês”) presente no hebraico.
