  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם רַב שָׁקֵ֗ה הַ/עַ֨ל אֲדֹנֶ֤י/ךָ וְ/אֵלֶ֨י/ךָ֙ שְׁלָחַ֣/נִי אֲדֹנִ֔/י לְ/דַבֵּ֖ר אֶת הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה הֲ/לֹ֣א עַל הָ/אֲנָשִׁ֗ים הַ/יֹּֽשְׁבִים֙ עַל הַ֣/חֹמָ֔ה לֶ/אֱכֹ֣ל אֶת חרי/הם וְ/לִ/שְׁתּ֛וֹת אֶת שיני/הם עִמָּ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/027.yaml
  text: Then the Rabshakeh said to them[a], “Has my master sent me to speak these words only to your master and to you? Has he not also sent me to the men sitting on the wall, who will eat their own dung and drink their own urine with you?”
translation:
  language: pt
  text: 'Então, o Rabsaqué lhes disse: “Foi ao seu senhor e a você que o meu senhor me enviou para dizer estas palavras? Não foi também aos homens sentados sobre a muralha, que comerão as próprias fezes e beberão a própria urina junto com vocês?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto hebraico escrito emprega imagens grosseiras de cerco: “comer as próprias fezes e beber a própria urina”. A leitura massorética tradicional (qere) usa formas mais eufemísticas para ambas as expressões, como “comer os próprios excrementos” e “beber a água dos próprios pés”.'
    reason: Registra a diferença entre a forma escrita e a leitura tradicional sem suavizar, no texto principal, a linguagem deliberadamente brutal da provocação.
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: rabsaqué
  rationale: Mantém a transliteração portuguesa tradicional do título assírio, que nesta narrativa funciona quase como designação pessoal do porta-voz, sem definir de modo excessivamente específico o cargo.
- source_word: הַעַל אֲדֹנֶיךָ וְאֵלֶיךָ שְׁלָחַנִי אֲדֹנִי
  choice: Foi ao seu senhor e a você que o meu senhor me enviou
  rationale: A construção interrogativa introduz uma pergunta retórica. A formulação portuguesa preserva o contraste sem inserir explicitamente “somente”, ausente do hebraico, e mantém o singular de אֲדֹנֶיךָ e אֵלֶיךָ.
- source_word: לְדַבֵּר אֶת הַדְּבָרִים הָאֵלֶּה
  choice: para dizer estas palavras
  rationale: Expressão natural e digna em português que conserva a referência concreta a “estas palavras”.
- source_word: הֲלֹא עַל הָאֲנָשִׁים הַיֹּשְׁבִים עַל הַחֹמָה
  choice: Não foi também aos homens sentados sobre a muralha
  rationale: “Não foi também” reproduz a força retórica de הֲלֹא e explicita apenas o contraste contextual entre os oficiais e os defensores, enquanto “sobre a muralha” representa de perto עַל הַחֹמָה.
- source_word: לֶאֱכֹל אֶת חרי/הם וְלִשְׁתּוֹת אֶת שיני/הם
  choice: que comerão as próprias fezes e beberão a própria urina
  rationale: Os infinitivos descrevem a consequência futura e terrível do cerco. A tradução direta preserva deliberadamente a crueza insultuosa da fala; “próprias” torna natural em português o possessivo reflexivo do contexto.
- source_word: עִמָּכֶם
  choice: junto com vocês
  rationale: Preserva o plural hebraico e deixa claro que os interlocutores sofreriam o mesmo destino que os homens na muralha.
