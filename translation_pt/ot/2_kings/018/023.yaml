  text: וְ/עַתָּה֙ הִתְעָ֣רֶב נָ֔א אֶת אֲדֹנִ֖/י אֶת מֶ֣לֶךְ אַשּׁ֑וּר וְ/אֶתְּנָ֤ה לְ/ךָ֙ אַלְפַּ֣יִם סוּסִ֔ים אִם תּוּכַ֕ל לָ֥/תֶת לְ/ךָ֖ רֹכְבִ֥ים עֲלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/023.yaml
  text: Now then[a], please make a wager with my master, the king of Assyria, and I will give you two thousand horses, if you are able to provide riders for them.
translation:
  language: pt
  text: 'Agora, por favor, faça uma aposta[a] com o meu senhor, o rei da Assíria: eu lhe darei dois mil cavalos, se você conseguir arranjar homens para montá-los.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “assuma um compromisso” ou “faça um acordo”. O verbo hebraico pode indicar celebrar um acordo ou empenhar-se como garantia, mas aqui provavelmente tem o sentido de uma aposta ou de um desafio em tom de zombaria.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעָרֶב
  choice: faça uma aposta
  rationale: Neste contexto de provocação, o hitpael de ערב sugere uma aposta ou desafio, não apenas um acordo amistoso. A expressão conserva o tom de escárnio ligado à condição de conseguir cavaleiros.
- source_word: נָא
  choice: faça
  rationale: A partícula suaviza formalmente o imperativo, mas, no contexto de zombaria, uma tradução explícita por “por favor” soaria cortês demais em português. O imperativo mantém a força retórica natural.
- source_word: אֶת אֲדֹנִי
  choice: com o meu senhor
  rationale: Depois de התערב, אֶת tem sentido relacional, “com”. אֲדֹנִי designa o superior humano do porta-voz; “meu senhor” é a forma digna e contextual em português.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: o rei da Assíria
  rationale: Tradução direta e corrente da construção nominal hebraica.
- source_word: וְאֶתְּנָה לְךָ
  choice: eu lhe darei
  rationale: A forma expressa a oferta feita pelo emissário em nome de seu senhor. O futuro comunica naturalmente a proposta condicionada.
- source_word: אַלְפַּיִם סוּסִים
  choice: dois mil cavalos
  rationale: Equivalência numérica e lexical direta.
- source_word: אִם תּוּכַל
  choice: se você conseguir
  rationale: Expressa capacidade dentro de uma condição provocativa; “conseguir” soa natural e preserva a insinuação de incapacidade.
- source_word: לָתֶת לְךָ רֹכְבִים עֲלֵיהֶם
  choice: arranjar cavaleiros para montá-los
  rationale: O hebraico diz literalmente dar para si cavaleiros sobre eles. A formulação portuguesa explicita de modo idiomático a falta de pessoal apto a montar os cavalos, sem alterar o sentido.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O tratamento por “você” torna explícito o singular hebraico e combina com a fala direta e provocativa. A pontuação com dois-pontos liga a aposta à oferta que a define.
