revisions:
- from: 'Agora, então, faça uma aposta[a] com o meu senhor, o rei da Assíria: eu lhe darei dois mil cavalos, se você conseguir arranjar cavaleiros para montá-los.'
  to: 'Agora, por favor, faça uma aposta[a] com o meu senhor, o rei da Assíria: eu lhe darei dois mil cavalos, se você conseguir arranjar homens para montá-los.'
  rationale: A revisão restaura a nuance de נא por meio de «por favor», entendido no contexto como fórmula retórica que intensifica a provocação, não como polidez sincera. Também substitui «cavaleiros» por «homens» para transmitir de modo inequívoco que se trata de pessoas capazes de montar os cavalos, sem acrescentar uma conotação social ou militar posterior.
  reviewer_model: gpt-5.6-terra
