  text: בַּ/יהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל בָּטָ֑ח וְ/אַחֲרָ֞י/ו לֹא הָיָ֣ה כָמֹ֗/הוּ בְּ/כֹל֙ מַלְכֵ֣י יְהוּדָ֔ה וַ/אֲשֶׁ֥ר הָי֖וּ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/005.yaml
  text: He trusted in Yahweh[a], the God of Israel. After him there was none like him among all the kings of Judah, nor among those who were before him.
translation:
  language: pt
  text: Ele confiou em Yahweh, o Deus de Israel. Depois dele, não houve ninguém como ele entre todos os reis de Judá, nem entre os que vieram antes dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיהוָה
  choice: em Yahweh
  rationale: A preposição בְּ marca o objeto da confiança, e o nome divino יהוה é transliterado como “Yahweh”.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: A cadeia construta identifica Yahweh, em aposição, como o Deus de Israel.
- source_word: בָּטָח
  choice: confiou
  rationale: O qal perfeito de בטח significa confiar ou apoiar-se em alguém; “confiou” preserva de modo natural a força verbal.
- source_word: וְאַחֲרָיו לֹא הָיָה כָמֹהוּ
  choice: Depois dele, não houve ninguém como ele
  rationale: A expressão temporal e a comparação hebraica afirmam a singularidade de Ezequias entre seus sucessores.
- source_word: בְּכֹל מַלְכֵי יְהוּדָה
  choice: entre todos os reis de Judá
  rationale: A preposição בְּ situa a comparação dentro do grupo dos reis de Judá; “entre” é idiomático em português.
- source_word: וַאֲשֶׁר הָיוּ לְפָנָיו
  choice: nem entre os que o precederam
  rationale: A oração relativa amplia a comparação aos reis anteriores; “o precederam” comunica com clareza a relação temporal.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome divino e evita substituí-lo por um título.
- issue: Alcance da afirmação de incomparabilidade
  choice: entre todos os reis de Judá, tanto posteriores quanto anteriores
  alternative: incomparabilidade absoluta, sem limitação ao reino de Judá
  rationale: A própria formulação do versículo limita explicitamente a comparação aos reis de Judá e a organiza em relação aos que vieram depois e antes de Ezequias.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe fluente e próxima da estrutura hebraica. O nome Yahweh é mantido no corpo do texto; não há necessidade de nota textual neste versículo.
