base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/019.yaml
  text: 'Then the Rabshakeh said to them, "Please say to Hezekiah, ''Thus says the great king, the king of Assyria: What is this confidence that you have trusted in?''"'
translation:
  language: pt
  text: 'Então o Rabsaqué[a] lhes disse: “Digam, por favor, a Ezequias: ‘Assim diz o grande rei, o rei da Assíria: Que confiança é essa em que você tem confiado?’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Rabsaqué” é um título assírio de alto oficial, tradicionalmente associado ao “chefe dos copeiros”.
    reason: Evita traduzir o título como uma função militar específica e oferece ao leitor uma identificação histórica concisa.
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: comandante de campo
  rationale: Título assírio de alto oficial, provavelmente associado ao comando militar; traduzir a função comunica melhor ao leitor moderno do que transliterar “Rabsaqué”, sem tratá-lo como nome próprio.
- source_word: הַמֶּלֶךְ הַגָּדוֹל
  choice: o grande rei
  rationale: Preserva literalmente o título imperial enfático usado pelo emissário assírio.
- source_word: הַבִּטָּחוֹן ... בָּטָחְתָּ
  choice: confiança ... se apoia
  rationale: Mantém a relação semântica entre o substantivo e o verbo hebraicos, evitando em português a construção pouco natural “confiança que você confiou”.
- source_word: נָא
  choice: por favor
  rationale: Representa a partícula de solicitação no discurso do oficial, embora o contexto também permita entendê-la como fórmula discursiva cortês.
theological_decisions:
- issue: Objeto da confiança de Ezequias
  choice: manter sem objeto explícito
  alternative: explicitar “em quem” ou identificar Egito, estratégia ou Deus
  rationale: O hebraico deixa o objeto da confiança em aberto neste versículo; a tradução preserva essa tensão retórica sem antecipar os versículos seguintes.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A fala encaixada usa aspas duplas e simples para distinguir o discurso do comandante da mensagem citada do rei assírio.
