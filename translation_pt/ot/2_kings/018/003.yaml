  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה דָּוִ֥ד אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/003.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that David his father had done.
translation:
  language: pt
  text: Ele fez o que era certo aos olhos de Yahweh, conforme tudo o que Davi, seu pai, havia feito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “pai” significa antepassado na linhagem davídica, não pai imediato.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ele fez
  rationale: O wayyiqtol de עשה dá continuidade à narrativa. Em português atual, o conectivo hebraico pode ficar implícito sem perda de sentido.
- source_word: הַיָּשָׁר
  choice: o que era certo
  rationale: O adjetivo definido funciona substantivamente, indicando aquilo que é reto ou correto; esta formulação é natural e preserva a avaliação moral.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Mantém de modo claro e idiomático a expressão hebraica que indica a avaliação segundo a perspectiva de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כְּכֹל אֲשֶׁר
  choice: conforme tudo o que
  rationale: Expressa a conformidade completa com o padrão mencionado, preservando a força de כְּ mais כֹּל e אֲשֶׁר.
- source_word: עָשָׂה
  choice: havia feito
  rationale: O mais-que-perfeito deixa claro, em português, que as ações de Davi precederam e serviram de padrão para as ações do rei.
- source_word: דָּוִד אָבִיו
  choice: Davi, seu pai
  rationale: Preserva a fórmula dinástica e o termo literal 'pai'; as vírgulas tornam natural a ordem hebraica em português, e a nota esclarece seu sentido ancestral.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome divino, não um título. A transliteração preserva essa distinção.
- issue: Sentido de אָבִיו na fórmula davídica
  choice: Manter 'Davi, seu pai' no texto e explicar em nota
  alternative: Davi, seu antepassado
  rationale: A formulação literal preserva tanto o vínculo dinástico quanto a apresentação de Davi como modelo, sem sugerir que ele fosse o pai imediato.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva o idioma hebraico 'aos olhos de' e a fórmula dinástica 'Davi, seu pai', esclarecida por nota.
