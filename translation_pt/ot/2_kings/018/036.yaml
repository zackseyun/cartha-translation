  yaml_path: translation/ot/2_kings/018/036.yaml
  text: But the people kept silent and did not answer him a word[a], for the king’s command was, “Do not answer him.”
translation:
  language: pt
  text: 'Mas o povo permaneceu calado e não lhe respondeu palavra alguma[a], pois a ordem do rei era: “Não lhe respondam.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “não lhe respondeu palavra”, expressão que significa que não lhe deu resposta alguma.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶחֱרִישׁוּ
  choice: permaneceu calado
  rationale: O hifil de חרשׁ indica aqui manter-se em silêncio. A construção com o coletivo singular “o povo” é natural em português e comunica a continuidade da atitude.
- source_word: הָעָם
  choice: o povo
  rationale: עם designa o povo judeu que ouvia o discurso; “o povo” é preciso e não acrescenta uma localização ausente do hebraico.
- source_word: וְלֹא עָנוּ אֹתוֹ דָבָר
  choice: e não lhe respondeu palavra alguma
  rationale: Preserva de modo idiomático e claro a expressão hebraica com דָבָר, enfatizando que não houve resposta alguma.
- source_word: כִּי
  choice: pois
  rationale: A conjunção introduz a razão do silêncio; “pois” mantém com naturalidade seu valor causal no fluxo narrativo.
- source_word: מִצְוַת הַמֶּלֶךְ
  choice: a ordem do rei
  rationale: מִצְוָה significa mandamento, ordem ou determinação. No contexto de uma instrução régia, “ordem” é atual, natural e expressa a autoridade formal.
- source_word: הִיא לֵאמֹר
  choice: 'era:'
  rationale: O pronome seguido do infinitivo de אמר introduz o conteúdo citado. Em português, “era:” apresenta diretamente a ordem sem reproduzir o hebraísmo “dizendo”.
- source_word: לֹא תַעֲנֻהוּ
  choice: Não lhe respondam
  rationale: A forma verbal está na segunda pessoa masculina plural e expressa uma proibição dirigida ao grupo; o plural de “respondam” preserva essa informação.
