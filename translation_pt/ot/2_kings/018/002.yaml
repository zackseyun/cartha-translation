base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/002.yaml
  text: He was twenty-five years old when he began to reign, and he reigned twenty-nine years in Jerusalem. His mother’s name was Abi daughter of Zechariah.
translation:
  language: pt
  text: Ele tinha vinte e cinco anos quando começou a reinar e reinou vinte e nove anos em Jerusalém. O nome de sua mãe era Abi, filha de Zacarias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: tinha vinte e cinco anos
  rationale: Expressa em português natural o idiomatismo hebraico usado para indicar a idade.
- source_word: הָיָה בְמָלְכוֹ
  choice: quando começou a reinar
  rationale: A construção assinala a idade do rei no início de seu reinado; esta formulação preserva o sentido temporal em português corrente.
- source_word: מָלַךְ
  choice: reinou
  rationale: O verbo denota o exercício da realeza e é traduzido pelo equivalente direto e convencional em português.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: Uso locativo direto, indicando a sede do reinado.
- source_word: וְשֵׁם אִמּוֹ
  choice: O nome de sua mãe era
  rationale: Reproduz com naturalidade e dignidade a fórmula hebraica que apresenta o nome da mãe do rei.
- source_word: אֲבִי
  choice: Abi
  rationale: Transliteração simples do nome pessoal hebraico, distinguindo-o da forma mais longa Abias encontrada no paralelo de 2 Crônicas 29:1.
- source_word: בַּת זְכַרְיָה
  choice: filha de Zacarias
  rationale: Traduz diretamente a relação de parentesco expressa pela construção hebraica.
