  text: וְ/אֵ֣יךְ תָּשִׁ֗יב אֵ֠ת פְּנֵ֨י פַחַ֥ת אַחַ֛ד עַבְדֵ֥י אֲדֹנִ֖/י הַ/קְּטַנִּ֑ים וַ/תִּבְטַ֤ח לְ/ךָ֙ עַל מִצְרַ֔יִם לְ/רֶ֖כֶב וּ/לְ/פָרָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/024.yaml
  text: How then can you turn back the face of a single captain among the least of my master's servants[b][a], when you trust in Egypt for chariots and horsemen?
translation:
  language: pt
  text: Como, então, você poderia repelir até mesmo um único oficial dentre os servos menos importantes do meu senhor[a], se confia no Egito para obter carros de guerra e cavaleiros?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “governadores” ou “comandantes”; o termo hebraico pode designar um governante provincial ou um oficial militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵיךְ תָּשִׁיב אֵת פְּנֵי
  choice: Como, então, você poderia repelir
  rationale: A construção idiomática hebraica significa fazer alguém recuar, resistir-lhe ou repeli-lo. A tradução explicita naturalmente o sentido militar em português.
- source_word: פַחַת אַחַד
  choice: até mesmo um só dos oficiais
  rationale: פַחַת pode designar governador, autoridade ou oficial. No contexto militar, “oficial” é amplo e natural; “até mesmo um só” preserva a força depreciativa da pergunta retórica.
- source_word: עַבְדֵי אֲדֹנִי הַקְּטַנִּים
  choice: dos oficiais menos importantes entre os servos do meu senhor
  rationale: הַקְּטַנִּים indica posição inferior, não tamanho físico. “Meu senhor” representa o sufixo de primeira pessoa e aqui se refere ao superior assírio, sem conotação divina.
- source_word: וַתִּבְטַח לְךָ עַל מִצְרַיִם
  choice: se confia no Egito
  rationale: בטח על significa confiar em ou depender de. A conjunção foi vertida como “se” para expressar a circunstância que sustenta a provocação retórica.
- source_word: לְרֶכֶב וּלְפָרָשִׁים
  choice: para obter carros de guerra e cavaleiros
  rationale: As preposições indicam os recursos militares esperados do Egito. “Carros de guerra” evita a possível leitura moderna de veículos comuns, e “cavaleiros” representa tropas montadas.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A segunda pessoa singular foi expressa por “você”, e a imagem idiomática hebraica foi comunicada por seu sentido militar direto.
