base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/030.yaml
  text: And do not let Hezekiah make you trust in Yahweh[a], saying, ‘Yahweh will surely deliver us, and this city will not be given into the hand of the king of Assyria.’
translation:
  language: pt
  text: 'E não deixem que Ezequias os faça confiar em Yahweh, dizendo: “Yahweh certamente nos livrará, e esta cidade não será entregue na mão do rei da Assíria.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַל יַבְטַח אֶתְכֶם
  choice: E não deixem que Ezequias os faça confiar
  rationale: O hifil de בטח com objeto tem sentido causativo. A formulação preserva esse valor sem reduzir a frase a um simples “não confiem”.
- source_word: אֶל יְהוָה
  choice: em Yahweh
  rationale: Com o verbo “confiar”, a preposição אֶל é expressa naturalmente em português por “em”; o nome divino é transliterado como Yahweh.
- source_word: הַצֵּל יַצִּילֵנוּ
  choice: certamente nos livrará
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a afirmação. “Certamente” comunica essa ênfase de modo natural.
- source_word: וְלֹא תִנָּתֵן
  choice: não será entregue
  rationale: O passivo de נתן indica que a cidade seria entregue ao domínio inimigo; a tradução mantém a voz passiva do hebraico.
- source_word: בְּיַד מֶלֶךְ אַשּׁוּר
  choice: nas mãos do rei da Assíria
  rationale: “Nas mãos de” preserva a imagem idiomática hebraica de poder ou controle e soa natural em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A fala mantém o tom enfático e desafiador do discurso assírio, sem acrescentar interpretação denominacional.
