  yaml_path: translation/ot/2_kings/018/013.yaml
  text: In the fourteenth year of King Hezekiah, Sennacherib king of Assyria came up against all the fortified cities of Judah and captured them.
translation:
  language: pt
  text: No décimo quarto ano do rei Ezequias, Senaqueribe, rei da Assíria, avançou contra todas as cidades fortificadas de Judá e as conquistou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְאַרְבַּע עֶשְׂרֵה שָׁנָה
  choice: No décimo quarto ano
  rationale: A expressão temporal introduz o ano de reinado. O וּ inicial funciona como ligação narrativa e não exige um “e” explícito em português neste versículo.
- source_word: לַמֶּלֶךְ חִזְקִיָּה
  choice: do rei Ezequias
  rationale: Forma natural em português para a fórmula de datação segundo o ano de reinado.
- source_word: עָלָה ... עַל
  choice: avançou contra
  rationale: Embora עָלָה signifique literalmente “subir”, em contexto militar com עַל indica avançar ou marchar contra um alvo; “avançou contra” comunica o sentido com clareza e dignidade.
- source_word: סַנְחֵרִיב
  choice: Senaqueribe
  rationale: Forma tradicional e amplamente reconhecida do nome do rei assírio em português.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: rei da Assíria
  rationale: Reproduz naturalmente a cadeia construta que identifica o cargo e o reino de Senaqueribe.
- source_word: עַל כָּל עָרֵי יְהוּדָה הַבְּצֻרוֹת
  choice: contra todas as cidades fortificadas de Judá
  rationale: “Cidades fortificadas” expressa com precisão o sentido militar de הַבְּצֻרוֹת.
- source_word: וַיִּתְפְּשֵׂם
  choice: e as conquistou
  rationale: O verbo descreve a tomada das cidades em campanha militar; o pronome feminino plural “as” retoma claramente “cidades”.
