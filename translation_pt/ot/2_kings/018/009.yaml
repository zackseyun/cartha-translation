  text: וַֽ/יְהִ֞י בַּ/שָּׁנָ֤ה הָֽ/רְבִיעִית֙ לַ/מֶּ֣לֶךְ חִזְקִיָּ֔הוּ הִ֚יא הַ/שָּׁנָ֣ה הַ/שְּׁבִיעִ֔ית לְ/הוֹשֵׁ֥עַ בֶּן אֵלָ֖ה מֶ֣לֶךְ יִשְׂרָאֵ֑ל עָלָ֞ה שַׁלְמַנְאֶ֧סֶר מֶֽלֶךְ אַשּׁ֛וּר עַל שֹׁמְר֖וֹן וַ/יָּ֥צַר עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/009.yaml
  text: And it happened in the fourth year of King Hezekiah—which was the seventh year of Hoshea son of Elah[b][a], king of Israel—that Shalmaneser king of Assyria came up against Samaria and besieged it.
translation:
  language: pt
  text: Aconteceu[a] que, no quarto ano do rei Ezequias — que correspondia ao sétimo ano de Oseias, filho de Elá, rei de Israel —, Salmaneser, rei da Assíria, marchou contra Samaria[b] e a sitiou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Sucedeu».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, de forma mais literal: «subiu contra Samaria e a cercou».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Aconteceu que
  rationale: Fórmula narrativa que introduz o acontecimento histórico; preserva sua função discursiva em português atual sem recorrer ao mais arcaico «sucedeu».
- source_word: בַּשָּׁנָה הָרְבִיעִית
  choice: no quarto ano
  rationale: Forma portuguesa natural para a datação segundo anos de reinado.
- source_word: לַמֶּלֶךְ חִזְקִיָּהוּ
  choice: do rei Ezequias
  rationale: O לְ indica a referência ao ano de reinado; «do rei Ezequias» expressa isso com clareza e naturalidade.
- source_word: הִיא
  choice: que correspondia ao
  rationale: O pronome retoma a data anterior e sincroniza os dois reinados. «Correspondia ao» torna essa relação temporal clara sem alterar o sentido.
- source_word: הַשָּׁנָה הַשְּׁבִיעִית לְהוֹשֵׁעַ בֶּן אֵלָה מֶלֶךְ יִשְׂרָאֵל
  choice: ao sétimo ano de Oseias, filho de Elá, rei de Israel
  rationale: Mantém integralmente o segundo sincronismo régio e a identificação de Oseias.
- source_word: עָלָה
  choice: marchou contra
  rationale: Em contexto militar, עלה descreve o avanço de uma campanha contra uma cidade. «Marchou contra» comunica naturalmente essa força, enquanto a alternativa mais formal «subiu contra» fica registrada em nota.
- source_word: שַׁלְמַנְאֶסֶר
  choice: Salmaneser
  rationale: Forma tradicional e amplamente reconhecida do nome do rei assírio em português.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: rei da Assíria
  rationale: Reproduz de modo idiomático a cadeia construta que identifica o título e o domínio de Salmaneser.
- source_word: עַל שֹׁמְרוֹן
  choice: contra Samaria
  rationale: Com o verbo militar, עַל assinala o alvo hostil do avanço.
- source_word: וַיָּצַר עָלֶיהָ
  choice: e a sitiou
  rationale: O verbo צור neste contexto designa o cerco militar de uma cidade; «sitiou» é conciso e exato.
