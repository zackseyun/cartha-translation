base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/035.yaml
  text: Who among all the gods of the lands has delivered their land from my hand[a], that Yahweh should deliver Jerusalem from my hand?
translation:
  language: pt
  text: Quem, entre todos os deuses das terras, livrou a terra deles da minha mão, para que Yahweh livre Jerusalém da minha mão?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי בְּכָל אֱלֹהֵי הָאֲרָצוֹת
  choice: Quem, entre todos os deuses dessas terras
  rationale: A construção interrogativa e partitiva é expressa naturalmente por “quem, entre”. O plural אֲרָצוֹת refere-se às diversas terras ou nações mencionadas no contexto.
- source_word: הִצִּילוּ
  choice: livrou
  rationale: A forma de נצל denota livrar ou resgatar, aqui em contexto militar. O singular concorda naturalmente com o interrogativo distributivo “quem”.
- source_word: אֶת אַרְצָם
  choice: a terra deles
  rationale: Preserva o sufixo masculino plural hebraico e sua referência distributiva aos deuses e às terras que lhes eram associadas, sem impor o singular “sua terra”.
- source_word: מִיָּדִי
  choice: da minha mão
  rationale: Mantém a metáfora hebraica transparente de mão como poder ou domínio.
- source_word: כִּי יַצִּיל
  choice: para que ... livre
  rationale: No desafio retórico, כִּי liga a alegada incapacidade dos outros deuses à pretensão de que Yahweh pudesse livrar Jerusalém. A formulação portuguesa conserva o tom de escárnio sem transformar o imperfeito em afirmação neutra de futuro.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalém
  rationale: Forma portuguesa consagrada do topônimo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz diretamente o tetragrama. “Yahweh” preserva o caráter de nome pessoal; “SENHOR” seria a substituição tradicional por um título.
- issue: Força do desafio retórico em כִּי יַצִּיל
  choice: para que Yahweh livre
  alternative: para que Yahweh livrará / de modo que Yahweh há de livrar
  rationale: A escolha mantém a afirmação como provocação retórica do emissário assírio, sem endossar sua teologia nem reduzir a forma verbal a uma simples previsão futura.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição de “da minha mão” foi mantida por sua força retórica e correspondência com o hebraico.
