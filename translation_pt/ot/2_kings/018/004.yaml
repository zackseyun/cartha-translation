source:
  edition: WLC
  text: ה֣וּא הֵסִ֣יר אֶת הַ/בָּמ֗וֹת וְ/שִׁבַּר֙ אֶת הַ/מַּצֵּבֹ֔ת וְ/כָרַ֖ת אֶת הָֽ/אֲשֵׁרָ֑ה וְ/כִתַּת֩ נְחַ֨שׁ הַ/נְּחֹ֜שֶׁת אֲשֶׁר עָשָׂ֣ה מֹשֶׁ֗ה כִּ֣י עַד הַ/יָּמִ֤ים הָ/הֵ֨מָּה֙ הָי֤וּ בְנֵֽי יִשְׂרָאֵל֙ מְקַטְּרִ֣ים ל֔/וֹ וַ/יִּקְרָא ל֖/וֹ נְחֻשְׁתָּֽן׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/004.yaml
  text: He removed the high places[a], shattered the pillars, cut down the Asherah, and crushed to pieces the bronze serpent that Moses had made, because until those days the sons of Israel had been burning incense to it[c][b]; and it was called Nehushtan.
translation:
  language: pt
  text: Ele removeu os lugares altos, despedaçou as colunas sagradas, cortou a Aserá[a] e reduziu a pedaços a serpente de bronze que Moisés havia feito, pois, até aqueles dias, os filhos de Israel queimavam incenso para ela. E ela foi chamada Neustã[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cortou o poste de Aserá” ou “cortou o poste sagrado”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ele a chamou Neustã”, entendendo que Ezequias é o sujeito.'
    reason: alternative_reading
  - marker: c
    text: Neustã provavelmente contém um jogo de palavras com o termo hebraico para “bronze” e pode sugerir algo como “um simples pedaço de bronze”.
    reason: cultural_note
lexical_decisions:
- source_word: הֵסִיר
  choice: removeu
  rationale: Verbo corrente e direto para retirar ou eliminar, adequado ao contexto das reformas de Ezequias.
- source_word: הַבָּמוֹת
  choice: os lugares altos
  rationale: Expressão tradicional e ainda compreensível para os santuários locais associados ao culto.
- source_word: שִׁבַּר אֶת הַמַּצֵּבֹת
  choice: despedaçou as colunas sagradas
  rationale: O verbo indica destruição enérgica, e o adjetivo explicita que se trata de pedras ou colunas de função cultual.
- source_word: כָרַת אֶת הָאֲשֵׁרָה
  choice: cortou a Aserá
  rationale: Mantém transliterado o referente religioso antigo e preserva sua amplitude lexical; o verbo mostra que, neste contexto, se trata de um objeto cultual físico.
- source_word: כִתַּת
  choice: reduziu a pedaços
  rationale: Comunica uma destruição completa, mais forte do que simplesmente 'quebrou'.
- source_word: נְחַשׁ הַנְּחֹשֶׁת
  choice: a serpente de bronze
  rationale: Tradução natural da construção hebraica e coerente com o antecedente do Pentateuco.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão familiar coletiva do hebraico sem neutralizá-la.
- source_word: מְקַטְּרִים לוֹ
  choice: queimavam incenso diante dela
  rationale: Expressa claramente a atividade cultual. 'Diante dela' evita uma formulação portuguesa menos natural sem ocultar que a serpente era o objeto dessa prática.
- source_word: וַיִּקְרָא לוֹ נְחֻשְׁתָּן
  choice: E ela foi chamada Neustã
  rationale: A passiva preserva a falta de explicitação inequívoca do agente no hebraico, e o pronome feminino retoma naturalmente 'serpente' em português.
theological_decisions:
- issue: Sentido de אֲשֵׁרָה
  choice: a Aserá
  alternative: o poste de Aserá; o poste sagrado
  rationale: A transliteração evita reduzir prematuramente o termo ao nome da deusa ou a um tipo específico de objeto, embora o ato de cortá-lo indique aqui um objeto cultual.
- issue: Sujeito de וַיִּקְרָא לוֹ נְחֻשְׁתָּן
  choice: 'formulação passiva: ''ela foi chamada Neustã'''
  alternative: '''ele a chamou Neustã'', tomando Ezequias como sujeito'
  rationale: A formulação passiva conserva a ambiguidade quanto a quem atribuiu o nome, sem impor que tenha sido Ezequias.
- issue: Natureza do culto prestado à serpente
  choice: queimavam incenso diante dela
  alternative: ofereciam incenso a ela
  rationale: A tradução identifica a ação cultual sem ampliar o texto para uma caracterização doutrinária não explicitada no versículo.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. Foram mantidos termos bíblicos reconhecíveis, como “lugares altos” e “filhos de Israel”, enquanto “colunas sagradas” explicita o caráter cultual das pedras erigidas. A pontuação separa a declaração final sobre o nome para favorecer clareza sem alterar a sequência do hebraico.
