  naturalness: O português é atual, claro e de registro bíblico apropriado. «Lugares altos», «colunas sagradas», «Aserá» e «serpente de bronze» são escolhas compreensíveis. A pequena alteração proposta torna explícita, de modo natural, a relação expressa pelo pronome hebraico.
