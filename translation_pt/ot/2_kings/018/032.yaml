source:
  edition: WLC
  text: עַד בֹּאִ/י֩ וְ/לָקַחְתִּ֨י אֶתְ/כֶ֜ם אֶל אֶ֣רֶץ כְּ/אַרְצְ/כֶ֗ם אֶרֶץ֩ דָּגָ֨ן וְ/תִיר֜וֹשׁ אֶ֧רֶץ לֶ֣חֶם וּ/כְרָמִ֗ים אֶ֣רֶץ זֵ֤ית יִצְהָר֙ וּ/דְבַ֔שׁ וִֽ/חְי֖וּ וְ/לֹ֣א תָמֻ֑תוּ וְ/אַֽל תִּשְׁמְעוּ֙ אֶל חִזְקִיָּ֔הוּ כִּֽי יַסִּ֤ית אֶתְ/כֶם֙ לֵ/אמֹ֔ר יְהוָ֖ה יַצִּילֵֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/032.yaml
  text: until I come and take you away to a land like your own land[a], a land of grain and new wine, a land of bread and vineyards, a land of olive oil and honey, so that you may live and not die. And do not listen to Hezekiah, for he is misleading you by saying[b], ‘Yahweh will deliver us.’
translation:
  language: pt
  text: 'até que eu venha e leve vocês para uma terra semelhante à terra de vocês: terra de cereal e vinho novo[a], terra de pão e vinhas, terra de azeite de oliva e mel[b], para que vocês vivam e não morram. Não deem ouvidos a Ezequias, pois ele os está induzindo ao erro quando diz: ‘Yahweh nos livrará’.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vinho”. O termo hebraico תִּירוֹשׁ costuma designar vinho novo ou fresco.
    reason: lexical_alternative
  - marker: b
    text: O hebraico usa uma expressão condensada que associa oliveira/oliva e azeite; “azeite de oliva” expressa seu sentido em português.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד בֹּאִי
  choice: até que eu venha
  rationale: Mantém a ideia temporal de um ponto futuro e liga naturalmente o versículo à exortação iniciada no contexto anterior.
- source_word: וְלָקַחְתִּי אֶתְכֶם
  choice: e leve vocês
  rationale: לקח significa tomar ou levar; no contexto, refere-se à transferência forçada da população, sem ser necessário explicitar além do hebraico que se trata de deportação.
- source_word: אֶל אֶרֶץ כְּאַרְצְכֶם
  choice: para uma terra semelhante à terra de vocês
  rationale: Preserva a comparação marcada por כְּ e o apelo propagandístico de que o destino seria comparável à terra de Judá.
- source_word: אֶרֶץ דָּגָן וְתִירוֹשׁ
  choice: terra de cereal e vinho novo
  rationale: דָּגָן designa cereais ou grãos em sentido amplo; תִּירוֹשׁ se refere especialmente ao vinho novo, embora também possa ser traduzido simplesmente como vinho.
- source_word: אֶרֶץ לֶחֶם וּכְרָמִים
  choice: terra de pão e vinhas
  rationale: 'Conserva as imagens concretas do hebraico: alimento produzido e abundância agrícola.'
- source_word: אֶרֶץ זֵית יִצְהָר וּדְבַשׁ
  choice: terra de azeite de oliva e mel
  rationale: A expressão hebraica é condensada e associa a oliveira ao óleo que ela produz; a formulação portuguesa comunica o sentido sem acrescentar três produtos distintos.
- source_word: וִחְיוּ וְלֹא תָמֻתוּ
  choice: Assim vocês viverão e não morrerão
  rationale: Expressa o resultado prometido no apelo do emissário assírio e mantém o contraste enfático entre viver e morrer.
- source_word: וְאַל תִּשְׁמְעוּ אֶל חִזְקִיָּהוּ
  choice: Não deem ouvidos a Ezequias
  rationale: שׁמע אל significa escutar ou atender; 'dar ouvidos' é natural em português e inclui a ideia de seguir o conselho.
- source_word: כִּי יַסִּית אֶתְכֶם
  choice: pois ele os está induzindo ao erro
  rationale: O Hifil de סות pode indicar incitar, seduzir ou desviar. A tradução preserva a acusação do discurso sem afirmar como fato narrativo que Ezequias realmente enganava o povo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יַצִּילֵנוּ
  choice: nos livrará
  rationale: O Hifil de נצל indica livrar ou resgatar de perigo; 'livrar' se ajusta ao contexto de ameaça militar.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto hebraico traz o nome próprio divino. 'Yahweh' o representa diretamente, evitando substituí-lo por um título.
- issue: Status da acusação contra Ezequias
  choice: apresentá-la como fala do emissário assírio
  alternative: traduzir de modo que pareça uma avaliação do narrador
  rationale: A afirmação de que Ezequias induz o povo ao erro pertence à retórica assíria. A tradução preserva essa moldura e não endossa teologicamente a acusação.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas de tratamento naturais para leitores brasileiros. A repetição de “terra” preserva o ritmo persuasivo do discurso, e os marcadores [a] e [b] foram posicionados junto às expressões a que suas notas realmente se referem.
