revisions:
- from: 'Veja, você está confiando no Egito, esse bordão de cana quebrada[a]: se alguém se apoiar nele[b], ele entrará na palma da mão e a perfurará. Assim é o faraó, rei do Egito, para todos os que confiam nele.'
  to: 'Veja, você está confiando no Egito, esse cajado de cana quebrada[a]: se alguém se apoiar nele[b], ele entrará na mão dessa pessoa e a perfurará. Assim é Faraó, rei do Egito, para todos os que confiam nele.'
  rationale: A revisão explicita que a mão perfurada é a da pessoa que se apoia no cajado, conforme o sufixo possessivo hebraico, e substitui “bordão” por “cajado” para uma expressão mais natural e amplamente compreensível. As notas mantêm as alternativas lexicais pertinentes e seus marcadores continuam ancorados nos termos correspondentes.
