source:
  edition: WLC
  text: עַתָּ֡ה הִנֵּ֣ה בָטַ֣חְתָּ לְּ/ךָ֡ עַל מִשְׁעֶנֶת֩ הַ/קָּנֶ֨ה הָ/רָצ֤וּץ הַ/זֶּה֙ עַל מִצְרַ֔יִם אֲשֶׁ֨ר יִסָּמֵ֥ךְ אִישׁ֙ עָלָ֔י/ו וּ/בָ֥א בְ/כַפּ֖/וֹ וּ/נְקָבָ֑/הּ כֵּ֚ן פַּרְעֹ֣ה מֶֽלֶךְ מִצְרַ֔יִם לְ/כָֽל הַ/בֹּטְחִ֖ים עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/021.yaml
  text: Look, you are trusting in Egypt, that broken reed of a staff, which, if a man leans on it, will go into his palm and pierce it. So is Pharaoh king of Egypt to all who trust in him.
translation:
  language: pt
  text: 'Veja, você está confiando no Egito, esse cajado de cana quebrada[a]: se alguém se apoiar nele[b], ele entrará na mão dessa pessoa e a perfurará. Assim é Faraó, rei do Egito, para todos os que confiam nele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esse cajado de cana esmagada”. O adjetivo hebraico pode indicar algo esmagado, machucado ou quebrado; “quebrada” se ajusta melhor à imagem de um apoio que se parte e fere a mão.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “se um homem se apoiar nele”. O singular masculino é usado aqui em sentido genérico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָטַחְתָּ לְּךָ
  choice: você está confiando
  rationale: O perfeito de בטח expressa, nesta provocação, a confiança presente do interlocutor; a forma progressiva comunica naturalmente essa dependência atual.
- source_word: מִשְׁעֶנֶת הַקָּנֶה
  choice: bordão de cana
  rationale: מִשְׁעֶנֶת é um objeto no qual alguém se apoia. “Bordão” preserva a imagem concreta de uma cana usada como apoio e mantém tom digno em português.
- source_word: הָרָצוּץ
  choice: quebrada
  rationale: רָצוּץ pode significar esmagado, machucado ou quebrado. “Quebrada” se ajusta melhor à imagem de um apoio que se parte e fere a mão.
- source_word: עַל מִצְרַיִם
  choice: no Egito
  rationale: Após בטח, עַל marca o objeto da confiança; em português, a regência natural é “confiar em”.
- source_word: אֲשֶׁר יִסָּמֵךְ אִישׁ עָלָיו
  choice: se alguém se apoiar nele
  rationale: O nifal de סמך indica apoiar-se em busca de sustentação. A construção condicional torna explícito o sentido contextual, e “alguém” comunica naturalmente o singular genérico.
- source_word: וּבָא בְכַפּוֹ
  choice: ele entrará na palma da mão
  rationale: בוא significa entrar ou penetrar, e כַּף designa aqui a palma da mão. O pronome “ele” retoma o bordão e deixa clara a imagem.
- source_word: וּנְקָבָהּ
  choice: e a perfurará
  rationale: נקב significa perfurar ou atravessar; o pronome feminino retoma “palma” em português.
- source_word: כֵּן
  choice: Assim é
  rationale: כֵּן introduz a aplicação da comparação entre o bordão traiçoeiro e o faraó.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: o faraó, rei do Egito
  rationale: A aposição reproduz com clareza e naturalidade o título real hebraico.
- source_word: לְכָל הַבֹּטְחִים עָלָיו
  choice: para todos os que confiam nele
  rationale: 'O לְ indica relação ou efeito: isso é o que o faraó representa para os que nele depositam confiança.'
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Veja” conserva a força de הִנֵּה sem acrescentar um marcador temporal inexistente. “Bordão” mantém a metáfora concreta e evita a possível ambiguidade de “cajado de cana quebrada”.
