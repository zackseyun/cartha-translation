source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח מֶֽלֶךְ אַשּׁ֡וּר אֶת תַּרְתָּ֥ן וְ/אֶת רַב סָרִ֣יס וְ/אֶת רַב שָׁקֵ֨ה מִן לָכִ֜ישׁ אֶל הַ/מֶּ֧לֶךְ חִזְקִיָּ֛הוּ בְּ/חֵ֥יל כָּבֵ֖ד יְרוּשָׁלִָ֑ם וַֽ/יַּעֲלוּ֙ וַ/יָּבֹ֣אוּ יְרוּשָׁלִַ֔ם וַ/יַּעֲל֣וּ וַ/יָּבֹ֗אוּ וַ/יַּֽעַמְדוּ֙ בִּ/תְעָלַת֙ הַ/בְּרֵכָ֣ה הָֽ/עֶלְיוֹנָ֔ה אֲשֶׁ֕ר בִּ/מְסִלַּ֖ת שְׂדֵ֥ה כוֹבֵֽס־־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/017.yaml
  text: Then the king of Assyria sent the Tartan[a], the Rab-saris, and the Rab-shakeh from Lachish to King Hezekiah at Jerusalem with a great army. They went up and came to Jerusalem; they went up and came and stood by the conduit of the upper pool[c][b], which is on the highway of the washer’s field.
translation:
  language: pt
  text: Então o rei da Assíria enviou de Láquis o tartã, o rabe-sáris e o rabe-sáqué[a] ao rei Ezequias, em Jerusalém, com um grande exército. Eles subiram e chegaram a Jerusalém; subiram, chegaram e pararam junto ao canal do açude superior, que fica na estrada do campo do lavandeiro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tartã”, “rabe-sáris” e “rabe-sáqué” provavelmente são títulos de oficiais assírios, não nomes pessoais. Possíveis equivalentes funcionais incluem “comandante-chefe”, “chefe dos oficiais” ou “chefe dos eunucos” e “chefe dos copeiros” ou outro alto oficial.
    reason: cultural_note
  - marker: b
    text: Tradicionalmente, “campo do pisoeiro”. O termo indica o lugar associado a quem lavava, alvejava ou tratava tecidos.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּרְתָּן
  choice: o tartã
  rationale: Provável título oficial assírio, não nome pessoal. A transliteração evita definir com certeza uma função especializada cuja equivalência exata é discutida.
- source_word: רַב סָרִיס
  choice: o rabe-sáris
  rationale: Título cortesão assírio. A transliteração preserva o termo estrangeiro sem decidir se סָרִיס indica literalmente um eunuco ou, de modo mais amplo, um alto funcionário.
- source_word: רַב שָׁקֵה
  choice: o rabe-sáqué
  rationale: Título assírio cuja função exata é incerta; propostas incluem chefe dos copeiros e outro alto oficial. A transliteração mantém essa incerteza.
- source_word: בְּחֵיל כָּבֵד
  choice: com um grande exército
  rationale: Neste contexto, חַיִל designa uma força militar, e כָּבֵד indica grande peso ou magnitude. A expressão portuguesa é natural e comunica adequadamente uma numerosa força armada.
- source_word: וַיַּעֲלוּ ... וַיָּבֹאוּ יְרוּשָׁלִָם
  choice: Eles subiram e chegaram a Jerusalém
  rationale: Preserva a sequência verbal hebraica e o sentido habitual de subir em direção a Jerusalém.
- source_word: וַיַּעֲלוּ וַיָּבֹאוּ וַיַּעַמְדוּ
  choice: subiram, chegaram e pararam
  rationale: Mantém a repetição deliberada da narrativa hebraica, com verbos naturais em português.
- source_word: תְעָלַת
  choice: canal
  rationale: Designa um curso ou conduto de água ligado ao açude; 'canal' é claro e atual em português.
- source_word: הַבְּרֵכָה הָעֶלְיוֹנָה
  choice: o açude superior
  rationale: בְּרֵכָה refere-se a um tanque ou reservatório de água. 'Açude' é uma formulação bíblica compreensível e topograficamente adequada.
- source_word: מְסִלַּת
  choice: a estrada
  rationale: Indica uma via construída ou elevada. 'Estrada' é a opção mais natural e amplamente inteligível.
- source_word: שְׂדֵה כוֹבֵס
  choice: o campo do lavandeiro
  rationale: כּוֹבֵס é alguém que lava ou alveja tecidos. 'Lavandeiro' preserva a ocupação de forma mais acessível que o termo tradicional 'pisoeiro'.
theological_decisions: []
translation_notes:
