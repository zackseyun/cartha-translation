  text: וַ/יֶּ֧גֶל מֶֽלֶךְ אַשּׁ֛וּר אֶת יִשְׂרָאֵ֖ל אַשּׁ֑וּרָ/ה וַ/יַּנְחֵ֞/ם בַּ/חְלַ֧ח וּ/בְ/חָב֛וֹר נְהַ֥ר גּוֹזָ֖ן וְ/עָרֵ֥י מָדָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/011.yaml
  text: And the king of Assyria exiled Israel to Assyria and settled them in Halah[a], and on the Habor, the river of Gozan[b], and in the cities of the Medes.
translation:
  language: pt
  text: E o rei da Assíria deportou Israel para a Assíria e os estabeleceu em Hala, junto ao Habor, o rio de Gozã, e nas cidades dos medos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“Israel” aqui se refere ao reino do norte e ao seu povo levado para o exílio. Outra tradução possível para a parte central do versículo é: “e os colocou em Hala, junto ao rio Habor, em Gozã”.'
    reason: Nota cultural e alternativa lexical/geográfica; esclarece a referência coletiva de “Israel” e preserva a possível relação sintática entre Habor, rio e Gozã.
lexical_decisions:
- source_word: וַיֶּגֶל
  choice: deportou
  rationale: O hifil de גלה indica remoção forçada para o exílio; “deportou” expressa de modo claro e atual a ação política do rei assírio.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: o rei da Assíria
  rationale: Tradução natural e direta da construção hebraica.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: Preserva a referência coletiva e político-nacional ao reino do norte e, por extensão, ao seu povo.
- source_word: אַשּׁוּרָה
  choice: para a Assíria
  rationale: O sufixo direcional indica movimento em direção à Assíria.
- source_word: וַיַּנְחֵם
  choice: os estabeleceu
  rationale: No contexto da deportação, o causativo indica que os exilados foram instalados em lugares designados; “estabeleceu” é natural e mantém essa nuance.
- source_word: בַּחְלַח
  choice: em Hala
  rationale: O topônimo é transliterado em forma adequada ao português.
- source_word: וּבְחָבוֹר
  choice: junto ao Habor
  rationale: Como a expressão seguinte identifica Habor como rio, “junto ao” comunica naturalmente a localização, sem tratá-lo como cidade.
- source_word: נְהַר גּוֹזָן
  choice: o rio de Gozã
  rationale: Reproduz de modo transparente a cadeia construta e identifica Habor como o rio associado a Gozã.
- source_word: וְעָרֵי מָדָי
  choice: e nas cidades dos medos
  rationale: Tradução direta da expressão hebraica, preservando a referência ao povo medo, em vez de converter o nome em território.
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e digno, com boa legibilidade brasileira. Preferiu-se “deportou” a uma formulação tradicional como “levou cativo”, e “os estabeleceu” para comunicar a instalação forçada dos exilados. Os topônimos seguem formas portuguesas legíveis: Hala, Habor e Gozã.'
