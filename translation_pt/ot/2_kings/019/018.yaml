  text: וְ/נָתְנ֥וּ אֶת אֱלֹהֵי/הֶ֖ם בָּ/אֵ֑שׁ כִּי֩ לֹ֨א אֱלֹהִ֜ים הֵ֗מָּה כִּ֣י אִם מַעֲשֵׂ֧ה יְדֵֽי אָדָ֛ם עֵ֥ץ וָ/אֶ֖בֶן וַֽ/יְאַבְּדֽוּ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/018.yaml
  text: and they have cast their gods into the fire[a], for they were not gods, but the work of human hands, wood and stone; therefore they destroyed them.
translation:
  language: pt
  text: e lançaram no fogo os deuses deles[a], pois não eram deuses, mas obra de mãos humanas, de madeira e pedra; por isso os destruíram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “puseram no fogo os deuses deles”. O verbo hebraico significa literalmente “deram/puseram”, empregado aqui no sentido de lançar ou colocar algo no fogo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ
  choice: e lançaram
  rationale: Embora נתן signifique literalmente “dar/pôr”, com “no fogo” expressa aqui a ação de lançar ou colocar algo no fogo para destruí-lo. O pretérito perfeito é natural no contexto narrativo português.
- source_word: אֱלֹהֵיהֶם
  choice: os deuses deles
  rationale: Mantém a designação literal e a força retórica do texto, que primeiro os chama de “deuses” e em seguida nega que realmente o sejam.
- source_word: בָּאֵשׁ
  choice: no fogo
  rationale: Em português, “lançar no fogo” expressa naturalmente o movimento para dentro do fogo sem exigir a formulação mais longa “para dentro do fogo”.
- source_word: כִּי לֹא אֱלֹהִים הֵמָּה
  choice: pois não eram deuses
  rationale: A oração apresenta a razão de poderem ser destruídos e nega sua verdadeira divindade. O imperfeito “eram” harmoniza com o quadro narrativo passado.
- source_word: כִּי אִם
  choice: mas
  rationale: 'Marca com clareza o forte contraste: não eram deuses, mas objetos fabricados.'
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  choice: obra de mãos humanas
  rationale: Expressa a fabricação humana e preserva o sentido genérico de אָדָם, sem restringi-lo a um indivíduo do sexo masculino.
- source_word: עֵץ וָאֶבֶן
  choice: madeira e pedra
  rationale: Descrição direta e idiomática dos materiais de que eram feitos esses deuses.
- source_word: וַיְאַבְּדוּם
  choice: por isso os destruíram
  rationale: Entende a forma como transitiva, com os invasores como sujeito e os deuses como objeto. “Por isso” explicita naturalmente a consequência lógica do fato de serem apenas madeira e pedra.
theological_decisions:
- issue: Negação da divindade dos deuses das nações
  choice: não eram deuses
  alternative: não são deuses
  rationale: Preserva a afirmação teológica de que esses objetos não possuíam divindade real, usando o tempo passado adequado ao contexto narrativo sem reduzir a negação a mera nomenclatura.
- issue: Sentido genérico de אָדָם na fabricação dos ídolos
  choice: mãos humanas
  alternative: mãos do homem
  rationale: O referente é a humanidade em geral; “humanas” comunica esse sentido de modo atual, preciso e natural.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva a repetição retórica de “deuses” e distingue esses supostos deuses da obra material de mãos humanas.
