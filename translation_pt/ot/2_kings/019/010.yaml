source:
  edition: WLC
  text: כֹּ֣ה תֹאמְר֗וּ/ן אֶל חִזְקִיָּ֤הוּ מֶֽלֶךְ יְהוּדָה֙ לֵ/אמֹ֔ר אַל יַשִּׁאֲ/ךָ֣ אֱלֹהֶ֔י/ךָ אֲשֶׁ֥ר אַתָּ֛ה בֹּטֵ֥חַ בּ֖/וֹ לֵ/אמֹ֑ר לֹ֤א תִנָּתֵן֙ יְר֣וּשָׁלִַ֔ם בְּ/יַ֖ד מֶ֥לֶךְ אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/010.yaml
  text: 'Thus you shall say to Hezekiah king of Judah: ‘Do not let your God[a], in whom you trust, deceive you, saying, “Jerusalem will not be given into the hand of the king of Assyria.”’'
translation:
  language: pt
  text: 'Assim vocês dirão a Ezequias, rei de Judá: “Não deixe que o seu Deus[a], em quem você confia, o engane, dizendo: ‘Jerusalém não será entregue nas mãos do rei da Assíria’.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o seu deus”; o hebraico não distingue maiúsculas de minúsculas, e o emissário assírio está zombando da confiança de Ezequias.
    reason: Alternativa gráfica e estilística decorrente da ambiguidade não marcada no hebraico.
lexical_decisions:
- source_word: כֹּה
  choice: Assim
  rationale: Introduz a mensagem citada com a fórmula de mensageiro, de modo conciso e natural em português.
- source_word: תֹאמְרוּן
  choice: vocês dirão
  rationale: O imperfeito masculino plural tem força instrucional; o futuro preserva a diretiva em registro formal sem soar artificial.
- source_word: חִזְקִיָּהוּ
  choice: Ezequias
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: מֶלֶךְ יְהוּדָה
  choice: rei de Judá
  rationale: Mantém o título real em aposição ao nome, conforme a sintaxe hebraica.
- source_word: אַל יַשִּׁאֲךָ
  choice: Não deixe que ... o engane
  rationale: Expressa naturalmente em português a proibição com o verbo נשׁא no sentido causativo de enganar ou iludir.
- source_word: אֱלֹהֶיךָ
  choice: o seu Deus
  rationale: Identifica o Deus em quem Ezequias confia; a possibilidade gráfica de minúscula, não marcada no hebraico, é registrada em nota.
- source_word: אֲשֶׁר אַתָּה בֹּטֵחַ בּוֹ
  choice: em quem você confia
  rationale: Reproduz o sentido de בָּטַח com ב e usa linguagem atual, clara e digna.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Introduz diretamente o conteúdo pelo qual, segundo a provocação assíria, Deus enganaria Ezequias, sem explicitar além do hebraico a relação sintática.
- source_word: לֹא תִנָּתֵן
  choice: não será entregue
  rationale: Traduz o nifal de נתן como passivo; 'entregue' comunica com naturalidade a transferência ao domínio inimigo.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalém
  rationale: Forma tradicional do topônimo em português.
- source_word: בְּיַד מֶלֶךְ אַשּׁוּר
  choice: nas mãos do rei da Assíria
  rationale: Preserva a metáfora hebraica de poder e controle; o plural 'nas mãos' é a expressão idiomática corrente em português.
theological_decisions:
- issue: Uso de maiúscula em אֱלֹהֶיךָ na fala do rei assírio
  choice: o seu Deus
  alternative: o seu deus
  rationale: O hebraico não distingue maiúsculas de minúsculas. Como o referente é o Deus de Ezequias, emprega-se a forma convencional 'Deus' no texto; a fala hostil pode, porém, comportar o tom depreciativo refletido pela alternativa em minúscula, preservada em nota.
translation_notes:
  register: Português moderno de ampla compreensão, com legibilidade brasileira. O plural 'vocês' torna explícito o destinatário coletivo da ordem, enquanto 'você' corresponde ao singular dirigido a Ezequias. A formulação mantém o tom de mensagem real e a provocação assíria sem suavizar sua tensão teológica.
