base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/037.yaml
  text: And it happened that[a], as he was worshiping in the house of Nisrok his god, Adrammelek and Sharezer struck him down with the sword, and they escaped to the land of Ararat. And Esar-haddon his son reigned in his place.
translation:
  language: pt
  text: E aconteceu que, enquanto ele adorava no templo de Nisroque[a], seu deus, Adrameleque e Sarezer o mataram à espada e escaparam para a terra de Ararate. E seu filho Esar-Hadom reinou em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Nisrok”; em português, tradicionalmente “Nisroque”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Mantém a função narrativa da forma hebraica sem recorrer a uma expressão arcaica.
- source_word: מִשְׁתַּחֲוֶה
  choice: adorava
  rationale: No contexto de um santuário e diante de 'seu deus', a forma hitpael denota culto; o imperfeito após 'enquanto' expressa a ação em curso.
- source_word: בֵּית
  choice: no templo de
  rationale: Embora signifique literalmente 'casa de', aqui designa claramente o santuário de uma divindade; 'templo' é natural e semanticamente preciso em português.
- source_word: נִסְרֹךְ
  choice: Nisroque
  rationale: Transliteração adaptada à ortografia e à pronúncia portuguesas do nome hebraico apontado.
- source_word: אֱלֹהָיו
  choice: seu deus
  rationale: Reproduz diretamente o singular com sufixo masculino, referente ao deus de Senaqueribe.
- source_word: הִכֻּהוּ בַחֶרֶב
  choice: o mataram à espada
  rationale: O verbo 'ferir' neste contexto descreve um golpe letal. A formulação portuguesa explicita o resultado inequívoco e preserva o instrumento.
- source_word: נִמְלְטוּ
  choice: escaparam
  rationale: A forma nifal indica uma fuga bem-sucedida após o assassinato.
- source_word: אֶרֶץ אֲרָרָט
  choice: para a terra de Ararate
  rationale: Expressa naturalmente o destino geográfico e conserva a construção 'terra de Ararate'.
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: Verbo corrente para a sucessão real narrada, cujo sentido é completado por 'em seu lugar'.
- source_word: אֵסַר חַדֹּן
  choice: Esar-Hadom
  rationale: Forma portuguesa legível, próxima dos componentes do nome hebraico e de uso bíblico reconhecível.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: Equivalente natural do idioma hebraico que indica sucessão dinástica.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com fluidez narrativa. 'Templo' esclarece o sentido cultual de בֵית; os nomes próprios foram adaptados para leitura natural em português. O marcador [a] aparece imediatamente após o nome a que se refere.
