  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַטֵּ֨ה יְהוָ֤ה אָזְנְ/ךָ֙ וּֽ/שֲׁמָ֔ע פְּקַ֧ח יְהוָ֛ה עֵינֶ֖י/ךָ וּ/רְאֵ֑ה וּ/שְׁמַ֗ע אֵ֚ת דִּבְרֵ֣י סַנְחֵרִ֔יב אֲשֶׁ֣ר שְׁלָח֔/וֹ לְ/חָרֵ֖ף אֱלֹהִ֥ים חָֽי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/016.yaml
  text: Incline your ear[a], O Yahweh, and hear; open your eyes, O Yahweh, and see; and hear the words of Sennacherib, which he has sent to reproach the living God.
translation:
  language: pt
  text: Inclina, ó Yahweh, o teu ouvido e ouve; abre, ó Yahweh, os teus olhos e vê. Ouve as palavras de Senaqueribe, que ele enviou para insultar[a] o Deus vivo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “afrontar” ou “desafiar”; o verbo hebraico pode indicar insultar, escarnecer ou desafiar com desprezo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַטֵּה ... אָזְנְךָ
  choice: Inclina ... o teu ouvido
  rationale: Mantém a imagem hebraica no singular e seu sentido idiomático de prestar atenção, com tom solene e compreensível.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וּשֲׁמָע / וּשְׁמַע
  choice: e ouve / Ouve
  rationale: Preserva a repetição deliberada do verbo שמע e a sequência de imperativos da oração.
- source_word: פְּקַח ... עֵינֶיךָ וּרְאֵה
  choice: abre ... os teus olhos e vê
  rationale: Reproduz de modo natural a imagem e o paralelismo do hebraico.
- source_word: דִּבְרֵי סַנְחֵרִיב
  choice: as palavras de Senaqueribe
  rationale: Tradução direta do plural construto, adequada às palavras hostis enviadas pelo rei assírio.
- source_word: אֲשֶׁר שְׁלָחוֹ
  choice: que ele enviou
  rationale: Conserva a relação da oração relativa com as palavras, sem explicitar indevidamente se o sufixo se refere à mensagem ou ao portador.
- source_word: לְחָרֵף
  choice: para insultar
  rationale: Expressa em português corrente a ideia central de ultrajar ou dirigir palavras de desprezo contra alguém, preservando em nota a possível nuance de desafio.
- source_word: אֱלֹהִים חָי
  choice: o Deus vivo
  rationale: Formulação portuguesa natural para a expressão hebraica, que contrasta o Deus de Israel com deuses sem vida.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico traz diretamente o nome divino; a transliteração Yahweh o preserva como nome próprio, sem substituí-lo por “SENHOR”.
- issue: Nuance de לְחָרֵף dirigido contra Deus
  choice: insultar o Deus vivo
  alternative: desafiar o Deus vivo
  rationale: “Insultar” comunica de maneira clara o ultraje verbal central no verbo, enquanto a nota preserva sua possível força confrontadora de afrontar ou desafiar.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo imperativo preservado. O vocativo “ó Yahweh” mantém o tom de oração sem recorrer a linguagem excessivamente arcaica.
