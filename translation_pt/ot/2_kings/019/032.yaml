source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֶל מֶ֣לֶךְ אַשּׁ֔וּר לֹ֤א יָבֹא֙ אֶל הָ/עִ֣יר הַ/זֹּ֔את וְ/לֹֽא יוֹרֶ֥ה שָׁ֖ם חֵ֑ץ וְ/לֹֽא יְקַדְּמֶ֣/נָּה מָגֵ֔ן וְ/לֹֽא יִשְׁפֹּ֥ךְ עָלֶ֖י/הָ סֹלְלָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/032.yaml
  text: 'Therefore thus says Yahweh concerning the king of Assyria: He shall not come into this city[a], or shoot an arrow there, or come before it with a shield[b], or cast up a siege ramp against it.'
translation:
  language: pt
  text: 'Portanto, assim diz Yahweh a respeito do rei da Assíria: “Ele não entrará nesta cidade, nem atirará uma flecha contra ela, nem avançará contra ela com escudo[a], nem levantará contra ela uma rampa de cerco[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nem se apresentará diante dela com escudo”. O hebraico descreve literalmente ir ao encontro ou chegar diante da cidade com escudo; no contexto, provavelmente se refere a uma aproximação militar sob proteção.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “nem amontoará contra ela um aterro de cerco”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Preserva a força conclusiva da declaração em relação ao oráculo precedente.
- source_word: כֹּה אָמַר
  choice: assim diz
  rationale: Mantém a fórmula profética de mensageiro em linguagem portuguesa natural e solene.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֶל מֶלֶךְ אַשּׁוּר
  choice: a respeito do rei da Assíria
  rationale: Neste contexto, אֶל introduz o referente do pronunciamento; a formulação evita sugerir que a mensagem foi entregue diretamente ao rei.
- source_word: לֹא יָבֹא אֶל הָעִיר הַזֹּאת
  choice: Ele não entrará nesta cidade
  rationale: בוא com אֶל pode indicar chegar ou entrar; no contexto da ameaça contra Jerusalém, “entrará nesta cidade” comunica naturalmente o movimento visado sem acrescentar conquista.
- source_word: וְלֹא יוֹרֶה שָׁם חֵץ
  choice: nem atirará uma flecha contra ela
  rationale: O hifil de ירה significa lançar ou disparar. “Contra ela” torna claro em português que a cidade é o alvo, correspondendo ao valor locativo de שָׁם no contexto.
- source_word: וְלֹא יְקַדְּמֶנָּה מָגֵן
  choice: nem avançará contra ela com escudo
  rationale: קדמ no piel descreve ir ao encontro ou apresentar-se diante de algo; o contexto de cerco favorece a ideia de aproximação protegida por escudo, sem especificar além do hebraico.
- source_word: וְלֹא יִשְׁפֹּךְ עָלֶיהָ סֹלְלָה
  choice: nem levantará contra ela uma rampa de cerco
  rationale: A combinação idiomática descreve a construção de uma obra de terra para sitiar a cidade; “levantará” é corrente em português e preserva a imagem de acumulação.
- source_word: סֹלְלָה
  choice: rampa de cerco
  rationale: Designa uma estrutura elevada de terra usada para atacar uma cidade fortificada; esta expressão é clara para leitores modernos.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o tetragrama. A transliteração preserva a distinção entre o nome divino e títulos como “Senhor”, sem acrescentar interpretação denominacional.
- issue: Alcance da promessa de proteção da cidade
  choice: Predição direta de que o rei assírio não realizará nenhuma das ações militares enumeradas
  alternative: Paráfrase como garantia geral de que ele não conquistará a cidade
  rationale: A tradução conserva a sequência concreta do hebraico — entrar, disparar, avançar com escudo e erguer uma obra de cerco — sem reduzir ou ampliar a declaração.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A cadência repetida de “nem” reproduz a estrutura enfática do hebraico. Os marcadores foram colocados junto às expressões a que suas notas efetivamente se referem.
