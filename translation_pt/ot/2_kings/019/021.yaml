  text: זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה עָלָ֑י/ו בָּזָ֨ה לְ/ךָ֜ לָעֲגָ֣ה לְ/ךָ֗ בְּתוּלַת֙ בַּת צִיּ֔וֹן אַחֲרֶ֨י/ךָ֙ רֹ֣אשׁ הֵנִ֔יעָה בַּ֖ת יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/021.yaml
  text: 'This is the word that Yahweh has spoken concerning him: ‘Virgin Daughter Zion despises you[a]; she mocks you[b]. Daughter Jerusalem shakes her head behind you.’'
translation:
  language: pt
  text: 'Esta é a palavra que Yahweh falou a respeito dele: “A virgem, filha de Sião, despreza você e zomba de você. A filha de Jerusalém balança a cabeça atrás de você[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Balançar a cabeça é um gesto de desprezo ou zombaria.
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּבָר
  choice: a palavra
  rationale: Em uma fórmula de introdução profética, “a palavra” preserva de modo natural e transparente a ideia de um pronunciamento divino.
- source_word: דִּבֶּר יְהוָה עָלָיו
  choice: Yahweh falou a respeito dele
  rationale: עַל indica aqui o assunto do oráculo; “a respeito dele” preserva isso sem tornar explícito demais o sentido hostil, embora o contexto seja de juízo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no hebraico, em vez de substituí-lo por um título.
- source_word: בָּזָה
  choice: despreza
  rationale: Expressa diretamente a atitude de tratar alguém com desprezo e mantém a vivacidade do discurso poético.
- source_word: לָעֲגָה
  choice: zomba de
  rationale: Equivalente atual e claro para o verbo que significa zombar ou escarnecer.
- source_word: בְּתוּלַת בַּת צִיּוֹן
  choice: a virgem, filha de Sião
  rationale: Preserva os dois elementos da personificação poética e evita uma sequência nominal pouco natural em português.
- source_word: אַחֲרֶיךָ
  choice: pelas suas costas
  rationale: Comunica a localização “atrás de você” e, no contexto, a ideia de desprezo dirigido ao inimigo que se afasta.
- source_word: רֹאשׁ הֵנִיעָה
  choice: balança a cabeça
  rationale: Mantém literalmente o gesto hebraico, cujo valor de desprezo ou zombaria é explicado em nota.
- source_word: בַּת יְרוּשָׁלִָם
  choice: a filha de Jerusalém
  rationale: Conserva a personificação poética da cidade e o paralelismo com a filha de Sião.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o tetragrama; “Yahweh” preserva o nome pessoal por transliteração, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura poética e as personificações de Sião e Jerusalém foram preservadas; o idioma gestual foi mantido no texto e esclarecido em nota.
