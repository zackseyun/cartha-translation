  text: וַ/יִּתְפַּלֵּ֨ל חִזְקִיָּ֜הוּ לִ/פְנֵ֣י יְהוָה֮ וַ/יֹּאמַר֒ יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ יֹשֵׁ֣ב הַ/כְּרֻבִ֔ים אַתָּה ה֤וּא הָֽ/אֱלֹהִים֙ לְ/בַדְּ/ךָ֔ לְ/כֹ֖ל מַמְלְכ֣וֹת הָ/אָ֑רֶץ אַתָּ֣ה עָשִׂ֔יתָ אֶת הַ/שָּׁמַ֖יִם וְ/אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/015.yaml
  text: And Hezekiah prayed before Yahweh and said[a], “Yahweh, God of Israel, enthroned above the cherubim, you alone are God over all the kingdoms of the earth. You made the heavens and the earth.”
translation:
  language: pt
  text: 'E Ezequias orou diante de Yahweh e disse: “Ó Yahweh, Deus de Israel, entronizado sobre os querubins[a], somente tu és Deus sobre todos os reinos da terra. Tu fizeste os céus e a terra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que estás entronizado sobre os querubins”. O hebraico diz literalmente “sentado/habitando [entre/sobre] os querubins”, uma imagem régia e cultual de Yahweh entronizado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: orou
  rationale: É o sentido básico e direto do verbo, natural em português neste contexto.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Preserva o sentido relacional e espacial de estar perante ou na presença de Yahweh, com formulação idiomática em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Deus de Israel
  rationale: Tradução direta da construção hebraica, adequada como vocativo na oração.
- source_word: יֹשֵׁב הַכְּרֻבִים
  choice: entronizado sobre os querubins
  rationale: Comunica a imagem régia e cultual de Yahweh entronizado em relação aos querubins, sem reduzir o particípio à ideia de simplesmente estar sentado.
- source_word: אַתָּה הוּא הָאֱלֹהִים לְבַדְּךָ
  choice: somente tu és Deus
  rationale: Expressa com clareza a ênfase hebraica na exclusividade divina, sem duplicação pouco natural em português.
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: sobre todos os reinos da terra
  rationale: Neste contexto, a preposição exprime a relação de soberania de Deus para com todos os reinos terrestres.
- source_word: עָשִׂיתָ
  choice: fizeste
  rationale: Corresponde diretamente ao verbo hebraico 'fazer', sem substituí-lo pelo verbo mais específico 'criar'.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: os céus e a terra
  rationale: Conserva o plural morfológico hebraico e a conhecida fórmula de totalidade da criação.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o Tetragrama como nome próprio; a transliteração preserva essa função sem substituí-la por um título.
- issue: Força monoteísta exclusiva da oração
  choice: somente tu és Deus sobre todos os reinos da terra
  alternative: tu és Deus, tu somente, para todos os reinos da terra
  rationale: A formulação conserva a exclusividade de לְבַדְּךָ e a soberania universal indicada pelo contexto, sem acrescentar uma formulação doutrinária posterior.
- issue: Imagem de Yahweh em relação aos querubins
  choice: entronizado sobre os querubins
  alternative: que estás sentado entre os querubins
  rationale: A escolha preserva a imagem régia e cultual provável, enquanto a nota registra a formulação hebraica e sua possível amplitude espacial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega 'tu' por se tratar de oração direta, mantendo concordância verbal coerente. A partícula vocativa 'Ó' torna natural a invocação em português sem alterar seu conteúdo.
