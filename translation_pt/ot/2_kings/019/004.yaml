  text: אוּלַ֡י יִשְׁמַע֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֵ֣ת כָּל דִּבְרֵ֣י רַב שָׁקֵ֗ה אֲשֶׁר֩ שְׁלָח֨/וֹ מֶֽלֶךְ אַשּׁ֤וּר אֲדֹנָי/ו֙ לְ/חָרֵף֙ אֱלֹהִ֣ים חַ֔י וְ/הוֹכִ֨יחַ֙ בַּ/דְּבָרִ֔ים אֲשֶׁ֥ר שָׁמַ֖ע יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/נָשָׂ֣אתָ תְפִלָּ֔ה בְּעַ֥ד הַ/שְּׁאֵרִ֖ית הַ/נִּמְצָאָֽה׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/004.yaml
  text: Perhaps Yahweh your God will hear all the words of the Rabshakeh[a], whom his master the king of Assyria has sent to mock the living God, and will rebuke the words that Yahweh your God has heard[c][b]. Therefore lift up a prayer for the remnant that remains.
translation:
  language: pt
  text: Talvez Yahweh, seu Deus, ouça todas as palavras do rabsaqué[a], a quem seu senhor, o rei da Assíria, enviou para insultar[b] o Deus vivo, e repreenda pelas palavras que Yahweh, seu Deus, ouviu. Portanto, eleve uma oração[c] em favor do remanescente que ainda resta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Rabsaqué” provavelmente é um título de um alto oficial assírio; também se propõe o sentido de “chefe dos copeiros”.
    reason: cultural_note
  - marker: b
    text: 'Ou: “afrontar”, “desafiar” ou “zombar do” Deus vivo.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “ofereça uma oração” ou simplesmente “ore”. O idioma hebraico diz literalmente “eleve uma oração”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי יִשְׁמַע
  choice: Talvez ... ouça
  rationale: Preserva a possibilidade esperançosa, sem transformá-la em certeza, e soa natural em português atual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera diretamente o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: רַב שָׁקֵה
  choice: rabsaqué
  rationale: Mantém como título assírio transliterado, pois a identificação exata do cargo é discutida; a nota registra a alternativa.
- source_word: לְחָרֵף
  choice: insultar
  rationale: Expressa a afronta verbal e desdenhosa dirigida ao Deus vivo; alternativas possíveis são 'afrontar', 'desafiar' e 'zombar de'.
- source_word: וְהוֹכִיחַ בַּדְּבָרִים
  choice: e repreenda as palavras
  rationale: Segue de perto a construção hebraica sem acrescentar um objeto pessoal como 'o repreenda'; conserva certa abertura quanto à relação sintática da preposição.
- source_word: וְנָשָׂאתָ תְפִלָּה
  choice: eleve uma oração
  rationale: Preserva a imagem do idioma hebraico e continua compreensível em português; idiomaticamente significa oferecer uma oração ou orar.
- source_word: בְּעַד הַשְּׁאֵרִית הַנִּמְצָאָה
  choice: em favor do remanescente que ainda resta
  rationale: Comunica intercessão e mantém o termo bíblico 'remanescente', bem como a ênfase do particípio em quem continua presente.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz explicitamente o tetragrama; a transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Sentido de הַשְּׁאֵרִית
  choice: o remanescente
  alternative: os sobreviventes; os que restam
  rationale: Mantém a terminologia recorrente das Escrituras sem afirmar aqui mais do que a existência do grupo que permaneceu.
- issue: Objeto de וְהוֹכִיחַ
  choice: repreenda as palavras
  alternative: o repreenda por causa das palavras
  rationale: O hebraico não explicita um pronome objeto. A redação escolhida evita acrescentá-lo e preserva a tensão sintática, embora a alternativa pessoal seja contextualmente possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega 'seu Deus' na fala dirigida a Isaías, 'rabsaqué' em forma aportuguesada e notas breves para ambiguidades lexicais e culturais.
