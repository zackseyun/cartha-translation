base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/002.yaml
  text: And he sent Eliakim[a], who was over the household, and Shebna the scribe, and the elders of the priests, clothed in sackcloth, to Isaiah the prophet[b], the son of Amoz.
translation:
  language: pt
  text: Então ele enviou Eliaquim, o responsável pela casa real[a], Sebna, o escriba, e os anciãos dos sacerdotes, vestidos de pano de saco[b], ao profeta Isaías, filho de Amoz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. «o que estava sobre a casa». A expressão se refere a um alto oficial encarregado da casa real.
    reason: cultural_note
  - marker: b
    text: Ou «cobrindo-se com pano de saco». O particípio hebraico pode destacar a ação ou o estado resultante.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Então ele enviou
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa naturalmente a sequência em português sem acrescentar uma precisão temporal indevida.
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: o responsável pelo palácio
  rationale: A expressão designa um alto oficial encarregado da casa ou do palácio real. Esta formulação comunica a função com clareza sem reduzi-la a um cargo moderno específico.
- source_word: הַסֹּפֵר
  choice: o escriba
  rationale: Mantém o equivalente lexical tradicional e abrangente; o termo também pode indicar um secretário real, mas o hebraico não exige essa especificação.
- source_word: זִקְנֵי הַכֹּהֲנִים
  choice: os anciãos dos sacerdotes
  rationale: Reproduz diretamente a relação de construto, preservando tanto a ideia de anciãos quanto a referência ao corpo sacerdotal.
- source_word: מִתְכַּסִּים בַּשַּׂקִּים
  choice: vestidos de pano de saco
  rationale: Expressa de modo natural o estado indicado pelo particípio e preserva a imagem cultural de luto, humilhação ou aflição.
- source_word: יְשַׁעְיָהוּ הַנָּבִיא
  choice: ao profeta Isaías
  rationale: A aposição hebraica é vertida em ordem idiomática no português, sem alterar a identificação de Isaías.
- source_word: בֶּן אָמוֹץ
  choice: filho de Amoz
  rationale: Tradução direta e natural da identificação patronímica.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com vocabulário bíblico inteligível. “Pano de saco” preserva a imagem histórica; “responsável pelo palácio” torna clara a função administrativa sem impor um título moderno excessivamente específico.
