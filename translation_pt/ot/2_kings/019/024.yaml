  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֲנִ֣י קַ֔רְתִּי וְ/שָׁתִ֖יתִי מַ֣יִם זָרִ֑ים וְ/אַחְרִב֙ בְּ/כַף פְּעָמַ֔/י כֹּ֖ל יְאֹרֵ֥י מָצֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/024.yaml
  text: I myself have dug and drunk foreign waters[a], and with the sole of my feet I dry up all the streams of Egypt.
translation:
  language: pt
  text: Eu mesmo cavei e bebi águas estrangeiras; com a planta dos meus pés, seco todos os canais do Egito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos os braços do Nilo no Egito”. O termo hebraico pode designar especificamente os cursos de água ligados ao Nilo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַרְתִּי
  choice: cavei
  rationale: O verbo indica cavar, provavelmente poços ou fontes de água. “Cavei” mantém a concisão do hebraico sem acrescentar um objeto não expresso.
- source_word: מַיִם זָרִים
  choice: águas estrangeiras
  rationale: A expressão designa águas de terras alheias ou conquistadas. A tradução preserva a imagem concreta e o tom de jactância imperial.
- source_word: וְאַחְרִב
  choice: seco
  rationale: O hifil de חרב significa aqui “fazer secar”. O presente em português expressa vividamente a capacidade alegada pelo rei, em continuidade com sua declaração arrogante.
- source_word: בְּכַף פְּעָמַי
  choice: com a planta dos meus pés
  rationale: כַּף, quando se refere ao pé, é a planta. A formulação conserva a imagem de domínio exercido com aparente facilidade.
- source_word: יְאֹרֵי
  choice: canais
  rationale: יְאֹרֵי pode designar cursos de água ligados ao Nilo, especialmente seus canais. “Canais” é claro e geograficamente apropriado, enquanto a nota registra outra formulação possível.
- source_word: מָצוֹר
  choice: Egito
  rationale: Nesta combinação com יְאֹרֵי, מָצוֹר é melhor entendido como designação poética do Egito, e não como “cerco” ou “fortaleza”.
- source_word: אֲנִי
  choice: Eu mesmo
  rationale: O pronome explícito é enfático e reforça a autoglorificação do orador.
theological_decisions:
- issue: Referente e força retórica da fala na primeira pessoa
  choice: Manter a fala como uma arrogante jactância régia, sem explicação teológica no corpo do versículo.
  alternative: Explicitar que quem fala é o rei da Assíria ou tratar as palavras apenas como propaganda militar hiperbólica.
  rationale: O contexto identifica o orador, mas o hebraico do versículo preserva a afirmação direta na primeira pessoa. A tradução mantém sua tensão e suas imagens sem inserir interpretação.
- issue: Valor temporal de וְאַחְרִב
  choice: Traduzir pelo presente vívido “seco”.
  alternative: “secarei” ou “sequei”.
  rationale: A forma hebraica admite leitura prospectiva ou continuativa no discurso de jactância. O presente conserva a força proverbial da alegação sem restringi-la rigidamente ao passado ou ao futuro.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura concisa e a primeira pessoa enfática preservam o tom de soberba; “planta dos meus pés” mantém a imagem concreta do original.
