source:
  edition: WLC
  text: וְ/עַתָּה֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ הוֹשִׁיעֵ֥/נוּ נָ֖א מִ/יָּד֑/וֹ וְ/יֵֽדְעוּ֙ כָּל מַמְלְכ֣וֹת הָ/אָ֔רֶץ כִּ֥י אַתָּ֛ה יְהוָ֥ה אֱלֹהִ֖ים לְ/בַדֶּֽ/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/019.yaml
  text: And now[a], Yahweh our God, please save us from his hand[b], so that all the kingdoms of the earth may know that you alone are God.
translation:
  language: pt
  text: E agora, Yahweh, nosso Deus, salva-nos, por favor, da mão dele,[a] para que todos os reinos da terra[b] saibam que somente tu, Yahweh, és Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “da mão dele”, expressão hebraica que se refere a ser livrado do poder ou controle de alguém.
    reason: cultural_note
  - marker: b
    text: Ou “do país”; neste contexto, “da terra” corresponde melhor ao alcance internacional da oração.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a força conectiva de וְ quanto o marcador temporal que introduz o pedido culminante da oração.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Reproduz diretamente a forma com sufixo de primeira pessoa do plural.
- source_word: הוֹשִׁיעֵנוּ נָא
  choice: salva-nos, por favor
  rationale: O imperativo expressa o pedido de livramento, e נָא é representado naturalmente pela expressão cortês e suplicante 'por favor'.
- source_word: מִיָּדוֹ
  choice: das mãos dele
  rationale: Mantém a metáfora hebraica de estar sob a mão, isto é, sob o poder ou controle de alguém; o plural é idiomático em português.
- source_word: וְיֵדְעוּ
  choice: para que ... saibam
  rationale: No contexto, a forma verbal após o imperativo exprime a finalidade ou o resultado pretendido da súplica.
- source_word: כָּל מַמְלְכוֹת הָאָרֶץ
  choice: todos os reinos da terra
  rationale: O contexto internacional favorece o sentido abrangente de 'terra', embora 'país' ou 'território' seja lexicalmente possível em outros contextos.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo daquilo que os reinos devem reconhecer.
- source_word: אַתָּה יְהוָה אֱלֹהִים לְבַדֶּךָ
  choice: somente tu, Yahweh, és Deus
  rationale: Conserva o nome divino dentro da confissão e dá a לְבַדֶּךָ seu valor exclusivo sem transformar 'Yahweh Deus' em um título composto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sintaxe e exclusividade de אַתָּה יְהוָה אֱלֹהִים לְבַדֶּךָ
  choice: somente tu, Yahweh, és Deus
  alternative: tu és Yahweh Deus, tu somente
  rationale: A formulação escolhida comunica de modo natural que Yahweh, e ninguém mais, é Deus, preservando a ênfase exclusiva de לְבַדֶּךָ sem impor a leitura de um título composto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação 'salva-nos' mantém solenidade natural sem arcaísmo excessivo; 'por favor' representa a súplica נָא. A repetição de 'Yahweh' acompanha as duas ocorrências hebraicas.
