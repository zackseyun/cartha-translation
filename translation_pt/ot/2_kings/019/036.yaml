lexical_decisions:
- source_word: וַיִּסַּע וַיֵּלֶךְ וַיָּשָׁב
  choice: partiu, foi embora e voltou
  rationale: Mantém a sequência enfática de três verbos do hebraico, com formulação natural em português. “Voltou” expressa o retorno de Senaqueribe ao seu território e à sua capital.
- source_word: וַיֵּשֶׁב בְּנִינְוֵה
  choice: para Nínive, onde ficou
  rationale: O verbo ישׁב pode significar sentar-se, habitar, permanecer ou ficar. Neste contexto, “onde ficou” é natural e preserva a ideia de permanência em Nínive sem exigir que o texto declare residência definitiva.
- source_word: סַנְחֵרִיב מֶלֶךְ אַשּׁוּר
  choice: Senaqueribe, rei da Assíria
  rationale: Reproduz diretamente o nome e o título real, com a forma portuguesa consagrada.
