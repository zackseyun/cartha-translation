  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח חִזְקִיָּ֧הוּ אֶת הַ/סְּפָרִ֛ים מִ/יַּ֥ד הַ/מַּלְאָכִ֖ים וַ/יִּקְרָאֵ֑/ם וַ/יַּ֨עַל֙ בֵּ֣ית יְהוָ֔ה וַ/יִּפְרְשֵׂ֥/הוּ חִזְקִיָּ֖הוּ לִ/פְנֵ֥י יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/014.yaml
  text: Then Hezekiah took the letters from the hand of the messengers and read them[a], and he went up to the house of Yahweh[c][b], and Hezekiah spread them before Yahweh.
translation:
  language: pt
  text: Então Ezequias tomou das mãos dos mensageiros os escritos[a] e os leu. Depois, subiu à casa de Yahweh e estendeu o documento[b] diante de Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as cartas”, “os documentos” ou “os rolos”; o termo hebraico pode designar diversos tipos de material escrito.
    reason: lexical_alternative
  - marker: b
    text: O hebraico passa do plural, em “os leu”, para o singular, literalmente “o estendeu”, tratando aparentemente os escritos como um só documento.
    reason: textual_ambiguity
  - marker: c
    text: Ao estender o documento diante de Yahweh, Ezequias o apresentava a Deus em oração.
    reason: cultural_note
lexical_decisions:
- source_word: הַסְּפָרִים
  choice: os escritos
  rationale: O plural hebraico pode designar cartas, documentos, rolos ou materiais escritos em sentido amplo. “Os escritos” preserva essa amplitude, embora o contexto indique a mensagem escrita entregue pelos mensageiros.
- source_word: מִיַּד הַמַּלְאָכִים
  choice: das mãos dos mensageiros
  rationale: Mantém a imagem concreta do idioma hebraico e deixa claro que se trata de mensageiros humanos.
- source_word: וַיִּקְרָאֵם
  choice: e os leu
  rationale: O sufixo pronominal é plural e concorda com “os escritos”.
- source_word: וַיַּעַל
  choice: subiu
  rationale: Preserva o sentido espacial e convencional de subir ao santuário.
- source_word: בֵּית יְהוָה
  choice: à casa de Yahweh
  rationale: Reproduz de perto a expressão hebraica “casa de Yahweh”, sem substituí-la pelo explicativo “templo”.
- source_word: וַיִּפְרְשֵׂהוּ
  choice: estendeu o documento
  rationale: O verbo descreve o ato físico de abrir ou dispor o escrito. O objeto pronominal é singular, apesar dos plurais anteriores; “o documento” conserva essa mudança de número de modo inteligível.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: É uma expressão portuguesa natural que preserva o sentido de agir na presença de Deus.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Mudança do plural para o singular nos objetos pronominais
  choice: “os leu” e depois “o documento”
  alternative: 'Uniformizar tudo no plural: “os estendeu”'
  rationale: O hebraico primeiro usa um objeto plural em “os leu”, mas depois um objeto singular em “o estendeu”. A tradução mantém essa tensão gramatical, entendendo o conjunto de escritos como um documento unitário sem apagar a mudança.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção narrativa fluente. “Tomou das mãos” conserva a concretude hebraica; “casa de Yahweh” mantém a forma da expressão original. A repetição de “Yahweh” foi preservada, assim como a mudança deliberada do plural para o singular.
