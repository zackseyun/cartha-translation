base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/009.yaml
  text: When he heard concerning Tirhakah king of Cush[a], saying, “Look, he has come out to fight against you,” he turned back and sent messengers to Hezekiah, saying,
translation:
  language: pt
  text: 'Quando ouviu dizer a respeito de Tiraca, rei de Cuxe[a]: “Veja, ele saiu para lutar contra você”, enviou novamente[b] mensageiros a Ezequias, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “rei da Etiópia”. O hebraico traz “Cuxe”, antiga região ao sul do Egito.
    reason: Preserva o topônimo da fonte e informa a alternativa tradicional sem equipará-lo de modo simples ao país moderno.
  - marker: b
    text: Ou “voltou e enviou”.
    reason: A construção hebraica pode ser entendida como repetição do envio ou, mais literalmente, como retorno seguido do envio.
lexical_decisions:
- source_word: וַיִּשְׁמַע אֶל
  choice: Quando ouviu dizer a respeito de
  rationale: A construção introduz a notícia recebida e faz avançar a narrativa. A formulação temporal é natural em português e não explicita o sujeito, que permanece implícito como no hebraico.
- source_word: תִּרְהָקָה
  choice: Tiraca
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio, correspondente ao hebraico Tirhaqá.
- source_word: מֶלֶךְ כּוּשׁ
  choice: rei de Cuxe
  rationale: Preserva o topônimo hebraico em vez de identificá-lo diretamente com a Etiópia moderna.
- source_word: הִנֵּה
  choice: Veja
  rationale: Mantém a função de chamar a atenção para a notícia, em linguagem atual, sem recorrer ao arcaizante “eis”.
- source_word: יָצָא לְהִלָּחֵם אִתָּךְ
  choice: ele saiu para lutar contra você
  rationale: Reproduz diretamente o movimento militar e verte אִתָּךְ pelo sentido hostil exigido pelo contexto.
- source_word: וַיָּשָׁב וַיִּשְׁלַח
  choice: enviou novamente
  rationale: שׁוב seguido de outro verbo pode indicar repetição da ação; esta leitura produz uma sequência natural e bem atestada no contexto. A leitura mais literal de retorno físico é preservada em nota.
- source_word: מַלְאָכִים
  choice: mensageiros
  rationale: O contexto diplomático e militar indica emissários humanos, não seres celestiais.
- source_word: חִזְקִיָּהוּ
  choice: Ezequias
  rationale: Emprega a forma portuguesa consolidada do nome próprio.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Preserva a introdução hebraica do discurso que continua no versículo seguinte.
