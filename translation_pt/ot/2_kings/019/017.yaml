  text: אָמְנָ֖ם יְהוָ֑ה הֶחֱרִ֜יבוּ מַלְכֵ֥י אַשּׁ֛וּר אֶת הַ/גּוֹיִ֖ם וְ/אֶת אַרְצָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/017.yaml
  text: Truly[a], O Yahweh[b], the kings of Assyria have laid waste the nations and their lands.
translation:
  language: pt
  text: De fato[a], ó Yahweh, os reis da Assíria devastaram as nações e suas terras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Verdadeiramente» ou «Certamente».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמְנָם
  choice: De fato
  rationale: Introduz uma afirmação enfática da veracidade do que foi dito; em português atual, «De fato» preserva bem esse valor, sem soar arcaico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: הֶחֱרִיבוּ
  choice: devastaram
  rationale: O hifil de חרב indica causar ruína ou devastação; «devastaram» comunica de modo natural o efeito da conquista militar.
- source_word: מַלְכֵי אַשּׁוּר
  choice: os reis da Assíria
  rationale: Representa de maneira direta e idiomática a cadeia construta hebraica.
- source_word: הַגּוֹיִם
  choice: as nações
  rationale: No contexto geopolítico, refere-se às nações conquistadas pela Assíria.
- source_word: אַרְצָם
  choice: as terras delas
  rationale: 'Embora «terra» esteja morfologicamente no singular, o referente plural favorece um sentido distributivo: as terras pertencentes às diversas nações.'
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o tetragrama; «Yahweh» conserva o nome pessoal em transliteração, sem trocá-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A formulação «as terras delas» explicita com naturalidade o provável sentido distributivo do singular hebraico.
