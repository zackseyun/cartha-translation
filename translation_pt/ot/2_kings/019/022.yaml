  text: אֶת מִ֤י חֵרַ֨פְתָּ֙ וְ/גִדַּ֔פְתָּ וְ/עַל מִ֖י הֲרִימ֣וֹתָ קּ֑וֹל וַ/תִּשָּׂ֥א מָר֛וֹם עֵינֶ֖י/ךָ עַל קְד֥וֹשׁ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/022.yaml
  text: Whom have you mocked and blasphemed? Against whom have you raised your voice and lifted your eyes on high? Against the Holy One of Israel[a][b].
translation:
  language: pt
  text: A quem você afrontou e blasfemou?[a] Contra quem levantou a voz e ergueu os olhos para o alto?[b] Contra o Santo de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os verbos traduzidos por “afrontou” e “blasfemou” são quase sinônimos e descrevem fala desdenhosa e abusiva; o segundo pode indicar especificamente blasfêmia contra Deus.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “ergueu os olhos para o alto”, expressão que pode denotar altivez e exaltação arrogante.'
    reason: cultural_note
lexical_decisions:
- source_word: חֵרַפְתָּ
  choice: afrontou
  rationale: Expressa insulto desdenhoso e hostil sem reduzir o verbo a simples zombaria; é natural e digno em português.
- source_word: גִדַּפְתָּ
  choice: blasfemou
  rationale: O verbo pode designar fala abusiva contra Deus; como o objeto culminante é o Santo de Israel, “blasfemou” preserva a gravidade teológica.
- source_word: הֲרִימוֹתָ קּוֹל
  choice: levantou a voz
  rationale: Equivalente idiomático corrente que mantém a ideia de desafio verbal altivo.
- source_word: וַתִּשָּׂא מָרוֹם עֵינֶיךָ
  choice: ergueu os olhos com arrogância
  rationale: Torna explícito o valor idiomático de altivez associado a elevar os olhos, evitando a formulação pouco natural “à altura”.
- source_word: קְדֹושׁ יִשְׂרָאֵל
  choice: o Santo de Israel
  rationale: Preserva diretamente o título divino fixo e sua ressonância no contexto de Isaías e da narrativa de Ezequias.
- source_word: עַל
  choice: contra
  rationale: Nas ocorrências do verso, marca direção hostil; “contra” comunica adequadamente essa força.
- source_word: מִי
  choice: quem
  rationale: Forma natural em português após as preposições “a” e “contra”, mantendo a estrutura retórica.
theological_decisions:
- issue: Preservar a gravidade da fala dirigida contra Deus
  choice: Empregar “blasfemou” e conservar a identificação culminante “o Santo de Israel”
  alternative: Usar termos menos específicos, como “insultou” ou “difamou”
  rationale: A acusação ultrapassa arrogância política e caracteriza a fala como ultraje sacrílego contra o Deus de Israel, sentido sustentado pelo verbo hebraico e pelo objeto expresso no clímax.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A segunda pessoa hebraica foi vertida por “você”, evitando flexões regionais de “tu”. A repetição interrogativa e o clímax final foram preservados.
