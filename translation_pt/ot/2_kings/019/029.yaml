base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/029.yaml
  text: 'And this shall be the sign for you: this year eat what grows by itself[a], and in the second year what springs from that; and in the third year sow and reap[b], and plant vineyards and eat their fruit.'
translation:
  language: pt
  text: 'E este será o sinal para você: neste ano, comam o que cresce por si só[a]; no segundo ano, o que brotar disso[b]; e, no terceiro ano, semeiem e colham, plantem vinhedos e comam o fruto deles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o que nasce espontaneamente»; o termo hebraico se refere à produção que cresce sem semeadura.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico aqui é raro e talvez signifique «segunda brotação», isto é, a produção que surge no segundo ano a partir do crescimento não semeado do ano anterior.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹת
  choice: o sinal
  rationale: אוֹת designa normalmente um sinal ou confirmação; «o sinal» é claro e natural neste contexto de garantia profética.
- source_word: אָכוֹל
  choice: comam
  rationale: O infinitivo absoluto tem aqui força injuntiva ou preditiva. O plural harmoniza com as ordens plurais explícitas que aparecem na sequência e com o povo representado pelo rei.
- source_word: סָפִיחַ
  choice: o que cresce por si só
  rationale: O substantivo se refere ao produto que nasce sem ter sido semeado; a expressão comunica o sentido em linguagem corrente, sem recorrer a um termo agrícola técnico.
- source_word: סָחִישׁ
  choice: o que brotar disso
  rationale: O termo raro provavelmente indica a produção espontânea do segundo ano, proveniente do crescimento não semeado do ano anterior. A formulação preserva a relação sequencial sem apresentar como certa uma definição lexical discutida.
- source_word: זִרְעוּ וְקִצְרוּ
  choice: semeiem e colham
  rationale: Os verbos plurais exprimem as ações agrícolas normais que seriam retomadas no terceiro ano.
- source_word: וְנִטְעוּ כְרָמִים
  choice: plantem vinhedos
  rationale: Tradução direta e idiomática da expressão agrícola hebraica.
- source_word: וְאִכְלוּ פִרְיָם
  choice: comam o fruto deles
  rationale: O sufixo plural retoma mais naturalmente «vinhedos». «O fruto deles» conserva essa referência gramatical e o sentido concreto do hebraico.
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A mudança de «para você» no singular para as ações no plural reflete o hebraico: o sinal é dirigido ao rei, enquanto as ordens agrícolas dizem respeito à comunidade. A sequência usa «e», sem introduzir um contraste ausente do texto-fonte.'
