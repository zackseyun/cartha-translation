    issue: “foram humilhados” para וַיֵּבֹשׁוּ
    rationale: O hebraico expressa primariamente vergonha/desonra experimentada pelos habitantes; a passiva portuguesa pode sugerir de modo indevido uma ação explícita de humilhação.
  - severity: low
    issue: “ficaram arrasados” para חַתּוּ
    rationale: Embora defensável, “arrasados” tende a intensificar a ideia de devastação. “Consternados” preserva melhor a faixa de sentidos de desalento, pavor ou abatimento.
  - severity: medium
    issue: “plantas crestadas antes de crescer” para וּשְׁדֵפָה לִפְנֵי קָמָה
    rationale: A formulação reduz a imagem agrícola de algo crestado antes de se erguer/chegar a ser cereal em pé. Uma redação ligeiramente mais explícita é natural sem resolver além do necessário a construção compacta.
