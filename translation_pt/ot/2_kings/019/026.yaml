review_pass:
  verdict: revise
  source_fidelity: A tradução preserva a progressão geral e as imagens vegetais. Contudo, “foram humilhados” torna excessivamente passivo/causativo o verbo בוש, cujo sentido básico aqui é ficarem envergonhados. “Arrasados” é possível, mas é menos preciso que “consternados” para חתו. A imagem final deve conservar mais claramente a noção de vegetação atingida pelo crestamento antes de se erguer.
  naturalness: O português é claro e de registro adequado. A revisão torna a sequência paralela de comparações mais fluente e evita que “antes de crescer” soe como simples crescimento genérico, preservando a imagem de desenvolvimento agrícola.
  terminology: “Sem forças” traduz bem o idiomatismo “curtos de mão”. “Erva do campo”, “vegetação verde” e “erva dos telhados” são naturais e mantêm as imagens hebraicas. “Envergonhados” evita a interpretação adicional de humilhação imposta por outro agente.
  issues:
