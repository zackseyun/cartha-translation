  text: וְ/יֹֽשְׁבֵי/הֶן֙ קִצְרֵי יָ֔ד חַ֖תּוּ וַ/יֵּבֹ֑שׁוּ הָי֞וּ עֵ֤שֶׂב שָׂדֶה֙ וִ֣/ירַק דֶּ֔שֶׁא חֲצִ֣יר גַּגּ֔וֹת וּ/שְׁדֵפָ֖ה לִ/פְנֵ֥י קָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/026.yaml
  text: Therefore their inhabitants were short of strength[a]; they were dismayed and put to shame. They were like the grass of the field and green growth, like grass on the housetops[c][b], and scorched before it is grown.
translation:
  language: pt
  text: Por isso, os seus habitantes ficaram sem forças[a]; ficaram consternados[b] e envergonhados. Eram como a erva do campo e a vegetação verde, como a erva dos telhados e como vegetação crestada antes de se erguer[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “curtos de mão”, expressão idiomática que indica falta de poder ou capacidade.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ficaram desalentados”, “ficaram aterrorizados” ou “ficaram quebrantados”. O verbo pode transmitir abatimento, pavor ou desintegração moral.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “como o crestamento diante do cereal em pé”. A imagem agrícola hebraica é compacta e pode referir-se a vegetação crestada antes de se erguer ou de chegar a ser uma plantação em pé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹשְׁבֵיהֶן
  choice: os seus habitantes
  rationale: O sufixo pronominal retoma as cidades mencionadas no contexto; “habitantes” é claro e mantém a referência coletiva.
- source_word: קִצְרֵי יָד
  choice: ficaram sem forças
  rationale: A expressão significa literalmente “curtos de mão” e é um modo idiomático de indicar falta de poder ou capacidade.
- source_word: חַתּוּ
  choice: ficaram arrasados
  rationale: O verbo pode expressar abatimento, terror ou desintegração moral. “Arrasados” preserva sua força sem restringi-lo apenas a uma emoção.
- source_word: וַיֵּבֹשׁוּ
  choice: foram humilhados
  rationale: Expressa o resultado de vergonha e desonra pública; a forma escolhida é natural no contexto de derrota.
- source_word: הָיוּ
  choice: eram como
  rationale: Introduz a série de comparações vegetais sem exigir que o verbo seja entendido explicitamente como mudança de estado.
- source_word: עֵשֶׂב שָׂדֶה
  choice: a erva do campo
  rationale: Reproduz diretamente a imagem de vegetação comum e frágil.
- source_word: וִירַק דֶּשֶׁא
  choice: a vegetação verde
  rationale: Comunica a ideia de crescimento verde e tenro em linguagem atual e abrangente.
- source_word: חֲצִיר גַּגּוֹת
  choice: a relva dos telhados
  rationale: Mantém a imagem antiga da vegetação rasa que brota nos telhados e seca rapidamente.
- source_word: וּשְׁדֵפָה לִפְנֵי קָמָה
  choice: plantas crestadas antes de crescer
  rationale: Apresenta de modo inteligível a imagem agrícola compacta de algo queimado ou atingido pelo crestamento antes de chegar a ser cereal em pé, sem especificar indevidamente a causa.
