source:
  edition: WLC
  text: הִנְ/נִ֨י נֹתֵ֥ן בּ/וֹ֙ ר֔וּחַ וְ/שָׁמַ֥ע שְׁמוּעָ֖ה וְ/שָׁ֣ב לְ/אַרְצ֑/וֹ וְ/הִפַּלְתִּ֥י/ו בַּ/חֶ֖רֶב בְּ/אַרְצֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/007.yaml
  text: Look[a], I am putting a spirit in him, and he will hear a report and return to his own land[b], and I will make him fall by the sword in his own land.
translation:
  language: pt
  text: Eis que vou pôr nele um espírito[a]. Ele ouvirá uma notícia[b] e voltará para a sua terra; então farei que caia à espada na sua própria terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma disposição”; a palavra hebraica também pode significar “vento” ou “sopro”.
    reason: lexical_alternative
  - marker: b
    text: Ou “um relato” ou “um rumor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי נֹתֵן
  choice: Eis que vou pôr
  rationale: A construção com הִנְנִי e o particípio apresenta com força uma ação divina iminente. “Eis que” conserva o chamado de atenção, e “vou pôr” comunica a iminência em português atual.
- source_word: רוּחַ
  choice: um espírito
  rationale: O termo pode indicar espírito, vento, sopro ou uma disposição interior. “Um espírito” mantém a amplitude lexical e não define indevidamente o modo da ação divina.
- source_word: וְשָׁמַע שְׁמוּעָה
  choice: Ele ouvirá uma notícia
  rationale: שְׁמוּעָה designa algo ouvido, como notícia, relato ou rumor. “Notícia” é natural e suficientemente ampla no contexto.
- source_word: וְשָׁב לְאַרְצוֹ
  choice: e voltará para a sua terra
  rationale: A formulação preserva o sentido direcional de שׁוב e expressa naturalmente o sufixo possessivo.
- source_word: וְהִפַּלְתִּיו
  choice: então farei que caia
  rationale: A forma causativa de נפל é mantida de modo transparente, sem substituí-la por uma expressão mais interpretativa como “matarei” ou “derrubarei”.
- source_word: בַּחֶרֶב
  choice: à espada
  rationale: A expressão portuguesa conserva o valor instrumental e o uso bíblico da espada como meio de morte violenta.
- source_word: בְּאַרְצוֹ
  choice: na sua própria terra
  rationale: “Própria” torna explícita a referência possessiva e ressalta a repetição enfática e irônica do lugar de sua queda.
theological_decisions:
- issue: Sentido de רוּחַ no anúncio do juízo divino
  choice: um espírito
  alternative: uma disposição; um vento; um sopro
  rationale: O contexto apresenta a ação soberana de Deus levando o rei assírio a ouvir uma notícia e regressar, mas não especifica claramente o mecanismo. “Um espírito” preserva essa tensão e a amplitude do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Eis que” preserva a força solene do anúncio sem recorrer a linguagem arcaica em todo o versículo; “vou pôr” expressa a ação iminente com naturalidade.
