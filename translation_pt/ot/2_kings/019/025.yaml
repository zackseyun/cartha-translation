  to: Você não ouviu? Há muito tempo, eu o fiz; desde os dias antigos, eu o formei[a]. Agora eu o realizei, para que você reduzisse cidades fortificadas a montes de ruínas[b].
  rationale: A revisão preserva o sentido do hebraico e a ambiguidade lexical relevante, mas uniformiza o referente pronominal (“o”) e usa “eu o realizei” para a concretização presente do que Deus fez e formou desde tempos antigos. As duas notas ligadas ao primeiro membro foram reunidas sob um único marcador, pois ambas incidem sobre a mesma oração e não é necessária uma âncora separada para cada alternativa.
