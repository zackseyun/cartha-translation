base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/025.yaml
  text: Have you not heard? Long ago I made it[a]; from days of old I formed it. Now I have brought it to pass[c][b], that you should lay waste fortified cities into heaps of ruins.
translation:
  language: pt
  text: Você não ouviu? Há muito tempo, eu o fiz; desde os dias antigos, eu o formei[a]. Agora eu o realizei, para que você reduzisse cidades fortificadas a montes de ruínas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de longe”; a expressão hebraica pode ter sentido espacial, mas, neste contexto, provavelmente indica um passado remoto. Ou “eu o modelei”; o verbo também pode sugerir a ideia de elaborar ou planejar.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica é difícil; também pode ser entendida como “montões desolados” ou “montões em ruínas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא שָׁמַעְתָּ
  choice: Você não ouviu?
  rationale: Preserva a pergunta retórica, que pressupõe resposta afirmativa, em português natural e direto.
- source_word: לְמֵרָחוֹק
  choice: Há muito tempo
  rationale: Embora a expressão possa ter sentido espacial, o paralelismo com “desde os dias antigos” favorece aqui o sentido temporal.
- source_word: אֹתָהּ עָשִׂיתִי
  choice: fiz isso
  rationale: O pronome feminino hebraico retoma implicitamente o acontecimento ou propósito mencionado no contexto; “isso” evita atribuir-lhe em português um referente gramatical mais específico do que o texto fornece.
- source_word: לְמִימֵי קֶדֶם
  choice: desde os dias antigos
  rationale: Expressa antiguidade remota com linguagem digna e compreensível, mantendo o paralelismo temporal.
- source_word: וִיצַרְתִּיהָ
  choice: eu o formei
  rationale: Mantém a imagem de dar forma ou configurar algo, sem substituir o verbo por uma interpretação explícita como “planejei”.
- source_word: עַתָּה הֲבֵיאתִיהָ
  choice: Agora fiz com que se realizasse
  rationale: Comunica idiomaticamente a passagem do propósito antigo à sua realização presente; uma versão puramente espacial, “eu o trouxe”, seria obscura neste contexto.
- source_word: וּתְהִי לַהְשׁוֹת
  choice: para que você reduzisse
  rationale: Expressa a finalidade ou resultado dirigido ao rei assírio e conserva a força causativa e destrutiva do infinitivo.
- source_word: גַּלִּים נִצִּים עָרִים בְּצֻרוֹת
  choice: cidades fortificadas a montes de ruínas
  rationale: 'Apresenta com clareza a imagem geral da difícil expressão hebraica: cidades defensáveis transformadas em montões pela destruição.'
theological_decisions:
- issue: A soberania divina sobre as conquistas assírias
  choice: A formulação mostra que o êxito militar assírio ocorre dentro de um propósito divino estabelecido desde a antiguidade e agora realizado.
  alternative: Enfraquecer a afirmação para mera presciência divina, ou intensificá-la mediante uma formulação filosófica de causalidade exaustiva.
  rationale: Os verbos hebraicos afirmam ação e propósito prévios de Deus, seguidos de realização presente. A tradução preserva essa forte linguagem de soberania sem declarar aprovação moral das ações da Assíria nem impor uma teoria causal além do texto.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A segunda pessoa é expressa por “você”, natural no português brasileiro contemporâneo e suficientemente clara no discurso dirigido ao rei assírio. As notas preservam as ambiguidades temporal/espacial e lexical sem sobrecarregar o texto principal.
