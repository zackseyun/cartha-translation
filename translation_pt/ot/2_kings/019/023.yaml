    issue: «carros» sem qualificação
    rationale: No português contemporâneo, sobretudo para leitores brasileiros, «carros» normalmente designa automóveis. O contexto e רִכְבִּי referem-se à força de carros de guerra.
  - severity: low
    issue: «cedros mais altos»
    rationale: A expressão hebraica descreve a altura/estatura dos cedros; não requer necessariamente a ideia comparativa-superlativa de «mais altos».
  - severity: low
    issue: Formulação de elevação e alojamento
    rationale: «Às alturas dos montes» e «lugar de repouso mais remoto» oferecem português mais natural, conservando respectivamente a imagem das alturas e a dificuldade lexical de מְלוֹן.
