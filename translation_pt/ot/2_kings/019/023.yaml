  to: 'Por meio dos teus mensageiros, insultaste o Senhor e disseste: “Com os meus muitos carros de guerra, eu mesmo subi às alturas dos montes, aos lugares mais remotos do Líbano. Derrubarei seus cedros altos e seus ciprestes mais seletos[a]. Entrarei em seu lugar de repouso mais remoto, em sua floresta exuberante.”'
