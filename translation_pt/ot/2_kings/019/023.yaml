  text: בְּ/יַ֣ד מַלְאָכֶי/ךָ֮ חֵרַ֣פְתָּ אֲדֹנָ/י֒ וַ/תֹּ֗אמֶר ב/רכב רִכְבִּ֛/י אֲנִ֥י עָלִ֛יתִי מְר֥וֹם הָרִ֖ים יַרְכְּתֵ֣י לְבָנ֑וֹן וְ/אֶכְרֹ֞ת קוֹמַ֤ת אֲרָזָי/ו֙ מִבְח֣וֹר בְּרֹשָׁ֔י/ו וְ/אָב֨וֹאָה֙ מְל֣וֹן קִצֹּ֔/ה יַ֖עַר כַּרְמִלּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/023.yaml
  text: By the hand of your messengers you have mocked the Lord[a], and you have said, ‘With my many chariots I myself have gone up to the heights of the mountains, to the remotest parts of Lebanon; and I will cut down its tall cedars, its choicest cypresses, and I will enter its farthest lodging place, its forest garden.’
translation:
  language: pt
  text: 'Por meio dos teus mensageiros, insultaste o Senhor e disseste: “Com os meus muitos carros de guerra, eu mesmo subi às alturas dos montes, aos lugares mais remotos do Líbano. Derrubarei seus cedros altos e seus ciprestes mais seletos[a]. Entrarei em seu lugar de repouso mais remoto, em sua floresta exuberante.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus melhores abetos”; não se sabe ao certo qual espécie de árvore o termo hebraico designa.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד מַלְאָכֶיךָ
  choice: Por meio dos teus mensageiros
  rationale: A expressão idiomática בְּיַד indica agência ou instrumento. “Por meio de” transmite esse sentido com naturalidade em português, e “mensageiros” é apropriado ao contexto político e militar.
- source_word: חֵרַפְתָּ
  choice: insultaste
  rationale: O verbo חרף denota afrontar, escarnecer ou tratar com desprezo. “Insultaste” comunica de modo claro a afronta dirigida ao Senhor.
- source_word: אֲדֹנָי
  choice: o Senhor
  rationale: O texto consonantal traz אֲדֹנָי, e não o nome divino YHWH; “o Senhor” preserva essa distinção.
- source_word: בְּרֹב רִכְבִּי
  choice: Com os meus muitos carros
  rationale: A expressão destaca a grande quantidade de carros de guerra e, assim, a ostentação do poder militar do falante.
- source_word: אֲנִי עָלִיתִי
  choice: eu mesmo subi
  rationale: O pronome independente אֲנִי acrescenta ênfase ao sujeito; “eu mesmo” reproduz essa ênfase em português.
- source_word: מְרוֹם הָרִים
  choice: ao alto dos montes
  rationale: A formulação conserva a imagem concreta das elevações montanhosas em português claro e conciso.
- source_word: יַרְכְּתֵי לְבָנוֹן
  choice: aos lugares mais remotos do Líbano
  rationale: יַרְכְּתֵי designa as partes extremas, recônditas ou mais distantes de um lugar.
- source_word: קוֹמַת אֲרָזָיו
  choice: seus cedros mais altos
  rationale: קוֹמָה expressa altura ou estatura; no contexto, qualifica os imponentes cedros do Líbano.
- source_word: מִבְחוֹר בְּרֹשָׁיו
  choice: seus ciprestes mais seletos
  rationale: מִבְחוֹר indica aquilo que é escolhido ou excelente. בְּרוֹשׁ designa uma conífera cuja espécie exata é incerta; “ciprestes” é uma identificação comum, com alternativa registrada em nota.
- source_word: מְלוֹן קִצֹּה
  choice: seu pouso mais remoto
  rationale: מָלוֹן é lugar de pouso, pernoite ou parada, e קִצֹּה indica sua extremidade. A tradução mantém a imagem incomum do hebraico sem convertê-la silenciosamente em outra metáfora.
- source_word: יַעַר כַּרְמִלּוֹ
  choice: sua floresta exuberante
  rationale: כַּרְמֶל pode indicar terreno fértil, pomar ou vegetação viçosa. “Floresta exuberante” comunica a imagem de uma mata fértil e luxuriante no contexto do Líbano.
theological_decisions:
- issue: Distinção entre אֲדֹנָי e YHWH
  choice: o Senhor
  alternative: o SENHOR
  rationale: Neste versículo, o hebraico traz אֲדֹנָי, não o tetragrama. A forma “Senhor” evita identificar os dois termos graficamente e preserva a distinção do texto-fonte.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. A fala mantém o tom arrogante da ostentação militar. A expressão incomum “pouso mais remoto” conserva a dificuldade imagética do hebraico, enquanto “floresta exuberante” comunica de modo inteligível o valor fértil e viçoso de כַּרְמֶל.
