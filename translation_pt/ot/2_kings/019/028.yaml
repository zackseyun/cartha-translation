  text: יַ֚עַן הִתְרַגֶּזְ/ךָ֣ אֵלַ֔/י וְ/שַׁאֲנַנְ/ךָ֖ עָלָ֣ה בְ/אָזְנָ֑/י וְ/שַׂמְתִּ֨י חַחִ֜/י בְּ/אַפֶּ֗/ךָ וּ/מִתְגִּ/י֙ בִּ/שְׂפָתֶ֔י/ךָ וַ/הֲשִׁ֣בֹתִ֔י/ךָ בַּ/דֶּ֖רֶךְ אֲשֶׁר בָּ֥אתָ בָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/028.yaml
  text: Because your raging against me and your complacency have come up into my ears[a], I will put my hook in your nose and my bit in your lips, and I will turn you back by the way by which you came.
translation:
  language: pt
  text: Porque a sua fúria contra mim e a sua segurança presunçosa[a] subiram aos meus ouvidos, porei o meu gancho no seu nariz e o meu freio nos seus lábios; eu o farei voltar pelo caminho por onde veio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a sua arrogância», «a sua autoconfiança» ou «a sua tranquilidade complacente». O termo hebraico indica tranquilidade ou segurança autoconfiante, aqui em contexto hostil.
    reason: Alternativa lexical para preservar a amplitude semântica de שַׁאֲנַנְךָ.
lexical_decisions:
- source_word: יַעַן
  choice: Porque
  rationale: Introduz diretamente a causa do juízo anunciado e soa natural no português atual.
- source_word: הִתְרַגֶּזְךָ אֵלַי
  choice: a sua fúria contra mim
  rationale: Expressa a agitação hostil e intensa dirigida contra Deus, sem reduzir a expressão a mera irritação.
- source_word: שַׁאֲנַנְךָ
  choice: a sua segurança presunçosa
  rationale: O termo denota tranquilidade ou segurança autoconfiante; no contexto hostil, a qualificação «presunçosa» comunica seu caráter culpável sem apagar a ideia básica de segurança.
- source_word: עָלָה בְאָזְנָי
  choice: subiram aos meus ouvidos
  rationale: Conserva a imagem concreta e antropomórfica do hebraico, em vez de reduzi-la ao simples «chegaram ao meu conhecimento».
- source_word: חַחִי
  choice: o meu gancho
  rationale: Designa um gancho ou argola empregado para dominar um animal ou prisioneiro; «gancho» torna clara a imagem de sujeição.
- source_word: בְּאַפֶּךָ
  choice: no seu nariz
  rationale: O substantivo tem aqui sentido físico, exigido pela imagem do gancho, e não o sentido figurado de ira.
- source_word: מִתְגִּי
  choice: o meu freio
  rationale: Refere-se ao instrumento colocado na boca para controlar um animal; «freio» é preciso e corrente em português.
- source_word: בִּשְׂפָתֶיךָ
  choice: nos seus lábios
  rationale: Mantém a referência concreta aos lábios, embora em português fosse possível generalizar para «boca».
- source_word: וַהֲשִׁבֹתִיךָ
  choice: eu o farei voltar
  rationale: Preserva o valor causativo do verbo e destaca que Deus força o invasor a regressar.
- source_word: בַּדֶּרֶךְ אֲשֶׁר בָּאתָ בָּהּ
  choice: pelo caminho por onde veio
  rationale: 'Reproduz com naturalidade a simetria do juízo: o invasor regressará pela mesma rota de sua chegada.'
theological_decisions:
- issue: Linguagem antropomórfica sobre Deus ouvir e subjugar o rei assírio
  choice: Preservar as imagens «subiram aos meus ouvidos», «meu gancho» e «meu freio»
  alternative: Substituí-las por abstrações como «eu ouvi» e «eu o dominarei»
  rationale: As imagens corporais e de contenção comunicam vividamente o conhecimento de Deus e sua soberania sobre o rei arrogante, sem exigir explicação especulativa sobre a natureza divina.
- issue: Nuance de שַׁאֲנַנְךָ
  choice: Traduzir por «segurança presunçosa» no texto principal
  alternative: «arrogância», «autoconfiança» ou «tranquilidade complacente»
  rationale: A expressão conserva a noção lexical de segurança tranquila e, ao mesmo tempo, deixa claro o tom condenatório do contexto. A nota registra alternativas legítimas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de tratamento na terceira pessoa para favorecer a legibilidade brasileira. A construção «subiram aos meus ouvidos» conserva deliberadamente a imagem hebraica, enquanto «pelo caminho por onde veio» evita rigidez desnecessária.
