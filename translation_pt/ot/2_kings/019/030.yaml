  text: וְ/יָ֨סְפָ֜ה פְּלֵיטַ֧ת בֵּית יְהוּדָ֛ה הַ/נִּשְׁאָרָ֖ה שֹׁ֣רֶשׁ לְ/מָ֑טָּה וְ/עָשָׂ֥ה פְרִ֖י לְ/מָֽעְלָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/030.yaml
  text: And the surviving remnant of the house of Judah will again take root downward and bear fruit upward[a].
translation:
  language: pt
  text: E o remanescente sobrevivente da casa de Judá voltará[a] a lançar raízes para baixo e dará fruto para cima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: continuará a lançar raízes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָסְפָה
  choice: voltará a
  rationale: O verbo יסף, ligado à ação seguinte, indica aqui ação renovada ou continuada. “Voltará a” comunica naturalmente a restauração anunciada, sem recorrer ao literal e pouco idiomático “acrescentará”.
- source_word: פְּלֵיטַת בֵּית יְהוּדָה הַנִּשְׁאָרָה
  choice: o remanescente da casa de Judá que tiver sobrevivido
  rationale: A formulação preserva tanto a ideia de um grupo que escapou ou sobreviveu (פְּלֵיטָה) quanto a qualificação de que ele permaneceu (הַנִּשְׁאָרָה), evitando a expressão pouco natural “remanescente sobrevivente”.
- source_word: שֹׁרֶשׁ
  choice: lançar raízes
  rationale: Embora a forma hebraica seja nominal, a construção significa criar ou firmar raízes. “Lançar raízes” mantém a imagem agrícola e é idiomático em português.
- source_word: לְמָטָּה
  choice: para baixo
  rationale: Preserva a direção e o contraste poético com לְמָעְלָה, “para cima”.
- source_word: וְעָשָׂה פְרִי
  choice: e dará fruto
  rationale: Com פְרִי, עשה expressa produzir ou dar fruto. A tradução mantém a metáfora agrícola e sua ideia de restauração e florescimento.
- source_word: לְמָעְלָה
  choice: para cima
  rationale: Mantém o paralelismo vertical entre as raízes abaixo e o fruto acima.
theological_decisions:
- issue: A linguagem do remanescente em um oráculo de restauração
  choice: o remanescente da casa de Judá que tiver sobrevivido
  alternative: os sobreviventes da casa de Judá que restarem
  rationale: A opção principal conserva o substantivo coletivo singular e o motivo bíblico do remanescente, sem extrair da imagem agrícola conclusões doutrinárias posteriores ao enunciado.
- issue: Ação renovada ou continuada de criar raízes
  choice: voltará a lançar raízes
  alternative: continuará a lançar raízes
  rationale: O contexto favorece a renovação após a devastação, mas a forma hebraica também pode indicar continuação. A alternativa é registrada em nota, preservando a amplitude semântica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem “raízes para baixo” e “fruto para cima” preserva o paralelismo poético do hebraico; a construção verbal foi ajustada ao uso natural do português.
