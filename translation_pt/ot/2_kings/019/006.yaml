  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ יְשַֽׁעְיָ֔הוּ כֹּ֥ה תֹאמְר֖וּ/ן אֶל אֲדֹֽנֵי/כֶ֑ם כֹּ֣ה אָמַ֣ר יְהוָ֗ה אַל תִּירָא֙ מִ/פְּנֵ֤י הַ/דְּבָרִים֙ אֲשֶׁ֣ר שָׁמַ֗עְתָּ אֲשֶׁ֧ר גִּדְּפ֛וּ נַעֲרֵ֥י מֶֽלֶךְ אַשּׁ֖וּר אֹתִֽ/י־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/006.yaml
  text: 'Isaiah said to them[a], “Thus you shall say to your master: Thus says Yahweh, ‘Do not be afraid because of the words that you have heard, with which the servants of the king of Assyria have blasphemed me.’”'
translation:
  language: pt
  text: 'Isaías lhes disse: “Assim digam ao seu senhor: Assim diz Yahweh: ‘Não tenha medo das palavras que você ouviu, com as quais os servos[a] do rei da Assíria blasfemaram contra mim.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os jovens” ou “os assistentes”. O termo hebraico pode designar jovens, mas aqui provavelmente se refere a servidores ou oficiais do rei.
    reason: Alternativa lexical que preserva a amplitude semântica de נַעֲרֵי.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: Forma narrativa comum de אמר; o pretérito perfeito simples é natural na narrativa portuguesa.
- source_word: אֲדֹנֵיכֶם
  choice: seu senhor
  rationale: Refere-se a Ezequias como superior dos mensageiros. “Senhor” preserva a relação de autoridade sem ser confundido aqui com o nome divino, explicitamente traduzido como Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em conformidade com a prática do projeto.
- source_word: אַל תִּירָא
  choice: Não tenha medo
  rationale: Expressa de modo natural e direto a proibição com valor de encorajamento dirigida a Ezequias.
- source_word: מִפְּנֵי הַדְּבָרִים
  choice: das palavras
  rationale: A preposição indica a causa do medo, e דְּבָרִים se refere, neste contexto, às ameaças proferidas.
- source_word: שָׁמַעְתָּ
  choice: você ouviu
  rationale: O pretérito perfeito português comunica uma ação concluída ainda relevante no contexto imediato.
- source_word: גִּדְּפוּ
  choice: blasfemaram
  rationale: Como o objeto é o próprio Yahweh, o verbo indica fala sacrílega e desafiadora, não apenas insulto comum.
- source_word: נַעֲרֵי מֶלֶךְ אַשּׁוּר
  choice: os servos do rei da Assíria
  rationale: Embora נַעֲרִים possa significar literalmente “jovens”, em contexto régio pode designar servidores, assistentes ou oficiais; “servos” comunica adequadamente sua função como representantes do rei.
- source_word: אֹתִי
  choice: me
  rationale: Mantém explícito o objeto direto e o caráter pessoal da afronta contra Yahweh.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Intensidade de גִּדְּפוּ quando dirigido contra Deus
  choice: me blasfemaram
  alternative: me insultaram; zombaram de mim
  rationale: O objeto divino confere à fala o caráter de afronta sacrílega. “Blasfemaram” conserva esse peso teológico sem acrescentar explicações ao texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Emprega “você” no discurso singular a Ezequias e evita construções excessivamente arcaicas. O marcador da nota foi colocado junto a “servos”, termo ao qual a alternativa lexical de fato se refere.
