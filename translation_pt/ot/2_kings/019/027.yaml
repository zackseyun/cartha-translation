  text: But I know your sitting down[a], your going out, and your coming in[b], and your raging against me.
translation:
  language: pt
  text: Mas eu conheço o seu sentar-se, o seu sair e o seu entrar[a], e a sua fúria contra mim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica «o seu sentar-se, o seu sair e o seu entrar» abrange todos os movimentos e toda a conduta de uma pessoa.
    reason: cultural_note
  - marker: b
    text: 'Ou: «a sua agitação contra mim» ou «o seu furor contra mim».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁבְתְּךָ
  choice: quando você se senta
  rationale: Preserva a imagem concreta de ישׁב e, com «quando sai e quando entra», forma uma expressão abrangente sobre os movimentos e a conduta da pessoa. A construção temporal é mais natural em português do que «o seu sentar-se».
- source_word: וְצֵאתְךָ
  choice: quando sai
  rationale: Traduz naturalmente o verbo יצא e mantém seu paralelismo idiomático com «quando entra».
- source_word: וּבֹאֲךָ
  choice: quando entra
  rationale: Traduz בוא de modo corrente e completa o merismo formado com «quando sai».
- source_word: יָדָעְתִּי
  choice: eu sei / conheço
  rationale: O perfeito de ידע comunica aqui conhecimento firme e abrangente. Em português, o presente expressa bem esse valor; «conheço» na segunda ocorrência evita uma repetição pesada sem alterar o sentido.
- source_word: הִתְרַגֶּזְךָ
  choice: a sua fúria
  rationale: O Hitpael de רגז denota agitação intensa ou furor. «Fúria» transmite a força hostil do termo no contexto sem acrescentar a ideia mais interpretativa de insolência.
- source_word: אֵלָי
  choice: contra mim
  rationale: Embora אֶל normalmente indique direção, a associação com a fúria torna natural e contextualmente adequado o sentido adversativo «contra mim».
- source_word: וְאֵת
  choice: e
  rationale: A conjunção introduz mais um objeto de ידע, enquanto o marcador de objeto direto não recebe tradução independente em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura natural no Brasil, sem regionalismos marcados. A formulação com «você» torna explícita a segunda pessoa masculina singular sem recorrer à construção nominal pouco idiomática «o seu sentar-se». O «mas» representa o valor adversativo contextual do וְ inicial.
