  text: בַּ/דֶּ֥רֶךְ אֲשֶׁר יָבֹ֖א בָּ֣/הּ יָשׁ֑וּב וְ/אֶל הָ/עִ֥יר הַ/זֹּ֛את לֹ֥א יָבֹ֖א נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/033.yaml
  text: By the way that he came[a], by it he will return, and he will not come to this city, declares Yahweh.
translation:
  language: pt
  text: Pelo caminho por onde veio[a], por ele voltará; e não virá a esta cidade, declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “Voltará pelo mesmo caminho por onde veio”.'
    reason: alternativa lexical e idiomática
lexical_decisions:
- source_word: בַּדֶּרֶךְ אֲשֶׁר יָבֹא בָּהּ
  choice: Pelo caminho pelo qual veio, por ele
  rationale: 'Preserva a repetição e a referência explícita do hebraico: o pronome בָּהּ retoma דֶּרֶךְ e indica que o invasor regressará pela mesma rota de sua chegada.'
- source_word: יָשׁוּב
  choice: voltará
  rationale: שׁוּב expressa aqui o retorno ou recuo pela rota anterior; o futuro comunica a certeza da declaração profética.
- source_word: וְאֶל הָעִיר הַזֹּאת לֹא יָבֹא
  choice: e não virá a esta cidade
  rationale: Mantém o sentido direto de בוא, “vir, chegar”, sem acrescentar a ideia mais específica de entrar, embora ela seja possível no contexto.
- source_word: נְאֻם יְהוָה
  choice: declaração de Yahweh
  rationale: נְאֻם é uma fórmula profética solene, e יְהוָה é vertido pelo nome pessoal Yahweh.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Alcance de לֹא יָבֹא em relação à cidade
  choice: não virá a esta cidade
  alternative: não entrará nesta cidade
  rationale: A tradução conserva o verbo geral בוא e evita tornar explícita uma noção de entrada que o contexto pode sugerir, mas que o verbo por si só não exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção principal conserva a retomada pronominal do hebraico; a nota oferece a formulação portuguesa mais fluente.
