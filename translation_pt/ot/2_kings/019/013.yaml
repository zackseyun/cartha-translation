base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/013.yaml
  text: Where is the king of Hamath[a], and the king of Arpad, and the king of the city of Sepharvaim, Hena, and Ivvah?
translation:
  language: pt
  text: Onde está o rei de Hamate, o rei de Arpade e o rei da cidade de Sefarvaim, Hena e Iva?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A relação sintática de Hena e Iva é incerta. Esses nomes podem ser entendidos como topônimos adicionais ligados a «rei», e não como especificações de «cidade».
    reason: ambiguity
lexical_decisions:
- source_word: אַיּוֹ
  choice: Onde está
  rationale: O advérbio interrogativo com sufixo masculino singular pergunta retoricamente pelo paradeiro ou destino do rei; o singular hebraico é preservado, embora a enumeração abranja vários reis.
- source_word: מֶלֶךְ
  choice: rei
  rationale: Equivalente comum de מֶלֶךְ. A repetição diante de Hamate, Arpade e da cidade de Sefarvaim é mantida para preservar a força retórica.
- source_word: חֲמָת
  choice: Hamate
  rationale: Forma tradicional e legível em português para o topônimo hebraico.
- source_word: אַרְפָּד
  choice: Arpade
  rationale: Transliteração corrente em português, ajustada à pronúncia e ortografia naturais do idioma.
- source_word: לָעִיר סְפַרְוָיִם
  choice: da cidade de Sefarvaim
  rationale: Mantém explicitamente עִיר, “cidade”, e entende a preposição ל como expressão da relação com o rei mencionado.
- source_word: הֵנַע
  choice: Hena
  rationale: Transliteração direta e corrente do topônimo.
- source_word: וְעִוָּה
  choice: e de Iva
  rationale: O topônimo continua a série ligada à construção anterior; a preposição é explicitada em português para tornar clara essa relação sintática.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas toponímicas tradicionais em português. Preserva-se o singular “Onde está”, correspondente ao hebraico, e a repetição de “rei”; a nota registra a ambiguidade real da sequência final de topônimos.
