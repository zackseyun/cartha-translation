base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/020.yaml
  text: 'Then Isaiah son of Amoz sent to Hezekiah, saying, “Thus says the LORD, the God of Israel: Because you have prayed to me concerning Sennacherib king of Assyria, I have heard.”'
translation:
  language: pt
  text: 'Então Isaías, filho de Amoz, mandou dizer a Ezequias: “Assim diz o SENHOR, o Deus de Israel: Ouvi a oração que você me dirigiu a respeito de Senaqueribe, rei da Assíria.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח ... אֶל
  choice: mandou dizer a
  rationale: O hebraico diz literalmente que Isaías “enviou a Ezequias, dizendo”; em português, “mandou dizer a” transmite naturalmente o envio de uma mensagem sem acrescentar um mensageiro não expresso.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Representa o nome divino segundo a convenção editorial portuguesa amplamente reconhecida, distinguindo-o do título comum “Senhor”.
- source_word: אֲשֶׁר הִתְפַּלַּלְתָּ אֵלַי ... שָׁמָעְתִּי
  choice: Ouvi a oração que você fez a mim
  rationale: A construção hebraica antepõe a oração relativa e termina com “ouvi”. Esta formulação preserva o sentido e produz uma frase completa e natural em português; “ouvir uma oração” implica acolher o pedido no contexto, sem explicitar além do texto.
- source_word: אֶל סַנְחֵרִב
  choice: a respeito de Senaqueribe
  rationale: A preposição אֶל, neste contexto de oração dirigida contra ou acerca do invasor, é vertida de modo não excessivamente interpretativo como “a respeito de”.
theological_decisions:
- issue: Sentido de אֲשֶׁר no início da declaração divina
  choice: 'oração relativa: “a oração que você fez ... ouvi”'
  alternative: 'causal: “Porque você orou a mim ..., eu ouvi”'
  rationale: אֲשֶׁר pode introduzir o conteúdo retomado por “ouvi”; a construção hebraica favorece aqui a leitura “aquilo que você orou... ouvi”. A tradução evita afirmar que Deus ouviu meramente por causa do ato de orar, preservando a ambiguidade sintática sem alterar a promessa contextual.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Usa “você” para o singular dirigido ao rei e mantém a fórmula profética tradicional “Assim diz o SENHOR”.
