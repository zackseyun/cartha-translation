source:
  edition: WLC
  text: הַ/הִצִּ֨ילוּ אֹתָ֜/ם אֱלֹהֵ֤י הַ/גּוֹיִם֙ אֲשֶׁ֣ר שִׁחֲת֣וּ אֲבוֹתַ֔/י אֶת גּוֹזָ֖ן וְ/אֶת חָרָ֑ן וְ/רֶ֥צֶף וּ/בְנֵי עֶ֖דֶן אֲשֶׁ֥ר בִּ/תְלַאשָּֽׂר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/012.yaml
  text: Did the gods of the nations that my fathers destroyed deliver them—Gozan[a], Haran, Rezeph, and the people of Eden who were in Tel-assar?
translation:
  language: pt
  text: Será que os deuses das nações que meus antepassados destruíram conseguiram livrá-las — Gozã, Harã, Rezefe e os habitantes de Éden que estavam em Telassar?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os filhos de Éden que estavam em Telassar”. O hebraico diz literalmente “filhos de Éden”, expressão que pode designar o povo ou os habitantes de Éden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהִצִּילוּ
  choice: Será que ... conseguiram livrar
  rationale: O hifil perfeito de נצל aparece numa pergunta retórica. “Conseguiram livrar” expressa em português natural a incapacidade alegada no desafio assírio, sem perder o sentido de resgate.
- source_word: אֹתָם
  choice: livrá-las
  rationale: O pronome objeto retoma coletivamente as nações, cidades ou populações enumeradas. O feminino plural concorda naturalmente com “nações” em português.
- source_word: אֱלֹהֵי הַגּוֹיִם
  choice: os deuses das nações
  rationale: Reproduz diretamente a construção hebraica e designa as divindades cultuadas por essas nações.
- source_word: אֲשֶׁר שִׁחֲתוּ אֲבוֹתַי
  choice: que meus antepassados destruíram
  rationale: No contexto militar, o piel de שׁחת significa destruir ou arruinar. “Antepassados” comunica com clareza que אֲבוֹתַי se refere aos predecessores do rei, evitando sugerir apenas pais imediatos.
- source_word: אֶת גּוֹזָן וְאֶת חָרָן וְרֶצֶף
  choice: Gozã, Harã, Rezefe
  rationale: Usam-se formas portuguesas legíveis e próximas dos nomes hebraicos.
- source_word: וּבְנֵי עֶדֶן
  choice: os habitantes de Éden
  rationale: Embora בְנֵי signifique literalmente “filhos de”, aqui a expressão pode designar o povo ou os habitantes associados a Éden. A alternativa literal é preservada em nota.
- source_word: אֲשֶׁר בִּתְלַאשָּׂר
  choice: que estavam em Telassar
  rationale: A preposição בְּ com o topônimo indica localização; “em Telassar” é natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A pergunta retórica e o tom provocador do discurso assírio foram preservados. “Antepassados” foi preferido a “pais” por clareza contextual.
