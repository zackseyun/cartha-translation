lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Então ... foram até
  rationale: O wayyiqtol de בוא dá sequência à narrativa. “Então” expressa naturalmente essa progressão, e “foram até” indica o movimento em direção a Isaías sem sugerir necessariamente que o narrador esteja no destino.
- source_word: עַבְדֵי
  choice: os servos do
  rationale: O plural construto de עבד pode designar servos, assistentes ou oficiais reais. “Servos” preserva a forma lexical e continua claro no contexto da corte.
- source_word: הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: rei Ezequias
  rationale: A construção identifica a posição régia de Ezequias; esta é a formulação idiomática em português.
- source_word: אֶל
  choice: até
  rationale: A preposição marca movimento dirigido a uma pessoa. Com o verbo “foram”, “até” soa natural em português e comunica a chegada ao destino.
- source_word: יְשַׁעְיָהוּ
  choice: Isaías
  rationale: Forma tradicional e amplamente reconhecida do nome do profeta em português.
