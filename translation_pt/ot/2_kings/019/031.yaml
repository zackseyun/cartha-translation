base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/031.yaml
  text: For from Jerusalem a remnant will go out[a], and from Mount Zion survivors. The zeal of Yahweh will do this.
translation:
  language: pt
  text: Pois de Jerusalém sairá um remanescente, e sobreviventes do monte Sião. O zelo[a] de Yahweh fará isso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O ciúme de Yahweh fará isso”. O substantivo hebraico pode significar tanto “zelo” como “ciúme”; aqui se refere ao intenso compromisso de Yahweh em realizar a libertação de Jerusalém.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou garantia da promessa anterior; “Pois” mantém essa ligação argumentativa em português natural.
- source_word: מִירוּשָׁלִַם תֵּצֵא שְׁאֵרִית
  choice: de Jerusalém sairá um remanescente
  rationale: Preserva a origem indicada por מִן, o movimento de יצא e o sentido profético de שְׁאֵרִית.
- source_word: וּפְלֵיטָה מֵהַר צִיּוֹן
  choice: e, do monte Sião, sobreviventes
  rationale: “Sobreviventes” comunica o valor coletivo de פְלֵיטָה, isto é, pessoas que escaparam da calamidade; a ordem mantém o paralelismo com Jerusalém.
- source_word: קִנְאַת
  choice: o zelo
  rationale: קִנְאָה pode indicar zelo ou ciúme. Neste contexto, “zelo” expressa melhor o empenho intenso de Yahweh em realizar a libertação, sem ocultar a alternativa lexical, registrada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: תַּעֲשֶׂה זֹּאת
  choice: fará isso
  rationale: Tradução direta e natural da construção com עשה e o demonstrativo זאת.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o caráter de nome pessoal sem introduzir um título substitutivo.
- issue: Nuance de קִנְאַת יְהוָה
  choice: O zelo de Yahweh
  alternative: O ciúme de Yahweh
  rationale: Ambos os sentidos pertencem ao campo semântico do substantivo. “Zelo” se ajusta ao contexto da ação poderosa e comprometida de Yahweh, enquanto a nota conserva a ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. O paralelismo poético foi preservado, e as vírgulas em torno de “do monte Sião” tornam natural a elipse do verbo “sairão”.
