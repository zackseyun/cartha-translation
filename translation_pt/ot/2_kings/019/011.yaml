  text: הִנֵּ֣ה אַתָּ֣ה שָׁמַ֗עְתָּ אֵת֩ אֲשֶׁ֨ר עָשׂ֜וּ מַלְכֵ֥י אַשּׁ֛וּר לְ/כָל הָ/אֲרָצ֖וֹת לְ/הַֽחֲרִימָ֑/ם וְ/אַתָּ֖ה תִּנָּצֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/011.yaml
  text: Look[a], you have heard what the kings of Assyria have done to all the lands, devoting them to destruction—and will you be delivered?
translation:
  language: pt
  text: Veja, você ouviu o que os reis da Assíria fizeram a todas as terras, destinando-as à destruição[a]. E você será livrado?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “destruindo-as completamente”. O hebraico diz literalmente “colocando-as sob ḥerem”, isto é, destinando-as à destruição.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Veja
  rationale: Funciona como chamado enfático à atenção. “Veja” é atual e natural, sem o tom arcaico de “eis”.
- source_word: שָׁמַעְתָּ
  choice: você ouviu
  rationale: Perfeito na segunda pessoa masculina singular. Em português, o pretérito perfeito expressa naturalmente o conhecimento adquirido e ainda relevante.
- source_word: אֵת אֲשֶׁר עָשׂוּ
  choice: o que ... fizeram
  rationale: Reproduz de modo idiomático o marcador de objeto seguido da oração relativa.
- source_word: מַלְכֵי אַשּׁוּר
  choice: os reis da Assíria
  rationale: Tradução clara e convencional da construção hebraica.
- source_word: לְכָל הָאֲרָצוֹת
  choice: a todas as terras
  rationale: Preserva o plural e o sentido de territórios ou países, não da terra inteira.
- source_word: לְהַחֲרִימָם
  choice: condenando-as à destruição
  rationale: Comunica que as terras foram destinadas à destruição total, preservando a força específica de חרם sem recorrer a jargão pouco transparente.
- source_word: וְאַתָּה תִּנָּצֵל
  choice: E você será livrado?
  rationale: Mantém o contraste enfático introduzido pelo pronome independente e a forma passiva do nifal, além da força retórica e provocadora da pergunta.
theological_decisions:
- issue: Linguagem de חרם em contexto de julgamento militar
  choice: condenando-as à destruição
  alternative: destruindo-as completamente; colocando-as sob anátema
  rationale: A formulação preserva a ideia de destinação irrevogável à destruição, própria de חרם, sem reduzir o termo a destruição genérica nem importar uma formulação doutrinária posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” corresponde ao singular enfático do hebraico; “livrado” conserva a voz passiva e a possível ressonância de intervenção salvadora.
