revisions:
- from: 'Naquela noite, o anjo de Yahweh saiu e matou cento e oitenta e cinco mil homens no acampamento da Assíria. Quando se levantaram de madrugada,[a] lá estavam todos eles: cadáveres, mortos.[b]'
  to: Naquela noite, o anjo de Yahweh saiu e abateu cento e oitenta e cinco mil no acampamento da Assíria. Quando se levantaram cedo pela manhã,[a] eis que todos eles eram cadáveres.[b]
  rationale: A revisão remove o substantivo não expresso «homens», emprega «abateu» para refletir com maior proximidade o verbo hebraico no contexto de derrota letal e reformula o desfecho para um português mais idiomático. «Eis que» conserva a força discursiva de וְהִנֵּה, e as duas notas continuam ancoradas nos pontos textualmente relevantes.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T22:30:52Z'
review_pass:
  verdict: revise
  source_fidelity: A redação acrescenta «homens» ao número, embora o hebraico diga apenas «cento e oitenta e cinco mil». «Matou» é defensável pelo resultado explicitado na segunda oração, mas «abateu» conserva melhor o verbo hebraico «feriu/golpeou» no seu uso bélico letal. A oração final deve manter הןֵּה como marcador de surpresa e a expressão enfática «cadáveres, mortos» sem produzir uma construção portuguesa artificial.
  naturalness: «Cadáveres, mortos» após dois-pontos é pouco idiomático em português. «E eis que todos eles eram cadáveres» é uma formulação bíblica moderna, compreensível e natural o suficiente, enquanto a nota explica a ênfase incomum da construção hebraica. «Quando se levantaram cedo pela manhã» preserva a indefinição do sujeito e corresponde de perto ao hebraico.
  terminology: «Yahweh» reproduz adequadamente o tetragrama segundo a decisão editorial fornecida. «O anjo de Yahweh» e «acampamento da Assíria» são fiéis ao texto; não é necessário definir a identidade do anjo além do que o versículo diz.
  issues:
  - severity: medium
    issue: Acréscimo de «homens» אחרי o numeral.
    rationale: O hebraico não inclui um substantivo para as 185 հազար vítimas. Embora o contexto seja militar, inserir «homens» restringe e explicita o que o texto não declara.
  - severity: low
    issue: «Cadáveres, mortos» é uma reprodução demasiadamente literal e pouco natural.
    rationale: A duplicação hebraica é enfática, mas em português a sequência soa truncada. A tradução deve expressar o resultado como «eram cadáveres», com nota para a forma enfática hebraica.
  - severity: low
    issue: «Matou» torna o verbo mais explícito que o hebraico.
    rationale: O verbo נכה significa primariamente ferir/golpear; o resultado no contexto é letal. «Abateu» mantém o sentido militar letal sem apagar completamente a imagem verbal.
  revised_text: Naquela noite, o anjo de Yahweh saiu e abateu cento e oitenta e cinco mil no acampamento da Assíria. Quando se levantaram cedo pela manhã,[a] eis que todos eles eram cadáveres.[b]
  revised_footnotes:
