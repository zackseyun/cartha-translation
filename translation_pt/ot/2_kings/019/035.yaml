base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/035.yaml
  text: And that night the angel of Yahweh went out and struck down one hundred eighty-five thousand in the camp of Assyria. When people rose early in the morning, behold, all of them were dead bodies.
translation:
  language: pt
  text: Naquela noite, o anjo de Yahweh saiu e abateu cento e oitenta e cinco mil no acampamento da Assíria. Quando se levantaram cedo pela manhã,[a] eis que todos eles eram cadáveres.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “E levantaram-se cedo pela manhã”. O hebraico não identifica o sujeito.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “cadáveres, mortos”, expressão enfática para os que foram mortos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּלַּיְלָה הַהוּא
  choice: Naquela noite
  rationale: A fórmula narrativa pode ser condensada naturalmente em português sem perda da ligação temporal.
- source_word: מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  rationale: מַלְאַךְ designa aqui um agente celestial, e o nome divino é transliterado como Yahweh.
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: Reproduz diretamente o movimento expresso por יצא, com naturalidade em português.
- source_word: וַיַּךְ
  choice: matou
  rationale: Neste contexto de juízo, נכה descreve um golpe de resultado letal, confirmado pelos cadáveres encontrados pela manhã.
- source_word: בְּמַחֲנֵה אַשּׁוּר
  choice: no acampamento da Assíria
  rationale: Mantém de perto a construção hebraica; Assíria representa metonimicamente suas forças militares.
- source_word: מֵאָה שְׁמוֹנִים וַחֲמִשָּׁה אָלֶף
  choice: cento e oitenta e cinco mil homens
  rationale: O número é vertido diretamente; “homens” explicita de modo natural em português as pessoas atingidas no acampamento militar.
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: Quando se levantaram de madrugada
  rationale: A construção impessoal com “se” preserva melhor que um sujeito explícito a indefinição do plural hebraico.
- source_word: וְהִנֵּה
  choice: lá estavam
  rationale: A expressão chama atenção para a descoberta repentina e conserva sua força narrativa em português corrente.
- source_word: כֻלָּם
  choice: todos eles
  rationale: Preserva a força totalizante do hebraico e remete aos que foram atingidos.
- source_word: פְּגָרִים מֵתִים
  choice: cadáveres, mortos
  rationale: Mantém a expressão hebraica enfática, que reúne “cadáveres” e “mortos”, sem aplaná-la para um único termo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome próprio da aliança presente no texto hebraico.
- issue: Identidade de מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  alternative: um anjo de Yahweh; o mensageiro de Yahweh
  rationale: “Anjo” é adequado ao agente sobrenatural deste contexto, enquanto o artigo acompanha o uso bíblico recorrente sem definir além do texto sua identidade teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção impessoal preserva o sujeito indefinido, e a formulação final conserva a ênfase incomum do hebraico.
