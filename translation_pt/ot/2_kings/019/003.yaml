  text: וַ/יֹּאמְר֣וּ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר חִזְקִיָּ֔הוּ יוֹם צָרָ֧ה וְ/תוֹכֵחָ֛ה וּ/נְאָצָ֖ה הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י בָ֤אוּ בָנִים֙ עַד מַשְׁבֵּ֔ר וְ/כֹ֥חַ אַ֖יִן לְ/לֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/003.yaml
  text: 'They said to him[a], “Thus says Hezekiah: This day is a day of distress, rebuke, and disgrace, for children have come to the point of birth[c][b], but there is no strength to give birth.”'
translation:
  language: pt
  text: 'Eles lhe disseram: “Assim diz Ezequias: Este dia é dia de angústia, repreensão e desprezo[a], pois os filhos chegaram à hora de nascer[b], mas não há força para dar à luz.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “afronta”, “escárnio” ou “desonra”.
    reason: lexical_alternative
  - marker: b
    text: Hebraico de sentido difícil; também pode ser traduzido por “chegaram ao lugar do parto”. A imagem é a de um parto que chegou ao momento decisivo, mas sem força para a criança nascer.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula convencional de mensageiro e seu tom solene, com presente natural em português.
- source_word: יוֹם צָרָה
  choice: dia de angústia
  rationale: Comunica a aflição intensa e a pressão expressas por צָרָה em linguagem corrente e digna.
- source_word: וְתוֹכֵחָה
  choice: repreensão
  rationale: Representa o sentido de censura ou reprovação e funciona naturalmente na sequência de substantivos.
- source_word: וּנְאָצָה
  choice: desprezo
  rationale: Mantém o sentido de desdém, afronta ou escárnio sem restringi-lo indevidamente à blasfêmia; uma nota registra alternativas contextuais.
- source_word: הַיּוֹם הַזֶּה
  choice: Este dia
  rationale: Conserva a ênfase demonstrativa e o registro elevado da mensagem real.
- source_word: בָאוּ בָנִים עַד מַשְׁבֵּר
  choice: os filhos chegaram ao momento de nascer
  rationale: Torna compreensível a metáfora do parto que chegou ao instante decisivo, preservando em nota a dificuldade concreta de מַשְׁבֵּר.
- source_word: וְכֹחַ אַיִן לְלֵדָה
  choice: mas não há força para dar à luz
  rationale: 'Expressa com naturalidade o clímax da metáfora: chegou a hora do parto, porém falta força para completá-lo.'
- source_word: בָנִים
  choice: filhos
  rationale: Mantém a forma masculina plural do hebraico, que nesta metáfora se refere às crianças prestes a nascer.
