base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/001.yaml
  text: And when King Hezekiah heard it, he tore his clothes, covered himself with sackcloth, and went into the house of Yahweh.
translation:
  language: pt
  text: Quando o rei Ezequias ouviu isso, rasgou as suas roupas, cobriu-se de pano de saco e entrou na casa de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Quando ... ouviu
  rationale: A fórmula narrativa hebraica introduz o acontecimento seguinte. Em português atual, a oração temporal comunica naturalmente a sequência sem reproduzir de modo rígido “e aconteceu que”.
- source_word: הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: o rei Ezequias
  rationale: Esta é a ordem natural do título e do nome em português, preservando também a determinação de “rei”.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: rasgou as suas roupas
  rationale: Expressão clara e corrente que conserva o gesto público de aflição e luto indicado pelo hebraico.
- source_word: וַיִּתְכַּס בַּשָּׂק
  choice: cobriu-se de pano de saco
  rationale: O reflexivo “cobriu-se” representa a forma hebraica, e “pano de saco” designa de maneira reconhecível o tecido áspero usado em luto e humilhação.
- source_word: וַיָּבֹא בֵּית יְהוָה
  choice: entrou na casa de Yahweh
  rationale: Com um destino definido, בוא expressa aqui entrada. “Casa de Yahweh” mantém a designação hebraica do templo em vez de substituí-la simplesmente por “templo”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” preserva o nome pessoal divino e segue uma vocalização acadêmica amplamente aceita, sem o substituir pelo título “Senhor”.
translation_notes:
  register: Português moderno, digno e de compreensão ampla, com leitura natural no Brasil. A coordenação concisa acompanha o ritmo narrativo hebraico. Não há marcadores de nota porque nenhuma nota é necessária neste versículo.
