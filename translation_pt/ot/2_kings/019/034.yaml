  text: וְ/גַנּוֹתִ֛י אֶל הָ/עִ֥יר הַ/זֹּ֖את לְ/הֽוֹשִׁיעָ֑/הּ לְמַֽעֲנִ֔/י וּ/לְמַ֖עַן דָּוִ֥ד עַבְדִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/034.yaml
  text: For I will defend this city to save it[a], for my own sake and for the sake of my servant David.
translation:
  language: pt
  text: Pois defenderei esta cidade para salvá-la[a], por minha própria causa e por causa de meu servo Davi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para livrá-la”. O verbo hebraico pode significar “salvar” ou “livrar” em contextos de resgate diante do perigo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַנּוֹתִי
  choice: defenderei
  rationale: O verbo גנן expressa a ideia de proteger ou resguardar. “Defenderei” é natural em português e se ajusta ao contexto militar da ameaça contra Jerusalém.
- source_word: אֶל הָעִיר הַזֹּאת
  choice: esta cidade
  rationale: Com גנן, אֶל indica o objeto ao qual se dirige a ação protetora. Em português idiomático, o verbo “defender” recebe objeto direto.
- source_word: לְהוֹשִׁיעָהּ
  choice: para salvá-la
  rationale: O verbo ישׁע pode significar salvar ou livrar alguém de perigo. “Salvá-la” é conciso, claro e preserva a referência feminina à cidade.
- source_word: לְמַעֲנִי
  choice: por amor de mim mesmo
  rationale: A expressão apresenta o próprio Deus como motivo de sua ação. “Por amor de mim mesmo” comunica a ênfase reflexiva sem acrescentar uma explicação doutrinária.
- source_word: וּלְמַעַן דָּוִד עַבְדִּי
  choice: e por amor de Davi, meu servo
  rationale: A formulação preserva o segundo fundamento declarado e mantém “meu servo” como título em aposição a Davi.
theological_decisions:
- issue: Motivação divina para salvar Jerusalém
  choice: A cidade será salva por amor do próprio Deus e por amor de Davi, seu servo.
  alternative: Entender a menção a Davi apenas como referência restrita a promessas passadas, sem explicitar uma dimensão pactual mais ampla.
  rationale: O hebraico apresenta expressamente dois fundamentos paralelos com לְמַעַן. A tradução conserva ambos sem desenvolver nem limitar suas implicações teológicas.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Pois” representa a relação contextual do waw sem rigidez excessiva; “por amor de” conserva uma formulação bíblica corrente e compreensível.
