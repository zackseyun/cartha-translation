base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/013.yaml
  text: Shallum son of Jabesh became king in the thirty-ninth year of Uzziah king of Judah[a], and he reigned for a month of days in Samaria.
translation:
  language: pt
  text: Salum, filho de Jabes, tornou-se rei no trigésimo nono ano de Uzias, rei de Judá, e reinou em Samaria por um mês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “um mês de dias”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָלַךְ
  choice: tornou-se rei
  rationale: Neste sincronismo régio, o qatal indica a subida de Salum ao trono; “tornou-se rei” distingue a ascensão da duração do reinado expressa em seguida.
- source_word: בִּשְׁנַת שְׁלֹשִׁים וָתֵשַׁע שָׁנָה
  choice: no trigésimo nono ano
  rationale: É a forma natural em português para a fórmula hebraica de datação pelo ano de reinado.
- source_word: לְעֻזִיָּה מֶלֶךְ יְהוּדָה
  choice: de Uzias, rei de Judá
  rationale: O לְ do sincronismo indica que o ano é contado dentro do reinado de Uzias; “de” expressa essa relação naturalmente.
- source_word: וַיִּמְלֹךְ
  choice: e reinou
  rationale: O wayyiqtol faz a narrativa avançar da ascensão à duração do governo.
- source_word: יֶרַח יָמִים
  choice: por um mês
  rationale: A expressão hebraica é literalmente “um mês de dias”, idioma que em português atual comunica-se naturalmente como “um mês”; a forma literal é preservada em nota.
- source_word: בְּשֹׁמְרוֹן
  choice: em Samaria
  rationale: O בְּ locativo indica o lugar em que Salum exerceu seu breve reinado.
