  text: בֶּן שֵׁ֨שׁ עֶשְׂרֵ֤ה שָׁנָה֙ הָיָ֣ה בְ/מָלְכ֔/וֹ וַ/חֲמִשִּׁ֤ים וּ/שְׁתַּ֨יִם֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ יְכָלְיָ֖הוּ מִ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/002.yaml
  text: He was sixteen years old when he became king[a], and he reigned fifty-two years in Jerusalem. His mother’s name was Jecoliah of Jerusalem.
translation:
  language: pt
  text: Tinha dezesseis anos quando começou a reinar e reinou cinquenta e dois anos em Jerusalém. O nome de sua mãe era Jecolias, de Jerusalém.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vinda de Jerusalém”.
    reason: A preposição hebraica מִן pode marcar origem (“de, vinda de”). A nota preserva essa nuance sem sugerir necessariamente deslocamento no texto principal.
lexical_decisions:
- source_word: בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: Tinha dezesseis anos
  rationale: A expressão hebraica, literalmente “filho de dezesseis anos”, é uma fórmula idiomática de idade; a redação escolhida é natural em português e preserva a idade exata.
- source_word: הָיָה בְמָלְכוֹ
  choice: quando começou a reinar
  rationale: A construção indica a idade no início do reinado. Esta formulação comunica com clareza o valor temporal e se liga naturalmente à oração anterior.
- source_word: וַחֲמִשִּׁים וּשְׁתַּיִם שָׁנָה
  choice: cinquenta e dois anos
  rationale: Forma corrente em português para o numeral hebraico.
- source_word: מָלַךְ
  choice: reinou
  rationale: Equivalente preciso e tradicional do verbo em fórmulas régias, sem acrescentar uma avaliação sobre a maneira como o rei governou.
- source_word: בִּירוּשָׁלָם
  choice: em Jerusalém
  rationale: A preposição hebraica tem valor locativo e indica a sede do reinado.
- source_word: וְשֵׁם אִמּוֹ
  choice: O nome de sua mãe era
  rationale: Mantém o conteúdo e a forma da fórmula hebraica em português claro e digno.
- source_word: יְכָלְיָהוּ
  choice: Jecolias
  rationale: Forma portuguesa estabelecida para o nome hebraico, mais legível ao público lusófono do que uma transliteração estrita.
- source_word: מִירוּשָׁלָם
  choice: de Jerusalém
  rationale: Nesta nota biográfica, a expressão portuguesa indica de modo natural a origem ou vinculação local da mãe; a alternativa mais explicitamente dinâmica é registrada em nota.
