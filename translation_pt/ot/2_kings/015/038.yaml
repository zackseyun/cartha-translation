base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/038.yaml
  text: And Jotham lay down with his fathers and was buried with his fathers in the city of David his father[b][a], and Ahaz his son reigned in his place.
translation:
  language: pt
  text: Jotão descansou com seus pais[a] e foi sepultado com seus pais na Cidade de Davi, seu antepassado[b]. E Acaz, seu filho, reinou em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com seus antepassados”. A expressão hebraica diz literalmente “com seus pais” e faz parte de uma fórmula régia tradicional de morte.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “seu pai”. Aqui, “pai” significa antepassado ou ancestral dinástico, não pai biológico imediato.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: descansou
  rationale: No contexto da fórmula régia de morte, o verbo indica que Jotão morreu e se juntou aos antepassados. “Descansou” conserva o caráter eufemístico e soa natural em português, enquanto o sepultamento subsequente esclarece o sentido.
- source_word: עִם אֲבֹתָיו
  choice: com seus pais
  rationale: Mantém a imagem e o termo de parentesco da fórmula hebraica tradicional; aqui, “pais” tem sentido coletivo e ancestral, explicado em nota.
- source_word: וַיִּקָּבֵר
  choice: foi sepultado
  rationale: Reproduz a voz passiva do hebraico com formulação corrente e digna em português.
- source_word: בְּעִיר דָּוִד אָבִיו
  choice: na Cidade de Davi, seu antepassado
  rationale: “Cidade de Davi” é a designação consagrada. Como Davi não era o pai imediato de Jotão, “antepassado” comunica diretamente o sentido dinástico de אָבִיו sem criar uma afirmação genealógica equivocada.
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: É a correspondência habitual e concisa para מלך em avisos de sucessão real.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: Expressa naturalmente a ideia hebraica de substituição e sucessão no trono.
theological_decisions:
- issue: Sentido de אָבִיו em “Davi, seu pai”
  choice: antepassado dinástico
  alternative: pai imediato
  rationale: Jotão era filho imediato de Uzias/Azarias. Portanto, em relação a Davi, o termo hebraico אָב designa um ancestral da linhagem real. A tradução torna esse sentido explícito, e a nota registra a expressão literal.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A tradução preserva a fórmula régia “com seus pais”, mas usa “antepassado” em relação a Davi para evitar ambiguidade factual; as notas documentam tanto o sentido literal quanto a alternativa lexical.
