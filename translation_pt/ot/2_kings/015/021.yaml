  text: וְ/יֶ֛תֶר דִּבְרֵ֥י מְנַחֵ֖ם וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/021.yaml
  text: The rest of the acts of Menahem[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: pt
  text: Os demais atos de Menaém e tudo o que ele fez não estão escritos no Livro das Crônicas dos Reis de Israel[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Livro dos Anais dos Reis de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Os demais atos
  rationale: יֶתֶר significa “restante” ou “demais”, e דִּבְרֵי, nesta fórmula de resumo régio, refere-se aos feitos ou atos do rei, não apenas às suas palavras. O וְ inicial tem valor de conexão narrativa e não exige a introdução de um advérbio temporal.
- source_word: מְנַחֵם
  choice: Menaém
  rationale: Forma portuguesa consagrada do nome hebraico, com acento gráfico para indicar a pronúncia natural em português.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: e tudo o que ele fez
  rationale: Tradução direta e natural da oração relativa, preservando a abrangência e o caráter formular do hebraico.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: não estão escritos
  rationale: הֲלוֹא introduz uma pergunta retórica que espera resposta afirmativa; o particípio passivo כְּתוּבִים é mantido transparentemente como “escritos”.
- source_word: עַל סֵפֶר
  choice: no Livro
  rationale: Embora עַל tenha o sentido básico de “sobre”, nesta fórmula documental a expressão idiomática em português é “no Livro”. סֵפֶר designa aqui um documento ou registro escrito.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים
  choice: Livro das Crônicas
  rationale: A expressão designa um registro analístico oficial. “Crônicas” conserva a formulação bíblica conhecida, enquanto “Anais” é apresentado em nota como alternativa lexical precisa.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: dos Reis de Israel
  rationale: A preposição לְ marca aqui a relação do registro com os reis de Israel; “dos Reis de Israel” é natural como parte do título.
