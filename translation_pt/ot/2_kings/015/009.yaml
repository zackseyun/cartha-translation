    issue: «haviam feito» sugere anterioridade adicional.
    rationale: O hebraico עָשׂוּ é perfeito simples na comparação e não exige o mais-que-perfeito português; «fizeram» reproduz melhor a relação expressa.
  - severity: low
    issue: A formulação causativa pode ser mais idiomática.
    rationale: «Levar Israel a pecar» comunica claramente o hiphil de חטא e preserva Jeroboão como agente expresso por «ele», mantendo os pecados como antecedente principal.
