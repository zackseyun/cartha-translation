  to: Ele fez o que era mau aos olhos de Yahweh, assim como seus pais fizeram. Não se afastou dos pecados de Jeroboão, filho de Nebate, com os quais ele levou Israel a pecar.[a]
  rationale: A revisão elimina uma nuance temporal não assinalada no hebraico e torna a construção causativa mais natural em português. Conserva a ordem, os termos essenciais e a ambiguidade do texto-fonte; a nota foi ajustada para apresentar a alternativa como uma leitura completa e clara.
