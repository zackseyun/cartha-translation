id: 2KI.15.9
reference: 2 Kings 15:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה כַּ/אֲשֶׁ֥ר עָשׂ֖וּ אֲבֹתָ֑י/ו לֹ֣א סָ֗ר מֵֽ/חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/009.yaml
  text: He did what was evil in the sight of Yahweh[a], just as his fathers had done. He did not turn away from the sins of Jeroboam son of Nebat, with which he caused Israel to sin.
translation:
  language: pt
  text: Ele fez o que era mau aos olhos de Yahweh, assim como seus pais fizeram. Não se afastou dos pecados de Jeroboão, filho de Nebate, com os quais ele levou Israel a pecar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos pecados de Jeroboão, filho de Nebate, que levou Israel a pecar”. A oração relativa hebraica pode referir-se ao próprio Jeroboão ou aos pecados associados a ele.'
    reason: Registra a ambiguidade do antecedente da oração relativa hebraica, sem decidir entre a referência a Jeroboão e a referência aos pecados.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ele fez
  rationale: O wayyiqtol narrativo de עשה é expresso naturalmente pelo pretérito perfeito em português.
- source_word: הָרַע בְּעֵינֵי יְהוָה
  choice: o que era mau aos olhos de Yahweh
  rationale: Preserva a fórmula avaliativa deuteronomista e a imagem hebraica dos “olhos”, em linguagem clara e digna.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: כַּאֲשֶׁר עָשׂוּ אֲבֹתָיו
  choice: assim como seus pais haviam feito
  rationale: “Assim como” comunica a comparação; “pais” mantém o termo masculino e sua referência dinástica contextual.
- source_word: לֹא סָר
  choice: Não se afastou
  rationale: Expressa סור como abandono de uma conduta, de modo natural no contexto moral e religioso.
- source_word: מֵחַטֹּאות
  choice: dos pecados
  rationale: Mantém o plural do hebraico e a ideia de um conjunto de práticas pecaminosas.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jeroboão, filho de Nebate
  rationale: Emprega as formas portuguesas tradicionais dos nomes e torna clara a relação patronímica.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: com os quais ele fez Israel pecar
  rationale: Relaciona a oração aos “pecados” como meio ou padrão pelo qual Jeroboão induziu Israel ao pecado, preservando na nota a possível referência direta a Jeroboão.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Mantém o nome pessoal divino conforme o texto hebraico, sem o substituir por um título.
- issue: Referente da oração אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: os pecados, com Jeroboão como agente expresso por “ele”
  alternative: 'Jeroboão: “que fez Israel pecar”'
  rationale: A construção permite associar estreitamente a oração tanto a Jeroboão quanto aos pecados ligados a ele. O texto principal mantém os pecados como meio, e a nota registra a leitura pessoal sem resolver indevidamente a ambiguidade.
- issue: Alcance de אֲבֹתָיו
  choice: seus pais
  alternative: seus antepassados; seus predecessores
  rationale: A tradução conserva o termo masculino do hebraico e sua ressonância dinástica, sem ampliar explicitamente a referência.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Conserva a fórmula bíblica “aos olhos de”, usa “Yahweh” para o nome divino e evita linguagem confessional específica.
