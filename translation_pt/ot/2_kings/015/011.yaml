  text: The rest of the acts of Zechariah—behold[a], they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: pt
  text: Os demais atos de Zacarias, eis que estão escritos no Livro das Crônicas[a] dos Reis de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no Livro dos Anais dos Reis de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Os demais atos
  rationale: Na fórmula de encerramento dos reinados em Reis, יֶתֶר דִּבְרֵי designa os demais acontecimentos ou feitos do rei. “Os demais atos” conserva o caráter historiográfico da expressão sem restringi-la a palavras faladas.
- source_word: זְכַרְיָה
  choice: Zacarias
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: הִנָּם
  choice: eis que estão
  rationale: Preserva a função dêitica e enfática da partícula hebraica, que chama a atenção para o registro escrito, mantendo ao mesmo tempo um tom solene e compreensível.
- source_word: כְּתוּבִים
  choice: escritos
  rationale: Reproduz diretamente o particípio passivo hebraico; “registrados” seria possível, mas é menos formalmente próximo.
- source_word: עַל סֵפֶר
  choice: no Livro
  rationale: Embora עַל tenha sentido básico de “sobre”, nesta fórmula documental o português idiomático pede “no Livro”.
- source_word: דִּבְרֵי הַיָּמִים
  choice: das Crônicas
  rationale: A expressão funciona como designação de registros históricos reais. “Crônicas” é tradicional, conciso e inteligível; “Anais” permanece como alternativa em nota.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: dos Reis de Israel
  rationale: Representa naturalmente em português a relação indicada por לְ no título do documento.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leve solenidade na expressão “eis que”, escolhida para conservar a ênfase marcada do hebraico. A construção mantém a fórmula historiográfica recorrente em Reis.
