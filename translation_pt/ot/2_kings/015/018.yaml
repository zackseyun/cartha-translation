id: 2KI.15.18
reference: 2 Kings 15:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֠ר מֵ/עַ֨ל חַטֹּ֜אות יָרָבְעָ֧ם בֶּן נְבָ֛ט אֲשֶׁר הֶחֱטִ֥יא אֶת יִשְׂרָאֵ֖ל כָּל יָמָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/018.yaml
  text: He did what was evil in the eyes of Yahweh. He did not turn away from the sins of Jeroboam son of Nebat[a], with which he caused Israel to sin, all his days.
translation:
  language: pt
  text: Ele fez o que era mau aos olhos de Yahweh. Durante todos os seus dias, não se afastou dos pecados de Jeroboão, filho de Nebate[a], com os quais ele levou Israel a pecar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Jeroboão, filho de Nebate, que levou Israel a pecar”. A oração relativa hebraica pode se referir a “Jeroboão”, em vez de a “pecados”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Ele fez o que era mau
  rationale: Expressa de modo natural a fórmula avaliativa de Reis, preservando o sentido objetivo de fazer aquilo que é mau.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Mantém a metáfora hebraica de avaliação divina e translitera o nome pessoal יְהוָה como Yahweh.
- source_word: לֹא סָר מֵעַל חַטֹּאות
  choice: não se afastou dos pecados
  rationale: Reproduz a imagem de סור como afastamento e comunica naturalmente a persistência no padrão pecaminoso.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jeroboão, filho de Nebate
  rationale: Emprega as formas tradicionais e amplamente reconhecidas dos nomes bíblicos em português.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: com os quais ele levou Israel a pecar
  rationale: Preserva o valor causativo do hifil de חטא e, no texto principal, relaciona a oração aos pecados, sem eliminar a ambiguidade sintática indicada em nota.
- source_word: כָּל יָמָיו
  choice: Durante todos os seus dias
  rationale: Conserva o idioma hebraico e o apresenta em posição inicial para deixar claro que a persistência caracterizou todo o período referido.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama como nome próprio; a transliteração preserva essa função em vez de substituí-lo por um título.
- issue: Antecedente de אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: 'A oração relativa é ligada, no texto principal, aos “pecados”: “com os quais ele levou Israel a pecar”.'
  alternative: 'Ligá-la diretamente a Jeroboão: “Jeroboão, filho de Nebate, que levou Israel a pecar”.'
  rationale: A construção hebraica admite ambas as relações. A leitura escolhida associa semanticamente a ação aos pecados mencionados, enquanto a nota conserva a outra análise genuinamente possível.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas bíblicas reconhecíveis. A ordem de “Durante todos os seus dias” foi ajustada para evitar que a expressão pareça modificar apenas o ato de levar Israel a pecar; ela caracteriza a persistência do rei em não abandonar esses pecados.
