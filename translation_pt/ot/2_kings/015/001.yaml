base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/001.yaml
  text: In the twenty-seventh year of Jeroboam king of Israel, Azariah son of Amaziah, king of Judah, began to reign.
translation:
  language: pt
  text: No vigésimo sétimo ano de Jeroboão, rei de Israel, Azarias, filho de Amazias, rei de Judá, começou a reinar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת עֶשְׂרִים וָ/שֶׁבַע שָׁנָה
  choice: No vigésimo sétimo ano
  rationale: A fórmula hebraica de datação por ano de reinado usa um número cardinal, mas o português corrente pede o ordinal.
- source_word: לְ/יָרָבְעָם
  choice: de Jeroboão
  rationale: Nesta fórmula régia, a preposição ל indica o rei cujo ano de reinado está sendo contado.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: rei de Israel
  rationale: Tradução direta e convencional do título régio.
- source_word: מָלַךְ
  choice: começou a reinar
  rationale: Neste aviso de ascensão, o verbo assinala o início do reinado; a formulação explicita naturalmente essa função narrativa.
- source_word: עֲזַרְיָה
  choice: Azarias
  rationale: Forma portuguesa tradicional e amplamente reconhecível do nome hebraico.
- source_word: בֶן אֲמַצְיָה
  choice: filho de Amazias
  rationale: Tradução direta da expressão hebraica de filiação.
- source_word: מֶלֶךְ יְהוּדָה
  choice: rei de Judá
  rationale: Título régio em aposição a Azarias, traduzido de modo direto.
