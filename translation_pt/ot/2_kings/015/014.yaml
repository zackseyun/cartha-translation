  text: וַ/יַּעַל֩ מְנַחֵ֨ם בֶּן גָּדִ֜י מִ/תִּרְצָ֗ה וַ/יָּבֹא֙ שֹׁמְר֔וֹן וַ/יַּ֛ךְ אֶת שַׁלּ֥וּם בֶּן יָבֵ֖ישׁ בְּ/שֹׁמְר֑וֹן וַ/יְמִיתֵ֖/הוּ וַ/יִּמְלֹ֥ךְ תַּחְתָּֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/014.yaml
  text: Then Menahem son of Gadi went up from Tirzah and came to Samaria, and he struck down Shallum son of Jabesh in Samaria and put him to death, and he reigned in his place.
translation:
  language: pt
  text: Então Menaém, filho de Gadi, subiu de Tirza e chegou a Samaria. Em Samaria, feriu Salum, filho de Jabes, matou-o e reinou em seu lugar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: subiu
  rationale: Preserva o sentido comum de עלה, “subir”, sem explicitar uma marcha militar que o verbo, por si só, não exige.
- source_word: מְנַחֵם בֶּן גָּדִי
  choice: Menaém, filho de Gadi
  rationale: Emprega formas portuguesas legíveis para os nomes e mantém a identificação patronímica.
- source_word: מִתִּרְצָה
  choice: de Tirza
  rationale: A preposição מן indica origem; “de Tirza” expressa isso naturalmente em português.
- source_word: וַיָּבֹא שֹׁמְרוֹן
  choice: foi a Samaria
  rationale: בוא com nome de lugar indica chegada. Depois de “subiu de Tirza”, “foi a Samaria” mantém clara a perspectiva narrativa em português.
- source_word: וַיַּךְ אֶת
  choice: feriu
  rationale: נכה designa o golpe ou ataque. Como a oração seguinte declara explicitamente que Menaém o matou, “feriu” preserva a sequência hebraica sem fundir as duas ações.
- source_word: שַׁלּוּם בֶּן יָבֵישׁ
  choice: Salum, filho de Jabes
  rationale: Usa formas tradicionais e inteligíveis em português, conservando a relação filial.
- source_word: בְּשֹׁמְרוֹן
  choice: Ali
  rationale: Retoma Samaria de modo natural e evita uma repetição pesada em português, sem perder a localização expressa pelo hebraico.
- source_word: וַיְמִיתֵהוּ
  choice: matou-o
  rationale: O hifil de מות tem sentido causativo, aqui expresso idiomaticamente por “matou-o”; “mandou matá-lo” acrescentaria uma mediação não indicada pelo texto.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: reinou em seu lugar
  rationale: Mantém tanto o sentido régio de מלך quanto a ideia de substituição ou sucessão em תחתיו.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe narrativa fluente. A divisão em duas frases melhora a clareza sem alterar a sequência dos acontecimentos. Não há necessidade de notas textuais ou teológicas neste versículo.
