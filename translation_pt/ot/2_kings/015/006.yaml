  text: וְ/יֶ֛תֶר דִּבְרֵ֥י עֲזַרְיָ֖הוּ וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/006.yaml
  text: The rest of the acts of Azariah[a], and all that he did[b], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: pt
  text: Os demais atos de Azarias e tudo o que ele fez não estão escritos[a] no Livro das Crônicas dos Reis de Judá[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “registrados”. O texto principal mantém a tradução mais literal de כְּתוּבִים.
    reason: lexical_alternative
  - marker: b
    text: O “Livro das Crônicas dos Reis de Judá” era um registro ou conjunto de anais da corte citado repetidamente em Reis.
    reason: cultural_note
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי
  choice: os demais atos
  rationale: No resumo régio, a expressão se refere aos outros feitos ou acontecimentos do reinado que não foram narrados nesta passagem. “Os demais atos” é natural em português e preserva o caráter histórico da fórmula.
- source_word: עֲזַרְיָהוּ
  choice: Azarias
  rationale: Forma tradicional e amplamente reconhecida em português para o nome hebraico.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: e tudo o que ele fez
  rationale: Tradução direta e abrangente da oração relativa, adequada à fórmula historiográfica.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: não estão escritos
  rationale: Conserva a pergunta retórica hebraica e o sentido direto de כְּתוּבִים, com sintaxe natural em português.
- source_word: עַל סֵפֶר
  choice: no Livro
  rationale: Embora a preposição hebraica possa ser traduzida literalmente por “sobre”, em contexto documental o português idiomático diz que algo está escrito “no livro”.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: Crônicas dos Reis de Judá
  rationale: Expressa o título da fonte régia citada. “Crônicas” preserva a formulação tradicional, enquanto “dos Reis de Judá” representa naturalmente a relação indicada por לְ.
