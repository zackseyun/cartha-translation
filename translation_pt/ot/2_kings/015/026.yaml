base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/026.yaml
  text: The rest of the acts of Pekahiah[a], and all that he did, behold, they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: pt
  text: Os demais atos de Pecaías[a] e tudo o que ele fez, eis que estão escritos no Livro das Crônicas dos Reis de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E os demais feitos de Pecaías, e tudo o que ele fez, estão registrados no Livro dos Anais dos Reis de Israel.”'
    reason: Alternativa lexical e formulação que explicita a conjunção inicial, traduz דִּבְרֵי por “feitos”, הִנָּם sem “eis que” e דִּבְרֵי הַיָּמִים por “Anais”.
lexical_decisions:
- source_word: וְיֶתֶר
  choice: Os demais
  rationale: יֶתֶר indica o restante ou aquilo que ainda não foi relatado. O וְ liga esta fórmula ao contexto; em português, essa ligação pode ficar implícita sem acrescentar um marcador temporal inexistente no hebraico.
- source_word: דִּבְרֵי
  choice: atos
  rationale: Na fórmula de encerramento dos relatos régios, דִּבְרֵי designa os feitos ou assuntos do rei, e não apenas suas palavras.
- source_word: פְקַחְיָה
  choice: Pecaías
  rationale: Transliteração portuguesa corrente do nome pessoal hebraico.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: e tudo o que ele fez
  rationale: Tradução direta que mantém o sentido amplo de עָשָׂה, sem limitar a expressão a realizações específicas.
- source_word: הִנָּם
  choice: eis que estão
  rationale: Preserva a força apresentativa do hebraico, chamando a atenção para o registro escrito mencionado a seguir.
- source_word: כְּתוּבִים
  choice: escritos
  rationale: Mantém o sentido do particípio passivo hebraico e soa natural na fórmula documental.
- source_word: עַל סֵפֶר
  choice: no Livro
  rationale: Embora עַל tenha o sentido básico de “sobre”, a expressão documental é vertida idiomaticamente em português como “escritos no livro”.
- source_word: דִּבְרֵי הַיָּמִים
  choice: das Crônicas
  rationale: A expressão designa um registro histórico ou analístico. “Crônicas” conserva a forma tradicional e é compreensível, enquanto “Anais” permanece uma alternativa legítima.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: dos Reis de Israel
  rationale: Neste título documental, לְ é expresso idiomaticamente pela relação genitiva “dos”.
