base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/035.yaml
  text: Only the high places were not removed; the people still were sacrificing and burning incense on the high places[a]. He built the upper gate of the house of Yahweh.
translation:
  language: pt
  text: Apenas os lugares altos não foram removidos; o povo ainda oferecia sacrifícios e queimava incenso nos lugares altos[a]. Ele construiu a porta superior da casa de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, quanto a «queimava incenso»: «fazia uma oferta subir em fumaça». O verbo hebraico pode referir-se especificamente à queima de incenso ou, em sentido mais amplo, a fazer uma oferta subir em fumaça.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Somente
  rationale: Introduz a exceção à avaliação positiva do rei e preserva a força restritiva da fórmula hebraica.
- source_word: הַבָּמוֹת / בַּבָּמוֹת
  choice: os lugares altos / nos lugares altos
  rationale: Expressão tradicional e inteligível para os santuários locais de culto, não apenas para elevações geográficas.
- source_word: לֹא סָרוּ
  choice: não foram removidos
  rationale: Expressa naturalmente o sentido contextual de que esses locais de culto permaneceram, embora a forma hebraica seja literalmente ativa.
- source_word: עוֹד
  choice: ainda
  rationale: Marca a continuidade da prática cultual.
- source_word: מְזַבְּחִים
  choice: sacrificava
  rationale: O particípio indica uma prática contínua ou habitual; o singular concorda com o coletivo “o povo” em português.
- source_word: וּמְקַטְּרִים
  choice: queimava incenso
  rationale: É a expressão cultual mais natural em português; a nota conserva o sentido mais amplo possível do verbo, relativo a fazer uma oferta subir em fumaça.
- source_word: בָּנָה
  choice: construiu
  rationale: Traduz o sentido básico do verbo sem pressupor que se tratava de reconstrução.
- source_word: שַׁעַר בֵּית יְהוָה הָעֶלְיוֹן
  choice: o portão superior da casa de Yahweh
  rationale: Preserva a estrutura e a designação espacial do hebraico em linguagem portuguesa clara.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome próprio e evita substituí-lo por um título.
- issue: Natureza da prática indicada por וּמְקַטְּרִים
  choice: queimava incenso, com nota sobre o sentido mais amplo
  alternative: fazia ofertas subir em fumaça
  rationale: O verbo pode designar especificamente a queima de incenso ou, de maneira mais ampla, a produção de fumaça sacrificial. A tradução principal favorece a expressão cultual natural, enquanto a nota mantém a amplitude lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a fórmula repetitiva característica de Reis e preserva, em nota, a ambiguidade do verbo cultual.
