base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/033.yaml
  text: He was twenty-five years old when he began to reign[a], and he reigned sixteen years in Jerusalem. His mother’s name was Jerusha daughter of Zadok.
translation:
  language: pt
  text: Ele tinha vinte e cinco anos quando começou a reinar e reinou dezesseis anos em Jerusalém. O nome de sua mãe era Jerusa, filha de Zadoque.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: tinha vinte e cinco anos
  rationale: Expressa de modo natural em português o idiomatismo hebraico de idade, literalmente «filho de vinte e cinco anos».
- source_word: הָיָה בְמָלְכוֹ
  choice: quando começou a reinar
  rationale: A construção integra a fórmula régia e indica a idade do rei no início de seu reinado.
- source_word: וְשֵׁשׁ עֶשְׂרֵה שָׁנָה מָלַךְ
  choice: e reinou dezesseis anos
  rationale: Mantém diretamente a duração do reinado em ordem natural no português.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: Forma portuguesa consagrada do topônimo e sentido normal da preposição hebraica.
- source_word: וְשֵׁם אִמּוֹ
  choice: O nome de sua mãe era
  rationale: Tradução clara e idiomática da fórmula nominal hebraica.
- source_word: יְרוּשָׁא
  choice: Jerusa
  rationale: Transliteração portuguesa tradicional e direta do nome hebraico.
- source_word: בַּת צָדוֹק
  choice: filha de Zadoque
  rationale: Preserva literalmente a identificação familiar, usando a forma portuguesa corrente do nome.
