source:
  edition: WLC
  text: וַ/יֹּצֵא֩ מְנַחֵ֨ם אֶת הַ/כֶּ֜סֶף עַל יִשְׂרָאֵ֗ל עַ֚ל כָּל גִּבּוֹרֵ֣י הַ/חַ֔יִל לָ/תֵת֙ לְ/מֶ֣לֶךְ אַשּׁ֔וּר חֲמִשִּׁ֧ים שְׁקָלִ֛ים כֶּ֖סֶף לְ/אִ֣ישׁ אֶחָ֑ד וַ/יָּ֨שָׁב֙ מֶ֣לֶךְ אַשּׁ֔וּר וְ/לֹא עָ֥מַד שָׁ֖ם בָּ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/020.yaml
  text: Then Menahem exacted the money from Israel[a], from all the mighty men of valor, to give to the king of Assyria fifty shekels of silver from each man. So the king of Assyria turned back and did not remain there in the land.
translation:
  language: pt
  text: Então Menaém cobrou o dinheiro de Israel, de todos os homens de posses[a], cinquenta siclos de prata de cada um, para dar ao rei da Assíria. Assim, o rei da Assíria voltou e não permaneceu ali na terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de todos os homens valentes” ou “de todos os homens influentes”. A expressão hebraica pode indicar força militar, posição social ou riqueza; o contexto da cobrança favorece o sentido de homens de posses.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּצֵא
  choice: cobrou
  rationale: O hifil de יצא, com "o dinheiro" e a cobrança imposta sobre Israel, expressa aqui a obtenção compulsória de uma quantia. "Cobrou" comunica o sentido fiscal sem soar excessivamente técnico.
- source_word: הַכֶּסֶף
  choice: esse dinheiro
  rationale: כֶּסֶף pode significar "prata" ou "dinheiro". Nesta primeira ocorrência, refere-se à soma a ser arrecadada; o demonstrativo liga naturalmente a quantia ao pagamento mencionado no contexto anterior.
- source_word: עַל יִשְׂרָאֵל
  choice: de Israel
  rationale: Após o verbo de cobrança, עַל indica o povo sobre o qual recaiu a contribuição; em português idiomático, a origem do dinheiro é expressa por "de Israel".
- source_word: עַל כָּל גִּבּוֹרֵי הַחַיִל
  choice: de todos os homens de posses
  rationale: A expressão pode designar homens fortes ou valentes, mas também pessoas influentes e de recursos. Como a frase descreve uma cobrança individual elevada, "homens de posses" exprime melhor o provável referente, enquanto a nota preserva a amplitude lexical.
- source_word: לָתֵת לְמֶלֶךְ אַשּׁוּר
  choice: para entregá-los ao rei da Assíria
  rationale: A oração infinitiva indica a finalidade da cobrança. O pronome retoma o dinheiro arrecadado e evita ambiguidade em português.
- source_word: חֲמִשִּׁים שְׁקָלִים כֶּסֶף
  choice: cinquenta siclos de prata
  rationale: Mantém a unidade antiga de peso e a identificação do metal, conforme a construção hebraica.
- source_word: לְאִישׁ אֶחָד
  choice: de cada um
  rationale: No contexto distributivo da cobrança, a expressão especifica a quantia exigida individualmente de cada homem pertencente ao grupo.
- source_word: וַיָּשָׁב
  choice: voltou
  rationale: O verbo indica que o rei assírio se retirou ou retornou depois de receber o pagamento. "Voltou" é simples e fiel, sem explicitar um destino não declarado.
- source_word: וְלֹא עָמַד שָׁם בָּאָרֶץ
  choice: não permaneceu ali na terra
  rationale: עמד significa literalmente "ficar de pé", mas aqui tem o sentido contextual de ficar ou permanecer em determinado lugar.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem da frase foi ajustada para deixar explícito que cinquenta siclos eram cobrados de cada integrante do grupo. A ambiguidade de גִּבּוֹרֵי הַחַיִל foi preservada em nota.
