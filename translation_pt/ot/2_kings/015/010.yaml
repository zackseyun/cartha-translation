base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/010.yaml
  text: Then Shallum son of Jabesh conspired against him and struck him down before the people[a], and put him to death and reigned in his place.
translation:
  language: pt
  text: Então Salum, filho de Jabes, conspirou contra ele, golpeou-o diante do povo[a], matou-o e reinou em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «em público» ou «diante da assembleia». A expressão hebraica é difícil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: conspirou contra ele
  rationale: No contexto de sucessão real, קשר designa uma conspiração política; a formulação é natural e preserva o sentido hostil.
- source_word: שַׁלֻּם בֶּן־יָבֵשׁ
  choice: Salum, filho de Jabes
  rationale: Emprega as formas tradicionais dos nomes em português e traduz בן pela fórmula genealógica corrente.
- source_word: וַיַּכֵּהוּ
  choice: atacou-o
  rationale: נכה indica que Salum o golpeou ou feriu. Como o verbo seguinte declara explicitamente a morte, «atacou-o» preserva a sequência sem antecipar o resultado fatal.
- source_word: קָבָל־עָם
  choice: diante do povo
  rationale: A expressão difícil parece indicar que o ato ocorreu na presença do povo; a tradução permanece próxima do hebraico e conserva sua possível ambiguidade.
- source_word: וַיְמִיתֵהוּ
  choice: matou-o
  rationale: O hifil de מות significa causar a morte ou matar. Em português, «matou-o» expressa com naturalidade o resultado explícito e mantém a distinção em relação ao ataque anterior.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: reinou em seu lugar
  rationale: מלך com תחתיו descreve a sucessão ao trono; a expressão conserva de modo claro a ideia de reinar como substituto do rei morto.
