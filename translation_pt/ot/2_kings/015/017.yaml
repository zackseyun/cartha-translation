base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/017.yaml
  text: In the thirty-ninth year of Azariah king of Judah, Menahem son of Gadi became king over Israel, and he reigned ten years in Samaria.
translation:
  language: pt
  text: No trigésimo nono ano do reinado de Azarias, rei de Judá, Menaém, filho de Gadi, tornou-se rei sobre Israel e reinou dez anos em Samaria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שְׁלֹשִׁים וָתֵשַׁע שָׁנָה
  choice: No trigésimo nono ano do reinado
  rationale: A fórmula hebraica introduz uma sincronização pelo ano régio. A inclusão de “do reinado” torna explícito em português o sentido ordinal e régio já presente no contexto.
- source_word: לַעֲזַרְיָה מֶלֶךְ יְהוּדָה
  choice: de Azarias, rei de Judá
  rationale: ל marca a referência ao ano régio de Azarias, e a cadeia nominal seguinte expressa seu título real.
- source_word: מָלַךְ
  choice: tornou-se rei
  rationale: Neste ponto, o verbo assinala a ascensão de Menaém ao trono; a duração de seu governo é informada logo depois.
- source_word: מְנַחֵם בֶּן גָּדִי
  choice: Menaém, filho de Gadi
  rationale: Os nomes são transliterados em formas correntes em português, e בֶּן é traduzido naturalmente como “filho de”.
- source_word: עַל יִשְׂרָאֵל
  choice: sobre Israel
  rationale: Com o verbo מָלַךְ, עַל indica o povo ou território sobre o qual se exerce o governo.
- source_word: עֶשֶׂר שָׁנִים
  choice: dez anos
  rationale: Expressa diretamente a duração do reinado.
- source_word: בְּשֹׁמְרוֹן
  choice: em Samaria
  rationale: A preposição בְּ tem sentido locativo e identifica Samaria como sede do reinado.
