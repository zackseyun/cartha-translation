base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/008.yaml
  text: In the thirty-eighth year of Azariah king of Judah, Zechariah son of Jeroboam became king over Israel in Samaria for six months.
translation:
  language: pt
  text: No trigésimo oitavo ano do reinado de Azarias, rei de Judá, Zacarias, filho de Jeroboão, passou a reinar sobre Israel, em Samaria, por seis meses.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה
  choice: No trigésimo oitavo ano
  rationale: A fórmula cronológica hebraica usa uma expressão cardinal com função ordinal; esta forma é natural e precisa em português.
- source_word: לַעֲזַרְיָהוּ מֶלֶךְ יְהוּדָה
  choice: de Azarias, rei de Judá
  rationale: O לְ introduz a referência ao ano do reinado de Azarias, e a cadeia nominal identifica seu cargo e reino.
- source_word: מָלַךְ
  choice: tornou-se rei ... e reinou
  rationale: O verbo marca a ascensão de Zacarias ao trono, enquanto a duração de seis meses pede em português uma formulação verbal clara; a repetição explicita sem alterar o sentido.
- source_word: זְכַרְיָהוּ בֶן יָרָבְעָם
  choice: Zacarias, filho de Jeroboão
  rationale: Empregam-se as formas tradicionais e amplamente reconhecidas dos nomes bíblicos em português.
- source_word: עַל יִשְׂרָאֵל
  choice: sobre Israel
  rationale: Com o verbo מלך, עַל indica o povo ou território sobre o qual se exerce o governo.
- source_word: בְּשֹׁמְרוֹן
  choice: em Samaria
  rationale: A expressão locativa identifica Samaria como sede ou lugar do reinado.
- source_word: שִׁשָּׁה חֳדָשִׁים
  choice: reinou seis meses
  rationale: O acusativo de duração é expresso idiomaticamente em português junto ao verbo, deixando claro que se trata da duração do reinado.
