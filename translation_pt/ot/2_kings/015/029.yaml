  text: בִּ/ימֵ֞י פֶּ֣קַח מֶֽלֶךְ יִשְׂרָאֵ֗ל בָּא֮ תִּגְלַ֣ת פִּלְאֶסֶר֮ מֶ֣לֶךְ אַשּׁוּר֒ וַ/יִּקַּ֣ח אֶת עִיּ֡וֹן וְ/אֶת אָבֵ֣ל בֵּֽית מַעֲכָ֡ה וְ/אֶת יָ֠נוֹחַ וְ/אֶת קֶ֨דֶשׁ וְ/אֶת חָצ֤וֹר וְ/אֶת הַ/גִּלְעָד֙ וְ/אֶת הַ/גָּלִ֔ילָ/ה כֹּ֖ל אֶ֣רֶץ נַפְתָּלִ֑י וַ/יַּגְלֵ֖/ם אַשּֽׁוּרָ/ה־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/029.yaml
  text: In the days of Pekah king of Israel[a], Tiglath-pileser king of Assyria came and captured Ijon, Abel-beth-maacah, Janoah, Kedesh, Hazor, Gilead, and Galilee—all the land of Naphtali—and he carried them away to Assyria.
translation:
  language: pt
  text: Nos dias de Peca, rei de Israel, Tiglate-Pileser, rei da Assíria, veio e conquistou Ijom, Abel-Bete-Maaca, Janoa, Quedes, Hazor, Gileade e a Galileia — toda a terra de Naftali — e levou seus habitantes para a Assíria[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deportou seus habitantes para a Assíria”.'
    reason: Registra uma tradução lexical mais técnica para o verbo hebraico que indica remoção para o exílio.
lexical_decisions:
- source_word: בִּימֵי
  choice: Nos dias de
  rationale: Preserva a fórmula temporal hebraica de modo natural e solene em português, sem ampliá-la para “durante o reinado de”.
- source_word: בָּא
  choice: veio
  rationale: Traduz diretamente o verbo hebraico; o contexto militar e o verbo seguinte deixam claro que se tratou de uma ação hostil.
- source_word: וַיִּקַּח
  choice: conquistou
  rationale: No contexto de cidades e regiões tomadas por um rei invasor, “conquistou” expressa com clareza o sentido militar de “tomou”.
- source_word: עִיּוֹן
  choice: Ijom
  rationale: Forma portuguesa tradicional e legível do topônimo.
- source_word: אָבֵל בֵּית מַעֲכָה
  choice: Abel-Bete-Maaca
  rationale: Forma portuguesa do topônimo composto, com hifenização para indicar uma única localidade.
- source_word: יָנוֹחַ
  choice: Janoa
  rationale: Forma portuguesa corrente do topônimo.
- source_word: קֶדֶשׁ
  choice: Quedes
  rationale: Forma portuguesa tradicional do nome da cidade.
- source_word: חָצוֹר
  choice: Hazor
  rationale: Transliteração consagrada e amplamente reconhecível em português.
- source_word: הַגִּלְעָד
  choice: Gileade
  rationale: Forma portuguesa tradicional do nome geográfico; o artigo hebraico não precisa ser reproduzido diante do nome próprio.
- source_word: הַגָּלִילָה
  choice: a Galileia
  rationale: Forma natural em português para a região, conservando o artigo presente no hebraico.
- source_word: כֹּל אֶרֶץ נַפְתָּלִי
  choice: toda a terra de Naftali
  rationale: Mantém a formulação abrangente e a aposição que resume o território conquistado.
- source_word: וַיַּגְלֵם
  choice: levou seus habitantes para a Assíria
  rationale: O hifil de גלה descreve remoção para o exílio. Como o sufixo “os” retoma formalmente lugares, a explicitação discreta de “seus habitantes” comunica em português quem foi levado, sem alterar o sentido histórico.
