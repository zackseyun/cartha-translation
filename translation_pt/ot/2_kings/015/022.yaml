base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/022.yaml
  text: And Menahem lay down with his fathers[a], and Pekahiah his son reigned in his place.
translation:
  language: pt
  text: Menaém dormiu com seus antepassados[a], e seu filho Pecaías reinou em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “descansou com seus antepassados”. A expressão hebraica é uma fórmula usual para indicar a morte de um rei e a sucessão ao trono.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: descansou
  rationale: No contexto da fórmula régia de morte e sucessão, “descansou” comunica a morte de modo natural e digno, preservando parte da imagem hebraica sem a estranheza de uma tradução literal como “deitou-se”.
- source_word: עִם אֲבֹתָיו
  choice: com seus antepassados
  rationale: “Antepassados” expressa em português atual o sentido ancestral e dinástico de אָבוֹת, evitando que “pais” seja entendido apenas como progenitores imediatos.
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: Na fórmula de sucessão real, “reinou” traduz diretamente מלך; a expressão “em seu lugar” deixa clara a ascensão ao trono.
- source_word: פְּקַחְיָה
  choice: Pecaías
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico.
- source_word: בְנוֹ
  choice: seu filho
  rationale: Mantém explicitamente a relação filial presente no texto e a associa de maneira natural a Pecaías.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: Expressa com naturalidade a substituição e sucessão no cargo real.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A ordem “seu filho Pecaías” evita qualquer ambiguidade sobre a filiação. “Descansou” conserva o caráter eufemístico da fórmula hebraica, enquanto a nota registra a alternativa mais literal e tradicional.
