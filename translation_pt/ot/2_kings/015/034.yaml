id: 2KI.15.34
reference: 2 Kings 15:34
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֧ל אֲשֶׁר עָשָׂ֛ה עֻזִיָּ֥הוּ אָבִ֖י/ו עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/034.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that his father Uzziah had done.
translation:
  language: pt
  text: Ele fez o que era certo aos olhos de Javé, conforme tudo o que seu pai Uzias[a] havia feito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em hebraico: “Uzias”. Em outros trechos, esse rei também é chamado “Azarias”.'
    reason: Registra a forma alternativa do nome real encontrada em outros contextos bíblicos, sem alterar a leitura deste versículo.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ele fez
  rationale: O waw consecutivo dá continuidade à narrativa; em português, a conjunção inicial pode ser omitida num versículo apresentado isoladamente, mantendo-se o passado narrativo.
- source_word: הַיָּשָׁר
  choice: o que era certo
  rationale: Expressa de modo natural o sentido da construção idiomática ‘fazer o que é reto/certo’.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Javé
  rationale: Preserva a metáfora hebraica de avaliação divina em linguagem corrente e digna.
- source_word: יְהוָה
  choice: Javé
  rationale: Representa em português o nome divino YHWH, em vez de substituí-lo por um título.
- source_word: כְּכֹל אֲשֶׁר
  choice: conforme tudo o que
  rationale: Mantém tanto a ideia de conformidade com um padrão anterior quanto a abrangência indicada por כֹּל.
- source_word: עֻזִיָּהוּ
  choice: Uzias
  rationale: Transliteração portuguesa tradicional do nome que consta no texto hebraico deste versículo, sem harmonizá-lo com a forma alternativa Azarias.
- source_word: אָבִיו
  choice: seu pai
  rationale: O contexto genealógico imediato requer o sentido comum e direto de pai.
- source_word: עָשָׂה
  choice: havia feito
  rationale: O mais-que-perfeito composto esclarece que as ações de Uzias antecederam as do rei em foco.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Javé
  alternative: SENHOR; Jeová
  rationale: O hebraico traz explicitamente o tetragrama; ‘Javé’ preserva seu caráter de nome pessoal em forma portuguesa amplamente reconhecível.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura conserva o idiomatismo hebraico ‘aos olhos de’ e evita explicitar além do texto a natureza exata da imitação do pai.
