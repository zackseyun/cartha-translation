base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/023.yaml
  text: In the fiftieth year of Azariah king of Judah, Pekahiah son of Menahem became king over Israel in Samaria, and he reigned two years.
translation:
  language: pt
  text: No quinquagésimo ano de Azarias, rei de Judá, Pecaías, filho de Menaém, tornou-se rei de Israel, em Samaria, e reinou dois anos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת חֲמִשִּׁים שָׁנָה
  choice: No quinquagésimo ano
  rationale: A fórmula régia hebraica emprega um cardinal com sentido ordinal; esta é a forma natural e precisa em português.
- source_word: לַעֲזַרְיָה מֶלֶךְ יְהוּדָה
  choice: de Azarias, rei de Judá
  rationale: O ל marca Azarias como referência para a contagem do ano régio, e a cadeia nominal identifica seu cargo e reino.
- source_word: מָלַךְ
  choice: tornou-se rei
  rationale: Nesta notícia régia, o verbo assinala a ascensão ao trono; a duração do reinado é informada separadamente no fim do versículo.
- source_word: פְּקַחְיָה בֶן מְנַחֵם
  choice: Pecaías, filho de Menaém
  rationale: Os nomes seguem formas portuguesas bíblicas reconhecíveis, e a relação filial é preservada diretamente.
- source_word: עַל יִשְׂרָאֵל
  choice: rei de Israel
  rationale: Com מָלַךְ, a preposição עַל indica o povo ou território governado. A expressão idiomática portuguesa 'rei de Israel' comunica naturalmente esse domínio.
- source_word: בְּשֹׁמְרוֹן
  choice: em Samaria
  rationale: A preposição locativa indica Samaria como sede do reinado.
- source_word: שְׁנָתָיִם
  choice: reinou dois anos
  rationale: O dual significa 'dois anos'; o verbo é explicitado em português para formar uma oração completa e natural.
