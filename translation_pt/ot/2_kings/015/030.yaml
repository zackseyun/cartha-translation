  text: וַ/יִּקְשָׁר קֶ֜שֶׁר הוֹשֵׁ֣עַ בֶּן אֵלָ֗ה עַל פֶּ֨קַח֙ בֶּן רְמַלְיָ֔הוּ וַ/יַּכֵּ֨/הוּ֙ וַ/יְמִיתֵ֔/הוּ וַ/יִּמְלֹ֖ךְ תַּחְתָּ֑י/ו בִּ/שְׁנַ֣ת עֶשְׂרִ֔ים לְ/יוֹתָ֖ם בֶּן עֻזִיָּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/030.yaml
  text: Then Hoshea son of Elah conspired in a conspiracy against Pekah son of Remaliah, struck him down, put him to death, and reigned in his place, in the twentieth year of Jotham son of Uzziah.
translation:
  language: pt
  text: Então Oseias, filho de Elá, tramou uma conspiração[a] contra Peca, filho de Remalias, golpeou-o, matou-o e reinou em seu lugar, no vigésimo ano de Jotão, filho de Uzias.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico emprega duas palavras da mesma raiz, literalmente, “conspirou uma conspiração”, uma expressão enfática para indicar uma conspiração contra o rei.
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz “no vigésimo ano de Jotão, filho de Uzias”. Isso cria uma dificuldade cronológica nos dados sobre os reinados. Alguns intérpretes procuram harmonizar a data com o reinado de Acaz, mas a tradução segue a redação hebraica.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקְשָׁר קֶשֶׁר
  choice: tramou uma conspiração
  rationale: Preserva na medida do possível a construção hebraica de verbo mais substantivo, sem recorrer à formulação pouco natural “conspirou uma conspiração”. A nota registra a repetição cognata e sua ênfase.
- source_word: הוֹשֵׁעַ בֶּן אֵלָה
  choice: Oseias, filho de Elá
  rationale: Emprega as formas portuguesas correntes dos nomes e conserva o patronímico para identificação histórica.
- source_word: עַל פֶּקַח בֶּן רְמַלְיָהוּ
  choice: contra Peca, filho de Remalias
  rationale: Neste contexto de conspiração, עַל indica o alvo hostil da ação; “contra” é o equivalente natural.
- source_word: וַיַּכֵּהוּ
  choice: golpeou-o
  rationale: Conserva a ação violenta de נכה sem antecipar o sentido do verbo seguinte, que declara explicitamente a morte.
- source_word: וַיְמִיתֵהוּ
  choice: matou-o
  rationale: Expressa de modo natural e direto o hifil causativo de מות neste contexto.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: reinou em seu lugar
  rationale: Mantém tanto o sentido de מלך, “reinar”, quanto a ideia de sucessão expressa por תַּחְתָּיו.
- source_word: בִּשְׁנַת עֶשְׂרִים לְיוֹתָם בֶּן עֻזִיָּה
  choice: no vigésimo ano de Jotão, filho de Uzias
  rationale: Reproduz diretamente a fórmula de datação do texto massorético, sem harmonizar a dificuldade cronológica.
theological_decisions:
- issue: Tensão cronológica na fórmula de datação
  choice: Manter “no vigésimo ano de Jotão, filho de Uzias” no texto principal.
  alternative: Harmonizar a data com o reinado de Acaz ou emendar o número.
  rationale: O texto hebraico atribui explicitamente a data a Jotão. A tradução não deve solucionar por alteração uma dificuldade histórica ou textual; a nota informa o leitor sem eliminar a tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de nomes bíblicos correntes no Brasil. A sintaxe narrativa é direta; a construção hebraica enfática e a tensão cronológica são preservadas ou explicitadas em notas, sem harmonização denominacional.
