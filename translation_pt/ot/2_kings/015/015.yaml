base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/015.yaml
  text: The rest of the acts of Shallum[a], and the conspiracy that he conspired—behold[c][b], they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: pt
  text: Os demais atos de Salum e sua conspiração, que ele tramou[a] — eis[b] que estão escritos no Livro das Crônicas dos Reis de Israel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “e sua conspiração que ele conspirou”. O hebraico emprega um substantivo e um verbo da mesma raiz, dando ênfase à ação.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “eis que estão escritos” é uma fórmula que remete o leitor aos registros régios; também pode ser traduzida simplesmente por “estão registrados”.
    reason: lexical_alternative
  - marker: c
    text: Isto é, os anais oficiais da monarquia de Israel citados como fonte ao longo de Reis, não o livro bíblico de Crônicas.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי שַׁלּוּם
  choice: Os demais atos de Salum
  rationale: Na fórmula régia recorrente, יֶתֶר indica o restante, e דִּבְרֵי se refere aos atos ou acontecimentos do reinado, não apenas a palavras faladas.
- source_word: וְקִשְׁרוֹ אֲשֶׁר קָשָׁר
  choice: e a conspiração que ele tramou
  rationale: קֶשֶׁר designa uma conspiração política. O verbo cognato קָשָׁר é vertido por “tramou” para manter a repetição de sentido sem produzir a construção pouco natural “conspirou uma conspiração”.
- source_word: הִנָּם
  choice: eis que
  rationale: Preserva a força dêitica e a função formulaica do hebraico, com registro digno e compreensível em português.
- source_word: כְּתֻבִים
  choice: estão escritos
  rationale: Reproduz diretamente o particípio passivo hebraico e combina com a fórmula que remete aos registros régios.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: no Livro das Crônicas dos Reis de Israel
  rationale: Expressa de modo idiomático o título da fonte documental régia citada em Reis; “no” comunica que os fatos constam do livro.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A construção “eis que” conserva o apontamento formulaico do hebraico, enquanto “tramou” evita uma repetição artificial em português; a forma cognata original é documentada em nota.
