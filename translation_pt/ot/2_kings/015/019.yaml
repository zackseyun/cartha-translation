  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tradução conserva as imagens repetidas de “mão” no hebraico, mas oferece em nota a interpretação política mais idiomática. Os marcadores foram posicionados junto aos trechos que esclarecem.
