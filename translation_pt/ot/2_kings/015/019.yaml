base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/019.yaml
  text: Pul king of Assyria came against the land[b][a], and Menahem gave Pul a thousand talents of silver so that his hand might be with him to strengthen the kingdom in his hand.
translation:
  language: pt
  text: Pul, rei da Assíria, veio contra a terra[a], e Menaém deu a Pul mil talentos de prata para que Pul o apoiasse a fortalecer o reino sob seu domínio.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “A terra” provavelmente se refere à terra de Israel.
    reason: cultural_note
  - marker: b
    text: 'Ou, mais literalmente: “para que a mão dele estivesse com ele, para fortalecer o reino em sua mão”. A expressão indica o apoio de Pul a Menaém e o controle de Menaém sobre o reino.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא
  choice: veio
  rationale: O qal perfeito de בוא, na narrativa, indica a vinda ou chegada; “veio” é natural e preserva o movimento em direção à terra.
- source_word: פ֤וּל
  choice: Pul
  rationale: Nome próprio transliterado conforme a forma tradicional e próxima do hebraico.
- source_word: מֶֽלֶךְ אַשּׁוּר
  choice: rei da Assíria
  rationale: Reproduz diretamente a cadeia construta e identifica o cargo de Pul.
- source_word: עַל הָאָרֶץ
  choice: contra a terra
  rationale: Após verbo de movimento, עַל pode indicar avanço hostil. “A terra” mantém a concisão do hebraico sem explicitar além do texto que se trata de Israel.
- source_word: וַיִּתֵּן
  choice: deu
  rationale: Traduz literalmente נתן. Embora o contexto indique pagamento político ou tributo, “deu” evita acrescentar uma caracterização não expressa pelo verbo.
- source_word: אֶלֶף כִּכַּר כָּסֶף
  choice: mil talentos de prata
  rationale: Expressão convencional para a medida de peso ככר aplicada à prata.
- source_word: לִהְיוֹת יָדוֹ אִתּוֹ
  choice: para que a mão dele estivesse com ele
  rationale: Conserva a imagem hebraica da mão como apoio ou poder aliado; a nota esclarece o sentido político e a possível ambiguidade dos pronomes.
- source_word: לְהַחֲזִיק
  choice: a fim de firmar
  rationale: O hifil de חזק comunica tornar firme ou consolidar. “Firmar” é idiomático no contexto da consolidação do governo.
- source_word: הַמַּמְלָכָה
  choice: o reino
  rationale: ממלכה pode designar reino, realeza ou domínio; “reino” é a equivalência direta e adequada ao contexto.
- source_word: בְּיָדוֹ
  choice: em suas mãos
  rationale: Preserva a metáfora hebraica de posse e controle, em formulação portuguesa natural.
theological_decisions: []
