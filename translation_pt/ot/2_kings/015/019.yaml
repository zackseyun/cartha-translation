    issue: Ambiguidade pronominal excessiva na oração de propósito
    rationale: Em “para que a mão dele estivesse com ele”, o leitor português não consegue identificar naturalmente qual personagem é referido por cada pronome. O contexto requer o apoio de Pul a Menaém; isso pode ser expresso no texto, enquanto a nota conserva a construção literal hebraica.
  - severity: low
    issue: Pluralização de “mão” em “em suas mãos”
    rationale: O hebraico traz o singular בְּיָדוֹ, literalmente “em sua mão”. Embora a expressão denote controle, o plural português não é exigido e enfraquece a correspondência formal indicada pela nota.
  - severity: low
    issue: “Firmar” é menos próximo do verbo hebraico
    rationale: O hifil de חזק significa tornar forte, fortalecer ou consolidar. “Fortalecer” preserva mais diretamente esse valor.
  revised_text: Pul, rei da Assíria, veio contra a terra[a], e Menaém deu a Pul mil talentos de prata para que Pul o apoiasse a fortalecer o reino sob seu domínio.[b]
