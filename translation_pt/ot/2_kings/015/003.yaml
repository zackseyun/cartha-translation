lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ele fez
  rationale: O wayyiqtol introduz a ação narrativa; em português atual, não é necessário reproduzir o waw inicial com «e».
- source_word: הַיָּשָׁר
  choice: o que era certo
  rationale: O adjetivo com artigo tem função substantivada e designa aquilo que é reto ou correto.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Mantém a metáfora hebraica de avaliação segundo a perspectiva divina e soa natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: seguindo em tudo o exemplo de
  rationale: Expressa naturalmente em português a conformidade completa indicada por כְּכֹל אֲשֶׁר, sem sugerir identidade absoluta de cada ato.
- source_word: אֲמַצְיָהוּ
  choice: Amazias
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: אָבִיו
  choice: seu pai
  rationale: O contexto genealógico aponta para o pai literal, e não para um antepassado remoto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o Tetragrama como nome próprio; «Yahweh» preserva essa função sem o substituir pelo título tradicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a linguagem avaliativa do relato régio e evita explicações confessionais.
