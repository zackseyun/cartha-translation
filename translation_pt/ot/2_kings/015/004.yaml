  text: Only the high places were not removed; the people still were sacrificing and making offerings in smoke on the high places.
translation:
  language: pt
  text: Contudo, os lugares altos não foram removidos; o povo ainda oferecia sacrifícios e queimava incenso nos lugares altos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, em sentido mais amplo: “fazia uma oferta subir em fumaça nos lugares altos”. O verbo hebraico pode referir-se especificamente a queimar incenso ou, de modo mais amplo, a uma oferta que sobe em fumaça.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Somente
  rationale: Marca a exceção à avaliação positiva do rei e preserva a formulação concisa típica de Reis.
- source_word: הַבָּמוֹת
  choice: os lugares altos
  rationale: Designa locais de culto elevados; a expressão tradicional preserva o contexto histórico-religioso sem reduzi-los genericamente a santuários.
- source_word: לֹא סָרוּ
  choice: não foram eliminados
  rationale: Com 'lugares altos' como sujeito, o sentido é que esses locais de culto não foram retirados e continuaram existindo.
- source_word: עוֹד
  choice: ainda
  rationale: Indica a continuidade da prática cultual.
- source_word: הָעָם
  choice: o povo
  rationale: Tradução direta da referência coletiva à população.
- source_word: מְזַבְּחִים
  choice: oferecia sacrifícios
  rationale: Expressa de modo natural em português a ação cultual do verbo זבח.
- source_word: וּמְקַטְּרִים
  choice: queimava ofertas
  rationale: Preserva a ideia de fazer uma oferta subir em fumaça sem restringir necessariamente o objeto a incenso.
- source_word: בַּבָּמוֹת
  choice: nos lugares altos
  rationale: Indica naturalmente em português o local onde se realizavam as práticas cultuais.
theological_decisions:
- issue: Natureza do culto praticado nos lugares altos
  choice: Relatar o culto continuado em locais não eliminados sem identificar a divindade cultuada nem classificar toda a prática como idolatria.
  alternative: Explicitar que o povo praticava idolatria, ou que adorava exclusivamente o SENHOR em locais não autorizados.
  rationale: O hebraico menciona sacrifícios e ofertas queimadas nos lugares altos, mas neste versículo não identifica a divindade à qual eram oferecidos; a tradução preserva essa contenção.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém a expressão bíblico-histórica consagrada “lugares altos” e emprega “queimava ofertas” para conservar a amplitude lexical do hebraico.
