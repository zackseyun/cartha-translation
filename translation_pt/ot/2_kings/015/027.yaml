base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/027.yaml
  text: In the fifty-second year of Azariah king of Judah, Pekah son of Remaliah became king over Israel in Samaria, and he reigned twenty years.
translation:
  language: pt
  text: No quinquagésimo segundo ano de Azarias, rei de Judá, Peca, filho de Remalias, tornou-se rei sobre Israel, em Samaria, e reinou durante vinte anos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת חֲמִשִּׁים וּשְׁתַּיִם שָׁנָה
  choice: No quinquagésimo segundo ano
  rationale: Reproduz naturalmente em português a fórmula hebraica de datação pelo ano de reinado, usando o ordinal esperado nesse contexto.
- source_word: לַעֲזַרְיָה מֶלֶךְ יְהוּדָה
  choice: de Azarias, rei de Judá
  rationale: Mantém a relação entre o ano de reinado e Azarias, bem como o título real explícito no hebraico.
- source_word: מָלַךְ
  choice: tornou-se rei
  rationale: Nesta fórmula régia, o verbo assinala a ascensão ao trono; esta opção também evita repetir imediatamente “reinou” antes da indicação da duração.
- source_word: פֶּקַח בֶּן רְמַלְיָהוּ
  choice: Peca, filho de Remalias
  rationale: Emprega as formas portuguesas tradicionais dos nomes e preserva claramente o patronímico hebraico.
- source_word: עַל יִשְׂרָאֵל
  choice: sobre Israel
  rationale: Traduz diretamente a construção que indica o povo ou reino sobre o qual Peca exerceu autoridade.
- source_word: בְּשֹׁמְרוֹן
  choice: em Samaria
  rationale: Expressa a localização da sede do governo, conforme o valor locativo da preposição hebraica.
- source_word: עֶשְׂרִים שָׁנָה
  choice: durante vinte anos
  rationale: Transmite de modo claro e idiomático a duração do reinado indicada no texto.
