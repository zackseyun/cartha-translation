  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מֵֽ/חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/024.yaml
  text: He did what was evil in the eyes of Yahweh[a]. He did not turn away from the sins of Jeroboam son of Nebat[b], who caused Israel to sin.
translation:
  language: pt
  text: Fez o que era mau aos olhos de Yahweh. Não se afastou dos pecados de Jeroboão, filho de Nebate, que levou Israel a pecar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Fez o que era mau
  rationale: A expressão régia formulaica é vertida de modo natural e fiel; o waw narrativo não precisa ser explicitado em português.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Preserva a imagem hebraica de avaliação divina e verte o nome pessoal יהוה como Yahweh.
- source_word: לֹא סָר
  choice: Não se afastou
  rationale: Expressa a ideia de não abandonar um padrão de conduta, com formulação corrente em português.
- source_word: מֵחַטֹּאות
  choice: dos pecados
  rationale: Mantém diretamente o plural hebraico e sua dimensão moral e religiosa.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jeroboão, filho de Nebate
  rationale: Emprega as formas portuguesas tradicionais dos nomes e conserva o patronímico.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: que levou Israel a pecar
  rationale: Comunica naturalmente a força causativa do hifil de חטא sem sugerir coerção mecânica.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome pessoal; sua transliteração preserva essa função sem substituí-lo por um título.
- issue: Força causativa de הֶחֱטִיא
  choice: levou Israel a pecar
  alternative: fez Israel pecar; induziu Israel ao pecado
  rationale: A escolha conserva a responsabilidade de Jeroboão como agente de influência e a ação pecaminosa de Israel, sem resolver além do texto o modo exato dessa causalidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção régia permanece concisa e formulaica. Não foram incluídas notas, pois as alternativas lexicais não criam ambiguidade relevante que exija aparato no texto publicado.
