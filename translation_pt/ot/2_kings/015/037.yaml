source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם הֵחֵ֣ל יְהוָ֗ה לְ/הַשְׁלִ֨יחַ֙ בִּֽ/יהוּדָ֔ה רְצִ֖ין מֶ֣לֶךְ אֲרָ֑ם וְ/אֵ֖ת פֶּ֥קַח בֶּן רְמַלְיָֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/037.yaml
  text: In those days Yahweh began to send against Judah Rezin king of Aram[b][a], and Pekah son of Remaliah.
translation:
  language: pt
  text: Naqueles dias, Yahweh começou a enviar contra Judá[a] Rezim, rei de Arã[b], e Peca, filho de Remalias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a enviar para dentro de Judá”. No contexto, o envio tem sentido hostil.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “Arã”; tradicionalmente: “Síria”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: Naqueles dias
  rationale: Preserva de modo natural o idioma temporal hebraico que introduz um período histórico.
- source_word: הֵחֵל
  choice: começou
  rationale: Expressa diretamente o início da ação indicado pelo hifil.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: לְהַשְׁלִיחַ בִּיהוּדָה
  choice: a enviar contra Judá
  rationale: Embora ב possa indicar localização ou direção, o contexto militar dá ao envio sentido hostil; 'contra Judá' comunica isso em português natural.
- source_word: רְצִין מֶלֶךְ אֲרָם
  choice: Rezim, rei de Arã
  rationale: Emprega as formas portuguesas correntes dos nomes e conserva Arã, correspondente direto do hebraico, em vez do tradicional 'Síria'.
- source_word: וְאֵת פֶּקַח בֶּן רְמַלְיָהוּ
  choice: e Peca, filho de Remalias
  rationale: Mantém a coordenação do segundo agente e a identificação patronímica de forma clara e natural.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o Tetragrama como nome próprio; a transliteração preserva essa função sem substituí-lo por um título.
- issue: Agência divina no início da pressão militar contra Judá
  choice: Yahweh começou a enviar
  alternative: Yahweh permitiu que viessem
  rationale: O hifil de שלח atribui diretamente a Yahweh o envio; traduzir por mera permissão suavizaria uma tensão teológica presente no texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi levemente ajustada com vírgulas para identificar naturalmente os reis. Os marcadores aparecem logo após as expressões a que se referem.
