  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מִן חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/028.yaml
  text: He did what was evil in the eyes of Yahweh. He did not turn away from the sins of Jeroboam son of Nebat, who caused Israel to sin.
translation:
  language: pt
  text: Fez o que era mau aos olhos de Yahweh. Não se afastou dos pecados de Jeroboão, filho de Nebate, que levou Israel a pecar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Fez o que era mau
  rationale: A forma narrativa introduz a avaliação régia habitual. Em português, “fez o que era mau” comunica naturalmente o sentido da expressão hebraica sem reproduzir de modo rígido “fez o mal”.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Preserva a metáfora hebraica transparente de avaliação divina e mantém o nome da aliança como “Yahweh”.
- source_word: לֹא סָר
  choice: Não se afastou
  rationale: O verbo סור com מִן indica afastar-se ou desviar-se de uma prática; “não se afastou” é corrente e adequado ao contexto moral.
- source_word: מִן חַטֹּאות
  choice: dos pecados
  rationale: O plural חַטֹּאות é vertido diretamente por “pecados”, preservando a fórmula régia.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jeroboão, filho de Nebate
  rationale: Emprega as formas portuguesas tradicionais e uma construção patronímica clara e natural.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: que levou Israel a pecar
  rationale: A forma causativa de חטא atribui a Jeroboão responsabilidade por induzir Israel ao pecado. “Levou ... a pecar” preserva essa causalidade em português natural.
theological_decisions:
- issue: Tradução do nome da aliança יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto contém diretamente o Tetragrama. “Yahweh” preserva o nome próprio e segue a orientação do projeto, sem substituí-lo por um título.
- issue: Causalidade em הֶחֱטִיא
  choice: levou Israel a pecar
  alternative: fez Israel pecar; induziu Israel ao pecado
  rationale: A tradução conserva a força causativa do hifil sem eliminar a agência moral de Israel nem atenuar a responsabilidade de Jeroboão.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A formulação mantém o paralelismo da avaliação régia e evita vocabulário excessivamente arcaico.
