  text: וְ/יֶ֥תֶר דִּבְרֵי פֶ֖קַח וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הִנָּ֣/ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/031.yaml
  text: The rest of the acts of Pekah[a], and all that he did—behold, they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: pt
  text: Os demais atos de Peca e tudo o que ele fez — eis que estão escritos no Livro das Crônicas dos Reis de Israel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Livro dos Anais dos Reis de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Os demais atos
  rationale: יֶתֶר indica o restante, e דִּבְרֵי, nesta fórmula de conclusão dos reinados, refere-se idiomaticamente aos atos ou feitos do rei. A conjunção inicial não exige um marcador temporal como “agora”.
- source_word: פֶקַח
  choice: Peca
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: e tudo o que ele fez
  rationale: Tradução direta que preserva a abrangência de כָל e o sentido simples de עָשָׂה.
- source_word: הִנָּם
  choice: eis que estão
  rationale: Mantém a função apresentativa e enfática da expressão hebraica, sem reduzi-la a uma simples cópula.
- source_word: כְּתוּבִים
  choice: escritos
  rationale: Preserva o sentido concreto do particípio passivo e a natureza documental da referência.
- source_word: עַל סֵפֶר
  choice: no Livro
  rationale: Embora a preposição hebraica seja literalmente “sobre”, em referência ao conteúdo de um documento o português idiomático pede “no”. “Livro” é a equivalência convencional de סֵפֶר neste contexto.
- source_word: דִּבְרֵי הַיָּמִים
  choice: das Crônicas
  rationale: Na fórmula historiográfica, a expressão designa registros cronísticos ou anais. “Crônicas” é clara e tradicional; “Anais” permanece uma alternativa legítima.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: dos Reis de Israel
  rationale: O לְ integra o título do documento e indica os reis aos quais o registro diz respeito; a relação genitiva é natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com a fórmula régia preservada. “Eis que” conserva a ênfase apresentativa do hebraico, enquanto o travessão favorece a leitura natural. O marcador da nota foi colocado junto ao título ao qual a alternativa lexical se refere.
