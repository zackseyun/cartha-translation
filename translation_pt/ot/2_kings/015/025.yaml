  text: וַ/יִּקְשֹׁ֣ר עָלָי/ו֩ פֶּ֨קַח בֶּן רְמַלְיָ֜הוּ שָׁלִישׁ֗/וֹ וַ/יַּכֵּ֨/הוּ בְ/שֹׁמְר֜וֹן בְּ/אַרְמ֤וֹן בֵּית מלך אֶת אַרְגֹּ֣ב וְ/אֶת הָ/אַרְיֵ֔ה וְ/עִמּ֛/וֹ חֲמִשִּׁ֥ים אִ֖ישׁ מִ/בְּנֵ֣י גִלְעָדִ֑ים וַ/יְמִיתֵ֖/הוּ וַ/יִּמְלֹ֥ךְ תַּחְתָּֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/025.yaml
  text: Then Pekah son of Remaliah[a], his officer, conspired against him and struck him down in Samaria, in the citadel of the king’s house, with Argob and Arieh, and with him were fifty men of the Gileadites[d][c][b]. So he put him to death and reigned in his place.
translation:
  language: pt
  text: Então Peca, filho de Remalias, seu oficial[a], conspirou contra ele e o golpeou em Samaria, na cidadela do palácio real[b], junto com Argobe e Arié[c]. Com ele estavam cinquenta homens dentre os gileaditas[d]. Assim, Peca o matou e reinou em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu capitão”. O termo hebraico indica um oficial de alta patente, provavelmente militar, mas a patente exata é incerta.
    reason: lexical_alternative
  - marker: b
    text: Ou “no palácio real”. A palavra hebraica pode designar um palácio, uma cidadela ou uma residência real fortificada.
    reason: lexical_alternative
  - marker: c
    text: Arié é entendido aqui como nome próprio, em paralelo com Argobe; a palavra hebraica também pode significar “leão”.
    reason: lexical_alternative
  - marker: d
    text: A expressão hebraica usa “filhos de” para designar membros ou habitantes de Gileade; ou “cinquenta homens dos gileaditas”.
    reason: source_idiom
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: conspirou contra ele
  rationale: No contexto político de Reis, קשר indica uma conspiração contra o governante; a formulação é natural e precisa em português.
- source_word: שָׁלִישׁוֹ
  choice: seu oficial
  rationale: O termo designa um oficial de alta patente, provavelmente militar, mas sua posição exata é incerta; “oficial” evita especificação indevida.
- source_word: וַיַּכֵּהוּ
  choice: o atacou
  rationale: נכה pode significar ferir, golpear ou abater. “Atacou” preserva a distinção em relação ao verbo posterior, que declara explicitamente a morte.
- source_word: בְּאַרְמוֹן בֵּית מֶלֶךְ
  choice: na cidadela do palácio real
  rationale: אַרְמוֹן pode indicar palácio, cidadela ou residência fortificada; a escolha comunica a área fortificada do complexo real sem a construção pouco natural “cidadela da casa do rei”.
- source_word: אֶת אַרְגֹּב וְאֶת הָאַרְיֵה
  choice: junto com Argobe e Arié
  rationale: O paralelismo e a marcação de objeto favorecem a leitura de ambos como nomes pessoais, embora אַרְיֵה também signifique lexicalmente “leão”.
- source_word: וְעִמּוֹ חֲמִשִּׁים אִישׁ מִבְּנֵי גִלְעָדִים
  choice: Com ele estavam cinquenta homens dentre os gileaditas
  rationale: A oração circunstancial identifica os homens que acompanhavam Peca; “dentre” preserva o sentido partitivo de מִן.
- source_word: וַיְמִיתֵהוּ
  choice: Peca o matou
  rationale: O hifil de מות significa causar a morte. A repetição do nome elimina uma possível ambiguidade de sujeito criada pela menção dos acompanhantes.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: e reinou em seu lugar
  rationale: É a fórmula habitual de sucessão real e soa natural em português.
