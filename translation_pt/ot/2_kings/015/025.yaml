translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A pontuação divide a longa sequência hebraica para esclarecer que os cinquenta homens acompanhavam Peca. Os nomes seguem formas portuguesas reconhecíveis.
