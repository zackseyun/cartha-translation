source:
  edition: WLC
  text: ה֣וּא דְבַר יְהוָ֗ה אֲשֶׁ֨ר דִּבֶּ֤ר אֶל יֵהוּא֙ לֵ/אמֹ֔ר בְּנֵ֣י רְבִיעִ֔ים יֵשְׁב֥וּ לְ/ךָ֖ עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל וַֽ/יְהִי כֵֽן־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/012.yaml
  text: This was the word of Yahweh that he spoke to Jehu, saying, “Your sons to the fourth generation shall sit on the throne of Israel.” And so it happened.
translation:
  language: pt
  text: 'Esta foi a palavra de Yahweh que Yahweh havia dirigido a Jeú: “Teus filhos, até a quarta geração, se assentarão no trono de Israel.” E assim aconteceu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוּא
  choice: Essa foi
  rationale: O pronome aponta retrospectivamente para o acontecimento anterior como cumprimento da declaração divina; em português, “Essa foi” expressa com naturalidade essa função demonstrativa.
- source_word: דְבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: דָּבָר designa aqui uma declaração divina; “palavra” preserva a expressão bíblica e seu peso, sem reduzir o sentido a mera promessa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, distinguindo-o de um título como “Senhor”.
- source_word: אֲשֶׁר דִּבֶּר אֶל יֵהוּא לֵאמֹר
  choice: que ele havia dito a Jeú
  rationale: O mais-que-perfeito explicita a anterioridade da declaração em relação ao seu cumprimento, enquanto “dito a Jeú” introduz a citação de modo natural e fiel.
- source_word: בְּנֵי רְבִעִים
  choice: Seus filhos, até a quarta geração
  rationale: Mantém a linguagem filial do hebraico e torna claro que a dinastia de Jeú continuaria por quatro gerações de descendentes.
- source_word: יֵשְׁבוּ לְךָ
  choice: se assentarão
  rationale: Preserva a metáfora concreta de ocupar o trono; o dativo לְךָ é refletido pelo possessivo “Seus” no início da frase, evitando uma formulação artificial.
- source_word: עַל כִּסֵּא יִשְׂרָאֵל
  choice: no trono de Israel
  rationale: Reproduz diretamente a imagem régia do texto hebraico.
- source_word: וַיְהִי כֵן
  choice: E assim aconteceu
  rationale: Expressa em português atual a fórmula narrativa que confirma o cumprimento da palavra anterior.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto traz o nome pessoal divino. “Yahweh” o representa por transliteração, sem substituí-lo por um título nem adotar a forma híbrida tradicional “Jeová”.
- issue: Alcance dinástico de בְּנֵי רְבִעִים
  choice: filhos até a quarta geração
  alternative: descendentes por quatro gerações
  rationale: A tradução conserva “filhos”, mas esclarece o alcance geracional do oráculo sem determinar além do texto a forma exata de contagem.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A sintaxe evita arcaísmos como “eis que” e “sucedeu”, mas preserva a linguagem bíblica de “palavra” e “trono”.
