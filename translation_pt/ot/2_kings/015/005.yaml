base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/005.yaml
  text: And Yahweh struck the king[a], and he was leprous until the day of his death, and he lived in a separate house. And Jotham the king’s son was over the household[b], judging the people of the land.
translation:
  language: pt
  text: Então Yahweh feriu o rei, e ele ficou com uma doença de pele[a] até o dia de sua morte e morou numa casa separada[b]. Jotão, filho do rei, administrava o palácio e julgava o povo da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico é tradicionalmente traduzido por “lepra”, mas não designa necessariamente a hanseníase moderna; pode referir-se, de modo mais amplo, a uma doença grave da pele.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “numa casa de isolamento”. O sentido exato da expressão hebraica é incerto, mas ela provavelmente indica uma residência segregada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, distinguindo-o de títulos como “Senhor” e preservando sua identidade no texto hebraico.
- source_word: וַיְנַגַּע
  choice: feriu
  rationale: Neste contexto, נגע descreve uma ação aflitiva de Deus, não um simples toque; “feriu” é conciso e mantém explícita a agência divina.
- source_word: מְצֹרָע
  choice: com uma doença de pele
  rationale: Evita identificar anacronicamente a condição hebraica com a hanseníase moderna e comunica em português corrente a natureza geral da enfermidade.
- source_word: עַד יוֹם מֹתוֹ
  choice: até o dia de sua morte
  rationale: Preserva o idioma hebraico e sua cadência solene sem perder naturalidade.
- source_word: בְּבֵית הַחָפְשִׁית
  choice: numa casa separada
  rationale: A expressão é difícil, mas o contexto favorece uma residência segregada; “casa separada” mantém essa ideia sem atribuir ao termo uma precisão indevida.
- source_word: עַל הַבַּיִת
  choice: administrava o palácio
  rationale: A expressão indica responsabilidade pela casa real e, no contexto, o exercício da administração palaciana; a formulação é natural em português.
- source_word: שֹׁפֵט
  choice: julgava
  rationale: Representa diretamente o particípio hebraico e conserva tanto a dimensão judicial quanto a possível função governamental.
- source_word: עַם הָאָרֶץ
  choice: o povo da terra
  rationale: Mantém a expressão hebraica deliberadamente ampla, sem reduzi-la a uma categoria política moderna específica.
theological_decisions:
- issue: Natureza da condição indicada por מְצֹרָע
  choice: “com uma doença de pele” no texto principal, com nota sobre a tradução tradicional
  alternative: “leproso” ou “com lepra”
  rationale: O termo hebraico não exige identificação com a hanseníase moderna. A escolha evita precisão médica indevida, enquanto a nota preserva a terminologia bíblica tradicional.
- issue: Agência divina na enfermidade do rei
  choice: Manter explicitamente “Yahweh feriu o rei”
  alternative: “o rei foi acometido”
  rationale: A construção hebraica atribui diretamente a ação a Yahweh; uma formulação passiva enfraqueceria essa afirmação teológica do narrador.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A coordenação hebraica foi suavizada para dar fluência narrativa, e “enquanto” explicita a simultaneidade funcional sem acrescentar causalidade. Os marcadores [a] e [b] aparecem no texto principal.
