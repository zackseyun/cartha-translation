  text: בִּ/שְׁנַ֣ת שְׁתַּ֔יִם לְ/פֶ֥קַח בֶּן רְמַלְיָ֖הוּ מֶ֣לֶךְ יִשְׂרָאֵ֑ל מָלַ֛ךְ יוֹתָ֥ם בֶּן עֻזִיָּ֖הוּ מֶ֥לֶךְ יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/032.yaml
  text: In the second year of Pekah son of Remaliah[a], king of Israel, Jotham son of Uzziah, king of Judah[b], became king.
translation:
  language: pt
  text: No segundo ano de Peca, filho de Remalias, rei de Israel, Jotão, filho de Uzias[a], rei de Judá, tornou-se rei[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em outros trechos, Uzias também é chamado Azarias.
    reason: cross_reference
  - marker: b
    text: 'Ou: “começou a reinar”. O verbo hebraico pode indicar a ascensão ao trono ou o início de um reinado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁתַּיִם
  choice: No segundo ano
  rationale: A construção introduz uma data baseada no ano de reinado; embora שְׁתַּיִם seja formalmente o cardinal “dois”, aqui tem sentido ordinal.
- source_word: לְ/פֶקַח
  choice: de Peca
  rationale: O לְ identifica o rei cujo ano de reinado está sendo contado; “de Peca” é a formulação natural em português.
- source_word: בֶּן רְמַלְיָהוּ
  choice: filho de Remalias
  rationale: Mantém a construção patronímica e a identificação histórica do texto hebraico.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: rei de Israel
  rationale: Reproduz diretamente o título real e o reino de Peca.
- source_word: מָלַךְ
  choice: tornou-se rei
  rationale: No contexto de uma notícia de ascensão, o verbo indica a entrada na realeza; esta formulação comunica esse valor ingressivo sem excluir a tradução “começou a reinar”.
- source_word: יוֹתָם
  choice: Jotão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: בֶּן עֻזִיָּהוּ
  choice: filho de Uzias
  rationale: O hebraico deste versículo traz עֻזִיָּהוּ, “Uzias”; a forma alternativa “Azarias”, usada em outros lugares para o mesmo rei, é indicada em nota.
- source_word: מֶלֶךְ יְהוּדָה
  choice: rei de Judá
  rationale: Preserva o título em aposição, identificando claramente o reino de Jotão.
