id: 2KI.15.36
reference: 2 Kings 15:36
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יוֹתָ֖ם אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/036.yaml
  text: The rest of the acts of Jotham[a], which he did[b], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: pt
  text: Os demais feitos de Jotão, que ele realizou, não estão escritos[a] no Livro das Crônicas dos Reis de Judá[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “registrados”. O hebraico diz literalmente “escritos”, no sentido de incluídos em um registro oficial.
    reason: lexical_alternative
  - marker: b
    text: O “Livro das Crônicas dos Reis de Judá” era uma fonte de anais reais, não necessariamente o livro bíblico de Crônicas.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר
  choice: Os demais
  rationale: יֶתֶר indica o restante ou o que ainda há para relatar. O וְ inicial tem função de ligação com o contexto e não exige um marcador temporal como “agora”.
- source_word: דִּבְרֵי
  choice: feitos
  rationale: Embora דִּבְרֵי possa significar literalmente “palavras” ou “assuntos”, nesta fórmula de encerramento régio designa os atos ou acontecimentos do reinado.
- source_word: יוֹתָם
  choice: Jotão
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico יוֹתָם em português.
- source_word: אֲשֶׁר עָשָׂה
  choice: que ele realizou
  rationale: Mantém a oração relativa hebraica e evita a combinação menos natural “feitos que ele fez”.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: não estão escritos
  rationale: Preserva a pergunta retórica, que pressupõe resposta afirmativa, e mantém o sentido literal de כְּתוּבִים.
- source_word: עַל סֵפֶר
  choice: no Livro
  rationale: Embora a construção seja literalmente “sobre o livro/rolo”, “no Livro” expressa de modo idiomático a inclusão em um registro documental.
- source_word: דִּבְרֵי הַיָּמִים
  choice: das Crônicas
  rationale: A expressão designa registros analísticos; “Crônicas” preserva a formulação tradicional e o caráter de título.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: dos Reis de Judá
  rationale: Neste título de fonte, לְ é expresso naturalmente por “dos”, indicando o registro relativo aos reis de Judá.
theological_decisions:
- issue: Identidade do Livro das Crônicas dos Reis de Judá
  choice: Não identificar essa fonte com o livro bíblico de Crônicas
  alternative: Entender a expressão como referência direta ao livro canônico de Crônicas
  rationale: A fórmula remete a uma fonte analística régia citada pelo autor de Reis; o texto não estabelece que seja o livro bíblico canônico conhecido como Crônicas.
translation_notes:
  register: Português atual, digno e de leitura ampla, com a forma tradicional “Jotão”. A pergunta retórica e a fórmula de encerramento régio foram preservadas sem acrescentar um marcador discursivo como “agora”.
