base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/016.yaml
  text: Then Menahem struck Tiphsah[a], and all who were in it, and its territory from Tirzah, because it had not opened to him; and he struck it[c][b], ripping open all its pregnant women.
translation:
  language: pt
  text: Então Menaém atacou Tifsa, tudo o que nela havia e todo o seu território, desde Tirza.[a] Como a cidade não lhe abriu as portas,[b] ele rasgou o ventre de todas as mulheres grávidas da cidade.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão «desde Tirza» pode indicar o ponto de partida do ataque de Menaém ou estar ligada à extensão do território de Tifsa.
    reason: syntactic_ambiguity
  - marker: b
    text: O hebraico diz literalmente «não abriu». No contexto, isso se refere a não abrir a cidade — isto é, não admitir Menaém nem render-se a ele.
    reason: cultural_note
  - marker: c
    text: O verbo hebraico também pode ser traduzido por «fendeu» ou «abriu violentamente».
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Marca de modo natural a sequência dos acontecimentos na narrativa.
- source_word: יַכֶּה / וַיַּךְ
  choice: atacou
  rationale: Neste contexto militar, נכה indica golpear ou atacar. “Atacou” comunica com clareza a ação contra a cidade e permite conservar a repetição verbal do hebraico.
- source_word: תִּפְסַח
  choice: Tifsa
  rationale: Transliteração portuguesa do nome geográfico preservado no texto massorético, sem adotar conjecturas sobre outra localidade.
- source_word: כָּל אֲשֶׁר בָּהּ
  choice: tudo o que nela havia
  rationale: Mantém a amplitude do hebraico, que pode abranger tanto habitantes como outros elementos da cidade, sem restringi-lo apenas às pessoas.
- source_word: גְּבוּלֶיהָ
  choice: todo o seu território
  rationale: גְּבוּל pode designar fronteira ou extensão territorial; aqui, “território” é mais natural para a região vinculada à cidade.
- source_word: מִתִּרְצָה
  choice: desde Tirza
  rationale: Reproduz de maneira concisa a preposição מן e evita definir de modo excessivo se Tirza é o ponto de partida do ataque ou o limite territorial mencionado.
- source_word: כִּי לֹא פָתַח
  choice: Como a cidade não lhe abriu as portas
  rationale: No contexto de uma cidade sitiada, “abrir” significa permitir a entrada, normalmente como ato de rendição. “As portas” torna explícita a expressão idiomática, e “a cidade” representa o sujeito singular implícito.
- source_word: הֶהָרוֹתֶיהָ
  choice: todas as mulheres grávidas que nela havia
  rationale: Expressa diretamente o substantivo derivado de הרה e esclarece a ligação do sufixo com a cidade.
- source_word: בִּקֵּעַ
  choice: rasgou o ventre
  rationale: בקע no piel descreve uma abertura violenta. O objeto são mulheres grávidas; “rasgou o ventre” transmite em português corrente e inequívoco a atrocidade descrita, sem suavizá-la.
