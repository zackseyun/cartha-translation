translation_notes:
  register: Português moderno, claro e digno, com nomes próprios adaptados à forma portuguesa. A brutalidade do relato é apresentada diretamente, sem eufemismo nem intensificação além do hebraico. A repetição de “atacou” reflete a repetição de נכה no texto-fonte.
