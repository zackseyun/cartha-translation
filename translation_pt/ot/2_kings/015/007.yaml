  yaml_path: translation/ot/2_kings/015/007.yaml
  text: And Azariah slept with his fathers[a], and they buried him with his fathers in the city of David. And Jotham his son reigned in his place.
translation:
  language: pt
  text: Azarias descansou com seus pais[a], e o sepultaram com seus pais na Cidade de Davi. E Jotão, seu filho, reinou em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com seus antepassados”. A expressão hebraica “descansou com seus pais” é uma forma convencional de se referir à morte; no contexto, o versículo menciona também seu sepultamento entre as gerações anteriores.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: descansou
  rationale: No contexto da fórmula régia de morte, preserva o eufemismo hebraico de modo natural em português, sem reduzi-lo simplesmente a “morreu”.
- source_word: עִם אֲבֹתָיו
  choice: com seus pais
  rationale: Mantém a forma tradicional e a nuance intergeracional da expressão hebraica; a nota esclarece o sentido mais amplo de “antepassados”.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: o sepultaram
  rationale: Preserva o verbo ativo no plural e o sujeito não especificado do hebraico.
- source_word: בְּעִיר דָּוִד
  choice: na Cidade de Davi
  rationale: Emprega a forma consagrada e clara do nome do lugar em português.
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: Expressa de modo conciso o exercício da realeza na fórmula de sucessão.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: Comunica diretamente a sucessão no ofício real, sem sugerir oposição.
