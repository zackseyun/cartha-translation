  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם הֵחֵ֣ל יְהוָ֔ה לְ/קַצּ֖וֹת בְּ/יִשְׂרָאֵ֑ל וַ/יַּכֵּ֥/ם חֲזָאֵ֖ל בְּ/כָל גְּב֥וּל יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/032.yaml
  text: In those days Yahweh began to cut off parts of Israel[b][a], and Hazael struck them down throughout all the territory of Israel.
translation:
  language: pt
  text: Naqueles dias, Yahweh começou a reduzir Israel[a], e Hazael os derrotou em todo o território de Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “começou a cortar partes de Israel”. O verbo hebraico indica o início da redução de Israel, provavelmente por meio de perdas territoriais.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ao longo de toda a fronteira de Israel”. O termo hebraico pode significar “fronteira”, “limites” ou “território”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: Naqueles dias
  rationale: Preserva de modo natural a expressão temporal hebraica no plural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הֵחֵל
  choice: começou
  rationale: Expressa diretamente o início da ação indicado pela forma verbal hebraica.
- source_word: לְקַצּוֹת בְּיִשְׂרָאֵל
  choice: a reduzir Israel
  rationale: Comunica a diminuição progressiva de Israel, provavelmente mediante perdas territoriais, sem sugerir sua destruição total; a nota preserva a metáfora alternativa de cortar partes.
- source_word: וַיַּכֵּם
  choice: os derrotou
  rationale: No contexto militar, נכה pode indicar golpear ou derrotar; o pronome retoma os israelitas.
- source_word: חֲזָאֵל
  choice: Hazael
  rationale: Transliteração portuguesa convencional do nome próprio.
- source_word: בְּכָל גְּבוּל יִשְׂרָאֵל
  choice: em todo o território de Israel
  rationale: גְּבוּל pode designar fronteira, limites ou território; o contexto descreve a extensão geográfica dos ataques.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto apresenta diretamente o Tetragrama; a transliteração preserva o nome pessoal, sem substituí-lo por um título.
- issue: Agência divina na redução de Israel
  choice: Yahweh começou a reduzir Israel
  alternative: Israel começou a perder território
  rationale: Mantém Yahweh como sujeito gramatical e agente da ação, preservando a tensão teológica explícita no hebraico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação mantém a concisão do hebraico e evita explicar no corpo do versículo que a redução ocorreu por perdas territoriais, deixando essa inferência para a nota.
