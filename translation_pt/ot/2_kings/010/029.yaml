  text: רַ֠ק חֲטָאֵ֞י יָרָבְעָ֤ם בֶּן נְבָט֙ אֲשֶׁ֣ר הֶחֱטִ֣יא אֶת יִשְׂרָאֵ֔ל לֹֽא סָ֥ר יֵה֖וּא מֵ/אַֽחֲרֵי/הֶ֑ם עֶגְלֵי֙ הַ/זָּהָ֔ב אֲשֶׁ֥ר בֵּֽית אֵ֖ל וַ/אֲשֶׁ֥ר בְּ/דָֽן־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/029.yaml
  text: Only[a], Jehu did not turn away from the sins of Jeroboam son of Nebat, by which he caused Israel to sin—the golden calves that were at Bethel and at Dan.
translation:
  language: pt
  text: Contudo, Jeú não se afastou dos pecados de Jeroboão, filho de Nebate, que levou Israel a pecar — os bezerros de ouro que estavam em Betel e em Dã.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Contudo
  rationale: Neste contexto, a partícula introduz uma ressalva à atuação anteriormente descrita de Jeú; “Contudo” comunica de modo natural sua força restritiva e adversativa.
- source_word: חֲטָאֵי
  choice: pecados
  rationale: Tradução direta do plural, que designa as práticas cultuais associadas a Jeroboão.
- source_word: הֶחֱטִיא
  choice: levou ... a pecar
  rationale: Expressa com clareza e naturalidade a força causativa do hifil de חטא, sem enfraquecer a responsabilidade atribuída a Jeroboão.
- source_word: לֹא סָר ... מֵאַחֲרֵיהֶם
  choice: não se afastou dos
  rationale: Reproduz em português corrente o sentido do idioma hebraico de não abandonar ou deixar de seguir determinada prática.
- source_word: עֶגְלֵי הַזָּהָב
  choice: os bezerros de ouro
  rationale: Mantém o referente cultual concreto e funciona como explicação apositiva dos pecados mencionados.
- source_word: בֵּית אֵל
  choice: Betel
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: דָּן
  choice: Dã
  rationale: Forma tradicional do topônimo em português bíblico.
theological_decisions:
- issue: Relação entre “os pecados de Jeroboão” e “os bezerros de ouro”
  choice: O travessão apresenta “os bezerros de ouro” como especificação apositiva dos pecados que Jeú não abandonou.
  alternative: Entender a expressão como esclarecimento retomado depois de uma quebra sintática.
  rationale: A construção hebraica passa do pecado em termos gerais aos objetos cultuais concretos; a aposição preserva essa relação sem acrescentar interpretação doutrinária.
- issue: Referente de אֲשֶׁר הֶחֱטִיא
  choice: “que levou Israel a pecar” retoma Jeroboão.
  alternative: Relacionar a oração aos “pecados”, vertendo “pelos quais Israel foi levado a pecar”.
  rationale: O verbo causativo no singular e a fórmula recorrente em Reis favorecem Jeroboão como sujeito, preservando a atribuição pessoal expressa no hebraico.
translation_notes:
  register: Português moderno, claro e digno, com formas onomásticas familiares ao público brasileiro e compreensíveis internacionalmente. A sintaxe conserva a ressalva inicial, a causalidade atribuída a Jeroboão e a aposição final do hebraico.
