    issue: “Leal ao meu” interpreta e reformula a pergunta sobre o coração.
    rationale: O hebraico pergunta se o coração de Jonadabe é “reto/upright” e mantém a metáfora do coração em ambos os membros. Lealdade ou alinhamento é uma explicação contextual válida em nota, mas não deve substituir no texto a qualificação de retidão nem a construção mais aberta do original.
  - severity: low
    issue: “É, sim!” reduz a duplicação enfática.
    rationale: יֵשׁ וָיֵשׁ repete a afirmação. “É, é” conserva a repetição sem sacrificar a inteligibilidade.
  - severity: low
    issue: “Carro” pode sugerir um automóvel ao leitor atual.
    rationale: “Carruagem” é claro em português moderno e se ajusta ao veículo antigo indicado por מֶרְכָּבָה, sem acrescentar pormenores não expressos.
