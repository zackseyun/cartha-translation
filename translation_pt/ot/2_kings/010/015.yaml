  text: וַ/יֵּ֣לֶךְ מִ/שָּׁ֡ם וַ/יִּמְצָ֣א אֶת יְהוֹנָדָב֩ בֶּן רֵכָ֨ב לִ/קְרָאת֜/וֹ וַֽ/יְבָרְכֵ֗/הוּ וַ/יֹּ֨אמֶר אֵלָ֜י/ו הֲ/יֵ֧שׁ אֶת לְבָבְ/ךָ֣ יָשָׁ֗ר כַּ/אֲשֶׁ֤ר לְבָבִ/י֙ עִם לְבָבֶ֔/ךָ וַ/יֹּ֨אמֶר יְהוֹנָדָ֥ב יֵ֛שׁ וָ/יֵ֖שׁ תְּנָ֣/ה אֶת יָדֶ֑/ךָ וַ/יִּתֵּ֣ן יָד֔/וֹ וַ/יַּעֲלֵ֥/הוּ אֵלָ֖י/ו אֶל הַ/מֶּרְכָּבָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/015.yaml
  text: He went on from there and found Jehonadab the son of Rechab coming to meet him. He greeted him and said to him, “Is your heart upright, as my heart is with your heart?” Jehonadab said, “It is, it is.” Jehu said, “Give me your hand.” So he gave him his hand, and Jehu took him up to himself into the chariot.
translation:
  language: pt
  text: 'Ele partiu dali e encontrou Jonadabe, filho de Recabe, que vinha ao seu encontro. Jeú o saudou[a] e lhe perguntou: “Seu coração é reto, assim como o meu coração está com o seu?”[b] Jonadabe respondeu: “É, é.”[c] Jeú disse: “Então, dê-me a mão.” Ele lhe deu a mão, e Jeú o fez subir consigo para a carruagem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o abençoou”. O verbo hebraico pode significar “abençoar”, mas neste contexto provavelmente se refere a uma saudação.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “Seu coração é reto, assim como o meu coração está com o seu?” A expressão pode indicar lealdade mútua ou concordância de propósito.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “É, e é”, uma afirmação enfática.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: Ele partiu dali
  rationale: Expressa naturalmente o avanço da narrativa e a saída do lugar anterior.
- source_word: וַיִּמְצָא אֶת יְהוֹנָדָב בֶּן־רֵכָב
  choice: encontrou Jonadabe, filho de Recabe
  rationale: Preserva o sentido básico de מצא e usa formas portuguesas tradicionais e reconhecíveis dos nomes.
- source_word: לִקְרָאתוֹ
  choice: que vinha ao seu encontro
  rationale: Torna explícito o movimento de Jonadabe em direção a Jeú, conforme a construção hebraica.
- source_word: וַיְבָרְכֵהוּ
  choice: o saudou
  rationale: Embora ברך possa significar 'abençoar', neste contexto de encontro designa provavelmente uma saudação; a alternativa literal é registrada em nota.
- source_word: הֲיֵשׁ אֶת־לְבָבְךָ יָשָׁר כַּאֲשֶׁר לְבָבִי עִם־לְבָבֶךָ
  choice: O seu coração é leal ao meu, assim como o meu é ao seu?
  rationale: Comunica em português corrente a reciprocidade de disposição, lealdade ou propósito expressa pela metáfora hebraica dos corações, sem reduzi-la apenas à retidão moral.
- source_word: יֵשׁ וָיֵשׁ
  choice: É, sim!
  rationale: Reproduz de modo idiomático a afirmação enfática formada pela repetição hebraica.
- source_word: תְּנָה אֶת־יָדֶךָ
  choice: dê-me a mão
  rationale: Equivalente português natural do pedido para estender a mão, possivelmente como sinal de acordo e também para ajudá-lo a subir.
- source_word: וַיַּעֲלֵהוּ אֵלָיו אֶל־הַמֶּרְכָּבָה
  choice: Jeú o fez subir consigo para o carro
  rationale: Preserva o causativo de עלה, a ideia de movimento para cima e o valor de אֵלָיו, identificando Jeú para evitar ambiguidade pronominal em português.
theological_decisions:
- issue: Sentido de 'coração reto' no pedido de Jeú
  choice: lealdade recíproca, preservando a metáfora do coração
  alternative: retidão moral genérica
  rationale: O contexto imediato é uma prova de alinhamento entre Jeú e Jonadabe. 'Leal' comunica esse valor relacional sem negar possíveis conotações de integridade.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A formulação evita literalismo obscuro no diálogo, mas conserva em nota a estrutura hebraica e sua ambiguidade relacional. 'Carro' é usado no sentido contextual de carro de guerra.
