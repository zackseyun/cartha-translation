base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/005.yaml
  text: So the one who was over the palace[a], and the one who was over the city, along with the elders and the guardians, sent to Jehu, saying, “We are your servants, and all that you say to us we will do. We will not make any man king. Do what is good in your eyes.”
translation:
  language: pt
  text: 'Então o responsável pelo palácio, o responsável pela cidade, os anciãos e os tutores[a] mandaram dizer a Jeú: “Somos seus servos e faremos tudo o que você nos disser. Não faremos ninguém rei. Faça o que parecer bom aos seus olhos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os criadores” ou “os encarregados de cuidar deles”. O termo hebraico se refere aos homens a quem havia sido confiado o cuidado dos filhos reais.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: o responsável pelo palácio
  rationale: Expressa naturalmente a função administrativa sobre a casa real, sem transformar a descrição hebraica em um título oficial mais específico.
- source_word: וַאֲשֶׁר עַל הָעִיר
  choice: o responsável pela cidade
  rationale: Preserva o caráter descritivo do cargo no hebraico e evita especificá-lo indevidamente como “governador”.
- source_word: הַזְּקֵנִים
  choice: os anciãos
  rationale: Termo tradicional e claro para os líderes sociopolíticos mencionados no texto.
- source_word: הָאֹמְנִים
  choice: os tutores
  rationale: No contexto, designa os homens encarregados de criar e guardar os filhos da casa real; “tutores” comunica essa responsabilidade sem sugerir parentesco biológico.
- source_word: עֲבָדֶיךָ
  choice: seus servos
  rationale: Aqui é uma autodesignação política de submissão, não uma afirmação específica de escravidão.
- source_word: וְכֹל אֲשֶׁר תֹּאמַר אֵלֵינוּ נַעֲשֶׂה
  choice: faremos tudo o que você nos disser
  rationale: Formulação natural em português que preserva integralmente a promessa de obediência.
- source_word: לֹא נַמְלִיךְ אִישׁ
  choice: Não proclamaremos ninguém rei
  rationale: Reproduz o sentido causativo de fazer alguém reinar ou instituí-lo como rei, em linguagem corrente e digna.
- source_word: הַטּוֹב בְּעֵינֶיךָ
  choice: o que parecer bom aos seus olhos
  rationale: Mantém a imagem característica do idioma hebraico sem comprometer a compreensão moderna.
- source_word: עֲשֵׂה
  choice: Faça
  rationale: Preserva a concisão e a força do imperativo hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas brasileiras naturais. A coordenação direta da lista segue o hebraico; “mandaram dizer” comunica idiomaticamente o envio da mensagem. O tratamento por “você” favorece clareza contemporânea sem acrescentar distinções sociais ausentes do original.
