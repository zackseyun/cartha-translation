    issue: «Não proclamaremos ninguém rei» enfraquece o valor causativo de לֹא נַמְלִיךְ אִישׁ.
    rationale: O verbo hebraico significa instalar, constituir ou fazer reinar. «Proclamar» pode referir-se apenas ao anúncio, ao passo que «fazer alguém rei» conserva a ação de nomeação.
  - severity: medium
    issue: A nota oferece «pais adotivos» como alternativa para הָאֹמְנִים.
    rationale: O termo se refere a cuidadores, criadores ou guardiães dos filhos reais no contexto, mas não afirma adoção. A alternativa introduz uma relação jurídica que o hebraico não exige.
