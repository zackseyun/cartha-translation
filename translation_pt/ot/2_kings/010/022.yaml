  text: וַ/יֹּ֗אמֶר לַֽ/אֲשֶׁר֙ עַל הַ/מֶּלְתָּחָ֔ה הוֹצֵ֣א לְב֔וּשׁ לְ/כֹ֖ל עֹבְדֵ֣י הַ/בָּ֑עַל וַ/יֹּצֵ֥א לָ/הֶ֖ם הַ/מַּלְבּֽוּשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/022.yaml
  text: He said to the one who was over the wardrobe[b][a], “Bring out clothing for all the worshipers of Baal.” So he brought out the clothing for them.
translation:
  language: pt
  text: 'Ele disse ao encarregado do guarda-roupa: “Traga vestes[a] para todos os adoradores de Baal[b]”. Então ele trouxe as vestes para eles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “roupas”, nas duas ocorrências do versículo.
    reason: lexical_alternative
  - marker: b
    text: “Adoradores de Baal” traduz uma expressão que significa mais literalmente “servos de Baal”, isto é, pessoas dedicadas ao serviço de Baal no culto.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלְתָּחָה
  choice: guarda-roupa
  rationale: O substantivo designa um lugar ou setor onde se guardavam vestes. “Guarda-roupa” é claro em português atual e evita as associações eclesiásticas posteriores de termos como “sacristia”.
- source_word: לַאֲשֶׁר עַל הַמֶּלְתָּחָה
  choice: ao encarregado do guarda-roupa
  rationale: A expressão hebraica significa literalmente “àquele que estava sobre o guarda-roupa” e indica o responsável por esse setor; “encarregado” transmite naturalmente essa função administrativa.
- source_word: הוֹצֵא
  choice: Traga
  rationale: O imperativo hifil de יצא manda fazer sair ou retirar as vestes do local onde estavam guardadas. No contexto, “Traga” é uma ordem natural e direta em português.
- source_word: לְבוּשׁ / הַמַּלְבּוּשׁ
  choice: vestes / as vestes
  rationale: Os substantivos hebraicos têm sentido coletivo e designam o que se veste. “Vestes” conserva o tom digno da narrativa e funciona naturalmente para a distribuição de indumentária cultual.
- source_word: עֹבְדֵי הַבָּעַל
  choice: adoradores de Baal
  rationale: Embora עבד possa significar “servir” e o particípio possa ser traduzido por “servos”, no contexto cultual a expressão se refere aos que prestavam serviço religioso a Baal. “Adoradores” torna esse sentido imediatamente claro.
- source_word: וַיֹּצֵא לָהֶם הַמַּלְבּוּשׁ
  choice: Então ele trouxe as vestes para eles
  rationale: A forma narrativa consecutiva indica a execução da ordem. O substantivo singular coletivo é expresso naturalmente pelo plural “as vestes” em português.
theological_decisions:
- issue: Sentido cultual de עֹבְדֵי הַבָּעַל
  choice: adoradores de Baal
  alternative: servos de Baal
  rationale: A tradução escolhida explicita o serviço religioso exigido pelo contexto, enquanto a nota preserva o valor lexical mais literal sem introduzir uma distinção doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Encarregado do guarda-roupa” evita arcaísmo e comunica a função administrativa; “vestes” mantém um registro narrativo ligeiramente formal sem perder a compreensão popular.
