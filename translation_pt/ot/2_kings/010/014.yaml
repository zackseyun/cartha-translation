base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/014.yaml
  text: And he said[a], “Capture them alive.” So they captured them alive and slaughtered them at the pit of Beth-eked, forty-two men[c][b]; he did not leave a man of them.
translation:
  language: pt
  text: 'Então ele disse: “Capturem-nos vivos!” Eles os capturaram vivos e os degolaram junto à cisterna[a] de Bete-Equede[b], quarenta e dois homens ao todo. Ele não deixou homem algum dentre eles.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na cisterna” ou “para dentro da cisterna”. A preposição hebraica permite mais de uma relação espacial neste contexto.
    reason: lexical_alternative
  - marker: b
    text: Bete-Equede é um nome de lugar. Em hebraico, o nome pode estar relacionado a uma “casa de amarração” ou “de reunião”.
    reason: cultural_note
  - marker: c
    text: 'Hebraico: “não deixou homem algum dentre eles”, enfatizando que ninguém sobreviveu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְשׂוּם
  choice: Capturem-nos
  rationale: O verbo תפשׂ significa agarrar, prender ou capturar. “Capturem-nos” expressa com naturalidade a ordem de deter o grupo.
- source_word: חַיִּים
  choice: vivos
  rationale: Nas duas ocorrências, חַיִּים tem valor adverbial e contrasta a captura inicial com a execução posterior.
- source_word: וַיִּשְׁחָטוּם
  choice: os degolaram
  rationale: שׁחט designa o abate por corte e é mais forte e específico que um simples “matar”; “degolaram” preserva a violência concreta do ato.
- source_word: אֶל־בּוֹר
  choice: junto à cisterna
  rationale: בּוֹר pode designar uma cova ou cisterna, e אֶל admite mais de uma relação espacial neste contexto. “Junto à cisterna” oferece uma leitura natural sem afirmar que os corpos foram necessariamente lançados dentro dela.
- source_word: בֵּית עֵקֶד
  choice: Bete-Equede
  rationale: A expressão funciona como topônimo. A forma aportuguesada “Bete-Equede” preserva o nome próprio sem converter sua possível etimologia em tradução do lugar.
- source_word: אַרְבָּעִים וּשְׁנַיִם אִישׁ
  choice: quarenta e dois homens ao todo
  rationale: אִישׁ indica homens, e “ao todo” esclarece naturalmente que o número se refere ao grupo capturado e morto.
- source_word: וְלֹא הִשְׁאִיר אִישׁ מֵהֶם
  choice: Ele não deixou nenhum deles vivo
  rationale: O verbo no singular mantém Jeú como sujeito. A formulação portuguesa comunica a totalidade da matança sem a rigidez de “não deixou homem algum deles”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A repetição “vivos” foi mantida por corresponder à ênfase do hebraico; “degolaram” conserva a força específica do verbo sem suavizar a narrativa.
