  - severity: low
    issue: A formulação da nota de rodapé não reflete com precisão suficiente a forma idiomática hebraica.
    rationale: «Filhos da quarta geração» é uma paráfrase possível, mas a expressão hebraica é literalmente mais próxima de «filhos de quartas [gerações]». A nota pode indicar a literalidade e então explicar o sentido dinástico.
