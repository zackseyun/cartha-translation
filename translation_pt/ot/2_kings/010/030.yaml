source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל יֵה֗וּא יַ֤עַן אֲשֶׁר הֱטִיבֹ֨תָ֙ לַ/עֲשׂ֤וֹת הַ/יָּשָׁר֙ בְּ/עֵינַ֔/י כְּ/כֹל֙ אֲשֶׁ֣ר בִּ/לְבָבִ֔/י עָשִׂ֖יתָ לְ/בֵ֣ית אַחְאָ֑ב בְּנֵ֣י רְבִעִ֔ים יֵשְׁב֥וּ לְ/ךָ֖ עַל כִּסֵּ֥א יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/030.yaml
  text: And Yahweh said to Jehu[a], “Because you have done well in carrying out what is right in my eyes, and have done to the house of Ahab according to all that was in my heart, your sons to the fourth generation shall sit on the throne of Israel.”
translation:
  language: pt
  text: 'E Yahweh disse a Jeú: “Visto que agiste bem, fazendo o que é certo aos meus olhos, e fizeste à casa de Acabe conforme tudo o que estava no meu coração, teus filhos até a quarta geração se assentarão no trono de Israel.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “filhos de quartas [gerações]”, um idioma que indica uma dinastia de quatro gerações.'
    reason: Esclarece o idioma hebraico בְּנֵי רְבִעִים e a extensão da promessa dinástica.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, distinguindo-o de títulos como «Senhor» e preservando seu caráter pactual.
- source_word: יַעַן אֲשֶׁר
  choice: Visto que
  rationale: Expressa naturalmente em português a relação causal que introduz a declaração divina.
- source_word: הֱטִיבֹתָ לַעֲשׂוֹת הַיָּשָׁר בְּעֵינַי
  choice: agiste bem, fazendo o que é certo aos meus olhos
  rationale: Mantém tanto a aprovação explícita da ação de Jeú quanto a fórmula hebraica de avaliação segundo os olhos de Deus.
- source_word: כְּכֹל אֲשֶׁר בִּלְבָבִי
  choice: tudo o que estava no meu coração
  rationale: Preserva a metáfora hebraica do coração como sede da vontade e da intenção, sem reduzi-la apenas à emoção.
- source_word: עָשִׂיתָ לְבֵית אַחְאָב
  choice: fizeste à casa de Acabe
  rationale: Reproduz de modo sóbrio a formulação hebraica, sem explicitar além do texto que se trata da execução do juízo contra a dinastia.
- source_word: בְּנֵי רְבִעִים
  choice: teus filhos, até a quarta geração
  rationale: Comunica o sentido dinástico do idioma hebraico e conserva «filhos», termo mais próximo da forma original.
- source_word: יֵשְׁבוּ לְךָ עַל כִּסֵּא יִשְׂרָאֵל
  choice: se assentarão no trono de Israel
  rationale: Preserva a imagem régia de sentar-se no trono; o valor dinástico de לְךָ já fica expresso por «teus filhos».
theological_decisions:
- issue: Alcance da aprovação divina às ações de Jeú
  choice: Manter a aprovação explícita de sua ação contra a casa de Acabe, limitada pelo próprio enunciado do versículo.
  alternative: Atenuar a aprovação para evitar tensão moral, ou ampliá-la para endossar todo o reinado e caráter de Jeú.
  rationale: O hebraico declara que Jeú agiu bem ao fazer à casa de Acabe o que era certo aos olhos de Yahweh e correspondia à sua intenção. A tradução não deve nem suavizar essa afirmação nem transformá-la em aprovação irrestrita de toda a conduta de Jeú.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Agiste» e «fizeste» preservam solenidade moderada sem arcaísmo excessivo; «se assentarão no trono» mantém a imagem régia do original.
