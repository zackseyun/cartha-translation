  text: Then he arose and went and traveled to Samaria[a]. He was at Beth-eked of the shepherds on the way.
translation:
  language: pt
  text: Então ele se levantou, foi e seguiu para Samaria. No caminho, ele estava em Bete-Equede dos pastores[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bete-Equede pode significar algo como “casa de reunião” ou, segundo algumas interpretações, designar um local ligado à tosquia ou à amarração por pastores. Como o sentido exato é incerto, o texto principal o mantém como nome de lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: Então ele se levantou
  rationale: O qal wayyiqtol de קום dá continuidade à sequência narrativa; “levantou-se” conserva a imagem verbal sem a reduzir simplesmente a “partiu”.
- source_word: וַיָּבֹא
  choice: partiu
  rationale: בוא pode expressar “vir” ou “ir” conforme o ponto de vista. Aqui integra uma sequência de deslocamento rumo a Samaria; “partiu” é natural em português e evita uma repetição pesada.
- source_word: וַיֵּלֶךְ שֹׁמְרוֹן
  choice: seguiu para Samaria
  rationale: הלך seguido do nome do lugar indica movimento em direção a Samaria. “Seguiu para” comunica o destino com fluidez.
- source_word: הוּא בֵּית עֵקֶד הָרֹעִים בַּדָּרֶךְ
  choice: No caminho, chegou a Bete-Equede dos Pastores
  rationale: A construção hebraica é abrupta e situa o personagem em Bete-Equede durante a viagem. Em português, “chegou a” torna inteligível a localização sem acrescentar uma interpretação específica do nome do lugar.
- source_word: בֵּית עֵקֶד
  choice: Bete-Equede
  rationale: A expressão funciona como topônimo. A transliteração preserva o nome próprio e evita decidir no texto principal entre sentidos possíveis de עקד, como reunião, amarração ou tosquia.
- source_word: הָרֹעִים
  choice: dos Pastores
  rationale: רֹעִים significa diretamente “pastores” ou “guardadores de rebanhos”. “Pastores” é a opção mais simples e reconhecível; a inicial maiúscula integra a expressão ao topônimo.
- source_word: בַּדָּרֶךְ
  choice: No caminho
  rationale: A expressão situa Bete-Equede na rota para Samaria. “No caminho” é idiomático e mantém a relação locativa.
