  text: וַ/יָּבֹא֙ שֹֽׁמְר֔וֹן וַ֠/יַּךְ אֶת כָּל הַ/נִּשְׁאָרִ֧ים לְ/אַחְאָ֛ב בְּ/שֹׁמְר֖וֹן עַד הִשְׁמִיד֑/וֹ כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֥ר דִּבֶּ֖ר אֶל אֵלִיָּֽהוּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/017.yaml
  text: When he came to Samaria[a], he struck down all who remained of Ahab in Samaria, until he had destroyed them, according to the word of Yahweh that he had spoken to Elijah.
translation:
  language: pt
  text: Quando chegou a Samaria, ele matou todos os que ainda restavam de Acabe em Samaria, até exterminá-los[a], conforme a palavra que Yahweh havia falado a Elias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “até exterminá-lo”. O sufixo singular pode se referir coletivamente a Acabe ou à casa de Acabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא שֹׁמְרוֹן
  choice: Quando chegou a Samaria
  rationale: A forma narrativa com waw consecutivo faz a ação avançar e estabelece a circunstância temporal da ação seguinte; esta formulação é natural em português.
- source_word: וַיַּךְ
  choice: ele matou
  rationale: Neste contexto, נכה descreve violência letal. “Matou” comunica sem ambiguidade o resultado, ao passo que “feriu” poderia sugerir apenas lesão.
- source_word: כָּל הַנִּשְׁאָרִים לְאַחְאָב
  choice: todos os que ainda restavam de Acabe
  rationale: O particípio designa os que haviam ficado, e a preposição ל marca aqui relação ou pertencimento a Acabe. A formulação mantém essa associação sem restringi-la explicitamente apenas a parentes de sangue.
- source_word: בְּשֹׁמְרוֹן
  choice: em Samaria
  rationale: Mantém a indicação locativa e a repetição presente no hebraico.
- source_word: עַד הִשְׁמִידוֹ
  choice: até exterminá-los[a]
  rationale: שׁמד indica destruição total ou extermínio. O plural torna explícita em português a referência contextual às pessoas restantes, enquanto a nota preserva o sufixo singular do hebraico e sua possível referência coletiva.
- source_word: כִּדְבַר יְהוָה
  choice: conforme a palavra que Yahweh havia falado
  rationale: “Palavra” preserva a fórmula de cumprimento profético, e “Yahweh” representa diretamente o nome divino יְהוָה.
- source_word: אֲשֶׁר דִּבֶּר אֶל אֵלִיָּהוּ
  choice: que Yahweh havia falado a Elias
  rationale: A construção deixa claro em português que Yahweh é quem havia comunicado a palavra anteriormente a Elias.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o Tetragrama. “Yahweh” preserva o nome divino em vez de substituí-lo por um título, sem introduzir uma interpretação denominacional.
- issue: Referente do sufixo singular em הִשְׁמִידוֹ
  choice: Plural contextual no texto, com preservação da forma singular em nota
  alternative: “até exterminá-lo”, entendendo o referente coletivamente como Acabe ou a casa de Acabe
  rationale: O antecedente imediato é plural (“todos os que ainda restavam”), mas o hebraico usa um sufixo singular. A tradução corrente comunica o sentido contextual, e a nota conserva a ambiguidade formal e a possível dimensão coletiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conserva a repetição de “Samaria” do original e evita “feriu”, que em português poderia enfraquecer indevidamente o caráter letal da ação.
