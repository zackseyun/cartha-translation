base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/035.yaml
  text: And Jehu lay down with his fathers, and they buried him in Samaria. And Jehoahaz his son became king in his place.
translation:
  language: pt
  text: Jeú descansou com seus antepassados, e o sepultaram em Samaria. Seu filho Jeoacaz tornou-se rei em seu lugar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: descansou com seus antepassados
  rationale: A expressão hebraica é uma fórmula régia para a morte. Em português, “descansou com seus antepassados” preserva o caráter eufemístico e ancestral da fórmula sem produzir a construção pouco natural “deitou-se com seus pais”, que pode sugerir outro sentido.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: o sepultaram
  rationale: Mantém o verbo ativo na terceira pessoa do plural e deixa os agentes sem identificação, como no hebraico.
- source_word: בְּשֹׁמְרוֹן
  choice: em Samaria
  rationale: A preposição é locativa, e “em Samaria” é a forma natural em português.
- source_word: וַיִּמְלֹךְ
  choice: tornou-se rei
  rationale: Neste aviso de sucessão, o verbo assinala a ascensão ao trono, não apenas o exercício prolongado do reinado.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: Expressa diretamente a substituição de Jeú por seu filho no cargo real.
- source_word: יֵהוּא
  choice: Jeú
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: יְהוֹאָחָז
  choice: Jeoacaz
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
theological_decisions:
- issue: Sentido da fórmula funerária וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: 'Preservar uma expressão figurada de morte: “descansou com seus antepassados”'
  alternative: Traduzir explicitamente por “morreu”
  rationale: A opção conserva a fórmula literária dos resumos régios sem extrair dela uma afirmação específica sobre o estado dos mortos.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Antepassados” evita a ambiguidade moderna de “pais”; a retomada por “Seu filho” reduz a repetição sem perder nenhuma informação do hebraico.
