  text: Now when this letter comes to you[a], since your master's sons are with you, and the chariots and the horses, a fortified city also being with you, and the weapons[c][b],
translation:
  language: pt
  text: E agora, quando esta carta chegar a vocês[a], visto que vocês têm consigo os filhos de seu senhor[b], os carros de guerra, os cavalos, uma cidade fortificada[c] e as armas,
  philosophy: optimal-equivalence
