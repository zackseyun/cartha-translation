lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: Funciona como marcador discursivo que introduz a próxima etapa da mensagem de Jeú; a conjunção inicial pode ser absorvida naturalmente em português.
- source_word: כְּבֹא הַסֵּפֶר הַזֶּה אֲלֵיכֶם
  choice: quando esta carta chegar a vocês
  rationale: A construção com כְּ e o infinitivo de בוא tem sentido temporal. סֵפֶר, no contexto de correspondência régia, designa uma carta ou mensagem escrita.
- source_word: וְאִתְּכֶם
  choice: estão com vocês
  rationale: A oração hebraica não traz verbo expresso; em português, acrescenta-se 'estão' para clareza, preservando a ideia de recursos e pessoas disponíveis aos destinatários.
- source_word: בְּנֵי אֲדֹנֵיכֶם
  choice: os filhos do seu senhor
  rationale: אֲדֹנֵיכֶם refere-se ao soberano a quem os destinatários serviam. 'Senhor' conserva a relação política de autoridade sem transformar o termo em título divino.
- source_word: הָרֶכֶב
  choice: os carros de guerra
  rationale: O substantivo coletivo designa os carros como recurso militar; 'de guerra' torna o sentido claro ao leitor moderno sem ampliar indevidamente o hebraico.
- source_word: וְהַסּוּסִים
  choice: os cavalos
  rationale: Tradução direta do recurso militar mencionado, sem especificá-lo indevidamente como cavalaria.
- source_word: וְעִיר מִבְצָר
  choice: uma cidade fortificada
  rationale: A expressão designa uma cidade defensável ou dotada de fortificações, aqui disponível aos destinatários.
- source_word: וְהַנָּשֶׁק
  choice: as armas
  rationale: נֶשֶׁק refere-se de modo geral ao armamento; 'armas' é corrente e evita restringir o sentido a armadura.
