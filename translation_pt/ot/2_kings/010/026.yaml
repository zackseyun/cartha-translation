base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/026.yaml
  text: Then they brought out the pillars of the house of Baal and burned them[a][b][c].
translation:
  language: pt
  text: Então tiraram as colunas do templo de Baal e as queimaram.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as colunas sagradas” ou “as pedras erguidas”. O termo hebraico designa colunas de pedra associadas ao culto.
    reason: lexical_alternative
  - marker: b
    text: O hebraico traz um sufixo de objeto no singular em “e a queimaram”, embora o substantivo anterior, “colunas”, esteja no plural. O sentido parece ser coletivo; por isso, “as queimaram”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּצִאוּ
  choice: Então tiraram
  rationale: O hifil de יצא significa fazer sair ou retirar. “Então” expressa com naturalidade a progressão narrativa do waw consecutivo.
- source_word: מַצְּבוֹת
  choice: as colunas
  rationale: מַצֵּבָה designa uma pedra erguida ou coluna de culto. “Colunas” é claro e direto; a nota registra alternativas mais explícitas.
- source_word: בֵּית הַבַּעַל
  choice: do templo de Baal
  rationale: Embora בַּיִת signifique literalmente “casa”, em contexto de culto refere-se naturalmente a um templo; esta escolha evita a possível impressão de uma residência comum.
- source_word: וַיִּשְׂרְפוּהָ
  choice: e as queimaram
  rationale: O sufixo de objeto no hebraico é singular feminino, apesar do antecedente plural מַצְּבוֹת. O plural em português comunica o referente aparente sem criar uma incongruência enganosa; a irregularidade do original é preservada em nota.
