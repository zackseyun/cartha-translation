id: 2KI.10.31
reference: 2 Kings 10:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/יֵה֗וּא לֹ֥א שָׁמַ֛ר לָ/לֶ֛כֶת בְּ/תֽוֹרַת יְהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל בְּ/כָל לְבָב֑/וֹ לֹ֣א סָ֗ר מֵ/עַל֙ חַטֹּ֣אות יָֽרָבְעָ֔ם אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/031.yaml
  text: But Jehu was not careful to walk in the law of Yahweh[a], the God of Israel, with all his heart. He did not turn away from the sins of Jeroboam[b], with which he caused Israel to sin.
translation:
  language: pt
  text: Mas Jeú não teve o cuidado de andar na lei de Yahweh[a], o Deus de Israel, de todo o coração. Não se afastou dos pecados de Jeroboão[b], com os quais ele levou Israel a pecar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não se empenhou em andar na lei de Yahweh”. O verbo hebraico pode enfatizar o cuidado em observar.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, os pecados ligados ao sistema de culto idólatra instituído por Jeroboão, conforme a fórmula recorrente em Reis.
    reason: cross_reference
lexical_decisions:
- source_word: שָׁמַר לָלֶכֶת
  choice: teve o cuidado de andar
  rationale: A construção com שׁמר e infinitivo comunica a ideia de cuidar para agir ou observar atentamente; esta formulação preserva tanto essa nuance quanto a metáfora hebraica de andar como modo de viver.
- source_word: תּוֹרַת
  choice: lei
  rationale: No contexto da fidelidade à aliança, תּוֹרָה tem forte sentido normativo; “lei” é claro, corrente e adequado à fórmula do livro de Reis.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: בְּכָל לְבָבוֹ
  choice: de todo o coração
  rationale: Expressão portuguesa natural que comunica devoção interior plena.
- source_word: סָר מֵעַל
  choice: se afastou de
  rationale: Reproduz de modo natural a ideia de abandonar ou desviar-se de uma prática pecaminosa.
- source_word: חַטֹּאות
  choice: pecados
  rationale: Mantém diretamente o plural hebraico e a fórmula recorrente acerca das transgressões cultuais de Jeroboão.
- source_word: הֶחֱטִיא
  choice: levou ... a pecar
  rationale: Expressa com naturalidade o valor causativo do hifil de חטא, sem sugerir coerção absoluta.
- source_word: וְיֵהוּא
  choice: Mas Jeú
  rationale: O contexto contrasta a atuação anterior de Jeú contra Baal com sua falta de obediência integral.
theological_decisions:
- issue: Avaliação da fidelidade de Jeú à aliança
  choice: O versículo retrata Jeú como alguém que não obedeceu a Yahweh de todo o coração, apesar de suas reformas anteriores.
  alternative: Entender a crítica apenas como avaliação de uma reforma política incompleta.
  rationale: As expressões “de todo o coração” e “não se afastou dos pecados de Jeroboão” apresentam uma avaliação moral e religiosa, sem negar nem ampliar o que o contexto diz sobre suas ações anteriores.
- issue: Referente de אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: A oração relativa descreve os pecados de Jeroboão como aquilo por meio do qual ele levou Israel a pecar.
  alternative: 'Traduzir de forma mais genérica: “os pecados que ele fez Israel cometer”.'
  rationale: “Com os quais” preserva a ligação gramatical com “pecados” e a possível nuance instrumental do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva a metáfora bíblica “andar na lei” e usa “Yahweh” para o nome divino.
