  text: וַ/יְהִ֤י בַ/בֹּ֨קֶר֙ וַ/יֵּצֵ֣א וַֽ/יַּעֲמֹ֔ד וַ/יֹּ֨אמֶר֙ אֶל כָּל הָ/עָ֔ם צַדִּקִ֖ים אַתֶּ֑ם הִנֵּ֨ה אֲנִ֜י קָשַׁ֤רְתִּי עַל אֲדֹנִ/י֙ וָ/אֶהְרְגֵ֔/הוּ וּ/מִ֥י הִכָּ֖ה אֶת כָּל אֵֽלֶּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/009.yaml
  text: And it happened in the morning that he went out and stood and said to all the people[a], “You are righteous. Look, I conspired against my master and killed him, but who struck down all these?”
translation:
  language: pt
  text: 'De manhã, Jeú saiu, pôs-se de pé e disse a todo o povo: “Vocês são inocentes[a]. Fui eu que conspirei contra o meu senhor e o matei; mas quem matou todos estes?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Vocês são justos” ou “Vocês estão com a razão”. O termo hebraico pode indicar justiça ou ausência de culpa; neste contexto público e judicial, “inocentes” parece expressar melhor o sentido.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: De manhã
  rationale: Em português, a fórmula narrativa hebraica é expressa naturalmente pela indicação temporal, sem a construção pouco idiomática “e aconteceu pela manhã”.
- source_word: וַיֵּצֵא וַיַּעֲמֹד
  choice: saiu, pôs-se de pé
  rationale: Preserva os dois verbos sequenciais e a postura pública e deliberada sugerida pelo segundo.
- source_word: כָּל הָעָם
  choice: todo o povo
  rationale: Equivalente corrente e digno para a coletividade reunida.
- source_word: צַדִּקִים אַתֶּם
  choice: Vocês são inocentes
  rationale: 'Neste pronunciamento público, o adjetivo tem força forense: Jeú declara o povo livre de culpa quanto às mortes em questão.'
- source_word: הִנֵּה אֲנִי
  choice: Fui eu que
  rationale: A construção clivada transmite em português atual a ênfase de הִנֵּה com o pronome explícito, sem recorrer ao menos natural “Vejam, eu”.
- source_word: קָשַׁרְתִּי עַל
  choice: conspirei contra
  rationale: Expressa com precisão a ação política de tramar contra um superior.
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: Designa aqui o soberano a quem Jeú servia; a minúscula evita associação indevida com um título divino.
- source_word: וָאֶהְרְגֵהוּ
  choice: e o matei
  rationale: Tradução direta e moderna do verbo com sufixo pronominal.
- source_word: וּמִי הִכָּה אֶת כָּל אֵלֶּה
  choice: mas quem matou todos estes?
  rationale: O contexto indica golpe letal; “mas” torna explícito o contraste retórico presente na coordenação, e “estes” mantém aberta a referência demonstrativa do hebraico.
theological_decisions:
- issue: Sentido de צַדִּקִים na declaração de Jeú
  choice: inocentes
  alternative: justos / estão com a razão
  rationale: O contexto é de atribuição pública de responsabilidade, favorecendo inocência jurídica, sem transformar a fala numa avaliação da virtude moral do povo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para o plural explícito e mantém “meu senhor” em minúscula por se referir ao rei. O nome “Jeú”, implícito no sujeito verbal mas claro no contexto, foi explicitado para evitar ambiguidade em português.
