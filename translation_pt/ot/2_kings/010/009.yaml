  source_fidelity: 'A tradução preserva adequadamente a sequência narrativa e o conteúdo do hebraico: a saída e a tomada de posição pública, a declaração de inocência do povo, a admissão da conspiração e da morte do senhor de Jeú, e a pergunta retórica sobre os demais mortos. “Fui eu que” transmite de modo natural a ênfase de הִנֵּה אֲנִי, sem exigir um equivalente formal de “eis”. A explicitação de “Jeú”, recuperável com segurança do contexto imediato, não altera o sentido.'
