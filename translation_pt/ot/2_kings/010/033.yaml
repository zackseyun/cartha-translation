base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/033.yaml
  text: from the Jordan eastward[a], all the land of Gilead—the Gadites, the Reubenites, and the Manassites—from Aroer, which is by the Arnon Valley, even Gilead and Bashan.
translation:
  language: pt
  text: desde o Jordão, para o leste, toda a terra de Gileade, dos gaditas, dos rubenitas e dos manassitas, desde Aroer, que fica junto ao vale do Arnom[a], e Gileade e Basã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “junto ao Arnom”; o termo hebraico נַחַל pode designar um rio ou ribeiro, seu leito, um uádi ou o vale por onde ele corre.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַיַּרְדֵּן מִזְרַח הַשֶּׁמֶשׁ
  choice: desde o Jordão para o leste
  rationale: Expressa o ponto de partida territorial marcado por מִן e o sentido geográfico da expressão literalmente ligada ao nascer do sol, em português atual e claro.
- source_word: אֵת כָּל אֶרֶץ הַגִּלְעָד
  choice: toda a terra de Gileade
  rationale: Mantém a designação regional e a abrangência de כָּל; אֵת liga a expressão ao verbo do versículo anterior.
- source_word: הַגָּדִי וְהָרֻאובֵנִי וְהַמְנַשִּׁי
  choice: os gaditas, os rubenitas e os manassitas
  rationale: Os gentílicos hebraicos no singular têm sentido coletivo; o plural português comunica naturalmente os três grupos tribais.
- source_word: מֵעֲרֹעֵר
  choice: desde Aroer
  rationale: A preposição marca Aroer como ponto limítrofe; conserva-se a forma tradicional do topônimo em português.
- source_word: אֲשֶׁר עַל נַחַל אַרְנֹן
  choice: que fica junto ao vale do Arnom
  rationale: עַל tem aqui valor locativo, enquanto נַחַל pode designar o curso, leito sazonal ou vale; “vale” oferece uma formulação geográfica clara sem ocultar a alternativa lexical.
- source_word: וְהַגִּלְעָד וְהַבָּשָׁן
  choice: e também Gileade e Basã
  rationale: Preserva a força aditiva da conjunção e sinaliza a especificação final da extensão territorial sem transformar explicitamente a frase em uma explicação.
