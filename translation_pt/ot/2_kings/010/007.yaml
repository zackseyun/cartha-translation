base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/007.yaml
  text: And when the letter came to them[a], they took the king’s sons and slaughtered seventy men, and put their heads in baskets and sent them to him at Jezreel.
translation:
  language: pt
  text: Quando a carta chegou a eles, pegaram os filhos do rei e massacraram os setenta homens. Depois puseram as cabeças deles em cestos[a] e as enviaram a ele, em Jezreel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em panelas” ou “em vasilhas”. O termo hebraico designa recipientes, sem indicar com certeza que fossem cestos de material trançado.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסֵּפֶר
  choice: a carta
  rationale: No contexto, trata-se da comunicação escrita enviada por Jeú; “carta” é específico e natural em português.
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: os filhos do rei
  rationale: Preserva o sentido familiar e dinástico direto da expressão hebraica.
- source_word: וַיִּשְׁחֲטוּ
  choice: massacraram
  rationale: Comunica a violência de שׁחט melhor que o termo mais neutro “mataram”, sem acrescentar uma modalidade de execução que o verbo não exige neste contexto.
- source_word: שִׁבְעִים אִישׁ
  choice: os setenta homens
  rationale: Mantém o número e a referência masculina explícita no hebraico, identificando-os com os filhos do rei já mencionados.
- source_word: רָאשֵׁיהֶם
  choice: as cabeças deles
  rationale: Tradução literal exigida pela cena, sem eufemismo.
- source_word: בַּדּוּדִים
  choice: em cestos
  rationale: “Cestos” é uma interpretação contextual plausível para recipientes usados no transporte, mas a amplitude lexical do termo hebraico é registrada em nota.
- source_word: אֵלָיו
  choice: a ele
  rationale: Conserva o pronome hebraico, cujo referente contextual é Jeú, sem inserir o nome no texto.
- source_word: יִזְרְעֶאלָה
  choice: em Jezreel
  rationale: A forma direcional indica que o envio tinha Jezreel como destino; em português, “a ele, em Jezreel” expressa naturalmente que ele se encontrava ali.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. “Massacraram” preserva a brutalidade da ação; a repetição explícita de “cabeças” e o pronome feminino “as” mantêm claro o objeto enviado. O marcador da nota foi colocado junto de “cestos”, o termo ao qual a alternativa lexical se refere.
