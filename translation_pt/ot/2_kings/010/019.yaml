  text: וְ/עַתָּ֣ה כָל נְבִיאֵ֣י הַ/בַּ֡עַל כָּל עֹבְדָ֣י/ו וְ/כָל כֹּהֲנָי/ו֩ קִרְא֨וּ אֵלַ֜/י אִ֣ישׁ אַל יִפָּקֵ֗ד כִּי֩ זֶ֨בַח גָּד֥וֹל לִ/י֙ לַ/בַּ֔עַל כֹּ֥ל אֲשֶׁר יִפָּקֵ֖ד לֹ֣א יִֽחְיֶ֑ה וְ/יֵהוּא֙ עָשָׂ֣ה בְ/עָקְבָּ֔ה לְמַ֥עַן הַאֲבִ֖יד אֶת עֹבְדֵ֥י הַ/בָּֽעַל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/019.yaml
  text: Summon to me all the prophets of Baal[a], all his worshipers, and all his priests; let no man be missing, for I have a great sacrifice for Baal. Whoever is missing shall not live.” But Jehu did it in deceit[b], in order to destroy the worshipers of Baal.
translation:
  language: pt
  text: “Agora, convoquem à minha presença todos os profetas de Baal, todos os seus adoradores e todos os seus sacerdotes. Que nenhum homem falte[a], pois tenho um grande sacrifício para Baal. Quem faltar não ficará vivo.” Jeú, porém, agiu de modo enganoso[b], a fim de destruir os adoradores de Baal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que ninguém falte”. O hebraico diz literalmente “Que nenhum homem falte”, empregando uma forma masculina singular de maneira genérica.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “com astúcia” ou “por meio de um ardil”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: O hebraico contém explicitamente o marcador temporal עַתָּה, precedido da conjunção; “Agora” o representa de modo natural no início da convocação.
- source_word: נְבִיאֵי הַבַּעַל
  choice: os profetas de Baal
  rationale: Reproduz naturalmente a cadeia construta e mantém clara a referência cultual.
- source_word: עֹבְדָיו
  choice: seus adoradores
  rationale: No contexto do culto a Baal, עבד designa os que o servem religiosamente; “adoradores” comunica isso com mais clareza do que “servos”.
- source_word: קִרְאוּ אֵלַי
  choice: convoquem para junto de mim
  rationale: O imperativo plural expressa a convocação de pessoas à presença de Jeú; a formulação é clara e mantém a direção indicada por אֵלַי.
- source_word: אִישׁ אַל יִפָּקֵד
  choice: Que nenhum homem falte
  rationale: O nifal de פקד significa aqui estar ausente ou faltar a uma reunião. A tradução conserva o singular masculino אִישׁ, empregado de forma representativa.
- source_word: זֶבַח גָּדוֹל
  choice: um grande sacrifício
  rationale: É a tradução direta e corrente da expressão sacrificial, sem especificar além do hebraico o tipo de oferta.
- source_word: כֹּל אֲשֶׁר יִפָּקֵד לֹא יִחְיֶה
  choice: Quem faltar não ficará vivo
  rationale: Mantém o mesmo sentido de פקד e preserva a ameaça incisiva de לֹא יִחְיֶה em português natural.
- source_word: בְעָקְבָּה
  choice: de modo enganoso
  rationale: A expressão indica engano, ardil ou fraude. “De modo enganoso” torna explícita a avaliação narrativa sem apresentar a astúcia como qualidade positiva.
- source_word: לְמַעַן הַאֲבִיד
  choice: a fim de destruir
  rationale: Representa diretamente a oração de finalidade e o hifil de אבד, sem suavizar a intenção de Jeú.
theological_decisions:
- issue: Avaliação narrativa da estratégia de Jeú
  choice: Jeú, porém, agiu de modo enganoso
  alternative: Jeú fez isso com astúcia
  rationale: O narrador caracteriza a convocação como um ardil. A tradução conserva essa tensão moral e narrativa, sem justificar nem suavizar a conduta.
- issue: Masculino genérico em אִישׁ
  choice: Que nenhum homem falte
  alternative: Que ninguém falte
  rationale: A redação principal conserva a forma masculina singular do hebraico, enquanto a nota esclarece seu possível valor genérico para evitar uma leitura indevidamente restritiva.
- issue: Força da ameaça לֹא יִחְיֶה
  choice: não ficará vivo
  alternative: morrerá
  rationale: A escolha mantém a formulação negativa e direta do hebraico, sem converter a expressão em uma afirmação mais interpretativa.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A fala de Jeú preserva o tom oficial e ameaçador; o comentário do narrador permanece conciso. O marcador temporal explícito וְעַתָּה foi traduzido por “Agora”.
