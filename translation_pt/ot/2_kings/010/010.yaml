source:
  edition: WLC
  text: דְּע֣וּ אֵפ֗וֹא כִּי֩ לֹ֨א יִפֹּ֜ל מִ/דְּבַ֤ר יְהוָה֙ אַ֔רְצָ/ה אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה עַל בֵּ֣ית אַחְאָ֑ב וַ/יהוָ֣ה עָשָׂ֔ה אֵ֚ת אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד עַבְדּ֥/וֹ אֵלִיָּֽהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/010.yaml
  text: Know[a], then, that not a word of Yahweh that he spoke against the house of Ahab will fall to the ground[b], and Yahweh has done what he spoke by the hand of his servant Elijah.
translation:
  language: pt
  text: Saibam, portanto, que nenhuma palavra de Yahweh que ele proferiu contra a casa de Acabe cairá por terra[a]; e Yahweh fez o que havia dito por meio de seu servo Elias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, não falhará nem deixará de se cumprir.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “pela mão de seu servo Elias”.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּעוּ
  choice: Saibam
  rationale: O imperativo plural de ידע dirige-se aos ouvintes e os chama a reconhecer como certa a declaração que segue.
- source_word: אֵפוֹא
  choice: portanto
  rationale: A partícula discursiva tem força inferencial; “portanto” expressa com naturalidade a conclusão extraída dos acontecimentos.
- source_word: לֹא יִפֹּל ... אַרְצָה
  choice: não cairá por terra
  rationale: Mantém a imagem vívida do idioma hebraico, que aqui significa não falhar nem deixar de se cumprir.
- source_word: מִדְּבַר יְהוָה
  choice: nenhuma palavra de Yahweh
  rationale: O uso partitivo de מִן comunica que nenhum elemento da palavra profética de Yahweh ficará sem cumprimento.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עַל בֵּית אַחְאָב
  choice: contra a casa de Acabe
  rationale: No contexto de juízo, עַל tem sentido adversativo. “Casa” preserva o modo bíblico de designar a família e a dinastia de Acabe.
- source_word: וַיהוָה עָשָׂה
  choice: e Yahweh fez
  rationale: Expressa a ação como realizada e mantém a coordenação explícita do hebraico.
- source_word: אֵת אֲשֶׁר דִּבֶּר
  choice: o que havia dito
  rationale: A forma mais-que-perfeita explicita em português que a declaração profética precedeu seu cumprimento, sem acrescentar conteúdo.
- source_word: בְּיַד עַבְדּוֹ אֵלִיָּהוּ
  choice: pela mão de seu servo Elias
  rationale: Preserva o idioma hebraico de mediação ou agência profética; no contexto, Elias foi o mensageiro por meio de quem Yahweh falou.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino. “Yahweh” preserva essa forma como nome, sem substituí-la por um título.
- issue: Certeza do cumprimento profético
  choice: nenhuma palavra ... cairá por terra
  alternative: nenhuma palavra ... deixará de se cumprir
  rationale: A tradução conserva a metáfora hebraica e sua afirmação enfática de que o juízo anunciado contra a casa de Acabe se cumprirá integralmente.
- issue: Mediação profética de Elias
  choice: pela mão de seu servo Elias
  alternative: por meio de seu servo Elias
  rationale: A formulação mantém a imagem da expressão hebraica sem decidir além do texto como deve ser conceituada a agência do profeta.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Saibam” conserva o endereço plural; “cairá por terra” e “pela mão de” preservam imagens hebraicas, esclarecidas em notas. O ponto e vírgula mantém as duas afirmações estreitamente ligadas sem produzir um período excessivamente pesado.
