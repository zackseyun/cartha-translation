base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/020.yaml
  text: Then Jehu said[a], “Consecrate a solemn assembly for Baal.” So they proclaimed it.
translation:
  language: pt
  text: 'Então Jeú disse: “Consagrem uma assembleia solene para Baal.” E eles a convocaram.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa de modo natural a sequência em português.
- source_word: יֵהוּא
  choice: Jeú
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: קַדְּשׁוּ
  choice: Consagrem
  rationale: O imperativo plural de קדשׁ indica separar formalmente a reunião para finalidade cultual; “consagrem” preserva esse sentido ritual com linguagem clara.
- source_word: עֲצָרָה
  choice: uma assembleia solene
  rationale: O substantivo designa uma reunião religiosa formal, com caráter solene; esta expressão conserva a nuance cultual sem reduzir o termo a uma reunião genérica.
- source_word: לַבַּעַל
  choice: a Baal
  rationale: A preposição ל indica relação, dedicação ou finalidade. Em português, “assembleia ... a Baal” comunica que a reunião seria dedicada a ele.
- source_word: וַיִּקְרָאוּ
  choice: E eles a convocaram
  rationale: Neste contexto, קרא significa convocar ou anunciar publicamente uma reunião. “Convocaram” é natural e retoma explicitamente “assembleia” pelo pronome “a”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa natural. A terminologia cultual é preservada em “consagrem” e “assembleia solene”. Não se acrescentou nota, pois a alternativa inglesa associa a ambiguidade a וַיֹּאמֶר, mas no hebraico a diferença entre consagrar e anunciar envolve antes a relação entre קַדְּשׁוּ e a proclamação subsequente; a tradução principal representa diretamente os dois verbos.
