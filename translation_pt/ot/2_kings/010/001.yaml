reference: 2 Kings 10:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/לְ/אַחְאָ֛ב שִׁבְעִ֥ים בָּנִ֖ים בְּ/שֹׁמְר֑וֹן וַ/יִּכְתֹּב֩ יֵה֨וּא סְפָרִ֜ים וַ/יִּשְׁלַ֣ח שֹׁמְר֗וֹן אֶל שָׂרֵ֤י יִזְרְעֶאל֙ הַ/זְּקֵנִ֔ים וְ/אֶל הָ/אֹמְנִ֥ים אַחְאָ֖ב לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/001.yaml
  text: Ahab had seventy sons in Samaria[a]. And Jehu wrote letters and sent them to Samaria, to the rulers of Jezreel, the elders, and the guardians of Ahab's sons, saying[b],
translation:
  language: pt
  text: 'Acabe tinha setenta filhos em Samaria. Jeú escreveu cartas e as enviou a Samaria, aos governantes de Jezreel[a], aos anciãos e aos guardiões dos filhos de Acabe[b], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico diz «governantes de Jezreel». Como as cartas foram enviadas a Samaria, alguns entendem que se trata de governantes ligados a Jezreel que residiam ali; algumas versões antigas e alguns intérpretes preferem «governantes de Samaria». O texto principal preserva a forma massorética.
    reason: textual_variant
  - marker: b
    text: Ou «responsáveis pela criação» ou «cuidadores». O termo hebraico designa os encarregados de criar ou supervisionar os filhos de Acabe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאַחְאָב
  choice: Acabe tinha
  rationale: A construção com waw e lamed introduz a circunstância relativa a Acabe e expressa posse. Em português, «Acabe tinha» é natural e não acrescenta um marcador temporal ausente do hebraico.
- source_word: שִׁבְעִים בָּנִים
  choice: setenta filhos
  rationale: בָּנִים significa literalmente «filhos» e, no contexto da sucessão real, convém preservar a referência masculina.
- source_word: בְּשֹׁמְרוֹן
  choice: em Samaria
  rationale: A preposição בְּ indica o lugar onde os filhos de Acabe estavam.
- source_word: וַיִּכְתֹּב ... סְפָרִים
  choice: escreveu cartas
  rationale: סְפָרִים designa aqui comunicações escritas enviadas a destinatários específicos; «cartas» expressa naturalmente o sentido narrativo.
- source_word: וַיִּשְׁלַח שֹׁמְרוֹן
  choice: as enviou a Samaria
  rationale: O pronome «as» retoma naturalmente «cartas», objeto subentendido no hebraico, e שֹׁמְרוֹן indica o destino.
- source_word: אֶל שָׂרֵי יִזְרְעֶאל
  choice: aos governantes de Jezreel
  rationale: שָׂרֵי refere-se a autoridades ou dirigentes. «Governantes» conserva seu caráter de liderança, enquanto «de Jezreel» preserva a leitura massorética apesar da dificuldade contextual.
- source_word: הַזְּקֵנִים
  choice: aos anciãos
  rationale: Neste contexto cívico, זְקֵנִים são líderes reconhecidos da comunidade, não apenas homens idosos.
- source_word: וְאֶל הָאֹמְנִים אַחְאָב
  choice: e aos guardiões dos filhos de Acabe
  rationale: O particípio de אמן refere-se aos encarregados de criar, cuidar ou supervisionar os descendentes reais. A explicitação «dos filhos» torna clara em português a relação que o contexto hebraico deixa implícita.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: A forma introduz o conteúdo das cartas, apresentado no versículo seguinte; os dois-pontos são naturais em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A redação evita um marcador inicial equivalente a «ora/agora», que não está explicitamente presente na fonte, mantém a dificuldade textual «de Jezreel» e posiciona cada nota junto à expressão a que se refere.
