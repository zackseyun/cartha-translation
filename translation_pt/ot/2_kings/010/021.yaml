base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/021.yaml
  text: So Jehu sent throughout all Israel[a], and all the worshipers of Baal came; not a man was left who did not come. They entered the house of Baal, and the house of Baal was filled from end to end.
translation:
  language: pt
  text: Então Jeú mandou anunciar por todo o Israel, e todos os adoradores de Baal vieram. Não ficou um só homem que não tivesse vindo. Eles entraram no templo de Baal, e o templo ficou lotado de uma extremidade à outra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “boca a boca”; expressão que indica que o templo estava completamente cheio.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח יֵהוּא בְּכָל יִשְׂרָאֵל
  choice: Jeú mandou anunciar por todo o Israel
  rationale: O verbo שׁלח significa literalmente “enviar”, mas não explicita o objeto enviado. No contexto, trata-se da convocação anteriormente ordenada; “mandou anunciar” expressa naturalmente em português a ação implícita, enquanto בְּכָל יִשְׂרָאֵל indica alcance por todo o território ou povo.
- source_word: עֹבְדֵי הַבַּעַל
  choice: adoradores de Baal
  rationale: O particípio de עבד pode designar servos, mas, neste contexto cultual, refere-se aos que prestavam culto a Baal. “Adoradores” comunica claramente essa função religiosa.
- source_word: וְלֹא נִשְׁאַר אִישׁ אֲשֶׁר לֹא בָא
  choice: Não ficou um só homem que não tivesse vindo
  rationale: A formulação preserva o singular masculino אִישׁ e a ênfase enfática na presença completa, mantendo também a estrutura negativa do hebraico em português natural.
- source_word: בֵּית הַבַּעַל
  choice: templo de Baal
  rationale: Embora בַּיִת signifique literalmente “casa”, aqui designa inequivocamente o edifício de culto. “Templo de Baal” é a expressão corrente e clara em português.
- source_word: וַיִּמָּלֵא בֵית הַבַּעַל
  choice: o templo ficou lotado
  rationale: O nifal de מלא indica que o edifício ficou cheio. “Ficou lotado” comunica de modo natural que o espaço foi inteiramente ocupado pelos adoradores.
- source_word: פֶּה לָפֶה
  choice: de uma extremidade à outra
  rationale: A expressão significa literalmente “boca a boca”, mas funciona aqui como um idiomatismo espacial que enfatiza o preenchimento completo do recinto. A tradução comunica o sentido sem reproduzir uma imagem obscura em português.
theological_decisions:
- issue: Linguagem masculina representativa em אִישׁ
  choice: um só homem
  alternative: ninguém
  rationale: O hebraico emprega o substantivo masculino singular אִישׁ. A tradução conserva essa forma e a força retórica da declaração sem lhe atribuir implicações doutrinárias além do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Mandou anunciar” torna explícita apenas a ação comunicativa exigida pelo contexto; “templo” evita a possível ambiguidade de “casa de Baal”. O marcador da nota foi colocado junto à expressão que ela explica.
