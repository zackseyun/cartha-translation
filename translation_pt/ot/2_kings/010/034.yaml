  text: וְ/יֶ֨תֶר דִּבְרֵ֥י יֵה֛וּא וְ/כָל אֲשֶׁ֥ר עָשָׂ֖ה וְ/כָל גְּבוּרָת֑/וֹ הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/034.yaml
  text: The rest of the acts of Jehu[a], and all that he did[b], and all his might—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: pt
  text: Os demais atos de Jeú, tudo o que ele fez e todo o seu poder[a] — não estão escritos no Livro das Crônicas dos Reis de Israel[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «e todos os seus feitos poderosos».'
    reason: lexical_alternative
  - marker: b
    text: Trata-se de uma fonte de anais reais, não necessariamente do livro bíblico de Crônicas.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יֵהוּא
  choice: Os demais atos de Jeú
  rationale: Na fórmula de encerramento dos reinados em Reis, דִּבְרֵי designa os atos ou feitos registrados do rei, não apenas suas palavras. A conjunção inicial não exige um marcador temporal como «agora».
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: tudo o que ele fez
  rationale: Reproduz de forma direta a abrangência de כָּל e mantém explícito o sujeito da oração relativa.
- source_word: וְכָל גְּבוּרָתוֹ
  choice: e todo o seu poder
  rationale: גְּבוּרָה pode indicar força, poder, bravura ou feitos poderosos. «Todo o seu poder» conserva a formulação compacta e deixa a alternativa referente a feitos concretos em nota.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: não estão escritos
  rationale: Mantém a pergunta retórica hebraica, que pressupõe resposta afirmativa, em uma construção natural em português.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: no Livro das Crônicas dos Reis de Israel
  rationale: «No Livro» é a expressão portuguesa natural para algo registrado por escrito; o título identifica os anais relativos aos reis de Israel.
