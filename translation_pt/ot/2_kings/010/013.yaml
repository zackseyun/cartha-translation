  text: וְ/יֵה֗וּא מָצָא֙ אֶת אֲחֵי֙ אֲחַזְיָ֣הוּ מֶֽלֶךְ יְהוּדָ֔ה וַ/יֹּ֖אמֶר מִ֣י אַתֶּ֑ם וַ/יֹּאמְר֗וּ אֲחֵ֤י אֲחַזְיָ֨הוּ֙ אֲנַ֔חְנוּ וַ/נֵּ֛רֶד לִ/שְׁל֥וֹם בְּנֵֽי הַ/מֶּ֖לֶךְ וּ/בְנֵ֥י הַ/גְּבִירָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/013.yaml
  text: Jehu found the brothers of Ahaziah king of Judah and said[a], “Who are you?” They said, “We are the brothers of Ahaziah[c][b], and we have come down to ask about the welfare of the sons of the king and the sons of the queen mother.”
translation:
  language: pt
  text: 'Jeú encontrou os irmãos de Acazias[a], rei de Judá, e perguntou: “Quem são vocês?” Eles responderam: “Somos irmãos de Acazias e descemos para saber como estão[b] os filhos do rei e os filhos da rainha-mãe[c]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No relato sobre a família real, “irmãos” também pode designar parentes próximos, e não apenas irmãos em sentido literal.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para ver se estão todos bem”.'
    reason: lexical_alternative
  - marker: c
    text: “Rainha-mãe” traduz o hebraico gebirah, título da mãe do rei na corte.
    reason: cultural_note
lexical_decisions:
- source_word: מָצָא
  choice: encontrou
  rationale: Expressa diretamente o encontro de Jeú com o grupo e soa natural em português narrativo.
- source_word: אֲחֵי אֲחַזְיָהוּ
  choice: os irmãos de Acazias
  rationale: Preserva o termo concreto do hebraico, embora ele possa abranger parentes próximos no contexto de uma família real; essa amplitude é indicada em nota.
- source_word: מֶלֶךְ יְהוּדָה
  choice: rei de Judá
  rationale: Tradução direta e corrente do título real.
- source_word: מִי אַתֶּם
  choice: Quem são vocês?
  rationale: Reproduz de modo simples e natural a pergunta direta no plural.
- source_word: וַנֵּרֶד
  choice: descemos
  rationale: Mantém a ideia geográfica explícita de movimento para baixo, apresentada pelos próprios falantes.
- source_word: לִשְׁלוֹם
  choice: para saber como estão
  rationale: Comunica em português atual o propósito idiomático de inteirar-se do bem-estar de alguém, sem reduzir a expressão a uma simples saudação.
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: os filhos do rei
  rationale: Mantém o sentido masculino e a construção paralela do hebraico.
- source_word: הַגְּבִירָה
  choice: a rainha-mãe
  rationale: No contexto da corte de Judá, o termo designa a mãe do rei em sua posição oficial, e não apenas uma senhora nobre.
- source_word: וּבְנֵי הַגְּבִירָה
  choice: e os filhos da rainha-mãe
  rationale: Preserva a segunda expressão coordenada e distinta conforme formulada no hebraico.
