  text: וַ/יַּשְׁמֵ֥ד יֵה֛וּא אֶת הַ/בַּ֖עַל מִ/יִּשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/028.yaml
  text: So Jehu destroyed Baal from Israel[a][b].
translation:
  language: pt
  text: Assim, Jeú eliminou Baal de Israel.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “destruiu” ou “exterminou”. O verbo hebraico indica causar destruição ou remoção.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o Baal”. Em português, o artigo normalmente é omitido diante do nome dessa divindade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁמֵד
  choice: eliminou
  rationale: O hifil de שׁמד expressa causar destruição ou remoção. “Eliminou” comunica naturalmente a supressão de Baal em Israel sem acrescentar ao objeto a expressão interpretativa “o culto a”.
- source_word: יֵהוּא
  choice: Jeú
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: הַבַּעַל
  choice: Baal
  rationale: Embora o hebraico traga o artigo definido, em português o nome da divindade é normalmente usado sem artigo. Mantém-se “Baal”, em vez da paráfrase interpretativa “o culto a Baal”.
- source_word: מִיִּשְׂרָאֵל
  choice: de Israel
  rationale: A preposição מִן indica separação ou remoção; “de Israel” é a formulação direta e idiomática em português.
- source_word: וַ
  choice: Assim
  rationale: O waw faz a narrativa avançar e, no contexto, introduz o resultado das ações anteriores; “Assim” expressa essa ligação de modo natural.
theological_decisions:
- issue: Referente de “Baal”
  choice: Manter “Baal” como o objeto eliminado de Israel, deixando o contexto indicar a supressão de sua religião.
  alternative: Traduzir como “o culto a Baal” ou “a adoração a Baal”.
  rationale: O hebraico diz literalmente “o Baal” e não explicita “culto” ou “adoração”. A tradução preserva essa concisão e não resolve por paráfrase aquilo que o contexto comunica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Assim” preserva a progressão conclusiva do contexto; “eliminou” evita uma construção pouco idiomática como “destruiu Baal de Israel”.
