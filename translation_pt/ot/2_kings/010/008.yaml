review_pass:
  verdict: revise
  source_fidelity: A tradução transmite corretamente a sequência narrativa, o mensageiro humano, as cabeças dos filhos do rei, a ordem de as dispor em dois grupos e a localização junto à entrada do portão. A formulação temporal «até de manhã», porém, é menos direta para עַד הַבֹּקֶר, que indica duração até a manhã seguinte; «até a manhã» reproduz isso com mais precisão.
  naturalness: O português é claro, moderno e de registro adequado. «Duas pilhas» é mais idiomático e semanticamente específico para objetos empilhados do que «dois montes», que pode sugerir elevações do terreno. A alternativa pode ser mantida em nota.
  terminology: «Mensageiro», «cabeças», «filhos do rei», «portão» e o pronome feminino plural em «ponham-nas» são apropriados. Não há questão teológica ou de nome próprio neste versículo.
