base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/008.yaml
  text: The messenger came and told him[a], saying, “They have brought the heads of the king’s sons.” And he said, “Put them in two heaps at the entrance of the gate until morning.”
translation:
  language: pt
  text: 'O mensageiro veio e lhe contou: “Trouxeram as cabeças dos filhos do rei.” Então ele disse: “Ponham-nas em duas pilhas[a] à entrada do portão, até a manhã.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em dois montes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: o mensageiro
  rationale: Neste contexto narrativo, designa um portador humano de notícias, não um ser celestial.
- source_word: וַיַּגֶּד לוֹ לֵאמֹר
  choice: lhe contou
  rationale: Expressa naturalmente em português o ato de comunicar a notícia; os dois-pontos introduzem a fala e tornam desnecessário reproduzir literalmente o hebraico “dizendo”.
- source_word: הֵבִיאוּ
  choice: Trouxeram
  rationale: O perfeito hebraico apresenta uma ação concluída cujos resultados estão agora diante de Jeú; o pretérito perfeito é a forma portuguesa natural.
- source_word: רָאשֵׁי בְנֵי הַמֶּלֶךְ
  choice: as cabeças dos filhos do rei
  rationale: Mantém o plural explícito e a relação de posse da construção hebraica, sem suavizar a violência do relato.
- source_word: שִׂימוּ אֹתָם
  choice: Ponham-nas
  rationale: Imperativo corrente e claro; o pronome feminino plural retoma “cabeças” em português.
- source_word: שְׁנֵי צִבֻּרִים
  choice: em dois montes
  rationale: צִבֻּרִים indica amontoados ou pilhas; “dois montes” é vívido, natural e semanticamente preciso.
- source_word: פֶּתַח הַשַּׁעַר
  choice: à entrada do portão
  rationale: Identifica de modo conciso a área de acesso do portão da cidade.
- source_word: עַד הַבֹּקֶר
  choice: até de manhã
  rationale: Indica duração até a manhã seguinte em português corrente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa. A fala direta preserva a crueza do texto. “Ele” mantém a referência implícita do hebraico sem inserir explicitamente o nome de Jeú; o contexto identifica o referente.
