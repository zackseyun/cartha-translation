  text: וּ/רְאִיתֶ֞ם הַ/טּ֤וֹב וְ/הַ/יָּשָׁר֙ מִ/בְּנֵ֣י אֲדֹנֵי/כֶ֔ם וְ/שַׂמְתֶּ֖ם עַל כִּסֵּ֣א אָבִ֑י/ו וְ/הִֽלָּחֲמ֖וּ עַל בֵּ֥ית אֲדֹנֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/003.yaml
  text: Then choose the best and most upright of your master's sons[a], set him on his father's throne[b], and fight for your master's house.
translation:
  language: pt
  text: Então escolham o melhor e mais íntegro dentre os filhos do seu senhor[a], coloquem-no no trono de seu pai e lutem pela casa do seu senhor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “procurem o bom e íntegro dentre os filhos do seu senhor”. O verbo hebraico significa literalmente “vejam”, mas aqui envolve avaliar e selecionar.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “casa” se refere à família real ou dinastia, não apenas a um edifício.
    reason: cultural_note
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: escolham
  rationale: Embora o verbo signifique literalmente “vejam”, neste contexto de avaliação de candidatos ele tem valor prático de examinar e escolher.
- source_word: הַטּוֹב וְהַיָּשָׁר
  choice: o melhor e mais íntegro
  rationale: Os adjetivos coordenados apontam para o candidato considerado superior em aptidão e retidão; o contexto de seleção entre vários permite a expressão superlativa em português.
- source_word: מִבְּנֵי אֲדֹנֵיכֶם
  choice: dentre os filhos do seu senhor
  rationale: A preposição indica seleção entre os filhos, e “senhor” designa aqui o soberano humano a quem os destinatários serviam.
- source_word: וְשַׂמְתֶּם עַל כִּסֵּא אָבִיו
  choice: coloquem-no no trono de seu pai
  rationale: A formulação conserva a imagem hebraica e comunica a entronização do sucessor.
- source_word: וְהִלָּחֲמוּ עַל בֵּית אֲדֹנֵיכֶם
  choice: e lutem pela casa do seu senhor
  rationale: “Casa” preserva a imagem dinástica do hebraico e, neste contexto, refere-se à família real ou dinastia, não apenas a um edifício.
theological_decisions:
- issue: Sentido de אֲדֹנֵיכֶם
  choice: seu senhor
  alternative: seu amo
  rationale: O referente é um soberano humano, não o SENHOR. “Senhor” com inicial minúscula preserva o título de autoridade sem sugerir o nome ou título divino.
- issue: Sentido de בֵּית
  choice: casa
  alternative: dinastia
  rationale: A tradução mantém a metáfora hebraica e sua amplitude — família real, linhagem e estrutura dinástica — enquanto uma nota esclarece o sentido contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas verbais no plural dirigidas aos destinatários. A construção conserva as imagens do trono e da casa dinástica, esclarecendo em nota os sentidos menos imediatos.
