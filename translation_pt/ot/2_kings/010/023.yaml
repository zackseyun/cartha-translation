  text: וַ/יָּבֹ֥א יֵה֛וּא וִ/יהוֹנָדָ֥ב בֶּן רֵכָ֖ב בֵּ֣ית הַ/בָּ֑עַל וַ/יֹּ֜אמֶר לְ/עֹבְדֵ֣י הַ/בַּ֗עַל חַפְּשׂ֤וּ וּ/רְאוּ֙ פֶּן יֶשׁ פֹּ֤ה עִמָּ/כֶם֙ מֵ/עַבְדֵ֣י יְהוָ֔ה כִּ֛י אִם עֹבְדֵ֥י הַ/בַּ֖עַל לְ/בַדָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/023.yaml
  text: Then Jehu and Jehonadab son of Rechab entered the house of Baal[a], and he said to the worshipers of Baal, “Search and see that there is no servant of the LORD here among you, but only worshipers of Baal.”
translation:
  language: pt
  text: 'Então Jeú e Jonadabe, filho de Recabe, entraram na casa de Baal[a]. Jeú disse aos servos de Baal: “Procurem e vejam se não há aqui entre vocês nenhum dos servos do SENHOR, mas somente servos de Baal.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “templo de Baal”. Em hebraico, literalmente, “casa de Baal”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: entraram
  rationale: בוא pode significar vir, ir ou entrar; diante do destino expresso, “entraram” comunica naturalmente o movimento para dentro do edifício. O singular hebraico é ajustado ao sujeito composto em português.
- source_word: בֵּית הַבָּעַל
  choice: casa de Baal
  rationale: Preserva a forma concreta do hebraico; no contexto, trata-se do santuário ou templo dedicado a Baal.
- source_word: עֹבְדֵי הַבַּעַל
  choice: adoradores de Baal
  rationale: Embora עבד também possa indicar servos, o contexto cultual favorece “adoradores”, que comunica com clareza a devoção religiosa dos presentes.
- source_word: חַפְּשׂוּ וּרְאוּ
  choice: Procurem e verifiquem
  rationale: Mantém os dois imperativos e exprime tanto a busca ativa quanto a confirmação cuidadosa pretendida.
- source_word: פֶּן יֶשׁ פֹּה עִמָּכֶם
  choice: se não há aqui entre vocês
  rationale: Reproduz de modo idiomático a precaução expressa por פֶּן, sem eliminar a ideia de averiguação.
- source_word: מֵעַבְדֵי יְהוָה
  choice: nenhum servo do SENHOR
  rationale: A construção partitiva plural é expressa naturalmente em português pelo singular indefinido após “nenhum”; “servo” preserva a expressão usual de lealdade a YHWH.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção editorial indicada na camada de consulta mais recente para representar o Tetragrama por SENHOR em versaletes.
- source_word: כִּי אִם ... לְבַדָּם
  choice: mas somente
  rationale: 'Expressa claramente a exclusão enfática: nenhum servo do SENHOR, apenas os que adoram Baal.'
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: SENHOR
  alternative: Yahweh
  rationale: A evidência hebraica contém o nome divino YHWH. “SENHOR” segue a convenção editorial do projeto indicada pela revisão mais recente, enquanto “Yahweh” seria uma transliteração legítima; a escolha não altera o contraste de lealdades no versículo.
- issue: Sentido de עֹבְדֵי em relação a Baal
  choice: adoradores de Baal
  alternative: servos de Baal
  rationale: O substantivo verbal pode sustentar ambas as leituras. O cenário no santuário torna explícito o sentido cultual, mas “servos” permanece uma alternativa formal possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala direta mantém tom incisivo. “Jeú” e “Jonadabe” seguem formas portuguesas correntes; a repetição de “Baal” e o contraste entre seus adoradores e o servo do SENHOR são preservados.
