base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/027.yaml
  text: They tore down the pillar of Baal[a], and they tore down the house of Baal, and made it a latrine to this day.
translation:
  language: pt
  text: Demoliram a coluna sagrada de Baal e demoliram o templo de Baal[a], e fizeram dele uma latrina até hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a casa de Baal”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּצוּ
  choice: demoliram
  rationale: O verbo נתץ indica derrubar ou destruir à força tanto uma estrutura quanto um objeto de culto. “Demoliram” é natural em português e funciona nas duas ocorrências.
- source_word: מַצְּבַת
  choice: a coluna sagrada
  rationale: מַצֵּבָה designa uma pedra erguida ou coluna de função cultual. “Coluna sagrada” torna essa função clara sem perder a imagem concreta.
- source_word: הַבָּעַל
  choice: de Baal
  rationale: Aqui, בַּעַל é o nome ou título da divindade cananeia e deve ser transliterado como “Baal”.
- source_word: בֵּית הַבַּעַל
  choice: o templo de Baal
  rationale: Embora בַּיִת signifique literalmente “casa”, no contexto cultual a expressão se refere ao santuário ou templo de Baal. “Templo” comunica esse sentido com clareza em português; a forma literal é preservada em nota.
- source_word: וַיְשִׂמֻהוּ
  choice: transformando-o em
  rationale: שׂוּם com complemento introduzido por ל expressa fazer de algo outra coisa. A construção portuguesa identifica naturalmente o templo como o local convertido em latrina.
- source_word: למחראות
  choice: em latrina
  rationale: O termo se refere a um lugar destinado a excrementos. “Latrina” é direto, atual e mantém a profanação deliberada expressa no texto.
- source_word: עַד הַיּוֹם
  choice: até hoje
  rationale: Equivalente português corrente da fórmula hebraica que indica a continuidade da situação até o tempo do narrador.
theological_decisions:
- issue: Designação do santuário de Baal
  choice: o templo de Baal
  alternative: a casa de Baal
  rationale: O contexto cultual favorece “templo” como equivalente funcional, mas a nota conserva a expressão hebraica literal e sua possível amplitude.
- issue: Termo da profanação למחראות
  choice: latrina
  alternative: lugar de excrementos
  rationale: “Latrina” comunica sem eufemismo a transformação desonrosa do santuário, sem acrescentar interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A repetição de “demoliram” reproduz a ênfase e a estrutura do hebraico; “como permanece até hoje” explicita naturalmente que a condição resultante continuava no tempo do narrador.
