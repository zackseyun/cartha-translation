source:
  edition: WLC
  text: וַ/יַּ֣ךְ יֵה֗וּא אֵ֣ת כָּל הַ/נִּשְׁאָרִ֤ים לְ/בֵית אַחְאָב֙ בְּ/יִזְרְעֶ֔אל וְ/כָל גְּדֹלָ֖י/ו וּ/מְיֻדָּעָ֣י/ו וְ/כֹהֲנָ֑י/ו עַד בִּלְתִּ֥י הִשְׁאִֽיר ל֖/וֹ שָׂרִֽיד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/011.yaml
  text: So Jehu struck down all who remained of the house of Ahab in Jezreel[a], and all his great men, his close associates, and his priests[c][b], until he left him no survivor.
translation:
  language: pt
  text: Então Jeú matou todos os que restavam da casa de Acabe em Jezreel, bem como todos os seus homens de destaque[a], seus conhecidos[b] e seus sacerdotes, até não lhe deixar nenhum sobrevivente.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus nobres”.
    reason: lexical_alternative
  - marker: b
    text: Ou “seus íntimos” ou “seus associados próximos”.
    reason: lexical_alternative
  - marker: c
    text: O pronome “lhe” pode se referir a Acabe ou à casa de Acabe.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּךְ
  choice: matou
  rationale: Neste contexto narrativo, נכה indica violência letal. “Matou” expressa com clareza o resultado em português atual.
- source_word: הַנִּשְׁאָרִים
  choice: os que restavam
  rationale: Preserva o sentido de pessoas ainda deixadas vivas e se encaixa naturalmente depois de “todos”.
- source_word: לְבֵית אַחְאָב
  choice: da casa de Acabe
  rationale: Identifica a afiliação à dinastia ou casa real de Acabe, mantendo a expressão bíblica corrente e compreensível.
- source_word: בְּיִזְרְעֶאל
  choice: em Jezreel
  rationale: Representa diretamente o valor locativo da preposição no contexto da cidade.
- source_word: גְּדֹלָיו
  choice: seus homens de destaque
  rationale: Refere-se a figuras social ou politicamente proeminentes ligadas a Acabe. A expressão é natural e evita tanto o literalismo obscuro de “seus grandes” quanto a especificidade excessiva de “nobres”.
- source_word: מְיֻדָּעָיו
  choice: seus conhecidos
  rationale: O particípio derivado de ידע designa pessoas conhecidas por ele, possivelmente íntimos ou associados próximos. “Conhecidos” preserva melhor essa amplitude, com alternativas indicadas em nota.
- source_word: כֹהֲנָיו
  choice: seus sacerdotes
  rationale: É o sentido direto do hebraico, sem restringir indevidamente quais funções sacerdotais exerciam.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  choice: até não lhe deixar nenhum sobrevivente
  rationale: Reproduz a ideia de eliminação completa e conserva, por meio de “lhe”, a referência pronominal comprimida e ligeiramente ambígua do hebraico.
theological_decisions:
- issue: Referente do pronome לוֹ na oração final
  choice: Manter o pronome como “lhe”, sem explicitar o referente no texto principal
  alternative: Explicitar “a Acabe” ou “à casa de Acabe”
  rationale: O singular hebraico pode apontar para Acabe ou, coletivamente, para a casa de Acabe. A tradução preserva essa compressão e esclarece as possibilidades em nota, sem resolver silenciosamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. A coordenação “bem como” torna natural a enumeração, enquanto “lhe” conserva a ambiguidade referencial do hebraico.
