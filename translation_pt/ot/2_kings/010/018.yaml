  text: וַ/יִּקְבֹּ֤ץ יֵהוּא֙ אֶת כָּל הָ/עָ֔ם וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם אַחְאָ֕ב עָבַ֥ד אֶת הַ/בַּ֖עַל מְעָ֑ט יֵה֖וּא יַעַבְדֶ֥/נּוּ הַרְבֵּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/018.yaml
  text: Then Jehu gathered all the people and said to them[a], “Ahab served Baal a little[b]; Jehu will serve him much.”
translation:
  language: pt
  text: 'Então Jeú reuniu todo o povo e lhes disse[a]: “Acabe serviu pouco a Baal[b]; Jeú o servirá muito.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'No contexto, a declaração de Jeú é irônica: ele diz que servirá muito a Baal, mas trata-se de um ardil para reunir os adoradores de Baal.'
    reason: cross_reference
  - marker: b
    text: 'Ou: “adorou a Baal”; também adiante: “o adorará”. O verbo hebraico traduzido como “serviu” também é usado para o serviço religioso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: reuniu
  rationale: O verbo קבץ descreve o ato de juntar pessoas. “Reuniu” é natural em português e preserva a ação concreta.
- source_word: כָּל הָעָם
  choice: todo o povo
  rationale: Reproduz de modo direto a abrangência da expressão hebraica, sem restringir o referente.
- source_word: עָבַד אֶת הַבַּעַל
  choice: serviu a Baal
  rationale: עבד, quando tem uma divindade por objeto, pode designar serviço religioso. “Serviu” mantém a forma do hebraico e sua conotação cultual; “adorou” é uma alternativa contextual.
- source_word: מְעָט
  choice: pouco
  rationale: O advérbio indica grau e estabelece o contraste conciso com הַרְבֵּה.
- source_word: יַעַבְדֶנּוּ
  choice: o servirá
  rationale: O sufixo pronominal retoma Baal. A forma verbal expressa aqui a ação futura declarada por Jeú.
- source_word: הַרְבֵּה
  choice: muito
  rationale: Usado adverbialmente, contrasta diretamente com “pouco” e conserva o paralelismo breve do hebraico.
- source_word: יֵהוּא
  choice: Jeú
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אַחְאָב
  choice: Acabe
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: הַבַּעַל
  choice: Baal
  rationale: Embora o hebraico use o artigo, em português Baal é normalmente tratado como nome próprio, sem artigo.
theological_decisions:
- issue: A declaração de Jeú sobre servir a Baal
  choice: Traduzir a fala diretamente, sem indicar no texto principal que se trata de um ardil.
  alternative: Acrescentar que Jeú fingiu ou alegou que serviria a Baal.
  rationale: O contexto narrativo revela a intenção enganosa de Jeú, mas a redação hebraica deste versículo simplesmente registra sua declaração. Inserir a explicação no texto resolveria a ironia que o original deixa ao contexto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção “serviu pouco... servirá muito” conserva o contraste retórico e a concisão do hebraico.
