base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/024.yaml
  text: And they went in to offer sacrifices and burnt offerings. Now Jehu had stationed for himself outside eighty men[a], and he said, “The man who lets any of the men whom I am delivering into your hands escape—his life for that man’s life.”
translation:
  language: pt
  text: 'Eles entraram para oferecer sacrifícios e holocaustos. Jeú havia posto oitenta homens do lado de fora e disse-lhes: “Aquele que deixar escapar qualquer um dos homens que estou entregando nas mãos de vocês pagará com a própria vida pela vida dele.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “a vida dele em lugar da vida dele”; isto é, o guarda que permitisse uma fuga perderia a própria vida em lugar da vida do fugitivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Eles entraram
  rationale: בוא pode significar vir, ir ou entrar conforme o ponto de vista; aqui o contexto indica a entrada para realizar os atos de culto.
- source_word: לַעֲשׂוֹת זְבָחִים וְעֹלוֹת
  choice: para oferecer sacrifícios e holocaustos
  rationale: Com objetos sacrificiais, עשה tem o sentido idiomático de realizar ou oferecer. “Holocaustos” é o termo português tradicional e preciso para עֹלוֹת, ofertas totalmente queimadas.
- source_word: שָׂם לוֹ בַחוּץ שְׁמֹנִים אִישׁ
  choice: havia colocado oitenta homens do lado de fora
  rationale: שׂים significa pôr ou colocar; o contexto mostra homens posicionados como guarda. Evita-se “soldados”, pois o hebraico diz apenas “homens”. O pronome לוֹ indica a providência pessoal de Jeú, já transmitida pelo sujeito e pelo contexto em português.
- source_word: הָאִישׁ אֲשֶׁר יִמָּלֵט מִן הָאֲנָשִׁים
  choice: Se alguém deixar escapar um só dos homens
  rationale: Embora o nifal de מלט expresse “escapar”, a construção no contexto atribui responsabilidade ao guarda. “Um só” comunica naturalmente que a pena vale para qualquer indivíduo do grupo.
- source_word: אֲשֶׁר אֲנִי מֵבִיא עַל יְדֵיכֶם
  choice: que estou entregando nas mãos de vocês
  rationale: A expressão “trazer sobre/às mãos” indica entregar alguém ao poder ou à guarda de outros; a formulação preserva a imagem hebraica e é clara em português.
- source_word: נַפְשׁוֹ תַּחַת נַפְשׁוֹ
  choice: pagará com a própria vida pela vida dele
  rationale: נפש significa aqui “vida”. A formulação distingue a vida do guarda da vida do fugitivo e preserva a relação substitutiva expressa por תַּחַת.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Holocaustos” mantém a terminologia bíblica sacrificial; “vocês” torna explícito o plural hebraico sem regionalismo excessivo. O marcador [a] foi colocado após a cláusula que explica.
