base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/004.yaml
  text: But they were very[a], very afraid, and they said, “Look, the two kings could not stand before him; so how can we stand?”
translation:
  language: pt
  text: 'Mas eles ficaram com muito, muito medo e disseram: “Vejam! Os dois reis não conseguiram resistir a ele. Como, então, nós resistiremos?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּירְאוּ
  choice: ficaram com medo
  rationale: O verbo ירא, na sequência narrativa, descreve a reação de temor. “Ficaram com medo” é natural em português moderno e comunica bem o ingresso nesse estado emocional.
- source_word: מְאֹד מְאֹד
  choice: muito, muito
  rationale: A repetição do advérbio intensifica o medo. Manter os dois termos preserva a ênfase retórica do hebraico.
- source_word: הִנֵּה
  choice: Vejam!
  rationale: הִנֵּה chama a atenção para a constatação seguinte. “Vejam!” conserva essa força dêitica em linguagem atual e, no discurso de um grupo, admite naturalmente o plural.
- source_word: שְׁנֵי הַמְּלָכִים
  choice: os dois reis
  rationale: A expressão definida aponta para os dois reis já conhecidos no contexto.
- source_word: לֹא עָמְדוּ לְפָנָיו
  choice: não conseguiram resistir a ele
  rationale: Embora literalmente expresse “não ficaram de pé diante dele”, עמד לפני tem aqui o sentido contextual de enfrentar ou resistir com êxito. Esta formulação torna o idioma claro sem alterar a incapacidade pressuposta.
- source_word: וְאֵיךְ נַעֲמֹד אֲנָחְנוּ
  choice: Como, então, nós resistiremos?
  rationale: A pergunta tira uma conclusão da derrota dos reis. Repetir “resistir” preserva em português o paralelismo criado pelo mesmo verbo hebraico עמד nas duas orações, enquanto “então” explicita naturalmente a relação inferencial.
