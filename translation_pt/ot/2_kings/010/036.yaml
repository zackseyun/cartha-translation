lexical_decisions:
- source_word: וְהַיָּמִים
  choice: O tempo
  rationale: Embora literalmente signifique “os dias”, a expressão hebraica indica aqui a duração do reinado; “o tempo” comunica o sentido idiomático com naturalidade em português.
- source_word: אֲשֶׁר
  choice: que
  rationale: O pronome relativo liga naturalmente a duração ao reinado de Jeú.
- source_word: מָלַךְ
  choice: reinou
  rationale: É o equivalente português usual para מלך nas fórmulas de resumo régio e preserva o sentido monárquico.
- source_word: יֵהוּא
  choice: Jeú
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: עַל יִשְׂרָאֵל
  choice: sobre Israel
  rationale: Com מלך, a preposição עַל indica o povo ou reino sobre o qual se exerce o reinado.
- source_word: עֶשְׂרִים וּשְׁמֹנֶה שָׁנָה
  choice: vinte e oito anos
  rationale: Tradução direta e idiomática do numeral que expressa a duração do reinado.
- source_word: בְּשֹׁמְרוֹן
  choice: em Samaria
  rationale: Identifica Samaria como o lugar ou sede a partir da qual Jeú reinou; a vírgula evita sugerir que “Israel em Samaria” forme uma única unidade geográfica.
