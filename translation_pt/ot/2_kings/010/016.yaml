base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/016.yaml
  text: Then he said[a], “Come with me and see my zeal for Yahweh.” So they had him ride in his chariot.
translation:
  language: pt
  text: 'Então ele disse: “Venha comigo e veja meu zelo[a] por Yahweh.” Então o fizeram entrar na sua carruagem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meu ciúme”. O substantivo hebraico pode significar tanto zelo como ciúme, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָה אִתִּי
  choice: Venha comigo
  rationale: O imperativo de הלך funciona aqui como convite ou chamado; “Venha comigo” é natural em português e expressa claramente a ideia de acompanhamento.
- source_word: וּרְאֵה
  choice: e veja
  rationale: Mantém a forma imperativa direta de ראה sem acrescentar a nuance interpretativa de “testemunhe”.
- source_word: בְּקִנְאָתִי
  choice: o meu zelo
  rationale: קִנְאָה pode indicar zelo ou ciúme. Neste contexto, “zelo” comunica de modo mais natural a dedicação que Jeú alega ter por Yahweh, enquanto a alternativa lexical é preservada em nota.
- source_word: לַיהוָה
  choice: por Yahweh
  rationale: A preposição ל marca o objeto do zelo, e o nome divino יהוה é transliterado como “Yahweh”.
- source_word: וַיַּרְכִּיבוּ אֹתוֹ
  choice: o fizeram subir
  rationale: O hifil de רכב é causativo. “Fizeram subir” expressa de modo idiomático que ele foi colocado no veículo para viajar.
- source_word: בְּרִכְבּוֹ
  choice: no seu carro
  rationale: רֶכֶב designa aqui o carro de guerra ou veículo. O possessivo hebraico é mantido sem explicitar no texto principal um referente que o verso não nomeia diretamente.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome da aliança e segue a orientação lexical fornecida, sem substituí-lo por um título.
- issue: Nuance de קִנְאָה na declaração de Jeú
  choice: zelo
  alternative: ciúme
  rationale: A ação pública e a alegada devoção de Jeú favorecem “zelo”, mas o termo hebraico também pode significar “ciúme”; essa tensão lexical é mantida em nota, sem validar teologicamente a motivação de Jeú.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A fala direta conserva a concisão do hebraico. “Carro” é usado no sentido antigo de carro de guerra, evidente no contexto narrativo.
