translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Templo de Baal” é preferido a “casa de Baal” porque o contexto é cultual. A nota preserva a incerteza lexical e arquitetônica da frase final.
