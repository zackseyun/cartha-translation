revisions:
- from: 'Quando ele terminou de oferecer o holocausto, Jeú disse aos guardas e aos oficiais: “Entrem e matem todos eles. Que ninguém escape!” Eles os feriram ao fio da espada, e os guardas e os oficiais lançaram os corpos para fora. Depois, avançaram até a cidadela do templo de Baal.[a]'
  to: 'Quando ele terminou de oferecer o holocausto, Jeú disse aos guardas e aos oficiais: “Entrem e golpeiem-nos. Que nenhum homem saia!” Eles os feriram ao fio da espada; os guardas e os oficiais os lançaram fora e foram até a cidadela da casa de Baal.[a]'
  rationale: A revisão conserva o caráter letal do episódio sem substituir o verbo hebraico “golpear” por uma formulação mais específica, restitui a ordem de não sair, evita tornar explícitos “todos” e “os corpos” e aproxima “casa de Baal” da expressão hebraica. A nota continua a preservar a ambiguidade de עיר.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T22:32:56Z'
