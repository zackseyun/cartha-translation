base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/025.yaml
  text: And when he had finished offering the burnt offering[a], Jehu said to the runners and to the officers, “Go in; strike them down. Let no man come out.” So they struck them down with the edge of the sword, and the runners and the officers threw them out and went as far as the inner shrine of the house of Baal.
translation:
  language: pt
  text: 'Quando ele terminou de oferecer o holocausto, Jeú disse aos guardas e aos oficiais: “Entrem e golpeiem-nos. Que nenhum homem saia!” Eles os feriram ao fio da espada; os guardas e os oficiais os lançaram fora e foram até a cidadela da casa de Baal.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “até a cidade da casa de Baal”. A expressão pode referir-se a uma cidadela, a uma área interna fortificada ou a um santuário interior do complexo cultual.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכַלֹּתוֹ לַעֲשׂוֹת הָעֹלָה
  choice: Quando ele terminou de oferecer o holocausto
  rationale: A construção com כְּ e o infinitivo indica a sequência temporal. “Oferecer o holocausto” expressa com naturalidade o uso sacrificial de עָשָׂה com עֹלָה, sem identificar além do texto o referente do pronome “ele”.
- source_word: לָרָצִים
  choice: aos guardas
  rationale: Embora רָצִים signifique literalmente “corredores”, no contexto da corte designa membros da guarda real. “Guardas” comunica a função de forma clara e atual.
- source_word: לַשָּׁלִשִׁים
  choice: aos oficiais
  rationale: שָׁלִישׁ designa um oficial, possivelmente ligado originalmente aos carros de guerra. O termo geral evita impor uma patente específica.
- source_word: בֹּאוּ הַכּוּם
  choice: Entrem e matem todos eles
  rationale: בֹּאוּ ordena a entrada no recinto, e נכה, neste contexto de execução armada, tem sentido letal. “Matem” torna explícito o resultado exigido pela ordem, enquanto “todos eles” reproduz o objeto pronominal plural.
- source_word: אִישׁ אַל יֵצֵא
  choice: Que ninguém escape
  rationale: A expressão negativa distributiva proíbe que qualquer pessoa saia. No contexto, “escape” comunica a intenção da ordem com naturalidade, sem restringir desnecessariamente o português a “homem”.
- source_word: לְפִי חָרֶב
  choice: ao fio da espada
  rationale: Equivalente português consagrado do idioma hebraico, literalmente “à boca da espada”, preservando sua imagem e seu caráter violento.
- source_word: וַיַּשְׁלִכוּ
  choice: lançaram os corpos para fora
  rationale: O verbo significa “lançar, atirar”. O objeto não é repetido no hebraico; o contexto da matança indica os cadáveres. A explicitação evita em português que o pronome pareça referir-se a sobreviventes.
- source_word: עַד עִיר בֵּית הַבָּעַל
  choice: até a cidadela do templo de Baal
  rationale: עִיר normalmente significa “cidade”, mas aqui, dentro do complexo do templo, parece indicar uma área interna delimitada ou fortificada. “Cidadela” mantém essa possibilidade arquitetônica; a dificuldade e as alternativas são registradas em nota.
