  text: וְ/יֶתֶר֩ דִּבְרֵ֨י יְהוֹאָ֜שׁ אֲשֶׁ֤ר עָשָׂה֙ וּ/גְב֣וּרָת֔/וֹ וַ/אֲשֶׁ֣ר נִלְחַ֔ם עִ֖ם אֲמַצְיָ֣הוּ מֶֽלֶךְ יְהוּדָ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/015.yaml
  text: The rest of the acts of Jehoash[a], and all that he did, and his might[b], and how he fought with Amaziah king of Judah—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: pt
  text: Os demais atos de Jeoás, tudo o que ele fez, seu poder e como lutou contra[a] Amazias, rei de Judá, não estão escritos no Livro das Crônicas[b] dos Reis de Israel?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “lutou com”. Neste contexto militar, a expressão indica combate contra Amazias.
    reason: lexical_alternative
  - marker: b
    text: Ou “Livro dos Anais dos Reis de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Os demais atos
  rationale: Na fórmula de encerramento dos reinados em Reis, דִּבְרֵי se refere aos feitos ou acontecimentos ligados ao rei, e não apenas às suas palavras. “Os demais atos” é natural e preserva o sentido historiográfico.
- source_word: יְהוֹאָשׁ
  choice: Jeoás
  rationale: Forma portuguesa tradicional e reconhecível para o nome hebraico pleno יְהוֹאָשׁ neste contexto.
- source_word: אֲשֶׁר עָשָׂה
  choice: tudo o que ele fez
  rationale: Mantém explícita a oração relativa do hebraico, evitando omitir um elemento presente no texto-fonte.
- source_word: וּגְבוּרָתוֹ
  choice: seu poder
  rationale: גְּבוּרָה pode indicar força, poder, valentia ou proezas. “Poder” conserva a amplitude do termo e se ajusta ao contexto régio e militar.
- source_word: וַאֲשֶׁר נִלְחַם עִם
  choice: e como lutou contra
  rationale: Embora עִם signifique literalmente “com”, em contexto de combate introduz o oponente. “Lutou contra” comunica isso claramente em português, enquanto a nota registra a forma literal.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: não estão escritos
  rationale: Preserva a pergunta retórica característica das fórmulas de conclusão em Reis.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: no Livro das Crônicas dos Reis de Israel
  rationale: Tradução clara e consagrada para o título do registro régio, com “Anais” apresentado como alternativa lexical em nota.
