base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/002.yaml
  text: He was twenty-five years old when he became king[a], and he reigned twenty-nine years in Jerusalem. His mother’s name was Jehoaddin, from Jerusalem.
translation:
  language: pt
  text: Tinha vinte e cinco anos quando se tornou rei e reinou vinte e nove anos em Jerusalém. Sua mãe se chamava Jeoadim[a] e era de Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, o nome também é vertido como “Jeoadã”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: Tinha vinte e cinco anos
  rationale: A expressão hebraica é uma fórmula idiomática de idade; esta redação comunica seu sentido de modo natural em português.
- source_word: הָיָה בְמָלְכוֹ
  choice: quando se tornou rei
  rationale: Reproduz com clareza a fórmula de ascensão ao trono, sem o literalismo pouco natural de 'ao reinar dele'.
- source_word: וְעֶשְׂרִים וָתֵשַׁע שָׁנָה מָלַךְ
  choice: reinou vinte e nove anos
  rationale: Mantém diretamente a duração e o exercício da realeza expressos pelo verbo מלך.
- source_word: בִּירוּשָׁלָם
  choice: em Jerusalém
  rationale: Tradução direta da preposição locativa e do nome geográfico.
- source_word: וְשֵׁם אִמּוֹ
  choice: Sua mãe se chamava
  rationale: Equivalente português atual e natural da fórmula hebraica 'o nome de sua mãe era'.
- source_word: יהועדין
  choice: Jeoadim
  rationale: Transliteração adaptada à forma portuguesa do nome conforme a leitura do texto hebraico fornecido; a forma tradicional alternativa é registrada em nota.
- source_word: מִן יְרוּשָׁלָם
  choice: era de Jerusalém
  rationale: Expressa naturalmente em português a procedência ou associação indicada por מן, preservando a referência à origem materna.
