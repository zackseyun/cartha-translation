  text: וְ/יֶתֶר֩ דִּבְרֵ֨י יָרָבְעָ֜ם וְ/כָל אֲשֶׁ֤ר עָשָׂה֙ וּ/גְבוּרָת֣/וֹ אֲשֶׁר נִלְחָ֔ם וַ/אֲשֶׁ֨ר הֵשִׁ֜יב אֶת דַּמֶּ֧שֶׂק וְ/אֶת חֲמָ֛ת לִ/יהוּדָ֖ה בְּ/יִשְׂרָאֵ֑ל הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/028.yaml
  text: The rest of the acts of Jeroboam[a], and all that he did, and his might, how he fought, and how he restored Damascus and Hamath to Judah in Israel—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: pt
  text: Os demais atos de Jeroboão, tudo o que ele fez e o seu poder, como guerreou e como restituiu Damasco e Hamate a Judá em Israel[a], não estão escritos no Livro dos Anais dos Reis de Israel?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a Judá em Israel”. A frase é difícil. Pode referir-se a um território recuperado para Israel que antes pertencera a Judá, ou pode conservar uma designação geopolítica mais antiga. O texto principal mantém a formulação hebraica tanto quanto possível, sem resolver a ambiguidade.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Os demais atos de
  rationale: A expressão é a fórmula de resumo dos reinados em Reis. Embora דִּבְרֵי possa significar literalmente “palavras” ou “assuntos”, “atos” comunica com naturalidade os feitos do rei nesse contexto historiográfico.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: tudo o que ele fez
  rationale: Tradução direta que conserva a abrangência do verbo עשה e explicita o sujeito de modo natural em português.
- source_word: וּגְבוּרָתוֹ
  choice: e o seu poder
  rationale: גְּבוּרָה pode indicar força, valor ou feitos poderosos. “Poder” mantém a expressão compacta, enquanto a oração seguinte esclarece sua dimensão militar.
- source_word: אֲשֶׁר נִלְחָם
  choice: como guerreou
  rationale: A construção explica de que modo se manifestou o poder de Jeroboão. “Guerreou” é conciso e adequado ao contexto militar.
- source_word: וַאֲשֶׁר הֵשִׁיב
  choice: e como restituiu
  rationale: O hifil de שׁוב significa fazer voltar ou restaurar. “Restituiu” preserva o sentido de devolver cidades ou territórios a um domínio político.
- source_word: אֶת דַּמֶּשֶׂק וְאֶת חֲמָת
  choice: Damasco e Hamate
  rationale: Empregam-se as formas portuguesas consagradas dos topônimos.
- source_word: לִיהוּדָה בְּיִשְׂרָאֵל
  choice: a Judá em Israel
  rationale: A frase hebraica é difícil e comprimida. A tradução conserva sua forma e ambiguidade, sem impor uma reconstrução geopolítica específica.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: não estão escritos
  rationale: Mantém a pergunta retórica e a forma passiva da fórmula conclusiva característica de Reis.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: no Livro dos Anais
  rationale: No contexto de uma fonte régia, דִּבְרֵי הַיָּמִים designa registros cronológicos ou anais. “Anais” é claro em português e evita confusão desnecessária com o livro bíblico de Crônicas.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: dos Reis de Israel
  rationale: O לְ indica aqui a relação do documento com os reis de Israel; a construção com “dos” forma um título natural em português.
