source:
  edition: WLC
  text: הַכֵּ֤ה הִכִּ֨יתָ֙ אֶת אֱד֔וֹם וּֽ/נְשָׂאֲ/ךָ֖ לִבֶּ֑/ךָ הִכָּבֵד֙ וְ/שֵׁ֣ב בְּ/בֵיתֶ֔/ךָ וְ/לָ֤/מָּה תִתְגָּרֶה֙ בְּ/רָעָ֔ה וְ/נָ֣פַלְתָּ֔ה אַתָּ֖ה וִ/יהוּדָ֥ה עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/010.yaml
  text: You have indeed struck Edom[a], and your heart has lifted you up. Be honored, and stay at home. Why should you provoke disaster[b], so that you fall—you and Judah with you?
translation:
  language: pt
  text: Você de fato derrotou Edom, e seu coração o encheu de orgulho[a]. Desfrute dessa honra[b] e fique em casa. Por que provocar uma desgraça e acabar caindo — você e Judá com você?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “seu coração o elevou”. A expressão hebraica indica que a vitória o tornou orgulhoso.
    reason: lexical_alternative
  - marker: b
    text: Ou “Receba essa honra”, “Fique com essa glória” ou “Vanglorie-se”. O hebraico provavelmente se refere à honra decorrente da vitória.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּה הִכִּיתָ אֶת־אֱדוֹם
  choice: Você de fato derrotou Edom
  rationale: A construção com infinitivo absoluto intensifica o verbo. “De fato” preserva a ênfase; no contexto militar, “derrotou” comunica naturalmente o sentido de נכה sem reduzir a frase a um golpe físico.
- source_word: וּנְשָׂאֲךָ לִבֶּךָ
  choice: e seu coração o encheu de orgulho
  rationale: A formulação mantém “seu coração” como sujeito e comunica em português corrente o valor idiomático de exaltação e orgulho. A imagem hebraica mais literal é preservada na nota.
- source_word: הִכָּבֵד
  choice: Desfrute dessa honra
  rationale: O imperativo nifal de כבד pode significar receber, conservar ou desfrutar a honra obtida. Esta opção é natural no contexto da advertência e evita decidir pela alternativa mais negativa “vanglorie-se”.
- source_word: וְשֵׁב בְּבֵיתֶךָ
  choice: e fique em casa
  rationale: Expressa de modo direto e atual a ordem para permanecer onde está, em vez de iniciar outro conflito.
- source_word: וְלָמָּה תִתְגָּרֶה בְּרָעָה
  choice: Por que provocar uma desgraça
  rationale: O hitpael de גרה denota envolver-se provocativamente em conflito; רעה aqui indica calamidade ou resultado desastroso, não necessariamente mal moral.
- source_word: וְנָפַלְתָּה אַתָּה וִיהוּדָה עִמָּךְ
  choice: e acabar caindo — você e Judá com você?
  rationale: “Acabar caindo” torna clara a consequência esperada da provocação, enquanto a pausa preserva a ênfase sobre o rei e Judá sofrendo juntos.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala preserva o tom irônico e admonitório do rei de Israel. As notas mantêm visíveis a imagem idiomática de “elevar o coração” e a ambiguidade de הִכָּבֵד.
