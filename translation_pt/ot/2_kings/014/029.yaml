base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/029.yaml
  text: And Jeroboam slept with his fathers[a], with the kings of Israel[b], and Zechariah his son reigned in his place.
translation:
  language: pt
  text: Jeroboão descansou com seus antepassados[a], com os reis de Israel[b], e seu filho Zacarias reinou em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “deitou-se com seus antepassados”; trata-se de uma fórmula hebraica convencional para a morte de um rei.
    reason: lexical_alternative
  - marker: b
    text: Ou “entre os reis de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: descansou
  rationale: No contexto da fórmula régia de morte, “descansou” preserva a imagem eufemística hebraica sem soar tão literalmente como “dormiu” em português moderno.
- source_word: עִם אֲבֹתָיו
  choice: com seus antepassados
  rationale: “Antepassados” comunica naturalmente o sentido abrangente de אָבוֹת neste idioma convencional, evitando que “pais” seja entendido apenas como progenitores imediatos.
- source_word: עִם מַלְכֵי יִשְׂרָאֵל
  choice: com os reis de Israel
  rationale: Mantém a repetição de עִם e a ambiguidade quanto à associação de Jeroboão aos reis de Israel na morte ou sepultura.
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: É a equivalência concisa e habitual em notas de sucessão régia.
- source_word: זְכַרְיָה
  choice: Zacarias
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: בְנוֹ
  choice: seu filho
  rationale: Representa diretamente a relação filial expressa pelo hebraico.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: Expressão portuguesa natural para a sucessão real, correspondente ao sentido locativo-substitutivo do hebraico.
