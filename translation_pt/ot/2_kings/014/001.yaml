base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/001.yaml
  text: In the second year of Joash son of Jehoahaz, king of Israel, Amaziah son of Joash became king of Judah.
translation:
  language: pt
  text: No segundo ano de Joás, filho de Jeoacaz, rei de Israel, Amazias, filho de Joás, tornou-se rei de Judá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁתַּיִם
  choice: No segundo ano
  rationale: A combinação da preposição ב com שְׁנַת estabelece o contexto temporal, e o cardinal שְׁתַּיִם tem valor ordinal idiomático nesta fórmula de datação régia.
- source_word: לְ/יוֹאָשׁ
  choice: de Joás
  rationale: Nesta fórmula régia, ל marca o rei cujo ano de reinado está sendo contado; em português, a construção natural é «ano de Joás».
- source_word: בֶּן יוֹאָחָז
  choice: filho de Jeoacaz
  rationale: Tradução direta do patronímico, com a forma portuguesa tradicional do nome.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: rei de Israel
  rationale: A cadeia construta expressa o título real e o reino governado.
- source_word: מָלַךְ
  choice: tornou-se rei
  rationale: Neste contexto cronológico, o verbo indica a ascensão ao trono. «Tornou-se rei» comunica o início do reinado em linguagem natural e concisa.
- source_word: אֲמַצְיָהוּ
  choice: Amazias
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: בֶן יוֹאָשׁ
  choice: filho de Joás
  rationale: Tradução direta do patronímico que identifica Amazias.
- source_word: מֶלֶךְ יְהוּדָה
  choice: rei de Judá
  rationale: A expressão identifica o reino de Amazias e integra-se naturalmente à oração «tornou-se rei de Judá».
