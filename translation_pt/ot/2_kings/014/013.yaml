  text: וְ/אֵת֩ אֲמַצְיָ֨הוּ מֶֽלֶךְ יְהוּדָ֜ה בֶּן יְהוֹאָ֣שׁ בֶּן אֲחַזְיָ֗הוּ תָּפַ֛שׂ יְהוֹאָ֥שׁ מֶֽלֶךְ יִשְׂרָאֵ֖ל בְּ/בֵ֣ית שָׁ֑מֶשׁ ו/יבאו יְר֣וּשָׁלִַ֔ם וַ/יִּפְרֹץ֩ בְּ/חוֹמַ֨ת יְרוּשָׁלִַ֜ם בְּ/שַׁ֤עַר אֶפְרַ֨יִם֙ עַד שַׁ֣עַר הַ/פִּנָּ֔ה אַרְבַּ֥ע מֵא֖וֹת אַמָּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/013.yaml
  text: And Jehoash king of Israel captured Amaziah king of Judah[a], the son of Jehoash, son of Ahaziah, at Beth-shemesh; then he came to Jerusalem and broke down the wall of Jerusalem from the Ephraim Gate to the Corner Gate, four hundred cubits.
translation:
  language: pt
  text: Jeoás, rei de Israel, capturou Amazias, rei de Judá, filho de Jeoás, filho de Acazias, em Bete-Semes. Depois, ele foi a Jerusalém[a] e abriu uma brecha de quatrocentos côvados na muralha de Jerusalém, desde a Porta de Efraim até a Porta da Esquina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto consonantal hebraico diz “e eles foram a Jerusalém”, mas o contexto e o verbo singular que vem em seguida favorecem o sentido “e ele foi a Jerusalém”, referindo-se a Jeoás.
    reason: textual_variant
lexical_decisions:
- source_word: תָּפַשׂ
  choice: capturou
  rationale: No contexto militar, o verbo indica que Amazias foi agarrado e feito prisioneiro; “capturou” comunica isso com clareza, sem acrescentar detalhes.
- source_word: בְּבֵית שָׁמֶשׁ
  choice: em Bete-Semes
  rationale: A preposição בְּ tem sentido locativo, e “em” é a forma natural em português antes do nome da cidade.
- source_word: ו/יבאו
  choice: Depois, ele foi
  rationale: Embora o texto consonantal tenha a forma plural, o contexto narrativo e o verbo singular seguinte favorecem a referência singular a Jeoás. “Foi” é mais idiomático em português para o deslocamento até Jerusalém.
- source_word: וַיִּפְרֹץ
  choice: abriu uma brecha
  rationale: O verbo descreve romper ou produzir uma abertura. Com “muralha”, “abriu uma brecha” preserva a imagem e expressa naturalmente a ação militar.
- source_word: בְּחוֹמַת יְרוּשָׁלִַם
  choice: na muralha de Jerusalém
  rationale: A preposição hebraica é mantida naturalmente por “na”, em ligação com a expressão “abriu uma brecha”.
- source_word: בְּשַׁעַר אֶפְרַיִם עַד שַׁעַר הַפִּנָּה
  choice: desde a Porta de Efraim até a Porta da Esquina
  rationale: A construção indica os limites do trecho rompido; “desde... até...” exprime claramente essa extensão.
- source_word: הַפִּנָּה
  choice: Esquina
  rationale: O termo integra o nome próprio da porta e designa a esquina ou o ângulo da fortificação.
- source_word: אַרְבַּע מֵאוֹת אַמָּה
  choice: quatrocentos côvados
  rationale: Mantém a antiga unidade de medida do texto hebraico sem impor uma conversão moderna aproximada.
- source_word: בֶּן ... בֶּן ...
  choice: filho de Jeoás, filho de Acazias
  rationale: Conserva a repetição genealógica do hebraico e evita substituir a segunda relação por “neto”, embora esse seja o sentido genealógico em português corrente.
