base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/009.yaml
  text: Then Jehoash king of Israel sent to Amaziah king of Judah[a], saying, “The thornbush that was in Lebanon sent to the cedar that was in Lebanon, saying[b], ‘Give your daughter to my son as a wife.’ And a wild beast that was in Lebanon passed by and trampled the thornbush.”
translation:
  language: pt
  text: 'Então Jeoás, rei de Israel, mandou dizer a Amazias, rei de Judá: “O espinheiro[a] que estava no Líbano mandou dizer ao cedro que estava no Líbano: ‘Dê sua filha ao meu filho por esposa.’ E um animal selvagem[b] que estava no Líbano passou e pisoteou o espinheiro.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cardo” ou “sarça”, para a planta espinhosa mencionada aqui.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “um animal do campo”, isto é, um animal selvagem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... אֶל ... לֵאמֹר
  choice: mandou dizer a
  rationale: A construção hebraica significa literalmente ‘enviou a ... dizendo’; ‘mandou dizer a’ é uma formulação portuguesa natural que preserva o envio de uma mensagem e introduz diretamente seu conteúdo.
- source_word: הַחוֹחַ
  choice: o espinheiro
  rationale: חוֹחַ designa uma planta espinhosa, em contraste deliberado com o cedro. ‘Espinheiro’ mantém a imagem de uma planta baixa e espinhosa sem identificar uma espécie incerta.
- source_word: הָאֶרֶז
  choice: o cedro
  rationale: Equivalente direto de אֶרֶז e essencial para o contraste proverbial entre a insignificância do espinheiro e a imponência do cedro.
- source_word: בַּלְּבָנוֹן
  choice: no Líbano
  rationale: Forma locativa idiomática em português; a repetição foi mantida por seu efeito retórico no hebraico.
- source_word: תְּנָה אֶת־בִּתְּךָ לִבְנִי לְאִשָּׁה
  choice: Dê sua filha ao meu filho por esposa
  rationale: Preserva claramente o imperativo e a linguagem de uma proposta de casamento, em formulação digna e compreensível.
- source_word: חַיַּת הַשָּׂדֶה
  choice: um animal selvagem
  rationale: A expressão literal é ‘animal do campo’, mas no contexto indica um animal não domesticado. ‘Animal selvagem’ comunica o sentido sem especificar uma espécie.
- source_word: וַתַּעֲבֹר
  choice: passou
  rationale: Reproduz de modo conciso o movimento do animal, sem acrescentar que ele passou ‘por ali’ ou ‘ao lado’, elementos não expressos no texto.
- source_word: וַתִּרְמֹס
  choice: pisoteou
  rationale: רמס exprime calcar ou esmagar com os pés; ‘pisoteou’ é vívido e natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de ‘que estava no Líbano’ conserva a cadência retórica do original. ‘Mandou dizer’ evita a rigidez do literal ‘enviou... dizendo’. O segundo encadeamento narrativo foi vertido por ‘Então’, sem introduzir contraste adversativo ausente do hebraico.
