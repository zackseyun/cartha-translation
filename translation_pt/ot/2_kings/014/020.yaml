  yaml_path: translation/ot/2_kings/014/020.yaml
  text: They carried him on horses[b][a], and he was buried in Jerusalem with his fathers in the city of David.
translation:
  language: pt
  text: Levaram-no a cavalo[a], e ele foi sepultado em Jerusalém, com seus antepassados[b], na Cidade de Davi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “sobre os cavalos”. A expressão hebraica pode indicar o transporte do corpo a cavalo ou por meio de um veículo puxado por cavalos.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “com seus pais”. Esta é uma fórmula funerária tradicional e aqui se refere aos antepassados da linhagem real.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׂאוּ אֹתוֹ
  choice: Levaram-no
  rationale: O verbo נשׂא indica carregar ou transportar. “Levaram-no” é natural em português e, no contexto, comunica o transporte do corpo sem explicitar além do hebraico.
- source_word: עַל הַסּוּסִים
  choice: sobre cavalos
  rationale: Preserva de perto a construção hebraica com עַל e mantém aberta a forma exata do transporte, que pode envolver cavalos ou algum veículo por eles conduzido.
- source_word: וַיִּקָּבֵר
  choice: e ele foi sepultado
  rationale: Mantém a voz passiva do nifal e o encadeamento narrativo do hebraico.
- source_word: בִּירוּשָׁלִַם
  choice: em Jerusalém
  rationale: Tradução locativa direta do topônimo.
- source_word: עִם אֲבֹתָיו
  choice: com seus pais
  rationale: Conserva a fórmula funerária tradicional e sua ressonância familiar e dinástica; uma nota esclarece que ela se refere aos antepassados.
- source_word: בְּעִיר דָּוִד
  choice: na Cidade de Davi
  rationale: Forma consagrada e clara do topônimo, que especifica o lugar do sepultamento em Jerusalém.
