base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/005.yaml
  text: And it happened[a], as soon as the kingdom was firmly in his hand[b], that he struck down his servants who had struck down the king his father.
translation:
  language: pt
  text: Assim que o reino se firmou sob seu controle[a], ele matou seus servos que tinham matado o rei, seu pai.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o reino se fortaleceu em sua mão”; a expressão hebraica indica que seu domínio estava firmemente consolidado.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico emprega o mesmo verbo nas duas ações: ele “matou” os que tinham “matado” seu pai.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Assim que
  rationale: A construção introduz o momento da ação seguinte. Em português, “Assim que” comunica com naturalidade a estreita sequência temporal, sem reproduzir de modo pesado a fórmula narrativa “E aconteceu que”.
- source_word: חָזְקָה הַמַּמְלָכָה בְּיָדוֹ
  choice: o reino se firmou em suas mãos
  rationale: O verbo חזק indica aqui que o poder real se tornou seguro. A formulação conserva a imagem hebraica da mão, usando o plural idiomático natural em português.
- source_word: וַיַּךְ
  choice: matou
  rationale: Neste contexto, נכה designa uma ação que resulta em morte. “Matou” é claro e natural, além de permitir repetir o mesmo verbo na descrição do crime anterior.
- source_word: עֲבָדָיו
  choice: os seus servos
  rationale: עבד significa diretamente “servo”; no contexto da corte, pode abranger oficiais ou homens a serviço do rei, sem que o texto especifique melhor a função deles.
- source_word: הַמַּכִּים
  choice: que tinham matado
  rationale: O particípio identifica os servos pelo ato anterior. O mais-que-perfeito composto deixa clara a anterioridade e repete “matou”, refletindo a repetição de נכה no hebraico.
- source_word: אֶת הַמֶּלֶךְ אָבִיו
  choice: o rei, seu pai
  rationale: A aposição concisa preserva tanto o título real quanto a relação familiar.
