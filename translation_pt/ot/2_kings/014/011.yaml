base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/011.yaml
  text: But Amaziah would not listen[a], so Jehoash king of Israel went up, and he and Amaziah king of Judah met face to face at Beth-shemesh[b], which belongs to Judah.
translation:
  language: pt
  text: Mas Amazias não quis dar ouvidos[a]. Então Jeoás, rei de Israel, subiu, e ele e Amazias, rei de Judá, encontraram-se face a face[b] em Bete-Semes, que pertence a Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não deu ouvidos” ou “não atendeu”. O verbo hebraico pode indicar ouvir de modo responsivo, não apenas escutar.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “viram os rostos”; expressão que indica um encontro direto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא שָׁמַע
  choice: Mas Amazias não quis dar ouvidos
  rationale: O waw tem função contrastiva diante da advertência anterior. שׁמע, neste contexto, indica acolher e atender ao que foi dito, e não apenas ouvir sons; a construção com «não quis» comunica naturalmente a recusa deliberada sem transformar a advertência em ordem de um superior.
- source_word: וַיַּעַל
  choice: subiu
  rationale: Mantém o sentido básico de עלה e o modo hebraico de descrever o deslocamento, enquanto o contexto fornece a dimensão militar.
- source_word: וַיִּתְרָאוּ פָנִים
  choice: enfrentaram-se face a face
  rationale: A expressão, literalmente relacionada a ver os rostos, descreve aqui um encontro direto e hostil. «Enfrentaram-se face a face» preserva tanto a confrontação quanto a imagem do original.
- source_word: בֵּית שֶׁמֶשׁ
  choice: Bete-Semes
  rationale: Transliteração portuguesa tradicional e inteligível do topônimo hebraico, em vez de traduzir seu significado literal.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: que pertence a Judá
  rationale: A construção com ל indica pertença territorial ou política, algo mais específico que a simples localização «em Judá».
