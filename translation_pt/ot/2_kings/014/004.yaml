  text: רַ֥ק הַ/בָּמ֖וֹת לֹא סָ֑רוּ ע֥וֹד הָ/עָ֛ם מְזַבְּחִ֥ים וּֽ/מְקַטְּרִ֖ים בַּ/בָּמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/004.yaml
  text: However[a], the high places were not removed[b]; the people still were sacrificing and burning incense on the high places.
translation:
  language: pt
  text: Contudo, os lugares altos[a] não foram eliminados; o povo ainda oferecia sacrifícios e queimava incenso nos lugares altos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “santuários locais”. O termo hebraico designa locais de culto, muitas vezes situados em terreno elevado.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Contudo
  rationale: Introduz uma ressalva à avaliação anterior do rei, comunicando naturalmente a força adversativa do hebraico.
- source_word: הַבָּמוֹת
  choice: os lugares altos
  rationale: Designa locais de culto, muitas vezes situados em elevações. A expressão tradicional preserva o caráter histórico do termo sem acrescentar no texto principal uma avaliação não explicitada neste versículo.
- source_word: לֹא סָרוּ
  choice: não foram eliminados
  rationale: Com “os lugares altos” como sujeito, o verbo indica que esses locais de culto não foram suprimidos ou removidos.
- source_word: עוֹד
  choice: ainda
  rationale: Marca a continuidade da prática do povo apesar da avaliação precedente.
- source_word: הָעָם
  choice: o povo
  rationale: Equivalente direto e natural para o substantivo coletivo hebraico.
- source_word: מְזַבְּחִים
  choice: oferecia sacrifícios
  rationale: O particípio expressa uma prática contínua ou habitual; o imperfeito em português comunica bem esse aspecto.
- source_word: וּמְקַטְּרִים
  choice: e queimava incenso
  rationale: No contexto cultual, o verbo pode referir-se a fazer fumaça sacrificial e, com frequência, a queimar incenso; esta é a formulação mais natural no contexto.
- source_word: בַּבָּמוֹת
  choice: nos lugares altos
  rationale: A preposição tem sentido locativo; “nos” é idiomático em português e mantém a repetição do hebraico.
theological_decisions:
- issue: Avaliação do culto nos lugares altos
  choice: Manter o termo histórico “lugares altos” sem qualificá-los no texto principal.
  alternative: santuários locais; locais de culto não autorizados
  rationale: O versículo relata que esses locais permaneceram e que o povo continuou a prestar culto neles. Embora o contexto mais amplo os desaprove, a tradução não deve inserir essa avaliação diretamente no termo.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O imperfeito verbal preserva o caráter contínuo ou habitual dos particípios hebraicos; a repetição de “lugares altos” acompanha a estrutura do original.
