  text: וַ/יִּקְח֞וּ כָּל עַ֤ם יְהוּדָה֙ אֶת עֲזַרְיָ֔ה וְ/ה֕וּא בֶּן שֵׁ֥שׁ עֶשְׂרֵ֖ה שָׁנָ֑ה וַ/יַּמְלִ֣כוּ אֹת֔/וֹ תַּ֖חַת אָבִ֥י/ו אֲמַצְיָֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/021.yaml
  text: Then all the people of Judah took Azariah—he was sixteen years old—and made him king in place of his father Amaziah[a].
translation:
  language: pt
  text: Então todo o povo de Judá tomou Azarias, que tinha dezesseis anos, e o fez rei no lugar de seu pai, Amazias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Azarias também é chamado de Uzias em outros lugares; aqui, o texto hebraico traz Azarias.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: tomou
  rationale: Mantém o sentido direto de לקח, “tomar”, no contexto em que o povo apresenta Azarias para assumir o reinado, sem acrescentar a ideia interpretativa de eleição.
- source_word: כָּל עַם יְהוּדָה
  choice: todo o povo de Judá
  rationale: Preserva a referência explícita ao conjunto do povo de Judá como agente político da entronização.
- source_word: עֲזַרְיָה
  choice: Azarias
  rationale: Segue a forma do nome presente no texto hebraico deste versículo; a identificação alternativa como Uzias é registrada em nota.
- source_word: וְהוּא בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: que tinha dezesseis anos
  rationale: Expressão natural em português moderno que comunica com clareza a informação parentética sobre a idade.
- source_word: וַיַּמְלִכוּ אֹתוֹ
  choice: o fez rei
  rationale: Traduz o hifil de מלך como ação causativa de instalar alguém como rei, sem introduzir uma cerimônia de coroação ou limitar o ato a uma proclamação.
- source_word: תַּחַת אָבִיו
  choice: no lugar de seu pai
  rationale: Expressa a substituição e sucessão régia indicadas por תחת, com mais precisão do que uma formulação meramente temporal.
- source_word: אֲמַצְיָהוּ
  choice: Amazias
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
