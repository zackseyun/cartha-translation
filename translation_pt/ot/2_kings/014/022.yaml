  text: ה֚וּא בָּנָ֣ה אֶת אֵילַ֔ת וַ/יְשִׁבֶ֖/הָ לִֽ/יהוּדָ֑ה אַחֲרֵ֥י שְׁכַֽב הַ/מֶּ֖לֶךְ עִם אֲבֹתָֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/022.yaml
  text: He rebuilt Elath and restored it to Judah after the king lay down with his fathers.
translation:
  language: pt
  text: Ele reconstruiu Elate e a restituiu a Judá, depois que o rei descansou com seus antepassados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּנָה
  choice: reconstruiu
  rationale: Embora o verbo signifique literalmente “construiu”, o contexto histórico indica a recuperação e reedificação de uma cidade já existente; “reconstruiu” comunica esse sentido naturalmente.
- source_word: וַיְשִׁבֶהָ
  choice: e a restituiu
  rationale: O hifil de שׁוב expressa fazer voltar ou devolver; o pronome feminino retoma Elate.
- source_word: שְׁכַב ... עִם אֲבֹתָיו
  choice: descansou com seus antepassados
  rationale: Preserva de modo digno o eufemismo hebraico para a morte, com linguagem natural em português bíblico contemporâneo.
theological_decisions:
- issue: Identidade do rei na oração temporal
  choice: manter “o rei” sem explicitação
  alternative: identificar o rei pelo nome ou resolver o referente interpretativamente
  rationale: O texto hebraico emprega apenas o substantivo definido הַמֶּלֶךְ; manter essa forma preserva a referência contextual e evita acrescentar uma identificação não expressa no versículo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Elate” segue a forma tradicional portuguesa do topônimo; “antepassados” evita a leitura exclusivamente masculina de “pais” sem perder o sentido da expressão hebraica.
