  yaml_path: translation/ot/2_kings/014/007.yaml
  text: He struck down ten thousand Edomites in the Valley of Salt, captured Sela in battle, and called its name Joktheel, to this day.
translation:
  language: pt
  text: Ele abateu dez mil edomitas no Vale do Sal, capturou Sela[a] em batalha e deu-lhe o nome de Jacteel, nome que permanece até hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sela também pode ser entendida em seu sentido lexical: “a rocha” ou “o penhasco”; aqui, porém, provavelmente é o nome do lugar chamado Sela.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  choice: abateu
  rationale: Em contexto militar, o verbo נכה indica golpear com força, muitas vezes de modo letal. “Abateu” preserva esse sentido marcial sem reduzir a expressão à ideia mais geral de derrota.
- source_word: אֱדוֹם
  choice: edomitas
  rationale: O hebraico traz literalmente “Edom”, mas, com a indicação de dez mil atingidos, refere-se naturalmente ao povo de Edom. “Edomitas” explicita em português o referente humano implícito.
- source_word: בְּגֵיא הַמֶּלַח
  choice: no vale do Sal
  rationale: Tradução direta e natural da expressão geográfica hebraica.
- source_word: עֲשֶׂרֶת אֲלָפִים
  choice: dez mil
  rationale: Equivalente cardinal direto.
- source_word: וְתָפַשׂ
  choice: capturou
  rationale: Em contexto militar, תפשׂ descreve a tomada de um lugar; “capturou” comunica com clareza essa conquista.
- source_word: הַסֶּלַע
  choice: Sela
  rationale: O contexto favorece a identificação como topônimo. O sentido lexical “a rocha” ou “o penhasco” é preservado em nota.
- source_word: בַּמִּלְחָמָה
  choice: em batalha
  rationale: Expressa de modo conciso e idiomático a circunstância militar da captura.
- source_word: וַיִּקְרָא אֶת שְׁמָהּ
  choice: deu-lhe o nome de
  rationale: Reproduz naturalmente em português a fórmula hebraica de atribuição de nome.
- source_word: יָקְתְאֵל
  choice: Jocteel
  rationale: Forma portuguesa tradicional e reconhecível do topônimo hebraico.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: que permanece até hoje
  rationale: A frase esclarece naturalmente que o nome continuava em uso no tempo do narrador, sentido da fórmula temporal hebraica.
