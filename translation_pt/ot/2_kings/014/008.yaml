  text: Then Amaziah sent messengers to Jehoash son of Jehoahaz[a], son of Jehu, king of Israel, saying, “Come[b], let us look one another in the face.”
translation:
  language: pt
  text: 'Então Amazias enviou mensageiros a Jeoás, filho de Jeoacaz, filho de Jeú, rei de Israel, com esta mensagem: “Venha, vamos nos encontrar face a face[a]”.'
  philosophy: optimal-equivalence
  footnotes:
