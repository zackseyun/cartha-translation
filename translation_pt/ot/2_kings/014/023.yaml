base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/023.yaml
  text: In the fifteenth year of Amaziah son of Joash, king of Judah, Jeroboam son of Joash, king of Israel, became king in Samaria, and he reigned forty-one years.
translation:
  language: pt
  text: No décimo quinto ano do reinado de Amazias, filho de Joás, rei de Judá, Jeroboão, filho de Joás, rei de Israel, tornou-se rei em Samaria e reinou durante quarenta e um anos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת חֲמֵשׁ עֶשְׂרֵה שָׁנָה לַ/אֲמַצְיָהוּ
  choice: No décimo quinto ano do reinado de Amazias
  rationale: A fórmula cronológica de reinado usa o cardinal hebraico com valor ordinal. A explicitação de “reinado” torna a referência temporal clara e natural em português.
- source_word: בֶן יוֹאָשׁ
  choice: filho de Joás
  rationale: Tradução direta da construção patronímica.
- source_word: מֶלֶךְ יְהוּדָה
  choice: rei de Judá
  rationale: Reproduz naturalmente a cadeia construta que identifica o cargo e o reino de Amazias.
- source_word: מָלַךְ
  choice: tornou-se rei
  rationale: Neste aviso de entronização, o verbo indica o início do governo; esta formulação o distingue da declaração posterior sobre a duração do reinado.
- source_word: יָרָבְעָם
  choice: Jeroboão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: rei de Israel
  rationale: Reproduz naturalmente a cadeia construta que identifica o cargo e o reino de Jeroboão.
- source_word: בְּ/שֹׁמְרוֹן
  choice: em Samaria
  rationale: A preposição hebraica tem sentido locativo e identifica a capital de onde Jeroboão governou.
- source_word: אַרְבָּעִים וְ/אַחַת שָׁנָה
  choice: quarenta e um anos
  rationale: Expressa em português contemporâneo a duração declarada do reinado.
