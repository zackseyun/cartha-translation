id: 2KI.14.27
reference: 2 Kings 14:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/לֹא דִבֶּ֣ר יְהוָ֔ה לִ/מְחוֹת֙ אֶת שֵׁ֣ם יִשְׂרָאֵ֔ל מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם וַ/יּ֣וֹשִׁיעֵ֔/ם בְּ/יַ֖ד יָרָבְעָ֥ם בֶּן יוֹאָֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/027.yaml
  text: But Yahweh had not said that he would blot out the name of Israel from under heaven[b][a], so he saved them by the hand of Jeroboam son of Joash.
translation:
  language: pt
  text: Mas Yahweh não havia dito que apagaria[a] o nome de Israel de debaixo do céu; por isso, ele os salvou pela mão de Jeroboão, filho de Joás.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “eliminaria” ou “faria desaparecer”.
    reason: lexical_alternative
  - marker: b
    text: “Pela mão de” é uma expressão hebraica que significa “por meio de” ou “por intermédio de”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal e preserva sua distinção em relação ao título “Senhor”.
- source_word: דִבֶּר
  choice: havia dito
  rationale: דבר significa aqui “dizer/falar”; o mais-que-perfeito situa essa declaração, que não ocorreu, antes da ação salvadora narrada em seguida.
- source_word: לִמְחוֹת
  choice: que apagaria
  rationale: מחה denota apagar, eliminar ou fazer desaparecer. “Apagaria” combina naturalmente com “o nome de Israel” e conserva a imagem hebraica.
- source_word: שֵׁם יִשְׂרָאֵל
  choice: o nome de Israel
  rationale: Mantém a expressão hebraica, na qual “nome” representa a existência e identidade continuadas do povo.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: de debaixo do céu
  rationale: Preserva o idiomatismo espacial hebraico que aponta para a eliminação do âmbito da existência humana, sem substituí-lo pela interpretação “da terra”.
- source_word: וַיּוֹשִׁיעֵם
  choice: por isso, ele os salvou
  rationale: ישע no hifil significa salvar ou livrar. “Por isso” expressa a ligação narrativa e lógica entre a ausência de uma decisão de exterminar Israel e a ação salvadora subsequente.
- source_word: בְּיַד
  choice: pela mão de
  rationale: Conserva o idiomatismo hebraico de agência, esclarecido em nota, e apresenta Jeroboão como o agente humano da ação salvadora de Yahweh.
- source_word: יָרָבְעָם בֶּן יוֹאָשׁ
  choice: Jeroboão, filho de Joás
  rationale: Emprega as formas portuguesas tradicionais dos nomes e uma identificação filial natural em português.
theological_decisions:
- issue: Intenção divina e ação na preservação de Israel
  choice: Yahweh não havia declarado a eliminação de Israel e, por isso, salvou o povo por intermédio de Jeroboão.
  alternative: Traduzir as duas orações apenas como ações coordenadas, sem explicitar sua relação lógica.
  rationale: A sequência hebraica associa a ausência de uma declaração divina de extermínio à ação salvadora. “Por isso” torna essa lógica clara sem acrescentar uma doutrina externa e mantém a tensão de Yahweh salvar Israel por meio de um rei moralmente falho.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. A sintaxe é natural, mas conserva os idiomatismos significativos “o nome de Israel”, “de debaixo do céu” e “pela mão de”, sendo este último esclarecido em nota.
