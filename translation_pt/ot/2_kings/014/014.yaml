base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/014.yaml
  text: He took all the gold and silver[a], and all the vessels found in the house of Yahweh and in the treasuries of the king’s house, and the hostages, and returned to Samaria.
translation:
  language: pt
  text: Ele levou todo o ouro e toda a prata, todos os utensílios encontrados na casa de Yahweh e nos cofres do palácio, e os reféns[a], e voltou para Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os filhos das garantias” ou “os filhos dos fiadores”; provavelmente pessoas tomadas como garantia, isto é, reféns.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Ele levou
  rationale: O verbo descreve a tomada e remoção dos bens; “levou” expressa naturalmente a ação no contexto do saque e mantém a sequência narrativa.
- source_word: כָּל הַזָּהָב וְהַכֶּסֶף
  choice: todo o ouro e toda a prata
  rationale: Preserva a abrangência de כָּל e explicita em português a totalidade aplicada aos dois metais.
- source_word: כָּל הַכֵּלִים
  choice: todos os utensílios
  rationale: כֵּלִים é um termo amplo para objetos, utensílios ou peças; “utensílios” é claro e adequado ao inventário do templo.
- source_word: הַנִּמְצְאִים
  choice: encontrados
  rationale: Reproduz de modo conciso o particípio atributivo, indicando os utensílios que estavam nesses locais.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Mantém a expressão hebraica “casa” e representa o nome divino יהוה como Yahweh, sem substituir a forma do texto-fonte por um título.
- source_word: וּבְאֹצְרוֹת בֵּית הַמֶּלֶךְ
  choice: e nos tesouros do palácio real
  rationale: אֹצְרוֹת designa depósitos de riquezas ou tesouros; “palácio real” comunica naturalmente o sentido contextual de “casa do rei”.
- source_word: בְּנֵי הַתַּעֲרֻבוֹת
  choice: os reféns
  rationale: A expressão difícil, literalmente relacionada a “filhos das garantias”, provavelmente designa pessoas mantidas como garantia. A tradução contextual fica no texto, e a forma mais literal é preservada em nota.
- source_word: וַיָּשָׁב שֹׁמְרוֹנָה
  choice: Depois, voltou para Samaria
  rationale: שׁוב indica retorno, e a terminação direcional marca Samaria como destino. “Depois” torna fluida a progressão narrativa indicada pelo waw.
