  text: And Judah was defeated before Israel[a], and each man fled to his tent.
translation:
  language: pt
  text: Judá foi derrotado diante de Israel, e cada homem fugiu para a sua tenda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cada um fugiu para sua casa”. Literalmente, o hebraico diz: “cada homem para a sua tenda”, um modo comum de dizer que cada um voltou para sua moradia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּגֶף
  choice: foi derrotado
  rationale: O nifal de נָגַף, neste contexto militar, indica que Judá foi vencido em batalha; “foi derrotado” comunica isso com clareza e naturalidade.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma portuguesa tradicional do nome do reino do sul.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Preserva a construção hebraica comum em relatos de batalha, na qual alguém é derrotado diante do adversário, sem substituir diretamente a expressão por “por”.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Forma portuguesa tradicional do nome do reino do norte.
- source_word: וַיָּנֻסוּ
  choice: fugiu
  rationale: נוּס significa fugir; o singular em português concorda naturalmente com a expressão distributiva “cada homem”.
- source_word: אִישׁ
  choice: cada homem
  rationale: O singular distributivo אִישׁ destaca a retirada individual dos combatentes e mantém a referência masculina do texto.
- source_word: לְאָהֳלוֹ
  choice: para a sua tenda
  rationale: Reproduz literalmente a imagem hebraica, embora a expressão possa funcionar idiomaticamente como referência à moradia de cada um.
