  text: וַ/יַּ֤עַשׂ הַ/יָּשָׁר֙ בְּ/עֵינֵ֣י יְהוָ֔ה רַ֕ק לֹ֖א כְּ/דָוִ֣ד אָבִ֑י/ו כְּ/כֹ֧ל אֲשֶׁר עָשָׂ֛ה יוֹאָ֥שׁ אָבִ֖י/ו עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/003.yaml
  text: He did what was right in the eyes of Yahweh[a], yet not like David his father[c][b]; he did according to all that Joash his father had done.
translation:
  language: pt
  text: Ele fez o que era reto aos olhos de Yahweh, porém[a] não como Davi, seu pai[b]; fez conforme tudo o que Joás[c], seu pai, havia feito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “somente, não como Davi, seu pai”. A palavra hebraica רַק pode ser traduzida por “somente” ao introduzir essa ressalva.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “pai” tem o sentido dinástico de antepassado, e não de pai imediato.
    reason: cultural_note
  - marker: c
    text: Joás também é chamado de Jeoás em algumas traduções.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ele fez
  rationale: O wayyiqtol de עשה dá continuidade à narrativa. Em português, a conjunção inicial pode ser omitida com naturalidade sem perder a progressão narrativa.
- source_word: הַיָּשָׁר
  choice: o que era reto
  rationale: Expressa de modo claro e digno o adjetivo substantivado na fórmula de avaliação dos reis.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Preserva a imagem hebraica da avaliação divina e translitera o nome próprio יהוה segundo a prática do projeto.
- source_word: רַק
  choice: porém
  rationale: Neste contexto, introduz uma ressalva à avaliação positiva. “Porém” comunica naturalmente o valor adversativo, sem eliminar a possibilidade lexical de “somente”.
- source_word: לֹא כְּדָוִד אָבִיו
  choice: não como Davi, seu pai
  rationale: Mantém a comparação concisa do hebraico e conserva “pai” em seu sentido dinástico de antepassado.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: conforme tudo o que ... havia feito
  rationale: Preserva tanto a ideia de conformidade quanto a abrangência de כְּכֹל; o mais-que-perfeito esclarece que os atos de Joás eram anteriores.
- source_word: יוֹאָשׁ אָבִיו
  choice: Joás, seu pai
  rationale: Representa a forma hebraica יוֹאָשׁ pelo nome português corrente “Joás”; aqui “pai” se refere ao pai imediato de Amazias.
theological_decisions:
- issue: Avaliação real que combina aprovação e limitação
  choice: Amazias é genuinamente avaliado como alguém que fez o que era reto aos olhos de Yahweh, mas sua conduta é qualificada por não alcançar o padrão de Davi e por seguir o exemplo de Joás.
  alternative: Interpretar a primeira oração como simples fórmula sem verdadeira aprovação, ou minimizar a ressalva e equiparar Amazias a Davi.
  rationale: A estrutura hebraica apresenta uma avaliação positiva real, seguida de uma limitação explícita. A tradução conserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A expressão “aos olhos de” conserva o idioma hebraico sem soar obscura; “reto” mantém o tom tradicional da fórmula régia, e “porém” apresenta a ressalva com fluidez.
