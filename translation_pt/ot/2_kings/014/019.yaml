  text: And they conspired against him in Jerusalem[a], and he fled to Lachish; and they sent after him to Lachish and put him to death there.
translation:
  language: pt
  text: Conspiraram contra ele em Jerusalém, e ele fugiu para Laquis; e mandaram persegui-lo até Laquis[a] e ali o mataram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “enviaram atrás dele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ עָלָיו קֶשֶׁר
  choice: Conspiraram contra ele
  rationale: A construção com o verbo קשׁר e o substantivo cognato קֶשֶׁר é uma expressão idiomática para tramar ou formar uma conspiração política. “Conspiraram contra ele” comunica naturalmente tanto a ação hostil quanto seu caráter organizado.
- source_word: בִּירוּשָׁלִַם
  choice: em Jerusalém
  rationale: Uso locativo direto da preposição ב com o nome da cidade.
- source_word: וַיָּנָס
  choice: ele fugiu
  rationale: O verbo נוס normalmente significa fugir diante de perigo. “Fugiu” é direto e natural neste contexto narrativo.
- source_word: לָכִישָׁה
  choice: para Laquis / até Laquis
  rationale: O ה direcional indica movimento rumo à cidade. Na primeira ocorrência, “para Laquis” expressa o destino da fuga; na segunda, “até Laquis” deixa claro que os enviados o seguiram ao mesmo destino.
- source_word: וַיִּשְׁלְחוּ אַחֲרָיו
  choice: enviaram homens atrás dele
  rationale: O hebraico diz literalmente “enviaram atrás dele”, sem declarar o objeto do verbo. Em português, “homens” explicita o agente humano necessariamente implícito e “atrás dele” preserva a ideia de perseguição. A forma literal é registrada em nota.
- source_word: וַיְמִתֻהוּ
  choice: o mataram
  rationale: A forma causativa de מות significa fazer morrer ou matar. “O mataram” é clara, deliberada e natural; o contexto já mostra que se trata de uma morte intencional.
- source_word: שָׁם
  choice: ali
  rationale: O advérbio retoma Laquis como o lugar onde ele foi morto. “Ali” é natural na sequência narrativa.
