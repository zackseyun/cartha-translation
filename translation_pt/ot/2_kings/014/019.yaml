  source_fidelity: A primeira oração corresponde bem ao hebraico. Contudo, “enviaram homens” explicita um objeto que o texto hebraico deixa não expresso. Uma formulação portuguesa que preserve a elipse do agente enviado, mas expresse naturalmente a perseguição, é preferível. “Então” também acrescenta uma nuance consecutiva que não é necessária para o simples waw narrativo.
  naturalness: O texto é claro e de bom registro. “Mandaram persegui-lo até Laquis” é mais idiomático em português do que “enviaram atrás dele”, sem exigir a inclusão de “homens”. A pontuação com ponto e vírgula mantém a progressão narrativa em uma única frase.
  terminology: “Conspiraram contra ele”, “Jerusalém”, “Laquis”, “fugiu” e “o mataram” são escolhas adequadas, modernas e fiéis. “Mataram” comunica de modo natural o valor causativo deliberado de וַיְמִתֻהוּ, sem impor uma caracterização jurídica adicional.
