source:
  edition: WLC
  text: ה֗וּא הֵשִׁיב֙ אֶת גְּב֣וּל יִשְׂרָאֵ֔ל מִ/לְּב֥וֹא חֲמָ֖ת עַד יָ֣ם הָ/עֲרָבָ֑ה כִּ/דְבַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר דִּבֶּ֗ר בְּ/יַד עַבְדּ֞/וֹ יוֹנָ֤ה בֶן אֲמִתַּי֙ הַ/נָּבִ֔יא אֲשֶׁ֖ר מִ/גַּ֥ת הַחֵֽפֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/025.yaml
  text: He restored the border of Israel from Lebo-hamath as far as the Sea of the Arabah[a], according to the word of Yahweh, the God of Israel, which he had spoken by the hand of his servant Jonah son of Amittai, the prophet[b], who was from Gath-hepher.
translation:
  language: pt
  text: Ele restabeleceu a fronteira de Israel, desde Lebo-Hamate[a] até o mar da Arabá[b], conforme a palavra de Yahweh, o Deus de Israel, que ele havia falado por meio de seu servo Jonas, filho de Amitai, o profeta de Gate-Hefer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “desde a entrada de Hamate”.
    reason: lexical_alternative
  - marker: b
    text: Provavelmente o mar Morto.
    reason: geographical_identification
lexical_decisions:
- source_word: הֵשִׁיב
  choice: restabeleceu
  rationale: O hifil de שׁוב indica aqui a restauração da antiga fronteira territorial de Israel; “restabeleceu” comunica esse sentido político-geográfico com clareza.
- source_word: גְּבוּל
  choice: fronteira
  rationale: O substantivo designa o limite territorial de Israel; “fronteira” é natural e preciso em português.
- source_word: מִלְּבוֹא חֲמָת
  choice: desde Lebo-Hamate
  rationale: A expressão funciona como topônimo ou designação geográfica fixa. A transliteração preserva essa possibilidade, enquanto o sentido mais literal consta em nota.
- source_word: יָם הָעֲרָבָה
  choice: mar da Arabá
  rationale: Reproduz a designação geográfica hebraica sem substituí-la no texto pela provável identificação com o mar Morto.
- source_word: כִּדְבַר
  choice: conforme a palavra de
  rationale: Expressa que a restauração ocorreu em conformidade com uma declaração divina anterior.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֲשֶׁר דִּבֶּר
  choice: que ele havia anunciado
  rationale: No contexto de uma palavra divina transmitida por um profeta, “anunciado” torna explícito de modo natural que Yahweh comunicou essa palavra, sem alterar sua autoria.
- source_word: בְּיַד
  choice: por intermédio de
  rationale: O idiomatismo hebraico indica mediação ou agência. “Por intermédio de” é claro e natural em português moderno.
- source_word: עַבְדּוֹ
  choice: seu servo
  rationale: No contexto de comissão profética, “servo” expressa adequadamente a relação de pertencimento e serviço a Deus.
- source_word: הַנָּבִיא
  choice: o profeta
  rationale: Título em aposição que identifica a função de Jonas.
- source_word: מִגַּת הַחֵפֶר
  choice: de Gate-Hefer
  rationale: A preposição מן marca a procedência de Jonas; em português, “o profeta de Gate-Hefer” comunica naturalmente sua origem.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: Mantém o nome pessoal no texto e evita substituí-lo por um título, em conformidade com a política do projeto.
- issue: Identificação de יָם הָעֲרָבָה
  choice: mar da Arabá
  alternative: mar Morto
  rationale: A tradução principal conserva a expressão hebraica e deixa a identificação geográfica provável para a nota, evitando resolver no texto algo que a forma original não explicita.
- issue: Valor de לְבוֹא חֲמָת
  choice: Lebo-Hamate como designação geográfica
  alternative: entrada de Hamate
  rationale: A expressão pode funcionar como topônimo fixo, mas sua composição permite uma tradução literal; ambas as possibilidades são preservadas, com a alternativa em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “restabeleceu” e “por intermédio de” para comunicar naturalmente o sentido dos idiomatismos hebraicos. Conserva Yahweh e as designações geográficas do texto-fonte; todos os marcadores de nota aparecem junto às expressões correspondentes.
