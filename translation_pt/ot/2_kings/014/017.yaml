base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/017.yaml
  text: Amaziah son of Joash[a], king of Judah, lived fifteen years after the death of Jehoash son of Jehoahaz, king of Israel.
translation:
  language: pt
  text: Amazias, filho de Joás[a], rei de Judá, viveu quinze anos depois da morte de Jeoás, filho de Jeoacaz, rei de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os nomes “Joás” e “Jeoás” representam grafias hebraicas diferentes neste versículo; a tradução os mantém distintos para evitar confusão entre o pai de Amazias, ligado ao reino de Judá, e o rei de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: viveu
  rationale: O verbo חיה, seguido de uma duração e de אַחֲרֵי מוֹת, informa por quanto tempo Amazias continuou vivo após a morte do outro rei; “viveu” é natural e preserva a formulação sem acrescentar a nuance interpretativa de “sobreviveu”.
- source_word: אֲמַצְיָהוּ
  choice: Amazias
  rationale: Forma portuguesa tradicional e amplamente reconhecível do nome hebraico.
- source_word: בֶן יוֹאָשׁ
  choice: filho de Joás
  rationale: O estado construto indica filiação direta; “Joás” representa a grafia hebraica mais curta יוֹאָשׁ e identifica o rei de Judá.
- source_word: מֶלֶךְ יְהוּדָה
  choice: rei de Judá
  rationale: Tradução direta da cadeia construta que indica o cargo e o reino de Amazias.
- source_word: אַחֲרֵי מוֹת
  choice: depois da morte de
  rationale: Preserva de modo natural em português a expressão nominal hebraica formada pela preposição e pelo substantivo em estado construto.
- source_word: יְהוֹאָשׁ
  choice: Jeoás
  rationale: Forma portuguesa que representa a grafia hebraica mais longa יְהוֹאָשׁ e ajuda a distinguir o rei de Israel de Joás, pai de Amazias.
- source_word: יְהוֹאָחָז
  choice: Jeoacaz
  rationale: Forma portuguesa tradicional e inteligível do nome hebraico.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: rei de Israel
  rationale: Tradução direta da cadeia construta que identifica o reino do monarca do norte.
- source_word: חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: quinze anos
  rationale: Equivalente português normal da expressão hebraica de duração.
