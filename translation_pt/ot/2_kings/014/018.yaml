  yaml_path: translation/ot/2_kings/014/018.yaml
  text: The rest of the acts of Amaziah[a], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: pt
  text: Quanto aos demais feitos de Amazias, não estão escritos no Livro das Crônicas[a] dos Reis de Judá?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Livro dos Anais dos Reis de Judá”.'
    reason: Alternativa lexical para דִּבְרֵי הַיָּמִים, expressão que pode designar crônicas ou anais.
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Quanto aos demais feitos
  rationale: יֶתֶר indica o restante, e דִּבְרֵי, nesta fórmula historiográfica, abrange os feitos e assuntos do reinado. “Quanto aos” expressa naturalmente a transição introduzida por וְ sem acrescentar uma ideia temporal.
- source_word: אֲמַצְיָהוּ
  choice: Amazias
  rationale: Emprega-se a forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: não estão escritos
  rationale: Preserva a pergunta retórica que espera resposta afirmativa e o valor do particípio passivo כְּתוּבִים, “escritos”.
- source_word: עַל סֵפֶר
  choice: no Livro
  rationale: Embora עַל possa significar literalmente “sobre”, nesta fórmula de referência documental o português idiomático pede “no”. סֵפֶר é adequadamente vertido por “Livro” no título da fonte.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: das Crônicas dos Reis de Judá
  rationale: A expressão designa um registro analístico real. “Crônicas” conserva a equivalência tradicional, enquanto לְ indica aqui a relação do documento com os reis de Judá.
