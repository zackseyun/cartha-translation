source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מִ/כָּל חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/024.yaml
  text: He did what was evil in the eyes of Yahweh. He did not turn away from any of the sins of Jeroboam son of Nebat[a], which he caused Israel to commit.
translation:
  language: pt
  text: Ele fez o que era mau aos olhos de Yahweh. Não se afastou de nenhum dos pecados de Jeroboão, filho de Nebate[a], que levou Israel a pecar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, ligando a oração aos pecados: “dos pecados de Jeroboão, filho de Nebate, pelos quais ele levou Israel a pecar”. O hebraico permite que a oração relativa se refira a Jeroboão ou, em sentido instrumental, aos seus pecados.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Ele fez o que era mau
  rationale: A expressão idiomática hebraica significa praticar o que é moralmente mau; esta formulação é direta e natural em português.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Preserva o idioma hebraico de avaliação divina e translitera o nome pessoal יְהוָה.
- source_word: לֹא סָר מִכָּל חַטֹּאות
  choice: Não se afastou de nenhum dos pecados
  rationale: Com a negação, מִכָּל expressa que não houve afastamento de pecado algum; 'nenhum' comunica naturalmente esse alcance abrangente.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jeroboão, filho de Nebate
  rationale: Emprega as formas portuguesas tradicionais dos nomes e explicita naturalmente a relação filial.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: com os quais ele levou Israel a pecar
  rationale: Mantém a força causativa do hifil de חטא e toma o relativo como ligado instrumentalmente aos pecados, sem ocultar a alternativa sintática.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o tetragrama como nome próprio; a transliteração preserva essa função em vez de substituí-lo por um título.
- issue: Referente de אֲשֶׁר na oração final
  choice: 'Ligação aos pecados em sentido instrumental: ''com os quais ele levou Israel a pecar'''
  alternative: 'Ligação direta a Jeroboão: ''que levou Israel a pecar'''
  rationale: A concordância permite relacionar o pronome aos 'pecados' como práticas por meio das quais Jeroboão induziu Israel ao pecado. Como o hebraico também admite referência direta a Jeroboão, a alternativa é registrada em nota.
translation_notes:
  register: Português atual, digno e acessível, com ampla legibilidade brasileira. Conserva a fórmula hebraica 'aos olhos de' e evita linguagem excessivamente arcaica.
