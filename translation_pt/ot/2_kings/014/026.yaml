  text: כִּי רָאָ֧ה יְהוָ֛ה אֶת עֳנִ֥י יִשְׂרָאֵ֖ל מֹרֶ֣ה מְאֹ֑ד וְ/אֶ֤פֶס עָצוּר֙ וְ/אֶ֣פֶס עָז֔וּב וְ/אֵ֥ין עֹזֵ֖ר לְ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/026.yaml
  text: For Yahweh saw that the affliction of Israel was very bitter[a], and there was neither bond nor free[b], and there was no helper for Israel.
translation:
  language: pt
  text: Pois Javé viu que a aflição de Israel era muito amarga[a], que não havia nem cativo nem livre[b] e que Israel não tinha quem o ajudasse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “muito dolorosa” ou “muito severa”. A expressão hebraica é difícil, mas claramente intensifica o sofrimento de Israel.
    reason: lexical_alternative
  - marker: b
    text: O sentido exato deste par hebraico é incerto. Tradicionalmente, “nem cativo nem livre”; provavelmente é uma expressão abrangente, indicando que não restava ninguém capaz de prestar auxílio. Também se traduz “nem escravo nem livre” ou, mais literalmente, “nem retido nem deixado”.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Javé
  rationale: Representa diretamente o nome divino e usa sua forma consagrada e amplamente reconhecida em português.
- source_word: עֳנִי
  choice: aflição
  rationale: Expressa de modo abrangente o sofrimento e a condição angustiante de Israel, sem restringir o sentido à pobreza material.
- source_word: מֹרֶה מְאֹד
  choice: muito amarga
  rationale: No contexto, intensifica a gravidade da aflição de Israel. A construção hebraica é difícil, por isso outras nuances plausíveis são registradas em nota.
- source_word: אֶפֶס
  choice: não havia nem
  rationale: Comunica a ausência total expressa pela repetição enfática do termo hebraico e introduz naturalmente o par seguinte em português.
- source_word: עָצוּר
  choice: detido
  rationale: Mantém o sentido básico de alguém retido, confinado ou impedido, preservando o contraste lexical do hebraico.
- source_word: עָזוּב
  choice: livre
  rationale: Funciona como contraponto natural a 'detido', embora o sentido preciso deste par idiomático permaneça incerto.
- source_word: עֹזֵר
  choice: quem o ajudasse
  rationale: Traduz naturalmente em português o particípio 'aquele que ajuda', deixando claro que Israel não tinha auxílio humano.
theological_decisions:
- issue: Sentido do par idiomático עָצוּר וְעָזוּב
  choice: não havia nem detido nem livre
  alternative: não restava ninguém; não havia nem escravo nem livre; não havia nem o confinado nem o solto
  rationale: A tradução conserva o contraste concreto do hebraico sem transformar uma expressão obscura numa afirmação social ou teológica mais definida do que o texto permite. A nota esclarece sua provável força abrangente.
- issue: Sentido de מֹרֶה מְאֹד
  choice: muito amarga
  alternative: muito dolorosa; muito severa
  rationale: A leitura escolhida transmite a intensidade extrema do sofrimento e mantém uma imagem possível no hebraico, enquanto a nota preserva a incerteza lexical.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluente para leitores brasileiros e compreensão internacional. A repetição de “que” reproduz com naturalidade o encadeamento causal do hebraico; as notas preservam as duas dificuldades lexicais sem sobrecarregar o texto principal.
