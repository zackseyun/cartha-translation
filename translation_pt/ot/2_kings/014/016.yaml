  yaml_path: translation/ot/2_kings/014/016.yaml
  text: And Jehoash slept with his fathers and was buried in Samaria with the kings of Israel, and Jeroboam his son reigned in his place.
translation:
  language: pt
  text: Jeoás descansou com seus antepassados e foi sepultado em Samaria, junto aos reis de Israel; e Jeroboão, seu filho, reinou em seu lugar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: descansou
  rationale: Na fórmula régia de falecimento, שׁכב com “seus antepassados” indica a morte. “Descansou” conserva a imagem e o caráter formulaico do hebraico, sendo mais natural em português atual do que “dormiu” neste contexto.
- source_word: עִם אֲבֹתָיו
  choice: com seus antepassados
  rationale: A expressão integra a fórmula tradicional de falecimento. “Antepassados” comunica com clareza o sentido abrangente de אָבוֹת em português moderno, sem sugerir apenas os pais imediatos.
- source_word: וַיִּקָּבֵר
  choice: foi sepultado
  rationale: A forma passiva reproduz o nifal hebraico; “sepultado” mantém um registro narrativo digno e corrente.
- source_word: בְּשֹׁמְרוֹן
  choice: em Samaria
  rationale: A preposição בְּ é locativa neste contexto e indica o lugar do sepultamento.
- source_word: עִם מַלְכֵי יִשְׂרָאֵל
  choice: junto aos reis de Israel
  rationale: “Junto aos” expressa naturalmente a associação espacial de עִם no contexto funerário, evitando a possível impressão de que todos foram sepultados no mesmo ato.
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: מלך na notícia de sucessão descreve Jeroboão assumindo e exercendo o reinado; “reinou” também preserva a fórmula recorrente do livro.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: A expressão indica substituição e sucessão dinástica, não apenas sequência cronológica.
