review_pass:
  verdict: revise
  source_fidelity: A tradução transmite corretamente o sentido geral e preserva a distinção importante entre as formas legais passivas (“serão mortos”) e o verbo final ativo (“morrerá”). Contudo, “não matou” enfraquece o hifil משפטי de הֵמִית, que neste contexto se refere a aplicar a pena de morte. Além disso, “no qual Yahweh ordenou” faz parecer que Yahweh ordenou no livro, em vez de introduzir a ordem citada.
  naturalness: O português é claro e de registro adequado. “Como Yahweh ordenou, dizendo” é uma formulação mais natural e sintaticamente inequívoca do que “no qual Yahweh ordenou”. “Não mandou matar” comunica com clareza a ação régia/judicial sem transformar o verbo final “morrerá” em uma segunda formulação de execução.
  terminology: “Yahweh”, “Livro da Lei de Moisés”, “pais”, “filhos” e “pecado” são apropriados. “Assassinos” é uma interpretação contextual aceitável de הַמַּכִּים, embora “os que mataram” permaneça uma alternativa mais próxima da expressão participial hebraica; a nota preserva adequadamente essa possibilidade.
  issues:
  - severity: medium
    issue: “Não matou” não expressa suficientemente a força causativa/judicial de לֹא הֵמִית.
    rationale: O hifil de מות significa causar a morte e, no contexto de punição dos autores do homicídio do rei, indica não aplicar a pena de morte aos filhos deles. “Não mandou matar” preserva melhor essa nuance em português.
  - severity: medium
    issue: “No qual Yahweh ordenou” tem referente sintático impreciso.
    rationale: O relativo pode ligar a ordem ao “Livro”, enquanto o hebraico introduz a ordem de Yahweh que a citação registra. “Como Yahweh ordenou, dizendo” comunica a relação de modo claro e mantém a fórmula textual.
  revised_text: 'Mas não mandou matar os filhos dos assassinos[a], conforme está escrito no Livro da Lei de Moisés, como Yahweh ordenou, dizendo: “Os pais não serão mortos por causa dos filhos, nem os filhos serão mortos por causa dos pais; antes, cada um morrerá pelo seu próprio pecado.”[b]'
  revised_footnotes:
  - marker: a
    text: 'Ou: “os filhos dos que haviam matado”. O hebraico diz literalmente “os filhos dos que mataram”.'
    reason: lexical_alternative
  - marker: b
    text: Esta citação corresponde a Deuteronômio 24:16.
    reason: cross_reference
  revision_rationale: 'A revisão ajusta apenas dois pontos seguros: explicita a ação de mandar executar, correspondente ao hifil de מות no contexto judicial, e elimina a ambiguidade sintática na introdução da citação. Mantêm-se a estrutura, o registro, os termos-chave, o contraste entre execução judicial e “morrerá”, e os dois marcadores de nota.'
