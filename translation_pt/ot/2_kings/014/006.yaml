  text: וְ/אֶת בְּנֵ֥י הַ/מַּכִּ֖ים לֹ֣א הֵמִ֑ית כַּ/כָּת֣וּב בְּ/סֵ֣פֶר תּֽוֹרַת מֹ֠שֶׁה אֲשֶׁר צִוָּ֨ה יְהוָ֜ה לֵ/אמֹ֗ר לֹא יוּמְת֨וּ אָב֤וֹת עַל בָּנִים֙ וּ/בָנִים֙ לֹא יוּמְת֣וּ עַל אָב֔וֹת כִּ֛י אִם אִ֥ישׁ בְּ/חֶטְא֖/וֹ ימות־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/006.yaml
  text: But he did not put the sons of the killers to death[a], according to what is written in the Book of the Law of Moses, which Yahweh commanded, saying, “Fathers shall not be put to death for sons, and sons shall not be put to death for fathers; rather[b], each man shall die for his own sin.”
translation:
  language: pt
  text: 'Mas não mandou matar os filhos dos assassinos[a], conforme está escrito no Livro da Lei de Moisés, como Yahweh ordenou, dizendo: “Os pais não serão mortos por causa dos filhos, nem os filhos serão mortos por causa dos pais; antes, cada um morrerá pelo seu próprio pecado.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os filhos dos que haviam matado”. O hebraico diz literalmente “os filhos dos que mataram”.'
    reason: lexical_alternative
  - marker: b
    text: Esta citação corresponde a Deuteronômio 24:16.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי הַמַּכִּים
  choice: os filhos dos assassinos
  rationale: Mantém o masculino de בְּנֵי e expressa naturalmente o particípio de נכה neste contexto, referindo-se aos que haviam matado o pai de Amazias.
- source_word: לֹא הֵמִית
  choice: não matou
  rationale: O hifil de מות significa causar a morte. Em português, “não matou” é direto e natural; o contexto régio e legal deixa claro que se trata de execução deliberada.
- source_word: כַּכָּתוּב
  choice: conforme está escrito
  rationale: Reproduz a fórmula de conformidade com a autoridade do texto escrito em português corrente e digno.
- source_word: בְּסֵפֶר תּוֹרַת מֹשֶׁה
  choice: no Livro da Lei de Moisés
  rationale: Preserva a expressão tradicional e transparente סֵפֶר תּוֹרַת מֹשֶׁה.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: לֹא יוּמְתוּ
  choice: não serão mortos
  rationale: A forma causativa passiva, dentro de uma proibição legal, indica que ninguém deve ser morto judicialmente por causa do familiar.
- source_word: אָבוֹת ... בָּנִים
  choice: os pais ... os filhos
  rationale: Conserva os plurais masculinos do hebraico e sua correspondência recíproca.
- source_word: עַל
  choice: por causa de
  rationale: Explicita que o parentesco ou pecado alheio não deve constituir a base da punição.
- source_word: כִּי אִם
  choice: antes
  rationale: Introduz de modo conciso o princípio contrastante que segue as duas proibições.
- source_word: אִישׁ
  choice: cada um
  rationale: Expressa o valor distributivo de אִישׁ em português natural, sem perder a ênfase na responsabilidade individual.
- source_word: בְּחֶטְאוֹ
  choice: pelo seu próprio pecado
  rationale: Torna explícitos tanto o fundamento da morte quanto o sufixo possessivo, ressaltando o contraste com a punição pelo pecado de outro.
- source_word: יָמוּת
  choice: morrerá
  rationale: Preserva a mudança para o qal “morrer”, em contraste com as formas causativas passivas anteriores.
theological_decisions:
- issue: Responsabilidade individual versus familiar na lei da aliança
  choice: O texto proíbe que pais e filhos sejam executados uns pelos pecados dos outros e afirma que cada um morre pelo próprio pecado.
  alternative: Ler a declaração como negação geral de toda consequência coletiva ou intergeracional do pecado.
  rationale: O contexto e as formas verbais tratam de pena judicial e culpa pessoal. A tradução não amplia a afirmação para resolver outras tensões bíblicas sobre consequências comunitárias.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Conforme está escrito” e “Livro da Lei de Moisés” preservam o tom documental; “cada um” comunica naturalmente a distribuição individual. O marcador [b] foi colocado após toda a citação, enquanto [a] acompanha a expressão a que se refere.
