revisions:
- from: 'Mas não matou os filhos dos assassinos[a], conforme está escrito no Livro da Lei de Moisés, no qual Yahweh ordenou: “Os pais não serão mortos por causa dos filhos, nem os filhos serão mortos por causa dos pais; antes, cada um morrerá pelo seu próprio pecado.”[b]'
  to: 'Mas não mandou matar os filhos dos assassinos[a], conforme está escrito no Livro da Lei de Moisés, como Yahweh ordenou, dizendo: “Os pais não serão mortos por causa dos filhos, nem os filhos serão mortos por causa dos pais; antes, cada um morrerá pelo seu próprio pecado.”[b]'
  rationale: 'A revisão ajusta apenas dois pontos seguros: explicita a ação de mandar executar, correspondente ao hifil de מות no contexto judicial, e elimina a ambiguidade sintática na introdução da citação. Mantêm-se a estrutura, o registro, os termos-chave, o contraste entre execução judicial e “morrerá”, e os dois marcadores de nota.'
