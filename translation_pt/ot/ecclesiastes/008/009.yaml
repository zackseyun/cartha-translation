id: ECC.8.9
reference: Ecclesiastes 8:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֶת כָּל זֶ֤ה רָאִ֨יתִי֙ וְ/נָת֣וֹן אֶת לִבִּ֔/י לְ/כָֽל מַעֲשֶׂ֔ה אֲשֶׁ֥ר נַעֲשָׂ֖ה תַּ֣חַת הַ/שָּׁ֑מֶשׁ עֵ֗ת אֲשֶׁ֨ר שָׁלַ֧ט הָ/אָדָ֛ם בְּ/אָדָ֖ם לְ/רַ֥ע לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/009.yaml
  text: All this I have seen[a], while applying my heart to every deed that is done under the sun, at a time when man has ruled over man to his harm.
translation:
  language: pt
  text: Tudo isso vi enquanto dedicava o coração a toda obra que se faz debaixo do sol, num tempo em que um ser humano dominava outro para seu mal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em prejuízo daquele que era dominado”. O pronome hebraico também pode ser entendido como referência ao próprio dominador.'
    reason: ambiguity
lexical_decisions:
- source_word: רָאִיתִי
  choice: vi
  rationale: O perfeito hebraico apresenta a observação acumulada do Mestre; o pretérito perfeito é direto e natural em português.
- source_word: וְנָתוֹן אֶת־לִבִּי
  choice: enquanto dedicava o coração
  rationale: A expressão indica dirigir a reflexão e a atenção a algo. “Dedicava o coração” conserva a imagem hebraica sem soar tão mecânico quanto “aplicava o coração”.
- source_word: מַעֲשֶׂה
  choice: obra
  rationale: Abrange aquilo que é feito ou realizado, sem limitar o sentido ao trabalho profissional.
- source_word: נַעֲשָׂה
  choice: se faz
  rationale: Reproduz naturalmente a construção passiva e mantém a fórmula característica de Eclesiastes.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: debaixo do sol
  rationale: Preserva a expressão recorrente e reconhecível de Eclesiastes.
- source_word: עֵת אֲשֶׁר
  choice: num tempo em que
  rationale: Mantém explícito o substantivo temporal e introduz com naturalidade a circunstância observada.
- source_word: שָׁלַט
  choice: dominava
  rationale: Expressa o exercício de poder de uma pessoa sobre outra; no contexto, “dominar” comunica melhor a assimetria prejudicial do que o mais institucional “governar”.
- source_word: הָאָדָם בְּאָדָם
  choice: um ser humano dominava outro
  rationale: O hebraico usa אָדָם de modo representativo para seres humanos em relação uns com os outros. A formulação preserva a singularidade e o caráter proverbial sem restringir indevidamente a referência a homens do sexo masculino.
- source_word: לְרַע לוֹ
  choice: para seu mal
  rationale: A formulação concisa conserva a referência não totalmente explícita do pronome hebraico e não decide silenciosamente se o dano recai sobre quem domina ou sobre quem é dominado.
theological_decisions:
- issue: Referência genérica de אָדָם
  choice: um ser humano ... outro
  alternative: um homem ... outro homem
  rationale: Neste provérbio, אָדָם designa uma pessoa humana de modo representativo, não necessariamente um indivíduo do sexo masculino. A tradução escolhida comunica essa extensão sem apagar a estrutura singular do original.
- issue: Referente de לוֹ em לְרַע לוֹ
  choice: para seu mal
  alternative: para o mal daquele que era dominado / para o próprio mal de quem dominava
  rationale: Embora seja comum entender que o dano recai sobre a pessoa dominada, o pronome hebraico permite discussão. A tradução principal mantém a ambiguidade, e a nota a explicita.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A formulação conserva a imagem hebraica do coração como centro da reflexão e evita linguagem excessivamente arcaica.
