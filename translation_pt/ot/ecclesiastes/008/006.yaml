  text: כִּ֣י לְ/כָל חֵ֔פֶץ יֵ֖שׁ עֵ֣ת וּ/מִשְׁפָּ֑ט כִּֽי רָעַ֥ת הָ/אָדָ֖ם רַבָּ֥ה עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/006.yaml
  text: For every matter there is a time and a judgment[b][a], because the evil of man weighs heavily upon him.
translation:
  language: pt
  text: Pois para cada assunto há um tempo e um julgamento[a], porque o mal do ser humano pesa muito sobre ele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma decisão”, “justiça” ou “um procedimento adequado”. A expressão “para cada assunto” também pode ser traduzida como “para cada propósito” ou “para cada questão”.
    reason: lexical_alternative
  - marker: b
    text: Ou “porque a desgraça do ser humano é grande sobre ele” ou “porque a aflição do ser humano pesa muito sobre ele”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: O primeiro כִּי explica a afirmação anterior; “Pois” expressa naturalmente essa função discursiva.
- source_word: לְכָל חֵפֶץ
  choice: para cada questão
  rationale: חֵפֶץ pode indicar desejo, propósito, assunto ou questão. Em paralelo com עֵת e à luz de Eclesiastes 3:1, “questão” preserva aqui a referência ampla a assuntos ou situações.
- source_word: יֵשׁ עֵת
  choice: há um tempo
  rationale: Reproduz diretamente a construção existencial sem acrescentar que o tempo é necessariamente predeterminado.
- source_word: וּמִשְׁפָּט
  choice: e um julgamento
  rationale: מִשְׁפָּט pode significar julgamento, justiça, decisão ou procedimento adequado. “Julgamento” mantém o núcleo lexical e deixa aberta a nuance contextual.
- source_word: כִּי
  choice: porque
  rationale: O segundo כִּי introduz a causa da declaração precedente, e “porque” torna clara essa relação.
- source_word: רָעַת הָאָדָם
  choice: o mal do ser humano
  rationale: רָעָה abrange mal, desgraça, sofrimento ou calamidade. A tradução principal conserva “mal”, enquanto a nota registra sentidos contextuais possíveis; “ser humano” comunica o valor genérico de הָאָדָם em português atual.
- source_word: רַבָּה עָלָיו
  choice: pesa muito sobre ele
  rationale: A expressão descreve algo que se torna grande ou pesado sobre a pessoa. Esta formulação portuguesa transmite de modo natural a ideia de forte peso ou carga.
theological_decisions:
- issue: Uso genérico de הָאָדָם
  choice: ser humano
  alternative: homem; humanidade
  rationale: Embora o hebraico esteja no singular, seu sentido é genérico. “Ser humano” preserva a referência à pessoa humana em linguagem portuguesa clara, e o pronome singular mantém a forma representativa.
- issue: Sentido de רָעָה neste contexto
  choice: mal
  alternative: desgraça; sofrimento; aflição
  rationale: O termo hebraico é semanticamente amplo. O texto principal mantém o sentido lexical “mal”, sem decidir se se trata de mal moral ou adversidade; a nota conserva a ambiguidade contextual.
- issue: Sentido de מִשְׁפָּט ao lado de “tempo”
  choice: julgamento
  alternative: justiça; decisão; procedimento adequado
  rationale: A tradução evita restringir o termo a uma única interpretação jurídica, providencial ou prática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem das orações e as relações causais do hebraico foram preservadas, enquanto expressões idiomáticas foram formuladas naturalmente. As notas mantêm abertas as amplitudes semânticas de חֵפֶץ, מִשְׁפָּט e רָעָה.
