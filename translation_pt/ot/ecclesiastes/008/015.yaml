reference: Ecclesiastes 8:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/שִׁבַּ֤חְתִּֽי אֲנִי֙ אֶת הַ/שִּׂמְחָ֔ה אֲשֶׁ֨ר אֵֽין ט֤וֹב לָֽ/אָדָם֙ תַּ֣חַת הַ/שֶּׁ֔מֶשׁ כִּ֛י אִם לֶ/אֱכ֥וֹל וְ/לִ/שְׁתּ֖וֹת וְ/לִ/שְׂמ֑וֹחַ וְ/ה֞וּא יִלְוֶ֣/נּוּ בַ/עֲמָל֗/וֹ יְמֵ֥י חַיָּ֛י/ו אֲשֶׁר נָֽתַן ל֥/וֹ הָ/אֱלֹהִ֖ים תַּ֥חַת הַ/שָּֽׁמֶשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/015.yaml
  text: So I commended joy[a], because there is nothing better for man under the sun than to eat and to drink and to rejoice[c][b]; and this will accompany him in his labor during the days of his life that God has given him under the sun.
translation:
  language: pt
  text: Por isso, recomendei a alegria[a], pois não há nada melhor para o ser humano[b], debaixo do sol, do que comer, beber e se alegrar. E essa alegria o acompanhará[c] em seu trabalho durante os dias da vida que Deus lhe deu debaixo do sol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “louvei a alegria”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “para o homem”; o singular tem sentido genérico e se refere aos seres humanos em geral.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou, de modo mais literal: “e ela irá com ele em sua labuta”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁבַּחְתִּי
  choice: recomendei
  rationale: O piel de שׁבח pode significar louvar ou recomendar. “Recomendei” comunica naturalmente a avaliação favorável do autor sem sugerir necessariamente louvor cultual.
- source_word: הַשִּׂמְחָה
  choice: a alegria
  rationale: “Alegria” é a equivalência portuguesa mais ampla e natural, mantendo o tema recorrente do desfrute da vida em Eclesiastes.
- source_word: אֵין טוֹב לָאָדָם
  choice: não há nada melhor para o ser humano
  rationale: A formulação comparativa expressa com clareza o valor idiomático provável da construção hebraica; “ser humano” preserva o sentido genérico de אָדָם em português atual.
- source_word: תַּחַת הַשֶּׁמֶשׁ
  choice: debaixo do sol
  rationale: Mantém literalmente o refrão temático característico de Eclesiastes.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת וְלִשְׂמוֹחַ
  choice: comer, beber e se alegrar
  rationale: Reproduz a sequência dos três infinitivos em português natural e conserva a força verbal de שׂמח.
- source_word: וְהוּא יִלְוֶנּוּ
  choice: E essa alegria o acompanhará
  rationale: Toma o pronome masculino como retomada de שִׂמְחָה, nome masculino em hebraico, e explicita o referente em português para evitar a ambiguidade gramatical criada pelo gênero feminino de “alegria”.
- source_word: בַעֲמָלוֹ
  choice: em seu trabalho
  rationale: “Trabalho” é corrente e digno; a nota registra “labuta” como alternativa que ressalta mais fortemente o aspecto penoso de עָמָל.
- source_word: יְמֵי חַיָּיו אֲשֶׁר נָתַן לוֹ הָאֱלֹהִים
  choice: durante os dias da vida que Deus lhe deu
  rationale: Preserva a extensão temporal e apresenta a vida como dádiva de Deus, seguindo de perto a sintaxe hebraica.
theological_decisions:
- issue: Sentido genérico de אָדָם
  choice: o ser humano
  alternative: o homem
  rationale: Neste contexto, o singular é representativo da humanidade em geral, não exclusivamente do sexo masculino. “O ser humano” torna esse alcance explícito sem alterar o referente.
- issue: Referente de וְהוּא em וְהוּא יִלְוֶנּוּ
  choice: essa alegria
  alternative: isso
  rationale: O pronome masculino pode retomar הַשִּׂמְחָה, que é masculino em hebraico. A explicitação preserva essa leitura contextual, enquanto a nota mantém uma tradução menos interpretativa da construção.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantém o refrão “debaixo do sol”, evita linguagem excessivamente arcaica e explicita apenas o necessário para acomodar a diferença de gênero gramatical entre o hebraico שִׂמְחָה e o português “alegria”.
