  text: אֵ֣ין אָדָ֞ם שַׁלִּ֤יט בָּ/ר֨וּחַ֙ לִ/כְל֣וֹא אֶת הָ/ר֔וּחַ וְ/אֵ֤ין שִׁלְטוֹן֙ בְּ/י֣וֹם הַ/מָּ֔וֶת וְ/אֵ֥ין מִשְׁלַ֖חַת בַּ/מִּלְחָמָ֑ה וְ/לֹֽא יְמַלֵּ֥ט רֶ֖שַׁע אֶת בְּעָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/008.yaml
  text: No man has power over the wind to restrain the wind[a], and there is no authority over the day of death, and there is no discharge in war, and wickedness will not deliver its master.
translation:
  language: pt
  text: Ninguém tem poder sobre o vento para contê-lo[a]; ninguém tem autoridade sobre o dia da morte; não há dispensa na guerra, e a maldade não livrará os seus donos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “espírito”: “Ninguém tem poder sobre o espírito para contê-lo”. O hebraico רוּחַ pode significar vento, espírito ou sopro.'
    reason: Leitura alternativa decorrente da polissemia genuína do termo hebraico.
lexical_decisions:
- source_word: אָדָם
  choice: ninguém
  rationale: A construção existencial negativa hebraica expressa uma afirmação universal sobre o ser humano; “ninguém” é natural em português e mantém o alcance genérico.
- source_word: שַׁלִּיט
  choice: tem poder
  rationale: O adjetivo indica domínio ou capacidade de controle; a locução é idiomática e preserva a relação com o vento.
- source_word: רוּחַ
  choice: vento
  rationale: A repetição do termo com o verbo “conter” e a sequência de realidades fora do controle humano favorecem o fenômeno natural; “espírito” continua sendo uma leitura possível e é registrada em nota.
- source_word: לִכְלוֹא
  choice: para contê-lo
  rationale: O verbo significa confinar, deter ou reter. “Conter” combina naturalmente com “vento”; o pronome evita repetição pesada sem apagar o referente.
- source_word: שִׁלְטוֹן
  choice: autoridade
  rationale: O substantivo denota domínio ou poder. “Autoridade sobre” preserva o campo semântico e distingue estilisticamente esta oração da anterior.
- source_word: בְּיוֹם הַמָּוֶת
  choice: sobre o dia da morte
  rationale: Ligada a “autoridade”, a preposição exprime domínio sobre o momento da morte, que permanece fora do controle humano.
- source_word: מִשְׁלַחַת
  choice: dispensa
  rationale: No contexto militar, indica liberação ou dispensa do serviço; “dispensa na guerra” é conciso e compreensível.
- source_word: בַּמִּלְחָמָה
  choice: na guerra
  rationale: Tradução direta da expressão preposicional, com alcance mais amplo que “na batalha”.
- source_word: רֶשַׁע
  choice: maldade
  rationale: Mantém o substantivo abstrato e a força proverbial da personificação, sem convertê-lo em referência direta aos ímpios.
- source_word: יְמַלֵּט
  choice: não livrará
  rationale: O verbo significa fazer escapar ou pôr a salvo. “Livrar” é digno e corrente, sem acrescentar uma conotação soteriológica específica.
- source_word: בְּעָלָיו
  choice: quem a pratica
  rationale: Literalmente “seus donos/senhores”. A expressão portuguesa explicita de modo natural a relação idiomática entre a maldade e a pessoa que se entrega a ela, evitando a formulação pouco clara “seu dono”.
theological_decisions:
- issue: Sentido de רוּחַ na oração inicial
  choice: vento
  alternative: 'espírito ou sopro: “Ninguém tem poder sobre o espírito para contê-lo”'
  rationale: O verbo “conter” e a série formada por vento, morte e guerra favorecem “vento”. Como רוּחַ também pode designar espírito ou sopro vital, a ambiguidade genuína é preservada em nota.
- issue: Relação expressa por בְּעָלָיו
  choice: quem pratica a maldade
  alternative: seu dono ou senhor
  rationale: O hebraico personifica a maldade como algo que possui adeptos ou senhores. A tradução funcional mantém a referência à pessoa ligada à maldade sem sugerir uma doutrina específica sobre possessão ou agência moral.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura paralela do hebraico foi mantida por orações coordenadas e pontuação semipesada; evitou-se linguagem excessivamente arcaica ou técnica.
