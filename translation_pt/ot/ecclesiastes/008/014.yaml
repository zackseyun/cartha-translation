  text: יֶשׁ הֶבֶל֮ אֲשֶׁ֣ר נַעֲשָׂ֣ה עַל הָ/אָרֶץ֒ אֲשֶׁ֣ר יֵ֣שׁ צַדִּיקִ֗ים אֲשֶׁ֨ר מַגִּ֤יעַ אֲלֵ/הֶם֙ כְּ/מַעֲשֵׂ֣ה הָ/רְשָׁעִ֔ים וְ/יֵ֣שׁ רְשָׁעִ֔ים שֶׁ/מַּגִּ֥יעַ אֲלֵ/הֶ֖ם כְּ/מַעֲשֵׂ֣ה הַ/צַּדִּיקִ֑ים אָמַ֕רְתִּי שֶׁ/גַּם זֶ֖ה הָֽבֶל־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/014.yaml
  text: 'There is a vanity that is done on the earth: there are righteous people to whom it happens according to the deeds of the wicked[a], and there are wicked people to whom it happens according to the deeds of the righteous. I said that this too is vanity.'
translation:
  language: pt
  text: 'Há uma futilidade[a] que ocorre na terra: há justos a quem cabe o que corresponde às obras dos perversos, e há perversos a quem cabe o que corresponde às obras dos justos. Eu disse que também isto é futilidade.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vaidade” ou “vapor”. O hebraico הֶבֶל é um termo-chave em Eclesiastes para aquilo que é passageiro, difícil de apreender ou frustrantemente incoerente.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶבֶל
  choice: futilidade
  rationale: O termo-chave de Eclesiastes descreve o que é fugaz, elusivo e frustrantemente incoerente. Neste contexto de resultados morais invertidos, “futilidade” comunica a incongruência melhor que o sentido moderno mais comum de “vaidade”, sem reduzir o termo a “falta de sentido”.
- source_word: נַעֲשָׂה
  choice: acontece
  rationale: O nifal de עשה indica aqui algo que ocorre no mundo. “Acontece” é natural em português e evita a rigidez de “é feito”.
- source_word: עַל הָאָרֶץ
  choice: na terra
  rationale: Representa a referência abrangente ao mundo terreno sem importar a fórmula diferente “debaixo do sol” nem restringir o sentido a uma terra específica.
- source_word: צַדִּיקִים
  choice: justos
  rationale: O adjetivo plural substantivado designa pessoas moralmente justas; “justos” é claro, conciso e mantém o contraste sapiencial.
- source_word: מַגִּיעַ אֲלֵהֶם
  choice: a quem sucede
  rationale: Expressa aquilo que sobrevém ou cabe a alguém. A formulação preserva a construção impessoal e o caráter de sorte ou resultado experimentado.
- source_word: כְּמַעֲשֵׂה
  choice: conforme as obras de
  rationale: Mantém a comparação entre o que sobrevém às pessoas e as obras associadas à categoria moral oposta, sem explicitar além do hebraico uma teoria de recompensa.
- source_word: הָרְשָׁעִים / רְשָׁעִים
  choice: os perversos / perversos
  rationale: “Perversos” conserva o contraste ético forte com “justos” e funciona naturalmente como substantivo em português.
- source_word: אָמַרְתִּי
  choice: Eu disse
  rationale: Tradução direta do perfeito de אמר, sem transformar a fala do Mestre em uma conclusão formal não explicitada.
- source_word: שֶׁגַּם זֶה הָבֶל
  choice: que também isso é futilidade
  rationale: Preserva גם e repete de modo consistente o termo programático הֶבֶל, mantendo o efeito de refrão.
theological_decisions:
- issue: Sentido de הֶבֶל em Eclesiastes
  choice: futilidade
  alternative: vaidade; vapor; absurdo; falta de sentido
  rationale: “Futilidade” conserva a dimensão de frustração e incongruência que domina este versículo. “Vaidade” tem valor tradicional, mas no português atual sugere facilmente presunção pessoal; “vapor” retém a imagem concreta, porém seria pouco natural na primeira oração; “falta de sentido” resolveria em excesso a amplitude do termo.
- issue: Relação entre obras e destino moral
  choice: “sucede conforme as obras”
  alternative: “recebem o que mereceriam pelas obras”
  rationale: A tradução mantém a comparação do hebraico sem afirmar explicitamente que o destino descrito é uma recompensa merecida. Assim, preserva-se a tensão do texto diante da aparente inversão entre justiça moral e experiência terrena.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe levemente sapiencial. “Na terra” e “acontece” favorecem naturalidade; “a quem sucede conforme as obras” mantém a concisão e a ambiguidade do hebraico. O marcador [a] aparece imediatamente após a primeira ocorrência do termo explicado.
