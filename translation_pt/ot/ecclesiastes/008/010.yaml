  text: וּ/בְ/כֵ֡ן רָאִיתִי֩ רְשָׁעִ֨ים קְבֻרִ֜ים וָ/בָ֗אוּ וּ/מִ/מְּק֤וֹם קָדוֹשׁ֙ יְהַלֵּ֔כוּ וְ/יִֽשְׁתַּכְּח֥וּ בָ/עִ֖יר אֲשֶׁ֣ר כֵּן עָשׂ֑וּ גַּם זֶ֖ה הָֽבֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/010.yaml
  text: And so I saw the wicked buried[a]; they had come and gone from the holy place, and they were forgotten in the city where they had done so[c][b]. This too is vanity.
translation:
  language: pt
  text: E assim vi os perversos serem sepultados; eles haviam vindo e saído do lugar santo[b] e eram esquecidos na cidade onde haviam agido assim.[a] Também isso é vaidade[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conforme algumas versões antigas e outra compreensão do hebraico: “e eram elogiados na cidade onde haviam agido assim”.'
    reason: textual_variant
  - marker: b
    text: “Lugar santo” pode referir-se ao recinto do templo ou a outro local sagrado.
    reason: cultural_note
  - marker: c
    text: Hebraico hével, frequentemente traduzido por “vaidade”; também pode significar “vapor” ou “sopro”, sugerindo algo passageiro, evasivo ou ilusório.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכֵן
  choice: E assim
  rationale: Mantém tanto a ligação com o contexto anterior quanto o valor conclusivo ou inferencial da expressão.
- source_word: רָאִיתִי רְשָׁעִים קְבֻרִים
  choice: vi os perversos serem sepultados
  rationale: Reproduz naturalmente em português a construção com o particípio passivo e mantém a categoria moral de רְשָׁעִים.
- source_word: וָבָאוּ ... יְהַלֵּכוּ
  choice: eles vinham e saíam
  rationale: Expressa o movimento associado ao lugar santo sem restringi-lo a um único episódio; evita a expressão idiomática portuguesa “iam e vinham”, cuja ordem inverteria a sequência verbal hebraica.
- source_word: מִמְּקוֹם קָדוֹשׁ
  choice: do lugar santo
  rationale: Preserva a formulação ampla do hebraico sem identificar de modo indevido o local especificamente como o templo ou o santuário.
- source_word: וְיִשְׁתַּכְּחוּ
  choice: eram esquecidos
  rationale: Segue a leitura direta do texto consonantal a partir de שכח, “esquecer”; a leitura antiga alternativa, “eram elogiados”, é registrada em nota.
- source_word: בָעִיר אֲשֶׁר כֵּן עָשׂוּ
  choice: na cidade onde haviam agido daquele modo
  rationale: Conserva a referência anafórica e deliberadamente pouco específica de כֵּן, sem determinar além do texto em que consistia a conduta.
- source_word: גַּם זֶה הָבֶל
  choice: Também isso é absurdo
  rationale: No contexto, הֶבֶל caracteriza a situação como desconcertante, incongruente e sem sentido. “Absurdo” comunica essa função em português atual, enquanto a nota preserva a imagem literal de vapor e a tradução tradicional.
theological_decisions:
- issue: Sentido da cláusula difícil sobre os perversos e o lugar santo
  choice: O texto descreve perversos que frequentavam o lugar santo, depois foram sepultados e esquecidos na cidade de sua atuação.
  alternative: A cláusula pode ser entendida como dizendo que eles foram elogiados na cidade, conforme algumas versões antigas e outra compreensão do hebraico.
  rationale: A sintaxe e a transmissão textual são difíceis. O texto principal segue a leitura massorética mais direta, e a nota preserva a alternativa antiga sem atribuir aos perversos uma hipocrisia religiosa que o verso não declara explicitamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação mantém a concisão e a ambiguidade do hebraico, sem identificar com certeza o “lugar santo” nem especificar a conduta referida por “daquele modo”.
