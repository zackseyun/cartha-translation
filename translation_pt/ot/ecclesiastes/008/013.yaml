base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/013.yaml
  text: But it will not go well for the wicked[a], and he will not prolong his days like a shadow[b], because he does not fear before God.
translation:
  language: pt
  text: Mas não irá bem para o perverso, nem ele prolongará os seus dias como a sombra, porque não teme diante de Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְטוֹב לֹא יִהְיֶה לָרָשָׁע
  choice: Mas não irá bem para o perverso
  rationale: A construção com טוֹב e היה indica bem-estar ou um desfecho favorável. “Mas” explicita o contraste com o versículo anterior, e “perverso” expressa a categoria moral de רָשָׁע sem restringi-la à culpa jurídica.
- source_word: וְלֹא יַאֲרִיךְ יָמִים
  choice: nem ele prolongará os seus dias
  rationale: Mantém a imagem hebraica de “prolongar dias” e usa “nem” para ligar naturalmente as duas negativas em português.
- source_word: כַּצֵּל
  choice: como a sombra
  rationale: Conserva a comparação compacta e sua evocação de transitoriedade, sem explicar no corpo do texto de que modo a sombra serve de comparação.
- source_word: אֲשֶׁר
  choice: porque
  rationale: Neste contexto, introduz naturalmente a causa do destino descrito, embora sua forma também possa funcionar como relativo.
- source_word: אֵינֶנּוּ יָרֵא מִלִּפְנֵי אֱלֹהִים
  choice: não teme diante de Deus
  rationale: “Temer” preserva a linguagem bíblica de reverência, e “diante de Deus” reproduz de modo idiomático a noção de estar perante sua presença.
theological_decisions:
- issue: Natureza da retribuição divina na literatura sapiencial
  choice: Manter a afirmação de que o perverso não terá um desfecho favorável e não prolongará seus dias, sem acrescentar qualificações.
  alternative: Transformar a frase numa garantia explícita de morte prematura para todo perverso ou enfraquecê-la como mera impressão existencial.
  rationale: Eclesiastes sustenta a tensão entre a ordem moral afirmada e as complexidades observadas na vida. A tradução conserva a força proverbial do texto sem sistematizá-la além do que ele diz.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A formulação preserva o paralelismo, a metáfora da sombra e a tensão sapiencial do hebraico.
