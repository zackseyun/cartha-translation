  text: שׁוֹמֵ֣ר מִצְוָ֔ה לֹ֥א יֵדַ֖ע דָּבָ֣ר רָ֑ע וְ/עֵ֣ת וּ/מִשְׁפָּ֔ט יֵדַ֖ע לֵ֥ב חָכָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/005.yaml
  text: Whoever keeps a command will not know an evil thing[b][a], and a wise heart knows the proper time and judgment.
translation:
  language: pt
  text: Quem guarda uma ordem não conhecerá coisa má[a], e o coração sábio conhece o tempo oportuno e o julgamento[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “não conhecerá coisa má”. A expressão hebraica pode se referir ao mal moral, a algo ruim ou, mais provavelmente neste contexto, a dano ou adversidade.
    reason: lexical_alternative
  - marker: b
    text: Ou “o tempo e o juízo”. “Julgamento” pode se referir à decisão, ao procedimento ou ao curso correto.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹמֵר
  choice: obedece
  rationale: O particípio significa guardar ou observar; em português, “obedecer” expressa de modo natural a observância de uma ordem neste contexto.
- source_word: מִצְוָה
  choice: uma ordem
  rationale: O singular é genérico e, no contexto da autoridade real, “ordem” evita restringir o termo a um mandamento religioso.
- source_word: לֹא יֵדַע דָּבָר רָע
  choice: não sofrerá nenhum mal
  rationale: A formulação comunica o provável sentido experiencial de יָדַע e entende דָּבָר רָע como dano, adversidade ou consequência prejudicial, sem limitar a expressão ao mal moral.
- source_word: וְעֵת
  choice: o tempo certo
  rationale: Na literatura sapiencial, עֵת pode indicar o momento oportuno; “tempo certo” torna essa nuance clara e natural.
- source_word: וּמִשְׁפָּט
  choice: o modo de agir
  rationale: Neste par, מִשְׁפָּט pode designar julgamento, procedimento ou curso correto; “modo de agir” comunica a aplicação prática sem ocultar a alternativa em nota.
- source_word: יֵדַע לֵב חָכָם
  choice: o coração sábio sabe
  rationale: Mantém a imagem hebraica do coração como centro do discernimento e conserva a formulação concisa do original.
theological_decisions:
- issue: Força da promessa em לֹא יֵדַע דָּבָר רָע
  choice: não sofrerá nenhum mal
  alternative: não conhecerá coisa má
  rationale: A leitura experiencial se ajusta ao contexto da obediência à autoridade, mas a nota preserva a formulação mais literal e sua possível referência ao mal moral ou a uma situação ruim.
- issue: Idioma antropológico לֵב חָכָם
  choice: o coração sábio
  alternative: a pessoa sábia
  rationale: Preservar “coração” mantém a antropologia e a imagem sapiencial hebraicas, sem reduzir o discernimento à cognição moderna.
- issue: Referência genérica do particípio masculino singular
  choice: Quem obedece
  alternative: Aquele que guarda
  rationale: “Quem” transmite naturalmente a aplicação genérica do hebraico, sem sugerir que a declaração se limita aos homens.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A tradução conserva “coração sábio”, mas emprega formulações idiomáticas em “obedece a uma ordem” e “modo de agir”. Os marcadores seguem a ordem de ocorrência no texto.
