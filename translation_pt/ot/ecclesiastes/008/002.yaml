  text: אֲנִי֙ פִּי מֶ֣לֶךְ שְׁמ֔וֹר וְ/עַ֕ל דִּבְרַ֖ת שְׁבוּעַ֥ת אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/002.yaml
  text: I say[a], keep the king’s command[c][b], because of your oath before God.
translation:
  language: pt
  text: 'Eu digo: cumpra a ordem do rei[a][b], por causa do juramento feito diante de Deus.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico é muito conciso e sua sintaxe permite outra leitura, como: «Cumpra a ordem do rei e, quanto ao juramento de Deus...»'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico, literalmente: «a boca do rei».'
    reason: lexical_alternative
  - marker: c
    text: «Juramento feito diante de Deus» também pode ser entendido como «juramento feito a Deus» ou «juramento de Deus».
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנִי
  choice: Eu digo
  rationale: O hebraico começa abruptamente com o pronome independente «eu» e deixa o verbo subentendido. «Eu digo» supre apenas o necessário para uma frase portuguesa clara, sem ocultar a concisão do original, indicada em nota.
- source_word: פִּי מֶלֶךְ
  choice: a ordem do rei
  rationale: Literalmente, «a boca de um rei». No contexto, a expressão designa aquilo que o rei diz com autoridade; «a ordem do rei» comunica esse valor idiomático em português natural.
- source_word: שְׁמֹר
  choice: cumpra
  rationale: O verbo pode significar guardar, observar ou cumprir. Com «ordem», «cumpra» expressa naturalmente a obediência requerida e preserva o valor imperativo.
- source_word: וְעַל דִּבְרַת
  choice: por causa de
  rationale: A sequência hebraica é comprimida e pode introduzir fundamento, motivo ou assunto. «Por causa de» apresenta a leitura causal mais provável, enquanto a nota registra a possibilidade de outra ligação sintática.
- source_word: שְׁבוּעַת אֱלֹהִים
  choice: o juramento feito diante de Deus
  rationale: A cadeia construta admite mais de uma relação entre o juramento e Deus. No contexto, a formulação escolhida entende Deus como testemunha do juramento, sem deixar de registrar em nota as alternativas «a Deus» e «de Deus».
theological_decisions:
- issue: Relação de שְׁבוּעַת אֱלֹהִים com a obediência ao rei
  choice: Um juramento prestado pelo ouvinte diante de Deus fundamenta o cumprimento da ordem real.
  alternative: O juramento pode ser feito a Deus ou ser entendido como um juramento de Deus.
  rationale: A leitura escolhida se ajusta ao imperativo dirigido ao ouvinte e mantém unidas a obrigação política e a responsabilidade religiosa. A nota preserva a ambiguidade e evita transformar o versículo numa afirmação explícita de obediência real incondicional.
translation_notes:
  register: Português atual, claro e digno, com construção imperativa natural e compreensível tanto no Brasil quanto em outros contextos lusófonos. A tradução explicita minimamente o verbo elíptico após «eu» e conserva em notas a sintaxe comprimida e a ambiguidade do vínculo entre Deus e o juramento.
