  text: בַּ/אֲשֶׁ֥ר דְּבַר מֶ֖לֶךְ שִׁלְט֑וֹן וּ/מִ֥י יֹֽאמַר ל֖/וֹ מַֽה תַּעֲשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/004.yaml
  text: For the word of a king is authority[a], and who may say to him, “What are you doing?”
translation:
  language: pt
  text: 'Pois a palavra de um rei tem autoridade[a], e quem pode lhe dizer: “O que você está fazendo?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois onde está a palavra do rei, ali há autoridade.” O início da frase hebraica pode ser entendido mais literalmente dessa maneira.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּאֲשֶׁר
  choice: Pois
  rationale: O composto introduz a razão da exortação anterior. “Pois” expressa com naturalidade essa função explicativa, sem eliminar a construção locativa possível, registrada em nota.
- source_word: דְּבַר
  choice: a palavra
  rationale: Preserva o sentido comum de דָּבָר e a expressão hebraica, enquanto o contexto real e o predicado deixam claro que se trata de uma palavra dotada de força vinculante.
- source_word: מֶלֶךְ
  choice: de um rei
  rationale: Como o substantivo hebraico não tem artigo, a forma indefinida preserva o caráter geral e proverbial da afirmação.
- source_word: שִׁלְטוֹן
  choice: tem autoridade
  rationale: O substantivo indica poder governante ou autoridade. Em português, “tem autoridade” é mais natural que “é autoridade” e comunica que a palavra real possui força efetiva.
- source_word: וּמִי
  choice: e quem
  rationale: Reproduz de modo direto a conjunção e o interrogativo, mantendo a força retórica da pergunta.
- source_word: יֹאמַר לוֹ
  choice: pode lhe dizer
  rationale: O imperfeito, na pergunta retórica, expressa possibilidade ou capacidade de contestar o rei. “Pode” é corrente e natural em português.
- source_word: מַה תַּעֲשֶׂה
  choice: O que você está fazendo?
  rationale: A forma progressiva comunica naturalmente em português o desafio direto às ações do rei.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Você” torna a fala direta idiomática sem introduzir tratamento honorífico ausente do hebraico. A nota preserva a ambiguidade sintática de בַּאֲשֶׁר.
