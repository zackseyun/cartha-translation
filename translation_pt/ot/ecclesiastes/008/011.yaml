  naturalness: O texto é claro e de registro apropriado. «Aplicada rapidamente» é uma combinação mais natural e menos potencialmente ambígua do que «executada depressa» para uma sentença judicial em português contemporâneo.
  terminology: «Sentença», «ação má», «coração», «filhos do homem» e «mal» são escolhas defensáveis e coerentes com o original. A nota sobre «filhos do homem» esclarece corretamente o alcance genérico da expressão.
