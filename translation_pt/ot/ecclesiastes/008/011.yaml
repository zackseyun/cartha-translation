id: ECC.8.11
reference: Ecclesiastes 8:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֲשֶׁר֙ אֵין נַעֲשָׂ֣ה פִתְגָ֔ם מַעֲשֵׂ֥ה הָ/רָעָ֖ה מְהֵרָ֑ה עַל כֵּ֡ן מָלֵ֞א לֵ֧ב בְּֽנֵי הָ/אָדָ֛ם בָּ/הֶ֖ם לַ/עֲשׂ֥וֹת רָֽע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/011.yaml
  text: Because the sentence against an evil deed is not carried out quickly[b][a], therefore the heart of the sons of man is fully set in them to do evil.
translation:
  language: pt
  text: Porque a sentença contra uma ação má não é aplicada rapidamente, por isso o coração dos filhos do homem[a] está plenamente disposto a praticar o mal.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, os seres humanos em geral; também se poderia traduzir por “os filhos da humanidade”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente que o coração está “cheio” neles para praticar o mal, indicando uma disposição plenamente formada ou uma resolução firme.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִתְגָם
  choice: sentença
  rationale: Neste contexto, designa um pronunciamento judicial referente a uma ação má; “sentença” expressa com clareza esse sentido oficial.
- source_word: מַעֲשֵׂה הָרָעָה
  choice: uma ação má
  rationale: A construção significa literalmente “ação do mal” e se refere, no singular genérico, a uma ação moralmente má.
- source_word: אֵין נַעֲשָׂה ... מְהֵרָה
  choice: não é executada depressa
  rationale: O passivo de עשה indica aqui a aplicação da sentença, não apenas que algo é feito; “executada depressa” comunica a demora da justiça em português atual.
- source_word: עַל־כֵּן
  choice: por isso, expresso pela relação causal da frase
  rationale: A construção marca a consequência da demora em executar a sentença. Em português, a oração inicial com “Porque” seguida da oração principal preserva essa relação sem exigir a repetição de “por isso”.
- source_word: לֵב
  choice: coração
  rationale: Mantém a imagem hebraica do centro interior da vontade e das decisões.
- source_word: בְּנֵי הָאָדָם
  choice: os filhos do homem
  rationale: Preserva a forma masculina representativa da expressão hebraica, que neste contexto se refere genericamente à humanidade.
- source_word: מָלֵא ... לַעֲשׂוֹת רָע
  choice: fica inteiramente inclinado a praticar o mal
  rationale: 'Traduz o valor idiomático de um coração “cheio” para fazer o mal: uma disposição fortalecida e resoluta, sem tornar a frase artificial em português.'
- source_word: רָע
  choice: o mal
  rationale: Preserva a força moral do termo e sua ligação lexical com a ação má mencionada no início do versículo.
theological_decisions:
- issue: Sentido genérico de בְּנֵי הָאָדָם
  choice: os filhos do homem
  alternative: os seres humanos; a humanidade
  rationale: A expressão abrange a humanidade em geral, mas a tradução conserva sua forma masculina representativa e esclarece o alcance genérico em nota.
- issue: Efeito moral da demora da justiça
  choice: fica inteiramente inclinado a praticar o mal
  alternative: fica cheio para praticar o mal; ganha coragem para praticar o mal
  rationale: O texto afirma que a demora da sentença fortalece a disposição humana para o mal. A formulação mantém essa relação sem especificar além do hebraico se se trata de determinação, ousadia ou desejo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A estrutura causal foi mantida de modo natural; “depressa” evita solenidade excessiva, e “praticar o mal” conserva o teor moral do original.
