base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/001.yaml
  text: Who is like the wise man[a], and who knows the interpretation of a matter? A man's wisdom lights up his face[b], and the hardness of his face is changed.
translation:
  language: pt
  text: Quem é como o sábio, e quem conhece a interpretação de uma questão? A sabedoria de uma pessoa ilumina seu rosto, e a dureza de seu rosto é alterada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a firmeza de seu rosto é alterada” ou “a severidade de seu rosto é alterada”. A expressão hebraica pode referir-se à força, à dureza ou à severidade visível no rosto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי כְּהֶחָכָם
  choice: Quem é como o sábio
  rationale: Preserva a pergunta retórica e a comparação marcada por כְּ, mantendo o singular representativo de הֶחָכָם em português natural.
- source_word: יוֹדֵעַ פֵּשֶׁר דָּבָר
  choice: conhece a interpretação de uma questão
  rationale: “Conhece” traduz diretamente יוֹדֵעַ; “interpretação” conserva o sentido de פֵּשֶׁר, e “questão” expressa o amplo דָּבָר de modo idiomático neste contexto sapiencial.
- source_word: חָכְמַת אָדָם
  choice: A sabedoria de uma pessoa
  rationale: אָדָם é singular e genérico. “Uma pessoa” preserva essa referência individual e universal sem sugerir que o provérbio se limite ao sexo masculino.
- source_word: תָּאִיר פָּנָיו
  choice: ilumina seu rosto
  rationale: O hifil de אור comunica fazer brilhar ou iluminar; a formulação portuguesa é direta e conserva a imagem facial.
- source_word: עֹז פָּנָיו
  choice: a dureza de sua expressão
  rationale: Embora עֹז signifique literalmente força, junto de “rosto” pode designar uma aparência dura, severa ou impassível. “Expressão” torna o idioma inteligível sem eliminar a imagem do rosto já presente na oração anterior.
- source_word: יְשֻׁנֶּא
  choice: se transforma
  rationale: Expressa o valor passivo/reflexivo de שנה, “ser mudado”, em português natural; a nota registra a alternativa mais formal.
theological_decisions:
- issue: Sentido genérico de אָדָם em uma máxima sapiencial
  choice: uma pessoa
  alternative: um homem; o ser humano
  rationale: O substantivo é singular genérico, não uma afirmação especificamente masculina. “Uma pessoa” mantém a referência singular e comunica naturalmente a abrangência humana em português atual.
- issue: Efeito da sabedoria sobre עֹז פָּנָיו
  choice: a dureza de sua expressão se transforma
  alternative: a firmeza de seu rosto é mudada; a severidade de sua expressão muda
  rationale: A construção hebraica é ambígua e pode indicar força, dureza, ousadia ou severidade facial. O contexto favorece uma alteração visível da expressão pela sabedoria, mas a nota preserva as alternativas legítimas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva o paralelismo e a metáfora facial, evitando o arcaísmo “semblante”. O marcador [a] aparece no texto principal e documenta a ambiguidade real de עֹז פָּנָיו e יְשֻׁנֶּא.
