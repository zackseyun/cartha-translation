source:
  edition: WLC
  text: אֲשֶׁ֣ר חֹטֶ֗א עֹשֶׂ֥ה רָ֛ע מְאַ֖ת וּ/מַאֲרִ֣יךְ ל֑/וֹ כִּ֚י גַּם יוֹדֵ֣עַ אָ֔נִי אֲשֶׁ֤ר יִהְיֶה טּוֹב֙ לְ/יִרְאֵ֣י הָ/אֱלֹהִ֔ים אֲשֶׁ֥ר יִֽירְא֖וּ מִ/לְּ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/012.yaml
  text: Though a sinner does evil a hundred times and prolongs his life[a], yet I also know that it will be well for those who fear God[b], who fear before him.
translation:
  language: pt
  text: Embora o pecador faça o mal cem vezes e prolongue a própria vida[a], ainda assim sei também que será bom para os que temem a Deus[b], os que temem diante dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e viva muito tempo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que irá bem para os que temem a Deus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: Embora
  rationale: No contexto, introduz uma oração concessiva; “Embora” expressa naturalmente essa relação em português.
- source_word: חֹטֶא
  choice: o pecador
  rationale: O particípio substantivado designa a pessoa caracterizada pelo pecado; o singular foi preservado.
- source_word: עֹשֶׂה רָע
  choice: faça o mal
  rationale: Mantém o sentido verbal concreto e soa natural na oração concessiva.
- source_word: מְאַת
  choice: cem vezes
  rationale: Conserva a força numérica do hebraico, entendida adverbialmente como repetição do mal.
- source_word: וּמַאֲרִיךְ לוֹ
  choice: e prolongue a própria vida
  rationale: Torna inteligível o idioma de “alongar para si”, sem perder sua ligação com o verbo hebraico; a alternativa “viva muito tempo” é registrada em nota.
- source_word: כִּי גַּם
  choice: ainda assim
  rationale: Expressa o contraste contextual com a concessiva precedente. O valor enfático é comunicado pelo conjunto “ainda assim sei” sem uma adição portuguesa artificial.
- source_word: יוֹדֵעַ אָנִי
  choice: sei
  rationale: A primeira pessoa já está marcada no verbo português; a forma simples preserva a afirmação enfática no fluxo natural da frase.
- source_word: אֲשֶׁר יִהְיֶה טּוֹב
  choice: que tudo irá bem
  rationale: Comunica idiomaticamente que as coisas acabarão bem para essas pessoas, preservando a orientação futura; “que haverá bem” permanece como possibilidade mais literal.
- source_word: לְיִרְאֵי הָאֱלֹהִים
  choice: para os que temem a Deus
  rationale: Reproduz com clareza o particípio substantivado e conserva o sentido reverencial do verbo “temer”.
- source_word: אֲשֶׁר יִירְאוּ מִלְּפָנָיו
  choice: os que temem diante dele
  rationale: Preserva a repetição deliberada da raiz “temer” e a imagem espacial/reverencial de estar diante de Deus.
theological_decisions:
- issue: Referente do sufixo pronominal em מִלְּפָנָיו
  choice: “diante dele”, com referência a Deus
  alternative: “diante de Deus”
  rationale: Deus é o antecedente imediato e natural. O pronome preserva a coesão do hebraico sem inserir repetição desnecessária.
- issue: Natureza do bem prometido aos que temem a Deus
  choice: “tudo irá bem”, sem especificar quando ou de que modo
  alternative: “haverá bem” ou “será bom”
  rationale: O texto afirma o resultado favorável, mas não define se é temporal, final ou escatológico; a tradução evita resolver essa tensão.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A repetição de “temem” foi mantida por refletir a ênfase do hebraico; “diante dele” conserva a nuance da presença divina.
