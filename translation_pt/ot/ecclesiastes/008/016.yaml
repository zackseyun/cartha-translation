base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/016.yaml
  text: When I applied my heart to know wisdom and to observe the activity that is done on the earth—for even by day and by night his eyes do not see sleep—[a]
translation:
  language: pt
  text: Quando dediquei meu coração a conhecer a sabedoria e a observar a atividade que se realiza sobre a terra, pois, mesmo de dia e de noite, seus olhos não veem o sono[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “ele não dorme nem de dia nem de noite”. O texto principal preserva a imagem hebraica, literalmente: “seus olhos não veem o sono”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Quando
  rationale: Introduz a circunstância temporal da investigação do autor e é natural em português.
- source_word: נָתַתִּי אֶת־לִבִּי
  choice: dediquei meu coração
  rationale: Expressa concentração deliberada, preservando a imagem antropológica hebraica do coração.
- source_word: לָדַעַת חָכְמָה
  choice: a conhecer a sabedoria
  rationale: Reproduz de perto a construção infinitiva e mantém o vínculo lexical com ידע.
- source_word: וְלִרְאוֹת
  choice: e a observar
  rationale: Comunica o sentido contextual de exame atento sem se afastar da imagem de ver.
- source_word: הָעִנְיָן
  choice: a atividade
  rationale: Neste contexto, refere-se à ocupação ou atividade humana; a escolha é ampla, atual e não excessivamente comercial.
- source_word: אֲשֶׁר נַעֲשָׂה עַל־הָאָרֶץ
  choice: que se realiza sobre a terra
  rationale: Preserva a construção passiva/reflexiva e o âmbito terrestre geral do texto.
- source_word: כִּי גַם
  choice: pois, tanto
  rationale: ‘Pois’ conserva a função explicativa de כִּי, enquanto a construção ‘tanto... como...’ exprime de modo natural a abrangência enfática associada a גַם.
- source_word: בַּיּוֹם וּבַלַּיְלָה
  choice: de dia como de noite
  rationale: Forma portuguesa idiomática para duração contínua, integrada à correlação ‘tanto... como...’.
- source_word: שֵׁנָה בְּעֵינָיו אֵינֶנּוּ רֹאֶה
  choice: seus olhos não veem o sono
  rationale: Mantém a imagem vívida e incomum do hebraico, em vez de reduzi-la simplesmente a ‘não dorme’.
theological_decisions:
- issue: Referente do sufixo masculino singular em בְּעֵינָיו (‘seus olhos’)
  choice: Manter a terceira pessoa do singular sem identificar explicitamente o referente
  alternative: Interpretar como referência ao próprio Qohelet (‘meus olhos’) ou generalizar como ‘ninguém dorme’
  rationale: O texto massorético traz sufixo de terceira pessoa masculina singular. Preservar ‘seus’ mantém a ambiguidade textual e evita emenda ou interpretação não exigida pela fonte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção preserva a metáfora do coração e a imagem deliberadamente incomum dos olhos que não veem o sono. A vírgula após o travessão final sinaliza que o versículo continua sintaticamente no seguinte.
