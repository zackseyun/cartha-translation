  text: כִּֽי אֵינֶ֥/נּוּ יֹדֵ֖עַ מַה שֶּׁ/יִּֽהְיֶ֑ה כִּ֚י כַּ/אֲשֶׁ֣ר יִֽהְיֶ֔ה מִ֖י יַגִּ֥יד לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/007.yaml
  text: For he does not know what will be, for who can tell him how it will be?
translation:
  language: pt
  text: Pois ele não sabe o que acontecerá, pois quem poderá lhe dizer como será?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando acontecerá?”; ou, em sentido mais geral, “o que acontecerá?”. A expressão hebraica pode indicar como ou quando algo ocorrerá.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz uma explicação ligada ao versículo anterior e mantém a concisão do hebraico.
- source_word: אֵינֶנּוּ יֹדֵעַ
  choice: ele não sabe
  rationale: Preserva a negação com o referente masculino singular e expressa naturalmente a ignorância humana quanto ao futuro.
- source_word: מַה שֶּׁיִּהְיֶה
  choice: o que acontecerá
  rationale: Comunica em português corrente a ideia de “o que será”, sem perder a referência ao futuro.
- source_word: כִּי
  choice: pois
  rationale: Mantém a relação explicativa da segunda oração e o paralelismo conciso do texto.
- source_word: כַּאֲשֶׁר יִהְיֶה
  choice: como será
  rationale: Conserva a possível progressão entre não saber o que acontecerá e não poder saber como se dará; a expressão hebraica admite outras compreensões, registradas em nota.
- source_word: מִי יַגִּיד לוֹ
  choice: quem poderá lhe dizer
  rationale: A pergunta retórica implica incapacidade de informar; “poderá” torna essa força clara em português, enquanto “lhe dizer” traduz de modo natural o hifil de נגד com o pronome dativo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível ao público brasileiro. A repetição de “pois” preserva a estrutura explicativa do hebraico; “como será” mantém a ambiguidade relevante sem impor uma interpretação exclusivamente temporal.
