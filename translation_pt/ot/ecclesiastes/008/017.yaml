source:
  edition: WLC
  text: וְ/רָאִיתִי֮ אֶת כָּל מַעֲשֵׂ֣ה הָ/אֱלֹהִים֒ כִּי֩ לֹ֨א יוּכַ֜ל הָ/אָדָ֗ם לִ/מְצוֹא֙ אֶת הַֽ/מַּעֲשֶׂה֙ אֲשֶׁ֣ר נַעֲשָׂ֣ה תַֽחַת הַ/שֶּׁ֔מֶשׁ בְּ֠/שֶׁ/ל אֲשֶׁ֨ר יַעֲמֹ֧ל הָ/אָדָ֛ם לְ/בַקֵּ֖שׁ וְ/לֹ֣א יִמְצָ֑א וְ/גַ֨ם אִם יֹאמַ֤ר הֶֽ/חָכָם֙ לָ/דַ֔עַת לֹ֥א יוּכַ֖ל לִ/מְצֹֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/017.yaml
  text: 'Then I saw all the work of God: that man cannot find out the work that is done under the sun[a]. However much man labors to seek it out, he will not find it; and even if the wise man says he knows[b], he cannot find it out.'
translation:
  language: pt
  text: 'Então vi toda a obra de Deus: o ser humano[a] não consegue descobrir a obra que se realiza debaixo do sol. Por mais que o ser humano se esforce para investigá-la, não a descobrirá; e, mesmo que o sábio diga que sabe[b], não conseguirá descobri-la.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o homem”; o singular é usado de modo genérico para a humanidade.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “afirme saber”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתִי
  choice: Então vi
  rationale: O waw seguido do perfeito dá continuidade à reflexão e pode ter valor consequencial. “Então vi” é natural em português e preserva o tom de observação do autor.
- source_word: מַעֲשֵׂה הָאֱלֹהִים
  choice: toda a obra de Deus
  rationale: מַעֲשֶׂה abrange obra, feito ou atividade. “Obra de Deus” é idiomático e mantém a ligação lexical com הַמַּעֲשֶׂה na oração seguinte.
- source_word: הָאָדָם
  choice: o ser humano
  rationale: O substantivo singular definido tem sentido genérico, referindo-se à humanidade. “O ser humano” conserva o singular representativo sem sugerir que a afirmação se limite aos homens do sexo masculino.
- source_word: לִמְצוֹא / יִמְצָא / לִמְצֹא
  choice: descobrir / descobrirá / descobri-la
  rationale: Neste contexto de investigação intelectual, מצא significa chegar a descobrir ou apreender algo. A repetição de “descobrir” preserva a recorrência enfática do mesmo verbo hebraico.
- source_word: הַמַּעֲשֶׂה אֲשֶׁר נַעֲשָׂה תַחַת הַשֶּׁמֶשׁ
  choice: a obra que se realiza debaixo do sol
  rationale: A formulação mantém o substantivo “obra”, a ideia passiva do que é realizado e a expressão temática de Eclesiastes “debaixo do sol”.
- source_word: בְּשֶׁל אֲשֶׁר יַעֲמֹל הָאָדָם לְבַקֵּשׁ
  choice: Por mais que o ser humano se esforce para investigá-la
  rationale: A construção exprime esforço persistente que não alcança o resultado desejado. “Por mais que” comunica esse valor concessivo, enquanto “se esforce” reflete o labor penoso de עמל e “investigá-la” o propósito de בקש.
- source_word: וְגַם אִם יֹאמַר הֶחָכָם לָדַעַת
  choice: e, mesmo que o sábio diga que sabe
  rationale: A construção é elíptica e admite a ideia de dizer que se sabe ou afirmar saber. A tradução principal preserva sua forma relativamente direta, sem transformar silenciosamente a fala em uma alegação desacreditada.
theological_decisions:
- issue: Sentido genérico de הָאָדָם na afirmação sobre a limitação humana
  choice: o ser humano
  alternative: o homem
  rationale: O referente é a humanidade em geral, e não especificamente uma pessoa do sexo masculino. “O ser humano” comunica esse alcance em português atual, enquanto a nota registra a forma singular literal do hebraico.
- issue: Natureza da declaração do sábio em יֹאמַר ... לָדַעַת
  choice: diga que sabe
  alternative: afirme saber
  rationale: O texto pode indicar simplesmente que o sábio diz saber ou, com maior ênfase pragmática, que alega saber. A tradução principal evita atribuir de modo indevido um tom de presunção, e a alternativa é preservada em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Conservam-se a expressão característica “debaixo do sol”, a repetição de “obra” e a tríplice recorrência de “descobrir”. A sintaxe foi levemente ajustada para fluência sem eliminar a tensão entre o esforço humano, a pretensão do sábio e a impossibilidade de sondar plenamente a obra de Deus.
