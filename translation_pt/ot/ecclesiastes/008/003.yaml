  text: אַל תִּבָּהֵ֤ל מִ/פָּנָי/ו֙ תֵּלֵ֔ךְ אַֽל תַּעֲמֹ֖ד בְּ/דָבָ֣ר רָ֑ע כִּ֛י כָּל אֲשֶׁ֥ר יַחְפֹּ֖ץ יַעֲשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/003.yaml
  text: Do not be hasty to leave his presence[a]. Do not take your stand in an evil matter[b], for he does whatever he pleases.
translation:
  language: pt
  text: Não se apresse em sair da presença dele.[a] Não se mantenha em algo mau,[b] pois ele faz tudo o que deseja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não fique alarmado e saia da presença dele”. O verbo hebraico pode indicar agitação ou alarme, além de pressa precipitada.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Não tome posição numa causa má” ou “Não persista em algo mau”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּבָּהֵל
  choice: se apresse
  rationale: O verbo בהל pode indicar perturbação ou ação precipitada. Neste contexto, ligado a sair da presença do rei, a expressão comunica sobretudo uma partida apressada, sem excluir totalmente a ideia de agitação, registrada em nota.
- source_word: מִפָּנָיו תֵּלֵךְ
  choice: sair da presença dele
  rationale: A construção significa literalmente ir de diante dele. A formulação escolhida é natural em português e preserva o cenário de audiência diante do rei.
- source_word: תַּעֲמֹד
  choice: tome posição
  rationale: עמד pode expressar assumir ou manter uma posição, e não apenas ficar fisicamente em pé. A escolha conserva essa dimensão figurada.
- source_word: בְּדָבָר רָע
  choice: numa causa má
  rationale: דבר é amplo e pode designar assunto, causa ou curso de ação. 'Causa má' é clara no contexto, enquanto a nota preserva as possibilidades 'assunto mau' e persistência.
- source_word: כִּי כָּל אֲשֶׁר יַחְפֹּץ יַעֲשֶׂה
  choice: pois ele faz tudo o que deseja
  rationale: A formulação transmite de modo natural a capacidade efetiva do rei de executar a própria vontade, preservando o sentido de חפץ.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente em português a razão das advertências anteriores.
theological_decisions:
- issue: Referente dos pronomes masculinos na terceira pessoa
  choice: Os pronomes são mantidos e entendidos contextualmente como referentes ao rei.
  alternative: Um governante ou autoridade em sentido mais geral.
  rationale: O contexto imediato, especialmente Eclesiastes 8:2 e 8:4, aponta para o rei. A tradução preserva os pronomes do hebraico sem inserir explicitamente 'rei' neste versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o tom de advertência e conserva em notas as ambiguidades lexicais relevantes.
