  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אִ֣ישׁ אֲשֶׁ֣ר יִתֶּן ל֣/וֹ הָ/אֱלֹהִ֡ים עֹשֶׁר֩ וּ/נְכָסִ֨ים וְ/כָב֜וֹד וְֽ/אֵינֶ֨/נּוּ חָסֵ֥ר לְ/נַפְשׁ֣/וֹ מִ/כֹּ֣ל אֲשֶׁר יִתְאַוֶּ֗ה וְ/לֹֽא יַשְׁלִיטֶ֤/נּוּ הָֽ/אֱלֹהִים֙ לֶ/אֱכֹ֣ל מִמֶּ֔/נּוּ כִּ֛י אִ֥ישׁ נָכְרִ֖י יֹֽאכֲלֶ֑/נּוּ זֶ֥ה הֶ֛בֶל וָ/חֳלִ֥י רָ֖ע הֽוּא־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/002.yaml
  text: There is a man to whom God gives riches[a], possessions, and honor, so that he lacks nothing for himself of all that he desires, yet God does not empower him to eat from them, because a foreign man eats them[c][b]. This is vanity and a grievous sickness.
translation:
  language: pt
  text: Há um homem a quem Deus dá riquezas, bens e honra, de modo que não lhe falta nada de tudo o que deseja; contudo, Deus não lhe dá o poder de desfrutar deles[a], pois um estrangeiro desfruta deles. Isso é vapor[b] e uma doença grave[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “comer deles”, expressão concreta que significa usufruir ou beneficiar-se dos bens.'
    reason: lexical_alternative
  - marker: b
    text: Ou “vaidade” ou “futilidade”. O hebraico hével significa literalmente “vapor” e é um termo-chave de Eclesiastes.
    reason: lexical_alternative
  - marker: c
    text: Ou “uma enfermidade penosa”; alguns entendem a expressão de modo mais geral como “um mal grave”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֲשֶׁר
  choice: Há um homem a quem
  rationale: Supre naturalmente a construção existencial implícita e preserva o masculino singular representativo do hebraico.
- source_word: יִתֶּן לוֹ הָאֱלֹהִים
  choice: Deus dá
  rationale: O presente comunica o valor geral ou proverbial do imperfeito nesta observação sapiencial.
- source_word: עֹשֶׁר וּנְכָסִים וְכָבוֹד
  choice: riquezas, bens e honra
  rationale: 'Mantém os três elementos distintos: abundância, propriedades materiais e prestígio social.'
- source_word: וְאֵינֶנּוּ חָסֵר לְנַפְשׁוֹ מִכֹּל אֲשֶׁר יִתְאַוֶּה
  choice: de modo que não lhe falta nada de tudo o que deseja
  rationale: נפשׁ é idiomático para a própria pessoa; a formulação portuguesa evita introduzir uma distinção técnica entre corpo e alma.
- source_word: וְלֹא יַשְׁלִיטֶנּוּ הָאֱלֹהִים
  choice: contudo, Deus não lhe dá o poder
  rationale: Preserva a força causativa de שלט sem recorrer ao menos preciso 'não permite'.
- source_word: לֶאֱכֹל מִמֶּנּוּ
  choice: de desfrutar deles
  rationale: O sentido contextual é usufruir dos bens recebidos; a nota conserva a imagem hebraica concreta de comer.
- source_word: אִישׁ נָכְרִי
  choice: um homem estrangeiro
  rationale: Representa explicitamente os dois termos hebraicos, embora 'um estrangeiro' também seja português idiomático.
- source_word: זֶה הֶבֶל
  choice: Isso é névoa
  rationale: Preserva a imagem concreta e a polissemia do termo-chave hebel — algo fugaz, insubstancial e frustrante — sem reduzi-lo apenas a 'vaidade' ou 'futilidade'.
- source_word: וָחֳלִי רָע
  choice: e uma doença grave
  rationale: Mantém o valor lexical de חֳלִי, 'doença/enfermidade', e entende רָע como qualificativo de gravidade ou caráter penoso.
theological_decisions:
- issue: Sentido de לְנַפְשׁוֹ
  choice: não lhe falta nada
  alternative: não falta nada à sua alma
  rationale: Aqui נפשׁ designa idiomaticamente a pessoa em seus desejos, não necessariamente uma alma imaterial distinta.
- issue: Ação divina em וְלֹא יַשְׁלִיטֶנּוּ
  choice: Deus não lhe dá o poder
  alternative: Deus não lhe permite
  rationale: A opção conserva a causalidade divina expressa pelo hifil sem explicar por que ou por quais meios a pessoa não usufrui dos bens.
- issue: Masculino representativo
  choice: um homem
  alternative: uma pessoa
  rationale: O texto apresenta um homem no singular; preservá-lo mantém a forma do exemplo sapiencial sem afirmar que o princípio se restrinja aos homens.
- issue: Metáfora de חֳלִי
  choice: doença
  alternative: mal
  rationale: A tradução mantém a metáfora patológica do texto e não a reduz à categoria mais genérica de mal.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. A sintaxe conserva a progressão do hebraico; 'bens' evita a tecnicidade de 'ativos', e 'desfrutar' torna explícito o sentido idiomático, enquanto a nota preserva a imagem de comer. Todos os marcadores aparecem no texto principal.
