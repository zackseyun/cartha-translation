  text: Pois há muitas palavras[a] que aumentam a vaidade; que vantagem há para o ser humano?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: muitas coisas; o termo hebraico também pode significar “coisas” ou “assuntos”.'
    reason: Registra a ambiguidade genuína de דְּבָרִים, embora “palavras” seja a leitura preferida no contexto.
lexical_decisions:
- source_word: דְּבָרִים (devarim)
  choice: palavras
  rationale: O termo pode significar “palavras”, “coisas” ou “assuntos”. Neste contexto, “palavras” expressa bem a ideia de discurso multiplicado sem benefício real e está de acordo com a revisão adjudicada, sem esconder a amplitude lexical do hebraico.
- source_word: הֶבֶל (hevel)
  choice: vaidade
  rationale: Mantém o termo temático de Eclesiastes e sua imagem de algo fugaz, vazio ou sem substância, preservando deliberadamente sua amplitude sem reduzi-lo a uma única explicação.
- source_word: מַה־יֹּתֵר לָאָדָם (mah-yoter la’adam)
  choice: que vantagem há para o ser humano?
  rationale: Reproduz a pergunta retórica sobre ganho ou benefício, usando linguagem inclusiva natural sem alterar o referente humano genérico.
theological_decisions:
- issue: Sentido de הֶבֶל no argumento de Eclesiastes
  choice: vaidade
  alternative: absurdo, inutilidade ou vapor
  rationale: “Vaidade” conserva a tensão teológica e literária do termo recorrente, que pode envolver transitoriedade, insubstancialidade e frustração, sem impor uma interpretação única.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação preserva o paralelismo conciso e a pergunta retórica do hebraico.
