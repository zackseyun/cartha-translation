id: ECC.6.10
reference: Ecclesiastes 6:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מַה שֶּֽׁ/הָיָ֗ה כְּבָר֙ נִקְרָ֣א שְׁמ֔/וֹ וְ/נוֹדָ֖ע אֲשֶׁר ה֣וּא אָדָ֑ם וְ/לֹא יוּכַ֣ל לָ/דִ֔ין עִ֥ם ש/התקיף מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/010.yaml
  text: Whatever has come to be has already been named[a], and it is known what man is[b]; and he cannot contend with one stronger than he.
translation:
  language: pt
  text: Tudo o que veio a existir já foi nomeado, e sabe-se o que é o ser humano; ele não pode entrar em disputa com quem é mais forte do que ele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aquele que é mais forte provavelmente é Deus, embora o hebraico não o diga explicitamente.
    reason: alternative_reading
lexical_decisions:
- source_word: מַה שֶּׁהָיָה
  choice: Tudo o que veio a existir
  rationale: Expressa a generalização e o aspecto perfectivo de היה, abrangendo tudo o que passou a existir ou aconteceu, sem restringir o sentido ao que simplesmente existe agora.
- source_word: כְּבָר נִקְרָא שְׁמוֹ
  choice: já foi nomeado
  rationale: Conserva a imagem hebraica da nomeação e comunica de modo natural que a designação já estava estabelecida.
- source_word: וְנוֹדָע אֲשֶׁר הוּא אָדָם
  choice: e sabe-se o que é o ser humano
  rationale: Entende a oração como declaração sobre a condição ou identidade humana. “Ser humano” representa naturalmente o singular coletivo אָדָם em português atual.
- source_word: וְלֹא יוּכַל לָדִין
  choice: ele não pode entrar em disputa
  rationale: דין indica aqui disputar ou contender, sem exigir a ideia mais restrita de um processo judicial. A locução é clara e preserva o caráter adversativo.
- source_word: עִם שֶׁהִתְקִיף מִמֶּנּוּ
  choice: com quem é mais forte do que ele
  rationale: Mantém indefinido o referente da oração relativa, como no hebraico, e preserva a comparação de poder.
theological_decisions:
- issue: Identidade daquele que é mais forte do que o ser humano
  choice: 'Manter o referente implícito: “quem é mais forte do que ele”'
  alternative: Identificar explicitamente o referente como Deus
  rationale: O contexto pode apontar para Deus, mas o hebraico não o nomeia neste versículo. A formulação preserva essa ambiguidade e evita tornar explícita uma identificação apenas implícita.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Entrar em disputa” evita tanto o arcaísmo de “contender” quanto a restrição jurídica de “litigar”.
