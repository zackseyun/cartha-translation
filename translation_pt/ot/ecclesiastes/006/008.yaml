  yaml_path: translation/ot/ecclesiastes/006/008.yaml
  text: For what advantage does the wise man have over the fool? What does the poor man have who knows how to conduct himself before the living?[a]
translation:
  language: pt
  text: Pois que vantagem tem o sábio sobre o tolo? Que tem o pobre que sabe conduzir-se diante dos vivos?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Que tem o pobre que sabe andar diante dos vivos?” Em hebraico, “andar” também pode significar viver ou conduzir-se de determinada maneira.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamentação do pensamento anterior e preserva o encadeamento argumentativo.
- source_word: מַה יּוֹתֵר
  choice: que vantagem tem
  rationale: Expressa a ideia de excedente, ganho ou vantagem, tema recorrente em Eclesiastes.
- source_word: לֶחָכָם
  choice: o sábio
  rationale: Reproduz naturalmente em português o adjetivo masculino singular substantivado.
- source_word: מִן הַכְּסִיל
  choice: sobre o tolo
  rationale: O מִן marca comparação; 'vantagem ... sobre' é uma construção portuguesa clara e natural.
- source_word: מַה לֶּעָנִי
  choice: Que tem o pobre
  rationale: Mantém a formulação elíptica e tersa do hebraico sem inserir explicitamente 'vantagem', embora o paralelismo permita entendê-la.
- source_word: עָנִי
  choice: o pobre
  rationale: O sentido socioeconômico é o mais provável no contexto; a forma substantivada também preserva o masculino singular.
- source_word: יוֹדֵעַ
  choice: sabe
  rationale: Mantém o sentido direto do particípio, cujo conteúdo é especificado pelo infinitivo seguinte.
- source_word: לַהֲלֹךְ
  choice: conduzir-se
  rationale: הלך significa literalmente 'andar', mas pode designar idiomaticamente a maneira de viver ou comportar-se.
- source_word: נֶגֶד הַחַיִּים
  choice: diante dos vivos
  rationale: Preserva a expressão hebraica, provavelmente referente às pessoas vivas ou à sociedade humana, sem resolver além do necessário sua possível amplitude.
