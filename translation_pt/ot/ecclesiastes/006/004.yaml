  text: כִּֽי בַ/הֶ֥בֶל בָּ֖א וּ/בַ/חֹ֣שֶׁךְ יֵלֵ֑ךְ וּ/בַ/חֹ֖שֶׁךְ שְׁמ֥/וֹ יְכֻסֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/004.yaml
  text: For he comes in vanity and goes in darkness[b][a], and in darkness his name is covered.
translation:
  language: pt
  text: Pois ele vem na vaidade[a] e vai para a escuridão; e, na escuridão, seu nome fica encoberto[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na inutilidade” ou “como vapor”. O hebraico הֶבֶל é um termo-chave em Eclesiastes e pode expressar transitoriedade, vazio ou inutilidade.
    reason: lexical_alternative
  - marker: b
    text: A expressão “seu nome fica encoberto” pode indicar que sua identidade ou memória permanece na obscuridade.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da afirmação anterior, preservando a força causal e o fluxo do discurso.
- source_word: הֶבֶל
  choice: vapor
  rationale: Preserva a imagem concreta de algo passageiro e insubstancial, bem como a amplitude temática do termo em Eclesiastes, sem reduzi-lo apenas a inutilidade.
- source_word: בָּא
  choice: vem
  rationale: O presente exprime adequadamente a descrição geral e forma um paralelo natural com “vai”.
- source_word: חֹשֶׁךְ
  choice: escuridão
  rationale: Mantém a repetição retórica do hebraico e permite tanto o sentido imagético quanto as conotações de anonimato e esquecimento.
- source_word: יֵלֵךְ
  choice: vai
  rationale: Conserva a formulação simples do hebraico sem explicitar “morre”, interpretação sugerida pelo contexto, mas não declarada pelo verbo.
- source_word: שְׁמוֹ
  choice: seu nome
  rationale: Mantém a expressão concreta do original; no contexto, ela pode abranger identidade, reputação ou memória.
- source_word: יְכֻסֶּה
  choice: fica encoberto
  rationale: Reproduz a voz passiva e a imagem de algo coberto ou ocultado, em português natural.
theological_decisions:
- issue: Sentido da escuridão e do nome encoberto
  choice: Manter a linguagem figurada sem defini-la como morte ou esquecimento
  alternative: Explicitar que a pessoa morre anônima e não é lembrada
  rationale: O contexto favorece obscuridade e ausência de memória, mas o hebraico preserva uma imagem mais ampla; a tradução não deve resolver essa tensão.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe direta. “Vapor” conserva a metáfora temática de הֶבֶל; “fica encoberto” soa mais natural em português do que uma reprodução rigidamente literal com “é coberto”. Todos os marcadores de nota aparecem no texto.
