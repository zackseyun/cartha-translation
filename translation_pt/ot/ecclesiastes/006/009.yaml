reference: Ecclesiastes 6:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ט֛וֹב מַרְאֵ֥ה עֵינַ֖יִם מֵֽ/הֲלָךְ נָ֑פֶשׁ גַּם זֶ֥ה הֶ֖בֶל וּ/רְע֥וּת רֽוּחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/009.yaml
  text: Better is the sight of the eyes than the wandering of the soul[c][b][a]; this too is vapor and a chasing after wind.
translation:
  language: pt
  text: Melhor é o que os olhos veem[a] do que o vaguear do desejo[b]; também isto é vapor e correr atrás do vento[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a visão dos olhos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “da alma”, “do apetite” ou “do ser”. Aqui, o hebraico néfesh provavelmente se refere ao desejo ou ao ser que deseja, e não especificamente à alma imaterial.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “e esforço para alcançar o vento”; mais literalmente, “e pastorear o vento”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Melhor é
  rationale: Em construção comparativa com מִן, o português idiomático pede “Melhor é”, em vez do literal “Bom é”.
- source_word: מַרְאֵה עֵינַיִם
  choice: o que os olhos veem
  rationale: Expressa naturalmente a ideia concreta de visão ou daquilo que está diante dos olhos, sem perder a imagem hebraica.
- source_word: מֵהֲלָךְ
  choice: o vaguear
  rationale: O substantivo derivado de הלך indica movimento ou andar; “vaguear” comunica aqui um movimento inquieto e sem repouso.
- source_word: נָפֶשׁ
  choice: do desejo
  rationale: Neste contexto, נֶפֶשׁ aponta provavelmente para o ser que deseja, o apetite ou anseio, não especificamente para uma alma imaterial. “Desejo” torna claro o contraste com aquilo que os olhos já contemplam.
- source_word: גַּם זֶה
  choice: também isto
  rationale: Mantém a fórmula avaliativa recorrente de Eclesiastes em português natural e digno.
- source_word: הֶבֶל
  choice: vapor
  rationale: Preserva a metáfora concreta de algo fugaz, insubstancial e difícil de reter, evitando restringi-la ao sentido abstrato de “vaidade”.
- source_word: וּרְעוּת רוּחַ
  choice: e correr atrás do vento
  rationale: Reproduz de modo acessível a imagem de uma busca inútil; o sentido mais literal, “pastorear o vento”, seria obscuro em português.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação conserva o paralelismo sapiencial, a imagem concreta do vapor e a tensão entre aquilo que está diante dos olhos e o desejo inquieto.
