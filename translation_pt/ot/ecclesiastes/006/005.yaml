lexical_decisions:
- source_word: גַּם
  choice: Embora
  rationale: 'No contexto, introduz uma consideração concessiva: apesar de não ter experimentado a vida, o natimorto tem mais descanso.'
- source_word: שֶׁמֶשׁ
  choice: o sol
  rationale: Preserva a imagem hebraica; em Eclesiastes, “ver o sol” alude a experimentar a vida neste mundo.
- source_word: לֹא רָאָה
  choice: não tenha visto
  rationale: O subjuntivo composto é natural após “embora” e descreve a ausência de experiência do natimorto.
- source_word: וְלֹא יָדָע
  choice: nem conhecido coisa alguma
  rationale: Expressa a ideia ampla de não ter percepção ou experiência consciente, tornando explícito em português o objeto implícito.
- source_word: נַחַת
  choice: descanso
  rationale: Equivalente claro e corrente para repouso ou quietude, em contraste com a existência atribulada do homem mencionado antes.
- source_word: לָזֶה מִזֶּה
  choice: ele tem mais descanso do que aquele homem
  rationale: Torna claros os referentes contextuais dos demonstrativos hebraicos sem eliminar a comparação.
