  text: כָּל עֲמַ֥ל הָ/אָדָ֖ם לְ/פִ֑י/הוּ וְ/גַם הַ/נֶּ֖פֶשׁ לֹ֥א תִמָּלֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/007.yaml
  text: All a man's labor is for his mouth[a], yet even his appetite is not filled.
translation:
  language: pt
  text: Todo o trabalho do ser humano é para a sua boca, mas nem mesmo o seu apetite se satisfaz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mas nem mesmo a alma fica cheia”. Neste contexto, “alma” provavelmente se refere ao desejo ou apetite. Mais literalmente, “não se enche”.'
    reason: Preserva a alternativa lexical de נֶפֶשׁ e a imagem literal do verbo מלא.
lexical_decisions:
- source_word: כָּל
  choice: Todo
  rationale: Expressa a totalidade do esforço mencionado e forma uma construção natural em português com o substantivo singular.
- source_word: עֲמַל
  choice: trabalho
  rationale: Em Eclesiastes, o termo frequentemente denota esforço penoso; “trabalho” é claro e natural, mantendo esse peso no contexto.
- source_word: הָאָדָם
  choice: do ser humano
  rationale: O substantivo é genérico e se refere à humanidade em sentido proverbial, não a um homem específico.
- source_word: לְפִיהוּ
  choice: para a sua boca
  rationale: Preserva a imagem concreta e literal da boca, em vez de antecipar a interpretação como alimento ou sustento.
- source_word: וְגַם
  choice: mas nem mesmo
  rationale: 'Torna explícita, de maneira idiomática, a ironia contrastiva: apesar de todo o trabalho destinado à boca, o desejo continua insatisfeito.'
- source_word: הַנֶּפֶשׁ
  choice: apetite
  rationale: No contexto de boca, consumo e saciedade, נֶפֶשׁ designa provavelmente o desejo ou apetite, sem exigir uma oposição antropológica entre corpo e alma.
- source_word: לֹא תִמָּלֵא
  choice: não se satisfaz
  rationale: Comunica naturalmente em português a imagem de algo que nunca chega a ficar pleno; a nota conserva a formulação mais literal, “não se enche”.
theological_decisions:
- issue: Sentido genérico de אָדָם
  choice: ser humano
  alternative: homem
  rationale: A afirmação é proverbial e abrange a experiência humana em geral. “Ser humano” preserva esse alcance sem sugerir um indivíduo masculino específico.
- issue: Sentido contextual de נֶפֶשׁ
  choice: apetite
  alternative: alma
  rationale: O paralelismo com “boca” favorece o sentido de desejo ou apetite. A alternativa “alma” é mantida em nota para preservar a amplitude lexical e evitar resolver silenciosamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A imagem concreta de “boca” foi preservada; “apetite” explicita o provável sentido contextual de נֶפֶשׁ, enquanto a nota registra “alma” e a formulação verbal mais literal.
