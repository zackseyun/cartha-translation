  text: יֵ֣שׁ רָעָ֔ה אֲשֶׁ֥ר רָאִ֖יתִי תַּ֣חַת הַ/שָּׁ֑מֶשׁ וְ/רַבָּ֥ה הִ֖יא עַל הָ/אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/001.yaml
  text: 'There is an evil that I have seen under the sun[a], and it is heavy upon man:'
translation:
  language: pt
  text: 'Há um mal que vi debaixo do sol, e ele pesa muito sobre a humanidade[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o ser humano”. O hebraico emprega aqui o singular genérico אָדָם, referindo-se à humanidade em geral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  choice: Há
  rationale: A partícula existencial é expressa de modo natural e direto em português.
- source_word: רָעָה
  choice: um mal
  rationale: Preserva a amplitude do hebraico, que pode designar algo mau, penoso ou calamitoso, sem especificar indevidamente.
- source_word: אֲשֶׁר רָאִיתִי
  choice: que vi
  rationale: Traduz diretamente a oração relativa e o perfeito qal na reflexão do autor.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: debaixo do sol
  rationale: Expressão consagrada, natural e fiel ao idioma recorrente de Eclesiastes para a vida no âmbito terreno.
- source_word: וְרַבָּה הִיא
  choice: e ele pesa
  rationale: O adjetivo רַבָּה significa literalmente 'grande/muito'; com עַל, comunica aqui a gravidade ou o caráter oneroso desse mal. 'Pesa' reproduz essa força sem tornar a frase artificial.
- source_word: עַל הָאָדָם
  choice: sobre a humanidade
  rationale: הָאָדָם é singular genérico e se refere aos seres humanos em geral; 'a humanidade' comunica naturalmente essa referência coletiva em português.
theological_decisions:
- issue: Sentido genérico de הָאָדָם
  choice: a humanidade
  alternative: o ser humano
  rationale: O contexto trata da condição humana em geral, não de um homem específico. A tradução inclusiva conserva o referente genérico; a alternativa mais próxima da forma singular é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantém a imagem de peso sugerida pela construção hebraica e encerra com dois-pontos, pois o versículo introduz a descrição que segue.
