  text: כִּ֣י מִֽי יוֹדֵעַ֩ מַה טּ֨וֹב לָֽ/אָדָ֜ם בַּֽ/חַיִּ֗ים מִסְפַּ֛ר יְמֵי חַיֵּ֥י הֶבְל֖/וֹ וְ/יַעֲשֵׂ֣/ם כַּ/צֵּ֑ל אֲשֶׁר֙ מִֽי יַגִּ֣יד לָֽ/אָדָ֔ם מַה יִּהְיֶ֥ה אַחֲרָ֖י/ו תַּ֥חַת הַ/שָּֽׁמֶשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/012.yaml
  text: For who knows what is good for man in life, during the number of the days of his fleeting life, which he spends like a shadow? For who can tell man what will be after him under the sun?
translation:
  language: pt
  text: Pois quem sabe o que é bom para o ser humano na vida, ao longo de seus dias de vida passageira, que ele passa como uma sombra? Pois quem pode dizer ao ser humano o que acontecerá depois dele debaixo do sol?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָאָדָם
  choice: para o ser humano
  rationale: Expressa o sentido genérico de אָדָם em português atual, sem restringi-lo ao sexo masculino.
- source_word: הֶבְלוֹ
  choice: passageira
  rationale: Neste contexto, הֶבֶל destaca a transitoriedade e a brevidade da vida; “passageira” comunica esse aspecto com naturalidade, sem impor aqui a ideia mais interpretativa de “sem sentido”.
- source_word: וְיַעֲשֵׂם
  choice: que ele passa
  rationale: O sufixo plural retoma os dias; a expressão idiomática indica como a pessoa passa esses dias. A formulação evita a tradução rígida “faz deles”.
- source_word: כַצֵּל
  choice: como uma sombra
  rationale: Mantém a imagem hebraica da sombra, que evoca brevidade e caráter fugaz.
- source_word: אַחֲרָיו
  choice: depois dele
  rationale: 'Preserva a ambiguidade do hebraico: pode referir-se ao que virá após a vida da pessoa ou ao que ocorrerá posteriormente no mundo.'
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: debaixo do sol
  rationale: Conserva a expressão característica de Eclesiastes e sua perspectiva sobre a vida no mundo humano.
theological_decisions:
- issue: Sentido de הֶבֶל aplicado à vida
  choice: vida passageira
  alternative: vida vã / vida sem sentido
  rationale: O paralelo com a sombra favorece a nuance de fugacidade. A tradução não resolve a tensão teológica do livro afirmando categoricamente que a vida seja inútil ou sem sentido.
- issue: Alcance de אַחֲרָיו
  choice: o que acontecerá depois dele
  alternative: o que acontecerá depois de sua morte
  rationale: A forma hebraica não explicita “morte”; manter “depois dele” preserva a abertura entre posteridade, futuro e acontecimentos posteriores à sua vida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “Pois quem” reproduz a estrutura retórica das duas perguntas. “Poucos dias” verte idiomaticamente מִסְפַּר יְמֵי no contexto de uma vida comparada à sombra.
