  text: וְ/אִלּ֣וּ חָיָ֗ה אֶ֤לֶף שָׁנִים֙ פַּעֲמַ֔יִם וְ/טוֹבָ֖ה לֹ֣א רָאָ֑ה הֲ/לֹ֛א אֶל מָק֥וֹם אֶחָ֖ד הַ/כֹּ֥ל הוֹלֵֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/006.yaml
  text: Even if he should live a thousand years twice over and not see good[c][b][a], do not all go to one place?
translation:
  language: pt
  text: Ainda que ele viva duas vezes mil anos e não veja o bem[a], não vão todos para um só lugar?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ver o bem” é uma expressão hebraica que significa experimentar ou desfrutar o que é bom.
    reason: lexical_alternative
  - marker: b
    text: Isto é, o destino comum na morte; o hebraico diz apenas “um só lugar”. “Duas vezes mil anos” também pode ser traduzido por “dois mil anos”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִלּוּ
  choice: Ainda que
  rationale: Introduz naturalmente em português uma hipótese concessiva, preservando a força do hebraico.
- source_word: חָיָה
  choice: ele viva
  rationale: O presente do subjuntivo após «ainda que» expressa com naturalidade o cenário hipotético ou concessivo.
- source_word: אֶלֶף שָׁנִים פַּעֲמַיִם
  choice: mil anos duas vezes
  rationale: Preserva a formulação enfática e incomum do hebraico, sem reduzi-la simplesmente a «dois mil anos».
- source_word: וְטוֹבָה לֹא רָאָה
  choice: e não veja o bem
  rationale: Mantém o verbo concreto «ver» e o termo amplo «bem», recorrentes no estilo de Eclesiastes; a nota esclarece o valor idiomático.
- source_word: הֲלֹא
  choice: não
  rationale: Na pergunta «não vão todos...?», marca de modo idiomático uma pergunta retórica que espera resposta afirmativa.
- source_word: אֶל מָקוֹם אֶחָד
  choice: para um só lugar
  rationale: Reproduz o sentido literal sem identificar explicitamente o destino como morte, sepultura ou Sheol.
- source_word: הַכֹּל הוֹלֵךְ
  choice: vão todos
  rationale: A ordem é natural em português e o presente exprime a realidade geral indicada pelo particípio hebraico.
theological_decisions:
- issue: Destino implícito de «um só lugar»
  choice: um só lugar
  alternative: o mesmo lugar; a sepultura; a morte; o Sheol
  rationale: O hebraico deixa o destino implícito. A tradução conserva essa concisão e evita resolver no texto principal uma referência que depende do contexto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. «Ainda que ele viva» evita a construção menos fluida «mesmo que devesse viver». A expressão «mil anos duas vezes» conserva deliberadamente a forma marcada do original. Os marcadores aparecem no texto e as notas não impõem uma identificação dogmática do destino implícito.
