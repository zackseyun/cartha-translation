source:
  edition: WLC
  text: אִם יוֹלִ֣יד אִ֣ישׁ מֵאָ֡ה וְ/שָׁנִים֩ רַבּ֨וֹת יִֽחְיֶ֜ה וְ/רַ֣ב שֶׁ/יִּהְי֣וּ יְמֵֽי שָׁנָ֗י/ו וְ/נַפְשׁ/וֹ֙ לֹא תִשְׂבַּ֣ע מִן הַ/טּוֹבָ֔ה וְ/גַם קְבוּרָ֖ה לֹא הָ֣יְתָה לּ֑/וֹ אָמַ֕רְתִּי ט֥וֹב מִמֶּ֖/נּוּ הַ/נָּֽפֶל־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/003.yaml
  text: If a man fathers a hundred children and lives many years[a], however many the days of his years may be, but his soul is not satisfied with good, and he does not even have burial[c][b], I say that the stillborn child is better off than he.
translation:
  language: pt
  text: Se um homem gerar cem filhos e viver muitos anos, por mais numerosos que sejam os dias de seus anos, mas sua alma[a] não se satisfizer com o bem e ele nem sequer tiver sepultura, digo[b] que o natimorto[c] está em melhor situação do que ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «sua alma não se satisfizer com o bem». «Alma» também pode ser entendida como «o próprio ser» ou, neste contexto, «apetite».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «eu disse». A forma perfeita hebraica pode ser entendida aqui como uma declaração passada ou como uma fórmula discursiva no presente.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «o aborto espontâneo» ou «a perda gestacional».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Introduz uma situação hipotética e preserva diretamente a estrutura condicional do hebraico.
- source_word: יוֹלִיד אִישׁ מֵאָה
  choice: um homem gerar cem filhos
  rationale: O hifil de ילד expressa procriação; “gerar” é natural e digno em português. “Filhos” explicita o complemento humano implícito depois de “cem”.
- source_word: וְשָׁנִים רַבּוֹת יִחְיֶה
  choice: e viver muitos anos
  rationale: Expressa com clareza a longevidade indicada pelo hebraico.
- source_word: וְרַב שֶׁיִּהְיוּ יְמֵי שָׁנָיו
  choice: por mais numerosos que sejam os dias de seus anos
  rationale: Conserva a imagem hebraica dos “dias” e “anos” e comunica o valor concessivo e intensificador da oração.
- source_word: וְנַפְשׁוֹ
  choice: sua alma
  rationale: Preserva a textura antropológica de נפשׁ, que aqui pode designar a alma, o próprio ser ou o apetite, sem restringir prematuramente o sentido.
- source_word: לֹא תִשְׂבַּע מִן הַטּוֹבָה
  choice: não se satisfizer com o bem
  rationale: שבע significa ficar satisfeito ou saciado; “o bem” mantém a amplitude da expressão, que pode abranger as coisas boas e prazerosas da vida.
- source_word: וְגַם קְבוּרָה לֹא הָיְתָה לּוֹ
  choice: e ele nem sequer tiver sepultura
  rationale: “Nem sequer” comunica a força adicional de גַם e “tiver sepultura” expressa naturalmente a privação dessa honra final.
- source_word: אָמַרְתִּי
  choice: digo
  rationale: Embora a forma hebraica seja perfeita, ela pode funcionar aqui como fórmula discursiva que introduz a avaliação presente do Pregador.
- source_word: טוֹב מִמֶּנּוּ
  choice: está em melhor situação do que ele
  rationale: A comparação diz respeito à condição existencial, não à qualidade moral; a formulação torna isso claro em português.
- source_word: הַנָּפֶל
  choice: o natimorto
  rationale: No contexto, designa uma criança que não chegou a viver após o nascimento ou uma gestação interrompida. “Natimorto” é conciso, concreto e compreensível.
theological_decisions:
- issue: Amplitude antropológica de נֶפֶשׁ na literatura sapiencial
  choice: sua alma não se satisfizer
  alternative: ele não se satisfizer; seu apetite não se satisfizer
  rationale: O versículo não formula uma doutrina técnica da alma. Manter “alma” preserva a linguagem do texto e sua amplitude, enquanto a nota registra sentidos contextuais possíveis.
- issue: Linguagem representativa masculina
  choice: um homem
  alternative: alguém; uma pessoa
  rationale: O hebraico emprega אִישׁ, masculino singular, na apresentação do caso representativo. A tradução conserva essa forma sem ampliar nem restringir sua aplicação.
- issue: Condição comparativa do natimorto
  choice: está em melhor situação do que ele
  alternative: é melhor do que ele
  rationale: A formulação evita sugerir superioridade moral ou ontológica e apresenta a comparação como avaliação da condição descrita no contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura mantém a acumulação retórica do hebraico, mas usa concordância verbal natural em português (“se... gerar... viver... não se satisfizer... tiver”). As notas foram colocadas junto aos termos a que efetivamente se referem.
