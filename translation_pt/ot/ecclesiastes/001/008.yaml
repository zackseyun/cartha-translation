  text: כָּל הַ/דְּבָרִ֣ים יְגֵעִ֔ים לֹא יוּכַ֥ל אִ֖ישׁ לְ/דַבֵּ֑ר לֹא תִשְׂבַּ֥ע עַ֨יִן֙ לִ/רְא֔וֹת וְ/לֹא תִמָּלֵ֥א אֹ֖זֶן מִ/שְּׁמֹֽעַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/008.yaml
  text: All things are wearisome; a man cannot speak of it. The eye is not satisfied with seeing, nor is the ear filled with hearing.
translation:
  language: pt
  text: Todas as coisas são cansativas[a]; ninguém consegue falar delas[b]. O olho não se satisfaz de ver, nem o ouvido se enche de ouvir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Todas as palavras são cansativas”; o termo hebraico pode significar “palavras”, “assuntos” ou “coisas”.
    reason: lexical_alternative
  - marker: b
    text: Ou “ninguém consegue falar”; o hebraico pode indicar que ninguém é capaz de expressar adequadamente essas coisas ou que elas são cansativas demais para serem descritas.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַדְּבָרִים
  choice: Todas as coisas
  rationale: דְּבָרִים pode significar “palavras”, “assuntos” ou “coisas”. No contexto dos ciclos universais e da incapacidade humana de esgotá-los, “coisas” comunica melhor a amplitude do referente, enquanto a nota preserva a alternativa lexical.
- source_word: יְגֵעִים
  choice: são cansativas
  rationale: O adjetivo ligado a יגע indica aquilo que produz cansaço ou exaustão. “Cansativas” é claro e natural em português e mantém o sentido predicativo.
- source_word: לֹא יוּכַל אִישׁ לְדַבֵּר
  choice: ninguém consegue expressá-las plenamente
  rationale: A construção afirma a incapacidade de uma pessoa falar, provavelmente no sentido de dar expressão suficiente ao conjunto mencionado. “Ninguém” representa naturalmente o אִישׁ genérico em português; “plenamente” explicita uma implicação contextual sem esconder, na nota, a possibilidade de uma tradução mais estrita.
- source_word: לֹא תִשְׂבַּע עַיִן לִרְאוֹת
  choice: O olho não se satisfaz de ver
  rationale: שׂבע significa ficar saciado ou satisfeito. O singular “o olho” funciona genericamente, e “não se satisfaz de ver” preserva a imagem hebraica em português corrente e digno.
- source_word: וְלֹא תִמָּלֵא אֹזֶן מִשְּׁמֹעַ
  choice: nem o ouvido se enche de ouvir
  rationale: O nifal de מלא significa “encher-se/ser preenchido”. Manter “se enche” preserva a diferença lexical em relação a “se satisfaz” na oração anterior e conserva o paralelismo.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O texto mantém o paralelismo poético e as imagens concretas de olho e ouvido, usando linguagem digna e acessível. Os marcadores [a] e [b] aparecem no texto principal e correspondem às notas.
