lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação do que foi afirmado anteriormente e preserva de modo natural o valor causal-explicativo.
- source_word: בְּרֹב חָכְמָה
  choice: onde há muita sabedoria
  rationale: Expressa em português corrente a circunstância indicada por בְּ, sem converter a relação em causalidade mais explícita do que o hebraico permite.
- source_word: רָב כָּעַס
  choice: há muita aflição
  rationale: Mantém o paralelismo quantitativo e traduz כָּעַס por um termo amplo, capaz de abranger pesar, irritação e sofrimento interior.
- source_word: וְיוֹסִיף דַּעַת
  choice: e quem aumenta o conhecimento
  rationale: A construção proverbial é vertida como oração relativa natural, preservando a distinção entre conhecimento e sabedoria.
- source_word: יוֹסִיף מַכְאוֹב
  choice: aumenta a dor
  rationale: Repete o verbo 'aumentar' para refletir a repetição de יסף e conserva a abrangência física ou emocional de מַכְאוֹב.
