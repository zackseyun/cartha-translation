  text: What is crooked cannot be made straight[b][a], and what is lacking cannot be counted.
translation:
  language: pt
  text: O que é torto não pode ser endireitado[a], e o que falta não pode ser contado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O que está deformado não pode ser posto em ordem”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o que está faltando não pode ser enumerado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעֻוָּת
  choice: o que é torto
  rationale: O particípio passivo de עוה descreve aquilo que está torto, retorcido ou deformado. A formulação preserva o caráter proverbial e a imagem concreta do hebraico.
- source_word: לֹא יוּכַל
  choice: não pode ser
  rationale: A construção expressa incapacidade ou impossibilidade e é reproduzida de modo direto e natural em português.
- source_word: לִתְקֹן
  choice: ser endireitado
  rationale: תקן significa aqui tornar reto ou pôr em ordem. “Ser endireitado” mantém a correspondência imagética com “torto”, sem ampliar o sentido para uma interpretação como “ser corrigido” ou “ser consertado”.
- source_word: וְחֶסְרוֹן
  choice: e o que falta
  rationale: O substantivo indica falta, deficiência ou aquilo que está ausente. “O que falta” é corrente em português e forma um paralelismo natural com “o que é torto”.
- source_word: לְהִמָּנוֹת
  choice: ser contado
  rationale: O infinitivo nifal de מנה significa ser contado ou enumerado. “Ser contado” é a expressão portuguesa mais natural, enquanto “ser enumerado” permanece como alternativa lexical.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e proverbial, com paralelismo equilibrado entre as duas orações. A tradução conserva as imagens de algo torto que não pode ser endireitado e de algo ausente que, por isso, não pode integrar uma contagem.
