  text: דּ֤וֹר הֹלֵךְ֙ וְ/ד֣וֹר בָּ֔א וְ/הָ/אָ֖רֶץ לְ/עוֹלָ֥ם עֹמָֽדֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/004.yaml
  text: A generation goes[a], and a generation comes[b], but the earth stands forever.
translation:
  language: pt
  text: Uma geração vai, e outra geração vem, mas a terra permanece[a] para sempre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “continua firme”. O verbo hebraico significa literalmente “está de pé”, imagem concreta de estabilidade duradoura.'
    reason: lexical_alternative
  - marker: b
    text: “Para sempre” traduz uma expressão idiomática hebraica de continuidade duradoura. Neste contexto, ela ressalta o contraste entre as gerações passageiras e a permanência relativa da terra.
    reason: cultural_note
lexical_decisions:
- source_word: דּוֹר
  choice: geração
  rationale: Designa aqui a geração de pessoas que vive em determinada época; a repetição preserva o paralelismo entre a geração que parte e a que chega.
- source_word: הֹלֵךְ
  choice: vai
  rationale: O particípio expressa uma ação contínua e proverbial. “Vai” mantém a imagem simples do hebraico sem acrescentar explicitamente a ideia de morrer ou desaparecer.
- source_word: בָּא
  choice: vem
  rationale: Equivale naturalmente a “vem” e forma, com “vai”, a antítese breve do texto hebraico.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Neste quadro de alcance universal, refere-se à terra como mundo habitado, não a um território específico.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: É a forma portuguesa natural de expressar a continuidade duradoura do idioma hebraico e conserva a força do contraste com a sucessão das gerações.
- source_word: עֹמָדֶת
  choice: permanece
  rationale: O verbo significa literalmente “estar de pé” e, por extensão, permanecer ou continuar firme. “Permanece” comunica com naturalidade a estabilidade duradoura da terra; a imagem concreta é registrada em nota.
theological_decisions:
- issue: Se לְעוֹלָם deve ser entendido como afirmação metafísica absoluta ou como expressão retórica de permanência duradoura
  choice: “para sempre” no texto principal
  alternative: “por eras” ou “de era em era”
  rationale: O versículo contrapõe a transitoriedade das gerações humanas à estabilidade duradoura da terra. Trata-se de linguagem observacional e sapiencial; a tradução mantém a força da expressão sem decidir, no próprio texto, uma questão cosmológica sistemática.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação concisa reproduz o paralelismo e o contraste do hebraico; “outra geração” evita repetição pesada sem alterar o referente.
