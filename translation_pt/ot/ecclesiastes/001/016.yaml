base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/016.yaml
  text: I said in my heart, saying, “I—look—I have become great and increased in wisdom beyond all who were before me over Jerusalem, and my heart has seen much wisdom and knowledge.”
translation:
  language: pt
  text: 'Eu disse no meu coração: “Eu — eis que me tornei grande e aumentei em sabedoria mais do que todos os que estiveram antes de mim sobre Jerusalém; e o meu coração contemplou muita sabedoria e conhecimento.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דִּבַּרְתִּי אֲנִי עִם לִבִּי לֵאמֹר
  choice: Eu disse no meu coração
  rationale: Expressa naturalmente em português a reflexão interior indicada pelo hebraico, sem reproduzir de modo redundante o infinitivo לֵאמֹר.
- source_word: אֲנִי הִנֵּה
  choice: Eu — vejam! —
  rationale: Preserva tanto o pronome enfático אֲנִי quanto a interjeição הִנֵּה, que chama a atenção para a afirmação seguinte.
- source_word: הִגְדַּלְתִּי וְהוֹסַפְתִּי חָכְמָה
  choice: tornei-me grande e aumentei em sabedoria
  rationale: Mantém a coordenação e a imagem do texto hebraico, em vez de reduzir a expressão apenas a 'adquiri mais sabedoria'.
- source_word: עַל כָּל אֲשֶׁר הָיָה לְפָנַי עַל יְרוּשָׁלָם
  choice: mais do que todos os que estiveram antes de mim sobre Jerusalém
  rationale: עַל tem aqui valor comparativo na primeira ocorrência e provavelmente indica posição de autoridade na segunda; 'sobre Jerusalém' conserva essa formulação e sua possível amplitude.
- source_word: וְלִבִּי רָאָה הַרְבֵּה חָכְמָה וָדָעַת
  choice: e o meu coração contemplou muita sabedoria e conhecimento
  rationale: '''Contemplou'' conserva a metáfora de o coração ''ver'', ao mesmo tempo que soa inteligível em português moderno.'
theological_decisions:
- issue: Alcance da alegação de superioridade em sabedoria
  choice: mais do que todos os que estiveram antes de mim sobre Jerusalém
  alternative: mais do que qualquer um que me precedeu em Jerusalém
  rationale: A tradução retém a formulação abrangente e a relação com Jerusalém sem identificar explicitamente o locutor nem restringir os predecessores a uma categoria específica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com leve solenidade compatível com a voz reflexiva de Eclesiastes. A construção enfática 'Eu — vejam! —' é marcada, como no hebraico, mas permanece compreensível.
