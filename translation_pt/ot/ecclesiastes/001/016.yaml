- from: 'Eu disse no meu coração: “Eu — vejam! — tornei-me grande e aumentei em sabedoria mais do que todos os que estiveram antes de mim sobre Jerusalém; e o meu coração contemplou muita sabedoria e conhecimento.”'
  to: 'Eu disse no meu coração: “Eu — eis que me tornei grande e aumentei em sabedoria mais do que todos os que estiveram antes de mim sobre Jerusalém; e o meu coração contemplou muita sabedoria e conhecimento.”'
  rationale: A revisão limita-se a substituir a forma imperativa plural «vejam!» por «eis que», equivalente apresentativo mais fiel a הִנֵּה e mais adequado à voz interior do versículo. Mantêm-se a ênfase de «Eu», a formulação aberta «sobre Jerusalém» e a metáfora de o coração contemplar/ver.
