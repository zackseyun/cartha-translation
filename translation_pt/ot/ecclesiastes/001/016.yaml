    issue: «vejam!» para הִנֵּה
    rationale: '«Vejam» é imperativo plural em português e pressupõe destinatários. הִנֵּה funciona aqui como partícula de chamada de atenção dentro da fala: «eis que» a representa sem acrescentar esse imperativo.'
