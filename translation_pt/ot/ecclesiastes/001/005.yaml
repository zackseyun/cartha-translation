base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/005.yaml
  text: And the sun rises[a], and the sun goes down, and hastening to its place, it rises there again.
translation:
  language: pt
  text: O sol nasce, e o sol se põe; ofega[a] rumo ao seu lugar e ali torna a nascer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “apressa-se rumo ao seu lugar; ali torna a nascer”. O particípio hebraico שׁוֹאֵף pode significar literalmente “ofega” ou, em sentido mais idiomático, “apressa-se”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָרַח
  choice: O sol nasce
  rationale: O verbo זרח descreve o despontar ou nascer do sol. Embora esteja na forma qatal, o contexto apresenta uma observação geral e repetitiva, para a qual o presente gnômico é natural em português.
- source_word: וּבָא
  choice: e o sol se põe
  rationale: בוא significa literalmente entrar ou chegar, mas, quando usado com o sol, refere-se idiomaticamente ao pôr do sol. “Põe-se” é a expressão portuguesa corrente.
- source_word: מְקוֹמוֹ
  choice: ao seu lugar
  rationale: Mantém o sentido direto de מקום e o sufixo que retoma “o sol”, sem explicitar além do hebraico que se trata do lugar onde ele nasce.
- source_word: שׁוֹאֵף
  choice: ofega
  rationale: O particípio de שאף pode retratar o ato de ofegar ou, por extensão, avançar com ímpeto. “Ofega” preserva a personificação concreta e a imagem expressiva do hebraico; a leitura idiomática “apressa-se” é registrada em nota.
- source_word: זוֹרֵחַ הוּא שָׁם
  choice: e ali torna a nascer
  rationale: O particípio זורח retoma a ação inicial de nascer, enquanto הוּא שָׁם realça que isso ocorre ali. “Torna a” comunica naturalmente a repetição cíclica implícita no contexto, embora “de novo” não esteja expresso por uma palavra hebraica independente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A coordenação e a repetição de “o sol” conservam o ritmo observacional do hebraico, enquanto o ponto e vírgula torna a sequência natural em português. A imagem personificada de o sol “ofegar” foi mantida no texto principal, com a alternativa idiomática em nota.
