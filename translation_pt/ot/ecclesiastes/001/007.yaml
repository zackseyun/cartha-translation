  yaml_path: translation/ot/ecclesiastes/001/007.yaml
  text: All the streams flow into the sea[a], yet the sea is not full; to the place where the streams flow[b], there they return to flow again.
translation:
  language: pt
  text: Todos os riachos correm para o mar[a], mas o mar não está cheio; para o lugar para onde os riachos correm[b], para lá eles voltam a correr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “rios”. O hebraico נְחָלִים pode se referir a riachos, torrentes, uádis ou leitos de rios, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “para o lugar para onde os riachos vão, para lá eles voltam a ir”. A formulação pode evocar o ciclo recorrente das águas sem explicar explicitamente seu mecanismo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְחָלִים
  choice: riachos
  rationale: O termo pode indicar riachos, torrentes, uádis ou leitos de rios. “Riachos” é natural em português e evita especificar grandes rios permanentes.
- source_word: הֹלְכִים
  choice: correm
  rationale: Embora הלך signifique literalmente “ir”, aplicado a cursos de água o português idiomático usa “correr”.
- source_word: יָם
  choice: mar
  rationale: É o equivalente direto e comum do hebraico, sem a especificidade adicional de “oceano”.
- source_word: אֵינֶנּוּ מָלֵא
  choice: não fica cheio
  rationale: Expressa naturalmente a condição contínua do mar sem acrescentar explicitamente “nunca”.
- source_word: מְקוֹם
  choice: lugar
  rationale: Mantém o sentido explícito do hebraico sem interpretar o lugar como “nascente” ou explicar o mecanismo do ciclo da água.
- source_word: שָׁם
  choice: para lá
  rationale: Preserva o elemento espacial enfático do hebraico e soa natural depois de “aonde”.
- source_word: שָׁבִים
  choice: voltam
  rationale: Conserva a ideia de retorno e recorrência expressa por שוב.
- source_word: לָלָכֶת
  choice: a correr
  rationale: O infinitivo significa literalmente “ir”; com riachos, “correr” é idiomático. A construção com “voltam a” comunica a repetição sem precisar inserir “novamente”.
