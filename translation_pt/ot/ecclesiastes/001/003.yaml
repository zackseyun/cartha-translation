  yaml_path: translation/ot/ecclesiastes/001/003.yaml
  text: What profit does man have in all his labor at which he toils under the sun?[a]
translation:
  language: pt
  text: Que proveito o ser humano[a] tira de todo o trabalho em que se afadiga debaixo do sol?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o homem” ou “uma pessoa”; o termo hebraico está no singular e representa aqui o ser humano em geral.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: Que
  rationale: Introduz diretamente a pergunta retórica e preserva a concisão do hebraico.
- source_word: יִתְרוֹן
  choice: proveito
  rationale: Expressa o benefício líquido ou duradouro que resta do trabalho e mantém um termo-chave recorrente em Eclesiastes.
- source_word: לָאָדָם
  choice: o ser humano
  rationale: אָדָם é singular e representativo neste contexto. “O ser humano” conserva o valor genérico sem sugerir que a afirmação se limita aos homens.
- source_word: בְּכָל עֲמָלוֹ
  choice: de todo o trabalho
  rationale: A construção portuguesa “tirar proveito de” comunica naturalmente a relação entre o possível ganho e a totalidade do trabalho considerado.
- source_word: שֶׁיַּעֲמֹל
  choice: em que se afadiga
  rationale: “Afadigar-se” preserva a ideia de esforço penoso presente na raiz עמל e evita uma repetição pouco natural de “trabalho/trabalhar”.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: debaixo do sol
  rationale: Mantém literalmente a expressão programática de Eclesiastes para a vida no âmbito terreno e observável.
theological_decisions:
- issue: Sentido genérico de אָדָם
  choice: o ser humano
  alternative: o homem; uma pessoa
  rationale: O substantivo hebraico está no singular e representa a humanidade em geral. A tradução principal torna explícito esse alcance universal, enquanto a nota preserva a forma tradicional e outras possibilidades legítimas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação idiomática “tirar proveito de” evita rigidez, enquanto “se afadiga” retém a conotação de trabalho penoso.
