base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/006.yaml
  text: Going toward the south and turning toward the north[a], turning and turning goes the wind[b]; and on its circuits the wind returns.
translation:
  language: pt
  text: Vai em direção ao sul e gira em direção ao norte; girando e girando, vai o vento[a]; e, em seus circuitos[b], o vento retorna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico רוּחַ também pode significar “espírito” ou “sopro”; aqui, o contexto dos ciclos naturais favorece “vento”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “em suas voltas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלֵךְ
  choice: vai / segue
  rationale: O particípio de הלך expressa movimento contínuo. “Vai” conserva o sentido básico na primeira ocorrência; “segue” torna a segunda construção natural em português sem perder a ideia de movimento constante.
- source_word: דָּרוֹם
  choice: sul
  rationale: O substantivo indica a direção sul. Com אֶל, “em direção ao sul” traduz de modo claro sem acrescentar a ideia de “vento sul”.
- source_word: וְסוֹבֵב / סוֹבֵב סֹבֵב
  choice: e gira / girando e girando
  rationale: סבב significa girar, dar voltas ou circular. A repetição foi mantida para reproduzir o ritmo e a ênfase do hebraico no movimento incessante.
- source_word: צָפוֹן
  choice: norte
  rationale: Designa a direção norte; com אֶל, a formulação natural é “em direção ao norte”.
- source_word: הָרוּחַ
  choice: o vento
  rationale: רוּחַ pode significar vento, espírito ou sopro. No contexto dos ciclos naturais de Eclesiastes 1:5–7, “vento” é o referente mais provável.
- source_word: וְעַל
  choice: e, em
  rationale: Embora עַל tenha sentidos como “sobre” e “por”, “em seus circuitos” comunica naturalmente em português o movimento dentro de percursos recorrentes.
- source_word: סְבִיבֹתָיו
  choice: seus circuitos
  rationale: O termo pertence ao mesmo campo semântico de סבב e indica voltas ou percursos circulares. “Circuitos” preserva a imagem cíclica.
- source_word: שָׁב
  choice: retorna
  rationale: שוב significa voltar ou retornar. “Retorna” é conciso e reforça o tema do movimento cíclico.
theological_decisions:
- issue: Sentido de רוּחַ neste versículo
  choice: vento em sentido meteorológico
  alternative: espírito ou sopro
  rationale: O contexto imediato descreve ciclos observáveis da natureza — sol, vento e cursos de água. Assim, “vento” é a leitura contextual mais adequada, sem negar a amplitude semântica do termo em outros contextos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição “girando e girando” conserva deliberadamente a cadência enfática do hebraico; a ordem final mantém em destaque o retorno contínuo do vento.
