  text: מַה שֶּֽׁ/הָיָה֙ ה֣וּא שֶׁ/יִּהְיֶ֔ה וּ/מַה שֶׁ/נַּֽעֲשָׂ֔ה ה֖וּא שֶׁ/יֵּעָשֶׂ֑ה וְ/אֵ֥ין כָּל חָדָ֖שׁ תַּ֥חַת הַ/שָּֽׁמֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/009.yaml
  text: What has been is what will be[a], and what has been done is what will be done; and there is nothing new under the sun.
translation:
  language: pt
  text: O que foi é o que será[a], e o que foi feito é o que será feito; não há nada de novo debaixo do sol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O que houve é o que haverá, e o que foi feito é o que será feito.”'
    reason: Alternativa lexical para היה, que pode ter sentido existencial («houve/haverá»); a formulação principal preserva de modo mais direto o paralelismo proverbial.
lexical_decisions:
- source_word: מַה שֶּׁהָיָה
  choice: O que foi
  rationale: A construção relativa significa “aquilo que foi”. Em português, o pretérito perfeito é natural e mantém o paralelismo sentencioso; “o que tem sido” sugeriria continuidade habitual não exigida pelo hebraico.
- source_word: הוּא שֶׁיִּהְיֶה
  choice: é o que será
  rationale: Preserva a estrutura equativa formada pelo pronome seguido da oração relativa, sem explicitar como “será o mesmo” aquilo que o hebraico deixa implícito.
- source_word: וּמַה שֶׁנַּעֲשָׂה
  choice: e o que foi feito
  rationale: O nifal de עשה tem sentido passivo/resultativo e corresponde à primeira oração.
- source_word: הוּא שֶׁיֵּעָשֶׂה
  choice: é o que será feito
  rationale: Mantém a voz passiva do nifal e o paralelismo verbal, em vez de ampliar o sentido para “acontecerá”.
- source_word: וְאֵין כָּל חָדָשׁ
  choice: não há nada de novo
  rationale: Expressa naturalmente em português a construção existencial negativa אֵין + כָּל, preservando sua força abrangente.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: debaixo do sol
  rationale: É uma formulação portuguesa clara e consagrada para o idioma recorrente de Eclesiastes, que situa a observação no âmbito da vida terrena.
theological_decisions:
- issue: Alcance da afirmação na perspectiva de Eclesiastes
  choice: Manter a declaração como observação geral sobre os padrões recorrentes da vida “debaixo do sol”.
  alternative: Entendê-la como negação metafísica absoluta de toda e qualquer novidade.
  rationale: A expressão “debaixo do sol” enquadra retoricamente a afirmação no mundo observável da experiência humana. A tradução conserva a universalidade enfática do verso sem acrescentar uma explicação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. O paralelismo e a concisão proverbial do hebraico foram preservados; evitou-se tanto o arcaísmo “não há coisa nova” quanto a paráfrase interpretativa “tudo se repete”.
