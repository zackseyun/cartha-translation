base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/010.yaml
  text: Is there a thing of which one says[a], “See, this is new”? It has already been in the ages before us.
translation:
  language: pt
  text: 'Há alguma coisa da qual se diga: “Veja, isto é novo”? Ela já existia nos tempos que nos antecederam.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵשׁ דָּבָר
  choice: Há alguma coisa
  rationale: A construção existencial, no contexto, introduz uma pergunta retórica. “Alguma coisa” transmite de modo natural a amplitude de דָּבָר.
- source_word: שֶׁיֹּאמַר
  choice: da qual se diga
  rationale: O relativo com o verbo no imperfeito tem sentido genérico e impessoal; a formulação evita identificar um sujeito específico.
- source_word: רְאֵה זֶה חָדָשׁ הוּא
  choice: Veja, isto é novo
  rationale: “Veja” conserva o imperativo de atenção sem arcaísmo, e “isto é novo” mantém o demonstrativo e a afirmação nominal hebraica.
- source_word: כְּבָר הָיָה
  choice: Ela já existia
  rationale: כְּבָר enfatiza anterioridade, enquanto הָיָה aqui indica existência prévia. O pronome retoma naturalmente “alguma coisa” em português.
- source_word: לְעֹלָמִים
  choice: há muito tempo
  rationale: No contexto, o plural temporal aponta para tempos remotos, não para duração eterna. A expressão portuguesa comunica esse valor com naturalidade.
- source_word: אֲשֶׁר הָיָה מִלְּפָנֵינוּ
  choice: nas eras anteriores a nós
  rationale: A formulação preserva a referência aos períodos remotos que precederam a geração presente, mantendo também a amplitude temporal do plural עֹלָמִים.
