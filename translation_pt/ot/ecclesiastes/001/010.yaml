  naturalness: O texto é claro e de registro apropriado. A revisão proposta elimina a redundância entre «há muito tempo» e «nas eras anteriores a nós», resultando numa frase mais direta e natural.
  terminology: «Alguma coisa», «se diga», «Veja» e «novo» são escolhas adequadas. «Tempos que nos antecederam» expressa naturalmente o plural temporal de עֹלָמִים e a relação indicada por מִלְּפָנֵינוּ.
