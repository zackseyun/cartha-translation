source:
  edition: WLC
  text: רָאִ֨יתִי֙ אֶת כָּל הַֽ/מַּעֲשִׂ֔ים שֶֽׁ/נַּעֲשׂ֖וּ תַּ֣חַת הַ/שָּׁ֑מֶשׁ וְ/הִנֵּ֥ה הַ/כֹּ֛ל הֶ֖בֶל וּ/רְע֥וּת רֽוּחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/014.yaml
  text: I have seen all the works that are done under the sun[a], and behold[b], all is vanity and a striving after wind.
translation:
  language: pt
  text: Vi todas as obras que se fazem debaixo do sol, e eis que tudo é vapor[a] e correr atrás do vento[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “sopro”, “vaidade” ou “futilidade”. Em Eclesiastes, o hebraico הֶבֶל sugere aquilo que é passageiro, insubstancial e frustrante, não simplesmente algo “sem sentido”.
    reason: lexical_alternative
  - marker: b
    text: Ou “esforço para alcançar o vento”. A expressão hebraica רְעוּת רוּחַ provavelmente descreve uma busca inútil; uma tradução mais literal possível é “pastorear o vento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי
  choice: Vi
  rationale: O qal perfeito na primeira pessoa singular apresenta a observação refletida do Pregador. “Vi” é direto e natural em português; “tenho visto” poderia sugerir ação repetida com mais força do que o hebraico exige.
- source_word: הַמַּעֲשִׂים
  choice: as obras
  rationale: מַעֲשִׂים abrange obras, feitos e ações. “Obras” conserva essa amplitude sem restringir a referência a atos morais.
- source_word: שֶׁנַּעֲשׂוּ
  choice: que se fazem
  rationale: O nifal expressa ação passiva ou impessoal. A construção pronominal é natural em português e mantém o caráter geral daquilo que ocorre no mundo humano.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: debaixo do sol
  rationale: Expressão recorrente de Eclesiastes para a esfera da vida humana terrena. “Debaixo do sol” é clara, tradicional e idiomática em português.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: הִנֵּה chama a atenção para a conclusão do observador. “E eis que” preserva a ênfase retórica em registro digno.
- source_word: הַכֹּל
  choice: tudo
  rationale: Retoma a totalidade das obras observadas. “Tudo” é a forma mais natural e abrangente em português.
- source_word: הֶבֶל
  choice: vapor
  rationale: 'A imagem básica é a de sopro ou vapor: algo transitório, insubstancial e impossível de reter. “Vapor” conserva a metáfora concreta e evita que “vaidade” seja entendida apenas como presunção pessoal ou que “sem sentido” elimine a ambiguidade do termo.'
- source_word: רְעוּת רוּחַ
  choice: correr atrás do vento
  rationale: A expressão difícil provavelmente retrata uma busca inútil. “Correr atrás do vento” comunica de modo natural a imagem e sua frustração, enquanto a possibilidade mais literal é preservada em nota.
theological_decisions: []
