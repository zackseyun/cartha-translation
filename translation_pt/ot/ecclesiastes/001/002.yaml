source:
  edition: WLC
  text: הֲבֵ֤ל הֲבָלִים֙ אָמַ֣ר קֹהֶ֔לֶת הֲבֵ֥ל הֲבָלִ֖ים הַ/כֹּ֥ל הָֽבֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/002.yaml
  text: Breath of breaths[a], says Qoheleth[b]; breath of breaths, all is mere breath.
translation:
  language: pt
  text: Sopro dos sopros[a], diz Qohelet[b]; sopro dos sopros, tudo é mero sopro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico הֶבֶל (hevel) significa literalmente “sopro”, “hálito” ou “vapor”. Nas suas 38 ocorrências em Eclesiastes, a palavra pode evocar ao mesmo tempo aquilo que é passageiro, que não se consegue agarrar ou compreender plenamente e que contraria as expectativas. Nenhuma palavra portuguesa reúne perfeitamente esses sentidos. Aqui se conserva a imagem concreta. A expressão “sopro dos sopros” é um superlativo hebraico, como “Cântico dos Cânticos” ou “Santo dos Santos”. Traduções tradicionais incluem “vaidade” e “futilidade”.
    reason: lexical_choice
  - marker: b
    text: Qohelet é o título ou nome hebraico tradicionalmente traduzido como “Mestre” ou “Pregador”. Essas opções são interpretativas e restringem de modos diferentes o alcance do termo; por isso, ele é transliterado aqui.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶבֶל / הֲבֵל
  choice: sopro / mero sopro
  rationale: O substantivo hebraico designa literalmente sopro, hálito ou vapor e, em Eclesiastes, evoca simultaneamente o que é passageiro, inapreensível e frustrante ou desconcertante. A imagem concreta “sopro” preserva essa amplitude melhor que termos abstratos como “vaidade”, “futilidade” ou “falta de sentido”. Na oração predicativa, “mero sopro” comunica o tom avaliativo e de rebaixamento sem transformar a frase numa afirmação sobre a substância das coisas.
- source_word: הֲבֵל הֲבָלִים
  choice: sopro dos sopros
  rationale: A construção hebraica de nome no singular seguido do plural em relação de posse funciona como superlativo absoluto, à semelhança de “Cântico dos Cânticos” e “Santo dos Santos”. A forma portuguesa conserva tanto a estrutura enfática quanto a imagem concreta.
- source_word: אָמַר
  choice: diz
  rationale: Embora a forma verbal hebraica seja morfologicamente perfeita, nesta fórmula literária ela introduz uma declaração apresentada como vigente. O presente “diz” é natural em português e mantém a vivacidade proverbial.
- source_word: קֹהֶלֶת
  choice: Qohelet
  rationale: A transliteração preserva a abertura semântica do título ou nome hebraico. Traduções como “Mestre”, “Pregador” ou “Orador da assembleia” selecionariam prematuramente apenas uma possibilidade.
- source_word: הַכֹּל
  choice: tudo
  rationale: A forma abrangente “tudo” é idiomática em português e conserva a força totalizante da afirmação hebraica.
theological_decisions:
- issue: Como traduzir הֶבֶל, o motivo dominante de Eclesiastes
  choice: Manter a imagem concreta com “sopro dos sopros” e “mero sopro”.
  alternative: Vaidade; futilidade; absurdo; falta de sentido; efêmero; vapor.
  rationale: Nenhum termo abstrato isolado preserva toda a tensão do hebraico. “Falta de sentido” pode introduzir um niilismo que o argumento não afirma; “vaidade” costuma ser entendida hoje como orgulho ou presunção; “futilidade” destaca sobretudo o fracasso de objetivos. “Sopro” permite que o contexto desenvolva, sem as resolver antecipadamente, as ideias interligadas de transitoriedade, caráter inapreensível e desencontro entre expectativa e resultado.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. A repetição e o paralelismo incisivo do hebraico foram mantidos. “Mero” é usado somente no predicado final para que a frase soe como avaliação enfática, não como definição material de tudo o que existe.
