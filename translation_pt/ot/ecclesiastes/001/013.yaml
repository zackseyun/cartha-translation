base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/013.yaml
  text: And I set my heart to seek and to explore by wisdom all that is done under heaven[b][a]. It is an unhappy task God has given to the sons of man to be occupied with.
translation:
  language: pt
  text: E dediquei meu coração a buscar e a investigar, por meio da sabedoria, tudo o que se faz debaixo do céu. Essa é uma tarefa penosa que Deus deu aos filhos do homem[a], para que se ocupem com ela[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos seres humanos” ou “à humanidade”. O hebraico diz literalmente “aos filhos do homem”, expressão masculina usada de modo genérico para a humanidade.
    reason: lexical_alternative
  - marker: b
    text: Ou “para que sejam afligidos por ela” ou “para que labutem nela”. O hebraico pode expressar tanto ocupar-se com algo quanto ser sobrecarregado ou afligido por isso.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אֶת לִבִּי
  choice: E dediquei meu coração
  rationale: O hebraico diz literalmente “dei meu coração”, expressão que envolve intelecto, vontade e propósito. “Dediquei meu coração” preserva essa dimensão interior e deliberada em português natural.
- source_word: לִדְרוֹשׁ וְלָתוּר
  choice: a buscar e a investigar
  rationale: 'Os dois infinitivos são próximos, mas não idênticos: דרש indica buscar ou indagar, enquanto תור sugere explorar ou examinar. A dupla verbal mantém a ênfase investigativa.'
- source_word: בַּחָכְמָה
  choice: por meio da sabedoria
  rationale: A preposição בְּ indica aqui meio ou instrumento; a formulação explicita que a sabedoria é o meio empregado na investigação.
- source_word: עַל כָּל אֲשֶׁר נַעֲשָׂה
  choice: tudo o que se faz
  rationale: Mantém a construção passiva e o caráter geral da afirmação.
- source_word: תַּחַת הַשָּׁמָיִם
  choice: debaixo do céu
  rationale: Expressão tradicional e inteligível que designa a esfera da vida humana e pode ser mantida de modo consistente em Eclesiastes.
- source_word: עִנְיַן רָע
  choice: uma tarefa penosa
  rationale: עִנְיַן denota ocupação, tarefa ou empreendimento, e רָע ressalta aqui seu caráter aflitivo e oneroso, sem exigir a ideia de mal moral.
- source_word: לִבְנֵי הָאָדָם
  choice: aos filhos do homem
  rationale: Preserva a forma masculina genérica do hebraico, enquanto a nota esclarece que a referência abrange a humanidade.
- source_word: לַעֲנוֹת בּוֹ
  choice: para que se ocupem com ela
  rationale: A forma verbal pode indicar ocupar-se ou ser afligido. A leitura principal expressa envolvimento contínuo com a tarefa, e a nota conserva sua possível nuance de sofrimento e peso.
theological_decisions:
- issue: Se רָע atribui mal moral à tarefa dada por Deus
  choice: tarefa penosa
  alternative: tarefa má
  rationale: No contexto, o adjetivo descreve a experiência onerosa e frustrante da atividade humana. “Penosa” mantém a avaliação negativa sem afirmar além do texto que Deus seja a origem de um mal moral.
- issue: O alcance de לִבְנֵי הָאָדָם
  choice: filhos do homem no texto, com o sentido genérico esclarecido em nota
  alternative: seres humanos / humanidade
  rationale: A tradução preserva a imagem e a forma gramatical do hebraico sem restringir a referência apenas aos homens do sexo masculino.
- issue: A ambiguidade de לַעֲנוֹת בּוֹ
  choice: ocupar-se com ela no texto, com a nuance aflitiva em nota
  alternative: ser afligidos por ela / labutar nela
  rationale: O contexto favorece a ideia de ocupação, mas o verbo também pode carregar o sentido de aflição ou trabalho penoso; a nota evita eliminar essa tensão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A redação mantém o paralelismo dos dois verbos investigativos, a imagem do coração e as ambiguidades relevantes em notas, sem tornar a sintaxe artificial.
