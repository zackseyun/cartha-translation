base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/017.yaml
  text: And I set my heart to know wisdom[a], and to know madness and folly; I came to know that this too is a chasing after wind.
translation:
  language: pt
  text: Empenhei o coração em conhecer a sabedoria e em conhecer a loucura e a insensatez; vim a saber que também isso é correr atrás do vento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esforçar-se para alcançar o vento”; tradicionalmente, “aflição de espírito”.
    reason: Registra uma alternativa para a expressão metafórica hebraica e a tradução tradicional, sem substituir no texto principal a imagem de uma busca inútil.
lexical_decisions:
- source_word: וָאֶתְּנָה לִבִּי
  choice: Apliquei o coração
  rationale: Preserva a imagem hebraica do coração como centro da atenção, da vontade e da reflexão, ao mesmo tempo que expressa a decisão de se dedicar à investigação.
- source_word: לָדַעַת
  choice: a conhecer
  rationale: Mantém o sentido direto de ידע e seu caráter investigativo e experiencial no contexto.
- source_word: חָכְמָה
  choice: sabedoria
  rationale: É o equivalente consagrado e adequado para a sabedoria intelectual e prática investigada em Eclesiastes.
- source_word: וְדַעַת
  choice: e a conhecer
  rationale: 'A repetição verbal torna explícito o paralelismo: conhecer tanto a sabedoria quanto a loucura e a insensatez.'
- source_word: הוֹלֵלוֹת
  choice: loucura
  rationale: Distingue a irracionalidade ou conduta desvairada indicada pelo termo da insensatez mencionada em seguida.
- source_word: שִׂכְלוּת
  choice: insensatez
  rationale: Termo natural no registro sapiencial e contraste apropriado com “sabedoria”.
- source_word: יָדַעְתִּי
  choice: vim a saber
  rationale: Apresenta o conhecimento como resultado alcançado pela investigação, não apenas como um estado prévio.
- source_word: שֶׁגַּם זֶה הוּא
  choice: que também isso é
  rationale: Conserva a fórmula conclusiva e a força aditiva de גַּם.
- source_word: רַעְיוֹן רוּחַ
  choice: correr atrás do vento
  rationale: Comunica de modo claro a imagem de uma busca inútil e inalcançável, preservando a metáfora do vento.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leve tonalidade sapiencial. A repetição de “a conhecer” foi mantida para refletir a estrutura hebraica, e “apliquei o coração” conserva sua imagem antropológica sem recorrer a linguagem excessivamente arcaica.
