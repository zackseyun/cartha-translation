id: ECC.1.12
reference: Ecclesiastes 1:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֲנִ֣י קֹהֶ֗לֶת הָיִ֥יתִי מֶ֛לֶךְ עַל יִשְׂרָאֵ֖ל בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/012.yaml
  text: I[a], Qoheleth, was king over Israel in Jerusalem.
translation:
  language: pt
  text: Eu, Coélet[a], fui rei sobre Israel em Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Coélet também pode ser traduzido como “o Mestre” ou “o Pregador”.
    reason: alternativa lexical
lexical_decisions:
- source_word: אֲנִי
  choice: Eu
  rationale: Mantém o pronome explícito e enfático que abre a autodeclaração.
- source_word: קֹהֶלֶת
  choice: Coélet
  rationale: A transliteração preserva a designação distintiva e de sentido discutido, sem decidir entre ideias como mestre, pregador ou alguém ligado à assembleia.
- source_word: הָיִיתִי
  choice: fui
  rationale: O perfeito qal na primeira pessoa do singular apresenta aqui, de modo retrospectivo, a condição de ter sido rei; o pretérito perfeito é natural em português.
- source_word: מֶלֶךְ
  choice: rei
  rationale: Predicativo após o verbo 'ser'; em português, 'fui rei' expressa naturalmente o cargo sem artigo.
- source_word: עַל
  choice: sobre
  rationale: Reflete diretamente a ideia de governo e autoridade exercida sobre Israel.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Forma tradicional e corrente do nome próprio em português.
- source_word: בִּירוּשָׁלָם
  choice: em Jerusalém
  rationale: Traduz naturalmente o uso locativo da preposição hebraica.
theological_decisions:
- issue: Traduzir קֹהֶלֶת como título ou preservar a designação transliterada
  choice: Coélet
  alternative: o Mestre; o Pregador; aquele que reúne ou fala à assembleia
  rationale: O sentido exato do termo hebraico é debatido e ele funciona como designação característica da voz do livro. A transliteração conserva essa ambiguidade sem impor uma interpretação mais estreita.
translation_notes:
  register: Português moderno, claro e digno, com forma amplamente reconhecível no Brasil. A ordem 'Eu, Coélet' conserva a ênfase da identificação hebraica; 'fui rei sobre Israel' mantém tanto o caráter retrospectivo quanto a relação de governo expressa no original.
