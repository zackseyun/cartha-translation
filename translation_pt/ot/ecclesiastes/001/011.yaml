  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação preserva a ampla referência temporal de רִאשֹׁנִים e אַחֲרֹנִים e a repetição enfática de ‘lembrança’, ao mesmo tempo que esclarece naturalmente os três momentos sucessivos.
