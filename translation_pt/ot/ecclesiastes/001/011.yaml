  text: אֵ֥ין זִכְר֖וֹן לָ/רִאשֹׁנִ֑ים וְ/גַ֨ם לָ/אַחֲרֹנִ֜ים שֶׁ/יִּהְי֗וּ לֹֽא יִהְיֶ֤ה לָ/הֶם֙ זִכָּר֔וֹן עִ֥ם שֶׁ/יִּהְי֖וּ לָ/אַחֲרֹנָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/011.yaml
  text: There is no remembrance of the former ones[a], and even of the later ones who will be, there will be no remembrance among those who will come afterward.
translation:
  language: pt
  text: Não há lembrança dos que vieram antes[a]; e mesmo dos que virão depois não haverá lembrança entre os que vierem ainda mais tarde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não há memória dos anteriores; e mesmo os posteriores, que ainda existirão, não terão memória entre os que vierem mais tarde.”'
    reason: 'Alternativa lexical e sintática: o hebraico permite entender a construção em termos de memória possuída pelos grupos, além de lembrança a respeito deles.'
lexical_decisions:
- source_word: אֵין
  choice: Não há
  rationale: Expressa de modo natural em português a negação existencial que introduz a afirmação.
- source_word: זִכְרוֹן / זִכָּרוֹן
  choice: lembrança
  rationale: Conserva o sentido abstrato de recordação ou memória duradoura e permite reproduzir a repetição hebraica.
- source_word: לָרִאשֹׁנִים
  choice: dos que vieram antes
  rationale: Mantém a referência ampla aos anteriores ou predecessores sem restringi-la explicitamente a pessoas, gerações ou acontecimentos.
- source_word: וְגַם
  choice: e mesmo
  rationale: Transmite tanto a coordenação quanto a ênfase do hebraico.
- source_word: לָאַחֲרֹנִים שֶׁיִּהְיוּ
  choice: dos que virão depois
  rationale: Representa naturalmente os posteriores que ainda existirão, preservando o contraste temporal com os anteriores.
- source_word: לֹא יִהְיֶה לָהֶם זִכָּרוֹן
  choice: não haverá lembrança
  rationale: Reproduz a construção existencial e, no contexto, deixa claro que se trata da lembrança dos posteriores, evitando repetição pesada em português.
- source_word: עִם
  choice: entre
  rationale: Indica o âmbito relacional ou social no qual essa lembrança não existirá.
- source_word: שֶׁיִּהְיוּ לָאַחֲרֹנָה
  choice: os que vierem ainda mais tarde
  rationale: Torna clara a sequência entre os posteriores e um grupo subsequente, sem recorrer à possível leitura escatológica de 'no fim'.
