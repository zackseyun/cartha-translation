  text: The words of Qoheleth[a], son of David, king in Jerusalem.
translation:
  language: pt
  text: Palavras de Coélet[a], filho de Davi, rei em Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Coélet é a designação hebraica do locutor; pode significar “o Mestre”, “o Pregador” ou alguém ligado à assembleia.
    reason: 'Alternativa lexical: o significado preciso de קֹהֶלֶת é incerto.'
lexical_decisions:
- source_word: דִּבְרֵי
  choice: Palavras de
  rationale: O plural construto de דָּבָר introduz o conteúdo do livro. “Palavras” é direto, natural e menos interpretativo que “ditos”.
- source_word: קֹהֶלֶת
  choice: Coélet
  rationale: A transliteração tradicional e legível em português preserva a designação hebraica e sua ambiguidade, sem decidir no texto principal entre sentidos como “Mestre”, “Pregador” ou alguém ligado à assembleia.
- source_word: בֶּן דָּוִד
  choice: filho de Davi
  rationale: Reproduz diretamente a expressão filial hebraica e conserva sua possível ressonância régia.
- source_word: מֶלֶךְ
  choice: rei
  rationale: Equivalente português comum e exato de מֶלֶךְ.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: A preposição בְּ tem sentido locativo; “em Jerusalém” é a formulação natural no português moderno.
theological_decisions:
- issue: Traduzir קֹהֶלֶת como título funcional ou preservar a designação transliterada
  choice: Coélet no texto principal
  alternative: o Mestre; o Pregador; alguém ligado à assembleia
  rationale: O sentido exato da designação hebraica é discutido e relevante para a identidade literária do locutor. A transliteração preserva a ambiguidade genuína, enquanto a nota apresenta as principais possibilidades.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem concisa do hebraico foi preservada sem produzir construção artificial.
