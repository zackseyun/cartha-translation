base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/023.yaml
  text: All this I tested by wisdom[a]. I said[c][b], “I will become wise,” but it was far from me.
translation:
  language: pt
  text: 'Tudo isso pus à prova por meio da sabedoria. Eu disse: “Serei sábio”, mas ela estava longe de mim.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, a sabedoria continuava distante, fora do seu alcance.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל זֹה
  choice: Tudo isso
  rationale: O demonstrativo singular após כָּל retoma como um todo as reflexões anteriores; “tudo isso” é natural e fiel em português.
- source_word: נִסִּיתִי
  choice: pus à prova
  rationale: O piel de נסה exprime testar ou provar; “pus à prova” preserva o caráter investigativo e avaliativo da busca de Qohelet.
- source_word: בַחָכְמָה
  choice: por meio da sabedoria
  rationale: A preposição ב indica aqui meio ou instrumento. A formulação explicita com naturalidade que a sabedoria foi o meio empregado na investigação.
- source_word: אָמַרְתִּי
  choice: Eu disse
  rationale: Mantém o sentido comum do verbo hebraico, podendo introduzir naturalmente uma decisão ou aspiração interior.
- source_word: אֶחְכָּמָה
  choice: Serei sábio
  rationale: A forma expressa intenção ou aspiração de alcançar sabedoria. “Serei sábio” preserva a concisão e a tensão do original, sem definir se o foco é tornar-se sábio ou adquirir sabedoria.
- source_word: וְהִיא
  choice: mas ela
  rationale: O pronome feminino retoma “sabedoria”; embora ו seja formalmente aditivo, o contexto pede uma relação adversativa em português.
- source_word: רְחוֹקָה מִמֶּנִּי
  choice: estava longe de mim
  rationale: Reproduz diretamente a imagem espacial do hebraico, sem substituí-la no texto principal pela interpretação “fora do meu alcance”.
