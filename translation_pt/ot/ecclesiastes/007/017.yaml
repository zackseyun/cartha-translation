  text: אַל תִּרְשַׁ֥ע הַרְבֵּ֖ה וְ/אַל תְּהִ֣י סָכָ֑ל לָ֥/מָּה תָמ֖וּת בְּ/לֹ֥א עִתֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/017.yaml
  text: Do not be excessively wicked, and do not be a fool. Why should you die before your time?
translation:
  language: pt
  text: Não seja excessivamente perverso[a], nem seja insensato. Por que você morreria antes do seu tempo?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não seja perverso demais”. O hebraico contém um termo de grau, criando uma tensão deliberada com o contexto, sem aprovar qualquer medida de perversidade.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “não em seu tempo”. Isto é, antes do tempo próprio ou esperado.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּרְשַׁע
  choice: seja perverso
  rationale: O Qal de רשע descreve aqui conduta ou caráter moralmente perverso. “Ser perverso” preserva essa categoria moral em português claro e digno.
- source_word: הַרְבֵּה
  choice: em excesso
  rationale: O termo de grau modifica a proibição. “Em excesso” conserva a formulação provocativa do hebraico sem apagar sua tensão no contexto.
- source_word: תְּהִי סָכָל
  choice: seja insensato
  rationale: A construção היה + סכל caracteriza a pessoa como insensata. A forma adjetival é natural em português e mantém o sentido sapiencial, sem recorrer ao mais coloquial “tolo”.
- source_word: לָמָּה
  choice: Por que
  rationale: Introduz uma pergunta retórica de advertência; “Por que” reproduz seu caráter direto e natural.
- source_word: תָמוּת
  choice: você morreria
  rationale: O futuro/imperfectivo na pergunta retórica tem força potencial e admonitória. O condicional português expressa naturalmente “por que haveria de morrer?”.
- source_word: בְּלֹא עִתֶּךָ
  choice: antes do seu tempo
  rationale: Equivalente idiomático da expressão literalmente próxima de “quando não é o seu tempo”, comunicando morte prematura sem acrescentar explicitamente a ideia de tempo decretado.
theological_decisions:
- issue: Se a expressão deve parecer aprovar uma medida moderada de perversidade
  choice: Manter o termo de grau em “não seja perverso em excesso”
  alternative: Não seja perverso de modo algum
  rationale: O hebraico contém הַרְבֵּה, um termo de grau, em paralelo à formulação provocativa do versículo anterior. A tradução preserva deliberadamente essa tensão sapiencial, enquanto a nota esclarece que o texto não aprova qualquer grau de perversidade.
- issue: Se עִתֶּךָ designa explicitamente um tempo divinamente determinado
  choice: seu tempo
  alternative: seu tempo determinado
  rationale: O substantivo hebraico diz simplesmente “seu tempo”. Inserir “determinado” ou “designado” resolveria uma questão teológica que o verso não explicita.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é direto e digno. “Em excesso” conserva a tensão do original; “insensato” se ajusta ao vocabulário sapiencial; e “antes do seu tempo” comunica idiomaticamente a morte prematura.
