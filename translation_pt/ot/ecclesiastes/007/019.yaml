base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/019.yaml
  text: Wisdom gives strength to a wise man more than ten rulers who were in a city[a].
translation:
  language: pt
  text: A sabedoria dá ao sábio mais força do que dez governantes que havia numa cidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na cidade”. A forma hebraica pode ser entendida como definida, mas o dito parece geral, sem referência necessária a uma cidade específica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחָכְמָה
  choice: A sabedoria
  rationale: O artigo hebraico é representado naturalmente em português; o substantivo abstrato não implica personificação teológica.
- source_word: תָּעֹז
  choice: dá ... força
  rationale: Expressa com clareza e naturalidade o sentido de conferir ou proporcionar força, preservando o valor causativo no contexto.
- source_word: לֶחָכָם
  choice: ao sábio
  rationale: A preposição ל marca o beneficiário; o singular substantivado mantém a referência proverbial a uma pessoa sábia sem acrescentar 'homem' ao texto.
- source_word: מֵעֲשָׂרָה
  choice: mais ... do que dez
  rationale: A preposição מ introduz a comparação, indicando que a força proporcionada pela sabedoria supera a dos dez governantes.
- source_word: שַׁלִּיטִים
  choice: governantes
  rationale: Designa pessoas que exercem autoridade ou domínio; 'governantes' é amplo, claro e adequado ao cenário urbano.
- source_word: אֲשֶׁר הָיוּ בָּעִיר
  choice: que havia numa cidade
  rationale: A oração modifica os dez governantes. 'Numa cidade' comunica bem o caráter geral do provérbio, enquanto a forma hebraica também admite leitura definida.
theological_decisions: []
translation_notes:
  register: Português atual, digno e de leitura ampla, com sintaxe proverbial natural. A construção 'dá ao sábio mais força' preserva a comparação e evita explicitar além do hebraico a natureza da força exercida pelos governantes.
