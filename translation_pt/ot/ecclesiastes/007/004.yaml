translation_notes:
  register: Português moderno, claro e digno, com paralelismo proverbial preservado. “Casa do luto” mantém a imagem concreta do hebraico; “casa da alegria” evita o tom arcaico de “folguedo”, enquanto a nota esclarece o sentido festivo provável.
