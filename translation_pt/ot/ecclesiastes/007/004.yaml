base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/004.yaml
  text: The heart of the wise is in the house of mourning[a], but the heart of fools is in the house of mirth.
translation:
  language: pt
  text: O coração dos sábios está na casa do luto, mas o coração dos tolos está na casa da alegria[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “júbilo” ou “contentamento”. O termo hebraico pode indicar alegria em sentido amplo, mas aqui provavelmente se refere à celebração festiva em contraste com o luto.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: coração
  rationale: Preserva a imagem hebraica e, neste dito sapiencial, designa a orientação interior, a atenção e a disposição da pessoa, não apenas suas emoções.
- source_word: חֲכָמִים
  choice: os sábios
  rationale: O adjetivo plural tem função substantiva. A forma é concisa, inclusiva e natural no estilo proverbial.
- source_word: בֵּית
  choice: casa
  rationale: É o equivalente direto e mantém o paralelismo concreto entre a casa do luto e a casa da alegria.
- source_word: אֵבֶל
  choice: luto
  rationale: O termo indica lamento ou luto, especialmente ligado à morte; “casa do luto” comunica com clareza esse cenário.
- source_word: וְ
  choice: mas
  rationale: Embora a conjunção normalmente corresponda a “e”, aqui ela introduz o segundo membro de uma antítese, para a qual “mas” é natural em português.
- source_word: כְּסִילִים
  choice: os tolos
  rationale: É a designação tradicional e inteligível da categoria moral e intelectual própria da literatura sapiencial.
- source_word: שִׂמְחָה
  choice: alegria
  rationale: É a tradução portuguesa mais corrente e abrangente. No contexto, refere-se à alegria festiva contrastada com o luto, nuance explicitada em nota.
