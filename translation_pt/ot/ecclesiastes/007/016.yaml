base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/016.yaml
  text: Do not be overly righteous[a], and do not make yourself too wise[b]. Why should you ruin yourself?
translation:
  language: pt
  text: Não seja justo demais[a] nem se faça sábio em excesso. Por que você haveria de se arruinar?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não seja justo em excesso”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Por que você haveria de se destruir?” O verbo hebraico também pode ter o sentido de ficar desolado, devastado ou estarrecido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּהִי
  choice: Não seja
  rationale: A partícula negativa אַל seguida do imperfeito expressa uma proibição ou advertência; “não seja” reproduz esse tom com naturalidade em português.
- source_word: צַדִּיק הַרְבֵּה
  choice: justo demais
  rationale: צַדִּיק significa “justo”, e הַרְבֵּה indica aqui grau excessivo. A formulação mantém a tensão do hebraico sem explicar no corpo do texto em que consiste esse excesso.
- source_word: וְאַל תִּתְחַכַּם יוֹתֵר
  choice: nem se faça sábio em excesso
  rationale: O hitpael de חכם contém uma nuance reflexiva, que “se faça sábio” procura preservar; יוֹתֵר assinala excesso.
- source_word: לָמָּה
  choice: Por que você haveria de
  rationale: Introduz uma pergunta retórica de advertência. A construção escolhida soa natural em português moderno e conserva sua força exortativa.
- source_word: תִּשּׁוֹמֵם
  choice: causar a própria ruína
  rationale: O verbo שמם pode comunicar devastação, desolação ou espanto. Neste contexto, a expressão transmite de modo claro o provável resultado autodestrutivo, enquanto a nota preserva outras possibilidades lexicais.
theological_decisions:
- issue: Sentido da advertência contra ser justo e sábio em excesso
  choice: Manter literalmente a advertência contra o excesso, sem definir no texto se se trata de pretensão, rigor ou autossuficiência.
  alternative: Explicitar como “não seja justo aos próprios olhos” ou “não ostente justiça”.
  rationale: Embora o contexto possa sugerir justiça pretensiosa ou um rigor autodestrutivo, o hebraico não especifica isso. A tradução preserva a tensão e evita sugerir que a justiça ou a sabedoria genuínas sejam, em si mesmas, condenáveis.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você”. “Justo demais” é idiomático; “se faça sábio em excesso” conserva deliberadamente a nuance reflexiva e a estranheza provocadora do original.
