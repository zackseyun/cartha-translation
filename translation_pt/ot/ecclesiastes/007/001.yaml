source:
  edition: WLC
  text: ט֥וֹב שֵׁ֖ם מִ/שֶּׁ֣מֶן ט֑וֹב וְ/י֣וֹם הַ/מָּ֔וֶת מִ/יּ֖וֹם הִוָּלְדֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/001.yaml
  text: A good name is better than good oil[a], and the day of death than the day of one's birth.
translation:
  language: pt
  text: Um bom nome é melhor do que um bom óleo[a], e o dia da morte, melhor do que o dia do nascimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um perfume fino” ou “um unguento precioso”; o hebraico diz literalmente “um bom óleo”.
    reason: alternativa lexical
lexical_decisions:
- source_word: טוֹב שֵׁם
  choice: um bom nome
  rationale: Preserva o equivalente direto de שֵׁם e seu sentido proverbial de reputação; טוֹב permanece como “bom”, enquanto a comparação expressa por מִן exige “é melhor do que” em português.
- source_word: מִשֶּׁמֶן טוֹב
  choice: do que um bom óleo
  rationale: Mantém de modo transparente a imagem hebraica de óleo de boa qualidade, possivelmente perfumado, sem restringir no texto principal o sentido a perfume ou unguento.
- source_word: וְיוֹם הַמָּוֶת
  choice: e o dia da morte
  rationale: Reproduz a expressão definida e seu caráter proverbial e genérico.
- source_word: מִיּוֹם
  choice: melhor do que o dia
  rationale: A segunda oração é elíptica no hebraico; a repetição de “melhor” em português deixa clara a comparação subentendida sem alterar seu conteúdo.
- source_word: הִוָּלְדוֹ
  choice: do nascimento
  rationale: O hebraico diz literalmente “do seu nascer”, com sufixo masculino singular representativo. Em português, “o dia do nascimento” comunica naturalmente a máxima genérica sem introduzir um referente masculino ambíguo.
theological_decisions:
- issue: Sufixo masculino singular representativo em הִוָּלְדוֹ
  choice: do nascimento
  alternative: do seu nascimento
  rationale: Embora o sufixo seja masculino singular, seu uso aqui é genericamente humano. A forma sem possessivo é natural em português e preserva a abrangência proverbial, sem acrescentar uma especificação de gênero que o contexto não enfatiza.
- issue: Elipse comparativa na segunda oração
  choice: repetir “melhor”
  alternative: 'manter a elipse: “e o dia da morte do que o dia do nascimento”'
  rationale: O hebraico omite o adjetivo na segunda metade por paralelismo. Em português, a repetição é necessária para uma frase clara e idiomática, sem resolver a tensão intencional da afirmação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o paralelismo proverbial e a imagem concreta do hebraico, esclarecendo apenas a elipse comparativa exigida pela sintaxe portuguesa.
