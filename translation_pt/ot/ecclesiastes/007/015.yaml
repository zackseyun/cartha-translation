source:
  edition: WLC
  text: אֶת הַ/כֹּ֥ל רָאִ֖יתִי בִּ/ימֵ֣י הֶבְלִ֑/י יֵ֤שׁ צַדִּיק֙ אֹבֵ֣ד בְּ/צִדְק֔/וֹ וְ/יֵ֣שׁ רָשָׁ֔ע מַאֲרִ֖יךְ בְּ/רָעָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/015.yaml
  text: 'I have seen it all in the days of my vanity: there is a righteous man perishing in his righteousness[c][b][a], and there is a wicked man prolonging his life in his evil.'
translation:
  language: pt
  text: 'Tudo isso vi nos dias da minha vida fugaz[a]: há um justo que perece em sua justiça[b], e há um perverso que prolonga sua vida em sua maldade[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nos dias da minha transitoriedade” ou “nos dias do meu vapor”. O hebraico הֶבֶל, palavra-chave em Eclesiastes, sugere transitoriedade, caráter elusivo e frustração.
    reason: lexical_alternative
  - marker: b
    text: Ou “perece apesar de sua justiça”. O hebraico admite mais de uma relação de sentido; o texto principal preserva essa ambiguidade.
    reason: alternative_reading
  - marker: c
    text: Ou “prolonga sua vida apesar de sua maldade” ou “prolonga seus dias em sua maldade”.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶת הַכֹּל
  choice: Tudo isso
  rationale: Com רָאִיתִי, a expressão abrange o conjunto das experiências observadas. “Tudo isso” é natural em português e liga a afirmação ao contexto sem especificar demais o referente.
- source_word: רָאִיתִי
  choice: vi
  rationale: O perfeito hebraico apresenta uma observação resultante da experiência. O pretérito perfeito simples é a forma mais natural em português neste contexto reflexivo.
- source_word: בִּימֵי הֶבְלִי
  choice: nos dias da minha vida fugaz
  rationale: הֶבֶל evoca vapor, transitoriedade, caráter elusivo e frustração. Aqui, a expressão se refere aos dias passageiros da vida do autor, não à vaidade como orgulho moral. “Vida fugaz” comunica esse sentido com clareza, enquanto a nota conserva outras imagens possíveis.
- source_word: יֵשׁ ... וְיֵשׁ
  choice: há ... e há
  rationale: A construção existencial introduz dois casos observados e mantém o paralelismo aforístico do hebraico.
- source_word: צַדִּיק
  choice: um justo
  rationale: O adjetivo masculino singular substantivado designa um indivíduo representativo. “Um justo” é corrente, conciso e preserva o gênero gramatical da forma hebraica.
- source_word: אֹבֵד
  choice: perece
  rationale: O particípio pode denotar perecimento, ruína ou morte. “Perece” mantém essa amplitude melhor do que uma formulação limitada apenas ao ato de morrer.
- source_word: בְּצִדְקוֹ
  choice: em sua justiça
  rationale: A tradução relativamente formal de בְּ preserva a possibilidade de circunstância, concessão ou causa, sem decidir entre “apesar de” e “por causa de”.
- source_word: רָשָׁע
  choice: um perverso
  rationale: O masculino singular substantivado apresenta outro indivíduo representativo. “Perverso” expressa oposição moral ao justo e soa natural no registro sapiencial.
- source_word: מַאֲרִיךְ
  choice: prolonga a vida
  rationale: O hifil de ארך significa tornar longo ou prolongar. “A vida” explicita em português o objeto implícito, provavelmente a duração da existência.
- source_word: בְּרָעָתוֹ
  choice: em sua maldade
  rationale: “Em sua maldade” conserva o paralelismo com “em sua justiça” e não resolve a flexibilidade semântica da preposição hebraica.
theological_decisions:
- issue: Sentido de הֶבְלִי em Eclesiastes
  choice: “Minha vida fugaz”, entendendo a expressão como referência à existência transitória e elusiva do observador.
  alternative: “Minha vaidade”, “meu vapor” ou “minha transitoriedade”.
  rationale: Neste verso, הֶבֶל não afirma orgulho pecaminoso. A escolha comunica a brevidade da vida e mantém em nota a imagem característica de vapor, sem reduzir o termo somente à inutilidade.
- issue: Força de ב em בְּצִדְקוֹ e בְּרָעָתוֹ
  choice: “Em sua justiça” e “em sua maldade”, preservando a formulação aberta do hebraico.
  alternative: “Apesar de sua justiça/maldade” ou “por causa de sua justiça/maldade”.
  rationale: A preposição pode indicar circunstância, concessão ou causa. Não explicitar uma dessas relações evita impor uma conclusão teológica mais definida do que o texto permite.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo “há um justo... e há um perverso” reproduz a estrutura sapiencial. Evitou-se “vaidade” no texto principal porque, no português corrente, ela pode sugerir sobretudo orgulho pessoal; a imagem e a amplitude temática de הֶבֶל foram preservadas em nota.
