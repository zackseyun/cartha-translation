base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/009.yaml
  text: Do not be quick in your spirit to become angry[a], for anger rests in the bosom of fools.
translation:
  language: pt
  text: Não se apresse, em seu espírito, a irar-se, pois a ira repousa no colo dos tolos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no seio dos tolos”. O hebraico retrata a ira como algo que se instala bem perto deles, em lugar íntimo.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּבַהֵל
  choice: se apresse
  rationale: O piel imperfeito com אַל proíbe a prontidão impulsiva; no contexto, a ideia é não se deixar levar rapidamente à ira.
- source_word: בְּרוּחֲךָ
  choice: em seu espírito
  rationale: Mantém a imagem hebraica da disposição interior, sem reduzi-la simplesmente a 'temperamento'.
- source_word: לִכְעוֹס
  choice: a ficar irado
  rationale: Expressa de modo natural a entrada no estado de ira sugerida pelo infinitivo.
- source_word: כִּי
  choice: pois
  rationale: Introduz de maneira clara e concisa a razão da proibição.
- source_word: כַעַס
  choice: a ira
  rationale: É a tradução direta e contextualmente adequada do substantivo, retomando a ideia verbal da primeira oração.
- source_word: בְּחֵיק
  choice: no íntimo
  rationale: Comunica em português corrente a proximidade interior da imagem de colo ou seio, enquanto a nota preserva a metáfora concreta.
- source_word: כְּסִילִים
  choice: dos tolos
  rationale: Preserva o termo característico da literatura sapiencial para pessoas moral e intelectualmente insensatas.
- source_word: יָנוּחַ
  choice: repousa
  rationale: Mantém a imagem de a ira se instalar e permanecer à vontade junto aos tolos.
