id: ECC.7.14
reference: Ecclesiastes 7:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בְּ/י֤וֹם טוֹבָה֙ הֱיֵ֣ה בְ/ט֔וֹב וּ/בְ/י֥וֹם רָעָ֖ה רְאֵ֑ה גַּ֣ם אֶת זֶ֤ה לְ/עֻמַּת זֶה֙ עָשָׂ֣ה הָֽ/אֱלֹהִ֔ים עַל דִּבְרַ֗ת שֶׁ/לֹּ֨א יִמְצָ֧א הָֽ/אָדָ֛ם אַחֲרָ֖י/ו מְאֽוּמָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/014.yaml
  text: 'In a day of prosperity[a], be joyful; and in a day of adversity, consider: God has made the one as well as the other[c][b], so that man may not find out anything that will come after him.'
translation:
  language: pt
  text: 'No dia da prosperidade, desfrute o bem[a]; no dia da adversidade, reflita: Deus fez tanto um como o outro, para que o ser humano[b] não descubra nada do que virá depois dele[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “alegre-se” ou “aproveite os bons tempos”. A expressão hebraica é idiomática.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “o homem”, empregado aqui em sentido representativo para a humanidade.
    reason: lexical_alternative
  - marker: c
    text: 'Ou, mais literalmente: “não descubra coisa alguma depois dele”; isto é, não consiga saber o que acontecerá no futuro.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיוֹם טוֹבָה
  choice: No dia da prosperidade
  rationale: יוֹם com o substantivo abstrato טוֹבָה indica uma ocasião ou circunstância favorável, e não apenas um dia do calendário; “prosperidade” expressa o contraste com a adversidade.
- source_word: הֱיֵה בְטוֹב
  choice: desfrute o bem
  rationale: A expressão é idiomática. “Desfrute o bem” comunica naturalmente a exortação a acolher e aproveitar a condição favorável, sem reduzir o sentido apenas a um estado emocional.
- source_word: וּבְיוֹם רָעָה
  choice: no dia da adversidade
  rationale: רָעָה, neste contraste sapiencial, denota calamidade ou infortúnio, não maldade moral.
- source_word: רְאֵה
  choice: reflita
  rationale: O imperativo de ראה aqui pede percepção ponderada, não mera visão física; “reflita” transmite a força contemplativa.
- source_word: גַּם אֶת זֶה לְעֻמַּת זֶה
  choice: tanto um como o outro
  rationale: A formulação apresenta prosperidade e adversidade como realidades correspondentes, colocadas uma diante da outra.
- source_word: עָשָׂה הָאֱלֹהִים
  choice: Deus fez
  rationale: Preserva a atribuição explícita a Deus da existência ou disposição das duas condições, sem acrescentar uma explicação metafísica.
- source_word: עַל דִּבְרַת
  choice: para que
  rationale: A locução introduz propósito ou resultado; “para que” é clara e natural em português.
- source_word: שֶׁלֹּא יִמְצָא הָאָדָם
  choice: para que o ser humano não descubra
  rationale: יִמְצָא tem aqui o sentido de descobrir ou chegar a saber. הָאָדָם é singular e representativo da humanidade; “o ser humano” conserva esse valor genérico em português atual.
- source_word: אַחֲרָיו
  choice: do que virá depois dele
  rationale: A expressão pode apontar para o que acontecerá depois da pessoa, isto é, para o futuro que ela não consegue conhecer; a nota preserva a formulação mais literal e sua ambiguidade.
- source_word: מְאוּמָה
  choice: nada
  rationale: Sob negação, מְאוּמָה significa “coisa alguma”; “nada” é a formulação idiomática em português.
theological_decisions:
- issue: A ação divina na prosperidade e na adversidade
  choice: Deus fez tanto um como o outro
  alternative: Deus dispôs um em correspondência ao outro
  rationale: O hebraico atribui explicitamente ambas as condições à ação de Deus. A tradução mantém essa tensão sem atenuá-la nem formular uma teodiceia além do versículo.
- issue: O referente genérico de הָאָדָם
  choice: o ser humano
  alternative: o homem
  rationale: O substantivo hebraico está no singular e representa a humanidade. “O ser humano” comunica esse alcance genérico com clareza no português contemporâneo; a forma mais literal é registrada em nota.
- issue: O alcance de אַחֲרָיו
  choice: o que virá depois dele
  alternative: o que há depois dele
  rationale: A leitura contextual aponta para o futuro desconhecido, mas a construção hebraica permanece concisa e admite uma formulação menos explicitamente temporal; a nota retém essa ambiguidade.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção concisa de caráter sapiencial. O ponto e vírgula mantém o paralelismo entre prosperidade e adversidade; as notas registram as principais alternativas sem resolver indevidamente a ambiguidade do hebraico.
