  text: כִּ֛י גַּם פְּעָמִ֥ים רַבּ֖וֹת יָדַ֣ע לִבֶּ֑/ךָ אֲשֶׁ֥ר גַּם את קִלַּ֥לְתָּ אֲחֵרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/022.yaml
  text: For your heart knows that many times you yourself have also cursed others[a].
translation:
  language: pt
  text: Pois o seu coração sabe que muitas vezes você também amaldiçoou outras pessoas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “insultou outras pessoas” ou “falou mal de outras pessoas”. O verbo hebraico pode indicar uma maldição proferida, mas, neste contexto, talvez se refira de modo mais amplo a insultar alguém ou falar contra alguém.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão para a advertência anterior e conserva de modo natural a força explicativa da conjunção.
- source_word: גַּם
  choice: não expresso separadamente
  rationale: O valor aditivo do primeiro גַּם fica suficientemente comunicado pelo desenvolvimento da frase; traduzi-lo de forma explícita produziria uma repetição pouco natural em português.
- source_word: פְּעָמִים רַבּוֹת
  choice: muitas vezes
  rationale: Reproduz de perto a expressão hebraica, literalmente referente a numerosas ocasiões, e é idiomática em português.
- source_word: יָדַע
  choice: sabe
  rationale: Embora a forma verbal hebraica seja perfeita, aqui ela comunica conhecimento pessoal consolidado; o presente expressa naturalmente esse sentido experiencial.
- source_word: לִבְּךָ
  choice: o seu coração
  rationale: Mantém a imagem hebraica do coração como centro da consciência, do pensamento e da vida interior.
- source_word: אֲשֶׁר
  choice: que
  rationale: Introduz diretamente o conteúdo daquilo que o coração sabe.
- source_word: גַּם אַתָּה
  choice: você também
  rationale: Preserva a inclusão enfática do destinatário sem recorrer à formulação mais pesada 'você mesmo também'.
- source_word: קִלַּלְתָּ
  choice: amaldiçoou
  rationale: É o equivalente mais direto do verbo hebraico e mantém a correspondência com a ideia de ser amaldiçoado no contexto imediato; a possível amplitude do termo é registrada em nota.
- source_word: אֲחֵרִים
  choice: outras pessoas
  rationale: Expressa com clareza e naturalidade o plural indefinido referente a outros seres humanos.
theological_decisions: []
