  text: Wisdom is good with an inheritance[b][a], and an advantage to those who see the sun.
translation:
  language: pt
  text: A sabedoria é boa junto com uma herança[a] e é uma vantagem para os que veem o sol.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A sabedoria é tão boa quanto uma herança”. A construção hebraica pode comparar a sabedoria com a herança ou recomendar a sabedoria junto com uma herança.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “os que veem o sol” é uma maneira de se referir aos vivos, aos que estão neste mundo.
    reason: cultural_note
lexical_decisions:
- source_word: טוֹבָה
  choice: é boa
  rationale: O adjetivo predicativo significa “boa”; o verbo de ligação, ausente na oração nominal hebraica, é naturalmente expresso em português. Não se introduz o comparativo “melhor”, que não está explícito.
- source_word: חָכְמָה
  choice: a sabedoria
  rationale: Tradução usual no contexto de Eclesiastes, abrangendo discernimento e habilidade prática, não apenas conhecimento abstrato.
- source_word: עִם
  choice: quando vem com
  rationale: Expressa de maneira natural em português a associação entre sabedoria e herança. A nota preserva a possível leitura comparativa da construção.
- source_word: נַחֲלָה
  choice: uma herança
  rationale: Mantém o sentido de bem ou patrimônio recebido por herança, sem ampliá-lo genericamente para “riqueza”.
- source_word: וְיֹתֵר
  choice: e é uma vantagem
  rationale: יֹתֵר pode indicar excedente, proveito ou vantagem; a formulação nominal se ajusta à construção com לְ e à concisão do hebraico.
- source_word: לְרֹאֵי
  choice: para os que veem
  rationale: A preposição לְ é vertida idiomaticamente por “para”, e o particípio é preservado de modo literal.
- source_word: הַשָּׁמֶשׁ
  choice: o sol
  rationale: Preserva a imagem característica de Eclesiastes; a nota esclarece que a expressão se refere aos vivos.
