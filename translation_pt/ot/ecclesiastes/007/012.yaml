reference: Ecclesiastes 7:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֛י בְּ/צֵ֥ל הַֽ/חָכְמָ֖ה בְּ/צֵ֣ל הַ/כָּ֑סֶף וְ/יִתְר֣וֹן דַּ֔עַת הַֽ/חָכְמָ֖ה תְּחַיֶּ֥ה בְעָלֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/012.yaml
  text: For wisdom is a shelter just as money is a shelter[b][a], but the advantage of knowledge is that wisdom preserves the life of its possessors.
translation:
  language: pt
  text: 'Pois a sabedoria oferece abrigo, assim como o dinheiro oferece abrigo[a]; mas a vantagem do conhecimento é esta: a sabedoria preserva a vida de quem a possui[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “à sombra da sabedoria, à sombra do dinheiro”. No hebraico, a sombra é uma imagem de proteção ou abrigo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a sabedoria dá vida a quem a possui” ou “mantém vivo quem a possui”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação do que precede e mantém de modo natural a ligação discursiva.
- source_word: בְּצֵל
  choice: oferece abrigo
  rationale: A expressão significa literalmente “à sombra de” e emprega a sombra como imagem de proteção; “oferece abrigo” comunica essa função em português corrente.
- source_word: הַחָכְמָה
  choice: a sabedoria
  rationale: É a tradução usual de חָכְמָה e se ajusta ao sentido prático e existencial do termo em Eclesiastes.
- source_word: בְּצֵל הַכָּסֶף
  choice: o dinheiro oferece abrigo
  rationale: כֶּסֶף pode designar prata ou dinheiro; aqui, o valor econômico é o mais provável, em paralelo com a proteção prática oferecida pela sabedoria.
- source_word: וְיִתְרוֹן
  choice: mas a vantagem
  rationale: יִתְרוֹן expressa vantagem, proveito ou ganho. A conjunção foi vertida de forma adversativa porque a segunda metade qualifica o paralelo anterior ao destacar a vantagem própria da sabedoria.
- source_word: דַּעַת
  choice: do conhecimento
  rationale: Preserva o sentido cognitivo do substantivo e a construção compacta e algo difícil do hebraico, sem identificar conhecimento e sabedoria de maneira excessivamente explícita.
- source_word: תְּחַיֶּה
  choice: preserva a vida de
  rationale: O Piel de חיה pode significar conservar vivo, dar vida ou vivificar. No contexto de proteção, “preserva a vida” é natural, enquanto a nota mantém a amplitude lexical.
- source_word: בְעָלֶיהָ
  choice: quem a possui
  rationale: Expressa naturalmente o hebraico “seus possuidores”, com o pronome retomando a sabedoria, e evita a rigidez de “seus proprietários”.
theological_decisions:
- issue: A relação entre conhecimento e sabedoria na segunda metade
  choice: '“a vantagem do conhecimento é esta: a sabedoria...”'
  alternative: “a vantagem da sabedoria é que ela...”
  rationale: A formulação conserva os dois substantivos presentes no hebraico e não os funde, embora a relação sintática entre eles seja compacta e possa admitir diferentes entendimentos.
- issue: O alcance de תְּחַיֶּה
  choice: “preserva a vida”
  alternative: “dá vida” ou “mantém vivo”
  rationale: A escolha favorece o sentido de sustentação e proteção no contexto, sem atribuir necessariamente uma afirmação sobre concessão originária de vida; a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “oferece abrigo” torna explícita a frase nominal hebraica e conserva o paralelismo. As notas preservam tanto a metáfora literal da sombra quanto a amplitude semântica do verbo חיה.
