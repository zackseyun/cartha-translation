  text: ט֛וֹב אַחֲרִ֥ית דָּבָ֖ר מֵֽ/רֵאשִׁית֑/וֹ ט֥וֹב אֶֽרֶךְ ר֖וּחַ מִ/גְּבַהּ רֽוּחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/008.yaml
  text: The end of a matter is better than its beginning[a]; patience is better than a proud spirit.
translation:
  language: pt
  text: Melhor é o fim de uma questão do que o seu começo; melhor é ser paciente[a] do que ter um espírito orgulhoso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “longo de espírito”, expressão que indica paciência ou demora em irar-se.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרִית
  choice: o fim
  rationale: Expressa o fim, a parte final ou o desfecho; aqui, “o fim” mantém de modo direto o contraste temporal com “o começo”.
- source_word: דָּבָר
  choice: uma questão
  rationale: O termo pode significar palavra, coisa, assunto ou questão. “Questão” é natural neste provérbio e abrange um assunto ou curso de acontecimentos.
- source_word: מֵרֵאשִׁיתוֹ
  choice: do que o seu começo
  rationale: A preposição marca comparação, e o sufixo masculino singular retoma דָּבָר; a formulação conserva explicitamente essa relação.
- source_word: אֶרֶךְ רוּחַ
  choice: ser paciente
  rationale: A expressão significa literalmente “longo de espírito” e denota paciência, domínio da irritação ou demora em irar-se. “Ser paciente” comunica o idioma com clareza no português atual.
- source_word: מִגְּבַהּ רוּחַ
  choice: do que ter um espírito orgulhoso
  rationale: A expressão descreve elevação ou altivez de espírito. “Espírito orgulhoso” preserva a referência à disposição interior sem sugerir o sentido positivo que “espírito elevado” poderia ter.
- source_word: טוֹב
  choice: melhor
  rationale: Nas duas orações, טוֹב tem força comparativa diante de construções introduzidas por מִן; “melhor” é a forma natural em português.
