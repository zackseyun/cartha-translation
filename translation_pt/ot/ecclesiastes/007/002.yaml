  text: ט֞וֹב לָ/לֶ֣כֶת אֶל בֵּֽית אֵ֗בֶל מִ/לֶּ֨כֶת֙ אֶל בֵּ֣ית מִשְׁתֶּ֔ה בַּ/אֲשֶׁ֕ר ה֖וּא ס֣וֹף כָּל הָ/אָדָ֑ם וְ/הַ/חַ֖י יִתֵּ֥ן אֶל לִבּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/002.yaml
  text: It is better to go to a house of mourning than to go to a house of feasting[a], because that is the end of every person, and the living should take it to heart.
translation:
  language: pt
  text: É melhor ir a uma casa de luto do que a uma casa de banquete, pois esse é o fim de todo ser humano, e os vivos devem refletir sobre isso.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טוֹב
  choice: É melhor
  rationale: O adjetivo avaliativo introduz uma comparação típica da literatura de sabedoria; a forma portuguesa é natural e completa.
- source_word: לָלֶכֶת / מִלֶּכֶת
  choice: ir ... do que ir
  rationale: הלך pode significar “andar” ou “ir”; no contexto de comparecer a lugares e ocasiões, “ir” é o equivalente corrente.
- source_word: בֵּית אֵבֶל
  choice: uma casa de luto
  rationale: Preserva a imagem hebraica e designa o lugar onde há luto, sem especificar indevidamente um local institucional.
- source_word: בֵּית מִשְׁתֶּה
  choice: uma casa de banquete
  rationale: מִשְׁתֶּה indica banquete ou festa, frequentemente com bebida; “banquete” mantém o contraste concreto com o luto.
- source_word: בַּאֲשֶׁר
  choice: pois
  rationale: Introduz a razão da afirmação anterior; “pois” conserva a força causal em registro digno e natural.
- source_word: סוֹף כָּל הָאָדָם
  choice: o fim de todo ser humano
  rationale: אָדָם é genérico neste contexto e se refere à humanidade sujeita à morte; a expressão é inclusiva, precisa e atual.
- source_word: וְהַחַי
  choice: e quem está vivo
  rationale: O singular substantivado tem sentido genérico; esta formulação preserva o singular e soa mais natural em português do que “o vivente”.
- source_word: יִתֵּן אֶל לִבּוֹ
  choice: deve levar isso a sério
  rationale: O idioma hebraico, literalmente relacionado a pôr algo no coração, comunica reflexão e consideração pessoal. A formulação expressa a força sapiencial sem sugerir mero impacto emocional.
theological_decisions:
- issue: Sentido genérico de אָדָם na declaração sobre a mortalidade
  choice: todo ser humano
  alternative: toda a humanidade
  rationale: O termo designa cada integrante da humanidade, não apenas pessoas do sexo masculino. “Todo ser humano” preserva melhor a referência distributiva de כָּל e a aplicação individual do dito.
- issue: Força de יִתֵּן na conclusão sapiencial
  choice: deve levar isso a sério
  alternative: levará isso a sério
  rationale: A forma verbal pode ser lida como consequência ou como orientação sapiencial. No contexto, “deve” comunica a resposta esperada sem transformar a frase em previsão absoluta.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Registro digno e acessível; mantém o paralelismo entre a casa de luto e a casa de banquete, sem arcaísmos nem linguagem denominacional.
