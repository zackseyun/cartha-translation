  text: ט֥וֹב כַּ֖עַס מִ/שְּׂחֹ֑ק כִּֽי בְ/רֹ֥עַ פָּנִ֖ים יִ֥יטַב לֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/003.yaml
  text: Sorrow is better than laughter[b][a], for by a sad face the heart is made better.
translation:
  language: pt
  text: A tristeza é melhor que o riso[a], pois, pela tristeza do semblante[b], o coração melhora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a ira» ou «a aflição». O termo hebraico também pode ter esses sentidos; aqui, o contexto favorece «tristeza».'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «pelo mal do rosto»; expressão hebraica para um semblante triste ou perturbado.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב ... מִן
  choice: Melhor ... do que
  rationale: A construção comparativa com מִן pede «melhor ... do que», em vez do sentido absoluto «bom».
- source_word: כַּעַס
  choice: tristeza
  rationale: Embora o termo também possa significar «ira», «irritação» ou «aflição», o contraste com o riso e a referência ao semblante entristecido favorecem aqui «tristeza», sem eliminar a ambiguidade lexical, registrada em nota.
- source_word: שְׂחוֹק
  choice: riso
  rationale: Equivalente direto, corrente e concreto para o substantivo hebraico, preservando o contraste do verso.
- source_word: כִּי
  choice: pois
  rationale: Introduz de modo conciso a razão da afirmação anterior.
- source_word: בְּרֹעַ פָּנִים
  choice: com o rosto entristecido
  rationale: A expressão significa literalmente «com/pela ruindade do rosto», um idioma referente a um semblante triste ou perturbado. A tradução mantém a imagem concreta em português natural.
- source_word: יִיטַב
  choice: se torna melhor
  rationale: O verbo יטב expressa tornar-se bom ou melhorar. Esta formulação preserva a afirmação de efeito benéfico sem restringi-la à ideia de alegria.
- source_word: לֵב
  choice: coração
  rationale: Em literatura sapiencial, designa amplamente o interior da pessoa, incluindo pensamento, disposição e vontade; «coração» preserva essa amplitude tradicional.
