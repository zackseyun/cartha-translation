lexical_decisions:
- source_word: טוֹב
  choice: É melhor
  rationale: O adjetivo tem função predicativa numa construção comparativa; «É melhor» é natural em português e mantém a formulação proverbial.
- source_word: לִשְׁמֹעַ
  choice: ouvir
  rationale: O infinitivo expressa a ação preferível e preserva a ligação verbal com שֹׁמֵעַ na segunda parte.
- source_word: גַּעֲרַת
  choice: a repreensão
  rationale: Designa uma correção verbal incisiva; «repreensão» é claro, atual e suficientemente forte.
- source_word: חָכָם
  choice: um sábio
  rationale: Reproduz o substantivo masculino singular sem tornar a frase pesada; em português, «um sábio» é uma designação natural.
- source_word: מֵאִישׁ שֹׁמֵעַ
  choice: do que ouvir
  rationale: A expressão hebraica é literalmente «do que um homem ouvindo». A formulação paralela é mais natural em português, enquanto a nota registra a sintaxe incomum e sua possível representação.
- source_word: שִׁיר
  choice: a canção
  rationale: Mantém a imagem concreta e o contraste retórico entre correção sábia e entretenimento insensato.
- source_word: כְּסִילִים
  choice: dos tolos
  rationale: É a designação concisa e tradicional, na literatura sapiencial, daqueles caracterizados por insensatez moral e prática.
