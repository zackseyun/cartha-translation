  yaml_path: translation/ot/ecclesiastes/007/024.yaml
  text: What has been is far off and very deep—who can find it out?[a]
translation:
  language: pt
  text: O que já existe está longe e é muito profundo — quem poderá descobri-lo?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “e profundo, profundo”. A repetição intensifica o sentido: “muito profundo” ou “profundíssimo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָחוֹק
  choice: está longe
  rationale: Mantém a imagem predicativa de distância ou inacessibilidade em português natural.
- source_word: מַה שֶּׁהָיָה
  choice: o que veio a existir
  rationale: O qatal de היה pode apontar para aquilo que veio a ser ou já existe. Esta formulação preserva essa nuance melhor do que uma referência exclusivamente ao passado.
- source_word: וְעָמֹק עָמֹק
  choice: e é muito profundo
  rationale: A repetição hebraica intensifica o adjetivo; “muito profundo” comunica esse efeito de modo natural, enquanto a forma literal é registrada em nota.
- source_word: מִי
  choice: quem
  rationale: Equivalente interrogativo direto, apropriado à pergunta retórica.
- source_word: יִמְצָאֶנּוּ
  choice: poderá descobri-lo
  rationale: מצא pode significar encontrar ou descobrir. No contexto sapiencial, “descobrir” expressa a ideia de alcançar compreensão; o pronome masculino retoma em português o conteúdo referido por “o que veio a existir”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva a metáfora espacial de algo distante e profundo e mantém a pergunta retórica sem explicar além do texto.
