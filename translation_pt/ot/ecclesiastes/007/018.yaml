    reason: A construção hebraica da oração final é incomum e admite mais de uma compreensão.
  revision_rationale: 'A única revisão necessária melhora a inteligibilidade e a fidelidade da expressão referente à mão: “repousar longe daquilo” mantém a imagem de נוח no hifil, sem substituí-la por “retirar” ou “soltar”, e representa melhor o valor de מִזֶּה. A conclusão e sua nota permanecem abertas, como no texto hebraico.'
