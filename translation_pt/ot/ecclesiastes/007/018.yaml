  text: ט֚וֹב אֲשֶׁ֣ר תֶּאֱחֹ֣ז בָּ/זֶ֔ה וְ/גַם מִ/זֶּ֖ה אַל תַּנַּ֣ח אֶת יָדֶ֑/ךָ כִּֽי יְרֵ֥א אֱלֹהִ֖ים יֵצֵ֥א אֶת כֻּלָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/018.yaml
  text: It is good that you should grasp this[a], and also not let your hand rest from that; for the one who fears God will come out with them all.
translation:
  language: pt
  text: É bom que você se apegue a isto e também não deixe sua mão repousar longe daquilo, pois quem teme a Deus sairá com tudo isso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sairá de tudo isso”, isto é, atravessará com êxito todas essas situações; alguns entendem o sentido de modo mais interpretativo: “evitará todos esses extremos”.'
    reason: A construção hebraica da oração final é incomum e admite mais de uma compreensão.
lexical_decisions:
- source_word: טוֹב
  choice: É bom
  rationale: Preserva o valor avaliativo do adjetivo predicativo e introduz naturalmente a recomendação.
- source_word: אֲשֶׁר תֶּאֱחֹז בָּזֶה
  choice: que você se apegue a isto
  rationale: אָחַז expressa agarrar ou tomar posse; “apegar-se” conserva a imagem de manter firme o conselho anterior e soa natural em português.
- source_word: וְגַם מִזֶּה אַל תַּנַּח אֶת יָדֶךָ
  choice: e também não deixe sua mão descansar daquilo
  rationale: Mantém a imagem concreta de נוח no hifil, “deixar descansar”, junto com “mão”, sem substituí-la pela ideia lexicalmente distinta de retirar ou soltar.
- source_word: מִזֶּה
  choice: daquilo
  rationale: Embora o demonstrativo seja literalmente “disto”, o contraste “isto... aquilo” distingue com clareza os dois conselhos em português.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão que fundamenta a recomendação.
- source_word: יְרֵא אֱלֹהִים
  choice: quem teme a Deus
  rationale: Expressa de modo inclusivo, corrente e conciso a pessoa caracterizada pelo temor de Deus.
- source_word: יֵצֵא אֶת כֻּלָּם
  choice: sairá com tudo isso
  rationale: Conserva o verbo básico “sair” e a construção incomum com אֵת, evitando resolver o sentido como “evitará”, “cumprirá” ou “se sairá bem”.
theological_decisions:
- issue: Sentido da oração final
  choice: A pessoa que teme a Deus “sairá com tudo isso”, formulação deliberadamente aberta.
  alternative: A pessoa que teme a Deus evitará ambos os extremos ou sairá bem de todas essas situações.
  rationale: A expressão hebraica é comprimida e discutida. A tradução preserva sua tensão sem transformar o temor de Deus em uma promessa mais específica do que o texto afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A expressão “não deixe sua mão descansar” é menos idiomática, mas foi mantida para preservar a metáfora hebraica; a nota explicita, sem eliminar, a ambiguidade da conclusão.
