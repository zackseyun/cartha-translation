    issue: A expressão “descansar daquilo” é semanticamente ambígua e pouco natural em português.
    rationale: O hebraico diz literalmente para não deixar a mão repousar/ficar afastada “disto”. A formulação atual pode ser entendida como repousar sobre ou a respeito daquilo, em vez de manter a mão longe disso. A revisão preserva o verbo de repouso e a metáfora, mas explicita a relação espacial.
  revised_text: É bom que você se apegue a isto e também não deixe sua mão repousar longe daquilo, pois quem teme a Deus sairá com tudo isso.[a]
