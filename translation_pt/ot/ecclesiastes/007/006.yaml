  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י כְ/ק֤וֹל הַ/סִּירִים֙ תַּ֣חַת הַ/סִּ֔יר כֵּ֖ן שְׂחֹ֣ק הַ/כְּסִ֑יל וְ/גַם זֶ֖ה הָֽבֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/006.yaml
  text: For like the crackling of thorns under a pot[a], so is the laughter of the fool[b]; this too is vapor.
translation:
  language: pt
  text: Pois, como o crepitar dos espinhos debaixo da panela, assim é o riso do tolo; também isso é vapor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “também isso é vaidade” ou “também isso é sopro”. O hebraico hebel evoca literalmente vapor ou sopro e pode indicar algo fugaz, inconsistente ou sem proveito duradouro.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a comparação como explicação ligada ao contexto anterior, sem tornar a relação causal mais específica do que o hebraico.
- source_word: כְקוֹל הַסִּירִים
  choice: como o crepitar dos espinhos
  rationale: קוֹל significa literalmente “som” ou “voz”; “crepitar” expressa de modo natural o ruído agudo dos espinhos usados como combustível, enquanto “espinhos” traduz o plural referente a plantas espinhosas.
- source_word: תַּחַת הַסִּיר
  choice: debaixo da panela
  rationale: Refere-se a um recipiente de cozinha aquecido pelo combustível; “panela” é claro e corrente em português.
- source_word: כֵּן שְׂחֹק הַכְּסִיל
  choice: assim é o riso do tolo
  rationale: Preserva a correspondência explícita da comparação e a imagem sonora, além do termo sapiencial tradicional “tolo”.
- source_word: וְגַם זֶה
  choice: também isso
  rationale: Mantém a força aditiva e avaliativa da expressão hebraica em ordem natural no português.
- source_word: הָבֶל
  choice: vapor
  rationale: Conserva a metáfora concreta central de Qohelet, que sugere algo fugaz e inconsistente, sem reduzi-la apenas a “vaidade” ou “inutilidade”.
theological_decisions:
- issue: Sentido de הָבֶל
  choice: vapor
  alternative: vaidade; sopro; inutilidade
  rationale: “Vapor” preserva a imagem e sua abertura semântica — transitoriedade, insubstancialidade e caráter elusivo — evitando impor uma única interpretação abstrata.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação mantém o paralelismo proverbial e a força auditiva da imagem. O artigo definido em “da panela” acompanha a forma hebraica e soa natural na comparação.
