base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/007.yaml
  text: For oppression drives a wise man mad[b][a], and a bribe destroys the heart.
translation:
  language: pt
  text: Pois a opressão enlouquece o sábio, e o suborno[a] destrói o coração[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma dádiva”. A palavra hebraica pode designar um presente em geral, mas, neste contexto, o sentido negativo de “suborno” é mais provável.
    reason: lexical_alternative
  - marker: b
    text: Na linguagem hebraica, “coração” frequentemente se refere ao ser interior, incluindo o discernimento, o entendimento e a vontade.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação do pensamento anterior e preserva o fluxo argumentativo do texto.
- source_word: הָעֹשֶׁק
  choice: a opressão
  rationale: Abrange a exploração injusta e abusiva expressa pelo substantivo hebraico, sem restringi-la apenas à extorsão.
- source_word: יְהוֹלֵל
  choice: enlouquece
  rationale: Expressa de modo natural a ideia causativa de levar alguém a agir irracionalmente ou perder o juízo.
- source_word: חָכָם
  choice: o sábio
  rationale: Preserva o singular masculino substantivado e seu caráter proverbial.
- source_word: וִיאַבֵּד
  choice: destrói
  rationale: Mantém a força do causativo de אבד, que indica arruinar ou levar à perdição.
- source_word: מַתָּנָה
  choice: o suborno
  rationale: Embora o termo possa significar uma dádiva em geral, o paralelismo com a opressão e o efeito corruptor sobre o coração favorecem aqui o sentido negativo de suborno.
- source_word: לֵב
  choice: o coração
  rationale: Conserva a metáfora hebraica para o centro interior do discernimento, do entendimento e da vontade.
