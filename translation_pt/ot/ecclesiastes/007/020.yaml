base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/020.yaml
  text: For there is no righteous man on the earth who does good and does not sin[a].
translation:
  language: pt
  text: Pois não há ninguém justo sobre a terra que faça o bem e não peque.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento da afirmação anterior e preserva naturalmente a ligação lógica em português.
- source_word: אָדָם
  choice: ninguém
  rationale: Embora o hebraico use o singular genérico אָדָם, a construção negativa existencial inteira é expressa de modo natural e universal em português por “não há ninguém”, sem restringir o sentido aos homens.
- source_word: אֵין צַדִּיק
  choice: não há ninguém justo
  rationale: Reproduz a construção existencial negativa e mantém צַדִּיק como “justo”, termo claro e tradicional para retidão moral.
- source_word: בָּאָרֶץ
  choice: sobre a terra
  rationale: Em Eclesiastes, a expressão se refere amplamente ao mundo humano, não a um território específico.
- source_word: אֲשֶׁר יַעֲשֶׂה טּוֹב
  choice: que faça o bem
  rationale: Mantém a concisão proverbial e o sentido moral da expressão hebraica.
- source_word: וְלֹא יֶחֱטָא
  choice: e não peque
  rationale: Preserva a coordenação explícita do hebraico sem acrescentar “nunca”, embora o enunciado tenha alcance universal.
theological_decisions:
- issue: Singular humano genérico na afirmação proverbial
  choice: ninguém
  alternative: homem
  rationale: O hebraico singular אָדָם representa genericamente qualquer ser humano. Em português atual, “não há ninguém justo” comunica com precisão a universalidade da afirmação e evita uma leitura indevidamente limitada ao sexo masculino.
- issue: Alcance da ausência de pecado
  choice: e não peque
  alternative: sem jamais pecar
  rationale: A tradução conserva a forma coordenada e a tensão do hebraico, sem intensificar explicitamente o aspecto verbal com “jamais”.
translation_notes:
  register: Português moderno, claro e digno, com formulação proverbial concisa e leitura natural tanto no Brasil quanto em outros contextos lusófonos.
