source:
  edition: WLC
  text: וּ/מוֹצֶ֨א אֲנִ֜י מַ֣ר מִ/מָּ֗וֶת אֶת הָֽ/אִשָּׁה֙ אֲשֶׁר הִ֨יא מְצוֹדִ֧ים וַ/חֲרָמִ֛ים לִבָּ֖/הּ אֲסוּרִ֣ים יָדֶ֑י/הָ ט֞וֹב לִ/פְנֵ֤י הָ/אֱלֹהִים֙ יִמָּלֵ֣ט מִמֶּ֔/נָּה וְ/חוֹטֵ֖א יִלָּ֥כֶד בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/026.yaml
  text: And I find more bitter than death the woman whose heart is traps and nets[a], and whose hands are chains. The one who is good before God will escape from her[b], but the sinner will be caught by her.
translation:
  language: pt
  text: E acho mais amarga do que a morte a mulher cujo coração é armadilhas e redes[a], e cujas mãos são correntes. Quem é bom diante de Deus escapará dela[b], mas o pecador será apanhado por ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “laços e redes”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Quem agrada a Deus escapará dela”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמוֹצֶא אֲנִי
  choice: E acho
  rationale: O particípio com sujeito explícito expressa aqui uma constatação pessoal em curso; “E acho” é natural em português e preserva a voz do orador.
- source_word: מַר מִמָּוֶת
  choice: mais amarga do que a morte
  rationale: A construção adjetivo + מִן tem sentido comparativo. A concordância feminina retoma “a mulher”.
- source_word: הָאִשָּׁה
  choice: a mulher
  rationale: Preserva o artigo definido e o singular do hebraico sem decidir se se trata de uma mulher específica, de um tipo ou de uma figura personificada.
- source_word: מְצוֹדִים וַחֲרָמִים
  choice: armadilhas e redes
  rationale: Os dois substantivos pertencem ao campo da captura; a formulação é clara e mantém a metáfora sem impor distinções técnicas incertas.
- source_word: לִבָּהּ
  choice: cujo coração é armadilhas e redes
  rationale: Mantém “coração” como centro das intenções e desejos e conserva a forte predicação metafórica do original.
- source_word: אֲסוּרִים יָדֶיהָ
  choice: cujas mãos são correntes
  rationale: “Correntes” comunica de modo concreto a ideia de laços ou grilhões e sustenta o paralelismo com as imagens de captura.
- source_word: טוֹב לִפְנֵי הָאֱלֹהִים
  choice: Quem é bom diante de Deus
  rationale: Reproduz de perto o valor lexical de טוֹב e a expressão espacial-relacional “diante de Deus”, sem incorporar ao texto principal a interpretação “agrada a Deus”.
- source_word: יִמָּלֵט מִמֶּנָּה
  choice: escapará dela
  rationale: Expressa diretamente o sentido de livrar-se ou escapar e mantém a imagem de aprisionamento.
- source_word: וְחוֹטֵא
  choice: mas o pecador
  rationale: O particípio substantivado designa “o pecador”; “mas” explicita naturalmente o contraste contextual.
- source_word: יִלָּכֶד בָּהּ
  choice: será apanhado por ela
  rationale: Preserva a voz passiva e a imagem de captura; “por ela” apresenta a mulher como fonte agente do aprisionamento.
theological_decisions:
- issue: Se a descrição de “a mulher” deve ser generalizada, atenuada ou identificada de modo explícito
  choice: Manter “a mulher” no singular definido e conservar as metáforas do hebraico
  alternative: “uma mulher”, “a mulher sedutora” ou “a insensatez personificada”
  rationale: O texto não resolve explicitamente se a figura é uma pessoa específica, um tipo moral ou uma personificação. A tradução preserva essa tensão e não amplia a afirmação para as mulheres em geral.
- issue: Sentido de טוֹב לִפְנֵי הָאֱלֹהִים
  choice: Quem é bom diante de Deus
  alternative: Quem agrada a Deus
  rationale: Embora a expressão possa indicar alguém que desfruta do favor divino ou agrada a Deus, a redação principal conserva a forma mais lexical, e a alternativa idiomática aparece em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A construção metafórica deliberadamente áspera — “o coração é armadilhas e redes” — foi mantida para preservar a força e a ambiguidade do hebraico.
