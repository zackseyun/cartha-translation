  text: לְ/בַד֙ רְאֵה זֶ֣ה מָצָ֔אתִי אֲשֶׁ֨ר עָשָׂ֧ה הָ/אֱלֹהִ֛ים אֶת הָ/אָדָ֖ם יָשָׁ֑ר וְ/הֵ֥מָּה בִקְשׁ֖וּ חִשְּׁבֹנ֥וֹת רַבִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/029.yaml
  text: 'Only see this: I have found that God made man upright[b][a], but they have sought out many schemes.'
translation:
  language: pt
  text: 'Veja, só isto encontrei: Deus fez o ser humano íntegro, mas eles buscaram muitos artifícios.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “muitos planos”, “muitos cálculos” ou “muitas invenções”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַד רְאֵה זֶה מָצָאתִי
  choice: Veja, isto somente encontrei
  rationale: Mantém o chamado direto à atenção e a força limitadora de לְבַד, em formulação digna e compreensível; o perfeito indica uma conclusão alcançada.
- source_word: עָשָׂה הָאֱלֹהִים אֶת־הָאָדָם יָשָׁר
  choice: Deus fez o ser humano íntegro
  rationale: הָאָדָם é coletivo e genérico neste contexto; “ser humano” permite a retomada plural do hebraico. “Íntegro” expressa a retidão moral de יָשָׁר sem sugerir apenas forma física.
- source_word: וְהֵמָּה
  choice: mas eles
  rationale: O pronome plural enfático retoma a humanidade coletiva e destaca o contraste entre a ação de Deus e a ação humana.
- source_word: בִּקְשׁוּ חִשְּׁבֹנוֹת רַבִּים
  choice: buscaram muitos artifícios
  rationale: “Buscaram” conserva o sentido básico de בִּקְשׁוּ. “Artifícios” abrange planos, expedientes e cálculos engenhosos, deixando que o contexto comunique sua conotação negativa.
theological_decisions:
- issue: Sentido genérico de הָאָדָם e sua retomada plural
  choice: o ser humano ... eles
  alternative: a humanidade ... ela / o homem ... eles
  rationale: O singular hebraico designa coletivamente a humanidade, e וְהֵמָּה passa explicitamente ao plural. A tradução preserva essa tensão de número em vez de uniformizá-la.
- issue: Natureza de חִשְּׁבֹנוֹת רַבִּים
  choice: muitos artifícios
  alternative: muitos planos; muitos cálculos; muitas invenções
  rationale: O termo admite planos, expedientes ou cálculos. “Artifícios” conserva a amplitude lexical e a possível nuance moral negativa sem definir em excesso a natureza dessas iniciativas.
translation_notes:
  register: Português moderno, amplo e digno, com legibilidade brasileira. A ordem levemente marcada em “isto somente encontrei” conserva a ênfase do hebraico sem recorrer ao arcaísmo “eis”. O contraste singular coletivo/plural foi mantido deliberadamente.
