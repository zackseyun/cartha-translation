  text: סַבּ֨וֹתִֽי אֲנִ֤י וְ/לִבִּ/י֙ לָ/דַ֣עַת וְ/לָ/ת֔וּר וּ/בַקֵּ֥שׁ חָכְמָ֖ה וְ/חֶשְׁבּ֑וֹן וְ/לָ/דַ֨עַת֙ רֶ֣שַׁע כֶּ֔סֶל וְ/הַ/סִּכְל֖וּת הוֹלֵלֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/025.yaml
  text: I turned[a], I and my heart, to know and to search out and seek wisdom and an explanation[c][b], and to know that wickedness is folly and foolishness is madness.
translation:
  language: pt
  text: Voltei-me[a], eu e meu coração, para conhecer, investigar e buscar a sabedoria e uma explicação[b], e para conhecer que a maldade é insensatez e que a tolice é loucura.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mudei de direção”. O verbo hebraico conserva a imagem de voltar-se para um novo rumo de investigação.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “um cálculo”, “um raciocínio” ou “uma avaliação”.'
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico também pode ser entendido como construções nominais: “a maldade da insensatez e a tolice da loucura”.'
    reason: alternative_reading
lexical_decisions:
- source_word: סַבּוֹתִי
  choice: Voltei-me
  rationale: O verbo סבב traz a imagem concreta de voltar-se ou mudar de direção. “Voltei-me” preserva essa imagem e, no contexto, comunica uma reorientação deliberada da investigação.
- source_word: אֲנִי וְלִבִּי
  choice: eu e meu coração
  rationale: A formulação mantém a coordenação explícita do hebraico. “Coração” designa aqui o interior humano como sede do pensamento, da intenção e da reflexão, sem reduzi-lo simplesmente à mente.
- source_word: לָדַעַת
  choice: para conhecer
  rationale: ידע significa normalmente “conhecer”. A mesma tradução é mantida nas duas ocorrências para preservar a repetição e a estrutura do versículo.
- source_word: לָתוּר
  choice: investigar
  rationale: תור indica explorar ou examinar cuidadosamente. “Investigar” é natural em português e se distingue do verbo seguinte, “buscar”.
- source_word: וּבַקֵּשׁ
  choice: e buscar
  rationale: בקש é o verbo comum para buscar ou procurar. A escolha conserva a acumulação de verbos de pesquisa no original.
- source_word: חָכְמָה
  choice: sabedoria
  rationale: Equivalente corrente e apropriado ao tema central de Eclesiastes.
- source_word: חֶשְׁבּוֹן
  choice: uma explicação
  rationale: O substantivo pode indicar cálculo, raciocínio, conta ou explicação. Neste contexto de investigação intelectual, “uma explicação” oferece sentido claro sem eliminar as demais possibilidades, registradas em nota.
- source_word: רֶשַׁע
  choice: maldade
  rationale: רשע tem força moral e denota perversidade ou conduta culpável. “Maldade” é corrente e mantém essa dimensão ética.
- source_word: כֶּסֶל
  choice: insensatez
  rationale: Na literatura sapiencial, כסל designa uma falta de juízo com dimensão moral. “Insensatez” preserva esse valor e permite distingui-la do quase sinônimo seguinte.
- source_word: הַסִּכְלוּת
  choice: a tolice
  rationale: סכלות denota tolice ou falta de entendimento. A escolha evita repetição artificial, ao mesmo tempo que conserva a proximidade semântica com כסל.
- source_word: הוֹלֵלוֹת
  choice: loucura
  rationale: O termo descreve irracionalidade extrema ou loucura e tem esse valor recorrente em Eclesiastes.
theological_decisions:
- issue: Linguagem antropológica de “coração”
  choice: Manter “eu e meu coração” no texto principal
  alternative: “eu e minha mente” ou “apliquei minha mente”
  rationale: O hebraico menciona explicitamente o coração como faculdade interior de pensamento e decisão. Mantê-lo preserva a antropologia e a imagem do texto sem impor uma dicotomia moderna entre razão e emoção.
- issue: Relação entre maldade, insensatez, tolice e loucura
  choice: 'Explicitar as duas relações como predicações: “a maldade é insensatez” e “a tolice é loucura”'
  alternative: 'Ler os substantivos como construções atributivas: “a maldade da insensatez e a loucura da tolice”'
  rationale: As expressões nominais hebraicas são comprimidas e não contêm cópula expressa. A formulação principal oferece uma leitura sintaticamente plausível e clara em português, enquanto a nota preserva a possibilidade atributiva sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem incomum de “eu e meu coração” foi mantida por refletir uma imagem deliberada do hebraico; os três verbos de investigação foram diferenciados, e as ambiguidades lexicais e sintáticas relevantes foram preservadas em notas.
