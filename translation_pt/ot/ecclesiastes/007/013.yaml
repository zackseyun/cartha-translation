  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: רְאֵ֖ה אֶת מַעֲשֵׂ֣ה הָ/אֱלֹהִ֑ים כִּ֣י מִ֤י יוּכַל֙ לְ/תַקֵּ֔ן אֵ֖ת אֲשֶׁ֥ר עִוְּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/013.yaml
  text: Consider the work of God[a], for who can straighten what he has made crooked?
translation:
  language: pt
  text: Considere a obra de Deus, pois quem pode endireitar o que ele entortou?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tornar reto o que ele curvou”.'
    reason: Alternativa lexical que preserva a mesma imagem de algo cuja forma foi alterada.
lexical_decisions:
- source_word: רְאֵה
  choice: Considere
  rationale: O imperativo pede atenção reflexiva, não apenas visão física. “Considere” comunica de modo natural o tom contemplativo da literatura sapiencial.
- source_word: מַעֲשֵׂה
  choice: obra
  rationale: O singular abrange aquilo que Deus faz ou fez. “Obra de Deus” é uma expressão clara, corrente e suficientemente ampla em português.
- source_word: הָאֱלֹהִים
  choice: Deus
  rationale: O termo designa Deus neste contexto, e não o nome divino YHWH.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão para a exortação inicial e preserva de forma concisa a ligação explicativa.
- source_word: מִי יוּכַל
  choice: quem pode
  rationale: Mantém a forma direta e a força retórica da pergunta sobre capacidade.
- source_word: לְתַקֵּן
  choice: endireitar
  rationale: Preserva a imagem concreta e o contraste deliberado com עִוְּתוֹ, em vez de recorrer a opções mais abstratas como “corrigir” ou “reparar”.
- source_word: אֲשֶׁר
  choice: o que
  rationale: É a forma idiomática em português moderno para introduzir o objeto da pergunta retórica.
- source_word: עִוְּתוֹ
  choice: ele entortou
  rationale: Preserva tanto a metáfora concreta quanto o sujeito masculino singular, que no contexto retoma Deus. “Entortou” contrasta naturalmente com “endireitar”.
theological_decisions:
- issue: Referente e força teológica do sufixo masculino singular em עִוְּתוֹ
  choice: 'O sujeito é Deus: ninguém pode endireitar o que ele entortou.'
  alternative: o que foi entortado; o que ele curvou
  rationale: O contexto imediato menciona “a obra de Deus”, favorecendo Deus como referente do sujeito implícito. A formulação pessoal conserva a gramática hebraica e a tensão teológica acerca da ação soberana de Deus, sem suavizá-la por meio de uma construção passiva.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção mantém o paralelismo imagético entre “endireitar” e “entortou” e evita linguagem excessivamente técnica ou arcaica.
