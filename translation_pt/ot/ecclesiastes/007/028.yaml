  text: אֲשֶׁ֛ר עוֹד בִּקְשָׁ֥ה נַפְשִׁ֖/י וְ/לֹ֣א מָצָ֑אתִי אָדָ֞ם אֶחָ֤ד מֵ/אֶ֨לֶף֙ מָצָ֔אתִי וְ/אִשָּׁ֥ה בְ/כָל אֵ֖לֶּה לֹ֥א מָצָֽאתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/028.yaml
  text: 'which my soul still sought[a], but I did not find: one man among a thousand I found[b], but a woman among all these I did not find.'
translation:
  language: pt
  text: 'o que a minha alma ainda buscava, mas não encontrei: encontrei um homem entre mil[a], mas não encontrei mulher alguma entre todos esses.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “um em mil”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “entre todos esses” provavelmente se refere ao conjunto inteiro considerado na busca de Qohelet. O versículo relata o resultado dessa busca, sem necessariamente fazer uma afirmação universal sobre todas as mulheres.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: o que
  rationale: Introduz uma oração relativa que dá continuidade ao pensamento do versículo anterior; “o que” preserva essa ligação sem acrescentar um novo referente.
- source_word: עוֹד
  choice: ainda
  rationale: Expressa a continuidade da busca e corresponde naturalmente ao advérbio hebraico.
- source_word: בִּקְשָׁה נַפְשִׁי
  choice: a minha alma ainda buscava
  rationale: Mantém “minha alma” como sujeito explícito, preservando a textura do hebraico e o sentido da busca interior do falante.
- source_word: וְלֹא מָצָאתִי
  choice: mas não encontrei
  rationale: O waw recebe valor adversativo no contraste entre buscar e não encontrar.
- source_word: אָדָם
  choice: homem
  rationale: Embora o termo possa ser genérico em outros contextos, aqui o contraste direto com אִשָּׁה exige uma tradução masculina específica.
- source_word: אֶחָד מֵאֶלֶף
  choice: um homem entre mil
  rationale: Reproduz de modo claro e idiomático a proporção expressa no hebraico, com “homem” recuperado do substantivo precedente.
- source_word: מָצָאתִי
  choice: encontrei
  rationale: Tradução direta do verbo perfeito no relato pessoal da investigação.
- source_word: וְאִשָּׁה
  choice: mas ... uma mulher
  rationale: A conjunção marca contraste com o homem que foi encontrado; a colocação portuguesa evita rigidez sem alterar o sentido.
- source_word: בְּכָל אֵלֶּה
  choice: entre todas estas
  rationale: Indica busca dentro do conjunto feminino sob consideração e mantém o demonstrativo feminino plural do português em concordância contextual com “mulher”.
- source_word: לֹא מָצָאתִי
  choice: não encontrei
  rationale: Tradução transparente da negação verbal, sem transformar o relato em generalização explícita.
theological_decisions:
- issue: Possível leitura misógina ou universalizante
  choice: Apresentar a declaração como o relato limitado da busca do falante, sem suavizá-la nem ampliá-la.
  alternative: Parafrasear para reduzir o caráter direto da afirmação ou fazê-la declarar um juízo universal sobre todas as mulheres.
  rationale: O hebraico relata o que Qohelet afirma ter encontrado no conjunto examinado. A tradução conserva a tensão do texto, enquanto a nota esclarece que “todas estas” aponta para o grupo considerado, não necessariamente para todas as mulheres de todos os tempos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção inicial mantém a continuidade sintática com o versículo anterior; “minha alma” preserva o idioma hebraico, e o contraste entre “homem” e “mulher” permanece explícito.
