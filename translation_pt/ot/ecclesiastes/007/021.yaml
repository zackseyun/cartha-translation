lexical_decisions:
- source_word: גַּם
  choice: Também
  rationale: Preserva a força aditiva do hebraico e liga o conselho ao contexto anterior sem impor ênfase excessiva.
- source_word: לְכָל הַדְּבָרִים אֲשֶׁר יְדַבֵּרוּ
  choice: tudo o que dizem
  rationale: דְּבָרִים refere-se aqui ao que é dito, como confirma o verbo subsequente ‘ouvir’. O sujeito plural indefinido é expresso naturalmente em português por ‘dizem’.
- source_word: אַל תִּתֵּן לִבֶּךָ
  choice: não leve a sério
  rationale: O hebraico diz literalmente ‘não dê seu coração’, uma expressão que indica dirigir a atenção interior ou dar importância ao que se ouve. ‘Não leve a sério’ comunica o sentido idiomático em português atual, enquanto a nota preserva a imagem original.
- source_word: אֲשֶׁר לֹא תִשְׁמַע
  choice: para que você não ouça
  rationale: No contexto da proibição, a oração apresenta o resultado indesejado que se deve evitar. A formulação mantém essa relação sem tornar o português artificial.
- source_word: עַבְדְּךָ
  choice: seu servo
  rationale: עֶבֶד pode designar servo ou escravo. Neste dito sapiencial, o foco recai na pessoa subordinada da casa, e ‘servo’ é uma tradução ampla e natural; a alternativa é registrada em nota.
- source_word: מְקַלְלֶךָ
  choice: amaldiçoar você
  rationale: O particípio de קלל pode indicar amaldiçoar, insultar ou tratar com desprezo. ‘Amaldiçoar’ preserva diretamente a força lexical sem explicar demais a natureza da ofensa.
