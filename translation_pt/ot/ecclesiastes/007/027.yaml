base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/027.yaml
  text: See, this is what I found, says Qoheleth, adding one thing to another to find the sum.
translation:
  language: pt
  text: Veja, foi isto que encontrei, diz Coélet, comparando uma coisa com outra para chegar a uma conclusão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רְאֵה
  choice: Veja
  rationale: Preserva o chamado enfático para que o leitor preste atenção, em linguagem portuguesa natural.
- source_word: קֹהֶלֶת
  choice: Coélet
  rationale: Mantém como designação transliterada a forma hebraica tradicionalmente associada à voz do livro, sem impor aqui uma interpretação funcional como “Pregador” ou “Mestre”.
- source_word: אַחַת לְאַחַת
  choice: comparando uma coisa com outra
  rationale: Expressa o procedimento gradual de pôr itens em relação, evitando a formulação pouco natural “uma a uma” neste contexto.
- source_word: חֶשְׁבּוֹן
  choice: conclusão
  rationale: O substantivo pode indicar cálculo, resultado ou explicação racional; “conclusão” comunica o resultado procurado sem restringi-lo a uma soma aritmética.
theological_decisions:
- issue: Identidade e função de קֹהֶלֶת
  choice: Coélet
  alternative: o Pregador / o Mestre
  rationale: A transliteração conserva a peculiaridade e a possível ambiguidade do título hebraico, sem definir de modo denominacional ou excessivamente específico o papel da personagem.
- issue: Sentido de חֶשְׁבּוֹן
  choice: conclusão
  alternative: soma / explicação / cálculo
  rationale: O contexto descreve uma investigação que relaciona elementos para chegar a um resultado intelectual. “Conclusão” preserva essa amplitude melhor que uma leitura estritamente matemática.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe mantém a declaração em primeira pessoa seguida da fórmula “diz Coélet” e descreve de modo natural o método investigativo do versículo.
