base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/010.yaml
  text: Do not say[b][a], “Why were the former days better than these?” For it is not from wisdom that you ask this.
translation:
  language: pt
  text: 'Não diga: “Por que os dias passados eram melhores do que estes?”[a] Pois não é por sabedoria que você pergunta isso.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “O que era que os primeiros dias eram melhores do que estes?” Esta é uma expressão idiomática com o sentido de: “Por que os dias passados eram melhores do que estes?”'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Pois não foi por sabedoria que você perguntou sobre isso.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: Não diga
  rationale: A partícula אַל com o imperfeito expressa uma proibição dirigida à segunda pessoa do singular. “Não diga” é a forma portuguesa direta e natural, sem acrescentar ênfase ausente no hebraico.
- source_word: מֶה הָיָה
  choice: Por que
  rationale: Neste contexto, a expressão introduz uma pergunta sobre a razão pela qual os dias anteriores teriam sido melhores. “Por que” comunica naturalmente a função idiomática da construção; a forma mais literal é registrada em nota.
- source_word: הַיָּמִים הָרִאשֹׁנִים
  choice: os dias passados
  rationale: A expressão se refere a dias ou épocas anteriores. “Dias passados” é corrente, clara e preserva a imagem temporal do hebraico sem o tom arcaizante de “dias de outrora”.
- source_word: הָיוּ טוֹבִים מֵאֵלֶּה
  choice: eram melhores do que estes
  rationale: O comparativo hebraico é reproduzido de modo natural em português. “Estes” retoma “dias” sem precisar repetir o substantivo.
- source_word: כִּי
  choice: Pois
  rationale: A conjunção introduz a razão da proibição e mantém o tom explicativo e proverbial do texto.
- source_word: לֹא מֵחָכְמָה
  choice: não é por sabedoria
  rationale: A formulação preserva a ideia hebraica de origem, fundamento ou motivação, em vez de reduzi-la apenas à maneira imprudente de perguntar.
- source_word: שָׁאַלְתָּ עַל זֶה
  choice: você pergunta isso
  rationale: Embora שָׁאַלְתָּ seja morfologicamente perfeito, o contexto proverbial permite o presente geral em português. “Perguntar isso” transmite de forma idiomática o sentido de perguntar a respeito dessa questão; a leitura pontual no passado é indicada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A tradução conserva a imagem dos “dias”, o caráter proverbial da advertência e a formulação incomum “por sabedoria”, que reflete a ideia hebraica de fonte ou fundamento. As notas preservam tanto a forma mais literal da pergunta quanto a possibilidade de ler o verbo final como passado.
