  to: A sabedoria é melhor do que as armas de guerra, mas um só pecador destrói muito do que é bom.[a]
  rationale: A revisão substitui a expressão portuguesa ambígua «muito bem» por «muito do que é bom», que comunica claramente a quantidade de bem ou benefício destruído, sem limitar o sentido a objetos materiais ou a atos específicos. A nota preserva a alternativa formalmente coordenativa da conjunção hebraica.
