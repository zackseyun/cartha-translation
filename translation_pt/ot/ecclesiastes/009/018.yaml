    issue: «destrói muito bem» é semanticamente ambíguo e tende a ser lido como um advérbio de modo.
    rationale: No português contemporâneo, «muito bem» modifica normalmente o verbo («destrói muito bem» = destrói de maneira muito eficiente). O hebraico טוֹבָה הַרְבֵּה significa «muito bem/bem em grande quantidade», isto é, muito do que é bom ou benéfico.
