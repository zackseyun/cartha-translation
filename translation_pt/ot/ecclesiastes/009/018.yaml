base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/018.yaml
  text: Wisdom is better than weapons of war[a], but one sinner destroys much good.
translation:
  language: pt
  text: A sabedoria é melhor do que as armas de guerra, mas um só pecador destrói muito do que é bom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e um só pecador destrói muito do que é bom”. A conjunção hebraica pode significar simplesmente “e”, embora, neste contexto, pareça introduzir um contraste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹבָה חָכְמָה מִן
  choice: A sabedoria é melhor do que
  rationale: O adjetivo טוֹבָה, construído com מִן, expressa comparação. A formulação portuguesa é natural e preserva explicitamente a superioridade da sabedoria.
- source_word: מִכְּלֵי קְרָב
  choice: do que as armas de guerra
  rationale: כְּלֵי designa utensílios ou equipamentos e, com קְרָב, refere-se a equipamento bélico. “Armas de guerra” é claro, corrente e mantém o sentido marcial.
- source_word: וְחוֹטֶא אֶחָד
  choice: mas um só pecador
  rationale: O וְ pode introduzir aqui um contraste contextual, adequadamente expresso por “mas”. חוֹטֶא é um particípio substantivado, “pecador”, e “um só” preserva a ênfase de אֶחָד no poder destrutivo de um único indivíduo.
- source_word: יְאַבֵּד
  choice: destrói
  rationale: 'O piel de אבד tem sentido causativo: fazer perecer, arruinar ou destruir. “Destrói” comunica com clareza a força do verbo.'
- source_word: טוֹבָה הַרְבֵּה
  choice: muito bem
  rationale: A expressão indica uma grande quantidade de bem ou benefício. “Muito bem” preserva a amplitude moral e prática da frase, sem restringi-la a bens ou feitos específicos.
