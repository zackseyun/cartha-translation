  source_fidelity: 'A tradução acompanha fielmente o hebraico: a relação explicativa de כִּי é bem expressa por “Pois”; “os vivos sabem que morrerão” preserva a oração de conteúdo e o futuro; o contraste com “mas os mortos” é apropriado; “não sabem absolutamente nada” reproduz a ênfase de אֵינָם יוֹדְעִים מְאוּמָה; e “já não há recompensa para eles” comunica adequadamente וְאֵין עוֹד לָהֶם שָׂכָר. A formulação final “a lembrança deles caiu no esquecimento” transmite de modo idiomático o sentido passivo de כִּי נִשְׁכַּח זִכְרָם, isto é, que a recordação deles foi esquecida.'
