reference: Ecclesiastes 9:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֧י הַֽ/חַיִּ֛ים יוֹדְעִ֖ים שֶׁ/יָּמֻ֑תוּ וְ/הַ/מֵּתִ֞ים אֵינָ֧/ם יוֹדְעִ֣ים מְא֗וּמָה וְ/אֵֽין ע֤וֹד לָ/הֶם֙ שָׂכָ֔ר כִּ֥י נִשְׁכַּ֖ח זִכְרָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/005.yaml
  text: For the living know that they will die[a], but the dead know nothing at all, and there is no longer any reward for them, because their memory is forgotten.
translation:
  language: pt
  text: Pois os vivos sabem que morrerão, mas os mortos não sabem absolutamente nada[a], e já não há recompensa para eles, porque a lembrança deles caiu no esquecimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não sabem coisa alguma”. A expressão hebraica é enfática.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão explicativa da afirmação anterior e preserva de modo natural a ligação discursiva.
- source_word: הַחַיִּים
  choice: os vivos
  rationale: O adjetivo substantivado plural designa coletivamente as pessoas que estão vivas; esta é uma forma concisa e idiomática em português.
- source_word: יוֹדְעִים שֶׁיָּמֻתוּ
  choice: sabem que morrerão
  rationale: Expressa diretamente o conteúdo do conhecimento dos vivos e mantém o valor futuro da forma verbal.
- source_word: וְהַמֵּתִים
  choice: mas os mortos
  rationale: Embora וְ seja normalmente aditivo, aqui liga duas orações em contraste; “mas” comunica essa relação com clareza.
- source_word: אֵינָם יוֹדְעִים מְאוּמָה
  choice: não sabem absolutamente nada
  rationale: A combinação da negação com מְאוּמָה é enfática; “absolutamente nada” conserva essa força em português natural.
- source_word: וְאֵין עוֹד לָהֶם שָׂכָר
  choice: e já não há recompensa para eles
  rationale: “Recompensa” representa o sentido contextual de שָׂכָר, enquanto “já não” expressa עוֹד no enunciado negativo.
- source_word: כִּי נִשְׁכַּח זִכְרָם
  choice: porque a lembrança deles caiu no esquecimento
  rationale: Conserva a ideia de que já não são lembrados e verte o passivo hebraico por uma expressão portuguesa corrente, sem expandir seu sentido.
theological_decisions:
- issue: Se o versículo deve ser formulado como uma afirmação doutrinária sobre a inexistência ou a inconsciência absoluta dos mortos em todos os sentidos
  choice: 'Manter a declaração enfática do texto: “os mortos não sabem absolutamente nada”, sem qualificações interpretativas.'
  alternative: Acrescentar algo como “do que acontece debaixo do sol” ou suavizar a frase para harmonizá-la explicitamente com outras passagens bíblicas.
  rationale: O hebraico apresenta a afirmação de maneira categórica neste contexto literário. A tradução preserva essa tensão, sem inserir uma harmonização ausente do versículo nem transformar a frase, por acréscimo, em uma formulação sistemática mais ampla.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Caiu no esquecimento” evita a formulação pouco natural “a memória deles foi esquecida”, preservando a imagem e o sentido do hebraico.
