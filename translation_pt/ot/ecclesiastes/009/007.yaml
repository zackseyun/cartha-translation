base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/007.yaml
  text: Go[a], eat your bread with joy, and drink your wine with a glad heart, for God has already approved your works.
translation:
  language: pt
  text: Vá, coma o seu pão com alegria e beba o seu vinho com o coração alegre, pois Deus já aceitou os seus atos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “já se agradou das suas obras” ou “já aprovou o que você faz”.
    reason: Alternativas lexicais legítimas para רָצָה e מַעֲשֶׂיךָ, que preservam as nuances de prazer, aceitação e aprovação.
lexical_decisions:
- source_word: לֵךְ
  choice: Vá
  rationale: O imperativo funciona idiomaticamente como abertura enfática da exortação. “Vá” conserva essa força discursiva sem acrescentar conteúdo.
- source_word: אֱכֹל בְּשִׂמְחָה לַחְמֶךָ
  choice: coma o seu pão com alegria
  rationale: Mantém os imperativos diretos, a imagem concreta do pão e o substantivo “alegria”; a construção é natural em português moderno.
- source_word: וּשֲׁתֵה בְלֶב טוֹב יֵינֶךָ
  choice: e beba o seu vinho com o coração alegre
  rationale: Preserva tanto a referência literal ao vinho quanto a linguagem hebraica do coração. “Alegre” comunica aqui a disposição interior positiva expressa por טוֹב.
- source_word: כִּי כְבָר
  choice: pois ... já
  rationale: “Pois” introduz o fundamento da exortação, e “já” expressa a anterioridade ou realidade estabelecida indicada por כְבָר.
- source_word: רָצָה
  choice: aceitou favoravelmente
  rationale: O verbo pode significar aceitar, acolher com favor ou agradar-se de algo. A expressão explicita o sentido favorável sem restringi-lo a mera aprovação administrativa.
- source_word: הָאֱלֹהִים
  choice: Deus
  rationale: A forma definida refere-se aqui ao Deus único; “Deus” é a tradução portuguesa padrão.
- source_word: מַעֲשֶׂיךָ
  choice: os seus atos
  rationale: מַעֲשִׂים designa ações ou feitos. “Atos” é concreto e atual, evitando que “obras” seja indevidamente entendido apenas como termo técnico teológico.
theological_decisions:
- issue: Sentido da aceitação divina na oração final
  choice: O texto afirma que Deus já acolheu favoravelmente os atos do destinatário, e essa realidade fundamenta o convite para desfrutar os dons da vida.
  alternative: “Deus já se agradou das suas obras” ou “Deus já aprovou o que você faz”.
  rationale: רָצָה com מַעֲשִׂים admite as ideias de aceitação favorável, prazer ou aprovação. A tradução conserva essa amplitude e não transforma isoladamente o versículo numa declaração de salvação meritória nem limita o sentido a atos cultuais.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Os imperativos na terceira pessoa (“Vá, coma, beba”) evitam regionalismo excessivo. A repetição de “seu” e a imagem do coração acompanham de perto o hebraico sem produzir uma frase artificial.
