source:
  edition: WLC
  text: זֶ֣ה רָ֗ע בְּ/כֹ֤ל אֲשֶֽׁר נַעֲשָׂה֙ תַּ֣חַת הַ/שֶּׁ֔מֶשׁ כִּֽי מִקְרֶ֥ה אֶחָ֖ד לַ/כֹּ֑ל וְ/גַ֣ם לֵ֣ב בְּֽנֵי הָ֠/אָדָם מָלֵא רָ֨ע וְ/הוֹלֵל֤וֹת בִּ/לְבָבָ/ם֙ בְּ/חַיֵּי/הֶ֔ם וְ/אַחֲרָ֖י/ו אֶל הַ/מֵּתִֽים׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/003.yaml
  text: 'This is the evil in all that is done under the sun: that one fate comes to all[a]. Also, the heart of the sons of man is full of evil, and madness is in their hearts during their lives—and afterward[c][b], they go to the dead.'
translation:
  language: pt
  text: 'Este é o mal em tudo o que se faz debaixo do sol: o mesmo destino sobrevém a todos.[a] Além disso, o coração dos seres humanos[b] está cheio de maldade, e há loucura em seu coração enquanto vivem; depois disso, vão para junto dos mortos.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o mesmo acontecimento sucede a todos”. A palavra hebraica pode indicar um acontecimento, aquilo que sobrevém a alguém ou um destino comum.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “dos filhos do homem”; a expressão hebraica refere-se aqui aos seres humanos em geral.
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico é abrupto: literalmente, “e, depois disso, para os mortos”. O verbo “vão” está subentendido; a referência exata de “disso” também fica condensada no original.'
    reason: textual_clarity
lexical_decisions:
- source_word: זֶה רָע
  choice: Este é o mal
  rationale: Mantém a força avaliativa da expressão hebraica e apresenta como mal a realidade específica descrita a seguir.
- source_word: בְּכֹל אֲשֶׁר נַעֲשָׂה תַּחַת הַשֶּׁמֶשׁ
  choice: em tudo o que se faz debaixo do sol
  rationale: Conserva a fórmula característica de Eclesiastes e o sentido passivo ou impessoal do hebraico em português natural.
- source_word: כִּי מִקְרֶה אֶחָד לַכֹּל
  choice: o mesmo destino sobrevém a todos
  rationale: מִקְרֶה designa aquilo que sucede a alguém e, neste contexto, aponta para o destino comum de todos; a nota preserva o sentido alternativo de acontecimento.
- source_word: לֵב בְּנֵי הָאָדָם
  choice: o coração dos seres humanos
  rationale: Expressa naturalmente o singular coletivo לֵב e o sentido genérico de בְּנֵי הָאָדָם, que abrange a humanidade, sem restringir a referência aos homens.
- source_word: מָלֵא רָע
  choice: está cheio de maldade
  rationale: Comunica a dimensão moral de רָע neste contexto sem tornar a expressão excessivamente abstrata.
- source_word: וְהוֹלֵלוֹת בִּלְבָבָם
  choice: e há loucura em seu coração
  rationale: Preserva a imagem hebraica do coração como centro do pensamento, da vontade e da conduta, bem como a força de הוֹלֵלוֹת, que indica irracionalidade ou desvario.
- source_word: בְּחַיֵּיהֶם
  choice: enquanto vivem
  rationale: Formulação temporal clara e idiomática que corresponde a 'durante a vida deles'.
- source_word: וְאַחֲרָיו אֶל הַמֵּתִים
  choice: depois disso, vão para junto dos mortos
  rationale: Torna explícito o movimento apenas subentendido na frase hebraica abrupta, sem acrescentar uma descrição do além nem resolver além do texto a referência exata do sufixo.
theological_decisions:
- issue: Sentido antropológico e de gênero de בְּנֵי הָאָדָם
  choice: os seres humanos
  alternative: os filhos do homem
  rationale: A expressão hebraica usa linguagem masculina representativa, mas refere-se genericamente à humanidade. A tradução principal comunica essa abrangência com clareza, e a nota registra a forma mais literal.
- issue: Natureza do destino comum expresso por מִקְרֶה
  choice: o mesmo destino sobrevém a todos
  alternative: o mesmo acontecimento sucede a todos
  rationale: No contexto imediato, o destino comum culmina na morte. Ainda assim, a tradução não impõe uma doutrina determinista, e a nota conserva a amplitude lexical de מִקְרֶה.
- issue: Elipse na referência aos mortos
  choice: vão para junto dos mortos
  alternative: e, depois disso, para os mortos
  rationale: O hebraico omite o verbo e termina de modo abrupto. A inclusão de 'vão' oferece uma frase portuguesa completa, enquanto a nota expõe a forma elíptica e evita transformar a expressão em uma afirmação detalhada sobre o estado dos mortos.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Conserva-se a fórmula tradicional de Eclesiastes “debaixo do sol”, ao mesmo tempo que se evitam construções excessivamente literais ou arcaicas. As notas preservam a amplitude de מִקְרֶה, a forma antropológica do hebraico e a elipse da cláusula final.
