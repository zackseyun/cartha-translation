  text: The words of the wise are heard in quiet more than the shouting of a ruler among fools[a][b].
translation:
  language: pt
  text: As palavras dos sábios são ouvidas em quietude mais do que os gritos de um governante entre os tolos[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “As palavras dos sábios, ouvidas em quietude, valem mais do que os gritos de um governante entre os tolos.” A comparação hebraica pode ser expressa como “mais ouvidas do que” ou com um sentido implícito de superioridade (“valem mais do que”).'
    reason: lexical_alternative
  - marker: b
    text: “Entre os tolos” também pode ser entendido como “sobre os tolos”, embora a preposição hebraica sugira mais naturalmente localização ou convivência neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי
  choice: palavras de
  rationale: O plural construto de דָּבָר designa aqui palavras ou declarações; “palavras de” é natural e mantém a construção hebraica.
- source_word: חֲכָמִים
  choice: os sábios
  rationale: O adjetivo masculino plural tem função substantiva e caracteriza uma classe de pessoas sem exigir explicitação de gênero em português.
- source_word: בְּנַחַת
  choice: em quietude
  rationale: נַחַת comunica quietude, calma ou serenidade; “em quietude” conserva a forma nominal e sustenta o contraste com os gritos.
- source_word: נִשְׁמָעִים
  choice: ouvidas
  rationale: O particípio nifal de שׁמע tem sentido passivo, “ouvidas”. A construção participial portuguesa preserva esse valor sem tornar o verso excessivamente rígido.
- source_word: מִזַּעֲקַת
  choice: valem mais do que os gritos de
  rationale: O מִן introduz a comparação, enquanto זַעֲקָה indica grito, clamor ou brado. “Valem mais do que” expressa em português natural a superioridade implícita, e “gritos” forma o contraste com a quietude.
- source_word: מוֹשֵׁל
  choice: um governante
  rationale: O particípio substantivado indica alguém que exerce autoridade. “Governante” é amplo, atual e não restringe o cargo político.
- source_word: בַּכְּסִילִים
  choice: entre os tolos
  rationale: 'A preposição בְּ é entendida mais naturalmente como locativa ou associativa: o governante está entre os tolos. “Sobre os tolos” continua possível e é registrada em nota.'
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Em quietude” preserva o contraste poético com “gritos”; a nota mantém a ambiguidade da construção comparativa hebraica.
