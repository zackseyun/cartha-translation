base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/001.yaml
  text: 'For I laid all this to my heart[a], even to examine all this: that the righteous and the wise and their works are in the hand of God. Whether love or hate, man does not know[b]; everything is before them.'
translation:
  language: pt
  text: 'Pois considerei tudo isso e procurei examiná-lo a fundo: os justos, os sábios e suas obras[a] estão na mão de Deus. Ninguém sabe se encontrará amor ou ódio; tudo está diante deles.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «seus servos». A forma hebraica também pode ser entendida dessa maneira, embora muitos a entendam aqui como «suas obras» ou «seus feitos».
    reason: alternative_reading
  - marker: b
    text: O hebraico desta cláusula final é difícil. Pode significar que ninguém sabe de antemão se encontrará amor ou ódio, ou que as circunstâncias presentes não revelam se alguém é amado ou odiado.
    reason: alternative_reading
lexical_decisions:
- source_word: נָתַתִּי אֶל לִבִּי
  choice: levei tudo isso ao coração
  rationale: Preserva a metáfora hebraica de reflexão interior séria em uma expressão natural e compreensível em português.
- source_word: וְלָבוּר
  choice: procurei examinar
  rationale: Expressa a investigação ou apuração mental indicada pelo verbo no contexto reflexivo de Eclesiastes.
- source_word: הַצַּדִּיקִים וְהַחֲכָמִים
  choice: os justos, os sábios
  rationale: Mantém os termos tradicionais e naturais da literatura sapiencial, sem restringir seu alcance moral e prático.
- source_word: וַעֲבָדֵיהֶם
  choice: suas obras
  rationale: No contexto, a leitura como ações ou obras dos justos e sábios produz boa coerência; a leitura formalmente possível como 'seus servos' é registrada em nota.
- source_word: בְּיַד הָאֱלֹהִים
  choice: nas mãos de Deus
  rationale: Conserva a imagem concreta hebraica de poder, governo e cuidado divinos; o plural é idiomático em português.
- source_word: גַּם אַהֲבָה גַם שִׂנְאָה
  choice: se encontrará amor ou ódio
  rationale: Apresenta os dois resultados contrastantes como desconhecidos, de acordo com a construção comprimida e o contexto.
- source_word: הָאָדָם
  choice: ninguém
  rationale: Transmite naturalmente o valor humano genérico da expressão no português atual, sem introduzir distinção de gênero ausente do sentido contextual.
- source_word: הַכֹּל לִפְנֵיהֶם
  choice: tudo está diante deles
  rationale: Mantém de perto a difícil formulação hebraica e evita resolver além do necessário se ela se refere ao que os aguarda ou às circunstâncias presentes.
theological_decisions:
- issue: Sentido de וַעֲבָדֵיהֶם
  choice: suas obras
  alternative: seus servos
  rationale: A referência às obras se integra à afirmação de que os justos, os sábios e o que fazem estão sob a mão de Deus. Como a forma hebraica admite naturalmente 'seus servos', a alternativa é preservada em nota.
- issue: Relação entre amor, ódio e o conhecimento humano
  choice: ninguém sabe se encontrará amor ou ódio
  alternative: as circunstâncias presentes não permitem saber se alguém é amado ou odiado
  rationale: O hebraico é comprimido e sua relação sintática com a cláusula final é incerta. O texto principal exprime a incerteza humana diante do que está à frente, enquanto a nota conserva a outra leitura contextual importante.
- issue: Alcance da expressão 'nas mãos de Deus'
  choice: preservar a metáfora sem explicação doutrinária no corpo do texto
  alternative: sob o controle de Deus
  rationale: A tradução literal e idiomática mantém abertas as nuances de poder, governo e cuidado, sem reduzir a expressão a uma formulação teológica mais estreita.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A tradução conserva as imagens do coração e das mãos de Deus, mas usa sintaxe corrente. Uma única nota reúne as duas ambiguidades textuais reais sem sobrecarregar o versículo.
