  text: וּ/מָ֣צָא בָ֗/הּ אִ֤ישׁ מִסְכֵּן֙ חָכָ֔ם וּ/מִלַּט ה֥וּא אֶת הָ/עִ֖יר בְּ/חָכְמָת֑/וֹ וְ/אָדָם֙ לֹ֣א זָכַ֔ר אֶת הָ/אִ֥ישׁ הַ/מִּסְכֵּ֖ן הַ/הּֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/015.yaml
  text: And there was found in it a poor wise man[a], and he delivered the city by his wisdom; yet no one remembered that poor man.
translation:
  language: pt
  text: Nela se encontrou um homem pobre e sábio,[a] que livrou a cidade com sua sabedoria; contudo, ninguém se lembrou daquele homem pobre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “E ele encontrou nela um homem pobre e sábio”; o sujeito de “encontrou” não está claro.'
    reason: ambiguity
lexical_decisions:
- source_word: וּמָצָא בָהּ
  choice: Nela se encontrou
  rationale: Embora a forma verbal seja ativa, na construção narrativa ela admite sentido existencial/indefinido. A formulação pronominal é natural em português e evita introduzir um sujeito não expresso com clareza; a leitura formalmente ativa é registrada em nota.
- source_word: אִישׁ מִסְכֵּן חָכָם
  choice: um homem pobre e sábio
  rationale: Mantém o substantivo masculino e os dois qualificativos do hebraico, com coordenação natural em português.
- source_word: וּמִלַּט הוּא אֶת הָעִיר
  choice: que livrou a cidade
  rationale: No Piel, מלט significa aqui livrar ou salvar, pois a cidade é o objeto direto. A oração relativa liga naturalmente a ação ao homem pobre e sábio; o pronome enfático הוּא confirma esse sujeito.
- source_word: בְּחָכְמָתוֹ
  choice: com sua sabedoria
  rationale: A preposição בְּ indica meio ou instrumento. “Com sua sabedoria” é idiomático e preserva essa força.
- source_word: וְאָדָם לֹא זָכַר
  choice: contudo, ninguém se lembrou
  rationale: אָדָם tem sentido humano genérico sob negação; “ninguém” comunica isso com precisão e naturalidade, sem sugerir exclusão das mulheres. A conjunção marca o contraste com o livramento anterior.
- source_word: הָאִישׁ הַמִּסְכֵּן הַהוּא
  choice: daquele homem pobre
  rationale: Reproduz a referência definida e demonstrativa ao indivíduo específico que livrou a cidade.
theological_decisions:
- issue: Sentido genérico de אָדָם na oração negativa
  choice: ninguém
  alternative: nenhum ser humano / nenhum homem
  rationale: Aqui אָדָם não identifica especificamente um indivíduo masculino, mas qualquer pessoa. “Ninguém” preserva o alcance genérico e é a expressão corrente em português.
- issue: Sujeito de וּמָצָא
  choice: 'construção existencial: “Nela se encontrou”'
  alternative: “Ele encontrou nela”
  rationale: A morfologia é Qal perfeito, terceira pessoa masculina singular, e pode retomar um sujeito do contexto anterior; porém, a construção é tradicionalmente entendida de modo indefinido/existencial neste relato. A nota conserva a possibilidade formal sem decidir silenciosamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “Livrou” preserva o tom sapiencial e evita uma formulação excessivamente técnica; “contudo” explicita o contraste inerente à sequência.
