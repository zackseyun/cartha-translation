base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/014.yaml
  text: There was a small city[a], and few men were in it; and a great king came against it, surrounded it, and built great siegeworks against it.
translation:
  language: pt
  text: Havia uma cidade pequena, e nela havia poucos homens. Um grande rei veio contra ela, cercou-a e construiu grandes obras de cerco contra ela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “construiu contra ela grandes baluartes” ou “construiu contra ela grandes rampas de cerco”. O termo hebraico מְצוֹדִים pode designar, de modo mais amplo, estruturas de cerco ou fortificações.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִיר קְטַנָּה
  choice: uma cidade pequena
  rationale: Traduz diretamente o substantivo comum עִיר e o adjetivo קְטַנָּה, preservando o contraste entre a pequenez da cidade e a grandeza do rei.
- source_word: וַאֲנָשִׁים בָּהּ מְעָט
  choice: com poucos homens nela
  rationale: Mantém o referente masculino plural de אֲנָשִׁים e expressa de modo natural em português que a cidade tinha poucos homens.
- source_word: וּבָא אֵלֶיהָ
  choice: veio contra ela
  rationale: Embora a construção possa significar simplesmente 'veio até ela', o contexto militar de cerco dá à aproximação um sentido hostil, expresso sem acrescentar explicitamente o verbo 'atacar'.
- source_word: מֶלֶךְ גָּדוֹל
  choice: um grande rei
  rationale: Preserva a correspondência lexical e o contraste retórico com a 'cidade pequena'.
- source_word: וְסָבַב אֹתָהּ
  choice: cercou-a
  rationale: No contexto militar, 'cercar' comunica naturalmente tanto a ideia de rodear quanto a de pôr sob cerco.
- source_word: וּבָנָה עָלֶיהָ
  choice: e construiu ... contra ela
  rationale: Preserva o sentido de בנה, 'construir', e entende עַל como direção hostil no contexto de operações de cerco.
- source_word: מְצוֹדִים גְּדֹלִים
  choice: grandes obras de cerco
  rationale: '''Obras de cerco'' abrange estruturas militares construídas contra uma cidade sem restringir o termo hebraico a baluartes ou rampas especificamente; ''grandes'' preserva גְּדֹלִים e sua repetição retórica.'
