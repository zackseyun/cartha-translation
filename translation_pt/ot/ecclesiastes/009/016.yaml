base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/016.yaml
  text: And I said[a], “Wisdom is better than strength,” but the wisdom of the poor man is despised[c][b], and his words are not heard.
translation:
  language: pt
  text: 'Então eu disse: “A sabedoria é melhor do que a força[a].” Mas a sabedoria do pobre[b] é desprezada, e suas palavras não são ouvidas[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “poder” ou “valentia”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “do pobre”; provavelmente se refere ao homem pobre e sábio do versículo anterior.'
    reason: cross_reference
  - marker: c
    text: Ou “não são escutadas” ou “ficam sem ser ouvidas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתִּי אָנִי
  choice: Então eu disse
  rationale: O waw seguido do perfeito na primeira pessoa introduz aqui a conclusão ou reflexão do narrador. “Então eu disse” preserva a sequência e soa natural em português.
- source_word: טוֹבָה חָכְמָה מִגְּבוּרָה
  choice: A sabedoria é melhor do que a força
  rationale: O adjetivo predicativo com מִן expressa comparação. “Força” mantém o sentido amplo de poder ou capacidade e se contrapõe naturalmente à sabedoria.
- source_word: וְחָכְמַת
  choice: Mas a sabedoria
  rationale: Embora וְ seja formalmente aditivo, o contexto estabelece contraste entre a superioridade da sabedoria e o desprezo dispensado à sabedoria do pobre; “mas” torna essa relação clara sem alterar o sentido.
- source_word: הַמִּסְכֵּן
  choice: do pobre
  rationale: O substantivo adjetival masculino singular designa uma pessoa pobre específica, provavelmente o homem pobre e sábio do versículo anterior. “Do pobre” é conciso e natural, sem acrescentar um substantivo ausente no hebraico.
- source_word: בְּזוּיָה
  choice: é desprezada
  rationale: A forma passiva/adjetival indica que essa sabedoria é tratada com desprezo. “É desprezada” preserva de modo direto sua força avaliativa.
- source_word: וּדְבָרָיו
  choice: e suas palavras
  rationale: O plural com sufixo refere-se ao conselho ou discurso dele. “Suas palavras” é a correspondência mais direta e mantém a referência pessoal.
- source_word: אֵינָם נִשְׁמָעִים
  choice: não são ouvidas
  rationale: A construção negativa com particípio nifal indica que as palavras não recebem audiência. A formulação mantém a ambiguidade entre não serem escutadas e não serem levadas em conta.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tradução conserva a estrutura sentenciosa do hebraico, explicita apenas o contraste contextual por meio de “mas” e mantém em “não são ouvidas” a possível nuance de ouvir e de dar atenção.
