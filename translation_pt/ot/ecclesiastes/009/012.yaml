source:
  edition: WLC
  text: כִּ֡י גַּם֩ לֹֽא יֵדַ֨ע הָ/אָדָ֜ם אֶת עִתּ֗/וֹ כַּ/דָּגִים֙ שֶׁ/נֶּֽאֱחָזִים֙ בִּ/מְצוֹדָ֣ה רָעָ֔ה וְ/כַ֨/צִּפֳּרִ֔ים הָ/אֲחֻז֖וֹת בַּ/פָּ֑ח כָּ/הֵ֗ם יֽוּקָשִׁים֙ בְּנֵ֣י הָֽ/אָדָ֔ם לְ/עֵ֣ת רָעָ֔ה כְּ/שֶׁ/תִּפּ֥וֹל עֲלֵי/הֶ֖ם פִּתְאֹֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/012.yaml
  text: 'For man does not even know his time: like fish that are caught in a cruel net[a], and like birds that are caught in a snare, so the sons of man are trapped at an evil time[c][b], when it suddenly falls upon them.'
translation:
  language: pt
  text: 'Pois o ser humano nem sequer conhece a sua hora: como peixes apanhados numa rede cruel e como pássaros apanhados numa armadilha, assim os seres humanos ficam presos num tempo de calamidade, quando esse tempo cai de repente sobre eles.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאָדָם
  choice: o ser humano
  rationale: O singular genérico hebraico representa a humanidade. Em português atual, “o ser humano” preserva o singular e a referência universal sem sugerir exclusivamente o sexo masculino.
- source_word: עִתּוֹ
  choice: a sua hora
  rationale: עֵת designa tempo ou ocasião; no contexto, “a sua hora” comunica de modo natural o momento desconhecido que sobrevém à pessoa, sem especificar se é a morte ou outra calamidade.
- source_word: מְצוֹדָה רָעָה
  choice: uma rede fatal
  rationale: O adjetivo רָעָה descreve aqui o caráter nocivo ou desastroso da rede, não uma qualidade moral. “Fatal” mantém a imagem concreta e sua força ameaçadora.
- source_word: צִפֳּרִים
  choice: pássaros
  rationale: Equivalente português amplo e natural para aves no paralelismo poético.
- source_word: פָּח
  choice: armadilha
  rationale: Designa um laço ou dispositivo para capturar aves. “Armadilha” é corrente, claro e mantém a imagem.
- source_word: יֽוּקָשִׁים
  choice: são enredados
  rationale: O passivo de יקש indica ser apanhado em laço ou armadilha. “São enredados” preserva a metáfora e distingue esta formulação das duas ocorrências anteriores de “apanhados”.
- source_word: בְּנֵי הָאָדָם
  choice: os seres humanos
  rationale: A expressão hebraica “filhos do homem” é um idiomatismo coletivo para a humanidade. A tradução semântica evita em português uma expressão artificial ou potencialmente confundida com um título teológico.
- source_word: לְעֵת רָעָה
  choice: num tempo de calamidade
  rationale: רָעָה caracteriza a ocasião como desastrosa. “Tempo de calamidade” exprime o sentido contextual de modo natural, sem atribuir maldade moral ao tempo.
- source_word: כְּשֶׁתִּפּוֹל עֲלֵיהֶם פִּתְאֹם
  choice: quando este cai de repente sobre eles
  rationale: O pronome “este” retoma “tempo”, refletindo a provável concordância do verbo feminino hebraico com עֵת, sem inserir explicitamente “desastre” no texto.
theological_decisions:
- issue: Sentido de “a sua hora”
  choice: Manter a expressão aberta, sem identificá-la explicitamente com a morte.
  alternative: “o momento da sua morte”
  rationale: O hebraico diz apenas עִתּוֹ, e o contexto permite uma hora de calamidade ou morte sem exigir uma identificação exclusiva.
- issue: Representação de אָדָם e בְּנֵי הָאָדָם
  choice: Traduzir por “o ser humano” e “os seres humanos”.
  alternative: “o homem” e “os filhos do homem”
  rationale: As expressões são genérica e coletiva neste contexto. A formulação escolhida conserva a abrangência humana e evita que “filhos do homem” seja lido como designação teológica, sem apagar a mudança do singular para o plural.
- issue: Valor de רָעָה nas duas expressões
  choice: Traduzir contextualmente por “fatal” e “de calamidade”.
  alternative: Repetir literalmente “má” em “rede má” e “tempo mau”.
  rationale: A repetição lexical hebraica é significativa, mas uma repetição literal soaria pouco natural e poderia sugerir maldade moral. As escolhas preservam em português o vínculo semântico de dano e desastre.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém o paralelismo entre peixes, pássaros e seres humanos, bem como a brusquidão da calamidade. Não foram usadas notas, pois as ambiguidades relevantes puderam ser preservadas ou expressas diretamente no texto.
