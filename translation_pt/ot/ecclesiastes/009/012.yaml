    rationale: O adjetivo hebraico pode indicar algo mau, nocivo ou desastroso, mas não afirma necessariamente que a rede seja letal. “Cruel” preserva melhor a força ameaçadora sem especificar o resultado.
  - severity: low
    issue: “São enredados” é menos preciso e menos claro do que uma expressão de captura.
    rationale: יֻקָּשִׁים designa ser apanhado ou preso numa armadilha. “Ficam presos” conserva a metáfora e é idiomático em português.
  - severity: low
    issue: “Quando este cai” tem uma retomada pronominal um pouco pesada.
    rationale: “Esse tempo” explicita o antecedente de modo mais natural e preserva a ligação provável com עֵת, sem introduzir “desastre” como sujeito explícito.
