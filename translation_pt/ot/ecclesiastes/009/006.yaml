base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/006.yaml
  text: Their love[a], their hatred, and their jealousy have already perished, and they no longer have a share forever in anything that is done under the sun.
translation:
  language: pt
  text: O amor deles, o ódio deles e o ciúme[a] deles já pereceram; e já não têm parte, para sempre, em nada do que se faz debaixo do sol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “zelo” ou “inveja”.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם ... גַּם ... גַּם
  choice: Também o amor, o ódio e o ciúme deles
  rationale: A repetição coordena e enfatiza os três substantivos. Em português, “também” no início e a enumeração natural preservam a força cumulativa sem uma repetição artificial.
- source_word: אַהֲבָתָם
  choice: o amor ... deles
  rationale: Reproduz diretamente o substantivo abstrato com o sufixo de terceira pessoa do plural.
- source_word: שִׂנְאָתָם
  choice: o ódio ... deles
  rationale: “Ódio” é o substantivo abstrato corrente e mantém o paralelismo com “amor” e “ciúme”.
- source_word: קִנְאָתָם
  choice: o ciúme ... deles
  rationale: קִנְאָה pode significar ciúme, zelo ou inveja. Neste conjunto de paixões humanas, “ciúme” expressa bem o sentido relacional, enquanto a nota preserva as alternativas genuínas.
- source_word: כְּבָר אָבָדָה
  choice: já pereceram
  rationale: “Já” marca o estado consumado, e “pereceram” conserva a força de אבד. O plural é natural em português porque o sujeito é composto, embora o verbo hebraico esteja no singular feminino coletivo.
- source_word: וְחֵלֶק אֵין לָהֶם עוֹד לְעוֹלָם
  choice: e eles nunca mais terão parte
  rationale: A construção existencial hebraica é expressa idiomaticamente. “Nunca mais” reúne a cessação indicada por עוֹד e a permanência enfática de לְעוֹלָם, sem sugerir além do contexto uma afirmação metafísica irrestrita.
- source_word: בְּכֹל אֲשֶׁר נַעֲשָׂה
  choice: em coisa alguma que se faz
  rationale: Depois da negação, “coisa alguma” comunica naturalmente a abrangência de “tudo o que”. “Que se faz” preserva a forma passiva/reflexiva do hebraico.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: debaixo do sol
  rationale: Expressão característica de Eclesiastes para a esfera da vida e das atividades terrenas; é tradicional, clara e natural em português.
theological_decisions:
- issue: Alcance da afirmação sobre a relação dos mortos com os assuntos terrenos
  choice: O texto afirma que eles nunca mais participam do que se faz na esfera terrena, “debaixo do sol”.
  alternative: Entender o versículo como uma declaração metafísica mais ampla sobre a total ausência de consciência dos mortos em qualquer sentido.
  rationale: A qualificação explícita “debaixo do sol” delimita a afirmação às atividades terrenas. A tradução mantém esse limite e não resolve uma questão doutrinária que o versículo não formula diretamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da enumeração e a expressão tradicional “debaixo do sol” preservam o caráter sapiencial do texto sem rigidez sintática.
