base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/002.yaml
  text: 'All is the same for all: one fate comes to the righteous and to the wicked[a], to the good and to the clean and to the unclean, to the one who sacrifices and to the one who does not sacrifice; as the good one, so the sinner[b]; the one who swears is as the one who fears an oath.'
translation:
  language: pt
  text: 'Tudo é igual para todos: um mesmo destino[a] alcança o justo e o perverso, o bom, o puro e o impuro, quem oferece sacrifícios e quem não os oferece. Como o bom, assim o pecador; quem jura é como quem teme um juramento[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um mesmo acontecimento” ou “uma mesma sorte”.
    reason: lexical_alternative
  - marker: b
    text: Ou “quem teme jurar”.
    reason: alternative_reading
lexical_decisions:
- source_word: הַכֹּל כַּאֲשֶׁר לַכֹּל
  choice: Tudo é igual para todos
  rationale: Expressa em português natural a construção hebraica elíptica e abrangente, sem perder sua afirmação enfática.
- source_word: מִקְרֶה אֶחָד
  choice: um mesmo destino
  rationale: No contexto de Eclesiastes, indica o resultado comum que alcança todas as pessoas, provavelmente a morte, sem impor uma doutrina determinista.
- source_word: לַצַּדִּיק וְלָרָשָׁע
  choice: o justo e o perverso
  rationale: Mantém o contraste ético tradicional; 'perverso' é atual e evita que 'mau' se confunda com o 'bom' do contraste seguinte.
- source_word: לַטּוֹב וְלַטָּהוֹר וְלַטָּמֵא
  choice: o bom, o puro e o impuro
  rationale: Preserva as categorias distintas e deixa aberta a dimensão ritual de puro/impuro, sem limitá-las explicitamente ao campo moral ou cerimonial.
- source_word: לַזֹּבֵחַ וְלַאֲשֶׁר אֵינֶנּוּ זֹבֵחַ
  choice: quem oferece sacrifícios e quem não os oferece
  rationale: Traduz os particípios com construções naturais e mantém explícita a prática sacrificial.
- source_word: כַּטּוֹב כַּחֹטֶא
  choice: Como sucede ao bom, assim sucede ao pecador
  rationale: Conserva o paralelismo comparativo e liga claramente a frase ao destino comum mencionado no início.
- source_word: הַנִּשְׁבָּע כַּאֲשֶׁר שְׁבוּעָה יָרֵא
  choice: quem jura é como quem teme um juramento
  rationale: Mantém a formulação ambígua do hebraico quanto a temer prestar juramento ou tratar o juramento com temor reverente.
theological_decisions:
- issue: Sentido de מִקְרֶה אֶחָד
  choice: um mesmo destino
  alternative: um mesmo acontecimento; uma mesma sorte
  rationale: O contexto aponta para o resultado comum da condição mortal, mas a tradução não explicita 'morte' para não eliminar a amplitude lexical do hebraico.
- issue: Categorias de pureza
  choice: puro e impuro
  alternative: ritualmente puro e ritualmente impuro
  rationale: A redação mantém a possível dimensão cultual sem resolver os termos como exclusivamente rituais.
- issue: Contraste final relativo ao juramento
  choice: quem teme um juramento
  alternative: quem teme jurar; quem evita prestar juramento
  rationale: A expressão hebraica admite receio de jurar e cautela reverente diante de um juramento; o texto principal preserva essa tensão e a nota apresenta a leitura idiomática.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição dos pares contrastantes e o paralelismo sapiencial foram preservados, evitando terminologia confessional específica.
