  text: כֹּ֠ל אֲשֶׁ֨ר תִּמְצָ֧א יָֽדְ/ךָ֛ לַ/עֲשׂ֥וֹת בְּ/כֹחֲ/ךָ֖ עֲשֵׂ֑ה כִּי֩ אֵ֨ין מַעֲשֶׂ֤ה וְ/חֶשְׁבּוֹן֙ וְ/דַ֣עַת וְ/חָכְמָ֔ה בִּ/שְׁא֕וֹל אֲשֶׁ֥ר אַתָּ֖ה הֹלֵ֥ךְ שָֽׁמָּ/ה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/010.yaml
  text: Whatever your hand finds to do, do it with your strength, for there is no work or planning or knowledge or wisdom in Sheol, where you are going.
translation:
  language: pt
  text: Tudo o que sua mão encontrar para fazer, faça com a sua força, pois não há trabalho, nem planejamento, nem conhecimento, nem sabedoria no Sheol[a], para onde você está indo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na sepultura” ou “no mundo dos mortos”. O termo hebraico Sheol designa o lugar ou estado dos mortos no Antigo Testamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: Tudo o que
  rationale: Introduz uma oração relativa irrestrita e preserva naturalmente em português a abrangência de “tudo quanto/qualquer coisa que”.
- source_word: תִּמְצָא יָדְךָ
  choice: a sua mão encontrar
  rationale: Mantém a imagem hebraica da mão, que expressa oportunidade e capacidade prática, sem reduzi-la simplesmente a “você encontrar”.
- source_word: לַעֲשׂוֹת ... עֲשֵׂה
  choice: para fazer, faça
  rationale: Reproduz a repetição enfática da raiz עשׂה e soa natural em português.
- source_word: בְּכֹחֲךָ
  choice: com toda a sua força
  rationale: Expressa idiomaticamente o empenho da força disponível. Embora “toda” não apareça como palavra separada, o valor idiomático do sintagma no contexto é agir plenamente segundo a própria força.
- source_word: כִּי אֵין
  choice: pois não há
  rationale: Apresenta de modo claro e conciso a razão da exortação.
- source_word: מַעֲשֶׂה
  choice: trabalho
  rationale: Designa aqui atividade ou obra prática, sem a possível conotação moral mais estreita de “feito”.
- source_word: חֶשְׁבּוֹן
  choice: planejamento
  rationale: No contexto, comunica cálculo, elaboração de planos ou reflexão prática; “planejamento” se integra naturalmente à série.
- source_word: דַעַת
  choice: conhecimento
  rationale: Preserva o sentido cognitivo usual do termo e sua distinção em relação a “sabedoria”.
- source_word: חָכְמָה
  choice: sabedoria
  rationale: Mantém o sentido sapiencial amplo e recorrente em Eclesiastes.
- source_word: בִּשְׁאוֹל
  choice: no Sheol
  rationale: A transliteração preserva o conceito hebraico do domínio ou estado dos mortos, sem identificá-lo indevidamente com “inferno” ou apenas com uma sepultura física.
- source_word: אֲשֶׁר אַתָּה הֹלֵךְ שָׁמָּה
  choice: para onde você está indo
  rationale: Expressa naturalmente o destino indicado pela oração relativa e conserva o aspecto progressivo do particípio hebraico.
theological_decisions:
- issue: Tradução de שְׁאוֹל
  choice: Sheol
  alternative: sepultura; mundo dos mortos
  rationale: O termo hebraico se refere ao domínio ou estado dos mortos na concepção veterotestamentária. Mantê-lo transliterado evita importar a noção posterior de “inferno” e preserva sua amplitude sem reduzi-lo necessariamente à sepultura física.
- issue: Ausência de atividade e sabedoria no Sheol
  choice: Preservar a afirmação direta do texto
  alternative: Explicá-la como referente apenas à atividade terrena
  rationale: A tradução mantém a formulação enfática e a tensão teológica do versículo, sem acrescentar uma harmonização que o hebraico não explicita.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Conserva-se a imagem concreta da mão e a transliteração “Sheol”; a sequência nominal é marcada por “nem” para fluidez e ênfase em português.
