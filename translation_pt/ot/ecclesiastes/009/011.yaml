base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/011.yaml
  text: I again saw under the sun that the race is not to the swift[a], nor the battle to the mighty, and also bread is not to the wise, nor riches to the discerning, nor favor to those who know; for time and chance happen to them all.
translation:
  language: pt
  text: Vi ainda, debaixo do sol, que a corrida não é dos velozes, nem a batalha é dos valentes; tampouco o pão é dos sábios, nem a riqueza é dos que têm discernimento, nem o favor é dos que têm conhecimento; pois o tempo e o acaso[a] alcançam a todos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tempo e acontecimento”, “tempo e imprevisto” ou “tempo e infortúnio”. A expressão hebraica ressalta que circunstâncias imprevisíveis alcançam a todos.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבְתִּי וְרָאֹה
  choice: Vi ainda
  rationale: A expressão introduz uma nova observação de Qohelet. “Vi ainda” comunica repetição discursiva em português natural, sem sugerir necessariamente deslocamento físico.
- source_word: תַחַת הַשֶּׁמֶשׁ
  choice: debaixo do sol
  rationale: Mantém a expressão característica de Eclesiastes para a esfera da experiência humana terrena.
- source_word: לַקַּלִּים הַמֵּרוֹץ
  choice: a corrida não é dos velozes
  rationale: Preserva a imagem concreta da competição e o sentido de pessoas rápidas.
- source_word: לַגִּבּוֹרִים הַמִּלְחָמָה
  choice: nem a batalha, dos valentes
  rationale: “Valentes” abrange força e capacidade guerreira; “batalha” corresponde ao evento singular no paralelismo com “corrida”.
- source_word: לַחֲכָמִים לֶחֶם
  choice: tampouco o pão é dos sábios
  rationale: “Pão” conserva a imagem hebraica concreta de alimento e sustento.
- source_word: לַנְּבֹנִים עֹשֶׁר
  choice: nem a riqueza, dos que têm discernimento
  rationale: “Discernimento” expressa a capacidade perceptiva associada à raiz בין, enquanto “riqueza” traduz עֹשֶׁר de modo corrente.
- source_word: לַיֹּדְעִים חֵן
  choice: nem o favor, dos que têm conhecimento
  rationale: A formulação mantém amplo o tipo de conhecimento e traduz חֵן como acolhimento ou vantagem social, sem a possível carga teológica de “graça”.
- source_word: עֵת וָפֶגַע
  choice: o tempo e o acaso
  rationale: A expressão aponta para circunstâncias e ocorrências fora do controle e da previsão humana. “Acaso” é conciso e corrente, enquanto a nota registra outras possibilidades sem impor a ideia filosófica de que não há providência.
- source_word: יִקְרֶה אֶת כֻּלָּם
  choice: sobrevêm a todos eles
  rationale: “Sobrevêm” comunica que tais circunstâncias alcançam inesperadamente todas as pessoas mencionadas.
theological_decisions:
- issue: Se “tempo e acaso” nega a providência divina
  choice: Manter a linguagem experiencial de imprevisibilidade humana
  alternative: Traduzir de modo a afirmar que a vida é governada por mero acaso cego
  rationale: O hebraico descreve os resultados imprevisíveis da vida debaixo do sol, mas não formula aqui uma negação explícita da soberania divina. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência proverbial. As elipses em “nem a batalha, dos valentes” e nas linhas seguintes preservam o paralelismo sem repetição excessiva. O marcador [a] foi colocado junto de “tempo e acaso”, a expressão à qual a nota efetivamente se refere.
