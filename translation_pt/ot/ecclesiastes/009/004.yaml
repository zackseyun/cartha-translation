base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/004.yaml
  text: For whoever is joined to all the living has hope[b][a], because a living dog is better than a dead lion.
translation:
  language: pt
  text: Pois quem está ligado aos vivos tem esperança[b][a], porque um cão vivo é melhor que um leão morto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: «quem é escolhido entre todos os vivos tem confiança». A forma hebraica na oração inicial é difícil, e há outras maneiras de entendê-la.'
    reason: alternative_reading
  - marker: b
    text: «Esperança» também pode ser traduzida por «confiança» ou «segurança».
    reason: lexical_alternative
lexical_decisions:
- source_word: יבחר
  choice: está unido
  rationale: Embora as consoantes possam sugerir o verbo comum «escolher», a forma hebraica é difícil neste contexto, e versões antigas apoiam o sentido de estar ligado ou associado ao conjunto dos vivos. «Está unido» produz uma leitura coerente sem ocultar a alternativa.
- source_word: אֶל כָּל הַחַיִּים
  choice: a todos os vivos
  rationale: A expressão indica associação com os vivos como grupo. Com «está unido», a preposição «a» conserva de modo natural em português a força relacional de אֶל.
- source_word: בִּטָּחוֹן
  choice: esperança
  rationale: O substantivo pode significar confiança ou segurança; aqui, porém, o contraste com os mortos destaca que permanecer vivo ainda deixa possibilidades abertas. «Esperança» comunica bem esse sentido pragmático.
- source_word: לְכֶלֶב חַי
  choice: um cão vivo
  rationale: Tradução direta com sentido indefinido, apropriado à forma proverbial da comparação.
- source_word: טוֹב מִן
  choice: é melhor que
  rationale: Construção comparativa comum, vertida com simplicidade proverbial e naturalidade em português.
- source_word: הָאַרְיֵה הַמֵּת
  choice: um leão morto
  rationale: Apesar dos artigos em hebraico, o indefinido soa mais natural na comparação proverbial em português e preserva o contraste qualitativo entre o cão vivo e o leão morto.
theological_decisions:
- issue: Sentido da oração inicial com יבחר
  choice: quem está unido a todos os vivos
  alternative: quem é escolhido entre todos os vivos
  rationale: A leitura «escolhido» segundo a vocalização massorética é difícil. O contexto favorece a ideia de que quem ainda pertence ao grupo dos vivos conserva esperança. A alternativa permanece registrada em nota, preservando a ambiguidade textual sem impor uma conclusão doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura proverbial foi mantida simples e direta. As notas preservam tanto a dificuldade da oração inicial quanto a amplitude semântica de בִּטָּחוֹן.
