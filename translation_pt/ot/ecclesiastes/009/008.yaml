  text: בְּ/כָל עֵ֕ת יִהְי֥וּ בְגָדֶ֖י/ךָ לְבָנִ֑ים וְ/שֶׁ֖מֶן עַל רֹאשְׁ/ךָ֥ אַל יֶחְסָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/008.yaml
  text: Let your garments always be white[b][a], and do not let oil be lacking on your head.
translation:
  language: pt
  text: Que as suas roupas estejam sempre brancas[a], e que nunca falte óleo sobre a sua cabeça.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Em todo tempo, que as suas roupas estejam brancas».'
    reason: lexical_alternative
  - marker: b
    text: A imagem de roupas brancas e óleo sobre a cabeça evoca celebração, alegria e bem-estar, em contraste com o luto.
    reason: cultural_note
lexical_decisions:
- source_word: בְּ/כָל עֵת
  choice: sempre
  rationale: A expressão significa literalmente «em todo tempo»; «sempre» comunica de modo natural sua força contínua em português.
- source_word: יִהְיוּ
  choice: que ... estejam
  rationale: O imperfeito tem aqui valor jussivo e expressa exortação, adequadamente representada pela construção «que ... estejam».
- source_word: בְגָדֶיךָ
  choice: as suas roupas
  rationale: «Roupas» é atual, claro e preserva o plural concreto do hebraico sem soar excessivamente formal.
- source_word: לְבָנִים
  choice: brancas
  rationale: O adjetivo denota a cor branca; a tradução direta preserva a imagem sem explicá-la dentro do texto.
- source_word: וְשֶׁמֶן
  choice: óleo
  rationale: O hebraico diz apenas «óleo»; não se especifica azeite nem óleo de unção, portanto a formulação geral evita acrescentar informação.
- source_word: עַל רֹאשְׁךָ
  choice: sobre a sua cabeça
  rationale: Tradução direta e natural da locução preposicional, mantendo a imagem concreta.
- source_word: אַל יֶחְסָר
  choice: que nunca falte
  rationale: A partícula negativa com o imperfeito tem força proibitiva ou jussiva. «Que nunca falte» mantém a exortação e combina naturalmente com a ideia contínua da primeira oração.
