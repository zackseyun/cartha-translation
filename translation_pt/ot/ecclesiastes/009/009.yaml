source:
  edition: WLC
  text: רְאֵ֨ה חַיִּ֜ים עִם אִשָּׁ֣ה אֲשֶׁר אָהַ֗בְתָּ כָּל יְמֵי֙ חַיֵּ֣י הֶבְלֶ֔/ךָ אֲשֶׁ֤ר נָֽתַן לְ/ךָ֙ תַּ֣חַת הַ/שֶּׁ֔מֶשׁ כֹּ֖ל יְמֵ֣י הֶבְלֶ֑/ךָ כִּ֣י ה֤וּא חֶלְקְ/ךָ֙ בַּֽ/חַיִּ֔ים וּ/בַ/עֲמָ֣לְ/ךָ֔ אֲשֶׁר אַתָּ֥ה עָמֵ֖ל תַּ֥חַת הַ/שָּֽׁמֶשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/009.yaml
  text: Enjoy life with the wife whom you love all the days of your fleeting life that he has given you under the sun—all your fleeting days—for that is your portion in life and in your labor at which you toil under the sun[a][b][c].
translation:
  language: pt
  text: Desfrute da vida com a mulher que você ama, todos os dias da sua vida passageira que ele lhe deu debaixo do sol — todos os seus dias passageiros —, pois isso é a sua porção na vida e no trabalho em que você se afadiga debaixo do sol.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Veja a vida com a mulher que você ama”. A expressão hebraica “ver a vida” pode significar experimentar ou desfrutar a vida.'
    reason: lexical_alternative
  - marker: b
    text: Hebraico hével, muitas vezes traduzido por “vaidade” ou “vapor”; aqui expressa o caráter transitório e insubstancial da vida.
    reason: lexical_alternative
  - marker: c
    text: O sujeito de “deu” está implícito no hebraico. O contexto mais amplo indica Deus, embora ele não seja nomeado nesta oração.
    reason: alternative_reading
lexical_decisions:
- source_word: רְאֵה חַיִּים
  choice: Desfrute a vida
  rationale: Embora a expressão signifique literalmente “veja a vida”, neste contexto sapiencial ela comunica experimentar e usufruir a vida. “Desfrute a vida” reproduz naturalmente essa força idiomática em português.
- source_word: עִם אִשָּׁה אֲשֶׁר אָהַבְתָּ
  choice: com a mulher que você ama
  rationale: אִשָּׁה pode significar “mulher” ou “esposa”. A relação conjugal é sugerida pelo contexto, mas “a mulher que você ama” preserva a forma lexical e soa natural, sem tornar explícito mais do que o hebraico.
- source_word: חַיֵּי הֶבְלֶךָ / יְמֵי הֶבְלֶךָ
  choice: sua vida passageira / seus dias passageiros
  rationale: הֶבֶל evoca vapor, transitoriedade e falta de substância. “Passageira/os” destaca a brevidade sem reduzir o termo a “sem sentido” ou “vaidade”, preservando melhor sua amplitude em Eclesiastes.
- source_word: אֲשֶׁר נָתַן לְךָ
  choice: que ele lhe deu
  rationale: O verbo hebraico possui sujeito masculino singular implícito. O contexto aponta para Deus, mas a oração não o nomeia; manter “ele” conserva essa reserva do texto.
- source_word: תַּחַת הַשֶּׁמֶשׁ
  choice: debaixo do sol
  rationale: Expressão característica de Eclesiastes para a existência terrena na ordem presente; a formulação é consagrada, clara e fiel.
- source_word: כִּי הוּא חֶלְקְךָ
  choice: pois essa é a sua porção
  rationale: חֵלֶק designa a parte ou quota atribuída a alguém. “Porção” conserva a metáfora sapiencial de uma parcela concedida.
- source_word: וּבַעֲמָלְךָ אֲשֶׁר אַתָּה עָמֵל
  choice: e no trabalho em que você se empenha
  rationale: עָמָל abrange trabalho árduo, esforço e fadiga. A combinação “trabalho em que você se empenha” evita uma repetição pesada em português e mantém a ideia de esforço contínuo.
theological_decisions:
- issue: Sujeito implícito de נָתַן (“deu”)
  choice: Manter “ele” no texto principal.
  alternative: Explicitar “Deus”.
  rationale: No contexto mais amplo, Deus é o doador implícito, porém não é nomeado nesta oração. A tradução mantém a referência implícita e registra a identificação contextual em nota.
- issue: Sentido de הֶבֶל neste versículo
  choice: Traduzir por “passageira/os”.
  alternative: “Vaidosa/os”, “fugaz/es”, “como vapor” ou “sem sentido”.
  rationale: O termo preserva tensão entre brevidade, insubstancialidade e frustração. “Passageira/os” comunica a transitoriedade mais pertinente aqui sem impor a conclusão teológica de que a vida seja inteiramente destituída de sentido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” para o singular de segunda pessoa, mantém a expressão característica “debaixo do sol” e conserva a longa cadência reflexiva do hebraico sem sacrificar a clareza.
