    rationale: O hebraico usa o demonstrativo masculino הוּא, com referência resumitiva ao conteúdo precedente. Em português, «essa» tende a retomar um substantivo feminino específico, especialmente «vida» ou «mulher», e pode estreitar indevidamente o referente. «Isso» mantém a referência abrangente.
