  text: וּ/זְכֹר֙ אֶת בּ֣וֹרְאֶ֔י/ךָ בִּ/ימֵ֖י בְּחוּרֹתֶ֑י/ךָ עַ֣ד אֲשֶׁ֤ר לֹא יָבֹ֨אוּ֙ יְמֵ֣י הָֽ/רָעָ֔ה וְ/הִגִּ֣יעוּ שָׁנִ֔ים אֲשֶׁ֣ר תֹּאמַ֔ר אֵֽין לִ֥/י בָ/הֶ֖ם חֵֽפֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/001.yaml
  text: And remember your Creator in the days of your youth[a], before the evil days come and the years arrive of which you will say, “I have no pleasure in them.”
translation:
  language: pt
  text: 'E lembre-se do seu Criador[a] nos dias da sua juventude, antes que venham os dias maus e cheguem os anos dos quais você dirá: “Não tenho prazer neles.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em hebraico, a expressão tem forma plural, literalmente “seus criadores”; aqui, porém, refere-se a Deus como título singular: “seu Criador”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְכֹר
  choice: E lembre-se
  rationale: O imperativo qal masculino singular de זכר expressa uma exortação direta. A conjunção inicial foi preservada para manter a ligação com o contexto anterior; a construção pronominal é natural no português moderno.
- source_word: אֶת בּוֹרְאֶיךָ
  choice: do seu Criador
  rationale: Embora בּוֹרְאֶיךָ tenha forma morfológica plural, o contexto se refere ao único Deus. O singular comunica o referente pretendido sem sugerir politeísmo, enquanto a particularidade formal é registrada em nota.
- source_word: בִּימֵי בְּחוּרֹתֶיךָ
  choice: nos dias da sua juventude
  rationale: A expressão designa o período de vigor juvenil. A tradução conserva a imagem temporal do hebraico e permanece clara e idiomática.
- source_word: עַד אֲשֶׁר לֹא יָבֹאוּ
  choice: antes que venham
  rationale: Neste contexto, a expressão estabelece o limite anterior à chegada de uma realidade indesejável. “Antes que” comunica esse sentido naturalmente.
- source_word: יְמֵי הָרָעָה
  choice: os dias maus
  rationale: רָעָה descreve aqui dias penosos ou adversos, no contexto do envelhecimento. “Dias maus” preserva a formulação sombria e relativamente aberta do hebraico.
- source_word: וְהִגִּיעוּ שָׁנִים
  choice: e cheguem os anos
  rationale: O verbo no hifil comunica alcançar ou chegar. “Cheguem” é natural e mantém a imagem de anos que sobrevêm à pessoa.
- source_word: אֲשֶׁר תֹּאמַר
  choice: dos quais você dirá
  rationale: A oração relativa modifica “anos”. Esta formulação preserva a relação gramatical e a perspectiva futura.
- source_word: אֵין לִי בָהֶם חֵפֶץ
  choice: Não tenho prazer neles
  rationale: חֵפֶץ pode indicar prazer, deleite ou satisfação. A escolha é clara, digna e conserva a avaliação pessoal expressa no hebraico.
theological_decisions:
- issue: Número gramatical de בּוֹרְאֶיךָ (“seu Criador/seus criadores”)
  choice: 'Singular: “seu Criador”'
  alternative: 'Plural formal: “seus criadores”'
  rationale: A palavra apresenta forma plural, mas, no contexto monoteísta da sabedoria de Israel, refere-se ao único Deus. O singular transmite o referente contextual sem eliminar a peculiaridade do original, que é indicada na nota.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com boa legibilidade brasileira. A tradução conserva o encadeamento poético, a imagem dos “dias” e “anos” e a sobriedade do aviso sobre a velhice.
