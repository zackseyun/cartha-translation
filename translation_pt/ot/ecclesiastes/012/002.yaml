base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/002.yaml
  text: before the sun and the light and the moon and the stars grow dark[a], and the clouds return after the rain.
translation:
  language: pt
  text: antes que escureçam o sol, a luz, a lua e as estrelas[a], e as nuvens voltem depois da chuva.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “antes que o sol, a luz, a lua e as estrelas fiquem escuros”.'
    reason: Alternativa lexical para תֶחְשַׁךְ, tornando mais explícito o sentido incoativo ou resultativo de ficar escuro.
lexical_decisions:
- source_word: עַד אֲשֶׁר לֹא
  choice: antes que
  rationale: No contexto da exortação iniciada no versículo anterior, a construção introduz aquilo que ainda não ocorreu e equivale naturalmente a “antes que”.
- source_word: תֶחְשַׁךְ
  choice: escureçam
  rationale: O Qal de חשׁך expressa ficar escuro ou perder a luminosidade. O plural em português faz concordância natural com a série coordenada de sujeitos, embora o hebraico empregue verbo no singular antes da enumeração.
- source_word: הַשֶּׁמֶשׁ וְהָאוֹר וְהַיָּרֵחַ וְהַכּוֹכָבִים
  choice: o sol, a luz, a lua e as estrelas
  rationale: Mantém os equivalentes diretos e a sequência poética do hebraico; “a luz” evita restringir אוֹר especificamente à luz do dia.
- source_word: וְשָׁבוּ
  choice: e ... voltem
  rationale: שׁוב significa retornar ou voltar. O subjuntivo mantém a dependência sintática de “antes que” em português.
- source_word: הֶעָבִים
  choice: as nuvens
  rationale: Equivalente direto e corrente de עָבִים.
- source_word: אַחַר הַגָּשֶׁם
  choice: depois da chuva
  rationale: Tradução direta e idiomática, preservando a imagem de nuvens que retornam após a chuva.
theological_decisions:
- issue: Sentido das imagens do escurecimento cósmico e do retorno das nuvens
  choice: Preservar as imagens poéticas sem explicá-las no texto principal.
  alternative: Explicitá-las como velhice, deterioração das faculdades, juízo ou repetição de sofrimentos.
  rationale: O versículo apresenta imagens que podem aludir ao declínio da vida, mas não fornece uma interpretação explícita. Mantê-las abertas preserva a ambiguidade e a tensão poética do texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A enumeração conserva a simplicidade e o ritmo poético do hebraico; não se acrescenta uma interpretação alegórica das imagens.
