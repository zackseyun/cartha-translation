base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/013.yaml
  text: 'The end of the matter, when all has been heard: fear God and keep his commandments, for this is the whole of man.[a]'
translation:
  language: pt
  text: 'A conclusão do assunto, depois de tudo ter sido ouvido: tema a Deus e guarde os seus mandamentos, pois este é o todo do ser humano.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “pois este é todo o ser humano”. A expressão incomum também pode ser entendida como “pois isto se aplica a todo ser humano”; o hebraico não emprega aqui uma palavra para “dever”.'
    reason: Expõe a construção elíptica e genuinamente ambígua כָּל־הָאָדָם, sem impor a adição interpretativa de «dever».
lexical_decisions:
- source_word: סוֹף דָּבָר
  choice: Conclusão de tudo
  rationale: Expressa naturalmente o desfecho ou resumo final do assunto, sem transformar סוֹף em mera referência cronológica.
- source_word: הַכֹּל נִשְׁמָע
  choice: depois de tudo ter sido ouvido
  rationale: Mantém a voz passiva e a possível ideia de que todos os argumentos ou palavras foram considerados.
- source_word: יְרָא
  choice: tema
  rationale: No contexto sapiencial, 'temer a Deus' comunica reverência obediente e reconhecimento de sua autoridade, preservando a expressão bíblica sem reduzi-la a mero respeito.
- source_word: שְׁמוֹר
  choice: guarde
  rationale: Verbo corrente que abrange observar, conservar e obedecer aos mandamentos.
- source_word: כָּל־הָאָדָם
  choice: o ser humano por inteiro
  rationale: Preserva a formulação concisa e ambígua do hebraico, que diz literalmente 'todo/o todo do ser humano', sem acrescentar 'dever', termo ausente do texto.
theological_decisions:
- issue: Sentido de כִּי זֶה כָּל־הָאָדָם
  choice: pois isso é o ser humano por inteiro
  alternative: pois este é todo o dever do ser humano
  rationale: A tradução escolhida evita inserir 'dever', que não tem equivalente expresso no hebraico, e conserva a tensão entre totalidade da existência, identidade e vocação humana.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. Emprega imperativos no singular em correspondência ao hebraico e conserva a fórmula bíblica 'temer a Deus'. O marcador [a] aparece no texto principal.
