  text: וְ/יָשֹׁ֧ב הֶ/עָפָ֛ר עַל הָ/אָ֖רֶץ כְּ/שֶׁ/הָיָ֑ה וְ/הָ/ר֣וּחַ תָּשׁ֔וּב אֶל הָ/אֱלֹהִ֖ים אֲשֶׁ֥ר נְתָנָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/007.yaml
  text: and the dust returns to the earth as it was[a], and the spirit returns to God who gave it.
translation:
  language: pt
  text: e o pó volte à terra, como era, e o espírito[a] volte a Deus, que o deu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «sopro». A palavra hebraica רוּחַ pode significar «espírito», «sopro» ou «vento»; neste contexto de morte, «espírito» parece mais provável, embora «sopro» continue sendo uma alternativa possível.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשֹׁב
  choice: e ... volte
  rationale: O imperfeito qal de שׁוב exprime aqui o resultado inevitável da morte. O subjuntivo «volte» mantém a ligação sintática com a sequência iniciada por «antes que» no contexto anterior e preserva o paralelismo com תָּשׁוּב.
- source_word: הֶעָפָר
  choice: o pó
  rationale: Mantém o artigo hebraico e a imagem da matéria do corpo humano, com provável eco da linguagem de criação e mortalidade.
- source_word: עַל הָאָרֶץ
  choice: à terra
  rationale: Com o verbo «voltar», עַל indica o destino do retorno. «À terra» é idiomático em português e preserva אֶרֶץ sem substituí-lo por «solo».
- source_word: כְּשֶׁהָיָה
  choice: como era
  rationale: Reproduz diretamente a comparação com o estado anterior, sem explicitar além do texto em que sentido o pó já pertencia à terra.
- source_word: וְהָרוּחַ
  choice: e o espírito
  rationale: רוּחַ pode significar «espírito», «sopro» ou «vento». No contraste entre o pó que volta à terra e aquilo que volta ao Deus que o deu, «espírito» comunica melhor o sentido contextual, enquanto «sopro» permanece na nota como alternativa lexical genuína.
- source_word: תָּשׁוּב
  choice: volte
  rationale: Repete o mesmo verbo usado na primeira oração, conservando o paralelismo poético entre o retorno do pó e o retorno do espírito.
- source_word: אֶל הָאֱלֹהִים
  choice: a Deus
  rationale: A preposição אֶל indica movimento em direção a alguém. Em português, o nome «Deus» dispensa artigo neste uso.
- source_word: אֲשֶׁר נְתָנָהּ
  choice: que o deu
  rationale: A oração relativa identifica Deus como aquele que deu o espírito. O pronome masculino «o» concorda naturalmente com «espírito» em português.
theological_decisions:
- issue: Sentido de רוּחַ no contexto da morte humana
  choice: espírito
  alternative: sopro
  rationale: «Espírito» preserva o contraste entre o componente corporal que retorna à terra e a realidade dada por Deus que retorna a ele, sem definir em detalhe uma antropologia que o versículo não desenvolve. A nota conserva «sopro» como alternativa lexical plausível e evita eliminar a tensão semântica do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O subjuntivo «volte» considera a dependência sintática do contexto precedente («antes que») e mantém a cadência poética. A repetição de «volte» conserva o paralelismo do hebraico.
