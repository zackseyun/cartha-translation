source:
  edition: WLC
  text: עַ֣ד אֲשֶׁ֤ר לֹֽא ירחק חֶ֣בֶל הַ/כֶּ֔סֶף וְ/תָרֻ֖ץ גֻּלַּ֣ת הַ/זָּהָ֑ב וְ/תִשָּׁ֤בֶר כַּד֙ עַל הַ/מַּבּ֔וּעַ וְ/נָרֹ֥ץ הַ/גַּלְגַּ֖ל אֶל הַ/בּֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/006.yaml
  text: before the silver cord is snapped[a], and the golden bowl is shattered, and the jar is broken at the spring[d][c][b], and the wheel is crushed at the pit.
translation:
  language: pt
  text: antes que se rompa o cordão de prata[a], se despedace a taça de ouro, se quebre o cântaro junto à fonte[b] e se esmague a roda junto ao poço[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seja afastado”, “seja cortado” ou, tradicionalmente, “se solte”; o verbo hebraico é difícil neste contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “junto à nascente”.
    reason: lexical_alternative
  - marker: c
    text: A “roda” pode ser, mais especificamente, a roda ou roldana de um poço. O termo traduzido por “poço” também pode significar “cisterna” ou “cova”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד אֲשֶׁר לֹא
  choice: antes que
  rationale: A expressão introduz, de modo natural em português, o momento anterior à morte no contexto da exortação precedente.
- source_word: ירחק
  choice: se rompa
  rationale: O verbo é difícil neste contexto poético. “Se rompa” condiz com o cordão e com a sequência de destruição, enquanto a nota preserva outras possibilidades.
- source_word: חֶבֶל הַכֶּסֶף
  choice: o cordão de prata
  rationale: Reproduz diretamente a construção hebraica e mantém a imagem poética.
- source_word: וְתָרֻץ
  choice: se despedace
  rationale: Expressa a quebra violenta indicada por רצץ e é natural para uma taça frágil.
- source_word: גֻּלַּת הַזָּהָב
  choice: a taça de ouro
  rationale: גֻּלָּה pode indicar uma taça ou recipiente semelhante; evita especificar sem necessidade que se trate de um reservatório de lâmpada.
- source_word: וְתִשָּׁבֶר כַּד
  choice: se quebre o cântaro
  rationale: כַּד designa um recipiente usado para buscar água; “cântaro” conserva com clareza essa associação em português.
- source_word: עַל הַמַּבּוּעַ
  choice: junto à fonte
  rationale: מַבּוּעַ denota uma nascente ou fonte; “junto à fonte” comunica naturalmente a localização.
- source_word: וְנָרֹץ
  choice: se esmague
  rationale: Mantém a força destrutiva de רצץ sem repetir exatamente o verbo usado na oração anterior.
- source_word: הַגַּלְגַּל
  choice: a roda
  rationale: É o sentido lexical mais amplo; no contexto, pode ser especificamente a roda ou roldana de um poço, possibilidade registrada em nota.
- source_word: אֶל הַבּוֹר
  choice: junto ao poço
  rationale: בּוֹר pode designar cova, cisterna ou poço. No cenário de extração de água, “poço” é natural; אֶל pode indicar movimento ou relação espacial dirigida ao local, aqui vertida sem impor que a roda caia dentro dele.
theological_decisions:
- issue: Interpretação das imagens do versículo
  choice: Manter literalmente a sequência de objetos rompidos como imagens poéticas da morte.
  alternative: Identificar cada objeto com uma parte específica do corpo humano envelhecido.
  rationale: Embora o conjunto represente amplamente o colapso da vida, as correspondências anatômicas específicas são discutidas. A tradução preserva a tensão interpretativa sem impor uma alegoria detalhada.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. A coordenação verbal foi mantida sem repetição excessiva, e as imagens concretas não foram convertidas em explicações alegóricas.
