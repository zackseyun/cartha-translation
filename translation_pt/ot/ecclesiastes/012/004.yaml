base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/004.yaml
  text: and the doors on the street are shut when the sound of the grinding is low[a], and one rises at the sound of a bird[c][b], and all the daughters of song are brought low.
translation:
  language: pt
  text: e as portas para a rua se fecham, quando o som da moagem fica baixo[a]; alguém se levanta ao som de um pássaro, e todas as filhas do canto se enfraquecem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando o som do moinho se enfraquece”. Muitos entendem a moagem como imagem da mastigação reduzida na velhice; as “portas” também podem representar os lábios ou a boca.'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “todas as filhas do canto”. A expressão pode se referir às cantoras, às faculdades de cantar ou aos sons ligados ao canto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסֻגְּרוּ
  choice: se fecharem
  rationale: O passivo de סגר descreve o fechamento das portas; a forma pronominal é natural em português e preserva o caráter resultativo da imagem.
- source_word: דְלָתַיִם
  choice: as portas
  rationale: O termo designa literalmente portas, possivelmente portas duplas. Mantém-se a imagem sem identificá-las no texto principal com os lábios ou a boca.
- source_word: בַּשּׁוּק
  choice: que dão para a rua
  rationale: שׁוּק pode indicar rua ou praça/mercado. Nesta construção, 'que dão para a rua' expressa de modo natural a relação das portas com o espaço exterior sem restringi-lo a um mercado.
- source_word: בִּשְׁפַל קוֹל הַטַּחֲנָה
  choice: quando baixar o som da moagem
  rationale: שְׁפַל comunica abaixamento ou enfraquecimento, e טַחֲנָה, a moagem. A formulação conserva a imagem e sua possível referência ao declínio da mastigação.
- source_word: וְיָקוּם
  choice: a pessoa se levantar
  rationale: O verbo está na terceira pessoa masculina singular, mas o sujeito não é nomeado. 'A pessoa' comunica em português corrente o valor genérico sem impor uma personagem específica.
- source_word: לְקוֹל הַצִּפּוֹר
  choice: ao som de um pássaro
  rationale: Embora o hebraico use o substantivo singular com artigo, o indefinido é idiomático em português para um som de pássaro não identificado e preserva a imagem singular.
- source_word: וְיִשַּׁחוּ
  choice: forem abatidas
  rationale: O verbo expressa ser rebaixado, curvado ou enfraquecido. 'Forem abatidas' mantém a ideia de redução e permite tanto o sentido imagético quanto o figurado.
- source_word: כָּל בְּנוֹת הַשִּׁיר
  choice: todas as filhas do canto
  rationale: Tradução formal da expressão poética, que pode aludir às cantoras, às faculdades de cantar ou aos sons do canto. A ambiguidade é mantida no texto principal.
theological_decisions:
- issue: Interpretação das imagens do envelhecimento em Eclesiastes 12
  choice: Preservar no texto principal as imagens das portas, da moagem e das filhas do canto.
  alternative: Explicitar portas como lábios, moagem como mastigação ou dentes, e filhas do canto como voz, audição ou cantoras.
  rationale: O contexto retrata o declínio da velhice, mas a correspondência anatômica de cada imagem é discutida. A tradução não deve decidir silenciosamente entre interpretações plausíveis.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe acompanha a sequência poética do hebraico e mantém suas metáforas sem converter a passagem em explicação anatômica.
