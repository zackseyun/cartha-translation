base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/011.yaml
  text: The words of the wise are like goads[a], and like firmly planted nails are the collected sayings[b]; they are given by one shepherd.
translation:
  language: pt
  text: As palavras dos sábios são como aguilhões; como pregos bem fixados são os mestres das coletâneas[a]. Elas foram dadas de um só pastor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico é difícil. «Mestres das coletâneas» também pode ser entendido como «responsáveis por coleções [de ditos]» ou «líderes de assembleias».
    reason: alternative_reading
  - marker: b
    text: «Um só pastor» pode referir-se a Deus como fonte última da sabedoria, mas o texto não identifica explicitamente o pastor.
    reason: theological_ambiguity
lexical_decisions:
- source_word: דִּבְרֵי חֲכָמִים
  choice: As palavras dos sábios
  rationale: Mantém o sentido amplo de דִּבְרֵי e apresenta חֲכָמִים como uma classe de pessoas, sem especificar gênero desnecessariamente.
- source_word: כַּדָּרְבֹנוֹת
  choice: como aguilhões
  rationale: דָּרְבֹן designa uma haste pontiaguda usada para impelir animais; “aguilhões” preserva a imagem de palavras que estimulam ou corrigem.
- source_word: וּכְמַשְׂמְרוֹת נְטוּעִים
  choice: como pregos bem fixados
  rationale: מַשְׂמְרוֹת pode indicar pregos ou estacas. נְטוּעִים significa literalmente “plantados”, mas, aplicado a pregos, comunica que estão firmemente cravados ou fixados.
- source_word: בַּעֲלֵי אֲסֻפּוֹת
  choice: os ditos reunidos
  rationale: A expressão hebraica é difícil. No contexto literário, esta formulação natural entende אֲסֻפּוֹת como coleções de ditos e representa o conjunto pelo conteúdo reunido; a possibilidade mais literal de “mestres de coleções” ou “líderes de assembleias” é preservada em nota.
- source_word: נִתְּנוּ
  choice: foram dados
  rationale: O nifal perfeito plural de נתן exprime uma ação passiva concluída. O plural concorda naturalmente com “ditos reunidos” e também pode abranger as palavras sapienciais mencionadas no verso.
- source_word: מֵרֹעֶה אֶחָד
  choice: por um só pastor
  rationale: “Um só pastor” preserva a unidade expressa por אֶחָד e mantém “pastor” sem maiúscula, pois o referente não é identificado explicitamente. Em português, “dados por” é a maneira natural de exprimir a origem ou agência indicada no contexto.
theological_decisions:
- issue: Identidade de “um só pastor”
  choice: Mantida indeterminada no texto principal, com “um só pastor” em minúscula
  alternative: Entender o pastor como Deus, como Coélet/Salomão ou como metáfora de uma fonte unificada de sabedoria
  rationale: Embora Deus possa ser o referente último, o hebraico não identifica expressamente o pastor. A tradução evita resolver uma tensão teológica que o próprio texto deixa aberta.
- issue: Referente de בַּעֲלֵי אֲסֻפּוֹת
  choice: “os ditos reunidos” no texto, com as alternativas literais em nota
  alternative: “os mestres de coleções” ou “os líderes de assembleias”
  rationale: A construção admite mais de uma análise lexical e sintática. A opção principal favorece clareza no contexto, sem ocultar em nota as leituras que tomam בַּעֲלֵי em seu sentido pessoal mais comum.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Aguilhões” e “pregos bem fixados” conservam as imagens concretas do hebraico; a pontuação evidencia o paralelismo sem tornar a frase excessivamente literal.
