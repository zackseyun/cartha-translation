revisions:
- from: As palavras dos sábios são como aguilhões, e os ditos reunidos[a], como pregos bem fixados; eles foram dados por um só pastor.[b]
  to: As palavras dos sábios são como aguilhões; como pregos bem fixados são os mestres das coletâneas[a]. Elas foram dadas de um só pastor.[b]
  rationale: A revisão restitui no texto principal o caráter pessoal de בַּעֲלֵי e deixa em nota as leituras concorrentes de אֲסֻפּוֹת. Mantém as metáforas e a ambiguidade teológica do hebraico, usando «de» para refletir a procedência indicada por מִן. O pronome «elas» retoma «palavras», sem pretender resolver definitivamente a sintaxe discutida da segunda comparação.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:26:00Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução preserva bem as imagens de «aguilhões» e de «pregos ... fixados» e mantém corretamente indeterminada a identidade de «um só pastor». Contudo, «os ditos reunidos» substitui a expressão pessoal e disputada בַּעֲלֵי אֲסֻפּוֹת por seu possível conteúdo, apagando no texto principal o elemento «mestres/responsáveis». Além disso, a nota a está ancorada em «ditos reunidos», mas suas alternativas explicam uma expressão pessoal que não foi mantida na tradução.
  naturalness: «Aguilhões» é termo bíblico-literário ainda compreensível e apropriado. «Mestres das coletâneas» é mais marcado em português, mas é uma formulação segura para conservar a dificuldade do hebraico; a nota torna sua leitura acessível. A divisão em duas orações melhora a legibilidade sem desfazer o paralelismo.
  terminology: «Palavras dos sábios», «aguilhões», «pregos bem fixados» e «um só pastor» são adequados. «Foram dadas por» é aceitável para o passivo hebraico, embora «de um só pastor» preserve com mais nitidez a noção de procedência de מִן. A expressão «mestres das coletâneas» conserva o valor pessoal de בַּעֲלֵי e a ambiguidade de אֲסֻפּוֹת.
  issues:
  - severity: medium
    issue: «Os ditos reunidos» no texto principal para בַּעֲלֵי אֲסֻפּוֹת
    rationale: A expressão hebraica contém בַּעֲלֵי, normalmente «mestres», «possuidores» ou responsáveis, e pode também aludir a líderes de assembleias. Traduzir apenas o conteúdo («ditos») é uma interpretação possível, mas não é equivalente o bastante para o texto principal e torna a nota a desalinhada.
  - severity: low
    issue: Relação entre a nota a e o texto-base
    rationale: A nota apresenta «mestres de coleções» e «líderes de assembleias» como alternativas, mas o texto principal não conserva o termo pessoal que essas alternativas qualificam. A revisão ancora a nota em «mestres das coletâneas» e explica a incerteza de «coletâneas».
  - severity: low
    issue: Preposição em «por um só pastor»
    rationale: «Por» pode expressar agência e é gramaticalmente natural, mas מֵ/רֹעֶה marca mais diretamente a origem/procedência. «De um só pastor» conserva essa nuance e não identifica o referente.
  revised_text: As palavras dos sábios são como aguilhões; como pregos bem fixados são os mestres das coletâneas[a]. Elas foram dadas de um só pastor.[b]
  revised_footnotes:
