lexical_decisions:
- source_word: וְיֹתֵר מֵהֵמָּה
  choice: E, além dessas coisas
  rationale: Liga a advertência ao que precede e preserva o sentido de ultrapassar ou ir além dessas palavras, em português natural.
- source_word: בְּנִי
  choice: meu filho
  rationale: Reproduz literalmente o masculino singular e mantém a forma convencional de instrução paterna.
- source_word: הִזָּהֵר
  choice: fique avisado
  rationale: Expressa o valor passivo-reflexivo do imperativo nifal e introduz a advertência de maneira clara e corrente.
- source_word: עֲשׂוֹת סְפָרִים הַרְבֵּה
  choice: fazer muitos livros
  rationale: Preserva a construção verbal hebraica; 'fazer livros' pode abranger sua produção ou composição sem restringi-la à escrita individual.
- source_word: אֵין קֵץ
  choice: não tem fim
  rationale: Equivalente idiomático e direto da expressão existencial hebraica.
- source_word: וְלַהַג הַרְבֵּה
  choice: e muito estudo
  rationale: No contexto de livros, 'estudo' comunica com clareza o provável sentido do termo raro, enquanto a nota conserva alternativas plausíveis.
- source_word: יְגִעַת בָּשָׂר
  choice: cansa o corpo
  rationale: Transmite em português natural a fadiga física indicada por 'carne', sem introduzir aqui uma conotação teológica indevida.
