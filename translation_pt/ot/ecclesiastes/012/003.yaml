source:
  edition: WLC
  text: בַּ/יּ֗וֹם שֶׁ/יָּזֻ֨עוּ֙ שֹׁמְרֵ֣י הַ/בַּ֔יִת וְ/הִֽתְעַוְּת֖וּ אַנְשֵׁ֣י הֶ/חָ֑יִל וּ/בָטְל֤וּ הַ/טֹּֽחֲנוֹת֙ כִּ֣י מִעֵ֔טוּ וְ/חָשְׁכ֥וּ הָ/רֹא֖וֹת בָּ/אֲרֻבּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/003.yaml
  text: on the day when the keepers of the house tremble[a], and the men of strength are bent, and the grinders cease because they are few, and those looking through the windows grow dark[b],
translation:
  language: pt
  text: no dia em que tremerem os guardiões da casa[a], e se encurvarem os homens fortes, e as que moem pararem por serem poucas, e escurecerem as que olham pelas janelas[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'As imagens provavelmente descrevem o declínio da velhice: os “guardiões da casa” podem representar os braços ou as mãos; os “homens fortes”, as pernas; “as que moem”, os dentes; e “as que olham pelas janelas”, os olhos.'
    reason: alternative_reading
  - marker: b
    text: Ou “pelas treliças”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם
  choice: no dia em que
  rationale: Mantém a moldura temporal do hebraico e introduz naturalmente, em português, a sequência de imagens.
- source_word: יָזֻעוּ
  choice: tremerem
  rationale: Expressa de modo claro o movimento físico indicado pelo verbo e se ajusta à provável imagem do declínio na velhice.
- source_word: שֹׁמְרֵי הַבַּיִת
  choice: os guardiões da casa
  rationale: Preserva a imagem doméstica do hebraico sem identificar explicitamente seus possíveis referentes corporais.
- source_word: הִתְעַוְּתוּ
  choice: se encurvarem
  rationale: Comunica a deformação ou curvatura corporal de maneira natural e digna em português.
- source_word: אַנְשֵׁי הֶחָיִל
  choice: os homens fortes
  rationale: Conserva tanto o elemento humano masculino quanto a ideia de força, com formulação mais idiomática que 'homens de força'.
- source_word: בָטְלוּ
  choice: pararem
  rationale: Transmite a cessação da atividade sem explicar em excesso a metáfora.
- source_word: הַטֹּחֲנוֹת
  choice: as que moem
  rationale: Preserva o particípio feminino plural e a imagem de pessoas que moem, evitando substituir a figura diretamente por 'dentes'.
- source_word: כִּי מִעֵטוּ
  choice: por serem poucas
  rationale: Reproduz a relação causal e concorda naturalmente com o referente feminino plural em português.
- source_word: חָשְׁכוּ
  choice: escurecerem
  rationale: Mantém o sentido intransitivo de tornar-se escuro ou perder luminosidade, sem explicitar a perda da visão.
- source_word: הָרֹאוֹת
  choice: as que olham
  rationale: Preserva o particípio feminino plural e evita identificar diretamente a figura com os olhos.
- source_word: בָּאֲרֻבּוֹת
  choice: pelas janelas
  rationale: É uma tradução clara e corrente; 'pelas' expressa adequadamente o olhar através das aberturas.
theological_decisions:
- issue: Explicitar ou não a alegoria do corpo como casa
  choice: Preservar no texto principal as imagens domésticas e humanas do poema
  alternative: Traduzir os guardiões como braços ou mãos, os homens fortes como pernas, as que moem como dentes e as que olham como olhos
  rationale: Embora o contexto provavelmente descreva o declínio da velhice, o hebraico não decodifica cada imagem. A tradução mantém essa abertura poética e apresenta a interpretação provável em nota.
- issue: Representação do gênero em אַנְשֵׁי הֶחָיִל e nos particípios femininos
  choice: Usar 'os homens fortes', mas 'as que moem' e 'as que olham'
  alternative: Neutralizar todas as expressões como 'os fortes', 'os moedores' e 'os observadores'
  rationale: A redação conserva as distinções gramaticais e imagéticas relevantes do hebraico sem impor referentes anatômicos.
translation_notes:
  register: Português moderno, poético e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A construção mantém o paralelismo e a metáfora extensa do hebraico; o ponto e vírgula indica que o versículo continua sintaticamente no contexto.
