base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/005.yaml
  text: Also they are afraid of heights[a], and terrors are on the road; the almond tree blossoms, the grasshopper drags itself along, and the caper berry fails, because man is going to his eternal house[c][b], and the mourners go about in the street.
translation:
  language: pt
  text: Também têm medo das alturas, e há pavores no caminho; a amendoeira floresce, o gafanhoto se arrasta com dificuldade[a], e o fruto da alcaparra perde o efeito[b], pois o ser humano vai para a sua casa eterna, e os pranteadores andam pela rua[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o gafanhoto se torna um peso”. A expressão hebraica é difícil e pode retratar tanto o movimento debilitado como o fato de até mesmo algo pequeno se tornar pesado na velhice.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o desejo falha”. O hebraico menciona literalmente o fruto da alcaparra, provavelmente como imagem ligada ao apetite ou ao estímulo.'
    reason: lexical_alternative
  - marker: c
    text: Os “pranteadores” podiam incluir pessoas contratadas para lamentar publicamente os mortos.
    reason: cultural_note
lexical_decisions:
- source_word: מִגָּבֹהַּ יִרָאוּ
  choice: têm medo das alturas
  rationale: Expressa de modo natural em português o temor causado por lugares altos, adequado ao contexto das limitações da velhice.
- source_word: חַתְחַתִּים בַּדֶּרֶךְ
  choice: há pavores no caminho
  rationale: Mantém a imagem concreta do caminho e a força do plural חַתְחַתִּים, que indica coisas ou situações aterradoras.
- source_word: יָנֵאץ הַשָּׁקֵד
  choice: a amendoeira floresce
  rationale: Adota o sentido tradicional e contextualmente provável de florescimento, evocando possivelmente os cabelos brancos, sem explicitar essa interpretação no texto.
- source_word: יִסְתַּבֵּל הֶחָגָב
  choice: o gafanhoto se arrasta com dificuldade
  rationale: A forma verbal é difícil; esta tradução comunica a provável imagem de movimento debilitado no contexto da velhice. A alternativa lexical é preservada em nota.
- source_word: תָפֵר הָאֲבִיּוֹנָה
  choice: o fruto da alcaparra já não faz efeito
  rationale: Preserva o referente botânico concreto de אֲבִיּוֹנָה e exprime naturalmente a provável ideia de que seu efeito estimulante falha. A leitura abstrata relacionada ao desejo aparece em nota.
- source_word: הָאָדָם
  choice: o ser humano
  rationale: Representa o indivíduo humano genérico diante da morte sem restringir indevidamente a referência a uma pessoa do sexo masculino.
- source_word: בֵּית עוֹלָמוֹ
  choice: sua casa eterna
  rationale: Conserva a metáfora hebraica de 'casa' e o caráter solene de עוֹלָם, sem explicar além do que o texto afirma.
- source_word: סָבְבוּ בַשּׁוּק
  choice: percorrem as ruas
  rationale: Comunica a circulação pública dos pranteadores; o plural 'ruas' soa natural em português para esse cenário, embora o hebraico tenha um coletivo ou singular locativo.
theological_decisions:
- issue: Referência genérica de הָאָדָם
  choice: o ser humano
  alternative: o homem
  rationale: O artigo e o substantivo apresentam o indivíduo humano representativo que caminha para a morte. 'O ser humano' mantém essa força genérica e evita sugerir que o verso se limite ao sexo masculino.
- issue: Sentido de בֵּית עוֹלָמוֹ
  choice: sua casa eterna
  alternative: sua morada duradoura
  rationale: A tradução mantém a expressão metafórica e sua possível referência à sepultura ou ao estado da morte, sem resolver no corpo do texto questões sobre a condição posterior à morte.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construções naturais para leitores brasileiros e compreensão internacional. O paralelismo poético e as imagens concretas do hebraico foram preservados; ambiguidades lexicais relevantes aparecem em notas, sem impor uma interpretação doutrinária.
