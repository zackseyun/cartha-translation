  to: Também têm medo das alturas, e há pavores no caminho; a amendoeira floresce, o gafanhoto se arrasta com dificuldade[a], e o fruto da alcaparra perde o efeito[b], pois o ser humano vai para a sua casa eterna, e os pranteadores andam pela rua[c].
