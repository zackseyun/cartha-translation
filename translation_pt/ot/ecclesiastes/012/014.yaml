  text: כִּ֤י אֶת כָּל מַֽעֲשֶׂ֔ה הָ/אֱלֹהִ֛ים יָבִ֥א בְ/מִשְׁפָּ֖ט עַ֣ל כָּל נֶעְלָ֑ם אִם ט֖וֹב וְ/אִם רָֽע־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/014.yaml
  text: For God will bring every deed into judgment[a], with every hidden thing, whether good or evil.
translation:
  language: pt
  text: Pois Deus trará a julgamento toda ação, juntamente com tudo o que está oculto[a], seja bom, seja mau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a respeito de tudo o que está oculto”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que fundamenta a exortação conclusiva do versículo anterior, de modo natural em português.
- source_word: אֶת כָּל מַעֲשֶׂה
  choice: toda ação
  rationale: Expressa distributivamente a totalidade dos atos; “ação” é atual, clara e adequada ao contexto de avaliação moral.
- source_word: הָאֱלֹהִים
  choice: Deus
  rationale: O hebraísmo definido é traduzido naturalmente pelo nome “Deus” em português.
- source_word: יָבִא בְמִשְׁפָּט
  choice: trará a julgamento
  rationale: O hifil de בוא indica fazer entrar ou trazer, e a construção com בְמִשְׁפָּט aponta para a esfera da avaliação judicial.
- source_word: עַל כָּל נֶעְלָם
  choice: juntamente com tudo o que está oculto
  rationale: Preserva a abrangência de נֶעְלָם sem limitá-lo aos segredos interiores e representa uma leitura contextual possível da relação introduzida por עַל.
- source_word: אִם טוֹב וְאִם רָע
  choice: seja bom, seja mau
  rationale: Reproduz de forma idiomática a totalidade da avaliação moral expressa pela construção hebraica.
theological_decisions:
- issue: Alcance do julgamento divino
  choice: O texto afirma que Deus submeterá toda ação, inclusive o que está oculto, ao julgamento, sem definir seu momento ou mecanismo.
  alternative: Entender a declaração exclusivamente como juízo final, ou como abrangendo tanto o juízo providencial na história quanto o juízo final.
  rationale: O hebraico declara a abrangência do julgamento divino, mas não restringe explicitamente sua realização a um esquema escatológico específico.
- issue: Relação de עַל כָּל נֶעְלָם com o julgamento
  choice: “juntamente com tudo o que está oculto”
  alternative: “a respeito de tudo o que está oculto”
  rationale: A preposição עַל admite mais de uma relação contextual. O texto principal adota a ideia inclusiva, enquanto a nota conserva a alternativa relacional sem eliminar a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Toda ação” evita o tom antiquado de “toda obra”, e “o que está oculto” mantém o alcance amplo do hebraico.
