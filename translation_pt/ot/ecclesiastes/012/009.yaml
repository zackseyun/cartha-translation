base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/009.yaml
  text: And beyond that[a], because Qoheleth was wise, he still taught the people knowledge; he also weighed, searched out, and arranged many proverbs.
translation:
  language: pt
  text: Além disso, como Coélet era sábio, também ensinou conhecimento ao povo; ponderou, investigou e pôs em ordem muitos provérbios.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Além disso, Coélet, por ser sábio, também ensinou conhecimento ao povo; pesou, investigou e organizou muitos provérbios.”'
    reason: A construção inicial pode ser entendida de modo causal, e os verbos que descrevem o trabalho de Coélet admitem nuances alternativas.
lexical_decisions:
- source_word: וְיֹתֵר
  choice: Além disso
  rationale: Introduz uma observação adicional de modo natural em português, preservando a força aditiva do hebraico.
- source_word: שֶׁהָיָה
  choice: como ... era
  rationale: A partícula שֶׁ admite valor causal neste contexto; “como” expressa a sabedoria de Coélet como fundamento de sua atividade, sem tornar a relação excessivamente categórica.
- source_word: קֹהֶלֶת
  choice: Coélet
  rationale: Translitera a designação hebraica de caráter quase nominal, evitando restringi-la interpretativamente a “Pregador” ou “Mestre”.
- source_word: חָכָם
  choice: sábio
  rationale: Reproduz diretamente o adjetivo predicativo hebraico em linguagem corrente.
- source_word: עוֹד
  choice: continuou a
  rationale: No contexto, comunica continuidade ou atividade adicional e produz uma construção idiomática em português.
- source_word: לִמַּד דַּעַת אֶת הָעָם
  choice: ensinou conhecimento ao povo
  rationale: Mantém a distinção lexical entre “conhecimento” (דַּעַת) e “sábio” (חָכָם), com sintaxe natural em português.
- source_word: וְאִזֵּן
  choice: ponderou
  rationale: Expressa a ideia provável de pesar ou avaliar cuidadosamente, de modo mais idiomático que o literal “pesou” neste contexto literário.
- source_word: וְחִקֵּר
  choice: investigou
  rationale: Comunica a pesquisa cuidadosa indicada pelo verbo hebraico.
- source_word: תִּקֵּן
  choice: pôs em ordem
  rationale: Preserva o sentido de ordenar ou organizar os provérbios sem afirmar de modo indevido que Coélet necessariamente os compôs.
- source_word: מְשָׁלִים הַרְבֵּה
  choice: muitos provérbios
  rationale: Tradução direta, concisa e natural da expressão hebraica.
