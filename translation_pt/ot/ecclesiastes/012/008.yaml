  text: הֲבֵ֧ל הֲבָלִ֛ים אָמַ֥ר הַ/קּוֹהֶ֖לֶת הַ/כֹּ֥ל הָֽבֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/008.yaml
  text: “Vapor of vapors,” says the Teacher[a]; “everything is vapor.”
translation:
  language: pt
  text: “Vapor dos vapores”, diz o Mestre[a]; “tudo é vapor.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vaidade das vaidades [...] tudo é vaidade”. Essa tradução tradicional é bem conhecida, mas o hebraico הבל evoca literalmente algo como vapor ou sopro — aquilo que é fugaz, inconsistente ou difícil de apreender.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבֵל הֲבָלִים
  choice: Vapor dos vapores
  rationale: A cadeia construta intensifica הבל de modo semelhante a um superlativo. A formulação conserva a imagem concreta de algo fugaz, inconsistente e difícil de apreender, sem reduzir sua polissemia a uma única abstração.
- source_word: אָמַר
  choice: diz
  rationale: Embora o perfeito hebraico possa ser traduzido no passado, o presente funciona naturalmente em português numa fórmula de citação que retoma, de modo proverbial e vívido, o refrão conclusivo do livro.
- source_word: הַקּוֹהֶלֶת
  choice: o Mestre
  rationale: O termo funciona aqui como título. “Mestre” expressa em português atual a função de quem instrui uma assembleia, sem a conotação eclesiástica mais específica de “Pregador” e sem recorrer apenas à transliteração.
- source_word: הַכֹּל
  choice: tudo
  rationale: O termo indica totalidade absoluta; “tudo” é a forma natural e concisa em português.
- source_word: הָבֶל
  choice: vapor
  rationale: A repetição da mesma palavra preserva a coesão do refrão hebraico. “Vapor” mantém a metáfora da transitoriedade, insubstancialidade e elusividade, sem limitar o sentido a “vaidade” ou “futilidade”.
theological_decisions:
- issue: Tradução do termo-chave הבל em Eclesiastes
  choice: vapor
  alternative: vaidade; futilidade; sopro
  rationale: A escolha é sobretudo lexical e literária, mas afeta a interpretação do livro. “Vapor” conserva a imagem e sua tensão sem decidir antecipadamente se o sentido principal é transitoriedade, falta de substância, caráter enigmático ou futilidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação deliberadamente mantém a repetição e a metáfora concreta do hebraico.
