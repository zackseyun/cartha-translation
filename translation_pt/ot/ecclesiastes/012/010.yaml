  text: בִּקֵּ֣שׁ קֹהֶ֔לֶת לִ/מְצֹ֖א דִּבְרֵי חֵ֑פֶץ וְ/כָת֥וּב יֹ֖שֶׁר דִּבְרֵ֥י אֱמֶֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/010.yaml
  text: Qoheleth sought to find delightful words[b][a], and to write uprightly words of truth.
translation:
  language: pt
  text: Coélet procurou encontrar palavras agradáveis[a], e o que foi escrito com retidão foram palavras de verdade.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «palavras de deleite».
    reason: lexical_alternative
  - marker: b
    text: Ou «e escrever com retidão palavras de verdade». A sintaxe hebraica é compacta e também permite uma compreensão ativa da expressão.
    reason: alternative_reading
lexical_decisions:
- source_word: בִּקֵּשׁ
  choice: procurou
  rationale: Expressa uma busca intencional e combina naturalmente com o infinitivo «encontrar».
- source_word: קֹהֶלֶת
  choice: Coélet
  rationale: Translitera a designação hebraica em forma já reconhecível em português, sem a restringir às interpretações «Mestre» ou «Pregador».
- source_word: לִמְצֹא
  choice: encontrar
  rationale: É a correspondência direta e natural do infinitivo hebraico.
- source_word: דִּבְרֵי חֵפֶץ
  choice: palavras agradáveis
  rationale: חֵפֶץ pode indicar prazer, agrado ou deleite; «agradáveis» comunica a ideia com naturalidade, sem pressupor que sejam meramente lisonjeiras.
- source_word: וְכָתוּב
  choice: e escrever
  rationale: No contexto, verte a forma compacta como segundo objetivo da busca literária de Coélet; a possibilidade de entendê-la de maneira passiva é preservada em nota.
- source_word: יֹשֶׁר
  choice: com retidão
  rationale: Preserva a imagem de retidão ou justeza e pode abranger tanto correção formal quanto integridade.
- source_word: דִּבְרֵי אֱמֶת
  choice: palavras de verdade
  rationale: Mantém de perto a construção hebraica e deixa em aberto tanto o conteúdo verdadeiro quanto o caráter veraz das palavras.
theological_decisions:
- issue: Identidade e tradução de קֹהֶלֶת
  choice: Coélet como designação transliterada
  alternative: o Mestre; o Pregador
  rationale: A transliteração mantém visível a personagem literária hebraica e evita escolher no corpo do texto uma interpretação funcional específica.
- issue: Relação entre agrado, retidão e verdade
  choice: Manter os três conceitos sem fazer do agrado oposição à verdade
  alternative: Interpretar as palavras agradáveis como lisonja ou embelezamento retórico
  rationale: O hebraico não afirma que o caráter agradável das palavras comprometa sua verdade; a tradução conserva a tensão sem acrescentar juízo teológico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Coélet» preserva a designação hebraica; «com retidão» conserva deliberadamente a densidade ética e formal de יֹשֶׁר.
