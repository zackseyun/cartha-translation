base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/001.yaml
  text: I said in my heart[a], “Come now, I will test you with pleasure; so enjoy what is good.” But look[c][b], this too is vapor.
translation:
  language: pt
  text: 'Eu disse no meu coração: “Vamos, agora! Vou pôr você à prova por meio do prazer[a]; desfrute do que é bom[b].” Mas eis que também isso é vapor[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “alegria” ou “diversão”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “veja o bem”; no idioma hebraico, a expressão pode significar experimentar ou desfrutar o que é bom.
    reason: lexical_alternative
  - marker: c
    text: Ou “vaidade” ou “sopro”. O termo hebraico descreve literalmente vapor ou hálito e funciona em Eclesiastes como metáfora do que é fugaz, inapreensível ou insubstancial.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי אֲנִי בְּלִבִּי
  choice: Eu disse no meu coração
  rationale: Preserva a imagem hebraica do coração como centro da reflexão e da fala interior, sem reduzir a expressão a uma simples paráfrase psicológica.
- source_word: לְכָה נָּא
  choice: Venha, pois!
  rationale: Reproduz a exortação dirigida a si mesmo em português atual e digno; “pois” comunica a força discursiva de נָא sem sugerir um pedido cortês.
- source_word: אֲנַסְּכָה
  choice: Vou pôr você à prova
  rationale: Expressa diretamente o sentido de נסה, “testar, provar”, e mantém o motivo da experiência realizada consigo mesmo.
- source_word: בְשִׂמְחָה
  choice: com o prazer
  rationale: No contexto da investigação de Qohelet, “prazer” comunica a busca experimental de satisfação; “alegria” continua sendo uma alternativa lexical possível.
- source_word: וּרְאֵה בְטוֹב
  choice: desfrute do que é bom
  rationale: Traduz o sentido idiomático de “ver o bem”, isto é, experimentar ou desfrutar coisas boas, em português natural.
- source_word: וְהִנֵּה
  choice: Mas eis que
  rationale: “Eis que” conserva a função de chamar atenção para a avaliação do narrador, enquanto “mas” explicita a virada adversativa sugerida pelo contexto.
- source_word: גַם הוּא
  choice: também isso
  rationale: Retoma a experiência com o prazer mencionada imediatamente antes.
- source_word: הָבֶל
  choice: vapor
  rationale: Mantém a metáfora concreta e recorrente de algo fugaz, inapreensível ou insubstancial, sem restringi-la à ideia interpretativa de falta de sentido.
theological_decisions:
- issue: Tradução de הָבֶל em Eclesiastes
  choice: vapor
  alternative: vaidade; sopro; absurdo; sem sentido
  rationale: “Vapor” preserva a imagem temática e sua tensão sem decidir que o autor esteja afirmando apenas inutilidade ou ausência de significado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “no meu coração” preserva deliberadamente a metáfora hebraica; “eis que” mantém certa solenidade literária sem recorrer a linguagem arcaica excessiva.
