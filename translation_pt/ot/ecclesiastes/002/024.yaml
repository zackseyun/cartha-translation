  text: אֵֽין ט֤וֹב בָּ/אָדָם֙ שֶׁ/יֹּאכַ֣ל וְ/שָׁתָ֔ה וְ/הֶרְאָ֧ה אֶת נַפְשׁ֛/וֹ ט֖וֹב בַּ/עֲמָל֑/וֹ גַּם זֹה֙ רָאִ֣יתִי אָ֔נִי כִּ֛י מִ/יַּ֥ד הָ/אֱלֹהִ֖ים הִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/024.yaml
  text: There is nothing better for a man than that he should eat and drink and show himself good in his labor[b][a]. I also saw that this is from the hand of God.
translation:
  language: pt
  text: Não há nada melhor para uma pessoa[b] do que comer, beber e desfrutar do bem em seu trabalho.[a] Também vi que isso vem da mão de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “e fazer sua alma ver o bem em seu trabalho”; isto é, experimentar ou desfrutar o bem em seu trabalho.'
    reason: lexical_alternative
  - marker: b
    text: 'A oração inicial também pode ser traduzida mais literalmente: “Não há bem na pessoa para que coma e beba...”. Contudo, o contexto favorece fortemente o sentido comparativo adotado no texto.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֵין טוֹב בָּאָדָם
  choice: Não há nada melhor para uma pessoa
  rationale: 'A construção é difícil, mas, neste contexto, tem sentido comparativo: não há nada melhor para a pessoa do que receber com alegria os bens mencionados. “Uma pessoa” comunica o uso genérico de אָדָם em português atual.'
- source_word: שֶׁיֹּאכַל וְשָׁתָה
  choice: do que comer, beber
  rationale: O infinitivo é a forma mais natural em português para apresentar o conteúdo da comparação, sem alterar o sentido da oração hebraica.
- source_word: וְהֶרְאָה אֶת נַפְשׁוֹ טוֹב
  choice: e desfrutar do bem
  rationale: Literalmente, a expressão fala em fazer a própria alma ver o bem; idiomaticamente, indica experimentar ou desfrutar o que é bom. A tradução comunica esse sentido sem conservar uma formulação obscura em português.
- source_word: בַּעֲמָלוֹ
  choice: em seu trabalho
  rationale: עָמָל designa trabalho laborioso e pode implicar esforço ou fadiga. “Trabalho” preserva a ideia central e se ajusta ao tom positivo deste versículo.
- source_word: גַּם זֹה רָאִיתִי אָנִי
  choice: Também vi que isso
  rationale: A formulação reproduz de modo natural o testemunho pessoal e a função discursiva do hebraico.
- source_word: מִיַּד הָאֱלֹהִים
  choice: vem da mão de Deus
  rationale: Mantém a metáfora hebraica da mão como fonte da dádiva, em linguagem natural e teologicamente expressiva.
theological_decisions:
- issue: Sentido de אֵין טוֹב בָּאָדָם na abertura
  choice: 'Leitura comparativa: “Não há nada melhor para uma pessoa...”'
  alternative: 'Leitura absoluta: “Não há bem na pessoa para que coma e beba...”'
  rationale: A leitura comparativa se harmoniza melhor com a sintaxe contextual, com as afirmações semelhantes de Eclesiastes e com a conclusão de que essa experiência vem da mão de Deus. A leitura alternativa é preservada em nota por causa da dificuldade real da construção hebraica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A expressão idiomática sobre a alma foi vertida pelo seu sentido no texto e preservada literalmente em nota; a metáfora “mão de Deus” foi mantida.
