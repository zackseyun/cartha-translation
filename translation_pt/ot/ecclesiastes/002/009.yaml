  text: וְ/גָדַ֣לְתִּי וְ/הוֹסַ֔פְתִּי מִ/כֹּ֛ל שֶׁ/הָיָ֥ה לְ/פָנַ֖/י בִּ/ירוּשָׁלִָ֑ם אַ֥ף חָכְמָתִ֖/י עָ֥מְדָה לִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/009.yaml
  text: So I became great and increased more than all who were before me in Jerusalem[b][a]; also my wisdom remained with me.
translation:
  language: pt
  text: Assim, tornei-me grande e superei todos os que vieram antes de mim em Jerusalém; além disso, minha sabedoria permaneceu comigo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “ficou de pé para mim”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגָדַלְתִּי
  choice: Assim, tornei-me grande
  rationale: O qal de גדל indica tornar-se grande em posição, importância ou realizações. A formulação conserva o sentido resultativo e pessoal; “Assim” expressa naturalmente a continuação do relato.
- source_word: וְהוֹסַפְתִּי מִכֹּל
  choice: e superei todos
  rationale: Embora o hifil de יסף signifique literalmente acrescentar ou aumentar, seguido da construção comparativa com מִן comunica que o narrador excedeu os demais. “Superei” é claro e idiomático em português.
- source_word: שֶׁהָיָה לְפָנַי
  choice: os que vieram antes de mim
  rationale: No contexto da comparação pessoal e régia, a expressão aponta naturalmente para predecessores. A tradução evita o pouco natural “os que estavam diante de mim” sem especificar uma identidade não declarada no texto.
- source_word: בִּירוּשָׁלָם
  choice: em Jerusalém
  rationale: Tradução locativa direta do nome do lugar.
- source_word: אַף
  choice: além disso
  rationale: A partícula acrescenta outra afirmação à anterior. “Além disso” preserva essa função aditiva sem impor ênfase excessiva.
- source_word: חָכְמָתִי
  choice: minha sabedoria
  rationale: Correspondência direta do substantivo com sufixo de primeira pessoa.
- source_word: עָמְדָה לִּי
  choice: permaneceu comigo
  rationale: A expressão significa literalmente que a sabedoria “ficou de pé para/com” o narrador, mas idiomaticamente comunica que ela continuou presente ou à sua disposição. “Permaneceu comigo” transmite isso em português natural.
