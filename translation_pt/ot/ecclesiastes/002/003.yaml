  text: תַּ֣רְתִּי בְ/לִבִּ֔/י לִ/מְשׁ֥וֹךְ בַּ/יַּ֖יִן אֶת בְּשָׂרִ֑/י וְ/לִבִּ֞/י נֹהֵ֤ג בַּֽ/חָכְמָה֙ וְ/לֶ/אֱחֹ֣ז בְּ/סִכְל֔וּת עַ֣ד אֲשֶׁר אֶרְאֶ֗ה אֵי זֶ֨ה ט֜וֹב לִ/בְנֵ֤י הָ/אָדָם֙ אֲשֶׁ֤ר יַעֲשׂוּ֙ תַּ֣חַת הַ/שָּׁמַ֔יִם מִסְפַּ֖ר יְמֵ֥י חַיֵּי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/003.yaml
  text: I searched in my heart to draw my flesh along with wine[a], while my heart was guiding me with wisdom, and to lay hold of folly[b], until I might see what was good for the sons of man to do under the heavens during the number of the days of their lives.
translation:
  language: pt
  text: Procurei, em meu coração, levar minha carne com vinho[a], enquanto meu coração me guiava com sabedoria, e apegar-me à insensatez, até descobrir o que seria bom que os filhos dos homens[b] fizessem debaixo dos céus durante o número de dias de suas vidas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica traduzida por “levar minha carne com vinho” é difícil. Literalmente, o verbo pode significar “puxar”, “arrastar” ou “conduzir”; a ideia pode ser experimentar o prazer corporal proporcionado pelo vinho sem abandonar a orientação da sabedoria.
    reason: lexical_alternative
  - marker: b
    text: Isto é, a humanidade. O hebraico diz literalmente “os filhos dos homens”, uma expressão masculina de sentido genérico.
    reason: alternative_reading
lexical_decisions:
- source_word: תַּרְתִּי בְלִבִּי
  choice: Examinei em meu coração
  rationale: תור descreve uma investigação deliberada, e לֵב abrange pensamento e vontade. A formulação conserva a introspecção experimental e a antropologia hebraica sem reduzir o coração à emoção.
- source_word: לִמְשׁוֹךְ בַּיַּיִן אֶת־בְּשָׂרִי
  choice: como levar minha carne com vinho
  rationale: A construção é difícil. משׁך tem o sentido básico de puxar, arrastar ou conduzir; “levar” mantém algo dessa abertura sem produzir uma frase excessivamente áspera em português. “Carne” preserva בשר e não introduz por si só uma avaliação moral.
- source_word: וְלִבִּי נֹהֵג בַּחָכְמָה
  choice: enquanto meu coração me guiava com sabedoria
  rationale: נהג significa conduzir ou guiar. O objeto “me” está implícito e é explicitado para fluência, preservando a tensão entre a experiência com o vinho e a orientação da sabedoria.
- source_word: וְלֶאֱחֹז בְּסִכְלוּת
  choice: e como me apegar à insensatez
  rationale: אחז significa agarrar ou tomar posse. “Apegar-me” exprime envolvimento deliberado, enquanto “insensatez” mantém o contraste temático com a sabedoria em Eclesiastes.
- source_word: עַד אֲשֶׁר אֶרְאֶה
  choice: até descobrir
  rationale: O hebraico expressa a finalidade prospectiva da experiência. “Até descobrir” comunica naturalmente em português que o objetivo era chegar a ver ou discernir o resultado.
- source_word: לִבְנֵי הָאָדָם
  choice: para os filhos dos homens
  rationale: A expressão hebraica é masculina na forma e genérica no alcance. A tradução conserva o modo de expressão do texto, e a nota esclarece que se refere à humanidade.
- source_word: תַּחַת הַשָּׁמַיִם
  choice: debaixo dos céus
  rationale: Mantém o plural do hebraico e o registro elevado característico de Eclesiastes.
- source_word: מִסְפַּר יְמֵי חַיֵּיהֶם
  choice: durante o número de dias de suas vidas
  rationale: מספר significa literalmente “número”. A formulação conserva a ideia da duração limitada e contabilizada da vida sem acrescentar explicitamente que os dias são poucos.
theological_decisions:
- issue: Alcance de בְנֵי הָאָדָם
  choice: os filhos dos homens
  alternative: a humanidade / os seres humanos
  rationale: A expressão masculina é representativa e inclui a humanidade em geral. O texto principal preserva sua forma concreta, enquanto a nota impede uma leitura restrita apenas aos homens do sexo masculino.
- issue: Relação entre vinho, sabedoria e insensatez
  choice: preservar as três ideias em tensão, sem afirmar embriaguez nem pleno autocontrole
  alternative: interpretar como prazer corporal controlado pela sabedoria
  rationale: A sintaxe descreve uma experiência com vinho e insensatez enquanto o coração continua guiado pela sabedoria. O texto não explica completamente como esses elementos se relacionam, por isso a tradução não resolve a tensão de modo doutrinário.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. Conservam-se “coração”, “carne”, “filhos dos homens” e “debaixo dos céus” para refletir as imagens e o estilo do hebraico; as duas dificuldades principais são esclarecidas em notas.
