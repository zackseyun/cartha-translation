  yaml_path: translation/ot/ecclesiastes/002/022.yaml
  text: For what does a man gain from all his labor and from the striving of his heart with which he toils under the sun?[a]
translation:
  language: pt
  text: Pois, que proveito tem o homem de todo o seu trabalho e do empenho do seu coração, com que trabalha debaixo do sol?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da aflição do seu coração”, “da busca do seu coração” ou “da preocupação do seu coração”. O termo hebraico רַעְיוֹן pode indicar esforço interior, busca mental ou preocupação inquietante em Eclesiastes.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ligada ao contexto anterior e preserva a força causal ou argumentativa.
- source_word: מֶה הֹוֶה לָאָדָם
  choice: que proveito tem o homem
  rationale: A expressão pergunta retoricamente o que resulta ou advém ao ser humano; “que proveito tem” comunica o sentido idiomático com naturalidade e se harmoniza com o tema do livro.
- source_word: לָאָדָם
  choice: o homem
  rationale: Mantém o singular representativo e a formulação antropológica do hebraico, sendo clara em português.
- source_word: בְּכָל עֲמָלוֹ
  choice: de todo o seu trabalho
  rationale: Expressa a fonte da qual se esperaria algum proveito; “trabalho” é corrente e digno.
- source_word: וּבְרַעְיוֹן לִבּוֹ
  choice: e do empenho do seu coração
  rationale: “Empenho” preserva a ideia de esforço ou ocupação interior sem decidir entre todas as nuances possíveis de רַעְיוֹן; “coração” mantém a imagem e a antropologia hebraicas.
- source_word: שֶׁהוּא עָמֵל
  choice: com que trabalha
  rationale: Liga o empenho interior ao labor contínuo do homem de maneira natural, sem acrescentar uma interpretação além da relação expressa no hebraico.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: debaixo do sol
  rationale: Preserva a expressão recorrente e teologicamente significativa de Eclesiastes em forma tradicional e transparente.
