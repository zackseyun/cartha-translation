  text: וְ/אָמַ֨רְתִּֽי אֲנִ֜י בְּ/לִבִּ֗/י כְּ/מִקְרֵ֤ה הַ/כְּסִיל֙ גַּם אֲנִ֣י יִקְרֵ֔/נִי וְ/לָ֧/מָּה חָכַ֛מְתִּי אֲנִ֖י אָ֣ז יוֹתֵ֑ר וְ/דִבַּ֣רְתִּי בְ/לִבִּ֔/י שֶׁ/גַּם זֶ֖ה הָֽבֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/015.yaml
  text: And I said in my heart[a], "As happens to the fool, so it will happen to me also. Why then was I more wise?" And I said in my heart that this too is vanity.
translation:
  language: pt
  text: 'E eu disse no meu coração: “O que acontece ao insensato também acontecerá comigo. Então, por que fui mais sábio?” E disse no meu coração que também isso é vaidade.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vapor” ou “sopro”. O hebraico הָבֶל (hevel) é o termo recorrente de Eclesiastes para aquilo que é passageiro, inapreensível ou inútil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתִּי ... בְּלִבִּי
  choice: E eu disse no meu coração
  rationale: Preserva o fluxo do hebraico e sua imagem antropológica para a reflexão interior, numa formulação bíblica ainda clara em português.
- source_word: כְּמִקְרֵה הַכְּסִיל גַּם אֲנִי יִקְרֵנִי
  choice: O que acontece com o insensato também acontecerá comigo
  rationale: Traduz מִקְרֶה e קָרָה como ocorrência, sem impor a noção mais forte de destino; o futuro reflete o imperfeito יִקְרֵנִי.
- source_word: הַכְּסִיל
  choice: o insensato
  rationale: Termo corrente na literatura sapiencial para quem carece de sabedoria moral e intelectual; evita o tom potencialmente insultuoso ou clínico de alternativas modernas.
- source_word: וְלָמָּה חָכַמְתִּי אֲנִי אָז יוֹתֵר
  choice: Então, por que fui mais sábio?
  rationale: “Então” expressa a inferência de אָז; “fui mais sábio” conserva a comparação e representa o perfeito חָכַמְתִּי sem acrescentar explicitamente um processo de tornar-se sábio.
- source_word: וְדִבַּרְתִּי בְלִבִּי
  choice: E disse no meu coração
  rationale: Embora דִּבֵּר signifique literalmente “falar”, “disse” é natural para o monólogo interior e mantém o paralelismo com a primeira oração.
- source_word: שֶׁגַּם זֶה הָבֶל
  choice: que também isso é vaidade
  rationale: “Também isso” preserva o valor aditivo de גַּם. “Vaidade” mantém a amplitude literária de הֶבֶל, enquanto a nota registra sua imagem concreta e sua ambiguidade.
theological_decisions:
- issue: Sentido de הָבֶל em Eclesiastes
  choice: vaidade
  alternative: vapor, sopro, fugacidade ou inutilidade
  rationale: “Vaidade” conserva a palavra-tema tradicional e permite ideias de transitoriedade, caráter inapreensível e frustração, sem reduzir o termo à afirmação mais estreita de que tudo é destituído de sentido.
- issue: Valor da sabedoria diante do mesmo acontecimento que alcança sábio e insensato
  choice: Manter a pergunta retórica sem explicar ou resolver sua tensão
  alternative: Explicitar que a sabedoria é inútil ou que apenas não impede a morte
  rationale: O versículo questiona a vantagem da sabedoria em vista de um acontecimento comum, mas não identifica aqui esse acontecimento de forma explícita nem oferece uma resolução doutrinária completa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A expressão “no meu coração” foi mantida por seu valor imagético; “insensato” corresponde ao registro sapiencial. O marcador [a] foi colocado após “vaidade”, termo ao qual a nota efetivamente se refere.
