base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/008.yaml
  text: I also gathered for myself silver and gold[a], and the treasure of kings and provinces. I acquired for myself male singers and female singers[b], and the delights of the sons of man—a concubine and concubines.
translation:
  language: pt
  text: 'Também ajuntei para mim prata e ouro, e tesouros de reis e províncias. Consegui para mim cantores e cantoras, e os prazeres dos filhos dos homens[a]: uma concubina e concubinas.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os prazeres da humanidade”. O hebraico diz literalmente “os prazeres dos filhos do homem”.'
    reason: lexical_alternative
  - marker: b
    text: O sentido das palavras hebraicas traduzidas como “uma concubina e concubinas” é incerto. Entre outras possibilidades estão “uma amante e amantes”, “copeiros e copeiras” ou, em sentido mais geral, “toda espécie de luxo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּנַסְתִּי
  choice: ajuntei
  rationale: Expressa reunir e acumular bens, em português natural, sem acrescentar a ideia mais forte de entesouramento avarento.
- source_word: לִי
  choice: para mim
  rationale: Preserva o dativo de interesse pessoal e a ênfase contextual na aquisição voltada para si mesmo.
- source_word: כֶּסֶף וְזָהָב
  choice: prata e ouro
  rationale: Equivalência direta e tradicional dos metais preciosos empregados como riqueza.
- source_word: סְגֻלַּת מְלָכִים וְהַמְּדִינוֹת
  choice: tesouros de reis e províncias
  rationale: סְגֻלָּה indica propriedade valiosa ou tesouro; מְדִינוֹת designa distritos administrativos, adequadamente traduzidos como províncias.
- source_word: עָשִׂיתִי לִי
  choice: consegui para mim
  rationale: No contexto de aquisições e entretenimentos, comunica idiomaticamente a obtenção, sem sugerir que o próprio rei tenha fabricado ou formado os cantores.
- source_word: שָׁרִים וְשָׁרוֹת
  choice: cantores e cantoras
  rationale: Mantém a distinção explícita entre as formas masculina e feminina do hebraico.
- source_word: תַעֲנוּגֹת בְּנֵי הָאָדָם
  choice: os prazeres dos filhos dos homens
  rationale: תַעֲנוּגֹת significa prazeres, deleites ou luxos; a formulação preserva a expressão hebraica masculina e genérica sem apagar sua forma.
- source_word: שִׁדָּה וְשִׁדּוֹת
  choice: uma concubina e concubinas
  rationale: Adota uma interpretação tradicional plausível no contexto de luxo régio, mas a raridade e obscuridade dos termos exigem nota explícita com alternativas.
theological_decisions:
- issue: Tradução de בְּנֵי הָאָדָם
  choice: filhos dos homens
  alternative: seres humanos; humanidade
  rationale: Preserva a forma masculina genérica do hebraico e a tensão estilística do original, permanecendo inteligível em português.
- issue: Interpretação de שִׁדָּה וְשִׁדּוֹת
  choice: uma concubina e concubinas
  alternative: uma amante e amantes; copeiros e copeiras; toda espécie de luxo
  rationale: O sentido lexical é incerto. A leitura ligada ao harém se ajusta ao contexto dos prazeres da realeza, mas não deve ser apresentada como indiscutível; por isso, as principais alternativas são registradas em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição “para mim” conserva a ênfase autocentrada do relato. O marcador [a] aparece imediatamente após a expressão lexicalmente incerta.
