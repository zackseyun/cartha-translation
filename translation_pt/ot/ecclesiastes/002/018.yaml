  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/שָׂנֵ֤אתִֽי אֲנִי֙ אֶת כָּל עֲמָלִ֔/י שֶׁ/אֲנִ֥י עָמֵ֖ל תַּ֣חַת הַ/שָּׁ֑מֶשׁ שֶׁ֣/אַנִּיחֶ֔/נּוּ לָ/אָדָ֖ם שֶׁ/יִּהְיֶ֥ה אַחֲרָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/018.yaml
  text: And I hated all my labor in which I toiled under the sun[a], because I must leave it to the man who will come after me.
translation:
  language: pt
  text: E odiei todo o meu trabalho em que me empenhei debaixo do sol, pois terei de deixá-lo para o homem que virá depois de mim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para um homem que estará depois de mim”.'
    reason: A expressão לָאָדָם pode ser entendida de maneira menos definida, e שֶׁיִּהְיֶה אַחֲרָי significa literalmente “que estará depois de mim”.
lexical_decisions:
- source_word: וְשָׂנֵאתִי
  choice: E passei a odiar
  rationale: O qatal na sequência do discurso expressa a reação a que o narrador chegou; esta formulação é natural em português e preserva a força de שׂנא sem atribuir à conjunção uma relação lógica excessivamente específica.
- source_word: כָּל עֲמָלִי
  choice: todo o meu trabalho
  rationale: עָמָל abrange trabalho penoso e o resultado desse esforço. “Trabalho” é claro e permite que a oração seguinte explicite o aspecto de esforço.
- source_word: שֶׁאֲנִי עָמֵל
  choice: pelo qual tanto me esforcei
  rationale: A oração relativa repete enfaticamente a raiz ligada ao labor. “Tanto me esforcei” conserva a intensificação de modo idiomático, sem a rigidez de “trabalho que trabalhei”.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: debaixo do sol
  rationale: Mantém a expressão característica de Eclesiastes e sua perspectiva sobre a vida no âmbito terreno.
- source_word: שֶׁאַנִּיחֶנּוּ
  choice: pois terei de deixá-lo
  rationale: O hifil de נוח significa aqui deixar ou entregar. “Terei de” comunica a inevitabilidade contextual sem tornar explícita uma causa que o hebraico apenas implica.
- source_word: לָאָדָם
  choice: para o homem
  rationale: אָדָם é singular e, neste contexto, aponta para o sucessor individual. O artigo hebraico favorece “o homem”, embora a construção possa ser entendida de modo menos definido.
- source_word: שֶׁיִּהְיֶה אַחֲרָי
  choice: que virá depois de mim
  rationale: Traduz idiomaticamente “que estará depois de mim”, preservando a ideia temporal e sucessória sem a restringir ao termo técnico “suceder”.
theological_decisions:
- issue: Referência de אָדָם ao sucessor
  choice: o homem que virá depois de mim
  alternative: uma pessoa que estará depois de mim
  rationale: A tradução mantém o singular masculino e a possível referência definida do texto, sem acrescentar identidade, caráter moral ou doutrina sobre o herdeiro.
- issue: Força de שֶׁ antes de אַנִּיחֶנּוּ
  choice: pois
  alternative: porque / visto que
  rationale: A oração dá a razão do repúdio ao trabalho; “pois” preserva essa relação sem eliminar por completo a flexibilidade sintática da partícula.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A repetição hebraica entre “trabalho” e “trabalhar” foi vertida por “trabalho” e “me esforcei” para conservar a ênfase sem produzir uma construção artificial. O marcador da nota aparece no texto principal.
