base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/002.yaml
  text: I said of laughter[a], “It is madness,” and of pleasure, “What does this accomplish?”
translation:
  language: pt
  text: 'Do riso, eu disse: “É loucura”; e da alegria: “O que ela realiza?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ao riso, eu disse: ‘É insensato’; e à alegria: ‘O que ela faz?’”'
    reason: Alternativas lexicais e sintáticas para ל, מְהוֹלָל e עֹשָׂה.
lexical_decisions:
- source_word: לִשְׂחוֹק
  choice: Do riso
  rationale: שְׂחוֹק designa riso ou divertimento; com אמר e o prefixo ל, introduz aquilo a respeito do qual se fala. “Do riso” preserva de modo natural a construção paralela.
- source_word: אָמַרְתִּי
  choice: eu disse
  rationale: É o qal perfeito na primeira pessoa do singular de אמר. Embora o contexto seja reflexivo, o hebraico não explicita “a mim mesmo”.
- source_word: מְהוֹלָל
  choice: É loucura
  rationale: O termo expressa insensatez, irracionalidade ou desvario. O substantivo predicativo “loucura” soa natural em português e mantém a avaliação negativa do riso.
- source_word: וּלְשִׂמְחָה
  choice: e da alegria
  rationale: שִׂמְחָה pode significar alegria, prazer ou contentamento. “Alegria” é a correspondência mais direta e preserva a amplitude do termo sem restringi-lo à busca de prazer.
- source_word: מַה זֹּה עֹשָׂה
  choice: O que ela realiza?
  rationale: A pergunta indaga o efeito ou resultado da alegria. “Realiza” comunica o sentido funcional de עשה e o pronome feminino retoma naturalmente “alegria”.
theological_decisions:
- issue: Alcance da crítica ao riso e à alegria
  choice: Manter as afirmações breves e retóricas, sem explicar que todo riso ou toda alegria sejam moralmente condenados.
  alternative: Explicitar que se trata apenas de prazer mundano ou excessivo.
  rationale: O versículo avalia a eficácia do riso e da alegria no experimento de Qohelet, mas não fornece aqui uma qualificação doutrinária; acrescentá-la resolveria indevidamente a tensão do livro.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com ordem levemente marcada para conservar o paralelismo hebraico. O marcador [a] aparece no texto principal.
