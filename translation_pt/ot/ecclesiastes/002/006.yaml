  naturalness: “Fiz para mim reservatórios de água” é claro e natural. “Para irrigar a partir deles” é idiomático e torna explícita a relação de fonte indicada pelo hebraico. “Um bosque de árvores em crescimento” é uma formulação natural o suficiente em registro literário e evita a mudança temporal de “onde cresciam árvores”.
  terminology: “Reservatórios”, “irrigar” e “bosque” são escolhas defensáveis. A nota deve refletir que יַעַר pode ser “floresta” ou “área arborizada” e que a construção final admite mais de uma análise, sem afirmar de modo excessivamente específico que o bosque “produzia” árvores.
