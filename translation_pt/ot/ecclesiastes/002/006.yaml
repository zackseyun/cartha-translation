  text: I made for myself pools of water, to irrigate from them a grove sprouting trees.
translation:
  language: pt
  text: Fiz para mim reservatórios de água, para irrigar a partir deles um bosque de árvores em crescimento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma floresta de árvores em crescimento” ou “uma área arborizada onde crescem árvores”. O hebraico יַעַר pode indicar uma floresta ou uma área arborizada; “bosque” é adequado ao contexto de cultivo e irrigação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשִׂיתִי לִי
  choice: Fiz para mim
  rationale: A forma verbal Qal na primeira pessoa, seguida de לִי, expressa a ação e seu benefício pessoal; “Fiz para mim” é natural e preserva a ênfase autorreferente.
- source_word: בְּרֵכוֹת מָיִם
  choice: reservatórios de água
  rationale: בְּרֵכוֹת pode designar tanques, açudes ou reservatórios. O contexto de obras destinadas à irrigação favorece “reservatórios”, sem definir demais sua construção.
- source_word: לְהַשְׁקוֹת מֵהֶם
  choice: para com eles irrigar
  rationale: O Hifil de שקה significa fazer beber, regar ou irrigar; aqui, a infraestrutura hídrica torna “irrigar” adequado. “Com eles” apresenta naturalmente em português os reservatórios como meio ou fonte da irrigação.
- source_word: יַעַר
  choice: um bosque
  rationale: יַעַר costuma significar floresta ou região arborizada. “Bosque” mantém essa imagem e se ajusta ao contexto de uma área cultivada e irrigada.
- source_word: צוֹמֵחַ עֵצִים
  choice: onde cresciam árvores
  rationale: A construção hebraica descreve o bosque como produtor ou lugar de crescimento de árvores. A oração relativa é idiomática em português e conserva a ideia de crescimento em curso.
