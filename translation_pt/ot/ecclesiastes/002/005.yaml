  text: עָשִׂ֣יתִי לִ֔/י גַּנּ֖וֹת וּ/פַרְדֵּסִ֑ים וְ/נָטַ֥עְתִּי בָ/הֶ֖ם עֵ֥ץ כָּל פֶּֽרִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/005.yaml
  text: I made for myself gardens and parks[a], and I planted in them every kind of fruit tree.
translation:
  language: pt
  text: Fiz para mim jardins e parques[a], e neles plantei todo tipo de árvore frutífera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pomares”. O hebraico pardesim se refere a áreas cercadas e cultivadas, como parques ajardinados ou pomares.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשִׂיתִי
  choice: Fiz
  rationale: O qal perfeito na primeira pessoa do singular de עשה apresenta uma realização do orador. “Fiz” é direto e natural; a ideia de benefício próprio é expressa separadamente por לִי.
- source_word: לִי
  choice: para mim
  rationale: A preposição ל com sufixo da primeira pessoa indica benefício ou posse. “Para mim” preserva a formulação hebraica com naturalidade em português, sem necessidade de intensificá-la como “para mim mesmo”.
- source_word: גַּנּוֹת
  choice: jardins
  rationale: Plural de גן, termo comum para jardins, aqui distinto do termo mais especializado פַרְדֵּסִים.
- source_word: פַרְדֵּסִים
  choice: parques
  rationale: O substantivo designa espaços cultivados e cercados, como parques ajardinados ou pomares. “Parques” mantém o sentido amplo de propriedades destinadas ao cultivo e ao prazer, enquanto a nota registra a alternativa “pomares”.
- source_word: וְנָטַעְתִּי
  choice: e neles plantei
  rationale: O qal perfeito na primeira pessoa do singular de נטע significa “plantei”. A ordem “neles plantei” é natural em português e conecta claramente o sufixo de בָהֶם aos dois espaços mencionados.
- source_word: בָהֶם
  choice: neles
  rationale: A preposição ב com sufixo masculino plural retoma os jardins e parques. “Neles” é uma forma corrente e concisa.
- source_word: עֵץ כָּל פֶּרִי
  choice: todo tipo de árvore frutífera
  rationale: A expressão, literalmente próxima de “árvore de todo fruto”, tem sentido distributivo. “Todo tipo de árvore frutífera” comunica de modo idiomático a variedade de árvores plantadas.
