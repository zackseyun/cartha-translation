base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/007.yaml
  text: I acquired male slaves and female slaves[a], and homeborn slaves were mine; I also had great herds of cattle and flocks[b], more than all who were before me in Jerusalem.
translation:
  language: pt
  text: Adquiri escravos e escravas, e também tive escravos nascidos em minha casa[a]. Além disso, possuí muito gado bovino e rebanhos[b], mais do que todos os que me precederam em Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “filhos da casa”; no contexto, pessoas escravizadas nascidas no âmbito da casa.
    reason: cultural_note
  - marker: b
    text: O hebraico usa termos coletivos para os bens em gado, especificando gado bovino e rebanhos; estes últimos geralmente incluem ovelhas e cabras.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָנִיתִי
  choice: Comprei
  rationale: O verbo קנה pode significar comprar ou adquirir; no contexto de escravos e escravas, “comprei” expressa de modo direto e natural a forma mais provável de aquisição.
- source_word: עֲבָדִים וּשְׁפָחוֹת
  choice: escravos e escravas
  rationale: A tradução preserva tanto a condição social explícita quanto o contraste de gênero entre os dois termos hebraicos.
- source_word: וּבְנֵי בַיִת הָיָה לִי
  choice: e tive também os que nasceram em minha casa
  rationale: Traduz o sentido contextual da expressão literalmente relacionada aos “filhos da casa”, sem inserir “escravos” duas vezes no texto; a nota esclarece que se trata de pessoas escravizadas nascidas no domicílio.
- source_word: מִקְנֶה בָקָר וָצֹאן הַרְבֵּה
  choice: muitos bois, ovelhas e cabras
  rationale: מִקְנֶה designa os animais possuídos; בָקָר é gado bovino, e צֹאן abrange coletivamente ovelhas e cabras. A formulação explicita as espécies de modo claro em português.
- source_word: מִכֹּל שֶׁהָיוּ לְפָנַי
  choice: mais do que todos os que viveram antes de mim
  rationale: Mantém a comparação abrangente do hebraico e torna explícito, de modo idiomático, que se trata dos predecessores do narrador.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: Forma consagrada do topônimo em português.
