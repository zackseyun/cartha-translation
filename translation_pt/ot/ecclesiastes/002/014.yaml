base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/014.yaml
  text: The wise man has his eyes in his head[a], but the fool walks in darkness. Yet I also knew that one fate happens to them all.
translation:
  language: pt
  text: O sábio tem os olhos na cabeça, mas o tolo anda na escuridão. Contudo, eu também compreendi que o mesmo destino sobrevém a todos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que um único acontecimento sobrevém a todos”. O hebraico מִקְרֶה pode indicar aquilo que acontece a alguém e, conforme o contexto, ser traduzido como “acontecimento”, “sorte” ou “destino”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָכָם
  choice: O sábio
  rationale: חָכָם designa a pessoa sábia. Em português, o substantivo adjetival masculino singular preserva a forma do hebraico e estabelece naturalmente o contraste representativo com “o tolo”.
- source_word: עֵינָיו בְּרֹאשׁוֹ
  choice: tem os olhos na cabeça
  rationale: Mantém a imagem concreta do idioma hebraico, que sugere percepção e discernimento, sem reduzi-la à interpretação explícita “vê com clareza”.
- source_word: וְהַכְּסִיל
  choice: mas o tolo
  rationale: Embora ו possa significar simplesmente “e”, “mas” expressa em português o contraste evidente do paralelismo sem acrescentar conteúdo.
- source_word: בַּחֹשֶׁךְ הוֹלֵךְ
  choice: anda nas trevas
  rationale: Preserva a metáfora de caminhar em escuridão. “Trevas” é uma expressão bíblica digna e ainda compreensível, sem especificar se a escuridão é moral, intelectual ou circunstancial.
- source_word: וְיָדַעְתִּי גַם אָנִי
  choice: Contudo, eu também compreendi
  rationale: '“Contudo” marca a virada adversativa: apesar da vantagem da sabedoria, há um resultado nivelador. “Também” preserva גַם, e o pronome “eu” conserva a ênfase de אָנִי. “Compreendi” comunica aqui uma conclusão reconhecida, não mero conhecimento factual.'
- source_word: שֶׁמִּקְרֶה אֶחָד
  choice: que o mesmo destino
  rationale: מִקְרֶה é aquilo que acontece ou sobrevém a alguém e, no contexto de Eclesiastes, pode designar o destino comum. “O mesmo destino” torna claro o valor distributivo de אֶחָד sem eliminar a alternativa lexical “acontecimento”.
- source_word: יִקְרֶה אֶת כֻּלָּם
  choice: sobrevém a todos
  rationale: קרה significa acontecer ou sobrevir. “Sobrevém a todos” é natural e digno em português e preserva o alcance universal de כֻּלָּם.
theological_decisions:
- issue: Natureza do destino comum do sábio e do tolo
  choice: Mantê-lo como “o mesmo destino”, sem identificá-lo explicitamente neste versículo.
  alternative: Explicitar “a morte” como o destino comum.
  rationale: O contexto subsequente aponta para a morte, mas o versículo usa o termo mais amplo מִקְרֶה. A tradução preserva essa formulação e sua tensão, sem antecipar a explicação contextual.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno e acessível; conserva as imagens “olhos na cabeça” e “anda nas trevas”. O marcador [a] foi colocado após a afirmação a que a alternativa lexical se refere.
