  text: For who can eat[a], and who can enjoy[b], apart from him?
translation:
  language: pt
  text: Pois quem pode comer e quem pode desfrutar[b] à parte de mim[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à parte dele”, isto é, de Deus. O texto hebraico massorético diz “à parte de mim”; o contexto levou algumas versões antigas e muitos intérpretes a entender “dele”.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “quem pode apressar-se?” ou “quem pode sentir?”. O verbo hebraico é difícil; aqui é entendido no sentido de desfrutar ou experimentar prazer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a justificativa da afirmação anterior e preserva naturalmente a força explicativa do hebraico.
- source_word: מִי
  choice: quem
  rationale: Pronome interrogativo empregado numa pergunta retórica.
- source_word: יֹאכַל
  choice: pode comer
  rationale: O imperfeito, neste contexto retórico, expressa possibilidade ou capacidade.
- source_word: וּמִי
  choice: e quem
  rationale: Mantém a conjunção e o paralelismo da frase hebraica.
- source_word: יָחוּשׁ
  choice: pode desfrutar
  rationale: O verbo é difícil, mas, no contexto de comer e experimentar o bem em Eclesiastes 2:24–26, 'desfrutar' comunica melhor o sentido provável; outras possibilidades são registradas em nota.
- source_word: חוּץ
  choice: à parte de
  rationale: 'Com a preposição e o sufixo seguintes, indica exclusão ou independência: ''à parte de''.'
- source_word: מִמֶּנִּי
  choice: mim
  rationale: Segue a vocalização do Texto Massorético, que diz literalmente 'de mim', sem substituir no texto principal a primeira pessoa pela leitura contextual 'dele'.
theological_decisions:
- issue: Referente do sufixo pronominal final מִמֶּנִּי
  choice: à parte de mim
  alternative: à parte dele, isto é, de Deus
  rationale: A vocalização massorética traz 'de mim', com Coélet como falante. O contexto imediato, porém, atribui a Deus a capacidade de desfrutar, e versões antigas e muitos intérpretes refletem 'dele'. A tradução mantém no texto a evidência hebraica recebida e registra em nota a leitura contextual, preservando a tensão.
translation_notes:
  register: Português moderno, claro e digno, com estrutura retórica próxima do hebraico. A expressão 'à parte de mim' é natural e conserva a primeira pessoa do Texto Massorético; as ambiguidades textual e lexical são explicitadas em notas.
