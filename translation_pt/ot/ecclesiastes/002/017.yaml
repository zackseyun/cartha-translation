id: ECC.2.17
reference: Ecclesiastes 2:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/שָׂנֵ֨אתִי֙ אֶת הַ֣/חַיִּ֔ים כִּ֣י רַ֤ע עָלַ/י֙ הַֽ/מַּעֲשֶׂ֔ה שֶׁ/נַּעֲשָׂ֖ה תַּ֣חַת הַ/שָּׁ֑מֶשׁ כִּֽי הַ/כֹּ֥ל הֶ֖בֶל וּ/רְע֥וּת רֽוּחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/017.yaml
  text: So I hated life[a], because the work that is done under the sun was grievous to me[b]; for everything is vapor and a chasing after wind.
translation:
  language: pt
  text: Por isso, odiei a vida, porque me era penoso o trabalho que se faz debaixo do sol; pois tudo é vapor[a] e correr atrás do vento[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vaidade” ou “sopro”; o hebraico hével evoca algo fugaz, insubstancial ou difícil de apreender.
    reason: lexical_alternative
  - marker: b
    text: Ou “esforçar-se para alcançar o vento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂנֵאתִי
  choice: Por isso, odiei
  rationale: O perfeito qal na primeira pessoa expressa a reação consolidada do narrador. “Por isso” comunica a progressão resultante do contexto, em vez de uma simples adição.
- source_word: הַחַיִּים
  choice: a vida
  rationale: Embora a forma hebraica seja morfologicamente plural, o substantivo funciona idiomaticamente como “vida”.
- source_word: רַע עָלַי
  choice: me era penoso
  rationale: A expressão significa literalmente algo como “era mau sobre mim”, mas aqui descreve a experiência de algo aflitivo, pesado ou penoso para o narrador.
- source_word: הַמַּעֲשֶׂה שֶׁנַּעֲשָׂה
  choice: o trabalho que se faz
  rationale: Mantém a referência coletiva à atividade humana e o caráter geral e contínuo expresso pela construção passiva.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: debaixo do sol
  rationale: Expressão recorrente em Eclesiastes para a vida e a atividade no âmbito terreno; a formulação é natural e reconhecível em português.
- source_word: הַכֹּל
  choice: tudo
  rationale: Transmite de forma idiomática o alcance abrangente do hebraico.
- source_word: הֶבֶל
  choice: vapor
  rationale: Preserva a imagem concreta de algo fugaz, insubstancial e difícil de reter, sem reduzir o termo à ideia moral moderna de vaidade.
- source_word: וּרְעוּת רוּחַ
  choice: e correr atrás do vento
  rationale: Expressão vívida e corrente que comunica a tentativa inútil de alcançar ou agarrar aquilo que escapa, preservando a imagem do vento.
theological_decisions:
- issue: Sentido de הֶבֶל em Eclesiastes
  choice: vapor
  alternative: vaidade; sopro
  rationale: “Vapor” conserva a metáfora hebraica e sua amplitude — transitoriedade, insubstancialidade e caráter elusivo — sem impor uma interpretação exclusivamente moral ou abstrata.
- issue: Sentido da expressão רְעוּת רוּחַ
  choice: correr atrás do vento
  alternative: esforçar-se para alcançar o vento
  rationale: A expressão hebraica admite alguma incerteza lexical. A tradução escolhida preserva a imagem e comunica naturalmente a inutilidade da busca, enquanto a nota registra uma alternativa mais formal.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação preserva a relação entre a reação do narrador, sua causa e a conclusão abrangente. Os marcadores foram colocados junto às expressões que efetivamente explicam.
