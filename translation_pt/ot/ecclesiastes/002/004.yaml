base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/004.yaml
  text: 'I made my works great: I built houses for myself[a]; I planted vineyards for myself.'
translation:
  language: pt
  text: 'Tornei grandiosas as minhas obras[a]: construí casas para mim; plantei vinhedos para mim.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ampliei meus empreendimentos” ou “Aumentei minhas realizações”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגְדַּלְתִּי
  choice: Tornei grandiosas
  rationale: 'O hifil de גדל tem sentido causativo: fazer algo grande, amplo ou importante. A formulação mantém esse valor e introduz naturalmente os grandes empreendimentos enumerados em seguida.'
- source_word: מַעֲשָׂי
  choice: as minhas obras
  rationale: מַעֲשֶׂה pode significar obra, feito ou empreendimento. “Obras” conserva a amplitude do hebraico e abrange tanto a construção de casas quanto o plantio de vinhedos.
- source_word: בָּנִיתִי
  choice: construí
  rationale: Tradução direta e natural do qal perfeito de בנה no contexto de casas.
- source_word: לִי
  choice: para mim
  rationale: A preposição com o sufixo da primeira pessoa indica benefício ou posse pessoal. Em português, “para mim” expressa isso naturalmente sem acrescentar uma ênfase reflexiva ausente da forma hebraica.
- source_word: בָּתִּים
  choice: casas
  rationale: É o sentido comum do substantivo. Embora o contexto régio possa sugerir residências grandiosas, o hebraico não especifica palácios.
- source_word: נָטַעְתִּי
  choice: plantei
  rationale: Equivalente corrente e preciso de נטע em contexto agrícola.
- source_word: כְּרָמִים
  choice: vinhedos
  rationale: Equivalente português normal para plantações de videiras, adequado ao contexto de grandes empreendimentos e riqueza.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do paralelismo hebraico. “Tornei grandiosas as minhas obras” preserva o caráter causativo de הִגְדַּלְתִּי e a amplitude de מַעֲשָׂי; “construí” é mais idiomático em português para casas. A repetição de “para mim” foi mantida por corresponder à repetição enfática de לִי no original.
