id: ECC.2.21
reference: Ecclesiastes 2:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּי יֵ֣שׁ אָדָ֗ם שֶׁ/עֲמָל֛/וֹ בְּ/חָכְמָ֥ה וּ/בְ/דַ֖עַת וּ/בְ/כִשְׁר֑וֹן וּ/לְ/אָדָ֞ם שֶׁ/לֹּ֤א עָֽמַל בּ/וֹ֙ יִתְּנֶ֣/נּוּ חֶלְק֔/וֹ גַּם זֶ֥ה הֶ֖בֶל וְ/רָעָ֥ה רַבָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/021.yaml
  text: For there is a man whose labor is with wisdom and with knowledge and with skill[a], yet he must give his portion to a man who has not labored in it[b]. This also is vapor and a great evil.
translation:
  language: pt
  text: Pois há um homem que trabalha[a] com sabedoria, conhecimento e habilidade, mas terá de dar sua porção a um homem que não trabalhou nisso. Também isso é vapor[b] e um grande mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “labuta”. Em Eclesiastes, o hebraico עָמָל muitas vezes indica trabalho árduo e desgastante.
    reason: lexical_alternative
  - marker: b
    text: Ou “vaidade”. “Vapor” preserva a imagem hebraica de algo fugaz e insubstancial.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da reflexão anterior e mantém a ligação argumentativa do hebraico.
- source_word: יֵשׁ אָדָם
  choice: há um homem
  rationale: Apresenta um caso individual; conserva o singular de אָדָם sem transformá-lo numa afirmação sobre toda a humanidade.
- source_word: עֲמָלוֹ
  choice: trabalha
  rationale: A formulação verbal é natural em português e comunica o trabalho árduo indicado por עָמָל; a alternativa mais carregada, “labuta”, é registrada em nota.
- source_word: בְּחָכְמָה וּבְדַעַת וּבְכִשְׁרוֹן
  choice: com sabedoria, conhecimento e habilidade
  rationale: Preserva os três termos distintos e entende בְּ como indicador do modo de trabalhar.
- source_word: וּלְאָדָם שֶׁלֹּא עָמַל בּוֹ
  choice: a um homem que não trabalhou nisso
  rationale: Mantém o contraste entre o trabalhador e o beneficiário. “Nisso” preserva a referência relativamente aberta de בּוֹ, sem especificar indevidamente se aponta para o trabalho ou para aquilo que ele produziu.
- source_word: יִתְּנֶנּוּ חֶלְקוֹ
  choice: terá de dar sua porção
  rationale: Expressa a inevitabilidade sombria sugerida pelo contexto, enquanto “porção” conserva o vocabulário temático de חֵלֶק em Eclesiastes.
- source_word: הֶבֶל
  choice: vapor
  rationale: Mantém a imagem concreta de algo fugaz e insubstancial, sem reduzir o termo à ideia moderna de vaidade pessoal.
- source_word: רָעָה רַבָּה
  choice: um grande mal
  rationale: Conserva a força avaliativa e existencial de רָעָה, que aqui é mais intensa do que simples infortúnio.
theological_decisions:
- issue: Sentido de הֶבֶל em Eclesiastes
  choice: vapor
  alternative: vaidade; fugacidade
  rationale: “Vapor” preserva a metáfora hebraica e sua abertura semântica — transitoriedade, insubstancialidade e caráter enigmático — sem importar a noção mais estreita de orgulho.
- issue: Referência de אָדָם
  choice: homem
  alternative: pessoa; ser humano
  rationale: O texto apresenta um exemplo individual no masculino singular. A tradução conserva essa forma sem ampliar a referência para a humanidade em geral.
- issue: Força de יִתְּנֶנּוּ
  choice: terá de dar
  alternative: dará; dá
  rationale: O contexto descreve a transferência como inevitável, mas a tradução não afirma por que ela ocorre nem acrescenta uma explicação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura foi suavizada para soar natural, mas foram preservados o contraste entre quem trabalha e quem recebe, a tríade “sabedoria, conhecimento e habilidade” e a ambiguidade do referente de “nisso”.
