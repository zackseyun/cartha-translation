base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/016.yaml
  text: For there is no lasting remembrance of the wise man any more than of the fool[a], since in the days to come everything will already have been forgotten[b]. And how the wise man dies just like the fool!
translation:
  language: pt
  text: Pois não há lembrança permanente do sábio, assim como não há do insensato[a], visto que, nos dias que virão, tudo já terá sido esquecido. E como o sábio morre do mesmo modo que o insensato![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Pois não há lembrança do sábio com o insensato para sempre”. A tradução no texto principal expressa em português natural a ausência de lembrança duradoura de ambos.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “E como morre o sábio com o insensato!” A frase provavelmente é exclamativa e lamenta o fato de o sábio morrer do mesmo modo que o insensato.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוֹן
  choice: lembrança
  rationale: O substantivo indica lembrança ou memória preservada. “Lembrança” é natural em português e se ajusta ao tema existencial do contexto sem restringir o sentido à memória interior.
- source_word: לֶחָכָם / הֶחָכָם
  choice: o sábio
  rationale: O adjetivo substantivado está no masculino singular. “O sábio” preserva a forma representativa do hebraico com expressão corrente e digna em português.
- source_word: עִם הַכְּסִיל
  choice: assim como não há do insensato / do mesmo modo que o insensato
  rationale: Embora עִם signifique literalmente “com”, aqui liga o sábio e o insensato na mesma ausência de lembrança duradoura e no mesmo destino mortal. As formulações comparativas tornam essa relação clara em português.
- source_word: לְעוֹלָם
  choice: permanente
  rationale: No contexto, a expressão qualifica a duração da lembrança. “Permanente” comunica a ideia de lembrança que perdura sem impor uma formulação metafísica mais forte do que o argumento requer.
- source_word: בְּשֶׁכְּבָר
  choice: visto que ... já
  rationale: A construção comprimida introduz a razão da afirmação anterior e inclui a noção de algo já ocorrido. Em português, essa força é distribuída naturalmente entre “visto que” e “já”.
- source_word: הַיָּמִים הַבָּאִים
  choice: os dias que virão
  rationale: Mantém o sentido prospectivo do particípio hebraico e soa natural em português.
- source_word: הַכֹּל נִשְׁכָּח
  choice: tudo já terá sido esquecido
  rationale: O nifal apresenta sentido passivo, “ser esquecido”. Com a referência aos dias futuros e o valor de כְּבָר, o futuro composto expressa adequadamente que, naquele tempo, tudo já estará esquecido.
- source_word: וְאֵיךְ
  choice: E como
  rationale: Preserva a forma exclamativa e lamentosa da frase sem convertê-la numa pergunta informativa nem acrescentar explicitamente “ai”.
- source_word: יָמוּת
  choice: morre
  rationale: O imperfeito exprime aqui a realidade geral da mortalidade; o presente em português comunica naturalmente essa verdade geral.
theological_decisions:
- issue: Destino comum do sábio e do insensato
  choice: Preservar a afirmação de que ambos morrem do mesmo modo, sem explicar além do verso
  alternative: Interpretar a frase como negação de qualquer diferença entre eles em todos os sentidos
  rationale: O verso focaliza especificamente o esquecimento e a morte compartilhados. A tradução não deve ampliar essa observação para uma conclusão teológica que o texto não formula aqui.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Insensato” mantém o contraste sapiencial sem o tom coloquial ou ofensivo que “tolo” pode assumir em certos contextos. A sintaxe conserva a progressão causal e a exclamação final do hebraico.
