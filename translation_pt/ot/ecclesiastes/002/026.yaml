  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֤י לְ/אָדָם֙ שֶׁ/טּ֣וֹב לְ/פָנָ֔י/ו נָתַ֛ן חָכְמָ֥ה וְ/דַ֖עַת וְ/שִׂמְחָ֑ה וְ/לַ/חוֹטֶא֩ נָתַ֨ן עִנְיָ֜ן לֶ/אֱס֣וֹף וְ/לִ/כְנ֗וֹס לָ/תֵת֙ לְ/טוֹב֙ לִ/פְנֵ֣י הָֽ/אֱלֹהִ֔ים גַּם זֶ֥ה הֶ֖בֶל וּ/רְע֥וּת רֽוּחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/026.yaml
  text: For to the man who is good before him he has given wisdom and knowledge and joy[a], but to the sinner he has given the task of gathering and collecting, to give to the one who is good before God[b]. This too is vanity and a chasing after wind.
translation:
  language: pt
  text: Pois Deus dá sabedoria, conhecimento e alegria ao homem que é bom diante dele[a]; mas ao pecador dá a tarefa de ajuntar e acumular, para dar àquele que é bom diante de Deus. Isso também é vaidade e correr atrás do vento.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que lhe agrada”. O hebraico diz literalmente “que é bom diante dele”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “esforçar-se pelo vento”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאָדָם
  choice: ao homem
  rationale: O substantivo designa aqui um indivíduo e está em contraste com “o pecador”; a forma masculina do hebraico é preservada sem generalizá-la para toda a humanidade.
- source_word: שֶׁטּוֹב לְפָנָיו
  choice: que é bom diante dele
  rationale: Preserva tanto טוֹב, “bom”, quanto a construção לְפָנָיו, “diante dele”, sem reduzir a expressão idiomática à interpretação “que lhe agrada”.
- source_word: נָתַן
  choice: dá
  rationale: O presente exprime adequadamente a afirmação reflexiva e geral de Qohelet sobre aquilo que Deus concede.
- source_word: חָכְמָה וְדַעַת וְשִׂמְחָה
  choice: sabedoria, conhecimento e alegria
  rationale: Equivalentes diretos, naturais e coerentes com o vocabulário temático de Eclesiastes.
- source_word: לַחוֹטֶא
  choice: ao pecador
  rationale: O particípio caracteriza a pessoa como pecadora e mantém o contraste com o homem considerado bom diante de Deus.
- source_word: עִנְיָן
  choice: a tarefa
  rationale: Indica uma ocupação atribuída, potencialmente penosa, sem acrescentar à palavra uma carga negativa maior do que a explicitada pelo contexto.
- source_word: לֶאֱסוֹף וְלִכְנוֹס
  choice: de ajuntar e acumular
  rationale: Mantém os dois infinitivos quase sinônimos e sua ênfase na reunião progressiva de bens.
- source_word: לָתֵת לְטוֹב לִפְנֵי הָאֱלֹהִים
  choice: para dar àquele que é bom diante de Deus
  rationale: Conserva a repetição da linguagem avaliativa anterior e nomeia Deus onde o hebraico o faz, sem explicitar desnecessariamente o objeto implícito de “dar”.
- source_word: הֶבֶל
  choice: vaidade
  rationale: Preserva o termo temático tradicional de Eclesiastes e sua combinação de transitoriedade, insubstancialidade e frustração, evitando a interpretação absoluta “falta de sentido”.
- source_word: רְעוּת רוּחַ
  choice: correr atrás do vento
  rationale: Expressa em português atual a imagem de uma busca impossível e frustrante, preservando a metáfora do vento.
theological_decisions:
- issue: Sujeito implícito de נָתַן
  choice: Deus é explicitado como o doador
  alternative: Manter apenas o pronome implícito ou uma formulação impessoal
  rationale: O contexto imediato atribui a Deus aquilo que é concedido (2.24-25), e o próprio versículo o nomeia depois. A explicitação torna a frase natural em português sem introduzir um agente estranho ao contexto.
- issue: Sentido de טוֹב לִפְנֵי הָאֱלֹהִים
  choice: bom diante de Deus
  alternative: que agrada a Deus
  rationale: A tradução principal conserva a forma e a ambiguidade avaliativa do hebraico; a leitura idiomática possível, “que agrada a Deus”, é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação preserva os termos temáticos e as repetições do hebraico, mas usa sintaxe corrente. Os marcadores foram colocados junto às expressões a que suas notas efetivamente se referem.
