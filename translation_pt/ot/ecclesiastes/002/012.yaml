  text: וּ/פָנִ֤יתִֽי אֲנִי֙ לִ/רְא֣וֹת חָכְמָ֔ה וְ/הוֹלֵל֖וֹת וְ/סִכְל֑וּת כִּ֣י מֶ֣ה הָ/אָדָ֗ם שֶׁ/יָּבוֹא֙ אַחֲרֵ֣י הַ/מֶּ֔לֶךְ אֵ֥ת אֲשֶׁר כְּבָ֖ר עָשֽׂוּ/הוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/012.yaml
  text: So I turned to consider wisdom[a], madness, and folly; for what can the man do who comes after the king? Only what has already been done.
translation:
  language: pt
  text: Então me voltei para considerar a sabedoria, a loucura e a insensatez. Pois o que poderá fazer o homem que vier depois do rei, senão aquilo que já foi feito?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A oração final em hebraico é difícil e comprimida. Mais literalmente, contém algo como: “aquilo que já fizeram a ele/isso”; o verbo está no plural, e o referente do sufixo singular é incerto.'
    reason: Leitura alternativa decorrente da sintaxe incomum e do sufixo hebraico ambíguo.
lexical_decisions:
- source_word: וּפָנִיתִי
  choice: Então me voltei
  rationale: O verbo פנה marca uma mudança no rumo da reflexão. “Então me voltei” expressa essa transição com naturalidade.
- source_word: לִרְאוֹת
  choice: para considerar
  rationale: Embora ראה signifique literalmente “ver”, com objetos abstratos pode indicar exame ou reflexão; “considerar” corresponde ao contexto.
- source_word: חָכְמָה
  choice: sabedoria
  rationale: Equivalente corrente de חכמה, que aqui abrange discernimento prático e intelectual.
- source_word: הוֹלֵלוֹת
  choice: loucura
  rationale: No Eclesiastes, o termo designa comportamento irracional ou desvairado e forma um contraste incisivo com a sabedoria.
- source_word: סִכְלוּת
  choice: insensatez
  rationale: O termo denota falta de juízo ou estupidez. “Insensatez” é digno, atual e mantém distinção em relação a “loucura”.
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou explicação para a mudança de investigação mencionada antes.
- source_word: מֶה הָאָדָם
  choice: o que poderá fazer o homem
  rationale: A formulação hebraica é comprimida, literalmente próxima de “que é o homem”. O verbo “fazer” é explicitado em português a partir do contexto e da oração final, sem esconder a dificuldade, registrada em nota.
- source_word: שֶׁיָּבוֹא אַחֲרֵי הַמֶּלֶךְ
  choice: que vier depois do rei
  rationale: A construção descreve aquele que sucede ao rei. O futuro do subjuntivo é natural em português para essa referência eventual.
- source_word: אֵת אֲשֶׁר כְּבָר עָשׂוּהוּ
  choice: senão aquilo que já foi feito
  rationale: 'A oração é sintaticamente difícil: a forma verbal está na terceira pessoa do plural e leva um sufixo singular ambíguo. A tradução comunica a provável força contextual — o sucessor fica limitado ao que já se realizou — enquanto a nota preserva a forma alternativa.'
theological_decisions:
- issue: Sentido de אָדָם numa declaração retórica singular
  choice: o homem
  alternative: alguém; a humanidade
  rationale: O substantivo está no singular e, no contexto, aponta para o indivíduo que vem depois do rei, não diretamente para a humanidade como coletivo.
- issue: Interpretação da oração final difícil
  choice: senão aquilo que já foi feito
  alternative: aquilo que já fizeram a ele/isso
  rationale: A leitura principal oferece o sentido contextual mais provável sem atribuir ao texto uma tese teológica adicional. A tradução mais formal da morfologia é preservada na nota devido à ambiguidade do sufixo.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. “Loucura” e “insensatez” conservam a distinção entre os dois termos hebraicos. A nota explicita, sem resolver indevidamente, a ambiguidade da oração final.
