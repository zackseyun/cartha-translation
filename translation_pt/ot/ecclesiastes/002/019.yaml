id: ECC.2.19
reference: Ecclesiastes 2:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/מִ֣י יוֹדֵ֗עַ הֶֽ/חָכָ֤ם יִהְיֶה֙ א֣וֹ סָכָ֔ל וְ/יִשְׁלַט֙ בְּ/כָל עֲמָלִ֔/י שֶֽׁ/עָמַ֥לְתִּי וְ/שֶׁ/חָכַ֖מְתִּי תַּ֣חַת הַ/שָּׁ֑מֶשׁ גַּם זֶ֖ה הָֽבֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/019.yaml
  text: And who knows whether he will be wise or foolish? Yet he will rule over all my labor in which I labored and used wisdom under the sun[a]. This too is vanity.
translation:
  language: pt
  text: E quem sabe se ele será sábio ou insensato? Mesmo assim, terá domínio sobre todo o meu trabalho, no qual trabalhei e apliquei sabedoria debaixo do sol. Também isso é vaidade[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Também isso é vapor”, destacando seu caráter passageiro; também pode significar “Também isso é futilidade”. O hebraico hével abrange vários sentidos em Eclesiastes.
    reason: Alternativa lexical para preservar a amplitude metafórica do termo hebraico הֶבֶל.
lexical_decisions:
- source_word: וּמִי יוֹדֵעַ
  choice: E quem sabe
  rationale: Preserva a continuidade marcada pela conjunção hebraica e introduz de modo natural a incerteza da pergunta.
- source_word: הֶחָכָם יִהְיֶה אוֹ סָכָל
  choice: se ele será sábio ou insensato
  rationale: Reproduz a pergunta indireta e mantém o contraste entre sabedoria e falta de juízo, em linguagem portuguesa atual e digna.
- source_word: וְיִשְׁלַט
  choice: Mesmo assim, terá domínio sobre
  rationale: 'O verbo expressa exercício de controle ou domínio. A locução adversativa explicita o contraste contextual sem alterar o fato afirmado: qualquer que seja seu caráter, o sucessor controlará o resultado do trabalho.'
- source_word: בְּכָל עֲמָלִי שֶׁעָמַלְתִּי
  choice: sobre todo o meu trabalho, no qual trabalhei
  rationale: Mantém, tanto quanto o português natural permite, a repetição retórica entre o substantivo e o verbo hebraicos, que ressalta o esforço pessoal do autor.
- source_word: וְשֶׁחָכַמְתִּי
  choice: e apliquei sabedoria
  rationale: Expressa o sentido ativo de agir com sabedoria ou empregá-la, em vez de indicar apenas a posse de uma qualidade.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: debaixo do sol
  rationale: Conserva a expressão temática recorrente de Eclesiastes para a esfera da vida terrena.
- source_word: גַּם זֶה הָבֶל
  choice: Também isso é vaidade
  rationale: Mantém a formulação temática tradicional de Eclesiastes sem reduzir o amplo campo metafórico de הֶבֶל; a nota registra sentidos possíveis como vapor e futilidade.
theological_decisions:
- issue: Tradução do termo temático הֶבֶל em Eclesiastes
  choice: vaidade
  alternative: vapor; futilidade
  rationale: “Vaidade” preserva a ressonância tradicional e temática do livro, mas não esgota a imagem hebraica de algo fugaz, insubstancial ou frustrante. A alternativa é registrada em nota para manter essa abertura sem impor uma única interpretação teológica.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O tom é sóbrio e digno; preservam-se a pergunta retórica, o contraste contextual e as expressões temáticas de Eclesiastes.
