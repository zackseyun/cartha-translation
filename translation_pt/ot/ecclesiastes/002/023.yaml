id: ECC.2.23
reference: Ecclesiastes 2:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֧י כָל יָמָ֣י/ו מַכְאֹבִ֗ים וָ/כַ֨עַס֙ עִנְיָנ֔/וֹ גַּם בַּ/לַּ֖יְלָה לֹא שָׁכַ֣ב לִבּ֑/וֹ גַּם זֶ֖ה הֶ֥בֶל הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/023.yaml
  text: For all his days are pains[a], and his occupation is vexation; even in the night his heart does not lie down[b]. This too is vapor.
translation:
  language: pt
  text: Pois todos os seus dias são dores, e sua ocupação é aflição; mesmo de noite seu coração não se deita[a]. Também isso é vapor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu coração não descansa”. O hebraico diz literalmente “seu coração não se deita”, imagem que expressa uma inquietação interior que continua durante a noite.
    reason: lexical_alternative
  - marker: b
    text: Ou “vaidade” ou “sopro”. O hebraico הֶבֶל é traduzido aqui como “vapor” para preservar a imagem recorrente no livro de algo fugaz e sem consistência.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da reflexão anterior e conserva de modo natural o nexo discursivo do hebraico.
- source_word: כָל יָמָיו
  choice: todos os seus dias
  rationale: Preserva a expressão temporal concreta do hebraico sem deixar de ser clara em português.
- source_word: מַכְאֹבִים
  choice: dores
  rationale: Mantém o plural e o sentido amplo de sofrimento, sem restringi-lo apenas à tristeza emocional ou ao esforço físico.
- source_word: וָכַעַס
  choice: aflição
  rationale: Expressa a perturbação penosa associada à ocupação; evita limitar o termo à ira, embora o hebraico possa incluir irritação e desgosto.
- source_word: עִנְיָנוֹ
  choice: sua ocupação
  rationale: Refere-se à tarefa ou atividade que ocupa a pessoa e corresponde bem ao foco contextual no trabalho humano.
- source_word: גַּם בַּלַּיְלָה
  choice: mesmo de noite
  rationale: Reproduz a força aditiva e enfática de גַּם em português corrente.
- source_word: לֹא שָׁכַב לִבּוֹ
  choice: seu coração não se deita
  rationale: Conserva a imagem antropológica e a formulação concreta do hebraico, deixando a nota esclarecer o sentido de inquietação interior.
- source_word: גַּם זֶה
  choice: Também isso
  rationale: Preserva a fórmula recorrente e a força aditiva da expressão em Eclesiastes.
- source_word: הֶבֶל
  choice: vapor
  rationale: Mantém a imagem recorrente de algo fugaz e sem consistência, em vez de resolvê-la apenas como conceito abstrato de vaidade ou inutilidade.
