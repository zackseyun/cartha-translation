  text: So I turned to despair in my heart over all the labor at which I had labored under the sun[a][b].
translation:
  language: pt
  text: Então, entreguei meu coração ao desespero por todo o trabalho em que me empenhei debaixo do sol[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Então, voltei-me para fazer meu coração desesperar” ou “Então, passei a desanimar em meu coração”. A expressão hebraica é compacta e admite várias formulações próximas.'
