lexical_decisions:
- source_word: וְסַבּוֹתִי
  choice: Então me voltei
  rationale: O qal perfeito de סבב indica aqui uma mudança de rumo ou de disposição. “Então me voltei” mantém a imagem de movimento e funciona naturalmente na sequência do raciocínio.
- source_word: לְיַאֵשׁ אֶת־לִבִּי
  choice: para o desespero em meu coração
  rationale: A construção hebraica é compacta e, literalmente, pode sugerir “fazer meu coração desesperar”. A formulação escolhida comunica a entrega interior ao desespero sem restringir לֵב apenas à mente ou às emoções.
- source_word: עַל
  choice: por causa de
  rationale: A preposição introduz aquilo que ocasiona o desespero. “Por causa de” explicita essa relação causal de modo claro e corrente.
- source_word: כָּל־הֶעָמָל שֶׁעָמַלְתִּי
  choice: todo o trabalho em que trabalhei
  rationale: A repetição de “trabalho/trabalhei” reproduz a ênfase criada no hebraico pelo substantivo עָמָל e pelo verbo cognato עמל, ainda que resulte deliberadamente marcada em português.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: debaixo do sol
  rationale: Expressão recorrente e programática em Eclesiastes; “debaixo do sol” é clara, tradicional e permite consistência ao longo do livro.
