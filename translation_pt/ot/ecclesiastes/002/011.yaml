  text: וּ/פָנִ֣יתִֽי אֲנִ֗י בְּ/כָל מַעֲשַׂ/י֙ שֶֽׁ/עָשׂ֣וּ יָדַ֔/י וּ/בֶֽ/עָמָ֖ל שֶׁ/עָמַ֣לְתִּי לַ/עֲשׂ֑וֹת וְ/הִנֵּ֨ה הַ/כֹּ֥ל הֶ֨בֶל֙ וּ/רְע֣וּת ר֔וּחַ וְ/אֵ֥ין יִתְר֖וֹן תַּ֥חַת הַ/שָּֽׁמֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/011.yaml
  text: Then I turned to consider all the works that my hands had done[a], and the labor that I had labored to do; and behold, all was vanity and a chasing after wind[c][b], and there was no profit under the sun.
translation:
  language: pt
  text: Então me voltei para considerar todas as obras que minhas mãos haviam feito e todo o trabalho que tive para realizá-las. E eis que tudo era vaidade[a] e correr atrás do vento[b], e não havia proveito[c] debaixo do sol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vapor” ou “sopro”. O hebraico hével muitas vezes comunica aquilo que é passageiro, insubstancial ou frustrantemente inapreensível.
    reason: lexical_alternative
  - marker: b
    text: Ou “esforçar-se pelo vento”. A expressão hebraica retrata esforço ou busca inútil.
    reason: lexical_alternative
  - marker: c
    text: Ou “ganho” ou “vantagem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָנִיתִי
  choice: Então me voltei para considerar
  rationale: Preserva a imagem concreta de “voltar-se” e explicita, de modo natural em português, a mudança para uma avaliação reflexiva.
- source_word: מַעֲשַׂי שֶׁעָשׂוּ יָדַי
  choice: todas as obras que minhas mãos haviam feito
  rationale: Mantém tanto o sentido concreto de “obras” quanto a ênfase hebraica na atuação pessoal das mãos.
- source_word: וּבֶעָמָל שֶׁעָמַלְתִּי לַעֲשׂוֹת
  choice: e todo o trabalho que tive para realizá-las
  rationale: Expressa o trabalho penoso indicado pelo substantivo e pelo verbo cognato, evitando em português a repetição pouco natural “o trabalho que trabalhei”. O pronome retoma naturalmente as obras.
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Conserva a força apresentativa e enfática da conclusão, em registro literário ainda claro no português moderno.
- source_word: הֶבֶל
  choice: vaidade
  rationale: Mantém o termo temático tradicional de Eclesiastes sem reduzi-lo à afirmação mais absoluta de “falta de sentido”; a nota registra as imagens de vapor e sopro.
- source_word: וּרְעוּת רוּחַ
  choice: e correr atrás do vento
  rationale: Comunica com clareza contemporânea a imagem de uma busca inútil, sem apagar na nota a possibilidade de “esforçar-se pelo vento”.
- source_word: וְאֵין יִתְרוֹן
  choice: e não havia proveito
  rationale: “Proveito” preserva o sentido avaliativo de ganho, vantagem ou saldo resultante, central na argumentação de Eclesiastes.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: debaixo do sol
  rationale: É uma formulação portuguesa natural e reconhecível para a expressão programática do livro sobre a esfera da vida humana terrena.
theological_decisions:
- issue: Sentido de הֶבֶל em Eclesiastes
  choice: vaidade
  alternative: vapor, sopro ou fugacidade
  rationale: A escolha preserva a continuidade temática do livro e sua tensão entre transitoriedade, caráter inapreensível e frustração, sem impor uma leitura niilista como “total falta de sentido”.
- issue: Imagem de רְעוּת רוּחַ
  choice: correr atrás do vento
  alternative: esforçar-se pelo vento
  rationale: A expressão principal transmite a inutilidade da busca de modo idiomático; a alternativa mantém aberta a incerteza lexical e imagética do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A construção evita literalismos pouco naturais, mas conserva as imagens centrais de voltar-se, das mãos, da vaidade e do vento.
