  text: וְ/כֹל֙ אֲשֶׁ֣ר שָֽׁאֲל֣וּ עֵינַ֔/י לֹ֥א אָצַ֖לְתִּי מֵ/הֶ֑ם לֹֽא מָנַ֨עְתִּי אֶת לִבִּ֜/י מִ/כָּל שִׂמְחָ֗ה כִּֽי לִבִּ֤/י שָׂמֵ֨חַ֙ מִ/כָּל עֲמָלִ֔/י וְ/זֶֽה הָיָ֥ה חֶלְקִ֖/י מִ/כָּל עֲמָלִֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/010.yaml
  text: And whatever my eyes desired I did not withhold from them[a]; I did not keep my heart from any pleasure, for my heart rejoiced in all my labor[c][b], and this was my portion from all my labor.
translation:
  language: pt
  text: Tudo o que os meus olhos desejaram, não lhes neguei[a]. Não privei o meu coração de prazer algum[b], pois o meu coração se alegrava com todo o meu trabalho[c], e essa foi a minha porção de todo o meu trabalho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tudo o que os meus olhos pediram, não retive deles”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Não refreei o meu coração de alegria alguma”.'
    reason: lexical_alternative
  - marker: c
    text: Em ambas as ocorrências, “trabalho” também pode ser traduzido por “labuta” ou “trabalho árduo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאֲלוּ עֵינַי
  choice: os meus olhos desejaram
  rationale: Embora o verbo signifique literalmente “pediram”, tendo “meus olhos” como sujeito, a expressão comunica aquilo que eles cobiçaram ou desejaram. A formulação preserva a imagem hebraica e soa natural em português.
- source_word: לֹא אָצַלְתִּי מֵהֶם
  choice: não lhes neguei
  rationale: O verbo indica reter ou recusar algo. O pronome “lhes” retoma “os meus olhos” e conserva de modo conciso a estrutura da imagem hebraica.
- source_word: לֹא מָנַעְתִּי אֶת לִבִּי
  choice: não privei o meu coração
  rationale: A expressão descreve não impedir ou restringir o próprio ser interior. “Não privei” é atual e inteligível sem eliminar a referência explícita ao coração.
- source_word: שִׂמְחָה
  choice: prazer
  rationale: Neste contexto de desfrute dos empreendimentos e bens, “prazer” comunica bem o sentido contextual, embora “alegria” também pertença ao campo semântico.
- source_word: לִבִּי שָׂמֵחַ
  choice: o meu coração se alegrava
  rationale: Preserva o coração como centro da experiência interior e traduz naturalmente a forma hebraica que apresenta uma alegria experimentada durante o trabalho.
- source_word: עֲמָלִי
  choice: meu trabalho
  rationale: עָמָל pode designar trabalho árduo, esforço ou labuta. “Trabalho” é claro e abrangente, sendo mantido nas duas ocorrências para preservar a repetição do original.
- source_word: חֶלְקִי
  choice: minha porção
  rationale: “Porção” conserva a linguagem temática de Eclesiastes para aquilo que cabe a alguém como benefício ou parte recebida.
- source_word: וְזֶה הָיָה חֶלְקִי
  choice: e essa foi a minha porção
  rationale: Tradução direta e natural que mantém a conclusão reflexiva da frase.
