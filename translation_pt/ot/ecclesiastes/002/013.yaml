  text: And I saw that wisdom has an advantage over folly[a], as light has an advantage over darkness.
translation:
  language: pt
  text: E eu vi que a sabedoria tem vantagem sobre a insensatez[a], assim como a luz tem vantagem sobre as trevas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “proveito”: o termo hebraico pode indicar excedente, ganho, proveito ou vantagem; aqui se refere à superioridade da sabedoria sobre a insensatez.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתִי אָ֔נִי
  choice: E eu percebi
  rationale: O verbo ראה pode indicar tanto ver como perceber. Neste contexto de reflexão, “percebi” expressa naturalmente uma conclusão fundada na observação; o pronome independente אָ֔נִי acrescenta ênfase, suficientemente representada pelo “eu” explícito em português.
- source_word: שֶׁיֵּשׁ יִתְרוֹן לַחָכְמָה
  choice: que a sabedoria leva vantagem
  rationale: A construção existencial hebraica afirma que há uma vantagem pertencente à sabedoria. “Leva vantagem” é uma formulação portuguesa clara e idiomática que mantém o sentido comparativo de יִתְרוֹן.
- source_word: מִן הַסִּכְלוּת
  choice: sobre a insensatez
  rationale: סִכְלוּת designa insensatez ou falta de juízo; com מִן, estabelece a comparação de superioridade. “Insensatez” é digna, corrente e adequada ao vocabulário sapiencial.
- source_word: כִּיתְרוֹן הָאוֹר מִן הַחֹשֶׁךְ
  choice: assim como a luz leva vantagem sobre as trevas
  rationale: A repetição de “leva vantagem” torna explícito o paralelismo do hebraico. “Trevas” é a expressão portuguesa tradicional e natural para חֹשֶׁךְ neste contraste com a luz.
theological_decisions:
- issue: Amplitude semântica de יִתְרוֹן em Eclesiastes
  choice: vantagem
  alternative: proveito; lucro; ganho
  rationale: Neste versículo, o termo descreve a superioridade comparativa da sabedoria sobre a insensatez, em paralelo com luz e trevas. “Vantagem” preserva esse sentido sem restringi-lo a lucro econômico.
- issue: Valor de ראה na declaração do mestre
  choice: percebi
  alternative: vi
  rationale: “Percebi” apresenta a afirmação como conclusão da observação e não acrescenta uma doutrina ao texto. “Vi” também seria possível, mas pode soar excessivamente visual neste contexto reflexivo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O paralelismo foi preservado por meio da repetição de “leva vantagem”; evitou-se um tom excessivamente comercial para יִתְרוֹן.
