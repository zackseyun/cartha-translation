  yaml_path: translation/ot/ecclesiastes/010/005.yaml
  text: 'There is an evil I have seen under the sun[a], like an error that goes out from before the ruler:'
translation:
  language: pt
  text: 'Há um mal que vi debaixo do sol, como um erro[a] que sai de diante do governante:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como um engano que procede da presença do governante”. O hebraico pode indicar tanto um erro realmente involuntário como algo que é tratado como se fosse um erro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  choice: Há
  rationale: A forma existencial portuguesa é natural e preserva a apresentação de uma realidade observada.
- source_word: רָעָה
  choice: um mal
  rationale: Mantém a amplitude do termo hebraico, que pode indicar algo mau, grave ou deplorável, sem defini-lo estritamente como culpa moral ou calamidade.
- source_word: רָאִיתִי
  choice: que vi
  rationale: O pretérito perfeito introduz com naturalidade a observação pessoal do Mestre, sem alterar sua relevância para o presente.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: debaixo do sol
  rationale: Expressão característica de Eclesiastes, clara e consagrada em português para a vida no âmbito terreno.
- source_word: כִּשְׁגָגָה
  choice: como um erro
  rationale: Preserva a comparação marcada por כְּ e a abertura semântica de שְׁגָגָה entre erro, engano e ato inadvertido.
- source_word: שֶׁיֹּצָא
  choice: que procede
  rationale: Expressa a ideia de algo que sai ou tem origem em determinado lugar, com fluidez em português.
- source_word: מִלִּפְנֵי
  choice: da presença de
  rationale: Conserva a imagem cortesã de algo que parte de diante ou da presença da autoridade, evitando reduzi-la simplesmente a autoria.
- source_word: הַשַּׁלִּיט
  choice: o governante
  rationale: Designa de modo claro e amplo quem exerce poder, sem especificar título monárquico ou estrutura política.
theological_decisions:
- issue: Natureza do erro atribuído ao governante
  choice: 'Manter a formulação comparativa e ambígua: “como um erro”'
  alternative: Afirmar diretamente que o governante cometeu um erro involuntário
  rationale: O hebraico não exige decidir se se trata de um equívoco realmente inadvertido ou de algo apresentado ou tratado como tal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leve formalidade adequada à literatura sapiencial. A construção preserva a fórmula típica de Eclesiastes e a imagem da presença do governante; os dois-pontos mantêm a ligação com o exemplo desenvolvido no versículo seguinte.
