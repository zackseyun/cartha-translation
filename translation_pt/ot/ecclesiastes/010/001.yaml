  text: זְב֣וּבֵי מָ֔וֶת יַבְאִ֥ישׁ יַבִּ֖יעַ שֶׁ֣מֶן רוֹקֵ֑חַ יָקָ֛ר מֵ/חָכְמָ֥ה מִ/כָּב֖וֹד סִכְל֥וּת מְעָֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/001.yaml
  text: Dead flies make a perfumer’s oil stink and bubble up[b][a]; so a little folly outweighs wisdom and honor.
translation:
  language: pt
  text: Moscas mortas fazem o óleo do perfumista cheirar mal e borbulhar[a]; assim, um pouco de insensatez pesa mais que a sabedoria e a honra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fermentar”, “soltar bolhas” ou, em sentido mais geral, “estragar”. O verbo hebraico sugere emissão ativa ou borbulhamento do óleo arruinado.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “é mais precioso que”. O hebraico admite uma comparação de valor: “um pouco de insensatez tem mais peso ou importância que a sabedoria e a honra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבוּבֵי מָוֶת
  choice: Moscas mortas
  rationale: A expressão construta significa literalmente “moscas de morte”. No contexto do óleo que se estraga, “moscas mortas” comunica de modo natural a imagem concreta em português.
- source_word: יַבְאִישׁ
  choice: fazem ... cheirar mal
  rationale: 'O hifil de באש expressa causação: fazer exalar mau cheiro. A formulação é clara, vívida e corrente.'
- source_word: יַבִּיעַ
  choice: borbulhar
  rationale: O verbo pode indicar fazer brotar, emitir ou borbulhar. Aqui descreve de maneira concreta a atividade visível do óleo arruinado, sem reduzir o sentido apenas a “estragar”.
- source_word: שֶׁמֶן רוֹקֵחַ
  choice: o óleo do perfumista
  rationale: Preserva tanto o óleo preparado quanto o ofício do artesão, em linguagem moderna e compreensível.
- source_word: יָקָר
  choice: pesa mais
  rationale: Embora o adjetivo costume significar “precioso” ou “valioso”, neste provérbio comparativo pode indicar maior peso ou importância. “Pesa mais” expressa a consequência desproporcional da insensatez e mantém a metáfora avaliativa.
- source_word: מֵחָכְמָה מִכָּבוֹד
  choice: que a sabedoria e a honra
  rationale: As duas expressões preposicionais são entendidas em conjunto como os termos da comparação. “Honra” é mais apropriado que “glória” neste contexto de reputação humana.
- source_word: סִכְלוּת מְעָט
  choice: um pouco de insensatez
  rationale: Tradução direta e idiomática que preserva o contraste intencional entre a pequena quantidade de insensatez e seu efeito desproporcional.
