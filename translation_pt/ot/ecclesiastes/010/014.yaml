base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/014.yaml
  text: And the fool multiplies words[a]. A man does not know what will be[b], and who can tell him what will be after him?
translation:
  language: pt
  text: E o tolo multiplica palavras. O ser humano[a] não sabe o que será, e quem lhe poderá dizer o que será depois dele?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A pessoa não sabe” ou “A humanidade não sabe”. O hebraico emprega הָאָדָם no singular, representando genericamente a humanidade.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “depois que ele se for”. O hebraico pode se referir ao que vem depois de uma pessoa no tempo, especialmente depois de sua vida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַסָּכָל
  choice: E o tolo
  rationale: Mantém o substantivo definido singular e o fluxo do discurso marcado por וְ. Embora “Mas o tolo” seja possível pelo contexto, “E o tolo” não explicita um contraste além do hebraico.
- source_word: יַרְבֶּה דְבָרִים
  choice: multiplica palavras
  rationale: Preserva a imagem hebraica de aumentar ou multiplicar palavras, em formulação concisa e compreensível, em vez de reduzi-la à interpretação “fala demais”.
- source_word: לֹא יֵדַע הָאָדָם
  choice: O ser humano não sabe
  rationale: הָאָדָם é um singular representativo referente à humanidade. “O ser humano” conserva o singular e o sentido genérico em português atual.
- source_word: מַה שֶׁיִּהְיֶה
  choice: o que acontecerá
  rationale: Expressa naturalmente o futuro indefinido do hebraico. “O que será” seria mais formalmente próximo, mas menos claro neste contexto.
- source_word: וַאֲשֶׁר יִהְיֶה מֵאַחֲרָיו
  choice: o que acontecerá depois dele
  rationale: Mantém a referência temporal aberta, sem decidir se se trata especificamente do período posterior à morte da pessoa ou, de modo mais geral, do que virá depois dela.
- source_word: מִי יַגִּיד לוֹ
  choice: quem lhe poderá dizer
  rationale: Reproduz a força retórica da pergunta e comunica naturalmente a ideia de alguém ser capaz de informar a pessoa.
