base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/006.yaml
  text: Folly is set in many high places[a], and the rich sit in a low place.
translation:
  language: pt
  text: A insensatez é colocada em muitos lugares elevados[a], enquanto os ricos se sentam em lugar baixo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A insensatez é posta em muitas posições de destaque”. O hebraico usa a linguagem espacial de “lugares elevados” e “lugar baixo” como provável metáfora de posição social ou cargo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִתַּן
  choice: é colocada
  rationale: O nifal perfeito de נתן tem sentido passivo, “é dada/posta/colocada”. “É colocada” preserva a voz passiva sem especificar quem age.
- source_word: הַסֶּכֶל
  choice: a insensatez
  rationale: O substantivo designa insensatez ou tolice, não necessariamente uma pessoa insensata. “Insensatez” mantém o contraste temático de Eclesiastes entre sabedoria e falta de juízo.
- source_word: בַּמְּרוֹמִים רַבִּים
  choice: em muitos lugares elevados
  rationale: A expressão emprega linguagem espacial, literalmente relacionada a alturas, aqui provavelmente como metáfora de posições sociais ou cargos de destaque. A tradução conserva tanto a metáfora quanto o plural e o qualificativo “muitos”.
- source_word: וַעֲשִׁירִים
  choice: enquanto os ricos
  rationale: O adjetivo masculino plural é substantivado e se refere aos ricos como grupo social. “Enquanto” explicita de modo natural em português o contraste entre os dois membros, sem mudar sua relação lógica.
- source_word: בַּשֵּׁפֶל
  choice: em lugar baixo
  rationale: שֵׁפֶל indica baixeza, condição inferior ou lugar baixo. A formulação preserva a imagem espacial em oposição a “lugares elevados”.
- source_word: יֵשֵׁבוּ
  choice: se sentam
  rationale: ישב significa com frequência “sentar-se” e, no contexto, sugere ocupar uma posição. A tradução mantém a imagem concreta sem substituí-la por uma interpretação social explícita.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Preservou-se o paralelismo espacial do hebraico e sua metáfora social, evitando explicitar além do texto quem coloca a insensatez em posição elevada.
