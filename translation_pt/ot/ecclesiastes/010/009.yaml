  text: Whoever quarries stones may be hurt by them, and whoever splits logs may be endangered by them.
translation:
  language: pt
  text: Quem remove pedras pode se ferir com elas, e quem racha lenha pode se pôr em perigo com ela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַסִּיעַ אֲבָנִים
  choice: quem remove pedras
  rationale: O particípio de נסע, em construção com 'pedras', indica deslocá-las ou removê-las; 'remove' preserva a amplitude do hebraico sem restringir a atividade à extração em pedreira.
- source_word: יֵעָצֵב
  choice: pode se ferir
  rationale: Neste contexto de trabalho perigoso, o verbo expressa sofrer dano ou dor. A formulação modal comunica o risco inerente sem afirmar que o ferimento é inevitável.
- source_word: בּוֹקֵעַ עֵצִים
  choice: quem racha lenha
  rationale: בקע significa partir ou rachar, e עֵצִים pode designar madeira ou pedaços de madeira; 'racha lenha' é idiomático e adequado à atividade descrita.
- source_word: יִסָּכֶן בָּם
  choice: corre perigo ao fazê-lo
  rationale: A forma verbal rara indica estar em perigo ou expor-se a risco. 'Ao fazê-lo' retoma naturalmente o ato de rachar lenha e evita a referência pouco idiomática 'por elas' em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com paralelismo proverbial preservado. A tradução evita especificar 'extrair de uma pedreira', pois o hebraico fala mais amplamente de deslocar pedras, e mantém o sentido de risco ocupacional nas duas metades do versículo.
