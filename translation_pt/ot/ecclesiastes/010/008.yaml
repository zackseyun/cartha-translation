base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/008.yaml
  text: Whoever digs a pit will fall into it[b][a], and whoever breaks through a wall will be bitten by a snake.
translation:
  language: pt
  text: Quem cava uma cova cairá nela, e quem abre uma brecha num muro[b] será mordido por uma cobra[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «serpente».'
    reason: lexical_alternative
  - marker: b
    text: «Muro» também pode ser entendido como uma cerca divisória, provavelmente um muro de pedras no contexto antigo.
    reason: cultural_note
lexical_decisions:
- source_word: חֹפֵר
  choice: Quem cava
  rationale: O particípio qal tem sentido genérico e proverbial. «Quem cava» é natural em português e mantém o sujeito indefinido.
- source_word: גּוּמָּץ
  choice: uma cova
  rationale: Designa uma cavidade escavada, possivelmente usada como armadilha. «Cova» preserva bem a imagem proverbial.
- source_word: בּוֹ
  choice: nela
  rationale: O pronome retoma «cova» e, com «cair», expressa naturalmente a ideia de cair na própria cavidade escavada.
- source_word: יִפּוֹל
  choice: cairá
  rationale: O imperfeito, neste contexto proverbial, apresenta uma consequência geral; o futuro do português comunica essa força de modo idiomático.
- source_word: וּפֹרֵץ
  choice: e quem abre uma brecha
  rationale: O segundo particípio também é genérico. «Abre uma brecha» comunica a ação de romper ou atravessar à força uma barreira.
- source_word: גָּדֵר
  choice: num muro
  rationale: O termo pode indicar muro ou cerca, muitas vezes um muro de pedras que delimitava uma propriedade. «Muro» é claro e preserva a imagem principal, com a alternativa explicada em nota.
- source_word: יִשְּׁכֶנּוּ
  choice: será mordido
  rationale: O verbo significa «morder», e o sufixo remete à pessoa que rompe o muro. A construção passiva é natural em português e evita um pronome masculino genérico pouco fluente.
- source_word: נָחָשׁ
  choice: uma cobra
  rationale: «Cobra» é o equivalente contemporâneo mais claro. «Serpente» continua possível, mas tem registro mais elevado e pode sugerir associações alheias ao provérbio.
