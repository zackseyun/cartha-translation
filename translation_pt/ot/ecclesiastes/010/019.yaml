  text: לִ/שְׂחוֹק֙ עֹשִׂ֣ים לֶ֔חֶם וְ/יַ֖יִן יְשַׂמַּ֣ח חַיִּ֑ים וְ/הַ/כֶּ֖סֶף יַעֲנֶ֥ה אֶת הַ/כֹּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/019.yaml
  text: They make bread for laughter[a], and wine gladdens life[b], and money answers everything.
translation:
  language: pt
  text: Preparam uma refeição[a] para se divertirem; o vinho alegra a vida, e o dinheiro responde a tudo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “pão”; aqui, a palavra pode referir-se de modo mais amplo a alimento ou a uma refeição.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “atende a tudo”. O hebraico diz literalmente: “responde a tudo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׂחוֹק
  choice: para a diversão
  rationale: A preposição לְ indica finalidade ou resultado, e שְׂחוֹק pode designar riso, diversão ou alegria festiva. “Para a diversão” soa natural em português e conserva o tom proverbial sem ampliar demais o sentido.
- source_word: עֹשִׂים לֶחֶם
  choice: preparam uma refeição
  rationale: O verbo plural permite um sujeito humano indeterminado, expresso naturalmente por “preparam”. Embora לֶחֶם signifique literalmente “pão”, também pode representar alimento ou uma refeição; o contexto de diversão e vinho favorece aqui o sentido mais amplo.
- source_word: וְיַיִן יְשַׂמַּח חַיִּים
  choice: o vinho alegra a vida
  rationale: O piel de שׂמח significa “alegrar” ou “tornar alegre”, e חַיִּים pode significar “vida” ou “os viventes”. “Alegra a vida” preserva a formulação concisa e proverbial.
- source_word: וְהַכֶּסֶף
  choice: e o dinheiro
  rationale: כֶּסֶף pode significar “prata” ou “dinheiro”. Neste contexto sapiencial, o sentido econômico é o mais provável e mais claro para o leitor moderno.
- source_word: יַעֲנֶה אֶת־הַכֹּל
  choice: responde a tudo
  rationale: ענה significa normalmente “responder”. A expressão pode sugerir idiomaticamente que o dinheiro atende ou oferece solução para toda situação, mas a tradução literal preserva a concisão marcante e a possível tensão ou ironia do hebraico.
theological_decisions:
- issue: Tom e alcance da afirmação final
  choice: Apresentar diretamente que “o dinheiro responde a tudo”, sem qualificadores interpretativos.
  alternative: Explicitar ironia (“parece ser a resposta para tudo”) ou limitar pragmaticamente a afirmação (“atende a todas as necessidades”).
  rationale: O hebraico formula uma observação breve e absoluta, sem marcar gramaticalmente ironia nem limitação. Preservar essa tensão permite que o contexto literário de Eclesiastes oriente a interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência mantém o caráter aforístico do hebraico. “Refeição” comunica o uso contextual de “pão”, enquanto a nota conserva a imagem literal; “responde a tudo” retém deliberadamente a formulação incisiva e ambígua da cláusula final.
