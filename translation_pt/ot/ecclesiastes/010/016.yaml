  text: אִֽי לָ֣/ךְ אֶ֔רֶץ שֶׁ/מַּלְכֵּ֖/ךְ נָ֑עַר וְ/שָׂרַ֖יִ/ךְ בַּ/בֹּ֥קֶר יֹאכֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/016.yaml
  text: Woe to you[a], O land[b], when your king is a youth and your princes eat in the morning.
translation:
  language: pt
  text: Ai de você[a], ó terra, quando seu rei é um jovem e seus príncipes comem pela manhã![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que desgraça para você, ó terra, cujo rei é uma criança”. O hebraico נַעַר pode designar uma criança, um rapaz ou um jovem; aqui, provavelmente ressalta a imaturidade para governar.'
    reason: lexical_alternative
  - marker: b
    text: O fato de os príncipes “comerem pela manhã” provavelmente sugere banquetes autoindulgentes em hora imprópria, em contraste com o elogio do versículo seguinte.
    reason: cultural_note
lexical_decisions:
- source_word: אִי לָךְ
  choice: Ai de você
  rationale: A interjeição אִי com לָךְ expressa lamento ou denúncia dirigida diretamente à terra; “Ai de você” é natural, forte e tradicionalmente inteligível em português.
- source_word: אֶרֶץ
  choice: terra
  rationale: Neste contexto, designa um território politicamente organizado ou país. “Terra” preserva a amplitude do hebraico e funciona bem na apóstrofe poética.
- source_word: שֶׁמַּלְכֵּךְ
  choice: quando seu rei
  rationale: Embora a construção relativa também permita “cujo rei”, o valor circunstancial é expresso com naturalidade por “quando”, sem eliminar a relação apresentada no hebraico.
- source_word: נָעַר
  choice: um jovem
  rationale: O substantivo pode indicar criança, rapaz ou jovem. Aqui, “jovem” preserva a referência à idade e permite que o contexto sugira imaturidade política sem torná-la explícita no texto principal.
- source_word: וְשָׂרַיִךְ
  choice: e seus príncipes
  rationale: שָׂרִים designa governantes ou altos oficiais. “Príncipes” mantém a linguagem da corte e continua claro no português moderno.
- source_word: בַּבֹּקֶר
  choice: pela manhã
  rationale: Equivalente temporal direto e idiomático; no contexto, a hora sugere alimentação ou banquete inoportuno.
- source_word: יֹאכֵלוּ
  choice: comem
  rationale: Mantém o sentido básico do verbo sem antecipar na tradução a interpretação de que se trata de um banquete marcado pela autoindulgência.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A tradução conserva a apóstrofe poética “ó terra”, evita explicitar no corpo do texto uma imaturidade apenas sugerida por נַעַר e mantém o verbo simples “comem”, deixando a conotação cultural para a nota.
