  text: רָאִ֥יתִי עֲבָדִ֖ים עַל סוּסִ֑ים וְ/שָׂרִ֛ים הֹלְכִ֥ים כַּ/עֲבָדִ֖ים עַל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/007.yaml
  text: I have seen slaves on horses[c][b][a], and princes walking on the ground like slaves.
translation:
  language: pt
  text: Vi escravos montados em cavalos, e príncipes andando a pé, como escravos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאִיתִי
  choice: Vi
  rationale: O qal perfeito na primeira pessoa do singular relata uma observação pessoal. Em português, o pretérito perfeito simples é natural e preserva o caráter testemunhal sem exigir a forma composta.
- source_word: עֲבָדִים
  choice: escravos
  rationale: Embora o termo também possa significar servos, o contraste com pessoas de alta posição torna saliente aqui a condição social inferior; “escravos” expressa com mais força a inversão de hierarquia.
- source_word: עַל סוּסִים
  choice: montados em cavalos
  rationale: A expressão é literalmente “sobre cavalos”. A inclusão de “montados” torna explícita em português a cena concreta e o contraste com os príncipes que seguem a pé.
- source_word: שָׂרִים
  choice: príncipes
  rationale: O termo designa pessoas de alta posição, como chefes, nobres ou autoridades. “Príncipes” conserva a elevação social do contraste sem limitar a referência a um cargo administrativo específico.
- source_word: הֹלְכִים
  choice: andando
  rationale: O particípio descreve a ação em curso; “andando” reproduz naturalmente a imagem.
- source_word: כַעֲבָדִים
  choice: como escravos
  rationale: O כ comparativo apresenta uma semelhança de condição, não identifica necessariamente os príncipes como escravos.
- source_word: עַל הָאָרֶץ
  choice: a pé
  rationale: Literalmente, “sobre a terra/o chão”. No contexto, a expressão contrapõe os que estão montados aos que se deslocam sem montaria; “a pé” comunica essa oposição de modo natural e claro.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A construção mantém a inversão social incisiva do hebraico. “A pé” privilegia o sentido contextual de עַל הָאָרֶץ; não foram acrescentadas notas porque a alternativa literal não altera substancialmente a interpretação do versículo.
