translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A redação preserva o paralelismo proverbial e a progressão entre pensamento íntimo, fala em ambiente privado e divulgação inesperada. “Seu/sua” foi empregado sem regionalismo excessivo; o referente permanece claro pelo contexto.
