base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/020.yaml
  text: Even in your thoughts[a], do not curse a king, and in your bedroom do not curse a rich man, for a bird of the heavens may carry the sound[c][b], and a winged creature may report the matter.
translation:
  language: pt
  text: Mesmo em pensamento[a], não amaldiçoe um rei; nem em seu quarto[b] amaldiçoe um rico, pois uma ave dos céus[c] pode levar a voz, e uma criatura alada pode contar o caso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em sua mente”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “nos aposentos de sua cama”, isto é, no lugar mais privado da casa.
    reason: cultural_note
  - marker: c
    text: 'Hebraico: “uma ave dos céus”; compare a imagem popular de um passarinho que conta um segredo.'
    reason: cross_reference
lexical_decisions:
- source_word: בְּמַדָּעֲךָ
  choice: em pensamento
  rationale: מַדָּע pode indicar conhecimento, mente ou pensamento. Neste contexto, refere-se ao pensamento íntimo; “em pensamento” é natural em português e preserva o contraste entre o interior da pessoa e o quarto privado.
- source_word: מֶלֶךְ
  choice: um rei
  rationale: O substantivo hebraico não tem artigo, e a forma indefinida mantém o caráter geral da advertência.
- source_word: תְּקַלֵּל
  choice: amaldiçoe
  rationale: No Piel, קלל pode significar amaldiçoar ou tratar com desprezo. “Amaldiçoe” reproduz diretamente a força verbal e o paralelismo das duas proibições.
- source_word: בְחַדְרֵי מִשְׁכָּבְךָ
  choice: na privacidade do seu quarto
  rationale: A expressão significa literalmente “nos aposentos da sua cama” e designa o lugar mais reservado da casa. A tradução comunica tanto o local quanto a ênfase contextual na privacidade.
- source_word: עָשִׁיר
  choice: um rico
  rationale: O adjetivo masculino singular é usado como substantivo para uma pessoa rica. “Um rico” preserva a concisão e o paralelismo com “um rei”.
- source_word: עוֹף הַשָּׁמַיִם
  choice: uma ave do céu
  rationale: A expressão significa literalmente “ave dos céus”. “Ave do céu” conserva a imagem hebraica em formulação bíblica natural e compreensível em português.
- source_word: יוֹלִיךְ אֶת־הַקּוֹל
  choice: pode levar sua voz
  rationale: קוֹל significa “voz” ou “som”. “Levar sua voz” mantém a imagem concreta de palavras secretas sendo transportadas, e “pode” expressa naturalmente a força de advertência do futuro proverbial.
- source_word: בַעַל הַכְּנָפַיִם
  choice: uma criatura alada
  rationale: A expressão é literalmente “possuidor de asas” e funciona como designação idiomática de um ser alado. A escolha é clara e preserva o paralelismo poético.
- source_word: יַגֵּיד דָּבָר
  choice: pode contar o caso
  rationale: נגד significa contar, anunciar ou relatar, enquanto דָבָר pode ser palavra, coisa ou assunto. “Contar o caso” comunica de modo natural que aquilo que foi dito em segredo pode tornar-se conhecido.
