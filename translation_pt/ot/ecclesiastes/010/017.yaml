  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַשְׁרֵ֣י/ךְ אֶ֔רֶץ שֶׁ/מַּלְכֵּ֖/ךְ בֶּן חוֹרִ֑ים וְ/שָׂרַ֨יִ/ךְ֙ בָּ/עֵ֣ת יֹאכֵ֔לוּ בִּ/גְבוּרָ֖ה וְ/לֹ֥א בַ/שְּׁתִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/017.yaml
  text: Happy are you[a], O land, when your king is a son of nobles, and your princes eat at the proper time[c][b], for strength and not for drunkenness.
translation:
  language: pt
  text: Feliz é você, ó terra,[a] quando o seu rei é filho de nobres[b] e os seus príncipes comem no tempo certo, para ganhar forças e não para se embriagar.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Afortunada é você, ó terra”. O hebraico também pode ser traduzido por “Feliz” ou “Bem-aventurada”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “é de origem nobre”; mais literalmente, “é filho de nobres”.'
    reason: lexical_alternative
  - marker: c
    text: 'Mais literalmente: “para a força, e não para beber”. O sentido provável é que comem visando o vigor, e não a embriaguez.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵיךְ
  choice: Feliz é você
  rationale: A expressão sapiencial descreve uma condição invejável de bem-estar. “Feliz é você” é natural em português e, neste contexto de prosperidade cívica, evita sugerir necessariamente uma bênção divina explícita.
- source_word: אֶרֶץ
  choice: ó terra
  rationale: Mantém a personificação e o discurso direto ao território político, com tom poético e digno.
- source_word: שֶׁמַּלְכֵּךְ
  choice: quando o seu rei
  rationale: O relativo hebraico poderia ser vertido por “cujo rei”, mas “quando o seu rei” expressa naturalmente a circunstância descrita pela bem-aventurança.
- source_word: בֶּן חוֹרִים
  choice: filho de nobres
  rationale: Preserva de perto a imagem hebraica e o contraste contextual com o rei-servo do versículo anterior. חוֹרִים designa pessoas nobres ou livres.
- source_word: וְשָׂרַיִךְ
  choice: e os seus príncipes
  rationale: “Príncipes” preserva o cenário régio e cortesão; o termo também pode designar autoridades ou governantes.
- source_word: בָּעֵת
  choice: no tempo certo
  rationale: Expressa o momento apropriado, em contraste com o banquete matinal mencionado no versículo anterior.
- source_word: יֹאכֵלוּ
  choice: comem
  rationale: Retém o sentido básico e concreto do verbo hebraico sem ampliá-lo desnecessariamente para “banqueteiam”.
- source_word: בִּגְבוּרָה
  choice: para ganhar forças
  rationale: 'Comunica de modo natural o provável valor final ou purposivo: alimentar-se visando vigor e sustento.'
- source_word: וְלֹא בַשְּׁתִי
  choice: e não para se embriagar
  rationale: No contraste sapiencial, a referência à bebida aponta para consumo indulgente ou embriaguez, não para a mera ação de beber. A nota preserva a formulação mais literal.
