base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/011.yaml
  text: If the snake bites before it is charmed[b][a], there is no advantage for the charmer.
translation:
  language: pt
  text: Se a cobra morde antes de ser encantada[b], não há vantagem para o encantador[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “para o senhor (ou dono) da língua”. A expressão provavelmente se refere a um encantador de cobras, isto é, alguém hábil em pronunciar fórmulas de encantamento.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Se a cobra morde sem encantamento, não há proveito para o senhor da língua”.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Introduz uma situação condicional ou ilustrativa, adequada ao caráter proverbial do versículo.
- source_word: יִשֹּׁךְ
  choice: morde
  rationale: O verbo נשׁך significa normalmente “morder”, especialmente quando o sujeito é uma cobra.
- source_word: הַנָּחָשׁ
  choice: a cobra
  rationale: Designa uma cobra literal na imagem proverbial; “cobra” é corrente e natural em português moderno.
- source_word: בְּלוֹא לָחַשׁ
  choice: antes de ser encantada
  rationale: לחש pode indicar sussurro, encantamento ou fórmula de encantação. No contexto, a formulação comunica naturalmente que a ação do encantador chegou tarde, preservando em nota a leitura mais literal “sem encantamento”.
- source_word: וְאֵין יִתְרוֹן
  choice: não há vantagem
  rationale: יתרון é um termo recorrente em Eclesiastes para vantagem, proveito ou ganho; “vantagem” preserva essa ideia e é clara no contexto.
- source_word: לְבַעַל הַלָּשׁוֹן
  choice: para o encantador
  rationale: A expressão literal “senhor/dono da língua” provavelmente designa alguém hábil em fórmulas faladas, neste caso um encantador de cobras. A tradução contextual evita uma expressão obscura no texto principal.
