  text: לֵ֤ב חָכָם֙ לִֽ/ימִינ֔/וֹ וְ/לֵ֥ב כְּסִ֖יל לִ/שְׂמֹאלֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/002.yaml
  text: A wise man's heart is at his right hand[a], but a fool's heart is at his left.
translation:
  language: pt
  text: O coração do sábio está à sua direita[a], mas o coração do tolo está à sua esquerda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à direita dele... à esquerda dele”. A expressão hebraica usa direita e esquerda como orientações figuradas; pode sugerir discernimento acertado em contraste com mau discernimento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: coração
  rationale: Preserva a imagem hebraica e, neste contexto, designa o centro do pensamento, da disposição e do discernimento, não apenas as emoções.
- source_word: חָכָם
  choice: sábio
  rationale: O adjetivo substantivado masculino singular é vertido de modo direto e natural, mantendo o contraste com “tolo”.
- source_word: לִימִינוֹ
  choice: se inclina para a direita
  rationale: O hebraico indica direção ou orientação. “Se inclina para” torna inteligível a metáfora em português sem explicitar além do texto o seu sentido simbólico.
- source_word: כְּסִיל
  choice: tolo
  rationale: Termo corrente na literatura sapiencial para a pessoa marcada por insensatez moral e intelectual, sem recorrer a um insulto coloquial.
- source_word: לִשְׂמֹאלוֹ
  choice: para a esquerda
  rationale: Mantém o paralelismo espacial e simbólico com “para a direita”.
theological_decisions:
- issue: Adjetivos substantivados masculinos no contraste sapiencial
  choice: “o sábio” e “o tolo”
  alternative: “a pessoa sábia” e “a pessoa tola”
  rationale: As formas hebraicas são masculinas singulares e apresentam figuras representativas. A tradução conserva essa forma sem acrescentar “homem”, que não aparece como substantivo no hebraico.
- issue: Sentido simbólico de direita e esquerda
  choice: Preservar a metáfora no texto e explicar sua provável função em nota
  alternative: Parafrasear como “age com bom senso... age sem juízo”
  rationale: O texto hebraico mantém a oposição figurada e não define expressamente todos os seus matizes; explicitá-los no corpo resolveria uma imagem deliberadamente concisa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A elipse do segundo verbo em “mas o coração do tolo, para a esquerda” reproduz de modo natural o paralelismo conciso do hebraico.
