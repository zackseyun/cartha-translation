base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/003.yaml
  text: Even on the road[a], when the fool walks, his heart lacks sense, and he says to everyone that he is a fool.
translation:
  language: pt
  text: Mesmo quando o tolo anda pelo caminho, lhe falta discernimento e diz a todos que é tolo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e diz a todos: ‘Ele é tolo.’” O hebraico pode indicar que o tolo revela a própria insensatez ou que chama os outros de tolos; a primeira leitura combina melhor com o contexto, em que sua insensatez se torna evidente.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: Até
  rationale: 'Em combinação com a circunstância pública expressa a seguir, dá ênfase: a insensatez se manifesta até numa situação comum como andar pelo caminho.'
- source_word: בַּדֶּרֶךְ
  choice: pelo caminho
  rationale: Preserva a imagem espacial do hebraico e soa natural em português.
- source_word: כשהסכל הֹלֵךְ
  choice: quando anda ... o tolo
  rationale: Entende כְּשֶׁ como conjunção temporal e mantém o sentido comum de הֹלֵךְ, com ordem ajustada à fluência em português.
- source_word: לִבּוֹ חָסֵר
  choice: não tem bom senso
  rationale: O 'coração' hebraico representa aqui a capacidade de pensar e julgar. A formulação comunica o idioma com clareza, sem restringi-lo às emoções.
- source_word: וְאָמַר לַכֹּל
  choice: e diz a todos
  rationale: Mantém a continuação simples e a referência a todas as pessoas diante das quais o tolo se expõe.
- source_word: סָכָל הוּא
  choice: que ele é tolo
  rationale: Mantém o substantivo 'tolo' e toma o pronome como referência ao próprio tolo, leitura contextual plausível segundo a qual ele revela sua insensatez.
theological_decisions:
- issue: Referente de הוּא e força de לַכֹּל na oração final
  choice: O tolo revela a todos que ele próprio é tolo.
  alternative: 'O tolo diz a todos, a respeito de outra pessoa ou de cada pessoa: “Ele é tolo.”'
  rationale: A sintaxe hebraica admite mais de uma relação entre 'a todos' e 'ele é tolo'. A leitura principal se ajusta à ideia contextual de que a conduta do tolo denuncia sua própria falta de bom senso, mas a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A expressão idiomática referente ao coração foi vertida pelo sentido cognitivo de 'bom senso'; a ambiguidade da oração final foi mantida em nota.
