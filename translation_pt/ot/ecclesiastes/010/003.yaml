    issue: «Até quando» para וְגַם
    rationale: Em português moderno, «até quando» tem uso predominantemente interrogativo ou delimitador no tempo; não expressa de modo seguro o ‘mesmo’ enfático do hebraico neste contexto.
  - severity: low
    issue: Ordem da oração inicial
    rationale: A antecipação «Até quando anda pelo caminho» prejudica a legibilidade. Reordenar o sujeito após a conjunção temporal produz uma construção portuguesa idiomática sem alterar o sentido.
  revised_text: Mesmo quando o tolo anda pelo caminho, lhe falta discernimento e diz a todos que é tolo.[a]
