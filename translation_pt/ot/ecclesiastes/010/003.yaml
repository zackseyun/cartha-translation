  source_fidelity: A tradução capta adequadamente a falta de discernimento do tolo e preserva em nota a ambiguidade de סָכָל הוּא. Contudo, «Até quando» normalmente introduz limite temporal ou pergunta temporal em português («até que momento?») e não reproduz aqui o valor enfático-aditivo de וְגַם, ‘mesmo/também’.
  naturalness: A ordem «Até quando anda pelo caminho, o tolo» é pouco natural e inicialmente pode ser entendida como uma pergunta ou uma oração temporal incompleta. «Mesmo quando o tolo anda pelo caminho» é clara, fluente e conserva o quadro público da ação.
  terminology: «Tolo» corresponde bem a סָכָל. «Lhe falta discernimento» comunica naturalmente o valor cognitivo de לִבּוֹ חָסֵר, sem reduzir ‘coração’ ao campo emocional. A nota mantém a leitura alternativa sem tratá-la como certa.
  issues:
