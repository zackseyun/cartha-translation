  text: תְּחִלַּ֥ת דִּבְרֵי פִ֖י/הוּ סִכְל֑וּת וְ/אַחֲרִ֣ית פִּ֔י/הוּ הוֹלֵל֖וּת רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/013.yaml
  text: The beginning of the words of his mouth is foolishness[a], and the end of his speech is evil madness.
translation:
  language: pt
  text: O começo das palavras da sua boca é insensatez, e o fim do seu discurso é loucura perversa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “loucura nociva”. O hebraico repete literalmente “sua boca”, e רָעָה pode significar “má/perversa” ou, em sentido mais amplo, “nociva”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחִלַּת
  choice: o começo de
  rationale: Mantém a construção nominal e estabelece o contraste paralelo com “o fim”.
- source_word: דִּבְרֵי
  choice: as palavras de
  rationale: No contexto, refere-se a palavras faladas, não a assuntos em sentido abstrato.
- source_word: פִּיהוּ
  choice: sua boca / seu discurso
  rationale: Na primeira ocorrência, conserva-se a imagem concreta do hebraico; na segunda, “seu discurso” comunica naturalmente em português o sentido idiomático da repetição de “sua boca”.
- source_word: סִכְלוּת
  choice: insensatez
  rationale: Expressa a falta de sabedoria e preserva o contraste recorrente de Eclesiastes entre sabedoria e insensatez.
- source_word: וְאַחֲרִית
  choice: e o fim de
  rationale: Espelha “o começo de” e pode abranger tanto a parte final quanto o desfecho do discurso.
- source_word: הוֹלֵלוּת
  choice: loucura
  rationale: Neste livro, o termo indica irracionalidade ou desvario e intensifica a “insensatez” da primeira linha.
- source_word: רָעָה
  choice: perversa
  rationale: Preserva a força negativa e potencialmente moral de רָעָה em português natural, sem excluir por nota o sentido mais amplo de algo nocivo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com paralelismo entre “o começo” e “o fim”. A primeira ocorrência de “boca” preserva a imagem hebraica; a segunda é vertida idiomaticamente como “discurso” para evitar uma formulação pouco natural.
