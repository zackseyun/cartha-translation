id: ECC.10.18
reference: Ecclesiastes 10:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בַּ/עֲצַלְתַּ֖יִם יִמַּ֣ךְ הַ/מְּקָרֶ֑ה וּ/בְ/שִׁפְל֥וּת יָדַ֖יִם יִדְלֹ֥ף הַ/בָּֽיִת׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/018.yaml
  text: Through laziness the roof sags[b][a], and through idle hands the house leaks.
translation:
  language: pt
  text: Por causa da preguiça, o telhado cede[a]; por causa das mãos inativas, a casa fica com goteiras[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o teto afunda”. O verbo hebraico pode indicar que algo se torna baixo, verga ou cede, e o termo traduzido como “telhado” também pode se referir à estrutura da cobertura.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente “pela baixeza das mãos”, expressão que indica inércia, desleixo ou negligência.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲצַלְתַּיִם
  choice: Por causa da preguiça
  rationale: A preposição ב pode indicar causa ou meio, e o substantivo expressa preguiça ou indolência. A formulação explicita naturalmente a relação causal em português.
- source_word: יִמַּךְ
  choice: cede
  rationale: O nifal de מוך indica tornar-se baixo, afundar ou vergar. No contexto de uma estrutura negligenciada, “cede” comunica deterioração estrutural sem sugerir necessariamente desabamento completo.
- source_word: הַמְּקָרֶה
  choice: o telhado
  rationale: מְקָרֶה designa a cobertura ou estrutura do teto. “Telhado” é claro e natural, sem restringir o referente especificamente a vigas ou caibros.
- source_word: וּבְשִׁפְלוּת יָדַיִם
  choice: por causa das mãos inativas
  rationale: A expressão significa literalmente “na baixeza das mãos” e representa figuradamente desleixo, inércia ou negligência. “Mãos inativas” preserva a imagem concreta e comunica o sentido idiomático.
- source_word: יִדְלֹף
  choice: fica com goteiras
  rationale: דלף significa pingar ou gotejar. Como a casa é o sujeito, “fica com goteiras” produz português natural e mantém o resultado progressivo da negligência.
- source_word: הַבָּיִת
  choice: a casa
  rationale: É o sentido comum de בַּיִת e preserva a imagem concreta do provérbio.
