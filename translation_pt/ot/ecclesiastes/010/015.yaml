  text: עֲמַ֥ל הַ/כְּסִילִ֖ים תְּיַגְּעֶ֑/נּוּ אֲשֶׁ֥ר לֹֽא יָדַ֖ע לָ/לֶ֥כֶת אֶל עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/015.yaml
  text: The labor of fools wearies them[a], for he does not know how to go to the city.
translation:
  language: pt
  text: O trabalho dos insensatos cansa aquele que não sabe como chegar a uma cidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O esforço dos insensatos os esgota, pois eles não sabem como chegar a uma cidade.” Os sufixos e a oração relativa em hebraico permitem entender a frase em sentido coletivo; o texto principal preserva mais diretamente o sufixo masculino singular, “aquele que não sabe”.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֲמַל
  choice: trabalho
  rationale: O substantivo indica trabalho árduo ou esforço penoso. “Trabalho” conserva a ideia concreta de esforço sem reduzi-la apenas a sofrimento.
- source_word: הַכְּסִילִים
  choice: dos insensatos
  rationale: Na literatura de sabedoria, כְּסִיל designa uma categoria moral e intelectual. “Insensatos” é corrente, digno e evita sugerir mera limitação intelectual.
- source_word: תְּיַגְּעֶנּוּ
  choice: cansa aquele
  rationale: O verbo no piel significa cansar ou esgotar; o sufixo de terceira pessoa masculina singular é preservado em “aquele”, enquanto o verbo concorda com o sujeito singular “trabalho”.
- source_word: אֲשֶׁר לֹא יָדַע
  choice: que não sabe
  rationale: A oração relativa pode ligar-se ao referente masculino singular do sufixo. O presente exprime naturalmente uma incapacidade característica no contexto proverbial.
- source_word: לָלֶכֶת
  choice: como chegar
  rationale: Com ידע e o infinitivo de הלך, a expressão comunica saber como ir ou chegar. “Como chegar” é português natural e mantém o sentido de encontrar o caminho.
- source_word: אֶל עִיר
  choice: à cidade
  rationale: Embora עִיר esteja sem artigo no hebraico, “chegar à cidade” é a formulação proverbial mais idiomática em português e não identifica necessariamente uma cidade específica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção singular do hebraico foi mantida no texto principal, e a interpretação coletiva foi registrada em nota. “À cidade” conserva a força proverbial e soa natural em português.
