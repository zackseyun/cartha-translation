base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/004.yaml
  text: If the ruler’s anger rises against you[a], do not leave your place[d][c][b], for calmness lays great offenses to rest.
translation:
  language: pt
  text: Se a ira do governante se levantar contra você[a], não abandone o seu lugar[b], pois a calma faz com que grandes ofensas sejam deixadas de lado[d][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o espírito do governante” ou “o temperamento do governante”. A palavra hebraica רוּחַ significa literalmente “espírito” ou “vento” e, aqui, provavelmente se refere a uma disposição irada.
    reason: lexical_alternative
  - marker: b
    text: Isto é, o lugar ou a posição que você ocupa; também se pode traduzir por “seu posto”.
    reason: lexical_alternative
  - marker: c
    text: Ou “uma atitude apaziguadora”, “brandura” ou “cura”. O substantivo hebraico מַרְפֵּא transmite a ideia de algo que cura ou acalma.
    reason: lexical_alternative
  - marker: d
    text: Ou “grandes pecados” ou “faltas graves”.
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחַ
  choice: ira
  rationale: Embora o sentido básico seja “espírito” ou “vento”, neste contexto a palavra designa a disposição irada do governante que se levanta contra alguém. “Ira” comunica esse valor idiomático sem apagar a alternativa literal, registrada em nota.
- source_word: הַמּוֹשֵׁל
  choice: o governante
  rationale: O particípio designa quem governa ou exerce autoridade. “Governante” é amplo, direto e adequado ao contexto.
- source_word: תַּעֲלֶה עָלֶיךָ
  choice: se levantar contra você
  rationale: Preserva a imagem verbal de “subir/levantar-se” e o sentido hostil da preposição neste contexto.
- source_word: מְקוֹמְךָ
  choice: o seu lugar
  rationale: É a correspondência direta do hebraico e conserva a possível referência tanto ao lugar ocupado quanto à posição ou função da pessoa.
- source_word: אַל תַּנַּח
  choice: não abandone
  rationale: No contexto, a forma verbal expressa deixar ou abandonar. “Não abandone” combina naturalmente com “o seu lugar” e transmite a exortação à firmeza.
- source_word: מַרְפֵּא
  choice: calma
  rationale: O substantivo pode significar cura, remédio ou algo que acalma. Aqui descreve uma reação apaziguadora diante da ira de uma autoridade.
- source_word: יַנִּיחַ
  choice: faz cessar
  rationale: A forma causativa transmite a ideia de fazer repousar, deixar de lado ou apaziguar. “Faz cessar” expressa naturalmente o efeito da calma em português.
- source_word: חֲטָאִים גְּדוֹלִים
  choice: grandes ofensas
  rationale: A expressão pode significar “grandes pecados”, mas, no contexto de conflito com uma autoridade, também pode indicar faltas ou ofensas graves. “Grandes ofensas” preserva o peso moral e a aplicação relacional.
