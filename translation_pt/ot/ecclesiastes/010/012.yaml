  text: The words of the mouth of a wise man are gracious[a], but the lips of a fool swallow him up.
translation:
  language: pt
  text: As palavras da boca do sábio são cheias de graça[a], mas os lábios do tolo o engolem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “As palavras da boca do sábio trazem favor”, entendendo חֵן mais concretamente como “favor” ou “graça”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי פִי חָכָם
  choice: As palavras da boca do sábio
  rationale: Preserva a cadeia construta e as imagens concretas de “palavras” e “boca”, usando uma formulação natural e digna em português. O masculino singular de חָכָם é mantido em “o sábio”, com sentido representativo próprio da literatura sapiencial.
- source_word: חֵן
  choice: são cheias de graça
  rationale: חֵן é um substantivo predicativo que pode indicar graça, encanto ou favor. “Cheias de graça” comunica de modo idiomático que as palavras se caracterizam pela graça, sem eliminar a possível nuance de que produzem favor.
- source_word: שִׂפְתוֹת כְּסִיל
  choice: os lábios do tolo
  rationale: Mantém a imagem poética dos “lábios” em paralelo com a “boca” do primeiro hemistíquio e traduz כְּסִיל pelo termo sapiencial corrente “tolo”.
- source_word: תְּבַלְּעֶנּוּ
  choice: o devoram
  rationale: O verbo בלע significa engolir ou tragar e, neste contexto metafórico, descreve como a própria fala do tolo o arruína. “Devoram” preserva a força da imagem e concorda naturalmente com “lábios” em português.
