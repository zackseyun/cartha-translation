  - severity: low
    issue: A nota atual repete uma interpretação muito próxima do texto, sem esclarecer a imagem potencialmente opaca de “o ferro”.
    rationale: No contexto, “o ferro” provavelmente designa por metonímia uma lâmina ou ferramenta de ferro; essa é a informação útil para o leitor.
  revised_text: Se o ferro[a] estiver sem fio e não se afiar o seu gume, será preciso empregar mais força; mas a vantagem da sabedoria é trazer êxito.
