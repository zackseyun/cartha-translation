  source_fidelity: 'A primeira imagem e sua consequência são bem compreendidas: o hebraico descreve o ferro/lâmina embotado e a necessidade de empregar mais força se o gume não for preparado. A formulação final do rascunho, porém, torna יתרון (“vantagem”) um objeto que a sabedoria “traz” e acrescenta “bom” a “resultado”. A construção mais próxima e clara é que a vantagem da sabedoria consiste em produzir êxito.'
  naturalness: “Está sem fio” é natural, mas o subjuntivo em uma condição proverbial (“estiver”) flui melhor. “Fazer mais força” é compreensível, mas “empregar mais força” tem registro mais cuidado e idiomático. “Traz a vantagem do bom resultado” soa pesado e pouco natural em português.
  terminology: “Ferro”, “gume”, “força”, “sabedoria” e “êxito” preservam adequadamente a imagem e os termos-chave, sem especificar indevidamente qual ferramenta está em vista. A nota esclarece a metonímia de “ferro” e mantém a ambiguidade material da expressão.
