source:
  edition: WLC
  text: אִם קֵהָ֣ה הַ/בַּרְזֶ֗ל וְ/הוּא֙ לֹא פָנִ֣ים קִלְקַ֔ל וַ/חֲיָלִ֖ים יְגַבֵּ֑ר וְ/יִתְר֥וֹן הכשיר חָכְמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/010.yaml
  text: If the iron is dull and one has not sharpened its edge[a], then he must use more strength[b]; but wisdom brings success.
translation:
  language: pt
  text: Se o ferro[a] estiver sem fio e não se afiar o seu gume, será preciso empregar mais força; mas a vantagem da sabedoria é trazer êxito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O ferro” provavelmente se refere, por metonímia, a uma lâmina ou ferramenta de ferro, e não ao metal em abstrato.
    reason: cultural_note
lexical_decisions:
- source_word: קֵהָה
  choice: está sem fio
  rationale: Expressa de modo natural em português a perda de capacidade de corte indicada pelo hebraico.
- source_word: הַבַּרְזֶל
  choice: o ferro
  rationale: Mantém a metonímia hebraica, na qual o ferro provavelmente designa a lâmina ou ferramenta feita desse metal.
- source_word: פָנִים קִלְקַל
  choice: afia o seu gume
  rationale: Embora פָנִים signifique literalmente 'face', no contexto é a superfície cortante; קלקל indica aqui preparar ou pôr em condição adequada, isto é, afiar.
- source_word: וַחֲיָלִים יְגַבֵּר
  choice: é preciso fazer mais força
  rationale: 'Comunica a consequência prática: uma ferramenta sem fio exige força maior, sem impor ao sujeito uma identidade não expressa claramente no hebraico.'
- source_word: וְיִתְרוֹן הכשיר חָכְמָה
  choice: mas a sabedoria traz a vantagem do bom resultado
  rationale: Preserva tanto a noção explícita de vantagem em יִתְרוֹן quanto o sentido de tornar apto, eficaz ou bem-sucedido em הכשיר, em português compreensível.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com construção impessoal para refletir o caráter proverbial. A expressão “o ferro” conserva a imagem hebraica e sugere, pelo contexto, uma lâmina ou ferramenta de ferro.
