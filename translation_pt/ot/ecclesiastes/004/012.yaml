base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/012.yaml
  text: And if someone overpowers one[a], two will stand against him; and a threefold cord is not quickly broken.
translation:
  language: pt
  text: E, se alguém dominar uma pessoa que está só, duas resistirão a ele; e um cordão triplo[a] não se rompe depressa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um cordão de três fios”. O hebraico descreve um cordão tornado triplo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: E, se
  rationale: Mantém a força conectiva de ו e introduz naturalmente a condição que dá continuidade ao pensamento anterior.
- source_word: יִתְקְפוֹ הָאֶחָד
  choice: alguém dominar uma pessoa sozinha
  rationale: תקף expressa ser forte contra alguém ou dominá-lo; הָאֶחָד retoma a pessoa isolada do contexto. A formulação explicita o sujeito indefinido sem restringir o sentido a um ataque físico.
- source_word: הַשְּׁנַיִם יַעַמְדוּ נֶגְדּוֹ
  choice: duas resistirão a ele
  rationale: Preserva o contraste proverbial entre uma e duas pessoas. 'Resistirão' comunica de modo natural a imagem de permanecer firme contra alguém.
- source_word: וְהַחוּט הַמְשֻׁלָּשׁ
  choice: e um cordão triplo
  rationale: חוּט designa fio ou cordão, e o particípio מְשֻׁלָּשׁ descreve algo tornado triplo. 'Cordão triplo' é conciso e natural, sem decidir no texto principal se a imagem especifica três fios entrelaçados.
- source_word: לֹא בִמְהֵרָה יִנָּתֵק
  choice: não se rompe depressa
  rationale: Mantém o valor temporal de בִמְהֵרָה, 'depressa', e traduz o nifal de נתק como o rompimento de um cordão.
