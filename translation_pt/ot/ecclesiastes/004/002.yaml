id: ECC.4.2
reference: Ecclesiastes 4:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/שַׁבֵּ֧חַ אֲנִ֛י אֶת הַ/מֵּתִ֖ים שֶׁ/כְּבָ֣ר מֵ֑תוּ מִן הַ֣/חַיִּ֔ים אֲשֶׁ֛ר הֵ֥מָּה חַיִּ֖ים עֲדֶֽנָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/002.yaml
  text: And I considered the dead[a], who have already died, more fortunate than the living, who are still alive.
translation:
  language: pt
  text: E considerei os mortos[a], que já morreram, mais afortunados do que os vivos, que ainda estão vivos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E louvei os mortos ... mais do que os vivos”. O verbo hebraico pode ser traduzido mais literalmente por “louvei” ou “elogiei”; aqui, ele expressa a avaliação do Pregador de que os mortos estão em situação melhor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבֵּחַ
  choice: E considerei ... mais afortunados
  rationale: O piel de שׁבח significa normalmente “louvar” ou “elogiar”. Neste contexto, porém, expressa a avaliação do Pregador de que os mortos estão em situação melhor do que os vivos oprimidos. A formulação comunica essa força comparativa em português natural, sem sugerir elogio moral aos mortos.
- source_word: אֲנִי
  choice: considerei (primeira pessoa do singular)
  rationale: A flexão verbal portuguesa já expressa a primeira pessoa. O pronome independente “eu” não foi acrescentado, pois sua inclusão soaria marcada sem necessidade; a avaliação pessoal do Pregador permanece clara.
- source_word: אֶת הַמֵּתִים
  choice: os mortos
  rationale: O particípio substantivado designa os mortos como classe; “os mortos” é direto, digno e natural.
- source_word: שֶׁכְּבָר מֵתוּ
  choice: que já morreram
  rationale: “Já” preserva o valor temporal de כבר, e “morreram” apresenta a ação como concluída, mantendo também a repetição enfática do hebraico.
- source_word: מִן הַחַיִּים
  choice: mais afortunados do que os vivos
  rationale: A preposição מן tem força comparativa depois do verbo de avaliação. “Mais afortunados do que” explicita essa relação e descreve uma vantagem de condição, não uma superioridade moral.
- source_word: הַחַיִּים
  choice: os vivos
  rationale: A forma substantivada refere-se aos vivos como classe; esta é a equivalência portuguesa mais concisa e natural.
- source_word: אֲשֶׁר הֵמָּה חַיִּים
  choice: que ... estão vivos
  rationale: A oração relativa hebraica repete e enfatiza a condição presente dos vivos. A tradução conserva essa repetição deliberada.
- source_word: עֲדֶנָה
  choice: ainda
  rationale: O advérbio significa “ainda”, “até agora” ou “por enquanto”; “ainda” é claro e idiomático neste contexto.
theological_decisions:
- issue: Comparação existencial entre os mortos e os vivos
  choice: O versículo apresenta a avaliação observacional do Pregador de que, diante da opressão, os mortos estão em situação mais afortunada do que os vivos.
  alternative: Entender a frase como doutrina sobre o estado bem-aventurado dos mortos após a morte, ou reduzi-la a uma hipérbole sem verdadeira força comparativa.
  rationale: O contexto imediato trata da opressão “debaixo do sol” (4:1–3). A tradução preserva a forte comparação do texto sem transformá-la numa afirmação sistemática sobre a vida após a morte nem neutralizar sua tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição “os mortos, que já morreram” e “os vivos, que ainda estão vivos” foi mantida por refletir a ênfase deliberada do hebraico. “Mais afortunados” evita tanto a rigidez de uma tradução palavra por palavra quanto uma afirmação indevida de bem-aventurança pós-morte.
