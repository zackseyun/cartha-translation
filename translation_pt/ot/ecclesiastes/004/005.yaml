  text: The fool folds his hands and eats his own flesh[a][b].
translation:
  language: pt
  text: O insensato cruza as mãos[a] e come a própria carne[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “junta” ou “entrelaça as mãos”; a imagem é de inatividade.
    reason: lexical_alternative
  - marker: b
    text: Provavelmente, uma imagem de autodestruição causada pela insensatez ou pela preguiça.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכְּסִיל
  choice: o insensato
  rationale: Em Eclesiastes e na literatura sapiencial, כְּסִיל designa alguém cuja insensatez é moral e prática, não apenas falta de inteligência. “O insensato” é natural, digno e mantém o tom proverbial.
- source_word: חֹבֵק
  choice: cruza
  rationale: O verbo significa literalmente “abraça” ou “estreita”. Com “mãos”, descreve o gesto de juntá-las ou cruzá-las em inatividade; “cruza as mãos” comunica naturalmente essa imagem em português, sem inserir a explicação no texto principal.
- source_word: יָדָיו
  choice: as mãos
  rationale: יָדָיו significa literalmente “suas mãos”. O artigo definido com a construção corporal é idiomático em português, e o sujeito já deixa clara a posse.
- source_word: וְאֹכֵל
  choice: e come
  rationale: O particípio hebraico prossegue a descrição proverbial. O presente simples preserva bem o valor geral ou gnômico.
- source_word: בְּשָׂרוֹ
  choice: a própria carne
  rationale: בָּשָׂר significa “carne”. A expressão mantém a metáfora corporal vívida; “própria” torna claro o valor possessivo e reflexivo sem substituir a imagem por uma interpretação.
theological_decisions:
- issue: Sentido metafórico de “come a própria carne”
  choice: Manter no texto a metáfora literal como imagem de insensatez autodestrutiva.
  alternative: Traduzir interpretativamente por “destrói a si mesmo”, “arruína a própria vida” ou “consome a si mesmo”.
  rationale: O hebraico apresenta uma metáfora corporal forte e não uma explicação abstrata. Preservá-la evita restringir o sentido a uma única forma de dano, enquanto a nota esclarece sua provável força contextual.
translation_notes:
  register: Português moderno, claro e proverbial, com ampla legibilidade brasileira. “Insensato” conserva a dimensão moral e prática do termo sapiencial; a metáfora concreta foi preservada, e as alternativas explicativas ficaram nas notas.
