lexical_decisions:
- source_word: טוֹב ... מִן
  choice: Melhor é ... do que
  rationale: A construção comparativa hebraica pede uma formulação comparativa natural em português.
- source_word: יֶלֶד
  choice: jovem
  rationale: Designa uma pessoa jovem e mantém o contraste proverbial com o rei velho sem especificar demais a idade.
- source_word: מִסְכֵּן
  choice: pobre
  rationale: Expressa de modo claro e corrente a pobreza ou condição social humilde do jovem.
- source_word: וְחָכָם
  choice: mas sábio
  rationale: Embora a conjunção seja normalmente aditiva, o valor concessivo é natural no contraste entre pobreza e sabedoria.
- source_word: מֶלֶךְ זָקֵן וּכְסִיל
  choice: rei velho e insensato
  rationale: Preserva os qualificativos do hebraico; 'insensato' comunica a falta moral e prática de sabedoria própria da literatura sapiencial.
- source_word: אֲשֶׁר לֹא יָדַע ... עוֹד
  choice: que já não sabe
  rationale: Com a negação, עוֹד indica que essa capacidade ou disposição já não existe.
- source_word: לְהִזָּהֵר
  choice: aceitar advertência
  rationale: Neste contexto, a forma verbal aponta para deixar-se advertir ou corrigir, não apenas para agir com cautela.
