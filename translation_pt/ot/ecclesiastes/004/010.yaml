  text: כִּ֣י אִם יִפֹּ֔לוּ הָ/אֶחָ֖ד יָקִ֣ים אֶת חֲבֵר֑/וֹ וְ/אִ֣י/ל֗/וֹ הָֽ/אֶחָד֙ שֶׁ/יִּפּ֔וֹל וְ/אֵ֥ין שֵׁנִ֖י לַ/הֲקִימֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/010.yaml
  text: For if they fall[a], one will lift up his companion[b]; but woe to the one who falls when there is not a second to lift him up.
translation:
  language: pt
  text: Pois, se caírem, um levantará seu companheiro; mas ai daquele que cair sem haver outro[a] para levantá-lo!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “um segundo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Pois, se
  rationale: Introduz uma condição que explica a afirmação anterior sobre a vantagem de duas pessoas sobre uma só.
- source_word: יִפֹּלוּ
  choice: caírem
  rationale: Mantém a imagem concreta da queda e concorda com o plural hebraico, retomado depois no singular.
- source_word: הָאֶחָד
  choice: um
  rationale: No contexto de duas pessoas, expressa naturalmente que uma delas socorre a outra.
- source_word: יָקִים
  choice: levantará
  rationale: O hifil de קום indica fazer alguém se levantar; “levantará” preserva a imagem física e permite repetir o mesmo verbo no fim do versículo.
- source_word: אֶת חֲבֵרוֹ
  choice: seu companheiro
  rationale: חָבֵר designa a pessoa associada a outra; “companheiro” é amplo e não exige a intimidade emocional que “amigo” pode sugerir.
- source_word: וְאִילוֹ
  choice: mas ai daquele
  rationale: Reproduz a interjeição de lamento ou advertência e explicita de modo natural em português que ela recai sobre a pessoa solitária.
- source_word: הָאֶחָד שֶׁיִּפּוֹל
  choice: daquele que cair
  rationale: Identifica a pessoa que cai sozinha, em contraste com o par mencionado na primeira metade.
- source_word: וְאֵין שֵׁנִי
  choice: sem haver outro[a]
  rationale: Expressa em português natural a circunstância de não existir uma segunda pessoa, enquanto a nota preserva a formulação numérica literal.
- source_word: לַהֲקִימוֹ
  choice: para levantá-lo
  rationale: Repete “levantar”, como no hebraico, e mantém o pronome singular referente à pessoa que caiu.
