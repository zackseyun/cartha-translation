id: ECC.4.17
reference: Ecclesiastes 4:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שְׁמֹ֣ר רגלי/ך כַּ/אֲשֶׁ֤ר תֵּלֵךְ֙ אֶל בֵּ֣ית הָ/אֱלֹהִ֔ים וְ/קָר֣וֹב לִ/שְׁמֹ֔עַ מִ/תֵּ֥ת הַ/כְּסִילִ֖ים זָ֑בַח כִּֽי אֵינָ֥/ם יוֹדְעִ֖ים לַ/עֲשׂ֥וֹת רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/017.yaml
  text: Guard your steps when you go to the house of God[a], and draw near to listen rather than to offer the sacrifice of fools[c][b], for they do not know that they are doing evil.
translation:
  language: pt
  text: Guarde os seus passos[a] quando for à casa de Deus e aproxime-se para escutar[b], em vez de oferecer o sacrifício dos insensatos, pois eles não percebem que estão fazendo o mal.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Guarde os seus pés”.
    reason: lexical_alternative
  - marker: b
    text: Ou “para ouvir”.
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico diz literalmente: “pois eles não sabem fazer o mal”, provavelmente no sentido de que não percebem que sua ação é má.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמֹר
  choice: Guarde
  rationale: O imperativo pede vigilância cuidadosa; “guarde” mantém o tom de advertência e combina naturalmente com “os seus passos”.
- source_word: רגליך
  choice: os seus passos
  rationale: O sentido literal é “os seus pés”, mas, no contexto, a imagem aponta para a maneira de se aproximar e de se conduzir. “Passos” preserva a metáfora em português natural.
- source_word: כַּאֲשֶׁר תֵּלֵךְ
  choice: quando for
  rationale: 'A leitura temporal é a mais natural: a advertência se aplica ao momento de ir ao lugar de culto.'
- source_word: בֵּית הָאֱלֹהִים
  choice: a casa de Deus
  rationale: Mantém a expressão hebraica sem restringi-la interpretativamente a “templo”.
- source_word: וְקָרוֹב
  choice: e aproxime-se
  rationale: A forma hebraica é concisa, mas no encadeamento da exortação indica a aproximação reverente. A construção portuguesa explicita esse valor sem eliminar a comparação seguinte.
- source_word: לִשְׁמֹעַ
  choice: para escutar
  rationale: “Escutar” comunica atenção deliberada, apropriada ao contexto sapiencial, embora “ouvir” também seja possível.
- source_word: מִתֵּת
  choice: em vez de oferecer
  rationale: Diante de זבח, נתן tem o sentido contextual de apresentar ou oferecer um sacrifício; “em vez de” expressa naturalmente o contraste.
- source_word: הַכְּסִילִים
  choice: os insensatos
  rationale: No vocabulário sapiencial, o termo descreve pessoas moral e espiritualmente obtusas, não apenas pouco inteligentes.
- source_word: זָבַח
  choice: o sacrifício
  rationale: 'A forma singular funciona como expressão de classe: o tipo de sacrifício oferecido pelos insensatos.'
- source_word: כִּי אֵינָם יוֹדְעִים
  choice: pois eles não percebem
  rationale: Neste contexto, ידע indica falta de consciência moral; “não percebem” comunica isso com clareza sem sugerir mera ausência de informação.
- source_word: לַעֲשׂוֹת רָע
  choice: que estão fazendo o mal
  rationale: A expressão hebraica é comprimida, literalmente “fazer o mal”. A formulação escolhida indica que eles não reconhecem o caráter mau do próprio ato.
theological_decisions:
- issue: Natureza do contraste entre escutar e sacrificar no culto
  choice: O versículo dá prioridade à escuta atenta diante de Deus e censura o sacrifício irrefletido dos insensatos, sem rejeitar todo sacrifício.
  alternative: Entender o texto como rejeição absoluta do sacrifício ou apenas como comparação entre técnicas rituais melhores e piores.
  rationale: O contraste recai sobre escutar versus oferecer “o sacrifício dos insensatos”, e a cláusula final denuncia a falta de percepção moral deles. Assim, o alvo é o culto vazio e insensato, não o sacrifício em si.
- issue: Sentido da cláusula final לַעֲשׂוֹת רָע
  choice: Eles não percebem que sua própria ação é má.
  alternative: Eles não sabem como praticar o mal, ou praticam o mal deliberadamente.
  rationale: A sintaxe hebraica admite formulação mais literal e tensa, mas o contexto de culto insensato favorece a falta de consciência quanto ao mal cometido. A nota preserva a forma literal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Insensatos” preserva o peso moral do vocabulário sapiencial; “casa de Deus” conserva a expressão concreta do hebraico. As notas registram as alternativas lexicais e a concisão ambígua da cláusula final.
