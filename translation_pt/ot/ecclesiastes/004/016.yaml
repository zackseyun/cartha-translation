  text: אֵֽין קֵ֣ץ לְ/כָל הָ/עָ֗ם לְ/כֹ֤ל אֲשֶׁר הָיָה֙ לִ/פְנֵי/הֶ֔ם גַּ֥ם הָ/אַחֲרוֹנִ֖ים לֹ֣א יִשְׂמְחוּ ב֑/וֹ כִּֽי גַם זֶ֥ה הֶ֖בֶל וְ/רַעְי֥וֹן רֽוּחַ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/016.yaml
  text: There was no end to all the people[a], to all who were before them; yet those who come later will not rejoice in him[c][b]. For this too is vanity and a chasing after wind.
translation:
  language: pt
  text: Não havia fim no número de todo o povo, de todos os que estavam antes deles[a]. Contudo, os que vierem depois não se alegrarão com ele[b]. Pois também isso é vaidade[c] e correr atrás do vento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não há fim no número de todo o povo, de todos os que estavam antes deles”. A sintaxe hebraica desta oração é difícil e pode ser entendida de mais de uma maneira; também se pode relacionar a frase aos muitos sobre os quais ele governava.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “não ficarão contentes com ele” ou “não se alegrarão por causa dele”.'
    reason: lexical_alternative
  - marker: c
    text: Hebraico hebel, termo-chave em Eclesiastes para aquilo que é passageiro como um sopro, inconsistente ou frustrante.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין קֵץ
  choice: não havia fim
  rationale: A negação existencial com “fim” expressa ausência de limite ou uma quantidade incontável. O passado se ajusta à descrição retrospectiva do contexto, embora o hebraico também permita uma formulação de valor mais geral.
- source_word: לְכָל הָעָם
  choice: para todo o povo
  rationale: A preposição ל marca aqui relação ou referência depois de “não havia fim”. “Para” mantém algo da estrutura hebraica sem transformar a expressão em uma paráfrase explicativa.
- source_word: לְכֹל אֲשֶׁר הָיָה לִפְנֵיהֶם
  choice: para todos os que tinham estado antes deles
  rationale: A construção hebraica é compacta e sintaticamente difícil. Esta formulação comunica a leitura temporal mais provável sem identificar de maneira indevida os referentes dos pronomes; a nota registra a incerteza.
- source_word: הָאַחֲרוֹנִים
  choice: os que vierem depois
  rationale: O termo designa pessoas posteriores ou uma geração subsequente. O futuro do subjuntivo em português combina naturalmente com o imperfeito hebraico de sentido futuro ou geral.
- source_word: לֹא יִשְׂמְחוּ בוֹ
  choice: não se alegrarão com ele
  rationale: O verbo significa alegrar-se ou ficar contente, e בּוֹ provavelmente aponta para o jovem governante do contexto. “Com ele” é natural em português e deixa aberta a nuance exata da preposição.
- source_word: הֶבֶל
  choice: vaidade
  rationale: Termo temático de Eclesiastes para aquilo que é passageiro, inconsistente ou frustrante. “Vaidade” preserva a ressonância tradicional, enquanto a nota esclarece que o sentido não se limita ao orgulho pessoal.
- source_word: רַעְיוֹן רוּחַ
  choice: correr atrás do vento
  rationale: A expressão retrata um esforço impossível e frustrante. “Correr atrás do vento” conserva a metáfora e é clara no português atual.
theological_decisions:
- issue: Referentes dos pronomes e sintaxe da primeira oração
  choice: Manter “deles” e “ele” sem identificar explicitamente seus referentes, adotando na primeira oração uma leitura temporal.
  alternative: Entender a frase como “todos aqueles diante dos quais ele esteve” ou explicitar que se trata do jovem que se tornou rei e do povo que ele governou.
  rationale: O hebraico de Eclesiastes 4:16 é comprimido e admite mais de uma análise. A tradução oferece uma leitura coerente, mas a nota preserva a ambiguidade real e evita impor uma interpretação histórica ou doutrinária específica.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com legibilidade brasileira. A redação mantém os pronomes do hebraico e evita explicitar além do texto quem são “eles” e “ele”. “Vaidade” conserva o vocabulário temático tradicional, acompanhado de esclarecimento lexical.
