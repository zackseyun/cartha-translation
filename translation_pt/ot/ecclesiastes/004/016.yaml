  terminology: «Vaidade» e «correr atrás do vento» mantêm, respectivamente, a terminologia tradicional de hebel e a metáfora de רַעְיוֹן רוּחַ. As notas preservam apropriadamente as alternativas sem impor uma identificação dos referentes.
