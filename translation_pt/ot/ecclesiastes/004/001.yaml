  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/שַׁ֣בְתִּֽי אֲנִ֗י וָ/אֶרְאֶה֙ אֶת כָּל הָ֣/עֲשֻׁקִ֔ים אֲשֶׁ֥ר נַעֲשִׂ֖ים תַּ֣חַת הַ/שָּׁ֑מֶשׁ וְ/הִנֵּ֣ה דִּמְעַ֣ת הָ/עֲשֻׁקִ֗ים וְ/אֵ֤ין לָ/הֶם֙ מְנַחֵ֔ם וּ/מִ/יַּ֤ד עֹֽשְׁקֵי/הֶם֙ כֹּ֔חַ וְ/אֵ֥ין לָ/הֶ֖ם מְנַחֵֽם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/001.yaml
  text: 'Then I turned and saw all the oppressions that are done under the sun: and behold[a], the tears of the oppressed, and they had no comforter. Power was in the hand of their oppressors[b], and they had no comforter.'
translation:
  language: pt
  text: Então voltei minha atenção e vi todas as opressões praticadas debaixo do sol. Lá estavam[a] as lágrimas dos oprimidos, e eles não tinham quem os consolasse. O poder estava nas mãos de seus opressores[b], e eles não tinham quem os consolasse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos os oprimidos que estão debaixo do sol”. O particípio passivo hebraico pode referir-se tanto a pessoas oprimidas como, por extensão, a atos de opressão.'
    reason: alternative_reading
  - marker: b
    text: 'Literalmente: “e da mão de seus opressores, poder”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתִּי
  choice: Então voltei minha atenção
  rationale: שׁוב introduz aqui uma nova observação, não necessariamente um retorno físico. A formulação mantém a ideia de retomada e soa natural em português.
- source_word: וָאֶרְאֶה
  choice: e vi
  rationale: ראה indica observação direta e integra a fórmula recorrente do narrador em Eclesiastes.
- source_word: כָּל הָעֲשֻׁקִים
  choice: todas as opressões
  rationale: Embora a forma seja um particípio passivo que também pode designar pessoas oprimidas, a expressão seguinte, 'praticadas debaixo do sol', favorece aqui os atos ou casos de opressão.
- source_word: אֲשֶׁר נַעֲשִׂים
  choice: praticadas
  rationale: O particípio passivo descreve ações em curso ou recorrentes; 'praticadas' é idiomático em português no contexto de atos de opressão.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: debaixo do sol
  rationale: Preserva literalmente a expressão característica e recorrente de Eclesiastes.
- source_word: וְהִנֵּה
  choice: Vi
  rationale: הִנֵּה chama vividamente a atenção para a cena. A repetição de 'Vi' transmite essa mudança de foco em português atual sem o arcaísmo de 'eis'.
- source_word: דִּמְעַת הָעֲשֻׁקִים
  choice: as lágrimas dos oprimidos
  rationale: O singular hebraico tem valor coletivo; o plural 'lágrimas' é natural em português e expressa o sofrimento visível das vítimas.
- source_word: וְאֵין לָהֶם מְנַחֵם
  choice: e eles não tinham quem os consolasse
  rationale: A construção existencial afirma que não havia pessoa alguma para lhes dar consolo. A formulação é clara e preserva a repetição enfática.
- source_word: וּמִיַּד עֹשְׁקֵיהֶם כֹּחַ
  choice: O poder estava nas mãos de seus opressores
  rationale: A redação preserva a imagem hebraica da mão como esfera de posse ou controle e destaca o desequilíbrio de poder.
- source_word: עֹשְׁקֵיהֶם
  choice: seus opressores
  rationale: O particípio ativo designa aqueles que exploram ou oprimem, mantendo a ligação lexical com 'opressões' e 'oprimidos'.
- source_word: מְנַחֵם
  choice: quem os consolasse
  rationale: O particípio substantivado significa alguém que consola. Esta forma é mais corrente em português do que o substantivo 'consolador' neste contexto.
theological_decisions:
- issue: Referente de הָעֲשֻׁקִים na oração inicial
  choice: “todas as opressões” no texto principal
  alternative: “todos os oprimidos”
  rationale: A forma hebraica pode designar pessoas oprimidas, mas sua associação com 'que são praticadas' favorece atos ou casos de opressão. A alternativa legítima é preservada em nota.
- issue: Tempo das orações existenciais
  choice: 'Passado narrativo: “não tinham”'
  alternative: 'Presente geral: “não têm”'
  rationale: A observação é relatada a partir dos verbos 'voltei' e 'vi'. O passado é natural em português sem negar que a situação possa ter alcance geral.
- issue: Repetição da ausência de consolo
  choice: Repetição integral de “eles não tinham quem os consolasse”
  alternative: Omissão ou variação estilística na segunda ocorrência
  rationale: 'A repetição hebraica é retoricamente importante: enquadra a referência ao poder dos opressores e intensifica o desamparo das vítimas.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Evitou-se o arcaísmo 'eis' sem eliminar a força de atenção de הִנֵּה. A expressão característica 'debaixo do sol' e a repetição final foram preservadas.
