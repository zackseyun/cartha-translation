  yaml_path: translation/ot/ecclesiastes/004/006.yaml
  text: Better is a handful with rest than two handfuls with toil and a striving after wind[a][b].
translation:
  language: pt
  text: Melhor é ter uma mão cheia com descanso[a] do que duas mãos cheias de trabalho penoso e de correr atrás do vento.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com tranquilidade”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “e correr/perseguir o vento”; tradicionalmente, “e aflição de espírito”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Melhor é
  rationale: O adjetivo avaliativo introduz uma comparação de caráter proverbial; em português, a cópula expressa torna a construção natural e digna.
- source_word: מְלֹא כַף
  choice: uma mão cheia
  rationale: A expressão indica literalmente o conteúdo de uma mão ou palma. “Uma mão cheia” preserva a imagem corporal e prepara o contraste com as duas mãos cheias.
- source_word: נָחַת
  choice: descanso
  rationale: O substantivo denota repouso, sossego ou tranquilidade; “descanso” é claro e contrasta naturalmente com o trabalho penoso.
- source_word: מִמְלֹא חָפְנַיִם
  choice: do que as duas mãos cheias
  rationale: A preposição marca a comparação, e o dual חָפְנַיִם retrata as duas mãos em concha cheias; a formulação mantém o contraste numérico e imagético.
- source_word: עָמָל
  choice: trabalho penoso
  rationale: Em Eclesiastes, o termo frequentemente une as ideias de trabalho e esforço desgastante; “trabalho penoso” comunica ambas sem reduzir o sentido a mero sofrimento.
- source_word: וּרְעוּת רוּחַ
  choice: e correr atrás do vento
  rationale: A expressão recorrente descreve uma busca inútil e inalcançável. “Correr atrás do vento” conserva a metáfora concreta e soa natural no português contemporâneo.
