translation_notes:
  register: Português moderno, claro e proverbial, com ampla legibilidade brasileira. A simetria entre “uma mão cheia” e “as duas mãos cheias” preserva a imagem hebraica; as notas registram alternativas lexicais sem resolver indevidamente a metáfora.
