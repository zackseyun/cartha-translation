  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יֵ֣שׁ אֶחָד֩ וְ/אֵ֨ין שֵׁנִ֜י גַּ֣ם בֵּ֧ן וָ/אָ֣ח אֵֽין ל֗/וֹ וְ/אֵ֥ין קֵץ֙ לְ/כָל עֲמָל֔/וֹ גַּם עיני/ו לֹא תִשְׂבַּ֣ע עֹ֑שֶׁר וּ/לְ/מִ֣י אֲנִ֣י עָמֵ֗ל וּ/מְחַסֵּ֤ר אֶת נַפְשִׁ/י֙ מִ/טּוֹבָ֔ה גַּם זֶ֥ה הֶ֛בֶל וְ/עִנְיַ֥ן רָ֖ע הֽוּא־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/008.yaml
  text: There is one man[a], and he has no second; he has neither son nor brother, and there is no end to all his labor[c][b]. Yet his eyes are not satisfied with wealth, and he says, “And for whom am I laboring and depriving myself of good?” This too is vanity and a grievous business.
translation:
  language: pt
  text: 'Há um homem sozinho[a], sem outro; não tem filho nem irmão, e não há fim para todo o trabalho que faz. Seus olhos também não se fartam de riquezas: “E para quem estou trabalhando e me privando do bem[c]?” Também isto é vaidade[b] e uma ocupação penosa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Há um só, e não há um segundo.” A expressão descreve alguém sem companheiro ou pessoa próxima.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico também pode significar “vapor” ou “futilidade”, evocando algo passageiro e difícil de apreender.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “privando minha alma do bem”; aqui “alma” se refere à própria pessoa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ אֶחָד וְאֵין שֵׁנִי
  choice: Há um homem sozinho, sem ninguém ao seu lado
  rationale: O conjunto descreve um indivíduo solitário. “Sem ninguém ao seu lado” comunica naturalmente a imagem literal de não haver um “segundo”, sem reduzi-la apenas à falta de um sócio ou colega.
- source_word: גַּם בֵּן וָאָח אֵין לוֹ
  choice: não tem filho nem irmão
  rationale: Mantém os dois parentes masculinos especificados no hebraico, sem generalizá-los como “família”.
- source_word: וְאֵין קֵץ לְכָל עֲמָלוֹ
  choice: não há fim para todo o seu trabalho
  rationale: “Trabalho” é claro e permite conservar a ligação lexical com “estou trabalhando”; o contexto transmite seu caráter fatigante.
- source_word: גַּם עֵינָיו לֹא תִשְׂבַּע עֹשֶׁר
  choice: Seus olhos também não se fartam de riquezas
  rationale: Conserva גַּם como “também”, a imagem dos olhos e o sentido de desejo que nunca chega à saciedade.
- source_word: וּלְמִי אֲנִי עָמֵל
  choice: Para quem estou trabalhando
  rationale: Preserva a pergunta sobre quem se beneficiará do trabalho incessante. O ו inicial não precisa ser reproduzido mecanicamente em português dentro da pergunta.
- source_word: וּמְחַסֵּר אֶת נַפְשִׁי מִטּוֹבָה
  choice: e me privando do que é bom
  rationale: נֶפֶשׁ designa aqui a própria pessoa; “me privando” é idiomático e evita impor uma distinção técnica entre corpo e alma. “Do que é bom” mantém amplo o objeto da privação.
- source_word: גַּם זֶה הֶבֶל
  choice: Também isso é ilusão
  rationale: הֶבֶל evoca vapor, fugacidade, absurdo e inutilidade. “Ilusão” funciona em português moderno e conserva a ideia de algo que não entrega o que promete, sem encerrar toda a amplitude do termo.
- source_word: וְעִנְיַן רָע הוּא
  choice: e uma ocupação penosa
  rationale: עִנְיָן indica tarefa, atividade ou ocupação; רָע qualifica-a como má, aflitiva ou penosa. A formulação é natural e não transforma o termo em “negócio” comercial.
theological_decisions:
- issue: Sentido antropológico de נַפְשִׁי
  choice: me
  alternative: minha alma
  rationale: Neste contexto sapiencial, נֶפֶשׁ refere-se idiomaticamente à própria pessoa. A tradução reflexiva evita introduzir uma antropologia técnica que o verso não exige.
- issue: Amplitude metafórica de הֶבֶל
  choice: ilusão
  alternative: vapor; vaidade; futilidade
  rationale: Nenhum equivalente português isolado reproduz todas as dimensões do hebraico. “Ilusão” é inteligível e tematicamente apropriado, enquanto a nota preserva a metáfora e as demais nuances.
- issue: Sujeito implícito da pergunta
  choice: apresentar diretamente a pergunta, sem acrescentar “ele diz”
  alternative: 'e ele diz: “Para quem...”'
  rationale: O hebraico passa diretamente à fala em primeira pessoa e não contém um verbo de dizer. A pontuação torna a mudança de voz compreensível sem adição explicativa.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. A tradução conserva a imagem dos olhos insaciáveis, evita acrescentar um verbo de fala ausente no hebraico e mantém a ambiguidade temática de הֶבֶל por meio de nota.
