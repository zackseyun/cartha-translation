base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/011.yaml
  text: Again[a], if two lie down together, they keep warm; but how can one keep warm alone?
translation:
  language: pt
  text: Além disso, se dois se deitam juntos, eles se mantêm aquecidos[a]; mas como alguém poderá se aquecer sozinho?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ficam aquecidos”; literalmente, “há calor para eles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Também
  rationale: Introduz mais uma observação de apoio na sequência e preserva de modo natural o valor aditivo do hebraico.
- source_word: אִם
  choice: se
  rationale: Mantém diretamente a construção condicional ou situacional do hebraico.
- source_word: יִשְׁכְּבוּ שְׁנַיִם
  choice: se dois se deitam juntos
  rationale: שׁכב significa deitar-se e pode implicar dormir; a formulação conserva o sentido físico relevante ao aquecimento. “Juntos” explicita com naturalidade a relação já indicada pelo contexto.
- source_word: וְחַם לָהֶם
  choice: eles se aquecem
  rationale: A expressão hebraica diz literalmente que há calor para eles. Esta formulação comunica o resultado de modo idiomático sem especificar além do texto se ficam ou se mantêm aquecidos.
- source_word: וּלְאֶחָד
  choice: mas ... alguém sozinho
  rationale: O waw introduz aqui o contraste com os dois. “Alguém sozinho” torna explícito em português o sentido substantivo de “um” diante de “dois”.
- source_word: אֵיךְ יֵחָם
  choice: como ... poderá se aquecer?
  rationale: Preserva a pergunta retórica e o sentido de tornar-se ou ficar aquecido, em português natural.
