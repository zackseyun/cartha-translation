  text: טוֹבִ֥ים הַ/שְּׁנַ֖יִם מִן הָ/אֶחָ֑ד אֲשֶׁ֧ר יֵשׁ לָ/הֶ֛ם שָׂכָ֥ר ט֖וֹב בַּ/עֲמָלָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/009.yaml
  text: Two are better than one[a], because they have a good reward for their labor.
translation:
  language: pt
  text: Dois são melhores do que um, porque têm boa recompensa pelo seu trabalho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois obtêm bom retorno de seu trabalho”.'
    reason: Alternativa lexical para שָׂכָר, que pode designar retorno, proveito ou resultado, e para a relação de בַּעֲמָלָם com o trabalho.
lexical_decisions:
- source_word: טוֹבִים הַשְּׁנַיִם מִן הָאֶחָד
  choice: Melhor é serem dois do que um
  rationale: A construção com מִן expressa comparação. Em português, a formulação proverbial no singular, “Melhor é serem dois”, é natural e preserva o contraste genérico entre dois e um.
- source_word: אֲשֶׁר
  choice: porque
  rationale: Introduz a razão da afirmação anterior; “porque” comunica claramente o valor causal.
- source_word: יֵשׁ לָהֶם
  choice: têm
  rationale: A construção existencial com ל indica posse e se expressa naturalmente em português com o verbo “ter”.
- source_word: שָׂכָר טוֹב
  choice: boa recompensa
  rationale: שָׂכָר pode indicar recompensa, ganho ou retorno resultante do trabalho; “boa recompensa” mantém a amplitude do termo sem limitá-lo a salário.
- source_word: בַּעֲמָלָם
  choice: pelo seu trabalho
  rationale: עָמָל designa trabalho ou labuta, e a preposição בְּ aqui pode exprimir a relação entre o esforço e sua recompensa. “Pelo seu trabalho” é claro e idiomático.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e proverbial, com leitura natural no Brasil e compreensão internacional. A inversão “Melhor é” conserva o tom sapiencial e digno sem soar excessivamente arcaica.
