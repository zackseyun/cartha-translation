  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי מִ/בֵּ֥ית הָ/סוּרִ֖ים יָצָ֣א לִ/מְלֹ֑ךְ כִּ֛י גַּ֥ם בְּ/מַלְכוּת֖/וֹ נוֹלַ֥ד רָֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/014.yaml
  text: For he came out from the house of prisoners to reign[b][a], though even in his kingdom he had been born poor.
translation:
  language: pt
  text: Pois ele saiu da casa dos presos[a] para reinar, embora, mesmo em seu reino[b], tivesse nascido pobre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da prisão”; em hebraico, literalmente, “da casa dos presos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “durante seu reinado”; o termo hebraico pode significar “reino”, “realeza” ou “reinado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֵּית הָסוּרִים
  choice: da casa dos presos
  rationale: Reproduz de perto a expressão hebraica, literalmente “da casa dos presos”, sem deixar de ser compreensível em português; a forma mais idiomática “da prisão” é registrada em nota.
- source_word: יָצָא
  choice: saiu
  rationale: Verbo comum para sair; expressa diretamente a passagem do confinamento ao governo.
- source_word: לִמְלֹךְ
  choice: para reinar
  rationale: Preserva o sentido régio do infinitivo de מלך, sem explicitar além do texto a ideia de “tornar-se rei”.
- source_word: גַּם
  choice: mesmo
  rationale: Mantém a força enfática do termo dentro da construção concessiva.
- source_word: בְּמַלְכוּתוֹ
  choice: em seu reino
  rationale: Tradução próxima da forma hebraica, que também pode designar o reinado ou a condição régia; a alternativa temporal é preservada em nota.
- source_word: נוֹלַד
  choice: tivesse nascido
  rationale: O mais-que-perfeito do subjuntivo é natural depois de “embora” e situa o nascimento antes de ele passar a reinar.
- source_word: רָשׁ
  choice: pobre
  rationale: Equivalente direto e corrente para a condição de pobreza indicada pelo hebraico.
- source_word: כִּי ... כִּי
  choice: Pois ... embora
  rationale: Entende o primeiro כִּי como explicativo e o segundo como concessivo, refletindo a relação contextual sem repetir mecanicamente a mesma conjunção.
