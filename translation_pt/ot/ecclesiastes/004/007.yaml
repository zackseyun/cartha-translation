  text: Then I turned and saw vanity under the sun:[a][b]
translation:
  language: pt
  text: Então me voltei e vi vaidade debaixo do sol:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Novamente me voltei e vi vaidade debaixo do sol.”'
    reason: lexical_alternative
  - marker: b
    text: O hebraico hével é um termo-chave em Eclesiastes; conforme o contexto, também pode ser traduzido por “vapor”, “sopro” ou “futilidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתִּי
  choice: Então me voltei
  rationale: O verbo שׁוב significa literalmente “voltar” ou “tornar”. Aqui introduz uma nova observação. “Então me voltei” preserva a imagem concreta e soa natural em português; “Novamente me voltei” também é possível, embora “novamente” não esteja expresso de modo inequívoco.
- source_word: אֲנִי
  choice: '[expresso na forma verbal em primeira pessoa]'
  rationale: O pronome independente dá alguma ênfase ao sujeito no hebraico. Em português, a primeira pessoa já está indicada por “me voltei” e “vi”; acrescentar “eu” seria possível, mas menos fluente neste contexto breve.
- source_word: וָאֶרְאֶה
  choice: e vi
  rationale: ראה é o verbo comum para “ver”. A tradução direta mantém a simplicidade do original sem interpretar o ato como “observar” ou “examinar”.
- source_word: הֶבֶל
  choice: vaidade
  rationale: הבל é um termo-chave de Eclesiastes e pode evocar vapor, sopro, transitoriedade, futilidade ou vaidade. “Vaidade” conserva o termo temático tradicional e sua amplitude, sem reduzir o sentido a “falta de significado”.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: debaixo do sol
  rationale: Expressão recorrente em Eclesiastes para a esfera da vida terrena. “Debaixo do sol” é idiomático, reconhecível e adequado para uso consistente no livro.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem da frase acompanha de perto o hebraico, enquanto “me voltei” comunica naturalmente a retomada do olhar. Mantém-se “vaidade” como termo temático amplo e tradicional, com nota para sua imagem e extensão semântica.
