source:
  edition: WLC
  text: וְ/טוֹב֙ מִ/שְּׁנֵי/הֶ֔ם אֵ֥ת אֲשֶׁר עֲדֶ֖ן לֹ֣א הָיָ֑ה אֲשֶׁ֤ר לֹֽא רָאָה֙ אֶת הַ/מַּעֲשֶׂ֣ה הָ/רָ֔ע אֲשֶׁ֥ר נַעֲשָׂ֖ה תַּ֥חַת הַ/שָּֽׁמֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/003.yaml
  text: But better than both of them is the one who has not yet been[a], who has not seen the evil deed that is done under the sun.
translation:
  language: pt
  text: Mas melhor do que ambos é aquele que ainda não existiu[a], que não viu a má ação que se pratica debaixo do sol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais interpretativo, “aquele que ainda não nasceu”. O hebraico diz mais literalmente “aquele que ainda não existiu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְטוֹב
  choice: Mas melhor
  rationale: טוֹב tem valor comparativo no contexto, e “mas” expressa naturalmente o avanço contrastivo em relação aos vivos e aos mortos mencionados no versículo anterior.
- source_word: מִשְּׁנֵיהֶם
  choice: do que ambos
  rationale: Mantém a comparação explícita com os dois grupos anteriormente mencionados.
- source_word: אֵת אֲשֶׁר
  choice: aquele que
  rationale: A oração relativa funciona como substantivo e se refere, no singular, a uma terceira pessoa em comparação com os dois grupos.
- source_word: עֲדֶן לֹא הָיָה
  choice: ainda não existiu
  rationale: Preserva a formulação relativamente aberta do hebraico, literalmente ligada a “ser/existir”, sem inserir “nasceu” no texto principal.
- source_word: לֹא רָאָה
  choice: não viu
  rationale: Tradução direta e natural do perfeito hebraico, descrevendo a ausência de experiência do mal observado.
- source_word: הַמַּעֲשֶׂה הָרָע
  choice: a má ação
  rationale: מַעֲשֶׂה designa obra, feito ou ação; “má ação” comunica o ato de injustiça de modo claro e preserva o substantivo concreto.
- source_word: אֲשֶׁר נַעֲשָׂה
  choice: que se pratica
  rationale: A construção impessoal com “se” transmite de modo idiomático a ideia passiva e habitual do que é feito.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: debaixo do sol
  rationale: Mantém a fórmula recorrente e reconhecível de Eclesiastes em português.
theological_decisions:
- issue: Identidade daquele que “ainda não existiu”
  choice: Manter no texto a expressão geral “ainda não existiu”.
  alternative: “Ainda não nasceu.”
  rationale: O contexto aponta para quem ainda não nasceu, mas o hebraico usa o verbo amplo הָיָה, “ser/existir”. A tradução mantém essa abertura e registra a leitura contextual em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem da frase conserva a força comparativa do hebraico; “debaixo do sol” mantém a fórmula característica do livro.
