  text: וְ/רָאִ֨יתִֽי אֲנִ֜י אֶת כָּל עָמָ֗ל וְ/אֵת֙ כָּל כִּשְׁר֣וֹן הַֽ/מַּעֲשֶׂ֔ה כִּ֛י הִ֥יא קִנְאַת אִ֖ישׁ מֵ/רֵעֵ֑/הוּ גַּם זֶ֥ה הֶ֖בֶל וּ/רְע֥וּת רֽוּחַ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/004.yaml
  text: And I saw that all labor and all skillful work come from a man's envy of his neighbor[c][b][a]. This too is vanity and a chasing after wind.
translation:
  language: pt
  text: E vi que todo trabalho árduo e toda habilidade no trabalho[a] vêm da inveja de um homem em relação ao seu próximo.[b] Também isso é vaidade e correr atrás do vento.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todo sucesso no trabalho”; o hebraico כִּשְׁרוֹן pode indicar habilidade, competência ou o sucesso resultante delas.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “a inveja de um homem em relação ao seu próximo”. O singular masculino provavelmente tem sentido representativo.'
    reason: lexical_alternative
  - marker: c
    text: Ou “esforçar-se para perseguir o vento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָמָל
  choice: trabalho árduo
  rationale: Em Eclesiastes, o termo costuma indicar trabalho penoso ou esforço desgastante. “Trabalho árduo” comunica essa carga sem tornar o texto excessivamente interpretativo.
- source_word: כִּשְׁרוֹן הַמַּעֲשֶׂה
  choice: habilidade no trabalho
  rationale: כִּשְׁרוֹן pode designar habilidade, competência ou o êxito produzido por elas. A tradução principal preserva a ideia de perícia, e a nota registra a alternativa ligada ao sucesso.
- source_word: כִּי הִיא
  choice: vêm da
  rationale: A oração hebraica é nominal, literalmente próxima de “pois isso é”. Em português, “vêm da” expressa de modo natural a relação apresentada entre o trabalho e a inveja, sem eliminar a tensão do enunciado.
- source_word: קִנְאַת
  choice: inveja
  rationale: No contexto de comparação e rivalidade entre pessoas, “inveja” é mais precisa que “ciúme” e mantém o teor negativo provável.
- source_word: אִישׁ מֵרֵעֵהוּ
  choice: de um homem em relação ao seu próximo
  rationale: Mantém o singular masculino representativo do hebraico e a relação interpessoal, sem substituir o referente por uma formulação coletiva.
- source_word: הֶבֶל
  choice: vaidade
  rationale: “Vaidade” preserva o termo temático tradicional de Eclesiastes e sua amplitude semântica, que abrange transitoriedade, futilidade e falta de substância.
- source_word: רְעוּת רוּחַ
  choice: correr atrás do vento
  rationale: A expressão portuguesa é natural, conserva a imagem concreta e comunica uma busca inútil. A nota registra a alternativa “esforçar-se pelo vento”.
theological_decisions: []
