base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/015.yaml
  text: I saw all the living[a], those walking under the sun, with the second youth who would stand in his place.
translation:
  language: pt
  text: Vi todos os viventes, os que andam debaixo do sol, com o segundo jovem[a], que se levantaria em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “segunda criança” ou “segundo rapaz”. O hebraico pode referir-se a um sucessor que toma o lugar do governante anterior.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי
  choice: Vi
  rationale: O qal perfeito na primeira pessoa introduz a observação do Pregador; “Vi” é direto e natural.
- source_word: כָּל הַחַיִּים
  choice: todos os que vivem
  rationale: Expressa o sentido pessoal de “todos os viventes” em português atual, sem perder a abrangência do hebraico.
- source_word: הַמְהַלְּכִים
  choice: os que andam
  rationale: Mantém a força participial e a imagem concreta de pessoas que se movimentam no mundo.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: debaixo do sol
  rationale: Preserva a fórmula recorrente de Eclesiastes e sua perspectiva sobre a vida terrena.
- source_word: עִם
  choice: ao lado de
  rationale: Comunica associação com o jovem sem decidir se se trata de apoio político, acompanhamento ou simples presença.
- source_word: הַיֶּלֶד הַשֵּׁנִי
  choice: o segundo jovem
  rationale: Mantém o ordinal literal e traduz יֶלֶד de modo compatível com alguém que poderá assumir uma posição de governo; a nota registra a ambiguidade.
- source_word: אֲשֶׁר יַעֲמֹד
  choice: que ocuparia
  rationale: No contexto de sucessão, עמד indica apresentar-se ou assumir uma posição; o condicional português ajusta-se à perspectiva narrativa do enunciado.
- source_word: תַּחְתָּיו
  choice: o lugar do rei
  rationale: A expressão idiomática significa ocupar o lugar dele. O antecedente é esclarecido como “o rei” para evitar a leitura equivocada de que o jovem ocuparia o próprio lugar, embora o título seja contextual e não esteja repetido no hebraico.
theological_decisions:
- issue: Identidade e função do “segundo jovem”
  choice: Manter “segundo jovem” no texto e indicar na nota a possível referência a um sucessor.
  alternative: Traduzir diretamente como “jovem sucessor”.
  rationale: O hebraico emprega o ordinal “segundo” e não um termo explícito para sucessor; preservar essa forma evita resolver uma referência textual debatida.
translation_notes:
  register: Português moderno, claro e digno, com a expressão característica “debaixo do sol”. A formulação conserva a ambiguidade de “segundo jovem”, enquanto a nota oferece alternativas lexicais e a provável leitura sucessória.
