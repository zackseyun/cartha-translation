id: ECC.3.19
reference: Ecclesiastes 3:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּי֩ מִקְרֶ֨ה בְֽנֵי הָ/אָדָ֜ם וּ/מִקְרֶ֣ה הַ/בְּהֵמָ֗ה וּ/מִקְרֶ֤ה אֶחָד֙ לָ/הֶ֔ם כְּ/מ֥וֹת זֶה֙ כֵּ֣ן מ֣וֹת זֶ֔ה וְ/ר֥וּחַ אֶחָ֖ד לַ/כֹּ֑ל וּ/מוֹתַ֨ר הָ/אָדָ֤ם מִן הַ/בְּהֵמָה֙ אָ֔יִן כִּ֥י הַ/כֹּ֖ל הָֽבֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/019.yaml
  text: 'For the fate of the sons of man and the fate of the beast is one fate for them: as this one dies[a], so dies that one, and one breath is for all. Man has no advantage over the beast, for all is vapor.'
translation:
  language: pt
  text: 'Pois o destino dos filhos do homem é o mesmo que o dos animais: um só destino lhes cabe. Assim como morre um, morre o outro; e todos têm o mesmo sopro[a]. O homem não tem vantagem sobre os animais, pois tudo é vapor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos têm o mesmo espírito”. A palavra hebraica רוּחַ pode significar “sopro”, “vento” ou “espírito”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְרֶה
  choice: destino
  rationale: Expressa aquilo que sobrevém a alguém, aqui especialmente o desfecho comum da morte, sem eliminar o tom existencial do texto.
- source_word: בְנֵי הָאָדָם
  choice: os filhos do homem
  rationale: Preserva a forma masculina representativa do hebraico e o estilo retórico de Qohelet, embora a referência seja à humanidade.
- source_word: הַבְּהֵמָה
  choice: os animais
  rationale: O singular hebraico é coletivo. Em português atual, o plural genérico comunica naturalmente a classe animal em contraste com o ser humano.
- source_word: וּמִקְרֶה אֶחָד לָהֶם
  choice: é o mesmo para ambos
  rationale: Mantém a ideia de um único destino compartilhado, evitando a formulação pouco natural 'um destino para eles' em português.
- source_word: כְּמוֹת זֶה כֵּן מוֹת זֶה
  choice: assim como morre um, morre o outro
  rationale: Reproduz o paralelismo equilibrado dos demonstrativos hebraicos em linguagem portuguesa natural.
- source_word: רוּחַ
  choice: sopro
  rationale: No contexto da mortalidade comum a humanos e animais, 'sopro' representa adequadamente o fôlego vital, sem impor uma conclusão sobre a constituição espiritual.
- source_word: אֶחָד לַכֹּל
  choice: todos têm o mesmo sopro
  rationale: Comunica com clareza a unidade do sopro e seu alcance universal, preservando a afirmação de que humanos e animais o compartilham.
- source_word: מוֹתַר
  choice: vantagem
  rationale: Expressa o ganho ou superioridade negados ao homem dentro da comparação imediata com os animais.
- source_word: הָאָדָם
  choice: o homem
  rationale: Preserva o singular representativo do hebraico em contraste com a classe dos animais.
- source_word: אָיִן
  choice: não tem
  rationale: Forma idiomática em português para negar a existência de vantagem.
- source_word: הַכֹּל
  choice: tudo
  rationale: Conserva a amplitude e a força proverbial da declaração.
- source_word: הָבֶל
  choice: vapor
  rationale: Preserva a metáfora concreta de algo fugaz, insubstancial e impossível de reter, em vez de reduzi-la apenas a 'vaidade' ou 'inutilidade'.
theological_decisions:
- issue: Sentido de רוּחַ na comparação entre seres humanos e animais
  choice: sopro
  alternative: espírito
  rationale: O contexto imediato ressalta a mortalidade compartilhada. 'Sopro' mantém essa perspectiva observacional e a nota registra a alternativa legítima sem resolver indevidamente a questão antropológica.
- issue: Forma de traduzir אָדָם / בְנֵי הָאָדָם
  choice: os filhos do homem ... o homem
  alternative: os seres humanos ... a humanidade
  rationale: A escolha preserva a linguagem masculina representativa e a forma retórica do hebraico, sem negar que a referência seja genérica.
- issue: Alcance da negação de vantagem humana
  choice: O homem não tem vantagem sobre os animais
  alternative: A humanidade não é superior aos animais em sentido absoluto
  rationale: A tradução conserva a afirmação concisa do verso em seu contexto de mortalidade comum e não a amplia para uma negação absoluta de toda distinção entre humanos e animais.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo foi mantido sem sacrificar a naturalidade. 'Vapor' conserva a imagem característica de הבל, e a nota em 'sopro' preserva a ambiguidade lexical e teológica.
