  text: לַ/כֹּ֖ל זְמָ֑ן וְ/עֵ֥ת לְ/כָל חֵ֖פֶץ תַּ֥חַת הַ/שָּׁמָֽיִם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/001.yaml
  text: For everything there is a season[a], and a time for every matter under the heavens.
translation:
  language: pt
  text: Para tudo há um tempo determinado, e há um tempo para cada atividade debaixo dos céus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para cada assunto” ou “para cada propósito”. A palavra hebraica também pode indicar uma atividade, questão ou propósito.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַכֹּל
  choice: para tudo
  rationale: Expressa de modo natural e abrangente o alcance de לְ mais כֹּל.
- source_word: זְמָן
  choice: tempo determinado
  rationale: Distingue זְמָן do עֵת seguinte e comunica a ideia de um tempo fixado ou apropriado sem recorrer ao sentido climático de “estação”.
- source_word: וְעֵת
  choice: e há um tempo
  rationale: עֵת designa tempo ou ocasião; a repetição de “há” produz uma frase clara em português e explicita a construção elíptica do paralelismo hebraico.
- source_word: לְכָל
  choice: para cada
  rationale: Preserva o sentido distributivo diante do substantivo singular.
- source_word: חֵפֶץ
  choice: atividade
  rationale: No contexto da enumeração de 3.2–8, “atividade” abrange ações e acontecimentos humanos sem impor a ideia teleológica mais forte de “propósito”.
- source_word: תַּחַת הַשָּׁמָיִם
  choice: debaixo dos céus
  rationale: Mantém a expressão característica de Eclesiastes e o plural formal do hebraico em linguagem digna e compreensível.
theological_decisions:
- issue: Se חֵפֶץ deve ser traduzido de modo a afirmar explicitamente um propósito providencial para cada acontecimento
  choice: atividade
  alternative: propósito
  rationale: “Atividade” preserva a amplitude do termo no contexto e evita resolver no próprio substantivo a tensão teológica que deve emergir do conjunto da passagem.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Tempo determinado” evita a ambiguidade de “estação” e conserva a distinção entre os dois termos hebraicos para tempo; “debaixo dos céus” mantém o tom literário e a forma plural do original.
