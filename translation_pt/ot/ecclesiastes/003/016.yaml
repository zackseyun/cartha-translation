  terminology: «Debaixo do sol» é a formulação bíblica portuguesa estabelecida e inteligível. «Justiça», «retidão» e «maldade» são escolhas semanticamente adequadas e não introduzem interpretação doutrinária. A nota explica de modo suficiente a alternativa contextual para צֶדֶק.
