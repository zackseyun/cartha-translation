  source_fidelity: O texto reproduz com precisão a observação adicional de Qohelet, a fórmula «debaixo do sol», os dois âmbitos paralelos e a repetição enfática de «havia maldade». «Justiça» para מִשְׁפָּט e «retidão» para צֶדֶק preservam adequadamente a diferenciação lexical hebraica. A interpretação abstrata de הָרָשַׁע como «maldade», em paralelismo com הָרֶשַׁע, é defensável e corresponde à linha adotada na trilha de auditoria inglesa.
