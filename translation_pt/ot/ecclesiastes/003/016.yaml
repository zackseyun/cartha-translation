  text: וְ/ע֥וֹד רָאִ֖יתִי תַּ֣חַת הַ/שָּׁ֑מֶשׁ מְק֤וֹם הַ/מִּשְׁפָּט֙ שָׁ֣מָּ/ה הָ/רֶ֔שַׁע וּ/מְק֥וֹם הַ/צֶּ֖דֶק שָׁ֥מָּ/ה הָ/רָֽשַׁע׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/016.yaml
  text: And I also saw under the sun that in the place of justice[a], there was wickedness, and in the place of righteousness, there was wickedness.
translation:
  language: pt
  text: Também vi debaixo do sol que, no lugar da justiça, havia maldade; e, no lugar da retidão, havia maldade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no lugar da justiça”; o hebraico emprega aqui uma palavra diferente (צֶדֶק) da usada na expressão anterior (מִשְׁפָּט), embora os sentidos se sobreponham.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹד
  choice: Também
  rationale: Expressa de modo natural a força aditiva da observação, sem sugerir necessariamente repetição.
- source_word: רָאִיתִי
  choice: vi
  rationale: Mantém o tom concreto e pessoal do relato de observação de Qohelet.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: debaixo do sol
  rationale: É uma formulação corrente e reconhecível em português para a expressão característica de Eclesiastes.
- source_word: מְקוֹם הַמִּשְׁפָּט
  choice: lugar da justiça
  rationale: Preserva tanto a ideia do âmbito em que a justiça deveria ser administrada quanto seu sentido moral, sem restringir a expressão a um tribunal específico.
- source_word: שָׁמָּה
  choice: havia
  rationale: Transmite naturalmente em português o valor existencial e locativo de 'ali' no contexto.
- source_word: הָרֶשַׁע / הָרָשַׁע
  choice: maldade
  rationale: O paralelismo favorece o sentido abstrato nas duas ocorrências. 'Maldade' é claro e corrente, abrangendo a perversidade e a injustiça presentes no contexto judicial.
- source_word: מְקוֹם הַצֶּדֶק
  choice: lugar da retidão
  rationale: Mantém a distinção lexical em relação a מִשְׁפָּט e expressa o âmbito moral daquilo que é reto, sem excluir o sentido contextual de justiça.
theological_decisions:
- issue: Relação entre צֶדֶק e מִשְׁפָּט
  choice: retidão para צֶדֶק e justiça para מִשְׁפָּט
  alternative: justiça em ambas as expressões
  rationale: Os termos hebraicos têm sentidos sobrepostos, mas não são idênticos. A tradução escolhida preserva a variação e a tensão retórica do original; a nota registra a alternativa contextual legítima.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “havia maldade” foi mantida para reproduzir a ênfase e o paralelismo do hebraico.
