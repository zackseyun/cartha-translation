  text: tempo de amar e tempo de odiar; tempo de guerra e tempo de paz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵת
  choice: tempo
  rationale: עֵת pode indicar um momento ou período; «tempo» preserva com naturalidade a cadência repetida do poema.
- source_word: לֶאֱהֹב
  choice: amar
  rationale: O infinitivo de אָהֵב expressa diretamente a ação de amar.
- source_word: לִשְׂנֹא
  choice: odiar
  rationale: שָׂנֵא significa normalmente «odiar». A tradução direta preserva o forte contraste poético, sem atenuá-lo interpretativamente.
- source_word: מִלְחָמָה
  choice: guerra
  rationale: מִלְחָמָה designa guerra ou conflito armado; «guerra» é a equivalência mais clara neste contraste.
- source_word: שָׁלוֹם
  choice: paz
  rationale: Embora שָׁלוֹם também possa significar bem-estar ou integridade, o contraste direto com guerra favorece «paz».
theological_decisions:
- issue: Força moral de «odiar» no contraste sapiencial
  choice: Manter «odiar» no texto principal, sem suavização.
  alternative: Traduzir como «deixar de amar» ou «opor-se».
  rationale: O versículo enumera tempos ou circunstâncias da vida, não formula isoladamente uma ordem moral irrestrita para odiar. A antítese incisiva do hebraico deve ser preservada, sem resolver no texto a tensão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com formulação concisa. A omissão do artigo antes de «tempo» mantém uma cadência poética natural e corresponde à estrutura hebraica. Não se acrescentam notas, pois as alternativas lexicais não são necessárias para compreender este versículo isolado.
