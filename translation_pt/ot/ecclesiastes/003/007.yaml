  text: a time to tear[a], and a time to sew; a time to keep silent, and a time to speak[b];
translation:
  language: pt
  text: tempo de rasgar[a] e tempo de costurar; tempo de ficar em silêncio[b] e tempo de falar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “rasgar” pode aludir ao ato de rasgar as roupas como sinal de tristeza, choque ou luto, embora o objeto não seja declarado no hebraico.
    reason: cultural_note
  - marker: b
    text: Ou “tempo de ficar calado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵת
  choice: tempo
  rationale: עֵת indica um momento ou período apropriado. “Tempo” preserva a cadência repetida do poema e soa natural em português.
- source_word: לִקְרוֹעַ
  choice: rasgar
  rationale: קרע significa “rasgar”, muitas vezes em referência a roupas. A tradução mantém a possível alusão cultural sem explicitar um objeto que o hebraico não declara.
- source_word: לִתְפּוֹר
  choice: costurar
  rationale: תפר significa “costurar”. Esta opção direta preserva o contraste conciso com “rasgar”; “remendar” acrescentaria uma finalidade não expressa no texto.
- source_word: לַחֲשׁוֹת
  choice: ficar calado
  rationale: חשׁה significa estar ou permanecer em silêncio. “Ficar calado” é corrente e compreensível, mantendo a ideia de não falar sem tornar explícita uma intenção que o verbo, isoladamente, não exige.
- source_word: לְדַבֵּר
  choice: falar
  rationale: דבר é o verbo comum para “falar”. A escolha é ampla, natural e forma um contraste claro com “ficar calado”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura paralela e a repetição de “tempo” foram mantidas. O artigo foi omitido, como é natural na sequência poética em português e coerente com o contexto imediato.
