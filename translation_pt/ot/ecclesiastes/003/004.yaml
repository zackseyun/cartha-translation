  text: A time to weep[a], and a time to laugh; a time to mourn[b], and a time to dance.
translation:
  language: pt
  text: tempo de chorar[a] e tempo de rir; tempo de lamentar[b] e tempo de dançar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ocasião”, aqui e nas demais ocorrências de “tempo” no versículo.
