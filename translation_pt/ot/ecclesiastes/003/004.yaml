lexical_decisions:
- source_word: עֵת
  choice: tempo
  rationale: Denota tempo ou ocasião. “Tempo” é a forma mais direta e natural em português e preserva o padrão poético repetido do contexto.
- source_word: לִבְכּוֹת
  choice: chorar
  rationale: O infinitivo de בכה significa chorar. A escolha é corrente, digna e contrasta naturalmente com “rir”.
- source_word: לִשְׂחוֹק
  choice: rir
  rationale: שׂחק tem aqui o sentido direto de rir, formando a antítese mais clara com “chorar”.
- source_word: סְפוֹד
  choice: prantear
  rationale: ספד designa lamentar ou guardar luto, muitas vezes em contexto fúnebre. “Prantear” preserva essa especificidade sem tornar explícito um rito que o verso não detalha.
- source_word: רְקוֹד
  choice: dançar
  rationale: רקד significa dançar; a forma escolhida mantém a sequência verbal e o contraste com “prantear”.
