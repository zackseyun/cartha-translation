base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/010.yaml
  text: I have seen the task that God has given to the sons of man to be occupied with[a].
translation:
  language: pt
  text: Vi a tarefa que Deus deu aos filhos dos homens, para que se ocupem com ela[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que sejam afligidos por ela” ou “para que labutem nela”. A expressão hebraica é difícil e pode enfatizar tanto o ocupar-se com a tarefa quanto o ser sobrecarregado por ela.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי
  choice: Vi
  rationale: O perfeito qal na primeira pessoa singular relata uma observação feita pelo sábio. O pretérito perfeito é a forma mais natural e direta em português neste contexto reflexivo.
- source_word: הָעִנְיָן
  choice: a tarefa
  rationale: Em Eclesiastes, עִנְיָן designa uma atividade, ocupação ou encargo atribuído aos seres humanos. “Tarefa” é clara e mantém tanto a ideia de atividade quanto a possibilidade de peso.
- source_word: אֲשֶׁר נָתַן
  choice: que Deus deu
  rationale: A oração relativa identifica a tarefa observada. O pretérito perfeito traduz naturalmente o perfeito hebraico e apresenta a atribuição feita por Deus.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: É a tradução padrão neste contexto, em que o termo se refere ao Deus único.
- source_word: לִבְנֵי הָאָדָם
  choice: aos filhos dos homens
  rationale: Preserva a forma masculina e representativa da expressão hebraica, que se refere coletivamente à humanidade, e mantém uma formulação reconhecível em português bíblico.
- source_word: לַעֲנוֹת בּוֹ
  choice: para que se ocupem com ela
  rationale: A expressão difícil pode indicar ocupar-se com algo, trabalhar nisso ou ser afligido por isso. A redação principal comunica envolvimento com a tarefa sem eliminar sua possível conotação penosa; as alternativas ficam registradas em nota.
theological_decisions:
- issue: Sentido coletivo de לִבְנֵי הָאָדָם
  choice: aos filhos dos homens
  alternative: à humanidade; aos seres humanos
  rationale: A expressão hebraica é formalmente masculina, mas possui alcance representativo e coletivo. A tradução conserva o idioma da fonte sem restringir o referente apenas aos homens do sexo masculino.
- issue: Ambiguidade de לַעֲנוֹת בּוֹ
  choice: para que se ocupem com ela
  alternative: para que sejam afligidos por ela; para que labutem nela
  rationale: O hebraico admite uma leitura centrada tanto na ocupação quanto no sofrimento ou esforço imposto por ela. A tradução principal evita intensificar indevidamente o sentido, e a nota preserva a tensão sem resolvê-la de modo dogmático.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e leve ressonância bíblica. “Filhos dos homens” preserva o caráter representativo da expressão hebraica; a nota explicita a ambiguidade lexical decisiva do versículo.
