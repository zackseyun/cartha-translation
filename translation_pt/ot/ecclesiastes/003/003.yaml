  text: a time to kill[a], and a time to heal; a time to tear down[b], and a time to build up.
translation:
  language: pt
  text: tempo de matar[a] e tempo de curar; tempo de derrubar[b] e tempo de construir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma época” em cada ocorrência de “tempo”.
    reason: lexical_alternative
  - marker: b
    text: Ou “tempo de demolir e tempo de edificar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵת
  choice: tempo
  rationale: O substantivo indica tempo, ocasião ou momento apropriado. “Tempo” preserva a cadência repetida do poema e é natural em português; “época” é uma alternativa possível, mas um pouco mais interpretativa.
- source_word: לַהֲרוֹג
  choice: matar
  rationale: O infinitivo de הרג significa de modo amplo “matar”. A escolha direta mantém a força do hebraico sem acrescentar conotação judicial ou militar.
- source_word: לִרְפּוֹא
  choice: curar
  rationale: רפא significa “curar” ou “sarar”. “Curar” é amplo, natural e forma o contraste restaurador com “matar”.
- source_word: לִפְרֹוץ
  choice: derrubar
  rationale: פרץ pode indicar romper, abrir brecha ou demolir. No contraste com “construir”, “derrubar” comunica naturalmente o sentido de desfazer uma construção; “demolir” também é possível.
- source_word: לִבְנוֹת
  choice: construir
  rationale: בנה significa “construir” ou “edificar”. “Construir” é claro para leitores modernos e estabelece uma antítese direta com “derrubar”.
theological_decisions:
- issue: Se “matar” deve ser suavizado para evitar uma aparente dificuldade moral
  choice: Manter “matar” como elemento descritivo no catálogo poético de Qohelet
  alternative: Dar morte ou tirar a vida
  rationale: O versículo apresenta pares de ações e circunstâncias sem declarar explicitamente aprovação moral de cada ação. Suavizar o verbo eliminaria a força e a tensão presentes no hebraico.
translation_notes:
  register: Português atual, claro e digno, com repetição de “tempo” para preservar o ritmo conciso do hebraico. O início em minúscula pressupõe a continuidade da enumeração iniciada no versículo anterior.
