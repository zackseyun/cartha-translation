base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/002.yaml
  text: A time to be born[a], and a time to die; a time to plant, and a time to uproot what is planted.
translation:
  language: pt
  text: Tempo de nascer e tempo de morrer; tempo de plantar e tempo de arrancar o que foi plantado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵת
  choice: tempo
  rationale: עֵת indica um tempo ou momento determinado. Sem o artigo, «tempo de» reproduz com naturalidade e concisão o padrão poético repetido em português.
- source_word: לָלֶדֶת
  choice: nascer
  rationale: 'Embora a forma possa exprimir dar à luz, o paralelismo antitético com «morrer» favorece aqui o início da vida do indivíduo: «nascer».'
- source_word: לָמוּת
  choice: morrer
  rationale: מות significa diretamente «morrer» e forma o par antitético natural com «nascer».
- source_word: לָטַעַת
  choice: plantar
  rationale: נטע no infinitivo qal significa «plantar»; a imagem agrícola literal é preservada.
- source_word: לַעֲקוֹר
  choice: arrancar
  rationale: עקר significa tirar pela raiz. «Arrancar» é corrente e natural em português no contexto agrícola, enquanto a expressão seguinte deixa claro que se trata de remover o que foi plantado.
- source_word: נָטוּעַ
  choice: o que foi plantado
  rationale: O particípio passivo de נטע designa aquilo que é arrancado. «O que foi plantado» preserva tanto a voz passiva quanto a ausência de um substantivo explícito.
