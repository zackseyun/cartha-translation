  text: אָמַ֤רְתִּֽי אֲנִי֙ בְּ/לִבִּ֔/י עַל דִּבְרַת֙ בְּנֵ֣י הָ/אָדָ֔ם לְ/בָרָ֖/ם הָ/אֱלֹהִ֑ים וְ/לִ/רְא֕וֹת שְׁ/הֶם בְּהֵמָ֥ה הֵ֖מָּה לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/018.yaml
  text: I said in my heart concerning the sons of man, that God is testing them, and to show them that they themselves are beasts.
translation:
  language: pt
  text: Eu disse no meu coração, a respeito dos filhos do homem[a], que Deus os põe à prova e lhes mostra[b] que eles mesmos são animais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os seres humanos”; o hebraico emprega uma expressão masculina com sentido representativo.
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente “e ver”; a expressão também pode ser entendida como “e deixá-los ver” ou “e ver que eles mesmos são animais”.
    reason: alternative_reading
lexical_decisions:
- source_word: אָמַרְתִּי אֲנִי בְּלִבִּי
  choice: Eu disse no meu coração
  rationale: Preserva a imagem hebraica da reflexão interior e continua compreensível e digna em português atual.
- source_word: עַל דִּבְרַת
  choice: a respeito de
  rationale: Introduz de modo natural o assunto da reflexão sem fixar uma nuance causal incerta.
- source_word: בְּנֵי הָאָדָם
  choice: os filhos do homem
  rationale: Mantém a forma masculina representativa e a construção singular coletiva do hebraico; a alternativa inclusiva e mais idiomática aparece em nota.
- source_word: לְבָרָם
  choice: Deus os põe à prova
  rationale: Expressa o sentido de provar, examinar ou depurar atribuído ao verbo no contexto, em linguagem portuguesa clara.
- source_word: וְלִרְאוֹת
  choice: e lhes mostra
  rationale: Comunica a leitura contextual segundo a qual Deus leva os seres humanos a perceber sua condição, sem ocultar em nota que a forma hebraica é literalmente 'e ver' e admite outras relações sintáticas.
- source_word: שֶׁהֵם בְּהֵמָה הֵמָּה לָהֶם
  choice: que eles mesmos são animais
  rationale: A repetição pronominal é refletida por 'eles mesmos'. O predicado permanece direto, sem acrescentar 'como', e 'animais' é o equivalente atual e não pejorativo de בְּהֵמָה neste contraste de mortalidade e condição terrena.
theological_decisions:
- issue: Força antropológica da identificação entre seres humanos e animais
  choice: que eles mesmos são animais
  alternative: que eles mesmos são como animais
  rationale: O hebraico apresenta um predicado direto, não uma comparação explícita. A redação conserva a tensão de Eclesiastes acerca da mortalidade e da condição criatural compartilhadas, sem negar nem explicar aqui outras afirmações bíblicas sobre a humanidade.
- issue: Expressão de gênero em בְּנֵי הָאָדָם
  choice: os filhos do homem
  alternative: os seres humanos
  rationale: A tradução principal conserva a expressão masculina de valor representativo do texto-fonte; a nota esclarece seu alcance coletivo.
- issue: Agente e sentido de וְלִרְאוֹת
  choice: e lhes mostra
  alternative: e ver; e deixá-los ver
  rationale: O contexto permite entender que Deus faz os humanos perceberem sua condição, mas a forma hebraica não contém morfologia causativa explícita. A ambiguidade genuína é registrada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Conserva-se a imagem 'no meu coração' e a formulação deliberadamente incisiva do predicado, enquanto as ambiguidades lexical e sintática são indicadas em notas.
