base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/021.yaml
  text: Who knows whether the spirit of the sons of man goes upward[b][a], and whether the spirit of the beast goes down to the earth?
translation:
  language: pt
  text: Quem sabe se o espírito[a] dos seres humanos[b] sobe para o alto e se o espírito do animal desce para baixo, até a terra?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sopro”, nas duas ocorrências de “espírito”. O termo hebraico רוּחַ pode abranger sentidos que se sobrepõem neste contexto.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “dos filhos do homem”. A expressão hebraica é masculina, mas aqui tem sentido representativo e se refere aos seres humanos.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יוֹדֵעַ
  choice: Quem sabe
  rationale: Reproduz diretamente a pergunta retórica hebraica e mantém o tom de incerteza do versículo, sem acrescentar ideias como “com certeza” ou “é capaz de saber”.
- source_word: רוּחַ
  choice: espírito
  rationale: No contexto da morte e do destino de humanos e animais, “espírito” expressa bem o princípio vital em discussão. “Sopro” continua sendo uma possibilidade lexical legítima e é registrada em nota.
- source_word: בְּנֵי הָאָדָם
  choice: os seres humanos
  rationale: É uma formulação portuguesa natural e inclusiva para a expressão hebraica literalmente masculina, que aqui tem força representativa e se refere à humanidade. A forma literal é indicada em nota.
- source_word: הָעֹלָה הִיא לְמָעְלָה
  choice: sobe para o alto
  rationale: Mantém tanto o movimento ascendente quanto a indicação explícita de direção presente no hebraico.
- source_word: וְרוּחַ הַבְּהֵמָה
  choice: e se o espírito do animal
  rationale: בְּהֵמָה está no singular coletivo e contrasta a vida animal com a humanidade. “Animal” é atual, claro e não acrescenta a conotação negativa que “besta” pode ter em português.
- source_word: הַיֹּרֶדֶת הִיא לְמַטָּה לָאָרֶץ
  choice: desce para baixo, para a terra
  rationale: Preserva as duas indicações espaciais do hebraico — a direção descendente e o destino na terra — e mantém o paralelismo com “sobe para o alto”.
theological_decisions:
- issue: Se o versículo afirma destinos distintos ou expressa incerteza sobre eles
  choice: 'Traduzir como pergunta retórica: “Quem sabe se...”'
  alternative: Traduzir como uma afirmação de que o espírito humano sobe e o espírito animal desce
  rationale: A abertura מִי יוֹדֵעַ é naturalmente interrogativa e mantém a incerteza epistemológica característica do contexto. A tradução não transforma a pergunta em uma declaração doutrinária.
- issue: Extensão da força interrogativa à segunda oração
  choice: Repetir “se” antes da oração sobre o animal
  alternative: Não repetir “se”, deixando a segunda oração formalmente mais próxima do hebraico
  rationale: Em português, a repetição deixa claro que os dois movimentos estão sob a mesma pergunta, sem resolver a ambiguidade nem alterar o sentido.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva a pergunta e sua tensão teológica. “Seres humanos” evita uma expressão excessivamente literal e pouco natural no texto principal, enquanto a nota documenta a forma hebraica. O paralelismo direcional foi mantido, inclusive com a leve redundância deliberada de “sobe para o alto” e “desce para baixo”.
