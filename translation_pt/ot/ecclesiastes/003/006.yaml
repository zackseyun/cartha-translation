lexical_decisions:
- source_word: עֵת
  choice: tempo
  rationale: Indica um tempo ou ocasião apropriada. A repetição de “tempo” preserva a cadência poética e soa natural em português.
- source_word: בקשׁ
  choice: procurar
  rationale: O piel לְבַקֵּשׁ significa procurar ou buscar. “Procurar” combina naturalmente com algo que se pode perder e mantém aberta a referência do objeto.
- source_word: אבד
  choice: perder
  rationale: No contraste com “procurar”, o sentido contextual mais provável é perder, embora o verbo também possa envolver considerar algo perdido ou deixá-lo perecer.
- source_word: שׁמר
  choice: guardar
  rationale: Neste contraste com descartar, “guardar” comunica de modo conciso a ideia de conservar ou reter algo.
- source_word: השליך
  choice: jogar fora
  rationale: O hiphil de שלך significa lançar ou atirar. No contraste prático com “guardar”, “jogar fora” expressa claramente a ideia de descartar em português atual.
