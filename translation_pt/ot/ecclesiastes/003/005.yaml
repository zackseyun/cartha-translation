base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/005.yaml
  text: A time to throw stones[a], and a time to gather stones; a time to embrace, and a time to refrain from embracing.
translation:
  language: pt
  text: Tempo de atirar pedras[a] e tempo de ajuntar pedras; tempo de abraçar e tempo de deixar de abraçar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «tempo de lançar pedras e tempo de ajuntar pedras». A imagem hebraica pode ser entendida literalmente, embora alguns a interpretem de modo figurado em relação aos vínculos humanos, à agricultura ou à guerra.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵת
  choice: tempo
  rationale: Denota um momento ou período. Sem o artigo, «tempo de» preserva o padrão poético conciso e repetido do hebraico.
- source_word: לְהַשְׁלִיךְ
  choice: espalhar
  rationale: O infinitivo hifil de שלך significa lançar ou atirar. No contexto de pedras, «espalhar» forma um contraste natural com «ajuntar» e mantém aberta a imagem concreta.
- source_word: אֲבָנִים
  choice: pedras
  rationale: É o equivalente comum de אֶבֶן e preserva diretamente a imagem hebraica.
- source_word: כְּנוֹס
  choice: ajuntar
  rationale: O infinitivo de כנס significa reunir ou recolher. «Ajuntar» é claro, corrente e estabelece o paralelo oposto a espalhar.
- source_word: לַחֲבוֹק
  choice: abraçar
  rationale: חבק significa abraçar. A escolha é natural, digna e suficientemente ampla para sentidos físicos ou relacionais.
- source_word: לִרְחֹק מֵחַבֵּק
  choice: se afastar de abraços
  rationale: רחק expressa estar ou manter-se longe, e מן marca aquilo de que se fica distante. A formulação conserva mais diretamente a imagem espacial e a possível amplitude do hebraico, sem reduzi-la apenas à ideia volitiva de abster-se.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e poético, de ampla compreensão internacional e leitura natural no Brasil. A estrutura sem artigos reproduz a cadência proverbial da sequência. «Espalhar/ajuntar» comunica o contraste com naturalidade; a nota registra as alternativas mais literais. O marcador [a] aparece imediatamente após a expressão correspondente.
