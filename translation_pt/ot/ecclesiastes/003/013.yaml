  text: וְ/גַ֤ם כָּל הָ/אָדָם֙ שֶׁ/יֹּאכַ֣ל וְ/שָׁתָ֔ה וְ/רָאָ֥ה ט֖וֹב בְּ/כָל עֲמָל֑/וֹ מַתַּ֥ת אֱלֹהִ֖ים הִֽיא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/013.yaml
  text: And also that every man should eat and drink and see good in all his labor—this is the gift of God[a][b].
translation:
  language: pt
  text: E também que todo ser humano coma, beba e desfrute do bem em todo o seu trabalho — isso é dom de Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “veja o bem”; também pode ser entendido como “experimente o bem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: E também que
  rationale: Mantém a força aditiva e a ligação sintática com o pensamento anterior.
- source_word: כָּל הָאָדָם
  choice: todo ser humano
  rationale: אָדָם é um singular genérico e distributivo; “todo ser humano” expressa naturalmente em português a referência inclusiva à humanidade sem transformar o singular em coletivo.
- source_word: שֶׁיֹּאכַל וְשָׁתָה
  choice: coma, beba
  rationale: O subjuntivo se ajusta à oração introduzida por “que” e comunica o conteúdo daquilo que é concedido ou reconhecido como bom.
- source_word: וְרָאָה טוֹב
  choice: e desfrute do bem
  rationale: A expressão literalmente significa “ver o bem”, mas em Eclesiastes funciona idiomaticamente no sentido de experimentar ou desfrutar algo bom; a nota preserva a imagem literal.
- source_word: בְּכָל עֲמָלוֹ
  choice: em todo o seu trabalho
  rationale: “Trabalho” é claro e atual, preservando a ideia de esforço em עָמָל; “em” reproduz de perto a construção preposicional hebraica.
- source_word: מַתַּת אֱלֹהִים הִיא
  choice: isso é dom de Deus
  rationale: Identifica toda a experiência anterior como algo concedido por Deus, mantendo a concisão e a ênfase do predicado nominal hebraico.
theological_decisions:
- issue: Sentido genérico de אָדָם
  choice: todo ser humano
  alternative: todo homem
  rationale: O referente é cada integrante da humanidade, não especificamente uma pessoa do sexo masculino. A formulação escolhida conserva o singular distributivo e torna explícito o alcance genérico do hebraico.
- issue: Natureza do bem ligado ao trabalho humano
  choice: desfrute do bem em todo o seu trabalho
  alternative: veja o bem em todo o seu trabalho
  rationale: A tradução comunica a experiência positiva concedida por Deus sem definir além do texto em que consiste esse bem; a forma literal permanece documentada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a conexão com o versículo anterior e evita linguagem denominacional.
