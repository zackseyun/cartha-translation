source:
  edition: WLC
  text: יָדַ֕עְתִּי כִּ֛י אֵ֥ין ט֖וֹב בָּ֑/ם כִּ֣י אִם לִ/שְׂמ֔וֹחַ וְ/לַ/עֲשׂ֥וֹת ט֖וֹב בְּ/חַיָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/012.yaml
  text: I know that there is nothing better for them than to rejoice and to do good during their lives[a].
translation:
  language: pt
  text: Sei que não há nada melhor para eles do que se alegrar e fazer o bem durante a vida[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “e desfrutar a vida” ou “e viver bem”; a expressão hebraica pode ser entendida tanto em sentido ético (“fazer o bem”) quanto em sentido experiencial (“viver bem, desfrutar a vida”).
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: Sei
  rationale: O perfeito qal na primeira pessoa do singular expressa aqui um conhecimento presente resultante da reflexão; “Sei” é natural e preserva o caráter assertivo.
- source_word: אֵין טוֹב בָּם
  choice: não há nada melhor para eles
  rationale: No contexto de Eclesiastes, a construção é entendida idiomaticamente em sentido comparativo, e não como afirmação de que não exista bem neles.
- source_word: כִּי אִם
  choice: do que
  rationale: Depois de “não há nada melhor”, a locução comparativa “do que” comunica naturalmente o valor exceptivo da expressão hebraica.
- source_word: לִשְׂמוֹחַ
  choice: se alegrar
  rationale: Expressa alegria ou contentamento de modo verbal, claro e corrente em português.
- source_word: וְלַעֲשׂוֹת טוֹב
  choice: e fazer o bem
  rationale: Preserva o sentido lexical mais direto e sua possível dimensão ética; a leitura experiencial é registrada em nota.
- source_word: בְּחַיָּיו
  choice: durante a vida
  rationale: Embora o sufixo hebraico seja singular (“sua vida”), a formulação genérica sem possessivo evita discordância com o antecedente plural e soa natural em português.
theological_decisions:
- issue: Sentido de וְלַעֲשׂוֹת טוֹב em Eclesiastes 3:12
  choice: 'sentido ético: “fazer o bem”'
  alternative: 'sentido experiencial: “desfrutar a vida”, “viver bem” ou “ter uma vida agradável”'
  rationale: A expressão hebraica admite o sentido lexical direto de praticar o bem, mas, no uso de טוֹב em Eclesiastes, também pode descrever uma experiência agradável ou uma vida boa. A tradução principal mantém a leitura ética, e a nota preserva a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Se alegrar” é mais corrente do que “regozijar-se”; “durante a vida” mantém o sentido distributivo sem impor gênero nem número ausentes da formulação genérica em português.
