base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/017.yaml
  text: I said in my heart[a], “God will judge the righteous and the wicked[b], for there is a time for every matter and for every deed there.”
translation:
  language: pt
  text: 'Eu disse no meu coração: “Deus julgará o justo e o perverso, pois há um tempo para cada propósito[a] e para toda obra ali[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para cada questão”. O termo hebraico também pode significar desejo, assunto ou propósito.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico traz “ali” no fim da frase. O termo pode apontar para o lugar ou para a ocasião do julgamento de Deus; sua referência exata é incerta.
    reason: alternative_reading
lexical_decisions:
- source_word: אָמַרְתִּי אֲנִי בְּלִבִּי
  choice: Eu disse no meu coração
  rationale: Preserva a metáfora hebraica da reflexão interior e soa natural e digna em português.
- source_word: הַצַּדִּיק וְאֶת הָרָשָׁע
  choice: o justo e o perverso
  rationale: Mantém o contraste ético entre as duas categorias. “Perverso” comunica maldade moral sem restringir o termo à culpa jurídica.
- source_word: יִשְׁפֹּט הָאֱלֹהִים
  choice: Deus julgará
  rationale: O imperfeito aponta, no contexto, para o julgamento futuro de Deus; a ordem portuguesa é natural e conserva o sentido.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação ou fundamento da afirmação anterior de modo conciso.
- source_word: עֵת לְכָל חֵפֶץ
  choice: há um tempo para cada propósito
  rationale: “Tempo” retoma o tema literário do capítulo, e “propósito” representa um sentido contextual plausível de חֵפֶץ sem eliminar sua amplitude lexical.
- source_word: וְעַל כָּל הַמַּעֲשֶׂה
  choice: e para toda obra
  rationale: “Obra” conserva a amplitude de מַעֲשֶׂה, que pode designar trabalho, ação ou feito; a preposição é ajustada para uma coordenação portuguesa fluente.
- source_word: שָׁם
  choice: lá
  rationale: Retém o advérbio final e sua referência incerta, em vez de omiti-lo ou explicá-lo interpretativamente.
theological_decisions:
- issue: Relação do advérbio final שָׁם com o julgamento divino
  choice: Manter “lá” no fim da frase.
  alternative: Omitir o advérbio; traduzi-lo como “então”; ou explicitar “no lugar do julgamento”.
  rationale: 'O texto hebraico inclui שָׁם, mas sua referência exata é discutida. A formulação preserva a tensão: pode apontar para o lugar ou para a ocasião do julgamento de Deus, sem decidir além do que o texto permite.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora “no meu coração” foi preservada; a difícil posição final de “lá” também foi mantida deliberadamente, com vírgula para assinalar sua função adverbial sem resolver sua referência.
