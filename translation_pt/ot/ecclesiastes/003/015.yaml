  text: מַה שֶּֽׁ/הָיָה֙ כְּבָ֣ר ה֔וּא וַ/אֲשֶׁ֥ר לִ/הְי֖וֹת כְּבָ֣ר הָיָ֑ה וְ/הָ/אֱלֹהִ֖ים יְבַקֵּ֥שׁ אֶת נִרְדָּֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/015.yaml
  text: What has been already is[a], and what is to be has already been; and God seeks what has been driven away.
translation:
  language: pt
  text: O que foi já é, e o que será já foi; e Deus busca o que foi levado embora.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deus busca o que é perseguido”; possivelmente, “Deus busca o que passou”, ou “Deus chama o passado a prestar contas”. A frase hebraica final é difícil e pode referir-se ao que foi levado embora ou passou, ou àquilo que é perseguido.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַה שֶּׁהָיָה
  choice: O que já existiu
  rationale: A expressão introduz uma afirmação geral sobre acontecimentos ou realidade; “o que já existiu” é natural em português e mantém o sentido abrangente.
- source_word: כְּבָר
  choice: já
  rationale: Marca ocorrência anterior e preserva de modo conciso o paralelismo aforístico.
- source_word: הוּא
  choice: ainda existe
  rationale: O pronome tem função predicativa numa oração sem verbo expresso. “Ainda existe” torna inteligível a continuidade entre passado e presente, embora o hebraico seja literalmente mais enxuto.
- source_word: וַאֲשֶׁר לִהְיוֹת
  choice: o que há de existir
  rationale: Preserva a orientação futura da construção infinitiva e mantém o paralelismo com a primeira oração.
- source_word: הָאֱלֹהִים
  choice: Deus
  rationale: Neste contexto, o termo designa Deus e recebe sua tradução portuguesa convencional.
- source_word: יְבַקֵּשׁ
  choice: busca
  rationale: Conserva o sentido lexical básico de בקשׁ sem definir se a busca tem caráter restaurador ou judicial.
- source_word: אֶת נִרְדָּף
  choice: o que foi levado embora
  rationale: O particípio passivo de רדף é difícil neste contexto. A formulação mantém a ideia de algo afastado ou impelido, sem impor a leitura judicial ou a referência explícita ao passado.
theological_decisions:
- issue: Sentido de וְהָאֱלֹהִים יְבַקֵּשׁ אֶת נִרְדָּף
  choice: Deus busca o que foi levado embora
  alternative: Deus busca o que é perseguido; Deus traz o passado de volta ou o chama a prestar contas
  rationale: A oração hebraica é semanticamente condensada e admite leituras distintas. O texto principal conserva o núcleo lexical e a ambiguidade tanto quanto o português permite; a nota registra interpretações relevantes sem transformar nenhuma delas em afirmação doutrinária explícita.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O paralelismo conciso foi preservado. A expressão “há de existir” mantém um tom sapiencial natural sem ser arcaica, e a nota explicita a dificuldade da oração final.
