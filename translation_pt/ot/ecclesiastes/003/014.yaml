revisions:
- from: Sei que tudo o que Deus faz durará para sempre. Nada se pode acrescentar ao que ele faz, nem tirar coisa alguma. Deus age assim para que o temam diante dele.[a]
  to: Sei que tudo o que Deus faz durará para sempre; nada se pode acrescentar a isso, nem tirar disso coisa alguma. Deus fez isso para que o temam diante dele.[a]
  rationale: A revisão conserva as escolhas adequadas do rascunho para «Sei», «tudo o que Deus faz», «durará para sempre» e «temam», mas restaura o perfeito de «Deus fez isso», explicita a relação «tirar disso» e torna a nota lexical mais fiel ao campo semântico de ירא. O marcador permanece corretamente ancorado à expressão «diante dele».
