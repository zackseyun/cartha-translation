source:
  edition: WLC
  text: יָדַ֗עְתִּי כִּ֠י כָּל אֲשֶׁ֨ר יַעֲשֶׂ֤ה הָ/אֱלֹהִים֙ ה֚וּא יִהְיֶ֣ה לְ/עוֹלָ֔ם עָלָי/ו֙ אֵ֣ין לְ/הוֹסִ֔יף וּ/מִמֶּ֖/נּוּ אֵ֣ין לִ/גְרֹ֑עַ וְ/הָ/אֱלֹהִ֣ים עָשָׂ֔ה שֶׁ/יִּֽרְא֖וּ מִ/לְּ/פָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/014.yaml
  text: I know that whatever God does will endure forever; there is nothing to add to it[a], and there is nothing to take from it. God has done it so that they may fear before him.
translation:
  language: pt
  text: Sei que tudo o que Deus faz durará para sempre; nada se pode acrescentar a isso, nem tirar disso coisa alguma. Deus fez isso para que o temam diante dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fiquem tomados de temor reverente diante dele”.'
    reason: Alternativa lexical para ירא que explicita a dimensão de reverência e assombro sem eliminar o sentido de temor.
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: Sei
  rationale: O perfeito qal na primeira pessoa expressa uma compreensão alcançada que permanece; o presente português comunica naturalmente esse estado resultante.
- source_word: כָּל אֲשֶׁר יַעֲשֶׂה הָאֱלֹהִים
  choice: tudo o que Deus faz
  rationale: Preserva o alcance universal de כָּל אֲשֶׁר e soa natural em português moderno.
- source_word: הוּא יִהְיֶה לְעוֹלָם
  choice: durará para sempre
  rationale: Expressa de modo idiomático a permanência indicada por יִהְיֶה לְעוֹלָם, tendo como referente tudo o que Deus faz.
- source_word: עָלָיו אֵין לְהוֹסִיף
  choice: Nada se pode acrescentar ao que ele faz
  rationale: Comunica a impossibilidade de acrescentar algo à obra divina e explicita com clareza o referente pronominal.
- source_word: וּמִמֶּנּוּ אֵין לִגְרֹעַ
  choice: nem tirar coisa alguma
  rationale: Mantém o paralelismo entre acrescentar e retirar, com formulação corrente e clara.
- source_word: וְהָאֱלֹהִים עָשָׂה
  choice: Deus age assim
  rationale: Neste contexto, o perfeito hebraico aponta para a ação divina que produz o resultado expresso a seguir; esta formulação liga naturalmente as duas orações sem restringir a referência a um único ato.
- source_word: שֶׁיִּרְאוּ
  choice: para que o temam
  rationale: Conserva o valor central de ירא, incluindo temor, reverência e assombro, sem suavizar a tensão teológica do texto.
- source_word: מִלְּפָנָיו
  choice: diante dele
  rationale: Reproduz de forma natural o idioma hebraico que descreve a postura humana perante Deus ou em sua presença.
theological_decisions:
- issue: Sentido de temer a Deus
  choice: temam
  alternative: reverenciem; fiquem maravilhados diante dele
  rationale: O hebraico ירא abrange temor reverente e assombro. Manter “temam” no texto principal preserva seu peso lexical e a tensão teológica de Eclesiastes, enquanto a nota registra uma nuance possível.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A repetição literal de “Deus” foi parcialmente substituída por “ele” onde o referente permanece inequívoco. O marcador da nota foi colocado junto à expressão a que a alternativa lexical se refere.
