source:
  edition: WLC
  text: הַ/כֹּ֥ל הוֹלֵ֖ךְ אֶל מָק֣וֹם אֶחָ֑ד הַ/כֹּל֙ הָיָ֣ה מִן הֶֽ/עָפָ֔ר וְ/הַ/כֹּ֖ל שָׁ֥ב אֶל הֶ/עָפָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/020.yaml
  text: All go to one place[a]. All came from the dust[b], and all return to the dust.
translation:
  language: pt
  text: Todos vão para um só lugar. Todos vieram do pó[a], e todos voltam ao pó[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Todos eram do pó”. A tradução “vieram do pó” expressa de modo mais natural a ideia de origem.'
    reason: lexical_alternative
  - marker: b
    text: “O pó” evoca a mortalidade humana e retoma a linguagem de Gênesis 3:19.
    reason: cross_reference
lexical_decisions:
- source_word: הַכֹּל
  choice: todos
  rationale: No contexto imediato, a expressão abrangente retoma seres humanos e animais. “Todos” conserva o alcance universal e soa natural em português.
- source_word: הוֹלֵךְ
  choice: vão
  rationale: O particípio expressa uma realidade geral; o presente simples é natural no discurso proverbial.
- source_word: מָקוֹם אֶחָד
  choice: um só lugar
  rationale: Reproduz de modo claro a ideia de um único destino comum sem especificar além do que o hebraico afirma.
- source_word: הָיָה מִן הֶעָפָר
  choice: vieram do pó
  rationale: Embora הָיָה signifique mais literalmente “era/foi”, “vieram do pó” expressa naturalmente a ideia de origem e mantém o paralelismo com “voltam ao pó”.
- source_word: עָפָר
  choice: pó
  rationale: É a tradução tradicional e contextualmente adequada, evocando a mortalidade e a linguagem de Gênesis 3:19.
- source_word: שָׁב אֶל הֶעָפָר
  choice: voltam ao pó
  rationale: “Voltar” comunica com precisão o movimento de retorno expresso por שׁוב e preserva o contraste entre origem e fim.
theological_decisions:
- issue: Alcance antropológico de הַכֹּל no contexto
  choice: O versículo afirma a mortalidade comum de seres humanos e animais, sem formular outra conclusão doutrinária sobre a vida após a morte.
  alternative: Entender “todos” apenas como referência aos seres humanos, ou tomar a frase como negação materialista de qualquer distinção depois da morte.
  rationale: Eclesiastes 3:18–21 compara seres humanos e animais e destaca o destino corporal que compartilham. A tradução mantém essa observação e a tensão do contexto sem acrescentar uma conclusão que este versículo não explicita.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A repetição de “todos” preserva a estrutura enfática do hebraico; “um só lugar” evita interpretar em excesso a natureza desse destino comum.
