source:
  edition: WLC
  text: וְ/רָאִ֗יתִי כִּ֣י אֵ֥ין טוֹב֙ מֵ/אֲשֶׁ֨ר יִשְׂמַ֤ח הָ/אָדָם֙ בְּֽ/מַעֲשָׂ֔י/ו כִּי ה֖וּא חֶלְק֑/וֹ כִּ֣י מִ֤י יְבִיאֶ֨/נּוּ֙ לִ/רְא֔וֹת בְּ/מֶ֖ה שֶׁ/יִּהְיֶ֥ה אַחֲרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/022.yaml
  text: So I saw that there is nothing better than that a man should rejoice in his works[a], for that is his portion. For who can bring him to see what will be after him?
translation:
  language: pt
  text: Assim, vi que não há nada melhor do que o homem se alegrar com aquilo que faz, pois essa é a sua porção. Pois quem poderá levá-lo a ver o que haverá depois dele[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “depois que ele se for”.'
    reason: Alternativa que explicita a possível referência ao período posterior à partida ou morte da pessoa, sem restringir o sentido amplo do texto principal.
lexical_decisions:
- source_word: וְרָאִיתִי
  choice: Assim, vi
  rationale: O perfeito qal na primeira pessoa introduz uma conclusão decorrente da reflexão anterior. “Assim” comunica essa força inferencial com naturalidade.
- source_word: אֵין טוֹב מֵאֲשֶׁר
  choice: não há nada melhor do que
  rationale: A expressão apresenta uma avaliação comparativa, não uma afirmação absoluta sobre o bem moral.
- source_word: הָאָדָם
  choice: o homem
  rationale: O substantivo é singular e tem sentido representativo e genérico. A formulação preserva essa forma, sendo naturalmente compreendida como referência ao ser humano em geral.
- source_word: יִשְׂמַח
  choice: se alegrar
  rationale: O infinitivo em português, depois de “nada melhor do que”, expressa naturalmente o conteúdo da avaliação sem transformá-la em mandamento.
- source_word: בְּמַעֲשָׂיו
  choice: com aquilo que faz
  rationale: מַעֲשֶׂה abrange obra, atividade e realização. Esta formulação é clara e idiomática, sem restringir indevidamente o sentido ao trabalho remunerado.
- source_word: חֶלְקוֹ
  choice: a sua porção
  rationale: חֵלֶק designa a parte que cabe à pessoa na vida. “Porção” preserva o termo recorrente e sua nuance de quinhão concedido.
- source_word: מִי יְבִיאֶנּוּ לִרְאוֹת
  choice: quem poderá levá-lo a ver
  rationale: A forma causativa de בוא significa “levar” ou “trazer”, e a pergunta retórica sugere incapacidade humana; “poderá” explicita essa força pragmática.
- source_word: בְּמֶה שֶׁיִּהְיֶה אַחֲרָיו
  choice: o que acontecerá depois dele
  rationale: A formulação mantém aberta a referência ao que virá depois da pessoa, sem limitar o texto explicitamente ao período posterior à sua morte.
theological_decisions:
- issue: Sentido genérico de אָדָם no singular
  choice: o homem
  alternative: o ser humano
  rationale: O hebraico emprega o masculino singular de modo representativo. A escolha preserva essa forma e não restringe a aplicação do enunciado apenas aos homens.
- issue: Alcance temporal de אַחֲרָיו
  choice: depois dele
  alternative: depois que ele se for
  rationale: A expressão hebraica pode apontar para o que sucede a uma pessoa ou para o que ocorre após sua partida ou morte. O texto principal conserva a ambiguidade, e a nota registra a leitura mais explícita.
translation_notes:
  register: Português moderno, digno e acessível, com construção natural para leitores brasileiros e compreensão internacional. A repetição temática de “porção” foi preservada, enquanto “aquilo que faz” evita a rigidez de “suas obras”.
