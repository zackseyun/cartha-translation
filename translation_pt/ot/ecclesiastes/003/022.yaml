revisions:
- from: Assim, vi que não há nada melhor do que o homem se alegrar com aquilo que faz, pois essa é a sua porção. Afinal, quem poderá levá-lo a ver o que acontecerá depois dele[a]?
  to: Assim, vi que não há nada melhor do que o homem se alegrar com aquilo que faz, pois essa é a sua porção. Pois quem poderá levá-lo a ver o que haverá depois dele[a]?
  rationale: A revisão evita limitar o futuro posterior da pessoa a meros acontecimentos e emprega uma ligação causal mais próxima do hebraico. O restante da redação é fiel, natural e mantém o registro e a ambiguidade apropriados.
