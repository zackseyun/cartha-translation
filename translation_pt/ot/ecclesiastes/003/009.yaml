  yaml_path: translation/ot/ecclesiastes/003/009.yaml
  text: What profit has the worker from that in which he labors?[a]
translation:
  language: pt
  text: Que proveito tem o trabalhador naquilo em que trabalha?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que ganho tem o trabalhador naquilo em que se afadiga?”'
    reason: Alternativas lexicais para יִתְרוֹן e עָמֵל, preservando com maior destaque a nuance de ganho e trabalho penoso.
lexical_decisions:
- source_word: מַה
  choice: Que
  rationale: Introduz de modo conciso a pergunta retórica e, com “proveito”, forma uma construção natural em português.
- source_word: יִתְרוֹן
  choice: proveito
  rationale: Preserva o termo-chave de Eclesiastes para lucro, ganho ou vantagem, mantendo sua recorrente nuance econômica.
- source_word: הָעֹשֶׂה
  choice: o trabalhador
  rationale: O particípio significa literalmente “aquele que faz”; em paralelo com עָמֵל, “o trabalhador” comunica naturalmente a pessoa empenhada no trabalho.
- source_word: בַּאֲשֶׁר
  choice: naquilo em que
  rationale: Expressa o âmbito ou a matéria em que a atividade se realiza, sem eliminar a construção deliberadamente compacta do hebraico.
- source_word: הוּא
  choice: implícito na flexão de “trabalha”
  rationale: O português normalmente omite o pronome sujeito quando a flexão verbal o identifica; a terceira pessoa do singular retoma claramente “o trabalhador”.
- source_word: עָמֵל
  choice: trabalha
  rationale: Verbo corrente e digno para o ato de laborar; evita uma formulação artificial, embora a alternativa “se afadiga” torne mais explícita a ideia de trabalho penoso.
theological_decisions:
- issue: Masculino singular representativo
  choice: o trabalhador ... trabalha
  alternative: quem trabalha ... seu trabalho
  rationale: Mantém o masculino singular do hebraico como forma representativa e preserva a retomada singular do sujeito sem recorrer a uma reformulação neutra.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva a concisão da pergunta retórica e o vocabulário econômico característico de Eclesiastes.
