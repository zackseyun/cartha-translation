  text: אֶת הַ/כֹּ֥ל עָשָׂ֖ה יָפֶ֣ה בְ/עִתּ֑/וֹ גַּ֤ם אֶת הָ/עֹלָם֙ נָתַ֣ן בְּ/לִבָּ֔/ם מִ/בְּלִ֞י אֲשֶׁ֧ר לֹא יִמְצָ֣א הָ/אָדָ֗ם אֶת הַֽ/מַּעֲשֶׂ֛ה אֲשֶׁר עָשָׂ֥ה הָ/אֱלֹהִ֖ים מֵ/רֹ֥אשׁ וְ/עַד סֽוֹף־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/011.yaml
  text: He has made everything beautiful in its time. He has also put eternity in their heart[a], yet so that man cannot find out the work that God has done from beginning to end.
translation:
  language: pt
  text: Ele fez tudo belo em seu tempo. Também pôs a eternidade no coração deles[a], mas sem que o ser humano possa descobrir a obra que Deus fez do começo ao fim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o mundo” ou “a era”. O hebraico עוֹלָם aqui é difícil e pode indicar a percepção de toda a extensão do tempo ou do mundo para além da experiência imediata.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּל
  choice: tudo
  rationale: Expressa de modo natural e abrangente a totalidade do que Deus fez ou ordenou.
- source_word: יָפֶה
  choice: belo
  rationale: Preserva o sentido primário de beleza e permite também a nuance contextual de algo apropriado ou harmonioso.
- source_word: בְעִתּוֹ
  choice: a seu tempo
  rationale: Retoma cada coisa ou acontecimento e mantém a ênfase do capítulo no tempo que lhe corresponde.
- source_word: הָעֹלָם
  choice: a eternidade
  rationale: Conserva a ideia de uma percepção humana que ultrapassa o momento imediato, sem eliminar a reconhecida dificuldade lexical; as principais alternativas são registradas em nota.
- source_word: בְּלִבָּם
  choice: no coração deles
  rationale: Mantém a imagem hebraica do coração como centro da reflexão, vontade e interioridade, bem como o sufixo plural.
- source_word: מִבְּלִי אֲשֶׁר לֹא
  choice: sem que, contudo, ... possa
  rationale: Comunica a limitação ou o resultado expresso pela construção e realça o contraste entre a percepção concedida e a incapacidade humana de abarcar toda a obra divina.
- source_word: הָאָדָם
  choice: o ser humano
  rationale: Reproduz o sentido genérico e representativo do hebraico com clareza no português atual.
- source_word: יִמְצָא
  choice: descobrir
  rationale: No contexto, indica chegar a conhecer ou investigar plenamente, não apenas encontrar fisicamente.
- source_word: הַמַּעֲשֶׂה
  choice: a obra
  rationale: Representa coletivamente a atividade de Deus e se liga naturalmente à oração relativa seguinte.
- source_word: מֵרֹאשׁ וְעַד סוֹף
  choice: do começo ao fim
  rationale: Preserva o merismo que expressa a totalidade do alcance da obra divina.
theological_decisions:
- issue: Sentido de הָעֹלָם em relação ao conhecimento humano e à soberania divina
  choice: “a eternidade” no texto principal
  alternative: “o mundo”, “a era” ou a percepção da totalidade do tempo
  rationale: A leitura mantém a tensão entre a percepção do que transcende o presente, dada por Deus, e a incapacidade humana de compreender exaustivamente toda a obra divina. A nota preserva a ambiguidade lexical sem impor uma solução doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva o paralelismo e a tensão do hebraico; “a seu tempo” mantém uma cadência bíblica ainda corrente, enquanto “o ser humano” esclarece o referente genérico.
