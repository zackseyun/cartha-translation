  text: אַל תְּבַהֵ֨ל עַל פִּ֜י/ךָ וְ/לִבְּ/ךָ֧ אַל יְמַהֵ֛ר לְ/הוֹצִ֥יא דָבָ֖ר לִ/פְנֵ֣י הָ/אֱלֹהִ֑ים כִּ֣י הָ/אֱלֹהִ֤ים בַּ/שָּׁמַ֨יִם֙ וְ/אַתָּ֣ה עַל הָ/אָ֔רֶץ עַֽל כֵּ֛ן יִהְי֥וּ דְבָרֶ֖י/ךָ מְעַטִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/001.yaml
  text: Do not be hasty with your mouth[a], and do not let your heart be quick to bring forth a word before God, for God is in heaven and you are on earth. Therefore let your words be few.
translation:
  language: pt
  text: Não se precipite ao falar,[a] nem deixe que o seu coração se apresse a proferir uma palavra diante de Deus, pois Deus está no céu, e você está na terra. Portanto, sejam poucas as suas palavras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “não se precipite com a sua boca”. No contexto, isso pode incluir votos precipitados, mas o hebraico fala aqui, de modo mais amplo, de proferir palavras diante de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּבַהֵל עַל פִּיךָ
  choice: Não se precipite ao falar
  rationale: Expressa naturalmente em português a advertência contra a fala impensada. O verbo comunica pressa ou precipitação, e a expressão hebraica com “boca” refere-se idiomaticamente ao ato de falar.
- source_word: לִבְּךָ
  choice: o seu coração
  rationale: Preserva a antropologia hebraica, na qual o coração abrange pensamento, intenção e vontade, e não apenas emoção.
- source_word: יְמַהֵר
  choice: se apresse
  rationale: Mantém o sentido de agir com rapidez indevida e o paralelismo com “se precipite” sem repetição artificial.
- source_word: לְהוֹצִיא דָבָר
  choice: a proferir uma palavra
  rationale: Representa a ideia concreta de fazer sair uma palavra de modo natural e digno em português, sem restringi-la indevidamente a voto ou promessa.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: diante de Deus
  rationale: Equivalente direto e idiomático que preserva o sentido de falar na presença de Deus.
- source_word: בַּשָּׁמַיִם
  choice: no céu
  rationale: Embora a forma hebraica seja morfologicamente plural, aqui designa idiomaticamente a esfera celeste e contrasta com a terra.
- source_word: עַל הָאָרֶץ
  choice: na terra
  rationale: Preserva de forma natural o contraste espacial entre Deus no céu e o ser humano na terra.
- source_word: עַל כֵּן
  choice: Portanto
  rationale: Assinala com clareza que a contenção verbal é a conclusão extraída do contraste entre céu e terra.
- source_word: יִהְיוּ דְבָרֶיךָ מְעַטִּים
  choice: sejam poucas as suas palavras
  rationale: Transmite a força jussiva da construção hebraica e conserva a ênfase na moderação da fala.
theological_decisions:
- issue: Se a advertência deve ser limitada a votos ou promessas feitos no culto
  choice: Manter a referência ampla à fala diante de Deus
  alternative: Traduzir especificamente como advertência contra votos precipitados
  rationale: O contexto próximo trata do culto e de votos, mas este versículo fala de modo mais amplo em proferir uma palavra diante de Deus. A tradução não introduz “voto” ou “promessa” onde o hebraico não os explicita.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A segunda pessoa é expressa por “você/seu”, evitando regionalismos; “proferir” preserva a solenidade do contexto sem tornar a frase arcaica.
