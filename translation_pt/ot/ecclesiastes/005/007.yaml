  text: אִם עֹ֣שֶׁק רָ֠שׁ וְ/גֵ֨זֶל מִשְׁפָּ֤ט וָ/צֶ֨דֶק֙ תִּרְאֶ֣ה בַ/מְּדִינָ֔ה אַל תִּתְמַ֖הּ עַל הַ/חֵ֑פֶץ כִּ֣י גָבֹ֜הַּ מֵ/עַ֤ל גָּבֹ֨הַ֙ שֹׁמֵ֔ר וּ/גְבֹהִ֖ים עֲלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/007.yaml
  text: If you see the oppression of the poor and the robbery of justice and righteousness in the province, do not be astonished at the matter; for a high official is watched by one higher, and there are even higher ones over them.
translation:
  language: pt
  text: Se você vir, na província, a opressão dos pobres[a] e o roubo da justiça e da retidão[b], não se espante com isso, pois uma autoridade de alto escalão é vigiada por outra mais alta, e há autoridades ainda mais altas acima delas.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a extorsão dos pobres”. Os termos hebraicos podem destacar a exploração mediante tomada abusiva, além da opressão em sentido geral.
    reason: lexical_alternative
  - marker: b
    text: Ou “a espoliação da justiça e da retidão”.
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico repete “alto”: “pois um alto vigia sobre outro alto, e há altos acima deles”. Isso pode se referir a camadas de autoridades humanas e também pode sugerir a supervisão divina suprema.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֹשֶׁק רָשׁ
  choice: opressão dos pobres
  rationale: עֹשֶׁק denota exploração opressiva ou extorsão, e רָשׁ designa o pobre ou necessitado. A formulação no plural coletivo é natural em português e preserva a referência social.
- source_word: גֵזֶל מִשְׁפָּט וָצֶדֶק
  choice: roubo da justiça e da retidão
  rationale: גֵזֶל comunica roubo, espoliação ou tomada violenta; aplicado a מִשְׁפָּט e צֶדֶק, retrata de modo vívido a supressão tanto da justiça pública quanto da conduta moralmente correta.
- source_word: מְדִינָה
  choice: província
  rationale: O termo pode indicar uma unidade territorial ou administrativa. “Província” se ajusta ao contexto de uma hierarquia governamental.
- source_word: אַל תִּתְמַהּ עַל הַחֵפֶץ
  choice: não se espante com isso
  rationale: O verbo expressa espanto ou admiração, enquanto הַחֵפֶץ, neste contexto, aponta para a situação mencionada. A construção é direta e natural em português.
- source_word: גָבֹהַּ מֵעַל גָּבֹהַ
  choice: uma autoridade de alto escalão ... outra mais alta
  rationale: O adjetivo “alto” é empregado substantivamente para pessoas de posição elevada. “Autoridade” explicita o referente institucional sugerido pelo contexto sem identificar cargos específicos.
- source_word: שֹׁמֵר
  choice: é vigiada
  rationale: O particípio significa “vigia” ou “mantém sob observação”. A voz passiva expressa com clareza a relação de supervisão entre níveis hierárquicos.
- source_word: וּגְבֹהִים עֲלֵיהֶם
  choice: há autoridades ainda mais altas acima delas
  rationale: O plural prossegue a escalada hierárquica. “Ainda mais altas” torna essa progressão natural em português sem definir se as autoridades são exclusivamente humanas.
theological_decisions:
- issue: Se Deus deve ser identificado explicitamente como o vigilante supremo
  choice: Manter no texto principal a referência ambígua a autoridades sucessivamente mais altas, sem inserir “Deus”.
  alternative: Entender as autoridades mais altas como uma alusão, direta ou indireta, à supervisão divina.
  rationale: O hebraico não nomeia Deus neste versículo. A tradução preserva tanto a leitura de uma cadeia de autoridades humanas quanto a possível implicação de supervisão divina, sem decidir entre elas.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A imagem forte de a justiça ser “roubada” foi mantida, e a ambiguidade da hierarquia final foi preservada.
