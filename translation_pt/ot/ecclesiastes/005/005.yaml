  terminology: “Mensageiro” preserva corretamente a amplitude de מַלְאָךְ, e a nota registra de modo suficiente a alternativa “anjo”. “Engano”, “voz” e “trabalho das suas mãos” são escolhas adequadas, sem resolver indevidamente questões interpretativas ou doutrinárias.
