  source_fidelity: 'A tradução preserva adequadamente a estrutura exortativa do hebraico: a boca como agente que leva o próprio corpo a pecar, a fala diante do mensageiro, a alegação de erro e a pergunta retórica sobre a ira de Deus e a ruína do trabalho das mãos. “Leve ... a pecar” comunica bem o valor causativo de לַחֲטִיא. “Corpo” é uma explicitação semântica aceitável de בְּשָׂרֶךָ neste contexto e evita impor à palavra “carne” uma conotação teológica posterior.'
