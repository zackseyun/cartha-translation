base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/005.yaml
  text: Do not let your mouth cause your flesh to sin[a], and do not say before the messenger, “It was a mistake.” Why should God be angry at your voice and destroy the work of your hands?
translation:
  language: pt
  text: 'Não deixe que a sua boca leve o seu corpo a pecar, nem diga diante do mensageiro[a]: “Foi um engano.” Por que Deus ficaria irado com a sua voz e destruiria o trabalho das suas mãos?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “anjo”. O termo hebraico pode designar tanto um mensageiro humano como um mensageiro celestial.'
    reason: alternative_reading
lexical_decisions:
- source_word: תִּתֵּן אֶת־פִּיךָ
  choice: deixe que a sua boca
  rationale: A formulação reproduz de modo natural em português a construção hebraica com valor permissivo, sem manter o pouco idiomático “dê a sua boca”.
- source_word: לַחֲטִיא
  choice: leve ... a pecar
  rationale: O hifil de חטא tem força causativa. “Leve ... a pecar” comunica essa relação com clareza e naturalidade.
- source_word: בְּשָׂרֶךָ
  choice: seu corpo
  rationale: Embora o termo signifique literalmente “sua carne”, aqui designa a pessoa em sua existência corporal. “Seu corpo” evita que o leitor moderno entenda indevidamente “carne” como uma natureza pecaminosa, preservando o sentido concreto no contexto.
- source_word: הַמַּלְאָךְ
  choice: mensageiro
  rationale: מַלְאָךְ pode indicar um mensageiro humano ou celestial. No contexto de votos e culto, um agente humano é plausível; “mensageiro” mantém a amplitude lexical, enquanto “anjo” aparece na nota.
- source_word: שְׁגָגָה
  choice: um engano
  rationale: O substantivo denota erro ou ato inadvertido. “Um engano” é uma desculpa natural em português para um voto pronunciado de modo imprudente.
- source_word: קוֹלֶךָ
  choice: a sua voz
  rationale: Mantém a imagem concreta do hebraico, que neste contexto abrange o voto ou a desculpa pronunciados.
- source_word: וְחִבֵּל
  choice: destruiria
  rationale: O verbo expressa arruinar ou causar dano grave. “Destruiria” preserva a intensidade da possível ação divina.
- source_word: מַעֲשֵׂה יָדֶיךָ
  choice: o trabalho das suas mãos
  rationale: A expressão portuguesa é clara e conserva o conhecido idioma hebraico para o trabalho da pessoa e seus resultados.
theological_decisions:
- issue: Identidade de הַמַּלְאָךְ no contexto dos votos
  choice: mensageiro
  alternative: anjo
  rationale: O contexto permite entender a figura como um agente humano ligado à administração dos votos, mas o termo hebraico também pode designar um ser celestial. A tradução principal e a nota preservam essa tensão sem decidir além da evidência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construções naturais para leitores brasileiros. O tratamento por “você” é expresso por formas possessivas e verbais sem introduzir coloquialismo excessivo. A ordem e as imagens principais do hebraico foram mantidas quando claras em português.
