reference: Ecclesiastes 5:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: גַּ֣ם כָּֽל הָ/אָדָ֡ם אֲשֶׁ֣ר נָֽתַן ל֣/וֹ הָ/אֱלֹהִים֩ עֹ֨שֶׁר וּ/נְכָסִ֜ים וְ/הִשְׁלִיט֨/וֹ לֶ/אֱכֹ֤ל מִמֶּ֨/נּוּ֙ וְ/לָ/שֵׂ֣את אֶת חֶלְק֔/וֹ וְ/לִ/שְׂמֹ֖חַ בַּ/עֲמָל֑/וֹ זֹ֕ה מַתַּ֥ת אֱלֹהִ֖ים הִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/018.yaml
  text: Also[a], every man to whom God has given wealth and possessions, and has empowered him to eat from them, and to take his portion[c][b], and to rejoice in his labor—this is the gift of God.
translation:
  language: pt
  text: Além disso, toda pessoa[a] a quem Deus deu riquezas e bens, e a quem deu capacidade[b] para comer deles, receber sua porção[c] e alegrar-se em seu trabalho — isso é dom de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “todo homem”; o substantivo hebraico masculino singular é usado aqui de modo genérico para qualquer ser humano.
    reason: lexical_alternative
  - marker: b
    text: Ou “deu poder” ou “deu capacidade”. O verbo destaca a capacidade, concedida por Deus, de usufruir o que se possui.
    reason: lexical_alternative
  - marker: c
    text: Ou “tomar sua porção”, “receber sua parte” ou “receber seu quinhão”. “Porção” é um termo importante em Eclesiastes para a parte atribuída a alguém na vida.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Também
  rationale: Preserva a força aditiva que liga o versículo à reflexão anterior, com linguagem simples e natural.
- source_word: כָּל הָאָדָם
  choice: a toda pessoa
  rationale: A expressão é distributiva e usa o singular genérico; em português atual, “toda pessoa” comunica naturalmente a referência a qualquer ser humano sem pluralizar a construção.
- source_word: נָתַן לוֹ הָאֱלֹהִים
  choice: a quem Deus deu
  rationale: O perfeito hebraico apresenta a dádiva divina como fato consumado; o pretérito perfeito é idiomático nesta máxima sapiencial.
- source_word: עֹשֶׁר וּנְכָסִים
  choice: riquezas e bens
  rationale: Distingue a abundância material das coisas possuídas, em formulação corrente e acessível.
- source_word: וְהִשְׁלִיטוֹ
  choice: e capacitou
  rationale: O hifil de שלט indica que Deus concede domínio ou capacidade efetiva; “capacitou” evita reduzir a ideia a mera permissão.
- source_word: לֶאֱכֹל מִמֶּנּוּ
  choice: para deles comer
  rationale: Mantém a imagem concreta de comer dos bens, usada para indicar usufruto, sem substituí-la silenciosamente por “desfrutar”.
- source_word: וְלָשֵׂאת אֶת חֶלְקוֹ
  choice: receber sua porção
  rationale: חלק é a porção ou parte atribuída à pessoa, termo recorrente em Eclesiastes; “receber” expressa de modo natural a apropriação dessa parte, embora נשׂא também possa ser vertido por “tomar”.
- source_word: וְלִשְׂמֹחַ בַּעֲמָלוֹ
  choice: e alegrar-se em seu trabalho
  rationale: Preserva a alegria explícita de שמח e traduz עמל por um termo natural que ainda abrange esforço laborioso.
- source_word: זֹה מַתַּת אֱלֹהִים הִיא
  choice: isso é dom de Deus
  rationale: Retoma como dádiva divina toda a realidade descrita, em formulação concisa e fiel.
theological_decisions:
- issue: Masculino genérico em הָאָדָם
  choice: toda pessoa
  alternative: todo homem
  rationale: O substantivo masculino singular é empregado genericamente para o ser humano. “Toda pessoa” preserva a abrangência distributiva e soa mais inequivocamente genérico no português moderno; a forma literal é registrada em nota.
- issue: Natureza da ação divina em וְהִשְׁלִיטוֹ
  choice: capacitou
  alternative: deu poder / permitiu
  rationale: A frase afirma que a capacidade de usufruir os bens também procede de Deus, não apenas a posse deles. “Capacitou” mantém esse sentido sem impor uma formulação doutrinária mais forte.
- issue: Sentido de חלק em Eclesiastes
  choice: porção
  alternative: parte / quinhão
  rationale: “Porção” preserva o motivo sapiencial da parte atribuída à pessoa na vida, sem definir além do texto como essa atribuição opera.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A sintaxe conserva a sequência cumulativa do hebraico, enquanto “toda pessoa”, “capacitou” e “receber sua porção” evitam rigidez desnecessária. Todos os marcadores de nota aparecem no texto principal.
