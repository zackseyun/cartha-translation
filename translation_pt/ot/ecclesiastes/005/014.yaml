  text: כַּ/אֲשֶׁ֤ר יָצָא֙ מִ/בֶּ֣טֶן אִמּ֔/וֹ עָר֛וֹם יָשׁ֥וּב לָ/לֶ֖כֶת כְּ/שֶׁ/בָּ֑א וּ/מְא֨וּמָה֙ לֹא יִשָּׂ֣א בַ/עֲמָל֔/וֹ שֶׁ/יֹּלֵ֖ךְ בְּ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/014.yaml
  text: As he came from his mother’s womb[a], naked he will return, going as he came; and he will carry away nothing from his labor that he can take in his hand.
translation:
  language: pt
  text: Assim como saiu do ventre de sua mãe, nu voltará, indo embora como veio; e nada levará do seu trabalho que possa levar na mão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Assim como
  rationale: Introduz de modo natural a comparação entre a chegada ao mundo e a partida dele.
- source_word: יָצָא מִבֶּטֶן אִמּוֹ
  choice: saiu do ventre de sua mãe
  rationale: Mantém a imagem concreta do nascimento e traduz diretamente o movimento expresso pelo hebraico.
- source_word: עָרוֹם
  choice: nu
  rationale: Expressa a nudez literal e a condição de quem nada possui ao nascer e ao morrer.
- source_word: יָשׁוּב לָלֶכֶת כְּשֶׁבָּא
  choice: voltará, indo embora como veio
  rationale: Preserva tanto a ideia de retorno quanto o verbo de movimento, deixando claro em português que se trata da partida desta vida.
- source_word: וּמְאוּמָה לֹא יִשָּׂא
  choice: e nada levará
  rationale: Reproduz a negação absoluta e, no contexto da morte, o sentido de não levar consigo coisa alguma.
- source_word: בַעֲמָלוֹ
  choice: do seu trabalho
  rationale: Traduz עָמָל de modo corrente, preservando a referência ao esforço e ao fruto do labor recorrente em Eclesiastes.
- source_word: שֶׁיֹּלֵךְ בְּיָדוֹ
  choice: que possa carregar nas mãos
  rationale: Conserva a imagem concreta de levar algo na mão; o plural idiomático em português evita uma formulação artificial sem alterar o sentido.
theological_decisions:
- issue: O sentido de “voltará”
  choice: Manter “voltará” sem explicitar o destino
  alternative: voltará ao pó / voltará ao ventre da terra
  rationale: O texto hebraico não nomeia aqui o destino do retorno. A tradução preserva essa concisão e não introduz uma interpretação ausente do versículo.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção proverbial e imagens concretas preservadas. “Indo embora” esclarece o valor contextual de לָלֶכֶת sem explicar além do texto.
