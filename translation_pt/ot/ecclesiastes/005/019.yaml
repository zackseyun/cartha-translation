base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/019.yaml
  text: For he will not remember much the days of his life[b][a], because God keeps him occupied with the joy of his heart.
translation:
  language: pt
  text: Pois ele não se lembrará muito dos dias de sua vida[a], porque Deus o mantém ocupado com a alegria de seu coração[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «não ficará pensando muito nos dias de sua vida». O verbo hebraico significa literalmente «lembrar-se», mas, neste contexto, também pode indicar ocupar o pensamento com algo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, mais literalmente: «porque Deus lhe responde com a alegria de seu coração». O verbo hebraico pode significar «responder», embora, neste contexto, provavelmente tenha o sentido de manter alguém ocupado ou absorvido pela alegria.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: A primeira ocorrência introduz a explicação da afirmação anterior; “Pois” preserva essa ligação de modo natural e digno.
- source_word: לֹא הַרְבֵּה
  choice: pouco
  rationale: A construção adverbial indica que a pessoa não se lembrará muito ou com frequência; “pouco” expressa isso com concisão em português.
- source_word: יִזְכֹּר
  choice: se lembrará
  rationale: Mantém o sentido lexical básico de זכר, “lembrar-se”, sem substituir a expressão por uma interpretação contextual como “ficar pensando”.
- source_word: אֶת יְמֵי חַיָּיו
  choice: dos dias da sua vida
  rationale: Preserva a imagem e a formulação característica do hebraico em português claro.
- source_word: כִּי
  choice: porque
  rationale: A segunda ocorrência introduz a causa da afirmação precedente.
- source_word: הָאֱלֹהִים
  choice: Deus
  rationale: Refere-se diretamente a Deus neste contexto; o português dispensa artigo.
- source_word: מַעֲנֶה
  choice: o mantém ocupado
  rationale: No contexto da dádiva divina de desfrutar a vida, o particípio provavelmente descreve Deus mantendo a pessoa absorvida ou ocupada, embora o sentido mais literal “responde” permaneça possível e seja registrado em nota.
- source_word: בְּשִׂמְחַת לִבּוֹ
  choice: com a alegria do seu coração
  rationale: Conserva a imagem hebraica do coração e permite que a preposição indique o meio ou a esfera da ação divina.
theological_decisions:
- issue: Sentido da ação divina em מַעֲנֶה
  choice: Deus mantém a pessoa ocupada com alegria
  alternative: Deus lhe responde com a alegria do seu coração
  rationale: O contexto imediato apresenta a capacidade de desfrutar a vida como dádiva de Deus, favorecendo o sentido positivo de manter alguém ocupado ou absorvido. A possibilidade lexical mais literal, “responde”, é preservada em nota para não eliminar a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. A ordem das orações e a imagem “dias da sua vida” foram preservadas, enquanto “pouco se lembrará” evita uma formulação excessivamente rígida.
