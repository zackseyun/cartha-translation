  text: אֹהֵ֥ב כֶּ֨סֶף֙ לֹא יִשְׂבַּ֣ע כֶּ֔סֶף וּ/מִֽי אֹהֵ֥ב בֶּ/הָמ֖וֹן לֹ֣א תְבוּאָ֑ה גַּם זֶ֖ה הָֽבֶל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/009.yaml
  text: Whoever loves silver will not be satisfied with silver[a], nor whoever loves abundance with income[b]; this too is vapor.
translation:
  language: pt
  text: Quem ama a prata não se satisfaz com prata, nem quem ama a abundância se satisfaz com ganhos.[a] Também isso é vapor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A segunda oração é sintaticamente difícil. Também pode ser traduzida: “e quem ama a riqueza não se satisfaz com a renda”. “Abundância” pode significar “riqueza”, e “ganhos” também pode ser entendido como “rendimento”, “aumento” ou “produto”.'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “vapor” (tradicionalmente, “vaidade”); termo recorrente em Eclesiastes para aquilo que é fugaz, esquivo ou insubstancial.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֵב
  choice: quem ama
  rationale: O particípio tem sentido genérico e descreve qualquer pessoa caracterizada pelo amor ao dinheiro; “quem ama” é natural e preserva essa força.
- source_word: כֶּסֶף
  choice: prata
  rationale: O termo significa literalmente “prata” e, por metonímia, “dinheiro”. “Prata” conserva a imagem e a repetição poética do hebraico.
- source_word: יִשְׂבַּע
  choice: não se satisfaz
  rationale: O verbo expressa estar saciado ou satisfeito. O presente genérico comunica naturalmente a insaciabilidade descrita pelo yiqtol hebraico.
- source_word: וּמִי
  choice: nem quem
  rationale: A combinação introduz aqui uma declaração paralela, não uma pergunta literal. “Nem quem” mantém o paralelismo e a ligação negativa com a primeira oração.
- source_word: בֶּהָמוֹן
  choice: abundância
  rationale: הָמוֹן pode indicar abundância, riqueza ou grande quantidade. “Abundância” preserva a amplitude sem especificar além do texto.
- source_word: תְבוּאָה
  choice: ganhos
  rationale: O substantivo pode significar produto, rendimento, aumento ou ganho. Neste contexto econômico, “ganhos” comunica de modo claro o retorno financeiro sem restringi-lo a salário ou renda regular.
- source_word: הָבֶל
  choice: vapor
  rationale: Termo-chave de Eclesiastes para aquilo que é fugaz, esquivo ou inconsistente. “Vapor” conserva a metáfora concreta melhor que “vaidade” ou a interpretação mais conclusiva “sem sentido”.
theological_decisions:
- issue: Tradução do refrão הָבֶל em Eclesiastes
  choice: vapor
  alternative: vaidade; sopro; absurdo; sem sentido
  rationale: “Vapor” preserva a imagem de transitoriedade e inconsistência sem reduzir o termo a uma única conclusão abstrata sobre o sentido da vida.
- issue: Sintaxe da segunda oração
  choice: 'declaração paralela elíptica: “nem quem ama a abundância, com ganhos”'
  alternative: “e quem ama a riqueza não se satisfaz com a renda”
  rationale: A sintaxe hebraica é difícil e omite um verbo expresso na segunda oração. A tradução mantém a elipse e o paralelismo sem esconder a incerteza, que é registrada em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “prata” conserva o efeito poético do original; a elipse depois de “nem quem ama a abundância” reproduz de modo natural a estrutura paralela e difícil do hebraico.
