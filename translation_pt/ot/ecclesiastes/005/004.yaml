  text: ט֖וֹב אֲשֶׁ֣ר לֹֽא תִדֹּ֑ר מִ/שֶׁ/תִּדּ֖וֹר וְ/לֹ֥א תְשַׁלֵּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/004.yaml
  text: It is better that you should not vow than that you should vow and not fulfill it[a].
translation:
  language: pt
  text: É melhor não fazer um voto do que fazer um voto e não cumpri-lo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, «e não pagá-lo». Aqui, «pagar» significa cumprir o voto.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: É melhor
  rationale: O adjetivo predicativo expressa uma avaliação comparativa; a construção idiomática portuguesa «É melhor» preserva esse sentido.
- source_word: אֲשֶׁר
  choice: não fazer um voto
  rationale: Neste contexto, introduz o primeiro termo da comparação; em português natural, seu valor é incorporado à construção infinitiva depois de «É melhor».
- source_word: לֹא תִדֹּר
  choice: não fazer um voto
  rationale: O imperfeito qal de נדר ocorre numa máxima geral. A construção com infinitivo comunica com clareza o ato de assumir solenemente um compromisso.
- source_word: מִשֶׁתִּדּוֹר
  choice: do que fazer um voto
  rationale: 'A combinação comparativa מִן + אֲשֶׁר introduz o segundo termo: «do que». A repetição de «fazer um voto» mantém o paralelismo.'
- source_word: וְלֹא תְשַׁלֵּם
  choice: e não cumpri-lo
  rationale: O piel de שלם, aplicado a um voto, significa pagá-lo ou levá-lo a cumprimento. «Cumpri-lo» transmite naturalmente o sentido contextual, com o pronome retomando «voto».
