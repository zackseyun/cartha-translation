  text: כַּ/אֲשֶׁר֩ תִּדֹּ֨ר נֶ֜דֶר לֵֽ/אלֹהִ֗ים אַל תְּאַחֵר֙ לְ/שַׁלְּמ֔/וֹ כִּ֛י אֵ֥ין חֵ֖פֶץ בַּ/כְּסִילִ֑ים אֵ֥ת אֲשֶׁר תִּדֹּ֖ר שַׁלֵּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/003.yaml
  text: When you make a vow to God[a], do not delay in paying it, for he takes no pleasure in fools[b]. Pay what you vow.
translation:
  language: pt
  text: Quando você fizer um voto a Deus, não demore a cumpri-lo[a], pois ele não se agrada dos tolos[b]. Cumpra o que você prometer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não demore a pagá-lo”. O verbo hebraico pode significar pagar, completar ou cumprir aquilo que foi prometido em voto.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “pois não há prazer nos tolos”. O sujeito está implícito; pelo contexto, o sentido provável é que Deus não se agrada dos tolos.'
    reason: alternative_reading
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Quando
  rationale: Introduz a circunstância temporal em que o voto é feito. “Quando” é natural em português e mantém o caráter geral da advertência.
- source_word: תִּדֹּר נֶדֶר
  choice: fizer um voto
  rationale: A construção cognata hebraica, literalmente “votar um voto”, é expressa de modo natural e digno em português por “fazer um voto”.
- source_word: לֵאלֹהִים
  choice: a Deus
  rationale: O contexto de culto e de votos em Eclesiastes aponta para o Deus de Israel; por isso, usa-se o singular com inicial maiúscula.
- source_word: אַל תְּאַחֵר
  choice: não demore
  rationale: Transmite diretamente a proibição de adiar o cumprimento do voto.
- source_word: לְשַׁלְּמוֹ
  choice: a cumpri-lo
  rationale: O verbo שׁלם pode indicar pagar, completar ou cumprir uma obrigação. Em português, “cumprir um voto” é a expressão mais natural e abrange votos que não envolvem necessariamente pagamento em dinheiro.
- source_word: כִּי אֵין חֵפֶץ
  choice: pois ele não se agrada
  rationale: A formulação portuguesa explicita com o pronome “ele” o sujeito que o hebraico deixa implícito, preservando ao mesmo tempo a nota de ambiguidade.
- source_word: בַּכְּסִילִים
  choice: dos tolos
  rationale: “Tolos” conserva a categoria moral e espiritual própria da literatura sapiencial, sem reduzi-la a mera falta de inteligência.
- source_word: אֵת אֲשֶׁר תִּדֹּר שַׁלֵּם
  choice: Cumpra o que você prometer
  rationale: Mantém a ordem imperativa e a concisão do encerramento, com uma formulação idiomática em português. “Prometer” comunica aqui o ato solene de assumir o voto já mencionado.
theological_decisions:
- issue: Sujeito implícito em כִּי אֵין חֵפֶץ בַּכְּסִילִים
  choice: 'Explicitar Deus por meio de “ele”: “pois ele não se agrada dos tolos”.'
  alternative: 'Traduzir impessoalmente: “pois não há prazer nos tolos”.'
  rationale: O contexto imediato trata de um voto feito a Deus, tornando Deus o referente contextual mais provável. Como o hebraico não apresenta o sujeito de forma explícita, a nota registra a construção literal e preserva a tensão textual.
- issue: Sentido moral de כְּסִילִים
  choice: Usar “tolos” no sentido sapiencial.
  alternative: “insensatos” ou uma expressão que indique apenas baixa capacidade intelectual.
  rationale: Em Eclesiastes, o termo caracteriza pessoas moral e espiritualmente imprudentes, não simplesmente pessoas sem inteligência.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Você” torna a advertência direta sem coloquialismo excessivo. Preferiu-se “cumprir um voto” a “pagar um voto” por ser mais natural e semanticamente abrangente no português contemporâneo.
