base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/015.yaml
  text: 'This too is a grievous evil: exactly as he came[a], so he will go. And what profit is there for him who toils for the wind?'
translation:
  language: pt
  text: 'Também isto é um grave mal: exatamente como veio, assim irá. E que proveito há para quem se afadiga pelo vento[a]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pelo sopro” ou “pelo espírito”; o hebraico רוּחַ pode significar “vento”, “sopro” ou “espírito”. Aqui, “vento” se ajusta melhor ao contexto de trabalho inútil.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה חוֹלָה
  choice: um mal doloroso
  rationale: A expressão combina “mal” com um termo ligado a doença ou sofrimento. “Mal doloroso” comunica a gravidade aflitiva da expressão sem sugerir que se trate literalmente de uma enfermidade.
- source_word: כָּל עֻמַּת שֶׁבָּא
  choice: exatamente como veio
  rationale: עֻמַּת indica correspondência entre a chegada da pessoa ao mundo e sua partida; “exatamente como veio” preserva essa comparação enfática.
- source_word: יֵלֵךְ
  choice: assim irá
  rationale: O imperfeito expressa a certeza geral da partida, no contexto da morte. “Irá” mantém a simplicidade proverbial do hebraico.
- source_word: יִתְרוֹן
  choice: proveito
  rationale: “Proveito” expressa a ideia recorrente em Eclesiastes de ganho, vantagem ou saldo obtido pelo trabalho.
- source_word: שֶׁיַּעֲמֹל
  choice: quem se afadiga
  rationale: O verbo עמל denota trabalho árduo e penoso. “Se afadiga” transmite esse esforço desgastante de modo natural e conciso.
- source_word: לָרוּחַ
  choice: pelo vento
  rationale: רוּחַ pode significar “vento”, “sopro” ou “espírito”. Neste contexto de esforço sem ganho duradouro, “vento” conserva a imagem concreta de futilidade.
theological_decisions:
- issue: Sentido de רוּחַ no contexto sapiencial de esforço inútil
  choice: vento
  alternative: sopro ou espírito
  rationale: “Vento” se ajusta à reflexão imediata sobre a inutilidade de acumular algo que não pode ser levado na morte e evita introduzir uma referência espiritual que o contexto não exige.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Se afadiga” preserva o tom sapiencial e o sentido de trabalho penoso sem soar excessivamente técnico. O marcador foi colocado junto de “vento”, termo ao qual a nota lexical se refere.
