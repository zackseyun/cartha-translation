  text: The land’s profit is for everyone; even a king is served by the field.[a]
translation:
  language: pt
  text: O proveito da terra é para todos; até um rei é servido pelo campo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico é particularmente difícil. Outra tradução possível é: “Para uma terra, em todos os aspectos, é uma vantagem ter um rei dedicado aos campos cultivados”. A oração final também pode ser entendida como “até um rei depende do campo”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִתְרוֹן אֶרֶץ
  choice: O proveito da terra
  rationale: Mantém o termo recorrente יִתְרוֹן como “proveito”, no sentido de vantagem ou ganho, e reproduz de modo conciso a relação com אֶרֶץ.
- source_word: בַּכֹּל
  choice: é para todos
  rationale: Nesta divisão sintática, entende-se que o proveito ou produto da terra alcança todas as pessoas; a leitura adverbial “em todos os aspectos” é preservada na nota.
- source_word: מֶלֶךְ לְשָׂדֶה נֶעֱבָד
  choice: até o rei é servido pelo campo
  rationale: Toma מֶלֶךְ como sujeito do particípio passivo נֶעֱבָד e o campo como aquilo por meio do qual o rei é servido. A construção hebraica comprimida permite outras análises, registradas na nota.
