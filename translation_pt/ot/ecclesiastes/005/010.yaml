base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/010.yaml
  text: When goods increase[a], those who consume them increase[b]; and what advantage is there to their owners except the seeing of their eyes?
translation:
  language: pt
  text: Quando os bens aumentam[a], aumentam também os que os consomem; e que vantagem têm os seus donos, a não ser vê-los com os próprios olhos?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as coisas boas”, “a prosperidade” ou “a riqueza”. O termo hebraico pode indicar o bem material ou a prosperidade em sentido mais amplo; o contexto imediato favorece bens que podem ser consumidos e possuídos.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a visão de seus olhos”. A expressão hebraica sugere que o único benefício do dono talvez seja apenas ver aquilo que possui.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְבוֹת
  choice: Quando ... aumentam
  rationale: 'A preposição בְּ com o infinitivo construto de רבה tem valor temporal: “quando aumentam”. A formulação é natural e mantém a relação temporal.'
- source_word: הַטּוֹבָה
  choice: os bens
  rationale: טוֹבָה pode designar coisas boas, prosperidade ou riqueza. Neste contexto econômico, associado a consumidores e donos, “bens” expressa adequadamente posses materiais sem estreitar o sentido a dinheiro.
- source_word: רַבּוּ
  choice: aumentam
  rationale: 'Repete a raiz רבה e cria um paralelismo: quando os bens aumentam, aumentam os consumidores. A repetição de “aumentam” preserva esse efeito.'
- source_word: אוֹכְלֶיהָ
  choice: os que os consomem
  rationale: Literalmente, “os que a comem”. Como o contexto trata de bens ou riqueza, “consomem” conserva a imagem de algo gasto ou utilizado e pode incluir dependentes e beneficiários.
- source_word: וּמַה כִּשְׁרוֹן
  choice: e que vantagem têm
  rationale: כִּשְׁרוֹן pode indicar vantagem, proveito ou ganho. “Que vantagem têm” forma uma pergunta retórica clara e natural em português.
- source_word: לִבְעָלֶיהָ
  choice: os seus donos
  rationale: בַּעַל significa aqui dono ou possuidor. O sufixo singular retoma o substantivo coletivo hebraico, traduzido no plural como “bens”; “seus donos” mantém a referência com naturalidade.
- source_word: כִּי אִם
  choice: além de
  rationale: Depois da pergunta retórica, a expressão introduz a única exceção ou benefício restante. “Além de” integra-se naturalmente à construção interrogativa.
- source_word: ראית עֵינָיו
  choice: contemplá-los com os próprios olhos
  rationale: A expressão é literalmente “a visão de seus olhos”. A tradução comunica o sentido idiomático de que o dono apenas vê aquilo que possui, mantendo a ênfase visual sem reproduzir uma construção pouco natural em português.
