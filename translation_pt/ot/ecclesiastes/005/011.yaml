base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/011.yaml
  text: Sweet is the sleep of the worker[a], whether he eats little or much, but the abundance of the rich man does not let him sleep.
translation:
  language: pt
  text: Doce é o sono do trabalhador, quer coma pouco, quer coma muito; mas a fartura[a] do rico não o deixa dormir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a plenitude” ou “a saciedade”. O termo hebraico pode indicar abundância, o estado de estar cheio ou satisfação.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְתוּקָה
  choice: Doce
  rationale: Preserva a imagem concreta do hebraico, que emprega a ideia de doçura metaforicamente para caracterizar um sono agradável.
- source_word: שְׁנַת הָעֹבֵד
  choice: o sono do trabalhador
  rationale: A forma construta liga “sono” ao particípio “aquele que trabalha”. “Trabalhador” é claro, natural e mantém o contraste singular com “o rico”.
- source_word: אִם מְעַט וְאִם הַרְבֵּה יֹאכֵל
  choice: quer coma pouco, quer coma muito
  rationale: A construção correlativa apresenta duas possibilidades e indica que o sono é doce independentemente da quantidade ingerida. A repetição de “coma” produz português claro e natural.
- source_word: וְהַשָּׂבָע
  choice: mas a fartura
  rationale: O substantivo pode indicar fartura, plenitude ou saciedade. “Fartura” conserva a relação provável com a abundância do rico sem excluir totalmente a noção de estar cheio.
- source_word: לֶעָשִׁיר
  choice: do rico
  rationale: 'O lamed é entendido como uma relação possessiva: a fartura pertencente ao rico. O singular preserva o contraste individual com “o trabalhador”.'
- source_word: אֵינֶנּוּ מַנִּיחַ לוֹ לִישׁוֹן
  choice: não o deixa dormir
  rationale: Expressa de modo idiomático e fiel a ideia causativa de não permitir que ele durma.
