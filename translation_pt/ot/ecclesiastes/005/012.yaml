  text: 'There is a grievous evil that I have seen under the sun: wealth kept by its owner to his harm[a].'
translation:
  language: pt
  text: 'Há um mal grave que vi debaixo do sol: riqueza guardada por seu dono, para prejuízo de seu dono.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «riqueza guardada para seu dono, para seu prejuízo». As preposições hebraicas podem ser representadas de modo ligeiramente diferente em português, sem alterar o sentido básico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  choice: Há
  rationale: Expressa de modo natural em português a partícula existencial que introduz a observação.
- source_word: רָעָה חוֹלָה
  choice: um mal doloroso
  rationale: רָעָה designa aqui uma realidade má ou danosa, enquanto חוֹלָה, literalmente ligada à enfermidade, intensifica sua gravidade. “Doloroso” conserva algo da imagem e soa natural em português.
- source_word: רָאִיתִי
  choice: que vi
  rationale: Mantém o testemunho pessoal do autor e representa diretamente o perfeito hebraico no contexto narrativo-reflexivo.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: debaixo do sol
  rationale: Preserva a fórmula recorrente de Eclesiastes em linguagem corrente e reconhecível.
- source_word: עֹשֶׁר
  choice: riqueza
  rationale: Equivalente moderno e abrangente para bens ou patrimônio acumulado.
- source_word: שָׁמוּר
  choice: guardada
  rationale: O particípio passivo retrata a riqueza como retida ou conservada; “guardada” preserva essa forma sem impor explicitamente a ideia de avareza.
- source_word: לִבְעָלָיו
  choice: por seu dono
  rationale: בעליו indica o proprietário da riqueza. O ל pode marcar relação ou vantagem, mas, em conexão com o particípio passivo, “por seu dono” comunica naturalmente a agência implícita.
- source_word: לְרָעָתוֹ
  choice: para o próprio prejuízo
  rationale: Expressa o resultado danoso para o proprietário, deixando claro que o prejuízo recai sobre ele.
