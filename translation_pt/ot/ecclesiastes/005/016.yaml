  text: גַּ֥ם כָּל יָמָ֖י/ו בַּ/חֹ֣שֶׁךְ יֹאכֵ֑ל וְ/כָעַ֥ס הַרְבֵּ֖ה וְ/חָלְי֥/וֹ וָ/קָֽצֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/016.yaml
  text: Also[a], all his days he eats in darkness[b], with much vexation and sickness and anger.
translation:
  language: pt
  text: Além disso, todos os seus dias ele come na escuridão[b], com muito aborrecimento[a], doença e ira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “muita irritação”, “muita frustração” ou “muito pesar”; a expressão hebraica é condensada e admite essas nuances.
    reason: lexical_alternative
  - marker: b
    text: “Na escuridão” pode ser entendido literalmente ou como imagem de uma vida sombria e sem alegria.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Além disso
  rationale: Preserva a força aditiva no contexto e liga naturalmente o versículo à condição miserável descrita antes.
- source_word: כָּל יָמָיו
  choice: todos os seus dias
  rationale: Mantém de perto a expressão hebraica e combina com o estilo de Eclesiastes.
- source_word: בַּחֹשֶׁךְ
  choice: na escuridão
  rationale: Conserva a imagem concreta do hebraico sem decidir se ela é literal ou figurada.
- source_word: יֹאכֵל
  choice: passa ... comendo
  rationale: O imperfeito descreve uma ação habitual; esta formulação comunica em português uma existência inteira caracterizada por comer na escuridão.
- source_word: וְכָעַס הַרְבֵּה
  choice: com muita aflição
  rationale: A construção hebraica é comprimida. 'Aflição' expressa sofrimento e perturbação interior sem limitar o termo apenas a irritação ou tristeza.
- source_word: חָלְיוֹ
  choice: doença
  rationale: Traduz concretamente o substantivo que denota enfermidade ou mal.
- source_word: וָקָצֶף
  choice: e ira
  rationale: Preserva a intensidade de קֶצֶף e, no contexto, descreve de modo natural o estado amargurado do homem, sem atribuí-lo explicitamente à ira divina.
theological_decisions:
- issue: Referente da ira
  choice: Mantê-la como parte da experiência ou condição do homem, sem explicitar o possuidor.
  alternative: Interpretá-la expressamente como ira divina contra ele.
  rationale: O hebraico apenas coordena 'ira' com os demais termos e não identifica de modo inequívoco quem sente ou exerce essa ira.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das notas segue sua posição real no texto; a imagem da escuridão e a ambiguidade da expressão ligada a כעס foram preservadas.
