  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הִנֵּ֞ה אֲשֶׁר רָאִ֣יתִי אָ֗נִי ט֣וֹב אֲשֶׁר יָפֶ֣ה לֶֽ/אֶכוֹל וְ֠/לִ/שְׁתּוֹת וְ/לִ/רְא֨וֹת טוֹבָ֜ה בְּ/כָל עֲמָל֣/וֹ שֶׁ/יַּעֲמֹ֣ל תַּֽחַת הַ/שֶּׁ֗מֶשׁ מִסְפַּ֧ר יְמֵי חי/ו אֲשֶׁר נָֽתַן ל֥/וֹ הָ/אֱלֹהִ֖ים כִּי ה֥וּא חֶלְקֽ/וֹ־־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/017.yaml
  text: Behold[a], what I myself have seen to be good and fitting is to eat and to drink and to see good in all the labor at which he labors under the sun during the number of the days of his life that God has given him, for this is his portion.
translation:
  language: pt
  text: 'Eis o que eu mesmo vi ser bom e apropriado: comer, beber e ver o bem[a] em todo o trabalho em que se empenha debaixo do sol, durante o número de dias de sua vida que Deus lhe deu, pois essa é a sua porção.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desfrutar o bem” ou “experimentar o bem”. Literalmente, “ver o bem”.'
    reason: A expressão hebraica é concreta, mas pode ter o sentido idiomático de desfrutar ou experimentar algo bom.
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis
  rationale: Introduz enfaticamente a observação e conserva, em português digno e corrente, a função discursiva e o tom solene do hebraico.
- source_word: רָאִיתִי אָנִי
  choice: eu mesmo vi
  rationale: O pronome explícito אָנִי dá ênfase ao sujeito; “eu mesmo” reproduz essa marca, enquanto “vi” mantém a imagem concreta da observação.
- source_word: טוֹב אֲשֶׁר יָפֶה
  choice: bom e apropriado
  rationale: A combinação exprime tanto bondade quanto adequação. “Apropriado” comunica o valor contextual de יָפֶה sem sugerir apenas beleza estética.
- source_word: לֶאֱכוֹל וְלִשְׁתּוֹת
  choice: comer, beber
  rationale: Os infinitivos são claros em português; a coordenação sem repetir “e” antes de cada item produz uma enumeração natural sem alterar o sentido.
- source_word: וְלִרְאוֹת טוֹבָה
  choice: ver o bem
  rationale: Conserva a formulação concreta e recorrente de Eclesiastes. Como a expressão também pode significar experimentar ou desfrutar o bem, essa possibilidade é indicada em nota.
- source_word: בְּכָל עֲמָלוֹ שֶׁיַּעֲמֹל
  choice: em todo o trabalho em que se empenha
  rationale: “Trabalho” é amplamente compreensível, e “se empenha” expressa o esforço inerente à raiz עמל sem produzir em português a repetição pouco natural “trabalho em que trabalha”.
- source_word: תַּחַת הַשֶּׁמֶשׁ
  choice: debaixo do sol
  rationale: Preserva literalmente o refrão característico de Eclesiastes.
- source_word: מִסְפַּר יְמֵי חַיָּו
  choice: durante o número de dias de sua vida
  rationale: Mantém a referência explícita ao “número” dos dias, sem acrescentar a interpretação “poucos dias”, que não aparece no texto deste versículo.
- source_word: אֲשֶׁר נָתַן לוֹ הָאֱלֹהִים
  choice: que Deus lhe deu
  rationale: Reproduz diretamente a oração relativa e o sentido simples de הָאֱלֹהִים no contexto.
- source_word: כִּי הוּא חֶלְקוֹ
  choice: pois essa é a sua porção
  rationale: “Porção” conserva a ideia temática da parte que cabe à pessoa, sem reduzir a expressão a destino ou acaso.
theological_decisions:
- issue: Masculino singular de valor representativo na literatura de sabedoria
  choice: sujeito singular implícito, retomado por “sua” e “lhe”
  alternative: “o homem” ou “uma pessoa” como sujeito explícito
  rationale: O hebraico emprega formas masculinas singulares, mas não introduz aqui um substantivo equivalente a “homem”. O português permite conservar a referência singular sem acrescentar um sujeito nominal e sem resolver além do texto o alcance representativo da formulação.
- issue: Sentido da expressão וְלִרְאוֹת טוֹבָה
  choice: ver o bem
  alternative: desfrutar o bem; experimentar o bem
  rationale: A tradução principal preserva a imagem e a dicção recorrente do hebraico; a nota registra os sentidos idiomáticos possíveis, mantendo a abertura semântica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi levemente ajustada para soar natural, preservando o refrão “debaixo do sol”, a ênfase de “eu mesmo”, a referência ao “número de dias” e a imagem deliberadamente literal “ver o bem”.
