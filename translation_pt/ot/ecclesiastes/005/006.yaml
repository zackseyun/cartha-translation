  yaml_path: translation/ot/ecclesiastes/005/006.yaml
  text: For in many dreams and vanities there are also many words[b][a]; but fear God.
translation:
  language: pt
  text: Pois, em muitos sonhos, há coisas vãs[b] e muitas palavras[a]; mas tema a Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois, em muitos sonhos, há coisas vãs e muitas palavras; portanto, tema a Deus.” O hebraico é elíptico, e o segundo כי pode ter sentido contrastivo ou conclusivo.'
    reason: alternative_reading
  - marker: b
    text: “Coisas vãs” traduz o plural de hebel, termo recorrente em Eclesiastes para aquilo que é fugaz, inconsistente ou vazio.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי (inicial)
  choice: Pois
  rationale: Introduz a razão ou explicação ligada à advertência anterior e mantém de modo natural a força conectiva do hebraico.
- source_word: בְרֹב חֲלֹמוֹת
  choice: em muitos sonhos
  rationale: Preserva a ideia de abundância expressa por בְרֹב e o plural concreto חֲלֹמוֹת, sem eliminar o caráter condensado da frase.
- source_word: הֲבָלִים
  choice: coisas vãs
  rationale: O plural de הֶבֶל evoca aquilo que é fugaz, inconsistente ou vazio. “Coisas vãs” é mais claro no português corrente do que o plural isolado “vaidades”, que pode sugerir sobretudo orgulho pessoal.
- source_word: וּדְבָרִים הַרְבֵּה
  choice: também muitas palavras
  rationale: Traduz diretamente a abundância de fala; “também” explicita com moderação a relação elíptica entre os elementos da oração.
- source_word: כִּי (segundo)
  choice: mas
  rationale: No contexto, pode introduzir o contraste ou a conclusão principal depois da observação elíptica sobre sonhos, coisas vãs e palavras. A nota preserva outras relações possíveis.
- source_word: אֶת הָאֱלֹהִים יְרָא
  choice: tema a Deus
  rationale: Mantém o objeto enfático e o imperativo singular de ירא, além da formulação característica da tradição sapiencial.
theological_decisions:
- issue: Sentido de ירא no contexto sapiencial
  choice: tema a Deus
  alternative: reverencie a Deus
  rationale: “Temer a Deus” preserva a tensão entre temor, reverência e submissão, sem reduzir o verbo a mero medo nem suavizá-lo para simples respeito.
- issue: Relação do segundo כִּי com a exortação
  choice: mas tema a Deus
  alternative: portanto, tema a Deus
  rationale: A partícula admite força contrastiva ou inferencial nesta construção elíptica. O texto principal usa o contraste, enquanto a nota registra a incerteza sintática.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção deliberadamente concisa para refletir a elipse hebraica. “Tema a Deus” conserva a linguagem sapiencial tradicional sem recorrer a formulação denominacional.
