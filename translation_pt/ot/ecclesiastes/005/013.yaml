- from: E aquela riqueza se perdeu num empreendimento desastroso[a]; depois ele gerou um filho, mas já não tinha coisa alguma em suas mãos.[b]
  to: E aquela riqueza se perdeu num empreendimento desastroso[a], e ele teve um filho, e não havia coisa alguma em sua mão.[b]
  rationale: A revisão remove inferências temporais e adversativas não explicitadas, restaura o singular da imagem hebraica («em sua mão») e harmoniza a nota literal com o texto-fonte. «Teve um filho» oferece registro moderno e natural, mantendo a referência específica a um filho homem.
