  text: And that wealth was lost in a bad venture[b][a], and he fathered a son and had nothing in his hand.
translation:
  language: pt
  text: E aquela riqueza se perdeu num empreendimento desastroso[a], e ele teve um filho, e não havia coisa alguma em sua mão.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por causa de um negócio infeliz” ou “numa circunstância ruim”. A expressão hebraica pode se referir tanto a um empreendimento prejudicial quanto a uma situação adversa.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “e não havia coisa alguma em sua mão”, expressão que significa que ele nada possuía.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָבַד
  choice: se perdeu
  rationale: O qal perfeito tem הָעֹשֶׁר como sujeito. A construção pronominal é natural em português e expressa a perda sem especificar uma causa ou agente não declarado.
- source_word: הָעֹשֶׁר הַהוּא
  choice: aquela riqueza
  rationale: Preserva o substantivo coletivo עֹשֶׁר e a força do artigo com o demonstrativo, retomando a riqueza mencionada no contexto.
- source_word: בְּעִנְיַן רָע
  choice: num empreendimento desastroso
  rationale: עִנְיָן pode indicar assunto, atividade, negócio ou circunstância; no contexto econômico, “empreendimento” é natural, enquanto “desastroso” comunica o efeito nocivo de רָע sem atribuir necessariamente maldade moral.
- source_word: וְהוֹלִיד
  choice: depois ele gerou
  rationale: O hifil de ילד significa gerar ou tornar-se pai. “Gerou” preserva o sujeito masculino e é digno e compreensível; “depois” explicita apenas a progressão narrativa indicada pelo waw, sem afirmar causalidade.
- source_word: בֵּן
  choice: um filho
  rationale: O hebraico especifica um filho do sexo masculino, distinção mantida na tradução.
- source_word: וְאֵין בְּיָדוֹ מְאוּמָה
  choice: mas já não tinha coisa alguma em suas mãos
  rationale: Mantém a imagem concreta de “em sua mão” e transmite seu sentido possessivo. “Mas” torna clara a adversidade contextual, e “já” relaciona a carência à perda anteriormente narrada.
