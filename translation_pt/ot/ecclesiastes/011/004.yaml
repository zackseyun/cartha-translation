  text: Whoever watches the wind will not sow[a], and whoever looks at the clouds will not reap.
translation:
  language: pt
  text: Quem observa o vento não semeará, e quem olha para as nuvens não colherá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֹׁמֵר
  choice: fica observando
  rationale: O particípio indica atenção contínua ou habitual. “Fica observando” soa natural em português e, no contexto, sugere a hesitação de quem espera condições ideais, sem atribuir ao verbo o sentido protetor de “guardar”.
- source_word: רוּחַ
  choice: vento
  rationale: A referência à semeadura e o paralelismo com as nuvens exigem aqui o sentido meteorológico, não “espírito” nem “fôlego”.
- source_word: יִזְרָע
  choice: não semeará
  rationale: O imperfeito expressa o resultado geral formulado pelo provérbio. O futuro em português preserva com clareza essa relação de consequência.
- source_word: וְרֹאֶה
  choice: e quem fica olhando
  rationale: O particípio forma um sujeito genérico paralelo ao da primeira oração. “Fica olhando” mantém o aspecto habitual e evita uma repetição rígida de “observando”.
- source_word: בֶעָבִים
  choice: para as nuvens
  rationale: Depois de “olhar”, a preposição hebraica é vertida idiomaticamente por “para”; “nuvens” conserva diretamente a imagem meteorológica.
- source_word: יִקְצוֹר
  choice: não colherá
  rationale: “Colher” é o equivalente corrente e compreensível para ceifar ou recolher a safra, preservando o par agrícola semear–colher.
