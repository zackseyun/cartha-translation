  text: Give a portion to seven[a], and even to eight, for you do not know what disaster will happen on the earth.
translation:
  language: pt
  text: Dê uma porção a sete e também a oito, pois você não sabe que calamidade haverá na terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no território” ou “no país”. O hebraico אֶרֶץ pode significar “terra”, “território” ou “país”, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּן
  choice: Dê
  rationale: Imperativo qal de נתן. “Dê” expressa de modo direto e natural a exortação.
- source_word: חֵלֶק
  choice: uma porção
  rationale: חֵלֶק designa uma porção ou parte; a escolha preserva o caráter concreto da distribuição.
- source_word: לְשִׁבְעָה וְגַם לִשְׁמוֹנָה
  choice: a sete, e até a oito
  rationale: Mantém a fórmula numérica hebraica e sua progressão retórica, sem reduzi-la a uma paráfrase sobre generosidade ou diversificação.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da exortação com uma conexão causal clara e digna em português.
- source_word: לֹא תֵדַע
  choice: você não sabe
  rationale: Reproduz diretamente a negação e o sentido do verbo, sem intensificá-lo para “não pode saber”.
- source_word: מַה יִּהְיֶה
  choice: que ... acontecerá
  rationale: Neste contexto, היה aponta para a ocorrência futura de um acontecimento; “acontecerá” é natural em português.
- source_word: רָעָה
  choice: calamidade
  rationale: Aqui רָעָה indica adversidade ou acontecimento danoso, não necessariamente mal moral. “Calamidade” preserva esse sentido sem exagero.
- source_word: עַל הָאָרֶץ
  choice: sobre a terra
  rationale: אֶרֶץ pode significar “terra” em sentido amplo ou “território/país”. “Sobre a terra” combina com o alcance geral da reflexão, mantendo a alternativa em nota.
theological_decisions:
- issue: Alcance de הָאָרֶץ
  choice: terra
  alternative: território ou país
  rationale: O contexto sapiencial geral favorece o sentido amplo de “terra”, mas o hebraico também admite uma referência mais localizada; a nota preserva essa ambiguidade lexical.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura numérica deliberadamente incomum foi mantida para preservar a forma literária e a abertura interpretativa do hebraico.
