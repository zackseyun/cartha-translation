id: ECC.11.5
reference: Ecclesiastes 11:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֨ר אֵֽינְ/ךָ֤ יוֹדֵ֨עַ֙ מַה דֶּ֣רֶךְ הָ/ר֔וּחַ כַּ/עֲצָמִ֖ים בְּ/בֶ֣טֶן הַ/מְּלֵאָ֑ה כָּ֗כָה לֹ֤א תֵדַע֙ אֶת מַעֲשֵׂ֣ה הָֽ/אֱלֹהִ֔ים אֲשֶׁ֥ר יַעֲשֶׂ֖ה אֶת הַ/כֹּֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/005.yaml
  text: Just as you do not know the way of the wind[a], or how the bones form in the womb of a pregnant woman, so you do not know the work of God[b], who makes everything.
translation:
  language: pt
  text: Assim como você não sabe qual é o caminho do vento[a], nem como se formam os ossos no ventre de uma mulher grávida[b], também não conhece a obra de Deus, que faz todas as coisas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o caminho do espírito” ou “como vai o sopro”; a palavra hebraica רוּחַ pode significar “vento”, “sopro” ou “espírito”.
    reason: alternative_reading
  - marker: b
    text: Literalmente, “no ventre da que está cheia”, expressão que se refere a uma mulher grávida.
    reason: cultural_note
lexical_decisions:
- source_word: דֶּרֶךְ הָרוּחַ
  choice: o caminho do vento
  rationale: רוּחַ pode significar “vento”, “sopro” ou “espírito”. Neste contexto de processos naturais ocultos ao conhecimento humano, “vento” se encaixa melhor; “caminho” preserva de modo natural o sentido de דֶּרֶךְ.
- source_word: כַּעֲצָמִים
  choice: como se formam os ossos
  rationale: A expressão hebraica é elíptica. A explicitação do processo de formação torna a comparação compreensível em português sem ultrapassar o sentido contextual.
- source_word: בְּבֶטֶן הַמְּלֵאָה
  choice: no ventre de uma mulher grávida
  rationale: A expressão significa literalmente “no ventre da que está cheia” e se refere idiomaticamente a uma mulher grávida.
- source_word: מַעֲשֵׂה הָאֱלֹהִים
  choice: a obra de Deus
  rationale: A formulação preserva o substantivo מַעֲשֵׂה e expressa com naturalidade a ação divina no contexto sapiencial.
- source_word: אֲשֶׁר יַעֲשֶׂה אֶת־הַכֹּל
  choice: que faz todas as coisas
  rationale: A oração relativa descreve naturalmente Deus como aquele que faz tudo; “todas as coisas” comunica com clareza a abrangência de הַכֹּל.
theological_decisions:
- issue: Sentido de רוּחַ neste versículo
  choice: vento
  alternative: espírito ou sopro
  rationale: O contexto ressalta a ignorância humana diante de processos da criação e da ação providencial de Deus. “Vento” favorece essa analogia sem impor um sentido antropológico ou pneumatológico; a ambiguidade real do hebraico é preservada em nota.
- issue: Relação da oração אֲשֶׁר יַעֲשֶׂה אֶת־הַכֹּל
  choice: a oração descreve Deus como aquele que faz todas as coisas
  alternative: a oração pode ser entendida de forma mais impessoal, ligada à obra que Deus realiza em tudo
  rationale: A concordância semântica e a leitura mais direta favorecem Deus como antecedente, mas a tradução evita desenvolver implicações doutrinárias além da afirmação abrangente do texto.
translation_notes:
  register: Português moderno, digno e acessível, com construção corrente tanto no Brasil quanto em outros contextos lusófonos. “Você” comunica diretamente o singular hebraico; “ventre” mantém o tom sapiencial sem soar arcaico. A elipse hebraica sobre os ossos foi explicitada apenas o necessário para a compreensão.
