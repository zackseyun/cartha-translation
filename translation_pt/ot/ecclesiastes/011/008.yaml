  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י אִם שָׁנִ֥ים הַרְבֵּ֛ה יִחְיֶ֥ה הָ/אָדָ֖ם בְּ/כֻלָּ֣/ם יִשְׂמָ֑ח וְ/יִזְכֹּר֙ אֶת יְמֵ֣י הַ/חֹ֔שֶׁךְ כִּֽי הַרְבֵּ֥ה יִהְי֖וּ כָּל שֶׁ/בָּ֥א הָֽבֶל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/008.yaml
  text: For if a man lives many years[a], let him rejoice in them all; but let him remember the days of darkness, for they will be many. All that comes is vapor.
translation:
  language: pt
  text: Pois, se alguém viver muitos anos, alegre-se em todos eles; mas lembre-se dos dias de escuridão, pois serão muitos. Tudo o que vier é vapor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Tudo o que vier é sopro”; tradicionalmente, “vaidade”. O hebraico hével é um termo recorrente em Eclesiastes para aquilo que é passageiro, insubstancial ou difícil de compreender e reter.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Pois, ainda que
  rationale: A combinação liga o versículo ao contexto com força explicativa e introduz uma concessão/condição de longa vida. Em português, “Pois, ainda que” expressa naturalmente essa relação.
- source_word: שָׁנִים הַרְבֵּה
  choice: muitos anos
  rationale: Refere-se diretamente a uma vida longa e preserva a expressão hebraica sem ampliação.
- source_word: הָאָדָם
  choice: alguém
  rationale: O substantivo singular tem aqui sentido representativo e genérico. “Alguém” mantém a referência individual e universal sem sugerir que a afirmação se limite ao sexo masculino.
- source_word: בְּכֻלָּם
  choice: em todos eles
  rationale: Retoma “muitos anos” e conserva a construção preposicional do hebraico em português natural.
- source_word: יִשְׂמָח
  choice: alegre-se
  rationale: O valor volitivo/exortativo do imperfeito é bem representado pelo subjuntivo exortativo português.
- source_word: וְיִזְכֹּר
  choice: mas lembre-se
  rationale: Embora a conjunção seja formalmente aditiva, o contexto cria contraste entre desfrutar os anos e ter em mente os dias sombrios; “mas” torna essa relação clara sem eliminar a tensão.
- source_word: יְמֵי הַחֹשֶׁךְ
  choice: os dias de escuridão
  rationale: Preserva a metáfora e sua ambiguidade, que pode abranger adversidade, velhice, morte ou a escuridão da sepultura.
- source_word: כִּי הַרְבֵּה יִהְיוּ
  choice: pois serão muitos
  rationale: Apresenta a razão para lembrar esses dias e retoma naturalmente “dias de escuridão”.
- source_word: כָּל שֶׁבָּא
  choice: Tudo o que vier
  rationale: Mantém o alcance abrangente da expressão e, com o futuro do subjuntivo, transmite em português aquilo que ainda há de vir, sem restringir o referente.
- source_word: הָבֶל
  choice: vapor
  rationale: 'Preserva a imagem concreta recorrente de Eclesiastes: algo passageiro, insubstancial e difícil de reter. Evita a interpretação mais estreita de “sem sentido”.'
theological_decisions:
- issue: Sentido genérico de הָאָדָם
  choice: alguém
  alternative: o homem / uma pessoa
  rationale: O hebraico se refere genericamente a um ser humano individual. “Alguém” comunica esse alcance em português contemporâneo sem transformar a expressão em referência coletiva nem restringi-la aos homens.
- issue: Valor de הָבֶל em Eclesiastes
  choice: vapor
  alternative: vaidade / sopro / sem sentido
  rationale: “Vapor” conserva a metáfora central e permite que permaneçam juntas as ideias de transitoriedade, insubstancialidade e caráter elusivo, sem impor a conclusão interpretativa de que tudo seja destituído de sentido.
- issue: Referência dos “dias de escuridão”
  choice: metáfora preservada sem explicitação
  alternative: dias de adversidade / velhice / morte
  rationale: O texto não identifica de modo inequívoco esses dias. A tradução mantém a tensão poética e deixa abertas as referências sugeridas pelo contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o paralelismo exortativo e a metáfora central do hebraico; o ponto e vírgula preserva o contraste entre alegria e lembrança da escuridão.
