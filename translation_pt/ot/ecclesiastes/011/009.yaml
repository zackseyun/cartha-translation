  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שְׂמַ֧ח בָּח֣וּר בְּ/יַלְדוּתֶ֗י/ךָ וִֽ/יטִֽיבְ/ךָ֤ לִבְּ/ךָ֙ בִּ/ימֵ֣י בְחוּרוֹתֶ֔/ךָ וְ/הַלֵּךְ֙ בְּ/דַרְכֵ֣י לִבְּ/ךָ֔ וּ/בְ/מַרְאֵ֖י עֵינֶ֑י/ךָ וְ/דָ֕ע כִּ֧י עַל כָּל אֵ֛לֶּה יְבִֽיאֲ/ךָ֥ הָ/אֱלֹהִ֖ים בַּ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/009.yaml
  text: Rejoice[a], young man, in your youth, and let your heart cheer you in the days of your young manhood. Walk in the ways of your heart and in the sight of your eyes[d][c][b], but know that for all these things God will bring you into judgment.
translation:
  language: pt
  text: Alegre-se, jovem, na sua juventude, e que o seu coração lhe dê alegria nos dias do seu vigor juvenil. Ande pelos caminhos do seu coração e segundo o que os seus olhos veem.[a] Mas saiba que, por todas essas coisas, Deus o levará a julgamento.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “nas aparências — ou na visão — dos seus olhos”.
    reason: lexical_alternative
  - marker: b
    text: Eclesiastes mantém juntas a alegria de viver e a responsabilidade diante de Deus. O versículo pode ser entendido como uma permissão qualificada ou como uma exortação carregada de advertência.
    reason: alternative_reading
lexical_decisions:
- source_word: שְׂמַח
  choice: Alegre-se
  rationale: Preserva a força do imperativo qal e se harmoniza com as exortações recorrentes de Eclesiastes à alegria.
- source_word: בָּחוּר
  choice: jovem
  rationale: Em português, “jovem” pode designar naturalmente um homem jovem; os pronomes masculinos ao longo do versículo preservam o gênero gramatical do destinatário hebraico sem a expressão menos natural “homem jovem”.
- source_word: בְּיַלְדוּתֶיךָ
  choice: na sua juventude
  rationale: No contexto, indica a fase da juventude, não especificamente a infância.
- source_word: וִיטִיבְךָ לִבְּךָ
  choice: que o seu coração lhe dê alegria
  rationale: Expressa o sentido causativo do hifil de יטב, tendo “seu coração” como sujeito, em linguagem portuguesa clara e natural.
- source_word: בִּימֵי בְחוּרוֹתֶךָ
  choice: nos dias do seu vigor juvenil
  rationale: Distingue a expressão da ocorrência anterior de “juventude” e comunica a ideia da fase de energia e pujança juvenil.
- source_word: וְהַלֵּךְ
  choice: Ande
  rationale: Mantém a metáfora hebraica de andar como modo de conduzir a vida.
- source_word: בְּדַרְכֵי לִבְּךָ
  choice: pelos caminhos do seu coração
  rationale: Preserva tanto a metáfora dos caminhos quanto o coração como centro dos desejos e propósitos.
- source_word: וּבְמַרְאֵי עֵינֶיךָ
  choice: segundo o que os seus olhos veem
  rationale: Traduz de modo inteligível a expressão literalmente relacionada às aparências ou à visão dos olhos, mantendo o paralelismo com os desejos do coração.
- source_word: וְדָע
  choice: Mas saiba
  rationale: Embora a conjunção seja formalmente aditiva, aqui introduz uma advertência que contrabalança as exortações anteriores; “mas” torna essa função discursiva natural em português.
- source_word: עַל כָּל אֵלֶּה
  choice: por todas essas coisas
  rationale: No contexto judicial, expressa prestação de contas referente às escolhas mencionadas.
- source_word: יְבִיאֲךָ הָאֱלֹהִים בַּמִּשְׁפָּט
  choice: Deus o levará a julgamento
  rationale: Reproduz diretamente o sentido causativo de “trazer/levar” e o caráter forense de מִשְׁפָּט em português corrente.
theological_decisions:
- issue: Se o versículo aprova prazer autodirigido sem restrições ou situa a alegria sob a responsabilidade diante de Deus
  choice: Manter como exortações reais tanto o convite à alegria quanto a advertência do julgamento divino.
  alternative: Ler as ordens como ironia condenatória, ou tratá-las como aprovação simples do prazer com uma restrição moral plenamente explicitada.
  rationale: O hebraico sustenta a tensão entre desfrutar a vida e responder diante de Deus. A tradução não acrescenta ironia nem define além do texto os limites exatos da permissão.
- issue: Gênero do destinatário
  choice: Usar “jovem” com formas pronominais masculinas (“o”, “seu”).
  alternative: “pessoa jovem” ou “homem jovem”.
  rationale: O substantivo e os sufixos hebraicos são masculinos singulares. A solução escolhida preserva essa referência em português natural.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega tratamento por “você” de forma implícita por meio de “seu/sua” e verbos na terceira pessoa. Mantém as metáforas bíblicas de andar e dos caminhos do coração, esclarecendo de modo moderado a expressão relativa aos olhos.
