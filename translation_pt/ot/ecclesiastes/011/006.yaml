  text: בַּ/בֹּ֨קֶר֙ זְרַ֣ע אֶת זַרְעֶ֔/ךָ וְ/לָ/עֶ֖רֶב אַל תַּנַּ֣ח יָדֶ֑/ךָ כִּי֩ אֵֽינְ/ךָ֨ יוֹדֵ֜ע אֵ֣י זֶ֤ה יִכְשָׁר֙ הֲ/זֶ֣ה אוֹ זֶ֔ה וְ/אִם שְׁנֵי/הֶ֥ם כְּ/אֶחָ֖ד טוֹבִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/006.yaml
  text: In the morning sow your seed[a], and in the evening do not let your hand rest, for you do not know which will succeed, this or that[b], or whether both alike will be good.
translation:
  language: pt
  text: Pela manhã, semeie a sua semente e, ao entardecer, não deixe a sua mão descansar[a], pois você não sabe qual dará certo, se esta ou aquela[b], ou se ambas serão igualmente boas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expressão idiomática que significa não parar de trabalhar.
    reason: cultural_note
  - marker: b
    text: 'Ou: “qual prosperará, esta ou aquela”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּבֹּקֶר
  choice: Pela manhã
  rationale: Expressa naturalmente em português a circunstância temporal que abre o paralelismo entre manhã e entardecer.
- source_word: זְרַע אֶת זַרְעֶךָ
  choice: semeie a sua semente
  rationale: Preserva a imagem agrícola e a relação verbal entre o verbo 'semear' e o substantivo 'semente'.
- source_word: וְלָעֶרֶב
  choice: e, ao entardecer
  rationale: Mantém a coordenação e o contraste temporal com 'pela manhã' em linguagem portuguesa natural.
- source_word: אַל תַּנַּח יָדֶךָ
  choice: não deixe a sua mão descansar
  rationale: Conserva a imagem concreta do hebraico, cujo sentido idiomático é não interromper o trabalho.
- source_word: כִּי אֵינְךָ יוֹדֵעַ
  choice: pois você não sabe
  rationale: Mantém a relação causal entre a exortação e a incerteza quanto aos resultados.
- source_word: אֵי זֶה יִכְשָׁר
  choice: qual dará certo
  rationale: יִכְשָׁר indica ter êxito, prosperar ou resultar bem; 'dará certo' é claro, atual e adequado ao contexto.
- source_word: הֲזֶה אוֹ זֶה
  choice: se esta ou aquela
  rationale: Reproduz o contraste aberto entre duas iniciativas ou semeaduras sem especificar além do texto.
- source_word: וְאִם שְׁנֵיהֶם כְּאֶחָד טוֹבִים
  choice: ou se ambas serão igualmente boas
  rationale: Preserva a possibilidade de as duas produzirem resultado favorável, bem como a ideia de equivalência expressa por כְּאֶחָד.
