source:
  edition: WLC
  text: אִם יִמָּלְא֨וּ הֶ/עָבִ֥ים גֶּ֨שֶׁם֙ עַל הָ/אָ֣רֶץ יָרִ֔יקוּ וְ/אִם יִפּ֥וֹל עֵ֛ץ בַּ/דָּר֖וֹם וְ/אִ֣ם בַּ/צָּפ֑וֹן מְק֛וֹם שֶׁ/יִּפּ֥וֹל הָ/עֵ֖ץ שָׁ֥ם יְהֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/003.yaml
  text: If the clouds are full of rain[a], they pour it out on the earth; and if a tree falls to the south or to the north, in the place where the tree falls, there it will lie.
translation:
  language: pt
  text: Se as nuvens estiverem carregadas de chuva, elas a derramarão sobre a terra; e, se uma árvore cair para o sul ou para o norte, no lugar onde a árvore cair, ali ficará.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “ali estará”. O verbo hebraico significa simplesmente “ser” ou “estar”; “ficará” expressa com naturalidade, em português, o estado da árvore depois de cair.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּלְאוּ
  choice: estiverem carregadas
  rationale: O nifal de מלא indica que as nuvens estão cheias ou se encheram. “Estiverem carregadas de chuva” é uma expressão portuguesa natural e preserva a imagem de plenitude antes da precipitação.
- source_word: הֶעָבִים
  choice: as nuvens
  rationale: Equivalente comum e direto de עבים neste contexto meteorológico.
- source_word: גֶּשֶׁם
  choice: de chuva
  rationale: Funciona como complemento da ideia de plenitude; a preposição “de” é exigida pela expressão portuguesa escolhida.
- source_word: יָרִיקוּ
  choice: a derramarão
  rationale: O hifil de ריק significa esvaziar ou derramar. O pronome “a” retoma naturalmente “chuva”, objeto implícito no hebraico.
- source_word: עַל הָאָרֶץ
  choice: sobre a terra
  rationale: ארץ pode significar “terra” ou “solo”. Aqui “sobre a terra” preserva a observação ampla e proverbial sobre a natureza.
- source_word: יִפּוֹל עֵץ
  choice: uma árvore cair
  rationale: O imperfeito em uma condição geral é bem representado pelo futuro do subjuntivo português, adequado a uma possibilidade proverbial.
- source_word: בַּדָּרוֹם
  choice: para o sul
  rationale: No contexto da queda de uma árvore, a leitura direcional é natural; evita interpretar a expressão apenas como localização geográfica.
- source_word: בַּצָּפוֹן
  choice: para o norte
  rationale: Mantém o paralelismo direcional com “para o sul”.
- source_word: מְקוֹם שֶׁיִּפּוֹל הָעֵץ
  choice: no lugar onde a árvore cair
  rationale: Conserva o substantivo explícito “lugar” e a repetição de “árvore”, mantendo a estrutura enfática do hebraico.
- source_word: שָׁם יְהוּא
  choice: ali ficará
  rationale: O verbo hebraico significa literalmente “ser/estar”. Para uma árvore já caída, “ficará” expressa em português natural o estado resultante sem ampliar indevidamente a afirmação.
theological_decisions: []
