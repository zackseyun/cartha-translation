base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/001.yaml
  text: Cast your bread upon the surface of the waters, for after many days you will find it.
translation:
  language: pt
  text: Lance o seu pão sobre a superfície das águas[a], pois depois de muitos dias você o encontrará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Envie o seu pão sobre as águas”. A imagem hebraica pode sugerir generosidade, investimento ou ambos; por isso, o texto principal mantém a linguagem figurada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁלַּח
  choice: Lance
  rationale: O imperativo significa literalmente “envie”, “solte” ou “deixe ir”. “Lance” preserva de modo natural a força da imagem proverbial sem explicar antecipadamente sua aplicação.
- source_word: לַחְמְךָ
  choice: o seu pão
  rationale: לֶחֶם designa normalmente “pão”, embora possa abranger alimento em geral. O termo concreto foi mantido para preservar a imagem hebraica.
- source_word: עַל פְּנֵי הַמָּיִם
  choice: sobre a superfície das águas
  rationale: פְּנֵי significa literalmente “face” ou “superfície”. A formulação conserva a imagem explícita do hebraico e o plural “águas”.
- source_word: כִּי
  choice: pois
  rationale: Aqui a conjunção introduz a razão ou motivação para a ordem; “pois” é conciso e apropriado ao estilo proverbial.
- source_word: בְרֹב הַיָּמִים
  choice: depois de muitos dias
  rationale: A expressão indica um intervalo prolongado antes do resultado. A tradução é idiomática e mantém a referência temporal concreta do hebraico.
- source_word: תִּמְצָאֶנּוּ
  choice: você o encontrará
  rationale: O verbo significa “encontrar”, e o sufixo masculino singular retoma naturalmente “pão”. “Encontrará” evita a interpretação adicional implicada por “recuperará”.
theological_decisions:
- issue: Interpretação da imagem proverbial
  choice: Manter a metáfora do pão lançado sobre as águas sem definir uma aplicação específica no texto principal.
  alternative: Explicitar que se trata de generosidade, de empreendimento comercial ou de disposição para assumir riscos.
  rationale: A imagem hebraica admite mais de uma interpretação plausível. Preservá-la mantém a ambiguidade genuína do provérbio e evita inserir uma conclusão moral ou econômica que o versículo não declara diretamente.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A colocação “o seu pão” soa natural e mantém a referência direta ao objeto; “sobre a superfície das águas” conserva a formulação concreta do hebraico sem transformar a metáfora em explicação.
