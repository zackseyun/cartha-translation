base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/007.yaml
  text: And the light is sweet[b][a], and it is good for the eyes to see the sun.
translation:
  language: pt
  text: E a luz é doce[a], e é bom para os olhos ver o sol[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou «agradável»: «a luz é agradável».'
    reason: lexical_alternative
  - marker: b
    text: «Ver o sol» é uma expressão literal que também pode sugerir estar vivo e desfrutar a vida neste mundo.
    reason: cultural_note
lexical_decisions:
- source_word: וּמָתוֹק
  choice: é doce
  rationale: Preserva a metáfora concreta do hebraico מָתוֹק e sua concisão; em uso figurado, o termo também pode significar algo agradável ou deleitoso.
- source_word: הָאוֹר
  choice: a luz
  rationale: Reproduz o substantivo definido hebraico sem especificá-lo excessivamente como «luz do dia».
- source_word: וְטוֹב
  choice: e é bom
  rationale: Traduz diretamente טוֹב e mantém a formulação hebraica ligada à experiência dos olhos.
- source_word: לָעֵינַיִם
  choice: para os olhos
  rationale: Expressa naturalmente em português a relação de referência ou benefício indicada pela preposição hebraica.
- source_word: לִרְאוֹת
  choice: ver
  rationale: É a tradução direta e corrente do infinitivo de ראה, sem acrescentar uma nuance ausente do texto.
- source_word: אֶת־הַשָּׁמֶשׁ
  choice: o sol
  rationale: Mantém a imagem concreta do texto hebraico e não explicita no corpo do versículo sua possível conotação de estar vivo.
theological_decisions:
- issue: Se o sentido implícito de «ver o sol» como estar vivo e desfrutar a vida deve ser explicitado
  choice: Manter no texto principal a expressão literal «ver o sol»
  alternative: Traduzir como «desfrutar a vida»
  rationale: A formulação concreta e poética permite a conotação existencial sem reduzir a imagem a uma única interpretação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A construção conserva a concisão, o paralelismo e as imagens sensoriais do hebraico.
