  text: וְ/הָסֵ֥ר כַּ֨עַס֙ מִ/לִּבֶּ֔/ךָ וְ/הַעֲבֵ֥ר רָעָ֖ה מִ/בְּשָׂרֶ֑/ךָ כִּֽי הַ/יַּלְד֥וּת וְ/הַֽ/שַּׁחֲר֖וּת הָֽבֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/010.yaml
  text: So remove vexation from your heart, and put away harm from your flesh, for youth and the dawn of life are vapor.
translation:
  language: pt
  text: Afaste do seu coração a aflição e livre seu corpo do mal, pois a juventude e o alvorecer da vida são vapor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois a juventude e o tempo dos cabelos escuros são vapor”. A palavra hebraica traduzida por “alvorecer da vida” é rara e tem sentido incerto.'
    reason: Registra uma alternativa lexical importante para שַּׁחֲרוּת e preserva a incerteza real do texto hebraico.
lexical_decisions:
- source_word: כַּעַס
  choice: aflição
  rationale: O termo pode indicar desgosto, irritação, pesar ou inquietação. “Aflição” preserva sua amplitude no contexto sem limitá-lo apenas à raiva.
- source_word: רָעָה
  choice: mal
  rationale: O substantivo é amplo e pode designar mal, dano, sofrimento ou desgraça. “Mal” conserva essa ambiguidade, especialmente na expressão relativa ao corpo.
- source_word: בָּשָׂר
  choice: corpo
  rationale: Embora literalmente seja “carne”, aqui se refere à dimensão física da pessoa; “corpo” é natural e claro em português moderno.
- source_word: שַּׁחֲרוּת
  choice: alvorecer da vida
  rationale: Palavra rara ligada à ideia de negrume/cabelo escuro ou à aurora; no paralelismo com “juventude”, a expressão comunica o começo vigoroso da vida sem esconder a incerteza lexical, registrada em nota.
- source_word: הָבֶל
  choice: vapor
  rationale: Imagem central de Eclesiastes para aquilo que é fugaz, inapreensível e transitório; “vapor” mantém a metáfora concreta, em vez de interpretá-la como “vaidade” ou “inutilidade”.
theological_decisions:
- issue: Sentido de רָעָה na exortação sobre o corpo
  choice: mal
  alternative: dano; sofrimento
  rationale: O hebraico não determina se se trata de conduta má, dano físico ou sofrimento. A tradução mantém a formulação abrangente, sem transformar o verso numa afirmação moral ou médica mais específica.
- issue: Sentido de הָבֶל aplicado à juventude
  choice: vapor
  alternative: vaidade; fugacidade
  rationale: A metáfora enfatiza transitoriedade e inapreensibilidade, sem afirmar necessariamente que a juventude seja inútil ou pecaminosa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição de imperativos foi mantida, e “vapor” preserva a imagem característica de Eclesiastes.
