base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/018.yaml
  text: There were six steps to the throne[a], and a gold footstool attached to the throne, and armrests on this side and on that beside the seat, and two lions standing beside the armrests.
translation:
  language: pt
  text: Havia seis degraus para o trono e um escabelo[a] de ouro preso ao trono, apoios para os braços de um lado e do outro do assento, e dois leões em pé ao lado dos apoios para os braços.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: «uma rampa ou escadaria de ouro presa ao trono». O sentido exato da palavra hebraica כֶּבֶשׁ neste contexto é incerto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלוֹת
  choice: degraus
  rationale: No contexto da arquitetura do trono, designa os degraus de acesso; “degraus” é claro e natural em português.
- source_word: כֶּבֶשׁ
  choice: estrado
  rationale: No contexto de um trono, “estrado” expressa uma estrutura de apoio associada ao assento, sem exigir a forma específica de um escabelo; a possibilidade de rampa ou escadaria é preservada em nota.
- source_word: מָאֳחָזִים
  choice: preso
  rationale: O particípio passivo indica que a estrutura de ouro estava fixada ou ligada ao trono; “preso” é idiomático e claro.
- source_word: יָדוֹת
  choice: braços
  rationale: Literalmente “mãos”, o termo designa aqui as peças laterais do trono; “braços” é a designação corrente em português para essa parte de um assento.
- source_word: מִזֶּה וּמִזֶּה
  choice: de um lado e do outro
  rationale: Reproduz a disposição bilateral indicada pela expressão hebraica de modo natural.
- source_word: מְקוֹם הַשָּׁבֶת
  choice: junto ao assento
  rationale: A expressão localiza os braços na região do assento; esta formulação comunica a disposição do móvel sem reproduzir de maneira rígida “lugar de sentar”.
- source_word: אֲרָיוֹת
  choice: leões
  rationale: Equivalente direto do plural hebraico; o texto não explicita que eram esculturas, por isso a tradução também não o faz.
- source_word: עֹמְדִים
  choice: em pé
  rationale: Expressa diretamente a postura ou posição dos leões indicada pelo particípio.
- source_word: אֵצֶל
  choice: ao lado de
  rationale: Indica proximidade imediata e se ajusta naturalmente à descrição espacial.
