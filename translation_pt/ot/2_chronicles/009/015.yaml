  text: King Solomon made two hundred large shields of beaten gold[a]; six hundred shekels of beaten gold went onto each shield.
translation:
  language: pt
  text: O rei Salomão fez duzentos escudos grandes de ouro batido; em cada escudo foram usados seiscentos siclos[a] de ouro batido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “seiscentos de ouro batido subiam sobre um escudo”. O hebraico pressupõe uma unidade de peso; “siclos” foi acrescentado para dar clareza.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fez
  rationale: O verbo עשה tem o sentido comum de “fazer”; “fez” é natural e adequado ao estilo descritivo do inventário.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: o rei Salomão
  rationale: Mantém o título e o nome em ordem natural no português.
- source_word: מָאתַיִם צִנָּה
  choice: duzentos escudos grandes
  rationale: צִנָּה designa provavelmente um escudo corporal maior; “escudos grandes” preserva a distinção em relação a outros termos hebraicos para escudo.
- source_word: זָהָב שָׁחוּט
  choice: ouro batido
  rationale: שָׁחוּט descreve aqui ouro trabalhado, provavelmente martelado em lâminas; “ouro batido” é claro, conciso e corrente.
- source_word: שֵׁשׁ מֵאוֹת
  choice: seiscentos
  rationale: Tradução direta do numeral.
- source_word: יַעֲלֶה עַל
  choice: foram usados ... em
  rationale: A expressão indica a quantidade de ouro aplicada a cada escudo. A formulação portuguesa comunica naturalmente essa relação sem afirmar um método de fabricação além do texto.
- source_word: הַצִּנָּה הָאֶחָת
  choice: em cada escudo
  rationale: O hebraico literal “no escudo, o único/um” tem sentido distributivo neste contexto; “em cada escudo” é a forma idiomática em português.
- source_word: '[unidade implícita depois de שֵׁשׁ מֵאוֹת]'
  choice: siclos
  rationale: O hebraico não declara a unidade de peso. “Siclos” explicita no texto a unidade tradicionalmente entendida, enquanto a nota registra a elipse do original.
