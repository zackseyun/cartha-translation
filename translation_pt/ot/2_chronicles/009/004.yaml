  source_fidelity: A tradução preserva adequadamente a sequência de elementos observados pela rainha, a distinção geral entre servos, atendentes e copeiros, a repetição das vestes e a leitura massorética de עֲלִיָּתוֹ como subida/escadaria. A nota alternativa sobre o paralelo de 1 Reis 10:5 é apropriada. Convém, porém, tornar mais explícita e natural em português a relação sintática entre a enumeração e a reação final da rainha.
  naturalness: A enumeração seguida diretamente de “ela ficou sem fôlego” fica sintaticamente truncada quando o versículo é lido isoladamente. A inclusão de “Ao ver” e de uma conjunção antes da reação preserva o sentido contextual e produz uma frase portuguesa completa. “Disposição dos assentos” e “disposição de seus atendentes” soam mais naturais e representam bem a ordenação visível da corte.
  terminology: “Yahweh” representa corretamente o Tetragrama. “Casa de Yahweh” preserva a formulação hebraica. “Copeiros” é preciso no contexto palaciano. Substituir “ministros” por “atendentes” evita possíveis associações modernas governamentais ou religiosas, sem perder a distinção funcional no texto.
