base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/004.yaml
  text: the food of his table[a], the seating of his servants, the attendance of his ministers and their clothing, his cupbearers and their clothing, and the stairway by which he went up to the house of Yahweh[b], there was no more breath in her.
translation:
  language: pt
  text: Ao ver a comida da sua mesa, a disposição dos assentos de seus servos, a disposição de seus atendentes e as roupas deles, seus copeiros e as roupas deles, e a escadaria pela qual ele subia à casa de Yahweh[a], ela ficou sem fôlego.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, seguindo o paralelo em 1 Reis 10:5: “o holocausto que ele oferecia na casa de Yahweh”. Aqui, o texto hebraico de 2 Crônicas é mais naturalmente entendido como “a escadaria” ou “a subida pela qual ele subia”.'
    reason: alternative_reading
  - marker: b
    text: 'Literalmente: “não havia mais fôlego nela”, expressão que comunica espanto avassalador.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַאֲכַל שֻׁלְחָנוֹ
  choice: a comida da sua mesa
  rationale: Preserva o sentido concreto de alimento ou provisão servida à mesa, em linguagem portuguesa clara e natural.
- source_word: מוֹשַׁב עֲבָדָיו
  choice: os lugares onde se sentavam seus servos
  rationale: מוֹשָׁב pode indicar assento, lugar ou disposição dos assentos; a formulação comunica claramente a organização visível da corte.
- source_word: מַעֲמַד מְשָׁרְתָיו
  choice: os postos de seus ministros
  rationale: מַעֲמַד sugere posição ou lugar designado, enquanto מְשָׁרְתָיו distingue os que ministravam ou serviam na corte dos עֲבָדָיו mencionados antes.
- source_word: מַלְבּוּשֵׁיהֶם
  choice: as roupas deles
  rationale: Tradução concreta, atual e facilmente compreensível do termo que designa vestes ou indumentária.
- source_word: מַשְׁקָיו
  choice: seus copeiros
  rationale: No contexto real, refere-se aos encarregados de servir bebidas; “copeiros” é o termo português tradicional e preciso.
- source_word: עֲלִיָּתוֹ אֲשֶׁר יַעֲלֶה בֵּית יְהוָה
  choice: a escadaria pela qual ele subia à casa de Yahweh
  rationale: O texto massorético aponta mais naturalmente para uma subida ou escadaria usada para chegar à casa de Yahweh. A leitura paralela relacionada a holocaustos é preservada em nota.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Mantém a expressão hebraica “casa” e representa diretamente o nome divino יְהוָה como Yahweh.
- source_word: וְלֹא הָיָה עוֹד בָּהּ רוּחַ
  choice: ela ficou sem fôlego
  rationale: Expressa naturalmente em português o impacto avassalador descrito pelo idioma hebraico, conservando sua imagem de perda do fôlego.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Sentido de עֲלִיָּתוֹ no contexto da casa de Yahweh
  choice: escadaria pela qual ele subia
  alternative: holocausto que ele oferecia
  rationale: A leitura principal segue o texto massorético de 2 Crônicas, sem apagar a variante interpretativa sugerida pelo paralelo de 1 Reis 10:5.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva o caráter enumerativo do hebraico. A repetição das roupas dos ministros e dos copeiros foi mantida por constar no texto massorético. Os marcadores de nota foram posicionados junto às expressões a que efetivamente se referem.
