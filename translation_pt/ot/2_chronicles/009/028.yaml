base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/028.yaml
  text: And they were importing horses for Solomon from Egypt and from all the lands[a].
translation:
  language: pt
  text: E traziam cavalos do Egito para Salomão e de todas as terras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “E faziam sair cavalos do Egito para Salomão e de todas as terras”. O verbo hebraico significa literalmente “fazer sair” ou “trazer para fora”, mas, neste contexto, refere-se ao fornecimento comercial.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מוֹצִיאִים
  choice: E traziam
  rationale: O particípio hifil de יצא significa literalmente “faziam sair” ou “traziam para fora”. No contexto do fornecimento comercial de cavalos a Salomão, “traziam” é natural e preserva o sentido de transporte sem especificar desnecessariamente o ponto de vista implícito em “importavam”.
- source_word: סוּסִים
  choice: cavalos
  rationale: Equivalente direto e corrente do substantivo hebraico plural.
- source_word: מִ/מִּצְרַיִם
  choice: do Egito
  rationale: A preposição מן indica a origem dos cavalos.
- source_word: לִ/שְׁלֹמֹה
  choice: para Salomão
  rationale: A preposição ל marca aqui o destinatário ou beneficiário do fornecimento; “para” mantém ambas as nuances de modo natural.
- source_word: וּ/מִ/כָּל הָ/אֲרָצוֹת
  choice: e de todas as terras
  rationale: Mantém a imagem ampla do plural de אֶרֶץ e a coordenação concisa do hebraico. “Terras” pode designar territórios ou países.
