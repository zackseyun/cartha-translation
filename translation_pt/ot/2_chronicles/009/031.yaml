base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/031.yaml
  text: And Solomon slept with his fathers[a], and they buried him in the city of David his father. And Rehoboam his son reigned in his place.
translation:
  language: pt
  text: Salomão descansou com seus pais[a], e o sepultaram na Cidade de Davi, seu pai. E Roboão, seu filho, reinou em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “deitou-se com seus pais”, expressão costumeira para indicar a morte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: descansou
  rationale: No contexto da fórmula régia de morte, o verbo significa literalmente deitar-se/dormir. “Descansou” preserva em português o caráter eufemístico da expressão sem sugerir apenas sono comum.
- source_word: עִם אֲבֹתָיו
  choice: com seus pais
  rationale: Mantém de perto a fórmula dinástica hebraica e sua ressonância bíblica; a nota esclarece que a expressão se refere à morte e à reunião com os antepassados.
- source_word: וַיִּקְבְּרֻהוּ
  choice: o sepultaram
  rationale: Reproduz o verbo ativo no plural e deixa seus agentes indeterminados, como no hebraico.
- source_word: בְּעִיר דָּוִיד
  choice: na Cidade de Davi
  rationale: É a forma convencional e reconhecível do topônimo bíblico em português.
- source_word: אָבִיו
  choice: seu pai
  rationale: Refere-se a Davi em relação a Salomão; “pai” corresponde ao sentido direto e à linguagem genealógica do texto.
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: Traduz de modo conciso a fórmula hebraica de sucessão real.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: Expressa naturalmente a ideia hebraica de substituição e sucessão no trono.
theological_decisions: []
