  register: Português moderno, claro e digno, com sintaxe de ampla compreensão internacional e boa legibilidade brasileira. A repetição 'tudo o que' conserva a estrutura enfática do hebraico; as notas registram a ambiguidade e a expressão narrativa mais literal.
