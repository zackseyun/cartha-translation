base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/012.yaml
  text: And King Solomon gave the queen of Sheba all that she desired[a], whatever she asked, besides what she had brought to the king. Then she turned and went to her own land[b], she and her servants.
translation:
  language: pt
  text: O rei Salomão deu à rainha de Sabá tudo o que ela desejava e havia pedido, além do que ela havia trazido ao rei.[a] Depois, ela se voltou e foi para a sua terra,[b] ela e os seus servos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à parte do que ela havia trazido ao rei”. A expressão hebraica pode distinguir os presentes de Salomão daqueles que a rainha havia trazido ao rei.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ela voltou e foi para a sua terra”. O hebraico diz literalmente: “ela se voltou e foi”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן
  choice: deu
  rationale: É o equivalente direto e natural no contexto de concessão de presentes.
- source_word: מַלְכַּת שְׁבָא
  choice: a rainha de Sabá
  rationale: Traduz o título e preserva a forma tradicional e reconhecível do topônimo.
- source_word: כָּל חֶפְצָהּ אֲשֶׁר שָׁאָלָה
  choice: tudo o que ela desejou, tudo o que pediu
  rationale: Reproduz os dois elementos hebraicos — desejo e pedido — em português claro, sem reduzir um ao outro.
- source_word: מִלְּבַד אֲשֶׁר הֵבִיאָה אֶל הַמֶּלֶךְ
  choice: além do que ela havia trazido ao rei
  rationale: Mantém a força aditiva ou distintiva de מִלְּבַד, embora o referente implícito da comparação permaneça difícil.
- source_word: וַתַּהֲפֹךְ וַתֵּלֶךְ לְאַרְצָהּ
  choice: ela partiu e voltou para a sua terra
  rationale: Expressa naturalmente o movimento de retorno indicado pela sequência literal 'virou-se e foi', preservada em nota.
- source_word: הִיא וַעֲבָדֶיהָ
  choice: ela e os seus servos
  rationale: O termo designa aqui o séquito a serviço da rainha; 'servos' preserva a amplitude lexical sem especificar indevidamente a condição social.
