base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/027.yaml
  text: The king made silver as common as stones in Jerusalem[a], and he made cedars as plentiful as sycamore trees in the lowland.
translation:
  language: pt
  text: O rei tornou a prata tão comum quanto as pedras em Jerusalém e os cedros tão abundantes quanto os sicômoros na baixada[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na Sefelá”, região de colinas baixas de Judá, a oeste da serra central.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: tornou
  rationale: 'Embora o verbo signifique literalmente “deu” ou “pôs”, neste contexto descreve o resultado produzido pelo rei: prata e cedros passaram a existir em extraordinária abundância. “Tornou” expressa essa ideia com naturalidade.'
- source_word: הַכֶּסֶף
  choice: a prata
  rationale: O substantivo designa o metal precioso, e não especificamente dinheiro ou moedas.
- source_word: כָּאֲבָנִים
  choice: tão comum quanto as pedras
  rationale: A comparação indica abundância e disponibilidade, não semelhança física. A formulação explicita naturalmente o sentido implícito.
- source_word: בִּירוּשָׁלִַם
  choice: em Jerusalém
  rationale: Tradução locativa direta.
- source_word: הָאֲרָזִים
  choice: os cedros
  rationale: O plural pode abranger as árvores ou sua madeira como recurso; “cedros” preserva essa concisão e a imagem hebraica.
- source_word: כַּשִּׁקְמִים
  choice: quanto os sicômoros
  rationale: O termo hebraico se refere aos sicômoros, árvores numerosas na região mencionada. O nome tradicional preserva a espécie da imagem bíblica.
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: na baixada
  rationale: שְׁפֵלָה designa a região baixa de colinas e vales a oeste da serra central de Judá. “Baixada” é uma designação compreensível, enquanto o nome regional é mantido na nota.
- source_word: לָרֹב
  choice: tão abundantes
  rationale: A expressão ressalta a grande quantidade; “abundantes” integra essa intensificação à comparação em português natural.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção comparativa natural. A repetição do verbo hebraico foi condensada sem perda do paralelismo semântico. O termo regional técnico “Sefelá” foi reservado para a nota, e “sicômoros” mantém a imagem botânica tradicional.
