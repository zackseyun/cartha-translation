  text: Besides what the traders and merchants brought, all the kings of Arabia and the governors of the land were bringing gold and silver to Solomon.
translation:
  language: pt
  text: Além do que traziam os comerciantes e os mercadores, todos os reis da Arábia e os governadores da terra traziam ouro e prata a Salomão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַנְשֵׁי הַתָּרִים
  choice: os comerciantes
  rationale: A expressão designa literalmente os homens que percorriam regiões para comerciar; “comerciantes” comunica naturalmente essa função em português.
- source_word: הַסֹּחֲרִים
  choice: os mercadores
  rationale: Mantém a distinção lexical em relação ao termo anterior e traduz o substantivo comum para negociantes.
- source_word: עֲרַב
  choice: Arábia
  rationale: Neste contexto, o nome geográfico tradicional é a leitura mais provável e concorda com o paralelo de 1 Reis 10:15.
- source_word: פַחוֹת הָאָרֶץ
  choice: os governadores da terra
  rationale: “Governadores” representa o título administrativo פַחוֹת, enquanto “da terra” preserva a formulação ampla e potencialmente ambígua do hebraico.
- source_word: מְבִיאִים
  choice: traziam
  rationale: O particípio indica atividade habitual ou contínua no contexto do fluxo de tributos e comércio.
