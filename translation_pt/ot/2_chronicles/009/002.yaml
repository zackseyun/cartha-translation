base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/002.yaml
  text: And Solomon answered all her questions[b][a]; nothing was hidden from Solomon that he did not explain to her.
translation:
  language: pt
  text: Salomão respondeu a todas as perguntas dela[a]; não houve assunto oculto a Salomão que ele não lhe explicasse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “contou a ela tudo o que ela queria saber”; em hebraico, mais literalmente, “todas as palavras dela” ou “todos os assuntos dela”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não houve assunto oculto a Salomão que ele não lhe contasse”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד
  choice: respondeu
  rationale: Embora נגד signifique literalmente “contar” ou “declarar”, neste contexto descreve a resposta de Salomão às questões difíceis apresentadas pela rainha.
- source_word: אֶת כָּל דְּבָרֶיהָ
  choice: a todas as perguntas dela
  rationale: דָּבָר pode significar “palavra”, “assunto” ou “coisa”; o contexto imediato indica as perguntas ou questões que a rainha apresentou a Salomão.
- source_word: נֶעְלַם
  choice: oculto
  rationale: O nifal de עלם expressa aquilo que está escondido ou encoberto; “oculto” preserva essa imagem de modo natural e digno.
- source_word: דָּבָר
  choice: assunto
  rationale: O substantivo singular, sob a negação, refere-se a nenhum assunto ou questão; manter “assunto” ajuda a preservar a repetição lexical do hebraico.
- source_word: מִשְּׁלֹמֹה
  choice: a Salomão
  rationale: Com נעלם, a preposição מן marca a pessoa para quem algo permanece oculto. Em português, a construção idiomática é “oculto a alguém”.
- source_word: אֲשֶׁר לֹא הִגִּיד לָהּ
  choice: que ele não lhe explicasse
  rationale: A oração relativa afirma que Salomão tornou conhecido à rainha tudo o que sabia; “explicasse” comunica naturalmente o sentido contextual, embora o verbo seja literalmente “contasse” ou “declarasse”.
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A tradução emprega equivalência ótima: explicita como “perguntas” o sentido contextual de דְּבָרֶיהָ, mas registra em nota a formulação mais literal; preserva na segunda oração a imagem de algo estar oculto a Salomão.'
