  text: The king made a great ivory throne and overlaid it with pure gold[a].
translation:
  language: pt
  text: O rei fez um grande trono de marfim e o revestiu de ouro puro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “um trono de dente”; a expressão se refere a um trono de marfim.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fez
  rationale: O verbo עשה, neste contexto narrativo, significa naturalmente “fazer” ou “produzir”. “Fez” é direto, corrente e não acrescenta uma técnica de fabricação que o hebraico não especifica.
- source_word: הַמֶּלֶךְ
  choice: O rei
  rationale: O substantivo definido é traduzido diretamente. Embora o contexto identifique o rei como Salomão, preserva-se o título usado no hebraico.
- source_word: כִּסֵּא
  choice: trono
  rationale: כִּסֵּא pode designar um assento, mas, em referência ao rei e neste contexto régio, “trono” expressa adequadamente o sentido.
- source_word: שֵׁן
  choice: marfim
  rationale: O sentido básico é “dente”, mas na construção כִּסֵּא שֵׁן o termo designa o marfim como material. “De marfim” comunica o idioma hebraico com clareza.
- source_word: גָּדוֹל
  choice: grande
  rationale: “Grande” preserva tanto a possível dimensão física quanto a imponência do trono, sem limitar o adjetivo apenas ao tamanho.
- source_word: וַיְצַפֵּהוּ
  choice: o revestiu
  rationale: A forma intensiva de צפה indica cobrir ou revestir um objeto com determinado material. “O revestiu” é natural em português e mantém o pronome referente ao trono.
- source_word: זָהָב טָהוֹר
  choice: ouro puro
  rationale: Tradução direta e idiomática da expressão que descreve ouro de alta pureza.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase acompanha de perto o hebraico, enquanto “marfim” traduz idiomaticamente שֵׁן. “Grande” conserva a amplitude semântica entre tamanho e imponência.
