base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/029.yaml
  text: The rest of the acts of Solomon[a], from first to last, are they not written in the records of Nathan the prophet, and in the prophecy of Ahijah the Shilonite[b], and in the visions of Iddo the seer concerning Jeroboam son of Nebat?
translation:
  language: pt
  text: Os demais atos de Salomão, do princípio ao fim, não estão escritos nos registros[a] de Natã, o profeta, na profecia de Aías, o silonita, e nas visões de Ido, o vidente, a respeito[b] de Jeroboão, filho de Nebate?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nas palavras de Natã, o profeta” ou “no relato de Natã, o profeta”. O termo hebraico pode indicar palavras faladas ou um registro escrito; aqui, provavelmente se refere a uma fonte documental.
    reason: lexical_alternative
  - marker: b
    text: Ou “sobre Jeroboão, filho de Nebate” e, possivelmente, “contra Jeroboão, filho de Nebate”. A preposição hebraica admite esses sentidos relacionados; “a respeito de” se ajusta melhor ao contexto de citação de fontes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר דִּבְרֵי שְׁלֹמֹה
  choice: Os demais atos de Salomão
  rationale: No encerramento historiográfico de um reinado, דִּבְרֵי abrange feitos e acontecimentos, não apenas palavras; “atos” comunica esse sentido de modo natural e digno.
- source_word: הָרִאשֹׁנִים וְהָאֲחֲרוֹנִים
  choice: do princípio ao fim
  rationale: A expressão abrange toda a trajetória narrada e soa natural em português, sem reduzir o sentido a apenas dois momentos isolados.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: não estão escritos
  rationale: Preserva a forma de pergunta retórica e o caráter formal da fórmula de citação de fontes.
- source_word: עַל דִּבְרֵי נָתָן הַנָּבִיא
  choice: nos registros de Natã, o profeta
  rationale: Neste contexto de fontes documentais, דִּבְרֵי provavelmente designa um relato ou registro escrito; “nos” expressa com naturalidade a relação indicada por עַל após “escritos”.
- source_word: נְבוּאַת אֲחִיָּה הַשִּׁילוֹנִי
  choice: na profecia de Aías, o silonita
  rationale: “Profecia” traduz diretamente נְבוּאָה; “silonita” preserva a designação geográfica tradicional em português.
- source_word: וּבַחֲזוֹת יעדי הַחֹזֶה
  choice: e nas visões de Ido, o vidente
  rationale: “Visões” comunica o plural ou coletivo חֲזוֹת; “vidente” preserva a distinção lexical entre חֹזֶה e נָבִיא, traduzido como “profeta” anteriormente.
- source_word: עַל יָרָבְעָם בֶּן נְבָט
  choice: a respeito de Jeroboão, filho de Nebate
  rationale: עַל pode significar “a respeito de”, “sobre” ou, em certos contextos, “contra”; numa lista de fontes, a referência ao assunto das visões é a leitura mais natural.
theological_decisions:
- issue: Relação das visões de Ido com Jeroboão
  choice: a respeito de Jeroboão
  alternative: contra Jeroboão
  rationale: A preposição hebraica permite ambas as relações, mas o contexto de catálogo documental favorece a indicação do assunto. A alternativa potencialmente adversativa é preservada em nota, sem impor uma interpretação teológica.
translation_notes:
  register: Português atual, claro e solene, com formas onomásticas correntes para leitores brasileiros e internacionais. A pergunta retórica e a distinção entre “profeta” e “vidente” foram preservadas. Os marcadores de nota foram posicionados junto às expressões a que efetivamente se referem.
