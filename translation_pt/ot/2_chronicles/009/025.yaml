base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/025.yaml
  text: Solomon had four thousand stalls for horses and chariots[a], and twelve thousand horsemen[b]; he stationed them in the chariot cities and with the king in Jerusalem.
translation:
  language: pt
  text: Salomão tinha quatro mil cocheiras para cavalos e carros de guerra[a] e doze mil cavaleiros[b]. Ele os estacionou nas cidades dos carros de guerra e junto ao rei, em Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “baias”; o termo hebraico se refere a instalações ou compartimentos para alojar cavalos.
    reason: lexical_alternative
  - marker: b
    text: O texto paralelo em 1 Reis 4:26 traz “quarenta mil cocheiras”, enquanto Crônicas aqui traz “quatro mil”.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי לִשְׁלֹמֹה
  choice: Salomão tinha
  rationale: A construção היה + ל expressa posse ou existência; esta formulação é direta e natural em português.
- source_word: אַרְבַּעַת אֲלָפִים
  choice: quatro mil
  rationale: Tradução direta da expressão numérica do texto massorético.
- source_word: אֻרְיוֹת
  choice: cocheiras
  rationale: O substantivo designa instalações ou compartimentos destinados a cavalos; “cocheiras” é claro e corrente em português, embora “baias” também seja possível.
- source_word: סוּסִים וּמַרְכָּבוֹת
  choice: para cavalos e carros de guerra
  rationale: Preserva ambos os substantivos e explicita a finalidade indicada pelo contexto; “carros de guerra” evita a possível associação moderna de “carros” com automóveis.
- source_word: וּשְׁנֵים עָשָׂר אֶלֶף
  choice: e doze mil
  rationale: Tradução direta da expressão numérica.
- source_word: פָּרָשִׁים
  choice: cavaleiros
  rationale: Equivalente natural para homens montados, sem introduzir a conotação mais técnica e potencialmente anacrônica de “cavalaria”.
- source_word: וַיַּנִּיחֵם
  choice: Ele os mantinha
  rationale: No contexto administrativo e militar, o verbo comunica que os recursos foram colocados e mantidos em locais designados; a formulação também acomoda o fato de o antecedente plural abranger cavalos, carros e cavaleiros.
- source_word: בְּעָרֵי הָרֶכֶב
  choice: nas cidades dos carros de guerra
  rationale: Reproduz naturalmente a relação construta hebraica e indica cidades destinadas à força de carros.
- source_word: וְעִם הַמֶּלֶךְ
  choice: e junto ao rei
  rationale: Mantém a concisão do hebraico sem acrescentar explicitamente “alguns”, que está apenas implícito na distribuição.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: Forma portuguesa consagrada do topônimo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Carros de guerra” esclarece o sentido antigo de מַרְכָּבוֹת; a sintaxe evita rigidez excessiva sem apagar a estrutura e os dados do hebraico.
