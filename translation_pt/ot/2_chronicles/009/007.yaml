  text: Blessed are your men[b][a], and blessed are these your servants who stand before you continually and hear your wisdom.
translation:
  language: pt
  text: Felizes são os seus homens[a], e felizes são estes seus servos, que estão continuamente diante de você[b] e ouvem a sua sabedoria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Afortunados são os seus homens”. O hebraico pode indicar uma condição feliz, afortunada ou digna de admiração.'
    reason: lexical_alternative
  - marker: b
    text: “Estar diante” de um rei é uma expressão da corte que significa comparecer e servi-lo em sua presença.
    reason: cultural_note
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Felizes são
  rationale: A expressão descreve uma condição feliz, afortunada e digna de admiração. “Felizes são” comunica esse sentido naturalmente em português sem pressupor de modo indevido uma bênção divina explícita.
- source_word: אֲנָשֶׁיךָ
  choice: os seus homens
  rationale: Mantém o sentido comum e masculino do substantivo hebraico. No contexto, provavelmente se refere aos homens ligados à corte de Salomão, mas a tradução evita especificar além do texto.
- source_word: עֲבָדֶיךָ
  choice: seus servos
  rationale: No contexto da corte real, refere-se aos que servem ao rei; “servos” é natural e não enfatiza uma condição de escravidão que o contexto não exige.
- source_word: אֵלֶּה
  choice: estes
  rationale: Preserva a força demonstrativa do hebraico, apontando para os servos presentes ou mencionados.
- source_word: הָעֹמְדִים לְפָנֶיךָ
  choice: que estão diante de você
  rationale: Conserva a imagem literal da expressão cortesã hebraica, que indica comparecer e servir na presença do rei.
- source_word: תָּמִיד
  choice: continuamente
  rationale: Expressa a regularidade constante da presença e do serviço sem necessariamente sugerir uma presença ininterrupta em sentido absoluto.
- source_word: וְשֹׁמְעִים
  choice: e ouvem
  rationale: Traduz diretamente o particípio hebraico e, no contexto, implica escuta atenta e receptiva.
- source_word: חָכְמָתֶךָ
  choice: a sua sabedoria
  rationale: Reproduz de modo direto a referência à sabedoria possuída e expressa por Salomão.
