source:
  edition: WLC
  text: יְהִ֨י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בָּר֔וּךְ אֲשֶׁ֣ר חָפֵ֣ץ בְּ/ךָ֗ לְ/תִתְּ/ךָ֤ עַל כִּסְא/וֹ֙ לְ/מֶ֔לֶךְ לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ בְּ/אַהֲבַ֨ת אֱלֹהֶ֤י/ךָ אֶת יִשְׂרָאֵל֙ לְ/הַעֲמִיד֣/וֹ לְ/עוֹלָ֔ם וַ/יִּתֶּנְ/ךָ֤ עֲלֵי/הֶם֙ לְ/מֶ֔לֶךְ לַ/עֲשׂ֖וֹת מִשְׁפָּ֥ט וּ/צְדָקָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/008.yaml
  text: Blessed be Yahweh your God[a], who delighted in you and set you on his throne as king for Yahweh your God. Because your God loved Israel, to establish them forever[c][b], he made you king over them to administer justice and righteousness.
translation:
  language: pt
  text: Bendito seja Yahweh, seu Deus[a], que se agradou de você e o colocou em seu trono como rei a serviço de Yahweh, seu Deus. Porque seu Deus amou Israel, para estabelecê-lo para sempre[b], fez de você rei sobre esse povo, para praticar o direito e a justiça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que Yahweh, seu Deus, seja bendito”.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico usa aqui um pronome singular, referindo-se a Israel como um povo. Também se pode traduzir: “para estabelecer seu povo para sempre”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי יְהוָה אֱלֹהֶיךָ בָּרוּךְ
  choice: Bendito seja Yahweh, seu Deus
  rationale: Conserva a fórmula hebraica de bênção e verte o nome divino de forma explícita. A construção portuguesa também mantém o tom solene e beneditório do jussivo.
- source_word: חָפֵץ בְּךָ
  choice: se agradou de você
  rationale: Expressa o prazer e a aprovação indicados pelo verbo, em linguagem natural e digna.
- source_word: לְתִתְּךָ עַל כִּסְאוֹ
  choice: o colocou em seu trono
  rationale: 'Comunica a entronização sem apagar o possessivo: o trono é apresentado como pertencente a Deus.'
- source_word: לְמֶלֶךְ לַיהוָה אֱלֹהֶיךָ
  choice: como rei a serviço de Yahweh, seu Deus
  rationale: A expressão 'a serviço de' torna inteligível a relação representativa indicada pela preposição ל, sem sugerir que o rei governe de modo independente.
- source_word: בְּאַהֲבַת אֱלֹהֶיךָ אֶת יִשְׂרָאֵל
  choice: Por amor a Israel
  rationale: Reproduz de modo conciso o valor causal da construção e evita a repetição pesada de 'seu Deus', retomada logo depois.
- source_word: לְהַעֲמִידוֹ לְעוֹלָם
  choice: para estabelecê-lo para sempre
  rationale: Mantém o infinitivo de finalidade e o sufixo masculino singular, cujo referente é Israel considerado coletivamente.
- source_word: וַיִּתֶּנְךָ עֲלֵיהֶם לְמֶלֶךְ
  choice: seu Deus fez de você rei sobre esse povo
  rationale: No contexto de entronização, נתן descreve a nomeação régia. 'Esse povo' explicita o referente plural sem repetir 'Israel' de maneira mecânica.
- source_word: לַעֲשׂוֹת מִשְׁפָּט וּצְדָקָה
  choice: para exercer o direito e a justiça
  rationale: A fórmula régia descreve a tarefa de governar segundo decisões justas e uma ordem reta. A tradução preserva os dois substantivos distintos.
theological_decisions:
- issue: O referente de כִּסְאוֹ ('seu trono')
  choice: Preservar 'seu trono', entendendo o possessivo como referência ao trono de Yahweh.
  alternative: Traduzir apenas 'o trono' ou entendê-lo como simples trono dinástico de Salomão.
  rationale: O texto de Crônicas apresenta a realeza davídica como exercida sob a autoridade de Deus; conservar o possessivo mantém essa afirmação sem ampliá-la.
- issue: Relação sintática de לְהַעֲמִידוֹ לְעוֹלָם
  choice: 'Manter a finalidade: ''para estabelecê-lo para sempre'', ligada no fluxo da frase ao amor de Deus e à nomeação do rei.'
  alternative: Acrescentar um verbo como 'quis' ou 'desejou estabelecê-lo', ou ligar a finalidade exclusivamente ao amor de Deus.
  rationale: O hebraico não traz um verbo equivalente a 'quis'. A formulação conserva o infinitivo e evita resolver de forma rígida a possível abrangência da oração de finalidade.
- issue: A dupla מִשְׁפָּט וּצְדָקָה
  choice: Traduzir por 'o direito e a justiça'.
  alternative: Usar apenas 'justiça' para os dois termos ou verter צְדָקָה por 'retidão'.
  rationale: A dupla é uma fórmula régia que reúne julgamento justo e ordem social reta. Manter dois termos preserva a distinção hebraica sem impor uma leitura doutrinária posterior.
translation_notes:
  register: Português atual, solene e acessível, com preferência por construções naturais no Brasil e compreensíveis internacionalmente. O tratamento por 'você' acompanha a fala direta e evita formas regionais; 'Yahweh' preserva explicitamente o nome divino. A sintaxe procura manter a tensão entre o amor de Deus, a permanência de Israel e a nomeação do rei.
