revisions:
- from: Bendito seja Yahweh, seu Deus[a], que se agradou de você e o colocou em seu trono como rei a serviço de Yahweh, seu Deus. Por amor a Israel e para estabelecê-lo para sempre[b], seu Deus fez de você rei sobre esse povo, para exercer o direito e a justiça.
  to: Bendito seja Yahweh, seu Deus[a], que se agradou de você e o colocou em seu trono como rei a serviço de Yahweh, seu Deus. Porque seu Deus amou Israel, para estabelecê-lo para sempre[b], fez de você rei sobre esse povo, para praticar o direito e a justiça.
  rationale: A revisão torna explícito que o amor por Israel é o amor de Deus, conforme o hebraico, sem resolver de modo excessivo o alcance da oração de finalidade «para estabelecê-lo para sempre». Também ajusta a última expressão para um português mais natural e semanticamente preciso em contexto de governo.
