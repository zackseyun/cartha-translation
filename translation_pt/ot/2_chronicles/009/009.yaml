base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/009.yaml
  text: And she gave the king one hundred twenty talents of gold[a], and spices in great abundance, and precious stones. There had never been spices like those that the queen of Sheba gave to King Solomon.
translation:
  language: pt
  text: Ela deu ao rei cento e vinte talentos de ouro, especiarias em enorme abundância e pedras preciosas. Nunca houve especiarias como aquelas que a rainha de Sabá deu ao rei Salomão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Nunca mais houve especiarias como aquelas que a rainha de Sabá deu ao rei Salomão». O hebraico pode ser entendido como uma afirmação de qualidade sem igual até aquele momento ou, de modo mais amplo, como a lembrança de um presente jamais igualado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: Ela deu
  rationale: O wayyiqtol de נתן faz a narrativa avançar; em português, o pretérito perfeito expressa naturalmente a ação seguinte, e o pronome explicita o sujeito feminino indicado pelo contexto.
- source_word: לַמֶּלֶךְ
  choice: ao rei
  rationale: A preposição ל marca o destinatário; a contração portuguesa «ao» preserva essa relação de modo natural.
- source_word: מֵאָה וְעֶשְׂרִים כִּכַּר זָהָב
  choice: cento e vinte talentos de ouro
  rationale: כִּכָּר designa aqui uma unidade de peso; «talento» é o equivalente tradicional e reconhecível, sem converter para uma estimativa moderna incerta.
- source_word: וּבְשָׂמִים
  choice: especiarias
  rationale: בְּשָׂמִים abrange substâncias aromáticas e fragrantes. «Especiarias» é claro, corrente e apropriado à lista de presentes valiosos.
- source_word: לָרֹב מְאֹד
  choice: em enorme abundância
  rationale: A expressão intensifica fortemente a quantidade; esta formulação conserva a ênfase sem soar mecânica.
- source_word: וְאֶבֶן יְקָרָה
  choice: e pedras preciosas
  rationale: Embora אֶבֶן esteja no singular, tem sentido coletivo neste contexto; o plural é idiomático em português.
- source_word: וְלֹא הָיָה כַּבֹּשֶׂם הַהוּא
  choice: Nunca houve especiarias como aquelas
  rationale: A tradução comunica a inexistência de algo comparável e trata בֹּשֶׂם como coletivo. A extensão temporal da afirmação permanece reconhecida em nota.
- source_word: אֲשֶׁר נָתְנָה מַלְכַּת שְׁבָא
  choice: que a rainha de Sabá deu
  rationale: A oração relativa identifica as especiarias incomparáveis; o pretérito perfeito é natural e fiel à forma verbal.
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: ao rei Salomão
  rationale: A combinação de título e nome é expressa de maneira corrente em português.
theological_decisions:
- issue: Alcance temporal da afirmação sobre as especiarias
  choice: Nunca houve especiarias como aquelas
  alternative: Nunca mais houve especiarias como aquelas
  rationale: O hebraico afirma que não havia algo comparável, mas o contexto pode ser entendido como comparação até aquele momento ou, de forma mais ampla, como lembrança duradoura de um presente sem igual. A tradução principal não impõe uma leitura doutrinária, e a nota registra a alternativa temporal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Conserva-se «talentos» como unidade antiga, evita-se uma conversão moderna especulativa e mantém-se a ênfase quantitativa do hebraico.
