  text: וְ֠/כֹל כְּלֵ֞י מַשְׁקֵ֨ה הַ/מֶּ֤לֶךְ שְׁלֹמֹה֙ זָהָ֔ב וְ/כֹ֗ל כְּלֵ֛י בֵּֽית יַ֥עַר הַ/לְּבָנ֖וֹן זָהָ֣ב סָג֑וּר אֵ֣ין כֶּ֗סֶף נֶחְשָׁ֛ב בִּ/ימֵ֥י שְׁלֹמֹ֖ה לִ/מְאֽוּמָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/020.yaml
  text: All King Solomon’s drinking vessels were gold[a], and all the vessels of the House of the Forest of Lebanon were pure gold[c][b]. Silver was not considered anything in the days of Solomon.
translation:
  language: pt
  text: Todos os utensílios de beber do rei Salomão eram de ouro, e todos os utensílios da Casa da Floresta do Líbano[a] eram de ouro puro[b]. Na época de Salomão, a prata não era considerada coisa alguma[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Palácio da Floresta do Líbano”, nome de um edifício real.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “ouro fechado”; expressão geralmente entendida como ouro puro ou refinado.'
    reason: lexical_alternative
  - marker: c
    text: Ou “a prata não era considerada de valor algum na época de Salomão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי מַשְׁקֵה
  choice: utensílios de beber
  rationale: Mantém o sentido amplo de כְּלֵי, sem restringi-lo a copos ou taças, e expressa naturalmente a função indicada por מַשְׁקֵה.
- source_word: זָהָב
  choice: ouro
  rationale: É o equivalente direto do termo hebraico e preserva sua repetição enfática no versículo.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: Casa da Floresta do Líbano
  rationale: Trata a expressão como o nome de um edifício real específico e traduz בֵּית de modo direto; “Palácio” é possível, mas interpretativo.
- source_word: זָהָב סָגוּר
  choice: ouro puro
  rationale: A expressão hebraica, literalmente associada a ouro “fechado”, é um idioma que designa ouro de alta qualidade ou refinado; “ouro puro” comunica esse sentido com clareza.
- source_word: אֵין כֶּסֶף נֶחְשָׁב ... לִמְאוּמָה
  choice: a prata não era considerada coisa alguma
  rationale: Preserva de perto a formulação hebraica e sua ênfase na insignificância da prata, sem explicitar além do texto que ela não possuía valor.
- source_word: בִּימֵי שְׁלֹמֹה
  choice: na época de Salomão
  rationale: Expressa naturalmente em português o idioma hebraico “nos dias de Salomão”, sem restringir indevidamente a referência ao reinado formal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem das orações acompanha de perto o hebraico, enquanto “na época de Salomão” evita a rigidez de uma reprodução literal do idioma temporal.
