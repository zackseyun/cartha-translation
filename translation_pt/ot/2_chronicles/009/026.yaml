base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/026.yaml
  text: And he ruled over all the kings from the River to the land of the Philistines and to the border of Egypt[a].
translation:
  language: pt
  text: E ele dominava sobre todos os reis, desde o Rio até a terra dos filisteus e até a fronteira do Egito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O Rio” provavelmente se refere ao rio Eufrates, uma designação geográfica comum na Bíblia Hebraica.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי מוֹשֵׁל
  choice: E ele dominava
  rationale: A construção com היה e o particípio משל descreve uma situação contínua no passado. “Dominava” expressa com naturalidade o exercício de autoridade política, sem reproduzir de modo rígido “era governante”.
- source_word: בְּכָל הַמְּלָכִים
  choice: sobre todos os reis
  rationale: Com משל, a preposição בְּ indica aqueles sobre os quais se exerce domínio; “sobre” preserva a ideia de supremacia sobre reis subordinados.
- source_word: מִן הַנָּהָר
  choice: desde o Rio
  rationale: O hebraico traz literalmente “o Rio”, designação geográfica que, neste contexto, normalmente se refere ao Eufrates. A formulação literal é mantida no texto, com esclarecimento em nota.
- source_word: וְעַד אֶרֶץ פְּלִשְׁתִּים
  choice: até a terra dos filisteus
  rationale: A expressão indica a extensão geográfica do domínio e mantém de forma transparente o sentido do hebraico, sem substituir o nome descritivo por “Filístia”.
- source_word: וְעַד גְּבוּל מִצְרָיִם
  choice: e até a fronteira do Egito
  rationale: גְּבוּל designa limite ou fronteira territorial. “Fronteira do Egito” é claro e fiel à formulação hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O imperfeito “dominava” comunica o estado contínuo expresso pela construção hebraica. A designação tradicional e ambígua “o Rio” foi preservada no texto e esclarecida em nota.
