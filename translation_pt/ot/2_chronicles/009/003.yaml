lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Quando ... viu
  rationale: O waw consecutivo faz a narrativa avançar e, neste contexto, introduz uma oração temporal que continua no versículo seguinte. “Quando ... viu” expressa essa relação com naturalidade.
- source_word: מַלְכַּת שְׁבָא
  choice: a rainha de Sabá
  rationale: A cadeia construta identifica a rainha por seu reino ou região; esta é a forma tradicional e natural em português.
- source_word: אֵת
  choice: '[não traduzido separadamente]'
  rationale: É a partícula que marca o objeto direto definido em hebraico e não possui equivalente lexical independente em português.
- source_word: חָכְמַת שְׁלֹמֹה
  choice: a sabedoria de Salomão
  rationale: Reproduz naturalmente a relação construta e mantém o sentido amplo de sabedoria, discernimento e capacidade demonstrados por Salomão.
- source_word: וְהַבַּיִת
  choice: e a casa
  rationale: בַּיִת significa literalmente “casa”. Embora o contexto régio possa apontar para o palácio ou complexo palaciano, a tradução principal preserva a amplitude lexical do hebraico.
- source_word: אֲשֶׁר בָּנָה
  choice: que ele havia construído
  rationale: A oração relativa modifica “casa”; o pretérito mais-que-perfeito composto indica com clareza que a construção ocorreu antes de a rainha vê-la.
