source:
  edition: WLC
  text: כִּֽי אֳנִיּ֤וֹת לַ/מֶּ֨לֶךְ֙ הֹלְכ֣וֹת תַּרְשִׁ֔ישׁ עִ֖ם עַבְדֵ֣י חוּרָ֑ם אַחַת֩ לְ/שָׁל֨וֹשׁ שָׁנִ֜ים תָּב֣וֹאנָה אֳנִיּ֣וֹת תַּרְשִׁ֗ישׁ נֹֽשְׂאוֹת֙ זָהָ֣ב וָ/כֶ֔סֶף שֶׁנְהַבִּ֥ים וְ/קוֹפִ֖ים וְ/תוּכִּיִּֽים־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/021.yaml
  text: For the king had ships going to Tarshish with Huram’s servants; once every three years the ships of Tarshish would come[a], carrying gold and silver, ivory, monkeys, and peacocks.
translation:
  language: pt
  text: Pois o rei tinha navios que iam a Társis com os servos de Hurão. Uma vez a cada três anos, os navios de Társis chegavam trazendo ouro, prata, marfim, macacos e pavões.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «papagaios»; a identificação do animal designado pela palavra hebraica é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz uma explicação para a riqueza descrita no contexto e preserva o valor discursivo da conjunção.
- source_word: אֳנִיּוֹת לַמֶּלֶךְ
  choice: o rei tinha navios
  rationale: Expressa em português natural a construção hebraica de posse, literalmente «navios para/do rei».
- source_word: הֹלְכוֹת תַּרְשִׁישׁ
  choice: que iam a Társis
  rationale: Mantém o particípio verbal e entende Társis como destino ou rota, sem transformar a primeira ocorrência em simples classificação naval.
- source_word: עִם עַבְדֵי חוּרָם
  choice: com os servos de Hurão
  rationale: Tradução direta dos integrantes do serviço real de Hurão, sem acrescentar uma condição social não destacada no contexto.
- source_word: אַחַת לְשָׁלֹשׁ שָׁנִים
  choice: Uma vez a cada três anos
  rationale: Forma portuguesa clara para a expressão temporal distributiva.
- source_word: תָּבֹאנָה
  choice: chegavam
  rationale: O imperfeito descreve uma ação habitual no passado; «chegavam» comunica naturalmente a recorrência.
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: os navios de Társis
  rationale: Preserva a construção nominal tradicional, que pode designar navios ligados a Társis ou ao comércio dessa rota.
- source_word: נֹשְׂאוֹת
  choice: trazendo
  rationale: No contexto da chegada periódica, exprime de modo natural a carga transportada pelos navios.
- source_word: זָהָב וָכֶסֶף
  choice: ouro, prata
  rationale: Equivalentes diretos dos metais mencionados, organizados naturalmente na lista portuguesa.
- source_word: שֶׁנְהַבִּים
  choice: marfim
  rationale: Equivalente convencional e natural do produto comercial, embora o termo possa remontar a presas de elefante.
- source_word: וְקוֹפִים
  choice: macacos
  rationale: Identificação comum do animal; «símios» seria possível, mas é menos corrente para leitores gerais.
- source_word: וְתוּכִּיִּים
  choice: pavões
  rationale: Mantém a identificação tradicional no texto, enquanto a incerteza lexical e a alternativa «papagaios» são registradas em nota.
theological_decisions: []
