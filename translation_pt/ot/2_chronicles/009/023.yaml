  text: וְ/כֹל֙ מַלְכֵ֣י הָ/אָ֔רֶץ מְבַקְשִׁ֖ים אֶת פְּנֵ֣י שְׁלֹמֹ֑ה לִ/שְׁמֹ֨עַ֙ אֶת חָכְמָת֔/וֹ אֲשֶׁר נָתַ֥ן הָ/אֱלֹהִ֖ים בְּ/לִבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/023.yaml
  text: And all the kings of the earth sought the presence of Solomon[a], to hear his wisdom that God had put in his heart.
translation:
  language: pt
  text: E todos os reis da terra procuravam a presença de Salomão[a], para ouvir sua sabedoria, que Deus havia posto no coração dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “buscavam a face de Salomão”, expressão que significa procurar sua presença ou obter uma audiência com ele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  choice: E todos
  rationale: Mantém a continuidade narrativa expressa pela conjunção e pelo quantificador.
- source_word: מַלְכֵי הָאָרֶץ
  choice: os reis da terra
  rationale: Neste contexto internacional, “terra” preserva a abrangência da expressão hebraica sem restringi-la a uma região específica.
- source_word: מְבַקְשִׁים אֶת־פְּנֵי
  choice: procuravam a presença de
  rationale: O particípio indica ação continuada, e a formulação conserva parte da imagem hebraica ao comunicar a busca de acesso pessoal ou audiência.
- source_word: שְׁלֹמֹה
  choice: Salomão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: לִשְׁמֹעַ
  choice: para ouvir
  rationale: O infinitivo indica finalidade; “ouvir” traduz diretamente o verbo sem acrescentar explicação.
- source_word: חָכְמָתוֹ
  choice: sua sabedoria
  rationale: Reproduz de modo conciso o substantivo com sufixo possessivo, referindo-se à sabedoria de Salomão.
- source_word: אֲשֶׁר נָתַן הָאֱלֹהִים
  choice: que Deus havia posto
  rationale: Embora נָתַן signifique literalmente “deu”, com “no coração” a expressão portuguesa “havia posto” é natural e preserva a ação divina anterior.
- source_word: בְּלִבּוֹ
  choice: no coração dele
  rationale: Mantém a linguagem antropológica bíblica de “coração” e evita a possível ambiguidade de “em seu coração” quanto ao referente.
theological_decisions:
- issue: Origem divina da sabedoria de Salomão
  choice: que Deus havia posto no coração dele
  alternative: que Deus lhe havia dado
  rationale: A escolha preserva tanto a atribuição explícita da sabedoria à ação de Deus quanto a referência hebraica ao coração, sem reduzir o sentido ao intelecto.
translation_notes:
  register: Português atual, digno e acessível, com construção narrativa natural. Conserva “reis da terra”, “sabedoria” e “coração” por sua relevância imagética e teológica; a nota explica o idioma hebraico subjacente.
