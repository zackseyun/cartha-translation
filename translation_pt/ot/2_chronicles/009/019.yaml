  text: וּ/שְׁנֵ֧ים עָשָׂ֣ר אֲרָי֗וֹת עֹמְדִ֥ים שָׁ֛ם עַל שֵׁ֥שׁ הַֽ/מַּעֲל֖וֹת מִ/זֶּ֣ה וּ/מִ/זֶּ֑ה לֹא נַעֲשָׂ֥ה כֵ֖ן לְ/כָל מַמְלָכָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/019.yaml
  text: And twelve lions were standing there on the six steps[a], on this side and on that side. Nothing like it had been made for any kingdom.
translation:
  language: pt
  text: Doze leões estavam ali, sobre os seis degraus[a], de um lado e do outro. Nada semelhante havia sido feito para nenhum reino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Doze leões estavam ali nos seis degraus, um de cada lado.”'
    reason: A sintaxe hebraica permite entender a distribuição como um leão em cada lado de cada um dos seis degraus.
lexical_decisions:
- source_word: וּשְׁנֵים עָשָׂר אֲרָיוֹת
  choice: Doze leões
  rationale: O numeral e o substantivo introduzem outro elemento da descrição do trono. Em português, omitir a conjunção inicial torna a continuação descritiva mais natural sem perder a ligação com o contexto.
- source_word: עֹמְדִים שָׁם
  choice: estavam ali
  rationale: O particípio tem valor descritivo e situa as figuras no cenário. Como se trata de leões esculpidos, “estavam ali” é natural e não sugere necessariamente seres vivos em pé.
- source_word: עַל שֵׁשׁ הַמַּעֲלוֹת
  choice: sobre os seis degraus
  rationale: מַעֲלוֹת designa os degraus de acesso ao trono, e עַל indica a posição deles sobre ou ao longo desses degraus.
- source_word: מִזֶּה וּמִזֶּה
  choice: de um lado e do outro
  rationale: A expressão espacial distributiva indica disposição simétrica nos dois lados.
- source_word: לֹא נַעֲשָׂה כֵן
  choice: Nada semelhante havia sido feito
  rationale: A construção passiva expressa que não se fizera nada comparável; esta formulação preserva a ênfase na singularidade.
- source_word: לְכָל מַמְלָכָה
  choice: para nenhum reino
  rationale: Neste contexto comparativo, a preposição לְ pode indicar aquilo que foi feito ou possuído para um reino. Com a negação, “nenhum reino” comunica naturalmente o alcance geral.
