  text: וְ/הֵ֣ם מְבִיאִ֣ים אִ֣ישׁ מִנְחָת֡/וֹ כְּלֵ֣י כֶסֶף֩ וּ/כְלֵ֨י זָהָ֤ב וּ/שְׂלָמוֹת֙ נֵ֣שֶׁק וּ/בְשָׂמִ֔ים סוּסִ֖ים וּ/פְרָדִ֑ים דְּבַר שָׁנָ֖ה בְּ/שָׁנָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/024.yaml
  text: 'And they were bringing[a], each man his tribute: articles of silver and articles of gold, garments, weapons, spices, horses, and mules[c][b], year by year.'
translation:
  language: pt
  text: 'E eles traziam, cada um, o seu tributo[a]: objetos de prata e objetos de ouro, roupas[b], armas[c], especiarias, cavalos e mulas, ano após ano.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “presente” ou “oferta”. O hebraico מִנְחָה pode designar um presente ou uma oferta, mas, neste contexto régio, provavelmente tem o sentido de tributo.
    reason: lexical_alternative
  - marker: b
    text: Ou “vestes”.
    reason: lexical_alternative
  - marker: c
    text: Ou “armaduras” ou “equipamento militar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְבִיאִים
  choice: traziam
  rationale: O particípio expressa uma ação habitual ou contínua no contexto; o imperfeito português comunica a repetição das entregas.
- source_word: אִישׁ מִנְחָתוֹ
  choice: cada um, o seu tributo
  rationale: אִישׁ tem sentido distributivo, e מִנְחָה designa aqui algo apresentado ao rei. “Tributo” se ajusta ao contexto régio, sem excluir por nota o sentido mais geral de presente.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: objetos de prata e objetos de ouro
  rationale: כְּלִי é um termo amplo para objeto, recipiente ou utensílio; “objetos” preserva essa generalidade e o paralelismo.
- source_word: וּשְׂלָמוֹת
  choice: roupas
  rationale: O termo indica peças de vestuário, possivelmente vestes externas valiosas. “Roupas” é claro e não especifica indevidamente o tipo.
- source_word: נֵשֶׁק
  choice: armas
  rationale: O substantivo pode abranger armas ou equipamento militar; “armas” é a equivalência moderna mais direta no contexto da lista.
- source_word: וּבְשָׂמִים
  choice: especiarias
  rationale: Tradução natural para substâncias aromáticas valiosas em um contexto de presentes régios.
- source_word: סוּסִים וּפְרָדִים
  choice: cavalos e mulas
  rationale: Equivalentes lexicais diretos dos termos hebraicos.
- source_word: דְּבַר שָׁנָה בְּשָׁנָה
  choice: ano após ano
  rationale: A expressão idiomática indica recorrência anual; “ano após ano” preserva de modo natural seu caráter repetitivo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura enumerativa do hebraico foi mantida, e “objetos” evita restringir o sentido amplo de כְּלִי.
