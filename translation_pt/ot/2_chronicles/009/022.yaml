  yaml_path: translation/ot/2_chronicles/009/022.yaml
  text: King Solomon surpassed all the kings of the earth in wealth and wisdom.
translation:
  language: pt
  text: O rei Salomão superou todos os reis da terra em riqueza e sabedoria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: superou
  rationale: Na construção comparativa com מִן, o verbo גדל expressa superioridade em relação a outros. “Superou” comunica isso de forma natural e direta em português.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: O rei Salomão
  rationale: A expressão une o título e o nome em aposição; “o rei Salomão” é a formulação natural em português e preserva ambos.
- source_word: מִכֹּל מַלְכֵי הָאָרֶץ
  choice: todos os reis da terra
  rationale: Embora אֶרֶץ possa significar “terra” ou “país”, o contexto de comparação régia internacional favorece “terra” em sentido amplo.
- source_word: לְעֹשֶׁר
  choice: em riqueza
  rationale: O לְ indica o aspecto em que Salomão superava os demais; “em riqueza” traduz naturalmente essa relação.
- source_word: וְחָכְמָה
  choice: e sabedoria
  rationale: 'חָכְמָה significa “sabedoria”. A preposição “em” rege naturalmente os dois substantivos coordenados: “em riqueza e sabedoria”.'
