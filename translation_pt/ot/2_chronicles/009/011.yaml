reference: 2 Chronicles 9:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ הַ֠/מֶּלֶךְ אֶת עֲצֵ֨י הָֽ/אַלְגּוּמִּ֜ים מְסִלּ֤וֹת לְ/בֵית יְהוָה֙ וּ/לְ/בֵ֣ית הַ/מֶּ֔לֶךְ וְ/כִנֹּר֥וֹת וּ/נְבָלִ֖ים לַ/שָּׁרִ֑ים וְ/לֹא נִרְא֥וּ כָ/הֵ֛ם לְ/פָנִ֖ים בְּ/אֶ֥רֶץ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/011.yaml
  text: And the king made from the algum wood stairways for the house of Yahweh and for the king’s house[a], and lyres and harps for the singers[b]. Nothing like them had been seen before in the land of Judah.
translation:
  language: pt
  text: O rei fez da madeira de algum[a] passarelas[b] para a casa de Yahweh e para a casa do rei, além de liras e harpas para os cantores. Nunca antes se tinham visto coisas semelhantes na terra de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “algum”. Na passagem paralela de 1Reis 10:12, a madeira é chamada “almugue”. A espécie exata é incerta.'
    reason: cross_reference
  - marker: b
    text: Ou “escadarias”. O termo hebraico pode indicar acessos arquitetônicos, passarelas ou escadas.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצֵי הָאַלְגּוּמִּים
  choice: madeira de algum
  rationale: O termo designa uma madeira importada e valiosa, mas sua espécie exata é desconhecida. A transliteração acompanha a forma de Crônicas sem propor uma identificação botânica incerta.
- source_word: מְסִלּוֹת
  choice: passarelas
  rationale: Embora o substantivo possa designar caminhos elevados e, neste contexto, talvez escadarias, “passarelas” conserva o sentido arquitetônico amplo sem resolver indevidamente a incerteza.
- source_word: לְבֵית יְהוָה וּלְבֵית הַמֶּלֶךְ
  choice: para a casa de Yahweh e para a casa do rei
  rationale: Mantém o substantivo hebraico “casa” e seu paralelismo, evitando substituir diretamente os termos por “templo” e “palácio”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama.
- source_word: כִנֹּרוֹת וּנְבָלִים
  choice: liras e harpas
  rationale: Distingue os dois tipos de instrumentos de cordas com equivalentes modernos compreensíveis, embora sua identificação exata permaneça incerta.
- source_word: לַשָּׁרִים
  choice: para os cantores
  rationale: Traduz diretamente a forma derivada do verbo “cantar”.
- source_word: וְלֹא נִרְאוּ כָהֵם לְפָנִים
  choice: Nunca antes se tinham visto coisas semelhantes
  rationale: Reproduz de modo natural a ideia de que tais objetos não tinham precedentes, sem restringir de maneira explícita o referente do pronome plural.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: na terra de Judá
  rationale: Conserva o substantivo geográfico explícito “terra”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome divino, não um título; “Yahweh” preserva essa distinção.
translation_notes:
  register: Português moderno, claro e digno, com vocabulário acessível e estrutura próxima do hebraico. “Além de” evita uma sequência pesada de conjunções, e a formulação final preserva a possível amplitude do referente de “coisas semelhantes”.
