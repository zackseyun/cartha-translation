  yaml_path: translation/ot/2_chronicles/009/016.yaml
  text: and three hundred shields of beaten gold[a]; three hundred shekels of gold went onto each shield[c][b]. And the king put them in the House of the Forest of Lebanon.
translation:
  language: pt
  text: Fez também trezentos escudos de ouro batido; em cada escudo foram aplicados trezentos siclos de ouro.[a] O rei os colocou na Casa da Floresta do Líbano.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “trezentos de ouro” para cada escudo, sem indicar a unidade; “siclos” foi suprido para dar clareza, com base no paralelo de 1 Reis 10:17.
    reason: lexical_alternative
  - marker: b
    text: A Casa da Floresta do Líbano era um edifício real assim denominado; também se pode traduzir “Palácio da Floresta do Líbano”.
    reason: cultural_note
lexical_decisions:
- source_word: מָגִנִּים
  choice: escudos
  rationale: מָגֵן designa genericamente um escudo; “escudos” é claro, natural e não especifica indevidamente um subtipo.
- source_word: זָהָב שָׁחוּט
  choice: ouro batido
  rationale: שָׁחוּט descreve aqui ouro trabalhado, provavelmente martelado em lâminas; “ouro batido” conserva esse sentido de fabricação de modo conciso.
- source_word: שְׁלֹשׁ מֵאוֹת זָהָב
  choice: trezentos siclos de ouro
  rationale: O hebraico omite a unidade e diz literalmente “trezentos de ouro”. “Siclos” é suprido para tornar a medida compreensível, com apoio no paralelo de 1 Reis 10:17, mas a omissão é registrada em nota.
- source_word: יַעֲלֶה עַל
  choice: foram usados em
  rationale: A expressão indica que essa quantidade de ouro era aplicada a cada escudo. A formulação portuguesa é natural e evita o pouco idiomático “subia sobre”.
- source_word: הַמָּגֵן הָאֶחָת
  choice: cada escudo
  rationale: Embora a forma seja singular, “o escudo, um”, o contexto exige sentido distributivo entre os trezentos escudos.
- source_word: וַיִּתְּנֵם
  choice: os colocou
  rationale: Com objeto e indicação de lugar, נתן tem o sentido comum de pôr ou colocar.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: Casa da Floresta do Líbano
  rationale: A expressão é o nome de um edifício real específico. A tradução preserva sua forma nominal e evita inserir “palácio”, que é explicativo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A abertura “Fez também” explicita naturalmente o sujeito régio recuperável do contexto e traduz o waw continuativo sem rigidez. As notas preservam a unidade de peso implícita e a possível tradução funcional do nome do edifício.
