source:
  edition: WLC
  text: וּ/מַֽלְכַּת שְׁבָ֗א שָֽׁמְעָה֮ אֶת שֵׁ֣מַע שְׁלֹמֹה֒ וַ/תָּב֣וֹא לְ/נַסּוֹת֩ אֶת שְׁלֹמֹ֨ה בְ/חִיד֜וֹת בִּ/ירֽוּשָׁלִַ֗ם בְּ/חַ֣יִל כָּבֵ֣ד מְאֹ֡ד וּ֠/גְמַלִּים נֹשְׂאִ֨ים בְּשָׂמִ֧ים וְ/זָהָ֛ב לָ/רֹ֖ב וְ/אֶ֣בֶן יְקָרָ֑ה וַ/תָּבוֹא֙ אֶל שְׁלֹמֹ֔ה וַ/תְּדַבֵּ֣ר עִמּ֔/וֹ אֵ֛ת כָּל אֲשֶׁ֥ר הָיָ֖ה עִם לְבָבָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/001.yaml
  text: The queen of Sheba heard of Solomon’s fame[a], and she came to Jerusalem to test Solomon with riddles, with a very great retinue and camels carrying spices, gold in abundance, and precious stones. When she came to Solomon[c][b], she spoke with him about all that was in her heart.
translation:
  language: pt
  text: A rainha de Sabá ouviu falar da fama de Salomão[a] e foi a Jerusalém para pôr Salomão à prova com enigmas[b]. Ela chegou com uma comitiva muito numerosa e com camelos carregados de especiarias, ouro em abundância e pedras preciosas. Quando se apresentou a Salomão, conversou com ele sobre tudo o que trazia no coração[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ouviu as notícias a respeito de Salomão”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “com perguntas difíceis”.'
    reason: lexical_alternative
  - marker: c
    text: Em hebraico, “tudo o que estava em seu coração”, expressão que abrange seus pensamentos, perguntas e preocupações.
    reason: cultural_note
lexical_decisions:
- source_word: שֵׁמַע
  choice: fama
  rationale: No contexto, o substantivo se refere às notícias difundidas a respeito de Salomão; “fama” expressa isso de modo natural, enquanto a nota preserva a alternativa mais literal “notícias”.
- source_word: לְנַסּוֹת
  choice: pôr à prova
  rationale: O infinitivo indica que a rainha pretendia testar a capacidade de Salomão, especialmente por meio dos enigmas mencionados em seguida.
- source_word: בְחִידוֹת
  choice: com enigmas
  rationale: חִידוֹת designa enigmas, ditos obscuros ou questões que exigem interpretação; “enigmas” preserva a concretude e a amplitude do termo.
- source_word: בִּירוּשָׁלִַם
  choice: a Jerusalém
  rationale: Embora a preposição hebraica seja normalmente locativa, com o verbo de movimento ela indica naturalmente o destino em português.
- source_word: בְּחַיִל כָּבֵד מְאֹד
  choice: com uma comitiva muito numerosa
  rationale: חַיִל pode indicar força, riqueza, exército ou grupo de acompanhantes. Neste contexto de viagem régia e bens de luxo, “comitiva” é a leitura contextual mais natural; “muito numerosa” transmite o caráter excepcional de כָּבֵד מְאֹד.
- source_word: בְּשָׂמִים
  choice: especiarias
  rationale: O plural refere-se a substâncias aromáticas valiosas, convencionalmente descritas como especiarias neste contexto de presentes régios.
- source_word: לָרֹב
  choice: em abundância
  rationale: A expressão indica a grande quantidade do ouro e é reproduzida por uma formulação portuguesa clara e idiomática.
- source_word: אֶבֶן יְקָרָה
  choice: pedras preciosas
  rationale: Embora formalmente singular, a expressão tem sentido coletivo nesta enumeração de bens valiosos.
- source_word: וַתְּדַבֵּר עִמּוֹ
  choice: conversou com ele
  rationale: O verbo com עִם sugere interação ou diálogo; “conversou com ele” comunica essa reciprocidade com naturalidade.
- source_word: אֵת כָּל אֲשֶׁר הָיָה עִם לְבָבָהּ
  choice: sobre tudo o que trazia no coração
  rationale: A formulação mantém a imagem antropológica hebraica do coração como sede dos pensamentos, preocupações e intenções, sem restringi-la apenas à mente.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi dividida em três períodos para evitar uma frase excessivamente longa sem alterar a sequência narrativa. A abertura não acrescenta marcador temporal ausente no hebraico. As imagens hebraicas relevantes foram preservadas, com notas para alternativas lexicais e para o sentido idiomático de “coração”.
