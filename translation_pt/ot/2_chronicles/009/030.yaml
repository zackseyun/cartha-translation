lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: O imperfeito consecutivo de מלך relata o reinado de Salomão no passado; “reinou” é a forma portuguesa natural e específica para o exercício da realeza.
- source_word: שְׁלֹמֹה
  choice: Salomão
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: בִירוּשָׁלִַם
  choice: em Jerusalém
  rationale: A preposição ב indica localização; “em Jerusalém” é a expressão corrente e direta em português.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: sobre todo o Israel
  rationale: עַל com מלך indica domínio régio. “Todo o Israel” preserva o sentido corporativo e nacional da expressão hebraica.
- source_word: אַרְבָּעִים שָׁנָה
  choice: durante quarenta anos
  rationale: A construção hebraica indica a duração do reinado; “durante” torna essa relação temporal explícita e natural em português, sem alterar o conteúdo.
