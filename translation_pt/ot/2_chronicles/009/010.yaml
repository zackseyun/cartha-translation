base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/010.yaml
  text: And also the servants of Hiram and the servants of Solomon[a], who brought gold from Ophir[c][b], brought algum wood and precious stones.
translation:
  language: pt
  text: Também os servos de Hirão e os servos de Salomão, que trouxeram ouro de Ofir, trouxeram madeira de algumins[a] e pedras preciosas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “madeira de almugue”; não se sabe ao certo qual espécie de árvore o termo hebraico designa.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “pedra preciosa”, no singular, provavelmente com sentido coletivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Também
  rationale: Em português, “Também” expressa naturalmente a força aditiva e mantém a continuidade da narrativa sem a redundância pouco idiomática de “E também”.
- source_word: עַבְדֵי
  choice: servos
  rationale: No contexto da administração real, o termo designa pessoas a serviço dos reis, sem exigir aqui a ênfase específica de “escravos”.
- source_word: חירם
  choice: Hirão
  rationale: Adota-se a forma tradicional e amplamente reconhecida em português para o nome hebraico חירם.
- source_word: אֲשֶׁר הֵבִיאוּ זָהָב מֵאוֹפִיר
  choice: que trouxeram ouro de Ofir
  rationale: A oração relativa identifica os servos envolvidos no transporte do ouro; o pretérito perfeito traduz de modo direto e natural a forma verbal hebraica.
- source_word: עֲצֵי אַלְגּוּמִּים
  choice: madeira de algum
  rationale: A espécie vegetal é incerta; a transliteração preserva o termo hebraico sem impor uma identificação botânica especulativa.
- source_word: וְאֶבֶן יְקָרָה
  choice: e pedras preciosas
  rationale: Embora “pedra” esteja no singular em hebraico, o uso provavelmente é coletivo; o plural é mais natural em português numa lista de mercadorias.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do hebraico sem perder naturalidade. Mantém-se o paralelismo entre “os servos de Hirão” e “os servos de Salomão”. As notas registram as duas incertezas lexicais reais do texto.
