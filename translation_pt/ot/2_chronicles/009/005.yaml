  yaml_path: translation/ot/2_chronicles/009/005.yaml
  text: Then she said to the king[a], “The report that I heard in my own land about your words and your wisdom was true.”
translation:
  language: pt
  text: 'Então ela disse ao rei: “Era verdade o que ouvi na minha terra sobre as suas palavras e a sua sabedoria.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Então ela disse
  rationale: O wayyiqtol dá continuidade à sequência narrativa; “Então ela disse” é natural em português e preserva esse avanço.
- source_word: אֶל־הַמֶּלֶךְ
  choice: ao rei
  rationale: Expressa diretamente o destinatário da fala.
- source_word: אֱמֶת הַדָּבָר
  choice: Era verdade o que ouvi
  rationale: A construção hebraica afirma que a notícia ou informação ouvida era verdadeira. Esta formulação é idiomática em português sem restringir דָּבָר a “palavra” ou “assunto”.
- source_word: אֲשֶׁר שָׁמַעְתִּי
  choice: o que ouvi
  rationale: Traduz naturalmente a oração relativa no contexto da afirmação sobre a veracidade do relato.
- source_word: בְּאַרְצִי
  choice: na minha terra
  rationale: Preserva o substantivo “terra” e o sufixo de primeira pessoa, mantendo um registro bíblico claro e atual.
- source_word: עַל־דְּבָרֶיךָ
  choice: sobre as suas palavras
  rationale: Mantém o sentido lexical mais direto de דְּבָרֶיךָ e preserva a possível referência às palavras ou declarações de Salomão, sem eliminar a amplitude semântica do termo.
- source_word: וְעַל־חָכְמָתֶךָ
  choice: e a sua sabedoria
  rationale: Tradução direta, preservando o tema central da sabedoria de Salomão.
