base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/006.yaml
  text: But I did not believe their words until I came and my own eyes saw it[a]; and behold, not even half of the greatness of your wisdom had been told to me[b]. You have surpassed the report that I heard.
translation:
  language: pt
  text: Mas não acreditei no que eles diziam até que vim e vi com meus próprios olhos; e eis que não me haviam contado nem a metade da grandeza da sua sabedoria.[a] Você superou[b] o relato que eu tinha ouvido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da abundância da sua sabedoria”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Você foi além do relato que eu tinha ouvido”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱמַנְתִּי
  choice: não acreditei
  rationale: O hifil de אמן indica considerar algo verdadeiro ou digno de crédito. “Não acreditei” expressa naturalmente a reação da rainha aos testemunhos recebidos.
- source_word: לְדִבְרֵיהֶם
  choice: no que eles diziam
  rationale: דברים significa literalmente “palavras”, mas, neste contexto de testemunho oral, “no que eles diziam” é mais natural em português e mantém o sentido.
- source_word: וַתִּרְאֶינָה עֵינַי
  choice: ver com os meus próprios olhos
  rationale: A expressão hebraica, literalmente “meus olhos viram”, enfatiza a comprovação pessoal; a formulação portuguesa preserva essa ênfase com naturalidade.
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: הִנֵּה chama vividamente a atenção para uma constatação surpreendente. “E eis que” conserva essa força discursiva em registro bíblico compreensível.
- source_word: מַרְבִּית חָכְמָתֶךָ
  choice: a grandeza da sua sabedoria
  rationale: מַרְבִּית pode denotar grandeza, abundância ou magnitude. “A grandeza da sua sabedoria” comunica bem a extensão extraordinária reconhecida pela rainha; a alternativa “abundância” é registrada em nota.
- source_word: הֻגַּד לִי
  choice: não me haviam contado
  rationale: O hofal de נגד tem sentido passivo, “foi contado/relatado”. O mais-que-perfeito composto situa naturalmente o relato antes da chegada e da observação da rainha.
- source_word: יָסַפְתָּ עַל
  choice: Você superou
  rationale: יסף com עַל expressa aqui ir além ou exceder. “Você superou” mantém Salomão como sujeito, como no hebraico, e apresenta com clareza a comparação com o relato anterior.
- source_word: הַשְּׁמוּעָה אֲשֶׁר שָׁמָעְתִּי
  choice: o relato que eu tinha ouvido
  rationale: שְׁמוּעָה é aquilo que se ouve, isto é, notícia ou relato. “Relato” é neutro e não sugere a possível falta de credibilidade associada a “rumor”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “E eis que” preserva a vivacidade do hebraico, enquanto “ver com os meus próprios olhos” comunica de modo idiomático a ênfase da experiência direta. O tratamento “você/sua” evita regionalismos e mantém clareza contemporânea.
