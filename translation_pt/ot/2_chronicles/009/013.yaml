base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/013.yaml
  text: The weight of the gold that came to Solomon in one year was six hundred sixty-six talents of gold,[a]
translation:
  language: pt
  text: O peso do ouro que chegou a Salomão em um ano foi de seiscentos e sessenta e seis talentos de ouro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que foi levado a Salomão”; o hebraico diz literalmente “que chegou a Salomão”, sem indicar quem o levou.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: foi
  rationale: A forma narrativa de היה introduz a declaração; em português, o verbo na oração principal transmite naturalmente a sequência sem acrescentar um marcador temporal inexistente.
- source_word: מִשְׁקַל הַזָּהָב
  choice: O peso do ouro
  rationale: Preserva a referência específica ao peso e o artigo definido do hebraico em linguagem portuguesa natural.
- source_word: אֲשֶׁר בָּא
  choice: que chegou
  rationale: Traduz diretamente a ideia de que o ouro 'veio/chegou', sem especificar quem o levou.
- source_word: לִשְׁלֹמֹה
  choice: a Salomão
  rationale: Expressa direção ou recepção, conforme o uso da preposição ל neste contexto.
- source_word: בְּשָׁנָה אֶחָת
  choice: em um ano
  rationale: Reproduz de modo simples e claro o período de um ano indicado pelo texto.
- source_word: שֵׁשׁ מֵאוֹת וְשִׁשִּׁים וָשֵׁשׁ
  choice: seiscentos e sessenta e seis
  rationale: Mantém exatamente o numeral cardinal, segundo a forma idiomática do português.
- source_word: כִּכְּרֵי זָהָב
  choice: talentos de ouro
  rationale: ‘Talento’ é o termo tradicional e reconhecível para a grande unidade antiga de peso כִּכָּר.
theological_decisions:
- issue: Possível significado simbólico do número 666
  choice: Apresentar o número simplesmente como uma quantidade histórica.
  alternative: Sinalizar uma possível relação simbólica com usos bíblicos posteriores do número 666.
  rationale: O versículo registra o peso anual do ouro e não atribui significado simbólico ao número; a tradução não deve importar associações posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção preserva a ausência de agente no hebraico e evita acrescentar um marcador discursivo como “Ora” ou “Então”.
