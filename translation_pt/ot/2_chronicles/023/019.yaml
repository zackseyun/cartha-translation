id: 2CH.23.19
reference: 2 Chronicles 23:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַֽ/יַּעֲמֵד֙ הַ/שּׁ֣וֹעֲרִ֔ים עַֽל שַׁעֲרֵ֖י בֵּ֣ית יְהוָ֑ה וְ/לֹֽא יָבֹ֥א טָמֵ֖א לְ/כָל דָּבָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/019.yaml
  text: He stationed the gatekeepers at the gates of the house of Yahweh[a], so that no one unclean in any respect might enter.
translation:
  language: pt
  text: Ele colocou os porteiros junto aos portões da casa de Yahweh, para que ninguém impuro por qualquer motivo entrasse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “e não entrará impuro por qualquer coisa”. A expressão pode abranger qualquer tipo ou causa de impureza.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: colocou
  rationale: O hifil de עמד indica que Joiada fez os porteiros tomarem seus postos; “colocou” expressa isso de modo natural e sem acrescentar a ideia mais específica de nomeação.
- source_word: הַשּׁוֹעֲרִים
  choice: os porteiros
  rationale: Designa os responsáveis por guardar as entradas; “porteiros” é claro e corrente no contexto do templo.
- source_word: עַל שַׁעֲרֵי
  choice: junto aos portões
  rationale: Neste contexto de posicionamento, עַל indica a localização dos porteiros nas entradas; “junto aos portões” evita a leitura espacial inadequada de “sobre”.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: “Casa” preserva בֵּית, enquanto “Yahweh” translitera o nome divino יהוה presente no texto hebraico.
- source_word: וְלֹא יָבֹא
  choice: para que ... entrasse
  rationale: A sequência com a forma verbal negativa comunica, no contexto, o propósito de impedir a entrada.
- source_word: טָמֵא
  choice: impuro
  rationale: No contexto de acesso ao templo, o termo designa impureza ritual; “impuro” é natural e mantém a categoria cultual.
- source_word: לְכָל דָּבָר
  choice: por qualquer motivo
  rationale: A expressão idiomática amplia a proibição a qualquer causa ou espécie de impureza, sem a estranheza da tradução literal “por qualquer coisa”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz explicitamente o Tetragrama; “Yahweh” preserva o nome próprio em vez de substituí-lo por um título.
- issue: Natureza da impureza em טָמֵא
  choice: impuro
  alternative: contaminado
  rationale: “Impuro” conserva a categoria ritual ligada ao acesso ao santuário e não a reduz necessariamente a sujeira física ou culpa moral.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação preserva “casa” para o templo e mantém o caráter ritual de “impuro”, ao mesmo tempo que explicita com naturalidade a força idiomática de לְכָל דָּבָר.
