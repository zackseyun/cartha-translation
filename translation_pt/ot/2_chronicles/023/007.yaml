  text: וְ/הִקִּיפוּ֩ הַ/לְוִיִּ֨ם אֶת הַ/מֶּ֜לֶךְ סָבִ֗יב אִ֚ישׁ וְ/כֵלָ֣י/ו בְּ/יָד֔/וֹ וְ/הַ/בָּ֥א אֶל הַ/בַּ֖יִת יוּמָ֑ת וִֽ/הְי֥וּ אֶת הַ/מֶּ֖לֶךְ בְּ/בֹא֥/וֹ וּ/בְ/צֵאתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/007.yaml
  text: The Levites shall surround the king on every side[a], each man with his weapons in his hand; and whoever enters the house shall be put to death. Be with the king when he comes in and when he goes out.
translation:
  language: pt
  text: Os levitas cercarão o rei por todos os lados, cada um com suas armas na mão. Quem entrar na casa[a] será morto. Acompanhem o rei quando ele entrar e quando sair.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “templo”. Em hebraico, “casa”, uma designação comum do templo em Crônicas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקִּיפוּ הַלְוִיִּם אֶת הַמֶּלֶךְ סָבִיב
  choice: Os levitas cercarão o rei por todos os lados
  rationale: O hifil de הִקִּיפוּ, no contexto das instruções de Joiada, tem força diretiva. O futuro em português preserva essa força, e “por todos os lados” comunica a abrangência de סָבִיב.
- source_word: אִישׁ וְכֵלָיו בְּיָדוֹ
  choice: cada um com suas armas na mão
  rationale: אִישׁ tem sentido distributivo, e כֵלָיו designa aqui armas ou equipamentos de combate. A formulação é natural e mantém a imagem concreta do hebraico.
- source_word: וְהַבָּא אֶל הַבַּיִת
  choice: Quem entrar na Casa
  rationale: 'O particípio com artigo tem valor genérico: “quem entrar”. “Casa” conserva o termo hebraico sem substituir no texto principal sua referência contextual pelo termo mais específico “templo”.'
- source_word: יוּמָת
  choice: será morto
  rationale: A forma hofal expressa ação passiva e causativa, indicando que o invasor deverá sofrer morte, não apenas que morrerá.
- source_word: וִהְיוּ אֶת הַמֶּלֶךְ
  choice: Acompanhem o rei
  rationale: A construção היה אֶת exprime estar junto de alguém. No contexto de guarda e proteção, “acompanhem” comunica naturalmente a presença contínua exigida sem acrescentar uma interpretação doutrinária.
- source_word: בְּבֹאוֹ וּבְצֵאתוֹ
  choice: quando ele entrar e quando sair
  rationale: Mantém o paralelismo hebraico referente aos movimentos do rei em português corrente e claro.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Emprega-se “Casa” com inicial maiúscula para sinalizar a referência ao santuário sem eliminar a formulação literal do hebraico; a nota registra a alternativa contextual.
