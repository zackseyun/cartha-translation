  terminology: “Casa de Yahweh”, “sacerdotes”, “levitas”, “santos” e “encargo de Yahweh” são escolhas adequadas. A nota a deve apresentar “templo” como alternativa contextual, não como identificação introduzida por “Isto é”. A nota b pode formular as alternativas de modo mais natural e próximo da construção hebraica.
