  text: וְ/אַל יָב֣וֹא בֵית יְהוָ֗ה כִּ֤י אִם הַ/כֹּֽהֲנִים֙ וְ/הַ/מְשָׁרְתִ֣ים לַ/לְוִיִּ֔ם הֵ֥מָּה יָבֹ֖אוּ כִּי קֹ֣דֶשׁ הֵ֑מָּה וְ/כָל הָ/עָ֔ם יִשְׁמְר֖וּ מִשְׁמֶ֥רֶת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/006.yaml
  text: And let no one enter the house of Yahweh except the priests and the ministering Levites[a]; they may enter, because they are holy[b]. And let all the people keep the charge of Yahweh.
translation:
  language: pt
  text: Que ninguém entre na casa de Yahweh[a], a não ser os sacerdotes e os levitas que estão de serviço. Eles podem entrar, pois são santos. Todo o povo cumpra o encargo de Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o templo de Yahweh”. Literalmente, “a casa de Yahweh”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão também pode ser traduzida como “manter a vigilância para Yahweh” ou “observar a determinação de Yahweh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַל יָבוֹא
  choice: Que ninguém entre
  rationale: אַל com o jussivo de בוא expressa uma proibição; esta formulação preserva sua força diretiva em português natural.
- source_word: בֵית יְהוָה
  choice: casa de Yahweh
  rationale: Mantém a expressão hebraica literal e inteligível; neste contexto, refere-se ao templo.
- source_word: כִּי אִם
  choice: a não ser
  rationale: Introduz de modo claro a exceção à proibição.
- source_word: הַכֹּהֲנִים וְהַמְשָׁרְתִים לַלְוִיִּם
  choice: os sacerdotes e os levitas que estão de serviço
  rationale: מְשָׁרְתִים indica os levitas que exercem serviço cultual; a oração relativa é mais natural e clara que uma construção adjetival rígida.
- source_word: הֵמָּה יָבֹאוּ
  choice: Eles podem entrar
  rationale: No contexto da exceção, a forma verbal comunica autorização de entrada, não mera previsão futura.
- source_word: כִּי קֹדֶשׁ הֵמָּה
  choice: pois são santos
  rationale: Preserva a categoria bíblica de santidade; no contexto, trata-se de condição sagrada ou consagração para o serviço.
- source_word: יִשְׁמְרוּ מִשְׁמֶרֶת יְהוָה
  choice: cumpra o encargo de Yahweh
  rationale: A construção cognata שמר משמרת pode abranger guardar, observar ou cumprir uma responsabilidade determinada; “cumprir o encargo” conserva o sentido de dever sagrado sem restringi-lo à vigilância física.
theological_decisions:
- issue: Santidade cultual dos sacerdotes e levitas
  choice: são santos
  alternative: estão consagrados / foram separados
  rationale: “Santos” preserva o termo e a categoria do texto hebraico. O contexto indica qualificação cultual para entrar no santuário, sem afirmar perfeição moral.
- issue: Representação do nome divino
  choice: Yahweh
  alternative: SENHOR / Jeová
  rationale: A transliteração representa o nome pessoal יהוה e evita substituí-lo por um título.
- issue: Natureza da obrigação atribuída ao povo
  choice: cumpra o encargo de Yahweh
  alternative: mantenha a vigilância de Yahweh / observe a determinação de Yahweh
  rationale: A expressão hebraica admite a ideia de encargo, observância ou vigilância. O texto principal usa uma formulação abrangente, e a nota preserva as alternativas genuínas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência. “Porém” explicita o contraste já presente entre os autorizados a entrar e o restante do povo, sem acrescentar conteúdo doutrinário.
