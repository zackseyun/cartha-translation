base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/015.yaml
  text: So they laid hands on her[a], and she went to the entrance of the Horse Gate at the king’s house[b], and they put her to death there.
translation:
  language: pt
  text: Então abriram caminho para ela[a], e ela foi até a entrada do Portão dos Cavalos, junto ao palácio real[b], e ali a mataram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “puseram as mãos sobre ela”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “casa do rei”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ לָהּ יָדַיִם
  choice: eles a agarraram
  rationale: A expressão diz literalmente que puseram as mãos sobre ela; no contexto de detenção seguida de morte, comunica que a agarraram. A nota preserva a forma literal e a possível nuance idiomática.
- source_word: מְבוֹא
  choice: entrada
  rationale: Designa o lugar de acesso ou entrada e combina naturalmente com o nome do portão.
- source_word: שַׁעַר הַסּוּסִים
  choice: Portão dos Cavalos
  rationale: A expressão parece funcionar como nome próprio de um portão; esta forma é clara e idiomática em português.
- source_word: בֵּית הַמֶּלֶךְ
  choice: junto ao palácio real
  rationale: Literalmente, 'casa do rei'. Neste contexto arquitetônico, 'palácio real' transmite com naturalidade o referente, enquanto 'junto a' expressa a associação espacial do portão sem impor uma relação construtiva excessivamente rígida.
- source_word: וַיְמִיתוּהָ
  choice: a mataram
  rationale: O hifil de מות significa causar a morte. 'Mataram' é direto e exato; 'executaram' acrescentaria uma formalidade jurídica não explicitada pelo verbo.
- source_word: שָׁם
  choice: ali
  rationale: Advérbio locativo que retoma naturalmente o lugar mencionado imediatamente antes.
