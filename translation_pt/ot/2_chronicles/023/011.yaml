base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/011.yaml
  text: Then they brought out the king’s son[a], put the crown and the testimony on him, made him king, and anointed him; and Jehoiada and his sons said, “Long live the king!”
translation:
  language: pt
  text: 'Então trouxeram para fora o filho do rei, puseram sobre ele a coroa e o testemunho[a], fizeram-no rei e o ungiram; e Joiada e seus filhos disseram: “Viva o rei!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a lei” ou “o documento da aliança”. O termo hebraico provavelmente se refere ao testemunho escrito da aliança relacionado ao governo do rei.
    reason: Alternativa lexical e esclarecimento do provável referente contextual de הָעֵדוּת.
lexical_decisions:
- source_word: וַיּוֹצִיאוּ
  choice: trouxeram para fora
  rationale: O hifil de יצא expressa fazer sair ou trazer para fora; a formulação é clara e adequada à apresentação cerimonial do herdeiro.
- source_word: בֶּן־הַמֶּלֶךְ
  choice: o filho do rei
  rationale: Reproduz naturalmente a relação de construção hebraica e preserva a identificação dinástica central à cena.
- source_word: הַנֵּזֶר
  choice: a coroa
  rationale: No contexto de entronização, נזר designa o diadema ou sinal régio de consagração; “coroa” é a opção mais acessível sem perder o sentido.
- source_word: הָעֵדוּת
  choice: o testemunho
  rationale: Mantém o sentido básico de ‘testemunho’ ou ‘documento que serve de testemunho’ e preserva sua ressonância pactual sem especificar além do que o hebraico permite.
- source_word: וַיַּמְלִיכוּ אֹתוֹ
  choice: fizeram-no rei
  rationale: O hifil de מלך significa fazer alguém reinar ou constituí-lo rei; esta tradução distingue o ato de entronização da colocação anterior da coroa.
- source_word: וַיִּמְשָׁחֻהוּ
  choice: o ungiram
  rationale: “Ungir” é a tradução estabelecida e precisa de משׁח em cerimônias de instalação régia, preservando sua importância ritual e teológica.
- source_word: יְהוֹיָדָע וּבָנָיו
  choice: Joiada e seus filhos
  rationale: Tradução direta da coordenação nominal, identificando explicitamente os participantes da aclamação seguinte.
- source_word: יְחִי הַמֶּלֶךְ
  choice: Viva o rei!
  rationale: Equivalente idiomático português da aclamação régia volitiva, conservando sua força pública e celebrativa.
theological_decisions:
- issue: Sentido de הָעֵדוּת no rito de coroação
  choice: testemunho
  alternative: lei; documento da aliança
  rationale: O termo hebraico é mais amplo do que um simples código legal e pode referir-se ao testemunho escrito ligado às obrigações pactuais do rei. A tradução formal preserva essa amplitude e a tensão lexical, enquanto a nota apresenta as principais interpretações contextuais.
- issue: Identidade dos que ungiram o rei
  choice: Manter o sujeito plural implícito em “o ungiram” e introduzir depois Joiada e seus filhos como sujeitos de “disseram”
  alternative: Explicitar Joiada e seus filhos como os que o ungiram
  rationale: A sequência hebraica não exige que Joiada e seus filhos sejam identificados retrospectivamente como sujeito exclusivo da unção. A formulação conserva a estrutura e evita resolver uma possível ambiguidade.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Fizeram-no rei” mantém concisão cerimonial; “Viva o rei!” reproduz a aclamação régia natural em português. O ponto e vírgula acompanha a sequência hebraica e evita atribuir necessariamente a unção apenas a Joiada e seus filhos.
