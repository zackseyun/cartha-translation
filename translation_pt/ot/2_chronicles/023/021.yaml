base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/021.yaml
  text: And all the people of the land rejoiced[a], and the city was quiet. And they put Athaliah to death with the sword.
translation:
  language: pt
  text: E todo o povo da terra se alegrou, e a cidade ficou tranquila. E mataram Atalia à espada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: se alegrou
  rationale: O verbo שׂמח expressa alegria; a forma singular concorda naturalmente em português com o coletivo «todo o povo».
- source_word: כָל עַם הָאָרֶץ
  choice: todo o povo da terra
  rationale: Preserva a expressão hebraica e evita especificar «país» ou um grupo social mais restrito do que o texto exige.
- source_word: וְהָעִיר שָׁקָטָה
  choice: e a cidade ficou tranquila
  rationale: שׁקט descreve quietude ou ausência de perturbação. «Ficou tranquila» é natural em português e mantém a referência não explicitada à cidade.
- source_word: וְאֶת עֲתַלְיָהוּ הֵמִיתוּ
  choice: E mataram Atalia
  rationale: O hifil de מות significa causar a morte, isto é, matar ou executar. «Mataram» é direto e não acrescenta uma caracterização jurídica que o verbo isoladamente não exige; o waw foi mantido como coordenação simples.
- source_word: בֶחָרֶב
  choice: à espada
  rationale: Expressa de modo idiomático em português o instrumento indicado por ב + חֶרֶב.
