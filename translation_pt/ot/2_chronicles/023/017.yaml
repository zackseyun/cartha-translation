base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/017.yaml
  text: Then all the people went to the house of Baal and tore it down, and they smashed his altars and his images, and they killed Mattan the priest of Baal before the altars.
translation:
  language: pt
  text: Então todo o povo foi ao templo de Baal e o demoliu; despedaçou os altares e as imagens de Baal e matou Matã, sacerdote de Baal, diante dos altares.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית הַבַּעַל
  choice: templo de Baal
  rationale: Embora literalmente seja “casa de Baal”, no contexto trata-se do edifício dedicado ao culto de Baal; “templo” comunica isso naturalmente em português.
- source_word: וַיִּתְּצֻהוּ
  choice: e o derrubou
  rationale: O verbo indica demolir ou derrubar a construção; o pronome retoma o templo.
- source_word: שִׁבֵּרוּ
  choice: Despedaçaram
  rationale: O piel expressa uma ação destrutiva intensa, aplicada tanto aos altares como às imagens.
- source_word: צְלָמָיו
  choice: as imagens de Baal
  rationale: “Imagens” traduz o termo de modo direto; repetir “de Baal” evita em português a possível leitura de que o pronome se refere ao templo.
- source_word: לִפְנֵי הַמִּזְבְּחוֹת
  choice: diante dos altares
  rationale: Preserva a referência espacial do hebraico sem especificar uma relação teológica além do texto.
theological_decisions:
- issue: Referente dos sufixos em “seus altares” e “suas imagens”
  choice: altares e imagens de Baal
  alternative: seus altares e suas imagens
  rationale: O hebraico usa sufixos masculinos singulares referentes a Baal. A explicitação mantém esse sentido e elimina uma ambiguidade pronominal criada pelo português.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. “Matã” segue uma transliteração natural do hebraico מַתָּן.
