base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/001.yaml
  text: 'In the seventh year Jehoiada strengthened himself and took the commanders of hundreds into covenant with him: Azariah son of Jeroham[a], Ishmael son of Jehohanan, Azariah son of Obed, Maaseiah son of Adaiah, and Elishaphat son of Zichri.'
translation:
  language: pt
  text: 'No sétimo ano, Joiada fortaleceu-se e fez uma aliança com os comandantes de centenas[a]: Azarias, filho de Jeroão; Ismael, filho de Joanã; Azarias, filho de Obede; Maaseias, filho de Adaías; e Elisafate, filho de Zicri.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tomou os comandantes consigo na aliança” ou “os trouxe para uma aliança consigo”. A expressão hebraica combina literalmente “tomou” com “consigo” e “na aliança”, indicando que Joiada os incorporou a um pacto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַשָּׁנָה הַשְּׁבִעִית
  choice: No sétimo ano
  rationale: Expressa naturalmente a oração temporal; o ו inicial funciona aqui como elemento de continuidade narrativa e não precisa ser traduzido por “e”.
- source_word: הִתְחַזַּק
  choice: fortaleceu-se
  rationale: Preserva a forma reflexiva do hitpael de חזק e sua ideia de ganhar força ou coragem para agir, sem substituí-la por uma interpretação mais específica.
- source_word: וַיִּקַּח ... עִמּוֹ בַבְּרִית
  choice: trouxe para uma aliança consigo
  rationale: Reproduz de modo compreensível a combinação hebraica de “tomar” os oficiais e tê-los “consigo na/para a aliança”, indicando seu ingresso no pacto sem apagar a construção incomum do original.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: os comandantes de centenas
  rationale: Designa chefes militares de unidades de cem homens e evita a associação romana específica de “centuriões”.
- source_word: לַעֲזַרְיָהוּ ... וּלְיִשְׁמָעֵאל ... וְלַעֲזַרְיָהוּ ... וְאֶת מַעֲשֵׂיָהוּ ... וְאֶת אֱלִישָׁפָט
  choice: Azarias ... Ismael ... Azarias ... Maaseias ... e Elisafate
  rationale: Emprega formas portuguesas tradicionais e inteligíveis dos nomes próprios, preservando os dois homens distintos chamados Azarias.
- source_word: בֶן
  choice: filho de
  rationale: É a forma portuguesa normal para a identificação patronímica.
theological_decisions:
- issue: Natureza da aliança entre Joiada e os oficiais
  choice: uma aliança consigo
  alternative: a aliança
  rationale: O artigo hebraico pode apontar para uma aliança definida pela situação, mas o contexto imediato apresenta o pacto pela primeira vez; o indefinido é mais natural em português e não especifica indevidamente sua natureza.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. “Fortaleceu-se” conserva a força reflexiva do hebraico; “comandantes de centenas” mantém transparente a organização militar antiga. Os nomes seguem formas portuguesas bíblicas usuais.
