  text: וַ/יִּתֵּן֩ יְהוֹיָדָ֨ע הַ/כֹּהֵ֜ן לְ/שָׂרֵ֣י הַ/מֵּא֗וֹת אֶת הַֽ/חֲנִיתִים֙ וְ/אֶת הַ/מָּגִנּוֹת֙ וְ/אֶת הַ/שְּׁלָטִ֔ים אֲשֶׁ֖ר לַ/מֶּ֣לֶךְ דָּוִ֑יד אֲשֶׁ֖ר בֵּ֥ית הָ/אֱלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/009.yaml
  text: Then Jehoiada the priest gave to the commanders of hundreds the spears[a], the shields, and the large shields that belonged to King David[c][b], which were in the house of God.
translation:
  language: pt
  text: Então Joiada, o sacerdote, deu aos comandantes de cem[a] as lanças, os escudos e os escudos grandes[b] que pertenciam ao rei Davi e estavam na Casa de Deus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chefes de grupos de cem”. O hebraico se refere a oficiais militares responsáveis por unidades de cem homens.
    reason: lexical_alternative
  - marker: b
    text: O hebraico distingue entre “escudos” e outro tipo de equipamento defensivo, aqui traduzido como “escudos grandes”.
    reason: lexical_alternative
  - marker: c
    text: Ou “templo de Deus”. Literalmente, “Casa de Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: deu
  rationale: Traduz diretamente o uso narrativo comum de נתן para a transferência de objetos.
- source_word: יְהוֹיָדָע הַכֹּהֵן
  choice: Joiada, o sacerdote
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome, mantendo o título em aposição.
- source_word: לְשָׂרֵי הַמֵּאוֹת
  choice: aos comandantes de cem
  rationale: Preserva a estrutura hebraica e indica oficiais militares responsáveis por unidades de cem, sem evocar o contexto especificamente romano de “centuriões”.
- source_word: הַחֲנִיתִים
  choice: as lanças
  rationale: Equivalente português corrente e claro para a arma designada por חניתים.
- source_word: הַמָּגִנּוֹת
  choice: os escudos
  rationale: מגנים é o termo geral para escudos; a tradução é natural e não arcaizante.
- source_word: הַשְּׁלָטִים
  choice: os escudos grandes
  rationale: Mantém a distinção lexical em relação a מגנים e segue a identificação provável do termo como uma categoria maior de escudo, sem ocultar a incerteza lexical.
- source_word: אֲשֶׁר לַמֶּלֶךְ דָּוִיד
  choice: que pertenciam ao rei Davi
  rationale: Expressa de modo direto a relação de posse indicada pela construção hebraica, sem acrescentar uma nuance temporal de mais-que-perfeito que o texto não explicita.
- source_word: בֵּית הָאֱלֹהִים
  choice: Casa de Deus
  rationale: Conserva a expressão literal e característica do Cronista, embora ela designe o templo.
theological_decisions: []
