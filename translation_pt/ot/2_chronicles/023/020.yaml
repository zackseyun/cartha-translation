  text: וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י הַ/מֵּא֡וֹת וְ/אֶת הָֽ/אַדִּירִים֩ וְ/אֶת הַ/מּֽוֹשְׁלִ֨ים בָּ/עָ֜ם וְ/אֵ֣ת כָּל עַ֣ם הָ/אָ֗רֶץ וַ/יּ֤וֹרֶד אֶת הַ/מֶּ֨לֶךְ֙ מִ/בֵּ֣ית יְהוָ֔ה וַ/יָּבֹ֛אוּ בְּ/תֽוֹךְ שַׁ֥עַר הָֽ/עֶלְי֖וֹן בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יּוֹשִׁ֨יבוּ֙ אֶת הַ/מֶּ֔לֶךְ עַ֖ל כִּסֵּ֥א הַ/מַּמְלָכָֽה־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/020.yaml
  text: Then he took the commanders of hundreds[a], the nobles, the rulers of the people, and all the people of the land, and brought the king down from the house of Yahweh[c][b]. They entered through the upper gate of the king’s house and seated the king on the throne of the kingdom.
translation:
  language: pt
  text: Então ele tomou consigo os comandantes de centenas, os nobres[a], os governantes do povo e todo o povo da terra[b]. Fez o rei descer da casa de Yahweh, e eles entraram pela porta superior da casa do rei[c]. Então sentaram o rei no trono do reino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os poderosos”. O termo hebraico pode designar pessoas importantes, influentes ou poderosas.
    reason: lexical_alternative
  - marker: b
    text: “Povo da terra” é uma expressão frequente nas narrativas régias para a população considerada como corpo social e político.
    reason: cultural_note
  - marker: c
    text: 'Ou “palácio real”. Hebraico: “casa do rei”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Então ele tomou consigo
  rationale: O verbo לקח significa literalmente “tomar”; neste contexto, indica que Joiada reuniu e conduziu consigo esses grupos. “Tomou consigo” conserva a imagem hebraica e esclarece o sentido em português.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: os comandantes de centenas
  rationale: Reproduz de perto o título militar hebraico sem recorrer a “centuriões”, termo que evocaria indevidamente o contexto romano.
- source_word: הָאַדִּירִים
  choice: os nobres
  rationale: O termo designa pessoas proeminentes ou poderosas. No cenário político e régio, “nobres” comunica bem sua posição social, enquanto a nota preserva a alternativa lexical.
- source_word: הַמֹּשְׁלִים בָּעָם
  choice: os líderes do povo
  rationale: Expressa de modo natural as pessoas que exerciam autoridade entre o povo. “Governantes do povo” seria possível, mas menos fluente neste contexto.
- source_word: כָּל עַם הָאָרֶץ
  choice: todo o povo da terra
  rationale: Mantém a expressão sociopolítica característica das narrativas régias hebraicas, sem reduzi-la interpretativamente a “povo comum”.
- source_word: וַיּוֹרֶד אֶת הַמֶּלֶךְ
  choice: Fez o rei descer
  rationale: Preserva o valor causativo do hifil de ירד e o movimento descendente desde o templo até a residência real.
- source_word: מִבֵּית יְהוָה
  choice: da casa de Yahweh
  rationale: Mantém a expressão hebraica “casa de Yahweh” e verte diretamente o nome divino.
- source_word: בְּתוֹךְ שַׁעַר הָעֶלְיוֹן
  choice: pela porta superior
  rationale: A formulação hebraica indica passagem pelo interior da entrada; “pela porta superior” transmite naturalmente esse movimento em português.
- source_word: בֵּית הַמֶּלֶךְ
  choice: a casa do rei
  rationale: Tradução transparente da expressão hebraica, deixando “palácio real” como alternativa explicativa em nota.
- source_word: וַיּוֹשִׁיבוּ
  choice: fizeram o rei sentar-se
  rationale: Conserva explicitamente o sentido causativo do verbo e a mudança para o sujeito plural indicada pelo hebraico.
- source_word: כִּסֵּא הַמַּמְלָכָה
  choice: o trono do reino
  rationale: Reproduz de perto a construção hebraica e mantém explícito o substantivo “reino”, em vez de condensá-lo em “trono real”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” o representa diretamente e evita substituir o nome por um título.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A redação preserva as mudanças de sujeito do singular para o plural e mantém expressões hebraicas relevantes, explicando em notas apenas as alternativas necessárias.
