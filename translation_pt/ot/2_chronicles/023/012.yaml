base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/012.yaml
  text: When Athaliah heard the noise of the people running and praising the king, she came to the people at the house of the LORD.
translation:
  language: pt
  text: Quando Atalia ouviu o barulho do povo correndo e aclamando o rei, foi até o povo na Casa do SENHOR.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ק֤וֹל
  choice: barulho
  rationale: Neste contexto festivo e tumultuado, designa o ruído coletivo ouvido por Atalia, e não apenas uma voz isolada.
- source_word: הָֽרָצִ֔ים
  choice: correndo
  rationale: Reproduz diretamente o particípio hebraico e preserva a ação em curso.
- source_word: מְהַלְלִים
  choice: aclamando
  rationale: O verbo pode significar louvar ou celebrar; com o rei como objeto, “aclamando” comunica naturalmente a celebração pública sem sugerir necessariamente culto prestado ao rei.
- source_word: בֵּית יְהוָה
  choice: Casa do SENHOR
  rationale: Expressão portuguesa clara e tradicional para o templo; “SENHOR” representa o nome divino יהוה segundo convenção editorial amplamente reconhecida.
theological_decisions:
- issue: Sentido de מְהַלְלִים em relação ao rei
  choice: aclamando o rei
  alternative: louvando o rei
  rationale: “Aclamando” mantém o sentido de celebração pública e evita que o leitor entenda, sem necessidade contextual, que o povo prestava adoração ao rei.
- issue: Representação do Tetragrama יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: Segue uma convenção portuguesa consolidada e preserva a distinção gráfica do nome divino sem impor uma reconstrução específica de sua pronúncia.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e compreensão internacional. “Casa do SENHOR” conserva a designação cultual do templo.
