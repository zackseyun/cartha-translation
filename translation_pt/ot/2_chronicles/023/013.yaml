base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/013.yaml
  text: And she looked[a], and behold, the king was standing by his pillar at the entrance, and the officials and the trumpets were beside the king; and all the people of the land were rejoicing and blowing trumpets, and the singers with the instruments of song were leading the praise. Then Athaliah tore her clothes and said[b], “Conspiracy! Conspiracy!”
translation:
  language: pt
  text: 'Ela olhou, e eis que o rei estava em pé junto à sua coluna, à entrada. Os oficiais e as trombetas[a] estavam ao lado do rei; todo o povo da terra se alegrava e tocava as trombetas, e os cantores, com os instrumentos musicais, conduziam o louvor[b]. Então Atalia rasgou as suas roupas e disse: “Conspiração! Conspiração!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os oficiais e as trombetas”. Algumas traduções empregam “trompetistas”, entendendo os instrumentos como referência aos que os tocavam.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “davam o sinal para o louvor” ou “dirigiam o louvor”. A expressão hebraica é idiomática neste contexto musical.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא וְהִנֵּה
  choice: Ela olhou, e eis que
  rationale: “Olhou” introduz naturalmente a percepção súbita, enquanto “eis que” conserva a força vívida e direcionadora de הִנֵּה.
- source_word: הַמֶּלֶךְ עוֹמֵד
  choice: o rei estava em pé
  rationale: O particípio descreve a postura contínua do rei na cena, melhor expressa em português por “estava em pé”.
- source_word: עַל עַמּוּדוֹ בַּמָּבוֹא
  choice: junto à sua coluna, à entrada
  rationale: עַל tem aqui sentido de associação espacial, e מָבוֹא indica o lugar de entrada.
- source_word: וְהַשָּׂרִים וְהַחֲצֹצְרוֹת עַל הַמֶּלֶךְ
  choice: Os oficiais e as trombetas estavam ao lado do rei
  rationale: Mantém a formulação do texto hebraico, inclusive “trombetas”, provavelmente uma metonímia pelos que as tocavam; שָׂרִים é mais amplo que apenas comandantes militares.
- source_word: וְכָל עַם הָאָרֶץ שָׂמֵחַ
  choice: todo o povo da terra se alegrava
  rationale: Preserva a expressão recorrente “povo da terra” e apresenta a alegria como celebração em curso.
- source_word: וְתוֹקֵעַ בַּחֲצֹצְרוֹת
  choice: e tocava as trombetas
  rationale: Em português, “tocar as trombetas” expressa naturalmente a combinação idiomática hebraica de תקע com חצוצרות.
- source_word: וְהַמְשׁוֹרֲרִים בִּכְלֵי הַשִּׁיר
  choice: e os cantores, com os instrumentos musicais
  rationale: מְשׁוֹרֲרִים designa especificamente cantores; “instrumentos musicais” comunica com clareza o sentido de כְּלֵי הַשִּׁיר.
- source_word: וּמוֹדִיעִים לְהַלֵּל
  choice: conduziam o louvor
  rationale: A construção idiomática parece descrever a função dos cantores de orientar, iniciar ou sinalizar o louvor; “conduziam” preserva essa amplitude funcional sem excessiva literalidade.
- source_word: וַתִּקְרַע עֲתַלְיָהוּ אֶת בְּגָדֶיהָ וַתֹּאמֶר
  choice: Então Atalia rasgou as suas roupas e gritou
  rationale: “Rasgou as suas roupas” reproduz o gesto de aflição; no contexto da exclamação pública e repetida, “gritou” comunica naturalmente a força de וַתֹּאמֶר.
- source_word: קֶשֶׁר קָשֶׁר
  choice: Conspiração! Conspiração!
  rationale: A repetição enfática do substantivo é mantida integralmente.
