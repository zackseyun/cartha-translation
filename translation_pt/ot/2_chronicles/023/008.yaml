base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/008.yaml
  text: So the Levites and all Judah did according to all that Jehoiada the priest had commanded[a], and each man took his men, those coming in on the Sabbath together with those going out on the Sabbath, for Jehoiada the priest had not dismissed the divisions.
translation:
  language: pt
  text: Assim, os levitas e todo o Judá fizeram tudo conforme o sacerdote Joiada havia ordenado. Cada um tomou consigo seus homens, tanto os que entravam no sábado como os que saíam no sábado, pois o sacerdote Joiada não havia dispensado as divisões.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os turnos” ou “as turmas”; trata-se dos grupos sacerdotais e levíticos organizados segundo uma escala de serviço.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: fizeram
  rationale: O verbo עשה introduz o cumprimento da ordem de Joiada; “fizeram tudo conforme” expressa de modo natural a obediência abrangente indicada pelo contexto.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: Tradução consagrada do nome do grupo tribal e cultual, preservando o artigo definido.
- source_word: וְכָל יְהוּדָה
  choice: e todo o Judá
  rationale: Mantém a expressão geográfico-coletiva do hebraico, na qual “Judá” representa coletivamente seus habitantes.
- source_word: כְּכֹל אֲשֶׁר צִוָּה
  choice: tudo conforme ... havia ordenado
  rationale: Comunica a totalidade da obediência e emprega o mais-que-perfeito composto para indicar que a ordem precedeu sua execução.
- source_word: יְהוֹיָדָע הַכֹּהֵן
  choice: o sacerdote Joiada
  rationale: Usa a forma portuguesa corrente do nome e traduz o título; a ordem foi ajustada para maior naturalidade em português.
- source_word: וַיִּקְחוּ אִישׁ אֶת אֲנָשָׁיו
  choice: Cada um reuniu os seus homens
  rationale: אִישׁ tem sentido distributivo (“cada um”), e אֲנָשָׁיו designa os homens sob sua responsabilidade. “Reuniu” exprime naturalmente, neste contexto, a ação de tomar consigo esse pessoal, sem especificá-lo como tropa militar.
- source_word: בָּאֵי הַשַּׁבָּת
  choice: os que entravam no sábado
  rationale: O particípio descreve o grupo que iniciava seu período de serviço no sábado; “entravam” preserva a imagem de movimento e funciona naturalmente no contexto.
- source_word: עִם יוֹצְאֵי הַשַּׁבָּת
  choice: como os que saíam no sábado
  rationale: Em correlação com “tanto”, expressa que o grupo que terminava o serviço também permaneceu presente e preserva o paralelismo entre entrar e sair.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação de por que estavam presentes tanto os grupos que entravam como os que saíam.
- source_word: לֹא פָטַר
  choice: não havia dispensado
  rationale: פטר significa aqui deixar ir ou liberar do dever; “dispensado” é adequado ao encerramento esperado de um turno de serviço.
- source_word: הַמַּחְלְקוֹת
  choice: as turmas
  rationale: Refere-se aos grupos organizados em escala para o serviço sacerdotal e levítico. “Turmas” é claro e atual, sem o caráter arcaico de “turnos” em alguns contextos nem a possível conotação militar de “divisões”.
