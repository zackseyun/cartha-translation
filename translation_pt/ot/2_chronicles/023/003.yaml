base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/003.yaml
  text: And all the assembly made a covenant in the house of God with the king, and he said to them, “Look, the king’s son will reign, just as the LORD spoke concerning the sons of David.”
translation:
  language: pt
  text: 'E toda a assembleia fez uma aliança com o rei na casa de Deus. E Joiada lhes disse: “Vejam, o filho do rei reinará, conforme o SENHOR falou a respeito dos filhos de Davi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל־הַקָּהָל
  choice: toda a assembleia
  rationale: Representa o coletivo reunido com linguagem corrente e digna.
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: fez uma aliança
  rationale: Expressa naturalmente o idiomatismo hebraico ‘cortar uma aliança’, sem perder seu sentido pactuai.
- source_word: הִנֵּה
  choice: Vejam
  rationale: Preserva a função de chamar a atenção dos ouvintes em português moderno.
- source_word: יִמְלֹךְ
  choice: reinará
  rationale: Mantém o valor verbal e a afirmação de que o filho do rei exercerá o reinado.
- source_word: עַל בְּנֵי דָוִיד
  choice: a respeito dos filhos de Davi
  rationale: Reproduz de modo direto a referência à linhagem davídica.
theological_decisions:
- issue: Identidade do sujeito de וַיֹּאמֶר
  choice: E Joiada lhes disse
  alternative: e ele lhes disse
  rationale: O sujeito está implícito no hebraico deste versículo, mas o contexto imediato identifica Joiada como o orador; explicitar o nome evita em português a possível leitura de que o rei menino falou, sem acrescentar uma interpretação doutrinária.
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: YHWH / Javé
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o tetragrama por SENHOR em versaletes, preservando sua distinção em relação ao título comum.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A sintaxe foi dividida em duas frases para evitar ambiguidade de sujeito e produzir leitura natural, mantendo o encadeamento narrativo do hebraico.
