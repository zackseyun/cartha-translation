base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/010.yaml
  text: And he stationed all the people, each man with his weapon in his hand, from the south side of the house to the north side of the house, by the altar and by the house, around the king.
translation:
  language: pt
  text: Ele posicionou todo o povo, cada homem com sua arma na mão, desde o lado direito do templo até o lado esquerdo do templo, junto ao altar e ao templo, ao redor do rei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: posicionou
  rationale: Expressa naturalmente o sentido causativo de fazer o povo tomar posição.
- source_word: כֶּתֶף הַבַּיִת הַיְמָנִית ... כֶּתֶף הַבַּיִת הַשְּׂמָאלִית
  choice: lado sul do templo ... lado norte
  rationale: Embora literalmente sejam os lados direito e esquerdo, na orientação arquitetônica do templo correspondem ao sul e ao norte; a formulação explicita a referência espacial indicada pelo contexto.
- source_word: הַבַּיִת
  choice: templo
  rationale: Neste contexto, 'a casa' designa o templo; 'templo' é claro e idiomático em português.
- source_word: שִׁלְחוֹ
  choice: sua arma
  rationale: O substantivo pode indicar uma arma ou projétil; o contexto militar favorece o termo geral 'arma', sem especificar um tipo não indicado.
- source_word: עַל הַמֶּלֶךְ סָבִיב
  choice: ao redor do rei
  rationale: Reproduz com clareza a disposição protetora em torno do rei.
