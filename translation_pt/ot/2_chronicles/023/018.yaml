revisions:
- from: Joiada pôs a supervisão da casa de Yahweh nas mãos[a] dos sacerdotes, os levitas[b], que Davi havia distribuído para o serviço da casa de Yahweh, a fim de oferecerem holocaustos a Yahweh, conforme está escrito na Lei de Moisés, com alegria e cânticos, segundo as instruções de Davi.[c]
  to: Joiada pôs os encargos da casa de Yahweh nas mãos[a] dos sacerdotes, os levitas[b], que Davi havia designado para a casa de Yahweh, a fim de oferecerem holocaustos a Yahweh, conforme está escrito na Lei de Moisés, com alegria e com cântico, segundo as instruções de Davi.[c]
  rationale: “Encargos” representa melhor o plural פְּקֻדּוֹת no contexto administrativo do que a abstração singular “supervisão”. “Havia designado para a casa de Yahweh” evita acrescentar ‘serviço’, mantendo a ideia contextual de organização e designação. A alteração para “com cântico” acompanha o singular hebraico. As notas mantêm tanto o idiomatismo de בְּיָד quanto as ambiguidades de הַכֹּהֲנִים הַלְוִיִּם e עַל יְדֵי דָוִיד.
