id: 2CH.23.18
reference: 2 Chronicles 23:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יָּשֶׂם֩ יְהוֹיָדָ֨ע פְּקֻדֹּ֜ת בֵּ֣ית יְהוָ֗ה בְּ/יַ֨ד הַ/כֹּהֲנִ֣ים הַ/לְוִיִּם֮ אֲשֶׁ֣ר חָלַ֣ק דָּוִיד֮ עַל בֵּ֣ית יְהוָה֒ לְֽ/הַעֲל֞וֹת עֹל֣וֹת יְהוָ֗ה כַּ/כָּת֛וּב בְּ/תוֹרַ֥ת מֹשֶׁ֖ה בְּ/שִׂמְחָ֣ה וּ/בְ/שִׁ֑יר עַ֖ל יְדֵ֥י דָוִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/018.yaml
  text: And Jehoiada appointed the oversight of the house of Yahweh into the hand of the priests[a], the Levites, whom David had assigned over the house of Yahweh, to offer up burnt offerings to Yahweh, as it is written in the Law of Moses, with rejoicing and with song[c][b], according to the direction of David.
translation:
  language: pt
  text: Joiada pôs os encargos da casa de Yahweh nas mãos[a] dos sacerdotes, os levitas[b], que Davi havia designado para a casa de Yahweh, a fim de oferecerem holocaustos a Yahweh, conforme está escrito na Lei de Moisés, com alegria e com cântico, segundo as instruções de Davi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “na mão”; expressão que significa “sob a responsabilidade” ou “sob a autoridade”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica também pode ser entendida como “os sacerdotes levíticos” ou “os sacerdotes e os levitas”.
    reason: alternative_reading
  - marker: c
    text: 'Hebraico: “pela mão de Davi”; isto é, possivelmente de acordo com a organização ou prescrição estabelecida por Davi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם ... פְּקֻדֹּת
  choice: pôs a supervisão
  rationale: שׂים significa literalmente “pôr” ou “colocar”, enquanto פְּקֻדֹּת designa encargos, funções ou supervisão. A combinação expressa o estabelecimento da responsabilidade administrativa pelo templo.
- source_word: בֵּית יְהוָה
  choice: casa de Yahweh
  rationale: Mantém a imagem hebraica de “casa” e preserva o nome divino, sem substituir a expressão pelo interpretativo “templo”.
- source_word: בְּיַד
  choice: nas mãos
  rationale: Preserva de modo inteligível o idioma hebraico de confiar algo à responsabilidade ou autoridade de alguém.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: os sacerdotes, os levitas
  rationale: Reproduz a construção justaposta do hebraico e evita decidir no texto principal se “levitas” é uma aposição restritiva ou se a expressão abrange dois grupos.
- source_word: אֲשֶׁר חָלַק דָּוִיד עַל בֵּית יְהוָה
  choice: que Davi havia distribuído para o serviço da casa de Yahweh
  rationale: חלק tem o sentido básico de dividir ou distribuir; neste contexto, refere-se à organização do pessoal em grupos destinados ao serviço do santuário.
- source_word: לְהַעֲלוֹת עֹלוֹת
  choice: a fim de oferecerem holocaustos
  rationale: A expressão sacrificial combina o verbo “fazer subir/oferecer” com עֹלוֹת, ofertas totalmente queimadas no altar; “holocaustos” é o equivalente português tradicional e conciso.
- source_word: כַּכָּתוּב בְּתוֹרַת מֹשֶׁה
  choice: conforme está escrito na Lei de Moisés
  rationale: Expressa naturalmente a fórmula de remissão à instrução escrita de Moisés.
- source_word: בְּשִׂמְחָה וּבְשִׁיר
  choice: com alegria e cânticos
  rationale: Conserva os dois substantivos que descrevem o caráter alegre e musical do culto.
- source_word: עַל יְדֵי דָוִיד
  choice: segundo as instruções de Davi
  rationale: O idioma “pela mão de Davi” pode indicar agência ou uma disposição estabelecida por ele. No contexto da organização litúrgica, “segundo as instruções” comunica a provável força administrativa, enquanto a nota preserva a forma e a ambiguidade do original.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Relação entre “os sacerdotes” e “os levitas”
  choice: os sacerdotes, os levitas
  alternative: os sacerdotes levíticos; ou os sacerdotes e os levitas
  rationale: A sintaxe hebraica admite mais de uma compreensão institucional. A justaposição no texto e a nota mantêm essa tensão sem impor uma identificação ou separação definitiva.
- issue: Sentido de עַל יְדֵי דָוִיד
  choice: segundo as instruções de Davi
  alternative: pela mão de Davi; por intermédio de Davi
  rationale: O contexto favorece uma referência às disposições litúrgicas davídicas, mas a nota registra a expressão literal e sua possível leitura de agência.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o nome próprio divino; a transliteração preserva essa distinção.
translation_notes:
  register: Português atual, digno e acessível, com legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. A estrutura acompanha de perto o hebraico, mas emprega ligações naturais como “para o serviço” e “a fim de”. As notas preservam os idiomas e ambiguidades que não cabem integralmente no texto corrido.
