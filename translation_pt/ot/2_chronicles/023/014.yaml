  text: וַ/יּוֹצֵא֩ יְהוֹיָדָ֨ע הַ/כֹּהֵ֜ן אֶת שָׂרֵ֥י הַ/מֵּא֣וֹת פְּקוּדֵ֣י הַ/חַ֗יִל וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ הֽוֹצִיא֨וּ/הָ֙ אֶל מִ/בֵּ֣ית הַ/שְּׂדֵר֔וֹת וְ/הַ/בָּ֥א אַחֲרֶ֖י/הָ יוּמַ֣ת בֶּ/חָ֑רֶב כִּ֚י אָמַ֣ר הַ/כֹּהֵ֔ן לֹ֥א תְמִית֖וּ/הָ בֵּ֥ית יְהוָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/014.yaml
  text: Then Jehoiada the priest brought out the commanders of hundreds who were appointed over the army[a], and said to them, “Bring her out between the ranks, and whoever follows after her, let him be put to death with the sword.” For the priest had said, “Do not put her to death in the house of Yahweh.”
translation:
  language: pt
  text: 'Então o sacerdote Joiada trouxe para fora os comandantes de cem, encarregados do exército, e lhes disse: “Levem-na para fora, por entre as fileiras[a], e quem a seguir seja morto à espada”. Pois o sacerdote tinha dito: “Não a matem na casa de Yahweh”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para fora das fileiras”. A expressão hebraica é difícil; provavelmente se refere a levar Atalia para fora através das fileiras organizadas ou por entre elas.
    reason: Registra uma construção hebraica obscura e uma alternativa lexical plausível sem apresentar como certa uma interpretação contextual.
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: trouxe para fora
  rationale: O hifil de יצא tem sentido causativo, “fazer sair, trazer para fora”. A formulação mantém esse valor e soa natural em português.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: comandantes de cem
  rationale: Preserva a designação militar hebraica sem recorrer a “centuriões”, termo que poderia sugerir indevidamente uma estrutura romana.
- source_word: פְּקוּדֵי הַחַיִל
  choice: encarregados do exército
  rationale: O particípio passivo de פקד indica homens designados ou incumbidos em relação à força militar; “encarregados do exército” expressa sua função oficial sem exceder o texto.
- source_word: הוֹצִיאוּהָ
  choice: Levem-na para fora
  rationale: O imperativo hifil plural com sufixo feminino singular ordena que Atalia seja retirada do local.
- source_word: אֶל מִבֵּית הַשְּׂדֵרוֹת
  choice: para fora, por entre as fileiras
  rationale: A expressão hebraica é difícil. No contexto militar e do templo, שְׂדֵרוֹת provavelmente indica fileiras organizadas; a tradução oferece esse sentido provável, enquanto a nota registra a incerteza.
- source_word: וְהַבָּא אַחֲרֶיהָ
  choice: e quem a seguir
  rationale: O particípio com אַחֲרֶיהָ descreve quem vier ou seguir atrás dela, possivelmente como partidário, mas a tradução não explicita essa inferência.
- source_word: יוּמַת בֶּחָרֶב
  choice: seja morto à espada
  rationale: A forma passiva, com força de ordem no contexto, é mantida em registro judicial e solene.
- source_word: כִּי אָמַר הַכֹּהֵן
  choice: Pois o sacerdote tinha dito
  rationale: A oração explica a ordem precedente, e o mais-que-perfeito indica naturalmente que essa instrução já havia sido dada.
- source_word: לֹא תְמִיתוּהָ
  choice: Não a matem
  rationale: O hifil de מות significa “causar a morte, matar”. A forma direta é clara e digna em português contemporâneo.
- source_word: בֵּית יְהוָה
  choice: casa de Yahweh
  rationale: Mantém a expressão hebraica “casa de Yahweh”, que neste contexto designa o templo, e preserva o nome divino.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título nem adotar a forma híbrida tradicional “Jeová”.
translation_notes:
  register: Português atual, claro e solene, com boa legibilidade brasileira e compreensão internacional. Mantiveram-se a designação militar sem anacronismo romano, o tom formal da ordem de execução e a ambiguidade da expressão relativa às fileiras.
