base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/002.yaml
  text: And they went throughout Judah and gathered the Levites from all the cities of Judah[a], and the heads of the fathers’ houses of Israel, and they came to Jerusalem.
translation:
  language: pt
  text: Eles percorreram Judá e reuniram os levitas de todas as cidades de Judá e os chefes das casas paternas de Israel[a]; e vieram a Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os chefes das casas ancestrais”; em linguagem mais corrente, “os chefes de família”. O hebraico é um idioma para líderes de grupos familiares ou ancestrais.
    reason: Alternativa lexical e esclarecimento do idioma hebraico referente a “chefes das casas paternas”.
lexical_decisions:
- source_word: וַיָּסֹבּוּ
  choice: percorreram
  rationale: Neste contexto narrativo, סבב descreve o deslocamento por uma região para cumprir uma missão; “percorreram” expressa isso de modo natural e conciso.
- source_word: וַיִּקְבְּצוּ
  choice: reuniram
  rationale: קבץ significa ajuntar ou reunir pessoas; “reuniram” se ajusta aos levitas e aos chefes convocados.
- source_word: אֶת־הַלְוִיִּם
  choice: os levitas
  rationale: Designação tribal e cultual tradicional, vertida pela forma portuguesa consagrada.
- source_word: מִכָּל עָרֵי יְהוּדָה
  choice: de todas as cidades de Judá
  rationale: Preserva a ideia de procedência e a abrangência territorial expressa por מִכָּל.
- source_word: וְרָאשֵׁי הָאָבוֹת
  choice: e os chefes das casas paternas
  rationale: Mantém a coordenação simples do hebraico e preserva o idioma social e administrativo “casas paternas”, esclarecido em nota.
- source_word: לְיִשְׂרָאֵל
  choice: de Israel
  rationale: O לְ indica aqui relação ou pertencimento; a tradução conserva explicitamente “Israel” sem restringi-lo a Judá.
- source_word: וַיָּבֹאוּ אֶל־יְרוּשָׁלִָם
  choice: depois vieram a Jerusalém
  rationale: בוא com אֶל significa normalmente chegar ou vir a um lugar. “Depois” representa naturalmente a progressão narrativa do wayyiqtol sem alterar a sequência.
theological_decisions:
- issue: Alcance de “Israel” num contexto centrado em Judá
  choice: Conservar “Israel” no texto principal.
  alternative: Substituir por “Judá” ou parafrasear como “o povo de Israel”.
  rationale: O hebraico diz explicitamente יִשְׂרָאֵל. Crônicas pode empregar “Israel” para o povo mais amplo da aliança mesmo em contexto do reino do sul; manter o termo evita impor uma harmonização.
- issue: Sentido do idioma de parentesco הָאָבוֹת
  choice: Usar “casas paternas” no texto e esclarecer em nota.
  alternative: “Casas ancestrais”, “famílias” ou “chefes de família”.
  rationale: A expressão possui valor genealógico e administrativo. A forma escolhida preserva a textura do original, enquanto a nota oferece equivalentes mais idiomáticos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Casas paternas” conserva deliberadamente o idioma institucional do hebraico; a nota impede que a expressão pareça referir-se apenas à residência do pai. O ponto e vírgula torna clara a sequência sem romper a unidade do versículo.
