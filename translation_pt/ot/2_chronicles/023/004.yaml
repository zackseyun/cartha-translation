base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/004.yaml
  text: 'This is what you shall do: one third of you who come in on the Sabbath[a], of the priests and of the Levites, shall be gatekeepers of the thresholds.'
translation:
  language: pt
  text: 'Isto é o que vocês devem fazer: um terço de vocês que entram no sábado, sacerdotes e levitas, ficará de guarda nas soleiras.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “será porteiro das soleiras”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה הַדָּבָר אֲשֶׁר תַּעֲשׂוּ
  choice: Isto é o que vocês devem fazer
  rationale: Expressa de modo natural em português a fórmula introdutória hebraica e conserva sua força diretiva.
- source_word: הַשְּׁלִשִׁית מִכֶּם
  choice: um terço de vocês
  rationale: 'Preserva com clareza a relação partitiva: um terço do grupo ao qual se fala.'
- source_word: בָּאֵי הַשַּׁבָּת
  choice: que entram no sábado
  rationale: O particípio designa os que entram para cumprir seu turno sabático; a formulação mantém a ação concreta sem acrescentar explicitamente a ideia de turno.
- source_word: לַכֹּהֲנִים וְלַלְוִיִּם
  choice: dos sacerdotes e dos levitas
  rationale: Identifica o grupo ao qual pertencem os que entram no sábado, preservando a relação partitiva ou apositiva da sintaxe hebraica.
- source_word: לְשֹׁעֲרֵי הַסִּפִּים
  choice: ficará como guardas das entradas
  rationale: שֹׁעֲרֵי designa porteiros ou guardas de acesso, e סִפִּים significa literalmente soleiras. 'Guardas das entradas' comunica naturalmente a função no contexto do templo, enquanto a nota registra a imagem literal.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” para o plural dirigido ao grupo. A ordem dos constituintes foi levemente ajustada para evitar que “dos sacerdotes e dos levitas” pareça modificar “um terço” de maneira pouco natural, sem eliminar a possível relação partitiva/apositiva do hebraico.
