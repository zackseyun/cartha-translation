  naturalness: O registro é moderno e claro, mas a posição de «que entram no sábado» cria uma ambiguidade sintática desnecessária. A formulação revista mantém a ordem inteligível em português e a referência coletiva do hebraico.
  terminology: «Ficarão de guarda nas soleiras» comunica a incumbência de guardar os acessos e preserva «soleiras» para סִפִּים. A nota oferece «porteiros das soleiras» como alternativa mais próxima da designação hebraica.
