base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/016.yaml
  text: Then Jehoiada made a covenant between himself[a], all the people, and the king[c][b], that they should be Yahweh's people.
translation:
  language: pt
  text: Então Joiada fez uma aliança[a] com todo o povo e com o rei, para que fossem o povo de Yahweh[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “cortou uma aliança”.
    reason: lexical_alternative
  - marker: b
    text: Ou “o povo do SENHOR”.
    reason: lexical_alternative
  - marker: c
    text: Ou “para que fossem um povo para Yahweh”.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּכְרֹת בְּרִית
  choice: fez uma aliança
  rationale: A expressão hebraica significa literalmente “cortar uma aliança”, mas “fazer uma aliança” comunica o mesmo valor idiomático em português natural. “Então” representa a progressão narrativa do waw consecutivo.
- source_word: בְּרִית
  choice: aliança
  rationale: O contexto descreve um compromisso solene de caráter religioso e comunitário, para o qual “aliança” é mais adequado do que “acordo” ou “tratado”.
- source_word: בֵּינוֹ וּבֵין כָּל הָעָם וּבֵין הַמֶּלֶךְ
  choice: entre si, todo o povo e o rei
  rationale: A formulação conserva Joiada, todo o povo e o rei como as três partes enumeradas no hebraico, sem acrescentar Yahweh como parte explicitamente nomeada da aliança.
- source_word: לִהְיוֹת לְעָם לַיהוָה
  choice: para que fossem o povo de Yahweh
  rationale: A oração infinitiva expressa o propósito da aliança. “O povo de Yahweh” transmite de modo natural a relação de pertencimento e lealdade indicada pela fórmula hebraica, enquanto a alternativa mais formal permanece em nota.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Partes e propósito da aliança
  choice: Joiada, todo o povo e o rei são as partes enumeradas; o propósito é que sejam o povo de Yahweh
  alternative: Yahweh seria uma das partes da aliança com o povo e o rei
  rationale: A sintaxe hebraica enumera “entre ele, entre todo o povo e entre o rei”; Yahweh aparece apenas na oração de propósito como aquele a quem o povo pertence.
- issue: Valor de לְעָם לַיהוָה
  choice: o povo de Yahweh
  alternative: um povo para Yahweh
  rationale: A versão principal expressa idiomaticamente a pertença da fórmula da aliança. A alternativa mais próxima da forma hebraica é preservada em nota, sem eliminar a nuance qualitativa do substantivo sem artigo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Joiada” segue a forma portuguesa tradicional do nome. A estrutura “entre si, todo o povo e o rei” mantém a enumeração das partes sem tornar a frase excessivamente literal.
