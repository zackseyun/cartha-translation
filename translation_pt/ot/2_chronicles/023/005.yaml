  yaml_path: translation/ot/2_chronicles/023/005.yaml
  text: one third shall be at the king’s house[a], one third at the Foundation Gate, and all the people in the courts of the house of Yahweh.
translation:
  language: pt
  text: um terço ficará na casa do rei, outro terço na Porta do Fundamento[a], e todo o povo ficará nos pátios da casa de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “porta do fundamento”. O hebraico pode preservar o nome específico de uma porta; sua identificação é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁלִשִׁית
  choice: um terço / outro terço
  rationale: O ordinal feminino substantivado expressa a divisão do grupo em terços. A variação natural em português deixa clara a distribuição sem recorrer à forma menos idiomática “a terça parte”.
- source_word: בְּבֵית הַמֶּלֶךְ
  choice: na casa do rei
  rationale: Mantém o sentido literal de בֵּית e, no contexto, designa a residência ou o complexo real sem substituir o termo por “palácio”, que seria mais interpretativo.
- source_word: בְּשַׁעַר הַיְסוֹד
  choice: na Porta do Fundamento
  rationale: שַׁעַר significa “porta”, e יְסוֹד, “fundamento” ou “base”. A capitalização trata a expressão como provável nome próprio, enquanto a nota preserva a incerteza lexical.
- source_word: וְכָל הָעָם
  choice: e todo o povo
  rationale: Tradução direta, natural e não interpretativa de עָם neste contexto narrativo.
- source_word: בְּחַצְרוֹת
  choice: nos pátios
  rationale: O plural de חָצֵר indica espaços abertos e delimitados do complexo do templo; “pátios” é claro no português corrente.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Preserva a imagem hebraica de “casa” e translitera o nome divino יהוה como Yahweh, sem substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” o representa diretamente e evita substituí-lo por um título; “Jeová” reflete uma forma híbrida posterior.
- issue: Identificação de בֵּית יְהוָה
  choice: casa de Yahweh
  alternative: templo de Yahweh
  rationale: “Casa” reproduz o termo hebraico e sua imagem teológica sem perder a referência contextual ao complexo do templo; “templo” tornaria explícito o referente, mas reduziria a correspondência lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O verbo “ficará”, implícito nesta sequência distributiva, foi explicitado para formar uma oração natural em português. A pontuação evita repetição desnecessária, e a nota foi posicionada junto à expressão realmente ambígua.
