lexical_decisions:
- source_word: וַיָּשָׁב
  choice: voltou
  rationale: O verbo שׁוב indica retorno; “voltou” é natural e claro na narrativa.
- source_word: יְהוֹשָׁפָט
  choice: Josafá
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: מֶלֶךְ יְהוּדָה
  choice: rei de Judá
  rationale: Preserva a construção que identifica o cargo real de Josafá; as vírgulas tornam a aposição natural em português.
- source_word: אֶל בֵּיתוֹ
  choice: para a sua casa
  rationale: Mantém o sentido concreto de בַּיִת e expressa naturalmente o destino em português.
- source_word: בְּשָׁלוֹם
  choice: em paz
  rationale: Preserva o idioma hebraico e sua amplitude semântica, que pode incluir paz, bem-estar e segurança.
- source_word: לִירוּשָׁלִָם
  choice: em Jerusalém
  rationale: Depois de “para a sua casa”, a localização é expressa naturalmente como “em Jerusalém”, evitando a formulação pouco idiomática “para a sua casa para Jerusalém”.
