revisions:
- from: Josafá ficou morando em Jerusalém e voltou a percorrer o povo, desde Berseba até a região montanhosa de Efraim, fazendo-o voltar para Yahweh[a], o Deus de seus antepassados.
  to: Josafá morava em Jerusalém; e saiu novamente entre o povo, desde Berseba até a região montanhosa de Efraim, e os fez voltar para Yahweh[a], o Deus de seus pais.
  rationale: 'A revisão substitui expressões redundantes ou pouco idiomáticas por formulações modernas e conserva os elementos do hebraico: residência em Jerusalém, saída renovada entre o povo, abrangência geográfica, objeto plural de «fez voltar» e destino desse retorno. A nota vinculada a «Yahweh» permanece corretamente ancorada.'
