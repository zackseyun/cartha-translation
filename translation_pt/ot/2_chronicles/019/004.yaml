  text: וַ/יֵּ֥שֶׁב יְהוֹשָׁפָ֖ט בִּ/ירוּשָׁלִָ֑ם וַ/יָּ֜שָׁב וַ/יֵּצֵ֣א בָ/עָ֗ם מִ/בְּאֵ֥ר שֶׁ֨בַע֙ עַד הַ֣ר אֶפְרַ֔יִם וַ/יְשִׁיבֵ֕/ם אֶל יְהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽםס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/004.yaml
  text: So Jehoshaphat lived in Jerusalem[a], and he went out again among the people from Beersheba to the hill country of Ephraim and brought them back to Yahweh[b], the God of their fathers.
translation:
  language: pt
  text: Josafá morava em Jerusalém; e saiu novamente entre o povo, desde Berseba até a região montanhosa de Efraim, e os fez voltar para Yahweh[a], o Deus de seus pais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome hebraico é YHWH; tradicionalmente é traduzido por “SENHOR”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: ficou morando
  rationale: O verbo ישׁב, com a indicação de lugar, expressa residência ou permanência em Jerusalém, não o ato literal de sentar-se.
- source_word: וַיָּשָׁב וַיֵּצֵא בָעָם
  choice: voltou a percorrer o povo
  rationale: A repetição de שוב antes de יצא indica retomada da atividade. A preposição ב sugere movimento entre ou através da população; em português, “percorrer o povo” comunica de modo conciso esse circuito pessoal.
- source_word: מִבְּאֵר שֶׁבַע עַד הַר אֶפְרַיִם
  choice: desde Berseba até a região montanhosa de Efraim
  rationale: A expressão delimita a extensão geográfica do percurso. הַר אֶפְרַיִם designa a região montanhosa, não apenas um monte isolado.
- source_word: וַיְשִׁיבֵם
  choice: fazendo-o voltar
  rationale: O hifil de שוב com sufixo objetivo significa causar o retorno. O pronome singular retoma coletivamente “o povo”, preservando o sentido espiritual sem explicá-lo como “converter” ou “fazer arrepender-se”.
- source_word: אֶל יְהוָה
  choice: para Yahweh
  rationale: A preposição אֶל indica direção, e o nome divino יְהוָה é transliterado como “Yahweh”, preservando o nome pessoal no texto-fonte.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: o Deus de seus antepassados
  rationale: “Antepassados” é uma formulação moderna e inclusiva no sentido genealógico, sem perder a referência à fé ancestral da comunidade.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega explicitamente o Tetragrama. A transliteração mantém o nome divino, enquanto a nota informa a convenção tradicional de substituí-lo por “SENHOR”.
- issue: Natureza do retorno em וַיְשִׁיבֵם אֶל יְהוָה
  choice: fazendo-o voltar para Yahweh
  alternative: convertendo-o ao SENHOR
  rationale: A tradução conserva a metáfora verbal de retorno e evita impor categorias teológicas mais específicas, como conversão ou arrependimento, que não estão lexicalmente expressas.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Ficou morando” explicita a permanência; “voltou a percorrer” preserva a retomada indicada pela repetição do verbo hebraico; “antepassados” evita uma formulação hoje menos natural sem alterar o sentido ancestral.
