    text: O nome hebraico é YHWH; tradicionalmente é traduzido por “SENHOR”.
    reason: alternative_reading
  revision_rationale: 'A revisão substitui expressões redundantes ou pouco idiomáticas por formulações modernas e conserva os elementos do hebraico: residência em Jerusalém, saída renovada entre o povo, abrangência geográfica, objeto plural de «fez voltar» e destino desse retorno. A nota vinculada a «Yahweh» permanece corretamente ancorada.'
