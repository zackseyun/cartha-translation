  source_fidelity: 'A tradução transmite com precisão a ordem dirigida aos juízes: o imperativo plural é adequadamente expresso por “vocês devem agir”, e as três expressões preposicionais hebraicas são preservadas em sentido e função. “Temor de Yahweh”, “com fidelidade” e “de todo o coração” refletem bem יִרְאַת יְהוָה, אֱמוּנָה e לֵבָב שָׁלֵם no contexto judicial.'
