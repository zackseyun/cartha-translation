id: 2CH.19.9
reference: 2 Chronicles 19:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְצַ֥ו עֲלֵי/הֶ֖ם לֵ/אמֹ֑ר כֹּ֤ה תַעֲשׂוּ/ן֙ בְּ/יִרְאַ֣ת יְהוָ֔ה בֶּ/אֱמוּנָ֖ה וּ/בְ/לֵבָ֥ב שָׁלֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/009.yaml
  text: And he commanded them[a], saying, “Thus you shall act in the fear of Yahweh[d][c][b], in faithfulness and with a whole heart.”
translation:
  language: pt
  text: 'E ele lhes ordenou, dizendo: “Assim vocês devem agir[a]: no temor de Yahweh[b], com fidelidade[c] e de todo o coração[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Assim vocês devem proceder” ou “Isto é o que vocês devem fazer”.'
    reason: lexical_alternative
  - marker: b
    text: “Temor de Yahweh” também pode ser expresso como “reverência por Yahweh”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “com integridade” ou “fielmente”.'
    reason: lexical_alternative
  - marker: d
    text: Literalmente, “com coração inteiro”; isto é, com um coração íntegro ou indiviso.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו עֲלֵיהֶם לֵאמֹר
  choice: ele lhes ordenou, dizendo
  rationale: Preserva o sentido direto de צוה, a função de עֲלֵיהֶם como objeto indireto e a fórmula hebraica que introduz a fala, em português claro e digno.
- source_word: כֹּה תַעֲשׂוּן
  choice: Assim vocês devem agir
  rationale: “Agir” se ajusta à instrução ética e judicial; “assim” representa כֹּה, e “devem” comunica a força diretiva da forma verbal.
- source_word: בְּיִרְאַת יְהוָה
  choice: no temor de Yahweh
  rationale: Mantém a expressão bíblica “temor de Yahweh”, que abrange medo reverente e profundo respeito, e translitera o nome divino.
- source_word: בֶּאֱמוּנָה
  choice: com fidelidade
  rationale: Neste contexto judicial, אֱמוּנָה indica conduta fiel, confiável e íntegra, e não primariamente crença interior.
- source_word: וּבְלֵבָב שָׁלֵם
  choice: e de todo o coração
  rationale: Expressão portuguesa natural que comunica inteireza, dedicação plena e ausência de divisão interior, preservando a imagem hebraica do coração.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: O texto hebraico traz o Tetragrama como nome próprio. “Yahweh” o representa diretamente, sem substituí-lo por um título.
- issue: Sentido de אֱמוּנָה na exortação aos juízes
  choice: fidelidade
  alternative: integridade; fé
  rationale: O contexto trata do modo de exercer uma função judicial; por isso, o termo aponta para confiabilidade e retidão na conduta, sem excluir a amplitude lexical nem importar o sentido doutrinário posterior de “fé”.
- issue: Sentido de לֵבָב שָׁלֵם
  choice: de todo o coração
  alternative: com coração íntegro; com coração indiviso
  rationale: A escolha mantém a ideia de dedicação completa sem restringir שָׁלֵם exclusivamente à inculpabilidade moral.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O registro é digno sem ser arcaico. “Vocês” explicita o plural hebraico; “de todo o coração” oferece naturalidade, enquanto a nota conserva a imagem mais formal de “coração inteiro”.
