source:
  edition: WLC
  text: וְ/גַ֣ם בִּ֠/ירוּשָׁלִַם הֶעֱמִ֨יד יְהוֹשָׁפָ֜ט מִן הַ/לְוִיִּ֣ם וְ/הַ/כֹּהֲנִ֗ים וּ/מֵ/רָאשֵׁ֤י הָ/אָבוֹת֙ לְ/יִשְׂרָאֵ֔ל לְ/מִשְׁפַּ֥ט יְהוָ֖ה וְ/לָ/רִ֑יב וַ/יָּשֻׁ֖בוּ יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/008.yaml
  text: Also in Jerusalem[a], Jehoshaphat appointed some of the Levites, the priests, and the heads of the fathers’ houses of Israel for the judgment of Yahweh and for disputes[b]; and they returned to Jerusalem.
translation:
  language: pt
  text: Também em Jerusalém, Josafá designou alguns dos levitas, dos sacerdotes e dos chefes das casas paternas de Israel para o julgamento de Yahweh e para as controvérsias; e eles voltaram para Jerusalém.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “e eles voltaram para Jerusalém”. Alguns entendem a expressão de outro modo, como “e permaneceram em Jerusalém”, pois a redação recebida é um tanto abrupta neste contexto.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: Também
  rationale: Mantém a força aditiva do hebraico e liga naturalmente esta medida às ações anteriores de Josafá.
- source_word: בִּירוּשָׁלִַם
  choice: em Jerusalém
  rationale: Tradução locativa direta e natural.
- source_word: הֶעֱמִיד
  choice: designou
  rationale: Neste contexto administrativo e judicial, o hifil de עמד indica colocar pessoas numa função; “designou” comunica essa nomeação com clareza.
- source_word: מִן הַלְוִיִּם וְהַכֹּהֲנִים וּמֵרָאשֵׁי הָאָבוֹת לְיִשְׂרָאֵל
  choice: alguns dos levitas, dos sacerdotes e dos chefes das casas paternas de Israel
  rationale: “Alguns dos” explicita o valor partitivo de מִן/מֵ. “Casas paternas” preserva a estrutura social e genealógica do hebraico.
- source_word: לְמִשְׁפַּט יְהוָה
  choice: para o julgamento de Yahweh
  rationale: Preserva a amplitude do genitivo hebraico, que pode indicar julgamentos pertencentes a Yahweh, regidos por sua lei ou exercidos sob sua autoridade.
- source_word: וְלָרִיב
  choice: e para resolver controvérsias
  rationale: רִיב designa disputa ou causa judicial. A formulação verbal é clara em português e expressa a função dos oficiais sem restringir indevidamente o tipo de litígio.
- source_word: וַיָּשֻׁבוּ יְרוּשָׁלִָם
  choice: e eles voltaram para Jerusalém
  rationale: É o sentido direto do texto massorético vocalizado, embora a frase seja abrupta no contexto; a dificuldade é registrada em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Translitera o nome pessoal divino presente no texto hebraico, sem substituí-lo por um título.
- issue: Sentido de לְמִשְׁפַּט יְהוָה
  choice: para o julgamento de Yahweh
  alternative: para julgar em nome de Yahweh; para casos regidos pela lei de Yahweh
  rationale: A tradução formal preserva a ambiguidade gramatical e teológica entre julgamento pertencente a Yahweh, realizado sob sua autoridade ou regulado por sua lei.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva “casas paternas” e “julgamento de Yahweh” para não apagar elementos estruturais nem ambiguidades do hebraico. O ponto e vírgula reproduz a mudança final abrupta sem fragmentar o versículo.
