  text: וַ/יֵּצֵ֣א אֶל פָּנָ֗י/ו יֵה֣וּא בֶן חֲנָ֘נִי֮ הַ/חֹזֶה֒ וַ/יֹּ֨אמֶר֙ אֶל הַ/מֶּ֣לֶךְ יְהוֹשָׁפָ֔ט הֲ/לָ/רָשָׁ֣ע לַ/עְזֹ֔ר וּ/לְ/שֹׂנְאֵ֥י יְהוָ֖ה תֶּאֱהָ֑ב וּ/בָ/זֹאת֙ עָלֶ֣י/ךָ קֶּ֔צֶף מִ/לִּ/פְנֵ֖י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/002.yaml
  text: Jehu son of Hanani the seer went out to meet him and said to King Jehoshaphat[a], “Should you help the wicked and love those who hate Yahweh? Because of this[b], wrath is upon you from the presence of Yahweh.”
translation:
  language: pt
  text: 'O vidente Jeú, filho de Hanani, saiu ao encontro dele[a] e disse ao rei Josafá: “Você deve ajudar o perverso e amar os que odeiam Yahweh? Por causa disso, a ira da parte de Yahweh[b] está sobre você.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “saiu em direção a ele” ou “saiu diante dele”; a expressão hebraica significa sair para encontrar alguém.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “de diante de Yahweh”; a expressão indica que a ira procede da presença de Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא אֶל־פָּנָיו
  choice: saiu ao encontro dele
  rationale: A expressão hebraica traz literalmente a ideia de sair em direção à face ou presença de alguém, mas funciona idiomaticamente como sair para encontrá-lo.
- source_word: הַחֹזֶה
  choice: o vidente
  rationale: חֹזֶה é um título profético específico. “Vidente” preserva sua distinção lexical, sem reduzi-lo ao termo mais geral “profeta”.
- source_word: הֲלָרָשָׁע לַעְזֹר
  choice: Você deve ajudar o perverso?
  rationale: A partícula interrogativa com o infinitivo introduz uma pergunta de censura. “O perverso” mantém o substantivo adjetival singular do hebraico sem inserir o nome de Acabe no texto.
- source_word: וּלְשֹׂנְאֵי יְהוָה תֶּאֱהָב
  choice: e amar os que odeiam Yahweh
  rationale: A formulação preserva a força verbal do particípio שֹׂנְאֵי, “os que odeiam”, em vez de interpretá-lo simplesmente como “inimigos”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O tetragrama é apresentado como nome pessoal divino, não substituído por um título.
- source_word: וּבָזֹאת
  choice: Por causa disso
  rationale: A expressão retoma a conduta de Josafá como motivo da declaração de juízo e tem força causal clara no contexto.
- source_word: עָלֶיךָ קֶּצֶף
  choice: a ira ... está sobre você
  rationale: A construção conserva a imagem hebraica de ira ou indignação que está “sobre” Josafá.
- source_word: מִלִּפְנֵי יְהוָה
  choice: vinda da presença de Yahweh
  rationale: A tradução mantém a imagem de procedência da presença divina e, com “vinda”, torna a relação sintática natural em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o tetragrama; “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Alcance de הָרָשָׁע, “o perverso”
  choice: manter a expressão moral singular sem nomear Acabe
  alternative: um perverso; os perversos; Acabe
  rationale: Acabe é o referente histórico imediato, mas o hebraico formula a censura como categoria moral. A tradução não explicita além do que o texto diz.
- issue: Relação entre ajudar o perverso e amar os que odeiam Yahweh
  choice: preservar as duas acusações coordenadas
  alternative: fundir ambas como “aliar-se aos inimigos de Yahweh”
  rationale: A coordenação hebraica mantém em tensão auxílio político e afeição ou lealdade; uma paráfrase poderia estreitar indevidamente o sentido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vidente” preserva o título técnico; “perverso” evita um termo excessivamente coloquial; a pergunta direta conserva o tom solene de repreensão.
