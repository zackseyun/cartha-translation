  text: וַ/יֹּ֣אמֶר אֶל הַ/שֹּֽׁפְטִ֗ים רְאוּ֙ מָֽה אַתֶּ֣ם עֹשִׂ֔ים כִּ֣י לֹ֧א לְ/אָדָ֛ם תִּשְׁפְּט֖וּ כִּ֣י לַ/יהוָ֑ה וְ/עִמָּ/כֶ֖ם בִּ/דְבַ֥ר מִשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/006.yaml
  text: And he said to the judges[a], “See what you are doing, for you are not judging for man, but for Yahweh[b], and he is with you in the matter of judgment.”
translation:
  language: pt
  text: 'E ele disse aos juízes: “Vejam o que estão fazendo, pois vocês não julgam para um ser humano[a], mas para Yahweh; e ele está com vocês na questão do juízo[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: אָדָם (adam). Aqui, o singular tem sentido genérico e se refere ao ser humano em contraste com Yahweh.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ao julgarem” ou “na administração da justiça”. A expressão hebraica pode indicar tanto o ato de julgar quanto os assuntos judiciais em geral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁפְטִים
  choice: os juízes
  rationale: O particípio substantivado de שׁפט designa aqui os oficiais encarregados de exercer a função judicial; “juízes” é a forma portuguesa natural e precisa.
- source_word: רְאוּ מָה אַתֶּם עֹשִׂים
  choice: Vejam o que estão fazendo
  rationale: O imperativo pede atenção cuidadosa à conduta dos juízes, e a construção progressiva comunica uma prática em curso de modo natural em português.
- source_word: לְאָדָם
  choice: para um ser humano
  rationale: אָדָם é singular e genérico neste contraste entre a esfera humana e Yahweh. “Um ser humano” preserva tanto o singular quanto o sentido inclusivo, sem sugerir um homem específico.
- source_word: תִּשְׁפְּטוּ
  choice: vocês não julgam
  rationale: O verbo שׁפט se refere ao exercício da função judicial. A forma direta conserva o paralelismo com “para Yahweh”.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: A preposição indica que os juízes exercem seu encargo em favor de, diante de ou como representantes de Yahweh; “para” mantém essa relação sem restringi-la a uma única nuance.
- source_word: וְעִמָּכֶם
  choice: e ele está com vocês
  rationale: A oração nominal hebraica afirma a presença de Yahweh junto aos juízes. O pronome e o verbo são necessários para uma formulação portuguesa clara.
- source_word: בִּדְבַר מִשְׁפָּט
  choice: ao julgarem
  rationale: A expressão diz respeito à atividade ou matéria judicial. A formulação verbal é clara e idiomática, enquanto a nota preserva a amplitude lexical do hebraico.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” representa o nome pessoal da aliança sem substituí-lo por um título.
- issue: Sentido genérico de אָדָם no singular
  choice: um ser humano
  alternative: um homem; a humanidade
  rationale: O contraste é entre qualquer autoridade humana e Yahweh, não entre os sexos. A opção escolhida preserva o singular genérico e evita identificar uma pessoa específica.
- issue: Relação expressa por ל em לְאָדָם e לַיהוָה
  choice: para
  alternative: em nome de; em favor de
  rationale: A preposição pode envolver responsabilidade, representação ou orientação do julgamento. “Para” conserva a tensão e evita limitar o texto a apenas uma dessas relações.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas naturais no plural (“vocês”, “vejam”). A tradução mantém o contraste retórico do hebraico e usa “Yahweh” para o nome divino. Os marcadores de nota foram posicionados junto às expressões que efetivamente explicam.
