reference: 2 Chronicles 19:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הִנֵּ֡ה אֲמַרְיָ֣הוּ כֹהֵן֩ הָ/רֹ֨אשׁ עֲלֵי/כֶ֜ם לְ/כֹ֣ל דְּבַר יְהוָ֗ה וּ/זְבַדְיָ֨הוּ בֶן יִשְׁמָעֵ֜אל הַ/נָּגִ֤יד לְ/בֵית יְהוּדָה֙ לְ/כֹ֣ל דְּבַר הַ/מֶּ֔לֶךְ וְ/שֹׁטְרִ֥ים הַ/לְוִיִּ֖ם לִ/פְנֵי/כֶ֑ם חִזְק֣וּ וַ/עֲשׂ֔וּ וִ/יהִ֥י יְהוָ֖ה עִם הַ/טּֽוֹב־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/011.yaml
  text: And behold[a], Amariah the chief priest is over you in every matter of Yahweh, and Zebadiah son of Ishmael, the ruler of the house of Judah, for every matter of the king; and the Levites will serve as officers before you. Be strong and act[b], and may Yahweh be with the good.
translation:
  language: pt
  text: E eis que Amarias, o sacerdote principal[a], tem autoridade sobre vocês em toda questão de Yahweh; e Zebadias, filho de Ismael, o líder da casa de Judá, em toda questão do rei. Os levitas estarão diante de vocês como oficiais. Sejam fortes e ajam, e que Yahweh esteja com aquele que é bom.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o sumo sacerdote”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “com os bons”. O hebraico também pode ser entendido de modo genérico ou coletivo.'
    reason: ambiguity
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Conserva a função discursiva de chamar a atenção para a estrutura administrativa que Josafá apresenta, em linguagem bíblica ainda compreensível.
- source_word: כֹהֵן הָרֹאשׁ
  choice: o sacerdote principal
  rationale: Reproduz o sentido literal de sacerdote-chefe sem impor necessariamente o título técnico “sumo sacerdote”; essa possibilidade é registrada em nota.
- source_word: עֲלֵיכֶם
  choice: está encarregado de vocês
  rationale: Expressa com naturalidade a autoridade supervisora indicada pela preposição no contexto judicial e administrativo.
- source_word: לְכֹל דְּבַר יְהוָה
  choice: em toda questão de Yahweh
  rationale: דָּבָר pode designar questão, assunto ou causa. “Questão” mantém o alcance amplo, enquanto “de Yahweh” preserva a referência à esfera da lei e do culto divinos.
- source_word: הַנָּגִיד לְבֵית יְהוּדָה
  choice: o líder da casa de Judá
  rationale: נָגִיד designa alguém em posição de liderança. “Líder” é claro e não especifica um cargo mais estreito que o hebraico; “casa de Judá” conserva בֵּית.
- source_word: לְכֹל דְּבַר הַמֶּלֶךְ
  choice: em toda questão do rei
  rationale: Mantém o paralelismo com as questões de Yahweh e distingue a esfera régia da esfera religiosa, sem restringir דָּבָר a processos judiciais apenas.
- source_word: וְשֹׁטְרִים הַלְוִיִּם לִפְנֵיכֶם
  choice: Os levitas estarão diante de vocês como oficiais
  rationale: Torna explícita a oração nominal e preserva tanto a função administrativa de שֹׁטְרִים quanto a imagem de estarem diante dos juízes para auxiliá-los.
- source_word: חִזְקוּ וַעֲשׂוּ
  choice: Sejam fortes e ajam
  rationale: Mantém a exortação breve e vigorosa; “ajam” expressa de modo idiomático o cumprimento da tarefa recebida.
- source_word: וִיהִי יְהוָה עִם הַטּוֹב
  choice: e que Yahweh esteja com aquele que é bom
  rationale: “Que ... esteja” comunica o valor volitivo ou de bênção de וִיהִי. A expressão “aquele que é bom” representa o adjetivo definido singular sem decidir se ele tem força individual ou genérica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em conformidade com a política do projeto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” o preserva como nome, em vez de substituí-lo por um título.
- issue: Grau de tecnicidade de כֹהֵן הָרֹאשׁ
  choice: sacerdote principal
  alternative: sumo sacerdote
  rationale: A expressão significa literalmente o sacerdote que ocupa a posição principal. A tradução escolhida evita pressupor que o autor esteja empregando aqui um título institucional estritamente técnico.
- issue: Referente de הַטּוֹב
  choice: aquele que é bom
  alternative: os bons
  rationale: O hebraico usa um adjetivo definido no singular, que pode indicar uma pessoa boa em sentido genérico ou ter valor coletivo. A redação principal conserva o singular, e a nota registra a leitura coletiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservam-se o paralelismo entre as questões de Yahweh e as do rei, a linguagem administrativa do contexto e a ambiguidade do encerramento.
