source:
  edition: WLC
  text: אֲבָ֕ל דְּבָרִ֥ים טוֹבִ֖ים נִמְצְא֣וּ עִמָּ֑/ךְ כִּֽי בִעַ֤רְתָּ הָ/אֲשֵׁרוֹת֙ מִן הָ/אָ֔רֶץ וַ/הֲכִינ֥וֹתָ לְבָבְ/ךָ֖ לִ/דְרֹ֥שׁ הָֽ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/003.yaml
  text: Nevertheless[a], good things have been found in you[b], because you have cleared the Asherah poles out of the land and have set your heart to seek God.
translation:
  language: pt
  text: Contudo, foram encontradas em você coisas boas, pois você eliminou da terra os objetos de culto de Aserá[a] e preparou o seu coração[b] para buscar a Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “as asheroth”, plural que designa objetos de culto associados à deusa Aserá.'
    reason: cultural_note
  - marker: b
    text: 'Também se pode traduzir: “dispôs o seu coração a buscar a Deus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָל
  choice: Contudo
  rationale: Marca o contraste concessivo com a repreensão anterior, em linguagem atual e digna.
- source_word: דְּבָרִים טוֹבִים
  choice: coisas boas
  rationale: Mantém a amplitude da expressão hebraica, sem restringi-la apenas a atos ou qualidades interiores.
- source_word: נִמְצְאוּ עִמָּךְ
  choice: foram encontradas em você
  rationale: Preserva a construção passiva e expressa de modo natural a avaliação positiva feita a respeito de Josafá.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da avaliação positiva e mantém uma ligação causal clara com a afirmação anterior.
- source_word: בִעַרְתָּ
  choice: eliminou
  rationale: Comunica a remoção completa e decisiva dos objetos cultuais sem afirmar que tenham sido necessariamente queimados.
- source_word: הָאֲשֵׁרוֹת
  choice: os objetos de culto de Aserá
  rationale: O plural designa objetos cultuais associados à deusa Aserá; esta formulação evita especificar indevidamente sua forma física.
- source_word: מִן הָאָרֶץ
  choice: da terra
  rationale: Expressa de forma concisa e natural a retirada desses objetos do território.
- source_word: וַהֲכִינוֹתָ לְבָבְךָ
  choice: dispôs o coração
  rationale: Conserva a imagem hebraica do coração e transmite a ideia de resolução ou orientação interior deliberada.
- source_word: לִדְרֹשׁ הָאֱלֹהִים
  choice: a buscar a Deus
  rationale: Preserva a expressão teológica recorrente em Crônicas, que abrange devoção e orientação para Deus, não apenas consulta por informação.
theological_decisions:
- issue: Identificação de הָאֲשֵׁרוֹת
  choice: objetos de culto de Aserá
  alternative: postes de Aserá; as Aserás
  rationale: A referência é a objetos ligados ao culto de Aserá, mas sua forma exata não é inequívoca; a tradução torna a referência compreensível sem impor uma identificação física excessivamente específica.
- issue: Sentido de לִדְרֹשׁ הָאֱלֹהִים
  choice: buscar a Deus
  alternative: consultar a Deus
  rationale: No contexto de Crônicas, a expressão indica uma orientação ampla de devoção e fidelidade, e não somente o ato pontual de pedir uma resposta divina.
- issue: Relação entre repreensão e aprovação
  choice: Contudo, foram encontradas em você coisas boas
  alternative: Mas há coisas boas em você
  rationale: A formulação conserva tanto a repreensão do contexto quanto o reconhecimento divino do bem em Josafá, sem enfraquecer nenhum dos dois polos.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e vocabulário compreensível em âmbito internacional. A ordem e as imagens centrais do hebraico foram preservadas sempre que naturais em português.
