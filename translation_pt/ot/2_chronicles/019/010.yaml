reference: 2 Chronicles 19:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/כָל רִיב֩ אֲשֶׁר יָב֨וֹא עֲלֵי/כֶ֜ם מֵ/אֲחֵי/כֶ֣ם הַ/יֹּשְׁבִ֣ים בְּ/עָרֵי/הֶ֗ם בֵּֽין דָּ֣ם לְ/דָם֮ בֵּין תּוֹרָ֣ה לְ/מִצְוָה֮ לְ/חֻקִּ֣ים וּ/לְ/מִשְׁפָּטִים֒ וְ/הִזְהַרְתֶּ֣ם אֹתָ֔/ם וְ/לֹ֤א יֶאְשְׁמוּ֙ לַ/יהוָ֔ה וְ/הָֽיָה קֶ֥צֶף עֲלֵי/כֶ֖ם וְ/עַל אֲחֵי/כֶ֑ם כֹּ֥ה תַעֲשׂ֖וּ/ן וְ/לֹ֥א תֶאְשָֽׁמוּ־־׀־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/010.yaml
  text: And every dispute that comes before you from your brothers who live in their cities—whether between blood and blood[a], between law and commandment, statutes and judgments—you shall warn them, so that they may not incur guilt before Yahweh; otherwise wrath will come upon you and upon your brothers. Do this, and you will not incur guilt.
translation:
  language: pt
  text: E toda disputa que chegar diante de vocês, trazida por seus irmãos que moram nas cidades deles — seja entre sangue e sangue[a], seja entre lei e mandamento, estatutos e ordenanças —, vocês deverão adverti-los, para que não se tornem culpados diante de Yahweh; do contrário, a ira virá sobre vocês e sobre seus irmãos. Façam assim, e vocês não se tornarão culpados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “entre sangue e sangue”; provavelmente se refere a causas envolvendo derramamento de sangue ou homicídio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רִיב
  choice: disputa
  rationale: Denota uma controvérsia ou causa de caráter jurídico; “disputa” é atual e não restringe indevidamente o termo a um processo formal.
- source_word: יָבֹוא עֲלֵיכֶם
  choice: chegar diante de vocês
  rationale: No contexto judicial, descreve uma causa submetida à atenção ou jurisdição dos juízes.
- source_word: מֵאֲחֵיכֶם
  choice: trazida por seus irmãos
  rationale: Preserva a linguagem hebraica de parentesco aplicada aos membros da comunidade da aliança; “trazida” explicita naturalmente a origem da disputa.
- source_word: הַיֹּשְׁבִים בְּעָרֵיהֶם
  choice: que moram nas cidades deles
  rationale: Tradução direta e corrente da expressão participial.
- source_word: בֵּין דָּם לְדָם
  choice: entre sangue e sangue
  rationale: Mantém a formulação técnica, concisa e ambígua do hebraico, com esclarecimento provável em nota.
- source_word: בֵּין תּוֹרָה לְמִצְוָה לְחֻקִּים וּלְמִשְׁפָּטִים
  choice: entre lei e mandamento, estatutos e ordenanças
  rationale: Conserva as categorias jurídicas distintas da enumeração hebraica sem reduzi-las genericamente a “leis”.
- source_word: וְהִזְהַרְתֶּם אֹתָם
  choice: vocês deverão adverti-los
  rationale: O hifil de זהר expressa advertir ou admoestar a fim de prevenir culpa; “advertir” combina dignidade e clareza.
- source_word: יֶאְשְׁמוּ לַיהוָה
  choice: não se tornem culpados diante de Yahweh
  rationale: אשׁם indica tornar-se culpado ou incorrer em culpa; a formulação comunica culpabilidade sob o juízo divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: קֶצֶף
  choice: ira
  rationale: Expressa a gravidade da indignação e do juízo divinos no contexto da aliança.
- source_word: כֹּה תַעֲשׂוּן
  choice: Façam assim
  rationale: Retoma de modo conciso e natural a conduta judicial ordenada.
- source_word: וְלֹא תֶאְשָׁמוּ
  choice: vocês não se tornarão culpados
  rationale: Mantém coerência lexical com a ocorrência anterior de אשׁם.
theological_decisions:
- issue: Linguagem comunitária da aliança em אֲחֵיכֶם
  choice: seus irmãos
  alternative: seus compatriotas israelitas
  rationale: O hebraico emprega explicitamente linguagem de parentesco para a comunidade; preservá-la mantém sua dimensão familiar e pactual.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome pessoal divino; a transliteração o preserva em vez de substituí-lo por um título.
- issue: Sentido jurídico de בֵּין דָּם לְדָם
  choice: entre sangue e sangue
  alternative: em casos de derramamento de sangue
  rationale: A expressão hebraica é técnica e não explicita exatamente quais distinções jurídicas estão em vista; a tradução mantém essa tensão, e a nota apresenta a interpretação provável.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para o plural e preserva a concisão jurídica, a linguagem de parentesco e a ambiguidade genuína da expressão hebraica sobre sangue.
