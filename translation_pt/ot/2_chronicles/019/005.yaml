base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/005.yaml
  text: And he appointed judges in the land[a], in all the fortified cities of Judah, city by city.
translation:
  language: pt
  text: Ele nomeou juízes na terra[a], em todas as cidades fortificadas de Judá, cidade por cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por toda a terra”.'
    reason: Alternativa lexical que explicita o possível valor distributivo de בָּאָרֶץ.
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: nomeou
  rationale: O hifil de עמד, neste contexto administrativo, indica colocar pessoas em um cargo; “nomeou” expressa isso de modo natural e preciso.
- source_word: שֹׁפְטִים
  choice: juízes
  rationale: O substantivo designa autoridades judiciais, e “juízes” é a tradução direta e corrente.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: Mantém de perto a formulação hebraica; a expressão seguinte já explicita a abrangência distributiva.
- source_word: בְּכָל עָרֵי יְהוּדָה הַבְּצֻרוֹת
  choice: em todas as cidades fortificadas de Judá
  rationale: Preserva a totalidade indicada por כָל e entende הַבְּצֻרוֹת como qualificativo das cidades, isto é, cidades dotadas de defesas.
- source_word: לְעִיר וָעִיר
  choice: cidade por cidade
  rationale: Reproduz de maneira concisa e natural o idioma distributivo hebraico, enfatizando a designação em cada cidade.
