  text: וְ/עַתָּ֕ה יְהִ֥י פַֽחַד יְהוָ֖ה עֲלֵי/כֶ֑ם שִׁמְר֣וּ וַ/עֲשׂ֔וּ כִּֽי אֵ֞ין עִם יְהוָ֣ה אֱלֹהֵ֗י/נוּ עַוְלָ֛ה וּ/מַשֹּׂ֥א פָנִ֖ים וּ/מִקַּח שֹֽׁחַד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/007.yaml
  text: Now then[a], let the fear of Yahweh be upon you. Be careful and act, for with Yahweh our God there is no injustice, no partiality, and no taking of a bribe.
translation:
  language: pt
  text: Agora, pois, que o temor de Yahweh esteja sobre vocês. Tenham cuidado e ajam, pois com Yahweh, nosso Deus, não há injustiça, parcialidade[a] nem aceitação de suborno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente “levantamento de rostos”, expressão idiomática que significa favorecer alguém ou agir com parcialidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora, pois
  rationale: Expressa tanto a transição temporal quanto o caráter conclusivo e exortativo da expressão hebraica.
- source_word: יְהִי פַחַד יְהוָה עֲלֵיכֶם
  choice: que o temor de Yahweh esteja sobre vocês
  rationale: Mantém a força exortativa do jussivo e a imagem de o temor reverente de Deus estar sobre os juízes.
- source_word: שִׁמְרוּ וַעֲשׂוּ
  choice: Tenham cuidado e ajam
  rationale: No contexto judicial, os imperativos exigem atenção vigilante e ação concreta; a formulação é clara e natural em português atual.
- source_word: כִּי אֵין עִם יְהוָה אֱלֹהֵינוּ
  choice: pois com Yahweh, nosso Deus, não há
  rationale: Conserva a construção com עִם, que descreve aquilo que não se encontra no caráter nem na atuação de Deus.
- source_word: עַוְלָה
  choice: injustiça
  rationale: O contexto da nomeação e conduta de juízes favorece o sentido moral e judicial específico de falta de justiça.
- source_word: מַשֹּׂא פָנִים
  choice: parcialidade
  rationale: Traduz de modo natural o idiomatismo hebraico que indica favorecer alguém em razão de sua pessoa ou posição.
- source_word: מִקַּח שֹׁחַד
  choice: aceitação de suborno
  rationale: Representa com precisão a construção nominal referente ao ato de receber suborno.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Forma de verter o nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
- issue: Sentido de פַחַד יְהוָה
  choice: temor de Yahweh
  alternative: terror de Yahweh; reverência por Yahweh
  rationale: “Temor” preserva a amplitude da expressão hebraica, incluindo reverência solene e consciência do juízo divino, sem reduzi-la a mero terror nem explicá-la excessivamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem e a concisão da exortação hebraica foram preservadas, e o marcador da nota foi colocado junto a “parcialidade”, termo ao qual a explicação se refere.
