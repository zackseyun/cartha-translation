  source_fidelity: 'O texto traduz com precisão a sequência e os contrastes do hebraico: a disposição interior de Salomão, os pedidos que ele não fez (riqueza, bens, honra, a vida dos que o odeiam e muitos dias) e o pedido de sabedoria e conhecimento para julgar o povo. “Deus” corresponde corretamente a אֱלֹהִים. “Sobre o qual fiz você rei” comunica adequadamente a entronização por Deus. A vírgula final é apropriada, pois a declaração divina continua no versículo seguinte.'
