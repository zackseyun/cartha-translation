source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֣ים לִ/שְׁלֹמֹ֡ה יַ֣עַן אֲשֶׁר֩ הָיְתָ֨ה זֹ֜את עִם לְבָבֶ֗/ךָ וְ/לֹֽא שָׁ֠אַלְתָּ עֹ֣שֶׁר נְכָסִ֤ים וְ/כָבוֹד֙ וְ/אֵת֙ נֶ֣פֶשׁ שֹׂנְאֶ֔י/ךָ וְ/גַם יָמִ֥ים רַבִּ֖ים לֹ֣א שָׁאָ֑לְתָּ וַ/תִּֽשְׁאַל לְ/ךָ֙ חָכְמָ֣ה וּ/מַדָּ֔ע אֲשֶׁ֤ר תִּשְׁפּוֹט֙ אֶת עַמִּ֔/י אֲשֶׁ֥ר הִמְלַכְתִּ֖י/ךָ עָלָֽי/ו־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/011.yaml
  text: And God said to Solomon[a], “Because this was in your heart, and you did not ask for wealth, possessions, or honor, or for the life of those who hate you, nor did you ask for many days, but asked for wisdom and knowledge for yourself[b], that you might judge my people over whom I have made you king,”
translation:
  language: pt
  text: 'E Deus disse a Salomão: “Porque isso estava em seu coração, e você não pediu riqueza, bens ou honra, nem a vida dos que odeiam você[a], nem pediu muitos dias[b], mas pediu para si sabedoria e conhecimento, para poder julgar o meu povo, sobre o qual fiz você rei,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a vida dos seus inimigos”; literalmente, “a vida dos que odeiam você”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “uma vida longa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: Porque
  rationale: Introduz diretamente a razão da resposta de Deus e preserva a força causal do hebraico em português corrente.
- source_word: הָיְתָה זֹאת עִם לְבָבֶךָ
  choice: isso estava em seu coração
  rationale: Mantém a imagem hebraica do coração como sede da intenção, sem explicitar de modo interpretativo que se tratava de um desejo.
- source_word: עֹשֶׁר נְכָסִים וְכָבוֹד
  choice: riqueza, bens ou honra
  rationale: Distingue riqueza de propriedades ou posses e entende honra como condição e estima régias; a coordenação negativa é expressa naturalmente com 'ou'.
- source_word: נֶפֶשׁ שֹׂנְאֶיךָ
  choice: a vida dos que odeiam você
  rationale: Preserva o singular coletivo de נֶפֶשׁ e traduz de perto o particípio 'os que odeiam', sem substituí-lo diretamente por 'inimigos'.
- source_word: יָמִים רַבִּים
  choice: muitos dias
  rationale: Conserva a expressão concreta do hebraico; no contexto, ela pode significar vida longa, alternativa indicada em nota.
- source_word: חָכְמָה וּמַדָּע
  choice: sabedoria e conhecimento
  rationale: Mantém distintos os dois termos hebraicos, sem reduzir מַדָּע a uma repetição de sabedoria.
- source_word: לְךָ
  choice: para si
  rationale: Expressa a referência ao próprio Salomão como destinatário da sabedoria e do conhecimento pedidos, sem sugerir egoísmo.
- source_word: אֲשֶׁר תִּשְׁפּוֹט
  choice: para poder julgar
  rationale: Comunica a finalidade do pedido em português natural e conserva o sentido judicial e régio de שׁפט, em vez de o restringir a 'governar'.
- source_word: אֲשֶׁר הִמְלַכְתִּיךָ עָלָיו
  choice: sobre o qual fiz você rei
  rationale: Reproduz a declaração de que Deus estabeleceu Salomão como rei sobre o povo, em linguagem atual e clara.
theological_decisions:
- issue: Designação do falante divino אֱלֹהִים
  choice: Deus
  alternative: SENHOR
  rationale: O texto hebraico traz אֱלֹהִים, não o nome divino YHWH; portanto, 'Deus' segue precisamente a forma da fonte.
- issue: Função régia de Salomão em תִּשְׁפּוֹט
  choice: julgar
  alternative: governar
  rationale: '''Julgar'' preserva o verbo hebraico e sua tensão entre decisão judicial e exercício do governo real, sem dissolver um aspecto no outro.'
translation_notes:
  register: Português moderno, claro e digno, com 'você' para ampla legibilidade brasileira. A repetição de 'pediu' e a imagem de algo estar 'no coração' foram mantidas por sua importância estrutural. A vírgula final preserva o fato de que a fala e a construção sintática continuam no versículo seguinte.
