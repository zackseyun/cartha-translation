  terminology: '“Riqueza, bens ou honra”, “sabedoria e conhecimento” e “julgar” mantêm distinções lexicais relevantes do hebraico. As notas estão ancoradas nos termos corretos no texto português: a nota a trata de “a vida dos que odeiam você”, e a nota b trata de “muitos dias”.'
