base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/017.yaml
  text: They imported from Egypt a chariot for six hundred shekels of silver[a], and a horse for one hundred fifty[c][b]; and so they exported them to all the kings of the Hittites and the kings of Aram.
translation:
  language: pt
  text: Eles importaram do Egito um carro de guerra por seiscentos siclos de prata[a] e um cavalo por cento e cinquenta siclos. Assim, por intermédio deles[b], eles os exportaram para todos os reis dos hititas e para os reis de Arã[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Faziam subir e traziam para fora do Egito”. No contexto, trata-se da importação de mercadorias.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “pela mão deles”, expressão que indica agência ou intermediação.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “Arã”; tradicionalmente, “Síria”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ וַיּוֹצִיאוּ מִמִּצְרַיִם
  choice: Eles importavam do Egito
  rationale: Os dois verbos significam literalmente “fizeram subir e fizeram sair”, mas, no contexto comercial de aquisição e preços, “importavam” expressa com naturalidade o movimento das mercadorias desde o Egito.
- source_word: מֶרְכָּבָה
  choice: um carro de guerra
  rationale: O termo designa um carro, neste contexto militar; “carro de guerra” evita a possível associação moderna de “carruagem” a um veículo civil.
- source_word: בְּשֵׁשׁ מֵאוֹת כֶּסֶף
  choice: por seiscentos siclos de prata
  rationale: O hebraico menciona literalmente seiscentas unidades de prata; “siclos” explicita a unidade de peso monetário subentendida.
- source_word: וְסוּס בַּחֲמִשִּׁים וּמֵאָה
  choice: e um cavalo por cento e cinquenta siclos
  rationale: “Cavalo” corresponde ao sentido comum de סוּס. A unidade “siclos”, subentendida a partir da primeira cotação, é repetida para que o preço fique inequívoco em português.
- source_word: וְכֵן
  choice: Do mesmo modo
  rationale: A expressão liga essa operação à distribuição posterior, indicando a continuidade do mesmo comércio.
- source_word: בְּיָדָם
  choice: por intermédio deles
  rationale: A expressão literal “pela mão deles” é um idioma de agência; a formulação escolhida preserva explicitamente o papel intermediário dos comerciantes sem soar artificial.
- source_word: יוֹצִיאוּ
  choice: eram exportados
  rationale: Na segunda ocorrência da raiz, o contexto indica o envio dos bens aos reis estrangeiros. A voz passiva permite preservar como referente principal os bens, enquanto בְּיָדָם identifica os intermediários.
- source_word: לְכָל מַלְכֵי הַחִתִּים וּמַלְכֵי אֲרָם
  choice: para todos os reis dos hititas e para os reis de Arã
  rationale: Traduz diretamente os destinatários e conserva o nome histórico “Arã”, em vez da forma tradicional “Síria”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com preferência por formulação comercial natural. “Carro de guerra” esclarece a natureza do veículo; “siclos” explicita a unidade implícita; “por intermédio deles” mantém uma informação presente no hebraico. Os marcadores seguem a ordem de ocorrência no texto.
