  yaml_path: translation/ot/2_chronicles/001/018.yaml
  text: And Solomon said to build a house for the name of Yahweh[b][a], and a house for his kingdom.
translation:
  language: pt
  text: Salomão decidiu construir uma casa para o nome de Yahweh e uma casa para o seu reino.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Salomão disse construir uma casa para o nome de Yahweh e uma casa para o seu reino”; ou: “Salomão resolveu/ordenou construir um templo para o nome de Yahweh e um palácio para o seu reino”. Em hebraico, a palavra “casa” aparece nas duas partes da frase.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: decidiu
  rationale: Embora o verbo seja literalmente “disse”, seguido do infinitivo לִבְנוֹת neste contexto expressa naturalmente uma decisão ou propósito. “Decidiu” evita a construção pouco idiomática “disse construir”, sem transformar o ato em ordem explícita.
- source_word: לִבְנוֹת
  choice: construir
  rationale: O infinitivo de בנה significa diretamente “construir” e se liga com naturalidade a “decidiu”.
- source_word: בַּיִת ... וּבַיִת
  choice: uma casa ... e uma casa
  rationale: A repetição de “casa” preserva a repetição lexical hebraica. Pelo contexto, a primeira é o templo e a segunda, o palácio, mas essas especificações ficam implícitas nas expressões qualificadoras.
- source_word: לְשֵׁם יְהוָה
  choice: para o nome de Yahweh
  rationale: Mantém a fórmula teológica do templo associada ao nome divino, sem sugerir que Deus esteja contido no edifício.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: לְמַלְכוּתוֹ
  choice: para o seu reino
  rationale: מַלְכוּת pode significar “reino”, “realeza” ou “governo real”. “Para o seu reino” preserva a expressão ampla e indica a função régia da segunda casa.
theological_decisions:
- issue: Fórmula do templo ligada ao nome divino
  choice: para o nome de Yahweh
  alternative: em honra de Yahweh / para o nome do SENHOR
  rationale: A tradução conserva tanto o substantivo “nome” quanto o nome próprio יהוה, mantendo a linguagem teológica do original sem explicá-la excessivamente.
- issue: Sentido das duas ocorrências de בַּיִת
  choice: casa ... casa
  alternative: templo ... palácio
  rationale: A opção principal preserva a repetição deliberada do hebraico e não elimina a distinção contextual entre o edifício religioso e o régio.
- issue: Força contextual de וַיֹּאמֶר com infinitivo
  choice: decidiu construir
  alternative: disse que se construísse / ordenou construir
  rationale: A construção pode comunicar resolução ou ordem. “Decidiu” é natural no contexto e evita afirmar de modo categórico que Salomão deu uma ordem, embora essa leitura continue possível.
translation_notes:
  register: Português moderno, digno e de leitura ampla. “Decidiu construir” transmite de modo idiomático a força contextual da construção hebraica; a nota registra a tradução mais literal e a possibilidade de ordem. A repetição “casa ... casa” foi mantida intencionalmente.
