source:
  edition: WLC
  text: עַתָּה֙ יְהוָ֣ה אֱלֹהִ֔ים יֵֽאָמֵן֙ דְּבָ֣רְ/ךָ֔ עִ֖ם דָּוִ֣יד אָבִ֑/י כִּ֤י אַתָּה֙ הִמְלַכְתַּ֔/נִי עַל עַ֕ם רַ֖ב כַּ/עֲפַ֥ר הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/009.yaml
  text: Now[a], Yahweh God, let your word to David my father be confirmed, for you have made me king over a people as numerous as the dust of the earth.
translation:
  language: pt
  text: Agora, Yahweh Deus, que se confirme a palavra que deste a Davi, meu pai[a], pois tu me fizeste rei sobre um povo tão numeroso quanto o pó da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que fique estabelecida a promessa que fizeste a Davi, meu pai”.'
    reason: Alternativa lexical para a nuance promissória de «palavra» e para o sentido possível de «que se confirme».
lexical_decisions:
- source_word: עַתָּה
  choice: Agora
  rationale: Marca a transição para o pedido de Salomão de modo direto e natural em português.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Deus
  rationale: Mantém o nome divino expresso pelo Tetragrama e traduz אֱלֹהִים como o título «Deus».
- source_word: יֵאָמֵן
  choice: que se confirme
  rationale: Reproduz o valor volitivo e passivo do nifal de אמן, isto é, o pedido para que a palavra divina seja confirmada ou estabelecida.
- source_word: דְּבָרְךָ
  choice: a palavra que deste
  rationale: Conserva o substantivo amplo «palavra»; o verbo «deste» torna idiomática em português a relação com o destinatário indicada pela construção hebraica.
- source_word: עִם דָּוִיד אָבִי
  choice: a Davi, meu pai
  rationale: Nesse contexto, עִם integra uma expressão referente à palavra dirigida ou dada a alguém; «a Davi» comunica naturalmente essa relação.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão que fundamenta o pedido de Salomão, preservando a ligação argumentativa da oração.
- source_word: הִמְלַכְתַּנִי
  choice: tu me fizeste rei
  rationale: Expressa com clareza o sentido causativo do hifil de מלך.
- source_word: עַל עַם רַב
  choice: sobre um povo tão numeroso
  rationale: Interpreta רַב em seu sentido quantitativo, favorecido pela comparação imediatamente seguinte.
- source_word: כַּעֲפַר הָאָרֶץ
  choice: quanto o pó da terra
  rationale: Preserva a comparação hebraica convencional que indica uma multidão incontável.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração «Yahweh» preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Se דְּבָרְךָ deve ser explicitado como «promessa»
  choice: palavra
  alternative: promessa
  rationale: Embora o contexto seja promissório, o hebraico usa o termo mais amplo «palavra». O texto principal preserva essa amplitude, e a nota registra a leitura contextual possível.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento por «tu» coerente com a oração dirigida a Deus. A sintaxe foi levemente explicitada em «a palavra que deste a Davi» para evitar a construção pouco natural «tua palavra com Davi», sem eliminar a ambiguidade entre palavra e promessa.
