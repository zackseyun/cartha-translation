base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/007.yaml
  text: That night God appeared to Solomon and said to him[a], “Ask what I should give you.”
translation:
  language: pt
  text: 'Naquela noite, Deus apareceu a Salomão e lhe disse: “Peça o que devo dar a você.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Peça o que darei a você”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּלַּיְלָה הַהוּא
  choice: Naquela noite
  rationale: Expressa de modo natural em português a referência temporal definida do hebraico, literalmente “naquela noite”.
- source_word: נִרְאָה
  choice: apareceu
  rationale: O nifal de ראה, neste contexto de manifestação divina, significa naturalmente “apareceu”; “foi visto” seria excessivamente literal, e “revelou-se” acrescentaria uma nuance interpretativa.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma seja morfologicamente plural, o verbo singular e o contexto indicam inequivocamente o Deus de Israel.
- source_word: לִשְׁלֹמֹה
  choice: a Salomão
  rationale: A preposição ל indica a pessoa a quem Deus apareceu.
- source_word: וַיֹּאמֶר לוֹ
  choice: e lhe disse
  rationale: Reproduz com naturalidade אמר seguido do objeto pronominal; “lhe disse” é corrente e preserva a relação explícita com Salomão.
- source_word: שְׁאַל
  choice: Peça
  rationale: Neste contexto, o imperativo convida Salomão a solicitar algo. “Peça” é mais natural em português do que o absoluto “Pergunte” e não especifica indevidamente qual seria o pedido.
- source_word: מָה אֶתֶּן לָךְ
  choice: o que devo dar a você
  rationale: Mantém a construção aberta e ligeiramente ambígua do hebraico, apresentando como conteúdo do pedido aquilo que Deus dará; a nota registra a tradução mais literal do imperfeito.
theological_decisions:
- issue: Tradução de אֱלֹהִים no contexto de uma manifestação divina
  choice: Deus
  alternative: deuses
  rationale: A concordância verbal no singular e o contexto narrativo determinam um referente singular, sem necessidade de acrescentar afirmações doutrinárias além do texto.
- issue: Força modal de אֶתֶּן após o imperativo שְׁאַל
  choice: o que devo dar a você
  alternative: o que darei a você
  rationale: A formulação principal é idiomática e preserva a apresentação da dádiva como conteúdo do pedido. A alternativa mais formal é mantida em nota para não eliminar a tensão modal do imperfeito hebraico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega “a você” para evitar possível ambiguidade de “lhe” dentro da fala, enquanto “lhe disse” permanece natural na narração. O marcador [a] aparece imediatamente após a fala a que a nota se refere.
