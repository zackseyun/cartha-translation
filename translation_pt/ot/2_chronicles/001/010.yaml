  text: עַתָּ֗ה חָכְמָ֤ה וּ/מַדָּע֙ תֶּן לִ֔/י וְ/אֵֽצְאָ֛ה לִ/פְנֵ֥י הָֽ/עָם הַ/זֶּ֖ה וְ/אָב֑וֹאָה כִּֽי מִ֣י יִשְׁפֹּ֔ט אֶת עַמְּ/ךָ֥ הַ/זֶּ֖ה הַ/גָּדֽוֹל־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/010.yaml
  text: Now give me wisdom and knowledge[a], so that I may go out and come in before this people[b], for who can judge this great people of yours?
translation:
  language: pt
  text: Agora, dá-me sabedoria e conhecimento, para que eu saia e entre diante deste povo[a], pois quem pode julgar este teu grande povo?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica “sair e entrar diante deste povo” é uma maneira de falar do exercício da liderança pública.
    reason: cultural_note
  - marker: b
    text: 'Ou: “este grande povo que é teu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Agora
  rationale: Marca a transição para o pedido de Salomão de modo direto e natural em português.
- source_word: חָכְמָה וּמַדָּע
  choice: sabedoria e conhecimento
  rationale: 'Preserva os dois substantivos distintos: habilidade sábia para governar e conhecimento ou discernimento.'
- source_word: תֶּן לִי
  choice: dá-me
  rationale: Reproduz diretamente o imperativo hebraico com seu objeto indireto, em registro digno e corrente.
- source_word: וְאֵצְאָה ... וְאָבוֹאָה
  choice: para que eu saia e entre
  rationale: As formas volitivas indicam o propósito do pedido; a formulação conserva a imagem hebraica ligada ao exercício da liderança pública.
- source_word: לִפְנֵי הָעָם הַזֶּה
  choice: diante deste povo
  rationale: Mantém o sentido espacial e relacional de לִפְנֵי sem substituir a expressão por uma paráfrase explícita como “governar este povo”.
- source_word: מִי יִשְׁפֹּט
  choice: quem pode julgar
  rationale: A pergunta retórica comunica incapacidade humana diante da tarefa; “julgar” preserva o sentido judicial do verbo, que no contexto régio também abrange governar.
- source_word: עַמְּךָ הַזֶּה הַגָּדוֹל
  choice: este teu grande povo
  rationale: Conserva a referência direta ao povo de Deus, o demonstrativo e a amplitude de גָּדוֹל, que pode indicar tanto tamanho quanto importância.
theological_decisions:
- issue: Expressão de liderança no pedido de Salomão
  choice: Conservar “saia e entre diante deste povo”
  alternative: “lidere este povo” ou “governe este povo”
  rationale: A expressão hebraica descreve a atuação pública de um líder. Mantê-la preserva a imagem do texto-fonte, enquanto a nota esclarece sua função sem inserir uma interpretação denominacional.
- issue: Sentido de שׁפט no contexto régio
  choice: “julgar”
  alternative: “governar”
  rationale: Embora o exercício régio de julgar inclua governo e administração da justiça, “julgar” mantém o valor lexical e a tensão entre as funções judicial e governamental.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A colocação pronominal em “dá-me” preserva o tom solene sem soar arcaica; a expressão idiomática hebraica foi mantida no texto e explicada em nota.
