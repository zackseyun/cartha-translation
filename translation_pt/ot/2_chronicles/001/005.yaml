  naturalness: A redação revista é natural em português moderno e mantém um registro bíblico sóbrio. A ordem é levemente ajustada para deixar claro que Bezalel é o agente de “colocou”, sem tornar a frase pesada.
  terminology: “Altar de bronze”, “tabernáculo”, “Yahweh” e “assembleia” são adequados e coerentes. “Colocou diante do tabernáculo” representa com precisão a relação espacial e a ação expressas no hebraico.
