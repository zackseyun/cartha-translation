source:
  edition: WLC
  text: וּ/מִזְבַּ֣ח הַ/נְּחֹ֗שֶׁת אֲשֶׁ֤ר עָשָׂה֙ בְּצַלְאֵל֙ בֶּן אוּרִ֣י בֶן ח֔וּר שָׂ֕ם לִ/פְנֵ֖י מִשְׁכַּ֣ן יְהוָ֑ה וַ/יִּדְרְשֵׁ֥/הוּ שְׁלֹמֹ֖ה וְ/הַ/קָּהָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/005.yaml
  text: And the bronze altar that Bezalel son of Uri[a], son of Hur, had made was there before the tabernacle of Yahweh, and Solomon and the assembly sought it there.
translation:
  language: pt
  text: E Bezalel, filho de Uri, filho de Hur, tinha colocado diante do tabernáculo de Yahweh o altar de bronze que fizera; e Salomão e a assembleia o buscaram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O pronome pode se referir a Yahweh (“buscaram-no”) ou ao altar (“buscaram-no”); o sufixo hebraico é ambíguo.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִזְבַּח הַנְּחֹשֶׁת
  choice: E o altar de bronze
  rationale: מִזְבַּח significa “altar”, e נְחֹשֶׁת, neste contexto de mobiliário cultual, é naturalmente traduzido por “bronze”. A conjunção וּ é mantida para preservar a continuidade narrativa.
- source_word: אֲשֶׁר עָשָׂה
  choice: que ... tinha feito
  rationale: A oração relativa identifica o altar, e o mais-que-perfeito expressa com naturalidade uma ação anterior à situação narrada.
- source_word: בְּצַלְאֵל בֶּן אוּרִי בֶן חוּר
  choice: Bezalel, filho de Uri, filho de Hur
  rationale: Os nomes são transliterados segundo formas portuguesas reconhecíveis, e a sequência genealógica é preservada sem abreviação.
- source_word: שָׂם
  choice: estava ali
  rationale: O verbo indica que o altar fora posto naquele local; “estava ali” comunica o estado resultante sem introduzir um agente não expresso.
- source_word: לִפְנֵי מִשְׁכַּן יְהוָה
  choice: diante do tabernáculo de Yahweh
  rationale: לִפְנֵי tem sentido espacial, “diante de/em frente a”; מִשְׁכָּן é o tabernáculo ou morada cultual. O nome divino é transliterado como “Yahweh”, em consonância com a camada inglesa fornecida.
- source_word: וַיִּדְרְשֵׁהוּ
  choice: o buscaram ali
  rationale: דרשׁ pode significar “buscar” ou “consultar”, e o sufixo masculino singular pode retomar Yahweh ou, gramaticalmente, o altar. A tradução mantém o pronome ambíguo em português, enquanto “ali” explicita a ligação locativa exigida pelo contexto.
- source_word: שְׁלֹמֹה וְהַקָּהָל
  choice: Salomão e a assembleia
  rationale: קָהָל designa a comunidade reunida; “assembleia” é atual, claro e adequado ao contexto de culto público.
theological_decisions:
- issue: Referente do sufixo em וַיִּדְרְשֵׁהוּ
  choice: Manter “o buscaram”, permitindo que o pronome se refira a Yahweh ou ao altar.
  alternative: Explicitar “buscaram Yahweh” ou “buscaram o altar”; também seria possível traduzir impessoalmente “consultaram ali”.
  rationale: Buscar Yahweh é um uso bíblico comum de דרשׁ, mas “altar” é um antecedente masculino singular próximo. O pronome português “o” preserva melhor a ambiguidade real do hebraico, sem resolver silenciosamente a tensão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Tabernáculo” conserva o termo cultual estabelecido; “assembleia” evita uma formulação excessivamente denominacional. A posição da nota após a oração ambígua deixa claro a que ela se refere.
