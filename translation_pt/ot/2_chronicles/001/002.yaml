  source_fidelity: A enumeração principal é fiel ao hebraico. Contudo, «a todos os líderes de Israel» atenua a formulação distributiva «a cada líder de todo Israel», e «famílias ancestrais» é menos específico do que o termo técnico para casas/grupos familiares definidos por linhagem paterna. A nota b também chama de literal uma formulação que não corresponde adequadamente ao hebraico.
  naturalness: O texto é claro e tem registro bíblico moderno. «Chefes das casas paternas» é uma expressão natural o suficiente neste contexto histórico e comunica melhor a instituição social do que «famílias ancestrais».
  terminology: «Chefes de milhares e de centenas» e «juízes» são apropriados. «Líderes» é uma boa opção ampla para נָשִׂיא. «Casas paternas» preserva, sem artificialidade excessiva, a referência à organização familiar patrilinear.
