    rationale: רָאשֵׁי הָאָבוֹת é uma designação técnico-social para os chefes de casas/grupos familiares de descendência paterna; «chefes dos pais» não é uma glosa literal adequada, e «famílias ancestrais» torna menos visível a noção de casa paterna.
  - severity: low
    issue: «A todos os líderes de Israel» perde a distribuição de «todo/cada líder em todo Israel».
    rationale: O hebraico usa «todo/cada» com o singular נָשִׂיא e repete «todo Israel». A revisão preserva melhor o alcance, mantendo uma leitura portuguesa fluente.
