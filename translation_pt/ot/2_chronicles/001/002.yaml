base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/002.yaml
  text: And Solomon spoke to all Israel—to the commanders of thousands and of hundreds[a], to the judges, and to every leader in all Israel[b], the heads of the fathers’ houses.
translation:
  language: pt
  text: Salomão falou[a] a todo o Israel — aos chefes de milhares e de centenas, aos juízes e a todos os líderes de todo o Israel, os chefes das casas paternas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «disse».'
    reason: lexical_alternative
  - marker: b
    text: Hebraico, «os chefes das casas paternas»; expressão que se refere aos chefes de clãs ou de grupos familiares definidos pela linhagem paterna.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: falou
  rationale: Embora o verbo signifique formalmente «disse», «falou a» expressa com naturalidade uma comunicação pública dirigida a vários grupos.
- source_word: לְכָל יִשְׂרָאֵל
  choice: a todo o Israel
  rationale: Mantém a designação coletiva nacional e a formulação bíblica corrente, sem individualizá-la como «a todos os israelitas».
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: aos chefes de milhares e de centenas
  rationale: שָׂרֵי designa autoridades ou comandantes; «chefes» preserva a possível dimensão militar e administrativa. «Milhares» e «centenas» são mantidos como nomes das unidades, sem especificar além do hebraico.
- source_word: וְלַשֹּׁפְטִים
  choice: aos juízes
  rationale: Tradução direta do título administrativo derivado de שׁפט.
- source_word: וּלְכֹל נָשִׂיא לְכָל יִשְׂרָאֵל
  choice: e a todos os líderes de Israel
  rationale: נָשִׂיא pode indicar chefe, príncipe ou líder. «Líderes» evita uma conotação monárquica indevida, e o plural idiomático comunica o alcance distributivo de «cada líder em todo o Israel».
- source_word: רָאשֵׁי הָאָבוֹת
  choice: os chefes das famílias ancestrais
  rationale: A expressão designa os responsáveis pelos agrupamentos familiares ou casas de linhagem paterna. «Famílias ancestrais» preserva a estrutura histórica com maior clareza em português do que o decalque «casas dos pais».
theological_decisions:
- issue: Sentido da expressão de parentesco e administração רָאשֵׁי הָאָבוֹת
  choice: os chefes das famílias ancestrais
  alternative: os chefes das casas paternas
  rationale: A opção conserva a referência histórica a grupos familiares definidos pela ascendência, sem introduzir uma formulação portuguesa obscura. A nota registra a forma mais literal e a dimensão patrilinear.
- issue: Relação de רָאשֵׁי הָאָבוֹת com os líderes de Israel
  choice: 'aposição: «os chefes das famílias ancestrais»'
  alternative: uma classe adicional independente
  rationale: A ausência de uma nova preposição ou conjunção favorece entender a expressão final como identificação ou explicação dos líderes mencionados, embora a sintaxe compacta do hebraico seja preservada sem acrescentar «isto é».
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O travessão organiza a enumeração sem eliminar a estrutura do hebraico; a aposição final permanece visível. «Chefes» foi preferido a «comandantes» para não restringir indevidamente a função a um âmbito exclusivamente militar.
