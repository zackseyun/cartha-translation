  text: הַֽ/חָכְמָ֥ה וְ/הַ/מַּדָּ֖ע נָת֣וּן לָ֑/ךְ וְ/עֹ֨שֶׁר וּ/נְכָסִ֤ים וְ/כָבוֹד֙ אֶתֶּן לָ֔/ךְ אֲשֶׁ֣ר לֹא הָ֣יָה כֵ֗ן לַ/מְּלָכִים֙ אֲשֶׁ֣ר לְ/פָנֶ֔י/ךָ וְ/אַחֲרֶ֖י/ךָ לֹ֥א יִֽהְיֶה כֵּֽן־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/012.yaml
  text: Wisdom and knowledge are given to you[a], and I will give you riches and possessions and honor such as no kings before you have had, and none after you will have the like.
translation:
  language: pt
  text: A sabedoria e o conhecimento lhe são concedidos. Também lhe darei riquezas, bens e honra, como nenhum rei antes de você teve e como nenhum rei depois de você terá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “que não houve assim para os reis que vieram antes de você e, depois de você, não haverá assim”.'
    reason: Preserva a construção impessoal e a repetição de “assim” no hebraico, sem introduzir um substantivo não expresso no texto-fonte.
lexical_decisions:
- source_word: הַחָכְמָה
  choice: a sabedoria
  rationale: Tradução usual de חָכְמָה; o artigo hebraico é preservado naturalmente em português.
- source_word: הַמַּדָּע
  choice: o conhecimento
  rationale: מַדָּע pode indicar conhecimento ou entendimento; “conhecimento” mantém a associação direta com “sabedoria” sem ampliar o sentido.
- source_word: נָתוּן לָךְ
  choice: lhe são concedidos
  rationale: O particípio passivo expressa algo outorgado e agora pertencente ao destinatário. O plural segue naturalmente o sujeito composto em português.
- source_word: עֹשֶׁר
  choice: riquezas
  rationale: Expressa abundância material e permanece distinto de נְכָסִים, traduzido como “bens”.
- source_word: נְכָסִים
  choice: bens
  rationale: Designa posses ou propriedades; “bens” é claro, atual e adequado ao contexto régio.
- source_word: כָבוֹד
  choice: honra
  rationale: Neste contexto de dádivas reais, כָבוֹד se refere à honra ou dignidade conferida, sem exigir o sentido de glória divina.
- source_word: אֶתֶּן לָךְ
  choice: lhe darei
  rationale: O imperfeito indica naturalmente a promessa futura de Deus.
- source_word: אֲשֶׁר לֹא הָיָה כֵן לַמְּלָכִים
  choice: como nenhum rei ... teve
  rationale: Formulação portuguesa idiomática para a comparação hebraica, cujo enunciado mais literal é “não houve assim para os reis”.
- source_word: לְפָנֶיךָ
  choice: antes de você
  rationale: Expressa precedência temporal na sucessão dos reis.
- source_word: וְאַחֲרֶיךָ לֹא יִהְיֶה כֵן
  choice: e nenhum depois de você terá
  rationale: Explicita de modo natural os reis subentendidos na segunda metade da comparação, sem ampliar seu alcance.
theological_decisions:
- issue: Alcance da singularidade atribuída a Salomão
  choice: A comparação se refere às dádivas enumeradas — sabedoria, conhecimento, riquezas, bens e honra — em relação aos reis anteriores e posteriores.
  alternative: Entender a frase como declaração de que Salomão seria absolutamente incomparável em todos os aspectos.
  rationale: A estrutura do versículo liga a comparação às dádivas mencionadas, não a toda característica pessoal ou a todo aspecto do reinado de Salomão.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão ampla no mundo lusófono. “Você” comunica com clareza o singular do hebraico; “bens” evita o tom técnico de “ativos” e distingue נְכָסִים de “riquezas”.
