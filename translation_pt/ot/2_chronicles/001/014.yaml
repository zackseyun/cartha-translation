  source_fidelity: 'A tradução preserva os elementos essenciais do hebraico: Salomão reúne carros e cavaleiros, possui os números indicados e os distribui entre cidades destinadas aos carros e a sua própria presença em Jerusalém. “Cavaleiros” traduz adequadamente פָּרָשִׁים como homens montados, sem reduzir o termo aos animais.'
