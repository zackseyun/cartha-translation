  terminology: “Carros de guerra” é uma escolha apropriada para רֶכֶב neste contexto. “Cavaleiros” é natural e suficientemente literal; a nota lexical preserva a alternativa “tropa de cavalaria”. A nota cultural deve permanecer ancorada em “cidades dos carros de guerra”.
