  text: וַ/יֶּאֱסֹ֣ף שְׁלֹמֹה֮ רֶ֣כֶב וּ/פָרָשִׁים֒ וַֽ/יְהִי ל֗/וֹ אֶ֤לֶף וְ/אַרְבַּע מֵאוֹת֙ רֶ֔כֶב וּ/שְׁנֵים עָשָׂ֥ר אֶ֖לֶף פָּרָשִׁ֑ים וַ/יַּנִּיחֵ/ם֙ בְּ/עָרֵ֣י הָ/רֶ֔כֶב וְ/עִם הַ/מֶּ֖לֶךְ בִּ/ירֽוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/014.yaml
  text: And Solomon gathered chariots and horsemen[a], and he had 1,400 chariots and 12,000 horsemen[b]; and he stationed them in the chariot cities and with the king in Jerusalem.
translation:
  language: pt
  text: Salomão reuniu carros de guerra e cavaleiros[a]; tinha 1.400 carros de guerra e 12.000 cavaleiros e os instalou nas cidades dos carros de guerra[b] e junto do rei em Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tropa de cavalaria”. O termo hebraico se refere a homens montados; “cavaleiros” é a tradução mais literal.
    reason: lexical_alternative
  - marker: b
    text: Isto é, cidades designadas para guardar ou aquartelar carros de guerra.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: reuniu
  rationale: O verbo אסף significa reunir ou ajuntar; “reuniu” expressa naturalmente o ato de concentrar recursos militares.
- source_word: רֶכֶב
  choice: carros de guerra
  rationale: Embora o termo possa designar coletivamente a força de carros, a contagem explícita favorece o substantivo concreto. “Carros de guerra” evita a ambiguidade moderna de “carros” isoladamente.
- source_word: פָּרָשִׁים
  choice: cavaleiros
  rationale: O substantivo designa normalmente homens montados, não apenas os cavalos. “Cavaleiros” é literal, corrente e adequado ao contexto militar.
- source_word: וַיְהִי לוֹ
  choice: ele tinha
  rationale: É a forma idiomática portuguesa para a construção hebraica de posse, literalmente “havia para ele”.
- source_word: אֶלֶף וְאַרְבַּע מֵאוֹת רֶכֶב
  choice: 1.400 carros de guerra
  rationale: Mantém com exatidão a quantidade e usa a convenção numérica corrente em português.
- source_word: וּשְׁנֵים עָשָׂר אֶלֶף פָּרָשִׁים
  choice: 12.000 cavaleiros
  rationale: Mantém com exatidão a quantidade e usa a convenção numérica corrente em português.
- source_word: וַיַּנִּיחֵם
  choice: os instalou
  rationale: Na forma causativa, o verbo indica colocar ou deixar em locais determinados. “Instalou” comunica a distribuição em bases designadas sem exigir que todos os referentes sejam pessoas.
- source_word: בְּעָרֵי הָרֶכֶב
  choice: nas cidades dos carros
  rationale: Reproduz de modo conciso a construção hebraica para cidades destinadas a abrigar ou guarnecer carros de guerra; a nota esclarece a expressão cultural.
- source_word: וְעִם הַמֶּלֶךְ
  choice: e junto ao rei
  rationale: Preserva a formulação hebraica sem acrescentar explicitamente “alguns”, embora a distribuição esteja implícita no contexto.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: Forma portuguesa consagrada do topônimo com a preposição locativa apropriada.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Carros de guerra” explicita o sentido antigo de רֶכֶב; “cidades dos carros” conserva a expressão técnica do hebraico, esclarecida em nota. A coordenação foi dividida em duas frases para fluidez sem alterar a sequência narrativa.
