  text: אֲבָ֗ל אֲר֤וֹן הָ/אֱלֹהִים֙ הֶעֱלָ֤ה דָוִיד֙ מִ/קִּרְיַ֣ת יְעָרִ֔ים בַּֽ/הֵכִ֥ין ל֖/וֹ דָּוִ֑יד כִּ֧י נָֽטָה ל֛/וֹ אֹ֖הֶל בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/004.yaml
  text: But David had brought up the ark of God from Kiriath-jearim to the place David had prepared for it[a], for he had pitched a tent for it in Jerusalem.
translation:
  language: pt
  text: Mas Davi tinha levado a arca de Deus de Quiriate-Jearim para o lugar que Davi havia preparado para ela[a], pois tinha armado uma tenda para ela em Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “para o que Davi havia preparado para ela”. A expressão hebraica é condensada; o sentido é que Davi levou a arca ao lugar que havia deixado pronto para ela.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָל
  choice: Mas
  rationale: Marca o contraste com o altar de bronze em Gibeão, mencionado no versículo anterior, enquanto a arca estava em Jerusalém.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: a arca de Deus
  rationale: Reproduz naturalmente a construção hebraica sem acrescentar qualificações ausentes no texto.
- source_word: הֶעֱלָה
  choice: tinha levado
  rationale: O hifil de עלה indica fazer subir ou levar; o mais-que-perfeito apresenta a transferência anterior da arca como pano de fundo narrativo.
- source_word: מִקִּרְיַת יְעָרִים
  choice: de Quiriate-Jearim
  rationale: Emprega uma forma portuguesa reconhecível do topônimo hebraico.
- source_word: בַּהֵכִין לוֹ דָוִיד
  choice: para o lugar que havia preparado para ela
  rationale: A expressão hebraica é condensada; explicitar 'o lugar' comunica o destino implícito sem alterar o sentido.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação de como Davi havia preparado o local.
- source_word: נָטָה לוֹ אֹהֶל
  choice: tinha armado uma tenda para ela
  rationale: נטה com אהל significa armar ou estender uma tenda; 'armar uma tenda' é idiomático em português atual.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: Tradução locativa direta com a forma portuguesa consagrada do topônimo.
