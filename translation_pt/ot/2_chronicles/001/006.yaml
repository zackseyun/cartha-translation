  text: וַ/יַּעַל֩ שְׁלֹמֹ֨ה שָׁ֜ם עַל מִזְבַּ֤ח הַ/נְּחֹ֨שֶׁת֙ לִ/פְנֵ֣י יְהוָ֔ה אֲשֶׁ֖ר לְ/אֹ֣הֶל מוֹעֵ֑ד וַ/יַּ֧עַל עָלָ֛י/ו עֹל֖וֹת אָֽלֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/006.yaml
  text: And Solomon went up there to the bronze altar before Yahweh[a], which was at the tent of meeting, and offered on it a thousand burnt offerings.
translation:
  language: pt
  text: Salomão subiu até lá, ao altar de bronze que estava diante de Yahweh, junto à tenda do encontro, e sobre ele ofereceu mil holocaustos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל שְׁלֹמֹה שָׁם
  choice: Salomão subiu até lá
  rationale: Preserva o sentido direcional de עלה e retoma naturalmente o lugar mencionado no contexto.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: altar de bronze
  rationale: Expressão cultual convencional e clara; נְחֹשֶׁת pode designar cobre ou bronze, mas aqui 'bronze' é a forma consagrada e adequada.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: לִפְנֵי indica posição ou presença, e o nome divino é mantido como nome próprio.
- source_word: אֲשֶׁר לְאֹהֶל מוֹעֵד
  choice: que estava ... junto à tenda do encontro
  rationale: Entende o לְ como relação locativa ou associativa e evita sugerir que o altar estivesse dentro da tenda.
- source_word: וַיַּעַל עָלָיו עֹלוֹת
  choice: sobre ele ofereceu ... holocaustos
  rationale: A segunda ocorrência de עלה pertence à linguagem sacrificial; 'ofereceu' comunica naturalmente o ato, enquanto 'sobre ele' preserva a referência explícita ao altar.
- source_word: עֹלוֹת
  choice: holocaustos
  rationale: Termo português tradicional e preciso para ofertas inteiramente queimadas, compreensível no registro bíblico.
- source_word: אָלֶף
  choice: mil
  rationale: Tradução direta do numeral cardinal.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz o Tetragrama como nome próprio. 'Yahweh' preserva esse caráter e segue a orientação lexical fornecida, sem substituí-lo por um título.
translation_notes:
  register: 'Português atual, digno e amplamente compreensível, com fluidez brasileira. A ordem foi levemente ajustada para evitar ambiguidade: a oração relativa fica ligada ao altar de bronze, e ''junto à tenda do encontro'' expressa com naturalidade a relação espacial indicada pelo hebraico.'
