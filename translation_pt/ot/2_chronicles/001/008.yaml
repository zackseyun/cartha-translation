  text: וַ/יֹּ֤אמֶר שְׁלֹמֹה֙ לֵֽ/אלֹהִ֔ים אַתָּ֗ה עָשִׂ֛יתָ עִם דָּוִ֥יד אָבִ֖/י חֶ֣סֶד גָּד֑וֹל וְ/הִמְלַכְתַּ֖/נִי תַּחְתָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/008.yaml
  text: And Solomon said to God[a], “You have shown great covenant faithfulness to David my father, and you have made me king in his place.”
translation:
  language: pt
  text: 'Então Salomão disse a Deus: “Tu demonstraste grande amor leal[a] a Davi, meu pai, e me fizeste rei em seu lugar.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “demonstraste grande bondade” ou “demonstraste grande fidelidade”. O termo hebraico חֶסֶד muitas vezes expressa amor leal, bondade constante e fidelidade no âmbito de uma relação ou aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo dá prosseguimento à narrativa; “Então” expressa essa progressão de modo natural em português.
- source_word: לֵאלֹהִים
  choice: a Deus
  rationale: A expressão identifica claramente Deus como aquele a quem Salomão dirige suas palavras.
- source_word: עָשִׂיתָ עִם ... חֶסֶד גָּדוֹל
  choice: demonstraste grande amor leal a
  rationale: A construção descreve uma ação marcada por חֶסֶד. “Amor leal” preserva tanto a dimensão afetiva quanto a constância e lealdade relacional do termo, sem tornar explícita no texto principal uma referência à aliança que permanece contextual.
- source_word: דָּוִיד אָבִי
  choice: Davi, meu pai
  rationale: A aposição soa natural em português e conserva a ordem e a relação expressas no hebraico.
- source_word: וְהִמְלַכְתַּנִי
  choice: e me fizeste rei
  rationale: 'O hifil de מלך é causativo: Deus fez com que Salomão reinasse. A formulação é clara e preserva diretamente a agência divina.'
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: No contexto de sucessão real, a expressão indica que Salomão passou a ocupar o lugar de Davi, sem sugerir necessariamente deposição ou conflito.
theological_decisions:
- issue: Sentido de חֶסֶד no contexto das promessas feitas a Davi
  choice: grande amor leal
  alternative: grande fidelidade à aliança; grande bondade; grande amor constante
  rationale: “Amor leal” comunica a bondade firme e relacional de Deus e permite que o contexto davídico forneça a dimensão de aliança, sem reduzir חֶסֶד a mera bondade nem explicitar além do necessário uma única análise semântica.
- issue: Agência divina na sucessão de Salomão
  choice: me fizeste rei em seu lugar
  alternative: fizeste com que eu reinasse depois dele
  rationale: A opção conserva o valor causativo do verbo e afirma que Deus estabeleceu Salomão como rei, sem acrescentar uma explicação teológica além do texto.
translation_notes:
  register: Português moderno, digno e acessível, com uso de “tu” coerente com a fala direta dirigida a Deus. “Amor leal” mantém a densidade relacional do hebraico e a nota registra as principais alternativas sem resolver indevidamente toda a amplitude do termo.
