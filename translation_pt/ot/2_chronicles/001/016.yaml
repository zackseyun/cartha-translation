base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/016.yaml
  text: And the source of Solomon’s horses was Egypt and Kue[b][a], and the king’s merchants would obtain them from Kue for a price.
translation:
  language: pt
  text: A origem dos cavalos de Salomão vinha do Egito e de Cue[a]; os mercadores do rei os adquiriam de Cue por um preço.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e de um entreposto”. O termo hebraico מִקְוֵא é difícil e também pode ser entendido como substantivo comum, indicando um lugar de reunião ou depósito, em vez do nome geográfico Cue.'
    reason: alternative_reading
  - marker: b
    text: 'Segundo essa interpretação alternativa, a frase pode ser traduzida: “os mercadores do rei os compravam de um entreposto por um preço”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמוֹצָא
  choice: A origem
  rationale: מוֹצָא pode indicar procedência ou origem. No contexto do comércio de cavalos, “origem” preserva o sentido sem explicitar além do texto uma operação de importação.
- source_word: הַסּוּסִים אֲשֶׁר לִשְׁלֹמֹה
  choice: dos cavalos de Salomão
  rationale: A construção com לְ expressa posse ou associação; esta formulação é natural e concisa em português.
- source_word: מִמִּצְרָיִם
  choice: o Egito
  rationale: Forma portuguesa consagrada do nome geográfico.
- source_word: וּמִקְוֵא / מִקְוֵא
  choice: e Cue / de Cue
  rationale: O termo difícil é entendido como topônimo, provavelmente referente à região da Cilícia, e traduzido de modo coerente nas duas ocorrências. A alternativa como substantivo comum é preservada em nota.
- source_word: סֹחֲרֵי הַמֶּלֶךְ
  choice: os mercadores do rei
  rationale: O particípio substantivado designa comerciantes; “mercadores” é corrente e adequado ao registro histórico.
- source_word: יִקְחוּ
  choice: adquiriam
  rationale: לקח significa literalmente “tomar”, mas neste contexto comercial “adquirir” comunica naturalmente a obtenção sem exigir o verbo mais específico “comprar”.
- source_word: בִּמְחִיר
  choice: por um preço
  rationale: A expressão indica aquisição mediante pagamento e é mantida de forma próxima ao hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O topônimo é grafado “Cue”, forma natural em português. O ponto e vírgula reproduz com clareza a progressão da frase hebraica sem tornar a sintaxe pesada; as notas preservam a incerteza textual e lexical de מִקְוֵא.
