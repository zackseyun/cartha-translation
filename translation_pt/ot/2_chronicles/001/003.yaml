  text: וַ/יֵּלְכ֗וּ שְׁלֹמֹה֙ וְ/כָל הַ/קָּהָ֣ל עִמּ֔/וֹ לַ/בָּמָ֖ה אֲשֶׁ֣ר בְּ/גִבְע֑וֹן כִּי שָׁ֣ם הָיָ֗ה אֹ֤הֶל מוֹעֵד֙ הָֽ/אֱלֹהִ֔ים אֲשֶׁ֥ר עָשָׂ֛ה מֹשֶׁ֥ה עֶֽבֶד יְהוָ֖ה בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/003.yaml
  text: So Solomon and all the assembly with him went to the high place that was at Gibeon[a], because the tent of meeting of God was there, which Moses the servant of Yahweh had made in the wilderness.
translation:
  language: pt
  text: Então Salomão e toda a assembleia que o acompanhava foram ao lugar alto que havia em Gibeom, pois ali estava a tenda do encontro de Deus, que Moisés, servo de Yahweh, tinha feito no deserto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: foram
  rationale: O wayyiqtol de הלך faz avançar a narrativa; o pretérito perfeito expressa isso naturalmente, sem acrescentar uma direção ausente do verbo.
- source_word: הַקָּהָל
  choice: a assembleia
  rationale: קהל designa a comunidade reunida. “Assembleia” preserva o sentido coletivo e é claro em português moderno.
- source_word: עִמּוֹ
  choice: que o acompanhava
  rationale: Expressa de modo natural a relação comitativa de עִמּוֹ e evita a construção pouco idiomática “a assembleia com ele”.
- source_word: לַבָּמָה
  choice: ao lugar alto
  rationale: במה é o termo usual para um lugar elevado destinado ao culto. A tradução mantém o termo sem lhe impor aqui uma avaliação negativa, pois a tenda do encontro estava em Gibeom.
- source_word: בְּגִבְעוֹן
  choice: de Gibeom
  rationale: A preposição portuguesa “de” liga naturalmente o local de culto à sua localização em Gibeom; o topônimo segue a forma portuguesa corrente.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão ou explicação da ida a Gibeom. “Pois” preserva essa relação sem tornar a frase pesada.
- source_word: אֹהֶל מוֹעֵד
  choice: a tenda do encontro
  rationale: Tradução transparente do nome do santuário, sem recorrer ao termo menos imediatamente compreensível “tabernáculo”.
- source_word: הָאֱלֹהִים
  choice: de Deus
  rationale: Reproduz diretamente a relação genitiva na expressão “tenda do encontro de Deus”.
- source_word: עָשָׂה
  choice: tinha feito
  rationale: O mais-que-perfeito composto deixa claro que a construção por Moisés antecedeu os acontecimentos narrados.
- source_word: עֶבֶד יְהוָה
  choice: servo de Yahweh
  rationale: “Servo” comunica adequadamente o título honorífico de Moisés e sua dedicação ao serviço divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: No contexto da peregrinação de Israel, “deserto” é a forma mais corrente e imediatamente compreensível em português, abrangendo a região erma indicada por מִדְבָּר.
theological_decisions:
- issue: Sentido de במה num contexto de culto anterior à construção do templo
  choice: lugar alto
  alternative: santuário no alto
  rationale: A tradução conserva o termo concreto e sua tensão histórica, sem sugerir que o culto em Gibeom fosse necessariamente ilegítimo neste contexto.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto contém o nome pessoal divino; sua transliteração preserva essa distinção em relação a um título.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e vocabulário amplamente compreensível. A construção “que o acompanhava” torna natural a relação com Salomão sem alterar o referente coletivo. Não se acrescentou nota para כִּי, pois “pois” já preserva adequadamente sua função causal-explicativa.
