base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/015.yaml
  text: The king made the silver and the gold in Jerusalem as plentiful as stones[b][a], and he made the cedars as plentiful as the sycamore trees that are in the lowland.
translation:
  language: pt
  text: O rei tornou a prata e o ouro tão abundantes em Jerusalém quanto as pedras[a] e tornou os cedros tão abundantes quanto os sicômoros que há nas terras baixas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como pedras”. O hebraico expressa uma abundância extraordinária por meio dessa comparação.'
    reason: lexical_alternative
  - marker: b
    text: As “terras baixas” referem-se à Sefelá, área de colinas baixas da Judeia situada entre a região montanhosa e a planície costeira.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: tornou ... tão abundantes
  rationale: 'Embora נתן geralmente signifique “dar” ou “pôr”, nesta construção com objetos diretos e comparações o sentido é causativo e resultativo: o rei fez com que esses bens se tornassem extremamente comuns.'
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב
  choice: a prata e o ouro
  rationale: Mantém os dois substantivos definidos do hebraico e os apresenta como materiais ou riquezas disponíveis em Jerusalém.
- source_word: כָּאֲבָנִים
  choice: tão abundantes ... quanto as pedras
  rationale: A forma hebraica é literalmente “como pedras”; a tradução explicita que a comparação diz respeito à extraordinária abundância, não à natureza dos materiais.
- source_word: הָאֲרָזִים
  choice: os cedros
  rationale: Preserva o plural concreto do hebraico sem decidir se a referência principal é às árvores ou à madeira de cedro disponível.
- source_word: כַּשִּׁקְמִים
  choice: quanto os sicômoros
  rationale: שׁקמה designa o sicômoro, isto é, a figueira-sicômoro comum na região; “sicômoros” é conciso e natural em português.
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: que havia na região baixa
  rationale: שְׁפֵלָה pode designar especificamente a Sefelá, região de colinas baixas entre a serra da Judeia e a planície costeira. A expressão comum fica no texto, e a identificação geográfica aparece em nota.
- source_word: לָרֹב
  choice: tão abundantes
  rationale: A expressão indica grande quantidade. Seu sentido foi integrado à comparação para produzir uma frase portuguesa clara e fiel.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e ampla legibilidade brasileira. A repetição de “tornou” conserva o paralelismo hebraico, enquanto “tão abundantes ... quanto” comunica o valor idiomático das comparações.
