id: 2CH.1.1
reference: 2 Chronicles 1:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּתְחַזֵּ֛ק שְׁלֹמֹ֥ה בֶן דָּוִ֖יד עַל מַלְכוּת֑/וֹ וַ/יהוָ֤ה אֱלֹהָי/ו֙ עִמּ֔/וֹ וַֽ/יְגַדְּלֵ֖/הוּ לְ/מָֽעְלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/001.yaml
  text: And Solomon son of David strengthened himself over his kingdom[b][a], and Yahweh his God was with him and made him exceedingly great.
translation:
  language: pt
  text: Salomão, filho de Davi, fortaleceu-se no seu reino[a]. Yahweh[b], seu Deus, estava com ele e o engrandeceu sobremaneira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tornou-se forte no seu reino” ou “firmou-se no seu reino”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: YHWH, o nome divino, tradicionalmente representado por “SENHOR”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: fortaleceu-se
  rationale: O hitpael de חזק tem sentido reflexivo ou intransitivo. “Fortaleceu-se” preserva a participação ativa de Salomão sem excluir a ideia contextual de que seu governo se consolidou.
- source_word: עַל מַלְכוּתוֹ
  choice: no seu reino
  rationale: Embora עַל possa ser vertido literalmente por “sobre”, em português “fortaleceu-se sobre o seu reino” seria pouco natural. “No seu reino” expressa de modo corrente a esfera em que Salomão se fortaleceu, enquanto a nota registra outras possibilidades.
- source_word: בֶן דָּוִיד
  choice: filho de Davi
  rationale: Tradução direta da designação filial, que também conserva a ênfase dinástica do texto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH em vez de substituí-lo por um título.
- source_word: אֱלֹהָיו
  choice: seu Deus
  rationale: Conserva diretamente a construção possessiva e a relação pessoal expressa no hebraico.
- source_word: עִמּוֹ
  choice: estava com ele
  rationale: Expressão portuguesa natural para a presença e o favor divinos indicados pelo hebraico.
- source_word: וַיְגַדְּלֵהוּ
  choice: o engrandeceu
  rationale: O piel de גדל com sufixo de objeto indica fazer alguém grande ou exaltá-lo; “engrandeceu” preserva de forma concisa o sentido causativo.
- source_word: לְמָעְלָה
  choice: sobremaneira
  rationale: Neste contexto, a expressão funciona adverbialmente como intensificador; “sobremaneira” comunica grande intensidade em registro digno e compreensível.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” conserva o nome pessoal em transliteração, sem substituí-lo por um título.
- issue: Agência no fortalecimento e na grandeza de Salomão
  choice: Manter tanto o fortalecimento reflexivo de Salomão quanto a ação de Deus ao engrandecê-lo
  alternative: Verter a primeira ação passivamente, como “foi fortalecido”, ou interpretativamente, como “foi estabelecido”
  rationale: O hebraico justapõe o fortalecimento de Salomão em relação ao reino e a presença e ação de Yahweh. A tradução conserva essa tensão sem atribuir toda a agência exclusivamente a uma das partes.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais no Brasil sem regionalismos marcados. “Sobremaneira” mantém o tom elevado do relato sem se tornar obscuro.
