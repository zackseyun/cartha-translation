base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/013.yaml
  text: Then Solomon came to Jerusalem from the high place that was at Gibeon[a], from before the tent of meeting[c][b], and he reigned over Israel.
translation:
  language: pt
  text: Então Salomão chegou[a] a Jerusalém, vindo do lugar alto que ficava em Gibeão[c], de diante da tenda do encontro[b], e reinou sobre Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foi”; o verbo hebraico pode ser traduzido segundo qualquer um dos dois pontos de vista direcionais.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “de diante da tenda do encontro”, expressão espacial que indica a partida da área do santuário.'
    reason: cultural_note
  - marker: c
    text: Isto é, o lugar alto de culto em Gibeão, onde estava a tenda do encontro.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: chegou
  rationale: O verbo בוא pode indicar vir, chegar, ir ou entrar, conforme o ponto de vista. “Chegou a Jerusalém” expressa naturalmente o destino indicado pelo contexto, sem eliminar a alternativa direcional registrada em nota.
- source_word: לַבָּמָה
  choice: o lugar alto
  rationale: במה designa um lugar elevado de culto. “Lugar alto” é uma tradução tradicional e lexicalmente transparente, sem acrescentar neste contexto uma avaliação negativa.
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: que ficava em Gibeão
  rationale: A oração relativa identifica de modo natural, em português, a localização do lugar alto.
- source_word: יְרוּשָׁלִַם
  choice: a Jerusalém
  rationale: Embora a ordem hebraica seja condensada, o contexto indica Jerusalém como destino do movimento de Salomão depois de sua permanência em Gibeão.
- source_word: מִלִּפְנֵי
  choice: de diante de
  rationale: Preserva a expressão espacial hebraica, que descreve a partida da área diante do santuário; uma nota esclarece seu sentido.
- source_word: אֹהֶל מוֹעֵד
  choice: tenda do encontro
  rationale: Tradução transparente da expressão hebraica, preferível ao termo mais interpretativo “tabernáculo”.
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: Como Salomão já era rei, o verbo descreve a continuidade de seu reinado, não necessariamente sua entronização naquele momento.
- source_word: עַל יִשְׂרָאֵל
  choice: sobre Israel
  rationale: É a construção portuguesa natural para expressar o governo real sobre o povo.
theological_decisions:
- issue: Relação sintática de “Jerusalém” na ordem condensada do hebraico
  choice: Salomão chegou a Jerusalém vindo do lugar alto de Gibeão
  alternative: Salomão foi do lugar alto de Gibeão para Jerusalém
  rationale: O contexto mostra Salomão deixando Gibeão e dirigindo-se a Jerusalém. A formulação escolhida comunica esse movimento sem forçar a ordem hebraica no português e conserva em nota a possível mudança de perspectiva direcional.
- issue: Caracterização do lugar alto associado à tenda do encontro
  choice: lugar alto
  alternative: santuário do lugar alto
  rationale: A tradução mantém o valor lexical de במה e não introduz uma condenação religiosa nem uma interpretação institucional que o versículo não explicita.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase foi ajustada para tornar claro o movimento até Jerusalém, enquanto “de diante da tenda do encontro” conserva a imagem espacial do hebraico e é esclarecida em nota.
