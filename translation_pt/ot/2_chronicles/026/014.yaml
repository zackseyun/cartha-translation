base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/014.yaml
  text: And Uzziah prepared for them[a], for the whole army, shields and spears and helmets and coats of armor and bows and slingstones.
translation:
  language: pt
  text: Uzias providenciou para eles — para todo o exército — escudos, lanças, capacetes, couraças, arcos e pedras de funda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּכֶן
  choice: providenciou
  rationale: O hifil de כון, neste contexto militar, indica fazer com que o equipamento estivesse pronto ou disponível. “Providenciou” expressa o fornecimento sem afirmar que Uzias o fabricou.
- source_word: לָהֶם
  choice: para eles
  rationale: Mantém o pronome hebraico; a expressão seguinte identifica claramente seu referente como o exército.
- source_word: לְכָל הַצָּבָא
  choice: para todo o exército
  rationale: צָבָא designa aqui a força militar, e “todo o exército” é uma formulação natural e fiel ao sentido abrangente.
- source_word: מָגִנִּים
  choice: escudos
  rationale: Equivalente militar comum e direto.
- source_word: רְמָחִים
  choice: lanças
  rationale: Termo corrente e amplamente compreensível para as armas designadas por רֹמַח.
- source_word: כּוֹבָעִים
  choice: capacetes
  rationale: No contexto de armamento, refere-se à proteção da cabeça.
- source_word: שִׁרְיֹנוֹת
  choice: couraças
  rationale: Designa proteção corporal, especialmente do tronco. “Couraças” é preciso, convencional em contexto antigo e não especifica indevidamente que fossem de malha.
- source_word: קְשָׁתוֹת
  choice: arcos
  rationale: Correspondência direta do substantivo plural.
- source_word: אַבְנֵי קְלָעִים
  choice: pedras de funda
  rationale: Reproduz naturalmente a construção hebraica literal “pedras de fundas” e deixa claro que eram projéteis usados com fundas.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Os travessões delimitam a explicação do referente de “eles” sem alterar a relação sintática do hebraico. A enumeração mantém a sequência do texto-fonte.
