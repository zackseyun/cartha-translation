base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/023.yaml
  text: And Uzziah slept with his fathers[a], and they buried him with his fathers in the burial field that belonged to the kings, for they said, “He is a leper.” And Jotham his son reigned in his place.
translation:
  language: pt
  text: 'Uzias descansou com seus antepassados, e o sepultaram junto deles no campo de sepultamento que pertencia aos reis, pois disseram: “Ele tem uma doença de pele”.[a] E seu filho Jotão reinou em seu lugar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele é leproso”. O termo hebraico designa alguém afetado por צָרַעַת, uma categoria que pode ser mais ampla do que a hanseníase moderna.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: descansou com seus antepassados
  rationale: A expressão é uma fórmula régia para a morte. “Descansou” conserva a imagem eufemística hebraica de modo mais natural em português do que “dormiu”, enquanto “antepassados” comunica o sentido dinástico sem sugerir apenas pais imediatos.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: o sepultaram
  rationale: Mantém a forma ativa plural do hebraico e seus agentes não especificados.
- source_word: עִם אֲבֹתָיו
  choice: junto deles
  rationale: Retoma os antepassados mencionados sem repetição pesada e preserva a associação espacial, sem afirmar que foi colocado exatamente no mesmo túmulo.
- source_word: בִּשְׂדֵה הַקְּבוּרָה
  choice: no campo de sepultamento
  rationale: Preserva o sentido concreto de שָׂדֶה, “campo”, e expressa de maneira clara a função funerária do local.
- source_word: אֲשֶׁר לַמְּלָכִים
  choice: que pertencia aos reis
  rationale: Expressa de modo idiomático a relação de posse ou associação indicada pelo lamed, sem definir além do texto se o terreno era propriedade ou área reservada.
- source_word: כִּי אָמְרוּ
  choice: pois disseram
  rationale: Introduz naturalmente a razão dada para o local distinto de sepultamento.
- source_word: מְצוֹרָע
  choice: tem uma doença de pele
  rationale: Evita identificar indevidamente a categoria hebraica צָרַעַת com a hanseníase moderna. A nota registra a alternativa tradicional e a amplitude do termo.
- source_word: וַיִּמְלֹךְ יוֹתָם בְּנוֹ תַּחְתָּיו
  choice: E seu filho Jotão reinou em seu lugar
  rationale: Conserva a fórmula de sucessão dinástica e o sentido de substituição expresso por תַּחְתָּיו.
theological_decisions:
- issue: Relação entre מְצוֹרָע e diagnósticos médicos modernos
  choice: Ele tem uma doença de pele
  alternative: Ele é leproso
  rationale: O termo hebraico designa alguém afetado por צָרַעַת, categoria ritual e corporal que pode ser mais ampla do que a hanseníase. A tradução principal evita uma equivalência clínica inexata, e a nota preserva a formulação tradicional.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação preserva a estrutura do obituário régio, mas evita calques pouco naturais. O marcador [a] aparece imediatamente após a expressão a que se refere.
