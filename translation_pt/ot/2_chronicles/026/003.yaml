base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/003.yaml
  text: Uzziah was sixteen years old when he became king[a], and he reigned fifty-two years in Jerusalem. His mother’s name was Jecoliah[b], from Jerusalem.
translation:
  language: pt
  text: Uzias tinha dezesseis anos quando se tornou rei[a] e reinou cinquenta e dois anos em Jerusalém. O nome de sua mãe era Jecolias[b]; ela era de Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “quando começou a reinar” ou “ao tornar-se rei”.'
    reason: lexical_alternative
  - marker: b
    text: O nome também pode ser transliterado Jequilias.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: tinha dezesseis anos
  rationale: A expressão hebraica idiomática de idade é traduzida naturalmente em português por “tinha dezesseis anos”.
- source_word: בְמָלְכוֹ
  choice: quando se tornou rei
  rationale: A construção com בְּ situa a idade de Uzias no momento de sua ascensão ao trono; esta formulação é clara e corrente em português.
- source_word: וַחֲמִשִּׁים וּשְׁתַּיִם שָׁנָה מָלַךְ
  choice: reinou cinquenta e dois anos
  rationale: Preserva de modo natural a duração do exercício da realeza indicada pelo verbo מָלַךְ e pelo numeral hebraico.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: A preposição locativa e o topônimo têm correspondência direta e natural em português.
- source_word: וְשֵׁם אִמּוֹ
  choice: O nome de sua mãe era
  rationale: Reproduz com clareza e dignidade a fórmula genealógica hebraica.
- source_word: יכיליה
  choice: Jecolias
  rationale: Forma portuguesa tradicional e legível do nome hebraico; a oscilação gráfica do texto hebraico justifica registrar uma variante em nota.
- source_word: מִן יְרוּשָׁלִָם
  choice: ela era de Jerusalém
  rationale: מִן indica procedência ou origem. A explicitação do pronome evita que “de Jerusalém” pareça modificar o nome, e não a pessoa.
