  text: וַ/יִּ֨בֶן עֻזִּיָּ֤הוּ מִגְדָּלִים֙ בִּ/יר֣וּשָׁלִַ֔ם עַל שַׁ֧עַר הַ/פִּנָּ֛ה וְ/עַל שַׁ֥עַר הַ/גַּ֖יְא וְ/עַל הַ/מִּקְצ֑וֹעַ וַֽ/יְחַזְּקֵֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/009.yaml
  text: Uzziah built towers in Jerusalem at the Corner Gate[a], at the Valley Gate, and at the Angle, and he fortified them.
translation:
  language: pt
  text: Uzias construiu torres em Jerusalém, junto à Porta da Esquina, à Porta do Vale e ao Ângulo[a], e as fortificou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à esquina”; o termo hebraico pode indicar um ângulo, uma esquina ou um ponto onde a fortificação muda de direção.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: construiu
  rationale: O verbo בנה significa diretamente construir; “construiu” é natural e adequado ao contexto arquitetônico.
- source_word: עֻזִּיָּהוּ
  choice: Uzias
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: מִגְדָּלִים
  choice: torres
  rationale: O substantivo plural significa “torres”; não se acrescenta “fortificadas”, pois essa ideia aparece no verbo final.
- source_word: בִּירוּשָׁלִַם
  choice: em Jerusalém
  rationale: Reproduz de modo direto e idiomático o uso locativo da preposição ב.
- source_word: עַל
  choice: junto a
  rationale: No contexto das defesas urbanas, indica a localização das torres junto às portas e ao ângulo, sem sugerir necessariamente que estivessem em cima dessas estruturas.
- source_word: שַׁעַר הַפִּנָּה
  choice: Porta da Esquina
  rationale: O sintagma construto nomeia uma porta da cidade; “Porta da Esquina” preserva o sentido de פנה e funciona como nome próprio topográfico.
- source_word: שַׁעַר הַגַּיְא
  choice: Porta do Vale
  rationale: גיא significa “vale”; a formulação é clara e idiomática como nome de uma porta da cidade.
- source_word: הַמִּקְצוֹעַ
  choice: o Ângulo
  rationale: O termo designa um ângulo, esquina ou ponto de mudança de direção numa muralha. “Ângulo” conserva o provável sentido técnico-topográfico e o distingue da Porta da Esquina.
- source_word: וַיְחַזְּקֵם
  choice: e as fortificou
  rationale: No piel, חזק pode significar fortalecer ou fortificar. O contexto militar favorece “fortificou”, e o sufixo masculino plural retoma naturalmente as torres; em português, o pronome assume o gênero feminino de “torres”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com nomes topográficos tratados como nomes próprios. A repetição integral de “junto a” foi suavizada por coordenação (“junto à Porta..., à Porta... e ao Ângulo”), preservando as três localizações. O marcador foi ligado a “Ângulo”, termo ao qual a alternativa lexical se refere.
