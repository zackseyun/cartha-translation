  text: וַ/יַּעַמְד֞וּ עַל עֻזִּיָּ֣הוּ הַ/מֶּ֗לֶךְ וַ/יֹּ֤אמְרוּ ל/וֹ֙ לֹא לְ/ךָ֣ עֻזִּיָּ֗הוּ לְ/הַקְטִיר֙ לַֽ/יהוָ֔ה כִּ֣י לַ/כֹּהֲנִ֧ים בְּנֵי אַהֲרֹ֛ן הַ/מְקֻדָּשִׁ֖ים לְ/הַקְטִ֑יר צֵ֤א מִן הַ/מִּקְדָּשׁ֙ כִּ֣י מָעַ֔לְתָּ וְ/לֹֽא לְ/ךָ֥ לְ/כָב֖וֹד מֵ/יְהוָ֥ה אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/018.yaml
  text: They stood against King Uzziah and said to him[a], “It is not for you, Uzziah, to burn incense to Yahweh, but for the priests, the sons of Aaron, who are consecrated to burn incense. Leave the sanctuary, for you have acted unfaithfully[c][b], and it will not be for your honor from Yahweh God.”
translation:
  language: pt
  text: 'Eles confrontaram[a] o rei Uzias e lhe disseram: “Não cabe a você, Uzias, queimar incenso ao SENHOR, mas aos sacerdotes, os filhos de Arão, que foram consagrados para queimar incenso. Saia do santuário, pois você agiu de modo infiel[b], e isso não lhe trará honra da parte do SENHOR Deus.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “resistiram ao rei Uzias” ou “tomaram posição contra o rei Uzias”.
    reason: lexical_alternative
  - marker: b
    text: Ou “cometeu uma transgressão”. O verbo hebraico pode indicar infidelidade, especialmente em uma questão sagrada ou pactual.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “e não para você para honra da parte do SENHOR Deus”. A expressão hebraica é elíptica e indica que esse ato não resultaria em honra concedida por Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַמְדוּ עַל
  choice: confrontaram
  rationale: A expressão indica que os sacerdotes tomaram posição contra Uzias. “Confrontaram” comunica essa oposição de modo natural, sem sugerir mera proximidade física.
- source_word: עֻזִּיָּהוּ הַמֶּלֶךְ
  choice: o rei Uzias
  rationale: A ordem título-nome é natural em português e preserva integralmente o referente.
- source_word: לֹא לְךָ ... לְהַקְטִיר
  choice: Não cabe a você ... queimar incenso
  rationale: A construção expressa prerrogativa ou competência legítima. “Não cabe a você” mantém essa força sem recorrer a linguagem burocrática.
- source_word: לְהַקְטִיר
  choice: queimar incenso
  rationale: Neste contexto cultual, o hifil de קטר se refere especificamente à queima ou oferta de incenso.
- source_word: לַיהוָה
  choice: ao SENHOR
  rationale: Representa o nome divino YHWH segundo a convenção tradicional em português.
- source_word: כִּי לַכֹּהֲנִים בְּנֵי אַהֲרֹן
  choice: mas aos sacerdotes, os filhos de Arão
  rationale: Preserva a restrição da função aos sacerdotes aarônicos e mantém a designação formal “filhos de Arão”.
- source_word: הַמְקֻדָּשִׁים
  choice: que foram consagrados
  rationale: O particípio passivo descreve os sacerdotes separados para o serviço sagrado; “consagrados” é preciso e adequado ao contexto.
- source_word: צֵא מִן הַמִּקְדָּשׁ
  choice: Saia do santuário
  rationale: Tradução direta e idiomática; “santuário” não restringe indevidamente o termo a uma câmara interior específica.
- source_word: מָעַלְתָּ
  choice: você agiu de modo infiel
  rationale: מעל denota quebra de fidelidade, sobretudo em matéria sagrada ou pactual. A formulação preserva a gravidade religiosa do ato.
- source_word: וְלֹא לְךָ לְכָבוֹד
  choice: e isso não lhe trará honra
  rationale: A expressão hebraica é elíptica. A tradução explicita de modo mínimo o resultado implícito, mantendo em nota a forma mais literal.
- source_word: מֵיְהוָה אֱלֹהִים
  choice: da parte do SENHOR Deus
  rationale: Indica que Deus é a fonte da honra que Uzias não receberá; “da parte de” expressa naturalmente essa origem em português.
theological_decisions:
- issue: Exclusividade sacerdotal na oferta de incenso
  choice: O direito de queimar incenso ao SENHOR pertence aos sacerdotes, filhos de Arão, consagrados para essa tarefa.
  alternative: Entender a fala apenas como uma afirmação geral sobre liderança no culto.
  rationale: O texto trata concretamente da oferta de incenso e reserva essa função aos sacerdotes aarônicos, não apresentando apenas uma distinção abstrata entre realeza e sacerdócio.
- issue: Sentido de מָעַלְתָּ
  choice: Uzias cometeu uma infidelidade grave contra a ordem sagrada.
  alternative: Uzias apenas cometeu um erro de procedimento.
  rationale: Em contexto cultual, o verbo expressa quebra de fidelidade ou transgressão sacrílega, e não uma irregularidade menor.
- issue: Caráter elíptico da cláusula final
  choice: A ação de Uzias não lhe trará honra da parte de Deus.
  alternative: Manter literalmente “e não para você para honra da parte do SENHOR Deus”.
  rationale: A sintaxe hebraica é elíptica. A tradução torna explícita a consequência implícita, enquanto a nota preserva a forma e a ambiguidade do original.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural para leitores brasileiros. Emprega “você” por coerência com a fala direta contemporânea, sem coloquialismo excessivo. Mantém a terminologia cultual “sacerdotes”, “consagrados”, “incenso” e “santuário”, e representa YHWH por “SENHOR”.
