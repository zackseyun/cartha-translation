  text: וַ/יִּ֨בֶן מִגְדָּלִ֜ים בַּ/מִּדְבָּ֗ר וַ/יַּחְצֹב֙ בֹּר֣וֹת רַבִּ֔ים כִּ֤י מִקְנֶה רַּב֙ הָ֣יָה ל֔/וֹ וּ/בַ/שְּׁפֵלָ֖ה וּ/בַ/מִּישׁ֑וֹר אִכָּרִ֣ים וְ/כֹֽרְמִ֗ים בֶּ/הָרִים֙ וּ/בַ/כַּרְמֶ֔ל כִּֽי אֹהֵ֥ב אֲדָמָ֖ה הָיָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/010.yaml
  text: He built towers in the wilderness and cut out many cisterns[a], for he had much livestock; and in the lowland and in the plain he had farmers and vinedressers, in the hills and in the fertile land[c][b], for he loved the soil.
translation:
  language: pt
  text: Construiu torres no deserto[a] e escavou muitas cisternas, pois tinha muitos animais de criação nas terras baixas[b] e na planície; e tinha lavradores e viticultores nas colinas e nas terras férteis[c], pois amava o solo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “torres de vigia”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, na Sefelá, região de colinas baixas ou sopés de Judá.
    reason: cultural_note
  - marker: c
    text: Ou “no Carmelo”, caso a palavra seja entendida como nome de lugar.
    reason: alternative_reading
lexical_decisions:
- source_word: מִגְדָּלִים
  choice: torres
  rationale: Traduz diretamente o substantivo sem especificar uma função de vigilância que o hebraico não explicita; no contexto, podem ser torres de observação.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: Em português bíblico corrente, “deserto” pode designar uma região erma ou pouco povoada, sem necessariamente implicar dunas ou aridez absoluta, e acomoda o uso pastoril indicado pelo contexto.
- source_word: וַיַּחְצֹב
  choice: escavou
  rationale: Expressa a abertura de reservatórios, possivelmente na rocha, com mais naturalidade que “talhou” e mais precisão contextual que o simples “cavou”.
- source_word: בֹּרוֹת
  choice: cisternas
  rationale: O contexto de abastecimento de água para rebanhos favorece reservatórios escavados, não necessariamente poços alimentados por água subterrânea.
- source_word: מִקְנֶה רַב
  choice: muitos rebanhos
  rationale: Comunica naturalmente uma grande quantidade de animais domésticos; embora o hebraico seja coletivo e possa ser vertido por “muito gado”, “rebanhos” evita restringi-lo a bovinos.
- source_word: שְׁפֵלָה
  choice: terras baixas
  rationale: Torna acessível o sentido geográfico da Sefelá, região de colinas baixas ou sopés de Judá, sem exigir transliteração no texto principal.
- source_word: מִישׁוֹר
  choice: planície
  rationale: Representa de modo claro o terreno plano, preservando o contraste geográfico sem decidir entre planície e planalto.
- source_word: אִכָּרִים
  choice: lavradores
  rationale: Designa trabalhadores que cultivam a terra e combina com a referência final ao solo; é atual, digno e mais específico que “agricultores” neste contexto.
- source_word: כֹרְמִים
  choice: viticultores
  rationale: Designa com precisão os cultivadores de vinhas em português moderno.
- source_word: בֶּהָרִים
  choice: nas colinas
  rationale: Embora o termo possa significar montanhas, “colinas” se ajusta naturalmente ao cenário agrícola sem exagerar a altitude.
- source_word: בַּכַּרְמֶל
  choice: nas terras férteis
  rationale: Toma כַּרְמֶל como substantivo comum referente a terra fértil ou cultivável, leitura favorecida pelo paralelismo agrícola; a possibilidade de nome próprio é preservada em nota.
- source_word: אֹהֵב אֲדָמָה
  choice: amava o solo
  rationale: Preserva a imagem concreta e incomum do hebraico, sem reduzir a expressão à paráfrase interpretativa “gostava de agricultura”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe foi dividida em duas frases para evitar uma sequência excessivamente longa. “Deserto” é empregado no sentido amplo de região erma; “solo” preserva a concretude agrícola da conclusão hebraica. Todos os marcadores de nota aparecem no texto principal em ordem alfabética.
