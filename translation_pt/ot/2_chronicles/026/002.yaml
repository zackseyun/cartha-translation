base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/002.yaml
  text: He built Eloth and restored it to Judah after the king slept with his fathers[a][b].
translation:
  language: pt
  text: Ele construiu Elote e a restituiu a Judá[a], depois que o rei descansou com seus antepassados[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a trouxe de volta para Judá”.'
    reason: lexical_alternative
  - marker: b
    text: “Descansou com seus antepassados” é uma expressão idiomática hebraica que significa que ele morreu.
    reason: cultural_note
lexical_decisions:
- source_word: בָּנָה
  choice: construiu
  rationale: É o sentido direto e comum do verbo. Embora o contexto possa sugerir reconstrução, essa nuance não está expressa no verbo.
- source_word: אֵילוֹת
  choice: Elote
  rationale: Transliteração portuguesa tradicional e reconhecível do topônimo hebraico, sem substituí-lo pela forma moderna Eilat.
- source_word: וַיְשִׁיבֶהָ
  choice: a restituiu
  rationale: O hifil de שוב, com sufixo feminino referente a Elote, indica fazê-la voltar ao domínio de Judá. “Restituiu” comunica essa recuperação política sem acrescentar detalhes.
- source_word: לִיהוּדָה
  choice: a Judá
  rationale: A preposição ל marca o destino ou beneficiário da restituição; “a Judá” preserva esse valor direcional.
- source_word: אַחֲרֵי שְׁכַב
  choice: depois que ... descansou
  rationale: A expressão pertence à fórmula régia de morte. “Descansou” preserva o eufemismo hebraico e soa mais natural e digno em português do que “dormiu” neste contexto.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Mantém a formulação hebraica sem inserir o nome Amazias, embora ele seja o referente contextual.
- source_word: עִם אֲבֹתָיו
  choice: com seus antepassados
  rationale: Expressa naturalmente em português o sentido ancestral de אָבוֹת na fórmula de morte, evitando que “pais” seja entendido apenas como os genitores imediatos.
