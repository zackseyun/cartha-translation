  text: כֹּ֠ל מִסְפַּ֞ר רָאשֵׁ֤י הָ/אָבוֹת֙ לְ/גִבּ֣וֹרֵי חָ֔יִל אַלְפַּ֖יִם וְ/שֵׁ֥שׁ מֵאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/012.yaml
  text: The total number of the heads of the fathers’ houses, for the mighty men of valor, was two thousand six hundred.
translation:
  language: pt
  text: O número total dos chefes das famílias dos guerreiros valentes era de dois mil e seiscentos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאשֵׁי הָאָבוֹת
  choice: chefes das famílias
  rationale: A expressão designa os líderes de grupos familiares ou casas paternas. Em português atual, “chefes das famílias” comunica naturalmente a função sem o literalismo pouco claro de “chefes dos pais”.
- source_word: לְגִבּוֹרֵי חָיִל
  choice: dos guerreiros valentes
  rationale: Neste contexto militar, גִּבּוֹרֵי חַיִל se refere a homens de reconhecida capacidade e bravura em combate. A preposição לְ liga os chefes ao corpo de guerreiros que comandavam ou representavam; “dos” mantém essa relação de modo conciso, sem defini-la além do necessário.
- source_word: אַלְפַּיִם וְשֵׁשׁ מֵאוֹת
  choice: dois mil e seiscentos
  rationale: Reprodução direta e idiomática do total numérico hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com terminologia militar natural. A formulação evita tanto o arcaísmo “casas paternas” quanto uma explicitação não exigida pelo hebraico, como “comandantes de”.
