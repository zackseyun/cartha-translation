source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה אֲמַצְיָ֥הוּ אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/004.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that Amaziah his father had done.
translation:
  language: pt
  text: Ele fez o que era correto aos olhos de Yahweh[a], conforme tudo o que seu pai Amazias havia feito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à vista do SENHOR”.'
    reason: Alternativa lexical e tradicional para a expressão בְּעֵינֵי יְהוָה.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ele fez
  rationale: O wayyiqtol de עשה introduz a ação narrativa. Em português corrente, a conjunção inicial pode ser omitida sem perda de sentido.
- source_word: הַיָּשָׁר
  choice: o que era correto
  rationale: Com עשה, o adjetivo יָשָׁר forma a expressão idiomática 'fazer o que é correto'. A formulação conserva a avaliação moral e soa natural em português.
- source_word: בְּעֵינֵי
  choice: aos olhos de
  rationale: Preserva a metáfora hebraica que indica avaliação segundo a perspectiva de alguém e é uma expressão natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כְּכֹל אֲשֶׁר
  choice: conforme tudo o que
  rationale: Expressa correspondência com o padrão anterior e mantém a força abrangente de כֹל.
- source_word: עָשָׂה
  choice: havia feito
  rationale: O mais-que-perfeito composto esclarece naturalmente em português que as ações de Amazias precederam as do rei em foco.
- source_word: אֲמַצְיָהוּ
  choice: Amazias
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: אָבִיו
  choice: seu pai
  rationale: Embora אָב possa designar um antepassado, o contexto histórico identifica Amazias como o pai imediato de Uzias.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o Tetragrama. A transliteração preserva o nome pessoal divino, enquanto a alternativa tradicional o representa por um título.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada para maior naturalidade, sem perder a correspondência com o hebraico.
