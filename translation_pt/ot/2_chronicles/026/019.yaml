revisions:
- from: Então Uzias ficou furioso. Ele tinha na mão um incensário para queimar incenso; e, enquanto se enfurecia contra os sacerdotes, uma doença de pele[a] irrompeu em sua testa, diante dos sacerdotes, na casa de Yahweh, junto ao altar do incenso.
  to: Então Uzias se enfureceu, com um incensário na mão para queimar incenso; e, em sua fúria contra os sacerdotes, a doença de pele[a] irrompeu em sua testa, diante dos sacerdotes, na casa de Yahweh, junto ao altar do incenso.
  rationale: A revisão conserva todas as decisões lexicais essenciais do rascunho, mas reintegra o incensário à circunstância da ação principal, evita a repetição estilisticamente pesada de «se enfurecia» e torna definido «a doença de pele», em correspondência com o artigo hebraico. «Junto ao altar do incenso» preserva prudentemente a relação espacial comprimida de מֵעַל לְמִזְבַּח הַקְּטֹרֶת.
  reviewer_model: gpt-5.6-terra
