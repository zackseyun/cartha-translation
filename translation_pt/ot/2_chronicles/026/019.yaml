  text: וַ/יִּזְעַף֙ עֻזִּיָּ֔הוּ וּ/בְ/יָד֥/וֹ מִקְטֶ֖רֶת לְ/הַקְטִ֑יר וּ/בְ/זַעְפּ֣/וֹ עִם הַ/כֹּהֲנִ֗ים וְ֠/הַ/צָּרַעַת זָרְחָ֨ה בְ/מִצְח֜/וֹ לִ/פְנֵ֤י הַ/כֹּֽהֲנִים֙ בְּ/בֵ֣ית יְהוָ֔ה מֵ/עַ֖ל לְ/מִזְבַּ֥ח הַ/קְּטֹֽרֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/019.yaml
  text: Then Uzziah became angry[a], with a censer in his hand to burn incense; and while he was angry with the priests, leprosy broke out on his forehead before the priests in the house of Yahweh, beside the altar of incense.
translation:
  language: pt
  text: Então Uzias se enfureceu, com um incensário na mão para queimar incenso; e, em sua fúria contra os sacerdotes, a doença de pele[a] irrompeu em sua testa, diante dos sacerdotes, na casa de Yahweh, junto ao altar do incenso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “lepra”. O termo hebraico צָרַעַת pode designar de forma mais ampla uma doença grave ou uma condição impura da pele, não necessariamente a hanseníase moderna.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְעַף
  choice: ficou furioso
  rationale: O verbo expressa ira ou indignação; a formulação comunica de modo natural o início e a intensidade da reação de Uzias no contexto.
- source_word: מִקְטֶרֶת
  choice: incensário
  rationale: Designa o recipiente usado para queimar ou oferecer incenso no contexto ritual.
- source_word: לְהַקְטִיר
  choice: para queimar incenso
  rationale: O infinitivo indica a finalidade para a qual Uzias segurava o incensário.
- source_word: וּבְזַעְפּוֹ עִם הַכֹּהֲנִים
  choice: enquanto se enfurecia contra os sacerdotes
  rationale: Preserva o valor circunstancial e temporal da expressão, bem como o sentido hostil de sua ira dirigida aos sacerdotes.
- source_word: הַצָּרַעַת
  choice: uma doença de pele
  rationale: צָרַעַת abrange uma condição cutânea grave e ritualmente impura, sem corresponder necessariamente à hanseníase moderna.
- source_word: זָרְחָה
  choice: irrompeu
  rationale: Embora o verbo signifique literalmente algo como 'brilhou' ou 'surgiu', aqui descreve o aparecimento súbito e visível da afecção.
- source_word: בְמִצְחוֹ
  choice: em sua testa
  rationale: Tradução anatômica direta e idiomática em português.
- source_word: לִפְנֵי הַכֹּהֲנִים
  choice: diante dos sacerdotes
  rationale: Indica que a manifestação ocorreu na presença e à vista dos sacerdotes.
- source_word: בְּבֵית יְהוָה
  choice: na casa de Yahweh
  rationale: Preserva a expressão hebraica 'casa' para o templo e translitera o nome divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מֵעַל לְמִזְבַּח הַקְּטֹרֶת
  choice: junto ao altar do incenso
  rationale: A combinação preposicional é compacta e situa Uzias nas proximidades do altar; 'junto a' preserva esse sentido espacial sem impor precisão excessiva.
theological_decisions:
- issue: Sentido de צָרַעַת
  choice: uma doença de pele
  alternative: lepra
  rationale: A expressão evita identificar anacronicamente a condição com a hanseníase moderna, mas a nota conserva a tradução tradicional e a amplitude possível do termo.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: A transliteração preserva no texto o nome pessoal divino presente no hebraico.
- issue: Localização expressa por מֵעַל לְמִזְבַּח
  choice: junto ao altar do incenso
  alternative: acima do altar do incenso
  rationale: No contexto, a expressão indica proximidade espacial; uma tradução estritamente vertical seria pouco natural e provavelmente enganosa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A divisão inicial em duas frases evita uma ligação sintática pesada e mantém clara a progressão narrativa.
