  text: וְ/יֶ֨תֶר֙ דִּבְרֵ֣י עֻזִּיָּ֔הוּ הָ/רִאשֹׁנִ֖ים וְ/הָ/אֲחֲרֹנִ֑ים כָּתַ֛ב יְשַֽׁעְיָ֥הוּ בֶן אָמ֖וֹץ הַ/נָּבִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/022.yaml
  text: The rest of the acts of Uzziah[a], first and last, Isaiah son of Amoz the prophet wrote.
translation:
  language: pt
  text: O restante dos atos de Uzias[a], dos primeiros aos últimos, foi escrito pelo profeta Isaías, filho de Amoz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “as palavras de Uzias, as primeiras e as últimas”. Aqui, “palavras” é uma expressão hebraica própria de registros históricos e se refere aos acontecimentos ou atos de seu reinado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר
  choice: O restante de
  rationale: יֶתֶר indica aquilo que resta. A formulação portuguesa transmite naturalmente a fórmula conclusiva do cronista; o וְ inicial não exige um marcador temporal como “Ora”.
- source_word: דִּבְרֵי
  choice: os atos de
  rationale: Embora o sentido lexical básico seja “palavras”, nesta fórmula analística régia o termo abrange feitos e acontecimentos do reinado. “Atos” comunica esse uso historiográfico.
- source_word: עֻזִּיָּהוּ
  choice: Uzias
  rationale: Forma portuguesa tradicional e correspondente ao nome hebraico presente neste versículo; “Azarias” é uma designação variante usada em outros textos.
- source_word: הָרִאשֹׁנִים וְהָאֲחֲרֹנִים
  choice: dos primeiros aos últimos
  rationale: Preserva os dois adjetivos substantivados e comunica em português a abrangência temporal de todo o reinado.
- source_word: כָּתַב
  choice: foi escrito por
  rationale: O verbo significa “escreveu”. A voz passiva produz uma ordem natural em português sem alterar a atribuição autoral expressa no hebraico.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: pelo profeta Isaías, filho de Amoz
  rationale: Mantém o nome, o patronímico e o título definido, com ordem idiomática e inequívoca em português.
theological_decisions:
- issue: Natureza de דִּבְרֵי na fórmula analística régia
  choice: atos
  alternative: palavras; assuntos
  rationale: O contexto apresenta o registro dos acontecimentos do reinado, não apenas palavras proferidas por Uzias. A nota conserva a forma mais literal e torna transparente a decisão interpretativa.
- issue: Agência de Isaías na escrita
  choice: foi escrito pelo profeta Isaías
  alternative: o profeta Isaías escreveu
  rationale: A voz passiva é apenas uma reorganização sintática natural em português e preserva claramente Isaías como autor do registro, sem definir a natureza ou extensão da obra além do que o texto afirma.
- issue: Alcance de הָרִאשֹׁנִים וְהָאֲחֲרֹנִים
  choice: dos primeiros aos últimos
  alternative: os primeiros e os últimos
  rationale: A formulação exprime o conjunto dos atos ao longo do reinado sem restringir a referência a apenas dois grupos isolados.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase foi ajustada para evitar uma construção excessivamente hebraizante, mantendo todos os elementos informativos e a ambiguidade lexical relevante em nota.
