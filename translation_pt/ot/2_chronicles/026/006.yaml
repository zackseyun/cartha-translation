base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/006.yaml
  text: He went out and fought against the Philistines[a], and he broke down the wall of Gath, the wall of Jabneh, and the wall of Ashdod[b]; and he built cities in the territory of Ashdod and among the Philistines.
translation:
  language: pt
  text: Ele saiu e lutou contra os filisteus, e abriu brechas na muralha de Gate, na muralha de Jabne e na muralha de Asdode; construiu cidades na região de Asdode[a] e entre os filisteus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “em Asdode”; o nome pode indicar a cidade ou a região ao seu redor.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Ele saiu
  rationale: Preserva o sentido básico de יצא e a sequência narrativa, sem acrescentar a ideia específica de marchar.
- source_word: וַיִּלָּחֶם בַּפְּלִשְׁתִּים
  choice: para lutar contra os filisteus
  rationale: A construção portuguesa liga naturalmente a saída à ação militar; 'contra' explicita a relação hostil indicada pelo contexto.
- source_word: וַיִּפְרֹץ אֶת חוֹמַת
  choice: abriu brechas na muralha de
  rationale: Com uma muralha como objeto, פרץ descreve o ato militar de romper ou abrir brechas. Esta opção preserva a imagem sem exigir que toda a muralha tenha sido demolida.
- source_word: גַּת / יַבְנֵה / אַשְׁדּוֹד
  choice: Gate / Jabne / Asdode
  rationale: Formas portuguesas claras e reconhecíveis dos três topônimos hebraicos.
- source_word: וַיִּבְנֶה עָרִים
  choice: construiu cidades
  rationale: Traduz diretamente בנה e עָרִים, sem acrescentar a noção não expressa de reconstrução.
- source_word: בְּאַשְׁדּוֹד
  choice: na região de Asdode
  rationale: Evita a impressão improvável de que várias cidades foram construídas dentro da cidade de Asdode, mas assinala em nota que o hebraico também pode ser entendido literalmente como 'em Asdode'.
- source_word: וּבַפְּלִשְׁתִּים
  choice: entre os filisteus
  rationale: Mantém a referência hebraica ao povo, em vez de substituí-la pelo nome territorial 'Filístia'.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com fluidez narrativa. A repetição singular de 'muralha' foi mantida para refletir a estrutura hebraica, e 'abriu brechas' conserva a nuance militar de פרץ sem afirmar mais do que o texto.
