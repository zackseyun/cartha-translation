base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/001.yaml
  text: Then all the people of Judah took Uzziah[a], who was sixteen years old[b], and made him king in place of his father Amaziah.
translation:
  language: pt
  text: Então todo o povo de Judá tomou Uzias[a], que tinha dezesseis anos, e o constituiu rei no lugar de seu pai, Amazias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: escolheu Uzias. O verbo hebraico significa literalmente «tomou», mas, neste contexto, refere-se à ação do povo ao elevá-lo ao trono.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: tomou
  rationale: Preserva o sentido básico de לקח, «tomar», e mantém a formulação concreta do hebraico. No contexto, a ação inclui escolher ou receber Uzias para elevá-lo ao trono.
- source_word: כָּל עַם יְהוּדָה
  choice: todo o povo de Judá
  rationale: Reproduz o sentido coletivo e explícito de עַם, em vez da forma abreviada «todo Judá».
- source_word: עֻזִּיָּהוּ
  choice: Uzias
  rationale: É a forma portuguesa tradicional e reconhecível do nome que aparece neste versículo; não se substitui pela forma alternativa Azarias encontrada em passagens relacionadas.
- source_word: וְהוּא בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: que tinha dezesseis anos
  rationale: Expressa em português natural a construção hebraica literal «e ele era filho de dezesseis anos». O relativo «que» mantém a observação circunstancial sem impor um valor concessivo como «embora».
- source_word: וַיַּמְלִיכוּ אֹתוֹ
  choice: e o constituiu rei
  rationale: Comunica o hifil de מלך, isto é, fazer alguém rei. «Constituiu rei» é claro e digno, sem acrescentar uma cerimônia de coroação não mencionada.
- source_word: תַּחַת אָבִיו אֲמַצְיָהוּ
  choice: no lugar de seu pai, Amazias
  rationale: Em contexto de sucessão, תַּחַת indica substituição. A vírgula identifica naturalmente Amazias como o pai de Uzias.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A ordem da frase acompanha de perto o hebraico, mas a expressão da idade foi naturalizada. Evitou-se «embora», pois a conjunção hebraica não exige sentido concessivo.
