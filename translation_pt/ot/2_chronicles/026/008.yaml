base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/008.yaml
  text: The Ammonites gave tribute to Uzziah[a], and his fame spread as far as the entrance of Egypt[b], for he had become exceedingly strong.
translation:
  language: pt
  text: Os amonitas deram tributo a Uzias, e sua fama se espalhou[a] até a entrada do Egito[b], pois ele se tornou extremamente poderoso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “seu nome foi”. Em hebraico, “nome” pode significar reputação ou fama.
    reason: lexical_alternative
  - marker: b
    text: “A entrada do Egito” pode designar o caminho de acesso ao Egito ou sua região fronteiriça.
    reason: cultural_note
lexical_decisions:
- source_word: הָעַמּוֹנִים
  choice: os amonitas
  rationale: Designação étnica convencional e clara em português para o povo de Amom.
- source_word: מִנְחָה
  choice: tributo
  rationale: No contexto político de um povo estrangeiro entregando algo a um rei, o termo indica tributo, não uma oferta cultual nem um simples presente.
- source_word: וַיֵּלֶךְ שְׁמוֹ
  choice: a fama dele se espalhou
  rationale: A expressão hebraica diz literalmente que o seu “nome foi”, usando “nome” no sentido de reputação; esta formulação comunica o sentido de maneira natural.
- source_word: עַד לְבוֹא מִצְרַיִם
  choice: até a entrada do Egito
  rationale: Preserva a imagem espacial do hebraico e sua possível referência à região de acesso ou fronteira do Egito, sem reduzir a expressão simplesmente a “até o Egito”.
- source_word: הֶחֱזִיק
  choice: se tornou poderoso
  rationale: O hifil de חזק expressa aqui que Uzias se tornou ou se mostrou forte; “poderoso” se ajusta naturalmente à força política e militar descrita.
- source_word: עַד לְמַעְלָה
  choice: extremamente
  rationale: O idiomatismo intensifica o grau da força alcançada, e “extremamente” transmite essa ênfase em português corrente.
