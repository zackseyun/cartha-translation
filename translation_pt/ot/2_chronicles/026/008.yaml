translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem e a relação causal do hebraico foram preservadas, enquanto o idiomatismo sobre o “nome” foi expresso naturalmente no texto e esclarecido em nota.
