  text: וַ/יְהִ֣י לְ/עֻזִּיָּ֡הוּ חַיִל֩ עֹשֵׂ֨ה מִלְחָמָ֜ה יוֹצְאֵ֧י צָבָ֣א לִ/גְד֗וּד בְּ/מִסְפַּר֙ פְּקֻדָּתָ֔/ם בְּ/יַד֙ יעואל הַ/סּוֹפֵ֔ר וּ/מַעֲשֵׂיָ֖הוּ הַ/שּׁוֹטֵ֑ר עַ֚ל יַד חֲנַנְיָ֔הוּ מִ/שָּׂרֵ֖י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/011.yaml
  text: And Uzziah had an army fit for war[a], going out to battle by divisions, according to the number of their enrollment, under the direction of Jeiel the scribe and Maaseiah the officer, under the authority of Hananiah[b], one of the king’s commanders.
translation:
  language: pt
  text: Uzias tinha um exército preparado para a guerra, cujos homens saíam para o serviço militar, em divisões, conforme o número do seu recenseamento[a], sob a direção de Jeiel[b], o escriba, e de Maaseias, o oficial, sob a autoridade de Hananias, um dos comandantes do rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “conforme o número do seu alistamento oficial”. O termo hebraico se refere à contagem, ao recenseamento ou ao alistamento oficial das tropas.
    reason: lexical_alternative
  - marker: b
    text: O nome aparece como “יעואל” no texto hebraico deste versículo e também pode ser transliterado como “Jeuel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיִל
  choice: exército
  rationale: No contexto militar, o termo designa uma força armada, não riqueza nem valor abstrato.
- source_word: עֹשֵׂה מִלְחָמָה
  choice: preparado para a guerra
  rationale: Expressa de modo natural a capacidade do exército para guerrear, sem reproduzir de forma rígida o particípio hebraico.
- source_word: יוֹצְאֵי צָבָא
  choice: saía para o combate
  rationale: A expressão descreve a saída para serviço ou campanha militar; a formulação escolhida é clara e adequada ao contexto.
- source_word: לִגְדוּד
  choice: organizado em divisões
  rationale: Aqui גְּדוּד indica unidades militares organizadas, e não necessariamente bandos de saqueadores.
- source_word: בְּמִסְפַּר פְּקֻדָּתָם
  choice: de acordo com o número dos alistados
  rationale: Mantém tanto a ideia de contagem quanto a de registro oficial das tropas em português corrente.
- source_word: בְּיַד
  choice: sob a direção de
  rationale: O idiomatismo hebraico indica responsabilidade administrativa ou supervisão.
- source_word: הַסּוֹפֵר
  choice: o escriba
  rationale: É a designação tradicional e transparente de um oficial responsável por registros e tarefas administrativas.
- source_word: הַשּׁוֹטֵר
  choice: o oficial
  rationale: O termo designa um funcionário com responsabilidades administrativas ou militares; 'oficial' se ajusta ao contexto.
- source_word: עַל יַד
  choice: sob a autoridade de
  rationale: A expressão indica um nível superior de supervisão na hierarquia apresentada pelo versículo.
- source_word: מִשָּׂרֵי הַמֶּלֶךְ
  choice: um dos comandantes do rei
  rationale: Embora שַׂר possa significar príncipe, chefe ou oficial, o contexto militar favorece 'comandante'.
- source_word: יעואל
  choice: Jeiel
  rationale: Mantém a forma tradicional portuguesa, enquanto a grafia consonantal do texto hebraico é indicada em nota.
