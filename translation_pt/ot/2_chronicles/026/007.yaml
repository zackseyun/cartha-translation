base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/007.yaml
  text: God helped him against the Philistines[a], against the Arabians who lived in Gur-baal, and against the Meunites.
translation:
  language: pt
  text: Deus o ajudou contra os filisteus, contra os árabes que moravam em Gur-Baal e contra os meunitas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “maonitas”. O gentílico hebraico talvez designe um grupo relacionado ou preserve uma variante do nome.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעְזְרֵהוּ
  choice: o ajudou
  rationale: O verbo עזר, na forma narrativa e com sufixo de terceira pessoa masculina singular, significa que Deus ajudou Uzias; a formulação é direta e natural em português.
- source_word: הָאֱלֹהִים
  choice: Deus
  rationale: Embora o substantivo tenha artigo em hebraico, aqui é a designação habitual do Deus de Israel e se traduz naturalmente como “Deus”.
- source_word: עַל
  choice: contra
  rationale: Com o verbo “ajudar” em contexto militar, a preposição indica os povos adversários contra os quais Deus auxiliou Uzias.
- source_word: פְּלִשְׁתִּים
  choice: os filisteus
  rationale: É a designação tradicional, clara e amplamente reconhecida desse povo em português.
- source_word: הערביים
  choice: os árabes
  rationale: O gentílico hebraico designa povos árabes; “árabes” é a forma moderna, natural e historicamente adequada em português, sem exigir uma forma arcaizante.
- source_word: הַיֹּשְׁבִים
  choice: que moravam
  rationale: O particípio de ישב expressa residência; “que moravam” comunica com clareza uma situação habitual no contexto narrativo.
- source_word: בְּגוּר בָּעַל
  choice: em Gur-Baal
  rationale: Trata-se de um topônimo, mantido por transliteração; a preposição ב indica localização ou residência.
- source_word: הַמְּעוּנִים
  choice: os meunitas
  rationale: A transliteração “meunitas” acompanha a forma consonantal מעונים e evita identificar com certeza um grupo cuja relação com Maom é discutida.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe direta. “Moravam” foi preferido a “habitavam” por naturalidade, e os nomes históricos foram vertidos pelas formas correntes em português. O marcador da nota foi colocado após “meunitas”, termo ao qual a variante textual se refere.
