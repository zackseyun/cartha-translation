base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/021.yaml
  text: And King Uzziah was leprous until the day of his death[a], and he lived in a separate house, leprous, because he was cut off from the house of Yahweh. And Jotham his son was over the king’s house[b], judging the people of the land.
translation:
  language: pt
  text: O rei Uzias permaneceu leproso[a] até o dia de sua morte. E, leproso, morava numa casa separada[b], pois tinha sido excluído da casa de Yahweh. Seu filho Jotão ficou encarregado do palácio real e julgava o povo da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico tradicionalmente traduzido por “lepra” abrange diversas afecções da pele e não corresponde necessariamente à hanseníase moderna.
    reason: lexical_clarification
  - marker: b
    text: 'Hebraico: “casa da liberdade”. A expressão é incerta e provavelmente indica uma residência separada, onde Uzias vivia isolado por causa de sua condição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְצֹרָע
  choice: leproso
  rationale: Mantém o termo bíblico tradicional e reconhecível, sem afirmar que a צָרַעַת corresponda exatamente à hanseníase moderna; a nota esclarece a amplitude do termo hebraico.
- source_word: בֵּית הַחפשות
  choice: uma casa separada
  rationale: A expressão hebraica é difícil. No contexto, indica uma residência à parte, onde Uzias vivia afastado da vida real e cultual; esta tradução comunica esse sentido sem tornar definitivo um significado incerto.
- source_word: נִגְזַר מִבֵּית יְהוָה
  choice: tinha sido excluído da casa de Yahweh
  rationale: 'Expressa a separação severa indicada por נִגְזַר e sua consequência concreta: Uzias não podia ter acesso ao templo.'
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Preserva a formulação hebraica, embora a referência contextual seja ao templo, e traduz diretamente o nome divino.
- source_word: עַל בֵּית הַמֶּלֶךְ
  choice: ficou encarregado do palácio real
  rationale: Comunica em português natural a responsabilidade administrativa de Jotão sobre a casa ou instituição real, sem sugerir apenas uma posição física.
- source_word: שׁוֹפֵט אֶת עַם הָאָרֶץ
  choice: julgava o povo da terra
  rationale: Mantém a conexão lexical com o ato de julgar, permitindo também o sentido mais amplo de exercer governo.
- source_word: עַם הָאָרֶץ
  choice: o povo da terra
  rationale: Conserva a expressão hebraica sem restringi-la indevidamente a uma classe social específica.
- source_word: וַיְהִי ... וַיֵּשֶׁב
  choice: permaneceu ... morava
  rationale: Produz uma sequência narrativa natural em português e deixa claro que tanto a condição quanto a residência separada perduraram.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” representa o nome da aliança sem substituí-lo por um título.
- issue: Natureza da condição designada por צָרַעַת
  choice: leproso, com esclarecimento em nota
  alternative: acometido por uma doença de pele
  rationale: “Leproso” preserva a linguagem bíblica tradicional, mas a nota evita equiparar sem ressalvas a condição ritual e cutânea bíblica à hanseníase clínica moderna.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe evita arcaísmos, preservando as expressões relevantes “casa de Yahweh” e “povo da terra”. Os marcadores foram colocados junto aos termos que efetivamente explicam.
