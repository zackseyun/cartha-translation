source:
  edition: WLC
  text: וּ/כְ/חֶזְקָת֗/וֹ גָּבַ֤הּ לִבּ/וֹ֙ עַד לְ/הַשְׁחִ֔ית וַ/יִּמְעַ֖ל בַּ/יהוָ֣ה אֱלֹהָ֑י/ו וַ/יָּבֹא֙ אֶל הֵיכַ֣ל יְהוָ֔ה לְ/הַקְטִ֖יר עַל מִזְבַּ֥ח הַ/קְּטֹֽרֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/016.yaml
  text: But when he became strong, his heart was lifted up to his destruction, and he acted unfaithfully against Yahweh his God and entered the temple of Yahweh to burn incense on the altar of incense.
translation:
  language: pt
  text: Mas, quando se tornou forte, seu coração se exaltou, para sua própria ruína, e ele foi infiel a Yahweh, seu Deus. Entrou no templo de Yahweh para queimar incenso sobre o altar do incenso.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּכְחֶזְקָתוֹ
  choice: Mas, quando se tornou forte
  rationale: A construção com כְּ tem valor temporal, e a conjunção introduz o contraste com o êxito anterior. “Tornou-se forte” preserva de perto a formulação hebraica e permanece natural em português.
- source_word: גָּבַהּ לִבּוֹ
  choice: seu coração se exaltou
  rationale: Mantém a imagem hebraica do coração que se eleva, comunicando orgulho sem substituir a metáfora por uma explicação.
- source_word: עַד לְהַשְׁחִית
  choice: para sua própria ruína
  rationale: Expressa o resultado destrutivo da exaltação. O pronome reflexivo explicita naturalmente em português que a ruína recaiu sobre ele, sem definir se o infinitivo também poderia sugerir corrupção moral.
- source_word: וַיִּמְעַל
  choice: ele foi infiel
  rationale: מעל descreve quebra de fidelidade, especialmente diante de Deus. “Foi infiel” é claro, digno e preserva a dimensão relacional e pactual do verbo.
- source_word: בַּיהוָה אֱלֹהָיו
  choice: a Yahweh, seu Deus
  rationale: Com מעל, a preposição marca aquele contra quem se comete a infidelidade. Em português, “ser infiel a” é a regência natural.
- source_word: הֵיכַל יְהוָה
  choice: templo de Yahweh
  rationale: Neste contexto, הֵיכָל designa o edifício sagrado; “templo” é a expressão corrente e precisa.
- source_word: לְהַקְטִיר
  choice: para queimar incenso
  rationale: No contexto cultual, o hifil de קטר indica fazer subir fumaça aromática, isto é, queimar ou oferecer incenso. A escolha é direta e combina com a menção ao altar.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: altar do incenso
  rationale: Reproduz claramente a construção hebraica que identifica o altar destinado ao incenso.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o nome próprio יהוה. “Yahweh” o representa como nome pactual, em vez de substituí-lo por um título.
- issue: Natureza da transgressão indicada por מעל
  choice: foi infiel a Yahweh
  alternative: pecou contra Yahweh; cometeu sacrilégio contra Yahweh
  rationale: A tradução mantém a noção abrangente de quebra de fidelidade sem reduzir o verbo somente ao ato cultual narrado em seguida nem importar uma categoria teológica mais específica.
- issue: Sentido de עַד לְהַשְׁחִית
  choice: 'resultado: para sua própria ruína'
  alternative: até se corromper; a ponto de agir corruptamente
  rationale: No fluxo narrativo, a frase aponta naturalmente para a consequência desastrosa do orgulho. A tradução evita especificar além do necessário a forma exata dessa ruína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A metáfora hebraica do coração exaltado foi preservada; a segunda oração foi separada em nova frase para evitar encadeamento excessivo sem alterar a sequência narrativa.
