  text: וַ/יָּבֹ֥א אַחֲרָ֖י/ו עֲזַרְיָ֣הוּ הַ/כֹּהֵ֑ן וְ/עִמּ֞/וֹ כֹּהֲנִ֧ים לַ/יהוָ֛ה שְׁמוֹנִ֖ים בְּנֵי חָֽיִל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/017.yaml
  text: Azariah the priest went in after him[a], and with him were eighty priests of Yahweh, valiant men.
translation:
  language: pt
  text: Azarias, o sacerdote, entrou atrás dele, acompanhado de oitenta sacerdotes de Yahweh, homens valentes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “homens de valor”. A expressão hebraica pode designar homens marcados por força, coragem ou valentia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אַחֲרָיו
  choice: entrou atrás dele
  rationale: בוא pode significar vir, ir ou entrar; no contexto, Azarias segue o rei para dentro da área sagrada. “Entrou atrás dele” expressa de modo natural tanto o movimento quanto a ideia de seguimento indicada por אַחֲרָיו.
- source_word: עֲזַרְיָהוּ הַכֹּהֵן
  choice: Azarias, o sacerdote
  rationale: O nome é vertido na forma portuguesa tradicional e o título definido é preservado de maneira direta.
- source_word: וְעִמּוֹ
  choice: acompanhado de
  rationale: A expressão hebraica indica que os demais sacerdotes estavam com Azarias. Esta formulação evita uma construção pesada em português sem acrescentar ação não presente no texto.
- source_word: כֹּהֲנִים לַיהוָה
  choice: sacerdotes de Yahweh
  rationale: 'O לְ marca relação ou serviço: eram sacerdotes ligados ao serviço de YHWH. “Sacerdotes de Yahweh” conserva essa relação e o nome divino.'
- source_word: שְׁמוֹנִים
  choice: oitenta
  rationale: Correspondência direta do numeral cardinal hebraico.
- source_word: בְּנֵי חָיִל
  choice: homens valentes
  rationale: O idioma literalmente formado por “filhos de força/valor” descreve homens caracterizados por força, coragem ou valor. No contexto, destaca a coragem dos sacerdotes que enfrentaram o rei.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém explicitamente o Tetragrama. “Yahweh” representa o nome próprio e evita substituí-lo por um título.
- issue: Expressão masculina בְּנֵי חָיִל
  choice: homens valentes
  alternative: pessoas valentes; homens de valor
  rationale: A expressão é masculina e, no contexto, caracteriza sacerdotes homens. A tradução mantém tanto essa referência quanto a noção de coragem, sem reduzir חַיִל apenas à força física.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Entrou atrás dele” mantém a sequência espacial e narrativa; “acompanhado de” torna natural a frase de acompanhamento. O marcador da nota foi colocado junto a “homens valentes”, expressão à qual a alternativa lexical efetivamente se refere.
