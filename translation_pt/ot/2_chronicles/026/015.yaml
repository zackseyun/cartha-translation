source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ בִּ/ירוּשָׁלִַ֨ם חִשְּׁבֹנ֜וֹת מַחֲשֶׁ֣בֶת חוֹשֵׁ֗ב לִ/הְי֤וֹת עַל הַ/מִּגְדָּלִים֙ וְ/עַל הַ/פִּנּ֔וֹת לִ/ירוֹא֙ בַּֽ/חִצִּ֔ים וּ/בָ/אֲבָנִ֖ים גְּדֹל֑וֹת וַ/יֵּצֵ֤א שְׁמ/וֹ֙ עַד לְ/מֵ֣/רָח֔וֹק כִּֽי הִפְלִ֥יא לְ/הֵעָזֵ֖ר עַ֥ד כִּֽי חָזָֽק׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/015.yaml
  text: In Jerusalem he made devices[a], invented by skillful men, to be on the towers and on the corners, to shoot arrows and large stones. And his fame spread far abroad[c][b], for he was marvelously helped until he became strong.
translation:
  language: pt
  text: Em Jerusalém, ele fez dispositivos[a] projetados por especialistas, para serem colocados nas torres e nos cantos das muralhas, a fim de lançar flechas e grandes pedras. Sua fama chegou a lugares distantes[b], pois ele foi ajudado de maneira extraordinária[c], até se tornar forte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “engenhos” ou “mecanismos”; isto é, dispositivos militares destinados às fortificações.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “seu nome saiu até longe”.
    reason: lexical_alternative
  - marker: c
    text: O texto não identifica expressamente quem o ajudou, embora o contexto sugira auxílio divino.
    reason: alternative_reading
lexical_decisions:
- source_word: חִשְּׁבֹנוֹת
  choice: dispositivos
  rationale: O substantivo designa engenhos ou mecanismos concebidos para uma finalidade. “Dispositivos” é atual e abrangente, sem especificar indevidamente a tecnologia antiga.
- source_word: מַחֲשֶׁבֶת חוֹשֵׁב
  choice: projetados por especialistas
  rationale: A expressão cognata destaca concepção deliberada por alguém hábil em planejar e fabricar. A formulação mantém essa ideia em português natural sem impor singular ou plural ao referente humano.
- source_word: עַל הַמִּגְדָּלִים וְעַל הַפִּנּוֹת
  choice: nas torres e nos cantos das muralhas
  rationale: “Torres” traduz diretamente מגדלים. פנות significa literalmente “cantos”; a explicitação “das muralhas” torna claro o contexto defensivo sem substituí-lo por um termo militar mais específico.
- source_word: לִירוֹא בַּחִצִּים וּבָאֲבָנִים גְּדֹלוֹת
  choice: a fim de lançar flechas e grandes pedras
  rationale: O infinitivo expressa finalidade, e ירה pode descrever o lançamento tanto de flechas como de pedras. “Lançar” funciona naturalmente com ambos os objetos.
- source_word: וַיֵּצֵא שְׁמוֹ עַד לְמֵרָחוֹק
  choice: Sua fama chegou a lugares distantes
  rationale: A tradução comunica em português corrente o sentido idiomático de “seu nome saiu para longe”, isto é, a ampla difusão de sua reputação.
- source_word: הִפְלִיא לְהֵעָזֵר
  choice: ele foi ajudado de maneira extraordinária
  rationale: A construção passiva preserva o agente implícito, enquanto “de maneira extraordinária” transmite a força de פלא sem exigir que o auxílio em si seja chamado de milagre.
- source_word: עַד כִּי חָזָק
  choice: até se tornar forte
  rationale: A expressão indica o ponto ou resultado alcançado mediante a ajuda recebida; “se tornar forte” comunica esse desenvolvimento com clareza.
theological_decisions:
- issue: Agente implícito da ajuda recebida pelo rei
  choice: 'Manter o agente implícito: “ele foi ajudado de maneira extraordinária”'
  alternative: Explicitar Deus ou o SENHOR como aquele que o ajudou
  rationale: Embora o contexto mais amplo sugira auxílio divino, esta oração hebraica não identifica expressamente o agente. A tradução conserva a forma passiva e a tensão do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Evitou-se o termo potencialmente anacrônico “máquinas de guerra”; “cantos das muralhas” conserva a imagem hebraica e esclarece o contexto. Todos os marcadores de notas aparecem no texto principal.
