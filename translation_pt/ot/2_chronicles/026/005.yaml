  text: וַ/יְהִי֙ לִ/דְרֹ֣שׁ אֱלֹהִ֔ים בִּ/ימֵ֣י זְכַרְיָ֔הוּ הַ/מֵּבִ֖ין בִּ/רְאֹ֣ת הָ/אֱלֹהִ֑ים וּ/בִ/ימֵי֙ דָּרְשׁ֣/וֹ אֶת יְהוָ֔ה הִצְלִיח֖/וֹ הָ/אֱלֹהִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/005.yaml
  text: He continued to seek God in the days of Zechariah[a], who had understanding in the visions of God; and as long as he sought Yahweh[b], God made him prosper.
translation:
  language: pt
  text: Ele continuou buscando a Deus nos dias de Zacarias[a], que tinha discernimento em visões de Deus; e, enquanto buscava a Yahweh[b], Deus o fez prosperar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que instruía no temor de Deus”. A expressão hebraica é difícil; o Texto Massorético diz mais literalmente: “que tinha entendimento em visões de Deus”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “e durante os dias em que buscou a Yahweh”.'
    reason: previous_rendering
lexical_decisions:
- source_word: וַיְהִי לִדְרֹשׁ אֱלֹהִים
  choice: Ele continuou buscando a Deus
  rationale: A construção perifrástica com היה e infinitivo indica prática contínua. A formulação comunica naturalmente a perseverança de Uzias em buscar a Deus, sem limitar דרש a pedir informações.
- source_word: בִּימֵי זְכַרְיָהוּ
  choice: nos dias de Zacarias
  rationale: Preserva de modo claro e digno a expressão temporal hebraica.
- source_word: הַמֵּבִין
  choice: que tinha entendimento
  rationale: O particípio de בין expressa entendimento ou discernimento; esta opção evita transformá-lo, sem apoio inequívoco, em alguém que ensinava.
- source_word: בִּרְאֹת הָאֱלֹהִים
  choice: das visões de Deus
  rationale: Segue a vocalização massorética relacionada a ver ou visões e mantém a dificuldade da expressão, em vez de substituí-la silenciosamente pela leitura 'temor de Deus'.
- source_word: וּבִימֵי דָּרְשׁוֹ אֶת־יְהוָה
  choice: e, enquanto ele buscou a Yahweh
  rationale: A expressão designa o período caracterizado pela busca de Yahweh. 'Enquanto' transmite com naturalidade a duração e a relação temporal com a prosperidade, sem tornar explícita uma condição além do texto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: הִצְלִיחוֹ הָאֱלֹהִים
  choice: Deus o fez prosperar
  rationale: 'O hifil de צלח expressa causação: Deus fez com que ele prosperasse ou tivesse êxito.'
theological_decisions:
- issue: Sentido da expressão difícil בִּרְאֹת הָאֱלֹהִים
  choice: Zacarias tinha entendimento das visões de Deus
  alternative: Zacarias instruía no temor de Deus ou tinha entendimento no temor de Deus
  rationale: A vocalização massorética favorece uma expressão ligada a ver ou a visões. A leitura ligada ao temor é conhecida e contextualmente possível, mas não deve substituir no texto principal a evidência massorética; por isso aparece em nota.
- issue: Relação entre buscar Yahweh e prosperar
  choice: 'enunciado temporal e durativo: ''enquanto ele buscou'''
  alternative: 'formulação condicional mais explícita: ''enquanto continuou buscando'' ou ''durante os dias em que buscou'''
  rationale: O hebraico apresenta o período da busca como o período em que Deus o fez prosperar. A tradução conserva essa associação sem desenvolver uma doutrina automática de prosperidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a formulação bíblica 'nos dias de', translitera Yahweh e preserva no texto principal a leitura difícil do Texto Massorético, explicando a alternativa em nota.
