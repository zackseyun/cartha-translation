revisions:
- from: Ele continuou buscando a Deus nos dias de Zacarias[a], que tinha entendimento das visões de Deus; e, enquanto ele buscou a Yahweh[b], Deus o fez prosperar.
  to: Ele continuou buscando a Deus nos dias de Zacarias[a], que tinha discernimento em visões de Deus; e, enquanto buscava a Yahweh[b], Deus o fez prosperar.
  rationale: A revisão limita-se a corrigir o aspecto verbal da segunda ocorrência de “buscar”, para expressar a duração indicada pelo hebraico, e a tornar mais natural a expressão referente às visões, preservando sua ambiguidade e a nota de leitura alternativa. Não há alteração de sentido teológico ou de conteúdo.
