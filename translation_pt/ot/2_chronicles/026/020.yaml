source:
  edition: WLC
  text: וַ/יִּ֣פֶן אֵלָ֡י/ו עֲזַרְיָהוּ֩ כֹהֵ֨ן הָ/רֹ֜אשׁ וְ/כָל הַ/כֹּהֲנִ֗ים וְ/הִנֵּה ה֤וּא מְצֹרָע֙ בְּ/מִצְח֔/וֹ וַ/יַּבְהִל֖וּ/הוּ מִ/שָּׁ֑ם וְ/גַם הוּא֙ נִדְחַ֣ף לָ/צֵ֔את כִּ֥י נִגְּע֖/וֹ יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/020.yaml
  text: Azariah the chief priest turned toward him[a], and all the priests also, and behold, he was leprous on his forehead. So they hurried him out of there, and he himself also hastened to go out[c][b], because Yahweh had struck him.
translation:
  language: pt
  text: Azarias, o sacerdote principal, voltou-se para ele, juntamente com todos os sacerdotes; e eis que ele estava com uma doença de pele[a] na testa. Então, apressaram-se em tirá-lo dali[b], e ele próprio também se apressou a sair[c], porque Yahweh o havia ferido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico é usado nas leis sacerdotais de impureza para uma afecção da pele; não corresponde necessariamente à hanseníase moderna.
    reason: cultural_note
  - marker: b
    text: 'Ou: “eles o expulsaram dali”. O verbo hebraico indica remoção urgente e pode destacar a ação enérgica dos sacerdotes.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “ele próprio também foi impelido a sair”. A forma hebraica pode indicar que ele foi forçado ou impulsionado para fora.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן אֵלָיו
  choice: voltou-se para ele
  rationale: 'Preserva o sentido comum de פנה com אֵלָיו: virar-se ou voltar a atenção fisicamente para alguém.'
- source_word: עֲזַרְיָהוּ כֹהֵן הָרֹאשׁ
  choice: Azarias, o sacerdote principal
  rationale: כֹהֵן הָרֹאשׁ significa literalmente o sacerdote que está à frente. “Sacerdote principal” é natural em português e evita impor o título técnico “sumo sacerdote” onde ele não aparece explicitamente.
- source_word: וְכָל הַכֹּהֲנִים
  choice: e também todos os sacerdotes
  rationale: '“Também” expressa a força aditiva da oração: os demais sacerdotes acompanharam Azarias na ação e percepção.'
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: Mantém a vivacidade narrativa e a ideia de descoberta súbita marcada por הִנֵּה.
- source_word: מְצֹרָע בְּמִצְחוֹ
  choice: estava com uma grave doença de pele na testa
  rationale: O termo pertence ao vocabulário das leis sacerdotais de impureza, mas não pode ser identificado com segurança com a hanseníase moderna. A formulação comunica a condição visível sem fazer um diagnóstico anacrônico.
- source_word: וַיַּבְהִלֻהוּ מִשָּׁם
  choice: apressaram-se em tirá-lo dali
  rationale: O Hifil de בהל indica que os sacerdotes provocaram ou efetuaram sua saída com urgência, sem exigir que se especifique violência física.
- source_word: וְגַם הוּא נִדְחַף לָצֵאת
  choice: e ele próprio também se apressou a sair
  rationale: A tradução preserva a ênfase em que o próprio rei participou da saída urgente. O Nifal de דחף também pode sugerir que ele foi impelido ou forçado, possibilidade registrada em nota.
- source_word: כִּי נִגְּעוֹ יְהוָה
  choice: porque Yahweh o havia ferido
  rationale: Neste contexto punitivo, נגע designa um golpe ou aflição divina, não mero toque. O mais-que-perfeito expressa que a ação divina precedeu a saída.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em transliteração amplamente reconhecida.
- issue: Identificação de כֹהֵן הָרֹאשׁ como título técnico
  choice: sacerdote principal
  alternative: sumo sacerdote; sacerdote-chefe
  rationale: A expressão hebraica diz “sacerdote principal/da cabeça”. A opção escolhida evita tornar mais técnico do que o original o título usado no versículo.
- issue: Identificação médica de מְצֹרָע
  choice: com uma grave doença de pele
  alternative: leproso; com lepra
  rationale: O termo tem função cultual nas leis de pureza e pode abranger afecções diferentes da hanseníase. A tradução evita uma equivalência médica indevidamente precisa.
- issue: Agência em נִדְחַף לָצֵאת
  choice: ele próprio também se apressou a sair
  alternative: ele próprio também foi impelido a sair
  rationale: O contexto favorece a saída urgente e voluntária depois de ele reconhecer a aflição, mas a forma passiva pode indicar que foi impelido; a ambiguidade é preservada em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com ordem narrativa natural. “E eis que” conserva a vivacidade do hebraico; “grave doença de pele” evita o diagnóstico moderno anacrônico associado a “lepra”. Todos os marcadores aparecem no texto na ordem correspondente.
