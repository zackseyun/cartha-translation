  text: וְ/עַל יָדָ/ם֩ חֵ֨יל צָבָ֜א שְׁלֹ֧שׁ מֵא֣וֹת אֶ֗לֶף וְ/שִׁבְעַ֤ת אֲלָפִים֙ וַ/חֲמֵ֣שׁ מֵא֔וֹת עוֹשֵׂ֥י מִלְחָמָ֖ה בְּ/כֹ֣חַ חָ֑יִל לַ/עְזֹ֥ר לַ/מֶּ֖לֶךְ עַל הָ/אוֹיֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/013.yaml
  text: Under their command was an army of 307,500[a], making war with mighty power, to help the king against the enemy.
translation:
  language: pt
  text: Sob o comando deles havia um exército de 307.500 homens[a], preparados para guerrear com grande poder, a fim de ajudar o rei contra o inimigo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Sob a responsabilidade deles havia uma força de exército de 307.500, homens que faziam guerra”. O texto principal expressa em português natural as expressões militares hebraicas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: Sob o comando deles
  rationale: A expressão idiomática עַל יָד com sufixo indica responsabilidade, supervisão ou autoridade; no contexto militar, “sob o comando deles” comunica naturalmente esse sentido.
- source_word: חֵיל צָבָא
  choice: um exército
  rationale: A combinação designa uma força militar. “Exército” evita a reprodução pouco natural de ambos os substantivos em português.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף וְשִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: '307.500'
  rationale: É a soma direta dos numerais hebraicos, apresentada na convenção numérica usual do português.
- source_word: עוֹשֵׂי מִלְחָמָה
  choice: preparados para guerrear
  rationale: Literalmente, “fazedores de guerra”; no contexto de recenseamento e organização do exército, a expressão caracteriza homens aptos para o combate, sem sugerir necessariamente que já estivessem lutando naquele momento.
- source_word: בְּכֹחַ חָיִל
  choice: com grande poder
  rationale: A expressão reúne termos de força, capacidade e poder militar. A formulação preserva a ênfase na potência de combate sem recorrer a uma construção rígida.
- source_word: לַעְזֹר לַמֶּלֶךְ
  choice: a fim de ajudar o rei
  rationale: Traduz diretamente a finalidade expressa pelo infinitivo de עזר, “ajudar”.
- source_word: עַל הָאוֹיֵב
  choice: contra o inimigo
  rationale: Neste contexto militar, עַל indica oposição; “contra o inimigo” é a formulação natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O texto conserva o caráter administrativo e militar do contexto, empregando “preparados para guerrear” em vez de uma formulação que pudesse sugerir combate já em andamento.
