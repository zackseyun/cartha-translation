  text: the flowers[a], the lamps[b], and the tongs of gold—pure gold.
translation:
  language: pt
  text: as flores, as lâmpadas e as tenazes de ouro — ouro puro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “ouro — ele era perfeições de ouro”. A expressão incomum pode indicar ouro plenamente refinado ou de acabamento perfeito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַפֶּרַח
  choice: as flores
  rationale: פֶּרַח significa literalmente “flor” ou “botão” e, neste inventário, provavelmente designa coletivamente os ornamentos florais dos candelabros. O plural é natural em português na enumeração.
- source_word: וְהַנֵּרוֹת
  choice: as lâmpadas
  rationale: נֵרוֹת é o termo usual para lâmpadas ou luzes e se refere aqui às lâmpadas dos candelabros do templo.
- source_word: וְהַמֶּלְקַחַיִם
  choice: as tenazes
  rationale: מֶלְקַחַיִם designa um instrumento para segurar ou retirar algo, como pavios ou brasas. “Tenazes” preserva o sentido amplo sem impor uma função mais específica.
- source_word: זָהָב
  choice: de ouro
  rationale: A primeira ocorrência qualifica naturalmente os objetos enumerados.
- source_word: הוּא
  choice: —
  rationale: O pronome integra uma oração nominal enfática. Em português, o travessão transmite melhor a retomada do material do que uma tradução rígida por “ele era”.
- source_word: מִכְלוֹת זָהָב
  choice: ouro perfeitamente trabalhado
  rationale: A expressão hebraica incomum, literalmente próxima de “completudes/perfeições de ouro”, parece salientar ouro levado à plena qualidade ou acabamento. A tradução preserva a ideia de completude sem introduzir o superlativo “puríssimo” nem afirmar apenas pureza material.
