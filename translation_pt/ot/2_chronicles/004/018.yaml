base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/018.yaml
  text: Solomon made all these vessels in very great abundance[a], for the weight of the bronze could not be determined.
translation:
  language: pt
  text: Salomão fez todos esses utensílios em quantidade muito grande, pois não se apurou o peso do bronze.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porque não foi apurado o peso do bronze”. O verbo hebraico pode significar “investigar” ou “determinar”; o sentido contextual é que havia tanto bronze que seu peso não foi calculado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fez
  rationale: O verbo עשה tem aqui o sentido comum de fazer ou produzir os objetos do templo; “fez” é direto, natural e fiel.
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: todos esses utensílios
  rationale: כֵּלִים é um termo amplo para objetos ou implementos; “utensílios” é claro e apropriado para os itens de bronze mencionados no contexto.
- source_word: לָרֹב מְאֹד
  choice: em quantidade tão grande
  rationale: A expressão indica quantidade extremamente elevada. A formulação preserva a intensificação de מְאֹד e se liga naturalmente à explicação seguinte.
- source_word: כִּי
  choice: que
  rationale: Na construção portuguesa “tão grande que”, a conjunção introduz de modo natural a consequência ou explicação contextual da abundância, sem tornar a frase pesada.
- source_word: לֹא נֶחְקַר
  choice: não se chegou a apurar
  rationale: O nifal de חקר indica que o peso não foi investigado, verificado ou determinado; “não se chegou a apurar” preserva essa ideia sem afirmar estritamente impossibilidade física.
- source_word: מִשְׁקַל
  choice: o peso
  rationale: מִשְׁקַל designa concretamente o peso, e não apenas uma quantidade genérica.
- source_word: הַנְּחֹשֶׁת
  choice: do bronze
  rationale: No contexto dos utensílios do templo, נְחֹשֶׁת é tradicional e adequadamente entendido como bronze.
