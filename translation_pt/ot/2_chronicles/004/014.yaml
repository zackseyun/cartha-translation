  text: He made the stands[b][a], and he made the basins on the stands.
translation:
  language: pt
  text: Fez os suportes[a] e fez as bacias sobre os suportes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bases”; o termo hebraico se refere às estruturas que sustentavam as bacias.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְּכֹנוֹת
  choice: os suportes
  rationale: Neste contexto, מְכוֹנוֹת designa as estruturas fabricadas que sustentavam as bacias. “Suportes” é claro e funcional em português moderno; “bases” também é possível.
- source_word: עָשָׂה
  choice: fez
  rationale: O verbo comum עשה tem aqui o sentido direto de fabricar ou fazer; “fez” preserva a simplicidade do hebraico.
- source_word: הַכִּיֹּרוֹת
  choice: as bacias
  rationale: כִּיּוֹר designa recipientes usados para lavagem. “Bacias” é uma forma atual e compreensível, sem recorrer a terminologia arcaica.
- source_word: עַל
  choice: sobre
  rationale: A preposição indica que as bacias ficavam colocadas em cima dos suportes; “sobre” expressa naturalmente essa relação espacial.
- source_word: וְאֶת ... וְאֶת
  choice: e ... e
  rationale: As conjunções coordenam os objetos fabricados. Em português, a repetição de “fez” reproduz com naturalidade a estrutura paralela do hebraico.
