base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/010.yaml
  text: And he set the Sea at the southeast side[a], facing south.
translation:
  language: pt
  text: Ele colocou o Mar no lado sudeste[a], voltado para o sul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “no lado direito, para o leste, diante do sul”. Como a orientação espacial hebraica geralmente pressupõe alguém voltado para o leste, o lado direito corresponde ao sul; em conjunto, a expressão indica o lado sudeste.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: Ele
  rationale: A conjunção liga esta nota de localização ao contexto anterior, mas em português a continuidade pode ser expressa naturalmente sem um “e” inicial; אֵת é marcador de objeto direto e não recebe tradução própria.
- source_word: הַיָּם
  choice: o Mar
  rationale: Designa a grande bacia de bronze do templo. “Mar” preserva a denominação literal hebraica, e a inicial maiúscula assinala que se trata desse utensílio específico.
- source_word: נָתַן
  choice: colocou
  rationale: Verbo corrente e preciso para o posicionamento de um objeto, adequado ao contexto dos utensílios do templo.
- source_word: מִכֶּתֶף הַיְמָנִית קֵדְמָה
  choice: no lado sudeste
  rationale: כָּתֵף tem sentido espacial de “lado”; numa orientação voltada para o leste, o lado direito corresponde ao sul, e קֵדְמָה acrescenta a direção leste. A expressão composta indica, portanto, o lado sudeste.
- source_word: מִמּוּל נֶגְבָּה
  choice: voltado para o sul
  rationale: מִמּוּל expressa posição ou orientação diante de algo, e נֶגְבָּה indica a direção sul. A formulação é natural em português e mantém a relação espacial.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A tradução conserva “Mar” como nome tradicional do grande reservatório do templo e esclarece em nota a formulação espacial hebraica.
