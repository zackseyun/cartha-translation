translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Candelabros” mantém o vocabulário bíblico corrente sem recorrer à transliteração “menorás”. A construção “conforme o que lhes era prescrito” preserva a amplitude semântica de מִשְׁפָּט e evita apresentar como certo que se trate apenas de um desenho físico.
