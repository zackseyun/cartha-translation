base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/007.yaml
  text: He made ten gold lampstands according to their prescribed design[a], and he placed them in the temple[c][b], five on the right side and five on the left.
translation:
  language: pt
  text: 'Fez dez candelabros de ouro conforme o que lhes era prescrito[a] e os colocou no templo[b]: cinco à direita e cinco à esquerda[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “segundo a norma estabelecida para eles” ou “segundo o modelo deles”. O termo hebraico pode indicar uma regra, um procedimento ou um modelo prescrito.
    reason: lexical_alternative
  - marker: b
    text: Ou “no salão principal” ou “no santuário”. O termo hebraico se refere ao edifício do templo propriamente dito, e não ao complexo inteiro.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “cinco à direita e cinco à esquerda”. Conforme a orientação do templo, esses lados podem corresponder ao sul e ao norte.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Fez
  rationale: O wayyiqtol de עשה é o verbo narrativo comum para “fazer”. Em português, “Fez” dá continuidade natural ao relato sem precisar explicitar a conjunção inicial.
- source_word: מְנֹרוֹת הַזָּהָב
  choice: candelabros de ouro
  rationale: מְנוֹרָה designa um suporte para lâmpadas, não apenas uma lâmpada. “Candelabros” é uma tradução tradicional e amplamente compreensível em português; “de ouro” reproduz naturalmente o valor atributivo de הַזָּהָב.
- source_word: עֶשֶׂר
  choice: dez
  rationale: Número cardinal que quantifica os candelabros.
- source_word: כְּמִשְׁפָּטָם
  choice: conforme o que lhes era prescrito
  rationale: מִשְׁפָּט pode indicar norma, determinação, procedimento ou modelo prescrito. A formulação escolhida comunica conformidade com uma especificação estabelecida sem restringir indevidamente o termo a desenho, rito ou norma jurídica.
- source_word: וַיִּתֵּן
  choice: e os colocou
  rationale: נתן tem o sentido básico de dar ou pôr; neste contexto espacial, “colocou” expressa com clareza o posicionamento dos candelabros. O pronome “os” torna explícito em português o objeto retomado.
- source_word: בַּהֵיכָל
  choice: no templo
  rationale: הֵיכָל refere-se aqui ao edifício propriamente dito, especialmente seu salão principal, e não necessariamente a todo o complexo. “No templo” é a opção mais clara no texto, com a precisão lexical preservada em nota.
- source_word: חָמֵשׁ מִיָּמִין
  choice: cinco à direita
  rationale: יָמִין significa literalmente “direita”. Mantém-se a orientação relativa do hebraico, sem convertê-la interpretativamente em “sul”.
- source_word: וְחָמֵשׁ מִשְּׂמֹאול
  choice: e cinco à esquerda
  rationale: שְׂמֹאול significa “esquerda”. A tradução conserva o termo direcional do texto hebraico, em vez de substituí-lo por “norte”.
