  text: וְ/אֶת הַ֠/סִּירוֹת וְ/אֶת הַ/יָּעִ֤ים וְ/אֶת הַ/מִּזְלָגוֹת֙ וְ/אֶת כָּל כְּלֵי/הֶ֔ם עָשָׂ֞ה חוּרָ֥ם אָבִ֛יו לַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה לְ/בֵ֣ית יְהוָ֑ה נְחֹ֖שֶׁת מָרֽוּק־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/016.yaml
  text: And Huram-abi made the pots[a], the shovels, the forks, and all their utensils for King Solomon, for the house of Yahweh[c][b], of polished bronze.
translation:
  language: pt
  text: Hurão-Abi[a] fez as panelas, as pás, os garfos e todos os seus utensílios para o rei Salomão, para a casa de Yahweh, tudo de bronze polido.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico também pode ser entendido como “Hurão, seu pai”; aqui, provavelmente se trata do nome ou título do artesão.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “bronze brunido”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּירוֹת
  choice: as panelas
  rationale: O termo designa panelas ou recipientes semelhantes; “panelas” é direto e adequado à lista de utensílios do templo.
- source_word: הַיָּעִים
  choice: as pás
  rationale: Refere-se a instrumentos usados para retirar cinzas ou manejar brasas; “pás” é a equivalência tradicional e contextual.
- source_word: הַמִּזְלָגוֹת
  choice: os garfos
  rationale: Designa instrumentos com pontas semelhantes a garfos; a escolha é clara sem especificar além do que o hebraico permite.
- source_word: כָּל כְּלֵיהֶם
  choice: todos os utensílios deles
  rationale: Preserva o pronome do hebraico e o caráter abrangente de כְּלִי, embora a referência exata de “deles” permaneça aberta.
- source_word: חוּרָם אָבִיו
  choice: Hurão-Abi
  rationale: No contexto, é preferível entender a expressão como nome ou designação composta do artesão, evitando interpretá-la no corpo do texto como afirmação literal de paternidade.
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: para o rei Salomão
  rationale: Expressa de forma natural a relação de serviço ou comissão indicada pela preposição לְ.
- source_word: לְבֵית יְהוָה
  choice: para a casa de Yahweh
  rationale: Mantém a expressão hebraica “casa” e verte diretamente o nome divino.
- source_word: נְחֹשֶׁת מָרוּק
  choice: bronze polido
  rationale: “Bronze” é a equivalência usual neste contexto de metalurgia, e מָרוּק indica uma superfície polida ou brunida.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto traz explicitamente o Tetragrama; “Yahweh” conserva o nome próprio sem substituí-lo por um título.
- issue: Interpretação de חוּרָם אָבִיו
  choice: Hurão-Abi como nome ou designação composta
  alternative: Hurão, seu pai
  rationale: O uso do Cronista favorece a identificação do artesão por um nome ou título composto, mas a leitura formalmente possível é registrada em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada com “tudo de bronze polido” para deixar claro que o material se aplica ao conjunto dos objetos.
