  text: וַ/יַּ֣עַשׂ שְׁלֹמֹ֔ה אֵ֚ת כָּל הַ/כֵּלִ֔ים אֲשֶׁ֖ר בֵּ֣ית הָ/אֱלֹהִ֑ים וְ/אֵת֙ מִזְבַּ֣ח הַ/זָּהָ֔ב וְ/אֶת הַ/שֻּׁלְחָנ֔וֹת וַ/עֲלֵי/הֶ֖ם לֶ֥חֶם הַ/פָּנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/019.yaml
  text: 'And Solomon made all the vessels that were for the house of God: the golden altar[a], the tables, and on them the bread of the Presence.'
translation:
  language: pt
  text: 'Salomão fez todos os utensílios destinados à casa de Deus: o altar de ouro, as mesas e, sobre elas, o pão da Presença[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, tradicionalmente, “os pães da proposição”. Em hebraico, “pão da Presença”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fez
  rationale: O verbo עשה é o termo comum para “fazer”; neste inventário, “fez” é natural e fiel.
- source_word: כָּל הַכֵּלִים
  choice: todos os utensílios
  rationale: כֵּלִים designa objetos ou implementos usados no culto; “utensílios” comunica com clareza sua função no templo.
- source_word: אֲשֶׁר בֵּית הָאֱלֹהִים
  choice: destinados à casa de Deus
  rationale: A construção hebraica concisa indica que os utensílios pertenciam ou se destinavam ao templo, não apenas que se encontravam dentro dele.
- source_word: מִזְבַּח הַזָּהָב
  choice: o altar de ouro
  rationale: Reproduz naturalmente em português a relação do hebraico e identifica o material do altar.
- source_word: הַשֻּׁלְחָנוֹת
  choice: as mesas
  rationale: O plural hebraico significa diretamente “mesas”, aqui as mesas do templo associadas ao pão.
- source_word: וַעֲלֵיהֶם
  choice: e, sobre elas
  rationale: Preserva a coordenação e a relação espacial; o pronome feminino concorda naturalmente com “mesas” em português.
- source_word: לֶחֶם הַפָּנִים
  choice: o pão da Presença
  rationale: Mantém de modo transparente a expressão cultual hebraica e sua referência ao pão colocado diante de Deus, sem substituí-la apenas pelo termo tradicional.
theological_decisions:
- issue: Designação do templo em בֵּית הָאֱלֹהִים
  choice: casa de Deus
  alternative: templo de Deus
  rationale: “Casa de Deus” preserva a imagem e a formulação hebraicas, permanecendo clara em português.
- issue: Tradução de לֶחֶם הַפָּנִים
  choice: pão da Presença
  alternative: pães da proposição
  rationale: A opção escolhida torna visível o sentido literal e cultual da expressão hebraica; a forma tradicional é registrada em nota sem resolver além do texto a referência da “Presença”.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A expressão técnica “pão da Presença” conserva o teor cultual do original; a vírgula em “e, sobre elas” facilita a leitura do complemento deslocado.
