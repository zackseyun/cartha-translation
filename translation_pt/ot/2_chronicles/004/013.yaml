  text: וְ/אֶת הָֽ/רִמּוֹנִ֛ים אַרְבַּ֥ע מֵא֖וֹת לִ/שְׁתֵּ֣י הַ/שְּׂבָכ֑וֹת שְׁנַ֨יִם טוּרִ֤ים רִמּוֹנִים֙ לַ/שְּׂבָכָ֣ה הָ/אֶחָ֔ת לְ/כַסּ֗וֹת אֶת שְׁתֵּי֙ גֻּלּ֣וֹת הַ/כֹּֽתָר֔וֹת אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/עַמּוּדִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/013.yaml
  text: and the four hundred pomegranates for the two latticeworks[a], two rows of pomegranates for each latticework[b], to cover the two bowl-shaped capitals that were on top of the pillars.
translation:
  language: pt
  text: e as quatrocentas romãs para as duas treliças[a], com duas fileiras de romãs em cada treliça, para cobrir as duas partes arredondadas dos capitéis[b] que ficavam no alto das colunas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “redes ornamentais”. O termo hebraico indica um trabalho decorativo entrelaçado nos capitéis.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “as duas tigelas dos capitéis”. A expressão descreve as partes arredondadas dos capitéis.
    reason: lexical_alternative
lexical_decisions:
- source_word: רִמּוֹנִים
  choice: romãs
  rationale: O substantivo designa literalmente romãs; neste inventário, o contexto deixa claro que se trata de elementos ornamentais, sem necessidade de explicitação no texto.
- source_word: שְּׂבָכוֹת
  choice: treliças
  rationale: Expressa de modo natural em português a obra ornamental entrelaçada ou semelhante a uma rede.
- source_word: שְׁנַיִם טוּרִים
  choice: duas fileiras
  rationale: É a expressão corrente e clara para duas linhas ordenadas de ornamentos.
- source_word: לַשְּׂבָכָה הָאֶחָת
  choice: em cada treliça
  rationale: Comunica o valor distributivo do singular hebraico em relação às duas treliças.
- source_word: לְכַסּוֹת
  choice: para cobrir
  rationale: Conserva diretamente a ideia de finalidade expressa pelo infinitivo hebraico.
- source_word: גֻּלּוֹת
  choice: partes arredondadas
  rationale: Mantém a imagem de formas arredondadas, possivelmente semelhantes a tigelas, sem impor uma identificação arquitetônica excessivamente específica.
- source_word: כֹּתָרוֹת
  choice: capitéis
  rationale: É o termo arquitetônico preciso em português para os remates superiores das colunas.
- source_word: עַל פְּנֵי הָעַמּוּדִים
  choice: no alto das colunas
  rationale: No contexto dos capitéis, indica naturalmente sua localização na parte superior das colunas.
