base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/022.yaml
  text: the snuffers[a], the basins, the bowls, and the firepans of pure gold; and the entrance of the house, its inner doors for the Most Holy Place, and the doors of the house for the nave[c][b], were of gold.
translation:
  language: pt
  text: as espevitadeiras[a], as bacias, as taças e os braseiros, todos de ouro puro; e as portas da entrada do templo — as portas internas, para o Santo dos Santos, e as portas do templo, para o salão principal[b] — eram de ouro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, utensílios usados para aparar os pavios das lâmpadas.
    reason: clarity
  - marker: b
    text: Ou “santuário” ou “salão do templo”. O termo hebraico designa aqui o recinto principal do templo, distinto do Santo dos Santos.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְזַמְּרוֹת
  choice: espevitadeiras
  rationale: Designa utensílios usados para aparar ou remover a parte queimada dos pavios das lâmpadas; o termo técnico preserva a função no inventário do templo.
- source_word: מִּזְרָקוֹת
  choice: bacias
  rationale: Refere-se a recipientes rituais, frequentemente usados para receber ou aspergir sangue; “bacias” os distingue das taças mencionadas em seguida.
- source_word: כַּפּוֹת
  choice: taças
  rationale: O substantivo pode indicar pequenos recipientes; “taças” é natural em português e evita confundi-los com as bacias anteriores.
- source_word: מַּחְתּוֹת
  choice: braseiros
  rationale: Indica recipientes para brasas ou fogo; “braseiros” preserva essa função sem pressupor que fossem exclusivamente incensários.
- source_word: זָהָב סָגוּר
  choice: ouro puro
  rationale: A expressão designa ouro de alta qualidade, cuidadosamente refinado; “ouro puro” é claro e corrente.
- source_word: פֶּתַח הַבַּיִת
  choice: a entrada do templo
  rationale: פֶּתַח indica a abertura ou entrada; “templo” comunica naturalmente o referente de הַבַּיִת neste contexto.
- source_word: דַּלְתוֹתָיו הַפְּנִימִיּוֹת
  choice: suas portas interiores
  rationale: Mantém o plural hebraico e o contraste com as portas do salão principal mencionadas depois.
- source_word: לְקֹדֶשׁ הַקֳּדָשִׁים
  choice: que davam para o Santo dos Santos
  rationale: A formulação identifica com clareza o destino das portas e preserva o superlativo idiomático hebraico.
- source_word: לַהֵיכָל
  choice: que davam para o salão principal
  rationale: הֵיכָל designa aqui o recinto principal do templo, distinto do Santo dos Santos; “salão principal” é compreensível sem sugerir uma nave de igreja.
- source_word: זָהָב
  choice: era revestida de ouro
  rationale: O hebraico conclui de modo elíptico com “ouro”. Em relação à entrada e às portas, “era revestida de ouro” expressa naturalmente o material indicado, sem sugerir portas maciças de ouro.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com terminologia cultual precisa. “Espevitadeiras” é mantido por exatidão e explicado em nota; “salão principal” evita o pouco familiar “nave” e explicita a distinção espacial presente no hebraico.
