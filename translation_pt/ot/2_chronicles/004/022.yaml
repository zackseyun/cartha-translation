    rationale: «A entrada ... era revestida de ouro» deixa as portas coordenadas sem predicação clara e acrescenta «revestida», enquanto o hebraico conclui simplesmente «ouro». «Eram de ouro» corresponde melhor à elipse material do texto.
  - severity: low
    issue: Possível ambiguidade no alcance de «de ouro puro»
    rationale: Sem um elemento delimitador, a locução após «braseiros» pode ser lida em português como qualificando apenas o último item da série. «Todos de ouro puro» explicita o alcance coletivo presente no hebraico.
