  text: וַ/יַּ֥עַשׂ אֶת הַ/יָּ֖ם מוּצָ֑ק עֶ֣שֶׂר בָּֽ֠/אַמָּה מִ/שְּׂפָת֨/וֹ אֶל שְׂפָת֜/וֹ עָג֣וֹל סָבִ֗יב וְ/חָמֵ֤שׁ בָּֽ/אַמָּה֙ קֽוֹמָת֔/וֹ וְ/קָו֙ שְׁלֹשִׁ֣ים בָּֽ/אַמָּ֔ה יָסֹ֥ב אֹת֖/וֹ סָבִֽיב־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/002.yaml
  text: He made the Sea of cast metal[a], ten cubits from brim to brim, round all around; its height was five cubits[b], and a line of thirty cubits encircled it all around.
translation:
  language: pt
  text: Fez o Mar de metal fundido[a]. Ele media dez côvados de uma borda à outra, era circular em toda a volta e tinha cinco côvados de altura; um cordão de trinta côvados o circundava por completo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Mar fundido”. “Mar” é o nome dado ao grande reservatório entre os utensílios do templo.'
    reason: lexical_alternative
  - marker: b
    text: Um côvado equivalia aproximadamente a 45 centímetros. As medidas indicadas são, portanto, cerca de 4,5 metros de diâmetro, 2,25 metros de altura e 13,5 metros de circunferência.
    reason: cultural_note
lexical_decisions:
- source_word: הַיָּם
  choice: o Mar
  rationale: Mantém o nome tradicional do grande reservatório entre os utensílios do templo; a inicial maiúscula indica que se trata de um objeto específico, não do mar comum.
- source_word: מוּצָק
  choice: de metal fundido
  rationale: Expressa naturalmente em português o particípio que descreve um objeto produzido por fundição, sem restringir o metal além do que este versículo declara.
- source_word: עֶשֶׂר בָּאַמָּה
  choice: dez côvados
  rationale: Conserva a unidade antiga; a expressão seguinte esclarece que se trata da medida transversal.
- source_word: מִשְּׂפָתוֹ אֶל שְׂפָתוֹ
  choice: de uma borda à outra
  rationale: Para um grande recipiente, 'borda' comunica com clareza o sentido de שָׂפָה, literalmente 'lábio' ou 'beira'.
- source_word: עָגוֹל סָבִיב
  choice: era circular em toda a volta
  rationale: Preserva tanto a indicação da forma redonda quanto a ideia enfática de totalidade ao redor.
- source_word: וְחָמֵשׁ בָּאַמָּה קוֹמָתוֹ
  choice: tinha cinco côvados de altura
  rationale: Formulação portuguesa natural que mantém a medida vertical do texto.
- source_word: וְקָו
  choice: um cordão
  rationale: קו designa uma linha ou corda de medir; 'cordão' preserva a imagem concreta em vez de substituí-la diretamente pelo conceito abstrato de circunferência.
- source_word: יָסֹב אֹתוֹ סָבִיב
  choice: o circundava por completo
  rationale: Reproduz o sentido de dar a volta ou cercar e conserva a ênfase de סָבִיב.
