base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/020.yaml
  text: the lampstands and their lamps[a], to burn according to the ordinance before the inner sanctuary, of pure gold[b];
translation:
  language: pt
  text: os candelabros e suas lâmpadas, para que ardessem, conforme prescrito, diante do santuário interior[a], tudo de ouro puro[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «diante do Lugar Santíssimo». O termo hebraico דְּבִיר designa o santuário interior do templo.
    reason: lexical_alternative
  - marker: b
    text: Ou «ouro refinado». A expressão hebraica indica ouro purificado, de alta qualidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְּנֹרוֹת
  choice: os candelabros
  rationale: מְנוֹרָה designa o suporte de lâmpadas do templo. «Candelabros» é natural e reconhecível em português, sem exigir transliteração.
- source_word: וְנֵרֹתֵיהֶם
  choice: e suas lâmpadas
  rationale: נֵר pode designar uma lâmpada ou sua chama; neste inventário dos utensílios ligados aos candelabros, «lâmpadas» expressa melhor o objeto.
- source_word: לְבַעֲרָם
  choice: para que ardessem
  rationale: O infinitivo com sufixo pronominal indica a finalidade de fazer as lâmpadas arder. A formulação explicita naturalmente essa função em português.
- source_word: כַּמִּשְׁפָּט
  choice: conforme prescrito
  rationale: מִשְׁפָּט refere-se aqui à norma estabelecida para o serviço do templo. «Conforme prescrito» preserva o sentido regulador em linguagem corrente e digna.
- source_word: לִפְנֵי הַדְּבִיר
  choice: diante do santuário interior
  rationale: דְּבִיר designa o recinto mais interno do templo. «Santuário interior» é claro e evita impor no texto principal uma designação tradicional mais específica.
- source_word: זָהָב סָגוּר
  choice: ouro puro
  rationale: A expressão indica ouro de elevada qualidade, purificado ou refinado. «Ouro puro» é a formulação portuguesa mais idiomática, enquanto a alternativa consta em nota.
- source_word: וְאֶת
  choice: os
  rationale: A conjunção com o marcador de objeto direto introduz mais um item da lista iniciada no contexto anterior; em português, a continuidade se expressa naturalmente sem tradução mecânica do marcador.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com sintaxe adequada à continuação de uma lista. «Candelabros» favorece ampla compreensão; «conforme prescrito» comunica de modo natural a norma ritual. Todos os marcadores de nota aparecem no texto principal.
