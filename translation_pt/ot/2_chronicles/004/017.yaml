base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/017.yaml
  text: In the plain of the Jordan the king cast them in the clay ground[a], between Sukkoth and Zeredah.
translation:
  language: pt
  text: Na planície do Jordão, o rei os fundiu em solo argiloso, entre Sucote e Zeredá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto paralelo de 1 Reis 7:46 chama esse lugar de “Zaretã”. Aqui, Crônicas traz “Zeredá”, provavelmente uma forma variante do mesmo topônimo.
    reason: textual_variant
lexical_decisions:
- source_word: בְּכִכַּר הַיַּרְדֵּן
  choice: na planície do Jordão
  rationale: כִּכָּר pode designar uma região plana ou distrito do vale; “planície do Jordão” expressa com naturalidade o sentido topográfico neste contexto.
- source_word: יְצָקָם
  choice: os fundiu
  rationale: O verbo יצק, no contexto da fabricação de objetos de bronze, descreve o ato de verter metal em fundição. “Os fundiu” é idiomático e mantém o rei como sujeito gramatical, sem explicitar agentes não mencionados.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Tradução direta do substantivo definido, que no contexto se refere a Salomão.
- source_word: בַּעֲבִי הָאֲדָמָה
  choice: em solo argiloso
  rationale: עֲבִי denota espessura ou densidade; em combinação com אֲדָמָה, a expressão provavelmente indica terra densa e argilosa apropriada para moldes de fundição. A formulação comunica esse sentido prático sem excessiva explicitação.
- source_word: בֵּין סֻכּוֹת וּבֵין צְרֵדָתָה
  choice: entre Sucote e Zeredá
  rationale: Os topônimos são transliterados em formas claras para leitores de português. A terminação direcional de צְרֵדָתָה não é reproduzida separadamente, pois a preposição “entre” já define a relação espacial.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Preferiu-se “solo argiloso” a uma reprodução literal pouco natural como “na espessura da terra”.
