base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/006.yaml
  text: He made ten basins and set five on the right and five on the left[a], to wash in them; in them they would rinse the things used for the burnt offering[c][b]. But the sea was for the priests to wash in.
translation:
  language: pt
  text: Fez também dez bacias e colocou cinco à direita e cinco à esquerda, para lavar nelas; nelas se enxaguava o que se usava no holocausto.[a] O Mar, porém, era para os sacerdotes se lavarem nele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “a obra do holocausto”; a expressão provavelmente se refere aos objetos ou materiais usados na preparação do holocausto.
    reason: lexical_alternative
  - marker: b
    text: O “Mar” era o grande reservatório de bronze destinado à lavagem dos sacerdotes.
    reason: cultural_note
lexical_decisions:
- source_word: כִּיּוֹרִים
  choice: bacias
  rationale: Designa grandes recipientes para lavagem no serviço do templo. “Bacias” é claro e corrente em português, sem o tom arcaico de “lavatórios”.
- source_word: מִיָּמִין / מִשְּׂמֹאול
  choice: à direita / à esquerda
  rationale: Reproduz de modo natural e conciso a disposição espacial indicada pelo hebraico.
- source_word: לְרָחְצָה
  choice: para nelas se fazerem as lavagens
  rationale: Expressa o infinitivo de finalidade e acomoda a referência geral ao uso ritual das bacias.
- source_word: מַעֲשֵׂה הָעוֹלָה
  choice: o que era usado no holocausto
  rationale: A expressão hebraica é elíptica, literalmente “a obra do holocausto”. A formulação portuguesa mantém certa amplitude e comunica os materiais ou objetos envolvidos na preparação do sacrifício sem especificá-los além do texto.
- source_word: יָדִיחוּ
  choice: se enxaguava
  rationale: O Hifil indica enxaguar ou lavar para remover resíduos. O imperfeito tem aqui valor habitual, adequadamente expresso pelo pretérito imperfeito.
- source_word: וְהַיָּם
  choice: O Mar
  rationale: Preserva a designação distintiva do grande reservatório de bronze. A inicial maiúscula sinaliza que se trata do nome desse objeto do templo, não do mar geográfico.
- source_word: לַכֹּהֲנִים
  choice: dos sacerdotes
  rationale: Na construção “destinava-se às lavagens dos sacerdotes”, transmite naturalmente a finalidade e o uso indicados pelo dativo hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. “Holocausto” conserva o termo sacrificial tradicional e reconhecível. A repetição funcional das lavagens foi suavizada sem eliminar a distinção entre as dez bacias e o Mar.
