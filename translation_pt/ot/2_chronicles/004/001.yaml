  yaml_path: translation/ot/2_chronicles/004/001.yaml
  text: He made a bronze altar[a], twenty cubits its length and twenty cubits its width, and ten cubits its height.
translation:
  language: pt
  text: Fez um altar de bronze[a], de vinte côvados de comprimento, vinte côvados de largura e dez côvados de altura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de cobre”. O termo hebraico נְחֹשֶׁת pode designar cobre ou bronze; neste contexto, “bronze” é a tradução tradicionalmente preferida.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Fez
  rationale: O wayyiqtol de עשה dá continuidade à narrativa e é expresso naturalmente pelo pretérito perfeito; o sujeito permanece implícito em português, como permite o contexto.
- source_word: מִזְבַּח
  choice: altar
  rationale: Termo português padrão para a estrutura sacrificial designada por מזבח.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: Em contextos ligados ao tabernáculo e ao templo, “bronze” é a designação moderna convencional; “cobre” continua lexicalmente possível.
- source_word: עֶשְׂרִים אַמָּה
  choice: vinte côvados
  rationale: Mantém a unidade antiga e preserva o caráter arquitetônico e histórico da descrição.
- source_word: אָרְכּוֹ
  choice: de comprimento
  rationale: Expressão idiomática em português para indicar uma dimensão, correspondendo ao substantivo hebraico com sufixo possessivo.
- source_word: רָחְבּוֹ
  choice: de largura
  rationale: Forma arquitetônica natural em português para a largura do altar.
- source_word: וְעֶשֶׂר אַמּוֹת קוֹמָתוֹ
  choice: e dez côvados de altura
  rationale: Reproduz com clareza a terceira dimensão e traduz קוֹמָה de acordo com seu sentido arquitetônico.
