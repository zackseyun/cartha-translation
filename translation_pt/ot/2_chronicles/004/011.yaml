base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/011.yaml
  text: 'Huram made the pots[a], the shovels, and the bowls. So Huram finished the work that he did for King Solomon in the house of God:'
translation:
  language: pt
  text: 'Hirão fez as panelas, as pás e as bacias. Assim, Hirão terminou o trabalho que fez para o rei Salomão na Casa de Deus:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חוּרָם / חירם
  choice: Hurão
  rationale: Forma portuguesa tradicional e reconhecível do nome, correspondente às variantes hebraicas presentes no versículo.
- source_word: הַסִּירוֹת
  choice: panelas
  rationale: O termo designa panelas ou recipientes; “panelas” é concreto, natural e não especifica uma função além do que o contexto permite.
- source_word: הַיָּעִים
  choice: pás
  rationale: Designa utensílios usados para retirar cinzas ou manejar materiais junto ao altar; “pás” é a equivalência portuguesa usual.
- source_word: הַמִּזְרָקוֹת
  choice: bacias
  rationale: Refere-se a recipientes empregados no serviço ritual; “bacias” comunica o tipo de objeto sem explicitar uma função não declarada no versículo.
- source_word: וַיְכַל
  choice: terminou
  rationale: Expressa a conclusão da tarefa e soa natural na sequência narrativa.
- source_word: לַעֲשׂוֹת אֶת הַמְּלָאכָה אֲשֶׁר עָשָׂה
  choice: o trabalho que fez
  rationale: Preserva a repetição semântica de עשה de maneira compreensível e digna em português.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: na Casa de Deus
  rationale: Mantém a expressão hebraica “casa de Deus” e o sentido locativo mais direto da preposição בְּ.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Casa de Deus” recebe inicial maiúscula por funcionar aqui como designação do santuário. O versículo termina com dois-pontos porque introduz a enumeração subsequente.
