  text: וּ/דְמ֣וּת בְּקָרִים֩ תַּ֨חַת ל֜/וֹ סָבִ֤יב סָבִיב֙ סוֹבְבִ֣ים אֹת֔/וֹ עֶ֚שֶׂר בָּֽ/אַמָּ֔ה מַקִּיפִ֥ים אֶת הַ/יָּ֖ם סָבִ֑יב שְׁנַ֤יִם טוּרִים֙ הַ/בָּקָ֔ר יְצוּקִ֖ים בְּ/מֻֽצַקְתּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/003.yaml
  text: And beneath it were figures of oxen all around[a], encircling it, ten to the cubit, surrounding the Sea all around. The oxen were in two rows[c][b], cast as one piece with it.
translation:
  language: pt
  text: Debaixo dele havia figuras de bois ao redor[a], dez por côvado[b], circundando o Mar por todos os lados. Os bois estavam dispostos em duas fileiras e foram fundidos numa só peça com o Mar.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “formas de bois”. O hebraico indica representações decorativas de bovinos, não animais vivos.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “dez no côvado”, provavelmente dez figuras para cada côvado ao longo da circunferência.'
    reason: cultural_note
  - marker: c
    text: 'Hebraico: “fundidos em sua fundição”, isto é, formados como parte da mesma peça de metal fundido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְמוּת בְּקָרִים
  choice: figuras de bois
  rationale: דְמוּת indica forma, semelhança ou representação; “figuras de bois” deixa claro que se trata de elementos decorativos, não de animais vivos.
- source_word: תַּחַת לוֹ
  choice: debaixo dele
  rationale: Expressa de modo natural e claro a posição das figuras sob o tanque chamado Mar.
- source_word: סָבִיב סָבִיב
  choice: ao redor
  rationale: A repetição hebraica intensifica a ideia de que as figuras davam toda a volta; em português, “ao redor” comunica isso naturalmente, reforçado depois por “por todos os lados”.
- source_word: עֶשֶׂר בָּאַמָּה
  choice: dez por côvado
  rationale: Preserva de forma concisa a relação numérica do hebraico, provavelmente dez figuras para cada côvado da circunferência.
- source_word: מַקִּיפִים אֶת הַיָּם סָבִיב
  choice: circundando o Mar por todos os lados
  rationale: Mantém explícito o objeto e conserva a imagem reiterada de um ornamento que envolvia completamente o tanque.
- source_word: שְׁנַיִם טוּרִים
  choice: dispostos em duas fileiras
  rationale: טוּרִים significa “fileiras”; a inclusão de “dispostos” produz uma frase natural e explicita a função descritiva da expressão.
- source_word: יְצוּקִים בְּמֻצַקְתּוֹ
  choice: foram fundidos numa só peça com o Mar
  rationale: No contexto de metalurgia, יצק se refere à fundição. A formulação comunica que as figuras foram moldadas na mesma fundição do tanque, e não acrescentadas depois.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Mar” recebe inicial maiúscula por funcionar como designação convencional do grande tanque do templo. A repetição espacial do hebraico foi preservada sem produzir uma duplicação artificial em português.
