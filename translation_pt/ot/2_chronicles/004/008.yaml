base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/008.yaml
  text: He made ten tables and placed them in the temple[a], five on the right and five on the left; he also made one hundred bowls of gold.
translation:
  language: pt
  text: Fez dez mesas e as colocou no templo, cinco à direita e cinco à esquerda. Fez também cem bacias de ouro[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tigelas de ouro” ou “bacias de ouro usadas para aspersão”; o termo hebraico designa recipientes rituais usados no serviço do templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻׁלְחָנוֹת
  choice: mesas
  rationale: O substantivo normalmente designa mesas; esta é a tradução mais direta e natural no contexto dos utensílios do templo.
- source_word: וַיַּנַּח
  choice: as colocou
  rationale: O verbo expressa a ação concreta de pôr ou posicionar; o pronome retoma naturalmente as dez mesas.
- source_word: בַּהֵיכָל
  choice: no templo
  rationale: Neste contexto cultual, הֵיכָל se refere ao edifício do templo, não a um palácio. A opção é clara para leitores modernos sem especificar indevidamente uma parte interna.
- source_word: מִיָּמִין
  choice: à direita
  rationale: Traduz diretamente a indicação espacial e evita convertê-la em uma orientação geográfica não expressa no texto.
- source_word: מִשְּׂמֹאול
  choice: à esquerda
  rationale: Mantém o paralelismo espacial com 'à direita' de modo conciso e idiomático.
- source_word: מִזְרְקֵי זָהָב
  choice: bacias de ouro
  rationale: מִזְרָק designa um recipiente ritual semelhante a uma bacia ou tigela. 'Bacias de ouro' é claro e preserva o caráter concreto do objeto; a possível função ritual é indicada em nota.
- source_word: מֵאָה
  choice: cem
  rationale: Forma cardinal normal e idiomática em português antes de substantivo.
