base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/004.yaml
  text: 'It stood on twelve oxen: three facing north[a], three facing west, three facing south, and three facing east. The Sea was above them[b], and all their rear parts were inward.'
translation:
  language: pt
  text: 'O Mar ficava apoiado sobre doze bois: três voltados para o norte, três para o oeste[a], três para o sul e três para o leste. O Mar estava acima deles, e todas as partes traseiras dos bois ficavam voltadas para dentro.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “três voltados para o mar”. Nesse uso direcional, “mar” indica o oeste.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹמֵד
  choice: ficava
  rationale: O particípio qal descreve a posição do Mar; “ficava” expressa naturalmente esse sentido estático no contexto arquitetônico.
- source_word: בָּקָר
  choice: bois
  rationale: Designa as doze figuras bovinas que sustentavam o Mar. “Bois” é claro e tradicional em português, sem exigir uma discussão sobre o sexo zoológico das figuras.
- source_word: פֹנִים
  choice: voltados para
  rationale: Embora ligado literalmente a “face”, nesta construção indica a orientação das figuras; “voltados para” é idiomático e preserva a imagem espacial.
- source_word: יָמָּה
  choice: oeste
  rationale: A forma significa literalmente “em direção ao mar”, mas funciona aqui como designação hebraica convencional do oeste.
- source_word: הַיָּם
  choice: o Mar
  rationale: É o nome do grande reservatório do templo no contexto; a inicial maiúscula ajuda a distingui-lo de um mar geográfico.
- source_word: אֲחֹרֵיהֶם
  choice: os quartos traseiros dos bois
  rationale: O termo indica as partes posteriores das figuras. A explicitação “dos bois” elimina uma possível ambiguidade pronominal em português.
- source_word: בָּיְתָה
  choice: para dentro
  rationale: A forma direcional indica orientação para o interior, isto é, para o centro sob o reservatório.
