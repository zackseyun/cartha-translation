base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/009.yaml
  text: And he made the court of the priests[a], and the great court, and doors for the court[c][b]; and he overlaid their doors with bronze.
translation:
  language: pt
  text: Fez o pátio dos sacerdotes, o grande pátio e portas[a] para o pátio; e revestiu de bronze[c] as suas portas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “portões”. O substantivo hebraico significa mais comumente “portas”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “as portas deles”. O sufixo é plural, mas sua referência não é expressa de modo inequívoco.'
    reason: source_ambiguity
  - marker: c
    text: Ou “cobre”. O termo hebraico pode designar cobre ou bronze.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Fez
  rationale: O verbo עשה tem sentido amplo de fazer ou realizar. “Fez” é natural no contexto da construção do templo e não especifica indevidamente o método empregado.
- source_word: חֲצַר הַכֹּהֲנִים
  choice: o pátio dos sacerdotes
  rationale: חָצֵר designa um pátio ou recinto. A expressão preserva com clareza a relação construta e é compreensível na descrição arquitetônica do templo.
- source_word: וְהָעֲזָרָה הַגְּדוֹלָה
  choice: o grande átrio
  rationale: עֲזָרָה refere-se aqui a um recinto ou átrio do templo. “Grande átrio” distingue o termo do pátio sacerdotal sem eliminar a proximidade semântica entre os dois.
- source_word: וּדְלָתוֹת לָעֲזָרָה
  choice: e portas para o átrio
  rationale: דֶּלֶת significa normalmente “porta”. A formulação mantém o valor da preposição לְ e evita substituir o termo por “portões” sem necessidade.
- source_word: וְדַלְתוֹתֵיהֶם
  choice: as portas deles
  rationale: O sufixo hebraico é masculino plural, literalmente “deles”. A tradução conserva essa forma, embora sua referência exata — provavelmente os recintos mencionados — não seja totalmente explícita.
- source_word: צִפָּה
  choice: revestiu
  rationale: Neste tipo de construção, צפה descreve a aplicação de uma camada metálica sobre uma superfície. “Revestiu” é corrente e preciso em português.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: נְחֹשֶׁת pode abranger cobre e ligas de cobre. “Bronze” é a designação tradicional e contextualmente adequada para os elementos do templo, mantendo-se a alternativa em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com vocabulário arquitetônico acessível. “Pátio” e “átrio” representam os dois substantivos hebraicos distintos sem sugerir uma diferença técnica maior do que o texto permite. A ordem das palavras foi levemente ajustada para fluência, preservando a ambiguidade do pronome plural.
