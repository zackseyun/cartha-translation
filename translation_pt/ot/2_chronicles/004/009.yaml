  - severity: low
    issue: Formulação «as portas deles»
    rationale: Embora formalmente literal, soa menos idiomática em português e torna a coesão mais áspera. «As suas portas» mantém a referência não especificada; a nota informa que o hebraico traz um sufixo plural, sem determinar um antecedente além do que o texto permite.
