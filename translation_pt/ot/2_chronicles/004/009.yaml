  source_fidelity: A tradução transmite corretamente a ação, os dois espaços do complexo do templo, as portas e o revestimento de bronze. Contudo, «grande átrio» introduz uma distinção arquitetônica em português que não é necessária e pode sugerir um vestíbulo, enquanto עֲזָרָה, tal como חָצֵר neste contexto, designa um pátio/recinto. «Grande pátio» é mais direto e mais próximo do uso contextual.
