translation:
  language: pt
  text: um Mar[a] e os doze bois debaixo dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a bacia chamada Mar e os doze bois debaixo dela”.'
    reason: Alternativa lexical que explicita que “Mar” é o nome da grande bacia de metal fundido.
lexical_decisions:
- source_word: הַיָּם
  choice: Mar
  rationale: יָם significa literalmente “mar”, mas, no contexto dos utensílios do templo, designa a grande bacia de metal fundido conhecida como “Mar”. A inicial maiúscula preserva seu uso como nome do objeto.
- source_word: אֶחָד
  choice: único
  rationale: O numeral modifica “Mar”. Em português, “o único Mar” expressa naturalmente que havia um só objeto desse tipo e mantém o caráter de inventário.
- source_word: הַבָּקָר
  choice: bois
  rationale: בָּקָר é um coletivo referente a bovinos; aqui designa as doze figuras bovinas que sustentavam o Mar. “Bois” é claro e tradicional, sem especificar além do que o termo hebraico exige.
- source_word: שְׁנֵים עָשָׂר
  choice: doze
  rationale: Equivalente direto do numeral composto hebraico.
- source_word: תַּחְתָּיו
  choice: debaixo dele
  rationale: A preposição com sufixo masculino singular retoma “Mar”; “debaixo dele” é uma formulação natural e concisa em português.
- source_word: אֶת ... וְאֶת
  choice: não traduzido separadamente
  rationale: אֶת marca os objetos diretos “o Mar” e “os bois” e é representado pela estrutura sintática portuguesa, sem equivalente lexical independente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação concisa adequada à sequência de inventário. “Mar” recebe inicial maiúscula como nome do utensílio do templo; a nota explicita o referente para leitores não familiarizados com essa designação.
