  source_fidelity: 'A tradução preserva a enumeração do hebraico, incluindo todas as repetições de “dois/duas”, e traduz adequadamente os termos arquitetônicos: “colunas”, “capitéis”, “treliças” e a construção final de finalidade “para cobrir”. “Bojos” é uma opção cautelosa para גֻּלּוֹת e, com a nota, mantém a incerteza formal atestada no original. A oração relativa é compatível com a leitura adotada no rastro de auditoria inglês, referindo-se aos capitéis.'
