base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/012.yaml
  text: the two pillars[a], and the two bowls and the two capitals on top of the pillars, and the two latticeworks to cover the two bowls of the capitals that were on top of the pillars[b];
translation:
  language: pt
  text: as duas colunas, os dois bojos[a] e os dois capitéis no alto das colunas, e as duas treliças[b] para cobrir os dois bojos dos capitéis que ficavam no alto das colunas;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “globos” ou “formas arredondadas”; é incerta a forma arquitetônica exata indicada pelo hebraico.
    reason: lexical_alternative
  - marker: b
    text: Ou “redes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדִים
  choice: colunas
  rationale: Termo arquitetônico natural e preciso em português para as duas estruturas do templo.
- source_word: גֻּלּוֹת
  choice: bojos
  rationale: Expressa formas arredondadas ou abauladas associadas aos capitéis, sem definir com excessiva certeza o formato arquitetônico exato.
- source_word: כֹּתָרוֹת
  choice: capitéis
  rationale: Designação arquitetônica corrente para os elementos ornamentais no topo das colunas.
- source_word: רֹאשׁ
  choice: no alto
  rationale: Transmite naturalmente o sentido espacial de 'cabeça/topo' neste contexto arquitetônico.
- source_word: שְּׂבָכוֹת
  choice: treliças
  rationale: Descreve estruturas ornamentais entrelaçadas, semelhantes a redes, em linguagem arquitetônica compreensível.
- source_word: לְכַסּוֹת
  choice: para cobrir
  rationale: Preserva o valor de finalidade do infinitivo hebraico.
- source_word: אֲשֶׁר
  choice: que ficavam
  rationale: Introduz com naturalidade a oração relativa e indica a localização dos capitéis no inventário.
- source_word: שְׁנַיִם / שְׁתַּיִם / שְׁתֵּי
  choice: dois / duas
  rationale: Mantém todas as repetições numéricas do inventário hebraico, com a concordância exigida em português.
