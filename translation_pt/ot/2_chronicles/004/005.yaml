  text: וְ/עָבְי֣/וֹ טֶ֔פַח וּ/שְׂפָת/וֹ֙ כְּ/מַעֲשֵׂ֣ה שְׂפַת כּ֔וֹס פֶּ֖רַח שֽׁוֹשַׁנָּ֑ה מַחֲזִ֣יק בַּתִּ֔ים שְׁלֹ֥שֶׁת אֲלָפִ֖ים יָכִֽיל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/005.yaml
  text: Its thickness was a handbreadth[a], and its rim was like the work of the rim of a cup, like a lily blossom[b]. It could hold three thousand baths.
translation:
  language: pt
  text: Sua espessura era de um palmo[a], e sua borda era como o trabalho da borda de um cálice, como uma flor de lírio. Sua capacidade era de três mil batos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Um palmo era uma antiga medida de comprimento, aproximadamente a largura de uma mão.
    reason: cultural_note
  - marker: b
    text: Um bato era uma antiga unidade hebraica de volume líquido. Em 1 Reis 7:26, o tanque comporta dois mil batos; a diferença pode refletir a capacidade total em contraste com o volume normalmente utilizado, ou uma diferença na tradição textual.
    reason: cross_reference
lexical_decisions:
- source_word: עָבְיוֹ
  choice: sua espessura
  rationale: O substantivo indica a espessura da parede de metal fundido do grande tanque; “espessura” é natural e precisa no contexto.
- source_word: טֶפַח
  choice: um palmo
  rationale: Designa uma pequena unidade linear, aproximadamente a largura de uma mão. “Palmo” é a forma tradicional e compreensível em português, com esclarecimento em nota.
- source_word: שְׂפָתוֹ / שְׂפַת כּוֹס
  choice: sua borda / a borda de um cálice
  rationale: שָׂפָה, aplicado a recipientes, refere-se ao lábio ou à borda. A repetição de “borda” preserva a comparação explícita do hebraico.
- source_word: כְּמַעֲשֵׂה
  choice: era trabalhada como
  rationale: A expressão aponta para a feitura ou o formato artesanal da borda. “Era trabalhada como” comunica esse aspecto sem tornar a frase excessivamente literal.
- source_word: פֶּרַח שׁוֹשַׁנָּה
  choice: uma flor de lírio
  rationale: A expressão descreve o formato ornamental da borda. “Flor de lírio” conserva a imagem e permanece natural em português.
- source_word: מַחֲזִיק ... יָכִיל
  choice: sua capacidade era de
  rationale: O particípio e o verbo juntos enfatizam a capacidade do recipiente. Esta formulação evita repetição artificial em português e preserva o sentido funcional.
- source_word: בַּתִּים
  choice: batos
  rationale: É o plural da antiga unidade hebraica de volume líquido “bato”. A transliteração preserva a unidade da fonte, explicada em nota.
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: três mil
  rationale: Tradução direta do numeral que expressa a capacidade.
theological_decisions:
- issue: Diferença de capacidade em relação a 1 Reis 7:26
  choice: Manter “três mil batos” no texto e registrar a variante paralela em nota
  alternative: Harmonizar o número com os “dois mil batos” de 1 Reis 7:26
  rationale: O texto massorético de 2 Crônicas 4:5 traz claramente três mil. A tradução deve preservar a leitura recebida e a tensão textual, sem impor uma harmonização; a nota informa o leitor sobre o paralelo.
translation_notes:
  register: 'Português moderno, digno e de leitura ampla, com sintaxe natural e preservação das imagens arquitetônicas do hebraico. As notas são colocadas junto aos termos que de fato esclarecem: “palmo” recebe a nota de medida linear, e “batos” recebe tanto a explicação da unidade quanto a observação sobre 1 Reis 7:26.'
