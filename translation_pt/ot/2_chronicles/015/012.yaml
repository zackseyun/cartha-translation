  text: וַ/יָּבֹ֣אוּ בַ/בְּרִ֔ית לִ/דְר֕וֹשׁ אֶת יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֑ם בְּ/כָל לְבָבָ֖/ם וּ/בְ/כָל נַפְשָֽׁ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/012.yaml
  text: And they entered into the covenant to seek Yahweh[a], the God of their fathers[b], with all their heart and with all their soul.
translation:
  language: pt
  text: E entraram em aliança[a] para buscar Yahweh, o Deus de seus pais[b], de todo o coração e de toda a alma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “comprometeram-se por aliança”.'
    reason: lexical_alternative
  - marker: b
    text: Hebraico “pais”; isto é, seus antepassados.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ בַבְּרִית
  choice: entraram na aliança
  rationale: A combinação de בוא com בַּבְּרִית descreve o ato de assumir formalmente o compromisso da aliança. A formulação portuguesa é natural e conserva a imagem do hebraico.
- source_word: לִדְרוֹשׁ
  choice: de buscar
  rationale: Neste contexto religioso e pactual, דרש significa voltar-se para Deus e buscá-lo, não apenas consultá-lo ou fazer-lhe perguntas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: o Deus de seus pais
  rationale: Preserva a forma masculina e a ressonância ancestral e pactual da expressão hebraica.
- source_word: בְּכָל לְבָבָם
  choice: de todo o coração
  rationale: Expressão corrente em português que comunica a totalidade da vontade, intenção e interioridade.
- source_word: וּבְכָל נַפְשָׁם
  choice: e de toda a alma
  rationale: Conserva a formulação pactual tradicional e exprime a entrega integral da pessoa, embora נֶפֶשׁ também possa significar vida ou ser.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal de Deus; a transliteração preserva essa distinção sem substituí-lo por um título.
- issue: Linguagem ancestral em אֲבוֹתֵיהֶם
  choice: seus pais
  alternative: seus antepassados
  rationale: A escolha mantém a forma masculina plural do hebraico e sua conhecida fórmula pactual, sem impedir o sentido mais amplo de antepassados.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “entraram na aliança” mantém a metáfora hebraica; “de todo o coração e de toda a alma” preserva o paralelismo e a fórmula de devoção total.
