revisions:
- from: E entraram na aliança de buscar a Yahweh, o Deus de seus pais[a], de todo o coração e de toda a alma.
  to: E entraram em aliança[a] para buscar Yahweh, o Deus de seus pais[b], de todo o coração e de toda a alma.
  rationale: A revisão corrige a regência de «buscar», substitui a formulação menos idiomática «na aliança de buscar» por «em aliança para buscar» e organiza as notas junto aos termos a que se referem. Não altera o sentido nem introduz interpretação doutrinária.
