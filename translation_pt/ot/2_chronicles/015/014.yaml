source:
  edition: WLC
  text: וַ/יִּשָּֽׁבְעוּ֙ לַ/יהוָ֔ה בְּ/ק֥וֹל גָּד֖וֹל וּ/בִ/תְרוּעָ֑ה וּ/בַ/חֲצֹצְר֖וֹת וּ/בְ/שׁוֹפָרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/014.yaml
  text: And they swore to Yahweh with a loud voice[a], with shouting, and with trumpets and horns.
translation:
  language: pt
  text: E juraram a Yahweh em alta voz, com aclamações, ao som de trombetas e de chifres.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «shofares». O texto distingue esses instrumentos de chifre das trombetas mencionadas imediatamente antes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבְעוּ
  choice: E juraram
  rationale: O nifal de שׁבע indica prestar juramento. «Juraram» é natural e conciso, preservando o caráter solene e pactual da ação.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição לְ assinala aquele a quem o juramento foi feito; o nome divino יהוה é transliterado como «Yahweh».
- source_word: בְּקוֹל גָּדוֹל
  choice: em alta voz
  rationale: A expressão idiomática indica grande volume vocal; «em alta voz» é clara e corrente em português.
- source_word: וּבִתְרוּעָה
  choice: com aclamações
  rationale: תְּרוּעָה pode designar grito, clamor ou aclamação. Neste contexto coletivo, cerimonial e acompanhado por instrumentos, «aclamações» preserva o sentido sem introduzir conotação militar.
- source_word: וּבַחֲצֹצְרוֹת
  choice: ao som de trombetas
  rationale: חֲצֹצְרוֹת designa trombetas retas, provavelmente metálicas. A formulação portuguesa explicita naturalmente que os instrumentos eram tocados.
- source_word: וּבְשׁוֹפָרוֹת
  choice: e de chifres
  rationale: שׁוֹפָרוֹת são instrumentos feitos de chifre e distintos das חֲצֹצְרוֹת. «Chifres» mantém essa distinção em linguagem acessível, enquanto a nota registra a alternativa transliterada.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. «Yahweh» preserva o nome pactual e segue a orientação fornecida, sem substituí-lo por um título.
translation_notes:
  register: 'Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. «Ao som de» evita uma sequência pesada de complementos com «com» e comunica naturalmente o uso dos instrumentos. A coordenação preserva a progressão hebraica: voz elevada, aclamações e instrumentos.'
