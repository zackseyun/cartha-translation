base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/006.yaml
  text: Nation was crushed by nation[a], and city by city, for God troubled them with every kind of distress.
translation:
  language: pt
  text: Uma nação foi esmagada por outra, e uma cidade por outra, pois Deus os lançou em confusão[a] com toda espécie de angústia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: os perturbou.'
    reason: Alternativa lexical para הֲמָמָם, que pode indicar causar perturbação, tumulto ou confusão.
lexical_decisions:
- source_word: וְכֻתְּתוּ
  choice: era esmagada
  rationale: O pual de כתת expressa ser quebrado, despedaçado ou esmagado. O imperfeito português descreve com naturalidade a situação recorrente apresentada no contexto, sem enfraquecer a violência do verbo.
- source_word: גוֹי בְּגוֹי
  choice: uma nação por outra
  rationale: 'A preposição ב marca aqui a interação hostil e pode indicar o agente na construção passiva. A formulação explicita de modo natural em português o sentido distributivo: uma nação era esmagada por outra.'
- source_word: וְעִיר בְּעִיר
  choice: e uma cidade por outra
  rationale: Mantém o paralelismo conciso com a oração anterior e comunica o conflito entre cidades.
- source_word: כִּי
  choice: pois
  rationale: Introduz a causa da devastação descrita anteriormente.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma seja morfologicamente plural, o verbo singular e o contexto apontam para o Deus único.
- source_word: הֲמָמָם
  choice: os lançava em confusão
  rationale: O verbo המם pode denotar causar tumulto, confusão ou pânico. A escolha preserva sua força causativa e mantém expresso o sufixo pronominal masculino plural.
- source_word: בְּכָל צָרָה
  choice: com toda espécie de angústia
  rationale: A preposição pode ter valor instrumental ou circunstancial, e כָּל dá sentido abrangente. A expressão é idiomática e preserva a ideia de toda forma de aflição.
theological_decisions:
- issue: Agência das calamidades
  choice: Deus os lançava em confusão
  alternative: Deus permitia que fossem afligidos
  rationale: O hebraico apresenta Deus como sujeito de um verbo ativo e causativo. A tradução preserva essa agência explícita, sem convertê-la em mera permissão nem acrescentar uma explicação teológica ausente do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O paralelismo do hebraico foi preservado sem recorrer a construções excessivamente literais.
