  text: וְ/אַתֶּ֣ם חִזְק֔וּ וְ/אַל יִרְפּ֖וּ יְדֵי/כֶ֑ם כִּ֛י יֵ֥שׁ שָׂכָ֖ר לִ/פְעֻלַּתְ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/007.yaml
  text: But as for you[a], be strong, and do not let your hands grow weak, for there is a reward for your work.
translation:
  language: pt
  text: Mas vocês, sejam fortes e não deixem que suas mãos enfraqueçam, pois há recompensa para o trabalho de vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: Mas vocês
  rationale: A conjunção com o pronome independente dá ênfase contrastiva em relação ao contexto anterior; “Mas vocês” expressa isso de modo natural e direto.
- source_word: חִזְקוּ
  choice: sejam fortes
  rationale: O imperativo plural de חזק exorta à força e firmeza; a formulação preserva o sentido e concorda com o destinatário plural.
- source_word: וְ/אַל יִרְפּוּ יְדֵי/כֶם
  choice: e não deixem que suas mãos enfraqueçam
  rationale: A construção negativa proíbe que as mãos se tornem fracas. A imagem hebraica é mantida porque continua compreensível em português e comunica perda de força, ânimo ou determinação.
- source_word: כִּי יֵשׁ
  choice: pois há
  rationale: כִּי introduz a razão da exortação, e יֵשׁ é uma afirmação existencial. “Pois há” preserva ambos sem converter explicitamente a promessa em tempo futuro.
- source_word: שָׂכָר
  choice: recompensa
  rationale: O substantivo pode denotar recompensa, salário ou retribuição. “Recompensa” é amplo e adequado ao contexto exortativo, sem restringir o sentido a pagamento laboral.
- source_word: לִ/פְעֻלַּתְ/כֶם
  choice: para o trabalho de vocês
  rationale: פְעֻלָּה designa trabalho, atividade ou obra. A opção é clara em português moderno e mantém a relação explícita entre a ação realizada e a recompensa.
theological_decisions:
- issue: Natureza da linguagem de recompensa
  choice: pois há recompensa para o trabalho de vocês
  alternative: pois o trabalho de vocês será recompensado
  rationale: O texto usa uma construção existencial e promete retribuição como incentivo à fidelidade, mas não define uma doutrina de mérito. A tradução mantém a afirmação direta sem acrescentar categorias teológicas posteriores.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. O pronome “vocês” torna explícito o plural hebraico; a expressão “trabalho de vocês” evita a ambiguidade regional de “seu trabalho”. A imagem concreta das mãos foi preservada, sem necessidade de nota, pois seu sentido idiomático permanece acessível no contexto.
