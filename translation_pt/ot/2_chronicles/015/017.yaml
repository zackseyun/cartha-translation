  text: וְ/הַ֨/בָּמ֔וֹת לֹא סָ֖רוּ מִ/יִּשְׂרָאֵ֑ל רַ֧ק לְבַב אָסָ֛א הָיָ֥ה שָׁלֵ֖ם כָּל יָמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/017.yaml
  text: But the high places were not removed from Israel; nevertheless, Asa’s heart was whole all his days.
translation:
  language: pt
  text: Mas os lugares altos não foram removidos de Israel; contudo, o coração de Asa foi íntegro durante todos os seus dias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבָּמוֹת
  choice: os lugares altos
  rationale: Mantém o termo bíblico convencional para os locais elevados de culto, sem especificar além do hebraico se eram santuários legítimos ou ilícitos neste contexto.
- source_word: לֹא סָרוּ
  choice: não foram removidos
  rationale: Expressa naturalmente em português o sentido passivo contextual de que esses locais não desapareceram nem foram eliminados.
- source_word: שָׁלֵם
  choice: íntegro
  rationale: Preserva a ideia de inteireza ou ausência de divisão do coração, sem expandi-la para uma formulação interpretativa como “plenamente dedicado”.
- source_word: כָּל יָמָיו
  choice: durante todos os seus dias
  rationale: Reproduz a expressão temporal hebraica com clareza e dignidade.
theological_decisions:
- issue: A coexistência entre a permanência dos lugares altos e a avaliação positiva do coração de Asa
  choice: Manter ambas as afirmações em tensão, ligadas por “contudo”
  alternative: Explicar a integridade de Asa como perfeição moral ou restringi-la explicitamente apenas à sua lealdade cultual
  rationale: O texto contrasta os fatos sem explicar ou eliminar a tensão; a tradução não deve harmonizá-los por acréscimo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Lugares altos” conserva a terminologia bíblica reconhecível; “coração íntegro” mantém a concisão e a ambiguidade teológica do hebraico.
