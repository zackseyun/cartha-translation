    issue: A nota de rodapé apresenta «haviam caído para o lado dele» como tradução literal.
    rationale: «Para o lado dele» já interpreta a transferência de lealdade e não corresponde à imagem do hebraico נָפְלוּ עָלָיו, literalmente «caíram sobre ele». A explicação subsequente pode esclarecer o sentido político sem chamar uma paráfrase de literal.
  - severity: low
    issue: «que viviam entre eles» amplia «com eles».
    rationale: O hebraico diz simplesmente que os residentes estrangeiros estavam «com eles». «Que estavam com eles» preserva a relação expressa no texto e evita introduzir desnecessariamente a noção espacial de «entre».
