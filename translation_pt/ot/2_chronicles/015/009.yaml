  text: וַ/יִּקְבֹּ֗ץ אֶת כָּל יְהוּדָה֙ וּ/בִנְיָמִ֔ן וְ/הַ/גָּרִים֙ עִמָּ/הֶ֔ם מֵ/אֶפְרַ֥יִם וּ/מְנַשֶּׁ֖ה וּ/מִ/שִּׁמְע֑וֹן כִּֽי נָפְל֨וּ עָלָ֤י/ו מִ/יִּשְׂרָאֵל֙ לָ/רֹ֔ב בִּ/רְאֹתָ֕/ם כִּֽי יְהוָ֥ה אֱלֹהָ֖י/ו עִמּֽ/וֹ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/009.yaml
  text: And he gathered all Judah and Benjamin[a], and the sojourners with them from Ephraim, Manasseh, and Simeon, because many from Israel had fallen to him when they saw that Yahweh his God was with him.
translation:
  language: pt
  text: Ele reuniu todo o povo de Judá e de Benjamim, bem como os residentes estrangeiros que estavam com eles, vindos de Efraim, de Manassés e de Simeão, pois muitos de Israel haviam passado para o lado dele[a] ao verem que Yahweh, seu Deus, estava com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «haviam se juntado a ele»; literalmente, «haviam caído sobre ele». A expressão hebraica indica que essas pessoas transferiram sua lealdade para Asa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: Ele reuniu
  rationale: O qal narrativo de קבץ indica reunir ou ajuntar pessoas; «reuniu» é natural e mantém o sentido concreto.
- source_word: כָּל יְהוּדָה וּבִנְיָמִן
  choice: todo o povo de Judá e de Benjamim
  rationale: Os nomes tribais e territoriais representam metonimicamente seus habitantes. A explicitação de «povo» evita a impressão, pouco natural em português, de que se reuniram territórios.
- source_word: הַגָּרִים עִמָּהֶם
  choice: os residentes estrangeiros que viviam entre eles
  rationale: גֵּר designa quem reside fora de seu grupo ou terra de origem; a formulação moderna preserva a condição social sem a conotação passageira que «peregrinos» teria hoje.
- source_word: מֵאֶפְרַיִם וּמְנַשֶּׁה וּמִשִּׁמְעוֹן
  choice: vindos de Efraim, de Manassés e de Simeão
  rationale: A preposição מִן marca a procedência dessas pessoas; «vindos de» torna essa relação clara em português.
- source_word: נָפְלוּ עָלָיו
  choice: haviam passado para o lado dele
  rationale: O idiomatismo político נפל על descreve a transferência de lealdade. A tradução comunica esse sentido sem impor a carga moderna específica de «desertar»; a nota preserva a imagem literal.
- source_word: מִיִּשְׂרָאֵל לָרֹב
  choice: muitos de Israel
  rationale: לָרֹב expressa grande quantidade; «muitos de Israel» é conciso e idiomático.
- source_word: בִּרְאֹתָם
  choice: ao verem
  rationale: O infinitivo construto com בְּ indica a circunstância que motivou sua mudança de lealdade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אֱלֹהָיו עִמּוֹ
  choice: seu Deus, estava com ele
  rationale: Mantém diretamente a afirmação da presença e do apoio divinos sem ampliá-la interpretativamente.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome próprio divino; «Yahweh» o representa diretamente, enquanto «SENHOR» o substituiria por um título.
- issue: Sentido político de נָפְלוּ עָלָיו
  choice: haviam passado para o lado dele
  alternative: haviam caído sobre ele
  rationale: No contexto, a expressão indica transferência de lealdade a Asa. A opção escolhida comunica o idiomatismo, e a nota conserva sua forma literal e a alternativa «se juntado a ele».
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A construção explicita «povo» e traduz גֵּר de modo socialmente claro; conserva o nome Yahweh e, em nota, a imagem do idiomatismo hebraico.
