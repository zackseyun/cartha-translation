  source_fidelity: A tradução comunica corretamente a reunião de Judá, Benjamim e dos residentes estrangeiros procedentes das tribos do Norte, bem como a adesão de muitos israelitas a Asa por reconhecerem a presença de Yahweh com ele. Contudo, a nota chama de literal uma formulação que já interpreta o idiomatismo hebraico.
  naturalness: O registro é moderno, claro e apropriado. «Que estavam com eles» reproduz com mais precisão e concisão «com eles» do que «que viviam entre eles», sem perder a noção de residência contida em «residentes estrangeiros».
  terminology: «Residentes estrangeiros», «Yahweh» e «haviam passado para o lado dele» são escolhas adequadas. A nota deve distinguir a imagem literal de sua explicação idiomática.
  issues:
