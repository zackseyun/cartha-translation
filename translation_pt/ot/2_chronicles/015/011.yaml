  text: וַ/יִּזְבְּח֤וּ לַ/יהוָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא מִן הַ/שָּׁלָ֖ל הֵבִ֑יאוּ בָּקָר֙ שְׁבַ֣ע מֵא֔וֹת וְ/צֹ֖אן שִׁבְעַ֥ת אֲלָפִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/011.yaml
  text: 'On that day they sacrificed to Yahweh from the spoil they had brought: seven hundred cattle and seven thousand sheep[a][b].'
translation:
  language: pt
  text: 'Naquele dia, sacrificaram a Yahweh parte dos despojos que haviam trazido: setecentas cabeças de gado e sete mil ovelhas[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “parte do saque”. O termo hebraico indica bens ou animais tomados como despojos de guerra.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico pode designar mais amplamente animais de rebanho, isto é, ovelhas e cabras, e não apenas ovelhas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבְּחוּ
  choice: sacrificaram
  rationale: Em contexto cúltico, זבח designa o sacrifício ritual de animais; “sacrificaram” é conciso, natural e preserva esse sentido.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל marca o destinatário do sacrifício, e o nome divino יהוה é transliterado como “Yahweh”.
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Equivalente temporal corrente e natural em português.
- source_word: מִן הַשָּׁלָל
  choice: parte dos despojos
  rationale: שָׁלָל refere-se ao produto capturado em guerra. O partitivo מִן indica que os animais sacrificados provinham dos despojos, não necessariamente que constituíam sua totalidade.
- source_word: הֵבִיאוּ
  choice: que haviam trazido
  rationale: 'O mais-que-perfeito composto deixa clara a anterioridade: os despojos já tinham sido trazidos quando os sacrifícios foram realizados.'
- source_word: בָּקָר
  choice: cabeças de gado
  rationale: בָּקָר é um coletivo para bovinos; com o numeral, “cabeças de gado” soa natural em português e evita restringir o termo a bois.
- source_word: שְׁבַע מֵאוֹת
  choice: setecentas
  rationale: Tradução direta do numeral cardinal, com concordância com “cabeças”.
- source_word: וְצֹאן
  choice: e ... ovelhas
  rationale: צֹאן pode abranger o gado miúdo, incluindo ovelhas e cabras. “Ovelhas” favorece a leitura corrente, enquanto a amplitude lexical é preservada em nota.
- source_word: שִׁבְעַת אֲלָפִים
  choice: sete mil
  rationale: Tradução direta do numeral cardinal.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a ordem informacional do hebraico, explicita naturalmente a relação partitiva de מִן e preserva em nota a extensão semântica de צֹאן.
