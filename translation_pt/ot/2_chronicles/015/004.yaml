  text: וַ/יָּ֨שָׁב֙ בַּ/צַּר ל֔/וֹ עַל יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וַ/יְבַקְשֻׁ֖/הוּ וַ/יִּמָּצֵ֥א לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/004.yaml
  text: But in their distress they returned to Yahweh[a], the God of Israel, and sought him[b], and he was found by them.
translation:
  language: pt
  text: Mas, em sua aflição[a], eles voltaram para Javé, o Deus de Israel, e o buscaram; e ele foi encontrado por eles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais formalmente, “em sua aflição”; o singular hebraico se refere coletivamente a Israel.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ele se deixou encontrar por eles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: eles voltaram
  rationale: שׁוּב expressa voltar ou retornar. O plural torna explícito o referente coletivo, Israel, em harmonia com as formas plurais que aparecem em seguida; a forma singular do hebraico é registrada em nota.
- source_word: בַּצַּר לוֹ
  choice: em sua aflição
  rationale: צַר denota aflição ou angústia neste contexto. A expressão portuguesa mantém concisão e permite entender o possessivo coletivamente, enquanto a nota registra a forma singular do hebraico.
- source_word: עַל יְהוָה
  choice: para Javé
  rationale: Com שׁוּב, a preposição עַל indica a pessoa para quem se volta ou retorna. 'Voltaram para Javé' comunica naturalmente o movimento relacional de retorno.
- source_word: יְהוָה
  choice: Javé
  rationale: A transliteração portuguesa corrente do nome divino preserva o nome pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta da cadeia construta, preservando a identificação pactual de Javé com Israel.
- source_word: וַיְבַקְשֻׁהוּ
  choice: o buscaram
  rationale: בקשׁ com Deus como objeto significa buscá-lo, recorrendo a ele; a colocação pronominal é natural e amplamente compreensível em português moderno.
- source_word: וַיִּמָּצֵא לָהֶם
  choice: ele se deixou encontrar por eles
  rationale: O nifal de מצא pode ser traduzido de modo estritamente passivo, mas esta formulação portuguesa conserva a ideia relacional de que Deus se tornou acessível aos que o buscaram, sem sugerir uma descoberta casual. A alternativa formal é preservada em nota.
theological_decisions:
- issue: Singular coletivo no início do versículo
  choice: Empregar o plural 'eles voltaram', entendendo o singular hebraico coletivamente como referência a Israel
  alternative: 'Traduzir formalmente no singular: ''em sua aflição, ele voltou'''
  rationale: As formas subsequentes são plurais, e o contexto trata de Israel como coletividade. O plural evita um referente singular obscuro em português, enquanto a nota preserva a forma do texto-fonte.
- issue: Agência divina em וַיִּמָּצֵא לָהֶם
  choice: ele se deixou encontrar por eles
  alternative: ele foi encontrado por eles
  rationale: A construção hebraica admite o passivo simples. A opção principal evita a impressão de descoberta acidental e expressa a resposta divina sem eliminar a alternativa formal, que consta em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com 'Javé' para o nome divino. A coordenação foi pontuada com ponto e vírgula para tornar clara a passagem do retorno à busca e à resposta divina. As notas preservam tanto o singular coletivo quanto a possibilidade do passivo mais formal.
