  text: וְ/גַֽם מַעֲכָ֞ה אֵ֣ם אָסָ֣א הַ/מֶּ֗לֶךְ הֱסִירָ/הּ֙ מִ/גְּבִירָ֔ה אֲשֶׁר עָשְׂתָ֥ה לַ/אֲשֵׁרָ֖ה מִפְלָ֑צֶת וַ/יִּכְרֹ֤ת אָסָא֙ אֶת מִפְלַצְתָּ֔/הּ וַ/יָּ֕דֶק וַ/יִּשְׂרֹ֖ף בְּ/נַ֥חַל קִדְרֽוֹן־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/016.yaml
  text: Even Maacah[a], the mother of King Asa, he removed from being queen mother, because she had made a dreadful image for Asherah; and Asa cut down her dreadful image, crushed it[c][b], and burned it in the Kidron Valley.
translation:
  language: pt
  text: Até mesmo Maaca, mãe do rei Asa, ele destituiu da posição de rainha-mãe, porque ela havia feito uma imagem repulsiva[a] para Aserá[b]. Asa cortou a imagem dela, triturou-a e a queimou no vale do Cedrom.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma imagem abominável”, “um objeto horrendo”. O termo hebraico descreve um objeto cultual repulsivo ou aterrador.
    reason: lexical_alternative
  - marker: b
    text: “Aserá” pode referir-se à deusa ou ao símbolo cultual associado a ela; traduções antigas às vezes usam “bosque”.
    reason: cultural_note
  - marker: c
    text: Ou “no uádi do Cedrom” ou “junto ao ribeiro do Cedrom”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Até
  rationale: Expressa a adição enfática e o caráter surpreendente de a reforma alcançar uma integrante próxima da família real.
- source_word: מַעֲכָה
  choice: Maaca
  rationale: Transliteração tradicional e inteligível do nome próprio em português.
- source_word: אֵם אָסָא הַמֶּלֶךְ
  choice: mãe do rei Asa
  rationale: Reproduz diretamente a relação familiar e a identificação régia do texto hebraico, sem tentar resolver no corpo do versículo questões genealógicas externas.
- source_word: הֱסִירָהּ מִגְּבִירָה
  choice: ele destituiu da posição de rainha-mãe
  rationale: O verbo indica remoção, e גְּבִירָה, neste contexto régio, designa a dignidade ou função da rainha-mãe. 'Destituiu da posição' torna explícito que se trata da perda de status, não de remoção física.
- source_word: אֲשֶׁר עָשְׂתָה לַאֲשֵׁרָה
  choice: porque ela havia feito ... para Aserá
  rationale: A oração apresenta a razão da destituição. 'Para Aserá' preserva a referência cultual sem determinar indevidamente se o termo denota aqui a deusa ou seu símbolo.
- source_word: מִפְלָצֶת
  choice: uma imagem repulsiva
  rationale: O substantivo designa algo cultualmente horrendo, aterrador ou abominável. 'Imagem' é uma explicitação contextual moderada, e 'repulsiva' comunica a forte avaliação negativa sem especificar sua forma.
- source_word: וַיִּכְרֹת
  choice: derrubou
  rationale: O verbo significa cortar ou abater. 'Derrubou' é natural para um objeto cultual que podia ser cortado e depois destruído.
- source_word: וַיָּדֶק
  choice: reduziu-a a pedaços
  rationale: Comunica a destruição minuciosa do objeto, podendo o hebraico sugerir esmagamento ou pulverização.
- source_word: וַיִּשְׂרֹף
  choice: a queimou
  rationale: Equivalente direto e natural do verbo hebraico.
- source_word: בְּנַחַל קִדְרוֹן
  choice: no vale do Cedrom
  rationale: נַחַל pode designar vale, ravina, uádi ou curso d'água sazonal. 'Vale do Cedrom' é claro e corrente em português.
theological_decisions:
- issue: Sentido de אֲשֵׁרָה
  choice: Aserá, mantendo o nome e a ambiguidade entre a divindade e o símbolo cultual associado a ela
  alternative: poste-ídolo de Aserá; bosque sagrado
  rationale: O hebraico não exige que se especifique aqui a forma exata do objeto. Manter 'Aserá' preserva o contexto religioso antigo e evita a tradução tradicional imprecisa 'bosque'.
- issue: Título régio גְּבִירָה
  choice: rainha-mãe
  alternative: grande senhora; senhora
  rationale: No contexto da monarquia de Judá, o termo indica mais naturalmente a mulher que ocupava a dignidade oficial de rainha-mãe, ainda que a relação genealógica precisa possa, em certos casos, ser mais ampla.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com vocabulário acessível no Brasil e inteligível internacionalmente. A sintaxe conserva a ênfase inicial do hebraico, e as notas preservam ambiguidades lexicais e culturais sem sobrecarregar o texto principal.
