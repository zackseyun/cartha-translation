base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/018.yaml
  text: 'He brought into the house of God his father''s holy gifts and his own holy gifts: silver, gold, and vessels.'
translation:
  language: pt
  text: 'Ele levou para a casa de Deus os bens consagrados de seu pai e os seus: prata, ouro e utensílios.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָדְשֵׁי אָבִיו
  choice: as dádivas consagradas por seu pai
  rationale: O substantivo no plural designa coisas separadas como sagradas; no contexto de prata, ouro e utensílios, “dádivas consagradas” comunica com naturalidade que eram bens dedicados a Deus.
- source_word: וְקָדָשָׁיו
  choice: e as que ele mesmo havia consagrado
  rationale: A forma pode significar literalmente “e suas coisas consagradas”. A oração evita a repetição pesada e deixa claro que o segundo possessivo se refere ao próprio Asa, em contraste com seu pai.
- source_word: בֵּית הָאֱלֹהִים
  choice: a casa de Deus
  rationale: Tradução direta da expressão hebraica, mantendo sua designação cultual sem substituir por um termo interpretativo.
- source_word: כֶּסֶף וְזָהָב וְכֵלִים
  choice: prata, ouro e utensílios
  rationale: Preserva os três itens coordenados; “utensílios” é amplo o bastante para כֵּלִים, que pode abranger objetos, recipientes ou artigos usados no templo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação preserva a distinção entre os bens consagrados pelo pai e os consagrados pelo próprio rei, sem acrescentar uma identificação ausente neste versículo.
