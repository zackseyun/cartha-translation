  source_fidelity: 'A construção hebraica traz dois sintagmas possessivos paralelos: «as coisas consagradas de seu pai» e «as suas coisas consagradas». A redação proposta, «consagradas por seu pai» e «ele mesmo havia consagrado», transforma os possessivos em afirmações explícitas sobre quem realizou a consagração. Embora isso se ajuste ao contexto, restringe uma formulação que o hebraico deixa possessiva.'
  naturalness: A revisão mantém uma formulação moderna, clara e natural em português internacional. A elipse em «e os seus» evita repetição desnecessária, e a enumeração final esclarece a natureza dos bens.
  terminology: «Bens consagrados» representa adequadamente os objetos dedicados a Deus sem sugerir especificamente ofertas sacrificiais nem limitar כֵּלִים a uma classe técnica de instrumentos. «Casa de Deus» preserva a expressão cultual do texto.
