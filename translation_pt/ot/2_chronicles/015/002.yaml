base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/002.yaml
  text: 'He went out to meet Asa and said to him[a], “Hear me, Asa, and all Judah and Benjamin: Yahweh is with you while you are with him. If you seek him, he will be found by you; but if you forsake him, he will forsake you.”'
translation:
  language: pt
  text: 'Ele saiu ao encontro de Asa e lhe disse: “Ouçam-me, Asa e todo o Judá e Benjamim: Yahweh está com vocês enquanto vocês estão com ele. Se vocês o buscarem, ele será encontrado por vocês; mas, se o abandonarem, ele abandonará vocês.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא לִפְנֵי אָסָא
  choice: Ele saiu ao encontro de Asa
  rationale: O verbo יצא faz a narrativa avançar, e לִפְנֵי, após um verbo de movimento, indica aqui sair para encontrar Asa, não apenas ficar diante dele.
- source_word: שְׁמָעוּנִי
  choice: Ouçam-me
  rationale: O imperativo está no plural e inclui Asa, Judá e Benjamim. “Ouçam-me” transmite com naturalidade a exortação profética direta.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עִמָּכֶם ... עִמּוֹ
  choice: está com vocês ... vocês estão com ele
  rationale: Mantém a repetição de עִם e a reciprocidade retórica da declaração hebraica.
- source_word: בִּהְיוֹתְכֶם
  choice: enquanto vocês estão
  rationale: O infinitivo construto com בְּ expressa uma circunstância temporal contínua; “enquanto” conserva também a força condicional do contexto.
- source_word: תִּדְרְשֻׁהוּ
  choice: vocês o buscarem
  rationale: דרש, neste contexto religioso e pactual, significa buscar Yahweh, e não apenas consultá-lo ou fazer-lhe uma pergunta.
- source_word: יִמָּצֵא לָכֶם
  choice: ele se deixará encontrar por vocês
  rationale: A formulação portuguesa expressa de modo natural o nifal de מצא e conserva Deus como sujeito da oração. A tradução passiva mais estrita é registrada em nota.
- source_word: תַּעַזְבֻהוּ ... יַעֲזֹב אֶתְכֶם
  choice: se o abandonarem, ele abandonará vocês
  rationale: A repetição de “abandonar” preserva a correspondência enfática e recíproca do mesmo verbo hebraico, עזב.
theological_decisions:
- issue: Reciprocidade condicional na linguagem da aliança
  choice: Manter como condições reais a presença de Yahweh enquanto o povo está com ele e os resultados correspondentes de buscá-lo ou abandoná-lo.
  alternative: Atenuar as afirmações como se descrevessem apenas a experiência subjetiva da presença divina.
  rationale: O hebraico emprega relações condicionais explícitas e formulações recíprocas. A tradução mantém essa tensão sem impor ao versículo um sistema doutrinário mais amplo sobre perseverança ou apostasia.
- issue: Nuance de יִמָּצֵא, “ser encontrado”
  choice: “ele se deixará encontrar por vocês”, com a forma passiva estrita em nota.
  alternative: “ele será encontrado por vocês”.
  rationale: A escolha principal é idiomática em português e pode comunicar a acessibilidade concedida por Deus, enquanto a nota preserva de modo transparente a forma passiva e a possível ambiguidade do nifal.
translation_notes:
  register: Português atual, digno e acessível, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. Emprega “vocês” para tornar inequívoco o plural do discurso e evita arcaísmos como “ouvi-me” e “vós”.
