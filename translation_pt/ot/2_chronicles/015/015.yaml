  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּשְׂמְח֨וּ כָל יְהוּדָ֜ה עַל הַ/שְּׁבוּעָ֗ה כִּ֤י בְ/כָל לְבָבָ/ם֙ נִשְׁבָּ֔עוּ וּ/בְ/כָל רְצוֹנָ֣/ם בִּקְשֻׁ֔/הוּ וַ/יִּמָּצֵ֖א לָ/הֶ֑ם וַ/יָּ֧נַח יְהוָ֛ה לָ/הֶ֖ם מִ/סָּבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/015.yaml
  text: And all Judah rejoiced over the oath[a], because they had sworn with all their heart and sought him with all their will, and he let himself be found by them, and Yahweh gave them rest all around.
translation:
  language: pt
  text: Todo o povo de Judá se alegrou por causa do juramento, pois haviam jurado de todo o coração e o buscado com toda a sua vontade. Ele deixou que o encontrassem[a], e Yahweh lhes deu descanso por todos os lados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Ele foi encontrado por eles”.'
    reason: Alternativa lexical que preserva a forma passiva do hebraico.
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: se alegrou
  rationale: O verbo שׂמח expressa alegria; o singular concorda naturalmente com o sujeito coletivo “todo o povo de Judá”.
- source_word: כָל יְהוּדָה
  choice: todo o povo de Judá
  rationale: Explicita o sentido coletivo da expressão hebraica e evita que “Judá” seja entendido apenas como território.
- source_word: עַל הַשְּׁבוּעָה
  choice: por causa do juramento
  rationale: Com um verbo de emoção, עַל indica naturalmente o motivo da alegria.
- source_word: בְכָל לְבָבָם נִשְׁבָּעוּ
  choice: haviam jurado de todo o coração
  rationale: Preserva a ideia de compromisso integral e apresenta o juramento como anterior à alegria narrada.
- source_word: וּבְכָל רְצוֹנָם בִּקְשֻׁהוּ
  choice: e o buscado com toda a sua vontade
  rationale: Mantém o paralelismo com “de todo o coração” e comunica busca voluntária, resoluta e sincera.
- source_word: וַיִּמָּצֵא לָהֶם
  choice: Ele deixou que o encontrassem
  rationale: Expressa a nuance relacional possível do nifal de מצא no contexto de buscar a Deus, sem ocultar em nota a tradução formalmente mais literal.
- source_word: וַיָּנַח יְהוָה לָהֶם
  choice: Yahweh lhes deu descanso
  rationale: O hifil de נוח significa fazer repousar ou conceder descanso; a formulação preserva também o nome divino.
- source_word: מִסָּבִיב
  choice: por todos os lados
  rationale: Expressão portuguesa natural para segurança e descanso em toda a região circundante.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Translitera o nome pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- issue: Nuance de וַיִּמָּצֵא לָהֶם
  choice: Ele deixou que o encontrassem
  alternative: Ele foi encontrado por eles
  rationale: A tradução principal comunica a resposta favorável de Deus à busca, enquanto a nota preserva a forma passiva e a ambiguidade genuína do hebraico.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A construção coletiva evita anacronismo geográfico, e a nota está ligada à expressão que efetivamente esclarece.
