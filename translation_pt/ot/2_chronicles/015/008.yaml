source:
  edition: WLC
  text: וְ/כִ/שְׁמֹ֨עַ אָסָ֜א הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה וְ/הַ/נְּבוּאָה֮ עֹדֵ֣ד הַ/נָּבִיא֒ הִתְחַזַּ֗ק וַ/יַּעֲבֵ֤ר הַ/שִּׁקּוּצִים֙ מִ/כָּל אֶ֤רֶץ יְהוּדָה֙ וּ/בִנְיָמִ֔ן וּ/מִן הֶ֣/עָרִ֔ים אֲשֶׁ֥ר לָכַ֖ד מֵ/הַ֣ר אֶפְרָ֑יִם וַ/יְחַדֵּשׁ֙ אֶת מִזְבַּ֣ח יְהוָ֔ה אֲשֶׁ֕ר לִ/פְנֵ֖י אוּלָ֥ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/008.yaml
  text: And when Asa heard these words and the prophecy of Oded the prophet[a], he took courage and removed the detestable things from all the land of Judah and Benjamin, and from the cities that he had captured in the hill country of Ephraim; and he renewed the altar of Yahweh that was before the vestibule of Yahweh.
translation:
  language: pt
  text: Quando Asa ouviu essas palavras e a profecia de Odede, o profeta[a], tomou coragem e removeu as coisas repugnantes de toda a terra de Judá e Benjamim e das cidades que havia conquistado na região montanhosa de Efraim. Também renovou o altar de Yahweh, que ficava diante do pórtico de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a profecia de Odede, o profeta”. Alguns intérpretes e debates textuais relacionam esta expressão a Azarias, filho de Odede, mencionado no contexto próximo.'
    reason: textual_variant
lexical_decisions:
- source_word: וְכִשְׁמֹעַ
  choice: Quando Asa ouviu
  rationale: A construção com infinitivo introduz uma oração temporal; esta formulação é natural em português e preserva a sequência narrativa.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: essas palavras
  rationale: No contexto imediato, דְּבָרִים se refere ao discurso profético que Asa acabara de ouvir.
- source_word: וְהַנְּבוּאָה עֹדֵד הַנָּבִיא
  choice: e a profecia de Odede, o profeta
  rationale: Segue diretamente o Texto Massorético fornecido, sem harmonizá-lo com a menção de Azarias, filho de Odede, no contexto próximo.
- source_word: הִתְחַזַּק
  choice: encheu-se de coragem
  rationale: Expressa de modo idiomático o valor reflexivo de fortalecer-se ou cobrar ânimo em resposta à mensagem profética.
- source_word: וַיַּעֲבֵר הַשִּׁקּוּצִים
  choice: removeu as coisas repugnantes
  rationale: O substantivo costuma designar coisas detestáveis associadas à idolatria; a tradução mantém a referência relativamente ampla do hebraico.
- source_word: מִכָּל אֶרֶץ יְהוּדָה וּבִנְיָמִן
  choice: de toda a terra de Judá e Benjamim
  rationale: Mantém o sentido territorial de אֶרֶץ em linguagem clara.
- source_word: וּמִן הֶעָרִים אֲשֶׁר לָכַד מֵהַר אֶפְרָיִם
  choice: e das cidades que havia conquistado na região montanhosa de Efraim
  rationale: לכד significa capturar ou conquistar; a expressão geográfica é vertida de modo natural, reconhecendo o valor locativo contextual de מֵהַר.
- source_word: וַיְחַדֵּשׁ
  choice: renovou
  rationale: Preserva o sentido do Piel de חדשׁ, sem restringi-lo apenas a conserto físico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico em vez de substituí-lo por um título.
- source_word: אוּלָם
  choice: pórtico
  rationale: Termo claro e apropriado para a estrutura situada à frente do templo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O hebraico emprega diretamente o tetragrama; a transliteração preserva seu caráter de nome próprio.
- issue: Tensão textual em torno de עֹדֵד הַנָּבִיא
  choice: Odede, o profeta
  alternative: Azarias, filho de Odede, o profeta
  rationale: O texto principal segue a forma efetivamente atestada no WLC fornecido. A possível relação com Azarias no contexto é informada em nota, sem harmonização silenciosa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Região montanhosa” comunica a geografia sem recorrer a uma expressão excessivamente técnica; “pórtico” mantém o contexto arquitetônico do templo.
