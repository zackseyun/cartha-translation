base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/013.yaml
  text: And everyone who would not seek Yahweh[a], the God of Israel, was to be put to death, from small to great[b], from man to woman.
translation:
  language: pt
  text: E todo aquele que não buscasse o SENHOR[a], o Deus de Israel, seria condenado à morte, do menor ao maior[b], do homem à mulher.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Yahweh”. O nome divino hebraico é יהוה (YHWH), tradicionalmente representado por “SENHOR”.'
    reason: divine_name_alternative
  - marker: b
    text: 'Ou: “do menos importante ao mais importante”. A expressão hebraica indica abrangência de toda a comunidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר
  choice: E todo aquele que
  rationale: A construção introduz uma oração relativa abrangente. A formulação preserva o alcance universal e soa natural em português.
- source_word: לֹא יִדְרֹשׁ
  choice: não buscasse
  rationale: דרשׁ, neste contexto religioso e pactual, significa buscar a Deus. O imperfeito dentro da estipulação do juramento pede aqui o subjuntivo, que preserva seu valor prospectivo e condicional.
- source_word: לַיהוָה
  choice: o SENHOR
  rationale: Emprega a forma tradicional portuguesa para o nome divino יהוה, distinguida tipograficamente em maiúsculas.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta da cadeia construta que identifica o Deus da aliança como o Deus de Israel.
- source_word: יוּמָת
  choice: seria morto
  rationale: O hofal de מות é causativo-passivo e indica que a pessoa seria submetida à morte. Esta formulação mantém a força penal da estipulação dentro do relato do juramento.
- source_word: לְמִן קָטֹן וְעַד גָּדוֹל
  choice: desde o menor até o maior
  rationale: O par idiomático expressa totalidade social sem restringir a referência apenas à idade.
- source_word: לְמֵאִישׁ וְעַד אִשָּׁה
  choice: tanto homem como mulher
  rationale: Reproduz naturalmente em português o par distributivo hebraico e deixa claro que a estipulação abrangia ambos.
theological_decisions:
- issue: A severa pena da aliança
  choice: 'Manter explicitamente a pena de morte: “seria morto”.'
  alternative: Atenuar como “morreria” ou interpretar como exclusão da comunidade.
  rationale: יוּמָת declara que a pessoa seria morta, não apenas que morreria. A tradução não deve suavizar nem reinterpretar a severidade do relato.
- issue: Valor de דרשׁ no contexto da aliança
  choice: Traduzir como “buscasse”.
  alternative: Traduzir como “consultasse” ou resolver o sentido como simples observância externa.
  rationale: “Buscar” preserva a linguagem recorrente do Cronista sobre a relação de Israel com Deus e não reduz o verbo a uma consulta pontual.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A sintaxe conserva o caráter solene e jurídico do juramento sem recorrer a formas excessivamente arcaicas.
