base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/005.yaml
  text: And in those times there was no peace for the one going out or for the one coming in[b][a], because many disturbances were upon all the inhabitants of the lands.
translation:
  language: pt
  text: Naqueles tempos, não havia paz para quem saía nem para quem entrava[a], porque muitos tumultos[b] atingiam todos os habitantes das terras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “saía e entrava” é uma forma hebraica de falar da movimentação comum da vida diária, especialmente viagens ou atividades públicas.
    reason: cultural_note
  - marker: b
    text: Ou “grandes tumultos” ou “muitas perturbações”; o termo hebraico pode indicar tumulto, confusão ou pânico.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָעִתִּים הָהֵם
  choice: Naqueles tempos
  rationale: Expressa naturalmente a referência temporal e preserva o plural e o demonstrativo do hebraico.
- source_word: אֵין שָׁלוֹם
  choice: não havia paz
  rationale: Mantém o sentido amplo de שָׁלוֹם, que neste contexto inclui paz, segurança e bem-estar.
- source_word: לַיּוֹצֵא וְלַבָּא
  choice: para quem saía nem para quem entrava
  rationale: Preserva a expressão hebraica e usa uma construção negativa natural em português; os particípios singulares têm sentido genérico.
- source_word: כִּי
  choice: porque
  rationale: Apresenta de modo claro a causa da ausência de paz.
- source_word: מְהוּמֹת רַבּוֹת
  choice: grandes tumultos
  rationale: O substantivo pode indicar tumulto, confusão ou pânico; com רַבּוֹת, a formulação comunica a intensidade e a ampla desordem sem especificar demais.
- source_word: עַל כָּל יוֹשְׁבֵי הָאֲרָצוֹת
  choice: atingiam todos os habitantes daquelas terras
  rationale: Verter עַל de maneira idiomática como 'atingiam' comunica que os tumultos recaíam sobre a população; o plural 'terras' preserva הָאֲרָצוֹת, e 'daquelas' torna natural a referência contextual em português.
