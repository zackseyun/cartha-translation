    rationale: Embora «grandes» seja uma possibilidade interpretativa para רב, o plural feminino רַבּוֹת expressa diretamente multiplicidade. «Muitos tumultos» preserva mais precisamente esse aspecto, deixando «grandes tumultos» como alternativa em nota.
  - severity: low
    issue: «Daquelas terras» para הָאֲרָצוֹת
    rationale: O hebraico traz artigo definido plural, não demonstrativo. «Das terras» é suficiente e mais formalmente fiel, sem perda de naturalidade.
