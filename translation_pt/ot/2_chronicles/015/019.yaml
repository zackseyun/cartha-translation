base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/019.yaml
  text: And there was no war until the thirty-fifth year of Asa’s reign[a].
translation:
  language: pt
  text: E não houve guerra até o trigésimo quinto ano do reinado de Asa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até o ano trinta e cinco do reinado de Asa”. Alguns intérpretes entendem esse número segundo um sistema cronológico mais amplo, e não estritamente como a contagem dos anos do reinado de Asa, para harmonizá-lo com passagens relacionadas.'
    reason: Registra uma forma alternativa da expressão numérica e a interpretação cronológica proposta para a tensão com passagens relacionadas, sem alterar o texto hebraico na tradução principal.
lexical_decisions:
- source_word: וּ/מִלְחָמָה לֹא הָיָתָה
  choice: E não houve guerra
  rationale: A conjunção וּ mantém a ligação com o contexto anterior; מִלְחָמָה designa guerra ou conflito armado, e לֹא הָיָתָה forma aqui uma oração existencial negativa. “Não houve guerra” é natural em português e preserva o sentido integral.
- source_word: עַד
  choice: até
  rationale: Marca o limite temporal do período sem guerra.
- source_word: שְׁנַת שְׁלֹשִׁים וְחָמֵשׁ
  choice: o trigésimo quinto ano
  rationale: A construção com שְׁנַת seguida do numeral expressa um ano de reinado; em português, a forma ordinal é a mais idiomática.
- source_word: לְמַלְכוּת
  choice: do reinado de
  rationale: Neste contexto, מַלְכוּת se refere ao período do governo real, adequadamente expresso por “reinado”.
- source_word: אָסָא
  choice: Asa
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
theological_decisions:
- issue: Expressão cronológica em relação aos relatos próximos sobre Asa
  choice: Traduzir diretamente a fórmula hebraica como “o trigésimo quinto ano do reinado de Asa”.
  alternative: Entender o número segundo um sistema cronológico mais amplo, como uma contagem iniciada na divisão do reino, ou emendar o número para harmonizá-lo com Reis.
  rationale: O texto hebraico apresenta explicitamente o número como ligado ao reinado de Asa. A tradução conserva essa formulação sem resolver a tensão cronológica por harmonização ou emenda; a possível interpretação alternativa fica registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A construção concisa acompanha a formulação existencial e cronológica do hebraico.
