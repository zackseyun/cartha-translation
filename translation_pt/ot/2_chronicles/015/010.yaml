lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: Assim, reuniram-se
  rationale: O nifal wayyiqtol de קבץ descreve a reunião do grupo na sequência narrativa. “Reuniram-se” expressa naturalmente em português o sentido coletivo e reflexivo, enquanto “Assim” liga o acontecimento ao contexto anterior.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalém
  rationale: Forma tradicional e amplamente reconhecida do nome da cidade em português.
- source_word: בַּחֹדֶשׁ הַשְּׁלִישִׁי
  choice: no terceiro mês
  rationale: Tradução idiomática e formalmente próxima da expressão temporal hebraica, preservando o numeral ordinal.
- source_word: לִשְׁנַת חֲמֵשׁ עֶשְׂרֵה
  choice: do décimo quinto ano
  rationale: Na fórmula de datação régia, a preposição לִ é expressa naturalmente em português pela construção integrada “no terceiro mês do décimo quinto ano”.
- source_word: לְמַלְכוּת אָסָא
  choice: do reinado de Asa
  rationale: מַלְכוּת, neste contexto cronológico, designa o período em que Asa reinou. “Reinado” é claro, preciso e idiomático.
