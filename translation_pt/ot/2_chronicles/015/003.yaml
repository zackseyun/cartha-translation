  text: וְ/יָמִ֥ים רַבִּ֖ים לְ/יִשְׂרָאֵ֑ל לְ/לֹ֣א אֱלֹהֵ֣י אֱמֶ֗ת וּ/לְ/לֹ֛א כֹּהֵ֥ן מוֹרֶ֖ה וּ/לְ/לֹ֥א תוֹרָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/003.yaml
  text: For many days Israel was without the true God[a], without a teaching priest[b], and without the law.
translation:
  language: pt
  text: Por muitos dias, Israel esteve sem o Deus verdadeiro[a], sem sacerdote que ensinasse e sem instrução[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um Deus de verdade”; ou: “nenhum Deus verdadeiro”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “lei” ou “ensino”. O hebraico torá pode significar “instrução”, “ensino” ou “lei”, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָמִים רַבִּים
  choice: Por muitos dias
  rationale: Expressa de modo natural a duração indicada pelo hebraico, sem tornar mecanicamente a conjunção inicial.
- source_word: לְיִשְׂרָאֵל
  choice: Israel esteve
  rationale: O לְ marca aqui a condição relativa a Israel; em português, a cópula explícita comunica naturalmente a oração nominal hebraica.
- source_word: לְלֹא אֱלֹהֵי אֱמֶת
  choice: sem o Deus verdadeiro
  rationale: A construção repetida לְלֹא indica ausência. אֱלֹהֵי אֱמֶת pode ser entendido literalmente como “Deus de verdade”, mas “o Deus verdadeiro” é a formulação portuguesa mais natural no contexto de Israel.
- source_word: כֹּהֵן מוֹרֶה
  choice: sacerdote que ensinasse
  rationale: מוֹרֶה é particípio de ירה, “ensinar, instruir”. A oração relativa é mais corrente e clara em português do que “sacerdote ensinador”, preservando sua função docente.
- source_word: תּוֹרָה
  choice: instrução
  rationale: O termo abrange ensino e orientação, não apenas legislação. “Instrução” preserva essa amplitude no contexto da atividade sacerdotal.
theological_decisions:
- issue: Sentido e definitude de אֱלֹהֵי אֱמֶת
  choice: o Deus verdadeiro
  alternative: um Deus de verdade; nenhum Deus verdadeiro
  rationale: O contexto diz respeito à relação de Israel com Deus, favorecendo a referência definida, mas a nota conserva a forma e a possível indefinitude da expressão hebraica.
- issue: Sentido de תּוֹרָה
  choice: instrução
  alternative: lei; ensino
  rationale: “Instrução” mantém a extensão semântica do hebraico e sua ligação contextual com o sacerdote que ensina, sem reduzir necessariamente o termo a um código legal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “sem” preserva a estrutura enfática do hebraico; a oração “que ensinasse” torna idiomaticamente a função contínua do particípio מוֹרֶה.
