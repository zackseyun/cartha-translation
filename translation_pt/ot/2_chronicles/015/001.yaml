base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/001.yaml
  text: The Spirit of God came upon Azariah son of Oded[a].
translation:
  language: pt
  text: O Espírito de Deus veio sobre Azarias, filho de Odede.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O Espírito de Deus estava sobre Azarias, filho de Odede.”'
    reason: alternativa lexical para הָיְתָה עָלָיו, que pode ser traduzido de modo mais estático
lexical_decisions:
- source_word: וַ/עֲזַרְיָהוּ
  choice: Azarias
  rationale: O nome próprio é transliterado segundo a forma portuguesa tradicional. O וַ־ dá continuidade à narrativa, mas não exige um conectivo expresso neste versículo em português.
- source_word: בֶּן עוֹדֵד
  choice: filho de Odede
  rationale: בֶּן indica naturalmente filiação direta neste contexto; Odede é a forma portuguesa tradicional do nome próprio.
- source_word: הָיְתָה עָלָיו
  choice: veio sobre
  rationale: Com רוּחַ, a expressão assinala aqui a ação do Espírito que alcança Azarias para a fala profética. “Veio sobre” comunica adequadamente esse valor eventivo, sem apagar a possibilidade formal de uma leitura mais estática.
- source_word: רוּחַ אֱלֹהִים
  choice: o Espírito de Deus
  rationale: No contexto de inspiração profética, a construção designa de modo definido o Espírito de Deus. A formulação é natural em português e não requer acrescentar ideias ausentes do hebraico.
theological_decisions:
- issue: Se רוּחַ אֱלֹהִים deve ser entendido como “o Espírito de Deus” ou impessoalmente como “um espírito divino”
  choice: o Espírito de Deus
  alternative: um espírito de Deus; um espírito divino
  rationale: A fórmula do Cronista introduz a inspiração profética de uma pessoa identificada. “O Espírito de Deus” expressa o sentido mais provável da construção hebraica no contexto, sem desenvolver além do que o texto afirma.
- issue: Valor eventivo ou estático de הָיְתָה עָלָיו
  choice: veio sobre
  alternative: estava sobre
  rationale: A sequência narrativa e o contexto da profecia favorecem a chegada capacitadora do Espírito, mas a nota preserva a tradução mais formal e estática possível.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantêm-se as formas bíblicas portuguesas Azarias e Odede; a vírgula antes de “filho de Odede” favorece a leitura natural.
