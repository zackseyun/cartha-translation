source:
  edition: WLC
  text: וְ/כֵ֞ן בִּ/מְלִיצֵ֣י שָׂרֵ֣י בָּבֶ֗ל הַֽ/מְשַׁלְּחִ֤ים עָלָי/ו֙ לִ/דְרֹ֗שׁ הַ/מּוֹפֵת֙ אֲשֶׁ֣ר הָיָ֣ה בָ/אָ֔רֶץ עֲזָב֖/וֹ הָֽ/אֱלֹהִ֑ים לְ/נַ֨סּוֹת֔/וֹ לָ/דַ֖עַת כָּל בִּ/לְבָבֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/031.yaml
  text: And so[a], in the matter of the envoys of the princes of Babylon, who had been sent to him to inquire about the sign that had happened in the land, God left him, to test him[b], to know all that was in his heart.
translation:
  language: pt
  text: Da mesma forma, no caso dos emissários dos príncipes da Babilônia, enviados a ele para investigar o sinal[a] que havia acontecido na terra, Deus o deixou, para pô-lo à prova e saber tudo o que havia em seu coração.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a maravilha” ou “o prodígio”.
    reason: lexical_alternative
  - marker: b
    text: A expressão “saber tudo o que havia em seu coração” foi mantida conforme o texto hebraico, preservando a tensão da narrativa; alguns a entendem no sentido de “revelar” ou “expor” o que havia em seu coração.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכֵן
  choice: Da mesma forma
  rationale: Introduz uma circunstância adicional ligada ao relato anterior, preservando o valor conectivo sem produzir uma formulação rígida.
- source_word: בִּמְלִיצֵי שָׂרֵי בָּבֶל
  choice: no caso dos emissários dos príncipes da Babilônia
  rationale: מְלִיצִים designa intermediários ou emissários neste contexto; a preposição בְּ marca a circunstância. “Príncipes” conserva o sentido político elevado de שָׂרִים.
- source_word: הַמְשַׁלְּחִים עָלָיו
  choice: enviados a ele
  rationale: Embora o particípio seja formalmente ativo, no contexto identifica os emissários despachados até Ezequias. A formulação passiva é idiomática em português e mantém o sentido contextual.
- source_word: לִדְרֹשׁ
  choice: para investigar
  rationale: דרש indica aqui indagar ou procurar informações, com força um pouco maior que simplesmente perguntar, adequada ao contexto diplomático.
- source_word: הַמּוֹפֵת
  choice: o sinal
  rationale: מוֹפֵת pode significar sinal, maravilha ou prodígio. “Sinal” é amplo, claro e não determina indevidamente a natureza do acontecimento.
- source_word: אֲשֶׁר הָיָה בָאָרֶץ
  choice: que havia acontecido na terra
  rationale: A expressão aponta para um acontecimento notável que motivou a investigação; “havia acontecido” comunica naturalmente o sentido eventivo.
- source_word: עֲזָבוֹ הָאֱלֹהִים
  choice: Deus o deixou
  rationale: עזב pode significar deixar ou abandonar. “Deixou” preserva a tensão do texto sem intensificar indevidamente a ideia como “abandonou” poderia fazer.
- source_word: לְנַסּוֹתוֹ
  choice: para pô-lo à prova
  rationale: נסה significa testar ou provar. “Pôr à prova” é natural, dignificado e conserva o sentido de avaliação.
- source_word: לָדַעַת
  choice: e saber
  rationale: Reproduz diretamente o propósito expresso pelo infinitivo hebraico e preserva a tensão teológica da linguagem narrativa.
- source_word: כָּל בִּלְבָבוֹ
  choice: tudo o que havia em seu coração
  rationale: Mantém o conhecido idioma hebraico, no qual o coração representa a interioridade, incluindo pensamentos, desejos e motivações.
theological_decisions:
- issue: A prova divina e a linguagem do conhecimento de Deus
  choice: Deus o deixou, para pô-lo à prova e saber tudo o que havia em seu coração
  alternative: Deus o deixou para revelar ou expor tudo o que havia em seu coração
  rationale: O hebraico emprega diretamente “saber”. A tradução mantém essa formulação e sua tensão teológica, sem a reformular para harmonizá-la explicitamente com uma doutrina da onisciência divina.
translation_notes:
  register: Português moderno, claro e dignificado, com ampla legibilidade brasileira. “Emissários” mantém o registro diplomático; “pô-lo à prova” evita tanto coloquialismo quanto arcaísmo excessivo. As notas aparecem junto aos termos a que se referem.
