  text: וְ֠/רַבִּים מְבִיאִ֨ים מִנְחָ֤ה לַ/יהוָה֙ לִ/יר֣וּשָׁלִַ֔ם וּ/מִ֨גְדָּנ֔וֹת לִֽ/יחִזְקִיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּנַּשֵּׂ֛א לְ/עֵינֵ֥י כָל הַ/גּוֹיִ֖ם מֵ/אַֽחֲרֵי כֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/023.yaml
  text: And many were bringing an offering to Yahweh in Jerusalem[a], and choice gifts to Hezekiah king of Judah[b], and after this he was exalted in the sight of all the nations.
translation:
  language: pt
  text: Muitos traziam uma oferta a Yahweh em Jerusalém[a] e presentes valiosos a Ezequias, rei de Judá[b]. Depois disso, ele foi exaltado aos olhos de todas as nações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a Jerusalém”. Neste contexto, a preposição hebraica pode indicar destino ou localização.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “presentes escolhidos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים
  choice: Muitos
  rationale: O adjetivo é usado substantivamente e se refere a muitas pessoas, sem necessidade de explicitar o substantivo em português.
- source_word: מְבִיאִים
  choice: traziam
  rationale: O particípio, em contexto narrativo passado, sugere ação continuada ou repetida; o pretérito imperfeito transmite bem esse aspecto.
- source_word: מִנְחָה
  choice: uma oferta
  rationale: Diante de Yahweh como destinatário, o sentido religioso de oferta é o mais adequado, sem especificar indevidamente o tipo.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição indica o destinatário, e o nome divino é transliterado como Yahweh.
- source_word: לִירוּשָׁלִַם
  choice: em Jerusalém
  rationale: No contexto, a expressão pode indicar o local em que as ofertas eram apresentadas, embora a preposição também admita sentido de destino; a ambiguidade é registrada em nota.
- source_word: מִגְדָּנוֹת
  choice: presentes valiosos
  rationale: O termo denota coisas preciosas ou selecionadas dadas como presentes; esta formulação é natural e evita restringir o sentido a alimentos.
- source_word: לִיחִזְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: a Ezequias, rei de Judá
  rationale: Identifica claramente Ezequias como destinatário dos presentes e acrescenta seu título em aposição.
- source_word: וַיִּנַּשֵּׂא
  choice: ele foi exaltado
  rationale: A forma nifal expressa elevação passiva de posição, honra ou reputação.
- source_word: לְעֵינֵי כָל הַגּוֹיִם
  choice: aos olhos de todas as nações
  rationale: Preserva de modo natural em português a imagem do idioma hebraico e seu sentido de reconhecimento público.
- source_word: מֵאַחֲרֵי כֵן
  choice: Depois disso
  rationale: Marca sequência temporal em relação aos acontecimentos anteriores.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração Yahweh preserva o caráter de nome próprio sem substituir por um título.
- issue: Sentido de וַיִּנַּשֵּׂא
  choice: foi exaltado
  alternative: tornou-se muito respeitado
  rationale: A opção mantém a forma passiva e não reduz a elevação apenas à estima humana, embora o contexto indique reconhecimento entre as nações.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O pretérito imperfeito preserva a ação continuada do particípio hebraico; a segunda frase evita uma coordenação excessivamente longa. Todos os marcadores de nota aparecem no texto principal.
