- from: Quando Ezequias viu que Senaqueribe tinha chegado e que sua intenção era guerrear contra Jerusalém,[a]
  to: Ezequias viu que Senaqueribe tinha chegado e que sua intenção era fazer guerra contra Jerusalém.[a]
