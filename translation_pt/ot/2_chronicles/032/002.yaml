lexical_decisions:
- source_word: וַיַּרְא
  choice: viu
  rationale: Mantém o valor narrativo comum de ראה; neste contexto, o verbo também envolve perceber a situação, sem que isso precise ser explicitado.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo daquilo que Ezequias viu.
- source_word: בָא
  choice: tinha chegado
  rationale: O mais-que-perfeito composto expressa naturalmente em português a chegada anterior ao momento em que Ezequias avaliou a situação.
- source_word: סַנְחֵרִיב
  choice: Senaqueribe
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וּפָנָיו
  choice: sua intenção
  rationale: A expressão literal, «seu rosto», integra uma construção idiomática que comunica propósito ou determinação; «sua intenção» transmite esse sentido com clareza.
- source_word: לַמִּלְחָמָה
  choice: era guerrear
  rationale: No conjunto da expressão idiomática, indica propósito bélico; «guerrear» preserva de modo conciso a força militar do substantivo.
- source_word: עַל
  choice: contra
  rationale: Indica direção hostil contra a cidade.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalém
  rationale: Forma portuguesa consagrada do topônimo.
