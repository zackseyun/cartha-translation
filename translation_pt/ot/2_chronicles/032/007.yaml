base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/007.yaml
  text: Be strong and courageous[a]. Do not fear or be dismayed before the king of Assyria or before all the multitude that is with him[b], for there are more with us than with him.
translation:
  language: pt
  text: Sejam fortes e corajosos. Não tenham medo nem se apavorem diante do rei da Assíria ou de toda a multidão que está com ele[a], pois os que estão conosco são mais numerosos do que os que estão com ele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todo o exército que está com ele”. A palavra hebraica pode indicar uma multidão ou, neste contexto, uma massa de tropas.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “pois conosco [há] mais do que com ele”. A comparação elíptica é esclarecida pelo versículo seguinte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חִזְקוּ וְאִמְצוּ
  choice: Sejam fortes e corajosos
  rationale: Os dois imperativos plurais formam uma exortação hebraica recorrente. A formulação preserva ambos os sentidos em português natural e solene.
- source_word: אַל תִּירְאוּ וְאַל תֵּחַתּוּ
  choice: Não tenham medo nem se apavorem
  rationale: ירא exprime medo, enquanto חתת no nifal pode indicar ficar abalado, aterrorizado ou desalentado. “Apavorem” comunica aqui a reação diante de uma ameaça militar sem reduzir o verbo a mero desânimo.
- source_word: מִפְּנֵי ... וּמִלִּפְנֵי
  choice: diante de ... ou de
  rationale: A expressão significa literalmente estar perante a face ou presença de alguém e, neste contexto, introduz aquilo que causa medo. “Diante de” preserva a imagem e soa natural em português.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: rei da Assíria
  rationale: Tradução direta e convencional da construção hebraica.
- source_word: כָּל הֶהָמוֹן אֲשֶׁר עִמּוֹ
  choice: toda a multidão que está com ele
  rationale: הָמוֹן pode designar multidão, massa de gente ou contingente de tropas. “Multidão” conserva a amplitude lexical, enquanto a nota registra o sentido militar possível no contexto.
- source_word: כִּי עִמָּנוּ רַב מֵעִמּוֹ
  choice: pois os que estão conosco são mais numerosos do que os que estão com ele
  rationale: A oração hebraica é elíptica, literalmente “pois conosco [há] mais do que com ele”. A explicitação plural torna a comparação compreensível em português sem antecipar a explicação teológica do versículo seguinte.
theological_decisions:
- issue: Identidade implícita na comparação final
  choice: Comparação quantitativa entre os que estão com Judá e os que estão com o rei da Assíria
  alternative: 'Leitura pessoal singular: “maior é aquele que está conosco do que aquele que está com ele”'
  rationale: Embora רַב esteja no singular, a construção é elíptica e o contexto imediato contrapõe a multidão assíria ao auxílio do lado de Judá. O versículo 8 esclarece a natureza desse auxílio, mas o versículo 7 não formula explicitamente uma comparação entre duas pessoas singulares. A tradução evita importar essa formulação de outros textos.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais no plural coerentes com os imperativos hebraicos. “Se apavorem” é corrente e expressa a força emocional de חתת; “multidão” mantém a abertura lexical do original, e a comparação final é explicitada apenas o necessário para a compreensão.
