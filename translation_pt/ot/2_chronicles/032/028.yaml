translation:
  language: pt
  text: armazéns[a] para a produção de cereais, vinho novo[b] e azeite; estábulos para todo tipo de animal e currais[c] para os rebanhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cidades-armazém”; o termo hebraico também pode indicar complexos maiores de armazenamento.
    reason: lexical_alternative
  - marker: b
    text: “Vinho novo” traduz תִירוֹשׁ, termo frequentemente distinguido de palavras mais gerais para vinho em listas de produtos agrícolas.
    reason: lexical_alternative
  - marker: c
    text: “Currais” também pode ser traduzido por “cercados” ou “recintos”. O hebraico repete a palavra para “animal/livestock” nesta frase, e sua relação sintática exata é difícil; o sentido geral é o de instalações para os animais e os rebanhos.
    reason: textual_or_syntactical_ambiguity
lexical_decisions:
- source_word: מִסְכְּנוֹת
  choice: armazéns
  rationale: No contexto de provisões agrícolas, designa instalações de armazenamento. “Armazéns” é claro e natural; a possibilidade de complexos maiores é registrada em nota.
- source_word: תְבוּאַת דָּגָן
  choice: produção de cereais
  rationale: תְבוּאָה indica produção ou rendimento agrícola, e דָּגָן abrange grãos de cereal. A expressão comunica o sentido sem sugerir especificamente o milho moderno.
- source_word: תִירוֹשׁ
  choice: vinho novo
  rationale: Preserva a distinção lexical usual de תִירוֹשׁ nas tríades agrícolas em relação a termos mais gerais para vinho.
- source_word: יִצְהָר
  choice: azeite
  rationale: Neste contexto agrícola, refere-se ao óleo produzido de azeitonas; “azeite” é a forma portuguesa mais precisa e natural.
- source_word: אֻרָוֹת
  choice: estábulos
  rationale: O termo denota lugares onde animais são alojados ou alimentados. “Estábulos” transmite essa função de modo corrente.
- source_word: לְכָל בְּהֵמָה
  choice: para todo tipo de animal
  rationale: בְּהֵמָה é coletivo e se refere a animais domésticos. A formulação evita restringir o sentido apenas a bovinos.
- source_word: עֲדָרִים
  choice: rebanhos
  rationale: O substantivo costuma designar grupos de animais menores, sobretudo ovelhas e cabras; “rebanhos” é o equivalente português natural.
- source_word: אֲוֵרוֹת
  choice: currais
  rationale: Designa recintos destinados a guardar rebanhos. “Currais” é claro em português e mantém a distinção em relação aos estábulos.
