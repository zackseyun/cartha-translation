base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/013.yaml
  text: Do you not know what I and my fathers have done to all the peoples of the lands? Were the gods of the nations of the lands at all able to deliver their land from my hand?[a]
translation:
  language: pt
  text: “Vocês não sabem o que eu e meus pais[a] fizemos a todos os povos de todas as terras? Será que os deuses das nações dessas terras conseguiram de fato livrar a terra deles da minha mão?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meus antepassados”. O hebraico emprega linguagem familiar dinástica.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא תֵדְעוּ
  choice: Vocês não sabem
  rationale: Preserva a pergunta retórica que espera concordância e usa uma formulação natural no português moderno.
- source_word: מֶה עָשִׂיתִי
  choice: o que eu ... fizemos
  rationale: Em português, o pretérito perfeito expressa naturalmente as ações concluídas invocadas pelo orador como prova presente de seu poder. A concordância no plural decorre do sujeito composto “eu e meus pais”.
- source_word: אֲנִי וַאֲבוֹתַי
  choice: eu e meus pais
  rationale: Mantém a linguagem familiar e dinástica do hebraico; a nota registra a alternativa interpretativa “antepassados”.
- source_word: לְכֹל עַמֵּי הָאֲרָצוֹת
  choice: a todos os povos das diversas terras
  rationale: Conserva o plural concreto de “terras” e torna clara, sem reduzi-la a “terra” no sentido do mundo inteiro, a referência a vários territórios.
- source_word: הֲיָכוֹל יָכְלוּ
  choice: Será que ... conseguiram de fato
  rationale: A locução “de fato” transmite a ênfase da construção hebraica com infinitivo absoluto e verbo finito, mantendo o tom de desafio.
- source_word: אֱלֹהֵי גּוֹיֵ הָאֲרָצוֹת
  choice: os deuses das nações dessas terras
  rationale: Representa de modo claro a cadeia genitiva hebraica e identifica os deuses com as nações dos territórios já mencionados.
- source_word: לְהַצִּיל
  choice: livrar
  rationale: No contexto de ameaça militar, “livrar” comunica resgate da dominação inimiga e preserva o peso tradicional do verbo.
- source_word: אֶת אַרְצָם
  choice: a terra deles
  rationale: Mantém o substantivo singular coletivo do hebraico e seu sufixo plural, referindo-se distributivamente ao território de cada nação.
- source_word: מִיָדִי
  choice: das minhas mãos
  rationale: Preserva a metáfora hebraica de mão como poder ou controle; o plural é a forma idiomática mais natural em português.
theological_decisions:
- issue: Referência aos “deuses” na jactância do rei pagão
  choice: Traduzir אֱלֹהֵי diretamente por “deuses”, sem qualificação.
  alternative: “os chamados deuses”
  rationale: A fala apresenta a alegação de Senaqueribe, que compara as divindades das nações conquistadas com o Deus de Judá. A tradução deve preservar sua retórica sem inserir no texto um comentário teológico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para marcar explicitamente o plural hebraico. A formulação conserva o tom provocador da pergunta retórica e a repetição de “terras”, reduzida na segunda ocorrência a “dessas terras” para fluidez.
