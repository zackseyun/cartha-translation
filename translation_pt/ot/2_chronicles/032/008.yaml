  text: עִמּ/וֹ֙ זְר֣וֹעַ בָּשָׂ֔ר וְ/עִמָּ֜/נוּ יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ לְ/עָזְרֵ֔/נוּ וּ/לְ/הִלָּחֵ֖ם מִלְחֲמֹתֵ֑/נוּ וַ/יִּסָּמְכ֣וּ הָ/עָ֔ם עַל דִּבְרֵ֖י יְחִזְקִיָּ֥הוּ מֶֽלֶךְ יְהוּדָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/008.yaml
  text: With him is an arm of flesh[a], but with us is Yahweh our God, to help us and to fight our battles. And the people relied on the words of Hezekiah king of Judah.
translation:
  language: pt
  text: Com ele está um braço de carne[a], mas conosco está Yahweh, nosso Deus, para nos ajudar e travar as nossas batalhas. E o povo se apoiou nas palavras de Ezequias, rei de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “força humana”. O hebraico conserva a metáfora do poder meramente humano, em contraste com a ajuda de Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִמּוֹ
  choice: com ele
  rationale: Expressa associação e preserva o paralelismo direto com “conosco” na oração seguinte.
- source_word: זְרוֹעַ בָּשָׂר
  choice: um braço de carne
  rationale: Mantém a metáfora hebraica do poder meramente humano em contraste com a ajuda divina; a alternativa explicativa aparece em nota.
- source_word: וְעִמָּנוּ
  choice: mas conosco
  rationale: O contexto dá à conjunção força adversativa, contrapondo o poder humano do inimigo à presença de Deus com Judá.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Tradução direta e natural da expressão pactual.
- source_word: לְעָזְרֵנוּ
  choice: para nos ajudar
  rationale: Reproduz naturalmente a finalidade expressa pelo infinitivo com לְ.
- source_word: וּלְהִלָּחֵם מִלְחֲמֹתֵינוּ
  choice: e travar as nossas batalhas
  rationale: Conserva o sentido marcial da construção cognata hebraica em português corrente, sem acrescentar explicitamente “por nós”.
- source_word: וַיִּסָּמְכוּ
  choice: se apoiou
  rationale: Preserva a imagem verbal de apoiar-se e, no contexto, comunica confiança nas palavras do rei.
- source_word: הָעָם
  choice: o povo
  rationale: Mantém o coletivo singular, com concordância natural em português.
- source_word: עַל דִּבְרֵי
  choice: nas palavras de
  rationale: Completa naturalmente a construção “apoiar-se em” e conserva o plural “palavras”.
- source_word: יְחִזְקִיָּהוּ
  choice: Ezequias
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: מֶלֶךְ יְהוּדָה
  choice: rei de Judá
  rationale: Reproduz de modo direto o título e o reino de Ezequias.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Contraste entre auxílio humano e divino
  choice: mas conosco está Yahweh, nosso Deus
  alternative: e conosco está Yahweh, nosso Deus
  rationale: A estrutura retórica contrapõe o “braço de carne” do inimigo à presença e ajuda de Yahweh; “mas” explicita essa força adversativa sem resolver além do texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Conserva-se a metáfora “braço de carne”; “se apoiou” retém a imagem hebraica sem soar excessivamente arcaico. A colocação “conosco está Yahweh” mantém o paralelismo e a ênfase do original.
