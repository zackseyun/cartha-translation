  text: וְ/לֹא כִ/גְמֻ֤ל עָלָי/ו֙ הֵשִׁ֣יב יְחִזְקִיָּ֔הוּ כִּ֥י גָבַ֖הּ לִבּ֑/וֹ וַ/יְהִ֤י עָלָי/ו֙ קֶ֔צֶף וְ/עַל יְהוּדָ֖ה וִ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/025.yaml
  text: But Hezekiah did not repay according to the benefit done to him[a], because his heart was proud; therefore wrath came upon him and upon Judah and Jerusalem.
translation:
  language: pt
  text: Mas Ezequias não retribuiu à altura do benefício que havia recebido[a], pois seu coração se encheu de orgulho; por isso, veio ira sobre ele, sobre Judá e sobre Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não correspondeu à bondade que lhe havia sido demonstrada”. A expressão hebraica se refere, de modo amplo, a dar uma resposta adequada ao bem recebido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִגְמֻל עָלָיו
  choice: à altura do benefício que havia recebido
  rationale: A expressão combina a ideia de benefício ou trato recebido com a preposição comparativa כ, indicando uma resposta correspondente ao bem recebido. A formulação portuguesa mantém essa proporcionalidade sem restringir o benefício apenas à cura ou ao livramento.
- source_word: הֵשִׁיב
  choice: não retribuiu
  rationale: O hifil de שוב significa fazer voltar ou dar em retorno; junto de גמול, comunica a ideia de oferecer uma resposta adequada ao bem recebido. “Retribuiu” é natural e não reduz a falha à ausência de agradecimento verbal.
- source_word: גָבַהּ לִבּוֹ
  choice: seu coração se encheu de orgulho
  rationale: O hebraico diz literalmente que seu coração se elevou. A tradução expressa de modo corrente o sentido idiomático de orgulho, preservando o coração como centro da disposição interior.
- source_word: קֶצֶף
  choice: ira
  rationale: O substantivo denota indignação intensa, frequentemente associada ao juízo divino. “Ira” conserva a gravidade do termo.
- source_word: וַיְהִי עָלָיו קֶצֶף
  choice: veio ira sobre ele
  rationale: A construção hebraica declara que passou a haver ira sobre Ezequias. Esta forma portuguesa comunica o início do juízo sem explicitar um agente que a oração hebraica deixa implícito.
- source_word: יְהוּדָה וִירוּשָׁלִָם
  choice: Judá e Jerusalém
  rationale: São as formas tradicionais e amplamente reconhecidas desses nomes em português.
theological_decisions:
- issue: Natureza da falha de Ezequias diante do favor recebido
  choice: Ezequias não ofereceu uma resposta à altura do bem que havia recebido, sem especificar que sua falha consistiu apenas em não agradecer verbalmente.
  alternative: Ezequias não deu graças pelo benefício recebido.
  rationale: A expressão hebraica é abrangente e fala de não fazer um retorno correspondente ao benefício. “Não retribuiu à altura” preserva essa avaliação moral sem limitar indevidamente a natureza da resposta esperada.
- issue: Origem da ira
  choice: 'Manter o agente implícito: “veio ira sobre ele”.'
  alternative: “A ira do SENHOR veio sobre ele.”
  rationale: O contexto permite entender a ira como divina, mas esta oração não nomeia explicitamente o SENHOR como seu agente. A tradução conserva essa formulação e sua ambiguidade gramatical.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “À altura” comunica naturalmente a relação proporcional marcada no hebraico; “ira” mantém o peso judicial do texto. O marcador [a] aparece no texto principal.
