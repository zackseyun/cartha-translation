source:
  edition: WLC
  text: וּ/סְפָרִ֣ים כָּתַ֔ב לְ/חָרֵ֕ף לַ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וְ/לֵֽ/אמֹ֨ר עָלָ֜י/ו לֵ/אמֹ֗ר כֵּֽ/אלֹהֵ֞י גּוֹיֵ֤ הָ/אֲרָצוֹת֙ אֲשֶׁ֨ר לֹא הִצִּ֤ילוּ עַמָּ/ם֙ מִ/יָּדִ֔/י כֵּ֣ן לֹֽא יַצִּ֞יל אֱלֹהֵ֧י יְחִזְקִיָּ֛הוּ עַמּ֖/וֹ מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/017.yaml
  text: He also wrote letters to mock Yahweh[a], the God of Israel, and to speak against him, saying, “Just as the gods of the nations of the lands have not delivered their people from my hand, so the God of Hezekiah will not deliver his people from my hand.”
translation:
  language: pt
  text: 'Também escreveu cartas para insultar Yahweh[a], o Deus de Israel, e falar contra ele, dizendo: “Assim como os deuses das nações dessas terras não livraram os seus povos da minha mão, também o Deus de Ezequias não livrará o seu povo da minha mão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “afrontar”, “desafiar” ou “zombar de Yahweh”. O verbo hebraico expressa insulto e ultraje.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּסְפָרִים כָּתַב
  choice: Também escreveu cartas
  rationale: סְפָרִים designa escritos ou cartas; no contexto narrativo, “cartas” é natural. O וּ dá continuidade ao relato, expressa por “também”.
- source_word: לְחָרֵף
  choice: para insultar
  rationale: חרף comunica afronta, ultraje ou insulto. “Insultar” preserva a hostilidade direta e é claro em português atual; a nota registra alternativas plausíveis.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Reproduz o nome divino pessoal representado pelo tetragrama יהוה, em vez de substituí-lo por um título.
- source_word: וְלֵאמֹר עָלָיו
  choice: e falar contra ele
  rationale: No contexto da afronta, עַל tem sentido adversativo; “falar contra ele” é natural e preserva a direção hostil do discurso.
- source_word: כֵּאלֹהֵי גּוֹיֵי הָאֲרָצוֹת
  choice: Assim como os deuses das nações dessas terras
  rationale: כֵּ estabelece a comparação. “Dessas terras” torna idiomática a cadeia plural sem apagar sua referência aos povos dos territórios conquistados.
- source_word: אֲשֶׁר לֹא הִצִּילוּ עַמָּם
  choice: não livraram os seus povos
  rationale: O hifil de נצל significa livrar ou resgatar. O plural “povos” explicita que cada deus é associado ao respectivo povo, evitando em português a leitura de um único povo coletivo.
- source_word: מִיָּדִי
  choice: das minhas mãos
  rationale: Preserva a metáfora hebraica de mão como poder ou domínio. O plural é a formulação idiomática corrente em português.
- source_word: כֵּן לֹא יַצִּיל
  choice: também ... não livrará
  rationale: כֵּן introduz a consequência paralela da comparação. A repetição de “livrar” mantém a força retórica do hebraico.
- source_word: אֱלֹהֵי יְחִזְקִיָּהוּ
  choice: o Deus de Ezequias
  rationale: Mantém a construção associativa e o tom depreciativo do invasor, que apresenta Yahweh como se fosse apenas a divindade de Ezequias.
- source_word: עַמּוֹ
  choice: o seu povo
  rationale: Traduz diretamente o substantivo com sufixo possessivo, referindo-se ao povo do Deus de Ezequias.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o tetragrama. “Yahweh” preserva a identificação pelo nome pessoal e evita substituí-lo silenciosamente por um título.
- issue: A designação “o Deus de Ezequias” no discurso do invasor
  choice: preservar literalmente a designação
  alternative: o Deus de Israel; o Deus em quem Ezequias confia
  rationale: A expressão pertence à fala provocadora e não deve ser harmonizada com a designação teologicamente mais plena da primeira oração. Sua formulação revela a maneira depreciativa como o agressor enquadra Yahweh.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva o paralelismo da provocação, a metáfora das “mãos” e a tensão entre “Deus de Israel” e a fala depreciativa “Deus de Ezequias”.
