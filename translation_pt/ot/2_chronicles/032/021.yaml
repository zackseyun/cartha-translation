base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/021.yaml
  text: And the LORD sent an angel, who wiped out every mighty warrior, commander, and officer in the camp of the king of Assyria. So he returned to his own land with shame on his face. And when he entered the house of his god, some of those who came from his own body struck him down there with the sword.
translation:
  language: pt
  text: Então o SENHOR enviou um anjo, que exterminou todos os guerreiros valentes, chefes e comandantes no acampamento do rei da Assíria. Assim, ele voltou para a sua terra com o rosto coberto de vergonha. Quando entrou no templo de seu deus, alguns de seus próprios filhos o mataram ali à espada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: SENHOR
  rationale: Representa o nome divino segundo a convenção portuguesa amplamente reconhecida, distinguindo-o tipograficamente do título comum.
- source_word: מַלְאָךְ
  choice: um anjo
  rationale: No contexto, trata-se de um mensageiro celestial enviado pelo SENHOR; “anjo” é natural e semanticamente adequado.
- source_word: וַיַּכְחֵד
  choice: exterminou
  rationale: Expressa a eliminação completa indicada pelo verbo hebraico, sem especificar um meio que o texto não informa.
- source_word: גִּבּוֹר חַיִל
  choice: guerreiros valentes
  rationale: Preserva a referência a homens de reconhecida força e capacidade militar.
- source_word: נָגִיד וְשָׂר
  choice: chefes e comandantes
  rationale: Mantém duas categorias de liderança, embora a distinção exata entre os cargos não seja recuperável com segurança.
- source_word: בְּבֹשֶׁת פָּנִים
  choice: com o rosto coberto de vergonha
  rationale: Reproduz de modo idiomático a imagem hebraica de vergonha manifesta no rosto.
- source_word: מֵעָיו
  choice: seus próprios filhos
  rationale: A expressão idiomática significa literalmente os que saíram de suas entranhas, isto é, seus descendentes; o relato paralelo identifica os assassinos como filhos.
- source_word: הִפִּילֻהוּ בֶחָרֶב
  choice: o mataram ali à espada
  rationale: Traduz o sentido do idiomatismo “fizeram-no cair pela espada” em português claro e digno.
theological_decisions:
- issue: Identidade e ação do anjo
  choice: “um anjo, que exterminou”
  alternative: “um mensageiro, que fez desaparecer”
  rationale: O contexto favorece um agente celestial e atribui diretamente a ele a destruição, sem desenvolver uma doutrina adicional sobre sua identidade ou o modo da ação.
- issue: Referência ao deus assírio
  choice: “seu deus” em minúscula
  alternative: “seu Deus”
  rationale: O referente é a divindade cultuada pelo rei assírio, não o SENHOR; a minúscula evita confusão sem acrescentar comentário polêmico.
- issue: Identidade dos assassinos
  choice: “alguns de seus próprios filhos”
  alternative: “alguns dos que saíram de suas entranhas”
  rationale: Torna explícito o sentido idiomático e historicamente contextualizado, sem alterar a relação de descendência afirmada pelo hebraico.
translation_notes:
  register: Português moderno, corrente e digno, com legibilidade brasileira e vocabulário amplamente internacional. A coordenação narrativa foi mantida de forma natural; evitou-se tanto o literalismo opaco quanto a expansão interpretativa.
