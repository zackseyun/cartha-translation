base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/009.yaml
  text: After this[a], Sennacherib king of Assyria sent his servants to Jerusalem—while he was before Lachish with all his dominion with him—against Hezekiah king of Judah and against all Judah who were in Jerusalem, saying[b],
translation:
  language: pt
  text: 'Depois disso, Senaqueribe, rei da Assíria, enviou seus servos a Jerusalém — enquanto ele estava diante de Laquis[a], com todo o seu poderio consigo[b] — contra Ezequias, rei de Judá, e contra todo Judá que estava em Jerusalém, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «enquanto estava contra Laquis» ou «enquanto sitiava Laquis». O hebraico diz literalmente «sobre/contra Laquis», uma expressão de contexto militar.
    reason: lexical_alternative
  - marker: b
    text: Ou «com todas as suas forças consigo». A expressão hebraica pode referir-se ao domínio ou poder imperial de Senaqueribe ou, neste contexto, a todo o poder colocado sob seu comando.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר זֶה
  choice: Depois disso
  rationale: Transição temporal natural em português, preservando a sequência do relato sem expansão desnecessária.
- source_word: שָׁלַח
  choice: enviou
  rationale: Equivalente direto e corrente do verbo hebraico.
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: Mantém o valor lexical de עבד; no contexto régio, pode designar servos ou oficiais do rei, sem exigir a tradução mais interpretativa «oficiais».
- source_word: יְרוּשָׁלַיְמָה
  choice: a Jerusalém
  rationale: O ה direcional indica movimento em direção à cidade; esta é a formulação portuguesa mais natural.
- source_word: וְהוּא עַל לָכִישׁ
  choice: enquanto ele estava diante de Laquis
  rationale: Em contexto militar, עַל indica posição hostil contra uma cidade. «Diante de» preserva essa postura sem especificar além do texto que já se tratava formalmente de um cerco.
- source_word: וְכָל מֶמְשַׁלְתּוֹ עִמּוֹ
  choice: com todo o seu poderio consigo
  rationale: «Poderio» comunica o domínio ou poder sob o comando do rei e funciona naturalmente no contexto militar, sem limitar o referente apenas ao exército; a nota registra a amplitude da expressão.
- source_word: עַל יְחִזְקִיָּהוּ ... וְעַל כָּל יְהוּדָה
  choice: contra Ezequias ... e contra todo Judá
  rationale: A repetição de עַל, no contexto de uma missão hostil, é adequadamente representada por «contra».
- source_word: אֲשֶׁר בִּירוּשָׁלִַם
  choice: que estava em Jerusalém
  rationale: Qualifica coletivamente «todo Judá», isto é, os judeus presentes na cidade, preservando a forma coletiva do hebraico.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Introduz o discurso direto iniciado no versículo seguinte; os dois-pontos são idiomáticos em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário de alcance internacional. Os travessões preservam o comentário circunstancial no interior da frase. «Todo Judá» mantém o emprego coletivo do original, e «poderio» evita tanto a estranheza de um domínio territorial fisicamente presente quanto a redução interpretativa a forças militares apenas.
