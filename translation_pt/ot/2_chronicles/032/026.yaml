source:
  edition: WLC
  text: וַ/יִּכָּנַ֤ע יְחִזְקִיָּ֨הוּ֙ בְּ/גֹ֣בַהּ לִבּ֔/וֹ ה֖וּא וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם וְ/לֹא בָ֤א עֲלֵי/הֶם֙ קֶ֣צֶף יְהוָ֔ה בִּ/ימֵ֖י יְחִזְקִיָּֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/026.yaml
  text: But Hezekiah humbled himself for the pride of his heart[a], he and the inhabitants of Jerusalem, so the wrath of Yahweh did not come upon them in the days of Hezekiah.
translation:
  language: pt
  text: Então Ezequias se humilhou por causa do orgulho do seu coração[a], tanto ele como os habitantes de Jerusalém; por isso, a ira de Yahweh não veio sobre eles nos dias de Ezequias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quanto ao orgulho do seu coração”. A expressão hebraica significa literalmente “na altura do seu coração” e descreve orgulho ou arrogância interior.'
    reason: A preposição hebraica permite alguma nuance, enquanto a expressão nominal é um modo figurado de indicar orgulho.
lexical_decisions:
- source_word: וַיִּכָּנַע
  choice: se humilhou
  rationale: O nifal de כנע tem aqui sentido reflexivo ou médio no contexto, descrevendo a atitude voluntária de Ezequias em resposta ao seu orgulho.
- source_word: בְּגֹבַהּ לִבּוֹ
  choice: por causa do orgulho do seu coração
  rationale: גֹבַהּ significa literalmente 'altura' ou 'exaltação'; ligado a 'coração', expressa orgulho interior. A preposição בְּ admite aqui valor causal, explicitado em português para maior clareza.
- source_word: הוּא וְיֹשְׁבֵי יְרוּשָׁלָם
  choice: tanto ele como os habitantes de Jerusalém
  rationale: O pronome enfático inclui expressamente Ezequias com os moradores da cidade; 'tanto... como' reproduz essa inclusão com naturalidade.
- source_word: קֶצֶף יְהוָה
  choice: a ira de Yahweh
  rationale: קֶצֶף designa ira ou indignação intensa, especialmente no contexto de juízo divino; o nome יהוה é transliterado como 'Yahweh'.
- source_word: וְלֹא בָא עֲלֵיהֶם
  choice: não veio sobre eles
  rationale: Mantém de modo claro e próximo ao hebraico a expressão idiomática בוא על, usada aqui para a chegada do juízo.
- source_word: בִּימֵי יְחִזְקִיָּהוּ
  choice: nos dias de Ezequias
  rationale: Equivalente convencional e fiel da expressão temporal, sem restringi-la indevidamente apenas à vida ou apenas ao reinado.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama como nome próprio; 'Yahweh' preserva essa função e segue a orientação fornecida, sem substituí-lo por um título.
- issue: Relação entre humilhação e adiamento da ira divina
  choice: por isso, a ira de Yahweh não veio sobre eles nos dias de Ezequias
  alternative: e a ira de Yahweh não veio sobre eles nos dias de Ezequias
  rationale: A sequência narrativa apresenta a não ocorrência da ira naquele período como resultado da humilhação. A formulação preserva também o limite temporal do texto, sem afirmar que o juízo foi cancelado definitivamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução mantém a imagem bíblica do coração, emprega 'ira' para a gravidade de קֶצֶף e conserva a limitação temporal 'nos dias de Ezequias'.
