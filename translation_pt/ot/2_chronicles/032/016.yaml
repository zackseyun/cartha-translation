  text: וְ/עוֹד֙ דִּבְּר֣וּ עֲבָדָ֔י/ו עַל יְהוָ֖ה הָ/אֱלֹהִ֑ים וְ/עַ֖ל יְחִזְקִיָּ֥הוּ עַבְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/016.yaml
  text: And his servants spoke further against Yahweh God and against his servant Hezekiah[a].
translation:
  language: pt
  text: E os servos dele falaram ainda mais contra Yahweh Deus e contra Ezequias, seu servo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «falaram ainda mais sobre Yahweh Deus e sobre Ezequias, seu servo». A preposição hebraica também pode ter sentido mais neutro, mas, neste contexto, o sentido hostil «contra» é mais provável.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹד
  choice: continuaram
  rationale: No fluxo narrativo, a combinação indica que os servos acrescentaram outras palavras ao discurso hostil; «continuaram» expressa isso naturalmente em português.
- source_word: דִּבְּרוּ
  choice: falando
  rationale: O piel de דבר tem aqui o sentido comum de «falar»; a locução «continuaram falando» reproduz de modo idiomático a continuidade indicada por וְעוֹד.
- source_word: עֲבָדָיו
  choice: os servos dele
  rationale: עבד pode designar servo, escravo ou funcionário. Neste contexto régio, refere-se aos agentes do rei assírio; «servos» mantém a amplitude do hebraico sem enfatizar indevidamente escravidão nem restringir a função a «oficiais».
- source_word: עַל
  choice: contra
  rationale: Com דבר, a preposição pode ser neutra («sobre») ou adversativa. O contexto de afronta e blasfêmia favorece «contra», mantendo-se a alternativa na nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הָאֱלֹהִים
  choice: Deus
  rationale: Após o nome próprio «Yahweh», «Deus» comunica naturalmente a aposição hebraica, sem exigir a reprodução mecânica do artigo.
- source_word: וְעַל
  choice: e contra
  rationale: A repetição da preposição introduz o segundo alvo do discurso e preserva o paralelismo adversativo.
- source_word: יְחִזְקִיָּהוּ
  choice: Ezequias
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: עַבְדּוֹ
  choice: servo dele
  rationale: Apresenta Ezequias em relação de serviço e lealdade a Yahweh. «Servo» é mais adequado que «escravo» neste contexto régio e teológico; «dele» preserva com clareza a referência a Yahweh.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o Tetragrama; «Yahweh» conserva o nome pessoal divino, sem substituí-lo por um título.
- issue: Sentido de עבד aplicado a Ezequias
  choice: servo dele
  alternative: escravo dele
  rationale: Neste contexto, o termo caracteriza Ezequias como rei a serviço de Yahweh e leal a ele. «Escravo» introduziria uma ênfase social mais forte do que o contexto exige.
- issue: Força da preposição עַל após דבר
  choice: contra
  alternative: sobre
  rationale: Embora a construção possa ser mais neutra, o contexto imediato é de discurso blasfemo e hostil; por isso, «contra» é a leitura contextual mais provável, enquanto a ambiguidade lexical é preservada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A construção «os servos dele» evita a possível ambiguidade possessiva de «seus servos»; a repetição «dele» também esclarece que Ezequias é servo de Yahweh. A nota preserva a ambiguidade real da preposição hebraica.
