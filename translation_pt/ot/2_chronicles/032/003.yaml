base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/003.yaml
  text: And he consulted with his officials and his mighty men about stopping up the waters of the springs that were outside the city[a], and they helped him.
translation:
  language: pt
  text: Ele consultou seus oficiais e seus guerreiros sobre bloquear as águas das fontes que ficavam fora da cidade[a], e eles o ajudaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele tomou conselho com seus oficiais e seus guerreiros para bloquear as águas das fontes fora da cidade”.'
    reason: Alternativa lexical e sintática que preserva o valor final do infinitivo hebraico.
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: consultou
  rationale: O nifal de יעץ indica buscar ou tomar conselho com outras pessoas; “consultou” é natural em português moderno e mantém o caráter colaborativo.
- source_word: שָׂרָיו
  choice: seus oficiais
  rationale: שַׂר pode designar autoridades, chefes ou comandantes. “Oficiais” abrange adequadamente a função administrativa e militar sem sugerir necessariamente príncipes reais.
- source_word: גִבֹּרָיו
  choice: seus guerreiros
  rationale: גִּבּוֹר pode referir-se a homens fortes, valentes ou guerreiros. Neste contexto de preparação defensiva, “guerreiros” comunica de modo claro a provável nuance militar.
- source_word: לִסְתּוֹם
  choice: sobre bloquear
  rationale: O infinitivo apresenta o conteúdo ou propósito da consulta. “Sobre bloquear” é idiomático após “consultou” e descreve a obstrução das fontes.
- source_word: מֵימֵי הָעֲיָנוֹת
  choice: as águas das fontes
  rationale: Reproduz diretamente a construção hebraica e usa “fontes” no sentido geográfico de nascentes.
- source_word: אֲשֶׁר מִחוּץ לָעִיר
  choice: que ficavam fora da cidade
  rationale: A oração relativa localiza as fontes além do perímetro urbano; “ficavam” expressa naturalmente essa localização em português.
- source_word: וַיַּעְזְרֻהוּ
  choice: e eles o ajudaram
  rationale: עזר com sufixo masculino singular significa diretamente que os oficiais e guerreiros lhe deram ajuda.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Guerreiros” é mais natural que o decalque “homens poderosos”, e a nota preserva a possível leitura do infinitivo como propósito direto.
