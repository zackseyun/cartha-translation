base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/014.yaml
  text: Who among all the gods of these nations that my fathers devoted to destruction was able to deliver his people from my hand[a], that your God should be able to deliver you from my hand?
translation:
  language: pt
  text: Quem, entre todos os deuses destas nações que meus antepassados consagraram à destruição[a], foi capaz de livrar o seu povo da minha mão, que o Deus de vocês possa livrá-los da minha mão?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “puseram sob o anátema”. O verbo hebraico indica destinar algo à destruição.'
    reason: Alternativa lexical que explicita o sentido técnico de חרם.
lexical_decisions:
- source_word: מִי בְּכָל אֱלֹהֵי הַגּוֹיִם הָאֵלֶּה
  choice: Qual, dentre todos os deuses destas nações
  rationale: מִי introduz um desafio retórico, e בְּכָל tem sentido partitivo. “Qual, dentre todos” soa natural em português quando o referente é um deus individual entre muitos.
- source_word: אֲשֶׁר הֶחֱרִימוּ אֲבוֹתַי
  choice: que meus antepassados consagraram à destruição
  rationale: O hifil de חרם indica destinar ou entregar algo à destruição, e não apenas derrotar. “Consagraram à destruição” conserva essa força técnica; “antepassados” comunica naturalmente אֲבוֹתַי no contexto da retórica régia.
- source_word: אֲשֶׁר יָכוֹל לְהַצִּיל אֶת עַמּוֹ
  choice: conseguiu livrar o seu povo
  rationale: יָכוֹל expressa capacidade em referência passada. “Conseguiu” transmite de modo idiomático a ideia de ter sido capaz, e “livrar” representa נצל no contexto de libertação do poder militar.
- source_word: מִיָּדִי
  choice: das minhas mãos
  rationale: A expressão hebraica significa literalmente “da minha mão” como metáfora de poder ou domínio. O plural idiomático “das minhas mãos” é corrente em português e preserva a imagem.
- source_word: כִּי יוּכַל אֱלֹהֵיכֶם
  choice: para que o Deus de vocês consiga
  rationale: כִּי liga a comparação à conclusão desafiadora, e o imperfeito יוּכַל exprime capacidade sob tom de incredulidade. “Para que... consiga” mantém a lógica retórica sem transformar a frase numa simples afirmação futura.
- source_word: לְהַצִּיל אֶתְכֶם
  choice: livrá-los
  rationale: Repete-se “livrar” para o mesmo verbo נצל. “Livrá-los” retoma de modo claro os destinatários plurais do discurso.
theological_decisions:
- issue: Sentido de חרם na provocação assíria
  choice: consagraram à destruição
  alternative: destruíram; puseram sob o anátema
  rationale: A escolha preserva a ideia hebraica de destinar à destruição, sem reduzir o verbo a destruição comum nem depender do jargão menos acessível “anátema”.
- issue: Designação das divindades das nações
  choice: deuses
  alternative: supostos deuses; ídolos
  rationale: O discurso usa אֱלֹהֵי diretamente. A tradução conserva a retórica do personagem e não acrescenta uma avaliação editorial ausente do texto.
- issue: Referência singular ao povo de cada deus
  choice: o seu povo
  alternative: o povo deles
  rationale: Embora אֱלֹהֵי tenha forma plural na expressão coletiva, מִי e יָכוֹל focalizam qualquer deus individual; o singular mantém essa estrutura sem decidir além do que a pergunta retórica exige.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “De vocês” evita ambiguidade regional; “antepassados” é mais transparente hoje do que “pais” no sentido dinástico. A repetição de “das minhas mãos” preserva a ênfase arrogante da provocação.
