revisions:
- from: Qual, dentre todos os deuses destas nações que meus antepassados consagraram à destruição[a], conseguiu livrar o seu povo das minhas mãos, para que o Deus de vocês consiga livrá-los das minhas mãos?
  to: Quem, entre todos os deuses destas nações que meus antepassados consagraram à destruição[a], foi capaz de livrar o seu povo da minha mão, que o Deus de vocês possa livrá-los da minha mão?
  rationale: A revisão corrige a conexão sintática de כִּי, evitando a noção indevida de finalidade introduzida por “para que”. Também aproxima a pergunta de מִי com “Quem”, explicita a capacidade passada com “foi capaz de” e mantém o singular da metáfora “da minha mão”. O sentido e a função da nota sobre חרם são preservados.
