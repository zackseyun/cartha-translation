source:
  edition: WLC
  text: וְ/עַתָּ֡ה אַל יַשִּׁיא֩ אֶתְ/כֶ֨ם חִזְקִיָּ֜הוּ וְ/אַל יַסִּ֨ית אֶתְ/כֶ֣ם כָּ/זֹאת֮ וְ/אַל תַּאֲמִ֣ינוּ ל/וֹ֒ כִּי לֹ֣א יוּכַ֗ל כָּל אֱל֨וֹהַ֙ כָּל גּ֣וֹי וּ/מַמְלָכָ֔ה לְ/הַצִּ֥יל עַמּ֛/וֹ מִ/יָּדִ֖/י וּ/מִ/יַּ֣ד אֲבוֹתָ֑/י אַ֚ף כִּ֣י אֱֽלֹהֵי/כֶ֔ם לֹא יַצִּ֥ילוּ אֶתְ/כֶ֖ם מִ/יָּדִֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/015.yaml
  text: So now[a], do not let Hezekiah deceive you, and do not let him persuade you like this, and do not believe him; for no god of any nation or kingdom has been able to deliver his people from my hand and from the hand of my fathers[c][b]. How much less will your God deliver you from my hand!
translation:
  language: pt
  text: Agora, não deixem que Ezequias os engane, nem que os persuada dessa maneira[a]. Não acreditem nele, pois nenhum deus de qualquer nação ou reino conseguiu livrar o seu povo da minha mão e da mão dos meus antepassados[b]. Muito menos o Deus de vocês os livrará da minha mão![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os incite” ou “os seduza”, para “os persuada”.
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, “da minha mão e da mão dos meus antepassados”; aqui, “mão” representa poder ou domínio.
    reason: cultural_note
  - marker: c
    text: Ou “certamente o Deus de vocês não os livrará”; a expressão hebraica introduz uma conclusão negativa intensificada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Portanto, agora
  rationale: Preserva a transição conclusiva e a urgência imediata da exortação em português natural.
- source_word: יַשִּׁיא
  choice: engane
  rationale: Expressa diretamente a ideia de levar alguém ao erro por meio do engano.
- source_word: יַסִּית ... כָּזֹאת
  choice: persuada dessa maneira
  rationale: Mantém a noção de influência verbal sem confundi-la com o verbo anterior, traduzido por “engane”, nem acrescentar necessariamente a ideia de rebelião.
- source_word: תַּאֲמִינוּ לוֹ
  choice: acreditem nele
  rationale: No contexto, trata-se de aceitar como verdadeiras as palavras de Ezequias; a formulação é corrente e clara.
- source_word: כָּל אֱלוֹהַ כָּל גּוֹי וּמַמְלָכָה
  choice: nenhum deus de qualquer nação ou reino
  rationale: Reproduz em português idiomático a afirmação universal e negativa do discurso.
- source_word: לְהַצִּיל
  choice: livrar
  rationale: É adequado ao contexto de ameaça militar e mantém a ideia de resgate do poder inimigo.
- source_word: מִיַּדִי וּמִיַּד אֲבוֹתָי
  choice: da minha mão e da mão dos meus antepassados
  rationale: Conserva a repetição e a imagem hebraica da “mão” como poder ou domínio; “antepassados” comunica aqui a linhagem e os predecessores do rei.
- source_word: אַף כִּי
  choice: Muito menos
  rationale: 'Expressa o argumento intensificado do escárnio: se os outros deuses não livraram seus povos, na alegação do emissário assírio, o Deus de Judá ainda menos o faria.'
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: Embora a forma hebraica seja morfologicamente plural, o contexto aponta para o Deus singular de Judá; “de vocês” oferece ampla legibilidade moderna.
theological_decisions:
- issue: Referência de אֱלֹהֵיכֶם
  choice: “o Deus de vocês”, no singular, referindo-se ao Deus de Judá e de Israel
  alternative: “os deuses de vocês”
  rationale: Neste contexto, אֱלֹהִים é a forma convencional usada para o Deus singular de Israel. O plural sugeriria, indevidamente, que o discurso visa vários deuses judaítas.
- issue: Status da afirmação sobre a incapacidade de Deus para livrar
  choice: Preservar a fala como a provocação confiante do emissário assírio, sem corrigi-la dentro do versículo
  alternative: Inserir linguagem que negue ou qualifique explicitamente a afirmação
  rationale: O texto apresenta a alegação blasfema do personagem; a tradução deve manter sua força retórica sem transformá-la em afirmação do narrador nem antecipar a resposta teológica da narrativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A segunda pessoa plural foi expressa por “vocês”, evitando formas regionais ou arcaizantes. A imagem hebraica da “mão” foi mantida no texto e explicada em nota; a fala provocadora conserva sua tensão teológica e seu caráter retórico.
