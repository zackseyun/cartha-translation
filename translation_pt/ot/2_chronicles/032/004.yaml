base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/004.yaml
  text: So many people gathered together[a], and they stopped up all the springs and the stream that flowed through the land, saying[b], “Why should the kings of Assyria come and find abundant water?”
translation:
  language: pt
  text: 'Então, muita gente se reuniu e bloqueou todas as fontes e o ribeiro que corria pelo território, dizendo: “Por que os reis da Assíria[a] haveriam de vir e encontrar água em abundância?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os reis da Assíria”. O plural pode se referir ao poder régio ou à dinastia assíria; algumas traduções empregam o singular “o rei da Assíria” por causa do contexto histórico imediato.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ עַם רָב
  choice: muita gente se reuniu
  rationale: Expressa naturalmente o grande número de pessoas e preserva o valor do nifal como reunião do grupo.
- source_word: וַיִּסְתְּמוּ
  choice: bloqueou
  rationale: No contexto de fontes e de um curso de água, indica obstruir ou impedir o acesso; a concordância no singular retoma o coletivo “muita gente”.
- source_word: כָּל הַמַּעְיָנוֹת
  choice: todas as fontes
  rationale: “Fontes” é a designação portuguesa clara e corrente para nascentes naturais de água.
- source_word: הַנַּחַל הַשּׁוֹטֵף
  choice: o ribeiro que corria
  rationale: נַחַל pode designar ribeiro, torrente ou uádi; “ribeiro” é amplamente compreensível, e “que corria” comunica o curso de água em fluxo sem sugerir necessariamente inundação.
- source_word: בְּתוֹךְ הָאָרֶץ
  choice: pelo território
  rationale: No contexto militar, הָאָרֶץ se refere à área ou território atravessado pelo curso de água; “pelo” comunica seu percurso.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Preserva o marcador hebraico que introduz a fala e sua justificativa.
- source_word: לָמָּה יָבֹאוּ
  choice: Por que deixar que ... venham
  rationale: 'Reproduz a força deliberativa da pergunta retórica: impedir que os invasores tenham acesso à água.'
- source_word: מַלְכֵי אַשּׁוּר
  choice: os reis da Assíria
  rationale: Mantém o plural explícito do texto massorético, sem ajustá-lo silenciosamente ao singular do contexto histórico imediato.
- source_word: וּמָצְאוּ מַיִם רַבִּים
  choice: e encontrem água em abundância
  rationale: Traduz a ideia de uma provisão grande ou abundante de água em português natural e digno.
theological_decisions:
- issue: Plural “reis da Assíria” no texto hebraico
  choice: Manter “os reis da Assíria”
  alternative: “o rei da Assíria”
  rationale: O plural é a leitura direta do hebraico e pode aludir ao poder régio ou à dinastia assíria; não há razão textual suficiente para harmonizá-lo no corpo da tradução.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantém-se o plural incomum do hebraico e evita-se o regionalismo técnico “uádi” no texto principal.
