base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/030.yaml
  text: It was Hezekiah who stopped up the upper outlet of the waters of Gihon and directed them down to the west side of the city of David[b][a]. And Hezekiah prospered in all his work.
translation:
  language: pt
  text: Foi Ezequias quem fechou a saída superior das águas de Giom[a] e as conduziu para baixo, para o oeste, até a Cidade de Davi[b]. E Ezequias prosperou em tudo o que fez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a nascente superior de Giom”. O termo hebraico pode designar o lugar por onde a água sai ou, de modo mais amplo, a própria nascente ou corrente de saída.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para baixo, para o lado oeste da Cidade de Davi”. O hebraico permite alguma incerteza quanto à relação exata entre a direção oeste e a Cidade de Davi; o verbo também pode sugerir que se fez a água seguir um curso reto.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: וְהוּא יְחִזְקִיָּהוּ
  choice: Foi Ezequias quem
  rationale: Reproduz em português natural a ênfase conferida pelo pronome seguido do nome próprio.
- source_word: סָתַם
  choice: fechou
  rationale: Expressa o bloqueio de uma abertura no contexto de obras hidráulicas, sem sugerir necessariamente seu preenchimento completo.
- source_word: מוֹצָא מֵימֵי גִיחוֹן הָעֶלְיוֹן
  choice: a saída superior das águas de Giom
  rationale: Mantém a cadeia nominal hebraica e a distinção topográfica indicada por 'superior', sem definir excessivamente a natureza da instalação hidráulica.
- source_word: וַיַּישְּׁרֵם
  choice: as conduziu
  rationale: O causativo de ישר indica que Ezequias fez as águas seguirem um curso dirigido; 'conduziu' é claro e natural.
- source_word: לְמַטָּה מַּעְרָבָה לְעִיר דָּוִיד
  choice: para baixo, em direção ao lado oeste da Cidade de Davi
  rationale: Comunica tanto o movimento descendente quanto a direção oeste. A formulação reconhece a possível leitura locativa da relação com a Cidade de Davi, preservando em nota a alternativa sintática.
- source_word: וַיַּצְלַח
  choice: prosperou
  rationale: Preserva o sentido amplo de êxito e bom resultado nas atividades de Ezequias.
- source_word: בְּכָל מַעֲשֵׂהוּ
  choice: em tudo o que fez
  rationale: Formulação idiomática que traduz o coletivo singular 'sua obra/seu empreendimento' sem restringi-lo a uma única obra.
