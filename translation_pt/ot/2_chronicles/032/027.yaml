base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/027.yaml
  text: And Hezekiah had very great wealth and honor[a], and he made storehouses for silver and gold, precious stones, spices, shields[b], and every desirable article.
translation:
  language: pt
  text: E Ezequias teve riquezas e honra em enorme abundância. Ele construiu para si depósitos[a] para a prata, o ouro, as pedras preciosas, as especiarias, os escudos e todos os objetos valiosos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “câmaras do tesouro”. O termo hebraico pode designar tanto instalações de armazenamento em geral quanto recintos destinados aos tesouros reais.
    reason: lexical_alternative
  - marker: b
    text: Ou “todos os utensílios preciosos”. A expressão hebraica é ampla e pode incluir diversos tipos de artigos valiosos ou luxuosos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִיחִזְקִיָּהוּ
  choice: E Ezequias teve
  rationale: A construção hebraica expressa posse; “teve” é a forma natural em português, enquanto “E” mantém a continuidade narrativa.
- source_word: עֹשֶׁר וְכָבוֹד הַרְבֵּה מְאֹד
  choice: riquezas e honra em enorme abundância
  rationale: “Riquezas” comunica prosperidade material, e “honra” expressa prestígio e esplendor régio. A expressão “em enorme abundância” conserva a forte intensificação hebraica.
- source_word: וְאֹצָרוֹת עָשָׂה לוֹ
  choice: Ele construiu para si depósitos
  rationale: אֹצָרוֹת pode designar instalações de armazenamento ou câmaras do tesouro. “Depósitos” mantém o sentido amplo, e “para si” representa explicitamente לוֹ. “Construiu” expressa de modo natural a preparação dessas instalações no contexto.
- source_word: לְכֶסֶף וּלְזָהָב וּלְאֶבֶן יְקָרָה
  choice: para a prata, o ouro, as pedras preciosas
  rationale: A preposição inicial introduz a finalidade dos depósitos e rege naturalmente toda a enumeração em português. O singular coletivo hebraico אֶבֶן יְקָרָה é vertido pelo plural idiomático “pedras preciosas”.
- source_word: וְלִבְשָׂמִים
  choice: as especiarias
  rationale: O termo abrange substâncias aromáticas; “especiarias” preserva essa amplitude melhor que opções mais restritas como “perfumes”.
- source_word: וּלְמָגִנִּים
  choice: os escudos
  rationale: מָגִנִּים designa especificamente escudos, não armamento em geral.
- source_word: וּלְכֹל כְּלֵי חֶמְדָּה
  choice: e todos os objetos valiosos
  rationale: כְּלֵי é amplo e pode indicar objetos, artigos, utensílios ou recipientes; חֶמְדָּה caracteriza aquilo que é desejável ou precioso. A formulação evita restringir indevidamente a categoria.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A enumeração mantém todos os elementos do hebraico sem repetir mecanicamente a preposição antes de cada item, pois em português ela rege naturalmente a lista inteira. Os marcadores foram colocados junto às expressões às quais as notas efetivamente se referem.
