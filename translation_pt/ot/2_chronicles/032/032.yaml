  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יְחִזְקִיָּ֖הוּ וַ/חֲסָדָ֑י/ו הִנָּ֣/ם כְּתוּבִ֗ים בַּ/חֲז֞וֹן יְשַֽׁעְיָ֤הוּ בֶן אָמוֹץ֙ הַ/נָּבִ֔יא עַל סֵ֥פֶר מַלְכֵי יְהוּדָ֖ה וְ/יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/032.yaml
  text: The rest of the acts of Hezekiah and his faithful deeds—behold[a], they are written in the vision of Isaiah son of Amoz, the prophet, in the Book of the Kings of Judah and Israel.
translation:
  language: pt
  text: Quanto aos demais atos de Ezequias e às suas obras de fidelidade, eis que estão escritos[a] na visão do profeta Isaías, filho de Amoz, no Livro dos Reis de Judá e de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estão registrados”. O hebraico emprega uma expressão que chama a atenção para o registro: literalmente, “eis que estão escritos”.'
    reason: Preserva a força apresentativa de הִנָּם e apresenta uma alternativa corrente para כְּתוּבִים.
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְחִזְקִיָּהוּ
  choice: Quanto aos demais atos de Ezequias
  rationale: A fórmula historiográfica refere-se ao restante dos feitos ou assuntos do rei. “Quanto aos demais” expressa naturalmente a transição, sem acrescentar um advérbio temporal inexistente no hebraico.
- source_word: וַחֲסָדָיו
  choice: e às suas obras de fidelidade
  rationale: חֶסֶד, aplicado à conduta de Ezequias, aponta para lealdade e fidelidade manifestadas em ações. A formulação preserva essa dimensão sem impor no texto principal um sentido técnico exclusivamente pactual.
- source_word: הִנָּם כְּתוּבִים
  choice: eles estão registrados
  rationale: O pronome explícito preserva a força apresentativa de הִנָּם, enquanto “estão registrados” comunica em português corrente o sentido documental de כְּתוּבִים.
- source_word: בַּחֲזוֹן
  choice: na visão
  rationale: חָזוֹן significa primariamente “visão” e pode designar, por extensão, o registro profético; o sentido lexical principal é mantido.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: do profeta Isaías, filho de Amoz
  rationale: Ordem natural em português, preservando o nome, a filiação e o ofício profético.
- source_word: עַל סֵפֶר מַלְכֵי יְהוּדָה וְיִשְׂרָאֵל
  choice: que faz parte do Livro dos Reis de Judá e de Israel
  rationale: Nesta fórmula bibliográfica, עַל relaciona a visão de Isaías ao livro-fonte maior. “Que faz parte de” torna clara essa relação em português sem o pouco natural “sobre o livro”.
theological_decisions:
- issue: Nuance de חֶסֶד aplicada às ações de Ezequias
  choice: obras de fidelidade
  alternative: atos de lealdade; obras de amor leal; atos de fidelidade à aliança
  rationale: A escolha conserva as ideias ética e relacional de fidelidade e lealdade, mas evita afirmar no texto principal que o termo funciona aqui necessariamente como expressão técnica de fidelidade à aliança.
- issue: Relação entre a visão de Isaías e o Livro dos Reis
  choice: a visão faz parte do Livro dos Reis de Judá e de Israel
  alternative: a visão está registrada no Livro dos Reis; a visão está junto ao Livro dos Reis
  rationale: O hebraico עַל admite alguma tensão nesta fórmula bibliográfica. A redação escolhida entende o registro de Isaías como incorporado à obra citada, sem identificá-la com os livros bíblicos canônicos de Reis.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural para leitores brasileiros e compreensão ampla no mundo lusófono. Mantém “visão” e “Livro” como termos formais da citação historiográfica.
