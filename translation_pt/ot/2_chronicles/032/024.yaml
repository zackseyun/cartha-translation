  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם חָלָ֥ה יְחִזְקִיָּ֖הוּ עַד לָ/מ֑וּת וַ/יִּתְפַּלֵּל֙ אֶל יְהוָ֔ה וַ/יֹּ֣אמֶר ל֔/וֹ וּ/מוֹפֵ֖ת נָ֥תַן לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/024.yaml
  text: In those days Hezekiah became sick to the point of death[a], and he prayed to Yahweh[b], and he answered him and gave him a sign.
translation:
  language: pt
  text: Naqueles dias, Ezequias adoeceu e ficou à beira da morte. Ele orou a Yahweh, que lhe respondeu[a] e lhe deu um sinal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “lhe disse”. Aqui, o verbo tem o sentido de responder à oração de Ezequias.'
    reason: lexical_alternative
  - marker: b
    text: Ou “prodígio” ou “portento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: Naqueles dias
  rationale: Expressão temporal natural em português que preserva de perto o idioma hebraico.
- source_word: חָלָה ... עַד לָמוּת
  choice: adoeceu e ficou à beira da morte
  rationale: Comunica tanto o início da enfermidade quanto sua gravidade extrema em linguagem portuguesa clara e atual.
- source_word: וַיִּתְפַּלֵּל אֶל יְהוָה
  choice: Ele orou a Yahweh
  rationale: Traduz diretamente o verbo comum para orar e preserva o nome divino representado pelo Tetragrama.
- source_word: וַיֹּאמֶר לוֹ
  choice: que lhe respondeu
  rationale: Embora o verbo hebraico seja literalmente “disse”, no contexto ele expressa a resposta de Yahweh à oração de Ezequias; a nota conserva a forma lexical mais estrita.
- source_word: מוֹפֵת
  choice: sinal
  rationale: No contexto, designa o sinal extraordinário que confirma a resposta divina; “sinal” é claro e não elimina as nuances de prodígio ou portento.
- source_word: נָתַן לוֹ
  choice: lhe deu
  rationale: Correspondência direta e idiomática do verbo נתן com o objeto indireto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome próprio da aliança presente no texto hebraico, sem substituí-lo por um título.
- issue: Identidade do sujeito de וַיֹּאמֶר e וּמוֹפֵת נָתַן
  choice: Yahweh respondeu e deu o sinal
  alternative: Sujeito formalmente não repetido no hebraico
  rationale: A sequência narrativa aponta naturalmente para Yahweh como sujeito da resposta e da concessão do sinal, em consonância com os relatos paralelos, sem introduzir uma explicação teológica adicional.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. A construção evita arcaísmos, preserva o nome Yahweh e registra em notas as alternativas lexicais genuínas.
