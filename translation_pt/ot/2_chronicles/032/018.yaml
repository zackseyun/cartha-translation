base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/018.yaml
  text: And they called out loudly in Judean to the people of Jerusalem who were on the wall, to frighten them and to terrify them, so that they might capture the city.
translation:
  language: pt
  text: Eles gritaram bem alto, em judaico, para o povo de Jerusalém que estava sobre a muralha, a fim de amedrontá-lo e aterrorizá-lo, para que pudessem tomar a cidade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוּדִית
  choice: em judaico
  rationale: Designa a língua ou o dialeto de Judá; “em judaico” preserva a referência histórica específica sem substituí-la genericamente por “hebraico”.
- source_word: בְקוֹל גָּדוֹל
  choice: bem alto
  rationale: Expressa de modo natural em português a ideia adverbial de falar com voz forte e elevada.
- source_word: יִלְכְּדוּ
  choice: pudessem tomar
  rationale: No contexto militar, o verbo significa capturar ou apoderar-se da cidade; “tomar” é claro e idiomático.
