base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/006.yaml
  text: And he appointed military commanders over the people[a], gathered them to himself in the square at the city gate, and spoke to their hearts, saying,
translation:
  language: pt
  text: 'Ele nomeou comandantes militares sobre o povo e os reuniu para junto de si na praça junto ao portão da cidade; falou ao coração deles[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expressão hebraica que indica falar de modo a encorajar ou fortalecer alguém.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: nomeou
  rationale: Embora o verbo signifique literalmente “dar” ou “colocar”, nesta construção com autoridades sobre um povo indica designação para uma função.
- source_word: שָׂרֵי מִלְחָמוֹת
  choice: comandantes militares
  rationale: A expressão designa os líderes responsáveis pelas forças de guerra; a formulação é clara e atual.
- source_word: עַל הָעָם
  choice: sobre o povo
  rationale: Com o verbo de nomeação, a preposição expressa autoridade ou supervisão.
- source_word: וַיִּקְבְּצֵם אֵלָיו
  choice: os reuniu ao seu redor
  rationale: Preserva tanto a ação de reunir quanto a ideia de que Ezequias os convocou para junto de si.
- source_word: אֶל רְחוֹב שַׁעַר הָעִיר
  choice: na praça junto ao portão da cidade
  rationale: רְחוֹב indica uma área pública aberta associada ao portão; “praça” comunica naturalmente esse espaço cívico.
- source_word: וַיְדַבֵּר עַל לְבָבָם
  choice: falou ao coração deles
  rationale: Mantém a imagem do idioma hebraico, que neste contexto indica uma fala destinada a encorajar e fortalecer.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Introduz de modo natural a fala direta que continua no versículo seguinte.
