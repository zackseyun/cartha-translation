  text: וַֽ/יְדַבְּר֔וּ אֶל אֱלֹהֵ֖י יְרוּשָׁלִָ֑ם כְּ/עַ֗ל אֱלֹהֵי֙ עַמֵּ֣י הָ/אָ֔רֶץ מַעֲשֵׂ֖ה יְדֵ֥י הָ/אָדָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/019.yaml
  text: And they spoke against the God of Jerusalem as against the gods of the peoples of the earth[b][a], the work of human hands.
translation:
  language: pt
  text: E falaram contra o Deus de Jerusalém como contra os deuses dos povos da terra, obra de mãos humanas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: E falaram
  rationale: O piel de דבר tem o sentido comum de “falar”; o caráter hostil é expresso pela preposição no contexto, sem sobrecarregar o verbo.
- source_word: אֶל
  choice: contra
  rationale: Embora אֶל normalmente signifique “a” ou “para”, aqui introduz o alvo de uma fala hostil e blasfema; “contra” comunica naturalmente essa força contextual.
- source_word: אֱלֹהֵי יְרוּשָׁלִָם
  choice: o Deus de Jerusalém
  rationale: A forma construta pode ter sentido singular quando designa o Deus de Israel, e o contexto contrasta o Deus único de Jerusalém com os deuses fabricados dos povos.
- source_word: כְּעַל
  choice: como contra
  rationale: A expressão compara o modo hostil como falaram do Deus de Jerusalém com o modo como falaram dos deuses dos povos.
- source_word: אֱלֹהֵי עַמֵּי הָאָרֶץ
  choice: os deuses dos povos da terra
  rationale: Aqui אֱלֹהֵי tem sentido claramente plural; “povos da terra” conserva de perto a formulação hebraica e é compreensível em português.
- source_word: מַעֲשֵׂה יְדֵי הָאָדָם
  choice: obra de mãos humanas
  rationale: A expressão caracteriza os deuses pagãos como objetos fabricados por seres humanos; esta formulação é natural, concisa e preserva o contraste do texto.
theological_decisions:
- issue: Se a fala deve ser apresentada como dirigida “ao” Deus de Jerusalém ou proferida “contra” ele
  choice: contra
  alternative: ao
  rationale: O contexto imediato descreve zombaria e blasfêmia por parte dos servos de Senaqueribe. “Contra” expressa a força hostil da construção sem acrescentar conteúdo teológico.
- issue: Se אֱלֹהֵי יְרוּשָׁלִָם deve ser entendido no singular ou no plural
  choice: o Deus de Jerusalém
  alternative: os deuses de Jerusalém
  rationale: אֱלֹהִים e sua forma construta são regularmente usados com sentido singular para o Deus de Israel. O contraste com os deuses feitos por mãos humanas confirma o singular neste contexto.
- issue: Alcance de “obra de mãos humanas”
  choice: aposto referente aos deuses dos povos da terra
  alternative: descrição que também incluiria o Deus de Jerusalém
  rationale: A sintaxe e a intenção polêmica do versículo apresentam os deuses das nações como manufaturados; os assírios falaram do Deus de Jerusalém como se ele pertencesse à mesma categoria, sem que o narrador endosse essa identificação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a comparação do hebraico foram preservadas sem tornar a frase artificial. Não foram necessárias notas, pois “contra” comunica adequadamente a força contextual e “obra de mãos humanas” preserva o sentido do original.
