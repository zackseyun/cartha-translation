  text: הֲ/לֹא הוּא֙ יְחִזְקִיָּ֔הוּ הֵסִ֥יר אֶת בָּמֹתָ֖י/ו וְ/אֶת מִזְבְּחֹתָ֑י/ו וַ/יֹּ֨אמֶר לִֽ/יהוּדָ֤ה וְ/לִֽ/ירוּשָׁלִַ֨ם֙ לֵ/אמֹ֔ר לִ/פְנֵ֨י מִזְבֵּ֧חַ אֶחָ֛ד תִּֽשְׁתַּחֲו֖וּ וְ/עָלָ֥י/ו תַּקְטִֽירוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/012.yaml
  text: Was it not Hezekiah himself who removed his high places and his altars[a], and said to Judah and Jerusalem, saying, ‘Before one altar you shall bow down, and on it you shall burn incense’?”
translation:
  language: pt
  text: 'Não foi o próprio Ezequias que removeu os seus lugares altos e os seus altares e disse a Judá e a Jerusalém: “Diante de um só altar vocês se prostrarão e sobre ele queimarão incenso”[a]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Diante de um único altar vocês adorarão e sobre ele farão subir ofertas em fumaça”.'
    reason: Registra as alternativas lexicais legítimas de השתחוה, que pode ser expresso como adorar, e de קטר, que pode abranger fazer uma oferta subir em fumaça.
lexical_decisions:
- source_word: הֲלֹא
  choice: Não foi... que
  rationale: Introduz uma pergunta retórica que espera concordância e se ajusta naturalmente ao contexto passado.
- source_word: הוּא יְחִזְקִיָּהוּ
  choice: o próprio Ezequias
  rationale: Preserva a ênfase produzida pelo pronome seguido do nome próprio.
- source_word: הֵסִיר
  choice: removeu
  rationale: Expressa de modo direto o sentido causativo de afastar ou eliminar os locais de culto.
- source_word: בָּמֹתָיו
  choice: os seus lugares altos
  rationale: Mantém tanto o termo cultual tradicional quanto o sufixo possessivo, que faz parte da caracterização polêmica do orador assírio.
- source_word: מִזְבְּחֹתָיו
  choice: os seus altares
  rationale: Representa explicitamente o sufixo possessivo hebraico sem endossar a perspectiva do orador.
- source_word: וַיֹּאמֶר לִיהוּדָה וְלִירוּשָׁלִַם לֵאמֹר
  choice: e disse a Judá e a Jerusalém
  rationale: A fórmula hebraica de introdução da fala é vertida com naturalidade; reproduzir literalmente 'dizendo' seria redundante em português atual.
- source_word: לִפְנֵי מִזְבֵּחַ אֶחָד
  choice: Diante de um só altar
  rationale: Preserva o sentido espacial de לִפְנֵי e salienta a unicidade do altar no argumento do orador.
- source_word: תִּשְׁתַּחֲווּ
  choice: vocês se prostrarão
  rationale: Conserva a imagem física de inclinar-se em ato de culto e usa uma forma amplamente compreensível no português moderno.
- source_word: וְעָלָיו תַּקְטִירוּ
  choice: e sobre ele queimarão incenso
  rationale: קטר no hifil pode designar a queima de incenso ou a produção de fumaça sacrificial; 'queimar incenso' é claro no texto principal, com a amplitude lexical indicada em nota.
theological_decisions:
- issue: Perspectiva do orador nos possessivos ligados aos lugares altos e altares
  choice: Manter 'os seus lugares altos e os seus altares' como caracterização do orador assírio.
  alternative: 'Suprimir os possessivos: ''os lugares altos e os altares''.'
  rationale: Os sufixos estão expressos no hebraico. Mantê-los preserva a acusação polêmica e não transforma a tradução em correção teológica do discurso citado.
- issue: Centralização do culto em um altar
  choice: Traduzir simplesmente 'diante de um só altar', sem identificar ou justificar o altar no corpo do versículo.
  alternative: Explicitar 'diante do altar do templo' ou explicar a reforma de Ezequias.
  rationale: O versículo relata a acusação do emissário assírio. A formulação conserva a tensão entre a apresentação hostil da reforma e sua avaliação no contexto mais amplo de Crônicas.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por 'vocês' em discurso dirigido ao povo. A fórmula hebraica 'disse... dizendo' foi simplificada por naturalidade, sem perda de conteúdo. O marcador [a] aparece no texto principal.
