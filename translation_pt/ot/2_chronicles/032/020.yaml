base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/020.yaml
  text: Then Hezekiah the king and Isaiah son of Amoz[a], the prophet, prayed because of this and cried out to heaven.
translation:
  language: pt
  text: Então o rei Ezequias e o profeta Isaías, filho de Amoz, oraram por causa disso e clamaram aos céus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao céu”. O substantivo hebraico tem forma plural.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: oraram
  rationale: O hitpael de פלל significa normalmente “orar”. Embora o primeiro verbo esteja no singular no hebraico, ele antecede um sujeito composto, e o verbo seguinte está no plural; o português expressa naturalmente a ação conjunta no plural.
- source_word: יְחִזְקִיָּהוּ הַמֶּלֶךְ
  choice: o rei Ezequias
  rationale: Mantém o nome na forma portuguesa consagrada e conserva o título explícito, em ordem natural no português.
- source_word: וִישַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: o profeta Isaías, filho de Amoz
  rationale: Preserva o nome, a filiação e o título explícitos no hebraico, com pontuação e ordem naturais em português.
- source_word: עַל זֹאת
  choice: por causa disso
  rationale: Neste contexto, a expressão indica a situação que motivou a oração. “Por causa disso” comunica essa relação de maneira clara, sem excluir por completo a ideia de orar a respeito do assunto.
- source_word: וַיִּזְעֲקוּ
  choice: clamaram
  rationale: זעק descreve um clamor urgente em aflição ou apelo. “Clamaram” preserva a intensidade e é corrente no registro bíblico moderno.
- source_word: הַשָּׁמָיִם
  choice: aos céus
  rationale: O substantivo hebraico tem forma plural, e “aos céus” preserva essa forma de modo natural em português, indicando a direção do clamor.
theological_decisions:
- issue: Sentido de הַשָּׁמָיִם no contexto de oração
  choice: aos céus
  alternative: ao céu
  rationale: A tradução mantém o plural formal do hebraico sem transformar a frase em uma afirmação cosmológica específica. No contexto, a expressão indica que o clamor se dirige para o âmbito celestial.
- issue: Relação expressa por עַל זֹאת
  choice: por causa disso
  alternative: a respeito disso
  rationale: O contexto favorece a situação ameaçadora como motivo da oração, mas a construção hebraica também pode introduzir o assunto dela. A opção escolhida é natural e preserva a relação causal contextual sem acrescentar conteúdo doutrinário.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem dos títulos foi ajustada à sintaxe natural do português, e “clamaram” conserva a força do apelo urgente.
