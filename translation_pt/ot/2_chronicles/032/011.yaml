base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/011.yaml
  text: Is not Hezekiah misleading you[a], to give you over to die by famine and by thirst, saying, ‘Yahweh our God will deliver us from the hand of the king of Assyria’?”
translation:
  language: pt
  text: 'Não é Ezequias que está enganando vocês[a], entregando-os para morrer de fome e de sede, ao dizer: ‘Yahweh, nosso Deus, nos livrará da mão do rei da Assíria’?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desencaminhando vocês” ou “induzindo vocês ao erro”. O verbo hebraico pode indicar levar alguém a se desviar ou persuadi-lo de maneira errada.
    reason: alternativa lexical
lexical_decisions:
- source_word: הֲלֹא
  choice: Não é ... que
  rationale: Preserva a pergunta retórica que espera concordância e mantém o tom acusatório em português natural.
- source_word: מַסִּית
  choice: enganando
  rationale: Expressa a ideia de induzir alguém ao erro sem restringir indevidamente o verbo a incitar ou seduzir; as alternativas semânticas são registradas em nota.
- source_word: לָתֵת אֶתְכֶם לָמוּת
  choice: entregando-os para morrer
  rationale: Reproduz a construção de dar ou entregar pessoas a um destino fatal, com formulação corrente e clara.
- source_word: בְּרָעָב וּבְצָמָא
  choice: de fome e de sede
  rationale: É a expressão portuguesa natural para os meios ou causas da morte durante um cerco; o contexto permite que רָעָב denote fome severa ou escassez.
- source_word: לֵאמֹר
  choice: ao dizer
  rationale: Introduz naturalmente em português a alegação atribuída a Ezequias e explicita como ocorre o suposto engano.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Mantém diretamente a construção possessiva e a declaração citada.
- source_word: יַצִּילֵנוּ
  choice: nos livrará
  rationale: O hifil de נצל indica livrar ou resgatar; 'livrará' se ajusta ao contexto militar e teológico sem ampliar o sentido.
- source_word: מִכַּף
  choice: das mãos de
  rationale: Conserva a imagem hebraica de mão como poder ou domínio, usando o plural idiomático comum em português.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: o rei da Assíria
  rationale: Tradução direta e natural da cadeia construta hebraica.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz explicitamente o Tetragrama; a transliteração preserva o nome pessoal e evita substituí-lo silenciosamente por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega 'vocês' para o plural e mantém a força retórica da acusação. A imagem 'das mãos' preserva o idioma hebraico sem prejudicar a clareza.
