base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/001.yaml
  text: After these things and this faithfulness[a], Sennacherib king of Assyria came and entered Judah[c][b], and he encamped against the fortified cities and intended to break into them for himself.
translation:
  language: pt
  text: Depois dessas coisas e dessa fidelidade[a], Senaqueribe, rei da Assíria, veio e entrou em Judá. Acampou contra as cidades fortificadas e planejou abrir brechas nelas para si[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e dessas ações fiéis”. O termo hebraico também pode significar “verdade”; aqui, provavelmente se refere à conduta fiel de Ezequias narrada anteriormente.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “planejou rompê-las para si”. A frase hebraica expressa o propósito de Senaqueribe de romper as defesas das cidades para delas se apoderar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי הַדְּבָרִים
  choice: Depois dessas coisas
  rationale: Mantém a fórmula narrativa hebraica de sequência temporal em português natural.
- source_word: וְהָאֱמֶת הָאֵלֶּה
  choice: e dessa fidelidade
  rationale: אֱמֶת pode significar verdade ou fidelidade; no contexto, retoma a conduta fiel de Ezequias, sem explicitar além do texto.
- source_word: סַנְחֵרִיב מֶלֶךְ אַשּׁוּר
  choice: Senaqueribe, rei da Assíria
  rationale: Emprega a forma portuguesa tradicional do nome e apresenta o título com pontuação natural.
- source_word: וַיָּבֹא בִיהוּדָה
  choice: veio e entrou em Judá
  rationale: Preserva a repetição do verbo hebraico בוא na sequência e expressa claramente o movimento para dentro do território.
- source_word: וַיִּחַן עַל הֶעָרִים הַבְּצֻרוֹת
  choice: Acampou contra as cidades fortificadas
  rationale: Traduz de modo direto חנה com עַל, sem tornar explícito um cerco que está apenas implícito.
- source_word: וַיֹּאמֶר לְבִקְעָם אֵלָיו
  choice: e planejou abri-las à força para si
  rationale: A construção idiomática indica intenção; בקע expressa abrir ou romper à força, e אֵלָיו conserva a ideia de apropriação ou vantagem própria.
