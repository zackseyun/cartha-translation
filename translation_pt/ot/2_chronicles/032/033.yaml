    text: Ou “dos descendentes de Davi”; aqui, “filhos de Davi” se refere à linhagem real davídica.
    reason: Alternativa lexical e esclarecimento do sentido dinástico de בְנֵי דָוִיד.
  revision_rationale: A revisão limita-se a substituir “parte mais alta” por “parte elevada”, evitando acrescentar um grau superlativo ausente do hebraico e mantendo aberta a nuance topográfica de בְּמַעֲלֵה. O restante do texto e a nota estão fiéis, naturais e adequadamente ancorados.
