base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/033.yaml
  text: And Hezekiah slept with his fathers[a], and they buried him in the upper part of the tombs of the sons of David. And all Judah and the inhabitants of Jerusalem honored him at his death, and Manasseh his son reigned in his place.
translation:
  language: pt
  text: Ezequias descansou com seus pais, e o sepultaram na parte elevada dos túmulos dos filhos de Davi[a]. Todo o Judá e os habitantes de Jerusalém lhe prestaram honra por ocasião de sua morte. E seu filho Manassés reinou em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos descendentes de Davi”; aqui, “filhos de Davi” se refere à linhagem real davídica.
    reason: Alternativa lexical e esclarecimento do sentido dinástico de בְנֵי דָוִיד.
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: descansou com seus pais
  rationale: Preserva o eufemismo hebraico tradicional da fórmula régia de falecimento, sem reduzi-lo simplesmente a “morreu”. Em português, “descansou” comunica melhor o sentido fúnebre do que o literal “dormiu”, e “com seus pais” mantém a expressão bíblica e dinástica.
- source_word: וַיִּקְבְּרֻהוּ
  choice: o sepultaram
  rationale: Mantém a forma ativa plural do hebraico, com sujeito indeterminado, em vez de transformá-la em passiva.
- source_word: בְּמַעֲלֵה
  choice: na parte mais alta
  rationale: Expressa o provável sentido topográfico de lugar elevado sem impor uma reconstrução arquitetônica específica; o termo também pode designar uma subida.
- source_word: קִבְרֵי בְנֵי דָוִיד
  choice: dos túmulos dos filhos de Davi
  rationale: Conserva a forma concreta do hebraico e a referência à linhagem real davídica; a nota esclarece o sentido amplo de “filhos”.
- source_word: וְכָבוֹד עָשׂוּ לוֹ
  choice: lhe prestaram honra
  rationale: Reproduz naturalmente o idiomatismo hebraico “fizeram honra a ele”, mantendo o caráter público e solene da homenagem.
- source_word: בְּמוֹתוֹ
  choice: por ocasião de sua morte
  rationale: Comunica com clareza a relação temporal e o contexto de homenagem fúnebre.
- source_word: כָּל יְהוּדָה וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: Todo o Judá e os habitantes de Jerusalém
  rationale: Mantém o alcance coletivo da expressão hebraica em linguagem portuguesa natural e digna.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  choice: reinou em seu lugar
  rationale: Preserva a fórmula hebraica convencional de sucessão dinástica.
theological_decisions:
- issue: Eufemismo de morte na fórmula régia
  choice: Manter a imagem tradicional em “descansou com seus pais”.
  alternative: Traduzir diretamente como “morreu” ou usar o mais literal “dormiu com seus pais”.
  rationale: A formulação conserva a continuidade literária e teológica das narrativas régias, mas usa em português uma expressão fúnebre clara e natural.
- issue: Alcance de “filhos de Davi”
  choice: Manter “filhos de Davi” no texto e explicar em nota seu sentido dinástico amplo.
  alternative: Traduzir diretamente como “descendentes de Davi”.
  rationale: A escolha preserva a forma hebraica sem ocultar que, no contexto, a expressão abrange a linhagem real davídica.
translation_notes:
  register: Português moderno, solene e acessível, com boa legibilidade brasileira. A ordem das orações acompanha de perto o hebraico, mas a sintaxe permanece natural. O marcador [a] foi colocado após “filhos de Davi”, expressão à qual a nota efetivamente se refere.
