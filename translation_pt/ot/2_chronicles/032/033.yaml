revisions:
- from: Ezequias descansou com seus pais, e o sepultaram na parte mais alta dos túmulos dos filhos de Davi[a]. Todo o Judá e os habitantes de Jerusalém lhe prestaram honra por ocasião de sua morte. E seu filho Manassés reinou em seu lugar.
  to: Ezequias descansou com seus pais, e o sepultaram na parte elevada dos túmulos dos filhos de Davi[a]. Todo o Judá e os habitantes de Jerusalém lhe prestaram honra por ocasião de sua morte. E seu filho Manassés reinou em seu lugar.
  rationale: A revisão limita-se a substituir “parte mais alta” por “parte elevada”, evitando acrescentar um grau superlativo ausente do hebraico e mantendo aberta a nuance topográfica de בְּמַעֲלֵה. O restante do texto e a nota estão fiéis, naturais e adequadamente ancorados.
