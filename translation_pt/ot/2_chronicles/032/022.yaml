  text: וַ/יּוֹשַׁע֩ יְהוָ֨ה אֶת יְחִזְקִיָּ֜הוּ וְ/אֵ֣ת יֹשְׁבֵ֣י יְרוּשָׁלִַ֗ם מִ/יַּ֛ד סַנְחֵרִ֥יב מֶֽלֶךְ אַשּׁ֖וּר וּ/מִ/יַּד כֹּ֑ל וַֽ/יְנַהֲלֵ֖/ם מִ/סָּבִֽיב־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/022.yaml
  text: So Yahweh saved Hezekiah and the inhabitants of Jerusalem from the hand of Sennacherib king of Assyria and from the hand of all others[b][a], and he guided them on every side.
translation:
  language: pt
  text: Assim, Yahweh salvou Ezequias e os habitantes de Jerusalém da mão de Senaqueribe, rei da Assíria, e da mão de todos os demais[a]; e os guiou por todos os lados[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e da mão de todos”. O hebraico não declara quem ou o que está incluído em “todos”; pelo contexto, provavelmente se refere aos demais inimigos ou poderes hostis.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e os conduziu ao redor”. Alguns entendem a expressão em sentido mais amplo: “e lhes deu segurança por todos os lados”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיּוֹשַׁע
  choice: salvou
  rationale: O verbo ישׁע expressa resgate ou libertação. “Salvou” é natural em português, conserva o peso teológico da ação divina e não restringe o sentido a uma vitória militar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: os habitantes de Jerusalém
  rationale: Reproduz com clareza e dignidade a construção participial que designa os que moravam em Jerusalém.
- source_word: מִיַּד
  choice: da mão de
  rationale: Mantém a imagem hebraica da mão como poder ou domínio; a expressão continua compreensível em português.
- source_word: סַנְחֵרִיב מֶלֶךְ אַשּׁוּר
  choice: Senaqueribe, rei da Assíria
  rationale: Emprega a forma portuguesa consagrada do nome e conserva o título em aposição.
- source_word: וּמִיַּד כֹּל
  choice: e da mão de todos os demais
  rationale: כֹּל não traz objeto expresso. “Todos os demais” comunica a elipse contextual sem acrescentar especificamente “inimigos” ou “poderes” ao texto principal.
- source_word: וַיְנַהֲלֵם
  choice: e os guiou
  rationale: O verbo נהל significa fundamentalmente conduzir ou guiar. A opção mantém esse valor lexical, sem transformar no texto principal a possível ideia contextual de segurança ou descanso.
- source_word: מִסָּבִיב
  choice: por todos os lados
  rationale: Expressa a extensão circundante do advérbio hebraico em linguagem portuguesa clara e atual.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em forma transliterada, sem substituí-lo pelo título “SENHOR”.
- issue: Sentido de וַיְנַהֲלֵם מִסָּבִיב
  choice: e os guiou por todos os lados
  alternative: e lhes deu descanso por todos os lados
  rationale: A tradução principal conserva o sentido lexical mais direto de נהל, “guiar/conduzir”. A nota registra a interpretação contextual de proteção ou segurança sem resolver silenciosamente a tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A imagem “da mão de” foi preservada por ser inteligível e relevante ao sentido. As duas elipses ou ambiguidades do hebraico foram mantidas no texto ou explicitadas com moderação e documentadas em notas.
