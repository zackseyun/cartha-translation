source:
  edition: WLC
  text: וְ/עָרִים֙ עָ֣שָׂה ל֔/וֹ וּ/מִקְנֵה צֹ֥אן וּ/בָקָ֖ר לָ/רֹ֑ב כִּ֤י נָֽתַן ל/וֹ֙ אֱלֹהִ֔ים רְכ֖וּשׁ רַ֥ב מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/029.yaml
  text: He also made cities for himself[a], and acquired flocks and herds in abundance, for God had given him very great wealth.
translation:
  language: pt
  text: Também construiu cidades para si e teve rebanhos e gado em abundância, pois Deus lhe tinha dado muitíssimos bens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «muitíssimas posses» ou «uma riqueza muito grande».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָרִים עָשָׂה לוֹ
  choice: Também construiu cidades para si
  rationale: A conjunção tem força aditiva no contexto. Embora עָשָׂה signifique de modo amplo «fazer», «construiu» é natural com «cidades»; לֹו indica benefício ou posse, aqui expresso por «para si».
- source_word: וּמִקְנֵה צֹאן וּבָקָר
  choice: e teve rebanhos e gado
  rationale: מִקְנֶה designa animais possuídos ou criação; como צֹאן e בָּקָר especificam os grupos, «teve rebanhos e gado» reproduz com naturalidade a construção nominal sem introduzir necessariamente a ideia de que os adquiriu naquele momento.
- source_word: לָרֹב
  choice: em abundância
  rationale: A expressão indica grande quantidade e modifica naturalmente os animais mencionados.
- source_word: כִּי נָתַן לוֹ אֱלֹהִים
  choice: pois Deus lhe tinha dado
  rationale: כִּי introduz a causa. O mais-que-perfeito composto exprime em português que a dádiva divina antecedia e explicava a prosperidade descrita.
- source_word: רְכוּשׁ רַב מְאֹד
  choice: muitíssimos bens
  rationale: רְכוּשׁ se refere a propriedade, posses ou bens materiais; «bens» mantém esse sentido concreto e amplo. «Muitíssimos» conserva a forte intensificação de רַב מְאֹד em português corrente.
theological_decisions:
- issue: Agência por trás da prosperidade de Ezequias
  choice: Atribuir explicitamente a Deus os muitos bens de Ezequias
  alternative: Descrever apenas a prosperidade de Ezequias sem destacar sua origem
  rationale: A oração כִּי נָתַן לוֹ אֱלֹהִים declara diretamente que Deus lhe deu os bens. A tradução mantém essa afirmação específica sem transformá-la numa doutrina geral de prosperidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Gado» foi usado como coletivo em paralelo com «rebanhos»; «bens» conserva o caráter material de רְכוּשׁ. O marcador da nota aparece no texto principal.
