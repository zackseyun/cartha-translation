revisions:
- from: Ele se fortaleceu, reconstruiu toda a muralha que estava derrubada e a elevou até as torres. Do lado de fora, construiu outra muralha, reforçou o Milo da Cidade de Davi[a] e fez grande quantidade de armas[b] e escudos.
  to: Ele se fortaleceu, reconstruiu toda a muralha que tinha brechas e a elevou até as torres. Do lado de fora, construiu outra muralha, reforçou o Milo da Cidade de Davi[a] e fez armas[b] e escudos em abundância.
  rationale: A revisão substitui uma descrição excessivamente ampla do dano à muralha por «que tinha brechas», melhora a expressão portuguesa de abundância e torna a nota histórica sobre o Milo devidamente cautelosa. Mantém-se «a elevou até as torres» para não resolver de maneira indevida a construção hebraica condensada relativa às torres.
