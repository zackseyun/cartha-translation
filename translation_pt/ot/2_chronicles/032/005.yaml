base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/005.yaml
  text: And he strengthened himself[a], and built up all the wall that was broken down, and raised it up to the towers, and outside he built another wall, and he strengthened the Millo of the city of David[b], and made weapons and shields in abundance.
translation:
  language: pt
  text: Ele se fortaleceu, reconstruiu toda a muralha que tinha brechas e a elevou até as torres. Do lado de fora, construiu outra muralha, reforçou o Milo da Cidade de Davi[a] e fez armas[b] e escudos em abundância.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o terraço” ou “o aterro”. O Milo pode ter sido um aterro fortificado ou uma estrutura de sustentação em Jerusalém.
    reason: lexical_alternative
  - marker: b
    text: Ou “projéteis”, “dardos” ou “lanças”. O termo hebraico é mais amplo do que o nome de um único tipo de armamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזַּק
  choice: Ele se fortaleceu
  rationale: Preserva a força reflexiva do hitpael de חזק e descreve a ação resoluta de Ezequias sem interpretar especificamente o verbo como mera coragem interior.
- source_word: וַיִּבֶן ... כָּל הַחוֹמָה הַפְּרוּצָה
  choice: reconstruiu toda a muralha que estava derrubada
  rationale: Expressa de modo natural a restauração da fortificação danificada; “que estava derrubada” comunica o estado resultante indicado por הַפְּרוּצָה sem recorrer a terminologia militar pouco comum.
- source_word: וַיַּעַל עַל הַמִּגְדָּלוֹת
  choice: e a elevou até as torres
  rationale: A expressão hebraica é condensada e admite mais de uma análise. A tradução retoma “a muralha” como objeto implícito e conserva a relação com as torres sem reconstruir o texto como se dissesse inequivocamente que novas torres foram erguidas sobre ela.
- source_word: וְלַחוּצָה הַחוֹמָה אַחֶרֶת
  choice: Do lado de fora, construiu outra muralha
  rationale: Torna explícito em português o verbo subentendido e apresenta לַחוּצָה naturalmente como referência ao lado exterior da fortificação.
- source_word: וַיְחַזֵּק אֶת הַמִּלּוֹא עִיר דָּוִיד
  choice: reforçou o Milo da Cidade de Davi
  rationale: “Reforçou” corresponde ao contexto defensivo de חזק. “Milo” mantém transliterado o termo técnico ou topônimo cujo referente exato é incerto.
- source_word: שֶׁלַח
  choice: armas
  rationale: O substantivo pode designar armas de arremesso ou projéteis, mas não identifica inequivocamente um tipo específico; o termo abrangente “armas” evita falsa precisão.
- source_word: לָרֹב
  choice: grande quantidade
  rationale: Comunica com clareza o sentido de abundância do idioma hebraico em português corrente.
- source_word: וּמָגִנִּים
  choice: e escudos
  rationale: “Escudos” é o equivalente moderno e geral de מָגִנִּים, sem a especificidade ou o tom arcaico de alternativas como “broquéis”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com vocabulário amplamente compreensível e boa legibilidade brasileira. A sequência de ações foi dividida em duas frases para evitar uma coordenação excessivamente longa. A formulação mantém a ambiguidade da cláusula relativa às torres e explica em notas os termos historicamente ou lexicalmente incertos.
