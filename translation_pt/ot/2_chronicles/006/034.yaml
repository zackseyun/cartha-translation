  - severity: low
    issue: A nota identifica Deus como «SENHOR»
    rationale: A nota explica corretamente que a casa é o templo de Salomão, mas o versículo em si emprega apenas sufixos de segunda pessoa, não o tetragrama. Uma formulação neutra é mais estritamente fiel.
