  text: כִּֽי יֵצֵ֨א עַמְּ/ךָ֤ לַ/מִּלְחָמָה֙ עַל א֣וֹיְבָ֔י/ו בַּ/דֶּ֖רֶךְ אֲשֶׁ֣ר תִּשְׁלָחֵ֑/ם וְ/הִתְפַּֽלְל֣וּ אֵלֶ֗י/ךָ דֶּ֣רֶךְ הָ/עִ֤יר הַ/זֹּאת֙ אֲשֶׁ֣ר בָּחַ֣רְתָּ בָּ֔/הּ וְ/הַ/בַּ֖יִת אֲשֶׁר בָּנִ֥יתִי לִ/שְׁמֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/034.yaml
  text: If your people go out to battle against their enemies by the way that you send them[a], and they pray to you toward this city that you have chosen and the house that I have built for your name[b],
translation:
  language: pt
  text: Se o teu povo sair para a batalha contra os seus inimigos pelo caminho por onde os enviares, e eles te orarem voltados para esta cidade que escolheste e para a casa que construí para o teu nome[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A “casa” é o templo que Salomão construiu para o nome de Deus.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Se
  rationale: No contexto da oração, introduz uma situação possível cuja petição continua no versículo seguinte; “se” expressa claramente a condição.
- source_word: יֵצֵא עַמְּךָ לַמִּלְחָמָה
  choice: o teu povo sair para a batalha
  rationale: Conserva o sentido concreto de יצא e traduz de modo natural a expressão militar.
- source_word: עַל אֹיְבָיו
  choice: contra os seus inimigos
  rationale: O sufixo hebraico é singular por concordar com o coletivo “povo”; o português mantém naturalmente a referência coletiva com “seus”.
- source_word: בַּדֶּרֶךְ אֲשֶׁר תִּשְׁלָחֵם
  choice: pelo caminho por onde os enviares
  rationale: Preserva a linguagem de caminho ou rota e a ideia de que Deus os envia, com formulação corrente em português.
- source_word: וְהִתְפַּלְלוּ אֵלֶיךָ
  choice: e orar a ti
  rationale: O singular “povo” rege naturalmente o infinitivo ligado a “sair”; “orar a ti” expressa a direção da oração indicada por אֶל.
- source_word: דֶּרֶךְ הָעִיר הַזֹּאת
  choice: voltado para esta cidade
  rationale: Neste contexto, דֶּרֶךְ indica orientação espacial da oração; “voltado para” torna essa direção clara e natural.
- source_word: אֲשֶׁר בָּחַרְתָּ בָּהּ
  choice: que escolheste
  rationale: Expressa diretamente a escolha divina da cidade sem acrescentar interpretação.
- source_word: וְהַבַּיִת אֲשֶׁר בָּנִיתִי
  choice: e para a casa que construí
  rationale: Mantém “casa”, a designação hebraica do templo, e explicita por paralelismo a orientação “para” exigida em português.
- source_word: לִשְׁמֶךָ
  choice: para o teu nome
  rationale: Preserva a fórmula teológica hebraica de dedicação da casa ao nome de Deus sem explicá-la além do texto.
theological_decisions:
- issue: Orientação da oração para Jerusalém e o templo
  choice: 'Mantida como orientação espacial concreta: “voltado para esta cidade ... e para a casa”.'
  alternative: Traduzir de maneira mais abstrata, como “em referência a esta cidade e ao templo”.
  rationale: O hebraico emprega linguagem direcional concreta no contexto da teologia do templo de Salomão; a tradução conserva esse cenário sem impor conclusões doutrinárias posteriores.
- issue: “Casa” como designação do templo
  choice: Conservado o termo “casa” no texto, com esclarecimento em nota.
  alternative: Substituir diretamente por “templo”.
  rationale: “Casa” reproduz o vocabulário do hebraico e sua ressonância teológica, enquanto a nota evita obscuridade para o leitor moderno.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção acompanha o período condicional que prossegue no versículo seguinte. O pronome coletivo permanece no singular (“o teu povo ... sair ... orar”), evitando oscilações desnecessárias.
