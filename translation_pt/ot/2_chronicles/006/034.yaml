  verdict: revise
  source_fidelity: 'O sentido central está bem representado: a condição, a saída para a batalha contra inimigos, o envio divino, a oração dirigida a Deus, a orientação para a cidade escolhida e a casa construída para o nome de Deus. Contudo, o hebraico passa do coletivo singular «teu povo» para verbos plurais em «os enviares» e «eles orarem». A revisão torna essa mudança explícita em português e preserva mais claramente a orientação corporal da oração.'
  naturalness: A sequência «e orar a ti voltado» é compreensível, mas soa algo rígida e associa o particípio singular diretamente ao coletivo «povo». «E eles te orarem voltados» é mais natural, deixa claro quem ora e acompanha a alternância coletiva/plural presente no hebraico.
  terminology: «Casa» deve ser mantido no texto, pois corresponde a בַּיִת; a nota pode identificar seu referente como o templo sem introduzir desnecessariamente o título divino «SENHOR», que não ocorre neste versículo. «Para o teu nome» conserva adequadamente a fórmula hebraica.
