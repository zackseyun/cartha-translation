  text: בְּ/הֵעָצֵ֧ר הַ/שָּׁמַ֛יִם וְ/לֹֽא יִהְיֶ֥ה מָטָ֖ר כִּ֣י יֶֽחֶטְאוּ לָ֑/ךְ וְ/הִֽתְפַּלְל֞וּ אֶל הַ/מָּק֤וֹם הַ/זֶּה֙ וְ/הוֹד֣וּ אֶת שְׁמֶ֔/ךָ מֵ/חַטָּאתָ֥/ם יְשׁוּב֖וּ/ן כִּ֥י תַעֲנֵֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/026.yaml
  text: When the heavens are shut up and there is no rain because they have sinned against you[a], and they pray toward this place and confess your name and turn from their sin because you answer them,
translation:
  language: pt
  text: Quando os céus se fecharem e não houver chuva, por terem pecado contra ti, e eles orarem voltados para este lugar, confessarem o teu nome e abandonarem o seu pecado porque os humilhas[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, segundo outra vocalização ou análise da sequência consonantal: “porque lhes respondes”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהֵעָצֵר הַשָּׁמַיִם
  choice: Quando os céus se fecharem
  rationale: O infinitivo nifal com בְּ introduz uma circunstância temporal. “Os céus se fecharem” conserva a imagem hebraica da chuva retida e mantém um registro bíblico natural em português.
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: e não houver chuva
  rationale: Reproduz de modo idiomático a construção existencial hebraica e concorda naturalmente com a oração temporal em português.
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: por terem pecado contra ti
  rationale: כִּי é causal, e לָךְ tem aqui o sentido ético de pecado cometido contra Deus. O infinitivo composto exprime com naturalidade a causa anterior da seca.
- source_word: וְהִתְפַּלְלוּ אֶל הַמָּקוֹם הַזֶּה
  choice: e eles orarem voltados para este lugar
  rationale: 'אֶל indica direção neste contexto: a oração é feita em direção ao templo, não dirigida ao lugar. “Voltados para” torna essa orientação inequívoca.'
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: reconhecerem o teu nome
  rationale: O hifil de ידה pode expressar reconhecimento, confissão, louvor ou gratidão. Com “teu nome” como objeto, “reconhecerem” comunica em português corrente a confissão pública de quem Deus é, sem sugerir que o próprio nome seja um pecado confessado.
- source_word: מֵחַטָּאתָם יְשׁוּבוּן
  choice: e abandonarem o seu pecado
  rationale: שׁוב com מִן descreve afastamento ou retorno para longe de algo. “Abandonarem” conserva a ideia concreta de mudança de conduta e soa mais natural do que uma reprodução rígida de “voltarem do pecado”.
- source_word: כִּי תַעֲנֵם
  choice: porque lhes respondes
  rationale: A vocalização massorética apresentada lê o verbo como forma de ענה, “responder”, adequada ao contexto de oração. A mesma sequência consonantal admite, com outra análise/vocalização, o sentido de afligir ou humilhar; essa possibilidade é registrada em nota.
theological_decisions:
- issue: Sentido de ענה na cláusula final
  choice: porque lhes respondes
  alternative: porque os afliges; porque os humilhas
  rationale: A vocalização do WLC e a sequência oração–resposta favorecem “respondes”. Como a tradição de tradução também reconhece uma leitura ligada à aflição ou humilhação que leva ao arrependimento, a alternativa é preservada em nota, sem inseri-la silenciosamente no texto.
translation_notes:
  register: Português moderno, claro e reverente, com tratamento de segunda pessoa singular (“ti”, “teu”) dirigido a Deus. A sintaxe mantém a estrutura condicional da oração de Salomão e termina com vírgula porque o período prossegue no versículo seguinte.
