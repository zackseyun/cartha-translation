  rationale: 'A revisão segue prioritariamente a vocalização do WLC: “porque os humilhas” traduz o piel de ענה II em תַעֲנֵם. A leitura alternativa “porque lhes respondes” é preservada em nota, sem atribuí-la indevidamente ao texto massorético. “Confessarem o teu nome” melhora a correspondência com וְהוֹדוּ אֶת־שְׁמֶךָ e o uso bíblico português. A vírgula final é mantida, pois o período prossegue no versículo seguinte.'
