    rationale: No encadeamento de oração, reconhecimento do nome e conversão, “confessarem o teu nome” reproduz melhor a expressão tradicional e o alcance de reconhecimento público/louvor de ידה em hifil.
  revised_text: Quando os céus se fecharem e não houver chuva, por terem pecado contra ti, e eles orarem voltados para este lugar, confessarem o teu nome e abandonarem o seu pecado porque os humilhas[a],
