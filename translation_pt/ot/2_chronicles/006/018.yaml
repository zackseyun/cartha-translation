language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֚י הַֽ/אֻמְנָ֔ם יֵשֵׁ֧ב אֱלֹהִ֛ים אֶת הָ/אָדָ֖ם עַל הָ/אָ֑רֶץ הִ֠נֵּה שָׁמַ֜יִם וּ/שְׁמֵ֤י הַ/שָּׁמַ֨יִם֙ לֹ֣א יְכַלְכְּל֔וּ/ךָ אַ֕ף כִּֽי הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/018.yaml
  text: But will God indeed dwell with man on the earth? Behold[a], heaven and the highest heaven cannot contain you, much less this house that I have built.
translation:
  language: pt
  text: Mas será que Deus realmente habitará com a humanidade[a] sobre a terra? Eis que nem os céus, nem os mais altos céus podem conter-te; muito menos esta casa que construí!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com os seres humanos”; o hebraico usa אָדָם em sentido coletivo para a humanidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֻמְנָם
  choice: realmente
  rationale: Introduz uma pergunta retórica marcada por admiração; “realmente” é natural em português e mantém a força do hebraico.
- source_word: יֵשֵׁב
  choice: habitará
  rationale: No contexto da presença divina e do templo, comunica residência ou presença, e não o ato físico de sentar-se.
- source_word: אֶת הָאָדָם
  choice: com a humanidade
  rationale: אָדָם tem aqui sentido coletivo e representativo, abrangendo os seres humanos; “humanidade” torna esse alcance claro em português atual.
- source_word: עַל הָאָרֶץ
  choice: sobre a terra
  rationale: Tradução locativa direta e digna da expressão hebraica.
- source_word: הִנֵּה
  choice: Eis que
  rationale: Preserva a função de chamar solenemente a atenção, adequada ao registro da oração.
- source_word: שָׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  choice: os céus, nem os mais altos céus
  rationale: Expressa de modo claro a intensificação superlativa “céus dos céus”, mantendo a amplitude cosmológica.
- source_word: לֹא יְכַלְכְּלוּךָ
  choice: não podem conter-te
  rationale: O verbo indica capacidade de conter ou comportar; a escolha preserva a afirmação da transcendência divina.
- source_word: אַף כִּי
  choice: muito menos
  rationale: 'Reproduz naturalmente o argumento a fortiori: se nem os céus contêm Deus, esta casa menos ainda.'
- source_word: הַבַּיִת הַזֶּה
  choice: esta casa
  rationale: Mantém o termo hebraico “casa” e seu vínculo temático com o templo, sem explicitação interpretativa desnecessária.
- source_word: אֲשֶׁר בָּנִיתִי
  choice: que construí
  rationale: Forma idiomática em português para a ação concluída de Salomão, cuja obra está presente diante dele.
theological_decisions:
- issue: Sentido coletivo de אָדָם
  choice: humanidade
  alternative: homem; seres humanos
  rationale: O contraste é entre Deus e a humanidade em sentido coletivo. “Humanidade” preserva esse sentido inclusivo sem sugerir que Salomão esteja falando de apenas um indivíduo.
- issue: Transcendência divina e linguagem espacial
  choice: não podem conter-te
  alternative: não são capazes de comportar-te
  rationale: Mantém a metáfora espacial do texto sem implicar que a presença de Deus possa ser limitada ao templo.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com leitura natural no Brasil. Conserva “Eis que” e a ênclise em “conter-te” para sustentar o tom elevado da oração, sem recorrer a vocabulário arcaico.
