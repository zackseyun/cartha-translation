base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/023.yaml
  text: then hear from heaven and act[a], and judge your servants, repaying the wicked by bringing his way upon his own head[b], and vindicating the righteous by giving to him according to his righteousness.
translation:
  language: pt
  text: 'Então, ouve dos céus, age e julga os teus servos: retribui ao perverso, fazendo recair sobre a sua própria cabeça o seu proceder[a], e declara justo o justo[b], dando-lhe conforme a sua retidão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “dando o seu caminho sobre a sua cabeça”; expressão hebraica que indica fazer a conduta de alguém recair sobre ele em julgamento.
    reason: cultural_note
  - marker: b
    text: Ou “faz justiça ao justo”. O verbo hebraico é um termo forense que significa declarar ou tratar alguém como estando com a razão.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע מִן הַשָּׁמַיִם
  choice: ouve dos céus
  rationale: Em linguagem de oração, שׁמע envolve ouvir com atenção e responder. “Ouve dos céus” preserva a expressão hebraica em português claro e solene.
- source_word: וְעָשִׂיתָ
  choice: e age
  rationale: O verbo é amplo, “fazer”, mas neste pedido judicial indica uma intervenção efetiva de Deus; “age” comunica isso de modo natural sem especificar indevidamente a ação.
- source_word: וְשָׁפַטְתָּ אֶת עֲבָדֶיךָ
  choice: Julga os teus servos
  rationale: O contexto é forense, como mostram as ações correspondentes de retribuir ao perverso e declarar justo o justo.
- source_word: לְהָשִׁיב לְרָשָׁע
  choice: retribui ao perverso
  rationale: A construção expressa retribuição judicial, isto é, fazer que a conduta do culpado recaia sobre ele.
- source_word: לָתֵת דַּרְכּוֹ בְּרֹאשׁוֹ
  choice: fazendo recair sobre a sua própria cabeça o seu proceder
  rationale: “Caminho” designa aqui a conduta. A formulação conserva a imagem hebraica das consequências que recaem sobre a cabeça do responsável, esclarecendo seu sentido em português.
- source_word: וּלְהַצְדִּיק צַדִּיק
  choice: e declara justo o justo
  rationale: No contexto de tribunal, o Hifil de צדק significa declarar ou tratar alguém como estando com a razão. A tradução mantém explicitamente esse sentido forense.
- source_word: לָתֶת לוֹ כְּצִדְקָתוֹ
  choice: dando-lhe conforme a sua justiça
  rationale: A redação conserva a ideia de uma resposta correspondente à justiça ou retidão da pessoa sem acrescentar o conceito interpretativo de recompensa.
theological_decisions:
- issue: Sentido forense do julgamento divino
  choice: Deus julga, retribui ao perverso e declara justo o justo.
  alternative: Entender שׁפט apenas como governar ou intervir, sem destaque judicial.
  rationale: O paralelismo entre o perverso e o justo, junto com שׁפט e הצדיק, estabelece uma cena judicial. A tradução preserva esse quadro sem importar categorias doutrinárias posteriores.
- issue: Sentido de וּלְהַצְדִּיק צַדִּיק
  choice: declara justo o justo
  alternative: faz justiça ao justo; absolve o justo
  rationale: “Declara justo” reproduz com transparência o valor forense da expressão. “Absolve” poderia restringir o sentido à ausência de culpa, e “faz justiça” seria mais idiomático, porém menos explícito quanto ao veredito.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas de segunda pessoa coerentes com o discurso direto dirigido a Deus. A pontuação explicita a relação entre o ato de julgar e os dois resultados paralelos. Mantém-se a imagem hebraica da conduta recaindo sobre a cabeça, acompanhada de nota explicativa.
