  terminology: «Casa», «nome», «oração» e «servo» preservam os termos e as imagens fundamentais do hebraico. A nota sobre «pôr o teu nome» esclarece o idiomatismo sem substituir ou resolver indevidamente sua densidade teológica. A nota sobre os olhos abertos identifica corretamente a leitura alternativa interpretativa.
