  source_fidelity: A tradução reproduz com precisão a estrutura peticional de לִהְיוֹת, a imagem antropomórfica de «os teus olhos estejam abertos», as duas orientações espaciais, o merismo «dia e noite», o idiomatismo cultual «pôr o teu nome» e a finalidade «a fim de ouvires». «A oração que o teu servo fizer» é uma forma portuguesa natural e fiel para a oração que o servo vier a fazer; «voltado para este lugar» explicita adequadamente a direção indicada pelo hebraico.
