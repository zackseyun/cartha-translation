base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/020.yaml
  text: that your eyes may be open toward this house day and night[a], toward the place where you said you would put your name[b], to hear the prayer that your servant prays toward this place.
translation:
  language: pt
  text: Que os teus olhos estejam abertos para esta casa dia e noite[a], para o lugar onde disseste que porias o teu nome[b], a fim de ouvires a oração que o teu servo fizer voltado para este lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estejam atentos a esta casa”. Em hebraico, literalmente, “os teus olhos estejam abertos”, expressão que indica atenção vigilante.'
    reason: lexical_alternative
  - marker: b
    text: “Pôr o teu nome” é uma expressão ligada ao templo que indica a associação escolhida por Deus com esse lugar, não que Deus estivesse literalmente contido ali.
    reason: cultural_note
lexical_decisions:
- source_word: לִהְיוֹת עֵינֶיךָ פְתֻחוֹת
  choice: Que os teus olhos estejam abertos
  rationale: A construção infinitiva, no contexto da oração de Salomão, tem força de pedido. A tradução preserva literalmente a imagem antropomórfica hebraica, em português natural.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: para esta casa
  rationale: אֶל indica direção; “para esta casa” comunica a orientação do olhar divino sem acrescentar uma ideia de localização física de Deus.
- source_word: יוֹמָם וָלַיְלָה
  choice: dia e noite
  rationale: Mantém o merismo hebraico que expressa atenção contínua.
- source_word: אֲשֶׁר אָמַרְתָּ לָשׂוּם שִׁמְךָ שָׁם
  choice: onde disseste que porias o teu nome
  rationale: Conserva a expressão teológica do templo e traduz o infinitivo no âmbito da declaração divina anterior com futuro do pretérito natural em português.
- source_word: לִשְׁמֹעַ
  choice: a fim de ouvires
  rationale: Explicita com naturalidade o valor de finalidade do infinitivo, preservando o idioma bíblico de Deus ouvir a oração.
- source_word: אֲשֶׁר יִתְפַּלֵּל עַבְדְּךָ
  choice: que o teu servo fizer
  rationale: Em português, “fizer” evita a repetição pouco elegante de “oração que... orar” e traduz naturalmente a ação verbal em uma oração relativa de sentido prospectivo ou recorrente.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: voltado para este lugar
  rationale: O acréscimo contextual “voltado” torna clara a orientação espacial de אֶל aplicada ao ato de orar, sem alterar seu sentido.
theological_decisions:
- issue: Linguagem antropomórfica sobre Deus
  choice: Preservar “os teus olhos estejam abertos”
  alternative: “estejas atento” ou “olhes com atenção”
  rationale: A imagem corporal concreta faz parte da retórica hebraica e comunica vigilante atenção divina; uma paráfrase no texto apagaria essa textura.
- issue: Teologia do templo na expressão “pôr o nome”
  choice: Manter “porias o teu nome”
  alternative: “farias habitar a tua presença” ou “estabelecerias ali a tua reputação”
  rationale: A expressão hebraica associa Deus ao lugar escolhido sem afirmar que ele esteja fisicamente contido no templo. Mantê-la preserva sua densidade e ambiguidade teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “tu” em continuidade com o discurso direto a Deus e mantém os principais idiomas hebraicos, esclarecendo-os apenas em notas.
