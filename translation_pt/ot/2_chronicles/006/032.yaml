source:
  edition: WLC
  text: וְ/גַ֣ם אֶל הַ/נָּכְרִ֗י אֲ֠שֶׁר לֹ֥א מֵ/עַמְּ/ךָ֣ יִשְׂרָאֵל֮ הוּא֒ וּ/בָ֣א מֵ/אֶ֣רֶץ רְחוֹקָ֗ה לְמַ֨עַן שִׁמְ/ךָ֤ הַ/גָּדוֹל֙ וְ/יָדְ/ךָ֣ הַ/חֲזָקָ֔ה וּֽ/זְרֽוֹעֲ/ךָ֖ הַ/נְּטוּיָ֑ה וּ/בָ֥אוּ וְ/הִֽתְפַּלְל֖וּ אֶל הַ/בַּ֥יִת הַ/זֶּֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/032.yaml
  text: And also concerning the foreigner[a], who is not from your people Israel, but comes from a distant land because of your great name and your mighty hand and your outstretched arm, when they come and pray toward this house[b],
translation:
  language: pt
  text: 'E também quanto ao estrangeiro, que não pertence ao teu povo Israel, mas vem de uma terra distante por causa do teu grande nome, da tua mão poderosa e do teu braço estendido: quando vierem[a] e orarem em direção a esta casa[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico passa do singular (“o estrangeiro ... vem”) para o plural (“vierem e orarem”), apresentando o estrangeiro como um caso representativo.
    reason: alternative_reading
  - marker: b
    text: 'Ou “a esta casa”. Neste contexto de oração, a preposição hebraica tem sentido direcional: “em direção a esta casa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּכְרִי
  choice: o estrangeiro
  rationale: Designa alguém de outro povo, não pertencente a Israel. “Estrangeiro” preserva essa distinção étnica e comunitária sem sugerir apenas uma pessoa desconhecida.
- source_word: אֲשֶׁר לֹא מֵעַמְּךָ יִשְׂרָאֵל הוּא
  choice: que não pertence ao teu povo Israel
  rationale: Expressa de modo natural em português a exclusão do estrangeiro da comunidade de Israel, identificada como povo de Deus.
- source_word: וּבָא מֵאֶרֶץ רְחוֹקָה
  choice: mas vem de uma terra distante
  rationale: O waw é entendido de modo adversativo após a oração negativa. “Terra distante” é atual e corresponde diretamente ao hebraico.
- source_word: לְמַעַן שִׁמְךָ הַגָּדוֹל
  choice: por causa do teu grande nome
  rationale: Aqui לְמַעַן indica a razão que leva o estrangeiro a vir. “Grande nome” conserva o idioma bíblico relativo à fama, identidade e reputação de Deus.
- source_word: וְיָדְךָ הַחֲזָקָה
  choice: da tua mão poderosa
  rationale: Mantém a imagem concreta da ação poderosa de Deus e forma, em português, uma combinação natural com “braço estendido”.
- source_word: וּזְרֹעֲךָ הַנְּטוּיָה
  choice: do teu braço estendido
  rationale: Preserva a metáfora antropomórfica tradicional que descreve o poder divino em ação.
- source_word: וּבָאוּ וְהִתְפַּלְלוּ
  choice: quando vierem e orarem
  rationale: A construção temporal se ajusta à continuação do pedido no versículo seguinte. As formas plurais do hebraico são mantidas em português, apesar do antecedente singular.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: em direção a esta casa
  rationale: No contexto da oração de Salomão, אֶל indica a direção da oração. “Casa” conserva o termo hebraico e sua ressonância como casa de Deus.
theological_decisions:
- issue: Mudança do singular para o plural
  choice: Manter “o estrangeiro ... vem” e depois “vierem ... orarem”
  alternative: Uniformizar como “quando ele vier e orar” ou “quando estrangeiros vierem e orarem”
  rationale: O hebraico passa deliberadamente do estrangeiro representativo no singular para verbos no plural. A tradução mantém essa mudança e a esclarece em nota, sem eliminar a tensão gramatical do texto.
- issue: Linguagem antropomórfica acerca do poder de Deus
  choice: Preservar “tua mão poderosa” e “teu braço estendido”
  alternative: Parafrasear como “teu grande poder”
  rationale: As imagens concretas pertencem à linguagem bíblica da ação divina, especialmente à tradição do êxodo, e não devem ser reduzidas a uma abstração.
translation_notes:
  register: Português moderno, claro e digno, com formas de segunda pessoa do singular coerentes com a oração dirigida a Deus. A pontuação final mantém a frase aberta, pois o pedido prossegue no versículo seguinte.
