  text: וְֽ/אִם יִנָּגֵ֞ף עַמְּ/ךָ֧ יִשְׂרָאֵ֛ל לִ/פְנֵ֥י אוֹיֵ֖ב כִּ֣י יֶֽחֶטְאוּ לָ֑/ךְ וְ/שָׁ֨בוּ֙ וְ/הוֹד֣וּ אֶת שְׁמֶ֔/ךָ וְ/הִתְפַּֽלְל֧וּ וְ/הִֽתְחַנְּנ֛וּ לְ/פָנֶ֖י/ךָ בַּ/בַּ֥יִת הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/024.yaml
  text: If your people Israel are struck down before an enemy because they have sinned against you[a], and they turn back and confess your name, and pray and plead for favor before you in this house[c][b],
translation:
  language: pt
  text: Se o teu povo Israel sofrer uma derrota diante de um inimigo por haver pecado contra ti, e voltar[a], confessar o teu nome[b], orar e suplicar[c] diante de ti nesta casa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “retornar”; neste contexto de aliança, o verbo também pode transmitir a ideia de “arrepender-se”.
    reason: lexical_alternative
  - marker: b
    text: Ou “louvar o teu nome” ou “dar graças ao teu nome”.
    reason: lexical_alternative
  - marker: c
    text: Isto é, pedir com insistência o teu favor ou a tua misericórdia.
    reason: lexical_clarification
lexical_decisions:
- source_word: יִנָּגֵף
  choice: sofrer uma derrota
  rationale: O nifal de נגף, no contexto militar e diante de um inimigo, indica ser vencido ou derrotado. A formulação preserva o sentido passivo/resultativo em português natural.
- source_word: לִפְנֵי אוֹיֵב
  choice: diante de um inimigo
  rationale: Mantém de perto o idioma hebraico e conserva o caráter indefinido do substantivo singular.
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: por haver pecado contra ti
  rationale: 'כִּי apresenta a causa da derrota, e לָךְ é naturalmente expresso como direção da ofensa: “contra ti”.'
- source_word: וְשָׁבוּ
  choice: mas voltar
  rationale: שׁוב denota voltar ou retornar e, neste contexto de aliança, também sugere arrependimento. “Voltar” mantém a imagem verbal sem transformá-la num termo teológico mais específico. “Mas” explicita em português o contraste contextual entre o pecado e o retorno, sem alterar a relação lógica.
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: reconhecer o teu nome
  rationale: O hifil de ידה pode expressar reconhecimento, confissão, louvor ou gratidão. “Reconhecer o teu nome” é adequado ao contexto de retorno e oração e preserva melhor essa amplitude do que uma opção exclusivamente laudatória.
- source_word: וְהִתְפַּלְלוּ
  choice: orar
  rationale: Equivalente corrente e direto do hitpael de פלל; a orientação da oração já aparece em “diante de ti”.
- source_word: וְהִתְחַנְּנוּ
  choice: suplicar
  rationale: O hitpael de חנן descreve um apelo insistente por favor ou misericórdia. “Suplicar” é atual, digno e conciso.
- source_word: לְפָנֶיךָ
  choice: diante de ti
  rationale: Preserva o idioma de comparecer à presença de Deus em oração.
- source_word: בַּבַּיִת הַזֶּה
  choice: nesta casa
  rationale: Traduz literalmente בית e conserva a linguagem da oração de dedicação, sem substituir “casa” pela interpretação contextual “templo”.
theological_decisions:
- issue: Nuance de arrependimento em וְשָׁבוּ
  choice: voltar
  alternative: arrepender-se
  rationale: O retorno da aliança inclui conceitualmente o arrependimento, mas o verbo hebraico é mais amplo. “Voltar” conserva a imagem e a tensão teológica sem restringir o sentido.
- issue: Amplitude de וְהוֹדוּ אֶת שְׁמֶךָ
  choice: reconhecer o teu nome
  alternative: louvar o teu nome; confessar o teu nome; dar graças ao teu nome
  rationale: No contexto, o ato pode combinar confissão pública e louvor. A tradução principal evita decidir exclusivamente por uma dessas dimensões, e a nota registra as alternativas legítimas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção no singular acompanha “o teu povo” como substantivo coletivo. “Sofrer uma derrota” comunica o cenário militar sem arcaísmo; “nesta casa” preserva a designação hebraica do templo. A vírgula final foi mantida porque o versículo continua sintaticamente no versículo seguinte.
