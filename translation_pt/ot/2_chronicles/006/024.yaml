revisions:
- from: Se o teu povo Israel sofrer uma derrota diante de um inimigo por haver pecado contra ti, mas voltar[a], reconhecer o teu nome[b], orar e suplicar[c] diante de ti nesta casa,
  to: Se o teu povo Israel sofrer uma derrota diante de um inimigo por haver pecado contra ti, e voltar[a], confessar o teu nome[b], orar e suplicar[c] diante de ti nesta casa,
  rationale: A revisão remove a adversativa não expressa no hebraico e substitui «reconhecer o teu nome» por «confessar o teu nome», opção mais clara e contextualizada para o ato de reconhecimento público em uma oração de restauração. Mantêm-se a estrutura condicional, o singular coletivo de «o teu povo», a designação literal «nesta casa» e a vírgula final, pois a construção prossegue no versículo seguinte.
