language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/שָׁ֨מַעְתָּ֜ אֶל תַּחֲנוּנֵ֤י עַבְדְּ/ךָ֙ וְ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יִֽתְפַּֽלְל֖וּ אֶל הַ/מָּק֣וֹם הַ/זֶּ֑ה וְ֠/אַתָּה תִּשְׁמַ֞ע מִ/מְּק֤וֹם שִׁבְתְּ/ךָ֙ מִן הַ/שָּׁמַ֔יִם וְ/שָׁמַעְתָּ֖ וְ/סָלָֽחְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/021.yaml
  text: And hear the pleas of your servant and of your people Israel when they pray toward this place. And may you hear from your dwelling place[a], from heaven, and when you hear, forgive.
translation:
  language: pt
  text: Ouve as súplicas do teu servo e do teu povo Israel, quando orarem voltados para este lugar. Ouve do lugar da tua habitação, dos céus; ouve e perdoa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמַעְתָּ / תִּשְׁמַע / וְשָׁמַעְתָּ
  choice: ouve / ouve / ouve
  rationale: A repetição de שׁמע estrutura o versículo. O imperativo português expressa naturalmente a força peticionária das formas hebraicas no contexto da oração e preserva a repetição.
- source_word: תַּחֲנוּנֵי
  choice: súplicas
  rationale: O substantivo indica pedidos fervorosos por favor ou misericórdia. “Súplicas” é corrente, digno e adequado ao registro de oração.
- source_word: עַבְדְּךָ
  choice: teu servo
  rationale: No contexto da oração régia de Salomão a Deus, “servo” preserva o sentido relacional e honorífico, sem impor o sentido social mais específico de “escravo”.
- source_word: וְעַמְּךָ יִשְׂרָאֵל
  choice: e do teu povo Israel
  rationale: A repetição de “do” deixa claro que as súplicas pertencem tanto ao servo quanto ao povo Israel.
- source_word: יִתְפַּלְלוּ אֶל הַמָּקוֹם הַזֶּה
  choice: quando orarem voltados para este lugar
  rationale: “Orar voltados para” comunica com naturalidade a orientação espacial de אֶל em referência ao templo.
- source_word: מִמְּקוֹם שִׁבְתְּךָ
  choice: do lugar da tua habitação
  rationale: A expressão acompanha de perto o hebraico, mantendo a referência reverente à morada divina.
- source_word: מִן הַשָּׁמַיִם
  choice: dos céus
  rationale: O plural preserva a forma hebraica e é idiomático no registro bíblico português, além de identificar os céus como a habitação divina.
- source_word: סָלָחְתָּ
  choice: perdoa
  rationale: “Perdoar” é o equivalente mais claro e teologicamente transparente para o verbo, que se refere ao perdão da culpa ou do pecado.
theological_decisions:
- issue: Transcendência divina e teologia do templo
  choice: O povo ora voltado para o templo, mas Deus ouve dos céus, o lugar da sua habitação.
  alternative: Localizar mais fortemente a presença de Deus no templo ou tratar a referência ao templo como puramente simbólica.
  rationale: 'O hebraico mantém juntos os dois elementos: a oração é orientada para “este lugar”, enquanto a habitação de onde Deus ouve fica nos céus. A tradução preserva essa tensão.'
translation_notes:
  register: Português moderno, reverente e amplamente compreensível, com formas de segunda pessoa singular coerentes com a oração dirigida a Deus. A repetição de “ouve” conserva a cadência e a estrutura retórica do hebraico.
