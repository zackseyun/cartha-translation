  text: וְ֠/אַתָּה תִּשְׁמַ֨ע מִן הַ/שָּׁמַ֜יִם מְכ֤וֹן שִׁבְתֶּ֨/ךָ֙ וְ/סָ֣לַחְתָּ֔ וְ/נָתַתָּ֤ה לָ/אִישׁ֙ כְּ/כָל דְּרָכָ֔י/ו אֲשֶׁ֥ר תֵּדַ֖ע אֶת לְבָב֑/וֹ כִּ֤י אַתָּה֙ לְ/בַדְּ/ךָ֣ יָדַ֔עְתָּ אֶת לְבַ֖ב בְּנֵ֥י הָ/אָדָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/030.yaml
  text: then may you hear from heaven[a], the place of your dwelling, and forgive, and give to each man according to all his ways, whose heart you know—for you alone know the heart of the sons of man—
translation:
  language: pt
  text: então, ouve dos céus, do lugar da tua habitação, perdoa e dá a cada um conforme todos os seus caminhos — tu conheces o coração de cada um —, pois só tu conheces o coração dos seres humanos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “os filhos do homem”. A expressão hebraica refere-se aos seres humanos em geral.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: ouve
  rationale: No contexto da oração de Salomão, o imperfeito tem força volitiva ou de súplica. O imperativo português «ouve» expressa naturalmente a petição dirigida a Deus.
- source_word: מִן הַשָּׁמַיִם
  choice: dos céus
  rationale: Conserva o plural formal do hebraico e é uma expressão natural em português bíblico contemporâneo.
- source_word: מְכוֹן שִׁבְתֶּךָ
  choice: lugar da tua habitação
  rationale: מָכוֹן indica um lugar estabelecido; a formulação mantém esse sentido sem tornar a frase pesada.
- source_word: וְסָלַחְתָּ
  choice: perdoa
  rationale: Na sequência de pedidos, a forma verbal continua a força volitiva da oração.
- source_word: וְנָתַתָּה
  choice: retribui
  rationale: Embora נתן signifique literalmente «dar», neste contexto judicial designa dar a alguém em conformidade com sua conduta; «retribui» comunica esse valor contextual.
- source_word: לָאִישׁ
  choice: a cada um
  rationale: O singular אִישׁ tem sentido distributivo. «A cada um» preserva essa distribuição e é natural em português.
- source_word: כְּכָל דְּרָכָיו
  choice: segundo todos os seus caminhos
  rationale: Mantém a metáfora hebraica dos «caminhos» como conduta ou modo de vida, inteligível no registro bíblico português.
- source_word: אֲשֶׁר תֵּדַע אֶת לְבָבוֹ
  choice: pois conheces o seu coração
  rationale: A relação pode ser entendida de modo explicativo ou causal. «Pois» produz uma frase portuguesa clara sem alterar a afirmação de que Deus conhece o interior de cada pessoa.
- source_word: לְבָב
  choice: coração
  rationale: Preserva o equivalente bíblico tradicional para o centro interior do pensamento, da vontade e das disposições.
- source_word: כִּי אַתָּה לְבַדְּךָ יָדַעְתָּ
  choice: porque somente tu conheces
  rationale: Expressa tanto a razão apresentada pela oração quanto a exclusividade enfática de לְבַדְּךָ.
- source_word: בְּנֵי הָאָדָם
  choice: os seres humanos
  rationale: A expressão hebraica literalmente «filhos do homem/da humanidade» funciona aqui como designação coletiva de todos os humanos. «Seres humanos» comunica diretamente essa referência abrangente; a nota preserva a forma literal.
theological_decisions:
- issue: Expressão antropológica בְּנֵי הָאָדָם
  choice: os seres humanos
  alternative: os filhos do homem / os filhos da humanidade
  rationale: O contexto afirma que só Deus conhece o coração de toda a humanidade, sem restringir a declaração aos homens do sexo masculino. A tradução comunica o referente coletivo, enquanto a nota registra a forma representativa masculina do hebraico.
- issue: Retribuição segundo os caminhos
  choice: retribui a cada um segundo todos os seus caminhos
  alternative: dá a cada um segundo todos os seus caminhos
  rationale: «Retribui» explicita o valor judicial contextual de נתן, sem definir se a retribuição será favorável ou desfavorável; essa tensão permanece determinada pelos «caminhos» de cada pessoa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa singular coerentes com a oração dirigida a Deus. A metáfora «caminhos» foi mantida; a expressão antropológica final foi vertida pelo seu sentido coletivo e acompanhada de nota literal.
