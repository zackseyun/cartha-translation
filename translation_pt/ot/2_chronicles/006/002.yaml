  yaml_path: translation/ot/2_chronicles/006/002.yaml
  text: But I have built for you a lofty house, a place for you to dwell forever.
translation:
  language: pt
  text: Mas eu construí para ti uma casa majestosa, um lugar para habitares para sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵית זְבֻל
  choice: uma casa majestosa
  rationale: זְבֻל pode designar uma morada elevada ou imponente. “Casa majestosa” comunica a dignidade do templo em português natural, sem acrescentar a ideia específica de exaltação cultual.
- source_word: מָכוֹן
  choice: um lugar
  rationale: Neste contexto, o termo indica um local estabelecido ou preparado; “lugar” preserva o paralelismo e evita uma formulação artificial.
- source_word: לְשִׁבְתְּךָ
  choice: para habitares
  rationale: O infinitivo expressa a finalidade do lugar como morada de Deus; a forma pessoal deixa claro que o referente é “ti”.
- source_word: עוֹלָמִים
  choice: para sempre
  rationale: A expressão idiomática indica duração perpétua ou indefinida; “para sempre” é a equivalência corrente e digna.
theological_decisions:
- issue: Deus habitar no templo
  choice: um lugar para habitares
  alternative: um lugar da tua habitação
  rationale: Mantém a afirmação direta e a tensão contextual entre a presença divina no templo e a transcendência de Deus, sem explicá-la nem atenuá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento em segunda pessoa singular coerente na frase. A ordem e o paralelismo do hebraico foram preservados sem sacrificar a naturalidade.
