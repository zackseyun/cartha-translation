  text: וְ/שָׁ֣בוּ אֵלֶ֗י/ךָ בְּ/כָל לִבָּ/ם֙ וּ/בְ/כָל נַפְשָׁ֔/ם בְּ/אֶ֥רֶץ שִׁבְיָ֖/ם אֲשֶׁר שָׁב֣וּ אֹתָ֑/ם וְ/הִֽתְפַּֽלְל֗וּ דֶּ֤רֶךְ אַרְצָ/ם֙ אֲשֶׁ֣ר נָתַ֣תָּה לַ/אֲבוֹתָ֔/ם וְ/הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֔רְתָּ וְ/לַ/בַּ֖יִת אֲשֶׁר בָּנִ֥יתִי לִ/שְׁמֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/038.yaml
  text: and they return to you with all their heart and with all their soul in the land of their captivity[a], where they were taken captive, and pray toward their land that you gave to their fathers, and toward the city that you have chosen, and toward the house that I have built for your name,
translation:
  language: pt
  text: e voltarem para ti de todo o coração e de toda a alma, na terra do seu cativeiro[a], para onde foram levados cativos, e orarem em direção à terra deles, que deste aos seus antepassados, e à cidade que escolheste, e à casa que construí para o teu nome,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e retornarem para ti”; neste contexto de aliança, a expressão também pode envolver arrependimento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁבוּ אֵלֶיךָ
  choice: e voltarem para ti
  rationale: שׁוּב com אֶל significa voltar ou retornar a alguém. A formulação preserva o verbo concreto e deixa que o contexto comunique sua dimensão de arrependimento e renovação da aliança.
- source_word: בְּכָל לִבָּם וּבְכָל נַפְשָׁם
  choice: de todo o coração e de toda a alma
  rationale: Expressão idiomática de entrega interior completa. A construção tradicional continua clara e natural em português.
- source_word: בְּאֶרֶץ שִׁבְיָם
  choice: na terra do seu cativeiro
  rationale: Mantém a relação nominal do hebraico e distingue este sintagma da oração seguinte, que descreve terem sido levados cativos.
- source_word: אֲשֶׁר שָׁבוּ אֹתָם
  choice: para onde foram levados cativos
  rationale: Embora o hebraico use uma construção ativa, o agente não é expresso; a passiva portuguesa é natural. O valor direcional de אֲשֶׁר neste contexto é bem representado por 'para onde'.
- source_word: וְהִתְפַּלְלוּ דֶּרֶךְ אַרְצָם
  choice: e orarem em direção à terra deles
  rationale: דֶּרֶךְ indica orientação espacial. 'Em direção a' exprime claramente a postura de oração voltada para a terra.
- source_word: אֲשֶׁר נָתַתָּה לַאֲבוֹתָם
  choice: que deste aos seus antepassados
  rationale: '''Antepassados'' comunica o sentido de אָבוֹת de modo atual e inclusivo das gerações ancestrais, sem perder a referência da aliança.'
- source_word: וְהָעִיר אֲשֶׁר בָּחַרְתָּ
  choice: à cidade que escolheste
  rationale: O pretérito perfeito traduz diretamente a ação concluída cuja relevância permanece no contexto.
- source_word: וְלַבַּיִת אֲשֶׁר בָּנִיתִי לִשְׁמֶךָ
  choice: e à casa que construí para o teu nome
  rationale: '''Casa'' preserva o termo hebraico e sua ressonância teológica, embora o referente seja o templo. ''Para o teu nome'' mantém a fórmula de dedicação sem a explicar excessivamente.'
theological_decisions:
- issue: Dimensão de arrependimento em שׁוּב אֵלֶיךָ
  choice: voltarem para ti
  alternative: se arrependerem diante de ti; tornarem para ti
  rationale: O verbo denota fundamentalmente voltar ou retornar. Neste contexto de aliança, implica arrependimento, mas explicitá-lo no texto principal resolveria uma amplitude semântica que o hebraico preserva.
- issue: Referência do termo בַּיִת
  choice: casa
  alternative: templo
  rationale: O referente é o templo construído por Salomão, mas a tradução 'casa' conserva tanto a imagem hebraica quanto a linguagem teológica da habitação dedicada ao nome de Deus.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a estrutura condicional iniciada no contexto anterior e, por isso, emprega infinitivos pessoais ('voltarem', 'orarem'). O versículo termina com vírgula porque a oração prossegue no versículo seguinte.
