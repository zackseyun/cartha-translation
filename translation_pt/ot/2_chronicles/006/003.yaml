base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/003.yaml
  text: Then the king turned around and blessed all the assembly of Israel[b][a], while all the assembly of Israel was standing.
translation:
  language: pt
  text: Então o rei se virou e abençoou toda a assembleia de Israel[a], enquanto toda a assembleia de Israel permanecia de pé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “toda a congregação de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסֵּב אֶת־פָּנָיו
  choice: se virou
  rationale: A expressão hebraica diz literalmente que o rei fez seu rosto voltar-se. Em português, “se virou” comunica com naturalidade o movimento físico sem produzir a formulação pouco idiomática “virou o rosto” neste contexto.
- source_word: וַיְבָרֶךְ
  choice: abençoou
  rationale: ברך significa aqui abençoar a comunidade reunida; a forma simples e direta preserva a ação atribuída ao rei.
- source_word: כָּל־קְהַל יִשְׂרָאֵל
  choice: toda a assembleia de Israel
  rationale: קהל designa a comunidade convocada e reunida. “Assembleia” é atual, clara e adequada ao cenário público, sem a possível conotação denominacional de “congregação”.
- source_word: עוֹמֵד
  choice: permanecia de pé
  rationale: O particípio hebraico descreve a postura contínua da assembleia durante a bênção. “Permanecia de pé” expressa esse aspecto durativo em português natural.
- source_word: וְכָל־קְהַל יִשְׂרָאֵל עוֹמֵד
  choice: enquanto toda a assembleia de Israel permanecia de pé
  rationale: A oração apresenta a circunstância concomitante à bênção. “Enquanto” torna clara essa relação sem eliminar a repetição deliberada de “toda a assembleia de Israel”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se a repetição de “toda a assembleia de Israel”, presente no hebraico, e traduz-se o idioma corporal de forma natural.
