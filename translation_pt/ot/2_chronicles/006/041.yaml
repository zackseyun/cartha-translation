id: 2CH.6.41
reference: 2 Chronicles 6:41
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַתָּ֗ה קוּמָ֞/ה יְהוָ֤ה אֱלֹהִים֙ לְֽ/נוּחֶ֔/ךָ אַתָּ֖ה וַ/אֲר֣וֹן עֻזֶּ֑/ךָ כֹּהֲנֶ֜י/ךָ יְהוָ֤ה אֱלֹהִים֙ יִלְבְּשׁ֣וּ תְשׁוּעָ֔ה וַ/חֲסִידֶ֖י/ךָ יִשְׂמְח֥וּ בַ/טּֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/041.yaml
  text: And now arise[a], O Yahweh God, to your resting place, you and the ark of your strength. Let your priests, O Yahweh God, be clothed with salvation[c][b], and let your faithful ones rejoice in what is good.
translation:
  language: pt
  text: E agora, levanta-te, ó Yahweh Deus, para o teu lugar de descanso, tu e a arca da tua força.[a] Que os teus sacerdotes, ó Yahweh Deus, sejam revestidos de salvação,[b] e que os teus fiéis se alegrem no que é bom.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a arca do teu poder” ou “a arca do teu poderio”.
    reason: lexical_alternative
  - marker: b
    text: Ou “libertação” ou “vitória”.
    reason: lexical_alternative
  - marker: c
    text: Ou “na bondade” ou “na tua bondade”. O hebraico diz literalmente “no bem/na bondade”, sem possessivo explícito.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a ligação discursiva de וְ quanto o valor temporal de עַתָּה, introduzindo a petição culminante.
- source_word: קוּמָה
  choice: levanta-te
  rationale: Imperativo dirigido a Deus em linguagem de oração; é natural, digno e mantém a imagem do hebraico.
- source_word: יְהוָה אֱלֹהִים
  choice: ó Yahweh Deus
  rationale: Mantém o nome divino expresso pelo Tetragrama e representa com naturalidade o vocativo da oração.
- source_word: לְנוּחֶךָ
  choice: e vem para o teu lugar de descanso
  rationale: O hebraico expressa movimento em direção ao descanso ou lugar de repouso. A inclusão idiomática de 'vem' em português liga o imperativo ao destino sem mudar o sentido.
- source_word: אַתָּה וַאֲרוֹן עֻזֶּךָ
  choice: tu e a arca da tua força
  rationale: Preserva a coordenação enfática e traduz עֹז de modo formal, deixando 'poder' como alternativa lexical.
- source_word: כֹּהֲנֶיךָ
  choice: os teus sacerdotes
  rationale: Equivalência direta do substantivo plural com sufixo possessivo.
- source_word: יִלְבְּשׁוּ תְשׁוּעָה
  choice: sejam revestidos de salvação
  rationale: Conserva a metáfora da vestimenta. 'Salvação' abrange libertação, socorro e vitória sem restringir indevidamente o sentido.
- source_word: חֲסִידֶיךָ
  choice: os teus fiéis
  rationale: Comunica pessoas caracterizadas por fidelidade e lealdade piedosa, evitando conotações eclesiásticas posteriores de 'santos'.
- source_word: יִשְׂמְחוּ בַטּוֹב
  choice: se alegrem no que é bom
  rationale: Expressão portuguesa natural que conserva a ausência de possessivo explícito no hebraico e não decide entre bondade, bem e prosperidade.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o nome divino. 'Yahweh' o representa como nome próprio, sem substituí-lo por um título.
- issue: Sentido de בַטּוֹב
  choice: no que é bom
  alternative: na tua bondade
  rationale: Embora o contexto permita entender a bondade de Deus, o hebraico não contém pronome possessivo. O texto principal conserva essa abertura, e a leitura explicitamente teocêntrica fica registrada em nota.
- issue: Valor de תְשׁוּעָה
  choice: salvação
  alternative: libertação; vitória
  rationale: O termo admite esses matizes. 'Salvação' preserva sua amplitude sem determinar se o foco é espiritual, histórico ou militar.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas de segunda pessoa coerentes com o tom de oração. A ordem e as metáforas centrais do hebraico foram preservadas, enquanto 'e vem' torna natural em português a construção de movimento para o lugar de descanso.
