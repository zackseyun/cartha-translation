source:
  edition: WLC
  text: וְ/אַתָּה֙ תִּשְׁמַ֣ע מִן הַ/שָּׁמַ֔יִם וְ/סָ֣לַחְתָּ֔ לְ/חַטַּ֖את עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל וַ/הֲשֵׁיבוֹתָ/ם֙ אֶל הָ֣/אֲדָמָ֔ה אֲשֶׁר נָתַ֥תָּה לָ/הֶ֖ם וְ/לַ/אֲבֹתֵי/הֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/025.yaml
  text: then you will hear from heaven[a], and forgive the sin of your people Israel[b], and bring them back to the land that you gave to them and to their fathers.
translation:
  language: pt
  text: então ouve dos céus, perdoa o pecado do teu povo Israel e traze-os de volta à terra que deste a eles e a seus pais.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “então ouvirás dos céus, perdoarás o pecado do teu povo Israel e os trarás de volta”.'
    reason: As formas verbais hebraicas admitem, neste contexto de oração, tanto a força de pedido quanto uma leitura futura.
  - marker: b
    text: 'Ou: “seus antepassados”. O hebraico diz literalmente “seus pais”.'
    reason: Registra a alternativa lexical abrangente sem apagar a formulação do texto hebraico.
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: ouve
  rationale: 'No contexto da oração de Salomão, o imperfeito pode expressar um pedido: Deus deve ouvir atentamente, com a resposta implícita. “Ouve” é natural em português e preserva essa força sem explicitar além do hebraico.'
- source_word: מִן הַשָּׁמַיִם
  choice: dos céus
  rationale: O substantivo hebraico está no plural. “Dos céus” é idiomático em português bíblico contemporâneo e mantém a forma do original.
- source_word: סָלַחְתָּ
  choice: perdoa
  rationale: סלח é o verbo habitual para o perdão concedido por Deus; “perdoa” é claro, atual e adequado à sequência de pedidos.
- source_word: לְחַטַּאת
  choice: o pecado
  rationale: O singular hebraico designa coletivamente a transgressão de Israel. A tradução conserva o singular sem convertê-lo em culpa ou ofensa.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: teu povo Israel
  rationale: Mantém tanto a designação de aliança quanto o nome próprio em ordem natural em português.
- source_word: וַהֲשֵׁיבוֹתָם
  choice: traze-os de volta
  rationale: 'O hifil de שוב é causativo: Deus faz o povo retornar. “Traze-os de volta” preserva essa causalidade de modo natural.'
- source_word: אֶל הָאֲדָמָה
  choice: à terra
  rationale: Neste contexto nacional e pactual, אֲדָמָה se refere à terra dada a Israel, não apenas ao solo.
- source_word: אֲשֶׁר נָתַתָּה לָהֶם וְלַאֲבֹתֵיהֶם
  choice: que deste a eles e a seus pais
  rationale: Preserva os dois complementos do verbo “dar” e a continuidade entre a geração presente e seus pais.
theological_decisions:
- issue: Força verbal da sequência תִּשְׁמַע ... וְסָלַחְתָּ ... וַהֲשֵׁיבוֹתָם na oração
  choice: 'pedidos diretos: “ouve... perdoa... traze-os”'
  alternative: 'declaração futura: “ouvirás... perdoarás... os trarás de volta”'
  rationale: Dentro da súplica de Salomão, as formas verbais podem funcionar volitivamente como pedidos, embora a morfologia também permita uma leitura futura. A nota conserva essa ambiguidade.
- issue: Tradução de אֲבֹתֵיהֶם
  choice: seus pais
  alternative: seus antepassados
  rationale: O hebraico diz literalmente “pais”. A tradução principal mantém essa forma, enquanto a nota oferece o sentido coletivo possível sem restringi-lo indevidamente.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas verbais de segunda pessoa singular coerentes com a oração dirigida a Deus. “Dos céus” conserva o plural hebraico; “traze-os de volta” exprime claramente a forma causativa.
