source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ אֵין כָּמ֣וֹ/ךָ אֱלֹהִ֔ים בַּ/שָּׁמַ֖יִם וּ/בָ/אָ֑רֶץ שֹׁמֵ֤ר הַ/בְּרִית֙ וְֽ/הַ/חֶ֔סֶד לַ/עֲבָדֶ֕י/ךָ הַ/הֹלְכִ֥ים לְ/פָנֶ֖י/ךָ בְּ/כָל לִבָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/014.yaml
  text: And he said[a], “O Yahweh, God of Israel, there is no God like you in heaven or on earth, keeping the covenant and the steadfast love for your servants who walk before you with all their heart.”
translation:
  language: pt
  text: 'E disse: “Ó Yahweh, Deus de Israel, não há Deus como tu nos céus nem na terra, que guardas a aliança e o amor leal[a] para com os teus servos que andam diante de ti de todo o coração.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a fidelidade à aliança”.'
    reason: Alternativa lexical para חֶסֶד, cujo sentido aqui inclui amor constante e lealdade pactual.
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: E disse
  rationale: Preserva o fluxo narrativo do wayyiqtol hebraico sem explicitar além do texto o sujeito já indicado pelo contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Deus de Israel
  rationale: Reproduz naturalmente a construção hebraica que identifica Yahweh como o Deus de Israel.
- source_word: אֵין כָּמוֹךָ אֱלֹהִים
  choice: não há Deus como tu
  rationale: Expressa a incomparabilidade divina e mantém a construção próxima do hebraico sem introduzir uma referência explícita a outros deuses.
- source_word: בַּשָּׁמַיִם וּבָאָרֶץ
  choice: nos céus nem na terra
  rationale: Em português, a correlação negativa «não... nem» comunica de modo natural o alcance total da expressão hebraica; o plural «céus» reflete שָׁמַיִם.
- source_word: שֹׁמֵר
  choice: que guardas
  rationale: O particípio descreve uma ação característica de Deus; a oração relativa é natural em português e conserva a ideia de fidelidade contínua.
- source_word: הַבְּרִית
  choice: a aliança
  rationale: É o equivalente português corrente para o compromisso pactual indicado pelo substantivo definido.
- source_word: וְהַחֶסֶד
  choice: e o amor leal
  rationale: Comunica tanto o aspecto afetivo quanto a lealdade constante de חֶסֶד, especialmente em sua associação com a aliança.
- source_word: לַעֲבָדֶיךָ
  choice: para com os teus servos
  rationale: Indica com clareza aqueles a quem se dirigem a preservação da aliança e o amor leal.
- source_word: הַהֹלְכִים לְפָנֶיךָ
  choice: que andam diante de ti
  rationale: Mantém a metáfora hebraica de uma conduta vivida na presença de Deus.
- source_word: בְּכָל לִבָּם
  choice: de todo o coração
  rationale: Expressão portuguesa idiomática para devoção integral, preservando o sentido coletivo-distributivo do hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto apresenta diretamente o Tetragrama; «Yahweh» conserva o nome pessoal em transliteração, sem substituí-lo por um título.
- issue: Sentido de חֶסֶד no contexto da aliança
  choice: amor leal
  alternative: misericórdia; bondade; fidelidade à aliança
  rationale: A associação com בְּרִית realça lealdade relacional e pactual. «Amor leal» mantém a amplitude do termo sem reduzi-lo apenas a misericórdia ou convertê-lo integralmente em uma expressão técnica.
- issue: Incomparabilidade expressa por אֵין כָּמוֹךָ אֱלֹהִים
  choice: não há Deus como tu
  alternative: não há ninguém como tu entre os deuses
  rationale: A formulação escolhida preserva a afirmação direta da incomparabilidade de Yahweh, sem resolver a possível amplitude semântica de אֱלֹהִים mediante uma referência explícita a um conselho ou conjunto de deuses.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se a metáfora bíblica «andam diante de ti», o vocativo solene «Ó Yahweh» e a forma de tratamento «tu», adequada à oração e coerente em todo o versículo.
