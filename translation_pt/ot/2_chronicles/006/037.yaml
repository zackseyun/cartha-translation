  text: וְ/הֵשִׁ֨יבוּ֙ אֶל לְבָבָ֔/ם בָּ/אָ֖רֶץ אֲשֶׁ֣ר נִשְׁבּוּ שָׁ֑ם וְ/שָׁ֣בוּ וְ/הִֽתְחַנְּנ֣וּ אֵלֶ֗י/ךָ בְּ/אֶ֤רֶץ שִׁבְיָ/ם֙ לֵ/אמֹ֔ר חָטָ֥אנוּ הֶעֱוִ֖ינוּ וְ/רָשָֽׁעְנוּ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/037.yaml
  text: and if they come to their senses in the land where they were taken captive[a], and turn back and plead with you in the land of their captivity, saying, ‘We have sinned, we have acted perversely, and we have acted wickedly,’
translation:
  language: pt
  text: 'e, se caírem em si na terra para onde foram levados cativos[a], voltarem e suplicarem a ti na terra do seu cativeiro, dizendo: “Pecamos, agimos perversamente e procedemos com maldade”,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “fizerem voltar ao seu coração”, expressão que indica refletir profundamente ou tomar consciência.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵשִׁיבוּ אֶל־לְבָבָם
  choice: caírem em si
  rationale: Expressa de modo natural em português o reconhecimento interior indicado pelo idioma hebraico, enquanto a nota preserva sua imagem literal de fazer algo voltar ao coração.
- source_word: בָּאָרֶץ אֲשֶׁר נִשְׁבּוּ שָׁם
  choice: na terra para onde foram levados cativos
  rationale: O nifal de נשׁבה indica serem capturados ou levados ao cativeiro; a formulação é clara e adequada ao contexto do exílio.
- source_word: וְשָׁבוּ
  choice: voltarem
  rationale: Preserva a amplitude de שׁוב, que neste contexto pode envolver tanto retorno quanto conversão, sem substituí-lo pelo termo teologicamente mais específico “se arrependerem”.
- source_word: וְהִתְחַנְּנוּ אֵלֶיךָ
  choice: suplicarem a ti
  rationale: O hitpael de חנן comunica um pedido insistente por favor; “suplicarem” mantém solenidade e urgência em português corrente.
- source_word: בְּאֶרֶץ שִׁבְיָם
  choice: na terra do seu cativeiro
  rationale: Mantém a referência concreta de שְׁבִי à condição de cativeiro e reproduz a repetição geográfica do hebraico.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Equivalente português normal para a fórmula hebraica que introduz discurso direto.
- source_word: חָטָאנוּ
  choice: Pecamos
  rationale: Tradução direta da fórmula de confissão.
- source_word: הֶעֱוִינוּ
  choice: agimos perversamente
  rationale: Preserva a ideia de conduta moralmente torcida ou pervertida associada ao hifil de עוה.
- source_word: וְרָשָׁעְנוּ
  choice: procedemos com maldade
  rationale: Mantém a força verbal e a culminação da confissão, ao mesmo tempo que evita repetir “agimos” imediatamente.
theological_decisions:
- issue: Linguagem de retorno e arrependimento no contexto do exílio
  choice: Traduzir וְשָׁבוּ por “voltarem”.
  alternative: “se arrependerem” ou “retornarem”
  rationale: “Voltarem” conserva a tensão entre retorno espiritual a Deus e retorno no contexto do exílio, sem limitar o verbo a uma formulação doutrinária explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe mantém a sequência condicional do contexto e o paralelismo triplo da confissão.
