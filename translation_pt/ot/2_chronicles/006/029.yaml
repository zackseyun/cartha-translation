base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/029.yaml
  text: whatever prayer[a], whatever plea may be made by any man or by all your people Israel, each knowing his own affliction and his own pain, and spreading out his hands toward this house—
translation:
  language: pt
  text: qualquer oração, qualquer súplica que qualquer pessoa ou todo o teu povo Israel fizer, cada um conhecendo sua própria aflição e sua própria dor e estendendo as mãos na direção desta casa—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל תְּפִלָּה
  choice: toda oração
  rationale: O uso de כָּל abrange qualquer oração que venha a ser feita; em português, “toda oração” preserva naturalmente esse alcance abrangente.
- source_word: כָל תְּחִנָּה
  choice: toda súplica
  rationale: תְּחִנָּה designa um pedido insistente por favor ou misericórdia. “Súplica” é corrente, digna e mantém a intensidade do termo.
- source_word: אֲשֶׁר יִהְיֶה לְכָל הָאָדָם וּלְכֹל עַמְּךָ יִשְׂרָאֵל
  choice: que qualquer pessoa ou todo o teu povo Israel fizer
  rationale: A formulação expressa a oração ou súplica pertencente a, ou apresentada por, um indivíduo ou pelo povo coletivamente. “Fizer” torna explícita em português a ação idiomática de fazer uma oração, sem alterar o sentido.
- source_word: אֲשֶׁר יֵדְעוּ אִישׁ
  choice: cada um reconhecendo
  rationale: אִישׁ tem força distributiva, “cada um”. Neste contexto, ידע implica consciência pessoal da própria condição; “reconhecendo” comunica isso com naturalidade.
- source_word: נִגְעוֹ
  choice: sua própria aflição
  rationale: נֶגַע pode indicar golpe, praga ou aflição. Aqui o contexto é amplo e pessoal, de modo que “aflição” evita restringir indevidamente o sentido a uma doença específica.
- source_word: וּמַכְאֹבוֹ
  choice: e sua própria dor
  rationale: מַכְאוֹב denota dor ou sofrimento. “Dor” conserva a dimensão vivida e mantém a distinção em relação a “aflição”.
- source_word: וּפָרַשׂ כַּפָּיו
  choice: e estendendo as mãos
  rationale: A expressão descreve o gesto de oração com as palmas abertas; “estender as mãos” é idiomático em português e preserva o gesto.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: na direção desta casa
  rationale: אֶל indica aqui orientação física e simbólica para o templo. “Na direção desta casa” explicita essa orientação sem sugerir que a oração seja dirigida ao edifício.
theological_decisions:
- issue: Sentido genérico de הָאָדָם
  choice: qualquer pessoa
  alternative: qualquer homem
  rationale: הָאָדָם é singular e genérico neste contexto, referindo-se a qualquer integrante do povo, não especificamente a um homem do sexo masculino. “Qualquer pessoa” transmite diretamente essa abrangência em português moderno, sem introduzir uma restrição ausente do contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição “toda oração, toda súplica” preserva a estrutura enfática do hebraico. O travessão final foi mantido porque a frase continua no versículo seguinte.
