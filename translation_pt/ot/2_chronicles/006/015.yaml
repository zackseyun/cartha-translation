source:
  edition: WLC
  text: אֲשֶׁ֣ר שָׁמַ֗רְתָּ לְ/עַבְדְּ/ךָ֙ דָּוִ֣יד אָבִ֔/י אֵ֥ת אֲשֶׁר דִּבַּ֖רְתָּ ל֑/וֹ וַ/תְּדַבֵּ֥ר בְּ/פִ֛י/ךָ וּ/בְ/יָדְ/ךָ֥ מִלֵּ֖אתָ כַּ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/015.yaml
  text: You have kept for your servant David my father what you spoke to him[a]; with your mouth you have spoken, and with your hand you have fulfilled it[b], as it is this day.
translation:
  language: pt
  text: Cumpriste o que disseste a teu servo Davi, meu pai[a]; falaste com tua boca e o realizaste com tua mão[b], como se vê hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o que prometeste a teu servo Davi”. O hebraico diz literalmente “o que lhe falaste”; o sentido de promessa é indicado pelo contexto de cumprimento.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “com tua boca ... com tua mão”, modo hebraico de contrastar a palavra pronunciada por Deus com sua ação eficaz.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמַרְתָּ
  choice: cumpriste
  rationale: No contexto de uma palavra dada e depois realizada, o verbo indica guardar fielmente ou cumprir. Em português, “cumpriste” comunica com clareza a força promissória do contexto.
- source_word: לְעַבְדְּךָ
  choice: para com teu servo
  rationale: A preposição ל com שׁמר expressa aqui aquilo que Deus cumpriu em favor de seu servo. “Para com” mantém essa relação sem sugerir mera entrega.
- source_word: דָּוִיד אָבִי
  choice: Davi, meu pai
  rationale: Preserva a sequência hebraica e soa natural em português, com a relação familiar em aposição.
- source_word: אֵת אֲשֶׁר דִּבַּרְתָּ לוֹ
  choice: aquilo que lhe disseste
  rationale: Traduz diretamente o verbo “falar/dizer”, deixando que o contexto de cumprimento indique que se tratava de uma promessa.
- source_word: וַתְּדַבֵּר בְּפִיךָ
  choice: com tua boca falaste
  rationale: Mantém a imagem concreta e o paralelismo retórico entre a boca, associada à palavra, e a mão, associada à ação.
- source_word: וּבְיָדְךָ מִלֵּאתָ
  choice: e com tua mão o realizaste
  rationale: O verbo מלא significa aqui levar ao pleno cumprimento. “Realizaste” evita repetir “cumpriste” e preserva a ideia de ação efetiva.
- source_word: כַּיּוֹם הַזֶּה
  choice: como hoje se vê
  rationale: Expressa idiomaticamente a confirmação presente e visível indicada pela fórmula hebraica, sem perder sua referência ao dia atual.
theological_decisions:
- issue: Linguagem antropomórfica sobre Deus (“boca” e “mão”)
  choice: Preservar literalmente as imagens de boca e mão
  alternative: Traduzir de modo funcional como “falaste e realizaste” sem mencionar boca e mão
  rationale: O texto contrapõe deliberadamente a palavra pronunciada e a ação eficaz de Deus. A conservação das imagens preserva essa retórica sem definir além do texto como se deve entender a corporeidade divina.
- issue: Sentido promissório de “aquilo que lhe disseste”
  choice: Manter “disseste” no texto e explicar a possibilidade de “prometeste” em nota
  alternative: Traduzir diretamente “aquilo que lhe prometeste”
  rationale: O hebraico usa o verbo comum “falar”, embora o contexto revele força de promessa. A opção conserva a forma da fonte e não elimina sua nuance contextual.
translation_notes:
  register: Português moderno, claro e solene, com uso de “tu” coerente com a oração dirigida diretamente a Deus. As imagens hebraicas centrais foram preservadas, enquanto a expressão temporal final foi vertida de maneira idiomática e amplamente compreensível.
