  text: וּ/פָנִ֜יתָ אֶל תְּפִלַּ֧ת עַבְדְּ/ךָ֛ וְ/אֶל תְּחִנָּת֖/וֹ יְהוָ֣ה אֱלֹהָ֑/י לִ/שְׁמֹ֤עַ אֶל הָ/רִנָּה֙ וְ/אֶל הַ/תְּפִלָּ֔ה אֲשֶׁ֥ר עַבְדְּ/ךָ֖ מִתְפַּלֵּ֥ל לְ/פָנֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/019.yaml
  text: Yet turn toward the prayer of your servant and his plea for favor[a], O Yahweh my God[c][b], to hear the cry and the prayer that your servant is praying before you.
translation:
  language: pt
  text: Contudo, volta-te para a oração do teu servo e para a sua súplica por favor[a], ó Yahweh, meu Deus, para ouvires o clamor[b] e a oração que o teu servo faz diante de ti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a sua súplica”. O termo hebraico indica um pedido insistente por favor ou misericórdia.
    reason: lexical_alternative
  - marker: b
    text: Ou “o forte clamor”. A palavra hebraica pode indicar um brado sonoro; aqui, provavelmente, um clamor por ajuda em oração.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָנִיתָ
  choice: Contudo, volta-te para
  rationale: Preserva a imagem verbal de פנה, “voltar-se para”, enquanto “contudo” expressa naturalmente a transição suplicante após a afirmação anterior.
- source_word: תְּפִלַּת
  choice: a oração
  rationale: Equivalente corrente de תפלה, mantido também na repetição posterior para preservar o paralelismo.
- source_word: עַבְדְּךָ
  choice: teu servo
  rationale: Em linguagem de oração régia dirigida a Deus, “servo” é natural e adequado ao contexto.
- source_word: תְּחִנָּתוֹ
  choice: a sua súplica por favor
  rationale: Comunica o sentido de um pedido insistente por graça, favor ou misericórdia, distinguindo o termo de תפלה.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהָי
  choice: meu Deus
  rationale: Reproduz diretamente a construção possessiva usada como vocativo.
- source_word: לִשְׁמֹעַ
  choice: e ouve
  rationale: O infinitivo indica o propósito ou resultado solicitado; em português, a coordenação imperativa torna a súplica clara e natural sem alterar a relação semântica.
- source_word: הָרִנָּה
  choice: o clamor
  rationale: רנה pode designar um brado forte; neste contexto de oração, “clamor” sugere adequadamente um pedido de socorro em voz alta.
- source_word: הַתְּפִלָּה
  choice: a oração
  rationale: Mantém a repetição lexical e o paralelismo do hebraico.
- source_word: מִתְפַּלֵּל
  choice: faz
  rationale: Na expressão portuguesa “faz a oração”, transmite de modo natural a ação presente do particípio, evitando a repetição pouco fluida “oração que está orando”.
- source_word: לְפָנֶיךָ
  choice: diante de ti
  rationale: Equivalente idiomático direto de “perante ti” ou “na tua presença”, com registro atual e digno.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz o Tetragrama como nome próprio. “Yahweh” preserva esse nome sem substituí-lo por um título nem adotar uma vocalização tradicional alternativa.
- issue: Força de תְּחִנָּתוֹ
  choice: súplica por favor
  alternative: súplica; pedido de misericórdia
  rationale: A formulação conserva a noção de apelo por favor ou graça sem determinar de forma excessivamente estreita se o favor pedido deve ser entendido especificamente como misericórdia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Preservam-se a imagem de Deus voltar-se para a oração, a distinção entre oração e súplica e a repetição poética do original. A colocação pronominal e os possessivos em segunda pessoa mantêm o tom solene sem recorrer a vocabulário arcaico excessivo.
