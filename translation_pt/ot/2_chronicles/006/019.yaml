    issue: A relação de finalidade expressa por לִשְׁמֹעַ não é preservada explicitamente.
    rationale: «E ouve» apresenta «ouvir» como uma segunda petição independente, enquanto o hebraico pede que Yahweh se volte para a oração «para ouvir» o clamor e a oração. «Para ouvires» mantém essa dependência sem prejudicar a naturalidade.
