  text: אָ֖ז אָמַ֣ר שְׁלֹמֹ֑ה יְהוָ֣ה אָמַ֔ר לִ/שְׁכּ֖וֹן בָּ/עֲרָפֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/001.yaml
  text: Then Solomon said[a], “Yahweh has said that he would dwell in the thick darkness.”
translation:
  language: pt
  text: 'Então Salomão disse: “Yahweh disse que habitaria na escuridão densa[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na nuvem escura”. O termo hebraico pode indicar nuvem densa, escuridão profunda ou trevas, especialmente em contextos de manifestação divina.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Marca a sequência narrativa de modo natural e direto em português.
- source_word: אָמַר ... שְׁלֹמֹה
  choice: Salomão disse
  rationale: É a tradução comum e menos interpretativa da fórmula hebraica de introdução da fala.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אָמַר
  choice: disse
  rationale: Traduz diretamente a forma verbal hebraica; o pretérito perfeito é natural em português neste contexto e não exige explicitar uma relevância presente.
- source_word: לִשְׁכּוֹן
  choice: que habitaria
  rationale: Expressa em discurso indireto o conteúdo do que Yahweh disse; “habitaria” comunica permanência sem a rigidez de uma tradução infinitiva literal.
- source_word: בָּעֲרָפֶל
  choice: na escuridão densa
  rationale: Preserva a ideia de obscuridade intensa e o peso teofânico do termo, sem reduzir a imagem a um fenômeno apenas meteorológico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido da presença divina em עֲרָפֶל
  choice: habitaria na escuridão densa
  alternative: habitaria na nuvem escura
  rationale: A formulação conserva a tensão entre a proximidade de Deus e seu caráter oculto, sem definir em excesso se a imagem é principalmente escuridão ou nuvem.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A repetição de “disse” reflete a repetição hebraica de אָמַר e evita introduzir uma nuance interpretativa por meio de “declarou”.
