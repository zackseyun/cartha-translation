id: 2CH.6.11
reference: 2 Chronicles 6:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וָ/אָשִׂ֥ים שָׁם֙ אֶת הָ֣/אָר֔וֹן אֲשֶׁר שָׁ֖ם בְּרִ֣ית יְהוָ֑ה אֲשֶׁ֥ר כָּרַ֖ת עִם בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/011.yaml
  text: And there I have placed the ark[a], in which is the covenant of Yahweh, which he made with the sons of Israel.
translation:
  language: pt
  text: E ali coloquei a arca, na qual está a aliança de Yahweh, que ele fez com os filhos de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, “o povo de Israel”. O hebraico diz literalmente “os filhos de Israel”, designação coletiva tradicional do povo de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשִׂים
  choice: coloquei
  rationale: O verbo שׂוּם significa pôr ou colocar. O pretérito perfeito expressa naturalmente em português a ação concluída por Salomão.
- source_word: שָׁם
  choice: ali
  rationale: Retoma o lugar anteriormente mencionado, isto é, o templo ou seu recinto interior.
- source_word: הָאָרוֹן
  choice: a arca
  rationale: “Arca” é o termo consagrado e exato neste contexto cultual.
- source_word: אֲשֶׁר שָׁם
  choice: na qual está
  rationale: Expressa de modo natural a localização da aliança na arca, preservando a formulação do hebraico sem explicar além do texto.
- source_word: בְּרִית יְהוָה
  choice: a aliança de Yahweh
  rationale: Mantém de forma transparente tanto o termo pactual בְּרִית quanto o nome divino pessoal.
- source_word: אֲשֶׁר כָּרַת
  choice: que ele fez
  rationale: O hebraico usa literalmente o idioma “cortar uma aliança”; “fazer uma aliança” comunica seu sentido de maneira corrente em português.
- source_word: עִם
  choice: com
  rationale: Preserva o sentido normal da preposição no contexto de celebração de uma aliança.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Reproduz a forma masculina plural do hebraico e conserva a expressão bíblica tradicional, cujo sentido coletivo é esclarecido em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Preserva o nome pessoal expresso no texto hebraico, em vez de substituí-lo por um título.
- issue: Sentido coletivo de בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: o povo de Israel
  rationale: A tradução principal mantém a forma literal e tradicional, enquanto a nota registra seu sentido corporativo sem neutralizar silenciosamente o hebraico.
- issue: A aliança localizada na arca
  choice: na qual está a aliança
  alternative: na qual estão as tábuas da aliança
  rationale: O texto hebraico diz “a aliança” e não explicita “as tábuas”; a tradução preserva essa metonímia e evita acrescentar uma interpretação ao texto principal.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. A sintaxe acompanha de perto o hebraico sem conservar o idioma pouco natural “cortar uma aliança”.
