id: 2CH.6.9
reference: 2 Chronicles 6:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: רַ֣ק אַתָּ֔ה לֹ֥א תִבְנֶ֖ה הַ/בָּ֑יִת כִּ֤י בִנְ/ךָ֙ הַ/יּוֹצֵ֣א מֵֽ/חֲלָצֶ֔י/ךָ הֽוּא יִבְנֶ֥ה הַ/בַּ֖יִת לִ/שְׁמִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/009.yaml
  text: Yet you shall not build the house[a]; rather, your son, who will come from your own body[b], shall build the house for my name.
translation:
  language: pt
  text: Contudo, você não construirá a Casa[a]; seu filho, que sairá do seu próprio corpo[b], é quem construirá a Casa para o meu nome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o templo”; em hebraico, “a casa”, designação comum do templo.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “dos seus lombos”, expressão que indica um descendente biológico direto.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Contudo
  rationale: Introduz a restrição à aprovação divina mencionada anteriormente, preservando a força adversativa em português natural.
- source_word: תִבְנֶה הַבָּיִת
  choice: construirá a Casa
  rationale: Mantém o hebraico definido, literalmente 'a casa'; a inicial maiúscula sinaliza seu uso como designação do templo sem substituí-lo na tradução.
- source_word: כִּי
  choice: seu filho ... é quem
  rationale: Após a negação, introduz o contraste positivo. A construção portuguesa dispensa um conectivo explícito e, com 'é quem', comunica também a ênfase do pronome הוּא.
- source_word: בִנְךָ
  choice: seu filho
  rationale: Tradução direta e natural do substantivo com sufixo de segunda pessoa masculina singular.
- source_word: הַיּוֹצֵא מֵחֲלָצֶיךָ
  choice: que sairá do seu próprio corpo
  rationale: Comunica em linguagem atual o idiomatismo hebraico que indica descendência física direta, preservando tanto o movimento expresso pelo particípio quanto a ligação corporal.
- source_word: הוּא
  choice: é quem
  rationale: 'Preserva de modo idiomático a ênfase do pronome independente: não Davi, mas esse filho construirá a Casa.'
- source_word: יִבְנֶה הַבַּיִת
  choice: construirá a Casa
  rationale: O futuro expressa a declaração divina, e a repetição de 'a Casa' mantém a correspondência lexical dentro do versículo.
- source_word: לִשְׁמִי
  choice: para o meu nome
  rationale: Preserva a expressão hebraica de dedicação e representação do nome de Deus sem explicá-la excessivamente.
theological_decisions:
- issue: Terminologia do templo
  choice: a Casa
  alternative: o templo
  rationale: O hebraico diz literalmente 'a casa', designação comum do templo. A inicial maiúscula ajuda o leitor a reconhecer o referente, mantendo a textura e as conexões verbais do original.
- issue: Idiotismo de linhagem
  choice: do seu próprio corpo
  alternative: dos seus lombos
  rationale: O idioma hebraico denota um descendente biológico direto. A formulação escolhida transmite isso com clareza atual sem acrescentar afirmações teológicas.
- issue: Ênfase no filho construtor
  choice: é quem construirá
  alternative: ele construirá
  rationale: A construção clivada representa naturalmente em português a ênfase de הוּא e conserva o contraste entre Davi, que não construirá, e seu filho, que construirá.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Usa “você” para a segunda pessoa singular por naturalidade contemporânea; mantém “a Casa” como termo contextual para o templo e emprega “é quem” para reproduzir a ênfase hebraica sem redundância artificial.
