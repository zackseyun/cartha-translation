base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/017.yaml
  text: Now[a], Yahweh, God of Israel, let your word that you spoke to your servant David be confirmed.
translation:
  language: pt
  text: Agora, Yahweh, Deus de Israel, que se confirme[a] a palavra que disseste ao teu servo Davi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que se cumpra a tua promessa”; ou: “que a tua palavra se mostre verdadeira”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: Marca a transição para a petição seguinte de Salomão. Em português, “Agora” é natural; o וְ inicial não precisa ser reproduzido separadamente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Deus de Israel
  rationale: Reproduz de modo direto e corrente a construção que identifica Yahweh como o Deus de Israel.
- source_word: יֵאָמֵן
  choice: que se confirme
  rationale: O nifal de אמן exprime aqui o pedido de que a palavra pronunciada seja estabelecida e demonstrada como verdadeira por seu cumprimento.
- source_word: דְּבָרְךָ
  choice: a palavra
  rationale: Mantém o sentido lexical de “palavra”, embora no contexto se trate de uma promessa divina.
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: que disseste
  rationale: Preserva a relação entre “palavra” e o ato de falar, em linguagem portuguesa natural e digna.
- source_word: לְעַבְדְּךָ לְדָוִיד
  choice: ao teu servo Davi
  rationale: O primeiro לְ indica o destinatário do que foi dito; o segundo introduz Davi em aposição a “teu servo”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico emprega diretamente o nome divino. “Yahweh” preserva esse nome em transliteração, sem substituí-lo por um título.
- issue: Se דְּבָרְךָ deve ser interpretado como “promessa”
  choice: a palavra
  alternative: a promessa
  rationale: “Promessa” explicita corretamente o sentido contextual, mas “palavra” preserva a forma do hebraico e deixa o contexto comunicar sua força promissória.
- issue: Amplitude de יֵאָמֵן
  choice: que se confirme
  alternative: que se cumpra; que fique estabelecida; que se mostre verdadeira
  rationale: “Que se confirme” mantém o caráter passivo/resultativo do verbo e comporta tanto a ideia de firme estabelecimento quanto a comprovação da veracidade pelo cumprimento.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Emprega segunda pessoa singular em contexto de oração solene, sem arcaísmos desnecessários.
