source:
  edition: WLC
  text: וָ/אֶבְחַר֙ בִּ/יר֣וּשָׁלִַ֔ם לִ/הְי֥וֹת שְׁמִ֖/י שָׁ֑ם וָ/אֶבְחַ֣ר בְּ/דָוִ֔יד לִ/הְי֖וֹת עַל עַמִּ֥/י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/006.yaml
  text: But I have chosen Jerusalem for my name to be there[a], and I have chosen David to be over my people Israel.
translation:
  language: pt
  text: Mas escolhi Jerusalém para que ali estivesse o meu nome[a], e escolhi Davi para estar à frente do meu povo Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para o meu nome estar ali”.'
    reason: A construção hebraica emprega um infinitivo e pode ser reproduzida mais formalmente dessa maneira; o texto principal usa uma oração flexionada mais natural em português.
lexical_decisions:
- source_word: וָאֶבְחַר
  choice: escolhi
  rationale: בחר expressa escolher ou eleger. O pretérito perfeito traduz naturalmente a forma narrativa hebraica e, no contexto da declaração divina, não exclui a validade contínua da escolha.
- source_word: בִּירוּשָׁלִַם
  choice: Jerusalém
  rationale: Nome próprio vertido segundo a forma portuguesa consagrada.
- source_word: לִהְיוֹת
  choice: para que ... estivesse / para estar
  rationale: O infinitivo de היה indica finalidade ou resultado. A primeira ocorrência pede uma oração flexionada em português; a segunda admite naturalmente o infinitivo.
- source_word: שְׁמִי
  choice: o meu nome
  rationale: Preserva literalmente a expressão hebraica de grande importância na teologia do templo, sem substituí-la por uma explicação interpretativa sobre a presença de Deus.
- source_word: שָׁם
  choice: ali
  rationale: Mantém explícita a referência locativa, com formulação natural em português em relação a Jerusalém.
- source_word: בְּדָוִיד
  choice: Davi
  rationale: Depois de בחר, a preposição ב introduz a pessoa escolhida; o português idiomático emprega objeto direto sem preposição.
- source_word: עַל
  choice: à frente de
  rationale: Comunica posição de autoridade sobre o povo de modo natural, sem acrescentar explicitamente os conceitos de reinar ou ser rei, ausentes da formulação hebraica imediata.
- source_word: עַמִּי יִשְׂרָאֵל
  choice: meu povo Israel
  rationale: Conserva a linguagem pactual e a aposição identificadora do hebraico em uma construção corrente em português.
- source_word: וְ
  choice: Mas
  rationale: A conjunção introduz contraste com a declaração negativa do contexto anterior; “Mas” representa sua função discursiva melhor que um “E” mecânico.
theological_decisions:
- issue: Teologia do templo na expressão “para que ali estivesse o meu nome”
  choice: Preservar “o meu nome” e a referência locativa, sem transformar a expressão em uma afirmação explícita de que a presença de Deus habita em Jerusalém.
  alternative: “para que ali estivesse a minha presença” ou “como o lugar onde eu seria adorado”
  rationale: O hebraico fala especificamente do nome de Deus. Manter a expressão conserva sua densidade pactual e teológica e evita explicar no texto aquilo que a formulação bíblica deixa implícito.
- issue: O papel de Davi em “para estar à frente do meu povo Israel”
  choice: Expressar autoridade de forma geral, sem inserir “rei” no texto principal.
  alternative: “para ser rei sobre o meu povo Israel” ou “para governar o meu povo Israel”
  rationale: Embora o contexto seja a realeza davídica, o hebraico imediato diz apenas que Davi estaria “sobre” o povo. A tradução evita uma expansão interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Davi” e “Jerusalém” seguem as formas bíblicas portuguesas consagradas. A ordem e o paralelismo do hebraico são preservados, enquanto “à frente de” comunica autoridade em linguagem corrente sem explicitação excessiva.
