review_pass:
  verdict: revise
  source_fidelity: A sequência sintática, os principais termos e as finalidades do hebraico estão bem representados. Contudo, a expressão portuguesa “o teu nome é invocado sobre esta casa” pode sugerir que o nome é objeto de invocação dirigida à casa, em vez de comunicar o idiomatismo hebraico de a casa ser designada pelo nome de Deus. A voz passiva com “esta casa é chamada pelo teu nome” transmite com clareza o mesmo idiomatismo, preservando-o literalmente na nota.
  naturalness: “Assim como o teu povo Israel te teme” torna explícito, em português corrente, o verbo elíptico na comparação hebraica. “Esta casa é chamada pelo teu nome” é mais natural e imediatamente inteligível que “o teu nome é invocado sobre esta casa”.
  terminology: “Céus”, “lugar da tua habitação”, “estrangeiro” e “temam” são adequados ao registro solene e moderno. A formulação revista para o nome divino conserva a linguagem de designação associada ao templo sem impor uma interpretação doutrinária.
  issues:
  - severity: medium
    issue: A locução “o teu nome é invocado sobre esta casa” é semanticamente pouco natural em português.
    rationale: Embora siga a ordem do hebraico, “invocar” em português normalmente toma como objeto aquele a quem se dirige a oração; por isso, a frase pode ser entendida de modo diferente do idiomatismo hebraico נִקְרָא עַל, isto é, a casa ser chamada pelo nome de Deus.
  - severity: low
    issue: A comparação “como o teu povo Israel” deixa o predicado apenas implícito.
    rationale: A elipse é possível, mas a repetição de “te teme” melhora a fluência e explicita a comparação sem acrescentar conteúdo além do que o hebraico pressupõe.
