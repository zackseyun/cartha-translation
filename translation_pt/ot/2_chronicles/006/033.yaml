source:
  edition: WLC
  text: וְ/אַתָּ֞ה תִּשְׁמַ֤ע מִן הַ/שָּׁמַ֨יִם֙ מִ/מְּכ֣וֹן שִׁבְתֶּ֔/ךָ וְ/עָשִׂ֕יתָ כְּ/כֹ֛ל אֲשֶׁר יִקְרָ֥א אֵלֶ֖י/ךָ הַ/נָּכְרִ֑י לְמַ֣עַן יֵדְעוּ֩ כָל עַמֵּ֨י הָ/אָ֜רֶץ אֶת שְׁמֶ֗/ךָ וּ/לְ/יִרְאָ֤ה אֹֽתְ/ךָ֙ כְּ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל וְ/לָ/דַ֕עַת כִּֽי שִׁמְ/ךָ֣ נִקְרָ֔א עַל הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/033.yaml
  text: then hear from heaven[a], from your dwelling place, and do according to all that the foreigner calls to you for, so that all the peoples of the earth may know your name and fear you, as your people Israel do, and may know that your name is called upon this house that I have built.
translation:
  language: pt
  text: então ouve dos céus, do lugar da tua habitação, e faze conforme tudo o que o estrangeiro te pedir, para que todos os povos da terra conheçam o teu nome e te temam, assim como o teu povo Israel te teme, e saibam que esta casa[a] que construí é chamada pelo teu nome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o teu nome é chamado sobre esta casa”. Ou, de modo mais interpretativo, “esta casa leva o teu nome”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: ouve
  rationale: Em contexto de oração, שׁמע implica ouvir com atenção e disposição para responder. “Ouve” é conciso e mantém a ligação com a ação divina mencionada em seguida.
- source_word: מִן הַשָּׁמַיִם
  choice: dos céus
  rationale: A forma hebraica é plural; “dos céus” é natural em português bíblico e preserva essa forma sem sugerir que Deus habite no templo terreno.
- source_word: מִמְּכוֹן שִׁבְתֶּךָ
  choice: do lugar da tua habitação
  rationale: מכון indica um lugar estabelecido ou fixo. A expressão conserva tanto o sentido locativo quanto o caráter solene da oração.
- source_word: וְעָשִׂיתָ
  choice: e faze
  rationale: עשה é um verbo amplo. “Faze” preserva essa amplitude, sem especificar indevidamente como Deus responderá.
- source_word: כְּכֹל אֲשֶׁר יִקְרָא אֵלֶיךָ
  choice: conforme tudo o que o estrangeiro te pedir
  rationale: קרא אל descreve o ato de dirigir um clamor ou pedido a alguém. “Te pedir” comunica com naturalidade o sentido de oração peticionária, enquanto “conforme tudo” mantém a estrutura e a abrangência do hebraico.
- source_word: הַנָּכְרִי
  choice: o estrangeiro
  rationale: נכרי designa alguém pertencente a outro povo, não um israelita. “Estrangeiro” é claro e atual.
- source_word: כָל עַמֵּי הָאָרֶץ
  choice: todos os povos da terra
  rationale: O contexto é universal; por isso, הארץ significa aqui “terra”, e o plural “povos” preserva a referência às diversas nações.
- source_word: וּלְיִרְאָה אֹתְךָ
  choice: e te temam
  rationale: ירא em relação a Deus inclui temor reverente. “Temam” conserva a força e a linguagem teológica do original.
- source_word: כִּי שִׁמְךָ נִקְרָא עַל הַבַּיִת הַזֶּה
  choice: que o teu nome é invocado sobre esta casa
  rationale: A formulação conserva de modo inteligível a expressão hebraica נִקְרָא עַל, sem reduzi-la silenciosamente à paráfrase “leva o teu nome”.
theological_decisions:
- issue: A linguagem sobre a habitação de Deus
  choice: Manter “dos céus, do lugar da tua habitação” e distinguir essa habitação da casa terrena
  alternative: Parafrasear como “da tua presença celestial”
  rationale: O próprio versículo distingue os céus, apresentados como lugar da habitação divina, da casa construída por Salomão, associada ao nome de Deus. A tradução próxima preserva essa tensão sem impor explicações sistemáticas posteriores.
- issue: O temor de Deus entre as nações
  choice: Usar “te temam”
  alternative: Usar “te reverenciem”
  rationale: A opção escolhida preserva a força do verbo ירא e a linguagem bíblica do temor de Deus, que inclui reverência sem eliminar a noção de temor.
- issue: A relação entre o nome de Deus e o templo
  choice: Manter o idioma “o teu nome é invocado sobre esta casa”
  alternative: Traduzir interpretativamente como “esta casa leva o teu nome”
  rationale: A forma escolhida preserva a expressão do original e sua possível amplitude teológica; a paráfrase mais imediata é apresentada em nota.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com formas de segunda pessoa coerentes (“tua”, “te”, “ouve”, “faze”). A ordem das ideias e a amplitude dos verbos hebraicos foram preservadas, evitando tanto arcaísmo excessivo quanto paráfrase doutrinária.
