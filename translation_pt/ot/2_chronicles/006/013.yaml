  text: כִּֽי עָשָׂ֨ה שְׁלֹמֹ֜ה כִּיּ֣וֹר נְחֹ֗שֶׁת וַֽ/יִּתְּנֵ/הוּ֮ בְּ/ת֣וֹךְ הָ/עֲזָרָה֒ חָמֵ֨שׁ אַמּ֜וֹת אָרְכּ֗/וֹ וְ/חָמֵ֤שׁ אַמּוֹת֙ רָחְבּ֔/וֹ וְ/אַמּ֥וֹת שָׁל֖וֹשׁ קוֹמָת֑/וֹ וַ/יַּעֲמֹ֣ד עָלָ֗י/ו וַ/יִּבְרַ֤ךְ עַל בִּרְכָּי/ו֙ נֶ֚גֶד כָּל קְהַ֣ל יִשְׂרָאֵ֔ל וַ/יִּפְרֹ֥שׂ כַּפָּ֖י/ו הַ/שָּׁמָֽיְמָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/013.yaml
  text: For Solomon had made a bronze platform and set it in the midst of the court; it was five cubits long[a], five cubits wide, and three cubits high. He stood on it, then knelt on his knees before all the assembly of Israel and spread out his hands toward heaven.
translation:
  language: pt
  text: Pois Salomão tinha feito uma plataforma de bronze[a] e a tinha colocado no meio do pátio. Ela media cinco côvados de comprimento, cinco côvados de largura e três côvados de altura. Ele ficou de pé sobre ela, depois se ajoelhou diante de toda a assembleia de Israel e estendeu as mãos para o céu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra hebraica geralmente significa “bacia” ou “lavatório”, mas aqui o contexto indica uma estrutura elevada de bronze sobre a qual Salomão podia ficar de pé; por isso, “plataforma”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz uma explicação de fundo para a posição e a localização de Salomão, preservando a força explicativa da conjunção.
- source_word: כִּיּוֹר נְחֹשֶׁת
  choice: uma plataforma de bronze
  rationale: Embora כִּיּוֹר normalmente designe uma bacia ou lavatório, as dimensões e o fato de Salomão ficar de pé sobre a estrutura indicam aqui uma plataforma elevada.
- source_word: בְּתוֹךְ הָעֲזָרָה
  choice: no meio do pátio
  rationale: עֲזָרָה designa o pátio do templo, e בְּתוֹךְ expressa localização em seu interior ou centro.
- source_word: חָמֵשׁ אַמּוֹת ... וְאַמּוֹת שָׁלֹשׁ
  choice: cinco côvados de comprimento, cinco côvados de largura e três côvados de altura
  rationale: Mantém a unidade antiga e apresenta as dimensões em português claro e natural.
- source_word: וַיַּעֲמֹד עָלָיו
  choice: Ele ficou de pé sobre ela
  rationale: Reproduz diretamente a postura de Salomão e torna inequívoco que ele estava sobre a estrutura.
- source_word: וַיִּבְרַךְ עַל בִּרְכָּיו
  choice: depois se ajoelhou
  rationale: Neste contexto, a raiz ברך descreve o ato de ajoelhar-se, e não o de abençoar; 'depois' comunica a sequência narrativa.
- source_word: נֶגֶד כָּל קְהַל יִשְׂרָאֵל
  choice: diante de toda a assembleia de Israel
  rationale: Preserva o cenário público e coletivo de culto com vocabulário atual e digno.
- source_word: וַיִּפְרֹשׂ כַּפָּיו הַשָּׁמָיְמָה
  choice: e estendeu as mãos para o céu
  rationale: Expressa naturalmente o gesto de oração e mantém a direção indicada pela terminação hebraica.
theological_decisions:
- issue: Sentido de כִּיּוֹר neste contexto
  choice: plataforma
  alternative: bacia ou lavatório de bronze; suporte de bronze
  rationale: O contexto afirma que Salomão ficou de pé sobre a estrutura, cujas dimensões são fornecidas. 'Plataforma' comunica melhor a função contextual, enquanto a nota preserva o sentido lexical mais comum e a anomalia do uso.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Conserva 'côvados' como unidade antiga e usa 'assembleia' para o contexto público de culto.
