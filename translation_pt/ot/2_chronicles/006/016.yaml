  to: 'E agora, SENHOR, Deus de Israel, cumpre ao teu servo Davi, meu pai, o que lhe disseste: “Nunca te faltará um homem que se assente diante de mim no trono de Israel, contanto que teus filhos cuidem do seu caminho, andando na minha lei, assim como tu andaste diante de mim.”'
