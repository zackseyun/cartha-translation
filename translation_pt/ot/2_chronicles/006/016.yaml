  text: וְ/עַתָּ֞ה יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל שְׁ֠מֹר לְ/עַבְדְּ/ךָ֨ דָוִ֤יד אָבִ/י֙ אֵת֩ אֲשֶׁ֨ר דִּבַּ֤רְתָּ לּ/וֹ֙ לֵ/אמֹ֔ר לֹא יִכָּרֵ֨ת לְ/ךָ֥ אִישׁ֙ מִ/לְּ/פָנַ֔/י יוֹשֵׁ֖ב עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל רַ֠ק אִם יִשְׁמְר֨וּ בָנֶ֜י/ךָ אֶת דַּרְכָּ֗/ם לָ/לֶ֨כֶת֙ בְּ/ת֣וֹרָתִ֔/י כַּ/אֲשֶׁ֥ר הָלַ֖כְתָּ לְ/פָנָֽ/י׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/016.yaml
  text: And now, LORD, God of Israel, keep for your servant David my father what you spoke to him, saying, ‘A man to sit on the throne of Israel before me shall not be cut off from you, if only your sons keep their way by walking in my law, as you have walked before me.’
translation:
  language: pt
  text: 'E agora, SENHOR, Deus de Israel, cumpre ao teu servo Davi, meu pai, o que lhe disseste: “Nunca te faltará um homem que se assente diante de mim no trono de Israel, contanto que teus filhos cuidem do seu caminho, andando na minha lei, assim como tu andaste diante de mim.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida para o nome divino, usando versaletes para distingui-lo do título comum.
- source_word: שְׁמֹר
  choice: cumpre
  rationale: No contexto de uma promessa, o imperativo hebraico 'guarda' significa observar ou levar a efeito o que foi dito; 'cumpre' comunica esse sentido naturalmente em português.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ
  choice: Nunca te faltará ... um homem
  rationale: Expressa com naturalidade o idioma hebraico segundo o qual um homem da linhagem de Davi não seria eliminado ou interrompido.
- source_word: רַק אִם
  choice: contanto que
  rationale: Preserva a condição enfática introduzida por 'somente se' no hebraico.
- source_word: יִשְׁמְרוּ ... אֶת דַּרְכָּם
  choice: cuidem do seu caminho
  rationale: Mantém a imagem hebraica do caminho e a responsabilidade dos filhos de Davi, sem reduzir a expressão a uma formulação doutrinária abstrata.
- source_word: לָלֶכֶת בְּתוֹרָתִי
  choice: andando na minha lei
  rationale: Conserva a metáfora de andar e traduz תּוֹרָה por 'lei', adequada à referência à instrução divina neste contexto.
theological_decisions:
- issue: Caráter condicional da continuidade davídica
  choice: contanto que teus filhos cuidem do seu caminho
  alternative: se apenas teus filhos cuidarem do seu caminho
  rationale: A redação mantém explicitamente a condição do texto hebraico, sem harmonizá-la ou resolvê-la à luz de outras formulações da promessa davídica.
- issue: Identidade do homem que ocupará o trono
  choice: um homem
  alternative: um descendente
  rationale: Mantém o substantivo explícito do hebraico e deixa que a relação dinástica seja inferida da expressão 'te faltará', evitando explicitação interpretativa desnecessária.
translation_notes:
  register: Português moderno, digno e acessível, com formas de segunda pessoa coerentes com o registro bíblico corrente. A sintaxe foi levemente ajustada para fluência, preservando a sequência da oração, da promessa citada e de sua condição.
