source:
  edition: WLC
  text: וַ/יָּ֣קֶם יְהוָ֔ה אֶת דְּבָר֖/וֹ אֲשֶׁ֣ר דִּבֵּ֑ר וָ/אָק֡וּם תַּחַת֩ דָּוִ֨יד אָבִ֜/י וָ/אֵשֵׁ֣ב עַל כִּסֵּ֣א יִשְׂרָאֵ֗ל כַּ/אֲשֶׁר֙ דִּבֶּ֣ר יְהוָ֔ה וָ/אֶבְנֶ֣ה הַ/בַּ֔יִת לְ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/010.yaml
  text: And Yahweh has fulfilled his word that he spoke[a], and I have risen in the place of David my father and sit on the throne of Israel, as Yahweh spoke, and I have built the house for the name of Yahweh[b], the God of Israel.
translation:
  language: pt
  text: E Yahweh cumpriu a palavra que havia falado[a]. Eu sucedi a Davi, meu pai, e me assentei no trono de Israel, conforme Yahweh havia falado; e construí a casa para o nome de Yahweh[b], o Deus de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “confirmou a sua palavra” ou “levou a efeito a sua palavra”. O verbo hebraico significa literalmente “fez sua palavra ficar de pé”.
    reason: lexical_alternative
  - marker: b
    text: A “casa” é o templo. O hebraico conserva a expressão “casa para o nome de Yahweh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: cumpriu
  rationale: No hifil, o verbo קום com דָּבָר comunica fazer com que uma palavra se mantenha, isto é, cumpri-la ou levá-la a efeito. “Cumpriu” é natural em português e adequado à palavra prometida.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: דְּבָרוֹ אֲשֶׁר דִּבֵּר
  choice: a palavra que havia falado
  rationale: Preserva a repetição lexical entre o substantivo e o verbo da raiz דבר. O mais-que-perfeito situa naturalmente a fala antes de seu cumprimento.
- source_word: וָאָקוּם תַּחַת דָּוִיד אָבִי
  choice: Eu sucedi a Davi, meu pai
  rationale: תַּחַת indica ocupação do lugar de Davi na sucessão real. “Sucedi a” expressa isso com clareza e naturalidade, embora não reproduza literalmente o eco de קום.
- source_word: וָאֵשֵׁב עַל כִּסֵּא יִשְׂרָאֵל
  choice: me assentei no trono de Israel
  rationale: Representa a entronização já realizada no encadeamento narrativo e mantém a expressão régia.
- source_word: וָאֶבְנֶה הַבַּיִת
  choice: construí a casa
  rationale: “Casa” preserva o termo hebraico e sua ligação com a fórmula seguinte, embora no contexto designe o templo.
- source_word: לְשֵׁם יְהוָה
  choice: para o nome de Yahweh
  rationale: Mantém a formulação teologicamente significativa do hebraico, sem reduzi-la a uma paráfrase como “em honra de Yahweh”.
theological_decisions:
- issue: Designação do santuário
  choice: a casa
  alternative: o templo
  rationale: O referente é o templo, mas o hebraico diz “a casa”; conservar essa expressão mantém a linguagem canônica e sua conexão com “para o nome”.
- issue: Sentido de לְשֵׁם יְהוָה
  choice: para o nome de Yahweh
  alternative: em honra de Yahweh
  rationale: A tradução formal preserva a teologia do nome divino e evita explicar além do que o texto afirma.
- issue: Representação do Tetragrama
  choice: Yahweh
  alternative: SENHOR
  rationale: Conserva no texto o nome pessoal יְהוָה em forma transliterada.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A pontuação divide a longa coordenação hebraica sem apagar sua progressão. “Sucedi a Davi” é uma equivalência natural para a fórmula dinástica; “casa” e “para o nome” preservam os principais ecos formais e teológicos.
