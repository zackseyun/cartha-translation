  text: יְהוָ֣ה אֱלֹהִ֔ים אַל תָּשֵׁ֖ב פְּנֵ֣י מְשִׁיחֶ֑י/ךָ זָכְרָ֕/ה לְ/חַֽסְדֵ֖י דָּוִ֥יד עַבְדֶּֽ/ךָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/042.yaml
  text: O Yahweh God[a], do not turn away the face of your anointed one[c][b]; remember the steadfast love shown to David your servant.
translation:
  language: pt
  text: Ó Yahweh, Deus, não rejeites[a] o teu ungido[b]; lembra-te das demonstrações de amor leal a Davi, teu servo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “não desvies o rosto do teu ungido”. Também pode ser traduzido por “não rejeites o teu ungido”.
    reason: lexical_alternative
  - marker: b
    text: “O teu ungido” também pode ser traduzido por “o teu Messias” ou, neste contexto, “o teu rei”.
    reason: alternative_reading
  - marker: c
    text: Também pode ser traduzido por “lembra-te das misericórdias concedidas a Davi, teu servo” ou “lembra-te da tua fidelidade à aliança com Davi, teu servo”. A expressão hebraica é concisa e pode ser entendida de outras maneiras, inclusive como referência aos atos de lealdade de Davi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: Ó Yahweh Deus
  rationale: Mantém o nome divino YHWH por transliteração e traduz אֱלֹהִים pelo título comum “Deus”, preservando a forma de invocação hebraica.
- source_word: אַל תָּשֵׁב פְּנֵי
  choice: não rejeites
  rationale: A expressão hebraica fala literalmente em fazer voltar o rosto de alguém, mas funciona aqui como pedido para que Deus não recuse o seu ungido. A tradução principal comunica naturalmente o sentido em português, enquanto a nota preserva a imagem original.
- source_word: מְשִׁיחֶךָ
  choice: o teu ungido
  rationale: “Ungido” conserva o sentido lexical e o contexto régio sem transformar necessariamente a expressão no título posterior “Messias” nem explicitar “rei” no próprio texto.
- source_word: זָכְרָה
  choice: lembra-te
  rationale: Equivalente natural do imperativo hebraico em linguagem de oração e aliança.
- source_word: לְחַסְדֵי
  choice: dos atos de amor leal para com
  rationale: O plural חַסְדֵי pode designar manifestações de amor leal, misericórdia ou fidelidade de aliança. “Atos de amor leal” preserva o plural e, com “para com”, apresenta Davi como beneficiário sem ocultar completamente a concisão do hebraico.
- source_word: דָּוִיד עַבְדֶּךָ
  choice: Davi, teu servo
  rationale: Traduz diretamente a expressão em aposição, com pontuação natural em português.
theological_decisions:
- issue: Sentido régio e possível ressonância messiânica de מְשִׁיחֶךָ
  choice: o teu ungido
  alternative: o teu Messias; o teu rei
  rationale: No contexto imediato, a expressão se refere ao representante real davídico. “Teu ungido” preserva tanto esse sentido histórico quanto uma possível ressonância canônica, sem impor ao versículo um título cristológico mais explícito do que o hebraico exige.
- issue: Agente e beneficiário em חַסְדֵי דָּוִיד
  choice: atos de amor leal para com Davi
  alternative: misericórdias concedidas a Davi; fidelidade à aliança com Davi; atos de lealdade de Davi
  rationale: A construção é compacta e admite mais de uma relação semântica. O contexto da oração favorece a lembrança da lealdade de Deus para com Davi, mas a nota registra alternativas legítimas e evita apagar a tensão sintática.
translation_notes:
  register: Português moderno, digno e acessível, com colocação pronominal natural em registro bíblico (“não rejeites”, “lembra-te”). A tradução principal privilegia clareza idiomática, enquanto as notas conservam a imagem concreta e as ambiguidades lexical, régia e pactual do hebraico.
