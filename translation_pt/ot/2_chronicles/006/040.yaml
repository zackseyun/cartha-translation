  text: עַתָּ֣ה אֱלֹהַ֗/י יִֽהְיוּ נָ֤א עֵינֶ֨י/ךָ֙ פְּתֻח֔וֹת וְ/אָזְנֶ֖י/ךָ קַשֻּׁב֑וֹת לִ/תְפִלַּ֖ת הַ/מָּק֥וֹם הַ/זֶּֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/040.yaml
  text: Now[a], my God, please let your eyes be open and your ears attentive to the prayer of this place.
translation:
  language: pt
  text: Agora, meu Deus, por favor, que os teus olhos estejam abertos e os teus ouvidos atentos à oração deste lugar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à oração feita neste lugar” ou “à oração que vem deste lugar”. Mais literalmente, o hebraico diz “à oração deste lugar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Agora
  rationale: Marca a transição para a petição conclusiva de Salomão de modo natural e fiel.
- source_word: אֱלֹהַי
  choice: meu Deus
  rationale: Preserva o vocativo pessoal sem recorrer ao mais solene e menos corrente “ó meu Deus”.
- source_word: יִהְיוּ נָא
  choice: por favor, que ... estejam
  rationale: Expressa tanto o valor volitivo do jussivo quanto o tom suplicante de נָא em português natural.
- source_word: עֵינֶיךָ פְּתֻחוֹת
  choice: os teus olhos estejam abertos
  rationale: Mantém a imagem antropomórfica concreta de atenção e vigilância divinas.
- source_word: וְאָזְנֶיךָ קַשֻּׁבוֹת
  choice: e os teus ouvidos atentos
  rationale: Comunica prontidão para ouvir e conserva o paralelismo com os olhos abertos.
- source_word: לִתְפִלַּת
  choice: à oração
  rationale: A preposição לְ indica aquilo para o qual a atenção divina se dirige.
- source_word: הַמָּקוֹם הַזֶּה
  choice: deste lugar
  rationale: Reproduz de perto a construção hebraica sem inserir no texto principal ideias como “feita” ou “elevada”.
theological_decisions:
- issue: Linguagem antropomórfica sobre os olhos e os ouvidos de Deus
  choice: Conservar as imagens concretas “olhos ... abertos” e “ouvidos atentos”
  alternative: Parafrasear como “vela por nós e ouve”
  rationale: O hebraico apresenta a atenção divina por meio de imagens corporais. Mantê-las preserva a textura literária e teológica sem exigir uma compreensão grosseiramente corpórea.
- issue: Relação da oração com “este lugar”
  choice: Preservar a construção ambígua “oração deste lugar”
  alternative: Explicitar como “oração feita neste lugar” ou “oração que vem deste lugar”
  rationale: A relação genitival hebraica é concisa e pode indicar oração associada ao templo, oferecida nele ou proveniente dele; o texto principal não deve resolver essa ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com uso de “teus” coerente com a oração direta a Deus. A formulação conserva o paralelismo poético e a ambiguidade da expressão final.
