revisions:
- from: 'E ele disse: “Bendito seja Yahweh, o Deus de Israel, que falou com sua boca a Davi, meu pai, e com sua mão cumpriu o que havia dito, dizendo:'
  to: 'E ele disse: “Bendito seja Yahweh, o Deus de Israel, que, por sua boca, falou a Davi, meu pai, e, por sua mão, cumpriu o que disse, dizendo:”'
  rationale: A revisão substitui «com» por «por» para reproduzir de maneira natural o sentido instrumental das expressões hebraicas e manter o paralelismo entre boca e mão. Troca «o que havia dito» por «o que disse», sem impor anterioridade verbal além da inerente ao contexto, e regulariza o fechamento das aspas.
