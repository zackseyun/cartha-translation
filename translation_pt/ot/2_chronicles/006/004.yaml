  text: וַ/יֹּ֗אמֶר בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר֙ דִּבֶּ֣ר בְּ/פִ֔י/ו אֵ֖ת דָּוִ֣יד אָבִ֑/י וּ/בְ/יָדָ֥י/ו מִלֵּ֖א לֵ/אמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/004.yaml
  text: And he said[a], “Blessed be Yahweh, the God of Israel, who spoke with his mouth to David my father and has fulfilled it by his hand, saying,”
translation:
  language: pt
  text: 'E ele disse: “Bendito seja Yahweh, o Deus de Israel, que, por sua boca, falou a Davi, meu pai, e, por sua mão, cumpriu o que disse, dizendo:”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ele disse
  rationale: Preserva o fluxo narrativo do wayyiqtol hebraico e introduz de modo natural a fala de Salomão.
- source_word: בָּרוּךְ
  choice: Bendito seja
  rationale: Reproduz a fórmula hebraica de bênção dirigida a Deus em linguagem elevada, corrente e inteligível.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta da cadeia construta que identifica Yahweh em sua relação com Israel.
- source_word: דִּבֶּר בְּפִיו
  choice: falou com sua boca
  rationale: Mantém o antropomorfismo explícito e o paralelismo deliberado entre a boca, pela qual Deus fala, e a mão, pela qual age.
- source_word: אֵת דָּוִיד אָבִי
  choice: a Davi, meu pai
  rationale: No contexto, Davi é o destinatário da promessa divina; a preposição “a” expressa isso naturalmente em português.
- source_word: וּבְיָדוֹ מִלֵּא
  choice: e com sua mão cumpriu o que havia dito
  rationale: Conserva a imagem da mão e torna explícito em português o objeto implícito de מִלֵּא, isto é, a palavra ou promessa anteriormente proferida.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém a fórmula citativa que introduz, no versículo seguinte, o conteúdo da fala divina.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Linguagem antropomórfica da boca e da mão de Deus
  choice: Preservar “com sua boca” e “com sua mão”
  alternative: Simplificar como “prometeu” e “cumpriu”
  rationale: O hebraico estabelece um paralelismo teologicamente expressivo entre falar e agir. A tradução não deve apagar essa imagem nem resolver sua tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conserva a estrutura solene da bênção e o paralelismo hebraico, evitando uma formulação excessivamente literal apenas onde o objeto implícito precisa ser expresso para clareza.
