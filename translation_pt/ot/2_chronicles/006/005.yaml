  source_fidelity: A tradução preserva adequadamente a moldura temporal de מִן־הַיּוֹם אֲשֶׁר, o sentido causativo de הוֹצֵאתִי, as duas negações paralelas e a relação entre a escolha de uma cidade, a construção de uma casa e a permanência do nome de Deus ali. “Não escolhi nenhuma cidade dentre todas as tribos de Israel” comunica bem o alcance negativo-distributivo do hebraico.
