source:
  edition: WLC
  text: מִן הַ/יּ֗וֹם אֲשֶׁ֨ר הוֹצֵ֣אתִי אֶת עַמִּ/י֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ לֹא בָחַ֣רְתִּֽי בְ/עִ֗יר מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל לִ/בְנ֣וֹת בַּ֔יִת לִ/הְי֥וֹת שְׁמִ֖/י שָׁ֑ם וְ/לֹא בָחַ֣רְתִּֽי בְ/אִ֔ישׁ לִ/הְי֥וֹת נָגִ֖יד עַל עַמִּ֥/י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/005.yaml
  text: From the day that I brought my people out of the land of Egypt[a], I have not chosen a city from any of the tribes of Israel to build a house for my name to be there[c][b], nor have I chosen a man to be ruler over my people Israel.
translation:
  language: pt
  text: Desde o dia em que tirei o meu povo da terra do Egito[a], não escolhi nenhuma cidade dentre todas as tribos de Israel para construir uma casa[b], a fim de que o meu nome estivesse ali; nem escolhi homem algum para ser governante[c] sobre o meu povo Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “A partir do dia em que tirei o meu povo da terra do Egito”. A construção hebraica estabelece um ponto inicial no passado para as declarações seguintes.'
    reason: lexical_alternative
  - marker: b
    text: “Casa” refere-se ao templo; o hebraico, porém, diz literalmente “casa”.
    reason: lexical_alternative
  - marker: c
    text: Ou “líder” ou “príncipe”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַיּוֹם אֲשֶׁר
  choice: Desde o dia em que
  rationale: Marca um ponto inicial no passado com efeito que alcança o momento do discurso. A formulação é natural em português e mantém de perto a construção hebraica.
- source_word: הוֹצֵאתִי אֶת עַמִּי מֵאֶרֶץ מִצְרַיִם
  choice: tirei o meu povo da terra do Egito
  rationale: O hifil de יצא é causativo e se refere ao êxodo. “Tirei ... da” expressa com clareza e naturalidade o movimento para fora.
- source_word: לֹא בָחַרְתִּי בְעִיר מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: não escolhi nenhuma cidade dentre todas as tribos de Israel
  rationale: Sob negação, “nenhuma cidade” transmite adequadamente o valor distributivo. “Dentre todas as tribos” preserva a relação da cidade escolhida com o conjunto das tribos.
- source_word: לִבְנוֹת בַּיִת
  choice: para construir uma casa
  rationale: בַּיִת significa literalmente “casa”. Embora aqui designe o templo, conservar “casa” mantém a linguagem e a ressonância teológica do hebraico.
- source_word: לִהְיוֹת שְׁמִי שָׁם
  choice: a fim de que o meu nome estivesse ali
  rationale: Reproduz a ideia hebraica de o nome de Deus estar naquele lugar sem acrescentar o verbo interpretativo “habitar”.
- source_word: וְלֹא בָחַרְתִּי בְאִישׁ
  choice: nem escolhi homem algum
  rationale: Mantém o masculino singular אִישׁ, adequado ao referente histórico, e exprime naturalmente a segunda negação paralela.
- source_word: נָגִיד
  choice: governante
  rationale: Designa alguém colocado em posição de autoridade. “Governante” é claro, atual e evita tanto a amplitude de “líder” quanto possíveis conotações dinásticas de “príncipe”.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: sobre o meu povo Israel
  rationale: Preserva a relação de autoridade indicada por עַל e a designação pactual “meu povo Israel”.
theological_decisions:
- issue: Terminologia do santuário e linguagem da presença divina
  choice: “casa” e “a fim de que o meu nome estivesse ali”
  alternative: “templo, para que a minha presença habitasse ali”
  rationale: O texto usa o substantivo comum “casa” e fala do nome de Deus estar ali. A tradução evita identificar explicativamente o nome com a presença ou introduzir o verbo “habitar”, preservando as categorias e a tensão teológica do próprio texto.
- issue: Gênero de אִישׁ
  choice: “homem algum”
  alternative: “pessoa alguma” ou “ninguém”
  rationale: O hebraico emprega o masculino singular e, no contexto histórico, tem em vista um governante do sexo masculino. A forma masculina é, portanto, semanticamente pertinente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação destaca as duas negações paralelas. Conservam-se “casa”, “meu nome” e “homem” para evitar paráfrases teológicas ou neutralizações desnecessárias.
