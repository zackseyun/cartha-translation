source:
  edition: WLC
  text: וְ/אַתָּ֣ה תִּשְׁמַ֣ע הַ/שָּׁמַ֗יִם וְ/סָ֨לַחְתָּ֜ לְ/חַטַּ֤את עֲבָדֶ֨י/ךָ֙ וְ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל כִּ֥י תוֹרֵ֛/ם אֶל הַ/דֶּ֥רֶךְ הַ/טּוֹבָ֖ה אֲשֶׁ֣ר יֵֽלְכוּ בָ֑/הּ וְ/נָתַתָּ֤ה מָטָר֙ עַֽל אַרְצְ/ךָ֔ אֲשֶׁר נָתַ֥תָּה לְ/עַמְּ/ךָ֖ לְ/נַחֲלָֽה׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/027.yaml
  text: then may you hear in heaven and forgive the sin of your servants and of your people Israel[a], when you teach them the good way in which they should walk, and give rain on your land that you have given to your people as an inheritance.
translation:
  language: pt
  text: então, ouve dos céus[a] e perdoa o pecado dos teus servos e do teu povo Israel, quando[b] lhes ensinares o bom caminho em que devem andar; e dá chuva sobre a tua terra, que deste ao teu povo como herança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ouve no céu”. O hebraico diz literalmente “ouve os céus”, uma fórmula que, neste contexto, se refere a Deus ouvir desde sua morada celestial.
    reason: alternativa lexical e esclarecimento de idioma hebraico
  - marker: b
    text: Ou “porque lhes ensinas”.
    reason: ambiguidade sintática da conjunção כִּי
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: ouve no céu
  rationale: O hebraico traz literalmente algo como “ouve os céus”, uma construção incomum entendida no contexto como Deus ouvindo em sua morada celestial. “Ouve no céu” mantém a localização sugerida pela fórmula sem tornar o português obscuro; a alternativa “ouve do céu” consta em nota.
- source_word: וְסָלַחְתָּ לְחַטַּאת
  choice: e perdoa o pecado
  rationale: חַטָּאת designa aqui pecado ou culpa. A formulação direta preserva o caráter de súplica da oração.
- source_word: עֲבָדֶיךָ
  choice: teus servos
  rationale: Neste contexto de oração da aliança, עֶבֶד apresenta os israelitas como súditos e adoradores de Deus, sem enfatizar a condição social de escravidão.
- source_word: כִּי
  choice: quando
  rationale: A conjunção pode ser causal ou circunstancial. “Quando” expressa adequadamente a circunstância ligada ao perdão, à instrução e à restauração da chuva, sem eliminar a alternativa causal, registrada em nota.
- source_word: תוֹרֵם
  choice: lhes ensinares
  rationale: O hifil de ירה significa ensinar ou instruir. O futuro do subjuntivo é natural após “quando” e se ajusta à petição.
- source_word: אֶל הַדֶּרֶךְ הַטּוֹבָה
  choice: o bom caminho
  rationale: Conserva a imagem moral do caminho e a qualificação explícita “bom”, sem substituí-la interpretativamente por “certo”.
- source_word: אֲשֶׁר יֵלְכוּ בָהּ
  choice: em que devem andar
  rationale: Mantém a metáfora bíblica de andar como modo de viver e comunica a conduta esperada.
- source_word: וְנָתַתָּה מָטָר
  choice: e dá chuva
  rationale: נתן significa literalmente “dar”. A expressão é clara em português e preserva a forma da petição, sem recorrer ao mais idiomático, porém menos literal, “manda chuva”.
- source_word: עַל אַרְצְךָ
  choice: sobre a tua terra
  rationale: Mantém a preposição e o possessivo explícitos, apresentando a terra como pertencente a Deus.
- source_word: אֲשֶׁר נָתַתָּה לְעַמְּךָ לְנַחֲלָה
  choice: que deste ao teu povo como herança
  rationale: “Como herança” comunica de modo natural o sentido de נַחֲלָה como posse concedida ao povo.
theological_decisions:
- issue: Sequência da resposta divina na oração de Salomão
  choice: O versículo é formulado como uma súplica para que Deus ouça, perdoe, ensine e conceda chuva.
  alternative: 'Ler כִּי de modo estritamente causal: “porque lhes ensinas o bom caminho”.'
  rationale: A tradução “quando” preserva o fluxo circunstancial da petição, enquanto a nota mantém visível a possibilidade causal e evita transformar uma ambiguidade sintática em afirmação doutrinária inequívoca.
- issue: Localização ou origem do ouvir divino
  choice: “ouve no céu” apresenta o céu como o lugar em que Deus ouve.
  alternative: “ouve do céu” apresenta o céu como a origem de sua resposta.
  rationale: A construção hebraica é incomum e admite compreensão idiomática. O texto principal permanece mais próximo da forma recebida, e a nota registra a leitura portuguesa igualmente plausível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa singular coerentes com a oração dirigida diretamente a Deus. A pontuação separa a petição final por chuva sem romper a unidade do versículo.
