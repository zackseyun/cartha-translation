  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל דָּוִ֣יד אָבִ֔/י יַ֗עַן אֲשֶׁ֤ר הָיָה֙ עִם לְבָ֣בְ/ךָ֔ לִ/בְנ֥וֹת בַּ֖יִת לִ/שְׁמִ֑/י הֱֽטִיב֔וֹתָ כִּ֥י הָיָ֖ה עִם לְבָבֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/008.yaml
  text: But Yahweh said to David my father[a], ‘Because it was in your heart to build a house for my name[b], you did well that it was in your heart.’
translation:
  language: pt
  text: 'Mas Yahweh disse a Davi, meu pai: “Já que você teve no coração o propósito de construir uma casa[a] para o meu nome, fez bem em ter isso no coração[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um templo para o meu nome”. O hebraico diz literalmente “uma casa para o meu nome”.
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “você fez bem porque isso esteve em seu coração”.'
    reason: literal_rendering
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: É a forma narrativa comum de אמר e a expressão mais natural neste contexto.
- source_word: אָבִי
  choice: meu pai
  rationale: Mantém a referência filial direta feita por Salomão.
- source_word: יַעַן אֲשֶׁר
  choice: já que
  rationale: Introduz naturalmente em português a razão apresentada por Yahweh.
- source_word: הָיָה עִם לְבָבְךָ
  choice: você teve no coração o propósito
  rationale: Comunica a intenção interior expressa pelo idioma hebraico, preservando a imagem do coração.
- source_word: לִבְנוֹת בַּיִת לִשְׁמִי
  choice: construir uma casa para o meu nome
  rationale: Preserva tanto o sentido literal de בַּיִת, 'casa', quanto a expressão teologicamente significativa 'para o meu nome'.
- source_word: הֱטִיבוֹתָ
  choice: fez bem
  rationale: Expressa de modo direto e natural a aprovação indicada pelo hifil de יטב.
- source_word: כִּי הָיָה עִם לְבָבֶךָ
  choice: em ter isso no coração
  rationale: Mantém a repetição da imagem do coração e apresenta a intenção aprovada em português corrente.
theological_decisions:
- issue: Expressão do templo בַּיִת לִשְׁמִי
  choice: uma casa para o meu nome
  alternative: um templo para o meu nome
  rationale: O hebraico diz literalmente 'casa', e 'para o meu nome' associa o lugar ao nome de Deus sem sugerir que ele esteja contido no edifício. 'Templo' esclarece o referente, mas é mais interpretativo.
- issue: Repetição de הָיָה עִם לְבָבְךָ
  choice: teve no coração... ter isso no coração
  alternative: teve a intenção... fez bem em desejar isso
  rationale: A repetição deliberada do hebraico é preservada de modo compreensível, sem eliminar a imagem bíblica do coração.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por “você” torna natural a fala direta, enquanto “meu pai” e a expressão “para o meu nome” preservam o tom bíblico. Os marcadores [a] e [b] aparecem junto às expressões explicadas.
