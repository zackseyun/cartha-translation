review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a sequência condicional de כִּי, o pecado contra Deus, a universalidade do pecado, a ira, a entrega ao inimigo e o destino em terra distante ou próxima. Contudo, וְשָׁבוּם שׁוֹבֵיהֶם é expresso mais diretamente por «seus captores os levarem cativos», que mantém a relação possessiva e o sentido de captura/deportação do cognato hebraico.
  naturalness: O registro é moderno e claro. «Aqueles que os capturarem os levarem» é compreensível, mas é menos fluido e transforma desnecessariamente o particípio «seus captores» em uma oração relativa. Também se remove a vírgula após o travessão de fechamento, pois ela interrompe de modo pouco natural a coordenação condicional em português.
  terminology: «Ser humano» traduz naturalmente o uso genérico de אָדָם e mantém o alcance universal da afirmação, sem introduzir uma interpretação doutrinária. «Irado», «entregares» e «inimigo» são apropriados ao registro e ao sentido do texto.
  issues:
