  text: כִּ֣י יֶחֶטְאוּ לָ֗/ךְ כִּ֣י אֵ֤ין אָדָם֙ אֲשֶׁ֣ר לֹא יֶחֱטָ֔א וְ/אָנַפְתָּ֣ בָ֔/ם וּ/נְתַתָּ֖/ם לִ/פְנֵ֣י אוֹיֵ֑ב וְ/שָׁב֧וּ/ם שׁוֹבֵי/הֶ֛ם אֶל אֶ֥רֶץ רְחוֹקָ֖ה א֥וֹ קְרוֹבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/036.yaml
  text: When they sin against you—for there is no one who does not sin—and you are angry with them and give them over to an enemy[a], and their captors carry them away to a land far or near,
translation:
  language: pt
  text: Quando pecarem contra ti — pois não há ser humano que não peque — e ficares irado com eles e os entregares a um inimigo, e seus captores os levarem cativos para uma terra distante ou próxima,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: Quando pecarem contra ti
  rationale: O primeiro כִּי introduz uma circunstância condicional esperada no contexto da oração; “quando” expressa isso naturalmente. חטא com ל indica pecado cometido contra alguém.
- source_word: כִּי אֵין אָדָם אֲשֶׁר לֹא יֶחֱטָא
  choice: pois não há ser humano que não peque
  rationale: O segundo כִּי é causal. אָדָם tem sentido genérico e abrange a humanidade; “ser humano” preserva esse valor sem sugerir apenas o sexo masculino.
- source_word: וְאָנַפְתָּ בָם
  choice: e ficares irado com eles
  rationale: O verbo אנף expressa a ira de Deus. A forma “ficares irado” acompanha com naturalidade a sequência condicional iniciada por “quando”.
- source_word: וּנְתַתָּם לִפְנֵי אוֹיֵב
  choice: e os entregares a um inimigo
  rationale: נתן com לפני אויב significa pôr alguém sob o poder de um inimigo. O singular אוֹיֵב é adequadamente entendido como indefinido.
- source_word: וְשָׁבוּם שׁוֹבֵיהֶם
  choice: e aqueles que os capturarem os levarem
  rationale: A construção cognata combina o verbo שׁבה com o particípio “seus captores”. A formulação portuguesa comunica tanto a captura quanto a condução ao exílio, sem repetição artificial.
- source_word: אֶל אֶרֶץ רְחוֹקָה אוֹ קְרוֹבָה
  choice: para uma terra distante ou próxima
  rationale: Mantém diretamente o contraste espacial hebraico entre uma terra longínqua e uma terra próxima.
theological_decisions:
- issue: אָדָם genérico na afirmação sobre a universalidade do pecado humano
  choice: ser humano
  alternative: homem; alguém
  rationale: Aqui אָדָם não identifica um indivíduo masculino, mas qualquer integrante da humanidade. “Ser humano” conserva explicitamente a referência genérica e a afirmação universal, sem resolver ou atenuar sua força teológica.
- issue: Relação entre a ira divina e a entrega ao inimigo
  choice: e ficares irado com eles e os entregares
  alternative: e, por ficares irado com eles, os entregares
  rationale: A coordenação do hebraico é preservada, sem acrescentar uma relação causal explícita além da sequência textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Mantém-se a longa estrutura condicional do contexto e a coordenação hebraica, sem introduzir uma ideia de finalidade. O versículo termina com vírgula porque a oração prossegue no versículo seguinte.
