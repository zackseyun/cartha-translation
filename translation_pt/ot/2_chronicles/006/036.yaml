    issue: Representação de וְשָׁבוּם שׁוֹבֵיהֶם
    rationale: «Aqueles que os capturarem os levarem» é uma paráfrase aceitável, mas «seus captores os levarem cativos» reflete mais diretamente o particípio possessivo «seus captores» e a construção cognata de levar cativo.
  - severity: low
    issue: Pontuação após a oração parentética
    rationale: A vírgula imediatamente depois do travessão de fechamento não é necessária antes de «e ficares» e torna a longa cadeia condicional menos natural.
