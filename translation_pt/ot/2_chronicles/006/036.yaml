revisions:
- from: Quando pecarem contra ti — pois não há ser humano que não peque —, e ficares irado com eles e os entregares a um inimigo, e aqueles que os capturarem os levarem para uma terra distante ou próxima,
  to: Quando pecarem contra ti — pois não há ser humano que não peque — e ficares irado com eles e os entregares a um inimigo, e seus captores os levarem cativos para uma terra distante ou próxima,
  rationale: A revisão preserva integralmente a estrutura condicional e coordenada do hebraico, melhora a naturalidade da pontuação e restitui de modo mais próximo a referência a «seus captores», sem acrescentar causalidade, finalidade ou qualquer leitura teológica externa.
