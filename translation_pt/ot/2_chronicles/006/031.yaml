  text: לְמַ֣עַן יִֽירָא֗וּ/ךָ לָ/לֶ֨כֶת֙ בִּ/דְרָכֶ֔י/ךָ כָּל הַ֨/יָּמִ֔ים אֲשֶׁר הֵ֥ם חַיִּ֖ים עַל פְּנֵ֣י הָ/אֲדָמָ֑ה אֲשֶׁ֥ר נָתַ֖תָּה לַ/אֲבֹתֵֽי/נוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/031.yaml
  text: so that they may fear you and walk in your ways all the days that they live on the face of the land that you gave to our fathers[a][b].
translation:
  language: pt
  text: para que te temam[a] e andem nos teus caminhos todos os dias em que viverem sobre a face da terra que deste aos nossos pais[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “te reverenciem” ou “tenham reverente temor de ti”. Aqui, “temer” inclui reverência expressa pela obediência.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “enquanto viverem na terra que deste aos nossos pais”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: para que
  rationale: Introduz naturalmente em português a finalidade ou o resultado pretendido.
- source_word: יִירָאוּךָ
  choice: te temam
  rationale: Preserva a amplitude do verbo hebraico ירא, que neste contexto denota temor reverente diante de Deus, ligado à obediência.
- source_word: לָלֶכֶת בִּדְרָכֶיךָ
  choice: e andem nos teus caminhos
  rationale: Expressa em português corrente a relação estreita entre temer a Deus e viver segundo os seus caminhos, sem tornar a construção excessivamente explicativa.
- source_word: כָּל הַיָּמִים אֲשֶׁר הֵם חַיִּים
  choice: durante todos os dias em que viverem
  rationale: Mantém a imagem concreta de 'todos os dias' e comunica de modo natural a duração indicada pela oração relativa.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: sobre a face da terra
  rationale: Conserva a imagem hebraica da superfície da terra; o contexto e a oração seguinte delimitam a referência à terra dada aos antepassados.
- source_word: אֲשֶׁר נָתַתָּה לַאֲבֹתֵינוּ
  choice: que deste aos nossos pais
  rationale: Traduz diretamente a dádiva divina já realizada e preserva a referência pactual aos antepassados de Israel.
theological_decisions:
- issue: Sentido de ירא em relação à obediência pactual
  choice: te temam
  alternative: te reverenciem; tenham reverente temor de ti
  rationale: A tradução mantém a linguagem bíblica do temor de Deus, enquanto 'andem nos teus caminhos' mostra que se trata de reverência obediente, não apenas de terror.
- issue: Alcance de הָאֲדָמָה
  choice: a terra
  alternative: o solo; a terra inteira
  rationale: A cláusula que identifica essa terra como aquela dada aos antepassados aponta para a terra da aliança, embora o português 'terra' preserve a forma ampla do termo.
- issue: Relação sintática de לָלֶכֶת com יִירָאוּךָ
  choice: e andem
  alternative: andando; ao andarem
  rationale: A coordenação produz uma frase natural e digna em português e não força a ideia de que andar nos caminhos de Deus seja apenas o meio instrumental de temê-lo.
translation_notes:
  register: Português moderno, claro e solene, com formas de segunda pessoa singular coerentes com a oração dirigida a Deus. A expressão 'nossos pais' foi mantida por sua naturalidade bíblica e por sua referência aos antepassados de Israel.
