base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/035.yaml
  text: then hear from heaven their prayer and their plea for favor[a], and maintain their cause.
translation:
  language: pt
  text: então, ouve dos céus a oração e a súplica deles e defende a causa deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “faz justiça a eles” ou “executa o julgamento deles”. Literalmente, o hebraico diz: “faz o julgamento/a justiça deles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: então, ouve
  rationale: O perfeito qal de שׁמע tem força de pedido no contexto da oração. “Então” explicita naturalmente a ligação com a situação apresentada nos versículos anteriores.
- source_word: מִן הַשָּׁמַיִם
  choice: dos céus
  rationale: שׁמים tem forma plural e, em português bíblico corrente, “dos céus” é natural nesta fórmula de oração, sem definir de modo indevido a cosmologia do texto.
- source_word: תְּפִלָּתָם
  choice: a oração deles
  rationale: תפלה é o termo geral para oração; o singular com sufixo plural tem sentido coletivo.
- source_word: תְּחִנָּתָם
  choice: a súplica deles
  rationale: תחנה designa um apelo insistente por favor ou misericórdia. “Súplica” é conciso, digno e amplamente compreensível em português.
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: e defende a causa deles
  rationale: A expressão significa literalmente “faz/executa o julgamento ou a justiça deles”. No contexto judicial, “defende a causa deles” comunica que Deus age em favor do direito deles, preservando a dimensão forense.
theological_decisions:
- issue: A resposta judicial de Deus à oração
  choice: defende a causa deles
  alternative: faz justiça a eles; executa o julgamento deles
  rationale: מִשְׁפָּט pode indicar julgamento, justiça, direito ou causa judicial. A tradução mantém a ideia de intervenção judicial em favor do povo, sem decidir além do que o hebraico permite se a ênfase recai em vindicação, direito ou sentença.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Ouve” conserva a forma direta da oração; “súplica” evita uma paráfrase excessiva; a nota preserva a amplitude jurídica de מִשְׁפָּט.
