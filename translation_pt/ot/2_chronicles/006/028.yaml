source:
  edition: WLC
  text: רָעָ֞ב כִּֽי יִהְיֶ֣ה בָ/אָ֗רֶץ דֶּ֣בֶר כִּֽי יִֽ֠הְיֶה שִׁדָּפ֨וֹן וְ/יֵרָק֜וֹן אַרְבֶּ֤ה וְ/חָסִיל֙ כִּ֣י יִהְיֶ֔ה כִּ֧י יָֽצַר ל֛/וֹ אוֹיְבָ֖י/ו בְּ/אֶ֣רֶץ שְׁעָרָ֑י/ו כָּל נֶ֖גַע וְ/כָֽל מַחֲלָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/028.yaml
  text: If there is famine in the land[a], if there is plague, blight, mildew, locust, or caterpillar; if his enemies besiege him in the land of his gates[b]; whatever plague and whatever sickness there may be—
translation:
  language: pt
  text: Se houver fome na terra, se houver peste, crestamento ou ferrugem, gafanhotos ou insetos devoradores[a]; se os seus inimigos o sitiarem em suas cidades[b]; seja qual for a praga ou a doença—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico indica um inseto que devora plantações, mas não se sabe ao certo qual é a espécie; também pode designar um tipo de gafanhoto.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «na terra de seus portões». Os portões representam aqui as cidades ou povoações da terra.
    reason: cultural_note
lexical_decisions:
- source_word: רָעָב
  choice: fome
  rationale: No contexto de uma lista de calamidades que atingem a terra, indica fome generalizada, não mera sensação individual de fome.
- source_word: דֶּבֶר
  choice: peste
  rationale: Designa doença epidêmica grave; “peste” é corrente, conciso e adequado ao registro bíblico.
- source_word: שִׁדָּפוֹן
  choice: crestamento
  rationale: Refere-se à destruição das plantações, provavelmente por calor ou vento abrasador; “crestamento” mantém a imagem agrícola.
- source_word: יֵרָקוֹן
  choice: ferrugem
  rationale: Designa amarelamento ou palidez destrutiva das plantas; “ferrugem” é um termo agrícola tradicional e compreensível em português.
- source_word: אַרְבֶּה
  choice: gafanhotos
  rationale: Neste contexto, refere-se aos gafanhotos que devastam plantações em enxames.
- source_word: חָסִיל
  choice: insetos devoradores
  rationale: A identificação zoológica exata é incerta; uma expressão genérica conserva a função agrícola do termo sem afirmar uma espécie específica.
- source_word: כִּי יָצַר לוֹ אֹיְבָיו
  choice: se os inimigos do povo o cercarem
  rationale: O verbo expressa apertar, sitiar ou cercar. O pronome hebraico singular remete coletivamente ao povo/à terra; explicitar “do povo” evita uma referência obscura em português.
- source_word: בְּאֶרֶץ שְׁעָרָיו
  choice: em qualquer cidade da sua terra
  rationale: Literalmente, “na terra dos seus portões”; os portões representam metonimicamente as cidades, sobretudo as fortificadas. A tradução comunica esse sentido no corpo e registra a forma literal em nota.
- source_word: כָּל נֶגַע
  choice: seja qual for a praga
  rationale: נֶגַע abrange golpe, aflição ou praga; no paralelismo com doença e na lista de calamidades, “praga” é natural e suficientemente amplo.
- source_word: כָל מַחֲלָה
  choice: a doença
  rationale: מַחֲלָה designa doença ou enfermidade; a construção portuguesa “seja qual for a praga ou a doença” reproduz a abrangência distributiva do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A sequência condicional e o travessão final foram mantidos porque o versículo continua sintaticamente no seguinte. Termos agrícolas foram traduzidos de modo reconhecível, e ambiguidades zoológicas e culturais relevantes foram preservadas em notas.
