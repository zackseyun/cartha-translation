  text: וְ/שָׁמַעְתָּ֨ מִן הַ/שָּׁמַ֜יִם מִ/מְּכ֣וֹן שִׁבְתְּ/ךָ֗ אֶת תְּפִלָּתָ/ם֙ וְ/אֶת תְּחִנֹּ֣תֵי/הֶ֔ם וְ/עָשִׂ֖יתָ מִשְׁפָּטָ֑/ם וְ/סָלַחְתָּ֥ לְ/עַמְּ/ךָ֖ אֲשֶׁ֥ר חָֽטְאוּ לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/039.yaml
  text: then hear from heaven[a], from the place where you dwell, their prayer and their pleas, and maintain their cause, and forgive your people who have sinned against you.
translation:
  language: pt
  text: então ouve dos céus, do lugar onde habitas, a oração e as súplicas deles; defende a causa deles[a] e perdoa ao teu povo, que pecou contra ti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “faz justiça a eles” ou “julga a causa deles”. O hebraico diz literalmente “faz o julgamento/a causa deles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: então ouve
  rationale: O perfeito qal de segunda pessoa masculina singular ocorre numa oração e tem força de pedido dirigido a Deus. “Então” retoma naturalmente a situação condicional descrita nos versículos anteriores.
- source_word: מִן הַשָּׁמַיִם
  choice: dos céus
  rationale: Preserva o plural formal do hebraico e corresponde a uma expressão bíblica natural em português.
- source_word: מִמְּכוֹן שִׁבְתְּךָ
  choice: do lugar onde habitas
  rationale: Expressa com clareza tanto o sentido locativo de מָכוֹן quanto a ideia de habitação presente em שִׁבְתְּךָ, sem recorrer a formulação arcaica.
- source_word: תְּפִלָּתָם
  choice: a oração deles
  rationale: Mantém o singular coletivo do hebraico e emprega o equivalente português habitual de תְּפִלָּה.
- source_word: תְּחִנֹּתֵיהֶם
  choice: as súplicas deles
  rationale: Distingue os apelos insistentes por favor ou misericórdia da oração mencionada anteriormente, em linguagem digna e amplamente compreensível.
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: defende a causa deles
  rationale: Comunica o caráter judicial da expressão hebraica, literalmente “faz o julgamento/a causa deles”, como ação justa de Deus em favor dos suplicantes. A nota registra alternativas mais formais.
- source_word: וְסָלַחְתָּ
  choice: e perdoa
  rationale: Equivalente direto e natural de סלח no contexto do perdão concedido por Deus.
- source_word: לְעַמְּךָ
  choice: ao teu povo
  rationale: O complemento introduzido por לְ é expresso naturalmente em português com “perdoar a alguém”; a contração “ao” mantém clareza e fluidez.
- source_word: אֲשֶׁר חָטְאוּ לָךְ
  choice: que pecou contra ti
  rationale: O coletivo singular “povo” favorece “pecou” em português, enquanto “contra ti” expressa a direção da ofensa indicada por לְ.
theological_decisions:
- issue: Linguagem judicial em וְעָשִׂיתָ מִשְׁפָּטָם
  choice: defende a causa deles
  alternative: faz justiça a eles; julga a causa deles
  rationale: A tradução preserva a dimensão forense e a ação favorável pedida a Deus, sem transformar a frase em condenação dos suplicantes nem eliminar a ambiguidade do idioma hebraico; as alternativas são registradas em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas de segunda pessoa singular coerentes na oração dirigida a Deus. “Dos céus” preserva o plural hebraico; “súplicas” mantém a distinção lexical em relação a “oração”. O marcador [a] foi colocado imediatamente após a expressão judicial que a nota esclarece.
