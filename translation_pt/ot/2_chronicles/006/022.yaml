  text: אִם יֶחֱטָ֥א אִישׁ֙ לְ/רֵעֵ֔/הוּ וְ/נָֽשָׁא ב֥/וֹ אָלָ֖ה לְ/הַֽאֲלֹת֑/וֹ וּ/בָ֗א אָלָ֛ה לִ/פְנֵ֥י מִֽזְבַּחֲ/ךָ֖ בַּ/בַּ֥יִת הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/022.yaml
  text: If a man sins against his neighbor[a], and an oath is laid on him to make him swear, and he comes and the oath is before your altar in this house,
translation:
  language: pt
  text: Se um homem pecar contra o seu próximo, e lhe for imposto um juramento[a], para fazê-lo jurar, e ele vier prestar o juramento diante do teu altar, nesta casa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «um juramento acompanhado de maldição lhe for imposto» ou «ele for submetido a um juramento imprecatório». O termo hebraico pode designar um juramento que invoca uma maldição caso seja violado.'
    reason: Preserva a nuance sancionatória de אָלָה sem obscurecer, no texto principal, o contexto judicial de juramento.
lexical_decisions:
- source_word: אִם יֶחֱטָא אִישׁ
  choice: Se um homem pecar
  rationale: Mantém a condição, o singular masculino representativo e a força moral e religiosa de חטא.
- source_word: לְרֵעֵהוּ
  choice: contra o seu próximo
  rationale: “Próximo” expressa naturalmente a relação social e interpessoal indicada por רֵעַ.
- source_word: וְנָשָׁא בוֹ אָלָה
  choice: e lhe for imposto um juramento
  rationale: Reproduz a ideia judicial de impor à pessoa a obrigação de um juramento, sem reduzir אָלָה a uma simples maldição.
- source_word: לְהַאֲלֹתוֹ
  choice: para fazê-lo jurar
  rationale: Preserva separadamente o sentido causativo do infinitivo hifil, em vez de absorvê-lo na construção anterior.
- source_word: וּבָא אָלָה לִפְנֵי מִזְבַּחֲךָ
  choice: e ele vier prestar o juramento diante do teu altar
  rationale: Em português, “prestar o juramento diante do altar” comunica de modo natural que a pessoa comparece e profere o juramento ali; evita a formulação pouco clara de que o juramento, abstratamente, vem ao altar.
- source_word: בַּבַּיִת הַזֶּה
  choice: nesta casa
  rationale: Mantém o sentido literal e teologicamente significativo de בַּיִת no contexto do templo.
theological_decisions:
- issue: Sentido judicial de אָלָה
  choice: juramento no texto principal
  alternative: juramento acompanhado de maldição; juramento imprecatório
  rationale: No contexto judicial, אָלָה designa um juramento cuja falsidade acarreta uma maldição. “Juramento” preserva o procedimento, enquanto a nota retém a sanção imprecatória.
- issue: Relação entre a chegada da pessoa e a presença do juramento diante do altar
  choice: “ele vier prestar o juramento diante do teu altar”
  alternative: “ele vier, e o juramento estiver diante do teu altar”
  rationale: A formulação escolhida torna inteligível em português a construção hebraica concisa, sem alterar o cenário judicial e cultual; a alternativa mais formal conserva melhor a sintaxe, mas soa obscura.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento divino na segunda pessoa do singular (“teu”), coerente com a oração de Salomão. A nota [a] deve ser ligada à expressão “um juramento” na publicação.
