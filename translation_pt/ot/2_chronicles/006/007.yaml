base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/007.yaml
  text: It was in the heart of David my father to build a house for the name of Yahweh[b][a], the God of Israel.
translation:
  language: pt
  text: Davi, meu pai, tinha no coração construir uma casa para o nome de Yahweh[a], o Deus de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “uma casa para o nome de Yahweh” refere-se ao templo como o lugar associado ao nome de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עִם לְבַב
  choice: tinha no coração
  rationale: A construção hebraica expressa uma intenção presente no íntimo de Davi. A formulação portuguesa é natural e preserva a imagem antropológica do coração.
- source_word: דָּוִיד אָבִי
  choice: Davi, meu pai
  rationale: Mantém a ordem hebraica e usa vírgulas para indicar com clareza o aposto em português.
- source_word: לִבְנוֹת
  choice: construir
  rationale: Equivalente corrente e direto do infinitivo de בנה neste contexto.
- source_word: בַּיִת
  choice: uma casa
  rationale: Preserva o termo concreto hebraico e a expressão canônica referente ao templo, sem substituir o vocábulo por uma interpretação explícita.
- source_word: לְשֵׁם
  choice: para o nome de
  rationale: Conserva a fórmula teologicamente significativa que associa a casa ao nome divino, em vez de parafraseá-la como honra ou fama.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução natural da construção hebraica e forma consagrada em português.
theological_decisions:
- issue: Sentido da expressão בַּיִת לְשֵׁם יְהוָה
  choice: uma casa para o nome de Yahweh
  alternative: um templo para Yahweh; uma casa para a honra de Yahweh
  rationale: A tradução mantém tanto “casa” quanto “nome”, preservando a linguagem própria de Crônicas sobre o templo e a relação entre o santuário e o nome de Deus, sem reduzir essa tensão a uma simples designação institucional.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Tinha no coração” comunica naturalmente a intenção de Davi; a formulação mais literal e teologicamente carregada “uma casa para o nome de Yahweh” foi preservada e esclarecida em nota.
