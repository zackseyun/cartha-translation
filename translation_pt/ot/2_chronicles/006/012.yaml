  text: וַֽ/יַּעֲמֹ֗ד לִ/פְנֵי֙ מִזְבַּ֣ח יְהוָ֔ה נֶ֖גֶד כָּל קְהַ֣ל יִשְׂרָאֵ֑ל וַ/יִּפְרֹ֖שׂ כַּפָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/012.yaml
  text: Then he stood before the altar of Yahweh in front of all the assembly of Israel and spread out his hands[a][b].
translation:
  language: pt
  text: Então ele se pôs de pé diante do altar de Yahweh, perante toda a assembleia de Israel, e estendeu as mãos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “estendeu as suas palmas”; a expressão descreve o gesto de estender as mãos em oração.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: Então ele se pôs de pé
  rationale: O wayyiqtol faz avançar a narrativa; «então» expressa a sequência, e «pôs-se de pé» comunica naturalmente a ação de עמד.
- source_word: לִפְנֵי מִזְבַּח יְהוָה
  choice: diante do altar de Yahweh
  rationale: לִפְנֵי indica a posição espacial diante do altar; o construto מִזְבַּח יְהוָה é traduzido de modo transparente, preservando Yahweh como nome divino.
- source_word: נֶגֶד כָּל קְהַל יִשְׂרָאֵל
  choice: perante toda a assembleia de Israel
  rationale: נֶגֶד situa Salomão em relação ao povo reunido. «Perante» evita repetir «diante» e mantém a ideia de estar à frente ou à vista de toda a assembleia.
- source_word: וַיִּפְרֹשׂ כַּפָּיו
  choice: e estendeu as mãos
  rationale: Embora כַּפָּיו designe literalmente as palmas, a combinação com פרש descreve o gesto de estender ou abrir as mãos, especialmente em oração. A formulação escolhida é natural e preserva a imagem essencial.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico traz o Tetragrama como nome próprio. «Yahweh» o preserva por transliteração, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. «Assembleia» conserva o sentido corporativo de קהל sem recorrer a terminologia denominacional; «perante» mantém a distinção estilística entre לִפְנֵי e נֶגֶד.
