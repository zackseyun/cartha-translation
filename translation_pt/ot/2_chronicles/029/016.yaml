base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/016.yaml
  text: Then the priests went into the inner part of the house of the LORD to cleanse it, and they brought out to the court of the house of the LORD all the uncleanness that they found in the temple of the LORD. Then the Levites received it to carry it outside to the Kidron Valley.
translation:
  language: pt
  text: Então os sacerdotes entraram na parte interna da Casa do SENHOR para purificá-la. Levaram para o pátio da Casa do SENHOR toda a impureza que encontraram no templo do SENHOR, e os levitas a receberam para levá-la para fora, ao vale do Cedrom.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִפְנִימָה בֵית יְהוָה
  choice: na parte mais interior da Casa do SENHOR
  rationale: Expressa o movimento para o interior do edifício sem especificar indevidamente uma divisão arquitetônica concreta. 'Casa' preserva a repetição e a distinção lexical em relação a הֵיכָל.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida para o tetragrama, em conformidade com a camada de consulta auditada.
- source_word: כָּל הַטֻּמְאָה
  choice: toda a impureza
  rationale: Preserva o sentido cultual abrangente de טֻמְאָה sem restringi-lo a objetos ou sujeira comum.
- source_word: הֵיכַל יְהוָה
  choice: templo do SENHOR
  rationale: Distingue הֵיכָל de בֵית neste versículo e oferece uma expressão natural em português.
- source_word: וַיְקַבְּלוּ
  choice: a receberam
  rationale: Mantém a imagem dos levitas recebendo dos sacerdotes aquilo que havia sido retirado, com o referente singular coletivo 'impureza'.
- source_word: לְנַחַל קִדְרוֹן חוּצָה
  choice: para fora, até o vale do Cedrom
  rationale: Representa חוּצָה como movimento para fora e נַחַל קִדְרוֹן pela designação geográfica tradicional e inteligível; 'até' torna natural o destino em português.
theological_decisions:
- issue: Natureza da 'impureza' retirada do templo
  choice: Manter o termo abrangente 'impureza'
  alternative: Explicitar como objetos impuros, imundície ou idolatria
  rationale: O hebraico não identifica aqui a natureza exata do que foi encontrado; a tradução preserva essa abertura sem impor uma interpretação cultual específica.
translation_notes:
  register: Português moderno, digno e acessível, com fluidez brasileira e compreensão internacional. Mantém a repetição enfática de 'Casa do SENHOR' e 'templo do SENHOR', evitando arcaísmos e explicitações não presentes no hebraico.
