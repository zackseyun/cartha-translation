base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/022.yaml
  text: Then they slaughtered the cattle[a], and the priests received the blood and splashed it against the altar. They slaughtered the rams and splashed the blood against the altar[b]. They slaughtered the lambs and splashed the blood against the altar.
translation:
  language: pt
  text: Então abateram o gado[a]. Os sacerdotes receberam o sangue e o lançaram contra o altar[b]. Depois abateram os carneiros e lançaram o sangue contra o altar. Também abateram os cordeiros e lançaram o sangue contra o altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico é coletivo e designa animais bovinos; pelo contexto sacrificial, algumas traduções dizem “touros”.
    reason: lexical_alternative
  - marker: b
    text: Também se pode traduzir “espargiram o sangue sobre o altar” ou “arremessaram o sangue contra o altar”. O verbo hebraico indica uma aplicação ritual vigorosa do sangue, não uma aspersão leve.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: abateram
  rationale: No contexto sacrificial, שׁחט indica o abate ritual. “Abateram” é natural em português e mais específico do que simplesmente “mataram”.
- source_word: הַבָּקָר
  choice: o gado
  rationale: בקר é um termo coletivo para animais bovinos. “O gado” preserva esse valor coletivo sem especificar que eram todos machos.
- source_word: וַיְקַבְּלוּ
  choice: receberam
  rationale: קבל significa literalmente “receber”; aqui descreve os sacerdotes recebendo o sangue para sua aplicação ritual.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Equivalente português corrente e preciso para כהנים.
- source_word: הַדָּם
  choice: o sangue
  rationale: Correspondência direta e natural para דם no contexto sacrificial.
- source_word: וַיִּזְרְקוּ
  choice: lançaram
  rationale: זרק descreve uma aplicação ritual vigorosa do sangue por lançamento, não uma aspersão leve. “Lançaram” preserva a força do verbo e funciona naturalmente com “contra o altar”.
- source_word: הַמִּזְבֵּחָה
  choice: contra o altar
  rationale: A forma direcional hebraica indica movimento em direção ao altar; no rito, o sangue era aplicado à sua superfície. “Contra o altar” comunica tanto a direção quanto o contato.
- source_word: הָאֵלִים
  choice: os carneiros
  rationale: אילים designa especificamente carneiros.
- source_word: הַכְּבָשִׂים
  choice: os cordeiros
  rationale: כבשים costuma designar cordeiros ou ovinos jovens em listas de sacrifícios; “cordeiros” é adequado ao contexto.
