base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/030.yaml
  text: Then Hezekiah the king and the officials told the Levites to praise Yahweh with the words of David and of Asaph the seer[a]. So they praised with gladness[b], and they bowed down and worshiped.
translation:
  language: pt
  text: Então o rei Ezequias e os líderes disseram aos levitas que louvassem a Yahweh com as palavras de Davi e de Asafe, o vidente[a]. Eles louvaram com alegria[b], inclinaram-se e adoraram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “segundo as palavras de Davi e de Asafe, o vidente”.'
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “até a alegria” ou “para a alegria”; o sentido parece ser que louvaram com regozijo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disseram ... que louvassem
  rationale: Embora o verbo signifique literalmente “disse”, a construção com infinitivo comunica uma instrução. Esta formulação é natural em português e não intensifica indevidamente o sentido como faria “ordenaram”.
- source_word: הַמֶּלֶךְ וְהַשָּׂרִים
  choice: o rei ... e os líderes
  rationale: שָׂרִים designa autoridades ou dirigentes. “Líderes” é claro, atual e adequado ao contexto, sem sugerir necessariamente príncipes de sangue real.
- source_word: לְהַלֵּל
  choice: que louvassem
  rationale: No contexto litúrgico, הלל expressa louvor. O subjuntivo integra naturalmente a instrução introduzida por “disseram aos levitas”.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Reproduz o nome divino יהוה como nome próprio, em vez de substituí-lo por um título.
- source_word: בְּדִבְרֵי דָוִיד וְאָסָף הַחֹזֶה
  choice: com as palavras de Davi e de Asafe, o vidente
  rationale: “Palavras” preserva o sentido direto de דִּבְרֵי sem restringi-lo interpretativamente a “cânticos”. “Vidente” mantém o título profético חֹזֶה. A preposição בְּ também pode indicar conformidade, possibilidade registrada em nota.
- source_word: וַיְהַלְלוּ
  choice: louvaram
  rationale: Mantém a correspondência lexical com לְהַלֵּל e não acrescenta explicitamente a ideia de cantar.
- source_word: עַד לְשִׂמְחָה
  choice: com alegria
  rationale: A expressão hebraica é incomum, literalmente próxima de “até a alegria”. “Com alegria” comunica de modo natural que o louvor foi marcado por regozijo, enquanto a forma literal é preservada em nota.
- source_word: וַיִּקְּדוּ
  choice: inclinaram-se
  rationale: O verbo descreve o ato corporal de curvar-se ou inclinar-se em reverência.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: adoraram
  rationale: No contexto cúltico, o verbo denota prostração reverente e adoração. Como o verbo anterior já descreve o gesto corporal, “adoraram” preserva a distinção entre as duas ações.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o Tetragrama. “Yahweh” conserva o nome pactual como nome próprio, sem substituí-lo por um título.
- issue: Relação entre os dois verbos finais
  choice: 'duas ações coordenadas: “inclinaram-se e adoraram”'
  alternative: uma expressão combinada, como “inclinaram-se em adoração”
  rationale: O hebraico emprega dois verbos distintos. A tradução mantém ambos sem fundi-los, preservando tanto o gesto de reverência quanto o ato de adoração.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A formulação evita arcaísmos e preserva a ambiguidade da preposição בְּ e da expressão incomum עַד לְשִׂמְחָה por meio de notas.
