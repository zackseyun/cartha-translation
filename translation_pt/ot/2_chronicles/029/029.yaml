base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/029.yaml
  text: And when they had finished offering[b][a], the king and all who were present with him knelt down and worshiped.
translation:
  language: pt
  text: Quando terminaram de oferecer[a], o rei e todos os que estavam com ele se ajoelharam e adoraram[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “fazer subir”. Neste contexto sacrificial, a expressão se refere à apresentação da oferta queimada.
    reason: lexical_alternative
  - marker: b
    text: Ou “prostraram-se” ou “curvaram-se”. O verbo hebraico pode designar o ato físico de se inclinar em reverência; neste contexto de culto no templo, foi traduzido como “adoraram”.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/כְ/כַלּוֹת
  choice: Quando terminaram
  rationale: A conjunção com a preposição e o infinitivo construto de כלה forma uma oração temporal. A tradução expressa com naturalidade a conclusão da ação e a sequência dos acontecimentos.
- source_word: לְ/הַעֲל֑וֹת
  choice: de oferecer
  rationale: O infinitivo hifil de עלה significa literalmente “fazer subir”, mas, neste contexto sacrificial, designa o ato de apresentar a oferta queimada. Como o objeto permanece implícito no hebraico e é conhecido pelo contexto imediato, “oferecer” preserva essa concisão sem inserir no texto um substantivo ausente.
- source_word: כָּרְעוּ
  choice: se ajoelharam
  rationale: כרע indica dobrar os joelhos ou ajoelhar-se. Esta formulação moderna e clara distingue a postura física da ação reverente expressa pelo verbo seguinte.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Tradução direta do substantivo definido.
- source_word: וְכָל הַנִּמְצְאִים אִתּוֹ
  choice: e todos os que estavam com ele
  rationale: O particípio nifal de מצא refere-se idiomaticamente aos que se encontravam presentes. A formulação escolhida é natural em português e não acrescenta uma função específica ao grupo.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: e adoraram
  rationale: A forma de שחה pode indicar prostrar-se em reverência ou prestar adoração. No contexto do templo e do sacrifício, “adoraram” comunica o sentido religioso, enquanto “se ajoelharam” já registra a postura corporal.
theological_decisions:
- issue: Sentido de שחה no contexto do culto no templo
  choice: adoraram
  alternative: prostraram-se / curvaram-se
  rationale: 'O contexto é explicitamente litúrgico: o rei e os presentes respondem à conclusão da oferta. “Adoraram” comunica a finalidade religiosa do gesto sem negar sua dimensão física, registrada em nota e também sugerida pelo verbo anterior. Assim, os dois verbos não são reduzidos a movimentos corporais quase sinônimos.'
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A redação mantém implícito o objeto de “oferecer”, como no hebraico, e preserva a distinção entre ajoelhar-se e adorar.
