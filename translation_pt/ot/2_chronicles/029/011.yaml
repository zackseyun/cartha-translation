  text: בָּנַ֕/י עַתָּ֖ה אַל תִּשָּׁל֑וּ כִּֽי בָ/כֶ֞ם בָּחַ֣ר יְהוָ֗ה לַ/עֲמֹ֤ד לְ/פָנָי/ו֙ לְ/שָׁ֣רְת֔/וֹ וְ/לִ/הְי֥וֹת ל֖/וֹ מְשָׁרְתִ֥ים וּ/מַקְטִרִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/011.yaml
  text: My sons[a], do not be negligent now, for Yahweh has chosen you to stand before him, to minister to him[d][c][b], and to be his ministers and burners of incense.
translation:
  language: pt
  text: Meus filhos, não sejam negligentes agora, pois Yahweh escolheu vocês para estarem diante dele[b], para o servir e para serem seus ministros e oferecerem incenso[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “Estar diante dele” é uma expressão sacerdotal para servir na presença de Deus.
    reason: cultural_note
  - marker: c
    text: 'Ou: “para serem seus ministros e os que oferecem incenso”. O verbo hebraico se refere a fazer uma oferta subir em fumaça; neste contexto, trata-se de incenso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנַי
  choice: Meus filhos
  rationale: Vocativo masculino plural com sufixo de primeira pessoa; corresponde ao grupo de sacerdotes e levitas interpelado no contexto e preserva o tom paternal.
- source_word: עַתָּה אַל תִּשָּׁלוּ
  choice: agora não sejam negligentes
  rationale: Mantém o advérbio temporal e expressa, em português atual, a advertência contra a negligência ou falta de zelo no cumprimento do dever.
- source_word: בָכֶם בָּחַר יְהוָה
  choice: Yahweh escolheu vocês
  rationale: A construção destaca os destinatários como objeto da escolha. O pretérito perfeito é natural em português e comunica o ato de escolha com relevância presente.
- source_word: לַעֲמֹד לְפָנָיו
  choice: para estarem diante dele
  rationale: Preserva a imagem hebraica de comparecer ou tomar posição na presença divina, usada aqui em sentido sacerdotal.
- source_word: לְשָׁרְתוֹ
  choice: para o servirem
  rationale: O verbo denota serviço ministerial, especialmente em contexto cultual. A formulação portuguesa é clara, digna e evita a repetição pouco natural de 'ministrar/ministros'.
- source_word: וְלִהְיוֹת לוֹ מְשָׁרְתִים וּמַקְטִרִים
  choice: para serem seus ministros e oferecerem incenso
  rationale: Comunica as duas funções coordenadas. 'Oferecer incenso' é a expressão portuguesa natural para o ato cultual indicado pelo particípio מַקְטִרִים, sem recorrer ao pouco idiomático 'queimadores de incenso'.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome divino pessoal. A transliteração 'Yahweh' o distingue de um título e segue a política indicada para esta tradução.
- issue: Sentido sacerdotal de לַעֲמֹד לְפָנָיו
  choice: estarem diante dele, com nota explicativa
  alternative: servirem na presença dele
  rationale: A tradução mantém a expressão concreta do hebraico, enquanto a nota esclarece seu valor sacerdotal sem substituir a imagem por uma interpretação.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas de tratamento naturais para leitores brasileiros. A ordem da exortação e a imagem de estar diante de Deus foram preservadas; a última coordenação foi formulada idiomaticamente para evitar o artificial “queimadores de incenso”.
