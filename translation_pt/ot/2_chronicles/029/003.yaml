source:
  edition: WLC
  text: ה֣וּא בַ/שָּׁנָה֩ הָ/רִאשׁוֹנָ֨ה לְ/מָלְכ֜/וֹ בַּ/חֹ֣דֶשׁ הָ/רִאשׁ֗וֹן פָּתַ֛ח אֶת דַּלְת֥וֹת בֵּית יְהוָ֖ה וַֽ/יְחַזְּקֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/003.yaml
  text: In the first year of his reign[a], in the first month, he opened the doors of the house of Yahweh and repaired them.
translation:
  language: pt
  text: No primeiro ano do seu reinado, no primeiro mês, ele abriu as portas da casa de Yahweh e as reparou.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «as fortaleceu», isto é, tornou as portas novamente firmes e seguras.
    reason: alternativa lexical
lexical_decisions:
- source_word: הוּא
  choice: ele
  rationale: O pronome independente retoma com clareza o sujeito da narrativa; «ele» é natural em português e preserva sua presença explícita no hebraico.
- source_word: בַשָּׁנָה הָרִאשׁוֹנָה לְמָלְכוֹ
  choice: No primeiro ano do seu reinado
  rationale: A expressão temporal indica de modo idiomático o primeiro ano em que ele reinou; «do seu reinado» é claro e corrente.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: no primeiro mês
  rationale: Tradução direta da indicação temporal, sem especificar além do que consta no texto.
- source_word: פָּתַח
  choice: abriu
  rationale: É o sentido simples e contextual do verbo quando tem por objeto as portas do templo.
- source_word: דַּלְתוֹת
  choice: as portas
  rationale: O termo designa portas ou folhas de porta; «portas» é a forma mais natural e exata neste contexto.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Mantém a metáfora hebraica «casa», compreensível como referência ao templo, e translitera o nome divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיְחַזְּקֵם
  choice: e as reparou
  rationale: Embora o piel de חזק signifique literalmente fortalecer ou tornar firme, aplicado às portas no contexto da restauração do templo indica fazê-las novamente sólidas e funcionais; «reparou» comunica isso com naturalidade, e a alternativa literal é preservada em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto traz diretamente o Tetragrama. «Yahweh» preserva sua função como nome pessoal e evita substituí-lo silenciosamente por um título.
- issue: Amplitude semântica de וַיְחַזְּקֵם
  choice: as reparou
  alternative: as fortaleceu
  rationale: O contexto favorece uma ação prática de restauração, mas o sentido lexical de fortalecimento permanece possível; por isso, a tradução idiomática aparece no texto e a forma mais literal, na nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade no Brasil e compreensão internacional. A ordem temporal do hebraico foi preservada sem produzir uma frase artificial; «casa de Yahweh» mantém a expressão fonte em vez de explicá-la como «templo».
