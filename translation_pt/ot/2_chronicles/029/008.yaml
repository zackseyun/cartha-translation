base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/008.yaml
  text: So the wrath of Yahweh came upon Judah and Jerusalem[a], and he made them a horror, a desolation, and an object of hissing[b], as you see with your own eyes.
translation:
  language: pt
  text: Por isso, a ira de Yahweh veio sobre Judá e Jerusalém, e ele os tornou um horror[a], uma desolação e motivo de assobios de desprezo[b], como vocês veem com os próprios olhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “causa de tremor”; o termo hebraico indica algo que provoca estremecimento ou horror.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “assobio”; refere-se à reação de desprezo ou escárnio dos que contemplam a devastação.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶצֶף
  choice: ira
  rationale: Expressa a intensidade da reação divina em contexto de juízo, com mais força que “raiva” e de modo natural e digno em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, distinguindo-o do título “Senhor” e seguindo a opção do projeto.
- source_word: וַיְהִי ... עַל
  choice: veio sobre
  rationale: Reproduz de modo idiomático o início e a incidência da ira sobre Judá e Jerusalém.
- source_word: וַיִּתְּנֵם
  choice: fez deles
  rationale: Neste uso de נתן seguido de ל, indica que Judá e Jerusalém foram postos numa condição publicamente reconhecível; “fez deles” comunica esse resultado sem acrescentar uma explicação causal.
- source_word: לְזוֹעָה
  choice: motivo de horror
  rationale: O substantivo raro evoca tremor ou horror; a formulação mostra que Judá e Jerusalém se tornaram um espetáculo que provocava essa reação.
- source_word: לְשַׁמָּה
  choice: desolação
  rationale: Preserva o termo tradicional de juízo, que abrange ruína devastadora e o espanto que ela provoca, sem restringir indevidamente a imagem.
- source_word: וְלִשְׁרֵקָה
  choice: alvo de assobios de desprezo
  rationale: Mantém a imagem concreta dos assobios e explicita sua função contextual de escárnio, evitando que o leitor moderno os entenda como sinal de aprovação.
- source_word: כַּאֲשֶׁר אַתֶּם רֹאִים בְּעֵינֵיכֶם
  choice: como vocês veem com os próprios olhos
  rationale: Conserva a ênfase do apelo à evidência visível e presente, em português natural.
theological_decisions:
- issue: Linguagem do juízo divino
  choice: a ira de Yahweh veio sobre Judá e Jerusalém
  alternative: Yahweh ficou irado com Judá e Jerusalém
  rationale: A escolha mantém a apresentação direta e severa do juízo divino e preserva a imagem hebraica da ira que sobrevém, sem atenuação nem comentário doutrinário.
- issue: Agência divina na condição de Judá e Jerusalém
  choice: ele fez deles motivo de horror e de desolação, e alvo de assobios de desprezo
  alternative: ele os entregou ao horror, à desolação e ao desprezo
  rationale: Preserva a agência explícita de Yahweh e o sentido resultativo da construção, sem decidir além do texto como essa ação se relaciona com agentes históricos secundários.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para legibilidade brasileira e compreensão internacional ampla. A coordenação foi ajustada para soar natural, preservando os três resultados paralelos do hebraico. Os marcadores foram posicionados junto aos termos que efetivamente explicam.
