  text: וַ֠/יָּחֵלּוּ בְּ/אֶחָ֞ד לַ/חֹ֣דֶשׁ הָ/רִאשׁוֹן֮ לְ/קַדֵּשׁ֒ וּ/בְ/י֧וֹם שְׁמוֹנָ֣ה לַ/חֹ֗דֶשׁ בָּ֚אוּ לְ/אוּלָ֣ם יְהוָ֔ה וַ/יְקַדְּשׁ֥וּ אֶת בֵּית יְהוָ֖ה לְ/יָמִ֣ים שְׁמוֹנָ֑ה וּ/בְ/י֨וֹם שִׁשָּׁ֥ה עָשָׂ֛ר לַ/חֹ֥דֶשׁ הָ/רִאשׁ֖וֹן כִּלּֽוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/017.yaml
  text: They began to consecrate on the first day of the first month[a], and on the eighth day of the month they came to the vestibule of Yahweh. Then they consecrated the house of Yahweh in eight days, and on the sixteenth day of the first month they finished.
translation:
  language: pt
  text: Começaram a consagrar no primeiro dia do primeiro mês e, no oitavo dia do mês, chegaram ao pórtico de Yahweh.[a] Consagraram a casa de Yahweh em oito dias e terminaram no décimo sexto dia do primeiro mês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vestíbulo” ou “alpendre”.
    reason: Registra alternativas arquitetônicas legítimas para אוּלָם sem impor precisão além da evidência lexical.
lexical_decisions:
- source_word: וַיָּחֵלּוּ לְקַדֵּשׁ
  choice: Começaram a consagrar
  rationale: Reproduz diretamente o início da ação ritual expressa por חלל no hifil e קדשׁ, sem acrescentar um objeto que o hebraico deixa implícito.
- source_word: בְּאֶחָד לַחֹדֶשׁ הָרִאשׁוֹן
  choice: no primeiro dia do primeiro mês
  rationale: Expande de modo idiomático a fórmula hebraica de data, literalmente “no um do primeiro mês”.
- source_word: בָּאוּ לְאוּלָם יְהוָה
  choice: chegaram ao pórtico de Yahweh
  rationale: אוּלָם designa o espaço frontal coberto do templo. “Chegaram ao” preserva a direção do movimento sem afirmar mais do que o texto sobre a entrada no santuário.
- source_word: וַיְקַדְּשׁוּ אֶת בֵּית יְהוָה
  choice: Consagraram a casa de Yahweh
  rationale: Mantém a correspondência de קדשׁ com “consagrar” e preserva a expressão bíblica “casa de Yahweh”, que neste contexto se refere ao templo.
- source_word: לְיָמִים שְׁמוֹנָה
  choice: em oito dias
  rationale: Expressa o período no qual essa etapa da consagração foi concluída, em harmonia com a sequência cronológica até o décimo sexto dia.
- source_word: כִּלּוּ
  choice: terminaram
  rationale: Traduz de maneira concisa e natural o piel de כלה, “terminar, completar”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal divino em vez de substituí-lo por um título.
translation_notes:
  register: Português atual, claro e digno, com sintaxe narrativa natural. “Casa de Yahweh” conserva a imagem hebraica tradicional, enquanto a nota esclarece a variação possível no termo arquitetônico.
