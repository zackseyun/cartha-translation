lexical_decisions:
- source_word: וְהַקֳּדָשִׁים
  choice: As ofertas consagradas
  rationale: O plural designa, neste contexto do templo, bens separados para uso sagrado; como a enumeração seguinte é de animais, “ofertas consagradas” comunica naturalmente sua função sacrificial.
- source_word: בָּקָר
  choice: seiscentas cabeças de gado
  rationale: בָּקָר é um coletivo de bovinos. “Cabeças de gado” preserva o sentido coletivo, evita restringir a bois e permite concordância natural com o numeral em português.
- source_word: שֵׁשׁ מֵאוֹת
  choice: seiscentas
  rationale: Tradução direta do numeral cardinal, com concordância com “cabeças”.
- source_word: וְצֹאן
  choice: e três mil ovelhas
  rationale: צֹאן designa coletivamente animais de rebanho miúdo e pode incluir ovelhas e cabras. “Ovelhas” é a forma narrativa mais corrente, enquanto a amplitude lexical é preservada em nota.
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: três mil
  rationale: Tradução direta do numeral cardinal.
