  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: גַּ֣ם סָֽגְר֞וּ דַּלְת֣וֹת הָ/אוּלָ֗ם וַ/יְכַבּוּ֙ אֶת הַ/נֵּר֔וֹת וּ/קְטֹ֖רֶת לֹ֣א הִקְטִ֑ירוּ וְ/עֹלָה֙ לֹא הֶעֱל֣וּ בַ/קֹּ֔דֶשׁ לֵ/אלֹהֵ֖י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/007.yaml
  text: They also shut the doors of the vestibule[a], put out the lamps, did not burn incense[b], and did not offer up burnt offerings in the sanctuary to the God of Israel.
translation:
  language: pt
  text: Também fecharam as portas do vestíbulo[a], apagaram as lâmpadas, não queimaram incenso e não ofereceram ofertas totalmente queimadas no santuário[b] ao Deus de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do pórtico” ou “do salão de entrada”; o termo hebraico se refere ao espaço de entrada do templo.
    reason: lexical_alternative
  - marker: b
    text: Ou “no lugar santo”; o termo hebraico pode designar a área sagrada do templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Também
  rationale: Expressa o caráter cumulativo da acusação e liga estas ações ao contexto anterior.
- source_word: סָגְרוּ
  choice: fecharam
  rationale: Equivalente direto e natural em português para a ação realizada sobre as portas.
- source_word: דַּלְתוֹת הָאוּלָם
  choice: as portas do vestíbulo
  rationale: אוּלָם designa o espaço de entrada do templo; “vestíbulo” é preciso e amplamente compreensível, sem sugerir uma varanda doméstica.
- source_word: וַיְכַבּוּ אֶת הַנֵּרוֹת
  choice: apagaram as lâmpadas
  rationale: Preserva a ação concreta de extinguir as lâmpadas usadas no serviço do templo.
- source_word: וּקְטֹרֶת לֹא הִקְטִירוּ
  choice: não queimaram incenso
  rationale: O hifil de קטר com קְטֹרֶת descreve o ato ritual de fazer o incenso queimar e produzir fumaça.
- source_word: וְעֹלָה לֹא הֶעֱלוּ
  choice: não ofereceram ofertas totalmente queimadas
  rationale: עֹלָה é a oferta sacrificial consumida por completo no altar. A formulação explicita seu sentido para leitores modernos e evita a possível associação contemporânea de “holocausto” exclusivamente ao genocídio.
- source_word: בַקֹּדֶשׁ
  choice: no santuário
  rationale: Mantém a referência ao espaço sagrado do templo sem determinar de modo mais estreito qual área interna está em vista.
- source_word: לֵאלֹהֵי יִשְׂרָאֵל
  choice: ao Deus de Israel
  rationale: A preposição ל marca o destinatário ou a dedicação das ofertas; “ao” comunica naturalmente essa orientação cultual.
theological_decisions:
- issue: Terminologia do culto no templo
  choice: 'Manter as ações e os elementos concretos do culto: queimar incenso, oferecer ofertas totalmente queimadas e servir no santuário.'
  alternative: Generalizar como “não adoraram” ou “não apresentaram ofertas”.
  rationale: O texto enumera negligências específicas no serviço do templo. Preservar essa linguagem mantém a particularidade histórica e teológica da acusação.
- issue: Alcance de בַקֹּדֶשׁ
  choice: Traduzir como “no santuário”, preservando a amplitude do termo.
  alternative: Traduzir mais especificamente como “no Lugar Santo”.
  rationale: O hebraico pode referir-se à área sagrada ou ao recinto santo do templo; o contexto não exige uma delimitação arquitetônica mais estreita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário compreensível internacionalmente. A coordenação simples preserva o ritmo cumulativo do hebraico.
