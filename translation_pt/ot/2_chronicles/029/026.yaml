  yaml_path: translation/ot/2_chronicles/029/026.yaml
  text: Then the Levites stood with the instruments of David[b][a], and the priests with the trumpets.
translation:
  language: pt
  text: Então os levitas tomaram posição com os instrumentos de Davi[a], e os sacerdotes, com as trombetas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com os instrumentos pertencentes a Davi”. A expressão hebraica pode indicar instrumentos que pertenciam a Davi, que foram por ele instituídos ou que estavam associados a ele.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, as trombetas usadas pelos sacerdotes no culto. Em outros contextos elas são identificadas como sendo de prata, mas esse detalhe não aparece aqui.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: Então ... tomaram posição
  rationale: O imperfeito consecutivo faz a narrativa avançar. “Então” expressa a sequência, e “tomaram posição” comunica naturalmente o sentido contextual de עמד sem acrescentar uma ação distinta.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: Tradução corrente do nome do grupo tribal e cultual, preservando o artigo definido.
- source_word: בִּכְלֵי דָוִיד
  choice: com os instrumentos de Davi
  rationale: Embora כְּלִי possa designar utensílio ou objeto de modo geral, neste contexto musical do templo refere-se a instrumentos. A construção “de Davi” preserva a amplitude da relação genitiva no hebraico.
- source_word: וְהַכֹּהֲנִים
  choice: e os sacerdotes
  rationale: Tradução direta, preservando a coordenação e o artigo definido. A elipse verbal é mantida de maneira natural em português.
- source_word: בַּחֲצֹצְרוֹת
  choice: com as trombetas
  rationale: חֲצֹצְרוֹת designa as trombetas usadas pelos sacerdotes no culto. Não se acrescenta “de prata”, pois esse material não é declarado neste versículo.
