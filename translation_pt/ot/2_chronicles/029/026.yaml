  register: 'Português moderno, claro e digno, com ampla legibilidade brasileira. “Tomaram posição” é natural no contexto de uma cerimônia organizada; a segunda ocorrência verbal fica elíptica, como no hebraico. Os marcadores foram ligados aos termos que efetivamente explicam: [a] aos instrumentos de Davi e [b] às trombetas.'
