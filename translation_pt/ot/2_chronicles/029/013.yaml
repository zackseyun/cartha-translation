  text: and from the sons of Elizaphan[a], Shimri and Jeiel; and from the sons of Asaph[b], Zechariah and Mattaniah.
translation:
  language: pt
  text: e dos filhos de Elizafã[a], Sinri e Jeuel[b]; e dos filhos de Asafe, Zacarias e Matanias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica “filhos de” pode designar uma linhagem familiar ou um clã, e não apenas filhos imediatos.
    reason: lexical_alternative
  - marker: b
    text: O nome “Jeuel” tem aqui uma grafia diferente da de alguns nomes semelhantes encontrados em outros trechos (por exemplo, “Jeiel”); a forma hebraica deste versículo sustenta “Jeuel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִן
  choice: e, dos
  rationale: Preserva a conjunção e a preposição hebraicas, bem como a continuidade da lista iniciada nos versículos anteriores.
- source_word: בְּנֵי
  choice: filhos de
  rationale: Mantém a expressão genealógica hebraica; neste contexto, ela também pode indicar descendentes ou integrantes de uma linhagem familiar.
- source_word: אֱלִיצָפָן
  choice: Elisafã
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico.
- source_word: שִׁמְרִי
  choice: Sinri
  rationale: Transliteração portuguesa corrente do nome hebraico Shimri.
- source_word: ו/יעואל
  choice: e Jeuel
  rationale: A forma consonantal deste versículo, יעואל, sustenta Jeuel, distinguindo-o de nomes semelhantes grafados de outro modo.
- source_word: בְּנֵי אָסָף
  choice: filhos de Asafe
  rationale: Conserva a formulação genealógica ou corporativa do hebraico, com Asafe como ancestral ou chefe da linhagem.
- source_word: זְכַרְיָהוּ
  choice: Zacarias
  rationale: Forma portuguesa consagrada do nome hebraico.
- source_word: וּ/מַתַּנְיָהוּ
  choice: e Matanias
  rationale: Emprega a forma portuguesa tradicional do nome e preserva a conjunção hebraica.
