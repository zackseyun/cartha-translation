  text: וְ/הִנֵּ֛ה נָפְל֥וּ אֲבוֹתֵ֖י/נוּ בֶּ/חָ֑רֶב וּ/בָנֵ֨י/נוּ וּ/בְנוֹתֵ֧י/נוּ וְ/נָשֵׁ֛י/נוּ בַּ/שְּׁבִ֖י עַל זֹֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/009.yaml
  text: And behold[a], our fathers have fallen by the sword[b], and our sons and our daughters and our wives are in captivity because of this.
translation:
  language: pt
  text: E eis[a] que nossos pais caíram à espada, e nossos filhos, nossas filhas e nossas esposas estão no cativeiro por causa disso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vejam”. O marcador hebraico chama enfaticamente a atenção para a declaração que segue.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E vejam
  rationale: O marcador discursivo chama enfaticamente a atenção para o que segue. “E vejam” conserva a conjunção e essa força em português atual; a nota registra a alternativa solene “eis”.
- source_word: נָפְלוּ
  choice: caíram
  rationale: Mantém o sentido básico de נפל e o idioma solene de morrer em contexto de guerra, sem explicitar além do hebraico.
- source_word: אֲבוֹתֵינוּ
  choice: nossos pais
  rationale: Preserva o termo masculino específico e sua referência à geração anterior, em vez de generalizá-lo como “antepassados”.
- source_word: בֶּחָרֶב
  choice: à espada
  rationale: Equivalente português tradicional e natural do idioma hebraico que indica morte violenta pela espada.
- source_word: וּבָנֵינוּ
  choice: nossos filhos
  rationale: Preserva a referência específica aos descendentes do sexo masculino, diferenciados das filhas na sequência.
- source_word: וּבְנוֹתֵינוּ
  choice: nossas filhas
  rationale: Equivalente lexical direto, mantido separadamente de “filhos” como no hebraico.
- source_word: וְנָשֵׁינוּ
  choice: nossas esposas
  rationale: Na enumeração familiar com sufixo possessivo, “esposas” é a leitura contextual mais precisa.
- source_word: בַּשְּׁבִי
  choice: estão no cativeiro
  rationale: Reproduz a construção nominal e seu sentido de condição resultante, sem transformá-la em verbo no texto principal.
- source_word: עַל זֹאת
  choice: por causa disso
  rationale: Expressa claramente a relação causal com a infidelidade e o juízo descritos no contexto anterior.
theological_decisions:
- issue: Termos de parentesco marcados por gênero no contexto do juízo
  choice: nossos pais ... nossos filhos, nossas filhas e nossas esposas
  alternative: nossos antepassados ... nossos filhos e nossas mulheres
  rationale: O hebraico enumera grupos familiares específicos; a tradução conserva essas distinções sem neutralizá-las nem ampliar seu sentido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vejam” torna explícita a força de apelo ao grupo; “à espada” preserva o tom bíblico sem soar obscuro. A pontuação com dois-pontos ajuda a transmitir a função enfática do marcador hebraico.
