base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/004.yaml
  text: Then he brought in the priests and the Levites and assembled them in the eastern square[a].
translation:
  language: pt
  text: Então ele mandou trazer os sacerdotes e os levitas e os reuniu na praça oriental[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na praça do lado leste”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: Então ele mandou trazer
  rationale: O hifil de בוא expressa ação causativa, isto é, fazer vir ou mandar trazer. “Então” comunica com naturalidade a progressão narrativa do wayyiqtol; não se acrescenta uma referência explícita ao templo, que não aparece no versículo.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Equivalente português corrente e preciso para כהנים.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: Designação tradicional e clara dos levitas, mantidos distintos dos sacerdotes no texto.
- source_word: וַיַּאַסְפֵם
  choice: os reuniu
  rationale: אסף com sufixo de terceira pessoa masculina plural significa reunir ou ajuntar. “Reuniu” é natural e adequado a uma convocação pública.
- source_word: לִרְחוֹב
  choice: na praça
  rationale: רחוב designa um espaço amplo e aberto, como uma praça, e não necessariamente uma rua no sentido moderno. A preposição pode ser entendida em termos locativos ou direcionais.
- source_word: הַמִּזְרָח
  choice: oriental
  rationale: מזרח significa leste ou oriental. “Praça oriental” reproduz de maneira concisa a relação hebraica, enquanto a nota preserva a possível leitura espacial mais explícita.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva a concisão narrativa do hebraico e registra em nota a ambiguidade entre a designação “praça oriental” e a localização “praça do lado leste”.
