  text: וַ/יֹּ֨אמֶר֙ חִזְקִיָּ֔הוּ לְ/הַעֲל֥וֹת הָ/עֹלָ֖ה לְ/הַ/מִּזְבֵּ֑חַ וּ/בְ/עֵ֞ת הֵחֵ֣ל הָֽ/עוֹלָ֗ה הֵחֵ֤ל שִׁיר יְהוָה֙ וְ/הַ/חֲצֹ֣צְר֔וֹת וְ/עַ֨ל יְדֵ֔י כְּלֵ֖י דָּוִ֥יד מֶֽלֶךְ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/027.yaml
  text: Then Hezekiah commanded to offer up the burnt offering on the altar[a]. And at the time the burnt offering began, the song of Yahweh began also[b], with the trumpets and by means of the instruments of David king of Israel.
translation:
  language: pt
  text: Então Ezequias ordenou que oferecessem o holocausto sobre o altar. Quando começou o holocausto, começou também o cântico de Yahweh[a], acompanhado pelas trombetas e pelos instrumentos de Davi, rei de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o cântico a Yahweh”. Em hebraico, literalmente, “o cântico de Yahweh”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר ... לְהַעֲלוֹת
  choice: ordenou que oferecessem
  rationale: Embora וַיֹּאמֶר seja literalmente “disse”, a construção com o infinitivo introduz aqui uma ordem régia. A oração com sujeito indeterminado é natural em português e conserva o sentido causativo da diretiva.
- source_word: הָעֹלָה
  choice: o holocausto
  rationale: Termo sacrificial tradicional e amplamente compreensível para a oferta inteiramente queimada.
- source_word: לַמִּזְבֵּחַ
  choice: sobre o altar
  rationale: Expressa diretamente o local cultual e mantém a relação espacial do hebraico.
- source_word: הֵחֵל ... הֵחֵל
  choice: começou ... começou também
  rationale: A repetição do verbo reproduz a coordenação deliberada do hebraico entre o início do holocausto e o início do cântico.
- source_word: שִׁיר יְהוָה
  choice: o cântico de Yahweh
  rationale: Preserva a construção hebraica sem decidir se o cântico pertence a Yahweh ou é dirigido a ele; a leitura direcional consta em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: הַחֲצֹצְרוֹת
  choice: as trombetas
  rationale: Equivalente direto; o material de fabricação não é declarado neste versículo.
- source_word: וְעַל יְדֵי כְּלֵי דָּוִיד
  choice: acompanhado ... pelos instrumentos de Davi
  rationale: No contexto musical, a expressão indica o meio instrumental que acompanha o cântico. A formulação é idiomática em português.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: rei de Israel
  rationale: Mantém o título real de Davi conforme o texto.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido de שִׁיר יְהוָה
  choice: o cântico de Yahweh
  alternative: o cântico a Yahweh
  rationale: O genitivo hebraico pode indicar associação ou direção. O texto principal conserva a ambiguidade formal, e a nota registra a leitura direcional plausível.
translation_notes:
  register: Português moderno, digno e fluente, com leitura natural no Brasil e compreensão internacional. Emprega “holocausto” em seu sentido sacrificial bíblico e evita acrescentar “musicais”, pois o contexto já esclarece a natureza dos instrumentos.
