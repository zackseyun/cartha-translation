  naturalness: O português é claro, moderno e de registro apropriado. “Touros” e “disse” mantêm boa fluidez e reduzem especificações desnecessárias.
  terminology: “Carneiros”, “cordeiros”, “bodes”, “oferta pelo pecado”, “santuário”, “filhos de Arão, os sacerdotes”, e “Yahweh” são escolhas adequadas e consistentes com o hebraico.
