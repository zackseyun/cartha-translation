source:
  edition: WLC
  text: וַ/יָּבִ֣יאוּ פָרִים שִׁבְעָה֩ וְ/אֵילִ֨ים שִׁבְעָ֜ה וּ/כְבָשִׂ֣ים שִׁבְעָ֗ה וּ/צְפִירֵ֨י עִזִּ֤ים שִׁבְעָה֙ לְ/חַטָּ֔את עַל הַ/מַּמְלָכָ֥ה וְ/עַל הַ/מִּקְדָּ֖שׁ וְ/עַל יְהוּדָ֑ה וַ/יֹּ֗אמֶר לִ/בְנֵ֤י אַהֲרֹן֙ הַ/כֹּ֣הֲנִ֔ים לְ/הַעֲל֖וֹת עַל מִזְבַּ֥ח יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/021.yaml
  text: They brought seven bulls, seven rams, seven lambs, and seven male goats as a sin offering for the kingdom, for the sanctuary, and for Judah. And he told the sons of Aaron, the priests, to offer them on the altar of Yahweh.
translation:
  language: pt
  text: Trouxeram sete touros, sete carneiros, sete cordeiros e sete bodes como oferta pelo pecado em favor do reino, do santuário e de Judá. E ele disse aos filhos de Arão, os sacerdotes, que os oferecessem sobre o altar de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: Trouxeram
  rationale: Expressa diretamente a ação narrativa de levar os animais destinados ao sacrifício, sem acrescentar a ideia mais interpretativa de apresentação ritual.
- source_word: פָרִים
  choice: novilhos
  rationale: Em listas sacrificiais, designa bovinos machos oferecidos no altar. “Novilhos” é a forma tradicional e natural em português para este contexto, embora o termo hebraico neste versículo não explicite por si só uma idade exata.
- source_word: אֵילִים
  choice: carneiros
  rationale: Equivalente corrente para machos adultos das ovelhas em contexto sacrificial.
- source_word: כְבָשִׂים
  choice: cordeiros
  rationale: Termo natural e reconhecível para os animais ovinos jovens desta lista sacrificial.
- source_word: צְפִירֵי עִזִּים
  choice: bodes
  rationale: A expressão hebraica especifica caprinos machos; “bodes” comunica isso de modo conciso e natural.
- source_word: לְחַטָּאת
  choice: como oferta pelo pecado
  rationale: No contexto cultual, חַטָּאת designa uma categoria de sacrifício, não apenas o pecado em sentido abstrato.
- source_word: עַל הַמַּמְלָכָה ... וְעַל הַמִּקְדָּשׁ וְעַל יְהוּדָה
  choice: em favor do reino, do santuário e de Judá
  rationale: A preposição עַל indica aqui a finalidade representativa ou beneficiária do sacrifício. “Em favor de” torna essa relação clara sem explicar além do texto.
- source_word: הַמִּקְדָּשׁ
  choice: santuário
  rationale: Preserva o sentido cultual de lugar santo e é mais preciso aqui do que o termo mais amplo “templo”.
- source_word: לִבְנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: aos filhos de Arão, os sacerdotes
  rationale: Mantém tanto a designação familiar quanto a identificação sacerdotal em aposição.
- source_word: לְהַעֲלוֹת
  choice: que os oferecessem
  rationale: No uso sacrificial, עלה indica fazer subir ou oferecer no altar. A formulação portuguesa exprime naturalmente a ação cultual; o objeto pronominal é recuperado do contexto.
- source_word: מִזְבַּח יְהוָה
  choice: o altar de Yahweh
  rationale: Reproduz naturalmente a cadeia construta e conserva o nome divino pessoal presente no hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” representa o nome pessoal sem substituí-lo por um título.
- issue: Sentido cultual de חַטָּאת
  choice: oferta pelo pecado
  alternative: sacrifício pelo pecado; oferta de purificação
  rationale: A palavra designa aqui uma oferta sacrificial específica. “Oferta pelo pecado” conserva a categoria cultual tradicional sem decidir no texto principal entre as nuances de expiação do pecado e purificação.
- issue: Força de עַל diante dos beneficiários da oferta
  choice: em favor de
  alternative: por; em nome de
  rationale: A escolha explicita moderadamente que a oferta é feita com referência ao reino, ao santuário e a Judá, sem atribuir uma teoria específica de representação ou expiação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação da lista e a repetição de “sete” foram preservadas. “Então” liga naturalmente a segunda ação à primeira sem exigir a repetição rígida de “e”. Não há notas de rodapé, portanto não há marcadores no texto.
