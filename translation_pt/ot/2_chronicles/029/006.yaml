  text: כִּֽי מָעֲל֣וּ אֲבֹתֵ֗י/נוּ וְ/עָשׂ֥וּ הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָֽה אֱלֹהֵ֖י/נוּ וַ/יַּֽעַזְבֻ֑/הוּ וַ/יַּסֵּ֧בּוּ פְנֵי/הֶ֛ם מִ/מִּשְׁכַּ֥ן יְהוָ֖ה וַ/יִּתְּנוּ עֹֽרֶף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/006.yaml
  text: For our fathers acted unfaithfully and did what was evil in the eyes of Yahweh our God[a]. They abandoned him, turned their faces away from the dwelling place of Yahweh[c][b], and turned their backs.
translation:
  language: pt
  text: Pois nossos pais foram infiéis e fizeram o que era mau aos olhos de Yahweh, nosso Deus.[a] Eles o abandonaram, viraram o rosto para longe da morada de Yahweh[b] e deram as costas.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “agiram de modo infiel” ou “cometeram infidelidade”; o verbo hebraico indica quebra de fidelidade, muitas vezes no âmbito da aliança.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “da morada de Yahweh”. Também se pode traduzir o termo por “tabernáculo”, mas aqui ele se refere ao templo como morada de Yahweh.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “deram a nuca”. A expressão indica virar-se em recusa ou rebeldia.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָעֲלוּ
  choice: foram infiéis
  rationale: O verbo מעל indica quebra de fidelidade, muitas vezes em contexto de aliança ou culto. “Foram infiéis” comunica essa força moral e religiosa em português atual.
- source_word: הָרַע
  choice: o que era mau
  rationale: Com o verbo עשה, a expressão significa fazer aquilo que é moralmente mau. A formulação é natural e preserva a avaliação objetiva do texto.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Mantém a metáfora do idioma hebraico de forma clara e consagrada em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיַּעַזְבֻהוּ
  choice: Eles o abandonaram
  rationale: עזב expressa aqui abandono relacional e religioso; “abandonaram” é claro, atual e conserva essa força.
- source_word: וַיַּסֵּבּוּ פְנֵיהֶם
  choice: desviaram o rosto
  rationale: Reproduz a imagem hebraica de afastamento deliberado sem tornar a frase artificial em português.
- source_word: מִמִּשְׁכַּן יְהוָה
  choice: da morada de Yahweh
  rationale: מִשְׁכָּן designa literalmente um lugar de habitação. Neste contexto, refere-se ao templo como morada de Yahweh, sem exigir o sentido técnico de “tabernáculo”.
- source_word: וַיִּתְּנוּ עֹרֶף
  choice: lhe deram as costas
  rationale: Equivalente idiomático natural para a imagem hebraica de “dar a nuca”, que indica recusa e rejeição obstinada.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo silenciosamente por um título.
- issue: Sentido cultual de מִשְׁכָּן no contexto do templo
  choice: morada de Yahweh
  alternative: tabernáculo de Yahweh; santuário de Yahweh
  rationale: “Morada” conserva o sentido lexical e a concepção teológica do templo como habitação divina, sem sugerir indevidamente apenas a tenda mosaica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe preserva as imagens paralelas do rosto e das costas, enquanto os idiomas hebraicos recebem equivalentes naturais. O nome divino é transliterado como “Yahweh”.
