source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר לָ/הֶ֖ם שְׁמָע֣וּ/נִי הַ/לְוִיִּ֑ם עַתָּ֣ה הִֽתְקַדְּשׁ֗וּ וְ/קַדְּשׁוּ֙ אֶת בֵּ֤ית יְהוָה֙ אֱלֹהֵ֣י אֲבֹתֵי/כֶ֔ם וְ/הוֹצִ֥יאוּ אֶת הַ/נִּדָּ֖ה מִן הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/005.yaml
  text: And he said to them[a], “Listen to me, Levites. Now consecrate yourselves, and consecrate the house of Yahweh, the God of your fathers[b], and remove the uncleanness from the holy place.”
translation:
  language: pt
  text: 'E lhes disse: “Ouçam-me, levitas! Agora consagrem-se e consagrem a casa de Yahweh, o Deus de seus pais. Retirem a impureza[a] do lugar santo[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a imundície” ou “a contaminação”. O termo hebraico se refere àquilo que torna o santuário impuro.
    reason: lexical_alternative
  - marker: b
    text: Ou “do santuário”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָעוּנִי
  choice: Ouçam-me
  rationale: O imperativo de שׁמע com sufixo de primeira pessoa é vertido por uma convocação direta e natural em português.
- source_word: הַלְוִיִּם
  choice: levitas
  rationale: Designa diretamente os integrantes da tribo de Levi encarregados do serviço cultual.
- source_word: עַתָּה
  choice: Agora
  rationale: Preserva tanto o valor temporal quanto a força exortativa imediata do advérbio.
- source_word: הִתְקַדְּשׁוּ
  choice: consagrem-se
  rationale: O hitpael imperativo de קדשׁ tem sentido reflexivo e, neste contexto, refere-se à preparação cultual dos levitas.
- source_word: וְקַדְּשׁוּ
  choice: e consagrem
  rationale: Mantém a mesma raiz portuguesa usada na ordem anterior, reproduzindo a repetição de קדשׁ no hebraico.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Conserva a expressão hebraica literal e reconhecível, sem substituí-la pela interpretação contextual «templo».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: o Deus de seus pais
  rationale: Preserva a fórmula pactual e o referente masculino explícito de אָבוֹת.
- source_word: וְהוֹצִיאוּ
  choice: Retirem
  rationale: O hiphil de יצא expressa aqui a remoção daquilo que contaminava o espaço sagrado; «retirem» é claro e natural em português.
- source_word: הַנִּדָּה
  choice: a impureza
  rationale: Neste contexto cultual, נִדָּה designa aquilo que causa contaminação ou profanação no santuário; «impureza» preserva esse sentido sem torná-lo meramente sujeira física.
- source_word: מִן הַקֹּדֶשׁ
  choice: do lugar santo
  rationale: קֹדֶשׁ refere-se aqui ao espaço sagrado. «Lugar santo» conserva a forma do hebraico, enquanto «santuário» continua sendo uma alternativa legítima.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; ou a substituição tradicional «SENHOR»
  rationale: O texto contém o nome divino pessoal. «Yahweh» o representa diretamente, sem trocar o nome por um título.
- issue: Sentido cultual de הַנִּדָּה
  choice: a impureza
  alternative: a imundície; a contaminação
  rationale: A escolha mantém a dimensão de contaminação ritual do templo sem especificar indevidamente quais objetos ou resíduos estavam sendo removidos.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas imperativas naturais no português brasileiro. A repetição de «consagrem» preserva a ligação lexical do hebraico, e «casa de Yahweh» mantém a expressão cultual original.
