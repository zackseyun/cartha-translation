base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/036.yaml
  text: And Hezekiah rejoiced[a], and all the people, because God had prepared for the people, for the matter had happened suddenly.
translation:
  language: pt
  text: E Ezequias e todo o povo se alegraram com o que Deus havia preparado para o povo[a], pois tudo aconteceu de repente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com o fato de Deus ter preparado as coisas para o povo”; ou: “com o que Deus havia estabelecido para o povo”.'
    reason: A construção hebraica não explicita o objeto de 'preparar' e também pode ser entendida como referência à preparação do próprio povo ou ao estabelecimento daquilo que ocorreu em seu benefício.
lexical_decisions:
- source_word: וַיִּשְׂמַח
  choice: se alegraram
  rationale: O verbo שׂמח expressa alegria; a concordância no plural em português reúne naturalmente Ezequias e todo o povo como sujeitos coordenados.
- source_word: יְחִזְקִיָּהוּ
  choice: Ezequias
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וְכָל הָעָם
  choice: e todo o povo
  rationale: עָם designa aqui a comunidade reunida; 'todo o povo' é natural e preserva a abrangência do hebraico.
- source_word: עַל
  choice: com
  rationale: Depois de um verbo de alegria, עַל introduz a causa ou ocasião da alegria; 'alegraram-se com' é idiomático em português.
- source_word: הֵכִין
  choice: havia preparado
  rationale: O hifil de כון pode significar preparar, deixar pronto ou estabelecer. 'Havia preparado' preserva a ação divina anterior sem definir além do texto o objeto elíptico.
- source_word: הָאֱלֹהִים
  choice: Deus
  rationale: Neste contexto, refere-se ao Deus de Israel.
- source_word: לָעָם
  choice: para o povo
  rationale: A preposição ל indica destinatário ou benefício. A tradução evita transformar 'o povo' em objeto direto de 'preparar'.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação da alegria e liga as orações com naturalidade narrativa.
- source_word: בְּפִתְאֹם
  choice: de repente
  rationale: Expressa o caráter súbito ou inesperadamente rápido do acontecimento.
- source_word: הָיָה הַדָּבָר
  choice: tudo aconteceu
  rationale: דָּבָר refere-se de modo amplo ao acontecimento ou processo descrito. 'Tudo aconteceu' é natural em português e mantém a referência abrangente ao conjunto da restauração do culto.
theological_decisions:
- issue: Ação divina na prontidão para a restauração do culto
  choice: Deus havia preparado para o povo
  alternative: Deus havia preparado o povo; Deus havia estabelecido isso para o povo
  rationale: A construção hebraica הֵכִין ... לָעָם deixa implícito o que foi preparado e apresenta o povo com ל. O texto principal conserva essa estrutura sem afirmar que o próprio povo era o objeto direto; a nota registra as possibilidades sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com fluidez narrativa. A repetição inicial de 'E' reflete o encadeamento hebraico sem soar excessivamente marcada. A nota preserva a ambiguidade sintática e teológica da ação preparatória de Deus.
