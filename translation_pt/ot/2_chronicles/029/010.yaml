base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/010.yaml
  text: Now it is in my heart to make a covenant with Yahweh[a], the God of Israel, so that his burning anger may turn away from us.
translation:
  language: pt
  text: Agora, estou decidido a fazer uma aliança[a] com Yahweh, o Deus de Israel, para que o ardor da sua ira se afaste de nós.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em hebraico, literalmente: “cortar uma aliança”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Agora
  rationale: Marca a atualidade e a urgência da decisão de Ezequias de modo direto e natural.
- source_word: עִם לְבָבִי
  choice: está no meu coração
  rationale: Preserva a imagem hebraica do coração como sede da intenção e comunica uma resolução interior em português claro.
- source_word: לִכְרֹת בְּרִית
  choice: fazer uma aliança
  rationale: É a forma idiomática corrente em português; o sentido literal de 'cortar uma aliança' é conservado em nota.
- source_word: לַיהוָה
  choice: com Yahweh
  rationale: A preposição é explicitada conforme a relação entre as partes de uma aliança, e o nome divino é transliterado.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reproduz diretamente o título genitivo que identifica o Deus da aliança de Israel.
- source_word: וְיָשֹׁב מִמֶּנּוּ
  choice: para que ... se afaste de nós
  rationale: Expressa o resultado desejado da aliança e traduz naturalmente a ideia de a ira deixar de recair sobre o povo.
- source_word: חֲרוֹן אַפּוֹ
  choice: o ardor da sua ira
  rationale: Preserva a metáfora hebraica de calor intenso associada à ira, em registro digno e natural.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; 'Yahweh' preserva o nome pessoal e pactual sem substituí-lo por um título.
- issue: Valor de וְיָשֹׁב após a decisão de fazer aliança
  choice: 'finalidade ou resultado desejado: ''para que ... se afaste'''
  alternative: 'consequência afirmativa: ''e se afastará'''
  rationale: O contexto favorece a expectativa ou finalidade da iniciativa de Ezequias, sem transformar o resultado em garantia automática.
translation_notes:
  register: Português moderno, internacional e solene, com boa legibilidade brasileira. A formulação mantém a imagem de algo posto no coração e conserva, em nota, o idioma hebraico ligado à celebração de uma aliança.
