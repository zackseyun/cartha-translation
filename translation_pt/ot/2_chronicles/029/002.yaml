  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה דָּוִ֥יד אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/002.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that David his father had done.
translation:
  language: pt
  text: Fez o que era certo aos olhos de Yahweh, conforme tudo o que Davi, seu pai, havia feito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Davi, seu antepassado”; aqui, “pai” indica descendência dinástica, não paternidade imediata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Fez
  rationale: O wayyiqtol qal de עשה é a forma narrativa comum, com o sentido de “e fez/fez”. Em português, omitir a conjunção produz uma narrativa natural sem perder o valor verbal.
- source_word: הַיָּשָׁר
  choice: o que era certo
  rationale: O adjetivo com artigo funciona como substantivo, literalmente “o certo/a coisa correta”. A formulação escolhida é idiomática e preserva a avaliação moral da fórmula régia.
- source_word: בְּעֵינֵי
  choice: aos olhos de
  rationale: Preserva a metáfora hebraica que indica avaliação segundo a perspectiva de alguém e é natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כְּכֹל אֲשֶׁר
  choice: conforme tudo o que
  rationale: Expressa tanto a conformidade com o modelo de Davi quanto a abrangência indicada por כֹּל.
- source_word: עָשָׂה
  choice: havia feito
  rationale: O mais-que-perfeito composto deixa clara, em português corrente, a anterioridade das ações de Davi em relação às do rei mencionado.
- source_word: דָּוִיד
  choice: Davi
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: אָבִיו
  choice: seu pai
  rationale: Mantém o termo familiar do hebraico e a fórmula dinástica; neste contexto, “pai” designa um antepassado da linhagem, esclarecido em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pessoal, sem substituí-lo por um título.
- issue: Sentido de “Davi, seu pai” em relação a Ezequias
  choice: Manter “Davi, seu pai” no texto principal
  alternative: Davi, seu antepassado
  rationale: A expressão hebraica é uma fórmula de descendência dinástica. A tradução mantém a linguagem familiar da fonte, enquanto a nota evita que seja entendida como paternidade imediata.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “aos olhos de” conserva o idioma hebraico sem soar obscura; “conforme” comunica naturalmente a ideia de correspondência ao modelo de Davi.
