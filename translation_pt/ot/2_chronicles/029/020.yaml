  text: וַ/יַּשְׁכֵּם֙ יְחִזְקִיָּ֣הוּ הַ/מֶּ֔לֶךְ וַ/יֶּאֱסֹ֕ף אֵ֖ת שָׂרֵ֣י הָ/עִ֑יר וַ/יַּ֖עַל בֵּ֥ית יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/020.yaml
  text: Then King Hezekiah rose early[a], gathered the officials of the city, and went up to the house of Yahweh.
translation:
  language: pt
  text: Então o rei Ezequias levantou-se cedo, reuniu as autoridades da cidade e subiu à casa de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: levantou-se cedo
  rationale: O hifil de שׁכם indica levantar-se ou começar algo de manhã cedo. A formulação preserva a nuance temporal em português natural.
- source_word: יְחִזְקִיָּהוּ הַמֶּלֶךְ
  choice: o rei Ezequias
  rationale: Mantém o título e o nome próprio em uma ordem idiomática e dignificada em português.
- source_word: וַיֶּאֱסֹף
  choice: reuniu
  rationale: Neste contexto, אָסַף descreve a ação de convocar e ajuntar pessoas.
- source_word: שָׂרֵי הָעִיר
  choice: as autoridades da cidade
  rationale: שָׂרִים designa dirigentes ou oficiais civis; “autoridades” comunica a função sem sugerir necessariamente nobreza hereditária.
- source_word: וַיַּעַל
  choice: subiu
  rationale: Preserva a imagem espacial e religiosa do verbo עָלָה, usado para o deslocamento até o santuário.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Reproduz a expressão hebraica “casa de YHWH” sem substituí-la pelo termo interpretativo “templo”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome divino, enquanto “SENHOR” representa a tradição de substituição na leitura.
translation_notes:
  register: Português moderno, claro e dignificado, com boa legibilidade brasileira. A coordenação narrativa do hebraico foi mantida sem rigidez excessiva; “autoridades” evita tanto o arcaísmo de “príncipes” quanto uma especificação administrativa não expressa pelo texto.
