base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/018.yaml
  text: Then they went in to King Hezekiah and said[a], “We have cleansed all the house of Yahweh, the altar of burnt offering and all its utensils, and the table of the rows and all its utensils.”
translation:
  language: pt
  text: 'Então entraram à presença do rei Ezequias e disseram: “Purificamos toda a Casa de Yahweh, o altar do holocausto e todos os seus utensílios, bem como a mesa dos pães dispostos[a] e todos os seus utensílios.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “mesa dos pães da proposição”; isto é, a mesa onde eram dispostos os pães diante de Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְנִימָה
  choice: entraram para falar com
  rationale: O advérbio indica movimento para o interior. No contexto, os sacerdotes e levitas entram à presença do rei para lhe apresentar o relatório; esta formulação é natural em português sem acrescentar um local não especificado.
- source_word: טִהַרְנוּ
  choice: Purificamos
  rationale: No contexto do templo, o verbo designa purificação ritual. “Purificamos” comunica esse sentido cultual com clareza.
- source_word: בֵּית יְהוָה
  choice: a Casa de Yahweh
  rationale: Preserva a expressão hebraica “casa de Yahweh” e, pela inicial maiúscula, deixa claro que se trata do templo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מִזְבַּח הָעוֹלָה
  choice: o altar do holocausto
  rationale: É a designação portuguesa tradicional e concisa do altar destinado à oferta inteiramente queimada.
- source_word: כֵּלָיו
  choice: seus utensílios
  rationale: No contexto do santuário, o termo abrange os objetos e instrumentos usados no serviço ritual; “utensílios” é claro e concreto.
- source_word: שֻׁלְחַן הַמַּעֲרֶכֶת
  choice: a mesa dos pães dispostos
  rationale: מַעֲרֶכֶת refere-se ao arranjo ordenado, aqui dos pães colocados diante de Yahweh. A formulação explicita o referente contextual sem recorrer ao termo pouco transparente “pães da proposição”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal e pactual em vez de o substituir pelo título tradicional.
- issue: Identificação de שֻׁלְחַן הַמַּעֲרֶכֶת
  choice: mesa dos pães dispostos
  alternative: mesa da disposição
  rationale: O hebraico pode ser vertido formalmente como “mesa da disposição”, mas o contexto cultual aponta para os pães ordenadamente colocados sobre a mesa. A nota registra a designação tradicional sem apagar a imagem do arranjo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Casa” mantém a imagem hebraica para o templo; “holocausto” conserva o vocabulário cultual corrente. A coordenação com “bem como” evita uma enumeração pesada.
