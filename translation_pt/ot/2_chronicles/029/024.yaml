base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/024.yaml
  text: The priests slaughtered them and applied their blood to the altar to make atonement for all Israel[b][a], because the king had said that the burnt offering and the sin offering were for all Israel.
translation:
  language: pt
  text: Os sacerdotes os sacrificaram e aplicaram o sangue deles ao altar[a], para fazer expiação por todo o Israel, pois o rei havia dito que o holocausto e a oferta pelo pecado[b] eram para todo o Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “purificaram o altar com o sangue deles”. O verbo hebraico pode indicar a realização do rito de purificação ou da oferta pelo pecado.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “oferta de purificação”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁחָטוּם
  choice: os sacrificaram
  rationale: No contexto sacrificial, שׁחט indica o abate ritual dos animais. O pronome retoma os bodes do versículo anterior; “sacrificaram” comunica de modo natural tanto a morte quanto seu caráter cultual.
- source_word: וַיְחַטְּאוּ אֶת־דָּמָם הַמִּזְבֵּחָה
  choice: aplicaram o sangue deles ao altar
  rationale: A construção descreve um rito de oferta pelo pecado/purificação realizado com o sangue no altar. A tradução expressa a ação concreta sem afirmar que o próprio sangue era uma oferta independente; a nuance de purificação é preservada em nota.
- source_word: לְכַפֵּר
  choice: para fazer expiação
  rationale: כפר em contexto sacrificial designa o ato ritual de fazer expiação. A formulação mantém o peso teológico e cultual do termo sem explicar além do texto.
- source_word: עַל כָּל־יִשְׂרָאֵל
  choice: por todo o Israel
  rationale: עַל com כפר identifica aqueles em favor de quem se realiza a expiação. “Por todo o Israel” é natural e conserva a abrangência representativa.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão pela qual as ofertas abrangiam todo o Israel. “Pois” mantém a relação explicativa com dignidade e fluidez.
- source_word: לְכָל־יִשְׂרָאֵל אָמַר הַמֶּלֶךְ
  choice: o rei havia determinado que ... fossem oferecidos por todo o Israel
  rationale: O hebraico literalmente atribui ao rei uma declaração relativa a todo o Israel. “Havia determinado” expressa no contexto a intenção diretiva do rei, enquanto o complemento verbal evita uma frase nominal truncada em português.
- source_word: הָעוֹלָה
  choice: o holocausto
  rationale: “Holocausto” é o termo bíblico convencional em português para a oferta inteiramente queimada, עוֹלָה.
- source_word: וְהַחַטָּאת
  choice: a oferta pelo pecado
  rationale: No contexto sacrificial, חטאת denomina a oferta relacionada ao pecado. A alternativa “oferta de purificação”, que destaca outra nuance legítima do termo, consta em nota.
theological_decisions:
- issue: Sentido ritual de חטא/חטאת
  choice: Usar “oferta pelo pecado” no texto principal e descrever a aplicação do sangue sem acrescentar que o sangue era, ele próprio, uma oferta.
  alternative: “Oferta de purificação”; “purificaram o altar com o sangue deles”.
  rationale: O contexto é claramente sacrificial, e “oferta pelo pecado” é compreensível e tradicional. Ao mesmo tempo, a raiz hebraica pode enfatizar a purificação ritual; a nota preserva essa tensão sem impor uma única explicação teológica.
- issue: Força de אָמַר na declaração do rei
  choice: “havia determinado”
  alternative: “havia dito”
  rationale: A declaração real define para quem as ofertas deviam ser feitas. “Determinado” comunica essa força contextual, mas não a transforma explicitamente em um mandamento técnico.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém terminologia sacrificial reconhecível, preservando em notas as nuances rituais legítimas do hebraico.
