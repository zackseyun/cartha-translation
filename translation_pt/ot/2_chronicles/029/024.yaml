  revised_text: Os sacerdotes os sacrificaram e aplicaram o sangue deles ao altar[a], para fazer expiação por todo o Israel, pois o rei havia dito que o holocausto e a oferta pelo pecado[b] eram para todo o Israel.
  revised_footnotes:
