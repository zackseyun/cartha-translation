  text: וְ/גַם עֹלָ֨ה לָ/רֹ֜ב בְּ/חֶלְבֵ֧י הַ/שְּׁלָמִ֛ים וּ/בַ/נְּסָכִ֖ים לָ/עֹלָ֑ה וַ/תִּכּ֖וֹן עֲבוֹדַ֥ת בֵּית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/035.yaml
  text: And the burnt offerings were also in abundance[a], with the fat of the peace offerings and the drink offerings for the burnt offerings. So the service of the house of Yahweh was established.
translation:
  language: pt
  text: Também havia holocaustos em grande quantidade, com a gordura das ofertas de paz[a] e com as libações para os holocaustos. Assim se estabeleceu o serviço da casa de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ofertas de comunhão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Também
  rationale: Expressa a força aditiva e liga naturalmente o versículo ao contexto anterior.
- source_word: עֹלָה
  choice: holocaustos
  rationale: Embora a forma hebraica seja singular, tem sentido coletivo no contexto; o plural português corresponde à grande quantidade mencionada.
- source_word: לָרֹב
  choice: em grande quantidade
  rationale: Tradução idiomática da expressão que indica abundância numérica.
- source_word: בְּחֶלְבֵי
  choice: além da gordura das
  rationale: No contexto sacrificial, חלב designa as porções de gordura oferecidas; 'além de' comunica aqui a associação com os muitos holocaustos.
- source_word: הַשְּׁלָמִים
  choice: ofertas de paz
  rationale: Preserva a categoria sacrificial reconhecida sem restringi-la a uma única interpretação de sua função.
- source_word: וּבַנְּסָכִים
  choice: e das ofertas de libação
  rationale: נְסָכִים são ofertas líquidas derramadas; 'ofertas de libação' é preciso e compreensível em registro bíblico moderno.
- source_word: לָעֹלָה
  choice: para os holocaustos
  rationale: Indica a associação ou destinação das libações aos holocaustos; o plural acompanha o sentido coletivo anterior.
- source_word: וַתִּכּוֹן
  choice: se estabeleceu
  rationale: Reproduz o sentido resultativo de algo posto em ordem e firmemente instituído, sem explicitar além do hebraico se foi iniciado ou restaurado.
- source_word: עֲבוֹדַת בֵּית יְהוָה
  choice: o serviço da casa de Yahweh
  rationale: Mantém transparente a cadeia construta e o sentido cultual de עֲבוֹדָה como serviço do templo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso diretamente no texto hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o tetragrama; 'Yahweh' preserva o nome próprio em vez de substituí-lo por um título.
- issue: Sentido do termo cultual שְׁלָמִים
  choice: ofertas de paz
  alternative: ofertas de comunhão
  rationale: '''Ofertas de paz'' conserva a designação sacrificial tradicional e deixa aberta a amplitude semântica do termo; a alternativa é registrada em nota.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega terminologia cultual consolidada e preserva a estrutura cumulativa do hebraico sem rigidez excessiva.
