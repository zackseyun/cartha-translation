  text: וַ/יְהִ֞י מִסְפַּ֣ר הָ/עֹלָה֮ אֲשֶׁ֣ר הֵבִ֣יאוּ הַ/קָּהָל֒ בָּקָ֣ר שִׁבְעִ֔ים אֵילִ֥ים מֵאָ֖ה כְּבָשִׂ֣ים מָאתָ֑יִם לְ/עֹלָ֥ה לַ/יהוָ֖ה כָּל אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/032.yaml
  text: And the number of the burnt offerings that the assembly brought was seventy cattle, one hundred rams, and two hundred lambs; all these were for a burnt offering to the LORD.
translation:
  language: pt
  text: O número dos holocaustos que a assembleia trouxe foi de setenta cabeças de gado, cem carneiros e duzentos cordeiros. Todos esses animais foram oferecidos como holocausto ao SENHOR.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֹלָה / לְעֹלָה
  choice: holocaustos / como holocausto
  rationale: “Holocausto” é o termo bíblico português tradicional e ainda inteligível para a oferta inteiramente queimada; a repetição acompanha a estrutura e a ênfase do hebraico.
- source_word: הַקָּהָל
  choice: a assembleia
  rationale: Expressa o corpo reunido do povo em linguagem clara e preserva o sentido coletivo do hebraico.
- source_word: בָּקָר
  choice: cabeças de gado
  rationale: O substantivo coletivo designa gado bovino sem especificar necessariamente sexo; “cabeças de gado” permite manter a contagem e evita restringir o sentido a “touros”.
- source_word: אֵילִים
  choice: carneiros
  rationale: Equivalente natural e específico para machos adultos do rebanho ovino.
- source_word: כְּבָשִׂים
  choice: cordeiros
  rationale: Equivalente corrente para animais jovens do rebanho ovino.
- source_word: יהוה
  choice: SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o nome divino pelo título em versaletes/caixa alta.
theological_decisions:
- issue: Identidade dos animais designados por בָּקָר
  choice: cabeças de gado
  alternative: touros/bois
  rationale: O hebraico usa um termo coletivo para gado bovino e não marca aqui o sexo; a tradução não acrescenta uma especificação ausente do texto.
- issue: Representação do Tetragrama
  choice: SENHOR
  alternative: YHWH/Iavé/Yahweh
  rationale: A forma convencional preserva a distinção gráfica do nome divino sem impor uma vocalização discutida.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A primeira oração mantém o relatório numérico do hebraico; a segunda torna natural em português a cláusula recapitulativa “todos estes”, explicitando “animais” sem alterar o referente.
