reference: 2 Chronicles 29:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אֵ֣ת כָּל הַ/כֵּלִ֗ים אֲשֶׁ֣ר הִזְנִיחַ֩ הַ/מֶּ֨לֶךְ אָחָ֧ז בְּ/מַלְכוּת֛/וֹ בְּ/מַעֲל֖/וֹ הֵכַ֣נּוּ וְ/הִקְדָּ֑שְׁנוּ וְ/הִנָּ֕/ם לִ/פְנֵ֖י מִזְבַּ֥ח יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/019.yaml
  text: And all the vessels that King Ahaz cast aside during his reign in his unfaithfulness[a], we have prepared and consecrated; and behold[b], they are before the altar of Yahweh.
translation:
  language: pt
  text: E todos os utensílios que o rei Acaz pôs de lado[a] durante o seu reinado, em sua infidelidade[b], nós preparamos e consagramos; e eis que estão diante do altar de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “abandonou” ou “negligenciou”.
    reason: lexical_alternative
  - marker: b
    text: Ou “em sua transgressão” ou “quando agiu de modo infiel”. O hebraico enfatiza a quebra de fidelidade de Acaz.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּלִים
  choice: os utensílios
  rationale: No contexto do templo, כֵּלִים designa os objetos ou instrumentos usados no serviço sagrado. “Utensílios” é claro, abrangente e natural em português.
- source_word: הִזְנִיחַ
  choice: pôs de lado
  rationale: O verbo indica que Acaz rejeitou ou deixou de usar os utensílios. “Pôs de lado” preserva essa ação deliberada sem especificar indevidamente que foram destruídos.
- source_word: בְּמַלְכוּתוֹ
  choice: durante o seu reinado
  rationale: A expressão tem sentido temporal e é vertida de modo idiomático em português.
- source_word: בְּמַעֲלוֹ
  choice: em sua infidelidade
  rationale: מַעַל denota quebra de fidelidade, especialmente perante Deus. “Infidelidade” conserva a dimensão moral e religiosa do termo.
- source_word: הֵכַנּוּ
  choice: nós preparamos
  rationale: O hifil de כון expressa preparar ou deixar pronto; a inclusão de “nós” explicita naturalmente o sujeito já marcado na forma verbal hebraica.
- source_word: וְהִקְדָּשְׁנוּ
  choice: e consagramos
  rationale: O hifil de קדשׁ significa separar para uso santo. “Consagramos” é adequado ao contexto cultual do templo.
- source_word: וְהִנָּם
  choice: e eis que estão
  rationale: A construção chama a atenção para a condição e localização presentes dos utensílios. “E eis que estão” preserva sua força demonstrativa e o tom solene.
- source_word: לִפְנֵי מִזְבַּח יְהוָה
  choice: diante do altar de Yahweh
  rationale: לִפְנֵי significa “diante de” ou “na presença de”; o nome divino é transliterado como “Yahweh”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama. “Yahweh” representa o nome próprio e evita substituí-lo por um título.
- issue: Sentido religioso de מַעַל
  choice: infidelidade
  alternative: transgressão; ato de deslealdade
  rationale: A escolha mantém a ideia de quebra de fidelidade para com Deus sem limitar o termo a uma infração jurídica genérica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva a sequência do hebraico sem soar artificial; “e eis que” mantém deliberadamente a força enfática do texto.
