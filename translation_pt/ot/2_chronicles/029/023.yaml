base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/023.yaml
  text: Then they brought near the goats for the sin offering before the king and the assembly[b][a], and they laid their hands on them.
translation:
  language: pt
  text: Então trouxeram perante o rei e a assembleia os bodes da oferta pelo pecado, e o rei e a assembleia puseram as mãos sobre eles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “puseram suas mãos sobre eles”. O sujeito se refere mais naturalmente ao rei e à assembleia, que talvez tenham agido por meio de representantes.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגִּישׁוּ
  choice: trouxeram ... para diante
  rationale: O hifil de נגשׁ expressa fazer chegar perto ou apresentar. A formulação comunica tanto o movimento quanto a apresentação cerimonial em português natural.
- source_word: שְׂעִירֵי הַחַטָּאת
  choice: os bodes da oferta pelo pecado
  rationale: שְׂעִירֵי designa bodes, e חַטָּאת, neste contexto sacrificial, designa a oferta pelo pecado, não o pecado em sentido abstrato.
- source_word: לִפְנֵי
  choice: para diante de
  rationale: No contexto cerimonial, indica que os animais foram levados à presença do rei e da assembleia para serem apresentados.
- source_word: הַמֶּלֶךְ וְהַקָּהָל
  choice: o rei e a assembleia
  rationale: קָהָל indica a comunidade reunida. “Assembleia” é claro, atual e evita uma conotação eclesiástica desnecessária.
- source_word: וַיִּסְמְכוּ יְדֵיהֶם
  choice: puseram as mãos
  rationale: סמך com “mãos”, em contexto sacrificial, refere-se ao gesto ritual de colocar as mãos sobre o animal. “Puseram as mãos” é natural e preserva o sentido concreto.
- source_word: עֲלֵיהֶם
  choice: sobre eles
  rationale: O pronome retoma os bodes; “sobre eles” reproduz de modo direto a relação expressa no hebraico.
theological_decisions:
- issue: Sentido de חַטָּאת no contexto sacrificial
  choice: oferta pelo pecado
  alternative: pecado
  rationale: A referência a bodes apresentados e ao gesto de pôr as mãos sobre eles confirma que חַטָּאת designa aqui o sacrifício oferecido por causa do pecado.
- issue: Sujeito de “puseram as mãos”
  choice: o rei e a assembleia, possivelmente por meio de representantes
  alternative: os sacerdotes
  rationale: Os antecedentes mais próximos são “o rei e a assembleia”, e “suas mãos” aponta naturalmente para eles. “Estes” torna essa ligação clara, enquanto a nota preserva a possibilidade prática de ação representativa sem inseri-la como certeza no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Assembleia” preserva o caráter comunitário e litúrgico sem linguagem denominacional; “oferta pelo pecado” mantém a terminologia sacrificial.
