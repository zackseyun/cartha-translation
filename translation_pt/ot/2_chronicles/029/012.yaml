    issue: Construção “dos filhos dos coatitas”
    rationale: Embora compreensível, a formulação é pouco idiomática e pode sugerir filhos de vários coatitas. O hebraico é uma fórmula de descendência/clã, vertida mais naturalmente por “dos filhos de Coate”.
  - severity: low
    issue: Nota a não informa que a mesma fórmula se repete para Merari
    rationale: A nota inglesa de auditoria explicita o alcance das duas ocorrências da fórmula genealógica. A nota portuguesa pode esclarecê-lo brevemente, preservando a função da nota e a estrutura do hebraico.
