base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/012.yaml
  text: 'Then the Levites arose: Mahath son of Amasai and Joel son of Azariah[a], from the sons of the Kohathites; and from the sons of Merari, Kish son of Abdi and Azariah son of Jehallelel; and from the Gershonites[b], Joah son of Zimmah and Eden son of Joah.'
translation:
  language: pt
  text: 'Então se levantaram os levitas: Maate, filho de Amasai, e Joel, filho de Azarias, dos filhos de Coate[a]; dos filhos de Merari, Quis, filho de Abdi, e Azarias, filho de Jealelel; e dos gersonitas[b], Joá, filho de Zima, e Éden, filho de Joá.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “dos filhos de Coate”; a mesma fórmula ocorre em “dos filhos de Merari”. Essa linguagem genealógica identifica os homens mencionados como membros ou representantes desses clãs levíticos.
    reason: cultural_note
  - marker: b
    text: 'Ou: “dos descendentes de Gérson”. Aqui o hebraico emprega uma designação de clã, em vez de repetir exatamente a fórmula anterior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: se levantaram
  rationale: O wayyiqtol de קום inicia a ação em resposta à ordem anterior; “se levantaram” conserva o sentido formal e é natural em português.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: Designação tradicional e transparente do grupo, com o artigo definido preservado.
- source_word: מִן בְּנֵי הַקְּהָתִי
  choice: dos filhos dos coatitas
  rationale: Mantém a expressão genealógica hebraica, ainda que incomum, e identifica os homens como integrantes ou representantes do clã coatita.
- source_word: וּמִן בְּנֵי מְרָרִי
  choice: dos filhos de Merari
  rationale: Preserva a repetição da fórmula genealógica e a vinculação dos nomes ao clã de Merari.
- source_word: וּמִן הַגֵּרְשֻׁנִּי
  choice: e dos gersonitas
  rationale: O gentílico singular com artigo tem valor coletivo; “dos gersonitas” exprime naturalmente essa designação de clã.
- source_word: בֶּן
  choice: filho de
  rationale: É a tradução normal e direta neste registro genealógico, sem necessidade contextual de ampliar para “descendente de”.
- source_word: מַחַת; עֲמָשַׂי; יוֹאֵל; עֲזַרְיָהוּ; קִישׁ; עַבְדִּי; יְהַלֶּלְאֵל; יוֹאָח; זִמָּה; עֵדֶן
  choice: Maate; Amasai; Joel; Azarias; Quis; Abdi; Jealelel; Joá; Zima; Éden
  rationale: Os nomes próprios são transliterados segundo formas bíblicas reconhecíveis e convenções ortográficas naturais em português.
