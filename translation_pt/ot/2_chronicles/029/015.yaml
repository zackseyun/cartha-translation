base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/015.yaml
  text: They gathered their brothers[a], consecrated themselves, and came, according to the command of the king by the words of Yahweh[c][b], to cleanse the house of Yahweh.
translation:
  language: pt
  text: Eles reuniram seus irmãos[a], consagraram-se e vieram, conforme a ordem do rei, segundo as palavras de Yahweh[b], para purificar a casa de Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, os outros levitas.
    reason: contextual_clarification
  - marker: b
    text: A expressão hebraica também pode ser entendida como “pela palavra de Yahweh”; ela relaciona a ordem do rei às palavras de Yahweh sem explicitar inteiramente essa relação.
    reason: source_ambiguity
  - marker: c
    text: Isto é, o templo de Yahweh.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיַּאַסְפוּ אֶת־אֲחֵיהֶם
  choice: Eles reuniram seus irmãos
  rationale: Mantém o sentido ativo de אסף e o termo de parentesco אחים. No contexto, os “irmãos” são outros levitas, mas a tradução preserva a formulação do hebraico.
- source_word: וַיִּתְקַדְּשׁוּ
  choice: consagraram-se
  rationale: O hitpael de קדשׁ indica que se prepararam ritualmente para o serviço sagrado; “consagraram-se” é natural e adequado ao contexto do templo.
- source_word: וַיָּבֹאוּ
  choice: vieram
  rationale: Reproduz o sentido básico do verbo sem acrescentar um objeto ou indicar explicitamente entrada, algo que o hebraico não declara aqui.
- source_word: כְמִצְוַת הַמֶּלֶךְ
  choice: conforme a ordem do rei
  rationale: Expressa de modo claro e natural que a ação obedecia à determinação real.
- source_word: בְּדִבְרֵי יְהוָה
  choice: segundo as palavras de Yahweh
  rationale: Preserva o plural דִבְרֵי e apresenta a instrução divina como norma ou fundamento da ordem do rei, sem converter “palavras” em “mandamento”.
- source_word: לְטַהֵר
  choice: para purificar
  rationale: No contexto cultual, o piel de טהר se refere à remoção de impureza ritual; “purificar” comunica esse sentido com clareza.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Conserva a expressão hebraica literal e reconhecível, em vez de substituí-la no texto por “templo”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Relação entre a ordem do rei e as palavras de Yahweh
  choice: conforme a ordem do rei, segundo as palavras de Yahweh
  alternative: conforme a ordem do rei dada pelas palavras de Yahweh
  rationale: A construção com ב pode indicar a base, o meio ou a norma da ordem real. A redação escolhida mantém a relação suficientemente aberta e evita afirmar que Yahweh falou diretamente por meio do rei.
- issue: Forma de verter o nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico traz o Tetragrama como nome próprio; “Yahweh” preserva essa distinção sem importar uma interpretação denominacional.
- issue: Identidade dos “irmãos”
  choice: irmãos
  alternative: companheiros levitas
  rationale: O contexto identifica o grupo como levitas, mas o texto emprega o termo masculino de parentesco. A tradução conserva o termo, e a nota esclarece o referente contextual.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. A sintaxe mantém o encadeamento narrativo do hebraico, enquanto as vírgulas esclarecem a relação entre a ordem real e as palavras divinas. “Casa de Yahweh” conserva a imagem cultual do original; “templo” aparece apenas em nota.
