base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/028.yaml
  text: And all the assembly was bowing down[a], while the song was being sung and the trumpets were sounding—all this continued until the burnt offering was finished.
translation:
  language: pt
  text: Toda a assembleia se prostrava, enquanto o cântico era entoado[a] e as trombetas soavam. Tudo isso continuou até terminar o holocausto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “o cântico cantava/soava”. O hebraico traz “o cântico” com um particípio, expressão idiomática vertida de modo mais natural como “o cântico era entoado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָּהָל
  choice: assembleia
  rationale: Designa a comunidade reunida para o culto; “assembleia” preserva o sentido coletivo sem acrescentar associações eclesiásticas posteriores.
- source_word: מִשְׁתַּחֲוִים
  choice: se prostrava
  rationale: O particípio descreve o ato corporal de curvar-se ou prostrar-se. A concordância no singular acompanha naturalmente o coletivo “toda a assembleia”.
- source_word: הַשִּׁיר
  choice: o cântico
  rationale: Mantém o substantivo concreto “cântico”, apropriado ao contexto litúrgico, em vez de convertê-lo diretamente em “o canto” ou “os cantores”.
- source_word: מְשׁוֹרֵר
  choice: era entoado
  rationale: Com “o cântico” como sujeito, a forma passiva expressa em português natural a construção idiomática hebraica, literalmente próxima de “o cântico cantava/soava”.
- source_word: חֲצֹצְרוֹת
  choice: trombetas
  rationale: É o equivalente corrente para as trombetas retas de uso cultual; não se acrescenta “de prata”, pois isso não está explícito neste versículo.
- source_word: מחצצרים
  choice: soavam
  rationale: A forma indica que as trombetas estavam sendo tocadas. “Soavam” é natural em português e preserva as trombetas como sujeito gramatical.
- source_word: הַכֹּל
  choice: Tudo isso
  rationale: O termo resume as ações de culto anteriormente descritas e as apresenta como continuando em conjunto.
- source_word: עַד לִכְלוֹת
  choice: até terminar
  rationale: O infinitivo marca o ponto final das ações; a formulação é clara e idiomática em português.
- source_word: הָעֹלָה
  choice: o holocausto
  rationale: Termo tradicional e preciso em português bíblico para a oferta inteiramente queimada, sem confundi-la com uma simples oferta queimada parcialmente.
