  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Cântico”, “trombetas” e “holocausto” preservam o registro cultual do contexto sem arcaísmo sintático. O marcador da nota foi colocado junto à expressão a que a nota efetivamente se refere.
