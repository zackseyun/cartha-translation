base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/014.yaml
  text: 'And from the sons of Heman: Jehuel and Shimei[a]; and from the sons of Jeduthun: Shemaiah and Uzziel.'
translation:
  language: pt
  text: 'E dos filhos de Hemã: Jeuel e Simei; e dos filhos de Jedutum: Semaías e Uziel.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן
  choice: e, dos
  rationale: A conjunção ו liga o versículo à enumeração anterior, enquanto מִן indica procedência ou pertencimento; “e, dos” preserva o fluxo aditivo da lista.
- source_word: בְּנֵי
  choice: filhos de
  rationale: É a correspondência mais direta e transparente; neste contexto genealógico e levítico, pode abranger integrantes de uma linhagem familiar.
- source_word: הֵימָן
  choice: Hemã
  rationale: Forma tradicional e amplamente reconhecível em português para o nome hebraico.
- source_word: יחואל
  choice: Jeuel
  rationale: Transliteração portuguesa direta do nome conforme a forma consonantal e a vocalização massorética deste versículo.
- source_word: וְשִׁמְעִי
  choice: e Simei
  rationale: Mantém a conjunção da lista e emprega a forma portuguesa usual do nome.
- source_word: יְדוּתוּן
  choice: Jedutum
  rationale: Forma tradicional do nome em português, próxima da vocalização hebraica.
- source_word: שְׁמַעְיָה
  choice: Semaías
  rationale: Forma portuguesa tradicional que representa adequadamente o nome hebraico.
- source_word: וְעֻזִּיאֵל
  choice: e Uziel
  rationale: Preserva a conjunção final e usa a forma portuguesa consolidada do nome.
