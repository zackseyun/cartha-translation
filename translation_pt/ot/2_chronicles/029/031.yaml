base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/031.yaml
  text: Then Hezekiah answered and said[a], “Now you have filled your hand for Yahweh. Come near and bring sacrifices and thank offerings to the house of Yahweh.” And the assembly brought sacrifices and thank offerings, and all who were willing of heart brought burnt offerings.
translation:
  language: pt
  text: 'Então Ezequias respondeu e disse: “Agora vocês se consagraram a Yahweh[a]. Aproximem-se e tragam sacrifícios e ofertas de gratidão à casa de Yahweh.” A assembleia trouxe sacrifícios e ofertas de gratidão, e todos os que tinham o coração disposto trouxeram holocaustos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “vocês encheram a mão para Yahweh”, expressão hebraica que indica consagração ou investidura para o serviço sagrado.
    reason: Explica o idioma hebraico מִלֵּאתֶם יֶדְכֶם e preserva sua forma literal como alternativa lexical.
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: respondeu e disse
  rationale: Preserva a fórmula narrativa hebraica, embora em português corrente os dois verbos possam parecer parcialmente redundantes.
- source_word: מִלֵּאתֶם יֶדְכֶם לַיהוָה
  choice: vocês se consagraram ao serviço de Yahweh
  rationale: Traduz o sentido reconhecido do idioma, literalmente “encheram a mão para Yahweh”, usado para consagração ou investidura no serviço sagrado. A nota conserva a forma concreta do hebraico.
- source_word: גֹּשׁוּ
  choice: Aproximem-se
  rationale: Expressa tanto o movimento de chegar perto quanto a conotação cultual de aproximar-se para adorar.
- source_word: זְבָחִים
  choice: sacrifícios
  rationale: Termo amplo e natural para animais oferecidos em sacrifício.
- source_word: תוֹדוֹת
  choice: ofertas de gratidão
  rationale: Comunica a categoria de sacrifícios oferecidos em ação de graças sem reduzir o termo a uma simples expressão verbal de agradecimento.
- source_word: לְבֵית יְהוָה
  choice: à casa de Yahweh
  rationale: Mantém a expressão hebraica “casa de Yahweh” e usa a contração portuguesa adequada ao movimento em direção ao santuário.
- source_word: הַקָּהָל
  choice: a assembleia
  rationale: Designa com clareza a comunidade reunida para o culto.
- source_word: כָל נְדִיב לֵב
  choice: todos os que tinham o coração disposto
  rationale: Preserva a referência hebraica ao coração e comunica que as ofertas eram voluntárias.
- source_word: עֹלוֹת
  choice: holocaustos
  rationale: É o termo bíblico português estabelecido para ofertas totalmente queimadas, sem sugerir o sentido histórico moderno quando lido no contexto sacrificial.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama; “Yahweh” preserva o nome da aliança e segue a orientação fornecida, sem substituí-lo por um título.
- issue: Sentido de מִלֵּאתֶם יֶדְכֶם
  choice: vocês se consagraram ao serviço de Yahweh
  alternative: vocês encheram a mão para Yahweh
  rationale: A expressão é um idioma de consagração ou investidura sagrada. A tradução no corpo comunica esse sentido em português atual, enquanto a nota registra a imagem literal e sua possível nuance de instalação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Casa de Yahweh”, “assembleia” e “coração disposto” conservam imagens importantes do hebraico; “holocaustos” mantém a terminologia sacrificial tradicional.
