source:
  edition: WLC
  text: רַ֤ק הַ/כֹּֽהֲנִים֙ הָי֣וּ לִ/מְעָ֔ט וְ/לֹ֣א יָֽכְל֔וּ לְ/הַפְשִׁ֖יט אֶת כָּל הָ/עֹל֑וֹת וַֽ/יְּחַזְּק֞וּ/ם אֲחֵי/הֶ֣ם הַ/לְוִיִּ֗ם עַד כְּל֤וֹת הַ/מְּלָאכָה֙ וְ/עַ֣ד יִתְקַדְּשׁ֣וּ הַ/כֹּֽהֲנִ֔ים כִּ֤י הַ/לְוִיִּם֙ יִשְׁרֵ֣י לֵבָ֔ב לְ/הִתְקַדֵּ֖שׁ מֵֽ/הַ/כֹּהֲנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/034.yaml
  text: Only the priests were too few[a], and they were not able to skin all the burnt offerings, so their brothers the Levites supported them until the work was finished and until the priests had consecrated themselves[b]. For the Levites were more upright in heart to consecrate themselves than the priests.
translation:
  language: pt
  text: Contudo, os sacerdotes eram poucos demais e não conseguiam tirar a pele de todos os holocaustos. Por isso, seus irmãos, os levitas, os ajudaram[a] até que o trabalho terminasse e até que os sacerdotes se consagrassem. Pois os levitas foram mais íntegros de coração[b] ao se consagrarem do que os sacerdotes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “os fortaleceram”; isto é, prestaram-lhes auxílio.
    reason: lexical_alternative
  - marker: b
    text: Ou “mais sinceros de coração” ou “mais retos de coração”. O hebraico ressalta a sinceridade ou retidão interior.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Contudo
  rationale: A partícula introduz aqui uma limitação em contraste com o contexto anterior. “Contudo” expressa esse valor adversativo de modo natural em português.
- source_word: לִמְעָט
  choice: poucos demais
  rationale: Com הָיוּ, a expressão indica insuficiência numérica, como confirma a incapacidade mencionada em seguida, e não apenas um número pequeno.
- source_word: לְהַפְשִׁיט
  choice: tirar a pele
  rationale: O verbo designa a retirada da pele dos animais sacrificados. A locução é clara e natural para leitores comuns, sem perder o sentido concreto.
- source_word: הָעֹלוֹת
  choice: os holocaustos
  rationale: “Holocausto” é o termo sacrificial tradicional e ainda corrente em português bíblico para a oferta inteiramente queimada.
- source_word: וַיְחַזְּקוּם
  choice: os ajudaram
  rationale: Literalmente, o verbo significa “os fortaleceram”, mas neste contexto descreve o auxílio prático prestado pelos levitas para concluir o trabalho. A alternativa literal é preservada em nota.
- source_word: אֲחֵיהֶם
  choice: seus irmãos
  rationale: Mantém a imagem familiar do hebraico e identifica os levitas como companheiros israelitas e servidores do templo.
- source_word: עַד כְּלוֹת הַמְּלָאכָה
  choice: até que o trabalho terminasse
  rationale: A construção indica duração até a conclusão da tarefa sacrificial.
- source_word: יִתְקַדְּשׁוּ / לְהִתְקַדֵּשׁ
  choice: se consagrassem / ao se consagrarem
  rationale: No contexto do culto, o hitpael de קדשׁ se refere à preparação ou consagração ritual da própria pessoa para o serviço sagrado.
- source_word: יִשְׁרֵי לֵבָב
  choice: mais íntegros de coração
  rationale: A expressão enfatiza retidão ou sinceridade interior. “Íntegros de coração” conserva a imagem hebraica e, com “mais”, mantém a comparação marcada por מִן.
theological_decisions:
- issue: Natureza da comparação entre levitas e sacerdotes
  choice: Os levitas foram mais íntegros de coração ao se consagrarem do que os sacerdotes.
  alternative: Os levitas foram mais diligentes, mais dispostos ou mais rápidos para se consagrar do que os sacerdotes.
  rationale: O hebraico יִשְׁרֵי לֵבָב aponta primariamente para retidão ou sinceridade interior, não apenas rapidez ou eficiência. A tradução mantém a avaliação comparativa no âmbito desta situação específica, sem transformá-la numa condenação geral do sacerdócio.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Holocaustos” preserva o vocabulário cultual estabelecido; “tirar a pele” evita o tecnicismo menos comum “esfolar”. Os marcadores de nota foram posicionados junto às expressões que explicam.
