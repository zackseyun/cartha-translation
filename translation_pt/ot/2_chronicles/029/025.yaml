source:
  edition: WLC
  text: וַ/יַּֽעֲמֵ֨ד אֶת הַ/לְוִיִּ֜ם בֵּ֣ית יְהוָ֗ה בִּ/מְצִלְתַּ֨יִם֙ בִּ/נְבָלִ֣ים וּ/בְ/כִנֹּר֔וֹת בְּ/מִצְוַ֥ת דָּוִ֛יד וְ/גָ֥ד חֹזֵֽה הַ/מֶּ֖לֶךְ וְ/נָתָ֣ן הַ/נָּבִ֑יא כִּ֧י בְ/יַד יְהוָ֛ה הַ/מִּצְוָ֖ה בְּ/יַד נְבִיאָֽי/ו־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/025.yaml
  text: He stationed the Levites in the house of Yahweh with cymbals[a], harps, and lyres, according to the command of David and of Gad the king’s seer and Nathan the prophet[b], for the command was from Yahweh through his prophets.
translation:
  language: pt
  text: Ele colocou os levitas na casa de Yahweh, com címbalos, harpas e liras, conforme a ordem de Davi, de Gade, o vidente do rei,[a] e do profeta Natã, pois a ordem vinha de Yahweh por meio de seus profetas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Vidente” traduz חֹזֶה, título relacionado à função profética, mas distinto do termo traduzido por “profeta” na continuação do versículo.
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “pois pela mão de Yahweh veio a ordem, pela mão de seus profetas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: colocou
  rationale: O hifil de עמד indica que ele fez os levitas tomarem seus lugares. “Colocou” expressa isso de modo natural, sem acrescentar uma nomeação formal que o verbo não exige.
- source_word: בֵּית יְהוָה
  choice: casa de Yahweh
  rationale: Preserva a expressão hebraica tradicional para o santuário, mantendo sua transparência em vez de substituí-la por “templo”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: בִּמְצִלְתַּיִם
  choice: com címbalos
  rationale: O bet tem valor instrumental, e “címbalos” é o equivalente português estabelecido.
- source_word: בִּנְבָלִים
  choice: harpas
  rationale: נבל designa um instrumento de cordas cuja identificação exata é incerta; “harpas” é uma tradução tradicional, clara e distinta de כִּנּוֹר.
- source_word: וּבְכִנֹּרוֹת
  choice: e liras
  rationale: כִּנּוֹר é geralmente identificado como lira; a escolha evita confundi-lo com נבל.
- source_word: בְּמִצְוַת דָּוִיד
  choice: conforme a ordem de Davi
  rationale: A expressão indica conformidade com uma determinação autorizada; “conforme a ordem” é corrente e fiel.
- source_word: גָּד חֹזֵה הַמֶּלֶךְ
  choice: Gade, o vidente do rei
  rationale: Mantém “vidente” para חֹזֶה e a relação de Gade com o rei, sem nivelar o título a “profeta”.
- source_word: נָתָן הַנָּבִיא
  choice: o profeta Natã
  rationale: Forma idiomática em português para o título em aposição, preservando נָבִיא como “profeta”.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação de que a ordem tinha sua fonte última em Yahweh.
- source_word: בְיַד יְהוָה ... בְיַד נְבִיאָיו
  choice: vinha de Yahweh por meio de seus profetas
  rationale: Comunica a fonte divina e a mediação profética expressas pela repetição do idioma “pela mão de”, evitando uma formulação pouco natural em português.
theological_decisions:
- issue: Relação entre a organização litúrgica davídica e a autoridade divina
  choice: A ordem é atribuída a Davi, Gade e Natã, mas sua fonte última é Yahweh, que a comunicou por meio de seus profetas.
  alternative: Entender a disposição musical apenas como política real de Davi posteriormente revestida de sanção divina.
  rationale: A oração כִּי בְיַד יְהוָה הַמִּצְוָה בְּיַד נְבִיאָיו fundamenta explicitamente a ordem em Yahweh e apresenta os profetas como mediadores, preservando ambos os níveis de agência.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A formulação conserva “casa de Yahweh” e diferencia “vidente” de “profeta”, enquanto verte de maneira idiomática a metáfora hebraica de agência “pela mão de”.
