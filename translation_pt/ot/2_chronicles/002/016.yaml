base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/016.yaml
  text: Then Solomon counted all the resident foreigners who were in the land of Israel[a], after the census that David his father had taken of them, and they were found to be one hundred fifty-three thousand six hundred.
translation:
  language: pt
  text: Então Salomão contou todos os estrangeiros residentes que viviam na terra de Israel[a], após o censo que seu pai Davi havia realizado entre eles[b]. Foram encontrados cento e cinquenta e três mil e seiscentos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os residentes estrangeiros” ou “os imigrantes residentes”. O termo hebraico se refere a não israelitas que viviam no território de Israel.
    reason: lexical_alternative
  - marker: b
    text: Ou “segundo o censo que seu pai Davi havia realizado entre eles”.
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיִּסְפֹּר
  choice: contou
  rationale: O verbo ספר indica contar ou enumerar pessoas. “Contou” é claro e natural, sem explicitar além do necessário a ideia de um censo, que aparece logo depois.
- source_word: הָאֲנָשִׁים הַגֵּירִים
  choice: os estrangeiros residentes
  rationale: גֵּרִים designa estrangeiros estabelecidos no território israelita, não simples viajantes. A expressão comunica em português atual tanto a origem estrangeira quanto a residência permanente ou prolongada.
- source_word: בְּאֶרֶץ יִשְׂרָאֵל
  choice: na terra de Israel
  rationale: Preserva o sentido territorial de אֶרֶץ e acompanha de perto a formulação hebraica.
- source_word: אַחֲרֵי הַסְּפָר
  choice: após o censo
  rationale: A expressão aponta para uma contagem anterior e, em seu sentido mais direto, situa a ação de Salomão depois dela. Uma possível leitura comparativa ou normativa é preservada em nota.
- source_word: אֲשֶׁר סְפָרָם דָּוִיד אָבִיו
  choice: que seu pai Davi havia realizado entre eles
  rationale: “Realizar um censo entre eles” é idiomático e deixa claro que os estrangeiros residentes foram o grupo recenseado. “Seu pai Davi” reproduz naturalmente a relação expressa no hebraico.
- source_word: וַיִּמָּצְאוּ
  choice: foram encontrados
  rationale: 'Mantém o valor passivo e resultativo do nifal de מצא: esse foi o total apurado pela contagem.'
- source_word: מֵאָה וַחֲמִשִּׁים אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: cento e cinquenta e três mil e seiscentos
  rationale: Reproduz exatamente o total de 153.600 por extenso, de modo apropriado ao texto corrido.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Estrangeiros residentes” evita tanto o tom arcaico de “peregrinos” quanto o caráter excessivamente burocrático de “residentes estrangeiros”. A segunda frase foi separada para apresentar o total com clareza.
