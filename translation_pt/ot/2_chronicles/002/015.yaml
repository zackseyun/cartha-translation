  verdict: revise
  source_fidelity: 'A tradução reproduz corretamente os elementos centrais: a ênfase em «nós», o corte de madeira no Líbano conforme a necessidade do destinatário, o transporte em jangadas por mar até Jope e o destino final em Jerusalém. Contudo, «você a levará, subindo» é uma formulação ambígua e pouco idiomática: pode descrever o movimento do destinatário, não o transporte da madeira. O hebraico emprega a forma causativa de «subir», isto é, «você a fará subir»/«a levará para cima».'
