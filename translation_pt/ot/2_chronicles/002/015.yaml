  text: וַ֠/אֲנַחְנוּ נִכְרֹ֨ת עֵצִ֤ים מִן הַ/לְּבָנוֹן֙ כְּ/כָל צָרְכֶּ֔/ךָ וּ/נְבִיאֵ֥/ם לְ/ךָ֛ רַפְסֹד֖וֹת עַל יָ֣ם יָפ֑וֹ וְ/אַתָּ֛ה תַּעֲלֶ֥ה אֹתָ֖/ם יְרוּשָׁלִָֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/015.yaml
  text: And we will cut timber from Lebanon[a], as much as you need, and bring it to you as rafts by sea to Joppa[c][b]; and you will take it up to Jerusalem.
translation:
  language: pt
  text: Quanto a nós, cortaremos no Líbano toda a madeira de que você precisar e a levaremos para você em jangadas, pelo mar, até Jope[a]; e você a levará até Jerusalém.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jope é o antigo porto marítimo mais tarde conhecido como Jafa.
    reason: cultural_note
  - marker: b
    text: O hebraico diz literalmente “a fará subir a Jerusalém”; “subir” reflete a maior altitude da cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: Quanto a nós
  rationale: O pronome explícito introduz com leve ênfase a ação dos remetentes; “Quanto a nós” reproduz essa transição de modo natural.
- source_word: נִכְרֹת עֵצִים
  choice: cortaremos ... madeira
  rationale: כרת, neste contexto, significa cortar ou derrubar árvores, enquanto עֵצִים designa a madeira destinada à construção. A formulação evita tratar o material apenas como árvores ainda em pé.
- source_word: מִן הַלְּבָנוֹן
  choice: no Líbano
  rationale: Em português, “cortar madeira no Líbano” expressa naturalmente a origem e o local da extração indicados pela preposição hebraica מן.
- source_word: כְּכָל צָרְכֶּךָ
  choice: toda a madeira de que você precisar
  rationale: Expressa a quantidade conforme a necessidade de Salomão e integra com clareza o referente “madeira”.
- source_word: וּנְבִיאֵם לְךָ
  choice: e a levaremos para você
  rationale: O sufixo hebraico é plural e retoma as peças de madeira; em português, “madeira” funciona naturalmente como substantivo coletivo no singular.
- source_word: רַפְסֹדוֹת
  choice: em jangadas
  rationale: O termo descreve madeira reunida em estruturas flutuantes para transporte marítimo; “em jangadas” comunica o método sem excesso de explicação.
- source_word: עַל יָם יָפוֹ
  choice: pelo mar, até Jope
  rationale: A expressão indica transporte marítimo tendo Jope como destino. “Jope” é a forma bíblica portuguesa tradicional e amplamente reconhecida.
- source_word: תַּעֲלֶה אֹתָם
  choice: você a levará, subindo
  rationale: Preserva o sentido direcional de עלה e a subida topográfica rumo a Jerusalém, mantendo a concordância natural com o coletivo “madeira”.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalém
  rationale: Forma portuguesa convencional do nome do lugar.
theological_decisions: []
