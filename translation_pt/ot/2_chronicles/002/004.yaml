  yaml_path: translation/ot/2_chronicles/002/004.yaml
  text: And the house that I am building will be great[b][a], for our God is greater than all gods.
translation:
  language: pt
  text: E a casa que estou construindo é grande[a], pois o nosso Deus é maior que todos os deuses.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o templo que estou construindo é grande”. O hebraico diz literalmente “a casa que estou construindo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o nosso Deus é grande acima de todos os deuses”. O hebraico emprega “grande” com “que todos os deuses” para expressar comparação.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/הַ/בַּיִת
  choice: E a casa
  rationale: בַּיִת significa literalmente “casa” e, neste contexto, designa o santuário. “Casa” preserva tanto a forma hebraica quanto sua ressonância como casa de Deus; “templo” é uma alternativa contextual.
- source_word: אֲשֶׁר אֲנִי בוֹנֶה
  choice: que estou construindo
  rationale: A construção relativa com o particípio בוֹנֶה expressa a obra em andamento ou concebida como empreendimento presente. A forma portuguesa é natural e mantém esse aspecto.
- source_word: גָּדוֹל
  choice: será grande
  rationale: O adjetivo abrange grandeza de dimensão e importância. Como o hebraico não traz cópula expressa, “será” torna explícito em português o sentido futuro sugerido pelo contexto sem reduzir “grande” a mero tamanho físico.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da afirmação anterior; “pois” conserva a relação explicativa em registro digno e corrente.
- source_word: גָדוֹל אֱלֹהֵינוּ מִכָּל הָאֱלֹהִים
  choice: o nosso Deus é maior que todos os deuses
  rationale: Embora גָדוֹל não tenha forma comparativa própria, a construção com מִן exige em português o comparativo “maior que”. אֱלֹהֵינוּ é “nosso Deus”, e הָאֱלֹהִים, neste contraste, é adequadamente vertido como “deuses”.
theological_decisions:
- issue: Comparação entre o Deus de Israel e outros deuses
  choice: o nosso Deus é maior que todos os deuses
  alternative: o nosso Deus é grande acima de todos os deuses; o nosso Deus é maior que todos os seres divinos
  rationale: A tradução mantém a afirmação comparativa e a tensão retórica do hebraico, sem decidir se “deuses” se refere a ídolos, falsos deuses ou seres celestiais.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Casa” preserva a imagem hebraica, enquanto a nota oferece “templo” como esclarecimento contextual. A ordem e as relações lógicas do original foram mantidas sem produzir sintaxe artificial.
