  text: וַ/יֹּ֨אמֶר חוּרָ֤ם מֶֽלֶךְ צֹר֙ בִּ/כְתָ֔ב וַ/יִּשְׁלַ֖ח אֶל שְׁלֹמֹ֑ה בְּ/אַהֲבַ֤ת יְהוָה֙ אֶת עַמּ֔/וֹ נְתָנְ/ךָ֥ עֲלֵי/הֶ֖ם מֶֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/010.yaml
  text: 'Then Huram king of Tyre answered in a letter that he sent to Solomon: “Because Yahweh loves his people[c][b][a], he has made you king over them.”'
translation:
  language: pt
  text: 'Então Huram[a], rei de Tiro, respondeu em uma carta[c] que enviou a Salomão: “Por causa do amor de Yahweh por seu povo[b], ele fez de você rei sobre eles.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico Huram; tradicionalmente, Hirão.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “Porque Yahweh ama o seu povo”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “disse por escrito e enviou a Salomão”.'
    reason: previous_rendering
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: respondeu
  rationale: No contexto, a fala de Huram responde à mensagem anterior de Salomão; “respondeu” expressa naturalmente essa função sem alterar o conteúdo.
- source_word: חוּרָם
  choice: Huram
  rationale: Representa diretamente a forma hebraica deste versículo e evita substituí-la silenciosamente pela forma portuguesa tradicional “Hirão”.
- source_word: מֶלֶךְ צֹר
  choice: rei de Tiro
  rationale: Reproduz com clareza a cadeia construta que identifica o cargo e o reino de Huram.
- source_word: בִּכְתָב
  choice: numa carta
  rationale: O substantivo indica uma comunicação escrita; “numa carta” é claro e natural neste contexto.
- source_word: וַיִּשְׁלַח אֶל שְׁלֹמֹה
  choice: que enviou a Salomão
  rationale: A subordinação evita uma coordenação redundante em português, mantendo tanto o ato de responder por escrito quanto o envio a Salomão.
- source_word: בְּאַהֲבַת
  choice: Porque ... ama
  rationale: 'A preposição ב com o substantivo abstrato pode ter sentido causal: o amor de Yahweh por seu povo é apresentado como a razão da entronização de Salomão.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso diretamente no texto hebraico, em vez de substituí-lo por um título.
- source_word: עַמּוֹ
  choice: o seu povo
  rationale: O sufixo remete a Yahweh; “seu povo” preserva a expressão coletiva e relacional do hebraico.
- source_word: נְתָנְךָ
  choice: fez de você
  rationale: Embora נתן signifique literalmente “dar”, neste uso com o cargo real comunica colocar ou constituir alguém como rei.
- source_word: עֲלֵיהֶם מֶלֶךְ
  choice: rei sobre eles
  rationale: Mantém a ideia de governo sobre as pessoas que compõem o povo e preserva o pronome plural do hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o Tetragrama como nome próprio. “Yahweh” preserva sua função nominal sem substituí-lo por um título.
- issue: Relação entre o amor de Yahweh e a realeza de Salomão
  choice: Porque Yahweh ama o seu povo
  alternative: Por causa do amor de Yahweh pelo seu povo
  rationale: A formulação causal conserva a afirmação de que a escolha do rei decorre do amor de Yahweh por seu povo, sem desenvolver implicações teológicas além do texto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “fez de você rei” é idiomática sem perder o sentido de nomeação; “sobre eles” conserva o plural hebraico, referindo-se às pessoas que formam o povo.
