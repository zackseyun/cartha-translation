  text: וּֽ/שְׁלַֽח לִ/י֩ עֲצֵ֨י אֲרָזִ֜ים בְּרוֹשִׁ֣ים וְ/אַלְגּוּמִּים֮ מֵֽ/הַ/לְּבָנוֹן֒ כִּ֚י אֲנִ֣י יָדַ֔עְתִּי אֲשֶׁ֤ר עֲבָדֶ֨י/ךָ֙ יֽוֹדְעִ֔ים לִ/כְר֖וֹת עֲצֵ֣י לְבָנ֑וֹן וְ/הִנֵּ֥ה עֲבָדַ֖/י עִם עֲבָדֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/007.yaml
  text: Send me cedar[a], cypress, and algum timber from Lebanon, for I know that your servants know how to cut timber in Lebanon. And behold[b], my servants will be with your servants.
translation:
  language: pt
  text: Envie-me do Líbano madeira de cedro, cipreste[a] e algumim[b], pois sei que os seus servos sabem cortar as árvores do Líbano. Eis que os meus servos estarão com os seus servos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “junípero” ou “abeto”; a espécie indicada pelo hebraico beroshim é incerta.
    reason: lexical_alternative
  - marker: b
    text: “Algumim” também pode ser transliterado “almugue”; alguns o identificam com sândalo, mas a espécie é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁלַח לִי
  choice: Envie-me
  rationale: O imperativo com o pronome dativo é expresso de modo direto e natural; o וּ inicial não exige um marcador temporal como “agora”.
- source_word: עֲצֵי אֲרָזִים
  choice: madeira de cedro
  rationale: No contexto de materiais de construção, o sintagma se refere à madeira obtida dos cedros, não apenas às árvores em pé.
- source_word: בְּרוֹשִׁים
  choice: cipreste
  rationale: É uma identificação tradicional e plausível, embora a espécie exata permaneça incerta; alternativas são registradas em nota.
- source_word: אַלְגּוּמִּים
  choice: algumim
  rationale: A transliteração evita identificar como certa uma espécie botânica desconhecida e, em português, distingue o termo do adjetivo indefinido “algum”.
- source_word: מֵהַלְּבָנוֹן
  choice: do Líbano
  rationale: Expressa com naturalidade a procedência geográfica das madeiras.
- source_word: כִּי אֲנִי יָדַעְתִּי
  choice: pois sei
  rationale: O perfeito hebraico comunica um estado presente de conhecimento; “pois” preserva a relação explicativa.
- source_word: אֲשֶׁר עֲבָדֶיךָ יֹדְעִים לִכְרוֹת
  choice: que os seus servos sabem cortar
  rationale: “Sabem” seguido do infinitivo reproduz de forma idiomática a habilidade expressa no hebraico.
- source_word: עֲצֵי לְבָנוֹן
  choice: as árvores do Líbano
  rationale: Mantém a referência concreta às árvores e a relação geográfica do construto hebraico.
- source_word: וְהִנֵּה
  choice: Eis que
  rationale: Preserva a função de chamar atenção para o acordo que segue, em registro bíblico digno e ainda compreensível.
- source_word: עֲבָדַי עִם עֲבָדֶיךָ
  choice: os meus servos estarão com os seus servos
  rationale: A oração nominal não traz verbo expresso; o futuro é adequado ao arranjo de trabalho proposto no contexto.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com sintaxe de ampla compreensão. “Eis que” conserva a força dêitica do hebraico sem acrescentar interpretação teológica. As notas aparecem junto aos termos a que efetivamente se referem.
