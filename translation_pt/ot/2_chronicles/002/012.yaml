  text: וְ/עַתָּ֗ה שָׁלַ֧חְתִּי אִישׁ חָכָ֛ם יוֹדֵ֥עַ בִּינָ֖ה לְ/חוּרָ֥ם אָבִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/012.yaml
  text: And now I have sent a wise man[a], skilled in understanding, Huram-abi.
translation:
  language: pt
  text: E agora enviei um homem sábio, perito em entendimento, Hurão-Abi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: Hurão-Abi. O último termo significa literalmente «meu pai», mas aqui provavelmente é um título honorífico ou parte da designação do artesão; compare «Hurão, seu pai» em 2Crônicas 4:16.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a ligação com o discurso anterior quanto a progressão temporal da resposta.
- source_word: שָׁלַחְתִּי
  choice: envio
  rationale: Embora a forma hebraica seja perfeita, no contexto epistolar ela pode apresentar como realizada a ação efetuada pela própria carta; o presente idiomático em português comunica naturalmente o envio em curso ou já decidido.
- source_word: אִישׁ חָכָם
  choice: um homem sábio
  rationale: Mantém o substantivo masculino e o sentido direto de חָכָם, cuja competência prática é esclarecida pela expressão seguinte.
- source_word: יוֹדֵעַ בִּינָה
  choice: dotado de entendimento
  rationale: Expressa de modo natural a construção literal 'conhecedor de entendimento', preservando sua dimensão cognitiva e sua pertinência à habilidade artesanal.
- source_word: לְחוּרָם אָבִי
  choice: Hurão-Abi
  rationale: Entende לְ como introdutor do objeto após 'enviar' e conserva אָבִי transliterado como parte de uma designação ambígua, sem impor parentesco literal nem uma função profissional específica.
theological_decisions:
- issue: Sentido de אָבִי na designação חוּרָם אָבִי
  choice: 'Tratado como parte da designação do artesão: “Hurão-Abi”'
  alternative: “Hurão, meu pai” ou “Hurão, meu mestre artesão”
  rationale: אָבִי significa literalmente 'meu pai', mas pode ter valor honorífico ou titular. A transliteração mantém a tensão interpretativa e evita decidir no texto principal entre parentesco, título e componente do nome.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com grafia brasileira do nome “Hurão”. A formulação evita linguagem excessivamente técnica, ao mesmo tempo que preserva a ambiguidade do título hebraico.
