  text: וְ/עַתָּ֡ה שְֽׁלַֽח לִ֣/י אִישׁ חָכָ֡ם לַ/עֲשׂוֹת֩ בַּ/זָּהָ֨ב וּ/בַ/כֶּ֜סֶף וּ/בַ/נְּחֹ֣שֶׁת וּ/בַ/בַּרְזֶ֗ל וּ/בָֽ/אַרְגְּוָן֙ וְ/כַרְמִ֣יל וּ/תְכֵ֔לֶת וְ/יֹדֵ֖עַ לְ/פַתֵּ֣חַ פִּתּוּחִ֑ים עִם הַֽ/חֲכָמִ֗ים אֲשֶׁ֤ר עִמִּ/י֙ בִּֽ/יהוּדָ֣ה וּ/בִֽ/ירוּשָׁלִַ֔ם אֲשֶׁ֥ר הֵכִ֖ין דָּוִ֥יד אָבִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/006.yaml
  text: Send me a skilled man to work in gold[a], silver, bronze, iron, purple, crimson, and blue, and who knows how to engrave engravings, to be with the skilled men who are with me in Judah and Jerusalem[c][b], whom my father David prepared.
translation:
  language: pt
  text: Agora, envie-me um homem habilidoso para trabalhar com ouro, prata, bronze, ferro, púrpura, carmesim[a] e azul, e que saiba fazer trabalhos de entalhe[b], para trabalhar com os homens habilidosos que estão comigo em Judá e Jerusalém, os quais meu pai Davi preparou[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “escarlate”.
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “entalhar entalhes”, uma expressão com palavras da mesma raiz que destaca o trabalho de entalhe.
    reason: lexical_alternative
  - marker: c
    text: Ou “designou” ou “deixou prontos”; o verbo hebraico pode indicar preparação ou, neste contexto, nomeação para uma tarefa.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: A expressão hebraica contém explicitamente o advérbio temporal עַתָּה, introduzido por וְ; em português, “Agora” transmite naturalmente a transição para o pedido, sem exigir um “e” inicial.
- source_word: שְׁלַח לִי
  choice: envie-me
  rationale: Imperativo seguido do complemento “a mim”; “envie-me” é direto, atual e adequado ao pedido dirigido a Hirão.
- source_word: אִישׁ חָכָם
  choice: um homem habilidoso
  rationale: Neste contexto artesanal, חָכָם indica perícia técnica, não apenas sabedoria em sentido abstrato. “Homem” preserva o singular masculino da fonte.
- source_word: לַעֲשׂוֹת בַּזָּהָב וּבַכֶּסֶף וּבַנְּחֹשֶׁת וּבַבַּרְזֶל
  choice: para trabalhar com ouro, prata, bronze, ferro
  rationale: O infinitivo e a preposição descrevem o trabalho artesanal nos materiais enumerados. “Trabalhar com” é idiomático em português; נְחֹשֶׁת é “bronze” neste contexto histórico.
- source_word: אַרְגְּוָן וְכַרְמִיל וּתְכֵלֶת
  choice: púrpura, carmesim e azul
  rationale: Os termos designam cores ou materiais tingidos caros. A tradução mantém a forma compacta da lista e não acrescenta “fio” ou “tecido”, ausentes do hebraico.
- source_word: יֹדֵעַ לְפַתֵּחַ פִּתּוּחִים
  choice: que saiba fazer trabalhos de entalhe
  rationale: A construção cognata hebraica significa literalmente “entalhar entalhes”. A formulação escolhida preserva a ideia de trabalho especializado sem produzir uma repetição pouco natural em português.
- source_word: עִם הַחֲכָמִים אֲשֶׁר עִמִּי
  choice: para trabalhar com os homens habilidosos que estão comigo
  rationale: O contexto indica colaboração com os artesãos já presentes. A repetição de “habilidosos” conserva a ligação lexical entre חָכָם e הַחֲכָמִים, e “estão comigo” evita acrescentar uma relação hierárquica não expressa.
- source_word: אֲשֶׁר הֵכִין דָּוִיד אָבִי
  choice: os quais meu pai Davi preparou
  rationale: A oração relativa retoma mais naturalmente os homens habilidosos. “Preparou” mantém o sentido amplo de הֵכִין sem especificar indevidamente uma nomeação formal.
