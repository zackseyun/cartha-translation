  text: וַ/יִּסְפֹּ֨ר שְׁלֹמֹ֜ה שִׁבְעִ֥ים אֶ֨לֶף֙ אִ֣ישׁ סַבָּ֔ל וּ/שְׁמוֹנִ֥ים אֶ֛לֶף אִ֖ישׁ חֹצֵ֣ב בָּ/הָ֑ר וּ/מְנַצְּחִ֣ים עֲלֵי/הֶ֔ם שְׁלֹ֥שֶׁת אֲלָפִ֖ים וְ/שֵׁ֥שׁ מֵאֽוֹת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/001.yaml
  text: Solomon counted seventy thousand men as burden-bearers[a], and eighty thousand men as stonecutters in the hill country, and over them three thousand six hundred overseers.
translation:
  language: pt
  text: Salomão contou setenta mil homens como carregadores, oitenta mil homens como cortadores de pedra na região montanhosa[a] e três mil e seiscentos supervisores encarregados deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “os que talhavam no monte”; o objeto “pedras” fica implícito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְפֹּר
  choice: contou
  rationale: O verbo ספר, nesta forma narrativa, significa naturalmente contar ou recensear. “Contou” é claro e preserva a ação expressa no hebraico.
- source_word: אִישׁ סַבָּל
  choice: homens para carregar cargas
  rationale: סַבָּל designa quem transporta cargas. A formulação verbal é mais natural em português atual que “carregadores de fardos” e mantém אִישׁ como “homens”.
- source_word: חֹצֵב בָּהָר
  choice: homens para cortar pedras na região montanhosa
  rationale: חצב significa talhar ou cortar; no contexto da mão de obra de construção, o objeto implícito é pedra. בָּהָר indica o monte ou a região montanhosa. A nota registra a forma mais literal e a natureza implícita do objeto.
- source_word: וּמְנַצְּחִים עֲלֵיהֶם
  choice: supervisores sobre eles
  rationale: Neste contexto administrativo, מְנַצְּחִים se refere aos encarregados de dirigir o trabalho. “Supervisores” é atual e claro, enquanto “sobre eles” preserva עֲלֵיהֶם.
- source_word: שְׁלֹשֶׁת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: três mil e seiscentos
  rationale: Tradução direta e idiomática da expressão numérica hebraica.
- source_word: אִישׁ
  choice: homens
  rationale: O substantivo é masculino e, neste contexto, refere-se aos integrantes masculinos da força de trabalho real.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A repetição de “homens” conserva a estrutura e a referência masculina do hebraico; a última ocorrência é omitida antes de “supervisores” por naturalidade, sem alterar o sentido.
