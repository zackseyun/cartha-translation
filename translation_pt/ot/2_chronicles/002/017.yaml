  text: וַ/יַּ֨עַשׂ מֵ/הֶ֜ם שִׁבְעִ֥ים אֶ֨לֶף֙ סַבָּ֔ל וּ/שְׁמֹנִ֥ים אֶ֖לֶף חֹצֵ֣ב בָּ/הָ֑ר וּ/שְׁלֹ֤שֶׁת אֲלָפִים֙ וְ/שֵׁ֣שׁ מֵא֔וֹת מְנַצְּחִ֖ים לְ/הַעֲבִ֥יד אֶת הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/017.yaml
  text: From them he made seventy thousand burden-bearers[a], and eighty thousand stonecutters in the hill country, and three thousand six hundred overseers to make the people work.
translation:
  language: pt
  text: Dentre eles, designou setenta mil carregadores, oitenta mil cortadores de pedra na região montanhosa[a] e três mil e seiscentos supervisores para fazer o povo trabalhar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “trabalhadores das pedreiras nas montanhas”. O hebraico diz literalmente “os que cortavam na montanha”, deixando implícito o objeto cortado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ מֵהֶם
  choice: Dentre eles, designou
  rationale: A expressão indica que pessoas foram escolhidas de um grupo e incumbidas de determinadas funções. “Designou” comunica naturalmente esse sentido administrativo em português.
- source_word: סַבָּל
  choice: carregadores
  rationale: O substantivo designa os que transportam cargas. “Carregadores” é preciso, corrente e mais específico que “trabalhadores”.
- source_word: חֹצֵב בָּהָר
  choice: cortadores de pedra na região montanhosa
  rationale: חצב significa talhar ou cortar, frequentemente pedra em contextos de construção. O objeto está implícito, mas o contexto da obra do templo sustenta “pedra”; בָּהָר indica a área montanhosa.
- source_word: מְנַצְּחִים
  choice: supervisores
  rationale: Neste contexto administrativo, o particípio se refere aos que dirigem e fiscalizam o trabalho. “Supervisores” é claro e contemporâneo.
- source_word: לְהַעֲבִיד אֶת הָעָם
  choice: para fazer o povo trabalhar
  rationale: A forma causativa de עבד significa fazer trabalhar ou pôr a trabalhar. A tradução mantém diretamente essa força causativa.
- source_word: הָעָם
  choice: o povo
  rationale: Preserva o termo abrangente do hebraico, sem substituí-lo interpretativamente por “trabalhadores” ou “força de trabalho”.
theological_decisions: []
