base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/009.yaml
  text: And behold[a], for the woodcutters, the cutters of the trees, I have given to your servants twenty thousand kors of crushed wheat, and twenty thousand kors of barley, and twenty thousand baths of wine[c][b], and twenty thousand baths of oil.
translation:
  language: pt
  text: E eis que dei aos teus servos — os lenhadores, os que cortam as árvores — vinte mil coros[b] de trigo triturado[a], vinte mil coros de cevada, vinte mil batos[c] de vinho e vinte mil batos de azeite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica é incomum. Também pode significar “trigo para alimento” ou referir-se a trigo batido/processado.
    reason: lexical_alternative
  - marker: b
    text: O coro era uma antiga medida de capacidade para produtos secos.
    reason: cultural_note
  - marker: c
    text: O bato era uma antiga medida de capacidade para líquidos.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Preserva tanto o conectivo quanto a função de chamar a atenção, em registro bíblico digno e ainda compreensível.
- source_word: לַחֹטְבִים לְכֹרְתֵי הָעֵצִים
  choice: os lenhadores, os que cortam as árvores
  rationale: Mantém as duas expressões participiais quase sinônimas e sua relação de aposição, sem reduzir o texto a uma única designação.
- source_word: נָתַתִּי
  choice: dei
  rationale: Reproduz diretamente o perfeito hebraico e apresenta a provisão como compromisso já estabelecido.
- source_word: חִטִּים מַכּוֹת
  choice: trigo triturado
  rationale: Expressa uma provável referência a trigo processado. Como a construção hebraica é incomum e incerta, outras possibilidades são registradas em nota.
- source_word: לַעֲבָדֶיךָ
  choice: aos teus servos
  rationale: Mantém o sentido normal de עֲבָדִים e a relação indireta marcada pela preposição, identificando-os em seguida como os trabalhadores encarregados do corte.
- source_word: כֹּרִים
  choice: coros
  rationale: Translitera a antiga medida de capacidade para secos, evitando uma conversão moderna necessariamente incerta.
- source_word: בַּתִּים
  choice: batos
  rationale: Translitera a antiga medida de capacidade para líquidos, preservando a unidade cultural do texto.
- source_word: יַיִן
  choice: vinho
  rationale: Equivalente português comum e direto para יַיִן.
- source_word: שֶׁמֶן
  choice: azeite
  rationale: Neste contexto alimentar, o termo hebraico se refere naturalmente ao óleo comestível típico da região, isto é, azeite; a formulação é idiomática em português.
- source_word: עֶשְׂרִים אֶלֶף
  choice: vinte mil
  rationale: Mantém literalmente o numeral repetido para cada produto.
