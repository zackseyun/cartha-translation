  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ֠/עַתָּה הַ/חִטִּ֨ים וְ/הַ/שְּׂעֹרִ֜ים הַ/שֶּׁ֤מֶן וְ/הַ/יַּ֨יִן֙ אֲשֶׁ֣ר אָמַ֣ר אֲדֹנִ֔/י יִשְׁלַ֖ח לַ/עֲבָדָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/014.yaml
  text: And now[a], let my lord send to his servants the wheat and the barley, the oil and the wine[b], of which he has spoken.
translation:
  language: pt
  text: E agora, que meu senhor envie aos seus servos o trigo e a cevada, o óleo[a] e o vinho dos quais falou[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “azeite”; neste contexto de provisões, o óleo provavelmente era de oliva.
    reason: lexical_alternative
  - marker: b
    text: Ou “dos quais tinha falado”. O hebraico não exige o sentido mais forte de “havia prometido”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a força conectiva de וְ como o valor temporal e discursivo de עַתָּה, introduzindo o pedido prático.
- source_word: הַחִטִּים וְהַשְּׂעֹרִים
  choice: o trigo e a cevada
  rationale: Emprega os nomes correntes das duas provisões e mantém os artigos da lista hebraica.
- source_word: הַשֶּׁמֶן
  choice: o óleo
  rationale: Mantém o sentido lexical mais amplo do hebraico; embora provavelmente se trate de azeite neste contexto, o texto não especifica a matéria-prima.
- source_word: וְהַיַּיִן
  choice: e o vinho
  rationale: Tradução direta do item final da lista de provisões.
- source_word: אֲשֶׁר אָמַר
  choice: dos quais falou
  rationale: A oração relativa retoma coletivamente as provisões mencionadas. 'Falou' preserva o sentido de אָמַר sem acrescentar a ideia mais forte de promessa.
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: Expressa a deferência cortesã dirigida a Salomão, sem confundir o título humano com uma designação divina.
- source_word: יִשְׁלַח
  choice: que ... envie
  rationale: A construção com subjuntivo comunica naturalmente em português a força volitiva ou jussiva do yiqtol neste pedido.
- source_word: לַעֲבָדָיו
  choice: aos seus servos
  rationale: Traduz diretamente a preposição e o substantivo com sufixo possessivo, sem substituir 'servos' pela interpretação contextual 'trabalhadores'.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível. A formulação volitiva “que meu senhor envie” preserva o tom respeitoso do pedido. Os marcadores foram colocados junto às expressões que suas notas esclarecem.
