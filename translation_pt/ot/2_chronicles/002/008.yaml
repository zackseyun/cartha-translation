  terminology: «Madeira» é apropriado para עצים em contexto de construção. «Templo» é uma explicitação contextual legítima de «a casa», devidamente equilibrada pela nota. «Extraordinário» é uma opção semanticamente válida para פלא e não introduz conotação doutrinária indevida.
