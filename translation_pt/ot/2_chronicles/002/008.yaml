  text: וּ/לְ/הָכִ֥ין לִ֛/י עֵצִ֖ים לָ/רֹ֑ב כִּ֥י הַ/בַּ֛יִת אֲשֶׁר אֲנִ֥י בוֹנֶ֖ה גָּד֥וֹל וְ/הַפְלֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/008.yaml
  text: and to prepare for me timber in abundance[b][a], for the house that I am building will be great and wonderful.
translation:
  language: pt
  text: e que me prepare madeira em abundância, pois o templo que estou construindo será grande e extraordinário.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a casa”. A expressão se refere ao templo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהָכִין
  choice: e que me prepare
  rationale: O infinitivo construto com conjunção e preposição dá continuidade ao pedido do versículo anterior; em português, a forma finita com subjuntivo exprime essa dependência com naturalidade.
- source_word: לִי
  choice: me
  rationale: O pronome oblíquo comunica de modo natural o benefício indicado pela preposição com sufixo de primeira pessoa.
- source_word: עֵצִים
  choice: madeira
  rationale: No contexto de construção, designa madeira destinada à obra; “madeira” é mais corrente e natural em português do que “madeiramento” ou “árvores”.
- source_word: לָרֹב
  choice: em abundância
  rationale: Preserva a ideia de grande quantidade e corresponde a uma expressão portuguesa clara e idiomática.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão do pedido, mantendo um registro narrativo digno e natural.
- source_word: הַבַּיִת
  choice: o templo
  rationale: Embora o hebraico diga literalmente “a casa”, o referente contextual é o templo; “templo” evita possível obscuridade para o leitor moderno, enquanto a literalidade é registrada em nota.
- source_word: אֲשֶׁר אֲנִי בוֹנֶה
  choice: que estou construindo
  rationale: O particípio apresenta a construção como em curso ou iminente; a perífrase portuguesa conserva esse valor aspectual.
- source_word: גָּדוֹל
  choice: grande
  rationale: Pode abranger tanto dimensões quanto importância e magnificência, preservando a amplitude do termo hebraico.
- source_word: וְהַפְלֵא
  choice: e extraordinário
  rationale: A forma ligada à raiz פלא caracteriza o edifício como excepcional ou admirável; “extraordinário” transmite esse sentido sem sugerir necessariamente um milagre.
theological_decisions:
- issue: Tradução de הַבַּיִת no contexto do santuário
  choice: templo no texto, com nota sobre o literal “casa”
  alternative: casa no texto
  rationale: O referente cultual é inequívoco no contexto. “Templo” oferece clareza imediata sem impor uma distinção teológica ausente do hebraico, e a nota preserva a metáfora lexical original.
translation_notes:
  register: 'Português moderno, claro e digno, com construção sintática ligada ao pedido do versículo anterior. A tradução busca equivalência ótima: mantém “grande” e a força excepcional de פלא, mas usa “templo” no corpo por clareza contextual, registrando a forma literal em nota.'
