id: 2CH.2.5
reference: 2 Chronicles 2:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/מִ֤י יַעֲצָר כֹּ֨חַ֙ לִ/בְנֽוֹת ל֣/וֹ בַ֔יִת כִּ֧י הַ/שָּׁמַ֛יִם וּ/שְׁמֵ֥י הַ/שָּׁמַ֖יִם לֹ֣א יְכַלְכְּלֻ֑/הוּ וּ/מִ֤י אֲנִי֙ אֲשֶׁ֣ר אֶבְנֶה לּ֣/וֹ בַ֔יִת כִּ֖י אִם לְ/הַקְטִ֥יר לְ/פָנָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/005.yaml
  text: But who has the strength to build a house for him[a], since the heavens, even the highest heavens, cannot contain him? And who am I, that I should build a house for him[b], except to burn incense before him?
translation:
  language: pt
  text: Mas quem tem força para construir uma casa para ele, visto que os céus, até os mais altos céus,[a] não podem contê-lo? E quem sou eu para construir uma casa para ele, a não ser para queimar incenso diante dele?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os céus e os céus dos céus”, expressão que indica os mais altos céus.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “oferecer incenso diante dele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲצָר כֹּחַ
  choice: tem força
  rationale: A expressão idiomática indica possuir capacidade suficiente para a tarefa; “tem força” preserva a imagem e soa natural na pergunta retórica.
- source_word: לִבְנוֹת לוֹ בַיִת
  choice: construir uma casa para ele
  rationale: “Casa” preserva o sentido literal de בַּיִת sem antecipar a interpretação contextual “templo”.
- source_word: הַשָּׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  choice: os céus, até os mais altos céus
  rationale: Expressa em português corrente a construção intensificadora hebraica, mantendo seus dois elementos e sua ênfase.
- source_word: לֹא יְכַלְכְּלֻהוּ
  choice: não podem contê-lo
  rationale: No contexto, o verbo afirma que nem mesmo os céus têm capacidade para conter Deus.
- source_word: וּמִי אֲנִי
  choice: E quem sou eu
  rationale: Mantém a conjunção simples e a pergunta que expressa humildade diante da grandeza divina.
- source_word: אֲשֶׁר אֶבְנֶה לוֹ בַיִת
  choice: para construir uma casa para ele
  rationale: Depois de “quem sou eu”, o infinitivo é uma formulação portuguesa natural que comunica inadequação, e não mera futuridade.
- source_word: כִּי אִם
  choice: a não ser
  rationale: 'Introduz a limitação da finalidade da casa: ela não contém Deus, mas serve ao culto prestado diante dele.'
- source_word: לְהַקְטִיר לְפָנָיו
  choice: para queimar incenso diante dele
  rationale: הקטיר descreve fazer algo subir em fumaça; sem objeto expresso, “queimar incenso” é adequado ao contexto cultual, enquanto “diante dele” preserva לְפָנָיו.
theological_decisions:
- issue: Transcendência divina e localização no templo
  choice: A casa não contém Deus; sua finalidade aqui é o culto realizado diante dele.
  alternative: Entender a casa como morada que contém ou circunscreve Deus.
  rationale: 'A afirmação de que nem os mais altos céus podem contê-lo rege o sentido da linguagem sobre a casa. A cláusula final mantém a tensão do texto: Deus recebe culto relacionado à casa sem ficar confinado nela.'
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Casa” conserva a metáfora hebraica; “visto que” explicita naturalmente a relação causal. Os marcadores de notas aparecem junto às expressões pertinentes.
