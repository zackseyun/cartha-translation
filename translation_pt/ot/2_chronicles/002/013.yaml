id: 2CH.2.13
reference: 2 Chronicles 2:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בֶּן אִשָּׁ֞ה מִן בְּנ֣וֹת דָּ֗ן וְ/אָבִ֣י/ו אִישׁ צֹרִ֡י יוֹדֵ֡עַ לַ/עֲשׂ֣וֹת בַּ/זָּֽהָב וּ֠/בַ/כֶּסֶף בַּ/נְּחֹ֨שֶׁת בַּ/בַּרְזֶ֜ל בָּ/אֲבָנִ֣ים וּ/בָ/עֵצִ֗ים בָּ/אַרְגָּמָ֤ן בַּ/תְּכֵ֨לֶת֙ וּ/בַ/בּ֣וּץ וּ/בַ/כַּרְמִ֔יל וּ/לְ/פַתֵּ֨חַ֙ כָּל פִּתּ֔וּחַ וְ/לַ/חְשֹׁ֖ב כָּל מַחֲשָׁ֑בֶת אֲשֶׁ֤ר יִנָּֽתֶן ל/וֹ֙ עִם חֲכָמֶ֔י/ךָ וְֽ/חַכְמֵ֔י אֲדֹנִ֖/י דָּוִ֥יד אָבִֽי/ךָ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/013.yaml
  text: the son of a woman from the daughters of Dan[a], and his father was a man of Tyre, skilled to work in gold and silver, bronze and iron, stone and wood, purple, blue, fine linen, and crimson, and to engrave every kind of engraving and to devise every kind of design that may be assigned to him[b], with your skilled men and the skilled men of my lord David your father.
translation:
  language: pt
  text: filho de uma mulher das filhas de Dã[a], cujo pai era um homem de Tiro. Ele sabe trabalhar em ouro, prata, bronze, ferro, pedra e madeira, bem como em púrpura, azul, linho fino e carmesim[b]. Sabe fazer todo tipo de entalhe e conceber todo tipo de projeto que lhe seja confiado, junto com os seus artesãos e os artesãos de meu senhor Davi, seu pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “das filhas de Dã” provavelmente indica que a mãe dele pertencia à tribo de Dã.
    reason: cultural_note
  - marker: b
    text: Ou “escarlate”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אִשָּׁה מִן בְּנוֹת דָּן
  choice: filho de uma mulher das filhas de Dã
  rationale: Mantém a formulação genealógica concreta do hebraico e deixa a provável referência à origem tribal materna para a nota.
- source_word: וְאָבִיו אִישׁ צֹרִי
  choice: cujo pai era um homem de Tiro
  rationale: Expressa com naturalidade que o pai era originário de Tiro e liga a oração ao fragmento inicial.
- source_word: יוֹדֵעַ לַעֲשׂוֹת
  choice: sabe trabalhar
  rationale: No contexto artesanal, a expressão indica competência prática, e não apenas conhecimento intelectual.
- source_word: בַּזָּהָב וּבַכֶּסֶף בַּנְּחֹשֶׁת בַּבַּרְזֶל בָּאֲבָנִים וּבָעֵצִים
  choice: em ouro, prata, bronze, ferro, pedra e madeira
  rationale: Apresenta de modo corrente os materiais nos quais o artesão possuía habilidade.
- source_word: בָּאַרְגָּמָן בַּתְּכֵלֶת וּבַבּוּץ וּבַכַּרְמִיל
  choice: em púrpura, azul, linho fino e carmesim
  rationale: Usa termos acessíveis para os tecidos ou materiais tingidos; a nuance alternativa do último termo é registrada em nota.
- source_word: וּלְפַתֵּחַ כָּל פִּתּוּחַ
  choice: fazer todo tipo de entalhe
  rationale: Reproduzir literalmente o cognato como 'gravar toda gravação' seria pouco natural; 'entalhe' comunica a obra artística abrangida.
- source_word: וְלַחְשֹׁב כָּל מַחֲשָׁבֶת
  choice: conceber todo tipo de projeto
  rationale: No vocabulário artesanal, חשׁב designa planejar ou criar um desenho ou projeto, não simplesmente pensar.
- source_word: אֲשֶׁר יִנָּתֶן לוֹ
  choice: que lhe seja confiado
  rationale: Preserva a construção passiva e comunica que o trabalho poderá ser atribuído ao artesão.
theological_decisions:
- issue: Referência masculina aos profissionais especializados
  choice: os seus artesãos e os artesãos
  alternative: seus trabalhadores especializados
  rationale: O hebraico emprega plurais masculinos, e 'artesãos' é natural, específico ao contexto e fiel à forma da referência.
- issue: Tratamento honorífico אֲדֹנִי
  choice: meu senhor Davi
  alternative: meu mestre Davi
  rationale: Trata-se de um título humano de cortesia política, não de um título divino; 'meu senhor' conserva adequadamente o registro da corte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A oração foi dividida em períodos para evitar uma sequência excessivamente longa, sem alterar as relações sintáticas. Os marcadores foram colocados junto às expressões às quais as notas efetivamente se referem; isso corrige a aparente inversão dos marcadores na camada inglesa fornecida.
