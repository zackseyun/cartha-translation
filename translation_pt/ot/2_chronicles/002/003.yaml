id: 2CH.2.3
reference: 2 Chronicles 2:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הִנֵּה֩ אֲנִ֨י בֽוֹנֶה בַּ֜יִת לְ/שֵׁ֣ם יְהוָ֣ה אֱלֹהָ֗/י לְ/הַקְדִּ֣ישׁ ל֡/וֹ לְ/הַקְטִ֣יר לְ/פָנָ֣י/ו קְטֹֽרֶת סַמִּים֩ וּ/מַעֲרֶ֨כֶת תָּמִ֤יד וְ/עֹלוֹת֙ לַ/בֹּ֣קֶר וְ/לָ/עֶ֔רֶב לַ/שַּׁבָּתוֹת֙ וְ/לֶ֣/חֳדָשִׁ֔ים וּֽ/לְ/מוֹעֲדֵ֖י יְהוָ֣ה אֱלֹהֵ֑י/נוּ לְ/עוֹלָ֖ם זֹ֥את עַל יִשְׂרָאֵֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/003.yaml
  text: Behold[a], I am building a house for the name of Yahweh my God, to consecrate it to him, to burn fragrant incense before him, and to set out the regular arrangement of bread, and burnt offerings morning and evening, on the Sabbaths, at the new moons[b], and at the appointed feasts of Yahweh our God[c]. This is forever for Israel.
translation:
  language: pt
  text: Eis que estou construindo uma casa[a] para o nome de Yahweh, meu Deus, a fim de consagrá-la a ele, queimar diante dele incenso aromático, dispor continuamente os pães[b] e oferecer holocaustos de manhã e à tarde, nos sábados, nas luas novas e nas festas determinadas de Yahweh, nosso Deus. Isto é uma obrigação perpétua para Israel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Casa” refere-se ao templo. O hebraico conserva a expressão “uma casa para o nome de Yahweh”.
    reason: Esclarecimento do referente e preservação da expressão teológica hebraica.
  - marker: b
    text: 'Hebraico: “a disposição contínua”. A expressão se refere aos pães que eram continuamente dispostos diante de Yahweh, tradicionalmente chamados “pães da proposição”.'
    reason: O substantivo “pães” está implícito no contexto cultual, mas não aparece expressamente nesta frase hebraica.
  - marker: c
    text: Literalmente, “isto [está] sobre Israel para sempre”, isto é, constitui uma obrigação permanente para Israel.
    reason: Explica a construção hebraica e a força normativa da declaração final.
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Mantém a função de chamar a atenção para a declaração solene, em registro elevado, mas ainda reconhecível no português atual.
- source_word: בּוֹנֶה
  choice: estou construindo
  rationale: O particípio expressa ação em curso ou apresentada como já iniciada; a forma progressiva é natural em português.
- source_word: בַּיִת לְשֵׁם יְהוָה
  choice: uma casa para o nome de Yahweh
  rationale: Preserva tanto o sentido básico de בַּיִת, “casa”, quanto a fórmula teologicamente significativa “para o nome”, sem substituí-la silenciosamente por “templo” ou “em honra de”.
- source_word: לְהַקְדִּישׁ לוֹ
  choice: a fim de consagrá-la a ele
  rationale: Expressa a separação da casa para uso santo; o pronome feminino retoma naturalmente “casa”.
- source_word: קְטֹרֶת סַמִּים
  choice: incenso aromático
  rationale: Comunica de modo idiomático que se trata de incenso composto de substâncias perfumadas.
- source_word: מַעֲרֶכֶת תָּמִיד
  choice: dispor continuamente os pães
  rationale: A expressão literalmente designa a disposição contínua; o objeto “os pães” é explicitado pelo conhecido contexto do culto no santuário e documentado em nota.
- source_word: עֹלוֹת
  choice: holocaustos
  rationale: Termo português estabelecido para ofertas inteiramente queimadas, adequado ao contexto sacrificial.
- source_word: לַשַּׁבָּתוֹת וְלֶחֳדָשִׁים וּלְמוֹעֲדֵי
  choice: nos sábados, nas luas novas e nas festas determinadas
  rationale: Reproduz as três categorias do calendário cultual; “festas determinadas” comunica que os tempos eram fixados, sem restringir מוֹעֵד apenas à ideia moderna de festa.
- source_word: לְעוֹלָם זֹאת עַל יִשְׂרָאֵל
  choice: Essa é uma obrigação perpétua para Israel
  rationale: Torna explícito, em português natural, o valor normativo da expressão hebraica literalmente formulada como “isto sobre Israel para sempre”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: Translitera o nome pessoal do texto hebraico em vez de substituí-lo por um título.
- issue: Sentido de “casa para o nome”
  choice: Preservar a expressão hebraica no texto principal
  alternative: templo dedicado a Yahweh
  rationale: “Templo” identifica corretamente o referente, mas eliminaria a linguagem própria de Crônicas sobre a casa construída para o nome de Deus.
- issue: Referente de מַעֲרֶכֶת תָּמִיד
  choice: Explicitar “os pães” no texto e registrar a forma literal em nota
  alternative: a disposição contínua
  rationale: A explicitação torna a prática cultual compreensível, enquanto a nota deixa claro que “pães” está implícito, não expresso neste versículo.
- issue: Força normativa da frase final
  choice: obrigação perpétua para Israel
  alternative: isto está sobre Israel para sempre
  rationale: A formulação escolhida comunica a obrigação contínua sem apresentar uma tradução literal obscura como se fosse português natural.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Mantém a solenidade do discurso real em “Eis que”, evita arcaísmos sintáticos e conserva expressões teologicamente relevantes do hebraico, explicando em notas aquilo que poderia ficar obscuro.
