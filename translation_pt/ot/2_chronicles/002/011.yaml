source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ חוּרָם֒ בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר עָשָׂ֔ה אֶת הַ/שָּׁמַ֖יִם וְ/אֶת הָ/אָ֑רֶץ אֲשֶׁ֣ר נָתַן֩ לְ/דָוִ֨יד הַ/מֶּ֜לֶךְ בֵּ֣ן חָכָ֗ם יוֹדֵ֨עַ֙ שֵׂ֣כֶל וּ/בִינָ֔ה אֲשֶׁ֤ר יִבְנֶה בַּ֨יִת֙ לַ/יהוָ֔ה וּ/בַ֖יִת לְ/מַלְכוּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/011.yaml
  text: Then Huram said[a], “Blessed be Yahweh, the God of Israel, who made the heavens and the earth, who has given King David a wise son, who knows discretion and understanding[c][b], who will build a house for Yahweh and a house for his kingdom.”
translation:
  language: pt
  text: 'Então Hurão disse[a]: “Bendito seja Yahweh, o Deus de Israel, que fez os céus e a terra e deu ao rei Davi um filho sábio, que tem bom senso e entendimento[b] e que construirá uma casa para Yahweh e uma casa para o seu reino[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em Crônicas, o nome aparece na forma hebraica “Hurão”; no relato paralelo de 1 Reis, aparece como “Hirão”.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “dotado de discernimento e entendimento”.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “uma casa para o seu reino”; possivelmente se refere ao palácio ou ao complexo real.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo dá continuidade à narrativa; “Então” expressa a sequência com naturalidade em português.
- source_word: חוּרָם
  choice: Hurão
  rationale: Segue a forma hebraica חוּרָם de Crônicas, com a forma portuguesa tradicional do nome, sem harmonizá-la com Hirão em Reis.
- source_word: בָּרוּךְ יְהוָה
  choice: Bendito seja Yahweh
  rationale: Reproduz com naturalidade a fórmula hebraica de louvor e preserva o nome divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עָשָׂה אֶת־הַשָּׁמַיִם וְאֶת־הָאָרֶץ
  choice: que fez os céus e a terra
  rationale: Mantém o plural hebraico “céus” e a fórmula bíblica da criação.
- source_word: בֵּן חָכָם
  choice: um filho sábio
  rationale: Tradução direta e natural; חָכָם abrange sabedoria prática adequada à tarefa de Salomão.
- source_word: יוֹדֵעַ שֵׂכֶל וּבִינָה
  choice: dotado de bom senso e entendimento
  rationale: Expressa idiomaticamente a capacidade contínua indicada pelo particípio יוֹדֵעַ e preserva a distinção entre prudência prática e compreensão.
- source_word: בַּיִת לַיהוָה
  choice: um templo para Yahweh
  rationale: Embora בַּיִת signifique literalmente “casa”, aqui o referente é inequivocamente o templo; “templo” comunica isso com clareza ao leitor moderno.
- source_word: בַּיִת לְמַלְכוּתוֹ
  choice: um palácio para o seu reino
  rationale: O segundo בַּיִת contrasta com o templo e designa uma construção ligada ao governo real; “palácio” torna o referente provável claro, sem eliminar a nota de alternativa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em forma transliterada.
- issue: Sentido de בַּיִת לְמַלְכוּתוֹ
  choice: um palácio para o seu reino
  alternative: uma casa para o seu reino; uma casa para a sua realeza
  rationale: O contexto contrapõe o templo à residência ou complexo da administração real. A nota mantém visível a formulação mais literal e a possível amplitude do referente.
translation_notes:
  register: 'Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A tradução prioriza equivalência ótima: conserva a fórmula de bênção, o nome divino e os pares semânticos, enquanto explicita como “templo” e “palácio” os referentes contextuais dos dois usos contrastantes de בַּיִת.'
