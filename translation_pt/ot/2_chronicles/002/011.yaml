revisions:
- from: 'Então Hurão disse[a]: “Bendito seja Yahweh, o Deus de Israel, que fez os céus e a terra e deu ao rei Davi um filho sábio, dotado de bom senso e entendimento[b], que construirá um templo para Yahweh e um palácio para o seu reino[c]”.'
  to: 'Então Hurão disse[a]: “Bendito seja Yahweh, o Deus de Israel, que fez os céus e a terra e deu ao rei Davi um filho sábio, que tem bom senso e entendimento[b] e que construirá uma casa para Yahweh e uma casa para o seu reino[c].”'
  rationale: A revisão preserva os dois empregos de “casa” presentes no hebraico e deixa a identificação contextual de cada construção para a nota, em vez de incorporá-la como interpretação no texto. Também ajusta levemente a sintaxe para uma leitura portuguesa mais fluente e inequívoca.
