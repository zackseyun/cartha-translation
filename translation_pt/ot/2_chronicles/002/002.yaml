  text: וַ/יִּשְׁלַ֣ח שְׁלֹמֹ֔ה אֶל חוּרָ֥ם מֶֽלֶךְ צֹ֖ר לֵ/אמֹ֑ר כַּ/אֲשֶׁ֤ר עָשִׂ֨יתָ֙ עִם דָּוִ֣יד אָבִ֔/י וַ/תִּֽשְׁלַֽח ל֣/וֹ אֲרָזִ֔ים לִ/בְנֽוֹת ל֥/וֹ בַ֖יִת לָ/שֶׁ֥בֶת בּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/002.yaml
  text: Then Solomon sent to Huram king of Tyre[a], saying, “As you dealt with David my father and sent him cedars to build himself a house to dwell in, so do with me.”
translation:
  language: pt
  text: 'Então Salomão mandou dizer a Hurão, rei de Tiro[a]: “Assim como agiste com Davi, meu pai, e lhe enviaste cedros para a construção de uma casa onde ele morasse—”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hurão é a forma do nome usada aqui no hebraico; no trecho paralelo de Reis, aparece com frequência a forma Hirão.
    reason: alternative_reading
  - marker: b
    text: A frase continua no versículo seguinte. O hebraico deste versículo não acrescenta aqui “faça o mesmo comigo”.
    reason: source_structure
lexical_decisions:
- source_word: וַיִּשְׁלַח ... לֵאמֹר
  choice: mandou dizer
  rationale: A expressão portuguesa comunica naturalmente o envio de uma mensagem e introduz a fala, sem exigir o mais rígido «enviou ... dizendo».
- source_word: חוּרָם
  choice: Hurão
  rationale: Representa em português a forma hebraica usada pelo Cronista, distinguindo-a da forma mais conhecida Hirão, encontrada com frequência no paralelo de Reis.
- source_word: מֶלֶךְ צֹר
  choice: rei de Tiro
  rationale: Tradução direta da construção hebraica de título seguido do nome do lugar.
- source_word: כַּאֲשֶׁר
  choice: Assim como
  rationale: Introduz com clareza a comparação que continua no contexto seguinte.
- source_word: עָשִׂיתָ עִם דָּוִיד אָבִי
  choice: agiste com Davi, meu pai
  rationale: Mantém o sentido amplo de agir ou proceder em relação a alguém, sem restringi-lo indevidamente a uma única ação.
- source_word: וַתִּשְׁלַח לוֹ אֲרָזִים
  choice: e lhe enviaste cedros
  rationale: Preserva o plural lexical «cedros»; no contexto da construção, entende-se a madeira dessas árvores.
- source_word: לִבְנוֹת לוֹ בַיִת לָשֶׁבֶת בּוֹ
  choice: para a construção de uma casa onde ele morasse
  rationale: Expressa de modo natural o propósito e o beneficiário, sem afirmar além do hebraico quem realizou pessoalmente a construção.
- source_word: ausência de apódose explícita no fim do versículo
  choice: travessão indicando continuação
  rationale: O texto hebraico termina com a oração comparativa e prossegue no versículo seguinte; não se acrescenta aqui a frase «faça o mesmo comigo», ausente da fonte.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com formas verbais de segunda pessoa coerentes com a fala dirigida ao rei. O travessão final preserva a estrutura incompleta do versículo hebraico e evita importar uma conclusão explicativa da camada inglesa.
