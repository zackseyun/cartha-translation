base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/001.yaml
  text: Jotham was twenty-five years old when he began to reign, and he reigned sixteen years in Jerusalem. His mother’s name was Jerushah daughter of Zadok.
translation:
  language: pt
  text: Jotão tinha vinte e cinco anos quando começou a reinar e reinou dezesseis anos em Jerusalém. Sua mãe se chamava Jerusa e era filha de Zadoque.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: tinha vinte e cinco anos
  rationale: A fórmula hebraica de idade é expressa pelo equivalente idiomático e natural em português, sem reproduzir literalmente «filho de vinte e cinco anos».
- source_word: בְּמָלְכוֹ
  choice: quando começou a reinar
  rationale: A construção com בְּ assinala o momento da ascensão ao trono; esta formulação preserva esse valor temporal com clareza.
- source_word: מָלַךְ
  choice: reinou
  rationale: O verbo indica o exercício do governo real, e não apenas a posse do título de rei.
- source_word: בִּירוּשָׁלָם
  choice: em Jerusalém
  rationale: Uso locativo direto da preposição hebraica.
- source_word: וְשֵׁם אִמּוֹ
  choice: Sua mãe se chamava
  rationale: Equivalente português natural para a fórmula hebraica «e o nome de sua mãe era».
- source_word: יְרוּשָׁה
  choice: Jerusa
  rationale: Transliteração tradicional e amplamente reconhecível em português do nome hebraico Yerushah.
- source_word: בַּת צָדוֹק
  choice: e era filha de Zadoque
  rationale: Preserva a identificação da linhagem materna; a inserção de «era» torna a relação sintática natural em português.
