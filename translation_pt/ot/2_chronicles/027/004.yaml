base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/004.yaml
  text: He built cities in the hill country of Judah[b][a], and in the forests he built fortresses and towers.
translation:
  language: pt
  text: Também construiu cidades na região montanhosa de Judá e, nas áreas de mata[a], construiu fortalezas[b] e torres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bosques”, “florestas” ou “matagais”.
    reason: lexical_alternative
  - marker: b
    text: Ou “cidadelas” ou “redutos fortificados”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרִים
  choice: cidades
  rationale: O plural designa núcleos urbanos; “cidades” é a forma corrente e adequada ao contexto das obras reais.
- source_word: בָּנָה
  choice: construiu
  rationale: Traduz diretamente o verbo “construir” e mantém o estilo narrativo conciso.
- source_word: בְּהַר יְהוּדָה
  choice: na região montanhosa de Judá
  rationale: Aqui הַר tem sentido geográfico regional, não o de uma única montanha; a formulação é clara em português internacional.
- source_word: חֳרָשִׁים
  choice: áreas de mata
  rationale: O termo indica lugares arborizados, bosques ou matas. “Áreas de mata” preserva essa amplitude melhor do que uma referência exclusiva a florestas extensas.
- source_word: בִּירָנִיּוֹת
  choice: fortalezas
  rationale: Designa estruturas fortificadas; “fortalezas” comunica naturalmente a função defensiva sem o possível anacronismo de “castelos”.
- source_word: מִגְדָּלִים
  choice: torres
  rationale: Equivalente direto e corrente, provavelmente referente a estruturas defensivas neste contexto.
