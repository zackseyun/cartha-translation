base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/009.yaml
  text: And Jotham slept with his fathers[a], and they buried him in the city of David. And Ahaz his son reigned in his place.
translation:
  language: pt
  text: Jotão descansou com seus antepassados[a], e o sepultaram na Cidade de Davi. Acaz, seu filho, reinou em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais interpretativo, “morreu”. O hebraico diz literalmente “deitou-se com seus antepassados”, fórmula régia convencional referente à morte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: descansou
  rationale: No obituário régio, o verbo é um eufemismo convencional para morrer. “Descansou” preserva a imagem hebraica de modo mais natural em português do que “dormiu”, sem reduzi-la simplesmente a “morreu”.
- source_word: עִם אֲבֹתָיו
  choice: com seus antepassados
  rationale: A expressão integra a fórmula dinástica de morte. “Antepassados” comunica hoje o sentido genealógico coletivo com clareza e evita que “pais” seja entendido apenas como os genitores imediatos.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: e o sepultaram
  rationale: Mantém a forma ativa plural do hebraico, com sujeito indeterminado natural em português.
- source_word: בְּעִיר דָּוִיד
  choice: na Cidade de Davi
  rationale: Forma portuguesa convencional e transparente do topônimo; a inicial maiúscula sinaliza o nome próprio do lugar.
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: Verbo conciso e apropriado à fórmula de sucessão real.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: Expressa diretamente substituição e sucessão dinástica.
- source_word: יוֹתָם
  choice: Jotão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אָחָז
  choice: Acaz
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: בְּנוֹ
  choice: seu filho
  rationale: Preserva explicitamente a relação filial na fórmula sucessória.
