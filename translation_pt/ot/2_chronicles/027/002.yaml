source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ הַ/יָּשָׁ֜ר בְּ/עֵינֵ֣י יְהוָ֗ה כְּ/כֹ֤ל אֲשֶׁר עָשָׂה֙ עֻזִּיָּ֣הוּ אָבִ֔י/ו רַ֕ק לֹא בָ֖א אֶל הֵיכַ֣ל יְהוָ֑ה וְ/ע֥וֹד הָ/עָ֖ם מַשְׁחִיתִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/002.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that his father Uzziah had done—except that he did not enter the temple of Yahweh[b]. But the people still acted corruptly.
translation:
  language: pt
  text: Ele fez o que era reto aos olhos de Yahweh, conforme tudo o que seu pai Uzias havia feito, exceto que não entrou no templo de Yahweh.[a] Mas o povo continuava a agir corruptamente.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não foi ao templo de Yahweh”. A oração provavelmente contrasta Jotão com Uzias, que entrou indevidamente no templo (ver 2Cr 26:16–21).'
    reason: Referência cruzada e alternativa de tradução para בָא אֶל.
  - marker: b
    text: 'Ou: “continuava a se corromper” ou “continuava a se comportar de modo corrupto”.'
    reason: A forma מַשְׁחִיתִים permite expressões alternativas para a continuidade da corrupção e pode admitir uma nuance reflexiva.
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: Ele fez o que era reto
  rationale: O adjetivo substantivado הַיָּשָׁר designa aquilo que é reto. A formulação preserva a avaliação moral e soa natural em português.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Mantém a imagem do idioma hebraico de avaliação divina, que também é clara em português, e translitera o nome divino.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה עֻזִּיָּהוּ אָבִיו
  choice: conforme tudo o que seu pai Uzias havia feito
  rationale: כְּכֹל אֲשֶׁר expressa conformidade abrangente com o exemplo anterior; o mais-que-perfeito situa naturalmente as ações do pai antes das de Jotão.
- source_word: רַק
  choice: exceto que
  rationale: Introduz uma ressalva à comparação entre Jotão e Uzias, sem apagar a tensão com a afirmação abrangente anterior.
- source_word: לֹא בָא אֶל הֵיכַל יְהוָה
  choice: não entrou no templo de Yahweh
  rationale: בוא com אֶל indica aqui entrada ou movimento para dentro, e הֵיכָל se refere ao templo/santuário.
- source_word: וְעוֹד הָעָם מַשְׁחִיתִים
  choice: Mas o povo ainda agia de modo corrupto
  rationale: וְעוֹד assinala a continuidade de uma condição negativa em contraste com a conduta do rei. O particípio causativo de שׁחת pode descrever conduta corrupta sem explicitar um objeto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico apresenta o Tetragrama como nome próprio. A transliteração preserva sua função nominal sem substituí-lo por um título.
- issue: Relação entre a conduta de Jotão e a entrada de Uzias no templo
  choice: A oração é mantida como ressalva à comparação, com explicação apenas em nota
  alternative: Explicitar no corpo do texto que Uzias entrou ilicitamente no templo
  rationale: O contraste é sugerido pelo contexto de 2Cr 26:16–21, mas o versículo não declara de novo a ilicitude nem nomeia Uzias nessa oração; explicá-la no corpo excederia o texto.
- issue: Sentido de מַשְׁחִיתִים
  choice: agia de modo corrupto
  alternative: corrompia a si mesmo; causava destruição
  rationale: A forma admite uma nuance causativa ou reflexiva. A tradução escolhida comunica a corrupção contínua do povo sem impor um objeto ausente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com ordem natural para leitores brasileiros. “Reto aos olhos de” conserva o idioma bíblico sem soar arcaico; “agia de modo corrupto” evita tanto coloquialismo quanto tecnicismo.
