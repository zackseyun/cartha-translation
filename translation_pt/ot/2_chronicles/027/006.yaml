  text: So Jotham became strong, because he ordered his ways before the LORD his God.
translation:
  language: pt
  text: Assim, Jotão se fortaleceu, porque dirigiu os seus caminhos diante do SENHOR, seu Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: se fortaleceu
  rationale: 'Preserva o sentido reflexivo ou resultativo do hitpael: Jotão tornou-se forte, consolidou sua posição.'
- source_word: הֵכִין דְּרָכָיו
  choice: firmou seus caminhos
  rationale: הכין expressa estabelecer, tornar firme ou preparar. Com 'caminhos', a formulação comunica que Jotão orientou de modo firme sua conduta, sem reduzir a expressão apenas a organização prática.
- source_word: לִפְנֵי יְהוָה אֱלֹהָיו
  choice: diante do SENHOR, seu Deus
  rationale: Reproduz a expressão relacional hebraica e segue a convenção portuguesa de representar o nome divino por SENHOR.
theological_decisions:
- issue: Relação entre a força de Jotão e sua conduta diante de Deus
  choice: porque firmou seus caminhos
  alternative: porque preparou os seus caminhos
  rationale: Mantém explicitamente a relação causal indicada por כִּי e preserva a ênfase do texto na conduta deliberadamente estabelecida diante de Deus, sem acrescentar uma doutrina de mérito.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do hebraico. 'Firmou seus caminhos' preserva a imagem bíblica e soa mais natural do que 'ordenou seus caminhos' no português corrente.
