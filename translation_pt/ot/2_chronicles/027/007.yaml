base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/007.yaml
  text: The rest of the acts of Jotham[a], and all his wars and his ways—behold[b], they are written in the Book of the Kings of Israel and Judah.
translation:
  language: pt
  text: Os demais feitos de Jotão[a], todas as suas guerras e sua conduta — eis que estão escritos no Livro dos Reis de Israel e de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os demais assuntos relativos a Jotão”; a expressão hebraica refere-se ao registro de seus feitos ou de seus assuntos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹתָם
  choice: Quanto aos demais feitos de Jotão
  rationale: Na fórmula de conclusão régia, דִּבְרֵי designa os feitos ou assuntos relativos ao rei, não apenas suas palavras. “Quanto aos demais” expressa naturalmente a transição resumitiva de וְיֶתֶר.
- source_word: וְכָל מִלְחֲמֹתָיו
  choice: a todas as suas guerras
  rationale: מִלְחָמוֹת denota guerras ou conflitos militares; “guerras” é direto e preserva o plural do hebraico.
- source_word: וּדְרָכָיו
  choice: à sua conduta
  rationale: Embora דְּרָכָיו seja literalmente “seus caminhos”, aqui a metáfora se refere à maneira de agir ou viver. “Sua conduta” comunica esse sentido com clareza em português atual.
- source_word: הִנָּם כְּתוּבִים
  choice: estão escritos
  rationale: O plural retoma o conjunto de feitos, guerras e conduta. A construção portuguesa já apresenta o registro como existente, enquanto a tradução explícita de הִנָּם por “eis que” seria marcada e pouco natural nesta fórmula arquivística.
- source_word: עַל סֵפֶר
  choice: no Livro
  rationale: Embora עַל tenha sentido básico de “sobre”, a expressão idiomática portuguesa para conteúdo registrado é “escrito no livro”.
- source_word: מַלְכֵי יִשְׂרָאֵל וִיהוּדָה
  choice: dos Reis de Israel e de Judá
  rationale: A expressão identifica o título ou a designação da fonte documental. A repetição de “de” antes de Judá torna clara e natural a coordenação em português.
