source:
  edition: WLC
  text: ה֗וּא בָּנָ֛ה אֶת שַׁ֥עַר בֵּית יְהוָ֖ה הָ/עֶלְי֑וֹן וּ/בְ/חוֹמַ֥ת הָ/עֹ֛פֶל בָּנָ֖ה לָ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/003.yaml
  text: He built the upper gate of the house of Yahweh[a], and on the wall of the Ophel he built much.
translation:
  language: pt
  text: Ele construiu o portão superior da casa de Yahweh e construiu muito na muralha do Ofel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fez muitas construções na muralha do Ofel” ou “construiu em grande escala na muralha do Ofel”.'
    reason: A expressão לָרֹב pode indicar grande quantidade ou extensão da atividade de construção; o hebraico admite essas formulações.
lexical_decisions:
- source_word: בָּנָה
  choice: construiu
  rationale: É o sentido comum do verbo, e o contexto imediato não exige a ideia mais específica de reconstrução. A repetição foi preservada nas duas orações.
- source_word: שַׁעַר
  choice: portão
  rationale: Designa um portão ou entrada monumental de cidade ou templo; “portão” é claro e natural no contexto arquitetônico.
- source_word: בֵּית יְהוָה
  choice: casa de Yahweh
  rationale: Preserva a expressão hebraica literalmente, sem substituí-la pelo termo interpretativo “templo”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de o substituir por um título.
- source_word: הָעֶלְיוֹן
  choice: superior
  rationale: Como adjetivo de “portão”, indica sua posição; “portão superior” é idiomático e preciso.
- source_word: וּבְחוֹמַת
  choice: e ... na muralha
  rationale: A preposição בְּ indica o local ou objeto em que se realizou a obra. “Muralha” comunica a natureza defensiva de חוֹמָה.
- source_word: הָעֹפֶל
  choice: o Ofel
  rationale: Trata-se da designação própria da área elevada e fortificada de Jerusalém, por isso foi transliterada.
- source_word: לָרֹב
  choice: muito
  rationale: Reflete de perto a ideia de grande quantidade ou extensão da atividade construtiva, preservando a formulação concisa e um pouco incomum do hebraico.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em forma transliterada, sem o substituir por “SENHOR”.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Conservou-se “casa de Yahweh” por proximidade formal ao hebraico e a repetição de “construiu” para refletir a estrutura do versículo. O marcador foi colocado junto à expressão lexicalmente ambígua a que a nota se refere.
