  text: וְ֠/הוּא נִלְחַ֞ם עִם מֶ֣לֶךְ בְּנֵי עַמּוֹן֮ וַ/יֶּחֱזַ֣ק עֲלֵי/הֶם֒ וַ/יִּתְּנוּ ל֨/וֹ בְנֵֽי עַמּ֜וֹן בַּ/שָּׁנָ֣ה הַ/הִ֗יא מֵאָה֙ כִּכַּר כֶּ֔סֶף וַ/עֲשֶׂ֨רֶת אֲלָפִ֤ים כֹּרִים֙ חִטִּ֔ים וּ/שְׂעוֹרִ֖ים עֲשֶׂ֣רֶת אֲלָפִ֑ים זֹ֗את הֵשִׁ֤יבוּ ל/וֹ֙ בְּנֵ֣י עַמּ֔וֹן וּ/בַ/שָּׁנָ֥ה הַ/שֵּׁנִ֖ית וְ/הַ/שְּׁלִשִֽׁית־־־־־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/005.yaml
  text: He fought with the king of the Ammonites and prevailed against them[a], and the Ammonites gave him that year one hundred talents of silver, ten thousand cors of wheat, and ten thousand of barley. This the Ammonites paid to him also in the second year and in the third.
translation:
  language: pt
  text: Ele guerreou contra o rei dos amonitas e prevaleceu sobre eles. Naquele ano, os amonitas lhe deram cem talentos de prata, dez mil coros de trigo e dez mil de cevada.[a] Os amonitas também lhe entregaram o mesmo no segundo e no terceiro ano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “dez mil coros de trigo e dez mil de cevada”; a medida “coros” também está subentendida com “cevada”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִלְחַם עִם
  choice: guerreou contra
  rationale: O nifal de לחם com עִם indica entrar em combate com alguém; em português, “guerreou contra” expressa naturalmente a relação hostil do contexto.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: o rei dos amonitas
  rationale: בְּנֵי עַמּוֹן é a designação habitual do povo amonita; “amonitas” é claro e corrente em português bíblico moderno.
- source_word: וַיֶּחֱזַק עֲלֵיהֶם
  choice: prevaleceu sobre eles
  rationale: Em contexto militar, חזק com עַל comunica superioridade e vitória, não apenas força física.
- source_word: וַיִּתְּנוּ לוֹ
  choice: lhe deram
  rationale: Preserva o sentido básico de נתן, embora os bens sejam tributo no contexto.
- source_word: בַּשָּׁנָה הַהִיא
  choice: Naquele ano
  rationale: Mantém a força demonstrativa da expressão hebraica de forma natural.
- source_word: מֵאָה כִּכַּר כֶּסֶף
  choice: cem talentos de prata
  rationale: “Talento” é a designação tradicional e reconhecível dessa antiga unidade de peso.
- source_word: כֹּרִים
  choice: coros
  rationale: Translitera a unidade antiga de volume, preservando sua especificidade sem impor uma conversão moderna incerta.
- source_word: חִטִּים
  choice: trigo
  rationale: Equivalente lexical direto e corrente.
- source_word: וּשְׂעוֹרִים עֲשֶׂרֶת אֲלָפִים
  choice: e dez mil de cevada
  rationale: Reproduz a elipse hebraica, na qual a unidade “coros” fica subentendida após “cevada”; a explicação consta em nota.
- source_word: זֹאת הֵשִׁיבוּ לוֹ
  choice: lhe pagaram a mesma quantia
  rationale: No contexto de tributo recorrente, o hifil de שׁוב denota entregar novamente o mesmo pagamento. “A mesma quantia” retoma naturalmente o conjunto mencionado, embora inclua produtos e prata.
- source_word: וּבַשָּׁנָה הַשֵּׁנִית וְהַשְּׁלִשִׁית
  choice: também no segundo e no terceiro ano
  rationale: Expressa que o tributo foi repetido em cada um dos dois anos seguintes.
