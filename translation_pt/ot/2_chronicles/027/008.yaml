lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: tinha vinte e cinco anos
  rationale: A fórmula hebraica de idade é expressa de modo natural e claro em português, sem o literalismo inadequado de «era filho de vinte e cinco anos».
- source_word: הָיָה בְמָלְכוֹ
  choice: quando começou a reinar
  rationale: A construção idiomática indica a idade no início do reinado; esta formulação preserva seu valor temporal em português corrente.
- source_word: וְשֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: dezesseis anos
  rationale: Tradução direta do numeral cardinal acompanhado de «anos».
- source_word: מָלַךְ
  choice: reinou
  rationale: O verbo designa especificamente o exercício da realeza, e «reinou» é seu equivalente direto e convencional.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: A preposição בְּ marca aqui localização; «em Jerusalém» comunica diretamente o sentido geográfico.
