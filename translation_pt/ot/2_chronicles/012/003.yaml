  text: בְּ/אֶ֤לֶף וּ/מָאתַ֨יִם֙ רֶ֔כֶב וּ/בְ/שִׁשִּׁ֥ים אֶ֖לֶף פָּרָשִׁ֑ים וְ/אֵ֣ין מִסְפָּ֗ר לָ/עָ֞ם אֲשֶׁר בָּ֤אוּ עִמּ/וֹ֙ מִ/מִּצְרַ֔יִם לוּבִ֥ים סֻכִּיִּ֖ים וְ/כוּשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/003.yaml
  text: 'with 1,200 chariots and 60,000 horsemen[a], and the people who came with him from Egypt were without number: Libyans, Sukkites[c][b], and Cushites.'
translation:
  language: pt
  text: 'com 1.200 carros de guerra e 60.000 cavaleiros; e era incontável[a] o povo que veio com ele do Egito: líbios, suquitas[b] e cuxitas[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “não havia número para o povo”.
    reason: lexical_alternative
  - marker: b
    text: “Suquitas” representa o nome de um povo cuja identificação exata é incerta; também se pode transliterar “suquiim”.
    reason: cultural_note
  - marker: c
    text: Ou “etíopes”; “cuxitas”, porém, representa mais diretamente o termo étnico-geográfico hebraico.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֶלֶף וּמָאתַיִם רֶכֶב
  choice: com 1.200 carros de guerra
  rationale: O בְּ introduz aqui a enumeração das forças que o acompanhavam. Embora רֶכֶב possa designar coletivamente a força de carros, a contagem pede em português o plural concreto “carros de guerra”.
- source_word: וּבְשִׁשִּׁים אֶלֶף פָּרָשִׁים
  choice: e 60.000 cavaleiros
  rationale: פָּרָשִׁים designa combatentes montados. “Cavaleiros” é claro, corrente e evita o tom mais técnico de “tropas de cavalaria”.
- source_word: וְאֵין מִסְפָּר לָעָם
  choice: e era incontável o povo
  rationale: A expressão hebraica diz literalmente que não havia número para o povo. “Era incontável” comunica o idiomatismo sem substituir עָם por “exército” ou “tropas”.
- source_word: אֲשֶׁר בָּאוּ עִמּוֹ מִמִּצְרַיִם
  choice: que veio com ele do Egito
  rationale: A relativa identifica tanto a companhia quanto a procedência do grupo. O singular “veio” faz concordância natural com o coletivo “povo” em português.
- source_word: לוּבִים
  choice: líbios
  rationale: Emprega-se o gentílico português estabelecido para o grupo associado à Líbia, em vez de uma transliteração opaca.
- source_word: סֻכִּיִּים
  choice: suquitas
  rationale: Transliteração adaptada à ortografia portuguesa de um etnônimo cuja identificação histórica exata permanece incerta.
- source_word: וְכוּשִׁים
  choice: e cuxitas
  rationale: “Cuxitas” representa diretamente o etnônimo histórico-geográfico כּוּשׁ e evita identificar sem ressalva o grupo com os etíopes modernos.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Mantém-se “povo” para עָם, sem explicitar “exército”, e preservam-se os etnônimos históricos em formas portuguesas. O ponto e vírgula separa com clareza a enumeração militar da descrição do contingente humano.
