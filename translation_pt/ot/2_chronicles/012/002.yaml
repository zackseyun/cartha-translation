  text: וַ/יְהִ֞י בַּ/שָּׁנָ֤ה הַֽ/חֲמִישִׁית֙ לַ/מֶּ֣לֶךְ רְחַבְעָ֔ם עָלָ֛ה שִׁישַׁ֥ק מֶֽלֶךְ מִצְרַ֖יִם עַל יְרוּשָׁלִָ֑ם כִּ֥י מָעֲל֖וּ בַּ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/002.yaml
  text: And in the fifth year of King Rehoboam[a], Shishak king of Egypt came up against Jerusalem, because they had acted unfaithfully against Yahweh.
translation:
  language: pt
  text: No quinto ano do rei Roboão, Sisaque, rei do Egito, avançou contra Jerusalém, porque eles haviam sido infiéis ao SENHOR.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “haviam agido com infidelidade contra o SENHOR” ou “haviam cometido uma transgressão contra o SENHOR”. O verbo hebraico indica quebra de confiança ou infidelidade à aliança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּשָּׁנָה הַחֲמִישִׁית
  choice: No quinto ano
  rationale: A fórmula narrativa וַיְהִי introduz a circunstância temporal; em português, a expressão direta evita um pouco natural «e aconteceu» sem perder a sequência do relato.
- source_word: לַמֶּלֶךְ רְחַבְעָם
  choice: do rei Roboão
  rationale: O ל relaciona a data ao reinado de Roboão; esta é a forma regnal concisa e idiomática em português.
- source_word: עָלָה ... עַל
  choice: avançou contra
  rationale: Em contexto militar, a construção indica movimento hostil contra um alvo. «Avançou contra» preserva o movimento sem afirmar além do texto que o ataque já havia começado.
- source_word: שִׁישַׁק
  choice: Sisaque
  rationale: Forma tradicional e reconhecível do nome em português.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: rei do Egito
  rationale: Tradução direta da cadeia construta, empregada como aposição a Sisaque.
- source_word: כִּי
  choice: porque
  rationale: A conjunção apresenta explicitamente a causa teológica da invasão.
- source_word: מָעֲלוּ
  choice: haviam sido infiéis
  rationale: O verbo מעל expressa quebra de fidelidade, especialmente em âmbito pactuai. A formulação é natural e mantém a dimensão relacional e religiosa.
- source_word: בַּיהוָה
  choice: ao SENHOR
  rationale: Com מעל, a preposição identifica aquele a quem a infidelidade foi cometida. «Ao SENHOR» é a regência portuguesa mais natural, e SENHOR representa o Tetragrama segundo a convenção adotada.
theological_decisions:
- issue: Explicação pactual da invasão de Sisaque
  choice: porque eles haviam sido infiéis ao SENHOR
  alternative: porque haviam cometido uma transgressão contra o SENHOR
  rationale: O texto atribui a invasão à quebra de fidelidade para com YHWH. A tradução conserva essa causalidade teológica e o caráter relacional de מעל, sem reduzir a afirmação a uma explicação meramente política.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. «Avançou contra» mantém o sentido militar sem tornar o enunciado mais específico que o hebraico. O marcador [a] aparece no texto principal e remete à nuance de מעל.
