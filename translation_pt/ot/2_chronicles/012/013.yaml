source:
  edition: WLC
  text: וַ/יִּתְחַזֵּ֞ק הַ/מֶּ֧לֶךְ רְחַבְעָ֛ם בִּ/ירוּשָׁלִַ֖ם וַ/יִּמְלֹ֑ךְ כִּ֣י בֶן אַרְבָּעִ֣ים וְ/אַחַ֣ת שָׁנָה֩ רְחַבְעָ֨ם בְּ/מָלְכ֜/וֹ וּֽ/שֲׁבַ֨ע עֶשְׂרֵ֥ה שָׁנָ֣ה מָלַ֣ךְ בִּֽ/ירוּשָׁלִַ֗ם הָ֠/עִיר אֲשֶׁר בָּחַ֨ר יְהוָ֜ה לָ/שׂ֨וּם אֶת שְׁמ֥/וֹ שָׁם֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל וְ/שֵׁ֣ם אִמּ֔/וֹ נַעֲמָ֖ה הָֽ/עַמֹּנִֽית־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/013.yaml
  text: So King Rehoboam strengthened himself in Jerusalem and reigned[a]. Rehoboam was forty-one years old when he began to reign, and he reigned seventeen years in Jerusalem, the city that Yahweh had chosen from all the tribes of Israel to put his name there[b]. And his mother’s name was Naamah the Ammonite.
translation:
  language: pt
  text: Assim, o rei Roboão se fortaleceu em Jerusalém e reinou.[a] Roboão tinha quarenta e um anos quando começou a reinar e reinou dezessete anos em Jerusalém, a cidade que Yahweh havia escolhido, dentre todas as tribos de Israel, para ali pôr o seu nome. O nome da mãe dele era Naamá, a amonita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se estabeleceu em Jerusalém e reinou”. O verbo hebraico pode indicar que Roboão se tornou forte ou consolidou sua posição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: se fortaleceu
  rationale: Preserva o valor reflexivo/incoativo do hitpael de חזק e, no contexto, sugere a consolidação do poder de Roboão, sem limitar a expressão à força física.
- source_word: וַיִּמְלֹךְ
  choice: e reinou
  rationale: Dá continuidade à sequência narrativa sem especificar indevidamente o início do reinado, explicitado na oração seguinte.
- source_word: כִּי ... בְּמָלְכוֹ
  choice: tinha quarenta e um anos quando começou a reinar
  rationale: Reproduz de modo natural em português a fórmula régia hebraica, em que בְּמָלְכוֹ marca o momento da ascensão ao trono.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: לָשׂוּם אֶת שְׁמוֹ שָׁם
  choice: para ali pôr o seu nome
  rationale: Mantém a imagem concreta da fórmula teológica hebraica sem expandi-la para uma interpretação sobre presença ou habitação.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: dentre todas as tribos de Israel
  rationale: Expressa com clareza a seleção de Jerusalém em meio ao conjunto das tribos.
- source_word: וְשֵׁם אִמּוֹ
  choice: O nome da mãe dele era
  rationale: Formulação natural e digna em português moderno para a nota régia sobre a rainha-mãe.
- source_word: הָעַמֹּנִית
  choice: a amonita
  rationale: O gentílico feminino identifica de forma concisa a origem étnica de Naamá.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto apresenta o Tetragrama como nome próprio; a transliteração preserva essa função sem substituí-lo por um título.
- issue: Fórmula de eleição do santuário
  choice: para ali pôr o seu nome
  alternative: para estabelecer ali a sua presença
  rationale: A tradução conserva a expressão concreta do hebraico e evita introduzir uma explicação teológica que o versículo não explicita.
- issue: Relação entre וַיִּתְחַזֵּק e וַיִּמְלֹךְ
  choice: se fortaleceu em Jerusalém e reinou
  alternative: se estabeleceu em Jerusalém e reinou
  rationale: A opção principal preserva mais diretamente a semântica de חזק, enquanto a nota registra a leitura contextual de consolidação ou estabelecimento.
translation_notes:
  register: Português atual, claro e solene, com boa legibilidade brasileira. Mantém a fórmula régia, o nome divino transliterado e o idioma concreto de eleição de Jerusalém. O marcador [a] aparece imediatamente após a oração a que se refere.
