  text: וַ/יְהִ֗י כְּ/הָכִ֞ין מַלְכ֤וּת רְחַבְעָם֙ וּ/כְ/חֶזְקָת֔/וֹ עָזַ֖ב אֶת תּוֹרַ֣ת יְהוָ֑ה וְ/כָל יִשְׂרָאֵ֖ל עִמּֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/001.yaml
  text: And when Rehoboam’s kingdom was established[a], and he had become strong, he abandoned the law of Yahweh—and all Israel with him.
translation:
  language: pt
  text: Quando o reino de Roboão se consolidou e ele se tornou forte, abandonou a lei[a] de Yahweh — e todo o Israel com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a instrução de Yahweh”. O termo hebraico torá pode significar “lei” ou “instrução”, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּהָכִין
  choice: Quando ... se consolidou
  rationale: A construção introduz a circunstância temporal. Com מַלְכוּת como sujeito, “se consolidou” expressa de modo natural o estabelecimento e a estabilização do reino.
- source_word: מַלְכוּת רְחַבְעָם
  choice: o reino de Roboão
  rationale: “Reino” é a tradução corrente e adequada ao contexto narrativo; “Roboão” segue a forma tradicional do nome em português.
- source_word: וּכְחֶזְקָתוֹ
  choice: e ele se tornou forte
  rationale: A expressão indica que Roboão alcançou uma posição de força ou segurança. A formulação explicita o referente masculino sem definir além do hebraico se a força era política, militar ou pessoal.
- source_word: עָזַב
  choice: abandonou
  rationale: Comunica com clareza a ruptura deliberada expressa pelo verbo, sem recorrer ao tom mais arcaico de “desamparou” ou “deixou”.
- source_word: תּוֹרַת יְהוָה
  choice: a lei de Yahweh
  rationale: Neste contexto histórico e pactual, “lei” é uma tradução reconhecível de תּוֹרָה; a nota preserva a alternativa lexical “instrução”. O nome divino é transliterado como “Yahweh”.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: — e todo o Israel com ele
  rationale: Mantém a forma compacta e elíptica do hebraico, indicando que Israel acompanhou Roboão nesse abandono sem acrescentar um verbo ausente do texto.
theological_decisions:
- issue: Alcance de “todo o Israel” no contexto da monarquia dividida
  choice: todo o Israel
  alternative: todo Judá; todo o seu povo
  rationale: O texto hebraico diz יִשְׂרָאֵל. A tradução conserva essa designação sem restringi-la interpretativamente a Judá ou aos súditos de Roboão.
- issue: Sentido de תּוֹרָה
  choice: lei
  alternative: instrução; Torá
  rationale: “Lei” se ajusta ao contexto de infidelidade pactual, mas “instrução” continua sendo uma possibilidade lexical genuína e por isso é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. O travessão preserva a ênfase da frase final elíptica. A nota foi colocada junto de “lei de Yahweh”, expressão à qual a alternativa lexical efetivamente se refere.
