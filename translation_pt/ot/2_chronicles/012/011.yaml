id: 2CH.12.11
reference: 2 Chronicles 12:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִ֛י מִ/דֵּי ב֥וֹא הַ/מֶּ֖לֶךְ בֵּ֣ית יְהוָ֑ה בָּ֤אוּ הָ/רָצִים֙ וּ/נְשָׂא֔וּ/ם וֶ/הֱשִׁב֖וּ/ם אֶל תָּ֥א הָ/רָצִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/011.yaml
  text: And whenever the king entered the house of Yahweh[a], the guards would come and carry them[c][b], and then return them to the guards’ chamber.
translation:
  language: pt
  text: E, sempre que o rei entrava na casa de Yahweh, os guardas vinham, levavam os escudos[a] e depois os devolviam à sala dos guardas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico diz “os levavam”; o pronome se refere aos escudos de bronze mencionados no versículo anterior.
    reason: cross_reference
  - marker: b
    text: Os “guardas” são literalmente “corredores”, nome dado à guarda real. “Sala dos guardas” também pode ser traduzido como “câmara dos corredores”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדֵּי בּוֹא
  choice: sempre que ... entrava
  rationale: A construção מִדֵּי seguida do infinitivo indica ocorrência repetida; o imperfeito em português expressa naturalmente esse costume no passado.
- source_word: בֵּית יְהוָה
  choice: casa de Yahweh
  rationale: Preserva a expressão hebraica tradicional para o templo sem substituir בַּיִת por uma explicação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico.
- source_word: הָרָצִים
  choice: os guardas
  rationale: Embora o sentido literal seja 'os corredores', no contexto da corte o termo designa a guarda real.
- source_word: וּנְשָׂאוּם
  choice: levavam os escudos
  rationale: נשא indica que os guardas tomavam e transportavam os objetos; o antecedente pronominal são os escudos de bronze do versículo anterior.
- source_word: וֶהֱשִׁיבוּם
  choice: os devolviam
  rationale: O hifil de שוב indica fazer voltar, isto é, devolver os escudos ao local onde eram guardados.
- source_word: תָּא
  choice: sala
  rationale: תָּא designa um compartimento ou aposento; 'sala' é corrente e claro em português.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz explicitamente o Tetragrama; 'Yahweh' preserva o nome próprio sem o substituir por um título.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantém 'casa de Yahweh' como expressão bíblica concreta e explicita 'os escudos' no texto para evitar um pronome sem antecedente dentro do versículo.
