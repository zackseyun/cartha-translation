  text: כִּ֥י יִהְיוּ ל֖/וֹ לַ/עֲבָדִ֑ים וְ/יֵדְעוּ֙ עֲב֣וֹדָתִ֔/י וַ/עֲבוֹדַ֖ת מַמְלְכ֥וֹת הָ/אֲרָצֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/008.yaml
  text: For they will become his slaves[a], so that they may know my service and the service of the kingdoms of the lands.
translation:
  language: pt
  text: Pois eles se tornarão escravos dele, para que saibam o que é servir a mim[a] e o que é servir aos reinos de outras terras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido por “servir” também pode incluir prestar culto. Aqui, ele cria um contraste entre o serviço prestado ao SENHOR e a servidão imposta pelos reinos de outras terras.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da ação divina mencionada no contexto anterior, preservando a força causal ou explicativa.
- source_word: יִהְיוּ לוֹ לַעֲבָדִים
  choice: eles se tornarão escravos dele
  rationale: A construção com היה expressa mudança de condição. No contexto da sujeição a Sisaque, “escravos” comunica melhor a perda de liberdade e a subordinação política do que o mais brando “servos”.
- source_word: וְיֵדְעוּ
  choice: para que saibam
  rationale: O imperfeito com waw pode indicar propósito ou resultado neste contexto. “Saibam” preserva o sentido básico de ידע e soa natural na expressão portuguesa “saibam o que é”.
- source_word: עֲבוֹדָתִי
  choice: o que é servir a mim
  rationale: A formulação verbal evita a ambiguidade indesejada de “meu serviço” em português, que poderia sugerir um serviço prestado por Deus, e mantém a ideia de serviço, lealdade e culto prestados a ele.
- source_word: וַעֲבוֹדַת
  choice: e o que é servir
  rationale: Repete “servir” para conservar o contraste deliberado entre o serviço ao SENHOR e a sujeição aos reinos estrangeiros.
- source_word: מַמְלְכוֹת הָאֲרָצוֹת
  choice: aos reinos de outras terras
  rationale: Mantém o plural político de “reinos” e “terras”; “outras” torna natural em português a referência aos domínios estrangeiros sem universalizar a expressão como “reinos da terra” poderia fazer.
theological_decisions:
- issue: Se עֲבוֹדָה, em relação a Deus, deve ser especificado como “culto” ou mantido com o sentido mais amplo de serviço
  choice: servir a mim
  alternative: prestar culto a mim
  rationale: O versículo contrapõe a lealdade e o serviço ao SENHOR à sujeição a poderes terrenos. “Servir” preserva tanto a dimensão religiosa quanto a de obediência e lealdade, sem limitar o termo ao culto ritual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “servir” é intencional e reproduz o contraste lexical do hebraico; “escravos” explicita a severidade da subjugação política.
