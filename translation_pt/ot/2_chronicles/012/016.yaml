base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/016.yaml
  text: And Rehoboam slept with his fathers and was buried in the city of David[a], and Abijah his son reigned in his place.
translation:
  language: pt
  text: Roboão descansou com seus antepassados[a] e foi sepultado na Cidade de Davi. Seu filho Abias reinou em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica tradicional, literalmente “deitou-se com seus pais”, refere-se à morte e à união à linhagem dos antepassados.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: descansou com seus antepassados
  rationale: A expressão hebraica é uma fórmula régia tradicional que indica a morte e a união à linhagem ancestral. “Descansou” conserva a imagem eufemística sem produzir a estranheza que “dormiu com” teria no português atual; “antepassados” comunica aqui o alcance de אֲבֹתָיו melhor que o sentido estrito de “pais”.
- source_word: וַיִּקָּבֵר
  choice: foi sepultado
  rationale: Reproduz naturalmente a forma passiva hebraica e se ajusta ao registro digno de uma notícia régia.
- source_word: בְּעִיר דָּוִיד
  choice: na Cidade de Davi
  rationale: Mantém a designação bíblica reconhecível do lugar; a inicial maiúscula sinaliza seu uso como topônimo.
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: É o equivalente habitual de מלך nas fórmulas de sucessão real e conserva a concisão do hebraico.
- source_word: אֲבִיָּה
  choice: Abias
  rationale: Corresponde à forma אֲבִיָּה presente no texto do Cronista e à forma tradicionalmente reconhecida em português.
- source_word: בְנוֹ
  choice: seu filho
  rationale: Traduz diretamente a relação filial expressa no hebraico.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: Expressa com clareza a sucessão real e acompanha de perto o sentido contextual da expressão hebraica.
