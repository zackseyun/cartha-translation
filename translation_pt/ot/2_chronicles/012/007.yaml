base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/007.yaml
  text: When Yahweh saw that they had humbled themselves[a], the word of Yahweh came to Shemaiah, saying, “They have humbled themselves; I will not destroy them, but I will grant them some deliverance, and my wrath will not be poured out on Jerusalem by the hand of Shishak.”
translation:
  language: pt
  text: 'Quando Yahweh viu que eles se haviam humilhado, a palavra de Yahweh veio a Semaías, dizendo: “Eles se humilharam. Não os destruirei, mas lhes concederei algum livramento[a], e a minha ira não será derramada sobre Jerusalém pela mão de Sisaque.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “darei a eles um pequeno escape” ou “lhes deixarei alguns sobreviventes”. A expressão hebraica é compacta e pode enfatizar um resgate limitado, em contraste com a destruição total.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וּבִרְאוֹת
  choice: Quando ... viu
  rationale: A preposição בְּ com o infinitivo construto de ראה introduz uma oração temporal; esta formulação preserva com naturalidade a sequência dos acontecimentos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera diretamente o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: נִכְנָעוּ
  choice: eles se haviam humilhado / eles se humilharam
  rationale: O nifal de כנע, no contexto da resposta à repreensão profética, expressa humilhação voluntária ou submissão; a forma mais-que-perfeita na primeira ocorrência esclarece sua anterioridade em relação ao ato de Yahweh ver.
- source_word: הָיָה דְבַר יְהוָה אֶל
  choice: a palavra de Yahweh veio a
  rationale: Preserva a fórmula profética hebraica sem reduzi-la a um verbo genérico de fala.
- source_word: לֹא אַשְׁחִיתֵם
  choice: Não os destruirei
  rationale: O hifil de שׁחת significa normalmente destruir em contextos de juízo.
- source_word: וְנָתַתִּי לָהֶם כִּמְעַט לִפְלֵיטָה
  choice: mas lhes concederei algum livramento
  rationale: A expressão compacta pode apontar para escape, livramento limitado ou sobreviventes. A escolha mantém a ideia de mitigação do juízo, enquanto a nota registra a amplitude lexical.
- source_word: תִתַּךְ חֲמָתִי
  choice: a minha ira não será derramada
  rationale: Mantém a metáfora hebraica de derramar a ira e o registro solene próprio de uma declaração de juízo.
- source_word: בְּיַד שִׁישָׁק
  choice: pela mão de Sisaque
  rationale: Preserva a expressão hebraica de agência, ainda compreensível em português, segundo a qual Sisaque seria o instrumento do juízo.
- source_word: שְׁמַעְיָה / שִׁישָׁק
  choice: Semaías / Sisaque
  rationale: Emprega as formas portuguesas tradicionais e reconhecíveis desses nomes próprios.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Natureza da resposta divina à humilhação
  choice: algum livramento
  alternative: um pequeno escape ou alguns sobreviventes
  rationale: O texto afirma uma mitigação real do juízo, mas a construção hebraica não define de maneira inequívoca se o foco recai sobre livramento limitado, oportunidade de escape ou sobreviventes; a tradução e a nota preservam essa tensão.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A fórmula profética e a imagem de derramar a ira foram preservadas; os tempos verbais foram ajustados para tornar explícita a sequência narrativa sem alterar seu sentido.
