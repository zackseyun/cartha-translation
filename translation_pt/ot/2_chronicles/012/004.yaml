  text: וַ/יִּלְכֹּ֛ד אֶת עָרֵ֥י הַ/מְּצֻר֖וֹת אֲשֶׁ֣ר לִֽ/יהוּדָ֑ה וַ/יָּבֹ֖א עַד יְרוּשָׁלִָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/004.yaml
  text: He captured the fortified cities that belonged to Judah and came as far as Jerusalem[a].
translation:
  language: pt
  text: Ele conquistou as cidades fortificadas que pertenciam a Judá e chegou até Jerusalém[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “e avançou até Jerusalém”. O hebraico diz literalmente “chegou até Jerusalém”, destacando que ele alcançou Jerusalém depois de conquistar as cidades fortificadas de Judá.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: conquistou
  rationale: O verbo לכד, no contexto de guerra e cidades, significa capturar ou tomar. “Conquistou” é natural em português e expressa claramente a tomada militar das cidades.
- source_word: עָרֵי הַמְּצֻרוֹת
  choice: as cidades fortificadas
  rationale: A expressão designa literalmente cidades dotadas de fortificações. “Cidades fortificadas” mantém tanto o elemento urbano quanto sua função defensiva.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: que pertenciam a Judá
  rationale: A preposição ל indica aqui posse ou vinculação política. A formulação evita reduzir a expressão à mera localização geográfica.
- source_word: וַיָּבֹא עַד יְרוּשָׁלִָם
  choice: e chegou até Jerusalém
  rationale: בוא com עַד indica movimento até um limite. “Chegou até Jerusalém” preserva a ideia de que ele alcançou a cidade, sem afirmar necessariamente que entrou nela.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A redação conserva a progressão narrativa e não afirma que o invasor tenha entrado em Jerusalém.
