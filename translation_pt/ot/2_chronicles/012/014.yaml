source:
  edition: WLC
  text: וַ/יַּ֖עַשׂ הָ/רָ֑ע כִּ֣י לֹ֤א הֵכִין֙ לִבּ֔/וֹ לִ/דְר֖וֹשׁ אֶת יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/014.yaml
  text: And he did what was evil[a], because he had not set his heart to seek Yahweh.
translation:
  language: pt
  text: Ele fez o que era mau, porque não dispôs seu coração a buscar Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ele fez
  rationale: Traduz diretamente o wayyiqtol de עשה; a omissão de uma conjunção inicial é natural em português num versículo apresentado isoladamente.
- source_word: הָרָע
  choice: o que era mau
  rationale: Expressa de modo natural a avaliação moral do substantivo adjetival hebraico com artigo.
- source_word: כִּי
  choice: porque
  rationale: Mantém o sentido causal, apresentando a falta de disposição interior como razão da conduta má.
- source_word: לֹא הֵכִין
  choice: não dispôs
  rationale: O hifil de כון pode indicar preparar, firmar ou orientar. Com 'coração' e uma ação intencional, 'dispôs' comunica preparação e resolução interior sem explicar além do texto.
- source_word: לִבּוֹ
  choice: o coração
  rationale: Preserva a imagem antropológica hebraica do coração como centro da vontade, intenção e pensamento; o possessivo é naturalmente recuperado pelo sujeito em português.
- source_word: לִדְרוֹשׁ
  choice: para buscar
  rationale: דרשׁ, tendo Deus como objeto, denota buscá-lo, inclusive em devoção e consulta. 'Buscar' conserva essa amplitude.
- source_word: אֶת יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. 'Yahweh' preserva o nome pessoal e evita substituí-lo pelo título אדני, embora 'SENHOR' seja uma tradição de tradução amplamente estabelecida.
- issue: Relação entre a conduta má e o coração não preparado
  choice: porque
  alternative: pois
  rationale: Mantém explicitamente a relação causal de כִּי, sem resolver além do texto como essa disposição interior se relaciona com atos específicos.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe concisa. 'Dispôs o coração' preserva a imagem hebraica e soa mais natural do que 'preparou seu coração', sem perder a ideia de decisão interior deliberada.
