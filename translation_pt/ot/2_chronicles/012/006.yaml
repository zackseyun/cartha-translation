source:
  edition: WLC
  text: וַ/יִּכָּנְע֥וּ שָׂרֵֽי יִשְׂרָאֵ֖ל וְ/הַ/מֶּ֑לֶךְ וַ/יֹּאמְר֖וּ צַדִּ֥יק יְהוָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/006.yaml
  text: Then the leaders of Israel and the king humbled themselves and said[a], “Yahweh is righteous.”
translation:
  language: pt
  text: 'Então os líderes de Israel[a] e o rei se humilharam e disseram: “Yahweh é justo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz “os líderes de Israel”. Neste contexto, alguns entendem que a expressão se refere especificamente aos líderes de Judá sob Roboão, mas o próprio texto diz “Israel”.
    reason: Leitura contextual alternativa; preserva-se no texto principal a designação hebraica explícita.
lexical_decisions:
- source_word: וַיִּכָּנְעוּ
  choice: se humilharam
  rationale: O nifal de כנע expressa aqui humilhação ou submissão voluntária em resposta à repreensão profética. A forma reflexiva é natural em português e preserva o sentido moral e espiritual.
- source_word: שָׂרֵי
  choice: líderes
  rationale: שָׂרִים designa governantes, chefes ou altos oficiais. “Líderes” é claro, atual e adequado ao contexto, sem a possível conotação monárquica mais estreita de “príncipes”.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: O texto hebraico diz explicitamente “Israel”. Embora o contexto histórico trate do reino de Judá sob Roboão, a tradução não harmoniza nem substitui a designação usada pelo Cronista.
- source_word: וְהַמֶּלֶךְ
  choice: e o rei
  rationale: Tradução direta da expressão coordenada, mantendo o rei distinto dos líderes.
- source_word: וַיֹּאמְרוּ
  choice: e disseram
  rationale: A forma verbal plural retoma conjuntamente os líderes e o rei; “e disseram” reproduz com naturalidade a sequência narrativa.
- source_word: צַדִּיק
  choice: justo
  rationale: Neste enunciado, צַדִּיק afirma que Yahweh é moralmente reto e justo em seu juízo. “Justo” preserva essa densidade teológica em português corrente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O tetragrama é apresentado como nome divino, e não substituído por um título. “Yahweh” preserva o nome pessoal presente no hebraico.
theological_decisions:
- issue: Preservar o nome divino ou substituí-lo por um título
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama יְהוָה. A transliteração “Yahweh” preserva o nome da aliança em vez de o substituir por um título.
- issue: Manter “Israel” ou harmonizar com o contexto histórico de Judá
  choice: Israel
  alternative: Judá
  rationale: A redação hebraica diz “Israel”. A tradução preserva a formulação do Cronista e registra em nota a questão contextual, sem resolver silenciosamente a tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “se humilharam” é corrente e evita artificialidade; “Yahweh é justo” mantém concisão e força confessionais. O marcador da nota foi colocado após “Israel”, a expressão efetivamente explicada.
