  text: וְ/דִבְרֵ֣י רְחַבְעָ֗ם הָ/רִאשֹׁנִים֙ וְ/הָ/אֲ֣חַרוֹנִ֔ים הֲ/לֹא הֵ֨ם כְּתוּבִ֜ים בְּ/דִבְרֵ֨י שְׁמַֽעְיָ֧ה הַ/נָּבִ֛יא וְ/עִדּ֥וֹ הַ/חֹזֶ֖ה לְ/הִתְיַחֵ֑שׂ וּ/מִלְחֲמ֧וֹת רְחַבְעָ֛ם וְ/יָרָבְעָ֖ם כָּל הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/015.yaml
  text: The acts of Rehoboam[a], the first and the last, are they not written in the records of Shemaiah the prophet and of Iddo the seer, according to genealogical enrollment? And there were wars between Rehoboam and Jeroboam all their days.
translation:
  language: pt
  text: Os atos de Roboão, do começo ao fim, não estão escritos nos registros de Semaías, o profeta, e de Ido, o vidente, conforme o registro genealógico[a]? Houve guerras entre Roboão e Jeroboão durante todos os seus dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em registros genealógicos” ou “para o registro genealógico”. A expressão hebraica é difícil e pode indicar a forma ou a finalidade do material documental associado a Ido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִבְרֵי רְחַבְעָם
  choice: os atos de Roboão
  rationale: Na fórmula de conclusão de um reinado, דִבְרֵי designa os feitos e acontecimentos do rei, não apenas suas palavras.
- source_word: הָרִאשֹׁנִים וְהָאֲחַרוֹנִים
  choice: do começo ao fim
  rationale: Expressa em português natural a totalidade do reinado indicada literalmente por 'os primeiros e os últimos'.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: não estão escritos
  rationale: Preserva a pergunta retórica convencional usada para citar fontes documentais.
- source_word: בְּדִבְרֵי
  choice: nos registros de
  rationale: Neste contexto historiográfico, דִבְרֵי se refere a material escrito ou documental.
- source_word: הַנָּבִיא / הַחֹזֶה
  choice: o profeta / o vidente
  rationale: Mantém a distinção lexical entre os dois títulos proféticos.
- source_word: לְהִתְיַחֵשׂ
  choice: conforme o registro genealógico
  rationale: O verbo da raiz יחס diz respeito à inscrição ou organização genealógica; a formulação mantém a relação provável sem ocultar a dificuldade da construção.
- source_word: וּמִלְחֲמוֹת
  choice: Houve guerras
  rationale: Explicita em português a predicação implícita na frase nominal hebraica.
- source_word: כָּל הַיָּמִים
  choice: durante todos os seus dias
  rationale: Conserva o idioma hebraico e sua possível referência ao período de vida ou reinado dos dois reis.
