  text: וַ/יַּ֨עַשׂ הַ/מֶּ֤לֶךְ רְחַבְעָם֙ תַּחְתֵּי/הֶ֔ם מָגִנֵּ֖י נְחֹ֑שֶׁת וְ/הִפְקִ֗יד עַל יַד֙ שָׂרֵ֣י הָ/רָצִ֔ים הַ/שֹּׁ֣מְרִ֔ים פֶּ֖תַח בֵּ֥ית הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/010.yaml
  text: So King Rehoboam made bronze shields in their place and committed them to the care of the commanders of the guards[b][a], who kept watch at the entrance of the king’s house.
translation:
  language: pt
  text: Assim, o rei Roboão fez escudos de bronze para substituí-los[a] e os confiou aos comandantes dos guardas[b] que vigiavam a entrada do palácio real.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, para substituir os escudos de ouro levados por Sisaque; veja o versículo anterior.
    reason: cross_reference
  - marker: b
    text: 'Hebraico: “corredores”; provavelmente membros da guarda real ou mensageiros que também serviam como guardas do palácio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fez
  rationale: O sentido básico de עשה neste contexto é produzir ou confeccionar; “fez” é natural e adequado ao estilo narrativo.
- source_word: תַּחְתֵּיהֶם
  choice: para substituí-los
  rationale: A expressão indica substituição e retoma os escudos de ouro levados no versículo anterior.
- source_word: מָגִנֵּי נְחֹשֶׁת
  choice: escudos de bronze
  rationale: נְחֹשֶׁת pode designar cobre ou bronze; no contexto de armas e armaduras, “bronze” é a opção mais provável e convencional.
- source_word: וְהִפְקִיד עַל יַד
  choice: os confiou aos
  rationale: O hifil de פקד com עַל יַד expressa a entrega de algo aos cuidados ou à responsabilidade de alguém.
- source_word: שָׂרֵי הָרָצִים
  choice: comandantes dos guardas
  rationale: שָׂרֵי designa chefes ou oficiais, enquanto הָרָצִים, literalmente “corredores”, refere-se neste contexto régio a um corpo de servidores que atuava como guarda real.
- source_word: הַשֹּׁמְרִים
  choice: que vigiavam
  rationale: O particípio apresenta a vigilância como função contínua desses guardas.
- source_word: פֶּתַח בֵּית הַמֶּלֶךְ
  choice: a entrada do palácio real
  rationale: Embora literalmente seja “a entrada da casa do rei”, בֵּית הַמֶּלֶךְ designa aqui a residência ou o palácio do rei; a formulação escolhida é clara e natural.
