source:
  edition: WLC
  text: וּֽ/שְׁמַֽעְיָ֤ה הַ/נָּבִיא֙ בָּ֣א אֶל רְחַבְעָ֔ם וְ/שָׂרֵ֣י יְהוּדָ֔ה אֲשֶׁר נֶאֶסְפ֥וּ אֶל יְרוּשָׁלִַ֖ם מִ/פְּנֵ֣י שִׁישָׁ֑ק וַ/יֹּ֨אמֶר לָ/הֶ֜ם כֹּה אָמַ֣ר יְהוָ֗ה אַתֶּם֙ עֲזַבְתֶּ֣ם אֹתִ֔/י וְ/אַף אֲנִ֛י עָזַ֥בְתִּי אֶתְ/כֶ֖ם בְּ/יַד שִׁישָֽׁק־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/005.yaml
  text: 'Then Shemaiah the prophet came to Rehoboam and the officials of Judah who had gathered in Jerusalem because of Shishak[a], and he said to them, “Thus says Yahweh: You have forsaken me, so I also have forsaken you into the hand of Shishak.”'
translation:
  language: pt
  text: 'Então o profeta Semaías foi até Roboão e os líderes de Judá que haviam se reunido em Jerusalém por causa de Sisaque[a] e lhes disse: “Assim diz Yahweh: Vocês me abandonaram; eu também abandonei vocês nas mãos de Sisaque.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “de diante de Sisaque”; a expressão pode indicar que se reuniram por causa da ameaça dele ou por medo dele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַעְיָה הַנָּבִיא
  choice: Então o profeta Semaías
  rationale: A conjunção faz avançar a narrativa; “Então” expressa naturalmente a sequência. O título definido é preservado, e o nome segue a forma portuguesa tradicional.
- source_word: בָּא אֶל רְחַבְעָם
  choice: foi até Roboão
  rationale: בוא אל indica que Semaías se dirigiu e chegou a Roboão. Em português, “foi até” evita a possível impressão dêitica de “veio até” e é natural no relato.
- source_word: וְשָׂרֵי יְהוּדָה
  choice: e os líderes de Judá
  rationale: שָׂרִים designa pessoas em posição de governo ou autoridade. “Líderes” é atual, abrangente e adequado ao contexto, sem o possível sentido dinástico de “príncipes”.
- source_word: אֲשֶׁר נֶאֶסְפוּ אֶל יְרוּשָׁלַםִ
  choice: que haviam se reunido em Jerusalém
  rationale: O nifal expressa a reunião do grupo, e o mais-que-perfeito situa esse ato antes da chegada do profeta. “Em Jerusalém” apresenta naturalmente o local resultante da reunião.
- source_word: מִפְּנֵי שִׁישַׁק
  choice: por causa de Sisaque
  rationale: A locução pode indicar afastamento da presença de alguém, causa ou temor diante dele. “Por causa de” preserva a amplitude contextual sem explicitar além do texto que eles fugiram ou estavam com medo.
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Preserva a fórmula profética solene e representa diretamente o nome divino יְהוָה como Yahweh.
- source_word: אַתֶּם עֲזַבְתֶּם אֹתִי
  choice: Vocês me abandonaram
  rationale: עָזַב comunica abandono, com forte peso relacional e pactual. “Abandonaram” é corrente e digno em português.
- source_word: וְאַף אֲנִי עָזַבְתִּי אֶתְכֶם
  choice: por isso, eu também abandonei vocês
  rationale: A construção estabelece correspondência judicial entre a ação do povo e a de Deus. A repetição de “abandonar” conserva a simetria retórica do hebraico.
- source_word: בְּיַד שִׁישָׁק
  choice: nas mãos de Sisaque
  rationale: A expressão idiomática indica submissão ao poder ou controle de Sisaque. O plural “nas mãos de” é a forma portuguesa natural do mesmo campo metafórico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” preserva o nome da aliança e segue a orientação fornecida, sem substituí-lo por um título.
- issue: Reciprocidade do abandono divino
  choice: “Vocês me abandonaram; por isso, eu também abandonei vocês”
  alternative: “Vocês me abandonaram, e eu também abandonei vocês”
  rationale: “Por isso” torna clara a relação judicial indicada por וְאַף, enquanto a repetição do mesmo verbo mantém a tensão teológica e a correspondência exata entre as duas ações.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Usam-se “vocês” para o plural e formas tradicionais dos nomes bíblicos em português. A formulação preserva a solenidade profética, a simetria do verbo “abandonar” e a ambiguidade contextual de מִפְּנֵי.
