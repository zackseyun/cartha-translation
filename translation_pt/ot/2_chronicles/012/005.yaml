  naturalness: O português é moderno e claro. A eliminação das aspas aninhadas torna a fala profética mais limpa e conforme à pontuação portuguesa corrente.
  terminology: «Profeta», «líderes de Judá», «Yahweh», «abandonaram» e os nomes Semaías, Roboão e Sisaque são adequados. «Nas mãos de Sisaque» é uma expressão portuguesa estabelecida para o idiomatismo hebraico de sujeição ao poder de alguém.
