source:
  edition: WLC
  text: וַ/יַּ֨עַל שִׁישַׁ֥ק מֶֽלֶךְ מִצְרַיִם֮ עַל יְרוּשָׁלִַם֒ וַ/יִּקַּ֞ח אֶת אֹצְר֣וֹת בֵּית יְהוָ֗ה וְ/אֶת אֹֽצְרוֹת֙ בֵּ֣ית הַ/מֶּ֔לֶךְ אֶת הַ/כֹּ֖ל לָקָ֑ח וַ/יִּקַּח֙ אֶת מָגִנֵּ֣י הַ/זָּהָ֔ב אֲשֶׁ֥ר עָשָׂ֖ה שְׁלֹמֹֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/009.yaml
  text: So Shishak king of Egypt came up against Jerusalem and took the treasuries of the house of Yahweh and the treasuries of the king’s house[a]. He took everything[b]; he also took the gold shields that Solomon had made.
translation:
  language: pt
  text: Assim, Sisaque, rei do Egito, subiu contra Jerusalém e tomou os tesouros da casa de Yahweh[a] e os tesouros da casa do rei[b]. Levou tudo; levou também os escudos de ouro que Salomão tinha feito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “templo de Yahweh”.
    reason: lexical_alternative
  - marker: b
    text: Ou “palácio real”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל ... עַל יְרוּשָׁלִַם
  choice: subiu contra Jerusalém
  rationale: Preserva a imagem hebraica de subir em campanha militar contra uma cidade, em formulação clara e natural em português.
- source_word: שִׁישַׁק
  choice: Sisaque
  rationale: Usa a forma portuguesa tradicional e reconhecível do nome próprio hebraico.
- source_word: אֹצְרוֹת
  choice: tesouros
  rationale: No contexto do saque do templo e do palácio, refere-se naturalmente aos bens valiosos guardados nesses locais; evita sugerir apenas os recintos físicos dos tesouros.
- source_word: בֵּית יְהוָה
  choice: casa de Yahweh
  rationale: Conserva a expressão hebraica e a referência direta ao nome divino; nesse contexto, a expressão designa o templo.
- source_word: בֵּית הַמֶּלֶךְ
  choice: casa do rei
  rationale: Mantém o paralelismo formal com 'casa de Yahweh', sem ocultar que a expressão pode designar o palácio real.
- source_word: אֶת־הַכֹּל לָקָח
  choice: Levou tudo
  rationale: Reproduz a breve oração recapitulativa e sua ênfase na totalidade do saque.
- source_word: מָגִנֵּי הַזָּהָב
  choice: escudos de ouro
  rationale: Equivalência direta e idiomática para os escudos cerimoniais feitos de ouro.
- source_word: אֲשֶׁר עָשָׂה שְׁלֹמֹה
  choice: que Salomão tinha feito
  rationale: O mais-que-perfeito composto esclarece naturalmente que a fabricação ocorreu antes do saque.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama; 'Yahweh' preserva o nome próprio em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de 'levou' e o paralelismo entre as duas 'casas' refletem a estrutura enfática do hebraico. Os marcadores foram posicionados junto às expressões às quais suas respectivas alternativas se referem.
