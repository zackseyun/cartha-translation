- from: Quando ele se humilhou[a], a ira de Yahweh se afastou dele, de modo que não o destruiu por completo[b]. Além disso, havia coisas boas em Judá[c].
  to: Quando ele se humilhou[a], a ira de Yahweh se afastou dele, para não o destruir completamente[b]. Além disso, havia coisas boas em Judá[c].
  rationale: A revisão preserva a forma infinitiva e a nuance de finalidade ou resultado da sequência hebraica «e não para destruir completamente», sem alterar o sentido de mitigação do juízo. A nota b foi corrigida para descrever com precisão a função intensificadora da expressão hebraica. As demais escolhas são fiéis, naturais e mantêm a ambiguidade do texto-fonte.
