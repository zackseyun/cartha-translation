base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/012.yaml
  text: And when he humbled himself[a], the anger of Yahweh turned away from him, so as not to destroy him completely[b]; and also in Judah there were good things.
translation:
  language: pt
  text: Quando ele se humilhou[a], a ira de Yahweh se afastou dele, para não o destruir completamente[b]. Além disso, havia coisas boas em Judá[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando ele foi humilhado”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico usa uma expressão que reforça a ideia de destruição total.
    reason: literal_rendering
  - marker: c
    text: A expressão hebraica é ampla e pode se referir a condições, ações ou outros aspectos positivos em Judá.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהִכָּנְעוֹ
  choice: Quando ele se humilhou
  rationale: 'A preposição בְּ com o infinitivo construto tem valor temporal, e o hitpael de כנע é reflexivo neste contexto: Roboão se humilhou.'
- source_word: שָׁב מִמֶּנּוּ אַף יְהוָה
  choice: a ira de Yahweh se afastou dele
  rationale: שׁוב com מִן expressa afastamento ou recuo. A formulação mantém a imagem direcional do hebraico sem recorrer ao mais interpretativo “Yahweh desistiu”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, preservando-o como nome próprio em vez de substituí-lo por um título.
- source_word: וְלֹא לְהַשְׁחִית לְכָלָה
  choice: de modo que não o destruiu por completo
  rationale: A sequência negativa com infinitivo indica resultado ou propósito; לְכָלָה intensifica a destruição como completa. O pronome “o” explicita em português o referente contextual.
- source_word: וְגַם בִּיהוּדָה הָיָה דְּבָרִים טוֹבִים
  choice: Além disso, havia coisas boas em Judá
  rationale: “Além disso” comunica a força aditiva de וְגַם. “Coisas boas” preserva a abrangência de דְּבָרִים טוֹבִים sem restringi-la a ações, condições ou acontecimentos específicos.
theological_decisions:
- issue: A mitigação do juízo divino em resposta à humilhação de Roboão
  choice: a ira de Yahweh se afastou dele, de modo que não o destruiu por completo
  alternative: Yahweh desistiu de destruí-lo completamente
  rationale: A redação mantém tanto a realidade da ira divina quanto sua mitigação, sem sugerir que todas as consequências do juízo foram anuladas.
- issue: O alcance das “coisas boas” em Judá
  choice: havia coisas boas em Judá
  alternative: havia boas ações em Judá
  rationale: O hebraico é deliberadamente amplo e não especifica se se trata de ações louváveis, condições favoráveis ou outros aspectos positivos.
translation_notes:
  register: Português atual, digno e de leitura natural, com vocabulário amplamente compreensível no Brasil e em outros contextos lusófonos. A estrutura causal foi tornada idiomática sem eliminar a relação entre a humilhação de Roboão e a mitigação do juízo.
