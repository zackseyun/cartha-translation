  source_fidelity: A tradução transmite corretamente a rebelião contra Nabucodonosor, o juramento por Deus e a recusa de retornar a Yahweh. Contudo, «atitude» substitui a imagem corporal específica de עָרֶף («nuca/pescoço») por uma abstração e, mesmo com nota, reduz desnecessariamente a metáfora do texto.
  naturalness: O português é claro e moderno. «Endureceu a nuca» conserva uma imagem bíblica compreensível, com explicação em nota; «para não voltar-se para» expressa naturalmente o valor contextual de מִשּׁוּב sem a perífrase mais interpretativa «recusando-se».
  terminology: «Nabucodonosor», «Deus», «Yahweh» e «o Deus de Israel» estão adequados e consistentes. «Yahweh» reproduz o nome divino distintamente do título אלהים.
