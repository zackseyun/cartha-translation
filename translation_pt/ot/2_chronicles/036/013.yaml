    rationale: וַיֶּקֶשׁ אֶת־עָרְפּוֹ significa literalmente tornar rígida/endurecer a própria nuca (uma imagem de obstinação). «Atitude» comunica parte do sentido, mas troca a metáfora e não é exigida pela naturalidade do português.
  - severity: low
    issue: «Recusando-se a voltar» explicita a volição mais do que a construção hebraica.
    rationale: O sentido contextual é de não retornar, mas «para não voltar-se para» acompanha de modo mais próximo a relação de מִשּׁוּב com o endurecimento do coração, mantendo leitura portuguesa natural.
