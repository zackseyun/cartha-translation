  text: וְ֠/גַם בַּ/מֶּ֤לֶךְ נְבֽוּכַדְנֶאצַּר֙ מָרָ֔ד אֲשֶׁ֥ר הִשְׁבִּיע֖/וֹ בֵּֽ/אלֹהִ֑ים וַ/יֶּ֤קֶשׁ אֶת עָרְפּ/וֹ֙ וַ/יְאַמֵּ֣ץ אֶת לְבָב֔/וֹ מִ/שּׁ֕וּב אֶל יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/013.yaml
  text: He also rebelled against King Nebuchadnezzar[a], who had made him swear by God; he stiffened his neck and hardened his heart from turning to Yahweh[b], the God of Israel.
translation:
  language: pt
  text: Também se rebelou contra o rei Nabucodonosor[a], que o havia feito jurar por Deus. Endureceu a nuca[b] e o coração, para não voltar-se para Yahweh, o Deus de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que o havia obrigado a prestar juramento diante de Deus”. O hebraico pode destacar tanto o ato de fazê-lo jurar por Deus quanto o caráter solene do juramento perante Deus.'
    reason: lexical_alternative
  - marker: b
    text: Expressão hebraica que descreve resistência obstinada; literalmente, tornou rígida ou endureceu a sua nuca.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם
  choice: Também
  rationale: Mantém o sentido aditivo e a continuidade narrativa de forma natural em português.
- source_word: בַּמֶּלֶךְ נְבוּכַדְנֶאצַּר מָרָד
  choice: se rebelou contra o rei Nabucodonosor
  rationale: Com מָרַד, a preposição ב marca a autoridade contra a qual se dirige a rebelião.
- source_word: אֲשֶׁר הִשְׁבִּיעוֹ בֵּאלֹהִים
  choice: que o havia feito jurar por Deus
  rationale: O hifil de שׁבע significa fazer alguém jurar; בֵּאלֹהִים é traduzido diretamente como 'por Deus', sem excluir a nuance solene indicada na nota.
- source_word: וַיֶּקֶשׁ אֶת עָרְפּוֹ
  choice: Tornou obstinada a sua atitude
  rationale: Comunica em português corrente o sentido da expressão hebraica literalmente relacionada a enrijecer a nuca, enquanto a imagem original é preservada em nota.
- source_word: וַיְאַמֵּץ אֶת לְבָבוֹ
  choice: endureceu o coração
  rationale: No contexto de resistência ao arrependimento, o verbo expressa obstinação; a formulação preserva a metáfora bíblica do coração.
- source_word: מִשּׁוּב אֶל
  choice: recusando-se a voltar para
  rationale: O מן com infinitivo indica afastamento ou impedimento. A formulação explicita naturalmente que o endurecimento resultou na recusa de retornar, sem alterar a direção expressa por אֶל.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, distinguindo-o do título 'Deus' que vem em seguida.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reproduz naturalmente a construção hebraica e sua identificação pactual.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto contém diretamente o tetragrama; 'Yahweh' preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Relação entre endurecer o coração e voltar para Yahweh
  choice: recusando-se a voltar para Yahweh
  alternative: afastando o coração de voltar para Yahweh; para não voltar para Yahweh
  rationale: Expressa a resistência deliberada indicada pelo contexto e pelo מן com infinitivo, sem formular uma doutrina mais ampla sobre a origem do endurecimento.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A metáfora do coração foi mantida; a expressão da nuca rígida foi comunicada no texto e preservada literalmente em nota.
