base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/004.yaml
  text: And the king of Egypt made Eliakim his brother king over Judah and Jerusalem[a], and changed his name to Jehoiakim. And Neco took his brother Jehoahaz and brought him to Egypt.
translation:
  language: pt
  text: O rei do Egito constituiu Eliaquim, irmão de Jeoacaz, rei sobre Judá e Jerusalém e mudou o nome dele para Jeoaquim. E Neco[a] tomou Jeoacaz, irmão de Eliaquim, e o levou para o Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também chamado Necao em traduções tradicionais.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְלֵךְ
  choice: constituiu ... rei
  rationale: 'O hifil de מלך é causativo: o rei do Egito instalou Eliaquim como rei. A formulação é natural e mantém explícita a ação régia.'
- source_word: אֶלְיָקִים אָחִיו
  choice: Eliaquim, irmão de Jeoacaz
  rationale: O sufixo pronominal identifica Eliaquim como irmão de Jeoacaz. Explicitar o referente em português evita uma ambiguidade pronominal acidental sem alterar a relação expressa pelo hebraico.
- source_word: עַל יְהוּדָה וִירוּשָׁלַם
  choice: sobre Judá e Jerusalém
  rationale: A preposição עַל, no contexto da nomeação real, indica o âmbito do governo; preservam-se tanto o reino como a capital.
- source_word: וַיַּסֵּב אֶת שְׁמוֹ יְהוֹיָקִים
  choice: mudou o nome dele para Jeoaquim
  rationale: A expressão descreve a mudança imposta do nome e é vertida de modo claro e corrente.
- source_word: וְאֶת יוֹאָחָז אָחִיו לָקַח נְכוֹ
  choice: E Neco levou Jeoacaz, irmão de Eliaquim
  rationale: Mantém-se a conjunção coordenativa do hebraico, sem introduzir contraste explícito. Neste contexto, לקח descreve Neco tomando Jeoacaz consigo; 'levou' liga-se naturalmente ao destino indicado na oração seguinte. O referente de 'irmão' é explicitado para clareza.
- source_word: וַיְבִיאֵהוּ מִצְרָיְמָה
  choice: para o Egito
  rationale: O sufixo direcional em מִצְרַיִם indica movimento em direção ao Egito; combinado com 'levou', produz português conciso e fiel.
- source_word: נְכוֹ
  choice: Neco
  rationale: Transliteração portuguesa simples, próxima da vocalização hebraica; a forma tradicional 'Necao' é registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Os referentes dos dois usos de 'irmão' foram explicitados para evitar ambiguidade não intencional em português. A coordenação com 'E' preserva o וְ hebraico, sem acrescentar oposição.
