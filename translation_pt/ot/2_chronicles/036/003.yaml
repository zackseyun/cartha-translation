base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/003.yaml
  text: And the king of Egypt deposed him in Jerusalem and imposed on the land a tribute of a hundred talents of silver and a talent of gold[a][b][c].
translation:
  language: pt
  text: O rei do Egito o destituiu[a] em Jerusalém e impôs ao país uma multa[b] de cem talentos de prata e um talento de ouro[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o removeu” ou “o levou embora”; o verbo hebraico pode indicar tanto a remoção de alguém de sua posição como seu afastamento físico.
    reason: alternative_reading
  - marker: b
    text: Ou “impôs ao país um tributo”; o verbo se refere à imposição de uma penalidade financeira.
    reason: lexical_alternative
  - marker: c
    text: O talento era uma grande unidade de peso da Antiguidade; o texto mantém a medida antiga em vez de convertê-la.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְסִירֵהוּ
  choice: o destituiu
  rationale: A forma causativa de סוּר significa remover ou afastar. No contexto régio, “destituiu” expressa naturalmente a remoção do rei de sua posição, enquanto a nota preserva a possibilidade mais ampla de ele ter sido levado embora.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: o rei do Egito
  rationale: Reproduz de modo direto e natural a construção hebraica, sem acrescentar o nome do faraó, ausente neste versículo.
- source_word: בִּירוּשָׁלָם
  choice: em Jerusalém
  rationale: A preposição בְּ indica aqui localização; “em Jerusalém” é a formulação corrente em português.
- source_word: וַיַּעֲנֹשׁ
  choice: impôs ... uma multa
  rationale: O verbo עָנַשׁ pode designar a imposição de uma penalidade pecuniária. Como o montante vem especificado, “impôs ... uma multa” comunica com precisão a cobrança financeira.
- source_word: הָאָרֶץ
  choice: à terra
  rationale: Neste contexto, אֶרֶץ se refere ao território ou reino de Judá. “A terra” preserva a expressão hebraica sem generalizá-la para o mundo inteiro.
- source_word: מֵאָה כִכַּר כֶּסֶף
  choice: cem talentos de prata
  rationale: Mantém a antiga unidade de peso כִּכָּר na forma tradicional portuguesa “talento”, sem introduzir uma conversão moderna incerta no texto principal.
- source_word: וְכִכַּר זָהָב
  choice: e um talento de ouro
  rationale: Preserva explicitamente o numeral singular e a mesma unidade de peso empregada na expressão anterior.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível a leitores brasileiros e compreensível internacionalmente. “Destituiu” explicita o sentido político mais provável no contexto, enquanto a nota conserva a amplitude do verbo hebraico. “Multa” reflete diretamente a natureza penal da cobrança; “tributo” é registrado como alternativa contextual.
