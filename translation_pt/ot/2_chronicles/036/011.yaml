lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְאַחַת שָׁנָה
  choice: tinha vinte e um anos
  rationale: A fórmula hebraica de idade, literalmente “filho de vinte e um anos”, é expressa de modo natural e preciso em português com “tinha vinte e um anos”.
- source_word: צִדְקִיָּהוּ
  choice: Zedequias
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: בְמָלְכוֹ
  choice: quando se tornou rei
  rationale: A construção com בְּ indica a ocasião da ascensão ao trono; esta formulação comunica claramente o sentido temporal em português atual.
- source_word: וְאַחַת עֶשְׂרֵה שָׁנָה
  choice: onze anos
  rationale: Tradução direta da expressão numérica que indica a duração do reinado.
- source_word: מָלַךְ
  choice: reinou
  rationale: O verbo hebraico denota exercer a realeza; “reinou” é o equivalente português conciso e específico.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: A preposição locativa e o topônimo são vertidos de maneira convencional e natural em português.
