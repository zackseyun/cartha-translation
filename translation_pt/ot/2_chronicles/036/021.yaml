base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/021.yaml
  text: to fulfill the word of Yahweh by the mouth of Yirmeyahu[a], until the land had enjoyed its Sabbaths. All the days of its desolation it kept Sabbath[d][c][b], to fulfill seventy years.
translation:
  language: pt
  text: para que se cumprisse a palavra de Yahweh pela boca de Jeremias[a], até que a terra desfrutasse dos seus sábados[b]. Durante todos os dias em que ficou desolada, ela descansou[c][d], para completar setenta anos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por meio de Jeremias”. Literalmente, “pela boca de Jeremias”.
    reason: lexical_alternative
  - marker: b
    text: Ou “acolhesse” ou “compensasse” os seus sábados; a ideia é que a terra recebeu o descanso sabático que lhe havia sido negado.
    reason: lexical_alternative
  - marker: c
    text: Ou “cessou”. O hebraico mantém o jogo de palavras entre “seus sábados” e “descansou”.
    reason: lexical_alternative
  - marker: d
    text: Esta linguagem retoma as advertências da aliança sobre a terra desfrutar dos seus sábados durante o exílio; veja Levítico 26:34–35.
    reason: cross_reference
lexical_decisions:
- source_word: לְמַלֹּאות
  choice: para que se cumprisse / para completar
  rationale: O infinitivo de מלא com ל indica propósito ou resultado. Na primeira ocorrência, “cumprir” expressa a realização da palavra profética; na segunda, “completar” é a combinação natural em português com um período de setenta anos, preservando a repetição conceitual.
- source_word: דְּבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: דָּבָר, no contexto de realização profética, é adequadamente traduzido por “palavra”, mantendo a ligação com a profecia de Jeremias.
- source_word: בְּפִי יִרְמְיָהוּ
  choice: pela boca de Jeremias
  rationale: Mantém a imagem hebraica da mensagem pronunciada pela boca do profeta. “Jeremias” é a forma portuguesa corrente e amplamente reconhecida do nome.
- source_word: רָצְתָה
  choice: desfrutasse
  rationale: Com a terra como sujeito e seus sábados como objeto, רצה comunica que a terra recebeu ou desfrutou o descanso sabático que lhe cabia. A nota registra outras nuances lexicais possíveis.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Refere-se à terra de Judá no contexto, não ao planeta inteiro; “a terra” conserva a formulação concisa do hebraico.
- source_word: שַׁבְּתוֹתֶיהָ
  choice: dos seus sábados
  rationale: O plural e o possessivo são mantidos para mostrar que se trata dos descansos sabáticos pertencentes à terra.
- source_word: כָּל יְמֵי הָשַּׁמָּה
  choice: Durante todos os dias em que ficou desolada
  rationale: Expressa com clareza, em português atual, todo o período da desolação da terra.
- source_word: שָׁבָתָה
  choice: guardou o sábado
  rationale: A expressão preserva a ligação lexical e o jogo de palavras entre “sábados” e o verbo שׁבת, embora “descansou” também seja possível.
- source_word: שִׁבְעִים שָׁנָה
  choice: setenta anos
  rationale: Tradução direta do período profético indicado pelo texto.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o nome pessoal divino. “Yahweh” o representa diretamente, em vez de substituí-lo por um título.
- issue: Preservação da teologia sabática em שַׁבְּתוֹתֶיהָ / שָׁבָתָה
  choice: seus sábados ... guardou o sábado
  alternative: seus descansos ... descansou
  rationale: A escolha mantém visível a ligação deliberada entre o exílio, o descanso da terra e as advertências da aliança, sem reduzir o texto à ideia genérica de repouso.
- issue: Relação entre a desolação e os setenta anos
  choice: para completar setenta anos
  alternative: até se completarem setenta anos
  rationale: A formulação conserva a noção de propósito ou resultado do infinitivo hebraico, sem especificar além do texto o modo exato de calcular o período.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas correntes no Brasil. A estrutura inicialmente subordinada foi preservada porque o versículo continua a frase do contexto anterior. A tradução mantém a imagem profética “pela boca” e o jogo sabático, esclarecendo em notas as alternativas lexicais.
