revisions:
- from: Por isso, ele fez subir contra eles o rei dos caldeus[a], que matou à espada os jovens deles na casa do seu santuário. Não teve compaixão nem de jovem nem de virgem[b], nem de velho nem de muito idoso[c]. Ele entregou todos nas mãos do rei.
  to: Então, ele fez vir contra eles o rei dos caldeus[a], que matou à espada os rapazes deles na casa do santuário deles. Não poupou rapaz nem virgem[b], velho nem ancião[c]. Ele entregou todos nas mãos do rei.
