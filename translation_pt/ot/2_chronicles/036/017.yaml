    issue: «Por isso» para o waw inicial
    rationale: O hebraico inicia a continuação narrativa com waw consecutivo; não explicita uma conclusão do tipo «por isso». «Então» conserva melhor a progressão narrativa.
  - severity: medium
    issue: «Fez subir contra eles»
    rationale: Embora formalmente próximo do hifil de עלה, é uma construção pouco idiomática em português moderno. «Fez vir contra eles» mantém a nuance causativa e o sentido militar.
  - severity: low
    issue: Formulação das classes etárias e da compaixão
    rationale: «Não teve compaixão nem de...» é possível, mas «não poupou...» é mais natural e traduz diretamente o efeito de חמל. «Rapaz ... ancião» evita a repetição e a sobreposição pouco elegante de «velho ... muito idoso».
