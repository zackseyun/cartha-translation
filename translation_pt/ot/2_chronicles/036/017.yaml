  naturalness: «Fez vir contra eles» é uma forma moderna e idiomática que conserva a causatividade. «Não poupou» expressa de modo direto e natural o sentido de חמל. «Rapaz» e «ancião» diferenciam melhor as categorias de idade sem a formulação pouco fluida «muito idoso».
  terminology: «Caldeus» e «virgem» mantêm os termos hebraicos. «Casa do santuário deles» preserva os dois elementos de בֵּית מִקְדָּשָׁם e deixa claro que o santuário pertence ao povo atacado. A nota sobre «babilônios» continua apropriada.
  issues:
