  text: וַ/יַּ֨עַל עֲלֵי/הֶ֜ם אֶת מֶ֣לֶךְ כשדיים וַ/יַּהֲרֹ֨ג בַּחוּרֵי/הֶ֤ם בַּ/חֶ֨רֶב֙ בְּ/בֵ֣ית מִקְדָּשָׁ֔/ם וְ/לֹ֥א חָמַ֛ל עַל בָּח֥וּר וּ/בְתוּלָ֖ה זָקֵ֣ן וְ/יָשֵׁ֑שׁ הַ/כֹּ֖ל נָתַ֥ן בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/017.yaml
  text: So he brought up against them the king of the Chaldeans[a], who killed their young men with the sword in the house of their sanctuary, and had no compassion on young man or virgin, old man or aged man[c][b]. He gave all into his hand.
translation:
  language: pt
  text: Então, ele fez vir contra eles o rei dos caldeus[a], que matou à espada os rapazes deles na casa do santuário deles. Não poupou rapaz nem virgem[b], velho nem ancião[c]. Ele entregou todos nas mãos do rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o rei dos babilônios”; em hebraico, “caldeus”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, uma jovem não casada.
    reason: lexical_clarification
  - marker: c
    text: 'Ou: “Não teve compaixão de rapaz nem de virgem, de velho nem de ancião”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל עֲלֵיהֶם
  choice: ele fez subir contra eles
  rationale: Preserva a nuance causativa do hifil de עלה e a expressão militar com עַל, mantendo como sujeito implícito Deus, retomado do contexto anterior.
- source_word: מֶלֶךְ כַּשְׂדִּיִּים
  choice: o rei dos caldeus
  rationale: Representa diretamente o gentílico hebraico; 'babilônios' é uma alternativa contextualmente válida e consta em nota.
- source_word: וַיַּהֲרֹג ... בַּחֶרֶב
  choice: que matou à espada
  rationale: Expressa naturalmente a morte pela arma e liga a ação ao rei dos caldeus sem alterar seu valor narrativo.
- source_word: בַּחוּרֵיהֶם
  choice: os jovens deles
  rationale: בחור designa jovens do sexo masculino no vigor da idade; no contexto bélico, 'os jovens deles' é claro e natural em português.
- source_word: בְּבֵית מִקְדָּשָׁם
  choice: na casa do seu santuário
  rationale: Mantém os dois elementos da expressão hebraica, 'casa' e 'santuário', ressaltando que a matança ocorreu no local sagrado.
- source_word: וְלֹא חָמַל
  choice: Não teve compaixão
  rationale: חמל comunica poupar alguém por pena ou compaixão; a formulação preserva sua força moral, enquanto 'não poupou' fica registrado como alternativa.
- source_word: בָּחוּר וּבְתוּלָה
  choice: nem de jovem nem de virgem
  rationale: Conserva as categorias hebraicas e o significado específico de בתולה, uma jovem não casada.
- source_word: זָקֵן וְיָשֵׁשׁ
  choice: nem de velho nem de muito idoso
  rationale: Distingue os dois termos sobre idade e preserva a intensificação retórica do par hebraico.
- source_word: הַכֹּל נָתַן בְּיָדוֹ
  choice: Ele entregou todos nas mãos do rei
  rationale: Comunica idiomaticamente a entrega de todas as pessoas ao poder do rei. A explicitação de 'do rei' desfaz uma ambiguidade pronominal artificial em português sem mudar o referente contextual.
theological_decisions:
- issue: Sujeito do verbo inicial e da oração final
  choice: Deus é retomado pelo pronome 'ele' e é o sujeito tanto de fazer o rei subir contra o povo como de entregar todos ao poder dele.
  alternative: Deixar o sujeito impessoal ou não identificado.
  rationale: Os verbos hebraicos estão no masculino singular e o sujeito vem do contexto precedente, no qual o SENHOR executa o juízo. O pronome preserva essa continuidade narrativa sem acrescentar uma identificação ausente do contexto.
- issue: Referente de בְּיָדוֹ na oração final
  choice: Explicitar 'nas mãos do rei'.
  alternative: Traduzir literalmente 'em sua mão', deixando uma possível ambiguidade em português.
  rationale: O sufixo masculino singular refere-se naturalmente ao rei dos caldeus, enquanto o sujeito de נתן é Deus. A explicitação evita que o leitor português atribua a mão ao sujeito da oração.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tradução mantém a estrutura solene e cumulativa do hebraico, mas usa construções naturais. Todos os marcadores de nota aparecem no texto principal.
