  text: וּ/מִ/כְּלֵי֙ בֵּ֣ית יְהוָ֔ה הֵבִ֥יא נְבוּכַדְנֶאצַּ֖ר לְ/בָבֶ֑ל וַ/יִּתְּנֵ֥/ם בְּ/הֵיכָל֖/וֹ בְּ/בָבֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/007.yaml
  text: Nebuchadnezzar also brought some of the vessels of the house of Yahweh to Babylon[a], and put them in his temple in Babylon.
translation:
  language: pt
  text: Nabucodonosor também levou alguns dos utensílios da casa de Yahweh para a Babilônia e os colocou em seu templo[a], na Babilônia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “palácio”; a palavra hebraica pode designar um templo ou um palácio, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִכְּלֵי
  choice: também levou alguns dos utensílios
  rationale: 'A combinação de וּ com מִן tem aqui sentido aditivo e partitivo: Nabucodonosor levou também parte dos utensílios. Em português, esta formulação explicita naturalmente esse valor.'
- source_word: בֵּית יְהוָה
  choice: casa de Yahweh
  rationale: Preserva a expressão hebraica literal e inteligível, sem substituir 'casa' por 'templo'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הֵבִיא
  choice: levou
  rationale: O hifil de בוא significa fazer ir ou trazer. Como o movimento é descrito da perspectiva de Judá para a Babilônia, 'levou' é idiomático em português.
- source_word: נְבוּכַדְנֶאצַּר
  choice: Nabucodonosor
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: לְבָבֶל
  choice: para a Babilônia
  rationale: A preposição לְ indica o destino do deslocamento.
- source_word: וַיִּתְּנֵם
  choice: e os colocou
  rationale: Neste contexto, נתן descreve a colocação ou depósito dos utensílios em determinado local.
- source_word: בְּהֵיכָלוֹ
  choice: no templo dele
  rationale: הֵיכָל pode designar templo ou palácio. O contexto de utensílios sagrados favorece 'templo'; 'dele' deixa claro que o sufixo masculino singular se refere a Nabucodonosor.
- source_word: בְּבָבֶל
  choice: na Babilônia
  rationale: A preposição בְּ tem sentido locativo, indicando onde os utensílios foram colocados.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. A transliteração 'Yahweh' preserva o nome pessoal sem substituí-lo por um título.
- issue: Sentido de הֵיכָל no edifício de Nabucodonosor
  choice: templo
  alternative: palácio
  rationale: Embora o termo possa ter ambos os sentidos, a menção dos utensílios retirados da casa de Yahweh favorece um ambiente de culto. A alternativa lexical genuína é preservada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. 'Utensílios' comunica objetos usados no serviço do templo; 'casa de Yahweh' preserva a imagem hebraica. A repetição de 'Babilônia' foi mantida por corresponder ao texto-fonte.
