base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/008.yaml
  text: The rest of the acts of Jehoiakim[a], and the abominations that he did, and what was found against him—behold, they are written in the Book of the Kings of Israel and Judah. And Jehoiachin his son reigned in his place.
translation:
  language: pt
  text: Os demais atos de Jeoaquim, as abominações que praticou e o que foi encontrado contra ele[a] — eis que estão escritos no Livro dos Reis de Israel e de Judá. E Joaquim, seu filho, reinou em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a respeito dele”. A expressão hebraica pode se referir, de modo mais geral, ao que foi descoberto acerca de Jeoaquim, embora “contra ele” combine melhor com o contexto negativo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Os demais atos
  rationale: Na fórmula de resumo régio, דִּבְרֵי abrange os acontecimentos e feitos do reinado; “atos” comunica esse sentido naturalmente, e וְיֶתֶר indica o restante deles.
- source_word: תֹעֲבֹתָיו אֲשֶׁר עָשָׂה
  choice: as abominações que praticou
  rationale: “Abominações” mantém a forte avaliação moral ou cultual do hebraico; “praticou” é idiomático em português para atos moralmente condenáveis.
- source_word: וְהַנִּמְצָא עָלָיו
  choice: e o que foi encontrado contra ele
  rationale: A tradução preserva a construção passiva e seu provável sentido adverso sem transformá-la explicitamente em linguagem jurídica. A possível leitura mais geral é indicada em nota.
- source_word: הִנָּם כְּתוּבִים
  choice: eis que estão escritos
  rationale: “Eis que” conserva a ênfase dêitica de הִנָּם, enquanto “estão escritos” traduz diretamente o particípio passivo.
- source_word: סֵפֶר מַלְכֵי יִשְׂרָאֵל וִיהוּדָה
  choice: Livro dos Reis de Israel e de Judá
  rationale: Trata-se de uma referência a uma fonte documental com função de título; a formulação mantém os dois nomes geográficos e usa maiúscula em “Livro”.
- source_word: וַיִּמְלֹךְ יְהוֹיָכִין בְּנוֹ תַּחְתָּיו
  choice: E Joaquim, seu filho, reinou em seu lugar
  rationale: A redação mantém a fórmula de sucessão régia e distingue em português Joaquim (Jeconias) de seu pai, Jeoaquim.
