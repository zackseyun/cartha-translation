  text: וַ/יִּשְׁלַ֡ח יְהוָה֩ אֱלֹהֵ֨י אֲבוֹתֵי/הֶ֧ם עֲלֵי/הֶ֛ם בְּ/יַ֥ד מַלְאָכָ֖י/ו הַשְׁכֵּ֣ם וְ/שָׁל֑וֹחַ כִּֽי חָמַ֥ל עַל עַמּ֖/וֹ וְ/עַל מְעוֹנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/015.yaml
  text: And Yahweh[a], the God of their fathers, sent word to them by the hand of his messengers, rising early and sending[c][b], because he had compassion on his people and on his dwelling place.
translation:
  language: pt
  text: Yahweh, o Deus dos seus antepassados, enviou-lhes mensagens por meio dos seus mensageiros, vez após vez e com insistência,[a] porque tinha compaixão do seu povo e da sua morada.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “levantando-se cedo e enviando”; expressão idiomática que comunica prontidão, insistência e repetição.
    reason: lexical_alternative
  - marker: b
    text: Isto é, o templo, considerado o lugar da presença de Deus no meio do seu povo.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH, distinguindo-o do título אֲדֹנָי e preservando sua forma de nome próprio.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: o Deus dos seus antepassados
  rationale: “Antepassados” comunica com clareza atual a referência histórica e pactual de אָבוֹת, sem restringi-la aos pais imediatos.
- source_word: וַיִּשְׁלַח ... עֲלֵיהֶם
  choice: enviou-lhes mensagens
  rationale: O objeto da ação está implícito, mas o contexto e a menção dos mensageiros mostram que se trata de comunicações divinas. A formulação é natural em português e evita a construção pouco clara “enviou sobre eles”.
- source_word: בְּיַד מַלְאָכָיו
  choice: por meio dos seus mensageiros
  rationale: A expressão hebraica “pela mão de” indica agência. “Por meio de” verte naturalmente esse valor em português; “mensageiros” evita sugerir necessariamente seres celestiais.
- source_word: הַשְׁכֵּם וְשָׁלוֹחַ
  choice: vez após vez e com insistência
  rationale: A construção idiomática, literalmente ligada a levantar-se cedo e enviar, expressa prontidão, persistência e repetição. A tradução comunica sua força no texto, enquanto a imagem literal é preservada em nota.
- source_word: כִּי חָמַל
  choice: porque tinha compaixão
  rationale: חמל indica compaixão ou piedade que leva a poupar. O imperfeito português apresenta essa compaixão como motivo contínuo dos repetidos envios.
- source_word: עַל עַמּוֹ
  choice: do seu povo
  rationale: Depois de “ter compaixão”, o português rege naturalmente “de”, reproduzindo a relação expressa por עַל.
- source_word: מְעוֹנוֹ
  choice: sua morada
  rationale: Mantém o sentido lexical de lugar de habitação e preserva a linguagem teológica da presença divina, sem substituir no texto o termo pelo referente contextual “templo”.
theological_decisions:
- issue: Identidade dos “mensageiros”
  choice: Manter “mensageiros”, com referência contextual aos profetas humanos
  alternative: “anjos” ou “enviados”
  rationale: O contexto imediato trata dos avisos proféticos enviados repetidamente a Judá. “Mensageiros” preserva o sentido amplo de מַלְאָךְ sem impor uma leitura de seres celestiais.
- issue: Compaixão de Deus por sua “morada”
  choice: Preservar “sua morada”
  alternative: Explicitar “seu templo” no texto
  rationale: A expressão hebraica vincula o templo à presença de Deus e põe em paralelo o povo e a morada. A tradução não reduz essa tensão teológica a uma simples referência arquitetônica.
- issue: Persistência divina no envio das advertências
  choice: Explicitar no texto a repetição e a insistência do idioma hebraico
  alternative: Traduzir literalmente “levantando-se cedo e enviando”
  rationale: O hebraísmo não descreve principalmente um horário físico, mas a prontidão persistente de Deus em enviar avisos. A imagem literal permanece disponível na nota.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. Emprega “antepassados” em vez de “pais” para evitar ambiguidade geracional; “por meio de” em vez do decalque “pela mão de”; e conserva “Yahweh” como nome próprio. A ordem foi ajustada à sintaxe natural do português sem eliminar o paralelismo entre povo e morada.
