base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/010.yaml
  text: At the turn of the year[a], King Nebuchadnezzar sent and brought him to Babylon, along with the precious vessels of the house of Yahweh[c][b], and made his brother Zedekiah king over Judah and Jerusalem.
translation:
  language: pt
  text: Na virada do ano[a], o rei Nabucodonosor mandou buscá-lo e levá-lo para a Babilônia, junto com os utensílios preciosos da casa de Yahweh[b], e constituiu Zedequias, seu irmão[c], rei sobre Judá e Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “no retorno do ano”, expressão que indica a época em que o ano completava seu ciclo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os objetos valiosos da casa de Yahweh”.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “seu irmão”. Aqui, o termo de parentesco tem sentido mais amplo; Zedequias era tio de Joaquim.'
    reason: cultural_note
lexical_decisions:
- source_word: וְלִתְשׁוּבַת הַשָּׁנָה
  choice: Na virada do ano
  rationale: Preserva a imagem hebraica do retorno ou virar do ano em português natural, sem especificar interpretativamente a primavera.
- source_word: שָׁלַח ... וַיְבִאֵהוּ
  choice: mandou buscá-lo e o levou
  rationale: Expressa de modo idiomático a ação régia de enviar agentes para tomar Joaquim e conduzi-lo à Babilônia, sem exigir que Nabucodonosor o tenha acompanhado pessoalmente.
- source_word: בָבֶלָה
  choice: para a Babilônia
  rationale: Representa o sufixo direcional hebraico, que indica movimento em direção à Babilônia.
- source_word: כְּלֵי חֶמְדַּת
  choice: os utensílios preciosos
  rationale: Utensílios é adequado aos objetos do templo, enquanto preciosos comunica seu valor e caráter desejável.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Mantém a expressão hebraica casa e translitera o nome divino pessoal יהוה como Yahweh.
- source_word: וַיַּמְלֵךְ
  choice: constituiu ... rei
  rationale: Comunica o sentido causativo de fazer alguém reinar ou estabelecê-lo como rei.
- source_word: אָחִיו
  choice: parente dele
  rationale: Embora a forma hebraica diga literalmente irmão dele, o termo de parentesco é mais amplo neste contexto; segundo a genealogia, Zedequias era tio de Joaquim. A nota preserva a forma literal.
- source_word: עַל יְהוּדָה וִירוּשָׁלָם
  choice: sobre Judá e Jerusalém
  rationale: Preserva a preposição que indica o domínio sobre o qual Zedequias foi posto como rei.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; Yahweh preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Identidade do parentesco expresso por אָחִיו
  choice: parente dele no texto, com nota sobre irmão e tio
  alternative: irmão dele
  rationale: Evita produzir em português moderno uma afirmação genealógica aparentemente específica e inexata, ao mesmo tempo que a nota conserva a formulação literal e esclarece a relação histórica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A sintaxe mantém a sequência narrativa hebraica, mas evita a impressão de que Nabucodonosor necessariamente foi em pessoa buscar Joaquim. Os marcadores seguem a ordem em que aparecem no texto.
