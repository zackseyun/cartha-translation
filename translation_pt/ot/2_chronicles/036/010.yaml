revisions:
- from: Na virada do ano[a], o rei Nabucodonosor mandou buscá-lo e o levou para a Babilônia, junto com os utensílios preciosos da casa de Yahweh[b], e constituiu Zedequias, parente dele[c], rei sobre Judá e Jerusalém.
  to: Na virada do ano[a], o rei Nabucodonosor mandou buscá-lo e levá-lo para a Babilônia, junto com os utensílios preciosos da casa de Yahweh[b], e constituiu Zedequias, seu irmão[c], rei sobre Judá e Jerusalém.
  rationale: A revisão restaura «seu irmão» como tradução do hebraico e deixa a precisão genealógica para a nota. Também elimina uma especificação sazonal não exigida pelo texto e ajusta a ação de Nabucodonosor a uma forma causativa idiomática, coerente com «enviou e trouxe».
