  text: וַ/יִּֽהְי֤וּ מַלְעִבִים֙ בְּ/מַלְאֲכֵ֣י הָ/אֱלֹהִ֔ים וּ/בוֹזִ֣ים דְּבָרָ֔י/ו וּ/מִֽתַּעְתְּעִ֖ים בִּ/נְבִאָ֑י/ו עַ֠ד עֲל֧וֹת חֲמַת יְהוָ֛ה בְּ/עַמּ֖/וֹ עַד לְ/אֵ֥ין מַרְפֵּֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/016.yaml
  text: But they kept mocking the messengers of God[a], despising his words, and scoffing at his prophets, until the wrath of Yahweh rose against his people[b], until there was no remedy.
translation:
  language: pt
  text: Mas eles continuaram zombando dos mensageiros de Deus[a], desprezando suas palavras e ridicularizando seus profetas, até que a ira de Yahweh se levantou contra seu povo, até que não houve mais remédio[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos anjos de Deus”. Aqui, o contexto favorece fortemente “mensageiros”, isto é, enviados humanos de Deus, pois a oração seguinte fala de “seus profetas”.
    reason: lexical_alternative
  - marker: b
    text: Ou “até que não houve cura” ou “até que a situação se tornou incurável”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: continuaram
  rationale: Com os particípios seguintes, expressa ação contínua ou habitual no passado; “continuaram” comunica essa duração de modo natural.
- source_word: מַלְעִבִים
  choice: zombando
  rationale: O particípio descreve tratamento marcado por escárnio e desprezo; “zombando” é claro e corrente.
- source_word: בְּמַלְאֲכֵי הָאֱלֹהִים
  choice: dos mensageiros de Deus
  rationale: מַלְאָךְ pode indicar mensageiro ou anjo, mas o paralelismo com “seus profetas” favorece enviados humanos de Deus.
- source_word: וּבוֹזִים דְּבָרָיו
  choice: desprezando suas palavras
  rationale: בזה comunica rejeição com desprezo, e o plural דְּבָרָיו é preservado diretamente como “suas palavras”.
- source_word: וּמִתַּעְתְּעִים
  choice: ridicularizando
  rationale: O verbo denota escárnio ou zombaria; “ridicularizando” evita repetição lexical sem perder a progressão retórica.
- source_word: בִּנְבִיאָיו
  choice: seus profetas
  rationale: Tradução direta do substantivo com sufixo masculino singular, cujo referente contextual é Deus.
- source_word: עַד עֲלוֹת חֲמַת יְהוָה
  choice: até que a ira de Yahweh se levantou
  rationale: A construção marca o ponto culminante em que a ira divina se ergue; a formulação conserva a imagem do hebraico com naturalidade aceitável em português.
- source_word: בְּעַמּוֹ
  choice: contra seu povo
  rationale: No contexto da ira e do juízo, בְּ indica o objeto contra o qual ela se dirige.
- source_word: עַד לְאֵין מַרְפֵּא
  choice: até não haver mais remédio
  rationale: מַרְפֵּא pode significar cura ou remédio; aqui “não haver mais remédio” comunica a irreversibilidade do juízo sem eliminar a metáfora terapêutica.
theological_decisions:
- issue: Referente de “mensageiros de Deus”
  choice: enviados humanos de caráter profético
  alternative: anjos de Deus
  rationale: Embora מַלְאָךְ também possa designar um ser celestial, o contexto imediato e o paralelismo com “seus profetas” apontam fortemente para enviados humanos.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto traz o Tetragrama; “Yahweh” preserva o nome próprio e segue a orientação do projeto sem substituí-lo por um título.
- issue: Sentido da ausência de מַרְפֵּא
  choice: não haver mais remédio
  alternative: não haver cura; ser incurável
  rationale: A expressão indica que o juízo chegou a um ponto sem possibilidade de reparação, preservando ao mesmo tempo a imagem de cura.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A repetição de “até” foi mantida para refletir a estrutura enfática do hebraico; “Yahweh” translitera o nome divino.
