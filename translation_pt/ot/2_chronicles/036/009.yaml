  text: בֶּן שְׁמוֹנֶ֤ה שָׁנִים֙ יְהוֹיָכִ֣ין בְּ/מָלְכ֔/וֹ וּ/שְׁלֹשָׁ֤ה חֳדָשִׁים֙ וַ/עֲשֶׂ֣רֶת יָמִ֔ים מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/009.yaml
  text: Jehoiachin was eight years old when he began to reign[a], and he reigned three months and ten days in Jerusalem. He did what was evil in the sight of Yahweh.
translation:
  language: pt
  text: Joaquim tinha oito anos quando começou a reinar[a] e reinou três meses e dez dias em Jerusalém. Ele fez o que era mau aos olhos de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em 2 Reis 24:8, lê-se «dezoito anos» em vez de «oito anos».
    reason: textual_variant
lexical_decisions:
- source_word: בֶּן שְׁמוֹנֶה שָׁנִים
  choice: tinha oito anos
  rationale: Expressa naturalmente em português o idiomatismo hebraico de idade, literalmente «filho de oito anos», sem alterar a leitura do texto massorético.
- source_word: יְהוֹיָכִין
  choice: Joaquim
  rationale: Emprega a forma tradicional portuguesa do nome do rei conhecido em inglês como Jehoiachin, distinguido pelo contexto régio.
- source_word: בְּמָלְכוֹ
  choice: quando começou a reinar
  rationale: A construção com בְּ marca a ocasião de sua ascensão ao trono; esta formulação é clara e natural em português.
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים וַעֲשֶׂרֶת יָמִים
  choice: três meses e dez dias
  rationale: Tradução direta e idiomática da duração do reinado.
- source_word: מָלַךְ
  choice: reinou
  rationale: Equivalente corrente de מלך em fórmulas régias.
- source_word: בִּירוּשָׁלָם
  choice: em Jerusalém
  rationale: Tradução direta da expressão locativa.
- source_word: וַיַּעַשׂ הָרַע
  choice: Ele fez o que era mau
  rationale: Conserva a força da fórmula hebraica de avaliação moral em linguagem portuguesa clara e digna.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Preserva a metáfora hebraica de avaliação divina, que também é natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
theological_decisions:
- issue: Tensão cronológica com 2 Reis 24:8, onde a idade na ascensão é de dezoito anos
  choice: Manter «oito anos» no texto principal
  alternative: dezoito anos
  rationale: O texto hebraico fornecido de 2 Crônicas 36:9 traz «oito anos». A tradução segue essa evidência sem harmonizá-la silenciosamente com a passagem paralela e registra a variante em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem das palavras acompanha naturalmente a fórmula régia hebraica; o nome divino é apresentado como Yahweh.
