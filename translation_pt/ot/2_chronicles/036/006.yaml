review_pass:
  verdict: revise
  source_fidelity: A expressão «avançou contra ele» traduz adequadamente o idiomático עָלָה עַל em contexto militar. «Para levá-lo à Babilônia» preserva a finalidade e o destino. Contudo, «o prendeu» pode ser entendido predominantemente como detenção ou encarceramento, enquanto וַיַּאַסְרֵהוּ descreve explicitamente o ato físico de amarrá-lo; a formulação deve tornar esse aspecto visível.
  naturalness: O texto é claro, moderno e de registro adequado. «Amarrou-o com correntes de bronze» é igualmente natural em português e comunica com maior precisão a ação descrita.
  terminology: «Nabucodonosor» e «Babilônia» seguem o uso bíblico português estabelecido. «Bronze» é preferível a «bronze/brass» no sentido tradicional de «latão». A nota deve evitar «restrições», que soa pouco idiomático neste contexto, e explicar que o termo hebraico designa objetos de contenção sem determinar seu formato exato.
  issues:
  - severity: medium
    issue: «O prendeu» é menos específico que o verbo hebraico.
    rationale: אָסַר significa amarrar ou ligar; em conjunto com «com correntes de bronze», o texto retrata a imposição física de amarras, não somente a captura ou prisão.
  - severity: low
    issue: «Restrições de bronze colocadas nele» é pouco natural em português.
    rationale: «Amarras de bronze» ou «instrumentos de contenção de bronze» comunica melhor o sentido lexical e preserva a incerteza sobre o tipo exato de objeto.
  revised_text: Nabucodonosor, rei da Babilônia, avançou contra ele e amarrou-o com correntes de bronze, para levá-lo à Babilônia.[a]
