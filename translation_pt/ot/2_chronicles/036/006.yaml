  text: Nebuchadnezzar king of Babylon came up against him and bound him with bronze chains to take him to Babylon[a].
translation:
  language: pt
  text: Nabucodonosor, rei da Babilônia, avançou contra ele e amarrou-o com correntes de bronze, para levá-lo à Babilônia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «com grilhões de bronze» ou «com algemas de bronze». O hebraico se refere a amarras de bronze colocadas nele.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָיו עָלָה
  choice: avançou contra ele
  rationale: A expressão militar עָלָה עַל indica avançar contra um adversário. A tradução conserva a ideia de movimento hostil sem afirmar mais especificamente que houve um ataque.
- source_word: נְבוּכַדְנֶאצַּר
  choice: Nabucodonosor
  rationale: Forma portuguesa tradicional, reconhecível e amplamente usada para o nome do rei babilônico.
- source_word: מֶלֶךְ בָּבֶל
  choice: rei da Babilônia
  rationale: Reproduz naturalmente em português o título real em aposição ao nome próprio.
- source_word: וַיַּאַסְרֵהוּ
  choice: o prendeu
  rationale: אָסַר significa amarrar ou prender. Neste contexto de captura com restrições de bronze, «o prendeu» é claro e natural, sem sugerir necessariamente encarceramento.
- source_word: בַּנְחֻשְׁתַּיִם
  choice: com correntes de bronze
  rationale: A forma hebraica se refere a restrições de bronze, possivelmente grilhões ou algemas. «Correntes de bronze» é compreensível no português atual, enquanto a nota preserva alternativas mais específicas.
- source_word: לְהֹלִיכוֹ
  choice: para levá-lo
  rationale: O hifil de הלך expressa fazer alguém ir; no contexto, trata-se de conduzir um cativo a outro lugar. «Para levá-lo» é idiomático e direto.
- source_word: בָּבֶלָה
  choice: à Babilônia
  rationale: O hê direcional indica movimento em direção à Babilônia; a construção portuguesa com «a» expressa naturalmente o destino.
