  - severity: medium
    issue: «Os que restaram da espada» é pouco natural e semanticamente opaco
    rationale: A expressão hebraica identifica o restante/sobreviventes em relação à espada. Em português, «o restante dos que escaparam da espada» comunica esse sentido sem introduzir uma interpretação além do necessário.
  - severity: low
    issue: Formulação temporal pouco idiomática
    rationale: «O reino da Pérsia chegar ao poder» é compreensível, mas «até que o reino da Pérsia assumiu o domínio» expressa mais naturalmente a mudança de domínio indicada pelo infinitivo de מלך.
