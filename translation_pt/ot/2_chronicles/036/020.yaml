base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/020.yaml
  text: He carried into exile to Babylon the remnant who had escaped the sword[a], and they became slaves to him and to his sons until the reign of the kingdom of Persia.
translation:
  language: pt
  text: Ele levou para o exílio, para a Babilônia, o restante dos que escaparam da espada, e eles se tornaram escravos[a] dele e de seus filhos, até que o reino da Pérsia assumiu o domínio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «servos». O termo hebraico pode designar servos ou escravos; neste contexto de conquista e exílio, «escravos» ressalta a sujeição imposta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּגֶל
  choice: levou para o exílio
  rationale: O hifil de גלה expressa deportação forçada. A formulação é natural em português e conserva explicitamente a ideia de exílio.
- source_word: הַשְּׁאֵרִית מִן הַחֶרֶב
  choice: os que restaram da espada
  rationale: Preserva a imagem hebraica da espada e o sentido de um grupo sobrevivente, sem especificar além do texto se escaparam ou foram poupados.
- source_word: אֶל־בָּבֶל
  choice: na Babilônia
  rationale: Com o verbo português «levar para o exílio», «na Babilônia» indica de modo idiomático o destino e lugar do exílio.
- source_word: וַיִּהְיוּ לוֹ וּלְבָנָיו לַעֲבָדִים
  choice: eles se tornaram escravos dele e de seus filhos
  rationale: עֲבָדִים pode significar servos ou escravos; no contexto coercivo de conquista, deportação e sujeição imperial, «escravos» comunica melhor a condição imposta.
- source_word: עַד מְלֹךְ מַלְכוּת פָּרָס
  choice: até o reino da Pérsia chegar ao poder
  rationale: Expressa naturalmente o limite temporal marcado por עַד e o início do governo persa indicado pelo infinitivo מְלֹךְ, evitando em português a formulação redundante «o reino reinar».
theological_decisions:
- issue: Condição servil dos deportados após a conquista
  choice: escravos
  alternative: servos
  rationale: O termo hebraico admite ambos os sentidos, mas a deportação de sobreviventes de guerra e sua sujeição ao rei babilônico e à dinastia dele favorecem «escravos». A alternativa lexical é registrada em nota, sem eliminar a amplitude do termo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi ajustada ao uso natural do português, e a imagem «da espada» foi mantida para conservar a expressão do hebraico.
