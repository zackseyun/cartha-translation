  text: וְ֠/כֹל כְּלֵ֞י בֵּ֤ית הָ/אֱלֹהִים֙ הַ/גְּדֹלִ֣ים וְ/הַ/קְּטַנִּ֔ים וְ/אֹֽצְרוֹת֙ בֵּ֣ית יְהוָ֔ה וְ/אֹצְר֥וֹת הַ/מֶּ֖לֶךְ וְ/שָׂרָ֑י/ו הַ/כֹּ֖ל הֵבִ֥יא בָבֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/018.yaml
  text: And all the vessels of the house of God[a], great and small, and the treasures of the house of Yahweh[b], and the treasures of the king and of his officials—all this he brought to Babylon.
translation:
  language: pt
  text: Todos os utensílios da casa de Deus, grandes e pequenos, os tesouros[a] da casa de Yahweh e os tesouros do rei e de seus oficiais[b] — tudo isso ele levou para a Babilônia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tesourarias” ou “depósitos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “príncipes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל כְּלֵי
  choice: todos os utensílios
  rationale: כְּלֵי designa aqui os objetos ou instrumentos usados no templo; “utensílios” é amplo, claro e adequado ao contexto de saque.
- source_word: בֵּית הָאֱלֹהִים
  choice: a casa de Deus
  rationale: Preserva a expressão hebraica sem substituir explicitamente “casa” por “templo”.
- source_word: הַגְּדֹלִים וְהַקְּטַנִּים
  choice: grandes e pequenos
  rationale: Mantém o par abrangente do hebraico, que pode se referir ao tamanho ou à importância dos utensílios.
- source_word: אֹצְרוֹת
  choice: tesouros
  rationale: Embora o termo também possa indicar tesourarias ou depósitos, o contexto de bens levados à Babilônia favorece os objetos de valor neles guardados.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Mantém a expressão “casa de” e representa diretamente o nome divino יהוה.
- source_word: שָׂרָיו
  choice: seus oficiais
  rationale: שָׂרִים é um termo amplo para autoridades, dirigentes ou altos funcionários; “oficiais” evita restringi-lo a príncipes de sangue real.
- source_word: הַכֹּל הֵבִיא בָבֶל
  choice: levou tudo para a Babilônia
  rationale: O singular הֵבִיא retoma o agente do contexto, e הַכֹּל resume enfaticamente todos os itens enumerados. A ordem foi ajustada no texto para produzir português natural, preservando a retomada final “levou tudo”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o tetragrama; “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Sujeito não expresso de הֵבִיא
  choice: 'verbo sem pronome explícito: “levou”'
  alternative: “ele levou” ou nomear Nabucodonosor
  rationale: O hebraico marca um sujeito masculino singular, recuperável do contexto, mas não o nomeia neste versículo. O português permite omiti-lo, evitando acrescentar uma identificação ao texto.
translation_notes:
  register: Português atual, digno e de leitura ampla, com sintaxe natural para leitores brasileiros. “Casa de Deus” e “casa de Yahweh” preservam a imagem hebraica; o travessão realça a recapitulação enfática de הַכֹּל sem alterar o conteúdo.
