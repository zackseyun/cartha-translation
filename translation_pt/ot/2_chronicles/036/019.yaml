base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/019.yaml
  text: They burned the house of God[a], tore down the wall of Jerusalem, burned all its palaces with fire[b], and destroyed all its precious vessels.
translation:
  language: pt
  text: Eles incendiaram a casa de Deus[a], derrubaram a muralha de Jerusalém, atearam fogo a todos os seus palácios e destruíram todos os seus objetos preciosos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o templo de Deus». O hebraico diz literalmente «a casa de Deus».
    reason: lexical_alternative
  - marker: b
    text: Ou «todos os seus objetos estimados» ou «todos os seus artigos desejáveis».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂרְפוּ
  choice: incendiaram
  rationale: O qal wayyiqtol de שׂרף indica que puseram fogo ao edifício. «Incendiaram» é natural e evita a possível leitura de que apenas chamuscaram a casa.
- source_word: בֵּית הָאֱלֹהִים
  choice: a casa de Deus
  rationale: Mantém a expressão hebraica literal e digna; no contexto, refere-se ao templo, alternativa indicada em nota.
- source_word: וַיְנַתְּצוּ
  choice: derrubaram
  rationale: נתץ descreve a demolição de uma estrutura. «Derrubaram» é corrente e apropriado para uma muralha.
- source_word: חוֹמַת יְרוּשָׁלִָם
  choice: a muralha de Jerusalém
  rationale: O singular hebraico designa a estrutura defensiva da cidade. «Muralha» comunica melhor esse sentido do que o termo mais genérico «muro».
- source_word: אַרְמְנוֹתֶיהָ
  choice: todos os seus palácios
  rationale: אַרְמוֹן pode designar palácio, cidadela ou edifício fortificado. «Palácios» é o sentido usual e adequado aos grandes edifícios de Jerusalém, sem eliminar por nota uma ambiguidade contextual pouco relevante.
- source_word: שָׂרְפוּ בָאֵשׁ
  choice: queimaram no fogo
  rationale: Conserva a menção explícita ao fogo e a repetição enfática do hebraico, embora ela seja redundante em português.
- source_word: כְּלֵי מַחֲמַדֶּיהָ
  choice: todos os seus objetos preciosos
  rationale: כְּלִי é amplo — objeto, utensílio, recipiente — e מַחֲמַד qualifica aquilo que é precioso ou desejável. «Objetos preciosos» preserva essa amplitude melhor do que «vasos», sem restringir o referente ao mobiliário cultual.
- source_word: לְהַשְׁחִית
  choice: destruíram
  rationale: O infinitivo hebraico exprime propósito ou resultado em relação à ação precedente. A forma verbal coordenada produz português natural e preserva o resultado da devastação.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém «casa de Deus» e a repetição explícita do fogo, mas usa «objetos preciosos» para não estreitar indevidamente o sentido amplo de כְּלֵי מַחֲמַדֶּיהָ.
