- from: 'Assim diz Ciro, rei da Pérsia: “Yahweh, o Deus dos céus, deu-me todos os reinos da terra e me encarregou de construir para ele uma casa em Jerusalém, que fica em Judá. Quem dentre vocês fizer parte de todo o seu povo[a], que Yahweh, seu Deus, esteja com ele[b], e que suba[c]”.'
  to: 'Assim diz Ciro, rei da Pérsia: “Yahweh, o Deus dos céus, deu-me todos os reinos da terra e me encarregou de construir para ele uma casa em Jerusalém, que fica em Judá. Quem dentre vocês fizer parte do seu povo[a], que Yahweh, seu Deus, esteja com ele[b], e que suba[c].”'
