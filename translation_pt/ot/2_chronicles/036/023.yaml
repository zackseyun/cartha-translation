  text: כֹּה אָמַ֞ר כּ֣וֹרֶשׁ מֶ֣לֶךְ פָּרַ֗ס כָּל מַמְלְכ֤וֹת הָ/אָ֨רֶץ֙ נָ֣תַן לִ֗/י יְהוָה֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם וְ/הֽוּא פָקַ֤ד עָלַ/י֙ לִ/בְנֽוֹת ל֣/וֹ בַ֔יִת בִּ/ירוּשָׁלִַ֖ם אֲשֶׁ֣ר בִּֽ/יהוּדָ֑ה מִֽי בָ/כֶ֣ם מִ/כָּל עַמּ֗/וֹ יְהוָ֧ה אֱלֹהָ֛י/ו עִמּ֖/וֹ וְ/יָֽעַל־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/023.yaml
  text: 'Thus says Cyrus king of Persia: Yahweh[a], the God of heaven, has given me all the kingdoms of the earth, and he has charged me to build for him a house in Jerusalem, which is in Judah. Whoever is among you of all his people, may Yahweh his God be with him[d][c][b], and let him go up.'
translation:
  language: pt
  text: 'Assim diz Ciro, rei da Pérsia: “Yahweh, o Deus dos céus, deu-me todos os reinos da terra e me encarregou de construir para ele uma casa em Jerusalém, que fica em Judá. Quem dentre vocês fizer parte do seu povo[a], que Yahweh, seu Deus, esteja com ele[b], e que suba[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão hebraica é condensada; literalmente, «Quem dentre vocês, de todo o seu povo?». «Todo» tem aqui sentido distributivo: o convite é dirigido a qualquer pessoa que pertença ao povo de Yahweh. Também pode ser vertida: «Qualquer um dentre vocês que pertença ao seu povo».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «Yahweh, seu Deus, está com ele». A frase hebraica não contém verbo expresso e pode ser entendida como afirmação, embora o contexto favoreça o sentido de bênção ou desejo.'
    reason: alternative_reading
  - marker: c
    text: Isto é, que suba a Jerusalém. Na linguagem bíblica, «subir» é a maneira convencional de descrever a ida à cidade santa.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Mantém a fórmula solene de proclamação e soa natural em português.
- source_word: כּוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: Ciro, rei da Pérsia
  rationale: Usa a forma tradicional portuguesa do nome e conserva o título real em aposição.
- source_word: כָּל מַמְלְכוֹת הָאָרֶץ
  choice: todos os reinos da terra
  rationale: Preserva o alcance geopolítico amplo de אֶרֶץ sem interpretar excessivamente como 'mundo'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Representa diretamente o nome divino no texto hebraico.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: o Deus dos céus
  rationale: Expressão portuguesa corrente que também preserva o plural formal de שָׁמַיִם.
- source_word: נָתַן לִי
  choice: deu-me
  rationale: O pretérito perfeito comunica de modo claro a ação concluída cujos efeitos Ciro reivindica no presente.
- source_word: וְהוּא פָקַד עָלַי
  choice: e me encarregou
  rationale: Expressa a atribuição autorizada de uma tarefa sem impor a nuance mais forte de uma ordem explícita.
- source_word: לִבְנוֹת לוֹ בַיִת
  choice: de construir para ele uma casa
  rationale: Conserva בַיִת como 'casa', em vez de explicitar interpretativamente 'templo'.
- source_word: בִּירוּשָׁלִַם אֲשֶׁר בִּיהוּדָה
  choice: em Jerusalém, que fica em Judá
  rationale: Mantém a oração relativa do hebraico em português natural.
- source_word: מִי בָכֶם מִכָּל עַמּוֹ
  choice: Quem dentre vocês fizer parte de todo o seu povo
  rationale: Representa a expressão hebraica comprimida como uma referência partitiva aos membros do povo de Yahweh, preservando כָּל.
- source_word: יְהוָה אֱלֹהָיו עִמּוֹ
  choice: que Yahweh, seu Deus, esteja com ele
  rationale: Lê a frase nominal, no contexto da proclamação, como bênção ou desejo, sem ocultar em nota a possibilidade indicativa.
- source_word: וְיָעַל
  choice: e que suba
  rationale: Conserva tanto a força volitiva quanto o modo bíblico convencional de falar da ida a Jerusalém como subida.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz o nome próprio divino; 'Yahweh' o representa diretamente sem substituí-lo por um título.
- issue: Sentido de בַיִת no encargo de Ciro
  choice: casa
  alternative: templo
  rationale: Embora o referente seja o templo, 'casa' preserva a palavra e a imagem teológica do original.
- issue: Força de יְהוָה אֱלֹהָיו עִמּוֹ
  choice: 'bênção ou desejo: ''que Yahweh, seu Deus, esteja com ele'''
  alternative: 'afirmação indicativa: ''Yahweh, seu Deus, está com ele'''
  rationale: A fórmula final da proclamação favorece a leitura benedictória, mas a ausência de verbo expresso em hebraico permite formalmente a leitura indicativa, registrada em nota.
translation_notes:
  register: Português moderno, solene e acessível, com ampla legibilidade brasileira. Empregam-se “vocês” e construções naturais sem diluir a fórmula real, a imagem da casa de Deus, a ambiguidade da frase de bênção nem o idioma tradicional de subir a Jerusalém.
