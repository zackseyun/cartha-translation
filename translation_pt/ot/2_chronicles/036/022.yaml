  text: וּ/בִ/שְׁנַ֣ת אַחַ֗ת לְ/כ֨וֹרֶשׁ֙ מֶ֣לֶךְ פָּרַ֔ס לִ/כְל֥וֹת דְּבַר יְהוָ֖ה בְּ/פִ֣י יִרְמְיָ֑הוּ הֵעִ֣יר יְהוָ֗ה אֶת ר֨וּחַ֙ כּ֣וֹרֶשׁ מֶֽלֶךְ פָּרַ֔ס וַ/יַּֽעֲבֶר קוֹל֙ בְּ/כָל מַלְכוּת֔/וֹ וְ/גַם בְּ/מִכְתָּ֖ב לֵ/אמֹֽר־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/022.yaml
  text: 'In the first year of Cyrus king of Persia[a], so that the word of Yahweh by the mouth of Jeremiah might be fulfilled, Yahweh stirred up the spirit of Cyrus king of Persia, and he made a proclamation throughout all his kingdom, and also in writing, saying:'
translation:
  language: pt
  text: 'No primeiro ano de Ciro, rei da Pérsia, para que se cumprisse a palavra de Yahweh anunciada por Jeremias[a], Yahweh despertou o espírito de Ciro, rei da Pérsia. Então ele mandou proclamar por todo o seu reino, e também por escrito, o seguinte:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “pela boca de Jeremias”; também pode ser traduzido como “por meio de Jeremias”.
    reason: Registra o idioma hebraico e sua alternativa natural sem sobrecarregar o texto principal.
lexical_decisions:
- source_word: וּבִשְׁנַת אַחַת
  choice: No primeiro ano
  rationale: Expressa de modo natural a fórmula hebraica de datação; o waw inicial funciona como ligação narrativa e não exige uma palavra independente em português.
- source_word: לְכוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: de Ciro, rei da Pérsia
  rationale: Mantém o nome do soberano e seu título em aposição clara.
- source_word: לִכְלוֹת דְּבַר יְהוָה
  choice: para que se cumprisse a palavra de Yahweh
  rationale: O infinitivo indica finalidade ou resultado, e, no contexto profético, 'cumprir-se' comunica adequadamente a realização da palavra divina.
- source_word: בְּפִי יִרְמְיָהוּ
  choice: anunciada por Jeremias
  rationale: Torna natural em português o idioma literalmente 'pela boca de Jeremias', preservando Jeremias como mediador da palavra profética; a forma literal fica registrada em nota.
- source_word: הֵעִיר יְהוָה אֶת רוּחַ כּוֹרֶשׁ
  choice: Yahweh despertou o espírito de Ciro
  rationale: '''Despertou'' preserva a imagem de suscitar ou mover, enquanto ''espírito'' mantém a amplitude de רוּחַ como disposição interior ou impulso.'
- source_word: וַיַּעֲבֶר קוֹל
  choice: Então ele mandou proclamar
  rationale: Traduz idiomaticamente a expressão hebraica de fazer circular uma voz ou proclamação pública, deixando claro que Ciro fez o anúncio ser divulgado.
- source_word: בְּכָל מַלְכוּתוֹ
  choice: por todo o seu reino
  rationale: Comunica a extensão distributiva do anúncio em todo o domínio real.
- source_word: וְגַם בְּמִכְתָּב
  choice: e também por escrito
  rationale: Preserva o contraste entre a proclamação pública e sua forma documental escrita.
- source_word: לֵאמֹר
  choice: 'o seguinte:'
  rationale: Introduz naturalmente em português o discurso direto que começa no versículo seguinte.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- issue: Agência divina sobre o espírito de Ciro
  choice: despertou o espírito de Ciro
  alternative: moveu o coração de Ciro
  rationale: Mantém o termo 'espírito' e a imagem verbal do hebraico sem reduzir a ação divina a uma categoria meramente psicológica.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e compreensão internacional. A divisão em duas frases reduz a sobrecarga sintática sem alterar a sequência lógica do hebraico.
