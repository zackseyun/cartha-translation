base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/005.yaml
  text: Jehoiakim was twenty-five years old when he became king, and he reigned eleven years in Jerusalem. He did what was evil in the eyes of Yahweh his God.
translation:
  language: pt
  text: Joaquim tinha vinte e cinco anos quando começou a reinar e reinou onze anos em Jerusalém. Fez o que era mau aos olhos de Yahweh, seu Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: tinha vinte e cinco anos
  rationale: Expressa naturalmente em português o idiomatismo hebraico usado para indicar idade.
- source_word: יְהוֹיָקִים
  choice: Joaquim
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome do rei.
- source_word: בְּמָלְכוֹ
  choice: quando começou a reinar
  rationale: A construção com בְּ indica a ocasião em que Joaquim assumiu o reinado; esta formulação é natural e precisa em português.
- source_word: וְאַחַת עֶשְׂרֵה שָׁנָה מָלַךְ
  choice: e reinou onze anos
  rationale: Traduz diretamente מָלַךְ no contexto da fórmula régia.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: Reproduz de modo direto a expressão locativa.
- source_word: וַיַּעַשׂ הָרַע
  choice: Fez o que era mau
  rationale: Preserva o caráter verbal e avaliativo da expressão hebraica em linguagem portuguesa corrente.
- source_word: בְּעֵינֵי
  choice: aos olhos de
  rationale: Mantém o idiomatismo hebraico, que também é claro e natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהָיו
  choice: seu Deus
  rationale: Preserva o sufixo possessivo masculino singular, cujo referente é Joaquim.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o Tetragrama; a transliteração preserva o nome pessoal e evita substituí-lo por um título.
