  yaml_path: translation/ot/2_chronicles/036/001.yaml
  text: Then the people of the land took Jehoahaz son of Josiah and made him king in Jerusalem in place of his father[a].
translation:
  language: pt
  text: Então, o povo da terra tomou Jeoacaz, filho de Josias, e o constituiu rei em Jerusalém, no lugar de seu pai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a população da terra”. A expressão hebraica “o povo da terra” pode designar a população do país e, em alguns contextos, um grupo social específico dentro dela.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: escolheu
  rationale: Neste contexto de entronização, לקח indica que o povo tomou Jeoacaz para fazê-lo rei. “Escolheu” comunica naturalmente essa seleção sem sugerir coerção, embora explicite levemente a função contextual do verbo.
- source_word: עַם הָאָרֶץ
  choice: o povo da terra
  rationale: 'A tradução formal preserva a expressão hebraica e sua possível amplitude: ela pode designar a população da terra ou, conforme o contexto, um grupo social específico.'
- source_word: יְהוֹאָחָז
  choice: Jeoacaz
  rationale: Forma tradicional e amplamente reconhecível do nome hebraico em português.
- source_word: בֶּן יֹאשִׁיָּהוּ
  choice: filho de Josias
  rationale: Tradução genealógica direta, clara e idiomática em português.
- source_word: וַיַּמְלִיכֻהוּ
  choice: o constituiu rei
  rationale: 'O hifil de מלך tem sentido causativo: fazer alguém rei. “Constituiu rei” é digno e claro, sem acrescentar a cerimônia de coroação.'
- source_word: תַחַת אָבִיו
  choice: no lugar de seu pai
  rationale: תחת indica aqui substituição e sucessão, não posição espacial.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: A preposição ב com o topônimo é traduzida naturalmente como “em Jerusalém”.
