source:
  edition: WLC
  text: גַּ֠ם כָּל שָׂרֵ֨י הַ/כֹּהֲנִ֤ים וְ/הָ/עָם֙ הִרְבּ֣וּ לִ/מְעָול מַ֔עַל כְּ/כֹ֖ל תֹּעֲב֣וֹת הַ/גּוֹיִ֑ם וַֽ/יְטַמְּאוּ֙ אֶת בֵּ֣ית יְהוָ֔ה אֲשֶׁ֥ר הִקְדִּ֖ישׁ בִּ/ירוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/014.yaml
  text: Also all the leaders of the priests and the people increased in unfaithfulness[a], according to all the abominations of the nations, and they defiled the house of Yahweh[b], which he had consecrated in Jerusalem.
translation:
  language: pt
  text: Também todos os líderes dos sacerdotes e do povo multiplicaram sua infidelidade[a], de acordo com todas as práticas detestáveis das nações, e profanaram a casa de Yahweh[b], que ele havia consagrado em Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «aumentaram cada vez mais sua infidelidade» ou «foram profundamente infiéis».'
    reason: A combinação do verbo «multiplicar/aumentar» com o infinitivo e o substantivo cognato intensifica a infidelidade; há mais de uma forma natural de reproduzi-la em português.
  - marker: b
    text: Yahweh representa o nome divino YHWH.
    reason: Esclarece a transliteração do Tetragrama.
lexical_decisions:
- source_word: גַּם
  choice: Também
  rationale: Mantém a ligação aditiva e a continuidade com o contexto anterior de modo natural em português.
- source_word: כָּל שָׂרֵי הַכֹּהֲנִים וְהָעָם
  choice: todos os líderes dos sacerdotes e o povo
  rationale: Preserva שָׂרֵי como líderes dos sacerdotes, sem convertê-lo no termo técnico posterior «chefes dos sacerdotes».
- source_word: הִרְבּוּ לִמְעָול מַעַל
  choice: multiplicaram sua infidelidade
  rationale: Reproduz a ideia de aumento expressa pelo Hifil de רבה e a força intensificadora da construção cognata ligada a מעל, mantendo o sentido de deslealdade para com Deus.
- source_word: כְּכֹל תֹּעֲבוֹת הַגּוֹיִם
  choice: seguindo todas as práticas detestáveis das nações
  rationale: Expressa com clareza a conformidade ou imitação indicada por כְּכֹל e torna explícito que תֹּעֲבוֹת se refere aqui a práticas moral e religiosamente repugnantes.
- source_word: וַיְטַמְּאוּ
  choice: profanaram
  rationale: No contexto do templo, comunica de modo natural a contaminação ritual e moral de algo consagrado, embora «tornaram impura» também seja possível.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Conserva a expressão hebraica «casa» e apresenta o nome divino como nome próprio.
- source_word: אֲשֶׁר הִקְדִּישׁ בִּירוּשָׁלִָם
  choice: que ele havia consagrado em Jerusalém
  rationale: A oração relativa se refere naturalmente à casa; «consagrado» transmite sua separação para uso santo.
theological_decisions:
- issue: Sentido da violação expressa por מָעַל
  choice: infidelidade
  alternative: traição; transgressão
  rationale: «Infidelidade» abrange a quebra de lealdade a Deus e sua dimensão cultual sem restringir o termo a uma infração meramente jurídica.
- issue: Relação expressa por כְּכֹל diante das práticas das nações
  choice: seguindo
  alternative: como; de acordo com
  rationale: O hebraico admite comparação ou conformidade. «Seguindo» comunica que a conduta deles se ajustou às práticas das nações, sem definir além do texto a natureza exata dessa relação.
- issue: Representação de יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Translitera o nome divino presente no texto hebraico em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Multiplicaram sua infidelidade» mantém deliberadamente algo da força e da estrutura intensificadora do hebraico; «práticas detestáveis» evita que «abominações» soe excessivamente abstrato.
