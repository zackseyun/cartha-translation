  text: Jehoahaz was twenty-three years old when he became king[a], and he reigned three months in Jerusalem.
translation:
  language: pt
  text: Jeoacaz tinha vinte e três anos quando se tornou rei[a] e reinou três meses em Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “filho de vinte e três anos” — expressão idiomática hebraica comum para indicar a idade.
