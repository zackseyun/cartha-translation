lexical_decisions:
- source_word: בֶּן שָׁלֹושׁ וְעֶשְׂרִים שָׁנָה
  choice: tinha vinte e três anos
  rationale: A expressão hebraica literalmente diz “filho de vinte e três anos”, construção idiomática regular para indicar idade. Em português atual, “tinha vinte e três anos” comunica o sentido com naturalidade e precisão.
- source_word: יוֹאָחָז
  choice: Joacaz
  rationale: Segue a forma tradicional e amplamente reconhecida do nome em português bíblico.
- source_word: בְּמָלְכוֹ
  choice: quando se tornou rei
  rationale: A construção indica a ocasião em que começou a reinar. Esta formulação é clara e natural em português moderno.
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים
  choice: e ... três meses
  rationale: Preserva a conjunção hebraica e a duração expressa pelo numeral com o substantivo.
- source_word: מָלַךְ
  choice: reinou
  rationale: No contexto das fórmulas régias, “reinou” é o equivalente português direto e convencional.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: A preposição hebraica indica lugar; “em Jerusalém” é a tradução direta e idiomática.
