source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ הָ/רַ֔ע בְּ/עֵינֵ֖י יְהוָ֣ה אֱלֹהָ֑י/ו לֹ֣א נִכְנַ֗ע מִ/לִּ/פְנֵ֛י יִרְמְיָ֥הוּ הַ/נָּבִ֖יא מִ/פִּ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/012.yaml
  text: He did what was evil in the eyes of Yahweh his God[a], and he did not humble himself before Jeremiah the prophet, who spoke from the mouth of Yahweh.
translation:
  language: pt
  text: Fez o que era mau aos olhos de Yahweh, seu Deus, e não se humilhou diante do profeta Jeremias, que falava da parte de Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “da boca de Yahweh”.'
    reason: A nota registra a imagem concreta da expressão hebraica מִפִּי יְהוָה, traduzida no texto por uma formulação portuguesa mais idiomática.
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Fez o que era mau
  rationale: A construção narrativa introduz a ação seguinte, e a expressão idiomática hebraica significa fazer o que é moralmente mau. Em português, não é necessário reproduzir o ו inicial com “e”.
- source_word: בְּעֵינֵי
  choice: aos olhos de
  rationale: Preserva de modo claro e natural o idioma hebraico que expressa avaliação segundo a perspectiva de alguém.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אֱלֹהָיו
  choice: seu Deus
  rationale: Mantém o sufixo possessivo, importante para a responsabilidade de Zedequias perante o Deus a quem estava ligado.
- source_word: לֹא נִכְנַע
  choice: não se humilhou
  rationale: 'O nifal tem aqui sentido médio ou reflexivo: ele se recusou a assumir uma postura humilde e submissa.'
- source_word: מִלִּפְנֵי יִרְמְיָהוּ הַנָּבִיא
  choice: diante do profeta Jeremias
  rationale: “Diante de” expressa naturalmente a relação marcada pela preposição, e o título profético é conservado.
- source_word: מִפִּי יְהוָה
  choice: que falava da parte de Yahweh
  rationale: A expressão significa literalmente “da boca de Yahweh” e caracteriza Jeremias como portador da mensagem divina. A formulação idiomática portuguesa comunica essa mediação sem sugerir que o texto hebraico contenha explicitamente o verbo “falar”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Relação de מִפִּי יְהוָה com Jeremias
  choice: 'oração relativa: “que falava da parte de Yahweh”'
  alternative: “conforme a palavra de Yahweh”; “por ordem de Yahweh”
  rationale: A frase final descreve a procedência divina da mensagem profética. A tradução conserva essa função sem reduzir a expressão exclusivamente a “ordem”, embora acrescente “falava” para tornar explícita em português a elipse hebraica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o idioma bíblico transparente “aos olhos de” e usa “se humilhou” no sentido moral e religioso do contexto. O marcador da nota foi colocado junto à expressão a que efetivamente corresponde.
