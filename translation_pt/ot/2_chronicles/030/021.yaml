    text: 'Hebraico: «com instrumentos de força para Yahweh». Também pode ser entendido como «com instrumentos poderosos» ou «com instrumentos sonoros». A relação exata de «para Yahweh» com a expressão anterior é incerta.'
    reason: lexical_alternative
