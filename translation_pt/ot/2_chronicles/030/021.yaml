base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/021.yaml
  text: And the sons of Israel who were found in Jerusalem kept the Feast of Unleavened Bread for seven days with great joy[b][a], and the Levites and the priests praised Yahweh day by day with mighty instruments to Yahweh.
translation:
  language: pt
  text: Os israelitas que estavam em Jerusalém celebraram a Festa dos Pães sem Fermento durante sete dias, com grande alegria; e os levitas e os sacerdotes louvavam Yahweh, dia após dia, com instrumentos de força para Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «com instrumentos de força para Yahweh». Também pode ser entendido como «com instrumentos poderosos» ou «com instrumentos sonoros». A relação exata de «para Yahweh» com a expressão anterior é incerta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: celebraram
  rationale: Com חַג, o verbo עשה forma uma expressão idiomática para celebrar ou observar uma festa; “celebraram” é claro e natural em português.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os israelitas
  rationale: Embora a forma seja literalmente “filhos de Israel”, no contexto narrativo designa o povo israelita e “os israelitas” comunica isso com naturalidade.
- source_word: הַנִּמְצְאִים בִּירוּשָׁלִַם
  choice: que estavam em Jerusalém
  rationale: O particípio de מצא significa literalmente “os que foram encontrados”, mas aqui tem o sentido contextual de presença no local.
- source_word: חַג הַמַּצּוֹת
  choice: a Festa dos Pães sem Fermento
  rationale: Nome tradicional e inteligível da festa; explicita em linguagem comum que se trata de pão não levedado.
- source_word: שִׁבְעַת יָמִים
  choice: durante sete dias
  rationale: Expressa naturalmente em português a duração indicada pelo hebraico.
- source_word: בְּשִׂמְחָה גְדוֹלָה
  choice: com grande alegria
  rationale: Tradução direta, corrente e semanticamente precisa.
- source_word: וּמְהַלְלִים
  choice: E ... louvavam
  rationale: O particípio descreve ação continuada durante a celebração; o imperfeito português transmite adequadamente esse aspecto.
- source_word: יוֹם בְּיוֹם
  choice: dia após dia
  rationale: Preserva o valor distributivo e iterativo da expressão hebraica em português natural.
- source_word: בִּכְלֵי עֹז
  choice: com instrumentos poderosos
  rationale: A expressão incomum significa literalmente “com instrumentos de força/poder”. A tradução conserva sua imagem sem decidir se עֹז descreve potência, volume ou função cultual.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: Mantém a segunda ocorrência e a possível ideia de direção, finalidade ou dedicação, sem eliminar a repetição enfática do texto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto traz o nome próprio divino; “Yahweh” o preserva como nome e evita substituí-lo por um título.
- issue: Sentido de בִּכְלֵי עֹז לַיהוָה
  choice: com instrumentos poderosos para Yahweh
  alternative: com instrumentos sonoros para Yahweh; com instrumentos de força para Yahweh; com instrumentos, louvando vigorosamente a Yahweh
  rationale: A construção hebraica é difícil e admite mais de uma relação semântica. O texto principal preserva sua forma e a nota registra alternativas sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Israelitas” e “que estavam” evitam literalismos pouco naturais; a construção difícil no fim do versículo é mantida de modo relativamente formal e acompanhada de nota.
