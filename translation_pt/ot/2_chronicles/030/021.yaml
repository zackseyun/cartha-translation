revisions:
- from: Os israelitas que estavam em Jerusalém celebraram a Festa dos Pães sem Fermento durante sete dias, com grande alegria. E, dia após dia, os levitas e os sacerdotes louvavam a Yahweh com instrumentos poderosos[a] para Yahweh.
  to: Os israelitas que estavam em Jerusalém celebraram a Festa dos Pães sem Fermento durante sete dias, com grande alegria; e os levitas e os sacerdotes louvavam Yahweh, dia após dia, com instrumentos de força para Yahweh[a].
  rationale: A revisão corrige a regência de «louvar», mantém a coordenação do hebraico e substitui uma interpretação um pouco mais definida por «instrumentos de força», uma tradução formal que preserva a obscuridade de בִּכְלֵי־עֹז. A nota oferece alternativas sem fixar indevidamente o sentido ou a ligação sintática de לַיהוָה.
  reviewer_model: gpt-5.6-terra
