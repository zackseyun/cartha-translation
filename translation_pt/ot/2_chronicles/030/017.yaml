base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/017.yaml
  text: For many in the assembly had not sanctified themselves[a], and the Levites were over the slaughter of the Passover lambs for everyone who was not clean[c][b], to consecrate them to Yahweh.
translation:
  language: pt
  text: Pois muitos na assembleia não tinham se santificado[a], e os levitas ficaram encarregados do abate dos animais da Páscoa[b] em lugar de todos os que não estavam puros[c], a fim de consagrá-los a Yahweh.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não tinham se consagrado”. O hebraico emprega linguagem de santificação, embora a purificação ritual seja a questão imediata.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “as Páscoas”; isto é, os animais oferecidos no sacrifício da Páscoa.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “estavam impuros”. Trata-se de pureza ritual.'
    reason: lexical_alternative
  - marker: d
    text: O hebraico não declara o objeto de “consagrar”. Provavelmente se refere aos animais da Páscoa, embora também possa ser entendido em relação às pessoas que não estavam puras.
    reason: textual_ambiguity
lexical_decisions:
- source_word: רַבַּת בַּקָּהָל
  choice: muitos na assembleia
  rationale: Expressa um grande número de pessoas dentro da comunidade reunida; “assembleia” traduz קָהָל de modo claro e apropriado ao contexto de culto.
- source_word: הִתְקַדָּשׁוּ
  choice: não tinham se santificado
  rationale: O hitpael de קדשׁ indica que as pessoas se prepararam ou entraram em estado de santidade para o culto. “Santificado” preserva essa linguagem, sem reduzi-la apenas à purificação ritual.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: Designação convencional e clara do grupo tribal e cultual.
- source_word: עַל שְׁחִיטַת
  choice: ficaram encarregados do abate
  rationale: Neste contexto, עַל indica responsabilidade, e שְׁחִיטָה designa o abate ritual. A formulação é natural em português e mantém o sentido cultual.
- source_word: הַפְּסָחִים
  choice: os animais da Páscoa
  rationale: O plural, literalmente “as Páscoas”, refere-se aqui aos animais sacrificiais da celebração. “Animais da Páscoa” evita restringir indevidamente a referência a cordeiros.
- source_word: לְכֹל לֹא טָהוֹר
  choice: por todos os que não estavam puros
  rationale: טָהוֹר se refere à pureza ritual neste contexto. A expressão mantém a forma negativa do hebraico e continua compreensível em português moderno.
- source_word: לְהַקְדִּישׁ לַיהוָה
  choice: a fim de consagrá-los a Yahweh
  rationale: O infinitivo expressa a finalidade da ação dos levitas. O pronome explicita um objeto exigido pela fluência do português, enquanto a nota registra que o hebraico não o declara e preserva a possível ambiguidade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
theological_decisions:
- issue: Linguagem cultual de קדשׁ no contexto da Páscoa
  choice: Manter “santificado” e “consagrar”
  alternative: Traduzir os dois casos exclusivamente com linguagem de purificação ritual
  rationale: Embora a pureza ritual seja a questão imediata, קדשׁ pertence ao campo da santidade e consagração. A tradução conserva a distinção entre santidade e pureza presente no vocabulário hebraico.
- issue: Objeto implícito de לְהַקְדִּישׁ
  choice: Empregar “consagrá-los”, entendendo primariamente os animais sacrificiais
  alternative: Entender como referência às pessoas que não estavam puras
  rationale: O hebraico não expressa o objeto. Os animais da Páscoa são o antecedente sintático e contextual mais natural, mas a nota reconhece a ambiguidade em vez de apresentá-la como inexistente.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Ficaram encarregados do abate” comunica responsabilidade cultual sem soar excessivamente técnico; “animais da Páscoa” evita a imprecisão de limitar o sacrifício a cordeiros.
