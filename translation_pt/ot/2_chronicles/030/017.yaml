  terminology: «Santificado», «levitas», «animais da Páscoa», «consagrá-los» e «Yahweh» são escolhas apropriadas. A nota sobre «puros» corretamente identifica o sentido ritual. A nota final preserva prudentemente o objeto não expresso de «consagrar».
