base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/008.yaml
  text: Do not stiffen your neck as your fathers did[a]. Give your hand to Yahweh, and come to his sanctuary, which he has consecrated forever, and serve Yahweh your God[b], so that his burning anger may turn away from you.
translation:
  language: pt
  text: Agora, não endureçam o pescoço como fizeram seus antepassados. Submetam-se ao SENHOR[a], venham ao seu santuário, que ele consagrou para sempre, e sirvam ao SENHOR, seu Deus, para que o ardor da sua ira se afaste de vocês.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “deem a mão ao SENHOR”; expressão que pode significar “entreguem-se ao SENHOR” ou “submetam-se ao SENHOR”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e o ardor da sua ira se afastará de vocês”.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַתָּה
  choice: Agora
  rationale: O advérbio temporal está explícito no texto hebraico e deve ser representado, apesar de ter sido omitido na última revisão da camada inglesa.
- source_word: אַל תַּקְשׁוּ עָרְפְּכֶם
  choice: não endureçam o pescoço
  rationale: Preserva a imagem hebraica de tornar o pescoço rígido, metáfora de resistência obstinada, em português atual e compreensível.
- source_word: כַּאֲבוֹתֵיכֶם
  choice: como fizeram seus antepassados
  rationale: No contexto, אָבוֹת se refere às gerações anteriores. 'Antepassados' comunica isso naturalmente e evita que 'pais' seja entendido apenas como os genitores imediatos.
- source_word: תְּנוּ יָד לַיהוָה
  choice: Submetam-se ao SENHOR
  rationale: A expressão literalmente diz 'deem a mão ao SENHOR', mas funciona como idioma de submissão, compromisso ou lealdade. A tradução explicita o sentido; a imagem literal é preservada em nota.
- source_word: לַיהוָה / יְהוָה
  choice: ao SENHOR / o SENHOR
  rationale: O tetragrama é vertido pela forma tradicional em versaletes, amplamente reconhecida em português.
- source_word: לְמִקְדָּשׁוֹ
  choice: ao seu santuário
  rationale: מִקְדָּשׁ designa o lugar santo ou santuário; a escolha mantém o sentido cultual sem restringi-lo apenas ao edifício.
- source_word: אֲשֶׁר הִקְדִּישׁ לְעוֹלָם
  choice: que ele consagrou para sempre
  rationale: A formulação conserva tanto o sentido de separar como santo quanto a força temporal direta de לְעוֹלָם.
- source_word: וְעִבְדוּ
  choice: e sirvam
  rationale: עבד, quando tem Deus como objeto, abrange serviço e culto. 'Sirvam' mantém essa amplitude sem reduzir o termo a atos litúrgicos.
- source_word: חֲרוֹן אַפּוֹ
  choice: o ardor da sua ira
  rationale: Reproduz de modo idiomático a metáfora hebraica do calor intenso da ira.
- source_word: וְיָשֹׁב מִכֶּם
  choice: para que ... se afaste de vocês
  rationale: Após a série de imperativos, a forma pode exprimir o resultado desejado. 'Para que ... se afaste' preserva essa nuance sem apresentar o resultado como garantia mecânica.
theological_decisions:
- issue: Sentido do idioma תְּנוּ יָד לַיהוָה
  choice: Submetam-se ao SENHOR
  alternative: Deem a mão ao SENHOR; entreguem-se ao SENHOR
  rationale: O idioma denota submissão, compromisso ou reconhecimento de autoridade. Em português, a tradução literal poderia sugerir que as pessoas estariam ajudando Deus; por isso, o sentido contextual aparece no texto, e a forma literal fica registrada em nota.
- issue: Força de וְיָשֹׁב na sequência exortativa
  choice: para que o ardor da sua ira se afaste de vocês
  alternative: e o ardor da sua ira se afastará de vocês
  rationale: A construção pode ser entendida como resultado desejado das ordens anteriores ou como consequência anunciada. O texto principal mantém a nuance volitiva/final, enquanto a nota registra a leitura indicativa.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com formas de terceira pessoa do plural ('vocês') e sem construções arcaicas. A imagem do pescoço endurecido foi mantida por ser compreensível no contexto; o idioma de 'dar a mão' foi explicitado no texto para evitar um sentido enganoso em português. O advérbio inicial 'Agora' traduz o עַתָּה expresso no WLC.
