base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/027.yaml
  text: Then the priests[a], the Levites, stood up and blessed the people, and their voice was heard, and their prayer came to his holy dwelling[c][b], to heaven.
translation:
  language: pt
  text: Então os sacerdotes levitas[a] se levantaram e abençoaram o povo. A voz deles foi ouvida[b], e a oração deles chegou à sua santa morada, aos céus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os sacerdotes, isto é, os levitas”. A expressão hebraica provavelmente identifica os sacerdotes como levitas, em vez de mencionar dois grupos distintos.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a voz deles foi escutada”. A forma passiva dá a entender que Deus os ouviu, sem nomeá-lo explicitamente como agente.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “à sua santa morada, ao céu”. O termo hebraico traduzido por “céus” tem forma plural.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: se levantaram
  rationale: O verbo קום descreve o ato de levantar-se ou pôr-se de pé; “se levantaram” é natural em português e preserva a ação concreta.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: os sacerdotes levitas
  rationale: A sequência é mais provavelmente apositiva e identifica esses sacerdotes como levitas, sem apresentar dois grupos distintos. A nota preserva uma forma mais explícita dessa relação.
- source_word: וַיְבָרֲכוּ אֶת הָעָם
  choice: abençoaram o povo
  rationale: ברך, neste contexto, refere-se a proferir uma bênção sobre o povo; a formulação concisa é clara e tradicional sem ser arcaica.
- source_word: וַיִּשָּׁמַע בְּקוֹלָם
  choice: A voz deles foi ouvida
  rationale: Mantém a forma passiva do hebraico e não acrescenta Deus como sujeito explícito, embora o contexto implique que ele os ouviu.
- source_word: תְפִלָּתָם
  choice: a oração deles
  rationale: O substantivo singular com sufixo plural pode ser entendido coletivamente como a oração feita por eles.
- source_word: לִמְעוֹן קָדְשׁוֹ
  choice: à sua santa morada
  rationale: מָעוֹן designa lugar de habitação; “santa morada” conserva a imagem espacial e o registro digno.
- source_word: לַשָּׁמָיִם
  choice: aos céus
  rationale: Preserva a forma lexical plural de שָׁמַיִם e a repetição direcional introduzida por ל, apresentando “aos céus” em aposição a “à sua santa morada”.
theological_decisions:
- issue: Se Deus deve ser explicitado como agente de “foi ouvida”
  choice: 'Manter a construção passiva: “A voz deles foi ouvida”.'
  alternative: “Deus ouviu a voz deles” ou “A voz deles foi ouvida por Deus”.
  rationale: O contexto aponta para a escuta divina, mas a cláusula hebraica não nomeia explicitamente o agente. A tradução conserva essa formulação e sua implicação sem a tornar explícita.
- issue: Relação entre “os sacerdotes” e “os levitas”
  choice: 'Entender a expressão como identificação apositiva: “os sacerdotes levitas”.'
  alternative: “os sacerdotes e os levitas” ou “os sacerdotes, isto é, os levitas”.
  rationale: A ausência de conjunção favorece a identificação de um só grupo, em vez de dois grupos coordenados; a nota registra uma maneira alternativa de exprimir a aposição.
- issue: Relação entre a santa morada de Deus e os céus
  choice: 'Conservar as duas expressões em aposição direcional: “à sua santa morada, aos céus”.'
  alternative: “à sua santa morada no céu”.
  rationale: A formulação escolhida retém os dois complementos introduzidos por ל no hebraico, sem reduzir o segundo a mera indicação locativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A pontuação divide o longo encadeamento hebraico em duas frases para maior naturalidade, sem perder sua progressão. Os pronomes permanecem sem referente acrescentado, acompanhando o texto-fonte e o contexto imediato.
