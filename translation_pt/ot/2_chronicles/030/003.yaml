base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/003.yaml
  text: For they could not do it at that time[a], because the priests had not consecrated themselves sufficiently[b], and the people had not gathered to Jerusalem.
translation:
  language: pt
  text: Pois não puderam celebrá-la naquela ocasião, porque os sacerdotes não tinham se consagrado suficientemente[a], e o povo não havia se reunido em Jerusalém[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «não havia sacerdotes consagrados em número suficiente». A expressão hebraica pode referir-se tanto à suficiência da consagração quanto à quantidade de sacerdotes que haviam se consagrado.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico traz literalmente a ideia de reunir-se «para Jerusalém» ou «em direção a Jerusalém»; em português, «reunir-se em Jerusalém» expressa de modo natural o lugar em que a assembleia deveria ocorrer.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: puderam
  rationale: O verbo expressa capacidade ou possibilidade. «Não puderam» preserva essa ideia em português natural.
- source_word: לַעֲשֹׂתוֹ
  choice: celebrá-la
  rationale: O sufixo retoma a Páscoa no contexto. «Celebrá-la» torna a referência clara e idiomática em português, sem acrescentar conteúdo além da observância da festa.
- source_word: בָּעֵת הַהִיא
  choice: naquela ocasião
  rationale: A expressão aponta para o tempo específico previsto para a celebração. «Naquela ocasião» é corrente e evita tornar explícita demais a ideia de tempo designado.
- source_word: הִתְקַדְּשׁוּ
  choice: tinham se consagrado
  rationale: No contexto sacerdotal, o hitpael de קדשׁ indica a preparação ou consagração ritual dos próprios sacerdotes. «Consagrado» mantém o sentido cultual em linguagem compreensível.
- source_word: לְמַדַּי
  choice: suficientemente
  rationale: O advérbio indica suficiência, mas a construção compacta pode dizer que a consagração não fora adequada ou que não havia sacerdotes consagrados em número suficiente. A tradução principal conserva a forma adverbial, e a nota registra a leitura numérica.
- source_word: נֶאֶסְפוּ
  choice: havia se reunido
  rationale: O nifal de אסף descreve o ajuntamento do povo. A forma pronominal «reunir-se» é natural em português e corresponde ao valor intransitivo do contexto.
- source_word: לִירוּשָׁלִָם
  choice: em Jerusalém
  rationale: Embora a preposição לְ seja direcional, em português se diz naturalmente que pessoas «se reuniram em» um lugar, destacando o local da assembleia. A nota registra a direção expressa no hebraico.
theological_decisions:
- issue: Sentido de לְמַדַּי em relação aos sacerdotes
  choice: «não tinham se consagrado suficientemente»
  alternative: «não havia sacerdotes consagrados em número suficiente»
  rationale: O hebraico permite entender insuficiência no grau da consagração ou no número de sacerdotes consagrados. A redação principal segue de perto a estrutura adverbial sem excluir na nota a leitura numérica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. «Celebrá-la» explicita de modo natural que o objeto é a Páscoa mencionada no contexto. A ambiguidade de לְמַדַּי e a nuance direcional de לִירוּשָׁלִָם são preservadas em notas.
