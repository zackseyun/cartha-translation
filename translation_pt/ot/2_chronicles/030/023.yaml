base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/023.yaml
  text: Then the whole assembly agreed to keep it for another seven days[a], and they kept it for seven days with joy.
translation:
  language: pt
  text: Então toda a assembleia decidiu celebrar por mais sete dias[a], e celebraram durante sete dias com alegria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “fazer mais sete dias... e fizeram sete dias”; aqui, “fazer” é usado de modo idiomático para celebrar uma festa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעֲצוּ
  choice: decidiu
  rationale: A forma nifal expressa deliberação conjunta que resulta numa decisão; “decidiu” é natural em português e concorda com o coletivo singular “assembleia”.
- source_word: כָּל הַקָּהָל
  choice: toda a assembleia
  rationale: Preserva כָּל e traduz קָהָל como a comunidade reunida, em linguagem clara e adequada ao contexto narrativo.
- source_word: לַעֲשׂוֹת
  choice: celebrar
  rationale: Embora o sentido básico seja “fazer”, no contexto de uma festa o verbo designa sua observância; “celebrar” comunica naturalmente o uso idiomático sem explicitar um objeto ausente no hebraico.
- source_word: שִׁבְעַת יָמִים אֲחֵרִים
  choice: por mais sete dias
  rationale: Expressa com clareza e naturalidade o acréscimo de outro período de sete dias.
- source_word: וַיַּעֲשׂוּ
  choice: celebraram
  rationale: Mantém o mesmo valor contextual de עשה na primeira oração e evita a tradução portuguesa pouco natural “fizeram sete dias”.
- source_word: שִׁבְעַת יָמִים
  choice: durante sete dias
  rationale: Torna explícito, de maneira idiomática, o acusativo de duração.
- source_word: שִׂמְחָה
  choice: com alegria
  rationale: Reproduz de forma concisa o substantivo que indica a maneira alegre da celebração.
