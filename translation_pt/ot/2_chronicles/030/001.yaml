source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח יְחִזְקִיָּ֜הוּ עַל כָּל יִשְׂרָאֵ֣ל וִֽ/יהוּדָ֗ה וְ/גַֽם אִגְּרוֹת֙ כָּתַב֙ עַל אֶפְרַ֣יִם וּ/מְנַשֶּׁ֔ה לָ/ב֥וֹא לְ/בֵית יְהוָ֖ה בִּֽ/ירוּשָׁלִָ֑ם לַ/עֲשׂ֣וֹת פֶּ֔סַח לַ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/001.yaml
  text: Then Hezekiah sent word to all Israel and Judah[a], and also wrote letters to Ephraim and Manasseh, to come to the house of Yahweh in Jerusalem to keep the Passover to Yahweh[c][b], the God of Israel.
translation:
  language: pt
  text: Então Ezequias mandou uma mensagem a todo o Israel e Judá[a] e também escreveu cartas a Efraim e Manassés, convocando-os a ir à casa de Yahweh, em Jerusalém, para celebrar a Páscoa em honra de Yahweh[b], o Deus de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por todo o Israel e Judá”. A preposição hebraica pode indicar tanto os destinatários quanto a ampla extensão geográfica do envio.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “fazer a Páscoa para Yahweh”; isto é, observar ou celebrar a Páscoa dedicada a ele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mandou uma mensagem
  rationale: O verbo significa literalmente “enviou”, mas, neste contexto, implica o envio de uma mensagem ou convocação. A formulação explicita naturalmente o ato comunicativo sem acrescentar “mensageiros”, que não aparece no hebraico.
- source_word: עַל כָּל יִשְׂרָאֵל וִיהוּדָה
  choice: a todo o Israel e Judá
  rationale: A preposição עַל indica aqui o destino ou a extensão do envio. “A todo o Israel e Judá” preserva a convocação dirigida aos dois povos ou territórios; a possível ideia de distribuição por toda a região é registrada em nota.
- source_word: אִגְּרוֹת כָּתַב
  choice: escreveu cartas
  rationale: Tradução direta e corrente do substantivo “cartas” e do verbo “escreveu”.
- source_word: עַל אֶפְרַיִם וּמְנַשֶּׁה
  choice: a Efraim e Manassés
  rationale: A preposição assinala os destinatários ou as regiões às quais as cartas foram dirigidas.
- source_word: לָבוֹא
  choice: convocando-os a ir
  rationale: O infinitivo expressa o propósito da mensagem. “Convocando-os” torna clara a relação sintática implícita, e “ir” é natural em português quando a narrativa adota a perspectiva dos destinatários.
- source_word: לְבֵית יְהוָה
  choice: à casa de Yahweh
  rationale: Preserva a expressão hebraica literal “casa de Yahweh”, em vez de substituí-la pelo interpretativo “templo”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do Tetragrama, preservando seu caráter de nome próprio em vez de substituí-lo por um título.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: Tradução locativa direta.
- source_word: לַעֲשׂוֹת פֶּסַח
  choice: celebrar a Páscoa
  rationale: A expressão significa literalmente “fazer a Páscoa”, idioma hebraico para observar ou celebrar essa festa.
- source_word: לַיהוָה
  choice: em honra de Yahweh
  rationale: A preposição לְ indica que a celebração é dirigida, dedicada ou realizada para Yahweh. “Em honra de” comunica essa relação com naturalidade, sem reduzir a frase a mero benefício.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta da construção genitiva, mantendo a identificação pactual.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
- issue: Sentido da Páscoa לַיהוָה
  choice: em honra de Yahweh
  alternative: para Yahweh; dedicada a Yahweh
  rationale: A preposição permite uma relação de direção, dedicação ou interesse. “Em honra de” oferece uma expressão portuguesa natural sem definir de maneira estreita a natureza teológica da celebração.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Casa de Yahweh” mantém a imagem do original, enquanto “celebrar a Páscoa” traduz o idioma hebraico de modo natural. Os marcadores [a] e [b] aparecem no texto principal.
