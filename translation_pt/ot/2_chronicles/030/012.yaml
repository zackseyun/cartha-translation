base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/012.yaml
  text: Also in Judah the hand of God was on them to give them one heart to carry out the command of the king and the officials[a], according to the word of Yahweh.
translation:
  language: pt
  text: Também em Judá, a mão de Deus estava sobre eles, para lhes dar um só coração[a] para cumprir a ordem do rei e dos oficiais, segundo a palavra de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um coração unido”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם בִּיהוּדָה
  choice: Também em Judá
  rationale: Preserva o valor aditivo de גַּם e o sentido locativo natural da preposição בְּ.
- source_word: הָיְתָה יַד הָאֱלֹהִים
  choice: a mão de Deus agiu sobre eles
  rationale: Mantém a imagem hebraica da mão divina e expressa em português natural sua atuação efetiva; 'sobre eles' torna explícito o referente exigido pelo contexto e confirmado por לָהֶם.
- source_word: לָתֵת לָהֶם לֵב אֶחָד
  choice: dando-lhes um só coração
  rationale: O gerúndio comunica o resultado ou propósito da atuação divina sem definir rigidamente a relação sintática; 'um só coração' conserva a metáfora e a ideia de disposição unificada.
- source_word: לַעֲשׂוֹת מִצְוַת
  choice: para cumprir a ordem
  rationale: No contexto de uma determinação régia, 'cumprir a ordem' é claro e idiomático, sem conferir a מִצְוָה um sentido exclusivamente religioso.
- source_word: הַמֶּלֶךְ וְהַשָּׂרִים
  choice: do rei e dos oficiais
  rationale: שָּׂרִים designa autoridades ou altos funcionários; 'oficiais' combina clareza moderna com o contexto administrativo.
- source_word: בִּדְבַר יְהוָה
  choice: segundo a palavra de Yahweh
  rationale: Preserva a leitura de conformidade com a palavra divina e mantém o nome pessoal יְהוָה em transliteração.
theological_decisions:
- issue: Natureza da ação divina na expressão 'a mão de Deus'
  choice: Atribuir explicitamente a Deus uma atuação eficaz que produz unidade, sem explicar seu mecanismo.
  alternative: Enfraquecer como simples ajuda providencial ou ampliar para uma formulação determinista.
  rationale: O hebraico atribui a disposição unificada do povo à ação de Deus, mas não formula uma doutrina posterior sobre como essa ação operou.
- issue: Relação entre a ordem humana e a palavra divina
  choice: Traduzir בִּדְבַר como 'segundo a palavra de Yahweh'.
  alternative: Traduzir 'pela palavra de Yahweh', entendendo-a principalmente como fonte ou instrumento da ordem.
  rationale: A expressão pode envolver fundamento e conformidade; 'segundo' comunica que a ordem do rei e dos oficiais estava de acordo com a palavra divina, sem negar que nela se originasse.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação preserva a metáfora hebraica de 'mão' e 'coração', evitando tanto literalismo pouco natural quanto paráfrase doutrinária.
