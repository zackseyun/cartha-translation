base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/026.yaml
  text: So there was great joy in Jerusalem, for since the days of Solomon son of David, king of Israel, there had been nothing like this in Jerusalem.
translation:
  language: pt
  text: Assim, houve grande alegria em Jerusalém, pois, desde os dias de Salomão, filho de Davi, rei de Israel, não havia acontecido nada semelhante em Jerusalém.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי
  choice: Assim, houve
  rationale: A forma narrativa faz o relato avançar e, no contexto, apresenta o resultado dos acontecimentos anteriores. “Assim, houve” expressa essa ligação de modo natural.
- source_word: שִׂמְחָה גְדוֹלָה
  choice: grande alegria
  rationale: Reproduz diretamente o substantivo e o adjetivo hebraicos, abrangendo tanto a emoção quanto a alegria coletiva.
- source_word: בִּירוּשָׁלָם
  choice: em Jerusalém
  rationale: Equivalente locativo corrente e natural em português; a repetição ao final é mantida por seu efeito retórico.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação para a afirmação sobre a grande alegria, com registro digno e compreensível.
- source_word: מִימֵי
  choice: desde os dias de
  rationale: Indica um intervalo iniciado no período de Salomão e estendido até o momento narrado.
- source_word: שְׁלֹמֹה בֶן דָּוִיד
  choice: Salomão, filho de Davi
  rationale: Mantém a relação de filiação do hebraico e usa pontuação natural em português para a expressão em aposição.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: rei de Israel
  rationale: Mantém o título em aposição a Salomão sem acrescentar artigo ausente e desnecessário.
- source_word: לֹא כָזֹאת
  choice: não havia acontecido nada semelhante
  rationale: A expressão significa literalmente “não [houve] como esta”; o verbo “acontecido” explicita apenas a elipse exigida pelo português, sem definir além do contexto o referente exato da comparação.
