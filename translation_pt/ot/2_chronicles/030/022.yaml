source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְחִזְקִיָּ֗הוּ עַל לֵב֙ כָּל הַ/לְוִיִּ֔ם הַ/מַּשְׂכִּילִ֥ים שֵֽׂכֶל ט֖וֹב לַ/יהוָ֑ה וַ/יֹּאכְל֤וּ אֶת הַ/מּוֹעֵד֙ שִׁבְעַ֣ת הַ/יָּמִ֔ים מְזַבְּחִים֙ זִבְחֵ֣י שְׁלָמִ֔ים וּ/מִ֨תְוַדִּ֔ים לַ/יהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/022.yaml
  text: And Hezekiah spoke encouragingly to all the Levites who showed good understanding in the service of Yahweh[a]. And they ate the feast for seven days, sacrificing peace offerings and giving thanks to Yahweh[d][c][b], the God of their fathers.
translation:
  language: pt
  text: Ezequias encorajou[a] todos os levitas que demonstravam bom discernimento[b] no serviço de Yahweh. Eles celebraram a festa durante sete dias, oferecendo sacrifícios de comunhão[c] e dando graças[d] a Yahweh, o Deus de seus antepassados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “falou ao coração de todos os levitas”; a expressão significa que os encorajou ou lhes falou com bondade.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido como “que tinham bom discernimento para com Yahweh” ou “que eram hábeis nas coisas de Yahweh”.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “sacrifícios de paz”; também pode ser traduzido como “ofertas de comunhão” ou “ofertas de bem-estar”.'
    reason: lexical_alternative
  - marker: d
    text: O verbo também pode significar “confessando” ou “louvando”; neste contexto, provavelmente indica gratidão expressa no culto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר עַל־לֵב
  choice: falou ao coração
  rationale: Preserva a imagem do idioma hebraico, que neste contexto indica falar de modo encorajador, afetuoso ou consolador; a nota esclarece seu sentido.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: Designação tradicional e precisa do grupo tribal e cultual.
- source_word: הַמַּשְׂכִּילִים שֵׂכֶל טוֹב לַיהוָה
  choice: que demonstravam boa compreensão no serviço de Yahweh
  rationale: O particípio e o substantivo cognato destacam compreensão prática, discernimento ou competência. O contexto cultual favorece relacioná-la ao serviço prestado a Yahweh, sem excluir a ambiguidade na nota.
- source_word: וַיֹּאכְלוּ אֶת־הַמּוֹעֵד שִׁבְעַת הַיָּמִים
  choice: participaram das refeições da festa durante sete dias
  rationale: O hebraico diz literalmente que eles 'comeram a festa', construção pouco natural em português. A formulação conserva tanto a alimentação festiva quanto a duração, sem transformar o objeto em mera indicação temporal.
- source_word: מְזַבְּחִים זִבְחֵי שְׁלָמִים
  choice: oferecendo sacrifícios de comunhão
  rationale: שְׁלָמִים designa uma categoria sacrificial associada a comunhão, paz e bem-estar. 'Sacrifícios de comunhão' é claro e corrente, enquanto a nota registra alternativas.
- source_word: וּמִתְוַדִּים
  choice: dando graças
  rationale: O hitpael de ידה pode indicar agradecer, louvar ou confessar. O ambiente festivo e cultual favorece 'dando graças', mantendo-se as outras possibilidades em nota.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: o Deus de seus antepassados
  rationale: Expressa de modo natural a referência ancestral e pactual do hebraico sem restringi-la aos pais imediatos.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o Tetragrama; 'Yahweh' preserva o nome pactual e distingue-o do título 'Senhor'.
- issue: Sentido cultual de וּמִתְוַדִּים
  choice: dando graças
  alternative: confessando; louvando
  rationale: O contexto de festa e sacrifícios favorece uma ação positiva de gratidão ou louvor, mas o verbo também pode denotar confissão; essa amplitude é explicitada na nota.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. A construção idiomática principal foi preservada no texto e explicada em nota; ambiguidades lexicais relevantes foram mantidas sem impor uma leitura denominacional.
