base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/014.yaml
  text: They arose and removed the altars that were in Jerusalem[b][a], and they removed all the incense altars and threw them into the Kidron Valley.
translation:
  language: pt
  text: Eles se levantaram e retiraram os altares que estavam em Jerusalém; removeram todos os altares de incenso[a] e os lançaram no vale do Cedrom[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os lugares para queimar incenso” ou “todos os suportes de incenso”. O termo hebraico se refere a instalações de culto associadas à queima de incenso.
    reason: lexical_alternative
  - marker: b
    text: O hebraico pode significar “vale”, “ribeiro” ou “uádi” do Cedrom.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: Eles se levantaram
  rationale: A forma narrativa de קום introduz uma ação decidida. “Levantaram-se” preserva esse movimento e soa natural em português.
- source_word: וַיָּסִירוּ / הֵסִירוּ
  choice: retiraram / removeram
  rationale: O hifil de סור significa tirar ou remover. A pequena variação evita repetição pesada sem alterar o sentido dos dois verbos hebraicos.
- source_word: הַמִּזְבְּחוֹת
  choice: os altares
  rationale: É o plural comum de “altar”; o contexto indica que se trata de instalações de culto consideradas impróprias.
- source_word: אֲשֶׁר בִּירוּשָׁלָם
  choice: que havia em Jerusalém
  rationale: Mantém explicitamente a oração relativa e expressa de modo idiomático a localização dos altares.
- source_word: הַמְקַטְּרוֹת
  choice: os altares de incenso
  rationale: O substantivo, ligado à raiz קטר, designa instalações relacionadas à queima de incenso. “Altares de incenso” é claro no contexto, enquanto a nota preserva a amplitude lexical.
- source_word: וַיַּשְׁלִיכוּ
  choice: lançando-os
  rationale: שׁלך indica lançar ou atirar. “Lançando-os” comunica a eliminação deliberada e liga naturalmente as ações na frase portuguesa.
- source_word: לְנַחַל קִדְרוֹן
  choice: no vale do Cedrom
  rationale: נחל pode designar um vale, ravina ou curso de água sazonal. “Vale do Cedrom” é claro e geograficamente compreensível; “Cedrom” é a forma tradicional portuguesa do topônimo.
