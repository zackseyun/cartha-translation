base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/016.yaml
  text: They stood in their place according to their custom[a], according to the law of Moses the man of God. The priests were sprinkling the blood received from the hand of the Levites.
translation:
  language: pt
  text: Eles tomaram posição em seus lugares, conforme o procedimento prescrito para eles, segundo a Lei de Moisés, o homem de Deus. Os sacerdotes aspergiam o sangue que recebiam das mãos dos levitas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “da mão dos levitas”.
    reason: A nota registra a forma concisa do hebraico, enquanto o texto explicita a recepção do sangue e usa o plural idiomático em português.
lexical_decisions:
- source_word: וַיַּעַמְדוּ עַל־עָמְדָם
  choice: Eles tomaram posição em seus lugares
  rationale: A expressão indica que se colocaram em seus postos designados. Esta formulação preserva o sentido posicional e soa natural em português.
- source_word: כְּמִשְׁפָּטָם
  choice: conforme o procedimento prescrito para eles
  rationale: No contexto do culto, מִשְׁפָּט designa a norma ou o procedimento estabelecido, não mero costume nem julgamento judicial.
- source_word: כְּתוֹרַת מֹשֶׁה
  choice: segundo a Lei de Moisés
  rationale: A expressão se refere à instrução mosaica que regulamentava o rito; “Lei de Moisés” é clara e consagrada em português.
- source_word: אִישׁ הָאֱלֹהִים
  choice: homem de Deus
  rationale: Preserva o título bíblico tradicional atribuído a Moisés.
- source_word: הַכֹּהֲנִים זֹרְקִים אֶת־הַדָּם
  choice: Os sacerdotes aspergiam o sangue
  rationale: No uso sacrificial, זרק descreve a aplicação ritual do sangue. “Aspergiam” comunica esse ato melhor do que o sentido básico e genérico de lançar.
- source_word: מִיַּד הַלְוִיִּם
  choice: que recebiam das mãos dos levitas
  rationale: O hebraico diz literalmente “da mão dos levitas”. O acréscimo contextual de “recebiam” esclarece de modo natural a transferência do sangue aos sacerdotes, sem alterar a ação descrita.
theological_decisions:
- issue: Terminologia ritual para a aplicação do sangue
  choice: aspergiam o sangue
  alternative: lançavam o sangue
  rationale: “Aspergiam” reflete o uso sacrificial do verbo e evita sugerir uma ação casual, sem acrescentar uma interpretação teológica posterior.
- issue: Caráter normativo de כְּמִשְׁפָּטָם
  choice: conforme o procedimento prescrito para eles
  alternative: conforme o costume deles
  rationale: O contexto da Lei de Moisés favorece um procedimento cultual regulamentado. A tradução evita reduzir a prática a simples costume humano.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com terminologia cultual precisa. A construção explicita apenas o necessário para tornar natural em português a relação elíptica entre sacerdotes, sangue e levitas.
