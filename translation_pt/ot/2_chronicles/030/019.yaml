base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/019.yaml
  text: everyone whose heart was set to seek God[a], Yahweh, the God of his fathers, though not according to the purification required for the holy place.
translation:
  language: pt
  text: todo aquele que dispôs o coração para buscar a Deus, Yahweh, o Deus de seus pais, embora não estivesse conforme a purificação do santuário[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do lugar santo”. Aqui, o hebraico קֹדֶשׁ pode referir-se ao santuário ou ao lugar santo em sentido ritual.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל לְבָבוֹ
  choice: todo aquele cujo coração
  rationale: A construção com כָּל e o substantivo singular com sufixo tem sentido distributivo. A formulação individualiza cada pessoa e mantém a referência singular do hebraico.
- source_word: הֵכִין
  choice: estava disposto
  rationale: O hifil de כון pode indicar preparar, firmar ou dirigir. Neste contexto, descreve um coração deliberadamente orientado para buscar a Deus; “estava disposto” comunica essa orientação interior em português natural.
- source_word: לִדְרוֹשׁ
  choice: a buscar
  rationale: דרש, tendo Deus como objeto, abrange a ideia de procurá-lo em devoção, culto ou consulta. “Buscar” preserva essa amplitude sem explicação excessiva.
- source_word: הָאֱלֹהִים יְהוָה
  choice: a Deus, Yahweh
  rationale: 'A sequência é entendida em aposição: o Deus buscado é identificado pelo nome divino Yahweh. Mantêm-se os dois elementos do hebraico.'
- source_word: אֱלֹהֵי אֲבוֹתָיו
  choice: o Deus dos seus antepassados
  rationale: O possessivo singular acompanha a construção distributiva. “Antepassados” é atual, claro e preserva a referência ancestral e pactual.
- source_word: וְלֹא
  choice: embora não
  rationale: 'A conjunção expressa aqui uma relação concessiva: a busca sincera de Deus coexistia com a falta de conformidade ritual.'
- source_word: כְּטָהֳרַת הַקֹּדֶשׁ
  choice: de acordo com a purificação exigida para o lugar santo
  rationale: כְּ marca conformidade com um padrão, טָהֳרָה denota purificação ritual e קֹדֶשׁ pode designar o lugar santo ou santuário. “Exigida” explicita com naturalidade o caráter normativo dessa conformidade.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor ou Jeová
  rationale: O texto hebraico apresenta diretamente o Tetragrama; “Yahweh” preserva o nome divino em vez de substituí-lo por um título.
- issue: Tensão entre disposição interior e pureza ritual
  choice: Preservar tanto a busca sincera de Deus quanto a não conformidade com a purificação ritual
  alternative: Atenuar um dos dois aspectos por meio de paráfrase
  rationale: O hebraico justapõe os dois elementos sem explicar ou eliminar sua tensão; a tradução faz o mesmo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção permanece como fragmento sintático porque o versículo continua a oração iniciada no contexto anterior.
