  text: כִּ֣י בְ/שׁוּבְ/כֶ֞ם עַל יְהוָ֗ה אֲחֵי/כֶ֨ם וּ/בְנֵי/כֶ֤ם לְ/רַחֲמִים֙ לִ/פְנֵ֣י שֽׁוֹבֵי/הֶ֔ם וְ/לָ/שׁ֖וּב לָ/אָ֣רֶץ הַ/זֹּ֑את כִּֽי חַנּ֤וּן וְ/רַחוּם֙ יְהוָ֣ה אֱלֹהֵי/כֶ֔ם וְ/לֹא יָסִ֤יר פָּנִים֙ מִ/כֶּ֔ם אִם תָּשׁ֖וּבוּ אֵלָֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/009.yaml
  text: For when you return to Yahweh[a], your brothers and your sons will find compassion before their captors and return to this land. For Yahweh your God is gracious and compassionate[c][b], and he will not turn his face away from you if you return to him.
translation:
  language: pt
  text: Pois, quando vocês voltarem para Yahweh, seus irmãos e seus filhos encontrarão compaixão diante de seus captores[a] e voltarão para esta terra. Pois Yahweh, o Deus de vocês, é bondoso e compassivo e não desviará o rosto de vocês[b], se vocês voltarem para ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “serão tratados com misericórdia por seus captores”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, não se afastará de vocês nem lhes negará seu favor.
    reason: idiom_explanation
lexical_decisions:
- source_word: בְּשׁוּבְכֶם עַל יְהוָה
  choice: quando vocês voltarem para Yahweh
  rationale: O verbo שׁוּב expressa aqui retorno a Deus e renovação da fidelidade da aliança. “Voltarem” preserva o motivo do retorno e permite repetir a mesma raiz no fim do versículo. A construção temporal “quando” acompanha naturalmente o infinitivo hebraico com בְּ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título, preservando sua função como nome pessoal no texto hebraico.
- source_word: אֲחֵיכֶם וּבְנֵיכֶם
  choice: seus irmãos e seus filhos
  rationale: Mantém os termos masculinos específicos do hebraico sem ampliá-los silenciosamente para expressões neutras.
- source_word: לְרַחֲמִים לִפְנֵי שׁוֹבֵיהֶם
  choice: encontrarão compaixão da parte daqueles que os levaram cativos
  rationale: Expressa de modo natural em português que eles se tornarão objeto de compaixão perante seus captores, preservando a nuance relacional da construção.
- source_word: שׁוֹבֵיהֶם
  choice: aqueles que os levaram cativos
  rationale: Explicita com precisão o sentido do particípio de שבה e é mais transparente para leitores comuns do que o substantivo “captores”.
- source_word: וְלָשׁוּב לָאָרֶץ הַזֹּאת
  choice: e voltarão para esta terra
  rationale: Apresenta o retorno à terra como resultado ligado à compaixão recebida, sem introduzir uma agência que o hebraico deixa implícita.
- source_word: חַנּוּן וְרַחוּם
  choice: bondoso e compassivo
  rationale: Reproduz o par de atributos divinos como favor generoso e profunda compaixão. “Bondoso” comunica חַנּוּן em linguagem corrente sem reduzir os dois termos ao mesmo conceito.
- source_word: לֹא יָסִיר פָּנִים מִכֶּם
  choice: não desviará de vocês o seu rosto
  rationale: Preserva a imagem hebraica do rosto, importante para a ideia relacional de favor e presença, em uma formulação portuguesa compreensível.
- source_word: אִם תָּשׁוּבוּ אֵלָיו
  choice: se vocês voltarem para ele
  rationale: Mantém tanto a condição expressa por אִם quanto a repetição retórica de שׁוּב presente no início e no fim do versículo.
theological_decisions:
- issue: Sentido de arrependimento em שׁוּב
  choice: voltarem para Yahweh / voltarem para ele
  alternative: se converterem a Yahweh / se converterem a ele
  rationale: “Voltar” preserva a metáfora concreta e repetida do hebraico, comunicando restauração da relação de aliança sem importar terminologia teológica posterior.
- issue: Relação entre o retorno do povo e a misericórdia divina
  choice: manter “quando” na primeira oração e “se” na oração final
  alternative: uniformizar ambas as orações como condicionais com “se”
  rationale: A tradução conserva a diferença formal entre בְּשׁוּבְכֶם e אִם תָּשׁוּבוּ, sem eliminar a tensão entre a expectativa do chamado inicial e a condição declarada no encerramento.
- issue: Termos familiares marcados pelo masculino
  choice: seus irmãos e seus filhos
  alternative: seus parentes e seus filhos / seus irmãos e seus descendentes
  rationale: O texto emprega substantivos masculinos específicos; mantê-los evita neutralizar ou ampliar o referente sem indicação textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas correntes no Brasil. Emprega “vocês” de modo consistente, conserva o nome Yahweh e mantém a imagem bíblica do rosto divino. A ordem das orações segue de perto o hebraico, mas a sintaxe foi ajustada para fluência natural.
