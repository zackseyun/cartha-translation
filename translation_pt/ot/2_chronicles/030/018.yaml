  source_fidelity: 'A tradução preserva os elementos centrais: a grande quantidade de participantes das tribos nomeadas, a falta de purificação ritual, a participação na Páscoa fora da prescrição escrita, a intercessão de Ezequias, o nome Yahweh e a oração que fica sintaticamente suspensa em בְּעַד no fim do versículo. Não se deve acrescentar aqui «por eles», pois o complemento é expresso no versículo seguinte.'
  naturalness: 'A sequência «muitos dentre o povo — grande número de Efraim...» é elíptica e pouco natural em português: «grande número» fica sem determinante e não se encaixa bem como aposição a «muitos». A reformulação com «muitos do povo — um grande número deles de...» conserva a ênfase e torna a frase clara.'
  terminology: «Purificado» comunica adequadamente a purificação ritual; «comeram a Páscoa» mantém a formulação cultual sem inserir «cordeiro»; «faça expiação» preserva o valor de כפר; e «Yahweh» representa consistentemente o Tetragrama. Os nomes Efraim, Manassés, Issacar e Zebulom são formas portuguesas correntes.
