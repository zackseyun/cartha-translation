  text: כִּ֣י מַרְבִּ֣ית הָ/עָ֡ם רַ֠בַּת מֵֽ/אֶפְרַ֨יִם וּ/מְנַשֶּׁ֜ה יִשָּׂשכָ֤ר וּ/זְבֻלוּן֙ לֹ֣א הִטֶּהָ֔רוּ כִּֽי אָכְל֥וּ אֶת הַ/פֶּ֖סַח בְּ/לֹ֣א כַ/כָּת֑וּב כִּי֩ הִתְפַּלֵּ֨ל יְחִזְקִיָּ֤הוּ עֲלֵי/הֶם֙ לֵ/אמֹ֔ר יְהוָ֥ה הַ/טּ֖וֹב יְכַפֵּ֥ר בְּעַֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/018.yaml
  text: For a great many of the people[a], many from Ephraim and Manasseh, Issachar and Zebulun, had not purified themselves, yet they ate the Passover otherwise than as it is written. But Hezekiah prayed for them, saying, “May Yahweh, who is good[b], make atonement for them—”
translation:
  language: pt
  text: 'Pois muitos do povo — um grande número deles de Efraim, Manassés, Issacar e Zebulom — não tinham se purificado, mas comeram a Páscoa sem seguir o que estava escrito.[a] Ezequias, porém, orou por eles, dizendo: “Que Yahweh, que é bom, faça expiação em favor de—”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “não conforme o que está escrito”.
    reason: lexical_alternative
  - marker: b
    text: A oração continua no versículo 19; a frase hebraica fica incompleta no fim deste versículo.
    reason: cross_reference
lexical_decisions:
- source_word: מַרְבִּית הָעָם רַבַּת
  choice: muitos dentre o povo — grande número
  rationale: Preserva o sentido partitivo e a ênfase reiterada na grande quantidade, sem afirmar categoricamente que se tratava da maioria absoluta.
- source_word: מֵאֶפְרַיִם וּמְנַשֶּׁה יִשָּׂשכָר וּזְבֻלוּן
  choice: de Efraim e Manassés, de Issacar e Zebulom
  rationale: Emprega as formas portuguesas correntes dos nomes tribais e mantém a sequência hebraica.
- source_word: לֹא הִטֶּהָרוּ
  choice: não tinham se purificado
  rationale: O hitpael expressa ação reflexiva e, no contexto, refere-se à purificação ritual.
- source_word: אָכְלוּ אֶת הַפֶּסַח
  choice: comeram a Páscoa
  rationale: Mantém o objeto explícito do hebraico sem acrescentar 'cordeiro'; aqui, Páscoa pode designar a refeição ou a oferta pascal.
- source_word: בְּלֹא כַכָּתוּב
  choice: sem seguir o que estava escrito
  rationale: Expressa em português natural que o ato não estava de acordo com a prescrição escrita, preservando a referência ao texto normativo.
- source_word: הִתְפַּלֵּל ... עֲלֵיהֶם
  choice: orou por eles
  rationale: Traduz diretamente a oração feita em favor das pessoas que não haviam se purificado.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הַטּוֹב
  choice: que é bom
  rationale: Representa o adjetivo substantivado ou apositivo em português claro, sem transformá-lo em título.
- source_word: יְכַפֵּר
  choice: faça expiação
  rationale: Conserva a linguagem cultual de כפר apropriada ao contexto de Páscoa e purificação; 'perdoe' seria mais interpretativo.
- source_word: בְּעַד
  choice: em favor de—
  rationale: O versículo termina com a preposição e deixa seu complemento para o versículo 19. A formulação e o travessão preservam essa estrutura incompleta, sem inserir um pronome ausente no hebraico deste versículo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto traz o nome pessoal divino. A transliteração preserva essa distinção e evita substituí-lo por um título.
- issue: Sentido cultual de כפר
  choice: faça expiação
  alternative: perdoe; cubra
  rationale: O contexto imediato envolve impureza ritual e participação na Páscoa. 'Faça expiação' mantém a textura cultual sem definir além do que o verbo afirma.
- issue: Complemento de בְּעַד no fim do versículo
  choice: deixar a oração sintaticamente incompleta
  alternative: acrescentar 'por eles' ou 'por todos'
  rationale: No Texto Massorético, בְּעַד encerra o versículo sem complemento expresso; este vem no versículo 19. Não se acrescenta aqui um referente que o hebraico deixa suspenso.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas nominais familiares ao leitor brasileiro. Os travessões internos esclarecem a expressão apositiva sobre as tribos; o travessão final reproduz a continuação sintática no versículo seguinte.
