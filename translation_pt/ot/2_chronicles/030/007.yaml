base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/007.yaml
  text: Do not be like your fathers and like your brothers[a], who were unfaithful to Yahweh, the God of their fathers, and he made them a desolation, as you see.
translation:
  language: pt
  text: Não sejam como seus pais nem como seus irmãos, que foram infiéis a Yahweh, o Deus de seus pais; ele fez deles uma desolação[a], como vocês estão vendo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um objeto de horror” ou “de espanto”. O termo hebraico pode indicar tanto a devastação quanto o espetáculo aterrador que ela produz.
    reason: alternativa lexical
lexical_decisions:
- source_word: וְאַל תִּהְיוּ
  choice: Não sejam
  rationale: אַל com o imperfeito expressa uma proibição. “Não sejam” é natural em português e mantém o sentido estativo exigido pela comparação.
- source_word: כַאֲבוֹתֵיכֶם וְכַאֲחֵיכֶם
  choice: como seus pais nem como seus irmãos
  rationale: “Pais” preserva a linguagem familiar e histórica de אָבוֹת, enquanto “irmãos” mantém a solidariedade familiar e pactual de אָח. Depois de uma oração negativa, “nem” expressa naturalmente em português a coordenação hebraica com וְ.
- source_word: מָעֲלוּ בַּיהוָה
  choice: foram infiéis a Yahweh
  rationale: מעל, neste contexto pactual, indica quebra de fidelidade. “Foram infiéis a” comunica claramente essa ideia sem recorrer a terminologia técnica.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: o Deus de seus pais
  rationale: Mantém de modo direto a fórmula pactual e retoma a referência anterior aos pais.
- source_word: וַיִּתְּנֵם לְשַׁמָּה
  choice: ele os entregou à desolação
  rationale: נתן com לְשַׁמָּה indica que Deus os pôs ou entregou a essa condição. “Desolação” preserva o aspecto de devastação, enquanto a nota registra a possível dimensão de horror ou espanto causada pelo espetáculo.
- source_word: כַאֲשֶׁר אַתֶּם רֹאִים
  choice: como vocês estão vendo
  rationale: Expressa a realidade presente e observável evocada pelo particípio hebraico, em linguagem corrente e clara.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pactual e evita substituí-lo por um título.
- issue: Relação entre a infidelidade e a ação divina subsequente
  choice: 'oração coordenada: “ele os entregou”'
  alternative: “por isso ele os entregou” ou “de modo que ele os entregou”
  rationale: A sequência hebraica apresenta os acontecimentos por coordenação. A tradução evita acrescentar explicitamente uma relação lógica de finalidade ou resultado, embora o contexto permita perceber a conexão.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para legibilidade brasileira e compreensão internacional. A formulação conserva a retórica familiar e pactual do hebraico sem acrescentar explicações confessionais.
