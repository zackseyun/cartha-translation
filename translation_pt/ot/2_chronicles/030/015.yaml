source:
  edition: WLC
  text: וַ/יִּשְׁחֲט֣וּ הַ/פֶּ֔סַח בְּ/אַרְבָּעָ֥ה עָשָׂ֖ר לַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֑י וְ/הַ/כֹּהֲנִ֨ים וְ/הַ/לְוִיִּ֤ם נִכְלְמוּ֙ וַ/יִּֽתְקַדְּשׁ֔וּ וַ/יָּבִ֥יאוּ עֹל֖וֹת בֵּ֥ית יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/015.yaml
  text: And they slaughtered the Passover lamb on the fourteenth day of the second month. Then the priests and the Levites were ashamed and consecrated themselves[a], and they brought burnt offerings to the house of Yahweh.
translation:
  language: pt
  text: Abateram o cordeiro da Páscoa[a] no décimo quarto dia do segundo mês. Então os sacerdotes e os levitas sentiram vergonha, consagraram-se e levaram holocaustos à casa de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a Páscoa”; aqui, a expressão se refere à vítima pascal, isto é, ao cordeiro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: Abateram
  rationale: שׁחט designa o abate de um animal, especialmente em contexto sacrificial. “Abateram” preserva o sentido ritual sem acrescentar ao verbo a ideia mais específica de oferecer o sacrifício.
- source_word: הַפֶּסַח
  choice: o cordeiro da Páscoa[a]
  rationale: Neste contexto, “a Páscoa” designa por metonímia a vítima pascal que foi abatida. A explicitação torna o referente claro em português, enquanto a nota conserva a forma literal e a amplitude do hebraico.
- source_word: בְּאַרְבָּעָה עָשָׂר לַחֹדֶשׁ הַשֵּׁנִי
  choice: no décimo quarto dia do segundo mês
  rationale: Expressão cronológica natural em português; “dia” está implícito na formulação hebraica.
- source_word: נִכְלְמוּ
  choice: sentiram vergonha
  rationale: O nifal de כלם expressa vergonha ou humilhação. “Sentiram vergonha” é corrente e comunica aqui a reação interior dos sacerdotes e levitas sem especificar indevidamente sua causa.
- source_word: וַיִּתְקַדְּשׁוּ
  choice: consagraram-se
  rationale: A forma reflexiva de קדשׁ refere-se à preparação ou consagração ritual deles para o serviço sagrado.
- source_word: וַיָּבִיאוּ עֹלוֹת
  choice: levaram holocaustos
  rationale: עֹלוֹת são ofertas inteiramente queimadas. “Holocaustos” é o termo bíblico português tradicional e ainda inteligível para essa categoria sacrificial.
- source_word: בֵּית יְהוָה
  choice: à casa de Yahweh
  rationale: Mantém a designação formal “casa de Yahweh”, em vez de substituí-la interpretativamente por “templo”, e representa o nome divino expresso no texto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz explicitamente o Tetragrama. “Yahweh” representa o nome pessoal divino e evita convertê-lo em um título, sem importar uma formulação denominacional.
- issue: Natureza da vergonha dos sacerdotes e levitas
  choice: sentiram vergonha
  alternative: foram humilhados
  rationale: A forma hebraica pode envolver vergonha sentida ou humilhação. O contexto favorece a vergonha que conduz à consagração, mas a tradução não declara uma causa que o versículo não explicita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Preservam-se os termos cultuais “consagraram-se”, “holocaustos” e “casa de Yahweh”; a sintaxe narrativa é direta e evita arcaísmos.
