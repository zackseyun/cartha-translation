  text: The matter seemed right in the eyes of the king and in the eyes of all the assembly[a].
translation:
  language: pt
  text: A decisão pareceu correta aos olhos do rei e de toda a assembleia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A decisão foi considerada correta pelo rei e por toda a assembleia.”'
    reason: Alternativa lexical e idiomática para וַיִּישַׁר ... בְּעֵינֵי, explicitando que se trata da avaliação dos participantes.
lexical_decisions:
- source_word: וַיִּישַׁר
  choice: pareceu correta
  rationale: O verbo ישר no wayyiqtol, construído com “aos olhos de”, indica que a questão foi considerada correta ou apropriada. “Pareceu correta” conserva a nuance avaliativa sem afirmar de modo absoluto que a decisão era objetivamente correta.
- source_word: הַדָּבָר
  choice: a decisão
  rationale: דבר pode significar palavra, coisa, questão ou assunto. No contexto, refere-se à decisão tomada pelo rei, pelos líderes e pela assembleia sobre quando celebrar a Páscoa; “a decisão” explicita naturalmente esse referente.
- source_word: בְּעֵינֵי
  choice: aos olhos de
  rationale: Mantém a imagem do idioma hebraico de avaliação ou julgamento e é uma expressão clara em português.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Tradução direta do substantivo definido.
- source_word: וּבְעֵינֵי
  choice: e de
  rationale: A coordenação portuguesa permite que “aos olhos” governe os dois complementos sem repetição pesada, preservando o paralelismo semântico.
- source_word: כָּל
  choice: toda
  rationale: Expressa a abrangência completa do grupo reunido e concorda naturalmente com “assembleia”.
- source_word: הַקָּהָל
  choice: a assembleia
  rationale: קהל designa a comunidade reunida. “Assembleia” é atual, clara e evita uma conotação eclesiástica indevida.
theological_decisions:
- issue: Caráter da aprovação expressa por וַיִּישַׁר בְּעֵינֵי
  choice: pareceu correta aos olhos de
  alternative: foi correta aos olhos de
  rationale: A formulação escolhida conserva a perspectiva avaliativa do rei e da assembleia, sem transformar a aprovação humana em uma declaração explícita de correção divina ou objetiva.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A imagem hebraica “aos olhos de” foi preservada, enquanto a segunda ocorrência foi elidida de forma natural em português.
