base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/025.yaml
  text: And all the assembly of Judah rejoiced[a], along with the priests and the Levites, and all the assembly who had come from Israel, and the sojourners who had come from the land of Israel, and those living in Judah.
translation:
  language: pt
  text: Toda a assembleia de Judá se alegrou, juntamente com os sacerdotes e os levitas, bem como toda a assembleia dos que tinham vindo de Israel, os estrangeiros residentes[a] que tinham vindo da terra de Israel e os que moravam em Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «residentes estrangeiros» ou «forasteiros». O hebraico גֵּרִים se refere a pessoas não nativas que viviam como residentes no meio de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: se alegrou
  rationale: O verbo שׂמח expressa alegria. A concordância no singular com o coletivo «toda a assembleia» é natural em português e preserva o sentido verbal sem especificar uma forma de celebração.
- source_word: כָּל קְהַל יְהוּדָה
  choice: toda a assembleia de Judá
  rationale: קהל designa a comunidade reunida. «Assembleia» evita uma conotação eclesiástica posterior e reflete bem o contexto de um povo reunido.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Equivalente português padrão de כֹּהֲנִים.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: Equivalente português padrão, mantendo os levitas como grupo distinto dos sacerdotes.
- source_word: כָל הַקָּהָל הַבָּאִים מִיִּשְׂרָאֵל
  choice: toda a assembleia dos que tinham vindo de Israel
  rationale: A oração relativa reproduz o valor identificador do particípio הַבָּאִים; «tinham vindo» se ajusta naturalmente ao contexto narrativo passado.
- source_word: הַגֵּרִים
  choice: os estrangeiros residentes
  rationale: גֵּרִים designa pessoas não nativas que residiam entre a população local. «Estrangeiros residentes» comunica com clareza moderna tanto a origem externa quanto a residência estável; a alternativa tradicional é preservada em nota.
- source_word: הַבָּאִים מֵאֶרֶץ יִשְׂרָאֵל
  choice: que tinham vindo da terra de Israel
  rationale: A expressão mantém a referência geográfica explícita de אֶרֶץ יִשְׂרָאֵל e distingue sua procedência de Judá.
- source_word: הַיּוֹשְׁבִים בִּיהוּדָה
  choice: os que moravam em Judá
  rationale: O particípio de ישׁב indica residência. «Moravam» é atual, claro e adequado ao contexto narrativo.
