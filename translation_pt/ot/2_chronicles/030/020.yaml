  text: And Yahweh listened to Hezekiah and healed the people[a][b].
translation:
  language: pt
  text: E Yahweh deu ouvidos a Ezequias[a] e curou o povo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ouviu Ezequias”. O verbo hebraico pode significar “ouvir” ou, nesta construção, “escutar e responder favoravelmente”.'
    reason: lexical_alternative
  - marker: b
    text: “Curou” pode se referir à remoção, por Yahweh, de uma aflição ou de um juízo relacionado à condição ritual imprópria do povo, e não necessariamente apenas à cura de uma doença física.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ouviu favoravelmente
  rationale: 'Com אֶל e no contexto da oração de Ezequias (vv. 18–19), שׁמע indica mais que percepção auditiva: comunica que Yahweh deu ouvidos à oração e respondeu de modo favorável, sem explicitar além do hebraico como se deu essa resposta.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל יְחִזְקִיָּהוּ
  choice: Ezequias
  rationale: Na construção portuguesa escolhida, 'ouviu favoravelmente Ezequias' expressa de forma natural o sentido de escutar e atender; Ezequias segue a forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַיִּרְפָּא
  choice: curou
  rationale: Preserva a imagem direta de רפא, sem reduzi-la a perdão, livramento ou restauração, embora o contexto permita que a cura envolva a remoção de aflição ou juízo.
- source_word: הָעָם
  choice: o povo
  rationale: Equivalente corrente e abrangente para a comunidade israelita reunida.
theological_decisions:
- issue: Natureza da ação divina descrita por וַיִּרְפָּא
  choice: Manter 'curou' sem limitar a ação à cura física.
  alternative: Perdoou, poupou ou restaurou o povo.
  rationale: O contexto trata da participação na Páscoa sem a devida purificação ritual e da oração de Ezequias por perdão, mas o texto emprega o verbo 'curar'. A tradução conserva essa tensão e não especifica uma modalidade que o versículo não explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação concisa acompanha a estrutura hebraica; 'ouviu favoravelmente' evita o sentido meramente auditivo, e as notas preservam as alternativas lexicais e a amplitude teológica de 'curou'.
