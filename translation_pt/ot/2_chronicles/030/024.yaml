  text: כִּ֣י חִזְקִיָּ֣הוּ מֶֽלֶךְ יְ֠הוּדָה הֵרִ֨ים לַ/קָּהָ֜ל אֶ֣לֶף פָּרִים֮ וְ/שִׁבְעַ֣ת אֲלָפִ֣ים צֹאן֒ וְ/הַ/שָּׂרִ֞ים הֵרִ֤ימוּ לַ/קָּהָל֙ פָּרִ֣ים אֶ֔לֶף וְ/צֹ֖אן עֲשֶׂ֣רֶת אֲלָפִ֑ים וַ/יִּֽתְקַדְּשׁ֥וּ כֹהֲנִ֖ים לָ/רֹֽב־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/024.yaml
  text: For Hezekiah king of Judah gave to the assembly one thousand bulls and seven thousand sheep[a], and the officials gave to the assembly one thousand bulls and ten thousand sheep[b]; and priests consecrated themselves in great numbers.
translation:
  language: pt
  text: Pois Ezequias, rei de Judá, deu à assembleia mil novilhos e sete mil animais do rebanho[a], e os líderes deram à assembleia mil novilhos e dez mil animais do rebanho; e muitos sacerdotes se consagraram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para a assembleia”; neste contexto, a preposição hebraica pode indicar tanto o destinatário como o benefício da provisão.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação do que foi narrado anteriormente e preserva de modo natural a conexão causal ou explicativa.
- source_word: הֵרִים / הֵרִימוּ
  choice: deu / deram
  rationale: O hifil de רום indica aqui a disponibilização de animais para o culto comunitário. “Dar” é natural e não especifica além do texto a forma ritual da contribuição.
- source_word: לַקָּהָל
  choice: à assembleia
  rationale: קהל designa a comunidade reunida. A preposição ל pode indicar destinação ou benefício; “à assembleia” preserva a construção mais direta, enquanto a alternativa é registrada em nota.
- source_word: פָּרִים
  choice: novilhos
  rationale: O termo designa bovinos machos empregados em sacrifícios. “Novilhos” é uma designação corrente e digna nesse contexto cultual.
- source_word: צֹאן
  choice: animais do rebanho
  rationale: O substantivo coletivo abrange animais de pequeno porte do rebanho, especialmente ovelhas e cabras. A formulação evita restringir indevidamente o referente apenas a ovelhas.
- source_word: הַשָּׂרִים
  choice: os líderes
  rationale: שׂרים refere-se a pessoas de alta posição e autoridade. “Líderes” é claro e não sugere necessariamente nobreza hereditária.
- source_word: וַיִּתְקַדְּשׁוּ כֹהֲנִים לָרֹב
  choice: e muitos sacerdotes se consagraram
  rationale: A forma reflexiva de קדשׁ expressa que os sacerdotes se prepararam ritualmente para o serviço; לָרֹב indica seu grande número. A ordem portuguesa comunica isso com naturalidade.
theological_decisions:
- issue: Natureza da consagração sacerdotal
  choice: se consagraram
  alternative: se purificaram
  rationale: O verbo קדשׁ enfatiza tornar-se santo ou separado para o serviço cultual. “Purificaram-se” pode fazer parte do processo, mas estreitaria o sentido sem necessidade.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa fluente. “Animais do rebanho” mantém a abrangência lexical de צֹאן; “líderes” evita a possível leitura hereditária de “príncipes”.
