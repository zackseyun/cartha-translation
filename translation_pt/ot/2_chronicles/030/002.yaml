base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/002.yaml
  text: Then the king and his officials and all the assembly in Jerusalem decided to keep the Passover in the second month[a].
translation:
  language: pt
  text: Então o rei, seus oficiais e toda a assembleia em Jerusalém decidiram celebrar a Páscoa no segundo mês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “fazer a Páscoa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: decidiram
  rationale: O nifal de יעץ indica aqui uma deliberação conjunta que resultou numa decisão. O plural em português concorda naturalmente com os participantes enumerados, embora o verbo hebraico esteja no singular antes do sujeito composto.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Tradução direta do substantivo definido; o contexto identifica Ezequias, mas o hebraico mantém o título.
- source_word: וְשָׂרָיו
  choice: seus oficiais
  rationale: שָׂרִים designa dirigentes ou altos funcionários. “Oficiais” é atual e evita sugerir, com “príncipes”, que fossem filhos do rei.
- source_word: וְכָל הַקָּהָל
  choice: e toda a assembleia
  rationale: קָהָל refere-se à comunidade reunida. “Assembleia” preserva o sentido coletivo sem acrescentar uma conotação eclesiástica posterior.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: Tradução locativa direta do nome do lugar.
- source_word: לַעֲשׂוֹת הַפֶּסַח
  choice: celebrar a Páscoa
  rationale: A expressão significa literalmente “fazer a Páscoa”, isto é, realizar sua observância. “Celebrar a Páscoa” é natural no português moderno e mantém o caráter festivo e ritual.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: no segundo mês
  rationale: Tradução temporal direta; a relevância desse mês em contraste com a data habitual emerge do contexto, sem precisar ser inserida no versículo.
theological_decisions:
- issue: Tradução do idioma referente à observância da Páscoa sem acrescentar explicação interpretativa
  choice: celebrar a Páscoa
  alternative: observar a Páscoa; realizar a Páscoa
  rationale: O idioma hebraico descreve a realização da observância pascal. “Celebrar” é claro e corrente em português, sem especificar além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada com pontuação mínima para fluência, e o sentido de deliberação coletiva foi expresso pelo plural “decidiram”.
