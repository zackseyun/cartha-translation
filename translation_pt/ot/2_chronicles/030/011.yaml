  text: אַךְ אֲנָשִׁ֛ים מֵ/אָשֵׁ֥ר וּ/מְנַשֶּׁ֖ה וּ/מִ/זְּבֻל֑וּן נִֽכְנְע֔וּ וַ/יָּבֹ֖אוּ לִ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/011.yaml
  text: Nevertheless, some men from Asher, Manasseh, and Zebulun humbled themselves and came to Jerusalem.
translation:
  language: pt
  text: Contudo, alguns homens de Aser, Manassés e Zebulom se humilharam e vieram a Jerusalém.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: Contudo
  rationale: Neste contexto, a partícula marca contraste com a rejeição relatada no versículo anterior; “Contudo” expressa de modo natural essa oposição concessiva.
- source_word: אֲנָשִׁים
  choice: alguns homens
  rationale: O substantivo masculino plural designa, no contexto, uma parte dos indivíduos das tribos mencionadas; “alguns homens” preserva tanto a indefinição quanto a forma masculina.
- source_word: מֵאָשֵׁר וּמְנַשֶּׁה וּמִזְּבֻלוּן
  choice: de Aser, Manassés e Zebulom
  rationale: As preposições indicam origem entre essas tribos ou em seus territórios; as formas dos nomes seguem o uso bíblico corrente em português.
- source_word: נִכְנְעוּ
  choice: se humilharam
  rationale: O nifal de כנע pode exprimir humilhar-se ou tornar-se submisso. Aqui, a ação voluntária seguida da ida a Jerusalém favorece a formulação reflexiva.
- source_word: וַיָּבֹאוּ
  choice: e foram
  rationale: Embora בוא signifique literalmente “vir/entrar”, em português a deslocação dos homens de suas regiões até Jerusalém é expressa com mais naturalidade por “foram”, sem alterar o sentido narrativo.
- source_word: לִירוּשָׁלִָם
  choice: a Jerusalém
  rationale: A preposição direcional לְ é traduzida naturalmente por “a” com o verbo de movimento.
