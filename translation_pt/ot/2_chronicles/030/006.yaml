    issue: “restou de vocês” para הַנִּשְׁאֶרֶת לָכֶם
    rationale: A construção não é natural e representa mal o dativo de posse/relação em לָכֶם. “Ainda lhes resta” comunica de forma clara que esse grupo sobrevivente permanece para a comunidade destinatária.
  - severity: low
    issue: Vinculação pouco clara de “da mão dos reis da Assíria”
    rationale: No hebraico, a expressão descreve o escape/sobrevivência em relação ao poder dos reis assírios. Posicioná-la junto de “escapou” torna essa relação explícita sem eliminar a concisão do original.
