  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֵּלְכוּ֩ הָ/רָצִ֨ים בָּֽ/אִגְּר֜וֹת מִ/יַּ֧ד הַ/מֶּ֣לֶךְ וְ/שָׂרָ֗י/ו בְּ/כָל יִשְׂרָאֵל֙ וִֽ/יהוּדָ֔ה וּ/כְ/מִצְוַ֥ת הַ/מֶּ֖לֶךְ לֵ/אמֹ֑ר בְּנֵ֣י יִשְׂרָאֵ֗ל שׁ֚וּבוּ אֶל יְהוָ֗ה אֱלֹהֵי֙ אַבְרָהָם֙ יִצְחָ֣ק וְ/יִשְׂרָאֵ֔ל וְ/יָשֹׁב֙ אֶל הַ/פְּלֵיטָ֔ה הַ/נִּשְׁאֶ֣רֶת לָ/כֶ֔ם מִ/כַּ֖ף מַלְכֵ֥י אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/006.yaml
  text: So the couriers went with the letters from the hand of the king and his officials throughout all Israel and Judah[a], according to the command of the king, saying, “Sons of Israel, return to Yahweh, the God of Abraham, Isaac, and Israel[b], that he may return to the remnant that has escaped and remains to you from the hand of the kings of Assyria.”
translation:
  language: pt
  text: 'Assim, os mensageiros percorreram todo Israel e Judá com cartas da parte do rei e de seus oficiais, conforme a ordem do rei, dizendo: “Filhos de Israel, voltem para Yahweh, o Deus de Abraão, Isaque e Israel[a], para que ele volte para o remanescente que escapou da mão dos reis da Assíria e ainda lhes resta[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico diz “Israel”, e não o nome mais familiar nesta fórmula, “Jacó”.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “o remanescente que escapou e que ainda está entre vocês”.'
    reason: ambiguity
lexical_decisions:
- source_word: הָרָצִים
  choice: os mensageiros
  rationale: Embora o termo designe literalmente ‘corredores’, no contexto administrativo eram portadores de correspondência real. ‘Mensageiros’ é claro e natural em português.
- source_word: בָּאִגְּרוֹת מִיַּד הַמֶּלֶךְ וְשָׂרָיו
  choice: levando as cartas da parte do rei e de seus oficiais
  rationale: Expressa de modo natural tanto o transporte das cartas quanto sua origem e autorização reais; שׂרים designa aqui oficiais da corte.
- source_word: בְּכָל יִשְׂרָאֵל וִיהוּדָה
  choice: percorreram todo o Israel e Judá
  rationale: O verbo de movimento e a extensão territorial tornam ‘percorreram’ mais natural do que uma formulação meramente locativa.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Filhos de Israel
  rationale: Mantém a forma masculina plural e a designação histórica do povo presentes no hebraico.
- source_word: שׁוּבוּ אֶל יְהוָה
  choice: voltem para Yahweh
  rationale: Preserva o movimento de retorno, inclusive sua dimensão pactual, e permite a correspondência verbal com o retorno divino na oração seguinte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל
  choice: o Deus de Abraão, Isaque e Israel
  rationale: Segue o texto hebraico, que traz ‘Israel’, sem harmonizá-lo com a fórmula mais conhecida que usa ‘Jacó’.
- source_word: וְיָשֹׁב
  choice: para que ele volte
  rationale: Representa a relação provável de propósito ou resultado após o imperativo e conserva a reciprocidade do verbo שׁוב.
- source_word: הַפְּלֵיטָה הַנִּשְׁאֶרֶת לָכֶם
  choice: o remanescente que escapou e restou de vocês
  rationale: Conserva as duas noções hebraicas, escape e permanência, enquanto entende לָכֶם como relação com a comunidade destinatária; a ambiguidade da preposição é registrada em nota.
- source_word: מִכַּף מַלְכֵי אַשּׁוּר
  choice: da mão dos reis da Assíria
  rationale: Mantém a imagem hebraica da ‘mão’ como poder ou domínio e conserva o plural ‘reis’.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico apresenta diretamente o Tetragrama; a transliteração preserva o nome pessoal e pactual.
- issue: Nome do terceiro patriarca na fórmula
  choice: Israel
  alternative: Jacó
  rationale: O texto massorético lê explicitamente יִשְׂרָאֵל; não se harmoniza com a fórmula tradicional ‘Abraão, Isaque e Jacó’.
- issue: Força de וְיָשֹׁב depois do imperativo
  choice: para que ele volte
  alternative: e ele voltará
  rationale: A forma pode exprimir propósito ou resultado, sem formular uma garantia automática; a tradução preserva essa tensão.
- issue: Relação de לָכֶם com o remanescente
  choice: restou de vocês
  alternative: restou para vocês
  rationale: A preposição admite mais de uma relação contextual. A leitura principal entende os sobreviventes como parte remanescente da comunidade, mas a alternativa é mantida em nota.
translation_notes:
  register: Português atual, digno e de leitura ampla, com boa legibilidade brasileira. A ordem hebraica foi reorganizada moderadamente para evitar uma frase pesada. ‘Mensageiros’ comunica a função dos corredores reais; ‘Filhos de Israel’ e ‘da mão’ preservam imagens relevantes do original.
