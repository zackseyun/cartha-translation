revisions:
- from: 'Assim, os mensageiros percorreram todo o Israel e Judá levando as cartas da parte do rei e de seus oficiais, conforme a ordem do rei, e diziam: “Filhos de Israel, voltem para Yahweh, o Deus de Abraão, Isaque e Israel[a], para que ele volte para o remanescente que escapou e restou de vocês da mão dos reis da Assíria[b].”'
  to: 'Assim, os mensageiros percorreram todo Israel e Judá com cartas da parte do rei e de seus oficiais, conforme a ordem do rei, dizendo: “Filhos de Israel, voltem para Yahweh, o Deus de Abraão, Isaque e Israel[a], para que ele volte para o remanescente que escapou da mão dos reis da Assíria e ainda lhes resta[b].”'
  rationale: A revisão substitui a formulação pouco idiomática “restou de vocês” por “ainda lhes resta” e associa “da mão dos reis da Assíria” diretamente ao escape. Assim, preserva-se a dupla ideia de sobrevivência/escape (פְּלֵיטָה) e de permanência (נִשְׁאֶרֶת), bem como a relação indicada por לָכֶם. As notas permanecem ancoradas nos pontos textualmente pertinentes.
