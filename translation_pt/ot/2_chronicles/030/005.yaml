  text: וַ/יַּֽעֲמִ֣ידוּ דָבָ֗ר לְ/הַעֲבִ֨יר ק֤וֹל בְּ/כָל יִשְׂרָאֵל֙ מִ/בְּאֵֽר שֶׁ֣בַע וְ/עַד דָּ֔ן לָ/ב֞וֹא לַ/עֲשׂ֥וֹת פֶּ֛סַח לַ/יהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל בִּ/ירוּשָׁלִָ֑ם כִּ֣י לֹ֥א לָ/רֹ֛ב עָשׂ֖וּ כַּ/כָּתֽוּב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/005.yaml
  text: So they established a decree to send a proclamation throughout all Israel[a], from Beersheba to Dan, that they should come to keep the Passover to Yahweh, the God of Israel, at Jerusalem; for they had not kept it in great numbers as it is written.
translation:
  language: pt
  text: Então, tomaram a decisão de fazer circular uma proclamação por todo Israel, desde Berseba até Dã, para que viessem a Jerusalém celebrar a Páscoa para Yahweh, o Deus de Israel, pois não a haviam celebrado em grande número, conforme está escrito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico desta frase é conciso. Também pode ser traduzido: “pois não muitos a haviam celebrado conforme o que está escrito”. A expressão pode enfatizar o pequeno número de participantes ou a falta de uma celebração amplamente realizada segundo a prescrição escrita. Algumas traduções antigas entendem a frase em sentido temporal: “havia muito tempo não a celebravam conforme está escrito”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמִידוּ דָבָר
  choice: tomaram a decisão
  rationale: O idioma significa literalmente “fizeram uma questão ficar de pé” e, neste contexto administrativo, indica que estabeleceram formalmente uma decisão. A formulação portuguesa é natural e mantém o caráter deliberativo e oficial.
- source_word: לְהַעֲבִיר קוֹל
  choice: fazer circular uma proclamação
  rationale: A expressão literal, “fazer passar uma voz”, refere-se à divulgação pública de um anúncio. “Fazer circular uma proclamação” comunica tanto a ampla difusão quanto o caráter oficial.
- source_word: בְּכָל יִשְׂרָאֵל
  choice: por todo o Israel
  rationale: A preposição e o contexto indicam que a proclamação seria difundida em toda a extensão de Israel.
- source_word: מִבְּאֵר שֶׁבַע וְעַד דָּן
  choice: desde Berseba até Dã
  rationale: Mantém o merismo geográfico tradicional, que abrange a terra do extremo sul ao extremo norte.
- source_word: לָבוֹא לַעֲשׂוֹת פֶּסַח
  choice: para que viessem ... celebrar a Páscoa
  rationale: Os infinitivos exprimem a finalidade e o conteúdo da convocação. Em português, “celebrar a Páscoa” é a maneira idiomática de expressar a observância da festa.
- source_word: לַיהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: a Yahweh, o Deus de Israel
  rationale: Preserva o nome divino expresso pelo Tetragrama e traduz diretamente a construção “Deus de Israel”.
- source_word: בִּירוּשָׁלִָם
  choice: a Jerusalém
  rationale: Com o verbo de movimento “vir”, “a Jerusalém” expressa naturalmente o destino da convocação.
- source_word: כִּי לֹא לָרֹב עָשׂוּ כַּכָּתוּב
  choice: pois não a haviam celebrado em grande número, conforme está escrito
  rationale: לָרֹב tem sentido primariamente quantitativo, relacionado a multidão ou abundância. A tradução conserva tanto a referência ao baixo número de participantes quanto a norma escrita, sem adotar o sentido temporal menos direto de “havia muito tempo”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pactual em vez de substituí-lo por um título.
- issue: Relação entre a pouca participação e a conformidade com a prescrição escrita
  choice: não a haviam celebrado em grande número, conforme está escrito
  alternative: não muitos a haviam celebrado conforme o que está escrito; havia muito tempo não a celebravam conforme está escrito
  rationale: A cláusula hebraica é comprimida. O valor quantitativo de לָרֹב é lexicalmente mais provável, mas a sintaxe permite diferentes ênfases quanto ao número dos participantes e à conformidade da celebração com a prescrição escrita; por isso, a ambiguidade é registrada em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Tomaram a decisão” e “fazer circular uma proclamação” evitam literalismos obscuros sem eliminar o caráter oficial da ação. A ordem “viessem a Jerusalém celebrar” soa natural e preserva Jerusalém como destino do culto.
