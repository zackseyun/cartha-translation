  naturalness: “Celebrar a Páscoa a Yahweh” é pouco natural no português atual, sobretudo para leitores brasileiros, pois o complemento introduzido por “a” pode soar como objeto indireto inadequado de “celebrar”. “Celebrar a Páscoa para Yahweh” preserva a orientação indicada por לְ e é mais fluente. “Por todo Israel” também é uma formulação geográfica mais idiomática do que “por todo o Israel”, sem mudança de sentido.
  terminology: “Yahweh”, “Páscoa”, “Deus de Israel”, “Berseba” e “Dã” estão apropriados. A nota apresenta de modo responsável a dificuldade de כִּי לֹא לָרֹב עָשׂוּ כַּכָּתוּב, sem impor a leitura temporal como sentido principal.
