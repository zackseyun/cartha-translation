  text: וַ/יִּֽהְי֨וּ הָ/רָצִ֜ים עֹבְרִ֨ים מֵ/עִ֧יר לָ/עִ֛יר בְּ/אֶֽרֶץ אֶפְרַ֥יִם וּ/מְנַשֶּׁ֖ה וְ/עַד זְבֻל֑וּן וַ/יִּֽהְיוּ֙ מַשְׂחִיקִ֣ים עֲלֵי/הֶ֔ם וּ/מַלְעִגִ֖ים בָּֽ/ם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/010.yaml
  text: So the couriers went from city to city in the land of Ephraim and Manasseh[a], as far as Zebulun[b]; but they were laughing at them and mocking them.
translation:
  language: pt
  text: Assim, os mensageiros foram de cidade em cidade pela terra de Efraim e Manassés, até Zebulom; mas o povo ria deles e zombava deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרָצִים
  choice: os mensageiros
  rationale: O particípio substantivado da raiz רוץ, literalmente ligado a correr, designa aqui enviados que levavam rapidamente uma mensagem oficial. “Mensageiros” é claro e natural em português; “corredores” poderia sugerir atletas.
- source_word: עֹבְרִים
  choice: foram
  rationale: Embora o termo signifique literalmente “passavam” ou “percorriam”, no contexto descreve o deslocamento dos mensageiros entre as cidades. “Foram” comunica isso com naturalidade.
- source_word: מֵעִיר לָעִיר
  choice: de cidade em cidade
  rationale: Preserva de modo idiomático o sentido distributivo da expressão hebraica.
- source_word: בְּאֶרֶץ אֶפְרַיִם וּמְנַשֶּׁה וְעַד זְבֻלוּן
  choice: pela terra de Efraim e Manassés, até Zebulom
  rationale: “Pela terra” exprime o percurso dentro da região, enquanto “até Zebulom” representa claramente o limite geográfico indicado por וְעַד.
- source_word: מַשְׂחִיקִים עֲלֵיהֶם
  choice: ria deles
  rationale: A forma causativa de שׂחק, com a preposição, denota riso depreciativo, não mera alegria. “Ria deles” preserva o caráter contínuo da reação e é natural em português.
- source_word: וּמַלְעִגִים בָּם
  choice: zombava deles
  rationale: לעג comunica escárnio ou zombaria. “Zombava deles” mantém a segunda expressão de desprezo e o paralelismo com “ria deles”.
- source_word: וַיִּהְיוּ ... וַיִּהְיוּ
  choice: Assim ... mas o povo
  rationale: “Assim” dá continuidade à narrativa. “Mas” explicita o contraste contextual entre a missão dos mensageiros e a recepção hostil. O sujeito implícito da segunda oração é expresso como “o povo” para evitar em português a ambiguidade de “eles”, que poderia parecer referir-se aos próprios mensageiros.
theological_decisions: []
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução mantém as duas ações de desprezo e usa o imperfeito (“ria”, “zombava”) para refletir a construção hebraica durativa com היה e particípios. Os nomes seguem as formas portuguesas tradicionais: Efraim, Manassés e Zebulom.'
