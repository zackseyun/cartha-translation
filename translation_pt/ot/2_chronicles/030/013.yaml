base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/013.yaml
  text: A great many people gathered in Jerusalem to keep the Festival of Unleavened Bread in the second month[b][a], a very great assembly.
translation:
  language: pt
  text: Muita gente se reuniu em Jerusalém para celebrar[a] a Festa dos Pães sem Fermento[b], no segundo mês. Era uma assembleia muito numerosa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “observar”; literalmente, “fazer”.
    reason: lexical_alternative
  - marker: b
    text: Também chamada “Festa dos Pães Ázimos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: se reuniu
  rationale: O nifal de אסף indica que as pessoas se juntaram ou foram congregadas. A construção singular concorda naturalmente com o coletivo “muita gente” em português.
- source_word: עַם רָב
  choice: muita gente
  rationale: Expressa de modo natural e claro a ideia quantitativa de um povo numeroso, sem transformar necessariamente o grupo em uma “multidão” desordenada.
- source_word: לַעֲשׂוֹת
  choice: para celebrar
  rationale: Embora o verbo signifique literalmente “fazer”, com uma festa como objeto refere-se idiomaticamente à sua celebração ou observância.
- source_word: חַג הַמַּצּוֹת
  choice: a Festa dos Pães sem Fermento
  rationale: “Festa” comunica o caráter religioso de חַג, e “Pães sem Fermento” é claro para leitores modernos, preservando o sentido de מַצּוֹת.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: no segundo mês
  rationale: Tradução direta que mantém a informação cronológica importante no contexto da celebração adiada.
- source_word: קָהָל לָרֹב מְאֹד
  choice: Era uma assembleia muito numerosa
  rationale: Preserva a retomada enfática do tamanho do grupo. A divisão em uma segunda frase evita uma aposição truncada e soa natural em português.
