revisions:
- from: Então o rei ficou de pé em seu lugar e fez a aliança diante de Yahweh, comprometendo-se a seguir Yahweh e a guardar seus mandamentos, seus testemunhos e seus estatutos de todo o coração e de toda a alma, para cumprir as palavras da aliança escritas neste livro.[a]
  to: Então o rei ficou de pé em seu lugar e firmou a aliança diante de Yahweh, para seguir Yahweh, guardar seus mandamentos, seus testemunhos e seus estatutos de todo o coração e de toda a alma, e cumprir as palavras da aliança escritas neste livro.[a]
  rationale: A revisão conserva o sentido e o registro do rascunho, mas torna explícita a coordenação dos três compromissos expressos pelos infinitivos hebraicos. Também substitui uma expressão pouco idiomática por uma formulação portuguesa natural, sem acrescentar interpretação histórica ou doutrinária.
