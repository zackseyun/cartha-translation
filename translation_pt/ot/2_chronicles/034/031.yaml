  text: וַ/יַּעֲמֹ֨ד הַ/מֶּ֜לֶךְ עַל עָמְד֗/וֹ וַ/יִּכְרֹ֣ת אֶֽת הַ/בְּרִית֮ לִ/פְנֵ֣י יְהוָה֒ לָ/לֶ֜כֶת אַחֲרֵ֣י יְהוָ֗ה וְ/לִ/שְׁמ֤וֹר אֶת מִצְוֺתָי/ו֙ וְ/עֵֽדְוֺתָ֣י/ו וְ/חֻקָּ֔י/ו בְּ/כָל לְבָב֖/וֹ וּ/בְ/כָל נַפְשׁ֑/וֹ לַ/עֲשׂוֹת֙ אֶת דִּבְרֵ֣י הַ/בְּרִ֔ית הַ/כְּתוּבִ֖ים עַל הַ/סֵּ֥פֶר הַ/זֶּֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/031.yaml
  text: Then the king stood in his place and made the covenant before Yahweh[a], to walk after Yahweh and to keep his commandments and his testimonies and his statutes with all his heart and with all his soul, to carry out the words of the covenant that were written in this book.
translation:
  language: pt
  text: Então o rei ficou de pé em seu lugar e firmou a aliança diante de Yahweh, para seguir Yahweh, guardar seus mandamentos, seus testemunhos e seus estatutos de todo o coração e de toda a alma, e cumprir as palavras da aliança escritas neste livro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais histórico, “escritas neste rolo”. A palavra hebraica pode designar um documento escrito em forma de rolo.
    reason: alternativa lexical e contexto histórico de הַסֵּפֶר
lexical_decisions:
- source_word: וַיַּעֲמֹד הַמֶּלֶךְ עַל עָמְדוֹ
  choice: o rei ficou de pé em seu lugar
  rationale: Reproduz o ato de se levantar e entende עַל עָמְדוֹ como o lugar ou posição designada do rei, sem especificar uma estrutura física.
- source_word: וַיִּכְרֹת אֶת־הַבְּרִית
  choice: fez a aliança
  rationale: כרת ברית é o idioma hebraico convencional para estabelecer ou celebrar uma aliança; a forma definida, 'a aliança', foi preservada.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Expressa a ação solene na presença de Yahweh e conserva o nome divino do texto hebraico.
- source_word: לָלֶכֶת אַחֲרֵי יְהוָה
  choice: seguir Yahweh
  rationale: Em português atual, 'seguir' comunica naturalmente o sentido do idioma hebraico 'andar após', isto é, viver em lealdade e obediência.
- source_word: לִשְׁמוֹר
  choice: guardar
  rationale: No contexto da aliança, significa observar fielmente as exigências divinas; 'guardar' mantém o registro bíblico e continua claro em português.
- source_word: מִצְוֺתָיו וְעֵדְוֺתָיו וְחֻקָּיו
  choice: seus mandamentos, seus testemunhos e seus estatutos
  rationale: Mantém distintos os três termos jurídicos e pactuais do hebraico, em vez de reduzi-los a um único conceito.
- source_word: בְּכָל־לְבָבוֹ וּבְכָל־נַפְשׁוֹ
  choice: de todo o coração e de toda a alma
  rationale: Preserva a fórmula deuteronômica e seu peso intertextual, com expressão idiomática em português.
- source_word: לַעֲשׂוֹת אֶת דִּבְרֵי הַבְּרִית
  choice: para cumprir as palavras da aliança
  rationale: '''Cumprir'' comunica a execução obediente requerida por עשה, enquanto ''palavras da aliança'' conserva a formulação concreta do hebraico.'
- source_word: הַסֵּפֶר הַזֶּה
  choice: neste livro
  rationale: ספר pode designar um livro ou documento escrito, frequentemente em forma de rolo no contexto antigo; 'livro' é natural no texto principal.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; 'Yahweh' representa diretamente o nome pactual sem substituí-lo por um título.
- issue: Metáfora pactual em לָלֶכֶת אַחֲרֵי יְהוָה
  choice: seguir Yahweh
  alternative: andar após Yahweh
  rationale: A opção comunica a lealdade pactual de modo natural em português. Embora não reproduza literalmente a metáfora de caminhar, preserva seu sentido sem acrescentar uma interpretação denominacional.
- issue: Força volitiva dos infinitivos após a celebração da aliança
  choice: comprometendo-se a
  alternative: para
  rationale: Os infinitivos expressam o conteúdo ou propósito do compromisso assumido pelo rei. A formulação torna essa relação clara sem tratar as ações como palavras adicionais ausentes do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva o vocabulário pactual tradicional onde ele carrega distinções do hebraico, mas evita construções excessivamente literais ou arcaicas.
