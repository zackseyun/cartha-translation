  text: וּ/בְ/הוֹצִיאָ֣/ם אֶת הַ/כֶּ֔סֶף הַ/מּוּבָ֖א בֵּ֣ית יְהוָ֑ה מָצָא֙ חִלְקִיָּ֣הוּ הַ/כֹּהֵ֔ן אֶת סֵ֥פֶר תּֽוֹרַת יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/014.yaml
  text: And when they brought out the silver that had been brought into the house of Yahweh[a], Hilkiah the priest found the Book of the Law of Yahweh by the hand of Moses.
translation:
  language: pt
  text: Quando retiraram a prata que havia sido levada à casa de Yahweh, o sacerdote Hilquias encontrou o Livro da Lei de Yahweh pela mão de Moisés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “pela mão de Moisés”, expressão que pode significar “por meio de Moisés”.
    reason: Esclarece o sentido idiomático da expressão hebraica sem eliminar sua formulação no texto principal.
lexical_decisions:
- source_word: וּבְהוֹצִיאָם
  choice: Quando retiraram
  rationale: A preposição com o infinitivo construto e o sufixo de terceira pessoa do plural forma uma oração temporal. “Quando retiraram” expressa com naturalidade a ação de fazer sair.
- source_word: הַכֶּסֶף
  choice: a prata
  rationale: כֶּסֶף pode designar prata ou dinheiro. “Prata” preserva o sentido lexical concreto, embora no contexto se trate dos recursos arrecadados para o templo.
- source_word: הַמּוּבָא
  choice: que havia sido levada
  rationale: O particípio passivo de בוא indica algo levado para dentro. A forma verbal composta esclarece que a prata já havia sido entregue antes de ser retirada.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Mantém a imagem hebraica de “casa” e translitera o nome divino, em vez de substituí-lo por um título.
- source_word: מָצָא
  choice: encontrou
  rationale: Equivalente direto e natural do perfeito qal, sem acrescentar a ideia interpretativa de uma descoberta inesperada.
- source_word: חִלְקִיָּהוּ הַכֹּהֵן
  choice: o sacerdote Hilquias
  rationale: Forma de aposição natural em português, com a grafia portuguesa tradicional do nome.
- source_word: סֵפֶר תּוֹרַת יְהוָה
  choice: o Livro da Lei de Yahweh
  rationale: “Livro” é adequado no contexto, embora סֵפֶר também possa designar um rolo ou documento. “Lei” conserva o sentido estabelecido de תּוֹרָה neste contexto pactual, sem excluir sua dimensão de instrução.
- source_word: בְּיַד מֹשֶׁה
  choice: pela mão de Moisés
  rationale: Reproduz a expressão hebraica de agência ou mediação e preserva sua formulação concreta; a nota explica seu sentido idiomático.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pactual diretamente. “Yahweh” o representa como nome próprio, sem substituí-lo por um título.
- issue: Relação de Moisés com a Lei em בְּיַד מֹשֶׁה
  choice: pela mão de Moisés
  alternative: por meio de Moisés; dada por meio de Moisés
  rationale: A tradução conserva a expressão de mediação sem acrescentar explicitamente um verbo como “dar”, que não aparece no hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém relativa proximidade formal com o hebraico, enquanto a ordem “o sacerdote Hilquias” e a oração temporal soam naturais em português.
