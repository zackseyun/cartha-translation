  text: וַ/יְצַ֣ו הַ/מֶּ֡לֶךְ אֶת חִלְקִיָּ֡הוּ וְ/אֶת אֲחִיקָ֣ם בֶּן שָׁ֠פָן וְ/אֶת עַבְדּ֨וֹן בֶּן מִיכָ֜ה וְ/אֵ֣ת שָׁפָ֣ן הַ/סּוֹפֵ֗ר וְ/אֵ֛ת עֲשָׂיָ֥ה עֶֽבֶד הַ/מֶּ֖לֶךְ לֵ/אמֹֽר־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/020.yaml
  text: Then the king commanded Hilkiah[a], Ahikam son of Shaphan, Abdon son of Micah, Shaphan the scribe, and Asaiah the king’s servant, saying[b],
translation:
  language: pt
  text: 'Então o rei ordenou a Hilquias, a Aicão, filho de Safã, a Abdom, filho de Mica[a], a Safã, o escriba, e a Asaías, servo do rei[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O Texto Massorético traz “Abdom, filho de Mica”. O texto paralelo em 2 Reis 22:12 traz “Acbor, filho de Micaías”.
    reason: textual_variant
  - marker: b
    text: Ou “Asaías, oficial do rei”. O hebraico diz literalmente “servo do rei”, expressão que também pode designar um oficial da corte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: Então o rei ordenou
  rationale: O verbo צוה expressa uma ordem régia com força autoritativa. “Ordenou” é natural em português e a construção narrativa hebraica é representada por “Então”.
- source_word: חִלְקִיָּהוּ
  choice: Hilquias
  rationale: Forma portuguesa tradicional e amplamente reconhecível do nome hebraico.
- source_word: אֲחִיקָם בֶּן שָׁפָן
  choice: Aicão, filho de Safã
  rationale: Translitera os nomes em formas portuguesas usuais e traduz בן de maneira direta; as vírgulas tornam clara a identificação patronímica.
- source_word: עַבְדּוֹן בֶּן מִיכָה
  choice: Abdom, filho de Mica
  rationale: Segue o Texto Massorético de Crônicas e conserva a identificação patronímica, sem harmonizá-la com o paralelo de 2 Reis 22:12.
- source_word: שָׁפָן הַסּוֹפֵר
  choice: Safã, o escriba
  rationale: “Escriba” preserva o sentido lexical de סופר e continua claro, embora o cargo também pudesse corresponder a um secretário real.
- source_word: עֲשָׂיָה עֶבֶד הַמֶּלֶךְ
  choice: Asaías, servo do rei
  rationale: Traduz literalmente עבד, preservando a possibilidade de referência tanto a um servo quanto a um oficial da corte.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Em português atual, os dois-pontos introduzem naturalmente a fala que começa no versículo seguinte, evitando o pouco idiomático “dizendo” no fim isolado do versículo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura fluente. A repetição da preposição “a” deixa claros os vários destinatários da ordem. Os nomes seguem formas bíblicas portuguesas correntes. A fórmula hebraica de introdução da fala foi vertida por dois-pontos, pois o conteúdo da ordem vem no versículo seguinte.
