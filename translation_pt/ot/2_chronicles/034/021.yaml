id: 2CH.34.21
reference: 2 Chronicles 34:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לְכוּ֩ דִרְשׁ֨וּ אֶת יְהוָ֜ה בַּעֲדִ֗/י וּ/בְעַד֙ הַ/נִּשְׁאָר֙ בְּ/יִשְׂרָאֵ֣ל וּ/בִֽ/יהוּדָ֔ה עַל דִּבְרֵ֥י הַ/סֵּ֖פֶר אֲשֶׁ֣ר נִמְצָ֑א כִּֽי גְדוֹלָ֤ה חֲמַת יְהוָה֙ אֲשֶׁ֣ר נִתְּכָ֣ה בָ֔/נוּ עַל֩ אֲשֶׁ֨ר לֹא שָׁמְר֤וּ אֲבוֹתֵ֨י/נוּ֙ אֶת דְּבַ֣ר יְהוָ֔ה לַ/עֲשׂ֕וֹת כְּ/כָל הַ/כָּת֖וּב עַל הַ/סֵּ֥פֶר הַ/זֶּֽה־־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/021.yaml
  text: Go[a], inquire of Yahweh for me and for the remnant in Israel and in Judah concerning the words of the book that has been found, for great is the wrath of Yahweh that has been poured out on us, because our fathers have not kept the word of Yahweh[c][b], to do according to all that is written in this book.
translation:
  language: pt
  text: Vão e consultem Yahweh por mim e pelo remanescente em Israel e em Judá, a respeito das palavras do livro[a] que foi encontrado, pois grande é a ira de Yahweh que foi derramada sobre nós, porque nossos pais[b] não guardaram a palavra de Yahweh, para fazer conforme tudo o que está escrito neste livro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “rolo”. A palavra hebraica pode designar um livro ou um rolo escrito.
    reason: lexical_alternative
  - marker: b
    text: Ou “antepassados”. O hebraico diz literalmente “pais”.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִרְשׁוּ אֶת־יְהוָה
  choice: consultem Yahweh
  rationale: Neste contexto de ordem real, דרשׁ indica buscar orientação divina por meio de consulta, e não apenas buscar a Deus em sentido devocional.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, distinguindo-o de títulos como “Senhor”.
- source_word: בַּעֲדִי
  choice: por mim
  rationale: בעד indica representação ou benefício; “por mim” é direto e natural em português.
- source_word: וּבְעַד הַנִּשְׁאָר בְּיִשְׂרָאֵל וּבִיהוּדָה
  choice: e pelo remanescente em Israel e em Judá
  rationale: Preserva o singular coletivo הַנִּשְׁאָר e mantém a localização explicitada pelas duas ocorrências da preposição בְּ.
- source_word: עַל דִּבְרֵי הַסֵּפֶר
  choice: a respeito das palavras do livro
  rationale: על introduz o assunto da consulta, enquanto דִּבְרֵי conserva a referência às palavras ou declarações do documento.
- source_word: הַסֵּפֶר אֲשֶׁר נִמְצָא
  choice: o livro que foi encontrado
  rationale: סֵפֶר pode designar livro ou rolo; “livro” é natural no texto principal, e a alternativa histórica é registrada em nota.
- source_word: גְדוֹלָה חֲמַת יְהוָה
  choice: grande é a ira de Yahweh
  rationale: A ordem marcada do português acompanha a ênfase hebraica no predicado גְדוֹלָה, e “ira” comunica adequadamente חֵמָה.
- source_word: נִתְּכָה בָנוּ
  choice: foi derramada sobre nós
  rationale: O nifal de נתך descreve a ira como derramada, imagem preservada de modo idiomático em português.
- source_word: אֲבוֹתֵינוּ
  choice: nossos pais
  rationale: Mantém a forma masculina e a expressão familiar do hebraico, sem impedir o sentido geracional mais amplo indicado em nota.
- source_word: שָׁמְרוּ אֶת־דְּבַר יְהוָה
  choice: não guardaram a palavra de Yahweh
  rationale: “Guardar” preserva o valor de שׁמר como observar e obedecer ao que Yahweh ordenou.
- source_word: לַעֲשׂוֹת כְּכָל הַכָּתוּב
  choice: para fazer conforme tudo o que está escrito
  rationale: Mantém tanto o infinitivo de ação quanto o sentido normativo de כְּ, sem reduzir a expressão a mera leitura ou conhecimento.
- source_word: עַל־הַסֵּפֶר הַזֶּה
  choice: neste livro
  rationale: Embora על seja literalmente “sobre”, o português usa naturalmente “neste livro” para indicar conteúdo escrito.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Alcance de אֲבוֹתֵינוּ
  choice: nossos pais
  alternative: nossos antepassados
  rationale: A tradução principal conserva a forma masculina do hebraico, enquanto a nota reconhece que a referência contextual pode abranger gerações ancestrais.
- issue: Sentido de שׁמר em relação à palavra divina
  choice: guardaram
  alternative: obedeceram; observaram
  rationale: “Guardaram” retém a metáfora lexical e, no contexto, inclui a exigência concreta de cumprir tudo o que estava escrito.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe próxima do hebraico sem sacrificar a legibilidade. A repetição de “Yahweh” e a ênfase “grande é a ira” foram mantidas deliberadamente.
