base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/022.yaml
  text: 'Then Hilkiah and those whom the king had sent went to Huldah the prophetess[a], the wife of Shallum son of Tokhath, son of Hasrah, keeper of the garments. She lived in Jerusalem in the Second Quarter[b], and they spoke to her thus:'
translation:
  language: pt
  text: 'Então Hilquias e os homens que o rei havia enviado foram falar com a profetisa Hulda, mulher de Salum, filho de Tocate e neto de Hasra, encarregado das vestes[a]. Ela morava em Jerusalém, no Segundo Bairro[b]. Eles lhe falaram o seguinte:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “responsável pelo guarda-roupa”. O hebraico diz literalmente “guardião das vestes”.
    reason: lexical_alternative
  - marker: b
    text: Hebraico Mishnê, provavelmente o nome de um bairro de Jerusalém; tradicionalmente traduzido como “Segundo Bairro”.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: foram falar com
  rationale: O verbo significa literalmente “foi”; com o complemento pessoal introduzido por אֶל e a fala que se segue, “foram falar com” expressa naturalmente em português a finalidade contextual sem alterar a ação narrativa.
- source_word: וַאֲשֶׁר הַמֶּלֶךְ
  choice: e os homens que o rei havia enviado
  rationale: A expressão hebraica é elíptica, literalmente algo como “e os que [eram] do rei”. O contexto do versículo anterior identifica essas pessoas como membros da delegação enviada pelo rei; “homens” explicita apenas o referente humano, e “havia enviado” torna a relação clara em português.
- source_word: חֻלְדָּה הַנְּבִיאָה
  choice: a profetisa Hulda
  rationale: Mantém explicitamente o gênero feminino marcado pelo substantivo hebraico e emprega a forma tradicional e reconhecível do nome em português.
- source_word: אֵשֶׁת שַׁלֻּם
  choice: mulher de Salum
  rationale: Em contexto genealógico, אִשָּׁה designa a esposa; “mulher de” é uma forma bíblica corrente, clara e digna em português.
- source_word: בֶּן תוקהת בֶּן חַסְרָה
  choice: filho de Tocate e neto de Hasra
  rationale: A segunda ocorrência de “filho” indica a geração anterior de Salum. “Neto” evita em português a possível leitura equivocada de que Tocate seria filho de Hasra e, ao mesmo tempo, preserva a genealogia.
- source_word: שׁוֹמֵר הַבְּגָדִים
  choice: encarregado das vestes
  rationale: Representa o sentido literal de “guardião das vestes” e sugere adequadamente uma função oficial, sem impor que se tratasse de um guarda-roupa doméstico.
- source_word: וְהִיא יוֹשֶׁבֶת
  choice: Ela morava
  rationale: O particípio fornece informação de fundo sobre residência habitual; “morava” é natural no português moderno e harmoniza com o tempo da narrativa.
- source_word: בַּמִּשְׁנֶה
  choice: no Segundo Bairro
  rationale: O termo provavelmente identifica uma área específica de Jerusalém. A tradução conserva tanto a ideia de uma segunda área quanto seu caráter toponímico, indicado pelas iniciais maiúsculas.
- source_word: וַיְדַבְּרוּ אֵלֶיהָ כָּזֹאת
  choice: 'Eles lhe falaram o seguinte:'
  rationale: Forma portuguesa natural para introduzir o discurso subsequente, preservando a força demonstrativa de כָּזֹאת.
