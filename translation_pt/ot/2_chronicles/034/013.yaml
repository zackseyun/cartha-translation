  text: They were over the burden-bearers and supervised everyone doing work for service after service; and some of the Levites were scribes[a], officers, and gatekeepers.
translation:
  language: pt
  text: Eles estavam encarregados dos carregadores e supervisionavam todos os que realizavam trabalhos, em serviço por serviço[a]. Alguns dos levitas eram escribas, oficiais e porteiros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em cada tipo de serviço”. O hebraico repete “serviço” (literalmente, “para serviço e serviço”), provavelmente indicando distribuição entre as diversas tarefas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל הַסַּבָּלִים
  choice: estavam encarregados dos carregadores
  rationale: Neste contexto administrativo, עַל indica autoridade ou supervisão, enquanto סַבָּלִים designa especificamente os que transportavam cargas. A formulação é natural em português e mantém ambos os sentidos.
- source_word: וּמְנַצְּחִים
  choice: e dirigiam
  rationale: O particípio de נצח denota aqui supervisão ou direção do trabalho. A forma verbal finita retoma naturalmente o sujeito do contexto anterior.
- source_word: לְכֹל עֹשֵׂה מְלָאכָה
  choice: todos os que executavam o trabalho
  rationale: Preserva o alcance distributivo de כֹל e o valor participial de עֹשֵׂה, em linguagem clara e corrente.
- source_word: לַעֲבוֹדָה וַעֲבוֹדָה
  choice: serviço por serviço[a]
  rationale: A expressão mantém de modo inteligível a repetição enfática e provavelmente distributiva do hebraico, sem reduzi-la silenciosamente a uma única interpretação.
- source_word: וּמֵהַלְוִיִּם
  choice: alguns dos levitas
  rationale: 'A preposição מִן tem valor partitivo: certos levitas, não necessariamente todos, exerciam as funções enumeradas.'
- source_word: סוֹפְרִים
  choice: escribas
  rationale: Equivalente tradicional e preciso para escribas ou responsáveis por registros.
- source_word: שֹׁטְרִים
  choice: oficiais
  rationale: O termo designa autoridades ou funcionários com atribuições administrativas e de supervisão; “oficiais” é conciso e adequado ao contexto.
- source_word: שׁוֹעֲרִים
  choice: porteiros
  rationale: Designa os responsáveis pelas portas ou portões, especialmente no serviço do templo; “porteiros” é a forma bíblica corrente e clara em português.
