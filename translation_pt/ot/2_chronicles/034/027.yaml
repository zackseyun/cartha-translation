  to: Porque o seu coração era sensível e você se humilhou diante de Deus quando ouviu as palavras dele contra este lugar e contra seus habitantes, e se humilhou diante de mim, rasgou suas roupas e chorou diante de mim, eu também ouvi você — declara Yahweh.
