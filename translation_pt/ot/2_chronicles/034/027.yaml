base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/027.yaml
  text: Because your heart was tender[a], and you humbled yourself before God when you heard his words against this place and against its inhabitants, and because you humbled yourself before me and tore your clothes and wept before me, I also have heard you, declares Yahweh.
translation:
  language: pt
  text: Porque o seu coração era sensível e você se humilhou diante de Deus quando ouviu as palavras dele contra este lugar e contra seus habitantes, e se humilhou diante de mim, rasgou suas roupas e chorou diante de mim, eu também ouvi você — declara Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַעַן
  choice: Porque
  rationale: Introduz a causa da resposta divina e preserva de modo natural a força causal do hebraico.
- source_word: רַךְ לְבָבְךָ
  choice: o seu coração se sensibilizou
  rationale: רַךְ significa literalmente “macio, brando, sensível”; com “coração”, descreve uma disposição interior receptiva e humilde. A forma verbal é natural em português e evita sugerir fragilidade.
- source_word: וַתִּכָּנַע
  choice: você se humilhou
  rationale: O nifal de כנע expressa aqui a humilhação voluntária de Josias diante de Deus; a mesma tradução é mantida nas duas ocorrências.
- source_word: מִלִּפְנֵי אֱלֹהִים / לְפָנַי
  choice: diante de Deus / diante de mim
  rationale: Preserva a linguagem relacional da presença divina e a repetição retórica do texto.
- source_word: בְּשָׁמְעֲךָ
  choice: quando ouviu
  rationale: Representa claramente o uso temporal de ב com o infinitivo construto.
- source_word: דְּבָרָיו
  choice: as palavras dele
  rationale: Mantém o sentido lexical e a referência contextual a Deus sem transformar o plural em “mensagem”.
- source_word: עַל הַמָּקוֹם הַזֶּה וְעַל יֹשְׁבָיו
  choice: contra este lugar e contra os seus habitantes
  rationale: No contexto de juízo, עַל tem força adversativa; a repetição de “contra” acompanha a ênfase hebraica.
- source_word: וַתִּקְרַע אֶת בְּגָדֶיךָ
  choice: rasgou as suas roupas
  rationale: Expressão acessível que preserva o gesto convencional de luto e arrependimento.
- source_word: וַתֵּבְךְּ
  choice: chorou
  rationale: Verbo corrente e digno que comunica a manifestação de profunda tristeza.
- source_word: וְגַם אֲנִי שָׁמַעְתִּי
  choice: eu também ouvi você
  rationale: “Também” preserva a ênfase de גַם; “você” explicita o objeto entendido pelo contexto e produz português natural.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz a fórmula profética solene e mantém o nome divino expresso pelo Tetragrama.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” representa o nome próprio, em vez de substituí-lo por um título.
- issue: Sentido da sensibilidade do coração
  choice: disposição receptiva e humilde
  alternative: fraqueza emocional
  rationale: A combinação רַךְ לְבָבְךָ, reforçada pela humilhação, pelo rasgar das roupas e pelo choro, indica receptividade penitente, não debilidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservam-se a repetição de “você se humilhou” e a sequência dos sinais de arrependimento. O ponto e vírgula organiza o longo período sem eliminar o paralelismo causal.
