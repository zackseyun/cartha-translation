  text: and in the cities of Manasseh and Ephraim and Simeon[a], even as far as Naphtali[b], in their surrounding ruins.
translation:
  language: pt
  text: e nas cidades de Manassés, Efraim e Simeão, até mesmo Naftali, em suas ruínas circundantes.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão final em hebraico é difícil. Ela pode ser entendida como “em suas ruínas circundantes” ou “em seus lugares devastados ao redor”.
    reason: textual_variant
  - marker: b
    text: A forma consonantal também pode ser entendida mais literalmente como “suas casas”; contudo, o contexto favorece uma referência a ruínas ou lugares devastados.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/עָרֵי
  choice: e nas cidades de
  rationale: Representa tanto a conjunção como a preposição. “Cidades” é a forma corrente e adequada à narrativa histórica.
- source_word: מְנַשֶּׁה וְ/אֶפְרַיִם וְ/שִׁמְעוֹן
  choice: Manassés, Efraim e Simeão
  rationale: Emprega as formas portuguesas tradicionais dos nomes geográficos e preserva a coordenação hebraica em português natural.
- source_word: וְ/עַד נַפְתָּלִי
  choice: chegando até Naftali
  rationale: עַד indica o limite da extensão geográfica; “chegando até” comunica esse alcance com naturalidade.
- source_word: ב/הר בתי/הם
  choice: em meio às ruínas
  rationale: A forma transmitida é difícil, mas o contexto da devastação dos locais de culto favorece o sentido de “ruínas” ou “lugares devastados”, sem adotar a leitura literal menos provável “casas” no texto principal.
- source_word: סָבִיב
  choice: ao redor delas
  rationale: סָבִיב indica o espaço circundante. O pronome retoma naturalmente as cidades mencionadas.
