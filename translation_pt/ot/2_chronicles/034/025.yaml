base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/025.yaml
  text: Because they have forsaken me and burned incense to other gods[a], so as to provoke me to anger by all the works of their hands[b], my wrath will be poured out on this place and will not be quenched.
translation:
  language: pt
  text: Porque eles me abandonaram e queimaram incenso a outros deuses[a], para me provocar à ira com todas as obras de suas mãos[b], a minha ira se derramará sobre este lugar e não se apagará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “deuses estrangeiros”. O hebraico diz literalmente “outros deuses”.
    reason: lexical_alternative
  - marker: b
    text: A expressão “obras de suas mãos” pode abranger aquilo que fizeram ou fabricaram, especialmente os ídolos e os atos ligados à idolatria.
    reason: cultural_note
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  choice: Porque
  rationale: A expressão introduz a causa do juízo anunciado; “Porque” comunica essa relação de modo natural e direto.
- source_word: עֲזָבוּנִי
  choice: eles me abandonaram
  rationale: עזב significa abandonar ou deixar. “Abandonaram” é atual, claro e mantém a gravidade da infidelidade a Deus.
- source_word: וַיַּקְטִירוּ
  choice: e queimaram incenso
  rationale: No hifil, קטר normalmente descreve a queima de incenso ou uma oferta que produz fumaça; neste contexto de idolatria, “queimaram incenso” é a opção mais precisa.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: a outros deuses
  rationale: אֲחֵרִים significa literalmente “outros”; a formulação preserva a linguagem bíblica direta sobre a idolatria.
- source_word: לְמַעַן הַכְעִיסֵנִי
  choice: a fim de me provocar à ira
  rationale: A construção pode indicar propósito ou resultado. A tradução conserva essa abertura contextual sem reduzir a expressão simplesmente a “irritar”.
- source_word: בְּכֹל מַעֲשֵׂי יְדֵיהֶם
  choice: com todas as obras de suas mãos
  rationale: Mantém a imagem hebraica, que pode abranger tanto os objetos fabricados, especialmente ídolos, quanto os atos ligados a eles.
- source_word: וְתִתַּךְ חֲמָתִי
  choice: Por isso, a minha indignação se derramará
  rationale: נתך conserva a imagem de algo derramado. “Indignação” expressa חֵמָה como a reação judicial intensa de Deus, sem recorrer a linguagem arcaica.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: sobre este lugar
  rationale: “Sobre” corresponde naturalmente ao movimento figurado da indignação que é derramada e mostra que o lugar é alvo do juízo.
- source_word: וְלֹא תִכְבֶּה
  choice: e não se apagará
  rationale: כבה é usado para apagar fogo. A tradução preserva a metáfora implícita e soa natural em português.
theological_decisions:
- issue: Linguagem do juízo divino
  choice: a minha indignação se derramará sobre este lugar e não se apagará
  alternative: a minha ira será derramada sobre este lugar e não será extinta
  rationale: A formulação mantém tanto a intensidade do juízo pessoal de Deus quanto as imagens hebraicas de derramamento e de fogo, sem acrescentar categorias doutrinárias posteriores.
- issue: Propósito ou resultado em לְמַעַן
  choice: a fim de me provocar à ira
  alternative: de modo que me provocaram à ira
  rationale: לְמַעַן pode introduzir propósito ou resultado. O texto principal segue a leitura de propósito, natural no contexto, sem transformar a frase numa afirmação filosófica mais ampla sobre as intenções dos envolvidos.
- issue: Referência a Deus no discurso em primeira pessoa
  choice: me / minha
  alternative: ao SENHOR / do SENHOR
  rationale: Os sufixos hebraicos estão na primeira pessoa. Preservá-los reproduz diretamente a fala divina e evita substituir a forma do texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A tradução mantém os paralelismos e as imagens concretas do hebraico, mas divide a longa sequência causal em duas frases para maior clareza. “Indignação” evita a possível leitura cotidiana e impulsiva de “raiva”, preservando o caráter judicial do contexto.
