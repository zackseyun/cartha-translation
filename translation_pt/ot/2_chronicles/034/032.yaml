base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/032.yaml
  text: Then he made everyone who was found in Jerusalem and Benjamin stand to it[a], and the inhabitants of Jerusalem acted according to the covenant of God[b], the God of their fathers.
translation:
  language: pt
  text: Então Josias fez com que todos os que se encontravam em Jerusalém e em Benjamim ficassem de pé[a], e os habitantes de Jerusalém agiram de acordo com a aliança de Deus[b], o Deus de seus antepassados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tomassem posição”. No contexto, ficar de pé pode indicar que eles foram levados a assumir o compromisso com a aliança.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “procederam segundo a aliança de Deus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: fez com que ... tomassem posição
  rationale: O hifil de עמד significa literalmente fazer alguém ficar de pé ou tomar posição. A formulação conserva a imagem do hebraico e, no contexto da renovação da aliança, permite o sentido de assumir um compromisso sem torná-lo explícito demais no texto principal.
- source_word: אֵת כָּל הַנִּמְצָא
  choice: todos os que se encontravam
  rationale: Reproduz de modo natural o particípio passivo נמצא e inclui a totalidade das pessoas presentes.
- source_word: בִירוּשָׁלִַם וּבִנְיָמִן
  choice: em Jerusalém e em Benjamim
  rationale: Mantém diretamente os nomes geográficos; Benjamim provavelmente designa o território tribal, mas o texto hebraico usa apenas o nome.
- source_word: וַיַּעֲשׂוּ
  choice: agiram
  rationale: Neste uso com a preposição כ e 'aliança', עשה indica proceder ou agir em conformidade com a aliança.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: os habitantes de Jerusalém
  rationale: Tradução clara e corrente da expressão que designa os moradores da cidade.
- source_word: כִּבְרִית
  choice: de acordo com a aliança
  rationale: 'A preposição כ marca conformidade: os habitantes procederam segundo a aliança.'
- source_word: אֱלֹהִים אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: de Deus, o Deus de seus antepassados
  rationale: Preserva a aposição e a repetição enfática de 'Deus', enquanto 'antepassados' comunica naturalmente o sentido coletivo de אבות.
theological_decisions:
- issue: Sentido da ação de Josias na renovação da aliança
  choice: Josias fez os presentes tomarem posição, expressão que no contexto sugere adesão à aliança
  alternative: Josias apenas os pôs fisicamente de pé; ou os fez comprometer-se explicitamente com a aliança
  rationale: O verbo mantém a imagem de ficar de pé ou tomar posição, ao passo que o contexto aponta para compromisso pactual. A tradução preserva ambas as dimensões sem especificar uma cerimônia que o hebraico não descreve.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e vocabulário amplamente internacional. O nome 'Josias' foi explicitado para evitar um pronome inicial sem antecedente no versículo isolado.
