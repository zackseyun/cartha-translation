lexical_decisions:
- source_word: בֶּן שְׁמוֹנֶה שָׁנִים
  choice: tinha oito anos
  rationale: A expressão hebraica, literalmente “filho de oito anos”, é uma fórmula idiomática de idade; “tinha oito anos” comunica seu sentido com naturalidade em português.
- source_word: יֹאשִׁיָּהוּ
  choice: Josias
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: בְמָלְכוֹ
  choice: quando se tornou rei
  rationale: A construção infinitiva indica o momento da ascensão ao trono; esta formulação é clara e natural, sem alterar o sentido.
- source_word: וּשְׁלֹשִׁים וְאַחַת שָׁנָה
  choice: trinta e um anos
  rationale: Reproduz a duração do reinado segundo a ordem numérica normal do português contemporâneo.
- source_word: מָלַךְ
  choice: reinou
  rationale: O verbo hebraico denota exercer o governo como rei, correspondendo diretamente a “reinou”.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: Tradução direta do uso locativo do nome da cidade.
