base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/018.yaml
  text: Then Shaphan the scribe told the king[a], saying, “Hilkiah the priest has given me a book,” and Shaphan read from it before the king.
translation:
  language: pt
  text: 'Então Safã, o escriba, informou ao rei: “Hilquias, o sacerdote, me deu um livro[a]”. E Safã leu o livro diante do rei.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um rolo”. A palavra hebraica pode designar de modo amplo um documento escrito ou livro; naquele período, o formato físico geralmente era um rolo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: informou
  rationale: O hifil de נגד significa contar ou comunicar uma informação. “Informou” é natural no contexto de um oficial que apresenta um relato ao rei, sem acrescentar solenidade excessiva.
- source_word: הַסּוֹפֵר
  choice: o escriba
  rationale: סֹפֵר pode designar um escriba ou secretário real. “Escriba” preserva o título histórico e é compreensível em português.
- source_word: סֵפֶר
  choice: um livro
  rationale: סֵפֶר é um termo amplo para livro ou documento escrito e não determina por si só o formato físico; “livro” é claro e geral, enquanto a nota registra a possibilidade de “rolo”.
- source_word: נָתַן לִי
  choice: me deu
  rationale: O perfeito hebraico apresenta a ação como concluída. O pretérito perfeito simples é a forma mais natural em português e mantém a relevância imediata da entrega.
- source_word: חִלְקִיָּהוּ הַכֹּהֵן
  choice: Hilquias, o sacerdote
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome, traduzindo o título. As vírgulas tornam natural a aposição em português.
- source_word: וַיִּקְרָא בוֹ
  choice: leu dele
  rationale: A construção preserva a preposição בְּ e indica que Safã leu parte ou conteúdo do livro, sem afirmar necessariamente que o leu por inteiro.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: diante do rei
  rationale: A expressão indica a presença do rei; “diante do rei” é conciso, idiomático e próximo da forma hebraica.
