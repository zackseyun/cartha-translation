  text: וַ/יְנַתֵּ֣ץ אֶת הַֽ/מִּזְבְּח֗וֹת וְ/אֶת הָ/אֲשֵׁרִ֤ים וְ/הַ/פְּסִלִים֙ כִּתַּ֣ת לְ/הֵדַ֔ק וְ/כָל הַֽ/חַמָּנִ֥ים גִּדַּ֖ע בְּ/כָל אֶ֣רֶץ יִשְׂרָאֵ֑ל וַ/יָּ֖שָׁב לִ/ירוּשָׁלִָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/007.yaml
  text: He tore down the altars and the Asherim[a], and he crushed the carved images to powder; he cut down all the incense altars throughout all the land of Israel[b]. Then he returned to Jerusalem.
translation:
  language: pt
  text: Ele derrubou os altares e os postes de Aserá[a], reduziu a pó as imagens esculpidas e cortou todos os pilares solares[b] em toda a terra de Israel. Depois, voltou para Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “objetos sagrados de Aserá”. O termo hebraico se refere a objetos de culto associados a Aserá; sua forma exata pode variar conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “altares de incenso”. O termo hebraico designa um tipo de objeto de culto, provavelmente associado ao sol, mas sua identificação exata é discutida.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַתֵּץ
  choice: derrubou
  rationale: נתץ descreve a demolição de estruturas; “derrubou” é natural em português e adequado aos altares.
- source_word: הַמִּזְבְּחוֹת
  choice: os altares
  rationale: Equivalente corrente e preciso de מִזְבְּחוֹת no contexto de instalações de culto.
- source_word: הָאֲשֵׁרִים
  choice: os postes de Aserá
  rationale: O termo designa objetos de culto associados à deusa Aserá. “Postes de Aserá” é compreensível, mas a nota preserva a incerteza quanto à forma exata desses objetos.
- source_word: הַפְּסִלִים
  choice: as imagens esculpidas
  rationale: פסילים são imagens cultuais talhadas; a expressão mantém a especificidade lexical sem generalizá-las apenas como “ídolos”.
- source_word: כִּתַּת לְהֵדַק
  choice: reduziu a pó
  rationale: A combinação verbal comunica esmagamento até a obtenção de partículas finas; “reduziu a pó” expressa claramente o resultado.
- source_word: הַחַמָּנִים
  choice: os pilares solares
  rationale: חַמָּנִים provavelmente designa objetos cultuais ligados ao sol. “Pilares solares” preserva essa associação, enquanto a nota registra a identificação alternativa como altares de incenso.
- source_word: גִּדַּע
  choice: cortou
  rationale: גדע significa cortar ou decepar e se aplica a objetos cultuais eretos.
- source_word: בְּכָל אֶרֶץ יִשְׂרָאֵל
  choice: em toda a terra de Israel
  rationale: Representa de modo natural a extensão geográfica expressa por בְּכָל.
- source_word: וַיָּשָׁב לִירוּשָׁלִָם
  choice: Depois, voltou para Jerusalém
  rationale: O wayyiqtol dá sequência à narrativa; “Depois” torna essa progressão clara em português.
theological_decisions:
- issue: Tradução dos termos relativos aos objetos de culto idolátrico
  choice: 'Manter objetos específicos: “postes de Aserá”, “imagens esculpidas” e “pilares solares”.'
  alternative: Generalizar como “ídolos e santuários” ou interpretar חַמָּנִים no texto principal como “altares de incenso”.
  rationale: A especificidade concreta do hebraico retrata melhor a reforma de Josias. As notas preservam a incerteza arqueológica e lexical sem impor uma identificação confessional.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A sintaxe acompanha a sequência do hebraico sem preservar rigidez desnecessária.
