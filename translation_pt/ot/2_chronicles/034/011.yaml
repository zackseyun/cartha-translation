base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/011.yaml
  text: And they gave it to the craftsmen and to the builders to buy quarried stone and timber for the supports and for roofing the buildings that the kings of Judah had ruined[a][b][c].
translation:
  language: pt
  text: E entregaram o dinheiro aos artesãos e aos construtores, para comprarem pedras de pedreira[a] e madeira para as estruturas de ligação[b] e para cobrir com vigas[c] os edifícios que os reis de Judá haviam deixado em ruínas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pedras lavradas”. A expressão hebraica se refere a pedras extraídas de uma pedreira para uso na construção.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico é incerto e pode se referir a junções, encaixes, peças de ligação ou elementos de sustentação.
    reason: lexical_alternative
  - marker: c
    text: Ou “para fazer vigas” ou “para cobrir”. O verbo hebraico pode indicar a cobertura de uma construção com vigas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: entregaram o dinheiro
  rationale: O verbo significa “dar/entregar”; o objeto está implícito no hebraico e é explicitado pelo contexto anterior, que trata do dinheiro destinado à obra.
- source_word: חָרָשִׁים
  choice: artesãos
  rationale: Designa trabalhadores qualificados de modo amplo, sem restringi-los a um único ofício.
- source_word: בֹּנִים
  choice: construtores
  rationale: Tradução direta e natural do particípio substantivado derivado de “construir”.
- source_word: לִקְנוֹת
  choice: para comprarem
  rationale: Expressa naturalmente em português a finalidade indicada pelo infinitivo hebraico.
- source_word: אַבְנֵי מַחְצֵב
  choice: pedras de pedreira
  rationale: Preserva a referência a pedras extraídas de uma pedreira sem afirmar além do texto o grau exato de acabamento.
- source_word: עֵצִים
  choice: madeira
  rationale: No contexto, refere-se à madeira usada como material de construção.
- source_word: לַמְחַבְּרוֹת
  choice: para as estruturas de ligação
  rationale: O termo é raro e incerto; esta formulação conserva a ideia básica de unir ou conectar elementos estruturais sem identificar uma peça arquitetônica específica.
- source_word: וּלְקָרוֹת
  choice: para cobrir com vigas
  rationale: O verbo, em contexto de construção, pode indicar cobrir ou telhar uma estrutura mediante vigas; a formulação preserva tanto a ação quanto o elemento estrutural provável.
- source_word: הַבָּתִּים
  choice: os edifícios
  rationale: Embora o substantivo possa significar “casas”, aqui se refere às construções do complexo do templo.
- source_word: הִשְׁחִיתוּ
  choice: haviam deixado em ruínas
  rationale: A forma causativa pode significar arruinar, destruir ou danificar. A escolha comunica grave deterioração sem necessariamente implicar destruição total.
- source_word: מַלְכֵי יְהוּדָה
  choice: os reis de Judá
  rationale: Tradução direta da expressão hebraica.
