  text: וַ/יָּבֵ֨א שָׁפָ֤ן אֶת הַ/סֵּ֨פֶר֙ אֶל הַ/מֶּ֔לֶךְ וַ/יָּ֨שֶׁב ע֧וֹד אֶת הַ/מֶּ֛לֶךְ דָּבָ֖ר לֵ/אמֹ֑ר כֹּ֛ל אֲשֶׁר נִתַּ֥ן בְּ/יַד עֲבָדֶ֖י/ךָ הֵ֥ם עֹשִֽׂים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/016.yaml
  text: Then Shaphan brought the book to the king and also brought back word to the king[a], saying, “All that was committed into the hand of your servants, they are doing.”
translation:
  language: pt
  text: 'Então Safã levou o livro ao rei e também lhe apresentou um relatório, dizendo: “Tudo o que foi confiado aos teus servos[a], eles estão fazendo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “foi posto nas mãos dos teus servos”; a expressão hebraica significa que algo lhes foi entregue para que ficasse sob a responsabilidade deles.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: levou
  rationale: O hifil de בוא indica que Safã fez o livro chegar ao rei; em português, “levou” expressa isso com naturalidade.
- source_word: הַסֵּפֶר
  choice: o livro
  rationale: סֵפֶר pode designar livro, rolo ou documento. “O livro” é natural no contexto e não especifica indevidamente sua forma material.
- source_word: וַיָּשֶׁב עוֹד אֶת־הַמֶּלֶךְ דָּבָר
  choice: também lhe apresentou um relatório
  rationale: A expressão indica que Safã deu ao rei uma informação adicional ou prestou contas. “Apresentou um relatório” comunica o sentido contextual sem reproduzir uma construção hebraica pouco natural em português.
- source_word: כֹּל אֲשֶׁר נִתַּן בְּיַד עֲבָדֶיךָ
  choice: Tudo o que foi confiado aos teus servos
  rationale: נתן ביד é uma expressão idiomática para entregar algo à responsabilidade de alguém. “Foi confiado” traduz o sentido, enquanto a nota preserva a imagem literal das mãos.
- source_word: עֲבָדֶיךָ
  choice: teus servos
  rationale: No contexto da corte, עבד designa servidores do rei. “Servos” mantém a linguagem régia sem impor o sentido mais restrito de escravos nem substituir o termo por “oficiais”.
- source_word: הֵם עֹשִׂים
  choice: eles estão fazendo
  rationale: O pronome explícito seguido do particípio dá ênfase aos agentes e apresenta a ação como em andamento; a formulação portuguesa preserva ambos os aspectos.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A ordem marcada de “eles estão fazendo” preserva a ênfase do hebraico sem tornar a frase obscura.
