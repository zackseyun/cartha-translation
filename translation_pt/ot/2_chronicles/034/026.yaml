  text: וְ/אֶל מֶ֣לֶךְ יְהוּדָ֗ה הַ/שֹּׁלֵ֤חַ אֶתְ/כֶם֙ לִ/דְר֣וֹשׁ בַּֽ/יהוָ֔ה כֹּ֥ה תֹאמְר֖וּ אֵלָ֑י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַ/דְּבָרִ֖ים אֲשֶׁ֥ר שָׁמָֽעְתָּ־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/026.yaml
  text: 'But to the king of Judah[a], who sent you to inquire of Yahweh, thus you shall say to him: ‘Thus says Yahweh, the God of Israel: As for the words that you have heard—’'
translation:
  language: pt
  text: 'Mas, ao rei de Judá, que enviou vocês para consultar Yahweh[a], digam-lhe o seguinte: “Assim diz Yahweh, o Deus de Israel: Quanto às palavras que você ouviu—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “buscar Yahweh”. O verbo hebraico pode significar tanto buscar quanto consultar, especialmente em um contexto de consulta profética.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל
  choice: Mas, ao
  rationale: A conjunção acrescenta uma nova instrução em contraste com a mensagem anterior, enquanto אֶל mantém a direção do discurso ao rei.
- source_word: מֶלֶךְ יְהוּדָה
  choice: rei de Judá
  rationale: Tradução direta e natural da cadeia construta hebraica.
- source_word: הַשֹּׁלֵחַ אֶתְכֶם
  choice: que enviou vocês
  rationale: O particípio com artigo identifica o rei por meio de uma oração relativa; o plural do pronome se refere à delegação.
- source_word: לִדְרוֹשׁ בַּיהוָה
  choice: para consultar Yahweh
  rationale: Neste contexto de consulta profética, דרשׁ com ב expressa a busca de uma resposta ou orientação divina. “Consultar” comunica a ação imediata sem reduzir o verbo à ideia geral de devoção.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, preservando seu caráter de nome próprio.
- source_word: כֹּה תֹאמְרוּ אֵלָיו
  choice: digam o seguinte
  rationale: Reproduz com clareza moderna a fórmula de instrução ao mensageiro e preserva tanto o sujeito plural quanto o destinatário singular.
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Mantém a fórmula profética tradicional, seu caráter declarativo e o presente convencional em português.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta da expressão construta que identifica Yahweh em sua relação com Israel.
- source_word: הַדְּבָרִים אֲשֶׁר שָׁמָעְתָּ
  choice: Quanto às palavras que você ouviu—
  rationale: “Quanto às” preserva a topicalização hebraica e o travessão indica que a construção fica suspensa até o versículo seguinte. O singular “você” corresponde ao rei.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome próprio e evita substituí-lo por um título.
- issue: Sentido de דרשׁ em contexto profético
  choice: consultar Yahweh
  alternative: buscar Yahweh; buscar a orientação de Yahweh
  rationale: O contexto descreve uma delegação enviada para obter uma resposta divina. “Consultar” expressa esse ato, enquanto a nota conserva a amplitude lexical do verbo.
translation_notes:
  register: Português atual, digno e acessível, com legibilidade brasileira. “Vocês” explicita o plural da delegação, enquanto “você” marca a mudança para o rei no singular. A fórmula “Assim diz” conserva o tom profético, e o final suspenso preserva a continuidade sintática com o versículo seguinte.
