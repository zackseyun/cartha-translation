base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/023.yaml
  text: 'And she said to them[a], “Thus says Yahweh, the God of Israel: Say to the man who sent you to me,”'
translation:
  language: pt
  text: 'E ela lhes disse: “Assim diz Yahweh, o Deus de Israel: Digam ao homem que enviou vocês a mim:”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר לָהֶם
  choice: E ela lhes disse
  rationale: Preserva a sequência narrativa do wayyiqtol e expressa diretamente os destinatários; o pronome feminino retoma Hulda no contexto.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Fórmula profética consagrada que reproduz de modo natural e digno a fórmula hebraica de mensageiro.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, sem substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta e natural da construção que identifica Yahweh como o Deus de Israel.
- source_word: אִמְרוּ
  choice: Digam
  rationale: Mantém o imperativo plural dirigido aos membros da delegação.
- source_word: לָאִישׁ
  choice: ao homem
  rationale: Conserva o substantivo masculino singular do hebraico, que no contexto se refere ao rei Josias.
- source_word: אֲשֶׁר שָׁלַח אֶתְכֶם אֵלָי
  choice: que enviou vocês a mim
  rationale: Reproduz claramente a oração relativa e a direção expressa pelo hebraico, em português amplamente compreensível.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o Tetragrama como nome próprio. A transliteração preserva esse nome e evita substituí-lo silenciosamente por um título, sem impor uma interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação preserva o tom profético formal. O versículo termina com dois-pontos porque a mensagem introduzida continua no versículo seguinte.
