  text: וַ/יָּבֹ֜אוּ אֶל חִלְקִיָּ֣הוּ הַ/כֹּהֵ֣ן הַ/גָּד֗וֹל וַֽ/יִּתְּנוּ֮ אֶת הַ/כֶּסֶף֮ הַ/מּוּבָ֣א בֵית אֱלֹהִים֒ אֲשֶׁ֣ר אָסְפֽוּ הַ/לְוִיִּם֩ שֹׁמְרֵ֨י הַ/סַּ֜ף מִ/יַּ֧ד מְנַשֶּׁ֣ה וְ/אֶפְרַ֗יִם וּ/מִ/כֹּל֙ שְׁאֵרִ֣ית יִשְׂרָאֵ֔ל וּ/מִ/כָּל יְהוּדָ֖ה וּ/בִנְיָמִ֑ן ו/ישבי יְרֽוּשָׁלִָֽם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/009.yaml
  text: Then they came to Hilkiah the high priest and gave the money that had been brought into the house of God[a], which the Levites, the keepers of the threshold, had collected from Manasseh and Ephraim and from all the remnant of Israel, and from all Judah and Benjamin and the inhabitants of Jerusalem.
translation:
  language: pt
  text: Então foram até Hilquias, o sumo sacerdote, e lhe entregaram o dinheiro que havia sido levado à casa de Deus, que os levitas, guardiões do umbral[a], haviam recolhido de Manassés e Efraim, de todo o remanescente de Israel, de todo Judá e Benjamim e dos habitantes de Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os porteiros” ou “os guardiões das portas”; literalmente, “os guardiões do umbral”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Então foram
  rationale: O wayyiqtol dá continuidade à narrativa; “Então” preserva a sequência, e “foram até” é natural em português para o movimento em direção a uma pessoa.
- source_word: חִלְקִיָּהוּ
  choice: Hilquias
  rationale: Forma portuguesa tradicional e amplamente reconhecível do nome hebraico.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: o sumo sacerdote
  rationale: Expressão consagrada em português para o principal ofício sacerdotal, equivalente ao sentido contextual de “o grande sacerdote”.
- source_word: וַיִּתְּנוּ
  choice: e lhe entregaram
  rationale: No contexto de fundos confiados ao sacerdote, “entregaram” exprime com naturalidade a transferência; o pronome explicita o destinatário já indicado pelo hebraico.
- source_word: הַכֶּסֶף
  choice: o dinheiro
  rationale: Embora כֶּסֶף também signifique “prata”, aqui designa recursos monetários destinados à casa de Deus.
- source_word: הַמּוּבָא
  choice: que havia sido levado
  rationale: O particípio passivo descreve dinheiro previamente levado à casa de Deus; a forma verbal portuguesa deixa clara essa anterioridade.
- source_word: בֵית אֱלֹהִים
  choice: à casa de Deus
  rationale: Mantém a imagem e a formulação do hebraico, sem substituí-las interpretativamente por “templo”.
- source_word: אָסְפוּ
  choice: tinha sido recolhido
  rationale: A voz passiva na frase portuguesa evita uma ligação sintática enganosa e comunica que os levitas haviam recolhido esses recursos antes de sua entrega.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: Designação padrão em português para o grupo tribal e ministerial.
- source_word: שֹׁמְרֵי הַסַּף
  choice: que guardavam o umbral
  rationale: Preserva a imagem literal do hebraico, enquanto a nota apresenta as designações funcionais mais usuais.
- source_word: מִיַּד
  choice: entre os habitantes de
  rationale: O idioma hebraico, literalmente “da mão de”, indica a origem da coleta. Com nomes territoriais/tribais, “entre os habitantes de” torna o referente humano claro em português sem reproduzir um hebraísmo obscuro.
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: o remanescente de Israel
  rationale: Preserva tanto o sentido daqueles que restaram quanto a possível ressonância teológica de שְׁאֵרִית, sem a impor.
- source_word: וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: e dos habitantes de Jerusalém
  rationale: Traduz o sentido contextual da forma textual como referência aos moradores de Jerusalém e mantém o paralelismo da lista.
theological_decisions:
- issue: Possível nuance teológica de שְׁאֵרִית (“remanescente”)
  choice: o remanescente de Israel
  alternative: o restante de Israel
  rationale: “Remanescente” traduz naturalmente o termo e conserva sua possível ressonância pactual em Crônicas, sem afirmar além do contexto que se trata de israelitas restantes das tribos do norte.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A segunda oração foi iniciada como nova frase para evitar uma longa cadeia de relativas e deixar clara a relação entre a entrega, a entrada dos recursos na casa de Deus e a coleta anterior. O marcador da nota foi colocado junto a “umbral”, expressão à qual a nota lexical efetivamente se refere.
