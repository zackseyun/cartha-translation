revisions:
- from: Então foram até Hilquias, o sumo sacerdote, e lhe entregaram o dinheiro que havia sido levado à casa de Deus. Esse dinheiro tinha sido recolhido pelos levitas que guardavam o umbral[a], entre os habitantes de Manassés e Efraim, de todo o remanescente de Israel, de todo Judá e Benjamim e dos habitantes de Jerusalém.
  to: Então foram até Hilquias, o sumo sacerdote, e lhe entregaram o dinheiro que havia sido levado à casa de Deus, que os levitas, guardiões do umbral[a], haviam recolhido de Manassés e Efraim, de todo o remanescente de Israel, de todo Judá e Benjamim e dos habitantes de Jerusalém.
  rationale: A revisão substitui a paráfrase interpretativa “entre os habitantes de” por “de”, que reproduz de modo natural o valor de procedência de מִיַּד e se aplica uniformemente à lista inteira. Também reintegra a oração relativa para explicitar a relação entre o dinheiro entregue e a coleta feita pelos levitas, preservando a sequência e a sintaxe do texto hebraico.
