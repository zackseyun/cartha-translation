base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/003.yaml
  text: In the eighth year of his reign[a], while he was still a youth, he began to seek the God of David his father; and in the twelfth year he began to cleanse Judah and Jerusalem from the high places, the Asherim, the carved images[c][b], and the metal images.
translation:
  language: pt
  text: No oitavo ano de seu reinado, quando ainda era jovem, começou a buscar o Deus de Davi, seu pai[a]; e, no décimo segundo ano, começou a purificar Judá e Jerusalém dos lugares altos, dos símbolos de Aserá[b], das imagens esculpidas e das imagens fundidas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu antepassado”. “Pai” é usado aqui no sentido dinástico, referindo-se a Davi como antepassado de Josias.
    reason: lexical_alternative
  - marker: b
    text: Ou “os postes de Aserá”. O termo hebraico pode designar objetos de culto associados a Aserá, muitas vezes postes de madeira ou árvores sagradas.
    reason: lexical_alternative
  - marker: c
    text: Ou “imagens de metal fundido”. O termo hebraico se refere a imagens feitas por fundição.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁמוֹנֶה שָׁנִים לְמָלְכוֹ
  choice: No oitavo ano de seu reinado
  rationale: A construção temporal com ב e a referência ao reinado são expressas de modo natural e preciso em português.
- source_word: וְהוּא עוֹדֶנּוּ נַעַר
  choice: quando ainda era jovem
  rationale: נַעַר pode designar menino, jovem ou jovem adulto; “jovem” preserva a amplitude adequada ao contexto, e “ainda” representa עוֹדֶנּוּ.
- source_word: הֵחֵל לִדְרֹשׁ
  choice: começou a buscar
  rationale: דרשׁ, tendo Deus como objeto, indica busca religiosa e devocional, não mera investigação.
- source_word: לֵאלֹהֵי דָּוִיד אָבִיו
  choice: o Deus de Davi, seu pai
  rationale: Mantém a linguagem dinástica do hebraico; a nota esclarece que “pai” aqui significa antepassado.
- source_word: וּבִשְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: e, no décimo segundo ano
  rationale: O contexto mantém como referência o ano do reinado, sem necessidade de repetição no texto.
- source_word: הֵחֵל לְטַהֵר
  choice: começou a purificar
  rationale: טהר envolve a eliminação da impureza cultual; “purificar” conserva essa dimensão religiosa e é natural em português.
- source_word: מִן הַבָּמוֹת
  choice: removendo os santuários nos lugares altos
  rationale: במות designa locais de culto, muitas vezes elevados; a explicitação evita que “lugares altos” seja entendido apenas em sentido geográfico.
- source_word: וְהָאֲשֵׁרִים
  choice: os símbolos de Aserá
  rationale: O plural pode referir-se a postes, árvores ou outros objetos cultuais associados a Aserá; “símbolos” preserva essa incerteza material.
- source_word: וְהַפְּסִלִים
  choice: as imagens esculpidas
  rationale: פסילים são imagens produzidas por entalhe ou escultura; a tradução mantém esse aspecto da fabricação.
- source_word: וְהַמַּסֵּכוֹת
  choice: as imagens de metal fundido
  rationale: מסכות refere-se a imagens fabricadas por fundição; a formulação é clara e tecnicamente específica em português.
theological_decisions:
- issue: Linguagem ancestral em “Davi, seu pai”
  choice: Manter “pai” no texto principal
  alternative: “antepassado”
  rationale: O hebraico emprega linguagem dinástica normal, que liga Josias à linhagem davídica. A nota impede que o leitor entenda Davi como pai imediato sem apagar o idioma bíblico.
- issue: Natureza dos אֲשֵׁרִים
  choice: “símbolos de Aserá”
  alternative: “postes de Aserá”
  rationale: A forma física exata dos objetos cultuais não é certa; a tradução principal evita restringi-los necessariamente a postes, enquanto a nota registra essa possibilidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe acompanha a progressão temporal hebraica. Termos cultuais são explicitados apenas o suficiente para a compreensão, sem eliminar ambiguidades reais.
