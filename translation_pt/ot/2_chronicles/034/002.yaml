base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/002.yaml
  text: He did what was right in the eyes of Yahweh[a], and walked in the ways of David his father[b]; he did not turn aside to the right or to the left.
translation:
  language: pt
  text: Ele fez o que era certo aos olhos de Yahweh[a] e andou nos caminhos de Davi, seu pai[b]; não se desviou nem para a direita nem para a esquerda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à vista de Yahweh”.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “pai” é usado no sentido dinástico de antepassado.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: fez o que era certo
  rationale: O verbo עשה tem sentido amplo, e o adjetivo substantivado הַיָּשָׁר expressa aquilo que é reto ou correto. A formulação é natural em português e preserva a avaliação moral da fórmula régia.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Mantém a imagem do idioma hebraico de avaliação divina e permanece clara em português.
- source_word: וַיֵּלֶךְ בְּדַרְכֵי
  choice: andou nos caminhos de
  rationale: Preserva a metáfora hebraica de caminhar como modo de viver ou agir, corrente e compreensível no registro bíblico em português.
- source_word: דָּוִיד אָבִיו
  choice: Davi, seu pai
  rationale: Reproduz a aposição hebraica e conserva o uso dinástico de אָב, que pode designar um antepassado; uma nota esclarece esse sentido.
- source_word: וְלֹא סָר
  choice: não se desviou
  rationale: סור indica afastar-se ou desviar-se de um caminho. Esta escolha se integra naturalmente à metáfora dos caminhos.
- source_word: יָמִין וּשְׂמֹאול
  choice: nem para a direita nem para a esquerda
  rationale: Expressa com naturalidade o idioma fixo de não se desviar em direção alguma e conserva a imagem espacial do hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. A transliteração Yahweh preserva o nome próprio, enquanto SENHOR representa a tradição de substituição reverencial; a nota registra a alternativa de formulação sem ocultar a identidade do termo-fonte.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A tradução conserva as metáforas hebraicas de olhos, caminhos e desvio, sem tornar a frase artificial.
