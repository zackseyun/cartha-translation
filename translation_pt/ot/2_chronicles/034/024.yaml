base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/024.yaml
  text: 'Thus says Yahweh: Behold[b][a], I am bringing disaster on this place and on its inhabitants—all the curses written in the book that they have read before the king of Judah.'
translation:
  language: pt
  text: 'Assim diz Yahweh: “Eis que trarei calamidade sobre este lugar e seus habitantes — todas as maldições[a] escritas no livro[b] que leram perante o rei de Judá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todas as maldições de juramento”, expressão que destaca sanções da aliança vinculadas a juramentos.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “livro”; o termo também pode designar um rolo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, distinguindo-o do título “Senhor” e preservando a identificação explícita presente no hebraico.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Mantém de forma concisa e solene a fórmula profética de mensageiro.
- source_word: הִנְנִי מֵבִיא
  choice: Eis que trarei
  rationale: “Eis que” conserva a força enfática do anúncio; o futuro em português expressa naturalmente a ação divina iminente indicada pela construção hebraica.
- source_word: רָעָה
  choice: desgraça
  rationale: No contexto, designa uma calamidade punitiva, não o mal moral. “Desgraça” preserva a gravidade do juízo e soa natural em português.
- source_word: הַמָּקוֹם הַזֶּה
  choice: este lugar
  rationale: Tradução direta que evita especificar Jerusalém ou Judá além do que o próprio versículo declara.
- source_word: יוֹשְׁבָיו
  choice: seus habitantes
  rationale: Expressa de modo claro e idiomático o particípio substantivado com sufixo possessivo.
- source_word: אֵת כָּל הָאָלוֹת
  choice: todas as maldições
  rationale: אָלָה se refere aqui às maldições ligadas às sanções da aliança; “maldições” é claro no texto principal, enquanto a nuance de juramento é registrada em nota.
- source_word: הַכְּתוּבוֹת עַל הַסֵּפֶר
  choice: escritas no livro
  rationale: “No livro” é a forma idiomática de indicar o conteúdo registrado no documento; a possibilidade material de um rolo é preservada em nota.
- source_word: אֲשֶׁר קָרְאוּ לִפְנֵי
  choice: que leram perante
  rationale: Preserva o verbo ativo no plural e traduz לִפְנֵי como leitura feita na presença do rei, sem transformar a construção em passiva.
- source_word: מֶלֶךְ יְהוּדָה
  choice: o rei de Judá
  rationale: Correspondência direta e natural da cadeia construta hebraica.
theological_decisions:
- issue: Sentido de רָעָה no juízo divino
  choice: desgraça
  alternative: mal; calamidade
  rationale: O contexto é o cumprimento das sanções da aliança. “Desgraça” comunica o dano e a severidade do juízo sem sugerir que Deus pratique o mal moral.
- issue: Natureza de הָאָלוֹת
  choice: maldições
  alternative: maldições de juramento
  rationale: O termo pode carregar a nuance técnica de sanções invocadas sob juramento. O texto principal usa a forma comum e inteligível, e a nota preserva a dimensão pactual sem impor terminologia técnica ao leitor.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A fórmula profética mantém elevação moderada por meio de “Assim diz” e “Eis que”. O travessão explicita que as maldições constituem a desgraça anunciada, sem eliminar a relação sintática do hebraico.
