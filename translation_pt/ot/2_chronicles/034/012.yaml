base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/012.yaml
  text: And the men were working faithfully in the work[a], and over them were appointed Jahath and Obadiah the Levites, from the sons of Merari, and Zechariah and Meshullam, from the sons of the Kohathites, to oversee; and the Levites[b], all who were skilled with musical instruments.
translation:
  language: pt
  text: Os homens trabalhavam fielmente na obra. À frente deles foram designados Jaate e Obadias, levitas dentre os descendentes de Merari, e Zacarias e Mesulão, dentre os descendentes dos coatitas, para supervisionar; e os levitas — todos hábeis com instrumentos musicais.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «e os levitas, todos os que entendiam de instrumentos de música». A relação sintática exata desta cláusula com a frase anterior não é explícita.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: בֶּאֱמוּנָה
  choice: fielmente
  rationale: O substantivo funciona adverbialmente e descreve a confiabilidade e integridade com que os trabalhadores executavam a tarefa, não uma crença subjetiva.
- source_word: בַּמְּלָאכָה
  choice: o trabalho
  rationale: Refere-se à tarefa em andamento, isto é, à obra de reparação do templo; a formulação é clara e natural em português.
- source_word: מֻפְקָדִים
  choice: encarregados
  rationale: O particípio passivo indica que essas pessoas haviam sido designadas para uma responsabilidade.
- source_word: מִן בְּנֵי מְרָרִי
  choice: descendentes de Merari
  rationale: Expressa naturalmente em português a relação genealógica e a identidade do clã contidas em 'dos filhos de Merari'.
- source_word: מִן בְּנֵי הַקְּהָתִים
  choice: descendentes dos coatitas
  rationale: Mantém tanto a linguagem genealógica quanto o gentílico de clã presente no hebraico.
- source_word: לְנַצֵּחַ
  choice: de supervisionar
  rationale: Neste contexto administrativo, o verbo designa direção ou supervisão da obra, não necessariamente liderança musical.
- source_word: כָּל מֵבִין
  choice: todos hábeis
  rationale: O particípio denota compreensão prática ou competência; 'hábeis' comunica essa capacidade de modo conciso.
- source_word: בִּכְלֵי שִׁיר
  choice: no uso de instrumentos musicais
  rationale: A expressão literalmente relacionada a 'instrumentos de canto/música' refere-se a instrumentos empregados na execução musical.
theological_decisions:
- issue: Relação sintática da cláusula final sobre os levitas músicos
  choice: Mantê-la como acréscimo coordenado aos encarregados mencionados
  alternative: 'Tratá-la como frase independente e elíptica: ''E os levitas — todos hábeis com instrumentos musicais'''
  rationale: O hebraico termina com uma cláusula nominal de ligação sintática pouco explícita. A tradução preserva sua associação provável com o grupo encarregado sem atribuir aos músicos uma função teológica não declarada.
translation_notes:
  register: Português moderno, digno e acessível, com formas bíblicas correntes dos nomes próprios. A ordem foi levemente ajustada para clareza, preservando o caráter passivo da nomeação e sinalizando em nota a ambiguidade da cláusula final.
