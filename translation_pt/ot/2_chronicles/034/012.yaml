revisions:
- from: Os homens realizavam fielmente o trabalho. Encarregados de supervisioná-los estavam Jaate e Obadias, levitas descendentes de Merari, e Zacarias e Mesulão, descendentes dos coatitas; além dos levitas, todos hábeis no uso de instrumentos musicais.[a]
  to: Os homens trabalhavam fielmente na obra. À frente deles foram designados Jaate e Obadias, levitas dentre os descendentes de Merari, e Zacarias e Mesulão, dentre os descendentes dos coatitas, para supervisionar; e os levitas — todos hábeis com instrumentos musicais.[a]
  rationale: A revisão remove a adição interpretativa de «além dos», melhora a expressão da designação dos supervisores e conserva, por meio de travessões e nota, a cláusula final elíptica do hebraico. Não resolve além do necessário a relação entre os levitas músicos e os supervisores mencionados.
