  text: וַ/יְנַתְּצ֣וּ לְ/פָנָ֗י/ו אֵ֚ת מִזְבְּח֣וֹת הַ/בְּעָלִ֔ים וְ/הַֽ/חַמָּנִ֛ים אֲשֶׁר לְ/מַ֥עְלָ/ה מֵ/עֲלֵי/הֶ֖ם גִּדֵּ֑עַ וְ֠/הָ/אֲשֵׁרִים וְ/הַ/פְּסִלִ֤ים וְ/הַ/מַּסֵּכוֹת֙ שִׁבַּ֣ר וְ/הֵדַ֔ק וַ/יִּזְרֹק֙ עַל פְּנֵ֣י הַ/קְּבָרִ֔ים הַ/זֹּבְחִ֖ים לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/004.yaml
  text: They tore down before him the altars of the Baals[a], and he cut down the incense altars that were above them. He shattered and crushed the Asherim, the carved images, and the metal images[b], and scattered them over the graves of those who had sacrificed to them.
translation:
  language: pt
  text: Diante dele, derrubaram os altares dos baalins; e ele cortou os pilares solares[a] que ficavam acima deles. Quebrou e reduziu a pó os aserins[b], as imagens esculpidas e as imagens de metal fundido, e espalhou o pó sobre as sepulturas dos que lhes ofereciam sacrifícios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “altares de incenso”. O termo hebraico é incerto e pode designar objetos cúlticos associados ao culto solar.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “postes de Aserá”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַתְּצוּ
  choice: derrubaram
  rationale: Preserva o sujeito plural expresso no hebraico e comunica naturalmente a demolição de estruturas.
- source_word: לְפָנָיו
  choice: Diante dele
  rationale: Mantém o sentido de que a ação ocorreu na presença de Josias.
- source_word: מִזְבְּחוֹת הַבְּעָלִים
  choice: os altares dos baalins
  rationale: O plural hebraico é preservado; “baalins” designa as diversas manifestações ou representações locais de Baal.
- source_word: הַחַמָּנִים
  choice: os pilares solares
  rationale: O termo designa objetos cúlticos, provavelmente pilares ligados ao culto solar. Como sua identificação exata é incerta, a alternativa é registrada em nota.
- source_word: אֲשֶׁר לְמַעְלָה מֵעֲלֵיהֶם
  choice: que ficavam acima deles
  rationale: A oração relativa é ligada aos pilares e conserva sua relação espacial com os altares.
- source_word: גִּדֵּעַ
  choice: cortou
  rationale: Expressa o ato de decepar ou derrubar à força os objetos cúlticos, sem acrescentar uma forma não indicada pelo texto.
- source_word: הָאֲשֵׁרִים
  choice: os aserins
  rationale: A transliteração do plural preserva a ambiguidade entre postes cúlticos e outros objetos associados a Aserá.
- source_word: הַפְּסִלִים
  choice: as imagens esculpidas
  rationale: Representa especificamente imagens cúlticas produzidas por entalhe, em vez do termo mais amplo “ídolos”.
- source_word: הַמַּסֵּכוֹת
  choice: as imagens de metal fundido
  rationale: Torna explícito que se trata de imagens moldadas por fundição, sentido próprio do termo hebraico.
- source_word: שִׁבַּר וְהֵדַק
  choice: Quebrou e reduziu a pó
  rationale: Reproduz a sequência enfática dos verbos e a ideia de redução dos objetos a partículas pequenas.
- source_word: וַיִּזְרֹק עַל פְּנֵי הַקְּבָרִים
  choice: e espalhou o pó sobre as sepulturas
  rationale: “Espalhou” é natural no contexto; “o pó” explicita o resultado da ação anterior sem alterar o referente.
- source_word: הַזֹּבְחִים לָהֶם
  choice: dos que lhes ofereciam sacrifícios
  rationale: Conserva o particípio e o pronome plural, referindo-se aos que sacrificavam àquelas entidades ou imagens.
theological_decisions:
- issue: Identificação de הַחַמָּנִים
  choice: pilares solares
  alternative: altares de incenso
  rationale: A ligação com o culto solar é lexicalmente plausível, mas a natureza exata desses objetos permanece incerta; a nota mantém a alternativa contextual sem transformar hipótese em certeza.
- issue: Tradução de הָאֲשֵׁרִים
  choice: aserins
  alternative: postes de Aserá
  rationale: A transliteração evita restringir o termo a uma reconstrução material específica e preserva sua possível referência mais ampla a objetos cúlticos associados a Aserá.
- issue: Plural de הַבְּעָלִים
  choice: baalins
  alternative: Baal
  rationale: O plural do texto pode apontar para manifestações locais ou representações cúlticas distintas; mantê-lo evita harmonização indevida com o nome singular da divindade.
translation_notes:
  register: Português atual, digno e de leitura ampla, com sintaxe direta. Foram mantidos termos transliterados quando uma tradução descritiva restringiria indevidamente a ambiguidade do hebraico; as notas oferecem equivalentes interpretativos.
