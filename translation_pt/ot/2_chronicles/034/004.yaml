  source_fidelity: 'O texto preserva adequadamente a estrutura e o sentido do hebraico: o primeiro verbo permanece no plural (“derrubaram”), seguido pelo singular referente a Josias (“ele cortou”); os altares dos baalins, os objetos designados por ḥammanim, os aserins, as imagens esculpidas e as imagens fundidas são mantidos distintos. “Reduziu a pó” e “espalhou o pó” exprimem de modo plausível a sequência שִׁבַּר וְהֵדַק e a dispersão subsequente sobre as sepulturas. A identificação de הַחַמָּנִים é disputada, e a opção “pilares solares”, acompanhada de nota que registra “altares de incenso”, preserva devidamente essa incerteza.'
