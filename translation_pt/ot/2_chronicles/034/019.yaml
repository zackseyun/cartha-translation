  text: וַ/יְהִי֙ כִּ/שְׁמֹ֣עַ הַ/מֶּ֔לֶךְ אֵ֖ת דִּבְרֵ֣י הַ/תּוֹרָ֑ה וַ/יִּקְרַ֖ע אֶת בְּגָדָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/019.yaml
  text: And when the king heard the words of the law[a], he tore his clothes.
translation:
  language: pt
  text: Quando o rei ouviu as palavras da Lei[a], rasgou as suas roupas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “instrução”. O termo hebraico torá pode designar instrução em sentido mais amplo, embora aqui se refira à lei da aliança que estava sendo lida diante do rei.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Quando ... ouviu
  rationale: A construção narrativa com וַיְהִי seguida de כְּ e infinitivo expressa a circunstância temporal. Em português atual, “Quando ... ouviu” comunica naturalmente a sequência sem reproduzir uma fórmula arcaica.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Mantém o título definido do hebraico. Embora o contexto identifique Josias, o nome não é acrescentado ao texto.
- source_word: דִּבְרֵי
  choice: as palavras da
  rationale: O plural construto de דָּבָר designa aqui o conteúdo lido e ouvido; “as palavras” é direto e natural.
- source_word: הַתּוֹרָה
  choice: Lei
  rationale: תּוֹרָה pode significar instrução em sentido amplo, mas neste contexto se refere ao corpo pactual e legal lido diante do rei. “Lei” é a tradução consagrada e clara; a nota preserva a amplitude lexical.
- source_word: וַיִּקְרַע
  choice: rasgou
  rationale: קָרַע designa o ato de rasgar a roupa como sinal convencional de aflição, consternação ou arrependimento. “Rasgou” é exato e digno.
- source_word: בְּגָדָיו
  choice: as suas roupas
  rationale: בֶּגֶד é um termo geral para peças de roupa. “As suas roupas” é atual e evita a especificidade indevida de “vestes reais” ou “mantos”.
theological_decisions:
- issue: Tradução de תּוֹרָה no contexto da reforma de Josias
  choice: Lei
  alternative: instrução; Torá
  rationale: O contexto aponta para o conteúdo pactual e legal do livro encontrado. “Lei” comunica essa função sem definir de modo indevidamente estreito a extensão exata do livro, enquanto a nota registra o sentido mais amplo possível de תּוֹרָה.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A ordem foi ajustada à sintaxe natural do português, sem perder a relação temporal nem o gesto enfático do original.
