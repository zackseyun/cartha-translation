  text: וַ/יִּשְׁלַ֖ח הַ/מֶּ֑לֶךְ וַ/יֶּאֱסֹ֕ף אֶת כָּל זִקְנֵ֥י יְהוּדָ֖ה וִ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/029.yaml
  text: Then the king sent and gathered all the elders of Judah and Jerusalem[a].
translation:
  language: pt
  text: Então o rei mandou chamar todos os anciãos de Judá e de Jerusalém e os reuniu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Então o rei enviou e reuniu todos os anciãos de Judá e de Jerusalém”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mandou reunir
  rationale: O verbo שׁלח significa literalmente “enviou” ou “mandou”. Ligado à ação seguinte, expressa de modo natural em português que o rei deu ordem para convocar os anciãos, sem especificar o meio usado.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Mantém o substantivo definido do hebraico. Embora o contexto identifique o rei como Josias, o versículo emprega o título.
- source_word: וַיֶּאֱסֹף
  choice: reunir
  rationale: אָסף significa “reunir”, “ajuntar”. A construção “mandou reunir” integra naturalmente em português as duas ações coordenadas do hebraico.
- source_word: אֶת כָּל
  choice: todos
  rationale: אֶת marca o objeto direto e não recebe tradução independente; כָּל preserva a abrangência total da convocação.
- source_word: זִקְנֵי
  choice: os anciãos
  rationale: Neste contexto, זָקֵן designa autoridades reconhecidas da comunidade, e não apenas homens idosos. “Anciãos” conserva essa função institucional.
- source_word: יְהוּדָה וִירוּשָׁלִָם
  choice: de Judá e de Jerusalém
  rationale: A repetição de “de” torna claro e natural em português que os anciãos pertenciam tanto a Judá quanto a Jerusalém.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação idiomática “mandou reunir” evita a sequência pouco natural “enviou e reuniu”, enquanto a nota preserva a forma coordenada do hebraico.
