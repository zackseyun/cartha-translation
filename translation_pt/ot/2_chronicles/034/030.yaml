  text: וַ/יַּ֣עַל הַ/מֶּ֣לֶךְ בֵּית יְ֠הוָה וְ/כָל אִ֨ישׁ יְהוּדָ֜ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִַ֗ם וְ/הַ/כֹּֽהֲנִים֙ וְ/הַ/לְוִיִּ֔ם וְ/כָל הָ/עָ֖ם מִ/גָּד֣וֹל וְ/עַד קָטָ֑ן וַ/יִּקְרָ֣א בְ/אָזְנֵי/הֶ֗ם אֶת כָּל דִּבְרֵי֙ סֵ֣פֶר הַ/בְּרִ֔ית הַ/נִּמְצָ֖א בֵּ֥ית יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/030.yaml
  text: Then the king went up to the house of Yahweh[a], and every man of Judah, and the inhabitants of Jerusalem, and the priests and the Levites, and all the people, from great to small[b]; and he read in their hearing all the words of the book of the covenant that had been found in the house of Yahweh.
translation:
  language: pt
  text: Então o rei subiu à casa de Yahweh[a], junto com todos os homens de Judá[b], os habitantes de Jerusalém, os sacerdotes, os levitas e todo o povo, do maior ao menor. E leu em voz alta para eles todas as palavras do livro da aliança que havia sido encontrado na casa de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh é a representação do nome divino YHWH, também tradicionalmente traduzido por «SENHOR».
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «cada homem de Judá», expressão usada em sentido distributivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: subiu
  rationale: Preserva o sentido direcional de עלה, adequado à subida à casa de Yahweh, sem recorrer ao mais solene e menos corrente «ascendeu».
- source_word: בֵּית יְהוָה
  choice: casa de Yahweh
  rationale: Mantém a expressão hebraica literal «casa de YHWH»; «templo de Yahweh» seria claro, mas reduziria a correspondência lexical.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: כָל אִישׁ יְהוּדָה
  choice: todos os homens de Judá
  rationale: Expressa em português natural o singular distributivo hebraico, literalmente «cada homem de Judá», preservando sua linguagem masculina.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: os habitantes de Jerusalém
  rationale: Equivalente coletivo claro e corrente para «os que habitavam em Jerusalém».
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Designação portuguesa padrão para o grupo cultual.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: Designação portuguesa padrão do grupo tribal e cultual.
- source_word: כָל הָעָם
  choice: todo o povo
  rationale: Preserva a abrangência da expressão coletiva hebraica em português idiomático.
- source_word: מִגָּדוֹל וְעַד קָטָן
  choice: do maior ao menor
  rationale: Reproduz de modo conciso o merismo hebraico que abrange todas as posições sociais.
- source_word: וַיִּקְרָא בְאָזְנֵיהֶם
  choice: leu em voz alta para eles
  rationale: Torna explícito o sentido contextual de קרא e comunica naturalmente a expressão idiomática «aos ouvidos deles».
- source_word: כָּל דִּבְרֵי סֵפֶר הַבְּרִית
  choice: todas as palavras do livro da aliança
  rationale: Conserva a ênfase textual de דִּבְרֵי em «palavras» e traduz diretamente a designação do documento.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama. «Yahweh» preserva o caráter de nome pessoal e evita substituí-lo pelo título «SENHOR».
- issue: Linguagem masculina em כָל אִישׁ יְהוּדָה
  choice: todos os homens de Judá
  alternative: todo o povo de Judá; todos de Judá
  rationale: O hebraico emprega אִישׁ, «homem», distributivamente. A tradução preserva esse dado, enquanto a menção posterior a «todo o povo» mantém a abrangência mais ampla da assembleia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A sintaxe foi levemente reorganizada com «junto com» para tornar clara a companhia do rei, sem alterar a coordenação do hebraico. «Leu em voz alta para eles» comunica em linguagem corrente o idioma hebraico «leu aos ouvidos deles».
