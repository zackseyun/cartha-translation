  text: הִנְ/נִ֨י אֹֽסִפְ/ךָ֜ אֶל אֲבֹתֶ֗י/ךָ וְ/נֶאֱסַפְתָּ֣ אֶל קִבְרֹתֶי/ךָ֮ בְּ/שָׁלוֹם֒ וְ/לֹא תִרְאֶ֣ינָה עֵינֶ֔י/ךָ בְּ/כֹל֙ הָֽ/רָעָ֔ה אֲשֶׁ֨ר אֲנִ֥י מֵבִ֛יא עַל הַ/מָּק֥וֹם הַ/זֶּ֖ה וְ/עַל יֹשְׁבָ֑י/ו וַ/יָּשִׁ֥יבוּ אֶת הַ/מֶּ֖לֶךְ דָּבָֽר־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/028.yaml
  text: Behold[a], I am about to gather you to your fathers, and you will be gathered to your graves in peace[c][b], and your eyes will not see all the disaster that I am bringing on this place and on its inhabitants.’ And they brought back word to the king.
translation:
  language: pt
  text: “Eis que vou reunir você aos seus pais[a], e você será recolhido aos seus túmulos[b] em paz[c]. Seus olhos não verão toda a calamidade que trarei sobre este lugar e sobre os seus habitantes.” E eles levaram a resposta ao rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos seus antepassados”. O hebraico diz literalmente “aos seus pais”, expressão comum para a união com os antepassados na morte.
    reason: lexical_alternative
  - marker: b
    text: Ou “ao seu túmulo”. O hebraico emprega o plural, possivelmente em referência aos túmulos dos antepassados ou ao local de sepultamento da família.
    reason: source_form
  - marker: c
    text: “Em paz” provavelmente indica que Josias seria poupado de ver a calamidade que viria, como explica a frase seguinte; não significa necessariamente que sua morte ocorreria sem violência.
    reason: cross_reference
lexical_decisions:
- source_word: הִנְנִי
  choice: Eis que vou
  rationale: Preserva o marcador discursivo solene e expressa a força futura iminente da construção hebraica.
- source_word: אֹסִפְךָ אֶל אֲבֹתֶיךָ
  choice: reunir você aos seus pais
  rationale: Mantém a metáfora hebraica convencional de juntar-se aos antepassados na morte; a nota esclarece o sentido de “pais”.
- source_word: וְנֶאֱסַפְתָּ אֶל קִבְרֹתֶיךָ
  choice: você será recolhido aos seus túmulos
  rationale: Conserva a voz passiva, a ligação lexical com o verbo anterior e o plural קִבְרֹתֶיךָ, que pode apontar para os sepulcros da família ou dos antepassados.
- source_word: בְּשָׁלוֹם
  choice: em paz
  rationale: Formulação ampla que preserva a tensão com a posterior morte de Josias em batalha, sem restringir a promessa a uma morte não violenta.
- source_word: וְלֹא תִרְאֶינָה עֵינֶיךָ
  choice: Seus olhos não verão
  rationale: Retém a expressão corporal explícita e enfática do hebraico.
- source_word: בְּכֹל הָרָעָה
  choice: toda a calamidade
  rationale: Neste contexto de juízo, רָעָה designa desgraça ou calamidade, não necessariamente mal moral.
- source_word: אֲשֶׁר אֲנִי מֵבִיא
  choice: que trarei
  rationale: O futuro natural em português comunica a ação divina iminente e decidida indicada pelo particípio hebraico.
- source_word: עַל הַמָּקוֹם הַזֶּה וְעַל יֹשְׁבָיו
  choice: sobre este lugar e sobre os seus habitantes
  rationale: Tradução clara e formalmente próxima da construção hebraica.
- source_word: וַיָּשִׁיבוּ אֶת הַמֶּלֶךְ דָּבָר
  choice: E eles levaram a resposta ao rei
  rationale: Expressa naturalmente o idioma hebraico referente ao retorno com uma mensagem ou resposta.
theological_decisions:
- issue: Sentido da promessa “em paz” diante da posterior morte de Josias em batalha
  choice: Manter “em paz” e explicar que a expressão se relaciona, no contexto imediato, ao fato de Josias não presenciar a calamidade anunciada.
  alternative: Entender a frase como previsão de uma morte exteriormente pacífica ou apenas de um sepultamento honroso.
  rationale: A oração seguinte explica a promessa em termos de não ver o juízo vindouro. A tradução preserva a tensão narrativa sem impor uma harmonização.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Eis que” conserva a solenidade profética; “reunir/recolhido” preserva a repetição e a imagem do original. Os marcadores [a], [b] e [c] aparecem junto às expressões que explicam.
