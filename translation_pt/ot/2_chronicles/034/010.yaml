  text: וַֽ/יִּתְּנ֗וּ עַל יַד֙ עֹשֵׂ֣ה הַ/מְּלָאכָ֔ה הַ/מֻּפְקָדִ֖ים בְּ/בֵ֣ית יְהוָ֑ה וַ/יִּתְּנ֨וּ אֹת֜/וֹ עוֹשֵׂ֣י הַ/מְּלָאכָ֗ה אֲשֶׁ֤ר עֹשִׂים֙ בְּ/בֵ֣ית יְהוָ֔ה לִ/בְדּ֥וֹק וּ/לְ/חַזֵּ֖ק הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/010.yaml
  text: They put it into the hand of the workmen who were appointed over the house of Yahweh[b][a], and the workmen who were working in the house of Yahweh gave it for repairing and strengthening the house.
translation:
  language: pt
  text: Eles o entregaram nas mãos dos trabalhadores encarregados da casa de Yahweh[b], e os trabalhadores que realizavam o trabalho na casa de Yahweh o destinaram à reparação e ao fortalecimento da casa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à restauração e ao reforço da casa”.'
    reason: lexical_alternative
  - marker: b
    text: A “casa de Yahweh” é o templo.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: entregaram / destinaram
  rationale: נתן tem o sentido amplo de dar, pôr ou entregar. Na primeira oração, “entregaram nas mãos” expressa a transferência aos responsáveis; na segunda, “destinaram” comunica naturalmente que os recursos foram repassados para a obra, sem alterar o referente pronominal.
- source_word: עַל יַד
  choice: nas mãos de
  rationale: A expressão idiomática indica que algo foi confiado ao controle ou à responsabilidade de alguém. O plural idiomático é natural em português e conserva a imagem concreta do hebraico.
- source_word: עֹשֵׂה הַמְּלָאכָה הַמֻּפְקָדִים
  choice: os trabalhadores encarregados
  rationale: A formulação reúne a referência aos que realizavam a obra com o particípio passivo que indica terem recebido responsabilidade ou supervisão.
- source_word: בְּבֵית יְהוָה
  choice: da casa de Yahweh / na casa de Yahweh
  rationale: A primeira ocorrência é vertida de acordo com a relação de responsabilidade; a segunda, como localização da atividade. “Casa” preserva a expressão hebraica para o templo.
- source_word: אֹתוֹ
  choice: o
  rationale: O pronome retoma o dinheiro mencionado no contexto anterior, sem acrescentar ao versículo um substantivo que não está expresso no hebraico.
- source_word: עוֹשֵׂי הַמְּלָאכָה אֲשֶׁר עֹשִׂים
  choice: os trabalhadores que atuavam
  rationale: A tradução conserva a ideia contínua dos particípios e evita uma repetição pouco natural em português, como “os trabalhadores que faziam o trabalho”.
- source_word: לִבְדּוֹק
  choice: reparar
  rationale: Embora בדק possa significar examinar em outros contextos, nas passagens sobre obras no templo designa a reparação ou restauração de partes danificadas.
- source_word: וּלְחַזֵּק
  choice: fortalecer
  rationale: O verbo indica tornar a estrutura firme ou segura; “fortalecer” mantém essa noção de maneira direta.
- source_word: הַבָּיִת
  choice: o edifício
  rationale: O substantivo significa literalmente “a casa” e aqui se refere ao templo. “Edifício” evita a repetição ambígua de “casa” e deixa claro que se trata da estrutura física.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino é transliterado como “Yahweh”, preservando o nome pessoal presente no texto hebraico em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR / Jeová
  rationale: O texto contém o nome da aliança; “Yahweh” o representa diretamente e não há neste contexto razão para substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A tradução conserva “casa de Yahweh” na expressão cultual, esclarecida em nota, e usa “edifício” na referência final à estrutura que seria reparada.
