  text: וְ/עַצְמוֹת֙ כֹּֽהֲנִ֔ים שָׂרַ֖ף עַל מזבחותים וַ/יְטַהֵ֥ר אֶת יְהוּדָ֖ה וְ/אֶת יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/005.yaml
  text: He burned the bones of the priests on their altars[a], and he cleansed Judah and Jerusalem.
translation:
  language: pt
  text: Queimou os ossos dos sacerdotes sobre os altares deles[a] e purificou Judá e Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sobre os altares”. A forma hebraica neste ponto é incomum; o sentido é que Josias queimou os ossos dos sacerdotes sobre os altares associados a eles.
    reason: textual_variant
lexical_decisions:
- source_word: וְ/עַצְמוֹת כֹּהֲנִים
  choice: os ossos dos sacerdotes
  rationale: עַצְמוֹת é o plural construto de עֶצֶם e designa ossos literais. כֹּהֲנִים significa simplesmente “sacerdotes”; não se acrescenta “idólatras”, embora o contexto os associe aos lugares de culto condenados.
- source_word: שָׂרַף
  choice: Queimou
  rationale: O qal perfeito na terceira pessoa masculina singular significa “queimou”. A forma verbal sem pronome expresso é natural em português e mantém Josias como sujeito pelo contexto.
- source_word: עַל
  choice: sobre
  rationale: A preposição indica que os ossos foram queimados em cima dos altares. “Sobre” é corrente e digna neste contexto.
- source_word: מזבחותים
  choice: os altares deles
  rationale: A forma hebraica é incomum, mas provavelmente preserva um sentido pronominal, “seus altares”. “Os altares deles” explicita em português que se trata dos altares associados aos sacerdotes, sem ampliar o substantivo.
- source_word: וַ/יְטַהֵר
  choice: e purificou
  rationale: O piel de טהר descreve a remoção da impureza cultual ligada à idolatria. “Purificou” preserva essa dimensão melhor do que uma expressão de mera limpeza física.
- source_word: אֶת יְהוּדָה וְ/אֶת יְרוּשָׁלִָם
  choice: Judá e Jerusalém
  rationale: Os nomes próprios seguem as formas portuguesas tradicionais e funcionam como objetos diretos, indicando a região e sua capital como âmbito da purificação.
theological_decisions:
- issue: Natureza da purificação
  choice: purificação cultual e moral de Judá e Jerusalém da contaminação idólatra
  alternative: purificação apenas cerimonial ou mera limpeza e destruição física
  rationale: Neste contexto de reforma, טהר denota a remoção da contaminação associada ao culto ilícito. “Purificou” conserva a dimensão cultual e moral sem introduzir uma elaboração teológica posterior.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A redação mantém a concisão narrativa do hebraico, conserva “sacerdotes” sem qualificação interpretativa e sinaliza em nota a forma incomum de “altares”.
