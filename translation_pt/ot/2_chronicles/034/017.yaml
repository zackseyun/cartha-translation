  verdict: revise
  source_fidelity: O versículo relata que a prata encontrada na casa de Yahweh foi retirada/desembolsada e entregue aos encarregados e aos que executavam a obra. «Despejaram a prata», embora formalmente próximo de uma possibilidade lexical de נתך, em português sugere derramar ou lançar a prata de modo físico e descontrolado, obscurecendo a transferência administrativa indicada pela continuação. «Retiraram» expressa com clareza o sentido contextual, enquanto a nota preserva a alternativa literal.
  naturalness: A redação revista é moderna, clara e adequada ao registro narrativo-administrativo. «Os que realizavam a obra» é mais fluente e um pouco mais formal que «os que faziam o trabalho», sem reduzir o alcance do hebraico.
  terminology: «Prata», «casa de Yahweh», «supervisores» e «obra» são adequados. Yahweh é mantido de forma consistente. A nota sobre «casa» identifica corretamente o templo, sem substituir a expressão no texto.
