base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/017.yaml
  text: They have poured out the silver that was found in the house of Yahweh and have put it into the hands of the overseers and into the hands of those doing the work[a][b].
translation:
  language: pt
  text: Eles retiraram a prata encontrada na casa de Yahweh e a colocaram nas mãos dos supervisores e dos que realizavam a obra.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, literalmente, “despejaram a prata”. Neste contexto, o verbo hebraico pode indicar retirar ou desembolsar o dinheiro, e não necessariamente fundir a prata.
    reason: lexical_alternative
  - marker: b
    text: A “casa de Yahweh” é o templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּתִּיכוּ
  choice: despejaram
  rationale: O hifil de נתך pode exprimir derramar ou esvaziar. Neste contexto financeiro, indica retirar ou desembolsar a prata recolhida, não necessariamente fundi-la; “despejaram” preserva a imagem concreta e a ambiguidade lexical, esclarecida em nota.
- source_word: הַכֶּסֶף
  choice: a prata
  rationale: כֶּסֶף significa literalmente “prata” e, por extensão, “dinheiro”. “Prata” conserva a forma concreta do texto hebraico e se ajusta aos fundos do templo.
- source_word: הַנִּמְצָא
  choice: encontrada
  rationale: O particípio nifal descreve a prata que foi encontrada. A forma reduzida “encontrada” é clara e natural em português.
- source_word: בְּבֵית יְהוָה
  choice: na casa de Yahweh
  rationale: Mantém a designação hebraica formal do templo como “casa” e conserva o nome divino; uma nota explica a referência ao templo.
- source_word: וַיִּתְּנוּהוּ
  choice: a colocaram
  rationale: O verbo נתן significa dar ou pôr. Com a expressão seguinte, “colocaram nas mãos” comunica naturalmente a transferência da prata aos responsáveis.
- source_word: עַל יַד
  choice: nas mãos de
  rationale: A expressão idiomática hebraica, literalmente relacionada à mão, indica confiar algo à responsabilidade de alguém. A formulação portuguesa preserva a imagem e permanece compreensível.
- source_word: הַמֻּפְקָדִים
  choice: os supervisores
  rationale: O particípio passivo designa os que haviam sido encarregados da supervisão; “supervisores” expressa de modo conciso sua função administrativa.
- source_word: עוֹשֵׂי הַמְּלָאכָה
  choice: os que faziam o trabalho
  rationale: A expressão abrange as pessoas ocupadas na obra sem restringi-las a um ofício específico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino em vez de substituí-lo por um título, sem acrescentar interpretação denominacional.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A sintaxe conserva a imagem hebraica de pôr a prata “nas mãos” dos responsáveis, enquanto “os que faziam o trabalho” evita restringir indevidamente a categoria dos trabalhadores.
