  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יָּ֨סַר יֹֽאשִׁיָּ֜הוּ אֶת כָּל הַ/תּוֹעֵב֗וֹת מִֽ/כָּל הָ/אֲרָצוֹת֮ אֲשֶׁ֣ר לִ/בְנֵ֣י יִשְׂרָאֵל֒ וַֽ/יַּעֲבֵ֗ד אֵ֤ת כָּל הַ/נִּמְצָא֙ בְּ/יִשְׂרָאֵ֔ל לַ/עֲב֖וֹד אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם כָּל יָמָ֕י/ו לֹ֣א סָ֔רוּ מֵֽ/אַחֲרֵ֕י יְהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/033.yaml
  text: And Josiah removed all the abominations from all the lands that belonged to the sons of Israel[a], and he made all who were found in Israel serve Yahweh their God. All his days they did not turn away from following Yahweh[d][c][b], the God of their fathers.
translation:
  language: pt
  text: Josias removeu todas as abominações de todos os territórios pertencentes aos filhos de Israel[a] e fez com que todos os que se encontravam em Israel servissem a Yahweh, o Deus deles.[b] Durante todos os seus dias, eles não deixaram de seguir Yahweh, o Deus de seus pais.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de todas as terras dos filhos de Israel”.'
    reason: lexical_alternative
  - marker: b
    text: 'A forma hebraica é causativa: Josias fez ou levou todos os que estavam em Israel a servir Yahweh.'
    reason: lexical_alternative
  - marker: c
    text: “Seus dias” provavelmente se refere aos dias de Josias; “eles” se refere aos que estavam em Israel.
    reason: referential_ambiguity
lexical_decisions:
- source_word: וַיָּסַר
  choice: removeu
  rationale: O hifil de סור tem aqui sentido causativo de retirar ou eliminar; “removeu” é claro e adequado ao contexto das reformas de Josias.
- source_word: הַתּוֹעֵבוֹת
  choice: abominações
  rationale: O termo תּוֹעֵבוֹת indica coisas ou práticas repugnantes, sobretudo no âmbito da idolatria. “Abominações” conserva a intensidade cultual e pactual do hebraico.
- source_word: מִכָּל הָאֲרָצוֹת אֲשֶׁר לִבְנֵי יִשְׂרָאֵל
  choice: de todos os territórios pertencentes aos filhos de Israel
  rationale: O plural אֲרָצוֹת pode designar terras ou territórios. “Territórios pertencentes” expressa naturalmente a construção com ל e evita sugerir apenas terrenos isolados.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: aos filhos de Israel
  rationale: Mantém a formulação familiar explícita do hebraico, que continua compreensível e digna em português.
- source_word: וַיַּעֲבֵד
  choice: fez com que ... servissem
  rationale: O hifil de עבד é causativo. A formulação preserva a ação efetiva de Josias sem acrescentar a ideia específica de coerção física.
- source_word: כָּל הַנִּמְצָא בְּיִשְׂרָאֵל
  choice: todos os que se encontravam em Israel
  rationale: O particípio nifal נִמְצָא significa literalmente “encontrado”, mas neste contexto se refere aos que estavam ou se achavam em Israel. A escolha é próxima da forma hebraica e natural em português.
- source_word: לַעֲבֹד אֶת יְהוָה אֱלֹהֵיהֶם
  choice: servissem a Yahweh, o Deus deles
  rationale: עבד aplicado a Deus abrange serviço e culto; “servir” preserva esse campo mais amplo. A aposição deixa claro que Yahweh é o Deus deles.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: כָּל יָמָיו
  choice: durante todos os seus dias
  rationale: Reproduz de modo natural a expressão temporal hebraica, cujo referente mais provável é Josias.
- source_word: לֹא סָרוּ מֵאַחֲרֵי יְהוָה
  choice: não deixaram de seguir Yahweh
  rationale: A construção combina a ideia de afastar-se com a de seguir alguém. A tradução comunica lealdade continuada sem o peso pouco natural de “não se desviaram de atrás de”.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: o Deus de seus pais
  rationale: Mantém a fórmula pactual e intergeracional do hebraico, que emprega explicitamente “pais”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto traz o nome pessoal divino; “Yahweh” o representa diretamente, sem substituí-lo por um título.
- issue: Força causativa de וַיַּעֲבֵד
  choice: fez com que ... servissem
  alternative: obrigou ... a servir
  rationale: A forma verbal mostra que Josias causou ou impôs esse serviço. A tradução conserva a causalidade sem especificar além do texto o grau ou o meio da coerção.
- issue: Referente de כָּל יָמָיו
  choice: seus dias, referindo-se provavelmente a Josias
  alternative: os dias de todos os que estavam em Israel
  rationale: O sufixo masculino singular aponta naturalmente para Josias, enquanto o verbo seguinte no plural retoma o povo. A formulação preserva os pronomes do texto e não elimina inteiramente sua transição referencial.
- issue: Termos familiares masculinos
  choice: filhos de Israel / pais
  alternative: israelitas / antepassados
  rationale: As expressões familiares são explícitas no hebraico e permanecem naturais em português; por isso foram conservadas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservam-se “abominações”, “filhos de Israel”, “servir” e “pais” por seu peso lexical e pactual, enquanto a sintaxe foi ajustada para soar natural. O nome divino é apresentado como Yahweh.
