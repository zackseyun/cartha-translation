base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/015.yaml
  text: Then Hilkiah answered and said to Shaphan the scribe[a], “I have found the Book of the Law in the house of Yahweh.” And Hilkiah gave the book to Shaphan.
translation:
  language: pt
  text: 'Então Hilquias tomou a palavra e disse ao escriba Safã: “Encontrei o Livro da Lei[a] na casa de Yahweh.” E Hilquias entregou o livro a Safã.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o rolo da Lei”; o termo hebraico séfer pode designar um livro, documento ou rolo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: tomou a palavra e disse
  rationale: A combinação hebraica introduz uma fala em resposta ou reação, mesmo sem pergunta explícita. A expressão portuguesa preserva essa função discursiva sem sugerir necessariamente que houve uma pergunta.
- source_word: הַסּוֹפֵר
  choice: o escriba
  rationale: סֹפֵר pode designar escriba ou secretário oficial. “Escriba” mantém o termo tradicional e não especifica além do que o contexto permite.
- source_word: סֵפֶר הַתּוֹרָה
  choice: o Livro da Lei
  rationale: סֵפֶר pode ser livro, documento ou rolo, enquanto תּוֹרָה aqui se refere à instrução legal da aliança. “Livro da Lei” é claro, tradicional e adequado ao contexto; a alternativa material “rolo” é preservada em nota.
- source_word: מָצָאתִי
  choice: Encontrei
  rationale: O perfeito hebraico relata uma descoberta concluída e relevante para o momento da fala. Em português narrativo, o pretérito perfeito expressa isso naturalmente.
- source_word: בְּבֵית יְהוָה
  choice: na casa de Yahweh
  rationale: בַּיִת significa literalmente “casa” e, neste contexto, designa o templo. A tradução conserva a expressão hebraica e o nome divino.
- source_word: וַיִּתֵּן ... אֶת־הַסֵּפֶר אֶל שָׁפָן
  choice: entregou o livro a Safã
  rationale: Embora נָתַן seja normalmente “dar”, “entregou” expressa com naturalidade a transferência física do livro a Safã.
- source_word: חִלְקִיָּהוּ / שָׁפָן
  choice: Hilquias / Safã
  rationale: Empregam-se as formas portuguesas tradicionais e reconhecíveis desses nomes hebraicos.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz diretamente o tetragrama. “Yahweh” conserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Sentido de תּוֹרָה
  choice: Lei
  alternative: instrução
  rationale: “Lei” corresponde ao corpus pactual encontrado no templo e mantém a referência reconhecível, sem negar o campo semântico mais amplo de “instrução”.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com nomes bíblicos em formas portuguesas tradicionais. “Tomou a palavra e disse” evita o pouco natural “respondeu e disse” quando não há pergunta explícita, preservando ainda a função narrativa do hebraico.
