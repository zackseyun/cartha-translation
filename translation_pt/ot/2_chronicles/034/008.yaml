  text: וּ/בִ/שְׁנַ֨ת שְׁמוֹנֶ֤ה עֶשְׂרֵה֙ לְ/מָלְכ֔/וֹ לְ/טַהֵ֥ר הָ/אָ֖רֶץ וְ/הַ/בָּ֑יִת שָׁ֠לַח אֶת שָׁפָ֨ן בֶּן אֲצַלְיָ֜הוּ וְ/אֶת מַעֲשֵׂיָ֣הוּ שַׂר הָ/עִ֗יר וְ֠/אֵת יוֹאָ֤ח בֶּן יֽוֹאָחָז֙ הַ/מַּזְכִּ֔יר לְ/חַזֵּ֕ק אֶת בֵּ֖ית יְהוָ֥ה אֱלֹהָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/008.yaml
  text: In the eighteenth year of his reign[a], when he had cleansed the land and the house, he sent Shaphan son of Azaliah, Maaseiah the governor of the city, and Joah son of Joahaz, the recorder[b], to repair the house of Yahweh his God.
translation:
  language: pt
  text: No décimo oitavo ano do seu reinado, depois de purificar a terra e a Casa[a], ele enviou Safã, filho de Azalias, Maaseias, governador da cidade, e Joá, filho de Joacaz, o secretário, para reparar[b] a Casa de Yahweh, seu Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o templo; em hebraico, literalmente, “a terra e a casa”.
    reason: lexical_alternative
  - marker: b
    text: Ou “fortalecer” ou “restaurar”; neste contexto, trata-se de reparar o edifício do templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁנַת שְׁמוֹנֶה עֶשְׂרֵה לְמָלְכוֹ
  choice: No décimo oitavo ano do seu reinado
  rationale: Expressa com naturalidade em português a fórmula hebraica de datação régia; a conjunção inicial funciona como continuidade narrativa e não exige um marcador explícito.
- source_word: לְטַהֵר
  choice: depois de purificar
  rationale: 'O infinitivo é entendido à luz da cronologia narrativa anterior: a purificação já estava em curso antes do envio dos oficiais. A formulação evita sugerir que esses oficiais foram enviados para realizar toda a purificação.'
- source_word: הָאָרֶץ וְהַבָּיִת
  choice: a terra e a Casa
  rationale: Mantém a ligação lexical entre a primeira ocorrência de 'casa' e a posterior 'Casa de Yahweh'; a maiúscula ajuda o leitor a reconhecer a referência ao templo sem apagar a expressão hebraica.
- source_word: שַׂר הָעִיר
  choice: governador da cidade
  rationale: שַׂר designa uma autoridade ou alto funcionário; neste contexto administrativo, 'governador' comunica de modo claro sua função cívica.
- source_word: הַמַּזְכִּיר
  choice: o secretário
  rationale: Título de um oficial régio encarregado de registros ou de funções administrativas; 'secretário' é claro e digno em português, sem limitar excessivamente suas atribuições.
- source_word: לְחַזֵּק
  choice: reparar
  rationale: Embora o sentido básico seja 'fortalecer', aplicado a um edifício o verbo indica consolidá-lo, restaurá-lo ou fazer nele reparos.
- source_word: בֵּית יְהוָה אֱלֹהָיו
  choice: a Casa de Yahweh, seu Deus
  rationale: Preserva a metáfora hebraica de 'Casa' para o templo e verte diretamente o nome divino.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: O texto emprega diretamente o Tetragrama. 'Yahweh' preserva o nome pessoal pactual e evita substituí-lo por um título.
- issue: Relação temporal ou final de לְטַהֵר
  choice: depois de purificar
  alternative: para purificar
  rationale: A construção admite tensão sintática, mas o contexto anterior relata que a purificação começou no décimo segundo ano; por isso, aqui o infinitivo é melhor entendido como circunstância anterior ao envio para os reparos.
translation_notes:
  register: Português moderno, claro e solene, com formas de nomes próprios correntes em português. 'Casa' recebe inicial maiúscula por designar o templo, e 'Yahweh' é mantido como forma explícita do nome divino.
