base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/023.yaml
  text: And Abijah slept with his fathers[a], and they buried him in the City of David. And Asa his son reigned in his place. In his days the land had rest for ten years.
translation:
  language: pt
  text: Abias descansou com seus antepassados, e o sepultaram na Cidade de Davi. Asa, seu filho, reinou em seu lugar. Nos dias dele, a terra teve descanso durante dez anos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a terra permaneceu tranquila durante dez anos”.'
    reason: Registra uma alternativa lexical legítima para שָׁקְטָה, que pode indicar repouso, quietude ou ausência de perturbação.
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: descansou com seus antepassados
  rationale: A expressão hebraica é uma fórmula convencional para a morte. “Descansou” preserva o eufemismo e a imagem do texto, enquanto “antepassados” comunica naturalmente o sentido familiar e dinástico em português moderno.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: o sepultaram
  rationale: Mantém a construção ativa plural do hebraico, cujo sujeito não é especificado, e usa um verbo digno e corrente no contexto funerário.
- source_word: בְּעִיר דָּוִיד
  choice: na Cidade de Davi
  rationale: É a forma consagrada e clara do nome próprio do lugar, refletindo diretamente a construção hebraica.
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: Traduz de modo conciso o verbo hebraico que significa exercer o reinado, sem acrescentar explicitamente uma nuance incoativa.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: Expressa com naturalidade a sucessão dinástica indicada pelo hebraico.
- source_word: בְּיָמָיו
  choice: Nos dias dele
  rationale: Conserva a referência temporal literal do hebraico e evita a possível ambiguidade de “seus dias” quanto ao antecedente.
- source_word: שָׁקְטָה
  choice: teve descanso
  rationale: O verbo denota tranquilidade e ausência de perturbação. A escolha preserva o idioma recorrente de descanso nacional sem o limitar explicitamente a paz militar.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: É a correspondência mais direta e mantém aberta a extensão referencial do termo — território, país ou reino — sem torná-lo mais específico que o original.
- source_word: עֶשֶׂר שָׁנִים
  choice: durante dez anos
  rationale: Expressa de maneira idiomática em português a duração indicada no hebraico.
theological_decisions: []
