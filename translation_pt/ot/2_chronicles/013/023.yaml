  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A fórmula de morte foi mantida como eufemismo bíblico, mas com “antepassados” para evitar a possível estranheza ou ambiguidade de “pais” no uso contemporâneo. O marcador da nota foi colocado junto à oração a que a variante lexical se refere.
