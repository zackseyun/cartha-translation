  text: וַ/יִּקָּבְצ֣וּ עָלָ֗י/ו אֲנָשִׁ֤ים רֵקִים֙ בְּנֵ֣י בְלִיַּ֔עַל וַ/יִּֽתְאַמְּצ֖וּ עַל רְחַבְעָ֣ם בֶּן שְׁלֹמֹ֑ה וּ/רְחַבְעָ֗ם הָ֤יָה נַ֨עַר֙ וְ/רַךְ לֵבָ֔ב וְ/לֹ֥א הִתְחַזַּ֖ק לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/007.yaml
  text: And worthless men[a], sons of Belial, gathered around him and proved stronger than Rehoboam son of Solomon, when Rehoboam was young and fainthearted and had not strengthened himself against them.
translation:
  language: pt
  text: Homens sem valor, filhos de Belial[a], reuniram-se em torno dele e mostraram-se mais fortes do que Roboão, filho de Salomão. Roboão era jovem e sem firmeza de coração, e não se fortaleceu diante deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “indivíduos perversos” ou “homens indignos”. A expressão hebraica é literalmente “filhos de Belial”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ עָלָיו
  choice: reuniram-se em torno dele
  rationale: קבץ com עַל pode indicar reunir-se ao redor de alguém ou contra alguém. O contexto apresenta esses homens como partidários de Jeroboão e adversários de Roboão; a formulação conserva a imagem sem eliminar essa tensão.
- source_word: אֲנָשִׁים רֵקִים
  choice: homens sem valor
  rationale: רֵקִים significa literalmente “vazios”, mas aqui é uma avaliação moral e social. “Homens sem valor” comunica o sentido idiomático em português atual.
- source_word: בְּנֵי בְלִיַּעַל
  choice: filhos de Belial
  rationale: A expressão hebraica foi preservada literalmente porque בְלִיַּעַל pode ser entendido como nome personificado ou como termo abstrato ligado à perversidade e à falta de valor. A nota oferece equivalentes idiomáticos.
- source_word: וַיִּתְאַמְּצוּ עַל
  choice: mostraram-se mais fortes do que
  rationale: O hitpael de אמץ expressa aqui o ato de mostrar-se forte em oposição a alguém. A tradução comunica com clareza a força comparativa no contexto político.
- source_word: נַעַר
  choice: jovem
  rationale: נַעַר pode designar rapaz, jovem ou alguém relativamente imaturo. “Jovem” preserva a caracterização retórica sem fazê-lo parecer uma criança.
- source_word: רַךְ לֵבָב
  choice: sem firmeza de coração
  rationale: A expressão significa literalmente “tenro/fraco de coração” e, neste contexto, indica falta de resolução, não compaixão. A formulação conserva a imagem hebraica de modo compreensível.
- source_word: וְלֹא הִתְחַזַּק לִפְנֵיהֶם
  choice: e não se fortaleceu diante deles
  rationale: A tradução mantém de perto o verbo חזק e a expressão espacial לִפְנֵיהֶם, sem transformar a afirmação em incapacidade absoluta.
theological_decisions:
- issue: Sentido de בְּנֵי בְלִיַּעַל
  choice: filhos de Belial
  alternative: indivíduos perversos; homens indignos
  rationale: Manter a expressão formal evita decidir silenciosamente se “Belial” funciona como nome personificado ou como designação abstrata de perversidade. A nota esclarece seu valor idiomático.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A divisão em duas frases evita um período excessivamente carregado. Preservaram-se “Belial” e a imagem de firmeza do coração para não apagar ambiguidades e tensões do hebraico.
