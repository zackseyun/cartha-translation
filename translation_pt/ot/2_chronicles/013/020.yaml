base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/020.yaml
  text: Jeroboam no longer retained strength in the days of Abijah[a], and Yahweh struck him, and he died.
translation:
  language: pt
  text: Jeroboão não manteve mais sua força nos dias de Abias, e Yahweh o feriu[a], e ele morreu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o afligiu” ou “o afligiu com uma praga”. O hebraico diz apenas que Yahweh “feriu” Jeroboão e não especifica o meio exato.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָצַר כֹּחַ
  choice: conservou sua força
  rationale: Preserva os componentes da expressão hebraica, indicando que Jeroboão não continuou a manter força ou poder, sem restringir o sentido à vitória militar.
- source_word: עוֹד
  choice: já não
  rationale: Com a negação לֹא, expressa naturalmente a ideia de 'não mais'.
- source_word: בִּימֵי אֲבִיָּהוּ
  choice: nos dias de Abias
  rationale: Reproduz a expressão temporal hebraica de modo tradicional, claro e inteligível, referindo-se ao período de vida ou reinado de Abias.
- source_word: וַיִּגְּפֵהוּ
  choice: o feriu
  rationale: נגף pode indicar golpear, afligir ou causar uma praga. 'Feriu' mantém ampla a natureza da ação divina sem especificar seu meio.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: וַיָּמֹת
  choice: e ele morreu
  rationale: Traduz diretamente a sequência narrativa, sem impor uma relação causal mais explícita do que a forma hebraica.
theological_decisions:
- issue: Natureza da ação divina em וַיִּגְּפֵהוּ יְהוָה
  choice: Yahweh feriu Jeroboão, e ele morreu, sem que o meio seja especificado.
  alternative: Yahweh o afligiu com uma doença ou o matou imediatamente por algum golpe de juízo.
  rationale: O hebraico atribui a ação a Yahweh, mas não informa se ocorreu por doença, ferimento de batalha ou outro meio. A redação preserva essa indeterminação e mantém a sequência coordenada do original.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A formulação conserva a coordenação repetida do hebraico e evita interpretar 'força' exclusivamente como poder político ou militar.
