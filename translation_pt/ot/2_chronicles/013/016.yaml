base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/016.yaml
  text: And the sons of Israel fled before Judah[c][b][a], and God gave them into their hand.
translation:
  language: pt
  text: Os filhos de Israel[a] fugiram diante de Judá, e Deus os entregou na mão de Judá[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os israelitas”. O hebraico diz literalmente “os filhos de Israel”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “na mão deles”; expressão que significa sob o poder ou controle deles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנ֥וּסוּ
  choice: fugiram
  rationale: O verbo נוּס descreve fuga ou retirada diante do perigo, especialmente em contexto militar; “fugiram” é direto, natural e adequado.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão hebraica formal e o contraste histórico entre Israel e Judá; a alternativa idiomática “os israelitas” é indicada em nota.
- source_word: מִפְּנֵי יְהוּדָה
  choice: diante de Judá
  rationale: A construção מִפְּנֵי indica fuga diante da presença ou do avanço de um adversário. “Diante de Judá” conserva essa imagem sem acrescentar “os homens de” ao texto.
- source_word: וַיִּתְּנֵם
  choice: os entregou
  rationale: Embora נתן signifique basicamente “dar”, neste contexto militar a expressão significa pôr os adversários sob o poder de outro grupo; “os entregou” comunica esse valor idiomático com clareza.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: O texto emprega אֱלֹהִים, não o nome divino יהוה; por isso, traduz-se por “Deus”, sem substituí-lo por “SENHOR”.
- source_word: בְּיָדָם
  choice: nas mãos de Judá
  rationale: O hebraico traz literalmente “na mão deles”, expressão idiomática de poder ou controle. A repetição de “Judá” esclarece o antecedente em português e evita que “deles” pareça referir-se aos filhos de Israel.
theological_decisions:
- issue: Ação divina no resultado da batalha
  choice: Deus os entregou nas mãos de Judá
  alternative: Deus permitiu que caíssem nas mãos de Judá
  rationale: Com Deus como sujeito, נתן atribui diretamente a ele o resultado militar. A tradução preserva essa agência e não a reduz a mera permissão.
- issue: Designação do povo do reino do norte
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A formulação mantém a expressão hebraica e a tensão histórica do contraste com Judá, enquanto a nota oferece a equivalência coletiva natural em português.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Conservou-se “filhos de Israel” por correspondência formal, mas empregou-se “os entregou nas mãos de Judá” para expressar naturalmente o idioma militar hebraico e eliminar uma ambiguidade pronominal enganosa em português.
