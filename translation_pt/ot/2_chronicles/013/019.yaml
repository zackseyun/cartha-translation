base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/019.yaml
  text: 'Abijah pursued Jeroboam and captured from him cities: Bethel and its daughter towns, Jeshanah and its daughter towns, and Ephron and its daughter towns.'
translation:
  language: pt
  text: 'Abias perseguiu Jeroboão e tomou dele cidades: Betel e suas cidades dependentes, Jesana e suas cidades dependentes, e Efrom e suas cidades dependentes.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. «suas filhas», isto é, cidades ou povoações dependentes. O nome «Efrom» aparece como «Efraim» em algumas tradições textuais.
    reason: Explica o uso urbano idiomático de «filhas» sem acrescentar uma relação meramente espacial e registra de forma cautelosa a variante do topônimo.
lexical_decisions:
- source_word: בְּנוֹתֶיהָ
  choice: as localidades ao redor
  rationale: Literalmente, “suas filhas”; no contexto urbano, designa povoados ou localidades dependentes da cidade principal. A formulação escolhida comunica essa relação com naturalidade em português.
- source_word: עפרון
  choice: Efrom
  rationale: Transliteração portuguesa do topônimo hebraico conforme a leitura massorética; algumas tradições textuais e versões apresentam forma semelhante a “Efraim”.
- source_word: עָרִים
  choice: estas cidades
  rationale: Preserva a introdução explícita da lista de cidades e torna natural em português a relação entre o termo geral e os nomes que seguem.
