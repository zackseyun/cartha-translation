source:
  edition: WLC
  text: וַ/יָּ֨קָם֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט עֶ֖בֶד שְׁלֹמֹ֣ה בֶן דָּוִ֑יד וַ/יִּמְרֹ֖ד עַל אֲדֹנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/006.yaml
  text: Jeroboam son of Nebat[a], a servant of Solomon son of David, rose up and rebelled against his lord.
translation:
  language: pt
  text: Jeroboão, filho de Nebate, servo de Salomão, filho de Davi, levantou-se e se rebelou contra o seu senhor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seu amo”.'
    reason: Alternativa lexical para אֲדֹנָיו, que pode designar um senhor ou amo humano.
lexical_decisions:
- source_word: וַיָּקָם
  choice: levantou-se
  rationale: O qal narrativo de קום introduz o início da oposição de Jeroboão. “Levantou-se” preserva a força narrativa sem especificar indevidamente uma ação militar.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jeroboão, filho de Nebate
  rationale: Emprega as formas tradicionais e amplamente reconhecidas dos nomes em português e traduz literalmente o patronímico.
- source_word: עֶבֶד
  choice: servo
  rationale: No contexto da administração real, עבד indica alguém subordinado ao rei. “Servo” preserva essa relação político-social sem impor necessariamente a ideia de escravidão como propriedade.
- source_word: שְׁלֹמֹה בֶן דָּוִיד
  choice: Salomão, filho de Davi
  rationale: As formas tradicionais dos nomes são mantidas, e a expressão filial é traduzida literalmente para preservar a ênfase dinástica.
- source_word: וַיִּמְרֹד
  choice: se rebelou
  rationale: מרד denota rebelião contra uma autoridade. “Rebelou-se” é uma expressão portuguesa natural e adequada ao contexto político.
- source_word: עַל אֲדֹנָיו
  choice: contra o seu senhor
  rationale: אָדוֹן com sufixo de terceira pessoa masculina singular refere-se aqui a Salomão como superior de Jeroboão. “Senhor”, em minúscula, preserva a relação hierárquica sem sugerir referência divina.
theological_decisions:
- issue: Tradução de אֲדֹנָיו quando se refere a um superior humano
  choice: o seu senhor
  alternative: o seu amo
  rationale: O referente é Salomão, um superior humano, e não Deus. “Senhor”, em minúscula, mantém o sentido de autoridade; “amo” também é possível, mas pode sugerir de modo mais específico uma relação doméstica ou escravista.
translation_notes:
  register: Português moderno, claro e digno, com formas bíblicas dos nomes amplamente reconhecidas no Brasil e em outras comunidades lusófonas. A repetição de “filho de” foi preservada por refletir a estrutura e a ênfase dinástica do hebraico.
