base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/014.yaml
  text: When Judah turned around, behold, the battle was before them and behind them; and they cried out to Yahweh, and the priests were blowing the trumpets.
translation:
  language: pt
  text: Quando Judá se voltou, eis que a batalha estava diante deles e atrás deles; clamaram a Yahweh, e os sacerdotes tocavam as trombetas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: se virou
  rationale: O verbo פנה descreve aqui o movimento de voltar-se ao perceber a emboscada; a formulação é natural e mantém a ação física sem explicá-la em excesso.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Preserva o nome coletivo hebraico, que no contexto representa o exército ou povo de Judá.
- source_word: וְהִנֵּה
  choice: viu que
  rationale: Em português narrativo, comunica de modo natural a descoberta súbita marcada por הִנֵּה, sem recorrer ao mais arcaizante «eis».
- source_word: הַמִּלְחָמָה
  choice: a batalha
  rationale: Refere-se ao confronto militar imediato, não a uma guerra prolongada.
- source_word: פָּנִים וְאָחוֹר
  choice: diante deles e atrás deles
  rationale: Mantém de perto a expressão espacial hebraica e deixa claro que Judá enfrentava combate nas duas direções.
- source_word: וַיִּצְעֲקוּ
  choice: clamaram
  rationale: Expressa um apelo intenso dirigido a Deus e corresponde ao registro bíblico digno e corrente.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino conforme a orientação do projeto e reproduz a direção do clamor.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Equivalência direta e clara do substantivo hebraico.
- source_word: מחצצרים
  choice: tocaram
  rationale: No contexto de instrumentos de sinalização, «tocar as trombetas» é a expressão portuguesa natural; o particípio massorético indica uma ação concomitante, que o contexto coordenado preserva.
- source_word: בַּחֲצֹצְרוֹת
  choice: as trombetas
  rationale: Designa trombetas retas de uso cultual e militar; «trombetas» é claro, e não se acrescenta «de prata», ausente no versículo.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Preserva o nome próprio divino por transliteração, em conformidade com a orientação fornecida, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A pontuação divide a descoberta da reação para tornar a sequência narrativa fluente; «Judá» permanece como sujeito coletivo. Não foram necessárias notas de rodapé.
