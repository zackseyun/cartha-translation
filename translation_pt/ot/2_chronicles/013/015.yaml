base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/015.yaml
  text: Then the men of Judah raised a shout, and when the men of Judah shouted, God struck down Jeroboam and all Israel before Abijah and Judah.
translation:
  language: pt
  text: Então os homens de Judá deram um grito de guerra. Quando os homens de Judá gritaram, Deus derrotou Jeroboão e todo o Israel diante de Abias e de Judá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרִיעוּ / בְּהָרִיעַ
  choice: deram um grito de guerra / gritaram
  rationale: O verbo רוע, neste contexto militar, indica levantar um brado ou grito de guerra; a formulação preserva a repetição do hebraico sem soar excessivamente rígida em português.
- source_word: נָגַף
  choice: derrotou
  rationale: O verbo descreve Deus infligindo uma derrota ou golpe militar. “Derrotou” comunica claramente o resultado no contexto da batalha sem necessariamente afirmar que todos foram mortos.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Mantém a expressão espacial e relacional do hebraico, indicando a derrota perante Abias e Judá.
theological_decisions:
- issue: Agência divina na derrota
  choice: Deus derrotou Jeroboão e todo o Israel
  alternative: Jeroboão e todo o Israel foram derrotados
  rationale: O hebraico apresenta Deus explicitamente como sujeito de נָגַף; a tradução preserva essa atribuição direta sem explicar o mecanismo.
translation_notes:
  register: Português moderno, digno e acessível, com vocabulário militar claro. “Homens de Judá” representa אִישׁ יְהוּדָה como coletivo; “Abias” segue a forma portuguesa tradicional do nome.
