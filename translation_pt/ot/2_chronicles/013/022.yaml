base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/022.yaml
  text: The rest of the acts of Abijah[a], and his ways and his sayings, are written in the midrash of the prophet Iddo.
translation:
  language: pt
  text: Os demais atos de Abias, seus caminhos e suas palavras estão escritos no midraxe[a] do profeta Ido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “comentário”, “exposição” ou, em sentido mais geral, “registro”. O termo hebraico traduzido por “midraxe” refere-se aqui a uma obra escrita de investigação ou interpretação, não necessariamente ao gênero rabínico posterior em sua forma desenvolvida.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Os demais atos
  rationale: Na fórmula historiográfica sobre reis, יֶתֶר דִּבְרֵי indica o restante dos feitos ou acontecimentos ligados ao governante. “Os demais atos” comunica esse sentido com naturalidade, sem acrescentar um marcador temporal inexistente.
- source_word: אֲבִיָּה
  choice: Abias
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome bíblico em português.
- source_word: וּדְרָכָיו
  choice: seus caminhos
  rationale: Conserva a imagem hebraica de דֶּרֶךְ, que aqui abrange a conduta ou o modo de viver de Abias.
- source_word: וּדְבָרָיו
  choice: suas palavras
  rationale: Neste segundo uso de דבר, em contraste com os atos e os caminhos já mencionados, a referência provavelmente é às palavras, declarações ou discursos de Abias; a tradução mantém a formulação direta e sua possível amplitude.
- source_word: כְּתוּבִים
  choice: estão escritos
  rationale: Reproduz diretamente o particípio passivo de כתב e a ideia de que essas informações constam de uma obra escrita.
- source_word: בְּמִדְרַשׁ
  choice: no midraxe
  rationale: Preserva o termo hebraico específico em forma aportuguesada. Aqui ele designa uma obra de investigação ou exposição, sem necessariamente carregar todo o sentido técnico do gênero rabínico posterior; a nota esclarece a amplitude lexical.
- source_word: הַנָּבִיא עִדּוֹ
  choice: do profeta Ido
  rationale: Expressa de modo natural em português a relação da obra com o profeta Ido, sem determinar além do texto se ele foi autor, compilador ou figura associada ao escrito.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. A tradução preserva a imagem de “caminhos” e mantém “midraxe” no texto, explicando-o em nota para evitar uma identificação anacrônica com o gênero rabínico posterior.
