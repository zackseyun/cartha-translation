  naturalness: O português é claro e de registro apropriado. «Como os povos das terras» é suficientemente natural no contexto bíblico e é mais próximo do original. «Encher a sua mão» preserva o possessivo do hebraico e torna a construção levemente mais explícita sem desfazer a imagem idiomática.
  terminology: «Yahweh», «filhos de Arão», «levitas», «novilho» e «carneiros» são adequados. «Sacerdote dos que não são deuses» preserva de modo inteligível a força de לְלֹא אֱלֹהִים; a nota apresenta alternativas pertinentes.
