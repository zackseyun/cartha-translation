source:
  edition: WLC
  text: הֲ/לֹ֤א הִדַּחְתֶּם֙ אֶת כֹּהֲנֵ֣י יְהוָ֔ה אֶת בְּנֵ֥י אַהֲרֹ֖ן וְ/הַ/לְוִיִּ֑ם וַ/תַּעֲשׂ֨וּ לָ/כֶ֤ם כֹּהֲנִים֙ כְּ/עַמֵּ֣י הָ/אֲרָצ֔וֹת כָּל הַ/בָּ֗א לְ/מַלֵּ֨א יָד֜/וֹ בְּ/פַ֤ר בֶּן בָּקָר֙ וְ/אֵילִ֣ם שִׁבְעָ֔ה וְ/הָיָ֥ה כֹהֵ֖ן לְ/לֹ֥א אֱלֹהִֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/009.yaml
  text: Have you not driven out the priests of Yahweh[a], the sons of Aaron and the Levites[b], and made priests for yourselves like the peoples of the lands? Whoever comes to fill his hand with a young bull and seven rams becomes a priest of what are not gods.
translation:
  language: pt
  text: Acaso vocês não expulsaram os sacerdotes de Yahweh, os filhos de Arão e os levitas, e não constituíram sacerdotes para si mesmos como os povos das terras? Todo aquele que vem para encher a sua mão[a] com um novilho e sete carneiros torna-se sacerdote dos que não são deuses[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “encher a mão”, expressão técnica referente à ordenação ou instalação no sacerdócio.'
    reason: lexical_alternative
  - marker: b
    text: Ou “de falsos deuses” ou “para não deuses”; o hebraico nega literalmente que esses objetos de culto sejam verdadeiros deuses.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא
  choice: Acaso vocês não
  rationale: Introduz uma pergunta retórica que espera concordância e preserva o tom de repreensão, com referência clara à segunda pessoa do plural.
- source_word: הִדַּחְתֶּם
  choice: expulsaram
  rationale: O hifil de נדח expressa remoção forçada ou expulsão; a escolha é direta e natural em português.
- source_word: כֹּהֲנֵי יְהוָה
  choice: os sacerdotes de Yahweh
  rationale: Mantém a relação de pertencimento do construto hebraico e translitera o nome divino.
- source_word: בְּנֵי אַהֲרֹן וְהַלְוִיִּם
  choice: os filhos de Arão e os levitas
  rationale: Preserva a designação formal da linhagem sacerdotal aarônica e a menção distinta dos levitas.
- source_word: וַתַּעֲשׂוּ לָכֶם כֹּהֲנִים
  choice: e não constituíram sacerdotes para si mesmos
  rationale: No contexto, עשה significa fazer ou estabelecer alguém como sacerdote; “constituíram” comunica a nomeação, enquanto “para si mesmos” retém a nuance interessada de לָכֶם. A repetição de “não” torna natural em português a coordenação sob a pergunta retórica.
- source_word: כְּעַמֵּי הָאֲרָצוֹת
  choice: como fazem os povos das outras terras
  rationale: Expressa a comparação com povos estrangeiros de modo claro, sem introduzir o rótulo interpretativo “pagãos”; “fazem” explicita naturalmente o sentido verbal implícito na comparação.
- source_word: כָּל הַבָּא
  choice: Todo aquele que vem
  rationale: Reproduz a construção genérica singular e ressalta a crítica ao acesso indiscriminado ao sacerdócio.
- source_word: לְמַלֵּא יָדוֹ
  choice: para encher a mão
  rationale: Conserva literalmente a expressão técnica hebraica de instalação sacerdotal, cuja função é esclarecida em nota.
- source_word: בְּפַר בֶּן בָּקָר וְאֵילִם שִׁבְעָה
  choice: com um novilho e sete carneiros
  rationale: Apresenta de forma corrente e precisa os animais ligados ao rito de instalação.
- source_word: וְהָיָה כֹהֵן לְלֹא אֱלֹהִים
  choice: torna-se sacerdote dos que não são deuses
  rationale: Comunica o resultado do procedimento e preserva a negação polêmica da verdadeira divindade desses objetos de culto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama; “Yahweh” preserva o nome pactual sem substituí-lo por um título.
- issue: Sentido de לְלֹא אֱלֹהִים
  choice: dos que não são deuses
  alternative: de falsos deuses; para não deuses
  rationale: A formulação mantém a força polêmica do hebraico, que nega a divindade real dos objetos de culto, em vez de apenas classificá-los.
- issue: Expressão cultual לְמַלֵּא יָדוֹ
  choice: encher a mão, com explicação em nota
  alternative: ordenar-se; ser consagrado
  rationale: A tradução conserva a imagem técnica do original sem resolver silenciosamente sua expressão idiomática; a nota fornece o sentido institucional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A segunda pessoa do plural foi vertida por “vocês”, evitando formas regionais ou arcaizantes. A expressão cultual foi preservada no corpo do texto e esclarecida em nota.
