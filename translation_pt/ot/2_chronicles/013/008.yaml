  text: וְ/עַתָּ֣ה אַתֶּ֣ם אֹֽמְרִ֗ים לְ/הִתְחַזֵּק֙ לִ/פְנֵי֙ מַמְלֶ֣כֶת יְהוָ֔ה בְּ/יַ֖ד בְּנֵ֣י דָוִ֑יד וְ/אַתֶּם֙ הָמ֣וֹן רָ֔ב וְ/עִמָּ/כֶם֙ עֶגְלֵ֣י זָהָ֔ב אֲשֶׁ֨ר עָשָׂ֥ה לָ/כֶ֛ם יָרָבְעָ֖ם לֵ/אלֹהִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/008.yaml
  text: And now you are saying that you are strong enough to stand against the kingdom of Yahweh in the hand of the sons of David[c][b][a], because you are a great multitude and have with you the golden calves that Jeroboam made for you as gods.
translation:
  language: pt
  text: E agora vocês dizem que são fortes o bastante para enfrentar o reino de Yahweh nas mãos dos filhos de Davi[a], porque são uma grande multidão e têm com vocês os bezerros de ouro que Jeroboão fez para vocês como deuses[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “na mão dos filhos de Davi”, expressão que indica autoridade ou administração por meio da linhagem de Davi.'
    reason: cultural_note
  - marker: b
    text: 'Ou: “por deuses”. O hebraico usa o plural em referência polêmica aos bezerros que Jeroboão fez para vocês.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמְרִים
  choice: pensam
  rationale: Neste contexto, o particípio introduz a pretensão ou intenção dos destinatários. “Pensam que podem” reproduz com naturalidade a força retórica sem reduzir a expressão a mera fala audível.
- source_word: לְהִתְחַזֵּק לִפְנֵי
  choice: podem resistir
  rationale: A construção hitpael de חזק com לִפְנֵי descreve mostrar-se forte diante de alguém em confronto. “Resistir” comunica o sentido militar adversativo; a ideia de força permanece em “podem” e no contexto.
- source_word: מַמְלֶכֶת יְהוָה
  choice: reino de Yahweh
  rationale: Mantém a afirmação teológica de Crônicas de que o reino pertence a Yahweh e conserva o nome divino presente no hebraico.
- source_word: בְּיַד בְּנֵי דָוִיד
  choice: que está nas mãos dos filhos de Davi
  rationale: Preserva a imagem hebraica da mão como esfera de autoridade ou administração, sem apagar a distinção entre o reino de Yahweh e seus administradores davídicos.
- source_word: הָמוֹן רָב
  choice: uma grande multidão
  rationale: Expressa claramente a superioridade numérica alegada e mantém o registro elevado do discurso.
- source_word: עֶגְלֵי זָהָב
  choice: os bezerros de ouro
  rationale: É uma formulação corrente e clara para os conhecidos objetos de culto instituídos por Jeroboão.
- source_word: לֵאלֹהִים
  choice: como deuses
  rationale: Conserva o plural hebraico e sua caracterização polêmica dos bezerros como objetos de culto divinizados.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz explicitamente o tetragrama; “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Relação entre o reino de Yahweh e a dinastia de Davi
  choice: “o reino de Yahweh, que está nas mãos dos filhos de Davi”
  alternative: “o reino de Yahweh governado pelos descendentes de Davi”
  rationale: 'A formulação mantém a tensão do original: o reino pertence a Yahweh, mas está confiado à administração da linhagem davídica, sem fundir posse divina e governo humano.'
- issue: Caracterização dos bezerros de Jeroboão
  choice: “como deuses”
  alternative: “para servirem de deuses”
  rationale: Mantém o plural e a força polêmica do texto sem especificar além do que a construção hebraica exige.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vocês” reproduz o plural do discurso direto. A sintaxe foi levemente explicitada com “que está” para tornar natural a imagem hebraica sem eliminar sua tensão teológica.
