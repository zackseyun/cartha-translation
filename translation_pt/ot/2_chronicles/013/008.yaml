- from: E agora vocês pensam que podem resistir ao reino de Yahweh, que está nas mãos dos filhos de Davi[a], porque são uma grande multidão e têm com vocês os bezerros de ouro que Jeroboão fez para vocês como deuses[b].
  to: E agora vocês dizem que são fortes o bastante para enfrentar o reino de Yahweh nas mãos dos filhos de Davi[a], porque são uma grande multidão e têm com vocês os bezerros de ouro que Jeroboão fez para vocês como deuses[b].
