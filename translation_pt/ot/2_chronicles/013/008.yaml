  naturalness: O português do rascunho é claro e de registro apropriado. A formulação revista permanece natural para leitores brasileiros e internacionais, ao mesmo tempo que se aproxima mais do enunciado hebraico.
  terminology: “Yahweh”, “reino”, “filhos de Davi” e “bezerros de ouro” são escolhas adequadas. “Filhos de Davi” deve ser mantido, com nota explicativa, pois conserva a expressão dinástica hebraica sem a reduzir diretamente a “descendentes”.
