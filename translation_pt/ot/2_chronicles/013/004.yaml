  text: וַ/יָּ֣קָם אֲבִיָּ֗ה מֵ/עַל֙ לְ/הַ֣ר צְמָרַ֔יִם אֲשֶׁ֖ר בְּ/הַ֣ר אֶפְרָ֑יִם וַ/יֹּ֕אמֶר שְׁמָע֖וּ/נִי יָרָבְעָ֥ם וְ/כָל יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/004.yaml
  text: Then Abijah stood on Mount Zemaraim[a], which is in the hill country of Ephraim, and said, “Hear me, Jeroboam and all Israel!”
translation:
  language: pt
  text: 'Então Abias se pôs de pé no monte Zemaraim[a], que fica na região montanhosa de Efraim, e disse: “Escutem-me, Jeroboão e todo o Israel!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que fica nos montes de Efraim”. A expressão hebraica pode indicar a região de colinas ou a região montanhosa de Efraim.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: se pôs de pé
  rationale: O verbo קום pode significar levantar-se ou ficar de pé. Neste contexto de discurso público, “se pôs de pé” é natural e evita acrescentar a ideia mais específica de assumir uma posição militar.
- source_word: מֵעַל לְהַר
  choice: no monte
  rationale: A sequência preposicional hebraica é incomum se reproduzida literalmente, mas aqui indica a posição de Abias sobre o monte. “No monte” comunica de modo claro o sentido locativo.
- source_word: צְמָרַיִם
  choice: Zemaraim
  rationale: Nome geográfico transliterado em forma compatível com o português bíblico moderno.
- source_word: אֲשֶׁר בְּהַר אֶפְרָיִם
  choice: que fica na região montanhosa de Efraim
  rationale: הַר pode designar tanto um monte quanto uma região de relevo montanhoso. Aqui, a expressão identifica a região de Efraim, e não necessariamente um único pico.
- source_word: וַיֹּאמֶר
  choice: e disse
  rationale: Fórmula narrativa comum de introdução da fala; o sujeito já foi explicitado.
- source_word: שְׁמָעוּנִי
  choice: Escutem-me
  rationale: O imperativo plural de שמע com sufixo de primeira pessoa pede atenção direta. “Escutem-me” preserva a força retórica e soa natural no português atual.
- source_word: יָרָבְעָם וְכָל יִשְׂרָאֵל
  choice: Jeroboão e todo o Israel
  rationale: Mantém o nome nacional coletivo usado no hebraico e conserva a força política e pactual da expressão no contexto da monarquia dividida.
theological_decisions:
- issue: Sentido de יִשְׂרָאֵל no contexto da monarquia dividida
  choice: todo o Israel
  alternative: todos os israelitas
  rationale: “Todo o Israel” conserva a designação nacional e pactual do texto, sem reduzi-la a uma simples referência étnica nem eliminar a tensão decorrente da divisão do reino.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala direta mantém tom público e enfático sem arcaísmo excessivo.
