source:
  edition: WLC
  text: וְ/הִנֵּה֩ עִמָּ֨/נוּ בָ/רֹ֜אשׁ הָ/אֱלֹהִ֧ים וְ/כֹהֲנָ֛י/ו וַ/חֲצֹצְר֥וֹת הַ/תְּרוּעָ֖ה לְ/הָרִ֣יעַ עֲלֵי/כֶ֑ם בְּנֵ֣י יִשְׂרָאֵ֗ל אַל תִּלָּֽחֲמ֛וּ עִם יְהוָ֥ה אֱלֹהֵֽי אֲבֹתֵי/כֶ֖ם כִּי לֹ֥א תַצְלִֽיחוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/012.yaml
  text: And behold[a], God is with us at our head, and his priests with the trumpets for the battle cry, to sound the alarm against you. Sons of Israel, do not fight against Yahweh, the God of your fathers, for you will not succeed.
translation:
  language: pt
  text: Eis que Deus está conosco à nossa frente, e os seus sacerdotes estão com as trombetas para o toque de guerra, a fim de dar o alarme contra vocês. Filhos de Israel[a], não lutem contra Yahweh, o Deus de seus pais, pois vocês não terão sucesso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Israelitas”. O hebraico diz literalmente “filhos de Israel”, forma masculina plural usada aqui para se dirigir ao povo de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Eis que
  rationale: Mantém a função enfática do marcador discursivo e o tom solene do discurso, sem recorrer a linguagem obsoleta.
- source_word: עִמָּנוּ בָרֹאשׁ הָאֱלֹהִים
  choice: Deus está conosco à nossa frente
  rationale: Preserva tanto a presença divina expressa por עִמָּנוּ como a imagem espacial e dirigente de בָרֹאשׁ, literalmente ligada à posição de cabeça ou vanguarda.
- source_word: וְכֹהֲנָיו
  choice: e os seus sacerdotes estão
  rationale: O sufixo masculino singular remete a Deus. O verbo 'estão' é suprido em português para tornar natural a coordenação elíptica do hebraico.
- source_word: וַחֲצֹצְרוֹת הַתְּרוּעָה
  choice: com as trombetas para o toque de guerra
  rationale: חֲצֹצְרוֹת designa trombetas, enquanto תְּרוּעָה indica um toque, clamor ou sinal forte; o contexto militar justifica 'toque de guerra' sem confundir o instrumento com o ato verbal seguinte.
- source_word: לְהָרִיעַ עֲלֵיכֶם
  choice: a fim de dar o alarme contra vocês
  rationale: Expressa a finalidade do infinitivo causativo de רוע e conserva o sentido hostil de עֲלֵיכֶם no contexto da batalha.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Filhos de Israel
  rationale: Reproduz a forma masculina plural do hebraico como vocativo étnico e pactual; a alternativa portuguesa mais abrangente é registrada em nota.
- source_word: אַל תִּלָּחֲמוּ עִם יְהוָה
  choice: não lutem contra Yahweh
  rationale: A proibição é direta, e עִם assume valor adversativo com o verbo 'lutar'. O nome divino é transliterado como Yahweh.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: o Deus de seus pais
  rationale: Mantém a expressão pactual tradicional e clara, sem ampliar 'pais' para antepassados no texto principal.
- source_word: כִּי לֹא תַצְלִיחוּ
  choice: pois vocês não terão sucesso
  rationale: O hifil de צלח comunica êxito ou prosperidade; 'ter sucesso' preserva sua abrangência no contexto militar sem reduzi-lo apenas a 'vencer'.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama como nome próprio. 'Yahweh' o representa de modo explícito, sem substituí-lo por um título.
- issue: Alcance do vocativo בְּנֵי יִשְׂרָאֵל
  choice: Filhos de Israel
  alternative: Israelitas; povo de Israel
  rationale: A escolha conserva a forma masculina plural e a ressonância familiar e pactual do hebraico, ao mesmo tempo que a nota esclarece que o discurso se dirige coletivamente aos israelitas.
- issue: Sentido da presença de Deus à frente de Judá
  choice: Deus está conosco à nossa frente
  alternative: Deus está conosco como nosso líder
  rationale: A formulação preserva a metáfora espacial e sua possível implicação de liderança, sem transformar essa implicação em paráfrase exclusiva.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas correntes no Brasil. 'Eis que' conserva a ênfase retórica; 'vocês' evita regionalismo excessivo. A sintaxe distingue as trombetas destinadas ao toque de guerra do ato de dar o alarme contra o adversário.
