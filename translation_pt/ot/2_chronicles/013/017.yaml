base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/017.yaml
  text: Abijah and his people struck them with a great blow[b][a], and five hundred thousand chosen men of Israel fell slain.
translation:
  language: pt
  text: Abias e seu povo lhes desferiram um grande golpe[a], e quinhentos mil homens escolhidos[b] de Israel caíram mortos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um golpe severo” ou “uma grande mortandade”. A expressão hebraica diz literalmente “um grande golpe”.
    reason: lexical_alternative
  - marker: b
    text: Ou “quinhentos mil homens selecionados de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ בָהֶם
  choice: lhes infligiram
  rationale: O verbo נכה descreve o ato de ferir ou golpear em combate; com מַכָּה, a construção portuguesa idiomática “infligir uma derrota” preserva a ação militar sem repetir artificialmente “golpearam... um golpe”.
- source_word: אֲבִיָּה וְעַמּוֹ
  choice: Abias e seu povo
  rationale: Mantém o sentido amplo de עַם e evita restringi-lo explicitamente a “exército”, embora o contexto seja militar.
- source_word: מַכָּה רַבָּה
  choice: uma grande derrota
  rationale: מַכָּה pode designar golpe, revés ou mortandade. “Grande derrota” é natural no relato bélico e não antecipa totalmente a informação específica sobre os mortos na oração seguinte.
- source_word: וַיִּפְּלוּ חֲלָלִים
  choice: caíram mortos
  rationale: Reproduz a combinação hebraica de נפל, “cair”, com חֲלָלִים, os mortos ou traspassados em combate, em português claro e corrente.
- source_word: מִיִּשְׂרָאֵל
  choice: de Israel
  rationale: Identifica o grupo ao qual pertenciam as baixas, isto é, as forças do reino do norte.
- source_word: חֲמֵשׁ מֵאוֹת אֶלֶף
  choice: quinhentos mil
  rationale: Mantém diretamente o número transmitido pelo texto hebraico, sem redução ou reinterpretação.
- source_word: אִישׁ בָּחוּר
  choice: homens escolhidos
  rationale: בָּחוּר pode indicar homens selecionados, de primeira linha, frequentemente jovens aptos para a guerra. “Escolhidos” conserva a ideia de tropas selecionadas sem acrescentar “valentes”.
theological_decisions:
- issue: O elevado número de mortos no relato da batalha
  choice: Manter “quinhentos mil” conforme o texto hebraico.
  alternative: Interpretar o número como hipérbole, emendar o numeral ou entender אֶלֶף como unidade militar ou clã.
  rationale: O versículo apresenta o número diretamente, sem sinal textual interno de redução ou simbolização; a tradução não deve resolver no corpo do texto uma questão histórico-crítica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. “Abias” segue a forma portuguesa tradicional do nome. Os marcadores foram posicionados imediatamente após as expressões a que se referem.
