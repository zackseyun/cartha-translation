    issue: “Uma grande derrota” para מַכָּה רַבָּה
    rationale: “Derrota” não é o sentido lexical direto de מַכָּה, “golpe/ferida/ataque”, e antecipa um resultado que o texto expressa separadamente pela queda dos mortos. “Um grande golpe” preserva a formulação hebraica e a sequência narrativa.
  - severity: low
    issue: Posição do marcador b
    rationale: O marcador está após “Israel”, embora a nota explique “homens escolhidos”. Deve acompanhar “escolhidos” para que a âncora corresponda diretamente ao elemento anotado.
