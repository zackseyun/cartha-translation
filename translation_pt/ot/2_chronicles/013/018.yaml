source:
  edition: WLC
  text: וַ/יִּכָּנְע֥וּ בְנֵי יִשְׂרָאֵ֖ל בָּ/עֵ֣ת הַ/הִ֑יא וַ/יֶּֽאֶמְצוּ֙ בְּנֵ֣י יְהוּדָ֔ה כִּ֣י נִשְׁעֲנ֔וּ עַל יְהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/018.yaml
  text: So the sons of Israel were subdued at that time, and the sons of Judah prevailed, because they relied on Yahweh, the God of their fathers.
translation:
  language: pt
  text: Assim, naquele tempo, os filhos de Israel foram subjugados, e os filhos de Judá prevaleceram, porque se apoiaram em Yahweh, o Deus de seus pais.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכָּנְעוּ
  choice: foram subjugados
  rationale: O nifal de כנע expressa ser posto em sujeição ou humilhado. No contexto militar, “foram subjugados” conserva o sentido passivo e resultativo sem especificar além do texto uma derrota total.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém de modo transparente a construção hebraica e o paralelismo com “os filhos de Judá”, referindo-se aqui às forças do reino do norte.
- source_word: בָּעֵת הַהִיא
  choice: naquele tempo
  rationale: Equivalente português natural da expressão temporal hebraica, preservando sua referência narrativa.
- source_word: וַיֶּאֶמְצוּ
  choice: prevaleceram
  rationale: O verbo אמץ comunica força ou fortalecimento; no contexto de batalha, “prevaleceram” expressa naturalmente a superioridade alcançada sem perder a relação com o desfecho militar.
- source_word: בְנֵי יְהוּדָה
  choice: os filhos de Judá
  rationale: Preserva a expressão hebraica e o paralelismo explícito com “os filhos de Israel”; “Judá” sozinho seria mais condensado e interpretativo.
- source_word: כִּי
  choice: porque
  rationale: Introduz claramente a causa pela qual os filhos de Judá prevaleceram.
- source_word: נִשְׁעֲנוּ עַל
  choice: se apoiaram em
  rationale: Conserva a imagem concreta do verbo שען, “apoiar-se”, e comunica de forma natural a ideia de dependência e confiança.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: o Deus de seus pais
  rationale: Reproduz naturalmente a cadeia construta e preserva sua ressonância ancestral e pactual.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal divino mediante transliteração, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação conserva o paralelismo entre Israel e Judá e a metáfora de apoiar-se em Deus, evitando transformar essa expressão simplesmente em “confiar”. Não são necessárias notas de rodapé.
