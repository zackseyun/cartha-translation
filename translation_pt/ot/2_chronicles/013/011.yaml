revisions:
- from: Nós oferecemos a Yahweh holocaustos manhã após manhã e tarde após tarde, além do incenso aromático e dos pães dispostos sobre a mesa pura. Também mantemos aceso, tarde após tarde, o candelabro de ouro com suas lâmpadas, pois cumprimos o serviço ordenado por Yahweh, nosso Deus; vocês, porém, o abandonaram.
  to: Nós oferecemos a Yahweh ofertas queimadas manhã após manhã e tarde após tarde, incenso aromático e a disposição dos pães sobre a mesa pura; e o candelabro de ouro, com suas lâmpadas, que acendemos tarde após tarde. Pois observamos a ordem de Yahweh, nosso Deus; vocês, porém, o abandonaram.
  rationale: A revisão preserva todos os itens coordenados do hebraico e suas repetições temporais. Ajusta a relação entre o candelabro e suas lâmpadas, substitui um termo sacrificial potencialmente opaco no português moderno e explicita, sem interpretação adicional, que o hebraico fala da disposição ordenada dos pães. A nota registra as designações tradicionais como alternativas, ancorada em «disposição dos pães».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T22:51:58Z'
review_pass:
  verdict: revise
  source_fidelity: A versão preserva adequadamente a sequência cultual, a repetição temporal e o contraste final. Contudo, «mantemos aceso ... o candelabro» desloca o foco das lâmpadas, que são o elemento explicitamente relacionado a «para queimar/arder» no hebraico. «Holocaustos», embora tradicional em Bíblias portuguesas, tem hoje uma associação extrabíblica predominante que pode prejudicar a legibilidade pretendida; «ofertas queimadas» comunica o sacrifício integral sem essa ambiguidade contemporânea.
  naturalness: O texto é geralmente fluente e de registro apropriado. A revisão mantém a sintaxe portuguesa natural, mas faz a ação de acender recair sobre as lâmpadas e representa mais diretamente a disposição dos pães.
  terminology: «Yahweh», «incenso aromático», «mesa pura» e «candelabro de ouro» são adequados. «Disposição dos pães» corresponde de modo mais direto ao substantivo singular מַעֲרֶכֶת, sem recorrer a uma designação tradicional interpretativa. «Ordem de Yahweh» é uma formulação concisa e natural para מִשְׁמֶרֶת יהוה neste contexto de dever cultual.
  issues:
  - severity: medium
    issue: «Mantemos aceso ... o candelabro de ouro com suas lâmpadas» atribui diretamente ao candelabro a condição de estar aceso.
    rationale: O hebraico menciona «o candelabro de ouro e suas lâmpadas para arder», seguido pela indicação temporal. A tradução deve tornar as lâmpadas, e não o suporte, o objeto da ação de acender/manter ardendo.
  - severity: low
    issue: «Holocaustos» pode ser entendido primariamente, no uso português moderno, como referência ao genocídio nazista.
    rationale: O termo é bíblico tradicional, mas «ofertas queimadas» conserva com precisão o sentido sacrificial de עֹלוֹת e é mais transparente para leitores contemporâneos.
  - severity: low
    issue: «Pães dispostos» torna a ideia geral, mas não representa tão claramente o substantivo «disposição/arranjo».
    rationale: מַעֲרֶכֶת é a disposição ordenada; «a disposição dos pães» conserva essa nuance e permanece não interpretativa.
  revised_text: Nós oferecemos a Yahweh ofertas queimadas manhã após manhã e tarde após tarde, incenso aromático e a disposição dos pães sobre a mesa pura; e o candelabro de ouro, com suas lâmpadas, que acendemos tarde após tarde. Pois observamos a ordem de Yahweh, nosso Deus; vocês, porém, o abandonaram.
  revised_footnotes:
  - marker: a
    text: Ou «os pães da Presença» ou «os pães da proposição». Literalmente, «a disposição dos pães».
    reason: lexical_alternative
  revision_rationale: A revisão preserva todos os itens coordenados do hebraico e suas repetições temporais. Ajusta a relação entre o candelabro e suas lâmpadas, substitui um termo sacrificial potencialmente opaco no português moderno e explicita, sem interpretação adicional, que o hebraico fala da disposição ordenada dos pães. A nota registra as designações tradicionais como alternativas, ancorada em «disposição dos pães».
