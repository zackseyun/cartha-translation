source:
  edition: WLC
  text: וּ/מַקְטִרִ֣ים לַ/יהוָ֡ה עֹל֣וֹת בַּ/בֹּֽקֶר בַּ/בֹּ֣קֶר וּ/בָ/עֶֽרֶב בָּ/עֶ֣רֶב וּ/קְטֹֽרֶת סַמִּים֩ וּ/מַעֲרֶ֨כֶת לֶ֜חֶם עַל הַ/שֻּׁלְחָ֣ן הַ/טָּה֗וֹר וּ/מְנוֹרַ֨ת הַ/זָּהָ֤ב וְ/נֵרֹתֶ֨י/הָ֙ לְ/בָעֵר֙ בָּ/עֶ֣רֶב בָּ/עֶ֔רֶב כִּֽי שֹׁמְרִ֣ים אֲנַ֔חְנוּ אֶת מִשְׁמֶ֖רֶת יְהוָ֣ה אֱלֹהֵ֑י/נוּ וְ/אַתֶּ֖ם עֲזַבְתֶּ֥ם אֹתֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/011.yaml
  text: And we offer up burnt offerings to Yahweh morning by morning and evening by evening[a], and fragrant incense, and the arrangement of bread on the pure table, and the golden lampstand with its lamps to burn evening by evening; for we are keeping the charge of Yahweh our God, but you have forsaken him.
translation:
  language: pt
  text: Nós oferecemos a Yahweh ofertas queimadas manhã após manhã e tarde após tarde, incenso aromático e a disposição dos pães sobre a mesa pura; e o candelabro de ouro, com suas lâmpadas, que acendemos tarde após tarde. Pois observamos a ordem de Yahweh, nosso Deus; vocês, porém, o abandonaram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמַקְטִרִים
  choice: oferecemos
  rationale: No hifil, קטר descreve fazer a oferta subir em fumaça no altar. “Oferecemos” comunica naturalmente a ação sacrificial, enquanto “holocaustos” preserva a ideia de queima integral.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino יהוה, preservando sua função como nome próprio da aliança.
- source_word: עֹלוֹת
  choice: holocaustos
  rationale: Termo português tradicional e preciso para ofertas sacrificiais inteiramente queimadas, sem confusão com o sentido moderno extrabíblico no contexto imediato.
- source_word: בַּבֹּקֶר בַּבֹּקֶר ... וּבָעֶרֶב בָּעֶרֶב
  choice: manhã após manhã e tarde após tarde
  rationale: A repetição hebraica tem sentido distributivo e habitual; esta formulação conserva o paralelismo e soa natural em português.
- source_word: וּקְטֹרֶת סַמִּים
  choice: além do incenso aromático
  rationale: סַמִּים indica substâncias aromáticas; “incenso aromático” expressa com clareza o composto usado no culto.
- source_word: וּמַעֲרֶכֶת לֶחֶם
  choice: e dos pães dispostos
  rationale: Preserva a ideia concreta de pão organizado ou colocado em ordem, sem impor no texto principal terminologia tradicional mais interpretativa.
- source_word: עַל הַשֻּׁלְחָן הַטָּהוֹר
  choice: sobre a mesa pura
  rationale: “Pura” conserva a conotação cultual de טָהוֹר, não meramente higiênica.
- source_word: וּמְנוֹרַת הַזָּהָב וְנֵרֹתֶיהָ לְבָעֵר
  choice: Também mantemos aceso ... o candelabro de ouro com suas lâmpadas
  rationale: Reformula a construção nominal hebraica como ação verbal natural em português, mantendo o candelabro, suas lâmpadas e a função de permanecerem acesas.
- source_word: כִּי שֹׁמְרִים אֲנַחְנוּ אֶת מִשְׁמֶרֶת יְהוָה
  choice: pois cumprimos o serviço ordenado por Yahweh
  rationale: A combinação שמר + משמרת é idiomática para observar fielmente uma incumbência ou serviço. A tradução evita o pouco natural “guardamos a guarda” e conserva a noção de dever cultual confiado por Yahweh.
- source_word: וְאַתֶּם עֲזַבְתֶּם אֹתוֹ
  choice: vocês, porém, o abandonaram
  rationale: O pronome retoma Yahweh. “Porém” torna explícito o contraste marcado pela coordenação hebraica, sem alterar o conteúdo.
theological_decisions:
- issue: Terminologia dos pães do santuário
  choice: os pães dispostos
  alternative: os pães da Presença; os pães da proposição; a disposição dos pães
  rationale: O hebraico enfatiza a disposição ordenada dos pães. A opção principal permanece próxima da forma concreta da expressão e evita introduzir no texto uma designação tradicional não presente de modo explícito.
- issue: Representação do nome יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome próprio divino. “Yahweh” preserva sua identidade nominal e a dimensão da aliança.
- issue: Sentido de מִשְׁמֶרֶת יְהוָה
  choice: o serviço ordenado por Yahweh
  alternative: a incumbência de Yahweh; as prescrições de Yahweh; o dever para com Yahweh
  rationale: No contexto, a expressão abrange as obrigações sacerdotais do culto. “Serviço ordenado” comunica tanto a incumbência recebida quanto sua execução fiel, sem restringi-la a uma única cerimônia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva o paralelismo temporal do hebraico e usa “vocês” para a segunda pessoa plural. A estrutura foi levemente reorganizada em duas frases para evitar uma sequência pesada de sintagmas coordenados, sem eliminar nenhum elemento do original.
