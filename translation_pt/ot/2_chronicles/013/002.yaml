source:
  edition: WLC
  text: שָׁל֣וֹשׁ שָׁנִ֗ים מָלַךְ֙ בִּ/יר֣וּשָׁלִַ֔ם וְ/שֵׁ֣ם אִמּ֔/וֹ מִיכָיָ֥הוּ בַת אוּרִיאֵ֖ל מִן גִּבְעָ֑ה וּ/מִלְחָמָ֥ה הָיְתָ֛ה בֵּ֥ין אֲבִיָּ֖ה וּ/בֵ֥ין יָרָבְעָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/002.yaml
  text: He reigned three years in Jerusalem[a], and his mother’s name was Micaiah daughter of Uriel from Gibeah. And there was war between Abijah and Jeroboam.
translation:
  language: pt
  text: Reinou três anos em Jerusalém. Sua mãe se chamava Micaías, filha de Uriel, de Gibeá.[a] Houve guerra entre Abias e Jeroboão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto paralelo de 1 Reis 15:2 dá Maaca como o nome da mãe de Abias. Em hebraico, “filha” também pode ser usado em sentido mais amplo para uma descendente; assim, os dois relatos talvez reflitam diferentes formas de nomear ou diferentes convenções genealógicas.
    reason: alternative_reading
lexical_decisions:
- source_word: מָלַךְ
  choice: Reinou
  rationale: O verbo significa reinar ou ser rei. “Reinou” é a forma natural e concisa nas fórmulas régias em português.
- source_word: וְשֵׁם אִמּוֹ
  choice: Sua mãe se chamava
  rationale: Expressa em português atual a fórmula hebraica “e o nome de sua mãe era”, sem alterar o sentido.
- source_word: מִיכָיָהוּ
  choice: Micaías
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico, distinta de Maaca no texto paralelo de Reis.
- source_word: בַת אוּרִיאֵל
  choice: filha de Uriel
  rationale: Reproduz diretamente a relação de parentesco declarada pelo texto, sem interpretá-la de modo mais amplo no corpo da tradução.
- source_word: מִן גִּבְעָה
  choice: de Gibeá
  rationale: Neste registro genealógico, o português idiomático “de Gibeá” comunica a procedência indicada pela preposição hebraica מִן.
- source_word: וּמִלְחָמָה הָיְתָה
  choice: Houve guerra
  rationale: Equivalente português natural da construção existencial “e houve guerra”, sem acrescentar duração nem sugerir que a guerra começou especificamente nesse momento.
- source_word: בֵּין ... וּבֵין
  choice: entre ... e ...
  rationale: Corresponde à construção hebraica que apresenta duas partes em oposição mútua.
- source_word: אֲבִיָּה
  choice: Abias
  rationale: Forma portuguesa convencional do nome empregado em Crônicas; evita importar a variante Abião presente na tradição de Reis.
theological_decisions:
- issue: Diferença entre Crônicas e 1 Reis quanto ao nome e à genealogia da mãe de Abias
  choice: Manter no texto principal “Micaías, filha de Uriel, de Gibeá”
  alternative: Harmonizar com “Maaca” em 1 Reis 15:2 ou traduzir “filha” como “descendente”
  rationale: A tradução segue o texto hebraico de Crônicas e preserva a tensão com o relato paralelo. Embora בַת possa, em certos contextos, designar uma descendente, aqui o texto diz simplesmente “filha”; possíveis explicações pertencem à nota, não ao corpo da tradução.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A fórmula régia e a informação genealógica foram vertidas de modo idiomático, mantendo os nomes próprios tradicionais e sem harmonizar o texto com Reis.
