source:
  edition: WLC
  text: וַ/אֲנַ֛חְנוּ יְהוָ֥ה אֱלֹהֵ֖י/נוּ וְ/לֹ֣א עֲזַבְנֻ֑/הוּ וְ/כֹ֨הֲנִ֜ים מְשָׁרְתִ֤ים לַֽ/יהוָה֙ בְּנֵ֣י אַהֲרֹ֔ן וְ/הַ/לְוִיִּ֖ם בַּ/מְלָֽאכֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/010.yaml
  text: But as for us[a], Yahweh is our God, and we have not forsaken him; and the priests who minister to Yahweh are the sons of Aaron[b], and the Levites are in their work.
translation:
  language: pt
  text: Quanto a nós, Yahweh é o nosso Deus, e não o abandonamos[a]; os sacerdotes que servem a Yahweh são os filhos de Arão, e os levitas estão em serviço[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não o deixamos” ou “não o desamparamos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “os levitas no trabalho”, isto é, ocupados no serviço que lhes cabia.'
    reason: clarification_of_ellipsis
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: Quanto a nós
  rationale: O waw com o pronome independente marca contraste discursivo entre Judá e o reino do norte; a expressão portuguesa explicita esse contraste sem exagerá-lo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵינוּ
  choice: o nosso Deus
  rationale: Embora a forma hebraica seja morfologicamente plural, refere-se aqui ao único Deus de Israel, Yahweh; o singular é exigido pelo contexto.
- source_word: וְלֹא עֲזַבְנֻהוּ
  choice: e não o abandonamos
  rationale: עזב pode significar deixar, abandonar ou desamparar. O pretérito perfeito português pode descrever a fidelidade mantida até o presente, com naturalidade e sem impor uma distinção aspectual ausente no contexto.
- source_word: מְשָׁרְתִים
  choice: que servem
  rationale: O particípio indica serviço sacerdotal contínuo. “Servem” é claro, digno e natural em português, preservando o sentido cultual dado pelo contexto.
- source_word: בְּנֵי אַהֲרֹן
  choice: os filhos de Arão
  rationale: Mantém a expressão hebraica e sua referência à linhagem sacerdotal hereditária; “descendentes” seria uma explicitação interpretativa.
- source_word: וְהַלְוִיִּם בַּמְּלָאכֶת
  choice: e os levitas estão em serviço
  rationale: A frase hebraica é elíptica, literalmente “e os levitas no trabalho”. A formulação portuguesa completa a oração de modo natural e comunica sua atuação nas tarefas do culto sem especificá-las além do texto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e evita substituí-lo por um título.
- issue: Força temporal e pactual de עֲזַבְנֻהוּ
  choice: não o abandonamos
  alternative: não o abandonávamos; não o temos abandonado
  rationale: No discurso de Abias, o perfeito apresenta a alegada fidelidade de Judá como realidade estabelecida e ainda pertinente. O pretérito perfeito simples é a forma mais natural em português e não restringe a declaração a um passado encerrado.
- issue: Natureza do serviço dos levitas
  choice: estão em serviço
  alternative: estão no trabalho; cumprem suas funções
  rationale: O contexto indica atividade no culto, mas o substantivo מְלָאכָה permanece geral. “Em serviço” conserva essa amplitude e evita acrescentar funções específicas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O período mantém o contraste retórico inicial e a coordenação do hebraico; o ponto e vírgula evita uma sequência excessiva de orações ligadas por “e”. Os marcadores foram colocados junto às expressões efetivamente explicadas pelas notas.
