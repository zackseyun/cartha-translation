base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/003.yaml
  text: Abijah joined battle with an army of four hundred thousand chosen men[a], mighty warriors; and Jeroboam drew up for battle against him with eight hundred thousand chosen men[b], mighty men of valor.
translation:
  language: pt
  text: Abias entrou em combate com um exército de quatrocentos mil homens escolhidos, guerreiros valentes; e Jeroboão pôs em formação de batalha contra ele oitocentos mil homens escolhidos, guerreiros valentes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica traduzida por “guerreiros valentes” descreve combatentes fortes, capazes e corajosos.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּאְסֹר אֶת־הַמִּלְחָמָה
  choice: entrou em combate
  rationale: O verbo אסר significa normalmente “atar”, mas, nesta expressão militar, indica iniciar ou travar um combate. A tradução comunica o sentido idiomático em português natural.
- source_word: בְּחַיִל
  choice: com um exército
  rationale: Neste contexto de efetivos militares, חַיִל designa uma força armada, não riqueza ou valor pessoal.
- source_word: גִּבּוֹרֵי מִלְחָמָה
  choice: guerreiros valentes
  rationale: A expressão descreve homens fortes e experientes na guerra; esta formulação preserva tanto a capacidade quanto a função militar.
- source_word: בָּחוּר
  choice: escolhidos
  rationale: No contexto militar, o termo caracteriza tropas selecionadas, isto é, homens escolhidos para o combate.
- source_word: עָרַךְ עִמּוֹ מִלְחָמָה
  choice: pôs em formação de batalha contra ele
  rationale: ערך, em uso militar, indica dispor ou organizar tropas para a batalha; “contra ele” explicita naturalmente a relação adversativa do contexto.
- source_word: גִּבּוֹר חָיִל
  choice: guerreiros valentes
  rationale: A expressão militar descreve combatentes fortes, capazes e corajosos. A tradução é atual e evita uma formulação excessivamente literal.
