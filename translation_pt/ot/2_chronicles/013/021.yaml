base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/021.yaml
  text: And Abijah grew strong[b][a], and he took for himself fourteen wives and fathered twenty-two sons and sixteen daughters.
translation:
  language: pt
  text: Abias se fortaleceu[a]. Tomou para si catorze esposas[b] e gerou vinte e dois filhos e dezesseis filhas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tornou-se poderoso” ou “ganhou força”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica “tomou para si catorze esposas” significa que se casou com elas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: se fortaleceu
  rationale: O hitpael de חזק pode indicar que Abias se tornou forte, ganhou poder ou se consolidou. “Se fortaleceu” preserva a forma reflexiva e evita especificar indevidamente se a força era militar, política ou pessoal.
- source_word: אֲבִיָּהוּ
  choice: Abias
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português bíblico.
- source_word: וַיִּשָּׂא לוֹ נָשִׁים אַרְבַּע עֶשְׂרֵה
  choice: Tomou para si catorze mulheres
  rationale: Mantém de perto o idiomatismo hebraico de “tomar mulheres para si”, cujo sentido contextual é casar-se com elas, preservando também a nuance de לוֹ.
- source_word: וַיּוֹלֶד
  choice: gerou
  rationale: No hifil, ילד com sujeito masculino significa gerar ou tornar-se pai. “Gerou” é conciso, atual e mais específico que “teve”.
- source_word: עֶשְׂרִים וּשְׁנַיִם בָּנִים
  choice: vinte e dois filhos
  rationale: Reprodução direta do número e do substantivo masculino específico no hebraico.
- source_word: וְשֵׁשׁ עֶשְׂרֵה בָּנוֹת
  choice: e dezesseis filhas
  rationale: Reprodução direta do número e do substantivo feminino específico no hebraico.
theological_decisions:
- issue: Descrição de casamento poligínico
  choice: Relatar descritivamente que Abias “tomou para si catorze mulheres”, sem avaliação moral acrescentada.
  alternative: Traduzir de modo mais interpretativo como “casou-se com catorze mulheres” ou inserir uma censura implícita.
  rationale: O versículo relata a ação e a descendência de Abias sem expressar aprovação ou condenação. A tradução não deve importar uma avaliação que o texto não explicita.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Abias” segue o uso bíblico português estabelecido; “se fortaleceu” e “gerou” conservam proximidade lexical sem soar arcaicos. Os marcadores aparecem no texto na ordem de ocorrência.
