  text: But Yarobam had turned the ambush around to come behind them, so they were in front of Judah, and the ambush was behind them.
translation:
  language: pt
  text: Mas Jeroboão fez a força de emboscada contornar para vir por trás deles; assim, eles ficaram diante de Judá, e a emboscada, por trás deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָרָבְעָם
  choice: Jeroboão
  rationale: Forma tradicional e amplamente reconhecida em português para o nome hebraico Yarov‘am.
- source_word: הֵסֵב
  choice: fez ... dar a volta
  rationale: 'Expressa o causativo do verbo: Jeroboão manobrou a força para contornar Judá.'
- source_word: הַמַּאְרָב
  choice: a tropa de emboscada
  rationale: O substantivo pode indicar a emboscada ou a força emboscada; 'tropa de emboscada' torna natural a ação de deslocamento sem perder o sentido militar.
- source_word: לָבוֹא מֵאַחֲרֵיהֶם
  choice: para chegar por trás deles
  rationale: Reproduz a finalidade da manobra e a posição relativa expressa no hebraico.
- source_word: וַיִּהְיוּ
  choice: Assim, o exército estava
  rationale: O plural refere-se naturalmente às forças de Jeroboão já mencionadas no contexto; 'o exército' explicita o referente coletivo em português.
