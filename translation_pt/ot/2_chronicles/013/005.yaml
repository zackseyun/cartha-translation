  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֲ/לֹ֤א לָ/כֶם֙ לָ/דַ֔עַת כִּ֞י יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל נָתַ֨ן מַמְלָכָ֧ה לְ/דָוִ֛יד עַל יִשְׂרָאֵ֖ל לְ/עוֹלָ֑ם ל֥/וֹ וּ/לְ/בָנָ֖י/ו בְּרִ֥ית מֶֽלַח׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/005.yaml
  text: Do you not know that Yahweh[a], the God of Israel, gave the kingdom over Israel to David forever, to him and to his sons[b], by a covenant of salt?
translation:
  language: pt
  text: Vocês não sabem que Yahweh, o Deus de Israel, deu a Davi o domínio real sobre Israel para sempre, tanto a ele como a seus filhos[a], mediante uma aliança de sal[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Seus filhos” refere-se à linhagem real ou dinastia de Davi.
    reason: cultural_note
  - marker: b
    text: Ou “por uma aliança de sal”. A expressão provavelmente designa uma aliança vinculante e duradoura; compare Números 18:19.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא לָכֶם לָדַעַת
  choice: Vocês não sabem
  rationale: Reproduz como pergunta retórica, em português natural, a expectativa de que os ouvintes reconheçam um fato que deveriam conhecer.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Mantém a construção que identifica Yahweh como o Deus de Israel.
- source_word: נָתַן מַמְלָכָה לְדָוִיד עַל יִשְׂרָאֵל
  choice: deu a Davi o domínio real sobre Israel
  rationale: “Domínio real” comunica aqui a realeza ou o direito de governar concedido a Davi, enquanto “sobre Israel” preserva a relação expressa por עַל.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Preserva de modo direto a afirmação de duração permanente.
- source_word: לוֹ וּלְבָנָיו
  choice: tanto a ele como a seus filhos
  rationale: Mantém o sentido literal de “filhos”, com formulação natural em português; no contexto, refere-se à sucessão dinástica.
- source_word: בְּרִית מֶלַח
  choice: mediante uma aliança de sal
  rationale: Conserva a imagem cultural e teológica hebraica, deixando sua provável conotação de permanência para a nota.
theological_decisions:
- issue: Permanência da concessão davídica
  choice: Manter “para sempre” e a expressão concreta “aliança de sal” sem explicar sua realização teológica no corpo do versículo.
  alternative: Traduzir interpretativamente como “uma aliança permanente”.
  rationale: O hebraico reúne explicitamente לְעוֹלָם e בְּרִית מֶלַח. Preservar ambas as expressões mantém a força e a tensão do texto sem impor conclusões teológicas posteriores.
- issue: Sentido de “filhos” na promessa real
  choice: Traduzir literalmente “filhos” e esclarecer em nota a referência dinástica.
  alternative: Traduzir diretamente como “descendentes” ou “dinastia”.
  rationale: A tradução literal preserva a forma familiar masculina do hebraico, enquanto a nota comunica seu alcance contextual sem substituir o texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O plural “vocês” torna explícito o destinatário coletivo indicado pelo hebraico. “Domínio real” evita que “reino” seja entendido apenas como território e destaca a autoridade régia concedida a Davi.
