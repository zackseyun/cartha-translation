  text: In the eighteenth year of King Jeroboam[a], Abijah became king over Judah.
translation:
  language: pt
  text: No décimo oitavo ano do rei Jeroboão[a], Abias tornou-se rei de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No relato paralelo de 1 Reis 15:1, Abias é chamado de «Abião»; aqui, Crônicas traz «Abias».
