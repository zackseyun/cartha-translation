lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁמוֹנֶה עֶשְׂרֵה
  choice: No décimo oitavo ano
  rationale: A fórmula hebraica de datação régia emprega um numeral cardinal com valor ordinal; esta é a expressão natural em português.
- source_word: לַ/מֶּלֶךְ יָרָבְעָם
  choice: do rei Jeroboão
  rationale: Nesta fórmula, לְ indica o rei cujos anos de reinado estão sendo contados; a construção com «do rei» é clara e idiomática.
- source_word: וַ/יִּמְלֹךְ
  choice: tornou-se rei
  rationale: A forma verbal assinala aqui a ascensão ao trono, e não apenas a continuidade do reinado.
- source_word: אֲבִיָּה
  choice: Abias
  rationale: Transliteração portuguesa tradicional da forma hebraica אֲבִיָּה, distinta da forma alternativa encontrada no relato paralelo de Reis.
- source_word: עַל יְהוּדָה
  choice: de Judá
  rationale: Com o verbo מלך, עַל expressa o âmbito do governo. Em português, «rei de Judá» comunica isso de modo mais natural que o literal «rei sobre Judá».
