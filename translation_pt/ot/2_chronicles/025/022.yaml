lexical_decisions:
- source_word: וַיִּנָּגֶף
  choice: foi derrotado
  rationale: O nifal de נָגַף, neste contexto militar, indica que Judá foi vencido em batalha; “foi derrotado” é claro, natural e preciso.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Nome tradicional em português para o reino do sul.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Preserva a expressão hebraica comum em relatos de batalha, na qual alguém é derrotado diante do adversário, sem tornar a frase obscura em português.
- source_word: יִשְׂרָאֵל
