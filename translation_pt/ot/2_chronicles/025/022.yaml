  rationale: Nome tradicional em português para o reino do norte neste contexto.
- source_word: וַיָּנֻסוּ
  choice: fugiu
  rationale: נוּס significa fugir; o singular em português concorda naturalmente com o sujeito distributivo “cada homem”.
- source_word: אִישׁ
  choice: cada homem
  rationale: O singular distributivo refere-se individualmente aos combatentes, que no contexto são homens.
- source_word: לְאֹהָלָיו
  choice: para a sua tenda
  rationale: Mantém a imagem hebraica da tenda e expressa o retorno disperso de cada combatente ao seu próprio lugar.
