base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/003.yaml
  text: When the kingdom was firmly in his hand[a], he killed his servants who had struck down the king his father.
translation:
  language: pt
  text: Quando o reino se consolidou sob o seu domínio[a], ele matou os servos que haviam matado o rei, seu pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando o poder real se firmou em suas mãos”.'
    reason: Alternativa mais próxima da imagem concreta de controle implícita na expressão hebraica.
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Quando
  rationale: A fórmula narrativa introduz a circunstância temporal seguinte; “Quando” é natural e não acrescenta um marcador discursivo sem correspondência explícita.
- source_word: חָזְקָה הַמַּמְלָכָה עָלָיו
  choice: o reino se consolidou sob o seu domínio
  rationale: O conjunto descreve a estabilização do reino sob o controle do rei. A formulação comunica o sentido político sem reproduzir de modo obscuro o hebraísmo literal “fortaleceu-se sobre ele”.
- source_word: וַיַּהֲרֹג
  choice: ele matou
  rationale: Tradução direta, clara e atual de הרג.
- source_word: עֲבָדָיו
  choice: os servos
  rationale: Em contexto régio, עבד designa pessoas a serviço do rei; “servos” preserva a amplitude do termo sem impor que fossem escravos ou funcionários específicos.
- source_word: הַמַּכִּים
  choice: que haviam matado
  rationale: O particípio de נכה identifica os servos responsáveis pela morte anterior. O mais-que-perfeito deixa clara a anterioridade do assassinato do pai.
- source_word: אֶת־הַמֶּלֶךְ אָבִיו
  choice: o rei, seu pai
  rationale: A aposição preserva tanto o título régio quanto a relação familiar em português natural e digno.
