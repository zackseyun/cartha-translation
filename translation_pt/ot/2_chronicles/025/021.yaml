base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/021.yaml
  text: So Joash king of Israel went up[a], and he and Amaziah king of Judah faced one another at Beth-shemesh, which belongs to Judah.
translation:
  language: pt
  text: Então Joás, rei de Israel, subiu; ele e Amazias, rei de Judá, enfrentaram-se[a] em Bete-Semes, que pertence a Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “encontraram-se face a face”. A expressão hebraica diz literalmente “viram rostos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: subiu
  rationale: Em narrativa, עלה significa normalmente “subir”. Aqui descreve o deslocamento de Joás para o confronto; “subiu” preserva a expressão hebraica sem explicitar além do texto a ideia militar de marchar ou avançar.
- source_word: וַיִּתְרָאוּ פָנִים
  choice: enfrentaram-se
  rationale: A expressão recíproca com “rostos” indica que os reis ficaram frente a frente. No contexto de batalha, “enfrentaram-se” comunica naturalmente o sentido confrontativo, enquanto a nota preserva a imagem literal e a alternativa menos interpretativa.
- source_word: הוּא וַאֲמַצְיָהוּ
  choice: ele e Amazias
  rationale: O pronome explícito destaca os dois participantes. Como Joás é o sujeito imediatamente anterior, “ele e Amazias” permanece claro e acompanha de perto a estrutura hebraica.
- source_word: בְּבֵית שֶׁמֶשׁ
  choice: em Bete-Semes
  rationale: A preposição local ב é vertida naturalmente por “em”. O topônimo é transliterado na forma portuguesa corrente.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: que pertence a Judá
  rationale: A construção com ל expressa vinculação territorial ou posse. “Que pertence a Judá” conserva essa força melhor do que a formulação mais genérica “que fica em Judá”.
- source_word: מֶלֶךְ יִשְׂרָאֵל / מֶלֶךְ יְהוּדָה
  choice: rei de Israel / rei de Judá
  rationale: Os títulos reais são traduzidos diretamente, de modo claro e consistente.
theological_decisions: []
