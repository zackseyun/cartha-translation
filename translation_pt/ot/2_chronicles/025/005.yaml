revisions:
- from: Então Amazias reuniu Judá e organizou os homens por casas paternas, sob comandantes de milhares e comandantes de centenas, abrangendo todo o Judá e Benjamim. Fez o recenseamento dos que tinham vinte anos ou mais e constatou que eram trezentos mil homens selecionados[a], que saíam para a guerra[b] e sabiam manejar lança e escudo grande[c].
  to: Então Amazias reuniu Judá e os organizou segundo as casas paternas, sob chefes de milhares e chefes de centenas, para todo Judá e Benjamim. Ele os recenseou desde os vinte anos de idade para cima e constatou que eram trezentos mil homens escolhidos[a], que saíam para a guerra[b], empunhando lança e escudo grande[c].
  rationale: A revisão conserva todas as informações do texto hebraico, mas torna mais direta a expressão de escopo relativa a Judá e Benjamim e substitui a inferência de habilidade por “empunhando”, equivalente mais próximo de אֹחֵז. As notas permanecem ancoradas nos termos a que se referem e preservam as alternativas lexicais pertinentes.
