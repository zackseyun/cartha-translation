  text: וַ/יִּקְבֹּ֤ץ אֲמַצְיָ֨הוּ֙ אֶת יְהוּדָ֔ה וַ/יַּֽעֲמִידֵ֣/ם לְ/בֵית אָב֗וֹת לְ/שָׂרֵ֤י הָ/אֲלָפִים֙ וּ/לְ/שָׂרֵ֣י הַ/מֵּא֔וֹת לְ/כָל יְהוּדָ֖ה וּ/בִנְיָמִ֑ן וַֽ/יִּפְקְדֵ֗/ם לְ/מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה וַ/יִּמְצָאֵ֗/ם שְׁלֹשׁ מֵא֨וֹת אֶ֤לֶף בָּחוּר֙ יוֹצֵ֣א צָבָ֔א אֹחֵ֖ז רֹ֥מַח וְ/צִנָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/005.yaml
  text: Then Amaziah gathered Judah and appointed them by fathers’ houses under commanders of thousands and commanders of hundreds[a], for all Judah and Benjamin. He mustered them from twenty years old and upward, and found them to be three hundred thousand choice men, going out to war[c][b], able to handle spear and shield.
translation:
  language: pt
  text: Então Amazias reuniu Judá e os organizou segundo as casas paternas, sob chefes de milhares e chefes de centenas, para todo Judá e Benjamim. Ele os recenseou desde os vinte anos de idade para cima e constatou que eram trezentos mil homens escolhidos[a], que saíam para a guerra[b], empunhando lança e escudo grande[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “jovens”. O hebraico בָּחוּר pode designar um jovem, mas, neste contexto, também pode destacar homens escolhidos ou aptos para o combate.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “que saem para o exército” ou “para a guerra”; expressão hebraica referente aos que estavam habilitados ou preparados para o serviço militar.
    reason: lexical_alternative
  - marker: c
    text: O termo hebraico צִנָּה designa especificamente um escudo grande.
    reason: lexical_precision
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: reuniu
  rationale: קבץ indica reunir ou ajuntar pessoas; “reuniu” é natural e mantém a ação concreta.
- source_word: וַיַּעֲמִידֵם לְבֵית אָבוֹת
  choice: organizou os homens por casas paternas
  rationale: O hifil de עמד pode significar colocar ou dispor. No contexto militar e administrativo, “organizou” expressa a distribuição dos homens, enquanto “casas paternas” preserva a estrutura ancestral mencionada no hebraico.
- source_word: לְשָׂרֵי הָאֲלָפִים וּלְשָׂרֵי הַמֵּאוֹת
  choice: sob comandantes de milhares e comandantes de centenas
  rationale: שׂרים designa chefes ou oficiais; “comandantes” se ajusta ao contexto militar e conserva os níveis de mil e cem.
- source_word: לְכָל יְהוּדָה וּבִנְיָמִן
  choice: abrangendo todo o Judá e Benjamim
  rationale: A formulação comunica o alcance da organização sem limitar a expressão a uma leitura meramente geográfica.
- source_word: וַיִּפְקְדֵם
  choice: fez o recenseamento
  rationale: פקד, neste contexto militar, envolve contar e passar em revista os homens; “fez o recenseamento” comunica claramente o ato de contagem oficial.
- source_word: לְמִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: dos que tinham vinte anos ou mais
  rationale: Forma portuguesa corrente para o limiar de idade expresso no hebraico.
- source_word: וַיִּמְצָאֵם
  choice: constatou que eram
  rationale: מצא introduz aqui o resultado apurado no recenseamento; “constatou” transmite essa função naturalmente.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף
  choice: trezentos mil
  rationale: Tradução direta do numeral hebraico.
- source_word: בָּחוּר
  choice: homens selecionados
  rationale: בָּחוּר pode indicar jovens ou homens escolhidos e aptos; no recenseamento militar, “selecionados” representa bem o provável valor contextual sem ocultar a alternativa, registrada em nota.
- source_word: יוֹצֵא צָבָא
  choice: que saíam para a guerra
  rationale: Mantém de perto a imagem e a construção idiomática hebraica, deixando sua função militar ser esclarecida em nota.
- source_word: אֹחֵז רֹמַח וְצִנָּה
  choice: sabiam manejar lança e escudo grande
  rationale: אֹחֵז denota segurar ou empunhar e, no contexto, capacidade de usar as armas. צִנָּה é especificamente um escudo grande, distinção preservada no texto.
