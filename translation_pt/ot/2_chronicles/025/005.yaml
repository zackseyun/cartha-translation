  naturalness: O português é claro e de registro adequado. “Para todo Judá e Benjamim” é mais simples e mais próximo da construção hebraica do que “abrangendo todo o Judá e Benjamim”. “Empunhando lança e escudo grande” conserva melhor o paralelismo participial e continua natural.
