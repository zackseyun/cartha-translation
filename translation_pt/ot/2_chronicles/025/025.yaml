  text: Amaziah son of Joash[a], king of Judah, lived fifteen years after the death of Joash son of Jehoahaz, king of Israel.
translation:
  language: pt
  text: Amazias, filho de Joás, rei de Judá, viveu quinze anos depois da morte de Joás, filho de Jeoacaz, rei de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, Amazias sobreviveu a Joás, rei de Israel, por quinze anos.
