lexical_decisions:
- source_word: וַיְחִי
  choice: viveu
  rationale: O verbo חיה, seguido pela duração de quinze anos, descreve a continuidade da vida de Amazias; “viveu” preserva a formulação hebraica sem explicitar além do necessário que ele sobreviveu ao outro rei.
- source_word: אֲמַצְיָהוּ
  choice: Amazias
  rationale: Forma tradicional e amplamente reconhecida em português para o nome hebraico.
- source_word: בֶן
  choice: filho de
  rationale: Equivalente natural em português na identificação genealógica.
- source_word: יוֹאָשׁ
  choice: Joás
  rationale: Forma portuguesa corrente do nome; os dois homens de mesmo nome são distinguidos pela filiação e pelo reino.
- source_word: מֶלֶךְ יְהוּדָה
  choice: rei de Judá
  rationale: Tradução direta e idiomática da cadeia construta que indica o domínio real.
- source_word: אַחֲרֵי מוֹת
  choice: depois da morte de
  rationale: Preserva a construção nominal do hebraico e soa natural em português.
- source_word: יְהוֹאָחָז
  choice: Jeoacaz
  rationale: Forma tradicional e reconhecida em português para o nome hebraico.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: rei de Israel
  rationale: Tradução direta e idiomática da cadeia construta.
- source_word: חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: quinze anos
  rationale: Equivalente português natural e exato da expressão numeral hebraica.
