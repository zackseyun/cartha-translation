  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בַּ/אֲמַצְיָ֑הוּ וַ/יִּשְׁלַ֤ח אֵלָי/ו֙ נָבִ֔יא וַ/יֹּ֣אמֶר ל֗/וֹ לָ֤/מָּה דָרַ֨שְׁתָּ֙ אֶת אֱלֹהֵ֣י הָ/עָ֔ם אֲשֶׁ֛ר לֹא הִצִּ֥ילוּ אֶת עַמָּ֖/ם מִ/יָּדֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/015.yaml
  text: Then Yahweh’s anger burned against Amaziah[a], and he sent a prophet to him, who said to him, “Why have you sought the gods of the people who did not deliver their people from your hand?”
translation:
  language: pt
  text: 'Então a ira de Yahweh se acendeu contra Amazias, e ele lhe enviou um profeta, que lhe disse: “Por que você buscou[a] os deuses desse povo, que não livraram seu povo da sua mão?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “consultou” ou “recorreu aos”.
    reason: O verbo hebraico pode indicar buscar, consultar ou recorrer a uma divindade; a nota preserva essas possibilidades contextuais.
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: a ira ... se acendeu
  rationale: Preserva a imagem vívida do idioma hebraico de ira ardente, em uma formulação natural e digna em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בַּאֲמַצְיָהוּ
  choice: contra Amazias
  rationale: Com o verbo de ira, a preposição indica que a hostilidade se dirige a Amazias.
- source_word: נָבִיא
  choice: um profeta
  rationale: Equivalente corrente do termo hebraico para um mensageiro profético.
- source_word: דָרַשְׁתָּ
  choice: buscou
  rationale: Mantém a amplitude do verbo hebraico, que neste contexto pode significar buscar, consultar ou recorrer religiosamente aos deuses, sem reduzi-lo apenas a adoração.
- source_word: אֱלֹהֵי הָעָם
  choice: os deuses desse povo
  rationale: Expressa naturalmente que se trata dos deuses do povo derrotado mencionado no contexto.
- source_word: אֲשֶׁר לֹא הִצִּילוּ
  choice: que não livraram
  rationale: Conserva a afirmação factual do hebraico e seu contexto militar, sem ampliá-la para 'não puderam salvar'.
- source_word: עַמָּם
  choice: seu povo
  rationale: Traduz de modo direto o possessivo hebraico, sem acrescentar ênfase ausente no texto.
- source_word: מִיָּדֶךָ
  choice: das suas mãos
  rationale: Preserva em português a imagem hebraica da mão como poder ou domínio, usando uma expressão compreensível no contexto militar.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Sentido religioso de דָרַשְׁתָּ
  choice: buscou
  alternative: consultou; recorreu a; adorou
  rationale: A opção escolhida mantém a ambiguidade entre procurar orientação e voltar-se religiosamente para esses deuses; 'adorou' resolveria a questão além do que o verbo isoladamente exige.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tratamento por “você” torna a repreensão direta e clara; a sintaxe conserva dignidade bíblica sem arcaísmos desnecessários.
