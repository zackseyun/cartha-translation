  text: וְ/אֵת֩ אֲמַצְיָ֨הוּ מֶֽלֶךְ יְהוּדָ֜ה בֶּן יוֹאָ֣שׁ בֶּן יְהוֹאָחָ֗ז תָּפַ֛שׂ יוֹאָ֥שׁ מֶֽלֶךְ יִשְׂרָאֵ֖ל בְּ/בֵ֣ית שָׁ֑מֶשׁ וַ/יְבִיאֵ֨/הוּ֙ יְר֣וּשָׁלִַ֔ם וַ/יִּפְרֹ֞ץ בְּ/חוֹמַ֣ת יְרוּשָׁלִַ֗ם מִ/שַּׁ֤עַר אֶפְרַ֨יִם֙ עַד שַׁ֣עַר הַ/פּוֹנֶ֔ה אַרְבַּ֥ע מֵא֖וֹת אַמָּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/023.yaml
  text: And Joash king of Israel captured Amaziah king of Judah[a], the son of Joash, son of Jehoahaz, at Beth-shemesh, and brought him to Jerusalem. Then he broke down the wall of Jerusalem from the Ephraim Gate to the Corner Gate, four hundred cubits.
translation:
  language: pt
  text: Joás, rei de Israel, capturou Amazias, rei de Judá, filho de Joás, filho de Jeoacaz, em Bete-Semes, e o levou a Jerusalém. Depois, derrubou a muralha de Jerusalém desde a Porta de Efraim até a Porta da Esquina[a], numa extensão de quatrocentos côvados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “a porta que se volta” ou “a porta que dá para”. A tradução “Porta da Esquina” segue a provável identificação no relato paralelo de 2 Reis 14:13.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּפַשׂ
  choice: capturou
  rationale: O verbo indica agarrar ou tomar sob custódia; no contexto militar, “capturou” é claro, natural e suficientemente preciso.
- source_word: בְּבֵית שָׁמֶשׁ
  choice: em Bete-Semes
  rationale: A preposição בְּ localiza a captura; “em” é idiomático em português, e o topônimo recebe a forma tradicional portuguesa.
- source_word: וַיְבִיאֵהוּ
  choice: e o levou
  rationale: O hifil de בוא significa fazer vir ou trazer. Como o movimento parte de Bete-Semes em direção a Jerusalém, “levou” soa mais natural em português sem acrescentar detalhes ao texto.
- source_word: וַיִּפְרֹץ בְּחוֹמַת יְרוּשָׁלִַם
  choice: derrubou a muralha de Jerusalém
  rationale: פרץ, nesta construção, descreve abrir uma brecha ou demolir parte de uma muralha. “Derrubou” comunica a ação com clareza em linguagem corrente.
- source_word: מִשַּׁעַר אֶפְרַיִם עַד שַׁעַר הַפּוֹנֶה
  choice: desde a Porta de Efraim até a Porta da Esquina
  rationale: A primeira expressão é o nome de uma porta da cidade. Para הַפּוֹנֶה, “Porta da Esquina” segue a provável identificação indicada pelo relato paralelo de 2 Reis 14:13; a incerteza lexical é preservada em nota.
- source_word: אַרְבַּע מֵאוֹת אַמָּה
  choice: numa extensão de quatrocentos côvados
  rationale: O hebraico apresenta diretamente a medida. “Numa extensão de” torna explícita em português a função da medida sem alterar seu valor, e “côvados” preserva a unidade antiga.
- source_word: בֶּן יוֹאָשׁ בֶּן יְהוֹאָחָז
  choice: filho de Joás, filho de Jeoacaz
  rationale: A sequência genealógica é mantida sem omitir nenhuma geração nem resolver além do texto a relação expressa pelas duas ocorrências de בֶּן.
theological_decisions: []
