base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/026.yaml
  text: The rest of the acts of Amaziah[a], from first to last[b], are they not written in the Book of the Kings of Judah and Israel?
translation:
  language: pt
  text: Quanto aos demais atos de Amazias, do primeiro ao último, não estão escritos no Livro[a] dos Reis de Judá e de Israel?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “sobre o Livro”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אֲמַצְיָהוּ
  choice: Quanto aos demais atos de Amazias
  rationale: A construção introduz o restante do registro sobre o rei. Em fórmulas historiográficas, דִּבְרֵי, literalmente “palavras” ou “assuntos”, abrange os atos e acontecimentos do reinado; “atos” comunica esse sentido com naturalidade. “Quanto aos” expressa de modo idiomático a transição marcada pelo וְ inicial, sem acrescentar uma ideia temporal como “agora”.
- source_word: הָרִאשֹׁנִים וְהָאַחֲרוֹנִים
  choice: do primeiro ao último
  rationale: A expressão emparelhada abrange toda a sequência dos atos de Amazias. A formulação preserva a imagem do hebraico e é clara em português.
- source_word: הֲלֹא הִנָּם כְּתוּבִים
  choice: não estão escritos
  rationale: Mantém a pergunta retórica que espera resposta afirmativa. A ênfase de הִנָּם é adequadamente transmitida pela própria construção interrogativa, sem a inserção pouco natural de “eis que”.
- source_word: עַל סֵפֶר
  choice: no Livro
  rationale: Embora עַל tenha como sentido básico “sobre”, nesta fórmula documental o português idiomático diz que algo está escrito “no” livro. “Livro” é uma designação convencional e acessível para o documento citado.
- source_word: מַלְכֵי יְהוּדָה וְיִשְׂרָאֵל
  choice: dos Reis de Judá e de Israel
  rationale: Trata-se de uma referência com caráter de título ao documento-fonte; as maiúsculas refletem essa função, e a ordem hebraica dos nomes é preservada.
