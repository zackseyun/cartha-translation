base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/012.yaml
  text: And the sons of Judah captured ten thousand alive[a], brought them to the top of the cliff, and threw them down from the top of the cliff[b], and all of them were dashed to pieces.
translation:
  language: pt
  text: Os filhos de Judá capturaram vivos dez mil, levaram-nos ao topo do penhasco[a] e os lançaram do topo do penhasco; e todos eles foram despedaçados[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “rochedo” ou “escarpa” (hebraico: sela‘).'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “foram fendidos” ou “foram partidos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁבוּ
  choice: capturaram
  rationale: No contexto militar, com חַיִּים (“vivos”), o verbo indica que os homens foram capturados, e não mortos em combate.
- source_word: חַיִּים
  choice: vivos
  rationale: O termo tem valor predicativo e indica que os dez mil foram capturados com vida.
- source_word: וַיְבִיאוּם
  choice: levaram-nos
  rationale: O hiphil de בוא significa normalmente “fazer vir, trazer”; neste contexto, “levaram-nos” expressa com naturalidade o deslocamento até o alto do penhasco.
- source_word: לְרֹאשׁ
  choice: ao topo de
  rationale: רֹאשׁ significa literalmente “cabeça”, mas, aplicado a um acidente geográfico, designa seu topo ou cume.
- source_word: הַסָּלַע / הַסֶּלַע
  choice: o penhasco
  rationale: סֶלַע pode designar rocha, rochedo ou escarpa. A ação de lançar pessoas de seu topo favorece “penhasco” como equivalente claro em português.
- source_word: וַיַּשְׁלִיכוּם
  choice: os lançaram
  rationale: שלך significa “lançar, atirar”. A frase seguinte explicita que foram lançados do topo, dispensando acrescentar “para baixo”.
- source_word: נִבְקָעוּ
  choice: se despedaçaram
  rationale: O nifal de בקע significa “ser fendido, partir-se, romper-se”. No contexto da queda, “se despedaçaram” comunica naturalmente o resultado sem suavizar a violência.
- source_word: וְכֻלָּם
  choice: e todos eles
  rationale: Preserva tanto a coordenação hebraica quanto a totalidade expressa pelo pronome sufixado.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “topo do penhasco” foi mantida para refletir a estrutura enfática do hebraico; a coordenação final com “e” evita introduzir uma relação explícita de propósito ou resultado que o texto não formula.
