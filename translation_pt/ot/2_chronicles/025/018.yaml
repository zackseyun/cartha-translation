base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/018.yaml
  text: Then Joash king of Israel sent to Amaziah king of Judah[a], saying, “The thornbush that was in Lebanon sent to the cedar that was in Lebanon, saying, ‘Give your daughter to my son as a wife.’ Then a wild beast of the field that was in Lebanon passed by and trampled the thornbush.”
translation:
  language: pt
  text: 'Então Joás, rei de Israel, mandou dizer a Amazias, rei de Judá: “O espinheiro[a] que estava no Líbano mandou dizer ao cedro que estava no Líbano: ‘Dê sua filha ao meu filho por esposa.’ Então um animal selvagem do campo que estava no Líbano passou e pisoteou o espinheiro.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cardo” ou “sarça”. O hebraico designa uma planta espinhosa, mas não se sabe ao certo qual era a espécie.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחוֹחַ
  choice: o espinheiro
  rationale: חוֹחַ designa uma planta espinhosa de espécie incerta. “Espinheiro” é natural em português, preserva o contraste com o cedro e evita uma identificação botânica excessivamente específica.
- source_word: הָאֶרֶז
  choice: o cedro
  rationale: אֶרֶז refere-se diretamente ao cedro, cuja altura e imponência intensificam o contraste da comparação.
- source_word: בַּלְּבָנוֹן
  choice: do Líbano
  rationale: Neste contexto, “do Líbano” expressa de modo idiomático a localização ou procedência das plantas e do animal, sem alterar o cenário da narrativa.
- source_word: וַיִּשְׁלַח ... לֵאמֹר
  choice: mandou dizer
  rationale: A expressão portuguesa explicita naturalmente que foi enviada uma mensagem e corresponde à fórmula hebraica de envio seguida de fala.
- source_word: תְּנָה אֶת־בִּתְּךָ לִבְנִי לְאִשָּׁה
  choice: Dê sua filha ao meu filho por esposa
  rationale: Preserva a fórmula de aliança matrimonial e soa clara, atual e digna em português.
- source_word: חַיַּת הַשָּׂדֶה
  choice: um animal selvagem
  rationale: A expressão hebraica indica genericamente um animal terrestre não domesticado; “animal selvagem” comunica isso com naturalidade sem especificar a espécie.
- source_word: וַתַּעֲבֹר
  choice: passou
  rationale: Reproduz de maneira simples o movimento incidental do animal, sem acrescentar uma direção não expressa no hebraico.
- source_word: וַתִּרְמֹס
  choice: pisoteou
  rationale: רמס descreve o ato de calcar ou esmagar com os pés; “pisoteou” é conciso e vívido.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A fala mantém tom proverbial e digno. “Mandou dizer” evita o pouco natural “enviou a... dizendo”; a repetição do verbo preserva o paralelismo entre a moldura narrativa e a comparação. O marcador [a] foi colocado imediatamente após a última ocorrência de “espinheiro”, cobrindo o termo no conjunto da imagem.
