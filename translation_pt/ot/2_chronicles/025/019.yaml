base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/019.yaml
  text: You said[a], ‘Look, you have struck Edom, and your heart has lifted you up to boast.’ Now stay at home. Why should you provoke disaster, so that you fall—you and Judah with you?
translation:
  language: pt
  text: 'Você disse[a]: ‘Veja, você derrotou Edom, e seu coração o encheu de orgulho, para se gloriar’. Agora fique em casa. Por que você provocaria a desgraça e cairia, você e Judá com você?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seu coração o exaltou para buscar honra” ou “seu coração o elevou para se gloriar”. O hebraico emprega uma expressão idiomática para a autoexaltação depois da vitória.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתָּ
  choice: Você disse
  rationale: O qal perfeito na segunda pessoa masculina singular introduz a alegação atribuída ao rei; o pretérito perfeito é natural no discurso narrativo em português.
- source_word: הִנֵּה
  choice: Veja
  rationale: A partícula dêitica dá ênfase ao que segue; “Veja” conserva essa força em linguagem moderna e digna.
- source_word: הִכִּיתָ אֶת אֱדוֹם
  choice: você derrotou Edom
  rationale: O hifil de נכה pode significar golpear ou derrotar. No contexto militar, “derrotou” comunica com clareza o resultado da campanha.
- source_word: וּנְשָׂאֲךָ לִבְּךָ
  choice: o seu coração se exaltou
  rationale: A formulação preserva a imagem hebraica do coração elevado e comunica orgulho sem apagar a metáfora.
- source_word: לְהַכְבִּיד
  choice: para se gloriar
  rationale: O infinitivo de כבד pode envolver glória, honra ou ostentação. “Gloriar-se” mantém a ligação lexical com glória e, no contexto da repreensão, sugere autoexaltação.
- source_word: עַתָּה שְׁבָה בְּבֵיתֶךָ
  choice: Agora fique em casa
  rationale: 'A ordem é idiomática: o rei deve permanecer onde está e não sair para a guerra. A tradução é direta e natural.'
- source_word: לָמָּה תִתְגָּרֶה בְּרָעָה
  choice: Por que provocar a desgraça
  rationale: O hitpael de גרה denota provocar ou envolver-se em conflito, enquanto רעה aqui aponta para calamidade, não necessariamente para mal moral.
- source_word: וְנָפַלְתָּ
  choice: e cair
  rationale: O verbo apresenta a queda como consequência da provocação. A coordenação mantém a concisão e a força da pergunta retórica hebraica.
- source_word: אַתָּה וִיהוּדָה עִמָּךְ
  choice: você e Judá com você
  rationale: A expressão ressalta que a queda do rei arrastaria Judá consigo; a tradução conserva a repetição enfática do pronome e do acompanhamento.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de boa legibilidade brasileira. O tratamento por “você” mantém a interpelação direta; a linguagem evita arcaísmos. A tradução preserva a metáfora do coração exaltado e deixa visível a ambiguidade entre gloriar-se, orgulhar-se e buscar honra.
