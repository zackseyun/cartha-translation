review_pass:
  verdict: revise
  source_fidelity: A tradução comunica corretamente a vitória sobre Edom, a advertência para permanecer em casa e a queda conjunta do rei e de Judá. Contudo, «o seu coração se exaltou» altera a relação do hebraico, no qual o coração do rei o eleva/ensoberbece. A pergunta final também fica mais clara e fiel com verbos finitos que mantenham o rei como sujeito.
  naturalness: O registro é moderno e claro. «Por que provocar a desgraça e cair» é compreensível, mas a construção infinitiva é menos direta do que a pergunta retórica dirigida ao rei. «Seu coração o encheu de orgulho» é idiomático e preserva o sentido de autoexaltação.
  terminology: «Edom», «Judá» e «desgraça» são adequados ao contexto. «Gloriar-se» é possível para להתכבד, mas «encher de orgulho» no texto principal comunica melhor o nexo idiomático; a alternativa de buscar honra pode permanecer em nota.
  issues:
  - severity: medium
    issue: O sujeito e o objeto da expressão sobre o coração foram alterados.
    rationale: וּנְשָׂאֲךָ לִבְּךָ significa literalmente que «seu coração o elevou», não que o próprio coração «se exaltou». A redação revista conserva que o orgulho do rei decorre de seu coração.
  - severity: low
    issue: A nota propõe «Você pensou» como alternativa para אָמַרְתָּ.
    rationale: O verbo significa «você disse»; «pensou» não é uma alternativa lexical segura neste versículo. A nota deve limitar-se à expressão idiomática subsequente.
  - severity: low
    issue: A pergunta final usa infinitivos coordenados.
    rationale: Verbos finitos tornam explícita a relação entre provocar a calamidade e a consequente queda do rei, sem alterar a concisão retórica.
