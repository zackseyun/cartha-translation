  source_fidelity: O texto reproduz com precisão o contraste introduzido por וְ, o objeto explícito “os filhos deles”, a negativa do hifil de מות, a fundamentação na Lei/no Livro de Moisés e a citação legal. “Serão mortos” comunica adequadamente o sentido judicial das duas proibições; “cada um morrerá por seu próprio pecado” preserva de modo sóbrio a formulação distributiva e a ambiguidade relativa da cláusula final.
