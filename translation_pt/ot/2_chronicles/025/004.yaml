  terminology: “Lei”, “Livro de Moisés”, “Yahweh”, “pais”, “filhos” e “pecado” são escolhas consistentes e adequadas ao registro. A nota explica de forma suficiente a diferença entre a formulação literal “não morrerão” e a explicitação jurídica do texto principal, sem impor interpretação doutrinária.
