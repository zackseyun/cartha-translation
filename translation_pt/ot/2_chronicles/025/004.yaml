base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/004.yaml
  text: But he did not put their sons to death[a], because it is written in the Law, in the Book of Moses, where Yahweh commanded, saying, “Fathers shall not be put to death for sons, and sons shall not be put to death for fathers, but each man shall die for his own sin.”
translation:
  language: pt
  text: 'Mas não matou os filhos deles, pois está escrito na Lei, no Livro de Moisés, onde Yahweh ordenou: “Os pais não serão mortos por causa dos filhos, nem os filhos serão mortos por causa dos pais; cada um morrerá por seu próprio pecado.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “os pais não morrerão por causa dos filhos, nem os filhos morrerão por causa dos pais”. No contexto, a expressão hebraica tem sentido jurídico, por isso foi traduzida no texto como “não serão mortos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת בְּנֵיהֶם לֹא הֵמִית
  choice: Mas não matou os filhos deles
  rationale: A conjunção marca contraste com a execução dos assassinos no versículo anterior. O hifil de מות é causativo; em português, “não matou” expressa com naturalidade que Amazias não lhes aplicou a pena de morte. “Filhos” preserva o masculino plural do hebraico.
- source_word: כִּי כַכָּתוּב
  choice: pois está escrito
  rationale: Introduz a razão da conduta de Amazias mediante apelo ao texto legal; a formulação é corrente e mantém a força causal.
- source_word: בַּתּוֹרָה בְּסֵפֶר מֹשֶׁה
  choice: na Lei, no Livro de Moisés
  rationale: “Lei” comunica de modo acessível o sentido escriturístico e jurídico de תּוֹרָה, enquanto “Livro de Moisés” conserva a designação formal da fonte citada.
- source_word: אֲשֶׁר צִוָּה יְהוָה לֵאמֹר
  choice: onde Yahweh ordenou
  rationale: A oração relativa remete ao texto legal citado. “Ordenou” preserva a força de צוה; os dois-pontos introduzem naturalmente a citação sem exigir uma tradução mecânica de לֵאמֹר.
- source_word: לֹא יָמוּתוּ אָבוֹת עַל בָּנִים וּבָנִים לֹא יָמוּתוּ עַל אָבוֹת
  choice: Os pais não serão mortos por causa dos filhos, nem os filhos serão mortos por causa dos pais
  rationale: No contexto jurídico, “serão mortos” torna clara a proibição de aplicar a pena de morte a alguém pela culpa de seu familiar. “Por causa de” traduz עַל como fundamento de responsabilidade, e a estrutura paralela mantém a simetria hebraica.
- source_word: כִּי אִישׁ בְּחֶטְאוֹ יָמוּתוּ
  choice: cada um morrerá por seu próprio pecado
  rationale: אִישׁ tem sentido distributivo, adequadamente expresso por “cada um”. “Seu próprio pecado” explicita sem ampliar a responsabilidade individual indicada pelo sufixo hebraico. O singular em português comunica a distribuição, apesar da forma verbal plural no hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama. “Yahweh” translitera de maneira amplamente reconhecível o nome pessoal divino e não o substitui por um título.
- issue: Natureza da morte na citação legal
  choice: “serão mortos” nas cláusulas proibitivas; “morrerá” na conclusão
  alternative: Traduzir todas as ocorrências simplesmente por “morrer” ou todas por “ser morto”
  rationale: A formulação proibitiva ocorre em contexto judicial e indica que ninguém deve sofrer pena de morte pela culpa de parentes. A conclusão hebraica permanece formalmente ambígua entre morrer e ser morto; “morrerá” preserva essa tensão, enquanto a nota registra a forma mais literal da proibição.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe direta. A formulação jurídica é clara sem se tornar técnica; “Yahweh” preserva o nome divino. O marcador [a] aparece no texto principal e remete à alternativa mais literal.
