base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/006.yaml
  text: And he hired from Israel one hundred thousand mighty men of valor for one hundred talents of silver[a].
translation:
  language: pt
  text: Contratou de Israel cem mil guerreiros valentes[a] por cem talentos de prata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «guerreiros poderosos» ou «combatentes capazes». A expressão hebraica designa homens capazes e valentes para a guerra.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂכֹּר
  choice: Também contratou
  rationale: O verbo שׂכר no qal significa contratar mediante pagamento. «Contratou» expressa o sentido sem acrescentar a ideia interpretativa de «mercenários»; «também» liga naturalmente a ação ao contexto narrativo.
- source_word: מִיִּשְׂרָאֵל
  choice: de Israel
  rationale: A preposição מן indica origem ou procedência. Aqui, Israel se refere ao reino do norte, de onde vieram as tropas contratadas.
- source_word: מֵאָה אֶלֶף
  choice: cem mil
  rationale: Reprodução direta e natural do numeral hebraico.
- source_word: גִּבּוֹר חָיִל
  choice: guerreiros valentes
  rationale: A expressão designa homens fortes e capazes para a guerra. «Guerreiros valentes» preserva tanto o sentido militar quanto a ideia de valor, em português atual.
- source_word: בְּמֵאָה כִכַּר כָּסֶף
  choice: por cem talentos de prata
  rationale: A preposição בְּ indica aqui o preço pago. Mantém-se «talentos», a unidade antiga, sem conversão especulativa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação mantém a concisão do hebraico e conserva a antiga unidade monetária.
