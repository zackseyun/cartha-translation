  text: כִּ֚י אִם בֹּ֣א אַתָּ֔ה עֲשֵׂ֖ה חֲזַ֣ק לַ/מִּלְחָמָ֑ה יַכְשִֽׁילְ/ךָ֤ הָֽ/אֱלֹהִים֙ לִ/פְנֵ֣י אוֹיֵ֔ב כִּ֥י יֶשׁ כֹּ֛חַ בֵּ/אלֹהִ֖ים לַ/עְז֥וֹר וּ/לְ/הַכְשִֽׁיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/008.yaml
  text: But if you do go[a], act resolutely in battle; God will make you stumble before the enemy[b], for there is power in God to help and to make stumble.
translation:
  language: pt
  text: Mas, se você realmente for, seja forte para a batalha. Deus fará você tropeçar diante do inimigo[a], pois Deus tem poder tanto para ajudar como para fazer tropeçar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico repete o mesmo verbo: Deus tem poder tanto para “ajudar” como para “fazer tropeçar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Mas, se
  rationale: Introduz uma condição em contraste com a instrução anterior.
- source_word: בֹּא אַתָּה
  choice: você realmente for
  rationale: O pronome explícito reforça a segunda pessoa; “realmente” comunica essa ênfase de modo natural em português.
- source_word: עֲשֵׂה חֲזַק לַמִּלְחָמָה
  choice: seja forte para a batalha
  rationale: Preserva a formulação incomum do hebraico e sua exortação militar, sem especificar além do texto se a força é coragem ou ação resoluta.
- source_word: יַכְשִׁילְךָ
  choice: fará você tropeçar
  rationale: Traduz diretamente o causativo de כשל e permite conservar a repetição da mesma raiz no fim do versículo.
- source_word: לִפְנֵי אוֹיֵב
  choice: diante do inimigo
  rationale: Expressa naturalmente a derrota na presença ou perante o adversário.
- source_word: יֶשׁ כֹּחַ בֵּאלֹהִים
  choice: Deus tem poder
  rationale: Forma idiomática em português que preserva a afirmação de que o poder reside em Deus.
- source_word: לַעְזֹר וּלְהַכְשִׁיל
  choice: tanto para ajudar como para fazer tropeçar
  rationale: Mantém o paralelismo entre as duas ações e repete “fazer tropeçar”, como no hebraico.
theological_decisions:
- issue: Agência divina na derrota militar
  choice: Deus fará você tropeçar
  alternative: Deus permitirá que você caia
  rationale: O hebraico atribui diretamente a Deus a ação causativa. A tradução conserva essa tensão teológica em vez de suavizá-la como mera permissão.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição de “fazer tropeçar” foi mantida por sua importância retórica e teológica.
