base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/014.yaml
  text: It happened[a], after Amaziah came from striking down the Edomites, that he brought the gods of the sons of Seir and set them up for himself as gods; and before them he bowed down[c][b], and to them he burned incense.
translation:
  language: pt
  text: Aconteceu que, depois que Amazias voltou de derrotar os edomitas, trouxe os deuses dos filhos de Seir[a], colocou-os para si como deuses, prostrou-se diante deles[b] e queimou incenso para eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «os deuses do povo de Seir». O hebraico diz literalmente «os deuses dos filhos de Seir».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «inclinou-se diante deles».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי בּוֹא
  choice: Depois que ... voltou
  rationale: A construção introduz o episódio seguinte e situa a ação após a chegada de Amazias. Em português, «depois que voltou» expressa naturalmente o retorno implícito pelo contexto, sem reproduzir de modo artificial a fórmula narrativa.
- source_word: מֵהַכּוֹת אֶת אֲדוֹמִים
  choice: de derrotar os edomitas
  rationale: נכה significa golpear ou abater e, neste contexto militar, comunica a derrota dos edomitas. «Derrotar» é natural e não afirma que todos tenham sido mortos.
- source_word: אֱלֹהֵי בְּנֵי שֵׂעִיר
  choice: os deuses dos filhos de Seir
  rationale: אֱלֹהֵי é plural e designa as divindades pagãs. A expressão formal «filhos de Seir» preserva a formulação hebraica; a nota oferece o sentido idiomático.
- source_word: וַיַּעֲמִידֵם לוֹ לֵאלֹהִים
  choice: estabeleceu-os para si como deuses
  rationale: O hifil de עמד pode indicar colocar ou estabelecer. A tradução mantém tanto a ideia de instalação quanto a adoção dessas figuras como deuses pessoais.
- source_word: וְלִפְנֵיהֶם יִשְׁתַּחֲוֶה
  choice: prostrou-se diante deles
  rationale: השתחוה descreve inclinar-se profundamente ou prostrar-se, aqui claramente como ato de culto. A formulação preserva o gesto concreto sem substituí-lo apenas por «adorou».
- source_word: וְלָהֶם יְקַטֵּר
  choice: queimou incenso a eles
  rationale: O piel de קטר normalmente indica queimar incenso ou produzir fumaça sacrificial. A redação conserva explicitamente tanto o ato quanto seus destinatários.
theological_decisions:
- issue: Sentido de אֱלֹהֵי para divindades pagãs
  choice: deuses
  alternative: seres divinos
  rationale: O contexto fala das divindades de Seir que Amazias adotou e cultuou. «Deuses» é o equivalente direto e preserva a acusação narrativa de apostasia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe narrativa foi naturalizada sem acrescentar um marcador como «ora» ou «aconteceu», e a terminologia concreta do culto foi preservada.
