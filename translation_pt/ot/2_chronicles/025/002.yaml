  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה רַ֕ק לֹ֖א בְּ/לֵבָ֥ב שָׁלֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/002.yaml
  text: He did what was right in the eyes of Yahweh[a], yet not with a whole heart.
translation:
  language: pt
  text: Ele fez o que era certo aos olhos de Yahweh, mas não de todo o coração.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não com coração íntegro” ou “não com coração completo”. O hebraico diz literalmente “não com coração inteiro/completo” e indica uma devoção incompleta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ele fez
  rationale: O waw consecutivo introduz uma ação passada na narrativa; em português, a conjunção inicial pode ser omitida com naturalidade.
- source_word: הַיָּשָׁר
  choice: o que era certo
  rationale: O adjetivo com artigo tem função substantiva e expressa aquilo que era reto ou correto.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Preserva a metáfora do idioma hebraico de avaliação e verte diretamente o nome divino.
- source_word: רַק
  choice: mas
  rationale: Neste contexto, a partícula limita e contrasta a avaliação positiva anterior; “mas” comunica claramente sua força adversativa em português.
- source_word: בְּלֵבָב שָׁלֵם
  choice: de todo o coração
  rationale: Expressão portuguesa natural que comunica inteireza e plenitude de devoção sem sugerir impecabilidade moral.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Nuance da devoção de Amazias
  choice: não de todo o coração
  alternative: não com coração íntegro; não com coração perfeito
  rationale: A formulação mantém a tensão entre uma conduta exteriormente correta e uma devoção interior incompleta, sem interpretar a expressão como ausência de pecado ou como hipocrisia total.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. A expressão idiomática “de todo o coração” comunica com clareza o sentido do hebraico, enquanto a nota preserva sua forma metafórica e alternativas lexicais.
