  text: וְ/לֹא שָׁמַ֣ע אֲמַצְיָ֔הוּ כִּ֤י מֵ/הָֽ/אֱלֹהִים֙ הִ֔יא לְמַ֖עַן תִּתָּ֣/ם בְּ/יָ֑ד כִּ֣י דָֽרְשׁ֔וּ אֵ֖ת אֱלֹהֵ֥י אֱדֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/020.yaml
  text: But Amaziah would not listen[a], for it was from God, in order to give them into the hand of their enemies, because they had sought the gods of Edom.
translation:
  language: pt
  text: Mas Amazias não deu ouvidos, pois isso era da parte de Deus, a fim de entregá-los nas mãos de seus inimigos[a], porque haviam buscado os deuses de Edom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “na mão”; expressão hebraica que significa estar sob o poder de outra pessoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: não deu ouvidos
  rationale: No contexto de rejeitar uma advertência, o verbo indica atender ou acatar, não apenas escutar sons. A expressão é natural em português e não acrescenta explicitamente uma intenção além da recusa narrada.
- source_word: מֵהָאֱלֹהִים הִיא
  choice: isso vinha de Deus
  rationale: O pronome feminino retoma de modo amplo a situação ou a recusa anteriormente descrita. “Isso vinha de Deus” preserva a causalidade divina sem especificar além do hebraico.
- source_word: לְמַעַן
  choice: a fim de
  rationale: Expressa com clareza a força de propósito do conector hebraico, sem excluir a nuance contextual de resultado.
- source_word: תִּתָּם
  choice: entregá-los
  rationale: O infinitivo de נתן com sufixo de terceira pessoa do plural significa literalmente “dar/entregar a eles”; diante da expressão seguinte, “entregá-los” comunica naturalmente a ideia de fazê-los cair sob o poder de outros.
- source_word: בְּיָד
  choice: nas mãos de seus inimigos
  rationale: A locução hebraica significa cair sob o poder de alguém. “Seus inimigos” é explicitado a partir do contexto narrativo imediato para tornar a expressão idiomática em português; a forma literal é registrada em nota.
- source_word: דָרְשׁוּ
  choice: haviam buscado
  rationale: Com uma divindade como objeto, דרשׁ pode indicar recorrer a ela em dependência religiosa ou culto. “Haviam buscado” mantém essa amplitude sem restringir o sentido a consulta oracular.
- source_word: אֱלֹהֵי אֱדוֹם
  choice: os deuses de Edom
  rationale: Reproduz diretamente a cadeia construta, identificando as divindades associadas a Edom em linguagem clara e digna.
theological_decisions:
- issue: Causalidade divina na recusa de Amazias e em sua derrota
  choice: A recusa de Amazias é apresentada como proveniente de Deus e orientada para sua entrega à derrota por causa da idolatria.
  alternative: Entender a ação divina apenas como permissão providencial, sem propósito ativo.
  rationale: O hebraico afirma expressamente que “isso vinha de Deus” e emprega לְמַעַן, marcador de propósito. A tradução conserva essa tensão teológica sem suavizar a agência divina nem oferecer uma explicação que o versículo não fornece.
translation_notes:
  register: Português moderno, claro e digno, de leitura natural no Brasil e compreensível internacionalmente. “Não deu ouvidos” preserva o sentido contextual de não acatar; “a fim de” mantém a força propositiva; a nota esclarece o idioma hebraico sem sobrecarregar o texto principal.
