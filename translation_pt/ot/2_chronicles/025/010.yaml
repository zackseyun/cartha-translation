revisions:
- from: Assim, Amazias dispensou os soldados que tinham vindo de Efraim para se juntarem a ele e mandou-os de volta para casa. Eles ficaram muito irados com Judá e voltaram para casa ardendo de ira.
  to: Então Amazias dispensou a tropa que tinha vindo a ele de Efraim, para que voltasse ao seu lugar. Eles ficaram muito irados contra Judá e voltaram ao seu lugar em ardente ira.
  rationale: A revisão remove as explicitações não presentes no texto-fonte, preserva o caráter coletivo-militar de «tropa» e mantém «ao seu lugar» para não limitar a referência a uma casa. «Contra Judá» expressa naturalmente em português o alvo hostil da ira, e «em ardente ira» conserva a intensificação final.
