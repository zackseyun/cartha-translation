base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/010.yaml
  text: So Amaziah separated them[a], the troops that had come to him from Ephraim, to go to their place. And they became very angry with Judah and returned to their place in fierce anger.
translation:
  language: pt
  text: Então Amazias dispensou a tropa que tinha vindo a ele de Efraim, para que voltasse ao seu lugar. Eles ficaram muito irados contra Judá e voltaram ao seu lugar em ardente ira.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּבְדִּילֵם
  choice: dispensou
  rationale: בדל significa basicamente separar, mas aqui descreve Amazias retirando os soldados do serviço e mandando-os embora; “dispensou” expressa com naturalidade essa força contextual.
- source_word: לְהַגְּדוּד
  choice: os soldados
  rationale: גְּדוּד designa uma tropa ou unidade militar. Em português corrente, “os soldados” identifica com clareza os integrantes da força contratada.
- source_word: אֲשֶׁר בָּא אֵלָיו מֵאֶפְרַיִם
  choice: que tinham vindo de Efraim para se juntarem a ele
  rationale: A expressão identifica os soldados e indica que vieram para junto de Amazias; a formulação portuguesa explicita naturalmente a finalidade contextual sem alterar o referente.
- source_word: לָלֶכֶת לִמְקוֹמָם
  choice: mandou-os de volta para casa
  rationale: Literalmente, “para irem ao lugar deles”. No contexto de uma tropa dispensada, “de volta para casa” comunica o sentido idiomático, e “mandou-os” torna clara a relação com o ato de dispensar.
- source_word: וַיִּחַר אַפָּם מְאֹד בִּיהוּדָה
  choice: ficaram muito irados com Judá
  rationale: O idioma hebraico descreve a ira como algo que arde. “Ficaram muito irados com Judá” transmite de modo natural tanto a intensidade como o alvo da ira.
- source_word: וַיָּשׁוּבוּ לִמְקוֹמָם
  choice: voltaram para casa
  rationale: שׁוב significa voltar, e מְקוֹמָם, literalmente “o lugar deles”, refere-se aqui ao lugar de origem dos soldados.
- source_word: בָּחֳרִי אָף
  choice: ardendo de ira
  rationale: A expressão denota o calor ou ardor da ira. “Ardendo de ira” preserva a imagem hebraica e a forte intensidade emocional em português natural.
theological_decisions: []
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução prioriza equivalência ótima: conserva a imagem final da ira ardente, mas verte idiomaticamente “o lugar deles” como “casa” e o ato de separar a tropa como dispensa militar.'
