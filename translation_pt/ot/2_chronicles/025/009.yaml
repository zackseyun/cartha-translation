source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲמַצְיָ֨הוּ֙ לְ/אִ֣ישׁ הָ/אֱלֹהִ֔ים וּ/מַֽה לַּ/עֲשׂוֹת֙ לִ/מְאַ֣ת הַ/כִּכָּ֔ר אֲשֶׁ֥ר נָתַ֖תִּי לִ/גְד֣וּד יִשְׂרָאֵ֑ל וַ/יֹּ֨אמֶר֙ אִ֣ישׁ הָֽ/אֱלֹהִ֔ים יֵ֚שׁ לַֽ/יהוָ֔ה לָ֥/תֶת לְ/ךָ֖ הַרְבֵּ֥ה מִ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/009.yaml
  text: Amaziah said to the man of God[a], “But what should be done about the hundred talents that I have given to the troops of Israel?” The man of God said[b], “Yahweh is able to give you much more than this.”
translation:
  language: pt
  text: 'Amazias disse ao homem de Deus: “Mas o que fazer com os cem talentos[a] que dei às tropas de Israel?” O homem de Deus respondeu: “Yahweh pode dar a você muito mais do que isso.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os cem talentos”. O versículo anterior informa que eram talentos de prata.'
    reason: cross_reference
  - marker: b
    text: 'Ou: “Yahweh tem recursos para dar a você muito mais do que isso”. A expressão hebraica enfatiza a capacidade de Yahweh de prover.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: homem de Deus
  rationale: Preserva o título hebraico tradicional para um mensageiro comissionado por Deus, sem especificar além do texto que ele era profeta.
- source_word: וּמַה לַּעֲשׂוֹת
  choice: Mas o que fazer com
  rationale: A formulação idiomática expressa a objeção de Amazias e mantém a construção infinitiva do hebraico sem introduzir um sujeito explícito.
- source_word: מְאַת הַכִּכָּר
  choice: os cem talentos
  rationale: כִּכָּר designa aqui uma unidade de peso. O metal, prata, é especificado no versículo anterior, mas não é repetido neste.
- source_word: גְדוּד יִשְׂרָאֵל
  choice: tropas de Israel
  rationale: גְדוּד pode indicar um bando ou contingente militar; no contexto dos soldados contratados, “tropas” é claro e natural.
- source_word: יֵשׁ לַיהוָה לָתֶת לְךָ
  choice: Yahweh pode dar a você
  rationale: A construção existencial hebraica enfatiza que Yahweh dispõe de capacidade ou recursos para dar; a tradução comunica isso em português corrente.
- source_word: הַרְבֵּה מִזֶּה
  choice: muito mais do que isso
  rationale: Reproduz com clareza a comparação de abundância expressa por הַרְבֵּה com מִן.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal e reflete sua transliteração acadêmica amplamente aceita.
- issue: Capacidade de provisão divina na expressão יֵשׁ לַיהוָה
  choice: Yahweh pode dar a você
  alternative: Yahweh tem recursos para dar a você
  rationale: A redação principal comunica capacidade sem transformar a afirmação em uma formulação abstrata sobre onipotência; a nota conserva a imagem mais concreta de recursos disponíveis.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pergunta elíptica “o que fazer” preserva a ausência de sujeito explícito no hebraico. “Talentos” mantém a unidade antiga, esclarecida pela nota, e “tropas” comunica naturalmente o contexto militar.
