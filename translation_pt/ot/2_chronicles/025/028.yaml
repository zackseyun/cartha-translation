base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/028.yaml
  text: They carried him on horses and buried him with his fathers in the city of Judah[a].
translation:
  language: pt
  text: Levaram-no sobre os cavalos[a] e o sepultaram com seus pais, na cidade de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A formulação reproduz literalmente o hebraico, que menciona explicitamente «os cavalos» no plural.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂאֻהוּ
  choice: Levaram-no
  rationale: O verbo נשׂא, no contexto do transporte do corpo, é expresso naturalmente por “levaram”; o pronome enclítico preserva o objeto masculino singular.
- source_word: עַל הַסּוּסִים
  choice: sobre os cavalos
  rationale: Preserva de modo formal a preposição עַל e o plural definido “os cavalos”, sem introduzir uma liteira, carro ou outro meio não mencionado no hebraico.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: e o sepultaram
  rationale: Tradução direta de קבר com o objeto pronominal; “sepultaram” mantém registro digno e corrente.
- source_word: עִם אֲבֹתָיו
  choice: com seus pais
  rationale: Conserva a fórmula funerária hebraica e seu sentido familiar e dinástico, sem substituí-la pela interpretação mais ampla “antepassados”.
- source_word: בְּעִיר יְהוּדָה
  choice: na cidade de Judá
  rationale: Segue diretamente o Texto Massorético fornecido, sem harmonizar a expressão com “cidade de Davi” ou generalizá-la para “em Judá”.
theological_decisions:
- issue: Fórmula funerária e identificação do local
  choice: Manter “com seus pais, na cidade de Judá” conforme o Texto Massorético.
  alternative: Interpretar ou emendar para “com seus antepassados, na cidade de Davi”, ou generalizar para “em Judá”.
  rationale: A redação da fonte deve ser preservada mesmo sendo menos esperada; harmonizá-la com fórmulas paralelas eliminaria uma diferença textual genuína.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A construção “sobre os cavalos” é mantida para refletir o hebraico; “com seus pais” conserva a fórmula tradicional sem explicá-la no corpo do versículo.
