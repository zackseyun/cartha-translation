  text: וַ/אֲמַצְיָ֨הוּ֙ הִתְחַזַּ֔ק וַ/יִּנְהַג֙ אֶת עַמּ֔/וֹ וַ/יֵּ֖לֶךְ גֵּ֣יא הַמֶּ֑לַח וַ/יַּ֥ךְ אֶת בְּנֵי שֵׂעִ֖יר עֲשֶׂ֥רֶת אֲלָפִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/011.yaml
  text: Then Amaziah strengthened himself[a], led his people, and went to the Valley of Salt, where he struck down ten thousand of the sons of Seir.
translation:
  language: pt
  text: Então Amazias se fortaleceu, conduziu o seu povo e foi ao Vale do Sal, onde abateu dez mil dos filhos de Seir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do povo de Seir” ou “dos descendentes de Seir”. O hebraico diz literalmente “dos filhos de Seir”, uma expressão étnico-genealógica.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְחַזַּק
  choice: se fortaleceu
  rationale: Preserva o valor reflexivo ou incoativo do hitpael de חזק sem restringi-lo à ideia mais interpretativa de apenas criar coragem.
- source_word: וַיִּנְהַג אֶת־עַמּוֹ
  choice: conduziu o seu povo
  rationale: נהג pode significar conduzir, guiar ou impelir. No contexto militar, “conduziu” é natural e não acrescenta detalhes táticos ausentes do hebraico.
- source_word: גֵּיא הַמֶּלַח
  choice: Vale do Sal
  rationale: Tradução direta e tradicional do topônimo hebraico, com maiúsculas para indicar um lugar reconhecido.
- source_word: וַיַּךְ
  choice: abateu
  rationale: נכה tem alcance semântico amplo, incluindo ferir, derrotar e matar. “Abateu” comunica adequadamente o resultado letal sugerido pela contagem e pelo contraste com os capturados no versículo seguinte, sem perder o tom militar.
- source_word: בְּנֵי שֵׂעִיר
  choice: filhos de Seir
  rationale: Mantém a expressão étnico-genealógica literal do hebraico; a nota esclarece seu sentido coletivo possível.
- source_word: עֲשֶׂרֶת אֲלָפִים
  choice: dez mil
  rationale: Equivalente direto e idiomático da expressão numeral hebraica.
- source_word: וַאֲמַצְיָהוּ
  choice: Então Amazias
  rationale: O waw dá continuidade à narrativa; “Então” expressa naturalmente a sequência em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa fluente. A formulação preserva o reflexivo de הִתְחַזַּק e a expressão genealógica בְּנֵי שֵׂעִיר; a nota foi colocada junto à expressão que esclarece.
