  text: וְ/אִ֣ישׁ הָ/אֱלֹהִ֗ים בָּ֤א אֵלָי/ו֙ לֵ/אמֹ֔ר הַ/מֶּ֕לֶךְ אַל יָבֹ֥א עִמְּ/ךָ֖ צְבָ֣א יִשְׂרָאֵ֑ל כִּ֣י אֵ֤ין יְהוָה֙ עִם יִשְׂרָאֵ֔ל כֹּ֖ל בְּנֵ֥י אֶפְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/007.yaml
  text: But a man of God came to him[a], saying, “O king, do not let the army of Israel go with you, for Yahweh is not with Israel, with all the sons of Ephraim.”
translation:
  language: pt
  text: 'Mas um homem de Deus veio até ele e disse: “Ó rei, não deixe que o exército de Israel vá com você, pois Yahweh não está com Israel, nem com todos os filhos de Efraim[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com todos os efraimitas”. O hebraico diz literalmente “com todos os filhos de Efraim”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: um homem de Deus
  rationale: A expressão funciona como título de um mensageiro comissionado por Deus; o artigo indefinido corresponde à introdução dessa personagem no relato.
- source_word: בָּא אֵלָיו
  choice: veio até ele
  rationale: בוא com אֶל indica normalmente movimento em direção a uma pessoa; “veio até ele” é natural e preciso em português.
- source_word: לֵאמֹר
  choice: e disse
  rationale: A fórmula hebraica de introdução da fala é vertida de modo idiomático em português, sem alterar seu sentido.
- source_word: הַמֶּלֶךְ
  choice: Ó rei
  rationale: O substantivo com artigo tem função vocativa no discurso direto; “Ó rei” preserva o tom solene.
- source_word: אַל יָבֹא עִמְּךָ
  choice: não deixe que ... vá com você
  rationale: A construção com אַל expressa proibição. Embora בוא seja literalmente “vir”, o contexto de acompanhar o rei numa campanha militar pede naturalmente “ir com você”.
- source_word: צְבָא יִשְׂרָאֵל
  choice: o exército de Israel
  rationale: צָבָא designa aqui a força militar israelita.
- source_word: כִּי אֵין יְהוָה עִם יִשְׂרָאֵל
  choice: pois Yahweh não está com Israel
  rationale: כִּי introduz a razão da proibição, e a expressão “estar com” conserva a linguagem bíblica de presença e apoio divinos.
- source_word: כֹּל בְּנֵי אֶפְרָיִם
  choice: com todos os filhos de Efraim
  rationale: A formulação mantém o segundo “com” do hebraico e preserva a expressão familiar literal “filhos de Efraim”; o travessão sinaliza sua relação explicativa com “Israel” sem eliminar a tensão sintática do original.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” representa o nome pactual sem substituí-lo por um título.
- issue: Sentido de יהוה não estar “com” Israel
  choice: preservar a afirmação sem explicá-la
  alternative: explicitar como ausência de aprovação, ajuda ou presença divina
  rationale: A expressão pode envolver presença, favor e auxílio divinos. A tradução mantém sua amplitude teológica em vez de selecionar apenas uma dessas nuances.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A fala mantém solenidade moderada em “Ó rei”. O travessão ajuda a apresentar “todos os filhos de Efraim” como esclarecimento de “Israel”, ao mesmo tempo que conserva a repetição da preposição presente no hebraico.
