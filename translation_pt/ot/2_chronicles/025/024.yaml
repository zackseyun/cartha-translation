base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/024.yaml
  text: And he took all the gold and the silver[a], and all the vessels found in the house of God with Obed-edom, and the treasures of the king’s house, and hostages[b], and returned to Samaria.
translation:
  language: pt
  text: Levou todo o ouro e toda a prata, todos os utensílios encontrados na Casa de Deus que estavam com Obede-Edom[a], os tesouros do palácio real e os reféns[b]; depois voltou para Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sob os cuidados de Obede-Edom”; literalmente, “com Obede-Edom”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “filhos das garantias”, provavelmente pessoas mantidas como garantia, isto é, reféns.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַזָּהָב וְהַכֶּסֶף
  choice: todo o ouro e toda a prata
  rationale: Preserva a abrangência de כָּל e menciona separadamente os dois metais, em português natural.
- source_word: כָּל הַכֵּלִים
  choice: todos os utensílios
  rationale: כֵּלִים é um termo amplo para objetos e implementos; “utensílios” é claro no contexto do templo sem restringir indevidamente o sentido.
- source_word: הַנִּמְצְאִים
  choice: encontrados
  rationale: Reproduz de modo conciso o particípio hebraico, que pode indicar aquilo que foi encontrado ou que se achava no local.
- source_word: בֵּית הָאֱלֹהִים
  choice: Casa de Deus
  rationale: Mantém a expressão hebraica de maneira formalmente próxima e compreensível; a inicial maiúscula sinaliza o santuário.
- source_word: עִם עֹבֵד אֱדוֹם
  choice: que estavam com Obede-Edom
  rationale: Conserva o sentido básico de עִם, “com”, sem eliminar a provável ideia contextual de custódia, registrada em nota.
- source_word: אֹצְרוֹת בֵּית הַמֶּלֶךְ
  choice: os tesouros do palácio real
  rationale: No contexto de bens saqueados, אֹצְרוֹת indica melhor os tesouros do que os depósitos; “palácio real” comunica naturalmente o referente de “casa do rei”.
- source_word: בְּנֵי הַתַּעֲרֻבוֹת
  choice: os reféns
  rationale: A expressão difícil, literalmente relacionada a pessoas dadas como garantia, provavelmente designa reféns; a forma literal é preservada em nota.
- source_word: וַיָּשָׁב שֹׁמְרוֹן
  choice: depois voltou para Samaria
  rationale: Expressa o avanço narrativo do wayyiqtol e identifica Samaria como destino; o sujeito permanece implícito como no fluxo natural do português.
