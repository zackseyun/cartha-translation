base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/001.yaml
  text: Amaziah was twenty-five years old when he became king[a], and he reigned twenty-nine years in Jerusalem. His mother’s name was Jehoaddan[b], from Jerusalem.
translation:
  language: pt
  text: Amazias tinha vinte e cinco anos quando se tornou rei[a] e reinou vinte e nove anos em Jerusalém. Sua mãe se chamava Jeoadã e era de Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, «era filho de vinte e cinco anos»; ou «começou a reinar».
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: tinha vinte e cinco anos
  rationale: É a forma natural em português de expressar o idioma hebraico de idade, literalmente «filho de vinte e cinco anos».
- source_word: מָלַךְ
  choice: se tornou rei
  rationale: Na primeira ocorrência, dentro da fórmula de idade, o verbo indica a ascensão de Amazias ao trono.
- source_word: וְעֶשְׂרִים וָתֵשַׁע שָׁנָה מָלַךְ
  choice: reinou vinte e nove anos
  rationale: A segunda ocorrência do verbo descreve a duração do reinado; «reinou» é direto e idiomático.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: Reproduz diretamente o sentido locativo da preposição hebraica.
- source_word: וְשֵׁם אִמּוֹ
  choice: Sua mãe se chamava
  rationale: Expressão natural no português moderno, equivalente à construção hebraica «e o nome de sua mãe era».
- source_word: יְהוֹעַדָּן
  choice: Jeoadã
  rationale: Transliteração portuguesa corrente do nome pessoal hebraico.
- source_word: מִירוּשָׁלָיִם
  choice: era de Jerusalém
  rationale: A preposição מִן indica origem ou procedência; em português, a formulação explicita naturalmente que a informação se refere à mãe.
