base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/016.yaml
  text: And it happened[a], as he was speaking to him, that the king said to him, “Have we made you the king’s adviser? Stop! Why should they strike you down?” So the prophet stopped and said, “I know that God has determined to destroy you[c][b], because you have done this and have not listened to my counsel.”
translation:
  language: pt
  text: 'Enquanto ele falava com o rei, este lhe disse: “Acaso nomeamos você conselheiro do rei?[a] Pare! Por que haveriam de ferir você?[b]” Então o profeta parou e disse: “Sei que Deus decidiu destruir você,[c] porque você fez isso e não deu ouvidos ao meu conselho.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Acaso fizemos de você conselheiro do rei?”'
    reason: Alternativa lexical para נתן, que pode ser vertido como “nomear” ou “fazer de alguém” algo.
  - marker: b
    text: 'Hebraico: “Por que eles feririam você?” O sujeito está no plural, mas não é especificado; provavelmente se refere aos que executariam a ordem do rei.'
    reason: A nota preserva o sujeito plural indefinido e explica a forma idiomática adotada no texto.
  - marker: c
    text: 'Ou: “Deus planejou destruir você”. O verbo hebraico está ligado à ideia de aconselhar, deliberar ou planejar.'
    reason: Alternativa lexical que torna visível o campo semântico de יעץ sem enfraquecer a determinação do juízo.
lexical_decisions:
- source_word: בְּדַבְּרוֹ אֵלָיו
  choice: Enquanto ele falava com o rei
  rationale: A construção temporal significa literalmente “enquanto ele falava com ele”. O contexto identifica o destinatário como o rei; explicitar isso em português evita uma sequência obscura de pronomes sem alterar o referente.
- source_word: הַלְיוֹעֵץ לַמֶּלֶךְ נְתַנּוּךָ
  choice: Acaso nomeamos você conselheiro do rei?
  rationale: O ה interrogativo introduz uma pergunta retórica. נתן, neste contexto, tem o sentido de colocar ou nomear alguém para uma função. “Conselheiro do rei” conserva a relação expressa por לַמֶּלֶךְ.
- source_word: חֲדַל
  choice: Pare!
  rationale: Imperativo curto e enérgico que manda o profeta cessar sua fala.
- source_word: לָמָּה יַכּוּךָ
  choice: Por que haveriam de ferir você?
  rationale: O verbo tem sujeito plural não especificado. A formulação mantém essa indeterminação e comunica a ameaça de violência sem afirmar além do texto que o golpe seria fatal.
- source_word: יָעַץ אֱלֹהִים
  choice: Deus decidiu
  rationale: יעץ pertence ao campo semântico de aconselhar, planejar e determinar. Com Deus como sujeito e a destruição como complemento, “decidiu” expressa uma intenção estabelecida em português natural.
- source_word: לְהַשְׁחִיתֶךָ
  choice: destruir você
  rationale: O infinitivo causativo de שחת denota levar à ruína ou destruição; “destruir” é a equivalência direta e clara.
- source_word: וְלֹא שָׁמַעְתָּ לַעֲצָתִי
  choice: e não deu ouvidos ao meu conselho
  rationale: A expressão שמע ל envolve ouvir com disposição de atender. “Dar ouvidos” preserva tanto a imagem auditiva quanto a ideia de acatar.
theological_decisions:
- issue: A intenção divina em יָעַץ אֱלֹהִים לְהַשְׁחִיתֶךָ
  choice: Deus decidiu destruir você
  alternative: Deus planejou destruir você; Deus resolveu levar você à ruína
  rationale: O hebraico apresenta a destruição como intenção divina estabelecida em resposta ao ato do rei e à recusa do conselho profético. A tradução mantém essa afirmação e sua tensão teológica, sem suavizá-la nem acrescentar uma explicação doutrinária.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Você” é usado nas falas por naturalidade e clareza; “dar ouvidos” mantém um tom bíblico corrente sem soar arcaico. A abertura explicita o rei como referente contextual dos pronomes hebraicos.
