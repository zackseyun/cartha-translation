  text: וַ/יִּוָּעַ֗ץ אֲמַצְיָ֨הוּ֙ מֶ֣לֶךְ יְהוּדָ֔ה וַ֠/יִּשְׁלַח אֶל יוֹאָ֨שׁ בֶּן יְהוֹאָחָ֧ז בֶּן יֵה֛וּא מֶ֥לֶךְ יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר לך נִתְרָאֶ֥ה פָנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/017.yaml
  text: Then Amaziah king of Judah took counsel and sent to Joash son of Jehoahaz[a], son of Jehu, king of Israel, saying, “Come, let us face one another.”
translation:
  language: pt
  text: 'Então Amazias, rei de Judá, depois de se aconselhar, mandou dizer a Joás, filho de Jeoacaz, filho de Jeú, rei de Israel: “Venha, vamos nos enfrentar face a face.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vamos nos encontrar frente a frente”. A expressão hebraica fala literalmente de ver o rosto um do outro e, neste contexto, provavelmente indica um confronto direto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: depois de se aconselhar
  rationale: O nifal de יעץ indica que Amazias deliberou ou buscou conselho antes de agir. A formulação é natural em português e preserva a sequência narrativa sem especificar conselheiros que o hebraico não identifica.
- source_word: וַיִּשְׁלַח אֶל ... לֵאמֹר
  choice: mandou dizer a
  rationale: A expressão comunica de modo natural o envio de uma comunicação a Joás. Evita acrescentar explicitamente mensageiros, embora eles estejam implícitos na situação.
- source_word: יוֹאָשׁ בֶּן־יְהוֹאָחָז בֶּן־יֵהוּא מֶלֶךְ יִשְׂרָאֵל
  choice: Joás, filho de Jeoacaz, filho de Jeú, rei de Israel
  rationale: Mantém integralmente a genealogia e o título político presentes no texto hebraico, usando as formas portuguesas tradicionais e amplamente reconhecidas dos nomes.
- source_word: לְךָ
  choice: Venha
  rationale: Neste desafio dirigido a outro rei, o imperativo funciona como convite provocador à aproximação e ao confronto; “Venha” é conciso e idiomático.
- source_word: נִתְרָאֶה פָנִים
  choice: vamos nos enfrentar face a face
  rationale: A expressão hebraica fala literalmente de ver o rosto um do outro, mas, no contexto político-militar, implica confronto direto. A tradução preserva a imagem do rosto e torna clara a força contextual.
