base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/027.yaml
  text: From the time that Amaziah turned away from following Yahweh[a], they conspired against him in Jerusalem, and he fled to Lachish; but they sent after him to Lachish and put him to death there.
translation:
  language: pt
  text: Desde o tempo em que Amazias deixou de seguir Yahweh[a], conspiraram contra ele em Jerusalém. Ele fugiu para Laquis, mas enviaram pessoas atrás dele para Laquis e o mataram ali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em hebraico, literalmente: “desviou-se de seguir atrás de Yahweh”; a expressão significa que ele deixou de seguir Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵת אֲשֶׁר
  choice: Desde o tempo em que
  rationale: Expressa naturalmente em português o marco temporal a partir do qual se desenvolveu a conspiração, sem acrescentar um marcador discursivo ausente do hebraico.
- source_word: סָר מֵאַחֲרֵי יְהוָה
  choice: deixou de seguir Yahweh
  rationale: Comunica a ideia idiomática de abandonar a fidelidade e cessar de seguir Yahweh, em vez de sugerir mero afastamento físico.
- source_word: וַיִּקְשְׁרוּ עָלָיו קֶשֶׁר
  choice: conspiraram contra ele
  rationale: Reproduz em português corrente a construção intensiva formada pelo verbo e pelo substantivo hebraicos da mesma raiz.
- source_word: וַיָּנָס לָכִישָׁה
  choice: Ele fugiu para Laquis
  rationale: Traduz tanto a fuga diante do perigo quanto o sentido direcional da forma do nome da cidade.
- source_word: וַיִּשְׁלְחוּ אַחֲרָיו לָכִישָׁה
  choice: mas mandaram persegui-lo até lá
  rationale: A expressão hebraica diz literalmente que enviaram atrás dele; em português, esta formulação transmite com clareza que agentes foram enviados em sua perseguição até Laquis.
- source_word: וַיְמִיתֻהוּ שָׁם
  choice: e o mataram ali
  rationale: Expressa de modo direto a forma causativa do verbo morrer e mantém a referência locativa a Laquis.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega diretamente o Tetragrama; a transliteração preserva o nome divino pessoal sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe foi dividida em duas frases para favorecer a leitura sem alterar a sequência narrativa. “Mandaram persegui-lo” explicita apenas o sentido naturalmente implícito em “enviaram atrás dele”.
