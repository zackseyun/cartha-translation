  source_fidelity: A tradução transmite adequadamente a unidade militar dispensada por Amazias, a incursão contra cidades de Judá, a extensão geográfica, o número de vítimas e o saque. Contudo, «não permitindo que fossem» explicita uma relação de finalidade que não está formulada no hebraico, e «dos seus habitantes» resolve indevidamente o referente de «deles» (מֵהֶם), que o texto deixa menos específico.
  naturalness: O português é claro e de registro bíblico moderno. «Mandara voltar, em vez de irem com ele à batalha» é mais conciso e mais próximo da construção hebraica do que «mandado de volta, não permitindo que fossem». «Fizeram incursões contra» exprime com maior precisão o caráter de ataque/saque de פשט.
  terminology: «Homens da tropa», «Judá», «Samaria», «Bete-Horom», «abateram» e «despojos» são escolhas adequadas. A revisão preserva «Bete-Horom» e evita acrescentar «habitantes», que não ocorre no original.
