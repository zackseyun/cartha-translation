revisions:
- from: Mas os homens da tropa que Amazias havia mandado de volta, não permitindo que fossem com ele à batalha, atacaram as cidades de Judá, desde Samaria até Bete-Horom[a]. Abateram três mil dos seus habitantes[b] e levaram muitos despojos.
  to: Mas os homens da tropa que Amazias mandara voltar, em vez de irem com ele à batalha, fizeram incursões contra as cidades de Judá, desde Samaria até Bete-Horom[a]. Abateram três mil deles[b] e levaram muitos despojos.
  rationale: A revisão aproxima a sintaxe da relação expressa no hebraico, torna mais específico o sentido militar de «fizeram incursões» e preserva a ambiguidade do pronome «deles», sem alterar o conteúdo narrativo nem o registro da tradução.
