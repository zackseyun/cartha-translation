base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/013.yaml
  text: But the men of the troop whom Amaziah had sent back from going with him to battle raided the cities of Judah[a], from Samaria to Beth-horon[b], and struck down three thousand of them and took much plunder.
translation:
  language: pt
  text: Mas os homens da tropa que Amazias mandara voltar, em vez de irem com ele à batalha, fizeram incursões contra as cidades de Judá, desde Samaria até Bete-Horom[a]. Abateram três mil deles[b] e levaram muitos despojos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão hebraica indica a extensão geográfica da incursão: de Samaria até Bete-Horom.'
    reason: geographical_clarification
  - marker: b
    text: Ou “mataram três mil deles”. O verbo hebraico pode significar “golpear” ou “abater” e, neste contexto, provavelmente se refere à morte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי הַגְּדוּד
  choice: os homens da tropa
  rationale: A expressão idiomática, literalmente “filhos da tropa”, designa os integrantes da unidade militar. “Homens da tropa” comunica isso com naturalidade.
- source_word: אֲשֶׁר הֵשִׁיב אֲמַצְיָהוּ
  choice: que Amazias havia mandado de volta
  rationale: O hifil de שוב significa fazer voltar. O mais-que-perfeito deixa clara a anterioridade dessa decisão em relação ao ataque.
- source_word: מִלֶּכֶת עִמּוֹ לַמִּלְחָמָה
  choice: não permitindo que fossem com ele à batalha
  rationale: A construção indica que Amazias os fez voltar e, assim, os impediu de acompanhá-lo na campanha. A formulação explicita naturalmente essa relação sem alterar o sentido.
- source_word: וַיִּפְשְׁטוּ
  choice: atacaram
  rationale: No contexto militar, פשט descreve uma incursão ou ataque de saque. “Atacaram” é claro e corrente; o saque resultante é declarado no fim do versículo.
- source_word: בְּעָרֵי יְהוּדָה
  choice: as cidades de Judá
  rationale: Tradução direta e tradicional de עָרֵי יְהוּדָה, compreensível no português moderno.
- source_word: מִשֹּׁמְרוֹן וְעַד בֵּית חוֹרוֹן
  choice: desde Samaria até Bete-Horom
  rationale: A construção מן...ועד marca a extensão geográfica. Os topônimos seguem formas portuguesas bíblicas reconhecíveis.
- source_word: וַיַּכּוּ מֵהֶם
  choice: Abateram três mil dos seus habitantes
  rationale: נכה tem sentido amplo de golpear ou abater e, neste contexto bélico, implica morte. “Seus habitantes” esclarece o referente contextual de “deles” sem identificar um grupo além do texto.
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: três mil
  rationale: Correspondência numérica direta.
- source_word: וַיָּבֹזּוּ בִּזָּה רַבָּה
  choice: levaram muitos despojos
  rationale: A construção cognata hebraica enfatiza a grande quantidade do saque. Esta formulação preserva a ênfase de modo natural e digno.
