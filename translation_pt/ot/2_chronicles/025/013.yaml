    issue: «dos seus habitantes» acrescenta um referente que o texto hebraico não especifica.
    rationale: O pronome em מֵהֶם significa literalmente «deles/de entre eles». No contexto pode referir-se às pessoas atingidas nas cidades, mas «habitantes» é uma explicitação interpretativa desnecessária.
  - severity: low
