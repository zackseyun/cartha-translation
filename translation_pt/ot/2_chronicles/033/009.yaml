  text: וַ/יֶּ֣תַע מְנַשֶּׁ֔ה אֶת יְהוּדָ֖ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם לַ/עֲשׂ֣וֹת רָ֔ע מִן הַ֨/גּוֹיִ֔ם אֲשֶׁר֙ הִשְׁמִ֣יד יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/009.yaml
  text: So Manasseh led Judah and the inhabitants of Jerusalem astray[a], to do more evil than the nations whom Yahweh had destroyed before the sons of Israel.
translation:
  language: pt
  text: Assim, Manassés desencaminhou Judá e os habitantes de Jerusalém, levando-os a praticar o mal mais do que as nações que Yahweh havia destruído diante dos filhos de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “os israelitas” ou “o povo de Israel”. Em hebraico: “os filhos de Israel”.'
    reason: Alternativa lexical para a expressão coletiva בְּנֵי יִשְׂרָאֵל.
lexical_decisions:
- source_word: וַיֶּתַע
  choice: desencaminhou
  rationale: O hifil de תעה expressa a ideia causativa de fazer alguém se desviar. “Desencaminhou” é natural em português e conserva o sentido moral do contexto.
- source_word: יְהוּדָה וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: Judá e os habitantes de Jerusalém
  rationale: 'Mantém explícitos os dois objetos coletivos: Judá e, especificamente, os habitantes de Jerusalém.'
- source_word: לַעֲשׂוֹת רָע
  choice: levando-os a fazer mais mal
  rationale: A construção explicita de modo natural em português a relação entre o desencaminhamento e a prática do mal, sem eliminar a possível nuance de propósito ou resultado do infinitivo hebraico.
- source_word: מִן הַגּוֹיִם
  choice: mais mal do que as nações
  rationale: מִן tem valor comparativo neste contexto; a formulação preserva a comparação direta com a maldade das nações.
- source_word: הַגּוֹיִם
  choice: as nações
  rationale: O termo se refere aos povos anteriormente presentes na terra; “nações” evita a conotação posterior que “gentios” poderia introduzir.
- source_word: אֲשֶׁר הִשְׁמִיד יְהוָה
  choice: que Yahweh havia destruído
  rationale: “Destruído” comunica adequadamente a força de השמיד, e o mais-que-perfeito situa a ação antes do desvio promovido por Manassés.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, preservando-o como nome pessoal em vez de substituí-lo por um título.
- source_word: מִפְּנֵי
  choice: diante de
  rationale: Reproduz com naturalidade o idioma espacial hebraico no contexto da conquista.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a forma concreta do hebraico, enquanto a nota oferece equivalentes coletivos mais idiomáticos.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome da aliança como nome próprio e não impõe a substituição tradicional por um título.
- issue: Expressão coletiva masculina בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; o povo de Israel
  rationale: A redação principal mantém a forma masculina plural representativa do hebraico; a nota esclarece seu sentido coletivo sem restringi-lo apenas a homens.
- issue: Nuance de לַעֲשׂוֹת após o verbo causativo
  choice: levando-os a fazer
  alternative: para fazerem
  rationale: “Levando-os a” preserva a ligação causativa e deixa aberta a nuance contextual entre propósito e resultado, evitando resolvê-la de maneira rígida.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Desencaminhou” conserva a força moral e causativa do verbo; “habitantes” mantém um registro histórico natural. O marcador da nota foi colocado junto à expressão a que se refere.
