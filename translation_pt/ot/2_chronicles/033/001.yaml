  text: Manasseh was twelve years old when he began to reign, and he reigned fifty-five years in Jerusalem.
translation:
  language: pt
  text: Manassés tinha doze anos quando começou a reinar e reinou cinquenta e cinco anos em Jerusalém.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: tinha doze anos
  rationale: É a fórmula hebraica convencional para indicar idade. A tradução formal «era filho de doze anos» não é natural em português; «tinha doze anos» comunica o sentido com precisão.
- source_word: מְנַשֶּׁה
  choice: Manassés
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome bíblico em português.
- source_word: בְמָלְכוֹ
  choice: quando começou a reinar
  rationale: Nesta fórmula régia, a construção indica a idade no momento da ascensão ao trono. A expressão escolhida é natural em português e preserva essa referência temporal.
- source_word: וַחֲמִשִּׁים וְחָמֵשׁ שָׁנָה
  choice: cinquenta e cinco anos
  rationale: Reproduz o número composto na forma corrente do português moderno.
- source_word: מָלַךְ
  choice: reinou
  rationale: Neste contexto, o verbo מלך designa o exercício do reinado; «reinou» é o equivalente português direto e conciso.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: A preposição ב indica localização, expressa naturalmente por «em».
