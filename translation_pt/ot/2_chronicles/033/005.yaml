  text: וַ/יִּ֥בֶן מִזְבְּח֖וֹת לְ/כָל צְבָ֣א הַ/שָּׁמָ֑יִם בִּ/שְׁתֵּ֖י חַצְר֥וֹת בֵּית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/005.yaml
  text: He built altars for all the host of heaven in the two courts of the house of Yahweh[a].
translation:
  language: pt
  text: Ele construiu altares para todo o exército dos céus[a] nos dois pátios da casa de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todo o exército celestial”. A expressão hebraica se refere ao conjunto dos astros ou seres celestes cultuados na religião astral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Ele construiu
  rationale: O wayyiqtol qal de בנה narra uma ação passada de Manassés. O pretérito perfeito é natural em português, e o waw narrativo não precisa ser reproduzido mecanicamente por “e”.
- source_word: מִזְבְּחוֹת
  choice: altares
  rationale: Plural de מזבח, termo comum para altares de sacrifício ou incenso; “altares” é o equivalente direto.
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  choice: para todo o exército dos céus
  rationale: A expressão designa o conjunto dos astros ou poderes celestes venerados no culto astral. “Exército dos céus” preserva o idioma bíblico, enquanto “para” expressa naturalmente a ideia de altares erguidos em honra deles.
- source_word: בִּשְׁתֵּי חַצְרוֹת
  choice: nos dois pátios
  rationale: O numeral especifica dois espaços. No contexto arquitetônico do templo, חצרות designa áreas abertas e delimitadas; “pátios” é claro e corrente em português.
- source_word: בֵּית יְהוָה
  choice: da casa de Yahweh
  rationale: Reproduz literalmente a expressão “casa de YHWH” sem substituí-la interpretativamente por “templo”, embora esse seja o referente.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” representa o nome da aliança sem substituí-lo por um título como “SENHOR”.
- issue: Identidade de צְבָא הַשָּׁמַיִם
  choice: exército dos céus
  alternative: exército celestial
  rationale: A formulação preserva a expressão hebraica e sua ambiguidade lexical entre corpos celestes e poderes celestes, enquanto o contexto deixa claro que são objetos de culto astral.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa natural. “Casa de Yahweh” mantém a imagem hebraica, e “pátios” favorece a compreensão comum sem perder o contexto arquitetônico.
