base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/019.yaml
  text: And his prayer[a], and how he was entreated, and all his sin and his unfaithfulness, and the places where he built high places and set up the Asherim and the carved images before he humbled himself—behold[b], they are written in the records of the seers.
translation:
  language: pt
  text: E a sua oração, como sua oração foi atendida, todo o seu pecado e a sua infidelidade, bem como os lugares onde construiu lugares altos e ergueu os aserins[a] e as imagens esculpidas antes de se humilhar — eis que tudo isso está escrito nos registros dos videntes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os postes de Aserá”. O termo hebraico pode designar objetos de culto associados à deusa Aserá.
    reason: lexical_alternative
  - marker: b
    text: Ou “nos relatos de Hozai”. A expressão hebraica final pode conservar um nome próprio, em vez de significar “os videntes”.
    reason: alternative_reading
lexical_decisions:
- source_word: תְפִלָּתוֹ
  choice: a sua oração
  rationale: Traduz diretamente o termo comum para oração, mantendo seu sentido amplo sem restringi-lo a uma súplica específica.
- source_word: הֵעָתֶר לוֹ
  choice: como ele foi atendido
  rationale: Expressa a resposta favorável à oração em forma passiva, sem inserir explicitamente um sujeito que não aparece nesta oração hebraica.
- source_word: כָל חַטָּאתוֹ
  choice: todo o seu pecado
  rationale: Preserva o singular coletivo do hebraico e comunica a totalidade de sua conduta pecaminosa.
- source_word: מַעְלוֹ
  choice: a sua infidelidade
  rationale: Comunica a ideia de quebra de fidelidade, inclusive sua força moral e religiosa, em português atual.
- source_word: בָּמוֹת
  choice: lugares altos
  rationale: Mantém a designação bíblica tradicional para santuários cultuais locais, sem reduzi-los necessariamente a altares ou montes.
- source_word: הֶעֱמִיד
  choice: ergueu
  rationale: Verbo natural para a instalação de objetos cultuais colocados em pé.
- source_word: הָאֲשֵׁרִים
  choice: os aserins
  rationale: Translitera o plural hebraico e evita definir de modo excessivamente específico a forma dos objetos ligados a Aserá; a nota apresenta a alternativa interpretativa comum.
- source_word: הַפְּסִלִים
  choice: as imagens esculpidas
  rationale: Preserva tanto a natureza concreta de imagens talhadas quanto sua função cultual no contexto.
- source_word: לִפְנֵי הִכָּנְעוֹ
  choice: antes de se humilhar
  rationale: Reproduz o sentido reflexivo ou intransitivo natural da forma hebraica e a sequência temporal do relato.
- source_word: הִנָּם כְּתוּבִים
  choice: tudo isso está escrito
  rationale: Representa de modo idiomático a expressão apresentativa hebraica e torna claro que toda a matéria mencionada foi registrada.
- source_word: עַל דִּבְרֵי חוֹזָי
  choice: nos registros dos videntes
  rationale: Segue a leitura que entende a forma final como referência a videntes e traduz דִּבְרֵי, neste contexto documental, por 'registros'; a possível leitura como nome próprio é mantida em nota.
theological_decisions:
- issue: Natureza da humilhação de Manassés em הִכָּנְעוֹ
  choice: antes de se humilhar
  alternative: antes de ser humilhado
  rationale: A forma hebraica favorece a ação reflexiva ou intransitiva de Manassés e se ajusta ao enfoque do contexto, sem desenvolver além do texto uma doutrina específica de conversão.
- issue: Agente da resposta à oração em הֵעָתֶר לוֹ
  choice: como ele foi atendido
  alternative: como Deus lhe respondeu
  rationale: O contexto atribui a resposta a Deus, mas esta oração não explicita o agente; a forma passiva preserva essa concisão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção foi reorganizada levemente para evitar uma enumeração truncada, sem apagar a sequência do hebraico. “Lugares altos” conserva o termo bíblico técnico; “aserins” requer a nota por ser uma transliteração pouco comum. O marcador [a] foi colocado junto de “aserins”, ao qual sua nota realmente se refere.
