  text: וַ/יָּבֵ֨א יְהוָ֜ה עֲלֵי/הֶ֗ם אֶת שָׂרֵ֤י הַ/צָּבָא֙ אֲשֶׁר֙ לְ/מֶ֣לֶךְ אַשּׁ֔וּר וַ/יִּלְכְּד֥וּ אֶת מְנַשֶּׁ֖ה בַּ/חֹחִ֑ים וַ/יַּֽאַסְרֻ֨/הוּ֙ בַּֽ/נְחֻשְׁתַּ֔יִם וַ/יּוֹלִיכֻ֖/הוּ בָּבֶֽלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/011.yaml
  text: So Yahweh brought against them the commanders of the army of the king of Assyria[a], and they captured Manasseh with hooks, bound him with bronze chains, and took him to Babylon.
translation:
  language: pt
  text: Yahweh trouxe contra eles os comandantes do exército do rei da Assíria. Eles capturaram Manassés com ganchos[a], prenderam-no com correntes de bronze e o levaram para a Babilônia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com um gancho”. O termo hebraico pode designar ganchos ou espinhos; alguns o entendem de modo mais geral como uma restrição usada em um cativo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, preservando seu caráter pessoal em vez de substituí-lo por um título.
- source_word: וַיָּבֵא ... עֲלֵיהֶם
  choice: trouxe contra eles
  rationale: Preserva a força causativa do hifil de בוא e o sentido hostil de עַל neste contexto militar.
- source_word: שָׂרֵי הַצָּבָא אֲשֶׁר לְמֶלֶךְ אַשּׁוּר
  choice: os comandantes do exército do rei da Assíria
  rationale: Expressa de modo claro e atual a liderança militar e sua vinculação ao rei assírio.
- source_word: וַיִּלְכְּדוּ
  choice: capturaram
  rationale: לכד, em contexto militar, indica apreender ou capturar.
- source_word: בַּחֹחִים
  choice: com ganchos
  rationale: Mantém a imagem concreta do termo hebraico, que pode designar ganchos ou espinhos e, no contexto, provavelmente se refere a instrumentos usados para subjugar cativos; a incerteza é registrada em nota.
- source_word: וַיַּאַסְרֻהוּ בַּנְחֻשְׁתַּיִם
  choice: prenderam-no com correntes de bronze
  rationale: אסר significa prender ou amarrar, e נְחֻשְׁתַּיִם designa restrições metálicas de bronze; 'correntes' é claro e idiomático.
- source_word: וַיּוֹלִיכֻהוּ בָּבֶלָה
  choice: o levaram para a Babilônia
  rationale: O hifil de הלך expressa condução, e o hê direcional em בָּבֶלָה marca movimento em direção à Babilônia.
theological_decisions:
- issue: Agência divina no ataque assírio
  choice: Yahweh trouxe os comandantes assírios contra eles
  alternative: Yahweh permitiu que os comandantes viessem contra eles
  rationale: O verbo causativo atribui diretamente a ação a Yahweh. A tradução mantém essa afirmação de soberania e juízo, sem reduzi-la a mera permissão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A divisão em duas frases evita uma sequência excessivamente longa sem alterar as relações narrativas do hebraico.
