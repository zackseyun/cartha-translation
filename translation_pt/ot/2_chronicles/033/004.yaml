source:
  edition: WLC
  text: וּ/בָנָ֥ה מִזְבְּח֖וֹת בְּ/בֵ֣ית יְהוָ֑ה אֲשֶׁר֙ אָמַ֣ר יְהוָ֔ה בִּ/ירוּשָׁלִַ֥ם יִֽהְיֶה שְּׁמִ֖/י לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/004.yaml
  text: He built altars in the house of Yahweh[a], of which Yahweh had said[b], “In Jerusalem my name will be forever.”
translation:
  language: pt
  text: 'Ele construiu altares no templo de Yahweh[a], sobre o qual Yahweh havia dito: “Em Jerusalém estará o meu nome para sempre.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “na casa de Yahweh”.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico diz literalmente: “Em Jerusalém estará o meu nome para sempre”. Compare a expressão bíblica frequente: “o meu nome estará ali para sempre”.'
    reason: cross_reference
lexical_decisions:
- source_word: וּבָנָה
  choice: Ele construiu
  rationale: O qal perfeito de בנה significa “construiu”. Em narrativa portuguesa, o ו conjuntivo pode ficar implícito para maior naturalidade sem perder a sequência.
- source_word: מִזְבְּחוֹת
  choice: altares
  rationale: Plural direto de מִזְבֵּחַ, termo comum para altares destinados a sacrifícios.
- source_word: בְּבֵית יְהוָה
  choice: no templo de Yahweh
  rationale: בַּיִת significa literalmente “casa”, mas aqui designa claramente o templo; “templo” comunica o referente com naturalidade, enquanto a nota preserva a forma literal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֲשֶׁר אָמַר יְהוָה
  choice: sobre o qual Yahweh havia dito
  rationale: O relativo retoma o templo, e o mais-que-perfeito deixa clara, em português, a anterioridade da declaração divina sem atribuir ao hebraico uma forma temporal distinta.
- source_word: בִּירוּשָׁלִַם
  choice: Em Jerusalém
  rationale: Tradução direta da preposição com o topônimo, preservando sua posição enfática no início da fala.
- source_word: יִהְיֶה שְּׁמִי
  choice: estará o meu nome
  rationale: A construção preserva a ordem e o caráter locativo sugerido pelo contexto sem acrescentar o advérbio “ali”, ausente do texto hebraico.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Expressão portuguesa natural para duração permanente ou indefinidamente duradoura neste contexto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome próprio e evita substituí-lo por um título.
- issue: Possível expansão de יִהְיֶה שְּׁמִי com “ali”
  choice: “estará o meu nome”, sem acrescentar “ali”
  alternative: “o meu nome estará ali para sempre”
  rationale: O hebraico deste versículo não contém שָׁם, “ali”. A tradução conserva a formulação própria do texto, sem completá-la a partir de expressões paralelas.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. “Templo” explicita o referente contextual de בַּיִת; a nota conserva a imagem literal “casa”. O nome divino é transliterado como “Yahweh” de modo consistente.
