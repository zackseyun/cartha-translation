  text: ו/יכן אֶת מִזְבַּ֣ח יְהוָ֔ה וַ/יִּזְבַּ֣ח עָלָ֔י/ו זִבְחֵ֥י שְׁלָמִ֖ים וְ/תוֹדָ֑ה וַ/יֹּ֨אמֶר֙ לִֽ/יהוּדָ֔ה לַ/עֲב֕וֹד אֶת יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/016.yaml
  text: Then he restored the altar of Yahweh and sacrificed on it sacrifices of peace offerings and thanksgiving[a], and he told Judah to serve Yahweh[b], the God of Israel.
translation:
  language: pt
  text: Então ele restaurou o altar de Yahweh e ofereceu sobre ele sacrifícios de comunhão[a] e de gratidão[b]. E disse a Judá que servisse a Yahweh, o Deus de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “sacrifícios de paz” ou “ofertas de bem-estar”.
    reason: lexical_alternative
  - marker: b
    text: Ou “ofertas de gratidão”. O termo hebraico também pode significar “ação de graças”, mas, neste contexto sacrificial, refere-se a uma oferta apresentada em gratidão.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכֵן
  choice: restaurou
  rationale: O hifil de כון pode significar preparar, estabelecer ou pôr em ordem. No contexto da profanação e posterior reparação do culto, “restaurou” expressa naturalmente que o altar foi recolocado em condições adequadas.
- source_word: מִזְבַּח יְהוָה
  choice: o altar de Yahweh
  rationale: Reproduz com clareza a relação construta e mantém o nome divino explícito.
- source_word: וַיִּזְבַּח עָלָיו
  choice: ofereceu sobre ele sacrifícios
  rationale: זבח designa o ato de sacrificar; esta formulação é idiomática em português e deixa claro que as ofertas foram apresentadas no altar.
- source_word: זִבְחֵי שְׁלָמִים
  choice: sacrifícios de comunhão
  rationale: Preserva tanto o substantivo geral “sacrifícios” quanto a categoria cultual שְׁלָמִים. “Comunhão” comunica a dimensão de participação e bem-estar sem esconder outras traduções possíveis, registradas em nota.
- source_word: וְתוֹדָה
  choice: e de gratidão
  rationale: תּוֹדָה pode indicar gratidão ou uma oferta de gratidão. Sob o verbo sacrificial, “sacrifícios [...] de gratidão” explicita naturalmente a elipse em português, mantendo a nuance cultual em nota.
- source_word: וַיֹּאמֶר לִיהוּדָה
  choice: Também disse a Judá
  rationale: Traduz o verbo אמר sem intensificá-lo para “ordenou”. “Judá” pode representar coletivamente seu povo, como no hebraico.
- source_word: לַעֲבוֹד
  choice: que servisse
  rationale: עבד, tendo Deus como objeto, inclui culto e obediência, mas “servir” conserva sua amplitude sem restringi-lo apenas a atos de adoração.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta e corrente da construção hebraica, preservando a identificação pactual.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o tetragrama. “Yahweh” representa o nome próprio sem substituí-lo por um título.
- issue: Sentido cultual de שְׁלָמִים
  choice: sacrifícios de comunhão
  alternative: sacrifícios de paz; ofertas de bem-estar
  rationale: O termo designa uma categoria sacrificial cuja abrangência não se reduz a uma única ideia. A tradução principal é inteligível, e a nota preserva as alternativas legítimas.
- issue: Alcance de עבד em relação a Deus
  choice: servir
  alternative: adorar
  rationale: “Servir” conserva simultaneamente as dimensões de culto, lealdade e obediência, evitando estreitar o sentido à adoração ritual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A sintaxe evita literalismo rígido, mas preserva as categorias sacrificiais, o nome divino e a amplitude de “servir”.
