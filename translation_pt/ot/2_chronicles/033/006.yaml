  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הוּא֩ הֶעֱבִ֨יר אֶת בָּנָ֤י/ו בָּ/אֵשׁ֙ בְּ/גֵ֣י בֶן הִנֹּ֔ם וְ/עוֹנֵ֤ן וְ/נִחֵשׁ֙ וְֽ/כִשֵּׁ֔ף וְ/עָ֥שָׂה א֖וֹב וְ/יִדְּעוֹנִ֑י הִרְבָּ֗ה לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִיסֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/006.yaml
  text: He made his sons pass through the fire in the Valley of the Son of Hinnom[a], practiced soothsaying and divination and sorcery, and dealt with mediums and spiritists. He multiplied doing what was evil in the eyes of Yahweh[b], provoking him to anger.
translation:
  language: pt
  text: Ele fez seus filhos passarem pelo fogo no Vale do Filho de Hinom[a], praticou a interpretação de presságios, a adivinhação e a feitiçaria e envolveu-se com médiuns e evocadores de espíritos[b]. Ele fez cada vez mais o que era mau aos olhos de Yahweh, provocando-o à ira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais explícito, “sacrificou seus filhos no fogo”. O idioma hebraico diz literalmente “fez seus filhos passarem pelo fogo”.
    reason: lexical_alternative
  - marker: b
    text: Os termos hebraicos designam pessoas ou práticas associadas à consulta dos mortos ou dos espíritos.
    reason: cultural_note
lexical_decisions:
- source_word: הֶעֱבִיר אֶת־בָּנָיו בָּאֵשׁ
  choice: fez seus filhos passarem pelo fogo
  rationale: Preserva a formulação causativa e o idioma hebraico, que no contexto indica um rito de sacrifício de crianças, sem tornar essa interpretação mais explícita que o texto principal.
- source_word: בְּגֵי בֶן־הִנֹּם
  choice: no vale do Filho de Hinom
  rationale: Traduz de modo transparente o topônimo hebraico e conserva Hinom como nome próprio.
- source_word: וְעוֹנֵן
  choice: praticou a interpretação de presságios
  rationale: Expressa a consulta ou leitura de sinais e mantém esta prática distinta da adivinhação mencionada em seguida.
- source_word: וְנִחֵשׁ
  choice: a adivinhação
  rationale: Comunica uma prática divinatória ou de interpretação de agouros em linguagem portuguesa corrente.
- source_word: וְכִשֵּׁף
  choice: a feitiçaria
  rationale: Designa de maneira clara e digna a prática de artes mágicas ou encantamentos.
- source_word: וְעָשָׂה אוֹב וְיִדְּעוֹנִי
  choice: envolveu-se com médiuns e evocadores de espíritos
  rationale: A construção hebraica é difícil e pode abranger recorrer a, empregar ou praticar atividades associadas à consulta dos mortos e dos espíritos. 'Envolveu-se com' preserva essa amplitude sem escolher indevidamente uma ação mais específica.
- source_word: הִרְבָּה לַעֲשׂוֹת הָרַע
  choice: Multiplicou suas más ações
  rationale: Reproduz a ideia de abundância e intensificação da construção com רבה, evitando o pouco natural 'multiplicou fazer' e conservando mais força que simplesmente 'fez muito mal'.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Mantém o idioma avaliativo hebraico em português natural e translitera o nome divino.
- source_word: לְהַכְעִיסוֹ
  choice: provocando-o à ira
  rationale: Preserva a nuance causativa e a possível relação de resultado ou propósito com as ações anteriores.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; 'Yahweh' conserva o nome divino em vez de substituí-lo por um título.
- issue: Explicitação do sacrifício de crianças
  choice: Manter no texto principal o idioma 'fez seus filhos passarem pelo fogo'
  alternative: sacrificou seus filhos no fogo
  rationale: A expressão hebraica indica fortemente um rito sacrificial, mas sua formulação literal deixa alguma tensão interpretativa; a explicação mais explícita fica na nota.
- issue: Identificação de אוֹב e יִדְּעוֹנִי
  choice: médiuns e evocadores de espíritos
  alternative: necromantes; adivinhos; espíritas
  rationale: A escolha comunica a associação com a consulta de mortos ou espíritos sem importar a conotação moderna e denominacional que 'espíritas' pode ter em português.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A enumeração mantém as práticas distintas, e a formulação final conserva a intensidade do hebraico sem recorrer a uma construção artificial.
