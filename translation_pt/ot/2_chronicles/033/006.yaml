    issue: Topônimo grafado com inicial minúscula
    rationale: A expressão funciona como nome de lugar; “Vale do Filho de Hinom” torna isso mais claro e segue a apresentação do nome próprio.
  - severity: medium
    issue: “Multiplicou suas más ações” desloca a formulação hebraica
    rationale: O hebraico diz literalmente que ele intensificou/abundou em fazer o mal, não que multiplicou ações más já identificadas como suas. “Fez cada vez mais o que era mau” mantém a progressão e soa natural.
