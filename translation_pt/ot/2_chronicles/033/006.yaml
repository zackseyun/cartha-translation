  to: Ele fez seus filhos passarem pelo fogo no Vale do Filho de Hinom[a], praticou a interpretação de presságios, a adivinhação e a feitiçaria e envolveu-se com médiuns e evocadores de espíritos[b]. Ele fez cada vez mais o que era mau aos olhos de Yahweh, provocando-o à ira.
