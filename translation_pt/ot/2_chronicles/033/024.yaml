  text: And his servants conspired against him and put him to death in his own house.
translation:
  language: pt
  text: Seus servos conspiraram contra ele e o mataram em sua própria casa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ עָלָיו
  choice: conspiraram contra ele
  rationale: A expressão קָשַׁר עַל indica conspirar contra alguém, especialmente em contexto de atentado político; a tradução preserva tanto o alvo quanto o caráter organizado da ação.
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: No contexto da corte real, עֶבֶד pode designar servos ou agentes do rei. “Servos” é direto e evita especificar indevidamente que fossem escravos ou altos oficiais.
- source_word: וַיְמִיתֻהוּ
  choice: o mataram
  rationale: A forma causativa de מוּת significa literalmente causar a morte. Em português narrativo, “mataram” comunica essa ação de modo natural, claro e digno; “deram-lhe a morte” seria menos corrente.
- source_word: בְּבֵיתוֹ
  choice: em sua própria casa
  rationale: A preposição בְּ indica localização, e o sufixo possessivo identifica a casa como sendo dele. “Própria” realça naturalmente em português a intimidade do local sem alterar o referente.
