  text: וַ/יַּכּוּ֙ עַם הָ/אָ֔רֶץ אֵ֥ת כָּל הַ/קֹּֽשְׁרִ֖ים עַל הַ/מֶּ֣לֶךְ אָמ֑וֹן וַ/יַּמְלִ֧יכוּ עַם הָ/אָ֛רֶץ אֶת יֹאשִׁיָּ֥הוּ בְנ֖/וֹ תַּחְתָּֽי/ו־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/025.yaml
  text: But the people of the land struck down all those who had conspired against King Amon[b][a], and the people of the land made Josiah his son king in his place.
translation:
  language: pt
  text: Mas o povo da terra matou todos os que haviam conspirado contra o rei Amom[a] e proclamou rei Josias, filho dele, em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O povo da terra” é uma expressão hebraica que pode designar a população do país, talvez com conotações sociopolíticas.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: matou
  rationale: O verbo נכה pode indicar ferir ou golpear, mas neste contexto narrativo a ação contra os conspiradores é letal. “Matou” comunica com clareza o resultado sem recorrer ao arcaico “feriu de morte”.
- source_word: עַם הָאָרֶץ
  choice: o povo da terra
  rationale: Preserva a expressão sociopolítica hebraica e deixa em aberto se ela designa a população em geral ou um grupo social com papel político específico.
- source_word: כָּל הַקֹּשְׁרִים
  choice: todos os que haviam conspirado
  rationale: Expressa naturalmente o particípio de קשר e sua referência aos envolvidos numa conspiração anterior contra o rei.
- source_word: עַל הַמֶּלֶךְ אָמוֹן
  choice: contra o rei Amom
  rationale: Com קשר e עַל, a construção indica conspiração dirigida contra alguém. “Amom” é a forma portuguesa corrente do nome.
- source_word: וַיַּמְלִיכוּ
  choice: proclamou rei
  rationale: O hifil de מלך significa fazer alguém rei. “Proclamou rei” é natural em português e evita acrescentar o rito específico pressuposto por “coroou”.
- source_word: יֹאשִׁיָּהוּ בְנוֹ
  choice: Josias, filho dele
  rationale: A aposição identifica Josias como filho de Amom; “dele” torna o referente claro em português corrente.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: Indica substituição e sucessão no trono de maneira idiomática.
- source_word: וַ
  choice: Mas
  rationale: Embora o waw narrativo possa ser traduzido por “e”, aqui “mas” explicita adequadamente o contraste com o assassinato de Amom por seus servos no versículo anterior.
