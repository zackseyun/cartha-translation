  text: וְ/לֹ֣א אוֹסִ֗יף לְ/הָסִיר֙ אֶת רֶ֣גֶל יִשְׂרָאֵ֔ל מֵ/עַל֙ הָֽ/אֲדָמָ֔ה אֲשֶׁ֥ר הֶֽעֱמַ֖דְתִּי לַ/אֲבֹֽתֵי/כֶ֑ם רַ֣ק אִם יִשְׁמְר֣וּ לַ/עֲשׂ֗וֹת אֵ֚ת כָּל אֲשֶׁ֣ר צִוִּיתִ֔י/ם לְ/כָל הַ/תּוֹרָ֛ה וְ/הַֽ/חֻקִּ֥ים וְ/הַ/מִּשְׁפָּטִ֖ים בְּ/יַד מֹשֶֽׁה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/008.yaml
  text: And I will no longer remove the foot of Israel from upon the land that I appointed for your fathers[a], if only they are careful to do all that I commanded them[b], according to all the law and the statutes and the judgments given through Moses.
translation:
  language: pt
  text: E não voltarei a remover Israel[a] da terra que destinei aos seus antepassados, contanto que tenham o cuidado de cumprir tudo o que lhes ordenei, conforme toda a Lei, os estatutos e as normas dados por meio de Moisés.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o pé de Israel”, uma expressão que se refere à presença de Israel na terra.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “pela mão de Moisés”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹסִיף לְהָסִיר
  choice: não tornarei a remover
  rationale: Reproduz a ideia de não voltar a retirar, expressa por יסף com o infinitivo de סור, em português natural e digno.
- source_word: רֶגֶל יִשְׂרָאֵל
  choice: Israel
  rationale: A expressão literal, “o pé de Israel”, é uma metonímia da presença de Israel na terra. Traduzir simplesmente “Israel” comunica o sentido com clareza; a leitura literal é registrada em nota.
- source_word: מֵעַל הָאֲדָמָה
  choice: da terra
  rationale: Neste contexto de permanência territorial, “da terra” transmite naturalmente a ideia de retirada de sobre o território.
- source_word: אֲשֶׁר הֶעֱמַדְתִּי לַאֲבֹתֵיכֶם
  choice: que destinei aos seus antepassados
  rationale: O hifil de עמד comunica aqui estabelecimento ou designação. “Destinei” preserva a ação divina sem sugerir que o texto emprega explicitamente o verbo “dar”; “antepassados” é mais transparente hoje do que “pais” nesse sentido.
- source_word: רַק אִם
  choice: contanto que
  rationale: Expressa com clareza a condição restritiva real introduzida pelo hebraico.
- source_word: יִשְׁמְרוּ לַעֲשׂוֹת
  choice: tenham o cuidado de cumprir
  rationale: Preserva tanto a atenção diligente indicada por שמר quanto a execução prática indicada por עשה.
- source_word: כָּל אֲשֶׁר צִוִּיתִים
  choice: tudo o que lhes ordenei
  rationale: Mantém a totalidade do mandamento e o pronome referente ao povo.
- source_word: לְכָל הַתּוֹרָה
  choice: toda a Lei
  rationale: No conjunto jurídico formado por torá, estatutos e normas, “Lei” é claro e adequado; a construção foi integrada como explicação do conteúdo ordenado.
- source_word: הַחֻקִּים
  choice: os estatutos
  rationale: Mantém a terminologia jurídica e a distinção em relação aos demais termos da enumeração.
- source_word: הַמִּשְׁפָּטִים
  choice: as normas
  rationale: Comunica em português corrente as determinações jurídicas de מִשְׁפָּטִים sem o possível equívoco de “julgamentos” como atos judiciais isolados.
- source_word: בְּיַד מֹשֶׁה
  choice: dados por meio de Moisés
  rationale: A expressão idiomática “pela mão de Moisés” indica mediação ou agência. “Por meio de Moisés” comunica isso claramente, enquanto a forma literal é preservada em nota.
theological_decisions:
- issue: Permanência condicional de Israel na terra
  choice: A permanência é apresentada como condicionada à obediência diligente.
  alternative: Ler a declaração como garantia incondicional ou como condição apenas retórica.
  rationale: רַק אִם introduz uma condição explícita. A tradução conserva essa contingência no contexto da aliança sem tirar conclusões sobre debates teológicos mais amplos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A metonímia “o pé de Israel” foi explicitada no corpo como “Israel” para evitar uma formulação obscura; a enumeração legal foi mantida sem linguagem confessional específica.
