  source_fidelity: 'A tradução preserva os elementos centrais do hebraico: os demais feitos de Manassés, sua oração a seu Deus, as palavras dos videntes, a fala em nome de Yahweh e a referência aos reis de Israel. Contudo, “falaram com ele” pode sugerir uma conversa recíproca, enquanto אֵלָיו indica que os videntes lhe dirigiram a palavra.'
  naturalness: O português é claro e de registro bíblico moderno. “Lhe falaram” é simultaneamente natural e mais preciso que “falaram com ele”. “Nos registros” comunica melhor a fórmula documental do que “entre os relatos”, sem atribuir à fonte uma forma literária excessivamente específica.
  terminology: “Yahweh”, “videntes” e “reis de Israel” são escolhas adequadas e mantêm os termos e a leitura do texto massorético. “Registros” é preferível a “relatos” para a referência a uma fonte régia escrita.
