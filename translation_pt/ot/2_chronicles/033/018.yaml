    rationale: A expressão portuguesa pode implicar diálogo ou conversa bilateral. O hebraico הַמְדַבְּרִים אֵלָיו descreve videntes que falaram a/dirigiram palavras a Manassés; “lhe falaram” preserva melhor essa direção.
  - severity: low
    issue: “Entre os relatos”
    rationale: Embora possível, “relatos” é menos documental e “entre” é menos direto para a fórmula hebraica de remissão a uma obra escrita. “Nos registros” é claro, idiomático e adequado ao contexto historiográfico.
