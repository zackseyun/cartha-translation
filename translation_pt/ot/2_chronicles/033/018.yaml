base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/018.yaml
  text: The rest of the acts of Manasseh[a], and his prayer to his God, and the words of the seers who spoke to him in the name of Yahweh, the God of Israel—behold, they are written among the records of the kings of Israel.
translation:
  language: pt
  text: Os demais feitos de Manassés, sua oração a seu Deus e as palavras dos videntes que lhe falaram em nome de Yahweh, o Deus de Israel — tudo isso está registrado nos registros dos reis de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no livro dos reis de Israel” ou “nos anais dos reis de Israel”. A fórmula hebraica remete a uma fonte régia escrita.'
    reason: Alternativa lexical para a fórmula de citação documental.
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי מְנַשֶּׁה
  choice: os demais feitos de Manassés
  rationale: Na fórmula historiográfica, דִּבְרֵי abrange feitos e acontecimentos, não apenas palavras; “os demais feitos” é natural e fiel em português.
- source_word: תְפִלָּתוֹ אֶל אֱלֹהָיו
  choice: sua oração ao seu Deus
  rationale: Preserva tanto o possessivo quanto a preposição אֶל e a expressão pessoal “seu Deus”.
- source_word: הַחֹזִים
  choice: os videntes
  rationale: Mantém a designação profética específica חֹזִים, sem nivelá-la interpretativamente para “profetas”.
- source_word: הַמְדַבְּרִים אֵלָיו
  choice: que falaram com ele
  rationale: Expressa em português corrente a ideia de pessoas que lhe dirigiram palavras; evita a formulação menos natural “falaram a ele”.
- source_word: בְּשֵׁם יְהוָה
  choice: em nome de Yahweh
  rationale: Tradução direta da fórmula de autoridade profética e preservação do nome divino.
- source_word: הִנָּם
  choice: tudo isso está
  rationale: O demonstrativo recapitulativo “tudo isso” conserva a força dêitica e enfática da partícula, de maneira mais natural no português moderno do que “eis que”.
- source_word: עַל דִּבְרֵי מַלְכֵי יִשְׂרָאֵל
  choice: registrado entre os relatos dos reis de Israel
  rationale: A fórmula remete a uma fonte régia escrita. “Registrado” explicita a escrita implícita, e “entre os relatos” mantém a referência documental sem identificar com excesso de precisão o tipo de obra.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Identidade dos reis citados na fonte
  choice: reis de Israel
  alternative: reis de Judá
  rationale: Preserva a leitura massorética יִשְׂרָאֵל, mesmo que o contexto de Manassés possa levar alguns leitores a esperar “Judá”; não se harmoniza o texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação foi simplificada sem eliminar nenhum elemento do hebraico; o travessão destaca a conclusão recapitulativa. O marcador da nota foi colocado junto à fórmula documental que a nota esclarece.
