source:
  edition: WLC
  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מְנַשֶּׁ֥ה וְ/אֶל עַמּ֖/וֹ וְ/לֹ֥א הִקְשִֽׁיבוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/010.yaml
  text: And Yahweh spoke to Manasseh and to his people[a], but they did not listen.
translation:
  language: pt
  text: E Yahweh falou a Manassés e ao seu povo, mas eles não deram atenção.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não escutaram” ou “não deram ouvidos”. O verbo hebraico pode indicar uma escuta atenta que implica uma resposta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O piel de דבר significa normalmente “falar”; com אֶל, “falou a” reproduz de modo natural a construção hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome pessoal divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מְנַשֶּׁה
  choice: Manassés
  rationale: Usa a forma portuguesa tradicional e amplamente reconhecida do nome próprio.
- source_word: עַמּוֹ
  choice: seu povo
  rationale: Traduz עַם com o sufixo masculino singular e, no contexto, designa o povo ou os súditos de Manassés.
- source_word: וְלֹא
  choice: mas ... não
  rationale: A conjunção introduz aqui um contraste entre a fala de Yahweh e a falta de resposta dos destinatários; “mas” expressa naturalmente essa relação em português.
- source_word: הִקְשִׁיבוּ
  choice: deram atenção
  rationale: O hiphil de קשב indica escutar atentamente, prestar atenção ou dar ouvidos. “Deram atenção” comunica de forma clara a escuta que deveria produzir resposta, sem explicitar demais a ideia de obediência.
theological_decisions:
- issue: Referente do sujeito plural em “não deram atenção”
  choice: O sujeito implícito inclui Manassés e seu povo.
  alternative: O plural poderia ser entendido como referência apenas ao povo, enquanto Manassés seria mencionado separadamente como destinatário.
  rationale: O hebraico apresenta dois destinatários coordenados — Manassés e seu povo — e em seguida emprega um verbo no plural. A forma portuguesa “eles não deram atenção”, expressa pelo sujeito verbal implícito, preserva a leitura mais direta sem acrescentar identificação explícita.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível. “Falou a” conserva a relação do verbo com os destinatários, e “não deram atenção” comunica naturalmente o contraste e a força de הִקְשִׁיבוּ.
