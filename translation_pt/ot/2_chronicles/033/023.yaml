revisions:
- from: Mas Amom não se humilhou diante de Yahweh como seu pai Manassés havia se humilhado[a]; pelo contrário, aumentou ainda mais a sua culpa.
  to: Mas Amom não se humilhou diante de Yahweh como seu pai Manassés havia se humilhado[a]; pois ele, Amom, multiplicou a culpa.
  rationale: A revisão substitui a adversativa interpretativa por «pois», que reflete a função explicativa de כִּי, remove a intensificação não expressa «ainda mais» e restitui na oração final a ênfase de הוּא אָמוֹן («ele, Amom»). A nota mantém a ambiguidade sintática possível quanto ao alcance de «diante de Yahweh».
