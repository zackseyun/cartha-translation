source:
  edition: WLC
  text: וְ/לֹ֤א נִכְנַע֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה כְּ/הִכָּנַ֖ע מְנַשֶּׁ֣ה אָבִ֑י/ו כִּ֛י ה֥וּא אָמ֖וֹן הִרְבָּ֥ה אַשְׁמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/023.yaml
  text: But he did not humble himself before Yahweh as his father Manasseh humbled himself[a], for he, Amon, increased guilt.
translation:
  language: pt
  text: Mas Amom não se humilhou diante de Yahweh como seu pai Manassés havia se humilhado[a]; pois ele, Amom, multiplicou a culpa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como seu pai Manassés havia se humilhado diante de Yahweh”.'
    reason: A posição da expressão hebraica permite entendê-la diretamente com a ação de Amom ou, por extensão na comparação, com a humilhação de Manassés.
lexical_decisions:
- source_word: נִכְנַע
  choice: se humilhou
  rationale: O nifal de כנע tem aqui sentido reflexivo, indicando que Amom não se rebaixou nem se submeteu diante de Deus. “Humilhar-se” é natural em português e mantém a ligação verbal com a atitude de Manassés.
- source_word: מִלִּפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: A expressão indica estar perante ou na presença de alguém. “Diante de” preserva de modo conciso esse sentido, e o nome divino é transliterado como Yahweh.
- source_word: כְּהִכָּנַע
  choice: como ... havia se humilhado
  rationale: A preposição comparativa כְ com o infinitivo de כנע apresenta a humilhação anterior de Manassés como contraste com Amom. O mais-que-perfeito composto explicita naturalmente, em português, a anterioridade narrativa sem alterar o sentido.
- source_word: מְנַשֶּׁה אָבִיו
  choice: seu pai Manassés
  rationale: Esta ordem é idiomática em português e identifica claramente Manassés como pai de Amom.
- source_word: כִּי
  choice: pelo contrário
  rationale: 'Neste contexto, כִּי introduz uma explicação que também acentua o contraste: em vez de se humilhar, Amom agravou sua culpa. “Pelo contrário” comunica essa relação naturalmente.'
- source_word: הוּא אָמוֹן
  choice: Amom
  rationale: O pronome seguido do nome próprio dá destaque ao sujeito. Em português, antecipar “Amom” no início da oração preserva o foco e evita a formulação pouco natural “ele, Amom”.
- source_word: הִרְבָּה
  choice: aumentou ainda mais
  rationale: O hifil de רבה significa tornar maior, aumentar ou multiplicar. “Aumentou ainda mais” expressa o agravamento enfático da culpa em português corrente.
- source_word: אַשְׁמָה
  choice: a sua culpa
  rationale: Neste contexto, o substantivo designa culpabilidade, não uma oferta pela culpa. O possessivo, implícito pelo sujeito da ação, torna a frase natural e clara em português.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome divino pessoal sem substituí-lo por um título.
- issue: Relação entre a falta de humilhação e o aumento da culpa
  choice: contraste enfático, sem definir uma doutrina adicional
  alternative: 'relação exclusivamente causal: “pois aumentou a sua culpa”'
  rationale: A sequência hebraica permite que כִּי explique a afirmação anterior, enquanto o conteúdo cria um contraste evidente entre humilhar-se e agravar a culpa. A tradução comunica o contraste sem especificar além do texto como uma atitude causou a outra.
- issue: Alcance de “diante de Yahweh”
  choice: ligado diretamente à falta de humilhação de Amom, com a leitura alternativa em nota
  alternative: ligado também, ou mais diretamente, à humilhação de Manassés
  rationale: A ordem hebraica favorece sua ligação imediata com נִכְנַע, mas a construção comparativa admite entender a expressão com a ação paralela de Manassés. A nota preserva essa ambiguidade sintática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O nome do rei é apresentado na forma portuguesa tradicional “Amom”. A estrutura foi levemente reorganizada para preservar a ênfase hebraica no próprio Amom sem produzir uma aposição artificial.
