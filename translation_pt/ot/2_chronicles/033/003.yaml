base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/003.yaml
  text: For he rebuilt the high places that Hezekiah his father had torn down[a], and he set up altars to the Baals, and made Asherah poles[d][c][b], and bowed down to all the host of heaven and served them.
translation:
  language: pt
  text: Pois ele tornou a construir os lugares altos que Ezequias, seu pai, havia derrubado[a]. Erigiu altares aos baalins[b], fez postes de Aserá[c], prostrou-se diante de todo o exército dos céus[d] e os serviu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “construiu novamente”. O hebraico usa literalmente “voltou e construiu”, indicando que ele restaurou o que havia sido removido.
    reason: lexical_alternative
  - marker: b
    text: “Baalins” conserva o plural hebraico, que provavelmente se refere a diferentes manifestações locais ou imagens de Baal; algumas traduções empregam o singular “Baal”.
    reason: lexical_alternative
  - marker: c
    text: Ou “aserás”. O termo hebraico pode designar postes ou outros símbolos cultuais associados à deusa Aserá.
    reason: lexical_alternative
  - marker: d
    text: Aqui, “exército dos céus” se refere aos corpos celestes como objetos de culto; compare 2 Reis 21:3.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּשָׁב וַיִּבֶן
  choice: tornou a construir
  rationale: A sequência idiomática de שׁוב + בנה expressa repetição ou restauração. “Tornou a construir” é natural em português e deixa perceptível a ideia dos dois verbos hebraicos.
- source_word: הַבָּמוֹת
  choice: os lugares altos
  rationale: Expressão bíblica consolidada para os locais elevados de culto, preservando o caráter específico desses santuários sem generalizá-los como meros “ídolos”.
- source_word: נִתַּץ
  choice: havia derrubado
  rationale: O verbo indica demolir ou pôr abaixo estruturas; “havia derrubado” comunica claramente a ação anterior de Ezequias.
- source_word: יְחִזְקִיָּהוּ אָבִיו
  choice: Ezequias, seu pai
  rationale: Mantém a aposição do hebraico e soa natural em português.
- source_word: וַיָּקֶם מִזְבְּחוֹת לַבְּעָלִים
  choice: Erigiu altares aos baalins
  rationale: “Erigiu” traduz o sentido de levantar ou estabelecer, e “baalins” conserva o plural hebraico, que pode aludir a manifestações locais ou imagens de Baal.
- source_word: אֲשֵׁרוֹת
  choice: postes de Aserá
  rationale: O plural pode designar objetos cultuais ligados à deusa Aserá. A formulação comunica ao leitor o provável referente concreto, sem ocultar sua associação específica.
- source_word: וַיִּשְׁתַּחוּ
  choice: prostrou-se diante de
  rationale: Preserva o gesto físico de inclinar-se ou lançar-se por terra, enquanto o verbo seguinte expressa o serviço cultual.
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  choice: diante de todo o exército dos céus
  rationale: Conserva a expressão figurada hebraica, que neste contexto se refere aos corpos celestes considerados objetos de culto, e evita reduzi-la apenas a “estrelas”.
- source_word: וַיַּעֲבֹד אֹתָם
  choice: e o serviu
  rationale: “Serviu” preserva a distinção lexical em relação a “prostrou-se”. O pronome retoma coletivamente “exército dos céus”, conforme a concordância natural em português, embora o hebraico use pronome plural.
theological_decisions:
- issue: Tradução dos termos específicos do culto pagão
  choice: Manter “lugares altos”, “baalins” e “postes de Aserá”
  alternative: Generalizar como “santuários”, “ídolos” ou “deuses falsos”
  rationale: O versículo enumera formas históricas e concretas de culto. Preservar os termos específicos evita substituir os dados do texto por um resumo teológico.
- issue: Sentido de “exército dos céus”
  choice: Preservar a expressão, explicando que se refere aos corpos celestes neste contexto
  alternative: Interpretar diretamente como “anjos” ou traduzir apenas como “estrelas”
  rationale: No contexto do culto ilícito, a expressão aponta mais naturalmente para os astros. A tradução mantém a imagem hebraica, e a nota delimita o sentido contextual sem introduzir seres angelicais.
- issue: Relação entre prostrar-se e servir
  choice: Traduzir os dois verbos separadamente como “prostrou-se” e “serviu”
  alternative: Fundir ambos em uma única ocorrência de “adorou”
  rationale: A distinção conserva tanto o gesto de reverência quanto o serviço cultual e reproduz a tensão expressiva do texto hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se expressões bíblicas específicas quando carregam informação histórica ou cultual; notas breves esclarecem termos menos transparentes sem inserirem a explicação no corpo do versículo.
