base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/020.yaml
  text: And Manasseh slept with his fathers[a], and they buried him in his house. And Amon his son reigned in his place.
translation:
  language: pt
  text: Manassés adormeceu com seus antepassados, e o sepultaram em sua casa.[a] Amom, seu filho, reinou em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em seu palácio”; o hebraico diz “em sua casa”, expressão que, em um contexto régio, pode referir-se ao complexo do palácio.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: descansou com seus antepassados
  rationale: Preserva a imagem do eufemismo hebraico para a morte, mas usa uma formulação natural e digna em português; “antepassados” comunica aqui o sentido coletivo de אֲבֹתָיו com clareza moderna.
- source_word: וַיִּקְבְּרֻהוּ
  choice: o sepultaram
  rationale: Mantém a construção ativa no plural e o objeto pronominal do hebraico.
- source_word: בֵּיתוֹ
  choice: em sua casa
  rationale: Reproduz o sentido lexical direto de בַּיִת sem decidir silenciosamente se, no contexto régio, se trata especificamente do palácio ou de seu complexo.
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: É a forma concisa e convencional de expressar o governo régio na fórmula de sucessão.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: Expressa naturalmente a ideia de substituição ou sucessão dinástica presente no hebraico.
