source:
  edition: WLC
  text: וַ֠/יָּסַר אֶת אֱלֹהֵ֨י הַ/נֵּכָ֤ר וְ/אֶת הַ/סֶּ֨מֶל֙ מִ/בֵּ֣ית יְהוָ֔ה וְ/כָל הַֽ/מִּזְבְּח֗וֹת אֲשֶׁ֥ר בָּנָ֛ה בְּ/הַ֥ר בֵּית יְהוָ֖ה וּ/בִ/ירוּשָׁלִָ֑ם וַ/יַּשְׁלֵ֖ךְ ח֥וּצָ/ה לָ/עִֽיר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/015.yaml
  text: He removed the foreign gods and the idol from the house of Yahweh[a], and all the altars that he had built on the mountain of the house of Yahweh and in Jerusalem[b], and he threw them outside the city.
translation:
  language: pt
  text: Ele retirou da casa de Yahweh os deuses estrangeiros e o ídolo[a], bem como todos os altares que havia construído no monte da casa de Yahweh[b] e em Jerusalém, e os lançou para fora da cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a imagem”. O termo hebraico סֶמֶל pode designar um ídolo ou uma imagem cultual.
    reason: lexical_alternative
  - marker: b
    text: Ou “na colina da casa de Yahweh”; isto é, no monte do templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: retirou
  rationale: O hifil de סור indica fazer algo sair ou removê-lo; “retirou” é natural e exato no contexto da reforma.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: os deuses estrangeiros
  rationale: A expressão designa divindades alheias ao culto de Yahweh; esta tradução preserva sua forma plural e seu sentido religioso.
- source_word: הַסֶּמֶל
  choice: o ídolo
  rationale: סֶמֶל pode designar uma imagem cultual ou um ídolo; “ídolo” explicita adequadamente a função religiosa do objeto, enquanto a alternativa é registrada em nota.
- source_word: מִבֵּית יְהוָה
  choice: da casa de Yahweh
  rationale: Preserva a expressão hebraica para o templo e mantém o nome divino como nome próprio.
- source_word: וְכָל הַמִּזְבְּחוֹת
  choice: bem como todos os altares
  rationale: “Todos os altares” traduz diretamente o hebraico; “bem como” articula com clareza os objetos do verbo sem alterar a relação sintática.
- source_word: אֲשֶׁר בָּנָה
  choice: que havia construído
  rationale: O mais-que-perfeito composto deixa clara a anterioridade da construção dos altares em relação à sua retirada.
- source_word: בְּהַר בֵּית יְהוָה
  choice: no monte da casa de Yahweh
  rationale: Mantém a formulação concreta do hebraico e evita substituir diretamente a expressão pela identificação interpretativa “monte do templo”.
- source_word: וּבִירוּשָׁלָם
  choice: e em Jerusalém
  rationale: Indica que os altares também estavam na cidade, para além do monte da casa de Yahweh.
- source_word: וַיַּשְׁלֵךְ
  choice: e os lançou
  rationale: Preserva a ideia de descarte vigoroso; o pronome plural retoma naturalmente os objetos anteriormente mencionados.
- source_word: חוּצָה לָעִיר
  choice: para fora da cidade
  rationale: Expressa tanto a direção indicada por חוּצָה quanto a localização além dos limites da cidade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” o representa diretamente e evita substituí-lo pelo título “Senhor”.
- issue: Natureza de הַסֶּמֶל
  choice: ídolo
  alternative: imagem; imagem cultual
  rationale: O contexto é de remoção de objetos de culto estrangeiro. “Ídolo” comunica essa função sem especificar indevidamente como o objeto foi produzido; a amplitude lexical é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção conserva “casa de Yahweh” e “monte da casa de Yahweh” para refletir as expressões hebraicas, enquanto a ordem inicial foi ajustada para evitar a leitura equivocada de que apenas o ídolo estava dentro do templo.
