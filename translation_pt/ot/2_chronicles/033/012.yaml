  text: וּ/כְ/הָצֵ֣ר ל֔/וֹ חִלָּ֕ה אֶת פְּנֵ֖י יְהוָ֣ה אֱלֹהָ֑י/ו וַ/יִּכָּנַ֣ע מְאֹ֔ד מִ/לִּ/פְנֵ֖י אֱלֹהֵ֥י אֲבֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/012.yaml
  text: And when he was in distress[b][a], he sought the favor of Yahweh his God and humbled himself greatly before the God of his fathers.
translation:
  language: pt
  text: Quando estava em angústia, buscou o favor de Yahweh, seu Deus,[a] e humilhou-se muito diante do Deus de seus pais.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “suplicou a Yahweh, seu Deus” ou “implorou a Yahweh, seu Deus”. A expressão hebraica é um idiomatismo relacionado a buscar ou implorar favor.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o Deus de seus antepassados”. O hebraico diz literalmente “o Deus de seus pais”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְהָצֵר לוֹ
  choice: Quando estava em angústia
  rationale: A construção marca uma circunstância temporal, e o verbo expressa aflição ou aperto. “Em angústia” comunica de modo natural a experiência de Manassés sem ampliar o sentido.
- source_word: חִלָּה אֶת־פְּנֵי
  choice: buscou o favor de
  rationale: O idioma hebraico, literalmente relacionado a abrandar ou apaziguar o rosto de alguém, significa suplicar ou procurar obter favor. A formulação escolhida preserva tanto o caráter relacional quanto o tom de súplica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהָיו
  choice: seu Deus
  rationale: Reproduz diretamente o sufixo possessivo e destaca que Manassés se volta para aquele que é seu Deus.
- source_word: וַיִּכָּנַע מְאֹד
  choice: e humilhou-se profundamente
  rationale: O nifal de כנע tem aqui sentido reflexivo no contexto de arrependimento, enquanto מְאֹד intensifica fortemente a ação. “Profundamente” é natural em português e preserva essa intensidade.
- source_word: מִלִּפְנֵי
  choice: diante de
  rationale: Expressa em português corrente o sentido idiomático de estar perante ou na presença de alguém.
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: o Deus de seus pais
  rationale: Mantém a forma masculina explícita do hebraico e a expressão histórico-pactual tradicional, sem impedir que “antepassados” seja reconhecido como alternativa possível.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal do Deus de Israel, em vez de substituí-lo por um título.
- issue: Linguagem ancestral em אֱלֹהֵי אֲבֹתָיו
  choice: o Deus de seus pais
  alternative: o Deus de seus antepassados
  rationale: “Pais” corresponde formalmente ao substantivo masculino do texto e conserva a expressão pactual. “Antepassados” é semanticamente possível, mas torna a formulação menos próxima da forma hebraica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem da frase segue de perto o hebraico, mas emprega expressões idiomáticas naturais. “Humilhou-se profundamente” evita uma construção pesada e mantém a forte intensidade penitencial do original.
