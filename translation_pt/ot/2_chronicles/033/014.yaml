base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/014.yaml
  text: After this he built an outer wall for the city of David[a], west of Gihon in the valley, as far as the entrance of the Fish Gate; it went around Ophel, and he made it very high[c][b]. He also placed military commanders in all the fortified cities in Judah.
translation:
  language: pt
  text: Depois disso, ele construiu uma muralha externa para a Cidade de Davi, a oeste de Giom, no vale, até a entrada da Porta dos Peixes[a]. Ele cercou Ofel[b] e a tornou muito alta. Também pôs comandantes militares em todas as cidades fortificadas de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e até a entrada da Porta dos Peixes”. A expressão hebraica pode indicar a extensão da muralha em direção a essa porta.'
    reason: lexical_alternative
  - marker: b
    text: '“Ofel” é o nome de uma área elevada de Jerusalém, provavelmente ao sul do monte do templo. Ou: “contornou Ofel”.'
    reason: cultural_note_and_lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Depois disso
  rationale: Marca naturalmente a sequência temporal da narrativa, sem acrescentar uma relação causal.
- source_word: בָּנָה
  choice: construiu
  rationale: Preserva o sentido básico de construir; o verbo hebraico não exige a ideia mais específica de reconstrução.
- source_word: חוֹמָה חִיצוֹנָה
  choice: uma muralha externa
  rationale: Expressa uma muralha situada na parte exterior e mantém um registro claro e digno.
- source_word: לְעִיר דָּוִיד
  choice: para a Cidade de Davi
  rationale: Entende a preposição como indicando a cidade em benefício ou proteção da qual a muralha foi construída.
- source_word: מַעְרָבָה לְגִיחוֹן בַּנַּחַל
  choice: a oeste de Giom, no vale
  rationale: Conserva a orientação geográfica e traduz נחל de modo acessível, sem excluir o sentido topográfico de vale ou ravina.
- source_word: וְלָבוֹא בְשַׁעַר הַדָּגִים
  choice: até a entrada da Porta dos Peixes
  rationale: Representa de modo natural a extensão espacial da muralha em direção à entrada da porta; a alternativa formal é registrada em nota.
- source_word: וְסָבַב לָעֹפֶל
  choice: A muralha contornava Ofel
  rationale: O verbo admite os sentidos de contornar ou cercar. A muralha é tomada como sujeito contextual, evitando a imagem pouco natural de o construtor pessoalmente dar a volta no local.
- source_word: הָעֹפֶל
  choice: Ofel
  rationale: Mantém como nome geográfico a designação conhecida de uma área elevada de Jerusalém.
- source_word: וַיַּגְבִּיהֶהָ מְאֹד
  choice: ele a tornou muito alta
  rationale: O sufixo feminino retoma a muralha, e מְאֹד é preservado pelo intensificador “muito”.
- source_word: שָׂרֵי חַיִל
  choice: comandantes militares
  rationale: Comunica em português moderno a função dos oficiais, sem recorrer a expressão arcaica ou interpretar חַיִל como referência à virtude pessoal.
- source_word: בְּכָל הֶעָרִים הַבְּצֻרוֹת
  choice: em todas as cidades fortificadas
  rationale: Preserva o sentido distributivo e a condição defensiva das cidades.
