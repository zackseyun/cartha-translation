reference: 2 Chronicles 33:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/תֽוֹעֲבוֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/002.yaml
  text: He did what was evil in the sight of Yahweh[a], according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: pt
  text: Fez o que era mau aos olhos de Yahweh, seguindo as práticas abomináveis das nações que Yahweh havia expulsado de diante dos filhos de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, “os israelitas”. O hebraico diz literalmente “os filhos de Israel”.
    reason: alternativa lexical
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Fez
  rationale: O wayyiqtol de עשה expressa a ação narrativa no passado. Em português, o sujeito oculto é natural porque o referente vem do contexto.
- source_word: הָרַע
  choice: o que era mau
  rationale: O adjetivo com artigo funciona como substantivo. A formulação preserva a avaliação moral do hebraico em português corrente.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Mantém a metáfora avaliativa hebraica de modo claro e tradicional em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico, em vez de substituí-lo por um título.
- source_word: כְּתוֹעֲבוֹת
  choice: seguindo as práticas abomináveis
  rationale: כְּ indica conformidade ou comparação. Esta formulação comunica que ele adotou a conduta detestável das nações, preservando a forte carga cultual e moral de תועבות sem produzir uma expressão pouco natural em português.
- source_word: הַגּוֹיִם
  choice: das nações
  rationale: No contexto, refere-se aos povos não israelitas da terra. “Nações” é claro e não introduz conotações posteriores associadas a “gentios”.
- source_word: הוֹרִישׁ
  choice: havia expulsado
  rationale: No hifil, ירשׁ significa aqui desapossar ou expulsar os habitantes. O mais-que-perfeito explicita naturalmente que essa expulsão precedeu a ação narrada.
- source_word: מִפְּנֵי
  choice: de diante de
  rationale: Preserva de perto o idioma espacial hebraico ligado ao verbo de expulsão.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Reproduz a expressão familiar masculina do hebraico, deixando em nota a alternativa coletiva mais idiomática.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Expressão de gênero בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; o povo de Israel
  rationale: A tradução principal conserva a forma familiar e gramaticalmente masculina do hebraico; a nota oferece a equivalência coletiva corrente sem alterar silenciosamente a expressão fonte.
- issue: Força cultual e moral de תּוֹעֵבוֹת
  choice: práticas abomináveis
  alternative: abominações; práticas detestáveis
  rationale: A escolha mantém a forte condenação do termo e esclarece que se trata das práticas das nações, sem restringir indevidamente seu alcance apenas ao culto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “aos olhos de” preserva o idioma hebraico; “seguindo as práticas abomináveis” evita o pouco natural “segundo as abominações” sem enfraquecer a censura do original.
