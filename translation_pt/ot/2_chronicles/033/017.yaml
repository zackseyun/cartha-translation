  text: אֲבָל֙ ע֣וֹד הָ/עָ֔ם זֹבְחִ֖ים בַּ/בָּמ֑וֹת רַ֖ק לַ/יהוָ֥ה אֱלֹהֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/017.yaml
  text: Nevertheless[a], the people still sacrificed at the high places, but only to Yahweh their God.
translation:
  language: pt
  text: Contudo, o povo ainda oferecia sacrifícios nos lugares altos, mas somente a Yahweh, seu Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲבָל
  choice: Contudo
  rationale: Expressa o contraste adversativo e concessivo com as reformas anteriores, em registro digno e corrente.
- source_word: עוֹד
  choice: ainda
  rationale: Indica a continuação de uma prática apesar das mudanças já realizadas.
- source_word: הָעָם
  choice: o povo
  rationale: Equivalente coletivo natural no contexto narrativo.
- source_word: זֹבְחִים
  choice: oferecia sacrifícios
  rationale: Representa naturalmente o particípio hebraico como prática contínua ou habitual, mantendo a concordância coletiva com 'o povo'.
- source_word: בַּבָּמוֹת
  choice: nos lugares altos
  rationale: Termo bíblico estabelecido para os santuários locais designados por בָּמוֹת; a preposição 'em' é natural em português.
- source_word: רַק
  choice: mas somente
  rationale: 'Preserva a limitação corretiva: o destinatário dos sacrifícios era exclusivamente Yahweh, embora o local de culto continuasse problemático.'
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição marca o destinatário dos sacrifícios, e o nome divino é transliterado como Yahweh.
- source_word: אֱלֹהֵיהֶם
  choice: seu Deus
  rationale: Forma idiomática em português para o substantivo com sufixo pronominal, retomando coletivamente 'o povo'.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Translitera o nome da aliança presente no texto hebraico, em vez de substituí-lo por um título.
- issue: Alcance da limitação introduzida por רַק
  choice: 'Apenas o destinatário dos sacrifícios é limitado: eram oferecidos somente a Yahweh.'
  alternative: Os sacrifícios eram oferecidos apenas em lugares altos dedicados a Yahweh.
  rationale: A ordem sintática hebraica liga 'somente' a 'a Yahweh, seu Deus', preservando a tensão entre a continuidade dos lugares altos e a exclusividade do destinatário do culto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. 'Oferecia sacrifícios' torna explícito o sentido cultual de זבח e comunica uma prática continuada. Não foi necessária nota de rodapé, pois 'Contudo' incorpora adequadamente a alternativa lexical de אֲבָל sem perda relevante de ambiguidade.
