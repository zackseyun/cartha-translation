  text: וַ/יָּ֕שֶׂם אֶת פֶּ֥סֶל הַ/סֶּ֖מֶל אֲשֶׁ֣ר עָשָׂ֑ה בְּ/בֵ֣ית הָ/אֱלֹהִ֗ים אֲשֶׁ֨ר אָמַ֤ר אֱלֹהִים֙ אֶל דָּוִיד֙ וְ/אֶל שְׁלֹמֹ֣ה בְנ֔/וֹ בַּ/בַּ֨יִת הַ/זֶּ֜ה וּ/בִֽ/ירוּשָׁלִַ֗ם אֲשֶׁ֤ר בָּחַ֨רְתִּי֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל אָשִׂ֥ים אֶת שְׁמִ֖/י לְ/עֵילֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/007.yaml
  text: He put the carved image[a], the idol that he had made, in the house of God, of which God had said to David and to Solomon his son, “In this house and in Jerusalem, which I have chosen out of all the tribes of Israel, I will put my name forever.”
translation:
  language: pt
  text: 'Ele colocou a imagem esculpida[a], o ídolo que havia feito, na casa de Deus, a respeito da qual Deus tinha dito a Davi e a seu filho Salomão: “Nesta casa e em Jerusalém, que escolhi dentre todas as tribos de Israel, colocarei o meu nome para sempre.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a imagem esculpida do ídolo”; o hebraico emprega dois termos estreitamente relacionados para uma estátua idólatra.'
    reason: Alternativa lexical que preserva a possível relação sintática entre os dois substantivos hebraicos.
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Ele colocou
  rationale: O verbo שׂים, na forma narrativa, indica pôr ou colocar; “colocou” é natural, claro e digno em português.
- source_word: פֶּסֶל הַסֶּמֶל
  choice: a imagem esculpida, o ídolo
  rationale: A formulação mantém visíveis os dois substantivos hebraicos estreitamente relacionados, tratando o segundo como aposto, sem reduzir ambos a um único termo.
- source_word: אֲשֶׁר עָשָׂה
  choice: que havia feito
  rationale: O mais-que-perfeito composto exprime naturalmente que a fabricação precedeu a colocação.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: na casa de Deus
  rationale: Preserva o sentido concreto de בַּיִת e a repetição de “casa” na declaração seguinte, sem substituir o termo por “templo”.
- source_word: אֲשֶׁר אָמַר אֱלֹהִים
  choice: sobre a qual Deus tinha dito
  rationale: Liga a oração relativa à casa de Deus e introduz a declaração divina de modo natural.
- source_word: אֶל דָּוִיד וְאֶל שְׁלֹמֹה בְנוֹ
  choice: a Davi e a seu filho Salomão
  rationale: Identifica claramente Salomão como filho de Davi, preservando os dois destinatários.
- source_word: בַּבַּיִת הַזֶּה וּבִירוּשָׁלַם
  choice: Nesta casa e em Jerusalém
  rationale: Mantém a associação locativa entre a casa e a cidade e conserva a repetição lexical de בַּיִת.
- source_word: אֲשֶׁר בָּחַרְתִּי מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: que escolhi dentre todas as tribos de Israel
  rationale: “Dentre” comunica de modo conciso a escolha feita do conjunto das tribos de Israel.
- source_word: אָשִׂים אֶת שְׁמִי
  choice: colocarei o meu nome
  rationale: Preserva a imagem teológica concreta de Deus colocar seu nome, sem explicá-la por paráfrase.
- source_word: לְעֵילֹום
  choice: para sempre
  rationale: Equivalente corrente e fiel para a expressão hebraica de duração indefinida ou perpétua neste contexto.
theological_decisions:
- issue: Uso do título divino
  choice: Deus
  alternative: o SENHOR
  rationale: O texto hebraico emprega אֱלֹהִים, não o nome divino יהוה; por isso, traduz-se pelo título correspondente.
- issue: Expressão da teologia do nome e do templo
  choice: colocarei o meu nome para sempre
  alternative: farei o meu nome habitar para sempre
  rationale: A tradução conserva a formulação hebraica de colocar o nome, sem resolver ou ampliar sua força teológica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil; registro digno, com sintaxe clara e preservação do motivo repetido da “casa” e da ambiguidade lexical da expressão referente ao ídolo.
