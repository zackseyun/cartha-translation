source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה כַּ/אֲשֶׁ֥ר עָשָׂ֖ה מְנַשֶּׁ֣ה אָבִ֑י/ו וּֽ/לְ/כָל הַ/פְּסִילִ֗ים אֲשֶׁ֤ר עָשָׂה֙ מְנַשֶּׁ֣ה אָבִ֔י/ו זִבַּ֥ח אָמ֖וֹן וַ/יַּֽעַבְדֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/022.yaml
  text: He did what was evil in the sight of Yahweh[a], just as Manasseh his father had done[b]. Amon sacrificed to all the carved images that Manasseh his father had made and served them.
translation:
  language: pt
  text: Ele fez o que era mau aos olhos de Yahweh, assim como seu pai Manassés havia feito. Amom ofereceu sacrifícios a todas as imagens esculpidas[a] que seu pai Manassés havia feito e as serviu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ídolos”. O hebraico se refere especificamente a imagens esculpidas ou entalhadas.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “prestou culto a elas”. O verbo hebraico significa literalmente “servir” e é usado muitas vezes para o serviço religioso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: fez o que era mau
  rationale: Reproduz naturalmente o idioma hebraico עשה + הרע e mantém seu sentido de avaliação moral.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Preserva a imagem do idioma hebraico e comunica com clareza a avaliação divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: assim como ... havia feito
  rationale: Expressa a comparação e deixa clara, em português narrativo, a anterioridade da conduta de Manassés.
- source_word: מְנַשֶּׁה אָבִיו
  choice: seu pai Manassés
  rationale: Mantém a relação de parentesco e produz uma ordem natural em português.
- source_word: הַפְּסִילִים
  choice: imagens esculpidas
  rationale: Conserva o sentido concreto de imagens feitas por entalhe ou escultura, sem generalizá-las simplesmente como ídolos.
- source_word: זִבַּח
  choice: ofereceu sacrifícios a
  rationale: Explicita de modo idiomático o sentido cultual do verbo hebraico.
- source_word: וַיַּעַבְדֵם
  choice: e as serviu
  rationale: Mantém o sentido lexical de עבד; no contexto de imagens e sacrifícios, o serviço é claramente religioso, sem substituir o termo por uma interpretação mais específica.
- source_word: אָמֹון
  choice: Amom
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido religioso de עבד aplicado às imagens
  choice: as serviu
  alternative: prestou culto a elas; adorou-as
  rationale: A tradução conserva o sentido básico de serviço, enquanto o contexto cultual comunica que se trata de devoção religiosa e permite que a tensão lexical permaneça visível.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural para o público brasileiro e compreensão internacional. A estrutura evita arcaísmos, preserva a imagem hebraica “aos olhos de” e mantém “serviu” para refletir a amplitude lexical do original.
