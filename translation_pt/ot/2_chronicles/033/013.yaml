base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/013.yaml
  text: He prayed to him[a], and he was moved by his entreaty, heard his supplication, and brought him back to Jerusalem to his kingdom[c][b]. Then Manasseh knew that Yahweh is God.
translation:
  language: pt
  text: Ele orou a Deus, e Deus atendeu ao seu pedido[a], ouviu sua súplica e o trouxe de volta a Jerusalém, ao seu reinado[b]. Então Manassés soube que Yahweh é Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deus se deixou rogar por ele” ou “Deus respondeu favoravelmente a ele”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “ao seu reino”, isto é, ao seu governo ou poder real.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל אֵלָיו
  choice: Ele orou a Deus
  rationale: O hitpael de התפלל significa normalmente “orar”. A explicitação de “Deus”, referente de אֵלָיו no contexto, evita uma sequência ambígua de pronomes em português sem alterar o sentido.
- source_word: וַיֵּעָתֶר לוֹ
  choice: Deus atendeu ao seu pedido
  rationale: O nifal de עתר indica que Deus se deixou suplicar ou respondeu favoravelmente à petição. “Atendeu ao seu pedido” comunica essa resposta favorável em português natural.
- source_word: וַיִּשְׁמַע תְּחִנָּתוֹ
  choice: ouviu sua súplica
  rationale: תחנה designa uma petição insistente por favor ou misericórdia. “Súplica” conserva a gravidade e o contexto de oração.
- source_word: וַיְשִׁיבֵהוּ יְרוּשָׁלַםִ לְמַלְכוּתוֹ
  choice: o trouxe de volta a Jerusalém, ao seu reinado
  rationale: O hifil de שוב significa “fazer voltar” ou “trazer de volta”. מלכותו, neste contexto, aponta para o governo régio de Manassés; “reinado” evita que “reino” seja entendido apenas como território.
- source_word: וַיֵּדַע מְנַשֶּׁה
  choice: Então Manassés soube
  rationale: ידע significa “saber, conhecer”. “Então” expressa com naturalidade a progressão e a consequência narrativa do waw consecutivo.
- source_word: כִּי יְהוָה הוּא הָאֱלֹהִים
  choice: que Yahweh é Deus
  rationale: A formulação conserva o nome divino e a afirmação direta do hebraico. O pronome enfático הוּא é transmitido pelo caráter categórico da frase, sem a construção pouco natural “ele é”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o Tetragrama. “Yahweh” preserva o nome pactual sem substituí-lo por um título.
- issue: Alcance da confissão כִּי יְהוָה הוּא הָאֱלֹהִים
  choice: Yahweh é Deus
  alternative: Yahweh é o único Deus
  rationale: A frase afirma enfaticamente que Yahweh é Deus, mas não contém uma palavra correspondente a “único” ou “somente”. Não se acrescenta essa exclusividade à redação, preservando a formulação do texto.
translation_notes:
  register: Português atual, digno e de leitura ampla, com explicitação moderada dos referentes pronominais para evitar ambiguidade. A sequência dos três atos divinos — atender, ouvir e trazer de volta — mantém o paralelismo narrativo do hebraico.
