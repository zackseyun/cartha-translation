id: 2CH.14.5
reference: 2 Chronicles 14:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּ֛בֶן עָרֵ֥י מְצוּרָ֖ה בִּ/יהוּדָ֑ה כִּֽי שָׁקְטָ֣ה הָ/אָ֗רֶץ וְ/אֵין עִמּ֤/וֹ מִלְחָמָה֙ בַּ/שָּׁנִ֣ים הָ/אֵ֔לֶּה כִּֽי הֵנִ֥יחַ יְהוָ֖ה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/005.yaml
  text: He built fortified cities in Judah[a], because the land was quiet and there was no war with him in those years, because Yahweh gave him rest.
translation:
  language: pt
  text: Ele construiu cidades fortificadas em Judá, pois a terra estava tranquila, e naqueles anos não houve guerra contra ele[a], porque Yahweh lhe deu descanso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não houve guerra que o envolvesse”. A expressão hebraica pode indicar, de modo mais geral, a ausência de guerra envolvendo Asa.'
    reason: Alternativa lexical para a expressão וְאֵין עִמּוֹ מִלְחָמָה, cuja construção pode ser entendida como guerra contra Asa ou guerra que o envolvesse.
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Ele construiu
  rationale: O wayyiqtol de בנה dá continuidade à narrativa e descreve a ação passada de Asa; em português, a conjunção inicial pode ser omitida com naturalidade.
- source_word: עָרֵי מְצוּרָה
  choice: cidades fortificadas
  rationale: A construção hebraica indica cidades dotadas de fortificações; esta é a formulação portuguesa mais natural e precisa.
- source_word: בִּיהוּדָה
  choice: em Judá
  rationale: A preposição tem sentido locativo diante do nome do território.
- source_word: כִּי שָׁקְטָה הָאָרֶץ
  choice: pois a terra estava tranquila
  rationale: שׁקט descreve tranquilidade e ausência de perturbação; “estava tranquila” preserva a imagem sem antecipar completamente o motivo do descanso expresso no fim.
- source_word: וְאֵין עִמּוֹ מִלְחָמָה
  choice: não houve guerra contra ele
  rationale: A expressão indica que Asa não enfrentou guerra durante esse período. A nota preserva o sentido mais geral possível da construção com עִם.
- source_word: בַּשָּׁנִים הָאֵלֶּה
  choice: naqueles anos
  rationale: Expressão temporal natural em narrativa histórica portuguesa.
- source_word: הֵנִיחַ ... לוֹ
  choice: lhe deu descanso
  rationale: O hifil de נוח significa fazer descansar ou conceder alívio, especialmente da guerra; a formulação preserva o motivo teológico do descanso concedido por Deus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
- issue: Agente do descanso de Asa
  choice: porque Yahweh lhe deu descanso
  alternative: porque ele teve descanso da parte de Yahweh
  rationale: O hifil הֵנִיחַ apresenta Yahweh como aquele que causa ou concede o descanso; a tradução mantém explicitamente essa agência divina.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade no Brasil e compreensão internacional. “Terra estava tranquila” mantém a imagem hebraica, enquanto “lhe deu descanso” conserva o motivo bíblico do repouso concedido por Deus.
