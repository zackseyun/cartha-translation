id: 2CH.14.1
reference: 2 Chronicles 14:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ אָסָא֙ הַ/טּ֣וֹב וְ/הַ/יָּשָׁ֔ר בְּ/עֵינֵ֖י יְהוָ֥ה אֱלֹהָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/001.yaml
  text: Asa did what was good and right in the eyes of Yahweh his God[a].
translation:
  language: pt
  text: Asa fez o que era bom e correto aos olhos de Yahweh, seu Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica “aos olhos de Yahweh” significa “segundo a perspectiva ou avaliação de Yahweh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fez
  rationale: Neste contexto de avaliação da conduta, עשה significa praticar ou fazer; “fez” introduz naturalmente a expressão “o que era bom e correto”.
- source_word: אָסָא
  choice: Asa
  rationale: Transliteração tradicional e amplamente reconhecida do nome pessoal em português.
- source_word: הַטּוֹב
  choice: o que era bom
  rationale: O adjetivo substantivado, em paralelo com הַיָּשָׁר e como objeto de עשה, descreve a conduta moral de Asa; esta formulação é natural em português.
- source_word: וְהַיָּשָׁר
  choice: e correto
  rationale: יָשָׁר, em contexto ético, indica aquilo que é reto ou correto. “Correto” mantém a avaliação moral e forma um par claro com “bom”.
- source_word: בְּעֵינֵי
  choice: aos olhos de
  rationale: Preserva a metáfora hebraica transparente que expressa perspectiva e avaliação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהָיו
  choice: seu Deus
  rationale: Embora אֱלֹהִים tenha forma plural, aqui se refere ao Deus de Israel e recebe sentido singular; o sufixo indica “dele”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo pelo título tradicional.
- issue: Sentido de אֱלֹהָיו
  choice: seu Deus
  alternative: seus deuses
  rationale: O referente é Yahweh e a construção tem sentido singular inequívoco neste contexto, apesar da forma morfológica de אֱלֹהִים.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A construção preserva o paralelismo moral “bom e correto” e mantém, com explicação em nota, a metáfora hebraica “aos olhos de”.
