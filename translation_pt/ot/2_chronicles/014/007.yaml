  text: וַ/יְהִ֣י לְ/אָסָ֗א חַיִל֮ נֹשֵׂ֣א צִנָּ֣ה וָ/רֹמַח֒ מִֽ/יהוּדָה֙ שְׁלֹ֣שׁ מֵא֣וֹת אֶ֔לֶף וּ/מִ/בִּנְיָמִ֗ן נֹשְׂאֵ֤י מָגֵן֙ וְ/דֹ֣רְכֵי קֶ֔שֶׁת מָאתַ֥יִם וּ/שְׁמוֹנִ֖ים אָ֑לֶף כָּל אֵ֖לֶּה גִּבּ֥וֹרֵי חָֽיִלס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/007.yaml
  text: And Asa had an army of three hundred thousand from Judah bearing large shields and spears[a], and from Benjamin two hundred eighty thousand bearing shields and drawing bows. All these were mighty men of valor.
translation:
  language: pt
  text: Asa tinha um exército de trezentos mil homens de Judá que portavam escudos grandes e lanças, e de duzentos e oitenta mil homens de Benjamim que portavam escudos e manejavam arcos. Todos eles eram guerreiros valentes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַיִל
  choice: exército
  rationale: Neste contexto de enumeração militar, designa o conjunto das forças de Asa, e não riqueza ou valor abstrato.
- source_word: נֹשֵׂא צִנָּה וָרֹמַח
  choice: armados com escudos grandes e lanças
  rationale: Expressa naturalmente que as tropas portavam esse equipamento; “escudos grandes” preserva a distinção entre צִנָּה e o escudo מָגֵן mencionado depois.
- source_word: מִיהוּדָה / מִבִּנְיָמִן
  choice: de Judá / de Benjamim
  rationale: Indica a origem tribal dos contingentes em português natural.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף / מָאתַיִם וּשְׁמוֹנִים אָלֶף
  choice: trezentos mil / duzentos e oitenta mil
  rationale: Tradução direta dos números cardinais.
- source_word: נֹשְׂאֵי מָגֵן וְדֹרְכֵי קֶשֶׁת
  choice: armados com escudos e arcos
  rationale: O primeiro termo indica os que portavam escudos; a expressão idiomática relativa ao arco descreve arqueiros. A formulação conjunta evita a impressão pouco natural de que os soldados apenas transportavam os arcos.
- source_word: כָּל אֵלֶּה
  choice: Todos eles
  rationale: Retoma naturalmente, em português, os homens dos dois contingentes.
- source_word: גִּבּוֹרֵי חָיִל
  choice: guerreiros valentes
  rationale: A expressão militar convencional descreve combatentes fortes e valorosos; esta tradução é clara, digna e atual.
theological_decisions:
- issue: Expressão militar masculina גִּבּוֹרֵי חָיִל
  choice: guerreiros valentes
  alternative: homens valentes; homens poderosos de valor
  rationale: O contexto é um recenseamento de combatentes do antigo exército. “Guerreiros” mantém a referência pessoal e militar sem introduzir uma afirmação doutrinária alheia ao texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Armados com” comunica equipamento militar de modo mais natural que uma reprodução rígida dos particípios hebraicos. Não há notas, portanto não se usam marcadores no texto.
