base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/009.yaml
  text: And Asa went out before him[b][a], and they drew up for battle in the Valley of Zephathah at Mareshah.
translation:
  language: pt
  text: Asa saiu ao encontro dele[a], e eles se posicionaram para a batalha[b] no vale de Zefatá, junto a Maressa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “diante dele”; também pode ser traduzido como “contra ele”.
    reason: lexical_alternative
  - marker: b
    text: Ou “dispuseram as tropas em formação de batalha”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: O verbo יצא, nesta forma narrativa, significa normalmente “sair” e pode ter nuance militar. “Saiu” preserva de modo natural o movimento narrado sem explicitar além do hebraico.
- source_word: לְפָנָיו
  choice: ao encontro dele
  rationale: A expressão significa literalmente “diante dele”, mas, neste contexto militar, indica que Asa saiu para se defrontar com o adversário. “Ao encontro dele” comunica essa relação em português corrente, enquanto a forma literal fica registrada em nota.
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: eles se posicionaram para a batalha
  rationale: ערך com מלחמה descreve a disposição das forças para o combate. A formulação é clara, atual e mantém o sentido de formação militar.
- source_word: בְּגֵיא
  choice: no vale de
  rationale: גיא designa um vale ou desfiladeiro; “vale” é a opção mais comum e acessível em português.
- source_word: צְפַתָה
  choice: Zefatá
  rationale: Nome geográfico transliterado em forma compatível com convenções correntes do português.
- source_word: לְמָרֵשָׁה
  choice: junto a Maressa
  rationale: A preposição ל־ relaciona o vale com Maressa e pode indicar localização ou proximidade. “Junto a” mantém essa elasticidade melhor do que afirmar que o vale ficava dentro da cidade.
