  text: וַ/יָּ֛סַר אֶת מִזְבְּח֥וֹת הַ/נֵּכָ֖ר וְ/הַ/בָּמ֑וֹת וַ/יְשַׁבֵּר֙ אֶת הַ/מַּצֵּב֔וֹת וַ/יְגַדַּ֖ע אֶת הָ/אֲשֵׁרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/002.yaml
  text: He removed the foreign altars and the high places[a], shattered the sacred pillars, and cut down the Asherim.
translation:
  language: pt
  text: Removeu os altares estrangeiros e os lugares altos, quebrou as colunas sagradas e cortou os aserins[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os postes de Aserá”. O termo hebraico se refere a objetos de culto associados à adoração de Aserá.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: Removeu
  rationale: O hifil de סור expressa fazer desaparecer ou retirar. “Removeu” é natural e mantém o caráter concreto da reforma.
- source_word: מִזְבְּחוֹת הַנֵּכָר
  choice: os altares estrangeiros
  rationale: נֵכָר indica aquilo que é estrangeiro ou alheio e, neste contexto, altares ligados a um culto não israelita ou ilegítimo; a formulação concisa preserva essa associação sem afirmar que pertenciam simplesmente a pessoas estrangeiras.
- source_word: הַבָּמוֹת
  choice: os lugares altos
  rationale: בָּמוֹת é o termo habitual para locais de culto, muitas vezes elevados. “Lugares altos” conserva a designação histórica reconhecida e permanece compreensível em português bíblico atual.
- source_word: וַיְשַׁבֵּר
  choice: quebrou
  rationale: שׁבר comunica destruição mediante quebra. “Quebrou” é direto e vigoroso, sem acrescentar detalhes ausentes do hebraico.
- source_word: הַמַּצֵּבוֹת
  choice: as colunas sagradas
  rationale: מַצֵּבוֹת designa pedras erigidas com função cultual. “Colunas sagradas” explicita essa função religiosa de modo conciso.
- source_word: וַיְגַדַּע
  choice: cortou
  rationale: גדע significa cortar ou decepar e se ajusta à provável natureza vegetal ou de madeira desses objetos cultuais.
- source_word: הָאֲשֵׁרִים
  choice: os aserins
  rationale: A forma transliterada e aportuguesada preserva o termo cultual hebraico e sua ambiguidade, sem decidir se eram especificamente postes, árvores estilizadas ou outros símbolos associados a Aserá.
theological_decisions:
- issue: Sentido de הָאֲשֵׁרִים no contexto da eliminação de objetos de culto
  choice: os aserins
  alternative: os postes de Aserá
  rationale: O termo indica objetos cultuais associados a Aserá, mas sua forma exata é incerta. A transliteração evita restringir indevidamente o referente; a nota apresenta a interpretação comum.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa direta. Mantém os termos históricos “lugares altos” e “aserins”; este último recebe explicação em nota para preservar a precisão e a ambiguidade do hebraico.
