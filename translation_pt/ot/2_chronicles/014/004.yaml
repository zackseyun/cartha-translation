  text: וַ/יָּ֨סַר֙ מִ/כָּל עָרֵ֣י יְהוּדָ֔ה אֶת הַ/בָּמ֖וֹת וְ/אֶת הַֽ/חַמָּנִ֑ים וַ/תִּשְׁקֹ֥ט הַ/מַּמְלָכָ֖ה לְ/פָנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/004.yaml
  text: He removed the high places and the incense altars from all the cities of Judah[a], and the kingdom had rest before him.
translation:
  language: pt
  text: Ele retirou de todas as cidades de Judá os lugares altos e os altares de incenso[a], e o reino teve paz sob o seu governo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “as colunas solares”. O termo hebraico designa objetos cultuais e, em alguns contextos, pode estar associado ao culto solar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: retirou
  rationale: O hifil de סור indica fazer com que algo seja removido; “retirou” expressa a ação concreta sem acrescentar a ideia formal de abolição.
- source_word: מִכָּל עָרֵי יְהוּדָה
  choice: de todas as cidades de Judá
  rationale: Reproduz de modo natural o alcance geográfico indicado por מן, כל e a cadeia construta.
- source_word: הַבָּמוֹת
  choice: os lugares altos
  rationale: Expressão bíblica consagrada e transparente para locais de culto elevados, sem reduzi-los genericamente a “santuários”.
- source_word: הַחַמָּנִים
  choice: os altares de incenso
  rationale: Oferece uma leitura plausível e compreensível para estes objetos cultuais, mantendo em nota a possibilidade de associação com o culto solar.
- source_word: וַתִּשְׁקֹט
  choice: teve paz
  rationale: שקט descreve tranquilidade e ausência de perturbação; “teve paz” é idiomático em português e se ajusta ao tema de repouso nacional em Crônicas.
- source_word: הַמַּמְלָכָה
  choice: o reino
  rationale: Equivalente direto e corrente de מַמְלָכָה neste contexto político.
- source_word: לְפָנָיו
  choice: sob o seu governo
  rationale: A expressão literal “diante dele” tem aqui sentido temporal e régio, isto é, durante o governo de Asa; a formulação idiomática evita em português uma expressão opaca ou equivocada.
theological_decisions:
- issue: Natureza dos objetos removidos na reforma de Asa
  choice: Apresentar בָּמוֹת e חַמָּנִים como instalações cultuais concretas, sem especificar além do que o hebraico permite.
  alternative: Entender חַמָּנִים especificamente como colunas solares ou imagens ligadas ao sol.
  rationale: O texto relata a remoção de locais e objetos cultuais, mas a função precisa de חַמָּנִים é discutida; a nota preserva essa incerteza sem impor uma identificação religiosa excessivamente específica.
- issue: Sentido de לְפָנָיו
  choice: Traduzir idiomaticamente como “sob o seu governo”.
  alternative: Conservar a forma literal “diante dele”.
  rationale: Neste relato régio, a expressão provavelmente indica que o reino desfrutou tranquilidade durante o governo de Asa. A tradução idiomática comunica esse sentido provável sem atribuir explicitamente a paz a uma causa não declarada no versículo.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. Mantém “lugares altos” como termo histórico-religioso reconhecível e explica em nota a incerteza lexical de חַמָּנִים.
