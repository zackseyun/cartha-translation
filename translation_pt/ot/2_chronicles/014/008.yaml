  text: וַ/יֵּצֵ֨א אֲלֵי/הֶ֜ם זֶ֣רַח הַ/כּוּשִׁ֗י בְּ/חַ֨יִל֙ אֶ֣לֶף אֲלָפִ֔ים וּ/מַרְכָּב֖וֹת שְׁלֹ֣שׁ מֵא֑וֹת וַ/יָּבֹ֖א עַד מָרֵשָֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/008.yaml
  text: Zerah the Cushite came out against them with an army of a thousand thousands and three hundred chariots[b][a], and he came as far as Mareshah.
translation:
  language: pt
  text: Zerá, o cuxita[a], saiu contra eles com um exército de mil milhares[b] e trezentos carros de guerra, e chegou até Maressa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Cuxita” é o termo etnogeográfico hebraico; tradicionalmente, “etíope”.
    reason: lexical_alternative
  - marker: b
    text: Ou “um milhão”. O hebraico diz literalmente “mil milhares”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא אֲלֵיהֶם
  choice: saiu contra eles
  rationale: Em contexto militar, יָצָא seguido de אֶל indica uma saída ou avanço hostil. A formulação preserva o movimento expresso no hebraico e explicita naturalmente seu sentido bélico.
- source_word: זֶרַח הַכּוּשִׁי
  choice: Zerá, o cuxita
  rationale: Zerá segue a forma tradicional e inteligível do nome em português. “Cuxita” preserva o termo etnogeográfico hebraico כּוּשִׁי sem identificá-lo de modo simplista com a Etiópia moderna.
- source_word: בְּחַיִל
  choice: com um exército
  rationale: Neste contexto, חַיִל designa uma força militar; “exército” é a opção mais clara e natural em português.
- source_word: אֶלֶף אֲלָפִים
  choice: mil milhares
  rationale: A expressão reproduz de perto a forma incomum do hebraico e evita decidir silenciosamente se ela deve ser entendida como o número aritmético exato de um milhão ou como uma expressão convencional de grandeza.
- source_word: וּמַרְכָּבוֹת שְׁלֹשׁ מֵאוֹת
  choice: e trezentos carros de guerra
  rationale: “Carros de guerra” esclarece o sentido militar de מַרְכָּבוֹת no português atual.
- source_word: וַיָּבֹא עַד מָרֵשָׁה
  choice: e chegou até Maressa
  rationale: “Chegou até” expressa naturalmente o movimento até o limite ou destino marcado por עַד, sem eliminar sua nuance.
theological_decisions: []
