source:
  edition: WLC
  text: וַ/יִּקְרָ֨א אָסָ֜א אֶל יְהוָ֣ה אֱלֹהָי/ו֮ וַ/יֹּאמַר֒ יְהוָ֗ה אֵֽין עִמְּ/ךָ֤ לַ/עְזוֹר֙ בֵּ֥ין רַב֙ לְ/אֵ֣ין כֹּ֔חַ עָזְרֵ֜/נוּ יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ כִּֽי עָלֶ֣י/ךָ נִשְׁעַ֔נּוּ וּ/בְ/שִׁמְ/ךָ֣ בָ֔אנוּ עַל הֶ/הָמ֖וֹן הַ/זֶּ֑ה יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ אַ֔תָּה אַל יַעְצֹ֥ר עִמְּ/ךָ֖ אֱנֽוֹשׁ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/010.yaml
  text: And Asa cried out to Yahweh his God and said[a], “Yahweh, there is none besides you to help between the mighty and the powerless. Help us, Yahweh our God, for we rely on you, and in your name we have come against this multitude. Yahweh our God, you are our God[b]; do not let man prevail against you.”
translation:
  language: pt
  text: 'Então Asa clamou a Yahweh, seu Deus, e disse: “Yahweh, não há ninguém além de ti que possa socorrer tanto o poderoso como o que não tem força.[a] Ajuda-nos, Yahweh, nosso Deus, pois confiamos em ti e, em teu nome, viemos contra esta multidão. Yahweh, nosso Deus, tu não permitas que o homem mortal prevaleça contra ti.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para ti não faz diferença ajudar o poderoso ou o que não tem força”; ou: “ninguém além de ti pode ajudar, seja com muitos, seja com os que não têm força”. O hebraico desta frase é conciso e pode enfatizar número ou força.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “não permitas que o homem mortal resista a ti”; literalmente, também pode sugerir: “não permitas que o homem mortal conserve força diante de ti”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: clamou
  rationale: No contexto de oração dirigida a Deus, קרא אל expressa um clamor urgente; “clamou” é natural, digno e mais forte que apenas “chamou”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהָיו / אֱלֹהֵינוּ
  choice: seu Deus / nosso Deus
  rationale: Preserva diretamente as construções possessivas e a linguagem relacional da oração.
- source_word: אֵין עִמְּךָ לַעְזוֹר
  choice: além de ti não há quem possa ajudar
  rationale: Expressa de modo claro a exclusividade do auxílio divino, uma leitura provável da construção hebraica difícil.
- source_word: בֵּין רַב לְאֵין כֹּחַ
  choice: entre o poderoso e o que não tem força
  rationale: Mantém a polaridade do hebraico sem decidir de forma excessiva se רַב enfatiza grande número ou grande força.
- source_word: עָזְרֵנוּ
  choice: Ajuda-nos
  rationale: Reproduz de modo direto e natural o imperativo com sufixo da primeira pessoa do plural.
- source_word: כִּי עָלֶיךָ נִשְׁעַנּוּ
  choice: pois confiamos em ti
  rationale: Comunica naturalmente em português a metáfora hebraica de apoiar-se em alguém.
- source_word: וּבְשִׁמְךָ בָאנוּ
  choice: em teu nome, viemos
  rationale: Preserva o idioma bíblico de agir sob a autoridade e em dependência de Deus.
- source_word: הֶהָמוֹן הַזֶּה
  choice: esta multidão
  rationale: הָמוֹן designa uma grande massa de pessoas; “multidão” é exato e adequado ao contexto militar.
- source_word: אַל יַעְצֹר עִמְּךָ אֱנוֹשׁ
  choice: não permitas que o homem mortal prevaleça contra ti
  rationale: No contexto da batalha, “prevaleça contra ti” comunica a provável ideia de resistir ou conservar força diante de Deus; “homem mortal” explicita a fragilidade inerente a אֱנוֹשׁ.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR / Jeová
  rationale: O texto traz explicitamente o tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido de אֵין עִמְּךָ לַעְזוֹר בֵּין רַב לְאֵין כֹּחַ
  choice: além de ti não há quem possa ajudar entre o poderoso e o que não tem força
  alternative: para ti não faz diferença ajudar o poderoso ou o que não tem força / ninguém além de ti pode ajudar, seja com muitos, seja com os que não têm força
  rationale: A sintaxe hebraica é compacta e ambígua. O texto principal segue a leitura de exclusividade do auxílio divino, enquanto a nota conserva leituras que enfatizam números, força ou a imparcial capacidade de Deus para ajudar.
- issue: Sentido de אַל יַעְצֹר עִמְּךָ אֱנוֹשׁ
  choice: não permitas que o homem mortal prevaleça contra ti
  alternative: não permitas que o homem mortal resista a ti / conserve força diante de ti
  rationale: O verbo עצר admite dificuldade lexical neste contexto. A escolha se ajusta à oração antes da batalha sem apagar as alternativas possíveis, registradas em nota.
- issue: Referente de אַתָּה após “Yahweh, nosso Deus”
  choice: tu és o nosso Deus
  alternative: tu
  rationale: O hebraico traz literalmente “Yahweh, nosso Deus, tu”; a formulação portuguesa explicita a predicação sugerida pelo encadeamento, mas evita criar nota separada porque o principal problema textual na cláusula está no verbo seguinte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se a concisão e a urgência da oração. “Yahweh” preserva o nome divino; “homem mortal” representa o singular genérico אֱנוֹשׁ e sua ênfase na fragilidade humana. Todas as ambiguidades substanciais foram conservadas em notas.
