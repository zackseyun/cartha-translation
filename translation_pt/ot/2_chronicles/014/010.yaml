revisions:
- from: 'Então Asa clamou a Yahweh, seu Deus, e disse: “Yahweh, além de ti não há quem possa ajudar entre o poderoso e o que não tem força.[a] Ajuda-nos, Yahweh, nosso Deus, pois confiamos em ti e, em teu nome, viemos contra esta multidão. Yahweh, tu és o nosso Deus; não permitas que o homem mortal prevaleça contra ti”.[b]'
  to: 'Então Asa clamou a Yahweh, seu Deus, e disse: “Yahweh, não há ninguém além de ti que possa socorrer tanto o poderoso como o que não tem força.[a] Ajuda-nos, Yahweh, nosso Deus, pois confiamos em ti e, em teu nome, viemos contra esta multidão. Yahweh, nosso Deus, tu não permitas que o homem mortal prevaleça contra ti.[b]”'
  rationale: A revisão corrige a formulação opaca da cláusula ambígua sobre auxílio, sem eliminar suas possibilidades interpretativas, que permanecem registradas na nota. Também restitui a função do pronome enfático hebraico אַתָּה como sujeito da petição subsequente, em vez de criar a declaração “tu és o nosso Deus”. As notas preservam as ambiguidades textuais relevantes, e a âncora [b] passa a acompanhar a cláusula lexicalmente discutida.
