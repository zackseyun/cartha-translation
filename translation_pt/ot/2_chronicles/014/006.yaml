  naturalness: A tradução é clara e de registro apropriado. Contudo, «cercá-las de muralhas e torres, portões e trancas» faz os «portões e trancas» parecerem elementos que circundam as cidades, o que soa ligeiramente desajeitado em português. «Com» permite ler toda a série como elementos de fortificação, de modo mais natural.
  terminology: «Muralhas», «torres», «portões» e «trancas» são escolhas acessíveis e adequadas ao contexto defensivo. «Yahweh» está consistente com a política indicada.
