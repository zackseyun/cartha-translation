source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר לִֽ/יהוּדָ֜ה נִבְנֶ֣ה אֶת הֶ/עָרִ֣ים הָ/אֵ֗לֶּה וְ/נָסֵ֨ב חוֹמָ֣ה וּ/מִגְדָּלִים֮ דְּלָתַ֣יִם וּ/בְרִיחִים֒ עוֹדֶ֨/נּוּ הָ/אָ֜רֶץ לְ/פָנֵ֗י/נוּ כִּ֤י דָרַ֨שְׁנוּ֙ אֶת יְהוָ֣ה אֱלֹהֵ֔י/נוּ דָּרַ֕שְׁנוּ וַ/יָּ֥נַֽח לָ֖/נוּ מִ/סָּבִ֑יב וַ/יִּבְנ֖וּ וַ/יַּצְלִֽיחוּ׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/006.yaml
  text: And he said to Judah[a], “Let us build these cities and surround them with walls and towers, gates and bars, while the land is still before us, because we have sought Yahweh our God. We have sought him, and he has given us rest on every side.” So they built and prospered.
translation:
  language: pt
  text: 'Ele disse a Judá: “Vamos construir estas cidades e cercá-las com muralhas e torres, portões e trancas, enquanto a terra ainda está diante de nós,[a] pois buscamos Yahweh, nosso Deus. Nós o buscamos, e ele nos deu descanso por todos os lados.” Assim, eles construíram e prosperaram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois a terra ainda está diante de nós”. A expressão pode indicar que a oportunidade continuava aberta ou que o território permanecia desimpedido diante deles.'
    reason: A construção hebraica permite que a oração seja entendida com nuance temporal («enquanto») ou causal («pois»), e o idioma «diante de nós» não especifica exatamente em que sentido a terra estava disponível.
lexical_decisions:
- source_word: וַיֹּאמֶר לִיהוּדָה
  choice: Ele disse a Judá
  rationale: Mantém a forma metonímica do hebraico, em que “Judá” representa o reino ou seu povo, sem tornar explícito no texto o que permanece implícito na fonte.
- source_word: נִבְנֶה
  choice: Vamos construir
  rationale: O coortativo na primeira pessoa do plural expressa exortação ou resolução conjunta. “Vamos construir” comunica essa força de modo natural em português, sem sugerir reconstrução.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: estas cidades
  rationale: עָרִים designa assentamentos urbanos e, neste contexto de fortificações, “cidades” é a escolha mais adequada.
- source_word: וְנָסֵב
  choice: e cercá-las de
  rationale: O hifil de סבב significa envolver ou circundar. A formulação liga naturalmente o verbo aos elementos defensivos que seguem.
- source_word: חוֹמָה וּמִגְדָּלִים דְּלָתַיִם וּבְרִיחִים
  choice: muralhas e torres, portões e trancas
  rationale: A lista descreve fortificações urbanas. “Muralhas” funciona idiomaticamente como coletivo; “portões” é contextual para entradas de cidades, e “trancas” comunica os dispositivos que os fechavam.
- source_word: עוֹדֶנּוּ הָאָרֶץ לְפָנֵינוּ
  choice: enquanto a terra ainda está diante de nós
  rationale: Preserva tanto a noção temporal de עוֹדֶנּוּ, “ainda”, quanto o idioma espacial לְפָנֵינוּ, sem reduzir sua possível ideia de oportunidade ou domínio desimpedido a uma única interpretação.
- source_word: כִּי דָרַשְׁנוּ אֶת יְהוָה אֱלֹהֵינוּ
  choice: pois buscamos Yahweh, nosso Deus
  rationale: דרשׁ, tendo Deus como objeto, comunica buscá-lo com devoção e dependência, não apenas consultá-lo para obter informação.
- source_word: דָּרַשְׁנוּ
  choice: Nós o buscamos
  rationale: Conserva a repetição enfática do hebraico, usando o pronome de modo natural após a menção de Yahweh.
- source_word: וַיָּנַח לָנוּ מִסָּבִיב
  choice: e ele nos deu descanso por todos os lados
  rationale: Expressa o descanso ou alívio concedido por Deus e mantém a abrangência de מִסָּבִיב sem acrescentar inimigos, que não são mencionados na oração.
- source_word: וַיִּבְנוּ וַיַּצְלִיחוּ
  choice: Assim, eles construíram e prosperaram
  rationale: A sequência apresenta o resultado da decisão. “Prosperaram” abrange o êxito alcançado sem limitar o sentido a mera conclusão material da obra.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e pactual, sem substituí-lo pelo título “Senhor” nem adotar a forma híbrida tradicional “Jeová”.
- issue: Relação entre buscar Yahweh e receber descanso
  choice: Preservar a afirmação causal do discurso
  alternative: Explicitar uma fórmula universal de recompensa por devoção
  rationale: O texto relaciona, na fala de Asa, a busca por Yahweh ao descanso recebido. A tradução conserva essa relação sem transformá-la em uma regra teológica universal não declarada no versículo.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe direta. Mantém a metonímia “Judá”, a repetição enfática de “buscamos” e a imagem ambígua de a terra estar “diante de nós”. Usa “portões e trancas” como vocabulário comum de fortificação e “Yahweh” para o nome divino.
