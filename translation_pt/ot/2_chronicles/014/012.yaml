  text: וַ/יִּרְדְּפֵ֨/ם אָסָ֜א וְ/הָ/עָ֣ם אֲשֶׁר עִמּ/וֹ֮ עַד לִ/גְרָר֒ וַ/יִּפֹּ֤ל מִ/כּוּשִׁים֙ לְ/אֵ֣ין לָ/הֶ֣ם מִֽחְיָ֔ה כִּֽי נִשְׁבְּר֥וּ לִ/פְנֵֽי יְהוָ֖ה וְ/לִ/פְנֵ֣י מַחֲנֵ֑/הוּ וַ/יִּשְׂא֥וּ שָׁלָ֖ל הַרְבֵּ֥ה מְאֹֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/012.yaml
  text: Asa and the people who were with him pursued them as far as Gerar[a], and the Cushites fell until none remained alive, for they were shattered before Yahweh and before his army[b]. Then they carried off a very great amount of plunder.
translation:
  language: pt
  text: Asa e o povo que estava com ele os perseguiram até Gerar. Os cuxitas[a] caíram, sem que lhes restasse sobrevivente, pois foram destroçados diante de Yahweh e diante do seu exército[b]. Então levaram uma quantidade enorme de despojos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “etíopes”. O hebraico diz “cuxitas”, isto é, o povo de Cuxe.
    reason: lexical_alternative
  - marker: b
    text: Ou “seu acampamento”. A palavra hebraica pode significar “acampamento” ou “exército”. O referente de “seu” pode ser a força de Asa, embora alguns o entendam como referência ao exército de Yahweh.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּרְדְּפֵם
  choice: os perseguiram
  rationale: O verbo רדף descreve perseguição, especialmente natural em contexto militar; o pronome retoma a força cuxita.
- source_word: עַד לִגְרָר
  choice: até Gerar
  rationale: עַד seguido de topônimo indica o ponto alcançado ou limite da perseguição.
- source_word: מִכּוּשִׁים
  choice: cuxitas
  rationale: Preserva a referência etnogeográfica a Cuxe, evitando identificar de modo anacrônico esse povo com os etíopes modernos.
- source_word: וַיִּפֹּל מִכּוּשִׁים לְאֵין לָהֶם מִחְיָה
  choice: Tantos cuxitas caíram que nenhum deles ficou com vida
  rationale: A construção com נפל e מן fala de baixas entre os cuxitas, enquanto לְאֵין לָהֶם מִחְיָה expressa a ausência de sobreviventes; a formulação é natural em português e mantém a força total da derrota.
- source_word: נִשְׁבְּרוּ
  choice: foram destroçados
  rationale: O passivo de שבר retrata ruína militar decisiva e conserva a imagem forte de serem quebrados.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Mantém tanto o nome divino expresso no hebraico quanto o idioma espacial e teológico de derrota diante de Deus.
- source_word: וְלִפְנֵי מַחֲנֵהוּ
  choice: e diante do seu exército
  rationale: מַחֲנֶה pode designar acampamento ou força militar; no contexto da batalha, 'exército' comunica melhor a força atuante, enquanto 'seu' preserva na linha principal a ambiguidade do referente.
- source_word: וַיִּשְׂאוּ שָׁלָל הַרְבֵּה מְאֹד
  choice: Então levaram uma quantidade enorme de despojos
  rationale: נשא com שׁלל significa levar bens capturados; הַרְבֵּה מְאֹד intensifica marcadamente sua grande quantidade.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; 'Yahweh' preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Sentido e referente de מַחֲנֵהוּ
  choice: seu exército, sem explicitar no texto se pertence a Asa ou a Yahweh
  alternative: seu acampamento; o exército de Asa; o exército de Yahweh
  rationale: O substantivo admite 'acampamento' e 'exército', e o sufixo hebraico não elimina totalmente a dúvida quanto ao referente. O contexto favorece a força de Asa, mas a nota preserva a alternativa ligada a Yahweh.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe evita arcaísmos; 'despojos' conserva o registro narrativo-militar bíblico. Os marcadores foram colocados junto aos termos efetivamente anotados.
