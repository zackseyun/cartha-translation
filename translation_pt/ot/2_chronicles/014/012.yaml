  naturalness: O registro é atual e claro. «Os cuxitas caíram, sem que lhes restasse sobrevivente» é mais fluente e sóbrio em português do que «Tantos cuxitas caíram que nenhum deles ficou com vida», sem enfraquecer a força do enunciado.
