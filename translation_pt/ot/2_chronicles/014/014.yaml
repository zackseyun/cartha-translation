  text: They also struck the tents of livestock[a], and they carried off sheep in abundance and camels[c][b]. Then they returned to Jerusalem.
translation:
  language: pt
  text: Atacaram também os acampamentos de pastores[a] e levaram como despojo[b] ovelhas[c] em grande quantidade e camelos. Depois voltaram para Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “as tendas dos animais de criação”. A expressão pode designar acampamentos pastoris ou acampamentos de criadores de rebanhos.
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico também pode significar “levar cativo”; como os objetos são animais, o sentido aqui é que foram tomados como despojo.
    reason: lexical_alternative
  - marker: c
    text: O termo traduzido como “ovelhas” também pode designar coletivamente “rebanhos” ou animais de pequeno porte, incluindo ovelhas e cabras.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: também
  rationale: Preserva a força aditiva da expressão e liga a ação ao relato anterior.
- source_word: אָהֳלֵי מִקְנֶה
  choice: os acampamentos de criação de gado
  rationale: Comunica em português natural a ideia de tendas ou acampamentos ligados à atividade pastoril, sem tratá-los como simples currais.
- source_word: הִכּוּ
  choice: atacaram
  rationale: No contexto militar, נכה indica golpear ou atacar; “atacaram” expressa com clareza a ação contra os acampamentos.
- source_word: וַיִּשְׁבּוּ
  choice: levaram como despojo
  rationale: Embora o verbo possa significar “levar cativo”, seus objetos aqui são animais; a formulação escolhida conserva a noção de captura como saque.
- source_word: צֹאן
  choice: ovelhas
  rationale: É uma tradução corrente, embora o substantivo coletivo também possa abranger rebanhos de ovelhas e cabras; a amplitude é registrada em nota.
- source_word: לָרֹב
  choice: em grande quantidade
  rationale: Reproduz de modo claro e natural a ênfase hebraica na abundância dos animais capturados.
- source_word: וּגְמַלִּים
  choice: e camelos
  rationale: Equivalência direta do substantivo hebraico.
- source_word: וַיָּשֻׁבוּ יְרוּשָׁלִָם
  choice: Depois voltaram para Jerusalém
  rationale: “Depois” torna explícita a progressão narrativa do wayyiqtol, e “voltaram para Jerusalém” é idiomático em português.
