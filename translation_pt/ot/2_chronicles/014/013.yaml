  text: וַ/יַּכּ֗וּ אֵ֤ת כָּל הֶֽ/עָרִים֙ סְבִיב֣וֹת גְּרָ֔ר כִּי הָיָ֥ה פַֽחַד יְהוָ֖ה עֲלֵי/הֶ֑ם וַ/יָּבֹ֨זּוּ֙ אֶת כָּל הֶ֣/עָרִ֔ים כִּֽי בִזָּ֥ה רַבָּ֖ה הָיְתָ֥ה בָ/הֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/013.yaml
  text: And they struck down all the cities around Gerar, for the terror of Yahweh was upon them. And they plundered all the cities, for there was much spoil in them.
translation:
  language: pt
  text: Eles derrotaram todas as cidades ao redor de Gerar, pois o terror de Yahweh havia caído sobre elas. Saquearam todas as cidades, porque nelas havia muitos despojos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: derrotaram
  rationale: No contexto militar, o hifil de נכה indica ataque que subjuga ou derrota. “Derrotaram” preserva a força do verbo sem sugerir, além do que o texto afirma, que as próprias cidades foram literalmente abatidas ou que todos os habitantes foram mortos.
- source_word: כָּל הֶעָרִים סְבִיבוֹת גְּרָר
  choice: todas as cidades ao redor de Gerar
  rationale: Tradução direta e natural de עָרִים e סְבִיבוֹת, mantendo Gerar como nome próprio.
- source_word: פַּחַד יְהוָה
  choice: o terror de Yahweh
  rationale: פַּחַד designa aqui pavor incapacitante associado à ação divina, não temor reverente. O genitivo hebraico permanece aberto quanto a ser terror causado por Yahweh ou terror diante dele.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עֲלֵיהֶם
  choice: havia caído sobre elas
  rationale: A expressão hebraica afirma que o terror estava sobre as cidades ou seus habitantes. Em português, “havia caído sobre elas” comunica naturalmente uma condição avassaladora; o feminino retoma “cidades”.
- source_word: וַיָּבֹזּוּ
  choice: saquearam
  rationale: בזז, em narrativa de guerra, significa tomar bens como despojo. “Saquearam” é corrente, conciso e preserva o sentido militar.
- source_word: בִּזָּה רַבָּה
  choice: muitos despojos
  rationale: בִּזָּה refere-se aos bens tomados na guerra. “Muitos despojos” é idiomático, mantém a ideia de grande quantidade e evita repetir a raiz de “saquearam”.
- source_word: בָהֶם
  choice: nelas
  rationale: O sufixo retoma mais naturalmente as cidades; em português, a concordância feminina torna a referência clara.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz explicitamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo pelo título tradicional “SENHOR”.
- issue: Sentido de פַּחַד יְהוָה
  choice: o terror de Yahweh
  alternative: o temor de Yahweh
  rationale: O contexto é de pânico que deixa vulneráveis as cidades vizinhas, não de reverência religiosa. A formulação conserva a relação genitiva sem explicar indevidamente se o terror foi enviado por Yahweh ou sentido diante dele.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação evita arcaísmos e mantém o paralelismo narrativo. Não há notas de rodapé, portanto não são usados marcadores no texto.
