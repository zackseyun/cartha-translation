base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/011.yaml
  text: And Yahweh struck down the Cushites before Asa and before Judah[a], and the Cushites fled.
translation:
  language: pt
  text: Yahweh feriu os cuxitas[a] diante de Asa e de Judá, e os cuxitas fugiram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “etíopes”. O termo étnico hebraico é “cuxitas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֹּף
  choice: feriu
  rationale: Em contexto militar, נָגַף expressa o ato de golpear e, por consequência, derrotar. “Feriu” conserva a força da ação divina sem explicitar além do hebraico quantos foram mortos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הַכּוּשִׁים
  choice: os cuxitas
  rationale: Reproduz diretamente o etnônimo hebraico ligado a Cuxe. “Etíopes” é uma identificação tradicional possível, mas pode sugerir uma correspondência geográfica moderna demasiado precisa.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Preserva a construção hebraica e, no relato militar, comunica que os cuxitas foram feridos diante de Asa e das forças ou do povo de Judá.
- source_word: אָסָא
  choice: Asa
  rationale: Forma tradicional e corrente do nome próprio em português.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma portuguesa consagrada; neste contexto, pode designar coletivamente o povo ou as forças do reino de Judá.
- source_word: וַיָּנֻסוּ
  choice: fugiram
  rationale: Verte diretamente o sentido de נוּס e mantém a concisão da narrativa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título; “Jeová” é uma forma tradicional alternativa.
- issue: Agente da derrota dos cuxitas
  choice: Yahweh feriu os cuxitas
  alternative: Yahweh derrotou os cuxitas
  rationale: “Feriu” mantém a imagem verbal e a atribuição direta da ação a Yahweh, sem reduzir o verbo a uma descrição apenas estratégica do resultado.
translation_notes:
  register: Português atual, claro e digno, com sintaxe narrativa concisa. “Diante de” conserva o idioma militar do hebraico; “cuxitas” mantém o etnônimo antigo, esclarecido por nota.
