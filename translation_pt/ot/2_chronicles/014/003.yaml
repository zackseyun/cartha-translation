  text: וַ/יֹּ֨אמֶר֙ לִֽ/יהוּדָ֔ה לִ/דְר֕וֹשׁ אֶת יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֑ם וְ/לַ/עֲשׂ֖וֹת הַ/תּוֹרָ֥ה וְ/הַ/מִּצְוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/003.yaml
  text: And he told Judah to seek the LORD, the God of their fathers, and to keep the law and the commandment.
translation:
  language: pt
  text: E disse a Judá que buscasse o SENHOR, o Deus de seus antepassados, e cumprisse a lei e o mandamento.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ordenou
  rationale: Embora o verbo normalmente signifique “dizer”, neste contexto a construção com infinitivos expressa uma determinação régia; “ordenou” comunica naturalmente essa força em português.
- source_word: לִדְרוֹשׁ
  choice: que buscasse
  rationale: Preserva o sentido de voltar-se ao SENHOR, procurá-lo e consultá-lo, sem restringir a expressão a um único ato religioso.
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Segue a convenção portuguesa tradicional de representar o nome divino YHWH por SENHOR em versaletes.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: o Deus de seus antepassados
  rationale: “Antepassados” transmite com clareza moderna o sentido coletivo de אבות e evita que “pais” seja entendido apenas como progenitores imediatos.
- source_word: וְלַעֲשׂוֹת
  choice: e cumprisse
  rationale: Diante de “a Lei e o mandamento”, o verbo עשה tem o sentido idiomático de observar, praticar ou cumprir.
- source_word: הַתּוֹרָה וְהַמִּצְוָה
  choice: a Lei e o mandamento
  rationale: Mantém a distinção e o singular presentes no hebraico, sem harmonizar a fórmula com outras passagens.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: Adota a convenção bíblica portuguesa amplamente reconhecida, sem acrescentar nota não exigida pelo texto.
- issue: Relação entre “a Lei” e “o mandamento”
  choice: Preservar os dois termos no singular
  alternative: “a Lei e os mandamentos” ou uma expressão unificada
  rationale: O hebraico apresenta dois substantivos definidos, sendo o segundo singular; a tradução conserva essa formulação e sua possível amplitude teológica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A sintaxe mantém a coordenação do hebraico, e “antepassados” evita ambiguidade desnecessária.
