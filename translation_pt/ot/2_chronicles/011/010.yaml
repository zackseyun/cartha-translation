  text: and Zorah[a], Aijalon, and Hebron, which are in Judah and in Benjamin[b], fortified cities.
translation:
  language: pt
  text: e Zorá, Aijalom e Hebrom, que ficam em Judá e em Benjamim, cidades fortificadas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “cidades fortificadas” pode resumir toda a lista dos versículos 6–10 ou referir-se mais diretamente às cidades mencionadas neste versículo.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: צָרְעָה
  choice: Zorá
  rationale: Forma portuguesa convencional do nome geográfico, com acentuação que favorece a leitura natural.
- source_word: אַיָּלוֹן
  choice: Aijalom
  rationale: Transliteração bíblica corrente em português, preservando o nome próprio sem traduzi-lo.
- source_word: חֶבְרוֹן
  choice: Hebrom
  rationale: Forma tradicional e amplamente reconhecida em português.
- source_word: אֲשֶׁר
  choice: que ficam
  rationale: O hebraico emprega uma partícula relativa sem verbo expresso; “que ficam” completa naturalmente a oração geográfica em português sem sugerir posse.
- source_word: בִּיהוּדָה וּבְבִנְיָמִן
  choice: em Judá e em Benjamim
  rationale: Mantém as duas preposições do hebraico e expressa localização geográfica ou tribal sem interpretar a relação como propriedade.
- source_word: עָרֵי מְצֻרוֹת
  choice: cidades fortificadas
  rationale: Equivalente claro e corrente para a expressão construta que descreve cidades dotadas de fortificações.
- source_word: וְאֶת ... וְאֶת ... וְאֶת
  choice: e Zorá, Aijalom e Hebrom
  rationale: O marcador de objeto אֶת não é traduzido; as conjunções dão continuidade natural à lista iniciada nos versículos anteriores.
