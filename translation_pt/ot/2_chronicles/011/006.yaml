  text: And he built Bethlehem[a], Etam, and Tekoa.
translation:
  language: pt
  text: E ele construiu Belém, Etã e Tecoa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבֶן
  choice: construiu
  rationale: O qal wayyiqtol de בנה tem como sentido básico “construiu”. Embora o contexto trate do fortalecimento de cidades, traduzir por “fortificou” acrescentaria uma especificação que o verbo deste versículo não expressa por si só.
- source_word: אֶת
  choice: '[não traduzido]'
  rationale: Partícula que marca o objeto direto definido em hebraico, sem equivalente independente necessário em português.
- source_word: בֵּית לֶחֶם
  choice: Belém
  rationale: Forma tradicional, reconhecível e natural do topônimo em português.
- source_word: עֵיטָם
  choice: Etã
  rationale: Transliteração adaptada à fonologia e à ortografia portuguesas do topônimo hebraico.
- source_word: תְּקוֹעַ
  choice: Tecoa
  rationale: Forma tradicional e reconhecível do topônimo em português.
- source_word: וְ...וְ...וְ
  choice: E ... , ... e ...
  rationale: O primeiro waw mantém a ligação narrativa com o contexto anterior; na enumeração, a coordenação natural em português usa vírgula e “e” antes do último item.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno. Conserva-se o sentido lexical simples de “construiu” sem transformar implicitamente a ação em “fortificou” ou “reconstruiu”. O pronome “ele” torna explícito em português o sujeito já indicado pela forma verbal hebraica e recuperável do contexto.
