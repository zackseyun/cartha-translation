source:
  edition: WLC
  text: וְ/הַ/כֹּהֲנִים֙ וְ/הַ/לְוִיִּ֔ם אֲשֶׁ֖ר בְּ/כָל יִשְׂרָאֵ֑ל הִֽתְיַצְּב֥וּ עָלָ֖י/ו מִ/כָּל גְּבוּלָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/013.yaml
  text: And the priests and the Levites who were in all Israel took their stand with him from all their territories[a].
translation:
  language: pt
  text: E os sacerdotes e os levitas que estavam em todo o Israel tomaram posição ao lado dele, vindos de todos os seus territórios.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “apresentaram-se diante dele” ou “ficaram junto dele”. A expressão hebraica pode indicar tanto o comparecimento perante Roboão como o ato de tomar o partido dele; o contexto favorece a ideia de apoio leal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַכֹּהֲנִים
  choice: E os sacerdotes
  rationale: Mantém a ligação narrativa expressa pela conjunção e o caráter definido do substantivo plural.
- source_word: וְהַלְוִיִּם
  choice: e os levitas
  rationale: Tradução direta do substantivo plural definido coordenado; “levitas” é a designação tradicional e clara em português.
- source_word: אֲשֶׁר בְּכָל יִשְׂרָאֵל
  choice: que estavam em todo o Israel
  rationale: Indica que esses sacerdotes e levitas se encontravam espalhados por todo Israel, em contraste com uma localização restrita a Judá.
- source_word: הִתְיַצְּבוּ
  choice: tomaram posição
  rationale: O hitpael de יצב comunica uma ação deliberada de apresentar-se ou colocar-se em determinada posição; no contexto, também sugere alinhamento leal.
- source_word: עָלָיו
  choice: ao lado dele
  rationale: Com הִתְיַצְּבוּ, a preposição expressa aqui apoio ou alinhamento com Roboão. “Ao lado dele” preserva a imagem espacial e comunica naturalmente a lealdade contextual.
- source_word: מִכָּל גְּבוּלָם
  choice: vindos de todos os seus territórios
  rationale: גְּבוּל pode indicar fronteira, região ou território. A explicitação participial “vindos” liga de modo natural em português a origem geográfica à ação principal, enquanto “territórios” evita a impressão inadequada de que vieram apenas das linhas de fronteira.
theological_decisions:
- issue: A expressão הִתְיַצְּבוּ עָלָיו pode descrever comparecimento físico diante de Roboão ou alinhamento em seu apoio.
  choice: tomaram posição ao lado dele
  alternative: apresentaram-se diante dele
  rationale: O contexto favorece apoio leal a Roboão, mas a formulação conserva a imagem concreta de posicionamento e a nota registra a amplitude semântica do idioma hebraico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Tomaram posição ao lado dele” transmite a ação deliberada e o apoio contextual sem eliminar a ambiguidade legítima, preservada na nota. O acréscimo contextual “vindos” torna natural a relação com a expressão final de origem.
