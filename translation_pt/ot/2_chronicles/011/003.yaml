  text: אֱמֹ֕ר אֶל רְחַבְעָ֥ם בֶּן שְׁלֹמֹ֖ה מֶ֣לֶךְ יְהוּדָ֑ה וְ/אֶל֙ כָּל יִשְׂרָאֵ֔ל בִּ/יהוּדָ֥ה וּ/בִנְיָמִ֖ן לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/003.yaml
  text: Speak to Rehoboam son of Solomon[a], king of Judah, and to all Israel in Judah and Benjamin, saying,
translation:
  language: pt
  text: '“Fale com Roboão, filho de Salomão, rei de Judá, e com todo o Israel que está em Judá e Benjamim, e diga:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱמֹר
  choice: Fale
  rationale: O imperativo de אמר ordena que a mensagem divina seja comunicada aos destinatários; “fale com” é natural em português e preserva a força direta da ordem.
- source_word: אֶל
  choice: com
  rationale: Embora אֶל marque os destinatários, em português atual a regência idiomática de “falar” neste contexto é “falar com”.
- source_word: רְחַבְעָם
  choice: Roboão
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: בֶּן שְׁלֹמֹה
  choice: filho de Salomão
  rationale: Reproduz a cadeia construta que identifica Roboão por sua ascendência.
- source_word: מֶלֶךְ יְהוּדָה
  choice: rei de Judá
  rationale: Mantém o título real em aposição ao nome, de modo natural e fiel à construção hebraica.
- source_word: וְאֶל כָּל יִשְׂרָאֵל
  choice: e com todo o Israel
  rationale: Preserva “Israel” como designação coletiva e pactual, em vez de substituí-la por “todos os israelitas”.
- source_word: בִּיהוּדָה וּבִנְיָמִן
  choice: que está em Judá e Benjamim
  rationale: 'Explicita de modo natural que ב indica localização: trata-se de Israel situado nos territórios de Judá e Benjamim, não necessariamente apenas de identidade tribal.'
- source_word: לֵאמֹר
  choice: 'e diga:'
  rationale: O infinitivo construto introduz o conteúdo da mensagem no versículo seguinte. Em português, “e diga:” evita a fórmula menos natural “dizendo” e mantém clara a transição para a citação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação preserva “todo o Israel” e o sentido locativo de Judá e Benjamim, evitando linguagem excessivamente arcaica.
