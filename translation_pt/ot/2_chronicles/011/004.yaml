source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֡ה לֹא תַעֲלוּ֩ וְ/לֹא תִלָּ֨חֲמ֜וּ עִם אֲחֵי/כֶ֗ם שׁ֚וּבוּ אִ֣ישׁ לְ/בֵית֔/וֹ כִּ֧י מֵֽ/אִתִּ֛/י נִהְיָ֖ה הַ/דָּבָ֣ר הַ/זֶּ֑ה וַֽ/יִּשְׁמְעוּ֙ אֶת דִּבְרֵ֣י יְהוָ֔ה וַ/יָּשֻׁ֖בוּ מִ/לֶּ֥כֶת אֶל יָרָבְעָֽם־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/004.yaml
  text: 'Thus says Yahweh: You must not go up or fight against your brothers[a]. Return, each man to his house, for this thing has come from me[c][b]. So they listened to the words of Yahweh and turned back from going against Jeroboam.'
translation:
  language: pt
  text: 'Assim diz Yahweh: “Não subam nem lutem contra seus irmãos.[a] Volte cada um para a sua casa, pois isto veio de mim.”[b] Eles deram ouvidos às palavras de Yahweh e voltaram atrás, deixando de ir contra Jeroboão.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmãos” ressalta que os adversários eram também israelitas.
    reason: cultural_note
  - marker: b
    text: 'Ou: “pois esta questão procede de mim”.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “de ir até Jeroboão”; o contexto indica que se tratava de um avanço militar contra ele.
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Preserva a fórmula profética solene e verte diretamente o nome divino.
- source_word: לֹא תַעֲלוּ וְלֹא תִלָּחֲמוּ
  choice: Não subam nem lutem
  rationale: Mantém o sentido de avanço e combate, com coordenação negativa natural em português.
- source_word: עִם אֲחֵיכֶם
  choice: contra seus irmãos
  rationale: No contexto militar, עִם tem sentido adversativo; “irmãos” preserva a ênfase em sua fraternidade israelita.
- source_word: שׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: Volte cada um para a sua casa
  rationale: Reproduz o uso distributivo de אִישׁ em português natural.
- source_word: כִּי מֵאִתִּי נִהְיָה הַדָּבָר הַזֶּה
  choice: pois isto aconteceu por minha causa
  rationale: Expressa a atribuição do acontecimento a Deus sem definir mais precisamente a modalidade da ação divina.
- source_word: וַיִּשְׁמְעוּ אֶת דִּבְרֵי יְהוָה
  choice: Eles deram ouvidos às palavras de Yahweh
  rationale: “Dar ouvidos” abrange tanto escutar quanto atender, ambiguidade própria de שׁמע e confirmada pela ação seguinte.
- source_word: וַיָּשֻׁבוּ מִלֶּכֶת אֶל יָרָבְעָם
  choice: voltaram atrás, deixando de ir contra Jeroboão
  rationale: Torna clara a interrupção do avanço hostil indicada pelo contexto, enquanto a nota registra a direção literal de אֶל.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Emprega uma forma corrente de vocalização do Tetragrama e não o substitui por um título.
- issue: Causalidade divina em מֵאִתִּי נִהְיָה הַדָּבָר הַזֶּה
  choice: isto aconteceu por minha causa
  alternative: esta questão procede de mim
  rationale: Conserva a afirmação de que o acontecimento tem origem em Deus, sem desenvolver uma explicação doutrinária de como essa causalidade opera.
- issue: Direção ou hostilidade em אֶל יָרָבְעָם
  choice: ir contra Jeroboão
  alternative: ir até Jeroboão
  rationale: O contexto é de expedição militar, mas a nota preserva o valor direcional mais literal da preposição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva a solenidade da fórmula profética, o caráter distributivo da ordem e as ambiguidades relevantes por meio de notas breves.
