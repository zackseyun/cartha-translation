revisions:
- from: 'Assim diz Yahweh: “Não subam nem lutem contra seus irmãos.[a] Volte cada um para a sua casa, pois isto aconteceu por minha causa.”[b] Eles deram ouvidos às palavras de Yahweh e voltaram atrás, deixando de ir contra Jeroboão.[c]'
  to: 'Assim diz Yahweh: “Não subam nem lutem contra seus irmãos.[a] Volte cada um para a sua casa, pois isto veio de mim.”[b] Eles deram ouvidos às palavras de Yahweh e voltaram atrás, deixando de ir contra Jeroboão.[c]'
  rationale: A única revisão necessária substitui «por minha causa» por «veio de mim», para comunicar a origem divina expressa no hebraico, e conserva as demais escolhas e as três notas, cujas âncoras estão corretamente posicionadas.
