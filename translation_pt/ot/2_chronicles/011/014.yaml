  text: כִּֽי עָזְב֣וּ הַ/לְוִיִּ֗ם אֶת מִגְרְשֵׁי/הֶם֙ וַ/אֲחֻזָּתָ֔/ם וַ/יֵּלְכ֥וּ לִ/יהוּדָ֖ה וְ/לִֽ/ירוּשָׁלִָ֑ם כִּֽי הִזְנִיחָ֤/ם יָֽרָבְעָם֙ וּ/בָנָ֔י/ו מִ/כַּהֵ֖ן לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/014.yaml
  text: For the Levites left their pasturelands and their possessions and went to Judah and Jerusalem[b][a], because Jeroboam and his sons had rejected them from serving as priests to Yahweh.
translation:
  language: pt
  text: Pois os levitas deixaram suas terras de pastagem[a] e suas propriedades e foram para Judá e Jerusalém, porque Jeroboão e seus filhos os haviam excluído de servir como sacerdotes a Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas terras comuns” ou “seus campos de pastagem”. O hebraico se refere aos terrenos abertos ligados às cidades deles.
    reason: lexical_alternative
  - marker: b
    text: Ou “os haviam rejeitado, impedindo-os de exercer o sacerdócio para Yahweh”.
    reason: alternative_reading
lexical_decisions:
- source_word: מִגְרְשֵׁיהֶם
  choice: suas terras de pastagem
  rationale: מִגְרָשׁ designa o terreno aberto ligado a uma cidade, frequentemente usado para pastagem, sobretudo no contexto das cidades levíticas. “Terras de pastagem” é concreto, claro e preserva essa função territorial.
- source_word: אֲחֻזָּתָם
  choice: suas propriedades
  rationale: אֲחֻזָּה indica uma posse ou propriedade fundiária. “Propriedades” comunica naturalmente os bens territoriais dos levitas sem introduzir de modo indevido a ideia específica de herança.
- source_word: וַיֵּלְכוּ לִיהוּדָה וְלִירוּשָׁלִָם
  choice: e foram para Judá e Jerusalém
  rationale: הלך com ל expressa deslocamento em direção a um destino; “foram para” reproduz com naturalidade a perspectiva narrativa do hebraico.
- source_word: הִזְנִיחָם
  choice: os haviam excluído
  rationale: O hifil de זנח pode expressar rejeição, afastamento ou exclusão. Aqui, a construção seguinte especifica a exclusão do serviço sacerdotal; “haviam excluído” preserva de maneira clara a força pessoal e institucional do verbo.
- source_word: מִכַּהֵן
  choice: de servir como sacerdotes
  rationale: A preposição מִן com o infinitivo de כהן indica impedimento ou exclusão do exercício sacerdotal. “De servir como sacerdotes” é idiomático e mantém explícita a função cultual.
- source_word: כִּי ... כִּי
  choice: Pois ... porque
  rationale: O primeiro כִּי introduz uma explicação do contexto anterior, enquanto o segundo apresenta a causa da mudança dos levitas. “Pois ... porque” distingue naturalmente essas duas funções.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Relação dos levitas com o serviço sacerdotal
  choice: os haviam excluído de servir como sacerdotes
  alternative: os haviam rejeitado, impedindo-os de exercer o sacerdócio
  rationale: A tradução mantém tanto quanto possível a noção de exclusão presente em הִזְנִיחָם e a construção de impedimento com מִכַּהֵן, sem ampliar a afirmação para uma doutrina geral sobre o sacerdócio levítico.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível a leitores brasileiros e compreensível internacionalmente. “Terras de pastagem” evita o arcaísmo e a imprecisão de “arredores”; “haviam excluído” explicita a anterioridade causal sem eliminar a nuance de rejeição, registrada em nota.
