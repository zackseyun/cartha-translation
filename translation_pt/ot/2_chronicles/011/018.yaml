base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/018.yaml
  text: Rehoboam took as wife Mahalath the daughter of Jerimoth son of David[a], and Abihail the daughter of Eliab son of Jesse.
translation:
  language: pt
  text: Roboão tomou por esposa Maalate, filha de Jerimote, filho de Davi, e de Abiail, filha de Eliabe, filho de Jessé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A genealogia hebraica é condensada e sua construção é irregular; literalmente: «Maalate, filho de Jerimote, filho de Davi, Abiail, filha de Eliabe, filho de Jessé». Provavelmente, o texto apresenta Maalate como descendente das duas linhagens. Alguns entendem Abiail como outro nome na notícia familiar ou, com menor probabilidade, como uma segunda esposa.'
    reason: Leitura alternativa decorrente da sintaxe genealógica ambígua e da forma masculina «filho» após o nome Maalate.
lexical_decisions:
- source_word: וַיִּקַּח לוֹ ... אִשָּׁה
  choice: tomou por esposa
  rationale: Reproduz a expressão idiomática hebraica com clareza e dignidade, mantendo o sentido matrimonial sem substituí-la pelo mais interpretativo «casou-se com».
- source_word: מָחֲלַת
  choice: Maalate
  rationale: Transliteração portuguesa tradicional e inteligível do nome próprio hebraico.
- source_word: בן יְרִימוֹת בֶּן דָּוִיד
  choice: filha de Jerimote, filho de Davi
  rationale: O primeiro בן («filho») cria uma construção anômala depois do nome feminino Maalate; a tradução explicita a relação genealógica provável como «filha», enquanto a nota preserva a forma e a ambiguidade do hebraico.
- source_word: אֲבִיהַיִל בַּת אֱלִיאָב בֶּן יִשָׁי
  choice: de Abiail, filha de Eliabe, filho de Jessé
  rationale: Entende Abiail como a mãe de Maalate e apresenta naturalmente a segunda linhagem genealógica, sem perder a sequência dos nomes no hebraico.
theological_decisions:
- issue: Relação sintática dos nomes na genealogia
  choice: Maalate é a única esposa mencionada, identificada como filha de Jerimote e de Abiail.
  alternative: Abiail é um segundo nome na notícia familiar, ou uma segunda esposa de Roboão.
  rationale: O singular אִשָּׁה («esposa») favorece a referência a uma só mulher, e a leitura de duas linhagens parentais oferece a construção genealógica mais coerente. Como o hebraico permanece comprimido e irregular, a nota registra as alternativas sem eliminar a tensão textual.
translation_notes:
  register: Português moderno, claro e digno, com formas onomásticas correntes em português. A pontuação e a repetição de «filho/filha» tornam a genealogia compreensível, enquanto a nota documenta fielmente a compressão e a ambiguidade do texto hebraico.
