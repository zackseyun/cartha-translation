base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/022.yaml
  text: And Rehoboam appointed Abijah son of Maacah as chief among his brothers[a], for he intended to make him king.
translation:
  language: pt
  text: Roboão nomeou Abias, filho de Maaca, chefe e líder entre seus irmãos[a], pois pretendia fazê-lo rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sobre seus irmãos”; a preposição hebraica pode indicar sua precedência ou autoridade em relação a eles.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: nomeou
  rationale: O hifil de עמד indica aqui colocar alguém numa posição ou função; “nomeou” expressa naturalmente esse ato de designação.
- source_word: לָרֹאשׁ
  choice: chefe
  rationale: רֹאשׁ, literalmente “cabeça”, denota neste contexto a posição principal ou de chefia.
- source_word: אֶת אֲבִיָּה בֶן מַעֲכָה
  choice: Abias, filho de Maaca
  rationale: Mantém de forma direta a construção filial hebraica e usa as formas portuguesas tradicionais e reconhecíveis dos nomes.
- source_word: לְנָגִיד
  choice: líder
  rationale: נָגִיד designa alguém investido de autoridade. “Líder” preserva a ideia de função sem sugerir necessariamente que ele já reinava; o termo é mantido ao lado de “chefe” porque ambos aparecem no hebraico.
- source_word: בְּאֶחָיו
  choice: entre seus irmãos
  rationale: A preposição ב pode situar Abias dentro do grupo de irmãos ou indicar sua precedência em relação a eles. “Entre” preserva com cautela a primeira possibilidade, enquanto a alternativa é registrada em nota.
- source_word: כִּי
  choice: pois
  rationale: כִּי introduz a razão da nomeação; “pois” é claro, corrente e adequado ao registro narrativo.
- source_word: לְהַמְלִיכוֹ
  choice: pretendia fazê-lo rei
  rationale: O infinitivo com ל expressa propósito ou intenção. A formulação explicita naturalmente que Roboão planejava conferir a Abias a realeza, sem afirmar que isso já havia ocorrido.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A tradução preserva os dois termos de posição presentes no hebraico (“chefe” e “líder”) e registra em nota a ambiguidade relacional de בְּאֶחָיו.
