  text: וְ/אַחֲרֶ֣י/הָ לָקַ֔ח אֶֽת מַעֲכָ֖ה בַּת אַבְשָׁל֑וֹם וַ/תֵּ֣לֶד ל֗/וֹ אֶת אֲבִיָּה֙ וְ/אֶת עַתַּ֔י וְ/אֶת זִיזָ֖א וְ/אֶת שְׁלֹמִֽית־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/020.yaml
  text: After her[a], he took Maacah the daughter of Absalom, and she bore him Abijah, Attai, Ziza, and Shelomith.
translation:
  language: pt
  text: Depois dela, ele tomou por mulher Maaca, filha de Absalão[a], e ela lhe deu à luz Abias, Atai, Ziza e Selomite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “filha de Absalão”. O termo também pode, em certos contextos, designar uma descendente mais remota; por isso, alguns entendem “neta de Absalão”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַחֲרֶיהָ
  choice: Depois dela
  rationale: A preposição “depois de” com o sufixo feminino singular remete à esposa mencionada anteriormente; a tradução mantém essa referência explícita.
- source_word: לָקַח
  choice: tomou por mulher
  rationale: O verbo significa literalmente “tomou”, mas, neste contexto matrimonial, “tomou por mulher” comunica o sentido com clareza sem reduzi-lo simplesmente a “casou-se”.
- source_word: מַעֲכָה
  choice: Maaca
  rationale: Forma portuguesa tradicional e reconhecível do nome pessoal hebraico.
- source_word: בַּת אַבְשָׁלוֹם
  choice: filha de Absalão
  rationale: Reproduz diretamente o termo hebraico בַּת, “filha”, e usa a forma portuguesa corrente de Absalão, sem decidir no texto principal se a relação genealógica pode ser mais remota.
- source_word: וַתֵּלֶד לוֹ
  choice: e ela lhe deu à luz
  rationale: Expressão portuguesa natural para o verbo “dar à luz” com o objeto indireto “lhe”, indicando que ela gerou filhos para ele.
- source_word: אֶת אֲבִיָּה וְאֶת עַתַּי וְאֶת זִיזָא וְאֶת שְׁלֹמִית
  choice: Abias, Atai, Ziza e Selomite
  rationale: Os nomes são apresentados em formas portuguesas reconhecíveis; os marcadores hebraicos de objeto direto não precisam ser representados em português.
theological_decisions:
- issue: Designação genealógica de Maaca como “filha de Absalão”
  choice: Manter “filha de Absalão” no texto principal
  alternative: “neta de Absalão” ou “descendente de Absalão”
  rationale: O hebraico diz literalmente “filha”. Embora o termo possa designar uma descendente mais remota em certos contextos genealógicos, a tradução não resolve essa possibilidade de modo silencioso e a registra em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Tomou por mulher” preserva o colorido da expressão hebraica e explicita seu sentido matrimonial. A ordem e a coordenação da frase seguem de perto o original sem produzir uma construção artificial.
