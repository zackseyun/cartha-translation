  text: 'E ela lhe deu filhos: Jeús, Semarias e Zaão.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: deu
  rationale: A forma narrativa de ילד apresenta o acontecimento seguinte. Em português, a expressão completa “deu filhos” é natural no contexto genealógico e mantém a mulher como sujeito.
- source_word: לוֹ
  choice: lhe
  rationale: A preposição ל com sufixo indica o pai na fórmula de nascimento; “lhe deu filhos” reproduz essa relação de modo idiomático.
- source_word: בָּנִים
  choice: três filhos
  rationale: O hebraico especifica filhos do sexo masculino. O numeral “três”, implícito na enumeração dos três nomes, torna a frase mais natural e clara em português sem alterar o conteúdo.
- source_word: יְעוּשׁ
  choice: Jeús
  rationale: Forma portuguesa bíblica convencional do nome hebraico, com acento para orientar a pronúncia.
- source_word: שְׁמַרְיָה
  choice: Semarias
  rationale: Forma portuguesa bíblica tradicional e reconhecível do nome hebraico Shemaryah.
- source_word: זָהַם
  choice: Zaão
  rationale: Forma portuguesa bíblica convencional do nome hebraico Zaham.
