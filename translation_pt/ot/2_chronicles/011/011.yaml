base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/011.yaml
  text: He strengthened the fortified places and put commanders in them[a], along with stores of food, oil[c][b], and wine.
translation:
  language: pt
  text: Ele reforçou as fortalezas[a] e pôs nelas comandantes[b] e depósitos[c] de alimentos, azeite e vinho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lugares fortificados” ou “redutos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “líderes”, “governantes” ou “oficiais”.
    reason: lexical_alternative
  - marker: c
    text: O termo hebraico pode indicar depósitos ou as próprias reservas armazenadas; aqui se refere a provisões mantidas em estoque.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: reforçou
  rationale: O piel de חזק expressa tornar forte ou seguro. “Reforçou” comunica a ação sem repetir desnecessariamente a ideia de fortificação presente no objeto.
- source_word: הַמְּצֻרוֹת
  choice: as cidades fortificadas
  rationale: O substantivo designa lugares fortificados ou fortalezas. No contexto das cidades mencionadas nos versículos anteriores, “cidades fortificadas” é natural e contextualmente preciso.
- source_word: וַיִּתֵּן בָּהֶם
  choice: e pôs nelas
  rationale: נתן com ב indica colocação dentro desses locais. “Pôs nelas” preserva diretamente o sentido locativo do hebraico.
- source_word: נְגִידִים
  choice: comandantes
  rationale: נָגִיד pode indicar líder, governante ou oficial. Neste contexto militar, “comandantes” expressa bem a função sem sugerir posição régia.
- source_word: וְאֹצְרוֹת
  choice: e depósitos
  rationale: אֹצָרוֹת pode referir-se tanto a depósitos físicos quanto a reservas armazenadas. “Depósitos de alimentos” mantém a imagem concreta e preserva a ambiguidade lexical por meio de nota.
- source_word: מַאֲכָל
  choice: alimentos
  rationale: Termo geral para comida ou provisões; “alimentos” se encaixa naturalmente na construção com depósitos.
- source_word: שֶׁמֶן
  choice: azeite
  rationale: Embora שֶׁמֶן possa significar óleo em geral, neste inventário de provisões do antigo Israel refere-se naturalmente ao azeite, alimento básico da região.
- source_word: יָיִן
  choice: vinho
  rationale: Equivalente direto e corrente de יָיִן neste contexto de provisões.
