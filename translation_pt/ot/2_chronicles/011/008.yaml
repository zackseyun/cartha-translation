  rationale: Nome próprio de lugar, transliterado conforme a forma tradicional e amplamente reconhecida nas Bíblias em português.
- source_word: מָרֵשָׁה
  choice: Maressa
  rationale: Nome próprio da cidade de Judá, transliterado segundo a forma tradicional mais reconhecível em português.
- source_word: זִיף
  choice: Zife
  rationale: Nome próprio de lugar, transliterado segundo a forma tradicional em português.
