revisions:
- from: E, depois deles, vieram[a] de todas as tribos de Israel os que haviam disposto o coração[b] a buscar Yahweh, o Deus de Israel. Eles vieram a Jerusalém para oferecer sacrifícios a Yahweh, o Deus de seus pais.
  to: E, depois deles, dentre todas as tribos de Israel, os que tinham decidido buscar Yahweh, o Deus de Israel, vieram[a] a Jerusalém para oferecer sacrifícios a Yahweh, o Deus de seus pais.
  rationale: 'A revisão reúne todos os elementos em torno do único verbo principal do hebraico e elimina a repetição sem base textual. A nota sobre o idioma “dar o coração” continua útil, mas deve permanecer disponível como nota não ancorada somente se o sistema exigir que toda nota tenha âncora; preferencialmente, ancore-se [b] em “tinham decidido buscar” para corresponder ao conteúdo da nota. O texto completo com essa âncora é: “E, depois deles, dentre todas as tribos de Israel, os que tinham decidido[b] buscar Yahweh, o Deus de Israel, vieram[a] a Jerusalém para oferecer sacrifícios a Yahweh, o Deus de seus pais.”'
