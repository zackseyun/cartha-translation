language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אַחֲרֵי/הֶ֗ם מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל הַ/נֹּֽתְנִים֙ אֶת לְבָבָ֔/ם לְ/בַקֵּ֕שׁ אֶת יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל בָּ֚אוּ יְר֣וּשָׁלִַ֔ם לִ/זְבּ֕וֹחַ לַ/יהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/016.yaml
  text: And after them[a], from all the tribes of Israel, those who set their hearts to seek Yahweh, the God of Israel, came to Jerusalem to sacrifice to Yahweh[b], the God of their fathers.
translation:
  language: pt
  text: E, depois deles, dentre todas as tribos de Israel, os que tinham decidido buscar Yahweh, o Deus de Israel, vieram[a] a Jerusalém para oferecer sacrifícios a Yahweh, o Deus de seus pais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foram”. O verbo hebraico pode significar “vir” ou “ir”, conforme o ponto de vista narrativo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵיהֶם
  choice: E, depois deles
  rationale: Preserva tanto a conjunção וְ como a ideia de sequência expressa por אַחֲרֵי, ligando o versículo aos sacerdotes e levitas mencionados anteriormente.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: de todas as tribos de Israel
  rationale: Expressa com naturalidade a origem e mantém o alcance abrangente de כֹּל.
- source_word: הַנֹּתְנִים אֶת לְבָבָם
  choice: os que haviam disposto o coração
  rationale: Mantém a imagem hebraica de orientar ou dedicar interiormente o coração, enquanto o mais-que-perfeito esclarece que essa decisão precedeu a viagem.
- source_word: לְבַקֵּשׁ
  choice: a buscar
  rationale: No contexto religioso, בקש indica procurar a Deus com intenção e devoção; “buscar” é direto e tradicional sem ser arcaico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reproduz de modo claro e direto a construção hebraica.
- source_word: בָּאוּ יְרוּשָׁלִַם
  choice: vieram a Jerusalém
  rationale: בוא pode ser traduzido por “vir” ou “ir” conforme o ponto de vista narrativo; “vieram” toma Jerusalém como centro da cena.
- source_word: לִזְבּוֹחַ
  choice: para oferecer sacrifícios
  rationale: Explicita naturalmente em português a finalidade cultual do infinitivo זבח.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: o Deus de seus pais
  rationale: Conserva o masculino explícito e a ressonância da fórmula pactual hebraica, sem a neutralizar como “antepassados”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta o Tetragrama como nome próprio. “Yahweh” o preserva por transliteração, sem substituí-lo por um título.
- issue: Fórmula pactual אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: o Deus de seus pais
  alternative: o Deus de seus antepassados
  rationale: “Pais” corresponde ao substantivo masculino hebraico e mantém a forma tradicional da expressão, sem excluir o sentido genealógico mais amplo que ela pode carregar.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A divisão em duas frases evita sobrecarregar o longo período hebraico, e a repetição de “vieram” mantém explícito o movimento sem alterar as relações do texto.
