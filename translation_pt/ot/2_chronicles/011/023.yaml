base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/023.yaml
  text: And he acted wisely and distributed some of all his sons throughout all the lands of Judah and Benjamin[a], to all the fortified cities[c][b]; and he gave them abundant provisions and sought many wives for them.
translation:
  language: pt
  text: E ele agiu com sabedoria e distribuiu alguns de seus filhos por todas as regiões de Judá e Benjamim[a], por todas as cidades fortificadas[b]; deu-lhes provisões em abundância e procurou muitas esposas para eles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “demonstrou entendimento” ou “agiu com discernimento”.'
    reason: lexical_alternative
  - marker: b
    text: O sentido provável é que ele distribuiu alguns de seus filhos pelas regiões e entre as cidades fortificadas, não que todos os filhos tenham sido enviados a cada lugar.
    reason: lexical_alternative
  - marker: c
    text: 'Isto é, provavelmente providenciou casamentos para seus filhos; literalmente: “procurou uma multidão de mulheres”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֶן
  choice: agiu com sabedoria
  rationale: O hifil de בין pode expressar a demonstração prática de entendimento ou discernimento. No contexto de administração régia, a expressão comunica uma ação prudente, sem reduzi-la ao sentido meramente cognitivo de “entendeu”.
- source_word: וַיִּפְרֹץ מִכָּל בָּנָיו
  choice: distribuiu seus filhos
  rationale: פרץ pode indicar espalhar-se ou expandir-se. Com a indicação subsequente de regiões e cidades, o contexto aponta para a distribuição geográfica deliberada dos filhos. A formulação portuguesa não sugere que cada filho tenha sido enviado a todos os lugares.
- source_word: לְכָל אַרְצוֹת יְהוּדָה וּבִנְיָמִן
  choice: pelas diversas regiões de Judá e Benjamim
  rationale: אֲרָצוֹת designa aqui áreas ou regiões territoriais, não países distintos. “Diversas regiões” torna natural em português o valor distributivo da expressão hebraica.
- source_word: לְכֹל עָרֵי הַמְּצֻרוֹת
  choice: por todas as cidades fortificadas
  rationale: מְצֻרוֹת qualifica cidades dotadas de fortificações ou usadas como fortalezas. “Cidades fortificadas” é preciso e corrente.
- source_word: וַיִּתֵּן לָהֶם הַמָּזוֹן לָרֹב
  choice: Deu-lhes provisões em abundância
  rationale: מָזוֹן pode significar alimento, sustento ou provisões; neste contexto administrativo, “provisões” abrange adequadamente o suprimento fornecido, enquanto לָרֹב indica abundância.
- source_word: וַיִּשְׁאַל הֲמוֹן נָשִׁים
  choice: procurou para eles muitas mulheres
  rationale: שׁאל significa pedir, buscar ou procurar, e a expressão provavelmente se refere à obtenção ou ao arranjo de casamentos para os filhos. Mantém-se “mulheres”, mais próximo do hebraico נָשִׁים, enquanto “para eles” é explicitado pelo contexto.
