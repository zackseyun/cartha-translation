translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tradução segue equivalência ótima: preserva a sequência narrativa e o teor administrativo do hebraico, mas evita construções artificiais. “Mulheres” mantém a abertura lexical de נָשִׁים, e a nota esclarece o provável contexto matrimonial sem incorporá-lo de modo absoluto ao texto.'
