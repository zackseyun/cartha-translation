revisions:
- from: E ele agiu com sabedoria e distribuiu seus filhos pelas diversas regiões de Judá e Benjamim[a], por todas as cidades fortificadas[b]. Deu-lhes provisões em abundância e procurou para eles muitas mulheres[c].
  to: E ele agiu com sabedoria e distribuiu alguns de seus filhos por todas as regiões de Judá e Benjamim[a], por todas as cidades fortificadas[b]; deu-lhes provisões em abundância e procurou muitas esposas para eles[c].
  rationale: A revisão restaura o sentido partitivo de מִכָּל («alguns de seus filhos») e o alcance universal de לְכָל («todas as regiões»), mantendo a leitura administrativa e geográfica do versículo. «Esposas» torna explícito no texto o sentido matrimonial mais provável no contexto, e a nota conserva a formulação literal hebraica e o caráter inferencial da explicação.
