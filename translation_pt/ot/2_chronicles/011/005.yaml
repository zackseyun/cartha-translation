base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/005.yaml
  text: Rehoboam lived in Jerusalem[a], and he built fortified cities in Judah.
translation:
  language: pt
  text: Roboão morou em Jerusalém e construiu cidades para defesa[a] em Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cidades fortificadas” ou “cidades como fortalezas”; literalmente, “cidades para defesa” ou “para fortificação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: permaneceu
  rationale: O verbo יָשַׁב pode significar sentar-se, habitar ou permanecer. Neste contexto narrativo, “permaneceu” é natural e preserva a ideia de residência continuada em Jerusalém sem sugerir explicitamente um novo assentamento.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: Tradução locativa direta, com a forma portuguesa tradicional do nome da cidade.
- source_word: וַיִּבֶן
  choice: construiu
  rationale: בָּנָה significa propriamente “construir”. A finalidade defensiva é expressa pela frase seguinte, por isso não se traduz o verbo isoladamente como “fortificou”.
- source_word: עָרִים
  choice: cidades
  rationale: É a correspondência usual e adequada para o plural עָרִים neste contexto geográfico e administrativo.
- source_word: לְמָצוֹר
  choice: para defesa
  rationale: A expressão indica a finalidade defensiva ou fortificada das cidades. “Para defesa” mantém a construção funcional do hebraico e evita transformar o verbo “construiu” em “fortificou”.
- source_word: בִּיהוּדָה
  choice: em Judá
  rationale: Tradução direta da expressão locativa que identifica a região onde as cidades foram construídas.
