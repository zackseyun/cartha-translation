  text: וַֽ/יְחַזְּקוּ֙ אֶת מַלְכ֣וּת יְהוּדָ֔ה וַֽ/יְאַמְּצ֛וּ אֶת רְחַבְעָ֥ם בֶּן שְׁלֹמֹ֖ה לְ/שָׁנִ֣ים שָׁל֑וֹשׁ כִּ֣י הָֽלְכ֗וּ בְּ/דֶ֧רֶךְ דָּוִ֛יד וּ/שְׁלֹמֹ֖ה לְ/שָׁנִ֥ים שָׁלֽוֹשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/017.yaml
  text: So they strengthened the kingdom of Judah and strengthened Rehoboam son of Solomon for three years[a], because for three years they walked in the way of David and Solomon.
translation:
  language: pt
  text: Assim, eles fortaleceram o reino de Judá e fortaleceram Roboão, filho de Salomão, durante três anos, pois durante três anos seguiram o caminho de Davi e Salomão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחַזְּקוּ
  choice: consolidaram
  rationale: O piel de חזק expressa tornar forte ou firme. No contexto do reino, “consolidaram” comunica naturalmente o fortalecimento de sua estabilidade sem restringir o sentido à fortificação militar.
- source_word: מַלְכוּת יְהוּדָה
  choice: o reino de Judá
  rationale: מַלְכוּת pode indicar realeza, domínio real ou reino; aqui, “reino de Judá” se ajusta ao contexto político e é claro em português.
- source_word: וַיְאַמְּצוּ
  choice: fortaleceram
  rationale: O piel de אמץ significa tornar forte, fortalecer ou encorajar. Como Roboão é o objeto direto, “fortaleceram Roboão” preserva o sentido amplo sem reduzi-lo a mero encorajamento.
- source_word: רְחַבְעָם בֶּן שְׁלֹמֹה
  choice: Roboão, filho de Salomão
  rationale: Emprega as formas tradicionais dos nomes em português e explicita naturalmente a relação filial com vírgulas de aposição.
- source_word: לְשָׁנִים שָׁלוֹשׁ
  choice: durante três anos
  rationale: A expressão de duração com ל é vertida de forma idiomática; sua repetição no texto hebraico é mantida para conservar a ênfase temporal.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão do fortalecimento anterior. “Pois” expressa com naturalidade a relação causal sem tornar a frase pesada.
- source_word: הָלְכוּ בְּדֶרֶךְ
  choice: seguiram o caminho
  rationale: O hebraísmo descreve conduta. “Seguiram o caminho” mantém a metáfora do caminho em português atual, enquanto evita a formulação menos natural “andaram no caminho”.
- source_word: דָּוִיד וּשְׁלֹמֹה
  choice: de Davi e Salomão
  rationale: Mantém os dois nomes ligados ao único substantivo singular “caminho”, conforme a construção hebraica.
theological_decisions:
- issue: Avaliação do “caminho de Davi e Salomão”
  choice: Manter a expressão sem ampliá-la e limitar explicitamente a avaliação ao período de três anos.
  alternative: Parafrasear como “foram fiéis ao SENHOR como Davi e Salomão”.
  rationale: O versículo apresenta positivamente a conduta daquele período, mas não afirma fidelidade completa ou vitalícia, nem explicita aqui o nome divino. A tradução conserva a tensão histórica e teológica do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A variação “consolidaram/fortaleceram” reflete os dois verbos hebraicos do mesmo campo semântico e evita repetição pesada. A repetição de “durante três anos” foi preservada por corresponder à ênfase do original.
