lexical_decisions:
- source_word: וְ/אֶת
  choice: e
  rationale: A conjunção וְ com o marcador de objeto אֶת dá continuidade à lista iniciada no versículo anterior. Em português, אֶת não é traduzido diretamente; a coordenação é expressa naturalmente com «e».
- source_word: בֵּית צוּר
  choice: Bete-Zur
  rationale: Nome geográfico transliterado segundo uma forma bíblica portuguesa clara e reconhecível, sem traduzir literalmente seus componentes.
- source_word: שׂוֹכוֹ
  choice: Socó
  rationale: Nome geográfico transliterado de modo natural em português; outras tradições ortográficas empregam formas como «Soco» ou «Socó».
- source_word: עֲדֻלָּם
  choice: Adulão
  rationale: Forma tradicional e amplamente reconhecida em português para este topônimo de Judá.
