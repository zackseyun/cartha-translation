  text: And the word of Yahweh came to Shemaiah the man of God, saying,
translation:
  language: pt
  text: 'E a palavra de Yahweh veio a Semaías, homem de Deus, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: E ... veio
  rationale: O wayyiqtol de היה dá sequência à narrativa. Em português, a construção idiomática com “veio” preserva o encadeamento sem recorrer ao mais literal e pesado “e aconteceu”.
- source_word: דְּבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Mantém a fórmula profética reconhecível e a relação de construto do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: שְׁמַעְיָהוּ
  choice: Semaías
  rationale: Emprega a forma portuguesa tradicional e reconhecível do nome hebraico.
- source_word: אִישׁ הָאֱלֹהִים
  choice: homem de Deus
  rationale: Preserva o título profético tradicional; em português, após o nome próprio, a ausência de artigo é natural e não torna a expressão indefinida.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Reproduz a fórmula hebraica que introduz discurso direto e prepara naturalmente os dois-pontos.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino sem o substituir pelo título “SENHOR”; “Jeová” representa uma forma híbrida posterior.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do hebraico sem artificialidade. A abertura com “E” conserva a continuidade narrativa; “Semaías” segue o uso bíblico português corrente.
