  text: וַ/יַּֽעֲמֶד ל/וֹ֙ כֹּֽהֲנִ֔ים לַ/בָּמ֖וֹת וְ/לַ/שְּׂעִירִ֑ים וְ/לָ/עֲגָלִ֖ים אֲשֶׁ֥ר עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/015.yaml
  text: And he appointed for himself priests for the high places[a], for the goat-demons, and for the calves that he had made.
translation:
  language: pt
  text: E constituiu para si sacerdotes para os lugares altos, para os demônios em forma de bode[a] e para os bezerros que havia feito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bodes” ou “sátiros”. O termo hebraico pode designar seres semelhantes a bodes associados ao culto ilícito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֶד
  choice: constituiu
  rationale: Neste contexto causativo, o verbo indica estabelecer ou designar pessoas para uma função, não apenas fazê-las ficar de pé.
- source_word: לּוֹ
  choice: para si
  rationale: Expressa naturalmente que Jeroboão agiu em benefício próprio e estabeleceu seu próprio sacerdócio.
- source_word: כֹּהֲנִים
  choice: sacerdotes
  rationale: Termo português corrente para o ofício religioso indicado pelo hebraico.
- source_word: לַבָּמוֹת
  choice: para os lugares altos
  rationale: Preserva a designação bíblica tradicional de locais de culto, geralmente situados em elevações, sem reduzi-los genericamente a santuários.
- source_word: לַשְּׂעִירִים
  choice: para os demônios em forma de bode
  rationale: No contexto de culto ilícito, o termo provavelmente designa seres ou imagens cultuais semelhantes a bodes. A formulação comunica esse sentido provável sem ocultar a imagem hebraica.
- source_word: וְלָעֲגָלִים
  choice: e para os bezerros
  rationale: Mantém o substantivo concreto do hebraico; o contexto deixa claro que se trata de imagens usadas no culto.
- source_word: אֲשֶׁר עָשָׂה
  choice: que havia feito
  rationale: O mais-que-perfeito indica naturalmente que os objetos cultuais já tinham sido feitos antes da constituição dos sacerdotes.
theological_decisions:
- issue: Sentido de שְׂעִירִים no contexto de culto idólatra
  choice: demônios em forma de bode
  alternative: bodes; sátiros
  rationale: A enumeração de lugares e objetos de culto favorece uma referência a seres ou imagens cultuais com aspecto de bode, e não a animais comuns. A nota preserva as alternativas lexicais sem impor uma identificação mitológica mais específica do que o hebraico permite.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe direta. “Lugares altos” preserva o vocabulário bíblico reconhecível; “demônios em forma de bode” explicita o provável referente cultual e mantém a imagem concreta do hebraico.
