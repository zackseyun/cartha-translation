  text: וַ/יָּבֹ֣א רְחַבְעָם֮ יְרוּשָׁלִַם֒ וַ/יַּקְהֵל֩ אֶת בֵּ֨ית יְהוּדָ֜ה וּ/בִנְיָמִ֗ן מֵאָ֨ה וּ/שְׁמוֹנִ֥ים אֶ֛לֶף בָּח֖וּר עֹשֵׂ֣ה מִלְחָמָ֑ה לְ/הִלָּחֵם֙ עִם יִשְׂרָאֵ֔ל לְ/הָשִׁ֥יב אֶת הַ/מַּמְלָכָ֖ה לִ/רְחַבְעָֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/001.yaml
  text: When Rehoboam came to Jerusalem[a], he assembled the house of Judah and Benjamin, one hundred eighty thousand chosen warriors[b], to fight against Israel in order to restore the kingdom to Rehoboam.
translation:
  language: pt
  text: 'Quando Roboão chegou a Jerusalém, reuniu a casa de Judá e de Benjamim[a]: cento e oitenta mil guerreiros escolhidos[b], para lutar contra Israel e devolver o reino a Roboão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Judá e Benjamim”. Em hebraico, “a casa de Judá e Benjamim”, uma designação coletiva.
    reason: lexical_alternative
  - marker: b
    text: Ou “cento e oitenta mil homens selecionados, aptos para a guerra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: chegou
  rationale: O qal narrativo de בוא indica aqui a chegada de Roboão ao destino, Jerusalém; “chegou” é natural e preciso em português.
- source_word: וַיַּקְהֵל
  choice: reuniu
  rationale: O hifil de קהל significa fazer reunir ou convocar; no contexto, trata-se de mobilização militar.
- source_word: אֶת־בֵּית יְהוּדָה וּבִנְיָמִן
  choice: a casa de Judá e de Benjamim
  rationale: “Casa” preserva a designação coletiva e política do hebraico. A repetição de “de” torna a coordenação mais clara em português sem transformar o singular hebraico em “tribos”.
- source_word: מֵאָה וּשְׁמוֹנִים אֶלֶף
  choice: cento e oitenta mil
  rationale: Representação direta e corrente do numeral hebraico.
- source_word: בָּחוּר עֹשֵׂה מִלְחָמָה
  choice: guerreiros escolhidos
  rationale: בָּחוּר, em contexto militar, pode indicar homens selecionados, e עֹשֵׂה מִלְחָמָה descreve os que fazem guerra. A expressão portuguesa comunica ambas as ideias de modo conciso.
- source_word: לְהִלָּחֵם עִם יִשְׂרָאֵל
  choice: para lutar contra Israel
  rationale: Embora עִם costume significar “com”, com o verbo “lutar” marca aqui a parte adversária; “contra” explicita naturalmente essa relação em português.
- source_word: לְהָשִׁיב אֶת־הַמַּמְלָכָה
  choice: devolver o reino
  rationale: O hifil de שוב expressa fazer retornar. “Devolver” conserva o movimento do reino de volta ao seu anterior governante sem pressupor que a tentativa teve êxito.
- source_word: לִרְחַבְעָם
  choice: a Roboão
  rationale: O לְ marca aquele a quem o reino seria devolvido.
theological_decisions:
- issue: Referente de “Israel” depois da divisão do reino
  choice: Israel
  alternative: o reino do norte; as tribos do norte
  rationale: O texto hebraico chama a entidade adversária simplesmente de “Israel”. Manter o termo preserva a linguagem e a tensão política do cronista, sem acrescentar um rótulo interpretativo.
- issue: Sentido de “devolver o reino a Roboão”
  choice: Manter Roboão na terceira pessoa
  alternative: recuperar o reino para si
  rationale: A repetição do nome está no hebraico e pode refletir a formulação objetiva do narrador. Mantê-la evita converter a frase em perspectiva interior de Roboão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se “casa” como expressão coletiva bíblica, esclarecida em nota; o restante da frase emprega formulações naturais e diretas.
