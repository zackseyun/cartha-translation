  text: וַ/יֶּאֱהַ֨ב רְחַבְעָ֜ם אֶת מַעֲכָ֣ה בַת אַבְשָׁל֗וֹם מִ/כָּל נָשָׁי/ו֙ וּ/פִ֣ילַגְשָׁ֔י/ו כִּ֠י נָשִׁ֤ים שְׁמוֹנֶֽה עֶשְׂרֵה֙ נָשָׂ֔א וּ/פִֽילַגְשִׁ֖ים שִׁשִּׁ֑ים וַ/יּ֗וֹלֶד עֶשְׂרִ֧ים וּ/שְׁמוֹנָ֛ה בָּנִ֖ים וְ/שִׁשִּׁ֥ים בָּנֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/021.yaml
  text: Rehoboam loved Maacah the daughter of Absalom more than all his wives and his concubines[a], for he had taken eighteen wives and sixty concubines, and he fathered twenty-eight sons and sixty daughters.
translation:
  language: pt
  text: Roboão amou Maaca, filha de Absalão[a], mais do que todas as suas esposas e concubinas, pois havia tomado dezoito esposas e sessenta concubinas. Ele gerou vinte e oito filhos e sessenta filhas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “descendente de Absalão”; em contextos genealógicos, o termo hebraico traduzido como “filha” às vezes pode ter sentido mais amplo.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: amava
  rationale: O verbo אהב expressa amor ou afeição; o sentido comparativo vem da expressão seguinte, מִכָּל.
- source_word: בַת אַבְשָׁלוֹם
  choice: filha de Absalão
  rationale: בַת significa normalmente “filha”. Embora possa ter sentido genealógico mais amplo em certos contextos, a tradução principal conserva a formulação direta do hebraico.
- source_word: מִכָּל נָשָׁיו וּפִילַגְשָׁיו
  choice: mais do que todas as suas outras mulheres e concubinas
  rationale: מִכָּל estabelece a comparação. “Outras” torna explícito em português que Maaca fazia parte do conjunto das mulheres de Roboão, sem alterar o sentido. “Concubinas” preserva a categoria social distinta indicada por פִּילַגְשִׁים.
- source_word: כִּי
  choice: pois
  rationale: A conjunção introduz informação explicativa ligada à afirmação anterior.
- source_word: נָשִׁים ... נָשָׂא
  choice: havia tomado dezoito mulheres
  rationale: נשא com נָשִׁים é uma expressão para tomar mulheres por esposas. “Havia tomado” conserva a imagem lexical e apresenta naturalmente a informação de fundo.
- source_word: פִּילַגְשִׁים
  choice: concubinas
  rationale: “Concubinas” é o equivalente preciso e corrente, preservando a distinção existente no hebraico.
- source_word: וַיּוֹלֶד
  choice: gerou
  rationale: Com sujeito masculino, a forma verbal indica que ele se tornou pai; “gerou” é conciso, digno e claro em português bíblico moderno.
- source_word: עֶשְׂרִים וּשְׁמוֹנָה בָּנִים
  choice: vinte e oito filhos
  rationale: Tradução direta da expressão numérica e do substantivo בָּנִים.
- source_word: וְשִׁשִּׁים בָּנוֹת
  choice: sessenta filhas
  rationale: Tradução direta da expressão numérica e do substantivo בָּנוֹת.
theological_decisions:
- issue: Designação genealógica de Maaca como “filha de Absalão”
  choice: Manter “filha de Absalão” no texto principal
  alternative: Entender בַת em sentido genealógico mais amplo, como “descendente” ou, possivelmente, “neta de Absalão”
  rationale: O hebraico diz literalmente “filha de Absalão”. Para não resolver silenciosamente a questão genealógica, o texto preserva essa leitura e a nota registra a possibilidade mais ampla.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A divisão em duas frases evita uma sequência excessivamente longa. “Mulheres” acompanha o uso contextual de נָשִׁים e combina naturalmente com “tomado”; “outras” esclarece a comparação sem excluir Maaca do grupo.
