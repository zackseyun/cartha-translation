base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/012.yaml
  text: And in every city he put shields and spears[a], and he strengthened them very greatly; and Judah and Benjamin belonged to him.
translation:
  language: pt
  text: Em cada cidade[a], pôs escudos e lanças e as fortaleceu muitíssimo. Judá e Benjamim estavam sob seu domínio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “em toda cidade e cidade”, repetição distributiva que ressalta cada cidade individualmente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/כָל עִיר וָ/עִיר
  choice: Em cada cidade
  rationale: A repetição distributiva hebraica, literalmente “em toda cidade e cidade”, é expressa de modo natural em português por “em cada cidade”; a nota registra a forma enfática do original.
- source_word: צִנּוֹת
  choice: escudos
  rationale: Termo militar que designa escudos, possivelmente escudos grandes; a forma genérica evita especificação não exigida pelo contexto.
- source_word: וּ/רְמָחִים
  choice: lanças
  rationale: Equivalente moderno e comum para a arma indicada pelo hebraico.
- source_word: וַֽ/יְחַזְּקֵם
  choice: as fortaleceu
  rationale: O sufixo plural retoma as cidades fortificadas; “fortaleceu” preserva a ideia de torná-las ainda mais fortes sem repetir mecanicamente a linguagem anterior.
- source_word: לְ/הַרְבֵּה מְאֹד
  choice: muitíssimo
  rationale: Reproduz de maneira clara e enfática a forte intensificação do hebraico.
- source_word: וַ/יְהִי ל֖/וֹ יְהוּדָה וּ/בִנְיָמִן
  choice: Judá e Benjamim ficaram sob seu domínio
  rationale: O idioma hebraico indica posse, controle ou lealdade. “Sob seu domínio” comunica naturalmente o sentido político no contexto, sem sugerir propriedade pessoal irrestrita.
theological_decisions:
- issue: Sentido da relação de Judá e Benjamim com Roboão
  choice: ficaram sob seu domínio
  alternative: pertenciam a ele; eram dele
  rationale: A expressão hebraica pode indicar posse ou sujeição. O contexto político favorece domínio ou lealdade, sem necessidade de definir mais precisamente a natureza dessa relação.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural. O pronome feminino plural em “as fortaleceu” explicita que o referente são as cidades. A conjunção inicial foi omitida por fluidez na leitura isolada do versículo, sem perda da continuidade narrativa.
