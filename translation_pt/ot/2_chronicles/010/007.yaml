base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/007.yaml
  text: They spoke to him[a], saying, “If you will be good to this people, and if you please them and speak good words to them[b], then they will be your servants all your days.”
translation:
  language: pt
  text: 'Eles lhe disseram: “Se você for bondoso com este povo, agradá-lo e lhe disser palavras boas, então eles serão seus servos todos os seus dias[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “eles o servirão continuamente”. Literalmente, “todos os dias”; no contexto, todos os seus dias.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּהְיֶה לְטוֹב לְהָעָם הַזֶּה
  choice: for bondoso com este povo
  rationale: A construção היה + לְ + טוֹב exprime ser ou agir de modo benéfico para alguém. “Ser bondoso com” é natural em português e comunica uma atitude favorável sem limitar a expressão a uma única medida política.
- source_word: וּרְצִיתָם
  choice: procurar agradá-lo
  rationale: O verbo רצה com o povo como objeto pode indicar agradá-lo ou tratá-lo favoravelmente. “Procurar agradá-lo” preserva o sentido contextual de conquistar sua boa vontade, enquanto a nota registra a alternativa lexical.
- source_word: וְדִבַּרְתָּ אֲלֵהֶם דְּבָרִים טוֹבִים
  choice: lhe disser palavras boas
  rationale: Mantém a repetição lexical de דבר e a qualificação טוֹבִים, em linguagem compreensível e relativamente próxima da forma hebraica.
- source_word: וְהָיוּ לְךָ עֲבָדִים
  choice: eles serão seus servos
  rationale: No contexto, עֲבָדִים descreve súditos que prestam serviço e lealdade ao rei, não necessariamente escravidão como condição jurídica; “servos” preserva o predicativo nominal.
- source_word: כָּל הַיָּמִים
  choice: para sempre
  rationale: A expressão idiomática significa literalmente “todos os dias” e, neste contexto, comunica serviço contínuo e duradouro. “Para sempre” é a formulação idiomática mais natural, com a alternativa mais formal indicada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com concordância coletiva de “povo” no singular. O tratamento por “você” favorece a legibilidade brasileira sem recorrer a coloquialismos. A tradução preserva a sequência das três ações conciliatórias e a promessa resultante de lealdade política.
