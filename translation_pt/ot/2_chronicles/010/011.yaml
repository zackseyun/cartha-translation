  text: וְ/עַתָּ֗ה אָבִ/י֙ הֶעְמִ֤יס עֲלֵי/כֶם֙ עֹ֣ל כָּבֵ֔ד וַ/אֲנִ֖י אֹסִ֣יף עַֽל עֻלְּ/כֶ֑ם אָבִ֗/י יִסַּ֤ר אֶתְ/כֶם֙ בַּ/שּׁוֹטִ֔ים וַ/אֲנִ֖י בָּֽ/עֲקְרַבִּֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/011.yaml
  text: And now[a], my father made your yoke heavy, but I will add to your yoke. My father disciplined you with whips, but I with scorpions.
translation:
  language: pt
  text: E agora, meu pai impôs sobre vocês um jugo pesado, mas eu acrescentarei ao jugo de vocês. Meu pai os disciplinou com chicotes, mas eu os disciplinarei com escorpiões.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “com chicotes providos de pontas ou farpas”; literalmente, o hebraico diz “com escorpiões”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעְמִיס עֲלֵיכֶם עֹל כָּבֵד
  choice: tornou pesado o jugo de vocês
  rationale: Expressa o causativo de עמס e mantém a imagem concreta do jugo, seguindo de perto a construção hebraica sem perder naturalidade em português.
- source_word: אֹסִיף עַל עֻלְּכֶם
  choice: aumentarei esse jugo
  rationale: Comunica literalmente a ideia de acrescentar ao jugo; o demonstrativo evita uma repetição pesada e deixa claro que se trata do mesmo jugo.
- source_word: יִסַּר
  choice: disciplinou / disciplinarei
  rationale: Preserva o sentido de correção punitiva de יסר. Na segunda oração, o verbo é recuperado por elipse no hebraico; explicitá-lo produz uma frase completa e natural em português.
- source_word: בַּשּׁוֹטִים
  choice: com chicotes
  rationale: Equivalente moderno e claro para instrumentos de açoite.
- source_word: בָּעֲקְרַבִּים
  choice: com escorpiões
  rationale: Mantém no texto principal a palavra hebraica literal e sua imagem ameaçadora, deixando a possível referência a chicotes farpados para a nota.
