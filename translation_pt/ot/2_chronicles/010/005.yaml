  text: And he said to them[a], “Come back to me in three days.” So the people went away.
translation:
  language: pt
  text: 'E ele lhes disse[a]: “Voltem a mim daqui a três dias.” Então o povo foi embora.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “Ainda três dias, e voltem a mim.”'
