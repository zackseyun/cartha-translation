lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ele disse
  rationale: O wayyiqtol de אמר dá continuidade à narrativa; “E ele disse” preserva esse encadeamento sem acrescentar uma nuance discursiva específica.
- source_word: אֲלֵהֶם
  choice: lhes
  rationale: A preposição אֶל com sufixo de terceira pessoa plural indica os destinatários da fala; em português, “lhes disse” é natural e digno.
- source_word: עוֹד שְׁלֹשֶׁת יָמִים
  choice: daqui a três dias
  rationale: A expressão literalmente diz “ainda três dias”, mas, ligada à ordem seguinte, indica o prazo para o retorno. “Daqui a três dias” comunica com clareza essa referência temporal em português.
- source_word: וְשׁוּבוּ
  choice: Voltem
  rationale: Imperativo masculino plural de שוב. “Voltem” exprime de modo natural a ordem de retornar.
- source_word: אֵלַי
  choice: a mim
  rationale: A preposição אֶל com sufixo da primeira pessoa singular especifica o destino do retorno.
- source_word: וַיֵּלֶךְ הָעָם
  choice: Então o povo foi embora
  rationale: O verbo singular concorda com o substantivo coletivo הָעָם. “Foi embora” explicita naturalmente, sem alterar o sentido, que o povo se retirou após receber a ordem; “Então” marca a sequência narrativa.
