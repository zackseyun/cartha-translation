base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/013.yaml
  text: And the king answered them harshly[b][a], and King Rehoboam forsook the counsel of the elders.
translation:
  language: pt
  text: E o rei lhes respondeu com dureza[a]; o rei Roboão abandonou o conselho dos anciãos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “lhes respondeu asperamente”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “rejeitou o conselho dos anciãos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנֵם
  choice: lhes respondeu
  rationale: O verbo ענה indica responder, e o sufixo pronominal de terceira pessoa masculina plural explicita os destinatários; em português, “lhes respondeu” preserva ambos.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Tradução direta de מֶלֶךְ com artigo definido, adequada ao fluxo narrativo.
- source_word: קָשָׁה
  choice: com dureza
  rationale: Embora formalmente adjetival, קָשָׁה modifica aqui a maneira da resposta. “Com dureza” reproduz o sentido de modo natural e digno, sem limitar a palavra apenas ao tom de voz.
- source_word: וַיַּעֲזֹב
  choice: rejeitou
  rationale: עזב significa deixar, abandonar ou pôr de lado. Neste contexto, “rejeitou” comunica claramente que Roboão não seguiu o conselho, preservando em nota a alternativa mais formalmente próxima.
- source_word: הַמֶּלֶךְ רְחַבְעָם
  choice: o rei Roboão
  rationale: A construção identifica o rei pelo nome; “o rei Roboão” é idiomático em português e mantém a aposição titular.
- source_word: עֲצַת
  choice: o conselho
  rationale: עֵצָה designa conselho, parecer ou orientação. Aqui se refere à recomendação dada pelos anciãos.
- source_word: הַזְּקֵנִים
  choice: dos anciãos
  rationale: זקנים designa os homens mais velhos que exerciam função reconhecida de conselheiros; “anciãos” preserva esse papel sociopolítico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A coordenação hebraica foi mantida, mas o segundo וַ foi vertido por ponto e vírgula para evitar uma sequência pesada de dois “e” e deixar clara a progressão narrativa.
