base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/012.yaml
  text: So Jeroboam and all the people came to Rehoboam on the third day[a], just as the king had said, saying, “Return to me on the third day.”
translation:
  language: pt
  text: 'Assim, no terceiro dia, Jeroboão e todo o povo foram até Roboão, exatamente como o rei havia dito: “Voltem a mim no terceiro dia.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: foram
  rationale: בוא pode significar “vir”, “ir” ou “chegar”, conforme o ponto de vista. Em português narrativo, “foram até Roboão” expressa naturalmente o deslocamento em direção a ele.
- source_word: יָרָבְעָם
  choice: Jeroboão
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: וְכָל הָעָם
  choice: e todo o povo
  rationale: עָם designa aqui o conjunto do povo que acompanhava Jeroboão, sem indicar necessariamente uma assembleia formal.
- source_word: אֶל רְחַבְעָם
  choice: até Roboão
  rationale: אֶל marca direção a uma pessoa; “até Roboão” combina de modo natural com o verbo de movimento escolhido.
- source_word: בַּיּוֹם הַשְּׁלִשִׁי
  choice: no terceiro dia
  rationale: Tradução direta e idiomática da expressão temporal hebraica, sem explicitar uma contagem que o texto não explica.
- source_word: כַּאֲשֶׁר
  choice: exatamente como
  rationale: Comunica claramente a correspondência entre a ação do povo e a instrução anterior do rei.
- source_word: דִּבֶּר הַמֶּלֶךְ
  choice: o rei havia dito
  rationale: דבר é o verbo comum para falar ou dizer; o mais-que-perfeito situa naturalmente a fala antes da chegada narrada.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O dois-pontos introduz de modo natural, em português, o conteúdo da fala anterior, sem a rigidez de reproduzir literalmente “dizendo”.
- source_word: שׁוּבוּ אֵלַי
  choice: Voltem a mim
  rationale: שׁוב indica retornar ou voltar; a formulação preserva a direção pessoal expressa por אֵלַי.
