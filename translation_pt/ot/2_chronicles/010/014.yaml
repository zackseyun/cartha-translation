base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/014.yaml
  text: He spoke to them according to the advice of the young men[a], saying, “I will make your yoke heavier, and I will add to it. My father disciplined you with whips, but I with scorpions.”
translation:
  language: pt
  text: 'Ele lhes falou conforme o conselho dos jovens, dizendo: “Tornarei mais pesado o jugo de vocês e lhe acrescentarei ainda mais peso. Meu pai disciplinou vocês com chicotes, mas eu os disciplinarei com escorpiões[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “com chicotes com pontas”, isto é, chicotes providos de pontas afiadas ou farpas; literalmente, o hebraico diz “com escorpiões”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Ele lhes falou
  rationale: דבר é o verbo comum para “falar”. Embora a fala seja uma resposta, “falou” evita explicitar além do hebraico.
- source_word: כַּעֲצַת הַיְלָדִים
  choice: conforme o conselho dos jovens
  rationale: עֵצָה significa “conselho”, e כ indica conformidade. “Jovens” identifica naturalmente os conselheiros mais novos sem sugerir crianças.
- source_word: אַכְבִּיד אֶת עֻלְּכֶם
  choice: Tornarei mais pesado o jugo de vocês
  rationale: O hifil de כבד é causativo, “tornar pesado”. Como o jugo já existe, “mais pesado” expressa naturalmente a intensificação, preservando a metáfora de עֹל.
- source_word: וַאֲנִי אֹסִיף עָלָיו
  choice: e acrescentarei ainda mais a ele
  rationale: יסף com עַל comunica adição ou aumento. O pronome retoma o jugo; “ainda mais” torna clara em português a escalada expressa no contexto.
- source_word: יִסַּר
  choice: disciplinou
  rationale: יסר abrange disciplinar, castigar ou corrigir. “Disciplinou” conserva essa amplitude, embora o contexto envolva coerção física.
- source_word: בַּשּׁוֹטִים
  choice: com chicotes
  rationale: שׁוֹט designa chicote ou açoite. “Chicotes” é claro e corrente.
- source_word: בָּעֲקְרַבִּים
  choice: com escorpiões
  rationale: O substantivo significa literalmente “escorpiões”. A imagem vívida é preservada no texto, enquanto o provável sentido de chicotes cruéis é indicado em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A metáfora do jugo e a imagem literal dos escorpiões foram preservadas; a elipse hebraica na segunda oração foi completada com “disciplinarei” para produzir português natural.
