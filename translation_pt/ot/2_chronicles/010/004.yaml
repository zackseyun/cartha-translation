base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/004.yaml
  text: Your father made our yoke heavy[a]. So now lighten the hard service of your father and his heavy yoke that he put on us[b], and we will serve you.
translation:
  language: pt
  text: “Seu pai tornou duro o nosso jugo.[a] Agora, alivie o duro serviço exigido por seu pai e o pesado jugo que ele colocou sobre nós,[b] e nós o serviremos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tornou severo o nosso jugo”. A expressão descreve a dureza da dominação exercida sobre o povo.'
    reason: lexical_alternative
  - marker: b
    text: “Serviço” refere-se aqui a trabalho ou obrigação impostos pelo governo real; alternativamente, “trabalho”.
    reason: cultural_note
lexical_decisions:
- source_word: הִקְשָׁה
  choice: tornou duro
  rationale: O hifil tem sentido causativo. “Tornou duro” preserva esse valor e a severidade do jugo sem antecipar o adjetivo “pesado” usado depois no hebraico.
- source_word: עֻלֵּנוּ
  choice: o nosso jugo
  rationale: Mantém a imagem concreta do jugo, empregada metaforicamente para a dominação e as obrigações impostas pelo rei.
- source_word: הָקֵל
  choice: alivie
  rationale: O imperativo pede a redução da carga. “Alivie” é natural em português e conserva a relação com a imagem do jugo.
- source_word: מֵעֲבֹדַת אָבִיךָ הַקָּשָׁה
  choice: o duro serviço exigido por seu pai
  rationale: עֲבֹדָה pode indicar serviço, trabalho ou obrigação. No contexto do governo real, “serviço exigido” torna clara a ideia de trabalho ou obrigação imposta, enquanto “duro” representa הַקָּשָׁה.
- source_word: וּמֵעֻלּוֹ הַכָּבֵד
  choice: e o pesado jugo
  rationale: Conserva a metáfora repetida e traduz diretamente כָּבֵד por “pesado”.
- source_word: אֲשֶׁר נָתַן עָלֵינוּ
  choice: que ele colocou sobre nós
  rationale: Reproduz de modo natural a construção hebraica e mantém a imagem de uma carga posta sobre o povo.
- source_word: וְנַעַבְדֶךָּ
  choice: e nós o serviremos
  rationale: Expressa a resposta prometida pelo povo caso Roboão reduza suas obrigações.
- source_word: אָבִיךָ
  choice: seu pai
  rationale: Referência direta a Salomão; a repetição é preservada no versículo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A metáfora do “jugo” foi preservada, bem como a distinção hebraica entre o jugo inicialmente descrito como duro e, depois, como pesado.
