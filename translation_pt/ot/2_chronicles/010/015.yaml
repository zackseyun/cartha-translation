source:
  edition: WLC
  text: וְ/לֹֽא שָׁמַ֥ע הַ/מֶּ֖לֶךְ אֶל הָ/עָ֑ם כִּֽי הָיְתָ֤ה נְסִבָּה֙ מֵ/עִ֣ם הָֽ/אֱלֹהִ֔ים לְמַעַן֩ הָקִ֨ים יְהוָ֜ה אֶת דְּבָר֗/וֹ אֲשֶׁ֤ר דִּבֶּר֙ בְּ/יַד֙ אֲחִיָּ֣הוּ הַ/שִּֽׁלוֹנִ֔י אֶל יָרָבְעָ֖ם בֶּן נְבָֽט־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/015.yaml
  text: So the king did not listen to the people[a], for this turn of events was from God, so that Yahweh might establish his word that he had spoken through Ahijah the Shilonite to Jeroboam son of Nebat.
translation:
  language: pt
  text: Assim, o rei não deu ouvidos ao povo, pois esse rumo dos acontecimentos[a] vinha de Deus, a fim de que Yahweh confirmasse a palavra que havia falado por meio de Aías, o silonita, a Jeroboão, filho de Nebate.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois a causa vinha de Deus”. O substantivo hebraico pode indicar uma mudança de rumo, uma circunstância ou um desdobramento causal.'
    reason: alternativa lexical
lexical_decisions:
- source_word: שָׁמַע
  choice: deu ouvidos a
  rationale: Com אֶל הָעָם, indica dar atenção ao pedido do povo, não apenas ouvir sons. A expressão portuguesa é natural e não chega a explicitar plenamente a ideia de obedecer.
- source_word: נְסִבָּה
  choice: rumo dos acontecimentos
  rationale: O substantivo pode designar uma mudança de rumo, circunstância ou desenvolvimento causal. A escolha comunica o desenrolar providencial da situação sem reduzir o termo simplesmente a “causa”.
- source_word: מֵעִם הָאֱלֹהִים
  choice: vinha de Deus
  rationale: A expressão indica origem divina. O verbo “vinha” integra essa ideia com naturalidade à oração portuguesa.
- source_word: לְמַעַן
  choice: a fim de que
  rationale: Preserva claramente a força de propósito da expressão hebraica.
- source_word: הָקִים
  choice: confirmasse
  rationale: O hifil de קום significa fazer permanecer ou tornar firme. “Confirmasse” é idiomático com “palavra” e permanece mais próximo dessa ideia do que o interpretativo “cumprisse”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: דְּבָרוֹ
  choice: a palavra
  rationale: Mantém a amplitude do hebraico e permite que o contexto a identifique como declaração profética, sem restringi-la a “promessa”.
- source_word: בְּיַד
  choice: por meio de
  rationale: Representa de modo idiomático a função de agência ou mediação exercida pelo profeta.
- source_word: הַשִּׁלוֹנִי
  choice: o silonita
  rationale: Conserva formalmente o gentílico hebraico associado a Siló.
- source_word: בֶּן נְבָט
  choice: filho de Nebate
  rationale: Segue a forma portuguesa convencional de apresentar o patronímico.
theological_decisions:
- issue: Causalidade divina e ação humana
  choice: o rei não deu ouvidos ao povo, pois esse rumo dos acontecimentos vinha de Deus
  alternative: o rei não deu ouvidos ao povo, pois a causa vinha de Deus
  rationale: O texto atribui a Deus a origem do desenrolar dos acontecimentos, mas apresenta a recusa como ação real do rei. A formulação conserva essa tensão sem tornar Deus, além do que o hebraico afirma, o agente gramatical direto da recusa.
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto contém o Tetragrama; a transliteração “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Deu ouvidos” preserva o tom narrativo bíblico sem arcaísmo excessivo; “rumo dos acontecimentos” expressa a ambiguidade lexical central, e a alternativa é registrada em nota.
