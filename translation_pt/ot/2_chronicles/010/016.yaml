  text: וְ/כָל יִשְׂרָאֵ֗ל כִּ֠י לֹא שָׁמַ֣ע הַ/מֶּלֶךְ֮ לָ/הֶם֒ וַ/יָּשִׁ֣יבוּ הָ/עָ֣ם אֶת הַ/מֶּ֣לֶךְ לֵ/אמֹ֡ר מַה לָּ/נוּ֩ חֵ֨לֶק בְּ/דָוִ֜יד וְ/לֹֽא נַחֲלָ֣ה בְּ/בֶן יִשַׁ֗י אִ֤ישׁ לְ/אֹהָלֶ֨י/ךָ֙ יִשְׂרָאֵ֔ל עַתָּ֕ה רְאֵ֥ה בֵיתְ/ךָ֖ דָּוִ֑יד וַ/יֵּ֥לֶךְ כָּל יִשְׂרָאֵ֖ל לְ/אֹהָלָֽי/ו־־־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/016.yaml
  text: And all Israel[a], because the king did not listen to them, answered the king, saying, “What share do we have in David? We have no inheritance in the son of Jesse. Each man to your tents, O Israel! Now see to your own house[b], David.” So all Israel went to their tents.
translation:
  language: pt
  text: 'Como o rei não lhes deu ouvidos, todo o Israel respondeu ao rei: “Que parte temos em Davi? Não temos herança no filho de Jessé. Cada um para as suas tendas, ó Israel![a] Agora cuide da sua própria casa, Davi!” Então todo o Israel foi para as suas tendas.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “cada um para as suas tendas”. A expressão é um chamado para que todos se dispersem e voltem ao seu próprio lugar.
    reason: cultural_note
  - marker: b
    text: O hebraico traz literalmente “para as tendas dele”, usando o singular depois do nome coletivo “todo o Israel”. O português expressa naturalmente a ideia distributiva com “suas tendas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: deu ouvidos
  rationale: No contexto, o verbo indica atender ao pedido do povo, não apenas escutar sons. A expressão portuguesa comunica esse sentido de acatamento.
- source_word: וַיָּשִׁיבוּ
  choice: respondeu
  rationale: A forma verbal integra a expressão idiomática hebraica para dar uma resposta. O singular concorda naturalmente com o coletivo “todo o Israel”.
- source_word: חֵלֶק
  choice: parte
  rationale: Mantém a metáfora de participação ou vínculo e o tom de repúdio político da pergunta retórica.
- source_word: נַחֲלָה
  choice: herança
  rationale: Preserva a imagem familiar e pactual de uma porção recebida, sem reduzir a frase a uma declaração política moderna.
- source_word: בְּבֶן יִשַׁי
  choice: no filho de Jessé
  rationale: Conserva, em português legível, a construção metafórica de ter herança ou participação em alguém e em sua linhagem.
- source_word: אִישׁ לְאֹהָלֶיךָ
  choice: Cada um para as suas tendas
  rationale: “Cada um” reproduz a força distributiva do substantivo masculino singular, enquanto “tendas” mantém a imagem histórica e o idioma de dispersão.
- source_word: רְאֵה בֵיתְךָ
  choice: cuide da sua própria casa
  rationale: Expressa a ordem idiomática para Davi tratar dos próprios interesses ou de sua dinastia; “casa” preserva a metáfora hebraica.
- source_word: לְאֹהָלָיו
  choice: para as suas tendas
  rationale: O hebraico usa uma forma singular possessiva após o coletivo “todo o Israel”; o português emprega naturalmente o possessivo distributivo no plural.
theological_decisions:
- issue: Fórmula de repúdio à casa de Davi
  choice: Que parte temos em Davi? Não temos herança no filho de Jessé.
  alternative: Não temos nada a ver com Davi nem compromisso com o filho de Jessé.
  rationale: A redação escolhida preserva as metáforas políticas, familiares e pactuais do hebraico, sem explicar em excesso nem transformar a fala em um slogan contemporâneo.
- issue: Sentido de בֵיתְךָ (“sua casa”)
  choice: sua própria casa
  alternative: sua própria dinastia
  rationale: “Casa” pode abranger família, interesses e dinastia. Mantê-la no texto conserva essa amplitude e evita resolver uma ambiguidade legítima.
- issue: Substantivo distributivo אִישׁ
  choice: Cada um
  alternative: Cada homem
  rationale: Em português, “cada um” preserva a distribuição individual exigida pelo hebraico e funciona naturalmente como chamado dirigido ao conjunto de Israel, sem afirmar mais sobre gênero do que o contexto requer.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe inicial foi reorganizada para fluência, sem acrescentar a ideia de que Israel “viu” algo, ausente no texto da WLC. As imagens de “parte”, “herança”, “casa” e “tendas” foram mantidas por seu valor literário e histórico.
