  rationale: Preserva a expressão coletiva do hebraico, que designa o conjunto do povo de Israel.
- source_word: לְהַמְלִיךְ אֹתוֹ
  choice: para fazê-lo rei
  rationale: Traduz a construção causativa de מלך com finalidade, em formulação clara e corrente.
