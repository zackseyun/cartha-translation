base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/017.yaml
  text: But Rehoboam reigned over the children of Israel who lived in the cities of Judah[a].
translation:
  language: pt
  text: Mas Roboão reinou sobre os filhos de Israel que moravam nas cidades de Judá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os filhos de Israel que moravam nas cidades de Judá”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי יִשְׂרָאֵל
  choice: Mas os filhos de Israel
  rationale: A conjunção marca o contraste com a rebelião mencionada no contexto anterior, por isso foi traduzida por “Mas”. A expressão foi mantida de modo relativamente formal como “os filhos de Israel”, preservando a designação hebraica.
- source_word: הַיֹּשְׁבִים
  choice: que moravam
  rationale: O particípio de ישב indica residência contínua; “moravam” é natural em português moderno e adequado ao contexto narrativo passado.
- source_word: בְּעָרֵי יְהוּדָה
  choice: nas cidades de Judá
  rationale: Tradução locativa direta que preserva a referência geográfica e a relação genitiva.
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: O verbo מלך descreve aqui o exercício da realeza de Roboão sobre a população que permaneceu sob seu domínio.
- source_word: עֲלֵיהֶם
  choice: sobre
  rationale: A preposição על com sufixo pronominal expressa domínio. Em português, o referente pode ser antecipado naturalmente em “reinou sobre os filhos de Israel”, sem repetição de “eles”.
- source_word: רְחַבְעָם
  choice: Roboão
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
