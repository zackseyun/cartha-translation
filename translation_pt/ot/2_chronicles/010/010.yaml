  text: וַ/יְדַבְּר֣וּ אִתּ֗/וֹ הַ/יְלָדִים֙ אֲשֶׁ֨ר גָּדְל֣וּ אִתּ/וֹ֮ לֵ/אמֹר֒ כֹּֽה תֹאמַ֡ר לָ/עָם֩ אֲשֶׁר דִּבְּר֨וּ אֵלֶ֜י/ךָ לֵ/אמֹ֗ר אָבִ֨י/ךָ֙ הִכְבִּ֣יד אֶת עֻלֵּ֔/נוּ וְ/אַתָּ֖ה הָקֵ֣ל מֵ/עָלֵ֑י/נוּ כֹּ֚ה תֹּאמַ֣ר אֲלֵ/הֶ֔ם קָֽטָנִּ֥/י עָבָ֖ה מִ/מָּתְנֵ֥י אָבִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/010.yaml
  text: The young men who had grown up with him spoke to him[a], saying, “This is what you shall say to the people who spoke to you, saying, ‘Your father made our yoke heavy, but you make it lighter for us.’ Thus you shall say to them[b], ‘My little finger is thicker than my father’s waist.’”
translation:
  language: pt
  text: 'Os jovens que haviam crescido com ele lhe disseram: “Isto é o que você dirá ao povo que lhe falou: ‘Seu pai tornou pesado o nosso jugo, mas torne-o mais leve para nós.’ Assim você lhes dirá: ‘Meu dedo mindinho[a] é mais grosso que a cintura[b] de meu pai.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “minha pequenez”; a expressão é entendida idiomaticamente como “meu dedo mindinho”.
    reason: lexical_alternative
  - marker: b
    text: Ou “os lombos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְלָדִים
  choice: os jovens
  rationale: No contexto da corte e com a explicação de que cresceram com Roboão, o termo designa seus contemporâneos mais jovens, não crianças.
- source_word: גָּדְלוּ אִתּוֹ
  choice: haviam crescido com ele
  rationale: Expressa de modo natural a criação e o amadurecimento compartilhados com Roboão.
- source_word: כֹּה תֹאמַר
  choice: Isto é o que você dirá / Assim você lhes dirá
  rationale: Preserva a fórmula diretiva hebraica; a leve variação em português evita rigidez sem alterar o sentido.
- source_word: אָבִיךָ הִכְבִּיד אֶת עֻלֵּנוּ
  choice: Seu pai tornou pesado o nosso jugo
  rationale: Mantém a metáfora concreta do jugo e o sentido causativo de tornar pesado.
- source_word: הָקֵל מֵעָלֵינוּ
  choice: deve torná-lo mais leve sobre nós
  rationale: Retém o jugo como objeto implícito e procura conservar a imagem espacial de algo colocado sobre o povo.
- source_word: קָטָנִּי
  choice: meu dedo mindinho
  rationale: Traduz o sentido idiomático tradicional da expressão elíptica, esclarecendo em nota sua forma literalmente incomum.
- source_word: עָבָה
  choice: é mais grosso que
  rationale: Comunica diretamente a ideia de espessura e a comparação marcada no hebraico.
- source_word: מִמָּתְנֵי אָבִי
  choice: que a cintura de meu pai
  rationale: Cintura é uma equivalência atual e clara para a região corporal indicada por מָתְנַיִם, sem eliminar a alternativa 'lombos'.
