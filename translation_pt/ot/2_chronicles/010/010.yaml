    issue: “mas você deve torná-lo mais leve sobre nós”
    rationale: O hebraico הָקֵל é imperativo (“torne/alivie”), e “sobre nós” soa calcado e pouco idiomático em português. “Torne-o mais leve para nós” transmite naturalmente o pedido de redução do jugo.
  - severity: low
    issue: 'Nota a: “minha pequenez” ou “meu pequeno”'
    rationale: “Meu pequeno” não é uma apresentação lexical literal suficientemente segura para קָטָנִּי neste contexto. A nota pode registrar a literalidade incomum sem introduzir uma alternativa potencialmente enganosa.
