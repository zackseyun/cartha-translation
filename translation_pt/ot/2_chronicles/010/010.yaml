  to: 'Os jovens que haviam crescido com ele lhe disseram: “Isto é o que você dirá ao povo que lhe falou: ‘Seu pai tornou pesado o nosso jugo, mas torne-o mais leve para nós.’ Assim você lhes dirá: ‘Meu dedo mindinho[a] é mais grosso que a cintura[b] de meu pai.’”'
