  naturalness: A separação em duas frases e “Roboão perguntou” são aceitáveis, mas a oração “enquanto ele ainda estava vivo” após “Salomão, seu pai” tem um pronome potencialmente menos claro do que a repetição do nome. “Estavam a serviço de Salomão” é mais natural e internacionalmente compreensível do que “serviam diante de Salomão”.
