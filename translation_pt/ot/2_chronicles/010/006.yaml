base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/006.yaml
  text: Then King Rehoboam consulted the elders who had stood before Solomon his father while he was still alive[a], saying[b], “How do you advise me to answer this people?”
translation:
  language: pt
  text: 'Então o rei Roboão consultou os anciãos que haviam estado a serviço de Salomão, seu pai,[a] quando Salomão ainda estava vivo. Roboão perguntou: “Como vocês me aconselham a responder a este povo?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “que estavam de pé diante de Salomão”. A expressão também pode indicar que os anciãos o assistiam ou o serviam oficialmente.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “devolver uma palavra a este povo”; trata-se de uma expressão idiomática que significa dar uma resposta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: consultou
  rationale: O nifal de יעץ indica buscar conselho junto a outras pessoas; “consultou” expressa isso de modo natural e preciso.
- source_word: הַזְּקֵנִים
  choice: os anciãos
  rationale: O termo designa homens mais velhos com função de liderança ou aconselhamento; “anciãos” preserva essa dimensão social e oficial.
- source_word: אֲשֶׁר הָיוּ עֹמְדִים לִפְנֵי
  choice: que haviam servido diante de
  rationale: A expressão literalmente descreve estar de pé diante de alguém e, neste contexto cortesão, implica estar a seu serviço ou assisti-lo oficialmente. A formulação mantém parte da imagem hebraica e comunica sua função.
- source_word: שְׁלֹמֹה אָבִיו
  choice: Salomão, seu pai
  rationale: Conserva a aposição do hebraico em ordem natural no português.
- source_word: בִּהְיוֹתוֹ חַי
  choice: enquanto ele ainda estava vivo
  rationale: Expressa com naturalidade a circunstância temporal referente ao período de vida de Salomão.
- source_word: אֵיךְ אַתֶּם נוֹעָצִים
  choice: Como vocês me aconselham
  rationale: O particípio solicita a orientação dos anciãos. O pronome “me”, implícito no contexto, torna a pergunta natural em português sem alterar o sentido.
- source_word: לְהָשִׁיב לָעָם הַזֶּה דָּבָר
  choice: a responder a este povo
  rationale: A construção hebraica significa literalmente “devolver uma palavra a este povo”, idioma que neste contexto equivale a dar uma resposta.
