translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por construções naturais ao leitor brasileiro. A repetição de “Roboão” após a primeira frase evita que o pronome seja confundido com Salomão. Os marcadores das notas foram posicionados junto às expressões às quais efetivamente se referem.
