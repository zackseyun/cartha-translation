base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/003.yaml
  text: So they sent and called for him[a], and Jeroboam and all Israel came and spoke to Rehoboam, saying,
translation:
  language: pt
  text: 'Então mandaram chamá-lo[a]. Jeroboão e todo o Israel vieram e falaram a Roboão, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “enviaram um recado e o convocaram”. O hebraico deixa implícito o objeto do verbo “enviaram”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ וַיִּקְרְאוּ לוֹ
  choice: mandaram chamá-lo
  rationale: A combinação dos dois verbos expressa naturalmente em português o envio implícito de uma mensagem ou de mensageiros para convocar Jeroboão, sem especificar no texto aquilo que o hebraico deixa implícito.
- source_word: וַיָּבֹא
  choice: vieram
  rationale: Embora o verbo hebraico esteja no singular, o sujeito composto expresso em seguida inclui Jeroboão e todo o Israel; o plural é a concordância natural em português.
- source_word: יָרָבְעָם וְכָל יִשְׂרָאֵל
  choice: Jeroboão e todo o Israel
  rationale: Preserva a expressão nacional e pactual 'todo o Israel', sem reduzi-la simplesmente a 'todos os israelitas'.
- source_word: וַיְדַבְּרוּ אֶל רְחַבְעָם
  choice: falaram a Roboão
  rationale: Reproduz de maneira digna e direta a construção hebraica de falar a alguém.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Mantém a fórmula hebraica que introduz a fala direta no versículo seguinte; os dois-pontos tornam essa função clara em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação 'mandaram chamá-lo' é idiomática, enquanto a nota preserva a elipse e a sequência verbal do hebraico.
