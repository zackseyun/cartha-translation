id: 2CH.10.18
reference: 2 Chronicles 10:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֞ח הַ/מֶּ֣לֶךְ רְחַבְעָ֗ם אֶת הֲדֹרָם֙ אֲשֶׁ֣ר עַל הַ/מַּ֔ס וַ/יִּרְגְּמוּ ב֧/וֹ בְנֵֽי יִשְׂרָאֵ֛ל אֶ֖בֶן וַ/יָּמֹ֑ת וְ/הַ/מֶּ֣לֶךְ רְחַבְעָ֗ם הִתְאַמֵּץ֙ לַֽ/עֲל֣וֹת בַּ/מֶּרְכָּבָ֔ה לָ/נ֖וּס יְרוּשָׁלִָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/018.yaml
  text: Then King Rehoboam sent Hadoram[a], who was over the forced labor, but the sons of Israel stoned him with stones, and he died[d][c][b]. And King Rehoboam strengthened himself to get up into the chariot to flee to Jerusalem.
translation:
  language: pt
  text: Então o rei Roboão enviou Hadorão[a], encarregado dos trabalhos forçados[b]. Mas os israelitas[c] o apedrejaram, e ele morreu. O rei Roboão reuniu forças[d] para subir no carro e fugir para Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Hadorão”; o relato paralelo em 1 Reis 12:18 traz “Adorão”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “encarregado do trabalho obrigatório”. O termo hebraico se refere a serviço laboral imposto.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “os filhos de Israel”, expressão hebraica que aqui designa os israelitas.'
    reason: lexical_alternative
  - marker: d
    text: 'Ou, conforme o sentido contextual: “apressou-se”. Mais literalmente, o hebraico diz que Roboão “se fortaleceu” para subir no carro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: enviou
  rationale: Equivalente narrativo direto e natural de שׁלח.
- source_word: הַמֶּלֶךְ רְחַבְעָם
  choice: o rei Roboão
  rationale: Segue a ordem idiomática do português para título e nome.
- source_word: הֲדֹרָם
  choice: Hadorão
  rationale: Translitera a forma própria de Crônicas e emprega a terminação tradicional portuguesa; a forma divergente do paralelo é registrada em nota.
- source_word: אֲשֶׁר עַל הַמַּס
  choice: encarregado dos trabalhos forçados
  rationale: מַס designa serviço laboral imposto, não simplesmente tributo monetário; a formulação é clara e atual.
- source_word: וַיִּרְגְּמוּ בוֹ ... אֶבֶן
  choice: o apedrejaram
  rationale: O verbo português já comunica o uso de pedras. Evita o pleonasmo pouco natural “apedrejaram com pedras” sem perder a ação concreta do hebraico.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os israelitas
  rationale: Traduz naturalmente a designação nacional idiomática “filhos de Israel”; a forma literal é preservada em nota.
- source_word: וַיָּמֹת
  choice: e ele morreu
  rationale: Mantém a coordenação narrativa simples e explicita naturalmente o sujeito em português.
- source_word: הִתְאַמֵּץ
  choice: reuniu forças
  rationale: Preserva a ideia reflexiva de firmar-se ou mobilizar forças, própria do hitpael de אמץ, sem substituí-la silenciosamente por um verbo de velocidade.
- source_word: לַעֲלוֹת בַּמֶּרְכָּבָה
  choice: para subir no carro
  rationale: Representa de modo conciso o movimento expresso por עלה; “carro” é a designação bíblica corrente para o veículo puxado por animais.
- source_word: לָנוּס יְרוּשָׁלָם
  choice: e fugir para Jerusalém
  rationale: נוּס expressa fuga; a coordenação dos dois infinitivos é natural em português.
theological_decisions:
- issue: Sentido contextual de הִתְאַמֵּץ
  choice: reuniu forças
  alternative: apressou-se
  rationale: O contexto implica urgência, mas a raiz hebraica indica fortalecimento ou esforço, não velocidade de maneira explícita. A tradução mantém essa tensão lexical, e a leitura contextual é indicada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi levemente segmentada para clareza narrativa. Preservou-se a nuance incomum de הִתְאַמֵּץ por meio de “reuniu forças”, enquanto as alternativas relevantes e a forma literal da designação nacional foram mantidas em notas.
