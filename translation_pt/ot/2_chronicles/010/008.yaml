base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/008.yaml
  text: But he abandoned the advice of the elders that they had given him[a], and consulted with the young men who had grown up with him, who stood before him.
translation:
  language: pt
  text: Mas ele rejeitou o conselho que os anciãos lhe haviam dado e consultou os jovens que haviam crescido com ele e estavam a seu serviço.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “estavam de pé diante dele”, expressão da corte que pode significar que o serviam ou o assistiam.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: rejeitou
  rationale: Neste contexto, עזב indica que Roboão deixou de seguir o conselho dos anciãos em favor de outro; “rejeitou” comunica essa decisão com clareza em português atual.
- source_word: עֲצַת
  choice: o conselho
  rationale: עֵצָה designa orientação ou conselho; “conselho” é natural e preserva o tom deliberativo da cena.
- source_word: הַזְּקֵנִים
  choice: os anciãos
  rationale: O termo aponta tanto para a idade quanto para a posição desses conselheiros experientes; “anciãos” conserva ambas as associações.
- source_word: אֲשֶׁר יְעָצֻהוּ
  choice: que ... lhe haviam dado
  rationale: A formulação evita repetir o verbo “aconselhar” depois do substantivo “conselho” e expressa naturalmente a anterioridade da orientação recebida.
- source_word: וַיִּוָּעַץ אֶת
  choice: consultou
  rationale: O nifal descreve a ação de buscar ou trocar conselho com alguém. Em português, “consultou” admite naturalmente o objeto pessoal e mantém o sentido.
- source_word: הַיְלָדִים
  choice: os jovens
  rationale: Embora יֶלֶד possa indicar meninos ou crianças, aqui se refere aos contemporâneos adultos do rei que cresceram com ele; “jovens” evita uma leitura infantil inadequada.
- source_word: גָּדְלוּ אִתּוֹ
  choice: haviam crescido com ele
  rationale: A expressão descreve a criação compartilhada em período anterior à consulta; o mais-que-perfeito composto torna clara essa relação temporal.
- source_word: הָעֹמְדִים לְפָנָיו
  choice: estavam a seu serviço
  rationale: Literalmente, “estavam de pé diante dele”; no contexto da corte, a expressão funciona como idioma para servir ou assistir o rei. A tradução idiomática é mais clara, enquanto a imagem literal é preservada em nota.
