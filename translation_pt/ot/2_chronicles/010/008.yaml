  source_fidelity: 'O texto traduz adequadamente a sequência hebraica: Roboão rejeita/deixa o conselho dos anciãos, consulta os jovens que cresceram com ele e que exerciam função diante dele. “Rejeitou” é uma contextualização legítima de וַיַּעֲזֹב, e “consultou os jovens” reproduz bem a construção de consulta com esses jovens.'
