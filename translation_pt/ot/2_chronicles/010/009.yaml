base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/009.yaml
  text: And he said to them[a], “What do you advise, so that we may answer this people who have spoken to me, saying, ‘Lighten the yoke that your father put on us’?”
translation:
  language: pt
  text: 'E ele lhes disse: “O que vocês aconselham, para que respondamos a este povo, que me falou: ‘Alivie o jugo que seu pai impôs sobre nós’?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: E ele lhes disse
  rationale: Mantém o encadeamento narrativo do wayyiqtol e introduz naturalmente a fala em português.
- source_word: מָה אַתֶּם נוֹעָצִים
  choice: Que vocês aconselham
  rationale: Expressa o pedido de conselho de modo atual e claro, preservando o valor consultivo de יעץ.
- source_word: וְנָשִׁיב דָּבָר
  choice: para que respondamos
  rationale: Traduz idiomaticamente a ideia de dar uma resposta; “para que” comunica bem a nuance contextual de finalidade.
- source_word: הָעָם הַזֶּה
  choice: este povo
  rationale: Preserva o coletivo singular do hebraico e soa natural no registro narrativo.
- source_word: דִּבְּרוּ אֵלַי
  choice: me falou
  rationale: A concordância singular acompanha o substantivo coletivo “povo” e liga a fala anterior à deliberação presente.
- source_word: לֵאמֹר
  choice: '[introdução direta da citação]'
  rationale: Em português, os dois-pontos introduzem naturalmente o conteúdo citado, sem exigir o hebraísmo “dizendo”.
- source_word: הָקֵל מִן הָעֹל
  choice: Alivie o jugo
  rationale: Conserva a metáfora concreta do jugo e comunica a ordem de torná-lo menos pesado.
- source_word: נָתַן ... עָלֵינוּ
  choice: impôs sobre nós
  rationale: Expressa com naturalidade a imposição do jugo e preserva sua dimensão de domínio ou trabalho oneroso.
- source_word: אָבִיךָ
  choice: seu pai
  rationale: Tradução direta e natural do possessivo dirigido a Roboão.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora do “jugo” foi preservada no texto; evitou-se uma nota, pois a imagem é inteligível e não há variante que exija esclarecimento. O tratamento “vocês” torna explícito o plural hebraico sem regionalismo excessivo.
