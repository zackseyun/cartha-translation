base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/019.yaml
  text: So Israel has been in rebellion against the house of David to this day[a].
translation:
  language: pt
  text: Assim, Israel permanece em rebelião contra a casa de Davi até hoje.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Assim, Israel se rebelou contra a casa de Davi e continua assim até hoje”. O verbo hebraico pode ser traduzido como um passado simples (“rebelou-se”) ou de modo a destacar o estado contínuo da rebelião.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשְׁעוּ
  choice: permanece em rebelião
  rationale: O verbo פשע expressa rebelião ou revolta contra uma autoridade. Com a expressão temporal “até hoje”, esta formulação comunica naturalmente em português o estado resultante e continuado, sem reduzir o sentido a mera separação política.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Aqui, “Israel” designa coletivamente as tribos do norte, em contraste com a dinastia davídica. O nome é preservado sem explicitação interpretativa no texto principal.
- source_word: בְּבֵית דָּוִיד
  choice: contra a casa de Davi
  rationale: Com פשע, a preposição בְּ pode indicar aquele contra quem se dá a rebelião. “Casa de Davi” preserva o sentido dinástico da expressão hebraica.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até hoje
  rationale: É a forma idiomática e corrente em português para indicar que a situação se prolongava até o presente do narrador.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção no presente evita a forma pouco natural “tem estado em rebelião” e ressalta a continuidade indicada por “até hoje”. O marcador [a] aparece no texto principal.
