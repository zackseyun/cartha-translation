source:
  edition: WLC
  text: וַ/יְהִ֞י כִּ/שְׁמֹ֨עַ יָרָבְעָ֤ם בֶּן נְבָט֙ וְ/ה֣וּא בְ/מִצְרַ֔יִם אֲשֶׁ֣ר בָּרַ֔ח מִ/פְּנֵ֖י שְׁלֹמֹ֣ה הַ/מֶּ֑לֶךְ וַ/יָּ֥שָׁב יָרָבְעָ֖ם מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/002.yaml
  text: And when Jeroboam son of Nebat heard it (for he was in Egypt[a], where he had fled from before King Solomon)[b], Jeroboam returned from Egypt.
translation:
  language: pt
  text: Quando Jeroboão, filho de Nebate, soube disso[a] — ele estava no Egito, para onde havia fugido do rei Salomão[b] —, voltou do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ouviu falar disso”. O hebraico não declara explicitamente o que Jeroboão ouviu; o conteúdo é fornecido pelo contexto.
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “da presença do rei Salomão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Quando ... soube
  rationale: A construção com וַיְהִי e o infinitivo de שׁמע introduz uma oração temporal. Em português atual, “Quando ... soube” transmite naturalmente a progressão narrativa sem o pouco idiomático “E aconteceu que, ao ouvir”.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jeroboão, filho de Nebate
  rationale: Empregam-se as formas tradicionais dos nomes em português, e a relação patronímica é expressa de modo direto.
- source_word: שְׁמֹעַ
  choice: soube disso
  rationale: O hebraico não declara o objeto do verbo; “disso” retoma o acontecimento do contexto e produz uma frase natural, enquanto a nota preserva a ausência do objeto explícito.
- source_word: וְהוּא בְמִצְרַיִם
  choice: ele estava no Egito
  rationale: A oração fornece informação de fundo e é apresentada entre travessões para deixar clara sua função parentética.
- source_word: אֲשֶׁר בָּרַח מִפְּנֵי שְׁלֹמֹה הַמֶּלֶךְ
  choice: para onde havia fugido do rei Salomão
  rationale: אֲשֶׁר retoma o Egito como destino da fuga; o mais-que-perfeito situa a fuga antes dos acontecimentos narrados. “Fugido do rei Salomão” comunica em português corrente o sentido contextual de מִפְּנֵי, cuja forma mais literal é registrada em nota.
- source_word: וַיָּשָׁב
  choice: voltou
  rationale: Neste contexto, שׁוב indica retorno geográfico, não arrependimento nem restauração em sentido teológico.
- source_word: מִמִּצְרָיִם
  choice: do Egito
  rationale: A preposição מִן indica o lugar de origem do retorno.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Os travessões delimitam a informação parentética sem alterar a sequência narrativa. Evitou-se repetir “Jeroboão” na oração principal, pois o sujeito permanece inequívoco em português.
