  text: וְ/עַל יָד֡/וֹ עֵ֣דֶן וּ֠/מִנְיָמִן וְ/יֵשׁ֨וּעַ וּֽ/שְׁמַֽעְיָ֜הוּ אֲמַרְיָ֧הוּ וּ/שְׁכַנְיָ֛הוּ בְּ/עָרֵ֥י הַ/כֹּהֲנִ֖ים בֶּ/אֱמוּנָ֑ה לָ/תֵ֤ת לַ/אֲחֵי/הֶם֙ בְּ/מַחְלְק֔וֹת כַּ/גָּד֖וֹל כַּ/קָּטָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/015.yaml
  text: Under his authority were Eden[a], Miniamin, Jeshua, Shemaiah, Amariah, and Shecaniah, in the cities of the priests, faithfully to distribute to their brothers by divisions[c][b], to great and small alike.
translation:
  language: pt
  text: Sob sua autoridade[a] estavam Éden, Miniamim, Jesua, Semaías, Amarias e Secanias, nas cidades dos sacerdotes, para distribuir com fidelidade aos seus irmãos[b], segundo as divisões[c], tanto aos grandes como aos pequenos[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao seu lado” ou “sob seus cuidados”; a expressão hebraica pode indicar atuação, supervisão ou autoridade.
    reason: lexical_alternative
  - marker: b
    text: “Seus irmãos” refere-se aos demais integrantes da comunidade sacerdotal.
    reason: cultural_note
  - marker: c
    text: Isto é, conforme os grupos ou turnos organizados.
    reason: lexical_clarification
  - marker: d
    text: A expressão pode se referir a posição ou importância, e também pode incluir a ideia de mais velhos e mais novos.
    reason: ambiguity_note
lexical_decisions:
- source_word: וְעַל־יָדוֹ
  choice: Sob sua autoridade
  rationale: A expressão idiomática pode indicar atuação, supervisão ou autoridade. No contexto administrativo, esta formulação é natural e mantém a relação hierárquica sem tornar a imagem de “mão” excessivamente literal.
- source_word: עֵדֶן וּמִנְיָמִן וְיֵשׁוּעַ וּשְׁמַעְיָהוּ אֲמַרְיָהוּ וּשְׁכַנְיָהוּ
  choice: Éden, Miniamim, Jesua, Semaías, Amarias e Secanias
  rationale: Os nomes pessoais são transliterados em formas reconhecíveis e naturais em português.
- source_word: בְּעָרֵי הַכֹּהֲנִים
  choice: nas cidades dos sacerdotes
  rationale: Reproduz com clareza a relação genitiva do hebraico.
- source_word: בֶּאֱמוּנָה
  choice: com fidelidade
  rationale: Neste contexto, o termo caracteriza o modo confiável e fiel de realizar a tarefa administrativa.
- source_word: לָתֵת
  choice: para distribuir
  rationale: Embora o verbo básico signifique “dar”, o contexto trata da entrega organizada de porções; “distribuir” explicita adequadamente essa função.
- source_word: לַאֲחֵיהֶם
  choice: aos seus irmãos
  rationale: Mantém a expressão literal do hebraico; no contexto, são os demais integrantes da comunidade sacerdotal.
- source_word: בְּמַחְלְקוֹת
  choice: segundo as divisões
  rationale: O substantivo designa grupos ou turnos organizados; “segundo as divisões” indica que a distribuição seguia essa organização.
- source_word: כַּגָּדוֹל כַּקָּטָן
  choice: tanto aos grandes como aos pequenos
  rationale: Preserva a forma inclusiva do idioma hebraico sem decidir se a distinção principal é de posição ou de idade.
theological_decisions:
- issue: Identidade de “seus irmãos”
  choice: Manter “seus irmãos” no texto e esclarecer a referência em nota
  alternative: Traduzir diretamente como “seus companheiros sacerdotes”
  rationale: A formulação literal preserva o vínculo fraterno expresso no hebraico, enquanto a nota fornece o sentido contextual sem introduzir uma especificação maior do que o texto.
- issue: Sentido de “grandes” e “pequenos”
  choice: Preservar a expressão ampla “grandes” e “pequenos”
  alternative: Interpretar como “mais velhos e mais novos” ou “superiores e inferiores”
  rationale: O hebraico pode abranger idade, posição ou importância; a tradução não deve resolver silenciosamente essa ambiguidade.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com formas de nomes legíveis para o público brasileiro. A sintaxe segue o movimento administrativo do hebraico sem reproduzir sua ordem de palavras de modo artificial. As notas preservam as ambiguidades reais da expressão de autoridade, da organização em divisões e da oposição entre grandes e pequenos.
