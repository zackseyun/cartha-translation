base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/006.yaml
  text: And the people of Israel and Judah who lived in the cities of Judah also brought the tithe of cattle and sheep[a], and the tithe of the holy things consecrated to Yahweh their God, and they laid them in heaps[b], heap upon heap.
translation:
  language: pt
  text: Os israelitas e os judeus que moravam nas cidades de Judá também trouxeram o dízimo dos bois e das ovelhas[a], bem como o dízimo das coisas sagradas consagradas a Yahweh, seu Deus; e os colocaram em montões, montão após montão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do gado bovino e dos rebanhos”. O termo hebraico traduzido por “ovelhas” pode abranger ovelhas e cabras.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל וִיהוּדָה
  choice: os israelitas e os judeus
  rationale: Expressa naturalmente o sentido coletivo de בְּנֵי, sem restringi-lo aos homens, e mantém a distinção entre Israel e Judá.
- source_word: הַיּוֹשְׁבִים בְּעָרֵי יְהוּדָה
  choice: que moravam nas cidades de Judá
  rationale: O particípio de ישב indica residência; 'moravam' é corrente e claro em português.
- source_word: גַּם הֵם
  choice: também
  rationale: Preserva a ênfase de que esses moradores igualmente participaram da contribuição.
- source_word: מַעְשַׂר בָּקָר וָצֹאן
  choice: o dízimo dos bois e das ovelhas
  rationale: '''Dízimo'' é o termo cultual estabelecido; בָּקָר designa gado bovino e צֹאן pequenos animais do rebanho, sobretudo ovelhas e cabras.'
- source_word: וּמַעְשַׂר קָדָשִׁים הַמְקֻדָּשִׁים
  choice: bem como o dízimo das coisas sagradas consagradas
  rationale: Mantém tanto a designação substantiva 'coisas sagradas' quanto o particípio passivo 'consagradas', sem especificar indevidamente a categoria exata dos bens.
- source_word: לַיהוָה אֱלֹהֵיהֶם
  choice: a Yahweh, seu Deus
  rationale: A preposição indica a quem as coisas foram consagradas; 'Yahweh' representa diretamente o nome divino יהוה.
- source_word: הֵבִיאוּ
  choice: trouxeram
  rationale: Equivalente direto e natural do hifil de בוא neste contexto narrativo.
- source_word: וַיִּתְּנוּ עֲרֵמוֹת עֲרֵמוֹת
  choice: e os colocaram em montões, um após outro
  rationale: נתן tem aqui o sentido contextual de colocar; a repetição de עֲרֵמוֹת comunica numerosos montões ou montões sucessivos.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz explicitamente o Tetragrama; a transliteração preserva o caráter de nome próprio sem importar uma leitura denominacional.
- issue: Referente de קָדָשִׁים
  choice: coisas sagradas
  alternative: ofertas sagradas
  rationale: O hebraico permite uma referência ampla a coisas separadas como santas; 'ofertas' seria possível no contexto, mas especificaria mais do que o substantivo exige.
translation_notes:
  register: Português moderno, digno e acessível, com construção narrativa fluente. Emprega 'judeus' no sentido histórico dos membros de Judá e conserva a linguagem cultual de 'dízimo', 'sagradas' e 'consagradas'.
