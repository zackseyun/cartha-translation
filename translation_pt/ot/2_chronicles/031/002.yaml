  text: וַ/יַּעֲמֵ֣ד יְחִזְקִיָּ֡הוּ אֶת מַחְלְק֣וֹת הַ/כֹּהֲנִ֣ים וְ֠/הַ/לְוִיִּם עַֽל מַחְלְקוֹתָ֞/ם אִ֣ישׁ כְּ/פִ֣י עֲבֹדָת֗/וֹ לַ/כֹּהֲנִים֙ וְ/לַ/לְוִיִּ֔ם לְ/עֹלָ֖ה וְ/לִ/שְׁלָמִ֑ים לְ/שָׁרֵת֙ וּ/לְ/הֹד֣וֹת וּ/לְ/הַלֵּ֔ל בְּ/שַׁעֲרֵ֖י מַחֲנ֥וֹת יְהוָֽה־־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/002.yaml
  text: And Hezekiah appointed the divisions of the priests and the Levites according to their divisions[a], each man according to his service, both the priests and the Levites, for burnt offerings and peace offerings[c][b], to minister and to give thanks and to praise at the gates of the camps of Yahweh.
translation:
  language: pt
  text: Ezequias designou as divisões dos sacerdotes e dos levitas segundo as suas divisões[a], cada homem segundo o seu serviço, tanto os sacerdotes como os levitas, para holocaustos e sacrifícios de paz[b], a fim de servir, dar graças e louvar às portas dos acampamentos de Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “turnos”; o termo se refere aos grupos organizados de sacerdotes e levitas.
    reason: lexical_alternative
  - marker: b
    text: Ou “sacrifícios de comunhão”.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “os acampamentos de Yahweh”; alguns entendem a expressão, de modo mais interpretativo, como “os átrios de Yahweh”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: estabeleceu
  rationale: No contexto administrativo do culto, o verbo indica que Ezequias colocou os sacerdotes e levitas em uma organização definida. “Estabeleceu” comunica essa ação oficial sem sugerir apenas que os pôs fisicamente de pé.
- source_word: מַחְלְקוֹת
  choice: turmas / divisões
  rationale: O substantivo designa grupos organizados que se alternavam no serviço. “Turmas” é natural para os grupos de sacerdotes e levitas; “divisões” na segunda ocorrência conserva a repetição e a estrutura organizacional do hebraico.
- source_word: אִישׁ כְּפִי עֲבֹדָתוֹ
  choice: cada homem segundo o seu serviço
  rationale: Mantém o distributivo masculino singular do hebraico e seu referente histórico, os integrantes masculinos das turmas sacerdotais e levíticas. “Serviço” abrange as tarefas cultuais designadas.
- source_word: לְעֹלָה
  choice: para os holocaustos
  rationale: עֹלָה é a oferta inteiramente queimada. O plural em português expressa naturalmente a categoria e sua realização recorrente.
- source_word: וְלִשְׁלָמִים
  choice: e os sacrifícios de comunhão
  rationale: A expressão identifica a categoria sacrificial שְׁלָמִים. “Sacrifícios de comunhão” é compreensível em português atual e comunica o aspecto de refeição e participação compartilhada; a alternativa mais literal é registrada em nota.
- source_word: לְשָׁרֵת
  choice: a fim de servir
  rationale: O infinitivo expressa a finalidade do trabalho sagrado. “Servir” é claro, digno e não depende de terminologia eclesiástica posterior.
- source_word: וּלְהוֹדוֹת וּלְהַלֵּל
  choice: dar graças e louvar
  rationale: No contexto litúrgico, ידה significa agradecer ou dar graças, e הלל significa louvar. A coordenação dos dois verbos foi preservada.
- source_word: בְּשַׁעֲרֵי מַחֲנוֹת יְהוָה
  choice: às portas dos acampamentos de Yahweh
  rationale: Preserva o plural inequívoco מַחֲנוֹת e a imagem incomum dos “acampamentos de Yahweh”, sem normalizá-la interpretativamente para “átrios”. “Às portas” expressa de modo idiomático a localização.
theological_decisions:
- issue: Expressão distributiva masculina אִישׁ
  choice: cada homem segundo o seu serviço
  alternative: cada um segundo o seu serviço
  rationale: O texto emprega o substantivo masculino singular e se refere aos ocupantes históricos dos ofícios sacerdotais e levíticos. A tradução conserva essa especificidade sem ampliá-la nem transformá-la em afirmação doutrinária.
- issue: Sentido de שְׁלָמִים
  choice: sacrifícios de comunhão
  alternative: sacrifícios de paz
  rationale: “Comunhão” torna inteligível a função compartilhada dessa categoria sacrificial em português moderno, enquanto a nota preserva a tradução lexical tradicional e mais próxima da raiz.
- issue: Imagem de מַחֲנוֹת יְהוָה
  choice: acampamentos de Yahweh
  alternative: átrios de Yahweh
  rationale: Embora “acampamentos” seja uma imagem incomum no contexto do templo, é o sentido expresso pelo plural hebraico. A tradução evita resolver a tensão textual convertendo-o silenciosamente em “átrios”.
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: A transliteração representa o nome próprio presente no hebraico e evita substituí-lo por um título; a forma escolhida também mantém continuidade com a camada inglesa auditada.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe administrativa clara. A repetição conceitual de “turmas/divisões” reflete a estrutura hebraica sem soar excessivamente mecânica. O travessão delimita a retomada explicativa “tanto os sacerdotes como os levitas”. Todos os marcadores de nota aparecem no texto junto ao elemento pertinente.
