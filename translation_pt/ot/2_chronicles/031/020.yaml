base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/020.yaml
  text: Hezekiah did this throughout all Judah[a], and he did what was good and right and true before Yahweh his God.
translation:
  language: pt
  text: Ezequias fez isso em todo o território de Judá. Fez o que era bom, reto e verdadeiro[a] diante de Yahweh, seu Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fiel” ou “o que era fiel”. O termo hebraico pode significar verdade, confiabilidade ou fidelidade; aqui, pode caracterizar uma conduta íntegra e confiável.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ כָּזֹאת
  choice: fez isso
  rationale: A expressão retoma e resume as reformas e medidas descritas anteriormente; “fez isso” conserva essa função de modo claro e natural.
- source_word: בְּכָל יְהוּדָה
  choice: em todo o território de Judá
  rationale: A construção indica abrangência geográfica por toda a região de Judá. A explicitação de “território” evita que “todo Judá” seja entendido apenas como referência ao povo.
- source_word: הַטּוֹב
  choice: o que era bom
  rationale: O adjetivo com artigo está substantivado e designa aquilo que é moralmente bom.
- source_word: הַיָּשָׁר
  choice: reto
  rationale: Em contexto ético, יָשָׁר denota o que é reto ou correto. “Reto” preserva a forma adjetival da tríade e mantém um registro digno.
- source_word: הָאֱמֶת
  choice: verdadeiro
  rationale: A tradução direta preserva a amplitude de אֱמֶת, que pode indicar verdade, confiabilidade ou fidelidade. Uma nota registra a alternativa ética “fiel” sem resolver indevidamente a ambiguidade.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: לִפְנֵי expressa tanto a presença divina quanto a avaliação de Deus; “diante de” conserva ambos os aspectos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אֱלֹהָיו
  choice: seu Deus
  rationale: Mantém o sufixo possessivo masculino singular e a relação pessoal expressa no hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome próprio divino; “Yahweh” o representa diretamente, sem o substituir pelo título tradicional.
- issue: Sentido ético de הָאֱמֶת
  choice: verdadeiro, com nota alternativa “fiel”
  alternative: fiel
  rationale: O substantivo pode descrever tanto o que é verdadeiro quanto uma conduta marcada por fidelidade ou confiabilidade. O texto mantém a correspondência mais direta e a nota preserva a nuance ética possível.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A repetição de “Fez” acompanha a estrutura hebraica sem tornar o período pesado. O marcador da nota foi colocado junto de “verdadeiro”, termo ao qual a nota lexical se refere.
