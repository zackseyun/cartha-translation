base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/007.yaml
  text: In the third month they began to lay the foundation of the heaps[b][a], and in the seventh month they finished them.
translation:
  language: pt
  text: No terceiro mês, começaram a formar os montes[a], lançando-lhes a base[b]; e, no sétimo mês, terminaram de formá-los.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as pilhas”. O substantivo hebraico se refere aos acúmulos dos produtos entregues como contribuição.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “começaram os montes a fundar”. A expressão indica que começaram a formar os montes pela base.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשְּׁלִשִׁי
  choice: No terceiro mês
  rationale: חֹדֶשׁ, nesta indicação cronológica, significa naturalmente “mês”; a construção com ב e artigo é bem representada por “no”.
- source_word: הֵחֵלּוּ
  choice: começaram
  rationale: O hifil perfeito de חלל, nesta construção, expressa o início de uma ação.
- source_word: הָעֲרֵמוֹת
  choice: os montes
  rationale: עֲרֵמוֹת designa acúmulos ou pilhas; no contexto, são montes formados pelas contribuições de produtos.
- source_word: לְיִסּוֹד
  choice: assentando-lhes a base
  rationale: O infinitivo de יסד indica a maneira ou etapa inicial pela qual começaram a formar os montes. A formulação conserva a imagem concreta e soa natural em português.
- source_word: וּבַחֹדֶשׁ הַשְּׁבִיעִי
  choice: e, no sétimo mês
  rationale: Reproduz diretamente a continuação temporal introduzida pela conjunção ו.
- source_word: כִּלּוּ
  choice: terminaram
  rationale: O piel perfeito de כלה significa “terminar” ou “completar”. O objeto permanece implícito, como no hebraico, mas é recuperável pelo contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Formar os montes” evita a expressão pouco natural “começar os montes”, enquanto “assentando-lhes a base” preserva a imagem do hebraico e sua relação com o início do acúmulo.
