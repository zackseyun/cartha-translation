base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/013.yaml
  text: Jehiel[a], Azaziah, Nahath, Asahel, Jerimoth, Jozabad, Eliel, Ismakiah[b], Mahath, and Benaiah were officers under the authority of Conaniah and Shimei his brother, by the appointment of King Hezekiah and Azariah, the chief officer of the house of God.
translation:
  language: pt
  text: Jeiel, Azazias, Naate, Asael, Jerimote, Jozabade, Eliel, Ismaquias, Maate e Benaia eram encarregados sob a autoridade[a] de Conanias e de seu irmão Simei, por determinação[b] do rei Ezequias e de Azarias, o dirigente da casa de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “da mão de Conanias e de Simei, seu irmão”.
    reason: lexical_alternative
  - marker: b
    text: Ou “por ordem de” ou “sob a supervisão de Ezequias e de Azarias”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקִידִים
  choice: encarregados
  rationale: Designa pessoas nomeadas para responsabilidades administrativas. “Encarregados” é claro e natural em português, sem atribuir-lhes uma patente específica que o hebraico não exige.
- source_word: מִיַּד
  choice: sob a autoridade de
  rationale: A expressão significa literalmente “da mão de”, mas aqui funciona como idioma de subordinação ou supervisão. A tradução explicita a relação administrativa.
- source_word: אָחִיו
  choice: seu irmão
  rationale: Mantém a designação familiar direta, referindo-se a Simei como irmão de Conanias.
- source_word: בְּמִפְקַד
  choice: por determinação de
  rationale: O termo pode indicar ordem, nomeação, encargo ou supervisão. “Por determinação de” preserva a ideia de autorização oficial sem decidir de modo excessivamente específico entre essas nuances.
- source_word: נְגִיד
  choice: dirigente
  rationale: Indica alguém em posição de liderança. “Dirigente” se ajusta ao contexto administrativo do templo sem sugerir o título monárquico de “príncipe”.
- source_word: בֵּית הָאֱלֹהִים
  choice: casa de Deus
  rationale: Conserva a expressão hebraica tradicional e inteligível, que neste contexto designa o templo.
- source_word: יְחִיאֵל, עֲזַזְיָהוּ, נַחַת, עֲשָׂהאֵל, יְרִימוֹת, יוֹזָבָד, אֱלִיאֵל, יִסְמַכְיָהוּ, מַחַת, בְּנָיָהוּ, כּוֹנַנְיָהוּ, שִׁמְעִי, יְחִזְקִיָּהוּ, עֲזַרְיָהוּ
  choice: Jeiel, Azazias, Naate, Asael, Jerimote, Jozabade, Eliel, Ismaquias, Maate, Benaia, Conanias, Simei, Ezequias, Azarias
  rationale: Empregam-se formas bíblicas correntes e legíveis em português, em vez de transliterações inglesas.
theological_decisions:
- issue: Natureza dos títulos administrativos do templo
  choice: 'Traduzir os termos como funções administrativas comuns: “encarregados” e “dirigente”.'
  alternative: Usar títulos mais elevados, como “governantes”, “príncipes” ou “chefes”.
  rationale: O versículo descreve uma cadeia administrativa. As escolhas evitam introduzir uma hierarquia sacerdotal ou política mais definida do que o hebraico expressa.
- issue: Força de בְּמִפְקַד
  choice: “por determinação de”
  alternative: “por ordem de”, “por nomeação de” ou “sob a supervisão de”
  rationale: O substantivo admite essas nuances. A formulação escolhida preserva a autorização exercida pelo rei e por Azarias sem eliminar a ambiguidade entre ordem, comissão e supervisão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A longa lista de nomes e a cadeia de autoridade são mantidas numa única frase, conforme a estrutura do hebraico. Os marcadores foram colocados junto às expressões às quais suas notas efetivamente se referem.
