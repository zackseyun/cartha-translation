  terminology: As formas portuguesas dos nomes são consistentes com o uso bíblico corrente. “Casa de Deus” preserva a formulação hebraica, e “dirigente” evita atribuir a Azarias uma dignidade política ou sacerdotal além da indicada por נְגִיד.
  issues:
