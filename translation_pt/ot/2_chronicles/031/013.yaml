  verdict: revise
  source_fidelity: 'O texto principal reproduz adequadamente a lista de nomes, o caráter administrativo de פְּקִידִים, a subordinação indicada por מִיַּד e a qualificação de Azarias como dirigente da casa de Deus. Contudo, as notas estão ancoradas nas expressões erradas: a nota a explica מִיַּד, não “Simei”; e a nota b explica בְּמִפְקַד, não a identificação de Azarias. Além disso, a redação da nota b, tal como herdada do inglês, pode sugerir que “sob a supervisão” rege apenas o rei e Azarias de maneira pouco clara; convém ancorá-la em “por determinação de” e formulá-la de modo sintaticamente inequívoco.'
