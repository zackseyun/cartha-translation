base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/018.yaml
  text: and for the enrollment of all their little ones[a], their wives, their sons, and their daughters, for all the assembly[c][b]; for in their faithfulness they consecrated themselves as holy.
translation:
  language: pt
  text: e para o registro de todos os seus pequeninos[a], suas esposas, seus filhos e suas filhas, para toda a assembleia; pois, em sua fidelidade[b], eles se consagraram em santidade[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para a inscrição genealógica de todas as suas crianças”. O verbo hebraico se refere à inscrição em registros familiares ou genealógicos.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “fidelidade” provavelmente significa confiabilidade ou lealdade no cumprimento dos deveres sagrados, e não principalmente fé interior.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “eles se consagraram como santos” ou “mantiveram-se santos”. O hebraico emprega tanto o verbo quanto o substantivo relacionados à santidade, dando ênfase à ideia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהִתְיַחֵשׂ
  choice: e para o registro
  rationale: O hitpael de יחס em Crônicas se refere à inscrição em registros familiares ou genealógicos. “Registro” é claro e natural em português, enquanto a nota explicita o aspecto genealógico.
- source_word: בְּכָל טַפָּם
  choice: de todos os seus pequeninos
  rationale: טַף designa especificamente crianças pequenas. “Pequeninos” preserva essa especificidade sem confundi-los com os filhos e as filhas mencionados em seguida.
- source_word: נְשֵׁיהֶם
  choice: suas esposas
  rationale: No contexto da enumeração das famílias, “esposas” é a acepção contextual mais precisa.
- source_word: וּבְנֵיהֶם וּבְנוֹתֵיהֶם
  choice: seus filhos e suas filhas
  rationale: Mantém a distinção explícita do hebraico entre descendentes do sexo masculino e feminino.
- source_word: לְכָל קָהָל
  choice: para toda a assembleia
  rationale: Preserva a preposição לְ e traduz קָהָל como a comunidade reunida abrangida pelo registro e pela distribuição.
- source_word: בֶאֱמוּנָתָם
  choice: em sua fidelidade
  rationale: Neste contexto cultual e administrativo, אֱמוּנָה indica confiabilidade e fidelidade no desempenho dos deveres sagrados, sem excluir à força outras nuances.
- source_word: יִתְקַדְּשׁוּ קֹדֶשׁ
  choice: eles se consagravam em santidade
  rationale: O reflexivo de קדש expressa consagração, e o substantivo קֹדֶשׁ reforça a ideia de santidade. A formulação mantém essa repetição sem se tornar excessivamente artificial.
theological_decisions:
- issue: Sentido de אֱמוּנָה em contexto cultual e administrativo
  choice: fidelidade no cumprimento de deveres sagrados
  alternative: fé em sentido principalmente interior ou devocional
  rationale: O contexto imediato trata do registro, da distribuição e do serviço sacerdotal e levítico, favorecendo a ideia de fidelidade ou confiabilidade, sem importar categorias teológicas posteriores.
- issue: Força da expressão יִתְקַדְּשׁוּ קֹדֶשׁ
  choice: se consagravam em santidade
  alternative: mantinham-se santos; consagravam-se como santos
  rationale: A tradução conserva tanto o verbo reflexivo de consagrar quanto o substantivo “santidade”, preservando a ênfase do hebraico e sua possível tensão entre ato de consagração e estado santo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem enumerativa do hebraico foi preservada, e as notas registram alternativas relevantes sem resolver indevidamente as ambiguidades.
