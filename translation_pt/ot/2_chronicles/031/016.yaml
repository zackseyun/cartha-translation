base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/016.yaml
  text: apart from those enrolled by genealogy among the males from three years old and upward[a], all who entered the house of Yahweh, as the daily matter required[c][b], for their service in their duties according to their divisions.
translation:
  language: pt
  text: Além dos inscritos nos registros genealógicos entre os do sexo masculino de três anos para cima[a], todos os que entravam na casa de Yahweh, conforme a exigência de cada dia[b], para o seu serviço em seus turnos[c], segundo as suas divisões.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “além dos registrados por genealogia entre os do sexo masculino”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico, literalmente: “para o assunto de um dia em seu dia”; isto é, conforme a exigência de cada dia.'
    reason: lexical_alternative
  - marker: c
    text: Ou “em suas guardas” ou “em seus turnos de serviço”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: além de
  rationale: Introduz um grupo ou consideração distinta, preservando o valor separativo/aditivo da expressão sem impor uma exclusão absoluta.
- source_word: הִתְיַחְשָׂם לִזְכָרִים
  choice: os inscritos genealogicamente entre os do sexo masculino
  rationale: O hitpael de יחס indica inscrição em registro genealógico, e זְכָרִים especifica explicitamente o sexo masculino. A formulação evita que “homens” sugira apenas adultos.
- source_word: מִבֶּן שָׁלֹשׁ שָׁנִים וּלְמַעְלָה
  choice: de três anos para cima
  rationale: Expressão portuguesa natural para o limite etário indicado literalmente no hebraico.
- source_word: לְכָל הַבָּא
  choice: todos os que entravam
  rationale: O particípio tem sentido coletivo e habitual; o imperfeito em português comunica a entrada recorrente no contexto do serviço no templo.
- source_word: לְבֵית יְהוָה
  choice: na casa de Yahweh
  rationale: Mantém a expressão concreta “casa” e verte o Tetragrama como o nome pessoal Yahweh.
- source_word: לִדְבַר יוֹם בְּיוֹמוֹ
  choice: conforme a exigência de cada dia
  rationale: Expressa de modo claro o sentido administrativo da necessidade ou tarefa correspondente a cada dia, deixando a forma literal na nota.
- source_word: לַעֲבוֹדָתָם
  choice: para o seu serviço
  rationale: No contexto do templo, עֲבוֹדָה designa serviço ou trabalho designado; “serviço” mantém a amplitude sem introduzir terminologia eclesiástica posterior.
- source_word: בְּמִשְׁמְרוֹתָם
  choice: em seus turnos
  rationale: מִשְׁמָרוֹת pode indicar guardas, encargos ou turnos de serviço. “Turnos” comunica naturalmente a organização funcional, e as alternativas são registradas em nota.
- source_word: כְּמַחְלְקוֹתֵיהֶם
  choice: segundo as suas divisões
  rationale: Refere-se às divisões organizadas dos sacerdotes ou levitas e preserva a terminologia administrativa do contexto.
theological_decisions:
- issue: Linguagem específica de sexo para o pessoal do templo
  choice: entre os do sexo masculino
  alternative: entre as pessoas
  rationale: O hebraico usa explicitamente זְכָרִים, “os do sexo masculino”; a tradução conserva essa especificidade sem sugerir, por meio de “homens”, somente adultos.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto contém o Tetragrama como nome próprio. “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Idade mínima surpreendentemente baixa
  choice: de três anos para cima
  alternative: de trinta anos para cima
  rationale: O texto massorético testemunhado pelo WLC lê inequivocamente “três”; a tradução não corrige conjecturalmente a leitura por parecer incomum.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. O versículo preserva a estrutura fragmentária ligada ao contexto anterior. Emprega linguagem administrativa corrente para os registros, turnos e divisões, sem apagar as ambiguidades lexicais relevantes.
