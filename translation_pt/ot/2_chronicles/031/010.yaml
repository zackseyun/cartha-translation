  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו עֲזַרְיָ֧הוּ הַ/כֹּהֵ֛ן הָ/רֹ֖אשׁ לְ/בֵ֣ית צָד֑וֹק וַ֠/יֹּאמֶר מֵ/הָחֵ֨ל הַ/תְּרוּמָ֜ה לָ/בִ֣יא בֵית יְהוָ֗ה אָכ֨וֹל וְ/שָׂב֤וֹעַ וְ/הוֹתֵר֙ עַד לָ/ר֔וֹב כִּ֤י יְהוָה֙ בֵּרַ֣ךְ אֶת עַמּ֔/וֹ וְ/הַ/נּוֹתָ֖ר אֶת הֶ/הָמ֥וֹן הַ/זֶּֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/010.yaml
  text: Azariah the chief priest[a], of the house of Zadok, said to him, “Since they began bringing the contribution into the house of Yahweh, we have eaten and been satisfied and have had plenty left over, for Yahweh has blessed his people; and what is left is this great abundance.”
translation:
  language: pt
  text: 'Azarias, o sacerdote principal[a], da casa de Zadoque, respondeu-lhe: “Desde que começaram a trazer a contribuição para a casa de Yahweh, temos comido e ficado satisfeitos, e ainda tem sobrado em grande quantidade, pois Yahweh abençoou o seu povo. E o que resta é esta grande abundância.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sacerdote-chefe”; o hebraico indica sua posição de liderança entre os sacerdotes, sem usar aqui o título técnico habitual para “sumo sacerdote”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן הָרֹאשׁ
  choice: o sacerdote principal
  rationale: Expressa a posição de liderança sacerdotal de Azarias sem introduzir o título técnico posterior “sumo sacerdote”, que não aparece explicitamente nesta frase hebraica.
- source_word: לְבֵית צָדוֹק
  choice: da casa de Zadoque
  rationale: Preserva de modo conciso e natural a afiliação familiar e sacerdotal indicada pelo hebraico.
- source_word: מֵהָחֵל
  choice: Desde que começaram
  rationale: Comunica claramente o ponto inicial temporal expresso pela construção hebraica, deixando implícito, como no contexto, o sujeito plural.
- source_word: הַתְּרוּמָה
  choice: a contribuição
  rationale: Refere-se ao que era separado e entregue para uso sagrado; “contribuição” é claro no contexto dos mantimentos trazidos, enquanto “oferta” também é possível.
- source_word: לָבִיא בֵית יְהוָה
  choice: trazer a contribuição para a casa de Yahweh
  rationale: Verte naturalmente o movimento em direção ao templo; a repetição de “a contribuição” explicita em português o objeto presente no contexto imediato.
- source_word: אָכוֹל וְשָׂבוֹעַ
  choice: temos comido até ficar satisfeitos
  rationale: Reproduz o resultado corporativo de comer e alcançar saciedade em português atual e natural.
- source_word: וְהוֹתֵר עַד לָרֹב
  choice: e ainda tem sobrado em grande quantidade
  rationale: Preserva a ideia de excedente abundante e a continuidade do resultado desde o início das contribuições.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בֵּרַךְ אֶת עַמּוֹ
  choice: abençoou o seu povo
  rationale: Mantém o perfeito hebraico e apresenta a bênção de Yahweh como causa da abundância observada.
- source_word: וְהַנּוֹתָר אֶת הֶהָמוֹן הַזֶּה
  choice: E o que restou é esta grande abundância
  rationale: Entende הַנּוֹתָר substantivamente, “o que restou”, e toma הָמוֹן no sentido contextual de grande quantidade de provisões.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino, sem substituí-lo pelo título tradicional “SENHOR”.
- issue: Título sacerdotal de Azarias
  choice: sacerdote principal
  alternative: sumo sacerdote
  rationale: A expressão hebraica significa literalmente o sacerdote de posição principal ou dirigente. Evita-se transformar silenciosamente a expressão no título técnico “sumo sacerdote”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala mantém o tom testemunhal e a repetição enfática da abundância do original.
