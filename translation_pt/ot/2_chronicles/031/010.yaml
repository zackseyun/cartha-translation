revisions:
- from: 'Azarias, o sacerdote principal[a], da casa de Zadoque, respondeu-lhe: “Desde que começaram a trazer a contribuição para a casa de Yahweh, temos comido até ficar satisfeitos, e ainda tem sobrado em grande quantidade, pois Yahweh abençoou o seu povo. E o que restou é esta grande abundância.”'
  to: 'Azarias, o sacerdote principal[a], da casa de Zadoque, respondeu-lhe: “Desde que começaram a trazer a contribuição para a casa de Yahweh, temos comido e ficado satisfeitos, e ainda tem sobrado em grande quantidade, pois Yahweh abençoou o seu povo. E o que resta é esta grande abundância.”'
  rationale: 'A revisão é limitada a dois ajustes de aspecto e fluência: “ficado satisfeitos” traduz mais diretamente a coordenação hebraica, e “o que resta” preserva o valor do particípio substantivado no desfecho. Não há alteração de sentido, terminologia central ou nota.'
  reviewer_model: gpt-5.6-terra
