  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A ordem foi levemente ajustada para fluência, sem eliminar a possível relação de “fielmente” tanto com a entrega quanto com o manejo administrativo dos bens.
