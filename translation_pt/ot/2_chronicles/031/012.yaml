base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/012.yaml
  text: They brought in the contribution[a], the tithe, and the holy things faithfully, and Conaniah the Levite was chief over them[b], with his brother Shimei second.
translation:
  language: pt
  text: Trouxeram fielmente a contribuição, o dízimo e as coisas sagradas[a]. Conanias, o levita, era o responsável por elas, e Simei, seu irmão, era o segundo no comando[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as coisas consagradas”.
    reason: lexical_alternative
  - marker: b
    text: Ou “e Simei, seu irmão, era o segundo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: Trouxeram
  rationale: O hifil de בוא significa aqui trazer ou levar para dentro. O contexto já indica a entrega nos depósitos do templo, sem necessidade de explicitar “para os depósitos” no versículo.
- source_word: הַתְּרוּמָה
  choice: a contribuição
  rationale: תְּרוּמָה designa uma contribuição separada para uso sagrado. “Contribuição” é claro e evita o tecnicismo ritual “oferta alçada”, que o contexto não exige.
- source_word: הַמַּעֲשֵׂר
  choice: o dízimo
  rationale: מַעֲשֵׂר é o termo usual para a décima parte dedicada a Deus; “dízimo” é seu equivalente corrente e preciso em português.
- source_word: הַקֳּדָשִׁים
  choice: as coisas sagradas
  rationale: O plural de קֹדֶשׁ refere-se aqui a bens separados para uso sagrado. “Coisas sagradas” preserva a formulação abrangente do hebraico; “coisas consagradas” também é possível.
- source_word: בֶּאֱמוּנָה
  choice: fielmente
  rationale: Em contexto administrativo, אֱמוּנָה comunica fidelidade, confiabilidade ou integridade. O advérbio “fielmente” expressa de modo natural a maneira como os bens foram entregues ou administrados.
- source_word: וַעֲלֵיהֶם נָגִיד
  choice: ficou encarregado delas
  rationale: A combinação de על com נָגִיד indica autoridade ou supervisão sobre os bens mencionados. A formulação portuguesa é natural e mantém o sentido administrativo sem sugerir governo régio.
- source_word: כונניהו הַלֵּוִי
  choice: Conanias, o levita
  rationale: “Conanias” segue a forma tradicional portuguesa do nome, e o artigo hebraico em הַלֵּוִי favorece “o levita”.
- source_word: וְשִׁמְעִי אָחִיהוּ מִשְׁנֶה
  choice: e seu irmão Simei era o segundo no comando
  rationale: אָחִיהוּ significa naturalmente “seu irmão”, e מִשְׁנֶה indica o oficial de segunda posição ou substituto. “Segundo no comando” torna explícita em português a relação hierárquica implícita no termo.
theological_decisions: []
