source:
  edition: WLC
  text: וְ/קוֹרֵ֨א בֶן יִמְנָ֤ה הַ/לֵּוִי֙ הַ/שּׁוֹעֵ֣ר לַ/מִּזְרָ֔חָ/ה עַ֖ל נִדְב֣וֹת הָ/אֱלֹהִ֑ים לָ/תֵת֙ תְּרוּמַ֣ת יְהוָ֔ה וְ/קָדְשֵׁ֖י הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/014.yaml
  text: Kore son of Imnah[a], the Levite, the gatekeeper on the east, was in charge of the freewill offerings of God[b], to distribute the contribution of Yahweh and the most holy things.
translation:
  language: pt
  text: Coré, filho de Imna, o levita, o porteiro do lado leste, estava encarregado das ofertas voluntárias feitas a Deus, a fim de distribuir[a] a contribuição de Yahweh e as coisas santíssimas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “dar”; aqui, no sentido de entregar aos destinatários aquilo que havia sido consagrado.
    reason: lexical_alternative
  - marker: b
    text: Ou “as ofertas santíssimas”. A expressão hebraica se refere a coisas especialmente santas, não necessariamente ao recinto chamado Santo dos Santos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקוֹרֵא בֶן־יִמְנָה
  choice: Coré, filho de Imna
  rationale: Translitera os nomes próprios segundo formas naturais em português e mantém a relação filial expressa no hebraico.
- source_word: הַלֵּוִי הַשּׁוֹעֵר לַמִּזְרָחָה
  choice: o levita que guardava o portão do lado leste
  rationale: Expressa de modo natural a função de שׁוֹעֵר e a localização oriental. Embora 'portão' não esteja repetido em לַמִּזְרָחָה, ele está semanticamente implícito na função do guarda.
- source_word: עַל
  choice: estava encarregado de
  rationale: Neste contexto administrativo, a preposição indica responsabilidade ou supervisão, não posição espacial.
- source_word: נִדְבוֹת הָאֱלֹהִים
  choice: as ofertas voluntárias feitas a Deus
  rationale: נִדְבוֹת designa ofertas espontâneas ou voluntárias; 'feitas a Deus' explicita naturalmente em português a relação genitiva sem sugerir que Deus seja sua origem.
- source_word: לָתֵת
  choice: a fim de distribuir
  rationale: O infinitivo significa literalmente 'dar'; no contexto da administração das contribuições, refere-se à sua entrega aos destinatários, isto é, à distribuição.
- source_word: תְּרוּמַת יְהוָה
  choice: a contribuição de Yahweh
  rationale: Mantém de perto a construção hebraica e traduz תְּרוּמָה como uma porção ou contribuição separada para uso sagrado.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: וְקָדְשֵׁי הַקֳּדָשִׁים
  choice: e as coisas santíssimas
  rationale: A construção intensiva indica coisas de santidade máxima; neste contexto não designa o recinto chamado Santo dos Santos.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama; 'Yahweh' preserva o caráter de nome pessoal sem o substituir por um título.
- issue: Sentido de קָדְשֵׁי הַקֳּדָשִׁים
  choice: coisas santíssimas
  alternative: ofertas santíssimas; Santo dos Santos
  rationale: A expressão pode abranger objetos ou porções de santidade especial. A formulação escolhida preserva essa amplitude e evita identificá-la indevidamente com o santuário interior.
translation_notes:
  register: Português contemporâneo, claro e digno, com boa legibilidade brasileira. A estrutura foi levemente reorganizada para fluidez, sem eliminar a função cultual, a localização oriental nem a relação administrativa indicada pelo hebraico.
