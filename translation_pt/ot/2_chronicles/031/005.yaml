source:
  edition: WLC
  text: וְ/כִ/פְרֹ֣ץ הַ/דָּבָ֗ר הִרְבּ֤וּ בְנֵֽי יִשְׂרָאֵל֙ רֵאשִׁ֣ית דָּגָ֗ן תִּיר֤וֹשׁ וְ/יִצְהָר֙ וּ/דְבַ֔שׁ וְ/כֹ֖ל תְּבוּאַ֣ת שָׂדֶ֑ה וּ/מַעְשַׂ֥ר הַ/כֹּ֛ל לָ/רֹ֖ב הֵבִֽיאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/005.yaml
  text: And when the matter spread[a], the sons of Israel brought in abundance the firstfruits of grain, new wine, oil, honey, and all the produce of the field[b]; they brought in abundantly the tithe of everything.
translation:
  language: pt
  text: Quando o assunto se espalhou, os filhos de Israel[a] trouxeram em abundância as primícias dos cereais, do vinho novo, do azeite, do mel[b] e de toda a produção do campo; trouxeram, em grande quantidade, o dízimo de tudo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas” ou “o povo de Israel”. O hebraico diz literalmente “os filhos de Israel”, expressão coletiva habitual para o povo de Israel.
    reason: lexical_alternative
  - marker: b
    text: Em certos contextos, “mel” pode designar um xarope doce, como o de tâmaras, e não apenas mel de abelhas.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִ/פְרֹץ הַ/דָּבָר
  choice: Quando a notícia se espalhou
  rationale: A construção tem sentido temporal, “quando/assim que”, e פרץ comunica a ideia de algo que irrompe e se difunde. “A notícia se espalhou” é idiomático em português e, no contexto, representa a determinação anteriormente anunciada sem tratar דָּבָר como mera “palavra” isolada.
- source_word: הִרְבּוּ
  choice: trouxeram em abundância
  rationale: O hifil de רבה indica aumento ou grande quantidade. A ação de trazer, explicitada depois por הֵבִיאוּ, pode ser antecipada naturalmente em português.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a expressão corporativa hebraica, que neste contexto designa coletivamente os israelitas, sem restringi-la apenas a descendentes masculinos individuais.
- source_word: רֵאשִׁית דָּגָן
  choice: as primícias dos cereais
  rationale: רֵאשִׁית é o primeiro produto ou a primeira porção dedicada como oferta. דָּגָן designa genericamente os grãos cerealíferos; o plural “cereais” é claro e natural em português.
- source_word: תִּירוֹשׁ
  choice: vinho novo
  rationale: O termo costuma indicar vinho recém-produzido ou mosto, e “vinho novo” preserva essa nuance agrícola sem afirmar que se tratava de suco não fermentado.
- source_word: יִצְהָר
  choice: azeite
  rationale: O termo se refere normalmente ao óleo agrícola, sobretudo o de oliva. Em português, “azeite” comunica essa referência de modo natural e preciso.
- source_word: דְבַשׁ
  choice: mel
  rationale: “Mel” é a equivalência principal, mas o termo hebraico também pode designar um xarope doce de frutas; a alternativa é registrada em nota.
- source_word: וְ/כֹל תְּבוּאַת שָׂדֶה
  choice: e de toda a produção do campo
  rationale: תְּבוּאָה denota produto, colheita ou rendimento agrícola. “Produção do campo” mantém o sentido abrangente.
- source_word: וּ/מַעְשַׂר הַ/כֹּל
  choice: o dízimo de tudo
  rationale: מַעֲשֵׂר é o termo técnico para o décimo entregue como dízimo, e הַכֹּל amplia seu alcance a tudo o que era devido.
- source_word: לָ/רֹב
  choice: em grande quantidade
  rationale: A expressão enfatiza a abundância do dízimo trazido. A formulação evita repetição excessiva de “em abundância” sem perder a ênfase do hebraico.
theological_decisions:
- issue: Alcance da expressão corporativa בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; o povo de Israel
  rationale: A tradução conserva a forma tradicional e corporativa do hebraico. A nota esclarece que a expressão se refere ao povo coletivamente, evitando que seja entendida como limitada apenas aos homens.
- issue: Natureza do תִּירוֹשׁ
  choice: vinho novo
  alternative: vinho; mosto
  rationale: “Vinho novo” preserva a nuance de produto recente sem resolver indevidamente questões sobre seu estágio de fermentação.
- issue: Referente de דְבַשׁ
  choice: mel
  alternative: xarope doce, como o de tâmaras
  rationale: Como o contexto não determina se era mel de abelhas ou xarope de frutas, a tradução principal mantém o termo amplo e tradicional, enquanto a nota preserva a ambiguidade histórica.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantiveram-se “primícias”, “vinho novo” e “dízimo” por serem termos bíblicos correntes e precisos. A repetição hebraica da ideia de abundância foi preservada com variação estilística natural: “em abundância” e “em grande quantidade”.'
