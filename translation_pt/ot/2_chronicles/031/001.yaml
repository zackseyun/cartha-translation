source:
  edition: WLC
  text: וּ/כְ/כַלּ֣וֹת כָּל זֹ֗את יָצְא֨וּ כָּל יִשְׂרָאֵ֥ל הַֽ/נִּמְצְאִים֮ לְ/עָרֵ֣י יְהוּדָה֒ וַ/יְשַׁבְּר֣וּ הַ/מַּצֵּב֣וֹת וַ/יְגַדְּע֣וּ הָ/אֲשֵׁרִ֡ים וַ/יְנַתְּצ֣וּ אֶת הַ֠/בָּמוֹת וְ/אֶת הַֽ/מִּזְבְּחֹ֞ת מִ/כָּל יְהוּדָ֧ה וּ/בִנְיָמִ֛ן וּ/בְ/אֶפְרַ֥יִם וּ/מְנַשֶּׁ֖ה עַד לְ/כַלֵּ֑ה וַ/יָּשׁ֜וּבוּ כָּל בְּנֵ֧י יִשְׂרָאֵ֛ל אִ֥ישׁ לַ/אֲחֻזָּת֖/וֹ לְ/עָרֵי/הֶֽם־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/001.yaml
  text: And when all this was finished[a], all Israel who were present went out to the cities of Judah and shattered the pillars, cut down the Asherim, and tore down the high places and the altars throughout all Judah and Benjamin, and in Ephraim and Manasseh, until they had completely destroyed them. Then all the sons of Israel returned, each man to his possession, to their cities.
translation:
  language: pt
  text: Quando tudo isso terminou, todos os israelitas que estavam presentes saíram para as cidades de Judá, despedaçaram as colunas sagradas, cortaram os postes de Aserá[a] e demoliram os lugares altos e os altares por todo o território de Judá e Benjamim, bem como em Efraim e Manassés, até acabarem completamente com eles. Depois, todos os filhos de Israel voltaram, cada um para a sua propriedade, para as suas cidades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico pode designar objetos cultuais associados a Aserá, muitas vezes entendidos como postes de madeira ou árvores sagradas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְכַלּוֹת כָּל זֹאת
  choice: Quando tudo isso terminou
  rationale: A construção temporal com כְּ e o infinitivo construto indica 'quando, ao terminar'. A formulação portuguesa é natural e não introduz um sujeito ausente no hebraico.
- source_word: כָּל יִשְׂרָאֵל הַנִּמְצְאִים
  choice: todos os israelitas que estavam presentes
  rationale: הַנִּמְצְאִים significa literalmente 'os que se encontravam [ali]' e, no contexto, designa os israelitas presentes. 'Todos os israelitas' comunica naturalmente o etnônimo coletivo כָּל יִשְׂרָאֵל.
- source_word: וַיְשַׁבְּרוּ הַמַּצֵּבוֹת
  choice: despedaçaram as colunas sagradas
  rationale: מַצֵּבוֹת são pedras ou colunas erigidas com função cultual; 'sagradas' explicita essa função sem identificar uma divindade específica. 'Despedaçaram' preserva a força de שׁבר.
- source_word: וַיְגַדְּעוּ הָאֲשֵׁרִים
  choice: cortaram os postes de Aserá
  rationale: אֲשֵׁרִים designa objetos cultuais ligados a Aserá, frequentemente postes ou elementos de madeira. Como גּדע significa cortar ou derrubar, 'postes de Aserá' oferece uma representação concreta e compreensível, mantendo em nota a incerteza quanto à forma exata.
- source_word: וַיְנַתְּצוּ אֶת הַבָּמוֹת וְאֶת הַמִּזְבְּחֹת
  choice: demoliram os lugares altos e os altares
  rationale: בָּמוֹת é a designação convencional de locais de culto elevados, e נָתַץ indica demolição. 'Lugares altos' preserva o termo bíblico sem reduzir a referência a simples elevações geográficas.
- source_word: מִכָּל יְהוּדָה וּבִנְיָמִן וּבְאֶפְרַיִם וּמְנַשֶּׁה
  choice: por todo o território de Judá e Benjamim, bem como em Efraim e Manassés
  rationale: A expressão indica a abrangência geográfica da remoção. 'Por todo o território' transmite o valor de מִכָּל neste contexto, enquanto 'bem como em' representa de modo natural a mudança para בְּ diante de Efraim e Manassés.
- source_word: עַד לְכַלֵּה
  choice: até acabarem completamente com eles
  rationale: O infinitivo expressa ação levada à conclusão. O pronome retoma as instalações cultuais já enumeradas, e 'completamente' comunica a ideia de remoção total.
- source_word: וַיָּשׁוּבוּ כָּל בְּנֵי יִשְׂרָאֵל אִישׁ לַאֲחֻזָּתוֹ לְעָרֵיהֶם
  choice: todos os filhos de Israel voltaram para as suas cidades, cada um para a sua propriedade
  rationale: A ordem foi levemente ajustada para produzir português claro e evitar a sequência pouco natural 'cada um para sua propriedade, para suas cidades'. 'Filhos de Israel' preserva a forma do etnônimo, e אֲחֻזָּה indica propriedade ou posse territorial.
theological_decisions:
- issue: Etnônimo masculino e singular distributivo
  choice: todos os filhos de Israel ... cada um para a sua propriedade
  alternative: todos os israelitas ... cada qual para a sua propriedade
  rationale: A conclusão preserva as formas explicitamente masculinas בְּנֵי e אִישׁ e seu caráter distributivo, sem afirmar que as mulheres estivessem excluídas da comunidade. Na primeira ocorrência, 'israelitas' evita a combinação pouco natural entre o coletivo 'todo Israel' e o particípio plural.
- issue: Natureza dos אֲשֵׁרִים
  choice: postes de Aserá
  alternative: aserins; objetos sagrados de Aserá; árvores sagradas de Aserá
  rationale: O referente exato pode variar entre objetos de madeira, postes e árvores associados ao culto de Aserá. O texto adota a expressão portuguesa mais inteligível, mas registra a incerteza lexical em nota, sem impor uma identificação material absoluta.
translation_notes:
  register: 'Português moderno, digno e acessível, com legibilidade brasileira e vocabulário bíblico amplamente reconhecível. A tradução busca equivalência ótima: mantém termos cultuais importantes, esclarece seu sentido quando necessário e preserva em nota a incerteza referente aos objetos de Aserá.'
