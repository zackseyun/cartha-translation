base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/003.yaml
  text: 'The king’s portion from his own possessions was for the burnt offerings: the burnt offerings of the morning and the evening[a], and the burnt offerings for the Sabbaths, the new moons, and the appointed feasts[e][d][c][b], as it is written in the Law of Yahweh.'
translation:
  language: pt
  text: 'A porção do rei[a], retirada de seus próprios bens, destinava-se aos holocaustos[e]: os holocaustos da manhã e da tarde, e os holocaustos para os sábados, as luas novas[b] e as festas estabelecidas[c], conforme está escrito na Lei[d] de Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “a cota do rei” ou “a parte do rei”.
    reason: lexical_alternative
  - marker: b
    text: “Luas novas” refere-se às celebrações mensais realizadas no início de cada novo mês do calendário de culto de Israel.
    reason: cultural_note
  - marker: c
    text: Ou “tempos determinados” ou “festas fixadas”.
    reason: lexical_alternative
  - marker: d
    text: O hebraico também pode ser vertido como “Torá de Yahweh” ou “instrução de Yahweh”.
    reason: lexical_alternative
  - marker: e
    text: 'Mais literalmente: “para os holocaustos, para os holocaustos”.'
    reason: source_form
lexical_decisions:
- source_word: וּמְנָת הַמֶּלֶךְ
  choice: A porção do rei
  rationale: מְנָה designa uma porção, cota ou parcela atribuída. “Porção” mantém essa noção sem transformar o termo, de modo explícito, em “contribuição”.
- source_word: מִן רְכוּשׁוֹ
  choice: retirada de seus próprios bens
  rationale: רְכוּשׁ abrange bens, propriedade e posses. A formulação deixa claro que os recursos vinham dos bens pessoais do rei.
- source_word: לָעֹלוֹת
  choice: destinava-se aos holocaustos
  rationale: עֹלָה é a oferta inteiramente queimada. “Holocausto” é o termo bíblico tradicional e ainda corrente em português para esse sacrifício; “destinava-se” expressa naturalmente a relação marcada pela preposição hebraica.
- source_word: לְעֹלוֹת הַבֹּקֶר וְהָעֶרֶב
  choice: os holocaustos da manhã e da tarde
  rationale: Preserva a repetição de “holocaustos” e a referência aos sacrifícios cotidianos matutino e vespertino.
- source_word: לַשַּׁבָּתוֹת וְלֶחֳדָשִׁים וְלַמֹּעֲדִים
  choice: para os sábados, as luas novas e as festas determinadas
  rationale: שַׁבָּתוֹת são os sábados; חֳדָשִׁים, neste contexto litúrgico, são as celebrações das luas novas; מוֹעֲדִים são tempos ou festas fixados no calendário sagrado.
- source_word: כַּכָּתוּב
  choice: conforme está escrito
  rationale: Fórmula portuguesa natural que expressa conformidade com uma prescrição escrita.
- source_word: בְּתוֹרַת יְהוָה
  choice: na Lei de Yahweh
  rationale: תּוֹרָה, neste contexto cultual e normativo, refere-se à instrução legal escrita; o nome divino יְהוָה é transliterado como “Yahweh”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome próprio da aliança sem substituí-lo por um título.
- issue: Sentido de תּוֹרָה
  choice: Lei
  alternative: Instrução; Torá
  rationale: No contexto das ofertas prescritas para o calendário de culto, “Lei” comunica com clareza a referência à instrução normativa escrita, enquanto a nota registra alternativas legítimas.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A repetição de “holocaustos” foi mantida por refletir a estrutura explicativa do hebraico; os dois לְ consecutivos foram suavizados no corpo do texto e documentados em nota.
