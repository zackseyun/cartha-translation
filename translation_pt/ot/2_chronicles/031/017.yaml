base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/017.yaml
  text: The genealogical registration of the priests was by their fathers’ houses[a], and that of the Levites from twenty years old and upward[b], in their duties by their divisions.
translation:
  language: pt
  text: O registro genealógico[a] dos sacerdotes foi feito segundo suas famílias paternas[b]; o dos levitas abrangia os de vinte anos para cima, de acordo com suas funções e suas divisões.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os sacerdotes registrados genealogicamente [...] e os levitas”. O hebraico é condensado e elíptico.'
    reason: lexical_alternative
  - marker: b
    text: “Famílias paternas” eram agrupamentos familiares ancestrais usados no registro oficial e na organização do serviço.
    reason: cultural_note
lexical_decisions:
- source_word: הִתְיַחֵשׂ
  choice: registro genealógico
  rationale: O verbo se refere à inscrição em registros genealógicos ou ao alistamento segundo a linhagem. Como a construção hebraica é elíptica, a expressão nominal comunica com clareza seu sentido administrativo.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Tradução corrente da classe sacerdotal, preservando o artigo definido.
- source_word: לְבֵית אֲבוֹתֵיהֶם
  choice: segundo suas famílias paternas
  rationale: A expressão designa agrupamentos familiares ancestrais pela linha paterna, usados para registro e organização oficial. Esta formulação é natural em português sem perder o caráter institucional.
- source_word: וְהַלְוִיִּם
  choice: o dos levitas
  rationale: A construção elíptica retoma a ideia de registro genealógico. O pronome substantivado explicita o paralelismo sem acrescentar conteúdo estranho ao hebraico.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וּלְמָעְלָה
  choice: os de vinte anos para cima
  rationale: Reproduz de maneira corrente e fiel a fórmula hebraica que estabelece a idade mínima.
- source_word: בְּמִשְׁמְרוֹתֵיהֶם
  choice: de acordo com suas funções
  rationale: O substantivo pode indicar encargo, responsabilidade ou atribuição de serviço. Aqui, “funções” comunica o sentido amplo sem restringi-lo a turnos de guarda.
- source_word: בְּמַחְלְקוֹתֵיהֶם
  choice: e suas divisões
  rationale: Refere-se aos grupos organizados em que os levitas prestavam serviço. “Divisões” preserva de forma concisa o vocabulário administrativo.
