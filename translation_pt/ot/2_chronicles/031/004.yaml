  text: וַ/יֹּ֤אמֶר לָ/עָם֙ לְ/יוֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם לָ/תֵ֕ת מְנָ֥ת הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּ֑ם לְמַ֥עַן יֶחֶזְק֖וּ בְּ/תוֹרַ֥ת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/004.yaml
  text: He also commanded the people[a], the inhabitants of Jerusalem, to give the portion due to the priests and the Levites, so that they might devote themselves to the law of Yahweh.
translation:
  language: pt
  text: Ele também ordenou ao povo, isto é, aos habitantes de Jerusalém, que dessem a parte devida aos sacerdotes e aos levitas, para que estes pudessem dedicar-se à lei de Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que se fortalecessem na lei de Yahweh”; ou: “para que se apegassem firmemente à lei de Yahweh”.'
    reason: Alternativas lexicais para יֶחֶזְקוּ בְּתוֹרַת יְהוָה, cuja formulação hebraica pode indicar dedicação, fortalecimento ou firme adesão.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ele também ordenou
  rationale: Embora אמר signifique normalmente “dizer”, a construção com a instrução infinitiva e o contexto da ordem real justificam “ordenou”; “também” expressa naturalmente a continuidade narrativa do waw consecutivo.
- source_word: לָעָם לְיוֹשְׁבֵי יְרוּשָׁלִַם
  choice: ao povo, isto é, aos habitantes de Jerusalém
  rationale: A segunda expressão especifica quem é o povo em vista. “Isto é” torna clara essa relação apositiva em português corrente sem ampliar o referente.
- source_word: לָתֵת מְנָת
  choice: que dessem a parte devida
  rationale: נתן é “dar”, e מְנָה designa uma porção ou parte atribuída. “Parte devida” comunica que se tratava do sustento destinado legitimamente aos sacerdotes e levitas.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: aos sacerdotes e aos levitas
  rationale: Mantém distintos os dois grupos nomeados no hebraico e reproduz os artigos de modo natural em português.
- source_word: לְמַעַן
  choice: para que
  rationale: Introduz a finalidade da ordem em português natural.
- source_word: יֶחֶזְקוּ
  choice: pudessem dedicar-se
  rationale: חזק pode significar ser forte, fortalecer-se ou apegar-se firmemente. No contexto do sustento material, “pudessem dedicar-se” expressa a capacitação para uma atenção contínua à lei, enquanto a nota preserva as alternativas mais formais.
- source_word: בְּתוֹרַת יְהוָה
  choice: à lei de Yahweh
  rationale: תורה é aqui a instrução ou lei pactual e cultual; “lei” é reconhecível e adequada ao contexto. A preposição é vertida idiomaticamente por “a” após “dedicar-se”, e o nome divino é transliterado como “Yahweh”.
theological_decisions:
- issue: Tradução de יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome divino, não um título. “Yahweh” preserva o nome pessoal da forma mais próxima da reconstrução acadêmica amplamente aceita.
- issue: Sentido de יֶחֶזְקוּ בְּתוֹרַת יְהוָה
  choice: para que estes pudessem dedicar-se à lei de Yahweh
  alternative: para que fossem fortalecidos na lei de Yahweh; para que se apegassem firmemente à lei de Yahweh
  rationale: A expressão admite mais de uma leitura. O contexto favorece a ideia de que o sustento permitiria dedicação contínua, mas a nota mantém visíveis as possibilidades de fortalecimento ou firme adesão sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Isto é” esclarece a aposição; “estes” evita que o sujeito de “pudessem dedicar-se” seja confundido com o povo. O marcador [a] aparece no texto junto à expressão anotada.
