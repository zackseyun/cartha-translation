  source_fidelity: A tradução transmite adequadamente a ordem dirigida aos moradores de Jerusalém, a provisão destinada aos sacerdotes e levitas e a finalidade ligada à lei de Yahweh. «Ordenou» é defensável pelo contexto régio, embora וַיֹּאמֶר tenha, em sentido estrito, o valor básico de «disse». A alternativa da nota «fossem fortalecidos» obscurece a forma ativa do hebraico; «se fortalecessem» a representa melhor.
  naturalness: O português é moderno, claro e de registro apropriado. «Estes» esclarece naturalmente que a finalidade se refere aos sacerdotes e aos levitas. O marcador deve ficar junto da expressão efetivamente anotada, e não no fim do versículo.
  terminology: «Sacerdotes», «levitas», «lei» e «Yahweh» são consistentes com o hebraico e com a política terminológica indicada. «Parte devida» comunica de modo adequado a porção atribuída.
