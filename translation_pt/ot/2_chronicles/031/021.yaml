source:
  edition: WLC
  text: וּ/בְ/כָֽל מַעֲשֶׂ֞ה אֲשֶׁר הֵחֵ֣ל בַּ/עֲבוֹדַ֣ת בֵּית הָ/אֱלֹהִ֗ים וּ/בַ/תּוֹרָה֙ וּ/בַ/מִּצְוָ֔ה לִ/דְרֹ֖שׁ לֵֽ/אלֹהָ֑י/ו בְּ/כָל לְבָב֥/וֹ עָשָׂ֖ה וְ/הִצְלִֽיחַ־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/021.yaml
  text: And in every work that he began in the service of the house of God[a], and in the law and the commandment, seeking his God with all his heart[c][b], he did and prospered.
translation:
  language: pt
  text: E, em toda obra que iniciou no serviço da casa de Deus, na Lei[a] e no mandamento, para buscar o seu Deus[b], ele a fez de todo o coração e prosperou[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na instrução”. O hebraico torá pode significar tanto lei como instrução.
    reason: lexical_alternative
  - marker: b
    text: Ou “para consultar o seu Deus”. O verbo hebraico pode expressar tanto a busca como a consulta.
    reason: lexical_alternative
  - marker: c
    text: Ou “teve êxito”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל מַעֲשֶׂה
  choice: E, em toda obra
  rationale: מַעֲשֶׂה pode designar obra, ação ou atividade. “Obra” mantém a amplitude do termo e se ajusta ao contexto das iniciativas religiosas e administrativas de Ezequias.
- source_word: אֲשֶׁר הֵחֵל
  choice: que iniciou
  rationale: O hifil de החל significa normalmente “começar, iniciar”. A formulação é direta e não acrescenta a ideia mais interpretativa de simplesmente “empreender”.
- source_word: בַּעֲבוֹדַת בֵּית הָאֱלֹהִים
  choice: no serviço da casa de Deus
  rationale: עֲבוֹדָה abrange trabalho e serviço, inclusive serviço ligado ao culto. A tradução preserva essa amplitude sem restringir a referência aos ritos sacerdotais.
- source_word: וּבַתּוֹרָה
  choice: na Lei
  rationale: תּוֹרָה pode significar lei ou instrução. No contexto das reformas de Ezequias, “Lei” comunica bem a referência à ordem normativa de Deus, enquanto “instrução” é mantida em nota.
- source_word: וּבַמִּצְוָה
  choice: e no mandamento
  rationale: Mantém o singular hebraico מִצְוָה, que pode ter valor coletivo, sem transformá-lo explicitamente em plural.
- source_word: לִדְרֹשׁ לֵאלֹהָיו
  choice: para buscar o seu Deus
  rationale: דרשׁ pode significar buscar, consultar ou indagar. “Buscar” preserva o motivo teológico recorrente em Crônicas, sem eliminar a nuance de consulta, registrada em nota.
- source_word: בְּכָל לְבָבוֹ
  choice: de todo o coração
  rationale: Expressão portuguesa natural para dedicação integral. Pela ordem das palavras e pela acentuação massorética, foi ligada à ação de Ezequias, sem negar a proximidade semântica com a busca de Deus.
- source_word: עָשָׂה
  choice: ele agiu
  rationale: עשה é um verbo amplo, “fazer, agir”. “Agiu” evita a necessidade de inserir um objeto ausente no hebraico e produz uma frase compreensível em português.
- source_word: וְהִצְלִיחַ
  choice: e prosperou
  rationale: O hifil de צלח pode ter sentido intransitivo de prosperar ou ter êxito. “Prosperou” conserva a linguagem bíblica de avaliação geral, com “teve êxito” em nota.
theological_decisions:
- issue: Sentido de תּוֹרָה no contexto da reforma
  choice: Lei
  alternative: instrução
  rationale: O contexto associa as medidas de Ezequias à obediência normativa e à organização do templo. “Lei” é adequada no texto principal, mas a extensão semântica de תּוֹרָה é preservada em nota.
- issue: Sentido de לִדְרֹשׁ לֵאלֹהָיו
  choice: buscar o seu Deus
  alternative: consultar o seu Deus
  rationale: Em Crônicas, buscar a Deus é um motivo de fidelidade e devoção, embora o verbo também possa indicar consulta. A tradução principal preserva o motivo recorrente e a nota conserva a alternativa genuína.
- issue: Vinculação de בְּכָל לְבָבוֹ
  choice: ligado a “ele agiu”
  alternative: ligado a “buscar o seu Deus”
  rationale: A ordem do hebraico e o acento disjuntivo em אֱלֹהָיו favorecem a leitura “de todo o coração ele agiu”. A proximidade conceitual permite que a dedicação também caracterize a busca, mas isso não foi imposto pela pontuação portuguesa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva a estrutura resumitiva do hebraico sem reproduzir de modo rígido sua ordem. “Casa de Deus” foi mantido em vez de “templo” para preservar a imagem e o vocabulário da fonte.
