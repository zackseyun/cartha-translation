  text: וַ/יָּבֹ֨אוּ֙ יְחִזְקִיָּ֣הוּ וְ/הַ/שָּׂרִ֔ים וַ/יִּרְא֖וּ אֶת הָ/עֲרֵמ֑וֹת וַֽ/יְבָרֲכוּ֙ אֶת יְהוָ֔ה וְ/אֵ֖ת עַמּ֥/וֹ יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/008.yaml
  text: When Hezekiah and the officials came and saw the heaps[b][a], they blessed Yahweh and his people Israel.
translation:
  language: pt
  text: Quando Ezequias e os oficiais chegaram e viram os montes[a], bendisseram a Yahweh e ao seu povo, Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as pilhas”. O termo hebraico indica montes formados por coisas acumuladas, aqui as contribuições mencionadas no contexto.
    reason: lexical_alternative
  - marker: b
    text: 'O pronome “seu” provavelmente se refere a Yahweh. Também é possível entendê-lo como referência a Ezequias: “o povo dele, Israel”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: chegaram
  rationale: O verbo בוא, na sequência narrativa, indica que Ezequias e os oficiais chegaram ao local; “chegaram” é natural e claro em português.
- source_word: יְחִזְקִיָּהוּ
  choice: Ezequias
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: וְהַשָּׂרִים
  choice: e os oficiais
  rationale: שָׂרִים designa autoridades ou dirigentes; “oficiais” comunica bem a função administrativa no contexto, sem o sentido dinástico que “príncipes” poderia sugerir.
- source_word: וַיִּרְאוּ
  choice: e viram
  rationale: Tradução direta de ראה, preservando a progressão narrativa do hebraico.
- source_word: הָעֲרֵמוֹת
  choice: os montes
  rationale: עֲרֵמוֹת refere-se a acumulações ou pilhas, neste contexto de produtos e contribuições. “Montes” preserva a imagem concreta e é idiomático em português.
- source_word: וַיְבָרֲכוּ
  choice: bendisseram
  rationale: ברך, tendo Deus e também o povo como objetos, é melhor preservado pelo verbo “bendizer”; “louvaram” estreitaria o sentido e seria menos natural em relação ao povo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: וְאֵת עַמּוֹ יִשְׂרָאֵל
  choice: e ao seu povo, Israel
  rationale: Preserva a coordenação dos dois objetos de “bendisseram” e apresenta Israel como identificação do povo; o referente mais provável de “seu” é Yahweh, embora a gramática também permita Ezequias.
theological_decisions:
- issue: Referente do sufixo em עַמּוֹ (“seu povo”)
  choice: 'O pronome é entendido primariamente como referência a Yahweh: “seu povo, Israel”.'
  alternative: 'O pronome pode referir-se a Ezequias, no sentido régio: “seu povo, Israel”.'
  rationale: Yahweh é o antecedente imediato e a expressão de Israel como povo de Yahweh é comum. Contudo, como Ezequias também pode ser o referente gramatical, a nota conserva a ambiguidade genuína.
- issue: Sentido de ברך aplicado a Yahweh e a Israel
  choice: “bendisseram a Yahweh e ao seu povo”
  alternative: “louvaram Yahweh e o seu povo”
  rationale: “Bendizer” preserva o mesmo verbo para ambos os objetos e evita reduzir o campo semântico a louvor dirigido exclusivamente a Deus.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. Mantém “Yahweh” como nome divino, usa “oficiais” em vez do potencialmente arcaico ou dinástico “príncipes” e conserva por nota a ambiguidade do pronome possessivo.
