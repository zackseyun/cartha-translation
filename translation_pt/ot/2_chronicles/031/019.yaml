base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/019.yaml
  text: And for the sons of Aaron[a], the priests, in the pasture lands of their cities, in every city[e][d][c][b], there were men designated by name to give portions to every male among the priests and to everyone enrolled by genealogy among the Levites.
translation:
  language: pt
  text: Quanto aos filhos de Arão[a], os sacerdotes, nos campos das terras de pastagem[b] de suas cidades, em cada uma das cidades[c], havia homens designados pelo nome[d] para dar porções a todo homem entre os sacerdotes e a todos os que estavam registrados genealogicamente entre os levitas[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “descendentes de Arão”. Em contextos genealógicos, a expressão hebraica “filhos de Arão” pode incluir descendentes de gerações posteriores.
    reason: lexical_alternative
  - marker: b
    text: Também se pode traduzir por “terras comunais” ou “terras abertas”. Eram áreas ao redor das cidades, muitas vezes usadas como pastagem.
    reason: cultural_note
  - marker: c
    text: O hebraico diz literalmente “em toda cidade e cidade”, expressão distributiva com o sentido de “em cada uma das cidades”.
    reason: lexical_alternative
  - marker: d
    text: Ou “identificados pelo nome”, “alistados pelo nome” ou “nomeados pelo nome”. O hebraico indica que esses homens haviam sido especificados oficialmente.
    reason: lexical_alternative
  - marker: e
    text: Isto é, os que constavam dos registros genealógicos dos levitas.
    reason: cultural_note
lexical_decisions:
- source_word: וְלִבְנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: Quanto aos filhos de Arão, os sacerdotes
  rationale: Mantém a expressão genealógica hebraica “filhos de Arão” e a aposição “os sacerdotes”, sem restringi-la aos filhos imediatos.
- source_word: בִּשְׂדֵי מִגְרַשׁ עָרֵיהֶם
  choice: nos campos das terras de pastagem de suas cidades
  rationale: Preserva tanto שְׂדֵי, “campos”, como מִגְרַשׁ, as terras abertas ou comunais ao redor das cidades, frequentemente usadas como pastagem.
- source_word: בְּכָל עִיר וָעִיר
  choice: em cada uma das cidades
  rationale: Expressa em português natural a repetição distributiva hebraica, que enfatiza a abrangência cidade por cidade.
- source_word: אֲנָשִׁים אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת
  choice: havia homens designados pelo nome
  rationale: Comunica a identificação oficial e específica desses homens, sem decidir de modo excessivo entre nomeação e simples inclusão numa lista.
- source_word: לָתֵת מָנוֹת
  choice: para dar porções
  rationale: מָנוֹת designa porções ou quotas de provisões distribuídas; a formulação é concisa e adequada ao contexto.
- source_word: לְכָל זָכָר בַּכֹּהֲנִים
  choice: a todo homem entre os sacerdotes
  rationale: No contexto humano, “homem” comunica naturalmente o masculino específico de זָכָר, enquanto “entre os sacerdotes” expressa a relação partitiva.
- source_word: וּלְכָל הִתְיַחֵשׂ בַּלְוִיִּם
  choice: e a todos os que estavam registrados genealogicamente entre os levitas
  rationale: O hitpael de יחס se refere à inscrição ou ao reconhecimento em registros genealógicos; a tradução conserva esse sentido administrativo.
