  text: וַ/יֹּ֣אמֶר יְחִזְקִיָּ֗הוּ לְ/הָכִ֧ין לְשָׁכ֛וֹת בְּ/בֵ֥ית יְהוָ֖ה וַ/יָּכִֽינוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/011.yaml
  text: Then Hezekiah commanded them to prepare chambers in the house of Yahweh[b][a], and they prepared them.
translation:
  language: pt
  text: Então Ezequias ordenou que preparassem salas[a] na casa de Yahweh[b], e eles as prepararam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «aposentos» ou «depósitos».
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: YHWH, o nome pessoal de Deus; tradicionalmente traduzido por «SENHOR».'
    reason: divine_name
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ordenou
  rationale: Embora o verbo signifique literalmente «disse», a construção com o infinitivo לְהָכִין introduz aqui uma instrução real. «Ordenou que preparassem» comunica essa força de modo natural.
- source_word: יְחִזְקִיָּהוּ
  choice: Ezequias
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: לְהָכִין
  choice: que preparassem
  rationale: O hifil de כון significa tornar pronto ou preparar; a oração subordinada é a formulação mais natural depois de «ordenou».
- source_word: לְשָׁכוֹת
  choice: salas
  rationale: O substantivo designa dependências ou aposentos do complexo do templo. «Salas» é claro e não explicita como significado lexical a função de armazenamento, que vem do contexto.
- source_word: בְּבֵית יְהוָה
  choice: na casa de Yahweh
  rationale: Preserva a expressão hebraica «casa de Yahweh» em vez de substituí-la interpretativamente por «templo».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיָּכִינוּ
  choice: e eles as prepararam
  rationale: O objeto plural está implícito em hebraico e é retomado naturalmente em português pelo pronome «as», referente às salas.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o Tetragrama. «Yahweh» preserva o nome pessoal, sem o substituir pelo título «SENHOR».
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural. «Casa de Yahweh» conserva a imagem arquitetônica e religiosa do hebraico; «salas» evita o tom arcaizante de «câmaras» e mantém aberta a função exata das dependências.
