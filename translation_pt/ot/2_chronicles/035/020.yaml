  text: אַחֲרֵ֣י כָל זֹ֗את אֲשֶׁ֨ר הֵכִ֤ין יֹֽאשִׁיָּ֨הוּ֙ אֶת הַ/בַּ֔יִת עָלָ֞ה נְכ֧וֹ מֶֽלֶךְ מִצְרַ֛יִם לְ/הִלָּחֵ֥ם בְּ/כַרְכְּמִ֖ישׁ עַל פְּרָ֑ת וַ/יֵּצֵ֥א לִ/קְרָאת֖/וֹ יֹאשִׁיָּֽהוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/020.yaml
  text: After all this[a], when Josiah had prepared the house, Neco king of Egypt went up to fight at Carchemish on the Euphrates[b], and Josiah went out to meet him.
translation:
  language: pt
  text: Depois de tudo isso, quando Josias havia preparado o templo[a], Neco, rei do Egito, subiu para guerrear em Carquemis, junto ao Eufrates, e Josias saiu ao encontro dele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a casa”, isto é, o templo.'
    reason: literal_rendering
  - marker: b
    text: Neste contexto militar, “saiu ao encontro dele” também pode ter o sentido de “saiu contra ele”.
    reason: alternative_reading
lexical_decisions:
- source_word: הֵכִין
  choice: havia preparado
  rationale: O hifil de כון pode significar preparar, deixar pronto ou estabelecer. “Havia preparado” mantém a amplitude lexical do hebraico e se encaixa naturalmente na referência às medidas de Josias relativas ao templo.
- source_word: הַבַּיִת
  choice: o templo
  rationale: A expressão significa literalmente “a casa”, mas, no contexto de Crônicas, designa claramente o templo. A tradução explícita evita obscuridade para o leitor moderno, enquanto a nota preserva a forma literal.
- source_word: עָלָה
  choice: subiu
  rationale: Reproduz o verbo comum עלה sem acrescentar a ideia mais específica de marchar, embora o contexto seja militar.
- source_word: לְהִלָּחֵם
  choice: para guerrear
  rationale: Expressa de modo natural o propósito militar do infinitivo de לחם. “Lutar” também seria possível, mas “guerrear” deixa claro que se trata de uma campanha armada.
- source_word: בְּכַרְכְּמִישׁ
  choice: em Carquemis
  rationale: 'A preposição ב é entendida em sentido locativo: a ação militar tinha Carquemis como local ou objetivo geográfico.'
- source_word: עַל פְּרָת
  choice: junto ao Eufrates
  rationale: Nesse uso geográfico, עַל indica localização à margem ou nas proximidades do rio; “junto ao Eufrates” é mais natural e menos ambíguo em português do que “sobre o Eufrates”.
- source_word: וַיֵּצֵא לִקְרָאתוֹ
  choice: saiu ao encontro dele
  rationale: לִקְרָאתוֹ pode indicar ir ao encontro de alguém, inclusive com intenção hostil. A formulação preserva essa ambiguidade, sem explicitar no texto uma oposição que o contexto militar apenas sugere.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega “templo” no texto para clareza referencial e registra a forma literal em nota. Mantém a ambiguidade de “sair ao encontro” em vez de resolver silenciosamente a intenção de Josias.
