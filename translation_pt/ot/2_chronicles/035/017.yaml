  text: וַ/יַּעֲשׂ֨וּ בְנֵֽי יִשְׂרָאֵ֧ל הַֽ/נִּמְצְאִ֛ים אֶת הַ/פֶּ֖סַח בָּ/עֵ֣ת הַ/הִ֑יא וְ/אֶת חַ֥ג הַ/מַּצּ֖וֹת שִׁבְעַ֥ת יָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/017.yaml
  text: And the Israelites who were present kept the Passover at that time, and the Feast of Unleavened Bread for seven days.
translation:
  language: pt
  text: Os israelitas que estavam presentes celebraram a Páscoa naquela ocasião e a Festa dos Pães sem Fermento durante sete dias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: celebraram
  rationale: Embora o verbo signifique literalmente “fizeram”, quando tem uma festa ou observância como objeto assume o sentido idiomático de celebrar ou observar. “Celebraram” é natural em português e se aplica adequadamente à Páscoa e à festa mencionadas.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os israelitas
  rationale: A expressão é um etnônimo coletivo. “Os israelitas” comunica seu sentido em português moderno sem o literalismo pouco natural de “os filhos de Israel”.
- source_word: הַנִּמְצְאִים
  choice: que estavam presentes
  rationale: Neste contexto, o particípio indica as pessoas que se encontravam ali e participavam da ocasião; “que estavam presentes” expressa claramente esse valor situacional.
- source_word: הַפֶּסַח
  choice: a Páscoa
  rationale: Aqui o termo designa a observância pascal, não necessariamente apenas o animal sacrificial. “A Páscoa” é a forma consagrada e contextualmente suficiente em português.
- source_word: בָּעֵת הַהִיא
  choice: naquela ocasião
  rationale: A expressão é temporal. “Naquela ocasião” retoma naturalmente o momento narrado sem acrescentar a ideia não explícita de um tempo previamente designado.
- source_word: חַג הַמַּצּוֹת
  choice: a Festa dos Pães sem Fermento
  rationale: חַג designa uma festa religiosa, e מַצּוֹת são pães não fermentados. Esta forma é clara para leitores comuns e preserva o nome distintivo da celebração.
- source_word: שִׁבְעַת יָמִים
  choice: durante sete dias
  rationale: A preposição “durante” explicita de maneira idiomática em português a duração da celebração indicada pelo hebraico.
