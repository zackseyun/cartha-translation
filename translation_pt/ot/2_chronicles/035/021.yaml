base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/021.yaml
  text: But he sent messengers to him[a], saying, “What have I to do with you, king of Judah? I am not coming against you today, but against the house with which I am at war; and God has told me to hurry. Stop opposing God, who is with me, so that he does not destroy you.”
translation:
  language: pt
  text: 'Mas ele lhe enviou mensageiros, dizendo: “O que tenho eu a ver com você, rei de Judá? Hoje não venho contra você, mas contra a casa com a qual estou em guerra.[a] Deus me mandou me apressar. Pare de se opor a Deus, que está comigo, para que ele não destrua você.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contra o lugar da minha guerra”, ou “contra a casa/o reino com o qual estou em guerra”. A expressão hebraica é difícil.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִים
  choice: mensageiros
  rationale: No contexto narrativo, são representantes humanos enviados pelo faraó Neco; “mensageiros” é claro e preserva o sentido amplo do termo.
- source_word: מַה לִּי וָלָךְ
  choice: Que tenho eu a ver com você?
  rationale: Equivalente idiomático natural em português para uma fórmula de não envolvimento ou afastamento, sem acrescentar hostilidade indevida.
- source_word: לֹא עָלֶיךָ אַתָּה הַיּוֹם
  choice: Hoje não venho contra você
  rationale: O hebraico é elíptico; “venho” explicita naturalmente o movimento militar implícito sem alterar o sentido.
- source_word: אֶל בֵּית מִלְחַמְתִּי
  choice: contra a casa com a qual estou em guerra
  rationale: Mantém a imagem de “casa” e expressa a relação hostil, mas a frase hebraica permanece difícil; por isso, outras possibilidades são registradas em nota.
- source_word: וֵאלֹהִים
  choice: Deus
  rationale: Embora אֱלֹהִים tenha forma plural, o verbo singular אָמַר favorece referência singular; o enquadramento narrativo do versículo seguinte também trata a advertência como procedente de Deus.
- source_word: לְבַהֲלֵנִי
  choice: que me apressasse
  rationale: Expressa a urgência causativa do verbo em português natural, dentro da construção “ordenou que”.
- source_word: חֲדַל לְךָ מֵאֱלֹהִים
  choice: Pare de se opor a Deus
  rationale: Comunica a exortação para deixar de interferir na ação divina, tornando explícita a força idiomática da construção.
- source_word: אֲשֶׁר עִמִּי
  choice: que está comigo
  rationale: Preserva a formulação simples do hebraico sem definir além do texto a natureza do apoio divino.
- source_word: וְאַל יַשְׁחִיתֶךָ
  choice: para que ele não destrua você
  rationale: A oração expressa a consequência a ser evitada; “destrua” conserva a severidade da advertência.
theological_decisions:
- issue: Referência de אֱלֹהִים na fala de Neco
  choice: Deus, no singular e com inicial maiúscula
  alternative: “um deus” ou “os deuses”
  rationale: O verbo singular favorece um referente singular, e 2Crônicas 35:22 apresenta essas palavras como vindas da boca de Deus. A tradução acompanha o enquadramento do narrador sem desenvolver uma explicação teológica adicional.
- issue: Sentido de בֵּית מִלְחַמְתִּי
  choice: Manter “casa” no texto principal, com esclarecimento relacional
  alternative: “lugar da minha guerra” ou “reino contra o qual estou em guerra”
  rationale: A expressão hebraica é incomum e seu referente exato é incerto. A tradução preserva a imagem lexical e registra em nota as principais leituras plausíveis, sem resolver artificialmente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você” na fala direta por naturalidade contemporânea, sem coloquialismo excessivo. A pontuação separa a ordem divina da explicação anterior e mantém clara a progressão da advertência.
