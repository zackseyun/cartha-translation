  text: וַ/יַּעֲמֵ֥ד הַ/כֹּהֲנִ֖ים עַל מִשְׁמְרוֹתָ֑/ם וַֽ/יְחַזְּקֵ֔/ם לַ/עֲבוֹדַ֖ת בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/002.yaml
  text: He appointed the priests to their duties and strengthened them for the service of the house of Yahweh[a][b].
translation:
  language: pt
  text: Ele designou os sacerdotes para as suas funções[a] e os fortaleceu[b] para o serviço da casa de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em suas divisões”, “em seus postos” ou, mais literalmente, “sobre os seus turnos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “os encorajou”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: designou
  rationale: O hifil de עמד indica colocar ou estabelecer alguém numa posição determinada. “Designou” comunica naturalmente o ato administrativo de Josias ao organizar os sacerdotes.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Tradução corrente de כֹּהֲנִים, preservando o artigo definido.
- source_word: עַל מִשְׁמְרוֹתָם
  choice: para as suas funções
  rationale: מִשְׁמָרוֹת pode indicar turnos, postos ou divisões de serviço. Neste contexto, “funções” expressa com clareza as responsabilidades sacerdotais designadas, enquanto a nota preserva as alternativas mais formais.
- source_word: וַיְחַזְּקֵם
  choice: e os fortaleceu
  rationale: O piel de חזק pode significar fortalecer, dar apoio ou encorajar. “Fortaleceu” conserva o núcleo lexical e deixa aberta a natureza desse fortalecimento.
- source_word: לַעֲבוֹדַת
  choice: para o serviço
  rationale: עֲבוֹדָה designa trabalho ou serviço, especialmente o serviço ligado ao santuário. “Serviço” é amplo, natural e apropriado ao contexto.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Preserva a expressão hebraica “casa de Yahweh”, referente ao templo, e representa diretamente o nome divino יְהוָה.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz explicitamente o Tetragrama. “Yahweh” representa o nome próprio, em vez de substituí-lo por um título, sem acrescentar interpretação denominacional.
- issue: Natureza da ação expressa por וַיְחַזְּקֵם
  choice: os fortaleceu
  alternative: os encorajou
  rationale: A forma verbal admite tanto fortalecimento quanto encorajamento. O texto principal conserva o sentido lexical mais amplo, e a nota registra a alternativa contextual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A estrutura é natural sem apagar a terminologia institucional do serviço sacerdotal nem a ambiguidade de חזק.
