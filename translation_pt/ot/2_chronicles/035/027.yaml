  text: וּ/דְבָרָ֕י/ו הָ/רִאשֹׁנִ֖ים וְ/הָ/אַחֲרֹנִ֑ים הִנָּ֣/ם כְּתוּבִ֔ים עַל סֵ֥פֶר מַלְכֵֽי יִשְׂרָאֵ֖ל וִ/יהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/027.yaml
  text: His acts[a], first and last, behold[c][b], they are written in the Book of the Kings of Israel and Judah.
translation:
  language: pt
  text: Os seus feitos[a], dos primeiros aos últimos, eis que[b] estão escritos no Livro[c] dos Reis de Israel e de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas palavras”, “seus assuntos” ou “seus atos”; o termo hebraico pode ter todos esses sentidos. Neste resumo do reinado, “feitos” se ajusta melhor ao contexto.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica chama enfaticamente a atenção para a fonte escrita.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “sobre o livro”; também se pode traduzir “sobre o rolo”. Em português, “no Livro” é a forma natural de indicar onde algo está escrito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְבָרָיו
  choice: Os seus feitos
  rationale: דָּבָר pode significar “palavra”, “assunto” ou, por extensão, “feito”. Nesta fórmula de resumo régio, “feitos” expressa naturalmente os atos e acontecimentos do reinado, sem excluir em nota a amplitude do termo hebraico.
- source_word: הָרִאשֹׁנִים וְהָאַחֲרֹנִים
  choice: dos primeiros aos últimos
  rationale: A expressão abrange toda a trajetória registrada, desde os feitos iniciais até os finais. A construção com “dos... aos...” soa natural em português e conserva a fórmula hebraica.
- source_word: הִנָּם
  choice: eis que
  rationale: Mantém a função enfática e de chamada de atenção da partícula hebraica, em registro bíblico ainda compreensível.
- source_word: כְּתוּבִים
  choice: estão escritos
  rationale: Reproduz diretamente o particípio passivo de כתב e preserva a fórmula documental do texto.
- source_word: עַל סֵפֶר
  choice: no Livro
  rationale: Embora עַל tenha o sentido básico de “sobre”, em referência a conteúdo escrito o português idiomático emprega “no livro”. “Livro” é a designação convencional, embora “rolo” também seja historicamente possível.
- source_word: מַלְכֵי יִשְׂרָאֵל וִיהוּדָה
  choice: dos Reis de Israel e de Judá
  rationale: A expressão funciona como título da obra citada. A repetição de “de” antes de “Judá” favorece clareza e naturalidade em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Eis que” conserva deliberadamente a ênfase do hebraico; as notas registram as principais alternativas lexicais e documentais sem sobrecarregar o versículo.
