  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יֹאשִׁיָּ֖הוּ וַ/חֲסָדָ֑י/ו כַּ/כָּת֖וּב בְּ/תוֹרַ֥ת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/026.yaml
  text: 'The rest of the acts of Josiah[a], and his deeds of faithful love, as written in the Law of Yahweh:'
translation:
  language: pt
  text: 'Quanto aos demais atos de Josias e às suas obras de amor leal[a], conforme está escrito na Lei de Yahweh:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus atos de lealdade”, “suas obras fiéis” ou “suas bondades”. O termo hebraico pode indicar bondade, lealdade ou fidelidade à aliança.
    reason: alternativa lexical
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Quanto aos demais atos
  rationale: A fórmula historiográfica refere-se aos demais feitos do rei, não apenas às suas palavras. “Quanto aos” introduz com naturalidade em português este resumo que continua no versículo seguinte.
- source_word: יֹאשִׁיָּהוּ
  choice: Josias
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַחֲסָדָיו
  choice: e às suas obras de amor leal[a]
  rationale: O plural contextualiza חֶסֶד como ações concretas de Josias. “Amor leal” mantém juntas as ideias de bondade, lealdade e fidelidade relacional, sem restringir o termo exclusivamente a uma formulação técnica de aliança.
- source_word: כַּכָּתוּב
  choice: conforme estão escritos
  rationale: Expressa o sentido de “conforme escrito” e ajusta o verbo aos dois elementos coordenados em português.
- source_word: בְּתוֹרַת
  choice: na Lei de
  rationale: Neste contexto, תּוֹרָה designa a instrução divina escrita e normativa; “Lei” é a forma bíblica mais clara e corrente em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Sentido de חֶסֶד aplicado a Josias
  choice: obras de amor leal
  alternative: atos de lealdade; obras fiéis; bondades; obras de fidelidade à aliança
  rationale: A expressão comunica bondade e lealdade fiel sem transformar em explícita uma referência à aliança que permanece implícita no termo e no contexto.
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração conserva o caráter de nome próprio do tetragrama.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “Quanto aos” mantém o caráter de fórmula conclusiva e a relação sintática com o versículo seguinte; os dois-pontos preservam a continuidade do período.
