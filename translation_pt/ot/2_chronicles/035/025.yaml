revisions:
- from: Jeremias entoou uma lamentação por Josias, e todos os cantores e todas as cantoras ainda hoje falam de Josias em suas lamentações. Eles as estabeleceram como prática em Israel; e elas estão registradas nas Lamentações.[a]
  to: Jeremias entoou uma lamentação por Josias, e todos os cantores e todas as cantoras ainda hoje falam de Josias em suas lamentações. Estabeleceram essas lamentações como norma em Israel; e elas estão registradas nas Lamentações.[a]
  rationale: A revisão substitui «prática» por «norma», equivalente mais preciso de חֹק neste contexto, e explicita que o referente são as lamentações. Mantêm-se a construção durativa «ainda hoje falam», a distinção entre cantores e cantoras e a ambiguidade de «Lamentações», devidamente indicada pela nota.
