  text: וַ/יְקוֹנֵ֣ן יִרְמְיָהוּ֮ עַל יֹאשִׁיָּהוּ֒ וַ/יֹּאמְר֣וּ כָֽל הַ/שָּׁרִ֣ים וְ֠/הַ/שָּׁרוֹת בְּ/קִינ֨וֹתֵי/הֶ֤ם עַל יֹאשִׁיָּ֨הוּ֙ עַד הַ/יּ֔וֹם וַ/יִּתְּנ֥וּ/ם לְ/חֹ֖ק עַל יִשְׂרָאֵ֑ל וְ/הִנָּ֥/ם כְּתוּבִ֖ים עַל הַ/קִּינֽוֹת־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/025.yaml
  text: And Jeremiah lamented for Josiah[a], and all the male singers and female singers speak of Josiah in their laments to this day. And they made them a statute in Israel; behold, they are written in the Laments.
translation:
  language: pt
  text: Jeremias entoou uma lamentação por Josias, e todos os cantores e todas as cantoras ainda hoje falam de Josias em suas lamentações. Estabeleceram essas lamentações como norma em Israel; e elas estão registradas nas Lamentações.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «entre as lamentações», caso a expressão se refira genericamente a cantos de lamento, e não a uma coleção específica intitulada Lamentações.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְקוֹנֵן
  choice: entoou uma lamentação
  rationale: O verbo קונן denota proferir ou cantar uma lamentação fúnebre. A formulação é natural em português e não afirma que Jeremias necessariamente a compôs.
- source_word: עַל יֹאשִׁיָּהוּ
  choice: por Josias
  rationale: Com linguagem de luto, «lamentação por Josias» expressa naturalmente o objeto da lamentação.
- source_word: הַשָּׁרִים וְהַשָּׁרוֹת
  choice: todos os cantores e todas as cantoras
  rationale: As formas hebraicas designam pessoas que cantam e distinguem explicitamente os gêneros; a tradução preserva essa distinção.
- source_word: וַיֹּאמְרוּ ... עַד הַיּוֹם
  choice: ainda hoje falam
  rationale: Embora וַיֹּאמְרוּ seja formalmente narrativo, «até este dia» apresenta a prática como vigente no tempo do narrador. «Falam» mantém a amplitude de אמר sem impor que necessariamente cantem.
- source_word: בְּקִינוֹתֵיהֶם
  choice: em suas lamentações
  rationale: קִינוֹת refere-se a cantos ou poemas fúnebres; «lamentações» é claro, digno e corrente.
- source_word: וַיִּתְּנוּם לְחֹק עַל יִשְׂרָאֵל
  choice: Eles as estabeleceram como prática em Israel
  rationale: חֹק pode indicar estatuto, prescrição ou costume estabelecido. «Prática» comunica aqui uma observância fixada sem sugerir necessariamente legislação civil.
- source_word: וְהִנָּם כְּתוּבִים
  choice: e elas estão registradas
  rationale: A construção chama a atenção para o registro escrito. Em português, «estão registradas» transmite isso naturalmente; o ponto e vírgula conserva a ênfase da transição.
- source_word: עַל הַקִּינוֹת
  choice: nas Lamentações
  rationale: O artigo pode apontar para uma coleção conhecida de lamentações. A inicial maiúscula sinaliza essa leitura sem identificá-la automaticamente com o livro canônico de Lamentações.
theological_decisions:
- issue: Identidade de «as Lamentações»
  choice: Tratar a expressão como possível título de uma coleção conhecida, com inicial maiúscula.
  alternative: Entender genericamente como «entre as lamentações» ou «nos cantos de lamento».
  rationale: O hebraico permite uma referência a uma coleção, mas não estabelece que seja o livro bíblico de Lamentações; a nota preserva a leitura genérica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição «todos os cantores e todas as cantoras» preserva a distinção explícita do hebraico. O marcador da nota foi colocado após a expressão específica à qual se refere.
