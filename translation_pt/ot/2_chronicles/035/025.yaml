  naturalness: O texto é claro, atual e de boa leitura em português internacional. «Entoou uma lamentação» é natural neste contexto. A formulação revista torna mais explícito que o objeto estabelecido eram as lamentações, sem acrescentar informação ao texto.
  terminology: «Lamentação/lamentações» corresponde bem a קינה/קינות. A maiúscula em «Lamentações» mantém a possível alusão a uma coleção conhecida, enquanto a nota preserva a leitura genérica e evita identificá-la com segurança ao livro canônico.
