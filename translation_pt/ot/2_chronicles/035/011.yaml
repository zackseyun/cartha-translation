  source_fidelity: A tradução reconhece corretamente o contexto sacrificial de שׁחט, פֶּסַח, זרק e פשט. Contudo, o perfeito narrativo hebraico exige pretérito perfeito em «aspergiram», não o imperfeito «aspergiam». Além disso, «que recebiam» introduz uma ação de receber que o hebraico não declara e enfraquece a ambiguidade de מִיָּדָם.
  naturalness: «Abateram as vítimas pascais» é natural, preciso e evita restringir indevidamente פֶּסַח a cordeiros. «Os sacerdotes aspergiram o sangue das mãos deles» preserva a formulação e a referência pronominal aberta do hebraico; a nota explica a construção. «Retiravam as peles» é claro em português moderno e adequado ao contexto.
  terminology: «Vítimas pascais», «sacerdotes», «aspergiram» e «levitas» mantêm registro ritual sóbrio e amplamente compreensível. «Peles» traduz adequadamente o objeto implícito de מַפְשִׁיטִים sem introduzir uma interpretação teológica.
  issues:
  - severity: medium
    issue: «os sacerdotes aspergiam» está no imperfeito.
    rationale: וַיִּזְרְקוּ é forma narrativa perfectiva, coordenada com «abateram»; em português, «aspergiram» reproduz a ação pontual concluída.
  - severity: medium
    issue: «o sangue que recebiam das mãos deles» acrescenta explicitamente o ato de receber.
    rationale: מִיָּדָם diz apenas «das mãos deles». Embora o contexto torne provável a entrega do sangue, o texto não expressa o verbo «receber», e a nota corretamente observa que o referente do pronome não é identificado.
  - severity: low
    issue: A nota a caracteriza פֶּסַח como «vítimas» no plural.
    rationale: O hebraico emprega פֶּסַח no singular, com valor coletivo/contextual para a vítima ou sacrifício pascal. A tradução plural é natural em português, mas a nota deve formular essa relação sem atribuir plural gramatical ao termo hebraico.
  revised_text: Eles abateram as vítimas pascais[a], e os sacerdotes aspergiram o sangue das mãos deles[b], enquanto os levitas retiravam as peles[c].
