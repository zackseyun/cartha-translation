revisions:
- from: Eles abateram os animais da Páscoa[a]; os sacerdotes aspergiam o sangue que recebiam das mãos deles[b], enquanto os levitas tiravam a pele dos animais[c].
  to: Eles abateram as vítimas pascais[a], e os sacerdotes aspergiram o sangue das mãos deles[b], enquanto os levitas retiravam as peles[c].
  rationale: A revisão corrige o aspecto verbal narrativo, elimina a explicitação não presente de «recebiam» e conserva a ambiguidade pronominal mediante uma tradução direta acompanhada de nota. Também ajusta a nota sobre פֶּסַח para refletir o singular hebraico com seu sentido cultual contextual.
