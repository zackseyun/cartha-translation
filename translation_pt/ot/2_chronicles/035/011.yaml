  yaml_path: translation/ot/2_chronicles/035/011.yaml
  text: And they slaughtered the Passover lamb[a], and the priests splashed the blood from their hands[c][b], while the Levites were skinning them.
translation:
  language: pt
  text: Eles abateram as vítimas pascais[a], e os sacerdotes aspergiram o sangue das mãos deles[b], enquanto os levitas retiravam as peles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o sacrifício da Páscoa”. O termo hebraico refere-se aqui à vítima ou ao sacrifício pascal, não à festa em si.
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente “das mãos deles” e não identifica expressamente a quem o pronome se refere. Pelo contexto, provavelmente se refere aos que abatiam as vítimas.
    reason: ambiguity_note
  - marker: c
    text: O objeto não aparece expresso no hebraico; pelo contexto, os levitas retiravam as peles das vítimas abatidas.
    reason: clarity_note
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: abateram
  rationale: שׁחט é o verbo habitual para o abate de animais, especialmente em contexto sacrificial. “Abateram” comunica a morte ritual com mais precisão do que o genérico “mataram”.
- source_word: הַפָּסַח
  choice: os animais da Páscoa
  rationale: Aqui פֶּסַח designa coletivamente as vítimas pascais abatidas, e não apenas a festa. O plural explícito torna natural em português a referência aos vários animais mencionados pelo contexto, sem restringi-los necessariamente a cordeiros.
- source_word: וַיִּזְרְקוּ
  choice: aspergiam
  rationale: Em contexto sacrificial, זרק é o termo técnico para aplicar o sangue ao altar, lançando-o ou aspergindo-o. “Aspergiam” é uma formulação portuguesa reconhecível e digna, esclarecida em nota.
- source_word: מִיָּדָם
  choice: que recebiam das mãos deles
  rationale: 'A expressão hebraica significa literalmente “da mão deles”. O verbo “recebiam” explicita a relação exigida pelo contexto: os sacerdotes aplicavam o sangue entregue pelos que realizavam o abate. O pronome “deles” preserva a referência não expressamente identificada no hebraico.'
- source_word: מַפְשִׁיטִים
  choice: tiravam a pele dos animais
  rationale: O particípio de פשט, neste contexto, descreve a retirada das peles das vítimas abatidas. A formulação é clara e corrente; o objeto, implícito no hebraico, é explicitado pelo contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A tradução mantém o cenário ritual sem recorrer a vocabulário excessivamente técnico. O ponto e vírgula organiza as ações simultâneas, e as notas preservam tanto a amplitude de פֶּסַח quanto a ambiguidade pronominal de מִיָּדָם.
