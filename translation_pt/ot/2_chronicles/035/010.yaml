base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/010.yaml
  text: So the service was prepared[a], and the priests stood at their stations, and the Levites by their divisions[c][b], according to the command of the king.
translation:
  language: pt
  text: Assim, o serviço foi preparado[a], e os sacerdotes ficaram em seus postos[b], e os levitas, segundo as suas divisões[c], conforme a ordem do rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foi posto em ordem” ou “foi estabelecido”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “sobre/em sua posição”; isto é, nos postos que lhes haviam sido designados.
    reason: lexical_alternative
  - marker: c
    text: Ou “conforme as suas divisões” ou “em suas turmas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכּוֹן
  choice: foi preparado
  rationale: O verbo כון comunica aqui que o serviço foi aprontado ou posto em ordem. “Foi preparado” é natural no contexto da Páscoa e mantém a alternativa mais formal em nota.
- source_word: הָעֲבוֹדָה
  choice: o serviço
  rationale: Em contexto do templo, עֲבוֹדָה designa o serviço de culto. “O serviço” preserva esse sentido sem introduzir terminologia litúrgica posterior.
- source_word: וַיַּעַמְדוּ ... עַל עָמְדָם
  choice: ocuparam seus postos
  rationale: A combinação de עמד com עַל עָמְדָם indica que os sacerdotes tomaram as posições que lhes cabiam. A formulação é clara e idiomática em português.
- source_word: הַלְוִיִּם עַל מַחְלְקוֹתָם
  choice: os levitas se colocaram segundo as suas divisões
  rationale: מַחְלְקוֹתָם refere-se aos grupos ou turnos organizados dos levitas. O verbo “se colocaram”, suprido a partir do anterior, torna explícita em português a estrutura elíptica do hebraico.
- source_word: כְּמִצְוַת הַמֶּלֶךְ
  choice: conforme a ordem do rei
  rationale: מִצְוָה é aqui uma determinação real específica; “ordem” soa mais natural que “mandamento” nesse contexto.
theological_decisions:
- issue: Terminologia cultual de עֲבוֹדָה
  choice: o serviço
  alternative: o serviço ritual; o trabalho
  rationale: O contexto é o serviço da Páscoa no templo. A escolha conserva a dimensão cultual sem importar uma concepção denominacional de liturgia.
- issue: Organização dos sacerdotes e levitas
  choice: ocuparam seus postos ... segundo as suas divisões
  alternative: ficaram em seus lugares ... nas suas turmas
  rationale: A tradução preserva a disposição ordenada dos ministros do culto e distingue os postos dos sacerdotes das divisões organizacionais dos levitas.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Serviço” mantém o contexto cultual; “postos” e “divisões” comunicam a organização do rito sem linguagem excessivamente técnica.
