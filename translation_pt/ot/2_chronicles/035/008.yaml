base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/008.yaml
  text: And his officials contributed a freewill offering for the people[a], for the priests, and for the Levites. Hilkiah, Zechariah, and Jehiel, the leaders of the house of God[b], gave to the priests 2,600 Passover offerings and 300 cattle.
translation:
  language: pt
  text: Seus oficiais também contribuíram com uma oferta voluntária para o povo, para os sacerdotes e para os levitas. Hilquias, Zacarias e Jeiel, dirigentes da casa de Deus, deram aos sacerdotes 2.600 animais para a Páscoa[a] e trezentas cabeças de gado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O plural hebraico pode referir-se aos próprios animais destinados à celebração da Páscoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂרָיו
  choice: Seus oficiais também
  rationale: שָׂרִים designa autoridades ou altos funcionários. “Oficiais” preserva o caráter administrativo sem sugerir necessariamente príncipes de sangue real; “também” expressa naturalmente a ligação aditiva de וְ com o contexto anterior.
- source_word: לִנְדָבָה ... הֵרִימוּ
  choice: contribuíram com uma oferta voluntária
  rationale: נְדָבָה é uma dádiva espontânea, e o hifil de רום, neste contexto, indica apresentar ou contribuir com uma oferta. A formulação portuguesa conserva tanto a ação quanto o caráter voluntário da dádiva.
- source_word: לָעָם לַכֹּהֲנִים וְלַלְוִיִּם
  choice: para o povo, para os sacerdotes e para os levitas
  rationale: A repetição de לְ assinala os beneficiários da contribuição; “para” reproduz esse valor com clareza.
- source_word: חִלְקִיָּה וּזְכַרְיָהוּ וִיחִיאֵל
  choice: Hilquias, Zacarias e Jeiel
  rationale: Usam-se as formas portuguesas tradicionais e reconhecíveis dos nomes bíblicos.
- source_word: נְגִידֵי בֵּית הָאֱלֹהִים
  choice: dirigentes da casa de Deus
  rationale: נְגִידֵי indica pessoas em posição de liderança ou supervisão. “Dirigentes” combina naturalidade moderna com o contexto administrativo do templo; “casa de Deus” preserva a designação hebraica.
- source_word: לַפְּסָחִים אַלְפַּיִם וְשֵׁשׁ מֵאוֹת
  choice: 2.600 animais para as ofertas da Páscoa
  rationale: O plural פְּסָחִים pode designar os animais destinados aos sacrifícios pascais. A inclusão de “animais” torna explícito o que o numeral conta sem especificar uma espécie que o hebraico não nomeia neste versículo.
- source_word: וּבָקָר שְׁלֹשׁ מֵאוֹת
  choice: e trezentas cabeças de gado
  rationale: בָּקָר é um coletivo para gado bovino. “Cabeças de gado” permite contar naturalmente os trezentos animais e evita restringi-los a bois.
theological_decisions: []
