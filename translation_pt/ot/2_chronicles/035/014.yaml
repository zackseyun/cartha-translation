  text: וְ/אַחַ֗ר הֵכִ֤ינוּ לָ/הֶם֙ וְ/לַ/כֹּ֣הֲנִ֔ים כִּ֤י הַ/כֹּהֲנִים֙ בְּנֵ֣י אַהֲרֹ֔ן בְּ/הַֽעֲל֛וֹת הָ/עוֹלָ֥ה וְ/הַ/חֲלָבִ֖ים עַד לָ֑יְלָה וְ/הַ/לְוִיִּם֙ הֵכִ֣ינוּ לָ/הֶ֔ם וְ/לַ/כֹּהֲנִ֖ים בְּנֵ֥י אַהֲרֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/014.yaml
  text: Afterward they prepared for themselves and for the priests[a], because the priests, the sons of Aaron, were occupied in offering up the burnt offering and the fat portions until night. So the Levites prepared for themselves and for the priests, the sons of Aaron.
translation:
  language: pt
  text: Depois disso, prepararam para si mesmos e para os sacerdotes[a], pois os sacerdotes, filhos de Arão, estiveram ocupados em oferecer o holocausto e as porções de gordura até a noite. Por isso, os levitas prepararam para si mesmos e para os sacerdotes, filhos de Arão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para eles”, nas duas ocorrências de “para si mesmos”. O pronome hebraico não é explicitamente reflexivo, mas o contexto indica com bastante clareza que os levitas prepararam sua própria refeição e também a dos sacerdotes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: Depois disso
  rationale: Marca a sequência temporal em relação ao versículo anterior de modo claro e natural em português atual.
- source_word: הֵכִינוּ
  choice: prepararam
  rationale: O hifil de כון significa aqui preparar ou deixar pronto; o contexto indica provisões para a refeição, mas o verbo português preserva a amplitude do hebraico.
- source_word: לָהֶם
  choice: para si mesmos
  rationale: Embora o pronome hebraico não seja formalmente reflexivo, o sujeito contextual são os levitas, e a repetição posterior indica que prepararam provisões tanto para eles próprios como para os sacerdotes.
- source_word: וְלַכֹּהֲנִים
  choice: e para os sacerdotes
  rationale: Expressa diretamente o beneficiário adicional da preparação.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente a razão pela qual os levitas precisaram preparar também para os sacerdotes.
- source_word: הַכֹּהֲנִים בְּנֵי אַהֲרֹן
  choice: os sacerdotes, filhos de Arão
  rationale: Mantém a aposição genealógica e a linguagem bíblica do hebraico sem recorrer ao termo mais técnico 'aarônicos'.
- source_word: בְּהַעֲלוֹת
  choice: estiveram ocupados em oferecer
  rationale: No contexto sacrificial, עלה designa fazer subir ou oferecer no altar; a formulação explicita a atividade prolongada que impediu os sacerdotes de preparar sua própria refeição.
- source_word: הָעוֹלָה
  choice: o holocausto
  rationale: Termo português tradicional e preciso para a oferta inteiramente queimada designada por עֹלָה.
- source_word: וְהַחֲלָבִים
  choice: e as porções de gordura
  rationale: No contexto sacrificial, refere-se às partes gordurosas destinadas ao altar, não à gordura em sentido genérico.
- source_word: עַד לָיְלָה
  choice: até a noite
  rationale: Preserva a indicação temporal de que o serviço se prolongou até o período noturno.
- source_word: וְהַלְוִיִּם
  choice: Por isso, os levitas
  rationale: O waw retoma a oração principal depois da explicação causal; 'Por isso' comunica em português a consequência contextual sem alterar o sentido.
