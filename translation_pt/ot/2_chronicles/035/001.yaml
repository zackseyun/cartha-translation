  text: וַ/יַּ֨עַשׂ יֹאשִׁיָּ֧הוּ בִֽ/ירוּשָׁלִַ֛ם פֶּ֖סַח לַ/יהוָ֑ה וַ/יִּשְׁחֲט֣וּ הַ/פֶּ֔סַח בְּ/אַרְבָּעָ֥ה עָשָׂ֖ר לַ/חֹ֥דֶשׁ הָ/רִאשֽׁוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/001.yaml
  text: Josiah kept the Passover to Yahweh in Jerusalem[a], and they slaughtered the Passover on the fourteenth day of the first month.
translation:
  language: pt
  text: Josias celebrou a Páscoa para Yahweh em Jerusalém, e eles abateram o animal da Páscoa[a] no décimo quarto dia do primeiro mês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a Páscoa”; aqui, o termo designa o animal oferecido na celebração pascal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: celebrou
  rationale: Embora o verbo signifique literalmente “fez”, quando tem פֶּסַח por objeto expressa idiomaticamente a realização ou celebração da Páscoa.
- source_word: פֶּסַח
  choice: a Páscoa
  rationale: Na primeira ocorrência, o substantivo designa a celebração pascal como um todo; “a Páscoa” é a forma consagrada e natural em português.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: A preposição ל indica que a celebração era dirigida ou dedicada a Yahweh. “Para Yahweh” mantém essa relação sem transformá-la numa construção possessiva.
- source_word: בִירוּשָׁלַםִ
  choice: em Jerusalém
  rationale: Tradução locativa direta, com a forma tradicional portuguesa do nome da cidade.
- source_word: וַיִּשְׁחֲטוּ
  choice: eles abateram
  rationale: “Abateram” comunica a matança ritual de um animal com mais precisão do que o genérico “mataram”, sem substituir o ato específico pelo mais amplo “sacrificaram”.
- source_word: הַפֶּסַח
  choice: o animal da Páscoa
  rationale: Na segunda ocorrência, o substantivo designa metonimicamente a vítima pascal que foi abatida. “Animal da Páscoa” explicita o referente sem restringi-lo indevidamente a um cordeiro, pois a legislação também admitia um cabrito.
- source_word: בְּאַרְבָּעָה עָשָׂר
  choice: no décimo quarto dia
  rationale: O hebraico traz literalmente “no quatorze”; a forma ordinal com “dia” é a expressão calendárica natural em português.
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: do primeiro mês
  rationale: A expressão identifica o mês ao qual pertence o décimo quarto dia e se encaixa naturalmente na construção portuguesa da data.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome divino pessoal e segue a orientação lexical estabelecida, sem substituí-lo por um título.
- issue: Referente da segunda ocorrência de פֶּסַח
  choice: o animal da Páscoa
  alternative: a Páscoa; o cordeiro pascal; o sacrifício pascal
  rationale: O verbo “abater” mostra que aqui פֶּסַח se refere à vítima pascal. “Animal” mantém a abrangência da legislação bíblica e evita acrescentar especificamente “cordeiro” quando o versículo não identifica a espécie.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem da frase acompanha de perto o hebraico, enquanto “celebrou” e “animal da Páscoa” tornam explícitos seus usos idiomático e metonímico.
