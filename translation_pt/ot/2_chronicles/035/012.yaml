base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/012.yaml
  text: They removed the burnt offerings[a], to give them by divisions of the fathers’ houses to the sons of the people, to present to Yahweh, as it is written in the Book of Moses; and so also with the cattle.
translation:
  language: pt
  text: Separaram os holocaustos para entregá-los às divisões das casas paternas dos filhos do povo[a], para que os oferecessem a Yahweh, como está escrito no Livro de Moisés. Fizeram o mesmo com o gado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «ao povo» ou «aos membros não sacerdotais do povo». Em hebraico, «aos filhos do povo», expressão baseada na organização por clãs. «Casas paternas» designa grupos familiares definidos pela linhagem paterna e distingue a população em geral dos sacerdotes e levitas.
    reason: Alternativa lexical e esclarecimento das expressões hebraicas de organização clânica.
lexical_decisions:
- source_word: וַיָּסִירוּ
  choice: Separaram
  rationale: O hifil de סור indica fazer retirar ou pôr à parte. No contexto da preparação sacrificial, “separaram” comunica naturalmente a retirada destinada à distribuição, sem especificar além do texto o procedimento exato.
- source_word: הָעֹלָה
  choice: os holocaustos
  rationale: Embora a forma hebraica esteja no singular, עֹלָה pode ter sentido coletivo. O plural em português expressa com naturalidade as ofertas queimadas que seriam distribuídas entre os grupos do povo.
- source_word: לְתִתָּם
  choice: para entregá-los
  rationale: O infinitivo com sufixo pronominal expressa finalidade. “Entregá-los” mantém a ideia de dar e se ajusta ao contexto de distribuição.
- source_word: לְמִפְלַגּוֹת לְבֵית אָבוֹת
  choice: conforme as divisões das famílias ancestrais
  rationale: מִפְלַגּוֹת designa divisões ou agrupamentos, e בֵית אָבוֹת é uma unidade familiar ou clânica baseada na linhagem paterna. A formulação preserva o caráter administrativo da expressão sem recorrer ao pouco natural “casas dos pais”.
- source_word: לִבְנֵי הָעָם
  choice: aos filhos do povo
  rationale: A tradução preserva a expressão masculina e representativa do hebraico, enquanto a nota esclarece que ela se refere à população em geral, em contraste com sacerdotes e levitas.
- source_word: לְהַקְרִיב לַיהוָה
  choice: para que os oferecessem a Yahweh
  rationale: No contexto sacrificial, הקריב significa apresentar ou oferecer. A oração final deixa claro que os destinatários deveriam apresentar os holocaustos, e o nome divino é transliterado como “Yahweh”.
- source_word: כַּכָּתוּב בְּסֵפֶר מֹשֶׁה
  choice: como está escrito no Livro de Moisés
  rationale: A expressão mantém a fórmula de apelo à instrução mosaica escrita; “Livro” recebe inicial maiúscula como designação de uma fonte reconhecida.
- source_word: וְכֵן לַבָּקָר
  choice: Fizeram o mesmo com o gado bovino
  rationale: O hebraico é elíptico e estende aos bovinos o procedimento anterior. A explicitação mínima do verbo produz uma frase natural em português sem alterar o sentido.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama. “Yahweh” preserva o nome divino em vez de substituí-lo por um título.
- issue: Expressão masculina representativa לִבְנֵי הָעָם
  choice: filhos do povo
  alternative: povo; membros do povo; leigos
  rationale: A tradução conserva a forma representativa do hebraico e deixa à nota a explicação de sua referência à população não sacerdotal, evitando inserir no texto principal uma interpretação sociológica mais específica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Famílias ancestrais” traduz a estrutura clânica de modo mais natural que o decalque “casas paternas”. A concisão da frase hebraica final é preservada por uma explicitação verbal mínima.
