source:
  edition: WLC
  text: וַ֠/תִּכּוֹן כָּל עֲבוֹדַ֨ת יְהוָ֜ה בַּ/יּ֤וֹם הַ/הוּא֙ לַ/עֲשׂ֣וֹת הַ/פֶּ֔סַח וְ/הַעֲל֣וֹת עֹל֔וֹת עַ֖ל מִזְבַּ֣ח יְהוָ֑ה כְּ/מִצְוַ֖ת הַ/מֶּ֥לֶךְ יֹאשִׁיָּֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/016.yaml
  text: So all the service of Yahweh was prepared on that day, to keep the Passover and to offer burnt offerings on the altar of Yahweh, according to the command of King Josiah.
translation:
  language: pt
  text: Assim, naquele dia, todo o serviço de Yahweh foi posto em ordem, para celebrar a Páscoa e oferecer holocaustos sobre o altar de Yahweh, conforme a ordem do rei Josias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּכּוֹן
  choice: foi posto em ordem
  rationale: O nifal de כון expressa aqui que o serviço ritual ficou devidamente preparado e organizado. A formulação preserva o sentido passivo e resultativo do hebraico.
- source_word: כָּל עֲבוֹדַת יְהוָה
  choice: todo o serviço de Yahweh
  rationale: עֲבוֹדָה, neste contexto cultual, designa o serviço ligado à adoração no templo. “Serviço” mantém essa amplitude sem restringi-lo apenas ao trabalho sacerdotal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Equivalente temporal direto e natural, preservando a força demonstrativa do hebraico.
- source_word: לַעֲשׂוֹת הַפֶּסַח
  choice: para celebrar a Páscoa
  rationale: O idioma hebraico “fazer a Páscoa” significa observá-la ritualmente; “celebrar” comunica isso com clareza em português atual.
- source_word: וְהַעֲלוֹת עֹלוֹת
  choice: e oferecer holocaustos
  rationale: A construção causativa de עלה com עֹלוֹת é a expressão sacrificial usual para apresentar ofertas totalmente queimadas; “holocaustos” é o termo bíblico português consagrado nesse sentido.
- source_word: עַל מִזְבַּח יְהוָה
  choice: sobre o altar de Yahweh
  rationale: Reproduz a relação locativa da oferta com o altar e mantém explícito o nome divino.
- source_word: כְּמִצְוַת
  choice: conforme a ordem
  rationale: מִצְוָה refere-se aqui à determinação específica do rei; “ordem” é natural em português e evita sugerir necessariamente um mandamento da Lei.
- source_word: הַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: do rei Josias
  rationale: Segue a ordem idiomática do título e do nome em português, preservando claramente o referente.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título nem adotar outra forma tradicional de vocalização.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. A expressão “serviço de Yahweh” conserva a amplitude cultual e a possível relação de pertencimento ou dedicação presente no hebraico.
