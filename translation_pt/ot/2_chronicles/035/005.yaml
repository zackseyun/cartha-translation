  text: וְ/עִמְד֣וּ בַ/קֹּ֗דֶשׁ לִ/פְלֻגּוֹת֙ בֵּ֣ית הָֽ/אָב֔וֹת לַ/אֲחֵי/כֶ֖ם בְּנֵ֣י הָ/עָ֑ם וַ/חֲלֻקַּ֥ת בֵּֽית אָ֖ב לַ/לְוִיִּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/005.yaml
  text: And stand in the holy place according to the divisions of the fathers’ houses of your brothers[a], the sons of the people, and according to the division of a father’s house for the Levites.
translation:
  language: pt
  text: Tomem posição no lugar santo, segundo as divisões das casas paternas de seus irmãos, os filhos do povo[a], e segundo a divisão de uma casa paterna para os levitas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas não levitas”. Literalmente, “os filhos do povo”; a expressão os distingue aqui dos levitas.
    reason: Alternativa lexical e esclarecimento contextual.
lexical_decisions:
- source_word: וְעִמְדוּ
  choice: Tomem posição
  rationale: O imperativo plural de עמד ordena aos levitas que se coloquem em seus lugares designados; “tomem posição” expressa com naturalidade esse sentido organizacional.
- source_word: בַקֹּדֶשׁ
  choice: no lugar santo
  rationale: A preposição local e o artigo apontam para a área sagrada. “Lugar santo” conserva o sentido concreto sem identificar de modo excessivamente específico uma parte do santuário.
- source_word: לִפְלֻגּוֹת
  choice: segundo as divisões
  rationale: O substantivo indica divisões ou agrupamentos, e o ל exprime aqui conformidade com essa organização.
- source_word: בֵּית הָאָבוֹת
  choice: casas paternas
  rationale: Expressão genealógica que designa unidades familiares organizadas pela linhagem paterna; a formulação mantém a imagem e a estrutura social do hebraico.
- source_word: לַאֲחֵיכֶם
  choice: de seus irmãos
  rationale: Mantém a linguagem de parentesco usada para os demais israelitas e liga essas divisões familiares aos compatriotas dos levitas.
- source_word: בְּנֵי הָעָם
  choice: os filhos do povo
  rationale: Reprodução direta da expressão hebraica, que neste contexto distingue os israelitas não levitas dos levitas; a nota esclarece o valor contextual sem apagar a forma original.
- source_word: וַחֲלֻקַּת בֵּית אָב לַלְוִיִּם
  choice: e segundo a divisão de cada casa paterna dos levitas
  rationale: A formulação portuguesa torna explícito o provável valor distributivo do singular “casa paterna” e preserva o paralelismo organizacional com as divisões mencionadas antes.
theological_decisions:
- issue: Linguagem masculina de parentesco e distinção social dentro de Israel
  choice: Manter “irmãos” e “filhos do povo” no texto principal
  alternative: “seus compatriotas israelitas” e “os leigos”
  rationale: Os termos masculinos pertencem à estrutura familiar e tribal expressa pelo hebraico. Mantê-los conserva essa linguagem e evita substituir a distinção contextual entre levitas e não levitas por uma categoria eclesiástica posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Casas paternas” preserva o termo institucional antigo, enquanto “tomem posição” evita uma formulação excessivamente rígida. O singular hebraico em “casa paterna” foi expresso distributivamente por “cada casa paterna” para produzir português natural sem perder a organização correspondente dos grupos.
