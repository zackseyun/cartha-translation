base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/023.yaml
  text: And the archers shot King Josiah[a], and the king said to his servants, “Take me away, for I am severely wounded.”
translation:
  language: pt
  text: 'E os arqueiros atiraram contra o rei Josias, e o rei disse aos seus servos: “Tirem-me daqui, pois estou gravemente ferido[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estou muito debilitado”. O verbo hebraico pode significar estar fraco, doente ou gravemente ferido; neste contexto de batalha, “ferido” é o sentido mais provável.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרוּ הַיֹּרִים
  choice: os arqueiros atingiram
  rationale: O verbo ירה no hifil descreve o ato de disparar, e o particípio הַיֹּרִים designa, neste contexto militar, os arqueiros. “Atingiram” comunica que Josias foi alvejado, sem a ambiguidade que “atiraram no rei” pode ter em português.
- source_word: לַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: o rei Josias
  rationale: A preposição ל marca aqui o alvo dos disparos. Em português, a construção é expressa naturalmente como objeto direto de “atingiram”.
- source_word: הַעֲבִירוּנִי
  choice: Tirem-me daqui
  rationale: A forma causativa de עבר pede que os servos façam Josias sair daquele lugar. “Tirem-me daqui” é natural no contexto de retirada do campo de batalha e não especifica indevidamente se ele foi carregado.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da ordem em registro direto, claro e digno.
- source_word: הָחֳלֵיתִי מְאֹד
  choice: estou gravemente ferido
  rationale: חלה pode indicar estar doente, fraco ou debilitado; após Josias ser atingido em combate, “ferido” expressa o sentido contextual, e מְאֹד é representado por “gravemente”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A repetição de “o rei” foi preservada por corresponder à progressão do hebraico.
