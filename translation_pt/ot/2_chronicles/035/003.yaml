  text: וַ/יֹּ֣אמֶר לַ֠/לְוִיִּם ה/מבונים לְ/כָל יִשְׂרָאֵ֜ל הַ/קְּדוֹשִׁ֣ים לַ/יהוָ֗ה תְּנ֤וּ אֶת אֲרוֹן הַ/קֹּ֨דֶשׁ֙ בַּ֠/בַּיִת אֲשֶׁ֨ר בָּנָ֜ה שְׁלֹמֹ֤ה בֶן דָּוִיד֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל אֵין לָ/כֶ֥ם מַשָּׂ֖א בַּ/כָּתֵ֑ף עַתָּ֗ה עִבְדוּ֙ אֶת יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/אֵ֖ת עַמּ֥/וֹ יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/003.yaml
  text: And he said to the Levites who taught all Israel[a], who were holy to Yahweh, “Put the holy ark in the house that Solomon son of David, king of Israel, built. You no longer have to carry it on your shoulders[c][b]. Now serve Yahweh your God and his people Israel.”
translation:
  language: pt
  text: 'Ele disse aos levitas que instruíam todo o Israel[a] e eram consagrados a Yahweh: “Ponham a arca santa na casa[b] que Salomão, filho de Davi e rei de Israel, construiu. Vocês já não precisam carregá-la sobre os ombros[c]. Agora sirvam a Yahweh, seu Deus, e ao seu povo Israel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os levitas que davam entendimento a todo o Israel”, “os levitas que tinham entendimento” ou “os levitas instruídos para todo o Israel”. O particípio hebraico pode referir-se tanto a ter ou receber entendimento quanto a transmiti-lo.
    reason: lexical_alternative
  - marker: b
    text: Isto é, o templo construído por Salomão. O hebraico diz literalmente “casa”.
    reason: cultural_note
  - marker: c
    text: Literalmente, “não há para vocês carga no ombro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְבִינִים
  choice: que instruíam
  rationale: O particípio de בין nessa forma pode indicar os que fazem outros compreender, isto é, os que instruem. No contexto das funções levíticas em Crônicas, “que instruíam” comunica naturalmente o sentido funcional provável, sem ocultar a ambiguidade lexical, registrada em nota.
- source_word: הַקְּדוֹשִׁים לַיהוָה
  choice: eram santos para Yahweh
  rationale: A formulação conserva a linguagem de santidade e a relação expressa por ל, indicando que os levitas estavam separados para Yahweh. “Consagrados a Yahweh” seria mais idiomático, mas também mais interpretativo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: תְּנוּ אֶת־אֲרוֹן הַקֹּדֶשׁ בַּבַּיִת
  choice: Ponham a arca santa na casa
  rationale: נתן com objeto e indicação de lugar tem aqui o sentido de pôr ou colocar. “Casa” preserva בית; o contexto e a nota esclarecem que se trata do templo de Salomão.
- source_word: אֲרוֹן הַקֹּדֶשׁ
  choice: a arca santa
  rationale: Tradução direta e idiomática que mantém a caracterização da arca pela santidade.
- source_word: אֵין לָכֶם מַשָּׂא בַּכָּתֵף
  choice: Vocês já não precisam carregá-la sobre os ombros
  rationale: Expressa em português corrente a força contextual da construção literal, “não há para vocês carga no ombro”, preservando a imagem do transporte aos ombros.
- source_word: עַתָּה עִבְדוּ
  choice: Agora sirvam
  rationale: עבד pode envolver serviço, ministério ou culto. “Sirvam” mantém a amplitude do verbo e se ajusta tanto a Yahweh quanto ao povo como objetos do serviço.
- source_word: וְאֶת־עַמּוֹ יִשְׂרָאֵל
  choice: e ao seu povo Israel
  rationale: Mantém Israel identificado como o povo de Yahweh e produz uma coordenação natural em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico apresenta o nome próprio divino. “Yahweh” o preserva como nome, sem substituí-lo por um título.
- issue: Função dos levitas em הַמְבִינִים
  choice: os levitas que instruíam todo o Israel
  alternative: os levitas que tinham entendimento; os levitas instruídos para todo o Israel
  rationale: A forma admite relação tanto com possuir entendimento quanto com levar outros a compreender. O papel instrutivo dos levitas no contexto de Crônicas favorece “instruíam”, enquanto a nota conserva as demais possibilidades.
- issue: Sentido de santidade em הַקְּדוֹשִׁים לַיהוָה
  choice: santos para Yahweh
  alternative: consagrados a Yahweh
  rationale: A escolha preserva a terminologia explícita de santidade e não reduz o termo apenas ao ato ou estado de consagração.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para o plural e mantém “Yahweh” como nome divino. A sintaxe foi levemente alisada, mas as imagens concretas, a linguagem de santidade e as ambiguidades relevantes do hebraico foram preservadas no texto ou nas notas.
