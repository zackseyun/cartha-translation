base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/019.yaml
  text: In the eighteenth year of Josiah’s reign[a], this Passover was kept.
translation:
  language: pt
  text: No décimo oitavo ano do reinado de Josias, celebrou-se esta Páscoa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “observou-se esta Páscoa”; mais literalmente, “esta Páscoa foi feita”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁמוֹנֶה עֶשְׂרֵה שָׁנָה
  choice: No décimo oitavo ano
  rationale: A preposição בְּ com a expressão numérica e שָׁנָה forma uma indicação temporal. A formulação ordinal é a maneira natural de expressar essa data em português.
- source_word: לְמַלְכוּת יֹאשִׁיָּהוּ
  choice: do reinado de Josias
  rationale: מַלְכוּת designa aqui o período do governo real, e a construção com לְ integra a fórmula de datação pelo reinado. “Do reinado de Josias” é clara e idiomática.
- source_word: נַעֲשָׂה
  choice: celebrou-se
  rationale: Embora עשה tenha o sentido básico de “fazer”, quando seu objeto é a Páscoa refere-se idiomaticamente à realização ou observância dela. “Celebrou-se” comunica esse sentido com naturalidade em português, sem acrescentar “festa” ao texto.
- source_word: הַפֶּסַח
  choice: Páscoa
  rationale: É o equivalente português consagrado de פֶּסַח e pode designar a celebração pascal neste contexto.
- source_word: הַזֶּה
  choice: esta
  rationale: O demonstrativo retoma a Páscoa específica descrita no contexto anterior; “esta” preserva diretamente essa ligação discursiva.
