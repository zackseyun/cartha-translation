base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/004.yaml
  text: Prepare yourselves by your fathers’ houses according to your divisions[b][a], as prescribed in the writing of David king of Israel and in the writing of Solomon his son.
translation:
  language: pt
  text: Preparem-se por suas casas paternas[a], segundo suas divisões[b], conforme prescrito no escrito de Davi, rei de Israel, e no escrito de Salomão, seu filho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “segundo suas casas paternas”. A expressão hebraica se refere aos agrupamentos familiares ancestrais ou paternos em Israel.'
    reason: lexical_alternative
  - marker: b
    text: “Divisões” também pode ser traduzido por “turnos”, especialmente no contexto da organização sacerdotal ou levítica.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָכִינוּ
  choice: Organizem-se
  rationale: O hifil imperativo plural de כון pede preparação e disposição ativa; no contexto da organização levítica, “Organizem-se” comunica de modo natural tanto o preparo quanto a ordenação em grupos.
- source_word: לְבֵית אֲבוֹתֵיכֶם
  choice: por suas casas paternas
  rationale: בֵית אָבוֹת designa unidades familiares ancestrais ou paternas. “Casas paternas” preserva a estrutura social histórica, e “por” expressa a distribuição segundo essas unidades.
- source_word: כְּמַחְלְקוֹתֵיכֶם
  choice: segundo suas divisões
  rationale: מַחְלְקוֹת refere-se a divisões ou grupos designados, em especial na organização sacerdotal e levítica. “Divisões” é claro e mantém o sentido institucional.
- source_word: בִּכְתָב
  choice: conforme prescrito no escrito de
  rationale: כְּתָב significa “escrito” ou “documento”; aqui, ב indica conformidade com uma instrução escrita autorizada. A formulação explicita essa função sem substituir o documento por uma interpretação específica.
- source_word: דָּוִיד מֶלֶךְ יִשְׂרָאֵל
  choice: Davi, rei de Israel
  rationale: Tradução direta do nome e do título real, com pontuação natural em português.
- source_word: וּבְמִכְתַּב
  choice: e no escrito de
  rationale: מִכְתָּב também designa um escrito ou documento. A forma mais breve na segunda ocorrência evita repetição pesada, mantendo a dependência de “conforme prescrito”.
- source_word: שְׁלֹמֹה בְנוֹ
  choice: Salomão, seu filho
  rationale: Preserva a aposição filial e deixa claro, pelo contexto imediato, que Salomão é filho de Davi.
