  naturalness: O texto é claro, fluente e de registro adequado. «Conforme o prescrito», «caldeirões» e «cozeram» são naturais em registro bíblico moderno e compreensíveis para leitores brasileiros. A divisão em duas frases preserva o sentido.
  terminology: «Ofertas sagradas» representa bem הַקֳּדָשִׁים. «Sacrifício pascal» é preferível a «cordeiro da Páscoa» por manter a referência cultual e não impor a espécie do animal. A nota deve igualmente evitar falar de «cordeiro» ou de «o animal» como se a espécie estivesse definida.
