base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/013.yaml
  text: They cooked the Passover lamb in the fire according to the rule[a], and they boiled the holy offerings in pots, kettles, and bowls, and quickly brought them to all the people.
translation:
  language: pt
  text: Prepararam o sacrifício pascal ao fogo, conforme o prescrito[a]. Cozeram as ofertas sagradas em panelas, caldeirões e tigelas e as levaram rapidamente a todo o povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais especificamente, “assaram o sacrifício pascal ao fogo”. O verbo hebraico pode significar “cozinhar” em sentido amplo, mas a lei da Páscoa exigia que a vítima pascal fosse assada, e não cozida em água (ver Êxodo 12:8–9).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבַשְּׁלוּ
  choice: Cozinharam
  rationale: O verbo בשׁל pode designar o ato de cozinhar em sentido amplo. A expressão seguinte, “no fogo, conforme o prescrito”, esclarece que aqui se trata da forma de preparo exigida para a Páscoa, sem impor ao verbo um sentido lexical excessivamente estreito.
- source_word: הַפֶּסַח
  choice: o cordeiro da Páscoa
  rationale: Neste contexto culinário e sacrificial, “a Páscoa” designa concretamente o animal pascal. A explicitação torna o referente claro em português corrente.
- source_word: בָּאֵשׁ
  choice: no fogo
  rationale: Tradução direta e natural que preserva o modo de preparo sem acrescentar detalhes não expressos.
- source_word: כַּמִּשְׁפָּט
  choice: conforme o prescrito
  rationale: Neste contexto, מִשְׁפָּט indica o procedimento estabelecido pela norma. “Conforme o prescrito” comunica de modo atual e digno esse sentido normativo.
- source_word: וְהַקֳּדָשִׁים
  choice: as ofertas sagradas
  rationale: O plural refere-se a outras porções sacrificiais consagradas, contrastadas sintaticamente com o cordeiro pascal.
- source_word: בִּשְּׁלוּ
  choice: Cozeram
  rationale: Com os recipientes mencionados em seguida, o verbo indica preparo por cocção, em contraste contextual com o preparo do cordeiro no fogo.
- source_word: בַּסִּירוֹת
  choice: em panelas
  rationale: Equivalente comum e natural para o recipiente de cozinha.
- source_word: וּבַדְּוָדִים
  choice: caldeirões
  rationale: Designa recipientes maiores de cocção; “caldeirões” distingue adequadamente o termo das panelas.
- source_word: וּבַצֵּלָחוֹת
  choice: tigelas
  rationale: Equivalente claro para um recipiente usado no preparo ou serviço, embora a forma exata do utensílio não seja certa.
- source_word: וַיָּרִיצוּ
  choice: as levaram rapidamente
  rationale: A formulação expressa tanto o movimento quanto a pressa comunicada pelo verbo hebraico.
- source_word: לְכָל בְּנֵי הָעָם
  choice: a todo o povo
  rationale: A expressão hebraica, literalmente “a todos os filhos do povo”, é idiomática e se refere ao povo em geral.
theological_decisions:
- issue: Possível tensão entre בשׁל e a lei pascal que exigia assar no fogo
  choice: Traduzir o primeiro verbo de maneira ampla como “cozinharam” e deixar “no fogo, conforme o prescrito” indicar o método legal.
  alternative: Traduzir explicitamente como “assaram” ou empregar “cozeram/ferveram” nas duas ocorrências.
  rationale: O próprio versículo distingue o preparo da Páscoa no fogo das demais ofertas preparadas em recipientes. A tradução conserva essa distinção sem restringir indevidamente o valor lexical do primeiro verbo.
- issue: Referente de “as ofertas sagradas”
  choice: Entender a expressão como outras porções sacrificiais, distintas do animal pascal.
  alternative: Entendê-la como referência geral a todos os alimentos sagrados, inclusive a Páscoa.
  rationale: A construção contrapõe “o cordeiro da Páscoa” às “ofertas sagradas”, e os diferentes métodos de preparo reforçam essa distinção.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Conforme o prescrito” mantém o teor normativo sem soar excessivamente jurídico; “cozeram” preserva a distinção culinária contextual, e os períodos foram separados para melhorar a fluidez.
