  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/לֹֽא הֵסֵב֩ יֹאשִׁיָּ֨הוּ פָנָ֜י/ו מִמֶּ֗/נּוּ כִּ֤י לְ/הִלָּחֵֽם בּ/וֹ֙ הִתְחַפֵּ֔שׂ וְ/לֹ֥א שָׁמַ֛ע אֶל דִּבְרֵ֥י נְכ֖וֹ מִ/פִּ֣י אֱלֹהִ֑ים וַ/יָּבֹ֕א לְ/הִלָּחֵ֖ם בְּ/בִקְעַ֥ת מְגִדּֽוֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/022.yaml
  text: But Josiah did not turn his face away from him[a]; rather, he disguised himself to fight against him. He did not listen to the words of Neco from the mouth of God[c][b], and he came to fight in the Valley of Megiddo.
translation:
  language: pt
  text: Mas Josias não desviou dele o rosto[a]; pelo contrário, disfarçou-se para lutar contra ele. Não deu ouvidos às palavras de Neco, que vinham da boca de Deus[b], e foi lutar no vale de Megido[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não se afastou dele”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “da boca de Deus”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “na planície de Megido”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסֵב ... פָנָיו מִמֶּנּוּ
  choice: não desviou dele o rosto
  rationale: Preserva a imagem hebraica de voltar ou desviar o rosto, mantendo em português um sentido claro de não recuar diante de Neco.
- source_word: כִּי
  choice: pelo contrário
  rationale: Neste contexto, introduz o que Josias fez em contraste com desviar-se de Neco, e não uma causa estrita.
- source_word: לְהִלָּחֵם בּוֹ
  choice: para lutar contra ele
  rationale: O infinitivo expressa propósito, e a preposição indica oposição no contexto militar.
- source_word: הִתְחַפֵּשׂ
  choice: disfarçou-se
  rationale: Representa diretamente o verbo reflexivo hebraico e soa natural em português.
- source_word: שָׁמַע אֶל
  choice: deu ouvidos a
  rationale: A expressão portuguesa comunica tanto escutar quanto atender, sem explicitar além do texto a ideia de obediência.
- source_word: דִּבְרֵי נְכוֹ
  choice: as palavras de Neco
  rationale: Mantém de perto o substantivo hebraico sem interpretá-lo como uma mensagem formal.
- source_word: מִפִּי אֱלֹהִים
  choice: que vinham da boca de Deus
  rationale: Conserva a imagem hebraica e deixa claro, sem alterar a atribuição, que a origem divina se refere às palavras de Neco.
- source_word: וַיָּבֹא
  choice: foi
  rationale: Embora בוא tenha o sentido básico de vir/entrar, no fluxo narrativo português 'foi lutar' expressa naturalmente o movimento de Josias para o campo de batalha.
- source_word: בְּבִקְעַת מְגִדּוֹ
  choice: no vale de Megido
  rationale: בִּקְעָה designa uma depressão ampla ou planície entre elevações; 'vale' é claro e geograficamente apropriado, enquanto 'planície' permanece possível.
theological_decisions:
- issue: Se as palavras de Neco são apresentadas como realmente procedentes de Deus
  choice: A tradução afirma que as palavras de Neco vinham 'da boca de Deus'.
  alternative: Parafrasear como 'da parte de Deus' ou tratar a origem divina apenas como alegação de Neco.
  rationale: O narrador apresenta diretamente as palavras como provenientes de Deus. A tradução preserva essa afirmação e a tensão teológica do texto, sem reduzi-la a uma alegação nem explicar o modo da revelação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção 'não desviou dele o rosto' preserva a imagem do hebraico; 'deu ouvidos' é corrente e solene sem ser arcaizante. Os marcadores de notas aparecem em ordem [a], [b], [c] e junto aos termos correspondentes.
