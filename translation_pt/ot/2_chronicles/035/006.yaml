base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/006.yaml
  text: Slaughter the Passover lamb[a], consecrate yourselves, and prepare for your brothers[b], to do according to the word of Yahweh by the hand of Moses.
translation:
  language: pt
  text: Abatam o sacrifício pascal[a], consagrem-se e preparem para seus irmãos, para que façam conforme a palavra de Yahweh, pela mão de Moisés.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “a Páscoa”. Aqui, o termo designa o animal oferecido como sacrifício pascal.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “por meio de Moisés”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁחֲטוּ
  choice: Abatam
  rationale: שׁחט designa o abate de um animal, especialmente em contexto sacrificial. “Abatam” conserva essa força ritual melhor que o genérico “matem”.
- source_word: הַפָּסַח
  choice: o sacrifício da Páscoa
  rationale: O termo significa literalmente “a Páscoa”, mas aqui designa concretamente o animal pascal a ser abatido. “Sacrifício da Páscoa” evita restringir indevidamente o animal a um cordeiro, pois a legislação também permitia um cabrito.
- source_word: וְהִתְקַדְּשׁוּ
  choice: consagrem-se
  rationale: O hitpael de קדשׁ é reflexivo e, neste contexto, indica preparação ritual para o serviço sagrado.
- source_word: וְהָכִינוּ
  choice: preparem tudo
  rationale: O hiphil de כון significa preparar ou deixar pronto. O hebraico omite o objeto; “tudo” comunica naturalmente em português os preparativos implícitos sem especificá-los além do texto.
- source_word: לַאֲחֵיכֶם
  choice: para os seus irmãos
  rationale: Mantém o substantivo masculino plural do hebraico e, no contexto, refere-se aos demais israelitas a quem os levitas serviriam.
- source_word: לַעֲשׂוֹת
  choice: a fim de agirem
  rationale: O infinitivo de עשה liga os preparativos ao cumprimento da instrução divina. “Agirem” é natural com “conforme” e não acrescenta um objeto ausente no hebraico.
- source_word: כִּדְבַר יְהוָה
  choice: conforme a palavra de Yahweh
  rationale: דבר pode indicar palavra, ordem ou instrução. “Palavra” preserva a expressão hebraica e sua autoridade sem reduzi-la explicitamente a “mandamento”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּיַד מֹשֶׁה
  choice: dada pela mão de Moisés
  rationale: Preserva a imagem idiomática hebraica da mediação por meio da “mão” de Moisés. “Dada” explicita apenas a relação natural com “a palavra” em português.
theological_decisions:
- issue: Linguagem familiar masculina em לַאֲחֵיכֶם
  choice: para os seus irmãos
  alternative: para os seus compatriotas israelitas
  rationale: O texto usa o masculino plural “irmãos”. Embora o referente coletivo possa ser mais amplo, a tradução mantém a forma do hebraico sem inserir linguagem inclusiva não expressa.
- issue: Referente de לַעֲשׂוֹת
  choice: a fim de agirem
  alternative: para que eles ajam
  rationale: 'A construção hebraica permite alguma tensão quanto a quem executará o que foi prescrito: os levitas interpelados ou os irmãos para quem preparam. A redação mantém a ligação mais direta com os destinatários da ordem sem acrescentar o pronome “eles”, que resolveria a questão em favor da outra leitura.'
- issue: Nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O original apresenta diretamente o Tetragrama; a tradução conserva o nome próprio, em vez da substituição tradicional por um título.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe adequada à leitura pública. “Sacrifício da Páscoa” é mais preciso que “cordeiro da Páscoa” neste contexto, e a expressão idiomática “pela mão de Moisés” foi mantida no texto com esclarecimento em nota.
