  naturalness: A revisão conserva um português moderno e apropriado à leitura pública. «Preparem para seus irmãos, para que façam...» mantém o objeto de «preparem» implícito, como no hebraico, e torna inteligível em português a relação entre os preparativos e os irmãos.
  terminology: «Sacrifício pascal» transmite adequadamente הַפָּסַח sem restringir o animal a cordeiro. «Consagrem-se», «palavra de Yahweh» e «pela mão de Moisés» preservam o registro e os termos centrais; a nota explica a alternativa idiomática para a última expressão.
