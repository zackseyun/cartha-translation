revisions:
- from: Abatam o sacrifício da Páscoa[a], consagrem-se e preparem tudo para os seus irmãos, a fim de agirem conforme a palavra de Yahweh, dada pela mão de Moisés.[b]
  to: Abatam o sacrifício pascal[a], consagrem-se e preparem para seus irmãos, para que façam conforme a palavra de Yahweh, pela mão de Moisés.[b]
  rationale: 'A revisão elimina as expansões «tudo» e «dada», preserva o objeto implícito de «preparem» e explicita somente a relação sintática necessária em português: os preparativos são feitos para que os irmãos cumpram a palavra de Yahweh. Mantêm-se «sacrifício pascal» e a expressão literal «pela mão de Moisés», com alternativa idiomática em nota.'
