translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. «Carro de guerra» esclarece o veículo antigo; «segundo carro» e a nota preservam a incerteza lexical do hebraico. A repetição inicial de ações coordenadas acompanha o ritmo narrativo sem produzir uma frase excessivamente pesada.
