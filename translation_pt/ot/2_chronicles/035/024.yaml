  text: וַ/יַּֽעֲבִירֻ֨/הוּ עֲבָדָ֜י/ו מִן הַ/מֶּרְכָּבָ֗ה וַֽ/יַּרְכִּיבֻ/הוּ֮ עַ֣ל רֶ֣כֶב הַ/מִּשְׁנֶה֮ אֲשֶׁר ל/וֹ֒ וַ/יּוֹלִיכֻ֨/הוּ֙ יְר֣וּשָׁלִַ֔ם וַ/יָּ֕מָת וַ/יִּקָּבֵ֖ר בְּ/קִבְר֣וֹת אֲבֹתָ֑י/ו וְ/כָל יְהוּדָה֙ וִ/יר֣וּשָׁלִַ֔ם מִֽתְאַבְּלִ֖ים עַל יֹאשִׁיָּֽהוּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/024.yaml
  text: So his servants removed him from the chariot and set him on the second chariot that belonged to him[a], and brought him to Jerusalem. And he died and was buried in the tombs of his fathers, and all Judah and Jerusalem mourned for Josiah.
translation:
  language: pt
  text: Então seus servos o tiraram do carro de guerra, colocaram-no no segundo carro que lhe pertencia[a] e o levaram a Jerusalém. Ele morreu e foi sepultado nos túmulos de seus antepassados. Todo o Judá e Jerusalém prantearam Josias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “a carruagem do segundo”; o sentido exato de “segundo” é incerto, mas provavelmente se refere ao carro secundário ou de reserva de Josias.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבִירֻהוּ
  choice: o tiraram
  rationale: O hifil de עבר indica a transferência de Josias de um veículo para outro; «tiraram» expressa naturalmente sua retirada do carro de guerra.
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: עבד pode designar servos, assistentes ou oficiais; «servos» mantém o sentido amplo sem definir indevidamente a função deles.
- source_word: הַמֶּרְכָּבָה
  choice: o carro de guerra
  rationale: מרכבה designa aqui o carro usado por Josias no combate; «carro de guerra» evita a ambiguidade moderna de «carro» como automóvel.
- source_word: וַיַּרְכִּיבֻהוּ
  choice: colocaram-no
  rationale: O hifil de רכב significa fazer montar ou pôr sobre um veículo; como Josias estava ferido, «colocaram-no» é natural e adequado ao contexto.
- source_word: רֶכֶב הַמִּשְׁנֶה
  choice: no segundo carro
  rationale: A expressão é literalmente «o carro do segundo [tipo/nível]» e provavelmente indica um carro secundário ou de reserva; a tradução conserva a formulação hebraica sem eliminar a ambiguidade.
- source_word: אֲשֶׁר לוֹ
  choice: que lhe pertencia
  rationale: A construção com ל identifica o carro como pertencente a Josias.
- source_word: וַיּוֹלִיכֻהוּ
  choice: o levaram
  rationale: O hifil de הלך expressa conduzir ou levar alguém; «levaram» é idiomático porque Josias estava sendo transportado até Jerusalém.
- source_word: וַיָּמָת
  choice: Ele morreu
  rationale: Tradução direta da forma narrativa de מות.
- source_word: וַיִּקָּבֵר
  choice: foi sepultado
  rationale: A forma nifal de קבר tem sentido passivo; «foi sepultado» é digna e natural no registro bíblico atual.
- source_word: בְּקִבְרוֹת אֲבֹתָיו
  choice: nos túmulos de seus antepassados
  rationale: אבֹתָיו refere-se aos antepassados na linhagem dinástica; «antepassados» comunica esse sentido mais claramente que o literal «pais».
- source_word: וְכָל יְהוּדָה וִירוּשָׁלַם
  choice: Todo o Judá e Jerusalém
  rationale: A expressão personifica o reino e a capital como comunidades enlutadas; a tradução preserva essa formulação.
- source_word: מִתְאַבְּלִים
  choice: prantearam
  rationale: O particípio descreve a comunidade em luto; no fluxo narrativo português, «prantearam» transmite de modo natural o lamento por Josias.
- source_word: עַל יֹאשִׁיָּהוּ
  choice: Josias
  rationale: Com o verbo de luto, עַל introduz a pessoa por quem se pranteia; em português, o objeto direto é idiomático.
