base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/009.yaml
  text: Conaniah[a], and Shemaiah and Nethanel his brothers, and Hashabiah and Jeiel and Jozabad, the chiefs of the Levites, contributed to the Levites for the Passover offerings five thousand and five hundred head of cattle.
translation:
  language: pt
  text: Conanias e seus irmãos Semaías e Natanael, juntamente com Hasabias, Jeiel e Jozabade, chefes dos levitas, contribuíram para os levitas, para as ofertas da Páscoa[a], com cinco mil animais e quinhentas cabeças de gado bovino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para os sacrifícios da Páscoa”; mais literalmente, “para as Páscoas”. O plural hebraico provavelmente se refere aos animais destinados à celebração da Páscoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כונניהו
  choice: Conanias
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico, sem traduzir seu significado.
- source_word: שְׁמַעְיָהוּ
  choice: Semaías
  rationale: Transliteração portuguesa corrente do nome pessoal hebraico.
- source_word: נְתַנְאֵל
  choice: Natanael
  rationale: Forma portuguesa familiar do nome hebraico, preservando sua identidade como nome próprio.
- source_word: אֶחָיו
  choice: seus irmãos
  rationale: Mantém o sentido familiar e a forma masculina do hebraico; o pronome conserva a referência contextual a Conanias.
- source_word: חֲשַׁבְיָהוּ
  choice: Hasabias
  rationale: Forma portuguesa convencional do nome pessoal.
- source_word: יעיאל
  choice: Jeiel
  rationale: Transliteração portuguesa corrente do nome pessoal hebraico.
- source_word: יוֹזָבָד
  choice: Jozabade
  rationale: Forma portuguesa tradicional do nome pessoal hebraico.
- source_word: שָׂרֵי הַלְוִיִּם
  choice: chefes dos levitas
  rationale: Expressa a função oficial de liderança indicada por שָׂרִים, sem o tom monárquico que 'príncipes' poderia sugerir.
- source_word: הֵרִימוּ
  choice: contribuíram
  rationale: O hifil de רום, neste contexto administrativo e sacrificial, indica entregar uma contribuição, não simplesmente levantar algo.
- source_word: לַלְוִיִּם
  choice: para os levitas
  rationale: Apresenta os levitas como beneficiários da contribuição, conforme a preposição hebraica.
- source_word: לַפְּסָחִים
  choice: para as ofertas da Páscoa
  rationale: O plural hebraico designa aqui os animais ou sacrifícios destinados à celebração da Páscoa; 'ofertas' comunica o sentido cultual sem restringi-los indevidamente a cordeiros.
- source_word: וּבָקָר חֲמֵשׁ מֵאוֹת
  choice: e quinhentas cabeças de gado bovino
  rationale: בָּקָר designa gado bovino; 'cabeças de gado' é a maneira natural de contar esses animais em português.
theological_decisions: []
translation_notes:
  register: Português atual, digno e de leitura ampla, com nomes em formas bíblicas portuguesas reconhecíveis. A repetição de “para” foi mantida para refletir os dois complementos hebraicos, enquanto “bem como” organiza naturalmente a longa lista de nomes. “Cinco mil animais” evita acrescentar uma espécie que não está expressa neste versículo; o grupo seguinte é especificado como gado bovino.
