  text: וְ/הַ/מְשֹֽׁרֲרִ֨ים בְּנֵי אָסָ֜ף עַל מַעֲמָדָ֗/ם כְּ/מִצְוַ֤ת דָּוִיד֙ וְ/אָסָ֞ף וְ/הֵימָ֤ן וִֽ/ידֻתוּן֙ חוֹזֵ֣ה הַ/מֶּ֔לֶךְ וְ/הַ/שֹּׁעֲרִ֖ים לְ/שַׁ֣עַר וָ/שָׁ֑עַר אֵ֣ין לָ/הֶ֗ם לָ/סוּר֙ מֵ/עַ֣ל עֲבֹֽדָתָ֔/ם כִּֽי אֲחֵי/הֶ֥ם הַ/לְוִיִּ֖ם הֵכִ֥ינוּ לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/015.yaml
  text: And the singers[a], the sons of Asaph, were at their stations according to the command of David, Asaph, Heman, and Jeduthun the king’s seer; and the gatekeepers were at each gate. They had no need to depart from their service[b], because their brothers the Levites prepared for them.
translation:
  language: pt
  text: Os cantores, filhos de Asafe, estavam em seus postos, conforme a ordem de Davi, de Asafe, de Hemã e de Jedutum, vidente do rei[a]; e os porteiros estavam em cada porta. Eles não precisavam afastar-se do seu serviço[b], porque seus irmãos, os levitas, prepararam para eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “vidente do rei” refere-se mais naturalmente a Jedutum.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Não deviam afastar-se do seu serviço”. O hebraico pode ser entendido de modo mais forte, embora a oração seguinte favoreça o sentido de que não precisavam sair, pois os levitas prepararam para eles.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמְשֹׁרֲרִים
  choice: os cantores
  rationale: O particípio de שׁיר designa os que cantavam no serviço do templo. “Cantores” é preciso e evita ampliar o sentido para músicos em geral.
- source_word: בְּנֵי אָסָף
  choice: filhos de Asafe
  rationale: Mantém a expressão hebraica tradicional, que neste contexto pode designar a linhagem ou corporação ligada a Asafe.
- source_word: עַל מַעֲמָדָם
  choice: estavam em seus postos
  rationale: מַעֲמָד indica o lugar ou posto designado; a formulação comunica naturalmente a organização do serviço litúrgico.
- source_word: כְּמִצְוַת
  choice: conforme a ordem de
  rationale: Expressa uma determinação autorizada, com linguagem corrente e digna.
- source_word: חוֹזֵה הַמֶּלֶךְ
  choice: vidente do rei
  rationale: “Vidente” conserva o sentido técnico de חֹזֶה e sua distinção lexical em relação ao termo mais geral “profeta”.
- source_word: הַשֹּׁעֲרִים
  choice: os porteiros
  rationale: No contexto do templo, refere-se aos encarregados das portas; “porteiros” é a designação portuguesa tradicional e natural.
- source_word: לְשַׁעַר וָשָׁעַר
  choice: em cada porta
  rationale: Reproduz com clareza o valor distributivo da expressão hebraica.
- source_word: אֵין לָהֶם לָסוּר
  choice: Eles não precisavam se afastar
  rationale: A construção אֵין + לְ com infinitivo, à luz da oração causal seguinte, favorece a ideia de ausência de necessidade, sem excluir em nota a leitura mais forte.
- source_word: מֵעַל עֲבֹדָתָם
  choice: do seu serviço
  rationale: עֲבֹדָה designa aqui o serviço ou função no templo, e não apenas trabalho em sentido genérico.
- source_word: אֲחֵיהֶם הַלְוִיִּם
  choice: seus irmãos, os levitas
  rationale: Preserva tanto o termo explícito “irmãos” quanto a aposição “os levitas”.
- source_word: הֵכִינוּ לָהֶם
  choice: preparavam para eles
  rationale: Mantém sem explicitação indevida o objeto não expresso do verbo הכין, embora o contexto indique que os levitas providenciavam o necessário.
theological_decisions:
- issue: Ligação sintática de “vidente do rei”
  choice: 'A expressão qualifica Jedutum: “Jedutum, vidente do rei”.'
  alternative: A expressão poderia ser entendida de maneira mais ampla em relação à lista precedente.
  rationale: A expressão singular חוֹזֵה הַמֶּלֶךְ liga-se mais naturalmente ao nome próprio singular imediatamente anterior, Jedutum, em consonância com construções semelhantes em Crônicas.
- issue: Força de אֵין לָהֶם לָסוּר
  choice: 'A oração expressa falta de necessidade: “não precisavam se afastar”.'
  alternative: “Não deviam se afastar do seu serviço.”
  rationale: 'A oração causal seguinte explica por que não precisavam sair: os levitas preparavam para eles. Isso favorece uma afirmação descritiva, embora o hebraico admita uma formulação mais forte.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Foram preservados termos históricos reconhecíveis, como “filhos de Asafe”, “vidente” e “porteiros”, bem como a ambiguidade legítima da oração sobre afastar-se do serviço.
