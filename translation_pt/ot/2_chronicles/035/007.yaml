  text: וַ/יָּ֣רֶם יֹאשִׁיָּ֣הוּ לִ/בְנֵ֪י הָ/עָ֟ם צֹ֞אן כְּבָשִׂ֣ים וּ/בְנֵֽי עִזִּים֮ הַ/כֹּ֣ל לַ/פְּסָחִים֒ לְ/כָל הַ/נִּמְצָ֗א לְ/מִסְפַּר֙ שְׁלֹשִׁ֣ים אֶ֔לֶף וּ/בָקָ֖ר שְׁלֹ֣שֶׁת אֲלָפִ֑ים אֵ֖לֶּה מֵ/רְכ֥וּשׁ הַ/מֶּֽלֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/007.yaml
  text: Josiah contributed to the people from the flock[a], lambs and young goats, all of them for the Passover offerings, for all who were present, to the number of thirty thousand, and three thousand cattle[b]. These were from the king’s possessions.
translation:
  language: pt
  text: 'Josias forneceu ao povo[a] animais dos rebanhos — cordeiros e cabritos, todos destinados às ofertas da Páscoa[b] — para todos os que estavam presentes: trinta mil animais, além de três mil cabeças de gado. Esses animais vieram dos bens do rei.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “aos filhos do povo”; também pode ser entendido como “às pessoas do povo” ou “ao povo comum”.
    reason: lexical_alternative
  - marker: b
    text: Ou “aos sacrifícios da Páscoa”. O hebraico traz o plural “Páscoas”, provavelmente em referência coletiva aos animais ou às ofertas pascais.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֶם
  choice: forneceu
  rationale: O hifil de רום, neste contexto, indica dar ou disponibilizar uma contribuição. “Forneceu” expressa o provimento feito por Josias sem sugerir que ele próprio sacrificou todos os animais.
- source_word: לִבְנֵי הָעָם
  choice: ao povo
  rationale: A expressão significa literalmente “aos filhos do povo”, mas aqui designa naturalmente o povo em geral, em contraste contextual com sacerdotes e levitas. A forma idiomática evita uma leitura exclusivamente masculina.
- source_word: צֹאן כְּבָשִׂים וּבְנֵי עִזִּים
  choice: animais dos rebanhos — cordeiros e cabritos
  rationale: צֹאן é um coletivo para animais de pequeno porte, sobretudo ovinos e caprinos; a sequência especifica cordeiros e cabritos. A tradução conserva tanto o termo coletivo quanto sua explicação.
- source_word: הַכֹּל לַפְּסָחִים
  choice: todos destinados às ofertas da Páscoa
  rationale: O plural פְּסָחִים pode designar coletivamente os animais ou sacrifícios pascais. “Ofertas da Páscoa” comunica sua finalidade cultual sem reproduzir de modo obscuro o plural hebraico.
- source_word: לְכָל הַנִּמְצָא
  choice: para todos os que estavam presentes
  rationale: O particípio nifal de מצא refere-se, no contexto, aos que se encontravam presentes na celebração.
- source_word: לְמִסְפַּר שְׁלֹשִׁים אֶלֶף
  choice: trinta mil animais
  rationale: O número retoma os animais dos rebanhos. A explicitação de “animais” torna clara a contagem em português sem alterar o referente.
- source_word: וּבָקָר שְׁלֹשֶׁת אֲלָפִים
  choice: além de três mil cabeças de gado
  rationale: בָּקָר é um coletivo para bovinos. “Cabeças de gado” é uma expressão corrente para a contagem, e “além de” distingue claramente esse total dos trinta mil animais dos rebanhos.
- source_word: אֵלֶּה מֵרְכוּשׁ הַמֶּלֶךְ
  choice: Esses animais vieram dos bens do rei
  rationale: רְכוּשׁ denota bens, propriedade ou posses. A formulação deixa claro que os animais provinham dos recursos pertencentes ao rei.
theological_decisions:
- issue: Sentido cultual do plural פְּסָחִים
  choice: ofertas da Páscoa
  alternative: sacrifícios da Páscoa / Páscoas
  rationale: O plural provavelmente se refere coletivamente aos animais ou ofertas pascais. A tradução mantém a referência cultual sem decidir de forma mais específica entre “animais” e “sacrifícios”.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. Os travessões organizam a especificação dos animais e evitam uma sequência nominal pesada; “cabeças de gado” é empregado apenas como unidade idiomática de contagem.
