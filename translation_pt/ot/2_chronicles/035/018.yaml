  text: וְ/לֹֽא נַעֲשָׂ֨ה פֶ֤סַח כָּמֹ֨/הוּ֙ בְּ/יִשְׂרָאֵ֔ל מִ/ימֵ֖י שְׁמוּאֵ֣ל הַ/נָּבִ֑יא וְ/כָל מַלְכֵ֣י יִשְׂרָאֵ֣ל לֹֽא עָשׂ֡וּ כַּ/פֶּ֣סַח אֲשֶׁר עָשָׂ֣ה יֹֽ֠אשִׁיָּהוּ וְ/הַ/כֹּהֲנִ֨ים וְ/הַ/לְוִיִּ֤ם וְ/כָל יְהוּדָה֙ וְ/יִשְׂרָאֵ֣ל הַ/נִּמְצָ֔א וְ/יוֹשְׁבֵ֖י יְרוּשָׁלִָֽם־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/018.yaml
  text: No Passover like it had been kept in Israel since the days of Samuel the prophet[a], and none of the kings of Israel had kept a Passover like the one that Josiah kept, with the priests, the Levites, all Judah, Israel that was present[b], and the inhabitants of Jerusalem.
translation:
  language: pt
  text: Não se havia celebrado em Israel uma Páscoa como aquela desde os dias do profeta Samuel[a]. Nenhum dos reis de Israel havia celebrado uma Páscoa como a que Josias celebrou com os sacerdotes, os levitas, todo o Judá, os israelitas que estavam presentes[b] e os habitantes de Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não se havia observado em Israel uma Páscoa como essa desde os dias do profeta Samuel”.'
    reason: lexical_alternative
  - marker: b
    text: 'Lit.: “o Israel que se encontrava presente”; isto é, os membros de Israel que estavam ali para a celebração.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲשָׂה / עָשׂוּ / עָשָׂה
  choice: se celebrou / havia celebrado / celebrou
  rationale: Com פֶסַח, o verbo עשה significa idiomaticamente celebrar ou observar a Páscoa, não fazê-la ou fabricá-la. “Celebrar” é natural e claro em português atual.
- source_word: פֶסַח
  choice: Páscoa
  rationale: Neste contexto, o termo abrange a celebração pascal, e não apenas o sacrifício. “Páscoa” é a forma consagrada e suficientemente ampla.
- source_word: כָּמֹהוּ
  choice: como aquela
  rationale: O sufixo retoma a Páscoa celebrada por Josias. “Aquela” preserva a referência retrospectiva e funciona naturalmente em português.
- source_word: בְּיִשְׂרָאֵל
  choice: em Israel
  rationale: A preposição tem aqui sentido locativo ou corporativo; a formulação mantém o alcance nacional.
- source_word: מִימֵי שְׁמוּאֵל הַנָּבִיא
  choice: desde os dias do profeta Samuel
  rationale: A preposição מן com “dias” indica o ponto inicial da comparação retrospectiva. A ordem escolhida soa natural em português.
- source_word: וְכָל מַלְכֵי יִשְׂרָאֵל לֹא
  choice: Nenhum dos reis de Israel
  rationale: A construção hebraica “todos... não” expressa negação universal. “Nenhum dos” evita uma tradução artificial ou potencialmente ambígua.
- source_word: אֲשֶׁר עָשָׂה יֹאשִׁיָּהוּ
  choice: como a que Josias celebrou
  rationale: A oração relativa e a comparação são mantidas de maneira fluente, com o sentido idiomático de עשה + פסח.
- source_word: וְהַכֹּהֲנִים וְהַלְוִיִּם
  choice: com os sacerdotes, os levitas
  rationale: “Com” explicita naturalmente que os grupos seguintes participaram da celebração com Josias, sem mudar a relação sintática implícita na enumeração.
- source_word: וְכָל יְהוּדָה
  choice: todo o Judá
  rationale: Mantém o uso coletivo e nacional do nome, em português corrente.
- source_word: וְיִשְׂרָאֵל הַנִּמְצָא
  choice: os israelitas que estavam presentes
  rationale: A expressão hebraica é coletiva e designa a parcela de Israel presente na ocasião. A forma plural é mais natural e inequívoca em português.
- source_word: וְיוֹשְׁבֵי יְרוּשָׁלִָם
  choice: e os habitantes de Jerusalém
  rationale: Tradução direta e corrente da expressão participial que designa os residentes da cidade.
theological_decisions:
- issue: Comparação histórica com celebrações anteriores da Páscoa
  choice: Manter a afirmação de que não se celebrou uma Páscoa comparável desde os dias de Samuel, sem explicar se a comparação é qualitativa, hiperbólica ou absoluta.
  alternative: Interpretar explicitamente a declaração como comparação apenas qualitativa, harmonizando-a com outras celebrações importantes, como a de Ezequias.
  rationale: O hebraico afirma a singularidade da celebração e depois menciona os reis de Israel, mas não define em que aspecto ela foi incomparável. A tradução preserva essa tensão histórica e teológica sem inserir uma harmonização.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Preferiu-se “celebrar a Páscoa” ao mais formal “observar a Páscoa”. A repetição de “celebrou” preserva a estrutura enfática do hebraico, e as notas registram alternativas genuínas sem sobrecarregar o texto principal.
