  text: Ele começou a construir no segundo mês, no segundo dia,[a] no quarto ano do seu reinado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “no segundo mês, no segundo”; a expressão final costuma ser entendida como “no segundo dia”.
