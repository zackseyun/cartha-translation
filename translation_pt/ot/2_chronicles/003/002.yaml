lexical_decisions:
- source_word: וַיָּחֶל
  choice: Ele começou
  rationale: O hifil de חלל com waw consecutivo introduz o início da ação. Em português, a conjunção narrativa pode ser omitida para dar naturalidade sem perda de sentido.
- source_word: לִבְנוֹת
  choice: a construir
  rationale: O infinitivo de בנה é expresso de modo direto e idiomático por “construir”.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: no segundo mês
  rationale: Mantém de perto a expressão temporal hebraica e é natural em português.
- source_word: בַּשֵּׁנִי
  choice: no segundo dia
  rationale: O ordinal repetido é elíptico no hebraico e costuma ser entendido como referência ao dia do mês; “dia” é explicitado no texto para clareza.
- source_word: בִּשְׁנַת אַרְבַּע
  choice: no quarto ano
  rationale: Equivalente claro e convencional da fórmula de datação por ano régio.
- source_word: לְמַלְכוּתוֹ
  choice: do seu reinado
  rationale: “Reinado” expressa naturalmente o governo régio usado como referência cronológica.
