  text: וַ/יַּ֜עַשׂ לִ/פְנֵ֤י הַ/בַּ֨יִת֙ עַמּוּדִ֣ים שְׁנַ֔יִם אַמּ֕וֹת שְׁלֹשִׁ֥ים וְ/חָמֵ֖שׁ אֹ֑רֶךְ וְ/הַ/צֶּ֥פֶת אֲשֶׁר עַל רֹאשׁ֖/וֹ אַמּ֥וֹת חָמֵֽשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/015.yaml
  text: In front of the house he made two pillars[a], thirty-five cubits high[b], and the capital that was on the top of each was five cubits.
translation:
  language: pt
  text: Diante do templo, ele fez duas colunas, com trinta e cinco côvados de comprimento[a]; e o capitel que ficava no alto de cada uma[b] media cinco côvados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “trinta e cinco côvados de comprimento”. Em 1Reis 7.15, a altura de cada coluna é de dezoito côvados; por isso, alguns entendem que Crônicas fornece aqui a medida conjunta das duas colunas, enquanto outros veem uma dificuldade textual.
    reason: cross_reference
  - marker: b
    text: 'Hebraico: “no alto dela”. O sufixo singular provavelmente se refere, de modo distributivo, a cada uma das duas colunas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי הַבַּיִת
  choice: Diante do templo
  rationale: לִפְנֵי indica posição diante ou em frente de algo. Neste contexto de construção, הַבַּיִת designa o templo; “templo” torna o referente claro e natural em português.
- source_word: עַמּוּדִים שְׁנַיִם
  choice: duas colunas
  rationale: עַמּוּדִים designa elementos arquitetônicos verticais. “Colunas” é corrente e preciso neste contexto.
- source_word: אַמּוֹת שְׁלֹשִׁים וְחָמֵשׁ אֹרֶךְ
  choice: com trinta e cinco côvados de comprimento
  rationale: A expressão hebraica emprega אֹרֶךְ, “comprimento”, e conserva a antiga unidade “côvado”. A tradução não substitui essa leitura por “altura”, embora o contexto arquitetônico possa sugeri-la.
- source_word: הַצֶּפֶת
  choice: o capitel
  rationale: O termo se refere à peça situada no topo da coluna; “capitel” é o equivalente arquitetônico preciso em português.
- source_word: אֲשֶׁר עַל רֹאשׁוֹ
  choice: que ficava no alto de cada uma
  rationale: רֹאשׁוֹ é literalmente “sobre a sua cabeça/o seu topo”. Como foram mencionadas duas colunas, “de cada uma” comunica a provável força distributiva do sufixo singular, documentada em nota.
- source_word: אַמּוֹת חָמֵשׁ
  choice: media cinco côvados
  rationale: A formulação verbal é natural em português e preserva tanto o número quanto a unidade do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A redação mantém “comprimento”, conforme o hebraico, em vez de resolver a dificuldade como “altura”; “templo” esclarece o referente contextual de “casa”, e a provável distribuição do singular entre as duas colunas é explicitada no texto e registrada em nota.
