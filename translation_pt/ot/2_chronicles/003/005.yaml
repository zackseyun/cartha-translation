  yaml_path: translation/ot/2_chronicles/003/005.yaml
  text: He paneled the great house with cypress wood[a], overlaid it with fine gold[b], and put palm trees and chains on it.
translation:
  language: pt
  text: Revestiu a sala principal com madeira de cipreste[a], cobriu-a com ouro fino e pôs nela palmeiras e correntes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “madeira de junípero” ou “madeira de abeto”. A identificação exata de בְּרוֹשׁ é discutida.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “palmeiras e correntes”; provavelmente eram motivos decorativos ou ornamentos aplicados à sala.'
    reason: cultural_note
lexical_decisions:
- source_word: הַבַּיִת הַגָּדוֹל
  choice: a sala principal
  rationale: Embora a expressão seja literalmente “a casa grande”, no contexto da construção do templo ela designa o recinto principal. “Sala principal” comunica naturalmente a função arquitetônica sem identificar de modo excessivamente específico o espaço.
- source_word: חִפָּה עֵץ בְּרוֹשִׁים
  choice: revestiu ... com madeira de cipreste
  rationale: חפה significa cobrir ou revestir; com madeira como material, “revestiu” descreve com clareza o acabamento arquitetônico. “Cipreste” é uma identificação tradicional e plausível de בְּרוֹשׁ, cuja espécie exata permanece discutida.
- source_word: וַיְחַפֵּהוּ זָהָב טוֹב
  choice: cobriu-a com ouro fino
  rationale: A repetição de חפה indica uma segunda camada de revestimento. “Ouro fino” expressa naturalmente זָהָב טוֹב, literalmente “ouro bom”, como ouro de alta qualidade sem afirmar necessariamente pureza absoluta.
- source_word: וַיַּעַל עָלָיו
  choice: aplicou sobre ela
  rationale: O hifil de עלה, neste contexto decorativo, indica colocar ou aplicar elementos numa superfície. A formulação é clara e idiomática em português.
- source_word: תִּמֹרִים
  choice: figuras de palmeiras
  rationale: O substantivo significa “palmeiras”, mas, sobre uma superfície revestida de ouro, refere-se naturalmente a representações ornamentais. “Figuras de” explicita apenas o necessário para evitar a impressão de árvores reais.
- source_word: שַׁרְשְׁרוֹת
  choice: correntes
  rationale: É a correspondência direta do termo hebraico e preserva a possibilidade de serem correntes ou motivos ornamentais em forma de corrente.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Sala principal” evita o literalismo pouco claro de “casa grande”; “revestiu” e “aplicou” mantêm a sequência construtiva. Os marcadores [a] e [b] aparecem no texto, e a nota [b] preserva a forma mais literal do hebraico.
