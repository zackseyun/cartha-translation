base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/011.yaml
  text: 'The wings of the cherubim were twenty cubits long: one wing was five cubits[a], reaching to the wall of the house, and the other wing was five cubits[b], reaching to the wing of the other cherub.'
translation:
  language: pt
  text: 'O comprimento das asas dos querubins era de vinte côvados[a]: uma asa media cinco côvados e alcançava a parede do templo, e a outra asa media cinco côvados e alcançava a asa do outro querubim.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Um côvado correspondia aproximadamente à distância do cotovelo à ponta dos dedos, cerca de 45 centímetros. Assim, cinco côvados eram cerca de 2,25 metros, e vinte côvados, cerca de 9 metros.
    reason: cultural_note
  - marker: b
    text: 'Ou: «tocava a asa do outro querubim». O verbo hebraico também pode enfatizar o contato físico; o mesmo vale para a asa que alcançava a parede.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַנְפֵי הַכְּרוּבִים
  choice: As asas dos querubins
  rationale: Mantém o plural construto e a designação tradicional dos seres celestiais; a conjunção inicial é omitida para dar naturalidade ao português sem perder a continuidade narrativa.
- source_word: אָרְכָּם אַמּוֹת עֶשְׂרִים
  choice: mediam vinte côvados ao todo
  rationale: Expressa naturalmente a medida total das asas. «Ao todo» explicita o valor conjunto indicado pelo contexto arquitetônico, em que cada uma das quatro asas mencionadas na descrição mede cinco côvados.
- source_word: כְּנַף הָאֶחָד לְאַמּוֹת חָמֵשׁ
  choice: uma asa media cinco côvados
  rationale: Supre em português o sentido verbal de medida que está elíptico no hebraico.
- source_word: מַגַּעַת / מַגִּיעַ
  choice: alcançava
  rationale: נגע pode descrever chegar até um ponto ou tocá-lo. «Alcançava» é natural na descrição arquitetônica e preserva parte dessa abertura sem exigir que o contato físico seja enfatizado no corpo do texto.
- source_word: לְקִיר הַבַּיִת
  choice: a parede do templo
  rationale: Embora בַּיִת signifique literalmente «casa», aqui designa inequivocamente o edifício do templo; «templo» comunica o referente com clareza ao leitor moderno.
- source_word: לִכְנַף הַכְּרוּב הָאַחֵר
  choice: a asa do outro querubim
  rationale: Preserva o singular «querubim» e traduz אַחֵר como «outro», sem interpretar como «segundo».
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva «côvados» no texto por ser a unidade arquitetônica antiga e fornece equivalentes modernos aproximados em nota. Usa «querubins», plural português corrente, e «templo» para evitar a possível ambiguidade de «casa» neste contexto.
