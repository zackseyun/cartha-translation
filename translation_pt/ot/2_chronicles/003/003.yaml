  text: וְ/אֵ֨לֶּה֙ הוּסַ֣ד שְׁלֹמֹ֔ה לִ/בְנ֖וֹת אֶת בֵּ֣ית הָ/אֱלֹהִ֑ים הָ/אֹ֡רֶךְ אַמּ֞וֹת בַּ/מִּדָּ֤ה הָ/רִֽאשׁוֹנָה֙ אַמּ֣וֹת שִׁשִּׁ֔ים וְ/רֹ֖חַב אַמּ֥וֹת עֶשְׂרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/003.yaml
  text: 'These are the foundations Solomon laid for building the house of God: the length in cubits[a], according to the former measure, was sixty cubits[c][b], and the width twenty cubits.'
translation:
  language: pt
  text: 'Estes são os alicerces[a] que Salomão lançou para construir a casa de Deus: o comprimento em côvados, segundo a medida anterior[b], era de sessenta côvados[c], e a largura, de vinte côvados.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Foi isto que Salomão estabeleceu como fundamento para construir a casa de Deus”. O hebraico desta expressão é difícil; ela também pode ser entendida de modo mais geral como referência ao plano ou às especificações básicas do templo.'
    reason: lexical_alternative
  - marker: b
    text: “Segundo a medida anterior” talvez se refira a um padrão mais antigo de côvado.
    reason: cultural_note
  - marker: c
    text: 'Outra forma de organizar a frase: “o comprimento, em côvados segundo a medida anterior, era de sessenta côvados”.'
    reason: source_syntax
lexical_decisions:
- source_word: הוּסַד
  choice: os alicerces que Salomão lançou
  rationale: A forma hebraica é difícil neste contexto. A expressão portuguesa comunica o ato de estabelecer os fundamentos da construção, sem reduzi-la simplesmente a “plano” ou “projeto”.
- source_word: לִבְנוֹת
  choice: para construir
  rationale: O infinitivo com ל exprime propósito; “para construir” é natural e preserva essa função.
- source_word: בֵּית הָאֱלֹהִים
  choice: a casa de Deus
  rationale: Mantém a imagem hebraica de “casa”, embora o referente seja o templo.
- source_word: הָאֹרֶךְ
  choice: o comprimento
  rationale: Termo arquitetônico corrente e adequado ao contexto das dimensões.
- source_word: אַמּוֹת
  choice: côvados
  rationale: Conserva a unidade antiga explicitamente usada no hebraico, sem impor uma conversão moderna incerta.
- source_word: בַּמִּדָּה הָרִאשׁוֹנָה
  choice: segundo a medida anterior
  rationale: Representa de perto a expressão hebraica e mantém em aberto se ela designa especificamente um padrão antigo de côvado.
- source_word: שִׁשִּׁים
  choice: sessenta
  rationale: Número cardinal que indica o comprimento.
- source_word: וְרֹחַב
  choice: e a largura
  rationale: A construção portuguesa retoma naturalmente a estrutura de medida, com elipse do verbo.
- source_word: עֶשְׂרִים
  choice: vinte
  rationale: Número cardinal que indica a largura.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Preservou-se “casa de Deus” em vez de explicitar “templo”, e “côvados” em vez de converter a medida. A dificuldade de הוּסַד e a incerteza de “medida anterior” foram mantidas e explicadas em notas.
