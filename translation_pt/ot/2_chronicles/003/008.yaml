revisions:
- from: Ele fez o Lugar Santíssimo[a]. Seu comprimento, acompanhando a largura do templo, era de vinte côvados, e sua largura também era de vinte côvados. Ele o revestiu com seiscentos talentos[b] de ouro fino.
  to: 'Ele fez o Lugar Santíssimo[a]: seu comprimento, correspondente à largura do templo, era de vinte côvados, e sua largura era de vinte côvados; revestiu-o de ouro fino, num total de seiscentos talentos[b].'
  rationale: A revisão substitui uma construção portuguesa artificial por uma formulação natural que conserva a relação espacial deliberadamente não técnica do hebraico. Mantém todas as medidas, a qualidade do ouro e a quantidade expressa em talentos, sem conversão nem harmonização interpretativa.
