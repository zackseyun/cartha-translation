base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/008.yaml
  text: He made the Most Holy Place[a], its length corresponding to the width of the house, twenty cubits, and its width twenty cubits; and he overlaid it with fine gold[b], six hundred talents.
translation:
  language: pt
  text: 'Ele fez o Lugar Santíssimo[a]: seu comprimento, correspondente à largura do templo, era de vinte côvados, e sua largura era de vinte côvados; revestiu-o de ouro fino, num total de seiscentos talentos[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Santo dos Santos”.'
    reason: lexical_alternative
  - marker: b
    text: Um talento era uma antiga unidade de peso. O valor exato variava.
    reason: measurement_clarification
lexical_decisions:
- source_word: בֵּית קֹדֶשׁ הַקֳּדָשִׁים
  choice: o Lugar Santíssimo
  rationale: Expressa de modo natural em português o superlativo idiomático hebraico e identifica claramente o santuário interior.
- source_word: אָרְכּוֹ עַל פְּנֵי רֹחַב הַבַּיִת
  choice: Seu comprimento, acompanhando a largura do templo
  rationale: Preserva a relação espacial indicada por עַל־פְּנֵי sem impor precisão arquitetônica maior que a do hebraico; 'templo' evita a possível leitura de uma residência comum.
- source_word: אַמּוֹת עֶשְׂרִים
  choice: vinte côvados
  rationale: Mantém a unidade antiga específica do texto-fonte, sem conversão aproximativa.
- source_word: וְרָחְבּוֹ אַמּוֹת עֶשְׂרִים
  choice: e sua largura também era de vinte côvados
  rationale: A inserção de 'também' torna natural a repetição da mesma medida sem alterar o conteúdo.
- source_word: וַיְחַפֵּהוּ
  choice: Ele o revestiu
  rationale: '''Revestir'' é o verbo arquitetônico corrente para cobrir uma estrutura com ouro.'
- source_word: זָהָב טוֹב
  choice: ouro fino
  rationale: טוֹב qualifica a boa qualidade do ouro; 'fino' é idiomático e evita afirmar explicitamente pureza metalúrgica.
- source_word: לְכִכָּרִים שֵׁשׁ מֵאוֹת
  choice: com seiscentos talentos
  rationale: Comunica concisamente a quantidade ou o peso do ouro empregado, preservando a antiga unidade de peso.
theological_decisions: []
