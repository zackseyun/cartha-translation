base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/012.yaml
  text: The wing of the one cherub was five cubits[a], reaching to the wall of the house; and the other wing was five cubits[b], touching the wing of the other cherub.
translation:
  language: pt
  text: A asa de um querubim media cinco côvados e alcançava a parede do templo[a]; a outra asa media cinco côvados e tocava[b] a asa do outro querubim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «da Casa»; isto é, do edifício do templo.
    reason: cultural_note
  - marker: b
    text: 'Ou: «estava unida à».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְנַף
  choice: asa
  rationale: No contexto dos querubins do templo, designa concretamente uma asa, não uma borda ou extremidade.
- source_word: כְּרוּב
  choice: querubim
  rationale: Mantém o substantivo no singular quando se refere a cada figura individual; a construção natural «um dos querubins» expressa הָאֶחָד sem sugerir que se trata do primeiro em uma sequência.
- source_word: אַמּוֹת חָמֵשׁ
  choice: cinco côvados
  rationale: Conserva a antiga unidade de medida e evita fixar uma equivalência moderna incerta.
- source_word: מַגִּיעַ
  choice: alcançava
  rationale: Expressa de modo natural a extensão física da asa até a parede, preservando a ideia de chegar a ela.
- source_word: קִיר הַבָּיִת
  choice: a parede da Casa
  rationale: Preserva o sentido literal de בַּיִת, «casa», enquanto a inicial maiúscula e a nota esclarecem que se trata do edifício do templo.
- source_word: הַכָּנָף הָאַחֶרֶת
  choice: a outra asa
  rationale: É a correspondência natural do adjetivo feminino אַחֶרֶת em referência à segunda asa do mesmo querubim.
- source_word: דְּבֵקָה
  choice: tocava
  rationale: Comunica o contato estreito entre as asas sem afirmar necessariamente que estavam presas uma à outra; a alternativa possível é registrada em nota.
- source_word: הַכְּרוּב הָאַחֵר
  choice: o outro querubim
  rationale: Preserva a relação de par expressa pelo adjetivo «outro».
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural. «Casa» conserva a imagem tradicional do templo como casa de Deus, e a nota elimina possível ambiguidade. A repetição de «cinco côvados» acompanha a estrutura arquitetônica do hebraico.
