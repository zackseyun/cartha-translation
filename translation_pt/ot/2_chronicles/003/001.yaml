  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יָּ֣חֶל שְׁלֹמֹ֗ה לִ/בְנ֤וֹת אֶת בֵּית יְהוָה֙ בִּ/יר֣וּשָׁלִַ֔ם בְּ/הַר֙ הַ/מּ֣וֹרִיָּ֔ה אֲשֶׁ֥ר נִרְאָ֖ה לְ/דָוִ֣יד אָבִ֑י/הוּ אֲשֶׁ֤ר הֵכִין֙ בִּ/מְק֣וֹם דָּוִ֔יד בְּ/גֹ֖רֶן אָרְנָ֥ן הַ/יְבוּסִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/001.yaml
  text: Then Solomon began to build the house of Yahweh in Jerusalem on Mount Moriah[a], where Yahweh had appeared to David his father, at the place that David had prepared[b], on the threshing floor of Ornan the Jebusite.
translation:
  language: pt
  text: Então Salomão começou a construir a casa de Yahweh em Jerusalém, no monte Moriá, onde Yahweh havia aparecido a Davi, seu pai.[a] Ele começou a construí-la no lugar que Davi havia preparado, na eira de Ornã, o jebuseu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, com leitura passiva: “que havia sido mostrado a Davi, seu pai”.'
    reason: alternative_reading
  - marker: b
    text: Crônicas usa a forma Ornã; compare Araúna em 2 Samuel 24.16, 18.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּחֶל
  choice: Então Salomão começou
  rationale: O verbo introduz o acontecimento seguinte na sequência narrativa; “começou” expressa o sentido básico, e “então” dá fluidez à progressão.
- source_word: לִבְנוֹת
  choice: a construir
  rationale: O infinitivo após “começou” é expresso naturalmente em português pela construção “começou a construir”.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: “Casa” preserva a imagem concreta do hebraico, sem substituir o termo por “templo”; o nome divino é transliterado como Yahweh.
- source_word: בְּהַר הַמּוֹרִיָּה
  choice: no monte Moriá
  rationale: Tradução tradicional e contextualmente adequada para o monte específico chamado Moriá.
- source_word: אֲשֶׁר נִרְאָה לְדָוִיד אָבִיהוּ
  choice: onde Yahweh havia aparecido a Davi, seu pai
  rationale: O nifal de ראה pode indicar uma aparição, e o contexto identifica Yahweh como sujeito implícito. O mais-que-perfeito situa a aparição antes da construção.
- source_word: אֲשֶׁר הֵכִין ... דָּוִיד
  choice: no lugar que Davi havia preparado
  rationale: A formulação hebraica é comprimida. A tradução explicita a relação mais provável entre Davi, o preparo do lugar e a eira, mantendo uma leitura corrente em português.
- source_word: בְּגֹרֶן אָרְנָן הַיְבוּסִי
  choice: a eira de Ornã, o jebuseu
  rationale: “Eira” é o equivalente tradicional e preciso para o espaço de debulha; “Ornã” segue a forma do nome usada em Crônicas.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome divino presente diretamente no texto hebraico, sem o substituir por um título.
- issue: Sujeito de נִרְאָה (“apareceu”)
  choice: Yahweh como sujeito implícito
  alternative: “que havia sido mostrado a Davi”
  rationale: O contexto favorece uma aparição de Yahweh a Davi, mas a forma hebraica também admite uma leitura mais passiva; essa ambiguidade é registrada em nota.
- issue: Relação sintática de אֲשֶׁר הֵכִין בִּמְקוֹם דָּוִיד
  choice: Davi havia preparado o lugar
  alternative: 'Formulação mais literal e obscura: “que ele preparou no lugar de Davi”'
  rationale: A ordem hebraica é compacta e difícil. A leitura escolhida concorda com o contexto da escolha e preparação da eira por Davi, sem introduzir uma conclusão doutrinária.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural para leitores brasileiros. “Casa de Yahweh” conserva a imagem hebraica; a divisão em duas frases evita uma cadeia pesada de orações relativas. Todos os marcadores de nota aparecem no texto principal e junto ao conteúdo a que se referem.
