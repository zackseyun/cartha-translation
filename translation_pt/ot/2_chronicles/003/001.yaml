  source_fidelity: A primeira oração transmite adequadamente o início da construção, o local, a aparição de Yahweh a Davi e a identificação da eira. Contudo, «Ele a construiu» transforma «começou a construir» em uma afirmação adicional de conclusão da obra, ausente do hebraico.
  naturalness: «Havia aparecido» é compreensível e apropriado ao registro, e a frase única revisada conserva uma progressão natural. A eliminação da segunda frase também evita um pronome cujo antecedente é claro, mas cuja informação não é textual.
  terminology: «Casa de Yahweh», «monte Moriá», «eira» e «Ornã, o jebuseu» são escolhas fiéis, naturais e consistentes. As notas preservam tanto a possível leitura passiva de נראה quanto a variante onomástica Araúna.
