base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/014.yaml
  text: He made the curtain of blue[a], purple, crimson, and fine linen[c][b], and worked cherubim on it.
translation:
  language: pt
  text: Fez o véu[a] de tecido azul, púrpura, carmesim[b] e linho fino e nele fez figuras de querubins[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a cortina”.
    reason: lexical_alternative
  - marker: b
    text: Ou “escarlate”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “fez querubins subir sobre ele”; isto é, decorou o véu com figuras de querubins.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפָּרֹכֶת
  choice: o véu
  rationale: Designa a cortina divisória interior do santuário. “Véu” é natural no contexto bíblico e preserva a função de separação; “cortina” permanece como alternativa lexical.
- source_word: תְּכֵלֶת
  choice: tecido azul
  rationale: O termo indica material tingido de azul ou azul-violeta; “tecido azul” explicita que a lista trata dos materiais e cores do véu.
- source_word: אַרְגָּמָן
  choice: púrpura
  rationale: Equivalente corrente para o prestigioso material tingido de púrpura, adequado à enumeração concisa.
- source_word: כַרְמִיל
  choice: carmesim
  rationale: Designa material tingido de vermelho intenso. “Carmesim” representa bem a tonalidade, enquanto “escarlate” é alternativa legítima.
- source_word: בּוּץ
  choice: linho fino
  rationale: O vocábulo se refere a linho de qualidade fina, relevante para a riqueza do tecido cultual.
- source_word: וַיַּעַל עָלָיו כְּרוּבִים
  choice: nele teceu figuras de querubins
  rationale: A expressão literalmente diz que fez querubins subir sobre ele; no contexto, descreve a aplicação artística dessas figuras ao véu. “Teceu” é idiomático em português, e “figuras” evita sugerir seres reais sobre o tecido.
- source_word: כְּרוּבִים
  choice: querubins
  rationale: Mantém o termo bíblico convencional para os seres celestiais representados na decoração do santuário.
