  text: וְ/הָ/אוּלָ֡ם אֲשֶׁר֩ עַל פְּנֵ֨י הָ/אֹ֜רֶךְ עַל פְּנֵ֤י רֹֽחַב הַ/בַּ֨יִת֙ אַמּ֣וֹת עֶשְׂרִ֔ים וְ/הַ/גֹּ֖בַהּ מֵאָ֣ה וְ/עֶשְׂרִ֑ים וַ/יְצַפֵּ֥/הוּ מִ/פְּנִ֖ימָה זָהָ֥ב טָהֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/004.yaml
  text: The portico that was in front of the house was twenty cubits long[a], corresponding to the width of the house, and its height was one hundred and twenty cubits; and he overlaid its interior with pure gold.
translation:
  language: pt
  text: O pórtico que ficava diante do templo tinha vinte côvados de comprimento, correspondendo à largura do templo, e cento e vinte côvados de altura[a]. Ele o revestiu por dentro de ouro puro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico diz que a altura do pórtico era de “cento e vinte” côvados. A descrição paralela em 1 Reis 6:3 informa o comprimento e a largura do pórtico, mas não menciona essa altura. Alguns intérpretes suspeitam de um problema na transmissão do texto neste ponto; a tradução segue o Texto Massorético preservado.
    reason: textual_variant
lexical_decisions:
- source_word: הָאוּלָם
  choice: o pórtico
  rationale: אוּלָם designa a estrutura de entrada situada diante do edifício principal. “Pórtico” é um termo arquitetônico atual, claro e adequado ao contexto do templo.
- source_word: אֲשֶׁר עַל־פְּנֵי
  choice: que ficava diante de
  rationale: A expressão indica a posição da estrutura em frente ao edifício, sem exigir uma interpretação adicional sobre sua orientação.
- source_word: הַבַּיִת
  choice: o templo
  rationale: Embora בַּיִת possa significar literalmente “casa”, neste contexto designa o edifício do templo; “templo” comunica o referente com clareza ao leitor moderno.
- source_word: הָאֹרֶךְ עַל־פְּנֵי רֹחַב הַבַּיִת
  choice: tinha vinte côvados de comprimento, correspondendo à largura do templo
  rationale: A formulação hebraica é condensada e relaciona o comprimento frontal do pórtico à largura do templo. A tradução explicita essa relação sem acrescentar uma dimensão não presente no texto.
- source_word: אַמּוֹת עֶשְׂרִים
  choice: vinte côvados
  rationale: Mantém a antiga unidade de medida em vez de fazer uma conversão aproximada.
- source_word: וְהַגֹּבַהּ מֵאָה וְעֶשְׂרִים
  choice: e cento e vinte côvados de altura
  rationale: Segue o Texto Massorético e repõe “côvados”, subentendido no contexto da medição, para dar clareza em português.
- source_word: וַיְצַפֵּהוּ מִפְּנִימָה
  choice: Ele o revestiu por dentro
  rationale: צפה indica revestir ou recobrir com um material, e מִפְּנִימָה especifica a parte interior. O pronome “o” conserva a referência ao pórtico.
- source_word: זָהָב טָהוֹר
  choice: ouro puro
  rationale: Tradução direta e idiomática da expressão que descreve o material do revestimento.
