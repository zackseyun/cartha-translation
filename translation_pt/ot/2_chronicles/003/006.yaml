base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/006.yaml
  text: He overlaid the house with precious stones for beauty[b][a], and the gold was gold from Parvaim.
translation:
  language: pt
  text: Ele revestiu a Casa[a] de pedras preciosas, para ornamentação, e o ouro era ouro de Parvaim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o templo”. O hebraico diz literalmente “a Casa”, designação comum do templo em Crônicas.
    reason: lexical_alternative
  - marker: b
    text: Parvaim é um nome geográfico de identificação incerta. O hebraico diz literalmente “ouro de Parvaim”.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַף
  choice: revestiu
  rationale: No contexto da construção do templo, צפה indica cobrir uma estrutura com uma camada de material decorativo; “revestiu” é natural e preciso em português.
- source_word: הַבַּיִת
  choice: a Casa
  rationale: Conserva o sentido literal de “casa”, designação frequente do templo em Crônicas. A inicial maiúscula ajuda a indicar o referente específico sem substituir o termo hebraico por “templo”.
- source_word: אֶבֶן יְקָרָה
  choice: pedras preciosas
  rationale: Embora o hebraico use o singular, a expressão tem sentido coletivo; o plural é idiomático em português para materiais ornamentais.
- source_word: לְתִפְאָרֶת
  choice: para a sua beleza
  rationale: Expressa a finalidade ornamental da aplicação das pedras. O pronome explicita naturalmente em português que a beleza é a da Casa, sem introduzir a noção teológica mais forte de “glória”.
- source_word: וְהַזָּהָב
  choice: e o ouro era
  rationale: Mantém a coordenação hebraica e apresenta de modo claro a especificação da procedência ou qualidade do ouro.
- source_word: זְהַב פַּרְוָיִם
  choice: ouro de Parvaim
  rationale: A construção hebraica indica procedência ou associação. “Ouro de Parvaim” preserva essa abertura, já que a identificação de Parvaim é incerta.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural para brasileiros. Preserva-se “Casa” como designação bíblica do templo, e as notas mantêm as ambiguidades lexical e geográfica do hebraico.
