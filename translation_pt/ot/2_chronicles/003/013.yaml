  yaml_path: translation/ot/2_chronicles/003/013.yaml
  text: The wings of these cherubim spread twenty cubits[a], and they stood on their feet, with their faces toward the house.
translation:
  language: pt
  text: As asas desses querubins se estendiam por vinte côvados, e eles estavam em pé, com os rostos voltados para a casa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para o templo”. Hebraico: “para a casa”, uma designação comum do edifício do templo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּנְפֵי הַכְּרוּבִים הָאֵלֶּה
  choice: As asas desses querubins
  rationale: Reproduz a relação construta e mantém o demonstrativo. “Querubins” é o termo bíblico estabelecido e amplamente compreensível em português.
- source_word: פֹּרְשִׂים
  choice: se estendiam
  rationale: O particípio descreve o estado ou a disposição das asas; o imperfeito produz uma descrição natural em português sem sugerir necessariamente uma ação em andamento.
- source_word: אַמּוֹת עֶשְׂרִים
  choice: por vinte côvados
  rationale: Conserva literalmente a antiga unidade de medida. A preposição “por” expressa de modo natural a extensão indicada no hebraico, sem acrescentar uma dimensão específica.
- source_word: וְהֵם עֹמְדִים עַל רַגְלֵיהֶם
  choice: e eles estavam em pé
  rationale: O pronome explícito marca a mudança das asas para os próprios querubins. “Estavam em pé” comunica naturalmente a postura descrita por “sobre seus pés”.
- source_word: וּפְנֵיהֶם לַבָּיִת
  choice: com o rosto voltado para o templo
  rationale: O plural distributivo hebraico pode ser expresso idiomaticamente pelo singular coletivo “o rosto”. Neste contexto, “a casa” designa o edifício do templo; “templo” deixa o referente claro ao leitor moderno.
theological_decisions:
- issue: Sentido de בַּיִת no contexto da construção do santuário
  choice: o templo
  alternative: a casa
  rationale: Embora o termo hebraico comum signifique literalmente “casa”, aqui ele funciona como designação do edifício do templo. A tradução contextual evita que “casa” pareça referir-se a uma residência, enquanto a nota preserva a forma literal e a textura do original.
translation_notes:
  register: Português moderno, digno e amplamente acessível, com boa legibilidade brasileira. A formulação preserva a descrição espacial concisa do hebraico; mantém “côvados” como medida antiga e esclarece em nota a expressão literal “a casa”.
