base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/009.yaml
  text: And the weight of the nails was fifty shekels of gold[a], and he overlaid the upper rooms with gold.
translation:
  language: pt
  text: O peso dos pregos era de cinquenta siclos de ouro, e ele revestiu de ouro as salas superiores[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «os aposentos superiores»; o termo hebraico também pode indicar, de modo mais geral, as partes ou estruturas superiores do templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁקָל
  choice: O peso
  rationale: מִשְׁקָל indica o peso ou a pesagem. A conjunção וּ liga a frase ao contexto anterior, mas não precisa ser representada por um «e» inicial em português moderno.
- source_word: לְמִסְמְרוֹת
  choice: dos pregos
  rationale: מִסְמְרוֹת pode designar pregos ou cravos. Na construção com מִשְׁקָל, «o peso dos pregos» expressa naturalmente a relação; «pregos» é claro e adequado ao contexto da construção do templo.
- source_word: לִשְׁקָלִים חֲמִשִּׁים
  choice: era de cinquenta siclos
  rationale: A expressão informa a medida do peso. «Era de cinquenta siclos» reproduz com naturalidade e precisão seu valor quantitativo.
- source_word: זָהָב
  choice: de ouro
  rationale: O ouro é o material cujo peso equivalia a cinquenta siclos; a formulação portuguesa evita sugerir que os próprios siclos fossem objetos feitos de ouro.
- source_word: וְהָעֲלִיּוֹת
  choice: as salas superiores
  rationale: עֲלִיּוֹת normalmente se refere a aposentos ou salas situados na parte superior, embora o referente arquitetônico exato permaneça incerto.
- source_word: חִפָּה
  choice: revestiu
  rationale: חפה descreve cobrir uma superfície com determinado material. «Revestiu de ouro» é natural no vocabulário arquitetônico português.
- source_word: זָהָב
  choice: de ouro
  rationale: Com «revestiu», a preposição «de» identifica de modo idiomático o material aplicado.
