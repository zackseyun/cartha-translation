base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/016.yaml
  text: He made chains in the inner sanctuary and put them on the tops of the pillars[b][a]; he also made one hundred pomegranates and put them on the chains.
translation:
  language: pt
  text: Fez correntes[b] no santuário interior[a] e as colocou no alto das colunas; fez também cem romãs e as colocou nas correntes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no recinto interior”; tradicionalmente, “no Lugar Santíssimo”. O termo hebraico se refere ao santuário interior do templo, embora alguns entendam aqui a expressão de modo mais amplo, em relação ao trabalho decorativo.
    reason: alternative_reading
  - marker: b
    text: Ou “trabalho de correntes” ou “grinaldas”, referindo-se à decoração ornamental.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁרְשְׁרוֹת
  choice: correntes
  rationale: O substantivo designa adornos semelhantes a correntes. “Correntes” conserva o sentido concreto e funciona nas duas ocorrências do versículo; a nota registra possibilidades ornamentais como “trabalho de correntes” e “grinaldas”.
- source_word: בַּדְּבִיר
  choice: no santuário interior
  rationale: דְּבִיר normalmente designa o recinto mais interno do templo. “Santuário interior” é claro e arquitetonicamente preciso, sem impor no texto principal o título litúrgico tradicional “Lugar Santíssimo”.
- source_word: רֹאשׁ הָעַמֻּדִים
  choice: no alto das colunas
  rationale: Embora רֹאשׁ signifique literalmente “cabeça”, em referência arquitetônica indica a parte superior. “No alto das colunas” é natural em português e preserva a relação espacial.
- source_word: רִמּוֹנִים
  choice: romãs
  rationale: O termo se refere aqui a ornamentos em forma de romã. A tradução direta é tradicional e compreensível no contexto decorativo.
- source_word: מֵאָה
  choice: cem
  rationale: Tradução direta do numeral, em forma idiomática antes do substantivo em português.
- source_word: וַיִּתֵּן בַּשַּׁרְשְׁרוֹת
  choice: as colocou nas correntes
  rationale: A preposição בְּ com o substantivo repetido pode indicar colocação ou integração aos adornos. “Nas correntes” preserva essa relação sem especificar excessivamente o modo de fixação.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem dos marcadores foi ajustada para que [a] acompanhe “santuário interior” e [b] se relacione às “correntes”. Mantém-se a concisão descritiva do hebraico e a ambiguidade pertinente nas notas.
