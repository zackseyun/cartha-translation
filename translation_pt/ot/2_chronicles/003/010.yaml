base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/010.yaml
  text: In the Most Holy Place he made two cherubim[a], the work of an image-maker[b], and overlaid them with gold.
translation:
  language: pt
  text: No recinto do Santo dos Santos, ele fez dois querubins, obra de escultura[a], e os revestiram de ouro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “obra esculpida”, “obra entalhada” ou “obra artística”. O sentido do raro termo hebraico é incerto.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבֵית קֹדֶשׁ הַקֳּדָשִׁים
  choice: No recinto do Santo dos Santos
  rationale: A expressão designa o espaço mais interior e sagrado do templo. “Recinto” comunica o valor locativo de בְּבֵית sem sugerir outro edifício independente, e “Santo dos Santos” preserva o superlativo idiomático hebraico em forma consagrada e inteligível.
- source_word: כְּרוּבִים שְׁנַיִם
  choice: dois querubins
  rationale: “Querubins” é o plural estabelecido em português e corresponde naturalmente ao hebraico.
- source_word: מַעֲשֵׂה צַעֲצֻעִים
  choice: obra de escultura
  rationale: מַעֲשֵׂה indica obra ou trabalho, enquanto o raro צַעֲצֻעִים parece caracterizar o tipo de produção artística, não necessariamente o artesão. “Obra de escultura” descreve os querubins como produto esculpido sem transformar o termo em referência ao fabricante.
- source_word: וַיְצַפּוּ אֹתָם זָהָב
  choice: e os revestiram de ouro
  rationale: צפה, neste contexto, significa revestir com metal. A forma verbal hebraica está no plural; “os revestiram” preserva essa mudança em relação ao sujeito singular da primeira oração, sem identificar quem realizou o revestimento.
