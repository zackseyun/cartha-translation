source:
  edition: WLC
  text: וַ/יָּ֤קֶם אֶת הָֽ/עַמּוּדִים֙ עַל פְּנֵ֣י הַ/הֵיכָ֔ל אֶחָ֥ד מִ/יָּמִ֖ין וְ/אֶחָ֣ד מֵֽ/הַ/שְּׂמֹ֑אול וַ/יִּקְרָ֤א שֵׁם ה/ימיני יָכִ֔ין וְ/שֵׁ֥ם הַ/שְּׂמָאלִ֖י בֹּֽעַז־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/017.yaml
  text: He set up the pillars in front of the nave[a], one on the right and one on the left; and he called the name of the one on the right Jachin, and the name of the one on the left Boaz.
translation:
  language: pt
  text: Ele ergueu as colunas diante do salão principal do templo[a], uma à direita e outra à esquerda. Deu à coluna da direita o nome de Jaquim, e à coluna da esquerda, o nome de Boaz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “diante do santuário”. Aqui, o termo hebraico heikhal se refere ao salão principal do edifício do templo, não necessariamente a todo o complexo do templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: ergueu
  rationale: O hifil de קום indica fazer com que as colunas ficassem de pé. “Ergueu” é natural no contexto de construção e preserva a ação concreta.
- source_word: הָעַמּוּדִים
  choice: as colunas
  rationale: עַמּוּדִים designa colunas ou pilares arquitetônicos. “Colunas” é claro e corrente em português para esses elementos monumentais do templo.
- source_word: עַל־פְּנֵי הַהֵיכָל
  choice: diante do salão principal do templo
  rationale: A expressão espacial significa “diante de”, e הֵיכָל, neste contexto, refere-se ao salão principal do edifício do templo, não necessariamente a todo o complexo.
- source_word: אֶחָד מִיָּמִין וְאֶחָד מֵהַשְּׂמֹאול
  choice: uma à direita e outra à esquerda
  rationale: Mantém as indicações relativas do hebraico sem convertê-las em pontos cardeais, que não aparecem explicitamente no texto.
- source_word: וַיִּקְרָא שֵׁם
  choice: Deu ... o nome de
  rationale: Representa de modo natural em português o idiomatismo hebraico “chamou o nome de”, preservando claramente o ato de nomear.
- source_word: הַיְמִינִי
  choice: a coluna da direita
  rationale: Explicita o referente implícito do adjetivo hebraico e produz uma formulação natural e inequívoca.
- source_word: יָכִין
  choice: Jaquim
  rationale: Forma tradicional e amplamente reconhecida em português para o nome hebraico יָכִין.
- source_word: הַשְּׂמָאלִי
  choice: a coluna da esquerda
  rationale: Explicita o referente implícito e mantém o paralelismo com “a coluna da direita”.
- source_word: בֹּעַז
  choice: Boaz
  rationale: Forma tradicional e amplamente reconhecida em português para o nome próprio hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A repetição parcial de “coluna” esclarece o referente dos adjetivos hebraicos e mantém o paralelismo. A pontuação divide o longo período hebraico sem alterar sua sequência narrativa.
