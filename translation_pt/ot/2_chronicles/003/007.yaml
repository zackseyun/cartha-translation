base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/007.yaml
  text: He overlaid the house with gold—the beams[a], the thresholds, its walls[d][c][b], and its doors—and he engraved cherubim on the walls.
translation:
  language: pt
  text: Ele revestiu de ouro o templo[a] — suas vigas[b], suas soleiras[c], suas paredes e suas portas — e gravou[d] querubins nas paredes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a casa”, designação comum do templo.'
    reason: lexical_alternative
  - marker: b
    text: Ou “caibros”.
    reason: lexical_alternative
  - marker: c
    text: O termo hebraico também pode designar umbrais ou partes estruturais das entradas.
    reason: lexical_alternative
  - marker: d
    text: Ou “entalhou”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַף
  choice: revestiu de ouro
  rationale: O verbo descreve a cobertura de uma estrutura com uma camada de determinado material; “revestiu de ouro” é natural e preciso neste contexto arquitetônico.
- source_word: הַבַּיִת
  choice: o templo
  rationale: Embora o hebraico diga literalmente “a casa”, no contexto a referência é ao edifício do templo. “O templo” comunica isso com clareza, enquanto a nota preserva a expressão literal.
- source_word: הַקֹּרוֹת
  choice: suas vigas
  rationale: O substantivo designa peças estruturais de madeira sem especificar necessariamente caibros; “vigas” mantém essa amplitude.
- source_word: הַסִּפִּים
  choice: suas soleiras
  rationale: O termo pode indicar as partes inferiores ou estruturais das entradas. “Soleiras” é a opção arquitetônica mais provável, sem ocultar outras possibilidades na nota.
- source_word: קִירוֹתָיו
  choice: suas paredes
  rationale: Tradução direta do plural com sufixo de terceira pessoa masculina singular, cujo referente é o templo.
- source_word: דַלְתוֹתָיו
  choice: suas portas
  rationale: Forma clara e corrente para os painéis ou folhas das portas.
- source_word: זָהָב
  choice: de ouro
  rationale: Em português, a construção idiomática “revestir de ouro” expressa adequadamente o material aplicado a todos os elementos enumerados.
- source_word: וּפִתַּח
  choice: e gravou
  rationale: O verbo indica a execução de figuras por incisão ou entalhe. “Gravou” se ajusta bem à ornamentação feita nas superfícies das paredes.
- source_word: כְּרוּבִים
  choice: querubins
  rationale: Preserva o termo bíblico e cultual tradicional, evitando a associação moderna de “querubins” com figuras infantis decorativas.
- source_word: עַל הַקִּירוֹת
  choice: nas paredes
  rationale: A preposição indica a superfície ou localização da decoração; “nas paredes” é a formulação natural em português.
