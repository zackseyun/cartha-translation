  text: וְ/הִנֵּה֙ דִּבְרֵ֣י אָסָ֔א הָ/רִאשׁוֹנִ֖ים וְ/הָ/אַחֲרוֹנִ֑ים הִנָּ֤/ם כְּתוּבִים֙ עַל סֵ֣פֶר הַ/מְּלָכִ֔ים לִ/יהוּדָ֖ה וְ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/011.yaml
  text: Behold[a], the acts of Asa, the first and the last, behold, they are written in the Book of the Kings of Judah and Israel.
translation:
  language: pt
  text: Eis[a] que os atos de Asa, os primeiros e os últimos, estão escritos no Livro dos Reis de Judá e de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “os feitos ou assuntos de Asa, os primeiros e os últimos”. A expressão se refere aos atos de Asa ao longo de todo o seu reinado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Eis
  rationale: Preserva a força de chamada de atenção do hebraico na abertura da nota conclusiva; a conjunção é naturalmente absorvida pelo fluxo em português.
- source_word: דִּבְרֵי אָסָא
  choice: os atos de Asa
  rationale: Na fórmula historiográfica régia, דְּבָרִים abrange feitos, acontecimentos e assuntos relativos ao rei, não apenas palavras pronunciadas.
- source_word: הָרִאשׁוֹנִים וְהָאַחֲרוֹנִים
  choice: os primeiros e os últimos
  rationale: Mantém a forma pareada do hebraico e expressa os atos de todo o período do reinado sem substituir a formulação por uma paráfrase.
- source_word: הִנָּם כְּתוּבִים
  choice: estão escritos
  rationale: Reproduz com naturalidade a afirmação de que os atos constam de uma fonte escrita; não se repete 'eis' porque isso seria pesado e pouco natural em português.
- source_word: עַל סֵפֶר
  choice: no Livro
  rationale: Embora עַל possa significar literalmente 'sobre', nesta fórmula de referência documental o português idiomático pede 'no'.
- source_word: הַמְּלָכִים לִיהוּדָה וְיִשְׂרָאֵל
  choice: dos Reis de Judá e de Israel
  rationale: É a tradução transparente do título da fonte, sem ampliar interpretativamente para 'anais' ou 'registros reais'.
