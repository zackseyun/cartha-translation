  text: And when Baasha heard it[a], he stopped building Ramah and ceased his work.
translation:
  language: pt
  text: Quando Baasa soube disso, parou de construir[a] Ramá e interrompeu o seu trabalho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «parou de fortificar Ramá»; o hebraico pode se referir à interrupção da construção ou das obras de fortificação em Ramá.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Quando ... soube disso
  rationale: A construção hebraica introduz uma oração temporal. Em português natural, «Quando» comunica a sequência sem reproduzir de modo rígido «e aconteceu que». «Disso» explicita idiomaticamente o conteúdo ouvido, fornecido pelo contexto anterior.
- source_word: בַּעְשָׁא
  choice: Baasa
  rationale: Transliteração portuguesa corrente do nome pessoal hebraico.
- source_word: וַיֶּחְדַּל מִבְּנוֹת
  choice: parou de construir
  rationale: O verbo חדל seguido de מן e infinitivo indica a cessação de uma atividade; «parou de construir» é claro e natural em português moderno.
- source_word: אֶת הָרָמָה
  choice: Ramá
  rationale: O termo é aqui o nome da localidade. Como objeto de «construir», pode envolver construir ou reforçar suas estruturas defensivas, ambiguidade preservada no texto e esclarecida em nota.
- source_word: וַיַּשְׁבֵּת
  choice: interrompeu
  rationale: O hifil de שבת significa fazer cessar ou pôr fim. «Interrompeu» expressa naturalmente a ação sobre o objeto «seu trabalho», evitando uma repetição estilisticamente pesada de «parou».
- source_word: מְלַאכְתּוֹ
  choice: o seu trabalho
  rationale: מלאכה designa trabalho, labor ou atividade; «o seu trabalho» mantém a amplitude lexical e se ajusta ao projeto de construção mencionado.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem temporal do hebraico foi preservada sem o hebraísmo rígido «e aconteceu que»; a possível nuance militar de בנה aplicada à cidade foi mantida em nota.
