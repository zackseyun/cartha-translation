base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/006.yaml
  text: Then King Asa took all Judah[a], and they carried away the stones of Ramah and its timber, with which Baasha had built[b], and he built with them Geba and Mizpah.
translation:
  language: pt
  text: Então, o rei Asa mobilizou todo o Judá[a], e eles levaram as pedras de Ramá e a sua madeira, que Baasa havia usado para construí-la. Com esses materiais, Asa construiu Geba e Mispá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “tomou todo o Judá”; isto é, convocou ou mobilizou o povo de Judá.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקַח אֶת כָּל יְהוּדָה
  choice: mobilizou todo o Judá
  rationale: Embora literalmente seja “tomou todo o Judá”, no contexto a expressão indica que Asa convocou ou mobilizou a população de Judá para realizar o trabalho. A tradução comunica naturalmente o sentido idiomático em português.
- source_word: וַיִּשְׂאוּ
  choice: eles levaram
  rationale: O verbo נשׂא indica aqui levantar e transportar os materiais retirados de Ramá. “Levaram” é claro e natural em português.
- source_word: אַבְנֵי הָרָמָה
  choice: as pedras de Ramá
  rationale: A cadeia construta associa as pedras à construção existente em Ramá. “De Ramá” preserva essa relação sem precisar defini-la apenas como origem geográfica.
- source_word: עֵצֶיהָ
  choice: a madeira
  rationale: O substantivo designa a madeira usada como material de construção; em português, o singular coletivo “a madeira” é mais natural do que uma reprodução pronominal de “sua madeira”.
- source_word: אֲשֶׁר בָּנָה בַּעְשָׁא
  choice: que Baasa havia usado na construção
  rationale: A oração relativa se refere naturalmente às pedras e à madeira que Baasa usara para construir em Ramá. A formulação evita a impressão de que Baasa teria construído os próprios materiais.
- source_word: וַיִּבֶן בָּהֶם
  choice: Com esses materiais, Asa construiu
  rationale: O singular tem Asa como sujeito, e o pronome plural retoma as pedras e a madeira. A explicitação do nome e de “materiais” produz clareza sem acrescentar a ideia não expressa de “fortificar”.
- source_word: גֶּבַע
  choice: Geba
  rationale: Forma tradicional e reconhecível do topônimo hebraico em português.
- source_word: הַמִּצְפָּה
  choice: Mispá
  rationale: Forma tradicional do topônimo em português; o artigo hebraico não precisa ser reproduzido diante do nome próprio.
