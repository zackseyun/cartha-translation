base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/001.yaml
  text: In the thirty-sixth year of Asa’s reign[a], Baasha king of Israel went up against Judah and built up Ramah, so as not to allow anyone to go out or come in to Asa king of Judah.
translation:
  language: pt
  text: No trigésimo sexto ano do reinado de Asa[a], Baasa, rei de Israel, avançou contra Judá e construiu Ramá, para não deixar ninguém sair nem entrar para Asa, rei de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “no trigésimo sexto ano do reinado de Asa”. Isso cria uma tensão cronológica com a linha do tempo de Baasa em 1 Reis. Alguns entendem que a contagem começa na divisão do reino; outros propõem uma alteração textual para harmonizar as cronologias.'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּשְׁנַת שְׁלֹשִׁים וָשֵׁשׁ
  choice: No trigésimo sexto ano
  rationale: A construção temporal com ב é expressa de modo natural e fiel em português.
- source_word: לְמַלְכוּת אָסָא
  choice: do reinado de Asa
  rationale: מַלְכוּת designa aqui o período de governo real; “reinado” é claro e preserva a referência cronológica.
- source_word: עָלָה ... עַל יְהוּדָה
  choice: avançou contra Judá
  rationale: Em contexto militar, עלה com עַל indica movimento hostil contra um território; “avançou contra” comunica isso sem acrescentar detalhes não explícitos.
- source_word: וַיִּבֶן אֶת הָרָמָה
  choice: e construiu Ramá
  rationale: בנה significa literalmente “construir”. Embora o contexto possa sugerir obras defensivas, evita-se explicitar “fortificou” no texto principal.
- source_word: לְבִלְתִּי תֵּת
  choice: para não deixar
  rationale: A construção expressa propósito preventivo; esta formulação é natural no português atual.
- source_word: יוֹצֵא וָבָא
  choice: ninguém sair nem entrar
  rationale: Preserva o par hebraico de movimentos opostos e comunica restrição de circulação.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: em relação a Asa, rei de Judá
  rationale: O ל marca uma relação ou direção cuja extensão exata é ambígua; a formulação evita limitar indevidamente o sentido apenas ao acesso “a” Asa.
theological_decisions:
- issue: Tensão cronológica com a cronologia do reinado de Baasa em 1 Reis
  choice: Manter no texto principal “No trigésimo sexto ano do reinado de Asa”
  alternative: Contar o trigésimo sexto ano desde a divisão do reino ou adotar a emenda harmonizadora “vigésimo sexto ano”
  rationale: O texto massorético diz claramente “no trigésimo sexto ano ... do reinado de Asa”. A tradução preserva essa leitura e registra a dificuldade em nota, sem emendar nem harmonizar silenciosamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O texto conserva a ambiguidade da preposição final e a tensão cronológica do hebraico.
