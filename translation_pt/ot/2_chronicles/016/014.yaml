source:
  edition: WLC
  text: וַ/יִּקְבְּרֻ֣/הוּ בְ/קִבְרֹתָ֗י/ו אֲשֶׁ֣ר כָּֽרָה ל/וֹ֮ בְּ/עִ֣יר דָּוִיד֒ וַ/יַּשְׁכִּיבֻ֗/הוּ בַּ/מִּשְׁכָּב֙ אֲשֶׁ֤ר מִלֵּא֙ בְּשָׂמִ֣ים וּ/זְנִ֔ים מְרֻקָּחִ֖ים בְּ/מִרְקַ֣חַת מַעֲשֶׂ֑ה וַ/יִּשְׂרְפוּ ל֥/וֹ שְׂרֵפָ֖ה גְּדוֹלָ֥ה עַד לִ/מְאֹֽד־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/014.yaml
  text: They buried him in his tomb[a], which he had cut out for himself in the City of David, and laid him on the bier that had been filled with spices and various blended ointments prepared by a perfumer’s craft[b]; and they made a very great burning for him.
translation:
  language: pt
  text: Sepultaram-no em seu túmulo[a], que ele havia escavado para si na Cidade de Davi, e o deitaram num leito[b] que ele havia enchido de especiarias e de várias misturas aromáticas, preparadas segundo a arte dos perfumistas; e fizeram para ele uma queima muito grande.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz literalmente “em suas sepulturas” ou “em seus túmulos”, possivelmente em referência a um complexo funerário.
    reason: lexical_alternative
  - marker: b
    text: Ou “cama” ou “divã”; neste contexto, provavelmente um leito funerário.
    reason: lexical_alternative
  - marker: c
    text: A queima provavelmente fazia parte das honras fúnebres e pode ter envolvido especiarias ou outras substâncias aromáticas. O hebraico não afirma que o corpo tenha sido cremado.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְבְּרֻהוּ בְקִבְרֹתָיו
  choice: Sepultaram-no em seu túmulo
  rationale: O verbo קבר indica sepultar. Embora o substantivo esteja formalmente no plural, o contexto aponta para o túmulo ou complexo funerário preparado para Asa; o singular coletivo produz português natural, e a forma hebraica é registrada em nota.
- source_word: אֲשֶׁר כָּרָה לוֹ
  choice: que ele havia escavado para si
  rationale: כרה significa cavar ou escavar. “Escavado” serve tanto para uma sepultura aberta no solo quanto para uma câmara cortada na rocha, sem especificar além do texto.
- source_word: בְּעִיר דָּוִיד
  choice: na Cidade de Davi
  rationale: Forma consagrada e transparente do topônimo.
- source_word: וַיַּשְׁכִּיבֻהוּ בַּמִּשְׁכָּב
  choice: Deitaram-no num leito
  rationale: O hifil de שכב expressa fazer alguém deitar ou colocar deitado. מִשְׁכָּב é literalmente um lugar onde se deita, podendo ser leito, cama ou, neste contexto, leito funerário; a nota preserva essa amplitude.
- source_word: אֲשֶׁר מִלֵּא
  choice: que ele havia enchido
  rationale: O hebraico traz um perfeito masculino singular, naturalmente associado a Asa como sujeito. A tradução mantém essa forma em vez de convertê-la silenciosamente em passiva.
- source_word: בְּשָׂמִים וּזְנִים
  choice: de especiarias e de várias misturas aromáticas
  rationale: בְּשָׂמִים designa substâncias aromáticas. וּזְנִים é raro e parece indicar tipos ou variedades; “várias misturas aromáticas” comunica a provável referência sem afirmar que fossem especificamente unguentos.
- source_word: מְרֻקָּחִים בְּמִרְקַחַת מַעֲשֶׂה
  choice: preparadas segundo a arte dos perfumistas
  rationale: רקח pertence ao campo da composição de perfumes e preparados aromáticos. A expressão ressalta trabalho especializado; o plural “perfumistas” é genérico em português e não pretende alterar o número do referente hebraico.
- source_word: וַיִּשְׂרְפוּ לוֹ שְׂרֵפָה גְּדוֹלָה עַד לִמְאֹד
  choice: e fizeram em sua honra uma queima extraordinariamente grande
  rationale: A construção usa o verbo “queimar” e o substantivo cognato “queima”, com לֹו indicando que foi feita para ele ou em sua honra. A formulação permanece próxima do idioma hebraico sem transformar a cerimônia explicitamente em cremação.
theological_decisions:
- issue: Natureza da grande queima funerária
  choice: Manter “queima” como rito realizado em honra de Asa, sem dizer que o corpo foi cremado.
  alternative: Interpretar como cremação do corpo ou explicitar no texto que foram queimados perfumes e especiarias.
  rationale: O relato afirma primeiro que Asa foi sepultado e depois menciona uma grande queima feita para ele. Isso favorece uma queima funerária honorífica, possivelmente de substâncias aromáticas, mas o objeto queimado não é expresso. O texto principal conserva essa indeterminação, e a nota esclarece as possibilidades.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com colocação pronominal natural em registro bíblico moderado. “Misturas aromáticas” evita o tecnicismo excessivo e reconhece a incerteza do termo raro וּזְנִים. As notas preservam o plural formal de “túmulos”, a amplitude de מִשְׁכָּב e a ambiguidade cultural da queima funerária.
