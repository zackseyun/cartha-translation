base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/013.yaml
  text: And Asa slept with his fathers and died in the forty-first year of his reign[a].
translation:
  language: pt
  text: Asa adormeceu com seus antepassados e morreu no quadragésimo primeiro ano de seu reinado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “deitou-se com seus pais”, expressão tradicional para a morte e o sepultamento entre os antepassados.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: descansou
  rationale: No contexto da fórmula régia de morte, «descansou» comunica naturalmente o eufemismo hebraico sem duplicar de modo estranho o verbo explícito «morreu» que vem em seguida.
- source_word: עִם אֲבֹתָיו
  choice: com seus antepassados
  rationale: «Antepassados» expressa com clareza moderna o sentido familiar e dinástico de אבות nesta fórmula tradicional.
- source_word: וַיָּמָת
  choice: morreu
  rationale: Mantém a declaração explícita de morte presente no hebraico, além do eufemismo anterior.
- source_word: בִּשְׁנַת אַרְבָּעִים וְאַחַת
  choice: no quadragésimo primeiro ano
  rationale: Representa de forma natural em português o valor ordinal da fórmula hebraica de datação régia.
- source_word: לְמָלְכוֹ
  choice: de seu reinado
  rationale: É o equivalente idiomático e preciso para o período em que Asa reinou.
- source_word: אָסָא
  choice: Asa
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
