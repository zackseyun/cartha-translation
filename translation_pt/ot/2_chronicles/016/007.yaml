  text: וּ/בָ/עֵ֣ת הַ/הִ֗יא בָּ֚א חֲנָ֣נִי הָ/רֹאֶ֔ה אֶל אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה וַ/יֹּ֣אמֶר אֵלָ֗י/ו בְּ/הִשָּׁ֨עֶנְ/ךָ֜ עַל מֶ֤לֶךְ אֲרָם֙ וְ/לֹ֤א נִשְׁעַ֨נְתָּ֙ עַל יְהוָ֣ה אֱלֹהֶ֔י/ךָ עַל כֵּ֗ן נִמְלַ֛ט חֵ֥יל מֶֽלֶךְ אֲרָ֖ם מִ/יָּדֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/007.yaml
  text: At that time Hanani the seer came to Asa king of Judah and said to him[a], “Because you relied on the king of Aram and did not rely on Yahweh your God, therefore the army of the king of Aram has escaped from your hand.”
translation:
  language: pt
  text: 'Naquele tempo, Hanani, o vidente, veio a Asa, rei de Judá, e lhe disse: “Porque você confiou no rei de Arã[a] e não confiou em Yahweh, seu Deus, por isso o exército do rei de Arã escapou das suas mãos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Síria”. O hebraico diz “Arã”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָעֵת הַהִיא
  choice: Naquele tempo
  rationale: Expressa de modo natural o marco temporal hebraico; a conjunção inicial é absorvida na fluidez narrativa em português.
- source_word: הָרֹאֶה
  choice: o vidente
  rationale: Preserva o título profético específico רֹאֶה, relacionado a 'profeta', mas lexicalmente distinto.
- source_word: בְּהִשָּׁעֶנְךָ ... וְלֹא נִשְׁעַנְתָּ
  choice: Por você ter confiado ... em vez de confiar
  rationale: Comunica a ideia de dependência política e religiosa e mantém a repetição do mesmo verbo hebraico de modo natural em português.
- source_word: מֶלֶךְ אֲרָם
  choice: rei de Arã
  rationale: Mantém o nome geográfico presente no hebraico, em vez de substituí-lo pelo equivalente histórico posterior 'Síria'.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, seu Deus
  rationale: Translitera o nome divino explícito no texto e reproduz naturalmente a relação possessiva.
- source_word: חֵיל מֶלֶךְ אֲרָם
  choice: o exército do rei de Arã
  rationale: Neste contexto, חֵיל designa a força militar do rei; 'exército' é claro e corrente.
- source_word: נִמְלַט ... מִיָּדֶךָ
  choice: escapou das suas mãos
  rationale: Reproduz tanto o resultado consumado expresso pelo verbo quanto a imagem hebraica de perda de domínio ou captura, inteligível em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o Tetragrama; 'Yahweh' preserva o nome pessoal divino sem substituí-lo por um título.
- issue: Relação entre a confiança no rei de Arã e a falta de confiança em Yahweh
  choice: em vez de confiar
  alternative: e não confiou
  rationale: A formulação explicita a contraposição já presente no hebraico sem acrescentar uma conclusão doutrinária; a acusação mantém seu caráter político e teológico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação destaca os apostos sem tornar a frase excessivamente formal; a expressão idiomática 'das suas mãos' preserva a imagem do original.
