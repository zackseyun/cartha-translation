revisions:
- from: 'Naquele tempo, Hanani, o vidente, foi até Asa, rei de Judá, e lhe disse: “Por você ter confiado no rei de Arã[a], em vez de confiar em Yahweh, seu Deus, o exército do rei de Arã escapou das suas mãos.”'
  to: 'Naquele tempo, Hanani, o vidente, veio a Asa, rei de Judá, e lhe disse: “Porque você confiou no rei de Arã[a] e não confiou em Yahweh, seu Deus, por isso o exército do rei de Arã escapou das suas mãos.”'
  rationale: A revisão restaura a negação explícita e a repetição de «confiar», explicita a consequência indicada por עַל כֵּן e aproxima o verbo narrativo de seu sentido hebraico, sem alterar o registro nem a terminologia adotada.
