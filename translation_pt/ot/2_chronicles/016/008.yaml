base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/008.yaml
  text: Were not the Cushites and the Lubites a very great army[a], with chariots and horsemen in great abundance? Yet when you relied on Yahweh, he gave them into your hand.
translation:
  language: pt
  text: Acaso os cuxitas e os lubitas não formavam um exército muito numeroso,[a] com muitíssimos carros de guerra e cavaleiros? Contudo, quando você se apoiou em Yahweh, ele os entregou em sua mão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os etíopes e os líbios”. Os nomes hebraicos foram vertidos aqui como “cuxitas” e “lubitas” para permanecer próximos dos etnônimos do texto-fonte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Acaso ... não
  rationale: Introduz uma pergunta retórica que espera resposta afirmativa e preserva sua força natural em português.
- source_word: הַכּוּשִׁים
  choice: os cuxitas
  rationale: Translitera o etnônimo hebraico em vez de identificá-lo de modo potencialmente anacrônico com os etíopes.
- source_word: וְהַלּוּבִים
  choice: e os lubitas
  rationale: Mantém proximidade com o etnônimo hebraico; 'líbios' é uma identificação contextual possível, mas menos cautelosa.
- source_word: הָיוּ לְחַיִל לָרֹב
  choice: formavam um exército muito numeroso
  rationale: חַיִל designa aqui uma força militar, e לָרֹב destaca seu grande número. A formulação é clara e idiomática em português.
- source_word: לְרֶכֶב וּלְפָרָשִׁים לְהַרְבֵּה מְאֹד
  choice: com muitíssimos carros de guerra e cavaleiros
  rationale: Expressa de maneira natural a quantidade extremamente grande dos recursos militares, mantendo a imagem concreta dos cavaleiros.
- source_word: וּבְהִשָּׁעֶנְךָ עַל
  choice: Contudo, quando você se apoiou em
  rationale: A locução indica a circunstância da vitória; 'apoiou-se em' preserva a metáfora hebraica de dependência, e 'contudo' evidencia o contraste argumentativo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Reproduz o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: נְתָנָם בְּיָדֶךָ
  choice: ele os entregou nas suas mãos
  rationale: Conserva o conhecido idioma hebraico que descreve a concessão de vitória sobre inimigos, em forma compreensível em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; 'Yahweh' preserva o nome pessoal e corresponde melhor à vocalização historicamente provável.
- issue: Relação entre confiança e vitória
  choice: quando você se apoiou em Yahweh
  alternative: porque você confiou em Yahweh
  rationale: A construção hebraica apresenta claramente a confiança como circunstância da vitória, sem exigir que a tradução explicite uma relação causal mais forte do que a forma gramatical.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantém-se a pergunta retórica, a metáfora de apoiar-se em Yahweh e o idioma concreto de entregar nas mãos.
