  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י יְהוָ֗ה עֵינָ֞י/ו מְשֹׁטְט֤וֹת בְּ/כָל הָ/אָ֨רֶץ֙ לְ֠/הִתְחַזֵּק עִם לְבָבָ֥/ם שָׁלֵ֛ם אֵלָ֖י/ו נִסְכַּ֣לְתָּ עַל זֹ֑את כִּ֣י מֵ/עַ֔תָּה יֵ֥שׁ עִמְּ/ךָ֖ מִלְחָמֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/009.yaml
  text: For the eyes of Yahweh range throughout all the earth to strengthen those whose heart is wholly toward him[a]. You have acted foolishly in this; for from now on you will have wars.
translation:
  language: pt
  text: Pois os olhos de Yahweh percorrem toda a terra para fortalecer aqueles cujo coração é inteiramente dedicado a ele.[a] Nisso você agiu de modo insensato; por isso, de agora em diante, você terá guerras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para mostrar-se forte em favor daqueles cujo coração é íntegro para com ele”.'
    reason: Alternativa lexical que preserva o possível sentido reflexivo de לְהִתְחַזֵּק e o valor de inteireza de שָׁלֵם.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino pessoal do texto hebraico por transliteração amplamente reconhecível.
- source_word: עֵינָיו מְשֹׁטְטוֹת
  choice: os olhos de Yahweh percorrem
  rationale: Mantém a imagem antropomórfica e comunica de modo natural o movimento ativo expresso pelo particípio.
- source_word: בְּכָל הָאָרֶץ
  choice: toda a terra
  rationale: O dito tem alcance universal; 'terra' é preferível a 'país' neste contexto.
- source_word: לְהִתְחַזֵּק עִם
  choice: para fortalecer
  rationale: Expressa o propósito beneficente da ação divina; a alternativa reflexiva 'mostrar-se forte em favor de' também é possível e foi preservada em nota.
- source_word: לְבָבָם שָׁלֵם אֵלָיו
  choice: aqueles cujo coração é inteiramente dedicado a ele
  rationale: Comunica lealdade integral e indivisa, sem sugerir perfeição moral absoluta; o singular coletivo 'coração' acompanha de perto o hebraico.
- source_word: נִסְכַּלְתָּ
  choice: você agiu de modo insensato
  rationale: Reproduz com clareza e dignidade a censura profética.
- source_word: עַל זֹאת
  choice: Nisso
  rationale: Retoma de forma concisa a conduta de Asa mencionada no contexto.
- source_word: כִּי מֵעַתָּה
  choice: por isso, de agora em diante
  rationale: Neste contexto, כִּי liga a consequência à insensatez anterior, e מֵעַתָּה marca seu início temporal.
- source_word: יֵשׁ עִמְּךָ מִלְחָמוֹת
  choice: você terá guerras
  rationale: Vertimento idiomático da construção existencial hebraica com sentido futuro após 'de agora em diante'.
theological_decisions:
- issue: Sentido de שָׁלֵם aplicado ao coração diante de Yahweh
  choice: lealdade integral e indivisa
  alternative: coração irrepreensível ou perfeito diante dele
  rationale: O contexto contrapõe confiar em Yahweh a confiar em poder humano; portanto, o termo aponta para devoção completa, não para impecabilidade.
- issue: Alcance de הָאָרֶץ
  choice: toda a terra
  alternative: todo o país
  rationale: A formulação tem tom geral e ressalta a vigilância universal de Yahweh, embora 'terra' possa em outros contextos designar um território.
- issue: Agente beneficiário em לְהִתְחַזֵּק עִם
  choice: Yahweh fortalece os que lhe são integralmente dedicados
  alternative: Yahweh se mostra forte em favor deles
  rationale: Ambas as leituras preservam a ação poderosa e favorável de Yahweh; a principal é mais direta em português, e a alternativa mantém o valor reflexivo possível do verbo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A segunda pessoa foi vertida por “você”, forma corrente no português brasileiro, sem perder a solenidade da repreensão profética.
