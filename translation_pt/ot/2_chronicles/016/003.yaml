base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/003.yaml
  text: There is a treaty between me and you[a], and between my father and your father. Look, I have sent you silver and gold. Go, break your treaty with Baasha king of Israel[b], so that he may withdraw from me.
translation:
  language: pt
  text: “Há um tratado entre mim e você[a], e entre meu pai e seu pai. Veja, enviei a você prata e ouro. Vá, rompa seu tratado com Baasa, rei de Israel, para que ele se retire de mim[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aliança” ou “pacto” em lugar de “tratado” (hebraico בְּרִית); aqui o contexto é um acordo político entre reis.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “e suba de sobre mim”; no contexto, a expressão provavelmente significa que Baasa retiraria de Asa sua pressão ou ação militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרִית
  choice: tratado
  rationale: No contexto diplomático entre reis, “tratado” comunica naturalmente um pacto político e permite manter o mesmo termo nas duas ocorrências.
- source_word: בֵּינִי וּבֵינֶךָ וּבֵין אָבִי וּבֵין אָבִיךָ
  choice: entre mim e você, e entre meu pai e seu pai
  rationale: Preserva o paralelismo e a repetição explícita de “entre” na fórmula diplomática hebraica.
- source_word: הִנֵּה
  choice: Veja
  rationale: Chama a atenção para o envio da prata e do ouro em linguagem moderna e digna.
- source_word: שָׁלַחְתִּי לְךָ כֶּסֶף וְזָהָב
  choice: enviei a você prata e ouro
  rationale: Expressa de modo direto o perfeito hebraico como ação realizada e relevante para o pedido.
- source_word: לֵךְ הָפֵר
  choice: Vá, rompa
  rationale: Mantém os dois imperativos; “romper um tratado” é expressão idiomática clara em português.
- source_word: בְּרִיתְךָ אֶת־בַּעְשָׁא
  choice: seu tratado com Baasa
  rationale: Traduz naturalmente a relação pactuada indicada pelo hebraico.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: rei de Israel
  rationale: Mantém diretamente o título régio.
- source_word: וְיַעֲלֶה מֵעָלָי
  choice: para que ele se retire de cima de mim
  rationale: Preserva na tradução principal a imagem incomum do hebraico, enquanto a nota esclarece seu provável sentido militar e político.
