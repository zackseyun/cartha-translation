id: 2CH.16.2
reference: 2 Chronicles 16:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּצֵ֨א אָסָ֜א כֶּ֣סֶף וְ/זָהָ֗ב מֵ/אֹֽצְר֛וֹת בֵּ֥ית יְהוָ֖ה וּ/בֵ֣ית הַ/מֶּ֑לֶךְ וַ/יִּשְׁלַ֗ח אֶל בֶּן הֲדַד֙ מֶ֣לֶךְ אֲרָ֔ם הַ/יּוֹשֵׁ֥ב בְּ/דַרְמֶ֖שֶׂק לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/002.yaml
  text: Then Asa brought out silver and gold from the treasuries of the house of Yahweh and of the king’s house[a], and sent them to Ben-hadad king of Aram, who lived in Damascus, saying,
translation:
  language: pt
  text: 'Então Asa retirou prata e ouro dos tesouros da casa de Yahweh e da casa do rei e os enviou a Ben-Hadade, rei de Arã[a], que morava em Damasco, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Arã”; tradicionalmente, “Síria”.'
    reason: Registra a alternativa lexical tradicional sem substituir no texto principal o nome geográfico presente no hebraico.
lexical_decisions:
- source_word: וַיֹּצֵא
  choice: retirou
  rationale: O hifil de יצא indica fazer sair; no contexto de bens guardados em tesouros, “retirou” expressa a ação concreta com naturalidade em português.
- source_word: כֶּסֶף וְזָהָב
  choice: prata e ouro
  rationale: Mantém os dois metais especificados no hebraico, sem generalizá-los como dinheiro ou riquezas.
- source_word: מֵאֹצְרוֹת
  choice: dos tesouros
  rationale: Preserva o plural hebraico e designa os depósitos de bens valiosos do templo e do rei.
- source_word: בֵּית יְהוָה
  choice: da casa de Yahweh
  rationale: Conserva a imagem literal de “casa” e representa diretamente o nome divino יהוה como Yahweh.
- source_word: וּבֵית הַמֶּלֶךְ
  choice: e da casa do rei
  rationale: Preserva a repetição de בֵּית e o paralelismo com “casa de Yahweh”, sem substituir a expressão por “palácio”.
- source_word: וַיִּשְׁלַח
  choice: e os enviou
  rationale: O pronome retoma naturalmente “prata e ouro”; embora implícito no hebraico, é necessário para uma leitura fluente em português.
- source_word: אֶל בֶּן הֲדַד
  choice: a Ben-Hadade
  rationale: Translitera o nome pessoal de forma reconhecível e corrente em português bíblico.
- source_word: מֶלֶךְ אֲרָם
  choice: rei de Arã
  rationale: Mantém o nome histórico-geográfico hebraico Aram, em sua forma portuguesa Arã, em vez da equivalência tradicional “Síria”.
- source_word: הַיּוֹשֵׁב בְּדַרְמֶשֶׂק
  choice: que morava em Damasco
  rationale: Traduz o particípio de maneira natural, preservando a ideia de residência habitual.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Mantém a fórmula narrativa que introduz o discurso direto no versículo seguinte.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio; “Yahweh” preserva diretamente o nome da aliança sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa fluente. A repetição “casa de Yahweh” e “casa do rei” foi mantida por refletir a estrutura e o contraste do hebraico. O marcador da nota foi colocado junto a “Arã”, termo ao qual a nota efetivamente se refere.
source_grounding:
  english_pob_role: consult_only
