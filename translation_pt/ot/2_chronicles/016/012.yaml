base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/012.yaml
  text: In the thirty-ninth year of his reign[a], Asa became diseased in his feet; his disease became very severe. Yet even in his disease he did not seek Yahweh, but the physicians.
translation:
  language: pt
  text: No trigésimo nono ano de seu reinado, Asa ficou doente dos pés, e sua doença se tornou extremamente grave. Mesmo durante sua doença, ele não buscou Yahweh, mas recorreu aos médicos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não consultou Yahweh, mas os médicos”. A oração hebraica é elíptica e contrapõe a busca por Yahweh ao recurso aos médicos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱלֶא
  choice: ficou doente
  rationale: Expressa de modo natural o sentido de חלה, que indica adoecer ou ficar debilitado, sem acrescentar um diagnóstico não presente no hebraico.
- source_word: בְּרַגְלָיו
  choice: dos pés
  rationale: רֶגֶל pode designar pé ou perna. “Pés” é a correspondência mais direta e preserva a localização corporal sem ampliar o sentido.
- source_word: עַד לְמַעְלָה
  choice: extremamente grave
  rationale: A expressão funciona aqui como intensificador da gravidade da doença, e não como indicação espacial de movimento para cima.
- source_word: חָלְיוֹ / בְּחָלְיוֹ
  choice: sua doença / durante sua doença
  rationale: “Doença” mantém a ligação lexical na repetição do substantivo. “Durante” torna natural em português o valor circunstancial da preposição no segundo uso.
- source_word: דָרַשׁ אֶת יְהוָה
  choice: não buscou Yahweh
  rationale: דרשׁ aplicado a Deus pode significar buscá-lo ou consultá-lo. “Buscar Yahweh” conserva o sentido amplo, relacional e religioso, sem reduzi-lo apenas a pedir cura.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: כִּי בָּרֹפְאִים
  choice: mas recorreu aos médicos
  rationale: A oração hebraica é elíptica, literalmente algo como “mas/nos médicos”. A formulação explicita em português a contraposição implícita sem sugerir que Asa estivesse procurando os próprios médicos.
theological_decisions:
- issue: Se o versículo condena o tratamento médico em si ou a omissão de Asa em buscar Deus
  choice: Preservar o contraste entre não buscar Yahweh e recorrer aos médicos, sem declarar que a medicina seja ilegítima em si mesma.
  alternative: Interpretar o texto como condenação geral de toda consulta ou tratamento médico.
  rationale: A censura explícita recai sobre Asa não ter buscado Yahweh. O contraste com os médicos deve permanecer, mas o hebraico não formula uma proibição universal da medicina.
- issue: Amplitude semântica de דרשׁ em relação a Yahweh
  choice: Usar “buscou”, que pode abranger procurar ajuda, orientação ou resposta divina.
  alternative: Usar apenas “consultou” ou “pediu cura a”, restringindo o ato a uma consulta ou solicitação médica específica.
  rationale: O verbo possui alcance mais amplo no contexto religioso e não especifica exatamente que tipo de auxílio Asa deveria ter procurado.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A repetição de “doença” acompanha o hebraico; “recorreu aos médicos” comunica a elipse da oração final sem transformar o versículo numa condenação explícita da medicina.
