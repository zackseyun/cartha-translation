base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/010.yaml
  text: Then Asa was angry with the seer and put him in the prison house[a], because he was in a rage with him over this[b]. And Asa brutally oppressed some of the people at that time.
translation:
  language: pt
  text: Então Asa ficou irado contra o vidente e o pôs na prisão[a], pois estava furioso com ele por causa disso. Naquele tempo, Asa oprimiu brutalmente[b] alguns do povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na casa dos troncos”; a expressão hebraica provavelmente se refere a um lugar de confinamento que envolvia imobilização.
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico também pode ser traduzido por “esmagou” ou “maltratou”; é um termo de sentido violento e indica abuso severo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְעַס
  choice: se indignou
  rationale: O verbo כעס expressa ira ou irritação; “se indignou” é natural, digno e introduz adequadamente a reação de Asa.
- source_word: הָרֹאֶה
  choice: o vidente
  rationale: רֹאֶה é a designação antiga e específica de alguém que recebe revelação; “vidente” preserva melhor o termo do que o mais amplo “profeta”.
- source_word: וַיִּתְּנֵהוּ
  choice: o pôs
  rationale: נתן, com pessoa e destino, tem aqui o sentido idiomático de colocar ou pôr alguém em determinado lugar.
- source_word: בֵּית הַמַּהְפֶּכֶת
  choice: na prisão
  rationale: A expressão difícil designa um lugar de confinamento, possivelmente associado a instrumentos de imobilização; “prisão” comunica com clareza sua função contextual, e a alternativa mais concreta fica na nota.
- source_word: בְזַעַף עִמּוֹ
  choice: estava furioso com ele
  rationale: זַעַף denota ira intensa; a formulação preserva a força emocional e soa natural em português moderno.
- source_word: עַל זֹאת
  choice: por causa disso
  rationale: Expressa de forma clara a relação causal com a repreensão imediatamente anterior.
- source_word: וַיְרַצֵּץ
  choice: oprimiu brutalmente
  rationale: No piel, רצץ comunica ação violenta, literalmente esmagar ou despedaçar. Aplicado a pessoas, indica maus-tratos ou opressão severa; “brutalmente” preserva essa intensidade sem sugerir necessariamente esmagamento físico literal.
- source_word: מִן הָעָם
  choice: alguns do povo
  rationale: A preposição מן tem sentido partitivo, indicando parte do povo, não toda a população.
- source_word: בָּעֵת הַהִיא
  choice: Naquele tempo
  rationale: Equivalente temporal corrente e natural em narrativa portuguesa.
theological_decisions: []
