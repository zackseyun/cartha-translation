  text: וַ/יִּשְׁמַ֨ע בֶּן הֲדַ֜ד אֶל הַ/מֶּ֣לֶךְ אָסָ֗א וַ֠/יִּשְׁלַח אֶת שָׂרֵ֨י הַ/חֲיָלִ֤ים אֲשֶׁר ל/וֹ֙ אֶל עָרֵ֣י יִשְׂרָאֵ֔ל וַ/יַּכּוּ֙ אֶת עִיּ֣וֹן וְ/אֶת דָּ֔ן וְ/אֵ֖ת אָבֵ֣ל מָ֑יִם וְ/אֵ֥ת כָּֽל מִסְכְּנ֖וֹת עָרֵ֥י נַפְתָּלִֽי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/004.yaml
  text: Ben-hadad listened to King Asa and sent the commanders of his armies against the cities of Israel[a], and they struck Ijon, Dan, Abel-maim, and all the store-cities of Naphtali.
translation:
  language: pt
  text: Ben-Hadade atendeu ao rei Asa e enviou os comandantes das suas tropas contra as cidades de Israel. Eles atacaram Ijom, Dã, Abel-Maim[a] e todas as cidades-armazém de Naftali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Abel-Maim é a forma encontrada aqui no texto hebraico; alguns a identificam com Abel-Bete-Maaca, conhecida de passagens paralelas.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: atendeu
  rationale: No contexto, Ben-Hadade não apenas ouviu Asa, mas respondeu favoravelmente ao seu pedido. “Atendeu” comunica ouvir e agir de acordo, sem sugerir subordinação como “obedeceu” poderia fazer.
- source_word: שָׂרֵי הַחֲיָלִים אֲשֶׁר לוֹ
  choice: os comandantes das suas tropas
  rationale: Expressa de modo natural tanto a liderança militar indicada por שָׂרֵי quanto a posse indicada por אֲשֶׁר לוֹ; “tropas” é claro e corrente.
- source_word: אֶל עָרֵי יִשְׂרָאֵל
  choice: contra as cidades de Israel
  rationale: A preposição, no contexto do envio de forças militares, indica o alvo da expedição.
- source_word: וַיַּכּוּ
  choice: atacaram
  rationale: O verbo נכה em narrativa militar pode significar golpear, atacar ou derrotar. “Atacaram” é natural e não afirma além do texto que as cidades foram definitivamente conquistadas.
- source_word: עִיּוֹן
  choice: Ijom
  rationale: Transliteração corrente em português para o topônimo hebraico.
- source_word: דָּן
  choice: Dã
  rationale: Forma tradicional e amplamente reconhecida em português para o topônimo.
- source_word: אָבֵל מָיִם
  choice: Abel-Maim
  rationale: Segue diretamente a leitura do texto hebraico, sem harmonizá-la com o nome encontrado em passagens paralelas.
- source_word: מִסְכְּנוֹת
  choice: cidades-armazém
  rationale: O termo designa localidades destinadas ao armazenamento de provisões ou bens. “Cidades-armazém” é conciso, inteligível e preserva a função específica dessas cidades.
- source_word: עָרֵי נַפְתָּלִי
  choice: de Naftali
  rationale: Mantém a relação do construto hebraico, indicando que essas cidades pertenciam ao território de Naftali.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas de nomes próprios reconhecíveis para leitores brasileiros e compreensão ampla no mundo lusófono. A frase foi dividida em dois períodos para melhorar a fluidez sem alterar a sequência narrativa. O marcador da nota foi colocado imediatamente após “Abel-Maim”, termo ao qual a nota se refere.
