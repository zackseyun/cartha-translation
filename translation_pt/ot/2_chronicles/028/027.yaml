  text: וַ/יִּשְׁכַּ֨ב אָחָ֜ז עִם אֲבֹתָ֗י/ו וַֽ/יִּקְבְּרֻ֤/הוּ בָ/עִיר֙ בִּ/יר֣וּשָׁלִַ֔ם כִּ֚י לֹ֣א הֱבִיאֻ֔/הוּ לְ/קִבְרֵ֖י מַלְכֵ֣י יִשְׂרָאֵ֑ל וַ/יִּמְלֹ֛ךְ יְחִזְקִיָּ֥הֽוּ בְנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/027.yaml
  text: And Ahaz lay down with his fathers[a], and they buried him in the city, in Jerusalem, for they did not bring him into the tombs of the kings of Israel. And Hezekiah his son reigned in his place.
translation:
  language: pt
  text: Acaz descansou com seus antepassados, e o sepultaram na cidade, em Jerusalém, pois não o levaram para os túmulos dos reis de Israel.[a] E seu filho Ezequias reinou em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “dos reis de Israel”. Como Acaz era rei de Judá, alguns entendem que a expressão se refere aos túmulos reais dos reis da dinastia de Davi, ou esperariam aqui “reis de Judá”.'
    reason: Preservar a leitura explícita do hebraico e, ao mesmo tempo, esclarecer a dificuldade contextual.
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: descansou com seus antepassados
  rationale: A expressão hebraica é uma fórmula tradicional de falecimento. “Descansou” conserva o caráter eufemístico sem sugerir apenas sono literal, e “antepassados” comunica naturalmente o sentido genealógico de אֲבֹתָיו em português atual.
- source_word: וַיִּקְבְּרֻהוּ
  choice: e o sepultaram
  rationale: Mantém a forma ativa do verbo hebraico na terceira pessoa do plural e soa digna e natural em um relato régio.
- source_word: בָעִיר בִּירוּשָׁלִַם
  choice: na cidade, em Jerusalém
  rationale: Preserva os dois elementos locativos do hebraico e a ênfase de que ele foi sepultado dentro da cidade, embora não nos túmulos reais.
- source_word: כִּי לֹא הֱבִיאֻהוּ
  choice: pois não o levaram
  rationale: כִּי introduz a razão da localização do sepultamento, e o verbo causativo de בוא conserva a imagem concreta de levar o corpo a determinado lugar.
- source_word: לְקִבְרֵי
  choice: para os túmulos
  rationale: No contexto de sepultamentos régios, “túmulos” expressa melhor os locais ou câmaras funerárias do que o termo mais genérico “sepulturas”.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: dos reis de Israel
  rationale: Reproduz o texto massorético sem substituí-lo pela leitura contextualmente esperada “reis de Judá”.
- source_word: וַיִּמְלֹךְ יְחִזְקִיָּהוּ בְנוֹ תַּחְתָּיו
  choice: E seu filho Ezequias reinou em seu lugar
  rationale: Mantém a fórmula de sucessão dinástica e usa as formas portuguesas tradicionais e amplamente reconhecidas dos nomes próprios.
theological_decisions:
- issue: Se “reis de Israel” deve ser normalizado para “reis de Judá”
  choice: Manter “reis de Israel” no texto principal
  alternative: reis de Judá; ou entender “Israel” em sentido amplo, referente ao povo da aliança e à monarquia davídica
  rationale: O texto hebraico recebido diz explicitamente “Israel”. Como Acaz era rei de Judá, há uma tensão histórica aparente, mas a tradução não deve corrigi-la silenciosamente. A nota informa a expectativa contextual sem alterar o texto-fonte.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe conserva a concisão do aviso régio hebraico, e a nota é colocada junto à expressão que efetivamente comenta.
