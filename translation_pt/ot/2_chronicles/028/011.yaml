base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/011.yaml
  text: Now listen to me[a], and return the captives whom you have taken from your brothers, for the burning anger of Yahweh is upon you.
translation:
  language: pt
  text: Agora, escutem-me e devolvam os cativos que vocês capturaram dentre os seus irmãos[a], pois a ira ardente de Yahweh está sobre vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dentre os seus compatriotas israelitas”. O hebraico diz “irmãos”, usando linguagem de parentesco para membros do mesmo povo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: Introduz uma transição urgente na exortação; o valor da conjunção é comunicado naturalmente pelo contexto.
- source_word: שְׁמָעוּנִי
  choice: escutem-me
  rationale: O imperativo com sufixo de primeira pessoa pede atenção e obediência; “escutem-me” é claro e corrente.
- source_word: וְהָשִׁיבוּ
  choice: façam voltar
  rationale: 'O hifil de שוב é causativo: ordena que os destinatários promovam o retorno dos cativos. A formulação preserva essa nuance sem definir um destino não expresso.'
- source_word: הַשִּׁבְיָה
  choice: os cativos
  rationale: O substantivo coletivo refere-se concretamente ao grupo de pessoas capturadas na guerra.
- source_word: אֲשֶׁר שְׁבִיתֶם
  choice: que vocês levaram
  rationale: A oração relativa identifica os cativos tomados pelos destinatários; “levaram” evita repetição pesada de “cativos/capturaram”.
- source_word: מֵאֲחֵיכֶם
  choice: dentre os seus irmãos
  rationale: Preserva a linguagem de parentesco de אָח e indica que os cativos provinham do próprio povo; a nota esclarece o sentido coletivo nacional.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão para a ordem, mantendo a ligação explicativa.
- source_word: חֲרוֹן אַף
  choice: a ira ardente
  rationale: Conserva a imagem hebraica do calor intenso da ira, em português digno e compreensível.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עֲלֵיכֶם
  choice: está sobre vocês
  rationale: Mantém a imagem da preposição על e deixa perceptível que a ira divina pesa sobre os destinatários.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama como nome próprio. “Yahweh” o representa diretamente sem substituí-lo por um título.
- issue: Alcance de “irmãos” em מֵאֲחֵיכֶם
  choice: irmãos, com esclarecimento em nota
  alternative: compatriotas; seus irmãos israelitas
  rationale: A tradução mantém a metáfora de parentesco e a solidariedade do povo da aliança, enquanto a nota evita que o termo seja entendido apenas como parentesco biológico ou exclusivamente masculino.
translation_notes:
  register: Português contemporâneo, digno e amplamente inteligível, com tratamento por “vocês”. A redação conserva a urgência do imperativo, a linguagem de parentesco e a metáfora da ira que está “sobre” os ouvintes.
