  text: וַ/יִּשְׁבּוּ֩ בְנֵֽי יִשְׂרָאֵ֨ל מֵֽ/אֲחֵי/הֶ֜ם מָאתַ֣יִם אֶ֗לֶף נָשִׁים֙ בָּנִ֣ים וּ/בָנ֔וֹת וְ/גַם שָׁלָ֥ל רָ֖ב בָּזְז֣וּ מֵ/הֶ֑ם וַ/יָּבִ֥יאוּ אֶת הַ/שָּׁלָ֖ל לְ/שֹׁמְרֽוֹן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/008.yaml
  text: And the sons of Israel took captive from their brothers two hundred thousand women[a], sons, and daughters. They also took much spoil from them and brought the spoil to Samaria.
translation:
  language: pt
  text: Os filhos de Israel levaram cativos, dentre os seus irmãos[a], duzentas mil mulheres, filhos e filhas. Também tomaram deles muitos despojos e levaram os despojos para Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dentre os seus parentes” ou “dentre os seus compatriotas israelitas”. O hebraico diz “dentre os seus irmãos”, ressaltando o parentesco comum.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: levaram cativos
  rationale: Expressa a captura de pessoas em contexto de guerra e conserva o movimento implícito de conduzi-las como prisioneiras.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a forma familiar do hebraico e reforça o contraste deliberado com “seus irmãos” no conflito entre povos aparentados.
- source_word: מֵאֲחֵיהֶם
  choice: dentre os seus irmãos
  rationale: Preserva a imagem de parentesco e seu peso moral; no contexto, “irmãos” pode abranger parentes ou compatriotas israelitas.
- source_word: מָאתַיִם אֶלֶף נָשִׁים בָּנִים וּבָנוֹת
  choice: duzentas mil mulheres, filhos e filhas
  rationale: Reproduz o número e os três grupos explicitamente enumerados, sem reduzir “filhos e filhas” ao termo genérico “crianças”.
- source_word: שָׁלָל רָב בָּזְזוּ מֵהֶם
  choice: tomaram deles muitos despojos
  rationale: Comunica a apreensão de bens como despojo de guerra em português corrente e mantém o substantivo que volta na oração seguinte.
- source_word: וַיָּבִיאוּ אֶת־הַשָּׁלָל לְשֹׁמְרוֹן
  choice: levaram os despojos para Samaria
  rationale: Tradução direta da ação, do objeto e do destino, usando a forma portuguesa consagrada do topônimo.
theological_decisions:
- issue: Linguagem de parentesco em um conflito dentro de Israel
  choice: dentre os seus irmãos
  alternative: dentre os seus parentes / dentre os seus compatriotas israelitas
  rationale: '“Irmãos” conserva a tensão ética e pactual do texto: os cativos não eram apresentados simplesmente como inimigos estrangeiros, mas como gente ligada a eles por parentesco e identidade comum.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conservam-se a expressão formal “filhos de Israel”, a linguagem de parentesco e a repetição de “despojos” presente no hebraico.
