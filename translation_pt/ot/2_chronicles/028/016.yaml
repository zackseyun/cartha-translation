  text: בָּ/עֵ֣ת הַ/הִ֗יא שָׁלַ֞ח הַ/מֶּ֧לֶךְ אָחָ֛ז עַל מַלְכֵ֥י אַשּׁ֖וּר לַ/עְזֹ֥ר לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/016.yaml
  text: At that time King Ahaz sent to the kings of Assyria for help[a].
translation:
  language: pt
  text: Naquele tempo, o rei Acaz mandou pedir ajuda aos reis da Assíria.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “reis da Assíria”; algumas traduções trazem “rei da Assíria” para harmonizar a expressão com a situação histórica.'
    reason: alternative_reading
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Naquele tempo
  rationale: Expressão temporal corrente e natural em português, preservando o enquadramento narrativo.
- source_word: שָׁלַח
  choice: mandou pedir
  rationale: O verbo significa literalmente “enviou”, com objeto implícito. No contexto, trata-se do envio de um pedido; “mandou pedir” comunica isso naturalmente sem acrescentar mensageiros ao texto.
- source_word: הַמֶּלֶךְ אָחָז
  choice: o rei Acaz
  rationale: Forma portuguesa natural para a construção hebraica de título seguido do nome próprio.
- source_word: עַל
  choice: aos
  rationale: Com שׁלח, a preposição indica a autoridade à qual Acaz dirigiu seu pedido.
- source_word: מַלְכֵי אַשּׁוּר
  choice: reis da Assíria
  rationale: Mantém o plural inequívoco do Texto Massorético, sem harmonizá-lo com a situação histórica presumida.
- source_word: לַעְזֹר לוֹ
  choice: pedir ajuda
  rationale: O infinitivo expressa a finalidade do envio. Esta formulação é idiomática e evita sugerir de modo excessivamente explícito que os próprios reis prestariam pessoalmente a ajuda.
theological_decisions:
- issue: Se o plural massorético “reis da Assíria” deve ser harmonizado com o singular historicamente esperado
  choice: Manter “reis da Assíria” no texto principal
  alternative: “rei da Assíria”
  rationale: O hebraico preservado é plural. Embora o singular seja historicamente esperado e apareça em algumas traduções, a tradução deve representar o texto-fonte sem resolver silenciosamente a dificuldade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Mandou pedir ajuda” é mais natural do que o literal e potencialmente incompleto “enviou aos reis”, sem explicitar mensageiros ausentes do hebraico.
