source:
  edition: WLC
  text: וַֽ/יִּתְּנֵ֜/הוּ יְהוָ֣ה אֱלֹהָי/ו֮ בְּ/יַ֣ד מֶ֣לֶךְ אֲרָם֒ וַ/יַּ֨כּוּ ב֔/וֹ וַ/יִּשְׁבּ֤וּ מִמֶּ֨/נּוּ֙ שִׁבְיָ֣ה גְדוֹלָ֔ה וַ/יָּבִ֖יאוּ דַּרְמָ֑שֶׂק וְ֠/גַם בְּ/יַד מֶ֤לֶךְ יִשְׂרָאֵל֙ נִתָּ֔ן וַ/יַּךְ בּ֖/וֹ מַכָּ֥ה גְדוֹלָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/005.yaml
  text: Therefore Yahweh his God gave him into the hand of the king of Aram[a], and they struck him and took from him a great number of captives and brought them to Damascus. He was also given into the hand of the king of Israel[c][b], who struck him with a great blow.
translation:
  language: pt
  text: Por isso, Yahweh, seu Deus, o entregou nas mãos do rei de Arã[a]. Eles o feriram, tiraram-lhe um grande número de cativos[b] e os levaram a Damasco. Ele também foi entregue nas mãos do rei de Israel, que o feriu com um grande golpe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “rei da Síria”; em hebraico, “Arã”.
    reason: lexical_alternative
  - marker: b
    text: Ou “uma grande quantidade de cativos”; literalmente, “uma grande catividade”.
    reason: lexical_alternative
  - marker: c
    text: Ou “lhe infligiu uma grande derrota”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֵהוּ ... בְּיַד
  choice: o entregou nas mãos
  rationale: A combinação de נתן com בְּיַד expressa entrega ao poder de alguém. A formulação mantém a imagem hebraica e soa natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהָיו
  choice: seu Deus
  rationale: Preserva a construção possessiva e a relação expressa no hebraico, mesmo no contexto de juízo.
- source_word: מֶלֶךְ אֲרָם
  choice: rei de Arã
  rationale: Mantém o nome próprio hebraico Aram em sua forma portuguesa, sem substituí-lo pelo nome geopolítico posterior Síria.
- source_word: וַיַּכּוּ בוֹ
  choice: Os arameus o derrotaram
  rationale: O plural retoma as forças do rei de Arã. Em contexto militar, 'derrotaram' comunica naturalmente o sentido de נכה sem sugerir apenas um golpe físico contra a pessoa do rei.
- source_word: וַיִּשְׁבּוּ מִמֶּנּוּ שִׁבְיָה גְדוֹלָה
  choice: fizeram muitos cativos entre o seu povo
  rationale: Expressa de modo idiomático o grande número de cativos levados de seu domínio; a nota preserva uma formulação mais próxima da construção hebraica.
- source_word: וַיָּבִיאוּ דַּרְמָשֶׂק
  choice: e os levaram a Damasco
  rationale: 'O objeto, implícito no hebraico, é recuperado do contexto: os cativos.'
- source_word: וְגַם ... נִתָּן
  choice: Ele também foi entregue
  rationale: Mantém a força aditiva de וְגַם e o passivo de נתן, que ecoa a primeira oração.
- source_word: וַיַּךְ בּוֹ מַכָּה גְדוֹלָה
  choice: que lhe infligiu uma grande derrota
  rationale: No contexto bélico, comunica com clareza o sentido da expressão idiomática 'feriu nele um grande golpe', enquanto a nota registra a imagem mais literal.
theological_decisions:
- issue: A ação divina na derrota de Acaz/Judá
  choice: Yahweh é apresentado explicitamente como aquele que o entregou aos inimigos.
  alternative: Traduzir o episódio apenas como derrota política ou militar, sem destacar a causalidade divina.
  rationale: O hebraico emprega נתן duas vezes, primeiro na voz ativa e depois na passiva, enquadrando as derrotas como juízo divino. A tradução preserva essa causalidade sem acrescentar explicações.
- issue: Tradução do nome divino
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto traz diretamente o Tetragrama יהוה; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe foi ajustada para explicitar naturalmente o sujeito plural arameu e o objeto implícito 'os cativos', sem alterar a sequência ou a causalidade do hebraico.
