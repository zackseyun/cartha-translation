  to: Por isso, Yahweh, seu Deus, o entregou nas mãos do rei de Arã[a]. Eles o feriram, tiraram-lhe um grande número de cativos[b] e os levaram a Damasco. Ele também foi entregue nas mãos do rei de Israel, que o feriu com um grande golpe[c].
