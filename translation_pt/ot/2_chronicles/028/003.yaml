source:
  edition: WLC
  text: וְ/ה֥וּא הִקְטִ֖יר בְּ/גֵ֣יא בֶן הִנֹּ֑ם וַ/יַּבְעֵ֤ר אֶת בָּנָי/ו֙ בָּ/אֵ֔שׁ כְּ/תֹֽעֲבוֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁר֙ הֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/003.yaml
  text: He also burned incense in the Valley of Ben-hinnom[a], and he burned his sons in the fire, according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: pt
  text: Ele também queimou incenso no vale de Ben-Hinom e queimou seus filhos no fogo,[a] seguindo as práticas abomináveis das nações que Yahweh havia expulsado de diante dos filhos de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fez seus filhos passarem pelo fogo”. O hebraico diz mais diretamente: “queimou seus filhos no fogo”.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִקְטִיר
  choice: queimou incenso
  rationale: O hifil de קטר designa a produção de fumaça sacrificial e frequentemente se refere à queima de incenso; a formulação é clara e adequada ao contexto de culto, sem acrescentar um objeto sacrificial não expresso.
- source_word: בְּגֵיא בֶן־הִנֹּם
  choice: no vale de Ben-Hinom
  rationale: A expressão é um topônimo. A transliteração preserva o nome hebraico e evita as associações posteriores de “Geena”, que não são explícitas neste contexto histórico.
- source_word: וַיַּבְעֵר אֶת־בָּנָיו בָּאֵשׁ
  choice: e queimou seus filhos no fogo
  rationale: O hifil de בער, acompanhado de “no fogo”, expressa de modo direto o ato de queimar. “Filhos” reproduz o masculino plural בָּנָיו, sem suavizar a gravidade do texto.
- source_word: כְּתוֹעֲבוֹת
  choice: seguindo as práticas abomináveis
  rationale: A expressão comunica naturalmente em português que ele agiu conforme as abominações das nações. “Práticas” explicita o sentido contextual do plural abstrato sem reduzir sua força moral.
- source_word: הַגּוֹיִם
  choice: as nações
  rationale: Neste contexto histórico, o termo indica os povos anteriormente estabelecidos na terra; “nações” é claro e não introduz a carga posterior de “gentios”.
- source_word: הֹרִישׁ
  choice: havia expulsado
  rationale: O hifil de ירש descreve aqui a remoção dos habitantes anteriores da terra. O mais-que-perfeito marca com naturalidade que essa expulsão precedeu os atos de Acaz.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: de diante dos filhos de Israel
  rationale: A formulação conserva a imagem espacial do idioma hebraico e reproduz בְּנֵי יִשְׂרָאֵל de modo formal e reconhecível.
theological_decisions:
- issue: Se a descrição do sacrifício dos filhos deve ser suavizada
  choice: O texto principal diz “queimou seus filhos no fogo”.
  alternative: fez seus filhos passar pelo fogo
  rationale: O hebraico emprega בער, e não a fórmula habitual com עבר, “fazer passar pelo fogo”. A tradução mantém a expressão mais forte e direta, preservando a alternativa tradicional em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O topônimo foi transliterado como “Ben-Hinom”; o nome divino foi mantido como “Yahweh”. A vírgula antes da nota mantém a leitura natural, e o marcador [a] aparece no texto principal.
