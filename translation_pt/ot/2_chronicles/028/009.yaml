  text: וְ֠/שָׁם הָיָ֨ה נָבִ֥יא לַֽ/יהוָה֮ עֹדֵ֣ד שְׁמ/וֹ֒ וַ/יֵּצֵ֗א לִ/פְנֵ֤י הַ/צָּבָא֙ הַ/בָּ֣א לְ/שֹׁמְר֔וֹן וַ/יֹּ֣אמֶר לָ/הֶ֗ם הִ֠נֵּה בַּ/חֲמַ֨ת יְהוָ֧ה אֱלֹהֵֽי אֲבוֹתֵי/כֶ֛ם עַל יְהוּדָ֖ה נְתָנָ֣/ם בְּ/יֶדְ/כֶ֑ם וַ/תַּֽהַרְגוּ בָ֣/ם בְ/זַ֔עַף עַ֥ד לַ/שָּׁמַ֖יִם הִגִּֽיעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/009.yaml
  text: There was a prophet of the LORD there, whose name was Oded; and he went out before the army that came to Samaria and said to them, “Look, because the LORD, the God of your fathers, was angry with Judah, he gave them into your hand, but you have killed them in a rage that has reached up to heaven.”
translation:
  language: pt
  text: 'Ali havia um profeta do SENHOR chamado Odede. Ele saiu ao encontro do exército que chegava a Samaria e lhes disse: “Vejam! Foi porque o SENHOR, o Deus de seus antepassados, estava irado com Judá que os entregou nas mãos de vocês. Mas vocês os mataram com uma fúria que chegou até os céus.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁם
  choice: Ali havia
  rationale: O advérbio שָׁם retoma o local do contexto; em português, “Ali havia” introduz naturalmente o profeta sem acrescentar um marcador temporal inexistente.
- source_word: נָבִיא לַיהוָה
  choice: um profeta do SENHOR
  rationale: Expressa a relação do profeta com YHWH; “SENHOR” segue a convenção portuguesa para o nome divino.
- source_word: וַיֵּצֵא לִפְנֵי הַצָּבָא
  choice: saiu ao encontro do exército
  rationale: Neste contexto, לִפְנֵי indica que Odede se apresentou diante do exército que retornava; “ao encontro” comunica a ação com naturalidade.
- source_word: הִנֵּה
  choice: Vejam!
  rationale: Preserva a função enfática e convocatória da partícula no discurso direto.
- source_word: בַּחֲמַת ... עַל־יְהוּדָה
  choice: porque ... estava irado com Judá
  rationale: Reproduz a relação causal e a ira divina expressa por חֵמָה, em linguagem corrente e digna.
- source_word: נְתָנָם בְּיֶדְכֶם
  choice: os entregou nas mãos de vocês
  rationale: Mantém o idioma hebraico compreensível em português e distingue o objeto “os” dos destinatários “vocês”.
- source_word: בְזַעַף עַד־לַשָּׁמַיִם הִגִּיעַ
  choice: com uma fúria que chegou até os céus
  rationale: Preserva a imagem hiperbólica do hebraico e sua força acusatória sem explicar além do texto.
theological_decisions:
- issue: Relação entre a ira do SENHOR e a violência de Israel
  choice: Usar “Mas” antes da acusação contra o exército
  alternative: Traduzir a sequência apenas com “e”
  rationale: 'Embora o hebraico use וַ, o contraste contextual é real: a entrega de Judá por Deus não justificava a fúria excessiva dos vencedores. “Mas” torna explícita essa relação discursiva sem alterar a tensão teológica do texto.'
- issue: Referência ao Deus ancestral de Israel
  choice: “o Deus de seus antepassados”
  alternative: “o Deus de seus pais”
  rationale: “Antepassados” comunica naturalmente que se trata dos ancestrais da comunidade, sem restringir a referência aos pais imediatos.
- issue: Alcance da imagem “até os céus”
  choice: Manter a imagem sem interpretação adicional
  alternative: Explicitar que a culpa ou o clamor chegou a Deus
  rationale: O original não identifica expressamente o que a chegada aos céus significa; a tradução preserva essa ambiguidade retórica e teológica.
translation_notes:
  register: Português moderno, amplamente internacional e de boa legibilidade brasileira. O período foi dividido para evitar uma frase excessivamente longa. Empregou-se “vocês”, natural no português brasileiro e claro para um público amplo, mantendo tom digno. O nome עֹדֵד foi transliterado como “Odede”, forma corrente em português.
