base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/024.yaml
  text: Ahaz gathered the vessels of the house of God and cut up the vessels of the house of God, and he shut the doors of the house of the LORD and made for himself altars in every corner of Jerusalem.
translation:
  language: pt
  text: Acaz reuniu os utensílios da casa de Deus e os cortou em pedaços. Fechou as portas da casa do SENHOR e fez para si altares em cada esquina de Jerusalém.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּלֵי
  choice: utensílios
  rationale: No contexto do templo, designa os objetos usados no culto; “utensílios” é natural, claro e mantém a abrangência do termo hebraico.
- source_word: וַיְקַצֵּץ
  choice: os cortou em pedaços
  rationale: Expressa a ação destrutiva e intensiva do verbo hebraico sem especificar além do que o texto afirma.
- source_word: בְּכָל־פִּנָּה
  choice: em cada esquina
  rationale: Preserva a imagem espacial do hebraico e indica a ampla disseminação dos altares por Jerusalém.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o nome divino pelo título em versaletes.
theological_decisions:
- issue: Natureza da ação de Acaz sobre os utensílios do templo
  choice: os cortou em pedaços
  alternative: os despedaçou
  rationale: A formulação escolhida mantém a ação concreta do verbo e evita acrescentar uma ideia de destruição total que o hebraico não explicita necessariamente.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe fluente. A repetição integral de “os utensílios da casa de Deus” foi reduzida por meio do pronome “os”, sem perda de referente ou sentido.
