  text: He sacrificed and burned incense on the high places[a], on the hills, and under every green tree.
translation:
  language: pt
  text: Ele sacrificou e queimou incenso nos lugares altos, nas colinas e debaixo de toda árvore verdejante.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְזַבֵּחַ
  choice: oferecia sacrifícios
  rationale: O piel de זבח indica a prática de sacrificar. A formulação explicita o objeto implícito e soa natural em português.
- source_word: וַיְקַטֵּר
  choice: e queimava incenso
  rationale: O piel de קטר pode indicar queimar incenso ou fazer subir fumaça sacrificial. Neste contexto de culto, «queimava incenso» é natural e preserva o sentido mais provável sem excluir a associação sacrificial.
- source_word: בַּבָּמוֹת
  choice: nos lugares altos
  rationale: במות é um termo cúltico para santuários locais, muitas vezes situados em elevações. «Lugares altos» conserva a expressão tradicional e suas ressonâncias intertextuais.
- source_word: וְעַל הַגְּבָעוֹת
  choice: nas colinas
  rationale: גבעות é o termo comum para colinas; a tradução mantém a distinção entre os «lugares altos» cúlticos e as elevações geográficas.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: e debaixo de toda árvore verdejante
  rationale: רענן descreve vegetação viçosa, fresca ou frondosa. «Verdejante» preserva a imagem e a fórmula associada a locais de culto ilícito.
theological_decisions:
- issue: Expressões cúlticas ligadas ao culto ilícito
  choice: Manter «lugares altos» e «debaixo de toda árvore verdejante» sem explicitar «pagãos» ou «idólatras».
  alternative: Traduzir de modo interpretativo como «santuários pagãos» e «debaixo de toda árvore frondosa».
  rationale: O hebraico descreve os locais mediante fórmulas cúlticas tradicionais, enquanto o contexto estabelece a avaliação negativa. A tradução preserva essa linguagem e evita acrescentar uma qualificação não expressa neste versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O aspecto reiterado de «oferecia» e «queimava» apresenta a conduta habitual de Acaz no contexto narrativo.
