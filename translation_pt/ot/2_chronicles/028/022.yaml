base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/022.yaml
  text: In the time of his distress[a], he continued to act unfaithfully against Yahweh—he, King Ahaz.
translation:
  language: pt
  text: No tempo da sua angústia, ele continuou a agir com infidelidade contra Yahweh — ele, o rei Acaz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְעֵת
  choice: No tempo de
  rationale: Preserva a construção temporal do hebraico de modo natural em português.
- source_word: הָצֵר לוֹ
  choice: da sua angústia
  rationale: Expressa o estado de aflição ou pressão sofrido por Acaz, mantendo a construção nominal do texto.
- source_word: וַיּוֹסֶף לִמְעוֹל
  choice: continuou a agir com infidelidade
  rationale: יסף com infinitivo indica continuação ou ação adicional; מעל descreve quebra de fidelidade, especialmente em sentido religioso ou pactual.
- source_word: בַּיהוָה
  choice: contra Yahweh
  rationale: Com מעל, a preposição identifica aquele contra quem se comete a infidelidade; o nome divino é transliterado como Yahweh.
- source_word: הוּא הַמֶּלֶךְ אָחָז
  choice: ele, o rei Acaz
  rationale: A formulação reproduz a ênfase do pronome independente e a identificação enfática e surpreendente do sujeito.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pactual e segue a decisão doutrinária indicada.
- issue: Natureza da falta expressa por מעל
  choice: agir com infidelidade contra Yahweh
  alternative: pecar contra Yahweh; cometer sacrilégio contra Yahweh
  rationale: A escolha mantém a dimensão de quebra de fidelidade sem restringir o termo apenas a pecado genérico ou a uma infração cultual específica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A construção final com travessão e pronome enfático preserva a força retórica do hebraico sem soar excessivamente literal.
