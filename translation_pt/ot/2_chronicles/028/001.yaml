source:
  edition: WLC
  text: בֶּן עֶשְׂרִ֤ים שָׁנָה֙ אָחָ֣ז בְּ/מָלְכ֔/וֹ וְ/שֵׁשׁ עֶשְׂרֵ֣ה שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/לֹא עָשָׂ֧ה הַ/יָּשָׁ֛ר בְּ/עֵינֵ֥י יְהוָ֖ה כְּ/דָוִ֥יד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/001.yaml
  text: Ahaz was twenty years old when he became king[a], and he reigned sixteen years in Jerusalem. He did not do what was right in the eyes of Yahweh, as David his father had done.
translation:
  language: pt
  text: Acaz tinha vinte anos quando se tornou rei e reinou dezesseis anos em Jerusalém. Ele não fez o que era certo aos olhos de Yahweh, como havia feito Davi, seu pai[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “pai” significa antepassado da linhagem real, não pai imediato.
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים שָׁנָה
  choice: tinha vinte anos
  rationale: A fórmula hebraica indica a idade de Acaz; esta é a expressão natural e exata em português moderno.
- source_word: בְּמָלְכוֹ
  choice: quando se tornou rei
  rationale: A construção situa a idade de Acaz no momento de sua ascensão ao trono.
- source_word: מָלַךְ
  choice: reinou
  rationale: O verbo descreve o exercício da realeza e corresponde à formulação régia convencional em português.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: A locução indica diretamente a sede de seu reinado.
- source_word: לֹא עָשָׂה הַיָּשָׁר
  choice: não fez o que era certo
  rationale: A tradução preserva a avaliação moral da fórmula hebraica em linguagem portuguesa clara e corrente.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Mantém a imagem hebraica da avaliação feita por Deus e verte o nome divino de forma explícita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: כְּדָוִיד אָבִיו
  choice: como havia feito Davi, seu pai
  rationale: Preserva o termo relacional hebraico 'pai' e explicita naturalmente o verbo subentendido na comparação; a nota esclarece que Davi era antepassado dinástico de Acaz.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o Tetragrama; usar 'Yahweh' preserva o nome pessoal em vez de substituí-lo pelo título tradicional.
- issue: Sentido de אָבִיו aplicado a Davi
  choice: seu pai, com nota explicativa
  alternative: seu antepassado
  rationale: A tradução mantém a forma cultural e dinástica do hebraico, enquanto a nota evita que o leitor entenda Davi como pai imediato de Acaz.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A fórmula régia foi vertida idiomaticamente, sem perder a estrutura avaliativa do hebraico.
