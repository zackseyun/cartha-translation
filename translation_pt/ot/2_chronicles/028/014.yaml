base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/014.yaml
  text: So the armed men left the captives and the plunder before the officials and all the assembly[a][b].
translation:
  language: pt
  text: Então os homens armados deixaram os prisioneiros e os despojos diante dos líderes e de toda a assembleia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: deixaram
  rationale: Embora a forma verbal hebraica esteja no singular, ela concorda coletivamente com הֶחָלוּץ, a tropa armada; o plural é natural em português e expressa a entrega dos prisioneiros e bens.
- source_word: הֶחָלוּץ
  choice: os homens armados
  rationale: O termo designa coletivamente os que estavam equipados para a guerra. A expressão é clara e adequada ao contexto militar.
- source_word: הַשִּׁבְיָה
  choice: os prisioneiros
  rationale: Aqui o substantivo se refere concretamente às pessoas levadas na guerra, não ao estado abstrato de cativeiro.
- source_word: הַבִּזָּה
  choice: os despojos
  rationale: Designa os bens tomados na guerra. “Despojos” é uma formulação portuguesa corrente no contexto bíblico e militar.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Preserva tanto a ideia espacial quanto a de uma entrega realizada na presença das autoridades e da comunidade reunida.
- source_word: הַשָּׂרִים
  choice: os líderes
  rationale: שׂרים designa aqui autoridades reconhecidas. “Líderes” evita sugerir especificamente príncipes reais ou comandantes militares.
- source_word: כָל הַקָּהָל
  choice: toda a assembleia
  rationale: קהל é a comunidade reunida; “toda a assembleia” é natural, inclusivo e não restringe o termo a uma reunião litúrgica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura narrativa direta. O singular coletivo do hebraico foi vertido pelo plural natural em português. Não se acrescentaram notas, pois as alternativas lexicais não alteram materialmente o sentido do versículo.
