  text: The rest of his acts and all his ways, the first and the last, behold, they are written in the Book of the Kings of Judah and Israel.
translation:
  language: pt
  text: Quanto aos demais atos de Acaz e a toda a sua conduta, do início ao fim, eis que estão escritos no Livro dos Reis de Judá e de Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיֶתֶר דְּבָרָיו
  choice: Quanto aos demais atos de Acaz
  rationale: Na fórmula de conclusão régia, יֶתֶר דְּבָרָיו se refere aos demais feitos ou atos do rei, não apenas às suas palavras. A explicitação de “Acaz” evita uma sequência pesada de possessivos e mantém claro o referente no português moderno.
- source_word: וְכָל דְּרָכָיו
  choice: e a toda a sua conduta
  rationale: דְּרָכָיו significa literalmente “seus caminhos”, mas aqui designa seu modo de agir. “Sua conduta” comunica naturalmente o sentido ético e biográfico da metáfora.
- source_word: הָרִאשֹׁנִים וְהָאַחֲרוֹנִים
  choice: dos primeiros aos últimos
  rationale: A expressão constitui um merismo cronológico que abrange toda a trajetória do rei. Esta formulação preserva os dois polos da expressão hebraica e soa natural em português.
- source_word: הִנָּם כְּתוּבִים
  choice: estão escritos
  rationale: O pronome demonstrativo enfático הִנָּם pode ser representado por “eis que”, mas isso tornaria a fórmula excessivamente marcada no português atual. “Estão escritos” preserva diretamente a afirmação e o valor resultativo do particípio.
- source_word: עַל סֵפֶר
  choice: no Livro
  rationale: Embora עַל tenha sentido básico de “sobre”, em uma referência bibliográfica o português idiomático pede “no”. סֵפֶר pode ser livro, documento ou rolo; “Livro” é claro e convencional aqui.
- source_word: מַלְכֵי יְהוּדָה וְיִשְׂרָאֵל
  choice: dos Reis de Judá e de Israel
  rationale: A expressão identifica a obra histórica citada pelo Cronista. As maiúsculas apresentam a sequência como título, sem identificá-la necessariamente com os livros bíblicos canônicos de Reis.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tradução conserva a fórmula historiográfica do texto, mas prefere “conduta” ao literal “caminhos” e não reproduz mecanicamente הִנָּם com “eis que”, evitando solenidade artificial. Não são necessárias notas de rodapé neste versículo.
