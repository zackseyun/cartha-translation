base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/007.yaml
  text: And Zikri[a], a mighty man of Ephraim, killed Maaseiah the king’s son, Azrikam the overseer of the house, and Elkanah[c][b], second to the king.
translation:
  language: pt
  text: Zicri, um valente de Efraim[a], matou Maaseias, filho do rei, Azricão, dirigente da casa real[b], e Elcana, o segundo depois do rei[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «um guerreiro de Efraim» ou «um herói efraimita».
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «dirigente da casa»; provavelmente se refere ao palácio ou à casa do rei.'
    reason: lexical_alternative
  - marker: c
    text: Ou «o segundo no comando, depois do rei».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהֲרֹג
  choice: matou
  rationale: O verbo הרג denota diretamente matar; «matou» é claro, atual e adequado ao registro narrativo.
- source_word: זִכְרִי
  choice: Zicri
  rationale: Transliteração tradicional e legível do nome próprio em português.
- source_word: גִּבּוֹר אֶפְרַיִם
  choice: um valente de Efraim
  rationale: גִּבּוֹר pode designar um homem valente, guerreiro ou herói. «Um valente de Efraim» conserva a amplitude do termo e indica sua ligação com Efraim.
- source_word: מַעֲשֵׂיָהוּ
  choice: Maaseias
  rationale: Forma portuguesa reconhecível do nome próprio hebraico.
- source_word: בֶּן הַמֶּלֶךְ
  choice: filho do rei
  rationale: Tradução direta e idiomática da construção, sem acrescentar identificação não expressa no texto.
- source_word: עַזְרִיקָם
  choice: Azricão
  rationale: Forma portuguesa legível do nome próprio hebraico.
- source_word: נְגִיד הַבָּיִת
  choice: dirigente da casa real
  rationale: נְגִיד indica um líder ou alto funcionário; em contexto régio, הַבָּיִת provavelmente se refere ao palácio ou à casa do rei. «Casa real» mantém a imagem de «casa» e esclarece o contexto.
- source_word: אֶלְקָנָה
  choice: Elcana
  rationale: Forma portuguesa tradicional e legível do nome próprio.
- source_word: מִשְׁנֵה הַמֶּלֶךְ
  choice: o segundo depois do rei
  rationale: מִשְׁנֶה indica quem ocupa o segundo lugar em hierarquia. A formulação preserva essa relação sem impor um título técnico posterior.
