  text: כִּֽי הִכְנִ֤יעַ יְהוָה֙ אֶת יְהוּדָ֔ה בַּ/עֲב֖וּר אָחָ֣ז מֶֽלֶךְ יִשְׂרָאֵ֑ל כִּ֤י הִפְרִ֨יעַ֙ בִּֽ/יהוּדָ֔ה וּ/מָע֥וֹל מַ֖עַל בַּ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/019.yaml
  text: For Yahweh humbled Judah because of Ahaz king of Israel[b][a], for he had cast off restraint in Judah and had acted very unfaithfully against Yahweh.
translation:
  language: pt
  text: Pois Yahweh humilhou Judá por causa de Acaz, rei de Israel,[a] porque ele causou desordem em Judá[b] e foi gravemente infiel a Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Acaz, rei de Israel”. Acaz era rei de Judá; a redação de Crônicas foi mantida, sem harmonização.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “agiu desenfreadamente em Judá” ou “deixou Judá sem freio”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכְנִיעַ
  choice: humilhou
  rationale: O hifil de כנע indica que Yahweh fez Judá baixar de condição; “humilhou” conserva o sentido causativo e a dimensão teológica sem restringi-lo a uma derrota militar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בַּעֲבוּר
  choice: por causa de
  rationale: A locução introduz aqui a causa do rebaixamento de Judá.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: rei de Israel
  rationale: Mantém a redação explícita do texto massorético, sem harmonizá-la historicamente para “rei de Judá”.
- source_word: הִפְרִיעַ
  choice: agiu desenfreadamente
  rationale: Expressa de modo natural a ideia de agir sem freio, de forma irresponsável ou desordenada, preservando a amplitude do verbo.
- source_word: בִּיהוּדָה
  choice: em Judá
  rationale: Representa Judá como a esfera em que ocorreu a ação de Acaz.
- source_word: וּמָעוֹל מַעַל
  choice: e foi gravemente infiel
  rationale: A construção enfática com formas da mesma raiz intensifica a infidelidade pactual; “gravemente” comunica essa intensificação em português corrente.
- source_word: בַּיהוָה
  choice: a Yahweh
  rationale: Com “ser infiel”, a regência natural em português é “infiel a”, expressando a pessoa contra quem se comete a deslealdade.
theological_decisions:
- issue: Acaz chamado de “rei de Israel”
  choice: Conservar “Acaz, rei de Israel” no texto principal.
  alternative: Harmonizar como “Acaz, rei de Judá”.
  rationale: Embora Acaz tenha reinado historicamente em Judá, o hebraico diz “rei de Israel”. A redação pode ter força retórica ou teológica em Crônicas e não deve ser corrigida silenciosamente.
- issue: Sentido de הִפְרִיעַ
  choice: “agiu desenfreadamente”
  alternative: “causou desordem” ou “rejeitou todo freio”
  rationale: O verbo admite mais de uma nuance relacionada a deixar solto, agir sem restrição ou produzir desordem. A tradução principal é natural, e a nota registra alternativas legítimas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem dos marcadores foi regularizada para que [a] acompanhe “rei de Israel” e [b], a expressão lexicalmente ambígua. “Agir desenfreadamente” evita a formulação pouco idiomática de uma tradução literal e mantém aberta a nuance entre falta de freio e desordem.
