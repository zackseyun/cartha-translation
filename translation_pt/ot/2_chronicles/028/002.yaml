base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/002.yaml
  text: He walked in the ways of the kings of Israel[b][a], and he also made cast images for the Baals.
translation:
  language: pt
  text: Ele andou nos caminhos dos reis de Israel e também fez imagens de metal fundido para os baalins.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “para os baalins”, no plural; a expressão pode se referir a diferentes manifestações locais ou representações associadas ao culto de Baal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Ele andou
  rationale: Preserva a metáfora hebraica de andar como modo de viver e agir, natural no registro bíblico em português.
- source_word: בְּדַרְכֵי
  choice: nos caminhos de
  rationale: Mantém o idiomatismo hebraico relativo à conduta sem perder clareza para o leitor moderno.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: os reis de Israel
  rationale: Reproduz diretamente a construção genitiva e a referência histórica.
- source_word: וְגַם
  choice: e também
  rationale: Assinala que a fabricação das imagens constitui uma acusação adicional.
- source_word: מַסֵּכוֹת
  choice: imagens de metal fundido
  rationale: Expressa de modo claro e atual que eram imagens produzidas por fundição, sem reduzi-las genericamente a ídolos.
- source_word: עָשָׂה
  choice: fez
  rationale: Equivalente simples e idiomático do verbo hebraico comum.
- source_word: לַבְּעָלִים
  choice: para os baalins
  rationale: Conserva o plural explícito do hebraico; “baalins” é a forma portuguesa tradicional e inteligível para as diversas manifestações ou formas de culto de Baal.
theological_decisions:
- issue: Plural de בְּעָלִים
  choice: os baalins
  alternative: Baal; os ídolos de Baal
  rationale: O plural do texto deve ser preservado, pois pode indicar múltiplas manifestações locais ou representações cultuais ligadas a Baal, sem decidir entre essas possibilidades.
- issue: Metáfora de andar para descrever a conduta
  choice: Ele andou nos caminhos dos reis de Israel
  alternative: Ele seguiu as práticas dos reis de Israel
  rationale: A formulação conserva a metáfora moral do hebraico e continua compreensível em português contemporâneo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora hebraica foi mantida; “imagens de metal fundido” esclarece o processo de fabricação, e o plural “baalins” preserva uma ambiguidade relevante do original.
