  text: וַ/יָּקֻ֣מוּ הָ/אֲנָשִׁים֩ אֲשֶׁר נִקְּב֨וּ בְ/שֵׁמ֜וֹת וַ/יַּחֲזִ֣יקוּ בַ/שִּׁבְיָ֗ה וְ/כָֽל מַעֲרֻמֵּי/הֶם֮ הִלְבִּ֣ישׁוּ מִן הַ/שָּׁלָל֒ וַ/יַּלְבִּשׁ֣וּ/ם וַ֠/יַּנְעִלוּ/ם וַ/יַּאֲכִל֨וּ/ם וַ/יַּשְׁק֜וּ/ם וַ/יְסֻכ֗וּ/ם וַ/יְנַהֲל֤וּ/ם בַּ/חֲמֹרִים֙ לְ/כָל כּוֹשֵׁ֔ל וַ/יְבִיא֛וּ/ם יְרֵח֥וֹ עִיר הַ/תְּמָרִ֖ים אֵ֣צֶל אֲחֵי/הֶ֑ם וַ/יָּשׁ֖וּבוּ שֹׁמְרֽוֹן־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/015.yaml
  text: Then the men who had been designated by name stood up and took charge of the captives[a], and from the spoil they clothed all who were naked among them. They clothed them, put sandals on them, fed them, gave them drink, anointed them, and led all the feeble among them on donkeys. They brought them to Jericho, the city of palm trees, to their brothers; then they returned to Samaria.
translation:
  language: pt
  text: Então se levantaram os homens que haviam sido designados pelo nome e se encarregaram dos cativos. Com os despojos, vestiram todos os que estavam nus entre eles. Vestiram-nos e puseram-lhes sandálias, deram-lhes de comer e de beber e os ungiram com óleo. Puseram sobre jumentos todos os que estavam fracos e os conduziram a Jericó, a cidade das palmeiras, para junto de seus irmãos[a]. Depois voltaram para Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus parentes” ou “seus compatriotas israelitas”.
    reason: Alternativa lexical para אֲחֵיהֶם, cujo sentido coletivo pode ser mais amplo que irmãos biológicos.
lexical_decisions:
- source_word: נִקְּבוּ בְשֵׁמוֹת
  choice: haviam sido designados pelo nome
  rationale: O nifal de נקב com בְשֵׁמוֹת indica homens especificamente identificados ou designados; a formulação preserva tanto a passividade quanto a referência nominal explícita.
- source_word: וַיַּחֲזִיקוּ בַשִּׁבְיָה
  choice: se encarregaram dos cativos
  rationale: Neste contexto de cuidado compassivo, החזיק ב expressa assumir responsabilidade pelos cativos, e não capturá-los novamente.
- source_word: מַעֲרֻמֵּיהֶם
  choice: todos os que estavam nus entre eles
  rationale: Expressa de modo natural que se tratava dos membros nus ou despidos do grupo de cativos.
- source_word: הִלְבִּישׁוּ מִן הַשָּׁלָל
  choice: Com os despojos, vestiram
  rationale: Indica claramente que as roupas provinham do despojo de guerra, mantendo o vocabulário histórico do texto.
- source_word: וַיַּלְבִּשׁוּם
  choice: Deram-lhes roupas
  rationale: Preserva a repetição enfática do hebraico sem produzir em português a sequência pouco natural 'vestiram... vestiram-nos'.
- source_word: וַיַּנְעִלוּם
  choice: e sandálias
  rationale: O verbo significa calçar ou fornecer calçado; 'sandálias' é claro e adequado ao cenário antigo.
- source_word: וַיַּאֲכִלוּם וַיַּשְׁקוּם
  choice: deram-lhes de comer e de beber
  rationale: Formulação portuguesa idiomática que mantém as duas ações causativas sem especificar uma bebida não indicada no hebraico.
- source_word: וַיְסֻכוּם
  choice: os ungiram com óleo
  rationale: סוך denota aplicar óleo ao corpo; explicitar 'com óleo' comunica o cuidado restaurador e evita que 'ungir' seja entendido exclusivamente como ato cerimonial.
- source_word: וַיְנַהֲלוּם בַּחֲמֹרִים לְכָל כּוֹשֵׁל
  choice: Puseram sobre jumentos todos os que estavam fracos e os conduziram
  rationale: A construção descreve transporte compassivo dos que fraquejavam; a ordem portuguesa torna inequívoco que os fracos foram colocados nos jumentos e conduzidos.
- source_word: יְרֵחוֹ עִיר הַתְּמָרִים
  choice: Jericó, a cidade das palmeiras
  rationale: Tradução direta e natural do conhecido epíteto de Jericó.
theological_decisions:
- issue: Sentido de אֲחֵיהֶם no contexto de parentesco coletivo
  choice: seus irmãos
  alternative: seus parentes; seus compatriotas israelitas
  rationale: O substantivo é masculino plural e designa literalmente os 'irmãos' dos cativos, com possível sentido coletivo mais amplo de parentes ou membros do mesmo povo. O texto principal conserva a forma concreta, e a nota registra a amplitude contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva a progressão das ações de cuidado e a designação tradicional de Jericó, evitando arcaísmos como 'calçaram-nos' e esclarecendo o uso restaurador do óleo.
