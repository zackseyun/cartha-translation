  text: וַ/יָּבֹ֣א עָלָ֔י/ו תִּלְּגַ֥ת פִּלְנְאֶ֖סֶר מֶ֣לֶךְ אַשּׁ֑וּר וַ/יָּ֥צַר ל֖/וֹ וְ/לֹ֥א חֲזָקֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/020.yaml
  text: Then Tiglath-pileser king of Assyria came against him and distressed him[a], but did not strengthen him.
translation:
  language: pt
  text: Então Tiglate-Pileser, rei da Assíria, veio contra Acaz e o afligiu, mas não o fortaleceu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e o afligiu, e não o fortaleceu”. O hebraico pode ser traduzido mais formalmente sem tornar explícita a força contrastiva.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא עָלָיו
  choice: veio contra Acaz
  rationale: A construção בוא על, neste contexto político-militar, tem sentido hostil. A explicitação de Acaz em vez do pronome evita ambiguidade em português sem acrescentar conteúdo.
- source_word: תִּלְּגַת פִּלְנְאֶסֶר
  choice: Tiglate-Pileser
  rationale: Forma tradicional e amplamente reconhecível em português para o nome do rei assírio.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: rei da Assíria
  rationale: Tradução direta da construção nominal, usando a forma geográfica corrente em português.
- source_word: וַיָּצַר לוֹ
  choice: o oprimiu
  rationale: צרר pode indicar apertar, afligir ou causar angústia. “Oprimiu” comunica a pressão hostil exercida sobre Acaz sem restringir o sentido a um cerco militar.
- source_word: וְלֹא חֲזָקוֹ
  choice: mas não o fortaleceu
  rationale: Mantém o valor básico de חזק e expressa naturalmente o contraste contextual entre a ajuda esperada e a ação prejudicial do rei assírio.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. O nome próprio segue a forma portuguesa corrente; “Acaz” substitui o pronome para assegurar clareza referencial. A nota preserva a possibilidade de reproduzir literalmente a coordenação hebraica.
