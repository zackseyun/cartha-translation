  language: en
  yaml_path: translation/ot/2_chronicles/028/012.yaml
  text: 'Then some men from the heads of the sons of Ephraim stood up against those coming from the army: Azariah son of Jehohanan[a], Berechiah son of Meshillemoth, Hezekiah son of Shallum, and Amasa son of Hadlai.'
translation:
  language: pt
  text: Então alguns dos chefes dos filhos de Efraim — Azarias, filho de Joanã; Berequias, filho de Mesilemote; Ezequias, filho de Salum; e Amasa, filho de Hadlai — levantaram-se contra os que vinham do exército.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: levantaram-se
  rationale: O qal narrativo de קום indica uma ação decidida; em combinação com עַל, comunica que os homens tomaram posição contra os soldados, sem explicitar além do hebraico a forma do confronto.
- source_word: אֲנָשִׁים מֵרָאשֵׁי בְנֵי אֶפְרַיִם
  choice: alguns dos chefes dos filhos de Efraim
  rationale: “Alguns” expressa naturalmente o grupo indefinido, e “chefes” transmite a função reconhecida de רָאשֵׁי. Mantém-se “filhos de Efraim”, expressão bíblica inteligível em português e próxima da construção hebraica.
- source_word: עֲזַרְיָהוּ ... בֶּרֶכְיָהוּ ... יְחִזְקִיָּהוּ ... עֲמָשָׂא
  choice: Azarias ... Berequias ... Ezequias ... Amasa
  rationale: Empregam-se as formas portuguesas bíblicas tradicionais e reconhecíveis dos nomes próprios.
- source_word: בֶן
  choice: filho de
  rationale: Equivalente patronímico direto e natural em português.
- source_word: עַל
  choice: contra
  rationale: Com קום, a preposição indica oposição ou confronto; “contra” preserva essa força contextual sem acrescentar ações não declaradas.
- source_word: הַבָּאִים
  choice: os que voltavam
  rationale: O particípio de בוא significa literalmente os que vinham/chegavam. No contexto, trata-se das tropas que regressavam da campanha; “voltavam” torna esse movimento natural em português sem perder o sentido contextual.
- source_word: מִן הַצָּבָא
  choice: do exército
  rationale: צָבָא designa aqui a força ou expedição militar. “Exército” é a equivalência moderna mais clara; com “voltavam”, a preposição מִן indica o âmbito de onde regressavam.
