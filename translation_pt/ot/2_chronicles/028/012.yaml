translation_notes:
  register: Português moderno, digno e acessível, com formas onomásticas correntes em Bíblias de língua portuguesa. A enumeração foi delimitada por travessões e ponto e vírgula para evitar que os nomes interrompam a ação principal. Não se julgou necessária nota, pois “chefes dos filhos de Efraim” preserva com clareza a expressão hebraica.
