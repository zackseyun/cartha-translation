  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּהֲרֹג֩ פֶּ֨קַח בֶּן רְמַלְיָ֜הוּ בִּֽ/יהוּדָ֗ה מֵאָ֨ה וְ/עֶשְׂרִ֥ים אֶ֛לֶף בְּ/י֥וֹם אֶחָ֖ד הַ/כֹּ֣ל בְּנֵי חָ֑יִל בְּ/עָזְבָ֕/ם אֶת יְהוָ֖ה אֱלֹהֵ֥י אֲבוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/006.yaml
  text: And Pekah son of Remaliah killed in Judah one hundred twenty thousand in a single day[a], all of them valiant men, because they had forsaken Yahweh[c][b], the God of their fathers.
translation:
  language: pt
  text: Peca, filho de Remalias, matou em Judá cento e vinte mil homens num só dia[a], todos eles homens valentes[b], porque haviam abandonado Yahweh[c], o Deus de seus antepassados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em um dia”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “filhos de força”, isto é, homens valentes e aptos para a guerra.'
    reason: lexical_alternative
  - marker: c
    text: Ou “quando abandonaram Yahweh”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּהֲרֹג
  choice: matou
  rationale: Traduz diretamente הרג em português moderno, sem o tom arcaico de “matou à espada” nem a interpretação adicional de “abateu”.
- source_word: בִּיהוּדָה
  choice: em Judá
  rationale: A preposição indica o local da matança; “Judá” é a designação histórica adequada do reino ou território.
- source_word: מֵאָה וְעֶשְׂרִים אֶלֶף
  choice: cento e vinte mil homens
  rationale: Reproduz o numeral de modo natural; “homens” é explicitado à luz da caracterização masculina subsequente בְּנֵי חָיִל.
- source_word: בְּיוֹם אֶחָד
  choice: num só dia
  rationale: Forma corrente e enfática em português para o literal “em um dia”, destacando a escala do acontecimento.
- source_word: הַכֹּל
  choice: todos eles
  rationale: Retoma de forma idiomática a totalidade dos cento e vinte mil mencionados.
- source_word: בְּנֵי חָיִל
  choice: homens valentes
  rationale: Expressa o sentido de homens de força, valor ou capacidade militar sem reduzir necessariamente a expressão ao papel técnico de guerreiros.
- source_word: בְּעָזְבָם
  choice: porque haviam abandonado
  rationale: A construção com בְּ e infinitivo pode ser circunstancial ou causal; o contexto favorece a causa, enquanto o mais-que-perfeito situa o abandono antes da matança.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי אֲבוֹתָם
  choice: o Deus de seus antepassados
  rationale: Preserva a referência familiar e histórica da expressão hebraica em linguagem portuguesa atual e abrangente.
theological_decisions:
- issue: Valor de בְּעָזְבָם em relação à matança
  choice: 'causal: “porque haviam abandonado”'
  alternative: 'temporal ou circunstancial: “quando abandonaram” / “ao abandonarem”'
  rationale: No contexto interpretativo do Cronista, a derrota é apresentada como consequência da infidelidade a Yahweh. O hebraico admite esse valor causal, mas a alternativa é registrada para preservar sua amplitude sintática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Num só dia” comunica naturalmente a ênfase; “antepassados” evita arcaísmo sem enfraquecer o vínculo histórico da fórmula de aliança. Todos os marcadores de nota aparecem no texto principal.
