  text: וַ/יִּזְבַּ֗ח לֵֽ/אלֹהֵ֣י דַרְמֶשֶׂק֮ הַ/מַּכִּ֣ים בּ/וֹ֒ וַ/יֹּ֗אמֶר כִּ֠י אֱלֹהֵ֤י מַלְכֵֽי אֲרָם֙ הֵ֚ם מַעְזְרִ֣ים אוֹתָ֔/ם לָ/הֶ֥ם אֲזַבֵּ֖חַ וְ/יַעְזְר֑וּ/נִי וְ/הֵ֛ם הָֽיוּ ל֥/וֹ לְ/הַכְשִׁיל֖/וֹ וּ/לְ/כָל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/023.yaml
  text: And he sacrificed to the gods of Damascus that had struck him[a], and he said, “Because the gods of the kings of Aram help them, I will sacrifice to them[c][b], so that they may help me.” But they became the downfall of him and of all Israel.
translation:
  language: pt
  text: 'E ofereceu sacrifícios aos deuses de Damasco, que o haviam derrotado[a], pois disse: “Já que os deuses dos reis da Síria os ajudam, oferecerei sacrifícios a eles, para que me ajudem”. Mas foram eles que causaram a ruína dele e de todo o Israel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que o estavam atacando”. O particípio hebraico pode indicar uma ação em curso ou característica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: ofereceu sacrifícios
  rationale: Expressa de modo natural e inequívoco a ação cultual de זבח, sem sugerir que Acaz sacrificou a si mesmo.
- source_word: לֵאלֹהֵי דַרְמֶשֶׂק
  choice: aos deuses de Damasco
  rationale: Preserva o plural construto אֱלֹהֵי e usa a forma portuguesa corrente do topônimo.
- source_word: הַמַּכִּים בּוֹ
  choice: que o haviam derrotado
  rationale: O particípio atributivo pode indicar ação em curso ou característica; no contexto narrativo, a derrota anterior motiva o sacrifício de Acaz. A alternativa mais literal é registrada em nota.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação que Acaz deu para seu ato e liga naturalmente a fala à oração precedente.
- source_word: אֱלֹהֵי מַלְכֵי אֲרָם
  choice: os deuses dos reis da Síria
  rationale: Mantém o plural hebraico 'reis' e traduz אֲרָם pelo nome geográfico tradicional e imediatamente compreensível em português neste contexto histórico.
- source_word: מַעְזְרִים אוֹתָם
  choice: os ajudam
  rationale: O presente comunica a ação contínua ou característica expressa pelo particípio.
- source_word: לָהֶם אֲזַבֵּחַ
  choice: oferecerei sacrifícios a eles
  rationale: Mantém explícito o destinatário e comunica a intenção futura do imperfeito.
- source_word: וְיַעְזְרוּנִי
  choice: para que me ajudem
  rationale: Representa a relação volitiva de propósito na lógica de Acaz, sem transformá-la em certeza objetiva.
- source_word: וְהֵם הָיוּ לוֹ לְהַכְשִׁילוֹ
  choice: Mas foram eles que causaram a ruína dele
  rationale: O adversativo explicita a ironia contextual, enquanto 'causaram a ruína' traduz o valor causativo de הכשיל de forma clara e digna.
- source_word: וּלְכָל יִשְׂרָאֵל
  choice: e de todo o Israel
  rationale: Coordena Israel com Acaz como atingidos pela ruína, de modo natural em português.
theological_decisions:
- issue: Agência atribuída aos deuses de Damasco na derrota de Acaz
  choice: Preservar a atribuição dentro do raciocínio relatado de Acaz, sem afirmar em voz narrativa que esses deuses eram agentes divinos reais.
  alternative: Explicitar que Acaz apenas imaginava que os deuses o haviam derrotado.
  rationale: O texto relata a interpretação idólatra de Acaz e a desmente ironicamente pelo resultado desastroso; acrescentar 'ele pensava' resolveria uma tensão que o hebraico deixa ao leitor.
- issue: Relação entre o sacrifício e a ajuda esperada
  choice: 'Traduzir וְיַעְזְרוּנִי como propósito: ''para que me ajudem''.'
  alternative: 'Traduzir como previsão: ''e eles me ajudarão''.'
  rationale: A formulação de propósito preserva a intenção de Acaz sem endossar a eficácia dos deuses.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Preferiu-se 'Síria' no corpo do texto por clareza histórica corrente; 'Damasco' foi mantido como topônimo. A construção final conserva o forte contraste irônico do hebraico sem introduzir comentário doutrinário.
