source:
  edition: WLC
  text: כִּֽי חָלַ֤ק אָחָז֙ אֶת בֵּ֣ית יְהוָ֔ה וְ/אֶת בֵּ֥ית הַ/מֶּ֖לֶךְ וְ/הַ/שָּׂרִ֑ים וַ/יִּתֵּן֙ לְ/מֶ֣לֶךְ אַשּׁ֔וּר וְ/לֹ֥א לְ/עֶזְרָ֖ה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/021.yaml
  text: For Ahaz plundered the house of Yahweh[a], and the house of the king and the princes, and gave it to the king of Assyria[c][b], but it did not help him.
translation:
  language: pt
  text: Pois Acaz despojou o templo de Yahweh[a], o palácio real e os príncipes[b], e entregou os bens ao rei da Assíria; mas isso não lhe serviu de ajuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a casa de Yahweh”.'
    reason: literal_rendering
  - marker: b
    text: Ou “as autoridades” ou “os oficiais”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da afirmação anterior e preserva a força causal do hebraico.
- source_word: חָלַק
  choice: despojou
  rationale: Embora o sentido básico possa ser “dividir” ou “repartir”, o contexto indica a retirada de bens valiosos para entregá-los ao rei assírio.
- source_word: בֵּית יְהוָה
  choice: o templo de Yahweh
  rationale: “Templo” comunica naturalmente em português a referência ao santuário, enquanto Yahweh preserva o nome divino expresso no texto.
- source_word: בֵּית הַמֶּלֶךְ
  choice: o palácio real
  rationale: Equivalente português claro e natural para a residência e tesouro do rei neste contexto.
- source_word: הַשָּׂרִים
  choice: os príncipes
  rationale: Preserva a designação tradicional de membros da elite governante; “autoridades” ou “oficiais” também é possível.
- source_word: וַיִּתֵּן
  choice: e entregou os bens
  rationale: O objeto singular implícito é explicitado coletivamente como os bens retirados, evitando em português um pronome de referência pouco clara.
- source_word: לְמֶלֶךְ אַשּׁוּר
  choice: ao rei da Assíria
  rationale: Tradução direta e idiomática do destinatário.
- source_word: וְלֹא לְעֶזְרָה לוֹ
  choice: mas isso não lhe serviu de ajuda
  rationale: Expressa naturalmente o resultado negativo sem especificar além do texto se faltou ajuda militar ou benefício mais amplo.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz explicitamente o Tetragrama; a transliteração preserva o nome próprio sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A enumeração distingue claramente o templo, o palácio e os líderes como três fontes dos bens. “Despojou” conserva a gravidade do ato, e a nota registra a forma hebraica literal de “templo”.
