  text: וּ/בְ/כָל עִ֨יר וָ/עִ֤יר לִֽ/יהוּדָה֙ עָשָׂ֣ה בָמ֔וֹת לְ/קַטֵּ֖ר לֵֽ/אלֹהִ֣ים אֲחֵרִ֑ים וַ/יַּכְעֵ֕ס אֶת יְהוָ֖ה אֱלֹהֵ֥י אֲבֹתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/025.yaml
  text: And in every city of Judah he made high places to burn incense to other gods[a], and he provoked Yahweh, the God of his fathers.
translation:
  language: pt
  text: Em cada cidade de Judá, ele fez lugares altos para queimar incenso a outros deuses e provocou a ira de Yahweh, o Deus de seus antepassados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְכָל עִיר וָעִיר לִיהוּדָה
  choice: Em cada cidade de Judá
  rationale: A repetição distributiva hebraica עִיר וָעִיר enfatiza a totalidade das cidades. “Em cada cidade de Judá” transmite essa força com naturalidade em português, sem reproduzir a construção artificial “cidade e cidade”.
- source_word: עָשָׂה
  choice: fez
  rationale: Mantém a amplitude semântica do verbo comum עשה, sem especificar além do texto se ele construiu ou estabeleceu esses locais.
- source_word: בָּמוֹת
  choice: lugares altos
  rationale: Expressão bíblica consolidada para locais de culto designados por בָּמוֹת; preserva a referência cultual sem acrescentar explicação interpretativa ao texto.
- source_word: לְקַטֵּר
  choice: para queimar incenso
  rationale: Neste contexto cultual, o piel de קטר indica fazer subir fumaça aromática ou sacrificial; “queimar incenso” é claro, corrente e semanticamente adequado.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: a outros deuses
  rationale: Tradução direta que não acrescenta a ideia de deuses “estrangeiros”, ausente do adjetivo אֲחֵרִים.
- source_word: וַיַּכְעֵס אֶת
  choice: e provocou a ira de
  rationale: O hiphil de כעס significa causar ira ou provocar à ira. A formulação explicita em português o resultado inerente ao verbo e evita a possível impressão de que Yahweh foi apenas importunado.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: o Deus de seus antepassados
  rationale: “Antepassados” comunica naturalmente o sentido coletivo de אָבוֹת no português moderno e evita que “pais” seja entendido apenas como progenitores imediatos.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e corresponde melhor à transliteração acadêmica amplamente aceita.
- issue: Sentido causativo de וַיַּכְעֵס
  choice: provocou a ira de Yahweh
  alternative: provocou Yahweh; irritou Yahweh
  rationale: A forma hiphil é causativa. A tradução escolhida conserva explicitamente a noção de fazê-lo irar-se, sem enfraquecer a avaliação teológica do ato.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe é direta; “lugares altos” conserva o vocabulário cultual bíblico tradicional, enquanto “antepassados” evita ambiguidade moderna. Não há nota de rodapé porque a força distributiva do hebraico foi plenamente incorporada em “cada cidade”.
