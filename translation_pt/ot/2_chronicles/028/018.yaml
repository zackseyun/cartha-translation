base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/018.yaml
  text: And the Philistines had raided the cities of the lowland and the Negeb of Judah[a], and they captured Beth-shemesh, Aijalon, Gederoth, Soko and its villages, Timnah and its villages, and Gimzo and its villages; and they settled there.
translation:
  language: pt
  text: Os filisteus também fizeram incursões contra as cidades da Sefelá e do Neguebe de Judá. Capturaram Bete-Semes, Aijalom, Gederote, Socó e seus povoados, Timna e seus povoados, e Gimzo e seus povoados; e se estabeleceram ali.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: Os filisteus também
  rationale: O etnônimo é vertido pela forma portuguesa corrente; o waw é expresso por “também”, que liga esta incursão às ações inimigas do contexto sem exigir um início pouco natural com “E”.
- source_word: פָּשְׁטוּ
  choice: fizeram incursões
  rationale: No contexto militar, o verbo indica ataques ou incursões predatórias, não apenas expansão territorial. A expressão é clara e preserva o valor verbal sem impor retrospectividade temporal ausente da forma hebraica.
- source_word: בְּעָרֵי הַשְּׁפֵלָה וְהַנֶּגֶב לִיהוּדָה
  choice: contra as cidades da Sefelá e do Neguebe de Judá
  rationale: A preposição é traduzida idiomaticamente como alvo das incursões. Sefelá e Neguebe são nomes geográficos reconhecíveis e preservam a especificidade regional do hebraico.
- source_word: וַיִּלְכְּדוּ
  choice: Capturaram
  rationale: Verbo militar natural para a tomada de cidades; a nova frase torna clara a progressão entre as incursões e as conquistas.
- source_word: בֵּית שֶׁמֶשׁ
  choice: Bete-Semes
  rationale: Transliteração portuguesa corrente do topônimo hebraico.
- source_word: אַיָּלוֹן
  choice: Aijalom
  rationale: Forma aportuguesada do topônimo, com terminação inteligível e corrente na tradição bíblica em português.
- source_word: הַגְּדֵרוֹת
  choice: Gederote
  rationale: Transliteração aportuguesada do nome de lugar.
- source_word: שׂוֹכוֹ
  choice: Socó
  rationale: Transliteração portuguesa direta e corrente; a sílaba final tônica é indicada por acento.
- source_word: וּבְנוֹתֶיהָ / בְּנֹתֶיהָ
  choice: e seus povoados
  rationale: Literalmente “suas filhas”, idiomatismo para localidades dependentes ou assentamentos satélites. “Povoados” comunica o sentido sem reproduzir uma metáfora obscura.
- source_word: תִּמְנָה
  choice: Timna
  rationale: Transliteração simples e natural do topônimo.
- source_word: גִּמְזוֹ
  choice: Gimzo
  rationale: Transliteração simples do topônimo, sem acrescentar identificação não presente no texto.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: e se estabeleceram ali
  rationale: Neste contexto posterior à conquista, ישׁב indica residência e ocupação continuada; “se estabeleceram” expressa esse sentido naturalmente.
theological_decisions: []
translation_notes:
  register: 'Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Os topônimos regionais Sefelá e Neguebe são preservados, enquanto os nomes de cidades recebem formas portuguesas. Não se incluiu a nota inglesa “Ou ‘Soco’”, pois ela parece estar deslocada no material de consulta: “Soco/Socó” é variante do topônimo שׂוֹכוֹ, não de “Judá”, e a forma adotada no texto português já é Socó.'
