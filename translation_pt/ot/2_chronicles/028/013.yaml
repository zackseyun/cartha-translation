base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/013.yaml
  text: And they said to them[a], “Do not bring the captives here, for you are proposing to add to our sins and to our guilt, bringing guilt from Yahweh upon us, because our guilt is already great[b], and there is fierce anger against Israel.”
translation:
  language: pt
  text: 'E eles lhes disseram: “Não tragam os cativos para cá, pois vocês pretendem acrescentar aos nossos pecados e à nossa culpa, trazendo sobre nós culpa diante de Yahweh[a]. A nossa culpa já é grande, e há ira ardente[b] contra Israel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “culpa contra Yahweh sobre nós”. A expressão hebraica é compacta e pode destacar tanto a culpa em relação a Yahweh quanto a culpa que recai sobre o povo sob seu juízo.'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “ardor de ira”, expressão que indica ira intensa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשִּׁבְיָה
  choice: os cativos
  rationale: O substantivo pode indicar o estado de cativeiro ou o conjunto das pessoas capturadas; aqui, o verbo ‘trazer’ exige o sentido concreto de pessoas levadas como prisioneiras.
- source_word: הֵנָּה
  choice: para cá
  rationale: O advérbio indica movimento em direção ao lugar dos falantes; ‘para cá’ expressa isso naturalmente em português.
- source_word: לְאַשְׁמַת יְהוָה עָלֵינוּ
  choice: trazer sobre nós culpa diante de Yahweh
  rationale: A expressão hebraica é compacta e difícil. A formulação mantém a ideia de culpa recaindo sobre os falantes em sua relação com Yahweh, sem afirmar de modo excessivamente explícito se a culpa vem do juízo divino ou é cometida contra ele.
- source_word: אַתֶּם אֹמְרִים
  choice: vocês pretendem
  rationale: Literalmente, ‘vocês dizem’; no contexto, a expressão comunica intenção ou propósito, e ‘pretendem’ é natural em português.
- source_word: לְהֹסִיף עַל
  choice: acrescentando a
  rationale: Expressa o aumento cumulativo dos pecados e da culpa já existentes.
- source_word: חַטֹּאתֵינוּ
  choice: nossos pecados
  rationale: Mantém o plural e distingue os atos pecaminosos da culpa ou responsabilidade indicada pelo termo seguinte.
- source_word: אַשְׁמָתֵינוּ / אַשְׁמָה
  choice: nossa culpa / a nossa culpa já é grande
  rationale: ‘Culpa’ preserva a noção de culpabilidade ou responsabilidade e mantém a distinção lexical em relação a ‘pecados’. ‘Já’ explicita de modo natural o argumento contextual de que a culpa existente seria aumentada.
- source_word: וַחֲרוֹן אָף
  choice: e há ira ardente
  rationale: Tradução próxima da imagem hebraica de uma ira que arde, preservando sua intensidade e permanecendo compreensível em português atual.
- source_word: עַל יִשְׂרָאֵל
  choice: contra Israel
  rationale: Com ira divina, a preposição é naturalmente expressa por ‘contra’; o nome ‘Israel’ é mantido sem restringir interpretativamente seu referente histórico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. ‘Yahweh’ preserva o nome da aliança sem substituí-lo por um título.
- issue: Sentido da culpa em לְאַשְׁמַת יְהוָה עָלֵינוּ
  choice: culpa diante de Yahweh recaindo sobre os falantes
  alternative: culpa contra Yahweh; culpa proveniente do juízo de Yahweh
  rationale: A construção admite mais de uma relação semântica entre Yahweh e a culpa. O texto principal usa uma expressão portuguesa natural, e a nota preserva as possibilidades sem resolver indevidamente a tensão.
- issue: Referente de יִשְׂרָאֵל
  choice: Israel
  alternative: Efraim; o reino do norte
  rationale: A tradução conserva o termo do texto hebraico e não o restringe a uma identificação histórica interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção natural para leitores brasileiros. O discurso direto mantém o plural ‘vocês’, e os marcadores [a] e [b] foram posicionados junto às expressões que explicam.
