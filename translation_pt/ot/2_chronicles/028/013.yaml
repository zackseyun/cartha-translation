  to: 'E eles lhes disseram: “Não tragam os cativos para cá, pois vocês pretendem acrescentar aos nossos pecados e à nossa culpa, trazendo sobre nós culpa diante de Yahweh[a]. A nossa culpa já é grande, e há ira ardente[b] contra Israel.”'
