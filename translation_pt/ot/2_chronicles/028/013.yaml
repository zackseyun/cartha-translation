  source_fidelity: 'A tradução preserva adequadamente os elementos centrais: os cativos, o movimento “para cá”, a distinção entre pecados e culpa, o nome Yahweh e a ira contra Israel. Contudo, a oração com gerúndio (“trazendo ... culpa ..., acrescentando ...”) torna menos clara a relação sintática do hebraico: o que os destinatários pretendem fazer é acrescentar aos pecados e à culpa já existentes, com a consequência de culpa perante Yahweh recaindo sobre os falantes.'
  naturalness: O português é moderno e compreensível. A revisão substitui a sequência de gerúndios por uma construção mais direta e inequívoca, sem eliminar a ambiguidade semântica da expressão hebraica difícil.
  terminology: “Cativos”, “pecados”, “culpa”, “Yahweh” e “Israel” são escolhas apropriadas. “Ira ardente” conserva a imagem do hebraico e a nota explica o idiomatismo.
