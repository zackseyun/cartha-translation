source:
  edition: WLC
  text: וְ֠/עַתָּה בְּנֵֽי יְהוּדָ֤ה וִֽ/ירוּשָׁלִַ֨ם֙ אַתֶּ֣ם אֹמְרִ֔ים לִ/כְבֹּ֛שׁ לַ/עֲבָדִ֥ים וְ/לִ/שְׁפָח֖וֹת לָ/כֶ֑ם הֲ/לֹ֤א רַק אַתֶּם֙ עִמָּ/כֶ֣ם אֲשָׁמ֔וֹת לַ/יהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/010.yaml
  text: And now[a], you are saying that you will subdue the people of Judah and Jerusalem as male and female slaves for yourselves[c][b]. But do not you yourselves also have guilt before Yahweh your God?
translation:
  language: pt
  text: E agora, vocês dizem que vão subjugar o povo de Judá e de Jerusalém[a] para fazer deles seus escravos e suas escravas[b]. Mas será que vocês mesmos também não têm culpas diante de Yahweh, seu Deus?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “os filhos de Judá e de Jerusalém”. A expressão masculina plural em hebraico refere-se coletivamente ao povo.
    reason: lexical_alternative
  - marker: b
    text: Ou, mais literalmente, “subjugar como escravos e escravas para vocês”.
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico da pergunta final é condensado; literalmente, algo como: “Não há, de fato, com vocês culpas para com Yahweh, seu Deus?”'
    reason: source_ambiguity
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a ligação com o discurso anterior quanto a transição para a repreensão presente.
- source_word: בְּנֵי יְהוּדָה וִירוּשָׁלִַם
  choice: o povo de Judá e de Jerusalém
  rationale: A expressão literalmente masculina, “filhos de”, designa coletivamente a população; “o povo” comunica esse sentido em português atual sem sugerir referência exclusiva a homens.
- source_word: אַתֶּם אֹמְרִים
  choice: vocês dizem
  rationale: Mantém a formulação acusatória imediata do pronome com o particípio, sem transformar silenciosamente a fala em mera intenção.
- source_word: לִכְבֹּשׁ
  choice: subjugar
  rationale: Expressa a ação coerciva de pôr sob domínio, enquanto a frase seguinte explicita que o objetivo é a escravização.
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: para fazer deles seus escravos e suas escravas
  rationale: Distingue explicitamente homens e mulheres reduzidos à escravidão e preserva a força do contexto de cativeiro de guerra.
- source_word: לָכֶם
  choice: seus
  rationale: Comunica de modo natural a ideia de posse e vantagem própria presente no dativo hebraico.
- source_word: הֲלֹא רַק אַתֶּם עִמָּכֶם אֲשָׁמוֹת
  choice: Mas será que vocês mesmos também não têm culpas
  rationale: Reproduz como pergunta retórica a expressão hebraica comprimida, preservando a ênfase na culpa dos próprios destinatários sem impor uma interpretação excessivamente específica ao particípio רַק.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: diante de Yahweh, seu Deus
  rationale: “Diante de” comunica responsabilidade e culpa perante Deus; “Yahweh” representa diretamente o nome divino יהוה.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; a forma “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Condição indicada por עֲבָדִים e שְׁפָחוֹת
  choice: escravos e escravas
  alternative: servos e servas
  rationale: O contexto é de subjugação forçada de cativos de guerra, portanto a linguagem de escravidão expressa com mais precisão a condição imposta.
- issue: Forma da acusação final
  choice: pergunta retórica sobre as culpas dos próprios destinatários
  alternative: afirmação direta de que eles são culpados
  rationale: A partícula interrogativa hebraica deve permanecer perceptível; a tradução conserva a tensão retórica em vez de convertê-la numa declaração simples.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para o plural de segunda pessoa. A construção mantém a repreensão em forma retórica, usa linguagem explícita de escravidão por causa do contexto coercivo e reserva as formulações mais literais para as notas.
