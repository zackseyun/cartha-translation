lexical_decisions:
- source_word: וְעוֹד
  choice: Além disso
  rationale: Introduz mais uma calamidade na sequência de ações hostis contra Judá; a expressão é natural em português e preserva o valor aditivo.
- source_word: אֲדוֹמִים
  choice: os edomitas
  rationale: O gentílico plural designa o povo de Edom.
- source_word: בָּאוּ
  choice: vieram
  rationale: O verbo apresenta a chegada como ação concluída; o pretérito perfeito é natural na narrativa portuguesa.
- source_word: וַיַּכּוּ בִיהוּדָה
  choice: atacaram Judá
  rationale: נכה significa literalmente 'ferir/golpear', mas em contexto militar pode indicar um ataque. A formulação evita afirmar uma derrota total que o hebraico não explicita.
- source_word: וַיִּשְׁבּוּ שֶׁבִי
  choice: levaram cativos
  rationale: O verbo e o substantivo cognato exprimem a captura de pessoas. Esta construção preserva o sentido militar sem reproduzir de modo artificial a repetição etimológica do hebraico.
