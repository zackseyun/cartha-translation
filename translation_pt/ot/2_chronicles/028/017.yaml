  text: The Edomites had also come and attacked Judah and carried away captives[a].
translation:
  language: pt
  text: Além disso, os edomitas vieram, atacaram Judá e levaram cativos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “feriram Judá e fizeram prisioneiros”. O hebraico emprega o verbo militar comum para “ferir” e uma expressão formada por palavras da mesma raiz para indicar a captura de pessoas.'
