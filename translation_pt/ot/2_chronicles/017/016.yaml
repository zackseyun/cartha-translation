source:
  edition: WLC
  text: וְ/עַל יָד/וֹ֙ עֲמַסְיָ֣ה בֶן זִכְרִ֔י הַ/מִּתְנַדֵּ֖ב לַ/יהוָ֑ה וְ/עִמּ֛/וֹ מָאתַ֥יִם אֶ֖לֶף גִּבּ֥וֹר חָֽיִל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/016.yaml
  text: And under his command was Amasiah son of Zichri[a], who volunteered himself to Yahweh, and with him were two hundred thousand mighty men of valor.
translation:
  language: pt
  text: Sob seu comando estava Amasias, filho de Zicri, que se ofereceu voluntariamente a Yahweh[a]; com ele havia duzentos mil guerreiros valentes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que se apresentou voluntariamente para servir a Yahweh”. O particípio hebraico enfatiza a dedicação voluntária da própria pessoa, e a preposição pode ser entendida como “a” ou “para”.'
    reason: Alternativa lexical que preserva a amplitude semântica da dedicação voluntária e da preposição ל.
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: Sob seu comando estava
  rationale: A expressão idiomática עַל יָד, neste contexto de organização militar, indica posição sob a autoridade de alguém. A formulação comunica esse sentido com clareza em português atual.
- source_word: עֲמַסְיָה בֶן זִכְרִי
  choice: Amasias, filho de Zicri
  rationale: Mantém a relação genealógica expressa por בֶן e usa formas portuguesas reconhecíveis dos nomes hebraicos.
- source_word: הַמִּתְנַדֵּב
  choice: que se ofereceu voluntariamente
  rationale: O particípio hitpael de נדב expressa iniciativa voluntária e dedicação pessoal. A oração relativa é natural em português e preserva a nuance reflexiva.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל pode indicar direção ou dedicação; “a” combina naturalmente com “ofereceu-se” e mantém essa relação sem eliminar a possível nuance de serviço em favor de Yahweh.
- source_word: וְעִמּוֹ
  choice: com ele havia
  rationale: Introduz as tropas associadas a Amasias; o verbo acrescentado torna a construção idiomática em português.
- source_word: מָאתַיִם אֶלֶף
  choice: duzentos mil
  rationale: Representação direta do numeral hebraico.
- source_word: גִּבּוֹר חָיִל
  choice: guerreiros valentes
  rationale: No contexto militar, a expressão designa combatentes fortes, capazes e valorosos. Esta tradução preserva o sentido e soa natural em português moderno.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio divino. “Yahweh” o representa diretamente, em vez de substituí-lo por um título, sem acrescentar interpretação denominacional.
- issue: Sentido da dedicação voluntária de Amasias
  choice: que se ofereceu voluntariamente a Yahweh
  alternative: que se apresentou voluntariamente para servir a Yahweh
  rationale: A tradução principal conserva a imagem de autodedicação presente no hitpael e a direção marcada por ל, sem especificar mais do que o hebraico qual forma concreta esse compromisso assumiu.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Guerreiros valentes” evita o arcaísmo de “homens de valor”, enquanto mantém o tom militar elevado. O ponto e vírgula separa com clareza o comandante do contingente sob sua liderança.
