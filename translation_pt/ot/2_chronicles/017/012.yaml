base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/012.yaml
  text: And Jehoshaphat became greater and greater[b][a], and he built fortresses and store cities in Judah.
translation:
  language: pt
  text: Josafá crescia cada vez mais em grandeza e construiu fortalezas[a] e cidades de armazenamento[b] em Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «cidadelas». O termo hebraico designa lugares fortificados.
    reason: lexical_alternative
  - marker: b
    text: Ou «cidades de provisões».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הֹלֵךְ וְגָדֵל עַד לְמָעְלָה
  choice: se tornava cada vez mais poderoso
  rationale: A construção hebraica expressa crescimento contínuo e intensificado. Em português, esta formulação comunica naturalmente o aumento progressivo da grandeza, poder ou posição de Josafá.
- source_word: וַיִּבֶן
  choice: construiu
  rationale: Equivalente direto e natural de בנה neste contexto narrativo.
- source_word: בִּירָנִיּוֹת
  choice: fortalezas
  rationale: O termo designa estruturas ou lugares fortificados; «fortalezas» é claro e evita a conotação medieval de «castelos».
- source_word: עָרֵי מִסְכְּנוֹת
  choice: cidades de armazenamento
  rationale: A expressão indica cidades destinadas a armazenar provisões, suprimentos ou outros bens. A tradução torna explícita sua função sem definir indevidamente o conteúdo armazenado.
- source_word: בִּיהוּדָה
  choice: em Judá
  rationale: Reproduz diretamente a indicação locativa do texto hebraico.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem dos marcadores foi ajustada para que cada nota apareça junto ao termo correspondente. «Cada vez mais poderoso» traduz idiomaticamente o crescimento contínuo e intensificado expresso pelo hebraico.
