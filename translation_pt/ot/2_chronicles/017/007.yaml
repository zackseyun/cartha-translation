  source_fidelity: 'O sentido central está correto: a datação no terceiro ano do reinado, o envio de representantes reais, os cinco nomes, a finalidade de ensinar e o âmbito nas cidades de Judá são preservados. A omissão da conjunção narrativa inicial é aceitável em português.'
