base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/007.yaml
  text: And in the third year of his reign[a], he sent his officials—Ben-hail, Obadiah, Zechariah, Nethanel, and Micaiah—to teach in the cities of Judah.
translation:
  language: pt
  text: No terceiro ano de seu reinado, ele enviou seus oficiais — Ben-Hail, Obadias, Zacarias, Natanael e Micaías — para ensinarem nas cidades de Judá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבִשְׁנַת שָׁלוֹשׁ לְמָלְכוֹ
  choice: No terceiro ano de seu reinado
  rationale: Expressa de modo natural em português a indicação temporal e o período em que ele reinava. A conjunção narrativa inicial não precisa ser reproduzida por “e” neste contexto.
- source_word: שָׁלַח
  choice: ele enviou
  rationale: Equivalente direto e corrente do verbo hebraico de enviar.
- source_word: לְשָׂרָיו
  choice: seus altos funcionários
  rationale: שַׂר designa autoridades, dirigentes ou oficiais. Aqui se refere a representantes do rei, sem necessariamente indicar parentesco real; “altos funcionários” comunica bem seu estatuto administrativo.
- source_word: לְבֶן חַיִל
  choice: Ben-Hail
  rationale: Transliteração do nome próprio, preservando seus dois elementos conforme a forma hebraica.
- source_word: וּלְעֹבַדְיָה וְלִזְכַרְיָה וְלִנְתַנְאֵל וּלְמִיכָיָהוּ
  choice: Obadias, Zacarias, Natanael e Micaías
  rationale: Empregam-se as formas portuguesas tradicionais e reconhecíveis dos nomes hebraicos.
- source_word: לְלַמֵּד
  choice: para ensinarem
  rationale: O infinitivo piel significa “ensinar”. O plural explicita naturalmente em português que os funcionários enviados desempenhariam a tarefa, sem alterar o sentido.
- source_word: בְּעָרֵי יְהוּדָה
  choice: nas cidades de Judá
  rationale: Preserva o valor locativo simples da preposição בְּ, sem acrescentar a ideia distributiva de “por todas”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação evita sugerir que os homens fossem necessariamente membros da família real e mantém a localização simples “nas cidades de Judá”.
