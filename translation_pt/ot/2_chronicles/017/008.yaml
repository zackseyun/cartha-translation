base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/008.yaml
  text: 'And with them were the Levites: Shemaiah[a], Nethaniah, Zebadiah, Asahel, Shemiramoth, Jehonathan, Adonijah, Tobijah, and Tob-adonijah; and with them were Elishama and Jehoram[c][b], the priests.'
translation:
  language: pt
  text: Com eles estavam os levitas Semaías, Netanias, Zebadias, Asael, Semiramote, Jeonatã[a], Adonias, Tobias[b] e Tobe-Adonias[c]. Com eles estavam também os sacerdotes Elisama e Jeorão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz a forma mais longa do nome, correspondente a “Jeonatã”; a forma abreviada correspondente é “Jônatas”.
    reason: lexical_alternative
  - marker: b
    text: Hebraico Toviyahu; também vertido “Tobia”.
    reason: lexical_alternative
  - marker: c
    text: O hebraico escreve “Tobe Adonias” como dois elementos, provavelmente um único nome pessoal composto; por isso, o nome é grafado aqui com hífen.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְעִמָּהֶם
  choice: Com eles estavam
  rationale: A expressão introduz as pessoas que acompanhavam o grupo mencionado anteriormente. O verbo “estavam” é suprido em português para formar uma frase natural, sem alterar o sentido.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: Mantém o artigo definido hebraico e identifica explicitamente os membros da ordem levítica.
- source_word: שְׁמַעְיָהוּ
  choice: Semaías
  rationale: Forma portuguesa convencional do nome hebraico.
- source_word: נְתַנְיָהוּ
  choice: Netanias
  rationale: Transliteração adaptada à ortografia e à pronúncia portuguesas.
- source_word: זְבַדְיָהוּ
  choice: Zebadias
  rationale: Forma bíblica portuguesa reconhecível e próxima do nome hebraico.
- source_word: עֲשָׂהאֵל
  choice: Asael
  rationale: Forma portuguesa convencional do nome pessoal.
- source_word: שמרימות
  choice: Semiramote
  rationale: Translitera a forma consonantal do nome de maneira legível em português.
- source_word: יְהוֹנָתָן
  choice: Jeonatã
  rationale: Representa a forma hebraica mais longa do nome, em vez de reduzi-la à forma tradicional Jônatas.
- source_word: אֲדֹנִיָּהוּ
  choice: Adonias
  rationale: Forma portuguesa tradicional do nome hebraico.
- source_word: טוֹבִיָּהוּ
  choice: Tobias
  rationale: Forma portuguesa convencional e amplamente reconhecida do nome.
- source_word: טוֹב אֲדוֹנִיָּה
  choice: Tobe-Adonias
  rationale: O hífen indica que os dois elementos do texto hebraico provavelmente constituem um único nome composto, sem ocultar sua estrutura.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Preserva a identificação explícita do segundo grupo e o artigo definido do hebraico.
theological_decisions:
- issue: Distinção entre levitas e sacerdotes
  choice: Apresentar os primeiros nomes como levitas e identificar separadamente Elisama e Jeorão como sacerdotes.
  alternative: Tratar todos os nomes da lista simplesmente como levitas.
  rationale: A sintaxe hebraica retoma “com eles” antes de Elisama e Jeorão e então os identifica especificamente como “os sacerdotes”; essa distinção institucional deve ser preservada.
translation_notes:
  register: Português moderno, claro e digno, com formas de nomes adaptadas ao uso bíblico lusófono. A repetição de “Com eles estavam” preserva a estrutura do hebraico; “também” explicita naturalmente a adição do segundo grupo.
