  yaml_path: translation/ot/2_chronicles/017/001.yaml
  text: And Jehoshaphat his son became king in his place, and he strengthened himself against Israel.
translation:
  language: pt
  text: Josafá, seu filho, reinou em seu lugar e fortaleceu-se contra Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: Expressa diretamente a ascensão e o exercício do reinado, com formulação natural em português.
- source_word: יְהוֹשָׁפָט בְּנוֹ
  choice: Josafá, seu filho
  rationale: Preserva o nome tradicional em português e a relação filial explícita no hebraico.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: Equivalente idiomático que mantém a ideia de sucessão ao trono.
- source_word: וַיִּתְחַזֵּק
  choice: fortaleceu-se
  rationale: Mantém a forma reflexiva e a ideia de consolidar a própria força ou posição.
- source_word: עַל יִשְׂרָאֵל
  choice: contra Israel
  rationale: Neste contexto de relações entre Judá e o reino do norte, עַל indica orientação hostil; 'contra' preserva essa força contextual.
theological_decisions:
- issue: Sentido da preposição עַל em relação a Israel
  choice: contra Israel
  alternative: sobre Israel / diante de Israel
  rationale: O contexto imediato da consolidação defensiva de Josafá favorece oposição ou proteção contra o reino de Israel, sem sugerir que ele exerceu domínio sobre Israel.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe concisa e próxima da estrutura hebraica. A colocação de 'seu filho' entre vírgulas evita a leitura equivocada de que Josafá seja filho de alguém chamado no próprio versículo, remetendo naturalmente ao rei anterior no contexto.
