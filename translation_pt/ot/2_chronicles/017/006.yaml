source:
  edition: WLC
  text: וַ/יִּגְבַּ֥הּ לִבּ֖/וֹ בְּ/דַרְכֵ֣י יְהוָ֑ה וְ/ע֗וֹד הֵסִ֛יר אֶת הַ/בָּמ֥וֹת וְ/אֶת הָ/אֲשֵׁרִ֖ים מִ/יהוּדָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/006.yaml
  text: His heart was exalted in the ways of Yahweh[b][a], and furthermore he removed the high places and the Asherim from Judah.
translation:
  language: pt
  text: Seu coração se elevou nos caminhos de Yahweh[a]; além disso, ele retirou de Judá os lugares altos e os postes de Aserá[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seu coração se encheu de coragem” ou “foi encorajado nos caminhos de Yahweh”. O idioma hebraico pode descrever um coração elevado ou fortalecido; aqui, o contexto é positivo, não arrogante.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “asherim”; isto é, objetos de culto associados a Aserá, possivelmente postes ou troncos sagrados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבַּהּ לִבּוֹ
  choice: Seu coração se elevou
  rationale: Preserva a metáfora hebraica de um coração elevado. Neste contexto, a expressão indica coragem ou firmeza na devoção, e não orgulho pecaminoso, sem eliminar por completo a amplitude do idioma.
- source_word: בְּדַרְכֵי יְהוָה
  choice: nos caminhos de Yahweh
  rationale: Mantém a imagem bíblica dos “caminhos” como conduta e modo de vida, além de representar o tetragrama pelo nome divino Yahweh.
- source_word: וְעוֹד
  choice: além disso
  rationale: Expressa com naturalidade a força aditiva da expressão hebraica, que introduz mais uma ação de Josafá.
- source_word: הֵסִיר
  choice: retirou
  rationale: Traduz diretamente o hifil de סור como ação de remover, sem ampliar o sentido para “abolir” ou “destruir”.
- source_word: הַבָּמוֹת
  choice: os lugares altos
  rationale: Emprega a designação tradicional e concisa para os locais de culto chamados בָּמוֹת.
- source_word: הָאֲשֵׁרִים
  choice: os postes de Aserá
  rationale: Torna compreensível ao leitor moderno que se trata de objetos de culto associados a Aserá, embora a forma física exata do referente hebraico não seja inteiramente certa.
- source_word: מִיהוּדָה
  choice: de Judá
  rationale: Na construção “retirou de Judá”, a preposição portuguesa comunica naturalmente a remoção do território de Judá.
theological_decisions:
- issue: Se וַיִּגְבַּהּ לִבּוֹ descreve orgulho ou coragem e firmeza
  choice: 'Manter a metáfora positiva: “Seu coração se elevou nos caminhos de Yahweh”'
  alternative: “Seu coração se encheu de coragem nos caminhos de Yahweh” ou, em sentido negativo, “seu coração se tornou orgulhoso”
  rationale: A qualificação “nos caminhos de Yahweh” e a subsequente remoção de locais e objetos de culto ilícito favorecem uma avaliação positiva. A formulação preserva a metáfora e a possível tensão lexical, enquanto a nota esclarece seu sentido contextual.
- issue: Grau de especificidade na tradução de אֲשֵׁרִים
  choice: postes de Aserá
  alternative: aserins; objetos sagrados; postes sagrados
  rationale: O termo designa objetos cultuais associados à adoração de Aserá. “Postes de Aserá” é acessível e identifica essa associação, enquanto a nota reconhece a incerteza quanto à forma exata dos objetos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com ordem sintática natural. A tradução conserva as imagens hebraicas de “coração” e “caminhos”, usa o nome divino Yahweh e acrescenta notas somente onde a concisão do versículo não comporta toda a ambiguidade lexical.
