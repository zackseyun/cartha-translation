  text: And under his command was Jehohanan the commander[a], and with him were two hundred and eighty thousand.
translation:
  language: pt
  text: E, sob seu comando, estava o comandante Jeoanã[a], e com ele estavam duzentos e oitenta mil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «ao seu lado estava o comandante Jeoanã» ou «sob sua autoridade estava o comandante Jeoanã». A expressão hebraica diz literalmente «sobre a sua mão».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: E, sob seu comando
  rationale: A expressão hebraica, literalmente «sobre/à sua mão», indica neste contexto militar subordinação ou autoridade; «sob seu comando» comunica naturalmente essa relação.
- source_word: יְהוֹחָנָן
  choice: Jeoanã
  rationale: Transliteração portuguesa tradicional e reconhecível do nome hebraico, distinguindo-o da forma abreviada Joanã.
- source_word: הַשַּׂר
  choice: o comandante
  rationale: Embora שַׂר possa designar príncipe, chefe ou oficial, o contexto imediato é militar, favorecendo «comandante».
- source_word: וְעִמּוֹ
  choice: e com ele havia
  rationale: O verbo «havia» é suprido em português para tornar explícita e natural a associação do contingente a Jeoanã.
- source_word: מָאתַיִם וּשְׁמוֹנִים אָלֶף
  choice: duzentos e oitenta mil homens
  rationale: Reproduz exatamente o número; «homens» é uma explicitação contextual do contingente militar contado.
