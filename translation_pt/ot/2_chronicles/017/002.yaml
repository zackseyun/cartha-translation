  text: וַ/יִּ֨תֶּן חַ֔יִל בְּ/כָל עָרֵ֥י יְהוּדָ֖ה הַ/בְּצֻר֑וֹת וַ/יִּתֵּ֤ן נְצִיבִים֙ בְּ/אֶ֣רֶץ יְהוּדָ֔ה וּ/בְ/עָרֵ֣י אֶפְרַ֔יִם אֲשֶׁ֥ר לָכַ֖ד אָסָ֥א אָבִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/002.yaml
  text: And he stationed forces in all the fortified cities of Judah[a], and he placed garrisons in the land of Judah and in the cities of Ephraim that Asa his father had captured.
translation:
  language: pt
  text: Ele estacionou tropas em todas as cidades fortificadas de Judá e estabeleceu guarnições[a] na terra de Judá e nas cidades de Efraim que Asa, seu pai, havia conquistado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “governadores”, “delegados” ou “prefeitos”. O termo hebraico נְצִיבִים pode designar autoridades nomeadas, além de guarnições ou postos militares; o contexto militar aqui favorece “guarnições”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֶּן חַיִל
  choice: estacionou tropas
  rationale: נתן tem o sentido básico de “dar, pôr”, mas, com חַיִל e a indicação de cidades fortificadas, descreve de modo idiomático o posicionamento de forças militares. “Tropas” expressa aqui o sentido militar de חַיִל.
- source_word: בְּכָל עָרֵי יְהוּדָה הַבְּצֻרוֹת
  choice: em todas as cidades fortificadas de Judá
  rationale: Preserva tanto a abrangência de בְּכָל quanto o sentido defensivo de הַבְּצֻרוֹת, em português claro e corrente.
- source_word: וַיִּתֵּן נְצִיבִים
  choice: estabeleceu guarnições
  rationale: O contexto de tropas, cidades fortificadas e territórios conquistados favorece o sentido militar de נְצִיבִים. “Estabeleceu” comunica naturalmente a instalação dessas guarnições sem reproduzir de forma rígida o segundo נתן.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: na terra de Judá
  rationale: Mantém o sentido territorial amplo de אֶרֶץ e o distingue das cidades mencionadas separadamente.
- source_word: וּבְעָרֵי אֶפְרַיִם
  choice: e nas cidades de Efraim
  rationale: Tradução direta da designação tribal e geográfica.
- source_word: אֲשֶׁר לָכַד
  choice: que ... havia conquistado
  rationale: לכד é usado para tomar ou capturar cidades. O mais-que-perfeito composto deixa clara a anterioridade da conquista feita por Asa.
- source_word: אָסָא אָבִיו
  choice: Asa, seu pai
  rationale: A aposição com vírgulas identifica de maneira natural Asa como pai do sujeito, Josafá.
