base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/011.yaml
  text: 'And some of the Philistines were bringing Jehoshaphat tribute and silver[a], a burden[b]; the Arabians also were bringing him flocks: 7,700 rams and 7,700 male goats.'
translation:
  language: pt
  text: 'Alguns dos filisteus traziam a Josafá tributo e uma carga de prata[a]. Também os árabes lhe traziam rebanhos: 7.700 carneiros e 7.700 bodes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Dos filisteus”; o hebraico pode enfatizar a procedência, em vez do sentido partitivo “alguns dos”. A expressão hebraica é literalmente “prata, uma carga”, isto é, prata transportada como tributo.'
    reason: lexical_alternative; cultural_note
lexical_decisions:
- source_word: וּ/מִן פְּלִשְׁתִּים
  choice: Alguns dos filisteus
  rationale: A preposição מִן com um etnônimo pode indicar procedência (“dos filisteus”) ou ter sentido partitivo (“alguns dos filisteus”). O sentido partitivo é natural no contexto, sem implicar cada indivíduo do povo; a alternativa de procedência é preservada em nota.
- source_word: מְבִיאִים
  choice: traziam
  rationale: O particípio expressa ação contínua ou habitual no contexto narrativo; o pretérito imperfeito comunica isso naturalmente em português.
- source_word: מִנְחָה
  choice: tributo
  rationale: No contexto político de povos estrangeiros perante um rei, o termo designa adequadamente tributo, e não uma oferta cultual.
- source_word: וְ/כֶסֶף מַשָּׂא
  choice: e prata, uma carga
  rationale: Preserva os sentidos concretos de כֶּסֶף, “prata”, e מַשָּׂא, “carga”, sem reduzir antecipadamente a expressão a dinheiro ou tributo.
- source_word: גַּם הָעַרְבִיאִים
  choice: Também os árabes
  rationale: Mantém a força aditiva de גַּם e usa a designação corrente e historicamente inteligível do grupo.
- source_word: ל/וֹ צֹאן
  choice: lhe traziam rebanhos
  rationale: צֹאן é um coletivo de animais de pequeno porte, especialmente ovelhas e cabras; “rebanhos” funciona como cabeçalho para os carneiros e bodes especificados em seguida.
- source_word: אֵילִים
  choice: carneiros
  rationale: Equivalente português comum para ovinos machos adultos.
- source_word: שִׁבְעַת אֲלָפִים וּשְׁבַע מֵאוֹת
  choice: '7.700'
  rationale: Algarismos e separador de milhar segundo o uso lusófono moderno favorecem a leitura sem alterar o sentido.
- source_word: וּ/תְיָשִׁים
  choice: bodes
  rationale: O termo hebraico especifica caprinos machos; “bodes” é a equivalência portuguesa direta e natural.
