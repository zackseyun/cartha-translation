  text: וַ/יָּ֨כֶן יְהוָ֤ה אֶת הַ/מַּמְלָכָה֙ בְּ/יָד֔/וֹ וַ/יִּתְּנ֧וּ כָל יְהוּדָ֛ה מִנְחָ֖ה לִ/יהוֹשָׁפָ֑ט וַֽ/יְהִי ל֥/וֹ עֹֽשֶׁר וְ/כָב֖וֹד לָ/רֹֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/005.yaml
  text: So Yahweh established the kingdom in his hand[a], and all Judah gave tribute to Jehoshaphat; and he had riches and honor in abundance.
translation:
  language: pt
  text: Assim, Yahweh firmou o reino na mão de Josafá, e todo Judá lhe deu tributo[a]. Ele teve riquezas e honra em abundância.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “presente”, “dádiva” ou “oferta”. O termo hebraico minḥah tem esses sentidos, mas, neste contexto régio, “tributo” é o mais provável.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּכֶן
  choice: firmou
  rationale: O hifil de כון expressa estabelecer ou tornar firme. “Firmou” preserva a imagem de estabilidade e se ajusta à consolidação do governo real.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הַמַּמְלָכָה בְּיָדוֹ
  choice: o reino nas mãos de Josafá
  rationale: Mantém a metáfora hebraica da mão como esfera de posse e autoridade. A explicitação de “Josafá” evita em português uma possível referência ambígua de “suas mãos” a Yahweh.
- source_word: וַיִּתְּנוּ כָל־יְהוּדָה
  choice: todo o Judá lhe deu
  rationale: Trata Judá como sujeito coletivo e verte נתן pelo sentido direto de dar.
- source_word: מִנְחָה
  choice: tributo
  rationale: Embora o termo possa designar presente ou oferta, o contexto monárquico favorece uma contribuição entregue ao rei como tributo.
- source_word: לִיהוֹשָׁפָט
  choice: a Josafá / lhe
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome; no texto corrido, o pronome “lhe” evita repetição após a explicitação do nome na oração anterior.
- source_word: וַיְהִי לוֹ עֹשֶׁר וְכָבוֹד לָרֹב
  choice: Ele teve riquezas e honra em abundância
  rationale: Expressa de modo natural a construção hebraica de posse, preservando tanto a riqueza material quanto o elevado reconhecimento público indicado por כבוד.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” o preserva como nome, sem convertê-lo em título.
- issue: Agente implícito em בְּיָדוֹ
  choice: Josafá é o referente de “sua mão”
  alternative: Yahweh como referente do sufixo possessivo
  rationale: A construção descreve Yahweh estabelecendo o reino sob a autoridade de Josafá; explicitar o nome em português conserva esse sentido e impede que o possessivo pareça referir-se ao sujeito imediatamente anterior.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara. Conservou-se a metáfora hebraica de o reino estar nas mãos do rei, mas o nome Josafá foi explicitado para evitar ambiguidade. O marcador [a] foi colocado junto de “tributo”, termo ao qual a nota se refere.
