  text: These were the ones serving the king[a], besides those whom the king had stationed in the fortified cities throughout all Judah.
translation:
  language: pt
  text: Esses eram os que serviam ao rei, além daqueles que o rei havia colocado[a] nas cidades fortificadas em todo o território de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «além dos que o rei havia designado para as cidades fortificadas em todo Judá».'
    reason: נתן significa literalmente «dar» ou «colocar», mas, neste contexto militar e administrativo, também pode indicar que o rei havia designado esses homens para tais cidades.
lexical_decisions:
- source_word: אֵלֶּה
  choice: Esses eram
  rationale: O demonstrativo retoma os oficiais e contingentes enumerados anteriormente; o imperfeito em português integra naturalmente a frase ao relato histórico.
- source_word: הַמְשָׁרְתִים אֶת־הַמֶּלֶךְ
  choice: os que serviam ao rei
  rationale: O particípio de שׁרת indica serviço ou assistência, muitas vezes em função oficial. A formulação verbal é clara e evita uma conotação eclesiástica indevida.
- source_word: מִלְּבַד
  choice: além daqueles
  rationale: A expressão acrescenta e distingue outro grupo em relação aos homens recém-enumerados.
- source_word: אֲשֶׁר נָתַן הַמֶּלֶךְ
  choice: que o rei havia colocado
  rationale: נתן tem o sentido básico de dar ou pôr. Aqui descreve a alocação de homens pelo rei; “colocado” conserva a amplitude lexical sem explicitar além do texto que se tratava de um destacamento militar.
- source_word: בְּעָרֵי הַמִּבְצָר
  choice: nas cidades fortificadas
  rationale: A construção designa cidades reforçadas para fins defensivos; “cidades fortificadas” é a expressão portuguesa natural e precisa.
- source_word: בְּכָל יְהוּדָה
  choice: em todo o território de Judá
  rationale: A expressão indica distribuição pela extensão de Judá. A inclusão de “território” torna claro em português que Judá é a região abrangida, sem alterar o referente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A sintaxe mantém a distinção entre os homens que serviam diretamente ao rei e os que haviam sido distribuídos pelas cidades fortificadas.
