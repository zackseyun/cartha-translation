base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/014.yaml
  text: 'And these were their mustered divisions by their fathers’ houses: for Judah[a], the commanders of thousands: Adnah the commander, and with him three hundred thousand mighty men of valor.'
translation:
  language: pt
  text: 'Estas eram as suas divisões mobilizadas,[a] segundo as suas casas paternas: para Judá, os comandantes de milhares: Adná, o comandante, e com ele trezentos mil guerreiros valentes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «seu número» ou «seu alistamento»; o termo hebraico pode indicar um recenseamento militar, uma mobilização ou as tropas organizadas como resultado dela.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדָּתָם
  choice: as suas tropas convocadas
  rationale: No contexto militar, o termo pode indicar o alistamento, a contagem ou as tropas organizadas como resultado da convocação. A formulação escolhida expressa de modo natural tanto o caráter militar quanto o coletivo enumerado a seguir.
- source_word: לְבֵית אֲבוֹתֵיהֶם
  choice: segundo as suas famílias paternas
  rationale: A expressão designa a organização genealógica e administrativa por casas ancestrais. «Famílias paternas» é clara em português moderno e evita a formulação pouco natural «casas de seus pais».
- source_word: לִיהוּדָה
  choice: em Judá
  rationale: Introduz o contingente de Judá na enumeração. «Em Judá» funciona naturalmente como enquadramento da lista, embora «para Judá» também seja possível.
- source_word: שָׂרֵי אֲלָפִים
  choice: os comandantes de mil
  rationale: Título militar para oficiais responsáveis por unidades contadas em milhares. A tradução conserva a forma numérica hebraica sem impor uma patente moderna específica.
- source_word: עַדְנָה הַשָּׂר
  choice: Adná era o comandante
  rationale: O título identifica Adná como comandante do contingente mencionado; a oração com verbo explícito soa natural em português.
- source_word: גִּבּוֹרֵי חַיִל
  choice: guerreiros valentes
  rationale: Expressão militar que descreve combatentes fortes, capazes e valorosos. «Guerreiros valentes» transmite o sentido idiomático com clareza atual.
- source_word: שְׁלֹשׁ מֵאוֹת אָלֶף
  choice: trezentos mil
  rationale: Tradução direta do numeral hebraico, sem ajuste do total transmitido pelo texto.
