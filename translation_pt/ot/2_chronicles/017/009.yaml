base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/009.yaml
  text: They taught in Judah[a], and the Book of the Law of Yahweh was with them[c][b]; they went around through all the cities of Judah and taught among the people.
translation:
  language: pt
  text: Eles ensinaram em Judá, e o Livro da Lei[a] de Yahweh estava com eles; percorreram todas as cidades de Judá e ensinaram no meio do povo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o rolo da instrução de Yahweh”. A palavra hebraica traduzida como “Livro” pode designar um documento escrito em forma de rolo, e “Lei” também pode ser traduzida como “instrução”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ensinaram o povo”. O hebraico diz mais literalmente “ensinaram no meio do povo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְלַמְּדוּ
  choice: ensinaram
  rationale: O piel de למד significa aqui ensinar ou instruir. “Ensinaram” é direto, natural e permite conservar a repetição do verbo no fim do versículo.
- source_word: בִּיהוּדָה
  choice: em Judá
  rationale: A preposição ב indica o lugar da atividade. A referência posterior a todas as cidades já comunica sua extensão territorial.
- source_word: וְעִמָּהֶם
  choice: e ... estava com eles
  rationale: A expressão introduz uma oração nominal de acompanhamento, literalmente “e com eles [estava]”. A forma portuguesa explicita apenas a cópula exigida pela gramática.
- source_word: סֵפֶר תּוֹרַת יְהוָה
  choice: o Livro da Lei de Yahweh
  rationale: סֵפֶר designa o documento escrito, provavelmente em forma de rolo, e תּוֹרָה, nesta expressão, refere-se à instrução legal da aliança. “Livro da Lei” é claro e consagrado em português, sem excluir a realidade material de um rolo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino é transliterado em vez de ser substituído por um título, preservando seu caráter de nome pessoal no texto hebraico.
- source_word: וַיָּסֹבּוּ
  choice: percorreram
  rationale: O verbo סבב descreve o deslocamento de um lugar para outro em circuito. “Percorreram” exprime naturalmente esse movimento pelas cidades.
- source_word: בְּכָל עָרֵי יְהוּדָה
  choice: todas as cidades de Judá
  rationale: Com o verbo de movimento “percorreram”, o complemento direto em português comunica de modo natural a passagem por todas as cidades.
- source_word: וַיְלַמְּדוּ בָּעָם
  choice: e ensinaram no meio do povo
  rationale: A preposição ב apresenta o povo como o âmbito em que o ensino ocorreu, não como objeto direto explícito. “No meio do povo” preserva essa nuance, embora “ensinaram o povo” também seja possível em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico emprega diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal sem substituí-lo pelo título “SENHOR”; “Jeová” é uma forma tradicional alternativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A coordenação das orações e a repetição de “ensinaram” refletem a estrutura hebraica; “percorreram” evita uma formulação excessivamente literal e pouco natural.
