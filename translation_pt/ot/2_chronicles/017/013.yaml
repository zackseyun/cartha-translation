lexical_decisions:
- source_word: מְלָאכָה רַבָּה
  choice: muitas obras
  rationale: מְלָאכָה designa trabalho, obra ou empreendimento. O plural idiomático em português expressa a grande quantidade indicada por רַבָּה sem adotar a leitura textual menos segura de 'propriedades' ou 'suprimentos'.
- source_word: אַנְשֵׁי מִלְחָמָה
  choice: homens de guerra
  rationale: Tradução direta e natural para homens preparados ou designados para a guerra.
- source_word: גִּבּוֹרֵי חַיִל
  choice: guerreiros valentes
  rationale: A expressão descreve combatentes destacados por força, capacidade e bravura; esta formulação evita a redundância pouco natural de 'homens valentes de valor'.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com sintaxe reorganizada apenas para deixar claro que os homens de guerra estavam em Jerusalém. Mantém-se 'obras' como tradução da leitura massorética, sem transformar o termo em 'propriedades'.
