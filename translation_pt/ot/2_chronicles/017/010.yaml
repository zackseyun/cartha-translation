reference: 2 Chronicles 17:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִ֣י פַּ֣חַד יְהוָ֗ה עַ֚ל כָּל מַמְלְכ֣וֹת הָֽ/אֲרָצ֔וֹת אֲשֶׁ֖ר סְבִיב֣וֹת יְהוּדָ֑ה וְ/לֹ֥א נִלְחֲמ֖וּ עִם יְהוֹשָׁפָֽט׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/010.yaml
  text: And the fear of Yahweh came upon all the kingdoms of the lands that were around Judah[a], and they did not make war against Jehoshaphat.
translation:
  language: pt
  text: Então o temor de Yahweh veio sobre todos os reinos das terras ao redor de Judá[a], e eles não guerrearam contra Josafá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o terror vindo de Yahweh” ou “o pavor de Yahweh”. A expressão hebraica pode indicar um temor associado a Yahweh; aqui, provavelmente se refere a um pavor enviado por ele sobre os reinos vizinhos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Então ... veio
  rationale: A construção narrativa com um substantivo abstrato indica o surgimento de uma condição. “Veio” expressa esse início com naturalidade; “então” conecta o acontecimento ao contexto anterior.
- source_word: פַּחַד יְהוָה
  choice: o temor de Yahweh
  rationale: פַּחַד pode significar temor, pavor ou terror, e a relação construta admite tanto o temor associado a Yahweh quanto o terror por ele enviado. A formulação direta preserva essa abertura sem enfraquecer o contexto de medo incapacitante.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: עַל
  choice: sobre
  rationale: Marca os reinos atingidos pelo temor e corresponde naturalmente à imagem de uma condição que vem sobre alguém.
- source_word: כָּל מַמְלְכוֹת הָאֲרָצוֹת
  choice: todos os reinos das terras
  rationale: Mantém os dois substantivos do hebraico — “reinos” e “terras” — sem reduzir a expressão a apenas “países vizinhos”.
- source_word: אֲשֶׁר סְבִיבוֹת יְהוּדָה
  choice: ao redor de Judá
  rationale: Expressa de modo claro e conciso a localização dos territórios circundantes; a relação com “terras” permanece evidente.
- source_word: וְלֹא נִלְחֲמוּ עִם
  choice: e eles não guerrearam contra
  rationale: O verbo no nifal tem aqui o sentido de travar guerra ou combater. “Guerrearam contra” preserva o caráter político-militar e é natural no registro narrativo.
- source_word: יְהוֹשָׁפָט
  choice: Josafá
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Sentido de “o temor de Yahweh” no contexto
  choice: Manter a expressão genitival aberta, com o contexto sugerindo um pavor causado por Yahweh
  alternative: Explicitar no texto “o terror enviado por Yahweh” ou entender como reverência devocional a Yahweh
  rationale: O contexto político-militar favorece um medo divinamente provocado que impede a guerra, mas a sintaxe hebraica não explicita isoladamente a relação causal. O texto principal preserva a ambiguidade genuína, e a nota informa as possibilidades.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Yahweh” preserva o nome divino; “Josafá” segue a forma portuguesa consagrada. A sintaxe evita arcaísmos sem perder a cadência narrativa.
