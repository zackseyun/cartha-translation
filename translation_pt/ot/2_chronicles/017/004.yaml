base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/004.yaml
  text: but he sought the God of his father and walked in his commandments[b][a], and not according to the deeds of Israel.
translation:
  language: pt
  text: mas[a] buscou o Deus de seu pai e andou nos seus mandamentos, e não segundo as práticas de Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois buscou o Deus de seu pai”. A conjunção hebraica também pode ser traduzida por “pois” ou “porque”; “mas” destaca o contraste com o versículo anterior.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “Israel” provavelmente se refere ao reino do norte, em contraste com Judá.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: mas
  rationale: Embora a conjunção costume significar “pois” ou “porque”, aqui o contexto favorece valor adversativo, contrastando a conduta de Josafá com a mencionada no versículo anterior.
- source_word: לֵאלֹהֵי אָבִיו
  choice: o Deus de seu pai
  rationale: Com דָּרַשׁ, a preposição לְ marca o objeto da busca; em português, a construção natural é “buscar o Deus”. A formulação preserva o singular “pai”.
- source_word: דָּרָשׁ
  choice: buscou
  rationale: No contexto da relação com Deus, o verbo expressa procura devocional e orientação da vida, não apenas consulta por informação.
- source_word: וּבְמִצְוֺתָיו הָלָךְ
  choice: e andou nos seus mandamentos
  rationale: Preserva a metáfora hebraica de andar como modo de viver, mantendo uma formulação compreensível e digna em português.
- source_word: כְּמַעֲשֵׂה
  choice: segundo as práticas de
  rationale: מַעֲשֶׂה, neste contexto, indica conduta ou maneira habitual de agir; “práticas” comunica isso de modo mais natural que o literal “obra”.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém o nome presente no hebraico, sem inserir no texto principal a identificação contextual com o reino do norte.
theological_decisions:
- issue: Referente de “Israel”
  choice: Manter “Israel” sem expansão interpretativa.
  alternative: “o reino de Israel” ou “o reino do norte”
  rationale: O hebraico diz simplesmente “Israel”. Embora o contexto provavelmente aponte para o reino do norte em contraste com Judá, explicitar isso no texto principal resolveria uma questão interpretativa que convém preservar em nota.
- issue: Relação lógica de כִּי com o contexto anterior
  choice: Traduzir por “mas” no texto principal.
  alternative: “pois” ou “porque”
  rationale: O contraste contextual favorece “mas”, mas a conjunção hebraica também admite valor explicativo ou causal; essa ambiguidade genuína é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A metáfora bíblica “andou nos seus mandamentos” foi preservada por ser inteligível e teologicamente expressiva. Os marcadores foram colocados após “Israel” para não interromper a fluidez da frase; as notas distinguem a alternativa conjuntiva e o provável referente histórico.
