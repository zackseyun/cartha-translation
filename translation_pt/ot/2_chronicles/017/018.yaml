base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/018.yaml
  text: And at his side was Jehozabad[b][a], and with him were 180,000 armed for war.
translation:
  language: pt
  text: Ao lado dele[a] estava Jeozabade, e com ele havia 180.000 homens armados para a guerra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “à sua mão”; a expressão também pode indicar que ele estava sob a direção de alguém ou posicionado junto dele.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “180.000 soldados equipados para a guerra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: Ao lado dele
  rationale: A expressão significa literalmente “à sua mão” e, nesta lista militar, indica associação ou posição junto de alguém. “Ao lado dele” conserva essa imagem sem impor a interpretação mais específica “sob seu comando”.
- source_word: יְהוֹזָבָד
  choice: Jeozabade
  rationale: Transliteração tradicional e reconhecível do nome hebraico em português.
- source_word: וְעִמּוֹ
  choice: e com ele havia
  rationale: A preposição expressa companhia ou associação; “havia” completa naturalmente a oração em português diante do número de homens.
- source_word: מֵאָה וּשְׁמוֹנִים אֶלֶף
  choice: '180.000'
  rationale: Representação numérica moderna e clara do cardinal hebraico em um contexto de contingentes militares.
- source_word: חֲלוּצֵי צָבָא
  choice: homens armados para a guerra
  rationale: A expressão descreve pessoas equipadas ou preparadas para o serviço militar. A tradução preserva tanto a ideia de armamento quanto a finalidade bélica, sem pressupor um termo técnico mais estrito como “tropas”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Emprega “Jeozabade”, forma tradicional em português, e pontuação numérica conforme o uso lusófono. Mantém a possível ambiguidade hierárquica de וְעַל יָדוֹ em nota.
