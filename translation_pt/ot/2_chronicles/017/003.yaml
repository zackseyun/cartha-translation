base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/003.yaml
  text: And Yahweh was with Jehoshaphat[a], because he walked in the former ways of David his father and did not seek the Baals.
translation:
  language: pt
  text: E Yahweh estava com Josafá, porque ele andou nos caminhos anteriores[a] de Davi, seu pai, e não buscou os baalins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nos primeiros caminhos de Davi, seu pai”. O hebraico parece distinguir a conduta inicial de Davi de sua conduta posterior.'
    reason: Alternativa lexical para o adjetivo hebraico, com esclarecimento da nuance temporal.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, em vez de substituí-lo por um título.
- source_word: וַיְהִי ... עִם
  choice: estava com
  rationale: Expressa naturalmente o idioma hebraico de presença e apoio divinos.
- source_word: כִּי
  choice: porque
  rationale: Torna clara a relação causal apresentada pelo texto.
- source_word: הָלַךְ בְּדַרְכֵי
  choice: andou nos ... caminhos
  rationale: Preserva a metáfora ética hebraica, conhecida e compreensível em português bíblico atual.
- source_word: דָּוִיד אָבִיו
  choice: Davi, seu pai
  rationale: Mantém a linguagem dinástica de parentesco do original, na qual 'pai' pode designar um antepassado.
- source_word: הָרִאשֹׁנִים
  choice: primeiros
  rationale: É a correspondência mais direta ao plural definido hebraico e conserva a possível referência à conduta inicial de Davi sem transformar a inferência em explicação no corpo do versículo.
- source_word: דָרַשׁ
  choice: buscou
  rationale: Preserva a amplitude religiosa do verbo, que pode envolver procurar orientação, recorrer ou prestar devoção.
- source_word: לַבְּעָלִים
  choice: os baalins
  rationale: Mantém explicitamente o plural hebraico, indicando as diversas manifestações ou formas locais de Baal.
theological_decisions:
- issue: Davi como modelo apesar de suas falhas posteriores
  choice: os primeiros caminhos de Davi
  alternative: os caminhos anteriores de Davi
  rationale: O adjetivo hebraico limita a comparação a uma fase ou conjunto inicial dos caminhos de Davi. A tradução mantém essa delimitação, mas evita definir no texto principal exatamente quais falhas posteriores estão em vista.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Conservam-se o nome divino Yahweh, a metáfora de andar em caminhos e o plural cultual “baalins”.
