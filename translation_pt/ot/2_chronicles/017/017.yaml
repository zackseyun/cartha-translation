  yaml_path: translation/ot/2_chronicles/017/017.yaml
  text: 'And from Benjamin: Eliada[a], a mighty man of valor, and with him two hundred thousand armed with bow and shield.'
translation:
  language: pt
  text: 'E de Benjamim: Eliada, guerreiro valente, e com ele duzentos mil homens armados de arco e escudo[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “portando arcos e escudos” ou “equipados com arco e escudo”. O particípio hebraico indica homens munidos dessas armas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: E, de
  rationale: Mantém a ligação aditiva com a lista anterior e introduz o contingente procedente da tribo de Benjamim.
- source_word: בִּנְיָמִן
  choice: Benjamim
  rationale: Forma portuguesa consagrada do nome tribal.
- source_word: גִּבּוֹר חַיִל
  choice: guerreiro valente
  rationale: Expressa de modo natural e digno tanto a força militar quanto a valentia atribuídas a Eliada.
- source_word: אֶלְיָדָע
  choice: Eliada
  rationale: Transliteração portuguesa tradicional do nome próprio.
- source_word: וְעִמּוֹ
  choice: e com ele
  rationale: Preserva a estrutura da lista, na qual o comandante é citado antes dos homens sob seu comando.
- source_word: נֹשְׁקֵי
  choice: armados de
  rationale: O particípio descreve homens munidos ou equipados com as armas mencionadas a seguir.
- source_word: קֶשֶׁת וּמָגֵן
  choice: arco e escudo
  rationale: Os substantivos singulares têm sentido coletivo e designam o equipamento dos soldados.
- source_word: מָאתַיִם אָלֶף
  choice: duzentos mil homens
  rationale: Traduz diretamente o número; “homens” é explicitado em português a partir do referente masculino plural do particípio.
