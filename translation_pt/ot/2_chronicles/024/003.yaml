  source_fidelity: O hebraico נשים, no contexto inequívoco de tomada em casamento, deve ser traduzido por “esposas”, não pelo termo genérico “mulheres”. A construção “para ele” preserva corretamente o beneficiário não nomeado; a continuidade verbal admite a leitura contextual de que Joás gerou os filhos, embora a leitura com Joiada como sujeito permaneça possível.
  naturalness: “Joiada tomou para ele duas esposas e gerou filhos e filhas” é claro, digno e natural em português bíblico moderno. A omissão do segundo pronome pessoal evita reforçar artificialmente a identificação de Joiada como sujeito de “gerou”.
  terminology: “Joiada” é a forma portuguesa bíblica corrente para Jehoiada. “Esposas” traduz adequadamente o sentido matrimonial de נשים neste contexto, e “filhos e filhas” mantém a distinção do hebraico.
