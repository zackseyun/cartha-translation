    rationale: “Joiada” é a forma tradicional e amplamente usada nas traduções bíblicas portuguesas, favorecendo reconhecimento e consistência onomástica.
  - severity: low
    issue: Pronome explícito “ele” na segunda oração
    rationale: Embora não elimine toda possibilidade contextual de mudança de referente, o pronome torna mais saliente a retomada de Joiada. A forma verbal sem sujeito expresso reproduz melhor a concisão e a tensão referencial do hebraico.
