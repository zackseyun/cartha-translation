base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/003.yaml
  text: Jehoiada took for him two wives[a], and he fathered sons and daughters.
translation:
  language: pt
  text: Joiada tomou para ele duas esposas[a] e gerou filhos e filhas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, menos provavelmente: “Joiada tomou duas esposas e gerou filhos e filhas”, se Joiada for entendido como o sujeito de todo o versículo.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: tomou
  rationale: O verbo נשׂא, com נָשִׁים, pode expressar tomar mulheres em casamento. A construção com לֹו indica aqui que Jeoiada agiu em benefício de Joás; a formulação preserva a concisão e parte da estrutura hebraica.
- source_word: לֹו
  choice: para ele
  rationale: A preposição com sufixo marca o beneficiário da ação e mantém explícito, sem identificar além do texto, o referente masculino.
- source_word: יְהוֹיָדָע
  choice: Jeoiada
  rationale: Forma tradicional e amplamente reconhecível do nome em português.
- source_word: נָשִׁים שְׁתָּיִם
  choice: duas mulheres
  rationale: Neste contexto, as mulheres são esposas; 'duas mulheres' combina naturalmente com 'tomou para ele' e evita a construção pouco idiomática 'tomou duas esposas' quando Jeoiada organiza o casamento para outra pessoa.
- source_word: וַיּוֹלֶד
  choice: ele gerou
  rationale: No hifil, ילד com sujeito masculino significa gerar ou tornar-se pai. O pronome explícito em português conserva a ambiguidade do sujeito implícito no hebraico, embora o contexto favoreça Joás.
- source_word: בָּנִים וּבָנוֹת
  choice: filhos e filhas
  rationale: Preserva a distinção explícita entre descendentes masculinos e femininos.
theological_decisions:
- issue: Referente do beneficiário e sujeito de וַיּוֹלֶד
  choice: Jeoiada providenciou duas mulheres para Joás, e Joás gerou filhos e filhas.
  alternative: Jeoiada tomou para si duas mulheres e gerou filhos e filhas.
  rationale: O contexto narrativo está centrado em Joás, e לֹו ('para ele') indica com mais probabilidade que Jeoiada agiu em favor do rei. Contudo, Jeoiada é o sujeito expresso mais próximo, de modo que a leitura alternativa é gramaticalmente possível. O texto principal mantém o pronome sem resolver silenciosamente a ambiguidade, e a nota registra a alternativa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e inteligibilidade internacional. A formulação preserva a ambiguidade real do hebraico quanto ao sujeito da segunda oração; a nota esclarece a leitura minoritária possível.
