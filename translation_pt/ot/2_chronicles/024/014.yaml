base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/014.yaml
  text: When they had finished[a], they brought the rest of the silver before the king and Jehoiada, and with it he made articles for the house of Yahweh, articles for ministry and for offering up, and bowls, and articles of gold and silver[c][b]. And they were offering burnt offerings in the house of Yahweh continually all the days of Jehoiada.
translation:
  language: pt
  text: 'Quando terminaram, levaram o restante da prata à presença do rei e de Joiada. Com ela, ele fez[a] utensílios para a casa de Yahweh: utensílios para o serviço e para oferecer[b], taças e utensílios de ouro e de prata. E ofereciam holocaustos continuamente na casa de Yahweh durante todos os dias de Joiada.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O verbo hebraico está no singular: “ele fez”, e seu sujeito não é identificado expressamente. O sufixo singular em “com ela” refere-se ao restante da prata.'
    reason: ambiguity
  - marker: b
    text: Literalmente, “para fazer subir”. O hebraico não declara aqui o que era oferecido, embora os holocaustos sejam mencionados expressamente no fim do versículo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְכַלּוֹתָם
  choice: Quando terminaram
  rationale: A construção temporal introduz a ação seguinte. O sujeito plural é mantido sem explicitar o objeto, que também não está expresso nesta forma hebraica.
- source_word: שְׁאָר הַכֶּסֶף
  choice: o restante da prata
  rationale: שְׁאָר indica o que restou, e כֶּסֶף é entendido materialmente como prata porque dela são feitos utensílios.
- source_word: וַיַּעֲשֵׂהוּ
  choice: Com ela, ele fez
  rationale: Preserva o verbo hebraico no singular e retoma naturalmente a prata, sem substituir a construção por uma passiva nem identificar de modo absoluto o sujeito implícito.
- source_word: כֵלִים
  choice: utensílios
  rationale: Termo amplo, natural em português e apropriado para objetos usados no culto do templo.
- source_word: כְּלֵי שָׁרֵת
  choice: utensílios para o serviço
  rationale: שָׁרֵת designa serviço ou ministério cultual. 'Serviço' é claro e evita restringir o termo a uma concepção eclesiástica posterior de ministério.
- source_word: וְהַעֲלוֹת
  choice: para oferecer
  rationale: O infinitivo de עלה indica a ação de fazer subir ou apresentar uma oferta, mas o objeto não está expresso. A formulação portuguesa conserva essa elipse.
- source_word: וְכַפּוֹת
  choice: taças
  rationale: כַּפּוֹת pode designar recipientes cultuais de forma exata incerta; 'taças' é uma tradução corrente e suficientemente ampla.
- source_word: וַיִּהְיוּ מַעֲלִים עֹלוֹת
  choice: continuaram oferecendo holocaustos
  rationale: A construção verbal, reforçada por תָּמִיד, expressa atividade duradoura ou habitual. 'Continuaram oferecendo' comunica essa continuidade em português natural.
- source_word: תָּמִיד
  choice: durante todos os dias de Joiada
  rationale: A ideia de constância é expressa pela locução verbal 'continuaram oferecendo' e delimitada pela frase temporal do próprio texto; evita-se a redundância pouco natural de 'continuamente durante todos os dias'.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Mantém o nome pactual representado diretamente pelo Tetragrama, sem substituí-lo por um título.
- issue: Aspecto da atividade sacrificial final
  choice: continuaram oferecendo holocaustos
  alternative: ofereceram holocaustos
  rationale: A construção hebraica com particípio e תָּמִיד apresenta uma prática contínua ou habitual ao longo da vida de Joiada, e não apenas um acontecimento pontual.
- issue: Sujeito singular de וַיַּעֲשֵׂהוּ
  choice: ele fez, com nota sobre a referência provável
  alternative: Joiada fez; foram feitos
  rationale: O hebraico traz verbo singular, mas não repete nominalmente o sujeito. O texto português preserva o singular e a nota reconhece a referência provável sem eliminar a pequena ambiguidade sintática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas usuais no Brasil. 'Casa de Yahweh' preserva a expressão hebraica, enquanto 'holocaustos' mantém o termo cultual reconhecível. A enumeração foi pontuada com dois-pontos para clareza, sem alterar suas relações sintáticas.
