  text: וַ/יְהִ֡י בְּ/עֵת֩ יָבִ֨יא אֶת הָֽ/אָר֜וֹן אֶל פְּקֻדַּ֣ת הַ/מֶּלֶךְ֮ בְּ/יַ֣ד הַ/לְוִיִּם֒ וְ/כִ/רְאוֹתָ֞/ם כִּי רַ֣ב הַ/כֶּ֗סֶף וּ/בָ֨א סוֹפֵ֤ר הַ/מֶּ֨לֶךְ֙ וּ/פְקִיד֙ כֹּהֵ֣ן הָ/רֹ֔אשׁ וִ/יעָ֨רוּ֙ אֶת הָ֣/אָר֔וֹן וְ/יִשָּׂאֻ֖/הוּ וִֽ/ישִׁיבֻ֣/הוּ אֶל מְקֹמ֑/וֹ כֹּ֤ה עָשׂוּ֙ לְ/י֣וֹם בְּ/י֔וֹם וַ/יַּֽאַסְפוּ כֶ֖סֶף לָ/רֹֽב־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/011.yaml
  text: And whenever the chest was brought by the Levites to the king’s oversight[a], and when they saw that the money was abundant, the king’s scribe and the chief priest’s officer would come and empty the chest, then carry it and return it to its place. Thus they did day by day[b], and they gathered money in abundance.
translation:
  language: pt
  text: Sempre que os levitas levavam o cofre[a] para a fiscalização do rei e se via que havia muito dinheiro[b], vinham o escrivão do rei e o oficial do sumo sacerdote, esvaziavam o cofre e depois o levavam de volta ao seu lugar. Faziam isso dia após dia e arrecadavam dinheiro em abundância.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “a arca”; aqui, o termo hebraico se refere ao cofre de arrecadação, não à arca da aliança.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “prata”; neste contexto administrativo, o termo se refere ao dinheiro arrecadado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרוֹן
  choice: o cofre
  rationale: No contexto, trata-se do recipiente destinado à coleta de ofertas, não da arca da aliança. “Cofre” é claro e natural em português.
- source_word: פְּקֻדַּת הַמֶּלֶךְ
  choice: a fiscalização do rei
  rationale: A expressão indica supervisão ou inspeção oficial no contexto administrativo da arrecadação.
- source_word: בְּיַד הַלְוִיִּם
  choice: os levitas levavam
  rationale: A construção hebraica marca a atuação dos levitas como agentes do transporte; a forma verbal explícita produz português natural.
- source_word: וְכִרְאוֹתָם
  choice: quando se via
  rationale: O sufixo plural não tem antecedente inequívoco no contexto imediato. A construção impessoal preserva essa abertura sem atribuir a observação arbitrariamente aos levitas ou aos oficiais.
- source_word: רַב הַכֶּסֶף
  choice: havia muito dinheiro
  rationale: כֶּסֶף pode significar “prata” ou “dinheiro”; no contexto de arrecadação, “dinheiro” comunica melhor a função.
- source_word: סוֹפֵר הַמֶּלֶךְ
  choice: o escrivão do rei
  rationale: Mantém o caráter histórico do cargo administrativo e é compreensível em português atual.
- source_word: פְקִיד כֹּהֵן הָרֹאשׁ
  choice: o oficial do sumo sacerdote
  rationale: A cadeia construta designa um oficial ligado ou subordinado ao sacerdote principal, sem definir com precisão um posto como “deputado”.
- source_word: וִיעָרוּ אֶת הָאָרוֹן
  choice: esvaziavam o cofre
  rationale: O verbo descreve a retirada do conteúdo do recipiente; “esvaziar” é a expressão idiomática adequada.
- source_word: וְיִשָּׂאֻהוּ וִישִׁיבֻהוּ אֶל מְקֹמוֹ
  choice: o levavam de volta ao seu lugar
  rationale: A formulação expressa naturalmente o ato de pegar ou transportar o cofre e recolocá-lo onde estava.
- source_word: כֹּה עָשׂוּ לְיוֹם בְּיוֹם
  choice: Faziam isso dia após dia
  rationale: Reproduz de modo natural o sentido iterativo da expressão hebraica.
- source_word: וַיַּאַסְפוּ כֶסֶף לָרֹב
  choice: arrecadaram muito dinheiro
  rationale: “Arrecadar” se ajusta ao contexto de contribuições, e “muito” representa o valor quantitativo de לָרֹב.
