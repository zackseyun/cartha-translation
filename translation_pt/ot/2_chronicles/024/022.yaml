  text: וְ/לֹא זָכַ֞ר יוֹאָ֣שׁ הַ/מֶּ֗לֶךְ הַ/חֶ֨סֶד֙ אֲשֶׁ֨ר עָשָׂ֜ה יְהוֹיָדָ֤ע אָבִי/ו֙ עִמּ֔/וֹ וַֽ/יַּהֲרֹ֖ג אֶת בְּנ֑/וֹ וּ/כְ/מוֹת֣/וֹ אָמַ֔ר יֵ֥רֶא יְהוָ֖ה וְ/יִדְרֹֽשׁ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/022.yaml
  text: But King Joash did not remember the kindness that Jehoiada his father had shown him[a], and he killed his son. As he was dying, he said[c][b], “May Yahweh see and require it.”
translation:
  language: pt
  text: 'Mas o rei Joás não se lembrou da bondade[a] que Joiada, seu pai[b], lhe havia demonstrado, e matou o filho de Joiada. Ao morrer, o filho de Joiada disse: “Que Yahweh veja e peça contas disso[c]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da lealdade” ou “do amor fiel”.
    reason: lexical_alternative
  - marker: b
    text: “Seu pai” provavelmente se refere ao papel paterno de Joiada para com Joás, e não à paternidade biológica.
    reason: cultural_note
  - marker: c
    text: Ou “Que Yahweh veja e o exija”. O verbo hebraico pode significar procurar ou investigar uma transgressão a fim de responsabilizar o culpado.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֶסֶד
  choice: a bondade
  rationale: חֶסֶד pode expressar bondade, lealdade ou amor fiel. Neste contexto de uma relação humana, “bondade” é natural e preserva o peso moral do benefício recebido sem restringir o termo a uma formulação estritamente pactual.
- source_word: זָכַר
  choice: não se lembrou
  rationale: Mantém o sentido básico de “lembrar-se”, deixando que o contexto comunique a ingratidão e a consequente falta de ação leal.
- source_word: אָבִיו
  choice: seu pai
  rationale: Reproduz literalmente o hebraico e preserva a possível dimensão honorífica ou paterna da relação de Joiada com Joás, sem convertê-la em paternidade biológica.
- source_word: וַיַּהֲרֹג אֶת־בְּנוֹ
  choice: e matou o filho dele
  rationale: Expressa de modo direto que Joás matou o filho de Joiada. “Dele” reduz em português a possibilidade de entender que Joás matou o próprio filho.
- source_word: וּכְמוֹתוֹ
  choice: Ao morrer
  rationale: A construção temporal situa as palavras no momento da morte; a formulação portuguesa é concisa e natural, sem decidir se a referência é ao processo de morrer ou ao instante final.
- source_word: יֵרֶא יְהוָה
  choice: Que Yahweh veja
  rationale: O jussivo é apresentado como apelo ou desejo, não como simples afirmação futura. O nome divino é transliterado como “Yahweh”.
- source_word: וְיִדְרֹשׁ
  choice: e peça contas disso
  rationale: דרש, em contexto de injustiça e culpa de sangue, pode indicar investigar, exigir ou responsabilizar. “Peça contas disso” comunica o acerto judicial sem explicitar vingança além do texto.
theological_decisions:
- issue: Natureza do apelo final de Zacarias
  choice: Pedido para que Yahweh veja a injustiça e exija prestação de contas
  alternative: Pedido explícito de vingança ou simples afirmação de que Yahweh vê
  rationale: As formas jussivas sustentam um apelo, enquanto דרש sugere apuração e responsabilização. A tradução conserva a tensão entre justiça e vingança sem identificar as duas.
- issue: Relação designada por “seu pai”
  choice: Manter a expressão literal e explicá-la em nota
  alternative: Substituir por “seu protetor”, “seu mentor” ou “como um pai para ele”
  rationale: O hebraico usa אָב, e a relação paterna pode ser funcional ou honorífica. Reformulá-la no texto eliminaria uma nuance genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Emprega “Joás” e “Joiada”, formas bíblicas correntes em português, e preserva “Yahweh” como nome pessoal divino. A construção evita linguagem denominacional e mantém a concisão narrativa do hebraico.
