base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/012.yaml
  text: And the king and Jehoiada gave it to those doing the work of the service of the house of Yahweh[a], and they hired stonecutters and craftsmen to restore the house of Yahweh[c][b], and also craftsmen in iron and bronze to strengthen the house of Yahweh.
translation:
  language: pt
  text: O rei e Joiada o entregaram[a] aos que executavam a obra do serviço da casa de Yahweh. O rei e Joiada contrataram cortadores de pedra e artesãos para restaurar a casa de Yahweh[b], e também artesãos que trabalhavam com ferro e bronze[c], a fim de reforçar a casa de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O pronome se refere, pelo contexto, ao dinheiro arrecadado. Também se pode traduzir: “deram-no” ou “passaram-no”.'
    reason: lexical_alternative
  - marker: b
    text: A “casa de Yahweh” é o templo.
    reason: clarification
  - marker: c
    text: 'Ou: “artífices de ferro e bronze”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֵהוּ
  choice: o entregaram
  rationale: Mantém o objeto pronominal masculino singular do hebraico, cujo referente contextual é o dinheiro arrecadado, sem explicitá-lo no corpo do versículo.
- source_word: אֶל עוֹשֵׂה מְלֶאכֶת עֲבוֹדַת בֵּית יְהוָה
  choice: aos que faziam o trabalho do serviço da casa de Yahweh
  rationale: Preserva a formulação hebraica deliberadamente encadeada e evita acrescentar a ideia não expressa de supervisão ou administração.
- source_word: בֵּית יְהוָה
  choice: casa de Yahweh
  rationale: Reproduz de perto a expressão hebraica e mantém sua imagem própria; no contexto, refere-se ao templo.
- source_word: וַיִּהְיוּ שֹׂכְרִים
  choice: Eles contrataram
  rationale: Expressa em português corrente a construção hebraica com היה e particípio, que descreve a contratação dos trabalhadores.
- source_word: חֹצְבִים
  choice: cortadores de pedra
  rationale: No contexto da restauração de um edifício, designa trabalhadores que cortavam ou lavravam pedra.
- source_word: חָרָשִׁים
  choice: artesãos
  rationale: O termo pode designar trabalhadores especializados de modo amplo; a tradução evita restringi-lo indevidamente a carpinteiros.
- source_word: לְחַדֵּשׁ
  choice: restaurar
  rationale: Comunica a ideia causativa de tornar novo novamente, adequada à renovação da casa de Yahweh.
- source_word: לְחָרָשֵׁי בַרְזֶל וּנְחֹשֶׁת
  choice: artesãos que trabalhavam com ferro e bronze
  rationale: Identifica com clareza os trabalhadores especializados nesses metais sem limitar o termo necessariamente a ferreiros.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: É a equivalência contextual habitual em passagens bíblicas relativas a materiais de construção e utensílios.
- source_word: לְחַזֵּק
  choice: reforçar
  rationale: Transmite naturalmente em português a ação de tornar estruturalmente forte o edifício.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o nome divino, não um título. A transliteração preserva essa distinção e evita substituir o nome por uma designação confessional tradicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura um pouco incomum de “trabalho do serviço” foi mantida para refletir o encadeamento do hebraico sem introduzir a noção interpretativa de supervisão. O pronome “Eles” conserva a possibilidade contextual de mais de um antecedente, em vez de resolver silenciosamente a referência.
