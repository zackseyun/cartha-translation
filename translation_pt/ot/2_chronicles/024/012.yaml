  verdict: revise
  source_fidelity: 'A tradução transmite adequadamente a sequência do hebraico: o rei e Joiada entregam o valor arrecadado, contratam trabalhadores especializados para restaurar a casa de Yahweh e para a reforçar. «Bronze» é contextual e lexicalmente apropriado para נְחֹשֶׁת.'
  naturalness: «Aos que faziam o trabalho do serviço» é compreensível, mas soa excessivamente literal e pouco idiomático em português moderno. «Aos que executavam a obra do serviço» preserva a estrutura encadeada do hebraico com maior fluidez. A repetição explícita de «o rei e Joiada» no segundo período elimina uma ambiguidade de antecedente desnecessária para «Eles».
  terminology: «Joiada», «Yahweh», «casa de Yahweh», «cortadores de pedra», «artesãos», «restaurar» e «reforçar» são escolhas adequadas. A nota c deve oferecer uma alternativa efetivamente correspondente ao termo amplo para artesãos especializados em metal, sem a formulação tautológica «ferreiros que trabalhavam com ferro».
