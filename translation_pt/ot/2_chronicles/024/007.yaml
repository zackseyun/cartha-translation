base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/007.yaml
  text: For Athaliah[a], that wicked woman, and her sons had broken into the house of God and had also made all the holy things of the house of Yahweh for the Baals.
translation:
  language: pt
  text: Pois Atalia, aquela mulher perversa, e seus filhos haviam arrombado a casa de Deus e também usado todos os objetos sagrados da casa de Yahweh no culto aos baalins.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “fizeram todos os objetos sagrados da casa de Yahweh para os baalins”. Neste contexto, o verbo provavelmente indica que esses objetos foram apropriados ou empregados no culto aos baalins.'
    reason: alternativa lexical
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da ordem dada no contexto anterior, preservando a força causal-explicativa do hebraico.
- source_word: עֲתַלְיָהוּ הַמִּרְשַׁעַת
  choice: Atalia, aquela mulher perversa
  rationale: Emprega a forma portuguesa tradicional do nome e explicita o feminino do qualificativo hebraico, com a força enfática do artigo na aposição.
- source_word: בָּנֶיהָ
  choice: seus filhos
  rationale: Mantém o substantivo masculino plural do texto hebraico, que pode designar filhos homens.
- source_word: פָרְצוּ אֶת בֵּית הָאֱלֹהִים
  choice: haviam violado a casa de Deus
  rationale: O verbo פרץ descreve uma ruptura ou invasão violenta. “Violar” abrange tanto o dano causado ao templo quanto sua profanação, sem limitar o sentido à simples entrada forçada.
- source_word: כָּל קָדְשֵׁי בֵית יְהוָה
  choice: todos os objetos sagrados da casa de Yahweh
  rationale: No contexto, o plural substantivado refere-se às coisas consagradas pertencentes ao templo; “objetos sagrados” é claro e natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עָשׂוּ לַבְּעָלִים
  choice: usado ... no culto aos baalins
  rationale: Embora עשה signifique normalmente “fazer”, nesta construção e com os objetos sagrados como complemento o contexto indica que eles foram empregados ou apropriados para o culto aos baalins. A nota preserva a formulação mais literal.
- source_word: בְּעָלִים
  choice: baalins
  rationale: Mantém o plural hebraico, provavelmente referente a diversas manifestações, imagens ou cultos de Baal; “baalins” é a forma plural portuguesa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o nome divino; a transliteração preserva sua condição de nome próprio sem substituir por um título.
- issue: Plural de בְּעָלִים
  choice: baalins
  alternative: Baal; ídolos de Baal
  rationale: Conserva a pluralidade do hebraico sem especificar se se trata de imagens, manifestações locais ou cultos distintos.
- issue: Sentido contextual de עָשׂוּ לַבְּעָלִים
  choice: usado ... no culto aos baalins
  alternative: feito ... para os baalins
  rationale: A tradução principal comunica a provável apropriação dos objetos do templo para uso idolátrico, enquanto a nota registra a leitura lexical mais literal e preserva a ambiguidade.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Casa” permanece em minúscula por ser uma designação comum do templo; “baalins” preserva o plural hebraico. O mais-que-perfeito composto situa naturalmente as ações antes da ordem do contexto imediato.
