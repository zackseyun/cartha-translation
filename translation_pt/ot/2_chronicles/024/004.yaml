reference: 2 Chronicles 24:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִ֖י אַחֲרֵי כֵ֑ן הָיָה֙ עִם לֵ֣ב יוֹאָ֔שׁ לְ/חַדֵּ֖שׁ אֶת בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/004.yaml
  text: After this[b][a], it was in the heart of Joash to restore the house of Yahweh.
translation:
  language: pt
  text: Depois disso, Joás teve no coração restaurar[a] a casa de Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “renovar” ou “reparar”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, o templo de Yahweh. Em hebraico, literalmente, “a casa de Yahweh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Depois disso
  rationale: Marca com naturalidade uma nova etapa da narrativa, preservando a transição temporal sem reproduzir de modo rígido a fórmula hebraica “e aconteceu”.
- source_word: הָיָה עִם לֵב יוֹאָשׁ
  choice: Joás teve no coração
  rationale: Preserva a imagem hebraica do coração como sede da intenção, em linguagem compreensível, sem intensificar a expressão para uma resolução mais enfática do que o texto exige.
- source_word: לְחַדֵּשׁ
  choice: restaurar
  rationale: O verbo pode significar tornar novo outra vez, renovar ou restaurar. No contexto de uma construção já existente, “restaurar” comunica de modo natural a renovação do templo sem restringir o sentido apenas a consertos pontuais.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Mantém a expressão concreta do hebraico, “casa de Yahweh”, enquanto a nota esclarece que se trata do templo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo pelo título “SENHOR”.
- issue: Força da intenção atribuída a Joás
  choice: teve no coração
  alternative: decidiu; resolveu firmemente
  rationale: A formulação conserva a imagem e a relativa abertura do idioma hebraico, sem transformar implicitamente a intenção interior em uma decisão enfática.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural para leitores brasileiros e compreensão ampla no espaço lusófono. A expressão “teve no coração” conserva deliberadamente a imagem semítica, e “casa de Yahweh” mantém a formulação do original com esclarecimento em nota.
