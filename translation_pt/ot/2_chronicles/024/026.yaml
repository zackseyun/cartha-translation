base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/026.yaml
  text: 'And these were the men who conspired against him: Zabad son of Shimeath the Ammonite woman[a], and Jehozabad son of Shimrith the Moabite woman.'
translation:
  language: pt
  text: 'E estes foram os que conspiraram contra ele: Zabade, filho de Simeate, a amonita, e Jeozabade, filho de Sinrite, a moabita.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: E estes foram
  rationale: Introduz a identificação dos conspiradores; o passado se ajusta ao contexto narrativo em português.
- source_word: הַמִּתְקַשְּׁרִים עָלָיו
  choice: os que conspiraram contra ele
  rationale: O particípio hitpael de קשר descreve os que se uniram numa conspiração, e עָלָיו indica o alvo dela.
- source_word: זָבָד בֶּן שִׁמְעָת
  choice: Zabade, filho de Simeate
  rationale: Emprega formas portuguesas reconhecíveis dos nomes e a fórmula genealógica natural.
- source_word: הָעַמּוֹנִית
  choice: a amonita
  rationale: O adjetivo feminino singular identifica Simeate como mulher amonita, preservando de modo conciso a marca de gênero do hebraico.
- source_word: וִיהוֹזָבָד בֶּן שִׁמְרִית
  choice: e Jeozabade, filho de Sinrite
  rationale: Mantém a conjunção e usa formas portuguesas tradicionais e legíveis dos nomes.
- source_word: הַמּוֹאָבִית
  choice: a moabita
  rationale: O feminino singular identifica Sinrite como mulher moabita sem recorrer a uma formulação pesada ou arcaica.
