  text: וַ/יִּקְבֹּץ֮ אֶת הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּם֒ וַ/יֹּ֣אמֶר לָ/הֶ֡ם צְא֣וּ לְ/עָרֵ֪י יְהוּדָ֟ה וְ/קִבְצוּ֩ מִ/כָּל יִשְׂרָאֵ֨ל כֶּ֜סֶף לְ/חַזֵּ֣ק אֶת בֵּ֣ית אֱלֹֽהֵי/כֶ֗ם מִ/דֵּ֤י שָׁנָה֙ בְּ/שָׁנָ֔ה וְ/אַתֶּ֖ם תְּמַהֲר֣וּ לַ/דָּבָ֑ר וְ/לֹ֥א מִֽהֲר֖וּ הַֽ/לְוִיִּֽם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/005.yaml
  text: So he gathered the priests and the Levites and said to them[a], “Go out to the cities of Judah and collect silver from all Israel to repair the house of your God year by year[b], and you must act quickly in this matter.” But the Levites did not act quickly.
translation:
  language: pt
  text: 'Então ele reuniu os sacerdotes e os levitas e lhes disse: “Vão às cidades de Judá e recolham de todo o Israel prata[a] para reparar[b] a casa do Deus de vocês, ano após ano. E ajam depressa nesse assunto.” Mas os levitas não agiram depressa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dinheiro”. O hebraico emprega o termo concreto “prata” para a quantia arrecadada.
    reason: lexical_alternative
  - marker: b
    text: Ou “fortalecer”. Neste contexto, o sentido é consertar ou restaurar a estrutura da casa de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: reuniu
  rationale: O qal de קבץ indica reunir ou ajuntar pessoas; “reuniu” é natural em português com “os sacerdotes e os levitas” como objeto.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: os sacerdotes e os levitas
  rationale: Mantém explicitamente os dois grupos ligados ao serviço do templo, preservando a distinção do hebraico.
- source_word: צְאוּ לְעָרֵי יְהוּדָה
  choice: Vão às cidades de Judá
  rationale: Expressa de modo natural a ordem de sair e dirigir-se às cidades, sem tornar a frase artificial em português.
- source_word: וְקִבְצוּ
  choice: e recolham
  rationale: Com prata ou dinheiro como objeto, “recolher” comunica naturalmente a arrecadação solicitada.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: de todo o Israel
  rationale: Preserva a formulação abrangente do hebraico e não a restringe silenciosamente a Judá.
- source_word: כֶּסֶף
  choice: prata
  rationale: Mantém o termo concreto hebraico, que também podia designar dinheiro; a alternativa funcional é registrada em nota.
- source_word: לְחַזֵּק
  choice: para reparar
  rationale: Embora חזק tenha o sentido básico de fortalecer, no contexto de uma construção denota torná-la firme por meio de conserto ou restauração.
- source_word: בֵּית אֱלֹהֵיכֶם
  choice: a casa do Deus de vocês
  rationale: “Casa” preserva a expressão hebraica, enquanto “do Deus de vocês” transmite com clareza o possessivo plural em português atual.
- source_word: מִדֵּי שָׁנָה בְּשָׁנָה
  choice: ano após ano
  rationale: Reproduz de forma idiomática a recorrência anual expressa pela construção hebraica.
- source_word: וְאַתֶּם תְּמַהֲרוּ לַדָּבָר
  choice: E ajam depressa nesse assunto
  rationale: Mantém a ênfase explícita no destinatário plural e a urgência da ordem.
- source_word: וְלֹא מִהֲרוּ הַלְוִיִּם
  choice: Mas os levitas não agiram depressa
  rationale: Repete a linguagem da ordem anterior, refletindo a repetição de מהר e o contraste narrativo.
theological_decisions:
- issue: Alcance de “todo o Israel”
  choice: de todo o Israel
  alternative: de todos os israelitas
  rationale: A formulação literal preserva o possível alcance histórico e pactual de “Israel” no Cronista, sem reduzi-lo apenas ao povo de Judá.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para deixar inequívoco o possessivo plural e evita construções excessivamente arcaicas. A repetição de “depressa” conserva a ligação retórica entre a ordem e seu descumprimento.
