  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ וַֽ/יַּעֲשׂ֖וּ אֲר֣וֹן אֶחָ֑ד וַֽ/יִּתְּנֻ֛/הוּ בְּ/שַׁ֥עַר בֵּית יְהוָ֖ה חֽוּצָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/008.yaml
  text: Then the king commanded[a], and they made one chest and placed it outside at the gate of the house of Yahweh.
translation:
  language: pt
  text: Então o rei deu a ordem, e fizeram um só cofre[a] e o colocaram do lado de fora, junto ao portão da casa de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «um cofre». O hebraico diz literalmente «um cofre»; o numeral pode destacar que se tratava de um único recipiente designado para a coleta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: deu a ordem
  rationale: Embora o verbo signifique literalmente «disse», neste contexto administrativo a fala do rei desencadeia a execução da medida; «deu a ordem» expressa naturalmente essa força pragmática.
- source_word: וַיַּעֲשׂוּ
  choice: fizeram
  rationale: Traduz diretamente o verbo comum עשה e mantém indefinidos os agentes indicados apenas pela forma verbal plural.
- source_word: אֲרוֹן אֶחָד
  choice: um só cofre
  rationale: «Cofre» designa adequadamente o recipiente para a coleta, sem sugerir a arca da aliança. «Um só» traduz explicitamente אֶחָד e pode salientar que havia um recipiente único e designado, sem tornar essa nuance incontestável.
- source_word: וַיִּתְּנֻהוּ
  choice: o colocaram
  rationale: Neste contexto espacial, נתן tem o sentido de pôr ou colocar; o pronome retoma naturalmente «cofre».
- source_word: בְּשַׁעַר
  choice: junto ao portão
  rationale: A preposição בְּ indica a localização do cofre. «Junto ao portão» é natural em português e evita sugerir que o objeto ficava dentro da própria estrutura do portão.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Preserva a imagem hebraica de «casa» para o templo e translitera o nome divino expresso no texto.
- source_word: חוּצָה
  choice: do lado de fora
  rationale: Expressa claramente a localização exterior indicada pelo advérbio hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico apresenta diretamente o Tetragrama; «Yahweh» preserva o nome próprio sem substituí-lo por um título.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com sintaxe fluente e leve preservação da coordenação narrativa hebraica. «Portão» favorece a legibilidade brasileira sem perder o sentido arquitetônico.
