  text: וַ/יַּֽעַזְב֗וּ אֶת בֵּ֤ית יְהוָה֙ אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֔ם וַ/יַּֽעַבְד֥וּ אֶת הָ/אֲשֵׁרִ֖ים וְ/אֶת הָֽ/עֲצַבִּ֑ים וַֽ/יְהִי קֶ֗צֶף עַל יְהוּדָה֙ וִ/יר֣וּשָׁלִַ֔ם בְּ/אַשְׁמָתָ֖/ם זֹֽאת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/018.yaml
  text: And they abandoned the house of Yahweh[a], the God of their fathers, and served the Asherim and the idols. So wrath came upon Judah and Jerusalem because of this guilt of theirs.
translation:
  language: pt
  text: Eles abandonaram a casa de Yahweh, o Deus de seus antepassados, e serviram aos aserins[a] e aos ídolos. Então a ira veio sobre Judá e Jerusalém por causa desta culpa deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “postes de Aserá”. O termo hebraico se refere a objetos de culto ligados a Aserá e também pode evocar a deusa Aserá.
    reason: Alternativa lexical e preservação da ambiguidade cultural do termo hebraico.
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: abandonaram
  rationale: Expressa o sentido de deixar ou desamparar e comunica, em português atual, a deslealdade religiosa sugerida pelo contexto.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Preserva a expressão hebraica literalmente como “casa”, embora o referente contextual seja o templo, e mantém o nome divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: o Deus de seus antepassados
  rationale: Mantém o vínculo familiar e pactual da expressão, usando linguagem inclusiva e corrente para as gerações anteriores.
- source_word: וַיַּעַבְדוּ
  choice: serviram
  rationale: Conserva o sentido básico de עבד e permite que o contexto cultual comunique a ideia de culto, sem estreitar o verbo para “adoraram”.
- source_word: הָאֲשֵׁרִים
  choice: os aserins
  rationale: Mantém em forma aportuguesada o termo hebraico culturalmente específico, evitando decidir se o foco recai nos objetos cultuais, nos postes sagrados ou na associação com a deusa Aserá.
- source_word: הָעֲצַבִּים
  choice: os ídolos
  rationale: Transmite com clareza tanto a referência a imagens cultuais quanto a conotação religiosa negativa do termo.
- source_word: וַיְהִי קֶצֶף
  choice: a ira veio
  rationale: Preserva a formulação concisa do hebraico e não acrescenta explicitamente o possuidor da ira.
- source_word: עַל יְהוּדָה וִירוּשָׁלִַם
  choice: sobre Judá e Jerusalém
  rationale: Reproduz naturalmente a imagem do juízo que sobrevém a Judá e Jerusalém.
- source_word: בְּאַשְׁמָתָם זֹאת
  choice: por causa dessa culpa deles
  rationale: Entende a preposição em sentido causal e preserva tanto o demonstrativo quanto a atribuição explícita da culpa.
theological_decisions:
- issue: Referente da ira
  choice: Manter “a ira” sem acrescentar “de Deus” ou “de Yahweh”
  alternative: Explicitar “a ira de Deus” ou “a ira de Yahweh”
  rationale: O contexto identifica a ira como divina, mas o texto hebraico não nomeia expressamente seu possuidor; a tradução preserva essa concisão.
- issue: Referência de אֲשֵׁרִים
  choice: Empregar “aserins” no texto e explicar em nota
  alternative: Traduzir diretamente como “postes de Aserá” ou “postes sagrados”
  rationale: O termo pode designar objetos cultuais ligados a Aserá e também evocar a própria deusa; a transliteração evita resolver indevidamente essa ambiguidade.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Antepassados” evita o tom mais restrito ou arcaizante de “pais”; “aserins” exige a nota, mas preserva a ambiguidade do original. O marcador [a] foi colocado junto ao termo que a nota explica.
