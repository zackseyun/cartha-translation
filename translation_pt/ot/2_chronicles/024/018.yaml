revisions:
- from: Eles abandonaram a casa de Yahweh, o Deus de seus antepassados, e serviram aos aserins[a] e aos ídolos. Por isso, a ira veio sobre Judá e Jerusalém por causa dessa culpa deles.
  to: Eles abandonaram a casa de Yahweh, o Deus de seus antepassados, e serviram aos aserins[a] e aos ídolos. Então a ira veio sobre Judá e Jerusalém por causa desta culpa deles.
  rationale: 'A revisão é exclusivamente estilística e de precisão discursiva: troca “Por isso” por “Então” e “dessa” por “desta”, eliminando a repetição causal e mantendo tanto a sequência hebraica quanto o demonstrativo ligado à culpa. Não altera o sentido do versículo nem a ambiguidade lexical preservada na nota.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T22:56:45Z'
