  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּי֩ בְ/מִצְעַ֨ר אֲנָשִׁ֜ים בָּ֣אוּ חֵ֣יל אֲרָ֗ם וַֽ/יהוָה֙ נָתַ֨ן בְּ/יָדָ֥/ם חַ֨יִל֙ לָ/רֹ֣ב מְאֹ֔ד כִּ֣י עָֽזְב֔וּ אֶת יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֑ם וְ/אֶת יוֹאָ֖שׁ עָשׂ֥וּ שְׁפָטִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/024.yaml
  text: For the army of Aram came with few men[a], but Yahweh gave a very great army into their hand, because they had forsaken Yahweh, the God of their fathers[c][b]. Thus they executed judgment on Joash.
translation:
  language: pt
  text: Pois o exército de Arã veio com poucos homens[a], mas Yahweh entregou nas mãos deles[b] um exército muito numeroso, porque haviam abandonado Yahweh, o Deus de seus pais. E executaram juízos contra Joás[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com um pequeno número de homens”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “deu nas mãos deles”, expressão que significa entregar ao poder de alguém.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “aplicaram castigos a Joás”. O hebraico traz o plural “juízos”.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְמִצְעַר אֲנָשִׁים
  choice: com poucos homens
  rationale: Expressa de modo natural a pequenez numérica da força arameia e mantém o contraste com o exército muito numeroso de Judá.
- source_word: חֵיל אֲרָם
  choice: o exército de Arã
  rationale: Neste contexto, חֵיל designa uma força militar. “Arã” reproduz o nome hebraico em sua forma portuguesa corrente, sem substituí-lo por “Síria”.
- source_word: נָתַן בְּיָדָם
  choice: entregou nas mãos deles
  rationale: Preserva a imagem do idioma hebraico, cujo sentido é colocar alguém sob o poder de outro.
- source_word: חַיִל לָרֹב מְאֹד
  choice: um exército muito numeroso
  rationale: חַיִל volta a indicar uma força militar, enquanto לָרֹב מְאֹד destaca sua grande superioridade numérica.
- source_word: עָזְבוּ
  choice: haviam abandonado
  rationale: “Abandonado” comunica com clareza tanto o afastamento quanto a gravidade da infidelidade, sem acrescentar uma explicação teológica ao verbo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: o Deus de seus pais
  rationale: Mantém a linguagem genealógica e pactual específica do hebraico.
- source_word: עָשׂוּ שְׁפָטִים
  choice: executaram juízos contra Joás
  rationale: Conserva o plural שְׁפָטִים e seu sentido de atos punitivos de caráter judicial, embora a expressão seja deliberadamente mais solene que a fala cotidiana.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O hebraico emprega diretamente o Tetragrama. A transliteração preserva o nome pessoal sem convertê-lo em título.
- issue: Relação entre a vitória arameia e o juízo divino
  choice: Yahweh entregou o exército de Judá aos arameus, que executaram juízos contra Joás
  alternative: Os arameus simplesmente castigaram Joás
  rationale: 'A redação mantém a causalidade explícita do texto: a vitória foi dada por Yahweh em razão do abandono dele, e os atos contra Joás são descritos como juízos, sem explicar além disso como a ação humana e o juízo divino se relacionam.'
- issue: Número gramatical de שְׁפָטִים
  choice: juízos
  alternative: juízo; castigo
  rationale: O plural hebraico pode apontar para diversos atos punitivos. Mantê-lo evita reduzir silenciosamente a expressão a um único veredito ou castigo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem das orações foi ajustada apenas o necessário para a fluência. “Executaram juízos” preserva a formulação judicial e o plural do hebraico; a nota oferece uma alternativa mais idiomática.
