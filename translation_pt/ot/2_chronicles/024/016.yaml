  text: וַ/יִּקְבְּרֻ֥/הוּ בְ/עִיר דָּוִ֖יד עִם הַ/מְּלָכִ֑ים כִּֽי עָשָׂ֤ה טוֹבָה֙ בְּ/יִשְׂרָאֵ֔ל וְ/עִ֥ם הָ/אֱלֹהִ֖ים וּ/בֵיתֽ/וֹ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/016.yaml
  text: And they buried him in the city of David among the kings[a], because he had done good in Israel[b], and toward God and his house.
translation:
  language: pt
  text: E o sepultaram na Cidade de Davi, entre os reis[a], porque ele havia feito o bem em Israel, para com Deus e para com a casa dele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com os reis”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, ele fez o bem para com Deus e para com a casa de Deus, o templo.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּקְבְּרֻהוּ
  choice: E o sepultaram
  rationale: O verbo hebraico está na voz ativa, no plural, com sufixo de objeto masculino singular. A construção portuguesa preserva o sujeito plural não especificado.
- source_word: בְעִיר דָּוִיד
  choice: na Cidade de Davi
  rationale: Mantém a forma tradicional e reconhecível do nome geográfico em português.
- source_word: עִם הַמְּלָכִים
  choice: entre os reis
  rationale: Embora עִם signifique literalmente “com”, no contexto funerário “entre os reis” comunica naturalmente que ele foi sepultado em companhia deles ou na área reservada a eles.
- source_word: כִּי
  choice: porque
  rationale: Introduz a razão pela qual Joiada recebeu esse sepultamento honroso.
- source_word: עָשָׂה טוֹבָה
  choice: havia feito o bem
  rationale: Expressa ações boas ou benéficas; o mais-que-perfeito composto situa adequadamente essas ações antes do sepultamento.
- source_word: בְּיִשְׂרָאֵל
  choice: em Israel
  rationale: Preserva o sentido locativo ou de esfera da preposição hebraica.
- source_word: וְעִם הָאֱלֹהִים
  choice: para com Deus
  rationale: A expressão idiomática “para com” indica a orientação relacional das boas ações, sem sugerir mero companheirismo.
- source_word: וּבֵיתוֹ
  choice: e para com a casa dele
  rationale: A elipse da preposição é explicitada naturalmente em português. “Dele” preserva o pronome hebraico, cujo referente mais provável é Deus.
theological_decisions:
- issue: Referente de “casa dele”
  choice: A casa de Deus, isto é, o templo
  alternative: A casa ou família do próprio Joiada
  rationale: Deus é o antecedente imediato, e o contexto narrativo destaca o serviço fiel de Joiada ao templo. O texto principal mantém o pronome, enquanto a nota esclarece a leitura contextual mais provável.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A tradução mantém a estrutura causal do hebraico e preserva no texto principal o pronome de וּבֵיתוֹ, esclarecendo seu referente provável em nota.
