  text: וַ/יִּקְשְׁר֣וּ עָלָ֔י/ו וַ/יִּרְגְּמֻ֥/הוּ אֶ֖בֶן בְּ/מִצְוַ֣ת הַ/מֶּ֑לֶךְ בַּ/חֲצַ֖ר בֵּ֥ית יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/021.yaml
  text: So they conspired against him and stoned him at the command of the king[c][b][a], in the court of the house of Yahweh.
translation:
  language: pt
  text: Então conspiraram contra ele[a] e, por ordem do rei, o apedrejaram[b] no pátio da casa de Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tramaram contra ele”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “apedrejaram-no com pedra”; a expressão indica apedrejamento.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “no átrio da casa de Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ עָלָיו
  choice: conspiraram contra ele
  rationale: A construção de קשר com עַל expressa uma conspiração ou trama hostil contra alguém. “Conspiraram contra ele” é natural em português e preserva a ação coletiva deliberada.
- source_word: וַיִּרְגְּמֻהוּ אֶבֶן
  choice: o apedrejaram
  rationale: רגם designa apedrejamento, e אֶבֶן funciona aqui instrumentalmente. O verbo português “apedrejar” já incorpora de modo natural o uso de pedras e, neste contexto, a execução por apedrejamento.
- source_word: בְּמִצְוַת הַמֶּלֶךְ
  choice: por ordem do rei
  rationale: מִצְוָה indica uma ordem investida de autoridade. A expressão portuguesa preserva de forma clara a responsabilidade direta do rei.
- source_word: בַּחֲצַר
  choice: no pátio
  rationale: חָצֵר refere-se a um espaço aberto cercado, neste caso pertencente ao complexo do templo. “Pátio” é corrente e claro em português.
- source_word: בֵּית יְהוָה
  choice: casa de Yahweh
  rationale: Mantém a expressão hebraica “casa de” e representa o nome divino יהוה como “Yahweh”, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz explicitamente o Tetragrama. “Yahweh” preserva o nome próprio no corpo do texto, enquanto “SENHOR” reflete a tradição de substituição litúrgica.
- issue: Responsabilidade do rei pela morte de Zacarias
  choice: por ordem do rei
  alternative: segundo a ordem do rei
  rationale: A tradução preserva a atribuição explícita da ação à ordem real sem ampliar o texto quanto ao grau de participação pessoal do rei.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Pátio” foi preferido a “átrio” no texto principal por ser mais corrente; a alternativa tradicional consta em nota. A ordem narrativa e a concisão do hebraico foram preservadas.
