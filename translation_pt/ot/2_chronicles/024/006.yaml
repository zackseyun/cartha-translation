base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/006.yaml
  text: Then the king called Jehoiada the chief and said to him, “Why have you not required the Levites to bring from Judah and from Jerusalem the tax of Moses the servant of the LORD and of the assembly of Israel for the tent of the testimony?”
translation:
  language: pt
  text: 'Então o rei chamou Joiada, o chefe, e lhe perguntou: “Por que você não exigiu que os levitas trouxessem de Judá e de Jerusalém a contribuição de Moisés, servo do SENHOR, e da assembleia de Israel para a tenda do testemunho?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: o chefe
  rationale: Preserva o título amplo do hebraico sem especificar uma função não expressa no texto.
- source_word: דָרַשְׁתָּ עַל הַלְוִיִּם
  choice: exigiu que os levitas
  rationale: No contexto, a construção indica cobrar dos levitas o cumprimento da tarefa, não apenas pedir ou consultar.
- source_word: מַשְׂאַת
  choice: contribuição
  rationale: O termo designa aqui uma arrecadação ou tributo destinado ao santuário; “contribuição” é natural e evita sugerir necessariamente um imposto estatal regular.
- source_word: אֹהֶל הָעֵדוּת
  choice: tenda do testemunho
  rationale: Tradução formal da designação cultual, mantendo sua ligação lexical com o testemunho.
- source_word: יהוה
  choice: SENHOR
  rationale: Segue a convenção portuguesa tradicional de representar o nome divino pelo título em versaletes.
theological_decisions:
- issue: A quem a contribuição é atribuída na expressão “de Moisés ... e da assembleia de Israel”
  choice: 'Manter a coordenação: “a contribuição de Moisés ... e da assembleia de Israel”'
  alternative: Explicitar que a contribuição foi ordenada por Moisés à assembleia de Israel
  rationale: A sintaxe hebraica é compacta e permite tensão quanto à relação exata dos dois complementos; a tradução não deve resolver isso por paráfrase.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você” na fala direta por naturalidade contemporânea, sem coloquialismo excessivo.
