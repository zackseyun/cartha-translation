base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/013.yaml
  text: So the workmen labored[a], and the repair work progressed by their hand[b]; they restored the house of God to its proper condition and strengthened it.
translation:
  language: pt
  text: Assim, os trabalhadores trabalharam, e a restauração avançou por suas mãos[a]. Eles restauraram a casa de Deus à sua condição apropriada[b] e a reforçaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a obra de restauração progrediu por meio deles”. O termo hebraico אֲרוּכָה pode significar cura ou restauração e, aqui, é aplicado ao conserto do edifício.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “segundo sua disposição estabelecida” ou “em sua forma original”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ עֹשֵׂי הַמְּלָאכָה
  choice: os encarregados da obra trabalharam
  rationale: Evita a repetição pouco natural de uma tradução estritamente literal, como “os que faziam a obra fizeram”, sem perder a referência aos trabalhadores responsáveis pela tarefa.
- source_word: וַתַּעַל אֲרוּכָה לַמְּלָאכָה
  choice: a restauração avançou
  rationale: אֲרוּכָה pode indicar cura, recuperação ou restauração; no contexto da reforma do templo, “restauração” comunica o sentido concreto, enquanto עלה expressa progresso.
- source_word: בְּיָדָם
  choice: por suas mãos
  rationale: Preserva a imagem concreta do hebraico e indica que o progresso ocorreu por meio da atuação dos trabalhadores.
- source_word: וַיַּעֲמִידוּ
  choice: restabeleceram
  rationale: O Hifil de עמד significa literalmente “fizeram ficar de pé”; no contexto arquitetônico, “restabeleceram” mantém essa ideia melhor que uma simples repetição de “restauraram”.
- source_word: בֵּית הָאֱלֹהִים
  choice: a casa de Deus
  rationale: Mantém a designação hebraica tradicional e clara para o templo, sem substituir a imagem por uma explicitação.
- source_word: עַל מַתְכֻּנְתּוֹ
  choice: em sua devida condição
  rationale: מַתְכֹּנֶת pode indicar forma estabelecida, disposição apropriada ou condição determinada. A escolha preserva a amplitude sem afirmar de modo explícito que se tratava exatamente da forma original.
- source_word: וַיְאַמְּצֻהוּ
  choice: e a reforçaram
  rationale: O Piel de אמץ expressa tornar forte ou firme; “reforçaram” é natural e preciso no contexto de uma construção.
theological_decisions: []
