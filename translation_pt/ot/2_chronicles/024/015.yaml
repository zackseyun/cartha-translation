base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/015.yaml
  text: And Jehoiada grew old and was full of days[a], and he died. He was one hundred and thirty years old at his death.
translation:
  language: pt
  text: Jeoiada envelheceu e morreu farto de dias[a]. Tinha cento e trinta anos de idade quando morreu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, “tinha vivido uma vida plena”. O hebraico diz literalmente “ficou farto de dias”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְקַן
  choice: envelheceu
  rationale: Expressa de modo natural o avanço da idade indicado pelo verbo זקן na sequência narrativa.
- source_word: יְהוֹיָדָע
  choice: Jeoiada
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַיִּשְׂבַּע יָמִים
  choice: ficou satisfeito de dias
  rationale: Preserva a imagem incomum do hebraico, que comunica uma vida longa e completa, sem substituí-la silenciosamente por uma interpretação.
- source_word: וַיָּמֹת
  choice: então morreu
  rationale: Traduz מות na progressão narrativa; “então” sinaliza naturalmente a sequência marcada pelo wayyiqtol.
- source_word: בֶּן מֵאָה וּשְׁלֹשִׁים שָׁנָה
  choice: Tinha cento e trinta anos de idade
  rationale: Converte a fórmula hebraica literal “filho de cento e trinta anos” na maneira idiomática de indicar idade em português.
- source_word: בְּמוֹתוֹ
  choice: quando morreu
  rationale: Expressa com naturalidade o valor temporal da preposição בְּ ligada a “morte” com sufixo pronominal.
