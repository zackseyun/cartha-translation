base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/009.yaml
  text: And they made a proclamation in Judah and Jerusalem to bring to Yahweh the levy of Moses the servant of God for Israel in the wilderness[a].
translation:
  language: pt
  text: Então fizeram uma proclamação em Judá e em Jerusalém para que se trouxesse a Yahweh a contribuição obrigatória que Moisés, servo de Deus, impôs a Israel no deserto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o tributo de Moisés, servo de Deus, imposto a Israel no deserto»; ou «a contribuição de Moisés, servo de Deus, para Israel no deserto». O termo hebraico pode designar uma contribuição fixada ou obrigatória, e a relação exata de «sobre/para Israel» admite mais de uma análise.'
    reason: Registra as alternativas lexicais de מַשְׂאַת e a ambiguidade sintática de עַל יִשְׂרָאֵל, sem obscurecer no texto principal o sentido contextual de uma obrigação imposta a Israel.
lexical_decisions:
- source_word: וַיִּתְּנוּ קוֹל
  choice: fizeram uma proclamação
  rationale: O idioma hebraico, literalmente «deram voz/som», designa aqui um anúncio público; esta formulação preserva seu caráter oficial e é natural em português.
- source_word: בִּיהוּדָה וּבִירוּשָׁלַם
  choice: em Judá e em Jerusalém
  rationale: Tradução locativa direta que conserva o alcance geográfico do anúncio.
- source_word: לְהָבִיא לַיהוָה
  choice: para que se trouxesse a Yahweh
  rationale: Expressa naturalmente em português a finalidade da proclamação, mantendo Yahweh como destinatário e sem acrescentar um agente não expresso.
- source_word: מַשְׂאַת
  choice: a contribuição estabelecida
  rationale: O substantivo pode indicar uma contribuição exigida ou tributo. «Contribuição estabelecida» comunica tanto seu caráter de oferta quanto o fato de não ser meramente espontânea, sem a conotação moderna específica de «imposto».
- source_word: מֹשֶׁה עֶבֶד הָאֱלֹהִים
  choice: por Moisés, servo de Deus
  rationale: A construção associa a contribuição a Moisés; «por» torna essa relação inteligível em português sem transformar o texto numa citação explícita de uma ordem. O título «servo de Deus» é preservado.
- source_word: עַל יִשְׂרָאֵל
  choice: para Israel
  rationale: Mantém a elasticidade de עַל neste contexto e evita decidir no corpo do texto se a contribuição foi imposta sobre Israel ou instituída em benefício/relação a Israel.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: Equivalente corrente e claro de מִדְבָּר no contexto da peregrinação de Israel sob Moisés.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. «Yahweh» conserva o nome próprio da aliança e segue a orientação fornecida, sem substituí-lo por um título.
- issue: Relação de מַשְׂאַת com Israel e Moisés
  choice: a contribuição estabelecida por Moisés ... para Israel
  alternative: o tributo de Moisés ... imposto a Israel
  rationale: A formulação escolhida preserva a obrigação implícita em מַשְׂאַת, mas não torna עַל inequivocamente coercitivo, respeitando a ambiguidade da construção hebraica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção impessoal «para que se trouxesse» preserva a ausência de sujeito expresso; a nota mantém a possível leitura de contribuição obrigatória ou tributo.
