- from: Na virada do ano[a], o exército de Arã[b] subiu contra ele. Eles chegaram a Judá e Jerusalém, destruíram todos os líderes do povo que havia entre o povo e enviaram todo o seu despojo[c] ao rei de Damasco.
  to: Na virada do ano[a], o exército de Arã[b] subiu contra ele. Eles chegaram a Judá e Jerusalém, destruíram todos os líderes do povo, dentre o povo, e enviaram todo o seu despojo[c] ao rei de Damasco.
