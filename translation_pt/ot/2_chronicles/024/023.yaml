  text: וַ/יְהִ֣י לִ/תְקוּפַ֣ת הַ/שָּׁנָ֗ה עָלָ֣ה עָלָי/ו֮ חֵ֣יל אֲרָם֒ וַ/יָּבֹ֗אוּ אֶל יְהוּדָה֙ וִ/יר֣וּשָׁלִַ֔ם וַ/יַּשְׁחִ֛יתוּ אֶת כָּל שָׂרֵ֥י הָ/עָ֖ם מֵ/עָ֑ם וְ/כָל שְׁלָלָ֥/ם שִׁלְּח֖וּ לְ/מֶ֥לֶךְ דַּרְמָֽשֶׂק׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/023.yaml
  text: At the turn of the year[a], the army of Aram came up against him. They came to Judah and Jerusalem, and destroyed all the leaders of the people from among the people[c][b], and sent all their spoil to the king of Damascus.
translation:
  language: pt
  text: Na virada do ano[a], o exército de Arã[b] subiu contra ele. Eles chegaram a Judá e Jerusalém, destruíram todos os líderes do povo, dentre o povo, e enviaram todo o seu despojo[c] ao rei de Damasco.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “No fim do ano”; a expressão hebraica se refere à virada do ano ou ao seu ciclo sazonal.
    reason: lexical_alternative
  - marker: b
    text: “Arã” é o nome hebraico muitas vezes traduzido como “Síria”.
    reason: cultural_note
  - marker: c
    text: Ou “toda a sua pilhagem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִתְקוּפַת הַשָּׁנָה
  choice: Na virada do ano
  rationale: תְּקוּפָה indica ciclo, curso ou ponto de virada. A expressão portuguesa comunica a mudança do ciclo anual, enquanto a nota preserva a alternativa temporal.
- source_word: עָלָה עָלָיו
  choice: subiu contra ele
  rationale: עלה com עַל é uma expressão militar para avançar ou atacar. A formulação conserva a imagem hebraica e é inteligível no contexto.
- source_word: חֵיל אֲרָם
  choice: o exército de Arã
  rationale: חֵיל designa aqui uma força militar. “Arã” preserva o nome histórico hebraico em sua forma portuguesa, sem substituí-lo pelo nome geopolítico posterior “Síria”.
- source_word: וַיָּבֹאוּ אֶל יְהוּדָה וִירוּשָׁלַם
  choice: Eles chegaram a Judá e Jerusalém
  rationale: בוא significa normalmente vir, chegar ou entrar. “Chegaram a” mantém o valor básico do verbo sem acrescentar ao próprio verbo a ideia de invasão já evidente no contexto.
- source_word: וַיַּשְׁחִיתוּ
  choice: destruíram
  rationale: No hifil, שׁחת pode significar destruir ou arruinar. Como o objeto são pessoas, “destruíram” expressa a devastação letal em registro sóbrio.
- source_word: כָּל שָׂרֵי הָעָם מֵעָם
  choice: todos os líderes do povo que havia entre o povo
  rationale: שָׂרִים são dirigentes, autoridades ou líderes, não necessariamente filhos de reis. A formulação retém também מֵעָם, que situa esses líderes no meio da população, embora a repetição seja incomum em português.
- source_word: וְכָל שְׁלָלָם
  choice: todo o seu despojo
  rationale: שָׁלָל é o conjunto de bens tomados na guerra. “Despojo” mantém o sentido coletivo e o registro histórico; o possessivo plural hebraico é representado naturalmente por “seu”.
- source_word: שִׁלְּחוּ לְמֶלֶךְ דַּרְמָשֶׂק
  choice: enviaram ... ao rei de Damasco
  rationale: A construção indica o envio do despojo ao governante arameu sediado em Damasco. “Rei de Damasco” é a forma portuguesa natural.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas consagradas como “Judá”, “Jerusalém”, “Arã” e “Damasco”. A sintaxe foi mantida próxima do hebraico onde isso preserva uma nuance real, mas com verbos e vocabulário correntes.
