base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/010.yaml
  text: Then all the officials and all the people rejoiced[a], and they brought their contributions and threw them into the chest until it was full.
translation:
  language: pt
  text: Então todas as autoridades e todo o povo se alegraram. Trouxeram suas contribuições e as lançaram na caixa até que ela ficasse cheia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até terminarem”. A expressão hebraica pode ter o sentido mais geral de “até a conclusão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: se alegraram
  rationale: Expressa de modo natural e digno a alegria ativa indicada pela raiz שׂמח.
- source_word: כָל הַשָּׂרִים
  choice: todas as autoridades
  rationale: שָׂרִים designa governantes ou altos responsáveis; “autoridades” evita a ideia potencialmente enganosa de filhos do rei sugerida por “príncipes”.
- source_word: וְכָל הָעָם
  choice: e todo o povo
  rationale: Mantém diretamente o alcance coletivo do hebraico.
- source_word: וַיָּבִיאוּ
  choice: trouxeram suas contribuições
  rationale: O objeto está implícito no hebraico; o contexto imediato da coleta permite explicitá-lo para produzir português natural sem introduzir uma ideia alheia ao texto.
- source_word: וַיַּשְׁלִיכוּ
  choice: as lançaram
  rationale: Preserva a força concreta de שׁלך, “lançar”, em vez de enfraquecê-la para “colocar”; o pronome retoma as contribuições explicitadas.
- source_word: לָאָרוֹן
  choice: na caixa
  rationale: אָרוֹן designa aqui o recipiente da coleta, não a arca da aliança. “Caixa” é claro, corrente e adequado ao contexto.
- source_word: עַד לְכַלֵּה
  choice: até que ela ficasse cheia
  rationale: A expressão indica o ponto de conclusão. No contexto da coleta, entende-se naturalmente que as ofertas foram depositadas até a caixa ficar cheia, embora a formulação hebraica também permita entender que continuaram até terminar.
theological_decisions: []
