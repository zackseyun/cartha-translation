  text: וְ/אַֽחֲרֵ֥י מוֹת֙ יְה֣וֹיָדָ֔ע בָּ֚אוּ שָׂרֵ֣י יְהוּדָ֔ה וַ/יִּֽשְׁתַּחֲו֖וּ לַ/מֶּ֑לֶךְ אָ֛ז שָׁמַ֥ע הַ/מֶּ֖לֶךְ אֲלֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/017.yaml
  text: After the death of Jehoiada[a], the officials of Judah came and bowed down to the king[b]. Then the king listened to them.
translation:
  language: pt
  text: Depois da morte de Joiada, as autoridades de Judá[a] vieram e se prostraram diante do rei. Então o rei lhes deu ouvidos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os príncipes de Judá” ou “os líderes de Judá”.
    reason: lexical_alternative
  - marker: b
    text: “Deu ouvidos” também pode ter o sentido de “atendeu ao que eles pediram” ou “cedeu ao pedido deles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחֲרֵי מוֹת יְהוֹיָדָע
  choice: Depois da morte de Joiada
  rationale: A expressão temporal introduz a sequência narrativa. Em português, a conjunção inicial pode ser omitida com naturalidade, sem perda de sentido.
- source_word: בָּאוּ
  choice: vieram
  rationale: Verbo comum de movimento; a forma simples preserva o sentido sem acrescentar um destino não explicitado.
- source_word: שָׂרֵי יְהוּדָה
  choice: as autoridades de Judá
  rationale: שָׂרִים designa pessoas com poder político ou administrativo. “Autoridades” é claro no português atual e evita sugerir necessariamente descendência real.
- source_word: וַיִּשְׁתַּחֲווּ לַמֶּלֶךְ
  choice: e se prostraram diante do rei
  rationale: Preserva o gesto físico de submissão ou reverência perante um superior, sem defini-lo como adoração religiosa.
- source_word: אָז
  choice: Então
  rationale: Marca de modo conciso o passo seguinte e consequente da narrativa.
- source_word: שָׁמַע הַמֶּלֶךְ אֲלֵיהֶם
  choice: o rei lhes deu ouvidos
  rationale: A construção שׁמע אל frequentemente significa escutar com receptividade ou atender. A expressão portuguesa mantém a possibilidade de que o rei tenha acolhido a solicitação deles, sem explicitar mais do que o hebraico.
theological_decisions:
- issue: Natureza do ato das autoridades diante do rei
  choice: se prostraram diante do rei
  alternative: curvaram-se perante o rei; prestaram-lhe homenagem
  rationale: O verbo hebraico pode descrever desde reverência diante de uma autoridade humana até adoração, conforme o contexto. Como o objeto é um rei humano, a tradução preserva o gesto sem importar linguagem inequívoca de culto.
- issue: Força da resposta do rei
  choice: lhes deu ouvidos
  alternative: os escutou; atendeu ao que eles pediram
  rationale: A construção pode indicar tanto escuta atenta quanto anuência. A formulação escolhida conserva essa amplitude e não especifica antecipadamente o conteúdo ou o grau da concordância do rei.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Autoridades” comunica função governante sem o tom aristocrático obrigatório de “príncipes”; “se prostraram” mantém o gesto concreto; “deu ouvidos” preserva a tensão entre escutar e atender.
