  text: וַ/יַּ֧עַשׂ יוֹאָ֛שׁ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כָּל יְמֵ֖י יְהוֹיָדָ֥ע הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/002.yaml
  text: Joash did what was right in the eyes of Yahweh all the days of Jehoiada the priest.
translation:
  language: pt
  text: Joás fez o que era certo aos olhos de Yahweh durante todos os dias do sacerdote Joiada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fez
  rationale: O verbo עשה significa normalmente “fazer”. Nesta fórmula de avaliação, “fez o que era certo” é natural em português e corresponde de perto ao hebraico.
- source_word: הַיָּשָׁר
  choice: o que era certo
  rationale: יָשָׁר pode significar “reto, direito, correto”. A expressão “o que era certo” comunica com clareza a avaliação moral da fórmula régia.
- source_word: בְּעֵינֵי
  choice: aos olhos de
  rationale: Preserva a metáfora hebraica que expressa avaliação segundo a perspectiva de alguém e é idiomática em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כָּל יְמֵי
  choice: durante todos os dias de
  rationale: Mantém o alcance temporal integral da expressão hebraica, com formulação clara em português.
- source_word: יְהוֹיָדָע
  choice: Joiada
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome pessoal.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Traduz diretamente o título que identifica a função de Joiada; em português, a anteposição em “do sacerdote Joiada” soa natural.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto hebraico apresenta diretamente o Tetragrama. “Yahweh” preserva o nome pessoal por transliteração, sem substituí-lo por um título.
- issue: Alcance da avaliação positiva de Joás
  choice: durante todos os dias do sacerdote Joiada
  alternative: enquanto viveu o sacerdote Joiada
  rationale: A tradução conserva a delimitação temporal explícita do hebraico sem explicar sua causa nem ampliar a avaliação para além desse período.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação preserva a metáfora “aos olhos de” e a limitação temporal do hebraico. Não há notas de rodapé neste versículo.
