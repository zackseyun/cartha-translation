  text: וְ/ר֣וּחַ אֱלֹהִ֗ים לָֽבְשָׁה֙ אֶת זְכַרְיָה֙ בֶּן יְהוֹיָדָ֣ע הַ/כֹּהֵ֔ן וַֽ/יַּעֲמֹ֖ד מֵ/עַ֣ל לָ/עָ֑ם וַ/יֹּ֨אמֶר לָ/הֶ֜ם כֹּ֣ה אָמַ֣ר הָ/אֱלֹהִ֗ים לָ/מָה֩ אַתֶּ֨ם עֹבְרִ֜ים אֶת מִצְוֺ֤ת יְהוָה֙ וְ/לֹ֣א תַצְלִ֔יחוּ כִּֽי עֲזַבְתֶּ֥ם אֶת יְהוָ֖ה וַ/יַּֽעֲזֹ֥ב אֶתְ/כֶֽם־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/020.yaml
  text: 'And the Spirit of God clothed Zechariah son of Jehoiada the priest[a], and he stood above the people and said to them, “Thus says God: Why are you transgressing the commandments of Yahweh, so that you do not prosper? Because you have forsaken Yahweh[b], he has also forsaken you.”'
translation:
  language: pt
  text: 'Então, o Espírito de Deus revestiu Zacarias[a], filho de Joiada, o sacerdote. Ele se pôs de pé acima do povo e lhes disse: “Assim diz Deus: Por que vocês transgridem os mandamentos de Yahweh e não prosperam?[b] Visto que vocês abandonaram Yahweh, ele também abandonou vocês.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “veio sobre Zacarias”; literalmente, “revestiu Zacarias”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e vocês não prosperarão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ אֱלֹהִים
  choice: o Espírito de Deus
  rationale: No contexto de capacitação profética, a expressão indica mais naturalmente a atuação divina; a inicial maiúscula comunica essa agência pessoal sem ampliar indevidamente o hebraico.
- source_word: לָבְשָׁה אֶת
  choice: revestiu
  rationale: Conserva a metáfora concreta do verbo לבשׁ, segundo a qual o Espírito ‘veste’ Zacarias, e soa digna e compreensível em português.
- source_word: זְכַרְיָה בֶּן־יְהוֹיָדָע הַכֹּהֵן
  choice: Zacarias, filho do sacerdote Joiada
  rationale: A ordem portuguesa identifica naturalmente Joiada como o sacerdote, conforme a relação sintática mais provável do hebraico.
- source_word: וַיַּעֲמֹד מֵעַל לָעָם
  choice: ele se pôs de pé acima do povo
  rationale: Preserva a dimensão vertical de מֵעַל, provavelmente indicando que Zacarias falou de um lugar elevado.
- source_word: כֹּה אָמַר הָאֱלֹהִים
  choice: Assim diz Deus
  rationale: Mantém a fórmula profética solene de mensageiro em linguagem portuguesa corrente.
- source_word: לָמָּה אַתֶּם עֹבְרִים אֶת־מִצְוֹת יְהוָה
  choice: Por que vocês estão transgredindo os mandamentos de Yahweh
  rationale: ‘Transgredindo’ expressa o sentido de ultrapassar ou violar os mandamentos, preservando a força pactual da repreensão.
- source_word: וְלֹא תַצְלִיחוּ
  choice: e, por isso, não prosperam
  rationale: Representa a ligação contextual de consequência sem transformar de modo definitivo a forma verbal em previsão futura; a alternativa coordenada é registrada em nota.
- source_word: כִּי עֲזַבְתֶּם אֶת־יְהוָה וַיַּעֲזֹב אֶתְכֶם
  choice: Visto que vocês abandonaram Yahweh, ele também abandonou vocês
  rationale: Repete ‘abandonaram/abandonou’ para conservar a reciprocidade enfática do mesmo verbo hebraico; ‘também’ torna clara essa correspondência em português.
theological_decisions:
- issue: Tradução de יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; ‘Yahweh’ preserva o nome divino da aliança sem substituí-lo por um título.
- issue: Agência de רוּחַ אֱלֹהִים
  choice: o Espírito de Deus
  alternative: o espírito de Deus; um espírito vindo de Deus
  rationale: A cena descreve capacitação profética divina. A tradução mantém essa leitura natural, embora o hebraico, por si só, não apresente uma formulação doutrinária posterior sobre a pessoa do Espírito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém-se a metáfora incomum de ‘revestir’, explicada em nota, e o nome divino ‘Yahweh’. O tratamento plural ‘vocês’ comunica claramente a segunda pessoa plural ao leitor contemporâneo.
