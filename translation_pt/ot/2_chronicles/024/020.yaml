    rationale: A âncora precisa seguir a expressão traduzida de לָבְשָׁה אֶת, para que a nota lexical seja verificável e não pareça comentar o nome ou o título sacerdotal.
  - severity: low
    issue: “por isso” torna explícita uma inferência causal/resultativa na cláusula negativa.
    rationale: Embora compatível com o contexto, o hebraico traz simplesmente a coordenação וְלֹא; removê-lo preserva melhor a concisão e a ambiguidade sintática.
  - severity: low
    issue: As aspas internas em torno de toda a fala após “Assim diz Deus” são dispensáveis.
    rationale: A fala profética já está delimitada por aspas; uma única delimitação é mais idiomática em português.
