revisions:
- from: 'Então o Espírito de Deus revestiu Zacarias, filho do sacerdote Joiada,[a] e ele se pôs de pé acima do povo e lhes disse: “Assim diz Deus: ‘Por que vocês estão transgredindo os mandamentos de Yahweh e, por isso, não prosperam?[b] Visto que vocês abandonaram Yahweh, ele também abandonou vocês’”.'
  to: 'Então, o Espírito de Deus revestiu Zacarias[a], filho de Joiada, o sacerdote. Ele se pôs de pé acima do povo e lhes disse: “Assim diz Deus: Por que vocês transgridem os mandamentos de Yahweh e não prosperam?[b] Visto que vocês abandonaram Yahweh, ele também abandonou vocês.”'
  rationale: A revisão reposiciona a nota lexical para “revestiu Zacarias”, esclarece que Joiada é o sacerdote e retira a conexão explícita “por isso”, preservando mais de perto a coordenação e a ambiguidade verbal do hebraico. Não altera o sentido do versículo.
