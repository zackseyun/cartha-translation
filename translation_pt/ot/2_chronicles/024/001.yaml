base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/001.yaml
  text: Joash was seven years old when he began to reign, and he reigned forty years in Jerusalem. His mother’s name was Zibiah from Beer-sheba.
translation:
  language: pt
  text: Joás tinha sete anos quando começou a reinar e reinou quarenta anos em Jerusalém. Sua mãe se chamava Zíbia e era de Berseba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שֶׁבַע שָׁנִים
  choice: tinha sete anos
  rationale: A fórmula hebraica de idade, literalmente “filho de sete anos”, é expressa de modo idiomático e exato em português.
- source_word: בְּמָלְכוֹ
  choice: quando começou a reinar
  rationale: A construção com ב marca o momento da ascensão ao trono; esta formulação preserva claramente o valor temporal.
- source_word: מָלַךְ
  choice: reinou
  rationale: Mantém a força verbal e a fórmula narrativa dos resumos régios.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: Tradução direta do uso locativo da preposição ב com o nome do lugar.
- source_word: וְשֵׁם אִמּוֹ
  choice: Sua mãe se chamava
  rationale: Forma natural em português para a fórmula hebraica que literalmente diz “e o nome de sua mãe era”.
- source_word: צִבְיָה
  choice: Zíbia
  rationale: Transliteração portuguesa tradicional e claramente legível do nome pessoal hebraico.
- source_word: מִבְּאֵר שָׁבַע
  choice: era de Berseba
  rationale: O prefixo מ indica procedência; “era de” comunica essa origem com naturalidade. “Berseba” é a forma portuguesa corrente do topônimo.
