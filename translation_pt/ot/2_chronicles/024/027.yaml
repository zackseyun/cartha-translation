base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/027.yaml
  text: His sons[a], the many oracles against him, and the founding of the house of God—behold, they are written in the Midrash of the Book of the Kings[b]. And Amaziah his son reigned in his place.
translation:
  language: pt
  text: Seus filhos[a], os muitos oráculos contra ele e o estabelecimento da casa de Deus — tudo isso está escrito no Midrash do Livro dos Reis[b]. E Amazias, seu filho, reinou em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica é difícil. Também pode ser entendida como “a grande carga que pesava sobre ele”, “a abundância dos pronunciamentos contra ele” ou até “o pesado tributo imposto a ele”. מַשָּׂא pode significar “carga”, “oráculo” e, em certos contextos, algo imposto a alguém.
    reason: lexical_alternative
  - marker: b
    text: “Midrash” aqui provavelmente significa um registro interpretativo, uma exposição ou um comentário associado ao Livro dos Reis.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָנָיו
  choice: Seus filhos
  rationale: Reproduz diretamente o substantivo plural com sufixo de terceira pessoa masculina singular. O waw é absorvido com naturalidade pela estrutura portuguesa do aviso conclusivo, sem acrescentar um marcador temporal inexistente no hebraico.
- source_word: וְרֹב הַמַּשָּׂא עָלָיו
  choice: os muitos oráculos contra ele
  rationale: מַשָּׂא pode significar carga ou pronunciamento profético; neste contexto historiográfico e de juízo, “oráculos” é uma possibilidade forte. רֹב é expresso por “muitos”, e עָלָיו por “contra ele”. A dificuldade lexical é mantida visível em nota.
- source_word: וִיסוֹד
  choice: o estabelecimento
  rationale: Preserva o sentido básico de יסד, “fundar/estabelecer”, sem substituir o termo por “reconstrução”, sentido contextual possível, mas não explicitado pela raiz.
- source_word: בֵּית הָאֱלֹהִים
  choice: a casa de Deus
  rationale: Mantém a imagem hebraica formal e inteligível; “templo de Deus” seria mais idiomático, porém mais específico.
- source_word: הִנָּם כְּתוּבִים
  choice: tudo isso está escrito
  rationale: O pronome resumitivo “tudo isso” torna claro em português o referente plural e conserva a ênfase dêitica de הִנָּם sem recorrer ao pouco natural “eis que eles estão escritos”.
- source_word: עַל מִדְרַשׁ סֵפֶר הַמְּלָכִים
  choice: no Midrash do Livro dos Reis
  rationale: Mantém o termo transliterado para não definir em excesso o gênero da obra; a nota explica que se trata provavelmente de um registro interpretativo, exposição ou comentário.
- source_word: וַיִּמְלֹךְ אֲמַצְיָהוּ בְנוֹ תַחְתָּיו
  choice: E Amazias, seu filho, reinou em seu lugar
  rationale: Tradução natural e fiel da fórmula hebraica de sucessão real.
theological_decisions: []
