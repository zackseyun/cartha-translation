  terminology: “Casa de Deus” preserva a imagem do hebraico sem reduzir automaticamente o termo a “templo”. “Midrash” é uma transliteração prudente, explicada em nota, e “Amazias” é a forma portuguesa corrente. “Estabelecimento” é uma opção lexicalmente defensável para ויסוד e evita introduzir “reconstrução”, que o hebraico não afirma explicitamente.
