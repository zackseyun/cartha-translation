  text: וַ/יִּשְׁלַ֤ח בָּ/הֶם֙ נְבִאִ֔ים לַ/הֲשִׁיבָ֖/ם אֶל יְהוָ֑ה וַ/יָּעִ֥ידוּ בָ֖/ם וְ/לֹ֥א הֶאֱזִֽינוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/019.yaml
  text: Yet he sent prophets among them to bring them back to Yahweh[a], and they testified against them, but they would not listen.
translation:
  language: pt
  text: Contudo, ele enviou profetas ao meio deles para fazê-los voltar a Yahweh. Os profetas testemunharam contra eles[a], mas eles não deram ouvidos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “advertiram-nos solenemente”. O verbo hebraico pode indicar uma advertência formal e insistente, mas também pode ter o sentido de testemunhar contra alguém.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח בָּהֶם נְבִאִים
  choice: enviou profetas ao meio deles
  rationale: A formulação preserva o valor narrativo de שׁלח e entende בָּהֶם como a entrada dos profetas no meio do povo, em vez de apenas o envio dirigido a ele.
- source_word: לַהֲשִׁיבָם
  choice: para fazê-los voltar
  rationale: O hifil de שׁוב é causativo; esta tradução comunica de maneira clara a ação de levar o povo a retornar.
- source_word: אֶל יְהוָה
  choice: a Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama e expressa o retorno relacional do povo ao seu Deus.
- source_word: וַיָּעִידוּ בָם
  choice: testemunharam contra eles
  rationale: Preserva o possível peso forense do verbo no contexto da denúncia profética da infidelidade do povo, sem ocultar em nota o sentido alternativo de advertência solene.
- source_word: וְלֹא הֶאֱזִינוּ
  choice: mas eles não deram ouvidos
  rationale: Expressão portuguesa natural que comunica a recusa em escutar com atenção, adequada ao contexto de rebeldia persistente.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: A transliteração conserva explicitamente o nome próprio no texto e segue a convenção do projeto, sem substituí-lo por um título.
- issue: Sentido de וַיָּעִידוּ no ministério profético
  choice: testemunharam contra eles
  alternative: advertiram-nos solenemente
  rationale: O contexto admite tanto a linguagem forense do testemunho contra o povo quanto a ideia de advertência solene. O texto principal conserva o matiz forense, e a nota registra a alternativa genuína.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. “Contudo” expressa a continuidade contrastiva do contexto; a repetição de “os profetas” evita uma referência pronominal confusa. A ambiguidade lexical do verbo profético é preservada por meio da nota.
