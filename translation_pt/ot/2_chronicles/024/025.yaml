revisions:
- from: Quando eles se retiraram, deixando-o gravemente enfermo, seus servos conspiraram contra ele por causa do sangue dos filhos do sacerdote Joiada[a]. Eles o mataram em sua cama, e ele morreu. Foi sepultado na Cidade de Davi, mas não nos túmulos dos reis.
  to: Quando eles se retiraram dele — pois o deixaram com muitas enfermidades — seus servos conspiraram contra ele por causa do sangue dos filhos do sacerdote Joiada[a]. Eles o mataram em seu leito, e ele morreu. Foi sepultado na Cidade de Davi, mas não nos túmulos dos reis.
  rationale: A revisão restaura de forma explícita “muitas enfermidades”, preservando o plural e a intensidade do hebraico, e emprega “leito” como equivalente natural de “cama” neste contexto. Mantêm-se o plural massorético “filhos de Joiada” no texto principal e a explicação contextual exclusivamente na nota.
