  text: וּ/בְ/לֶכְתָּ֣/ם מִמֶּ֗/נּוּ כִּֽי עָזְב֣וּ אֹת/וֹ֮ ב/מחליים רַבִּים֒ הִתְקַשְּׁר֨וּ עָלָ֜י/ו עֲבָדָ֗י/ו בִּ/דְמֵי֙ בְּנֵי֙ יְהוֹיָדָ֣ע הַ/כֹּהֵ֔ן וַ/יַּֽהַרְגֻ֥/הוּ עַל מִטָּת֖/וֹ וַ/יָּמֹ֑ת וַֽ/יִּקְבְּרֻ֨/הוּ֙ בְּ/עִ֣יר דָּוִ֔יד וְ/לֹ֥א קְבָרֻ֖/הוּ בְּ/קִבְר֥וֹת הַ/מְּלָכִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/025.yaml
  text: When they departed from him—for they left him with many diseases—his servants conspired against him because of the blood of the sons of Jehoiada the priest[a], and they killed him on his bed, and he died. They buried him in the city of David, but they did not bury him in the tombs of the kings.
translation:
  language: pt
  text: Quando eles se retiraram dele — pois o deixaram com muitas enfermidades — seus servos conspiraram contra ele por causa do sangue dos filhos do sacerdote Joiada[a]. Eles o mataram em seu leito, e ele morreu. Foi sepultado na Cidade de Davi, mas não nos túmulos dos reis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o sangue dos filhos do sacerdote Joiada”. Pelo contexto, a expressão pode referir-se especificamente ao “filho de Joiada”, isto é, Zacarias (24:20–22).'
    reason: Leitura contextual alternativa diante do plural preservado no Texto Massorético.
lexical_decisions:
- source_word: וּבְלֶכְתָּם מִמֶּנּוּ
  choice: Quando eles se retiraram
  rationale: A construção temporal com o infinitivo indica “quando/ao se afastarem”; “se retiraram” expressa naturalmente a partida dos arameus.
- source_word: כִּי עָזְבוּ אֹתוֹ בְּמַחֳלָיִם רַבִּים
  choice: deixando-o gravemente enfermo
  rationale: כִּי introduz a explicação da condição em que Joás foi deixado. מַחֳלָיִם está no plural, mas em português a expressão idiomática comunica a gravidade sem sugerir necessariamente várias doenças distintas.
- source_word: הִתְקַשְּׁרוּ עָלָיו עֲבָדָיו
  choice: seus servos conspiraram contra ele
  rationale: O hitpael de קשר denota uma conspiração; “servos” mantém o sentido lexical direto, podendo abranger integrantes da corte.
- source_word: בִּדְמֵי בְּנֵי יְהוֹיָדָע הַכֹּהֵן
  choice: por causa do sangue dos filhos do sacerdote Joiada
  rationale: A preposição tem valor causal, e “sangue” conserva a linguagem hebraica de morte e culpa de sangue. Mantém-se o plural massorético בְּנֵי.
- source_word: וַיַּהַרְגֻהוּ עַל מִטָּתוֹ וַיָּמֹת
  choice: Eles o mataram em sua cama, e ele morreu
  rationale: A tradução preserva os dois verbos explícitos e a sequência narrativa, inclusive a aparente redundância enfática.
- source_word: וַיִּקְבְּרֻהוּ בְּעִיר דָּוִיד וְלֹא קְבָרֻהוּ בְּקִבְרוֹת הַמְּלָכִים
  choice: Foi sepultado na Cidade de Davi, mas não nos túmulos dos reis
  rationale: A formulação passiva evita uma mudança potencialmente confusa do referente plural e conserva o contraste entre o local geral do sepultamento e a exclusão dos túmulos reais.
theological_decisions:
- issue: Plural massorético “filhos de Joiada” diante do contexto que menciona especificamente Zacarias, filho de Joiada
  choice: Manter no texto principal “filhos do sacerdote Joiada”
  alternative: “filho do sacerdote Joiada”, isto é, Zacarias
  rationale: O texto hebraico fornecido traz o plural. A nota registra a tensão contextual sem harmonizar silenciosamente o texto com 2Crônicas 24:20–22.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Joiada” segue a forma portuguesa tradicional do nome; “Cidade de Davi” é grafada como designação própria. A nota preserva a tensão textual sem impor uma harmonização.
