  text: וַ/יֹּ֣אמֶר מִיכָ֔יְהוּ הִנְּ/ךָ֥ רֹאֶ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא אֲשֶׁ֥ר תָּב֛וֹא חֶ֥דֶר בְּ/חֶ֖דֶר לְ/הֵחָבֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/024.yaml
  text: Micaiah said[a], “Behold, you will see on that day when you go into an inner room to hide yourself.”
translation:
  language: pt
  text: 'Micaías disse: “Você verá naquele dia, quando for de aposento em aposento[a] para se esconder.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando entrar num aposento interior”. Literalmente: “aposento em aposento”.'
    reason: A expressão hebraica repetida pode indicar movimento de aposento em aposento ou retirada para um aposento mais interno.
lexical_decisions:
- source_word: מִיכָיְהוּ
  choice: Micaías
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: הִנְּךָ רֹאֶה
  choice: Você verá
  rationale: A construção com הִנְּךָ e o particípio tem sentido preditivo neste contexto; o futuro natural em português comunica a certeza da declaração sem recorrer ao arcaizante “eis que”.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Equivalente temporal direto, idiomático e fiel ao hebraico.
- source_word: אֲשֶׁר תָּבוֹא
  choice: quando entrar
  rationale: A oração relativa indica a circunstância em que a previsão se cumprirá; “entrar” expressa naturalmente o movimento para o recinto mencionado.
- source_word: חֶדֶר בְּחֶדֶר
  choice: no quarto mais interior
  rationale: A expressão literalmente repetida pode indicar a passagem para um aposento dentro de outro, isto é, o recinto mais reservado. A alternativa mais literal é preservada em nota.
- source_word: לְהֵחָבֵא
  choice: para se esconder
  rationale: O infinitivo nifal tem aqui sentido reflexivo; esta formulação é clara e natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe direta. Evitou-se “eis que” por soar marcadamente arcaico; a força preditiva da construção hebraica foi mantida pelo futuro. O marcador de nota deve acompanhar a expressão ambígua.
