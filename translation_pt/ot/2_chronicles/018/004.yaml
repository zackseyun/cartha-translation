source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוֹשָׁפָ֖ט אֶל מֶ֣לֶךְ יִשְׂרָאֵ֑ל דְּרָשׁ נָ֥א כַ/יּ֖וֹם אֶת דְּבַ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/004.yaml
  text: And Jehoshaphat said to the king of Israel[a], “Please inquire today for the word of Yahweh.”
translation:
  language: pt
  text: 'Josafá disse ao rei de Israel: “Por favor, busque hoje a palavra de Yahweh[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “busque hoje uma palavra da parte de Yahweh”.'
    reason: 'Alternativa lexical e sintática: a expressão definida «a palavra de Yahweh» pode, no contexto de consulta oracular, ser entendida como «uma palavra da parte de Yahweh».'
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: O perfeito consecutivo dá continuidade à narrativa; em português, o pretérito “disse” expressa isso naturalmente sem exigir a repetição de “e” no início do versículo.
- source_word: יְהוֹשָׁפָט
  choice: Josafá
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: ao rei de Israel
  rationale: Tradução direta e idiomática que preserva o título régio.
- source_word: דְּרָשׁ
  choice: consulte
  rationale: Neste contexto, o verbo descreve a busca de orientação divina por meio de uma palavra profética. “Consulte” comunica essa ação em português atual, embora o objeto expresso no hebraico seja “a palavra de Yahweh”.
- source_word: נָא
  choice: Por favor
  rationale: A partícula suaviza o imperativo e o apresenta como pedido; “por favor” é a equivalência moderna mais natural.
- source_word: כַיּוֹם
  choice: hoje
  rationale: A expressão funciona adverbialmente e pede que a consulta seja feita naquele mesmo dia, com sentido de prontidão.
- source_word: אֶת דְּבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Preserva a construção definida e a fórmula profética hebraica. A nota registra a possibilidade contextual de entender “uma palavra da parte de Yahweh”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do hebraico, preservando-o como nome pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” conserva o nome divino e evita substituí-lo pelo título “Senhor”.
- issue: Definição de דְּבַר יְהוָה
  choice: a palavra de Yahweh
  alternative: uma palavra da parte de Yahweh
  rationale: A construção hebraica é formalmente definida, mas no contexto de consulta profética pode ter sentido não definido em português. O texto principal preserva a forma hebraica, e a nota mantém aberta a alternativa contextual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem foi levemente ajustada à fluência do português, sem eliminar a formulação profética nem a ambiguidade entre “a palavra” e “uma palavra”.
