  text: וְ/כָל הַ֨/נְּבִאִ֔ים נִבְּאִ֥ים כֵּ֖ן לֵ/אמֹ֑ר עֲלֵ֞ה רָמֹ֤ת גִּלְעָד֙ וְ/הַצְלַ֔ח וְ/נָתַ֥ן יְהוָ֖ה בְּ/יַ֥ד הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/011.yaml
  text: And all the prophets were prophesying thus[a], saying, “Go up to Ramoth-gilead and succeed, and Yahweh will give it into the hand of the king.”
translation:
  language: pt
  text: 'E todos os profetas profetizavam da mesma maneira, dizendo: “Suba a Ramote-Gileade e triunfe, e Javé a entregará[a] na mão do rei.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e Javé a entregou na mão do rei”, apresentando a vitória como um fato já garantido.'
    reason: O perfeito hebraico pode ser entendido como futuro certo neste contexto profético ou ser reproduzido como uma ação apresentada como já realizada.
lexical_decisions:
- source_word: וְכָל הַנְּבִאִים
  choice: E todos os profetas
  rationale: Preserva a coordenação hebraica e o sujeito coletivo sem acrescentar uma transição discursiva não expressa.
- source_word: נִבְּאִים כֵּן
  choice: profetizavam da mesma maneira
  rationale: O particípio indica ação em andamento, e כֵּן descreve o modo, salientando que os profetas davam a mesma mensagem.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Equivalente português natural da fórmula hebraica que introduz discurso direto.
- source_word: עֲלֵה
  choice: Suba
  rationale: Mantém o sentido básico de subir ou avançar, adequado ao contexto militar, e preserva o tratamento singular dirigido ao rei.
- source_word: רָמֹת גִּלְעָד
  choice: Ramote-Gileade
  rationale: Forma portuguesa reconhecível do topônimo hebraico composto.
- source_word: וְהַצְלַח
  choice: e triunfe
  rationale: Expressa o êxito esperado na campanha militar de modo conciso e natural; evita o possível sentido econômico de 'prospere'.
- source_word: וְנָתַן יְהוָה
  choice: e Javé a entregará
  rationale: No encadeamento após os imperativos, o perfeito hebraico pode anunciar o resultado futuro como certo. O pronome feminino explicita em português o objeto subentendido, a cidade de Ramote-Gileade.
- source_word: יְהוָה
  choice: Javé
  rationale: Translitera em forma portuguesa corrente o nome divino, em vez de substituí-lo por um título.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: nas mãos do rei
  rationale: Conserva a imagem idiomática de entrega ao poder ou controle do rei em uma expressão portuguesa clara.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Javé
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o nome divino; 'Javé' preserva sua função de nome próprio sem importar uma substituição titular.
- issue: Valor aspectual de וְנָתַן na declaração profética
  choice: a entregará
  alternative: a entregou
  rationale: O contexto após dois imperativos favorece uma consequência futura assegurada. A nota registra a possibilidade de representar a certeza profética como fato já consumado, sem eliminar a tensão aspectual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega 'Suba' e 'triunfe' para uma exortação natural, preserva o nome divino e mantém a imagem hebraica de entrega nas mãos do rei.
