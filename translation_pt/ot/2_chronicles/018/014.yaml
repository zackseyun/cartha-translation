  text: וַ/יָּבֹא֮ אֶל הַ/מֶּלֶךְ֒ וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ אֵלָ֗י/ו מִיכָה֙ הֲ/נֵלֵ֞ךְ אֶל רָמֹ֥ת גִּלְעָ֛ד לַ/מִּלְחָמָ֖ה אִם אֶחְדָּ֑ל וַ/יֹּ֨אמֶר֙ עֲל֣וּ וְ/הַצְלִ֔יחוּ וְ/יִנָּתְנ֖וּ בְּ/יֶדְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/014.yaml
  text: So he came to the king[a], and the king said to him, “Micaiah, should we go to Ramoth-gilead for battle, or should I refrain?” And he said, “Go up and prosper, and they will be given into your hand.”
translation:
  language: pt
  text: 'Então ele foi até o rei, e o rei lhe perguntou: “Micaías, devemos ir a Ramote-Gileade para a batalha ou devo desistir?” Ele respondeu: “Subam e tenham êxito, e eles serão entregues nas mãos de vocês”.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: À luz do contexto, a resposta de Micaías provavelmente é irônica ou sarcástica; o hebraico, porém, não marca explicitamente a ironia.
    reason: lexical_alternative
  - marker: b
    text: O hebraico emprega aqui um verbo no plural, mas não identifica expressamente quem será entregue.
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Então ele foi
  rationale: O wayyiqtol de בוא dá sequência à narrativa. “Então” comunica essa progressão com naturalidade em português.
- source_word: מִיכָה
  choice: Micaías
  rationale: Forma tradicional e reconhecível em português para o nome do profeta desta narrativa.
- source_word: הֲנֵלֵךְ
  choice: devemos ir
  rationale: Preserva o sentido deliberativo da forma interrogativa na primeira pessoa do plural.
- source_word: רָמֹת גִּלְעָד
  choice: Ramote-Gileade
  rationale: Forma consagrada do topônimo em traduções bíblicas portuguesas.
- source_word: לַמִּלְחָמָה
  choice: para a batalha
  rationale: Expressa a finalidade indicada pela preposição ל e mantém o sentido militar de מלחמה.
- source_word: אִם אֶחְדָּל
  choice: ou devo desistir
  rationale: חדל significa cessar, abster-se ou desistir. A redação conserva a mudança intencional do plural “devemos” para o singular “devo” presente no hebraico.
- source_word: עֲלוּ
  choice: Subam
  rationale: Imperativo plural de עלה. “Subam” preserva tanto o número quanto a imagem hebraica do deslocamento ascendente.
- source_word: וְהַצְלִיחוּ
  choice: e tenham êxito
  rationale: O hifil de צלח indica obter sucesso. “Tenham êxito” é natural, digno e apropriado ao contexto militar.
- source_word: וְיִנָּתְנוּ בְּיֶדְכֶם
  choice: e eles serão entregues nas mãos de vocês
  rationale: Mantém a voz passiva e o plural do verbo hebraico, bem como a metáfora de entrega ao poder de alguém; “vocês” torna explícito o destinatário plural.
theological_decisions:
- issue: Se a ironia ou o sarcasmo da resposta inicial de Micaías deve ser explicitado no texto principal
  choice: Manter a formulação superficialmente positiva e explicar a provável ironia em nota
  alternative: Acrescentar no texto palavras como “ironicamente” ou empregar uma formulação abertamente sarcástica
  rationale: O contexto narrativo indica que a resposta provavelmente é irônica, mas o hebraico não contém um marcador lexical explícito de ironia. A tradução preserva essa tensão sem impor a interpretação ao texto principal.
- issue: Identidade do sujeito plural implícito em וְיִנָּתְנוּ
  choice: Preservar o pronome plural indefinido “eles”
  alternative: Identificar o sujeito como “os inimigos”, “os habitantes” ou tratar a cidade como sujeito singular
  rationale: O verbo hebraico está no plural, mas o referente não é nomeado no versículo. Especificá-lo resolveria uma ambiguidade genuína do texto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A alternância entre “devemos” e “devo” e as formas plurais “subam”, “tenham” e “vocês” preservam os contrastes gramaticais do hebraico. A expressão “nas mãos de vocês” conserva o idioma bíblico de domínio sem recorrer ao pouco corrente “em vossa mão”.
