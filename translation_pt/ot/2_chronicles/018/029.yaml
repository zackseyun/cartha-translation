base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/029.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Disguise yourself and go into the battle, but you, put on your robes.” So the king of Israel disguised himself, and they went into the battle.
translation:
  language: pt
  text: 'Então o rei de Israel disse a Josafá: “Eu me disfarçarei[a] e entrarei na batalha; você, porém, vista as suas vestes”. Assim, o rei de Israel se disfarçou, e os dois entraram na batalha.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “Disfarce-se e entre na batalha”. A forma hebraica admite essa leitura, mas o contraste com “você, porém” e a frase seguinte indicam que o rei de Israel está falando de se disfarçar.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְחַפֵּשׂ
  choice: Eu me disfarçarei
  rationale: A forma hebraica é concisa e, isoladamente, pode ser entendida como imperativo de segunda pessoa. Contudo, o contraste com וְאַתָּה (“você, porém”) e a narração seguinte, na qual o rei de Israel se disfarça, favorecem aqui uma declaração de primeira pessoa.
- source_word: וָבוֹא
  choice: e entrarei
  rationale: O verbo בוא, ligado à ação anterior e seguido de “na batalha”, descreve a entrada do rei no combate. A primeira pessoa acompanha a leitura contextual da oração.
- source_word: בַמִּלְחָמָה
  choice: na batalha
  rationale: Com בוא, a expressão indica ingresso no cenário da batalha; “entrar na batalha” é natural em português e conserva o movimento do hebraico.
- source_word: וְאַתָּה
  choice: você, porém
  rationale: O pronome é enfático e estabelece contraste entre o disfarce do rei de Israel e as vestes visíveis de Josafá.
- source_word: לְבַשׁ בְּגָדֶיךָ
  choice: vista as suas vestes reais
  rationale: Literalmente, “vista as suas roupas/vestes”. O contexto régio e o propósito do contraste mostram que se trata das vestes que identificariam Josafá como rei; “reais” explicita essa implicação contextual sem alterar a ação ordenada.
- source_word: וַיָּבֹאוּ
  choice: os dois entraram
  rationale: A forma plural refere-se aos dois reis. Explicitar “os dois” evita em português uma referência pronominal pouco clara.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: o rei de Israel
  rationale: Tradução direta e tradicional do título, mantida nas duas ocorrências.
- source_word: יְהוֹשָׁפָט
  choice: Josafá
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construções naturais para leitores brasileiros e compreensão internacional. O tratamento “você” torna explícito o contraste do pronome hebraico; “vestes reais” comunica o valor identificador das roupas no contexto. A ambiguidade da forma verbal inicial foi preservada em nota.
