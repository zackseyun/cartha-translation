  text: וַ/יֹּ֣אמֶר מֶֽלֶךְ יִשְׂרָאֵ֣ל אֶֽל יְהוֹשָׁפָ֡ט ע֣וֹד אִישׁ אֶחָ֡ד לִ/דְרוֹשׁ֩ אֶת יְהוָ֨ה מֵֽ/אֹת֜/וֹ וַ/אֲנִ֣י שְׂנֵאתִ֗י/הוּ כִּֽי אֵ֠ינֶ/נּוּ מִתְנַבֵּ֨א עָלַ֤/י לְ/טוֹבָה֙ כִּ֣י כָל יָמָ֣י/ו לְ/רָעָ֔ה ה֖וּא מִיכָ֣יְהוּ בֶן יִמְלָ֑א וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט אַל יֹאמַ֥ר הַ/מֶּ֖לֶךְ כֵּֽן־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/007.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “There is still one man by whom we may inquire of Yahweh, but I hate him, because he never prophesies good concerning me, but always evil. He is Micaiah son of Imla.” Jehoshaphat said, “Let not the king say so.”
translation:
  language: pt
  text: 'Então o rei de Israel disse a Josafá: “Ainda há um homem por meio de quem[a] podemos consultar Yahweh, mas eu o odeio, pois ele jamais profetiza o bem a meu respeito, mas sempre o mal. É Micaías, filho de Imlá.” Josafá respondeu: “O rei não deve falar assim.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “buscar Yahweh por meio dele”.'
    reason: Alternativa lexical para דרשׁ, que pode significar tanto buscar quanto consultar, especialmente ao procurar orientação divina por intermédio de um profeta.
lexical_decisions:
- source_word: ע֣וֹד אִישׁ אֶחָד
  choice: Ainda há um homem
  rationale: Expressa naturalmente a ideia de que resta uma pessoa disponível, preservando o valor de עוֹד com אִישׁ אֶחָד.
- source_word: לִדְרוֹשׁ אֶת־יְהוָה מֵאֹתוֹ
  choice: por meio de quem podemos consultar Yahweh
  rationale: No contexto profético, דרשׁ indica buscar orientação divina ou consultar Yahweh; מֵאֹתוֹ apresenta o profeta como intermediário.
- source_word: וַאֲנִי שְׂנֵאתִיהוּ
  choice: mas eu o odeio
  rationale: O perfeito descreve uma atitude estabelecida e contínua; o presente em português comunica essa disposição, e “mas” explicita o contraste contextual.
- source_word: כִּי אֵינֶנּוּ מִתְנַבֵּא עָלַי לְטוֹבָה
  choice: pois ele jamais profetiza o bem a meu respeito
  rationale: A construção negativa com particípio descreve conduta habitual. “Jamais” preserva a generalização enfática do rei.
- source_word: כִּי כָל־יָמָיו לְרָעָה
  choice: mas sempre o mal
  rationale: Traduz idiomaticamente “para o mal todos os seus dias”, mantendo o contraste entre prognósticos favoráveis e desfavoráveis sem sugerir necessariamente maldade moral no profeta.
- source_word: מִיכָיְהוּ בֶן־יִמְלָא
  choice: Micaías, filho de Imlá
  rationale: Mantém o nome pessoal e a relação patronímica; as formas são adaptadas à leitura corrente em português.
- source_word: אַל יֹאמַר הַמֶּלֶךְ כֵּן
  choice: O rei não deve falar assim
  rationale: Reproduz a proibição indireta e respeitosa dirigida ao rei em português moderno, sem a rigidez de uma formulação excessivamente literal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama; “Yahweh” preserva-o como nome pessoal e evita substituí-lo por um título.
- issue: Sentido de לְטוֹבָה e לְרָעָה nas profecias
  choice: o bem ... o mal
  alternative: coisas favoráveis ... desgraças
  rationale: A formulação conserva a tensão e a simetria do hebraico. No contexto, trata-se do conteúdo favorável ou desfavorável das profecias, sem acrescentar uma avaliação teológica sobre a legitimidade delas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A correção respeitosa de Josafá foi vertida de modo natural, e o paralelismo “o bem ... o mal” foi mantido. O marcador [a] aparece imediatamente após a expressão a que se refere.
