  text: וּ/מֶ֣לֶךְ יִשְׂרָאֵ֡ל וִֽ/יהוֹשָׁפָ֣ט מֶֽלֶךְ יְהוּדָ֡ה יוֹשְׁבִים֩ אִ֨ישׁ עַל כִּסְא֜/וֹ מְלֻבָּשִׁ֤ים בְּגָדִים֙ וְ/יֹשְׁבִ֣ים בְּ/גֹ֔רֶן פֶּ֖תַח שַׁ֣עַר שֹׁמְר֑וֹן וְ/כָל הַ֨/נְּבִיאִ֔ים מִֽתְנַבְּאִ֖ים לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/009.yaml
  text: The king of Israel and Jehoshaphat king of Judah were sitting[a], each on his throne, clothed in garments, and sitting at the threshing floor at the entrance of the gate of Samaria[b], and all the prophets were prophesying before them.
translation:
  language: pt
  text: O rei de Israel e Josafá, rei de Judá, estavam sentados, cada um em seu trono, vestidos com seus trajes, na eira junto à entrada da porta de Samaria; e todos os profetas profetizavam diante deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמֶלֶךְ יִשְׂרָאֵל
  choice: O rei de Israel
  rationale: O waw coordena esta cena com o contexto anterior, mas não exige um marcador temporal explícito em português; a ligação narrativa pode ficar implícita.
- source_word: וִיהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: e Josafá, rei de Judá
  rationale: Mantém a coordenação e apresenta o título régio como aposto natural em português.
- source_word: יוֹשְׁבִים ... וְיֹשְׁבִים
  choice: estavam sentados ... na eira
  rationale: A primeira ocorrência estabelece a postura dos reis; a segunda introduz sua localização. Em português, repetir 'sentados' seria pesado, e a localização permanece integralmente expressa.
- source_word: אִישׁ עַל כִּסְאוֹ
  choice: cada um em seu trono
  rationale: אִישׁ tem valor distributivo, e כִּסֵּא, no contexto régio, designa adequadamente um trono.
- source_word: מְלֻבָּשִׁים בְּגָדִים
  choice: vestidos com seus trajes
  rationale: Reproduz a construção de vestir-se com vestes sem acrescentar que fossem necessariamente mantos reais; 'trajes' preserva o caráter público e solene da cena.
- source_word: בְּגֹרֶן
  choice: na eira
  rationale: גֹּרֶן é a área onde se debulhavam e joeiravam cereais; 'eira' é o equivalente português tradicional e preciso.
- source_word: פֶּתַח שַׁעַר שֹׁמְרוֹן
  choice: junto à entrada da porta de Samaria
  rationale: A cadeia construta indica a abertura ou entrada do portão urbano; 'junto à' torna clara a relação espacial sem confundir a eira com o interior da porta.
- source_word: וְכָל הַנְּבִיאִים
  choice: e todos os profetas
  rationale: Mantém a coordenação cumulativa simples do hebraico.
- source_word: מִתְנַבְּאִים לִפְנֵיהֶם
  choice: profetizavam diante deles
  rationale: O hitpael de נבא denota aqui atividade profética, e לִפְנֵיהֶם indica que ela ocorria na presença dos reis.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe foi suavizada para evitar a repetição pouco natural de 'estavam sentados', sem omitir a postura nem a localização. Não foram necessárias notas textuais ou teológicas.
