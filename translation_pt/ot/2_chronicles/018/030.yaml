base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/030.yaml
  text: The king of Aram had commanded the commanders of the chariots that were his[a], saying, “Do not fight with either small or great, but only with the king of Israel alone.”
translation:
  language: pt
  text: 'O rei de Arã havia ordenado aos comandantes da sua força de carros: “Não lutem nem contra pequenos nem contra grandes, mas somente contra o rei de Israel.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמֶלֶךְ אֲרָם
  choice: O rei da Síria
  rationale: A conjunção hebraica mantém a ligação narrativa, mas não precisa ser explicitada isoladamente em português. אֲרָם designa o reino de Arã; “Síria” é sua forma tradicional e amplamente compreendida em português bíblico.
- source_word: צִוָּה
  choice: havia ordenado
  rationale: O verbo significa “ordenar”; o mais-que-perfeito composto esclarece que a ordem antecedeu os acontecimentos narrados na cena da batalha.
- source_word: שָׂרֵי הָרֶכֶב אֲשֶׁר לוֹ
  choice: aos comandantes dos seus carros de guerra
  rationale: שָׂרֵי indica oficiais ou comandantes, e הָרֶכֶב refere-se aqui à força de carros. A expressão possessiva אֲשֶׁר לוֹ é integrada naturalmente como “seus”.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Em português atual, os dois-pontos introduzem a fala direta com mais naturalidade do que a reprodução formal de “dizendo”, sem perda de conteúdo.
- source_word: לֹא תִּלָּחֲמוּ אֶת הַקָּטֹן אֶת הַגָּדוֹל
  choice: Não lutem contra ninguém, seja pequeno ou grande
  rationale: A proibição está no plural. O par idiomático “pequeno ou grande” abrange qualquer pessoa, independentemente de posição; “ninguém” explicita em português o alcance negativo já inerente à expressão hebraica.
- source_word: כִּי אִם אֶת מֶלֶךְ יִשְׂרָאֵל לְבַדּוֹ
  choice: mas somente contra o rei de Israel
  rationale: כִּי אִם marca exceção exclusiva, e לְבַדּוֹ reforça que o rei de Israel é o único alvo. “Somente” transmite essa exclusividade sem a redundância pouco natural de “somente... sozinho”.
