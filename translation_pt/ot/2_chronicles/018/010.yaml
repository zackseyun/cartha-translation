base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/010.yaml
  text: 'Then Zedekiah son of Chenaanah made horns of iron for himself and said[b][a], “Thus says Yahweh: With these you will gore Aram until they are finished off.”'
translation:
  language: pt
  text: 'Então Zedequias, filho de Quenaaná, fez para si chifres de ferro e disse: “Assim diz Yahweh: Com estes você ferirá Arã a chifradas[a], até que sejam destruídos[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “empurrará Arã”; o verbo hebraico descreve o ato de um animal atacar ou golpear com os chifres.
    reason: lexical_alternative
  - marker: b
    text: Arã também pode ser entendido aqui como “os arameus” e, com menor precisão histórica, traduzido por “Síria”. O hebraico passa do nome coletivo singular para um pronome plural.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לוֹ
  choice: fez para si
  rationale: O pronome com ל pode ter sentido reflexivo neste contexto; Zedequias confecciona os chifres para seu próprio uso no ato simbólico.
- source_word: צִדְקִיָּהוּ בֶן כְּנַעֲנָה
  choice: Zedequias, filho de Quenaaná
  rationale: Emprega formas portuguesas reconhecíveis para os nomes e preserva o patronímico hebraico.
- source_word: קַרְנֵי בַרְזֶל
  choice: chifres de ferro
  rationale: Reproduz diretamente a construção hebraica e mantém a imagem concreta do sinal profético.
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Preserva a fórmula profética solene e representa o tetragrama como nome próprio.
- source_word: בְּאֵלֶּה
  choice: Com estes
  rationale: A preposição tem valor instrumental e o demonstrativo plural retoma os chifres.
- source_word: תְּנַגַּח
  choice: você ferirá ... a chifradas
  rationale: O verbo descreve o ataque de um animal com os chifres; esta formulação mantém a metáfora e soa natural em português.
- source_word: אֶת אֲרָם
  choice: Arã
  rationale: Mantém a designação histórica hebraica, em vez de substituí-la pelo termo posterior e menos exato “Síria”.
- source_word: עַד כַּלּוֹתָם
  choice: até acabar com eles
  rationale: Expressa a completa eliminação dos referentes humanos implícitos em Arã e conserva a força resultativa de כלה.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o tetragrama como nome divino; “Yahweh” o preserva como nome próprio, sem substituí-lo por um título.
- issue: Referente de Arã e do sufixo plural em כַּלּוֹתָם
  choice: Arã como designação coletiva, retomada por “eles”
  alternative: a Síria, retomada no singular
  rationale: Embora אֲרָם seja formalmente singular, o sufixo masculino plural indica que o autor passa da entidade coletiva aos arameus; a tradução conserva essa mudança sem apagá-la.
translation_notes:
  register: Português atual, claro e digno, com legibilidade brasileira. A ordem foi ajustada à sintaxe natural do português, mantendo a fórmula profética, a imagem dos chifres e a mudança do coletivo singular “Arã” para o referente humano plural.
