revisions:
- from: 'Então Zedequias, filho de Quenaaná, fez para si chifres de ferro e disse: “Assim diz Yahweh: ‘Com estes você ferirá Arã a chifradas[a], até acabar com eles[b]’”.'
  to: 'Então Zedequias, filho de Quenaaná, fez para si chifres de ferro e disse: “Assim diz Yahweh: Com estes você ferirá Arã a chifradas[a], até que sejam destruídos[b].”'
  rationale: A revisão elimina a aninhagem indevida de aspas e altera somente a oração final, para não atribuir explicitamente ao destinatário da profecia a ação que o hebraico deixa gramaticalmente não especificada. As notas permanecem ancoradas nos mesmos termos e explicam adequadamente tanto a alternativa lexical de נגח quanto o plural associado a Arã.
