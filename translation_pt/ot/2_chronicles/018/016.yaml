  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר רָאִ֤יתִי אֶת כָּל יִשְׂרָאֵל֙ נְפוֹצִ֣ים עַל הֶֽ/הָרִ֔ים כַּ/צֹּ֕אן אֲשֶׁ֥ר אֵין לָ/הֶ֖ן רֹעֶ֑ה וַ/יֹּ֤אמֶר יְהוָה֙ לֹֽא אֲדֹנִ֣ים לָ/אֵ֔לֶּה יָשׁ֥וּבוּ אִישׁ לְ/בֵית֖/וֹ בְּ/שָׁלֽוֹם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/016.yaml
  text: And he said[a], “I saw all Israel scattered on the mountains, like sheep that have no shepherd. And Yahweh said, ‘These have no master[b]; let each man return to his house in peace.’”
translation:
  language: pt
  text: 'E ele disse: “Vi todo o Israel disperso pelos montes, como ovelhas que não têm pastor[a]. E Yahweh disse: ‘Estes não têm senhores[b]; que cada um volte para sua casa em paz.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de forma mais concisa: “como ovelhas sem pastor”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “senhores”. Pelo sentido coletivo, também se pode traduzir: “Estes não têm senhor”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְפוֹצִים
  choice: disperso
  rationale: O particípio passivo descreve Israel espalhado após a derrota. “Disperso” preserva tanto o quadro militar quanto a imagem pastoral e concorda naturalmente com o coletivo “todo o Israel” em português.
- source_word: עַל הֶהָרִים
  choice: pelos montes
  rationale: A expressão locativa retrata o povo espalhado na região elevada. “Pelos montes” é natural em português e conserva a imagem do hebraico.
- source_word: כַּצֹּאן אֲשֶׁר אֵין לָהֶן רֹעֶה
  choice: como ovelhas que não têm pastor
  rationale: Mantém a comparação e a oração relativa do hebraico, além de preservar sua conhecida ressonância bíblica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לֹא אֲדֹנִים לָאֵלֶּה
  choice: Estes não têm senhores
  rationale: Conserva o plural אֲדֹנִים e comunica que o povo ficou sem liderança governante; a nota registra a possibilidade de expressar em português o sentido coletivo com o singular.
- source_word: יָשׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: que cada um volte para sua casa
  rationale: Expressa o valor jussivo do imperfeito e o sentido distributivo de אִישׁ em português atual e natural.
- source_word: בְּשָׁלוֹם
  choice: em paz
  rationale: É a equivalência direta e idiomática de בְּשָׁלוֹם, preservando também a tensão de um exército derrotado poder voltar sem novo dano.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o nome divino; “Yahweh” preserva o nome próprio em vez de substituí-lo por um título.
- issue: Número e sentido de אֲדֹנִים
  choice: senhores
  alternative: senhor
  rationale: O plural formal é mantido no texto, sem transformar a expressão política e militar em um título divino. A nota reconhece que o singular também pode representar naturalmente o sentido coletivo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção preserva a imagem pastoral, o nome divino e o plural hebraico de “senhores”, enquanto usa “cada um” para reproduzir naturalmente o valor distributivo de אִישׁ.
