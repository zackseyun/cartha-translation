  text: וַ/יֹּ֣אמֶר מִיכָ֔יְהוּ אִם שׁ֤וֹב תָּשׁוּב֙ בְּ/שָׁל֔וֹם לֹא דִבֶּ֥ר יְהוָ֖ה בִּ֑/י וַ/יֹּ֕אמֶר שִׁמְע֖וּ עַמִּ֥ים כֻּלָּֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/027.yaml
  text: And Micaiah said[a], “If you indeed return in peace, Yahweh has not spoken by me.” Then he said, “Hear[b], all you peoples!”
translation:
  language: pt
  text: 'Micaías disse: “Se você de fato voltar em paz, Yahweh não falou por meio de mim[a].” E disse: “Ouçam, todos os povos[b]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por meu intermédio”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico traz “povos” no plural, numa convocação profética mais ampla do que “povo” no singular.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיכָיְהוּ
  choice: Micaías
  rationale: Forma tradicional e amplamente reconhecida em português para o nome hebraico.
- source_word: אִם שׁוֹב תָּשׁוּב
  choice: Se você de fato voltar
  rationale: A combinação do infinitivo absoluto com o verbo conjugado dá ênfase à condição; “de fato” preserva essa força em português natural.
- source_word: בְּשָׁלוֹם
  choice: em paz
  rationale: Mantém a expressão hebraica e, no contexto, comunica a ideia de voltar são e salvo.
- source_word: לֹא דִבֶּר יְהוָה בִּי
  choice: Yahweh não falou por meio de mim
  rationale: A preposição בְּ tem aqui sentido instrumental. “Por meio de mim” expressa com clareza que Micaías se apresenta como porta-voz da profecia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: שִׁמְעוּ
  choice: Ouçam
  rationale: Imperativo plural que convoca solenemente os ouvintes a prestar atenção.
- source_word: עַמִּים כֻּלָּם
  choice: todos os povos
  rationale: Preserva o plural עַמִּים e o alcance amplo da convocação profética, sem reduzi-lo ao singular “povo”.
theological_decisions:
- issue: Forma de representar o nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama; a transliteração preserva seu caráter de nome próprio.
- issue: Locutor da convocação final
  choice: Micaías continua sendo o locutor
  alternative: Entender a frase como uma inserção editorial sem locutor claramente identificado
  rationale: A forma “e disse” não nomeia novamente o sujeito, e o antecedente explícito mais próximo é Micaías. A tradução não acrescenta outro locutor.
- issue: Alcance de עַמִּים no plural
  choice: todos os povos
  alternative: todo o povo
  rationale: O plural hebraico favorece uma convocação profética ampla. Mantê-lo evita restringir silenciosamente a fala apenas aos presentes.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A repetição de “disse” foi mantida para refletir וַיֹּאמֶר nas duas orações, e a formulação conserva tanto a ênfase da condição quanto o plural profético final.
