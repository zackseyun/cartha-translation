source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לָ/כֵ֖ן שִׁמְע֣וּ דְבַר יְהוָ֑ה רָאִ֤יתִי אֶת יְהוָה֙ יוֹשֵׁ֣ב עַל כִּסְא֔/וֹ וְ/כָל צְבָ֤א הַ/שָּׁמַ֨יִם֙ עֹֽמְדִ֔ים עַל יְמִינ֖/וֹ וּ/שְׂמֹאלֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/018.yaml
  text: 'And he said[a], “Therefore hear the word of Yahweh: I saw Yahweh sitting on his throne, and all the host of heaven standing at his right hand and at his left.”'
translation:
  language: pt
  text: 'E ele disse: “Portanto, ouçam a palavra de Yahweh: Eu vi Yahweh sentado em seu trono, e todo o exército dos céus[a] em pé à sua direita e à sua esquerda.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “toda a hoste celestial” ou “todo o exército celestial”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Mantém a transição inferencial e a força solene da declaração profética.
- source_word: שִׁמְעוּ
  choice: ouçam
  rationale: O imperativo plural convoca os presentes a prestar atenção à palavra profética; “ouçam” é direto e natural em português.
- source_word: דְבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Preserva a fórmula profética tradicional e traduz o nome divino como nome próprio.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o Tetragrama como nome pessoal, em vez de substituí-lo por um título.
- source_word: רָאִיתִי
  choice: Eu vi
  rationale: O pretérito perfeito comunica naturalmente o relato da visão recebida por Micaías.
- source_word: יוֹשֵׁב עַל כִּסְאוֹ
  choice: sentado em seu trono
  rationale: Reproduz de modo claro e digno a imagem de Yahweh entronizado.
- source_word: כָל צְבָא הַשָּׁמַיִם
  choice: todo o exército dos céus
  rationale: Preserva o sentido coletivo e potencialmente militar de צָבָא no cenário da corte celestial, sem especificar além do hebraico a identidade de seus integrantes.
- source_word: עֹמְדִים
  choice: em pé
  rationale: Expressa naturalmente em português a postura descrita pelo particípio hebraico.
- source_word: עַל יְמִינוֹ וּשְׂמֹאלוֹ
  choice: à sua direita e à sua esquerda
  rationale: Mantém o paralelismo espacial do hebraico em português corrente e digno.
theological_decisions:
- issue: Tradução do nome divino יְהוָה na visão em que o profeta declara tê-lo visto
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Identidade de כָל צְבָא הַשָּׁמַיִם
  choice: todo o exército dos céus
  alternative: toda a hoste celestial; todo o exército celestial
  rationale: A expressão pode designar a assembleia ou exército celestial. A tradução mantém essa amplitude e evita identificar explicitamente os seres como anjos quando o versículo não o faz.
translation_notes:
  register: Português moderno, solene e amplamente compreensível. Conserva a abertura coordenada “E ele disse”, a fórmula profética e a imagem da corte celestial; evita o arcaísmo “hoste” no texto principal, registrando-o apenas como alternativa em nota.
