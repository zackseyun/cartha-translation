  source_fidelity: 'A tradução representa com precisão o hebraico: mantém a transição inferencial («Portanto»), o imperativo plural, a fórmula «a palavra de Yahweh», a visão no pretérito, Yahweh entronizado e a totalidade do exército/hoste celestial posicionada à direita e à esquerda dele. «Todo o exército dos céus» conserva adequadamente o alcance coletivo e a possível conotação militar de צְבָא, sem identificar indevidamente os integrantes como anjos.'
  naturalness: O português é moderno, claro e de registro apropriadamente solene. «E ele disse», «ouçam», «sentado em seu trono» e «em pé à sua direita e à sua esquerda» são formulações naturais e legíveis em português internacional com boa fluência brasileira.
  terminology: «Yahweh» segue de modo consistente a diretriz fornecida para o Tetragrama. «Palavra de Yahweh» preserva a fórmula profética, e «exército dos céus» é uma opção semanticamente defensável; a nota oferece alternativas úteis, inclusive «hoste celestial», sem estreitar o sentido do hebraico.
