  text: וַ/יֹּ֖אמֶר מִיכָ֑יְהוּ חַי יְהוָ֕ה כִּ֛י אֶת אֲשֶׁר יֹאמַ֥ר אֱלֹהַ֖/י אֹת֥/וֹ אֲדַבֵּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/013.yaml
  text: But Micaiah said[a], “As Yahweh lives, whatever my God says, that I will speak.”
translation:
  language: pt
  text: 'Mas Micaías disse: “Tão certo como Yahweh vive[a], falarei o que o meu Deus disser.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Yahweh vive! Falarei o que o meu Deus disser.”'
    reason: Preserva a possibilidade de entender חַי יְהוָה como uma afirmação direta, embora a expressão seja normalmente uma fórmula de juramento.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mas ... disse
  rationale: O waw consecutivo dá continuidade à narrativa, mas o contexto apresenta uma resposta de contraste à pressão do mensageiro no versículo anterior; “Mas ... disse” expressa naturalmente essa relação em português.
- source_word: מִיכָיְהוּ
  choice: Micaías
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: חַי יְהוָה
  choice: Tão certo como Yahweh vive
  rationale: Equivalente português natural para a fórmula hebraica de juramento, preservando sua força solene sem tratá-la como simples declaração.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵת אֲשֶׁר ... אֹתוֹ
  choice: o que ...
  rationale: A construção hebraica destaca como objeto aquilo que Deus disser. “O que” comunica todo o referente de modo claro e idiomático; a retomada pronominal hebraica não precisa ser reproduzida separadamente em português.
- source_word: יֹאמַר
  choice: disser
  rationale: O futuro do subjuntivo é natural depois de “o que” e expressa o conteúdo que Deus vier a comunicar nessa situação.
- source_word: אֱלֹהַי
  choice: o meu Deus
  rationale: Preserva explicitamente o sufixo de primeira pessoa e a relação pessoal declarada por Micaías.
- source_word: אֲדַבֵּר
  choice: falarei
  rationale: Mantém o sentido de proclamação verbal do piel de דבר e a determinação solene do profeta.
theological_decisions:
- issue: Tradução do nome divino יְהוָה na fórmula de juramento
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” preserva esse nome, enquanto “SENHOR” o substitui por um título e “Jeová” representa uma forma tradicional posterior.
- issue: Força de חַי יְהוָה
  choice: 'Fórmula de juramento: “Tão certo como Yahweh vive”'
  alternative: 'Afirmação seguida de declaração: “Yahweh vive! O que...”'
  rationale: No contexto, a expressão funciona normalmente como juramento. A pontuação do hebraico também permite que leitores a entendam mais diretamente como uma afirmação da vida de Yahweh, possibilidade preservada em nota.
translation_notes:
  register: 'Português moderno, claro e solene, com boa legibilidade brasileira. A ordem foi ajustada para soar natural em português, sem perder a exclusividade profética: Micaías falará somente o que seu Deus disser.'
