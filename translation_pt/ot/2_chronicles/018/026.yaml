base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/026.yaml
  text: 'and say[a], ‘Thus says the king: Put this man in the prison, and feed him with bread of affliction and water of affliction until I return in peace.’'
translation:
  language: pt
  text: 'e digam: “Assim diz o rei: Ponham este homem na prisão e deem-lhe pão de aflição e água de aflição[a], até que eu volte em paz.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pão de angústia e água de angústia”, isto é, rações reduzidas próprias da prisão e da privação.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: e digam
  rationale: A forma na segunda pessoa do plural dá continuidade, com força imperativa, à ordem dirigida aos oficiais; “e digam” é natural e mantém o plural.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: Assim diz o rei
  rationale: Preserva a fórmula oficial de mensageiro e seu valor presente no decreto citado.
- source_word: שִׂימוּ זֶה
  choice: Ponham este homem
  rationale: Explicita naturalmente o referente humano do demonstrativo sem intensificar indevidamente o tom depreciativo.
- source_word: בֵּית הַכֶּלֶא
  choice: na prisão
  rationale: Equivalente idiomático e claro para a expressão literal “casa do confinamento”.
- source_word: וְהַאֲכִלֻהוּ
  choice: e deem-lhe
  rationale: No contexto das rações carcerárias, “deem-lhe” expressa naturalmente o causativo “façam-no comer/alimentem-no” e rege tanto o pão quanto a água.
- source_word: לֶחֶם לַחַץ
  choice: pão de aflição
  rationale: Mantém a imagem hebraica e sua associação com privação, sofrimento e ração escassa.
- source_word: וּמַיִם לַחַץ
  choice: água de aflição
  rationale: Conserva o paralelismo com “pão de aflição”; a nota esclarece o provável sentido concreto.
- source_word: עַד שׁוּבִי בְשָׁלוֹם
  choice: até que eu volte em paz
  rationale: Preserva o sentido de retorno seguro e a ironia narrativa, sem explicá-la no corpo do texto.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção “pão de aflição e água de aflição” preserva o paralelismo e a imagem do hebraico, enquanto a nota esclarece seu provável valor idiomático.
