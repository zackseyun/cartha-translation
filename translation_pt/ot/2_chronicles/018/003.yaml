base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/003.yaml
  text: And Ahab king of Israel said to Jehoshaphat king of Judah[a], “Will you go with me to Ramoth-gilead?” And he said to him, “I am as you are, and my people as your people[b], and I am with you in the battle.”
translation:
  language: pt
  text: 'Acabe, rei de Israel, disse a Josafá, rei de Judá: “Você irá comigo a Ramote-Gileade?” Josafá lhe respondeu: “Eu sou como você, e meu povo é como o seu povo[a]; e estou com você na batalha[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de forma mais idiomática: “seu povo é o meu povo”. A construção hebraica é literalmente comparativa: “e como o seu povo, o meu povo”.'
    reason: lexical_alternative
  - marker: b
    text: 'A frase final é elíptica no hebraico; literalmente: “e com você na batalha”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵלֵךְ עִמִּי
  choice: Você irá comigo
  rationale: A partícula interrogativa הֲ introduz uma pergunta direta, e הלך com עִם indica acompanhar alguém. “Irá comigo” preserva de modo natural tanto o movimento quanto a orientação futura do convite.
- source_word: רָמֹת גִּלְעָד
  choice: Ramote-Gileade
  rationale: Adota a forma portuguesa tradicional e reconhecível do topônimo hebraico.
- source_word: כָּמוֹנִי כָמוֹךָ
  choice: Eu sou como você
  rationale: Mantém a construção comparativa e comunica a declaração de solidariedade sem transformá-la numa fórmula mais forte de identidade.
- source_word: וּכְעַמְּךָ עַמִּי
  choice: e meu povo é como o seu povo
  rationale: Explicita apenas a cópula ausente na oração nominal hebraica e conserva a comparação e a ordem semântica básica, em português corrente.
- source_word: וְעִמְּךָ בַּמִּלְחָמָה
  choice: e estou com você na batalha
  rationale: Supre a cópula exigida pelo português, mas evita inserir explicitamente um futuro que não aparece no hebraico. A formulação funciona como declaração presente de apoio para a batalha proposta.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: disse ... respondeu
  rationale: No primeiro caso, “disse” corresponde diretamente ao verbo narrativo; no segundo, “respondeu” torna clara em português a função discursiva da fala de Josafá, sem alterar seu conteúdo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de nomes tradicionais em português. O tratamento “você” favorece a legibilidade brasileira sem introduzir informalidade excessiva. A estrutura paralela da declaração de solidariedade foi preservada, e a elipse final foi discretamente completada no texto e registrada em nota.
