  text: וַ/יֹּ֗אמֶר אֵצֵא֙ וְ/הָיִ֨יתִי֙ לְ/ר֣וּחַ שֶׁ֔קֶר בְּ/פִ֖י כָּל נְבִיאָ֑י/ו וַ/יֹּ֗אמֶר תְּפַתֶּה֙ וְ/גַם תּוּכָ֔ל צֵ֖א וַ/עֲשֵׂה כֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/021.yaml
  text: And he said[a], ‘I will go out and become a lying spirit in the mouth of all his prophets.’ And he said, ‘You will entice him, and you will also succeed[b]. Go out and do so.’
translation:
  language: pt
  text: 'E ele disse: “Sairei e me tornarei um espírito de mentira[a] na boca de todos os seus profetas.” E ele disse: “Você o enganará[b] e também terá êxito. Saia e faça assim.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um espírito de falsidade”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Você o persuadirá” ou “Você o seduzirá”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵצֵא
  choice: Sairei
  rationale: O imperfeito de primeira pessoa de יצא expressa a ação pretendida pelo falante. “Sairei” é direto e preserva o sentido de movimento.
- source_word: וְהָיִיתִי
  choice: e me tornarei
  rationale: Embora היה possa ser vertido formalmente por “serei”, aqui a construção predicativa sugere a passagem a uma função; “me tornarei” comunica naturalmente esse valor ingressivo.
- source_word: לְרוּחַ שֶׁקֶר
  choice: um espírito de mentira
  rationale: A expressão caracteriza o espírito pela falsidade. “Espírito de mentira” é natural em português, conserva a forma nominal do hebraico e evita definir além do necessário a natureza desse espírito.
- source_word: בְּפִי
  choice: na boca de
  rationale: Mantém a imagem hebraica da boca como meio pelo qual a mensagem dos profetas é pronunciada.
- source_word: כָּל נְבִיאָיו
  choice: todos os profetas dele
  rationale: Expressa a abrangência de כָּל e deixa claro, em português corrente, que o referente do sufixo é a pessoa mencionada no contexto, sem inserir o nome no versículo.
- source_word: תְּפַתֶּה
  choice: Você o enganará
  rationale: No piel, פתה pode indicar indução ou persuasão com força enganosa. Neste contexto, em que o agente será um espírito de mentira, “enganará” comunica claramente o efeito pretendido; a nota registra a alternativa lexical mais ampla.
- source_word: וְגַם תּוּכָל
  choice: e também terá êxito
  rationale: יכל, neste contexto, indica capacidade efetiva e resultado bem-sucedido, não apenas possibilidade abstrata. “Terá êxito” evita a ideia indevida de vencer um adversário sugerida por “prevalecerá”.
- source_word: צֵא
  choice: Saia
  rationale: O imperativo de יצא retoma o verbo da primeira fala e preserva esse eco verbal.
- source_word: וַעֲשֵׂה כֵן
  choice: e faça assim
  rationale: Reproduz de maneira concisa e natural a ordem idiomática עשה כן.
theological_decisions:
- issue: Autorização divina de uma missão enganosa dentro da visão
  choice: Manter de forma direta a proposta do espírito e a ordem para executá-la
  alternative: Abrandar a formulação para reduzir ou eliminar a participação divina no engano
  rationale: O hebraico apresenta sem atenuação a proposta do espírito e a resposta que prevê seu êxito e ordena sua execução. A tradução preserva essa tensão teológica em vez de resolvê-la por paráfrase.
- issue: Identidade dos dois falantes indicada apenas por pronomes
  choice: Repetir “E ele disse” sem explicitar os nomes
  alternative: Identificar o primeiro falante como o espírito e o segundo como o SENHOR
  rationale: O texto hebraico usa a mesma forma narrativa ויאמר em ambos os casos; o contexto permite identificar os interlocutores, mas o versículo não os nomeia. A tradução conserva essa característica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se a imagem “na boca” e a repetição de “sair”, enquanto formas como “me tornarei” e “terá êxito” comunicam naturalmente o valor contextual dos verbos hebraicos.
