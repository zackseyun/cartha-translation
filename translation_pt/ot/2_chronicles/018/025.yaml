  text: וַ/יֹּ֨אמֶר֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל קְחוּ֙ אֶת מִיכָ֔יְהוּ וַ/הֲשִׁיבֻ֖/הוּ אֶל אָמ֣וֹן שַׂר הָ/עִ֑יר וְ/אֶל יוֹאָ֖שׁ בֶּן הַ/מֶּֽלֶךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/025.yaml
  text: Then the king of Israel said[a], “Take Micaiah and return him to Amon, the governor of the city[b], and to Joash the king’s son.”
translation:
  language: pt
  text: 'Então, o rei de Israel disse: “Levem Micaías de volta a Amom, chefe da cidade,[a] e a Joás, filho do rei.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “governador da cidade” ou “comandante da cidade”. O título hebraico pode designar uma autoridade civil ou militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa com naturalidade a sequência dos acontecimentos.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: o rei de Israel
  rationale: Mantém o título usado no hebraico, sem substituí-lo pelo nome Acabe.
- source_word: קְחוּ
  choice: Levem
  rationale: Neste contexto, o imperativo de לקח ordena que Micaías seja conduzido; “Levem” é natural em português e não acrescenta a força de “prendam” ou “agarrem”.
- source_word: מִיכָיְהוּ
  choice: Micaías
  rationale: Forma tradicional e reconhecível do nome em português.
- source_word: וַהֲשִׁיבֻהוּ
  choice: de volta
  rationale: A forma causativa de שוב indica fazer alguém retornar; combinada com “Levem”, a expressão “Levem ... de volta” comunica esse sentido de modo idiomático.
- source_word: אָמֹון
  choice: Amom
  rationale: Transliteração portuguesa tradicional do nome hebraico.
- source_word: שַׂר הָעִיר
  choice: chefe da cidade
  rationale: שַׂר designa uma autoridade civil ou militar. “Chefe” preserva essa amplitude melhor do que um título administrativo mais específico.
- source_word: יוֹאָשׁ
  choice: Joás
  rationale: Forma tradicional e reconhecível do nome em português.
- source_word: בֶּן הַמֶּלֶךְ
  choice: filho do rei
  rationale: Reproduz diretamente a relação expressa pelo hebraico, sem interpretar o título como “príncipe”.
