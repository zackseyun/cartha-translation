base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/001.yaml
  text: Jehoshaphat had great wealth and honor[a], and he allied himself by marriage with Ahab.
translation:
  language: pt
  text: Josafá tinha riqueza e honra em abundância e fez uma aliança matrimonial com Acabe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tornou-se parente de Acabe por casamento”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: tinha
  rationale: A forma narrativa de היה introduz a situação de Josafá; em português atual, a oração direta com “tinha” é natural e dispensa uma fórmula como “e aconteceu que”.
- source_word: לִיהוֹשָׁפָט
  choice: Josafá
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: עֹשֶׁר
  choice: riqueza
  rationale: Expressa abundância material de modo claro e corrente.
- source_word: וְכָבוֹד
  choice: e honra
  rationale: Neste contexto régio e social, כָבוֹד indica honra, prestígio ou posição elevada, não glória visível.
- source_word: לָרֹב
  choice: muita
  rationale: A expressão indica grande quantidade ou abundância e, em português natural, pode qualificar conjuntamente “riqueza e honra”.
- source_word: וַיִּתְחַתֵּן
  choice: fez uma aliança matrimonial
  rationale: O hitpael de חתן indica o estabelecimento de parentesco por casamento; a tradução comunica a dimensão dinástica sem afirmar que Josafá pessoalmente se casou.
- source_word: לְאַחְאָב
  choice: com Acabe
  rationale: A preposição é vertida de acordo com a regência portuguesa da expressão “fazer uma aliança ... com”.
theological_decisions:
- issue: Natureza da relação expressa por וַיִּתְחַתֵּן לְאַחְאָב
  choice: fez uma aliança matrimonial com Acabe
  alternative: tornou-se parente de Acabe por casamento
  rationale: O texto descreve uma ligação familiar ou dinástica por casamento, sem dizer que Josafá se casou pessoalmente com Acabe nem especificar aqui quais familiares foram unidos.
translation_notes:
  register: Português moderno, digno e acessível, com nomes bíblicos tradicionais. A construção evita um marcador discursivo inicial sem equivalente temporal explícito no hebraico. O marcador da nota foi colocado após a afirmação a que se refere.
