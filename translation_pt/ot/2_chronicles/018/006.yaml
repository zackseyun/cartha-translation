  text: וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט הַ/אֵ֨ין פֹּ֥ה נָבִ֛יא לַ/יהוָ֖ה ע֑וֹד וְ/נִדְרְשָׁ֖ה מֵ/אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/006.yaml
  text: But Jehoshaphat said[a], “Is there not still here a prophet of Yahweh[b], that we may inquire of him?”
translation:
  language: pt
  text: 'Mas Josafá disse: “Não há aqui ainda[a] algum profeta de Yahweh, para que o consultemos?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não há aqui ainda outro profeta de Yahweh...?”'
    reason: A palavra hebraica traduzida por “ainda” pode, neste contexto, indicar um profeta adicional aos que já haviam sido consultados.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mas Josafá perguntou
  rationale: O verbo é literalmente “disse”, mas introduz uma pergunta e contrasta a reação de Josafá com o consenso profético anterior; “perguntou” é natural em português e “mas” explicita a oposição discursiva.
- source_word: יְהוֹשָׁפָט
  choice: Josafá
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: הַאֵין
  choice: Não há
  rationale: Preserva a pergunta negativa, que busca confirmação, de modo natural em português.
- source_word: פֹּה
  choice: aqui
  rationale: Equivalente direto e corrente do advérbio locativo.
- source_word: נָבִיא לַיהוָה
  choice: algum profeta de Yahweh
  rationale: “Profeta de Yahweh” expressa a relação de pertencimento e representação indicada por ל; “algum” torna idiomática a pergunta negativa sem eliminar o singular hebraico.
- source_word: עוֹד
  choice: ainda
  rationale: Mantém a ideia de que talvez reste disponível outro profeta além dos já ouvidos, sem transformar essa inferência contextual em formulação explícita.
- source_word: וְנִדְרְשָׁה מֵאֹתוֹ
  choice: para que o consultemos
  rationale: O cohortativo propõe uma ação conjunta. Neste contexto, דרשׁ com מֵאֹתוֹ significa buscar uma resposta mediante o profeta; “consultá-lo” comunica isso com clareza e concisão.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e segue a decisão doutrinária fornecida, sem substituí-lo por um título.
- issue: Sentido de נָבִיא לַיהוָה
  choice: profeta de Yahweh
  alternative: profeta para Yahweh; profeta pertencente a Yahweh
  rationale: A construção indica associação, pertencimento ou representação. A formulação portuguesa mantém essa amplitude sem definir mais precisamente a função do profeta.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A pergunta retórica e a ambiguidade de עוֹד foram preservadas; o nome divino aparece como Yahweh.
