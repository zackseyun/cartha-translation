  source_fidelity: 'A tradução acompanha bem a sequência e os referentes do hebraico: os chefes da força de carros identificam erroneamente Josafá, voltam-se contra ele, ele clama, Yahweh o socorre, e Deus os afasta dele. Contudo, «clamou» reproduz melhor o grito angustiado expresso por זעק do que o mais genérico «gritou».'
  naturalness: O texto é claro e atual. «Ele é o rei de Israel!» torna explícito em português o sujeito que a oração nominal hebraica atribui a Josafá e soa natural no discurso direto. «Fez com que se afastassem dele» explicita de modo idiomático o valor causativo do hifil, sem sugerir que Deus apenas os atraiu fisicamente.
  terminology: «Comandantes dos carros de guerra», «Josafá», «Yahweh» e «Deus» são escolhas adequadas. A distinção entre יהוה e אלהים deve ser mantida, como está no original.
