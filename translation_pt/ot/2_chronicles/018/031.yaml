  text: וַ/יְהִ֡י כִּ/רְאוֹת֩ שָׂרֵ֨י הָ/רֶ֜כֶב אֶת יְהוֹשָׁפָ֗ט וְ/הֵ֤מָּה אָֽמְרוּ֙ מֶ֣לֶךְ יִשְׂרָאֵ֣ל ה֔וּא וַ/יָּסֹ֥בּוּ עָלָ֖י/ו לְ/הִלָּחֵ֑ם וַ/יִּזְעַ֤ק יְהֽוֹשָׁפָט֙ וַֽ/יהוָ֣ה עֲזָר֔/וֹ וַ/יְסִיתֵ֥/ם אֱלֹהִ֖ים מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/031.yaml
  text: And it happened that when the commanders of the chariots saw Jehoshaphat[a], they said, “It is the king of Israel.” So they turned against him to fight, but Jehoshaphat cried out, and Yahweh helped him[b], and God drew them away from him.
translation:
  language: pt
  text: 'Quando os comandantes dos carros de guerra viram Josafá, disseram: “Ele é o rei de Israel!” Então se voltaram contra ele para lutar. Mas Josafá clamou, e Yahweh o ajudou; Deus fez com que se afastassem dele.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deus os desviou dele”. O verbo hebraico pode indicar fazer alguém mudar de direção ou afastar-se de um alvo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הָרֶכֶב
  choice: os comandantes dos carros de guerra
  rationale: שָׂרֵי designa chefes militares, e הָרֶכֶב se refere à força de carros. “Carros de guerra” evita a possível leitura moderna de veículos comuns.
- source_word: מֶלֶךְ יִשְׂרָאֵל הוּא
  choice: É o rei de Israel!
  rationale: A oração nominal identifica Josafá como o alvo presumido. A formulação é natural em português e mantém o caráter exclamativo da identificação no contexto.
- source_word: וַיָּסֹבּוּ עָלָיו
  choice: se voltaram contra ele
  rationale: סבב pode indicar voltar-se ou cercar. Aqui descreve a movimentação hostil em direção a Josafá sem afirmar necessariamente um cerco completo.
- source_word: לְהִלָּחֵם
  choice: para lutar
  rationale: O infinitivo expressa a finalidade da movimentação dos comandantes e é reproduzido de modo direto.
- source_word: וַיִּזְעַק
  choice: gritou
  rationale: זעק indica um clamor intenso, muitas vezes motivado por aflição. “Gritou” preserva a intensidade sem acrescentar um destinatário ou pedido não expresso.
- source_word: וַיהוָה עֲזָרוֹ
  choice: Yahweh o ajudou
  rationale: עזר significa diretamente “ajudar”, e o nome pessoal יהוה é transliterado como “Yahweh”.
- source_word: וַיְסִיתֵם אֱלֹהִים מִמֶּנּוּ
  choice: Deus os afastou dele
  rationale: Neste contexto, o hifil de סות comunica fazer alguém desviar-se ou afastar-se de um alvo. A tradução conserva a ação divina e evita a conotação moral inadequada de “incitar”.
- source_word: וַיְהִי כִּרְאוֹת
  choice: Quando ... viram
  rationale: A construção é uma transição narrativa hebraica comum. Em português, “Quando” expressa a relação temporal com naturalidade, sem reproduzir de forma pesada a fórmula “e aconteceu que”.
theological_decisions:
- issue: Emprego de יהוה e אֱלֹהִים no mesmo versículo
  choice: Yahweh ... Deus
  alternative: o SENHOR ... Deus
  rationale: 'A tradução distingue os dois termos presentes no hebraico: o nome pessoal יהוה é apresentado como “Yahweh”, enquanto אֱלֹהִים é traduzido como “Deus”.'
- issue: Se o grito de Josafá deve ser explicitado como oração
  choice: Josafá gritou
  alternative: Josafá clamou a Yahweh
  rationale: O texto não declara o destinatário do grito. A tradução preserva essa ausência, enquanto a oração seguinte informa que Yahweh o ajudou.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Carros de guerra” esclarece o referente antigo; a sintaxe narrativa foi moderadamente suavizada. O marcador [a] aparece no texto e documenta a variação lexical relevante.
