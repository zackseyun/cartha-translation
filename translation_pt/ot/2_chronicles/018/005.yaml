  text: וַ/יִּקְבֹּ֨ץ מֶֽלֶךְ יִשְׂרָאֵ֥ל אֶֽת הַ/נְּבִאִים֮ אַרְבַּ֣ע מֵא֣וֹת אִישׁ֒ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם הֲ/נֵלֵ֞ךְ אֶל רָמֹ֥ת גִּלְעָ֛ד לַ/מִּלְחָמָ֖ה אִם אֶחְדָּ֑ל וַ/יֹּאמְר֣וּ עֲלֵ֔ה וְ/יִתֵּ֥ן הָ/אֱלֹהִ֖ים בְּ/יַ֥ד הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/005.yaml
  text: So the king of Israel gathered the prophets[a], four hundred men, and said to them, “Should we go to Ramoth-gilead for battle, or should I refrain?” And they said, “Go up[b], and God will give it into the hand of the king.”
translation:
  language: pt
  text: 'Então o rei de Israel reuniu os profetas — quatrocentos homens — e lhes disse: “Devemos ir a Ramote-Gileade para a batalha ou devo desistir?” Eles responderam: “Suba, e Deus a entregará na mão do rei[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “na mão do rei”. A expressão indica estar sob o poder ou controle do rei. O texto não especifica aqui a qual rei se refere.'
    reason: Preservar o idioma hebraico e a ambiguidade do referente.
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: reuniu
  rationale: O verbo קבץ significa reunir ou ajuntar; “reuniu” é natural em português e adequado à convocação de um grupo.
- source_word: הַנְּבִאִים אַרְבַּע מֵאוֹת אִישׁ
  choice: os profetas — quatrocentos homens —
  rationale: Mantém tanto o termo padrão “profetas” quanto a indicação explícita de quatrocentos homens, usando travessões para dar clareza à aposição.
- source_word: הֲנֵלֵךְ ... אִם אֶחְדָּל
  choice: Devemos ir ... ou devo desistir?
  rationale: Preserva a mudança deliberada do plural na primeira oração para o singular na segunda, sem harmonizar as formas verbais.
- source_word: רָמֹת גִּלְעָד
  choice: Ramote-Gileade
  rationale: Transliteração tradicional e reconhecível do topônimo composto em português.
- source_word: לַמִּלְחָמָה
  choice: guerrear contra
  rationale: Expressa de modo natural o propósito militar da ida a Ramote-Gileade, sem acrescentar detalhes sobre a campanha.
- source_word: עֲלֵה
  choice: Suba
  rationale: Conserva o sentido básico e a forma singular do imperativo עלה, dirigido ao rei; o contexto fornece a conotação militar.
- source_word: וְיִתֵּן
  choice: e Deus a entregará
  rationale: נתן significa dar ou entregar. O objeto está implícito no hebraico; o pronome feminino retoma naturalmente a cidade em português.
- source_word: הָאֱלֹהִים
  choice: Deus
  rationale: Embora אֱלֹהִים tenha forma plural, o verbo singular יִתֵּן mostra que aqui o referente é singular.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: nas mãos do rei
  rationale: Reproduz em português corrente o idioma hebraico que indica entrega ao poder ou controle de alguém, mantendo “do rei” sem identificar mais precisamente seu referente.
theological_decisions:
- issue: Referente de “o rei” na resposta dos profetas
  choice: Manter a expressão indefinida “do rei”
  alternative: Explicitar “nas suas mãos” ou “nas mãos do rei de Israel”
  rationale: O texto hebraico diz literalmente “do rei”, diferentemente da formulação do paralelo em 1 Reis 22:6. A tradução preserva essa ambiguidade em vez de decidir qual rei está em vista.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A mudança de “devemos” para “devo” conserva a alternância de número do hebraico. O imperativo “Suba” mantém a metáfora espacial e evita substituí-la diretamente por “Ataque”.
