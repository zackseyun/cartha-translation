  to: 'Então o rei de Israel reuniu os profetas — quatrocentos homens — e lhes disse: “Devemos ir a Ramote-Gileade para a batalha ou devo desistir?” Eles responderam: “Suba, e Deus a entregará na mão do rei[a].”'
