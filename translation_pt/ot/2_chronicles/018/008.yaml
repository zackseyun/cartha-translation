  text: וַ/יִּקְרָא֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל אֶל סָרִ֖יס אֶחָ֑ד וַ/יֹּ֕אמֶר מַהֵ֖ר מיכהו בֶן יִמְלָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/008.yaml
  text: Then the king of Israel called one officer and said[a], “Quickly bring Micaiah son of Imla.”
translation:
  language: pt
  text: 'Então o rei de Israel chamou um oficial[a] e disse: “Traga depressa Micaías, filho de Imlá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um eunuco” ou “um oficial da corte”; o termo hebraico pode referir-se tanto a um eunuco em sentido literal como, de modo mais geral, a um oficial do rei.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: chamou
  rationale: O verbo introduz a ordem direta dada a um servidor; “chamou” conserva o sentido simples e natural da narrativa.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: o rei de Israel
  rationale: Tradução direta e idiomática da expressão hebraica que identifica quem fala.
- source_word: אֶל סָרִיס אֶחָד
  choice: um oficial
  rationale: סָרִיס pode designar um eunuco em sentido literal ou, de modo mais geral, um oficial da corte. Como o contexto destaca sua função a serviço do rei, “um oficial” é natural, enquanto a ambiguidade lexical é preservada em nota.
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: Equivalente corrente do verbo narrativo de fala.
- source_word: מַהֵר
  choice: Traga depressa
  rationale: O imperativo expressa urgência. Em português, “traga depressa” comunica de modo claro tanto a ordem implícita quanto a rapidez exigida.
- source_word: מיכהו
  choice: Micaías
  rationale: Forma tradicional e reconhecível do nome em português.
- source_word: בֶן יִמְלָא
  choice: filho de Inlá
  rationale: Tradução direta do patronímico, com a forma portuguesa tradicional do nome.
