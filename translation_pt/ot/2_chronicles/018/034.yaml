base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/034.yaml
  text: And the battle intensified on that day[a], and the king of Israel remained standing in the chariot facing Aram until the evening; and he died at the time of the sun’s going down.
translation:
  language: pt
  text: Naquele dia, a batalha se intensificou, e o rei de Israel manteve-se de pé no carro de guerra, de frente para Aram, até o entardecer. Ele morreu quando o sol se pôs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao pôr do sol” ou “na hora em que o sol se punha”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַל הַמִּלְחָמָה
  choice: a batalha se intensificou
  rationale: O verbo עלה significa literalmente “subir”, mas, tendo “a batalha” como sujeito, expressa idiomaticamente o aumento da intensidade do combate.
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Expressão temporal comum, vertida de modo natural e fiel em português.
- source_word: הָיָה מַעֲמִיד
  choice: foi mantido de pé
  rationale: A construção com היה e particípio indica uma situação contínua. O hifil de עמד pode significar manter ou colocar de pé; o contexto anterior, em que o rei está ferido, favorece a forma passiva “foi mantido de pé”, sem especificar quem ou o que o sustentava.
- source_word: בַּמֶּרְכָּבָה
  choice: no carro de guerra
  rationale: “Carro de guerra” comunica com clareza ao leitor moderno o tipo de veículo militar referido por מֶרְכָּבָה.
- source_word: נֹכַח אֲרָם
  choice: diante dos arameus
  rationale: נֹכַח indica posição em frente ou em oposição. Neste contexto militar, אֲרָם designa as forças de Aram, por isso “diante dos arameus” é mais natural do que “diante de Aram”.
- source_word: עַד הָעָרֶב
  choice: até a tarde
  rationale: Preserva o limite temporal indicado pelo hebraico; “tarde” é uma tradução corrente de עֶרֶב neste contexto.
- source_word: לְעֵת בּוֹא הַשָּׁמֶשׁ
  choice: quando o sol se pôs
  rationale: A expressão descreve o momento em que o sol entra ou se põe. A formulação escolhida preserva a imagem verbal em português natural.
theological_decisions: []
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. A tradução mantém a progressão narrativa e evita acrescentar que o rei permaneceu de pé por esforço próprio; o hebraico permite a ideia de que ele foi mantido nessa posição.
