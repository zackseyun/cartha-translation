revisions:
- from: Naquele dia, a batalha se intensificou, e o rei de Israel foi mantido de pé no carro de guerra, diante dos arameus, até a tarde. Ele morreu quando o sol se pôs.[a]
  to: Naquele dia, a batalha se intensificou, e o rei de Israel manteve-se de pé no carro de guerra, de frente para Aram, até o entardecer. Ele morreu quando o sol se pôs.[a]
  rationale: A revisão conserva a escalada da batalha, a posição prolongada do rei, a referência geográfica/política a Aram e a morte no momento do ocaso. Remove a implicação não expressa de que um agente externo o sustentava e preserva a alternativa concisa para a expressão temporal final.
  reviewer_model: gpt-5.6-terra
