  text: וַ/יֹּ֥אמֶר מֶֽלֶךְ יִשְׂרָאֵ֖ל אֶל יְהוֹשָׁפָ֑ט הֲ/לֹא֙ אָמַ֣רְתִּי אֵלֶ֔י/ךָ לֹא יִתְנַבֵּ֥א עָלַ֛/י ט֖וֹב כִּ֥י אִם לְ/רָֽע־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/017.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Did I not tell you that he would not prophesy good concerning me, but only evil?”
translation:
  language: pt
  text: 'Então o rei de Israel disse a Josafá: “Eu não lhe disse que ele não profetizaria nada de bom a meu respeito, mas somente o mal[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não profetizaria nada de bom a meu respeito, mas somente desgraça”.'
    reason: Alternativa lexical que explicita o sentido contextual de רָע como calamidade ou resultado adverso.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa com naturalidade a sequência dos acontecimentos.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: o rei de Israel
  rationale: Tradução direta e corrente da cadeia construta hebraica.
- source_word: אֶל יְהוֹשָׁפָט
  choice: a Josafá
  rationale: A preposição identifica o destinatário da fala, e o hebraico emprega o nome sem acrescentar um título.
- source_word: הֲלֹא
  choice: Eu não ...?
  rationale: Introduz uma pergunta retórica que espera concordância; em português, a construção negativa preserva essa força.
- source_word: אָמַרְתִּי אֵלֶיךָ
  choice: lhe disse
  rationale: Expressão idiomática e fiel para a ação passada de dizer algo diretamente a Josafá.
- source_word: לֹא יִתְנַבֵּא
  choice: não profetizaria
  rationale: O imperfeito após o verbo de fala no passado é naturalmente expresso como futuro do pretérito, pois Acabe recorda o que já havia dito sobre Micaías.
- source_word: עָלַי
  choice: a meu respeito
  rationale: A preposição indica o assunto ou referente da profecia, sem sugerir necessariamente benefício.
- source_word: טוֹב
  choice: nada de bom
  rationale: O adjetivo tem função substantiva. A formulação portuguesa explicita de modo natural o sentido elíptico sem alterar o contraste.
- source_word: כִּי אִם
  choice: mas somente
  rationale: A expressão marca exceção e contraste enfáticos.
- source_word: לְרָע
  choice: o mal
  rationale: Preserva a antítese lexical entre טוֹב e רָע, embora, neste contexto, se refira a uma mensagem adversa ou desastrosa.
theological_decisions:
- issue: Natureza da mensagem profetizada
  choice: “nada de bom ... mas somente o mal”
  alternative: “nada de bom ... mas somente desgraça”
  rationale: A fala expressa a queixa de Acabe de que Micaías nunca lhe anuncia um resultado favorável, não uma afirmação abstrata sobre o mal moral. A tradução principal conserva a tensão e a antítese do hebraico; a nota esclarece a nuance contextual sem substituir o texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Emprega “lhe disse” e “a meu respeito” como formas naturais, evitando arcaísmos. O marcador da nota foi colocado junto à expressão que ela esclarece.
