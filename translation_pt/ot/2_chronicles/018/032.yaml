  text: וַ/יְהִ֗י כִּ/רְאוֹת֙ שָׂרֵ֣י הָ/רֶ֔כֶב כִּ֥י לֹא הָיָ֖ה מֶ֣לֶךְ יִשְׂרָאֵ֑ל וַ/יָּשֻׁ֖בוּ מֵ/אַחֲרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/032.yaml
  text: And when the commanders of the chariots saw that he was not the king of Israel[a], they turned back from following him.
translation:
  language: pt
  text: Quando os comandantes dos carros viram que ele não era o rei de Israel, pararam de persegui-lo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “voltaram de após ele”, expressão que significa que deixaram de segui-lo ou persegui-lo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: Quando ... viram
  rationale: A sequência narrativa com וַיְהִי e o infinitivo construto precedido de כִּי־/כְּ introduz uma oração temporal. Em português, “Quando ... viram” comunica isso de modo natural, sem a fórmula mais pesada “E aconteceu que, ao verem”.
- source_word: שָׂרֵי הָרֶכֶב
  choice: os comandantes dos carros
  rationale: שָׂרֵי designa chefes militares, e הָרֶכֶב se refere aos carros de guerra ou à força de carros. A formulação preserva de perto a estrutura hebraica e é compreensível no contexto.
- source_word: כִּי לֹא הָיָה מֶלֶךְ יִשְׂרָאֵל
  choice: que ele não era o rei de Israel
  rationale: O hebraico não explicita o sujeito, mas o sufixo masculino singular em מֵאַחֲרָיו aponta para o homem que perseguiam. O pronome “ele” fornece em português o sujeito exigido pelo contexto sem identificar o homem pelo nome.
- source_word: וַיָּשֻׁבוּ מֵאַחֲרָיו
  choice: pararam de persegui-lo
  rationale: A expressão combina “voltar/retornar” com a ideia idiomática de estar atrás de alguém. No contexto militar, indica que os comandantes desistiram da perseguição. “Pararam de persegui-lo” transmite claramente a ação, enquanto a nota registra a forma literal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção concisa acompanha o ritmo narrativo do hebraico; “carros” é mantido no sentido contextual de carros de guerra.
