  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ הַ/מֶּ֔לֶךְ עַד כַּ/מֶּ֥ה פְעָמִ֖ים אֲנִ֣י מַשְׁבִּיעֶ֑/ךָ אֲ֠שֶׁר לֹֽא תְדַבֵּ֥ר אֵלַ֛/י רַק אֱמֶ֖ת בְּ/שֵׁ֥ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/015.yaml
  text: Then the king said to him, “How many times must I make you swear that you tell me nothing but the truth in the name of Yahweh?”
translation:
  language: pt
  text: 'Então o rei lhe disse: “Quantas vezes terei de fazer você jurar que não me dirá nada além da verdade em nome de Yahweh?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Mantém o substantivo definido do hebraico sem inserir o nome do rei.
- source_word: עַד כַּמֶּה פְעָמִים
  choice: Quantas vezes
  rationale: Reproduz de modo idiomático a pergunta impaciente e retórica do rei.
- source_word: מַשְׁבִּיעֶךָ
  choice: terei de fazer você jurar
  rationale: O hifil de שבע indica fazer alguém jurar ou colocá-lo sob juramento. A formulação é clara e corrente, e “terei de” comunica a exasperação contextual sem transformar a pergunta em simples informação.
- source_word: אֲשֶׁר לֹא תְדַבֵּר אֵלַי רַק אֱמֶת
  choice: que não me dirá nada além da verdade
  rationale: Preserva a construção negativa e exclusiva do hebraico, ao mesmo tempo que usa uma formulação natural em português. “Dirá” explicita adequadamente o ato de comunicar algo ao rei.
- source_word: בְּשֵׁם יְהוָה
  choice: em nome de Yahweh
  rationale: Expressa a autoridade e a solenidade ligadas ao nome divino, mantendo o nome próprio representado pelo Tetragrama.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” conserva sua função como nome próprio sem substituí-lo por um título; “Javé” é uma adaptação portuguesa possível, mas menos transparente em relação à forma adotada pelo projeto.
translation_notes:
  register: Português moderno, digno e acessível, com ordem narrativa natural. Emprega “você” por sua ampla clareza para leitores brasileiros, sem coloquialismos adicionais. A formulação conserva o tom impaciente do rei e a linguagem judicial do juramento.
