base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/002.yaml
  text: After some years[a], he went down to Ahab in Samaria, and Ahab slaughtered sheep and cattle in abundance for him and for the people who were with him[b], and urged him to go up against Ramoth-gilead.
translation:
  language: pt
  text: Depois de alguns anos, Josafá desceu a Acabe, em Samaria. Acabe abateu grande quantidade de ovelhas e bois para ele e para o povo que estava com Josafá. Então induziu Josafá[a] a subir contra Ramote-Gileade.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “incitou Josafá” ou “seduziu Josafá”.'
    reason: Preserva alternativas para וַיְסִיתֵהוּ, verbo que pode denotar incitação ou sedução para agir.
  - marker: b
    text: 'Literalmente: “subir a Ramote-Gileade”; neste contexto, trata-se de uma ação militar contra a cidade.'
    reason: Registra a forma direcional mais literal e a explicitação contextual adotada no texto.
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: desceu
  rationale: Preserva o sentido direcional e topográfico de ירד, natural no deslocamento de Judá para Samaria.
- source_word: לְקֵץ שָׁנִים
  choice: Depois de alguns anos
  rationale: Expressa em português natural o período transcorrido indicado pelo idiomatismo hebraico, sem determinar um número não informado.
- source_word: אֶל אַחְאָב לְשֹׁמְרוֹן
  choice: para visitar Acabe em Samaria
  rationale: Torna clara a ida até Acabe, que estava em Samaria. O verbo “visitar” é inferido pelo contexto de deslocamento e recepção, sem alterar o destino expresso.
- source_word: וַיִּזְבַּח לוֹ אַחְאָב
  choice: Acabe abateu ... para ele
  rationale: זבח pode designar sacrificar ou abater. Aqui, a hospitalidade e o banquete real favorecem “abateu”, que evita sugerir necessariamente um ato de culto.
- source_word: צֹאן וּבָקָר
  choice: ovelhas e bois
  rationale: Tradução concreta e corrente das duas categorias de animais, adequada ao contexto do banquete.
- source_word: לָרֹב
  choice: grande quantidade
  rationale: Comunica de modo natural a abundância indicada pelo hebraico.
- source_word: וְלָעָם אֲשֶׁר עִמּוֹ
  choice: para o povo que o acompanhava
  rationale: Mantém o sentido amplo de עָם, sem restringir indevidamente o grupo a soldados ou oficiais.
- source_word: וַיְסִיתֵהוּ
  choice: pressionou Josafá
  rationale: Comunica forte indução à ação sem definir por completo se houve sedução, incitação ou mera insistência. O nome do referente é repetido para evitar ambiguidade em português.
- source_word: לַעֲלוֹת
  choice: a subir
  rationale: Preserva a imagem direcional de עלה e sua aplicação a uma campanha militar.
- source_word: אֶל רָמוֹת גִּלְעָד
  choice: contra Ramote-Gileade
  rationale: Embora אֶל signifique literalmente “a/para”, o contexto militar mostra que a cidade era o alvo da campanha; “contra” comunica isso naturalmente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição de “Josafá” evita a possível confusão criada por uma sequência de pronomes masculinos. O topônimo segue a forma portuguesa tradicional “Ramote-Gileade”.
