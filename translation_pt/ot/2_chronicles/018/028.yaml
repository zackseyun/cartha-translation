  text: וַ/יַּ֧עַל מֶֽלֶךְ יִשְׂרָאֵ֛ל וִֽ/יהוֹשָׁפָ֥ט מֶֽלֶךְ יְהוּדָ֖ה אֶל רָמֹ֥ת גִּלְעָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/028.yaml
  text: So the king of Israel and Jehoshaphat king of Judah went up to Ramoth-gilead.
translation:
  language: pt
  text: Assim, o rei de Israel e Josafá, rei de Judá, subiram a Ramote-Gileade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: subiram
  rationale: O verbo עלה significa literalmente “subir”. Embora esteja no singular, o sujeito composto formado pelos dois reis pede o plural em português; “subiram” preserva o sentido direcional sem acrescentar uma ideia militar ausente do verbo.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: o rei de Israel
  rationale: Reproduz de modo natural e transparente o título régio hebraico, cujo referente definido já é conhecido no contexto.
- source_word: וִיהוֹשָׁפָט
  choice: e Josafá
  rationale: A conjunção tem valor aditivo, e “Josafá” é a forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: מֶלֶךְ יְהוּדָה
  choice: rei de Judá
  rationale: O título está em aposição ao nome próprio; a construção “Josafá, rei de Judá” é clara e natural em português.
- source_word: אֶל
  choice: a
  rationale: A preposição indica movimento até o destino. Com o verbo “subir”, “a” é uma equivalência portuguesa concisa e formalmente adequada.
- source_word: רָמֹת גִּלְעָד
  choice: Ramote-Gileade
  rationale: Emprega a forma portuguesa tradicional do topônimo composto, mantendo o hífen para evidenciar sua unidade.
