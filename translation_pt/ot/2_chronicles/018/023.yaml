  text: וַ/יִּגַּשׁ֙ צִדְקִיָּ֣הוּ בֶֽן כְּנַעֲנָ֔ה וַ/יַּ֥ךְ אֶת מִיכָ֖יְהוּ עַל הַ/לֶּ֑חִי וַ/יֹּ֗אמֶר אֵ֣י זֶ֤ה הַ/דֶּ֨רֶךְ֙ עָבַ֧ר רֽוּחַ יְהוָ֛ה מֵ/אִתִּ֖/י לְ/דַבֵּ֥ר אֹתָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/023.yaml
  text: Then Zedekiah son of Chenaanah came near and struck Micaiah on the cheek[a], and said, “Which way did the Spirit of Yahweh pass from me to speak to you?”
translation:
  language: pt
  text: 'Então Zedequias, filho de Quenaaná, aproximou-se, golpeou Micaías na bochecha[a] e disse: “Por qual caminho o Espírito de Yahweh passou de mim para falar com você?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no maxilar”.'
    reason: O hebraico לֶחִי designa a bochecha ou face lateral e também pode referir-se à região do maxilar.
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: aproximou-se
  rationale: Expressa de modo natural o movimento de chegar perto, preservando o caráter confrontador da cena.
- source_word: צִדְקִיָּהוּ בֶן כְּנַעֲנָה
  choice: Zedequias, filho de Quenaaná
  rationale: Emprega as formas portuguesas reconhecíveis dos nomes e mantém explicitamente a relação filial.
- source_word: וַיַּךְ אֶת מִיכָיְהוּ עַל הַלֶּחִי
  choice: golpeou Micaías no rosto
  rationale: נכה é um verbo amplo para desferir um golpe; “golpeou” evita especificar indevidamente uma bofetada. לֶחִי designa a região da face, especialmente face lateral, queixo ou maxilar; “rosto” é claro no português corrente, com a alternativa registrada em nota.
- source_word: אֵי זֶה הַדֶּרֶךְ
  choice: Por qual caminho
  rationale: Preserva a imagem espacial de um caminho ou percurso e, no contexto, funciona naturalmente como desafio sarcástico.
- source_word: עָבַר
  choice: passou
  rationale: Mantém a imagem do Espírito deslocando-se de um profeta para outro, central à provocação de Zedequias.
- source_word: רוּחַ יְהוָה
  choice: o Espírito de Yahweh
  rationale: O contexto profético aponta para o Espírito divino; “Yahweh” representa diretamente o nome divino יהוה.
- source_word: מֵאִתִּי
  choice: de mim
  rationale: Conserva a indicação explícita de origem ou afastamento presente no hebraico.
- source_word: לְדַבֵּר אֹתָךְ
  choice: para falar com você
  rationale: “Falar com” é português natural e acomoda a construção hebraica incomum com אֵת, sem decidir além do necessário entre dirigir-se a alguém e conversar com alguém.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” preserva sua função de nome da aliança, em vez de substituí-lo por um título.
- issue: Referente de רוּחַ יְהוָה
  choice: Espírito de Yahweh
  alternative: espírito de Yahweh
  rationale: No contexto da inspiração e fala proféticas, a expressão se refere ao Espírito divino; a inicial maiúscula comunica esse referente sem resolver a tensão narrativa sobre qual profeta fala verdadeiramente por ele.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas nominais familiares ao leitor brasileiro. A pergunta mantém deliberadamente a imagem concreta do caminho percorrido pelo Espírito e o tom provocador de Zedequias.
