base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/019.yaml
  text: And Yahweh said[a], ‘Who will entice Ahab king of Israel, so that he may go up and fall at Ramoth-gilead?’ And one said this, and another said that.
translation:
  language: pt
  text: 'E Yahweh disse: “Quem persuadirá[a] Acabe, rei de Israel, a subir e cair em Ramote-Gileade?” E um dizia uma coisa, e outro dizia outra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seduzirá” ou “enganará”.
    reason: Alternativas lexicais possíveis para פתה, cuja nuance inclui persuasão, sedução e engano.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino pessoal representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: יְפַתֶּה
  choice: persuadirá
  rationale: O piel de פתה pode indicar persuadir, seduzir ou enganar. “Persuadirá” expressa a indução de Acabe a agir sem eliminar a ambiguidade moral, registrada em nota.
- source_word: וְיַעַל וְיִפֹּל
  choice: a subir e cair
  rationale: A construção expressa o resultado pretendido da persuasão. “Cair” preserva a imagem hebraica, que no contexto militar implica derrota e morte.
- source_word: בְּרָמוֹת גִּלְעָד
  choice: em Ramote-Gileade
  rationale: Emprega a forma portuguesa corrente do topônimo e uma preposição natural para o local onde Acabe cairia.
- source_word: זֶה אֹמֵר כָּכָה וְזֶה אֹמֵר כָּכָה
  choice: Então um dizia uma coisa, e outro dizia outra
  rationale: Reproduz de modo natural a apresentação de propostas diferentes no conselho celestial, preservando o paralelismo entre os participantes.
theological_decisions:
- issue: Participação divina na queda de Acabe
  choice: Yahweh pergunta diretamente quem persuadirá Acabe a subir e cair.
  alternative: Atenuar a agência divina com formulações como “permitirá que seja persuadido”.
  rationale: O hebraico apresenta Yahweh iniciando diretamente a deliberação; a tradução conserva essa tensão teológica.
- issue: Nuance moral de פתה
  choice: persuadirá, com alternativas em nota
  alternative: enganará ou seduzirá no texto principal
  rationale: O contexto posterior envolve engano, mas o verbo admite uma faixa semântica mais ampla. A nota preserva as possibilidades sem estreitar indevidamente o texto principal.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção direta. “Acabe, rei de Israel” usa aposição natural; “Ramote-Gileade” segue a forma portuguesa tradicional do topônimo.
