  text: וְ/הַ/מַּלְאָ֞ךְ אֲשֶׁר הָלַ֣ךְ לִ/קְרֹ֣א לְ/מִיכָ֗יְהוּ דִּבֶּ֤ר אֵלָי/ו֙ לֵ/אמֹ֔ר הִנֵּ֞ה דִּבְרֵ֧י הַ/נְּבִאִ֛ים פֶּֽה אֶחָ֥ד ט֖וֹב אֶל הַ/מֶּ֑לֶךְ וִֽ/יהִי נָ֧א דְבָרְ/ךָ֛ כְּ/אַחַ֥ד מֵ/הֶ֖ם וְ/דִבַּ֥רְתָּ טּֽוֹב־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/012.yaml
  text: The messenger who had gone to summon Micaiah spoke to him[a], saying, “Look, the words of the prophets are unanimously favorable to the king. Please let your word be like one of theirs, and speak favorably.”
translation:
  language: pt
  text: 'O mensageiro que tinha ido chamar Micaías lhe disse: “Veja, as palavras dos profetas, a uma só voz[a], são favoráveis ao rei. Por favor, que a sua palavra seja como a de um deles, e fale favoravelmente.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “com uma só boca”, expressão que significa em pleno acordo ou a uma só voz.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: mensageiro
  rationale: No contexto, trata-se do enviado humano que foi chamar Micaías; «mensageiro» é preferível a «anjo».
- source_word: לִקְרֹא
  choice: chamar
  rationale: Expressa de modo natural o ato de mandar Micaías comparecer, sem tornar o verbo mais técnico do que o hebraico exige.
- source_word: לְמִיכָיְהוּ
  choice: Micaías
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: דִּבֶּר אֵלָיו לֵאמֹר
  choice: lhe disse
  rationale: Reproduz naturalmente em português a fórmula narrativa hebraica, cujo «dizendo» pode ser omitido sem perda de sentido.
- source_word: הִנֵּה
  choice: Veja
  rationale: Preserva a função de chamar a atenção em linguagem contemporânea e digna.
- source_word: דִּבְרֵי הַנְּבִאִים
  choice: os profetas ... estão falando
  rationale: Representa idiomaticamente «as palavras dos profetas» e permite conservar com clareza a construção adverbial «a uma só voz».
- source_word: פֶּה אֶחָד
  choice: a uma só voz
  rationale: Conserva a imagem do idioma hebraico, literalmente «uma boca», em uma expressão portuguesa natural que indica pleno acordo.
- source_word: טוֹב אֶל הַמֶּלֶךְ
  choice: favoravelmente ao rei
  rationale: Neste contexto, «bom» qualifica uma mensagem positiva ou favorável ao rei, não necessariamente verdadeira.
- source_word: וִיהִי נָא
  choice: Por favor, que ... seja
  rationale: Transmite a exortação cortês do jussivo acompanhado de נָא.
- source_word: דְבָרְךָ
  choice: a sua palavra
  rationale: Mantém o singular hebraico, que designa o pronunciamento profético como uma unidade.
- source_word: כְּאַחַד מֵהֶם
  choice: como a de um deles
  rationale: Em português, a elipse «a [palavra] de um deles» deixa claro que a comparação é entre pronunciamentos.
- source_word: וְדִבַּרְתָּ טּוֹב
  choice: e fale favoravelmente
  rationale: Preserva a repetição da ideia anterior e a pressão para que Micaías profira uma mensagem positiva.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A imagem hebraica é mantida por meio da expressão portuguesa «a uma só voz», e a insistência do mensageiro é preservada sem sugerir que a mensagem favorável seria necessariamente verdadeira.
