base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/033.yaml
  text: But a man drew his bow at random and struck the king of Israel between the scale armor and the breastplate[a]. So he said to the charioteer, “Turn your hand and take me out of the camp[c][b], for I am wounded.”
translation:
  language: pt
  text: 'Mas um homem retesou o arco ao acaso[a] e atingiu o rei de Israel entre as peças da armadura e a couraça[b]. Então o rei disse ao condutor do carro: “Dê meia-volta[c] e tire-me do campo de batalha, pois estou ferido”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sem mirar”. O hebraico também pode significar literalmente “em sua inocência” ou “em sua simplicidade”; neste contexto, provavelmente indica que ele disparou sem visar um alvo específico.
    reason: lexical_alternative
  - marker: b
    text: A terminologia hebraica da armadura é incerta. Outra tradução possível é “entre as junções da armadura e a couraça”. O sentido é que a flecha encontrou uma abertura na proteção do rei.
    reason: cultural_note
  - marker: c
    text: Literalmente, “Vire a sua mão”. A expressão provavelmente ordena ao condutor que faça o carro voltar ou que o manobre para longe do combate.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: Mas um homem
  rationale: A conjunção dá sequência à narrativa e aqui introduz uma virada contrastante; אִישׁ permanece indefinido.
- source_word: מָשַׁךְ בַּקֶּשֶׁת
  choice: retesou o arco
  rationale: A expressão descreve o ato de puxar o arco para disparar; “retesou o arco” é idiomático e digno em português.
- source_word: לְתֻמּוֹ
  choice: ao acaso
  rationale: Embora o termo possa expressar inocência ou simplicidade, no contexto militar indica mais provavelmente que o arqueiro disparou sem escolher um alvo específico.
- source_word: וַיַּךְ
  choice: atingiu
  rationale: נכה indica golpear ou acertar; “atingiu” descreve o impacto sem antecipar a declaração posterior de que o rei foi ferido.
- source_word: בֵּין הַדְּבָקִים וּבֵין הַשִּׁרְיָן
  choice: entre as peças da armadura e a couraça
  rationale: Os termos técnicos são incertos. דְּבָקִים sugere peças unidas ou encaixadas, e שִׁרְיָן designa uma proteção corporal; a formulação comunica que a flecha encontrou uma abertura entre componentes da armadura.
- source_word: לָרַכָּב
  choice: ao condutor do carro
  rationale: O substantivo designa quem conduzia o carro de guerra; a expressão é clara em português moderno.
- source_word: הֲפֹךְ יָדֶיךָ
  choice: Dê meia-volta
  rationale: Literalmente, a ordem menciona virar a mão, mas no contexto é uma instrução para manobrar ou fazer voltar o carro; a imagem hebraica é registrada em nota.
- source_word: וְהוֹצֵאתַנִי מִן הַמַּחֲנֶה
  choice: e tire-me do campo de batalha
  rationale: מַחֲנֶה pode indicar acampamento, exército ou formação militar. Neste contexto, o pedido é para ser retirado da área onde as forças combatem.
- source_word: כִּי הָחֳלֵיתִי
  choice: pois fui ferido
  rationale: O verbo pode expressar adoecimento, fraqueza ou ferimento; após o impacto da flecha, “fui ferido” transmite o sentido contextual sem acrescentar uma intensidade não explicitada lexicalmente.
