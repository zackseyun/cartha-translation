source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּ֨ה נָתַ֤ן יְהוָה֙ ר֣וּחַ שֶׁ֔קֶר בְּ/פִ֖י נְבִיאֶ֣י/ךָ אֵ֑לֶּה וַֽ/יהוָ֔ה דִּבֶּ֥ר עָלֶ֖י/ךָ רָעָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/022.yaml
  text: And now, look, the LORD has put a lying spirit in the mouth of these prophets of yours, and the LORD has spoken disaster against you.
translation:
  language: pt
  text: E agora, eis que o SENHOR pôs um espírito de mentira na boca destes seus profetas, e o SENHOR anunciou uma desgraça contra você.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה הִנֵּה
  choice: E agora, vejam
  rationale: Preserva tanto a transição temporal quanto a partícula que chama enfaticamente a atenção dos ouvintes, em português natural.
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o tetragrama por SENHOR em versaletes.
- source_word: ר֣וּחַ שֶׁקֶר
  choice: um espírito de mentira
  rationale: Tradução direta que mantém a ambiguidade de רוּחַ entre um ser espiritual e uma influência espiritual, sem explicá-la no texto.
- source_word: בְּפִי נְבִיאֶיךָ אֵלֶּה
  choice: na boca desses seus profetas
  rationale: Conserva a imagem hebraica da boca como veículo da mensagem e a força do possessivo dirigido ao rei.
- source_word: דִּבֶּר עָלֶיךָ רָעָה
  choice: anunciou uma desgraça contra você
  rationale: Neste contexto, דִּבֶּר indica uma declaração divina, enquanto רָעָה denota calamidade ou desgraça, não necessariamente mal moral.
theological_decisions:
- issue: Agência divina no envio do espírito de mentira
  choice: o SENHOR pôs um espírito de mentira
  alternative: o SENHOR permitiu que um espírito de mentira viesse
  rationale: O hebraico נָתַן afirma diretamente que o SENHOR o pôs ou colocou; a tradução não atenua essa tensão teológica por meio de linguagem meramente permissiva.
- issue: Caráter da רָעָה anunciada
  choice: uma desgraça
  alternative: o mal
  rationale: No contexto, trata-se da calamidade decretada contra Acabe. “Desgraça” evita sugerir que Deus tenha anunciado ou praticado maldade moral.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. O plural “vejam” reflete que Micaías está diante do rei e da assembleia; “você” mantém a referência singular a Acabe. A formulação preserva o paralelismo e a tensão teológica do hebraico.
