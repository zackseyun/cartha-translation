base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/020.yaml
  text: Then the spirit came forward and stood before Yahweh and said[a], ‘I will entice him.’ And Yahweh said to him, ‘By what means?’
translation:
  language: pt
  text: 'Então o espírito avançou, pôs-se diante de Yahweh e disse: “Eu o induzirei[a]”. Yahweh lhe disse: “De que modo?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu o enganarei” ou “Eu o persuadirei”. O verbo hebraico pode ter o sentido de induzir, persuadir ou enganar, conforme o contexto.'
    reason: alternativa lexical
lexical_decisions:
- source_word: הָרוּחַ
  choice: o espírito
  rationale: Embora רוּחַ também possa significar vento ou sopro, as ações pessoais de avançar, colocar-se diante de Yahweh e falar indicam aqui um ser espiritual.
- source_word: וַיֵּצֵא
  choice: avançou
  rationale: יצא significa literalmente sair, mas, nesta cena de conselho celestial, descreve com naturalidade o espírito que se apresenta diante de Yahweh.
- source_word: וַיַּעֲמֹד לִפְנֵי
  choice: pôs-se diante de
  rationale: Preserva a ideia de tomar posição formalmente na presença de alguém e soa natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֲפַתֶּנּוּ
  choice: Eu o induzirei
  rationale: O piel de פתה pode expressar induzir, persuadir, seduzir ou enganar. “Induzirei” preserva a ideia de levar Acabe a determinado curso sem explicitar antecipadamente o meio enganoso revelado no versículo seguinte.
- source_word: בַּמָּה
  choice: De que modo?
  rationale: A pergunta solicita o meio ou a maneira pela qual o espírito realizará sua proposta; esta formulação é clara e digna em português atual.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: A transliteração mantém o nome pessoal no texto e segue a decisão lexical fornecida, sem substituí-lo por um título.
- issue: Nuance moral e teológica de פתה no conselho celestial
  choice: Eu o induzirei
  alternative: Eu o enganarei; Eu o persuadirei
  rationale: A escolha conserva a amplitude do verbo e a tensão da cena, enquanto a nota registra explicitamente as nuances possíveis. O mecanismo enganoso só é especificado no versículo seguinte.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Avançou” e “pôs-se diante de” mantêm o caráter formal da cena sem recorrer a linguagem arcaica.
