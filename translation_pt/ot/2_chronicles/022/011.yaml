  text: וַ/תִּקַּח֩ יְהוֹשַׁבְעַ֨ת בַּת הַ/מֶּ֜לֶךְ אֶת יוֹאָ֣שׁ בֶּן אֲחַזְיָ֗הוּ וַ/תִּגְנֹ֤ב אֹת/וֹ֙ מִ/תּ֤וֹךְ בְּנֵֽי הַ/מֶּ֨לֶךְ֙ הַ/מּ֣וּמָתִ֔ים וַ/תִּתֵּ֥ן אֹת֛/וֹ וְ/אֶת מֵֽינִקְתּ֖/וֹ בַּ/חֲדַ֣ר הַ/מִּטּ֑וֹת וַ/תַּסְתִּירֵ֡/הוּ יְהוֹשַׁבְעַ֣ת בַּת הַ/מֶּ֣לֶךְ יְהוֹרָ֡ם אֵשֶׁת֩ יְהוֹיָדָ֨ע הַ/כֹּהֵ֜ן כִּ֣י הִיא֩ הָיְתָ֨ה אֲח֧וֹת אֲחַזְיָ֛הוּ מִ/פְּנֵ֥י עֲתַלְיָ֖הוּ וְ/לֹ֥א הֱמִיתָֽתְ/הוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/011.yaml
  text: But Jehoshabeath[a], the king’s daughter, took Joash son of Ahaziah and stole him away from among the king’s sons who were being put to death, and she put him and his nurse in the bedroom. So Jehoshabeath, the daughter of King Jehoram, the wife of Jehoiada the priest, hid him from Athaliah[c][b], and she did not put him to death.
translation:
  language: pt
  text: Mas Jeosabeate, filha do rei, tomou Joás, filho de Acazias, e o tirou às escondidas do meio dos filhos do rei que estavam sendo mortos[a]. Ela colocou Joás e sua ama de leite no quarto[b]. Assim, Jeosabeate, filha do rei Jeorão e mulher do sacerdote Joiada — pois era irmã de Acazias —, escondeu-o de Atalia, e ela não o matou[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que seriam mortos”; também é possível entender: “os filhos do rei que haviam sido mortos”.'
    reason: O particípio passivo hebraico pode ser relacionado ao processo, ao destino iminente ou ao estado resultante, embora o contexto favoreça um morticínio em curso.
  - marker: b
    text: 'Hebraico: “no aposento das camas”, isto é, num quarto ou câmara de dormir.'
    reason: Registra a forma concreta da expressão hebraica por trás da tradução idiomática.
  - marker: c
    text: 'O mais provável é que “ela” se refira a Atalia: Jeosabeate escondeu Joás para que Atalia não o matasse. Gramaticalmente, porém, o sujeito feminino não é expresso, e também pode ser entendido como Jeosabeate.'
    reason: Preserva e explica a ambiguidade do sujeito implícito no hebraico.
lexical_decisions:
- source_word: וַתִּקַּח
  choice: tomou
  rationale: Mantém o valor narrativo básico de לקח sem acrescentar explicitamente a ideia interpretativa de resgate.
- source_word: וַתִּגְנֹב אֹתוֹ
  choice: o tirou às escondidas
  rationale: גנב envolve retirar secretamente, como quem furta. Esta formulação natural em português preserva o caráter clandestino da ação sem sugerir um sequestro hostil.
- source_word: מִתּוֹךְ בְּנֵי הַמֶּלֶךְ הַמּוּמָתִים
  choice: do meio dos filhos do rei que estavam sendo mortos
  rationale: O particípio passivo apresenta os filhos do rei no contexto do morticínio em curso; a tradução conserva o perigo imediato sem afirmar necessariamente que todos já estavam mortos.
- source_word: מֵינִקְתּוֹ
  choice: sua ama de leite
  rationale: O termo designa especificamente a mulher que amamentava a criança; “ama de leite” é claro e historicamente apropriado em português.
- source_word: בַּחֲדַר הַמִּטּוֹת
  choice: no quarto
  rationale: A expressão significa literalmente “no aposento das camas”; “quarto” comunica seu sentido de modo natural, com a forma literal registrada em nota.
- source_word: וַתַּסְתִּירֵהוּ
  choice: escondeu-o
  rationale: Reproduz diretamente o sentido comum de סתר, sem ampliar a ação para além do texto.
- source_word: אֵשֶׁת יְהוֹיָדָע הַכֹּהֵן
  choice: mulher do sacerdote Joiada
  rationale: Preserva a identificação relacional e sacerdotal em ordem natural no português moderno.
- source_word: כִּי הִיא הָיְתָה אֲחוֹת אֲחַזְיָהוּ
  choice: pois era irmã de Acazias
  rationale: “Pois” expressa a função explicativa ou causal de כִּי e mantém explícito o parentesco que ajuda a explicar sua ação.
- source_word: מִפְּנֵי עֲתַלְיָהוּ
  choice: de Atalia
  rationale: Neste contexto, a expressão idiomática indica que Joás foi ocultado da presença e do alcance de Atalia.
- source_word: וְלֹא הֱמִיתָתְהוּ
  choice: e ela não o matou
  rationale: Mantém o sujeito feminino implícito e, portanto, a ambiguidade gramatical do hebraico; o contexto favorece Atalia, esclarecida em nota sem substituir a formulação do texto.
theological_decisions:
- issue: Referente do sujeito feminino implícito em וְלֹא הֱמִיתָתְהוּ
  choice: Conservar no texto a formulação ambígua “ela não o matou”, com nota indicando Atalia como referente mais provável.
  alternative: Explicitar “Atalia não o matou”; menos provavelmente, entender Jeosabeate como sujeito.
  rationale: O hebraico não nomeia novamente o sujeito. O contexto imediato — Jeosabeate escondeu Joás de Atalia — favorece fortemente Atalia, mas explicitar o nome no corpo do versículo eliminaria uma ambiguidade real da forma hebraica.
translation_notes:
  register: Português atual, digno e amplamente inteligível, com nomes bíblicos correntes no uso brasileiro. A narrativa foi dividida em três frases para facilitar a leitura, sem omitir a repetição identificadora de Jeosabeate nem a explicação de seu parentesco. Empregou-se “ama de leite” pela precisão lexical e “tirou às escondidas” para transmitir tanto a retirada quanto seu caráter secreto.
