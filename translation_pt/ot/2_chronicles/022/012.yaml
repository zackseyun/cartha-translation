  yaml_path: translation/ot/2_chronicles/022/012.yaml
  text: And he was with them in the house of God[a], hiding himself for six years[b], while Athaliah was reigning over the land.
translation:
  language: pt
  text: E ele ficou com eles na casa de Deus[a], mantendo-se escondido[b] durante seis anos, enquanto Atalia reinava sobre a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, no recinto do templo; literalmente, “na casa de Deus”.
    reason: cultural_note
  - marker: b
    text: Ou “escondendo-se”. O particípio hebraico pode indicar uma ação reflexiva ou descrever o estado contínuo de quem permanecia oculto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אִתָּם
  choice: ele ficou com eles
  rationale: No contexto, a forma narrativa de היה indica a permanência de Joás junto daqueles que o ocultavam; “ficou com eles” é natural em português e preserva essa continuidade.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: na casa de Deus
  rationale: Mantém a expressão hebraica literal e inteligível, sem substituir no texto principal a imagem de “casa” por “templo”.
- source_word: מִתְחַבֵּא
  choice: mantendo-se escondido
  rationale: O particípio hitpael expressa uma situação contínua com nuance reflexiva ou média. A formulação portuguesa preserva tanto a participação do sujeito quanto seu estado de ocultação.
- source_word: שֵׁשׁ שָׁנִים
  choice: durante seis anos
  rationale: “Durante” expressa de modo idiomático a duração indicada pela construção hebraica.
- source_word: וַעֲתַלְיָה מֹלֶכֶת
  choice: enquanto Atalia reinava
  rationale: O particípio feminino descreve uma ação simultânea e contínua; “enquanto” explicita naturalmente essa relação temporal em português.
- source_word: עַל הָאָרֶץ
  choice: sobre a terra
  rationale: Traduz diretamente a expressão hebraica, que aqui se refere ao território ou reino de Judá, sem acrescentar no texto uma especificação ausente do original.
