  text: בֶּן אַרְבָּעִ֨ים וּ/שְׁתַּ֤יִם שָׁנָה֙ אֲחַזְיָ֣הוּ בְ/מָלְכ֔/וֹ וְ/שָׁנָ֣ה אַחַ֔ת מָלַ֖ךְ בִּֽ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ עֲתַלְיָ֖הוּ בַּת עָמְרִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/002.yaml
  text: Ahaziah was forty-two years old when he became king[a], and he reigned one year in Jerusalem. His mother’s name was Athaliah[b], the daughter of Omri.
translation:
  language: pt
  text: Acazias tinha quarenta e dois anos quando começou a reinar[a] e reinou um ano em Jerusalém. O nome de sua mãe era Atalia[b], filha de Onri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «quarenta e dois anos». O relato paralelo em 2 Reis 8:26 diz «vinte e dois anos»; por isso, alguns entendem que há aqui um problema textual ou propõem outra forma de calcular o número.'
    reason: textual_variant
  - marker: b
    text: 'Ou: «descendente de Onri». Em hebraico, «filha» às vezes pode designar uma descendente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אַרְבָּעִים וּשְׁתַּיִם שָׁנָה
  choice: tinha quarenta e dois anos
  rationale: A expressão hebraica é a fórmula idiomática comum para indicar idade. A tradução natural em português evita o literalismo inadequado «era filho de quarenta e dois anos».
- source_word: בְמָלְכוֹ
  choice: quando começou a reinar
  rationale: A construção com בְּ e o infinitivo construto situa temporalmente a ascensão de Acazias ao trono.
- source_word: וְשָׁנָה אַחַת מָלַךְ
  choice: e reinou um ano
  rationale: Expressa diretamente a duração do reinado e preserva o numeral hebraico.
- source_word: בִּירוּשָׁלָם
  choice: em Jerusalém
  rationale: Corresponde ao uso locativo da preposição hebraica com o nome da cidade.
- source_word: וְשֵׁם אִמּוֹ
  choice: O nome de sua mãe era
  rationale: Mantém o conteúdo da fórmula régia hebraica em português atual e digno.
- source_word: עֲתַלְיָהוּ
  choice: Atalia
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: בַּת עָמְרִי
  choice: filha de Onri
  rationale: Preserva no texto principal o sentido lexical direto de בַּת, sem resolver implicitamente a possível relação genealógica mais ampla.
theological_decisions:
- issue: Tensão cronológica na idade de Acazias ao subir ao trono
  choice: Manter «quarenta e dois anos» no texto principal
  alternative: «vinte e dois anos», conforme 2 Reis 8:26; ou entender o número segundo outra forma de contagem
  rationale: O texto hebraico fornecido diz «quarenta e dois». A tradução preserva essa leitura em vez de emendá-la ou harmonizá-la silenciosamente com o relato paralelo.
- issue: Alcance genealógico de «filha de Onri»
  choice: Traduzir literalmente como «filha de Onri»
  alternative: «descendente de Onri»
  rationale: O hebraico emprega o termo comum para «filha», embora termos de parentesco possam ter sentido genealógico mais amplo. A alternativa é registrada em nota para preservar a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário bíblico amplamente reconhecido. Mantêm-se no texto principal as leituras do hebraico massorético, enquanto as tensões textual e genealógica são apresentadas em notas.
