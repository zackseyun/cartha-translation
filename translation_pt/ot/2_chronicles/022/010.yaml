  text: וַ/עֲתַלְיָ֨הוּ֙ אֵ֣ם אֲחַזְיָ֔הוּ רָאֲתָ֖ה כִּ֣י מֵ֣ת בְּנָ֑/הּ וַ/תָּ֗קָם וַ/תְּדַבֵּ֛ר אֶת כָּל זֶ֥רַע הַ/מַּמְלָכָ֖ה לְ/בֵ֥ית יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/010.yaml
  text: Athaliah[a], the mother of Ahaziah, saw that her son was dead, and she arose and destroyed all the royal offspring of the house of Judah.
translation:
  language: pt
  text: Atalia, mãe de Acazias, viu que seu filho estava morto; levantou-se e exterminou[a] toda a descendência real da casa de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico apresenta aqui uma forma verbal difícil, literalmente “falou”; porém, o contexto e o relato paralelo em 2 Reis 11:1 apoiam o sentido de “exterminou” ou “matou”.
    reason: textual_variant
lexical_decisions:
- source_word: וַעֲתַלְיָהוּ
  choice: Atalia
  rationale: Transliteração portuguesa tradicional e amplamente reconhecível do nome próprio hebraico; o waw narrativo não exige um marcador temporal explícito.
- source_word: אֵם אֲחַזְיָהוּ
  choice: mãe de Acazias
  rationale: Expressa de modo claro e natural a relação de construção no hebraico.
- source_word: רָאֲתָה כִּי מֵת בְּנָהּ
  choice: viu que seu filho estava morto
  rationale: Preserva a percepção de um fato indicada por רָאָה com כִּי e mantém o valor estativo da oração hebraica.
- source_word: וַתָּקָם
  choice: levantou-se
  rationale: Mantém a força narrativa de קוּם como início de uma ação decidida, em registro digno e corrente.
- source_word: וַתְּדַבֵּר
  choice: exterminou
  rationale: Embora a forma consonantal corresponda normalmente a 'falou', o objeto direto, o contexto e o paralelo de 2 Reis 11:1 indicam aqui a eliminação da linhagem real. 'Exterminou' comunica a ação contra a totalidade dos descendentes sem especificar o método.
- source_word: אֵת כָּל זֶרַע הַמַּמְלָכָה
  choice: toda a descendência real
  rationale: זֶרַע significa literalmente 'semente' ou 'descendência'; neste contexto dinástico, 'descendência real' é exato, natural e conserva a referência à linhagem régia.
- source_word: לְבֵית יְהוּדָה
  choice: da casa de Judá
  rationale: Identifica naturalmente a casa dinástica à qual pertencia a descendência real.
theological_decisions:
- issue: Sentido do verbo difícil וַתְּדַבֵּר neste contexto
  choice: Traduzir pelo sentido contextual 'exterminou'.
  alternative: Traduzir literalmente 'falou' ou entender 'mandou matar'.
  rationale: A leitura literal 'falou' não se ajusta ao objeto direto 'toda a descendência real'. O contexto e o paralelo em 2 Reis 11:1 sustentam uma ação de extermínio. A nota preserva a dificuldade textual sem impor uma explicação sobre o modo da ação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Evitou-se acrescentar um marcador inicial como 'Ora' ou 'Então', pois o texto não contém uma palavra temporal explícita. O ponto e vírgula conserva a progressão rápida da narrativa.
