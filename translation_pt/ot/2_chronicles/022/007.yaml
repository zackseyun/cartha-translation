    rationale: O hebraico diz literalmente que Acazias foi/veio a Jorão, sem enunciar o propósito de uma visita. O contexto pode tornar «visitar» plausível, mas a tradução principal deve preservar a formulação mais ampla.
  - severity: medium
    issue: «ao encontro de Jeú» não assinala a ambiguidade de אֶל יֵהוּא.
    rationale: A preposição אֶל marca primariamente direção («a/para Jeú»). O contexto permite entender uma saída para encontrá-lo ou enfrentá-lo, mas isso deve ficar em nota, não ser imposto sem ressalva no texto principal.
