  source_fidelity: A atribuição da queda de Acazias a Deus, a distinção formal Jorão/Jeorão, a unção prévia de Jeú e a expressão dinástica «casa de Acabe» refletem bem o hebraico. Contudo, «visitar» especifica uma finalidade não expressa em לָבוֹא אֶל («ir a»), e «ao encontro de» pode sugerir mais fortemente um encontro/confronto do que o simples movimento «para/em direção a» indicado por אֶל.
  naturalness: A redação é clara e de registro moderno. «Ao ir a Jorão» e «saiu com Jeorão em direção a Jeú» são naturais em português e conservam melhor a reserva do original.
  terminology: «Queda», «veio de Deus», «havia ungido» e «casa de Acabe» são escolhas adequadas. «Eliminar» é aceitável para o hifil de כרת neste contexto. Mantém-se «Yahweh», conforme a política informada do projeto.
