  text: וּ/מֵֽ/אֱלֹהִ֗ים הָיְתָה֙ תְּבוּסַ֣ת אֲחַזְיָ֔הוּ לָ/ב֖וֹא אֶל יוֹרָ֑ם וּ/בְ/בֹא֗/וֹ יָצָ֤א עִם יְהוֹרָם֙ אֶל יֵה֣וּא בֶן נִמְשִׁ֔י אֲשֶׁ֣ר מְשָׁח֣/וֹ יְהוָ֔ה לְ/הַכְרִ֖ית אֶת בֵּ֥ית אַחְאָֽב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/007.yaml
  text: Ahaziah’s downfall[a], by his going to Joram, was from God; and when he came, he went out with Jehoram to Jehu son of Nimshi, whom Yahweh had anointed to cut off the house of Ahab.
translation:
  language: pt
  text: A queda de Acazias, ao ir a Jorão, veio de Deus; e, quando chegou, saiu com Jeorão em direção a Jeú[a], filho de Ninsi, a quem Yahweh havia ungido para eliminar a casa de Acabe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «ao encontro de Jeú» ou «contra Jeú». O hebraico diz literalmente «a/para Jeú»; o contexto sugere um encontro hostil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵאֱלֹהִים
  choice: veio de Deus
  rationale: A preposição מן indica fonte ou origem. A formulação preserva a atribuição direta a Deus sem especificar se se trata de decreto, ação providencial ou permissão.
- source_word: תְּבוּסַת
  choice: a queda
  rationale: O substantivo pode denotar derrota, ruína ou destruição. No contexto, “queda” exprime de modo natural o desfecho desastroso de Acazias sem limitar indevidamente o sentido.
- source_word: לָבוֹא אֶל יוֹרָם
  choice: ao ir visitar Jorão
  rationale: O infinitivo com ל indica a circunstância associada à queda. O contexto anterior mostra que Acazias foi ver Jorão; “visitar” torna a relação natural em português sem converter a expressão em causa mecânica.
- source_word: וּבְבֹאוֹ
  choice: e, quando chegou
  rationale: A construção com ב e infinitivo é temporal e marca a sequência narrativa.
- source_word: יָצָא עִם יְהוֹרָם אֶל יֵהוּא
  choice: saiu com Jeorão ao encontro de Jeú
  rationale: יצא significa “sair”, inclusive em movimento militar, e אֶל significa literalmente “a/para”. “Ao encontro de” conserva a direção e permite, sem impor, a possível hostilidade do encontro.
- source_word: יְהוֹרָם / יוֹרָם
  choice: Jorão / Jeorão
  rationale: Mantém-se a variação formal dos dois nomes presente no hebraico, embora ambos designem o mesmo rei.
- source_word: מְשָׁחוֹ
  choice: havia ungido
  rationale: O mais-que-perfeito composto deixa claro que a unção de Jeú ocorreu antes desse encontro.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: לְהַכְרִית אֶת בֵּית אַחְאָב
  choice: para eliminar a casa de Acabe
  rationale: O hifil de כרת significa extirpar, eliminar ou destruir. “Eliminar” comunica em português atual o juízo contra a dinastia inteira, preservando “casa” como referência dinástica.
theological_decisions:
- issue: Causalidade divina na queda de Acazias
  choice: “veio de Deus”
  alternative: “foi determinada por Deus” ou “foi permitida por Deus”
  rationale: O hebraico atribui a Deus a origem da queda, mas não define o modo dessa causalidade. A tradução mantém a afirmação e sua tensão teológica sem adotar um sistema explicativo específico.
- issue: Natureza do movimento em direção a Jeú
  choice: “ao encontro de Jeú”
  alternative: “contra Jeú” ou “até Jeú”
  rationale: A preposição אֶל expressa direção, enquanto o contexto pode sugerir confronto hostil. A redação principal não explicita uma hostilidade que a preposição, por si só, não codifica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe foi suavizada para evitar a construção pouco natural “sua queda, por ir...”. A variação Jorão/Jeorão reproduz deliberadamente a variação יוֹרָם/יְהוֹרָם do texto hebraico.
