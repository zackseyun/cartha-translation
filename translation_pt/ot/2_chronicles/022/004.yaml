  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה כְּ/בֵ֣ית אַחְאָ֑ב כִּי הֵ֜מָּה הָֽיוּ ל֣/וֹ יֽוֹעֲצִ֗ים אַחֲרֵ֛י מ֥וֹת אָבִ֖י/ו לְ/מַשְׁחִ֥ית לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/004.yaml
  text: He did what was evil in the sight of Yahweh[a], like the house of Ahab, because they were his counselors after the death of his father, to his destruction.
translation:
  language: pt
  text: Ele fez o que era mau aos olhos de Yahweh, como a casa de Acabe, pois foram eles os seus conselheiros depois da morte de seu pai, para a sua ruína.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “resultando em sua ruína” ou “para destruí-lo”. A expressão hebraica pode indicar tanto o resultado dos conselhos deles quanto sua finalidade destrutiva.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Ele fez o que era mau
  rationale: Reproduz de modo natural a fórmula hebraica de avaliação moral, sem tornar o início narrativo pesado com um 'e' desnecessário em português.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Conserva a metáfora hebraica de avaliação divina e translitera o nome próprio divino conforme a evidência direta do texto.
- source_word: כְּבֵית אַחְאָב
  choice: como a casa de Acabe
  rationale: Mantém a comparação e o sentido dinástico de בֵּית, que abrange a família ou casa real de Acabe, não apenas o rei individualmente.
- source_word: כִּי הֵמָּה הָיוּ לוֹ יוֹעֲצִים
  choice: pois foram eles os seus conselheiros
  rationale: Preserva o valor explicativo de כִּי, a ênfase do pronome הֵמָּה e a construção nominal que identifica os membros da casa de Acabe como conselheiros dele.
- source_word: אַחֲרֵי מוֹת אָבִיו
  choice: depois da morte de seu pai
  rationale: Equivalente claro e digno da construção temporal hebraica.
- source_word: לְמַשְׁחִית לוֹ
  choice: para a sua ruína
  rationale: Mantém a formulação compacta e a possível oscilação entre finalidade destrutiva e resultado fatal, sem atribuir inequivocamente uma intenção consciente aos conselheiros.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama como nome próprio; 'Yahweh' o representa diretamente sem substituí-lo por um título.
- issue: Intenção ou resultado em לְמַשְׁחִית לוֹ
  choice: para a sua ruína
  alternative: para destruí-lo; resultando em sua ruína
  rationale: A construção pode apontar tanto para o propósito quanto para o resultado destrutivo do conselho. A tradução principal conserva essa tensão em vez de decidir que os conselheiros pretendiam destruí-lo.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem foi mantida próxima ao hebraico, e a ênfase de הֵמָּה foi expressa por “foram eles”.
