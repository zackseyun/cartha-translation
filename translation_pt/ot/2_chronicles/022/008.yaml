reference: 2 Chronicles 22:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִ֕י כְּ/הִשָּׁפֵ֥ט יֵה֖וּא עִם בֵּ֣ית אַחְאָ֑ב וַ/יִּמְצָא֩ אֶת שָׂרֵ֨י יְהוּדָ֜ה וּ/בְנֵ֨י אֲחֵ֧י אֲחַזְיָ֛הוּ מְשָׁרְתִ֥ים לַ/אֲחַזְיָ֖הוּ וַ/יַּהַרְגֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/008.yaml
  text: And it happened[a], when Jehu was executing judgment on the house of Ahab, that he found the officials of Judah and the sons of Ahaziah’s brothers, serving Ahaziah[b], and he killed them.
translation:
  language: pt
  text: E aconteceu que, quando Jeú executava juízo contra a casa de Acabe[a], encontrou os líderes de Judá e os filhos dos irmãos de Acazias, que estavam a serviço de Acazias[b], e os matou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando Jeú julgava a casa de Acabe”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “os filhos dos irmãos de Acazias”; isto é, os sobrinhos de Acazias.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּהִשָּׁפֵט
  choice: quando Jeú executava juízo
  rationale: A construção temporal com כְּ e o infinitivo de שׁפט descreve Jeú realizando uma ação de caráter judicial. “Executava juízo” preserva essa força sem acrescentar uma avaliação divina explícita.
- source_word: עִם
  choice: contra
  rationale: Embora normalmente signifique “com”, neste contexto de ação hostil indica o alvo contra o qual o juízo era executado.
- source_word: בֵּית אַחְאָב
  choice: a casa de Acabe
  rationale: Mantém a expressão bíblica que pode abranger a família, a corte e a dinastia de Acabe, sem reduzi-la apenas a uma dessas ideias.
- source_word: שָׂרֵי יְהוּדָה
  choice: os líderes de Judá
  rationale: שָׂרִים pode designar príncipes, autoridades ou oficiais. “Líderes” é claro e suficientemente amplo no contexto político.
- source_word: וּבְנֵי אֲחֵי אֲחַזְיָהוּ
  choice: os filhos dos irmãos de Acazias
  rationale: Reproduz a relação de parentesco expressa literalmente no hebraico; em português corrente, trata-se dos sobrinhos de Acazias.
- source_word: מְשָׁרְתִים לַאֲחַזְיָהוּ
  choice: que estavam a serviço de Acazias
  rationale: O particípio indica uma função contínua de serviço ou assistência. A formulação é natural e evita uma conotação cultual indevida.
- source_word: וַיַּהַרְגֵם
  choice: e os matou
  rationale: Traduz diretamente o verbo הרג, sem eufemismo nem intensificação estilística.
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Preserva a fórmula de continuidade narrativa do hebraico em linguagem digna e compreensível.
theological_decisions:
- issue: Natureza da ação de Jeú e o sentido judicial de שׁפט
  choice: “executava juízo” mantém a linguagem judicial do texto sem declarar aprovação divina explícita de cada morte.
  alternative: “julgava” ou “punia”
  rationale: “Julgava” pode parecer meramente deliberativo, enquanto “punia” explicita mais do que o verbo necessariamente afirma. A opção escolhida conserva a tensão do texto.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. Mantém-se “casa de Acabe” como expressão dinástico-familiar bíblica e usa-se “a serviço de” para representar naturalmente a função contínua dos parentes de Acazias.
