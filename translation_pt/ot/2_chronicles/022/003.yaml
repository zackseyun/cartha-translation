base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/003.yaml
  text: He too walked in the ways of the house of Ahab[a], because his mother was his counselor to act wickedly.
translation:
  language: pt
  text: Ele também andou nos caminhos da casa de Acabe, porque sua mãe o aconselhava a agir perversamente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sua mãe era sua conselheira para levá-lo a agir perversamente”; também: “sua mãe era sua conselheira para praticar o mal”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  choice: Ele também
  rationale: Preserva a força aditiva e enfática da expressão hebraica em português natural.
- source_word: הָלַךְ בְּדַרְכֵי
  choice: andou nos caminhos
  rationale: Mantém a metáfora hebraica de conduta moral, que continua clara e reconhecível em português.
- source_word: בֵּית אַחְאָב
  choice: casa de Acabe
  rationale: Conserva o sentido familiar e dinástico de בֵּית sem restringi-lo à interpretação mais técnica de “dinastia”.
- source_word: כִּי
  choice: porque
  rationale: Introduz de modo claro a causa da conduta mencionada na primeira oração.
- source_word: אִמּוֹ
  choice: sua mãe
  rationale: Equivalência direta e natural do substantivo com sufixo possessivo.
- source_word: הָיְתָה יוֹעַצְתּוֹ
  choice: o aconselhava
  rationale: Embora a construção hebraica seja nominal, o imperfeito português comunica naturalmente o papel contínuo de sua mãe como conselheira.
- source_word: לְהַרְשִׁיעַ
  choice: a agir perversamente
  rationale: Expressa a orientação para uma conduta moralmente má, preservando a força verbal do infinitivo causativo sem acrescentar motivação psicológica.
theological_decisions:
- issue: Caracterização moral da conduta do rei sob a influência materna
  choice: Declarar explicitamente que sua mãe o aconselhava a agir perversamente
  alternative: “sua mãe era sua conselheira para praticar o mal” ou “o aconselhava na perversidade”
  rationale: O hebraico formula um juízo moral explícito. A tradução o preserva sem suavizá-lo nem ampliar a responsabilidade ou a intenção das personagens além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A expressão bíblica “andou nos caminhos” foi preservada; a construção nominal hebraica referente à mãe foi vertida verbalmente para maior naturalidade. O marcador [a] aparece no texto principal.
