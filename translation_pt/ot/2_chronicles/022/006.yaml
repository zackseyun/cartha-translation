  text: וַ/יָּ֜שָׁב לְ/הִתְרַפֵּ֣א בְ/יִזְרְעֶ֗אל כִּ֤י הַ/מַּכִּים֙ אֲשֶׁ֣ר הִכֻּ֣/הוּ בָֽ/רָמָ֔ה בְּ/הִלָּ֣חֲמ֔/וֹ אֶת חֲזָהאֵ֖ל מֶ֣לֶךְ אֲרָ֑ם וַ/עֲזַרְיָ֨הוּ בֶן יְהוֹרָ֜ם מֶ֣לֶךְ יְהוּדָ֗ה יָרַ֡ד לִ/רְא֞וֹת אֶת יְהוֹרָ֧ם בֶּן אַחְאָ֛ב בְּ/יִזְרְעֶ֖אל כִּי חֹלֶ֥ה הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/006.yaml
  text: So he returned to Jezreel to recover[a], because of the wounds that they had inflicted on him at Ramah when he fought against Hazael king of Aram. And Azariah son of Jehoram, king of Judah, went down to see Jehoram son of Ahab in Jezreel[b], because he was sick.
translation:
  language: pt
  text: Ele voltou a Jezreel para se recuperar, por causa dos ferimentos que lhe haviam causado em Ramá, quando lutou contra Hazael, rei de Arã. E Azarias[a], filho de Jeorão, rei de Judá, desceu para ver, em Jezreel, Jeorão, filho de Acabe, porque ele estava doente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Azarias é o nome escrito aqui em Crônicas; em outros lugares, o mesmo rei é chamado Acazias.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Assim, ele voltou
  rationale: O wayyiqtol de שׁוב dá continuidade à narrativa; “voltou” preserva o sentido central, e “assim” oferece uma ligação natural sem acrescentar uma relação causal forte.
- source_word: לְהִתְרַפֵּא
  choice: para se recuperar
  rationale: O infinitivo hitpael de רפא descreve a recuperação de ferimentos. “Recuperar-se” é atual, claro e adequado ao contexto de convalescença.
- source_word: כִּי הַמַּכִּים אֲשֶׁר הִכֻּהוּ
  choice: por causa dos ferimentos que lhe haviam causado
  rationale: A formulação conserva a força causal de כִּי e entende הַמַּכִּים como os golpes ou ferimentos recebidos. O mais-que-perfeito deixa clara a anterioridade dos ferimentos.
- source_word: בָרָמָה
  choice: em Ramá
  rationale: Emprega a forma portuguesa tradicional do topônimo e apresenta o local onde os ferimentos foram causados.
- source_word: בְּהִלָּחֲמוֹ אֶת
  choice: quando lutou contra
  rationale: O infinitivo construto com בְּ exprime circunstância temporal, e לחם com אֶת, neste contexto hostil, corresponde naturalmente a “lutar contra”.
- source_word: וַעֲזַרְיָהוּ
  choice: E Azarias
  rationale: Mantém no texto principal o nome escrito no texto hebraico de Crônicas, sem harmonizá-lo silenciosamente com “Acazias”, usado para o mesmo rei em outros lugares.
- source_word: יָרַד
  choice: desceu
  rationale: Preserva o sentido direcional explícito de ירד, comum na narrativa geográfica hebraica.
- source_word: לִרְאוֹת
  choice: para ver
  rationale: Reproduz o sentido lexical direto de ראה; no contexto, pode ter o sentido idiomático de fazer uma visita, alternativa registrada em nota.
- source_word: יְהוֹרָם בֶּן אַחְאָב
  choice: Jeorão, filho de Acabe
  rationale: Usa as formas portuguesas correntes dos nomes e mantém a forma plena Jeorão representada no hebraico.
- source_word: כִּי חֹלֶה הוּא
  choice: porque ele estava doente
  rationale: Conserva a relação causal e a descrição ampla חֹלֶה, sem restringi-la indevidamente apenas aos ferimentos.
theological_decisions:
- issue: Variação do nome real no relato de Crônicas
  choice: Manter “Azarias” no texto principal
  alternative: Acazias
  rationale: O hebraico deste versículo traz Azarias. A tradução preserva essa forma em vez de harmonizá-la com passagens paralelas ou com a forma mais conhecida, deixando a identificação alternativa transparente em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas nominais correntes no uso bíblico lusófono. A sintaxe mantém a sequência narrativa e a nuance direcional de “desceu”. A aposição “filho de Jeorão, rei de Judá” conserva a estrutura e a possível tensão sintática do hebraico, sem explicitação interpretativa adicional.
