  revision_rationale: A revisão recoloca «em Jezreel» como a localização explícita de Jeorão no ato da visita, em vez de apresentá-la como destino expresso do verbo «desceu». Também se omite «Assim», pois o simples início narrativo português não acrescenta uma relação inferencial além da conjunção hebraica. A nota b é mantida como alternativa lexical de «ver», embora não exija âncora no texto principal quando a formulação principal já é «para ver».
