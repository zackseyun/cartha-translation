  source_fidelity: 'O texto acompanha de perto a sequência e os participantes do hebraico: o sujeito singular inicial permanece não identificado, seguido pelo plural que captura, leva, mata e sepulta Acazias. A cláusula final é mais diretamente expressa como incapacidade da casa/dinastia de Acazias de manter o reino, sem introduzir explicitamente «ninguém».'
  naturalness: «Lhe deram a morte» é pouco idiomático no português moderno e pode soar arcaico ou eufemístico. «O mataram» é claro, narrativo e natural; o caráter causativo do hebraico pode ser explicado na nota.
  terminology: Acazias, Jeú, Josafá, Samaria e Yahweh estão adequados ao registro solicitado. «Buscar Yahweh de todo o coração» comunica bem a devoção expressa por דרש e pela locução «com todo o seu coração».
