  text: וַ/יְבַקֵּשׁ֩ אֶת אֲחַזְיָ֨הוּ וַֽ/יִּלְכְּדֻ֜/הוּ וְ/ה֧וּא מִתְחַבֵּ֣א בְ/שֹֽׁמְר֗וֹן וַ/יְבִאֻ֣/הוּ אֶל יֵהוּא֮ וַ/יְמִתֻ/הוּ֒ וַֽ/יִּקְבְּרֻ֔/הוּ כִּ֤י אָֽמְרוּ֙ בֶּן יְהוֹשָׁפָ֣ט ה֔וּא אֲשֶׁר דָּרַ֥שׁ אֶת יְהוָ֖ה בְּ/כָל לְבָב֑/וֹ וְ/אֵין֙ לְ/בֵ֣ית אֲחַזְיָ֔הוּ לַ/עְצֹ֥ר כֹּ֖חַ לְ/מַמְלָכָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/009.yaml
  text: And he sought Ahaziah[a], and they captured him while he was hiding in Samaria, and they brought him to Jehu and put him to death. Then they buried him, for they said, “He is the son of Jehoshaphat[b], who sought Yahweh with all his heart.” And the house of Ahaziah had no power to retain the kingdom.
translation:
  language: pt
  text: 'Ele procurou Acazias, e eles o capturaram enquanto ele estava escondido em Samaria. Levaram-no a Jeú e o mataram[a]. Depois o sepultaram, pois disseram: “Ele é filho de Josafá, que buscou Yahweh de todo o coração.” A casa de Acazias não tinha força para manter o reino[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o puseram à morte”. O verbo hebraico está na forma causativa: literalmente, “fizeram-no morrer”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Não havia, na casa de Acazias, ninguém com força para conservar o reino”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבַקֵּשׁ
  choice: Ele procurou
  rationale: בקש expressa procurar ou buscar alguém. O sujeito singular não é nomeado no versículo; o pronome preserva essa forma sem inserir explicitamente Jeú ou seus homens.
- source_word: וַיִּלְכְּדֻהוּ
  choice: eles o capturaram
  rationale: לכד denota capturar ou prender. O plural do hebraico é mantido, inclusive a mudança do sujeito singular da oração anterior para o plural.
- source_word: מִתְחַבֵּא בְשֹׁמְרוֹן
  choice: enquanto ele estava escondido em Samaria
  rationale: O particípio hitpael descreve a situação contínua de Acazias quando foi capturado; a formulação é natural em português e mantém a localização.
- source_word: וַיְבִאֻהוּ אֶל־יֵהוּא
  choice: Levaram-no a Jeú
  rationale: O hifil de בוא significa fazer vir ou levar; esta é a formulação narrativa direta em português.
- source_word: וַיְמִתֻהוּ
  choice: lhe deram a morte
  rationale: A forma causativa de מות significa fazê-lo morrer. A expressão portuguesa preserva essa força sem acrescentar a ideia mais específica de uma execução judicial.
- source_word: וַיִּקְבְּרֻהוּ
  choice: o sepultaram
  rationale: קבר significa sepultar ou enterrar. “Sepultaram” oferece um registro narrativo digno e corrente.
- source_word: דָּרַשׁ אֶת־יְהוָה
  choice: buscou Yahweh
  rationale: דרש, tendo Deus por objeto, comunica busca devota e dependência, não apenas consulta pontual.
- source_word: בְּכָל־לְבָבוֹ
  choice: de todo o coração
  rationale: Equivalente idiomático natural para a dedicação integral expressa no hebraico.
- source_word: וְאֵין לְבֵית אֲחַזְיָהוּ לַעְצֹר כֹּחַ לְמַמְלָכָה
  choice: Não havia, na casa de Acazias, ninguém com força para conservar o reino
  rationale: A construção com אֵין e infinitivo indica ausência de alguém capaz, enquanto עצר כוח sugere reter ou sustentar poder. A tradução mantém tanto a referência dinástica quanto a incapacidade de preservar o domínio real.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” o representa diretamente, em vez de substituí-lo por um título.
- issue: Sentido da incapacidade da casa de Acazias na cláusula final
  choice: ausência de alguém com força para conservar o reino
  alternative: a casa de Acazias não tinha força para manter o reino
  rationale: A sintaxe pode destacar tanto a falta de uma pessoa capaz na dinastia quanto a impotência da casa como um todo. O texto principal segue a leitura pessoal comum, e a nota preserva a alternativa coletiva.
translation_notes:
  register: 'Português moderno, claro e digno, com formas nominais correntes no Brasil e amplamente reconhecíveis: Acazias, Jeú, Josafá e Samaria. A mudança hebraica do sujeito singular (“ele”) para o plural (“eles”) foi preservada, sem identificar além do que o versículo explicita. Todos os marcadores de nota foram posicionados junto às expressões a que se referem.'
