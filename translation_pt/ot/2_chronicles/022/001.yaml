base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/001.yaml
  text: Then the inhabitants of Jerusalem made Ahaziah[a], his youngest son, king in his place, because the raiding band that came with the Arabs into the camp had killed all the older sons. So Ahaziah son of Jehoram, king of Judah, became king.
translation:
  language: pt
  text: Então os habitantes de Jerusalém fizeram de Acazias, seu filho mais novo, rei em seu lugar, pois o bando de saqueadores que veio com os árabes ao acampamento[a] havia matado todos os filhos mais velhos. Assim, Acazias, filho de Jeorão, rei de Judá, tornou-se rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o bando que veio entre os árabes ao acampamento”. A expressão hebraica pode ser entendida de maneiras diferentes, conforme o sentido atribuído à preposição ligada a “árabes”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְלִיכוּ
  choice: fizeram de ... rei
  rationale: 'Expressa naturalmente em português o sentido causativo do hifil: os habitantes de Jerusalém instalaram Acazias como rei.'
- source_word: יוֹשְׁבֵי יְרוּשָׁלִַם
  choice: os habitantes de Jerusalém
  rationale: Reproduz com clareza e registro digno o sentido literal de “os que habitam em Jerusalém”.
- source_word: בְנוֹ הַקָּטֹן
  choice: seu filho mais novo
  rationale: Embora קָטֹן possa significar “pequeno” ou “jovem”, o contraste com os filhos mais velhos indica o filho caçula.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: Indica substituição e sucessão no trono.
- source_word: כָל הָרִאשֹׁנִים
  choice: todos os filhos mais velhos
  rationale: O substantivo “filhos” está implícito no contexto, e הָרִאשֹׁנִים designa os anteriores ou mais velhos em relação a Acazias.
- source_word: הַגְּדוּד
  choice: o bando de saqueadores
  rationale: גְּדוּד pode designar uma tropa ou bando de incursão; a formulação comunica seu caráter militar e saqueador.
- source_word: הַבָּא בָעַרְבִים
  choice: que veio com os árabes
  rationale: Toma a preposição בְּ em sentido associativo, sem ocultar em nota a possibilidade de entendê-la como “entre”.
- source_word: לַמַּחֲנֶה
  choice: ao acampamento
  rationale: Expressa o movimento em direção ao acampamento sem acrescentar pormenores não explicitados.
- source_word: וַיִּמְלֹךְ
  choice: tornou-se rei
  rationale: Entende o verbo como fórmula ingressiva de acesso ao trono e evita sugerir aqui uma descrição da duração do reinado.
