  text: גַּ֣ם בַּ/עֲצָתָ/ם֮ הָלַךְ֒ וַ/יֵּלֶךְ֩ אֶת יְהוֹרָ֨ם בֶּן אַחְאָ֜ב מֶ֣לֶךְ יִשְׂרָאֵ֗ל לַ/מִּלְחָמָ֛ה עַל חֲזָאֵ֥ל מֶֽלֶךְ אֲרָ֖ם בְּ/רָמ֣וֹת גִּלְעָ֑ד וַ/יַּכּ֥וּ הָֽ/רַמִּ֖ים אֶת יוֹרָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/005.yaml
  text: He also walked by their counsel[a], and he went with Jehoram son of Ahab, king of Israel, to war against Hazael king of Aram at Ramoth-gilead[c][b]; and the Arameans wounded Joram.
translation:
  language: pt
  text: Ele também agiu de acordo com o conselho deles[a] e foi com Jeorão, filho de Acabe, rei de Israel, guerrear contra Hazael, rei de Arã, em Ramote-Gileade[b]. Os arameus feriram Jorão[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “andou segundo o conselho deles”; isto é, conduziu-se de acordo com a orientação deles.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “Arã”; tradicionalmente, “Síria”. Do mesmo modo, “arameus” é tradicionalmente traduzido como “sírios”.'
    reason: alternative_reading
  - marker: c
    text: 'O hebraico emprega duas formas relacionadas do nome: “Jeorão” no começo do versículo e “Jorão” no final.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם בַּעֲצָתָם הָלַךְ
  choice: Ele também agiu de acordo com o conselho deles
  rationale: Expressa naturalmente em português o idiomatismo hebraico de “andar” segundo um conselho, preservando tanto a continuação marcada por גַּם como a ideia de conduta orientada por terceiros.
- source_word: וַיֵּלֶךְ אֶת
  choice: e foi com
  rationale: Reproduz de modo direto a ideia de acompanhar Jeorão.
- source_word: יְהוֹרָם ... יוֹרָם
  choice: Jeorão ... Jorão
  rationale: Mantém as duas formas relacionadas do nome que aparecem no texto hebraico.
- source_word: לַמִּלְחָמָה עַל
  choice: guerrear contra
  rationale: Comunica com clareza o propósito militar e a direção hostil da ação.
- source_word: אֲרָם / הָרַמִּים
  choice: Arã / arameus
  rationale: Conserva a designação histórica do hebraico, em vez do nome posterior e tradicional “Síria / sírios”.
- source_word: בְּרָמוֹת גִּלְעָד
  choice: em Ramote-Gileade
  rationale: Emprega a forma portuguesa reconhecível do topônimo e uma preposição natural para o local do combate.
- source_word: וַיַּכּוּ
  choice: feriram
  rationale: O contexto imediato indica que Jorão foi atingido e ficou ferido, não necessariamente derrotado; “feriram” torna explícito esse sentido contextual.
theological_decisions:
- issue: Designação de אֲרָם e do gentílico הָרַמִּים
  choice: Arã / arameus
  alternative: Síria / sírios
  rationale: A opção segue de perto a designação histórica do texto hebraico e evita substituir Arã por um nome geopolítico posterior.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. O idiomatismo hebraico foi tornado inteligível no corpo do texto, enquanto a metáfora literal foi preservada em nota. Os nomes Arã e Ramote-Gileade seguem formas correntes em português bíblico.
