  text: וּ/בִ/דְבַר י֣וֹם בְּ/י֗וֹם לְ/הַעֲלוֹת֙ כְּ/מִצְוַ֣ת מֹשֶׁ֔ה לַ/שַּׁבָּתוֹת֙ וְ/לֶ֣/חֳדָשִׁ֔ים וְ/לַ/מּ֣וֹעֲד֔וֹת שָׁל֥וֹשׁ פְּעָמִ֖ים בַּ/שָּׁנָ֑ה בְּ/חַ֧ג הַ/מַּצּ֛וֹת וּ/בְ/חַ֥ג הַ/שָּׁבֻע֖וֹת וּ/בְ/חַ֥ג הַ/סֻּכּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/013.yaml
  text: 'according to the daily requirement for offering up sacrifices[a], as Moses commanded, for the Sabbaths, the new moons, and the appointed feasts three times in the year: at the Feast of Unleavened Bread, at the Feast of Weeks[c][b], and at the Feast of Booths.'
translation:
  language: pt
  text: 'conforme a exigência de cada dia[a], para oferecer os sacrifícios, segundo o mandamento de Moisés, nos sábados, nas luas novas e nas festas determinadas, três vezes por ano: na Festa dos Pães sem Fermento, na Festa das Semanas[b] e na Festa das Cabanas[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “conforme a norma de cada dia”; literalmente, “conforme a questão de um dia no seu dia”.
    reason: lexical_alternative
  - marker: b
    text: A “Festa das Semanas” passou a ser chamada de “Pentecostes” no uso grego posterior.
    reason: cross_reference
  - marker: c
    text: Também conhecida como “Festa dos Tabernáculos”; o hebraico significa “cabanas” ou “abrigos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִדְבַר יוֹם בְּיוֹם
  choice: conforme a exigência de cada dia
  rationale: O hebraico diz literalmente “conforme a questão de um dia no seu dia”, expressão que, no contexto do culto, indica o que era prescrito para cada dia. A formulação escolhida preserva esse sentido em português natural.
- source_word: לְהַעֲלוֹת
  choice: para oferecer os sacrifícios
  rationale: No contexto sacrificial, o hifil de עלה significa fazer subir uma oferta, isto é, oferecê-la no altar. A explicitação de “sacrifícios” torna claro o objeto implícito sem alterar o sentido.
- source_word: כְּמִצְוַת מֹשֶׁה
  choice: segundo o mandamento de Moisés
  rationale: Mantém de forma clara e formal a ideia de conformidade com a prescrição transmitida por Moisés.
- source_word: לַשַּׁבָּתוֹת
  choice: nos sábados
  rationale: A preposição introduz as ocasiões em que as ofertas deviam ser apresentadas; “nos sábados” é idiomático em português.
- source_word: וְלֶחֳדָשִׁים
  choice: nas luas novas
  rationale: Neste contexto de calendário cultual, חֳדָשִׁים designa as celebrações do início de cada mês, marcadas pela lua nova, e não simplesmente os meses.
- source_word: וְלַמּוֹעֲדוֹת
  choice: nas festas determinadas
  rationale: מוֹעֲדִים são tempos fixados ou designados; as três celebrações nomeadas em seguida mostram que aqui se trata especificamente de festas.
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: três vezes por ano
  rationale: Tradução direta e natural da expressão temporal hebraica.
- source_word: בְּחַג הַמַּצּוֹת
  choice: na Festa dos Pães sem Fermento
  rationale: Expressa de maneira transparente o nome hebraico da festa e evita o termo menos acessível “ázimos”.
- source_word: וּבְחַג הַשָּׁבֻעוֹת
  choice: na Festa das Semanas
  rationale: Traduz diretamente o nome hebraico; “Pentecostes” é a designação grega posterior e fica registrada em nota.
- source_word: וּבְחַג הַסֻּכּוֹת
  choice: na Festa das Cabanas
  rationale: סֻכּוֹת designa abrigos ou cabanas temporárias. “Cabanas” preserva a imagem concreta do hebraico em linguagem corrente.
theological_decisions:
- issue: Designação das três festas de peregrinação de Israel
  choice: Festa dos Pães sem Fermento / Festa das Semanas / Festa das Cabanas
  alternative: Festa dos Ázimos / Pentecostes / Festa dos Tabernáculos
  rationale: O texto hebraico apresenta nomes concretos para as festas. A tradução principal os torna transparentes ao leitor moderno, enquanto as formas tradicionais relevantes são preservadas nas notas, sem importar terminologia posterior para o texto principal.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Emprega “Pães sem Fermento” e “Cabanas” para tornar transparentes os nomes hebraicos, preservando em notas as designações tradicionais. Os marcadores [a], [b] e [c] aparecem junto às expressões correspondentes no texto principal.
