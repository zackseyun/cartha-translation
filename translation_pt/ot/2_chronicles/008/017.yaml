lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Marca a sequência temporal da narrativa de forma natural e direta em português.
- source_word: הָלַךְ
  choice: foi
  rationale: Expressa o deslocamento sem sugerir indevidamente que Salomão fez o percurso a pé.
- source_word: לְעֶצְיוֹן גֶּבֶר
  choice: a Eziom-Geber
  rationale: Translitera o topônimo hebraico em forma corrente e legível em português.
- source_word: וְאֶל אֵילוֹת
  choice: e a Elote
  rationale: Preserva a coordenação e o destino indicados no hebraico; Elote representa em português a forma אֵילוֹת.
- source_word: עַל שְׂפַת הַיָּם
  choice: à beira do mar
  rationale: Reproduz de modo idiomático a imagem espacial de estar junto à margem do mar.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: na terra de Edom
  rationale: Mantém o substantivo explícito 'terra' e o topônimo tradicional Edom.
