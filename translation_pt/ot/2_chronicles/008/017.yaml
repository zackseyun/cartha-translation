  text: Then Solomon went to Ezion-geber and to Eloth[a], on the shore of the sea in the land of Edom.
translation:
  language: pt
  text: Então Salomão foi a Eziom-Geber e a Elate[a], à beira do mar, na terra de Edom.
  philosophy: optimal-equivalence
  footnotes:
