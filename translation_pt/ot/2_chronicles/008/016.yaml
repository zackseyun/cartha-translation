  terminology: «Casa de Yahweh» preserva a imagem hebraica e o nome divino foi vertido de modo consistente. «Obra» é apropriado para מְלָאכָה. A nota lexical de a é adequada, com pequena revisão de estilo para evitar sugerir uma leitura excessivamente específica.
