  text: וַ/תִּכֹּן֙ כָּל מְלֶ֣אכֶת שְׁלֹמֹ֔ה עַד הַ/יּ֛וֹם מוּסַ֥ד בֵּית יְהוָ֖ה וְ/עַד כְּלֹת֑/וֹ שָׁלֵ֖ם בֵּ֥ית יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/016.yaml
  text: Thus all the work of Solomon was prepared from the day the house of Yahweh was founded until it was finished[b][a]. So the house of Yahweh was completed.
translation:
  language: pt
  text: Assim, toda a obra de Salomão foi preparada[a] desde o dia em que foram lançados os alicerces da casa de Yahweh até sua conclusão; assim, a casa de Yahweh foi concluída.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi estabelecida” ou “foi posta em ordem”. O verbo hebraico pode expressar a ideia de algo estabelecido, preparado ou posto em ordem.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente, a construção diz: “até o dia em que foi fundada a casa de Yahweh e até sua conclusão”. “Desde ... até” expressa de modo idiomático em português o período indicado no contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכֹּן
  choice: foi preparada
  rationale: O nifal de כון pode indicar que algo foi estabelecido, preparado ou posto em ordem. No contexto, “foi preparada” preserva a voz passiva e resume a organização e execução da obra de Salomão sem restringir o sentido apenas ao início da construção.
- source_word: כָּל מְלֶאכֶת שְׁלֹמֹה
  choice: toda a obra de Salomão
  rationale: מְלָאכָה designa trabalho, empreendimento ou obra; a expressão abrange o projeto de construção conduzido por Salomão.
- source_word: עַד הַיּוֹם מוּסַד בֵּית יְהוָה וְעַד כְּלֹתוֹ
  choice: desde o dia em que foram lançados os alicerces da casa de Yahweh até sua conclusão
  rationale: A formulação portuguesa explicita o intervalo temporal indicado pela construção hebraica. “Foram lançados os alicerces” comunica naturalmente מוּסַד e “sua conclusão” mantém a referência do sufixo masculino sem decidir de modo rígido entre a casa e a obra.
- source_word: בֵּית יְהוָה
  choice: casa de Yahweh
  rationale: Mantém a imagem literal de “casa”, embora o referente seja o templo, e translitera o nome divino יְהוָה como Yahweh.
- source_word: שָׁלֵם
  choice: ficou completa
  rationale: O adjetivo predicativo descreve o estado final da casa como inteira, acabada ou concluída; “ficou completa” preserva esse valor resultativo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega o Tetragrama como nome próprio. “Yahweh” o representa por transliteração, em vez de substituí-lo por um título.
- issue: Referente de וְעַד כְּלֹתוֹ
  choice: até sua conclusão
  alternative: até que ela fosse concluída; até que ele a concluísse
  rationale: O sufixo hebraico permite relacionar a conclusão à casa ou ao empreendimento, enquanto uma formulação verbal poderia introduzir indevidamente um agente masculino. A expressão nominal conserva melhor essa abertura contextual.
translation_notes:
  register: Português atual, claro e digno, com ampla legibilidade brasileira. “Obra” e “casa” preservam o vocabulário concreto do hebraico; a repetição de “casa de Yahweh” mantém a ênfase conclusiva do versículo.
