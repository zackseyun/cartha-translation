  to: Assim, toda a obra de Salomão foi preparada[a] desde o dia em que foram lançados os alicerces da casa de Yahweh até sua conclusão; assim, a casa de Yahweh foi concluída.[b]
  rationale: A revisão corrige a caracterização da nota b, preservando a diferença entre a formulação hebraica e a explicitação temporal natural em português. Também substitui «ficou completa» por «foi concluída», mais idiomático para a casa/templo e fiel ao estado final expresso pelo hebraico. As âncoras foram mantidas e reposicionadas para que b se refira à conclusão temporal e final do enunciado.
