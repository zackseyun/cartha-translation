  - severity: low
    issue: «Minha mulher» é menos idiomático no registro bíblico moderno do que «Minha esposa».
    rationale: Embora possa significar «wife», «minha mulher» admite nuances coloquiais regionais. «Minha esposa» mantém sem ambiguidade o referente conjugal contextual de אִשָּׁה לִי.
