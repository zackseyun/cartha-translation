  text: וְ/אֶת בַּת פַּרְעֹ֗ה הֶעֱלָ֤ה שְׁלֹמֹה֙ מֵ/עִ֣יר דָּוִ֔יד לַ/בַּ֖יִת אֲשֶׁ֣ר בָּֽנָה לָ֑/הּ כִּ֣י אָמַ֗ר לֹא תֵשֵׁ֨ב אִשָּׁ֥ה לִ/י֙ בְּ/בֵית֙ דָּוִ֣יד מֶֽלֶךְ יִשְׂרָאֵ֔ל כִּי קֹ֣דֶשׁ הֵ֔מָּה אֲשֶׁר בָּֽאָ֥ה אֲלֵי/הֶ֖ם אֲר֥וֹן יְהוָֽה־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/011.yaml
  text: And Solomon brought Pharaoh’s daughter up from the city of David to the house that he had built for her[a], for he said, “My wife shall not live in the house of David king of Israel, because the places to which the ark of Yahweh has come are holy.”
translation:
  language: pt
  text: 'Salomão fez a filha do faraó subir da Cidade de Davi para a casa que havia construído para ela, pois disse: “Minha esposa não morará na casa de Davi, rei de Israel, porque são santos os lugares[a] aos quais chegou a arca de Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente: “porque santos são eles, aos quais chegou a arca de Yahweh”. O termo “lugares” explicita o antecedente plural implícito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעֱלָה
  choice: levou
  rationale: O hifil de עלה indica fazer subir ou levar para cima. Em português corrente, “levou ... da ... para” comunica naturalmente a transferência, enquanto a origem e o destino preservam o movimento indicado pelo contexto.
- source_word: מֵעִיר דָּוִיד
  choice: da Cidade de Davi
  rationale: Expressão geográfica direta; a inicial maiúscula identifica o nome próprio tradicional do local.
- source_word: לַבַּיִת אֲשֶׁר בָּנָה לָהּ
  choice: para a casa que havia construído para ela
  rationale: “Casa” mantém o sentido básico de בַּיִת sem excluir uma residência real; “havia construído” torna clara a anterioridade da construção.
- source_word: לֹא תֵשֵׁב אִשָּׁה לִי
  choice: Minha mulher não morará
  rationale: אִשָּׁה pode significar “mulher” ou “esposa”; no contexto, refere-se à filha do faraó como mulher de Salomão. “Morará” expressa o sentido residencial de ישׁב em português natural.
- source_word: בְּבֵית דָּוִיד מֶלֶךְ יִשְׂרָאֵל
  choice: na casa de Davi, rei de Israel
  rationale: Mantém “casa”, lexicalmente transparente, e usa vírgulas para deixar claro que “rei de Israel” é aposto de Davi.
- source_word: קֹדֶשׁ הֵמָּה
  choice: são santos
  rationale: Preserva tanto o predicado de santidade quanto o número plural do hebraico.
- source_word: אֲשֶׁר בָּאָה אֲלֵיהֶם אֲרוֹן יְהוָה
  choice: os lugares aos quais chegou a arca de Yahweh
  rationale: “Lugares” explicita o antecedente plural elíptico exigido por הֵמָּה e אֲלֵיהֶם. A ordem foi ajustada para soar natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
theological_decisions:
- issue: Antecedente plural implícito na explicação sobre a santidade
  choice: Explicitar “os lugares” como antecedente plural
  alternative: Traduzir de modo estritamente literal, sem fornecer antecedente, ou entender “a casa de Davi” de forma geral
  rationale: Os pronomes hebraicos são plurais, embora nenhum substantivo plural expresso os anteceda. “Os lugares” preserva a gramática e torna inteligível a referência às áreas às quais a arca havia chegado, sem acrescentar uma conclusão teológica.
- issue: Sentido de אִשָּׁה na fala de Salomão
  choice: “minha mulher”
  alternative: “uma mulher minha” ou simplesmente “mulher”
  rationale: O contexto imediato identifica a filha do faraó e a relação conjugal; “minha mulher” é específico e natural em português, sem transformar a declaração em proibição geral referente a todas as mulheres.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita arcaísmos como “habitará” e preserva “casa”, “santos”, “arca” e o nome divino Yahweh. O marcador [a] foi colocado junto ao termo explicativo “lugares”.
