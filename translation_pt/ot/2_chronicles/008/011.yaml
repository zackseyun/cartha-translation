  naturalness: O texto é claro e de registro moderno. «Minha esposa não morará» é mais natural e inequívoco que «Minha mulher» neste registro, e a pontuação da fala direta foi normalizada.
  terminology: «Cidade de Davi», «arca», «santos» e «Yahweh» são consistentes com o hebraico e com as decisões do projeto. «Lugares» continua sendo uma explicitação prudente do referente plural elíptico e permanece ancorado por nota.
