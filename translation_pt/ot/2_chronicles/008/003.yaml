  yaml_path: translation/ot/2_chronicles/008/003.yaml
  text: Then Solomon went to Hamath-zobah and prevailed against it[a].
translation:
  language: pt
  text: Então Salomão foi a Hamate-Zobá e prevaleceu sobre ela[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “prevaleceu contra ela” ou “assumiu o controle dela”. Literalmente, a expressão hebraica diz: “tornou-se forte sobre ela”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: foi
  rationale: O verbo הלך, nesta forma narrativa, significa basicamente “foi”. Embora o contexto possa sugerir uma campanha, o verbo em si não explicita hostilidade; por isso, a formulação simples preserva melhor o hebraico.
- source_word: חֲמָת צוֹבָה
  choice: Hamate-Zobá
  rationale: Os dois nomes funcionam juntos como topônimo composto. A forma hifenizada preserva essa estrutura e segue uma transliteração natural em português.
- source_word: וַיֶּחֱזַק עָלֶיהָ
  choice: prevaleceu contra ela
  rationale: A expressão חזק על comunica a ideia de tornar-se forte sobre alguém ou algo, prevalecer ou obter domínio. “Prevaleceu contra ela” conserva de modo natural a imagem e a ambiguidade do idioma hebraico, sem especificar além do texto se houve conquista ou simples controle.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Então” mantém a progressão narrativa; o pronome feminino retoma Hamate-Zobá como cidade ou localidade.
