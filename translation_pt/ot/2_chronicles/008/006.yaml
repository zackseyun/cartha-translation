base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/006.yaml
  text: and Baalath[a], and all the storage cities that belonged to Solomon, and all the chariot cities, and the cities of the horsemen[c][b], and all that Solomon desired to build in Jerusalem and in Lebanon and throughout all the land of his dominion.
translation:
  language: pt
  text: e Baalate, todas as cidades-armazém[a] que pertenciam a Salomão, todas as cidades dos carros de guerra, as cidades dos cavaleiros[b], e tudo o que Salomão desejou construir[c] em Jerusalém, no Líbano e por toda a terra sob o seu domínio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cidades de armazenamento”, “cidades de provisões” ou, possivelmente, “cidades do tesouro”.
    reason: lexical_alternative
  - marker: b
    text: Ou “cidades para cavalos”; o termo hebraico geralmente se refere a cavaleiros ou à cavalaria.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “todo o desejo de Salomão que ele desejou construir”, construção com palavras da mesma raiz que enfatiza seu desejo ou prazer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלָת
  choice: Baalate
  rationale: Nome próprio de lugar, transliterado segundo uma forma natural em português.
- source_word: עָרֵי הַמִּסְכְּנוֹת
  choice: cidades-armazém
  rationale: Expressa de modo claro e conciso cidades destinadas ao armazenamento de provisões ou outros bens, sem restringir indevidamente o sentido a tesouros.
- source_word: אֲשֶׁר הָיוּ לִשְׁלֹמֹה
  choice: que pertenciam a Salomão
  rationale: Transmite naturalmente em português a construção hebraica de posse.
- source_word: עָרֵי הָרֶכֶב
  choice: cidades dos carros de guerra
  rationale: Preserva a associação administrativa ou militar dessas cidades com os carros, explicitando o sentido contextual de רֶכֶב.
- source_word: עָרֵי הַפָּרָשִׁים
  choice: cidades dos cavaleiros
  rationale: פָּרָשִׁים normalmente designa cavaleiros ou cavalaria; a formulação mantém a estrutura do hebraico sem decidir além do necessário a função exata das cidades.
- source_word: כָּל חֵשֶׁק שְׁלֹמֹה אֲשֶׁר חָשַׁק
  choice: tudo o que Salomão desejou
  rationale: Reproduz de maneira idiomática o sentido da construção cognata hebraica, cuja repetição literal seria pouco natural em português.
- source_word: לִבְנוֹת
  choice: construir
  rationale: O infinitivo significa simplesmente construir; o contexto imediato não exige reconstruir.
- source_word: בִּירוּשָׁלִַם
  choice: em Jerusalém
  rationale: Forma portuguesa consagrada do nome geográfico.
- source_word: וּבַלְּבָנוֹן
  choice: no Líbano
  rationale: Forma portuguesa consagrada do nome geográfico, com preposição e artigo naturais.
- source_word: בְכֹל אֶרֶץ מֶמְשַׁלְתּוֹ
  choice: por toda a terra sob o seu domínio
  rationale: Preserva tanto a dimensão territorial quanto a ideia de governo ou domínio, em português corrente.
