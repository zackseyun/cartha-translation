  text: וַ/יִּ֜בֶן אֶת בֵּ֤ית חוֹרוֹן֙ הָֽ/עֶלְי֔וֹן וְ/אֶת בֵּ֥ית חוֹר֖וֹן הַ/תַּחְתּ֑וֹן עָרֵ֣י מָצ֔וֹר חוֹמ֖וֹת דְּלָתַ֥יִם וּ/בְרִֽיחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/005.yaml
  text: And he built Upper Beth-horon and Lower Beth-horon[a], fortified cities with walls, doors[c][b], and bars.
translation:
  language: pt
  text: Ele construiu Bete-Horom de Cima e Bete-Horom de Baixo, cidades fortificadas[a] com muralhas, portas[b] e trancas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cidades-fortaleza”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “portas”; provavelmente as portas dos portões das cidades fortificadas.'
    reason: lexical_alternative
  - marker: c
    text: Ou “ferrolhos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Ele construiu
  rationale: O verbo בנה expressa diretamente a ação de construir; embora o contexto possa envolver o fortalecimento de localidades existentes, o hebraico não exige aqui a tradução “reconstruiu”.
- source_word: בֵּית חוֹרוֹן הָעֶלְיוֹן
  choice: Bete-Horom de Cima
  rationale: O topônimo é transliterado segundo uma forma natural em português, e o adjetivo distingue a cidade situada em maior elevação.
- source_word: בֵּית חוֹרוֹן הַתַּחְתּוֹן
  choice: Bete-Horom de Baixo
  rationale: Mantém o paralelismo geográfico com a localidade anterior e traduz o adjetivo de modo claro e corrente.
- source_word: עָרֵי מָצוֹר
  choice: cidades fortificadas
  rationale: A expressão em estado construto descreve cidades dotadas de defesas; “cidades fortificadas” comunica com naturalidade seu caráter militar.
- source_word: חוֹמוֹת
  choice: com muralhas
  rationale: No contexto de fortificações urbanas, “muralhas” é mais específico e natural do que o genérico “muros”.
- source_word: דְּלָתַיִם
  choice: portas
  rationale: O substantivo significa literalmente “portas” ou “portas duplas”, não o termo hebraico comum para “portão”; no contexto, refere-se provavelmente às portas dos portões das cidades.
- source_word: וּבְרִיחַ
  choice: e trancas
  rationale: בריח designa uma barra ou ferrolho usado para fechar portas; “trancas” é claro em português e se ajusta ao contexto defensivo.
theological_decisions: []
