base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/002.yaml
  text: As for the cities that Huram had given to Solomon[c][b][a], Solomon rebuilt them and settled the people of Israel there.
translation:
  language: pt
  text: Quanto às cidades que Hurão tinha dado a Salomão, Salomão as reconstruiu[a] e instalou ali israelitas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “construiu”. O verbo hebraico pode significar “construir” ou, neste contexto, “reconstruir” ou “restaurar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעָרִים
  choice: Quanto às cidades
  rationale: A conjunção introduz um novo item no resumo narrativo; esta formulação é natural em português e mantém o foco nas cidades.
- source_word: אֲשֶׁר נָתַן
  choice: que Hurão tinha dado
  rationale: A oração relativa é retrospectiva; o mais-que-perfeito composto deixa clara a anterioridade da entrega em relação à reconstrução.
- source_word: חוּרָם
  choice: Hurão
  rationale: Representa em português a forma hebraica חוּרָם, em vez da forma tradicional alternativa Hirão.
- source_word: לִשְׁלֹמֹה
  choice: a Salomão
  rationale: A preposição ל marca Salomão como destinatário da entrega.
- source_word: בָּנָה
  choice: reconstruiu
  rationale: Embora o verbo signifique basicamente construir, as cidades já existiam e haviam sido entregues; no contexto, reconstruir ou restaurar é o sentido mais provável, sem ocultar a alternativa literal na nota.
- source_word: וַיּוֹשֶׁב שָׁם
  choice: estabeleceu nelas
  rationale: 'O hifil de ישׁב é causativo: Salomão fez pessoas habitarem ali. ''Estabeleceu nelas'' expressa isso naturalmente, e ''nelas'' retoma com clareza as cidades.'
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: israelitas
  rationale: A expressão significa literalmente 'filhos de Israel', mas aqui designa coletivamente pessoas pertencentes a Israel, sem se limitar necessariamente a descendentes homens.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O nome Hurão segue a forma do texto hebraico. A ordem foi levemente ajustada para fluência, sem eliminar a ambiguidade lexical de בנה, preservada em nota.
