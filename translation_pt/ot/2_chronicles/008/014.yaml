  text: וַ/יַּעֲמֵ֣ד כְּ/מִשְׁפַּ֣ט דָּֽוִיד אָ֠בִי/ו אֶת מַחְלְק֨וֹת הַ/כֹּהֲנִ֜ים עַל עֲבֹדָתָ֗/ם וְ/הַ/לְוִיִּ֣ם עַל מִ֠שְׁמְרוֹתָ/ם לְ/הַלֵּ֨ל וּ/לְ/שָׁרֵ֜ת נֶ֤גֶד הַ/כֹּֽהֲנִים֙ לִ/דְבַר י֣וֹם בְּ/יוֹמ֔/וֹ וְ/הַ/שּׁוֹעֲרִ֥ים בְּ/מַחְלְקוֹתָ֖/ם לְ/שַׁ֣עַר וָ/שָׁ֑עַר כִּ֣י כֵ֔ן מִצְוַ֖ת דָּוִ֥יד אִישׁ הָ/אֱלֹהִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/014.yaml
  text: And according to the ordinance of David his father[a], he appointed the divisions of the priests for their service, and the Levites for their duties, to praise and to minister before the priests, as each day required, and the gatekeepers in their divisions for each gate; for so was the commandment of David[b], the man of God.
translation:
  language: pt
  text: Conforme a determinação de Davi, seu pai[a], ele designou as divisões dos sacerdotes para seu serviço, os levitas para suas funções, para louvar e servir diante dos sacerdotes, conforme a exigência de cada dia[b], e os porteiros em suas divisões, para cada porta; pois essa era a ordem de Davi, o homem de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu antepassado”; no uso régio e genealógico hebraico, “pai” pode referir-se a um ancestral ou predecessor.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “para a questão de cada dia no seu dia”, isto é, conforme o que estava prescrito para cada dia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: ele estabeleceu
  rationale: O hifil de עמד indica pôr pessoas em seus lugares ou funções. “Estabeleceu” comunica a organização administrativa do pessoal do templo sem reduzir o verbo a uma ação meramente física.
- source_word: כְּמִשְׁפַּט
  choice: conforme a determinação
  rationale: מִשְׁפָּט pode designar regra, prescrição ou ordenança. “Determinação” expressa aqui um arranjo normativo estabelecido por Davi.
- source_word: דָּוִיד אָבִיו
  choice: Davi, seu pai
  rationale: Preserva a forma do hebraico, em que “pai” pode também designar um antepassado ou predecessor dinástico; a nota esclarece esse uso.
- source_word: מַחְלְקוֹת
  choice: divisões
  rationale: Designa os grupos organizados de sacerdotes, levitas e porteiros; “divisões” é claro e adequado ao contexto administrativo.
- source_word: עַל עֲבֹדָתָם
  choice: para o serviço deles
  rationale: A expressão indica a esfera de serviço atribuída aos sacerdotes e mantém o sentido cultual de עֲבֹדָה.
- source_word: מִשְׁמְרוֹתָם
  choice: em seus postos
  rationale: מִשְׁמֶרֶת pode indicar encargo, turno ou posto designado. “Em seus postos” conserva a ideia de atribuição organizada sem especificar além do texto.
- source_word: לְהַלֵּל וּלְשָׁרֵת
  choice: para louvar e servir
  rationale: “Louvar” traduz diretamente הלל; “servir” mantém o sentido cultual de שרת em linguagem natural e digna.
- source_word: נֶגֶד הַכֹּהֲנִים
  choice: diante dos sacerdotes
  rationale: נֶגֶד significa “diante de”, “em frente de” ou “na presença de”. A tradução preserva a relação espacial e funcional sem interpretá-la como igualdade ou subordinação específica.
- source_word: לִדְבַר יוֹם בְּיוֹמוֹ
  choice: conforme a exigência de cada dia
  rationale: A expressão idiomática indica o que estava prescrito ou requerido para cada dia. A formulação portuguesa transmite o sentido com naturalidade; a literalidade é registrada em nota.
- source_word: הַשּׁוֹעֲרִים
  choice: os porteiros
  rationale: Refere-se aos encarregados das portas do templo. “Porteiros” é conciso, corrente em contexto bíblico e mais natural do que uma perífrase.
- source_word: לְשַׁעַר וָשָׁעַר
  choice: em cada porta
  rationale: A construção distributiva hebraica significa literalmente “para porta e porta”, isto é, uma atribuição em cada porta.
- source_word: מִצְוַת
  choice: a ordem
  rationale: מִצְוָה designa uma ordem autorizada. “Ordem” mantém a força normativa e soa mais natural neste contexto administrativo do que “mandamento”.
- source_word: אִישׁ הָאֱלֹהִים
  choice: o homem de Deus
  rationale: Equivalente formal e consagrado que preserva integralmente o título hebraico.
theological_decisions:
- issue: Uso régio-genealógico de “pai” para Davi
  choice: Manter “Davi, seu pai” no texto principal.
  alternative: “Davi, seu antepassado” ou “Davi, seu ancestral”.
  rationale: O hebraico emprega literalmente “pai”, palavra que pode designar um antepassado ou predecessor dinástico. Mantê-la preserva a forma e a amplitude do original, enquanto a nota evita uma leitura genealógica indevidamente restrita.
- issue: Relação dos levitas com os sacerdotes
  choice: Traduzir נֶגֶד הַכֹּהֲנִים por “diante dos sacerdotes”.
  alternative: “Junto aos sacerdotes” ou “na presença dos sacerdotes”.
  rationale: “Diante de” conserva a ambiguidade espacial e funcional da preposição hebraica, sem impor ao texto uma formulação eclesiológica ou hierárquica mais específica.
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. O período conserva a estrutura enumerativa do hebraico, mas emprega conectivos e pontuação naturais. Evitaram-se tanto arcaísmos desnecessários quanto explicitações doutrinárias; “homem de Deus” foi mantido como título bíblico reconhecível.
