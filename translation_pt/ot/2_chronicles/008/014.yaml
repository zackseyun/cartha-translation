revisions:
- from: Conforme a determinação de Davi, seu pai[a], ele estabeleceu as divisões dos sacerdotes para o serviço deles e os levitas em seus postos, para louvar e servir diante dos sacerdotes, conforme a exigência de cada dia[b], bem como os porteiros em suas divisões, em cada porta; pois essa havia sido a ordem de Davi, o homem de Deus.
  to: Conforme a determinação de Davi, seu pai[a], ele designou as divisões dos sacerdotes para seu serviço, os levitas para suas funções, para louvar e servir diante dos sacerdotes, conforme a exigência de cada dia[b], e os porteiros em suas divisões, para cada porta; pois essa era a ordem de Davi, o homem de Deus.
  rationale: A revisão esclarece que «ele designou» governa as três categorias — sacerdotes, levitas e porteiros — e substitui «postos» por «funções» para refletir de modo mais amplo os encargos levíticos. A nota b foi ajustada para uma formulação literal mais próxima do hebraico, preservando a explicação idiomática.
