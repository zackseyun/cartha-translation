base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/018.yaml
  text: And Huram sent him[a], by the hand of his servants, ships and servants who knew the sea. They went with Solomon’s servants to Ophir, took from there four hundred and fifty talents of gold[c][b], and brought them to King Solomon.
translation:
  language: pt
  text: Huram lhe enviou, por meio de seus servos[a], navios e servos que conheciam o mar[b]. Eles foram com os servos de Salomão a Ofir, tomaram de lá quatrocentos e cinquenta talentos de ouro e o levaram ao rei Salomão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «pela mão de seus servos», expressão hebraica que indica que algo foi feito por intermédio deles.
    reason: cultural_note
  - marker: b
    text: Também pode ser traduzido como «servos experientes no mar» ou, de forma mais concisa, «marinheiros». O hebraico diz literalmente «servos conhecedores do mar».
    reason: lexical_alternative
lexical_decisions:
- source_word: חוּרָם
  choice: Hurão
  rationale: Forma tradicional e reconhecível em português para o nome hebraico Huram.
- source_word: בְּיַד עֲבָדָיו
  choice: por meio de seus servos
  rationale: Expressa naturalmente em português o sentido de agência do idioma hebraico, literalmente «pela mão de seus servos».
- source_word: אוניות
  choice: navios
  rationale: Designa adequadamente embarcações empregadas numa expedição marítima.
- source_word: וַעֲבָדִים יֹדְעֵי יָם
  choice: servos que conheciam o mar
  rationale: Preserva tanto a condição deles como servos quanto sua experiência marítima, sem reduzir a expressão simplesmente a «marinheiros».
- source_word: אוֹפִירָה
  choice: a Ofir
  rationale: O sufixo direcional hebraico indica movimento em direção a Ofir.
- source_word: אַרְבַּע מֵאוֹת וַחֲמִשִּׁים כִּכַּר זָהָב
  choice: quatrocentos e cinquenta talentos de ouro
  rationale: Mantém a antiga unidade de peso e a especificidade histórica, sem impor uma conversão moderna incerta.
- source_word: וַיָּבִיאוּ אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: e o levaram ao rei Salomão
  rationale: O pronome singular retoma naturalmente «ouro» em português; o objeto do verbo é inferido no hebraico pelo contexto.
