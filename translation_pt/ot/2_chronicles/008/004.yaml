base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/004.yaml
  text: He built Tadmor in the wilderness[a], and all the storage cities that he built in Hamath.
translation:
  language: pt
  text: Ele construiu Tadmor no deserto[a] e todas as cidades-armazém que construiu em Hamate.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tadmor é tradicionalmente identificada com Palmira.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Ele construiu
  rationale: O wayyiqtol de בנה apresenta uma ação passada na sequência narrativa. O pretérito perfeito é a forma mais natural em português, sem necessidade de explicitar a conjunção.
- source_word: תַּדְמֹר
  choice: Tadmor
  rationale: O topônimo é transliterado de acordo com sua forma hebraica; a identificação tradicional com Palmira fica na nota.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: מִדְבָּר designa uma região desértica ou pouco habitada. «No deserto» é natural, claro e geograficamente apropriado neste contexto.
- source_word: כָּל עָרֵי הַמִּסְכְּנוֹת
  choice: todas as cidades-armazém
  rationale: A expressão designa cidades destinadas ao armazenamento de provisões ou suprimentos. «Cidades-armazém» comunica essa função administrativa de modo conciso e corrente.
- source_word: אֲשֶׁר בָּנָה
  choice: que construiu
  rationale: A oração relativa retoma as cidades-armazém. A construção sem repetir o sujeito pronominal é natural em português e mantém a referência clara.
- source_word: בַּחֲמָת
  choice: em Hamate
  rationale: O topônimo é transliterado, e a preposição «em» preserva sem especificação indevida se a referência é à cidade ou ao território de Hamate.
