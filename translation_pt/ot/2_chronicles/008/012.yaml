  text: אָ֣ז הֶעֱלָ֧ה שְׁלֹמֹ֛ה עֹל֖וֹת לַ/יהוָ֑ה עַ֚ל מִזְבַּ֣ח יְהוָ֔ה אֲשֶׁ֥ר בָּנָ֖ה לִ/פְנֵ֥י הָ/אוּלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/012.yaml
  text: Then Solomon offered up burnt offerings to Yahweh on the altar of Yahweh that he had built before the vestibule[a].
translation:
  language: pt
  text: Então Salomão ofereceu holocaustos a Yahweh sobre o altar de Yahweh que havia construído diante do pórtico.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vestíbulo” ou “alpendre”. O termo hebraico se refere ao recinto de entrada do templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Marca a progressão temporal da narrativa de forma natural e direta em português.
- source_word: הֶעֱלָה
  choice: ofereceu
  rationale: No hifil de עלה, com objeto sacrificial, significa oferecer um sacrifício; em português, “ofereceu holocaustos” expressa naturalmente a ação cultual.
- source_word: שְׁלֹמֹה
  choice: Salomão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: עֹלוֹת
  choice: holocaustos
  rationale: Termo bíblico consagrado para ofertas inteiramente queimadas, preciso e corrente nas traduções portuguesas.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל indica o destinatário ou a dedicação do sacrifício, e o nome divino é preservado como Yahweh.
- source_word: עַל מִזְבַּח יְהוָה
  choice: sobre o altar de Yahweh
  rationale: Reproduz com clareza a relação espacial de עַל e a cadeia construta “altar de Yahweh”.
- source_word: אֲשֶׁר בָּנָה
  choice: que havia construído
  rationale: A construção com mais-que-perfeito deixa claro que o altar foi construído antes da oferta, sem alterar o sentido do hebraico.
- source_word: לִפְנֵי הָאוּלָם
  choice: diante do pórtico
  rationale: “Diante de” expressa a localização, e “pórtico” designa naturalmente o recinto de entrada do templo.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz explicitamente o Tetragrama. “Yahweh” preserva o nome pactual e segue a orientação fornecida, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e acessível, com terminologia sacrificial bíblica reconhecível. “Pórtico” é mais natural em português para a estrutura de entrada; a nota registra alternativas lexicalmente possíveis.
