  text: וַ/יְהִ֞י מִ/קֵּ֣ץ עֶשְׂרִ֣ים שָׁנָ֗ה אֲשֶׁ֨ר בָּנָ֧ה שְׁלֹמֹ֛ה אֶת בֵּ֥ית יְהוָ֖ה וְ/אֶת בֵּיתֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/001.yaml
  text: And it happened at the end of twenty years[a], during which Solomon had built the house of Yahweh and his own house,
translation:
  language: pt
  text: Aconteceu que, ao fim de vinte anos, durante os quais Salomão construiu a casa de Yahweh e a sua própria casa[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu palácio”. O hebraico diz literalmente “sua casa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Aconteceu que
  rationale: Introduz um novo desenvolvimento narrativo; a formulação preserva essa transição em português atual e digno.
- source_word: מִקֵּץ עֶשְׂרִים שָׁנָה
  choice: ao fim de vinte anos
  rationale: Expressa naturalmente o ponto alcançado depois de um período de vinte anos.
- source_word: אֲשֶׁר
  choice: durante os quais
  rationale: Liga o período de vinte anos à atividade construtiva de Salomão e torna clara a relação temporal.
- source_word: בָּנָה
  choice: construiu
  rationale: O pretérito perfeito apresenta a obra como realizada dentro do período mencionado; em português, não é necessário empregar uma forma mais-que-perfeita para indicar que ela estava concluída ao fim dos vinte anos.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Mantém a expressão hebraica literal 'casa' e conserva o nome divino; 'templo' seria correto no contexto, mas mais interpretativo.
- source_word: בֵּיתוֹ
  choice: a sua própria casa
  rationale: O possessivo refere-se a Salomão, e 'própria' esclarece o contraste com a casa de Yahweh sem substituir o termo hebraico por 'palácio'.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; 'Yahweh' preserva o nome pessoal da aliança sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A vírgula final foi mantida porque o versículo continua sintaticamente no versículo seguinte. O marcador da nota foi colocado após “casa”, termo ao qual a alternativa lexical realmente se refere.
