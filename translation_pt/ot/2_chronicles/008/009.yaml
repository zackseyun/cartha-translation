base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/009.yaml
  text: But from the sons of Israel Solomon did not make slaves for his work[a], for they were men of war, and his officers[c][b], and the commanders of his chariots and his horsemen.
translation:
  language: pt
  text: Mas, dentre os filhos de Israel, Salomão não fez deles escravos para o seu trabalho[a], pois eles eram homens de guerra, seus oficiais[b], comandantes dos seus carros de guerra e seus cavaleiros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não destinou nenhum deles à escravidão em seus trabalhos”. A expressão hebraica indica colocar pessoas em trabalho escravo.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico provavelmente se refere a oficiais militares de elite ou ajudantes; também pode ser traduzido por “capitães”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: Mas, dentre
  rationale: A conjunção com a preposição estabelece contraste com o versículo anterior e indica que nenhum membro desse grupo foi destinado à condição descrita.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão hebraica e sua força étnico-nacional, permanecendo clara em português bíblico atual.
- source_word: לֹא נָתַן ... לַעֲבָדִים
  choice: não fez escravos
  rationale: A construção significa colocar pessoas em condição de escravidão ou destiná-las a trabalho escravo; evita suavizar עֲבָדִים como simples 'servos'.
- source_word: לִמְלַאכְתּוֹ
  choice: para o seu trabalho
  rationale: Designa o trabalho exigido por Salomão, provavelmente no âmbito dos projetos estatais mencionados no contexto.
- source_word: כִּי הֵמָּה
  choice: pois eles eram
  rationale: Expressa de modo natural a relação explicativa do hebraico.
- source_word: אַנְשֵׁי מִלְחָמָה
  choice: homens de guerra
  rationale: Mantém o idioma hebraico e comunica claramente a função militar.
- source_word: שָׂרֵי שָׁלִישָׁיו
  choice: seus oficiais
  rationale: O termo militar é difícil e pode indicar oficiais de elite ou ajudantes; a opção ampla evita precisão indevida.
- source_word: שָׂרֵי רִכְבּוֹ
  choice: comandantes dos seus carros de guerra
  rationale: Indica os responsáveis pelo corpo de carros; 'carros de guerra' esclarece o sentido militar em português moderno.
- source_word: וּפָרָשָׁיו
  choice: seus cavaleiros
  rationale: Tradução corrente para os militares montados mencionados no texto.
theological_decisions: []
