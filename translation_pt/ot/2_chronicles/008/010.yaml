  text: וְ/אֵ֨לֶּה שָׂרֵ֤י ה/נציבים אֲשֶׁר לַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה חֲמִשִּׁ֣ים וּ/מָאתָ֑יִם הָ/רֹדִ֖ים בָּ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/010.yaml
  text: 'These were the chiefs of King Solomon’s deputies: two hundred and fifty[b][a], who ruled over the people.'
translation:
  language: pt
  text: 'Estes eram os chefes dos administradores[a] do rei Salomão: duzentos e cinquenta, que exerciam autoridade sobre o povo.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “superintendentes”, “oficiais” ou “encarregados”; o termo hebraico se refere a funcionários nomeados que atuavam sob a autoridade do rei.
    reason: lexical_alternative
  - marker: b
    text: Ou “que governavam o povo”, “que supervisionavam o povo” ou “que estavam encarregados do povo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Estes eram
  rationale: Introduz o grupo no contexto de uma narrativa histórica; o pretérito imperfeito soa natural em português e corresponde ao enquadramento narrativo.
- source_word: שָׂרֵי
  choice: chefes
  rationale: Indica os oficiais de maior posição entre os נְצִיבִים, sem restringir indevidamente a função ao âmbito militar.
- source_word: הַנְּצִיבִים
  choice: administradores
  rationale: Designa funcionários nomeados sob autoridade real. “Administradores” comunica a função oficial em português atual, enquanto outras possibilidades são registradas em nota.
- source_word: אֲשֶׁר לַמֶּלֶךְ שְׁלֹמֹה
  choice: do rei Salomão
  rationale: Expressa de modo conciso e natural a relação de pertencimento ou serviço ao rei.
- source_word: חֲמִשִּׁים וּמָאתָיִם
  choice: duzentos e cinquenta
  rationale: Forma portuguesa padrão para o número hebraico.
- source_word: הָרֹדִים
  choice: que exerciam autoridade
  rationale: O particípio de רדה denota governo ou domínio. A formulação preserva a ideia de autoridade sem sugerir necessariamente opressão ou soberania régia independente.
- source_word: בָּעָם
  choice: sobre o povo
  rationale: Com רדה, a preposição ב marca naturalmente aqueles sobre os quais se exerce autoridade. O hebraico diz “povo”, não explicitamente “trabalhadores”.
theological_decisions: []
