  text: וְ/לֹ֣א סָרוּ֩ מִצְוַ֨ת הַ/מֶּ֜לֶךְ עַל הַ/כֹּהֲנִ֧ים וְ/הַ/לְוִיִּ֛ם לְ/כָל דָּבָ֖ר וְ/לָ/אֹצָרֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/015.yaml
  text: And they did not turn aside from the king’s command concerning the priests and the Levites in any matter[a], or concerning the treasuries.
translation:
  language: pt
  text: E não se desviaram da ordem do rei quanto aos sacerdotes e aos levitas, em assunto algum, nem quanto às tesourarias[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “depósitos”. O termo hebraico pode designar tesourarias ou locais de armazenamento; neste contexto administrativo do templo, “tesourarias” é a opção mais provável.
    reason: lexical_alternative
lexical_decisions:
- source_word: סָרוּ
  choice: se desviaram
  rationale: Preserva o sentido de afastar-se ou desviar-se de uma ordem e soa natural em português na construção negativa.
- source_word: מִצְוַת הַמֶּלֶךְ
  choice: da ordem do rei
  rationale: Neste contexto administrativo, מִצְוָה designa uma ordem ou determinação; “ordem” é corrente e claro.
- source_word: עַל הַכֹּהֲנִים וְהַלְוִיִּם
  choice: quanto aos sacerdotes e aos levitas
  rationale: עַל introduz aqui o assunto a que a ordem dizia respeito; os artigos distinguem os dois grupos.
- source_word: לְכָל דָּבָר
  choice: em assunto algum
  rationale: Com a negação, esta formulação transmite idiomaticamente a ideia de que não houve desvio em nenhuma questão.
- source_word: וְלָאֹצָרוֹת
  choice: nem quanto aos depósitos
  rationale: A conjunção coordenada, dentro da frase negativa, é naturalmente expressa por “nem”. אֹצָרוֹת pode indicar depósitos ou tesourarias; “depósitos” mantém o sentido amplo e concreto, com a alternativa registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e preservação da repetição que distingue sacerdotes e levitas. A tradução mantém o escopo negativo da frase e registra em nota a ambiguidade lexical de אֹצָרוֹת.
