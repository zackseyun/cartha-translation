base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/008.yaml
  text: From their descendants who were left after them in the land—those whom the sons of Israel had not destroyed—Solomon conscripted them for forced labor[b][a], to this day.
translation:
  language: pt
  text: Dos descendentes deles que restaram depois deles na terra — aqueles que os filhos de Israel não destruíram[a] — Salomão os submeteu a trabalho compulsório[b] até hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «não exterminaram». O hebraico diz literalmente «os filhos de Israel», uma designação nacional comum.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «para a prestação de serviço obrigatório». O termo hebraico refere-se a trabalho compulsório imposto pelo Estado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן בְּנֵיהֶם
  choice: Dos descendentes deles
  rationale: Embora בְּנֵי signifique literalmente «filhos de», neste contexto genealógico designa os descendentes dos povos citados no versículo anterior.
- source_word: אֲשֶׁר נוֹתְרוּ אַחֲרֵיהֶם
  choice: que restaram depois deles
  rationale: Preserva tanto a ideia de remanescente expressa por נותר quanto a relação temporal de אַחֲרֵיהֶם, sem interpretar além do texto.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: Equivalente corrente e adequado ao contexto territorial e histórico.
- source_word: אֲשֶׁר לֹא כִלּוּם בְּנֵי יִשְׂרָאֵל
  choice: aqueles que os filhos de Israel não destruíram
  rationale: O Piel de כלה pode significar acabar com ou destruir; «destruíram» comunica naturalmente o sentido neste contexto. «Filhos de Israel» conserva a designação nacional hebraica.
- source_word: וַיַּעֲלֵם שְׁלֹמֹה לְמַס
  choice: Salomão os recrutou para trabalhos forçados
  rationale: A combinação do causativo de עלה com לְמַס descreve a imposição administrativa de serviço compulsório. «Recrutou» associado a «trabalhos forçados» expressa o ato sem recorrer ao termo técnico «corveia».
- source_word: עַד הַיּוֹם הַזֶּה
  choice: e assim permanecem até hoje
  rationale: O hebraico indica a continuidade da condição até o tempo do narrador. A explicitação «assim permanecem» torna natural em português o vínculo com o trabalho compulsório sem alterar o referente.
