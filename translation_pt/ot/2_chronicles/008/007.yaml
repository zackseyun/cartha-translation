base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/007.yaml
  text: As for all the people who were left from the Hittites[a], the Amorites, the Perizzites, the Hivites, and the Jebusites, who were not from Israel—
translation:
  language: pt
  text: Quanto a todo o povo que restou dos hititas, dos amorreus, dos perizeus, dos heveus e dos jebuseus, os quais não eram de Israel[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os quais não eram israelitas”. Mais literalmente, o hebraico diz: “os quais não eram de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָעָם
  choice: todo o povo
  rationale: A expressão abrange coletivamente toda a população remanescente em vista; “todo o povo” é natural e conserva o valor coletivo do hebraico.
- source_word: הַנּוֹתָר
  choice: que restou
  rationale: O particípio nifal indica aqueles que ficaram ou permaneceram; “que restou” é claro, corrente e adequado ao contexto retrospectivo.
- source_word: מִן
  choice: dos
  rationale: A preposição marca procedência dentre os povos enumerados; a contração “dos” expressa isso naturalmente em português.
- source_word: הַחִתִּי וְהָאֱמֹרִי וְהַפְּרִזִּי וְהַחִוִּי וְהַיְבוּסִי
  choice: dos hititas, dos amorreus, dos perizeus, dos heveus e dos jebuseus
  rationale: São as formas portuguesas tradicionais e amplamente reconhecidas dos etnônimos. Embora estejam no singular coletivo em hebraico, o plural é idiomático em português.
- source_word: אֲשֶׁר לֹא מִיִּשְׂרָאֵל הֵמָּה
  choice: os quais não eram de Israel
  rationale: A tradução conserva a preposição מִן e a formulação de origem ou pertencimento do hebraico, sem explicitar além do texto que não eram israelitas.
