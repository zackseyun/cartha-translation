  - severity: low
    issue: “Como havia feito em honra de seus antepassados” deixa menos explícita a relação comparativa da queima.
    rationale: A formulação pode sugerir que os antepassados realizaram a ação. “Como a queima feita para seus antepassados” conserva de modo mais preciso a construção hebraica e seu referente.
