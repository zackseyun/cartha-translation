  source_fidelity: 'A sequência temporal, a descrição explícita da enfermidade e a morte por doenças graves são transmitidas com fidelidade. Contudo, “acendeu uma fogueira” especifica indevidamente tanto a ação quanto o objeto de שְׂרֵפָה: o hebraico diz que o povo não lhe “fez” uma queima, sem afirmar que acendeu uma fogueira. A comparação final também deve conservar claramente que a queima era em favor dos antepassados.'
  naturalness: O português é claro e atual. “Fazer por ele uma queima” é ligeiramente formal, mas apropriado ao registro narrativo-histórico e evita a especificação imprópria de “fogueira”.
  terminology: “Intestinos” preserva a concretude de מֵעָיו; “doenças terríveis” comunica bem a gravidade do hebraico. “Queima” é mais lexicalmente neutro e fiel do que “fogueira”; a nota explica com prudência o provável costume funerário, sem tratá-lo como certeza.
  issues:
