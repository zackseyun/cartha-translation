revisions:
- from: Depois de algum tempo, ao fim de dois anos, seus intestinos[a] saíram por causa da doença, e ele morreu de doenças terríveis. Seu povo não acendeu uma fogueira em sua honra[b], como havia feito em honra de seus antepassados.
  to: Depois de algum tempo, ao fim de dois anos, seus intestinos[a] saíram por causa da doença, e ele morreu de doenças terríveis. Seu povo não fez por ele uma queima[b], como a queima feita para seus antepassados.
  rationale: A revisão substitui “acendeu uma fogueira” por “fez por ele uma queima”, preservando o verbo hebraico e a ambiguidade controlada do substantivo. Também torna explícito que a comparação é com a queima realizada para os antepassados, não uma ação realizada por eles. As notas permanecem ancoradas nos termos a que se referem e explicam o provável contexto cultural sem o impor como tradução.
