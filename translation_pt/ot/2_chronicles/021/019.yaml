base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/019.yaml
  text: And after some time[a], at the end of two years, his bowels came out because of his sickness, and he died of severe diseases[b]. And his people made no burning for him like the burning for his fathers.
translation:
  language: pt
  text: Depois de algum tempo, ao fim de dois anos, seus intestinos[a] saíram por causa da doença, e ele morreu de doenças terríveis. Seu povo não fez por ele uma queima[b], como a queima feita para seus antepassados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus órgãos internos”. O termo hebraico se refere às partes interiores do corpo.
    reason: lexical_alternative
  - marker: b
    text: A “queima” provavelmente fazia parte das honras fúnebres, talvez envolvendo a queima de especiarias, e não era a cremação do corpo. Compare outros costumes funerários reais mencionados em Crônicas.
    reason: cultural_note
lexical_decisions:
- source_word: לְיָמִים מִיָּמִים
  choice: Depois de algum tempo
  rationale: A expressão idiomática indica a passagem de um período indefinido; a formulação portuguesa comunica isso com naturalidade.
- source_word: וּכְעֵת צֵאת הַקֵּץ לְיָמִים שְׁנַיִם
  choice: ao fim de dois anos
  rationale: Expressa de modo claro o ponto final do período de dois anos indicado pelo hebraico.
- source_word: מֵעָיו
  choice: seus intestinos
  rationale: O termo designa as partes internas do corpo, especialmente os intestinos. A escolha mantém a concretude e a força gráfica da passagem.
- source_word: יָצְאוּ מֵעָיו
  choice: seus intestinos saíram
  rationale: Preserva o sentido comum do verbo 'sair' e não ameniza a descrição física do texto.
- source_word: עִם חָלְיוֹ
  choice: por causa da doença
  rationale: Neste contexto, a preposição exprime circunstância causal ou concomitante; esta forma é clara e natural em português.
- source_word: בְּתַחֲלֻאִים רָעִים
  choice: morreu de doenças terríveis
  rationale: Mantém o plural do substantivo e transmite a gravidade expressa pelo adjetivo, em linguagem portuguesa natural.
- source_word: שְׂרֵפָה
  choice: acendeu uma fogueira em sua honra
  rationale: Comunica em português corrente a queima cerimonial associada às honras fúnebres, sem sugerir diretamente a cremação do corpo; a nota preserva a transparência cultural e lexical.
- source_word: כִּשְׂרֵפַת אֲבֹתָיו
  choice: como havia feito em honra de seus antepassados
  rationale: Explicita naturalmente a comparação com a honra fúnebre concedida aos reis anteriores, sem afirmar que seus corpos foram queimados.
theological_decisions:
- issue: Natureza de שְׂרֵפָה no contexto funerário real
  choice: fogueira ou queima cerimonial em honra do falecido, provavelmente sem cremação do corpo
  alternative: cremação ou rito de queima não especificado
  rationale: No contexto real de Crônicas, a declaração contrasta as honras prestadas aos reis anteriores com as negadas a Jeorão. A tradução evita apresentar como certa a cremação, e a nota indica a provável natureza honorífica do costume.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A descrição gráfica foi preservada sem eufemismo, e o costume funerário foi expresso de maneira natural, com a incerteza cultural esclarecida em nota.
