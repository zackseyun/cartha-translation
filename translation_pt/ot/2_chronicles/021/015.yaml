source:
  edition: WLC
  text: וְ/אַתָּ֛ה בָּ/חֳלָיִ֥ים רַבִּ֖ים בְּ/מַחֲלֵ֣ה מֵעֶ֑י/ךָ עַד יֵצְא֤וּ מֵעֶ֨י/ךָ֙ מִן הַ/חֹ֔לִי יָמִ֖ים עַל יָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/015.yaml
  text: And you yourself will suffer many illnesses[a], with a disease of your bowels, until your bowels come out because of the disease[b], day after day.
translation:
  language: pt
  text: E você mesmo sofrerá de muitas enfermidades, com uma doença nos intestinos[a], até que os seus intestinos saiam por causa da doença, dia após dia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nas entranhas”; o termo hebraico se refere aos órgãos internos, especialmente aos intestinos.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “dias sobre dias”, expressão que pode significar “dia após dia” ou “por muitos dias”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: E você mesmo
  rationale: A conjunção seguida do pronome independente introduz uma mudança enfática para o próprio Jeorão; “você mesmo” preserva essa ênfase.
- source_word: בָּחֳלָיִים רַבִּים
  choice: sofrerá de muitas enfermidades
  rationale: A preposição בְּ expressa aqui a condição aflitiva. A formulação é natural em português e preserva a pluralidade de חֳלָיִים e a ideia de sofrimento.
- source_word: בְּמַחֲלֵה מֵעֶיךָ
  choice: com uma doença nos intestinos
  rationale: A segunda construção com בְּ especifica a aflição mencionada anteriormente, sem lhe atribuir indevidamente o sentido separativo de מִן. “Nos intestinos” é claro no contexto médico.
- source_word: עַד יֵצְאוּ מֵעֶיךָ
  choice: até que os seus intestinos saiam
  rationale: Mantém sem suavização o resultado terrível descrito pelo verbo יָצָא, “sair”.
- source_word: מִן הַחֹלִי
  choice: por causa da doença
  rationale: 'מִן tem valor causal neste contexto: a saída dos intestinos ocorre como resultado da doença.'
- source_word: יָמִים עַל יָמִים
  choice: dia após dia
  rationale: A expressão idiomática indica continuidade ao longo de dias sucessivos; “dia após dia” conserva sua força durativa em português corrente.
