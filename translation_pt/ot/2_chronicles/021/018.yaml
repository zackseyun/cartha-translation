id: 2CH.21.18
reference: 2 Chronicles 21:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אַחֲרֵ֖י כָּל זֹ֑את נְגָפ֨/וֹ יְהוָ֧ה בְּ/מֵעָ֛י/ו לָ/חֳלִ֖י לְ/אֵ֥ין מַרְפֵּֽא־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/018.yaml
  text: And after all this[a], Yahweh struck him in his intestines with an incurable disease.
translation:
  language: pt
  text: Depois de tudo isso, Yahweh o feriu nos intestinos com uma doença sem cura.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com uma doença incurável”. Literalmente: “para não haver cura”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כָּל זֹאת
  choice: Depois de tudo isso
  rationale: Expressa naturalmente a sequência temporal e retoma coletivamente os acontecimentos anteriores. Em português, omitir o וְ inicial evita um começo menos fluente sem perder a continuidade narrativa.
- source_word: נְגָפוֹ
  choice: o feriu
  rationale: Preserva a força do verbo no contexto de um golpe ou aflição divina, sem especificar além do hebraico o modo da ação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: בְּמֵעָיו
  choice: nos intestinos
  rationale: מֵעֶה designa as partes internas do corpo, particularmente os intestinos; esta opção é clara e corrente em português moderno.
- source_word: לָחֳלִי
  choice: com uma doença
  rationale: Comunica a condição resultante da ação divina de forma natural e mantém a gravidade física da aflição.
- source_word: לְאֵין מַרְפֵּא
  choice: sem cura
  rationale: Segue de perto a expressão hebraica, literalmente relacionada à inexistência de cura, e preserva sua formulação mais aberta em vez de reduzi-la apenas ao adjetivo 'incurável'.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama. A transliteração 'Yahweh' preserva o nome pessoal divino sem substituí-lo por um título.
- issue: Relação entre a ação divina e a enfermidade
  choice: Yahweh o feriu nos intestinos com uma doença
  alternative: Yahweh o afligiu com uma doença intestinal
  rationale: A redação mantém Deus como agente explícito e conserva a força concreta de נְגָפוֹ, sem suavizar nem explicar a causalidade teológica do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação 'sem cura' mantém proximidade com o hebraico e a nota registra tanto a alternativa idiomática quanto a construção literal.
