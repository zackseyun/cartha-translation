  text: וְ/לֽ/וֹ אַחִ֞ים בְּנֵ֣י יְהוֹשָׁפָ֗ט עֲזַרְיָ֤ה וִֽ/יחִיאֵל֙ וּ/זְכַרְיָ֣הוּ וַ/עֲזַרְיָ֔הוּ וּ/מִיכָאֵ֖ל וּ/שְׁפַטְיָ֑הוּ כָּל אֵ֕לֶּה בְּנֵ֥י יְהוֹשָׁפָ֖ט מֶ֥לֶךְ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/002.yaml
  text: 'And he had brothers[a], the sons of Jehoshaphat: Azariah, Jehiel, Zechariah, Azariahu, Michael, and Shephatiah[b]. All these were the sons of Jehoshaphat king of Israel.'
translation:
  language: pt
  text: 'Ele tinha irmãos, filhos de Josafá: Azarias, Jeiel, Zacarias, Azariaú[a], Micael e Sefatias. Todos eles eram filhos de Josafá, rei de Israel[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O quarto nome tem, em hebraico, uma forma diferente da do primeiro Azarias; essa distinção foi preservada como “Azariaú”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “rei de Israel”. Josafá é mais frequentemente identificado, em termos históricos, como rei de Judá; aqui, Crônicas usa “Israel”, possivelmente em sentido mais amplo para o povo da aliança.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/לֽ/וֹ אַחִים
  choice: Ele tinha irmãos
  rationale: A construção hebraica, literalmente “e para ele havia irmãos”, é uma expressão idiomática de posse. “Ele tinha irmãos” comunica isso com naturalidade em português; o contexto identifica esses homens como irmãos de Jeorão.
- source_word: בְּנֵי יְהוֹשָׁפָט
  choice: filhos de Josafá
  rationale: Preserva a formulação genealógica explícita do hebraico e identifica os irmãos como filhos de Josafá.
- source_word: עֲזַרְיָה ... וַ/עֲזַרְיָהוּ
  choice: Azarias ... Azariaú
  rationale: As formas distintas em hebraico são mantidas por transliterações portuguesas distintas, evitando que os nomes de dois irmãos sejam indevidamente igualados.
- source_word: וִֽ/יחִיאֵל
  choice: Jeiel
  rationale: Forma bíblica portuguesa reconhecível do nome hebraico.
- source_word: וּ/זְכַרְיָהוּ
  choice: Zacarias
  rationale: Forma tradicional e amplamente reconhecida em português.
- source_word: וּ/מִיכָאֵל
  choice: Micael
  rationale: Transliteração portuguesa convencional deste nome no contexto bíblico.
- source_word: וּ/שְׁפַטְיָהוּ
  choice: Sefatias
  rationale: Forma bíblica portuguesa corrente e reconhecível.
- source_word: כָּל אֵלֶּה
  choice: Todos eles
  rationale: Reproduz de maneira natural a expressão resumitiva que encerra a lista.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: rei de Israel
  rationale: Segue o texto hebraico de modo direto, sem harmonizá-lo com a designação histórica mais comum de Josafá como rei de Judá.
theological_decisions:
- issue: O título de Josafá em מֶלֶךְ יִשְׂרָאֵל
  choice: rei de Israel
  alternative: rei de Judá
  rationale: O texto hebraico diz explicitamente “rei de Israel”. A alternativa harmonizaria o versículo com a identificação histórica usual de Josafá, mas eliminaria a redação efetiva do Cronista e sua possível utilização mais abrangente de “Israel” para o povo da aliança.
translation_notes:
  register: Português moderno, claro e digno, com nomes em formas bíblicas reconhecíveis. A sintaxe preserva o caráter genealógico do hebraico sem reproduzir literalmente seu idioma de posse. As notas foram colocadas junto aos termos a que efetivamente se referem.
