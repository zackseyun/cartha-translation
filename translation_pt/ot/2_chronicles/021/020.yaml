  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בֶּן שְׁלֹשִׁ֤ים וּ/שְׁתַּ֨יִם֙ הָיָ֣ה בְ/מָלְכ֔/וֹ וּ/שְׁמוֹנֶ֣ה שָׁנִ֔ים מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וַ/יֵּ֨לֶךְ֙ בְּ/לֹ֣א חֶמְדָּ֔ה וַֽ/יִּקְבְּרֻ֨/הוּ֙ בְּ/עִ֣יר דָּוִ֔יד וְ/לֹ֖א בְּ/קִבְר֥וֹת הַ/מְּלָכִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/020.yaml
  text: He was thirty-two years old when he began to reign[a], and he reigned eight years in Jerusalem. Then he departed with no regret, and they buried him in the city of David, but not in the tombs of the kings.
translation:
  language: pt
  text: Tinha trinta e dois anos quando começou a reinar e reinou oito anos em Jerusalém. Partiu sem deixar saudade[a], e o sepultaram na Cidade de Davi, mas não nos túmulos dos reis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi-se sem ser desejado”, preservando mais literalmente a expressão hebraica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים וּשְׁתַּיִם
  choice: Tinha trinta e dois anos
  rationale: Expressa em português corrente a fórmula idiomática hebraica de idade, sem conservar literalmente “filho de trinta e dois anos”.
- source_word: בְמָלְכוֹ
  choice: quando começou a reinar
  rationale: A construção marca a idade de Jeorão ao assumir o reinado; esta formulação é natural e clara em português.
- source_word: וּשְׁמוֹנֶה שָׁנִים מָלַךְ
  choice: reinou oito anos
  rationale: Reproduz de maneira direta e idiomática a fórmula régia hebraica.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: Uso locativo direto do nome da cidade.
- source_word: וַיֵּלֶךְ
  choice: Partiu
  rationale: Preserva o eufemismo hebraico “foi-se” no contexto de morte, sem explicitar além do texto que ele morreu.
- source_word: בְּלֹא חֶמְדָּה
  choice: sem deixar saudade
  rationale: חֶמְדָּה pode indicar desejo, apreço ou algo estimado. No obituário, a expressão sugere que sua partida não provocou pesar nem afeição pública; a nota conserva a alternativa mais literal.
- source_word: וַיִּקְבְּרֻהוּ
  choice: o sepultaram
  rationale: O verbo hebraico está no plural com objeto pronominal; o sujeito indeterminado é expresso naturalmente em português.
- source_word: בְּעִיר דָּוִיד
  choice: na Cidade de Davi
  rationale: Forma tradicional e clara do topônimo referente à área davídica de Jerusalém.
- source_word: וְלֹא בְּקִבְרוֹת הַמְּלָכִים
  choice: mas não nos túmulos dos reis
  rationale: “Túmulos” se ajusta ao contexto de sepultamentos reais, e “mas” comunica o contraste presente no hebraico.
theological_decisions:
- issue: Se וַיֵּלֶךְ deve ser explicitado como referência à morte
  choice: Partiu
  alternative: Morreu
  rationale: O contexto é claramente funerário, mas o hebraico emprega o verbo “ir”. A tradução mantém o eufemismo e evita resolver de forma desnecessária a figura de linguagem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Sem deixar saudade” comunica o sentido contextual sem apagar a ambiguidade lexical, registrada na nota. O marcador foi colocado junto à expressão a que a nota se refere.
