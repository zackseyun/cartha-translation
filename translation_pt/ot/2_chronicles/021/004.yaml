base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/004.yaml
  text: When Jehoram had risen over his father's kingdom and had strengthened himself[a], he killed all his brothers with the sword, and also some of the princes of Israel.
translation:
  language: pt
  text: Quando Jeorão assumiu o poder sobre o reino de seu pai e se fortaleceu, matou à espada todos os seus irmãos e também alguns dos líderes de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «príncipes» ou «altos oficiais». O termo hebraico pode designar governantes, líderes ou administradores de alta posição.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם עַל מַמְלֶכַת אָבִיו
  choice: assumiu o poder sobre o reino de seu pai
  rationale: Expressa a ascensão de Jeorão ao governo e preserva em português a nuance de autoridade de עַל, sem recorrer à formulação pouco natural «levantou-se sobre».
- source_word: וַיִּתְחַזַּק
  choice: se fortaleceu
  rationale: Mantém a forma reflexiva do hitpael e deixa em aberto se o fortalecimento foi pessoal, militar ou político, sem restringi-lo a «consolidou sua posição».
- source_word: וַיַּהֲרֹג אֶת כָּל אֶחָיו בֶּחָרֶב
  choice: matou à espada todos os seus irmãos
  rationale: Usa linguagem atual e clara, preserva a referência específica aos irmãos do sexo masculino e mantém a espada como instrumento da morte.
- source_word: וְגַם מִשָּׂרֵי יִשְׂרָאֵל
  choice: e também alguns dos líderes de Israel
  rationale: «Também» conserva a força aditiva; «alguns dos» explicita o sentido partitivo de מִן; «líderes» comunica de modo amplo e atual o campo semântico de שָׂרִים.
theological_decisions:
- issue: Referente de «Israel» em «líderes de Israel»
  choice: Israel
  alternative: Judá; a nação
  rationale: Mantém o termo do texto hebraico e não elimina a possível nuance histórica, pactual ou dinástica de seu uso em Crônicas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura temporal com «Quando» integra naturalmente a sequência narrativa. A nota foi colocada após a expressão a que se refere.
