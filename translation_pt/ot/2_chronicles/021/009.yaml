  text: וַ/יַּֽעֲבֹ֤ר יְהוֹרָם֙ עִם שָׂרָ֔י/ו וְ/כָל הָ/רֶ֖כֶב עִמּ֑/וֹ וַ/יְהִי֙ קָ֣ם לַ֔יְלָה וַ/יַּ֗ךְ אֶת אֱדוֹם֙ הַ/סּוֹבֵ֣ב אֵלָ֔י/ו וְ/אֵ֖ת שָׂרֵ֥י הָ/רָֽכֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/009.yaml
  text: So Jehoram crossed over with his commanders and all the chariots with him. And it happened that he arose by night and struck Edom[a], which had surrounded him, and the commanders of the chariots.
translation:
  language: pt
  text: Então Jeorão atravessou com seus comandantes e com todos os carros de guerra que estavam com ele. Durante a noite, levantou-se e atacou os edomitas que o cercavam e os comandantes dos carros de guerra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os oficiais da tropa de carros”.'
    reason: A expressão hebraica pode designar os oficiais responsáveis pela força de carros de guerra, e não comandantes de carros individuais.
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: atravessou
  rationale: O verbo עבר indica passar ou atravessar. A tradução preserva o movimento concreto sem especificar um destino ou uma manobra militar que o hebraico não explicita.
- source_word: שָׂרָיו
  choice: seus comandantes
  rationale: שַׂר pode designar príncipe, autoridade ou chefe militar; o contexto de combate e carros de guerra favorece “comandantes”.
- source_word: הָרֶכֶב
  choice: os carros de guerra
  rationale: רֶכֶב pode referir-se coletivamente aos carros ou à força de carros. “Carros de guerra” é claro em português moderno e evita confusão com veículos comuns.
- source_word: וַיְהִי קָם לַיְלָה
  choice: Durante a noite, levantou-se
  rationale: A formulação natural em português comunica tanto o momento noturno quanto a ação narrativa, sem tornar pesada a construção hebraica com וַיְהִי e particípio.
- source_word: וַיַּךְ
  choice: atacou
  rationale: נכה tem sentido amplo de golpear ou ferir. No contexto militar, “atacou” é natural e, ao contrário de “derrotou”, não afirma um resultado além do que este versículo declara.
- source_word: אֱדוֹם
  choice: os edomitas
  rationale: Embora o hebraico use o nome coletivo “Edom”, em português a referência às pessoas combatentes fica mais natural como “os edomitas”.
- source_word: הַסּוֹבֵב אֵלָיו
  choice: que o cercavam
  rationale: O particípio de סבב descreve Edom em torno de Jeorão; o plural concorda naturalmente com “os edomitas” em português.
- source_word: שָׂרֵי הָרֶכֶב
  choice: os comandantes dos carros de guerra
  rationale: A expressão designa líderes ligados à força de carros; a tradução conserva de perto a estrutura hebraica, enquanto a nota registra uma alternativa coletiva natural.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Carros de guerra” explicita o sentido antigo de רֶכֶב. A coordenação final foi preservada sem identificar indevidamente a quem pertenciam os comandantes dos carros.
