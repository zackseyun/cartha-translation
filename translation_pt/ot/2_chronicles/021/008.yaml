base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/008.yaml
  text: In his days Edom rebelled from under the hand of Judah and made a king over themselves[a].
translation:
  language: pt
  text: Nos seus dias, Edom se rebelou contra o domínio de Judá e nomeou para si um rei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “rebelou-se de sob a mão de Judá”. Literalmente, a continuação diz: “e fizeram reinar sobre si um rei”.'
    reason: Preserva a imagem hebraica de submissão à “mão” de Judá e esclarece a formulação plural do segundo verbo.
lexical_decisions:
- source_word: בְּיָמָיו
  choice: Nos seus dias
  rationale: Preserva a expressão temporal hebraica e indica o período do reinado de Jeorão em linguagem natural e digna.
- source_word: פָּשַׁע
  choice: se rebelou
  rationale: No contexto político, o verbo descreve a revolta de Edom e seu rompimento com a autoridade de Judá.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Forma tradicional e amplamente reconhecida em português para o nome do povo e território.
- source_word: מִתַּחַת יַד יְהוּדָה
  choice: contra o domínio de Judá
  rationale: Traduz idiomaticamente a imagem hebraica de estar 'debaixo da mão' de alguém, isto é, sob sua autoridade ou controle.
- source_word: וַיַּמְלִיכוּ
  choice: constituiu ... um rei
  rationale: O hifil de מלך indica fazer alguém reinar ou instalá-lo como rei; 'constituiu' comunica esse sentido com clareza.
- source_word: עֲלֵיהֶם
  choice: para si
  rationale: Explicita de modo natural em português que os edomitas instalaram um rei sobre o próprio povo.
- source_word: מֶלֶךְ
  choice: um rei
  rationale: O substantivo é indefinido no contexto, e o artigo indefinido é natural em português.
