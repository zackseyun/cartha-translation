  text: וַ/יִּשְׁכַּ֤ב יְהֽוֹשָׁפָט֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵ֥ר עִם אֲבֹתָ֖י/ו בְּ/עִ֣יר דָּוִ֑יד וַ/יִּמְלֹ֛ךְ יְהוֹרָ֥ם בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/001.yaml
  text: And Jehoshaphat slept with his fathers and was buried with his fathers in the city of David[b][a], and Jehoram his son reigned in his place.
translation:
  language: pt
  text: Josafá descansou com seus antepassados[a][b] e foi sepultado com seus antepassados na Cidade de Davi. Seu filho Jeorão reinou em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “morreu”; literalmente, “deitou-se com seus pais”.
    reason: lexical_alternative
  - marker: b
    text: “Descansou com seus antepassados” é uma expressão idiomática hebraica que indica que alguém se juntou aos antepassados na morte.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: descansou
  rationale: No anúncio régio, o verbo integra uma expressão idiomática referente à morte. “Descansou” conserva a imagem e o tom memorial do hebraico, enquanto a nota esclarece o sentido.
- source_word: עִם אֲבֹתָיו
  choice: com seus antepassados
  rationale: “Antepassados” comunica em português atual o sentido dinástico de אָבוֹת sem sugerir apenas os pais imediatos. A repetição da expressão foi preservada nas duas orações.
- source_word: וַיִּקָּבֵר
  choice: foi sepultado
  rationale: Reprodução direta e digna da forma passiva no encadeamento narrativo.
- source_word: בְּעִיר דָּוִיד
  choice: na Cidade de Davi
  rationale: Forma consagrada e clara do nome geográfico bíblico em português.
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: Mantém a fórmula convencional de sucessão régia e corresponde diretamente ao verbo hebraico.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: Expressa a sucessão e conserva de perto o sentido da locução hebraica, sem a possível carga contrastiva de “em vez dele”.
- source_word: יְהוֹשָׁפָט
  choice: Josafá
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: יְהוֹרָם
  choice: Jeorão
  rationale: Forma portuguesa tradicional correspondente ao nome hebraico יְהוֹרָם.
