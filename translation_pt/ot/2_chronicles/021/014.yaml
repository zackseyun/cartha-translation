source:
  edition: WLC
  text: הִנֵּ֣ה יְהוָ֗ה נֹגֵ֛ף מַגֵּפָ֥ה גְדוֹלָ֖ה בְּ/עַמֶּ֑/ךָ וּ/בְ/בָנֶ֥י/ךָ וּ/בְ/נָשֶׁ֖י/ךָ וּ/בְ/כָל רְכוּשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/014.yaml
  text: Behold[a], Yahweh is striking your people, your sons, your wives, and all your possessions with a great plague.
translation:
  language: pt
  text: Eis que Yahweh[a] está para ferir o teu povo, os teus filhos, as tuas esposas e todos os teus bens com uma grande praga.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh representa o nome divino escrito em hebraico com as quatro consoantes YHWH.
    reason: divine_name
  - marker: b
    text: 'Ou: “ferirá [...] com um grande golpe” ou “com uma grande aflição”. O particípio hebraico pode indicar uma ação iminente, presente ou futura, e o termo traduzido como “praga” também pode designar um golpe severo infligido por Deus.'
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Preserva a força solene e enfática da introdução profética em português corrente e digno.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: נֹגֵף
  choice: está para ferir
  rationale: A construção com הִנֵּה e o particípio pode indicar ação iminente; esta formulação comunica a urgência sem convertê-la em presente já em curso.
- source_word: מַגֵּפָה גְדוֹלָה
  choice: com uma grande praga
  rationale: Mantém o sentido comum de מַגֵּפָה como praga, sem apagar sua possível extensão semântica de golpe ou aflição severa de origem divina.
- source_word: בְּעַמֶּךָ
  choice: o seu povo
  rationale: A preposição marca aqui o alvo afetado pelo golpe; o objeto direto é natural em português.
- source_word: וּבְבָנֶיךָ
  choice: os seus filhos
  rationale: בנים é masculino plural; 'filhos' preserva essa especificidade e soa natural no contexto familiar.
- source_word: וּבְנָשֶׁיךָ
  choice: as suas mulheres
  rationale: No contexto possessivo, נָשִׁים designa as esposas; 'suas mulheres' é uma formulação bíblica compreensível e evita o lusitanismo pouco internacional 'esposas' não sendo necessário, embora 'esposas' também fosse possível.
- source_word: וּבְכָל רְכוּשֶׁךָ
  choice: e todos os seus bens
  rationale: '''Bens'' expressa de modo conciso e natural o conjunto de propriedades e posses indicado por רְכוּשׁ.'
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico apresenta diretamente o nome da aliança; a transliteração o preserva sem substituí-lo por um título.
- issue: Valor temporal do particípio נֹגֵף na proclamação profética
  choice: 'iminência: ''está para ferir'''
  alternative: 'presente progressivo: ''está ferindo''; futuro simples: ''ferirá'''
  rationale: הִנֵּה seguido de particípio frequentemente anuncia uma ação iminente. A nota conserva as demais leituras gramaticalmente possíveis.
- issue: Amplitude semântica de מַגֵּפָה
  choice: '''praga'' no texto'
  alternative: '''golpe'' ou ''aflição'' severa'
  rationale: O termo pode denotar tanto uma praga quanto um golpe severo infligido por Deus; a tradução principal escolhe a acepção contextual mais natural, e a nota preserva a ambiguidade.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil, com tom solene. 'Eis que' mantém a força profética; 'está para ferir' comunica iminência. Os marcadores [a] e [b] aparecem no texto principal.
