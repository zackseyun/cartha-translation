base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/003.yaml
  text: Their father gave them many gifts of silver[a], gold, and precious things, along with fortified cities in Judah; but he gave the kingdom to Jehoram, because he was the firstborn.
translation:
  language: pt
  text: 'O pai deles lhes deu muitos presentes: prata, ouro e objetos preciosos[a], além de cidades fortificadas em Judá. Mas deu o reino a Jeorão, porque ele era o primogênito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “objetos seletos” ou “presentes valiosos”. O termo hebraico pode se referir de modo amplo a itens valiosos ou especialmente escolhidos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן לָהֶם אֲבִיהֶם
  choice: O pai deles lhes deu
  rationale: Mantém o sujeito e o objeto indireto do hebraico em uma ordem natural no português, usando o pretérito perfeito para a sequência narrativa.
- source_word: מַתָּנוֹת רַבּוֹת
  choice: muitos presentes
  rationale: Expressa de maneira direta e idiomática a ideia quantitativa de numerosos presentes.
- source_word: לְכֶסֶף וּלְזָהָב
  choice: em prata, ouro
  rationale: A preposição לְ introduz aqui as categorias ou a composição dos presentes; “em prata” é uma formulação natural em português sem especificar além do hebraico.
- source_word: וּלְמִגְדָּנוֹת
  choice: e objetos preciosos
  rationale: מִגְדָּנוֹת pode designar itens valiosos ou selecionados. “Objetos preciosos” se ajusta ao contexto de dádivas reais e evita restringir o sentido a iguarias.
- source_word: עִם עָרֵי מְצֻרוֹת בִּיהוּדָה
  choice: além de cidades fortificadas em Judá
  rationale: “Além de” comunica naturalmente que as cidades se somavam aos bens móveis; “em Judá” preserva a localização.
- source_word: וְאֶת הַמַּמְלָכָה נָתַן לִיהוֹרָם
  choice: Mas deu o reino a Jeorão
  rationale: Embora וְ seja formalmente aditivo, o contexto estabelece contraste entre os presentes dados aos demais filhos e o reino entregue a Jeorão. “Mas” torna essa relação discursiva explícita e natural.
- source_word: כִּי הוּא הַבְּכוֹר
  choice: porque ele era o primogênito
  rationale: “Porque” preserva a relação causal de כִּי, e “primogênito” mantém o estatuto familiar e sucessório de הַבְּכוֹר.
