lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים וּשְׁתַּיִם שָׁנָה
  choice: tinha trinta e dois anos
  rationale: A construção hebraica בֶּן + numeral + שָׁנָה é uma expressão idiomática de idade. Em português, a equivalência natural e exata é «tinha trinta e dois anos».
- source_word: יְהוֹרָם
  choice: Jeorão
  rationale: Forma tradicional e amplamente reconhecível em português para o nome hebraico יְהוֹרָם, preservando aqui a forma plena do nome.
- source_word: בְּמָלְכוֹ
  choice: quando se tornou rei
  rationale: A preposição בְּ com o infinitivo construto e sufixo pronominal indica a ocasião da ascensão ao trono. A formulação comunica esse valor temporal com clareza em português atual.
- source_word: וּשְׁמוֹנֶה שָׁנִים
  choice: oito anos
  rationale: Equivalência direta da expressão que indica a duração do reinado.
- source_word: מָלַךְ
  choice: reinou
  rationale: O verbo significa exercer a realeza ou reinar; «reinou» é a formulação portuguesa normal neste contexto régio.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: A preposição locativa e o topônimo indicam o lugar de onde Jeorão reinou.
