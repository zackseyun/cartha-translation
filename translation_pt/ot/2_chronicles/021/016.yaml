  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יָּ֨עַר יְהוָ֜ה עַל יְהוֹרָ֗ם אֵ֣ת ר֤וּחַ הַ/פְּלִשְׁתִּים֙ וְ/הָ֣/עַרְבִ֔ים אֲשֶׁ֖ר עַל יַ֥ד כּוּשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/016.yaml
  text: And Yahweh stirred up against Jehoram the spirit of the Philistines and of the Arabians who were near the Cushites[a][b][c].
translation:
  language: pt
  text: Então Yahweh suscitou[a] contra Jeorão o espírito[b] dos filisteus e dos árabes que estavam perto dos cuxitas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “despertou” ou “incitou”. O verbo hebraico atribui a Yahweh o ato de levar esses povos a se levantar em hostilidade contra Jeorão.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “espírito” pode indicar o impulso, a disposição ou a hostilidade que moveu esses povos.
    reason: lexical_ambiguity
  - marker: c
    text: Literalmente, “que estavam junto dos cuxitas”. A expressão hebraica geralmente indica proximidade; em outros contextos, também pode indicar estar sob a autoridade de alguém.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּעַר
  choice: despertou
  rationale: O verbo descreve Yahweh suscitando ou incitando uma ação hostil. “Despertou” preserva a imagem hebraica e expressa causalidade divina sem explicar além do texto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עַל יְהוֹרָם
  choice: contra Jeorão
  rationale: Neste contexto de hostilidade, עַל tem naturalmente o sentido de “contra”.
- source_word: רוּחַ
  choice: o espírito
  rationale: Mantém a amplitude e a imagem de רוּחַ, que aqui pode indicar o impulso, a disposição ou a hostilidade que move esses povos.
- source_word: הַפְּלִשְׁתִּים
  choice: os filisteus
  rationale: Forma étnica tradicional e clara em português.
- source_word: וְהָעַרְבִים
  choice: e dos árabes
  rationale: Forma corrente em português para o antigo grupo mencionado; a coordenação com “dos filisteus” deixa claro que o mesmo “espírito” pertence a ambos os povos.
- source_word: אֲשֶׁר עַל יַד כּוּשִׁים
  choice: que viviam perto dos cuxitas
  rationale: 'עַל יַד tem aqui, com maior probabilidade, sentido geográfico: “ao lado de, perto de”. O acréscimo idiomático de “viviam” torna a relação locativa natural em português sem alterar o sentido.'
theological_decisions:
- issue: Causalidade divina ao levantar povos hostis contra Jeorão
  choice: Yahweh despertou diretamente o espírito desses povos contra Jeorão.
  alternative: Yahweh apenas permitiu que uma hostilidade já existente se manifestasse.
  rationale: O verbo hebraico atribui diretamente a ação a Yahweh. A tradução mantém essa tensão teológica sem reduzi-la a mera permissão nem acrescentar uma explicação sobre o modo dessa atuação.
- issue: Sentido de רוּחַ
  choice: Preservar a expressão “o espírito” dos povos.
  alternative: Explicitar como “a hostilidade”, “a disposição” ou “o ânimo”.
  rationale: “Espírito” conserva a metáfora e a ambiguidade genuína do hebraico, enquanto uma paráfrase escolheria prematuramente apenas um aspecto do termo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem “despertou contra Jeorão o espírito” acompanha a ênfase e a estrutura do hebraico, permanecendo inteligível em português. “Cuxitas” conserva a designação histórica ligada a Cuxe.
