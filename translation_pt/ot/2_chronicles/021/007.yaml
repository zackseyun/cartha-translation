  text: וְ/לֹא אָבָ֣ה יְהוָ֗ה לְ/הַשְׁחִית֙ אֶת בֵּ֣ית דָּוִ֔יד לְמַ֣עַן הַ/בְּרִ֔ית אֲשֶׁ֥ר כָּרַ֖ת לְ/דָוִ֑יד וְ/כַ/אֲשֶׁ֣ר אָמַ֗ר לָ/תֵ֨ת ל֥/וֹ נִ֛יר וּ/לְ/בָנָ֖י/ו כָּל הַ/יָּמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/007.yaml
  text: Yet Yahweh was not willing to destroy the house of David[a], because of the covenant that he had made with David[c][b], and as he had said that he would give to him and to his sons a lamp for all days.
translation:
  language: pt
  text: Contudo, Yahweh não quis destruir a casa de Davi, por causa da aliança que havia feito com Davi e conforme havia dito que daria a ele e a seus filhos uma lâmpada por todos os dias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «por todos os dias»; a expressão também pode ser entendida como «para sempre». A «lâmpada» é provavelmente uma imagem da continuidade da linhagem ou do governo de Davi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא אָבָה
  choice: Contudo, ... não quis
  rationale: אָבָה expressa vontade ou consentimento. «Não quis» é natural em português e mantém o sentido volitivo; «Contudo» dá à conjunção o valor adversativo exigido pelo contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: לְהַשְׁחִית
  choice: destruir
  rationale: O hifil de שׁחת indica levar a casa davídica à destruição; «destruir» é claro e direto.
- source_word: בֵּית דָּוִיד
  choice: a casa de Davi
  rationale: Preserva o idioma dinástico e sua ressonância bíblica sem explicá-lo como «dinastia» no texto principal.
- source_word: לְמַעַן הַבְּרִית
  choice: por causa da aliança
  rationale: Expressa de modo natural a razão ou o fundamento indicado por לְמַעַן.
- source_word: כָּרַת ... לְדָוִיד
  choice: havia feito com Davi
  rationale: «Fazer uma aliança» é o equivalente idiomático português de «cortar uma aliança»; «com Davi» explicita naturalmente a relação pactual.
- source_word: וְכַאֲשֶׁר אָמַר
  choice: e conforme havia dito
  rationale: Mantém a referência à palavra divina anterior sem tornar «disse» mais interpretativamente explícito como «prometeu».
- source_word: לָתֵת לוֹ נִיר
  choice: daria a ele ... uma lâmpada
  rationale: «Lâmpada» preserva a metáfora régia de נִיר para a continuidade da linhagem ou do governo davídico.
- source_word: וּלְבָנָיו
  choice: e a seus filhos
  rationale: Traduz literalmente «seus filhos», sem ampliar no texto para «descendentes».
- source_word: כָּל הַיָּמִים
  choice: por todos os dias
  rationale: Mantém a formulação hebraica e sua possível força duradoura sem a resolver silenciosamente como «para sempre».
theological_decisions:
- issue: Metáfora dinástica de נִיר no contexto da aliança davídica
  choice: lâmpada
  alternative: luz; dinastia
  rationale: A metáfora bíblica é mantida para preservar a ressonância intertextual e a tensão teológica, sem substituí-la por uma interpretação explícita.
- issue: Alcance temporal de כָּל הַיָּמִים
  choice: por todos os dias
  alternative: para sempre; perpetuamente
  rationale: A tradução conserva a expressão hebraica, permitindo que o contexto comunique sua força, em vez de fixar no texto principal uma interpretação temporal mais forte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservam-se «casa de Davi», «lâmpada» e «por todos os dias» para manter os principais idiomas e ambiguidades do hebraico.
