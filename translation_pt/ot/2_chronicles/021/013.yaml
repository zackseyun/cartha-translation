source:
  edition: WLC
  text: וַ/תֵּ֗לֶךְ בְּ/דֶ֨רֶךְ֙ מַלְכֵ֣י יִשְׂרָאֵ֔ל וַ/תַּזְנֶ֤ה אֶת יְהוּדָה֙ וְ/אֶת יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם כְּ/הַזְנ֖וֹת בֵּ֣ית אַחְאָ֑ב וְ/גַ֨ם אֶת אַחֶ֧י/ךָ בֵית אָבִ֛י/ךָ הַ/טּוֹבִ֥ים מִמְּ/ךָ֖ הָרָֽגְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/013.yaml
  text: but you have walked in the way of the kings of Israel[a], and have led Judah and the inhabitants of Jerusalem into sexual immorality, as the house of Ahab led them into sexual immorality; and you have also killed your brothers of your father’s house[b], who were better than you.
translation:
  language: pt
  text: mas você seguiu o caminho dos reis de Israel e levou Judá e os habitantes de Jerusalém a se prostituírem[a], como a casa de Acabe os levou a se prostituírem[b]; além disso, matou seus irmãos da casa de seu pai, que eram melhores do que você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “fez Judá e os habitantes de Jerusalém se prostituírem”. Trata-se de uma metáfora profética para a infidelidade à aliança, muitas vezes manifestada na idolatria.
    reason: lexical_alternative
  - marker: b
    text: “A casa de Acabe” refere-se à dinastia governante de Acabe.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֵּלֶךְ בְּדֶרֶךְ
  choice: seguiu o caminho
  rationale: Reproduz de modo natural o idioma hebraico de adotar uma conduta ou padrão de vida, sem perder a metáfora do caminho.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: os reis de Israel
  rationale: Mantém a referência histórica direta e o contraste entre os reinos de Israel e Judá.
- source_word: וַתַּזְנֶה אֶת יְהוּדָה וְאֶת יֹשְׁבֵי יְרוּשָׁלַם
  choice: levou Judá e os habitantes de Jerusalém a se prostituírem
  rationale: Preserva a imagem forte e causativa de זנה, usada aqui metaforicamente para infidelidade à aliança, sobretudo por meio da idolatria.
- source_word: כְּהַזְנוֹת בֵּית אַחְאָב
  choice: como fez a casa de Acabe
  rationale: O verbo elíptico em português retoma com clareza a ação de levar o povo a se prostituir e evita repetição pesada, mantendo a comparação hebraica.
- source_word: בֵּית אַחְאָב
  choice: a casa de Acabe
  rationale: Conserva a expressão bíblica 'casa' para a família ou dinastia governante; a nota esclarece esse sentido.
- source_word: וְגַם
  choice: além disso
  rationale: Expressa a força aditiva e intensificadora da acusação.
- source_word: אַחֶיךָ בֵית אָבִיךָ
  choice: seus irmãos da casa de seu pai
  rationale: Identifica os irmãos como membros da família paterna e da casa real, preservando ambos os elementos do hebraico.
- source_word: הַטּוֹבִים מִמְּךָ
  choice: que eram melhores do que você
  rationale: Traduz diretamente o comparativo moral ou pessoal sem acrescentar uma qualificação ausente no texto.
- source_word: הָרָגְתָּ
  choice: matou
  rationale: Equivalente direto do verbo hebraico, evitando o mais interpretativo 'assassinou'.
theological_decisions:
- issue: Força metafórica de זנה no contexto de apostasia régia
  choice: Manter a imagem de prostituição no texto e explicar em nota sua referência profética à infidelidade à aliança, frequentemente manifestada na idolatria.
  alternative: Traduzir diretamente como 'levou à idolatria' ou 'levou à infidelidade'.
  rationale: A formulação escolhida conserva a linguagem deliberadamente forte e sexualizada do hebraico sem limitar o sentido apenas à idolatria nem induzir a leitura de imoralidade sexual literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi suavizada sem eliminar as metáforas hebraicas. O marcador [a] acompanha a metáfora de prostituição; o marcador [b] deve acompanhar 'casa de Acabe' no texto principal.
