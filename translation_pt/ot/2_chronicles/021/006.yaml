id: 2CH.21.6
reference: 2 Chronicles 21:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֵּ֜לֶךְ בְּ/דֶ֣רֶךְ מַלְכֵ֣י יִשְׂרָאֵ֗ל כַּ/אֲשֶׁ֤ר עָשׂוּ֙ בֵּ֣ית אַחְאָ֔ב כִּ֚י בַּת אַחְאָ֔ב הָ֥יְתָה לּ֖/וֹ אִשָּׁ֑ה וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/006.yaml
  text: He walked in the way of the kings of Israel, as the house of Ahab had done, for Ahab’s daughter was his wife; and he did what was evil in the eyes of Yahweh.
translation:
  language: pt
  text: Ele seguiu o caminho dos reis de Israel, como havia feito a casa de Acabe, pois a filha de Acabe era sua esposa; e fez o que era mau aos olhos de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: seguiu o caminho
  rationale: A combinação de הלך com בְּדֶרֶךְ descreve conduta. “Seguiu o caminho” conserva a metáfora hebraica e soa natural em português atual.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: dos reis de Israel
  rationale: Tradução direta da construção genitiva, referente aos governantes do reino do norte como modelo de conduta.
- source_word: כַּאֲשֶׁר עָשׂוּ בֵּית אַחְאָב
  choice: como havia feito a casa de Acabe
  rationale: O singular “havia feito” trata “casa” como sujeito coletivo, forma natural em português, e apresenta a conduta já estabelecida pela dinastia de Acabe.
- source_word: בֵּית אַחְאָב
  choice: a casa de Acabe
  rationale: “Casa” preserva a expressão hebraica e permite perceber tanto a família real quanto a dinastia, sem restringir indevidamente o sentido.
- source_word: כִּי
  choice: pois
  rationale: Introduz de modo claro e conciso a explicação da ligação do rei com a casa de Acabe.
- source_word: בַּת אַחְאָב
  choice: a filha de Acabe
  rationale: Mantém a designação relacional do próprio versículo, sem acrescentar o nome dela a partir de outro contexto.
- source_word: הָיְתָה לּוֹ אִשָּׁה
  choice: era sua esposa
  rationale: Expressa a relação matrimonial existente sem sugerir que o casamento começou naquele momento.
- source_word: וַיַּעַשׂ הָרַע
  choice: fez o que era mau
  rationale: Representa o objeto definido הָרַע e mantém a fórmula narrativa em português claro.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Preserva o conhecido idioma hebraico de avaliação moral e mantém o nome divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
- issue: Sentido de בֵּית אַחְאָב
  choice: casa de Acabe
  alternative: dinastia de Acabe; família de Acabe
  rationale: A formulação literal preserva a amplitude do hebraico, que em contexto real pode abranger família, corte e dinastia.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “seguiu o caminho” comunica naturalmente a metáfora moral hebraica; “casa de Acabe” conserva a formulação dinástica sem explicação intrusiva.
