  source_fidelity: O texto representa com precisão o hebraico. «Se rebelou contra o domínio de» comunica adequadamente o idiomatismo «de debaixo da mão de», isto é, a ruptura da sujeição política. «E permanece assim até hoje» expressa de modo natural a fórmula עד היום הזה, sem sugerir equivocadamente uma ação de rebeldia ininterrupta. O pronome hebraico em «debaixo da mão dele» refere-se contextualmente a Jeorão, como indica a tradução.
