source:
  edition: WLC
  text: וַ/יִּפְשַׁ֨ע אֱד֜וֹם מִ/תַּ֣חַת יַד יְהוּדָ֗ה עַ֚ד הַ/יּ֣וֹם הַ/זֶּ֔ה אָ֣ז תִּפְשַׁ֥ע לִבְנָ֛ה בָּ/עֵ֥ת הַ/הִ֖יא מִ/תַּ֣חַת יָד֑/וֹ כִּ֣י עָזַ֔ב אֶת יְהוָ֖ה אֱלֹהֵ֥י אֲבֹתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/010.yaml
  text: So Edom rebelled from under the hand of Judah to this day[a]. At that time Libnah also rebelled from under his hand, because he had forsaken Yahweh[c][b], the God of his fathers.
translation:
  language: pt
  text: Assim, Edom se rebelou contra o domínio de Judá e permanece assim até hoje[a]. Naquele tempo, Libna também se rebelou contra o domínio de Jeorão[b], porque ele havia abandonado Yahweh, o Deus de seus antepassados[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Edom se revoltou contra o domínio de Judá e continua independente até hoje».'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «de debaixo da mão de Judá» e «de debaixo da mão dele», expressões que indicam escapar do poder ou domínio de alguém. O pronome «dele» refere-se a Jeorão.'
    reason: cultural_note
  - marker: c
    text: A oração causal pode explicar especificamente a revolta de Libna ou, de modo mais amplo, as dificuldades e revoltas ocorridas durante o reinado de Jeorão.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּפְשַׁע / תִּפְשַׁע (פשע)
  choice: se rebelou
  rationale: Em contexto político, o verbo descreve revolta contra uma autoridade. «Rebelou-se» preserva essa força e é natural em português.
- source_word: מִתַּחַת יַד / מִתַּחַת יָדוֹ
  choice: contra o domínio de
  rationale: A expressão hebraica significa literalmente sair «de debaixo da mão» de alguém, isto é, livrar-se de seu poder ou controle. A tradução comunica o sentido político com clareza.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma portuguesa consagrada do nome do reino.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: e permanece assim até hoje
  rationale: A fórmula indica que a independência resultante da revolta continuava até o tempo do narrador. A explicitação evita que «se rebelou até hoje» pareça indicar uma ação contínua.
- source_word: אָז
  choice: Naquele tempo
  rationale: Marca o momento ligado à revolta de Edom e corresponde naturalmente ao valor temporal do hebraico.
- source_word: לִבְנָה
  choice: Libna
  rationale: Forma portuguesa corrente do topônimo bíblico.
- source_word: כִּי
  choice: porque
  rationale: Introduz uma explicação causal, sem determinar por si só se ela se refere apenas à revolta de Libna ou aos acontecimentos em geral.
- source_word: עָזַב
  choice: havia abandonado
  rationale: Expressa com naturalidade e seriedade o afastamento de Jeorão em relação a Yahweh, sem depender do registro mais arcaico de «desamparar».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: o Deus de seus antepassados
  rationale: Transmite em linguagem atual a referência aos antepassados de Jeorão e ao Deus que eles adoravam.
theological_decisions:
- issue: Alcance da explicação causal final
  choice: Manter a oração «porque ele havia abandonado Yahweh» em sua posição, sem definir explicitamente o alcance da causa.
  alternative: Entender a oração como explicação apenas da revolta de Libna, ou como interpretação geral das adversidades e revoltas sofridas por Jeorão.
  rationale: A proximidade sintática favorece uma ligação com Libna, enquanto o contexto teológico do Cronista permite um alcance mais amplo. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega «domínio» para comunicar o idioma político hebraico e «antepassados» como forma inclusiva e corrente. Os marcadores aparecem no texto junto aos elementos que explicam.
