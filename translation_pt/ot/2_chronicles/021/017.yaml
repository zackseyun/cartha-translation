base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/017.yaml
  text: They came up against Judah and invaded it[a], and carried away all the possessions found in the king’s house, and also his sons and his wives, so that no son was left to him except Jehoahaz, the youngest of his sons.
translation:
  language: pt
  text: Avançaram contra Judá e a invadiram, e levaram todos os bens encontrados no palácio do rei, bem como seus filhos e suas esposas. Assim, não lhe restou nenhum filho, a não ser Jeoacaz[a], o mais novo de seus filhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jeoacaz provavelmente é a mesma pessoa chamada Acazias em outras passagens (cf. 2 Reis 8:24–26; 2 Crônicas 22:1).
    reason: Identificação alternativa do nome com base em passagens paralelas.
lexical_decisions:
- source_word: וַיַּעֲלוּ בִיהוּדָה
  choice: Atacaram Judá
  rationale: O verbo עלה com ב, neste contexto militar, descreve uma investida hostil contra o território. “Atacaram” comunica naturalmente essa força sem acrescentar detalhes estratégicos.
- source_word: וַיִּבְקָעוּהָ
  choice: e a invadiram
  rationale: בקע significa abrir, romper ou penetrar à força. Tendo Judá como objeto, “a invadiram” expressa em português corrente a ruptura das defesas e a entrada hostil no território.
- source_word: וַיִּשְׁבּוּ
  choice: levaram
  rationale: שבה costuma indicar levar cativo. Como o verbo abrange tanto bens quanto membros da família real, “levaram” funciona naturalmente para ambos, enquanto o contexto deixa clara a ideia de saque e cativeiro.
- source_word: כָּל הָרְכוּשׁ
  choice: todos os bens
  rationale: רכוש designa bens, propriedade ou posses, especialmente patrimônio móvel. “Todos os bens” é claro, abrangente e idiomático.
- source_word: הַנִּמְצָא לְבֵית הַמֶּלֶךְ
  choice: encontrados no palácio do rei
  rationale: נמצא indica aquilo que estava presente ou foi encontrado. בית המלך, neste contexto, refere-se à residência real; “palácio do rei” evita que o leitor moderno entenda apenas uma casa comum.
- source_word: וְגַם בָּנָיו וְנָשָׁיו
  choice: bem como seus filhos e suas esposas
  rationale: גם acrescenta enfaticamente as pessoas aos bens já mencionados. “Bem como” preserva essa extensão da lista; “esposas” traduz נשיו de modo natural e preciso.
- source_word: וְלֹא נִשְׁאַר לוֹ בֵּן
  choice: Assim, não lhe restou nenhum filho
  rationale: O nifal de שאר expressa o que permaneceu. “Assim” comunica o resultado da ação anterior, e “não lhe restou nenhum filho” mantém a construção e o sentido do hebraico.
- source_word: כִּי אִם
  choice: a não ser
  rationale: A expressão introduz a única exceção. “A não ser” é corrente e preserva essa exclusividade.
- source_word: יְהוֹאָחָז
  choice: Jeoacaz
  rationale: A tradução mantém no texto principal o nome presente no Texto Massorético, usando sua forma portuguesa tradicional, sem harmonizá-lo silenciosamente com as passagens paralelas.
- source_word: קְטֹן בָּנָיו
  choice: o mais novo de seus filhos
  rationale: קטן, neste contexto familiar, indica o filho de menor idade. A formulação preserva a relação explícita com todos os seus filhos.
theological_decisions:
- issue: Forma do nome do filho sobrevivente de Jeorão
  choice: Manter “Jeoacaz”, conforme o Texto Massorético, no texto principal
  alternative: Identificá-lo no texto principal como “Acazias”, com base em 2 Reis 8:24–26 e 2 Crônicas 22:1
  rationale: A questão é textual e narrativa, não uma distinção doutrinária. A prioridade dada à fonte hebraica requer conservar “Jeoacaz” no texto, enquanto a provável identificação com Acazias é informada em nota para evitar harmonização silenciosa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação evita arcaísmos e conserva a sequência narrativa e a exceção enfática do hebraico. O marcador [a] foi colocado junto ao nome a que a nota efetivamente se refere.
