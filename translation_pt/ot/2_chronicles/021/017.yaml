  terminology: “Judá”, “palácio do rei”, “esposas”, “Jeoacaz” e “Acazias” são formas adequadas. A manutenção de “Jeoacaz” no texto principal segue corretamente o Texto Massorético, com a identificação alternativa limitada à nota.
