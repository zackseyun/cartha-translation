  source_fidelity: 'O texto preserva adequadamente a sequência central do hebraico: avanço hostil contra Judá, invasão, tomada dos bens do palácio e dos membros da família real, e a única exceção de Jeoacaz. “Levaram” é suficientemente abrangente para os bens e para as pessoas, embora o contexto transmita a noção de levá-los cativos.'
