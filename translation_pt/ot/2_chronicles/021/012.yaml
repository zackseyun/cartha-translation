base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/012.yaml
  text: 'Then a letter came to him from Elijah the prophet[a], saying, “Thus says Yahweh, the God of David your father: Because you have not walked in the ways of Jehoshaphat your father or in the ways of Asa king of Judah,”'
translation:
  language: pt
  text: 'Então chegou a ele uma carta do profeta Elias, dizendo: “Assim diz Yahweh, o Deus de Davi, seu pai: Visto que você não andou nos caminhos de Josafá, seu pai, nem[a] nos caminhos de Asa, rei de Judá,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “e”. Depois de uma negação, o português costuma usar “nem”: “não... nem...”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֵלָיו מִכְתָּב
  choice: Então chegou a ele uma carta
  rationale: Preserva a sintaxe hebraica, na qual מִכְתָּב é o sujeito do verbo singular, e verte o waw narrativo naturalmente por “Então”.
- source_word: מֵאֵלִיָּהוּ הַנָּבִיא
  choice: do profeta Elias
  rationale: “Do profeta Elias” é uma formulação natural em português e conserva tanto o nome próprio quanto o título.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém a fórmula hebraica que introduz o discurso citado sem sobretraduzi-la.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: É a fórmula profética tradicional e clara em português, preservando seu caráter solene e declarativo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי דָּוִיד אָבִיךָ
  choice: o Deus de Davi, seu pai
  rationale: Segue de perto a ordem hebraica. “Pai” pode designar ancestral dinástico, embora Davi não fosse o pai imediato de Jeorão.
- source_word: תַּחַת אֲשֶׁר
  choice: Visto que
  rationale: Expressa com naturalidade a força causal da locução no contexto da acusação e do juízo subsequente.
- source_word: לֹא הָלַכְתָּ
  choice: você não andou
  rationale: Conserva a metáfora hebraica de andar como modo de viver ou agir; o pretérito perfeito é natural neste pronunciamento sobre a conduta do rei.
- source_word: בְּדַרְכֵי
  choice: nos caminhos de
  rationale: Preserva a imagem hebraica para conduta ou modo de vida em linguagem compreensível.
- source_word: יְהוֹשָׁפָט אָבִיךָ
  choice: Josafá, seu pai
  rationale: Emprega a forma portuguesa convencional do nome e mantém a identificação genealógica explícita.
- source_word: וּבְדַרְכֵי אָסָא מֶלֶךְ יְהוּדָה
  choice: nem nos caminhos de Asa, rei de Judá
  rationale: No âmbito de uma negação, “nem” comunica idiomaticamente que Jeorão não seguiu nenhum dos dois exemplos, enquanto uma nota registra o “e” formal do hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” preserva esse nome sem substituí-lo por um título.
- issue: Sentido de אָבִיךָ aplicado a Davi
  choice: seu pai
  alternative: seu antepassado
  rationale: A tradução mantém o termo genealógico do hebraico e sua tensão dinástica; aqui “pai” pode ter o sentido mais amplo de ancestral.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A pontuação conserva o caráter de frase incompleta do versículo, cuja declaração prossegue no versículo seguinte.
