id: 2CH.21.11
reference: 2 Chronicles 21:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: גַּם ה֥וּא עָשָֽׂה בָמ֖וֹת בְּ/הָרֵ֣י יְהוּדָ֑ה וַ/יֶּ֨זֶן֙ אֶת יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם וַ/יַּדַּ֖ח אֶת יְהוּדָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/011.yaml
  text: He also made high places in the hill country of Judah[a], led the inhabitants of Jerusalem into prostitution[b], and led Judah astray.
translation:
  language: pt
  text: Ele também fez lugares altos na região montanhosa de Judá, levou os habitantes de Jerusalém a se prostituírem[a] e desencaminhou Judá.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fez os habitantes de Jerusalém se prostituírem”. O hebraico emprega linguagem de infidelidade à aliança, que pode evocar tanto imoralidade sexual quanto apostasia religiosa.
    reason: lexical_alternative
  - marker: b
    text: Ou “levou Judá a se desviar” ou “afastou Judá do SENHOR”.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  choice: Ele também
  rationale: Preserva a força aditiva e enfática da expressão hebraica em português natural.
- source_word: עָשָׂה
  choice: fez
  rationale: Traduz diretamente o verbo comum עשה; no contexto, refere-se ao estabelecimento dos locais de culto.
- source_word: בָמוֹת
  choice: lugares altos
  rationale: Expressão tradicional e precisa para locais elevados de culto, frequentemente associados a práticas ilegítimas nos livros históricos.
- source_word: בְּהָרֵי יְהוּדָה
  choice: na região montanhosa de Judá
  rationale: הרים pode designar montes ou uma região serrana; esta formulação comunica com naturalidade o sentido geográfico regional.
- source_word: וַיֶּזֶן
  choice: levou ... a se prostituírem
  rationale: O hifil de זנה tem força causativa. A expressão retém a imagem forte de prostituição, que neste contexto pode representar infidelidade religiosa sem excluir ressonâncias de imoralidade sexual.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: os habitantes de Jerusalém
  rationale: Equivalência direta e idiomática para o particípio substantivado no construto.
- source_word: וַיַּדַּח
  choice: desencaminhou
  rationale: O hifil de נדח indica fazer desviar ou levar para longe da fidelidade devida. “Desencaminhou” conserva a causalidade sem inserir um complemento ausente no hebraico.
- source_word: אֶת יְהוּדָה
  choice: Judá
  rationale: Mantém o referente coletivo ao povo ou reino de Judá.
theological_decisions:
- issue: Sentido de prostituição em וַיֶּזֶן
  choice: 'Manter no texto a metáfora forte: “levou ... a se prostituírem”'
  alternative: “levou ... à infidelidade” ou “fez ... cometer imoralidade sexual”
  rationale: O contexto dos lugares altos favorece a infidelidade religiosa, mas a linguagem hebraica pode evocar tanto apostasia quanto imoralidade sexual. A tradução não elimina essa tensão.
- issue: Complemento implícito de וַיַּדַּח
  choice: Não explicitar “para longe do SENHOR” no texto principal
  alternative: “afastou Judá do SENHOR”
  rationale: Embora o contexto indique apostasia contra o SENHOR, esse complemento não aparece expressamente no versículo hebraico; “desencaminhou Judá” preserva a concisão e a ambiguidade do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Região montanhosa” evita um topografismo excessivamente literal; “lugares altos” conserva o termo histórico-religioso estabelecido. As duas notas preservam alternativas sem resolver indevidamente as ambiguidades do hebraico.
