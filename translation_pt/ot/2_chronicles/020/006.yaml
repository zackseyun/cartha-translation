source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר יְהוָ֞ה אֱלֹהֵ֤י אֲבֹתֵ֨י/נוּ֙ הֲ/לֹ֨א אַתָּֽה ה֤וּא אֱלֹהִים֙ בַּ/שָּׁמַ֔יִם וְ/אַתָּ֣ה מוֹשֵׁ֔ל בְּ/כֹ֖ל מַמְלְכ֣וֹת הַ/גּוֹיִ֑ם וּ/בְ/יָדְ/ךָ֙ כֹּ֣חַ וּ/גְבוּרָ֔ה וְ/אֵ֥ין עִמְּ/ךָ֖ לְ/הִתְיַצֵּֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/006.yaml
  text: and said[a], “O Yahweh, God of our fathers, are you not God in heaven? And do you not rule over all the kingdoms of the nations? In your hand are power and might[b], and there is none who can stand against you.”
translation:
  language: pt
  text: 'e disse: “Ó Yahweh, Deus de nossos pais[a], não és tu Deus nos céus? Tu governas sobre todos os reinos das nações. Em tua mão estão o poder e a força, e não há quem possa resistir a ti[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deus de nossos antepassados”. O hebraico diz literalmente “Deus de nossos pais”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “fazer frente a ti”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: e disse
  rationale: Dá continuidade à narrativa de modo natural; o sujeito permanece identificável pelo contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do Tetragrama, preservando seu caráter de nome próprio.
- source_word: אֱלֹהֵי אֲבֹתֵינוּ
  choice: Deus de nossos pais
  rationale: Preserva o masculino plural do hebraico e a expressão tradicional de vínculo histórico e pactual; “antepassados” é uma alternativa legítima.
- source_word: הֲלֹא אַתָּה הוּא אֱלֹהִים בַּשָּׁמַיִם
  choice: não és tu Deus nos céus?
  rationale: Mantém a pergunta retórica que espera resposta afirmativa e traduz de forma concisa a localização plural hebraica, idiomática em português bíblico.
- source_word: מוֹשֵׁל בְּכֹל מַמְלְכוֹת הַגּוֹיִם
  choice: governas sobre todos os reinos das nações
  rationale: O particípio expressa governo contínuo; “governar sobre” comunica com clareza a soberania exercida.
- source_word: וּבְיָדְךָ
  choice: Em tua mão
  rationale: Preserva a imagem hebraica da mão como esfera de autoridade e capacidade efetiva.
- source_word: כֹּחַ וּגְבוּרָה
  choice: o poder e a força
  rationale: Reproduz o par de termos que denota capacidade e vigor irresistível em linguagem portuguesa corrente e solene.
- source_word: וְאֵין עִמְּךָ לְהִתְיַצֵּב
  choice: não há quem possa resistir a ti
  rationale: Expressa o sentido contextual de colocar-se em oposição; a alternativa “fazer frente a ti” preserva mais diretamente a imagem de tomar posição.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pactual sem substituí-lo por um título.
- issue: Linguagem de parentesco em אֲבֹתֵינוּ
  choice: nossos pais
  alternative: nossos antepassados
  rationale: O substantivo hebraico está no masculino plural. A tradução principal preserva essa forma, enquanto a nota registra a alternativa inclusiva quanto às gerações anteriores.
- issue: Alcance da pergunta retórica iniciada por הֲלֹא
  choice: A pergunta é explicitada na primeira afirmação; as seguintes são apresentadas como declarações
  alternative: Tratar também o governo sobre os reinos como parte da pergunta retórica
  rationale: O hebraico traz uma única partícula interrogativa no início e depois coordena afirmações sobre o governo e o poder de Deus. A pontuação escolhida preserva essa estrutura sem excluir a possibilidade de alcance retórico mais amplo.
translation_notes:
  register: Português moderno, claro e solene, com formas de segunda pessoa do singular coerentes com a oração dirigida diretamente a Deus. A construção mantém as imagens hebraicas da mão e de tomar posição contra alguém, sem recorrer a linguagem excessivamente arcaica.
