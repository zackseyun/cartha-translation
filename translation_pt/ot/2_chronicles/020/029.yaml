  to: E o temor de Deus veio sobre todos os reinos das terras, quando ouviram que Yahweh havia lutado contra os inimigos de Israel.[a]
  rationale: A única alteração remove o demonstrativo interpretativo «daquelas», preservando o plural e a definição do hebraico sem acrescentar uma delimitação contextual ao texto traduzido. A nota e sua âncora permanecem corretas.
