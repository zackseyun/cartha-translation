source:
  edition: WLC
  text: וַ/יְהִי֙ פַּ֣חַד אֱלֹהִ֔ים עַ֖ל כָּל מַמְלְכ֣וֹת הָ/אֲרָצ֑וֹת בְּ/שָׁמְעָ֕/ם כִּ֚י נִלְחַ֣ם יְהוָ֔ה עִ֖ם אוֹיְבֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/029.yaml
  text: And the fear of God came upon all the kingdoms of the lands when they heard that Yahweh had fought against the enemies of Israel[a].
translation:
  language: pt
  text: E o temor de Deus veio sobre todos os reinos das terras, quando ouviram que Yahweh havia lutado contra os inimigos de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “terror vindo de Deus”. A expressão hebraica pode indicar temor associado à presença ou à ação de Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: O consecutivo narrativo de היה introduz o surgimento de um estado resultante; “veio sobre” expressa naturalmente, em português, o início desse temor.
- source_word: פַּחַד אֱלֹהִים
  choice: o temor de Deus
  rationale: 'Preserva a construção hebraica e sua ambiguidade: pode indicar temor diante de Deus ou terror provocado por sua ação evidente.'
- source_word: עַל
  choice: sobre
  rationale: Com “veio”, forma a expressão portuguesa natural “veio sobre”, correspondente ao temor que se apodera dos reinos.
- source_word: כָּל מַמְלְכוֹת הָאֲרָצוֹת
  choice: todos os reinos daquelas terras
  rationale: Mantém o plural “terras” e, pelo demonstrativo, comunica com naturalidade a referência contextual aos territórios circundantes, sem sugerir necessariamente o mundo inteiro.
- source_word: בְּשָׁמְעָם
  choice: quando ouviram
  rationale: A preposição com o infinitivo construto e o sufixo indica circunstância temporal; esta é a formulação corrente e clara em português.
- source_word: כִּי
  choice: que
  rationale: Depois de “ouviram”, introduz o conteúdo da notícia recebida.
- source_word: נִלְחַם
  choice: havia lutado
  rationale: O perfeito apresenta uma ação divina concluída e anterior ao momento em que os reinos tomaram conhecimento dela.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עִם
  choice: contra
  rationale: Com o verbo “lutar” e tendo por complemento os inimigos de Israel, a preposição marca a parte adversária.
- source_word: אוֹיְבֵי יִשְׂרָאֵל
  choice: os inimigos de Israel
  rationale: Reproduz com clareza e dignidade a cadeia construta hebraica.
theological_decisions:
- issue: Sentido de פַּחַד אֱלֹהִים
  choice: o temor de Deus
  alternative: terror vindo de Deus
  rationale: A tradução principal conserva a forma e a tensão do hebraico, enquanto a nota registra que o genitivo também pode indicar a origem divina do terror.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Daquelas terras” evita a rigidez de “das terras” e delimita contextualmente os reinos vizinhos. A ordem da frase acompanha o movimento narrativo do hebraico.
