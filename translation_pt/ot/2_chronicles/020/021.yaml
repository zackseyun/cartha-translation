  text: וַ/יִּוָּעַץ֙ אֶל הָ/עָ֔ם וַ/יַּעֲמֵ֤ד מְשֹֽׁרֲרִים֙ לַ/יהוָ֔ה וּֽ/מְהַֽלְלִ֖ים לְ/הַדְרַת קֹ֑דֶשׁ בְּ/צֵאת֙ לִ/פְנֵ֣י הֶֽ/חָל֔וּץ וְ/אֹֽמְרִים֙ הוֹד֣וּ לַ/יהוָ֔ה כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/021.yaml
  text: After consulting with the people[a], he appointed singers to Yahweh, who praised the splendor of holiness as they went out before the vanguard, saying, “Give thanks to Yahweh[c][b], for his steadfast love endures forever.”
translation:
  language: pt
  text: 'Depois de consultar o povo, ele designou cantores para Yahweh, que louvassem em santo esplendor[a], ao saírem diante da vanguarda[b], dizendo: “Deem graças a Yahweh, pois seu amor leal[c] dura para sempre.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na beleza da santidade”. A expressão hebraica também pode significar “em vestes sagradas” ou aludir ao esplendor próprio do que é santo.
    reason: lexical_alternative
  - marker: b
    text: Ou “diante das tropas de avanço” ou “diante dos que iam armados para a batalha”.
    reason: lexical_alternative
  - marker: c
    text: Ou “pois sua misericórdia dura para sempre”. O termo hebraico חֶסֶד inclui as ideias de amor constante, lealdade e misericórdia, muitas vezes no contexto de uma aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ אֶל הָעָם
  choice: Depois de consultar o povo
  rationale: O nifal de יעץ expressa a ideia de buscar conselho ou consultar. A formulação mantém a participação do povo e apresenta com naturalidade a sequência narrativa.
- source_word: וַיַּעֲמֵד מְשֹׁרֲרִים
  choice: ele designou cantores
  rationale: No hifil, עמד pode significar fazer ficar de pé, colocar, posicionar ou designar. Neste contexto de atribuição de uma função litúrgica, “designou” comunica melhor o ato administrativo; מְשֹׁרֲרִים refere-se especificamente a cantores.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: A preposição ל pode indicar que o canto é dirigido a Yahweh ou realizado em seu serviço. “Para Yahweh” preserva essa amplitude.
- source_word: וּמְהַלְלִים לְהַדְרַת קֹדֶשׁ
  choice: a fim de louvarem o esplendor da santidade
  rationale: O particípio מְהַלְלִים descreve a atividade dos cantores. A expressão לְהַדְרַת קֹדֶשׁ é mantida de modo transparente, sem decidir em definitivo entre “esplendor da santidade”, “beleza da santidade”, “esplendor santo” e uma possível referência a trajes sagrados.
- source_word: בְּצֵאת לִפְנֵי הֶחָלוּץ
  choice: Eles saíam à frente da tropa de vanguarda
  rationale: בְּ com o infinitivo construto indica ação simultânea. הֶחָלוּץ designa a força armada que segue adiante, isto é, a vanguarda, e não necessariamente o exército inteiro.
- source_word: הוֹדוּ לַיהוָה
  choice: Deem graças a Yahweh
  rationale: Em contexto de culto, o hifil de ידה significa agradecer ou louvar. A oração seguinte apresenta o motivo da gratidão, favorecendo “Deem graças”.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: pois seu amor leal dura para sempre
  rationale: חֶסֶד abrange amor constante, lealdade, bondade e misericórdia, frequentemente em contexto de compromisso ou aliança. “Amor leal” conserva essa densidade sem recorrer a linguagem arcaica; “dura” explicita naturalmente a cópula ausente no hebraico.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o nome da aliança יהוה. A transliteração “Yahweh” o distingue do título אֲדֹנָי e preserva sua função como nome próprio.
- issue: Sentido de חֶסֶד
  choice: amor leal
  alternative: misericórdia; amor constante; fidelidade da aliança
  rationale: A escolha evita reduzir חֶסֶד somente a misericórdia ou somente a fidelidade, preservando a combinação de amor, constância e lealdade relacional.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas naturais ao público brasileiro. “Tropa de vanguarda” esclarece um termo potencialmente menos comum sem diluir a imagem militar. A divisão em duas frases evita uma cadeia pesada de particípios e mantém clara a ação dos cantores.
