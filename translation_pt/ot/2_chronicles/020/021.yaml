  verdict: revise
  source_fidelity: A divisão do versículo em duas frases e a formulação «Eles saíam» enfraquecem a ligação sintática do particípio com os cantores e com a saída para diante da vanguarda. Mais importante, «louvarem o esplendor da santidade» toma לְהַדְרַת קֹדֶשׁ como objeto direto do louvor. No hebraico, a expressão descreve mais naturalmente a maneira ou o contexto do louvor («em santo esplendor»), embora possa aludir a vestes sagradas.
  naturalness: A revisão mantém português moderno e claro. «Ao saírem diante da vanguarda» preserva a simultaneidade indicada pelo infinitivo hebraico sem introduzir uma nova ação independente; «vanguarda» evita a redundância de «tropa de vanguarda».
  terminology: «Yahweh», «cantores», «Deem graças» e «amor leal» são adequados. «Santo esplendor» permite conservar a ambiguidade da expressão hebraica, explicada em nota.
  issues:
  - severity: medium
    issue: Objeto de «louvarem» em «louvarem o esplendor da santidade»
    rationale: A construção pode sugerir que o esplendor da santidade é aquilo que os cantores louvam. A frase hebraica לְהַדְרַת קֹדֶשׁ qualifica os que louvam e é tradicionalmente entendida como «em santo esplendor/beleza da santidade», com possível referência a vestes sagradas.
  - severity: low
    issue: «Eles saíam» como frase independente
    rationale: O hebraico apresenta a saída como circunstância da nomeação e do louvor. A frase separada torna a relação menos precisa e o imperfeito português pode soar habitual.
  - severity: low
    issue: «tropa de vanguarda»
    rationale: «Vanguarda» já designa a força que vai à frente; o acréscimo é redundante.
