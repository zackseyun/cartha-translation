base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/019.yaml
  text: Then the Levites[a], from the sons of the Kohathites and from the sons of the Korahites, stood up to praise Yahweh, the God of Israel, with a very loud voice.
translation:
  language: pt
  text: Então os levitas, dentre os descendentes dos coatitas e dos coraítas, levantaram-se para louvar a Yahweh, o Deus de Israel, em voz muito alta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em voz alta, muitíssimo”. O hebraico intensifica a altura da voz.'
    reason: Esclarece de modo fiel a força intensiva de לְמָעְלָה sem introduzir uma orientação espacial inadequada.
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: levantaram-se
  rationale: O qal consecutivo de קום descreve a ação concreta de se pôr de pé; “levantaram-se” é natural em português e preserva a ação pública.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: Designação tradicional e clara do grupo tribal e cultual, com o artigo definido preservado.
- source_word: מִן בְּנֵי הַקְּהָתִים וּמִן בְּנֵי הַקָּרְחִים
  choice: dentre os descendentes dos coatitas e dos coraítas
  rationale: A construção hebraica identifica grupos pertencentes às linhagens coatita e coraíta. “Dentre os descendentes” transmite naturalmente a procedência sem sugerir que todos os levitas presentes pertenciam necessariamente a esses clãs.
- source_word: לְהַלֵּל
  choice: para louvar
  rationale: O infinitivo expressa finalidade. “Louvar” mantém o sentido amplo do verbo הלל sem acrescentar que o louvor foi necessariamente cantado.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Preserva o nome divino יהוה como nome próprio, em conformidade com a evidência direta do texto hebraico.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta da construção hebraica, em aposição a “Yahweh”.
- source_word: בְּקוֹל גָּדוֹל לְמָעְלָה
  choice: em voz muito alta
  rationale: Comunica em português corrente a grande intensidade sonora do louvor. A possível nuance espacial de לְמָעְלָה é preservada em nota.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” representa o nome próprio e evita substituí-lo por um título, sem introduzir uma interpretação denominacional.
- issue: Natureza do louvor
  choice: louvar
  alternative: cantar louvores
  rationale: O verbo הלל indica louvor, mas este versículo não contém um verbo que especifique canto. A tradução evita acrescentar essa modalidade, embora o contexto possa envolver expressão musical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas tradicionais dos nomes de clãs (“coatitas”, “coraítas”). A sintaxe foi simplificada para fluência sem eliminar a procedência genealógica nem a intensidade do louvor.
