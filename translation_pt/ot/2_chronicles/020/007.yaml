  text: הֲ/לֹ֣א אַתָּ֣ה אֱלֹהֵ֗י/נוּ הוֹרַ֨שְׁתָּ֙ אֶת יֹשְׁבֵי֙ הָ/אָ֣רֶץ הַ/זֹּ֔את מִ/לִּ/פְנֵ֖י עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל וַֽ/תִּתְּנָ֗/הּ לְ/זֶ֛רַע אַבְרָהָ֥ם אֹֽהַבְ/ךָ֖ לְ/עוֹלָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/007.yaml
  text: Did you not[a], our God, drive out the inhabitants of this land before your people Israel and give it forever to the offspring of Abraham, your friend?
translation:
  language: pt
  text: 'Não foste tu, nosso Deus, que expulsaste os habitantes desta terra diante do teu povo Israel e a deste para sempre à descendência de Abraão, teu amigo[a]?


    [a] Ou, mais literalmente, “aquele que te ama”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “aquele que te ama”.
    reason: Registra o valor verbal literal do particípio אֹהַבְךָ, traduzido no texto por seu sentido relacional estabelecido.
lexical_decisions:
- source_word: הֲלֹא
  choice: Não foste tu ... que
  rationale: Introduz uma pergunta retórica que espera resposta afirmativa. Esta construção é natural em português e abrange os dois verbos coordenados.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Mantém o tratamento direto e a relação possessiva, sem acrescentar uma interjeição ausente do hebraico.
- source_word: הוֹרַשְׁתָּ
  choice: expulsaste
  rationale: O hifil de ירשׁ expressa fazer os habitantes perderem a posse e saírem da terra; “expulsaste” preserva esse sentido de conquista em linguagem corrente.
- source_word: יֹשְׁבֵי הָאָרֶץ הַזֹּאת
  choice: os habitantes desta terra
  rationale: Tradução direta e idiomática da expressão construta, referindo-se aos que moravam na terra.
- source_word: מִלִּפְנֵי
  choice: diante de
  rationale: Preserva a imagem hebraica de remover os habitantes da presença ou do avanço de Israel.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: teu povo Israel
  rationale: Mantém a designação pactual e o nome em aposição, com ordem natural em português.
- source_word: וַתִּתְּנָהּ
  choice: e a deste
  rationale: O pronome feminino retoma “terra”; o pretérito coordena a dádiva com a expulsão dentro da pergunta retórica.
- source_word: לְזֶרַע אַבְרָהָם
  choice: à descendência de Abraão
  rationale: “Descendência” preserva o caráter coletivo singular de זֶרַע e soa natural no português contemporâneo.
- source_word: אֹהַבְךָ
  choice: teu amigo
  rationale: Expressa de modo natural o epíteto relacional de Abraão conhecido no uso bíblico, enquanto a força verbal mais literal do particípio é registrada em nota.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Equivalente português claro e corrente para duração permanente no contexto da promessa.
theological_decisions:
- issue: O epíteto de Abraão אֹהַבְךָ
  choice: teu amigo
  alternative: aquele que te ama
  rationale: “Teu amigo” comunica o título relacional associado a Abraão em outras passagens bíblicas, mas o hebraico é formalmente um particípio ativo de אהב. A nota conserva essa forma verbal e evita ocultar a tensão entre título tradicional e sentido lexical.
translation_notes:
  register: Português moderno, claro e digno, com formas de segunda pessoa do singular coerentes com a oração dirigida diretamente a Deus. “Não foste tu ... que” reproduz com naturalidade a pergunta retórica; “descendência” mantém o coletivo sem o arcaísmo de “semente”.
