  text: וַ/תִּשְׁקֹ֖ט מַלְכ֣וּת יְהוֹשָׁפָ֑ט וַ/יָּ֧נַֽח ל֦/וֹ אֱלֹהָ֖י/ו מִ/סָּבִֽיב׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/030.yaml
  text: So the kingdom of Jehoshaphat was at peace[a], and his God gave him rest all around.
translation:
  language: pt
  text: Assim, o reino de Josafá ficou em paz[a], e o seu Deus lhe deu descanso por todos os lados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ficou tranquilo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁקֹט
  choice: ficou em paz
  rationale: O verbo שׁקט indica estar tranquilo, sem perturbação ou em paz. Com “reino” como sujeito, “ficou em paz” é natural em português e expressa adequadamente a situação resultante.
- source_word: מַלְכוּת
  choice: reino
  rationale: Neste contexto histórico, o substantivo designa o reino ou domínio governado por Josafá; “reino” é a opção corrente e precisa.
- source_word: יְהוֹשָׁפָט
  choice: Josafá
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַיָּנַח
  choice: lhe deu descanso
  rationale: A forma causativa de נוח indica que Deus fez Josafá descansar ou desfrutar repouso. “Deu descanso” preserva essa agência divina em linguagem natural.
- source_word: אֱלֹהָיו
  choice: o seu Deus
  rationale: A forma significa “seu Deus”, referindo-se ao Deus de Josafá. O artigo torna a expressão idiomática em português sem alterar o sentido.
- source_word: מִסָּבִיב
  choice: por todos os lados
  rationale: A expressão indica descanso diante das ameaças circundantes, em todas as direções. “Por todos os lados” conserva o alcance espacial total e soa natural.
- source_word: וַ
  choice: e
  rationale: A coordenação hebraica é mantida diretamente. Embora a segunda oração possa explicar a primeira, “e” evita tornar explícita uma relação causal que permanece implícita no texto.
theological_decisions:
- issue: Agência divina na paz do reino
  choice: 'Manter as duas orações coordenadas: “e o seu Deus lhe deu descanso por todos os lados”.'
  alternative: 'Explicitar a causalidade: “pois o seu Deus lhe deu descanso por todos os lados”.'
  rationale: O texto atribui claramente o descanso a Deus, mas usa coordenação. A tradução preserva tanto a agência divina quanto a relação sintática aberta, sem impor uma conexão causal explícita.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Josafá” segue a forma bíblica portuguesa consagrada; “por todos os lados” comunica de modo idiomático a segurança diante de ameaças ao redor.
