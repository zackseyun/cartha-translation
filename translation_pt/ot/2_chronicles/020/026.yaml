  text: וּ/בַ/יּ֣וֹם הָ/רְבִעִ֗י נִקְהֲלוּ֙ לְ/עֵ֣מֶק בְּרָכָ֔ה כִּי שָׁ֖ם בֵּרֲכ֣וּ אֶת יְהוָ֑ה עַל כֵּ֡ן קָֽרְא֞וּ אֶת שֵׁ֨ם הַ/מָּק֥וֹם הַ/ה֛וּא עֵ֥מֶק בְּרָכָ֖ה עַד הַ/יּֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/026.yaml
  text: On the fourth day they assembled in the Valley of Beracah[a], because there they blessed Yahweh. Therefore they called the name of that place the Valley of Beracah to this day.
translation:
  language: pt
  text: No quarto dia, reuniram-se no vale de Beraca[a], pois ali bendisseram Yahweh. Por isso, deram àquele lugar o nome de vale de Beraca, nome que ele tem até hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beraca significa “bênção”.
    reason: A nota esclarece o significado do nome hebraico e torna perceptível o jogo de palavras com “bendisseram”.
lexical_decisions:
- source_word: נִקְהֲלוּ
  choice: reuniram-se
  rationale: O nifal de קהל indica que o povo se reuniu. A forma pronominal é natural em português e preserva o sentido intransitivo/reflexivo.
- source_word: עֵמֶק
  choice: vale
  rationale: O substantivo designa um vale e integra aqui o nome do lugar.
- source_word: בְּרָכָה
  choice: Beraca
  rationale: No nome geográfico עֵמֶק בְּרָכָה, o termo é transliterado como nome próprio. Seu significado, “bênção”, é explicado em nota para preservar o jogo de palavras com בֵּרֲכוּ.
- source_word: כִּי שָׁם בֵּרֲכוּ אֶת יְהוָה
  choice: pois ali bendisseram Yahweh
  rationale: כִּי apresenta a razão do nome dado ao lugar. “Bendisseram” conserva tanto o sentido de louvar ou abençoar a Deus quanto a ligação lexical com בְּרָכָה.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino é transliterado, em vez de ser substituído por um título.
- source_word: קָרְאוּ אֶת שֵׁם הַמָּקוֹם הַהוּא
  choice: deram àquele lugar o nome de
  rationale: Esta formulação portuguesa comunica naturalmente o idioma hebraico “chamaram o nome daquele lugar”, preservando o ato explícito de nomear.
- source_word: עַד הַיּוֹם
  choice: nome que ele tem até hoje
  rationale: A expressão indica que o nome continuava em uso no tempo do narrador. A leve explicitação evita uma ligação sintática pouco natural em português.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé
  rationale: “Yahweh” preserva de modo transparente a transliteração acadêmica do Tetragrama e evita substituí-lo pelo título “SENHOR”. “Javé” é uma forma portuguesa tradicional possível, mas representa de maneira menos direta a transliteração adotada no projeto.
- issue: Sentido de בֵּרֲכוּ quando Yahweh é o objeto
  choice: bendisseram
  alternative: louvaram
  rationale: “Bendisseram” mantém a linguagem bíblica natural e o vínculo lexical com “bênção”, sem reduzir o verbo apenas à ideia de louvor.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe foi suavizada sem eliminar a fórmula de nomeação nem o jogo lexical do hebraico.
