  terminology: “Yahweh” corresponde ao Tetragrama conforme a diretriz. “Pequeninos” comunica bem טַפָּם. “Filhos”, com nota, preserva a ambiguidade lexical de בְנֵיהֶם entre “filhos homens” e “filhos” em sentido mais amplo.
