  text: וְ/כָ֨ל יְהוּדָ֔ה עֹמְדִ֖ים לִ/פְנֵ֣י יְהוָ֑ה גַּם טַפָּ֖/ם נְשֵׁי/הֶ֥ם וּ/בְנֵי/הֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/013.yaml
  text: And all Judah was standing before Yahweh[a], even their little ones, their wives, and their children.
translation:
  language: pt
  text: E todo o povo de Judá estava de pé diante de Yahweh, até mesmo seus pequeninos, suas esposas e seus filhos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico pode referir-se especificamente aos filhos homens ou, em sentido mais amplo, aos filhos de ambos os sexos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל יְהוּדָה
  choice: E todo o povo de Judá
  rationale: A conjunção liga o versículo à narrativa anterior, e כָל expressa a totalidade. A explicitação de “povo” comunica naturalmente em português o sentido coletivo do nome Judá neste contexto.
- source_word: עֹמְדִים
  choice: estava em pé
  rationale: O particípio descreve uma postura contínua. Com o sujeito coletivo “todo o povo”, o singular “estava” é natural e preserva esse valor durativo.
- source_word: לִפְנֵי
  choice: diante de
  rationale: A expressão indica estar na presença de alguém; “diante de” mantém a concisão e a solenidade do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: גַּם
  choice: incluindo
  rationale: Neste contexto, גַּם enfatiza que os demais membros das famílias também estavam presentes. “Incluindo” expressa com clareza a abrangência da assembleia.
- source_word: טַפָּם
  choice: seus pequeninos
  rationale: טַף designa as crianças pequenas e dependentes das famílias. “Pequeninos” é natural, abrangente e não limita indevidamente o termo a bebês.
- source_word: נְשֵׁיהֶם
  choice: suas mulheres
  rationale: Na enumeração familiar, o termo provavelmente se refere às esposas; “suas mulheres” conserva, porém, a forma lexical do hebraico sem eliminar essa nuance contextual.
- source_word: וּבְנֵיהֶם
  choice: e seus filhos[a]
  rationale: בנים pode designar especificamente os filhos homens ou, de modo mais amplo, os filhos de ambos os sexos. “Filhos” preserva em português parte dessa mesma amplitude, explicitada na nota.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico apresenta diretamente o Tetragrama. “Yahweh” conserva o nome próprio e evita substituí-lo por um título.
- issue: Alcance de בְנֵיהֶם na enumeração familiar
  choice: seus filhos
  alternative: seus filhos homens; suas crianças
  rationale: O substantivo pode ter sentido masculino específico ou coletivo. “Filhos” mantém essa tensão lexical natural em português, e a nota registra explicitamente as possibilidades.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Todo o povo de Judá” torna explícito o valor coletivo do nome próprio; “estava em pé” preserva o aspecto contínuo do particípio. A enumeração familiar permanece concreta, sem ser reduzida a uma paráfrase genérica.
