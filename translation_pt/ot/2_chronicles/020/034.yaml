base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/034.yaml
  text: The rest of the acts of Jehoshaphat[a], the first and the last, behold, they are written in the records of Jehu son of Hanani[b], which are included in the Book of the Kings of Israel.
translation:
  language: pt
  text: Os demais atos de Josafá, tanto os primeiros como os últimos, estão escritos nos registros[a] de Jeú, filho de Hanani, que foram incluídos no Livro dos Reis de Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no relato de Jeú, filho de Hanani”. Em hebraico, literalmente, “nas palavras de Jeú, filho de Hanani”.'
    reason: lexical_alternative
  - marker: b
    text: 'A oração hebraica diz literalmente: “que ele fez subir sobre o Livro dos Reis de Israel”, provavelmente indicando que o registro de Jeú foi incorporado a essa fonte régia mais ampla.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹשָׁפָט
  choice: Os demais atos de Josafá
  rationale: Em fórmulas de conclusão régia, יֶתֶר indica o restante, e דִּבְרֵי abrange os feitos ou atos do rei, não apenas suas palavras.
- source_word: הָרִאשֹׁנִים וְהָאַחֲרֹנִים
  choice: tanto os primeiros como os últimos
  rationale: Mantém os dois termos do merismo hebraico, que abrange todo o reinado, com formulação natural em português.
- source_word: הִנָּם כְּתוּבִים
  choice: estão escritos
  rationale: Reproduz diretamente o particípio passivo de כתב. O pronome demonstrativo enfático הִנָּם não recebe um 'eis' isolado, que soaria artificial nesta fórmula historiográfica em português.
- source_word: בְּדִבְרֵי יֵהוּא בֶן חֲנָנִי
  choice: nos registros de Jeú, filho de Hanani
  rationale: Neste contexto, דִּבְרֵי designa uma fonte escrita. 'Registros' comunica isso sem impor o gênero técnico de 'anais'.
- source_word: אֲשֶׁר הֹעֲלָה עַל סֵפֶר מַלְכֵי יִשְׂרָאֵל
  choice: que foram incluídos no Livro dos Reis de Israel
  rationale: A expressão hebraica é sintaticamente difícil e literalmente fala em fazer subir os registros sobre o livro. A tradução expressa a provável relação documental sem ocultar a forma literal, apresentada em nota.
