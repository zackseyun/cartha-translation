  terminology: “Calamidade”, “juízo”, “peste”, “fome”, “casa”, “clamar” e “salvar” são escolhas adequadas. A fórmula “o teu nome está nesta casa” preserva corretamente a linguagem teológica hebraica sem a interpretar em excesso.
