source:
  edition: WLC
  text: אִם תָּב֨וֹא עָלֵ֜י/נוּ רָעָ֗ה חֶרֶב֮ שְׁפוֹט֮ וְ/דֶ֣בֶר וְ/רָעָב֒ נַֽעַמְדָ֞ה לִ/פְנֵ֨י הַ/בַּ֤יִת הַ/זֶּה֙ וּ/לְ/פָנֶ֔י/ךָ כִּ֥י שִׁמְ/ךָ֖ בַּ/בַּ֣יִת הַ/זֶּ֑ה וְ/נִזְעַ֥ק אֵלֶ֛י/ךָ מִ/צָּרָתֵ֖/נוּ וְ/תִשְׁמַ֥ע וְ/תוֹשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/009.yaml
  text: If disaster comes upon us—sword[a], judgment, pestilence, or famine—we will stand before this house and before you, for your name is in this house, and we will cry out to you from our distress, and you will hear and save.
translation:
  language: pt
  text: Se vier sobre nós alguma calamidade — espada, juízo, peste ou fome —, nos apresentaremos diante desta casa e diante de ti, pois o teu nome está nesta casa.[a] Clamaremos a ti em nossa aflição, e tu nos ouvirás e salvarás.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “esta casa leva o teu nome”.'
    reason: Alternativa idiomática para a expressão hebraica “o teu nome está nesta casa”, sem reduzir seu alcance teológico.
lexical_decisions:
- source_word: רָעָה
  choice: calamidade
  rationale: Neste contexto, designa uma desgraça que sobrevém ao povo, não o mal moral. “Calamidade” introduz naturalmente a enumeração que segue.
- source_word: חֶרֶב שְׁפוֹט
  choice: espada de juízo
  rationale: A construção hebraica é incomum. “Espada de juízo” conserva a ligação estreita entre os termos e expressa a espada como instrumento de julgamento, sem eliminar em nota a possibilidade de lê-los como itens distintos.
- source_word: דֶבֶר
  choice: peste
  rationale: Designa uma epidemia devastadora e é corrente em português nos contextos de maldições da aliança.
- source_word: רָעָב
  choice: fome
  rationale: No contexto, refere-se à fome coletiva causada pela escassez; “fome” é a forma natural e consagrada em português.
- source_word: נַעַמְדָה
  choice: ficaremos de pé
  rationale: O coortativo assume força futura no período condicional e descreve a resposta resoluta do povo.
- source_word: לִפְנֵי הַבַּיִת הַזֶּה
  choice: diante desta casa
  rationale: Mantém o termo hebraico “casa” e a linguagem de comparecer diante do santuário, sem substituir explicitamente por “templo”.
- source_word: וּלְפָנֶיךָ
  choice: e diante de ti
  rationale: 'Preserva o paralelismo: estar diante da casa é também comparecer diante do próprio Deus.'
- source_word: כִּי שִׁמְךָ בַּבַּיִת הַזֶּה
  choice: pois o teu nome está nesta casa
  rationale: Retém a formulação teológica hebraica e sua amplitude, sem reduzi-la apenas a posse, dedicação ou presença.
- source_word: וְנִזְעַק אֵלֶיךָ
  choice: Clamaremos a ti
  rationale: “Clamar” comunica uma súplica urgente dirigida a Deus.
- source_word: מִצָּרָתֵנוּ
  choice: em meio à nossa aflição
  rationale: Expressa a circunstância da qual surge o clamor em português natural, preservando a situação de angústia.
- source_word: וְתִשְׁמַע וְתוֹשִׁיעַ
  choice: e tu nos ouvirás e salvarás
  rationale: Mantém distintos os dois verbos e torna explícitos em português os objetos naturalmente subentendidos no hebraico.
theological_decisions:
- issue: Teologia do nome divino associada ao templo
  choice: Manter no texto “o teu nome está nesta casa”.
  alternative: “Esta casa leva o teu nome” ou “o teu nome está sobre esta casa”.
  rationale: A expressão hebraica pode abranger presença, posse e reivindicação pactual. A formulação principal conserva essa tensão, e a nota registra alternativas idiomáticas sem impor uma explicação única.
- issue: Relação entre “espada” e “juízo”
  choice: Ler a expressão como “espada de juízo”.
  alternative: 'Ler como uma enumeração: “espada, juízo, peste ou fome”.'
  rationale: A sequência hebraica é difícil e admite mais de uma análise. A leitura principal forma uma expressão coerente no contexto de calamidades punitivas, enquanto a nota preserva a leitura em aposição adotada por parte da tradição textual e tradutória.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Conserva “casa” e a fórmula “o teu nome está nesta casa” por sua importância literária e teológica; usa “peste”, “aflição” e “clamar” como vocabulário bíblico ainda corrente, sem arcaísmo excessivo.
