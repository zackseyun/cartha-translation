  text: וַ/יָּבֹ֨אוּ֙ יְר֣וּשָׁלִַ֔ם בִּ/נְבָלִ֥ים וּ/בְ/כִנֹּר֖וֹת וּ/בַ/חֲצֹצְר֑וֹת אֶל בֵּ֖ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/028.yaml
  text: And they came to Jerusalem with harps and lyres and trumpets[b][a], to the house of Yahweh.
translation:
  language: pt
  text: Vieram a Jerusalém com harpas[a], liras e trombetas, para a casa de Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: alaúdes; não se conhece com certeza a forma exata do antigo instrumento designado por נְבָלִים.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: templo de Yahweh; literalmente, casa de Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Então chegaram
  rationale: O verbo בוא, com waw consecutivo, dá continuidade à narrativa e descreve a chegada ao destino. “Então chegaram” expressa essa sequência de modo natural em português.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalém
  rationale: Forma portuguesa consagrada do nome da cidade.
- source_word: בִּנְבָלִים
  choice: com harpas
  rationale: נֵבֶל designa um instrumento antigo de cordas, semelhante a uma harpa ou a um alaúde. “Harpas” é uma tradução convencional e legível; a incerteza é indicada em nota.
- source_word: וּבְכִנֹּרוֹת
  choice: liras
  rationale: כִּנּוֹר costuma designar a lira. O termo distinto evita confundi-lo com נֵבֶל.
- source_word: וּבַחֲצֹצְרוֹת
  choice: e trombetas
  rationale: חֲצֹצְרָה designa uma trombeta, frequentemente de uso cerimonial. O material do instrumento não é declarado neste versículo e, por isso, não foi acrescentado.
- source_word: אֶל בֵּית יְהוָה
  choice: à casa de Yahweh
  rationale: A expressão significa literalmente “à casa de Yahweh”. A reorganização da frase em português deixa claro que esse é o destino em Jerusalém, sem acrescentar outro verbo ao hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e distingue-o do título אֲדֹנָי.
- issue: Sentido de בֵּית יְהוָה
  choice: casa de Yahweh
  alternative: templo de Yahweh
  rationale: “Casa de Yahweh” conserva a imagem e a formulação do hebraico; “templo” explicita corretamente o referente, mas é uma interpretação lexical mais específica.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira. A ordem dos complementos foi levemente reorganizada para evitar uma construção truncada em português e mostrar que a casa de Yahweh é o destino da chegada em Jerusalém.
