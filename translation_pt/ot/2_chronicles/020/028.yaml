  to: Vieram a Jerusalém com harpas[a], liras e trombetas, para a casa de Yahweh[b].
  rationale: A revisão resolve a construção ambígua dos dois destinos, mantendo a sequência narrativa, os instrumentos distintos e a expressão literal «casa de Yahweh». «Para» expressa naturalmente em português a direção indicada por אֶל, sem converter a expressão em uma aposição nem acrescentar conteúdo interpretativo.
