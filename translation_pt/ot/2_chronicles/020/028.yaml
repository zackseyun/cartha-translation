    issue: Ambiguidade e falta de fluência na relação entre Jerusalém e a casa de Yahweh
    rationale: Em «Então chegaram a Jerusalém, à casa de Yahweh», os dois sintagmas preposicionados em sequência soam elípticos em português e podem sugerir que «a casa de Yahweh» apenas identifica Jerusalém. O hebraico apresenta Jerusalém como local da chegada e acrescenta a direção à casa de Yahweh. «Para a casa de Yahweh» conserva explicitamente essa direção.
  revised_text: Vieram a Jerusalém com harpas[a], liras e trombetas, para a casa de Yahweh[b].
