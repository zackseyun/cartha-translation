  text: וַ֠/יַּֽעַמְדוּ בְּנֵ֨י עַמּ֧וֹן וּ/מוֹאָ֛ב עַל יֹשְׁבֵ֥י הַר שֵׂעִ֖יר לְ/הַחֲרִ֣ים וּ/לְ/הַשְׁמִ֑יד וּ/כְ/כַלּוֹתָ/ם֙ בְּ/יוֹשְׁבֵ֣י שֵׂעִ֔יר עָזְר֥וּ אִישׁ בְּ/רֵעֵ֖/הוּ לְ/מַשְׁחִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/023.yaml
  text: Then the Ammonites and Moabites rose up against the inhabitants of Mount Seir to devote them to destruction and to wipe them out; and when they had finished with the inhabitants of Seir[a], they helped each other to destroy one another.
translation:
  language: pt
  text: Então os amonitas e os moabitas se levantaram contra os habitantes do monte Seir para consagrá-los à destruição[a] e exterminá-los. Depois de acabarem com os habitantes de Seir, ajudaram uns aos outros a se destruir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “colocá-los sob interdição”, isto é, destiná-los à destruição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: se levantaram contra
  rationale: Com עַל em contexto militar, עמד expressa ação hostil contra alguém; a formulação é natural em português e conserva a imagem verbal.
- source_word: בְּנֵי עַמּוֹן וּמוֹאָב
  choice: os amonitas e os moabitas
  rationale: Os gentílicos comunicam naturalmente os grupos étnicos indicados pelo hebraico.
- source_word: יֹשְׁבֵי הַר שֵׂעִיר
  choice: os habitantes do monte Seir
  rationale: Reproduz com clareza o particípio substantivado e o topônimo.
- source_word: לְהַחֲרִים
  choice: para consagrá-los à destruição
  rationale: Preserva a dimensão de colocar sob interdição e destinar à destruição, distinguindo o termo da simples ideia de matar.
- source_word: וּלְהַשְׁמִיד
  choice: e exterminá-los
  rationale: Mantém a intensificação e evita repetir 'destruição', com linguagem corrente e solene.
- source_word: וּכְכַלּוֹתָם
  choice: Depois de acabarem
  rationale: A construção com כ e infinitivo é temporal; 'depois de' explicita naturalmente a sequência narrativa sugerida pelo contexto.
- source_word: עָזְרוּ אִישׁ בְּרֵעֵהוּ
  choice: ajudaram uns aos outros
  rationale: Expressa em português idiomático o sentido distributivo e recíproco de 'cada um ao seu companheiro'.
- source_word: לְמַשְׁחִית
  choice: a se destruir
  rationale: O infinitivo indica o fim ou resultado da ajuda recíproca; o pronome explicita o objeto mútuo implícito no contexto.
theological_decisions:
- issue: Tradução da linguagem de חרם no contexto de guerra
  choice: consagrá-los à destruição
  alternative: colocá-los sob interdição; destruí-los completamente
  rationale: A escolha conserva o caráter cultual e solene do verbo, sem reduzir seu sentido a destruição comum nem adotar jargão pouco transparente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de 'habitantes de Seir' acompanha a estrutura hebraica, enquanto 'a se destruir' torna explícita a reciprocidade final indicada pelo contexto.
