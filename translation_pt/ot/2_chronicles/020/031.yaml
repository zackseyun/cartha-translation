base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/031.yaml
  text: And Jehoshaphat reigned over Judah. He was thirty-five years old when he began to reign, and he reigned twenty-five years in Jerusalem. And his mother’s name was Azubah daughter of Shilhi.
translation:
  language: pt
  text: Josafá reinou sobre Judá. Tinha trinta e cinco anos quando começou a reinar e reinou vinte e cinco anos em Jerusalém. O nome de sua mãe era Azuba, filha de Sili.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: O verbo מלך, na fórmula régia, indica o exercício do reinado; “reinou” é direto, natural e distingue esta declaração da expressão seguinte sobre o início do reinado.
- source_word: עַל יְהוּדָה
  choice: sobre Judá
  rationale: Com מלך, a preposição עַל assinala o território ou povo governado; “sobre Judá” preserva essa relação.
- source_word: בֶּן שְׁלֹשִׁים וְחָמֵשׁ שָׁנָה
  choice: Tinha trinta e cinco anos
  rationale: A fórmula hebraica literalmente diz “filho de trinta e cinco anos”, mas em português corrente a idade é expressa naturalmente com “tinha ... anos”.
- source_word: בְּמָלְכוֹ
  choice: quando começou a reinar
  rationale: A preposição בְּ com o infinitivo construto e sufixo situa a idade no momento da ascensão ao trono; esta formulação comunica com clareza o valor temporal.
- source_word: וְעֶשְׂרִים וְחָמֵשׁ שָׁנָה מָלַךְ
  choice: e reinou vinte e cinco anos
  rationale: A tradução mantém de modo conciso a duração do reinado indicada pelo hebraico.
- source_word: בִּירוּשָׁלִַם
  choice: em Jerusalém
  rationale: A expressão identifica Jerusalém como a sede do reinado e é vertida diretamente.
- source_word: וְשֵׁם אִמּוֹ
  choice: O nome de sua mãe era
  rationale: Preserva a fórmula nominal hebraica em ordem natural e digna no português.
- source_word: עֲזוּבָה
  choice: Azuba
  rationale: Adota a forma portuguesa tradicional e reconhecível do nome hebraico.
- source_word: בַּת שִׁלְחִי
  choice: filha de Sili
  rationale: בַּת expressa filiação; “Sili” é a forma portuguesa tradicional do nome שִׁלְחִי.
