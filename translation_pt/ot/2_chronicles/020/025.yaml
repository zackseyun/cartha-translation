  text: וַ/יָּבֹ֨א יְהוֹשָׁפָ֣ט וְ/עַמּ/וֹ֮ לָ/בֹ֣ז אֶת שְׁלָלָ/ם֒ וַ/יִּמְצְאוּ֩ בָ/הֶ֨ם לָ/רֹ֜ב וּ/רְכ֤וּשׁ וּ/פְגָרִים֙ וּ/כְלֵ֣י חֲמֻד֔וֹת וַ/יְנַצְּל֥וּ לָ/הֶ֖ם לְ/אֵ֣ין מַשָּׂ֑א וַ/יִּֽהְי֞וּ יָמִ֧ים שְׁלוֹשָׁ֛ה בֹּזְזִ֥ים אֶת הַ/שָּׁלָ֖ל כִּ֥י רַב הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/025.yaml
  text: Then Jehoshaphat and his people came to plunder their spoil[a], and they found among them in abundance goods, garments, and desirable articles; and they took for themselves more than they could carry. They were three days plundering the spoil, because it was so much.
translation:
  language: pt
  text: Então Josafá e seu povo foram saquear os despojos. Encontraram entre eles muitos bens, cadáveres[a] e objetos de valor; e tomaram para si mais do que podiam carregar. Passaram três dias saqueando os despojos, pois eram muitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico massorético diz “cadáveres”. Alguns testemunhos antigos e traduções refletem uma leitura como “vestes” ou omitem o termo, tornando mais regular a lista dos despojos.
    reason: textual_variant
lexical_decisions:
- source_word: לָבֹז אֶת שְׁלָלָם
  choice: saquear os despojos
  rationale: Expressa de modo natural a finalidade da ida e preserva o contexto de espólio tomado após a batalha.
- source_word: בָהֶם לָרֹב
  choice: entre eles muitos
  rationale: Entende בָהֶם como referência aos inimigos caídos e לָרֹב como indicação da grande quantidade do que foi encontrado.
- source_word: רְכוּשׁ
  choice: bens
  rationale: Termo amplo e corrente para propriedades ou posses móveis, apropriado à enumeração.
- source_word: פְגָרִים
  choice: cadáveres
  rationale: É o sentido direto do texto massorético no contexto de batalha; a leitura difícil é mantida no texto, sem ser silenciosamente substituída.
- source_word: כְלֵי חֲמֻדוֹת
  choice: objetos de valor
  rationale: Tradução natural e abrangente para artigos considerados preciosos ou desejáveis, sem restringi-los a vasos.
- source_word: וַיְנַצְּלוּ לָהֶם
  choice: tomaram para si
  rationale: Comunica claramente a apropriação do espólio em benefício próprio; evita uma formulação portuguesa excessivamente rígida, embora o verbo possa sugerir despojar ou arrancar.
- source_word: לְאֵין מַשָּׂא
  choice: mais do que podiam carregar
  rationale: Verte idiomaticamente a ideia de uma quantidade além da capacidade de transporte.
- source_word: וַיִּהְיוּ יָמִים שְׁלוֹשָׁה בֹּזְזִים
  choice: Passaram três dias saqueando
  rationale: Forma portuguesa corrente que preserva a duração e o caráter contínuo da ação.
- source_word: כִּי רַב הוּא
  choice: pois eram muitos
  rationale: O pronome hebraico retoma coletivamente os despojos; o plural em português concorda naturalmente com esse referente.
