  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַ֥ךְ הַ/בָּמ֖וֹת לֹא סָ֑רוּ וְ/ע֤וֹד הָ/עָם֙ לֹא הֵכִ֣ינוּ לְבָבָ֔/ם לֵ/אלֹהֵ֖י אֲבֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/033.yaml
  text: However[a], the high places were not removed, and the people still had not set their hearts toward the God of their fathers.
translation:
  language: pt
  text: Contudo, os lugares altos não foram removidos, e o povo ainda não havia disposto o coração para o Deus de seus antepassados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não havia preparado o coração para o Deus de seus antepassados”.'
    reason: Alternativa lexical para הֵכִינוּ לְבָבָם, que pode significar preparar, dispor ou firmar o coração.
lexical_decisions:
- source_word: אַךְ
  choice: Contudo
  rationale: Marca de modo natural a transição concessiva entre a avaliação positiva de Josafá e a deficiência que permanecia.
- source_word: הַבָּמוֹת
  choice: os lugares altos
  rationale: Mantém o termo histórico-religioso tradicional para locais elevados de culto, sem definir além do que o contexto afirma.
- source_word: לֹא סָרוּ
  choice: não foram removidos
  rationale: Embora o hebraico diga literalmente que não se afastaram, a formulação passiva comunica com naturalidade que esses locais continuaram existindo.
- source_word: וְעוֹד
  choice: ainda
  rationale: Expressa a continuidade de uma situação não resolvida.
- source_word: הָעָם
  choice: o povo
  rationale: Equivalente direto do substantivo coletivo referente à população.
- source_word: לֹא הֵכִינוּ לְבָבָם
  choice: não havia disposto o coração
  rationale: O hifil de כון com 'coração' pode indicar preparar, firmar ou orientar. 'Dispor o coração' preserva a intenção interior sem reduzi-la a mera emoção.
- source_word: לֵאלֹהֵי אֲבֹתֵיהֶם
  choice: para o Deus de seus antepassados
  rationale: A preposição ל indica orientação ou finalidade; 'para' combina naturalmente com 'dispor o coração'. 'Antepassados' é corrente e abrangente em português moderno.
theological_decisions:
- issue: Natureza da deficiência do povo
  choice: 'O versículo descreve uma devoção incompleta: a reforma externa não foi concluída, e a disposição interior do povo ainda não estava orientada para o Deus de seus antepassados.'
  alternative: O povo não havia preparado emocionalmente o coração para o culto, ou ainda não se firmara no culto exclusivo.
  rationale: A tradução conserva lado a lado a permanência dos lugares altos e a afirmação sobre o coração, sem restringir esta última a emoção nem impor uma formulação doutrinária posterior.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O singular coletivo 'o coração' acompanha o hebraico e soa natural com 'o povo'. O marcador [a] aparece no texto principal.
