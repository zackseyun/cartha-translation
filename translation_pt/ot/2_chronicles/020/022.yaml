source:
  edition: WLC
  text: וּ/בְ/עֵת֩ הֵחֵ֨לּוּ בְ/רִנָּ֜ה וּ/תְהִלָּ֗ה נָתַ֣ן יְהוָ֣ה מְ֠אָֽרְבִים עַל בְּנֵ֨י עַמּ֜וֹן מוֹאָ֧ב וְ/הַר שֵׂעִ֛יר הַ/בָּאִ֥ים לִֽ/יהוּדָ֖ה וַ/יִּנָּגֵֽפוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/022.yaml
  text: And at the time they began with singing and praise[a], Yahweh set ambushes against the Ammonites, Moab, and Mount Seir, who were coming against Judah[b], and they were struck down.
translation:
  language: pt
  text: E, no momento em que começaram a cantar e a louvar, Yahweh pôs emboscadas[a] contra os amonitas, os moabitas e os do monte Seir, que vinham contra Judá[b], e eles foram derrotados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pôs emboscadores” ou “homens de emboscada”. A forma hebraica pode designar pessoas postadas em emboscada, bem como emboscadas em sentido mais geral.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que vinham a Judá”. A preposição hebraica pode indicar direção; no contexto, porém, a aproximação é hostil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְעֵת הֵחֵלּוּ
  choice: E, no momento em que começaram
  rationale: Mantém a ligação narrativa e situa com clareza o início simultâneo das ações.
- source_word: בְרִנָּה וּתְהִלָּה
  choice: a cantar e a louvar
  rationale: Expressa de modo natural em português os substantivos hebraicos ligados ao canto ou clamor jubiloso e ao louvor, sem perder o contexto de adoração.
- source_word: נָתַן יְהוָה מְאָרְבִים
  choice: Yahweh pôs emboscadas
  rationale: O verbo נתן tem aqui o sentido contextual de pôr ou dispor; 'emboscadas' preserva sem especificação indevida a possível referência à ação de emboscar ou a pessoas emboscadas.
- source_word: בְּנֵי עַמּוֹן מוֹאָב וְהַר שֵׂעִיר
  choice: os amonitas, os moabitas e os do monte Seir
  rationale: Emprega designações naturais em português e evita tratar literalmente o monte como combatente, sem acrescentar uma identificação étnica mais específica que o hebraico.
- source_word: הַבָּאִים לִיהוּדָה
  choice: que vinham contra Judá
  rationale: Embora a preposição possa indicar simplesmente direção, o contexto militar torna natural explicitar o movimento hostil.
- source_word: וַיִּנָּגֵפוּ
  choice: e eles foram derrotados
  rationale: Conserva a voz passiva do nifal e comunica com clareza o resultado militar, sem afirmar necessariamente que todos foram mortos.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Translitera o nome divino presente no texto hebraico, distinguindo-o do título 'Senhor'.
- issue: Agente e natureza das emboscadas
  choice: Yahweh pôs emboscadas
  alternative: Yahweh pôs emboscadores
  rationale: Mantém a ação divina explicitamente afirmada no texto, mas não define se מְאָרְבִים designa pessoas escondidas ou emboscadas em sentido mais geral.
translation_notes:
  register: Português moderno, digno e acessível, com construção fluente para leitores brasileiros e compreensão internacional. A repetição dos artigos na enumeração favorece a clareza, e os marcadores de nota aparecem junto às expressões a que se referem.
