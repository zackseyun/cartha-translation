base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/016.yaml
  text: Tomorrow go down against them. Look[a], they are coming up by the ascent of Ziz, and you will find them at the end of the wadi, before the wilderness of Jeruel.
translation:
  language: pt
  text: 'Amanhã, desçam contra eles. Vejam: eles estão subindo pela subida de Ziz, e vocês os encontrarão no fim do vale[a], em frente ao deserto de Jeruel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido como “vale” também pode indicar uma ravina ou um curso de água sazonal.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָחָר
  choice: Amanhã
  rationale: Reproduz diretamente o advérbio temporal, sem acrescentar a ideia de manhã.
- source_word: רְדוּ עֲלֵיהֶם
  choice: desçam contra eles
  rationale: Preserva tanto o movimento descendente do imperativo plural quanto o sentido hostil de עַל no contexto militar.
- source_word: הִנָּם
  choice: Vejam
  rationale: Expressa de modo atual e natural a partícula que chama a atenção dos ouvintes; o plural concorda com os destinatários.
- source_word: עֹלִים
  choice: eles estão subindo
  rationale: O particípio indica movimento em curso ou iminente; esta formulação mantém o aspecto sem especificar indevidamente a perspectiva como 'vindo' ou 'indo'.
- source_word: בְּמַעֲלֵה הַצִּיץ
  choice: pela subida de Ziz
  rationale: Mantém o sentido topográfico de uma subida ou caminho ascendente e translitera o nome do lugar.
- source_word: וּמְצָאתֶם אֹתָם
  choice: e vocês os encontrarão
  rationale: Verte naturalmente a forma verbal de resultado ou futuro e deixa explícito o sujeito plural para clareza em português.
- source_word: בְּסוֹף הַנַּחַל
  choice: no fim do vale
  rationale: סוֹף indica a extremidade; נַחַל pode designar um vale, ravina ou curso sazonal. 'Vale' é claro e natural no texto principal, com as alternativas registradas em nota.
- source_word: פְּנֵי מִדְבַּר יְרוּאֵל
  choice: diante do deserto de Jeruel
  rationale: Preserva a relação espacial de 'em frente a' e traduz מִדְבָּר de forma corrente; aqui 'deserto' não precisa implicar dunas de areia.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas plurais explícitas de ampla compreensão. 'Desçam' conserva a direção topográfica, e 'subida de Ziz' mantém a linguagem geográfica do hebraico. O marcador [a] aparece após 'Vejam' para corresponder ao material fornecido, embora a nota explique o termo 'vale' mais adiante no versículo.
