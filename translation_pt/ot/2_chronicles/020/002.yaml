base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/002.yaml
  text: Then they came and reported to Jehoshaphat[a], saying, “A great multitude is coming against you from beyond the sea, from Aram; and behold, they are in Hazazon-tamar” (that is[b], En-gedi).
translation:
  language: pt
  text: 'Então vieram informar Josafá, dizendo: “Uma grande multidão está vindo contra você do outro lado do mar[a], de Arã[b]; e eis que eles estão em Hazazom-Tamar, isto é, En-Gedi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de além do mar”.
    reason: lexical_alternative
  - marker: b
    text: Arã é o nome geográfico hebraico muitas vezes traduzido como “Síria”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ וַיַּגִּידוּ
  choice: Então vieram informar
  rationale: Os dois verbos narrativos apresentam a ação seguinte e a comunicação formal de uma notícia urgente; a formulação é natural em português sem perder a sequência do hebraico.
- source_word: לִיהוֹשָׁפָט
  choice: Josafá
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém o marcador hebraico que introduz o discurso direto.
- source_word: בָּא
  choice: está vindo
  rationale: O perfeito hebraico, com sujeito coletivo e no contexto de ameaça iminente, descreve um movimento já em curso contra Josafá.
- source_word: הָמוֹן רָב
  choice: uma grande multidão
  rationale: Preserva a amplitude de הָמוֹן sem especificá-lo além do texto como um exército formal, embora o contexto seja militar.
- source_word: עָלֶיךָ
  choice: contra você
  rationale: No contexto de avanço hostil, traduz de modo idiomático o sentido adversativo da preposição.
- source_word: מֵעֵבֶר לַיָּם
  choice: do outro lado do mar
  rationale: Expressa de modo natural a relação espacial de procedência indicada pelo hebraico.
- source_word: מֵאֲרָם
  choice: de Arã
  rationale: Reproduz diretamente o topônimo hebraico, em vez de substituí-lo pela designação posterior Síria.
- source_word: וְהִנָּם
  choice: 'E veja: eles estão'
  rationale: Conserva a força dêitica e urgente de הִנֵּה em linguagem portuguesa atual.
- source_word: בְּחַצְצוֹן תָּמָר
  choice: em Hazazom-Tamar
  rationale: Mantém o topônimo por transliteração e traduz a preposição locativa.
- source_word: הִיא עֵין גֶּדִי
  choice: isto é, En-Gedi
  rationale: Comunica claramente que o segundo nome identifica ou explica o primeiro.
