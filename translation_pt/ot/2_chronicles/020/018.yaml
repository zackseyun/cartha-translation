  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּקֹּ֧ד יְהוֹשָׁפָ֛ט אַפַּ֖יִם אָ֑רְצָ/ה וְ/כָל יְהוּדָ֞ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִַ֗ם נָֽפְלוּ֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/הִֽשְׁתַּחֲוֺ֖ת לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/018.yaml
  text: Then Jehoshaphat bowed with his face to the ground[a], and all Judah and the inhabitants of Jerusalem fell down before Yahweh to worship Yahweh.
translation:
  language: pt
  text: Então Josafá se inclinou com o rosto em terra, e todo o Judá e os habitantes de Jerusalém caíram diante de Yahweh para adorar Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para se prostrar diante de Yahweh”.'
    reason: 'Alternativa lexical: לְהִשְׁתַּחֲוֺת pode destacar o ato físico de curvar-se ou prostrar-se, além do sentido mais amplo de adorar.'
lexical_decisions:
- source_word: וַיִּקֹּד
  choice: se inclinou
  rationale: O verbo קָדַד descreve curvar-se profundamente em reverência. “Se inclinou” preserva o gesto sem especificar, além do hebraico, que Josafá se ajoelhou.
- source_word: אַפַּיִם אָרְצָה
  choice: com o rosto em terra
  rationale: A expressão idiomática indica prostração com o rosto voltado para o chão. A formulação é clara, digna e corrente em português.
- source_word: וְכָל יְהוּדָה
  choice: todo o Judá
  rationale: “Judá” representa coletivamente o povo do reino. A tradução mantém essa metonímia do texto hebraico em vez de explicá-la no corpo do versículo.
- source_word: וְיֹשְׁבֵי יְרוּשָׁלִַם
  choice: os habitantes de Jerusalém
  rationale: O particípio substantivado designa os que moravam em Jerusalém; “habitantes” é exato e natural.
- source_word: נָפְלוּ לִפְנֵי יְהוָה
  choice: caíram diante de Yahweh
  rationale: A tradução conserva o verbo concreto נפל, “cair”, e deixa que a oração final explicite a finalidade reverente do gesto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino é transliterado, em vez de ser substituído por um título, e sua repetição no hebraico é preservada.
- source_word: לְהִשְׁתַּחֲוֺת
  choice: para adorar
  rationale: O hitpael de שׁחה pode indicar prostrar-se em reverência ou prestar culto. Como a queda física já foi descrita, “adorar” comunica naturalmente a finalidade, sem eliminar a alternativa lexical registrada em nota.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Mantém explicitamente o objeto da adoração e preserva a repetição enfática do nome divino.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: O texto traz diretamente o tetragrama. “Yahweh” preserva o nome pessoal e não o substitui pelo título tradicional “SENHOR”.
- issue: Sentido cultual de לְהִשְׁתַּחֲוֺת
  choice: para adorar
  alternative: para se prostrar
  rationale: No contexto, o gesto corporal é um ato de culto. A leitura principal expressa essa função, enquanto a nota preserva o sentido corporal possível do verbo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém a metonímia “todo o Judá”, a repetição de “Yahweh” e a sequência concreta dos gestos do hebraico.
