base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/024.yaml
  text: When Judah came to the lookout over the wilderness[a], they turned toward the multitude, and behold, there were corpses lying on the ground, and there was no survivor.
translation:
  language: pt
  text: Quando Judá chegou ao mirante voltado para o deserto, eles se voltaram para a multidão, e eis que havia cadáveres caídos por terra, e não havia nenhum sobrevivente.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וִיהוּדָה
  choice: Judá
  rationale: O nome próprio é usado coletivamente para o povo ou as forças de Judá; o pronome e o verbo no plural tornam esse sentido claro em português.
- source_word: בָּא
  choice: chegou
  rationale: O qal perfeito de בוא indica a chegada ao ponto de observação; “chegou” é natural na narrativa.
- source_word: עַל הַמִּצְפֶּה לַמִּדְבָּר
  choice: ao mirante voltado para o deserto
  rationale: מִצְפֶּה designa um ponto de observação, e לַמִּדְבָּר indica sua orientação para o deserto. “Mirante” comunica naturalmente a referência topográfica.
- source_word: וַיִּפְנוּ אֶל הֶהָמוֹן
  choice: eles se viraram para a multidão
  rationale: Preserva o sentido concreto de פנה, enquanto “multidão” mantém a amplitude de הָמוֹן sem explicitar além do texto que se trata do exército inimigo.
- source_word: וְהִנָּם
  choice: e viram que só havia
  rationale: A expressão deíctica introduz uma descoberta súbita. Em português corrente, “viram que” transmite o efeito contextual, e “só havia” antecipa naturalmente a cena de ausência total de sobreviventes.
- source_word: פְּגָרִים נֹפְלִים אַרְצָה
  choice: cadáveres caídos por terra
  rationale: 'Tradução próxima da construção hebraica: פְּגָרִים são cadáveres, e נֹפְלִים אַרְצָה descreve-os como caídos por terra.'
- source_word: וְאֵין פְּלֵיטָה
  choice: ninguém havia escapado
  rationale: Expressa de modo idiomático o sentido de ausência de qualquer fugitivo ou sobrevivente, sem restringir o termo apenas ao estado de estar vivo.
