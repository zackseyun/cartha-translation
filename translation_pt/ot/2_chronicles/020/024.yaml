revisions:
- from: Quando Judá chegou ao mirante voltado para o deserto, eles se viraram para a multidão e viram que só havia cadáveres caídos por terra; ninguém havia escapado.
  to: Quando Judá chegou ao mirante voltado para o deserto, eles se voltaram para a multidão, e eis que havia cadáveres caídos por terra, e não havia nenhum sobrevivente.
  rationale: A revisão elimina o verbo de percepção e a ênfase antecipada não expressos no original, restaurando a apresentação dêitica de וְהִנָּם por “e eis que”. Também torna a cláusula final mais próxima de וְאֵין פְּלֵיטָה, sem alterar o sentido da cena.
