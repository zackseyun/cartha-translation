  text: וְ/יַחֲזִיאֵ֡ל בֶּן זְכַרְיָ֡הוּ בֶּן בְּ֠נָיָה בֶּן יְעִיאֵ֧ל בֶּן מַתַּנְיָ֛ה הַ/לֵּוִ֖י מִן בְּנֵ֣י אָסָ֑ף הָיְתָ֤ה עָלָי/ו֙ ר֣וּחַ יְהוָ֔ה בְּ/ת֖וֹךְ הַ/קָּהָֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/014.yaml
  text: And Jahaziel son of Zechariah, son of Benaiah, son of Jeiel, son of Mattaniah, the Levite, from the sons of Asaph—the Spirit of Yahweh came upon him in the midst of the assembly.
translation:
  language: pt
  text: E o Espírito de Yahweh veio sobre Jaaziel, filho de Zacarias, filho de Benaías, filho de Jeiel, filho de Matanias, o levita, dos filhos de Asafe, no meio da assembleia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/יַחֲזִיאֵל
  choice: Então ... Jaaziel
  rationale: A conjunção hebraica liga este acontecimento ao contexto narrativo; “Então” expressa com naturalidade essa progressão em português. O nome é transliterado na forma portuguesa corrente.
- source_word: בֶּן זְכַרְיָהוּ בֶּן בְּנָיָה בֶּן יְעִיאֵל בֶּן מַתַּנְיָה
  choice: filho de Zacarias, filho de Benaías, filho de Jeiel, filho de Matanias
  rationale: Preserva-se a repetição genealógica explícita de בֶּן, sem reduzi-la à ideia geral de descendência.
- source_word: הַ/לֵּוִי
  choice: o levita
  rationale: O artigo definido hebraico é mantido na identificação apositiva de Jaaziel.
- source_word: מִן בְּנֵי אָסָף
  choice: dos filhos de Asafe
  rationale: A expressão indica pertencimento à linhagem ou corporação de Asafe. “Dos filhos de Asafe” é natural em português e mantém a designação coletiva do hebraico.
- source_word: הָיְתָה עָלָי/ו רוּחַ יְהוָה
  choice: o Espírito de Yahweh veio sobre Jaaziel
  rationale: A formulação comunica o valor eventivo da expressão hebraica, isto é, a vinda capacitadora do Espírito para a proclamação seguinte. A repetição do nome evita uma longa espera pelo referente do pronome em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O tetragrama é transliterado como nome próprio, em vez de ser substituído por um título.
- source_word: בְּ/תוֹךְ הַ/קָּהָל
  choice: no meio da assembleia
  rationale: Mantém tanto o sentido espacial de בְּתוֹךְ quanto o caráter público da reunião indicada por קָהָל.
theological_decisions:
- issue: Referência de רוּחַ יְהוָה
  choice: o Espírito de Yahweh
  alternative: o espírito de Yahweh
  rationale: No contexto, a expressão descreve a presença divina que capacita Jaaziel para falar profeticamente. A inicial maiúscula identifica o referente divino sem acrescentar uma explicação doutrinária ao texto.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: A tradução preserva o nome pessoal presente no texto hebraico, em vez de substituí-lo pelo título tradicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi levemente ajustada, colocando a vinda do Espírito antes da genealogia, para evitar que o sujeito e o predicado fiquem excessivamente separados; todos os dados e relações do hebraico foram preservados.
