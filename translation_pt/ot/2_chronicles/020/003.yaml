base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/003.yaml
  text: And Jehoshaphat was afraid[a], and set his face to seek Yahweh[b], and proclaimed a fast throughout all Judah.
translation:
  language: pt
  text: Josafá ficou com medo[a] e decidiu buscar Yahweh[b]; então proclamou um jejum em todo Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “teve medo”. A forma verbal hebraica, na sequência narrativa, pode destacar que o medo surgiu naquele momento.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “pôs o rosto para buscar Yahweh”, expressão que indica intenção deliberada ou firme resolução.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרָא
  choice: ficou com medo
  rationale: O verbo ירא expressa medo, e a forma narrativa pode indicar o surgimento desse estado. “Ficou com medo” é natural em português e mantém a reação emocional direta de Josafá.
- source_word: וַיִּתֵּן ... אֶת־פָּנָיו
  choice: decidiu
  rationale: Literalmente, a expressão diz que Josafá “pôs/dirigiu o rosto”. Em português corrente, “decidiu” comunica com clareza a intenção deliberada e firme indicada pelo idioma hebraico; a imagem literal é preservada em nota.
- source_word: לִדְרוֹשׁ
  choice: buscar
  rationale: דרש, tendo Deus como objeto, abrange voltar-se para ele em busca de ajuda, orientação ou resposta. “Buscar” preserva essa amplitude sem restringir o sentido a uma consulta formal.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: O tetragrama יהוה é representado pelo nome próprio “Yahweh”, preservando sua função como nome divino no texto hebraico.
- source_word: וַיִּקְרָא צוֹם
  choice: proclamou um jejum
  rationale: A construção designa o anúncio público e oficial de um jejum. “Proclamou um jejum” exprime adequadamente o caráter régio e coletivo da ação.
- source_word: עַל כָּל יְהוּדָה
  choice: em todo o Judá
  rationale: A preposição עַל indica aqui a abrangência da proclamação sobre todo Judá, seja o território, seja sua população. A formulação portuguesa é natural e preserva essa extensão.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama, tratado como nome próprio. “Yahweh” o representa sem substituí-lo por um título nem adotar a forma híbrida tradicional “Jeová”.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem narrativa foi preservada; “então” torna explícita apenas a progressão já marcada pelas formas verbais hebraicas. Os dois marcadores de nota aparecem no texto principal.
