  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּשְׁכִּ֣ימוּ בַ/בֹּ֔קֶר וַ/יֵּצְא֖וּ לְ/מִדְבַּ֣ר תְּק֑וֹעַ וּ/בְ/צֵאתָ֞/ם עָמַ֣ד יְהוֹשָׁפָ֗ט וַ/יֹּ֨אמֶר֙ שְׁמָע֗וּ/נִי יְהוּדָה֙ וְ/יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם הַאֲמִ֜ינוּ בַּ/יהוָ֤ה אֱלֹהֵי/כֶם֙ וְ/תֵ֣אָמֵ֔נוּ הַאֲמִ֥ינוּ בִ/נְבִיאָ֖י/ו וְ/הַצְלִֽיחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/020.yaml
  text: 'They rose early in the morning and went out to the wilderness of Tekoa[a]. As they were going out, Jehoshaphat stood and said, “Listen to me, Judah and inhabitants of Jerusalem: believe in Yahweh your God, and you will be established; believe in his prophets[c][b], and you will succeed.”'
translation:
  language: pt
  text: 'Levantaram-se cedo pela manhã e saíram para o deserto de Tecoa. Enquanto saíam, Josafá pôs-se de pé e disse: “Escutem-me, Judá e moradores de Jerusalém! Creiam em Yahweh[a], seu Deus, e permanecerão firmes[b]; creiam nos profetas dele[c] e tenham êxito.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Yahweh” representa o nome divino YHWH.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “confiem em Yahweh, seu Deus, e estarão seguros”. O hebraico faz um jogo de palavras com formas da raiz אמן: “creiam” e “permanecerão firmes”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “confiem nos profetas dele”. Repete-se o mesmo verbo hebraico usado anteriormente, para produzir efeito retórico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: Levantaram-se cedo pela manhã
  rationale: O hifil de שׁכם indica levantar-se ou partir cedo; a formulação conserva tanto a ação quanto a indicação temporal explícita.
- source_word: לְמִדְבַּר תְּקוֹעַ
  choice: para o deserto de Tecoa
  rationale: מִדְבָּר designa uma região erma ou pouco habitada, não necessariamente um deserto arenoso. “Deserto” é a forma bíblica corrente e inteligível em português.
- source_word: וּבְצֵאתָם
  choice: Enquanto saíam
  rationale: A preposição com o infinitivo construto e o sufixo forma uma oração temporal e pode apresentar a saída em andamento.
- source_word: עָמַד
  choice: pôs-se de pé
  rationale: Expressa naturalmente em português a ação narrativa de Josafá assumir posição para falar, sem acrescentar dramatização.
- source_word: שְׁמָעוּנִי
  choice: Escutem-me
  rationale: O imperativo de שמע com sufixo de primeira pessoa é um apelo direto à atenção; “Escutem-me” é atual e natural.
- source_word: יְהוּדָה וְיֹשְׁבֵי יְרוּשָׁלַם
  choice: Judá e moradores de Jerusalém
  rationale: “Judá” funciona como vocativo coletivo, e o particípio substantivado de ישׁב é adequadamente expresso por “moradores”.
- source_word: הַאֲמִינוּ בַּיהוָה אֱלֹהֵיכֶם
  choice: Creiam em Yahweh, seu Deus
  rationale: O hifil de אמן com ב expressa crer ou confiar em alguém. “Creiam em” mantém a repetição lexical do versículo.
- source_word: וְתֵאָמֵנוּ
  choice: e permanecerão firmes
  rationale: O nifal de אמן comunica ser estabelecido ou permanecer firme. A escolha preserva em português o sentido de estabilidade, embora não reproduza integralmente o jogo de palavras hebraico.
- source_word: הַאֲמִינוּ בִנְבִיאָיו
  choice: creiam nos profetas dele
  rationale: Repete-se o mesmo verbo אמן, agora com os profetas como objeto da confiança; “dele” deixa claro que são os profetas de Deus.
- source_word: וְהַצְלִיחוּ
  choice: e tenham êxito
  rationale: A forma massorética é um imperativo hifil plural de צלח. A tradução conserva essa forma verbal, sem convertê-la silenciosamente em promessa futura.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome pessoal YHWH. “Yahweh” o representa diretamente, enquanto “SENHOR” substitui o nome por um título.
- issue: Sentido de אמן na exortação
  choice: creiam ... permanecerão firmes ... creiam
  alternative: confiem ... estarão seguros ... confiem
  rationale: “Crer” e “confiar” são possíveis no contexto. A repetição de “creiam” conserva a recorrência retórica de אמן, e “permanecerão firmes” preserva o elemento de estabilidade presente na forma correlata תֵאָמֵנוּ, sem impor um conceito doutrinário posterior de fé salvífica.
- issue: Força verbal de וְהַצְלִיחוּ
  choice: e tenham êxito
  alternative: e terão êxito
  rationale: A vocalização massorética apresenta um imperativo, por isso o texto principal mantém a exortação. A leitura como resultado ou promessa é contextualmente possível, mas exigiria interpretar a coordenação além da forma verbal explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com vocabulário natural para leitores brasileiros. Mantiveram-se o vocativo coletivo “Judá”, a repetição retórica de “creiam” e a forma imperativa da última oração. A pontuação explicita o caráter solene da proclamação sem tornar a sintaxe arcaica.
