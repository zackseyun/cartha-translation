revisions:
- from: Vocês não precisarão lutar nesta batalha. Tomem suas posições, fiquem firmes e vejam a salvação que Yahweh lhes dará[a], ó Judá e Jerusalém. Não tenham medo nem fiquem desanimados. Amanhã, saiam ao encontro deles, pois Yahweh está com vocês[b].
  to: Vocês não precisarão lutar nesta batalha. Tomem suas posições, fiquem firmes e vejam o livramento de Yahweh em favor de vocês[a], ó Judá e Jerusalém. Não tenham medo nem fiquem desanimados. Amanhã, saiam ao encontro deles, e Yahweh está com vocês[b].
  rationale: A revisão restitui o sentido de יְשׁוּעַת יְהוָה עִמָּכֶם sem acrescentar o verbo futuro «dará». «Em favor de vocês» expressa de modo idiomático o valor contextual da expressão hebraica, e a nota registra uma alternativa mais formal e próxima da ordem original. A coordenação final foi preservada com «e», em vez de uma causalidade explicitada por «pois».
  reviewer_model: gpt-5.6-terra
