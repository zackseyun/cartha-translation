  text: לֹ֥א לָ/כֶ֖ם לְ/הִלָּחֵ֣ם בָּ/זֹ֑את הִתְיַצְּב֣וּ עִמְד֡וּ וּ/רְא֣וּ אֶת יְשׁוּעַת֩ יְהוָ֨ה עִמָּ/כֶ֜ם יְהוּדָ֣ה וִֽ/ירוּשָׁלִַ֗ם אַל תִּֽירְאוּ֙ וְ/אַל תֵּחַ֔תּוּ מָחָר֙ צְא֣וּ לִ/פְנֵי/הֶ֔ם וַ/יהוָ֖ה עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/017.yaml
  text: You will not need to fight in this battle[a]. Take your positions, stand still, and see the salvation of Yahweh with you, O Judah and Jerusalem. Do not fear or be dismayed. Tomorrow go out before them[b], and Yahweh is with you.
translation:
  language: pt
  text: Vocês não precisarão lutar nesta batalha. Tomem suas posições, fiquem firmes e vejam o livramento de Yahweh em favor de vocês[a], ó Judá e Jerusalém. Não tenham medo nem fiquem desanimados. Amanhã, saiam ao encontro deles, e Yahweh está com vocês[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a salvação de Yahweh com vocês”. O termo hebraico pode indicar o resgate numa batalha e também a salvação em sentido mais amplo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Yahweh estará com vocês”. A frase hebraica não traz verbo expresso e pode ser entendida como uma garantia presente ou futura.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא לָכֶם לְהִלָּחֵם בָּזֹאת
  choice: Vocês não precisarão lutar nesta batalha
  rationale: Expressa naturalmente a construção hebraica, literalmente “não cabe a vocês lutar nesta”, sem transformar a afirmação em mera proibição.
- source_word: הִתְיַצְּבוּ עִמְדוּ
  choice: Tomem suas posições, fiquem firmes
  rationale: 'Mantém os dois imperativos: primeiro posicionar-se, depois permanecer firme. Evita uma repetição pouco natural em português.'
- source_word: וּרְאוּ אֶת יְשׁוּעַת יְהוָה עִמָּכֶם
  choice: e vejam a salvação que Yahweh lhes dará
  rationale: No contexto, a expressão indica a ação salvadora de Yahweh em favor do povo. A formulação portuguesa torna inteligível a difícil sequência hebraica, preservando “salvação” e registrando em nota a leitura mais formal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יְהוּדָה וִירוּשָׁלִַם
  choice: ó Judá e Jerusalém
  rationale: O “ó” assinala que os nomes estão sendo diretamente interpelados e conserva o tom solene.
- source_word: אַל תִּירְאוּ וְאַל תֵּחַתּוּ
  choice: Não tenham medo nem fiquem desanimados
  rationale: Reproduz as duas proibições em linguagem portuguesa atual e digna; חתת descreve abatimento ou perda de ânimo.
- source_word: מָחָר צְאוּ לִפְנֵיהֶם
  choice: Amanhã, saiam ao encontro deles
  rationale: No cenário militar, לפני significa avançar para diante do inimigo ou enfrentá-lo. “Ao encontro deles” comunica isso sem afirmar que Judá deverá combater.
- source_word: וַיהוָה עִמָּכֶם
  choice: pois Yahweh está com vocês
  rationale: A oração hebraica não possui verbo expresso. O presente transmite a garantia da presença divina; a possível leitura futura é preservada em nota.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio divino. A transliteração preserva essa distinção sem substituí-lo por um título.
- issue: Sentido de יְשׁוּעַת יְהוָה
  choice: a salvação que Yahweh lhes dará
  alternative: o livramento de Yahweh com vocês
  rationale: “Salvação” conserva a amplitude lexical e teológica de יְשׁוּעָה, enquanto o contexto imediato é um resgate militar. A nota registra “livramento” e a estrutura mais formal.
- issue: Valor temporal de וַיהוָה עִמָּכֶם
  choice: Yahweh está com vocês
  alternative: Yahweh estará com vocês
  rationale: Como a oração hebraica é nominal e não marca explicitamente o tempo, o presente e o futuro são possíveis. O texto principal enfatiza a presença já vigente; a nota conserva a alternativa futura.
translation_notes:
  register: Português contemporâneo, solene e amplamente inteligível, com tratamento no plural por “vocês”. A tradução conserva os dois comandos sucessivos, o vocativo e a ambiguidade temporal da oração final por meio de nota.
