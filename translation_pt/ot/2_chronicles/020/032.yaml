  text: וַ/יֵּ֗לֶךְ בְּ/דֶ֛רֶךְ אָבִ֥י/ו אָסָ֖א וְ/לֹא סָ֣ר מִמֶּ֑/נָּה לַ/עֲשׂ֥וֹת הַ/יָּשָׁ֖ר בְּ/עֵינֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/032.yaml
  text: He walked in the way of his father Asa and did not turn aside from it, doing what was right in the eyes of Yahweh.
translation:
  language: pt
  text: Seguiu o caminho de Asa, seu pai, e não se desviou dele, fazendo o que era certo aos olhos de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: Seguiu o caminho
  rationale: A combinação de הלך com דרך descreve figuradamente a conduta ou o modo de vida. Em português, “seguiu o caminho” preserva a imagem hebraica com mais naturalidade do que “andou no caminho” neste contexto.
- source_word: אָבִיו אָסָא
  choice: de Asa, seu pai
  rationale: Identifica Asa como pai de Josafá e mantém a relação filial em ordem natural e clara em português.
- source_word: וְלֹא סָר מִמֶּנָּה
  choice: e não se desviou dele
  rationale: סור com מן significa desviar-se ou afastar-se. “Desviou dele” retoma “caminho” e conserva a metáfora do percurso moral.
- source_word: לַעֲשׂוֹת
  choice: fazendo
  rationale: O infinitivo com ל pode indicar a conduta resultante ou concomitante; o gerúndio liga naturalmente essa avaliação à frase anterior.
- source_word: הַיָּשָׁר
  choice: o que era certo
  rationale: O adjetivo substantivado יָשָׁר designa aquilo que é reto ou correto, especialmente em sentido moral. “O que era certo” é claro e idiomático.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Preserva a imagem do idioma hebraico de avaliação divina e translitera o nome próprio יְהוָה como “Yahweh”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama, nome pessoal do Deus de Israel. “Yahweh” o representa como nome próprio sem substituí-lo por um título; “Jeová” reflete uma forma híbrida posterior.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A formulação conserva a metáfora hebraica do caminho sem recorrer à construção menos natural “andou no caminho”.
