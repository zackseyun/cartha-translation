  text: וַ/יִּתְנַבֵּ֞א אֱלִיעֶ֤זֶר בֶּן דֹּדָוָ֨הוּ֙ מִ/מָּ֣רֵשָׁ֔ה עַל יְהוֹשָׁפָ֖ט לֵ/אמֹ֑ר כְּ/הִֽתְחַבֶּרְ/ךָ֣ עִם אֲחַזְיָ֗הוּ פָּרַ֤ץ יְהוָה֙ אֶֽת מַעֲשֶׂ֔י/ךָ וַ/יִּשָּׁבְר֣וּ אֳנִיּ֔וֹת וְ/לֹ֥א עָצְר֖וּ לָ/לֶ֥כֶת אֶל תַּרְשִֽׁישׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/037.yaml
  text: Then Eliezer son of Dodavahu[a], from Mareshah, prophesied against Jehoshaphat, saying, “Because you joined yourself with Ahaziah[b], Yahweh has broken your works.” So the ships were wrecked and were not able to go to Tarshish.
translation:
  language: pt
  text: 'Então Eliezer, filho de Dodaváhu, de Maressa, profetizou contra Josafá, dizendo: “Porque você se uniu a Acazias, Yahweh destruiu o seu empreendimento[a]”. Assim, os navios naufragaram e não puderam ir a Társis[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “as suas obras”. Neste contexto, refere-se ao projeto de construção de navios de Josafá.
    reason: lexical_alternative
  - marker: b
    text: Ou “não conseguiram ir” ou “foram impedidos de ir a Társis”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְנַבֵּא
  choice: profetizou
  rationale: O hitpael de נבא denota aqui fala profética; “profetizou” é natural e preserva o sentido formal.
- source_word: עַל
  choice: contra
  rationale: No contexto de uma declaração profética de juízo dirigida a Josafá, indica oposição ou repreensão, não apenas assunto.
- source_word: מִמָּרֵשָׁה
  choice: de Maressa
  rationale: A preposição מִן marca procedência; em português, “de Maressa” expressa naturalmente a origem.
- source_word: כְּהִתְחַבֶּרְךָ
  choice: Porque você se uniu a
  rationale: O hitpael de חבר expressa associar-se ou unir-se a alguém. A formulação conserva a nuance reflexiva sem especificar além do texto o caráter formal da aliança.
- source_word: פָּרַץ
  choice: destruiu
  rationale: Com מַעֲשֶׂיךָ como objeto, o verbo comunica arruinar ou fazer fracassar aquilo que foi realizado; “destruiu” é claro e vigoroso em português.
- source_word: מַעֲשֶׂיךָ
  choice: o seu empreendimento
  rationale: Embora o hebraico diga literalmente “suas obras”, o contexto aponta para o projeto naval de Josafá. “Empreendimento” transmite o referente contextual sem restringi-lo apenas aos navios.
- source_word: וַיִּשָּׁבְרוּ אֳנִיּוֹת
  choice: Assim, os navios naufragaram
  rationale: A forma passiva indica que os navios foram quebrados ou destroçados. “Naufragaram” é a expressão portuguesa natural para a perda das embarcações.
- source_word: וְלֹא עָצְרוּ לָלֶכֶת
  choice: e não puderam ir
  rationale: Nesta construção, עצר comunica incapacidade ou impedimento. A tradução preserva a ambiguidade entre falta de capacidade e impedimento resultante do naufrágio.
- source_word: תַּרְשִׁישׁ
  choice: Társis
  rationale: Forma tradicional e amplamente reconhecida em português para o topônimo hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
- issue: Natureza da associação de Josafá com Acazias
  choice: se uniu a
  alternative: fez aliança com
  rationale: O verbo sugere associação ou parceria, mas o texto não exige que se explicite uma aliança política formal; a tradução mantém essa abertura.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário compreensível internacionalmente. Mantêm-se os nomes próprios em formas portuguesas reconhecíveis, exceto Yahweh, transliterado como nome divino.
