  text: וְ/אַחֲרֵי כֵ֗ן אֶתְחַבַּר֙ יְהוֹשָׁפָ֣ט מֶֽלֶךְ יְהוּדָ֔ה עִ֖ם אֲחַזְיָ֣ה מֶֽלֶךְ יִשְׂרָאֵ֑ל ה֖וּא הִרְשִׁ֥יעַ לַ/עֲשֽׂוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/035.yaml
  text: After this[a], Jehoshaphat king of Judah allied himself with Ahaziah king of Israel[b], who acted wickedly in doing so.
translation:
  language: pt
  text: Depois disso, Josafá, rei de Judá, aliou-se a Acazias, rei de Israel, que agiu perversamente ao fazer isso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: «ele agiu perversamente ao fazer». O pronome «ele» refere-se mais naturalmente a Acazias, embora a construção hebraica também possa ser entendida como uma avaliação da associação de Josafá com ele.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַחֲרֵי כֵן
  choice: Depois disso
  rationale: Marca naturalmente a sequência temporal e preserva a ligação com os acontecimentos anteriores.
- source_word: אֶתְחַבַּר
  choice: aliou-se
  rationale: O hitpael de חבר indica associação ou aliança; «aliou-se» comunica com clareza o sentido político e relacional no contexto.
- source_word: יְהוֹשָׁפָט
  choice: Josafá
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: מֶלֶךְ יְהוּדָה
  choice: rei de Judá
  rationale: Tradução direta e idiomática do título régio.
- source_word: עִם אֲחַזְיָה מֶלֶךְ יִשְׂרָאֵל
  choice: a Acazias, rei de Israel
  rationale: «Aliar-se a» rege naturalmente a preposição «a» em português; a aposição conserva o título régio.
- source_word: הוּא
  choice: que
  rationale: O pronome independente introduz aqui uma caracterização; o relativo português liga a oração de modo natural ao antecedente mais próximo, Acazias.
- source_word: הִרְשִׁיעַ
  choice: agiu perversamente
  rationale: Preserva a avaliação moral forte do hifil de רשע em linguagem atual e digna.
- source_word: לַ/עֲשׂוֹת
  choice: ao fazer isso
  rationale: Expressa o infinitivo hebraico conciso sem especificar além do texto a ação ou empreendimento em vista.
theological_decisions:
- issue: Referente do pronome הוּא
  choice: A oração caracteriza Acazias como aquele que agiu perversamente.
  alternative: A oração pode ser entendida como juízo sobre a ação de Josafá ao associar-se ou sobre a própria aliança.
  rationale: Acazias é o antecedente mais próximo e o contexto o retrata negativamente. Como a construção hebraica permanece concisa e admite discussão, a nota registra a possível leitura alternativa.
translation_notes:
  register: Português moderno, claro e digno, com formas nominais bíblicas correntes no Brasil e compreensíveis internacionalmente. A formulação principal segue o antecedente sintático mais próximo, enquanto a nota preserva a concisão e a possível ambiguidade do hebraico.
