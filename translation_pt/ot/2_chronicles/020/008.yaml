  text: וַ/יֵּשְׁב֖וּ בָ֑/הּ וַ/יִּבְנ֨וּ לְ/ךָ֧ בָּ֛/הּ מִקְדָּ֖שׁ לְ/שִׁמְ/ךָ֥ לֵ/אמֹֽר־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/008.yaml
  text: And they lived in it and built for you in it a sanctuary for your name[a], saying[b],
translation:
  language: pt
  text: 'E habitaram nela[a] e nela construíram para ti um santuário para o teu nome[b], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “residiram nela” ou “se estabeleceram nela”.
    reason: lexical_alternative
  - marker: b
    text: “Um santuário para o teu nome” é um lugar santo dedicado ao nome do SENHOR, isto é, à sua presença revelada e à sua honra.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: habitaram
  rationale: O verbo ישׁב indica aqui que passaram a residir na terra. “Habitaram” é claro e digno, preservando melhor que “se estabeleceram” a possibilidade de residência contínua.
- source_word: בָהּ
  choice: nela
  rationale: O sufixo feminino singular retoma a terra mencionada no contexto; “nela” é natural em português.
- source_word: וַיִּבְנוּ
  choice: construíram
  rationale: Equivalente corrente de בנה neste contexto; evita qualquer ambiguidade coloquial que “fizeram” poderia introduzir.
- source_word: לְךָ
  choice: para ti
  rationale: 'A preposição expressa benefício e dedicação: o santuário foi construído para Deus.'
- source_word: מִקְדָּשׁ
  choice: um santuário
  rationale: Preserva o sentido de lugar santo sem reduzir o termo à designação institucional “templo”, embora esse seja o referente histórico.
- source_word: לְשִׁמְךָ
  choice: para o teu nome
  rationale: Mantém a expressão bíblica de dedicação ao nome, à presença revelada e à honra de Deus, sem sugerir que ele esteja espacialmente contido no santuário.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Introduz as palavras citadas no versículo seguinte; os dois-pontos tornam essa função natural e clara em português.
theological_decisions:
- issue: Sentido de “um santuário para o teu nome”
  choice: Um lugar santo dedicado ao nome de Deus, associado à sua presença revelada e honra
  alternative: Um templo para a tua honra; um lugar santo que leva o teu nome
  rationale: A formulação preserva a teologia veterotestamentária do templo como lugar associado ao nome de Deus, sem afirmar que Deus esteja limitado ou contido nele.
translation_notes:
  register: Português moderno, claro e solene, com formas de segunda pessoa singular (“ti”, “teu”) coerentes com a oração dirigida a Deus. A repetição de “nela” foi mantida por corresponder à ênfase sintática do hebraico. Os marcadores foram colocados junto às expressões que efetivamente explicam.
