  text: וְ/עַתָּ֡ה הִנֵּה֩ בְנֵֽי עַמּ֨וֹן וּ/מוֹאָ֜ב וְ/הַר שֵׂעִ֗יר אֲ֠שֶׁר לֹֽא נָתַ֤תָּה לְ/יִשְׂרָאֵל֙ לָ/ב֣וֹא בָ/הֶ֔ם בְּ/בֹאָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם כִּ֛י סָ֥רוּ מֵ/עֲלֵי/הֶ֖ם וְ/לֹ֥א הִשְׁמִידֽוּ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/010.yaml
  text: And now[a], behold, the people of Ammon and Moab and Mount Seir[b], whom you did not allow Israel to enter against when they came from the land of Egypt—for they turned away from them and did not destroy them—
translation:
  language: pt
  text: E agora, eis os amonitas, os moabitas e os habitantes do monte Seir[a], contra os quais não permitiste que Israel marchasse[b] quando vinha da terra do Egito; pois Israel se desviou deles e não os destruiu —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “os filhos de Amom, Moabe e o monte Seir”; a expressão designa os amonitas, os moabitas e o povo da região de Seir.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “não deste a Israel entrar neles/contra eles”; no contexto, trata-se de não permitir uma ação militar contra esses povos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a ligação com a oração anterior quanto a transição para a situação presente.
- source_word: הִנֵּה
  choice: eis
  rationale: Mantém a força enfática e de apresentação do hebraico em linguagem digna e compreensível.
- source_word: בְנֵי עַמּוֹן וּמוֹאָב וְהַר שֵׂעִיר
  choice: os amonitas, os moabitas e os habitantes do monte Seir
  rationale: Explicita naturalmente em português os três grupos humanos designados pelo hebraico, sem tratar o lugar geográfico como se ele próprio agisse.
- source_word: אֲשֶׁר לֹא נָתַתָּה לְיִשְׂרָאֵל לָבוֹא בָהֶם
  choice: contra os quais não permitiste que Israel marchasse
  rationale: Comunica a permissão negada e o sentido militar contextual de 'entrar contra', sem recorrer ao termo mais forte 'invadir'.
- source_word: בְּבֹאָם מֵאֶרֶץ מִצְרָיִם
  choice: quando vinha da terra do Egito
  rationale: O referente coletivo Israel é retomado no singular, de modo natural em português, preservando a relação temporal.
- source_word: כִּי סָרוּ מֵעֲלֵיהֶם
  choice: pois Israel se desviou deles
  rationale: Torna inequívoco que foi Israel quem alterou sua rota e evitou esses povos; 'pois' preserva a relação explicativa.
- source_word: וְלֹא הִשְׁמִידוּם
  choice: e não os destruiu
  rationale: Traduz diretamente o sentido bélico forte do hifil de שׁמד sem intensificação desnecessária.
theological_decisions:
- issue: Forma da referência direta a Deus
  choice: não permitiste
  alternative: o SENHOR não permitiu
  rationale: O versículo continua uma oração dirigida diretamente a Deus; a segunda pessoa do hebraico deve ser preservada sem inserir um título divino ausente.
- issue: Identificação do sujeito que se desviou e não destruiu
  choice: Israel se desviou deles e não os destruiu
  alternative: eles se desviaram deles e não os destruíram
  rationale: A repetição de 'Israel' evita uma ambiguidade referencial artificial em português e preserva o sentido narrativo de que Israel poupou esses povos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a oração na segunda pessoa e conserva o travessão final, pois a frase prossegue no versículo seguinte.
