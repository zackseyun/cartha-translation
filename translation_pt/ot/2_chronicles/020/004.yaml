base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/004.yaml
  text: And Judah gathered together to seek Yahweh[b][a]; they even came from all the cities of Judah to seek Yahweh.
translation:
  language: pt
  text: Judá se reuniu para buscar ajuda de Yahweh; também vieram de todas as cidades de Judá para buscar Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקָּבְצוּ יְהוּדָה
  choice: Judá se reuniu
  rationale: O nifal de קבץ expressa reunir-se ou ser congregado. O singular «Judá» funciona coletivamente, e «se reuniu» é natural em português.
- source_word: לְבַקֵּשׁ מֵיְהוָה
  choice: para buscar de Yahweh
  rationale: A construção בקש + מן significa literalmente «buscar de». Embora o contexto sugira buscar ajuda ou livramento da parte de Yahweh, o objeto não é expresso; a formulação preserva essa abertura e a diferença em relação à segunda oração.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: גַּם מִכָּל עָרֵי יְהוּדָה
  choice: até mesmo de todas as cidades de Judá
  rationale: «Até mesmo» comunica a ênfase de גם, enquanto a expressão restante preserva a abrangência geográfica do hebraico.
- source_word: בָּאוּ
  choice: vieram
  rationale: Equivalente narrativo direto e idiomático do verbo בוא.
- source_word: לְבַקֵּשׁ אֶת יְהוָה
  choice: para buscar Yahweh
  rationale: Aqui את marca Yahweh como objeto direto. A tradução mantém a distinção formal em relação ao primeiro uso de בקש.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico sem substituí-lo por um título.
- issue: Relação entre as duas construções com בקש
  choice: Manter «buscar de Yahweh» na primeira e «buscar Yahweh» na segunda
  alternative: Harmonizar ambas como «buscar Yahweh» ou explicitar «buscar ajuda de Yahweh»
  rationale: O hebraico alterna בקש + מן e בקש + את. A tradução conserva essa variação e evita inserir no texto principal um objeto implícito, como «ajuda» ou «livramento».
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. A expressão incomum «buscar de Yahweh» é mantida por fidelidade à construção elíptica hebraica e esclarecida em nota.
