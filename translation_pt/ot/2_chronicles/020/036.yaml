  text: וַ/יְחַבְּרֵ֣/הוּ עִמּ֔/וֹ לַ/עֲשׂ֥וֹת אֳנִיּ֖וֹת לָ/לֶ֣כֶת תַּרְשִׁ֑ישׁ וַ/יַּעֲשׂ֥וּ אֳנִיּ֖וֹת בְּ/עֶצְי֥וֹן גָּֽבֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/036.yaml
  text: So he allied himself with him to make ships to go to Tarshish[b][a], and they made ships at Ezion-geber.
translation:
  language: pt
  text: Assim, ele se associou a ele para construir navios destinados a ir a Társis[a][b]; e construíram os navios em Eziom-Geber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se aliou a ele”, “uniu-se a ele” ou “fez parceria com ele”. O verbo hebraico indica entrar em associação ou aliança.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para navegar até Társis”. Em contextos marítimos, alguns entendem a expressão relacionada a Társis de modo mais idiomático; aqui, porém, o hebraico expressa mais naturalmente um destino.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַבְּרֵהוּ
  choice: ele se associou a ele
  rationale: O hifil de חבר indica aqui entrar em associação ou parceria. A formulação preserva a referência pronominal do hebraico e evita especificar além do texto se a relação era política ou comercial.
- source_word: לַעֲשׂוֹת
  choice: para construir
  rationale: Embora עשה tenha o sentido geral de “fazer”, com navios o português natural emprega “construir”.
- source_word: אֳנִיּוֹת
  choice: navios
  rationale: O substantivo designa embarcações apropriadas para viagens marítimas; “navios” é a opção corrente e precisa.
- source_word: לָלֶכֶת תַּרְשִׁישׁ
  choice: destinados a ir a Társis
  rationale: A construção expressa mais naturalmente a finalidade dos navios e Társis como destino. “Destinados a” deixa claro que o infinitivo se relaciona aos navios, sem substituir “ir” por uma especificação interpretativa como “navegar”.
- source_word: תַּרְשִׁישׁ
  choice: Társis
  rationale: Transliteração portuguesa tradicional e amplamente reconhecível do topônimo.
- source_word: וַיַּעֲשׂוּ
  choice: construíram
  rationale: O verbo plural descreve a ação conjunta dos associados; “construíram” é idiomático em português quando o objeto são navios.
- source_word: בְּעֶצְיוֹן גָּבֶר
  choice: em Eziom-Geber
  rationale: A preposição ב marca o local da construção. “Em” é a forma natural em português diante de um topônimo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A ordem dos marcadores foi normalizada para [a][b]. “Associou-se” conserva a amplitude lexical do hebraico; “construir navios” privilegia a naturalidade sem alterar o sentido.
