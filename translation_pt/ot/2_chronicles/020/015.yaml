  text: וַ/יֹּ֗אמֶר הַקְשִׁ֤יבוּ כָל יְהוּדָה֙ וְ/יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם וְ/הַ/מֶּ֖לֶךְ יְהוֹשָׁפָ֑ט כֹּֽה אָמַ֨ר יְהוָ֜ה לָ/כֶ֗ם אַ֠תֶּם אַל תִּֽירְא֤וּ וְ/אַל תֵּחַ֨תּוּ֙ מִ/פְּנֵ֨י הֶ/הָמ֤וֹן הָ/רָב֙ הַ/זֶּ֔ה כִּ֣י לֹ֥א לָ/כֶ֛ם הַ/מִּלְחָמָ֖ה כִּ֥י לֵ/אלֹהִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/015.yaml
  text: 'And he said[a], “Listen, all Judah and inhabitants of Jerusalem, and King Jehoshaphat: Thus says Yahweh to you, ‘Do not fear, and do not be dismayed because of this great multitude, for the battle is not yours, but God''s.’”'
translation:
  language: pt
  text: 'E ele disse: “Escutem, todo o Judá, os habitantes de Jerusalém e o rei Josafá: Assim diz Yahweh a vocês: ‘Não tenham medo e não se apavorem diante desta grande multidão, pois a batalha não é de vocês, mas de Deus.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַקְשִׁיבוּ
  choice: Escutem
  rationale: O imperativo plural convoca todos a ouvir com atenção; “Escutem” é direto, natural e preserva essa força.
- source_word: כָל יְהוּדָה
  choice: todo o Judá
  rationale: Mantém a designação coletiva e territorial do hebraico sem acrescentar “povo”, embora este esteja implícito.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: habitantes de Jerusalém
  rationale: Expressa naturalmente o particípio substantivado que designa os que moravam em Jerusalém.
- source_word: וְהַמֶּלֶךְ יְהוֹשָׁפָט
  choice: e rei Josafá
  rationale: Preserva o título seguido do nome e inclui o rei entre os destinatários da convocação direta.
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Conserva a fórmula profética solene e verte diretamente o nome divino.
- source_word: אַל תִּירְאוּ וְאַל תֵּחַתּוּ
  choice: Não tenham medo e não fiquem desanimados
  rationale: Mantém as duas proibições distintas, ligadas de modo aditivo, em português atual e claro.
- source_word: מִפְּנֵי
  choice: diante de
  rationale: Preserva a imagem relacional de estar perante a ameaça e funciona naturalmente no contexto militar.
- source_word: הֶהָמוֹן הָרָב הַזֶּה
  choice: esta grande multidão
  rationale: Traduz os elementos do sintagma sem intensificar indevidamente o caráter militar com termos como “horda”.
- source_word: כִּי לֹא לָכֶם הַמִּלְחָמָה כִּי לֵאלֹהִים
  choice: pois a batalha não é de vocês, mas de Deus
  rationale: Reproduz com clareza o contraste possessivo do hebraico e entende o segundo כִּי em seu valor adversativo contextual.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio; “Yahweh” o representa diretamente sem substituí-lo por um título.
- issue: Pertencimento da batalha
  choice: a batalha não é de vocês, mas de Deus
  alternative: a batalha não cabe a vocês, pois pertence a Deus
  rationale: A formulação mantém a afirmação contextual de que o conflito está sob a responsabilidade e o controle de Deus, sem ampliá-la para uma tese alheia ao versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação destaca a convocação enfática e a fala profética encaixada. Não se acrescentou nota, pois as alternativas relevantes podem ser representadas adequadamente no próprio texto.
