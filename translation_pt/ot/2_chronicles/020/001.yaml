  source_fidelity: A tradução reproduz adequadamente a sequência narrativa, os dois povos nomeados, a presença de um terceiro grupo aliado e a finalidade hostil da vinda contra Josafá. «Vieram lutar contra» comunica com naturalidade o sentido de vieram contra ele para a batalha. A nota preserva de forma apropriada a leitura massorética «amonitas» e sinaliza a identificação contextual, mas não certa, com os meunitas.
