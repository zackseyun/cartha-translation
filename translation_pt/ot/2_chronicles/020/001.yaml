  text: וַ/יְהִ֣י אַֽחֲרֵי כֵ֡ן בָּ֣אוּ בְנֵי מוֹאָב֩ וּ/בְנֵ֨י עַמּ֜וֹן וְ/עִמָּ/הֶ֧ם מֵֽ/הָ/עַמּוֹנִ֛ים עַל יְהוֹשָׁפָ֖ט לַ/מִּלְחָמָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/001.yaml
  text: After this[a], the Moabites and the Ammonites, and with them some of the Meunites, came against Jehoshaphat for battle.
translation:
  language: pt
  text: Depois disso, os moabitas e os amonitas, acompanhados por alguns dos meunitas[a], vieram lutar contra Josafá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “alguns dos amonitas”. Muitos intérpretes, com base no contexto e em versões antigas, entendem que a expressão se refere aos meunitas ou a outro grupo aliado semelhante, em vez de repetir os amonitas.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Depois disso
  rationale: Reproduz com naturalidade a transição temporal da narrativa, sem traduzir de modo rígido a fórmula hebraica וַיְהִי.
- source_word: בְּנֵי מוֹאָב
  choice: os moabitas
  rationale: O hebraico usa literalmente “filhos de Moabe” como designação étnica; “moabitas” é o equivalente idiomático em português.
- source_word: בְּנֵי עַמּוֹן
  choice: os amonitas
  rationale: A expressão literal “filhos de Amom” funciona como gentílico, representado naturalmente por “amonitas”.
- source_word: וְעִמָּהֶם
  choice: acompanhados por
  rationale: Expressa de maneira corrente que o grupo adicional veio junto com os moabitas e os amonitas.
- source_word: מֵהָעַמּוֹנִים
  choice: alguns dos meunitas
  rationale: O texto hebraico massorético vocalizado aponta para “alguns dos amonitas”, mas o contexto e versões antigas sustentam a identificação de outro povo aliado, geralmente entendido como os meunitas. A leitura textual direta é preservada em nota.
- source_word: בָּאוּ ... עַל יְהוֹשָׁפָט לַמִּלְחָמָה
  choice: vieram lutar contra Josafá
  rationale: Combina em português natural o verbo de movimento, a preposição de sentido hostil e a finalidade militar, sem tornar a ação mais específica do que o hebraico permite.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. Os gentílicos tradicionais “moabitas”, “amonitas” e “meunitas” preservam a precisão histórica; a construção final torna idiomática a finalidade militar do hebraico.
