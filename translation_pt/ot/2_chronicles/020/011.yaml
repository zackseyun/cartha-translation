  text: וְ/הִ֨נֵּה הֵ֔ם גֹּמְלִ֖ים עָלֵ֑י/נוּ לָ/בוֹא֙ לְ/גָ֣רְשֵׁ֔/נוּ מִ/יְּרֻשָּׁתְ/ךָ֖ אֲשֶׁ֥ר הֽוֹרַשְׁתָּֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/011.yaml
  text: And behold[a], they are repaying us by coming to drive us out of your possession, which you gave us as an inheritance.
translation:
  language: pt
  text: 'E vejam como eles nos retribuem: vêm para nos expulsar da terra que é tua, a qual nos deste como herança.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da tua herança, que nos fizeste herdar”.'
    reason: Alternativa lexical que reproduz mais diretamente a repetição da raiz hebraica ligada a herança e posse.
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E vejam
  rationale: Introduz um apelo enfático para que se preste atenção à situação presente. A forma plural concorda naturalmente com a oração pública e mantém linguagem atual.
- source_word: הֵם
  choice: eles
  rationale: Mantém o pronome independente e sua ênfase nos povos ofensores.
- source_word: גֹּמְלִים עָלֵינוּ
  choice: como eles nos retribuem
  rationale: 'Expressa a ideia de recompensa ou paga, aqui com forte ironia: esta é a resposta deles ao fato de Israel os ter poupado.'
- source_word: לָבוֹא לְגָרְשֵׁנוּ
  choice: vêm para nos expulsar
  rationale: 'Traduz com naturalidade o movimento e a finalidade: eles vêm com o propósito de expulsar o povo.'
- source_word: מִיְּרֻשָּׁתְךָ
  choice: da terra que é tua
  rationale: O substantivo pode indicar possessão ou herança. Esta formulação clara evita repetição pesada e conserva a ideia de que a terra pertence, em última instância, a Deus.
- source_word: אֲשֶׁר הוֹרַשְׁתָּנוּ
  choice: a qual nos deste como herança
  rationale: O hifil de ירשׁ indica fazer possuir ou herdar. A tradução apresenta Deus como aquele que concedeu a terra a Israel.
theological_decisions:
- issue: A propriedade divina da terra e sua concessão a Israel
  choice: da terra que é tua, a qual nos deste como herança
  alternative: da tua herança, que nos fizeste herdar
  rationale: A opção principal preserva tanto a pertença última da terra a Deus quanto sua concessão derivada a Israel, sem sugerir que esses conceitos sejam incompatíveis.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Vejam” comunica a força discursiva de הִנֵּה sem o arcaísmo de “eis”. “Terra que é tua” explicita naturalmente a possessão no contexto.
