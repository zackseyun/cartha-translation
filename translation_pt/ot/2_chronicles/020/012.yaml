  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֱלֹהֵ֨י/נוּ֙ הֲ/לֹ֣א תִשְׁפָּט בָּ֔/ם כִּ֣י אֵ֥ין בָּ֨/נוּ֙ כֹּ֔חַ לִ֠/פְנֵי הֶ/הָמ֥וֹן הָ/רָ֛ב הַ/זֶּ֖ה הַ/בָּ֣א עָלֵ֑י/נוּ וַ/אֲנַ֗חְנוּ לֹ֤א נֵדַע֙ מַֽה נַּעֲשֶׂ֔ה כִּ֥י עָלֶ֖י/ךָ עֵינֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/012.yaml
  text: Our God[a], will you not judge them? For we have no power before this great multitude that is coming against us. We do not know what to do, but our eyes are on you.
translation:
  language: pt
  text: Nosso Deus, não os julgarás? Pois não temos força para enfrentar esta grande multidão que vem contra nós. Não sabemos o que fazer, mas os nossos olhos estão voltados para ti.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “pois os nossos olhos estão sobre ti”.'
    reason: Preserva tanto o valor mais comum de כִּי como 'pois' quanto a construção metafórica mais literal do hebraico.
lexical_decisions:
- source_word: אֱלֹהֵינוּ
  choice: Nosso Deus
  rationale: Vocativo em uma oração; a forma direta é natural em português e preserva o apelo comunitário sem acrescentar uma interjeição ausente.
- source_word: הֲלֹא תִשְׁפָּט בָּם
  choice: não os julgarás?
  rationale: Mantém o sentido judicial de שׁפט e a pergunta retórica que apela para a intervenção de Deus, sem restringi-la apenas à punição.
- source_word: אֵין בָּנוּ כֹּחַ
  choice: não temos força
  rationale: Expressa de modo claro a falta de capacidade diante da ameaça militar, preservando o sentido básico de כֹּחַ.
- source_word: לִפְנֵי הֶהָמוֹן הָרָב הַזֶּה
  choice: para enfrentar esta grande multidão
  rationale: לִפְנֵי significa literalmente 'diante de'; no contexto, 'para enfrentar' comunica naturalmente a incapacidade perante a força hostil. 'Multidão' evita especificar além do substantivo hebraico, embora o contexto seja militar.
- source_word: הַבָּא עָלֵינוּ
  choice: que vem contra nós
  rationale: Preserva o particípio, que apresenta a ameaça como iminente, e o sentido hostil de עַל no contexto.
- source_word: וַאֲנַחְנוּ לֹא נֵדַע מַה נַּעֲשֶׂה
  choice: Não sabemos o que fazer
  rationale: Formulação simples e urgente que reproduz naturalmente a confissão de impotência.
- source_word: כִּי עָלֶיךָ עֵינֵינוּ
  choice: mas os nossos olhos estão voltados para ti
  rationale: Preserva a metáfora dos olhos dirigidos a Deus e comunica dependência e expectativa. 'Mas' explicita em português o contraste pragmático com a incapacidade confessada, embora כִּי possa ser vertido mais formalmente por 'pois'.
theological_decisions:
- issue: Relação da oração final introduzida por כִּי com a confissão precedente
  choice: mas os nossos olhos estão voltados para ti
  alternative: pois os nossos olhos estão sobre ti
  rationale: Após 'não sabemos o que fazer', a frase culmina na confiança em Deus. O adversativo torna esse movimento claro em português, enquanto a nota preserva a possibilidade formal e causal do hebraico.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A segunda pessoa singular foi mantida apenas na referência a Deus ('ti'), forma corrente e reverente nesse contexto; as construções evitam arcaísmos e não acrescentam terminologia denominacional.
