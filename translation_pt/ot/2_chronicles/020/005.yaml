  text: וַ/יַּעֲמֹ֣ד יְהוֹשָׁפָ֗ט בִּ/קְהַ֧ל יְהוּדָ֛ה וִ/ירוּשָׁלִַ֖ם בְּ/בֵ֣ית יְהוָ֑ה לִ/פְנֵ֖י הֶ/חָצֵ֥ר הַ/חֲדָשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/005.yaml
  text: And Jehoshaphat stood in the assembly of Judah and Jerusalem[a], in the house of Yahweh, before the new court.
translation:
  language: pt
  text: Então Josafá se pôs de pé na assembleia de Judá e de Jerusalém, na casa de Yahweh, diante do pátio novo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “átrio novo”.
    reason: Alternativa lexical para חָצֵר no contexto do complexo do templo.
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: Então Josafá se pôs de pé
  rationale: A forma narrativa apresenta uma ação passada em sequência. “Pôs-se de pé” expressa naturalmente o ato de levantar-se ou assumir posição para falar, sem acrescentar a ideia mais forte de confronto contida em “tomou posição”.
- source_word: בִּקְהַל
  choice: no meio da assembleia
  rationale: קָהָל designa a comunidade reunida. A preposição ב indica que Josafá estava dentro da assembleia; “no meio da assembleia” torna essa relação clara e idiomática em português.
- source_word: יְהוּדָה וִירוּשָׁלַם
  choice: de Judá e de Jerusalém
  rationale: A coordenação do hebraico é mantida, identificando a população reunida por sua procedência sem explicitação interpretativa.
- source_word: בְּבֵית יְהוָה
  choice: na casa de Yahweh
  rationale: A tradução conserva a expressão hebraica “casa de Yahweh”. Embora “templo” seja contextualmente possível, “casa” preserva a imagem e continua clara no contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino é transliterado como “Yahweh”, preservando o nome pessoal presente no texto hebraico em vez de substituí-lo por um título.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Neste contexto, a expressão marca posição espacial e é vertida de modo natural e digno por “diante de”.
- source_word: הֶחָצֵר הַחֲדָשָׁה
  choice: o pátio novo
  rationale: חָצֵר refere-se a uma área aberta ou cercada do complexo do templo. “Pátio” é claro no português atual; “átrio” é uma alternativa tradicional.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama. A transliteração “Yahweh” preserva o nome da aliança sem substituí-lo pelo título “SENHOR” nem adotar a forma híbrida tradicional “Jeová”.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase acompanha de perto o hebraico sem sacrificar a naturalidade. O marcador da nota foi colocado após “pátio novo”, termo ao qual a alternativa lexical efetivamente se refere.
