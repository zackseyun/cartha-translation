base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/027.yaml
  text: Then all the men of Judah and Jerusalem returned[a], with Jehoshaphat at their head, to return to Jerusalem with joy[b], because Yahweh had made them rejoice over their enemies.
translation:
  language: pt
  text: Então todos os homens de Judá e de Jerusalém voltaram[a], com Josafá à frente deles, para regressar a Jerusalém com alegria[b], porque Yahweh os havia feito alegrar-se por causa de seus inimigos.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “cada homem de Judá e de Jerusalém”, expressão distributiva que se refere ao grupo inteiro.
    reason: lexical_alternative
  - marker: b
    text: O hebraico repete a raiz traduzida por “voltaram” e “regressar”, enfatizando o movimento de volta.
    reason: source_structure
  - marker: c
    text: 'Ou: “porque Yahweh os havia alegrado, livrando-os de seus inimigos”. A preposição hebraica pode relacionar a alegria tanto aos inimigos vencidos como ao livramento deles.'
    reason: semantic_ambiguity
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: voltaram
  rationale: O verbo שׁוב descreve o retorno do grupo após o campo de batalha; “voltaram” é direto, natural e preserva o sentido de movimento.
- source_word: כָּל אִישׁ יְהוּדָה וִירוּשָׁלִַם
  choice: todos os homens de Judá e de Jerusalém
  rationale: A expressão hebraica é literalmente distributiva, “cada homem”, mas designa coletivamente o grupo inteiro. “Todos os homens” conserva a referência masculina explícita de אִישׁ e soa natural em português.
- source_word: וִיהוֹשָׁפָט בְּרֹאשָׁם
  choice: com Josafá à frente deles
  rationale: בְּרֹאשָׁם indica tanto a posição dianteira como a liderança; a expressão portuguesa mantém essa imagem sem precisar decidir entre as duas nuances.
- source_word: לָשׁוּב אֶל יְרוּשָׁלִַם
  choice: para regressar a Jerusalém
  rationale: O infinitivo de שׁוב retoma a raiz do verbo anterior e apresenta a direção ou finalidade do retorno. “Regressar” evita uma repetição pesada, mas conserva o segundo verbo.
- source_word: בְּשִׂמְחָה
  choice: com alegria
  rationale: Equivalência idiomática e substantiva para שִׂמְחָה, preservando o modo como regressaram.
- source_word: כִּי
  choice: porque
  rationale: Introduz claramente a razão da alegria do grupo.
- source_word: שִׂמְּחָם
  choice: os havia feito alegrar-se
  rationale: 'O piel de שׂמח com sufixo pronominal tem força causativa: Yahweh fez com que eles se alegrassem. O mais-que-perfeito explicita que essa ação fundamentava o retorno alegre.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מֵאוֹיְבֵיהֶם
  choice: com a derrota de seus inimigos
  rationale: Após o verbo de alegrar-se, מִן pode indicar a ocasião ou o objeto da alegria. No contexto imediato, a alegria decorre da derrota dos inimigos; a formulação portuguesa torna essa relação clara, enquanto a nota registra a alternativa possível.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” preserva essa identificação sem trocar o nome por um título.
- issue: Sentido de מִן em מֵאוֹיְבֵיהֶם
  choice: alegrar-se com a derrota de seus inimigos
  alternative: alegrar-se por tê-los livrado de seus inimigos
  rationale: O contexto favorece a alegria pela vitória sobre os inimigos, mas a preposição pode também ser entendida em relação ao livramento deles. A nota mantém aberta essa possibilidade sem inserir a alternativa no texto principal.
- issue: Expressão coletiva masculina כָּל אִישׁ
  choice: todos os homens
  alternative: todos
  rationale: Como אִישׁ está explicitamente presente e funciona distributivamente, a tradução conserva a referência a “homens” sem perder o sentido coletivo.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem básica do hebraico foi preservada, e a repetição da raiz שׁוב foi representada por dois verbos próximos (“voltaram” e “regressar”) para manter a ênfase sem produzir uma redundância excessivamente áspera.
