  text: וְ/אָמְר֗וּ עַל֩ אֲשֶׁ֨ר עָֽזְב֜וּ אֶת יְהוָ֣ה אֱלֹהֵ֣י אֲבֹתֵי/הֶ֗ם אֲשֶׁ֣ר הוֹצִיאָ/ם֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ וַֽ/יַּחֲזִ֨יקוּ֙ בֵּ/אלֹהִ֣ים אֲחֵרִ֔ים וַ/יִּשְׁתַּחֲו֥וּ לָ/הֶ֖ם וַ/יַּֽעַבְד֑וּ/ם עַל כֵּן֙ הֵבִ֣יא עֲלֵי/הֶ֔ם אֵ֥ת כָּל הָ/רָעָ֖ה הַ/זֹּֽאת־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/022.yaml
  text: And they will say[a], ‘Because they forsook Yahweh, the God of their fathers, who brought them out of the land of Egypt, and embraced other gods, and bowed down to them and served them[b], therefore he has brought all this disaster on them.’
translation:
  language: pt
  text: 'E dirão: “Porque abandonaram Yahweh, o Deus de seus antepassados, que os tirou da terra do Egito, e se apegaram a outros deuses[a], prostraram-se diante deles e os serviram, por isso ele trouxe sobre eles toda esta calamidade[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “agarraram-se a outros deuses” ou “se ligaram a outros deuses”. O verbo hebraico significa literalmente “segurar com firmeza” e expressa adesão deliberada.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “calamidade” se refere à desgraça ou ao juízo que sobreveio ao povo, não ao mal em sentido moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: E dirão
  rationale: O perfeito com a conjunção, dentro da previsão iniciada no contexto anterior, tem sentido futuro; a forma mantém a continuidade do discurso.
- source_word: עַל אֲשֶׁר
  choice: Foi porque
  rationale: A expressão introduz a causa da devastação. Esta construção é causal, natural em português e apropriada como resposta explicativa.
- source_word: עָזְבוּ
  choice: abandonaram
  rationale: Comunica com clareza a gravidade do afastamento de Yahweh, inclusive sua dimensão de ruptura da fidelidade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי אֲבֹתֵיהֶם
  choice: o Deus de seus antepassados
  rationale: Preserva a continuidade histórica e pactual evocada pela expressão, evitando que “pais” seja entendido apenas como os genitores imediatos.
- source_word: הוֹצִיאָם מֵאֶרֶץ מִצְרַיִם
  choice: que os tirou da terra do Egito
  rationale: Reproduz de forma clara e corrente a fórmula tradicional do êxodo.
- source_word: וַיַּחֲזִיקוּ בֵּאלֹהִים אֲחֵרִים
  choice: apegaram-se a outros deuses
  rationale: חזק com ב expressa tomar posse, agarrar-se ou manter forte ligação. “Apegaram-se” conserva a ideia de adesão deliberada sem impor uma interpretação além do texto.
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: prostraram-se diante deles
  rationale: Mantém o gesto concreto de inclinar-se ou prostrar-se, sem fundi-lo com o verbo seguinte, que descreve serviço cultual.
- source_word: וַיַּעַבְדוּם
  choice: os serviram
  rationale: Preserva a distinção lexical entre prostrar-se e servir; no contexto de deuses, o serviço tem caráter religioso.
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Marca de maneira concisa e natural a consequência da apostasia.
- source_word: הֵבִיא עֲלֵיהֶם
  choice: ele trouxe sobre eles
  rationale: Conserva a construção causativa e identifica Yahweh, mencionado anteriormente, como sujeito implícito.
- source_word: כָּל הָרָעָה הַזֹּאת
  choice: toda esta calamidade
  rationale: Neste contexto de juízo e devastação, רָעָה designa desgraça ou calamidade, não maldade moral.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o tetragrama. A transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Natureza de הָרָעָה no juízo divino
  choice: calamidade
  alternative: mal; desgraça
  rationale: A palavra descreve a devastação que sobreveio ao povo; não atribui maldade moral a Deus.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Antepassados” evita a possível leitura restrita de “pais”; “apegaram-se” soa natural e conserva a metáfora hebraica de forte ligação. A sequência “prostraram-se... e os serviram” mantém distintos os dois atos descritos no original.
