source:
  edition: WLC
  text: וְ/לֹ֤א יָֽכְלוּ֙ הַ/כֹּ֣הֲנִ֔ים לָ/ב֖וֹא אֶל בֵּ֣ית יְהוָ֑ה כִּֽי מָלֵ֥א כְבוֹד יְהוָ֖ה אֶת בֵּ֥ית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/002.yaml
  text: And the priests were not able to enter the house of Yahweh[a], because the glory of Yahweh filled the house of Yahweh.
translation:
  language: pt
  text: E os sacerdotes não puderam entrar na casa de Yahweh[a], porque a glória de Yahweh encheu a casa de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “casa de Yahweh”; isto é, o templo. A tradução mantém “casa” para refletir a formulação hebraica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יָכְלוּ
  choice: E ... não puderam
  rationale: Dá continuidade à narrativa e expressa de modo natural a incapacidade indicada por יכל, sem definir a natureza do impedimento.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Equivalente corrente e preciso no contexto do culto no templo.
- source_word: לָבוֹא אֶל
  choice: entrar em
  rationale: Neste contexto, בוא com אֶל indica o ingresso em um lugar; “entrar” é conciso e natural em português.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Preserva literalmente a imagem hebraica de “casa”, embora o referente contextual seja o templo, e mantém a repetição do texto-fonte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כִּי
  choice: porque
  rationale: Introduz claramente a causa de os sacerdotes não poderem entrar.
- source_word: מָלֵא
  choice: encheu
  rationale: O verbo perfeito apresenta a glória como aquilo que ocupou a casa; o pretérito perfeito se ajusta naturalmente à sequência narrativa.
- source_word: כְבוֹד יְהוָה
  choice: a glória de Yahweh
  rationale: Reproduz com clareza a relação construta hebraica e conserva a linguagem bíblica corrente.
- source_word: אֶת בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Mantém a expressão e sua repetição exata, sem variar estilisticamente para “templo”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal no texto, sem substituí-lo pelo título “SENHOR”.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conserva a repetição enfática de “casa de Yahweh” e não explicita se o impedimento dos sacerdotes era físico ou cultual.
