source:
  edition: WLC
  text: וְ/הַ/כֹּהֲנִ֞ים עַל מִשְׁמְרוֹתָ֣/ם עֹמְדִ֗ים וְ/הַ/לְוִיִּ֞ם בִּ/כְלֵי שִׁ֤יר יְהוָה֙ אֲשֶׁ֨ר עָשָׂ֜ה דָּוִ֣יד הַ/מֶּ֗לֶךְ לְ/הֹד֤וֹת לַ/יהוָה֙ כִּֽי לְ/עוֹלָ֣ם חַסְדּ֔/וֹ בְּ/הַלֵּ֥ל דָּוִ֖יד בְּ/יָדָ֑/ם וְ/הַ/כֹּהֲנִים֙ מחצצרים נֶגְדָּ֔/ם וְ/כָל יִשְׂרָאֵ֖ל עֹמְדִֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/006.yaml
  text: And the priests were standing at their posts[a], and the Levites with the instruments for the song of Yahweh, which David the king had made to give thanks to Yahweh, for his steadfast love endures forever, when David offered praise by their hand; and the priests were blowing trumpets opposite them[c][b], while all Israel was standing.
translation:
  language: pt
  text: Os sacerdotes permaneciam em seus postos, e os levitas, com os instrumentos para o cântico de Yahweh[a], que o rei Davi tinha feito para dar graças a Yahweh, pois o seu amor leal dura para sempre[b], quando Davi oferecia louvor por meio deles[c]. Os sacerdotes tocavam as trombetas diante deles, enquanto todo o Israel permanecia de pé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com os instrumentos musicais de Yahweh”. A expressão hebraica pode indicar instrumentos consagrados a Yahweh ou instrumentos usados para o cântico de Yahweh.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “pois o seu amor leal é para sempre”, expressão idiomática aqui traduzida como “pois o seu amor leal dura para sempre”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “quando Davi louvava por meio deles”. O hebraico é condensado e provavelmente indica que os levitas executavam o louvor davídico como seus agentes.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִשְׁמְרוֹתָם
  choice: em seus postos
  rationale: O termo indica posições ou turnos de serviço designados. “Em seus postos” comunica naturalmente a organização do serviço sacerdotal.
- source_word: בִּכְלֵי שִׁיר יְהוָה
  choice: com os instrumentos para o cântico de Yahweh
  rationale: Mantém a relação sintática entre os instrumentos, o cântico e Yahweh sem decidir se eram instrumentos pertencentes ao culto de Yahweh ou usados para um cântico dirigido a ele.
- source_word: לְהוֹדוֹת לַיהוָה
  choice: para dar graças a Yahweh
  rationale: Neste contexto, ידה no hiphil introduz ação de graças, reforçada pela fórmula sobre o amor leal de Deus.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: pois o seu amor leal dura para sempre
  rationale: “Amor leal” expressa a combinação de bondade, compromisso e fidelidade de חֶסֶד; “dura” explicita de modo idiomático o predicado subentendido no hebraico.
- source_word: בְּהַלֵּל דָּוִיד בְּיָדָם
  choice: quando Davi oferecia louvor por meio deles
  rationale: A frase hebraica é condensada e apresenta Davi como sujeito, com os levitas como agentes ou meios. A tradução conserva essa estrutura e sua tensão sem identificar explicitamente o louvor como composição de Davi.
- source_word: מחצצרים
  choice: tocavam as trombetas
  rationale: O verbo designa especificamente o ato de fazer soar trombetas. “Tocavam as trombetas” é claro e natural em português.
- source_word: נֶגְדָּם
  choice: diante deles
  rationale: A preposição indica posição em frente ou em oposição espacial. “Diante deles” preserva a relação sem impor uma configuração cerimonial mais específica.
- source_word: עֹמְדִים
  choice: permaneciam / permanecia de pé
  rationale: Os particípios descrevem postura contínua no cenário. As formas escolhidas mantêm esse aspecto durativo e evitam repetição pouco natural.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR / Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” representa o nome divino em vez de substituí-lo por um título.
- issue: Sentido de חֶסֶד
  choice: amor leal
  alternative: misericórdia / bondade / fidelidade pactual
  rationale: “Amor leal” preserva tanto a dimensão afetiva quanto a constância e fidelidade relacional do termo, sem restringi-lo apenas à misericórdia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e as relações sintáticas do hebraico foram preservadas quando teologicamente ou semanticamente relevantes, mas com pontuação e construções naturais em português. Os marcadores foram colocados junto às expressões às quais cada nota efetivamente se refere.
