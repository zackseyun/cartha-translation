  text: וְ/אַתָּ֞ה אִם תֵּלֵ֣ךְ לְ/פָנַ֗/י כַּ/אֲשֶׁ֤ר הָלַךְ֙ דָּוִ֣יד אָבִ֔י/ךָ וְ/לַ/עֲשׂ֕וֹת כְּ/כֹ֖ל אֲשֶׁ֣ר צִוִּיתִ֑י/ךָ וְ/חֻקַּ֥/י וּ/מִשְׁפָּטַ֖/י תִּשְׁמֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/017.yaml
  text: And as for you[a], if you walk before me as your father David walked, doing all that I have commanded you, and if you keep my statutes and my judgments,
translation:
  language: pt
  text: Quanto a você, se você andar diante de mim como andou Davi, seu pai, fazendo tudo o que lhe ordenei e guardar os meus estatutos e os meus juízos[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as minhas ordenanças”.'
    reason: Registra uma alternativa lexical legítima para וּמִשְׁפָּטַי, preservando sua possível nuance de normas ou decisões legais.
lexical_decisions:
- source_word: וְאַתָּה
  choice: Quanto a você
  rationale: O pronome anteposto, acompanhado da conjunção, introduz uma interpelação direta e enfática a Salomão; esta formulação preserva naturalmente a mudança de foco.
- source_word: אִם
  choice: se
  rationale: Introduz de modo explícito a condição dirigida a Salomão.
- source_word: תֵּלֵךְ לְפָנַי
  choice: andar diante de mim
  rationale: Preserva a imagem hebraica de andar e sua ideia pactual de conduzir a vida na presença de Deus.
- source_word: כַּאֲשֶׁר הָלַךְ דָּוִיד אָבִיךָ
  choice: como andou Davi, seu pai
  rationale: Mantém a comparação explícita e repete a imagem de andar presente no hebraico.
- source_word: וְלַעֲשׂוֹת כְּכֹל אֲשֶׁר צִוִּיתִיךָ
  choice: fazendo tudo o que lhe ordenei
  rationale: O gerúndio representa naturalmente o infinitivo construto hebraico como obrigação associada ao andar, sem transformá-lo em verbo finito coordenado.
- source_word: חֻקַּי
  choice: os meus estatutos
  rationale: Termo corrente em contextos legais e pactuais, preservando a distinção em relação ao substantivo seguinte.
- source_word: וּמִשְׁפָּטַי
  choice: os meus juízos
  rationale: Conserva a nuance jurídica de מִשְׁפָּטִים e a distinção lexical em relação a 'estatutos'; 'ordenanças' continua sendo alternativa possível.
- source_word: תִּשְׁמֹר
  choice: guardar
  rationale: Expressa o sentido pactual de observar e obedecer, em linguagem bíblica ainda clara no português moderno.
theological_decisions:
- issue: Expressão da obediência pactual sem introduzir uma teologia de mérito
  choice: 'Manter claramente a estrutura condicional e a linguagem de obediência: “se andar... fazendo tudo... e se guardar...”'
  alternative: Parafrasear como fidelidade geral ou atenuar a condição
  rationale: O texto apresenta a Salomão uma condição pactual real. A tradução conserva essa tensão sem suavizá-la nem vinculá-la a um sistema doutrinário externo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Quanto a você” preserva a ênfase discursiva; “andar diante de mim” mantém a metáfora pactual. A vírgula final foi mantida porque o versículo continua sintaticamente no versículo seguinte.
