base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/005.yaml
  text: And King Solomon sacrificed twenty-two thousand cattle and one hundred twenty thousand sheep[a], and the king and all the people dedicated the house of God.
translation:
  language: pt
  text: O rei Salomão sacrificou vinte e dois mil bovinos e cento e vinte mil ovelhas[a], e o rei e todo o povo dedicaram a casa de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “animais dos rebanhos”, pois o termo hebraico pode abranger coletivamente ovelhas e cabras.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: sacrificou
  rationale: No contexto cultual, זבח indica abater ou oferecer em sacrifício; “sacrificou” é conciso, natural e preserva esse sentido.
- source_word: זֶבַח הַבָּקָר
  choice: bovinos
  rationale: A expressão designa animais do gado oferecidos em sacrifício. “Bovinos” é um coletivo moderno e evita restringir indevidamente o referente a bois machos.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף
  choice: vinte e dois mil
  rationale: Forma numérica corrente em português.
- source_word: וְצֹאן
  choice: ovelhas
  rationale: צֹאן designa rebanhos de pequeno porte e pode incluir ovelhas e cabras. “Ovelhas” é natural no corpo do texto, com a amplitude lexical preservada em nota.
- source_word: מֵאָה וְעֶשְׂרִים אָלֶף
  choice: cento e vinte mil
  rationale: Forma numérica corrente e amplamente compreensível em português.
- source_word: וַיַּחְנְכוּ
  choice: dedicaram
  rationale: חנך refere-se aqui à dedicação ou inauguração formal do templo; “dedicaram” comunica claramente o ato cerimonial.
- source_word: בֵּית הָאֱלֹהִים
  choice: a casa de Deus
  rationale: Preserva a expressão hebraica literal e permanece natural em português, sem substituir a metáfora por “templo”.
- source_word: הַמֶּלֶךְ וְכָל הָעָם
  choice: o rei e todo o povo
  rationale: Mantém a retomada discursiva do título após Salomão já ter sido nomeado.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A pontuação com ponto e vírgula conserva o encadeamento do hebraico sem produzir uma frase excessivamente pesada; “assim” explicita naturalmente a relação entre os sacrifícios e a dedicação.
