  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/כֹ֣ל בְּנֵ֣י יִשְׂרָאֵ֗ל רֹאִים֙ בְּ/רֶ֣דֶת הָ/אֵ֔שׁ וּ/כְב֥וֹד יְהוָ֖ה עַל הַ/בָּ֑יִת וַ/יִּכְרְעוּ֩ אַפַּ֨יִם אַ֤רְצָ/ה עַל הָ/רִֽצְפָה֙ וַ/יִּֽשְׁתַּֽחֲו֔וּ וְ/הוֹד֤וֹת לַ/יהוָה֙ כִּ֣י ט֔וֹב כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/003.yaml
  text: 'And all the sons of Israel[a], seeing the fire come down and the glory of Yahweh upon the house, bowed down with their faces to the ground on the pavement, and they worshiped and gave thanks to Yahweh: “For he is good[c][b], for his steadfast love endures forever.”'
translation:
  language: pt
  text: 'E todos os filhos de Israel[a], vendo o fogo descer e a glória de Yahweh sobre a Casa[b], prostraram-se com o rosto em terra, sobre o pavimento; adoraram e deram graças a Yahweh: “Porque ele é bom, porque o seu amor leal dura para sempre.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os israelitas”. A expressão hebraica significa literalmente “todos os filhos de Israel” e designa coletivamente o povo de Israel.
    reason: lexical_alternative
  - marker: b
    text: A “Casa” é o templo.
    reason: cultural_note
  - marker: c
    text: Ou “a sua misericórdia dura para sempre” ou “a sua fidelidade à aliança dura para sempre”. O termo hebraico חֶסֶד abrange amor, lealdade e fidelidade constante.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל בְּנֵי יִשְׂרָאֵל
  choice: Todos os filhos de Israel
  rationale: Preserva a expressão coletiva hebraica literalmente, enquanto a nota esclarece que ela designa todo o povo israelita.
- source_word: רֹאִים בְּרֶדֶת הָאֵשׁ
  choice: vendo o fogo descer
  rationale: O particípio e a construção com infinitivo apresentam a descida do fogo como circunstância presenciada pelo povo; a formulação é natural em português.
- source_word: וּכְבוֹד יְהוָה עַל הַבָּיִת
  choice: e a glória de Yahweh sobre a Casa
  rationale: Mantém כָּבוֹד como “glória”, o nome divino como “Yahweh” e בַּיִת como “Casa”, referência contextual ao templo.
- source_word: וַיִּכְרְעוּ אַפַּיִם אַרְצָה עַל הָרִצְפָה
  choice: prostraram-se com o rosto em terra sobre o pavimento
  rationale: Comunica a postura corporal completa indicada pelo hebraico e preserva a menção específica ao piso pavimentado.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: adoraram
  rationale: Como a prostração física já foi explicitada, “adoraram” expressa aqui a força devocional do verbo sem repetição desnecessária.
- source_word: וְהוֹדוֹת לַיהוָה
  choice: e deram graças a Yahweh
  rationale: No contexto da aclamação litúrgica que segue, o verbo ידה indica ação de graças ou louvor; “deram graças” é a opção mais precisa.
- source_word: כִּי טוֹב
  choice: Porque ele é bom
  rationale: Reproduz a fórmula litúrgica e explicita em português o sujeito implícito, Yahweh, sem alterar seu referente.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: porque o seu amor leal dura para sempre
  rationale: “Amor leal” conserva tanto a benevolência quanto a constância relacional e pactual de חֶסֶד; “dura” torna explícita de modo natural a ideia temporal de לְעוֹלָם.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; “Yahweh” representa diretamente o nome da aliança sem substituí-lo por um título.
- issue: Sentido de חַסְדּוֹ na aclamação litúrgica
  choice: o seu amor leal
  alternative: a sua misericórdia; a sua fidelidade à aliança
  rationale: A escolha preserva a amplitude do termo, que reúne amor benevolente, lealdade e constância, sem reduzi-lo a apenas uma dessas dimensões.
- issue: Referência de הַבָּיִת
  choice: a Casa
  alternative: o templo
  rationale: “Casa” mantém a imagem hebraica e sua ressonância teológica, enquanto a nota identifica claramente o edifício como o templo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A sintaxe participial conserva a simultaneidade do hebraico; “Casa” recebe inicial maiúscula para sinalizar seu uso específico como designação do templo. Todos os marcadores de nota aparecem no texto principal.
