  text: וַ/הֲקִ֣ימוֹתִ֔י אֵ֖ת כִּסֵּ֣א מַלְכוּתֶ֑/ךָ כַּ/אֲשֶׁ֣ר כָּרַ֗תִּי לְ/דָוִ֤יד אָבִ֨י/ךָ֙ לֵ/אמֹ֔ר לֹֽא יִכָּרֵ֤ת לְ/ךָ֙ אִ֔ישׁ מוֹשֵׁ֖ל בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/018.yaml
  text: then I will establish the throne of your kingdom[a], as I covenanted with David your father, saying, ‘A man to rule over Israel will not be cut off from you.’
translation:
  language: pt
  text: 'então estabelecerei o trono do seu reino, conforme fiz aliança com Davi, seu pai, dizendo: “Nunca lhe faltará um homem que governe Israel.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַהֲקִימוֹתִי
  choice: então estabelecerei
  rationale: O hifil de קום significa fazer permanecer ou estabelecer; “então” expressa naturalmente a consequência ligada à condição do versículo anterior.
- source_word: כִּסֵּא מַלְכוּתֶךָ
  choice: o trono do seu reino
  rationale: Preserva os dois substantivos da construção hebraica, mantendo a imagem dinástica do trono e do reino.
- source_word: כַּאֲשֶׁר כָּרַתִּי
  choice: conforme fiz aliança
  rationale: כרת é usado idiomaticamente para firmar ou fazer uma aliança; em português, “fiz aliança” comunica o sentido sem reproduzir literalmente o verbo “cortar”.
- source_word: לְדָוִיד אָבִיךָ
  choice: com Davi, seu pai
  rationale: “Com” é a regência natural de “fazer aliança”; “pai” preserva a linguagem hebraica de ancestral e predecessor dinástico.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ
  choice: Nunca lhe faltará um homem
  rationale: A expressão hebraica literalmente fala de um homem que não será “cortado” para alguém; em português, a formulação idiomática transmite claramente a continuidade da linhagem sem alterar a promessa.
- source_word: מוֹשֵׁל בְּיִשְׂרָאֵל
  choice: que governe Israel
  rationale: O particípio מוֹשֵׁל caracteriza o homem como governante; com משל, a preposição בּ expressa aqui domínio sobre Israel.
theological_decisions:
- issue: Formulação da promessa dinástica
  choice: Nunca lhe faltará um homem que governe Israel
  alternative: Um homem que governe Israel não será eliminado de sua linhagem
  rationale: A opção principal reproduz o sentido reconhecido do idioma hebraico em português natural e mantém a promessa de continuidade dinástica, sem definir além do texto como ela se cumpre.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém “seu pai” como linguagem dinástica bíblica e evita o literalismo pouco claro de “não será cortado de você”.
