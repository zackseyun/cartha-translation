  text: וַ/יַּ֣עַשׂ שְׁלֹמֹ֣ה אֶת הֶ֠/חָג בָּ/עֵ֨ת הַ/הִ֜יא שִׁבְעַ֤ת יָמִים֙ וְ/כָל יִשְׂרָאֵ֣ל עִמּ֔/וֹ קָהָ֖ל גָּד֣וֹל מְאֹ֑ד מִ/לְּב֥וֹא חֲמָ֖ת עַד נַ֥חַל מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/008.yaml
  text: At that time Solomon kept the feast for seven days[a], and all Israel with him, a very great assembly[b], from Lebo-hamath to the Brook of Egypt.
translation:
  language: pt
  text: Naquele tempo, Salomão celebrou a festa durante sete dias, e todo o Israel com ele — uma assembleia imensa —, desde Lebo-Hamate[a] até o ribeiro do Egito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desde a entrada de Hamate”. O hebraico pode ser entendido como um nome de lugar (“Lebo-Hamate”) ou como uma expressão descritiva de fronteira.
    reason: alternative_reading
  - marker: b
    text: Ou “até o uádi do Egito”. A palavra hebraica pode designar um curso de água sazonal ou seu leito, em vez de um grande rio.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: celebrou
  rationale: Embora o verbo signifique literalmente “fez”, em combinação com חָג expressa de modo idiomático a celebração de uma festa.
- source_word: הֶחָג
  choice: a festa
  rationale: חָג designa uma festa religiosa, em especial uma festa de peregrinação. “A festa” preserva o artigo definido e é natural em português.
- source_word: בָּעֵת הַהִיא
  choice: Naquele tempo
  rationale: Tradução direta e natural da expressão temporal hebraica.
- source_word: שִׁבְעַת יָמִים
  choice: durante sete dias
  rationale: Explicita em português corrente a duração da celebração.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: e todo o Israel com ele
  rationale: Mantém o sentido coletivo nacional de “todo o Israel” e a ideia de acompanhamento expressa por עִמּוֹ.
- source_word: קָהָל גָּדוֹל מְאֹד
  choice: uma assembleia imensa
  rationale: A expressão está em aposição a “todo o Israel”. “Assembleia” corresponde bem a קָהָל, e “imensa” comunica naturalmente a forte intensificação de גָּדוֹל מְאֹד.
- source_word: מִלְּבוֹא חֲמָת
  choice: desde Lebo-Hamate
  rationale: Trata a expressão como topônimo ou designação geográfica fixa da fronteira setentrional, sem ocultar a leitura descritiva possível, indicada em nota.
- source_word: עַד נַחַל מִצְרָיִם
  choice: até o ribeiro do Egito
  rationale: נַחַל pode designar um ribeiro, torrente ou leito sazonal, e não necessariamente um grande rio. “Ribeiro” é claro e tradicional, enquanto a alternativa geográfica mais técnica aparece em nota.
