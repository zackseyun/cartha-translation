  text: וְ/הַ/מֶּ֖לֶךְ וְ/כָל הָ/עָ֑ם זֹבְחִ֥ים זֶ֖בַח לִ/פְנֵ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/004.yaml
  text: Then the king and all the people offered sacrifices before Yahweh[a].
translation:
  language: pt
  text: Então o rei e todo o povo ofereciam sacrifícios diante de Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “sacrificavam um sacrifício” — uma construção com palavras da mesma raiz que significa oferecer sacrifícios.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  choice: Então o rei
  rationale: O וְ dá continuidade à narrativa e, neste contexto, pode ser expresso naturalmente por “Então”; הַמֶּלֶךְ significa “o rei”.
- source_word: וְכָל הָעָם
  choice: e todo o povo
  rationale: עָם designa aqui o povo reunido de modo abrangente; “todo o povo” é direto e natural.
- source_word: זֹבְחִים זֶבַח
  choice: ofereciam sacrifícios
  rationale: O particípio predicativo indica ação em andamento. A construção cognata hebraica, literalmente “sacrificavam um sacrifício”, é vertida de modo idiomático, sem perder o sentido sacrificial.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Preserva o sentido espacial e cultual de agir na presença de Deus, em português corrente e digno.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal e evita sua substituição interpretativa por um título.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O imperfeito “ofereciam” preserva o caráter contínuo do particípio hebraico; a expressão cognata foi naturalizada e explicada em nota.
