  text: וְ/הַ/בַּ֤יִת הַ/זֶּה֙ אֲשֶׁ֣ר הָיָ֣ה עֶלְי֔וֹן לְ/כָל עֹבֵ֥ר עָלָ֖י/ו יִשֹּׁ֑ם וְ/אָמַ֗ר בַּ/מֶּ֨ה עָשָׂ֤ה יְהוָה֙ כָּ֔כָה לָ/אָ֥רֶץ הַ/זֹּ֖את וְ/לַ/בַּ֥יִת הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/021.yaml
  text: And this house[a], which was exalted, will become a horror to everyone passing by it, and they will say[b], 'Why has Yahweh done thus to this land and to this house?'
translation:
  language: pt
  text: 'E esta casa[a], que era elevada, todo aquele que passar por ela ficará espantado[b] e dirá: “Por que Yahweh fez isso a esta terra e a esta casa?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “casa” se refere ao templo.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico também pode ser entendido como referindo-se à casa: “ela se tornará uma desolação” ou “um objeto de espanto”. A forma verbal também pode enfatizar o assombro de quem passa por ela.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבַּיִת הַזֶּה
  choice: E esta casa
  rationale: בַּיִת significa literalmente “casa” e, no contexto, designa o templo. Manter “casa” preserva a formulação hebraica e sua ressonância como casa de Yahweh; uma nota esclarece o referente.
- source_word: אֲשֶׁר הָיָה עֶלְיוֹן
  choice: que era exaltada
  rationale: עֶלְיוֹן pode indicar algo elevado, sublime ou de grande destaque. “Exaltada” conserva tanto a proeminência quanto a grandeza anterior da casa, sem limitar a expressão à altura física.
- source_word: לְכָל עֹבֵר עָלָיו יִשֹּׁם
  choice: deixará horrorizado todo aquele que passar por ela
  rationale: Na sintaxe mais direta, כָּל עֹבֵר (“todo aquele que passar”) é o sujeito do verbo singular יִשֹּׁם, que descreve espanto ou horror diante da devastação. A formulação portuguesa explicita naturalmente que a casa em ruínas provoca essa reação, sem eliminar em nota o possível destaque dado à desolação da própria casa.
- source_word: וְאָמַר
  choice: e ele perguntará
  rationale: O verbo está no singular e retoma distributivamente “todo aquele que passar”. “Perguntará” introduz de modo idiomático a pergunta direta que segue.
- source_word: בַּמֶּה
  choice: Por que
  rationale: A expressão significa literalmente “por causa de quê?”; “Por que” é a forma corrente e exata em português para perguntar a razão do juízo visível.
- source_word: עָשָׂה יְהוָה כָּכָה
  choice: Yahweh fez isso
  rationale: O perfeito עָשָׂה é adequadamente expresso pelo pretérito perfeito português. “Isso” traduz כָּכָה de forma natural no português atual, remetendo ao estado devastado observado.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לָאָרֶץ הַזֹּאת וְלַבַּיִת הַזֶּה
  choice: com esta terra e com esta casa
  rationale: “Terra” mantém o sentido amplo e as ressonâncias pactuais de אֶרֶץ. A repetição de “casa” conserva a correspondência lexical do verso; a preposição “com” é idiomática em português após “fazer isso”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
- issue: Agente ou foco de יִשֹּׁם
  choice: o transeunte ficará horrorizado diante da casa
  alternative: a casa ficará desolada ou se tornará motivo de horror
  rationale: A concordância singular favorece “todo aquele que passar” como sujeito de יִשֹּׁם. Contudo, a raiz שמם também associa o espanto à devastação; por isso, a nota mantém a alternativa sem reduzir a tensão entre ruína e reação humana.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A construção singular “todo aquele... ele” acompanha a forma distributiva do hebraico. “Fez isso” foi preferido a “fez assim” por soar mais natural na pergunta sobre a devastação visível.
