  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְקַדֵּ֣שׁ שְׁלֹמֹ֗ה אֶת תּ֤וֹךְ הֶֽ/חָצֵר֙ אֲשֶׁר֙ לִ/פְנֵ֣י בֵית יְהוָ֔ה כִּֽי עָ֤שָׂה שָׁם֙ הָֽ/עֹל֔וֹת וְ/אֵ֖ת חֶלְבֵ֣י הַ/שְּׁלָמִ֑ים כִּֽי מִזְבַּ֤ח הַ/נְּחֹ֨שֶׁת֙ אֲשֶׁ֣ר עָשָׂ֣ה שְׁלֹמֹ֔ה לֹ֣א יָכ֗וֹל לְ/הָכִ֛יל אֶת הָ/עֹלָ֥ה וְ/אֶת הַ/מִּנְחָ֖ה וְ/אֶת הַ/חֲלָבִֽים־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/007.yaml
  text: Then Solomon consecrated the middle of the court that was before the house of Yahweh[a], because there he offered the burnt offerings and the fat portions of the peace offerings, because the bronze altar that Solomon had made could not hold the burnt offering, the grain offering[c][b], and the fat portions.
translation:
  language: pt
  text: Então Salomão consagrou o centro do pátio que ficava diante da casa de Yahweh, pois ali ofereceu os holocaustos e as porções de gordura das ofertas de comunhão[a]. Isso foi necessário porque o altar de bronze que Salomão havia feito não comportava o holocausto, a oferta de cereal e as porções de gordura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ofertas pacíficas” ou “ofertas de paz”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַדֵּשׁ
  choice: consagrou
  rationale: No hifil, o verbo indica destinar um espaço ao uso sagrado; “consagrou” é natural e mantém o sentido cultual.
- source_word: תּוֹךְ הֶחָצֵר
  choice: o centro do pátio
  rationale: תּוֹךְ designa aqui o meio ou a área central do pátio, não apenas seu interior de modo genérico.
- source_word: לִפְנֵי בֵית יְהוָה
  choice: diante da casa de Yahweh
  rationale: A expressão é espacial. “Casa de Yahweh” preserva a designação hebraica do templo e o nome divino.
- source_word: עָשָׂה שָׁם
  choice: ali ofereceu
  rationale: Embora עָשָׂה signifique literalmente “fez”, no contexto sacrificial expressa idiomaticamente a realização ou oferta dos sacrifícios.
- source_word: הָעֹלוֹת / הָעֹלָה
  choice: os holocaustos / o holocausto
  rationale: “Holocausto” é o termo cultual estabelecido em português para a oferta totalmente queimada; preservam-se, quando natural, o plural inicial e o singular coletivo posterior.
- source_word: חֶלְבֵי הַשְּׁלָמִים
  choice: as porções de gordura das ofertas de comunhão
  rationale: חֵלֶב refere-se às partes gordurosas reservadas para o altar, e שְׁלָמִים designa sacrifícios associados à comunhão, bem-estar e paz.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: o altar de bronze
  rationale: “Bronze” é a designação moderna mais natural para נְחֹשֶׁת no contexto do mobiliário do templo.
- source_word: לֹא יָכוֹל לְהָכִיל
  choice: não comportava
  rationale: Expressa de forma concisa que o altar não tinha capacidade suficiente para conter as ofertas.
- source_word: הַמִּנְחָה
  choice: a oferta de cereal
  rationale: No contexto sacrificial, מִנְחָה é o termo técnico para uma oferta vegetal, normalmente composta de cereal.
- source_word: הַחֲלָבִים
  choice: as porções de gordura
  rationale: O plural indica as partes gordurosas específicas destinadas ao sacrifício, e não gordura em sentido genérico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” o representa por transliteração, sem substituí-lo por um título.
- issue: Sentido de הַשְּׁלָמִים
  choice: ofertas de comunhão
  alternative: ofertas pacíficas; ofertas de paz
  rationale: O termo pode evocar paz, bem-estar e comunhão. “Ofertas de comunhão” comunica a dimensão relacional sem eliminar totalmente a amplitude do termo; a alternativa tradicional é registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com terminologia sacrificial reconhecível. A repetição hebraica de כִּי foi articulada como “pois” e “Isso foi necessário porque” para preservar a relação causal sem produzir uma sequência pesada. O sujeito de “ofereceu” permanece Salomão, conforme a construção hebraica.
