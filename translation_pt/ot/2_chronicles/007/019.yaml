  text: וְ/אִם תְּשׁוּב֣וּ/ן אַתֶּ֔ם וַ/עֲזַבְתֶּם֙ חֻקּוֹתַ֣/י וּ/מִצְוֺתַ֔/י אֲשֶׁ֥ר נָתַ֖תִּי לִ/פְנֵי/כֶ֑ם וַ/הֲלַכְתֶּ֗ם וַ/עֲבַדְתֶּם֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/הִשְׁתַּחֲוִיתֶ֖ם לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/019.yaml
  text: But if you turn away and abandon my statutes and my commandments that I have set before you, and go and serve other gods and bow down to them,
translation:
  language: pt
  text: Mas, se vocês se afastarem, abandonarem os meus estatutos e os meus mandamentos que coloquei diante de vocês, e forem servir a outros deuses e se curvarem diante deles,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּשׁוּבוּן
  choice: se afastarem
  rationale: No contexto, o verbo שׁוב indica voltar-se para longe de Deus; a formulação expressa claramente a mudança de lealdade sem acrescentar uma ideia ausente.
- source_word: וַעֲזַבְתֶּם
  choice: abandonarem
  rationale: Traduz diretamente עזב e preserva a força da ruptura com os estatutos e mandamentos divinos.
- source_word: חֻקּוֹתַי
  choice: os meus estatutos
  rationale: Mantém a distinção lexical de חֹק em relação a מִצְוָה, com linguagem bíblica digna e compreensível.
- source_word: מִצְוֺתַי
  choice: os meus mandamentos
  rationale: Equivalente corrente e preciso para מִצְוָה.
- source_word: נָתַתִּי לִפְנֵיכֶם
  choice: coloquei diante de vocês
  rationale: Reproduz a imagem hebraica de apresentar ou pôr as exigências diante do povo.
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: se curvarem diante deles
  rationale: Preserva o gesto concreto de prostração reverente, que neste contexto constitui culto aos outros deuses.
theological_decisions:
- issue: Natureza da apostasia descrita
  choice: Manter a sequência de afastamento, abandono, serviço e prostração
  alternative: Resumir como “adorarem outros deuses”
  rationale: A sequência hebraica explicita tanto a rejeição da aliança quanto os atos de lealdade cultual a outros deuses; condensá-la apagaria nuances do texto.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com tratamento plural por “vocês”. A oração permanece aberta com vírgula final porque a consequência da condição aparece no versículo seguinte.
