  text: וְ/יִכָּנְע֨וּ עַמִּ֜/י אֲשֶׁ֧ר נִֽקְרָא שְׁמִ֣/י עֲלֵי/הֶ֗ם וְ/יִֽתְפַּֽלְלוּ֙ וִֽ/יבַקְשׁ֣וּ פָנַ֔/י וְ/יָשֻׁ֖בוּ מִ/דַּרְכֵי/הֶ֣ם הָ/רָעִ֑ים וַ/אֲנִי֙ אֶשְׁמַ֣ע מִן הַ/שָּׁמַ֔יִם וְ/אֶסְלַח֙ לְ/חַטָּאתָ֔/ם וְ/אֶרְפָּ֖א אֶת אַרְצָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/014.yaml
  text: if my people[a], who are called by my name, humble themselves, and pray and seek my face, and turn from their evil ways, then I will hear from heaven, and I will forgive their sin and heal their land.
translation:
  language: pt
  text: se o meu povo[a], que é chamado pelo meu nome, se humilhar, orar, buscar a minha face e se afastar dos seus maus caminhos, então eu ouvirei dos céus, perdoarei o seu pecado e curarei a sua terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “sobre o qual o meu nome é invocado”; expressão hebraica que indica pertencer a Deus ou levar o seu nome.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִכָּנְעוּ
  choice: se humilhar
  rationale: O nifal de כנע tem aqui sentido reflexivo/intransitivo dentro da condição. “Se humilhar” é natural em português e preserva a resposta voluntária do povo.
- source_word: עַמִּי
  choice: o meu povo
  rationale: Designação coletiva e pactual direta; o singular coletivo do hebraico é preservado naturalmente.
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עֲלֵיהֶם
  choice: sobre o qual o meu nome é invocado
  rationale: A formulação mantém a imagem hebraica de o nome ser invocado sobre alguém, expressão que indica pertencimento e identificação com Deus, sem reduzi-la apenas a receber um nome.
- source_word: וְיִתְפַּלְלוּ
  choice: orar
  rationale: O hitpael de פלל significa normalmente “orar”. O destinatário fica implícito no contexto, como no hebraico.
- source_word: וִיבַקְשׁוּ פָנַי
  choice: buscar a minha face
  rationale: Preserva a metáfora explícita da face divina e sua riqueza relacional, permanecendo compreensível em português atual.
- source_word: וְיָשֻׁבוּ מִדַּרְכֵיהֶם הָרָעִים
  choice: se afastar dos seus maus caminhos
  rationale: שׁוב expressa mudança de direção e arrependimento. “Afastar-se de” comunica de modo natural o abandono da conduta má, enquanto “caminhos” preserva a imagem e o plural hebraicos.
- source_word: וַאֲנִי אֶשְׁמַע מִן הַשָּׁמַיִם
  choice: então eu ouvirei dos céus
  rationale: “Então” explicita a apódose indicada pela sequência discursiva; “dos céus” reflete מן־השמים e preserva o plural convencional da expressão hebraica.
- source_word: וְאֶסְלַח לְחַטָּאתָם
  choice: perdoarei o seu pecado
  rationale: Mantém o substantivo singular coletivo do hebraico e expressa naturalmente a culpa coletiva do povo.
- source_word: וְאֶרְפָּא אֶת אַרְצָם
  choice: curarei a sua terra
  rationale: Preserva literalmente a metáfora de רפא, apresentando a terra como ferida ou afligida e a ação divina como cura.
theological_decisions:
- issue: Estrutura condicional da resposta divina
  choice: Introduzir a condição com “se” e a resposta com “então”.
  alternative: Coordenar todas as orações apenas com “e”.
  rationale: Embora o hebraico empregue conjunções em sequência, o contexto sintático apresenta condição e resultado. A formulação portuguesa torna essa relação clara sem alterar seu conteúdo.
- issue: Idioma pactual do nome divino
  choice: “sobre o qual o meu nome é invocado”
  alternative: “que é chamado pelo meu nome”
  rationale: A tradução escolhida conserva mais diretamente a construção hebraica e sua ideia de pertencimento ou identificação com Deus. A nota esclarece o idioma sem restringi-lo a uma única paráfrase.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para uma enumeração natural, mantendo a condição, as quatro respostas humanas e as três ações divinas. Evitou-se linguagem denominacional e preservaram-se as metáforas “buscar a minha face” e “curarei a sua terra”.
