source:
  edition: WLC
  text: וּ/נְתַשְׁתִּ֗י/ם מֵ/עַ֤ל אַדְמָתִ/י֙ אֲשֶׁ֣ר נָתַ֣תִּי לָ/הֶ֔ם וְ/אֶת הַ/בַּ֤יִת הַ/זֶּה֙ אֲשֶׁ֣ר הִקְדַּ֣שְׁתִּי לִ/שְׁמִ֔/י אַשְׁלִ֖יךְ מֵ/עַ֣ל פָּנָ֑/י וְ/אֶתְּנֶ֛/נּוּ לְ/מָשָׁ֥ל וְ/לִ/שְׁנִינָ֖ה בְּ/כָל הָ/עַמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/020.yaml
  text: then I will uproot them from my land that I have given them[a], and this house that I have consecrated for my name I will cast out of my sight[c][b], and I will make it a proverb and a byword among all peoples.
translation:
  language: pt
  text: então eu os arrancarei da minha terra, que lhes dei; e esta casa[a], que consagrei ao meu nome, eu a lançarei para longe da minha presença[b] e farei dela um provérbio e motivo de zombaria[c] entre todos os povos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “este templo”. Em hebraico, literalmente, “esta casa”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “de diante do meu rosto”.
    reason: lexical_alternative
  - marker: c
    text: Ou “um dito e objeto de escárnio”; também se pode entender “uma provocação e um dito de zombaria”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַשְׁתִּים
  choice: então eu os arrancarei
  rationale: O verbo נתשׁ comunica arrancar ou desarraigar. “Arrancarei” preserva a imagem de remoção violenta da terra; “então” expressa naturalmente a consequência da condição apresentada no versículo anterior.
- source_word: מֵעַל אַדְמָתִי
  choice: da minha terra
  rationale: אַדָמָה pode designar solo ou terra. Neste contexto de dádiva territorial da aliança, “terra” é a opção mais natural e mantém a afirmação da posse divina.
- source_word: אֲשֶׁר נָתַתִּי לָהֶם
  choice: que lhes dei
  rationale: Reproduz de forma direta e natural a oração relativa hebraica e o ato anterior da dádiva.
- source_word: הַבַּיִת הַזֶּה
  choice: esta casa
  rationale: בַּיִת significa literalmente “casa” e aqui se refere ao templo. Manter “casa” preserva a designação hebraica e a conhecida imagem bíblica da casa de Deus.
- source_word: הִקְדַּשְׁתִּי לִשְׁמִי
  choice: consagrei ao meu nome
  rationale: A forma causativa de קדשׁ indica separar como santo. “Consagrei” mantém a força cultual, e “ao meu nome” conserva o conceito teológico do nome divino sem o reduzir a “para mim”.
- source_word: אַשְׁלִיךְ מֵעַל פָּנַי
  choice: eu a lançarei para longe da minha presença
  rationale: O hebraico fala literalmente em lançar de diante da face de Deus. A formulação portuguesa comunica rejeição divina com clareza, sem exigir uma leitura física do rosto de Deus.
- source_word: וְאֶתְּנֶנּוּ
  choice: e farei dela
  rationale: Neste uso, נתן seguido de substantivos predicativos significa colocar ou tornar algo em determinada condição. “Farei dela” é claro e idiomático.
- source_word: לְמָשָׁל
  choice: um provérbio
  rationale: מָשָׁל pode ser provérbio, dito exemplar ou expressão de escárnio. “Provérbio” preserva o sentido básico e deixa o elemento depreciativo explícito no termo seguinte.
- source_word: לִשְׁנִינָה
  choice: motivo de zombaria
  rationale: שְׁנִינָה designa um dito mordaz ou algo de que se zomba. “Motivo de zombaria” comunica esse sentido em português corrente melhor que o menos acessível “objeto de escárnio”.
- source_word: בְּכָל הָעַמִּים
  choice: entre todos os povos
  rationale: Mantém o plural עַמִּים e evita transformar desnecessariamente os grupos humanos em entidades políticas, como poderia sugerir “nações”.
theological_decisions:
- issue: Designação do templo
  choice: esta casa
  alternative: este templo
  rationale: Embora o referente seja o templo, o hebraico diz “casa”. A opção mantém a linguagem bíblica da casa de Deus sem impedir a compreensão contextual.
- issue: Expressão da rejeição divina
  choice: para longe da minha presença
  alternative: de diante do meu rosto
  rationale: A tradução comunica a exclusão e a rejeição expressas pelo idioma hebraico, preservando em nota sua imagem literal e evitando uma formulação antropomórfica pouco natural no texto principal.
- issue: Natureza da vergonha pública
  choice: um provérbio e motivo de zombaria
  alternative: um dito e objeto de escárnio
  rationale: A dupla expressão mantém tanto a transformação da casa em exemplo proverbial quanto a dimensão de desprezo público, sem restringir מָשָׁל exclusivamente a uma provocação hostil.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada à sintaxe portuguesa, mas a metáfora de arrancar, a designação “casa”, a consagração ao nome divino e os dois termos de vergonha pública foram preservados.
