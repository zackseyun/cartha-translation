  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/כְ/כַלּ֤וֹת שְׁלֹמֹה֙ לְ/הִתְפַּלֵּ֔ל וְ/הָ/אֵ֗שׁ יָֽרְדָה֙ מֵֽ/הַ/שָּׁמַ֔יִם וַ/תֹּ֥אכַל הָ/עֹלָ֖ה וְ/הַ/זְּבָחִ֑ים וּ/כְב֥וֹד יְהוָ֖ה מָלֵ֥א אֶת הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/001.yaml
  text: And when Solomon finished praying[a], the fire came down from heaven and consumed the burnt offering and the sacrifices[b], and the glory of Yahweh filled the house.
translation:
  language: pt
  text: Quando Salomão terminou de orar, o fogo desceu do céu e consumiu o holocausto e os sacrifícios, e a glória de Yahweh encheu a casa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o templo; em hebraico, “a casa”.
    reason: cultural_note
lexical_decisions:
- source_word: וּכְכַלּוֹת שְׁלֹמֹה לְהִתְפַּלֵּל
  choice: Quando Salomão terminou de orar
  rationale: A construção temporal com o infinitivo de כלה indica que a ação seguinte ocorreu quando Salomão concluiu a oração. A formulação é natural em português e não acrescenta uma ideia de imediatismo além do texto.
- source_word: וְהָאֵשׁ
  choice: o fogo
  rationale: O artigo hebraico apresenta um fogo específico no contexto narrativo; por isso, mantém-se o artigo definido.
- source_word: יָרְדָה מֵהַשָּׁמַיִם
  choice: desceu do céu
  rationale: Expressa diretamente o movimento descendente e a procedência celestial. O singular “céu” é a forma idiomática normal em português neste contexto.
- source_word: וַתֹּאכַל
  choice: consumiu
  rationale: Embora o verbo possa significar literalmente “comer”, quando o fogo é o sujeito, “consumir” é a equivalência idiomática e precisa.
- source_word: הָעֹלָה
  choice: o holocausto
  rationale: No vocabulário sacrificial, עֹלָה designa a oferta inteiramente queimada. “Holocausto” é o termo bíblico tradicional e reconhecível em português para esse sacrifício.
- source_word: וְהַזְּבָחִים
  choice: e os sacrifícios
  rationale: O plural זְבָחִים é mais amplo que עֹלָה e deve permanecer distinto do holocausto mencionado antes.
- source_word: וּכְבוֹד יְהוָה
  choice: e a glória de Yahweh
  rationale: כָּבוֹד indica aqui a manifestação gloriosa da presença divina; o nome próprio יהוה é transliterado como “Yahweh”.
- source_word: מָלֵא אֶת־הַבָּיִת
  choice: encheu a casa
  rationale: “Casa” preserva o sentido lexical de בַּיִת e a linguagem característica de Crônicas para o templo; uma nota esclarece a referência contextual.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome pessoal. “Yahweh” o representa por transliteração, sem substituí-lo por um título.
- issue: Referência de הַבָּיִת
  choice: a casa
  alternative: o templo
  rationale: O hebraico diz literalmente “a casa”, enquanto o contexto identifica essa casa como o templo. A tradução conserva a expressão do original e a nota explicita o referente.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem narrativa e a terminologia sacrificial foram preservadas sem tornar a frase artificial. A pontuação mantém as ações coordenadas do hebraico.
