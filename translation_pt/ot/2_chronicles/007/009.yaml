source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֛וּ בַּ/יּ֥וֹם הַ/שְּׁמִינִ֖י עֲצָ֑רֶת כִּ֣י חֲנֻכַּ֣ת הַ/מִּזְבֵּ֗חַ עָשׂוּ֙ שִׁבְעַ֣ת יָמִ֔ים וְ/הֶ/חָ֖ג שִׁבְעַ֥ת יָמִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/009.yaml
  text: On the eighth day they held a solemn assembly[b][a], for they observed the dedication of the altar for seven days and the feast for seven days.
translation:
  language: pt
  text: No oitavo dia, realizaram uma assembleia solene[a], pois celebraram[b] a dedicação do altar durante sete dias e a festa durante sete dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “assembleia” ou “assembleia de encerramento”. O termo hebraico se refere a uma reunião especial que concluía uma celebração sagrada.
    reason: lexical_alternative
  - marker: b
    text: Ou “realizaram”; mais literalmente, “fizeram”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצָרֶת
  choice: assembleia solene
  rationale: O termo designa uma reunião especial, de caráter sagrado, que conclui um período festivo. “Assembleia solene” preserva tanto a ideia de reunião quanto seu peso religioso.
- source_word: כִּי
  choice: pois
  rationale: A conjunção introduz aqui a explicação para a assembleia do oitavo dia; “pois” expressa naturalmente essa relação em português.
- source_word: חֲנֻכַּת הַמִּזְבֵּחַ
  choice: a dedicação do altar
  rationale: A expressão se refere à cerimônia de inauguração e dedicação cultual do altar; esta formulação é clara, tradicional e fiel ao contexto.
- source_word: עָשׂוּ
  choice: celebraram
  rationale: Embora o verbo signifique literalmente “fizeram”, neste contexto indica a realização de uma cerimônia religiosa. “Celebraram” comunica isso com naturalidade, sem ocultar a alternativa mais literal, registrada em nota.
- source_word: וְהֶחָג
  choice: e a festa
  rationale: O substantivo definido indica a celebração festiva conhecida pelo contexto. “A festa” mantém a concisão do hebraico sem inserir no versículo sua identificação específica.
- source_word: שִׁבְעַת יָמִים
  choice: durante sete dias
  rationale: A preposição “durante” torna explícito em português o valor temporal da expressão e produz uma frase natural.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: No oitavo dia
  rationale: Reproduz diretamente a expressão hebraica sem acrescentar “da festa”, informação que vem apenas do contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “sete dias” foi preservada por corresponder à estrutura enfática do hebraico; evitou-se identificar explicitamente a festa como Festa das Cabanas, pois isso não aparece no texto deste versículo.
