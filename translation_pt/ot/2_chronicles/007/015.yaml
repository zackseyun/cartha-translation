  text: עַתָּ֗ה עֵינַ/י֙ יִהְי֣וּ פְתֻח֔וֹת וְ/אָזְנַ֖/י קַשֻּׁב֑וֹת לִ/תְפִלַּ֖ת הַ/מָּק֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/015.yaml
  text: Now my eyes will be open and my ears attentive to the prayer offered in this place[a].
translation:
  language: pt
  text: Agora, os meus olhos estarão abertos, e os meus ouvidos, atentos à oração deste lugar[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à oração feita neste lugar” ou “à oração que vier deste lugar”. Mais literalmente, o hebraico diz “à oração deste lugar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Agora
  rationale: Marca o resultado presente da dedicação anterior. “Agora” é natural e mantém a precisão do advérbio sem ampliar para “de agora em diante”.
- source_word: עֵינַי
  choice: os meus olhos
  rationale: Preserva literalmente a imagem antropomórfica e o possessivo de primeira pessoa.
- source_word: יִהְיוּ פְתֻחוֹת
  choice: estarão abertos
  rationale: Expressa de modo natural em português o estado futuro indicado por היה com o particípio passivo.
- source_word: וְאָזְנַי
  choice: e os meus ouvidos
  rationale: Mantém o paralelismo concreto com “os meus olhos” e não transforma a imagem em uma abstração.
- source_word: קַשֻּׁבוֹת
  choice: atentos
  rationale: Comunica a ideia de escuta cuidadosa e concorda com “ouvidos”, preservando o paralelismo com “abertos”.
- source_word: לִתְפִלַּת
  choice: à oração
  rationale: A preposição ל indica que a atenção se dirige à oração; o singular definido corresponde de perto à construção hebraica.
- source_word: הַמָּקוֹם הַזֶּה
  choice: deste lugar
  rationale: Reproduz formalmente a relação construta, literalmente “a oração deste lugar”, sem inserir no texto principal uma explicação interpretativa.
theological_decisions:
- issue: Linguagem antropomórfica sobre a percepção de Deus
  choice: Preservar “os meus olhos” e “os meus ouvidos”
  alternative: Parafrasear como “estarei olhando e ouvindo”
  rationale: O hebraico emprega imagens corporais para retratar a atenção divina. Mantê-las respeita a linguagem relacional e pactual do texto sem reduzir sua força.
- issue: Relação entre a oração e o lugar
  choice: Manter a formulação ambígua “à oração deste lugar”
  alternative: Explicitar como “à oração feita neste lugar” ou “à oração que vier deste lugar”
  rationale: O construto hebraico não especifica se a oração é feita no lugar, associada a ele ou procede dele; a tradução principal preserva essa abertura, e a nota registra as leituras contextuais possíveis.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A vírgula elíptica em “e os meus ouvidos, atentos” evita repetir “estarão” e conserva o paralelismo poético.
