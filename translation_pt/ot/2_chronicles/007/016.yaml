  text: וְ/עַתָּ֗ה בָּחַ֤רְתִּי וְ/הִקְדַּ֨שְׁתִּי֙ אֶת הַ/בַּ֣יִת הַ/זֶּ֔ה לִ/הְיוֹת שְׁמִ֥/י שָׁ֖ם עַד עוֹלָ֑ם וְ/הָי֨וּ עֵינַ֧/י וְ/לִבִּ֛/י שָׁ֖ם כָּל הַ/יָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/016.yaml
  text: And now I have chosen and consecrated this house[a], that my name may be there forever[b], and my eyes and my heart will be there all the days.
translation:
  language: pt
  text: E agora escolhi e consagrei esta casa[a], para que o meu nome esteja ali para sempre, e os meus olhos e o meu coração estarão ali todos os dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o templo.
    reason: Nota cultural para esclarecer que “esta casa” se refere ao templo, mantendo a expressão literal no texto.
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a ligação com o discurso anterior quanto a transição temporal marcada no hebraico.
- source_word: בָּחַרְתִּי
  choice: escolhi
  rationale: O perfeito hebraico apresenta a escolha divina como ato concluído; o pretérito perfeito é a forma natural em português.
- source_word: וְהִקְדַּשְׁתִּי
  choice: e consagrei
  rationale: No hifil, o verbo significa separar como santo. “Consagrei” comunica esse sentido de modo claro e apropriado ao contexto do templo.
- source_word: הַבַּיִת הַזֶּה
  choice: esta casa
  rationale: Mantém a expressão concreta do hebraico; no contexto, “casa” designa o templo.
- source_word: לִהְיוֹת שְׁמִי שָׁם
  choice: para que o meu nome esteja ali
  rationale: Expressa a finalidade da construção infinitiva sem substituir “meu nome” por uma interpretação como “minha presença”.
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: É a formulação portuguesa mais natural e concisa para duração permanente neste contexto.
- source_word: וְהָיוּ עֵינַי וְלִבִּי שָׁם
  choice: e os meus olhos e o meu coração estarão ali
  rationale: Preserva literalmente as imagens antropomórficas de atenção e compromisso divinos.
- source_word: כָּל הַיָּמִים
  choice: todos os dias
  rationale: Conserva a formulação temporal concreta do hebraico, permanecendo natural e compreensível em português.
theological_decisions:
- issue: 'Linguagem antropomórfica a respeito de Deus: “meus olhos e meu coração”'
  choice: Preservar literalmente a imagem antropomórfica
  alternative: Parafrasear como “minha atenção e meu cuidado estarão ali”
  rationale: O hebraico emprega intencionalmente linguagem corporal para exprimir a atenção e o compromisso de Deus; a tradução não deve eliminar essa textura teológica.
- issue: Teologia do templo na expressão “meu nome esteja ali”
  choice: Manter “meu nome”
  alternative: Traduzir como “minha presença esteja ali” ou “eu esteja ali”
  rationale: A expressão pertence à linguagem veterotestamentária do templo e mantém uma tensão própria entre o nome, a presença e a transcendência de Deus; explicá-la no corpo do texto resolveria indevidamente essa tensão.
- issue: Relação entre “para sempre” e “todos os dias”
  choice: Manter as duas expressões temporais do texto
  alternative: Harmonizá-las em uma única formulação, como “estarei sempre atento a ela”
  rationale: A repetição com termos distintos é própria do hebraico e associa a permanência do nome de Deus à sua atenção contínua, sem que a tradução precise uniformizá-las.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém “casa”, “meu nome”, “meus olhos” e “meu coração” para preservar as imagens e a linguagem teológica do hebraico. A colocação “o meu/meus” é natural em registro bíblico internacional e não compromete a leitura no Brasil.
