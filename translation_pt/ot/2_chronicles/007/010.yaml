base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/010.yaml
  text: And on the twenty-third day of the seventh month he sent the people to their tents[b][a], rejoicing and glad of heart because of the goodness that Yahweh had shown to David and to Solomon and to Israel his people.
translation:
  language: pt
  text: No vigésimo terceiro dia do sétimo mês, ele mandou o povo de volta para as suas tendas[a], alegre e de coração contente por causa do bem que Yahweh tinha feito a Davi, a Salomão e a Israel, seu povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para as suas casas”; literalmente, “para as suas tendas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם עֶשְׂרִים וּשְׁלֹשָׁה לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: No vigésimo terceiro dia do sétimo mês
  rationale: Emprega a forma corrente de indicar datas em português; a conjunção inicial não precisa ser reproduzida mecanicamente para manter a fluidez narrativa.
- source_word: שִׁלַּח אֶת־הָעָם
  choice: ele mandou o povo de volta
  rationale: O piel de שלח, no contexto do encerramento da assembleia, indica que ele dispensou o povo para regressar. A expressão é natural e explicita o sentido contextual sem identificar novamente o sujeito.
- source_word: לְאָהֳלֵיהֶם
  choice: para as suas tendas
  rationale: Conserva a imagem concreta do hebraico, embora a expressão possa designar idiomaticamente as casas ou os lares.
- source_word: שְׂמֵחִים וְטוֹבֵי לֵב
  choice: alegres e de coração contente
  rationale: Reproduz tanto a alegria quanto a expressão hebraica com 'coração', em linguagem clara e digna.
- source_word: עַל הַטּוֹבָה אֲשֶׁר עָשָׂה יְהוָה
  choice: por todo o bem que Yahweh havia feito
  rationale: עַל introduz a razão da alegria, e עשה com הטובה é vertido naturalmente como 'fazer o bem'. 'Todo o bem' expressa em português o valor coletivo da bondade aqui mencionada sem alterar seus beneficiários.
- source_word: לְדָוִיד וְלִשְׁלֹמֹה וּלְיִשְׂרָאֵל עַמּוֹ
  choice: a Davi, a Salomão e a Israel, seu povo
  rationale: Mantém os três beneficiários marcados por ל e preserva 'seu povo' como aposto de Israel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o tetragrama; 'Yahweh' preserva o caráter de nome próprio sem introduzir uma substituição tradicional por título.
- issue: Referência de עַמּוֹ ('seu povo')
  choice: Israel, seu povo
  alternative: seu povo Israel
  rationale: A pontuação mantém Israel como antecedente imediato e apresenta 'seu povo' como identificação apositiva, sem expandir o sentido teológico do vínculo.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A redação conserva a imagem das tendas e a linguagem do coração, evitando literalismo rígido. A divisão em duas frases torna inequívoco que o povo partiu alegre, sem mudar a relação sintática do hebraico.
