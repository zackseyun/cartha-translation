base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/011.yaml
  text: So Solomon finished the house of Yahweh and the house of the king[c][b][a], and everything that came upon Solomon’s heart to do in the house of Yahweh and in his own house he successfully accomplished.
translation:
  language: pt
  text: Assim, Salomão terminou a casa de Yahweh e a casa do rei[a], e realizou com êxito[c] tudo o que Salomão tinha em mente[b] fazer na casa de Yahweh e em sua própria casa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o palácio real”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “tudo o que veio ao coração de Salomão”; expressão idiomática hebraica para aquilo que ele concebeu, desejou ou pretendeu fazer.
    reason: cultural_note
  - marker: c
    text: O verbo hebraico também pode ser traduzido como “teve êxito” ou “fez prosperar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: terminou
  rationale: O verbo כלה, nesta forma narrativa, indica levar algo à conclusão; “terminou” é natural e mantém a relação direta com as duas construções.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Preserva literalmente בית, “casa”, e verte o nome divino יהוה como “Yahweh”.
- source_word: בֵּית הַמֶּלֶךְ
  choice: a casa do rei
  rationale: Mantém a repetição de “casa” presente no hebraico; no contexto, a expressão pode designar o palácio real.
- source_word: כָּל הַבָּא עַל לֵב שְׁלֹמֹה
  choice: tudo o que veio ao coração de Salomão
  rationale: Conserva a imagem do idioma hebraico, que se refere ao que Salomão concebeu, desejou ou pretendeu realizar.
- source_word: לַעֲשׂוֹת
  choice: fazer
  rationale: É a correspondência ampla e direta de עשה, adequada às obras e aos projetos mencionados no contexto.
- source_word: וּבְבֵיתוֹ
  choice: em sua própria casa
  rationale: O possessivo remete a Salomão; “própria” esclarece o referente em português sem mudar o sentido.
- source_word: הִצְלִיחַ
  choice: realizou com êxito
  rationale: O hifil de צלח pode expressar ter êxito ou fazer prosperar. Aqui, a formulação comunica a execução bem-sucedida de tudo o que Salomão pretendia fazer.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama diretamente; “Yahweh” preserva o nome divino em vez de substituí-lo por um título.
- issue: Sentido de הִצְלִיחַ
  choice: realizou com êxito
  alternative: teve êxito; fez prosperar
  rationale: A construção admite tanto a ideia de ser bem-sucedido quanto a de levar algo a bom resultado. O texto principal expressa o êxito na realização sem atribuir ao verbo uma explicação teológica adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi levemente ajustada para fluência, preservando a repetição de “casa” e a imagem hebraica do coração. Todos os marcadores remetem diretamente às expressões pertinentes.
