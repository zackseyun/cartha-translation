  text: וַ/יֵּרָ֧א יְהוָ֛ה אֶל שְׁלֹמֹ֖ה בַּ/לָּ֑יְלָה וַ/יֹּ֣אמֶר ל֗/וֹ שָׁמַ֨עְתִּי֙ אֶת תְּפִלָּתֶ֔/ךָ וּ/בָחַ֜רְתִּי בַּ/מָּק֥וֹם הַ/זֶּ֛ה לִ֖/י לְ/בֵ֥ית זָֽבַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/012.yaml
  text: Then Yahweh appeared to Solomon by night and said to him[b][a], “I have heard your prayer and have chosen this place for myself as a house of sacrifice.”
translation:
  language: pt
  text: 'Então Yahweh apareceu a Salomão durante a noite[a] e lhe disse: “Ouvi a sua oração e escolhi este lugar para mim como casa de sacrifício[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à noite”.
    reason: lexical_alternative
  - marker: b
    text: Ou “para uma casa de sacrifício”; isto é, um lugar separado para o culto com sacrifícios.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: apareceu
  rationale: O nifal de ראה indica aqui uma manifestação perceptível a Salomão; “apareceu” é natural e preserva o sentido teofânico sem definir o modo da manifestação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בַּלָּיְלָה
  choice: durante a noite
  rationale: Expressa naturalmente em português o valor temporal da preposição ב com “noite”; a nota preserva a alternativa mais concisa.
- source_word: שָׁמַעְתִּי
  choice: Ouvi
  rationale: O perfeito hebraico relata uma ação concluída com relevância imediata. Em português, o pretérito perfeito é a forma narrativa e discursiva mais natural.
- source_word: תְּפִלָּתֶךָ
  choice: a sua oração
  rationale: Tradução direta e corrente do substantivo תְּפִלָּה neste contexto.
- source_word: וּבָחַרְתִּי
  choice: e escolhi
  rationale: Mantém o paralelismo verbal com “Ouvi” e comunica uma decisão divina já tomada.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: este lugar
  rationale: Reproduz diretamente a referência ao local do templo recém-dedicado.
- source_word: לִי
  choice: para mim
  rationale: Preserva o dativo de posse ou finalidade sem ampliar indevidamente o texto para “para mim mesmo”.
- source_word: לְבֵית זָבַח
  choice: como casa de sacrifício
  rationale: Mantém a expressão concreta do hebraico e indica a função cultual do lugar sem substituí-la interpretativamente por “templo”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em forma transliterada, sem substituí-lo por um título.
- issue: Sentido de לְבֵית זָבַח
  choice: como casa de sacrifício
  alternative: para uma casa de sacrifício
  rationale: A formulação escolhida apresenta a função para a qual o lugar foi escolhido, enquanto a nota registra a construção mais literal e sua referência ao culto sacrificial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe permanece próxima do hebraico, mas evita construções artificiais. Os marcadores aparecem junto aos termos que explicam.
