  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֵ֣ן אֶֽעֱצֹ֤ר הַ/שָּׁמַ֨יִם֙ וְ/לֹֽא יִהְיֶ֣ה מָטָ֔ר וְ/הֵן אֲצַוֶּ֥ה עַל חָגָ֖ב לֶ/אֱכ֣וֹל הָ/אָ֑רֶץ וְ/אִם אֲשַׁלַּ֥ח דֶּ֖בֶר בְּ/עַמִּֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/013.yaml
  text: When I shut up the heavens so that there is no rain[a], or command the locust to devour the land, or send pestilence among my people[b],
translation:
  language: pt
  text: Se eu fechar os céus, e não houver chuva[a], ou ordenar aos gafanhotos que devorem a terra, ou enviar uma peste entre o meu povo[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quando eu fechar os céus, e não houver chuva”. A partícula hebraica inicial também pode ser entendida como “quando” ou, mais literalmente, “eis que, se”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “uma epidemia” ou “uma pestilência”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Se
  rationale: A partícula introduz aqui uma situação condicional. “Se” é natural em português e se harmoniza com וְאִם na última oração, sem eliminar a possibilidade de a construção ser entendida temporalmente.
- source_word: אֶעֱצֹר הַשָּׁמַיִם
  choice: eu fechar os céus
  rationale: Preserva a imagem concreta do hebraico para a retenção da chuva e mantém uma dicção bíblica clara.
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: e não houver chuva
  rationale: Reproduz diretamente a consequência expressa no hebraico, em português corrente.
- source_word: אֲצַוֶּה עַל חָגָב
  choice: ordenar aos gafanhotos
  rationale: O singular hebraico é coletivo; o plural em português comunica naturalmente uma infestação de gafanhotos sem alterar o sentido.
- source_word: לֶאֱכֹל הָאָרֶץ
  choice: que devorem a terra
  rationale: “Devorem” transmite a força destrutiva do ato de comer neste contexto, e “a terra” mantém o sentido territorial de הָאָרֶץ.
- source_word: דֶּבֶר
  choice: peste
  rationale: Designa uma doença epidêmica como juízo e conserva a gravidade do termo, sendo mais corrente no português moderno que “pestilência”.
- source_word: בְּעַמִּי
  choice: entre o meu povo
  rationale: A preposição indica a ocorrência da peste no meio do povo; “entre” expressa isso de modo natural.
theological_decisions:
- issue: Os juízos divinos como situações condicionais
  choice: Empregar “Se ... ou ... ou ...”, mantendo Deus como agente direto de cada juízo.
  alternative: “Quando eu fechar...” ou “Eis que, se eu fechar...”
  rationale: A sequência hebraica apresenta possíveis atos de disciplina da aliança. A formulação condicional preserva sua ligação sintática com o versículo seguinte e não suaviza a agência divina.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A imagem bíblica de “fechar os céus” foi preservada; o plural “gafanhotos” torna natural em português o singular coletivo hebraico.
