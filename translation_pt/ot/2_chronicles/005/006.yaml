base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/006.yaml
  text: And King Solomon and all the assembly of Israel who had assembled before him[a], before the ark[b], were sacrificing sheep and cattle that could not be counted or numbered because of their great number.
translation:
  language: pt
  text: O rei Salomão e toda a assembleia de Israel, reunida com ele[a] diante da arca, sacrificavam ovelhas[b] e gado bovino que, de tão numerosos, não podiam ser contados nem enumerados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “reunida diante dele”. A expressão hebraica pode indicar que a assembleia se reuniu com Salomão ou na presença dele.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico traduzido por “ovelhas” é mais amplo e pode incluir animais de pequeno porte, como ovelhas e cabras.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדַת יִשְׂרָאֵל
  choice: assembleia de Israel
  rationale: Preserva o sentido corporativo da comunidade reunida e mantém um registro digno sem empregar linguagem excessivamente eclesiástica.
- source_word: הַנּוֹעָדִים עָלָיו
  choice: reunida com ele
  rationale: O particípio nifal indica a comunidade congregada, e עָלָיו admite aqui o sentido de reunião junto a Salomão. A nota conserva a alternativa espacial 'diante dele'.
- source_word: לִפְנֵי הָאָרוֹן
  choice: diante da arca
  rationale: Expressão espacial direta, natural no português bíblico atual.
- source_word: מְזַבְּחִים
  choice: sacrificavam
  rationale: O imperfeito português representa adequadamente a ação em curso expressa pelo particípio hebraico.
- source_word: צֹאן וּבָקָר
  choice: ovelhas e bois
  rationale: Formulação clara e tradicional para animais de pequeno e grande porte; a nota registra que צֹאן pode abranger também cabras.
- source_word: אֲשֶׁר לֹא יִסָּפְרוּ וְלֹא יִמָּנוּ מֵרֹב
  choice: que, de tão numerosos, não podiam ser contados nem calculados
  rationale: Mantém os dois verbos quase sinônimos, preservando a ênfase hebraica, e expressa naturalmente a relação causal de מֵרֹב.
