source:
  edition: WLC
  text: אָז֩ יַקְהֵ֨יל שְׁלֹמֹ֜ה אֶת זִקְנֵ֣י יִשְׂרָאֵ֗ל וְ/אֶת כָּל רָאשֵׁ֨י הַ/מַּטּ֜וֹת נְשִׂיאֵ֧י הָ/אָב֛וֹת לִ/בְנֵ֥י יִשְׂרָאֵ֖ל אֶל יְרוּשָׁלִָ֑ם לְֽ/הַעֲל֞וֹת אֶת אֲר֧וֹן בְּרִית יְהוָ֛ה מֵ/עִ֥יר דָּוִ֖יד הִ֥יא צִיּֽוֹן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/002.yaml
  text: Then Solomon assembled the elders of Israel and all the heads of the tribes[a], the leaders of the fathers’ houses of the sons of Israel, at Jerusalem, to bring up the ark of the covenant of Yahweh from the city of David[b], that is Zion.
translation:
  language: pt
  text: Então Salomão reuniu em Jerusalém os anciãos de Israel e todos os chefes das tribos, os líderes das casas paternas dos filhos de Israel[a], para fazer subir a arca da aliança de Yahweh da Cidade de Davi, isto é, Sião.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos israelitas”. O hebraico diz literalmente “dos filhos de Israel”, preservando a identidade genealógica e pactual de Israel.
    reason: lexical_alternative
  - marker: b
    text: Ou “que é Sião”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Marca a sequência narrativa de modo natural e direto em português.
- source_word: יַקְהֵיל
  choice: reuniu
  rationale: O hifil de קהל indica fazer uma assembleia ou convocar para reunião; “reuniu” é claro e idiomático com Salomão como sujeito.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: os anciãos de Israel
  rationale: Preserva a designação tradicional do grupo reconhecido de dirigentes.
- source_word: כָּל רָאשֵׁי הַמַּטּוֹת
  choice: todos os chefes das tribos
  rationale: Neste contexto administrativo, מַטּוֹת designa as tribos; “chefes” conserva a imagem de liderança expressa por רָאשֵׁי.
- source_word: נְשִׂיאֵי הָאָבוֹת
  choice: os líderes das casas paternas
  rationale: Expressa a liderança das unidades familiares organizadas segundo a linhagem paterna, sem reduzir a expressão a “famílias”.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: dos filhos de Israel
  rationale: Mantém a expressão genealógica e nacional explícita no hebraico; a alternativa mais corrente é registrada em nota.
- source_word: אֶל יְרוּשָׁלָם
  choice: em Jerusalém
  rationale: Com “reuniu”, o português natural apresenta Jerusalém como o local da assembleia, embora a preposição hebraica também contenha ideia de destino.
- source_word: לְהַעֲלוֹת
  choice: para fazer subir
  rationale: Preserva o valor causativo e a direção ascendente de עלה na transferência da arca para o local elevado.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: a arca da aliança de Yahweh
  rationale: Mantém de forma transparente a cadeia construta e sua referência à aliança ligada ao nome divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico, em vez de substituí-lo por um título.
- source_word: מֵעִיר דָּוִיד
  choice: desde a Cidade de Davi
  rationale: Indica claramente o ponto de origem do deslocamento; a inicial maiúscula trata a expressão como nome tradicional do lugar.
- source_word: הִיא צִיּוֹן
  choice: isto é, Sião
  rationale: Apresenta naturalmente em português a identificação apositiva da Cidade de Davi com Sião.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto traz diretamente o tetragrama; “Yahweh” preserva o nome da aliança sem convertê-lo em título.
- issue: Representação da estrutura de parentesco em לִבְנֵי יִשְׂרָאֵל e הָאָבוֹת
  choice: “filhos de Israel” e “casas paternas”
  alternative: “israelitas” e “famílias ancestrais”
  rationale: O contexto enumera estruturas formais de liderança tribal e genealógica; a tradução mantém essa organização explícita, enquanto registra em nota a forma portuguesa mais compacta.
- issue: Identificação expressa por הִיא צִיּוֹן
  choice: “isto é, Sião”
  alternative: “ela é Sião”
  rationale: A leitura principal entende a frase como esclarecimento apositivo, sem negar a possibilidade de uma formulação mais literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe evita arcaísmos desnecessários, mas conserva as designações institucionais e genealógicas do hebraico. Todos os marcadores de nota aparecem no texto principal.
