    issue: Coordenação indevida entre «chefes das tribos» e «líderes das casas paternas».
    rationale: Em «todos os chefes das tribos, líderes das casas paternas dos filhos de Israel», o segundo sintagma explica/precisa o primeiro. O «e» da redação cria com facilidade a impressão de que são dois grupos independentes.
  - severity: low
    issue: «Desde a Cidade de Davi» é menos idiomático que «da Cidade de Davi».
    rationale: A preposição hebraica מִן indica a origem do transporte. Em português, «da Cidade de Davi» é a formulação mais natural, sem perda de sentido.
