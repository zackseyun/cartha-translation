  yaml_path: translation/ot/2_chronicles/005/005.yaml
  text: And they brought up the ark[a], the tent of meeting, and all the holy vessels that were in the tent; the Levitical priests brought them up.
translation:
  language: pt
  text: E fizeram subir a arca, a tenda do encontro e todos os utensílios sagrados que estavam na tenda; os sacerdotes levitas[a] fizeram-nos subir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “os sacerdotes, os levitas”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ / הֶעֱלוּ
  choice: levaram para cima
  rationale: O hifil de עלה indica fazer subir ou transportar para um lugar mais alto. A formulação conserva o sentido direcional e, repetida nas duas ocorrências, reflete a repetição hebraica.
- source_word: הָאָרוֹן
  choice: a arca
  rationale: O texto hebraico traz apenas “a arca”, sem o complemento “da aliança”; a forma breve é clara no contexto e mais fiel à expressão da fonte.
- source_word: אֹהֶל מוֹעֵד
  choice: a tenda do encontro
  rationale: Traduz diretamente os dois elementos da expressão hebraica e mantém linguagem compreensível, sem substituí-la pelo termo tradicional mais interpretativo “tabernáculo”.
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: todos os utensílios sagrados
  rationale: כְּלִים é um termo amplo para objetos, instrumentos ou utensílios. “Utensílios” é natural no contexto do culto, e “sagrados” expressa a qualificação הַקֹּדֶשׁ.
- source_word: אֲשֶׁר בָּאֹהֶל
  choice: que estavam na tenda
  rationale: A oração relativa identifica a localização dos utensílios. Repetir “tenda” mantém a correspondência lexical com אֹהֶל מוֹעֵד.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: os sacerdotes levitas
  rationale: A expressão hebraica está em aposição, literalmente “os sacerdotes, os levitas”. “Sacerdotes levitas” é natural em português e identifica esses sacerdotes como levitas sem sugerir que todos os levitas fossem sacerdotes; a forma mais literal é registrada em nota.
theological_decisions:
- issue: Relação entre “sacerdotes” e “levitas” em הַכֹּהֲנִים הַלְוִיִּם
  choice: os sacerdotes levitas
  alternative: os sacerdotes, os levitas
  rationale: A leitura adotada entende o segundo substantivo como identificação apositiva dos sacerdotes. Ela evita apagar a distinção contextual entre sacerdotes e levitas, mas a construção hebraica mais literal e sua possível tensão são preservadas na nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Tenda do encontro” e “utensílios sagrados” conservam o vocabulário concreto do hebraico. A repetição de “levaram para cima” é deliberada para reproduzir tanto a direção quanto a repetição verbal do texto-fonte.
