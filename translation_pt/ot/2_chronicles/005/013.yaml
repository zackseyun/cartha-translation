base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/013.yaml
  text: And it came about[a], as the trumpeters and the singers were as one, to make one sound in praising and giving thanks to Yahweh, and when they lifted up their voice with trumpets and cymbals and instruments for song, and in praising Yahweh, “For he is good, for his steadfast love endures forever,” the house, the house of Yahweh[c][b], was filled with a cloud.
translation:
  language: pt
  text: 'E aconteceu que os tocadores de trombeta e os cantores, como um só, fizeram ouvir um único som para louvar e dar graças a Yahweh. Quando ergueram a voz ao som das trombetas, dos címbalos e dos instrumentos musicais, louvando a Yahweh: “Pois ele é bom, pois seu amor leal dura para sempre”[a], então a casa, a casa de Yahweh, encheu-se de uma nuvem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois ele é bom, pois sua misericórdia dura para sempre”. O termo hebraico também expressa amor constante e fidelidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְאֶחָד ... קוֹל אֶחָד
  choice: como um só ... um único som
  rationale: Preserva a repetição enfática de אֶחָד e expressa tanto a unidade dos participantes quanto a unidade sonora.
- source_word: למחצצרים וְלַמְשֹׁרֲרִים
  choice: os tocadores de trombeta e os cantores
  rationale: Identifica com clareza os instrumentistas e os intérpretes vocais; 'tocadores de trombeta' é mais corrente em português do que 'trompetistas' neste contexto antigo.
- source_word: לְהַשְׁמִיעַ קוֹל
  choice: fizeram ouvir ... um som
  rationale: Reproduz o valor causativo de שׁמע no hiphil sem tornar a frase artificial.
- source_word: לְהַלֵּל וּלְהֹדוֹת
  choice: para louvar e dar graças
  rationale: Mantém separados os dois atos e conserva o valor de finalidade dos infinitivos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: בַּחֲצֹצְרוֹת וּבִמְצִלְתַּיִם וּבִכְלֵי הַשִּׁיר
  choice: ao som das trombetas, dos címbalos e dos instrumentos musicais
  rationale: Expressa naturalmente em português o acompanhamento sonoro; 'instrumentos musicais' comunica o sentido de כְּלֵי הַשִּׁיר sem o pouco idiomático 'instrumentos de canto'.
- source_word: חַסְדּוֹ
  choice: seu amor leal
  rationale: Comunica a bondade amorosa, fiel e duradoura de חֶסֶד sem restringi-la apenas a misericórdia ou afeto.
- source_word: וְהַבַּיִת מָלֵא עָנָן בֵּית יְהוָה
  choice: então a casa, a casa de Yahweh, encheu-se de uma nuvem
  rationale: Conserva a repetição apositiva de 'casa', a indefinição de 'uma nuvem' e torna clara a sequência do acontecimento.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto contém o nome próprio do Deus de Israel; a transliteração preserva essa identificação sem convertê-la em título.
- issue: Sentido de חֶסֶד na fórmula litúrgica
  choice: amor leal
  alternative: misericórdia
  rationale: '''Amor leal'' preserva melhor a combinação de benevolência, fidelidade e constância, sem impor uma formulação confessional mais estreita.'
- issue: Introdução explícita da citação
  choice: dois-pontos após 'louvando a Yahweh'
  alternative: acrescentar 'e dizendo'
  rationale: O hebraico não traz um verbo explícito equivalente a 'dizer'; a pontuação introduz a aclamação sem acrescentar conteúdo lexical.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe levemente solene. A repetição 'a casa, a casa de Yahweh' foi mantida por refletir a ênfase e a aposição do hebraico. O marcador [a] aparece imediatamente após a fórmula litúrgica a que se refere.
