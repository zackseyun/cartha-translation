  source_fidelity: 'O sentido central está bem preservado: os sacerdotes saem do recinto santo; todos os que estavam presentes haviam realizado a consagração ritual; e, excepcionalmente, não se observavam as divisões/cursos sacerdotais. A relação explicativa de כִּי e o valor cultual de הִתְקַדָּשׁוּ foram adequadamente representados.'
  naturalness: A abertura “E aconteceu que, quando” é desnecessariamente pesada e pouco natural no português moderno, sobretudo numa oração que fica suspensa para o versículo seguinte. “Quando” preserva com clareza a moldura temporal narrativa.
  terminology: “Sacerdotes”, “Lugar Santo” e “se consagrado” são apropriados ao contexto cultual. “Divisões sacerdotais” representa adequadamente מַחְלְקוֹת; a nota deve manter explícita a alternativa de “turnos/cursos”, sem substituir o referente institucional por uma explicação excessivamente livre.
  issues:
  - severity: low
    issue: A fórmula narrativa inicial está excessivamente literalizada.
    rationale: Embora וַיְהִי possa ser vertido por “e aconteceu que”, a sequência “E aconteceu que, quando” soa travada em português contemporâneo. A oração temporal “Quando” comunica a função discursiva do hebraico sem perda de sentido.
  - severity: low
    issue: A nota usa “seus turnos” como alternativa direta a “divisões”.
    rationale: “Turnos” explica bem o funcionamento das divisões, mas é preferível registrar primeiro a alternativa lexical mais próxima (“suas divisões”) e depois esclarecer que se trata dos turnos ou cursos habituais.
  revised_text: Quando os sacerdotes saíram do Lugar Santo — pois todos os sacerdotes presentes haviam se consagrado, sem observar as divisões sacerdotais[a] —
