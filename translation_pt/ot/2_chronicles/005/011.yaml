  text: וַ/יְהִ֕י בְּ/צֵ֥את הַ/כֹּהֲנִ֖ים מִן הַ/קֹּ֑דֶשׁ כִּ֠י כָּל הַ/כֹּהֲנִ֤ים הַֽ/נִּמְצְאִים֙ הִתְקַדָּ֔שׁוּ אֵ֖ין לִ/שְׁמ֥וֹר לְ/מַחְלְקֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/011.yaml
  text: And when the priests came out of the Holy Place—for all the priests who were present had consecrated themselves[a], without regard to divisions—
translation:
  language: pt
  text: Quando os sacerdotes saíram do Lugar Santo — pois todos os sacerdotes presentes haviam se consagrado, sem observar as divisões sacerdotais[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sem observar suas divisões”, isto é, sem seguir os turnos sacerdotais habituais.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּצֵאת
  choice: E aconteceu que, quando ... saíram
  rationale: A construção narrativa com וַיְהִי e o infinitivo בְּצֵאת introduz uma circunstância temporal. A formulação preserva a progressão narrativa e soa natural em português.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Equivalente corrente e preciso de כֹּהֲנִים no contexto do serviço do templo.
- source_word: מִן הַקֹּדֶשׁ
  choice: do Lugar Santo
  rationale: No contexto do templo, הַקֹּדֶשׁ designa o recinto sagrado, não a santidade em sentido abstrato. A inicial maiúscula indica que se trata de um espaço específico.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação circunstancial do que precede; “pois” conserva essa relação de modo claro.
- source_word: כָּל הַכֹּהֲנִים הַנִּמְצְאִים
  choice: todos os sacerdotes presentes
  rationale: O particípio de מצא refere-se aqui aos que se encontravam no local ou estavam disponíveis. “Presentes” é conciso e idiomático.
- source_word: הִתְקַדָּשׁוּ
  choice: haviam se consagrado
  rationale: O hitpael de קדש indica preparação ritual realizada pelos próprios sacerdotes. “Consagrado” comunica o sentido cultual sem sugerir apenas aperfeiçoamento moral.
- source_word: אֵין לִשְׁמֹר לְמַחְלְקוֹת
  choice: sem observar as divisões sacerdotais
  rationale: A expressão indica que, nessa ocasião, não se seguiu a organização habitual dos sacerdotes em grupos ou turnos. “Divisões sacerdotais” torna explícito o referente institucional sem eliminar a alternativa mais literal registrada na nota.
theological_decisions:
- issue: Terminologia cultual para a preparação dos sacerdotes
  choice: haviam se consagrado
  alternative: haviam se santificado
  rationale: O contexto trata da preparação ritual para o serviço no templo. “Consagrado” preserva esse sentido cultual e evita reduzir a expressão a uma categoria doutrinária posterior de santificação moral.
- issue: Organização dos sacerdotes para o serviço
  choice: sem observar as divisões sacerdotais
  alternative: não havia obrigação de observar os turnos
  rationale: O hebraico é compacto e permite alguma variação na maneira de relacionar אֵין, “não há”, com o infinitivo e com מַחְלְקוֹת. O texto principal expressa o sentido contextual provável, enquanto a nota preserva uma formulação alternativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Os travessões preservam a explicação parentética e a suspensão sintática do versículo, cuja frase continua no contexto seguinte.
