base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/012.yaml
  text: And the Levites who were the singers—all of them[a], Asaph, Heman, Jeduthun, and their sons and their brothers—were clothed in fine linen, with cymbals, harps, and lyres, standing east of the altar[b]; and with them were one hundred twenty priests blowing trumpets.
translation:
  language: pt
  text: 'Os levitas cantores — todos eles: Asafe, Hemã e Jedutum, seus filhos e seus irmãos — estavam vestidos de linho fino e, com címbalos, harpas[a] e liras, estavam de pé a leste do altar[b]. Com eles estavam cento e vinte sacerdotes tocando as trombetas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “instrumentos semelhantes a harpas”; não se conhece com certeza a distinção exata entre os antigos instrumentos de cordas mencionados aqui.
    reason: lexical_alternative
  - marker: b
    text: Ou “no lado leste do altar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְוִיִּם הַמְשֹׁרֲרִים
  choice: os levitas cantores
  rationale: Expressa de modo natural e conciso o particípio atributivo que identifica a função desses levitas.
- source_word: לְכֻלָּם
  choice: todos
  rationale: O sentido de totalidade é incorporado pela construção abrangente que inclui os líderes nomeados, seus filhos e seus irmãos.
- source_word: לְאָסָף לְהֵימָן לִידוּתוּן
  choice: Asafe, Hemã, Jedutum
  rationale: Transliterações portuguesas consagradas dos nomes próprios.
- source_word: וְלִבְנֵיהֶם וְלַאֲחֵיהֶם
  choice: seus filhos e seus irmãos
  rationale: Preserva os termos familiares concretos do hebraico sem ampliar o sentido para parentes ou companheiros.
- source_word: מְלֻבָּשִׁים בּוּץ
  choice: vestidos de linho fino
  rationale: Reproduz o particípio passivo e o tecido de alta qualidade associado ao contexto sagrado.
- source_word: בִּמְצִלְתַּיִם
  choice: com címbalos
  rationale: Equivalente convencional e claro para o antigo instrumento de percussão.
- source_word: וּבִנְבָלִים
  choice: harpas
  rationale: Equivalente tradicional e inteligível, embora a identificação exata do instrumento antigo seja incerta; essa incerteza é registrada em nota.
- source_word: וְכִנֹּרוֹת
  choice: e liras
  rationale: Distingue כִּנּוֹר de נֶבֶל conforme o uso moderno comum em traduções e estudos bíblicos.
- source_word: עֹמְדִים מִזְרָח לַמִּזְבֵּחַ
  choice: estavam de pé a leste do altar
  rationale: Traduz a localização de forma natural, sem decidir além do necessário se a expressão significa simplesmente a leste ou especificamente no lado leste.
- source_word: וְעִמָּהֶם כֹּהֲנִים לְמֵאָה וְעֶשְׂרִים
  choice: Com eles estavam cento e vinte sacerdotes
  rationale: Torna explícita em português a relação copulativa implícita no hebraico e preserva o número.
- source_word: מחצררים בַּחֲצֹצְרוֹת
  choice: tocando as trombetas
  rationale: Comunica naturalmente a ação musical dos sacerdotes; neste contexto, o particípio indica que faziam soar as trombetas.
