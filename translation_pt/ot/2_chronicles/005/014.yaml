base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/014.yaml
  text: and the priests could not stand to minister because of the cloud[a], for the glory of Yahweh filled the house of God.
translation:
  language: pt
  text: e os sacerdotes não puderam permanecer de pé para ministrar por causa da nuvem, pois a glória de Yahweh encheu a casa de Deus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o templo de Deus”. Literalmente, “a casa de Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: puderam
  rationale: O verbo expressa capacidade; com a negação, “não puderam” comunica naturalmente a impossibilidade.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Tradução direta do substantivo definido plural no contexto do culto no templo.
- source_word: לַעֲמוֹד
  choice: permanecer de pé
  rationale: Preserva a imagem concreta de estar em pé e, no contexto, explicita de modo natural a ideia de continuar nessa posição.
- source_word: לְשָׁרֵת
  choice: para ministrar
  rationale: No contexto sacerdotal, o verbo designa serviço litúrgico; “ministrar” conserva essa especificidade.
- source_word: מִפְּנֵי
  choice: por causa de
  rationale: A preposição indica aqui a causa da incapacidade dos sacerdotes.
- source_word: הֶעָנָן
  choice: a nuvem
  rationale: Tradução direta do substantivo definido, sem explicar além do que o hebraico afirma.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação para a afirmação anterior e mantém a relação lógica do hebraico.
- source_word: מָלֵא
  choice: encheu
  rationale: O pretérito perfeito se ajusta à forma verbal e à sequência narrativa.
- source_word: כְבוֹד יְהוָה
  choice: a glória de Yahweh
  rationale: Reproduz claramente a relação construta e mantém o nome divino como nome próprio.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בֵּית הָאֱלֹהִים
  choice: a casa de Deus
  rationale: Segue literalmente a expressão hebraica e permanece compreensível em português; “templo de Deus” é uma alternativa contextual.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Sentido de בֵּית הָאֱלֹהִים
  choice: casa de Deus
  alternative: templo de Deus
  rationale: “Casa de Deus” conserva a metáfora e a forma lexical do hebraico; “templo de Deus” explicita corretamente o referente contextual, mas é mais interpretativo.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe narrativa natural. “Permanecer de pé” conserva a imagem hebraica sem sugerir apenas o ato inicial de levantar-se; “ministrar” indica o serviço sacerdotal.
