base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/009.yaml
  text: And the poles were so long that the heads of the poles were seen from the ark before the inner sanctuary[a], but they could not be seen from outside; and they are there to this day.
translation:
  language: pt
  text: As varas foram alongadas, de modo que suas pontas podiam ser vistas a partir da arca, diante do santuário interior[a], mas não podiam ser vistas de fora; e elas estão ali até o dia de hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “diante do Santo dos Santos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲרִיכוּ
  choice: foram estendidas
  rationale: 'O hifil de ארך expressa ação causativa: as varas foram alongadas ou estendidas. A construção passiva em português evita introduzir um agente não expresso e comunica naturalmente o resultado.'
- source_word: הַבַּדִּים
  choice: as varas
  rationale: בַּדִּים designa as varas usadas para transportar a arca. “Varas” é a forma bíblica corrente e compreensível em português.
- source_word: רָאשֵׁי הַבַּדִּים
  choice: suas pontas
  rationale: רָאשֵׁי significa literalmente “cabeças”, mas, aplicado às varas, refere-se às extremidades; “pontas” é natural e concreto em português.
- source_word: מִן הָאָרוֹן
  choice: desde a arca
  rationale: A preposição מִן indica o ponto a partir do qual as pontas eram visíveis. “Desde a arca” conserva a relação espacial sem explicitar indevidamente que se projetavam para fora dela.
- source_word: עַל פְּנֵי הַדְּבִיר
  choice: diante do santuário interior
  rationale: דְּבִיר designa o recinto mais interior do templo, e עַל־פְּנֵי tem aqui sentido espacial. A expressão mantém a descrição arquitetônica sem substituir o termo por uma designação teológica mais interpretativa.
- source_word: וְלֹא יֵרָאוּ הַחוּצָה
  choice: mas não podiam ser vistas de fora
  rationale: A tradução expressa a forma passiva de ראה e o contraste de visibilidade indicado por הַחוּצָה.
- source_word: וַיְהִי שָׁם
  choice: e elas estão ali
  rationale: Embora o verbo hebraico esteja no singular, a construção tem valor existencial e retoma as varas. O presente português se ajusta ao ponto de vista do narrador expresso por “até o dia de hoje”.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até o dia de hoje
  rationale: Equivalente natural da expressão hebraica que assinala a continuidade da situação até o tempo do narrador.
