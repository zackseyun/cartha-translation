id: 2CH.5.7
reference: 2 Chronicles 5:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יָּבִ֣יאוּ הַ֠/כֹּהֲנִים אֶת אֲר֨וֹן בְּרִית יְהוָ֧ה אֶל מְקוֹמ֛/וֹ אֶל דְּבִ֥יר הַ/בַּ֖יִת אֶל קֹ֣דֶשׁ הַ/קְּדָשִׁ֑ים אֶל תַּ֖חַת כַּנְפֵ֥י הַ/כְּרוּבִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/007.yaml
  text: Then the priests brought the ark of the covenant of Yahweh to its place[a], into the inner sanctuary of the house, into the Most Holy Place, under the wings of the cherubim.
translation:
  language: pt
  text: Então os sacerdotes levaram a arca da aliança de Yahweh para o seu lugar, no santuário interior da Casa, no Lugar Santíssimo[a], debaixo das asas dos querubins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Santo dos Santos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: levaram
  rationale: O hifil de בוא significa “trazer” ou “levar para dentro”. Em português, “levaram” acompanha naturalmente o movimento da arca até o lugar designado, sem acrescentar um modo específico de transporte.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Tradução direta do substantivo definido no plural.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: a arca da aliança de Yahweh
  rationale: Preserva de modo claro a cadeia construta hebraica e explicita tanto a aliança quanto o nome divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome pessoal divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מְקוֹמוֹ
  choice: seu lugar
  rationale: O sufixo se refere à arca. A formulação é concisa e não acrescenta “devido” ou “designado”, embora isso esteja implícito no contexto.
- source_word: דְּבִיר הַבַּיִת
  choice: o santuário interior da Casa
  rationale: דְּבִיר designa o recinto mais interno do templo. “Santuário interior” comunica sua função cultual, enquanto “Casa” conserva a imagem de הַבַּיִת no contexto do templo.
- source_word: קֹדֶשׁ הַקְּדָשִׁים
  choice: o Lugar Santíssimo
  rationale: Expressa em português corrente o superlativo hebraico, isto é, o recinto de máxima santidade.
- source_word: תַּחַת כַּנְפֵי הַכְּרוּבִים
  choice: debaixo das asas dos querubins
  rationale: Tradução direta e natural da relação espacial e do plural construto; “querubins” é a forma portuguesa convencional.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” preserva o nome da aliança em forma transliterada, sem substituí-lo por “SENHOR”.
- issue: Designação do recinto mais sagrado
  choice: Lugar Santíssimo
  alternative: Santo dos Santos
  rationale: As duas formas refletem a construção superlativa hebraica. “Lugar Santíssimo” é mais transparente para leitores atuais; a forma tradicional é preservada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Casa” recebe inicial maiúscula para deixar claro que se refere ao templo, sem substituir a imagem hebraica por uma paráfrase.
