base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/004.yaml
  text: And all the elders of Israel came[a], and the Levites carried the ark.
translation:
  language: pt
  text: Vieram todos os anciãos de Israel, e os levitas carregaram a arca.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, a arca da aliança, como o contexto deixa claro.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Vieram
  rationale: O wayyiqtol de בוא dá continuidade à sequência narrativa. “Vieram” preserva o movimento indicado pelo verbo hebraico e soa natural no relato.
- source_word: כֹּל
  choice: todos
  rationale: Quantifica de modo abrangente os anciãos de Israel, correspondendo diretamente ao hebraico.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: os anciãos de Israel
  rationale: Reproduz a cadeia construta e comunica a função reconhecida desses líderes de Israel em linguagem bíblica corrente e clara.
- source_word: וַיִּשְׂאוּ
  choice: carregaram
  rationale: Neste contexto, נשׂא descreve o transporte da arca. “Carregaram” expressa a ação com clareza, sem o tom arcaizante de “levaram sobre si”.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: É a designação portuguesa convencional e precisa para o grupo tribal e cultual mencionado.
- source_word: אֶת הָאָרוֹן
  choice: a arca
  rationale: O hebraico diz simplesmente “a arca”. A tradução mantém essa forma no texto principal, sem acrescentar “da aliança”, embora o contexto identifique o objeto.
theological_decisions:
- issue: Identidade da “arca”
  choice: Traduzir no texto principal apenas como “a arca”.
  alternative: “a arca da aliança”
  rationale: O referente é a arca da aliança, mas este versículo emprega somente הָאָרוֹן. Manter a formulação breve preserva a precisão do texto-fonte; a nota esclarece o referente contextual sem inserir palavras adicionais no corpo do versículo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem “Vieram todos os anciãos” mantém a progressão narrativa e evita uma construção excessivamente literal. O marcador da nota foi colocado depois de “arca”, seu referente efetivo.
