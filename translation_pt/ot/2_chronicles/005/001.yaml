source:
  edition: WLC
  text: וַ/תִּשְׁלַם֙ כָּל הַ/מְּלָאכָ֔ה אֲשֶׁר עָשָׂ֥ה שְׁלֹמֹ֖ה לְ/בֵ֣ית יְהוָ֑ה וַ/יָּבֵ֨א שְׁלֹמֹ֜ה אֶת קָדְשֵׁ֣י דָּוִ֣יד אָבִ֗י/ו וְ/אֶת הַ/כֶּ֤סֶף וְ/אֶת הַ/זָּהָב֙ וְ/אֶת כָּל הַ/כֵּלִ֔ים נָתַ֕ן בְּ/אֹצְר֖וֹת בֵּ֥ית הָ/אֱלֹהִֽים־־ס־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/001.yaml
  text: Thus all the work that Solomon had done for the house of Yahweh was finished. Then Solomon brought in the holy things of David his father[a], and the silver, the gold, and all the vessels; he put them into the treasuries of the house of God.
translation:
  language: pt
  text: Assim se concluiu toda a obra que Salomão realizou para a casa de Yahweh. Então Salomão trouxe as coisas sagradas de Davi, seu pai[a], bem como a prata, o ouro e todos os utensílios, e os colocou nas tesourarias da casa de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as coisas dedicadas por Davi, seu pai” ou “as coisas consagradas por Davi, seu pai”.'
    reason: Alternativa lexical para קָדְשֵׁי, que pode designar objetos santos ou objetos separados e dedicados ao uso sagrado.
lexical_decisions:
- source_word: וַתִּשְׁלַם
  choice: se concluiu
  rationale: 'Expressa o sentido resultativo de שלם neste contexto narrativo: toda a obra chegou à sua conclusão. A formulação é natural e digna em português.'
- source_word: כָּל הַמְּלָאכָה
  choice: toda a obra
  rationale: מְלָאכָה abrange aqui o projeto completo de construção e preparação da casa; “toda a obra” preserva essa amplitude.
- source_word: לְבֵית יְהוָה
  choice: para a casa de Yahweh
  rationale: Mantém a imagem literal da casa como santuário e verte diretamente o nome divino יהוה como “Yahweh”.
- source_word: וַיָּבֵא
  choice: trouxe
  rationale: No contexto, o hifil de בוא indica que Salomão fez os objetos chegarem ao complexo do templo. Em português, “trouxe” é suficiente e natural; o destino é explicitado ao final.
- source_word: קָדְשֵׁי דָּוִיד אָבִיו
  choice: as coisas sagradas de Davi, seu pai
  rationale: O plural construto de קֹדֶשׁ designa objetos santos ou dedicados. A tradução direta preserva a amplitude lexical, enquanto a nota registra a leitura contextual de dedicação.
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: a prata, o ouro
  rationale: Preserva os dois substantivos definidos e a cadência enumerativa do hebraico.
- source_word: כָּל הַכֵּלִים
  choice: todos os utensílios
  rationale: כֵּלִים é um termo amplo para objetos ou implementos. “Utensílios” é claro no contexto do templo sem restringir indevidamente sua natureza.
- source_word: נָתַן
  choice: os colocou
  rationale: נתן tem aqui o sentido contextual de pôr ou colocar objetos em um lugar. O pronome retoma com clareza os itens enumerados.
- source_word: בְּאֹצְרוֹת
  choice: nas tesourarias
  rationale: O plural de אֹצָר aponta para vários depósitos ou câmaras destinados a bens valiosos; “tesourarias” conserva esse plural.
- source_word: בֵּית הָאֱלֹהִים
  choice: a casa de Deus
  rationale: Preserva tanto a imagem de “casa” quanto a mudança da designação divina no fim do versículo.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” o representa diretamente, sem substituí-lo por um título.
- issue: Variação entre בֵּית יְהוָה e בֵּית הָאֱלֹהִים
  choice: casa de Yahweh / casa de Deus
  alternative: uniformizar ambas como “templo”
  rationale: A opção preserva a variação deliberada do hebraico e a imagem do santuário como casa.
- issue: Sentido de קָדְשֵׁי דָּוִיד
  choice: as coisas sagradas de Davi
  alternative: as coisas dedicadas por Davi; as coisas consagradas por Davi
  rationale: O construto pode indicar coisas pertencentes a Davi no sentido de terem sido dedicadas ou consagradas por ele. O texto mantém a formulação mais direta e a nota explicita a alternativa contextual sem eliminar a ambiguidade.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. Conservam-se “casa” e a alternância “Yahweh/Deus” para refletir a forma e a variação do hebraico; a coordenação foi ajustada de modo natural ao português.
