language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֵ֚ין בָּֽ/אָר֔וֹן רַ֚ק שְׁנֵ֣י הַ/לֻּח֔וֹת אֲשֶׁר נָתַ֥ן מֹשֶׁ֖ה בְּ/חֹרֵ֑ב אֲשֶׁ֨ר כָּרַ֤ת יְהוָה֙ עִם בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/צֵאתָ֖/ם מִ/מִּצְרָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/010.yaml
  text: There was nothing in the ark except the two tablets that Moses put there at Horeb[b][a], where Yahweh made a covenant with the people of Israel when they came out of Egypt.
translation:
  language: pt
  text: Na arca não havia nada além das duas tábuas que Moisés havia colocado[a] em Horebe, onde Yahweh fez uma aliança com os israelitas[b] quando eles saíram do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico significa literalmente “deu”, mas aqui tem o sentido de pôr ou depositar as tábuas.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “filhos de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין בָּאָרוֹן רַק
  choice: Na arca não havia nada além de
  rationale: 'Reproduz de modo natural em português a construção hebraica de negação existencial seguida da partícula restritiva: literalmente, “não havia na arca, exceto”.'
- source_word: שְׁנֵי הַלֻּחוֹת
  choice: as duas tábuas
  rationale: Mantém o substantivo expresso no hebraico sem acrescentar “de pedra”, informação conhecida pelo contexto, mas ausente deste versículo.
- source_word: אֲשֶׁר נָתַן מֹשֶׁה
  choice: que Moisés havia colocado
  rationale: Embora נָתַן normalmente signifique “dar”, neste contexto indica que Moisés pôs ou depositou as tábuas; o mais-que-perfeito deixa clara a anterioridade da ação.
- source_word: בְּחֹרֵב
  choice: em Horebe
  rationale: Preserva o topônimo hebraico Horebe sem harmonizá-lo com Sinai.
- source_word: אֲשֶׁר כָּרַת יְהוָה עִם
  choice: onde Yahweh fez uma aliança com
  rationale: A expressão כָּרַת, literalmente “cortou”, evoca o idioma hebraico de firmar uma aliança; “fez uma aliança” é claro e natural. “Onde” entende o relativo como retomando Horebe.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os israelitas
  rationale: Expressa naturalmente o sentido coletivo de “filhos de Israel” em português moderno.
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  choice: quando eles saíram do Egito
  rationale: Traduz a preposição temporal com o infinitivo construto por uma oração temporal corrente, preservando a referência ao êxodo.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino e evita substituí-lo por um título.
- issue: Aliança implícita na expressão אֲשֶׁר כָּרַת יְהוָה עִם
  choice: onde Yahweh fez uma aliança com
  alternative: que Yahweh cortou com
  rationale: O substantivo “aliança” não está expresso nesta oração, mas é exigido pelo idioma hebraico e pelo contexto da entrega das tábuas em Horebe. A formulação explicita o sentido sem impor uma interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase acompanha o foco do hebraico, e “Horebe” é mantido sem harmonização geográfica. O relativo “onde” preserva a leitura contextual mais natural, segundo a qual foi em Horebe que Yahweh fez a aliança.
