base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/008.yaml
  text: And the cherubim were spreading out their wings over the place of the ark[a], and the cherubim covered the ark and its poles from above.
translation:
  language: pt
  text: Os querubins mantinham as asas estendidas sobre o lugar da arca[a], e cobriam por cima a arca e suas varas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sobre o lugar onde ficava a arca”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ ... פֹּרְשִׂים כְּנָפַיִם
  choice: mantinham as asas estendidas
  rationale: A construção com היה e particípio descreve uma postura contínua. Em português, “mantinham as asas estendidas” expressa esse estado com naturalidade e dignidade.
- source_word: הַכְּרוּבִים
  choice: os querubins
  rationale: “Querubins” é a forma tradicional e reconhecível em português para esses seres associados ao trono e ao santuário.
- source_word: עַל מְקוֹם הָאָרוֹן
  choice: sobre o lugar da arca
  rationale: Preserva o substantivo מָקוֹם, “lugar”, sem o simplificar para “sobre a arca”, que aparece explicitamente na oração seguinte.
- source_word: וַיְכַסּוּ
  choice: cobrindo
  rationale: כסה tem o sentido direto de cobrir. O gerúndio liga naturalmente a ação à postura contínua descrita na primeira oração.
- source_word: עַל הָאָרוֹן וְעַל בַּדָּיו
  choice: a arca e suas varas
  rationale: בַּדִּים designa as varas usadas para transportar a arca. “Varas” é a designação bíblica corrente em português e permanece compreensível.
- source_word: מִלְמָעְלָה
  choice: por cima
  rationale: Indica que a arca e as varas eram cobertas desde a parte superior; “por cima” é natural em português e conserva a relação espacial.
