translation_notes:
  register: Português moderno, claro e solene, com sintaxe fluida e vocabulário tradicional apenas onde ele continua amplamente inteligível. A nota preserva a possível nuance contextual de מְקוֹם como o espaço ou local ocupado pela arca.
