id: MAL.3.11
reference: Malachi 3:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/גָעַרְתִּ֤י לָ/כֶם֙ בָּֽ/אֹכֵ֔ל וְ/לֹֽא יַשְׁחִ֥ת לָ/כֶ֖ם אֶת פְּרִ֣י הָ/אֲדָמָ֑ה וְ/לֹא תְשַׁכֵּ֨ל לָ/כֶ֤ם הַ/גֶּ֨פֶן֙ בַּ/שָּׂדֶ֔ה אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/011.yaml
  text: And I will rebuke the devourer for you[a], so that it will not destroy for you the fruit of the ground, and the vine in the field will not fail to bear for you[b], says Yahweh of Armies.
translation:
  language: pt
  text: Eu repreenderei o devorador em favor de vocês, para que ele não destrua o fruto da terra; e a videira no campo não perderá seus frutos[a], diz Yahweh dos Exércitos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a videira no campo não abortará para vocês”. A imagem descreve a perda prematura dos frutos.
    reason: lexical_alternative
  - marker: b
    text: Tradicionalmente, “SENHOR dos Exércitos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגָעַרְתִּי
  choice: Eu repreenderei
  rationale: Preserva o sentido usual de גּער, uma repreensão autoritativa que, no contexto, detém eficazmente o agente destruidor.
- source_word: בָּאֹכֵל
  choice: o devorador
  rationale: O particípio substantivado designa aquilo que consome as plantações, sem especificar indevidamente gafanhotos, praga ou outra força destrutiva.
- source_word: יַשְׁחִת
  choice: destrua
  rationale: No contexto agrícola, o hifil de שׁחת comunica causar ruína ou destruição à produção.
- source_word: פְּרִי הָאֲדָמָה
  choice: o fruto da terra
  rationale: Mantém a imagem concreta do hebraico e é uma formulação portuguesa clara, sem restringir o referente a um tipo específico de cultivo.
- source_word: תְשַׁכֵּל
  choice: não perderá seu fruto antes de amadurecer
  rationale: 'Expressa em linguagem natural a metáfora de שׁכל aplicada à videira: perder prematuramente o fruto, como num aborto, sem reduzir o sentido simplesmente à esterilidade.'
- source_word: הַגֶּפֶן
  choice: a videira
  rationale: Corresponde ao substantivo definido singular e conserva a imagem agrícola.
- source_word: בַּשָּׂדֶה
  choice: no campo
  rationale: Tradução direta e natural da expressão locativa.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Translitera o nome divino e traduz צְבָאוֹת de modo transparente para leitores modernos.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio da aliança; “Yahweh” o representa diretamente, sem substituí-lo por um título.
- issue: Tradução de צְבָאוֹת no título divino
  choice: dos Exércitos
  alternative: dos Exércitos celestiais; dos exércitos; dos seres celestiais
  rationale: “Dos Exércitos” preserva a amplitude e a tensão do título tradicional sem determinar no corpo do texto se os exércitos são celestiais, terrestres ou ambos.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A repetição hebraica de לָכֶם foi expressa naturalmente por “em favor de vocês” e pelo contexto verbal. A metáfora difícil da videira que “aborta” foi explicitada no texto e preservada literalmente em nota.
