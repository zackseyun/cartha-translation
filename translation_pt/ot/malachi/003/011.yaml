  naturalness: O registro é claro, moderno e adequado. «Não perderá seus frutos» comunica de forma mais direta e natural a imagem aplicada à videira, sem acrescentar a especificação temporal.
  terminology: «Yahweh dos Exércitos» é uma tradução consistente de יהוה צבאות. A nota não deve apresentar «celestiais» como alternativa simples, pois essa qualificação restringe interpretativamente o alcance de צבאות.
