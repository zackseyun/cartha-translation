  text: כִּֽי הִנֵּ֤ה הַ/יּוֹם֙ בָּ֔א בֹּעֵ֖ר כַּ/תַּנּ֑וּר וְ/הָי֨וּ כָל זֵדִ֜ים וְ/כָל עֹשֵׂ֤ה רִשְׁעָה֙ קַ֔שׁ וְ/לִהַ֨ט אֹתָ֜/ם הַ/יּ֣וֹם הַ/בָּ֗א אָמַר֙ יְהוָ֣ה צְבָא֔וֹת אֲשֶׁ֛ר לֹא יַעֲזֹ֥ב לָ/הֶ֖ם שֹׁ֥רֶשׁ וְ/עָנָֽף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/019.yaml
  text: For behold[a], the day is coming, burning like an oven, when all the arrogant and every evildoer will be stubble. The coming day will set them ablaze, says Yahweh of Armies[c][b], so that it will leave them neither root nor branch.
translation:
  language: pt
  text: Pois eis que vem o dia, ardendo como um forno[a]. Todos os arrogantes[b] e todos os que praticam a maldade serão como palha seca. O dia que vem os fará arder, diz Yahweh dos Exércitos[c], de modo que não lhes deixará nem raiz nem ramo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ardendo como uma fornalha”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os orgulhosos” ou “os presunçosos”.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “Yahweh dos Exércitos”; tradicionalmente, “SENHOR dos Exércitos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Pois eis que
  rationale: “Pois” preserva a ligação explicativa com o contexto anterior, enquanto “eis que” mantém a força de chamar solenemente a atenção para o anúncio.
- source_word: הַיּוֹם בָּא
  choice: vem o dia
  rationale: Reproduz de modo natural a ideia do dia definido que se aproxima, sem acrescentar uma data ou identificação não expressa no texto.
- source_word: בֹּעֵר כַּתַּנּוּר
  choice: ardendo como um forno
  rationale: Mantém o particípio e a comparação concreta; תַּנּוּר designa primariamente um forno, embora “fornalha” seja uma alternativa possível.
- source_word: זֵדִים
  choice: os arrogantes
  rationale: Expressa a postura insolente e presunçosa indicada pelo termo hebraico em linguagem moderna e clara.
- source_word: כָל עֹשֵׂה רִשְׁעָה
  choice: todos os que praticam a maldade
  rationale: Preserva a construção participial e seu sentido coletivo e distributivo, destacando a prática da maldade.
- source_word: קַשׁ
  choice: palha seca
  rationale: Comunica de maneira imediatamente compreensível o resíduo vegetal seco e inflamável da colheita; evita confundi-lo com a palha leve levada pelo vento, embora “restolho” seja mais tecnicamente específico.
- source_word: וְלִהַט אֹתָם
  choice: os incendiará
  rationale: Preserva a imagem de fazê-los arder sem antecipar por paráfrase a consequência total apresentada na oração seguinte.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Translitera o nome divino e traduz צְבָאוֹת de forma transparente, conservando a força militar e cósmica do título.
- source_word: אֲשֶׁר לֹא יַעֲזֹב לָהֶם
  choice: de modo que não lhes deixará
  rationale: Entende a oração relativa como resultado do incêndio causado pelo dia vindouro, mantendo esse dia como sujeito implícito.
- source_word: שֹׁרֶשׁ וְעָנָף
  choice: nem raiz nem ramo
  rationale: Conserva a imagem e o merismo que comunica erradicação completa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o Tetragrama; “Yahweh” conserva o nome da aliança sem substituí-lo por um título.
- issue: Grau de explicitação do juízo pelo fogo
  choice: 'Manter as etapas da imagem: “os incendiará” e depois “não lhes deixará nem raiz nem ramo”'
  alternative: “irá consumi-los completamente”
  rationale: A formulação preserva a progressão metafórica do original e evita transformar a imagem profética em uma síntese teológica mais interpretativa.
- issue: Referente e função de אֲשֶׁר na oração final
  choice: 'Resultado ligado ao dia vindouro: “de modo que não lhes deixará”'
  alternative: 'Oração relativa mais literal: “o qual não lhes deixará”'
  rationale: A leitura de resultado é natural no contexto e em português, mas não acrescenta uma causa ou agente diferente do dia anunciado.
translation_notes:
  register: Português moderno, solene e acessível, com ordem frasal natural para leitores brasileiros e compreensão internacional. “Palha seca” foi preferido a “restolho” por clareza ampla, mantendo-se a imagem agrícola e inflamável. As notas aparecem em ordem [a], [b], [c] junto aos termos correspondentes.
