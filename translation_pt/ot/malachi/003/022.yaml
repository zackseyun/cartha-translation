  text: זִכְר֕וּ תּוֹרַ֖ת מֹשֶׁ֣ה עַבְדִּ֑/י אֲשֶׁר֩ צִוִּ֨יתִי אוֹת֤/וֹ בְ/חֹרֵב֙ עַל כָּל יִשְׂרָאֵ֔ל חֻקִּ֖ים וּ/מִשְׁפָּטִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/022.yaml
  text: Remember the law of Moses my servant[c][b][a], which I commanded him at Horeb for all Israel—statutes and judgments.
translation:
  language: pt
  text: 'Lembrem-se da lei[a] de Moisés, meu servo, que lhe ordenei em Horebe[b] para todo o Israel: estatutos e juízos.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da instrução de Moisés, meu servo”.'
    reason: lexical_alternative
  - marker: b
    text: “Horebe” é outro nome para o Sinai, o monte onde Deus deu a Israel a lei da aliança por meio de Moisés.
    reason: cultural_note
  - marker: c
    text: 'Ou: “estatutos e ordenanças”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ
  choice: Lembrem-se
  rationale: Imperativo plural de זכר. A forma pronominal é natural no português moderno e expressa recordação ativa, com implicações de fidelidade à aliança.
- source_word: תּוֹרַת מֹשֶׁה
  choice: da lei de Moisés
  rationale: Embora תּוֹרָה também possa significar “instrução”, a menção de Moisés, Horebe e das estipulações dadas a todo Israel favorece aqui o sentido específico da lei da aliança mosaica.
- source_word: עַבְדִּי
  choice: meu servo
  rationale: No contexto, עבד é um título honorífico que destaca Moisés como agente comissionado por Deus, não a condição social de escravo.
- source_word: אֲשֶׁר צִוִּיתִי אֹתוֹ
  choice: que lhe ordenei
  rationale: O pronome retoma Moisés como destinatário e mediador. “Lhe ordenei” reproduz de modo natural em português a relação verbal do hebraico.
- source_word: בְחֹרֵב
  choice: em Horebe
  rationale: A preposição בְּ tem valor locativo. “Em Horebe” é idiomático em português e preserva o nome usado no texto hebraico.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: para todo o Israel
  rationale: 'עַל indica aqui o âmbito ou a aplicação da ordem: a lei foi dada para todo o povo da aliança.'
- source_word: חֻקִּים וּמִשְׁפָּטִים
  choice: estatutos e juízos
  rationale: Mantém a distinção entre prescrições estabelecidas e decisões ou normas de caráter judicial, preservando a linguagem jurídica do hebraico.
theological_decisions:
- issue: Sentido de תּוֹרָה no contexto da aliança
  choice: lei
  alternative: instrução
  rationale: A referência conjunta a Moisés, Horebe e às estipulações para Israel torna saliente o corpo legal da aliança. “Lei” não exclui a dimensão instrutiva do termo.
- issue: Designação עבד aplicada a Moisés
  choice: servo
  alternative: escravo
  rationale: Aqui o termo funciona como título honroso de serviço e missão divina; “escravo” destacaria uma condição social que não constitui o foco do versículo.
- issue: Relação de חֻקִּים e מִשְׁפָּטִים
  choice: estatutos e juízos
  alternative: decretos e ordenanças
  rationale: A opção preserva dois termos jurídicos distintos sem os fundir nem impor uma classificação teológica mais precisa do que o hebraico permite.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. O plural “Lembrem-se” dirige a exortação ao povo; “Horebe”, “estatutos” e “juízos” preservam o caráter histórico e jurídico do texto.
