id: MAL.3.10
reference: Malachi 3:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הָבִ֨יאוּ אֶת כָּל הַֽ/מַּעֲשֵׂ֜ר אֶל בֵּ֣ית הָ/אוֹצָ֗ר וִ/יהִ֥י טֶ֨רֶף֙ בְּ/בֵיתִ֔/י וּ/בְחָנ֤וּ/נִי נָא֙ בָּ/זֹ֔את אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת אִם לֹ֧א אֶפְתַּ֣ח לָ/כֶ֗ם אֵ֚ת אֲרֻבּ֣וֹת הַ/שָּׁמַ֔יִם וַ/הֲרִיקֹתִ֥י לָ/כֶ֛ם בְּרָכָ֖ה עַד בְּלִי דָֽי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/010.yaml
  text: Bring the full tithe into the storehouse[a], so that there may be food in my house. And test me now in this, says Yahweh of hosts[c][b], whether I will not open for you the windows of heaven and pour out for you blessing until there is no more need.
translation:
  language: pt
  text: Tragam o dízimo completo ao depósito[a], para que haja alimento em minha casa. Ponham-me à prova agora nisto, diz Yahweh dos Exércitos, para ver se não abrirei para vocês as janelas do céu[b] e derramarei sobre vocês bênção até que não haja mais necessidade[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todo o dízimo” ou “o dízimo inteiro”.
    reason: lexical_alternative
  - marker: b
    text: Ou “as comportas do céu”. O hebraico diz literalmente “as janelas do céu”.
    reason: lexical_alternative
  - marker: c
    text: A expressão hebraica indica abundância além do suficiente; tradicionalmente, “até não haver mais espaço” ou “sem medida”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבִיאוּ
  choice: Tragam
  rationale: O imperativo plural no hifil de בוא/ביא significa trazer ou fazer entrar; “tragam” preserva de modo natural a força da ordem.
- source_word: כָּל הַמַּעֲשֵׂר
  choice: o dízimo completo
  rationale: כָּל com o substantivo singular indica a totalidade do dízimo devido, não apenas uma parte dele.
- source_word: בֵּית הָאוֹצָר
  choice: o depósito
  rationale: A expressão construta significa literalmente “casa do armazenamento”; no contexto do templo, “depósito” designa com clareza o local onde se guardavam as provisões.
- source_word: וִיהִי
  choice: para que haja
  rationale: O jussivo após o imperativo expressa propósito ou resultado; esta formulação é natural em português.
- source_word: טֶרֶף
  choice: alimento
  rationale: Embora o termo possa significar “presa”, aqui se refere às provisões comestíveis mantidas na casa de Deus.
- source_word: בְּבֵיתִי
  choice: em minha casa
  rationale: Mantém literalmente a linguagem da casa de Deus sem substituir o termo pelo mais específico “templo”.
- source_word: וּבְחָנוּנִי נָא בָּזֹאת
  choice: Ponham-me à prova agora nisto
  rationale: בחן significa testar ou examinar, נָא acrescenta apelo ou imediatidade, e בָּזֹאת aponta para a ação mencionada no contexto.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: “Yahweh” representa o nome divino, enquanto “dos Exércitos” preserva a força marcial e cósmica do título.
- source_word: אִם לֹא אֶפְתַּח
  choice: para ver se não abrirei
  rationale: Depois do convite para pôr Deus à prova, אִם לֹא introduz aquilo que o povo verá, com sentido retórico fortemente afirmativo.
- source_word: אֲרֻבּוֹת הַשָּׁמַיִם
  choice: as janelas do céu
  rationale: A tradução conserva a imagem literal das aberturas ou janelas celestes e sua ressonância bíblica.
- source_word: וַהֲרִיקֹתִי לָכֶם בְּרָכָה
  choice: e derramarei sobre vocês bênção
  rationale: O verbo descreve esvaziar ou derramar abundantemente; “bênção” mantém a amplitude do substantivo hebraico sem restringi-lo à prosperidade material.
- source_word: עַד בְּלִי דָי
  choice: até que não haja mais necessidade
  rationale: A expressão indica abundância além do suficiente; a formulação comunica suficiência plena sem impor a imagem interpretativa de falta de espaço.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o tetragrama; “Yahweh” preserva o nome pactual em vez de substituí-lo por um título.
- issue: Alcance da bênção prometida
  choice: bênção em sentido geral
  alternative: prosperidade material específica; chuva agrícola
  rationale: O contexto inclui provisão agrícola e pactual, mas בְּרָכָה permanece amplo; a tradução não limita a promessa a uma fórmula doutrinária posterior.
- issue: Força retórica de אִם לֹא
  choice: para ver se não abrirei
  alternative: certamente abrirei
  rationale: A redação preserva a forma do desafio divino e sua tensão retórica, sem converter silenciosamente a pergunta implícita numa afirmação direta.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas verbais no plural e “vocês” para legibilidade brasileira. A sintaxe conserva o convite incomum para pôr Deus à prova e a imagem bíblica das janelas do céu, recorrendo a equivalência ótima apenas onde a construção hebraica exigiria esclarecimento em português.
