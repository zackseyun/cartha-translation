id: MAL.3.14
reference: Malachi 3:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֲמַרְתֶּ֕ם שָׁ֖וְא עֲבֹ֣ד אֱלֹהִ֑ים וּ/מַה בֶּ֗צַע כִּ֤י שָׁמַ֨רְנוּ֙ מִשְׁמַרְתּ֔/וֹ וְ/כִ֤י הָלַ֨כְנוּ֙ קְדֹ֣רַנִּ֔ית מִ/פְּנֵ֖י יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/014.yaml
  text: You have said[a], ‘It is vain to serve God[d][c][b]. And what profit is it that we have kept his charge and that we have walked in mourning before Yahweh of hosts?’
translation:
  language: pt
  text: 'Vocês disseram: “É inútil servir a Deus. Que vantagem tivemos em cumprir o que ele ordenou[a] e em andar de luto[b] diante de Yahweh dos Exércitos?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lit.: “guardar a sua incumbência”; também pode ser entendido como “cumprir a sua exigência”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “andar sombrios”; a expressão provavelmente se refere a uma conduta ou aparência de luto ou penitência.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁוְא
  choice: inútil
  rationale: Expressa a ideia de futilidade ou falta de proveito e soa natural na afirmação “É inútil servir a Deus”.
- source_word: עֲבֹד
  choice: servir
  rationale: O verbo abrange o serviço prestado a Deus, sem restringir o sentido ao culto ritual.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Neste contexto, refere-se claramente ao Deus de Israel.
- source_word: בֶּצַע
  choice: vantagem
  rationale: Preserva a noção de ganho ou benefício na pergunta retórica, em português corrente e sem exigir uma leitura estritamente financeira.
- source_word: מִשְׁמַרְתּוֹ
  choice: cumprir o que ele ordenou
  rationale: Torna natural em português a expressão hebraica relativa a guardar uma incumbência, obrigação ou exigência divina.
- source_word: קְדֹרַנִּית
  choice: andar de luto
  rationale: Conserva tanto o verbo de movimento quanto a provável referência a uma conduta ou aparência sombria, penitencial ou enlutada.
- source_word: מִפְּנֵי
  choice: diante de
  rationale: Representa adequadamente a ideia de estar perante ou na presença de Deus.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Translitera o nome divino e preserva em “dos Exércitos” a imagem do título צְבָאוֹת.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico traz o nome próprio divino; “Yahweh” o representa diretamente, em vez de substituí-lo por um título.
- issue: Alcance da queixa sobre a observância religiosa
  choice: Servir a Deus, cumprir sua ordem e andar de luto são apresentados como práticas das quais os falantes dizem não ter obtido vantagem.
  alternative: Limitar a queixa exclusivamente a ritos penitenciais ou de luto.
  rationale: A sintaxe reúne os três elementos na mesma queixa, sem definir se a conduta foi sincera nem endossar a avaliação dos falantes.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O discurso direto mantém o tom de queixa cínica. “Vocês” comunica naturalmente o plural hebraico; “Yahweh dos Exércitos” preserva o nome divino e o título tradicional sem paráfrase teológica.
