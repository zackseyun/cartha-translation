  text: וְ/אִשְּׁר֥וּ אֶתְ/כֶ֖ם כָּל הַ/גּוֹיִ֑ם כִּֽי תִהְי֤וּ אַתֶּם֙ אֶ֣רֶץ חֵ֔פֶץ אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/012.yaml
  text: Then all the nations will call you blessed[a], for you will be a delightful land, says Yahweh of hosts.
translation:
  language: pt
  text: Então todas as nações chamarão vocês de felizes, pois vocês serão uma terra desejável[a], diz Yahweh dos Exércitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma terra de deleite” ou “uma terra agradável”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִשְּׁרוּ
  choice: considerarão ... felizes
  rationale: O piel de אשר expressa declarar ou considerar alguém feliz ou abençoado. A formulação é natural em português e preserva o reconhecimento público por parte das nações.
- source_word: כָּל הַגּוֹיִם
  choice: todas as nações
  rationale: גּוֹיִם designa aqui os povos ou nações em conjunto, sem exigir o sentido técnico posterior de “gentios”.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão pela qual as nações considerarão o povo feliz.
- source_word: תִהְיוּ אַתֶּם
  choice: vocês serão
  rationale: Reproduz o futuro de היה e a referência direta ao povo; o pronome explícito hebraico dá ênfase, que o português comunica adequadamente com “vocês”.
- source_word: אֶרֶץ חֵפֶץ
  choice: uma terra desejável
  rationale: A expressão significa literalmente uma terra de prazer, deleite ou desejo. “Terra desejável” preserva tanto o valor positivo quanto a ligação concreta com a terra favorecida por Deus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Tradução corrente e inteligível que conserva a imagem de forças organizadas sob a autoridade divina, sem especificar apenas exércitos terrenos ou celestes.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal da aliança em vez de substituí-lo por um título.
- issue: Relação entre o povo e a “terra desejável”
  choice: Manter a formulação direta “vocês serão uma terra desejável”
  alternative: Explicitar “a terra de vocês será desejável”
  rationale: O hebraico identifica diretamente os destinatários com uma terra desejável. A tradução mantém essa personificação e não resolve silenciosamente se o foco recai sobre o povo, o território ou ambos.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Considerarão vocês felizes” evita uma construção excessivamente literal, enquanto “terra desejável” preserva a concisão e a ambiguidade poética do hebraico.
