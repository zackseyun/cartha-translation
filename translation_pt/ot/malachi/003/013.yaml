  text: חָזְק֥וּ עָלַ֛/י דִּבְרֵי/כֶ֖ם אָמַ֣ר יְהוָ֑ה וַ/אֲמַרְתֶּ֕ם מַה נִּדְבַּ֖רְנוּ עָלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/013.yaml
  text: Your words have been hard against me[a], says Yahweh. But you say, “What have we spoken against you?”
translation:
  language: pt
  text: '“As palavras de vocês têm sido duras contra mim[a]”, diz Yahweh. Mas vocês dizem: “O que temos falado contra ti?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “As palavras de vocês têm sido ásperas contra mim”. O hebraico diz literalmente “têm sido fortes contra mim”, empregando “fortes” para indicar palavras contundentes ou severas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזְקוּ
  choice: têm sido duras
  rationale: O verbo denota força; tendo “palavras” como sujeito e seguido de עַל, comunica fala forte, severa ou áspera. A formulação preserva a imagem hebraica de modo natural em português.
- source_word: עָלַי
  choice: contra mim
  rationale: Neste contexto de acusação, עַל tem sentido adversativo, retomado no fim do versículo.
- source_word: דִּבְרֵיכֶם
  choice: as palavras de vocês
  rationale: Tradução direta e corrente do plural construto com sufixo de segunda pessoa masculina plural.
- source_word: אָמַר יְהוָה
  choice: diz Yahweh
  rationale: O presente preserva a vivacidade da fórmula profética, e o nome divino é transliterado.
- source_word: וַאֲמַרְתֶּם
  choice: Mas vocês perguntam
  rationale: A conjunção introduz a objeção contrastante do povo. Como vem seguida de uma pergunta explícita, “perguntam” é natural sem alterar a função discursiva.
- source_word: מַה נִּדְבַּרְנוּ
  choice: O que temos falado
  rationale: A forma de דבר é vertida idiomaticamente como fala realizada; o perfeito composto combina naturalmente com a acusação anterior em português.
- source_word: עָלֶיךָ
  choice: contra ti
  rationale: Mantém o sentido adversativo e o paralelismo com “contra mim”; “ti” deixa claro que a resposta é dirigida diretamente a Yahweh.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Força da acusação חָזְקוּ עָלַי
  choice: têm sido duras contra mim
  alternative: têm sido ásperas contra mim; têm sido fortes contra mim
  rationale: “Duras” conserva a metáfora de força aplicada às palavras e expressa sua severidade, sem especificar além do hebraico o conteúdo da afronta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural dirigido ao povo e “ti” na fala direta dirigida a Deus. A repetição de “contra” preserva o paralelismo e o tom de controvérsia do hebraico.
