  text: וְ/עַתָּ֕ה אֲנַ֖חְנוּ מְאַשְּׁרִ֣ים זֵדִ֑ים גַּם נִבְנוּ֙ עֹשֵׂ֣י רִשְׁעָ֔ה גַּ֧ם בָּחֲנ֛וּ אֱלֹהִ֖ים וַ/יִּמָּלֵֽטוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/015.yaml
  text: So now we call the arrogant blessed[a]; evildoers are even built up[c][b]; they even test God and escape.’
translation:
  language: pt
  text: Por isso, agora chamamos felizes os arrogantes[a]. Até os que praticam a maldade prosperam[b]; até põem Deus à prova[c] e escapam.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os presunçosos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “são edificados”; isto é, são estabelecidos ou prosperam.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “testam Deus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Por isso, agora
  rationale: No contexto, introduz a conclusão presente do povo em continuidade com a queixa anterior; a formulação comunica tanto a ligação quanto a força inferencial.
- source_word: מְאַשְּׁרִים
  choice: chamamos felizes
  rationale: Preserva o sentido declarativo de considerar ou proclamar alguém feliz ou afortunado, em linguagem portuguesa natural.
- source_word: זֵדִים
  choice: os arrogantes
  rationale: Designa pessoas insolentes e presunçosas; “arrogantes” é atual, claro e adequado à censura moral do contexto.
- source_word: גַּם
  choice: até
  rationale: Expressa a adição enfática e a intensificação da queixa.
- source_word: נִבְנוּ
  choice: prosperam
  rationale: O passivo literal “são edificados” funciona aqui metaforicamente no sentido de serem estabelecidos ou prosperarem; a tradução comunica esse sentido contextual, enquanto a nota conserva a imagem hebraica.
- source_word: עֹשֵׂי רִשְׁעָה
  choice: os que praticam a maldade
  rationale: Reproduz a construção participial e destaca a prática persistente da maldade sem recorrer a uma expressão pouco natural.
- source_word: בָּחֲנוּ אֱלֹהִים
  choice: põem Deus à prova
  rationale: No contexto de conduta ímpia, o verbo descreve um desafio presunçoso dirigido a Deus, não uma avaliação neutra.
- source_word: וַיִּמָּלֵטוּ
  choice: e escapam
  rationale: Mantém o sentido de saírem ilesos ou sem punição, que sustenta a queixa dos falantes.
theological_decisions:
- issue: Tradução de אֱלֹהִים em contexto referente ao Deus de Israel
  choice: Deus
  alternative: deus/deuses
  rationale: Aqui o substantivo designa o Deus de Israel e funciona como título comum, não como o nome divino יהוה.
- issue: Força de בָּחֲנוּ אֱלֹהִים
  choice: põem Deus à prova
  alternative: testam Deus
  rationale: A opção escolhida torna clara a conotação de desafio presunçoso, sem acrescentar uma explicação doutrinária nem eliminar o sentido básico de testar.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe mantém a progressão enfática do hebraico. A fala é encerrada por aspas conforme o contexto literário fornecido; os marcadores de todas as notas aparecem no texto.
