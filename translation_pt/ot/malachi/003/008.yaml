  text: הֲ/יִקְבַּ֨ע אָדָ֜ם אֱלֹהִ֗ים כִּ֤י אַתֶּם֙ קֹבְעִ֣ים אֹתִ֔/י וַ/אֲמַרְתֶּ֖ם בַּ/מֶּ֣ה קְבַעֲנ֑וּ/ךָ הַֽ/מַּעֲשֵׂ֖ר וְ/הַ/תְּרוּמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/008.yaml
  text: Will a man rob God? Yet you are robbing me[a]. But you say[b], “How have we robbed you?” In the tithe and the contribution.
translation:
  language: pt
  text: 'Acaso alguém roubará a Deus? No entanto, vocês estão me roubando. Mas vocês perguntam: “Como te roubamos?” Nos dízimos e nas contribuições.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nas ofertas”. O termo hebraico pode designar uma contribuição separada para uso sagrado.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְבַּע / קֹבְעִים / קְבַעֲנוּךָ
  choice: roubará / estão roubando / temos roubado
  rationale: O verbo קבע indica tirar injustamente de Deus aquilo que lhe é devido. “Roubar” preserva em português a força e o impacto da acusação.
- source_word: אָדָם
  choice: alguém
  rationale: אָדָם tem aqui sentido humano genérico. “Alguém” é natural, inclusivo e mantém a concisão da pergunta retórica sem sugerir que a referência seja exclusivamente masculina.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Neste contexto, אֱלֹהִים designa o Deus de Israel; “Deus” é a correspondência padrão e clara.
- source_word: כִּי
  choice: No entanto
  rationale: Neste contexto, כִּי introduz o contraste surpreendente entre a aparente inconcebibilidade de roubar a Deus e o fato de o povo estar fazendo isso.
- source_word: בַּמֶּה
  choice: Como
  rationale: A expressão interrogativa pergunta de que maneira o povo roubou a Deus; “Como” é idiomático e preciso.
- source_word: הַמַּעֲשֵׂר
  choice: os dízimos
  rationale: מַעֲשֵׂר é o termo estabelecido para a décima parte devida a Deus. O plural soa natural na acusação coletiva e é tradicional no contexto.
- source_word: הַתְּרוּמָה
  choice: as contribuições
  rationale: תְּרוּמָה designa aquilo que é separado e entregue para uso sagrado. “Contribuições” preserva essa noção sem impor um gesto ritual específico.
theological_decisions:
- issue: Sentido genérico de אָדָם
  choice: Acaso alguém roubará a Deus?
  alternative: Acaso um ser humano roubará a Deus?
  rationale: O singular אָדָם é genérico e proverbial. “Alguém” comunica esse alcance com naturalidade no português moderno.
- issue: Objeto implícito na resposta final
  choice: Nos dízimos e nas contribuições.
  alternative: Nos dízimos e nas ofertas.
  rationale: O hebraico responde de forma elíptica, sem acrescentar verbo ou pronome. A tradução preserva essa concisão e mantém a distinção lexical entre מַעֲשֵׂר e תְּרוּמָה.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A pergunta inicial conserva a força retórica; “vocês” expressa naturalmente o plural hebraico. A formulação evita tecnicismo ritual desnecessário.
