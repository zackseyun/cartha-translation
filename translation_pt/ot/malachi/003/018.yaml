source:
  edition: WLC
  text: וְ/שַׁבְתֶּם֙ וּ/רְאִיתֶ֔ם בֵּ֥ין צַדִּ֖יק לְ/רָשָׁ֑ע בֵּ֚ין עֹבֵ֣ד אֱלֹהִ֔ים לַ/אֲשֶׁ֖ר לֹ֥א עֲבָדֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/018.yaml
  text: Then you will again see the difference between the righteous and the wicked[a], between one who serves God and one who does not serve him.
translation:
  language: pt
  text: Então vocês voltarão a ver a diferença entre o justo e o perverso[a], entre quem serve a Deus e quem não o serve.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Então vocês voltarão e verão entre o justo e o perverso”. A expressão hebraica provavelmente indica que eles voltarão a perceber a distinção.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתֶּם
  choice: Então vocês voltarão a
  rationale: שׁוב significa literalmente “voltar”. Ligado a “ver”, indica que os destinatários voltarão a perceber a distinção. A formulação preserva tanto a ideia de retorno quanto o sentido contextual de percepção renovada.
- source_word: וּרְאִיתֶם
  choice: ver
  rationale: ראה tem o sentido básico de “ver” e, neste contexto, inclui reconhecer ou perceber. “Ver” mantém a imagem concreta do hebraico sem excluir esse sentido.
- source_word: בֵּין ... לְ
  choice: a diferença entre
  rationale: A construção repetida marca contraste. Em português, “ver a diferença entre” expressa naturalmente a força comparativa implícita, enquanto a nota registra a formulação mais literal.
- source_word: צַדִּיק
  choice: o justo
  rationale: צַדִּיק designa a pessoa justa. “O justo” preserva a categoria moral e teológica e forma um contraste convencional e claro com “o perverso”.
- source_word: רָשָׁע
  choice: o perverso
  rationale: רָשָׁע é o antônimo usual de צַדִּיק e caracteriza quem pratica o mal. “Perverso” comunica essa oposição moral sem restringir o termo ao sentido jurídico de “culpado”.
- source_word: עֹבֵד אֱלֹהִים
  choice: quem serve a Deus
  rationale: עבד, tendo Deus como objeto, abrange serviço, lealdade, obediência e culto. “Serve a Deus” conserva essa amplitude.
- source_word: לַאֲשֶׁר לֹא עֲבָדוֹ
  choice: quem não o serve
  rationale: A construção relativa contrasta diretamente com quem serve a Deus, e o sufixo pronominal remete a Deus. O presente descreve naturalmente as duas classes contrastadas, embora a forma hebraica também possa ser vertida de modo mais temporal como “não o serviu”.
theological_decisions:
- issue: Se o contraste deve ser explicitamente ligado ao juízo final
  choice: Apresentar uma futura percepção da diferença entre o justo e o perverso, sem acrescentar linguagem explícita sobre o juízo final.
  alternative: Traduzir com uma explicitação como “no juízo vocês distinguirão novamente”.
  rationale: O contexto fala da ação vindoura de Deus e da vindicação, mas o versículo afirma apenas que os destinatários voltarão a ver a distinção. A tradução não acrescenta uma especificação escatológica ausente da frase hebraica.
translation_notes:
  register: Português atual, digno e acessível, com “vocês” para o plural hebraico. A construção “voltarão a ver” é natural tanto no Brasil quanto em grande parte do mundo lusófono. O paralelismo e as categorias morais do hebraico foram preservados.
