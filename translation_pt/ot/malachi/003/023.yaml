source:
  edition: WLC
  text: הִנֵּ֤ה אָֽנֹכִי֙ שֹׁלֵ֣חַ לָ/כֶ֔ם אֵ֖ת אֵלִיָּ֣ה הַ/נָּבִ֑יא לִ/פְנֵ֗י בּ֚וֹא י֣וֹם יְהוָ֔ה הַ/גָּד֖וֹל וְ/הַ/נּוֹרָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/023.yaml
  text: Look[b][a], I am sending Elijah the prophet to you before the coming of the great and fearful day of Yahweh.
translation:
  language: pt
  text: Eis que eu lhes envio o profeta Elias[a], antes que venha o grande e temível[b] dia de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Elias» pode ser entendido literalmente ou como referência a um precursor semelhante a Elias; o texto hebraico diz simplesmente «o profeta Elias».
    reason: cross_reference
  - marker: b
    text: 'Ou: «terrível».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Introduz com ênfase o anúncio divino e preserva a força apresentativa do hebraico em português claro e solene.
- source_word: אָנֹכִי
  choice: '[implícito na forma verbal]'
  rationale: A primeira pessoa já está expressa em «envio». Acrescentar «eu» seria possível, mas não é necessário para transmitir a ênfase no fluxo natural do português.
- source_word: שֹׁלֵחַ
  choice: envio
  rationale: O presente comunica a vivacidade e a iminência do particípio hebraico sem sugerir, de modo excessivamente específico, que a ação já esteja em andamento.
- source_word: לָכֶם
  choice: lhes
  rationale: Representa o destinatário plural da ação e é amplamente compreensível em português internacional e brasileiro.
- source_word: אֵלִיָּה הַנָּבִיא
  choice: o profeta Elias
  rationale: Mantém o nome próprio literal e o título, usando a ordem mais natural em português.
- source_word: לִפְנֵי בּוֹא
  choice: antes que venha
  rationale: Expressa com naturalidade a anterioridade temporal do infinitivo construto hebraico.
- source_word: יוֹם יְהוָה
  choice: dia de Yahweh
  rationale: Preserva a fórmula profética e representa explicitamente o nome divino presente no texto hebraico.
- source_word: הַגָּדוֹל
  choice: grande
  rationale: Conserva de modo direto tanto a magnitude quanto a importância do dia anunciado.
- source_word: וְהַנּוֹרָא
  choice: e temível
  rationale: Comunica que esse dia inspira temor e pavor, sem reduzir o termo a uma ideia meramente positiva de admiração.
theological_decisions:
- issue: Referente de «Elias»
  choice: Manter literalmente «o profeta Elias», sem identificação interpretativa no texto principal.
  alternative: Entender Elias como um precursor semelhante a Elias ou que atua no espírito e poder de Elias.
  rationale: O hebraico nomeia diretamente Elias. A tradução não deve resolver uma questão interpretativa que o próprio versículo deixa em aberto.
- issue: Tom de יוֹם יְהוָה הַגָּדוֹל וְהַנּוֹרָא
  choice: «o grande e temível dia de Yahweh»
  alternative: «o grande e terrível dia de Yahweh»
  rationale: «Temível» preserva conjuntamente a majestade e a ameaça do dia de julgamento, enquanto «terrível» explicita mais fortemente seu aspecto aterrador.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Eis que» conserva a solenidade enfática sem recorrer a uma construção obscura; a sintaxe restante é corrente e natural.
