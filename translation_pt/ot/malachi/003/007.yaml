  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לְ/מִ/ימֵ֨י אֲבֹתֵי/כֶ֜ם סַרְתֶּ֤ם מֵֽ/חֻקַּ/י֙ וְ/לֹ֣א שְׁמַרְתֶּ֔ם שׁ֤וּבוּ אֵלַ/י֙ וְ/אָשׁ֣וּבָה אֲלֵי/כֶ֔ם אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת וַ/אֲמַרְתֶּ֖ם בַּ/מֶּ֥ה נָשֽׁוּב׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/007.yaml
  text: From the days of your fathers you have turned aside from my statutes and have not kept them. Return to me[a], and I will return to you, says Yahweh of hosts. But you say, “How shall we return?”
translation:
  language: pt
  text: 'Desde os dias dos seus antepassados, vocês se desviaram dos meus decretos e não os guardaram. Voltem para mim, e eu voltarei para vocês, diz Yahweh dos Exércitos. Mas vocês perguntam: “Como voltaremos?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמִימֵי אֲבֹתֵיכֶם
  choice: Desde os dias dos seus antepassados
  rationale: A preposição marca uma extensão temporal iniciada no passado. “Antepassados” comunica naturalmente o sentido coletivo de אבות em português moderno, enquanto “desde os dias” conserva a imagem temporal hebraica.
- source_word: סַרְתֶּם
  choice: vocês se desviaram
  rationale: סור descreve afastar-se de um caminho ou padrão. “Desviaram” preserva a metáfora de abandono da obediência estabelecida.
- source_word: מֵחֻקַּי
  choice: dos meus decretos
  rationale: חֻקִּים designa prescrições ou determinações estabelecidas. “Decretos” é claro e digno em português, sem restringir o termo a uma terminologia confessional.
- source_word: וְלֹא שְׁמַרְתֶּם
  choice: e não os guardaram
  rationale: Em contexto de aliança e lei, שׁמר significa guardar ou observar. O pronome retoma naturalmente “decretos”.
- source_word: שׁוּבוּ אֵלַי
  choice: Voltem para mim
  rationale: שׁוב expressa retorno e, neste contexto profético, implica arrependimento sem que seja necessário explicitá-lo na tradução.
- source_word: וְאָשׁוּבָה אֲלֵיכֶם
  choice: e eu voltarei para vocês
  rationale: A repetição de שׁוב é mantida para preservar a reciprocidade e a força retórica do hebraico.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: “Yahweh” representa diretamente o nome divino, e “dos Exércitos” conserva a imagem plural de צְבָאוֹת, que pode abranger as hostes celestiais.
- source_word: בַּמֶּה נָשׁוּב
  choice: Como voltaremos?
  rationale: בַּמֶּה pergunta pelo modo ou meio; “Como” é a formulação portuguesa mais natural. O futuro “voltaremos” expressa adequadamente a pergunta deliberativa.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome próprio da aliança. “Yahweh” o distingue do título אֲדֹנָי e evita substituí-lo silenciosamente por um título.
- issue: Reciprocidade no chamado ao retorno
  choice: “Voltem para mim, e eu voltarei para vocês”
  alternative: “Convertam-se a mim, e eu me voltarei para vocês”
  rationale: Repetir o verbo “voltar” preserva o jogo retórico do mesmo verbo hebraico שׁוב nas duas orações e não define além do texto a natureza da resposta divina.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com “vocês” para o plural. A formulação mantém a acusação, o chamado e a resposta divina em paralelismo direto. Não foram necessárias notas de rodapé.
