base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/003.yaml
  text: He will sit as a refiner and purifier of silver[a], and he will purify the sons of Levi and refine them like gold and like silver, and they will be for Yahweh, presenting an offering in righteousness.
translation:
  language: pt
  text: Ele se assentará como refinador e purificador da prata; purificará os filhos de Levi e os refinará como o ouro e como a prata. Eles serão para o SENHOR, apresentando uma oferta[a] com justiça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma oferta de cereal”. O termo hebraico minḥá muitas vezes se refere especificamente a uma oferta de cereal, embora também possa designar, de modo mais amplo, uma oferta ou dádiva.'
    reason: Alternativa lexical para מִנְחָה.
lexical_decisions:
- source_word: וְיָשַׁב
  choice: Ele se assentará
  rationale: Preserva a imagem concreta do refinador sentado e atento ao seu trabalho, sem substituir o verbo por uma explicação interpretativa.
- source_word: מְצָרֵף וּמְטַהֵר כֶּסֶף
  choice: como refinador e purificador da prata
  rationale: Mantém os dois particípios ocupacionais e a metáfora metalúrgica de refinar e purificar a prata.
- source_word: וְטִהַר אֶת־בְּנֵי לֵוִי
  choice: purificará os filhos de Levi
  rationale: Conserva tanto a ressonância ritual e moral de טהר quanto a expressão genealógica literal 'filhos de Levi'.
- source_word: וְזִקַּק אֹתָם
  choice: e os refinará
  rationale: Emprega o verbo próprio da purificação de metais e retoma de modo natural a imagem anterior.
- source_word: כַּזָּהָב וְכַכָּסֶף
  choice: como o ouro e como a prata
  rationale: Reproduz a repetição da partícula comparativa hebraica e sua ênfase paralela.
- source_word: וְהָיוּ לַיהוָה
  choice: Eles serão para o SENHOR
  rationale: Mantém a construção relacional do hebraico, que pode sugerir dedicação ou pertencimento, sem tornar explícita apenas uma dessas nuances.
- source_word: לַיהוָה
  choice: para o SENHOR
  rationale: Representa o nome divino יהוה pela convenção reverencial amplamente reconhecida em português.
- source_word: מַגִּישֵׁי מִנְחָה
  choice: os que apresentam uma oferta
  rationale: Traduz o particípio como ação habitual ou característica e mantém מִנְחָה em sentido amplo no texto principal.
- source_word: בִּצְדָקָה
  choice: com justiça
  rationale: Preserva o substantivo 'justiça' e sua possível força ética e cultual, em vez de reduzi-lo a um advérbio.
theological_decisions:
- issue: Referência da imagem do refinamento
  choice: A purificação recai explicitamente sobre os filhos de Levi, preparando-os para apresentar ofertas adequadamente.
  alternative: Aplicar diretamente a imagem a todo Israel ou explicitar uma leitura messiânica posterior.
  rationale: O texto hebraico imediato nomeia a linhagem levítica. Leituras canônicas mais amplas não devem ser inseridas na formulação do versículo.
- issue: Especificidade de מִנְחָה
  choice: oferta
  alternative: oferta de cereal
  rationale: O termo pode designar uma oferta em sentido amplo, embora frequentemente indique uma oferta de cereal. A tradução principal preserva a amplitude lexical e registra a leitura técnica em nota.
- issue: Relação expressa por וְהָיוּ לַיהוָה
  choice: serão para o SENHOR
  alternative: pertencerão ao SENHOR; apresentarão ao SENHOR
  rationale: A formulação conserva a tensão entre dedicação ou pertencimento ao SENHOR e a relação do SENHOR com a oferta apresentada, sem resolver silenciosamente a construção.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A redação conserva a metáfora metalúrgica, o paralelismo e a expressão genealógica do hebraico. O ponto e vírgula organiza o período longo sem enfraquecer a continuidade da imagem.
