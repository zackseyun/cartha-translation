source:
  edition: WLC
  text: וְ/זָרְחָ֨ה לָ/כֶ֜ם יִרְאֵ֤י שְׁמִ/י֙ שֶׁ֣מֶשׁ צְדָקָ֔ה וּ/מַרְפֵּ֖א בִּ/כְנָפֶ֑י/הָ וִֽ/יצָאתֶ֥ם וּ/פִשְׁתֶּ֖ם כְּ/עֶגְלֵ֥י מַרְבֵּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/020.yaml
  text: But for you who fear my name[a], the sun of righteousness will rise with healing in its wings[c][b]; and you will go out and leap like calves from the stall.
translation:
  language: pt
  text: Mas, para vocês que temem o meu nome, nascerá o sol da justiça[a], com cura em suas asas[b]; e vocês sairão e saltarão[c] como bezerros que saem do curral.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o sol da vindicação”. O termo hebraico pode expressar justiça, retidão ou vindicação.
    reason: lexical_alternative
  - marker: b
    text: Ou “em seus raios”. A palavra hebraica para “asas” pode ser usada metaforicamente para as extremidades ou os raios do sol.
    reason: lexical_alternative
  - marker: c
    text: Ou “pularão” ou “brincarão”. O verbo hebraico é raro e pode indicar movimento exuberante; alguns o entendem como “engordarão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָרְחָה
  choice: nascerá
  rationale: O verbo זרח descreve o nascer ou o resplandecer de um astro. “Nascerá” é a expressão portuguesa mais natural para o sol e preserva o valor futuro do contexto.
- source_word: יִרְאֵי שְׁמִי
  choice: vocês que temem o meu nome
  rationale: A expressão participial identifica os destinatários, e לָכֶם estabelece a orientação na segunda pessoa. A formulação preserva ambos os aspectos em português corrente.
- source_word: שֶׁמֶשׁ צְדָקָה
  choice: o sol da justiça
  rationale: Mantém a metáfora concreta e a amplitude de צְדָקָה, que pode envolver justiça, retidão e vindicação, sem restringi-la a uma única leitura.
- source_word: וּמַרְפֵּא
  choice: com cura
  rationale: מַרְפֵּא é um substantivo que significa cura ou remédio. “Com cura” conserva a construção nominal concisa do hebraico.
- source_word: בִּכְנָפֶיהָ
  choice: em suas asas
  rationale: כָּנָף significa literalmente “asa” e pode, nesta imagem solar, referir-se às extremidades ou aos raios. O texto principal preserva a metáfora hebraica.
- source_word: וִיצָאתֶם
  choice: vocês sairão
  rationale: Tradução direta de יצא, adequada à imagem de animais deixando um espaço fechado.
- source_word: וּפִשְׁתֶּם
  choice: saltarão
  rationale: O verbo raro provavelmente descreve movimento exuberante. “Saltarão” combina naturalmente com a imagem dos bezerros libertos, enquanto a alternativa tradicional “engordarão” permanece registrada em nota.
- source_word: כְּעֶגְלֵי מַרְבֵּק
  choice: como bezerros soltos do curral
  rationale: מַרְבֵּק designa curral, estábulo ou lugar de engorda. “Soltos do curral” torna explícita, de modo econômico, a imagem contextual de saída e movimento jubiloso.
theological_decisions:
- issue: Possível interpretação messiânica de “o sol da justiça”
  choice: Manter a metáfora sem identificar explicitamente o sol com o Messias.
  alternative: Traduzir ou explicar a expressão como um título direto do Messias/Cristo.
  rationale: Embora a leitura messiânica tenha longa história na tradição cristã, o hebraico apresenta diretamente uma imagem de libertação e restauração para os que temem o nome de Deus. Preservar a metáfora evita inserir no texto uma identificação teológica que o versículo não explicita.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. A metáfora “sol da justiça” e a imagem de “asas” foram preservadas; alternativas lexicais relevantes aparecem em notas. A colocação dos marcadores foi corrigida para que cada nota acompanhe a expressão correspondente.
