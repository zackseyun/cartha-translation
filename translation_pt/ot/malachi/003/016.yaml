id: MAL.3.16
reference: Malachi 3:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אָ֧ז נִדְבְּר֛וּ יִרְאֵ֥י יְהוָ֖ה אִ֣ישׁ אֶת רֵעֵ֑/הוּ וַ/יַּקְשֵׁ֤ב יְהוָה֙ וַ/יִּשְׁמָ֔ע וַ֠/יִּכָּתֵב סֵ֣פֶר זִכָּר֤וֹן לְ/פָנָי/ו֙ לְ/יִרְאֵ֣י יְהוָ֔ה וּ/לְ/חֹשְׁבֵ֖י שְׁמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/016.yaml
  text: Then those who feared Yahweh spoke with one another[a], and Yahweh paid attention and heard[b]; and a book of remembrance was written before him for those who fear Yahweh and who esteem his name.
translation:
  language: pt
  text: Então os que temiam Yahweh conversaram uns com os outros[a]. Yahweh prestou atenção e ouviu, e diante dele foi escrito um livro de recordação acerca dos que temem Yahweh e dos que têm seu nome em alta consideração.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “cada um com seu companheiro”. A expressão hebraica indica que conversavam entre si.
    reason: lexical_alternative
  - marker: b
    text: A expressão também pode ser traduzida como “dos que pensam em seu nome” ou “dos que estimam seu nome”. “Acerca dos” também pode ser entendido como “para os” ou “em favor dos”.
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Marca a resposta que se segue à situação anterior, de modo temporal e natural em português.
- source_word: נִדְבְּרוּ
  choice: conversaram
  rationale: O nifal plural tem sentido recíproco neste contexto; junto de 'uns com os outros', expressa uma conversa mútua.
- source_word: יִרְאֵי יְהוָה
  choice: os que temiam Yahweh
  rationale: Preserva o peso bíblico e pactual de ירא sem o suavizar para mera reverência.
- source_word: אִישׁ אֶת־רֵעֵהוּ
  choice: uns com os outros
  rationale: Reproduz naturalmente o valor distributivo e recíproco da expressão hebraica, literalmente 'um homem com seu companheiro'.
- source_word: וַיַּקְשֵׁב
  choice: prestou atenção
  rationale: Expressa escuta atenta e mantém a distinção em relação ao verbo seguinte, 'ouviu'.
- source_word: וַיִּשְׁמָע
  choice: ouviu
  rationale: Tradução direta que preserva a sequência hebraica de atenção e audição.
- source_word: וַיִּכָּתֵב
  choice: foi escrito
  rationale: Mantém diretamente a voz passiva do hebraico, sem especificar um agente não declarado.
- source_word: סֵפֶר זִכָּרוֹן
  choice: um livro de recordação
  rationale: Preserva tanto a forma concreta de registro quanto sua função memorial.
- source_word: לְפָנָיו
  choice: diante dele
  rationale: Expressa de maneira concisa a ideia de que o registro permanece na presença de Yahweh.
- source_word: לְיִרְאֵי יְהוָה
  choice: acerca dos que temem Yahweh
  rationale: A preposição pode indicar referência; 'acerca de' evita decidir que o livro foi necessariamente escrito em benefício deles.
- source_word: וּלְחֹשְׁבֵי שְׁמוֹ
  choice: e dos que têm seu nome em alta consideração
  rationale: Expressa consideração reverente e estima, conservando a amplitude de חשב sem reduzi-lo a mero pensamento.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Terminologia dos que temem a Deus
  choice: os que temiam Yahweh / os que temem Yahweh
  alternative: os que reverenciavam o Senhor
  rationale: Mantém o vocabulário bíblico do temor de Yahweh, que abrange reverência, lealdade e temor, sem suavizar sua tensão.
- issue: Sentido de וּלְחֹשְׁבֵי שְׁמוֹ
  choice: os que têm seu nome em alta consideração
  alternative: os que pensam em seu nome / os que estimam seu nome
  rationale: Comunica consideração reverente e valorização, ao mesmo tempo que a nota preserva as possibilidades mais literais.
- issue: Relação expressa por לְ antes dos grupos registrados
  choice: acerca dos
  alternative: para os / em favor dos
  rationale: A preposição admite valor referencial ou benefactivo. O texto principal usa a leitura referencial mais neutra, e a nota registra a alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A redação preserva o paralelismo entre 'prestou atenção' e 'ouviu', mantém o nome Yahweh e evita linguagem denominacional.
