revisions:
- from: Vocês pisotearão os perversos, pois eles serão cinza debaixo das plantas dos seus pés, no dia em que eu agir, diz Yahweh dos Exércitos.[a]
  to: Vocês pisotearão os perversos, pois eles serão cinzas sob as plantas dos pés de vocês, no dia em que eu agir, diz Yahweh dos Exércitos.[a]
  rationale: A única alteração substitui «cinza» por «cinzas» para tornar inequívoca, em português moderno, a metáfora de destruição expressa pelo hebraico אֵפֶר. A mudança de «debaixo das plantas dos seus pés» para «sob as plantas dos pés de vocês» explicita de forma natural o referente do sufixo de segunda pessoa plural. Não se acrescenta nenhuma interpretação sobre a natureza da ação divina ou sobre a realização da imagem.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:55:36Z'
review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva com precisão a sequência e as relações do hebraico: o pisoteio dos perversos, a razão introduzida por כי, a imagem de cinzas sob os pés, o dia da ação divina e a fórmula de fala de Yahweh dos Exércitos. Contudo, «eles serão cinza» pode ser lido em português como «ficarão de cor cinzenta», enfraquecendo ou obscurecendo a imagem material de אֵפֶר.'
  naturalness: «Vocês pisotearão» e «no dia em que eu agir» são claros e naturais no registro adotado. «Cinzas» é a forma portuguesa mais idiomática e inequívoca neste contexto. «Sob as plantas dos pés de vocês» mantém o possessivo de segunda pessoa expresso no hebraico e evita a possível ambiguidade de «seus pés».
  terminology: «Yahweh dos Exércitos» representa adequadamente יהוה צבאות. A nota com «SENHOR dos Exércitos» registra de modo útil a forma tradicional do nome divino com o título.
  issues:
  - severity: medium
    issue: «eles serão cinza» é semanticamente ambíguo em português contemporâneo.
    rationale: Embora «cinza» possa designar o resíduo da combustão, na predicação com «serão» a leitura mais imediata pode ser a cor («serão cinza»). «Serão cinzas» comunica sem ambiguidade a imagem de אֵפֶר, sem transformar a predicação direta em comparação ou explicação.
  revised_text: Vocês pisotearão os perversos, pois eles serão cinzas sob as plantas dos pés de vocês, no dia em que eu agir, diz Yahweh dos Exércitos.[a]
  revised_footnotes:
