  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַסּוֹתֶ֣ם רְשָׁעִ֔ים כִּֽי יִהְי֣וּ אֵ֔פֶר תַּ֖חַת כַּפּ֣וֹת רַגְלֵי/כֶ֑ם בַּ/יּוֹם֙ אֲשֶׁ֣ר אֲנִ֣י עֹשֶׂ֔ה אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/021.yaml
  text: And you will trample the wicked[a], for they will be ashes under the soles of your feet on the day when I act, says Yahweh of Armies.
translation:
  language: pt
  text: Vocês pisotearão os perversos, pois eles serão cinzas sob as plantas dos pés de vocês, no dia em que eu agir, diz Yahweh dos Exércitos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “SENHOR dos Exércitos”.'
    reason: Registra a forma tradicional de representar o nome divino e o título completo.
lexical_decisions:
- source_word: וְעַסּוֹתֶם
  choice: Vocês pisotearão
  rationale: O verbo raro descreve o ato de calcar ou pisar sobre alguém. “Pisotearão” preserva a imagem concreta de vitória e sujeição, em português natural.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: O adjetivo substantivado designa pessoas moralmente culpadas. “Os perversos” mantém a categoria moral e o tom solene sem acrescentar uma explicação.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão ou explicação para o pisoteio; “pois” conserva essa relação de modo conciso.
- source_word: יִהְיוּ אֵפֶר
  choice: eles serão cinza
  rationale: O hebraico apresenta uma predicação direta, não uma comparação. “Cinza” no singular coletivo corresponde ao substantivo hebraico e é idiomático em português.
- source_word: תַּחַת כַּפּוֹת רַגְלֵיכֶם
  choice: debaixo das plantas dos seus pés
  rationale: כַּף, quando relacionado ao pé, indica a planta. A expressão portuguesa conserva precisamente a imagem espacial.
- source_word: בַּיּוֹם אֲשֶׁר אֲנִי עֹשֶׂה
  choice: no dia em que eu agir
  rationale: A construção é elíptica no hebraico e aponta para a intervenção decisiva de Deus. “Agir” torna a frase natural sem especificar além do texto que ação será essa.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: “Yahweh” representa diretamente o nome divino, e “dos Exércitos” comunica de forma transparente o sentido marcial e cósmico de צְבָאוֹת.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” preserva sua função de nome pactual, enquanto a alternativa tradicional “SENHOR” é registrada em nota.
- issue: Tradução do título צְבָאוֹת
  choice: dos Exércitos
  alternative: dos Exércitos celestiais / dos Exércitos do céu
  rationale: “Dos Exércitos” conserva a amplitude do título sem restringi-lo explicitamente apenas aos seres celestiais nem recorrer ao menos transparente “das Hostes”.
- issue: Natureza da imagem de julgamento
  choice: eles serão cinza
  alternative: eles serão como cinza
  rationale: Não há partícula comparativa no hebraico. A formulação direta preserva a força da imagem sem decidir se deve ser entendida de forma estritamente literal ou figurada.
translation_notes:
  register: Português moderno, claro e solene, com tratamento plural por “vocês”, amplamente compreensível no Brasil e em contexto internacional. A imagem física do pisoteio e a predicação direta “serão cinza” foram mantidas; evitou-se explicitar o tipo de ação divina além do que o hebraico afirma.
