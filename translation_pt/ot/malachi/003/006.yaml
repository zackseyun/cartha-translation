id: MAL.3.6
reference: Malachi 3:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֛י אֲנִ֥י יְהוָ֖ה לֹ֣א שָׁנִ֑יתִי וְ/אַתֶּ֥ם בְּנֵֽי יַעֲקֹ֖ב לֹ֥א כְלִיתֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/006.yaml
  text: For I[a], Yahweh, do not change; and you, sons of Jacob[b], have not come to an end.
translation:
  language: pt
  text: Pois eu, Yahweh, não mudo; e vocês, filhos de Jacó,[a] não chegaram ao fim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “filhos de Jacó”, designação pactual dos descendentes de Jacó, isto é, Israel.
    reason: cultural_note
  - marker: b
    text: Ou “não foram consumidos”, “não foram destruídos” ou “não pereceram”. O verbo hebraico pode ter o sentido de acabar, consumir ou levar ao fim.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento da afirmação anterior, preservando de modo natural a força explicativa da conjunção hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לֹא שָׁנִיתִי
  choice: não mudo
  rationale: O perfeito hebraico, neste contexto, expressa a constância duradoura de Yahweh; o presente em português comunica naturalmente essa verdade contínua.
- source_word: וְאַתֶּם
  choice: e vocês
  rationale: Mantém a conjunção hebraica sem tornar explícita uma relação conclusiva que o texto apenas deixa implícita; “vocês” oferece ampla legibilidade brasileira.
- source_word: בְּנֵי יַעֲקֹב
  choice: filhos de Jacó
  rationale: Preserva a forma masculina plural e a designação pactual dos descendentes de Jacó, explicada em nota.
- source_word: לֹא כְלִיתֶם
  choice: não chegaram ao fim
  rationale: Conserva a amplitude semântica de כלה, que pode indicar chegar ao fim, ser consumido ou perecer, sem especificar além do hebraico o modo do juízo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o nome divino. “Yahweh” preserva sua função como nome pactual sem substituí-lo por um título.
- issue: Aspecto da constância divina em לֹא שָׁנִיתִי
  choice: não mudo
  alternative: não mudei
  rationale: O presente expressa em português a constância contínua afirmada no contexto, sem acrescentar uma formulação filosófica ao texto.
- issue: Relação entre as duas orações marcada por וְ
  choice: e vocês
  alternative: por isso vocês; portanto vocês
  rationale: A preservação de “e” mantém a relação lógica implícita e evita transformar a conjunção em uma conclusão explícita.
- issue: Designação pactual בְּנֵי יַעֲקֹב
  choice: filhos de Jacó
  alternative: descendentes de Jacó; povo de Jacó
  rationale: Mantém a imagem e a forma do hebraico, enquanto a nota esclarece que a expressão designa Israel.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência brasileira em “vocês”. A ordem e a coordenação das orações permanecem próximas do hebraico, enquanto “não chegaram ao fim” preserva a ambiguidade lexical do verbo final. As notas foram posicionadas junto às expressões que efetivamente esclarecem.
