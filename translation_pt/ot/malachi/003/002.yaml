  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/מִ֤י מְכַלְכֵּל֙ אֶת י֣וֹם בּוֹא֔/וֹ וּ/מִ֥י הָ/עֹמֵ֖ד בְּ/הֵרָֽאוֹת֑/וֹ כִּֽי הוּא֙ כְּ/אֵ֣שׁ מְצָרֵ֔ף וּ/כְ/בֹרִ֖ית מְכַבְּסִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/002.yaml
  text: But who can endure the day of his coming[a], and who can stand when he appears? For he is like a refiner’s fire and like launderers’ soap.
translation:
  language: pt
  text: Mas quem poderá suportar o dia da sua vinda? E quem poderá ficar de pé quando ele aparecer? Pois ele é como o fogo do refinador e como o sabão usado por lavadores de roupa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como a lixívia dos lavandeiros”. O termo hebraico designa um forte agente alcalino usado para lavar tecidos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְכַלְכֵּל
  choice: poderá suportar
  rationale: Neste contexto, o verbo expressa a capacidade de aguentar ou resistir àquele dia. “Poderá suportar” é natural em português e mantém a força da pergunta retórica.
- source_word: יוֹם בּוֹאוֹ
  choice: o dia da sua vinda
  rationale: Preserva a construção hebraica e o peso profético da expressão sem tornar a frase obscura.
- source_word: הָעֹמֵד
  choice: poderá ficar de pé
  rationale: O particípio está em paralelismo com a pergunta anterior e indica a capacidade de permanecer diante da manifestação daquele que vem.
- source_word: בְּהֵרָאוֹתוֹ
  choice: quando ele aparecer
  rationale: A forma nifal é expressa naturalmente como uma oração temporal, conservando a ideia de ele se tornar visível ou se manifestar.
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação para a dificuldade de suportar sua vinda e permanecer de pé.
- source_word: כְּאֵשׁ מְצָרֵף
  choice: como o fogo do refinador
  rationale: Mantém de modo claro a metáfora do fogo empregado para provar e purificar metais.
- source_word: וּכְבֹרִית מְכַבְּסִים
  choice: como o sabão usado por lavadores de roupa
  rationale: Comunica em linguagem atual a imagem de um forte agente alcalino empregado na lavagem de tecidos, sem depender do termo profissional menos conhecido “lavandeiros”.
theological_decisions:
- issue: Natureza da ação daquele que vem
  choice: Conservar as imagens severas de refinação e limpeza sem definir a ação exclusivamente como destruição ou exclusivamente como santificação.
  alternative: Interpretar a figura somente como juízo destrutivo ou somente como purificação sacerdotal.
  rationale: O fogo do refinador e o agente de lavagem sugerem prova, severidade e purificação. A tradução mantém essa tensão própria do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo das duas perguntas foi preservado, e a expressão profética “dia da sua vinda” foi mantida. O marcador da nota foi colocado junto à expressão que ela explica.
