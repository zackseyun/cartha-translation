  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הִנְ/נִ֤י שֹׁלֵחַ֙ מַלְאָכִ֔/י וּ/פִנָּה דֶ֖רֶךְ לְ/פָנָ֑/י וּ/פִתְאֹם֩ יָב֨וֹא אֶל הֵיכָל֜/וֹ הָ/אָד֣וֹן אֲשֶׁר אַתֶּ֣ם מְבַקְשִׁ֗ים וּ/מַלְאַ֨ךְ הַ/בְּרִ֜ית אֲשֶׁר אַתֶּ֤ם חֲפֵצִים֙ הִנֵּה בָ֔א אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/001.yaml
  text: Behold[a], I am sending my messenger, and he will clear the way before me. And suddenly the Lord whom you seek will come to his temple, and the messenger of the covenant in whom you delight—behold, he is coming[b], says Yahweh of Armies.
translation:
  language: pt
  text: “Eis que envio o meu mensageiro[a], e ele preparará o caminho diante de mim. E, de repente, o Senhor que vocês buscam virá ao seu templo; e o mensageiro da aliança, de quem vocês se agradam — eis que ele vem”, diz Yahweh dos Exércitos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meu anjo”; a palavra hebraica מַלְאָךְ pode significar “mensageiro” ou “anjo”. A mesma alternativa se aplica a “mensageiro da aliança”.
    reason: lexical_alternative
  - marker: b
    text: 'Tradução tradicional: “o SENHOR dos Exércitos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Eis que
  rationale: Preserva a força enfática e solene do anúncio profético, sem reduzir a expressão a uma simples chamada de atenção.
- source_word: שֹׁלֵחַ
  choice: envio
  rationale: Com הִנְנִי, o particípio apresenta a ação como iminente ou certa. O presente português comunica bem essa vivacidade.
- source_word: מַלְאָכִי
  choice: meu mensageiro
  rationale: מַלְאָךְ pode designar mensageiro ou anjo. Aqui, a função de preparar o caminho favorece o termo mais amplo “mensageiro”, mantendo-se a alternativa em nota.
- source_word: וּפִנָּה
  choice: e ele preparará
  rationale: Neste uso, o verbo transmite a ideia de desimpedir ou preparar o caminho. “Preparará” é natural em português e conserva a imagem contextual.
- source_word: דֶרֶךְ לְפָנָי
  choice: o caminho diante de mim
  rationale: Mantém a imagem da rota preparada e, sobretudo, a primeira pessoa do discurso divino.
- source_word: וּפִתְאֹם
  choice: Então, de repente
  rationale: Expressa a chegada abrupta indicada pelo advérbio, enquanto “então” torna natural a progressão da frase em português.
- source_word: יָבֹוא אֶל הֵיכָלוֹ
  choice: virá ao seu templo
  rationale: No contexto cultual de Malaquias, הֵיכָל designa o templo. A tradução preserva a direção expressa pela preposição.
- source_word: הָאָדוֹן
  choice: o Senhor
  rationale: O substantivo com artigo funciona como título elevado. “O Senhor” preserva essa força sem explicitar uma identificação teológica além do hebraico.
- source_word: אֲשֶׁר אַתֶּם מְבַקְשִׁים
  choice: que vocês buscam
  rationale: O presente traduz naturalmente a disposição contínua expressa pela forma hebraica e oferece ampla legibilidade brasileira.
- source_word: וּמַלְאַךְ הַבְּרִית
  choice: e o mensageiro da aliança
  rationale: Repete de modo coerente o sentido amplo de מַלְאָךְ e mantém a determinação de “a aliança”.
- source_word: אֲשֶׁר אַתֶּם חֲפֵצִים
  choice: em quem vocês se alegram
  rationale: חפץ pode indicar prazer, agrado ou desejo. A expressão conserva a nuance relacional sem sugerir necessariamente um desejo de posse.
- source_word: הִנֵּה בָא
  choice: eis que ele vem
  rationale: Mantém a vivacidade, a certeza e a iminência da vinda, em formulação solene e inteligível.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Translitera o nome divino e traduz צְבָאוֹת literalmente como título, preservando sua forma distintiva.
theological_decisions:
- issue: Relação de identidade entre “o Senhor” e “o mensageiro da aliança”
  choice: Traduzir os dois títulos diretamente, sem declarar se designam a mesma figura ou figuras distintas.
  alternative: Explicitar que ambos se referem à mesma figura, ou separar claramente o mensageiro do Senhor.
  rationale: A construção hebraica permite estreita identificação, mas não exige que a tradução resolva a relação. A coordenação com ponto e vírgula preserva a tensão interpretativa.
- issue: Sentido de הָאָדוֹן em uma passagem frequentemente interpretada de modo messiânico
  choice: o Senhor
  alternative: o senhor / o soberano
  rationale: A tradução mantém o caráter elevado do título e sua abertura teológica, sem inserir no texto uma identificação cristológica mais explícita do que a fonte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” evita regionalismo excessivo e comunica claramente o plural. “Eis que” foi preservado por sua função enfática no discurso profético. A pontuação mantém em paralelo “o Senhor” e “o mensageiro da aliança” sem resolver sua relação de identidade.
