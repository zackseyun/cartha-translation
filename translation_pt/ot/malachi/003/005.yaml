revisions:
- from: Então me aproximarei de vocês para o julgamento e serei uma testemunha pronta contra os feiticeiros, contra os adúlteros, contra os que juram falsamente, contra os que defraudam o trabalhador assalariado em seu pagamento, a viúva e o órfão, contra os que negam justiça ao estrangeiro residente[a] e não me temem, diz Yahweh dos Exércitos.[b]
  to: Então me aproximarei de vocês para o julgamento e serei uma testemunha que age sem demora contra os feiticeiros, contra os adúlteros, contra os que juram falsamente, contra os que defraudam o trabalhador assalariado quanto ao seu pagamento e oprimem a viúva e o órfão, contra os que negam justiça ao estrangeiro residente[a] e não me temem, diz Yahweh dos Exércitos.[b]
  rationale: A revisão substitui «testemunha pronta» por uma formulação que reproduz inequivocamente a prontidão/rapidez de מְמַהֵר. Também explicita em português a aplicação de עשׁק tanto à remuneração do assalariado quanto à opressão da viúva e do órfão; essa explicitação estilística não acrescenta novos grupos nem altera a denúncia social do hebraico. A nota de גֵר foi ajustada para maior precisão lexical.
