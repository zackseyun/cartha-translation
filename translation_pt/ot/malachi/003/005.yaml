source:
  edition: WLC
  text: וְ/קָרַבְתִּ֣י אֲלֵי/כֶם֮ לַ/מִּשְׁפָּט֒ וְ/הָיִ֣יתִי עֵ֣ד מְמַהֵ֗ר בַּֽ/מְכַשְּׁפִים֙ וּ/בַ/מְנָ֣אֲפִ֔ים וּ/בַ/נִּשְׁבָּעִ֖ים לַ/שָּׁ֑קֶר וּ/בְ/עֹשְׁקֵ֣י שְׂכַר שָׂ֠כִיר אַלְמָנָ֨ה וְ/יָת֤וֹם וּ/מַטֵּי גֵר֙ וְ/לֹ֣א יְרֵא֔וּ/נִי אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/005.yaml
  text: Then I will come near to you for judgment[a], and I will be a swift witness against sorcerers, against adulterers, against those who swear falsely, against those who oppress the wage of a hired worker, the widow, and the fatherless, and those who turn aside the sojourner, and do not fear me[c][b], says Yahweh of Armies.
translation:
  language: pt
  text: Então me aproximarei de vocês para o julgamento e serei uma testemunha que age sem demora contra os feiticeiros, contra os adúlteros, contra os que juram falsamente, contra os que defraudam o trabalhador assalariado quanto ao seu pagamento e oprimem a viúva e o órfão, contra os que negam justiça ao estrangeiro residente[a] e não me temem, diz Yahweh dos Exércitos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao migrante” ou “ao estrangeiro”. O hebraico גֵר designa um estrangeiro que residia entre o povo de Israel e estava sob a proteção da comunidade.
    reason: lexical_alternative
  - marker: b
    text: 'Forma tradicional: “o SENHOR dos Exércitos” ou “o SENHOR dos Exércitos celestiais”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְקָרַבְתִּי אֲלֵיכֶם לַמִּשְׁפָּט
  choice: Então me aproximarei de vocês para o julgamento
  rationale: O perfeito com waw tem valor futuro no discurso profético. “Aproximarei” mantém o movimento em direção aos ouvintes, e “para o julgamento” conserva o cenário judicial sem transformar אֲלֵיכֶם em “contra vocês”.
- source_word: וְהָיִיתִי עֵד מְמַהֵר
  choice: e serei uma testemunha pronta
  rationale: Preserva a imagem forense de Deus como testemunha. “Pronta” comunica alguém que age ou depõe sem demora e soa mais natural em português do que “testemunha rápida”.
- source_word: בַּמְכַשְּׁפִים
  choice: contra os feiticeiros
  rationale: O particípio designa praticantes de feitiçaria; “feiticeiros” é direto, compreensível e evita associações mais estreitas de outras opções.
- source_word: וּבַמְנָאֲפִים
  choice: contra os adúlteros
  rationale: Equivalente nominal direto do particípio hebraico, mantendo a concisão da enumeração.
- source_word: וּבַנִּשְׁבָּעִים לַשָּׁקֶר
  choice: contra os que juram falsamente
  rationale: Abrange juramentos falsos em geral, sem restringir o sentido ao perjúrio em tribunal.
- source_word: וּבְעֹשְׁקֵי שְׂכַר שָׂכִיר
  choice: contra os que defraudam o trabalhador assalariado em seu pagamento
  rationale: A construção literal, “oprimem o salário”, seria pouco natural em português. A formulação explicita a exploração ou retenção do pagamento implicada por עשׁק, sem acrescentar uma modalidade específica.
- source_word: אַלְמָנָה וְיָתוֹם
  choice: a viúva e o órfão
  rationale: Categorias tradicionais dos socialmente vulneráveis. “Órfão” é a forma corrente em português para יָתוֹם, embora o termo hebraico possa destacar especificamente a ausência do pai.
- source_word: וּמַטֵּי גֵר
  choice: contra os que negam justiça ao estrangeiro residente
  rationale: No contexto judicial, o hifil de נטה indica desviar ou perverter o direito de alguém. “Estrangeiro residente” expressa גֵר como não nativo estabelecido entre Israel, sob a proteção da comunidade.
- source_word: וְלֹא יְרֵאוּנִי
  choice: e não me temem
  rationale: Mantém a força de temor reverente e moral diante de Deus, sem suavizá-la para apenas “respeitam”.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Translitera o nome divino e traduz צְבָאוֹת de modo transparente, preservando seu sentido plural e marcial.
theological_decisions:
- issue: Referente sintático de “e não me temem”
  choice: A oração qualifica coletivamente os grupos denunciados
  alternative: Ligá-la somente aos que negam justiça ao estrangeiro residente
  rationale: A posição final permite proximidade com o último grupo, mas o efeito retórico natural é resumir a falta fundamental compartilhada por toda a lista. A tradução mantém a coordenação hebraica sem inserir “todos eles”.
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome próprio divino; “Yahweh” o representa diretamente, enquanto “SENHOR” segue a convenção substitutiva tradicional.
- issue: Relação de עשׁק com salário, viúva e órfão
  choice: O mesmo verbo rege o trabalhador assalariado, a viúva e o órfão
  alternative: Restringir a fraude apenas ao pagamento do trabalhador e iniciar uma categoria verbal implícita distinta para a viúva e o órfão
  rationale: A sintaxe apresenta a viúva e o órfão como objetos adicionais dos opressores. Em português, “defraudam” pode abranger tanto a fraude salarial quanto a exploração dos vulneráveis, preservando a estrutura compartilhada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A repetição de “contra” preserva o ritmo acusatório e esclarece a estrutura da longa enumeração. Evitou-se a tradução excessivamente literal “oprimem o salário”, mas manteve-se a imagem judicial e a tensão entre testemunho e julgamento.
