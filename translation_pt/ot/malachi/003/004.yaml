id: MAL.3.4
reference: Malachi 3:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עָֽרְבָה֙ לַֽ/יהוָ֔ה מִנְחַ֥ת יְהוּדָ֖ה וִ/ירֽוּשָׁלִָ֑ם כִּ/ימֵ֣י עוֹלָ֔ם וּ/כְ/שָׁנִ֖ים קַדְמֹנִיּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/004.yaml
  text: Then the offering of Judah and Jerusalem will be pleasing to Yahweh[b][a], as in the days of old and as in former years.
translation:
  language: pt
  text: Então a oferta de Judá e de Jerusalém será agradável a Yahweh[a], como nos dias antigos e como nos anos de outrora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “será aceitável”. “Oferta” também pode significar mais especificamente “oferta de cereal” neste contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָרְבָה
  choice: Então ... será agradável
  rationale: O verbo ערב expressa ser agradável ou aceitável. O futuro decorre do contexto profético, e “Então” comunica a sequência ou o resultado marcado pelo waw.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל indica aquele a quem a oferta agrada; o nome divino é transliterado como “Yahweh”.
- source_word: מִנְחַת
  choice: a oferta
  rationale: מִנְחָה pode designar especificamente uma oferta de cereal, mas também uma oferta ou dádiva em sentido mais amplo. “Oferta” preserva essa amplitude sem especificar indevidamente o material.
- source_word: יְהוּדָה וִירוּשָׁלִָם
  choice: Judá e Jerusalém
  rationale: Empregam-se as formas consagradas desses topônimos em português.
- source_word: כִּימֵי עוֹלָם
  choice: como nos dias antigos
  rationale: עוֹלָם se refere aqui a um passado remoto, não à eternidade metafísica; a formulação é clara e preserva a comparação temporal.
- source_word: וּכְשָׁנִים קַדְמֹנִיּוֹת
  choice: e como nos anos de outrora
  rationale: A expressão mantém o paralelismo poético com “dias antigos” e evoca um período anterior sem identificar além do que o texto diz.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Especificidade de מִנְחָה
  choice: oferta
  alternative: oferta de cereal
  rationale: Embora o termo possa designar uma oferta de cereal em contextos cultuais, sua extensão lexical permite “oferta”; uma nota registra a leitura mais específica sem estreitar o texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição “como... e como...” preserva o paralelismo hebraico; “outrora” conserva um tom poético moderado.
