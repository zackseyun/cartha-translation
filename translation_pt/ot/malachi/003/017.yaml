id: MAL.3.17
reference: Malachi 3:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָ֣יוּ לִ֗/י אָמַר֙ יְהוָ֣ה צְבָא֔וֹת לַ/יּ֕וֹם אֲשֶׁ֥ר אֲנִ֖י עֹשֶׂ֣ה סְגֻלָּ֑ה וְ/חָמַלְתִּ֣י עֲלֵי/הֶ֔ם כַּֽ/אֲשֶׁר֙ יַחְמֹ֣ל אִ֔ישׁ עַל בְּנ֖/וֹ הָ/עֹבֵ֥ד אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/017.yaml
  text: And they will be mine[a], says Yahweh of Armies, on the day when I make them a treasured possession[c][b], and I will spare them as a man spares his son who serves him.
translation:
  language: pt
  text: “Eles serão meus”, diz Yahweh dos Exércitos[a], “no dia em que eu fizer deles minha propriedade preciosa[b]. Eu os pouparei, como um homem poupa o filho que o serve.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “o SENHOR dos Exércitos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “minha propriedade especial”. O termo hebraico indica uma posse particular e especialmente valorizada, pertencente a um rei ou senhor.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ לִי
  choice: Eles serão meus
  rationale: Expressa de modo natural a posse futura e conserva a força relacional da declaração hebraica.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino e traduz צְבָאוֹת de forma transparente, abrangendo a imagem de forças militares e celestiais.
- source_word: לַיּוֹם אֲשֶׁר אֲנִי עֹשֶׂה סְגֻלָּה
  choice: no dia em que eu fizer deles minha propriedade preciosa
  rationale: A formulação portuguesa explicita o objeto subentendido de עֹשֶׂה a partir de וְהָיוּ לִי e entende סְגֻלָּה como predicativo, sem perder a referência ao dia da ação divina.
- source_word: סְגֻלָּה
  choice: minha propriedade preciosa
  rationale: O termo designa uma posse particular, especialmente valorizada por um rei ou senhor; “preciosa” comunica valor, e “minha” decorre da declaração anterior “serão meus”.
- source_word: וְחָמַלְתִּי עֲלֵיהֶם
  choice: Eu os pouparei
  rationale: Neste contexto, חמל indica compaixão manifestada em não aplicar o juízo; “poupar” também permite repetir o mesmo sentido na comparação seguinte.
- source_word: כַּאֲשֶׁר יַחְמֹל אִישׁ עַל בְּנוֹ הָעֹבֵד אֹתוֹ
  choice: como um homem poupa o filho que o serve
  rationale: Preserva a imagem masculina específica de pai e filho, repete o sentido de חמל e traduz עבד pelo relacional “servir”, não pelo meramente econômico “trabalhar para”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto contém o nome da aliança; a transliteração “Yahweh” o distingue de títulos divinos, enquanto a forma tradicional é registrada em nota.
- issue: Relação entre a declaração de posse e סְגֻלָּה
  choice: fizer deles minha propriedade preciosa
  alternative: no dia que eu estou preparando, eles serão uma propriedade preciosa
  rationale: A leitura escolhida segue a ligação contextual mais natural entre עֹשֶׂה, o grupo referido e סְגֻלָּה. A sintaxe hebraica é condensada, mas não se acrescenta uma ideia teológica alheia ao contexto.
- issue: Linguagem masculina na comparação
  choice: um homem ... o filho
  alternative: alguém ... seu filho
  rationale: אִישׁ e בֵּן são explicitamente masculinos, e a relação pai-filho constitui a imagem concreta usada no hebraico.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. As aspas organizam a fala divina sem alterar o conteúdo. Evitou-se tanto o arcaísmo “haverão de ser” quanto a linguagem excessivamente informal.
