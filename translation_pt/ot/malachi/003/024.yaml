  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הֵשִׁ֤יב לֵב אָבוֹת֙ עַל בָּנִ֔ים וְ/לֵ֥ב בָּנִ֖ים עַל אֲבוֹתָ֑/ם פֶּן אָב֕וֹא וְ/הִכֵּיתִ֥י אֶת הָ/אָ֖רֶץ חֵֽרֶם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/024.yaml
  text: And he will turn the hearts of fathers to their children[a], and the hearts of children to their fathers, lest I come and strike the land with a ban of destruction.
translation:
  language: pt
  text: Ele fará o coração dos pais voltar-se para os filhos e o coração dos filhos para os seus pais, para que eu não venha e fira a terra com uma condenação à destruição.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sob interdição para destruição”; tradicionalmente, “com uma maldição”. O termo hebraico indica algo colocado sob interdição e destinado à destruição.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵשִׁיב
  choice: Ele fará [...] voltar-se
  rationale: O hifil de שׁוב expressa fazer voltar ou restaurar. A construção portuguesa comunica a mudança de orientação relacional sem especificar indevidamente como ela ocorre.
- source_word: לֵב
  choice: o coração
  rationale: O hebraico usa o singular coletivo nas duas orações. Em português, “o coração dos...” preserva essa forma e designa a pessoa interior, incluindo vontade e afeições.
- source_word: אָבוֹת
  choice: pais
  rationale: O substantivo masculino plural significa “pais”; o paralelo com “filhos” favorece a relação familiar e geracional, não o sentido mais amplo de “antepassados”.
- source_word: עַל
  choice: para
  rationale: Neste idioma relacional, a preposição indica orientação em direção a alguém. “Voltar-se para” é natural em português.
- source_word: בָּנִים
  choice: filhos
  rationale: O termo pode designar filhos ou descendentes de modo coletivo. “Filhos” mantém o contraste direto com “pais” e é idiomático em português.
- source_word: אֲבוֹתָם
  choice: os seus pais
  rationale: A expressão preserva o sufixo pronominal “deles” em forma portuguesa clara e natural.
- source_word: פֶּן
  choice: para que [...] não
  rationale: Introduz a consequência ameaçada que se pretende evitar. Esta construção é atual e mantém o tom solene da advertência.
- source_word: אָבוֹא
  choice: eu não venha
  rationale: Mantém a primeira pessoa e traduz naturalmente o imperfeito hebraico dentro da oração introduzida por פֶּן.
- source_word: וְהִכֵּיתִי
  choice: e fira
  rationale: “Ferir” traduz de modo direto e digno o ato de golpear sob juízo, sem recorrer ao arcaísmo “castigar com golpe” ou enfraquecer a ameaça.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: אֶרֶץ pode significar terra ou país. “A terra” preserva a formulação hebraica e se ajusta ao contexto do juízo sobre a comunidade da aliança.
- source_word: חֵרֶם
  choice: com destruição total
  rationale: O termo designa aquilo que é colocado sob interdição e destinado à destruição. A expressão comunica o resultado severo em português corrente, enquanto a nota preserva o conceito cultural e teológico mais específico.
theological_decisions:
- issue: Sentido de חֵרֶם no encerramento do livro
  choice: destruição total
  alternative: interdição para destruição; tradicionalmente, maldição
  rationale: חֵרֶם não é o termo hebraico comum para uma simples maldição, mas indica algo irrevogavelmente destinado à destruição sob juízo. O texto principal comunica a gravidade em linguagem clara; a nota registra a categoria hebraica sem impor uma formulação denominacional.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. Mantém o singular coletivo “o coração”, a reciprocidade entre gerações e a mudança da terceira pessoa (“Ele”) para a primeira pessoa divina (“eu”) presente no hebraico.
