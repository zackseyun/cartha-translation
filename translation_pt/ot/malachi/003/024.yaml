revisions:
- from: Ele fará o coração dos pais voltar-se para os filhos e o coração dos filhos para os seus pais, para que eu não venha e fira a terra com destruição total.[a]
  to: Ele fará o coração dos pais voltar-se para os filhos e o coração dos filhos para os seus pais, para que eu não venha e fira a terra com uma condenação à destruição.[a]
  rationale: A revisão limita-se à expressão final. “Com uma condenação à destruição” comunica em português corrente tanto o juízo destrutivo quanto a categoria de algo formalmente entregue à destruição, característica de חֵרֶם. Todo o restante do texto é mantido, inclusive o registro, o singular coletivo e a relação sintática entre a ação de “Ele” e a advertência divina em primeira pessoa.
