  terminology: “Amaldiçoados”, “maldição” e “roubam” refletem adequadamente ארר, מְאֵרָה e קבע. Mantém-se “vocês” para leitura brasileira e internacional. A nota registra, sem privilegiá-la no texto, a possível leitura adversativa da conjunção.
