  text: בַּ/מְּאֵרָה֙ אַתֶּ֣ם נֵֽאָרִ֔ים וְ/אֹתִ֖/י אַתֶּ֣ם קֹבְעִ֑ים הַ/גּ֖וֹי כֻּלּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/009.yaml
  text: You are cursed with a curse[a], for you are robbing me—the whole nation of you.
translation:
  language: pt
  text: Vocês são amaldiçoados com uma maldição[a] e me roubam — vocês, a nação inteira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vocês estão sob maldição e, ainda assim, me roubam — todos vocês, a nação inteira”.'
    reason: 'Alternativa discursiva: a conjunção hebraica pode ser entendida com nuance adversativa; “sob maldição” expressa de modo mais idiomático, mas menos literal, a construção enfática “com uma maldição ... amaldiçoados”.'
lexical_decisions:
- source_word: בַּמְּאֵרָה
  choice: debaixo de maldição
  rationale: O substantivo מְאֵרָה significa “maldição”, e o ב prefixado descreve aqui o estado em que o povo se encontra. A formulação é natural em português e preserva a força da expressão hebraica em conjunto com o particípio passivo.
- source_word: נֵאָרִים
  choice: estão debaixo de maldição
  rationale: O particípio passivo de ארר indica um estado presente e resultante. Em português, a locução completa comunica esse sentido com clareza, sem impor uma leitura estritamente pontual.
- source_word: וְאֹתִי
  choice: mas continuam me roubando
  rationale: 'O ו pode ser simplesmente aditivo, mas o contexto permite valor adversativo: embora estejam sob maldição, persistem em roubar Deus. “Me” preserva o objeto direto enfático אֹתִי, e “continuam” explicita com naturalidade o valor durativo do particípio seguinte.'
- source_word: קֹבְעִים
  choice: roubando
  rationale: Neste contexto, קבע significa roubar ou defraudar, especificamente pela retenção dos dízimos e ofertas. “Roubar” é claro, corrente e mantém a acusação direta do texto.
- source_word: הַגּוֹי כֻּלּוֹ
  choice: a nação inteira
  rationale: A expressão significa literalmente “a nação, toda ela”. “A nação inteira” preserva a abrangência corporativa e, após o tratamento plural “vocês”, identifica todo o povo como implicado.
theological_decisions:
- issue: Abrangência coletiva do juízo
  choice: A acusação e a maldição abrangem corporativamente a nação inteira.
  alternative: Entender a expressão final apenas como um intensificador equivalente a “todos vocês”, sem destaque para a identidade nacional.
  rationale: הַגּוֹי כֻּלּוֹ designa explicitamente a coletividade nacional inteira, enquanto as formas de segunda pessoa do plural mantêm a interpelação direta. A tradução conserva ambas as dimensões sem acrescentar categorias teológicas posteriores.
- issue: Relação entre a maldição e o roubo
  choice: 'Traduzir וְ com força adversativa: “mas continuam”.'
  alternative: Traduzir com valor aditivo, “e vocês me roubam”, ou causal, “pois vocês me roubam”.
  rationale: O hebraico permite mais de uma relação discursiva. No contexto imediato, o contraste entre estar sob maldição e ainda persistir na infidelidade é plausível; a alternativa aditiva é registrada em nota para preservar a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “vocês”. A formulação evita o pouco natural calque “amaldiçoados com uma maldição”, mas mantém a intensidade do estado de maldição. O travessão dá destaque à acusação coletiva final.
