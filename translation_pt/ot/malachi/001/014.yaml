id: MAL.1.14
reference: Malachi 1:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אָר֣וּר נוֹכֵ֗ל וְ/יֵ֤שׁ בְּ/עֶדְר/וֹ֙ זָכָ֔ר וְ/נֹדֵ֛ר וְ/זֹבֵ֥חַ מָשְׁחָ֖ת לַֽ/אדֹנָ֑/י כִּי֩ מֶ֨לֶךְ גָּד֜וֹל אָ֗נִי אָמַר֙ יְהוָ֣ה צְבָא֔וֹת וּ/שְׁמִ֖/י נוֹרָ֥א בַ/גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/014.yaml
  text: But cursed is the deceiver who has a male in his flock[a], and vows it, but sacrifices a blemished animal to the Lord. For I am a great King, says Yahweh of Armies[b], and my name is feared among the nations.
translation:
  language: pt
  text: Mas maldito seja o enganador que tem um macho em seu rebanho, faz um voto e sacrifica ao Senhor um animal defeituoso! Pois eu sou um grande Rei — diz Yahweh dos Exércitos —, e o meu nome é temido entre as nações.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e o meu nome inspira temor reverente entre as nações”. O termo hebraico abrange temor, assombro e reverência.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: maldito
  rationale: Mantém a declaração enfática de juízo divino em linguagem bíblica corrente e clara.
- source_word: נוֹכֵל
  choice: o enganador
  rationale: Expressa a fraude deliberada no culto, sem recorrer a uma formulação excessivamente coloquial.
- source_word: יֵשׁ בְּעֶדְרוֹ זָכָר
  choice: que tem um macho em seu rebanho
  rationale: Conserva a referência explícita ao animal macho disponível e, portanto, a culpabilidade de quem oferece outro animal.
- source_word: וְנֹדֵר
  choice: faz um voto
  rationale: O hebraico não traz objeto expresso; esta formulação natural em português evita determinar silenciosamente se o macho foi o objeto específico do voto.
- source_word: וְזֹבֵחַ
  choice: e sacrifica
  rationale: Preserva a coordenação hebraica; o contraste entre o animal disponível e o defeituoso já torna evidente a oposição contextual.
- source_word: מָשְׁחָת
  choice: um animal defeituoso
  rationale: No contexto sacrificial, designa algo estragado ou impróprio; a explicitação de 'animal' torna o sentido claro.
- source_word: לַאדֹנָי
  choice: ao Senhor
  rationale: Aqui Adonai é o título divino do soberano que recebe o sacrifício; 'Senhor' é natural e distinto do nome Yahweh na frase seguinte.
- source_word: כִּי מֶלֶךְ גָּדוֹל אָנִי
  choice: Pois eu sou um grande Rei
  rationale: Retém a relação causal e a autodeclaração enfática de soberania divina.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Translitera o nome divino e traduz tseba'ot de modo transparente, preservando a imagem de poder e soberania.
- source_word: נוֹרָא
  choice: é temido
  rationale: Preserva o sentido forte de inspirar temor, sem excluir as nuances de reverência e assombro, registradas em nota.
- source_word: בַּגּוֹיִם
  choice: entre as nações
  rationale: Representa o alcance internacional da afirmação sem introduzir conotações posteriores ligadas a 'gentios'.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o nome da aliança diretamente; 'Yahweh' o distingue do título Adonai usado anteriormente no versículo.
- issue: Tradução de צְבָאוֹת
  choice: dos Exércitos
  alternative: dos Exércitos celestiais; dos exércitos; dos poderes
  rationale: A forma tradicionalmente compreendida como plural de 'exército' mantém a força régia e militar da expressão sem especificar além do hebraico quais exércitos estão em vista.
- issue: Nuance de נוֹרָא
  choice: temido
  alternative: reverenciado; tido como terrível
  rationale: A escolha mantém a força do temor inspirado pelo nome divino; a nota reconhece que o termo também envolve assombro e reverência.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A exclamação encerra a denúncia profética; travessões destacam a fórmula de declaração divina. Evitou-se inserir um objeto em 'faz um voto' porque o hebraico deixa essa relação implícita. O único marcador de nota, [a], aparece no texto principal.
