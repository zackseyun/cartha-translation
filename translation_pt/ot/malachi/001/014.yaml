  terminology: «Yahweh dos Exércitos» distingue corretamente o nome divino do título «Senhor» para אֲדֹנָי. «Temido entre as nações» preserva a força de נוֹרָא, e a nota explicita de maneira equilibrada suas conotações de temor reverente, assombro e reverência. «Rei» com maiúscula é aceitável como uso titular no enunciado divino.
