  source_fidelity: 'O texto preserva com precisão a sequência e o contraste do hebraico: a maldição contra o fraudador, a posse de um macho no rebanho, o voto sem objeto explicitado, o sacrifício de um animal defeituoso a Adonai e a fundamentação na realeza de Yahweh dos Exércitos. «Faz um voto» conserva adequadamente a indeterminação do objeto no hebraico.'
