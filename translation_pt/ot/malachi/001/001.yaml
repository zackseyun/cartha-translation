  yaml_path: translation/ot/malachi/001/001.yaml
  text: 'The burden of the word of the LORD to Israel by the hand of Malachi:'
translation:
  language: pt
  text: 'O peso da palavra do SENHOR dirigida a Israel por meio de Malaquias:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַשָּׂא
  choice: peso
  rationale: Preserva a imagem básica de algo carregado e o tom grave do pronunciamento profético. Embora o termo também possa significar «oráculo» ou «pronunciamento», «peso» mantém a ambiguidade e acompanha a evidência auditada sem explicar demais no texto.
- source_word: דְבַר יְהוָה
  choice: palavra do SENHOR
  rationale: Traduz דְבַר de modo direto e verte o nome divino conforme a convenção portuguesa amplamente reconhecida, com SENHOR em versaletes tipográficos representados por maiúsculas.
- source_word: אֶל יִשְׂרָאֵל
  choice: dirigida a Israel
  rationale: Explicita naturalmente em português a relação da palavra com seu destinatário, sem alterar o conteúdo.
- source_word: בְּיַד מַלְאָכִי
  choice: por meio de Malaquias
  rationale: O hebraico diz literalmente «pela mão de Malaquias»; a formulação escolhida comunica em português atual a função de Malaquias como agente ou mensageiro.
theological_decisions:
- issue: Sentido de מַשָּׂא no título profético
  choice: peso
  alternative: oráculo; pronunciamento
  rationale: A escolha conserva a gravidade e a metáfora lexical do hebraico, sem reduzir o termo apenas a uma categoria técnica de revelação.
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: YHWH; Javé
  rationale: Segue uma convenção bíblica portuguesa ampla e evita impor uma reconstrução específica da pronúncia do tetragrama.
translation_notes:
  register: Português moderno, digno e de leitura ampla. Conserva-se a construção solene «peso da palavra», enquanto «por meio de» substitui o hebraísmo pouco natural «pela mão de». O dois-pontos mantém a função de cabeçalho introdutório do versículo.
