  text: מַגִּישִׁ֤ים עַֽל מִזְבְּחִ/י֙ לֶ֣חֶם מְגֹאָ֔ל וַ/אֲמַרְתֶּ֖ם בַּ/מֶּ֣ה גֵֽאַלְנ֑וּ/ךָ בֶּ/אֱמָרְ/כֶ֕ם שֻׁלְחַ֥ן יְהוָ֖ה נִבְזֶ֥ה הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/007.yaml
  text: By presenting defiled food on my altar[a]. But you say, “How have we defiled you?” By saying[c][b], “The table of Yahweh is despised.”
translation:
  language: pt
  text: 'Vocês apresentam alimento[a] contaminado sobre o meu altar. Mas perguntam: “Como te contaminamos?”[b] Ao dizerem: “A mesa de Yahweh[c] é desprezível.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “pão”; neste contexto sacrificial, o termo se refere de modo mais amplo ao alimento oferecido sobre o altar.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “Como te profanamos?”. O hebraico se dirige diretamente a Deus: o desprezo pelo altar é apresentado como uma afronta a ele próprio.'
    reason: alternative_reading
  - marker: c
    text: “A mesa de Yahweh” é uma metáfora para o altar e para o serviço sacrificial realizado nele.
    reason: cultural_note
lexical_decisions:
- source_word: מַגִּישִׁים
  choice: Vocês apresentam
  rationale: O particípio hifil continua e explica a acusação do versículo anterior. A forma finita no presente soa natural em português e mantém a ação habitual dos sacerdotes.
- source_word: עַל מִזְבְּחִי
  choice: sobre o meu altar
  rationale: Preserva diretamente a relação locativa e o possessivo de primeira pessoa.
- source_word: לֶחֶם
  choice: alimento
  rationale: Embora o sentido básico seja “pão”, no contexto sacrificial o termo designa de modo mais amplo aquilo que se oferece como alimento no altar.
- source_word: מְגֹאָל
  choice: contaminado
  rationale: Comunica a ideia de profanação ou impureza ritual e também se liga naturalmente ao verbo da pergunta seguinte.
- source_word: בַּמֶּה גֵאַלְנוּךָ
  choice: Como te contaminamos?
  rationale: Mantém o sufixo hebraico de segunda pessoa singular, dirigido diretamente a Deus, sem substituir o objeto por “altar” ou “nome”.
- source_word: בֶּאֱמָרְכֶם
  choice: Quando dizem
  rationale: O infinitivo com ב introduz a circunstância e o meio pelo qual a ofensa ocorre. “Quando dizem” é idiomático e preserva a conexão explicativa.
- source_word: שֻׁלְחַן יְהוָה
  choice: a mesa de Yahweh
  rationale: Conserva a metáfora cultual do altar como mesa e translitera o nome divino.
- source_word: נִבְזֶה הוּא
  choice: é desprezível
  rationale: Expressa a avaliação desdenhosa atribuída aos sacerdotes. Evita sugerir apenas que terceiros desprezam a mesa, destacando que ela é considerada indigna de estima.
theological_decisions:
- issue: Preservação do objeto direto de segunda pessoa em גֵאַלְנוּךָ
  choice: “Como te contaminamos?”
  alternative: “Como contaminamos o teu altar/nome?”
  rationale: O hebraico se dirige diretamente a Deus. A formulação preserva a tensão retórica segundo a qual profanar o culto constitui uma afronta ao próprio Deus.
- issue: Amplitude de לֶחֶם no contexto sacrificial
  choice: “alimento”
  alternative: “pão”
  rationale: O contexto do altar favorece o sentido cultual mais amplo, sem restringir indevidamente a referência a pão comum.
- issue: Sentido de נִבְזֶה הוּא
  choice: “é desprezível”
  alternative: “é desprezada”
  rationale: A construção pode indicar que a mesa é considerada desprezível, não somente que recebe desprezo. A opção mantém essa força avaliativa e a gravidade da fala.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais correntes no Brasil e amplamente inteligíveis. Mantém-se “Yahweh” como nome divino, a metáfora “mesa” e a interpelação direta a Deus. Os marcadores aparecem imediatamente após as expressões que explicam.
