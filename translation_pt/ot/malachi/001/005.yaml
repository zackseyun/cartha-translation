id: MAL.1.5
reference: Malachi 1:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עֵינֵי/כֶ֖ם תִּרְאֶ֑ינָה וְ/אַתֶּ֤ם תֹּֽאמְרוּ֙ יִגְדַּ֣ל יְהוָ֔ה מֵ/עַ֖ל לִ/גְב֥וּל יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/005.yaml
  text: Your own eyes will see[a], and you yourselves will say, “Great is Yahweh beyond the border of Israel.”
translation:
  language: pt
  text: 'Seus próprios olhos verão, e vocês mesmos dirão: “Grande é Yahweh para além da fronteira de Israel.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Yahweh é grande para além da fronteira de Israel.” O hebraico pode ser entendido como uma aclamação ou como uma declaração.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעֵינֵיכֶם
  choice: Seus próprios olhos
  rationale: O hebraico diz literalmente “e os olhos de vocês”; “seus próprios olhos” comunica em português natural a ênfase da experiência direta.
- source_word: תִּרְאֶינָה
  choice: verão
  rationale: O imperfeito de ראה tem aqui sentido futuro. Não se acrescenta objeto, pois o hebraico o deixa implícito no contexto anterior.
- source_word: וְאַתֶּם
  choice: e vocês mesmos
  rationale: O pronome independente é enfático; “vocês mesmos” preserva essa ênfase e mantém boa legibilidade no português brasileiro.
- source_word: תֹּאמְרוּ
  choice: dirão
  rationale: O futuro simples acompanha naturalmente a sequência profética.
- source_word: יִגְדַּל
  choice: Grande é
  rationale: A forma pode funcionar como aclamação ou ser entendida como declaração. “Grande é” preserva bem o caráter acclamativo sem impor uma construção passiva ausente do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מֵעַל
  choice: para além de
  rationale: Nesta construção espacial, indica que a grandeza de Yahweh ultrapassa os limites de Israel.
- source_word: לִגְבוּל יִשְׂרָאֵל
  choice: das fronteiras de Israel
  rationale: גְּבוּל pode designar limite, fronteira ou território. O plural idiomático em português comunica os limites territoriais da nação, embora o hebraico tenha forma singular.
theological_decisions:
- issue: Forma de representar o nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome divino, e sua transliteração preserva a distinção entre nome próprio e título.
- issue: Força de יִגְדַּל יְהוָה
  choice: Grande é Yahweh
  alternative: Yahweh é grande; Que Yahweh seja engrandecido
  rationale: A sintaxe admite uma aclamação enfática ou uma declaração. A tradução principal retém a ordem marcada e o tom acclamativo; a nota registra a ambiguidade sem resolvê-la silenciosamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A segunda pessoa plural é expressa por “vocês”, forma corrente e internacionalmente inteligível. Mantém-se a repetição enfática entre “seus próprios olhos” e “vocês mesmos”.
