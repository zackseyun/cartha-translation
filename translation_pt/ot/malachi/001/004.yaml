revisions:
- from: 'Ainda que Edom diga[a]: “Fomos arrasados, mas voltaremos e reconstruiremos as ruínas”, assim diz Yahweh dos Exércitos[b]: “Eles podem construir, mas eu demolirei. Serão chamados ‘Território da perversidade’[c] e ‘o povo contra o qual Yahweh está indignado para sempre’[d]”.'
  to: 'Ainda que Edom diga: “Fomos arrasados, mas voltaremos e reconstruiremos as ruínas”, assim diz Yahweh dos Exércitos[b]: “Eles podem construir[a], mas eu derrubarei. Serão chamados de território da perversidade[c], povo contra o qual Yahweh está indignado para sempre[d].”'
  rationale: A revisão move a nota de alternativa para a cláusula cuja leitura é de fato disputada, preservando a escolha concessiva do texto principal e registrando a leitura preditiva possível. Também ajusta a construção final para refletir com mais naturalidade o plural impessoal hebraico e as duas designações atribuídas a Edom, sem alterar o sentido.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:55:53Z'
review_pass:
  verdict: revise
  source_fidelity: 'A tradução reproduz adequadamente a estrutura essencial do hebraico: a alegação de Edom, a resposta de Yahweh, o contraste entre construir e derrubar, e as duas designações finais. Contudo, a nota a está ancorada em «diga» e discute כִּי, embora a documentação interna diga que a alternativa preditiva de «podem construir» é indicada em nota; essa alternativa não está atualmente anotada. A formulação final também pode ser tornada mais diretamente equivalente à construção impessoal hebraica.'
  naturalness: O registro é claro e atual. «Serão chamados “Território...” e “o povo...”» soa um pouco como duas citações/títulos formais e deixa menos transparente que as duas expressões são predicados atribuídos a Edom. «Serão chamados de território da perversidade, povo...» é mais fluente e preserva a relação sintática.
  terminology: «Yahweh», «dos Exércitos», «Edom» e «perversidade» são escolhas adequadas. «Derrubarei» é um equivalente amplo e natural de אֶהֱרֹס e evita restringir a ação a uma demolição técnica.
  issues:
  - severity: medium
    issue: A nota a não documenta a alternativa declarada para «Eles podem construir».
    rationale: A decisão teológica afirma que a leitura preditiva «Eles construirão» permanece indicada em nota, mas a nota a está ligada a «diga» e trata apenas das possibilidades de כִּי. A ambiguidade de יִבְנוּ, relevante para a opção concessiva do texto principal, deve receber a nota.
  - severity: low
    issue: As duas designações finais são apresentadas como citações independentes.
    rationale: O hebraico apresenta «território da perversidade» e «o povo contra o qual Yahweh se indignou para sempre» como designações atribuídas ao referente plural. Sem aspas e com «de», a construção portuguesa fica mais natural e sintaticamente transparente.
