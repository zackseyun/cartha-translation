id: MAL.1.4
reference: Malachi 1:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי תֹאמַ֨ר אֱד֜וֹם רֻשַּׁ֗שְׁנוּ וְ/נָשׁוּב֙ וְ/נִבְנֶ֣ה חֳרָב֔וֹת כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הֵ֥מָּה יִבְנ֖וּ וַ/אֲנִ֣י אֶהֱר֑וֹס וְ/קָרְא֤וּ לָ/הֶם֙ גְּב֣וּל רִשְׁעָ֔ה וְ/הָ/עָ֛ם אֲשֶׁר זָעַ֥ם יְהוָ֖ה עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/004.yaml
  text: 'Though Edom says[a], “We are shattered, but we will return and rebuild the ruins,” this is what Yahweh of Armies says: “They may build, but I will tear down, and they will be called the territory of wickedness[d][c][b], the people with whom Yahweh is indignant forever.”'
translation:
  language: pt
  text: 'Ainda que Edom diga: “Fomos arrasados, mas voltaremos e reconstruiremos as ruínas”, assim diz Yahweh dos Exércitos[b]: “Eles podem construir[a], mas eu derrubarei. Serão chamados de território da perversidade[c], povo contra o qual Yahweh está indignado para sempre[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eles construirão, mas eu derrubarei”. O imperfeito hebraico pode ser entendido de modo preditivo; o texto principal explicita a força concessiva no contexto.'
    reason: alternative_reading
  - marker: b
    text: 'Forma tradicional: “SENHOR dos Exércitos” ou “SENHOR dos exércitos”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “região fronteiriça da perversidade”.'
    reason: lexical_alternative
  - marker: d
    text: 'Também: “o povo contra quem Yahweh se indignou para sempre”.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי תֹאמַר
  choice: Ainda que Edom diga
  rationale: A conjunção כִּי admite mais de uma relação discursiva. No contexto, a formulação concessiva exprime com naturalidade o contraste entre a pretensão de Edom e a resposta divina, enquanto o subjuntivo português acomoda o valor não estritamente temporal do imperfeito.
- source_word: רֻשַּׁשְׁנוּ
  choice: Fomos arrasados
  rationale: O passivo descreve Edom como reduzido a uma condição de devastação. “Arrasados” é natural em português e se ajusta ao contexto nacional e às ruínas mencionadas em seguida.
- source_word: וְנָשׁוּב וְנִבְנֶה חֳרָבוֹת
  choice: mas voltaremos e reconstruiremos as ruínas
  rationale: “Voltaremos” preserva o sentido ativo de שׁוב, sem transformá-lo em restauração passiva. “Reconstruiremos as ruínas” comunica idiomaticamente a reconstrução dos lugares devastados.
- source_word: כֹּה אָמַר
  choice: assim diz
  rationale: Mantém de forma clara, digna e concisa a fórmula profética tradicional, sem soar obscura ao leitor moderno.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: “Yahweh” representa diretamente o nome divino, e “dos Exércitos” traduz o plural צְבָאוֹת de modo transparente, preservando a força do título.
- source_word: הֵמָּה יִבְנוּ וַאֲנִי אֶהֱרֹס
  choice: Eles podem construir, mas eu demolirei
  rationale: Os pronomes independentes destacam o contraste entre a ação deles e a de Yahweh. A construção com “podem” expressa a força concessiva contextual; “demolirei” retoma de modo vívido e natural o campo semântico da construção.
- source_word: וְקָרְאוּ לָהֶם
  choice: Serão chamados
  rationale: A terceira pessoa do plural funciona de modo impessoal; a voz passiva é seu equivalente mais natural em português.
- source_word: גְּבוּל רִשְׁעָה
  choice: Território da perversidade
  rationale: גְּבוּל pode indicar território ou região fronteiriça. “Território” destaca aqui o domínio nacional, e “perversidade” preserva a caracterização moral de רִשְׁעָה.
- source_word: אֲשֶׁר זָעַם יְהוָה עַד עוֹלָם
  choice: contra o qual Yahweh está indignado para sempre
  rationale: A formulação preserva o objeto da indignação divina e a duração expressa por עַד עוֹלָם, sem suavizar a força teológica da declaração.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega o Tetragrama. A transliteração “Yahweh” conserva o caráter de nome próprio; a forma tradicional é registrada em nota.
- issue: Sentido do título צְבָאוֹת
  choice: dos Exércitos
  alternative: dos exércitos celestiais; de Hostes
  rationale: A tradução mantém a amplitude do título hebraico sem restringir explicitamente os exércitos aos seres celestiais nem recorrer ao menos transparente “Hostes”.
- issue: Força de הֵמָּה יִבְנוּ וַאֲנִי אֶהֱרֹס
  choice: 'Leitura concessivo-adversativa: “Eles podem construir, mas eu demolirei”'
  alternative: 'Leitura preditiva: “Eles construirão, mas eu demolirei”'
  rationale: O contexto enfatiza a inutilidade da reconstrução de Edom diante da ação divina. A alternativa mais formalmente preditiva permanece indicada em nota para preservar a ambiguidade.
- issue: Duração da indignação divina em עַד עוֹלָם
  choice: para sempre
  alternative: perpetuamente
  rationale: “Para sempre” representa diretamente a duração indefinida ou permanente da expressão hebraica e evita atenuar a tensão teológica do enunciado.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno e profético, com frases diretas. As aspas internas distinguem os dois nomes públicos atribuídos a Edom. Evitou-se vocabulário arcaico, exceto a fórmula bíblica ainda transparente “assim diz”.
