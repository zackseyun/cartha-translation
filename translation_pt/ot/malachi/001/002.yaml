source:
  edition: WLC
  text: אָהַ֤בְתִּי אֶתְ/כֶם֙ אָמַ֣ר יְהוָ֔ה וַ/אֲמַרְתֶּ֖ם בַּ/מָּ֣ה אֲהַבְתָּ֑/נוּ הֲ/לוֹא אָ֨ח עֵשָׂ֤ו לְ/יַֽעֲקֹב֙ נְאֻם יְהוָ֔ה וָ/אֹהַ֖ב אֶֽת יַעֲקֹֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/002.yaml
  text: “I have loved you,” says Yahweh. But you say[a], “How have you loved us?” “Was not Esau Jacob’s brother?” declares Yahweh. “Yet I loved Jacob,”
translation:
  language: pt
  text: '“Eu amei vocês”, diz o SENHOR. Mas vocês dizem[a]: “Como nos amou?” “Não era Esaú irmão de Jacó?”, declara o SENHOR. “Contudo, eu amei Jacó,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode entender os perfeitos hebraicos como ações passadas com relevância no presente. O português não expressa essa nuance aspectual de modo igualmente direto.
    reason: alternativa aspectual
lexical_decisions:
- source_word: אָהַבְתִּי
  choice: Eu amei
  rationale: O qal perfeito na primeira pessoa do singular declara o amor de YHWH por Israel. O pretérito perfeito é a correspondência portuguesa mais direta, sem excluir a relevância presente desse amor; essa possibilidade aspectual é indicada em nota.
- source_word: אֶתְכֶם
  choice: vocês
  rationale: O sufixo de segunda pessoa masculina plural dirige-se coletivamente a Israel. “Vocês” é claro, atual e amplamente compreensível, sobretudo no português brasileiro.
- source_word: אָמַר יְהוָה
  choice: diz o SENHOR
  rationale: A fórmula profética é vertida no presente, forma natural em português para introduzir uma declaração divina vigente. O nome divino YHWH é representado pela convenção reverente “SENHOR”.
- source_word: וַאֲמַרְתֶּם
  choice: Mas vocês dizem
  rationale: A conjunção introduz a objeção de Israel no padrão de disputa profética. “Mas” explicita o valor adversativo contextual sem alterar o conteúdo da fala.
- source_word: בַּמָּה
  choice: Como
  rationale: A expressão interrogativa significa “de que maneira?”. “Como” preserva de modo conciso e natural o desafio do povo.
- source_word: אֲהַבְתָּנוּ
  choice: nos amou
  rationale: O perfeito de segunda pessoa masculina singular com objeto de primeira pessoa plural é vertido pelo pretérito perfeito. A forma verbal portuguesa permite que o interlocutor divino fique implícito, evitando tanto arcaísmo quanto coloquialismo excessivo.
- source_word: הֲלוֹא
  choice: não era
  rationale: A partícula introduz uma pergunta retórica que espera resposta afirmativa. Com a relação genealógica mencionada, “não era” soa natural em português.
- source_word: אָח
  choice: irmão
  rationale: Tradução direta do termo de parentesco.
- source_word: עֵשָׂו לְיַעֲקֹב
  choice: Esaú ... irmão de Jacó
  rationale: A preposição marca a relação entre Esaú e Jacó; em português, “irmão de Jacó” é a formulação idiomática.
- source_word: נְאֻם יְהוָה
  choice: declara o SENHOR
  rationale: A fórmula solene de oráculo é distinguida da fórmula anterior por “declara”, preservando seu caráter profético.
- source_word: וָאֹהַב
  choice: Contudo, eu amei
  rationale: 'A conjunção recebe valor contrastivo no contexto: apesar da fraternidade entre Esaú e Jacó, o amor é afirmado a respeito de Jacó. “Contudo” conserva esse contraste sem substituir “amar” por uma interpretação teológica.'
- source_word: אֶת יַעֲקֹב
  choice: Jacó
  rationale: O marcador de objeto direto não é expresso em português; o nome próprio é mantido em sua forma tradicional portuguesa.
theological_decisions:
- issue: Se o amor divino por Jacó deve ser explicitado como eleição ou amor da aliança
  choice: Manter o verbo simples “amar”
  alternative: “escolher” ou “pôr meu amor da aliança sobre”
  rationale: O hebraico emprega o verbo comum אהב. O contexto pode conferir implicações pactuais e eletivas, mas explicitá-las no texto resolveria uma tensão que o versículo deixa implícita.
- issue: Valor temporal e aspectual dos perfeitos hebraicos ligados ao amor
  choice: Usar o pretérito perfeito, com nota sobre a relevância presente possível
  alternative: “Tenho amado vocês ... como nos tem amado? ... tenho amado Jacó”
  rationale: O perfeito hebraico admite uma declaração de ação passada cuja validade alcança o presente. O português não reproduz exatamente essa amplitude; a tradução principal permanece formalmente próxima, e a nota registra a alternativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Emprega “vocês” para o plural dirigido a Israel, evita “vós” e formas excessivamente arcaicas, e conserva a repetição enfática do verbo “amar”. A pontuação distingue claramente as vozes no diálogo profético.
