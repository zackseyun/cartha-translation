source:
  edition: WLC
  text: וְ/כִֽי תַגִּשׁ֨וּ/ן עִוֵּ֤ר לִ/זְבֹּ֨חַ֙ אֵ֣ין רָ֔ע וְ/כִ֥י תַגִּ֛ישׁוּ פִּסֵּ֥חַ וְ/חֹלֶ֖ה אֵ֣ין רָ֑ע הַקְרִיבֵ֨/הוּ נָ֜א לְ/פֶחָתֶ֗/ךָ הֲ/יִּרְצְ/ךָ֙ א֚וֹ הֲ/יִשָּׂ֣א פָנֶ֔י/ךָ אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/008.yaml
  text: When you present a blind animal for sacrifice[a], is that not evil? And when you present one that is lame or sick, is that not evil? Present it, please, to your governor. Will he accept you[c][b], or show you favor? says Yahweh of hosts.
translation:
  language: pt
  text: Quando vocês apresentam um animal cego para o sacrifício, isso não é mau?[a] E, quando apresentam um animal manco ou doente, isso não é mau? Apresente-o, por favor, ao seu governador. Será que ele se agradará de você[b] ou lhe mostrará favor?[c] — diz Yahweh dos Exércitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “não há mal” — expressão repetida nas duas frases. No contexto, ela pode reproduzir ironicamente a atitude dos sacerdotes; o texto a apresenta como pergunta retórica para transmitir a força da repreensão.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Será que ele aceitará você?”'
    reason: alternative_reading
  - marker: c
    text: 'Expressão idiomática hebraica, literalmente: “levantará o seu rosto”, isto é, o acolherá ou tratará favoravelmente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַגִּשׁוּן / תַגִּישׁוּ
  choice: apresentam
  rationale: O hifil de נגשׁ indica trazer ou colocar diante de alguém uma oferta. “Apresentar” funciona naturalmente tanto no contexto sacrificial quanto no desafio posterior dirigido ao governador.
- source_word: עִוֵּר
  choice: um animal cego
  rationale: O adjetivo substantivado se refere, no contexto, a um animal destinado ao sacrifício. A explicitação de “animal” torna o referente claro sem acrescentar uma ideia estranha ao texto.
- source_word: לִזְבֹּחַ
  choice: para o sacrifício
  rationale: O infinitivo expressa finalidade sacrificial; a formulação é concisa e natural em português.
- source_word: אֵין רָע
  choice: isso não é mau?
  rationale: A expressão significa literalmente “não há mal”. No contexto de repreensão, a pergunta retórica comunica com naturalidade a força irônica e acusatória, enquanto uma nota preserva a forma mais literal.
- source_word: פִּסֵּחַ
  choice: aleijado
  rationale: Designa um animal com deficiência locomotora. “Aleijado” é claro no contexto animal e evita restringir o defeito a uma descrição técnica específica.
- source_word: חֹלֶה
  choice: doente
  rationale: Equivalente comum e acessível para um animal enfermo, sem especificar uma doença não indicada pelo hebraico.
- source_word: הַקְרִיבֵהוּ נָא
  choice: Apresente-o, por favor
  rationale: O imperativo com נָא formula um desafio incisivo e irônico. “Por favor” preserva a partícula discursiva sem tornar a frase arcaica.
- source_word: פֶחָה
  choice: governador
  rationale: Refere-se a uma autoridade civil provincial do período persa; “governador” é o equivalente direto e inteligível.
- source_word: הֲיִרְצְךָ
  choice: Será que ele se agradará de vocês
  rationale: רצה pode indicar agradar-se de alguém ou aceitá-lo favoravelmente. A formulação conserva a referência pessoal do sufixo e deixa a alternativa “aceitará vocês” em nota.
- source_word: הֲיִשָּׂא פָנֶיךָ
  choice: lhes mostrará favor
  rationale: O idioma, literalmente “levantará o rosto de vocês”, denota acolhimento ou consideração favorável. A tradução comunica o sentido, e a nota registra a imagem hebraica.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: “Yahweh” representa diretamente o nome divino יהוה. “Dos Exércitos” traduz צְבָאוֹת de modo atual e compreensível, preservando o caráter do título.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” procura representar o nome próprio, em vez de substituí-lo por um título.
- issue: Força pragmática de אֵין רָע
  choice: 'Pergunta retórica: “isso não é mau?”'
  alternative: 'Afirmação literal ou irônica: “não há mal” / “isso não é mau”'
  rationale: A forma hebraica admite uma representação mais literal como afirmação, possivelmente ecoando a atitude dos sacerdotes. No fluxo da repreensão, a pergunta retórica transmite melhor a acusação sem apagar a forma literal, registrada em nota.
- issue: Sentido de הֲיִרְצְךָ
  choice: “se agradará de vocês”
  alternative: “aceitará vocês”
  rationale: Ambas as formulações cabem no campo semântico de רצה. A opção no texto preserva a ideia de satisfação favorável, enquanto a nota oferece a leitura de aceitação pessoal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O plural “vocês” explicita a segunda pessoa masculina plural do hebraico. A repetição da acusação foi mantida para preservar a estrutura enfática do versículo; o tom irônico do desafio aparece em “por favor” sem coloquialismo excessivo.
