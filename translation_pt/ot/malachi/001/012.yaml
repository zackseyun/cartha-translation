  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אַתֶּ֖ם מְחַלְּלִ֣ים אוֹת֑/וֹ בֶּ/אֱמָרְ/כֶ֗ם שֻׁלְחַ֤ן אֲדֹנָ/י֙ מְגֹאָ֣ל ה֔וּא וְ/נִיב֖/וֹ נִבְזֶ֥ה אָכְלֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/012.yaml
  text: But you are profaning it by saying[a], ‘The table of the Lord is defiled, and its fruit, its food[b], is despised.’
translation:
  language: pt
  text: 'Mas vocês o profanam ao dizerem[a]: “A mesa do Senhor está contaminada, e seu fruto, seu alimento[b], é desprezado.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vocês profanam-no”, caso o pronome seja entendido como referência direta ao Senhor, e não ao seu nome.'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “seu fruto, seu alimento”. A expressão provavelmente se refere às ofertas de alimento associadas ao altar, chamado aqui de mesa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְחַלְּלִים
  choice: profanam
  rationale: 'Preserva a força cultual do piel de חלל: tratar como comum ou profano aquilo que é santo.'
- source_word: אוֹתוֹ
  choice: o
  rationale: O pronome retoma mais naturalmente “meu nome” no contexto anterior. Em português, “nome” é masculino, por isso se emprega “o”; a referência direta ao Senhor continua possível e é registrada em nota.
- source_word: בֶּאֱמָרְכֶם
  choice: ao dizer
  rationale: Expressa de modo natural o valor instrumental ou circunstancial da preposição com o infinitivo construto.
- source_word: שֻׁלְחַן אֲדֹנָי
  choice: a mesa do Senhor
  rationale: Mantém a imagem sacrificial e a relação genitiva do hebraico em português claro e solene.
- source_word: אֲדֹנָי
  choice: Senhor
  rationale: O texto traz o título אֲדֹנָי, não o tetragrama; portanto, usa-se “Senhor”, sem versaletes.
- source_word: מְגֹאָל
  choice: contaminada
  rationale: Comunica a ideia passiva de estar poluída ou ritualmente maculada, com boa naturalidade em português.
- source_word: נִיבוֹ
  choice: seu fruto
  rationale: Equivalente direto de נִיב, mantendo a formulação condensada do hebraico.
- source_word: נִבְזֶה
  choice: é desprezado
  rationale: Conserva o sentido passivo de ser considerado indigno ou tratado com desprezo.
- source_word: אָכְלוֹ
  choice: seu alimento
  rationale: Traduz literalmente o segundo termo e o apresenta em aposição a “seu fruto”, sem eliminar a concisão ambígua do original.
theological_decisions:
- issue: Referente do pronome objeto em “vocês o profanam”
  choice: O pronome retoma o nome do Senhor mencionado no contexto anterior.
  alternative: O pronome se refere diretamente ao Senhor.
  rationale: Malaquias 1:11 acabou de mencionar “meu nome”, que é o antecedente discursivo mais provável. Como “nome” e “Senhor” são ambos masculinos em português, a ambiguidade formal permanece; a nota esclarece as duas possibilidades.
- issue: Tradução do título divino אֲדֹנָי
  choice: Senhor
  alternative: SENHOR
  rationale: A forma hebraica é o título אֲדֹנָי, e não YHWH; “SENHOR” fica reservado ao tetragrama.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Mantém a imagem cultual de “mesa”, a força religiosa de “profanam” e a aposição compacta “seu fruto, seu alimento”.
