base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/006.yaml
  text: A son honors his father, and a slave his master. If, then, I am a father, where is my honor? And if I am a master, where is the fear due me? says the LORD of Armies to you, O priests who despise my name. Yet you say, “How have we despised your name?”
translation:
  language: pt
  text: '“O filho honra o pai, e o escravo, o seu senhor. Se eu sou pai, onde está a honra que me é devida? E, se sou senhor, onde está o temor que me é devido?”, diz o SENHOR dos Exércitos a vocês, sacerdotes que desprezam o meu nome. “Mas vocês perguntam: ‘Como desprezamos o teu nome?’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֶבֶד
  choice: escravo
  rationale: O termo hebraico designa alguém submetido a um senhor e, neste paralelo doméstico, é mais precisamente representado por “escravo” do que pelo mais amplo “servo”.
- source_word: אֲדוֹנִים / אֲדֹנָיו
  choice: senhor / seu senhor
  rationale: Mantém o vínculo lexical entre o senhor humano do escravo e o próprio SENHOR, preservando a força do argumento.
- source_word: מוֹרָאִי
  choice: o temor que me é devido
  rationale: מוֹרָא expressa temor reverente; a formulação natural explicita o sentido relacional sem reduzi-lo a simples medo.
- source_word: יְהוָה צְבָאוֹת
  choice: SENHOR dos Exércitos
  rationale: Segue a convenção portuguesa de representar o nome divino por SENHOR e preserva o título צְבָאוֹת como “dos Exércitos”.
- source_word: בּוֹזֵי שְׁמִי
  choice: que desprezam o meu nome
  rationale: Preserva o particípio hebraico e o sentido bíblico de “nome” como expressão da identidade, reputação e autoridade de Deus.
theological_decisions:
- issue: Natureza do temor devido a Deus
  choice: “o temor que me é devido”
  alternative: “o respeito que me é devido”
  rationale: “Temor” conserva a intensidade e a linguagem teológica de מוֹרָא, sem restringi-la a mera cortesia ou respeito social.
- issue: Representação do tetragrama
  choice: “SENHOR” em versaletes gráficas
  alternative: “Yahweh”
  rationale: A forma tradicional é amplamente inteligível em português e distingue o nome divino do título comum “senhor”, sem impor uma reconstrução vocal específica.
- issue: Responsabilidade dos sacerdotes
  choice: 'acusação direta: “sacerdotes que desprezam o meu nome”'
  alternative: atenuar como negligência cultual
  rationale: O hebraico emprega diretamente o verbo “desprezar”; a tradução não reduz a gravidade da acusação nem antecipa sua explicação nos versículos seguintes.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A repetição de “senhor” e a estrutura retórica de pergunta e resposta foram preservadas. As aspas distinguem a fala divina e a réplica citada dos sacerdotes.
