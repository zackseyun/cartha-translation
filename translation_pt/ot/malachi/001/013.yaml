revisions:
- from: 'E vocês dizem: “Vejam, que canseira!”, e bufam de desprezo diante disso[a] — diz Yahweh dos Exércitos[b]. Vocês trazem o que foi roubado, o animal manco e o doente; e trazem isso como oferta. Será que eu a aceitarei das mãos de vocês? — diz Yahweh.'
  to: 'E vocês dizem: “Vejam só, que cansaço!”, e soltam um bufido de desprezo por causa disso[a] — diz Yahweh dos Exércitos[b]. Vocês trazem o que foi roubado, o animal manco e o doente; assim vocês trazem a oferta. Aceitarei eu a oferta das mãos de vocês? — diz Yahweh.'
  rationale: A revisão substitui uma expressão pouco natural por uma formulação portuguesa que conserva a imagem do bufido de desprezo, evita a adição interpretativa em «trazem isso como oferta» e torna a exclamação inicial mais amplamente internacional. A pergunta final emprega a ordem interrogativa enfática, mantendo seu caráter retórico.
