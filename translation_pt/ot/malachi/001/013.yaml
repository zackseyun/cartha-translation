source:
  edition: WLC
  text: וַ/אֲמַרְתֶּם֩ הִנֵּ֨ה מַ/תְּלָאָ֜ה וְ/הִפַּחְתֶּ֣ם אוֹת֗/וֹ אָמַר֙ יְהוָ֣ה צְבָא֔וֹת וַ/הֲבֵאתֶ֣ם גָּז֗וּל וְ/אֶת הַ/פִּסֵּ֨חַ֙ וְ/אֶת הַ֣/חוֹלֶ֔ה וַ/הֲבֵאתֶ֖ם אֶת הַ/מִּנְחָ֑ה הַ/אֶרְצֶ֥ה אוֹתָ֛/הּ מִ/יֶּדְ/כֶ֖ם אָמַ֥ר יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/013.yaml
  text: And you say[a], ‘Look, what a weariness this is,’ and you snort at it, says Yahweh of hosts. And you bring what is stolen, and the lame, and the sick; thus you bring the offering[b]. Should I accept it from your hand? says Yahweh.
translation:
  language: pt
  text: 'E vocês dizem: “Vejam só, que cansaço!”, e soltam um bufido de desprezo por causa disso[a] — diz Yahweh dos Exércitos[b]. Vocês trazem o que foi roubado, o animal manco e o doente; assim vocês trazem a oferta. Aceitarei eu a oferta das mãos de vocês? — diz Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sopram com desprezo por causa disso”. O verbo hebraico retrata uma expiração ou um bufido desdenhoso, que expressa escárnio.'
    reason: lexical_alternative
  - marker: b
    text: “Yahweh dos Exércitos” é um título que apresenta Yahweh como comandante das hostes ou exércitos.
    reason: cultural_note
lexical_decisions:
- source_word: מַתְּלָאָה
  choice: que canseira!
  rationale: O substantivo expressa cansaço, enfado ou trabalho penoso. A exclamação idiomática comunica a reclamação desdenhosa sem acrescentar a ideia mais forte de repulsa.
- source_word: וְהִפַּחְתֶּם אֹתוֹ
  choice: e bufam de desprezo diante disso
  rationale: O verbo נפח descreve uma expiração ou sopro e, neste contexto, comunica desprezo. “Bufam de desprezo” mantém tanto a imagem concreta quanto sua força pragmática.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: “Yahweh” representa diretamente o nome divino, enquanto “dos Exércitos” conserva a imagem do título צְבָאוֹת sem reduzi-lo ao conceito mais interpretativo de “Todo-Poderoso”.
- source_word: גָּזוּל
  choice: o que foi roubado
  rationale: O particípio passivo designa aquilo que foi obtido por roubo. A formulação preserva a condenação moral sem especificar além do hebraico.
- source_word: הַפִּסֵּחַ
  choice: o animal manco
  rationale: No contexto sacrificial, refere-se a um animal com defeito de locomoção. A explicitação de “animal” torna a referência natural e inequívoca em português.
- source_word: הַחוֹלֶה
  choice: o doente
  rationale: A forma designa o que está enfermo; em paralelo com “o animal manco”, “o doente” é claro e conciso.
- source_word: הַמִּנְחָה
  choice: oferta
  rationale: Embora o termo possa designar especificamente uma oferta de cereal em outros contextos, aqui tem sentido mais amplo de dádiva apresentada no culto.
- source_word: הַאֶרְצֶה אֹתָהּ
  choice: Será que eu a aceitarei?
  rationale: רצה, em contexto sacrificial, significa acolher favoravelmente. A pergunta retórica com ה interrogativo é preservada sem transformá-la numa simples declaração.
- source_word: מִיֶּדְכֶם
  choice: das mãos de vocês
  rationale: Mantém a expressão concreta do hebraico e continua natural e compreensível em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” preserva sua função de nome pactual sem substituí-lo por um título.
- issue: Sentido de צְבָאוֹת no título divino
  choice: dos Exércitos
  alternative: Todo-Poderoso; dos exércitos celestiais
  rationale: A tradução formal conserva a imagem militar e celestial do título, sem restringir explicitamente quais exércitos estão em vista nem converter a expressão em um atributo abstrato.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. “Vocês” evita regionalismo excessivo; “que canseira” reproduz a reclamação coloquial sem perder a solenidade do contexto profético. A repetição e a pergunta retórica preservam o tom acusatório do hebraico.
