    issue: Formulação de וְהִפַּחְתֶּם אֹתוֹ
    rationale: «Bufam de desprezo diante disso» altera a relação verbal expressa pelo hebraico e é estilisticamente rígida. O verbo descreve um sopro ou bufido de escárnio dirigido ao objeto; «soltam um bufido de desprezo por causa disso» conserva a imagem e o sentido contextual.
  - severity: low
    issue: Repetição de «trazem» antes de הַמִּנְחָה
    rationale: «Trazem isso como oferta» introduz um demonstrativo e uma locução não presentes no texto. «Assim vocês trazem a oferta» preserva a repetição hebraica e o efeito acusatório conclusivo.
  - severity: low
    issue: Coloquialismo de «canseira»
    rationale: Embora defensável, «canseira» tem marca brasileira mais forte. «Que cansaço!» é uma exclamação atual e amplamente compreensível que conserva o sentido de fadiga/enfado.
