id: MAL.1.11
reference: Malachi 1:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י מִ/מִּזְרַח שֶׁ֜מֶשׁ וְ/עַד מְבוֹא֗/וֹ גָּד֤וֹל שְׁמִ/י֙ בַּ/גּוֹיִ֔ם וּ/בְ/כָל מָק֗וֹם מֻקְטָ֥ר מֻגָּ֛שׁ לִ/שְׁמִ֖/י וּ/מִנְחָ֣ה טְהוֹרָ֑ה כִּֽי גָד֤וֹל שְׁמִ/י֙ בַּ/גּוֹיִ֔ם אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/011.yaml
  text: For from the rising of the sun to its setting[a], my name is great among the nations, and in every place incense is offered, and a pure offering is brought, to my name; for my name is great among the nations[d][c][b], says Yahweh of hosts.
translation:
  language: pt
  text: Pois, desde o nascer do sol até o seu poente[a], grande é o meu nome entre as nações; e, em todo lugar, incenso é queimado e uma oferta pura é apresentada ao meu nome[d]. Pois grande é o meu nome entre as nações[b][c] — diz Yahweh dos Exércitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desde o leste até o oeste”; literalmente, “desde o nascer do sol até o seu poente”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “entre os gentios”.'
    reason: lexical_alternative
  - marker: c
    text: O hebraico pode ser entendido como realidade presente, presente profético ou certeza futura; a tradução mantém as formas no presente sem decidir a questão temporal.
    reason: alternative_reading
  - marker: d
    text: “Oferta” traduz o hebraico minchá, termo que pode designar uma oferta em geral e, em contextos sacrificiais, muitas vezes uma oferta de cereal.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da repreensão anterior sem decidir entre força estritamente causal e enfática.
- source_word: מִמִּזְרַח שֶׁמֶשׁ וְעַד מְבוֹאוֹ
  choice: desde o nascer do sol até o seu poente
  rationale: Preserva a imagem hebraica e o alcance universal; o pronome remete ao sol.
- source_word: גָּדוֹל שְׁמִי
  choice: grande é o meu nome
  rationale: Mantém a ênfase da ordem hebraica e conserva “nome” em vez de parafraseá-lo como fama ou honra.
- source_word: בַּגּוֹיִם
  choice: entre as nações
  rationale: É a tradução ampla e natural de גּוֹיִם neste contexto profético, sem restringi-la ao sentido de “gentios”.
- source_word: וּבְכָל מָקוֹם
  choice: e, em todo lugar
  rationale: Conserva o sentido distributivo e a proximidade formal com o hebraico.
- source_word: מֻקְטָר
  choice: incenso é queimado
  rationale: Expressa o particípio passivo cultual derivado de קטר sem confundi-lo com o segundo verbo, que descreve a apresentação da oferta.
- source_word: מֻגָּשׁ לִשְׁמִי
  choice: é apresentada ao meu nome
  rationale: Reflete o particípio passivo de נגשׁ em contexto sacrificial e conserva literalmente a expressão teológica “ao meu nome”.
- source_word: וּמִנְחָה טְהוֹרָה
  choice: e uma oferta pura
  rationale: מִנְחָה pode designar uma oferta em geral e, com frequência, uma oferta de cereal; a formulação ampla evita estreitamento indevido.
- source_word: אָמַר יְהוָה צְבָאוֹת
  choice: diz Yahweh dos Exércitos
  rationale: Translitera o nome divino conforme a camada inglesa fornecida e traduz צְבָאוֹת diretamente, preservando a forma tradicional do título profético.
theological_decisions:
- issue: Se o versículo descreve culto presente entre as nações ou uma realidade futura/ideal
  choice: 'Manter construções no presente: “é”, “é queimado” e “é apresentada”.'
  alternative: Empregar o futuro (“será”, “será queimado”, “será apresentada”) ou explicitar um presente profético.
  rationale: As construções nominais e participiais hebraicas não marcam explicitamente a futuridade. O presente preserva a forma do texto e deixa aberta a relação temporal.
- issue: Sentido da linguagem sacrificial no culto das nações
  choice: Conservar os termos cultuais concretos “incenso” e “oferta”.
  alternative: Interpretá-los explicitamente como oração, culto espiritual ou sacrifícios escatológicos.
  rationale: O texto emprega vocabulário sacrificial explícito, mas não explica aqui seu modo de cumprimento; a tradução não deve impor um sistema teológico.
- issue: Relação sintática entre os dois particípios e “ao meu nome”
  choice: 'Traduzir ambos distintamente: “incenso é queimado e uma oferta pura é apresentada ao meu nome”.'
  alternative: Fazer “ao meu nome” modificar explicitamente também o incenso, ou entender מֻקְטָר como substantivo (“fumaça sacrificial/incenso”).
  rationale: A formulação representa os dois particípios passivos e liga naturalmente לִשְׁמִי ao particípio imediatamente seguinte, sem excluir semanticamente que toda a ação cultual seja dirigida ao nome de Yahweh.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe ligeiramente solene própria do discurso profético. “Poente” preserva a imagem tradicional sem ser obscuro; “queimado” distingue a ação ligada ao incenso da apresentação da oferta. Todos os marcadores de nota aparecem no texto.
