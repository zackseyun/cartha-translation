  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַתָּ֛ה חַלּוּ נָ֥א פְנֵי אֵ֖ל וִֽ/יחָנֵ֑/נוּ מִ/יֶּדְ/כֶם֙ הָ֣יְתָה זֹּ֔את הֲ/יִשָּׂ֤א מִ/כֶּם֙ פָּנִ֔ים אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/009.yaml
  text: And now[a], entreat God for favor, that he may be gracious to us. From your hand has this come[b]; will he show favor to any of you? says Yahweh of hosts.
translation:
  language: pt
  text: E agora, supliquem o favor de Deus[a], para que ele nos mostre favor. Isso veio da mão de vocês[b]; será que ele mostrará favor a algum de vocês? — diz Yahweh dos Exércitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “supliquem a face de Deus”. A expressão significa buscar o favor de Deus.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Como isso veio da mão de vocês, será que ele aceitará algum de vocês?”'
    reason: alternative_reading
lexical_decisions:
- source_word: חַלּוּ נָא פְנֵי אֵל
  choice: supliquem o favor de Deus
  rationale: O piel imperativo חַלּוּ com נָא expressa um apelo insistente, e a construção idiomática com פְנֵי significa procurar ou suplicar o favor de alguém. A tradução comunica o sentido em português natural, enquanto a nota preserva a imagem literal.
- source_word: וִיחָנֵּנוּ
  choice: para que ele tenha compaixão de nós
  rationale: O verbo חנן significa mostrar favor, ser bondoso ou ter compaixão. A oração após o imperativo tem valor provável de finalidade ou resultado; 'para que' preserva essa relação sem afirmar que a resposta favorável ocorrerá necessariamente.
- source_word: מִיֶּדְכֶם הָיְתָה זֹּאת
  choice: Isso veio das mãos de vocês
  rationale: Mantém a metáfora hebraica da mão como fonte ou agência e atribui aos sacerdotes a responsabilidade pela situação, em formulação idiomática e clara.
- source_word: הֲיִשָּׂא מִכֶּם פָּנִים
  choice: será que ele acolherá algum de vocês com favor?
  rationale: O idioma נשׂא פנים, literalmente 'levantar o rosto', aqui indica recepção ou tratamento favorável. 'Acolherá ... com favor' preserva tanto a ideia de aceitação quanto a de favor, e a pergunta mantém sua força retórica.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Translitera o nome divino explícito e verte צְבָאוֹת por 'Exércitos', forma atual e compreensível que comunica o aspecto marcial e soberano do título.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. 'Yahweh' preserva sua função de nome próprio sem substituí-lo por um título.
- issue: Sentido da pergunta הֲיִשָּׂא מִכֶּם פָּנִים
  choice: será que ele acolherá algum de vocês com favor?
  alternative: será que ele aceitará algum de vocês?; será que ele será parcial com vocês?
  rationale: No contexto, a questão é se Deus receberá favoravelmente os sacerdotes responsáveis por ofertas impróprias. A formulação evita importar uma discussão abstrata sobre parcialidade e conserva a repreensão retórica.
- issue: Valor de וִיחָנֵּנוּ depois do imperativo
  choice: para que ele tenha compaixão de nós
  alternative: e ele terá compaixão de nós
  rationale: A leitura final preserva o valor de finalidade ou resultado possível da forma verbal, sem transformar a súplica em promessa garantida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Supliquem' mantém a urgência do apelo; 'das mãos de vocês' conserva a imagem hebraica sem soar artificial. A pontuação apresenta a fórmula profética como declaração de autoria.
