revisions:
- from: E agora, supliquem o favor de Deus[a], para que ele tenha compaixão de nós. Isso veio das mãos de vocês[b]; será que ele acolherá algum de vocês com favor? — diz Yahweh dos Exércitos.
  to: E agora, supliquem o favor de Deus[a], para que ele nos mostre favor. Isso veio da mão de vocês[b]; será que ele mostrará favor a algum de vocês? — diz Yahweh dos Exércitos.
  rationale: A revisão substitui “tenha compaixão” por “nos mostre favor”, correspondendo a חנן e preservando a coesão com o campo semântico de favor no restante do versículo. Também restitui o singular coletivo “da mão de vocês” e torna a pergunta final mais direta e natural, sem eliminar sua ambiguidade entre recepção favorável e aceitação.
