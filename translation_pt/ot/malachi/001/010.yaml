  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מִ֤י גַם בָּ/כֶם֙ וְ/יִסְגֹּ֣ר דְּלָתַ֔יִם וְ/לֹֽא תָאִ֥ירוּ מִזְבְּחִ֖/י חִנָּ֑ם אֵֽין לִ֨/י חֵ֜פֶץ בָּ/כֶ֗ם אָמַר֙ יְהוָ֣ה צְבָא֔וֹת וּ/מִנְחָ֖ה לֹֽא אֶרְצֶ֥ה מִ/יֶּדְ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/010.yaml
  text: Oh[a], that there were even one among you who would shut the doors, so that you would not kindle my altar in vain! I have no pleasure in you, says Yahweh of hosts[c][b], and I will not accept an offering from your hand.
translation:
  language: pt
  text: Quem dera houvesse entre vocês ao menos um que fechasse as portas, para que vocês não acendessem inutilmente o fogo do meu altar![a] Não tenho prazer em vocês — diz Yahweh dos Exércitos —, nem aceitarei oferta alguma das mãos de vocês.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quem há entre vocês que feche as portas, para que vocês não acendam inutilmente o fogo do meu altar?” O hebraico pode ser entendido como pergunta retórica, embora provavelmente expresse o desejo de que alguém feche as portas do templo em vez de dar continuidade a um culto vazio.'
    reason: alternative_reading
  - marker: b
    text: “Oferta” traduz o hebraico minḥah, que, em contextos sacrificiais, pode designar mais especificamente uma oferta de cereal.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי גַם בָּכֶם
  choice: Quem dera houvesse entre vocês ao menos um
  rationale: O contexto favorece a força optativa e exasperada da expressão, embora a forma hebraica também possa ser entendida como pergunta retórica; essa ambiguidade é registrada em nota.
- source_word: וְיִסְגֹּר דְּלָתַיִם
  choice: que fechasse as portas
  rationale: Expressa naturalmente em português o desejo de que alguém fechasse as portas do templo, interrompendo o culto censurado.
- source_word: וְלֹא תָאִירוּ מִזְבְּחִי חִנָּם
  choice: para que vocês não acendessem inutilmente o fogo do meu altar
  rationale: O hifil de אור indica fazer arder ou acender; explicitar 'o fogo' produz português natural sem perder a imagem cultual. חִנָּם comunica inutilidade ou falta de propósito.
- source_word: אֵין לִי חֵפֶץ בָּכֶם
  choice: Não tenho prazer em vocês
  rationale: Preserva a linguagem pessoal e solene de rejeição, sem reduzir חֵפֶץ apenas à aprovação ritual.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino e traduz צְבָאוֹת por um equivalente português claro, vigoroso e intertextualmente reconhecível.
- source_word: וּמִנְחָה
  choice: oferta alguma
  rationale: מִנְחָה pode designar especificamente uma oferta de cereal, mas também uma oferta ou dádiva; o termo amplo evita estreitar indevidamente o sentido no contexto.
- source_word: לֹא אֶרְצֶה מִיֶּדְכֶם
  choice: nem aceitarei ... das mãos de vocês
  rationale: Em contexto sacrificial, רצה denota aceitação favorável. O plural natural em português comunica a origem coletiva indicada pelo sufixo hebraico plural.
theological_decisions:
- issue: Forma da declaração inicial
  choice: 'Leitura como desejo: ''Quem dera...'''
  alternative: 'Pergunta retórica: ''Quem há entre vocês que feche as portas?'''
  rationale: A construção hebraica admite leitura interrogativa, mas, no fluxo da censura, provavelmente expressa o desejo de que alguém suspenda o culto vazio. A alternativa é preservada em nota.
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: A tradução preserva diretamente o nome próprio da aliança presente no texto hebraico, sem substituir seu valor lexical por um título.
- issue: Extensão semântica de מִנְחָה
  choice: oferta
  alternative: oferta de cereal
  rationale: Embora o termo frequentemente indique oferta de cereal em contextos cultuais, aqui a formulação mais ampla preserva a possibilidade lexical e se ajusta à denúncia geral do serviço sacrificial.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com boa legibilidade brasileira. O plural 'vocês' evita regionalismos marcados; 'Quem dera' conserva a força emotiva e solene. As notas preservam a ambiguidade sintática inicial e a amplitude cultual de minḥah.
