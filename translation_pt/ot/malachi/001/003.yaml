  text: but Esau I hated[c][b][a], and I made his mountains a desolation and his inheritance for the jackals of the wilderness.
translation:
  language: pt
  text: mas odiei Esaú[a] e tornei suas montanhas[b] em desolação, e sua herança em morada para os chacais do deserto[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «rejeitei» ou «amei menos». O verbo hebraico normalmente significa «odiar»; essas alternativas procuram expressar uma possível ideia de preferência ou rejeição no contexto da aliança.
    reason: lexical_alternative
  - marker: b
    text: Ou «sua região montanhosa».
    reason: lexical_alternative
  - marker: c
    text: Tradicionalmente, «dragões do deserto»; provavelmente se trata de chacais.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂנֵאתִי
  choice: odiei
  rationale: É o sentido direto e normal do verbo hebraico שׂנא no qal. Mantém a força e a tensão teológica do original, sem substituí-las por uma interpretação suavizada.
- source_word: וָאָשִׂים
  choice: deixei ... desoladas
  rationale: שׂים significa pôr, colocar ou fazer. Com שְׁמָמָה, esta formulação resultativa é natural em português e comunica que as montanhas foram reduzidas à desolação.
- source_word: הָרָיו
  choice: suas montanhas
  rationale: Traduz diretamente o plural possessivo de הַר. O sentido regional «sua região montanhosa» também é possível.
- source_word: שְׁמָמָה
  choice: desoladas
  rationale: Expressa de modo natural em português o estado de devastação indicado pelo substantivo hebraico, ainda que altere a categoria gramatical para evitar uma construção pouco idiomática.
- source_word: נַחֲלָתוֹ
  choice: sua herança
  rationale: Preserva a ideia de propriedade recebida por herança e sua possível ressonância ligada à terra, sem reduzi-la simplesmente a «terra».
- source_word: לְתַנּוֹת מִדְבָּר
  choice: para os chacais do deserto
  rationale: תַנּוֹת é geralmente entendido pela lexicografia atual como referência a chacais associados a lugares desolados. «Dragões» pertence à tradição antiga, mas é lexicalmente menos provável.
- source_word: וְאֶת
  choice: mas
  rationale: Embora וְ seja formalmente «e», aqui introduz o contraste com Jacó no versículo anterior; «mas» torna essa relação discursiva clara em português.
theological_decisions:
- issue: Força do ódio divino contra Esaú
  choice: odiei
  alternative: rejeitei; amei menos
  rationale: O hebraico declara diretamente «odiei». A tradução preserva essa linguagem difícil e sua tensão teológica, em vez de adotar no texto principal explicações interpretativas ligadas à rejeição ou à preferência da aliança.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário de alcance internacional. A coordenação conserva o ritmo profético, enquanto «deixei ... desoladas» evita o pouco natural «fiz de suas montanhas uma desolação». Todos os marcadores aparecem junto aos termos pertinentes no texto.
