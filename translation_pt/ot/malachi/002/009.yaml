id: MAL.2.9
reference: Malachi 2:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/גַם אֲנִ֞י נָתַ֧תִּי אֶתְ/כֶ֛ם נִבְזִ֥ים וּ/שְׁפָלִ֖ים לְ/כָל הָ/עָ֑ם כְּ/פִ֗י אֲשֶׁ֤ר אֵֽינְ/כֶם֙ שֹׁמְרִ֣ים אֶת דְּרָכַ֔/י וְ/נֹשְׂאִ֥ים פָּנִ֖ים בַּ/תּוֹרָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/009.yaml
  text: So I also have made you despised and abased before all the people[a], because you are not keeping my ways but are showing partiality in the law.
translation:
  language: pt
  text: Por isso, eu também fiz com que vocês fossem desprezados e humilhados diante de todo o povo, porque vocês não guardam os meus caminhos, mas agem com parcialidade na Lei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na instrução” ou “na Torá”, em vez de “na Lei”.
    reason: Alternativas lexicais legítimas para תּוֹרָה.
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: Por isso, eu também
  rationale: A expressão liga a sentença à repreensão anterior e enfatiza a ação correspondente de Deus; “Por isso” comunica naturalmente a força contextual consequente.
- source_word: נָתַתִּי אֶתְכֶם
  choice: fiz com que vocês fossem
  rationale: Embora נתן signifique literalmente “dar”, com os adjetivos predicativos seguintes assume sentido causativo ou resultativo.
- source_word: נִבְזִים וּשְׁפָלִים
  choice: desprezados e humilhados
  rationale: Preserva tanto o desprezo social quanto o rebaixamento público de posição expresso pelos dois adjetivos.
- source_word: לְכָל הָעָם
  choice: diante de todo o povo
  rationale: Expressa a esfera pública em que a desonra dos sacerdotes se torna visível.
- source_word: כְּפִי אֲשֶׁר
  choice: porque
  rationale: Neste contexto, a locução apresenta a razão do juízo e tem força causal.
- source_word: אֵינְכֶם שֹׁמְרִים אֶת דְּרָכַי
  choice: vocês não guardam os meus caminhos
  rationale: “Guardar” conserva a linguagem pactual de observar e obedecer, enquanto “meus caminhos” mantém a metáfora hebraica.
- source_word: וְנֹשְׂאִים פָּנִים
  choice: mas agem com parcialidade
  rationale: O idioma hebraico significa favorecer pessoas ou tratá-las com parcialidade; “mas” explicita o contraste implícito entre guardar os caminhos de Deus e agir parcialmente.
- source_word: בַּתּוֹרָה
  choice: na Lei
  rationale: No contexto da atuação sacerdotal, refere-se à instrução normativa divina; “Lei” é clara e tradicional, sem eliminar a amplitude lexical de תּוֹרָה, registrada em nota.
theological_decisions:
- issue: Sentido de תּוֹרָה no contexto sacerdotal
  choice: na Lei
  alternative: na instrução; na Torá
  rationale: “Lei” comunica o caráter normativo e pactual do texto. A nota preserva as possibilidades de uma referência mais ampla à instrução ou mais específica à Torá.
- issue: Força da linguagem de vergonha pública
  choice: desprezados e humilhados diante de todo o povo
  alternative: desprezados e rebaixados perante todo o povo
  rationale: A formulação apresenta o juízo divino como perda pública de honra e posição sem aumentar sua intensidade para além do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” torna explícito o destinatário coletivo; “Lei” recebe inicial maiúscula por designar aqui a instrução normativa divina.
