id: MAL.2.8
reference: Malachi 2:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אַתֶּם֙ סַרְתֶּ֣ם מִן הַ/דֶּ֔רֶךְ הִכְשַׁלְתֶּ֥ם רַבִּ֖ים בַּ/תּוֹרָ֑ה שִֽׁחַתֶּם֙ בְּרִ֣ית הַ/לֵּוִ֔י אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/008.yaml
  text: But you have turned aside from the way; you have caused many to stumble in the law; you have corrupted the covenant of Levi[a], says Yahweh of hosts.
translation:
  language: pt
  text: Mas vocês se desviaram do caminho; fizeram muitos tropeçar na Lei[a]; corromperam a aliança de Levi, diz Yahweh dos Exércitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por meio da instrução” ou “na instrução”. A palavra hebraica torá pode significar “Lei” ou “instrução”, e a preposição também permite entender que eles fizeram muitos tropeçar por meio de seu ensino.
    reason: Preserva a ambiguidade lexical de תּוֹרָה e a possível força locativa ou instrumental da preposição ב.
lexical_decisions:
- source_word: סַרְתֶּם
  choice: se desviaram
  rationale: Preserva a metáfora de abandonar o caminho e expressa naturalmente o sentido de סור em português.
- source_word: הַדֶּרֶךְ
  choice: do caminho
  rationale: “Caminho” mantém tanto a imagem concreta quanto seu sentido ético no contexto profético.
- source_word: הִכְשַׁלְתֶּם
  choice: fizeram ... tropeçar
  rationale: O hifil é causativo; a formulação comunica que os sacerdotes levaram outros ao tropeço moral ou espiritual.
- source_word: רַבִּים
  choice: muitos
  rationale: Equivalente quantitativo direto, claro e idiomático.
- source_word: בַּתּוֹרָה
  choice: na Lei
  rationale: Mantém o sentido pactual de תּוֹרָה e representa de modo formal a preposição ב, sem eliminar as possibilidades de “instrução” e de valor instrumental, registradas em nota.
- source_word: שִׁחַתֶּם
  choice: corromperam
  rationale: Reflete o piel de שׁחת como arruinar ou corromper, sem reduzi-lo antecipadamente a uma infração meramente jurídica.
- source_word: בְּרִית הַלֵּוִי
  choice: a aliança de Levi
  rationale: Reproduz a construção hebraica e permite que Levi designe a figura ancestral ou a ordem levítica associada a ele.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Translitera o nome divino e verte צְבָאוֹת de maneira clara, solene e semanticamente transparente em português.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Sentido de תּוֹרָה no contexto sacerdotal
  choice: Lei
  alternative: instrução
  rationale: “Lei” conserva a dimensão pactual e normativa do ensino confiado aos sacerdotes, enquanto “instrução” continua sendo uma possibilidade lexical genuína e aparece na nota.
- issue: Relação expressa por ב em בַּתּוֹרָה
  choice: na Lei
  alternative: por meio da Lei; mediante a instrução
  rationale: A preposição admite leitura locativa ou instrumental. O texto principal segue de perto a forma hebraica, e a nota preserva a alternativa sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Vocês” torna explícito o plural hebraico sem rigidez arcaica. A pontuação mantém a progressão das três acusações. A nota foi colocada após “Lei”, termo ao qual ela efetivamente se refere.
