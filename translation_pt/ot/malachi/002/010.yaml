  text: הֲ/ל֨וֹא אָ֤ב אֶחָד֙ לְ/כֻלָּ֔/נוּ הֲ/ל֛וֹא אֵ֥ל אֶֽחָ֖ד בְּרָאָ֑/נוּ מַדּ֗וּעַ נִבְגַּד֙ אִ֣ישׁ בְּ/אָחִ֔י/ו לְ/חַלֵּ֖ל בְּרִ֥ית אֲבֹתֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/010.yaml
  text: Do we not all have one Father? Has not one God created us? Why then are we faithless[a], each man to his brother[b], profaning the covenant of our fathers?
translation:
  language: pt
  text: Não temos todos nós um só pai?[b] Não foi um só Deus que nos criou? Por que, então, somos infiéis[a], cada homem para com seu irmão, profanando a aliança de nossos pais?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “agimos traiçoeiramente”. O verbo hebraico indica agir com traição ou deslealdade, especialmente em uma relação de aliança.'
    reason: lexical_alternative
  - marker: b
    text: “Um só pai” pode referir-se diretamente a Deus, como sugere o paralelo “um só Deus que nos criou”; alguns entendem a expressão de modo mais amplo, como referência a um ancestral comum da aliança.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלוֹא
  choice: Não... ? / Não foi... ?
  rationale: Introduz perguntas retóricas que esperam resposta afirmativa; essa construção é natural e clara em português.
- source_word: אָב אֶחָד
  choice: um só Pai
  rationale: Preserva a singularidade e o tema da unidade, sem decidir explicitamente se a expressão se refere a Deus ou a um ancestral comum.
- source_word: לְכֻלָּנוּ
  choice: temos todos nós
  rationale: Expressa de modo idiomático a ideia de que o único Pai é comum a todos.
- source_word: אֵל אֶחָד
  choice: um só Deus
  rationale: Tradução direta que mantém a ênfase na unicidade de Deus.
- source_word: בְּרָאָנוּ
  choice: nos criou
  rationale: O verbo ברא é especialmente apropriado para a criação divina; “criou” preserva esse peso.
- source_word: מַדּוּעַ
  choice: Por que, então
  rationale: “Então” torna explícita, de maneira natural, a inferência entre as perguntas iniciais e a repreensão seguinte.
- source_word: נִבְגַּד
  choice: somos infiéis
  rationale: O verbo denota agir com deslealdade ou traição, especialmente no âmbito de uma relação de aliança; “infiéis” é conciso e mantém essa dimensão.
- source_word: אִישׁ בְּאָחִיו
  choice: cada homem para com seu irmão
  rationale: Mantém a formulação distributiva e masculina do hebraico; “para com” expressa a relação em que ocorre a infidelidade sem acrescentar uma ideia de hostilidade física.
- source_word: לְחַלֵּל
  choice: profanando
  rationale: Preserva a gravidade religiosa do verbo e liga naturalmente a ação desleal à profanação da aliança.
- source_word: בְּרִית אֲבֹתֵינוּ
  choice: a aliança de nossos pais
  rationale: Mantém a relação genitiva e a continuidade da aliança com as gerações ancestrais.
theological_decisions:
- issue: Identidade do “um só Pai”
  choice: “um só Pai”, sem identificação adicional no texto
  alternative: “um só ancestral” ou “Deus, nosso Pai”
  rationale: O paralelo com “um só Deus” favorece a referência divina, mas o hebraico não explicita essa identificação; a tradução conserva a ambiguidade genuína.
- issue: Linguagem masculina em אִישׁ ... אָחִיו
  choice: “cada homem para com seu irmão”
  alternative: “cada pessoa para com outra” ou “uns para com os outros”
  rationale: A tradução retém os substantivos masculinos singulares do hebraico e sua força distributiva, sem neutralizá-los.
- issue: Relação expressa por ב em בְּאָחִיו
  choice: “para com seu irmão”
  alternative: “contra seu irmão”
  rationale: “Para com” preserva a relação interpessoal da deslealdade sem impor uma nuance adversativa mais forte do que a preposição exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Um só” comunica com naturalidade a ênfase hebraica na unidade; “para com” é ligeiramente formal, mas claro e adequado ao registro bíblico.
