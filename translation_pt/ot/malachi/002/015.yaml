revisions:
- from: Não foi o único Deus quem os fez?[a] Contudo, ainda lhe restava o Espírito.[b] E o que o único buscava? Descendência piedosa.[c] Portanto, guardem-se em seu espírito, e ninguém aja com deslealdade para com a mulher da sua juventude.
  to: Não foi o Deus único que os fez?[a] Contudo, ele tinha um remanescente do Espírito.[b] E o que buscava o único? Descendência piedosa.[c] Portanto, guardem-se em seu espírito, e ninguém aja com deslealdade contra a mulher de sua juventude.
  rationale: A revisão elimina o aspecto temporal indevido de “ainda lhe restava”, melhora a fluidez de duas expressões ligadas a “um/único” e conserva tanto a leitura contextual que identifica o agente como Deus quanto a incerteza excepcional do hebraico nas notas. As âncoras a, b e c permanecem junto às expressões que explicam.
