  text: וְ/לֹא אֶחָ֣ד עָשָׂ֗ה וּ/שְׁאָ֥ר ר֨וּחַ֙ ל֔/וֹ וּ/מָה֙ הָֽ/אֶחָ֔ד מְבַקֵּ֖שׁ זֶ֣רַע אֱלֹהִ֑ים וְ/נִשְׁמַרְתֶּם֙ בְּ/ר֣וּחֲ/כֶ֔ם וּ/בְ/אֵ֥שֶׁת נְעוּרֶ֖י/ךָ אַל יִבְגֹּֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/015.yaml
  text: Did not the one God make them[a]? Yet a remnant of the Spirit was his. And what was the one seeking? Godly offspring. So guard yourselves in your spirit[c][b], and let no one deal treacherously with the wife of his youth.
translation:
  language: pt
  text: Não foi o Deus único que os fez?[a] Contudo, ele tinha um remanescente do Espírito.[b] E o que buscava o único? Descendência piedosa.[c] Portanto, guardem-se em seu espírito, e ninguém aja com deslealdade contra a mulher de sua juventude.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico é muito difícil: literalmente, pode ser lido como “Não fez um só?”. Outras interpretações incluem: “Ninguém que tenha sequer um resto de espírito faz isso”, ou entendem “o único” como referência a Abraão.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “ele tinha um remanescente de espírito”; também se entende a expressão como “ele tinha espírito em abundância”. O hebraico não indica se “espírito” se refere especificamente ao Espírito de Deus.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “semente de Deus”; também pode ser entendido como “descendência de Deus” ou “descendência dada por Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא אֶחָד עָשָׂה
  choice: Não foi o único Deus quem os fez?
  rationale: Entende אֶחָד como referência ao Deus único e supre o objeto plural a partir do contexto matrimonial. Como “Deus” e “os” não estão expressos nesta oração hebraica, a dificuldade e outras análises são registradas em nota.
- source_word: וּשְׁאָר רוּחַ לוֹ
  choice: Contudo, ainda lhe restava o Espírito
  rationale: שְׁאָר indica resto ou remanescente, e לוֹ indica posse ou relação (“para ele/dele”). “Espírito” com maiúscula mantém a leitura de uma dádiva divina, sem ocultar que רוּחַ também pode ser entendido como “espírito” em sentido não especificado.
- source_word: וּמָה הָאֶחָד מְבַקֵּשׁ
  choice: E o que o único buscava?
  rationale: Mantém a forma interrogativa e a retomada de אֶחָד pelo artigo. “Buscava” representa naturalmente o particípio מְבַקֵּשׁ no contexto.
- source_word: זֶרַע אֱלֹהִים
  choice: Descendência piedosa
  rationale: זֶרַע, no contexto do casamento, é expresso de modo idiomático como “descendência”. O genitivo אֱלֹהִים é entendido qualitativamente, enquanto a tradução mais literal permanece na nota.
- source_word: וְנִשְׁמַרְתֶּם בְּרוּחֲכֶם
  choice: Portanto, guardem-se em seu espírito
  rationale: O nifal tem força reflexiva, “guardem-se”, e בְּרוּחֲכֶם é preservado como “em seu espírito”, mantendo o foco interior sem explicar além do texto.
- source_word: וּבְאֵשֶׁת נְעוּרֶיךָ אַל יִבְגֹּד
  choice: e ninguém aja com deslealdade para com a mulher da sua juventude
  rationale: בגד designa conduta traiçoeira ou desleal, especialmente em relações de aliança. “Ninguém” comunica naturalmente a proibição na terceira pessoa do singular após a exortação plural.
theological_decisions:
- issue: Identidade de “o único” e sentido da primeira oração
  choice: O Deus único fez o casal
  alternative: “Não foi um só que fez?”; referência a Abraão; ou “ninguém que tenha sequer um resto de espírito faz isso”
  rationale: A leitura escolhida se ajusta à denúncia da deslealdade matrimonial e à apresentação do SENHOR como testemunha da aliança no contexto imediato. A sintaxe hebraica, porém, é excepcionalmente difícil, de modo que as principais alternativas são preservadas em nota.
- issue: Referência de רוּחַ
  choice: Espírito, possivelmente o Espírito divino
  alternative: espírito, fôlego ou disposição humana
  rationale: O hebraico não distingue maiúsculas e minúsculas. A maiúscula sinaliza a leitura divina adotada, mas a nota conserva a ambiguidade real.
- issue: Sentido de זֶרַע אֱלֹהִים
  choice: descendência piedosa
  alternative: descendência de Deus ou descendência dada por Deus
  rationale: A leitura qualitativa se integra à exortação à fidelidade da aliança, mas a construção genitiva admite outras relações semânticas; por isso, a formulação literal é indicada em nota.
translation_notes:
  register: Português atual, digno e de leitura ampla, com formas verbais correntes no Brasil e compreensíveis internacionalmente. A formulação conserva a concisão e parte da estranheza do hebraico, enquanto as notas documentam a excepcional incerteza sintática e teológica do versículo.
