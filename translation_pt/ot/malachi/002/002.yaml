id: MAL.2.2
reference: Malachi 2:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אִם לֹ֣א תִשְׁמְע֡וּ וְ/אִם לֹא֩ תָשִׂ֨ימוּ עַל לֵ֜ב לָ/תֵ֧ת כָּב֣וֹד לִ/שְׁמִ֗/י אָמַר֙ יְהוָ֣ה צְבָא֔וֹת וְ/שִׁלַּחְתִּ֤י בָ/כֶם֙ אֶת הַ/מְּאֵרָ֔ה וְ/אָרוֹתִ֖י אֶת בִּרְכֽוֹתֵי/כֶ֑ם וְ/גַם֙ אָרוֹתִ֔י/הָ כִּ֥י אֵינְ/כֶ֖ם שָׂמִ֥ים עַל לֵֽב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/002.yaml
  text: If you will not listen[a], and if you will not take it to heart to give glory to my name, says Yahweh of Armies, then I will send the curse among you, and I will curse your blessings; indeed, I have already cursed them[b], because you are not taking it to heart.
translation:
  language: pt
  text: Se vocês não ouvirem nem levarem a sério o dever de dar glória ao meu nome, diz Yahweh dos Exércitos, enviarei a maldição sobre vocês e amaldiçoarei as suas bênçãos. De fato, já as amaldiçoei[a], porque vocês não levam isso a sério.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico também pode ser entendido como “também as amaldiçoarei” ou, no singular, “eu a amaldiçoei”.
    reason: alternative_reading
lexical_decisions:
- source_word: תִשְׁמְעוּ
  choice: ouvirem
  rationale: Preserva o sentido básico de escutar, deixando que a ideia contextual de atender ou obedecer permaneça implícita.
- source_word: תָשִׂימוּ עַל לֵב
  choice: levarem isso a sério
  rationale: Expressa em português corrente o idioma hebraico de pôr algo no coração, isto é, dar-lhe atenção séria; a mesma formulação reaparece no fim para preservar a repetição.
- source_word: לָתֵת כָּבוֹד לִשְׁמִי
  choice: dando glória ao meu nome
  rationale: Mantém a linguagem teológica de כָּבוֹד e o foco do texto no nome de Yahweh.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Translitera o nome divino e traduz צְבָאוֹת de modo transparente e natural em português.
- source_word: וְשִׁלַּחְתִּי בָכֶם אֶת הַמְּאֵרָה
  choice: enviarei a maldição sobre vocês
  rationale: Comunica naturalmente a ação de fazer recair a maldição sobre os destinatários; o artigo definido preserva a especificidade do hebraico.
- source_word: וְאָרוֹתִי אֶת בִּרְכוֹתֵיכֶם
  choice: amaldiçoarei as suas bênçãos
  rationale: Conserva o objeto direto ambíguo do hebraico sem decidir se são bênçãos recebidas, pronunciadas ou ambas.
- source_word: וְגַם אָרוֹתִיהָ
  choice: De fato, já as amaldiçoei
  rationale: Entende o perfeito como ação já iniciada e verte o sufixo feminino singular por um plural idiomático referente às bênçãos, registrando em nota as alternativas reais.
- source_word: כִּי אֵינְכֶם שָׂמִים עַל לֵב
  choice: porque vocês não levam isso a sério
  rationale: Repete a mesma expressão da primeira oração e representa claramente a segunda pessoa do plural.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino; “Yahweh” preserva de modo reconhecível o nome da aliança sem substituí-lo por um título.
- issue: Valor temporal e referente de אָרוֹתִיהָ
  choice: já as amaldiçoei
  alternative: também as amaldiçoarei; amaldiçoei-a
  rationale: O perfeito após as ameaças futuras pode indicar que a maldição já começou. Contudo, o valor profético/futuro e o sufixo singular permanecem possibilidades genuínas, preservadas em nota.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para explicitar o plural. A expressão “levar a sério” traduz naturalmente o idioma hebraico e preserva sua repetição retórica. O título “dos Exércitos” mantém a imagem militar tradicional sem recorrer ao arcaísmo “das Hostes”.
