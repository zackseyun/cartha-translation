  to: Se vocês não ouvirem nem levarem a sério o dever de dar glória ao meu nome, diz Yahweh dos Exércitos, enviarei a maldição sobre vocês e amaldiçoarei as suas bênçãos. De fato, já as amaldiçoei[a], porque vocês não levam isso a sério.
  rationale: A revisão elimina a ambiguidade sintática da primeira oração ao explicitar que o conteúdo a ser levado a sério é dar glória ao nome de Yahweh. Mantém-se a repetição final de “levar a sério”, o plural idiomático “as” para o antecedente coletivo “bênçãos” e a nota que registra tanto a leitura futura quanto o possível referente singular.
