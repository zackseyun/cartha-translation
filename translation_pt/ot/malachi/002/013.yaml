  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/זֹאת֙ שֵׁנִ֣ית תַּֽעֲשׂ֔וּ כַּסּ֤וֹת דִּמְעָה֙ אֶת מִזְבַּ֣ח יְהוָ֔ה בְּכִ֖י וַֽ/אֲנָקָ֑ה מֵ/אֵ֣ין ע֗וֹד פְּנוֹת֙ אֶל הַ/מִּנְחָ֔ה וְ/לָ/קַ֥חַת רָצ֖וֹן מִ/יֶּדְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/013.yaml
  text: 'And this second thing you do: you cover the altar of Yahweh with tears[a], with weeping and groaning, because he no longer regards the offering or accepts it with favor from your hand.'
translation:
  language: pt
  text: 'E esta é a segunda coisa que vocês fazem: cobrem de lágrimas o altar de Yahweh, com choro e gemidos, porque ele já não dá atenção à oferta[a] nem a recebe com agrado das mãos de vocês.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “oferta de cereal”. O termo hebraico מִנְחָה pode indicar especificamente uma oferta de cereal ou, em sentido mais amplo, uma oferta.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וְזֹאת שֵׁנִית
  choice: E esta é a segunda coisa
  rationale: Apresenta uma segunda acusação e conserva a força ordinal de שֵׁנִית em português natural.
- source_word: תַּעֲשׂוּ
  choice: que vocês fazem
  rationale: O imperfeito tem aqui valor presente ou habitual no contexto da acusação profética.
- source_word: כַּסּוֹת דִּמְעָה אֶת מִזְבַּח יְהוָה
  choice: cobrem de lágrimas o altar de Yahweh
  rationale: Mantém a imagem concreta de כסה, “cobrir”, com uma construção idiomática em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: בְּכִי וַאֲנָקָה
  choice: com choro e gemidos
  rationale: Comunica de modo claro tanto o pranto quanto a expressão audível de angústia.
- source_word: מֵאֵין עוֹד פְּנוֹת אֶל הַמִּנְחָה
  choice: porque ele já não dá atenção à oferta
  rationale: Expressa naturalmente a cessação indicada por מֵאֵין עוֹד e o sentido contextual de פנה אל como voltar-se para ou considerar favoravelmente.
- source_word: הַמִּנְחָה
  choice: a oferta
  rationale: מִנְחָה pode designar especificamente uma oferta de cereal ou, de forma mais ampla, uma oferta; o termo geral preserva essa amplitude no texto principal.
- source_word: וְלָקַחַת רָצוֹן מִיֶּדְכֶם
  choice: nem a recebe com agrado das mãos de vocês
  rationale: Traduz o sentido cultual de receber favoravelmente e conserva a imagem da oferta procedente das mãos dos adoradores.
theological_decisions:
- issue: Sujeito implícito dos verbos na oração final
  choice: Yahweh, retomado pelo pronome “ele”
  alternative: 'Construção impessoal: “já não há atenção à oferta”'
  rationale: Embora a formulação hebraica seja condensada, o contexto identifica Yahweh como aquele que deixa de considerar e aceitar a oferta; o pronome torna a frase natural sem introduzir uma afirmação teológica nova.
translation_notes:
  register: Português moderno, digno e acessível, com formas de tratamento amplamente compreensíveis no Brasil e em outros contextos lusófonos. A repetição semântica de “lágrimas”, “choro” e “gemidos” foi preservada por fazer parte da intensidade retórica do hebraico.
