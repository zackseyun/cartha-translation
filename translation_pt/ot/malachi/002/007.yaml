  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי שִׂפְתֵ֤י כֹהֵן֙ יִשְׁמְרוּ דַ֔עַת וְ/תוֹרָ֖ה יְבַקְשׁ֣וּ מִ/פִּ֑י/הוּ כִּ֛י מַלְאַ֥ךְ יְהוָֽה צְבָא֖וֹת הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/007.yaml
  text: For the lips of a priest should guard knowledge[a], and they should seek instruction from his mouth[b], because he is the messenger of Yahweh of Armies.
translation:
  language: pt
  text: Pois os lábios do sacerdote devem guardar o conhecimento, e as pessoas devem buscar instrução da sua boca[a], porque ele é o mensageiro do SENHOR dos Exércitos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ensino” ou “lei”. A palavra hebraica é torah.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: YHWH dos Exércitos; o nome divino também é transliterado “Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂפְתֵי כֹהֵן
  choice: os lábios do sacerdote
  rationale: Preserva a construção hebraica e o sentido representativo do sacerdote, sem identificar um indivíduo específico.
- source_word: יִשְׁמְרוּ
  choice: devem guardar
  rationale: O imperfeito tem força normativa no contexto da repreensão aos sacerdotes; “devem” expressa a obrigação, e “guardar” conserva a imagem do texto.
- source_word: דַעַת
  choice: o conhecimento
  rationale: Tradução direta que, no contexto, designa o conhecimento fiel de Deus e de seus caminhos, não mera informação.
- source_word: וְתוֹרָה
  choice: instrução
  rationale: Aqui torah é o ensino autorizado procurado da boca do sacerdote. “Instrução” evita restringir o termo apenas à legislação, enquanto a nota registra alternativas legítimas.
- source_word: יְבַקְשׁוּ מִפִּיהוּ
  choice: da sua boca devem buscar instrução
  rationale: Mantém o verbo plural com força normativa e conserva a imagem da transmissão oral. A ordem marcada evita acrescentar um sujeito nominal ausente no hebraico.
- source_word: מַלְאַךְ
  choice: mensageiro
  rationale: O referente é o sacerdote incumbido de transmitir a palavra divina; “anjo” seria inadequado neste contexto.
- source_word: יְהוָה צְבָאוֹת
  choice: SENHOR dos Exércitos
  rationale: “SENHOR” segue a convenção reverente para o tetragrama, e “dos Exércitos” traduz o título divino de modo consagrado e compreensível em português.
theological_decisions:
- issue: Força normativa dos verbos no imperfeito
  choice: devem guardar / devem buscar
  alternative: guardarão / buscarão
  rationale: O contexto descreve o dever dos sacerdotes em contraste com sua infidelidade, não uma simples previsão futura.
- issue: Tradução do nome divino יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: A forma em versalete segue a tradição reverente amplamente reconhecida, enquanto a nota torna explícito o nome presente no hebraico.
- issue: Identidade do מַלְאַךְ
  choice: mensageiro
  alternative: anjo
  rationale: O próprio sacerdote é chamado de enviado que comunica a instrução do Senhor; o verso não o identifica como ser celestial.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem “da sua boca devem buscar” conserva tanto a imagem hebraica quanto o sujeito plural implícito, sem inserir “as pessoas”. O título divino usa a forma portuguesa tradicional “SENHOR dos Exércitos”.
