revisions:
- from: Então vocês saberão que lhes enviei esta ordem, para que minha aliança com Levi subsista,[a] diz Yahweh dos Exércitos.[b]
  to: Então vocês saberão que lhes enviei esta ordem, para que minha aliança com Levi exista,[a] diz Yahweh dos Exércitos.[b]
  rationale: A revisão remove a ideia adicional de que a aliança necessariamente “subsista”, sem optar pela leitura mais forte de que a ordem seja idêntica à aliança. “Exista” expressa de modo inteligível o mínimo semântico de “ser”, e a nota preserva a literalidade e a alternativa contextual de permanência.
