  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וִֽ/ידַעְתֶּ֕ם כִּ֚י שִׁלַּ֣חְתִּי אֲלֵי/כֶ֔ם אֵ֖ת הַ/מִּצְוָ֣ה הַ/זֹּ֑את לִֽ/הְי֤וֹת בְּרִיתִ/י֙ אֶת לֵוִ֔י אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/004.yaml
  text: Then you will know that I have sent this command to you[a], that my covenant with Levi may be[b], says Yahweh of Armies.
translation:
  language: pt
  text: Então vocês saberão que lhes enviei esta ordem, para que minha aliança com Levi exista,[a] diz Yahweh dos Exércitos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “para ser a minha aliança com Levi”. O hebraico é condensado; também pode indicar que esta ordem foi enviada em relação à permanência da aliança de Deus com Levi.
    reason: alternative_reading
  - marker: b
    text: 'Tradução tradicional: “o SENHOR dos Exércitos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: Então vocês saberão
  rationale: O perfeito qal com waw, neste contexto profético, tem sentido futuro e consequencial; “então” liga o conhecimento ao juízo anunciado anteriormente.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo daquilo que os sacerdotes saberão, e não uma explicação causal.
- source_word: שִׁלַּחְתִּי אֲלֵיכֶם
  choice: lhes enviei
  rationale: Expressa de modo natural em português a ação concluída de enviar algo aos destinatários; אֶל indica direção ou destinatário, não necessariamente hostilidade.
- source_word: הַמִּצְוָה הַזֹּאת
  choice: esta ordem
  rationale: מִצְוָה designa uma ordem ou determinação; “ordem” é corrente e apropriado à advertência dirigida aos sacerdotes.
- source_word: לִהְיוֹת בְּרִיתִי אֶת־לֵוִי
  choice: para que minha aliança com Levi subsista
  rationale: A construção hebraica é condensada. “Subsista” comunica a existência continuada ou vigência da aliança no contexto, enquanto a nota preserva a formulação literal e sua ambiguidade.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino e traduz צְבָאוֹת com sua força plural e militar; a forma tradicional é registrada em nota.
theological_decisions:
- issue: Sentido da oração final relacionada à aliança com Levi
  choice: A ordem é enviada para que a aliança de Deus com Levi subsista ou permaneça em vigor.
  alternative: A ordem enviada é, ela mesma, a aliança com Levi; ou a frase significa apenas “para ser a minha aliança com Levi”.
  rationale: O infinitivo לִהְיוֹת introduz uma expressão breve e ambígua. O contexto de Malaquias 2:1–9 favorece a vigência da aliança já existente, mas a nota mantém aberta a possibilidade de uma relação mais direta entre a ordem e a própria aliança.
- issue: Referente de Levi
  choice: Conservar o nome singular “Levi”.
  alternative: Explicitar “os levitas” ou “o sacerdócio levítico”.
  rationale: O nome pode representar corporativamente o sacerdócio levítico, mas o texto hebraico diz Levi; a tradução evita substituir a figura ancestral por uma interpretação explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” e pronome átono natural (“lhes”). “Subsista” conserva solenidade moderada sem soar arcaico. As notas registram tanto a ambiguidade sintática quanto a forma tradicional do título divino.
