id: MAL.2.12
reference: Malachi 2:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יַכְרֵ֨ת יְהוָ֜ה לָ/אִ֨ישׁ אֲשֶׁ֤ר יַעֲשֶׂ֨/נָּה֙ עֵ֣ר וְ/עֹנֶ֔ה מֵ/אָהֳלֵ֖י יַֽעֲקֹ֑ב וּ/מַגִּ֣ישׁ מִנְחָ֔ה לַֽ/יהוָ֖ה צְבָאֽוֹת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/012.yaml
  text: May Yahweh cut off from the tents of Jacob the man who does this[a], him who is awake and him who answers, and him who brings an offering to Yahweh of hosts.
translation:
  language: pt
  text: Que Yahweh elimine das tendas de Jacó o homem que faz isso[a], tanto o que está desperto como o que responde, e o que apresenta uma oferta a Yahweh dos Exércitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “o que está desperto e o que responde”. A expressão é difícil; pode ser uma expressão idiomática com sentido semelhante a “testemunha e defensor” ou uma forma de abranger todos os envolvidos.
    reason: alternative_reading
lexical_decisions:
- source_word: יַכְרֵת
  choice: Que ... elimine
  rationale: O hifil de כרת expressa a ideia de excluir ou eliminar. A construção com "Que" preserva aqui a força optativa ou imprecatória do imperfeito, sem convertê-lo em simples predição.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: לָאִישׁ אֲשֶׁר יַעֲשֶׂנָּה
  choice: o homem que faz isso
  rationale: Mantém o singular masculino representativo e entende o sufixo feminino como referência à prática condenada no contexto anterior.
- source_word: עֵר וְעֹנֶה
  choice: tanto o que está desperto como o que responde
  rationale: Conserva os sentidos mais transparentes dos particípios e evita resolver uma expressão idiomática de significado incerto. "Tanto... como" indica o par sem definir sua relação exata.
- source_word: מֵאָהֳלֵי יַעֲקֹב
  choice: das tendas de Jacó
  rationale: Preserva a imagem hebraica tradicional para a comunidade e as famílias de Israel.
- source_word: וּמַגִּישׁ מִנְחָה
  choice: e o que apresenta uma oferta
  rationale: Reproduz a coordenação e o particípio sem acrescentar uma força adversativa ou concessiva que não está explicitamente marcada.
- source_word: מִנְחָה
  choice: oferta
  rationale: No contexto cultual, o termo pode designar uma oferta ou dádiva e não precisa ser especificado como oferta de cereal neste versículo.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino e traduz צְבָאוֹת de modo a preservar a imagem dos exércitos ou hostes celestiais.
theological_decisions:
- issue: Força do imperfeito inicial em uma declaração de juízo
  choice: Que Yahweh elimine
  alternative: Yahweh eliminará
  rationale: O contexto admite uma imprecação ou desejo solene. A formulação escolhida preserva essa força sem negar a dimensão de juízo.
- issue: Sentido da expressão difícil עֵר וְעֹנֶה
  choice: tradução relativamente literal no texto, com explicação em nota
  alternative: testemunha e defensor; mestre e discípulo; todos os envolvidos
  rationale: O sentido idiomático não é seguro. A tradução não deve fixar uma interpretação específica que o hebraico não estabelece claramente.
- issue: Relação do ofertante com os demais elementos da sentença
  choice: 'coordenação simples: "e o que apresenta"'
  alternative: '"ainda que apresente" ou "e, no entanto, apresenta"'
  rationale: O hebraico coordena os elementos com וְ; embora o contexto possa sugerir hipocrisia cultual, a tradução principal evita inserir uma concessão explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe mantém a solenidade profética e a ambiguidade da expressão hebraica central; o marcador [a] aparece imediatamente após seu referente.
