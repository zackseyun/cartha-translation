  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הוֹגַעְתֶּ֤ם יְהוָה֙ בְּ/דִבְרֵי/כֶ֔ם וַ/אֲמַרְתֶּ֖ם בַּ/מָּ֣ה הוֹגָ֑עְנוּ בֶּ/אֱמָרְ/כֶ֗ם כָּל עֹ֨שֵׂה רָ֜ע ט֣וֹב בְּ/עֵינֵ֣י יְהוָ֗ה וּ/בָ/הֶם֙ ה֣וּא חָפֵ֔ץ א֥וֹ אַיֵּ֖ה אֱלֹהֵ֥י הַ/מִּשְׁפָּֽט־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/017.yaml
  text: You have wearied Yahweh with your words. Yet you say[a], “How have we wearied him?” By saying, “Everyone who does evil is good in the eyes of Yahweh, and he delights in them,” or, “Where is the God of justice?”
translation:
  language: pt
  text: 'Vocês cansaram Yahweh com suas palavras. Mas perguntam: “Como o cansamos?” Ao dizerem: “Todo aquele que pratica o mal é bom aos olhos de Yahweh, e ele se agrada deles”, ou: “Onde está o Deus da justiça[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o Deus do julgamento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹגַעְתֶּם / הוֹגָעְנוּ
  choice: cansaram / cansamos
  rationale: O hifil de יגע expressa causar cansaço. A formulação preserva a linguagem antropopática e soa natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico, em vez de substituí-lo por um título.
- source_word: בְּדִבְרֵיכֶם
  choice: com suas palavras
  rationale: A preposição indica o meio pelo qual Yahweh foi cansado.
- source_word: בַּמָּה
  choice: Como
  rationale: Expressa de modo direto e idiomático a objeção que pergunta em que sentido eles cansaram Deus.
- source_word: בֶּאֱמָרְכֶם
  choice: Ao dizerem
  rationale: Introduz a explicação do modo pelo qual cansaram Yahweh, mantendo a ligação com a fala citada.
- source_word: כָּל עֹשֵׂה רָע
  choice: Todo aquele que pratica o mal
  rationale: Preserva o valor genérico e distributivo do particípio hebraico em português claro e atual.
- source_word: טוֹב
  choice: é bom
  rationale: Mantém o sentido simples do adjetivo e a força irônica da acusação.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Conserva a imagem hebraica de avaliação sem perder a clareza em português.
- source_word: וּבָהֶם הוּא חָפֵץ
  choice: e ele se agrada deles
  rationale: חפץ denota agrado ou prazer; esta forma é natural e mantém a acusação de que Deus aprovaria os malfeitores.
- source_word: אוֹ
  choice: ou
  rationale: Apresenta uma forma alternativa da mesma queixa cínica, sem fundir as duas afirmações.
- source_word: אַיֵּה
  choice: Onde está
  rationale: Preserva o desafio direto que sugere a aparente ausência da atuação divina.
- source_word: אֱלֹהֵי הַמִּשְׁפָּט
  choice: o Deus da justiça
  rationale: Neste contexto, מִשְׁפָּט aponta para o governo moral justo de Deus; 'justiça' comunica esse sentido amplo, enquanto 'julgamento' permanece uma alternativa legítima.
theological_decisions:
- issue: Descrição antropopática de Deus como cansado
  choice: Vocês cansaram Yahweh
  alternative: Vocês ofenderam Yahweh; vocês sobrecarregaram Yahweh
  rationale: O hebraico emprega explicitamente a ideia de causar cansaço. A tradução conserva a imagem pessoal e a tensão teológica, sem convertê-la numa abstração.
- issue: Sentido de מִשְׁפָּט na cláusula final
  choice: justiça
  alternative: julgamento
  rationale: A queixa diz respeito à aparente ausência da justa ordem moral e da intervenção de Deus. 'Justiça' comunica bem essa amplitude, e a nota preserva a alternativa lexical genuína.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O plural é expresso por “vocês”, evitando formas regionais menos universais. A imagem “aos olhos de” e o nome Yahweh preservam elementos formais relevantes do hebraico.
