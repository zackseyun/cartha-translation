  text: הִנְ/נִ֨י גֹעֵ֤ר לָ/כֶם֙ אֶת הַ/זֶּ֔רַע וְ/זֵרִ֤יתִי פֶ֨רֶשׁ֙ עַל פְּנֵי/כֶ֔ם פֶּ֖רֶשׁ חַגֵּי/כֶ֑ם וְ/נָשָׂ֥א אֶתְ/כֶ֖ם אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/003.yaml
  text: Look[a], I am rebuking your offspring[c][b], and I will spread dung on your faces—the dung of your festival sacrifices—and one will carry you away with it.
translation:
  language: pt
  text: Vejam, estou prestes a repreender a descendência de vocês[a]. Espalharei esterco sobre o rosto de vocês — o esterco dos sacrifícios das suas festas[b] — e alguém levará vocês embora junto com ele[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a semente de vocês”. Alguns entendem que a expressão se refere aos grãos, às plantações ou às colheitas, e não à descendência.
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “o esterco das suas festas”; provavelmente se trata dos dejetos ou resíduos dos animais oferecidos durante as festas.'
    reason: lexical_alternative
  - marker: c
    text: A oração final é difícil no hebraico. Provavelmente indica que os sacerdotes seriam removidos com o esterco e os resíduos dos sacrifícios para um lugar impuro.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנְנִי גֹעֵר
  choice: estou prestes a repreender
  rationale: A construção com הִנְנִי e o particípio anuncia uma ação iminente e decidida. A formulação preserva o sentido declarativo e a força de גער sem recorrer ao arcaizante “eis que”.
- source_word: הַזֶּרַע
  choice: a descendência de vocês
  rationale: זֶרַע pode designar tanto semente em sentido concreto como descendência. No oráculo dirigido aos sacerdotes, “descendência” comunica de modo natural a leitura contextual mais provável, enquanto a nota preserva a alternativa agrícola.
- source_word: וְזֵרִיתִי
  choice: espalharei
  rationale: No piel, זרה pode significar espalhar ou dispersar. Com esterco como objeto e o rosto como destino, “espalharei” reproduz de forma clara a ação humilhante.
- source_word: פֶּרֶשׁ
  choice: esterco
  rationale: O termo se refere ao excremento ou rejeito dos animais. “Esterco” mantém a concretude e o caráter deliberadamente ofensivo da imagem hebraica.
- source_word: עַל פְּנֵיכֶם
  choice: sobre o rosto de vocês
  rationale: Tradução direta e idiomática da expressão hebraica, preservando a imagem pública de vergonha e contaminação.
- source_word: פֶּרֶשׁ חַגֵּיכֶם
  choice: o esterco dos sacrifícios das suas festas
  rationale: Literalmente, a expressão diz “o esterco das suas festas”. O contexto cultual indica os dejetos ou resíduos dos animais oferecidos durante as festas; “dos sacrifícios das suas festas” explicita essa relação sem alterar a imagem central.
- source_word: וְנָשָׂא אֶתְכֶם אֵלָיו
  choice: e alguém levará vocês embora junto com ele
  rationale: A oração hebraica é sintaticamente condensada e tem sujeito não expresso. “Alguém” conserva o agente indeterminado, e “junto com ele” relaciona os sacerdotes ao esterco que era removido como rejeito.
theological_decisions:
- issue: Sentido de הַזֶּרַע no anúncio de juízo contra os sacerdotes
  choice: descendência
  alternative: semente, isto é, grãos, plantações ou colheitas
  rationale: O contexto de juízo sobre os sacerdotes e sua continuidade favorece a referência à posteridade, mas o substantivo hebraico permanece lexicalmente ambíguo; por isso, a leitura agrícola é registrada em nota.
- issue: Sentido da oração final וְנָשָׂא אֶתְכֶם אֵלָיו
  choice: um agente não identificado levará os sacerdotes embora junto com o esterco
  alternative: o próprio esterco os levará até ele; ou eles serão levados para junto dele
  rationale: A imagem mais provável é a remoção dos sacerdotes, já contaminados, juntamente com os rejeitos sacrificiais para um lugar impuro. A tradução evita identificar um agente específico e a nota reconhece a dificuldade gramatical.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. “Vocês” torna explícito o plural hebraico e evita ambiguidades de concordância. A expressão forte “esterco” foi mantida para não suavizar a violência retórica do oráculo.
