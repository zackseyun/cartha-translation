  text: בָּגְדָ֣ה יְהוּדָ֔ה וְ/תוֹעֵבָ֛ה נֶעֶשְׂתָ֥ה בְ/יִשְׂרָאֵ֖ל וּ/בִ/ירֽוּשָׁלִָ֑ם כִּ֣י חִלֵּ֣ל יְהוּדָ֗ה קֹ֤דֶשׁ יְהוָה֙ אֲשֶׁ֣ר אָהֵ֔ב וּ/בָעַ֖ל בַּת אֵ֥ל נֵכָֽר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/011.yaml
  text: Judah has acted treacherously[a], and an abomination has been committed in Israel and in Jerusalem, for Judah has profaned the sanctuary of Yahweh, which he loves[b], and has married the daughter of a foreign god.
translation:
  language: pt
  text: Judá agiu traiçoeiramente, e uma abominação foi cometida em Israel e em Jerusalém, pois Judá profanou a santidade de Yahweh[a], que ele ama, e se casou com a filha de um deus estrangeiro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica também pode ser entendida como “o santuário de Yahweh” ou “o povo santo de Yahweh”; seu referente exato é ambíguo.
    reason: alternative_reading
  - marker: b
    text: Literalmente, “a filha de um deus estrangeiro”; provavelmente se refere a uma mulher ligada ao culto de outro deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּגְדָה
  choice: agiu traiçoeiramente
  rationale: Preserva a força moral e pactual do verbo, sem especificar além do texto quem foi traído.
- source_word: תוֹעֵבָה
  choice: uma abominação
  rationale: Mantém o forte peso moral e cultual do termo profético.
- source_word: נֶעֶשְׂתָה
  choice: foi cometida
  rationale: Reproduz a forma passiva e, em português, combina naturalmente com “abominação”.
- source_word: חִלֵּל
  choice: profanou
  rationale: Expressa a violação daquilo que é santo e conserva o registro religioso do hebraico.
- source_word: קֹדֶשׁ יְהוָה
  choice: a santidade de Yahweh
  rationale: Segue de perto a construção hebraica sem decidir no corpo do texto se a referência específica é ao santuário, ao povo santo ou à condição consagrada.
- source_word: אֲשֶׁר אָהֵב
  choice: que ele ama
  rationale: O perfeito pode expressar aqui uma disposição vigente; a formulação também evita explicitar um sujeito que o hebraico deixa implícito.
- source_word: וּבָעַל
  choice: se casou com
  rationale: Quando tem uma mulher como complemento, o verbo pode significar tornar-se marido dela; esta é a leitura contextual mais natural.
- source_word: בַּת אֵל נֵכָר
  choice: a filha de um deus estrangeiro
  rationale: Mantém a expressão religiosa concreta do hebraico em vez de reduzi-la a uma referência meramente étnica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Referente de קֹדֶשׁ יְהוָה
  choice: a santidade de Yahweh
  alternative: o santuário de Yahweh; o povo santo de Yahweh; aquilo que é santo para Yahweh
  rationale: A construção hebraica admite mais de uma identificação concreta. A tradução principal conserva a formulação ampla, e a nota registra as principais possibilidades.
- issue: Sentido de “filha de um deus estrangeiro”
  choice: manter a expressão literal e religiosamente marcada
  alternative: mulher estrangeira; mulher ligada ao culto de um deus estrangeiro
  rationale: O contexto denuncia infidelidade pactual associada ao culto estrangeiro, não simplesmente origem étnica.
- issue: Sujeito implícito de אֲשֶׁר אָהֵב
  choice: que ele ama
  alternative: que amou; amada por Yahweh; que Judá ama
  rationale: O hebraico não nomeia expressamente o sujeito do verbo. A redação evita acrescentar no texto principal uma identificação categórica.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com sintaxe clara e vocabulário profético forte. Conserva-se “Yahweh” como nome próprio e mantêm-se no texto e nas notas as ambiguidades relevantes do hebraico.
