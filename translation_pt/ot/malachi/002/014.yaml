  text: וַ/אֲמַרְתֶּ֖ם עַל מָ֑ה עַ֡ל כִּי יְהוָה֩ הֵעִ֨יד בֵּינְ/ךָ֜ וּ/בֵ֣ין אֵ֣שֶׁת נְעוּרֶ֗י/ךָ אֲשֶׁ֤ר אַתָּה֙ בָּגַ֣דְתָּה בָּ֔/הּ וְ/הִ֥יא חֲבֶרְתְּ/ךָ֖ וְ/אֵ֥שֶׁת בְּרִיתֶֽ/ךָ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/014.yaml
  text: But you say[a], “Why?” Because Yahweh has been a witness between you and the wife of your youth, to whom you have been unfaithful[b], though she is your companion and your wife by covenant.
translation:
  language: pt
  text: 'Mas vocês dizem: “Por quê?” Porque Yahweh foi testemunha entre você e a esposa da sua juventude, contra quem você agiu deslealmente[a], embora ela seja sua companheira e sua esposa por aliança[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a quem você traiu” ou “com quem você foi infiel”. O verbo hebraico pode indicar deslealdade, traição ou conduta pérfida, especialmente no contexto de uma aliança.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a esposa da sua aliança”; também pode ser traduzido por “sua esposa da aliança”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: Mas vocês perguntam
  rationale: O waw introduz a objeção do povo em contraste com a acusação anterior. Em português, “Mas” expressa naturalmente essa reação, e “perguntam” acomoda a fala interrogativa que segue.
- source_word: עַל־מָה
  choice: Por quê?
  rationale: É a forma portuguesa breve e idiomática de reproduzir a pergunta causal.
- source_word: עַל כִּי
  choice: Porque
  rationale: Introduz diretamente a resposta à pergunta anterior, mantendo a repetição retórica do texto hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הֵעִיד
  choice: foi testemunha
  rationale: 'O hifil de עוד tem aqui sentido jurídico e relacional: Yahweh atuou como testemunha entre as partes da aliança matrimonial.'
- source_word: אֵשֶׁת נְעוּרֶיךָ
  choice: a esposa da sua juventude
  rationale: Mantém a imagem hebraica e sua força afetiva, referindo-se à mulher com quem o homem se uniu na juventude.
- source_word: אֲשֶׁר אַתָּה בָּגַדְתָּה בָּהּ
  choice: contra quem você agiu deslealmente
  rationale: בגד indica deslealdade, traição ou perfídia, especialmente em contexto de aliança. “Contra quem” explicita que a conduta foi dirigida contra ela sem reduzir o sentido apenas à infidelidade sexual.
- source_word: וְהִיא
  choice: embora ela seja
  rationale: 'A conjunção tem força concessiva no argumento: ele agiu deslealmente apesar de ela ser sua companheira e esposa por aliança.'
- source_word: חֲבֶרְתְּךָ
  choice: sua companheira
  rationale: Expressa proximidade e vínculo pessoal de modo natural e digno no contexto matrimonial.
- source_word: אֵשֶׁת בְּרִיתֶךָ
  choice: sua esposa por aliança
  rationale: Torna clara a natureza pactual do casamento e preserva a relação entre “esposa” e “aliança” presente no hebraico.
theological_decisions:
- issue: Linguagem da aliança matrimonial
  choice: Apresentar Yahweh como testemunha do casamento constituído por aliança e a conduta do marido como deslealdade contra a esposa.
  alternative: Tratar o caso apenas como infidelidade interpessoal, sem destacar a força da aliança.
  rationale: A combinação de בגד, “agir deslealmente”, com ברית, “aliança”, confere ao texto peso relacional, jurídico e teológico explícito, sem exigir a importação de formulações doutrinárias posteriores.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O início conserva a mudança do plural (“vocês”) para o singular masculino (“você”) presente no hebraico, passando da objeção coletiva do povo à acusação dirigida a cada marido. A formulação evita restringir בגד à infidelidade sexual e mantém sua ambiguidade mais ampla de traição pactual.
