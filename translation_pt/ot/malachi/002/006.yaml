source:
  edition: WLC
  text: תּוֹרַ֤ת אֱמֶת֙ הָיְתָ֣ה בְּ/פִ֔י/הוּ וְ/עַוְלָ֖ה לֹא נִמְצָ֣א בִ/שְׂפָתָ֑י/ו בְּ/שָׁל֤וֹם וּ/בְ/מִישׁוֹר֙ הָלַ֣ךְ אִתִּ֔/י וְ/רַבִּ֖ים הֵשִׁ֥יב מֵ/עָוֺֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/006.yaml
  text: The law of truth was in his mouth[a], and no injustice was found on his lips. He walked with me in peace and uprightness[c][b], and he turned many back from iniquity.
translation:
  language: pt
  text: A instrução verdadeira estava em sua boca[a], e nenhuma injustiça foi encontrada em seus lábios[b]. Ele andou comigo em paz e retidão, e fez muitos voltar da iniquidade[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A lei da verdade estava em sua boca” ou “A instrução da verdade estava em sua boca”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “nenhuma perversidade” ou “nenhum erro foi encontrado em seus lábios”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “desviou muitos do pecado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת אֱמֶת
  choice: a instrução verdadeira
  rationale: תּוֹרָה pode designar lei, instrução ou ensino. Neste contexto, trata-se especialmente da instrução dada pelo sacerdote; “instrução verdadeira” comunica essa função e preserva a relação com אֱמֶת, sem eliminar a alternativa mais formal registrada em nota.
- source_word: בְּפִיהוּ
  choice: estava em sua boca
  rationale: Mantém a imagem hebraica da boca como fonte da fala e do ensino, também natural em português bíblico contemporâneo.
- source_word: עַוְלָה
  choice: injustiça
  rationale: O termo abrange injustiça, perversidade e conduta errada. “Injustiça” preserva sua dimensão ética sem restringi-lo apenas à falsidade verbal.
- source_word: נִמְצָא
  choice: foi encontrada
  rationale: Reproduz o valor passivo/resultativo do nifal e forma uma expressão clara em português.
- source_word: בִשְׂפָתָיו
  choice: em seus lábios
  rationale: Conserva o paralelismo corporal entre boca e lábios e a referência às palavras proferidas.
- source_word: בְּשָׁלוֹם
  choice: em paz
  rationale: Preserva a forma preposicional e permite que “paz” expresse tanto harmonia quanto integridade relacional.
- source_word: וּבְמִישׁוֹר
  choice: e retidão
  rationale: מִישׁוֹר denota literalmente nivelamento ou caminho reto e, em sentido moral, retidão ou equidade. “Retidão” se ajusta à descrição da conduta.
- source_word: הָלַךְ אִתִּי
  choice: andou comigo
  rationale: Mantém a metáfora relacional e pactual de caminhar com Deus, sem reduzi-la a uma paráfrase explicativa.
- source_word: וְרַבִּים
  choice: muitos
  rationale: Tradução direta e natural do plural substantivado.
- source_word: הֵשִׁיב
  choice: fez muitos voltar
  rationale: A construção causativa preserva a força do hifil de שׁוּב e a ideia de levar outros a retornar ou mudar de rumo.
- source_word: מֵעָוֺן
  choice: da iniquidade
  rationale: עָוֹן pode significar iniquidade, culpa ou consequência da culpa. Aqui, a preposição e o verbo de retorno favorecem o sentido de conduta pecaminosa da qual as pessoas se afastam.
theological_decisions:
- issue: Natureza da תּוֹרָה sacerdotal no contexto
  choice: “A instrução verdadeira” no texto principal
  alternative: “A lei da verdade” ou “a instrução da verdade”
  rationale: O contexto imediato descreve a função de ensino do sacerdote. “Instrução” torna essa função clara, enquanto a nota conserva a formulação mais formal e a ligação lexical com Torá.
- issue: Metáfora pactual de andar com Deus
  choice: “Ele andou comigo”
  alternative: “Ele viveu em comunhão comigo” ou “conduziu-se diante de mim”
  rationale: A tradução conserva a metáfora hebraica e sua densidade relacional, sem decidir por uma única explicação teológica.
- issue: Força causativa do retorno da iniquidade
  choice: “fez muitos voltar da iniquidade”
  alternative: “desviou muitos do pecado”
  rationale: A formulação principal mantém explicitamente a causatividade do hifil e a imagem de retorno, sem definir além do texto o processo pelo qual isso ocorreu.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se as imagens hebraicas de boca, lábios e caminhada, ao passo que “instrução verdadeira” esclarece naturalmente a função sacerdotal no contexto. Todos os marcadores de nota aparecem junto aos termos correspondentes.
