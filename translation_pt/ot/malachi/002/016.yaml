source:
  edition: WLC
  text: כִּֽי שָׂנֵ֣א שַׁלַּ֗ח אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל וְ/כִסָּ֤ה חָמָס֙ עַל לְבוּשׁ֔/וֹ אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת וְ/נִשְׁמַרְתֶּ֥ם בְּ/רוּחֲ/כֶ֖ם וְ/לֹ֥א תִבְגֹּֽדוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/016.yaml
  text: For he hates divorce[a], says Yahweh, the God of Israel, and the one who covers his garment with violence, says Yahweh of Armies. So guard yourselves in your spirit[b], and do not act faithlessly.
translation:
  language: pt
  text: Pois ele odeia o divórcio[a], diz Yahweh, o Deus de Israel, e cobre de violência a sua veste, diz Yahweh dos Exércitos. Portanto, cuidem do seu espírito e não ajam traiçoeiramente.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico deste trecho é difícil e admite mais de uma interpretação. Tradução tradicional: “Pois eu odeio o divórcio”, diz Yahweh, o Deus de Israel. Outra possibilidade: “Pois aquele que odeia e repudia”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “não sejam infiéis”. O verbo hebraico indica infidelidade ou deslealdade numa relação de aliança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou explicação da advertência anterior e mantém o fluxo argumentativo.
- source_word: שָׂנֵא שַׁלַּח
  choice: aquele que odeia e manda embora
  rationale: A vocalização massorética favorece formas de terceira pessoa; a formulação preserva a dificuldade sintática e o ato de repudiar a esposa sem converter silenciosamente a frase na leitura tradicional em primeira pessoa.
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: Yahweh, o Deus de Israel
  rationale: Translitera o nome divino e traduz diretamente o título.
- source_word: וְכִסָּה חָמָס עַל לְבוּשׁוֹ
  choice: cobre sua própria veste de violência
  rationale: Mantém a metáfora concreta e sua ambiguidade, com uma sintaxe portuguesa inteligível; 'própria' explicita o sufixo possessivo reflexivo no contexto.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Expressa צְבָאוֹת em linguagem moderna, preservando a força marcial e cósmica do título.
- source_word: וְנִשְׁמַרְתֶּם בְּרוּחֲכֶם
  choice: Portanto, guardem-se em seu espírito
  rationale: Reproduz a força reflexiva da exortação e seu foco na disposição interior.
- source_word: וְלֹא תִבְגֹּדוּ
  choice: e não sejam infiéis
  rationale: בגד descreve traição ou deslealdade no relacionamento de aliança; 'sejam infiéis' é natural no contexto matrimonial e preserva essa dimensão.
theological_decisions:
- issue: Leitura tradicional em primeira pessoa ou formulação massorética em terceira pessoa
  choice: 'Manter no texto principal a terceira pessoa: “aquele que odeia e manda embora”.'
  alternative: “Pois eu odeio o divórcio”, diz Yahweh, o Deus de Israel.
  rationale: O texto hebraico vocalizado apresenta שָׂנֵא como terceira pessoa masculina singular e שַׁלַּח pode ser entendido verbalmente. Como a sintaxe é notoriamente difícil, a tradução não substitui o texto massorético pela leitura tradicional, mas registra a alternativa em nota.
- issue: Relação sintática e sentido da imagem da veste coberta de violência
  choice: 'Ligar a cláusula ao homem que repudia e preservar a metáfora: “cobre sua própria veste de violência”.'
  alternative: “e aquele que cobre sua veste de violência” ou “pois a violência cobre sua veste”.
  rationale: A frase hebraica é comprimida e admite análises diferentes. A redação escolhida produz uma advertência coerente sem explicar excessivamente a possível simbologia matrimonial da veste.
- issue: Sentido de בגד no encerramento
  choice: “não sejam infiéis”.
  alternative: “não ajam traiçoeiramente”.
  rationale: No contexto, o verbo designa quebra desleal da aliança, particularmente no casamento. A escolha comunica isso claramente sem restringir o termo a adultério.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tradução conserva a metáfora da veste e a tensão textual do hebraico, evitando transformar a leitura tradicional em certeza. Todos os marcadores de nota aparecem no texto principal.
