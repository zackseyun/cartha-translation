  text: בְּרִיתִ֣/י הָיְתָ֣ה אִתּ֗/וֹ הַֽ/חַיִּים֙ וְ/הַ֨/שָּׁל֔וֹם וָ/אֶתְּנֵֽ/ם ל֥/וֹ מוֹרָ֖א וַ/יִּֽירָאֵ֑/נִי וּ/מִ/פְּנֵ֥י שְׁמִ֖/י נִחַ֥ת הֽוּא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/005.yaml
  text: My covenant with him was one of life and peace[a], and I gave them to him; this called for reverence, and he revered me[b], and he stood in awe before my name.
translation:
  language: pt
  text: Minha aliança com ele era de vida e paz, e eu lhas dei para que ele me temesse; ele me temeu e ficou consternado diante do meu nome.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A construção hebraica depois de “eu lhas dei” é condensada e também pode ser entendida como “eu lhas dei como objeto de temor” ou “para reverência”. A expressão traduzida por “ficou consternado” também pode significar “tremeu”, “foi abatido” ou “ficou aterrorizado” diante do meu nome.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרִיתִי הָיְתָה אִתּוֹ
  choice: Minha aliança com ele era
  rationale: Preserva explicitamente o possessivo e a relação expressa por אִתּוֹ, com sintaxe natural em português.
- source_word: הַחַיִּים וְהַשָּׁלוֹם
  choice: vida e paz
  rationale: Equivalentes diretos e tradicionais; os artigos hebraicos não precisam ser reproduzidos neste predicativo em português.
- source_word: וָאֶתְּנֵם לוֹ
  choice: e eu as dei a ele
  rationale: O sufixo masculino plural retoma naturalmente os dois substantivos hebraicos, vida e paz; em português, o pronome feminino plural concorda com eles.
- source_word: מוֹרָא
  choice: para que houvesse temor
  rationale: A construção hebraica é comprimida. Esta formulação conserva o substantivo 'temor' e expressa com naturalidade a finalidade ou resultado provável, sem eliminar a ambiguidade assinalada na nota.
- source_word: וַיִּירָאֵנִי
  choice: e ele me temeu
  rationale: Mantém a correspondência lexical entre מוֹרָא e ירא e conserva a força do hebraico, cujo contexto favorável indica temor reverente.
- source_word: וּמִפְּנֵי שְׁמִי
  choice: diante do meu nome
  rationale: Preserva a metáfora espacial de מִפְּנֵי e a referência explícita ao nome divino.
- source_word: נִחַת
  choice: se humilhou
  rationale: O nifal de חתת pode indicar ser abatido, quebrantado, consternado ou aterrorizado. 'Se humilhou' comunica uma postura reverente no contexto positivo, enquanto a nota registra alternativas mais fortes.
theological_decisions:
- issue: Natureza da resposta sacerdotal à aliança
  choice: Temor reverente que conduz à humildade diante de Deus
  alternative: Medo mais intenso, expresso como tremor, consternação ou terror
  rationale: מוֹרָא e ירא mantêm a dimensão real de temor, mas a moldura positiva de vida e paz favorece reverência sem transformar o texto em simples respeito brando. A nota preserva a força possível de נִחַת.
- issue: Relação sintática de מוֹרָא com a dádiva de vida e paz
  choice: 'Finalidade ou resultado: ''para que houvesse temor'''
  alternative: '''Com temor'', ''como temor'' ou ''e também temor'''
  rationale: A sintaxe hebraica é elíptica e admite mais de uma relação. A tradução oferece uma leitura coerente e natural, e a nota explicita a incerteza.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservou-se 'temor' em vez de suavizá-lo para mero respeito, e a dificuldade sintática e lexical foi reunida em nota sem impor uma solução denominacional.
