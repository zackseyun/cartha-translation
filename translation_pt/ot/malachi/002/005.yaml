- from: Minha aliança com ele era de vida e paz, e eu as dei a ele para que houvesse temor; e ele me temeu e se humilhou diante do meu nome.[a]
  to: Minha aliança com ele era de vida e paz, e eu lhas dei para que ele me temesse; ele me temeu e ficou consternado diante do meu nome.[a]
