  text: וְ/עַתָּ֗ה אֲלֵי/כֶ֛ם הַ/מִּצְוָ֥ה הַ/זֹּ֖את הַ/כֹּהֲנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/001.yaml
  text: And now[a], this command is for you, O priests.
translation:
  language: pt
  text: E agora, sacerdotes, este mandamento é para vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «é dirigido a vocês». A expressão hebraica indica que o mandamento tem os sacerdotes como destinatários.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a conjunção quanto o marcador temporal-discursivo que faz a transição da repreensão anterior para a fala direta.
- source_word: אֲלֵיכֶם
  choice: para vocês
  rationale: A preposição אֶל significa literalmente «a/para», e aqui indica de modo idiomático que o mandamento é dirigido especificamente aos sacerdotes.
- source_word: הַמִּצְוָה
  choice: mandamento
  rationale: מִצְוָה designa uma ordem ou injunção; «mandamento» é claro, tradicional sem ser arcaico e adequado ao contexto profético.
- source_word: הַזֹּאת
  choice: este
  rationale: Traduz diretamente o demonstrativo e concorda naturalmente com «mandamento».
- source_word: הַכֹּהֲנִים
  choice: sacerdotes
  rationale: O substantivo tem função vocativa. A colocação entre vírgulas expressa o chamado direto de maneira natural em português, sem recorrer ao mais solene «ó sacerdotes».
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A ordem «sacerdotes» foi antecipada para marcar inequivocamente o vocativo e evitar que «para vocês, sacerdotes» soe como se «sacerdotes» fosse predicativo.
