base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/013.yaml
  text: I will be a father to him[a], and he will be a son to me. And I will not remove my steadfast love from him[b], as I removed it from the one who was before you.
translation:
  language: pt
  text: Eu serei para ele um pai[a], e ele será para mim um filho. E não retirarei dele o meu amor leal, como o retirei daquele que veio antes de você.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu serei seu pai, e ele será meu filho”.'
    reason: lexical_alternative
  - marker: b
    text: “Aquele que veio antes de você” refere-se a Saul, antecessor de Davi como rei.
    reason: cross_reference
lexical_decisions:
- source_word: אֶהְיֶה לּוֹ לְאָב
  choice: Eu serei para ele um pai
  rationale: Preserva a construção relacional hebraica e seu paralelismo com a cláusula seguinte, em português claro e natural.
- source_word: וְהוּא יִהְיֶה לִּי לְבֵן
  choice: e ele será para mim um filho
  rationale: Mantém a linguagem direta de filiação régia e pactual, bem como a simetria formal do hebraico.
- source_word: חַסְדִּי
  choice: o meu amor leal
  rationale: Comunica tanto amor quanto constância e lealdade no relacionamento de aliança, sem restringir o termo a mera misericórdia.
- source_word: לֹא אָסִיר מֵעִמּוֹ
  choice: Não retirarei dele
  rationale: Expressa diretamente o hifil de סור e permite repetir o mesmo verbo na comparação subsequente.
- source_word: כַּאֲשֶׁר הֲסִירוֹתִי
  choice: como o retirei
  rationale: Reproduz a repetição verbal do hebraico; o pronome retoma naturalmente «o meu amor leal».
- source_word: מֵאֲשֶׁר הָיָה לְפָנֶיךָ
  choice: daquele que veio antes de você
  rationale: Preserva a referência indireta do original e esclarece de modo natural que se trata de precedência, não de posição espacial.
theological_decisions:
- issue: Linguagem de pai e filho na aliança davídica
  choice: Conservar «um pai» e «um filho» como linguagem relacional direta.
  alternative: Parafrasear como cuidado paterno e pertencimento filial.
  rationale: O hebraico afirma filiação régia pactual de maneira explícita; a tradução não deve diluir nem explicar além do texto.
- issue: Sentido de חֶסֶד no contexto da aliança
  choice: Traduzir como «amor leal».
  alternative: «misericórdia», «bondade» ou «lealdade à aliança».
  rationale: «Amor leal» conserva conjuntamente a dimensão afetiva e a constância relacional do termo, sem reduzi-lo a uma única nuance.
- issue: Identidade daquele que precedeu Davi
  choice: Manter a referência indireta no texto e identificar Saul apenas em nota.
  alternative: Inserir diretamente o nome «Saul» no versículo.
  rationale: O original não nomeia Saul; preservar essa forma evita transformar uma inferência contextual segura em formulação explícita do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo solene do hebraico sem soar arcaica; «você» comunica com naturalidade o singular dirigido a Davi.
