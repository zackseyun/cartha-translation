  yaml_path: translation/ot/1_chronicles/017/012.yaml
  text: He will build a house for me[a], and I will establish his throne forever.
translation:
  language: pt
  text: Ele construirá uma casa para mim[a], e eu estabelecerei o trono dele para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um templo para mim”. A palavra hebraica significa literalmente “casa” e, neste contexto, refere-se ao santuário que Salomão construiria.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: Ele
  rationale: Pronome independente masculino singular que explicita e enfatiza o sujeito; “Ele” preserva essa referência de modo natural em português.
- source_word: יִבְנֶה
  choice: construirá
  rationale: O imperfeito qal de בנה tem sentido futuro no contexto da promessa; o futuro simples comunica com clareza sua força preditiva.
- source_word: לִּי
  choice: para mim
  rationale: 'A preposição ל com sufixo da primeira pessoa singular indica benefício ou relação: a casa será construída para o próprio Deus.'
- source_word: בָּיִת
  choice: uma casa
  rationale: בַּיִת significa literalmente “casa”. No contexto, refere-se ao santuário que Salomão construiria, mas conservar “casa” mantém a expressão hebraica e os vínculos literários da passagem.
- source_word: וְכֹנַנְתִּי
  choice: e eu estabelecerei
  rationale: A forma verbal de כון expressa tornar firme, seguro ou estável; “estabelecerei” é natural no contexto régio e pactual.
- source_word: אֶת כִּסְאוֹ
  choice: o trono dele
  rationale: O substantivo com sufixo masculino singular significa “seu trono”. “O trono dele” evita uma possível ambiguidade pronominal em português e identifica claramente o referente.
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: A locução hebraica expressa duração permanente; “para sempre” é seu equivalente claro e corrente neste contexto.
theological_decisions:
- issue: Traduzir בָּיִת literalmente como “casa” ou contextualmente como “templo”
  choice: casa
  alternative: templo
  rationale: O hebraico emprega o termo geral “casa”. Mantê-lo preserva a formulação e os vínculos teológicos e literários da aliança davídica, enquanto a nota esclarece a referência contextual ao santuário.
- issue: Alcance de עַד עוֹלָם na promessa davídica
  choice: para sempre
  alternative: perpetuamente
  rationale: A tradução apresenta diretamente a afirmação do texto sem tentar decidir debates teológicos sobre o modo ou o cumprimento final da promessa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O futuro simples mantém o tom de promessa. “O trono dele” foi preferido a “seu trono” para evitar ambiguidade de referência.
