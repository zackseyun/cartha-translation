  text: יְהוָה֙ אֵ֣ין כָּמ֔וֹ/ךָ וְ/אֵ֥ין אֱלֹהִ֖ים זוּלָתֶ֑/ךָ בְּ/כֹ֥ל אֲשֶׁר שָׁמַ֖עְנוּ בְּ/אָזְנֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/020.yaml
  text: O Yahweh[a], there is none like you, and there is no God besides you, in all that we have heard with our own ears.
translation:
  language: pt
  text: Ó Yahweh, não há ninguém como tu, e não há Deus além de ti[a], conforme tudo o que ouvimos com os nossos próprios ouvidos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não há deus, exceto tu”; ou: “não há Deus fora de ti”.'
    reason: Registra alternativas possíveis para אֱלֹהִים זוּלָתֶךָ, preservando tanto a variação de capitalização interpretativa quanto as nuances de “exceto”, “além de” e “fora de”.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico, preservando sua função como nome próprio.
- source_word: אֵין כָּמוֹךָ
  choice: não há ninguém como tu
  rationale: Expressa de modo natural em português a inexistência de qualquer ser comparável a Yahweh.
- source_word: וְאֵין אֱלֹהִים זוּלָתֶךָ
  choice: e não há Deus além de ti
  rationale: Preserva a afirmação direta de exclusividade e traduz זוּלָתֶךָ como “além de ti”, sem enfraquecê-la para mera superioridade.
- source_word: בְּכֹל אֲשֶׁר
  choice: segundo tudo o que
  rationale: Apresenta tudo quanto foi ouvido como base ou testemunho correspondente à confissão feita.
- source_word: שָׁמַעְנוּ
  choice: temos ouvido
  rationale: O pretérito perfeito composto comunica o testemunho acumulado até o momento da oração.
- source_word: בְּאָזְנֵינוּ
  choice: com os nossos próprios ouvidos
  rationale: É uma formulação idiomática que mantém a ênfase concreta do hebraico no que os próprios orantes ouviram.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O hebraico apresenta diretamente o Tetragrama; a transliteração conserva o nome próprio sem substituí-lo por um título.
- issue: Força de וְאֵין אֱלֹהִים זוּלָתֶךָ
  choice: 'afirmação absoluta: “não há Deus além de ti”'
  alternative: afirmação apenas comparativa da superioridade de Yahweh entre outros deuses
  rationale: A construção existencial com זוּלָתֶךָ nega a existência de qualquer outro Deus, em vez de apenas declarar Yahweh superior.
translation_notes:
  register: Português moderno, claro e reverente, com leitura natural no Brasil e compreensão internacional. O vocativo “Ó” e o pronome “tu” mantêm o tom elevado de oração sem recorrer a linguagem arcaica.
