base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/025.yaml
  text: For you[a], my God, have revealed to your servant that you will build him a house[b]; therefore your servant has found courage to pray before you.
translation:
  language: pt
  text: 'Pois tu, meu Deus, revelaste[a] ao teu servo que lhe construirias uma casa[b]; por isso, o teu servo encontrou coragem para orar diante de ti.


    [a] Hebraico, literalmente: “descobriste o ouvido do teu servo”, expressão que significa “revelaste ao teu servo”.


    [b] Ou: “estabelecerias para ele uma dinastia”. Aqui, “casa” pode referir-se a uma família e a uma linhagem real duradoura.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “descobriste o ouvido do teu servo”, expressão que significa “revelaste ao teu servo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “estabelecerias para ele uma dinastia”. Aqui, “casa” pode referir-se a uma família e a uma linhagem real duradoura.'
    reason: alternative_reading
lexical_decisions:
- source_word: גָּלִיתָ אֶת אֹזֶן עַבְדְּךָ
  choice: revelaste ao teu servo
  rationale: A expressão hebraica significa literalmente “descobrir o ouvido” de alguém, mas funciona como um idiomatismo para comunicar ou revelar algo. A tradução verte o sentido com clareza, enquanto a nota preserva a imagem original.
- source_word: לִבְנוֹת לוֹ בָּיִת
  choice: que lhe edificarias uma casa
  rationale: O infinitivo apresenta o conteúdo da revelação. “Edificarias” expressa a promessa a partir da perspectiva da oração de Davi, e “casa” conserva a imagem e sua amplitude sem explicitar demais o sentido dinástico.
- source_word: בָּיִת
  choice: casa
  rationale: Mantém a metáfora hebraica e sua possível dupla referência à família de Davi e à sua linhagem real. A leitura mais explícita, “dinastia”, fica na nota.
- source_word: מָצָא ... לְהִתְפַּלֵּל
  choice: encontrou coragem para orar
  rationale: O uso de “encontrar” seguido do infinitivo indica aqui que o servo adquiriu ousadia ou confiança para orar. Esta formulação é natural em português e comunica o valor idiomático.
- source_word: לְפָנֶיךָ
  choice: diante de ti
  rationale: Expressão portuguesa natural que preserva a ideia relacional de orar na presença de Deus.
- source_word: עַבְדְּךָ
  choice: teu servo
  rationale: No contexto de uma oração régia, o termo é uma autodesignação humilde diante de Deus. “Servo” preserva esse registro melhor do que “escravo”.
theological_decisions:
- issue: Sentido de “casa” na promessa davídica
  choice: Manter “casa” no texto principal, deixando implícito o sentido dinástico
  alternative: Traduzir explicitamente por “dinastia”
  rationale: O hebraico mantém uma imagem de sentido amplo no contexto da promessa a Davi. “Casa” evita resolver indevidamente a tensão entre família, descendência e linhagem real duradoura; a nota esclarece o possível sentido dinástico.
translation_notes:
  register: Português moderno, digno e acessível, com formas de segunda pessoa coerentes (“tu”, “teu”, “ti”). “Edificarias” preserva o tom solene sem tornar o versículo obscuro; “encontrou coragem” comunica naturalmente o idiomatismo hebraico.
