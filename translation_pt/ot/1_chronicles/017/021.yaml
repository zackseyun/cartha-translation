  text: וּ/מִי֙ כְּ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל גּ֥וֹי אֶחָ֖ד בָּ/אָ֑רֶץ אֲשֶׁר֩ הָלַ֨ךְ הָ/אֱלֹהִ֜ים לִ/פְדּ֧וֹת ל֣/וֹ עָ֗ם לָ/שׂ֤וּם לְ/ךָ֙ שֵׁ֚ם גְּדֻלּ֣וֹת וְ/נֹרָא֔וֹת לְ/גָרֵ֗שׁ מִ/פְּנֵ֧י עַמְּ/ךָ֛ אֲשֶׁר פָּדִ֥יתָ מִ/מִּצְרַ֖יִם גּוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/021.yaml
  text: And who is like your people Israel[a], one nation on the earth, whom God went to redeem for himself as a people, to make for yourself a name by great and fearsome deeds, driving out nations from before your people[b], whom you redeemed from Egypt?
translation:
  language: pt
  text: E quem há como o teu povo Israel, uma só nação na terra, a quem Deus foi resgatar para si como povo, para fazer para ti um nome por meio de feitos grandiosos e temíveis[a], expulsando nações de diante do teu povo, que resgataste do Egito?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “coisas grandes e temíveis”.'
    reason: lexical_alternative
  - marker: b
    text: 'A ordem das palavras no hebraico é incomum: literalmente, “expulsar de diante do teu povo, que resgataste do Egito, nações”. Alguns entendem a relação entre as palavras de outra maneira; a passagem paralela em 2 Samuel 7:23 também apresenta dificuldade textual.'
    reason: textual_variant
lexical_decisions:
- source_word: וּמִי כְעַמְּךָ יִשְׂרָאֵל
  choice: E quem há como o teu povo Israel
  rationale: Mantém a pergunta retórica, a comparação explícita e a identificação pactual de Israel como povo de Deus.
- source_word: גּוֹי אֶחָד בָּאָרֶץ
  choice: uma só nação na terra
  rationale: Reproduz אֶחָד sem transformar explicitamente a expressão em 'uma nação única'; no contexto, 'uma só' comunica a singularidade afirmada pela pergunta retórica.
- source_word: אֲשֶׁר הָלַךְ הָאֱלֹהִים
  choice: a quem Deus foi resgatar
  rationale: A construção portuguesa 'foi resgatar' preserva de modo natural a linguagem de movimento e ação deliberada presente em הָלַךְ, sem reduzi-la a um mero auxiliar.
- source_word: לִפְדּוֹת לוֹ עָם
  choice: resgatar para si como povo
  rationale: פדה admite 'resgatar' ou 'redimir'. 'Resgatar' é claro no português atual, e 'como povo' expressa a relação resultante sem acrescentar uma ideia estranha ao contexto.
- source_word: לָשׂוּם לְךָ שֵׁם
  choice: para fazer para ti um nome
  rationale: Preserva o idioma hebraico de estabelecer renome e mantém a mudança para a segunda pessoa, em que a oração se dirige diretamente a Deus.
- source_word: גְּדֻלּוֹת וְנוֹרָאוֹת
  choice: feitos grandiosos e temíveis
  rationale: O substantivo implícito é explicitado como 'feitos'. 'Temíveis' conserva a combinação de assombro e temor de נוראות, sem enfraquecê-la para mera admiração.
- source_word: לְגָרֵשׁ מִפְּנֵי עַמְּךָ ... גּוֹיִם
  choice: expulsando nações de diante do teu povo
  rationale: Toma גּוֹיִם, deslocado para o fim da oração hebraica, como objeto de לְגָרֵשׁ. 'De diante de' mantém a imagem espacial do hebraico e a ação de desapossamento.
- source_word: אֲשֶׁר פָּדִיתָ מִמִּצְרַיִם
  choice: que resgataste do Egito
  rationale: Mantém a referência coletiva a Israel e a transição explícita para a segunda pessoa na fala dirigida a Deus.
theological_decisions:
- issue: A ação divina de estabelecer o próprio renome em לָשׂוּם לְךָ שֵׁם
  choice: para fazer para ti um nome
  alternative: para tornar famoso o teu nome
  rationale: A formulação escolhida conserva a afirmação explícita de que os atos redentores de Deus estabelecem seu renome, sem suavizá-la nem desenvolvê-la por meio de categorias teológicas posteriores.
- issue: A força de נוֹרָאוֹת
  choice: temíveis
  alternative: assombrosos
  rationale: '''Temíveis'' preserva a tensão entre assombro e temor diante dos atos divinos; ''assombrosos'' poderia salientar apenas a admiração.'
- issue: Alternância entre a terceira e a segunda pessoa para Deus
  choice: manter 'Deus foi' e depois 'para ti... resgataste'
  alternative: uniformizar tudo na segunda pessoa
  rationale: A alternância está no texto hebraico e faz parte da forma da oração. Uniformizá-la eliminaria uma tensão genuína do discurso.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Mantiveram-se o tratamento por 'tu', coerente com as formas verbais 'resgataste', a imagem de Deus que 'foi resgatar' e a alternância de pessoa do original. As notas [a] e [b] aparecem no texto nos pontos correspondentes.
