language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ֠/יֵֽאָמֵן וְ/יִגְדַּ֨ל שִׁמְ/ךָ֤ עַד עוֹלָם֙ לֵ/אמֹ֔ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֱלֹהִ֖ים לְ/יִשְׂרָאֵ֑ל וּ/בֵית דָּוִ֥יד עַבְדְּ/ךָ֖ נָכ֥וֹן לְ/פָנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/024.yaml
  text: May it be established[a], and may your name be magnified forever, saying, ‘Yahweh of hosts, the God of Israel[b], is God to Israel,’ and may the house of David your servant be established before you.
translation:
  language: pt
  text: 'Que isso seja confirmado, e que o teu nome seja engrandecido para sempre, para que se diga: “Yahweh dos Exércitos, o Deus de Israel, é Deus para Israel”[a]. E que a casa[b] de Davi, teu servo, seja estabelecida diante de ti.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “é o Deus de Israel”. Mais literalmente, o hebraico diz: “é Deus para Israel”.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “casa” significa a casa real, isto é, a dinastia de Davi.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֵאָמֵן
  choice: Que isso seja confirmado
  rationale: O nifal com força optativa expressa a oração para que a promessa anterior seja confirmada e permaneça firme; o pronome “isso” torna explícito em português o referente implícito.
- source_word: וְיִגְדַּל שִׁמְךָ
  choice: e que o teu nome seja engrandecido
  rationale: Conserva a força optativa e o sentido honorífico de גדל, mantendo também o importante idioma hebraico “teu nome”.
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: Equivalente português natural para a duração contínua expressa pelo idioma hebraico.
- source_word: לֵאמֹר
  choice: para que se diga
  rationale: Introduz a aclamação resultante de modo natural em português e preserva a relação com os pedidos anteriores.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino e traduz צְבָאוֹת pelo título português tradicional e inteligível, sem restringi-lo apenas a exércitos humanos.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reproduz diretamente a construção hebraica que identifica Yahweh em sua relação com Israel.
- source_word: אֱלֹהִים לְיִשְׂרָאֵל
  choice: é Deus para Israel
  rationale: Preserva a preposição ל e sua nuance relacional ou benéfica, sem reduzi-la silenciosamente a uma construção possessiva.
- source_word: וּבֵית דָּוִיד עַבְדְּךָ
  choice: E que a casa de Davi, teu servo
  rationale: Retém a imagem hebraica de “casa”; neste contexto, ela designa a linhagem real ou dinastia de Davi, esclarecida em nota.
- source_word: נָכוֹן לְפָנֶיךָ
  choice: seja estabelecida diante de ti
  rationale: Expressa a condição firme e duradoura da casa davídica na presença e sob o olhar de Deus.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; a transliteração preserva o nome próprio sem substituí-lo por um título.
- issue: Força dos verbos imperfeitos no contexto da oração
  choice: Pedidos optativos introduzidos por “Que”
  alternative: 'Declarações futuras: “será confirmado”, “será engrandecido”'
  rationale: Davi responde à promessa divina em oração; o contexto favorece desejos ou petições, embora as formas também possam, isoladamente, admitir valor futuro.
- issue: Sentido de אֱלֹהִים לְיִשְׂרָאֵל
  choice: é Deus para Israel
  alternative: é o Deus de Israel
  rationale: A formulação escolhida conserva a preposição hebraica e sua tensão relacional, evitando transformá-la sem indicação numa expressão puramente possessiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “teu/ti” de forma coerente com o discurso direto a Deus, conserva o nome Yahweh e mantém a expressão menos comum “Deus para Israel” para refletir a construção hebraica, explicando-a em nota.
