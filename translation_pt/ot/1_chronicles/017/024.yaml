  source_fidelity: 'O texto conserva adequadamente a sequência optativa dos três verbos hebraicos: «Que isso seja confirmado», «que o teu nome seja engrandecido» e «que a casa ... seja estabelecida». «Para sempre», «Yahweh dos Exércitos», «o Deus de Israel» e «Deus para Israel» refletem bem os principais elementos do hebraico. A opção «para que se diga» comunica de modo idiomático a introdução לֵאמֹר e é compatível com o contexto oracional.'
  naturalness: Português moderno, claro e de registro digno. O emprego coerente de «teu/ti» é apropriado à oração. «Deus para Israel» é menos usual em português, mas a estranheza controlada é justificável por preservar a relação expressa por לְיִשְׂרָאֵל e é esclarecida em nota.
  terminology: '«Yahweh» preserva o Tetragrama conforme a política indicada; «dos Exércitos» é uma tradução estabelecida e compreensível de צְבָאוֹת. A nota de «casa» explica corretamente o sentido dinástico sem substituir a imagem do texto. As âncoras portuguesas estão bem posicionadas: [a] segue a afirmação «Deus para Israel», e [b] segue «casa».'
