base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/027.yaml
  text: And now[a], you have been pleased to bless the house of your servant, that it may be before you forever; for you, O Yahweh, have blessed it[c][b], and it is blessed forever.
translation:
  language: pt
  text: E agora, dignaste-te[a] a abençoar a casa do teu servo, para que ela permaneça para sempre diante de ti; pois tu, ó Yahweh, a abençoaste, e ela permanece abençoada para sempre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “te dispuseste a abençoar” ou “consentiste em abençoar”. “Casa” refere-se aqui principalmente à família e à dinastia do servo de Deus, não apenas à sua moradia.'
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: 'Ou: “e que ela seja abençoada para sempre”. Embora alguns entendam o hebraico como expressão de um desejo, a forma é mais naturalmente lida como declaração de uma bênção duradoura.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a conjunção hebraica quanto a transição temporal do discurso.
- source_word: הוֹאַלְתָּ
  choice: dignaste-te
  rationale: Expressa a disposição graciosa ou o consentimento divino no contexto de oração. A nota registra alternativas semanticamente possíveis em linguagem mais corrente.
- source_word: לְבָרֵךְ
  choice: a abençoar
  rationale: Reproduz o infinitivo que complementa הוֹאַלְתָּ de maneira natural em português.
- source_word: בֵּית עַבְדְּךָ
  choice: a casa do teu servo
  rationale: Mantém a amplitude de בַּיִת, que neste contexto se refere sobretudo à família e dinastia de Davi, sem substituir essa imagem no texto principal.
- source_word: לִהְיוֹת לְעוֹלָם לְפָנֶיךָ
  choice: para que permaneça para sempre diante de ti
  rationale: Comunica o resultado pretendido e torna natural em português a ideia de existência duradoura diante de Deus, sem reduzir a frase apenas a duração temporal.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente o fundamento da afirmação anterior.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de o substituir por um título.
- source_word: בֵּרַכְתָּ
  choice: a abençoaste
  rationale: O perfeito hebraico indica a ação divina já realizada, da qual decorre a condição duradoura expressa no fim do versículo.
- source_word: וּמְבֹרָךְ לְעוֹלָם
  choice: e ela será bendita para sempre
  rationale: A construção participial passiva descreve um estado resultante e duradouro. O futuro português transmite naturalmente que, por ter sido abençoada por Deus, a casa continuará bendita para sempre, sem impor um desejo optativo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O hebraico traz o nome próprio divino; sua transliteração preserva essa distinção sem o substituir por um título.
- issue: Sentido de וּמְבֹרָךְ לְעוֹלָם
  choice: 'declaração resultativa e duradoura: “ela será bendita para sempre”'
  alternative: 'pedido ou desejo: “que ela seja bendita para sempre”'
  rationale: O texto usa um particípio passivo, não um imperativo nem uma forma explicitamente volitiva. A leitura declarativa preserva melhor a gramática, embora a alternativa optativa seja possível e por isso conste em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa coerentes com o discurso direto a Deus. “Dignaste-te” conserva o tom reverente e a ideia de consentimento gracioso; as alternativas mais correntes aparecem em nota. “Casa” mantém a imagem dinástica central do contexto.
