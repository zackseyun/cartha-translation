source:
  edition: WLC
  text: בְּ/כֹ֥ל אֲשֶֽׁר הִתְהַלַּכְתִּי֮ בְּ/כָל יִשְׂרָאֵל֒ הֲ/דָבָ֣ר דִּבַּ֗רְתִּי אֶת אַחַד֙ שֹׁפְטֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר צִוִּ֛יתִי לִ/רְע֥וֹת אֶת עַמִּ֖/י לֵ/אמֹ֑ר לָ֛/מָּה לֹא בְנִיתֶ֥ם לִ֖/י בֵּ֥ית אֲרָזִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/006.yaml
  text: In all the places where I have walked among all Israel[a], did I ever speak a word to one of the judges of Israel, whom I commanded to shepherd my people, saying, ‘Why have you not built for me a house of cedar?’
translation:
  language: pt
  text: 'Em todos os lugares por onde andei entre todo Israel[a], acaso falei uma só palavra a algum dos juízes de Israel, a quem ordenei que pastoreasse meu povo, dizendo: “Por que vocês não construíram para mim uma casa de cedro?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A passagem paralela em 2 Samuel 7:7 traz “tribos de Israel” (e alguns testemunhos refletem “líderes” ou “cetros”), em vez de “juízes de Israel”. O texto hebraico de Crônicas aqui traz “juízes”.
    reason: textual_variant
lexical_decisions:
- source_word: הִתְהַלַּכְתִּי
  choice: eu tenha andado
  rationale: O hitpael de הלך expressa aqui o deslocamento contínuo de Deus entre o povo. “Tenha andado” conserva a metáfora e funciona naturalmente com “por onde quer que”.
- source_word: בְּכָל יִשְׂרָאֵל
  choice: no meio de todo o Israel
  rationale: Com o verbo de movimento, a expressão indica a presença de Deus entre o conjunto do povo, e não apenas extensão geográfica.
- source_word: הֲדָבָר דִּבַּרְתִּי
  choice: acaso disse uma só palavra
  rationale: A partícula interrogativa e o acusativo cognato dão força à negação implícita. A formulação portuguesa preserva o caráter retórico da pergunta.
- source_word: אֶת אַחַד שֹׁפְטֵי יִשְׂרָאֵל
  choice: a algum dos juízes de Israel
  rationale: Com דבר, אֶת introduz aqui a pessoa a quem se fala. “Algum dos juízes” comunica naturalmente, em contexto negativo, o sentido de “um dos juízes”.
- source_word: שֹׁפְטֵי יִשְׂרָאֵל
  choice: juízes de Israel
  rationale: O texto hebraico de Crônicas diz “juízes”; a tradução mantém essa forma em vez de harmonizá-la com a passagem paralela de Samuel.
- source_word: צִוִּיתִי לִרְעוֹת
  choice: ordenei que pastoreasse
  rationale: רעה emprega a imagem pastoral para o governo e o cuidado do povo. “Pastoreasse” preserva essa metáfora.
- source_word: עַמִּי
  choice: o meu povo
  rationale: Mantém diretamente a expressão relacional e pactual do hebraico.
- source_word: לָמָּה לֹא בְנִיתֶם לִי
  choice: Por que vocês não construíram para mim
  rationale: O verbo hebraico está no plural; “vocês” torna esse número explícito e preserva a mudança do destinatário singular para a pergunta no plural.
- source_word: בֵּית אֲרָזִים
  choice: uma casa de cedro
  rationale: A expressão designa uma casa feita ou revestida de madeira de cedro. A tradução é clara e mantém o tom digno do original.
theological_decisions:
- issue: “Juízes” em Crônicas em contraste com “tribos” na passagem paralela de 2 Samuel 7:7
  choice: Manter “juízes de Israel” no texto principal
  alternative: Harmonizar com “tribos de Israel” ou traduzir de modo genérico como “líderes de Israel”
  rationale: A primazia do texto hebraico de Crônicas exige traduzir שֹׁפְטֵי como “juízes”. A diferença em relação a Samuel deve ser registrada, não eliminada.
- issue: Mudança do singular em “a quem ordenei” para o plural em “vocês não construíram”
  choice: Preservar a mudança de número do texto hebraico
  alternative: Uniformizar toda a fala no singular para facilitar a leitura
  rationale: O hebraico passa do referente singular אֶת אַחַד e da forma singular implícita em לִרְעוֹת para בְנִיתֶם, segunda pessoa do plural. A tradução não resolve silenciosamente essa tensão gramatical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Por onde quer que” evita uma abertura rígida, enquanto “acaso disse uma só palavra” conserva a força retórica. O plural explícito “vocês” preserva a forma hebraica sem recorrer a uma formulação regional como “vós”.
