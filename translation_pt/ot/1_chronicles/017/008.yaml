base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/008.yaml
  text: And I have been with you wherever you have gone[a], and I have cut off all your enemies from before you[b], and I will make for you a name like the name of the great ones who are on the earth.
translation:
  language: pt
  text: Estive com você por onde quer que você andou e eliminei todos os seus inimigos de diante de você. E farei para você um nome[a] como o nome dos grandes que há na terra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, darei a você renome.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “no país”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶהְיֶה עִמְּךָ
  choice: Estive com você
  rationale: O wayyiqtol de היה retoma a fidelidade passada do SENHOR a Davi. O pretérito perfeito é natural em português e mantém a sequência retrospectiva.
- source_word: בְּכֹל אֲשֶׁר הָלַכְתָּ
  choice: por onde quer que você andou
  rationale: Expressa de modo idiomático a abrangência dos deslocamentos de Davi, preservando o valor passado do hebraico.
- source_word: וָאַכְרִית אֶת כָּל אוֹיְבֶיךָ
  choice: eliminei todos os seus inimigos
  rationale: O hifil de כרת indica fazer desaparecer ou remover. “Eliminei” comunica o sentido com naturalidade; “todos” preserva a abrangência explícita.
- source_word: מִפָּנֶיךָ
  choice: de diante de você
  rationale: Mantém a imagem espacial hebraica dos inimigos removidos da presença ou do caminho de Davi.
- source_word: וְעָשִׂיתִי לְךָ שֵׁם
  choice: farei para você um nome
  rationale: A forma verbal tem força futura na sequência da promessa. A formulação conserva o idioma hebraico de adquirir nome, isto é, renome.
- source_word: כְּשֵׁם הַגְּדוֹלִים
  choice: como o nome dos grandes
  rationale: Preserva a estrutura comparativa e evita acrescentar uma especificação masculina ausente do adjetivo substantivado.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: que há na terra
  rationale: אֶרֶץ admite tanto “terra” em sentido amplo quanto “país/território”; o texto principal conserva a formulação abrangente e a nota registra a alternativa.
theological_decisions:
- issue: Sequência temporal das ações divinas
  choice: As duas primeiras ações são passadas (“Estive”, “eliminei”), seguidas por uma promessa futura (“farei”).
  alternative: Entender todas as orações como passadas ou todas como futuras.
  rationale: A fala recorda a presença e a ação anteriores de Deus em favor de Davi e então avança para a promessa acerca de seu renome.
- issue: Sentido de “nome”
  choice: Manter “nome” no texto, com explicação de que significa renome ou reputação.
  alternative: Traduzir diretamente como “renome” ou “fama”.
  rationale: “Nome” conserva a imagem e a importância conceitual do hebraico sem impedir a compreensão, esclarecida em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com tratamento por “você”. A tradução mantém a progressão do passado para o futuro e conserva em “nome” a imagem central do hebraico. Todos os marcadores de nota aparecem no texto.
