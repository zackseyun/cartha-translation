base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/022.yaml
  text: And you made your people Israel your people forever[a], and you, O Yahweh, became their God.
translation:
  language: pt
  text: E fizeste de Israel, teu povo, o teu povo para sempre; e tu, Yahweh, te tornaste[a] o Deus deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foste o Deus deles”. O hebraico também admite uma tradução mais estativa, mas o texto principal reflete, no contexto, o estabelecimento da relação de aliança.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: fizeste
  rationale: 'Embora נתן signifique literalmente “dar”, a construção com לְךָ לְעָם tem força constitutiva: Deus estabeleceu Israel como seu povo. “Fizeste de” comunica isso naturalmente em português.'
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: Israel, teu povo
  rationale: Preserva a aposição e identifica Israel como povo de Deus, com ordem natural em português.
- source_word: לְךָ לְעָם
  choice: o teu povo
  rationale: Na construção “fizeste de Israel... o teu povo”, os dois elementos introduzidos por ל são representados de modo idiomático, mantendo a ideia de pertencimento e condição estabelecida.
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: Expressa de forma clara e corrente a duração permanente indicada pela locução hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: הָיִיתָ לָהֶם לֵאלֹהִים
  choice: te tornaste o Deus deles
  rationale: Reflete o perfeito de היה e a força narrativa da fórmula da aliança, descrevendo o estabelecimento da relação, não uma mudança na natureza divina.
theological_decisions:
- issue: Tradução da fórmula da aliança היה + ל + אלהים
  choice: te tornaste o Deus deles
  alternative: foste o Deus deles
  rationale: “Te tornaste” preserva a força relacional e constitutiva no contexto da aliança, sem sugerir mudança ontológica em Deus. A nota registra a leitura mais estativa permitida pelo hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A forma verbal “fizeste” mantém solenidade bíblica sem arcaísmo excessivo; “teu” harmoniza com a segunda pessoa singular do hebraico.
