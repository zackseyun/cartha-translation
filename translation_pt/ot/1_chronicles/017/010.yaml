id: 1CH.17.10
reference: 1 Chronicles 17:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/לְ/מִ/יָּמִ֗ים אֲשֶׁ֨ר צִוִּ֤יתִי שֹֽׁפְטִים֙ עַל עַמִּ֣/י יִשְׂרָאֵ֔ל וְ/הִכְנַ֖עְתִּי אֶת כָּל אוֹיְבֶ֑י/ךָ וָ/אַגִּ֣ד לָ֔/ךְ וּ/בַ֖יִת יִֽבְנֶה לְּ/ךָ֥ יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/010.yaml
  text: from the days when I appointed judges over my people Israel. And I will subdue all your enemies. Moreover[a], I tell you that Yahweh will build you a house.
translation:
  language: pt
  text: desde os dias em que designei juízes sobre o meu povo Israel. Subjugarei todos os seus inimigos. Além disso, declaro a você que Yahweh construirá uma casa para você.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, estabelecerá para você uma casa real, ou dinastia.
    reason: Esclarece o sentido dinástico contextual de 'casa' sem eliminar do texto principal o jogo de palavras hebraico.
lexical_decisions:
- source_word: וּלְמִיָּמִים
  choice: desde os dias
  rationale: Expressa naturalmente o ponto inicial temporal indicado pela combinação das preposições, preservando a ligação com o contexto anterior.
- source_word: אֲשֶׁר צִוִּיתִי שֹׁפְטִים
  choice: em que designei juízes
  rationale: Neste contexto histórico, צוה se refere ao estabelecimento ou comissionamento dos juízes, não apenas a lhes dar uma ordem.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: sobre o meu povo Israel
  rationale: A preposição assinala autoridade governante, enquanto a expressão possessiva preserva a importância pactual de 'meu povo'.
- source_word: וְהִכְנַעְתִּי
  choice: Subjugarei
  rationale: O perfeito com waw integra a sequência de promessa e tem força futura; 'subjugar' combina naturalmente com inimigos.
- source_word: אֶת כָּל אוֹיְבֶיךָ
  choice: todos os seus inimigos
  rationale: Preserva de modo idiomático a totalidade expressa por כָּל.
- source_word: וָאַגִּד לָךְ
  choice: Além disso, declaro a você
  rationale: נגד introduz uma declaração divina solene; o presente performativo e o conector explicitam o avanço do discurso sem alterar seu conteúdo.
- source_word: וּבַיִת יִבְנֶה לְּךָ יְהוָה
  choice: Yahweh construirá uma casa para você
  rationale: Mantém 'casa' para preservar o jogo de sentidos entre templo e casa real/dinastia, com uma construção natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Sentido de 'casa' na cláusula final
  choice: Manter 'casa' no texto principal, deixando o sentido dinástico ser indicado pelo contexto e pela nota.
  alternative: Yahweh estabelecerá uma dinastia para você.
  rationale: O hebraico emprega בַּיִת intencionalmente no jogo literário entre a casa que Davi desejava construir para Deus e a casa real que Deus promete construir para Davi. Explicitar apenas 'dinastia' eliminaria essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Designei', 'subjugarei' e 'declaro' mantêm solenidade sem arcaísmo. O pronome 'você' evita ambiguidade regional de concordância; o nome Yahweh é preservado.
source_grounding:
  english_pob_role: consult_only
