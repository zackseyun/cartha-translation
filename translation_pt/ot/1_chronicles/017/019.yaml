base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/019.yaml
  text: O Yahweh[a], for the sake of your servant and according to your heart, you have done all this greatness[b], to make known all these great things.
translation:
  language: pt
  text: Ó Yahweh, por causa do teu servo e segundo o teu coração[a], fizeste toda esta grandeza[b], para dar a conhecer todas as grandes coisas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “segundo a tua vontade”. Hebraico: “segundo o teu coração”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico passa do singular, “toda esta grandeza”, para o plural, “todas as grandes coisas”. O singular provavelmente resume o conjunto, e o plural aponta para suas diversas manifestações.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH, distinguindo-o de títulos como “Senhor”.
- source_word: בַּעֲבוּר עַבְדְּךָ
  choice: por causa do teu servo
  rationale: Expressa que a ação divina ocorreu em consideração ao seu servo, sem acrescentar ao texto a ideia específica de mérito.
- source_word: וּכְלִבְּךָ
  choice: e segundo o teu coração
  rationale: Preserva a metáfora hebraica do coração como sede da vontade, intenção e desejo.
- source_word: עָשִׂיתָ
  choice: fizeste
  rationale: O perfeito hebraico descreve a ação realizada; o pretérito perfeito é direto e natural em português.
- source_word: כָּל הַגְּדוּלָּה הַזֹּאת
  choice: toda esta grandeza
  rationale: Mantém o substantivo abstrato no singular, que resume coletivamente a grandiosidade da ação de Deus.
- source_word: לְהֹדִיעַ
  choice: para dar a conhecer
  rationale: 'Reproduz o sentido causativo do infinitivo hifil: fazer com que algo seja conhecido.'
- source_word: כָּל הַגְּדֻלּוֹת
  choice: todas estas grandes coisas
  rationale: Mantém o plural do hebraico e sua relação lexical com a “grandeza” mencionada antes.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: Mantém o nome próprio no texto e evita substituí-lo silenciosamente por um título.
- issue: Linguagem antropomórfica sobre o coração de Deus
  choice: segundo o teu coração
  alternative: segundo a tua vontade
  rationale: Preserva a imagem do original e sua amplitude sem reduzi-la apenas ao conceito de vontade.
translation_notes:
  register: Português moderno, claro e digno, com formas de segunda pessoa singular coerentes com o contexto de oração. A ordem e a alternância entre o singular abstrato e o plural concreto do hebraico foram preservadas.
