  text: According to all these words and according to all this vision[b][a], so Nathan spoke to David.
translation:
  language: pt
  text: Segundo todas estas palavras[a] e segundo toda esta visão[b], assim Natã falou a Davi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estes assuntos”; o hebraico דְּבָרִים pode indicar palavras, assuntos ou coisas, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “esta revelação”; o hebraico חָזוֹן se refere a uma visão profética ou comunicação reveladora.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל ... וּכְכֹל
  choice: De acordo com todas ... e com toda
  rationale: A preposição כְּ com כֹּל indica conformidade ou correspondência. A repetição da construção hebraica é preservada de modo natural em português, sem precisar repetir a locução inteira.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: estas palavras
  rationale: דְּבָרִים pode significar palavras, coisas ou assuntos. Como o contexto trata de uma mensagem divina transmitida por Natã, “palavras” expressa melhor seu conteúdo verbal.
- source_word: הֶחָזוֹן הַזֶּה
  choice: esta visão
  rationale: חָזוֹן designa uma visão profética ou revelação. “Visão” é a correspondência mais direta e mantém a forma concreta do termo hebraico.
- source_word: כֵּן
  choice: assim
  rationale: 'כֵּן assinala correspondência: Natã falou em conformidade com as palavras e a visão recebidas. “Assim” preserva essa função de maneira concisa.'
- source_word: דִּבֶּר
  choice: falou
  rationale: דבר é o verbo comum para falar; “falou” mantém o registro narrativo e a distinção em relação a uma fórmula de citação direta.
- source_word: נָתָן אֶל דָּוִיד
  choice: Natã falou a Davi
  rationale: Os nomes seguem a forma portuguesa convencional. אֶל indica o destinatário da fala, adequadamente expresso por “a Davi”.
