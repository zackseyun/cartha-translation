base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/018.yaml
  text: What more can David add before you for honoring your servant? You know your servant.
translation:
  language: pt
  text: O que mais Davi pode acrescentar diante de ti por honrares o teu servo?[a][b] Tu conheces o teu servo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «O que mais Davi pode dizer-te pela honra concedida ao teu servo?» Algumas traduções acrescentam «dizer» para tornar o hebraico mais fluente, mas esse verbo não está explícito no texto.'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica traduzida como «por honrares o teu servo» é difícil e também pode ser entendida como «pela honra do teu servo» ou «para honrar o teu servo».
    reason: alternative_reading
lexical_decisions:
- source_word: מַה
  choice: O que
  rationale: Introduz uma pergunta retórica; «O que mais...?» reproduz naturalmente o idioma hebraico.
- source_word: יוֹסִיף עוֹד
  choice: pode acrescentar ... mais
  rationale: יסף com עוד expressa a ideia de acrescentar algo além do que já foi dito. Não se explicita «dizer» no texto principal, pois o verbo não aparece no hebraico.
- source_word: דָּוִיד
  choice: Davi
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֵלֶיךָ
  choice: diante de ti
  rationale: Embora אֶל possa significar «a/para ti», «diante de ti» comunica de modo natural a fala de Davi na presença de Deus e preserva o tom solene da oração.
- source_word: לְכָבוֹד אֶת עַבְדֶּךָ
  choice: por honrares o teu servo
  rationale: A construção hebraica é condensada e difícil. Esta formulação entende Deus como aquele que honra Davi, de acordo com o contexto, sem ocultar em nota outras análises possíveis.
- source_word: עַבְדֶּךָ
  choice: o teu servo
  rationale: Davi refere-se a si mesmo como servo de Deus; «servo» é a equivalência portuguesa natural neste contexto de oração régia.
- source_word: וְאַתָּה
  choice: Tu
  rationale: A conjunção pode ficar implícita em português; iniciar a oração com «Tu» mantém a ênfase no conhecimento divino.
- source_word: יָדָעְתָּ
  choice: conheces
  rationale: O perfeito hebraico exprime aqui o conhecimento estabelecido que Deus tem de Davi; o presente é idiomático em português.
theological_decisions:
- issue: Sentido da expressão difícil לְכָבוֹד אֶת עַבְדֶּךָ
  choice: 'Deus é entendido como aquele que honra Davi: «por honrares o teu servo».'
  alternative: «pela honra do teu servo» ou «para honrar o teu servo»
  rationale: O contexto apresenta Davi admirado com a honra que Deus lhe concedeu, mas a sintaxe hebraica permanece ambígua. A tradução principal oferece uma leitura contextual plausível, e a nota conserva as alternativas sem impor uma conclusão doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com formas tradicionais de oração («ti», «teu», «Tu»). A redação mantém a concisão e a tensão sintática do hebraico, enquanto as notas registram a elipse verbal e as leituras alternativas da expressão difícil.
