source:
  edition: WLC
  text: וַ/יָּבֹא֙ הַ/מֶּ֣לֶךְ דָּוִ֔יד וַ/יֵּ֖שֶׁב לִ/פְנֵ֣י יְהוָ֑ה וַ/יֹּ֗אמֶר מִֽי אֲנִ֞י יְהוָ֤ה אֱלֹהִים֙ וּ/מִ֣י בֵיתִ֔/י כִּ֥י הֲבִיאֹתַ֖/נִי עַד הֲלֹֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/016.yaml
  text: Then King David went in and sat before Yahweh and said[a], “Who am I, O Yahweh God, and what is my house, that you have brought me this far?”
translation:
  language: pt
  text: 'Então o rei Davi entrou, sentou-se diante de Yahweh e disse: “Quem sou eu, ó Yahweh Deus, e o que é a minha casa[a], para que me tenhas trazido até aqui?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “minha família”, “os da minha casa” ou “minha dinastia”. Em hebraico, “casa” pode designar tanto a família de Davi como, neste contexto, sua linhagem real.
    reason: Preservar a amplitude lexical e a ressonância dinástica de בַּיִת sem restringir o texto principal a apenas uma interpretação.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: entrou
  rationale: בוא pode significar vir, ir ou entrar. No contexto, Davi se dirige a um lugar associado à presença divina; “entrou” expressa naturalmente a ação sem especificar além do texto qual era o local.
- source_word: הַמֶּלֶךְ דָּוִיד
  choice: o rei Davi
  rationale: É a ordem natural do título e do nome em português, preservando o artigo definido hebraico.
- source_word: וַיֵּשֶׁב
  choice: sentou-se
  rationale: Embora ישב também possa significar habitar ou permanecer, a sequência narrativa após “entrou” favorece o sentido concreto de sentar-se.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: “Diante de” preserva de modo natural a ideia espacial e relacional de estar na presença de Deus; o nome próprio יהוה é transliterado como “Yahweh”.
- source_word: יְהוָה אֱלֹהִים
  choice: ó Yahweh Deus
  rationale: A interjeição “ó” deixa clara a força vocativa da expressão; “Yahweh” representa o nome divino e “Deus” traduz אֱלֹהִים como título.
- source_word: מִי אֲנִי
  choice: Quem sou eu
  rationale: Esta é a equivalência portuguesa natural para a pergunta retórica que expressa humildade e assombro.
- source_word: וּמִי בֵיתִי
  choice: e o que é a minha casa
  rationale: O hebraico repete literalmente “quem”, mas, ao se referir à casa, o português idiomático pede “o que”. “Casa” preserva a amplitude da metáfora hebraica.
- source_word: בֵיתִי
  choice: minha casa
  rationale: “Casa” pode abranger família, casa real e linhagem, sentidos relevantes no contexto da promessa dinástica; uma nota explicita essa amplitude.
- source_word: כִּי
  choice: para que
  rationale: Nesta pergunta retórica, כִּי introduz o fundamento do assombro de Davi. “Para que” produz em português uma construção natural sem transformar a frase em afirmação causal.
- source_word: הֲבִיאֹתַנִי
  choice: me tenhas trazido
  rationale: O hifil de בוא tem sentido causativo, expresso por “trazer”. O subjuntivo composto ajusta-se naturalmente à construção portuguesa “Quem sou eu... para que...?” e mantém a ação passada com resultado presente.
- source_word: עַד הֲלֹם
  choice: até aqui
  rationale: A expressão indica a extensão alcançada até o presente ponto, seja na trajetória de Davi, seja em sua posição; “até aqui” mantém essa abertura.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva sua condição de nome pessoal e segue a orientação fornecida, sem substituí-lo por um título.
- issue: Alcance de בֵיתִי no contexto da promessa davídica
  choice: minha casa, com nota explicativa
  alternative: minha família; minha linhagem; minha dinastia
  rationale: O contexto permite uma dimensão familiar e dinástica, mas escolher somente “dinastia” resolveria de forma excessiva a amplitude do hebraico. A tradução mantém a metáfora e a nota apresenta seus sentidos contextuais.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o paralelismo retórico e a humildade da oração de Davi. Usa-se “ó” apenas para marcar claramente o vocativo solene, sem recorrer a sintaxe arcaizante.
