  text: וְ/עַתָּ֣ה יְהוָ֔ה הַ/דָּבָ֗ר אֲשֶׁ֨ר דִּבַּ֤רְתָּ עַֽל עַבְדְּ/ךָ֙ וְ/עַל בֵּית֔/וֹ יֵאָמֵ֖ן עַד עוֹלָ֑ם וַ/עֲשֵׂ֖ה כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/023.yaml
  text: And now[a], Yahweh, let the word that you have spoken concerning your servant and concerning his house be established forever, and do as you have spoken.
translation:
  language: pt
  text: E agora, Yahweh, que a palavra que falaste a respeito do teu servo e da casa dele[a] seja estabelecida para sempre, e faz como falaste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da dinastia dele” ou “da linhagem dele”. Neste contexto da aliança, o hebraico “casa” pode se referir à família, à linhagem ou à dinastia real de Davi.
    reason: Alternativa lexical que explicita o alcance dinástico de בֵּיתוֹ sem retirar do texto principal a imagem hebraica de “casa”.
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a conjunção quanto o advérbio temporal, marcando a transição da reflexão anterior para a petição de Davi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: הַדָּבָר
  choice: a palavra
  rationale: Reflete diretamente o hebraico e mantém a ligação verbal com aquilo que Deus falou, embora no contexto se trate de uma promessa.
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: que falaste
  rationale: Expressa de modo conciso e solene a fala anterior de Deus, cuja validade continua sendo invocada na oração.
- source_word: עַל עַבְדְּךָ וְעַל בֵּיתוֹ
  choice: a respeito do teu servo e da casa dele
  rationale: A locução 'a respeito de' comunica o sentido relacional de עַל neste contexto. 'Casa dele' evita que o leitor atribua a casa a Yahweh e preserva a imagem hebraica de 'casa'.
- source_word: יֵאָמֵן
  choice: seja confirmada
  rationale: O nifal de אמן pede que a palavra seja tornada firme, segura ou estabelecida; 'seja confirmada' é natural em português no contexto de uma promessa divina.
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: É a forma corrente e clara de expressar duração permanente.
- source_word: וַעֲשֵׂה כַּאֲשֶׁר דִּבַּרְתָּ
  choice: e faz como falaste
  rationale: Mantém a petição direta para que Deus aja de acordo com sua palavra e conserva a repetição de 'falar' presente no hebraico.
theological_decisions:
- issue: Sentido de 'casa dele' no contexto da aliança davídica
  choice: Manter 'casa' no texto principal
  alternative: Traduzir como 'dinastia' ou 'linhagem familiar'
  rationale: Neste contexto, 'casa' inclui a família e a linhagem real de Davi, mas o termo hebraico também carrega a imagem central da promessa. Mantê-lo evita restringir silenciosamente seu alcance; a nota esclarece o sentido dinástico possível.
- issue: Força de יֵאָמֵן aplicada à palavra divina
  choice: seja confirmada
  alternative: seja estabelecida; permaneça firme; mostre-se fiel
  rationale: A forma verbal pode indicar que a palavra seja firmada ou confirmada. A tradução escolhida conserva a petição de Davi sem sugerir que a palavra de Deus seja incerta ou que precise provar sua veracidade.
translation_notes:
  register: Português moderno, claro e solene, com formas de segunda pessoa do singular adequadas à oração dirigida a Deus. A construção preserva o paralelismo e a repetição de 'falaste' do hebraico. O marcador [a] foi colocado após 'casa dele', expressão à qual a nota efetivamente se refere.
