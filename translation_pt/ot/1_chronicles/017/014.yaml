  text: וְ/הַֽעֲמַדְתִּ֛י/הוּ בְּ/בֵיתִ֥/י וּ/בְ/מַלְכוּתִ֖/י עַד הָ/עוֹלָ֑ם וְ/כִסְא֕/וֹ יִהְיֶ֥ה נָכ֖וֹן עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/014.yaml
  text: But I will establish him in my house and in my kingdom forever[c][b][a], and his throne will be established forever.
translation:
  language: pt
  text: Mas eu o estabelecerei em minha casa e em meu reino para sempre[c][b][a], e seu trono permanecerá firme para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E eu o colocarei em minha casa e sobre o meu reino para sempre”. A preposição hebraica admite essa compreensão, embora o texto principal preserve o paralelismo e a formulação mais direta.'
    reason: lexical_alternative
  - marker: b
    text: O pronome “o” pode referir-se imediatamente ao descendente real de Davi, especialmente Salomão, e ao mesmo tempo integrar a promessa davídica mais ampla, posteriormente entendida em sentido messiânico.
    reason: alternative_reading
  - marker: c
    text: “Minha casa” pode designar a casa de Deus em sentido pactual amplo; alguns a entendem mais especificamente como o templo ou como a casa real de Deus.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַעֲמַדְתִּיהוּ
  choice: Mas eu o estabelecerei
  rationale: O hifil de עמד expressa fazer alguém permanecer firme ou estabelecê-lo numa posição. “Estabelecerei” comunica naturalmente o sentido régio e pactual; “Mas” explicita o contraste com a advertência anterior.
- source_word: בְּבֵיתִי
  choice: em minha casa
  rationale: Mantém o valor direto da preposição ב e preserva a amplitude de בית, que pode evocar casa, família, templo ou domínio pactual sem limitar o sentido.
- source_word: וּבְמַלְכוּתִי
  choice: e em meu reino
  rationale: Preserva o paralelismo com “em minha casa” e traduz מלכות naturalmente como “reino”, sem tornar explícita uma ideia de governo que a preposição apenas pode sugerir.
- source_word: עַד הָעוֹלָם
  choice: para sempre
  rationale: Expressão portuguesa corrente e digna para a duração permanente indicada por עד + עולם.
- source_word: וְכִסְאוֹ
  choice: e seu trono
  rationale: Conserva o termo régio concreto כסא, importante para o caráter dinástico da promessa.
- source_word: יִהְיֶה נָכוֹן
  choice: permanecerá firme
  rationale: נכון, em posição predicativa, comunica estabilidade e firmeza. “Permanecerá firme” é natural em português e evita a repetição pesada de “estabelecerei/será estabelecido”.
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: Mantém clareza e coerência com a ocorrência anterior da mesma expressão temporal.
theological_decisions:
- issue: Referente do pronome masculino singular em וְהַעֲמַדְתִּיהוּ
  choice: Manter “o” sem identificar o referente no texto principal.
  alternative: Salomão especificamente; a linhagem real davídica coletivamente; ou, em seu cumprimento último, o Messias.
  rationale: O hebraico emprega um pronome masculino singular sem nomear o referente neste versículo. A tradução preserva tanto a referência imediata ao descendente real de Davi quanto a dimensão davídica mais ampla posteriormente entendida de modo messiânico.
- issue: Alcance semântico de “minha casa”
  choice: Traduzir literalmente como “minha casa”.
  alternative: Meu templo; minha família ou casa real; meu domínio pactual.
  rationale: בית comporta sentidos relacionados que o contexto não reduz inequivocamente a apenas um. A formulação literal preserva essa tensão interpretativa.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A ordem dos marcadores segue o texto de consulta fornecido; todos aparecem no texto principal. A tradução mantém a ambiguidade do pronome e de “casa”, sem impor uma identificação denominacional.
