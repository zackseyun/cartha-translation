  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִ֕י כַּ/אֲשֶׁ֛ר יָשַׁ֥ב דָּוִ֖יד בְּ/בֵית֑/וֹ וַ/יֹּ֨אמֶר דָּוִ֜יד אֶל נָתָ֣ן הַ/נָּבִ֗יא הִנֵּ֨ה אָנֹכִ֤י יוֹשֵׁב֙ בְּ/בֵ֣ית הָֽ/אֲרָזִ֔ים וַ/אֲר֥וֹן בְּרִית יְהוָ֖ה תַּ֥חַת יְרִיעֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/001.yaml
  text: It happened[a], when David was living in his house, that David said to Nathan the prophet, “Look, I am living in a house of cedar, but the ark of the covenant of Yahweh is under curtains.”
translation:
  language: pt
  text: 'Aconteceu que, quando Davi morava em sua casa, ele disse ao profeta Natã: “Veja! Eu moro numa casa de cedro, mas a arca da aliança de Yahweh está sob cortinas[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sob cortinas de tenda”. O termo hebraico se refere a grandes peças de tecido, especialmente às usadas numa tenda ou no tabernáculo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Aconteceu que, quando
  rationale: Reproduz a introdução narrativa e a circunstância temporal sem recorrer à fórmula arcaica “e sucedeu que”.
- source_word: יָשַׁב ... יוֹשֵׁב
  choice: morava ... moro
  rationale: Neste contexto residencial, ישׁב significa habitar ou morar. A repetição do verbo no relato e na fala de Davi é preservada.
- source_word: בְּבֵיתוֹ ... בְּבֵית הָאֲרָזִים
  choice: em sua casa ... numa casa de cedro
  rationale: Mantém a repetição de “casa” e o contraste retórico entre a residência de Davi e o abrigo da arca. “Cedro” é entendido como material de construção.
- source_word: נָתָן הַנָּבִיא
  choice: o profeta Natã
  rationale: Forma idiomática em português para o nome acompanhado de seu título, preservando a identificação de Natã como profeta.
- source_word: הִנֵּה
  choice: Veja!
  rationale: Interjeição atual que chama a atenção do interlocutor para a situação observada por Davi, sem o tom arcaico de “Eis”.
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  choice: mas a arca da aliança de Yahweh
  rationale: Embora ו seja formalmente uma conjunção simples, aqui introduz o contraste entre a casa de cedro e o abrigo da arca. A construção “arca da aliança de Yahweh” acompanha de perto a relação entre os substantivos hebraicos.
- source_word: תַּחַת יְרִיעוֹת
  choice: está sob cortinas
  rationale: Traduz de perto a posição indicada por תַּחַת e o sentido básico de יְרִיעוֹת como grandes peças de tecido ou cortinas, deixando em nota a especificação plausível de que sejam cortinas de tenda.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama, nome pessoal do Deus de Israel. A transliteração “Yahweh” o preserva em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade no Brasil e compreensão internacional. A formulação conserva a repetição de “casa” e de “morar”, bem como o contraste central da fala de Davi. O marcador da nota foi colocado junto de “cortinas”, expressão à qual a nota se refere.
