source:
  edition: WLC
  text: וַ/תִּקְטַ֨ן זֹ֤את בְּ/עֵינֶ֨י/ךָ֙ אֱלֹהִ֔ים וַ/תְּדַבֵּ֥ר עַל בֵּֽית עַבְדְּ/ךָ֖ לְ/מֵ/רָח֑וֹק וּ/רְאִיתַ֗/נִי כְּ/ת֧וֹר הָ/אָדָ֛ם הַֽ/מַּעֲלָ֖ה יְהוָ֥ה אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/017.yaml
  text: And this was a small thing in your eyes[a], O God; yet you have spoken concerning your servant’s house for a long time to come, and you have regarded me according to the rank of man on high, O Yahweh God.
translation:
  language: pt
  text: E isso foi pouco aos teus olhos, ó Deus; ainda assim, falaste acerca da casa do teu servo para um futuro distante e me consideraste segundo a posição de um homem exaltado[a], ó Yahweh Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “me mostraste as futuras gerações dos seres humanos”; ou: “me consideraste como um homem de alta posição”. O hebraico desta oração final é difícil e admite várias interpretações.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְטַן זֹאת
  choice: isso foi pouco
  rationale: Preserva a avaliação expressa por קטן e soa natural em português, sem ampliar o sentido para “insignificante”.
- source_word: בְּעֵינֶיךָ
  choice: aos teus olhos
  rationale: Mantém o conhecido idiomatismo hebraico de avaliação, igualmente compreensível em português.
- source_word: אֱלֹהִים
  choice: ó Deus
  rationale: O contexto é de oração e requer sentido vocativo.
- source_word: וַתְּדַבֵּר עַל בֵּית עַבְדְּךָ
  choice: falaste acerca da casa do teu servo
  rationale: Traduz diretamente a ideia de falar a respeito da casa ou dinastia do servo, sem explicitar como “prometeste” a força promissória dada pelo contexto.
- source_word: לְמֵרָחוֹק
  choice: para um futuro distante
  rationale: Expressa o valor temporal de distância, referindo-se ao futuro longínquo da casa de Davi.
- source_word: וּרְאִיתַנִי
  choice: me consideraste
  rationale: ראה aqui vai além da percepção visual e indica a maneira como Deus viu ou tratou Davi.
- source_word: כְּתוֹר
  choice: segundo a posição
  rationale: תור pode indicar ordem, disposição ou condição. “Segundo a posição” conserva a provável nuance de categoria ou posição sem eliminar a obscuridade da frase.
- source_word: הָאָדָם הַמַּעֲלָה
  choice: de um homem exaltado
  rationale: Representa אָדָם no singular e relaciona הַמַּעֲלָה a elevação ou posição elevada, mantendo uma formulação digna e relativamente formal.
- source_word: יְהוָה אֱלֹהִים
  choice: ó Yahweh Deus
  rationale: Conserva o nome divino יהוה e o sentido vocativo da expressão composta.
theological_decisions:
- issue: Sentido da frase obscura וּרְאִיתַנִי כְּתוֹר הָאָדָם הַמַּעֲלָה
  choice: me consideraste segundo a posição de um homem exaltado
  alternative: me mostraste as futuras gerações dos seres humanos; ou me consideraste como um homem de alta posição
  rationale: O texto massorético é estável, mas a sintaxe e o sentido lexical da frase são difíceis. A tradução principal acompanha de perto a possível ideia de posição elevada, enquanto a nota preserva leituras importantes sem resolver silenciosamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa singular coerentes com a oração de Davi. A construção da oração final permanece deliberadamente formal por refletir a dificuldade real do hebraico.
