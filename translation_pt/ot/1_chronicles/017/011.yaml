source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּֽי מָלְא֤וּ יָמֶ֨י/ךָ֙ לָ/לֶ֣כֶת עִם אֲבֹתֶ֔י/ךָ וַ/הֲקִֽימוֹתִ֤י אֶֽת זַרְעֲ/ךָ֙ אַחֲרֶ֔י/ךָ אֲשֶׁ֥ר יִהְיֶ֖ה מִ/בָּנֶ֑י/ךָ וַ/הֲכִינוֹתִ֖י אֶת מַלְכוּתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/011.yaml
  text: And it shall be[a], when your days are fulfilled to go to be with your fathers, that I will raise up your offspring after you, who shall be one of your sons, and I will establish his kingdom.
translation:
  language: pt
  text: E acontecerá que, quando seus dias se completarem e você for para junto de seus antepassados[a], farei surgir depois de você um descendente seu, que será um dos seus filhos, e estabelecerei o reino dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “ir com seus pais”; expressão hebraica referente à morte e à reunião com os antepassados.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: E acontecerá que
  rationale: Mantém a fórmula hebraica de transição futura e o tom solene, sem recorrer a uma construção arcaica em português.
- source_word: כִּי מָלְאוּ יָמֶיךָ
  choice: quando se completarem os seus dias
  rationale: כִּי tem valor temporal neste contexto, e a expressão preserva a imagem hebraica da conclusão do tempo de vida.
- source_word: לָלֶכֶת עִם אֲבֹתֶיךָ
  choice: e você for para junto de seus pais
  rationale: Expressa em português natural o infinitivo hebraico e conserva a formulação própria de Crônicas, que fala em ir para junto dos pais, isto é, morrer e reunir-se aos antepassados.
- source_word: וַהֲקִימוֹתִי
  choice: levantarei
  rationale: O hifil de קום indica fazer surgir um sucessor. “Levantarei” mantém essa imagem e evita confundi-la com הכין, traduzido depois por “firmarei”.
- source_word: זַרְעֲךָ
  choice: a sua descendência
  rationale: “Descendência” comunica naturalmente o sentido dinástico de זרע e preserva sua flexibilidade entre valor coletivo e referência singular definida pelo contexto.
- source_word: אַחֲרֶיךָ
  choice: depois de você
  rationale: Reproduz de modo direto a sucessão temporal e dinástica indicada pelo hebraico.
- source_word: אֲשֶׁר יִהְיֶה מִבָּנֶיךָ
  choice: que será um dos seus filhos
  rationale: 'Torna explícito e natural o sentido partitivo de מִן: o descendente prometido virá dentre os próprios filhos de Davi.'
- source_word: וַהֲכִינוֹתִי
  choice: firmarei
  rationale: הכין aqui significa tornar seguro, estável ou estabelecido. “Firmarei” preserva essa nuance e distingue o verbo do anterior “levantarei”.
- source_word: מַלְכוּתוֹ
  choice: o reino dele
  rationale: “Reino” abrange adequadamente a realidade dinástica e política; “dele” oferece clareza referencial e leitura natural no português contemporâneo.
theological_decisions:
- issue: Promessa dinástica e possível ressonância messiânica
  choice: Traduzir o sentido histórico imediato de um sucessor davídico, sem inserir no texto um título messiânico explícito.
  alternative: Explicitar no texto principal uma interpretação diretamente messiânica.
  rationale: O versículo fala diretamente de um descendente dentre os filhos de Davi e do estabelecimento do reino dele. A relevância messiânica do pacto davídico pode emergir do contexto canônico, mas não deve ser acrescentada à formulação deste versículo.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com legibilidade brasileira. A coordenação “e você for” torna natural a relação com o infinitivo hebraico, enquanto “pais” preserva a imagem original; a nota esclarece o idioma cultural. Evitaram-se tanto arcaísmos como uma explicitação teológica além do texto.
