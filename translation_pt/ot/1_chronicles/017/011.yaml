review_pass:
  verdict: revise
  source_fidelity: 'O sentido central está bem preservado: a fórmula temporal, a morte de Davi expressa pelo idiomatismo, a sucessão por um filho e o estabelecimento do reino. Contudo, «a sua descendência, que será um dos seus filhos» torna uma referência pessoal específica menos natural em português e pode soar semanticamente desconexa, pois «descendência» é normalmente coletiva.'
  naturalness: «Quando se completarem os seus dias e você for para junto de seus pais» é compreensível, mas a construção pode ser melhor integrada e «pais» tende a ser entendido como os progenitores imediatos. «Antepassados» comunica com mais clareza o referente idiomático no português atual, enquanto a nota conserva a formulação literal.
  terminology: «Farei surgir um descendente seu» representa bem o hifil de קום no contexto sucessório e fornece um antecedente pessoal natural para «que será um dos seus filhos». «Estabelecerei o reino dele» é uma formulação clara e idiomática para הכין e mantém a distinção em relação ao verbo anterior.
  issues:
  - severity: medium
    issue: Referente pessoal expresso de modo pouco natural
    rationale: «A sua descendência, que será um dos seus filhos» é possível, mas «descendência» costuma designar uma linhagem ou coletividade; neste contexto o hebraico aponta para um sucessor individual dentre os filhos de Davi. «Um descendente seu» preserva o conteúdo e melhora a clareza.
  - severity: low
    issue: «Pais» pode sugerir progenitores imediatos
    rationale: Embora reflita formalmente אֲבֹתֶיךָ, o idiomatismo se refere aos antepassados. Empregar «antepassados» no texto e registrar o literal na nota evita uma leitura indevida sem eliminar a informação cultural.
  revised_text: E acontecerá que, quando seus dias se completarem e você for para junto de seus antepassados[a], farei surgir depois de você um descendente seu, que será um dos seus filhos, e estabelecerei o reino dele.
