revisions:
- from: E acontecerá que, quando se completarem os seus dias e você for para junto de seus pais[a], levantarei depois de você a sua descendência, que será um dos seus filhos, e firmarei o reino dele.
  to: E acontecerá que, quando seus dias se completarem e você for para junto de seus antepassados[a], farei surgir depois de você um descendente seu, que será um dos seus filhos, e estabelecerei o reino dele.
  rationale: A revisão torna explícito, em português natural, que o prometido é um sucessor individual dentre os filhos de Davi, sem acrescentar interpretação messiânica. Também esclarece no texto o sentido de «pais» no idiomatismo hebraico, preservando a redação literal na nota.
