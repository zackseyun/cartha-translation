  text: לֵ֤ךְ וְ/אָמַרְתָּ֙ אֶל דָּוִ֣יד עַבְדִּ֔/י כֹּ֖ה אָמַ֣ר יְהוָ֑ה לֹ֥א אַתָּ֛ה תִּבְנֶה לִּ֥/י הַ/בַּ֖יִת לָ/שָֽׁבֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/004.yaml
  text: 'Go and say to David my servant[b][a], ‘Thus says Yahweh: You shall not build for me the house to dwell in.’'
translation:
  language: pt
  text: 'Vá e diga a Davi, meu servo: “Assim diz Yahweh: Não é você quem construirá para mim a casa onde habitarei.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ וְאָמַרְתָּ
  choice: Vá e diga
  rationale: A sequência de ordem é vertida de modo direto e natural, preservando os dois verbos do hebraico.
- source_word: דָּוִיד עַבְדִּי
  choice: Davi, meu servo
  rationale: “Servo” expressa adequadamente a condição de Davi como agente de Yahweh no contexto régio e pactual, sem sugerir indevidamente apenas escravidão.
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Preserva a fórmula profética solene e representa o nome divino por Yahweh.
- source_word: לֹא אַתָּה תִּבְנֶה
  choice: Não é você quem construirá
  rationale: 'A construção mantém a ênfase marcada pelo pronome אַתָּה: o foco recai sobre a identidade de quem não edificará, e não apenas sobre uma proibição simples.'
- source_word: לִּי הַבַּיִת
  choice: para mim a casa
  rationale: Mantém o dativo de interesse e traduz literalmente “a casa”, sem substituir no texto principal por “templo”.
- source_word: לָשָׁבֶת
  choice: onde habitarei
  rationale: Expressa em português natural a finalidade da casa como lugar da habitação divina; o sujeito divino é recuperado do contexto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o tetragrama; “Yahweh” preserva o nome pactual em vez de substituí-lo por um título.
- issue: Sentido de הַבַּיִת
  choice: a casa
  alternative: o templo
  rationale: Embora o referente contextual seja o templo, “casa” conserva a formulação e a ressonância metafórica do hebraico.
- issue: Força de לֹא אַתָּה תִּבְנֶה
  choice: Não é você quem construirá
  alternative: Você não construirá; Você não deve construir
  rationale: O pronome expresso e anteposto recebe destaque contrastivo; a tradução conserva esse foco sem reduzir a frase a mera proibição nem resolver além do texto a relação entre previsão e autorização.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem direta e a fórmula profética preservam a solenidade sem arcaísmo. Não há marcadores de nota porque nenhuma nota é necessária para esta redação.
