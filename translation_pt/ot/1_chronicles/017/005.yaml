  text: כִּ֣י לֹ֤א יָשַׁ֨בְתִּי֙ בְּ/בַ֔יִת מִן הַ/יּ֗וֹם אֲשֶׁ֤ר הֶעֱלֵ֨יתִי֙ אֶת יִשְׂרָאֵ֔ל עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וָֽ/אֶהְיֶ֛ה מֵ/אֹ֥הֶל אֶל אֹ֖הֶל וּ/מִ/מִּשְׁכָּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/005.yaml
  text: For I have not lived in a house from the day that I brought up Israel to this day[a], but I have gone from tent to tent and from dwelling place to dwelling place.
translation:
  language: pt
  text: Pois não habitei numa casa desde o dia em que fiz Israel subir até o dia de hoje, mas fui de tenda em tenda e de morada em morada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estive de tenda em tenda e de tabernáculo em tabernáculo”.'
    reason: Preserva uma tradução mais formal de וָאֶהְיֶה e a alternativa técnica para מִשְׁכָּן.
lexical_decisions:
- source_word: יָשַׁבְתִּי
  choice: habitei
  rationale: Com complemento de lugar, o verbo significa residir ou habitar. “Habitei” é natural e digno em português e evita o sentido literal inadequado de “sentei-me”.
- source_word: בְּבַיִת
  choice: numa casa
  rationale: O substantivo indica uma casa ou construção permanente em sentido geral. “Templo” especificaria mais do que o hebraico e anteciparia a terminologia posterior.
- source_word: הֶעֱלֵיתִי אֶת יִשְׂרָאֵל
  choice: fiz Israel subir
  rationale: O hifil de עלה expressa fazer subir ou trazer para cima. A formulação conserva a imagem e a agência divina sem acrescentar “do Egito”, que não aparece neste versículo.
- source_word: וָאֶהְיֶה
  choice: fui
  rationale: A forma significa literalmente “e estive”, mas, acompanhada das expressões “de tenda em tenda”, comunica deslocamento entre lugares. “Fui” torna esse movimento implícito natural em português.
- source_word: מֵאֹהֶל אֶל אֹהֶל
  choice: de tenda em tenda
  rationale: Reproduz de modo conciso a repetição hebraica e a mobilidade entre locais temporários.
- source_word: וּמִמִּשְׁכָּן
  choice: e de morada em morada
  rationale: מִשְׁכָּן pode designar uma morada ou o tabernáculo. A repetição exigida em português torna explícito o paralelismo elíptico, enquanto “morada” evita transformar indevidamente o termo em título técnico.
theological_decisions:
- issue: Terminologia do santuário sem importar retrospectivamente a teologia do templo
  choice: “casa” e “morada” no texto principal
  alternative: “templo” e “tabernáculo”
  rationale: O contraste é entre uma construção permanente e os lugares móveis da presença divina. “Templo” seria específico demais para בַּיִת, enquanto “morada” preserva o alcance lexical de מִשְׁכָּן. A possibilidade tradicional “tabernáculo” fica registrada na nota.
- issue: Referência implícita ao êxodo
  choice: “fiz Israel subir” sem indicar o ponto de partida
  alternative: “fiz Israel subir do Egito”
  rationale: Embora o contexto histórico seja o êxodo, “do Egito” não consta no hebraico deste versículo. A tradução mantém a formulação e a concisão da fonte.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Pelo contrário” marca naturalmente o contraste, sem elevar o registro de modo arcaizante. A nota está posicionada após a expressão a que se refere.
