  text: וַ/יֹּ֤אמֶר נָתָן֙ אֶל דָּוִ֔יד כֹּ֛ל אֲשֶׁ֥ר בִּֽ/לְבָבְ/ךָ֖ עֲשֵׂ֑ה כִּ֥י הָ/אֱלֹהִ֖ים עִמָּֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/002.yaml
  text: And Nathan said to David, “Do all that is in your heart, for God is with you.”
translation:
  language: pt
  text: 'Então Natã disse a Davi: “Faça tudo o que está em seu coração, pois Deus está com você.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente essa sequência em português.
- source_word: נָתָן
  choice: Natã
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: אֶל דָּוִיד
  choice: a Davi
  rationale: A preposição אֶל indica o destinatário da fala; “disse a Davi” é construção natural em português.
- source_word: כֹּל אֲשֶׁר
  choice: tudo o que
  rationale: Preserva a abrangência da expressão hebraica e é idiomático em português moderno.
- source_word: בִּלְבָבְךָ
  choice: está em seu coração
  rationale: לֵבָב pode abranger vontade, intenção e pensamento. “Coração” conserva a imagem antropológica hebraica sem limitar o sentido à mente ou às emoções.
- source_word: עֲשֵׂה
  choice: Faça
  rationale: O imperativo de עשה é direto e abrangente; “Faça” combina naturalmente com “tudo o que está em seu coração”.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão do conselho de Natã, em registro digno e corrente.
- source_word: הָאֱלֹהִים
  choice: Deus
  rationale: Embora o substantivo tenha artigo em hebraico, aqui ele se refere de modo definido ao Deus de Israel; em português, “Deus” é a forma natural, sem acrescentar o nome divino YHWH.
- source_word: עִמָּךְ
  choice: está com você
  rationale: Equivalente português natural da expressão que comunica presença e apoio divinos.
theological_decisions:
- issue: Tradução do título divino הָאֱלֹהִים
  choice: Deus
  alternative: o Deus
  rationale: O texto traz אֱלֹהִים, não YHWH. “Deus” reproduz naturalmente a referência definida em português; “o Deus” seria marcado e pouco idiomático neste contexto.
- issue: Alcance de “coração” em בִּלְבָבְךָ
  choice: Preservar a imagem “em seu coração”
  alternative: em sua mente / conforme sua intenção
  rationale: A expressão hebraica abrange o interior da pessoa, incluindo vontade, propósito e pensamento. Manter “coração” preserva essa amplitude e evita resolver o sentido em favor de apenas uma faculdade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem e a concisão da fala foram preservadas; “você” evita regionalismo excessivo e mantém naturalidade contemporânea.
