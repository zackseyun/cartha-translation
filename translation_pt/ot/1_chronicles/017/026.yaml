  text: וְ/עַתָּ֣ה יְהוָ֔ה אַתָּה ה֖וּא הָ/אֱלֹהִ֑ים וַ/תְּדַבֵּר֙ עַֽל עַבְדְּ/ךָ֔ הַ/טּוֹבָ֖ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/026.yaml
  text: And now[a], Yahweh, you are God, and you have spoken this good thing concerning your servant.
translation:
  language: pt
  text: E agora, Yahweh, tu és Deus e disseste esta coisa boa a respeito do teu servo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fizeste esta boa promessa a respeito do teu servo”. O hebraico diz literalmente: “disseste esta coisa boa a respeito do teu servo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Mantém tanto a ligação com o contexto anterior quanto a transição temporal e retórica da oração.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, distinguindo-o do título “Senhor”.
- source_word: אַתָּה הוּא הָאֱלֹהִים
  choice: tu és Deus
  rationale: Expressa de modo natural em português a identificação enfática do hebraico; o pronome explícito ajuda a conservar a ênfase.
- source_word: וַתְּדַבֵּר
  choice: falaste
  rationale: Traduz diretamente o verbo “falar” e evita incorporar no texto principal a interpretação contextual “prometeste”.
- source_word: עַל עַבְדְּךָ
  choice: a respeito do teu servo
  rationale: עַל marca aqui o assunto da fala, e “servo” é a autodesignação humilde apropriada ao contexto da oração.
- source_word: הַטּוֹבָה הַזֹּאת
  choice: deste bem
  rationale: O adjetivo substantivado significa literalmente “esta [coisa] boa”. “Deste bem” é conciso e mais natural em português, sem tornar explícita a interpretação “promessa”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: O texto apresenta o tetragrama como nome próprio. A transliteração “Yahweh” preserva essa função e evita substituí-lo por um título.
- issue: Natureza do “bem” anunciado ao servo
  choice: Manter a formulação ampla “deste bem”
  alternative: “desta boa promessa”
  rationale: No contexto, o bem é uma promessa divina, mas o hebraico não emprega aqui um substantivo específico para “promessa”. A tradução principal conserva essa abertura sem negar a referência contextual.
translation_notes:
  register: Português atual, digno e acessível, com tratamento por “tu”, comum no registro bíblico e inteligível internacionalmente. A construção “falaste deste bem” preserva a generalidade do hebraico, enquanto a nota registra a leitura contextual como promessa.
