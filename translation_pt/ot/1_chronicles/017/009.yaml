  text: וְ/שַׂמְתִּ֣י מָ֠קוֹם לְ/עַמִּ֨/י יִשְׂרָאֵ֤ל וּ/נְטַעְתִּ֨י/הוּ֙ וְ/שָׁכַ֣ן תַּחְתָּ֔י/ו וְ/לֹ֥א יִרְגַּ֖ז ע֑וֹד וְ/לֹא יוֹסִ֤יפוּ בְנֵי עַוְלָה֙ לְ/בַלֹּת֔/וֹ כַּ/אֲשֶׁ֖ר בָּ/רִאשׁוֹנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/009.yaml
  text: And I will appoint a place for my people Israel and will plant them[a], and they will dwell in their own place and be disturbed no more. And the sons of wickedness will no longer wear them down, as at the first[b],
translation:
  language: pt
  text: E estabelecerei um lugar para o meu povo Israel e o plantarei[a]. Ele habitará em seu próprio lugar e não será mais perturbado. Os filhos da maldade[b] não voltarão a desgastá-lo, como antigamente[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico trata “meu povo Israel” coletivamente no singular.
    reason: collective_singular
  - marker: b
    text: Ou “os malfeitores”.
    reason: lexical_alternative
  - marker: c
    text: Ou “como no princípio”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי מָקוֹם
  choice: estabelecerei um lugar
  rationale: שׂוּם significa basicamente “pôr” ou “estabelecer”; com מָקוֹם, a expressão indica que Deus destina e firma um lugar para o povo.
- source_word: לְעַמִּי יִשְׂרָאֵל
  choice: para o meu povo Israel
  rationale: Preserva de modo natural a relação possessiva e a linguagem pactual do hebraico.
- source_word: וּנְטַעְתִּיהוּ
  choice: e o plantarei
  rationale: Mantém a metáfora concreta de plantar e o sufixo singular, que retoma coletivamente “meu povo Israel”.
- source_word: וְשָׁכַן תַּחְתָּיו
  choice: Ele habitará em seu próprio lugar
  rationale: O singular concorda com “povo”; a expressão תַּחְתָּיו, literalmente “debaixo dele”, tem aqui valor idiomático de permanecer firmemente no lugar que lhe foi dado.
- source_word: וְלֹא יִרְגַּז עוֹד
  choice: e não será mais perturbado
  rationale: רגז pode denotar tremor, agitação ou perturbação; no contexto de segurança nacional, “ser perturbado” comunica a ideia sem restringi-la indevidamente.
- source_word: בְנֵי עַוְלָה
  choice: os filhos da maldade
  rationale: Conserva o expressivo idioma hebraico, ao mesmo tempo que usa uma formulação inteligível em português.
- source_word: לְבַלֹּתוֹ
  choice: a desgastá-lo
  rationale: בלה neste contexto descreve dano opressivo contínuo que consome ou desgasta; “desgastar” preserva essa imagem.
- source_word: כַּאֲשֶׁר בָּרִאשׁוֹנָה
  choice: como no princípio
  rationale: Reproduz a referência hebraica ao período inicial ou anterior da história de Israel, sem especificar além do texto.
theological_decisions:
- issue: Referência coletiva singular a Israel
  choice: 'Manter o singular em português: “o plantarei”, “ele habitará” e “desgastá-lo”.'
  alternative: 'Empregar plurais referentes aos israelitas: “os plantarei”, “eles habitarão” e “desgastá-los”.'
  rationale: O hebraico trata “meu povo Israel” como uma unidade coletiva por meio de formas singulares. O português permite conservar essa forma com clareza, sem alterar o caráter corporativo da promessa.
- issue: Sentido idiomático de תַּחְתָּיו
  choice: “em seu próprio lugar”
  alternative: “debaixo dele” ou “sob ele”
  rationale: A tradução estritamente espacial seria obscura e poderia sugerir um referente errado. No contexto de plantar e habitar, a expressão comunica permanência segura no lugar concedido por Deus.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A redação conserva a metáfora de plantar, o singular coletivo e o idioma “filhos da maldade”, esclarecendo em notas as principais alternativas lexicais.
