base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/003.yaml
  text: But that night the word of God came to Nathan[a], saying,
translation:
  language: pt
  text: 'Mas, naquela noite, a palavra de Deus veio a Natã[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma palavra vinda de Deus chegou a Natã”.'
    reason: Alternativa lexical e sintática para דְּבַר אֱלֹהִים e וַיְהִי ... אֶל.
lexical_decisions:
- source_word: וַיְהִי
  choice: Mas ... veio
  rationale: A primeira forma faz a narrativa avançar e, à luz do contexto anterior, admite a leve contraposição expressa por “Mas”; a segunda é incorporada naturalmente à fórmula “a palavra de Deus veio”.
- source_word: בַּלַּיְלָה הַהוּא
  choice: naquela noite
  rationale: Expressão temporal natural em português, preservando a força demonstrativa de הַהוּא.
- source_word: דְּבַר אֱלֹהִים
  choice: a palavra de Deus
  rationale: Preserva a construção hebraica e o peso formal da fórmula de revelação profética, sem excluir lexicalmente o sentido de mensagem.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Neste contexto, refere-se em sentido singular ao Deus de Israel.
- source_word: אֶל נָתָן
  choice: a Natã
  rationale: אֶל indica o destinatário; “a Natã” é uma formulação direta e natural em português.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo introduz a fala direta que vem no versículo seguinte; em português moderno, os dois-pontos cumprem essa função com mais naturalidade do que o literal “dizendo”.
theological_decisions:
- issue: Tradução da fórmula revelatória דְּבַר אֱלֹהִים
  choice: a palavra de Deus
  alternative: uma palavra vinda de Deus
  rationale: A opção principal mantém o registro teológico e formal da fórmula profética. A alternativa explicita uma relação de origem também possível, por isso é preservada em nota sem resolver além do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Natã” segue a forma portuguesa estabelecida do nome. Os dois-pontos introduzem com naturalidade a mensagem que começa no versículo seguinte.
