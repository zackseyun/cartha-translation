  text: וְ֠/עַתָּה כֹּֽה תֹאמַ֞ר לְ/עַבְדִּ֣/י לְ/דָוִ֗יד כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת אֲנִ֤י לְקַחְתִּ֨י/ךָ֙ מִן הַ/נָּוֶ֔ה מִֽן אַחֲרֵ֖י הַ/צֹּ֑אן לִ/הְי֣וֹת נָגִ֔יד עַ֖ל עַמִּ֥/י יִשְׂרָאֵֽל־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/007.yaml
  text: 'Now therefore[a], this is what you shall say to my servant David: This is what Yahweh of hosts says: I took you from the pasture, from following the flock[b], to be ruler over my people Israel.'
translation:
  language: pt
  text: 'Agora, pois, você dirá isto ao meu servo Davi: “Assim diz Yahweh dos Exércitos: Eu tirei você das pastagens[a], de detrás do rebanho, para ser líder[b] sobre o meu povo Israel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do aprisco”.
    reason: lexical_alternative
  - marker: b
    text: Ou “governante” ou “príncipe”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora, pois
  rationale: Marca tanto a transição quanto a força conclusiva ou inferencial da fala, em português atual e digno.
- source_word: כֹּה תֹאמַר
  choice: você dirá isto
  rationale: Preserva a força diretiva do futuro hebraico e introduz naturalmente a mensagem que deve ser transmitida.
- source_word: לְעַבְדִּי
  choice: ao meu servo
  rationale: Neste contexto, עֶבֶד funciona como designação honrosa de Davi em serviço a Deus, e não enfatiza sua condição jurídica de escravo.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Conserva a fórmula profética solene e reconhecível, sem exigir uma leitura estritamente passada do perfeito hebraico.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino e traduz צְבָאוֹת de modo conciso, sem limitar necessariamente os exércitos a forças humanas.
- source_word: לְקַחְתִּיךָ
  choice: Eu tirei você
  rationale: Expressa a iniciativa divina de remover Davi de sua antiga ocupação para lhe dar outra função; é mais idiomático aqui do que o literalismo 'peguei você'.
- source_word: מִן הַנָּוֶה
  choice: das pastagens
  rationale: O contexto pastoril favorece o sentido de lugar de pastoreio; o plural soa natural em português e não elimina a alternativa 'aprisco'.
- source_word: מִן אַחֲרֵי הַצֹּאן
  choice: de detrás do rebanho
  rationale: Preserva de perto a imagem hebraica de Davi seguindo o rebanho, em vez de substituí-la pela explicação 'enquanto cuidava das ovelhas'.
- source_word: לִהְיוֹת נָגִיד
  choice: para ser líder
  rationale: Comunica a função de direção e governo sem impor o título técnico 'rei'; a nota registra outras possibilidades lexicais.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: sobre o meu povo Israel
  rationale: Preserva a autoridade exercida sobre o povo, a relação de pertencimento a Deus e sua identificação como Israel.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. A transliteração 'Yahweh' preserva o nome pactual sem substituí-lo por um título.
- issue: Sentido do título עַבְדִּי aplicado a Davi
  choice: meu servo Davi
  alternative: meu escravo Davi
  rationale: A designação ressalta aqui o serviço e a relação de Davi com Deus como escolhido para governar; 'escravo' salientaria uma dimensão jurídica que não domina o contexto.
- issue: Alcance do título נָגִיד
  choice: líder
  alternative: governante; príncipe
  rationale: O termo indica alguém designado para exercer liderança sobre Israel. 'Líder' evita antecipar ou impor o título específico de rei, enquanto a nota mantém abertas as nuances de governo e posição principesca.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Mantém a solenidade da fórmula profética, usa 'você' por naturalidade contemporânea e conserva a imagem pastoril do hebraico. Os marcadores foram posicionados junto às palavras às quais suas alternativas se referem.
