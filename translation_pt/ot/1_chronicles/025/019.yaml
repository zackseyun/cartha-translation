  text: הַ/שְּׁנֵ֤ים עָשָׂר֙ לַ/חֲשַׁבְיָ֔ה בָּנָ֥י/ו וְ/אֶחָ֖י/ו שְׁנֵ֥ים עָשָֽׂר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/019.yaml
  text: the twelfth to Hashabiah[a], his sons and his brothers, twelve.
translation:
  language: pt
  text: 'o décimo segundo, para Hasabias[a], seus filhos e seus irmãos: doze ao todo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, «os doze». O contexto favorece o sentido ordinal, «o décimo segundo», pois o capítulo enumera os sorteios em sequência.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁנֵים עָשָׂר
  choice: o décimo segundo
  rationale: Embora a forma hebraica seja cardinal, a sequência dos sorteios exige aqui valor ordinal. A tradução natural em português é «o décimo segundo».
- source_word: לַחֲשַׁבְיָה
  choice: para Hasabias
  rationale: O ל prefixado indica a atribuição do sorteio a Hasabias; «para» expressa essa relação com naturalidade.
- source_word: חֲשַׁבְיָה
  choice: Hasabias
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico, adequada ao registro bíblico atual.
- source_word: בָּנָיו
  choice: seus filhos
  rationale: בנים designa aqui os descendentes masculinos do chefe do grupo; «filhos» preserva essa especificidade.
- source_word: וְאֶחָיו
  choice: e seus irmãos
  rationale: Mantém o sentido básico de אחים sem ampliar desnecessariamente para «parentes» ou «companheiros».
- source_word: שְׁנֵים עָשָׂר
  choice: doze ao todo
  rationale: O numeral final informa o total do grupo. «Ao todo» explicita em português a função sintática subentendida, sem acrescentar conteúdo novo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com pontuação que torna legível a fórmula abreviada da lista. «Ao todo» evita que o numeral final pareça solto, preservando seu papel de indicar o tamanho do grupo.
