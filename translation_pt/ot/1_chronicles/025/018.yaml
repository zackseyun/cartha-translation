  text: the twelfth[a], Azarel; his sons and his brothers, twelve.
translation:
  language: pt
  text: O décimo segundo, Azarel[a]; seus filhos e seus irmãos, doze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Azareel”.'
    reason: Variante possível de transliteração do nome hebraico.
lexical_decisions:
- source_word: עַשְׁתֵּי עָשָׂר
  choice: o décimo segundo
  rationale: Embora a forma hebraica seja cardinal, o contexto da sequência de sortes exige sentido ordinal. A formulação elíptica preserva o estilo da lista.
- source_word: עֲזַרְאֵל
  choice: Azarel
  rationale: O nome pessoal é transliterado, não traduzido. “Azarel” representa de modo claro e corrente a forma hebraica.
- source_word: בָּנָיו
  choice: seus filhos
  rationale: O hebraico especifica filhos do sexo masculino, por isso “filhos” é mais preciso do que uma expressão neutra.
- source_word: וְאֶחָיו
  choice: e seus irmãos
  rationale: É a tradução direta do hebraico; embora o termo possa abranger parentes ou companheiros próximos em certos contextos, não há razão suficiente para explicitar aqui um sentido mais amplo.
- source_word: שְׁנֵים עָשָׂר
  choice: doze
  rationale: Indica o total do grupo de Azarel. A construção nominal e elíptica corresponde ao estilo conciso da relação.
