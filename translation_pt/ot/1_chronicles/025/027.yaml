translation:
  language: pt
  text: Para o vigésimo[a], Eliatá; seus filhos e seus irmãos, doze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais explícito: «Para o vigésimo lote: Eliatá, seus filhos e seus irmãos, doze». A palavra «lote» está implícita na estrutura recorrente do capítulo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/עֶשְׂרִים
  choice: para o vigésimo
  rationale: Na lista de sorteios deste capítulo, o לְ marca a atribuição, e עֶשְׂרִים indica a vigésima posição da sequência. A formulação concisa preserva o estilo elíptico do hebraico.
- source_word: לֶ/אֱלִיָּתָה
  choice: Eliata
  rationale: O nome próprio é transliterado segundo uma forma natural em português. O לְ prefixado é absorvido pela fórmula de atribuição «para o vigésimo», deixando o nome em aposição.
- source_word: בָּנָיו
  choice: seus filhos
  rationale: O plural de בֵּן com sufixo de terceira pessoa masculina singular designa aqui os filhos homens de Eliata, no contexto da lista de músicos.
- source_word: וְ/אֶחָיו
  choice: e seus irmãos
  rationale: אֶחָיו é mantido com seu sentido familiar mais direto, sem o ampliar desnecessariamente para «parentes» ou «membros do clã».
- source_word: שְׁנֵים עָשָׂר
  choice: doze
  rationale: O numeral indica o total do grupo. A construção nominal sem verbo conserva o caráter conciso da lista hebraica.
