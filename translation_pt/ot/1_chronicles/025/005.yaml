source:
  edition: WLC
  text: כָּל אֵ֨לֶּה בָנִ֜ים לְ/הֵימָ֗ן חֹזֵ֥ה הַ/מֶּ֛לֶךְ בְּ/דִבְרֵ֥י הָ/אֱלֹהִ֖ים לְ/הָרִ֣ים קָ֑רֶן וַ/יִּתֵּ֨ן הָ/אֱלֹהִ֜ים לְ/הֵימָ֗ן בָּנִ֛ים אַרְבָּעָ֥ה עָשָׂ֖ר וּ/בָנ֥וֹת שָׁלֽוֹשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/005.yaml
  text: All these were sons of Heman[a], the king’s seer in the words of God, to exalt the horn[b]. And God gave Heman fourteen sons and three daughters.
translation:
  language: pt
  text: Todos estes eram filhos de Hemã, o vidente do rei nas palavras de Deus[a], para exaltar o chifre[b]. Deus deu a Hemã catorze filhos e três filhas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser entendido como “o vidente do rei em assuntos de Deus” ou “o vidente do rei por meio das palavras de Deus”. A expressão hebraica é compacta e pode indicar diferentes relações com a revelação divina.
    reason: alternative_reading
  - marker: b
    text: Ou “para levantar o chifre”. No hebraico, o “chifre” é uma imagem figurada de força, honra ou posição elevada.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹזֵה
  choice: vidente
  rationale: É o equivalente português mais direto para a função de quem recebe revelação, preservando a nuance profética e cortesã do termo em Crônicas.
- source_word: בְּדִבְרֵי הָאֱלֹהִים
  choice: nas palavras de Deus
  rationale: Mantém de modo natural a formulação compacta do hebraico e deixa em aberto se a expressão indica o âmbito ou o meio da atividade revelatória de Hemã.
- source_word: לְהָרִים קָרֶן
  choice: para exaltar o chifre
  rationale: Conserva tanto a finalidade expressa pelo infinitivo quanto a metáfora bíblica de elevação, força, honra ou posição.
- source_word: קָרֶן
  choice: chifre
  rationale: Retém a imagem concreta do hebraico em vez de reduzi-la a uma única interpretação, como força ou honra.
- source_word: וַיִּתֵּן הָאֱלֹהִים לְהֵימָן
  choice: Deus deu a Hemã
  rationale: Expressa de maneira natural em português a concessão divina indicada pelo hebraico; a conjunção narrativa não precisa ser reproduzida mecanicamente após o ponto.
- source_word: בָנִים ... וּבָנוֹת
  choice: filhos ... filhas
  rationale: Preserva a distinção explícita entre descendentes do sexo masculino e feminino.
- source_word: אַרְבָּעָה עָשָׂר וּבָנוֹת שָׁלֹשׁ
  choice: catorze filhos e três filhas
  rationale: Reproduz diretamente as quantidades e a ordem semântica do hebraico.
- source_word: כָּל אֵלֶּה
  choice: Todos estes
  rationale: Forma clara e digna que retoma naturalmente os nomes da lista anterior.
theological_decisions:
- issue: Sentido de “o vidente do rei nas palavras de Deus”
  choice: Hemã é apresentado como vidente do rei em uma relação não especificada com as palavras de Deus.
  alternative: “o vidente do rei em assuntos de Deus” ou “o vidente do rei por meio das palavras de Deus”
  rationale: A construção hebraica é compacta e não define com precisão se as palavras de Deus são o âmbito, o conteúdo ou o meio da atuação de Hemã; a tradução preserva essa abertura.
- issue: Sentido de “para exaltar o chifre”
  choice: Manter a metáfora bíblica sem identificar explicitamente de quem é o chifre nem reduzi-la a um único conceito.
  alternative: “para aumentar o poder” ou “para conceder honra”
  rationale: O hebraico deixa implícito o referente e permite associações com força, honra e exaltação; conservar a imagem evita uma resolução interpretativa indevida.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vidente” e “chifre” preservam o vocabulário e a imagem do texto bíblico; as notas esclarecem as ambiguidades reais sem impor uma interpretação denominacional.
