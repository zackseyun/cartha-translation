  text: וַ/יֵּצֵ֞א הַ/גּוֹרָ֧ל הָ/רִאשׁ֛וֹן לְ/אָסָ֖ף לְ/יוֹסֵ֑ף גְּדַלְיָ֨הוּ֙ הַ/שֵּׁנִ֔י הֽוּא וְ/אֶחָ֥י/ו וּ/בָנָ֖י/ו שְׁנֵ֥ים עָשָֽׂר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/009.yaml
  text: The first lot came out for Asaph[a], for Joseph; Gedaliah the second, he and his brothers and his sons[b], twelve.
translation:
  language: pt
  text: 'A primeira sorte saiu para Asafe, para José; a segunda, para Gedalias[b]: ele, seus irmãos e seus filhos, doze ao todo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico apresenta de forma concisa o grupo — ele, seus irmãos e seus filhos — seguido do total: doze.'
    reason: clarificação_sintática
  - marker: b
    text: 'Hebraico: Gedalyahu.'
    reason: alternativa_lexical
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל
  choice: a sorte saiu
  rationale: Mantém a imagem concreta do hebraico no contexto do sorteio; em português, “a sorte caiu” também é idiomático, mas um pouco menos literal.
- source_word: לְאָסָף לְיוֹסֵף
  choice: para Asafe, para José
  rationale: Repete a preposição e preserva a relação sintaticamente compacta e um tanto ambígua entre Asafe e José, sem acrescentar “isto é” ou “do grupo de” ao texto principal.
- source_word: גְּדַלְיָהוּ
  choice: Gedalias
  rationale: Emprega a forma portuguesa tradicional e legível do nome, registrando em nota a forma hebraica mais transparente.
- source_word: הַשֵּׁנִי
  choice: a segunda, para Gedalias
  rationale: O substantivo “sorte” é recuperado implicitamente da oração anterior, e a preposição “para” é suprida em português para tornar clara a estrutura elíptica da lista.
- source_word: הוּא וְאֶחָיו וּבָנָיו
  choice: ele, seus irmãos e seus filhos
  rationale: Conserva o pronome enfático e a especificidade masculina dos substantivos hebraicos.
- source_word: שְׁנֵים עָשָׂר
  choice: doze ao todo
  rationale: Explicita de modo natural que doze é o total do grupo, sem alterar o conteúdo da construção nominal hebraica.
theological_decisions:
- issue: Relação entre Asafe e José na atribuição da primeira sorte
  choice: Preservar a repetição “para Asafe, para José”
  alternative: “para José, do grupo de Asafe” ou “para Asafe, isto é, para José”
  rationale: A forma hebraica apresenta dois complementos com לְ, e o texto não explicita formalmente a relação entre eles. A tradução evita resolver silenciosamente essa compactação administrativa.
translation_notes:
  register: Português atual, digno e acessível, com nomes bíblicos correntes em português. A ordem e a repetição do hebraico foram mantidas onde carregam ambiguidade genuína; a pontuação e “ao todo” tornam inteligível a estrutura de lista.
