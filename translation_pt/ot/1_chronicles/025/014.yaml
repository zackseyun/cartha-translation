  text: O sétimo lote coube a Jesarela[a]; seus filhos e seus irmãos eram doze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: «O sétimo, Jesarela, seus filhos e seus irmãos, doze». A formulação «O sétimo lote coube a» é suprida com base na fórmula de distribuição por sortes repetida nos versículos circundantes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁבִעִי
  choice: O sétimo lote
  rationale: O ordinal funciona substantivamente na lista de distribuição por sortes. Explicitar «lote» torna a referência natural e clara em português.
- source_word: יְשַׂרְאֵלָה
  choice: Jesarela
  rationale: O nome próprio é transliterado segundo uma forma corrente e legível em português.
- source_word: בָּנָיו
  choice: seus filhos
  rationale: O hebraico se refere especificamente aos filhos homens, sentido preservado pela forma portuguesa no contexto.
- source_word: וְאֶחָיו
  choice: e seus irmãos
  rationale: Mantém o sentido comum do substantivo hebraico, sem o ampliar interpretativamente para parentes ou companheiros.
- source_word: שְׁנֵים עָשָׂר
  choice: eram doze
  rationale: Expressa com naturalidade que o total do grupo formado pelos filhos e irmãos era doze.
- source_word: '[fórmula de distribuição implícita]'
  choice: coube a
  rationale: Embora não haja verbo nesta linha hebraica elíptica, a fórmula repetida nos versículos ao redor indica a distribuição por sorte; «coube a» transmite isso de modo idiomático.
