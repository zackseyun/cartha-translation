lexical_decisions:
- source_word: לִשְׁמוֹנָה עָשָׂר
  choice: Para o décimo oitavo
  rationale: O לְ prefixado indica atribuição dentro da sequência de turnos definidos por sorteio. A tradução mantém a fórmula elíptica do hebraico sem acrescentar no texto a palavra “sorteio”, apenas implícita pelo contexto.
- source_word: לַחֲנָנִי
  choice: Hanani
  rationale: Nome próprio transliterado segundo sua forma hebraica corrente em português.
- source_word: בָּנָיו
  choice: seus filhos
  rationale: O termo hebraico designa especificamente os filhos homens e preserva a estrutura familiar da lista.
- source_word: וְאֶחָיו
  choice: e seus irmãos
  rationale: Traduz o sentido familiar direto de אחים, sem ampliá-lo desnecessariamente para parentes ou companheiros.
- source_word: שְׁנֵים עָשָׂר
  choice: doze
  rationale: Número cardinal que informa o total do grupo formado pelos filhos e irmãos de Hanani.
