base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/012.yaml
  text: The fifth was Nethaniah[a]; his sons and his brothers were twelve.
translation:
  language: pt
  text: O quinto foi Netanias[a]; seus filhos e seus irmãos eram doze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, neste contexto: “O quinto sorteio coube a Netanias; seus filhos e seus irmãos eram doze”. O hebraico omite palavras como “sorteio” e “coube a”, inferidas da lista ao redor.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַחֲמִישִׁי
  choice: O quinto
  rationale: O ordinal definido funciona de modo elíptico nesta lista. A tradução preserva a elipse do hebraico; “sorteio” ou “grupo” pode ser inferido do contexto, mas não está expresso no versículo.
- source_word: נְתַנְיָהוּ
  choice: Netanias
  rationale: Transliteração portuguesa corrente do nome próprio hebraico.
- source_word: בָּנָיו
  choice: seus filhos
  rationale: O plural masculino de בֵּן com sufixo de terceira pessoa masculina singular designa especificamente os filhos homens neste contexto.
- source_word: וְאֶחָיו
  choice: e seus irmãos
  rationale: אח no plural significa naturalmente “irmãos” nesta fórmula de lista, sem necessidade de ampliar para “parentes”.
- source_word: שְׁנֵים עָשָׂר
  choice: eram doze
  rationale: O numeral indica o total do grupo mencionado; em português, acrescentar “eram” produz uma frase natural sem alterar o sentido.
