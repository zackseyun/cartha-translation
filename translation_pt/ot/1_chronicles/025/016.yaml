  text: The ninth was Mattanyahu[a], his sons and his brothers, twelve.
translation:
  language: pt
  text: O nono foi Matanias[a], seus filhos e seus irmãos, doze ao todo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico Mattanyahu; tradicionalmente vertido como Matanias em português.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּשִׁיעִי
  choice: O nono foi
  rationale: O ordinal definido funciona de modo elíptico na lista de turnos; o verbo “foi” torna a construção natural em português sem explicitar “turno” ou “sorte”, ausentes no hebraico.
- source_word: מַתַּנְיָהוּ
  choice: Matanias
  rationale: Emprega a forma tradicional e reconhecível do nome em português, correspondente ao hebraico Mattanyahu.
- source_word: בָּנָיו
  choice: seus filhos
  rationale: Preserva o sentido masculino específico do hebraico e se ajusta ao contexto da lista.
- source_word: וְאֶחָיו
  choice: e seus irmãos
  rationale: Mantém o valor lexical direto; embora o termo possa abranger parentes ou associados do clã em certos contextos, aqui não há razão suficiente para substituir “irmãos”.
- source_word: שְׁנֵים עָשָׂר
  choice: doze ao todo
  rationale: Expressa com clareza que o número totaliza o líder, seus filhos e seus irmãos, conforme a fórmula recorrente do capítulo, sem perder a concisão.
