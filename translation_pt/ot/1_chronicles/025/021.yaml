  text: The fourteenth was Mattithiah[a], his sons and his brothers, twelve.
translation:
  language: pt
  text: 'O décimo quarto foi Matitias[a], seus filhos e seus irmãos: doze ao todo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “Para o décimo quarto, Matitias”. Pelo contexto da lista, o número se refere ao décimo quarto lote ou grupo.'
