lexical_decisions:
- source_word: לְאַרְבָּעָה עָשָׂר
  choice: O décimo quarto
  rationale: A fórmula com לְ mais o número introduz o lote ou grupo numerado. Em português, o ordinal reproduz naturalmente a estrutura da lista; “lote” fica implícito, como no hebraico deste versículo.
- source_word: מַתִּתְיָהוּ
  choice: Matitias
  rationale: Forma tradicional e legível em português para o nome hebraico Mattityahu.
- source_word: בָּנָיו
  choice: seus filhos
  rationale: O hebraico especifica filhos do sexo masculino, portanto “filhos” é mais preciso que um termo genérico.
- source_word: וְאֶחָיו
  choice: e seus irmãos
  rationale: Tradução direta e atual; “parentes” seria mais amplo que o termo hebraico.
- source_word: שְׁנֵים עָשָׂר
  choice: doze ao todo
  rationale: O número indica o total do grupo associado a Matitias. “Ao todo” torna essa função clara em português sem alterar o sentido.
