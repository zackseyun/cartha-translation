  yaml_path: translation/ot/1_chronicles/025/024.yaml
  text: For the seventeenth[a], Joshbekashah, his sons and his brothers, twelve.
translation:
  language: pt
  text: 'Para o décimo sétimo[a], Jasbecasa, seus filhos e seus irmãos: doze.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “para o décimo sétimo, para Jasbecasa”; o substantivo “turno”, “sorteio” ou “grupo” fica implícito pelo contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשִׁבְעָה עָשָׂר
  choice: Para o décimo sétimo
  rationale: A preposição לְ com a expressão ordinal indica a atribuição na sequência do sorteio; mantém-se implícito, como no hebraico, o substantivo “turno” ou “grupo”.
- source_word: לְיָשְׁבְּקָשָׁה
  choice: Jasbecasa
  rationale: O nome pessoal é transliterado em forma adaptada à leitura portuguesa; neste formato elíptico de lista, a relação marcada por לְ é expressa naturalmente pela aposição após a atribuição ordinal.
- source_word: בָּנָיו
  choice: seus filhos
  rationale: בנים designa especificamente os filhos homens neste contexto, preservando a formulação do hebraico.
- source_word: וְאֶחָיו
  choice: e seus irmãos
  rationale: אחים significa ordinariamente “irmãos”; embora possa abranger parentes próximos, a tradução direta preserva melhor o texto.
- source_word: שְׁנֵים עָשָׂר
  choice: doze
  rationale: Número cardinal que informa o total do grupo.
