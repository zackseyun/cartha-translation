  text: O terceiro foi Zacur; seus filhos e seus irmãos eram doze.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשְּׁלִשִׁי
  choice: O terceiro
  rationale: O ordinal com artigo funciona como marcador da sequência de turnos determinados por sorteio. A tradução concisa preserva a forma elíptica do hebraico, deixando o contexto fornecer a ideia de “sorteio”.
- source_word: זַכּוּר
  choice: Zacur
  rationale: Transliteração portuguesa natural do nome hebraico, com consoante dupla desnecessária em português.
- source_word: בָּנָיו
  choice: seus filhos
  rationale: O plural masculino de בֵּן com sufixo de terceira pessoa masculina singular significa especificamente “seus filhos”.
- source_word: וְאֶחָיו
  choice: e seus irmãos
  rationale: Tradução direta do plural de אָח com sufixo, preservando a referência masculina e a fórmula recorrente das divisões de músicos.
- source_word: שְׁנֵים עָשָׂר
  choice: doze
  rationale: O numeral indica o total do grupo. Mantê-lo sem verbo explícito preserva o estilo nominal, conciso e enumerativo do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação conserva a concisão enumerativa e a elipse do hebraico, enquanto “foi” torna a frase natural em português.
