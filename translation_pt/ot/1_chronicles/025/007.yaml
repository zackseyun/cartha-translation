  text: וַ/יְהִ֤י מִסְפָּרָ/ם֙ עִם אֲחֵי/הֶ֔ם מְלֻמְּדֵי שִׁ֖יר לַ/יהוָ֑ה כָּל הַ֨/מֵּבִ֔ין מָאתַ֖יִם שְׁמוֹנִ֥ים וּ/שְׁמוֹנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/007.yaml
  text: Their number[a], together with their brothers who were trained in singing to Yahweh, all who were skillful[b], was two hundred eighty-eight.
translation:
  language: pt
  text: O total deles, junto com seus irmãos — todos treinados para cantar a Yahweh e habilidosos —, era de duzentos e oitenta e oito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os que tinham entendimento”, isto é, todos os que eram competentes ou peritos no trabalho musical.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפָּרָם
  choice: O número deles
  rationale: Expressa naturalmente em português o total contado indicado pelo substantivo com sufixo.
- source_word: עִם אֲחֵיהֶם
  choice: juntamente com seus irmãos
  rationale: Preserva a ideia de acompanhamento de עִם e o sentido masculino de אֲחֵיהֶם no contexto do serviço levítico.
- source_word: מְלֻמְּדֵי שִׁיר
  choice: treinados para cantar
  rationale: Mantém o valor passivo de למד e comunica de modo corrente a capacitação no canto.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל indica aqui a direção ou finalidade do canto; a tradução conserva o nome divino.
- source_word: כָּל הַמֵּבִין
  choice: todos eles habilidosos
  rationale: No contexto musical, בין denota competência ou perícia, não apenas compreensão intelectual; a construção também deixa claro que os 288 eram os capacitados descritos.
- source_word: מָאתַיִם שְׁמוֹנִים וּשְׁמוֹנָה
  choice: duzentos e oitenta e oito
  rationale: Reproduz diretamente o número 288 em forma escrita, segundo o uso natural do português.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o Tetragrama; “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação segue de perto a sintaxe e o sentido do hebraico, mas evita literalismo pouco natural. O pronome “eles” em “todos eles” esclarece que a expressão caracteriza o conjunto contado.
