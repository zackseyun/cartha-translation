lexical_decisions:
- source_word: לְ/תִשְׁעָה עָשָׂר
  choice: Para o décimo nono
  rationale: 'O contexto da lista exige sentido ordinal: trata-se da décima nona designação ou sorte. A preposição לְ é reproduzida por “para”, preservando a fórmula concisa do hebraico.'
- source_word: לְ/מַלּוֹתִי
  choice: Maloti
  rationale: Nome próprio transliterado segundo uma forma natural em português, sem traduzir seu possível significado.
- source_word: בָּנָיו
  choice: seus filhos
  rationale: O hebraico especifica filhos do sexo masculino, adequado ao contexto genealógico e administrativo.
- source_word: וְ/אֶחָיו
  choice: e seus irmãos
  rationale: Mantém o sentido lexical direto; embora o termo possa abranger parentes ou membros do clã em certos contextos, aqui não há necessidade de explicitação.
- source_word: שְׁנֵים עָשָׂר
  choice: doze
  rationale: Número cardinal que indica o total do grupo.
