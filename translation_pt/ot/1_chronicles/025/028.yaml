base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/028.yaml
  text: for the twenty-first[a], Hothir; his sons and his brothers, twelve.
translation:
  language: pt
  text: para o vigésimo primeiro[a], Hotir; seus filhos e seus irmãos, doze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «para um e vinte, Hotir». O hebraico reflete a sequência dos sorteios neste capítulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/אֶחָד וְ/עֶשְׂרִים
  choice: para o vigésimo primeiro
  rationale: O versículo faz parte da sequência que enumera a ordem dos turnos por sorteio. A preposição לְ marca a atribuição; em português natural, «para o vigésimo primeiro» preserva a forma elíptica do hebraico sem acrescentar «sorteio», que está implícito no contexto.
- source_word: לְ/הוֹתִיר
  choice: Hotir
  rationale: הוֹתִיר é um nome próprio. A preposição לְ é incorporada à construção «para o vigésimo primeiro, Hotir», evitando a repetição pouco natural «para Hotir».
- source_word: בָּנָיו
  choice: seus filhos
  rationale: בָּנִים designa especificamente filhos homens neste contexto de lista familiar.
- source_word: וְאֶחָיו
  choice: e seus irmãos
  rationale: אֶחָיו significa literalmente «seus irmãos». Embora em listas desse tipo possa abranger parentes ou companheiros do grupo, o texto não exige uma expressão mais ampla.
- source_word: שְׁנֵים עָשָׂר
  choice: doze
  rationale: O número indica o total do grupo. A aposição concisa «seus filhos e seus irmãos, doze» reproduz a estrutura elíptica do hebraico e o padrão dos versículos próximos.
theological_decisions: []
