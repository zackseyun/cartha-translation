source:
  edition: WLC
  text: לְ/הֵימָ֑ן בְּנֵ֣י הֵימָ֡ן בֻּקִּיָּ֡הוּ מַתַּנְיָ֡הוּ עֻ֠זִּיאֵל שְׁבוּאֵ֨ל וִֽ/ירִימ֜וֹת חֲנַנְיָ֣ה חֲנָ֗נִי אֱלִיאָ֤תָה גִדַּ֨לְתִּי֙ וְ/רֹמַ֣מְתִּי עֶ֔זֶר יָשְׁבְּקָ֣שָׁה מַלּ֔וֹתִי הוֹתִ֖יר מַחֲזִיאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/004.yaml
  text: 'To Heman: the sons of Heman: Bukkiah[a], Mattaniah, Uzziel, Shebuel, and Jerimoth, Hananiah, Hanani, Eliathah, Giddalti, and Romamti-ezer, Joshbekashah, Mallothi, Hothir[c][b], Mahazioth.'
translation:
  language: pt
  text: 'Para Hemã: os filhos de Hemã eram Buquias, Matanias, Uziel, Sebuel[b], Jerimote[c], Hananias, Hanani, Eliata, Gidalti[a], Romanti-Ézer, Josbecasa, Maloti, Hotir e Maaziote.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns intérpretes sugerem que parte desta lista, especialmente em torno de “Gidalti” e “Romanti-Ézer”, pode ser lida como uma frase, e não somente como nomes. Pelo contexto, a tradução os apresenta como nomes próprios de uma relação de pessoas.
    reason: alternative_reading
  - marker: b
    text: “Sebuel” também pode ser grafado “Subael”.
    reason: lexical_alternative
  - marker: c
    text: “Jerimote” também pode ser grafado “Jeremote”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/הֵימָן
  choice: Para Hemã
  rationale: O לְ introduz a atribuição a Hemã dentro da relação de grupos; “Para Hemã” preserva essa função sem transformá-la em simples posse.
- source_word: בְּנֵי הֵימָן
  choice: os filhos de Hemã
  rationale: בְּנֵי designa aqui os filhos ou membros da descendência de Hemã; a formulação direta condiz com o caráter genealógico da lista.
- source_word: בֻּקִּיָּהוּ מַתַּנְיָהוּ עֻזִּיאֵל
  choice: Buquias, Matanias, Uziel
  rationale: Formas portuguesas legíveis dos nomes hebraicos, com terminações teofóricas adaptadas segundo o uso bíblico em português.
- source_word: שְׁבוּאֵל
  choice: Sebuel
  rationale: Transliteração portuguesa próxima da vocalização massorética; a variante “Subael” é registrada em nota.
- source_word: וִֽירִימוֹת
  choice: Jerimote
  rationale: Forma portuguesa que representa יְרִימוֹת; a conjunção hebraica integra a enumeração e não precisa ser reproduzida neste ponto em uma lista portuguesa fluente.
- source_word: חֲנַנְיָה חֲנָנִי אֱלִיאָתָה
  choice: Hananias, Hanani, Eliata
  rationale: Transliterações adaptadas à ortografia e à pronúncia portuguesas, mantendo distintos os nomes hebraicos.
- source_word: גִדַּלְתִּי
  choice: Gidalti
  rationale: Embora a forma também possa evocar um verbo, o contexto imediato favorece sua leitura como nome próprio.
- source_word: וְ/רֹמַמְתִּי עֶזֶר
  choice: Romanti-Ézer
  rationale: A sequência é tratada como nome próprio composto no contexto da lista; o hífen explicita a unidade onomástica.
- source_word: יָשְׁבְּקָשָׁה מַלּוֹתִי הוֹתִיר מַחֲזִיאוֹת
  choice: Josbecasa, Maloti, Hotir e Maaziote
  rationale: Transliterações portuguesas legíveis dos quatro nomes finais; o “e” final torna natural a enumeração sem alterar seu conteúdo.
theological_decisions:
- issue: Se parte da sequência deve ser entendida como nomes próprios ou como uma frase com sentido verbal
  choice: Tratar toda a sequência depois de “os filhos de Hemã” como uma lista de nomes próprios
  alternative: Entender alguns elementos, sobretudo Gidalti e Romanti-Ézer, como parte de uma frase, por exemplo, “engrandeci e exaltei a ajuda”
  rationale: O contexto literário é uma relação dos filhos e integrantes dos grupos musicais. A tradução mantém essa leitura contextual, mas registra em nota a possibilidade de perceber valor frasal em parte dos nomes, sem transformar uma hipótese em texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de nomes adaptadas à leitura brasileira sem excessiva lusitanização. A repetição de “Hemã” e a estrutura de atribuição foram preservadas; acrescentou-se “eram” apenas para completar naturalmente a frase nominal em português.
