  language: pt
  text: 'o oitavo, para Jesaías[a], seus filhos e seus irmãos: doze.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o oitavo lote: Jesaías, seus filhos e seus irmãos, doze”. A palavra “lote” é subentendida pelo contexto da lista ao redor, mas não aparece expressamente neste versículo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁמִינִי
  choice: o oitavo
  rationale: O ordinal com artigo integra a lista de sorteios ou designações do capítulo. A tradução mantém a formulação explícita do hebraico sem inserir “lote”, que está apenas implícito no contexto.
- source_word: יְשַׁעְיָהוּ
  choice: Jesaías
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico neste contexto.
- source_word: בָּנָיו
  choice: seus filhos
  rationale: בנים designa especificamente os filhos homens neste contexto.
- source_word: וְאֶחָיו
  choice: e seus irmãos
  rationale: Preserva o sentido familiar direto de אחים, sem ampliá-lo desnecessariamente para parentes ou companheiros.
- source_word: שְׁנֵים עָשָׂר
  choice: doze
  rationale: Indica o total do grupo. Mantém-se o estilo conciso da lista hebraica sem acrescentar um verbo ausente no texto-fonte.
