  yaml_path: translation/ot/1_chronicles/025/022.yaml
  text: 'For the fifteenth[a], to Jeremoth: his sons and his brothers[b], twelve.'
translation:
  language: pt
  text: 'Para o décimo quinto: para Jeremote, seus filhos e seus irmãos, doze.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַחֲמִשָּׁה עָשָׂר
  choice: Para o décimo quinto
  rationale: A expressão tem sentido ordinal na fórmula repetida de distribuição por sortes neste capítulo. A preposição ל é representada por “para”. “Lote” é compreendido pelo contexto, mas não aparece neste versículo hebraico, por isso não foi acrescentado ao texto principal.
- source_word: לִירֵמוֹת
  choice: Jeremote
  rationale: O ל prefixado assinala o destinatário da designação e já é expresso naturalmente pelo “para” que abre a frase; repeti-lo diante do nome seria desnecessário em português. “Jeremote” é uma transliteração portuguesa corrente do nome.
- source_word: בָּנָיו
  choice: seus filhos
  rationale: O hebraico designa especificamente os filhos homens, e não filhos em sentido neutro.
- source_word: וְאֶחָיו
  choice: e seus irmãos
  rationale: É a tradução direta; embora o termo possa abranger parentes próximos ou membros masculinos do grupo neste contexto organizacional, o texto não exige essa ampliação.
- source_word: שְׁנֵים עָשָׂר
  choice: doze
  rationale: Número cardinal que indica o total do grupo associado a Jeremote.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com concisão compatível com a fórmula elíptica da lista. Preserva-se no texto principal a ausência da palavra “lote” no hebraico. A pontuação esclarece a estrutura sem transformar a frase em uma oração completa.
