  text: for the twenty-fourth[a], Romamti-ezer, his sons and his brothers, twelve.
translation:
  language: pt
  text: para o vigésimo quarto[a], Romamti-Ezer, seus filhos e seus irmãos, doze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “para o vigésimo quarto”; em toda esta seção, a expressão se refere ao vigésimo quarto lote ou grupo.
    reason: cross_reference
lexical_decisions:
- source_word: לְאַרְבָּעָה וְעֶשְׂרִים
  choice: para o vigésimo quarto
  rationale: O לְ marca a atribuição, e o numeral cardinal tem sentido ordinal neste contexto de sorteios sucessivos. “Lote” fica implícito e, por não constar neste versículo, não é acrescentado ao texto principal.
- source_word: לְרוֹמַמְתִּי עָזֶר
  choice: Romamti-Ezer
  rationale: Nome próprio transliterado, com hífen para representar a unidade do nome composto e facilitar a leitura.
- source_word: בָּנָיו
  choice: seus filhos
  rationale: O substantivo se refere especificamente aos filhos homens no contexto desta lista.
- source_word: וְאֶחָיו
  choice: e seus irmãos
  rationale: Preserva o sentido lexical direto; embora o termo possa abranger parentes ou companheiros de grupo em certos contextos, aqui não se explicita tal ampliação.
- source_word: שְׁנֵים עָשָׂר
  choice: doze
  rationale: Indica o total de integrantes do grupo, conforme o padrão da seção.
