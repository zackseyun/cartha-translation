  text: And they cast lots for duties[a], the small as well as the great[b], the teacher with the student.
translation:
  language: pt
  text: 'E lançaram sortes para os serviços: tanto o pequeno como o grande, o especialista junto com o aprendiz[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o pequeno como o grande, o que entende com o aluno”. “Pequeno” e “grande” indicam pessoas de menor e maior posição ou importância; o termo traduzido por “especialista” também pode significar alguém entendido, hábil ou que ensina.'
    reason: cultural_note; lexical_alternative
lexical_decisions:
- source_word: וַיַּפִּילוּ גּוֹרָלוֹת
  choice: lançaram sortes
  rationale: Expressão portuguesa tradicional e clara para o idiomatismo hebraico que descreve a escolha ou distribuição por sorteio.
- source_word: מִשְׁמֶרֶת
  choice: para os turnos
  rationale: No contexto do serviço musical do templo, o termo indica períodos ou grupos de serviço designados; “turnos” comunica essa organização sem acrescentar um possessivo ausente do hebraico.
- source_word: לְעֻמַּת
  choice: tanto para... como para...; junto com
  rationale: A preposição exprime correspondência ou tratamento equivalente entre as categorias mencionadas, e não oposição espacial.
- source_word: כַּקָּטֹן כַּגָּדוֹל
  choice: tanto para o pequeno como para o grande
  rationale: Preserva o idiomatismo hebraico e deixa que o contexto indique diferenças de posição, importância ou experiência.
- source_word: מֵבִין
  choice: especialista
  rationale: O particípio significa literalmente “aquele que entende” e, neste contexto musical, provavelmente designa uma pessoa instruída ou hábil. “Especialista” mantém o contraste com o aprendiz sem pressupor necessariamente a função formal de professor.
- source_word: תַּלְמִיד
  choice: aprendiz
  rationale: Designa quem está aprendendo; “aprendiz” soa natural no contexto de formação musical e evita associações religiosas posteriores que “discípulo” poderia sugerir.
