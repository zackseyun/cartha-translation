  text: וַ/יַּבְדֵּ֣ל דָּוִיד֩ וְ/שָׂרֵ֨י הַ/צָּבָ֜א לַ/עֲבֹדָ֗ה לִ/בְנֵ֤י אָסָף֙ וְ/הֵימָ֣ן וִֽ/ידוּת֔וּן ה/נביאים בְּ/כִנֹּר֥וֹת בִּ/נְבָלִ֖ים וּ/בִ/מְצִלְתָּ֑יִם וַֽ/יְהִי֙ מִסְפָּרָ֔/ם אַנְשֵׁ֥י מְלָאכָ֖ה לַ/עֲבֹדָתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/001.yaml
  text: 'And David and the commanders of the army set apart for the service the sons of Asaph[a], Heman, and Jeduthun, who prophesied with lyres, harps, and cymbals; and their number, the men for the work of their service[b], was:'
translation:
  language: pt
  text: 'Davi e os comandantes do exército separaram para o serviço os filhos de Asafe, Hemã e Jedutum[a], que profetizavam[b] ao som de liras, harpas e címbalos. Este era o número dos homens encarregados do trabalho em seu serviço:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica “filhos de Asafe, Hemã e Jedutum” pode designar seus descendentes ou integrantes dos grupos ligados a eles, e não apenas filhos imediatos.
    reason: lexical_alternative
  - marker: b
    text: Ou, mais formalmente, “os profetas, com liras, harpas e címbalos”. O hebraico também pode ser entendido com “os profetas” em aposição a Asafe, Hemã e Jedutum.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּבְדֵּל
  choice: separaram
  rationale: O hifil de בדל indica separar ou reservar para uma função. “Separaram” mantém a ação organizacional do texto sem acrescentar uma fórmula técnica de nomeação.
- source_word: שָׂרֵי הַצָּבָא
  choice: os comandantes do exército
  rationale: שָׂרֵי designa chefes ou oficiais, e הַצָּבָא normalmente designa o exército. A expressão é clara e natural em português moderno.
- source_word: לַעֲבֹדָה
  choice: para o serviço
  rationale: עֲבֹדָה pode indicar trabalho ou serviço e, neste contexto, refere-se ao serviço organizado relacionado ao templo.
- source_word: לִבְנֵי אָסָף וְהֵימָן וִידוּתוּן
  choice: os filhos de Asafe, Hemã e Jedutum
  rationale: “Filhos” preserva a forma do hebraico, que pode abranger filhos imediatos, descendentes ou integrantes dos grupos ligados a esses líderes.
- source_word: הנביאים
  choice: que profetizavam
  rationale: A formulação verbal produz sintaxe natural e expressa a atividade profética associada à música, sem ocultar a possível leitura nominal, registrada em nota.
- source_word: בְּכִנֹּרוֹת בִּנְבָלִים וּבִמְצִלְתָּיִם
  choice: ao som de liras, harpas e címbalos
  rationale: A expressão comunica de modo natural o uso dos instrumentos. “Liras” e “harpas” preservam a distinção entre כִּנּוֹר e נֵבֶל, enquanto “címbalos” é o equivalente corrente de מְצִלְתַּיִם.
- source_word: וַיְהִי מִסְפָּרָם
  choice: Este era o número
  rationale: A oração introduz a enumeração que segue; os dois-pontos preservam essa função prospectiva.
- source_word: אַנְשֵׁי מְלָאכָה לַעֲבֹדָתָם
  choice: dos homens encarregados do trabalho em seu serviço
  rationale: A redação identifica os homens dedicados à tarefa sem pressupor que מְלָאכָה afirme explicitamente uma habilidade técnica especial.
theological_decisions:
- issue: Se הנביאים deve ser entendido verbalmente como atividade profética ou nominalmente como “os profetas”
  choice: que profetizavam
  alternative: os profetas, com liras, harpas e címbalos
  rationale: A leitura verbal liga claramente a profecia ao ministério musical e é natural em português. A leitura nominal por aposição continua possível e é preservada em nota, sem decidir além da evidência textual.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Ao som de” evita uma sequência pesada de preposições e comunica naturalmente o acompanhamento instrumental. A frase termina com dois-pontos porque a enumeração continua nos versículos seguintes.
