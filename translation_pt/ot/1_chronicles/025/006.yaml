revisions:
- from: 'Todos eles estavam sob a direção de seu pai na música da casa de Yahweh, com címbalos, harpas e liras, para o serviço da casa de Deus, sob a direção do rei: Asafe, Jedutum e Hemã.[a]'
  to: Todos eles estavam sob a direção de seus pais na música da casa de Yahweh, com címbalos, harpas e liras, para o serviço da casa de Deus, sob a direção do rei e de Asafe, Jedutum e Hemã.
  rationale: A revisão elimina a pontuação que produz uma identificação incorreta entre o rei e os três músicos-dirigentes. «E de» explicita em português a coordenação que o hebraico apresenta de modo compacto. A nota sobre uma leitura em que os três estariam apenas sob a direção do rei é removida, pois não resolve o problema criado pelos dois-pontos e não é necessária para a tradução revista.
