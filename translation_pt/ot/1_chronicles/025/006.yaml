  text: כָּל אֵ֣לֶּה עַל יְדֵי֩ אֲבִי/הֶ֨ם בַּ/שִּׁ֜יר בֵּ֣ית יְהוָ֗ה בִּ/מְצִלְתַּ֨יִם֙ נְבָלִ֣ים וְ/כִנֹּר֔וֹת לַ/עֲבֹדַ֖ת בֵּ֣ית הָ/אֱלֹהִ֑ים עַ֚ל יְדֵ֣י הַ/מֶּ֔לֶךְ אָסָ֥ף וִ/ידוּת֖וּן וְ/הֵימָֽן־־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/006.yaml
  text: 'All these were under the direction of their father in the music of the house of Yahweh[a], with cymbals, harps, and lyres, for the service of the house of God, under the direction of the king: Asaph, Jeduthun[c][b], and Heman.'
translation:
  language: pt
  text: Todos eles estavam sob a direção de seus pais na música da casa de Yahweh, com címbalos, harpas e liras, para o serviço da casa de Deus, sob a direção do rei e de Asafe, Jedutum e Hemã.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל יְדֵי אֲבִיהֶם
  choice: sob a direção de seu pai
  rationale: A expressão idiomática literalmente ligada à “mão” indica aqui supervisão ou direção no contexto da organização musical.
- source_word: בַּשִּׁיר
  choice: na música
  rationale: שִׁיר pode significar canto, canção ou atividade musical; o contexto de instrumentos e serviço no templo favorece o sentido coletivo “música”.
- source_word: בֵּית יְהוָה
  choice: casa de Yahweh
  rationale: Mantém a imagem hebraica de “casa” e representa diretamente o nome divino יהוה.
- source_word: בִּמְצִלְתַּיִם נְבָלִים וְכִנֹּרוֹת
  choice: com címbalos, harpas e liras
  rationale: A preposição tem valor instrumental. A tradução distingue os dois tipos de instrumentos de cordas, embora sua identificação moderna exata seja incerta.
- source_word: לַעֲבֹדַת בֵּית הָאֱלֹהִים
  choice: para o serviço da casa de Deus
  rationale: עֲבֹדָה designa trabalho ou serviço e, neste contexto cultual, “serviço” é natural sem acrescentar terminologia eclesiástica posterior.
- source_word: עַל יְדֵי הַמֶּלֶךְ
  choice: sob a direção do rei
  rationale: A repetição da expressão idiomática indica supervisão ou autorização régia e é traduzida de modo coerente com sua primeira ocorrência.
- source_word: אָסָף וִידוּתוּן וְהֵימָן
  choice: Asafe, Jedutum e Hemã
  rationale: Formas tradicionais e reconhecíveis em português para os nomes pessoais hebraicos.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama; “Yahweh” procura representar o nome próprio, em vez de substituí-lo por um título.
- issue: Relação sintática dos nomes Asafe, Jedutum e Hemã
  choice: Os nomes são ligados ao rei mediante dois-pontos, preservando a construção compacta do hebraico
  alternative: Reestruturar como “Asafe, Jedutum e Hemã estavam sob a direção do rei”
  rationale: A ordem hebraica é condensada e pode sugerir que os três pais/diretores exerciam sua função sob a autoridade do rei. A pontuação preserva essa tensão sem explicitar mais do que o texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Casa” preserva a metáfora hebraica, e “música” comunica naturalmente o sentido coletivo do serviço musical. O marcador [a] foi colocado no texto principal.
