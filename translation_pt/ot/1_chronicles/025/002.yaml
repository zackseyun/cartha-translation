  text: לִ/בְנֵ֣י אָסָ֗ף זַכּ֧וּר וְ/יוֹסֵ֛ף וּ/נְתַנְיָ֥ה וַ/אֲשַׂרְאֵ֖לָה בְּנֵ֣י אָסָ֑ף עַ֚ל יַד אָסָ֔ף הַ/נִּבָּ֖א עַל יְדֵ֥י הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/002.yaml
  text: 'Of the sons of Asaph: Zaccur[a], Joseph, Nethaniah, and Asharelah, sons of Asaph, under the direction of Asaph, who prophesied under the direction of the king.'
translation:
  language: pt
  text: 'Dos filhos de Asafe: Zacur, José, Netanias e Asarela, filhos de Asafe, sob a direção de Asafe, que profetizava sob a direção do rei.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “pela mão de Asafe [...] pelas mãos do rei”. A expressão hebraica pode indicar agência, supervisão ou direção.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי אָסָף
  choice: Dos filhos de Asafe
  rationale: Neste contexto de lista, o ל prefixado introduz a subdivisão enumerada; “Dos filhos de” funciona naturalmente como cabeçalho de uma relação.
- source_word: זַכּוּר וְיוֹסֵף וּנְתַנְיָה וַאֲשַׂרְאֵלָה
  choice: Zacur, José, Netanias e Asarela
  rationale: Os nomes próprios são transliterados em formas correntes e legíveis em português, mantendo a forma hebraica de Asarela atestada no WLC.
- source_word: בְּנֵי אָסָף
  choice: filhos de Asafe
  rationale: A repetição do hebraico é preservada porque identifica explicitamente os nomes enumerados com a linhagem ou grupo de Asafe.
- source_word: עַל יַד / עַל יְדֵי
  choice: sob a direção de
  rationale: O idioma, literalmente relacionado à “mão”, pode indicar agência, supervisão ou autoridade. Aqui, “sob a direção de” comunica naturalmente o sentido administrativo e preserva o paralelismo das duas ocorrências.
- source_word: הַנִּבָּא
  choice: que profetizava
  rationale: O particípio de נבא descreve a atividade profética contínua ou característica de Asafe; o imperfeito português encaixa-se naturalmente na sequência narrativa e não reduz a ação a simples execução musical.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Tradução direta do substantivo definido, referindo-se à autoridade real no contexto.
theological_decisions:
- issue: Sentido de “profetizava” no contexto da música do templo
  choice: Manter “profetizava” no texto principal
  alternative: “executava música inspirada” ou “cantava profeticamente”
  rationale: O verbo נבא atribui à atividade de Asafe caráter profético. Substituí-lo por uma descrição meramente musical eliminaria uma afirmação e uma tensão teológica presentes no texto.
translation_notes:
  register: Português moderno, digno e acessível, com formas nominais reconhecíveis no uso bíblico lusófono. A sintaxe conserva a repetição do original e a ambiguidade funcional da expressão hebraica por meio de nota.
