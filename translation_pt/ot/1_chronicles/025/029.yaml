translation:
  language: pt
  text: 'Para o vigésimo segundo[a]: Gidalti, seus filhos e seus irmãos, doze.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Para a vigésima segunda sorte: Gidalti, seus filhos e seus irmãos, doze». O estilo da lista hebraica é condensado, e a palavra «sorte» fica subentendida pelo contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁנַיִם וְעֶשְׂרִים
  choice: Para o vigésimo segundo
  rationale: No contexto da sequência, a expressão indica a vigésima segunda sorte ou ordem. O ordinal é a forma natural em português, e «para» representa o ל prefixado.
- source_word: לְגִדַּלְתִּי
  choice: Gidalti
  rationale: O ל marca a atribuição a Gidalti; em português, a relação já é expressa pelo «Para» inicial da fórmula, evitando a repetição pouco natural «para... para Gidalti».
- source_word: בָּנָיו
  choice: seus filhos
  rationale: O hebraico designa especificamente os filhos homens de Gidalti.
- source_word: וְאֶחָיו
  choice: e seus irmãos
  rationale: Mantém o sentido lexical comum de אחים, sem ampliá-lo desnecessariamente para parentes ou membros do clã.
- source_word: שְׁנֵים עָשָׂר
  choice: doze
  rationale: O numeral final informa o total do grupo. A construção nominal concisa preserva o estilo comprimido da lista hebraica sem acrescentar uma cópula.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação concisa própria de uma lista. A grafia «Gidalti» segue uma transliteração legível em português. A ambiguidade quanto ao substantivo subentendido «sorte» é preservada por meio de nota.
