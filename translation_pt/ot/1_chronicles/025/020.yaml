base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/020.yaml
  text: The thirteenth[a], Shubael; his sons and his brothers, twelve.
translation:
  language: pt
  text: 'O décimo terceiro[a]: Subael; seus filhos e seus irmãos, doze.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Para o décimo terceiro, Subael”. A palavra “sorteio” está implícita no contexto dos versículos ao redor.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁלֹשָׁה עָשָׂר
  choice: O décimo terceiro
  rationale: Na sequência dos turnos determinados por sorteio, o prefixo ל indica atribuição (“para o décimo terceiro”). Em português, a forma ordinal concisa preserva o estilo da lista; “sorteio” fica implícito no contexto, pois não aparece neste versículo.
- source_word: שׁוּבָאֵל
  choice: Subael
  rationale: O nome próprio é transliterado segundo uma forma natural e tradicional em português.
- source_word: בָּנָיו
  choice: seus filhos
  rationale: O hebraico especifica filhos do sexo masculino, não filhos e filhas de modo genérico.
- source_word: וְאֶחָיו
  choice: e seus irmãos
  rationale: A tradução direta conserva o sentido lexical masculino; no contexto organizacional, o termo também pode abranger parentes ou companheiros do mesmo grupo, mas o texto não explicita isso.
- source_word: שְׁנֵים עָשָׂר
  choice: doze
  rationale: O numeral indica o total ligado a Subael e mantém, sem verbo acrescentado, a forma breve da lista hebraica.
