  text: para o vigésimo terceiro[a], Maaziote; seus filhos e seus irmãos, doze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para o vigésimo terceiro lote, Maaziote”. A preposição prefixada pode ser entendida como indicação de atribuição na sequência dos sorteios.'
