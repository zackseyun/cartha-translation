lexical_decisions:
- source_word: לִ/שְׁלֹשָׁה וְ/עֶשְׂרִים
  choice: para o vigésimo terceiro
  rationale: Neste rol de sorteios, o לְ prefixado indica atribuição, e a expressão numérica funciona idiomaticamente como ordinal. A formulação preserva a concisão elíptica do hebraico.
- source_word: לְ/מַחֲזִיאוֹת
  choice: Maaziote
  rationale: Nome próprio transliterado segundo uma forma corrente e legível em português, mantendo a indicação de atribuição dada pela preposição hebraica na expressão precedente.
- source_word: בָּנָיו
  choice: seus filhos
  rationale: O hebraico especifica filhos do sexo masculino no contexto desta lista.
- source_word: וְאֶחָיו
  choice: e seus irmãos
  rationale: Tradução direta e natural; no contexto, o termo designa os irmãos de Maaziote.
- source_word: שְׁנֵים עָשָׂר
  choice: doze
  rationale: Número cardinal que informa o total conjunto dos filhos e irmãos vinculados a este grupo.
