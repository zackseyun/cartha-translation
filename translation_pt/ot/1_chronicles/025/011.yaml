  text: The fourth[a], to Izri, his sons and his brothers, twelve.
translation:
  language: pt
  text: O quarto foi para Izri; seus filhos e seus irmãos eram doze[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de maneira mais explícita conforme o contexto: “O quarto sorteio coube a Izri”. A palavra “sorteio” está implícita na lista ao redor, mas não aparece neste versículo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְבִיעִי
  choice: O quarto
  rationale: O ordinal aparece de forma elíptica nesta lista de turnos definidos por sorteio. A formulação concisa preserva a estrutura hebraica; “sorteio” fica implícito pelo contexto.
- source_word: לַיִּצְרִי
  choice: para Izri
  rationale: A preposição ל indica aqui a atribuição do quarto turno a Izri; “para” é natural em português e mantém o sentido administrativo da lista.
- source_word: בָּנָיו
  choice: seus filhos
  rationale: O hebraico se refere especificamente aos filhos homens de Izri, não genericamente a seus descendentes ou filhos de ambos os sexos.
- source_word: וְאֶחָיו
  choice: e seus irmãos
  rationale: É a tradução mais direta do substantivo hebraico; embora possa abranger parentes ou companheiros próximos em certos contextos, não há necessidade de ampliar o termo aqui.
- source_word: שְׁנֵים עָשָׂר
  choice: doze
  rationale: O numeral declara o total do grupo. A construção nominal e concisa reproduz o estilo da lista sem acrescentar um verbo ausente no hebraico.
