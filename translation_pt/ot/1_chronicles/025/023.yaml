  text: The sixteenth was for Hananyahu[a], his sons and his brothers[b], twelve.
translation:
  language: pt
  text: O décimo sexto foi para Hananias[a], seus filhos e seus irmãos, doze ao todo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais explícito no contexto: “O décimo sexto lote foi para Hananias”. A palavra “lote” é subentendida pelos versículos ao redor, mas não aparece no hebraico deste versículo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשִׁשָּׁה עָשָׂר
  choice: O décimo sexto foi para
  rationale: A preposição לְ com o ordinal indica a atribuição na sequência dos turnos ou sortes. O verbo “foi” é suprido para produzir uma frase natural; “lote” permanece implícito, como no hebraico.
- source_word: לַחֲנַנְיָהוּ
  choice: Hananias
  rationale: Adota-se a forma portuguesa tradicional e reconhecível do nome hebraico חֲנַנְיָהוּ, em vez de uma transliteração mais rígida como “Hananyahu”.
- source_word: בָּנָיו
  choice: seus filhos
  rationale: בָּנִים designa filhos homens neste contexto de lista e é traduzido diretamente.
- source_word: וְאֶחָיו
  choice: e seus irmãos
  rationale: אָח significa primariamente “irmão”; embora possa ter sentido mais amplo de parentes ou companheiros, a tradução direta se ajusta à fórmula recorrente do capítulo.
- source_word: שְׁנֵים עָשָׂר
  choice: doze ao todo
  rationale: O numeral indica o total do grupo mencionado. “Ao todo” torna essa função clara em português sem acrescentar uma nova informação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe concisa própria de uma lista. A forma “Hananias” favorece o reconhecimento pelo leitor lusófono, enquanto a nota preserva a elipse do hebraico quanto ao lote.
