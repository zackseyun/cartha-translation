  text: the sixth[a], Bukkiah; his sons and his brothers, twelve.
translation:
  language: pt
  text: o sexto[a], Buquias; seus filhos e seus irmãos, doze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais explícito no contexto: “A sexta sorte caiu para Buquias, seus filhos e seus irmãos, doze ao todo”. O estilo conciso da lista hebraica deixa subentendido que a sorte “caiu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשִּׁשִּׁי
  choice: o sexto
  rationale: O ordinal definido aparece de forma elíptica nesta lista de sortes e turmas. A formulação concisa preserva o estilo hebraico, enquanto a nota explicita o elemento subentendido pelo contexto.
- source_word: בֻקִּיָּהוּ
  choice: Buquias
  rationale: Adota-se a forma portuguesa tradicional e reconhecível do nome hebraico, em vez de uma transliteração técnica.
- source_word: בָּנָיו
  choice: seus filhos
  rationale: O hebraico designa especificamente os filhos do sexo masculino, sentido adequado ao contexto genealógico e administrativo.
- source_word: וְאֶחָיו
  choice: e seus irmãos
  rationale: Esta é a correspondência mais direta; embora o termo possa abranger parentes próximos ou membros associados neste contexto, não se amplia o sentido no texto principal.
- source_word: שְׁנֵים עָשָׂר
  choice: doze
  rationale: O numeral indica o total do grupo. Mantê-lo sem verbo reproduz a concisão nominal da lista hebraica.
