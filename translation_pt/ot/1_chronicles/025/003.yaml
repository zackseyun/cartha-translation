base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/003.yaml
  text: 'Of Jeduthun: the sons of Jeduthun—Gedaliah, Zeri, Jeshaiah, Hashabiah, and Mattithiah, six—under the direction of their father Jeduthun, who prophesied with the lyre in giving thanks and praise to Yahweh.'
translation:
  language: pt
  text: 'De Jedutum: os filhos de Jedutum — Gedalias, Zeri, Jesaías, Hasabias e Matitias —, seis ao todo,[a] sob a direção de seu pai Jedutum, que profetizava com a lira, dando graças e louvando o SENHOR.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico registra cinco nomes, mas em seguida diz “seis”. Alguns entendem que um filho foi omitido da lista; outros, que o próprio Jedutum está sendo contado.
    reason: textual_variant
  - marker: b
    text: 'Ou: “que profetizava com a lira para dar graças e louvar o SENHOR”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִידוּתוּן
  choice: De Jedutum
  rationale: O לְ introduz a divisão ligada a Jedutum; “De Jedutum” mantém de modo conciso o estilo de catálogo.
- source_word: בְּנֵי יְדוּת֡וּן
  choice: os filhos de Jedutum
  rationale: Conserva a linguagem familiar do hebraico, que neste contexto também pode abranger os membros da casa ou linhagem musical de Jedutum.
- source_word: גְּדַלְיָהוּ וּצְרִי וִישַׁעְיָהוּ חֲשַׁבְיָהוּ וּמַתִּתְיָהוּ
  choice: Gedalias, Zeri, Jesaías, Hasabias e Matitias
  rationale: Emprega formas portuguesas reconhecíveis dos nomes bíblicos, preservando Zeri por transliteração.
- source_word: שִׁשָּׁה
  choice: seis ao todo
  rationale: Mantém explicitamente o número seis do texto hebraico, sem corrigir a discrepância com os cinco nomes registrados.
- source_word: עַל יְדֵי אֲבִיהֶם
  choice: sob a direção de seu pai
  rationale: Traduz naturalmente o idiomatismo administrativo e musical “sob/pelas mãos de”, indicando supervisão.
- source_word: בַּכִּנּוֹר
  choice: ao som da lira
  rationale: כִּנּוֹר designa uma lira antiga; a expressão portuguesa comunica que o instrumento acompanhava a atividade profética.
- source_word: הַנִּבָּא
  choice: que profetizava
  rationale: Preserva o sentido verbal normal de נבא e a associação deliberada, feita pelo Cronista, entre profecia e música cultual.
- source_word: עַל הֹדוֹת וְהַלֵּל
  choice: dando graças e louvores
  rationale: Expressa de maneira natural o conteúdo ou a finalidade da atividade musical, sem eliminar a possível nuance de propósito.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Representa diretamente o nome divino יהוה, em consonância com a camada de consulta fornecida, sem substituí-lo por um título.
theological_decisions:
- issue: Sentido de “profetizar” no culto musical
  choice: Manter “profetizava” no texto principal
  alternative: executava música inspirada; cantava profeticamente
  rationale: O Cronista usa terminologia profética de modo explícito. A tradução preserva essa categoria e sua tensão teológica, enquanto a referência à lira e à ação de graças esclarece o contexto musical.
- issue: Relação de עַל הֹדוֹת וְהַלֵּל com a profecia musical
  choice: “dando graças e louvores” como ação concomitante ou explicativa
  alternative: “para dar graças e louvar” como finalidade
  rationale: A construção hebraica admite mais de uma relação semântica; o texto principal oferece português natural e a nota registra a leitura final.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. Mantêm-se o formato de lista, a discrepância numérica do hebraico e a linguagem profética aplicada à música. Os travessões organizam a enumeração sem alterar sua estrutura.
