- source_word: הָעֲשִׂירִי
  choice: o décimo
  rationale: Ordinal definido que dá continuidade à sequência de sortes ou grupos no contexto. A formulação concisa preserva a elipse do hebraico.
- source_word: שִׁמְעִי
  choice: Simei
  rationale: Transliteração portuguesa tradicional e reconhecível do nome pessoal hebraico.
- source_word: בָּנָיו
  choice: seus filhos
  rationale: O substantivo masculino plural designa especificamente os filhos homens neste contexto de lista familiar e musical.
- source_word: וְאֶחָיו
  choice: e seus irmãos
  rationale: Tradução direta do sentido normal; possíveis sentidos mais amplos, como parentes próximos ou membros do mesmo grupo, não são impostos ao texto.
- source_word: שְׁנֵים עָשָׂר
  choice: doze
  rationale: Número cardinal que indica o total conjunto dos filhos e irmãos associados a Simei.
