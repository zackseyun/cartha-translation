base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/038.yaml
  text: These[a], who were mentioned by name, were leaders in their clans[b], and their ancestral houses increased greatly.
translation:
  language: pt
  text: Estes[a], registrados por nome, eram líderes de seus clãs, e suas casas ancestrais se tornaram muito numerosas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Estes que vieram, relacionados por nome”. O particípio hebraico significa literalmente “os que vêm”, mas aqui provavelmente se refere aos que foram incluídos ou designados no registro genealógico.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “e as casas de seus pais se expandiram até se tornarem numerosas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Estes
  rationale: O demonstrativo plural introduz o grupo mencionado na lista genealógica anterior; a forma simples é natural e suficiente em português.
- source_word: הַבָּאִים בְּשֵׁמוֹת
  choice: registrados por nome
  rationale: Embora o particípio de בוא signifique literalmente “os que vêm”, neste contexto genealógico a expressão provavelmente indica pessoas incluídas ou designadas nominalmente no registro.
- source_word: נְשִׂיאִים
  choice: líderes
  rationale: O termo designa pessoas de posição elevada à frente de grupos de parentesco; “líderes” evita tanto a conotação monárquica de “príncipes” quanto um tom excessivamente arcaico.
- source_word: בְּמִשְׁפְּחוֹתָם
  choice: de seus clãs
  rationale: No contexto genealógico, מִשְׁפָּחָה indica um grupo amplo de parentesco, não apenas uma família nuclear.
- source_word: וּבֵית אֲבוֹתֵיהֶם
  choice: suas casas ancestrais
  rationale: A expressão se refere às casas ou linhagens paternas; “casas ancestrais” comunica esse sentido em linguagem atual sem apagar a estrutura genealógica.
- source_word: פָּרְצוּ לָרֹב
  choice: se multiplicaram grandemente
  rationale: O verbo traz a imagem de irromper ou expandir-se, e לָרֹב expressa abundância numérica; juntos, indicam grande crescimento do grupo.
