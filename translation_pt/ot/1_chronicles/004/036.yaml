lexical_decisions:
- source_word: אֶלְיוֹעֵינַי
  choice: Elioenai
  rationale: Nome próprio transliterado em forma compatível com o uso bíblico em português.
- source_word: יַעֲקֹבָה
  choice: Jaacobá
  rationale: Transliteração legível em português, preservando a forma distinta do nome hebraico e sua tonicidade final.
- source_word: יְשׁוֹחָיָה
  choice: Jesoaías
  rationale: Forma aportuguesada que representa o nome hebraico e segue padrões reconhecíveis de nomes bíblicos terminados em -aías.
- source_word: עֲשָׂיָה
  choice: Asaías
  rationale: Forma tradicional e natural em português para este nome hebraico.
- source_word: עֲדִיאֵל
  choice: Adiel
  rationale: Transliteração compacta, clara e já adequada à fonologia portuguesa.
- source_word: יְשִׂימִיאֵל
  choice: Jesimiel
  rationale: Transliteração aportuguesada do nome próprio, com representação convencional do yod inicial por J.
- source_word: בְּנָיָה
  choice: Benaías
  rationale: Forma bíblica portuguesa amplamente reconhecível para o nome hebraico.
- source_word: וְ / וַ / וִ / וּ
  choice: e
  rationale: A conjunção hebraica liga cada nome. A repetição foi preservada em grande parte, mantendo o caráter cumulativo da lista, mas omitiu-se o último 'e' redundante antes de Benaías para naturalidade mínima em português.
