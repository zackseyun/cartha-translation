base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/016.yaml
  text: 'And the sons of Jehallelel: Ziph[a], Ziphah, Tiria, and Asarel.'
translation:
  language: pt
  text: 'E os filhos de Jealelel: Zife, Zifa, Tíria e Asarel[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome também pode ser grafado “Asareel” em português.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: E os filhos de
  rationale: בְּנֵי é o plural construto de “filhos de” e introduz descendentes numa genealogia; a conjunção prefixada וּ é preservada como “E” para manter a ligação com o contexto.
- source_word: יְהַלֶּלְאֵל
  choice: Jealelel
  rationale: Nome próprio transliterado em forma corrente e legível em português, sem traduzir seu possível conteúdo etimológico.
- source_word: זִיף
  choice: Zife
  rationale: Transliteração adaptada à ortografia portuguesa, com “e” final para representar de modo natural a pronúncia do nome hebraico.
- source_word: וְזִיפָה
  choice: Zifa
  rationale: Nome próprio transliterado conforme sua forma hebraica; a conjunção é expressa naturalmente na coordenação portuguesa da lista.
- source_word: תִּירְיָא
  choice: Tíria
  rationale: Transliteração portuguesa com acento gráfico para indicar a tonicidade e evitar leitura ambígua.
- source_word: וַאֲשַׂרְאֵל
  choice: e Asarel
  rationale: A conjunção introduz o último nome da lista. “Asarel” representa diretamente a vocalização massorética; a grafia tradicional alternativa “Asareel” é registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura genealógica concisa. Os nomes foram transliterados em formas legíveis para o público lusófono. O marcador da nota foi colocado após “Asarel”, o nome ao qual a variante ortográfica efetivamente se refere.
