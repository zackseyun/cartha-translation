base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/026.yaml
  text: 'The sons of Mishma: Hammuel his son, Zaccur his son, Shimei his son.'
translation:
  language: pt
  text: 'Os filhos de Misma: Hamuel, seu filho; Zacur, seu filho; Simei, seu filho.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Os filhos de
  rationale: בְּנֵי é o plural construto de “filhos”. A conjunção וּ não precisa ser explicitada em português, pois o versículo continua uma lista genealógica e a omissão produz uma formulação mais natural sem alterar o sentido.
- source_word: מִשְׁמָע
  choice: Misma
  rationale: Nome próprio transliterado segundo formas correntes e legíveis em português.
- source_word: חַמּוּאֵל
  choice: Hamuel
  rationale: Nome próprio transliterado de modo natural em português, preservando a forma consonantal hebraica.
- source_word: בְּנוֹ
  choice: seu filho
  rationale: A expressão hebraica significa literalmente “seu filho” e, repetida, apresenta a sucessão genealógica sem substituir a relação por “descendente”.
- source_word: זַכּוּר
  choice: Zacur
  rationale: Transliteração portuguesa convencional do nome hebraico.
- source_word: שִׁמְעִי
  choice: Simei
  rationale: Transliteração portuguesa convencional, coerente com a vocalização massorética.
