  text: בְּנֵ֖י יְהוּדָ֑ה פֶּ֧רֶץ חֶצְר֛וֹן וְ/כַרְמִ֖י וְ/ח֥וּר וְ/שׁוֹבָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/001.yaml
  text: 'The sons of Judah: Perez[a], Hezron, Carmi, Hur, and Shobal.'
translation:
  language: pt
  text: 'Os filhos de Judá: Perez[a], Hezrom, Carmi, Hur e Sobal.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “filhos de” pode indicar filhos diretos ou, de modo mais amplo, descendentes.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: filhos de
  rationale: É o equivalente direto do plural construto de בֵּן e preserva a forma genealógica hebraica; neste contexto, porém, pode abranger descendentes, não apenas filhos imediatos.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma portuguesa consagrada do nome do patriarca e da tribo.
- source_word: פֶּרֶץ
  choice: Perez
  rationale: Transliteração moderna e corrente em português do nome hebraico.
- source_word: חֶצְרוֹן
  choice: Hezrom
  rationale: Forma bíblica corrente em português, ajustada à ortografia e à pronúncia portuguesas.
- source_word: כַרְמִי
  choice: Carmi
  rationale: Transliteração corrente do nome próprio hebraico.
- source_word: חוּר
  choice: Hur
  rationale: Transliteração corrente do nome próprio hebraico.
- source_word: שׁוֹבָל
  choice: Sobal
  rationale: Forma portuguesa corrente, representando o hebraico שׁוֹבָל sem conservar a grafia inglesa com 'sh'.
- source_word: וְ
  choice: e
  rationale: As conjunções repetidas formam uma lista simples; em português natural, usam-se vírgulas e a conjunção antes do último nome.
theological_decisions:
- issue: Relação genealógica expressa por בְּנֵי
  choice: Manter “filhos de” no texto e esclarecer sua amplitude em nota.
  alternative: Traduzir “descendentes de”.
  rationale: A formulação literal preserva a linguagem genealógica do hebraico, enquanto a nota evita restringi-la indevidamente a filhos diretos, questão relevante porque a lista não corresponde simplesmente aos filhos imediatos de Judá.
translation_notes:
  register: Português moderno, claro e digno, com formas de nomes reconhecíveis para leitores brasileiros e amplamente compreensíveis no espaço lusófono. A estrutura nominal concisa do hebraico foi preservada.
