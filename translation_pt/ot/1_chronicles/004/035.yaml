lexical_decisions:
- source_word: וְ
  choice: e
  rationale: A conjunção prefixada liga Joel e a genealogia seguinte à lista anterior; a tradução direta preserva a estrutura em série.
- source_word: יוֹאֵל
  choice: Joel
  rationale: Nome próprio vertido segundo a forma bíblica tradicional e reconhecível em português.
- source_word: וְ
  choice: e
  rationale: A segunda conjunção introduz outra pessoa na lista e preserva o encadeamento genealógico.
- source_word: יֵהוּא
  choice: Jeú
  rationale: Forma consagrada em português para o nome hebraico Yehu.
- source_word: בֶּן
  choice: filho de
  rationale: Na fórmula genealógica, o sentido imediato é de filiação, embora o termo possa designar um descendente mais remoto em certos contextos.
- source_word: יֹשִׁבְיָה
  choice: Josibias
  rationale: Forma portuguesa tradicional e legível do nome próprio hebraico.
- source_word: בֶּן
  choice: filho de
  rationale: Mantém com transparência e consistência a fórmula genealógica repetida.
- source_word: שְׂרָיָה
  choice: Seraías
  rationale: Forma portuguesa bíblica reconhecível do nome hebraico.
- source_word: בֶּן
  choice: filho de
  rationale: Tradução consistente do marcador genealógico repetido.
- source_word: עֲשִׂיאֵל
  choice: Asiel
  rationale: Transliteração concisa e natural em português do nome próprio hebraico.
