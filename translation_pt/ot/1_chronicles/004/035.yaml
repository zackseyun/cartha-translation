  text: E Joel, e Jeú, filho de Josibias, filho de Seraías, filho de Asiel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico “filho de” pode, em alguns contextos genealógicos, significar um descendente mais remoto; aqui, a fórmula foi traduzida literalmente.
