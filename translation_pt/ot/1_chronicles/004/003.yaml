base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/003.yaml
  text: 'These were the sons of the father of Etam: Jezreel[a], Ishma, and Idbash[b]; and the name of their sister was Hazzelelponi.'
translation:
  language: pt
  text: 'Estes foram os filhos do pai de Etã[a]: Jezreel, Isma e Idbás; e o nome da irmã deles era Hazelelponi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico traz uma construção incomum, literalmente próxima de “Estes: o pai de Etã, Jezreel, Isma e Idbás”. “Filhos” está implícito na tradução; “pai de Etã” também pode ter o sentido mais amplo de “ancestral de Etã” ou “fundador de Etã”.'
    reason: textual_and_lexical_ambiguity
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Estes foram
  rationale: Introduz naturalmente a nota genealógica. A conjunção hebraica não precisa ser reproduzida por “e” em português neste início de unidade.
- source_word: אֲבִי עֵיטָם
  choice: do pai de Etã
  rationale: Mantém a formulação do texto massorético e sua possível amplitude genealógica, sem decidir se se trata de pai imediato, ancestral ou fundador.
- source_word: יִזְרְעֶאל וְיִשְׁמָא וְיִדְבָּשׁ
  choice: Jezreel, Isma e Idbas
  rationale: Emprega formas portuguesas claras e reconhecíveis dos nomes próprios, preservando a estrutura da lista.
- source_word: וְשֵׁם אֲחוֹתָם
  choice: e o nome da irmã deles era
  rationale: Reproduz de modo natural a construção nominal hebraica e conserva o sufixo plural, que remete aos homens mencionados.
- source_word: הַצְלֶלְפּוֹנִי
  choice: Hazelelponi
  rationale: Adota uma forma tradicional e legível em português para o nome feminino hebraico.
- source_word: '[relação plural implícita antes de אֲבִי עֵיטָם]'
  choice: os filhos
  rationale: O hebraico apresenta uma construção elíptica e difícil; a explicitação produz uma frase gramatical em português e corresponde à relação plural exigida pelos três nomes seguintes, sem ocultar a dificuldade textual, que é indicada em nota.
