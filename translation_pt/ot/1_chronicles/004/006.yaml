base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/006.yaml
  text: Naarah bore to him Ahuzzam[a], Hepher, Temeni, and Haahashtari[b]. These were the sons of Naarah.
translation:
  language: pt
  text: Naará lhe deu à luz Auzã, Héfer, Temeni[a] e Haastari[b]. Esses foram os filhos de Naará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Temeni também pode ser entendido como um nome de valor adjetival, como “temenita” ou “sulista”; nesta genealogia, porém, é apresentado como nome pessoal.
    reason: lexical_alternative
  - marker: b
    text: Haastari também pode ser transliterado “Aastari”. A forma hebraica inclui o artigo prefixado, que talvez tenha se fixado como parte do nome.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד לוֹ
  choice: lhe deu à luz
  rationale: A fórmula genealógica conserva Naará como sujeito materno e o pronome indireto referente ao pai mencionado no contexto, sem explicitar além do hebraico a relação dele.
- source_word: נַעֲרָה
  choice: Naará
  rationale: Nome próprio transliterado em forma legível em português, com acento para orientar a pronúncia.
- source_word: אֲחֻזָּם
  choice: Auzão
  rationale: Forma portuguesa tradicional e legível do nome hebraico, em vez de uma transliteração inglesa.
- source_word: חֵפֶר
  choice: Héfer
  rationale: Transliteração portuguesa do nome próprio, com acento gráfico para indicar a tonicidade.
- source_word: תֵּימְנִי
  choice: Temeni
  rationale: No contexto desta genealogia, a forma é tratada como nome pessoal, preservando sem resolver totalmente sua possível força adjetival.
- source_word: הָאֲחַשְׁתָּרִי
  choice: Haastari
  rationale: A transliteração preserva o ה inicial, que pode representar o artigo incorporado à forma do nome, e evita interpretá-lo como título ou gentílico.
- source_word: בְּנֵי
  choice: filhos de
  rationale: No resumo genealógico, o termo designa especificamente os filhos homens listados, não genericamente crianças ou descendentes.
