  text: וּ/מְעוֹנֹתַ֖י הוֹלִ֣יד אֶת עָפְרָ֑ה וּ/שְׂרָיָ֗ה הוֹלִ֤יד אֶת יוֹאָב֙ אֲבִי֙ גֵּ֣יא חֲרָשִׁ֔ים כִּ֥י חֲרָשִׁ֖ים הָיֽוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/014.yaml
  text: Meonothai fathered Ophrah[a], and Seraiah fathered Joab, the father of Ge-harashim[b], for they were craftsmen.
translation:
  language: pt
  text: Meonotai gerou Ofra, e Seraías gerou Joabe, pai de Ge-Harasim[a], pois eles eram artesãos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ge-Harasim provavelmente significa “Vale dos Artesãos”. “Pai de” também pode significar “fundador de” ou “chefe ancestral de” nesse tipo de registro genealógico.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעוֹנֹתַי
  choice: Meonotai
  rationale: Nome próprio pessoal, transliterado de modo legível em português.
- source_word: הוֹלִיד
  choice: gerou
  rationale: No contexto genealógico, o hifil de ילד expressa descendência; “gerou” é conciso, digno e tradicionalmente compreensível em português.
- source_word: עָפְרָה
  choice: Ofra
  rationale: Nome próprio transliterado segundo formas naturais em português.
- source_word: שְׂרָיָה
  choice: Seraías
  rationale: Nome próprio transliterado em forma corrente e legível em português.
- source_word: יוֹאָב
  choice: Joabe
  rationale: Forma portuguesa tradicional e amplamente reconhecível do nome próprio.
- source_word: אֲבִי
  choice: pai de
  rationale: Mantém a formulação hebraica, que pode indicar pai, ancestral ou fundador, sem resolver indevidamente a relação.
- source_word: גֵּיא חֲרָשִׁים
  choice: Ge-Harasim
  rationale: Preserva como topônimo a expressão hebraica, cuja explicação é dada pela oração seguinte.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente em português a explicação do nome do lugar.
- source_word: חֲרָשִׁים
  choice: artesãos
  rationale: Designa de maneira ampla trabalhadores habilidosos, sem restringir o sentido a ferreiros ou a outro ofício específico.
- source_word: הָיוּ
  choice: eles eram
  rationale: Preserva a construção copulativa e a referência coletiva implícita no contexto.
theological_decisions: []
