base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/042.yaml
  text: And some of them[a], from the sons of Simeon, went to Mount Seir—five hundred men—with Pelatiah, Neariah, Rephaiah, and Uzziel, sons of Ishi, at their head.
translation:
  language: pt
  text: 'Alguns deles, dos filhos de Simeão, foram ao monte Seir: quinhentos homens, com Pelatias, Nearias, Refaías e Uziel, filhos de Isi, à frente deles.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “à cabeça deles”. A expressão indica que Pelatias, Nearias, Refaías e Uziel lideravam o grupo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵהֶם מִן בְּנֵי שִׁמְעוֹן
  choice: Alguns deles, dos filhos de Simeão
  rationale: A construção hebraica introduz um subconjunto do grupo mencionado anteriormente. “Alguns deles” expressa naturalmente o sentido partitivo, enquanto “filhos de Simeão” conserva a linguagem genealógica do cronista.
- source_word: הָלְכוּ לְהַר שֵׂעִיר
  choice: foram ao monte Seir
  rationale: Mantém o verbo simples de movimento e o topônimo tradicional, sem acrescentar uma ideia militar ausente do hebraico.
- source_word: אֲנָשִׁים חֲמֵשׁ מֵאוֹת
  choice: quinhentos homens
  rationale: Reproduz diretamente a aposição numérica que indica o tamanho do grupo.
- source_word: וּפְלַטְיָה וּנְעַרְיָה וּרְפָיָה וְעֻזִּיאֵל
  choice: Pelatias, Nearias, Refaías e Uziel
  rationale: Usa formas portuguesas transparentes dos nomes hebraicos e integra a lista à expressão seguinte de liderança.
- source_word: בְּנֵי יִשְׁעִי
  choice: filhos de Isi
  rationale: Preserva a identificação genealógica dos quatro homens.
- source_word: בְּרֹאשָׁם
  choice: tendo à frente
  rationale: Expressa de modo natural a imagem hebraica, literalmente “à cabeça deles”, indicando que os filhos de Isi lideravam o grupo.
