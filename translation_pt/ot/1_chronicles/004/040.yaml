base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/040.yaml
  text: And they found rich and good pasture[a], and the land was broad, quiet, and peaceful, for those from Ham who had lived there formerly were there before.
translation:
  language: pt
  text: Encontraram pastagens férteis e boas, e a terra era espaçosa, tranquila e pacífica, pois os descendentes de Cam habitavam ali antigamente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois os que habitavam ali antigamente eram de Cam”.'
    reason: A construção hebraica identifica os habitantes anteriores como sendo de Cam, sem empregar explicitamente o substantivo “descendentes”.
lexical_decisions:
- source_word: מִרְעֶה
  choice: pastagens
  rationale: O substantivo designa lugar ou terreno de pastoreio; o plural soa natural em português neste contexto de procura de alimento para os rebanhos.
- source_word: שָׁמֵן
  choice: férteis
  rationale: Literalmente, “gordas”; aplicado a pastagens, indica abundância e produtividade. “Férteis” comunica o sentido sem reproduzir uma expressão pouco natural.
- source_word: טוֹב
  choice: boas
  rationale: Preserva a avaliação simples e ampla do hebraico e combina naturalmente com “férteis”.
- source_word: רַחֲבַת יָדַיִם
  choice: espaçosa
  rationale: A expressão idiomática, literalmente relacionada a ser larga em extensão, descreve uma terra ampla e com bastante espaço.
- source_word: שֹׁקֶטֶת
  choice: tranquila
  rationale: Descreve a terra como sossegada, sem perturbação.
- source_word: שְׁלֵוָה
  choice: pacífica
  rationale: Pode indicar sossego, segurança ou condição despreocupada; em paralelo com “tranquila”, “pacífica” expressa a ausência de conflito sem acrescentar prosperidade econômica.
- source_word: כִּי מִן חָם הַיֹּשְׁבִים שָׁם לְפָנִים
  choice: pois os descendentes de Cam habitavam ali antigamente
  rationale: O hebraico identifica os antigos habitantes como provenientes de Cam. “Descendentes” torna explícita, em português natural, a relação genealógica implícita em “de Cam”, enquanto “antigamente” traduz לְפָנִים.
- source_word: חָם
  choice: Cam
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
