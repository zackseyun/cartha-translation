base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/039.yaml
  text: They went to the entrance of Gedor[a], as far as the east side of the valley[b], to seek pasture for their flocks.
translation:
  language: pt
  text: Eles foram até a entrada de Gedor[a], chegando ao lado leste do vale[b], à procura de pastagem para os seus rebanhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “até o acesso a Gedor”; o termo hebraico pode indicar entrada, acesso ou lugar por onde se entra.
    reason: lexical_alternative
  - marker: b
    text: Ou “a leste do vale” ou “em direção ao leste do vale”; a expressão hebraica é uma indicação topográfica compacta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: Eles foram
  rationale: O wayyiqtol de הלך dá continuidade à narrativa; “foram” é a forma direta e natural em português.
- source_word: לִמְבוֹא גְדֹר
  choice: até a entrada de Gedor
  rationale: מָבוֹא pode indicar entrada, acesso ou lugar por onde se entra. A expressão mantém o sentido espacial sem tentar identificar com maior precisão uma geografia incerta.
- source_word: עַד לְמִזְרַח הַגָּיְא
  choice: chegando ao lado leste do vale
  rationale: עַד marca a extensão espacial, enquanto a construção compacta לְמִזְרַח הַגָּיְא pode indicar o lado leste, o leste ou a direção leste do vale. A redação é natural e a nota preserva as alternativas.
- source_word: לְבַקֵּשׁ מִרְעֶה
  choice: à procura de pastagem
  rationale: O infinitivo expressa propósito. “À procura de pastagem” é corrente em português e comunica a busca por terreno onde os animais pudessem pastar.
- source_word: לְצֹאנָם
  choice: para os seus rebanhos
  rationale: צֹאן pode abranger ovelhas e cabras coletivamente; “rebanhos” evita restringir indevidamente a espécie.
