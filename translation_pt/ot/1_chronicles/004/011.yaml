  text: וּ/כְל֥וּב אֲחִֽי שׁוּחָ֖ה הוֹלִ֣יד אֶת מְחִ֑יר ה֖וּא אֲבִ֥י אֶשְׁתּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/011.yaml
  text: Chelub[a], the brother of Shuhah, fathered Mehir; he was the father of Eshton.
translation:
  language: pt
  text: Quelube, irmão de Suá, gerou Meir; este foi o pai de Estom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ancestral de Estom” ou “fundador de Estom”. Nas listas genealógicas, “pai de” pode às vezes indicar o ancestral de um clã ou o fundador de um povoado, e não necessariamente o pai biológico imediato.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/כְל֥וּב
  choice: Quelube
  rationale: Nome próprio transliterado em forma natural para leitores de português; a conjunção inicial não precisa ser explicitada neste registro genealógico isolado.
- source_word: אֲחִֽי שׁוּחָ֖ה
  choice: irmão de Suá
  rationale: Reproduz diretamente a relação de parentesco expressa pela cadeia construta hebraica.
- source_word: הוֹלִ֣יד
  choice: gerou
  rationale: No contexto genealógico, o hifil de ילד indica gerar descendência; “gerou” é conciso, atual e adequado ao registro bíblico.
- source_word: מְחִ֑יר
  choice: Meir
  rationale: Transliteração portuguesa do nome próprio hebraico, preservando a fricativa representada por ח sem impor uma grafia inglesa.
- source_word: ה֖וּא
  choice: este
  rationale: Retoma claramente Meir, o referente mais próximo, e evita possível ambiguidade em português sobre quem era pai de Estom.
- source_word: אֲבִ֥י
  choice: o pai de
  rationale: Mantém o sentido básico de אב, sem excluir sua possível extensão genealógica como ancestral ou fundador.
- source_word: אֶשְׁתּֽוֹן
  choice: Estom
  rationale: Transliteração adaptada à fonologia e ortografia portuguesas do nome próprio hebraico.
theological_decisions:
- issue: Amplitude genealógica de אֲבִי
  choice: pai de
  alternative: ancestral de / fundador de
  rationale: A tradução principal conserva o sentido lexical direto, enquanto a nota registra a amplitude possível em listas genealógicas sem decidir além da evidência.
translation_notes:
  register: Português moderno, claro e digno, com concisão própria de uma lista genealógica. Os nomes foram adaptados à leitura portuguesa, e a possível amplitude de “pai” foi preservada em nota.
