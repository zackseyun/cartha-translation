base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/017.yaml
  text: 'The sons of Ezrah: Jether[a], Mered, Epher, and Jalon; and she conceived Miriam, Shammai, and Ishbah[c][b], the father of Eshtemoa.'
translation:
  language: pt
  text: 'E os filhos de Ezra[a]: Jéter, Merede, Éfer e Jalom. Ela concebeu[b] Miriã, Samai e Isbá, pai de Estemoa[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente: “E o filho de Ezra”. Como vários nomes vêm em seguida, a expressão é geralmente entendida em sentido coletivo: “os filhos de Ezra”.'
    reason: textual_variant
  - marker: b
    text: O hebraico diz apenas “ela concebeu”; a mulher não é identificada nesta oração.
    reason: lexical_alternative
  - marker: c
    text: Ou “fundador de Estemoa”, caso Estemoa seja entendido como um clã ou povoado, e não como uma pessoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן
  choice: E os filhos de
  rationale: Embora a forma hebraica esteja no singular, “filho”, ela introduz vários nomes. O plural funciona naturalmente como cabeçalho genealógico; a forma singular literal é preservada em nota.
- source_word: עֶזְרָה
  choice: Ezra
  rationale: Nome próprio transliterado em forma reconhecível em português.
- source_word: יֶתֶר וּמֶרֶד וְעֵפֶר וְיָלוֹן
  choice: Jéter, Merede, Éfer e Jalom
  rationale: Nomes próprios transliterados com grafia e acentuação adequadas à leitura em português.
- source_word: וַתַּהַר
  choice: Ela concebeu
  rationale: O verbo significa “conceber” ou “ficar grávida”. A forma feminina é mantida, sem identificar a mulher, pois o hebraico deste versículo não explicita quem ela é.
- source_word: מִרְיָם וְשַׁמַּי וְיִשְׁבָּח
  choice: Miriã, Samai e Isbá
  rationale: Nomes próprios transliterados; Miriã é mantido como aparece na lista, sem inferir gênero além do que o texto declara.
- source_word: אֲבִי אֶשְׁתְּמֹעַ
  choice: pai de Estemoa
  rationale: Tradução formal e transparente da expressão hebraica. Em contexto genealógico, “pai” também pode indicar fundador ou antepassado de um clã ou povoado, possibilidade registrada em nota.
