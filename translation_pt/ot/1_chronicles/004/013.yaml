base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/013.yaml
  text: 'The sons of Kenaz: Othniel and Seraiah[a]. And the sons of Othniel: Hathath.'
translation:
  language: pt
  text: 'Os filhos de Quenaz: Otniel e Seraías. E os filhos de Otniel: Hatate.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי קְנַז
  choice: Os filhos de Quenaz
  rationale: A fórmula genealógica com o plural construto de בֵּן é traduzida de modo transparente; a conjunção inicial não precisa ser explicitada na abertura de uma nova linha genealógica.
- source_word: עָתְנִיאֵל
  choice: Otniel
  rationale: Forma tradicional e reconhecível do nome em português.
- source_word: וּשְׂרָיָה
  choice: e Seraías
  rationale: Nome próprio com conjunção prefixada; 'Seraías' é a forma tradicional em português correspondente ao hebraico שְׂרָיָה.
- source_word: וּבְנֵי עָתְנִיאֵל
  choice: E o filho de Otniel
  rationale: Embora בְנֵי seja formalmente plural, aparece seguido de apenas um nome; o singular produz uma genealogia natural em português, enquanto a nota preserva a forma hebraica.
- source_word: חֲתַת
  choice: Hatate
  rationale: Transliteração portuguesa do nome próprio hebraico, com h inicial para representar a consoante ח.
