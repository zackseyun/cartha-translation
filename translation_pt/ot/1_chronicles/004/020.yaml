base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/020.yaml
  text: 'The sons of Shimon: Amnon and Rinnah[a], Ben-Hanan and Tilon[b]. And the sons of Ishi: Zoheth and Ben-Zoheth.'
translation:
  language: pt
  text: 'Os filhos de Shimon: Amnom, Riná, Ben-Hanã[a] e Tilon. E os filhos de Ishi: Zoete e Ben-Zoete[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “filho de Hanã”. Nesta lista genealógica, porém, é provável que Ben-Hanã seja um nome próprio.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “filho de Zoete”. Nesta lista genealógica, porém, é provável que Ben-Zoete seja um nome próprio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי שִׁימוֹן
  choice: Os filhos de Shimon
  rationale: A fórmula genealógica é traduzida diretamente por “os filhos de”. O nome é transliterado segundo a forma hebraica presente no texto, sem substituí-lo automaticamente pela forma tradicional “Simeão”.
- source_word: אַמְנוֹן וְרִנָּה
  choice: Amnom, Riná
  rationale: Os nomes próprios são transliterados de modo legível em português; o acento em “Riná” indica a tonicidade final da forma hebraica.
- source_word: בֶּן חָנָן
  choice: Ben-Hanã[a]
  rationale: No contexto desta sequência genealógica, a expressão provavelmente funciona como nome próprio composto. A nota preserva a possibilidade de entendê-la literalmente como “filho de Hanã”.
- source_word: ו/תולון
  choice: e Tilom
  rationale: O nome próprio é transliterado de acordo com a vocalização massorética e adaptado à ortografia portuguesa.
- source_word: וּבְנֵי יִשְׁעִי
  choice: E os filhos de Ishi
  rationale: Mantém-se tanto a conjunção hebraica quanto a repetição da fórmula genealógica, sem ampliar “filhos” para “descendentes”.
- source_word: זוֹחֵת
  choice: Zoete
  rationale: Transliteração do nome próprio em forma natural para leitores de português.
- source_word: וּבֶן זוֹחֵת
  choice: e Ben-Zoete[b]
  rationale: A posição final numa lista de nomes e a ausência de outro nome depois de “filho de” favorecem a leitura da expressão inteira como nome próprio; a alternativa literal é registrada em nota.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com estrutura concisa própria de uma lista genealógica. Os nomes foram transliterados com adaptação moderada à leitura portuguesa, e as duas construções ambíguas com ben (“filho”) foram mantidas como nomes compostos no texto e explicadas em notas.
