  text: וְ/זִיזָ֨א בֶן שִׁפְעִ֧י בֶן אַלּ֛וֹן בֶּן יְדָיָ֥ה בֶן שִׁמְרִ֖י בֶּן שְׁמַֽעְיָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/037.yaml
  text: and Ziza son of Shiphi[a], son of Allon, son of Jedaiah, son of Shimri, son of Shemaiah.
translation:
  language: pt
  text: E Ziza, filho de Sifi, filho de Alom, filho de Jedaías, filho de Sinri, filho de Semaías.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזִיזָא
  choice: e Ziza
  rationale: A conjunção וְ dá continuidade à lista genealógica e é traduzida por “e”. O nome próprio זִיזָא é transliterado como “Ziza”; o texto hebraico termina em álef, portanto não há motivo para acrescentar um h final em português.
- source_word: בֶן
  choice: filho de
  rationale: A fórmula genealógica hebraica é reproduzida diretamente, mantendo-se cada ocorrência para deixar clara a sequência de ascendência.
- source_word: שִׁפְעִי
  choice: Sifi
  rationale: Forma portuguesa legível do nome próprio, aproximando seus sons sem inserir uma pausa gráfica artificial para representar a consoante gutural.
- source_word: אַלּוֹן
  choice: Alom
  rationale: O termo funciona aqui como nome pessoal, não como o substantivo comum “carvalho”. A grafia “Alom” segue uma adaptação natural ao português.
- source_word: יְדָיָה
  choice: Jedaías
  rationale: Forma bíblica portuguesa reconhecível, com acento gráfico para indicar a pronúncia e preservar a terminação teofórica do nome.
- source_word: שִׁמְרִי
  choice: Sinri
  rationale: Transliteração adaptada à fonologia e à tradição gráfica portuguesa; o n diante de r torna a forma mais natural e pronunciável em português.
- source_word: שְׁמַעְיָה
  choice: Semaías
  rationale: Forma portuguesa clara e tradicional do nome, com acento gráfico que orienta corretamente a pronúncia.
theological_decisions: []
translation_notes:
  register: Registro genealógico conciso e digno. A repetição de “filho de” preserva a estrutura encadeada do hebraico. Os nomes foram transliterados em formas naturais e reconhecíveis para leitores de português, sem traduzir seus possíveis significados etimológicos.
