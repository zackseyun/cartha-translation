lexical_decisions:
- source_word: וּ/בִ/בְתוּאֵל
  choice: e em Betuel
  rationale: A conjunção וּ dá continuidade à lista, e a preposição ב indica localização. בְתוּאֵל é aqui um topônimo, transliterado segundo o uso corrente em português como “Betuel”.
- source_word: וּ/בְ/חָרְמָה
  choice: em Hormá
  rationale: A preposição ב é vertida por “em”. O וּ coordenativo é representado pela estrutura natural da enumeração em português, sem repetir “e” diante de cada nome. חָרְמָה é o topônimo “Hormá”.
- source_word: וּ/בְ/צִיקְלָג
  choice: e em Ziclague
  rationale: A conjunção final é expressa por “e”, conforme a coordenação natural em português, e ב por “em”. צִיקְלָג é transliterado pela forma portuguesa consagrada “Ziclague”.
