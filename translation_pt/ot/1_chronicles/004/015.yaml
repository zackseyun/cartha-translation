  text: וּ/בְנֵי֙ כָּלֵ֣ב בֶּן יְפֻנֶּ֔ה עִ֥ירוּ אֵלָ֖ה וָ/נָ֑עַם וּ/בְנֵ֥י אֵלָ֖ה וּ/קְנַֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/015.yaml
  text: 'And the sons of Caleb son of Jephunneh: Iru[a], Elah, and Naam; and the sons of Elah: Kenaz.'
translation:
  language: pt
  text: 'E os filhos de Calebe, filho de Jefoné, foram Iru, Elá e Naã; e os filhos de Elá: Quenaz.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי כָּלֵב
  choice: E os filhos de Calebe
  rationale: בְּנֵי significa mais diretamente “filhos de” nesta lista genealógica. A conjunção inicial foi preservada para manter a ligação com o contexto anterior.
- source_word: בֶּן יְפֻנֶּה
  choice: filho de Jefoné
  rationale: Aposição genealógica que identifica Calebe; a forma portuguesa segue a grafia bíblica corrente e legível.
- source_word: עִירוּ
  choice: Iru
  rationale: Transliteração simples do nome próprio hebraico.
- source_word: אֵלָה
  choice: Elá
  rationale: O contexto e a forma indicam um nome pessoal; a acentuação gráfica orienta a pronúncia portuguesa.
- source_word: וָנָעַם
  choice: e Naã
  rationale: A vocalização massorética sustenta o nome masculino Naã, não a forma distinta Naamá.
- source_word: וּבְנֵי אֵלָה
  choice: e o filho de Elá
  rationale: Embora בְּנֵי esteja formalmente no plural, o texto preservado menciona apenas Quenaz. O singular natural em português comunica a lista efetivamente apresentada, enquanto a nota registra a forma hebraica.
- source_word: וּקְנַז
  choice: Quenaz
  rationale: Forma portuguesa tradicional e foneticamente clara do nome próprio hebraico.
