  naturalness: A enumeração com a preposição repetida continua natural em português moderno e torna a sintaxe mais clara. «Essas eram as cidades deles até Davi reinar» é idiomático e mantém o tom histórico-genealógico.
  terminology: As transliterações Bete-Marcabote, Hazar-Susim, Bete-Biri e Saaraim são adequadas e consistentes. Na nota de Bete-Marcabote, «Casa dos Carros» é o equivalente etimológico mais estrito; «carros de guerra» acrescenta uma especificação não expressa no topônimo.
