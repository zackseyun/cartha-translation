  yaml_path: translation/ot/1_chronicles/004/031.yaml
  text: and in Beth-marcaboth[a], and in Hazar-susim, and in Beth-biri, and in Shaaraim[d][c][b]. These were their cities until David reigned.
translation:
  language: pt
  text: e em Bete-Marcabote[a], em Hazar-Susim[b], em Bete-Biri[c] e em Saaraim[d]. Essas eram as cidades deles até Davi reinar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bete-Marcabote pode ser traduzido mais literalmente como “Casa dos Carros”, mas aqui é tratado como nome de lugar.
    reason: lexical_alternative
  - marker: b
    text: Hazar-Susim pode ser traduzido mais literalmente como “Pátio dos Cavalos” ou “Aldeia dos Cavalos”, mas aqui é tratado como nome de lugar.
    reason: lexical_alternative
  - marker: c
    text: O nome Bete-Biri também pode ser transliterado como “Bete-Birei”.
    reason: alternative_reading
  - marker: d
    text: Saaraim talvez tenha o sentido etimológico de “Duas Portas”, mas aqui é tratado como nome de lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/בֵית מַרְכָּבוֹת
  choice: e em Bete-Marcabote
  rationale: O contexto identifica um topônimo; por isso, o nome é transliterado e adaptado à grafia portuguesa, em vez de ser traduzido pelos seus componentes.
- source_word: וּ/בַ/חֲצַר סוּסִים
  choice: Hazar-Susim
  rationale: Trata-se de outro topônimo na lista de localidades. A transliteração preserva o nome, enquanto a nota registra seus possíveis sentidos literais.
- source_word: וּ/בְ/בֵית בִּרְאִי
  choice: Bete-Biri
  rationale: A expressão é entendida como nome de lugar, em paralelo com os demais nomes. A transliteração segue uma forma clara e corrente em português.
- source_word: וּֽ/בְ/שַׁעֲרָיִם
  choice: Saaraim
  rationale: O nome da localidade é transliterado; seu possível sentido etimológico não é incorporado ao texto principal.
- source_word: אֵלֶּה עָרֵי/הֶם
  choice: Essas foram as cidades deles
  rationale: O demonstrativo retoma as localidades enumeradas, e עִיר recebe o equivalente direto e natural “cidade”.
- source_word: עַד מְלֹךְ דָּוִיד
  choice: até o reinado de Davi
  rationale: A construção marca um limite temporal. A formulação nominal é natural em português e preserva a referência ao período em que Davi reinou, sem especificar além do hebraico.
