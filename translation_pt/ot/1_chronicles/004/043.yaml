  text: E feriram o restante dos sobreviventes de Amaleque[a] e moraram ali até o dia de hoje.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o restante dos que haviam escapado dentre os amalequitas”. O hebraico combina dois termos de sentido próximo para aqueles que restaram depois da devastação.'
