lexical_decisions:
- source_word: וַיַּכּוּ
  choice: feriram
  rationale: Traduz נכה no contexto militar sem explicitar além do verbo hebraico se todos foram mortos; o objeto e o contexto indicam um golpe destrutivo.
- source_word: שְׁאֵרִית הַפְּלֵטָה
  choice: o restante dos sobreviventes
  rationale: Mantém os dois substantivos quase sinônimos do hebraico e sua ênfase nos que restaram após uma devastação anterior.
- source_word: לַעֲמָלֵק
  choice: de Amaleque
  rationale: Conserva o nome próprio, que aqui designa coletivamente o povo de Amaleque; 'dos amalequitas' é uma alternativa natural.
- source_word: וַיֵּשְׁבוּ
  choice: passaram a morar
  rationale: ישב pode significar morar ou estabelecer-se. A formulação expressa naturalmente o início da residência no local, em sequência narrativa.
- source_word: שָׁם
  choice: ali
  rationale: Advérbio locativo natural em português, retomando o lugar mencionado no contexto.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até o dia de hoje
  rationale: Expressão narrativa corrente que preserva o ponto de vista temporal do narrador.
