  text: These were the potters and the inhabitants of Netaim and Gederah[a]; they lived there with the king for his work.
translation:
  language: pt
  text: Esses eram os oleiros e os habitantes de Netaim e de Gederá[a]. Moravam ali com o rei, para o trabalho do rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: “Esses eram os oleiros e os que moravam entre plantações e cercados”. Os termos hebraicos Netaim e Gederá podem ser entendidos como nomes de lugares ou como substantivos comuns.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: Esses eram
  rationale: O pronome retoma o grupo mencionado anteriormente; em português, a cópula no passado torna natural a oração nominal hebraica.
- source_word: הַיּוֹצְרִים
  choice: os oleiros
  rationale: O particípio de יצר designa aqui, de modo mais específico e convencional, os artesãos que moldavam o barro.
- source_word: וְיֹשְׁבֵי
  choice: e os habitantes de
  rationale: O particípio em construção expressa residência estabelecida e introduz naturalmente os nomes geográficos.
- source_word: נְטָעִים
  choice: Netaim
  rationale: No contexto genealógico e geográfico, é provavelmente um topônimo, embora também possa significar literalmente «plantações».
- source_word: וּגְדֵרָה
  choice: e de Gederá
  rationale: É provavelmente um topônimo coordenado com Netaim; a repetição de «de» dá clareza em português. O sentido comum «muro/cercado» permanece possível e é registrado em nota.
- source_word: עִם הַמֶּלֶךְ
  choice: com o rei
  rationale: Preserva o sentido básico da preposição עִם e deixa que o contexto indique associação ou serviço real.
- source_word: בִּמְלַאכְתּוֹ
  choice: trabalhando para ele
  rationale: Expressa de modo natural que sua atividade estava vinculada ao trabalho ou serviço do rei, cujo referente é retomado por «ele».
- source_word: יָשְׁבוּ שָׁם
  choice: Moravam ali
  rationale: O verbo ישב com שָׁם indica residência; «moravam ali» é atual, claro e adequado ao contexto.
