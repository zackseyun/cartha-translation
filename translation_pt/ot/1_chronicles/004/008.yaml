base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/008.yaml
  text: Koz fathered Anub[a], Hazzobebah[b], and the families of Aharhel son of Harum.
translation:
  language: pt
  text: Coz gerou Anube, Hassobeba[a] e as famílias[b] de Aarel, filho de Harum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Zobeba”, se o artigo hebraico prefixado não for representado na transliteração.'
    reason: lexical_alternative
  - marker: b
    text: Neste contexto genealógico, “famílias” também pode ser traduzido por “clãs”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וֹץ
  choice: Coz
  rationale: Nome próprio transliterado de modo natural em português, seguindo diretamente a forma consonantal hebraica; não há artigo que justifique a forma alternativa Hacoz.
- source_word: הוֹלִ֔יד
  choice: gerou
  rationale: No contexto genealógico, o hifil de ילד indica geração ou descendência. “Gerou” é conciso, corrente em genealogias bíblicas e menos arcaico que “engendrou”.
- source_word: עָנ֖וּב
  choice: Anube
  rationale: Transliteração do nome próprio com vogal final para adequação natural à leitura portuguesa.
- source_word: הַ/צֹּבֵבָ֑ה
  choice: Hassobeba
  rationale: A forma representa o artigo hebraico prefixado e a consoante intensificada; “Zobeba” continua possível caso o artigo não seja incorporado à transliteração.
- source_word: וּ/מִשְׁפְּח֥וֹת
  choice: e as famílias
  rationale: Em listas genealógicas, מִשְׁפָּחוֹת designa grupos familiares. “Famílias” é claro e direto; “clãs” é uma alternativa contextual possível.
- source_word: אֲחַרְחֵ֖ל
  choice: Aarel
  rationale: Forma aportuguesada do nome próprio, evitando representar com h uma aspiração hebraica que não seria pronunciada naturalmente em português.
- source_word: בֶּן
  choice: filho de
  rationale: Expressão genealógica direta que liga Aarel a Harum.
- source_word: הָרֽוּם
  choice: Harum
  rationale: Transliteração de acordo com a vocalização massorética; preserva-se o h inicial convencional em nome próprio.
