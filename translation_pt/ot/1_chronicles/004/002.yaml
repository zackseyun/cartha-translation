  text: וּ/רְאָיָ֤ה בֶן שׁוֹבָל֙ הוֹלִ֣יד אֶת יַ֔חַת וְ/יַ֣חַת הֹלִ֔יד אֶת אֲחוּמַ֖י וְ/אֶת לָ֑הַד אֵ֖לֶּה מִשְׁפְּח֥וֹת הַ/צָּֽרְעָתִֽי־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/002.yaml
  text: Reaiah son of Shobal fathered Jahath[a], and Jahath fathered Ahumai and Lahad. These were the clans of the Zorathites.
translation:
  language: pt
  text: Reaías, filho de Sobal, gerou Jaate, e Jaate gerou Aumai e Laade. Esses foram os clãs dos zoratitas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “famílias dos zoratitas”. O termo hebraico pode designar grupos extensos de parentesco; “clãs” torna mais claro o sentido neste contexto genealógico tribal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאָיָה
  choice: Reaías
  rationale: Nome próprio transliterado conforme formas correntes em português, sem traduzir seu possível significado.
- source_word: בֶן
  choice: filho de
  rationale: Preserva a formulação genealógica direta; em genealogias, o termo pode por vezes abranger descendência mais ampla.
- source_word: הוֹלִיד / הֹלִיד
  choice: gerou
  rationale: O hifil de ילד indica gerar ou tornar-se pai em contexto genealógico; “gerou” é conciso, digno e tradicional sem ser obscuro.
- source_word: יַחַת
  choice: Jaate
  rationale: Transliteração portuguesa do nome próprio hebraico.
- source_word: אֲחוּמַי
  choice: Aumai
  rationale: Transliteração portuguesa do nome próprio hebraico, representando o alef inicial sem acrescentar consoante não expressa.
- source_word: לָהַד
  choice: Laade
  rationale: Transliteração portuguesa do nome próprio hebraico.
- source_word: אֵלֶּה
  choice: Esses
  rationale: Demonstrativo que retoma as pessoas mencionadas, sem acrescentar “homens”, ausente no hebraico.
- source_word: מִשְׁפְּחֹות
  choice: clãs
  rationale: No contexto tribal e genealógico, designa grupos extensos de parentesco, não apenas famílias nucleares.
- source_word: הַצָּרְעָתִי
  choice: dos zoratitas
  rationale: Gentílico derivado de Zorá; a forma plural portuguesa identifica o grupo ligado à localidade.
