source:
  edition: WLC
  text: וְ/חַצְרֵי/הֶם֙ עֵיטָ֣ם וָ/עַ֔יִן רִמּ֥וֹן וְ/תֹ֖כֶן וְ/עָשָׁ֑ן עָרִ֖ים חָמֵֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/032.yaml
  text: And their settlements were Etam[a], Ain, Rimmon, Tochen, and Ashan—five cities.
translation:
  language: pt
  text: E suas povoações eram Etã[a], Aim, Rimom, Toquém e Asã — cinco cidades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aldeias”. O termo hebraico pode designar povoações menores ou habitações cercadas.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַצְרֵיהֶם
  choice: suas povoações
  rationale: חָצֵר pode designar povoação, aldeia ou habitação cercada. No contexto desta lista geográfica, “povoações” é natural, abrangente e mantém a distinção em relação às “cidades” mencionadas no fim do versículo.
- source_word: עֵיטָם
  choice: Etã
  rationale: Nome geográfico transliterado segundo formas correntes em português bíblico, com representação natural da terminação hebraica.
- source_word: עַיִן
  choice: Aim
  rationale: Aqui é nome geográfico numa lista de localidades, não o substantivo comum “olho” ou “fonte”; a forma “Aim” é uma transliteração legível em português.
- source_word: רִמּוֹן
  choice: Rimom
  rationale: Nome geográfico transliterado; embora o substantivo possa significar “romã”, neste contexto designa uma localidade.
- source_word: תֹכֶן
  choice: Toquém
  rationale: Nome geográfico transliterado de modo natural para leitores de português, preservando o valor consonantal aproximado do hebraico.
- source_word: עָשָׁן
  choice: Asã
  rationale: Nome geográfico transliterado em forma natural e reconhecível em português.
- source_word: עָרִים חָמֵשׁ
  choice: cinco cidades
  rationale: עִיר significa normalmente “cidade” ou “localidade urbana”; “cinco cidades” conserva a formulação convencional e resume as cinco localidades enumeradas.
theological_decisions: []
