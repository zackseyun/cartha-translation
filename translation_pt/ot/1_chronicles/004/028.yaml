  text: Eles moravam em Berseba, Moladá e Hazar-Sual.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: Eles moravam
  rationale: O verbo ישׁב, no wayyiqtol plural, indica residência. “Moravam” é natural em português e, numa lista de povoações, evita sugerir necessariamente o ato inicial de se estabelecer.
- source_word: בִּבְאֵר שֶׁבַע
  choice: em Berseba
  rationale: Forma portuguesa tradicional e amplamente reconhecível do topônimo hebraico בְּאֵר שֶׁבַע.
- source_word: וּמוֹלָדָה
  choice: Moladá
  rationale: Transliteração do topônimo מוֹלָדָה, com acento gráfico para indicar a tonicidade final em português.
- source_word: וַחֲצַר שׁוּעָל
  choice: e Hazar-Sual
  rationale: Transliteração dos dois elementos do topônimo חֲצַר שׁוּעָל; o hífen deixa clara sua unidade como nome composto.
