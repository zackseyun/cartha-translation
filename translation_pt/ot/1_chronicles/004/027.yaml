source:
  edition: WLC
  text: וּ/לְ/שִׁמְעִ֞י בָּנִ֨ים שִׁשָּׁ֤ה עָשָׂר֙ וּ/בָנ֣וֹת שֵׁ֔שׁ וּ/לְ/אֶחָ֕י/ו אֵ֖ין בָּנִ֣ים רַבִּ֑ים וְ/כֹל֙ מִשְׁפַּחְתָּ֔/ם לֹ֥א הִרְבּ֖וּ עַד בְּנֵ֥י יְהוּדָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/027.yaml
  text: Shimei had sixteen sons and six daughters[a], but his brothers did not have many sons, and all their clans did not multiply as much as the sons of Judah.
translation:
  language: pt
  text: Simei teve dezesseis filhos e seis filhas. Seus irmãos, porém, não tiveram muitos filhos, e todos os seus clãs não se multiplicaram tanto quanto os descendentes de Judá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não se tornaram tão numerosos quanto os filhos de Judá”.'
    reason: Registra uma tradução alternativa de לֹא הִרְבּוּ עַד e conserva a expressão genealógica mais literal “filhos de Judá”.
lexical_decisions:
- source_word: וּלְשִׁמְעִי
  choice: Simei teve
  rationale: A construção com לְ introduz posse ou existência em contexto genealógico; em português corrente, sua forma natural é “Simei teve”.
- source_word: בָּנִים שִׁשָּׁה עָשָׂר וּבָנוֹת שֵׁשׁ
  choice: dezesseis filhos e seis filhas
  rationale: Mantém com exatidão os números e os vínculos familiares, com a ordem natural do português.
- source_word: וּלְאֶחָיו
  choice: Seus irmãos, porém
  rationale: Embora וּ seja formalmente aditivo, aqui introduz contraste entre a descendência de Simei e a de seus irmãos; “porém” torna essa relação discursiva explícita sem alterar o conteúdo.
- source_word: אֵין בָּנִים רַבִּים
  choice: não tiveram muitos filhos
  rationale: A construção existencial negativa indica que os irmãos não possuíam descendência masculina numerosa.
- source_word: וְכֹל מִשְׁפַּחְתָּם
  choice: e todos os seus clãs
  rationale: Em uma genealogia, מִשְׁפָּחָה designa melhor grupos extensos de parentesco ou clãs do que famílias nucleares.
- source_word: לֹא הִרְבּוּ
  choice: não se multiplicaram
  rationale: O Hifil de רבה expressa aumento numérico; “multiplicaram” preserva o sentido populacional e a linguagem genealógica.
- source_word: עַד בְּנֵי יְהוּדָה
  choice: tanto quanto os descendentes de Judá
  rationale: עַד indica aqui grau ou limite alcançado. “Descendentes de Judá” comunica naturalmente o valor genealógico de בְּנֵי יְהוּדָה.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A divisão em duas frases favorece a compreensão sem mudar a estrutura lógica do versículo. “Clãs” mantém a escala genealógica do termo hebraico, e “descendentes de Judá” evita que “filhos” seja entendido apenas como filhos imediatos.
