  text: בְּנֵי֙ שֵׁלָ֣ה בֶן יְהוּדָ֔ה עֵ֚ר אֲבִ֣י לֵכָ֔ה וְ/לַעְדָּ֖ה אֲבִ֣י מָרֵשָׁ֑ה וּ/מִשְׁפְּח֛וֹת בֵּית עֲבֹדַ֥ת הַ/בֻּ֖ץ לְ/בֵ֥ית אַשְׁבֵּֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/021.yaml
  text: 'The sons of Shelah son of Judah: Er the father of Lecah[a], and Laadah the father of Mareshah, and the clans of the house of linen workers of the house of Ashbea.'
translation:
  language: pt
  text: 'Os filhos de Selá, filho de Judá: Er, pai de Leca; Laada, pai de Maressa; e os clãs da casa dos que trabalhavam com linho fino, da casa de Asbeia.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão hebraica é condensada. Outra tradução possível é: “os clãs dos que trabalhavam com linho fino, de Bete-Asbeia”. Neste versículo, “pai de” também pode ter o sentido de “ancestral de” ou “fundador de”.'
    reason: Registra a ambiguidade sintática da expressão final e a amplitude semântica de אֲבִי em listas genealógicas e de povoados.
lexical_decisions:
- source_word: בְּנֵי
  choice: Os filhos de
  rationale: Mantém a linguagem genealógica concreta do hebraico; neste contexto, pode abranger descendentes.
- source_word: שֵׁלָה בֶן יְהוּדָה
  choice: Selá, filho de Judá
  rationale: Preserva explicitamente a relação genealógica expressa no texto hebraico.
- source_word: אֲבִי
  choice: pai de
  rationale: É a correspondência formal mais transparente, sem excluir os sentidos contextuais de ancestral ou fundador ligado a um povoado ou clã.
- source_word: לֵכָה
  choice: Leca
  rationale: Transliteração portuguesa do nome próprio, cuja identificação como pessoa, lugar ou clã não é explicitada pelo verso.
- source_word: לַעְדָּה
  choice: Laada
  rationale: Transliteração portuguesa do nome pessoal.
- source_word: מָרֵשָׁה
  choice: Maressa
  rationale: Forma portuguesa do topônimo ou nome de grupo preservado no texto genealógico.
- source_word: מִשְׁפְּחוֹת
  choice: os clãs
  rationale: Expressa melhor os grupos extensos de parentesco deste contexto tribal do que o uso moderno mais restrito de “famílias”.
- source_word: בֵּית עֲבֹדַת הַבֻּץ
  choice: a casa dos que trabalhavam com linho fino
  rationale: Comunica a associação doméstica ou corporativa e o ofício ligado ao בּוּץ, tecido de linho fino.
- source_word: לְבֵית אַשְׁבֵּעַ
  choice: da casa de Asbeia
  rationale: Preserva a repetição de “casa” e a associação indicada pela preposição לְ, sem decidir que Asbeia seja necessariamente um lugar chamado Bete-Asbeia.
