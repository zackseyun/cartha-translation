  text: וּ/פְנוּאֵל֙ אֲבִ֣י גְדֹ֔ר וְ/עֵ֖זֶר אֲבִ֣י חוּשָׁ֑ה אֵ֤לֶּה בְנֵי חוּר֙ בְּכ֣וֹר אֶפְרָ֔תָה אֲבִ֖י בֵּ֥ית לָֽחֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/004.yaml
  text: Penuel[a], the father of Gedor, and Ezer, the father of Hushah—these were the sons of Hur, the firstborn of Ephrathah[b], the father of Bethlehem.
translation:
  language: pt
  text: Penuel[b], pai[a] de Gedor, e Ézer, pai de Husá — estes foram os filhos de Hur, o primogênito de Efrata e pai de Belém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neste contexto genealógico, a expressão hebraica “pai de” também pode significar “fundador de” ou “antepassado de”, especialmente em relação a cidades ou clãs.
    reason: lexical_alternative
  - marker: b
    text: Em algumas outras passagens, “Penuel” aparece com a forma “Peniel”; trata-se de uma variante do mesmo nome.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְנוּאֵל
  choice: Penuel
  rationale: Nome próprio transliterado segundo a forma consonantal presente neste versículo; a variante Peniel é registrada em nota.
- source_word: אֲבִי
  choice: pai de
  rationale: Preserva a expressão genealógica hebraica, que neste contexto também pode indicar fundador, antepassado ou chefe ligado a uma localidade ou clã.
- source_word: גְדֹר
  choice: Gedor
  rationale: Nome próprio de localidade ou clã, transliterado.
- source_word: עֵזֶר
  choice: Ézer
  rationale: Nome pessoal transliterado com acento gráfico para favorecer a pronúncia natural em português.
- source_word: חוּשָׁה
  choice: Husá
  rationale: Nome próprio de localidade ou clã, transliterado de modo legível em português.
- source_word: אֵלֶּה בְנֵי
  choice: estes foram os filhos de
  rationale: A oração nominal hebraica recebe uma cópula no passado, natural no contexto genealógico; 'filhos' conserva a formulação do texto, embora possa ter sentido genealógico mais amplo.
- source_word: חוּר
  choice: Hur
  rationale: Nome pessoal transliterado.
- source_word: בְּכֹר
  choice: o primogênito de
  rationale: Reproduz o estado construto e a condição de Hur em relação a Efrata sem acrescentar explicitamente 'filho'.
- source_word: אֶפְרָתָה
  choice: Efrata
  rationale: Forma tradicional e inteligível em português para o nome próprio hebraico.
- source_word: בֵּית לָחֶם
  choice: Belém
  rationale: Emprega a forma consagrada em português para o topônimo, em vez de traduzir literalmente os elementos do nome.
theological_decisions:
- issue: Sentido genealógico de אֲבִי diante de nomes de localidades ou clãs
  choice: Manter 'pai de' no texto
  alternative: fundador de; antepassado de; chefe de
  rationale: A formulação literal preserva a ambiguidade e o idioma genealógico do hebraico, enquanto a nota informa o alcance semântico mais amplo sem decidir indevidamente entre pessoa, clã e localidade.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas onomásticas naturais para leitores brasileiros. A construção genealógica foi mantida compacta, e o travessão ajuda a tornar clara a retomada 'estes foram os filhos de Hur'.
