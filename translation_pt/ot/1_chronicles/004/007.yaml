base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/007.yaml
  text: 'And the sons of Helah: Zereth[a], Izhar[b], and Ethnan.'
translation:
  language: pt
  text: 'E os filhos de Helá: Zeret, Izar e Etnã.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: E os filhos de
  rationale: O וּ estabelece a ligação com a genealogia anterior, e בְנֵי é a fórmula genealógica plural no construto. “Filhos de” preserva a forma hebraica, embora em genealogias possa abranger descendentes ou integrantes de uma linhagem.
- source_word: חֶלְאָה
  choice: Helá
  rationale: Nome próprio transliterado segundo convenções naturais em português, com acento para orientar a pronúncia final.
- source_word: צֶרֶת
  choice: Zeret
  rationale: Transliteração portuguesa direta do nome próprio צֶרֶת; o ת final é representado por “t”, sem recorrer ao convencionalismo inglês “th”.
- source_word: יצחר
  choice: Izar
  rationale: A forma consonantal do texto massorético é incomum e admite incerteza de leitura. “Izar” oferece uma transliteração portuguesa legível, enquanto a nota registra a variante textual antiga “Zoar”.
- source_word: וְ/אֶתְנָן
  choice: e Etnã
  rationale: A conjunção prefixeda une o último nome da série. “Etnã” adapta אֶתְנָן às convenções fonológicas e gráficas do português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com nomes próprios adaptados a convenções de leitura portuguesas. Mantém-se a fórmula genealógica literal “filhos de”; a possível abrangência mais ampla de “descendentes” não foi explicitada no corpo por não ser necessária neste versículo. A nota foi colocada apenas no nome cuja forma hebraica apresenta dificuldade real.
