  text: וַ/יָּבֹ֡אוּ אֵלֶּה֩ הַ/כְּתוּבִ֨ים בְּ/שֵׁמ֜וֹת בִּ/ימֵ֣י יְחִזְקִיָּ֣הוּ מֶֽלֶךְ יְהוּדָ֗ה וַ/יַּכּ֨וּ אֶת אָהֳלֵי/הֶ֜ם וְ/אֶת ה/מעינים אֲשֶׁ֤ר נִמְצְאוּ שָׁ֨מָּ/ה֙ וַ/יַּחֲרִימֻ/ם֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה וַ/יֵּשְׁב֖וּ תַּחְתֵּי/הֶ֑ם כִּֽי מִרְעֶ֥ה לְ/צֹאנָ֖/ם שָֽׁם׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/041.yaml
  text: These[a], who were recorded by name, came in the days of Hezekiah king of Judah, and they struck down their tents and the Meunites who were found there, and devoted them to destruction to this day. Then they settled in their place, because there was pasture there for their flocks.
translation:
  language: pt
  text: Estes, que estavam registrados por nome, vieram nos dias de Ezequias, rei de Judá, e atacaram as tendas deles e os meunitas[a] que ali se encontravam. Eles os consagraram à destruição até o dia de hoje e se estabeleceram no lugar deles, pois ali havia pastagem para os seus rebanhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico הַמְּעִינִים é difícil. Tradicionalmente, é entendido como “os meunitas”, nome de um povo; outros o entendem como “as habitações” ou “as moradias”.
    reason: alternative_reading
lexical_decisions:
- source_word: הַכְּתוּבִים בְּשֵׁמוֹת
  choice: que estavam registrados por nome
  rationale: O particípio passivo com בְּשֵׁמוֹת indica pessoas inscritas nominalmente em um registro ou genealogia; a formulação é natural e mantém o sentido administrativo.
- source_word: וַיָּבֹאוּ
  choice: vieram
  rationale: בוא significa normalmente vir ou chegar; “vieram” acompanha com naturalidade a sequência narrativa.
- source_word: וַיַּכּוּ
  choice: atacaram
  rationale: נכה em contexto militar pode indicar golpear, atacar ou derrotar. “Atacaram” preserva a ação violenta sem afirmar além do texto que todos foram mortos.
- source_word: אָהֳלֵיהֶם
  choice: as tendas deles
  rationale: אֹהֶל é o termo comum para tenda e condiz com o cenário pastoril ou seminômade.
- source_word: המעינים
  choice: os meunitas
  rationale: A forma difícil é tradicionalmente entendida como gentílico, “meunitas”, leitura coerente com o ataque a um povo encontrado no local; a alternativa nominal é indicada em nota.
- source_word: אֲשֶׁר נִמְצְאוּ שָׁמָּה
  choice: que ali se encontravam
  rationale: Com “meunitas” como referente pessoal, a oração relativa é expressa de modo natural em português.
- source_word: וַיַּחֲרִימֻם
  choice: os consagraram à destruição
  rationale: O hifil de חרם indica colocar sob ḥerem, destinando à destruição. A tradução retém o caráter técnico e religioso do termo sem reduzi-lo simplesmente a “destruíram”.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: como permanecem até hoje
  rationale: No contexto, a fórmula temporal é ligada ao resultado da destruição; a redação explicita apenas o necessário para soar natural em português.
- source_word: וַיֵּשְׁבוּ תַּחְתֵּיהֶם
  choice: se estabeleceram no lugar deles
  rationale: תַּחְתֵּי com pessoas significa “no lugar de”; “se estabeleceram” comunica ocupação permanente do território.
- source_word: מִרְעֶה לְצֹאנָם
  choice: pastagem para os seus rebanhos
  rationale: מִרְעֶה é pastagem, e צֹאן abrange rebanhos de ovelhas e cabras, não apenas ovelhas.
theological_decisions:
- issue: Sentido técnico de חרם
  choice: consagraram à destruição
  alternative: destruíram completamente
  rationale: A escolha conserva tanto a dimensão de dedicação irrevogável quanto o resultado destrutivo, sem ocultar a tensão teológica do termo.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Mantêm-se o tom narrativo histórico, a violência explícita do episódio e a ambiguidade textual por meio de nota.
