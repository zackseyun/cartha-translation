  text: וַ/יְהִ֣י יַעְבֵּ֔ץ נִכְבָּ֖ד מֵ/אֶחָ֑י/ו וְ/אִמּ֗/וֹ קָרְאָ֨ה שְׁמ֤/וֹ יַעְבֵּץ֙ לֵ/אמֹ֔ר כִּ֥י יָלַ֖דְתִּי בְּ/עֹֽצֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/009.yaml
  text: Jabez was more honored than his brothers[a], and his mother called his name Jabez, saying[b], “Because I bore him in pain.”
translation:
  language: pt
  text: 'Jabez era mais honrado do que seus irmãos, e sua mãe lhe deu o nome de Jabez[a], dizendo: “Porque dei à luz com dor[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, o nome Jabez soa de modo semelhante a uma palavra associada a dor ou tristeza, formando um jogo de palavras com a explicação de sua mãe.
    reason: lexical_alternative
  - marker: b
    text: Ou “com tristeza”. A palavra hebraica עֹצֶב pode indicar dor, tristeza ou sofrimento.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: era
  rationale: A forma narrativa com היה introduz a afirmação sobre Jabez. O pretérito imperfeito expressa naturalmente o estado, sem acrescentar um marcador temporal ausente no hebraico.
- source_word: יַעְבֵּץ
  choice: Jabez
  rationale: Mantém a forma tradicional do nome próprio em português; a nota explica o jogo sonoro perceptível no hebraico.
- source_word: נִכְבָּד מֵאֶחָיו
  choice: mais honrado do que seus irmãos
  rationale: נִכְבָּד expressa a ideia de ser honrado ou estimado, e מִן marca a comparação. A formulação conserva diretamente ambos os elementos.
- source_word: וְאִמּוֹ
  choice: e sua mãe
  rationale: Tradução direta da conjunção e da construção possessiva.
- source_word: קָרְאָה שְׁמוֹ
  choice: lhe deu o nome de
  rationale: Equivalente idiomático e natural em português para a fórmula hebraica literalmente traduzida por 'chamou o nome dele'.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Forma corrente para introduzir a explicação dada pela mãe.
- source_word: כִּי
  choice: porque
  rationale: Apresenta como causa a experiência associada à escolha do nome.
- source_word: יָלַדְתִּי
  choice: dei à luz
  rationale: Expressão portuguesa natural para o ato de a mãe dar à luz; o hebraico não traz objeto explícito, por isso ele não foi acrescentado.
- source_word: בְּעֹצֶב
  choice: com dor
  rationale: עֹצֶב pode indicar dor, tristeza ou sofrimento. No contexto do parto, 'dor' oferece o sentido mais imediato, enquanto a nota preserva a amplitude semântica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção 'mais honrado do que' mantém a comparação explícita, enquanto 'lhe deu o nome de' traduz naturalmente a fórmula hebraica de nomeação. As notas preservam o jogo de palavras e a ambiguidade de עֹצֶב.
