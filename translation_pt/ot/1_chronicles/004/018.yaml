base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/018.yaml
  text: And his wife the Jewess bore Jered the father of Gedor[a], Heber the father of Soco, and Jekuthiel the father of Zanoah. These are the sons of Bithiah daughter of Pharaoh[c][b], whom Mered took as wife.
translation:
  language: pt
  text: E sua mulher, a judia[a], deu à luz Jerede, pai de Gedor[b], Héber, pai de Socó, e Jecutiel, pai de Zanoa. Estes são os filhos de Bitia, filha do faraó[c], a quem Merede tomou por esposa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a judeia”.
    reason: lexical_alternative
  - marker: b
    text: Em Crônicas, “pai de” também pode significar fundador, antepassado ou chefe de um clã ligado a determinado lugar.
    reason: lexical_alternative
  - marker: c
    text: O hebraico é difícil. Não está claro se “sua mulher, a judia” e Bitia, filha do faraó, são a mesma mulher ou duas mulheres diferentes de Merede.
    reason: alternative_reading
lexical_decisions:
- source_word: הַיְהֻדִיָּה
  choice: a judia
  rationale: O gentílico feminino designa naturalmente uma mulher judia ou judaíta. “A judia” é conciso e natural em português; a alternativa geográfica é registrada em nota.
- source_word: יָלְדָה
  choice: deu à luz
  rationale: Na fórmula genealógica, o verbo significa gerar ou dar à luz. Esta formulação é atual, clara e adequada à referência explícita à mãe.
- source_word: אֲבִי
  choice: pai de
  rationale: Preserva o idioma hebraico e evita decidir se a relação é de paternidade literal, ancestralidade, fundação ou chefia de um clã ou lugar.
- source_word: שׂוֹכוֹ
  choice: Socó
  rationale: Transliteração portuguesa clara do topônimo hebraico.
- source_word: יְקוּתִיאֵל
  choice: Jecutiel
  rationale: Transliteração adaptada às convenções e à legibilidade do português.
- source_word: זָנוֹחַ
  choice: Zanoa
  rationale: Forma portuguesa legível do topônimo hebraico.
- source_word: בְּנֵי
  choice: filhos
  rationale: Reproduz o termo masculino explícito do hebraico, sem ampliá-lo interpretativamente para “descendentes”.
- source_word: בִּתְיָה בַת פַּרְעֹה
  choice: Bitia, filha do faraó
  rationale: Mantém de forma explícita a relação expressa pela construção hebraica.
- source_word: לָקַח
  choice: se casou
  rationale: Embora o verbo signifique literalmente “tomou”, neste contexto matrimonial o sentido idiomático é casar-se ou tomar por esposa. A formulação evita em português a impressão equivocada de mera posse.
- source_word: וְאֵלֶּה
  choice: Esses foram
  rationale: Introduz naturalmente a identificação genealógica resumitiva em português, com o passado ajustado à narrativa.
theological_decisions:
- issue: Relação entre “sua mulher, a judia” e “Bitia, filha do faraó”
  choice: Manter a sequência do hebraico sem identificar nem distinguir explicitamente as duas designações.
  alternative: Entender “a judia” como a própria Bitia, ou interpretar as expressões como referências a duas mulheres diferentes.
  rationale: A sintaxe e a genealogia do versículo são difíceis. A tradução conserva a tensão do texto e a nota informa as principais possibilidades, sem harmonização conjectural.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas de nomes adaptadas ao uso português. A redação preserva a concisão genealógica e a ambiguidade sintática do original. Todos os marcadores de nota aparecem no texto.
