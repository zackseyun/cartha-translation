  text: וּ/בְנֵי֙ אֵ֣שֶׁת הֽוֹדִיָּ֔ה אֲח֣וֹת נַ֔חַם אֲבִ֥י קְעִילָ֖ה הַ/גַּרְמִ֑י וְ/אֶשְׁתְּמֹ֖עַ הַ/מַּעֲכָתִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/019.yaml
  text: And the sons of the wife of Hodiah[a], the sister of Naham[b], were the father of Keilah the Garmite and Eshtemoa the Maacathite.
translation:
  language: pt
  text: E os filhos da mulher de Hodias, irmã de Naã, foram o pai[a] de Queila, o garmita, e Estemoa, o maacatita.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em genealogias, a expressão hebraica “pai de” pode indicar o fundador, o ancestral ou o chefe de um clã, e não apenas o pai biológico imediato.
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz “filhos”, no plural, mas em seguida usa “pai”, no singular. A frase é condensada e pode resumir uma relação entre clãs, em vez de apresentar uma sequência simples de pai e filhos.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי
  choice: E os filhos de
  rationale: Mantém o sentido genealógico mais direto de בנים, embora o termo também possa abranger descendentes.
- source_word: אֵשֶׁת הוֹדִיָּה
  choice: da mulher de Hodias
  rationale: Reproduz a relação expressa pela construção hebraica; “mulher de” é natural e amplamente compreensível em português.
- source_word: הוֹדִיָּה
  choice: Hodias
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio.
- source_word: אֲחוֹת נַחַם
  choice: irmã de Naã
  rationale: Traduz de modo direto a construção hebraica que identifica mais precisamente a mulher de Hodias.
- source_word: אֲבִי
  choice: o pai de
  rationale: Preserva o singular e a formulação genealógica do hebraico, sem decidir se se trata de pai biológico, ancestral, fundador ou chefe de clã.
- source_word: קְעִילָה
  choice: Queila
  rationale: Emprega a forma portuguesa estabelecida do nome, sem decidir se designa pessoa, clã ou localidade.
- source_word: הַגַּרְמִי
  choice: o garmita
  rationale: Reproduz o adjetivo gentílico ou clânico hebraico sem o expandir interpretativamente.
- source_word: וְאֶשְׁתְּמֹעַ
  choice: e Estemoa
  rationale: Mantém o nome próprio e sua coordenação com a expressão anterior.
- source_word: הַמַּעֲכָתִי
  choice: o maacatita
  rationale: Traduz o gentílico ou nome clânico de maneira tradicional, sem especificar uma relação genealógica não explicitada.
theological_decisions:
- issue: Discordância entre o sujeito plural “filhos” e o singular “pai”
  choice: Preservar a formulação comprimida no texto e explicá-la em nota
  alternative: Regularizar como “descendentes” ou reformular toda a relação como uma lista de clãs
  rationale: O hebraico é sintaticamente comprimido e possivelmente preserva uma relação de clã; regularizá-lo eliminaria uma ambiguidade real do texto.
translation_notes:
  register: Português moderno, claro e digno, com formas onomásticas correntes em Bíblias de língua portuguesa. A discordância incomum foi mantida deliberadamente para preservar a compressão e a ambiguidade do hebraico, com esclarecimento em notas.
