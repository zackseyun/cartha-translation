base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/024.yaml
  text: 'The sons of Simeon: Nemuel[a], Jamin, Jarib, Zerah[c][b], and Shaul.'
translation:
  language: pt
  text: Os filhos de Simeão foram Nemuel[a], Jamim, Jaribe, Zerá[b] e Saul.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nas genealogias paralelas, em Gênesis 46:10 e Êxodo 6:15, ele é chamado Jemuel; o texto hebraico aqui traz Nemuel.
    reason: alternative_reading
  - marker: b
    text: Nas genealogias paralelas, em Gênesis 46:10 e Êxodo 6:15, o nome correspondente é Zoar.
    reason: textual_variant
  - marker: c
    text: Saul é a forma tradicional portuguesa do nome hebraico Shaul.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Os filhos de
  rationale: Plural construto de “filho”, introduzindo uma lista genealógica de indivíduos; “filhos de” é direto e preciso neste contexto.
- source_word: שִׁמְעוֹן
  choice: Simeão
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: נְמוּאֵל
  choice: Nemuel
  rationale: Translitera a forma hebraica presente neste versículo, sem substituí-la pela forma paralela Jemuel.
- source_word: וְיָמִין
  choice: Jamim
  rationale: Forma portuguesa corrente do nome próprio hebraico; a conjunção ו é expressa naturalmente pelo “e” antes do último item da enumeração, conforme o uso português.
- source_word: יָרִיב
  choice: Jaribe
  rationale: Forma aportuguesada e reconhecível do nome próprio, sem traduzir seu possível sentido lexical.
- source_word: זֶרַח
  choice: Zerá
  rationale: Representa a forma hebraica deste versículo; a forma Zoar das genealogias paralelas é indicada em nota.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Forma tradicional portuguesa do nome hebraico שָׁאוּל, natural e amplamente reconhecida pelos leitores.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas de nomes bíblicos reconhecíveis no uso lusófono e boa legibilidade brasileira. O verbo “foram” foi acrescentado por naturalidade sintática, pois a frase nominal hebraica não contém verbo expresso. A conjunção foi posicionada antes do último nome, segundo a enumeração natural em português.
