lexical_decisions:
- source_word: וּ/בְ/בִלְהָה
  choice: e em Bila
  rationale: A conjunção וּ e a preposição בְ são vertidas por “e em”, forma natural em português numa lista de localidades. בִלְהָה é tratado como topônimo e transliterado segundo convenções correntes em português.
- source_word: וּ/בְ/עֶצֶם
  choice: em Ezém
  rationale: A construção וּ + בְ continua a enumeração de lugares. Em português, omitir o segundo “e” evita uma repetição pesada sem perder a coordenação hebraica; עֶצֶם é transliterado como topônimo.
- source_word: וּ/בְ/תוֹלָד
  choice: e em Tolade
  rationale: A mesma construção encerra a lista. A preposição é preservada como “em”, e תוֹלָד é transliterado como nome de lugar.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. Mantém-se a concisão da lista hebraica e a ambiguidade locativa da preposição ב é registrada em nota.
