base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/033.yaml
  text: And all their villages that were around these cities, as far as Baal—these were their settlements, and they had their genealogy recorded.
translation:
  language: pt
  text: E todos os seus povoados[a] que ficavam ao redor dessas cidades, até Baal — estes eram seus lugares de moradia, e eles tinham seu registro genealógico[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas aldeias”, “seus assentamentos” ou “seus recintos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “e eles se registraram segundo sua genealogia”; a expressão hebraica se refere ao registro genealógico.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַצְרֵיהֶם
  choice: seus povoados
  rationale: חָצֵר pode designar pátio ou recinto, mas, nesta relação geográfica de lugares habitados dependentes das cidades, “povoados” comunica melhor o sentido contextual em português atual.
- source_word: אֲשֶׁר סְבִיבוֹת הֶעָרִים הָאֵלֶּה
  choice: que ficavam ao redor dessas cidades
  rationale: Expressa de modo natural a localização dos povoados em relação às cidades anteriormente mencionadas.
- source_word: עַד בָּעַל
  choice: até Baal
  rationale: עַד indica o limite da extensão territorial, e בָּעַל é aqui preservado como nome de lugar.
- source_word: זֹאת מוֹשְׁבֹתָם
  choice: esses eram os lugares onde habitavam
  rationale: Embora זֹאת seja formalmente singular, funciona como retomada resumitiva da lista anterior; o plural é natural em português. A formulação mantém o sentido de מוֹשָׁב como lugar de residência.
- source_word: וְהִתְיַחְשָׂם לָהֶם
  choice: e eles tiveram sua genealogia registrada
  rationale: A forma de יחס no Hitpael se refere à inscrição ou ao registro genealógico. A tradução comunica a ideia sem especificar além do hebraico quem realizou o registro.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Povoados” distingue os núcleos menores das cidades, enquanto “lugares onde habitavam” evita repetição pesada. O travessão preserva a retomada resumitiva e a estrutura compacta do hebraico.
