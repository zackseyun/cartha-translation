  text: וּ/לְ/אַשְׁחוּר֙ אֲבִ֣י תְק֔וֹעַ הָי֖וּ שְׁתֵּ֣י נָשִׁ֑ים חֶלְאָ֖ה וְ/נַעֲרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/005.yaml
  text: 'Ashhur the father of Tekoa had two wives: Helah and Naarah[a].'
translation:
  language: pt
  text: 'Asur, pai de Tecoa, teve duas mulheres: Helá e Naará.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «fundador de Tecoa» ou «ancestral de Tecoa»; nas genealogias, «pai de» pode designar o fundador de um clã ou povoado, e não apenas o pai biológico imediato.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאַשְׁחוּר
  choice: Asur
  rationale: A preposição e a conjunção ligadas ao nome funcionam como ligação discursiva na genealogia; em português natural, basta introduzir o referente como «Asur».
- source_word: אֲבִי תְקוֹעַ
  choice: pai de Tecoa
  rationale: Mantém a expressão hebraica de modo transparente. Neste contexto genealógico, «pai» também pode indicar ancestral ou fundador de um clã ou povoado; essa amplitude é preservada em nota.
- source_word: הָיוּ
  choice: teve
  rationale: Embora o hebraico use literalmente «eram», a construção expressa posse. «Teve duas mulheres» é a formulação idiomática em português.
- source_word: שְׁתֵּי נָשִׁים
  choice: duas mulheres
  rationale: No contexto, trata-se das mulheres de Asur. «Mulheres» preserva o uso natural e tradicional de נָשִׁים sem introduzir ambiguidade relevante nesta construção.
- source_word: חֶלְאָה
  choice: Helá
  rationale: Transliteração adaptada à ortografia e à pronúncia portuguesas, com acento para indicar a tonicidade final.
- source_word: וְנַעֲרָה
  choice: e Naará
  rationale: A conjunção é mantida na coordenação dos nomes; «Naará» representa o nome hebraico em forma legível em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com nomes próprios aportuguesados. A formulação concisa acompanha o estilo genealógico do texto hebraico e preserva em nota a amplitude semântica de «pai».
