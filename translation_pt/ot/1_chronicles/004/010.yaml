source:
  edition: WLC
  text: וַ/יִּקְרָ֣א יַ֠עְבֵּץ לֵ/אלֹהֵ֨י יִשְׂרָאֵ֜ל לֵ/אמֹ֗ר אִם בָּרֵ֨ךְ תְּבָרֲכֵ֜/נִי וְ/הִרְבִּ֤יתָ אֶת גְּבוּלִ/י֙ וְ/הָיְתָ֤ה יָדְ/ךָ֙ עִמִּ֔/י וְ/עָשִׂ֥יתָ מֵּ/רָעָ֖ה לְ/בִלְתִּ֣י עָצְבִּ֑/י וַ/יָּבֵ֥א אֱלֹהִ֖ים אֵ֥ת אֲשֶׁר שָׁאָֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/010.yaml
  text: And Jabez called on the God of Israel[a], saying, “If you would indeed bless me and enlarge my territory, and let your hand be with me[b], and keep me from harm so that I may not suffer pain!” And God granted what he asked.
translation:
  language: pt
  text: 'Jabez invocou o Deus de Israel, dizendo: “Se de fato me abençoares, ampliares o meu território, estiver a tua mão comigo e me guardares do mal[a], para que eu não sofra dor[b]!” E Deus lhe concedeu o que havia pedido.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra hebraica pode significar tanto o mal moral quanto uma calamidade ou desgraça prejudicial; neste contexto, o pedido enfatiza a proteção contra o que causa dor.
    reason: lexical_alternative
  - marker: b
    text: A expressão “sofra dor” retoma a explicação do nome Jabez no versículo anterior.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: invocou
  rationale: No contexto de oração, o verbo expressa um apelo dirigido a Deus, não apenas o ato de chamar.
- source_word: אִם בָּרֵךְ תְּבָרֲכֵנִי
  choice: Se de fato me abençoares
  rationale: Mantém a partícula condicional hebraica e transmite a ênfase da combinação do infinitivo absoluto com o verbo finito; a exclamação deixa claro que se trata de um pedido ardente.
- source_word: וְהִרְבִּיתָ אֶת גְּבוּלִי
  choice: ampliares o meu território
  rationale: גְּבוּל pode designar limite, fronteira ou território; aqui se refere naturalmente à extensão das terras de Jabez, sem transformar a expressão em uma metáfora moderna.
- source_word: וְהָיְתָה יָדְךָ עִמִּי
  choice: estiver a tua mão comigo
  rationale: Preserva a imagem hebraica da mão de Deus como expressão de seu poder, auxílio e atuação.
- source_word: וְעָשִׂיתָ מֵּרָעָה
  choice: e me guardares do mal
  rationale: A construção hebraica é condensada e difícil. Em ligação com a dor mencionada a seguir, pede proteção contra aquilo que causa dano; “mal” conserva em português a amplitude entre maldade e calamidade.
- source_word: לְבִלְתִּי עָצְבִּי
  choice: para que eu não sofra dor
  rationale: Expressa a finalidade do pedido e mantém o elo verbal com a dor associada ao nome de Jabez no versículo anterior.
- source_word: וַיָּבֵא אֱלֹהִים אֵת אֲשֶׁר שָׁאָל
  choice: E Deus lhe concedeu o que havia pedido
  rationale: A construção idiomática indica que Deus fez acontecer o que Jabez solicitou; “concedeu” comunica isso de modo natural e preciso.
theological_decisions:
- issue: Natureza do pedido de ampliação de גְּבוּל
  choice: território
  alternative: área de influência
  rationale: O hebraico se refere mais naturalmente a limites territoriais ou propriedades. A tradução não impõe ao texto nem uma aplicação abstrata nem implicações modernas ligadas à teologia da prosperidade.
- issue: Sentido de רָעָה na oração
  choice: mal
  alternative: desgraça ou dano
  rationale: O termo pode denotar tanto o mal moral quanto uma calamidade prejudicial. “Mal” conserva essa amplitude em português, enquanto a nota explicita a ambiguidade lexical.
- issue: Forma condicional do pedido
  choice: Se de fato me abençoares...!
  alternative: Quem dera me abençoasses...!
  rationale: A oração hebraica começa com אִם, literalmente “se”, e não apresenta uma conclusão explícita. A tradução preserva essa forma suspensa e enfática, sem resolver a construção como simples desejo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A sequência verbal no futuro do subjuntivo acompanha naturalmente o “se” inicial, e a exclamação preserva o caráter intenso e incompleto da súplica hebraica.
