  text: וְ/אֶשְׁתּ֗וֹן הוֹלִ֞יד אֶת בֵּ֤ית רָפָא֙ וְ/אֶת פָּסֵ֔חַ וְ/אֶת תְּחִנָּ֖ה אֲבִ֣י עִ֣יר נָחָ֑שׁ אֵ֖לֶּה אַנְשֵׁ֥י רֵכָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/012.yaml
  text: Eshton fathered Beth-rapha[a], Paseah, and Tehinnah, the father of Ir-nahash[b]. These were the men of Rekah.
translation:
  language: pt
  text: Estom gerou Bete-Rafa, Paseá e Teína, pai[a] de Ir-Naás[b]. Esses foram os homens de Reca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fundador”. Em genealogias, “pai” pode indicar um ancestral ou o fundador de um clã ou povoado, não apenas o pai biológico imediato.
    reason: lexical_alternative
  - marker: b
    text: Ir-Naás pode significar “cidade de Naás”, mas aqui provavelmente funciona como nome de lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: gerou
  rationale: No contexto genealógico, o hifil de ילד indica gerar ou dar origem a uma linhagem. “Gerou” é conciso, corrente em genealogias bíblicas e não exige que todas as relações mencionadas sejam entendidas além do que o texto afirma.
- source_word: בֵּית רָפָא
  choice: Bete-Rafa
  rationale: O paralelismo com os nomes seguintes favorece a leitura como nome próprio. A forma foi transliterada segundo convenções naturais em português, em vez de ser traduzida literalmente como “casa de Rafa”.
- source_word: פָּסֵחַ
  choice: Paseá
  rationale: Nome próprio transliterado em forma legível para falantes de português.
- source_word: תְּחִנָּה
  choice: Teína
  rationale: Neste contexto, trata-se de nome próprio; por isso, foi transliterado, e não traduzido conforme o sentido do substantivo comum relacionado a “súplica”.
- source_word: אֲבִי עִיר נָחָשׁ
  choice: pai de Ir-Naás
  rationale: “Pai” preserva o idioma genealógico hebraico e sua possível amplitude sem decidir entre progenitor imediato, ancestral ou fundador. Ir-Naás é mantido como topônimo provável.
- source_word: אֵלֶּה אַנְשֵׁי רֵכָה
  choice: Esses foram os homens de Reca
  rationale: “Homens de” mantém a ligação formal de אַנְשֵׁי com um possível clã ou localidade. O passado se ajusta naturalmente ao relato genealógico em português.
- source_word: רֵכָה
  choice: Reca
  rationale: Nome próprio ou topônimo transliterado conforme a fonologia e a ortografia usuais do português.
theological_decisions: []
