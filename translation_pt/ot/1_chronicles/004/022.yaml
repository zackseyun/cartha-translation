base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/022.yaml
  text: and Jokim[a], and the men of Cozeba, and Joash, and Saraph, who ruled in Moab and returned to Lehem[c][b]. These records are ancient.
translation:
  language: pt
  text: e Joquim, os homens de Cozeba, Joás e Sarafe, que dominaram Moabe[a], e Jasubi-Leém[b]. Esses registros são antigos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “possuíram Moabe”, “tornaram-se senhores em Moabe” ou, possivelmente, “casaram-se em Moabe”. A expressão hebraica é concisa e incerta.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico incerto. Possivelmente: “e voltaram para Leém” ou “e voltaram para Belém”; o texto também pode conter o nome próprio “Jasubi-Leém” (ou “Jasube-Leém”).'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “esses acontecimentos são antigos” ou “essas coisas vêm de tempos antigos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹקִים
  choice: Joquim
  rationale: Nome pessoal vertido segundo a forma portuguesa consagrada e ajustada à ortografia moderna.
- source_word: אַנְשֵׁי כֹזֵבָא
  choice: os homens de Cozeba
  rationale: Mantém o construto masculino plural אַנְשֵׁי e translitera כֹזֵבָא como topônimo.
- source_word: יוֹאָשׁ
  choice: Joás
  rationale: Forma portuguesa tradicional e amplamente reconhecível do nome pessoal.
- source_word: שָׂרָף
  choice: Sarafe
  rationale: O contexto genealógico favorece um nome pessoal, não a tradução do substantivo comum relacionado a queimar.
- source_word: אֲשֶׁר בָּעֲלוּ לְמוֹאָב
  choice: que dominaram em Moabe
  rationale: בעל pode indicar posse, senhorio ou domínio. 'Dominaram em Moabe' é natural em português, mas a expressão hebraica é concisa e incerta; por isso, outras possibilidades são registradas em nota.
- source_word: יָשֻׁבִי לָחֶם
  choice: Jasubi-Leém
  rationale: A forma massorética favorece aqui a preservação como nome próprio composto, evitando transformar silenciosamente uma passagem notoriamente obscura em uma oração verbal. A interpretação 'voltaram para Leém' permanece em nota.
- source_word: הַדְּבָרִים עַתִּיקִים
  choice: Esses registros são antigos
  rationale: דברים pode significar palavras, assuntos ou relatos. No contexto genealógico, 'registros' comunica com clareza a provável referência às informações preservadas, sem eliminar alternativas mais literais.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com formas bíblicas reconhecíveis dos nomes. A sintaxe conserva o caráter de lista genealógica. As três expressões hebraicas especialmente obscuras são traduzidas no corpo sem falsa certeza e têm suas alternativas preservadas em notas.
