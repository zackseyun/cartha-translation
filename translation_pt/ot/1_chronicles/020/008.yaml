id: 1CH.20.8
reference: 1 Chronicles 20:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֵ֛ל נוּלְּד֥וּ לְ/הָ/רָפָ֖א בְּ/גַ֑ת וַ/יִּפְּל֥וּ בְ/יַד דָּוִ֖יד וּ/בְ/יַד עֲבָדָֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/008.yaml
  text: These were born to Rapha in Gath[a], and they fell by the hand of David and by the hand of his servants.
translation:
  language: pt
  text: Estes nasceram de Rafa, em Gate[a], e caíram pelas mãos de Davi e de seus servos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “descendiam de Rafa”; possivelmente uma referência aos descendentes dos refains, isto é, a uma linhagem de gigantes em Gate.'
    reason: Preserva a incerteza quanto a Rafa ser um ancestral pessoal ou uma designação de linhagem, e explicita a possível associação contextual com os refains.
lexical_decisions:
- source_word: אֵל
  choice: Estes
  rationale: O demonstrativo retoma os guerreiros mencionados anteriormente sem acrescentar um substantivo ausente no hebraico.
- source_word: נוּלְּדוּ
  choice: nasceram de
  rationale: Preserva o sentido básico do nifal de ילד e, em português, expressa naturalmente descendência.
- source_word: לְהָרָפָא
  choice: de Rafa
  rationale: Representa a relação de descendência indicada por לְ, mantendo Rafa como designação ambígua de ancestral ou linhagem, sem traduzi-la interpretativamente por “gigante”.
- source_word: בְּגַת
  choice: em Gate
  rationale: Tradução locativa direta da preposição בְּ com o topônimo.
- source_word: וַיִּפְּלוּ
  choice: e caíram
  rationale: Conserva a imagem literal de נפל; no contexto de combate, a queda comunica derrota e morte.
- source_word: בְיַד
  choice: pelas mãos de
  rationale: Mantém de modo natural em português o idioma hebraico que indica agência; o plural concorda idiomaticamente com os agentes coordenados Davi e seus servos.
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: Preserva o sentido lexical de עבד, que neste contexto real e militar abrange os homens a serviço de Davi.
theological_decisions:
- issue: Identidade de הָרָפָא
  choice: Rafa como designação ambígua de ancestral ou linhagem
  alternative: o gigante; os refains
  rationale: A forma hebraica é singular e tem artigo, mas não explicita se o referente é um ancestral epônimo ou um grupo familiar. A transliteração evita impor a identificação com “gigante” ou com o plural “refains”.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Nasceram de” e “pelas mãos de” conservam as imagens hebraicas sem soar excessivamente arcaicas; “Gate” segue a forma portuguesa tradicional do topônimo.
