source:
  edition: WLC
  text: וְ/אֶת הָ/עָ֨ם אֲשֶׁר בָּ֜/הּ הוֹצִ֗יא וַ/יָּ֨שַׂר בַּ/מְּגֵרָ֜ה וּ/בַ/חֲרִיצֵ֤י הַ/בַּרְזֶל֙ וּ/בַ/מְּגֵר֔וֹת וְ/כֵן֙ יַעֲשֶׂ֣ה דָוִ֔יד לְ/כֹ֖ל עָרֵ֣י בְנֵי עַמּ֑וֹן וַ/יָּ֧שָׁב דָּוִ֛יד וְ/כָל הָ/עָ֖ם יְרוּשָׁלִָֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/003.yaml
  text: He brought out the people who were in it and put them to work with saws[a], iron tools, and axes. Thus David did to all the cities of the Ammonites[b]. Then David and all the people returned to Jerusalem.
translation:
  language: pt
  text: Ele retirou de lá os habitantes e os pôs para trabalhar com serras[a], ferramentas de ferro e machados[b]. Davi fez o mesmo com todas as cidades dos amonitas. Depois, Davi e todo o povo voltaram para Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “os colocou sob serras, instrumentos de ferro e ferramentas cortantes”. Alguns entendem o versículo, sob a influência de 2 Samuel 12:31, como uma afirmação de que Davi os executou com esses instrumentos.
    reason: alternative_reading
  - marker: b
    text: Os termos hebraicos usados para esses instrumentos são em parte incertos. As expressões traduzidas por “ferramentas de ferro” e “machados” podem designar, de modo mais geral, instrumentos de ferro afiados ou cortantes; a primeira também pode se referir a trenós de debulhar com lâminas de ferro.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹצִיא
  choice: retirou de lá
  rationale: O hifil de יצא indica fazer sair ou retirar. A formulação expressa de modo natural a remoção dos habitantes da cidade.
- source_word: וַיָּשַׂר
  choice: os pôs para trabalhar
  rationale: O verbo é difícil. No contexto de Crônicas, pode indicar que os habitantes foram destinados a trabalhos com os instrumentos mencionados, sem importar automaticamente o sentido mais violento atribuído ao paralelo de 2 Samuel 12:31.
- source_word: בַּמְּגֵרָה
  choice: com serras
  rationale: מְגֵרָה designa uma serra; o plural é natural em português numa lista de instrumentos usados no trabalho.
- source_word: בַּחֲרִיצֵי הַבַּרְזֶל
  choice: ferramentas de ferro
  rationale: A expressão se refere a instrumentos afiados ou cortantes de ferro, mas sua identificação exata é incerta. A tradução evita precisão indevida.
- source_word: וּבַמְּגֵרוֹת
  choice: e machados
  rationale: O termo é lexicalmente difícil e pode designar serras ou outros instrumentos cortantes. “Machados” dá sentido claro à lista, com a incerteza registrada em nota.
- source_word: וְכֵן יַעֲשֶׂה דָוִיד
  choice: Davi fez o mesmo
  rationale: A construção resume a ação de Davi nas demais cidades; esta é uma formulação narrativa natural e concisa.
- source_word: לְכֹל עָרֵי בְנֵי עַמּוֹן
  choice: com todas as cidades dos amonitas
  rationale: “Amonitas” é o gentílico português natural para בְנֵי עַמּוֹן neste contexto.
- source_word: וַיָּשָׁב ... יְרוּשָׁלִָם
  choice: voltaram para Jerusalém
  rationale: שוב com destino significa voltar. O verbo no plural em português concorda naturalmente com o sujeito composto “Davi e todo o povo”.
theological_decisions:
- issue: Se o versículo descreve trabalho forçado ou a execução dos amonitas
  choice: O texto principal apresenta Davi pondo os habitantes capturados para trabalhar com os instrumentos mencionados.
  alternative: O versículo pode ser entendido, sobretudo à luz de 2 Samuel 12:31, como uma descrição de execução com serras e instrumentos de ferro.
  rationale: A redação de Crônicas difere da passagem paralela em Samuel e permite a leitura menos violenta. A tradução não deve importar para Crônicas uma interpretação que seu próprio texto não exige; por ser uma ambiguidade relevante, a leitura alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Habitantes” torna explícito o referente coletivo de “o povo que estava nela”, enquanto “retirou de lá” preserva a ação causativa. As notas mantêm tanto a ambiguidade ética e narrativa quanto a incerteza lexical dos instrumentos.
