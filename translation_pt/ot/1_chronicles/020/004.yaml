id: 1CH.20.4
reference: 1 Chronicles 20:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִי֙ אַחֲרֵי כֵ֔ן וַ/תַּעֲמֹ֧ד מִלְחָמָ֛ה בְּ/גֶ֖זֶר עִם פְּלִשְׁתִּ֑ים אָ֣ז הִכָּ֞ה סִבְּכַ֣י הַ/חֻֽשָׁתִ֗י אֶת סִפַּ֛י מִ/ילִדֵ֥י הָ/רְפָאִ֖ים וַ/יִּכָּנֵֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/004.yaml
  text: After this[a], war arose at Gezer with the Philistines. Then Sibbecai the Hushathite struck down Sippai, one of the descendants of the Rephaim[b], and they were subdued.
translation:
  language: pt
  text: Depois disso, surgiu uma guerra em Gezer com os filisteus. Então Sibecai, o husatita, abateu Sipai[a], um dos descendentes dos refains[b], e eles foram subjugados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Safai”, forma alternativa desse nome.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “os refains”; tradicionalmente também traduzido por “os gigantes”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Depois disso
  rationale: Expressa de modo natural a transição temporal da fórmula narrativa hebraica, sem reproduzi-la de maneira rígida.
- source_word: וַתַּעֲמֹד מִלְחָמָה
  choice: surgiu uma guerra
  rationale: O verbo עמד, associado a מלחמה, indica aqui o surgimento ou início de um conflito; a formulação mantém a imagem do hebraico e soa natural em português.
- source_word: בְּגֶזֶר
  choice: em Gezer
  rationale: A preposição ב marca o local do conflito; “em Gezer” é idiomático em português.
- source_word: עִם פְּלִשְׁתִּים
  choice: com os filisteus
  rationale: Preserva o valor básico de עִם, enquanto o contexto de guerra deixa claro que se trata de confronto hostil.
- source_word: הִכָּה
  choice: abateu
  rationale: Em contexto militar, נכה pode indicar golpear e derrubar, frequentemente com resultado fatal. “Abateu” conserva essa força sem tornar explícito além do necessário o modo ou resultado.
- source_word: סִבְּכַי הַחֻשָׁתִי
  choice: Sibecai, o husatita
  rationale: Emprega formas portuguesas legíveis para o nome próprio e o gentílico, preservando a identificação dada no hebraico.
- source_word: סִפַּי
  choice: Sipai
  rationale: Translitera de forma clara a vocalização do texto massorético; a forma alternativa “Safai” é registrada em nota.
- source_word: מִילִדֵי הָרְפָאִים
  choice: um dos descendentes dos refains
  rationale: ילידי indica origem ou descendência. A construção portuguesa torna explícita a relação do indivíduo com o grupo sem interpretar רְפָאִים como simples descrição física.
- source_word: וַיִּכָּנֵעוּ
  choice: eles foram subjugados
  rationale: O nifal de כנע descreve serem dominados ou postos em sujeição; “foram subjugados” corresponde ao desfecho militar e preserva o sujeito plural não especificado.
theological_decisions:
- issue: Sentido de הָרְפָאִים
  choice: os refains
  alternative: os gigantes
  rationale: O termo pode designar um povo, clã ou linhagem, e não necessariamente funcionar como descrição direta de estatura. A transliteração preserva essa abertura, enquanto a interpretação tradicional é apresentada em nota.
translation_notes:
  register: Português moderno, claro e digno, com formas nominais familiares à tradição bíblica lusófona. A sintaxe narrativa é fluente, mas conserva a sequência e a ambiguidade do hebraico, inclusive o sujeito plural não expresso de “eles foram subjugados”.
