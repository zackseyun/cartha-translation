  terminology: “Gate”, “grande estatura” e “Rafa” são adequados. “Refains” é uma forma portuguesa utilizável para o grupo; a nota deve conservar “Rafa” como designação ambígua e não apresentar como literalmente português uma construção artificial como “nasceu para/de o Rafa”.
