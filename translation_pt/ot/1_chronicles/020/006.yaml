base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/006.yaml
  text: And there was war again at Gath[a], and there was a man of great size whose fingers and toes were six each, twenty-four in all; he also was born to Rapha.
translation:
  language: pt
  text: Houve novamente guerra em Gate, e havia um homem de grande estatura, que tinha seis dedos em cada mão e em cada pé, vinte e quatro ao todo; ele também descendia de Rafa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente: “ele também nasceu para o Rafa”. A expressão pode indicar descendência de Rafa; também pode ser entendida como “descendia do gigante” ou “era um dos refains”.'
    reason: Preserva a formulação hebraica, inclusive o artigo definido, e registra as principais possibilidades para a identidade de Rafa sem resolver a ambiguidade no texto principal.
lexical_decisions:
- source_word: עוֹד
  choice: novamente
  rationale: No encadeamento narrativo, indica a repetição do conflito.
- source_word: מִלְחָמָה
  choice: guerra
  rationale: O substantivo designa conflito armado de modo amplo; “guerra” se ajusta ao resumo narrativo.
- source_word: בְּגַת
  choice: em Gate
  rationale: A preposição בְּ indica aqui o local do conflito; “em Gate” é natural em português.
- source_word: אִישׁ מִדָּה
  choice: um homem de grande estatura
  rationale: A expressão é literalmente “homem de medida/estatura” e, no contexto, descreve tamanho corporal incomum sem empregar diretamente o termo interpretativo “gigante”.
- source_word: אֶצְבְּעֹתָיו שֵׁשׁ וָשֵׁשׁ
  choice: seis dedos em cada mão e em cada pé
  rationale: O substantivo pode abranger os dedos das mãos e dos pés neste tipo de descrição; a formulação explicita de modo natural a distribuição indicada por “seis e seis” e confirmada pelo total de vinte e quatro.
- source_word: עֶשְׂרִים וְאַרְבַּע
  choice: vinte e quatro ao todo
  rationale: “Ao todo” evidencia que o número apresentado é a soma dos dedos mencionados.
- source_word: וְגַם הוּא
  choice: ele também
  rationale: Associa esse homem aos demais guerreiros da mesma origem mencionados no contexto.
- source_word: נוֹלַד לְהָרָפָא
  choice: descendia de Rafa
  rationale: Comunica em português corrente a relação de origem expressa literalmente por “foi nascido para/de o Rafa”, preservando “Rafa” como designação transliterada e deixando sua identidade exata em aberto na nota.
theological_decisions:
- issue: Identidade de הָרָפָא
  choice: Rafa como designação ancestral ou de clã, preservada por transliteração
  alternative: o gigante; os refains
  rationale: A forma hebraica é singular e tem artigo, mas pode apontar para um ancestral, uma linhagem ou um grupo associado aos refains. A transliteração evita decidir indevidamente entre essas possibilidades.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A repetição semítica foi suavizada em duas frases, e a descrição dos dedos foi explicitada de acordo com o total indicado no próprio versículo.
