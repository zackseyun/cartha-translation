base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/001.yaml
  text: And it happened at the time of the turning of the year[a], at the time when kings go out, that Joab led out the army and devastated the land of the Ammonites, and he came and besieged Rabbah. But David stayed in Jerusalem. And Joab struck Rabbah and tore it down.
translation:
  language: pt
  text: Na época da virada do ano[a], no tempo em que os reis saem, Joabe conduziu o exército e devastou a terra dos amonitas. Veio e sitiou Rabá. Davi, porém, permaneceu em Jerusalém. Joabe atacou Rabá e arrasou-a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, em tradução mais interpretativa, “na primavera, quando os reis saem para a guerra”. Mais literalmente, o hebraico diz: “na virada do ano, no tempo em que os reis saem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשׁוּבַת הַשָּׁנָה
  choice: a virada do ano
  rationale: Preserva a imagem hebraica da volta ou virada do ano sem identificar diretamente a estação; a nota explica a interpretação contextual como primavera.
- source_word: לְעֵת צֵאת הַמְּלָכִים
  choice: no tempo em que os reis saem
  rationale: Mantém implícito, como no hebraico, o destino ou propósito da saída, embora o contexto seja militar.
- source_word: וַיִּנְהַג
  choice: conduziu
  rationale: Expressa o ato de Joabe levar a força militar, em português natural, sem acrescentar um destino não explicitado.
- source_word: חֵיל הַצָּבָא
  choice: o exército
  rationale: Representa de modo conciso e idiomático a expressão composta que designa a força militar.
- source_word: וַיַּשְׁחֵת אֶת אֶרֶץ בְּנֵי עַמּוֹן
  choice: devastou a terra dos amonitas
  rationale: Comunica a ruína causada por uma campanha militar; 'amonitas' é a forma portuguesa natural para 'filhos de Amom'.
- source_word: וַיָּצַר
  choice: sitiou
  rationale: É o termo militar direto e corrente para cercar uma cidade com a finalidade de conquistá-la.
- source_word: וְדָוִיד יֹשֵׁב בִּירוּשָׁלִָם
  choice: Davi, porém, permaneceu em Jerusalém
  rationale: O particípio indica estado continuado; 'porém' torna natural o contraste entre a campanha de Joabe e a permanência de Davi.
- source_word: וַיַּךְ
  choice: atacou
  rationale: Neste contexto de conquista urbana, traduz naturalmente o sentido amplo de golpear ou atacar sem antecipar toda a ideia de destruição expressa no verbo seguinte.
- source_word: וַיֶּהֶרְסֶהָ
  choice: a demoliu
  rationale: Preserva o sentido concreto de derrubar ou arrasar a cidade e o distingue da devastação anterior da terra.
- source_word: רַבָּה
  choice: Rabá
  rationale: Emprega a transliteração tradicional e clara em português para o nome da cidade.
