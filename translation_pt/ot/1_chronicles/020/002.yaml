  to: Davi tirou da cabeça do rei deles[a] a coroa e verificou que ela pesava um talento de ouro[b]. Nela havia uma pedra preciosa, e ela ficou na cabeça de Davi. Ele levou da cidade uma grande quantidade de despojos.
