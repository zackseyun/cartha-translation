base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/002.yaml
  text: And David took the crown of their king from his head and found that it weighed a talent of gold, and in it was a precious stone; and it was placed on David’s head. And he carried off very much plunder from the city.
translation:
  language: pt
  text: Davi tirou da cabeça do rei deles[a] a coroa e verificou que ela pesava um talento de ouro[b]. Nela havia uma pedra preciosa, e ela ficou na cabeça de Davi. Ele levou da cidade uma grande quantidade de despojos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de Milcom” (ou “Malcam”), entendendo o termo hebraico como o nome da divindade amonita, e não como “rei deles”.
    reason: alternative_reading
  - marker: b
    text: O talento era uma grande unidade antiga de peso, muitas vezes estimada em cerca de 34 quilogramas, embora sua medida exata variasse.
    reason: cultural_note
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: coroa
  rationale: Equivalente corrente e claro para um adorno régio; “diadema” seria possível, mas é menos comum.
- source_word: מַלְכָּם
  choice: rei deles
  rationale: A forma é naturalmente entendida como מֶלֶךְ com sufixo pronominal de terceira pessoa masculina plural. A expressão seguinte, “da cabeça dele”, também favorece a referência a um rei humano, sem eliminar a leitura alternativa como nome da divindade amonita.
- source_word: מֵעַל רֹאשׁוֹ
  choice: da cabeça
  rationale: Expressão idiomática em português que preserva a imagem concreta de retirar a coroa da cabeça do seu portador.
- source_word: וַיִּמְצָאָהּ מִשְׁקַל
  choice: verificou que ela pesava
  rationale: Comunica naturalmente a constatação do peso indicada pelo hebraico, sem alterar o conteúdo.
- source_word: כִּכַּר זָהָב
  choice: um talento de ouro
  rationale: Mantém a unidade antiga, evitando uma conversão excessivamente precisa; a nota explica sua medida aproximada.
- source_word: אֶבֶן יְקָרָה
  choice: uma pedra preciosa
  rationale: Tradução direta e não especifica indevidamente o tipo de gema.
- source_word: וַתְּהִי עַל רֹאשׁ דָּוִיד
  choice: ela ficou sobre a cabeça de Davi
  rationale: Reflete de perto o hebraico, que declara que a coroa veio a estar sobre a cabeça de Davi, sem explicitar um agente que a tenha colocado.
- source_word: שְׁלַל הָעִיר
  choice: despojos da cidade
  rationale: “Despojos” expressa com clareza os bens tomados em contexto militar.
- source_word: הוֹצִיא הַרְבֵּה מְאֹד
  choice: levou da cidade uma quantidade enorme
  rationale: Transmite tanto a retirada dos bens quanto a forte ênfase hebraica em sua grande quantidade.
theological_decisions:
- issue: Se מַלְכָּם significa “rei deles” ou designa a divindade amonita Milcom/Malcam
  choice: rei deles
  alternative: Milcom (ou Malcam)
  rationale: A análise morfológica comum e a referência à cabeça de um indivíduo favorecem “rei deles”. Como a leitura do termo como nome da divindade amonita é antiga e lexicalmente plausível, ela é preservada em nota, sem resolver silenciosamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A redação preserva a unidade antiga e a ambiguidade de מַלְכָּם, explicando ambas em notas concisas.
