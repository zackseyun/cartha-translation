  source_fidelity: 'A tradução preserva adequadamente a sequência e os elementos centrais do hebraico: Davi toma a coroa, constata seu peso de um talento de ouro, há nela uma pedra preciosa, ela está sobre a cabeça de Davi, e ele retira abundantes despojos da cidade. A nota sobre a alternativa «Milcom/Malcam» preserva corretamente uma ambiguidade real de מַלְכָּם. A revisão proposta evita o «também», que não é expresso no texto-fonte, e torna a intensidade de הַרְבֵּה מְאֹד mais diretamente proporcional.'
