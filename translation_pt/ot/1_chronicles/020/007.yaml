base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/007.yaml
  text: And when he taunted Israel[a], Jonathan son of Shimea, David’s brother, struck him down.
translation:
  language: pt
  text: Quando ele insultou Israel[a], Jônatas, filho de Simeia, irmão de Davi, o feriu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desafiou Israel”. O verbo hebraico pode indicar insulto afrontoso ou desafio aberto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחָרֵף
  choice: insultou
  rationale: O verbo חרף expressa aqui afronta verbal e desafiadora contra Israel. “Insultou” é natural em português atual e mantém em aberto a combinação de escárnio e desafio; a alternativa “desafiou” é registrada em nota.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: Preserva o objeto direto e o nome coletivo do texto hebraico, que representa o povo como um todo.
- source_word: וַיַּכֵּהוּ
  choice: o matou
  rationale: Embora נכה signifique literalmente ferir ou golpear, neste contexto narrativo o golpe é fatal. “O matou” comunica com clareza o resultado implícito e evita a possível ambiguidade de “o feriu”.
- source_word: יְהוֹנָתָן
  choice: Jônatas
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: בֶּן שִׁמְעָא
  choice: filho de Simeia
  rationale: Mantém a relação de filiação e emprega a forma portuguesa convencional do nome.
- source_word: אֲחִי דָוִיד
  choice: irmão de Davi
  rationale: Reproduz diretamente a construção hebraica, deixando claro que Simeia, e não Jônatas, é identificado como irmão de Davi.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A ordem dos apostos foi preservada para manter inequívoca a identificação de Simeia como irmão de Davi.
