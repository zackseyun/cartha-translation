base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/005.yaml
  text: And there was war with the Philistines again[a], and Elhanan son of Jair struck down Lahmi, the brother of Goliath the Gittite, whose spear shaft was like a weaver’s beam.
translation:
  language: pt
  text: Houve outra guerra contra os filisteus.[a] Elanã, filho de Jair, matou Laami, irmão de Golias, o geteu. A haste de sua lança era como uma viga de tear.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O paralelo em 2 Samuel 21.19 tem um texto hebraico difícil e é frequentemente discutido em relação a este versículo; Crônicas diz explicitamente que Elanã matou Laami, irmão de Golias.
    reason: textual_variant
lexical_decisions:
- source_word: וַתְּהִי עוֹד מִלְחָמָה
  choice: Houve outra guerra
  rationale: A expressão introduz mais um episódio numa série de conflitos; “outra guerra” comunica naturalmente o valor contextual de עוֹד.
- source_word: אֶת פְּלִשְׁתִּים
  choice: contra os filisteus
  rationale: Com מִלְחָמָה, אֶת indica a parte adversária; “contra” é a formulação mais natural em português.
- source_word: וַיַּךְ
  choice: matou
  rationale: Embora נכה possa significar “ferir” ou “abater”, neste contexto bélico o golpe é fatal. “Matou” expressa claramente o resultado sem empregar uma construção pouco natural.
- source_word: אֶלְחָנָן בֶּן יעור
  choice: Elanã, filho de Jair
  rationale: Adota formas portuguesas tradicionais e inteligíveis dos nomes, preservando explicitamente a filiação.
- source_word: אֶת לַחְמִי
  choice: Laami
  rationale: לַחְמִי é entendido, conforme a vocalização massorética e a sintaxe de Crônicas, como nome próprio e objeto direto.
- source_word: אֲחִי גָּלְיָת
  choice: irmão de Golias
  rationale: Preserva diretamente a relação familiar explícita na construção hebraica.
- source_word: הַגִּתִּי
  choice: o geteu
  rationale: Gentílico português tradicional que identifica Golias como natural ou habitante de Gate.
- source_word: וְעֵץ חֲנִיתוֹ
  choice: cuja haste da lança
  rationale: עֵץ designa aqui a parte de madeira, isto é, a haste da lança; a oração relativa produz português natural.
- source_word: כִּמְנוֹר אֹרְגִים
  choice: era como o cilindro de um tear
  rationale: מְנוֹר designa a peça pesada do tear usada na comparação. “Cilindro de um tear” é compreensível ao leitor moderno e conserva a imagem concreta.
theological_decisions:
- issue: Relação com o relato paralelo de 2 Samuel 21:19, cujo texto hebraico é difícil e pode dar a entender que Elanã matou o próprio Golias
  choice: 'Seguir a formulação explícita de Crônicas: Elanã matou Laami, irmão de Golias.'
  alternative: Alterar ou expandir este versículo para harmonizá-lo com uma reconstrução do texto de Samuel, ou interpretar Laami como parte de uma referência a Belém.
  rationale: O texto massorético de Crônicas identifica claramente Laami como irmão de Golias. A tradução preserva essa leitura e registra em nota a dificuldade do paralelo, sem importá-la para o corpo do versículo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantêm-se os nomes bíblicos usuais e a imagem antiga do tear, explicando apenas a questão textual relevante em nota.
