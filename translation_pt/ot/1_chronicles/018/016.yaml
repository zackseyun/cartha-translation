  rationale: É o sentido primário do termo e o mais adequado às linhagens de Zadoque e Abiatar neste contexto.
- source_word: שַׁוְשָׁא
  choice: Savsa
  rationale: Transliteração portuguesa simples da forma consonantal registrada em Crônicas.
- source_word: סוֹפֵר
  choice: secretário
  rationale: No contexto da administração real, designa um oficial encarregado da escrita e dos documentos; 'secretário' comunica a função com clareza moderna.
