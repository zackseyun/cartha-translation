  text: Zadok son of Ahitub and Abimelech son of Abiathar were priests[a], and Shavsha was secretary.
translation:
  language: pt
  text: Zadoque, filho de Aitube, e Abimeleque, filho de Abiatar, eram sacerdotes[a]; e Savsa era secretário.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto paralelo em 2 Samuel 8:17 traz “Aimeleque, filho de Abiatar”, em vez de “Abimeleque, filho de Abiatar”. Aqui, a tradução segue o texto hebraico de Crônicas.
    reason: textual_variant
lexical_decisions:
- source_word: צָדוֹק
  choice: Zadoque
  rationale: Forma tradicional e amplamente reconhecível em português para o nome hebraico.
- source_word: בֶּן
  choice: filho de
