base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/004.yaml
  text: David captured from him 1,000 chariots, 7,000 horsemen, and 20,000 foot soldiers. Then David hamstrung all the chariot horses, but left from them enough for 100 chariots.
translation:
  language: pt
  text: Davi capturou dele mil carros de guerra, sete mil cavaleiros[b] e vinte mil soldados de infantaria. Depois, Davi cortou os jarretes dos cavalos de todos os carros de guerra[a], mas poupou cavalos suficientes para cem carros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “todos os carros” ou “toda a força de carros”. Como o verbo significa cortar os jarretes, a expressão é entendida como referência aos cavalos dos carros de guerra.'
    reason: lexical_alternative
  - marker: b
    text: Em 2 Samuel 8:4, o texto hebraico traz “mil e setecentos cavaleiros”, em vez de “sete mil cavaleiros”. Essa é uma diferença numérica entre as passagens paralelas na tradição textual.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: capturou
  rationale: O verbo לכד indica tomar ou capturar em contexto de guerra; “capturou” é natural e preciso.
- source_word: מִמֶּנּוּ
  choice: dele
  rationale: O sufixo hebraico é singular e retoma Hadadezer no contexto anterior.
- source_word: אֶלֶף רֶכֶב
  choice: mil carros de guerra
  rationale: רכב pode designar coletivamente a força de carros, mas, acompanhado de numeral, é entendido naturalmente como carros contáveis; “de guerra” esclarece o sentido militar.
- source_word: פָּרָשִׁים
  choice: cavaleiros
  rationale: O termo designa combatentes montados; “cavaleiros” é claro e corrente em português.
- source_word: אִישׁ רַגְלִי
  choice: soldados de infantaria
  rationale: A expressão significa literalmente homens a pé; a escolha comunica de modo natural sua função militar.
- source_word: וַיְעַקֵּר
  choice: cortou os tendões
  rationale: Neste contexto, עקר descreve o ato de incapacitar cavalos mediante o corte dos tendões; a formulação é mais transparente ao leitor comum do que um verbo técnico raro.
- source_word: אֶת כָּל הָרֶכֶב
  choice: os cavalos de todos os carros de guerra
  rationale: Embora o hebraico diga literalmente “todos os carros/a força de carros”, o verbo aplica-se aos cavalos; a tradução explicita a metonímia sem alterar o sentido.
- source_word: וַיּוֹתֵר מִמֶּנּוּ מֵאָה רָכֶב
  choice: mas poupou cavalos suficientes para cem carros
  rationale: A frase indica que Davi preservou parte dos animais da força capturada, em número suficiente para equipar cem carros.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Conserva os números do texto hebraico de 1 Crônicas e assinala a diferença da passagem paralela. A metonímia de רכב foi explicitada no corpo do versículo, com a formulação hebraica registrada em nota.
