base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/001.yaml
  text: After this[a], David struck the Philistines and subdued them, and he took Gath and its surrounding towns from the hand of the Philistines.
translation:
  language: pt
  text: Depois disso, Davi atacou os filisteus e os subjugou; tomou das mãos dos filisteus Gate e as cidades que dela dependiam[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «suas filhas», expressão que se refere a cidades menores ou povoados dependentes de Gate.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Depois disso
  rationale: Reproduz com naturalidade a transição narrativa e a sequência temporal, sem verter de modo rígido a fórmula hebraica «e aconteceu».
- source_word: וַיַּךְ
  choice: atacou
  rationale: Em contexto militar, נכה expressa golpear ou atacar. «Atacou» conserva a ação concreta sem antecipar o resultado, que é indicado pelo verbo seguinte.
- source_word: פְּלִשְׁתִּים
  choice: os filisteus
  rationale: Forma consagrada em português para esse povo.
- source_word: וַיַּכְנִיעֵם
  choice: os subjugou
  rationale: O hifil de כנע indica levar alguém à submissão; «subjugou» preserva o sentido militar e político.
- source_word: וַיִּקַּח
  choice: Tomou
  rationale: Mantém o valor amplo de לקח; no contexto, comunica a tomada de controle territorial sem explicitação excessiva.
- source_word: גַּת
  choice: Gate
  rationale: Forma tradicional e amplamente reconhecida em português para o nome da cidade filisteia.
- source_word: וּבְנֹתֶיהָ
  choice: as cidades ao redor dela
  rationale: A expressão, literalmente «suas filhas», designa núcleos menores ligados à cidade principal. A formulação escolhida comunica o sentido de modo claro, enquanto a nota preserva o idioma hebraico.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: das mãos deles
  rationale: Preserva a imagem hebraica de mão como domínio ou posse; o pronome evita a repetição pesada de «filisteus» sem perder o referente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A coordenação foi dividida em duas frases para fluidez, sem alterar a sequência dos atos. O marcador da nota foi colocado junto à expressão a que efetivamente se refere.
