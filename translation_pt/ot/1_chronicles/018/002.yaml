base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/002.yaml
  text: And he struck Moab[a], and the Moabites became slaves to David, bringing tribute.
translation:
  language: pt
  text: Davi feriu Moabe, e os moabitas se tornaram escravos de Davi[a], levando-lhe tributo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servos de Davi, levando-lhe presentes”. Os termos hebraicos podem ter sentido mais amplo; neste contexto de conquista, descrevem a sujeição de um povo e a entrega de tributo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: derrotou
  rationale: O verbo נכה significa literalmente “golpear”, mas, neste relato militar, descreve um ataque bem-sucedido que resulta na submissão de Moabe. “Derrotou” comunica naturalmente essa força contextual em português.
- source_word: מוֹאָב
  choice: Moabe / os moabitas
  rationale: Na primeira ocorrência, o nome designa a entidade nacional atacada; na segunda, refere-se coletivamente ao povo, por isso se traduz de modo idiomático como “os moabitas”.
- source_word: וַיִּהְיוּ
  choice: se tornaram
  rationale: Com um predicativo, היה pode ter sentido ingressivo. A sequência narrativa indica uma nova condição resultante da conquista.
- source_word: עֲבָדִים לְדָוִיד
  choice: seus servos
  rationale: עֲבָדִים pode significar “servos” ou “escravos”. Aplicado coletivamente a um povo conquistado que paga tributo, expressa submissão política a Davi; “servos” preserva a amplitude lexical sem sugerir necessariamente escravidão individual. O possessivo retoma Davi com naturalidade em português.
- source_word: נֹשְׂאֵי מִנְחָה
  choice: passaram a pagar-lhe tributo
  rationale: Literalmente, “portadores de presente/oferta”. No contexto político-militar, מִנְחָה é o tributo entregue por um povo subordinado. “Passaram a pagar-lhe tributo” expressa idiomaticamente a situação contínua decorrente da conquista.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “Davi” foi evitada por meio de possessivos e pronome, sem perda de referência. A formulação mantém a ideia de subjugação política e registra em nota a amplitude dos termos hebraicos.
