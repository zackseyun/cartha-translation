base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/015.yaml
  text: And Joab son of Zeruiah was over the army[a], and Jehoshaphat son of Ahilud was recorder.
translation:
  language: pt
  text: Joabe, filho de Zeruia, estava à frente do exército, e Josafá, filho de Ailude, era o secretário real[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “encarregado dos registros” ou “cronista”. O termo hebraico designa um funcionário da corte responsável por manter registros e apresentar assuntos ao rei.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיוֹאָב
  choice: Joabe
  rationale: O nome é apresentado na forma portuguesa consagrada; a conjunção hebraica é representada pela continuidade da enumeração, sem exigir um “e” inicial pouco natural em português.
- source_word: בֶּן צְרוּיָה
  choice: filho de Zeruia
  rationale: Reproduz de modo direto e natural a identificação genealógica hebraica.
- source_word: עַל הַצָּבָא
  choice: estava à frente do exército
  rationale: Expressa a autoridade indicada por עַל sem substituir a construção por um título militar mais específico do que o texto fornece.
- source_word: וִיהוֹשָׁפָט
  choice: e Josafá
  rationale: Mantém a conjunção que liga os dois cargos na lista e emprega a forma portuguesa consagrada do nome.
- source_word: בֶּן אֲחִילוּד
  choice: filho de Ailude
  rationale: Verte com clareza a identificação patronímica.
- source_word: מַזְכִּיר
  choice: secretário real
  rationale: No contexto da administração monárquica, designa o oficial encarregado de registros e de trazer assuntos à atenção do rei. “Real” esclarece o âmbito do cargo sem lhe atribuir funções modernas excessivamente estreitas.
theological_decisions: []
translation_notes:
  register: Português atual, digno e de leitura ampla, com nomes bíblicos em suas formas portuguesas correntes. A formulação “estava à frente” preserva a estrutura administrativa do hebraico; “secretário real” comunica de modo acessível um cargo antigo, e a nota conserva as alternativas lexicais. O marcador foi colocado junto a מַזְכִּיר, termo ao qual a nota efetivamente se refere.
