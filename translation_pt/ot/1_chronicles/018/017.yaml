  text: וּ/בְנָיָ֨הוּ֙ בֶּן יְה֣וֹיָדָ֔ע עַל הַ/כְּרֵתִ֖י וְ/הַ/פְּלֵתִ֑י וּ/בְנֵי דָוִ֥יד הָ/רִאשֹׁנִ֖ים לְ/יַ֥ד הַ/מֶּֽלֶךְ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/017.yaml
  text: And Benaiah son of Jehoiada was over the Kerethites and the Pelethites[c][b][a], and David’s sons were the chief officials at the king’s side.
translation:
  language: pt
  text: Benaia, filho de Joiada, comandava os queretitas[a] e os peletitas; e os filhos de Davi eram os primeiros[b] junto ao rei[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também transliterado “quereteus” em algumas traduções.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “os primeiros” ou “os principais”; a expressão provavelmente indica posição elevada na corte.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “à mão do rei”, expressão que pode indicar proximidade pessoal ou serviço direto ao rei.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: comandava
  rationale: Neste contexto militar e administrativo, a preposição indica autoridade ou supervisão. “Comandava” expressa isso de modo natural, sem acrescentar uma patente específica.
- source_word: הַכְּרֵתִי
  choice: os queretitas
  rationale: Nome de grupo transliterado segundo uma forma corrente em português, sem tentar identificar ou interpretar sua origem.
- source_word: הַפְּלֵתִי
  choice: os peletitas
  rationale: Nome de grupo transliterado de modo convencional em português.
- source_word: הָרִאשֹׁנִים
  choice: os primeiros
  rationale: Mantém o sentido formal do hebraico, que pode indicar primazia, precedência ou alta posição, sem definir além do texto qual função oficial os filhos de Davi exerciam.
- source_word: לְיַד הַמֶּלֶךְ
  choice: junto ao rei
  rationale: Reproduz de maneira idiomática a ideia de proximidade e serviço pessoal expressa literalmente por “à mão do rei”, preservando alguma abertura quanto à natureza da função.
- source_word: וּבְנֵי דָוִיד
  choice: os filhos de Davi
  rationale: Tradução direta da construção nominal hebraica.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: Benaia, filho de Joiada
  rationale: Emprega as formas portuguesas tradicionais dos nomes e traduz naturalmente a relação filial.
theological_decisions:
- issue: Função dos filhos de Davi na corte
  choice: os primeiros junto ao rei
  alternative: os principais oficiais a serviço do rei
  rationale: O hebraico afirma sua primazia e proximidade ao rei, mas não traz um substantivo equivalente a “oficiais”. A tradução preserva essa ambiguidade, enquanto as notas esclarecem os sentidos possíveis.
translation_notes:
  register: Português moderno, claro e digno, com formas onomásticas tradicionais de ampla compreensão. A redação mantém o paralelismo da frase hebraica e evita introduzir “oficiais” no texto principal, pois esse cargo é inferido do contexto, não explicitado.
