  text: וְ/אַבְשַׁ֣י בֶּן צְרוּיָ֗ה הִכָּ֤ה אֶת אֱדוֹם֙ בְּ/גֵ֣יא הַמֶּ֔לַח שְׁמוֹנָ֥ה עָשָׂ֖ר אָֽלֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/012.yaml
  text: And Abishai son of Zeruiah struck down eighteen thousand Edomites in the Valley of Salt[a].
translation:
  language: pt
  text: E Abisai, filho de Zeruia, feriu dezoito mil edomitas no Vale do Sal[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Edom”; a tradução explicita que, neste contexto de batalha, a referência é ao povo de Edom, isto é, aos edomitas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְשַׁי
  choice: E Abisai
  rationale: A conjunção ו preserva a ligação narrativa com o contexto anterior; o nome é transliterado em sua forma portuguesa corrente.
- source_word: בֶּן צְרוּיָה
  choice: filho de Zeruia
  rationale: Reproduz diretamente a identificação genealógica, com formulação natural em português.
- source_word: הִכָּה
  choice: matou
  rationale: No contexto militar, seguido por um total de pessoas atingidas, o verbo נכה indica aqui abater ou matar. 'Matou' comunica com clareza o resultado, sem sugerir necessariamente que Abisai tenha executado pessoalmente cada ação.
- source_word: אֶת אֱדוֹם
  choice: edomitas
  rationale: Embora o hebraico diga literalmente 'Edom', o verbo militar e o número indicam que se trata do povo de Edom, não do território.
- source_word: בְּ/גֵיא הַמֶּלַח
  choice: no vale do Sal
  rationale: Traduz a construção nominal como topônimo, em forma clara e tradicional em português.
- source_word: שְׁמוֹנָה עָשָׂר אָלֶף
  choice: dezoito mil
  rationale: Reproduz o cardinal por extenso, adequado ao estilo literário bíblico.
theological_decisions:
- issue: Identificação de 'Edom' como povo ou território
  choice: o povo de Edom ('edomitas')
  alternative: o território de Edom
  rationale: O verbo de combate acompanhado de uma contagem de dezoito mil aponta fortemente para pessoas. A tradução explicita esse sentido contextual sem acrescentar uma conclusão doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem da frase acompanha de perto o hebraico sem perder naturalidade.
