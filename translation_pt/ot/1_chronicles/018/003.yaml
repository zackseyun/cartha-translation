  text: וַ/יַּ֥ךְ דָּוִ֛יד אֶת הֲדַדְעֶ֥זֶר מֶֽלֶךְ צוֹבָ֖ה חֲמָ֑תָ/ה בְּ/לֶכְתּ֕/וֹ לְ/הַצִּ֥יב יָד֖/וֹ בִּֽ/נְהַר פְּרָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/003.yaml
  text: David struck Hadadezer king of Zobah[b][a], as he went to establish his power at the Euphrates River.
translation:
  language: pt
  text: Davi feriu Hadadezer[a], rei de Zobá, na direção de Hamate, quando ia estabelecer seu domínio[b] junto ao rio Eufrates.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, o nome aparece como “Hadadezer”; no texto paralelo de 2 Samuel 8:3, aparece uma forma variante, muitas vezes transliterada como “Hadarezer”.
    reason: textual_variant
  - marker: b
    text: Ou “restabelecer seu controle”; mais literalmente, “estabelecer sua mão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: feriu
  rationale: Preserva o sentido concreto de נכה em contexto militar sem explicitar uma derrota total, como faria “derrotou”.
- source_word: הֲדַדְעֶזֶר
  choice: Hadadezer
  rationale: Translitera a forma do nome presente em Crônicas; a forma paralela de 2 Samuel 8:3 é registrada em nota.
- source_word: מֶלֶךְ צוֹבָה
  choice: rei de Zobá
  rationale: Reproduz diretamente a cadeia construta que identifica o cargo e o reino de Hadadezer.
- source_word: חֲמָתָה
  choice: na direção de Hamate
  rationale: A terminação direcional indica movimento ou extensão rumo a Hamate; a formulação evita transformar o local em ponto de chegada certo.
- source_word: בְּלֶכְתּוֹ
  choice: quando ia
  rationale: Expressa naturalmente a circunstância temporal do infinitivo construto com ב e deixa implícito o sujeito, como no hebraico.
- source_word: לְהַצִּיב יָדוֹ
  choice: estabelecer seu domínio
  rationale: Comunica o sentido político-militar provável da expressão idiomática “estabelecer a mão”, sem impor se se tratava de domínio novo ou restaurado.
- source_word: בִּנְהַר פְּרָת
  choice: junto ao rio Eufrates
  rationale: Identifica explicitamente o Eufrates como rio e traduz a preposição de modo natural para uma localização territorial.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com nomes próprios em formas correntes. A construção “quando ia estabelecer seu domínio” preserva a referência pronominal implícita do hebraico, sem resolver silenciosamente quem realizava a ação. “Na direção de Hamate” mantém a nuance direcional de חֲמָתָה.
