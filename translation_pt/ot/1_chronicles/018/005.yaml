base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/005.yaml
  text: And Aram of Damascus came to help Hadadezer king of Zobah[b][a], and David struck down twenty-two thousand men of Aram.
translation:
  language: pt
  text: E os arameus de Damasco[a] vieram ajudar Hadadezer[b], rei de Zobá, e Davi feriu vinte e dois mil homens de Aram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Aram de Damasco”; tradicionalmente, “os sírios de Damasco”.'
    reason: lexical_alternative
  - marker: b
    text: O nome é escrito “Hadadezer” aqui; algumas passagens paralelas trazem a variante “Hadarezer”.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲרַם דַּרְמֶשֶׂק
  choice: os arameus de Damasco
  rationale: Neste contexto militar, אֲרַם designa naturalmente o povo de Aram. “Arameus” evita o anacronismo potencial de “sírios” e produz uma frase clara em português.
- source_word: לַעְזוֹר
  choice: ajudar
  rationale: O infinitivo de עזר significa diretamente “ajudar, prestar auxílio”; “ajudar” é natural e adequado ao contexto militar.
- source_word: הֲדַדְעֶזֶר
  choice: Hadadezer
  rationale: Reproduz a forma do nome presente no texto hebraico deste versículo; a variante “Hadarezer” ocorre em passagens paralelas.
- source_word: מֶלֶךְ צוֹבָה
  choice: rei de Zobá
  rationale: Tradução direta do título real e do topônimo, com acentuação portuguesa para orientar a pronúncia.
- source_word: וַיַּךְ
  choice: matou
  rationale: No contexto de batalha, seguido de um número de homens atingidos, נכה indica aqui ação letal. “Matou” comunica com clareza o sentido contextual, embora o verbo isoladamente também possa significar “feriu” ou “derrotou”.
- source_word: בַּאֲרָם
  choice: homens de Aram
  rationale: A construção identifica as vítimas como pertencentes a Aram; conservar “Aram” mantém a referência etnogeográfica do hebraico.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף אִישׁ
  choice: vinte e dois mil homens
  rationale: Equivalente direto e idiomático da expressão numérica hebraica, sem acrescentar “soldados” ou “guerreiros”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Arameus” é preferido a “sírios” para preservar a referência histórica antiga. A conjunção foi vertida como “mas” na segunda oração para expressar naturalmente o contraste narrativo implícito.
