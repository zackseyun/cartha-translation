  text: וַ/יָּ֤שֶׂם בֶּֽ/אֱדוֹם֙ נְצִיבִ֔ים וַ/יִּהְי֥וּ כָל אֱד֖וֹם עֲבָדִ֣ים לְ/דָוִ֑יד וַ/יּ֤וֹשַׁע יְהוָה֙ אֶת דָּוִ֔יד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/013.yaml
  text: He placed garrisons in Edom, and all Edom became slaves to David. And the LORD gave David victory wherever he went.
translation:
  language: pt
  text: Ele estabeleceu guarnições em Edom, e todo o Edom se tornou servo de Davi. E o SENHOR dava vitória a Davi por onde quer que ele fosse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְצִיבִים
  choice: guarnições
  rationale: No contexto militar, o plural designa postos ou destacamentos colocados para controlar o território; “guarnições” comunica isso naturalmente.
- source_word: עֲבָדִים
  choice: ficou sujeito
  rationale: O termo pode significar escravos, servos ou súditos. Referindo-se coletivamente a Edom após a conquista, a expressão indica submissão política e evita sugerir, sem necessidade, que cada edomita foi escravizado individualmente.
- source_word: וַיּוֹשַׁע
  choice: dava vitória
  rationale: Embora a forma básica expresse salvar ou livrar, neste resumo militar significa conceder êxito ou vitória; o imperfeito português combina com a generalização “por onde quer que”.
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o nome divino pelo título em versaletes.
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: por onde quer que ele fosse
  rationale: Reproduz idiomaticamente a ideia distributiva de êxito em todos os lugares a que Davi ia.
theological_decisions:
- issue: Natureza da submissão de Edom
  choice: todo o Edom ficou sujeito a Davi
  alternative: todo o Edom se tornou escravo de Davi
  rationale: O coletivo político “Edom” e o campo semântico amplo de עבד favorecem aqui a ideia de vassalagem ou sujeição, sem eliminar a severidade da dominação conquistada.
- issue: Agência divina nas vitórias de Davi
  choice: o SENHOR dava vitória a Davi
  alternative: o SENHOR salvava Davi
  rationale: Mantém explicitamente o SENHOR como agente do êxito de Davi, enquanto traduz o verbo segundo seu sentido contextual militar.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A coordenação simples preserva o ritmo narrativo hebraico.
