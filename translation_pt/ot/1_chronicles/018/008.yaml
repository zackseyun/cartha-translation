base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/008.yaml
  text: And from Tibhath and from Cun, cities of Hadadezer, David took a very great amount of bronze; with it Solomon made the bronze sea, the pillars, and the bronze articles.
translation:
  language: pt
  text: De Tibate e de Cum, cidades de Hadadezer, Davi tomou uma quantidade enorme de bronze. Com esse bronze, Salomão fez o Mar de bronze, as colunas e os utensílios de bronze.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: No contexto dos objetos do templo, “bronze” é a designação tradicional e natural, embora o termo hebraico possa abranger cobre e suas ligas.
- source_word: רַבָּה מְאֹד
  choice: uma quantidade enorme
  rationale: Expressa em português corrente a forte intensificação do hebraico, literalmente “muito grande/numerosa”.
- source_word: יָם הַנְּחֹשֶׁת
  choice: Mar de bronze
  rationale: Conserva o nome técnico e a imagem hebraica do grande reservatório do templo.
- source_word: כְּלֵי הַנְּחֹשֶׁת
  choice: utensílios de bronze
  rationale: “Utensílios” comunica adequadamente os objetos ou implementos de bronze no contexto cultual.
- source_word: בָּהּ
  choice: Com esse bronze
  rationale: Explicita apenas o antecedente gramatical feminino, “bronze”, evitando a ambiguidade menos natural do pronome isolado em português.
