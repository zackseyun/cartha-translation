translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Os nomes próprios seguem formas portuguesas reconhecíveis. A ordem foi levemente ajustada para evitar ambiguidade quanto ao sujeito de “havia combatido”, e as expansões contextuais foram explicitadas em notas.
