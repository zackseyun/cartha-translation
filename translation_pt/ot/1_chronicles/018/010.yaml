  text: וַ/יִּשְׁלַ֣ח אֶת הֲדֽוֹרָם בְּנ֣/וֹ אֶל הַ/מֶּֽלֶךְ דָּ֠וִיד ל/שאול ל֨/וֹ לְ/שָׁל֜וֹם וּֽ/לְ/בָרֲכ֗/וֹ עַל֩ אֲשֶׁ֨ר נִלְחַ֤ם בַּ/הֲדַדְעֶ֨זֶר֙ וַ/יַּכֵּ֔/הוּ כִּי אִ֛ישׁ מִלְחֲמ֥וֹת תֹּ֖עוּ הָיָ֣ה הֲדַדְעָ֑זֶר וְ/כֹ֗ל כְּלֵ֛י זָהָ֥ב וָ/כֶ֖סֶף וּ/נְחֹֽשֶׁת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/010.yaml
  text: So he sent Hadoram his son to King David to ask about his welfare and to bless him because he had fought against Hadadezer and struck him down[a], for Hadadezer had been at war with Tou[d][c][b]; and he sent all kinds of articles of gold and silver and bronze.
translation:
  language: pt
  text: Por isso, ele enviou seu filho Hadorão ao rei Davi para saber como ele estava[a] e abençoá-lo[b], porque Davi havia combatido Hadadezer e o derrotado. Pois Hadadezer estava em guerra com Toú[c]. Toú também enviou[d] todo tipo de objetos de ouro, prata e bronze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “para lhe perguntar sobre a paz”. Aqui, “paz” significa bem-estar.
    reason: lexical_alternative
  - marker: b
    text: Neste contexto diplomático, “abençoá-lo” também pode ter o sentido de “felicitá-lo”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “Hadadezer era um homem de guerras com Toú”.
    reason: lexical_alternative
  - marker: d
    text: O hebraico diz apenas “e todo tipo de objetos de ouro, prata e bronze”; o verbo “enviou” é retomado do contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח אֶת הֲדוֹרָם בְּנוֹ
  choice: ele enviou seu filho Hadorão
  rationale: A forma narrativa indica a ação seguinte, e o sujeito é recuperado do contexto anterior. A construção portuguesa expressa naturalmente a relação entre Hadorão e seu pai.
- source_word: לִשְׁאוֹל לוֹ לְשָׁלוֹם
  choice: para saber como ele estava
  rationale: O idioma hebraico fala em perguntar pelo shalom de alguém, isto é, por seu bem-estar. A formulação escolhida transmite esse sentido em português corrente.
- source_word: וּלְבָרֲכוֹ
  choice: e abençoá-lo
  rationale: Mantém o sentido básico de ברך e preserva a tonalidade diplomática e religiosa, sem excluir a nuance contextual de felicitação.
- source_word: נִלְחַם בַּהֲדַדְעֶזֶר וַיַּכֵּהוּ
  choice: havia combatido Hadadezer e o derrotado
  rationale: נכה descreve aqui o golpe ou revés militar infligido a Hadadezer; 'derrotado' comunica o resultado sem afirmar que ele foi morto.
- source_word: אִישׁ מִלְחֲמוֹת תֹּעוּ הָיָה הֲדַדְעָזֶר
  choice: Hadadezer vivia em guerra com Toú
  rationale: A expressão literal 'homem de guerras' é idiomática. A tradução comunica de modo natural uma situação recorrente ou estabelecida de hostilidade militar.
- source_word: וְכֹל כְּלֵי זָהָב וָכֶסֶף וּנְחֹשֶׁת
  choice: Ele também enviou todo tipo de objetos de ouro, prata e bronze
  rationale: כְּלֵי pode designar objetos, utensílios ou artigos. 'Objetos' é abrangente, e 'bronze' é adequado ao contexto metalúrgico antigo. O verbo é suprido pelo contexto e assinalado em nota.
