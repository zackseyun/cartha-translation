  text: וַ/יִּמְלֹ֥ךְ דָּוִ֖יד עַל כָּל יִשְׂרָאֵ֑ל וַ/יְהִ֗י עֹשֶׂ֛ה מִשְׁפָּ֥ט וּ/צְדָקָ֖ה לְ/כָל עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/014.yaml
  text: So David reigned over all Israel[a], and he administered justice and righteousness to all his people.
translation:
  language: pt
  text: Assim, Davi reinou sobre todo o Israel e exercia justiça e retidão para com todo o seu povo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: O qal wayyiqtol de מלך descreve o exercício do governo régio; “reinou” é natural e fiel no contexto narrativo.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: sobre todo o Israel
  rationale: A preposição עַל com מלך indica o âmbito governado, e “todo o Israel” preserva a abrangência expressa no hebraico.
- source_word: וַיְהִי עֹשֶׂה
  choice: e administrava
  rationale: A construção היה + particípio indica ação habitual ou contínua. “Administrava” expressa essa duração e se ajusta ao contexto de governo.
- source_word: מִשְׁפָּט
  choice: o direito
  rationale: No contexto régio e administrativo, מִשְׁפָּט designa a ordem jurídica e a prática de decisões justas. “O direito” distingue o aspecto judicial do termo seguinte.
- source_word: וּצְדָקָה
  choice: e a justiça
  rationale: צְדָקָה denota retidão ou justiça. Neste par, “justiça” comunica de modo claro a conformidade moral com o que é reto sem fundir os dois substantivos.
- source_word: לְכָל עַמּוֹ
  choice: a todo o seu povo
  rationale: A preposição לְ marca aqui aqueles em favor de quem ou diante de quem o governo justo era exercido; a formulação portuguesa é natural e preserva o sufixo possessivo.
theological_decisions:
- issue: Tradução do par régio מִשְׁפָּט וּצְדָקָה
  choice: o direito e a justiça
  alternative: a justiça e a retidão
  rationale: 'A escolha mantém dois conceitos relacionados, mas distintos: a administração jurídica e a conformidade moral ao que é reto. Assim, não reduz a descrição teológica do reinado justo de Davi a uma única ideia.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O aspecto habitual de וַיְהִי עֹשֶׂה é representado pelo imperfeito “administrava”. A coordenação “o direito e a justiça” é idiomática no registro público e preserva a distinção lexical hebraica.
