    issue: Formulação pouco natural para a ação régia e seus destinatários
    rationale: Em português, «administrar o direito ... a» não é a forma mais fluente para descrever a prática contínua de justiça por um rei. «Exercer justiça ... para com» conserva o sentido e melhora a legibilidade.
  - severity: low
    issue: Distinção lexical do par hebraico pode ficar obscurecida
    rationale: «Direito e justiça» é possível, mas «justiça e retidão» representa mais diretamente o aspecto judicial de מִשְׁפָּט e a retidão/righteousness de צְדָקָה.
  revised_text: Assim, Davi reinou sobre todo o Israel e exercia justiça e retidão para com todo o seu povo.
