base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/007.yaml
  text: And David took the shields of gold that were on the servants of Hadadezer and brought them to Jerusalem[a][b][c].
translation:
  language: pt
  text: Davi tomou os escudos de ouro que estavam com os servos de Hadadezer e os levou para Jerusalém.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “escudos dourados”; o hebraico também pode se referir a escudos revestidos de ouro.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “servos” provavelmente se refere aos membros do séquito real ou aos auxiliares militares de Hadadezer, não necessariamente a escravos domésticos no sentido moderno mais restrito.
    reason: cultural_note
  - marker: c
    text: Em outras ocorrências e tradições textuais, o nome também aparece com a grafia “Hadarezer”.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקַּח
  choice: tomou
  rationale: O verbo לקח significa normalmente “tomar” na narrativa. Embora o contexto militar permita “capturou” ou “apoderou-se de”, “tomou” preserva o sentido básico sem explicitar além do hebraico.
- source_word: שִׁלְטֵי הַזָּהָב
  choice: os escudos de ouro
  rationale: שׁלטים designa escudos, possivelmente escudos menores. A construção “escudos de ouro” acompanha de perto a expressão hebraica e deixa em aberto se eram inteiramente de ouro ou revestidos dele.
- source_word: אֲשֶׁר הָיוּ עַל
  choice: que estavam com
  rationale: O hebraico diz literalmente “que estavam sobre”. Em português, “estavam com” expressa naturalmente que os servos os portavam, sem afirmar que lhes pertenciam.
- source_word: עַבְדֵי הֲדַדְעָזֶר
  choice: os servos de Hadadezer
  rationale: עבדים é o termo comum para “servos”. Neste contexto régio-militar, pode indicar integrantes do séquito ou auxiliares militares, mas “servos” mantém a amplitude lexical.
- source_word: הֲדַדְעָזֶר
  choice: Hadadezer
  rationale: Esta é a forma do nome no texto massorético deste versículo; “Hadarezer” ocorre em outras tradições e no paralelo.
- source_word: וַיְבִיאֵם יְרוּשָׁלִָם
  choice: e os levou para Jerusalém
  rationale: No hifil, בוא significa “fazer vir/trazer”. Como o ponto de vista narrativo não está situado em Jerusalém, “levou para Jerusalém” é a formulação mais natural em português e representa o sufixo pronominal masculino plural.
theological_decisions: []
translation_notes:
  register: Português atual, digno e de leitura ampla, com construção narrativa direta. “Estavam com” evita o pouco natural “estavam sobre” e preserva a ideia de que os homens portavam os escudos sem transformar a relação em posse. Os marcadores de nota foram mantidos no texto principal.
