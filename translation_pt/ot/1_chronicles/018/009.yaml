  text: When Tou king of Hamath heard that David had struck down all the army of Hadadezer king of Zobah,[a]
translation:
  language: pt
  text: Quando Toú, rei de Hamate, soube que Davi havia derrotado todo o exército de Hadadezer, rei de Zobá,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Toú”; no relato paralelo de 2 Samuel 8:9, o nome aparece como “Toí”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Quando ... soube
  rationale: O wayyiqtol faz a narrativa avançar, mas aqui a oração funciona como circunstância temporal que prepara a ação do versículo seguinte; esta formulação é natural em português.
- source_word: תֹּעוּ
  choice: Toú
  rationale: Transliteração do nome conforme a forma hebraica de Crônicas, com acento gráfico para orientar a pronúncia em português.
- source_word: מֶלֶךְ חֲמָת
  choice: rei de Hamate
  rationale: Reproduz diretamente a cadeia de construto que identifica o cargo e o reino de Toú.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo daquilo que Toú soube.
- source_word: הִכָּה
  choice: havia derrotado
  rationale: No contexto militar, נכה indica vencer ou abater. “Derrotado” comunica com clareza o resultado aplicado a todo o exército, sem exigir que cada soldado tenha sido morto.
- source_word: כָּל
  choice: todo o
  rationale: Mantém o quantificador explícito do hebraico.
- source_word: חֵיל
  choice: exército
  rationale: Neste contexto militar, חֵיל designa as forças armadas de Hadadezer.
- source_word: הֲדַדְעֶזֶר
  choice: Hadadezer
  rationale: Transliteração da forma do nome presente no texto hebraico de Crônicas.
- source_word: מֶלֶךְ צוֹבָה
  choice: rei de Zobá
  rationale: Tradução direta do título, com transliteração portuguesa corrente do topônimo.
