base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/006.yaml
  text: And David placed garrisons in Aram of Damascus[a], and the Arameans became David’s servants, bringing tribute[c][b]. And Yahweh gave victory to David wherever he went.
translation:
  language: pt
  text: Davi estabeleceu guarnições no Arã de Damasco[a], e os arameus se tornaram servos de Davi, trazendo tributo. E Yahweh deu vitória a Davi por onde quer que ele fosse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “posicionou tropas”; mais literalmente, “pôs”. O objeto “guarnições” está subentendido no contexto militar.
    reason: lexical_alternative
  - marker: b
    text: Ou “salvou Davi” ou “livrou Davi”. Neste contexto de guerra, a expressão significa que Yahweh lhe concedeu vitória.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: estabeleceu guarnições
  rationale: O verbo significa literalmente “pôs” ou “colocou”, sem objeto expresso; o contexto militar e o relato paralelo indicam que se tratava de guarnições. “Estabeleceu guarnições” explicita com naturalidade o objeto subentendido.
- source_word: בַּאֲרָם דַּרְמֶשֶׂק
  choice: no Arã de Damasco
  rationale: Conserva a designação hebraica da região arameia ligada a Damasco, sem reduzi-la apenas à cidade.
- source_word: אֲרָם
  choice: os arameus
  rationale: Neste contexto, o nome designa o povo submetido a Davi. “Arameus” reproduz o etnônimo hebraico com mais precisão histórica do que o tradicional “sírios”.
- source_word: עֲבָדִים
  choice: servos
  rationale: Mantém o sentido lexical amplo do termo e, no contexto político, comunica submissão e condição de vassalagem sem especificar escravidão como propriedade.
- source_word: נֹשְׂאֵי מִנְחָה
  choice: trazendo tributo
  rationale: A construção participial descreve a entrega contínua de tributo a um soberano; esta formulação é clara e natural em português.
- source_word: וַיּוֹשַׁע
  choice: dava vitória
  rationale: O hiphil de יָשַׁע significa salvar ou livrar; em narrativa militar, “dar vitória” comunica sua força contextual. O imperfeito narrativo pode ser expresso naturalmente por “dava” diante da ideia reiterada de “por onde quer que” Davi fosse.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: por onde quer que ele fosse
  rationale: Expressa de modo idiomático e abrangente o êxito de Davi em todos os lugares a que se dirigia, sem restringir a expressão apenas a marchas militares.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo pelo título “SENHOR”.
- issue: Sentido militar de וַיּוֹשַׁע
  choice: dava vitória
  alternative: salvava; livrava
  rationale: O sentido básico de salvação ou livramento permanece reconhecível, mas o contexto de campanhas militares favorece a expressão idiomática “dava vitória”, sem atribuir ao verbo uma conotação soteriológica mais estreita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Arã” e “arameus” preservam a nomenclatura histórica hebraica. A sintaxe mantém a sequência narrativa e o paralelismo do versículo sem soar artificial.
