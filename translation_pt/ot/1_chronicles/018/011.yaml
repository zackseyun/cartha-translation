base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/011.yaml
  text: 'King David also dedicated these to Yahweh[a], along with the silver and the gold that he had taken from all the nations: from Edom, Moab, the Ammonites, the Philistines[c][b], and Amalek.'
translation:
  language: pt
  text: 'O rei Davi também consagrou esses objetos[a] a Yahweh, junto com a prata e o ouro que havia tomado[b] de todas as nações: de Edom, de Moabe, dos amonitas[c], dos filisteus e de Amaleque.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os consagrou”; o pronome se refere aos objetos de bronze mencionados no versículo anterior.
    reason: cross_reference
  - marker: b
    text: Ou “havia levado” ou “havia carregado”; o verbo hebraico pode significar “levantar” ou “carregar” e, aqui, tem o sentido de tomar despojo ou tributo de nações conquistadas.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “filhos de Amom”, isto é, os amonitas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֹתָם
  choice: também esses objetos
  rationale: גַּם indica continuidade com o versículo anterior, e o pronome אֹתָם retoma os objetos de bronze ali mencionados. A explicitação de “objetos” torna a referência natural em português sem alterar o referente.
- source_word: הִקְדִּישׁ
  choice: consagrou
  rationale: No contexto de bens destinados a Yahweh, expressa adequadamente a ação de separá-los para uso sagrado.
- source_word: עִם הַכֶּסֶף וְהַזָּהָב
  choice: junto com a prata e o ouro
  rationale: Preserva a ideia de que esses objetos foram consagrados juntamente com os metais preciosos já reunidos.
- source_word: אֲשֶׁר נָשָׂא
  choice: que havia tomado
  rationale: נָשָׂא significa literalmente levantar ou carregar e, neste contexto militar, refere-se a tomar bens como despojo ou tributo. “Tomado” é natural e mantém aberta a natureza exata da aquisição.
- source_word: מִכָּל הַגּוֹיִם
  choice: de todas as nações
  rationale: “Nações” comunica o sentido político-étnico de גּוֹיִם neste contexto.
- source_word: מִבְּנֵי עַמּוֹן
  choice: dos amonitas
  rationale: A expressão hebraica literal “filhos de Amom” funciona como designação étnica; “amonitas” é seu equivalente corrente em português.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama. “Yahweh” representa o nome próprio, em vez de substituí-lo por um título, sem acrescentar interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com ordem sintática natural. Emprega “consagrou” no contexto cultual, mantém a lista geográfica do hebraico e posiciona cada marcador junto ao termo que sua nota esclarece.
