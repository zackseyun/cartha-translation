revisions:
- from: E os arameus fugiram diante de Israel. Davi matou sete mil guerreiros de carros de guerra[a] e quarenta mil soldados de infantaria; também matou Sofaque, comandante do exército.[b]
  to: E os arameus fugiram diante de Israel, e Davi matou, dentre os arameus, sete mil guerreiros de carros de guerra e quarenta mil soldados de infantaria[a]; também matou Sofaque[b], comandante do exército.
  rationale: A revisão restaura a indicação de que as tropas mortas eram arameias, corrige a descrição da variante na passagem paralela e reposiciona a âncora da nota de nome. Mantém-se “guerreiros de carros de guerra” no texto principal como formulação natural para a força de carros, enquanto a nota registra de modo mais literal a divergência numérica e militar entre Crônicas e Samuel.
