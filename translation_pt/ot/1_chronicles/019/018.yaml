base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/018.yaml
  text: And Aram fled before Israel[a], and David killed seven thousand chariot warriors from Aram and forty thousand foot soldiers[b], and he put Shophach the commander of the army to death.
translation:
  language: pt
  text: E os arameus fugiram diante de Israel, e Davi matou, dentre os arameus, sete mil guerreiros de carros de guerra e quarenta mil soldados de infantaria[a]; também matou Sofaque[b], comandante do exército.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A passagem paralela em 2 Samuel 10:18 traz “setecentos carros de guerra e quarenta mil cavaleiros”. Aqui, Crônicas traz “sete mil carros de guerra e quarenta mil soldados de infantaria”.
    reason: textual_variant
  - marker: b
    text: Na passagem paralela de 2 Samuel 10:16, 18, Sofaque é chamado Sobaque.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲרָם
  choice: os arameus
  rationale: Embora o hebraico use o nome coletivo “Arã”, o contexto descreve suas forças militares; “os arameus” comunica naturalmente o referente sem introduzir o nome geopolítico posterior “Síria”.
- source_word: וַיָּנָס ... מִלִּפְנֵי יִשְׂרָאֵל
  choice: fugiram diante de Israel
  rationale: נוּס significa “fugir”, e a expressão מִלִּפְנֵי indica uma retirada ou debandada diante do inimigo. O plural concorda naturalmente em português com “os arameus”.
- source_word: וַיַּהֲרֹג דָּוִיד
  choice: Davi matou
  rationale: Tradução direta e atual de הרג, apropriada à narrativa de batalha.
- source_word: שִׁבְעַת אֲלָפִים רֶכֶב
  choice: sete mil guerreiros de carros de guerra
  rationale: רֶכֶב designa literalmente carros ou a força de carros. A tradução metonímica evita contar simplesmente veículos e, sem restringir o termo aos condutores, expressa o pessoal militar associado aos carros.
- source_word: וְאַרְבָּעִים אֶלֶף אִישׁ רַגְלִי
  choice: quarenta mil soldados de infantaria
  rationale: אִישׁ רַגְלִי, literalmente “homem a pé”, é uma expressão militar para soldados de infantaria.
- source_word: שׁוֹפַךְ
  choice: Sofaque
  rationale: Transliteração portuguesa da forma do nome registrada em Crônicas; a forma divergente de 2 Samuel é indicada em nota.
- source_word: שַׂר הַצָּבָא
  choice: comandante do exército
  rationale: Expressão clara e digna para o oficial que comandava as forças militares.
- source_word: הֵמִית
  choice: também matou
  rationale: O hifil de מות significa “fazer morrer”. “Matou” é natural em português; “também” mantém Sofaque como vítima adicional sem sugerir necessariamente uma execução formal.
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e digno, com legibilidade brasileira. A construção foi dividida em duas frases para evitar uma sequência pesada de coordenações. Os marcadores foram posicionados junto aos elementos que explicam: [a] após a contagem das tropas de carros e [b] após a referência a Sofaque.'
