    reason: textual_variant
  - marker: b
    text: Na passagem paralela de 2 Samuel 10:16, 18, Sofaque é chamado Sobaque.
    reason: alternative_reading
  revision_rationale: A revisão restaura a indicação de que as tropas mortas eram arameias, corrige a descrição da variante na passagem paralela e reposiciona a âncora da nota de nome. Mantém-se “guerreiros de carros de guerra” no texto principal como formulação natural para a força de carros, enquanto a nota registra de modo mais literal a divergência numérica e militar entre Crônicas e Samuel.
