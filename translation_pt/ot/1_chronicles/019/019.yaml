base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/019.yaml
  text: When the servants of Hadadezer saw that they had been defeated before Israel[a], they made peace with David and served him. And Aram was no longer willing to help the sons of Ammon.
translation:
  language: pt
  text: Quando os servos de Hadadezer viram que tinham sido derrotados diante de Israel, fizeram paz com Davi e o serviram. E Aram não quis mais ajudar os amonitas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os filhos de Amom”, expressão que funciona como designação étnica dos amonitas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי
  choice: servos
  rationale: No contexto régio e político, designa subordinados ou súditos de Hadadezer; “servos” preserva a relação de dependência sem especificar escravidão.
- source_word: נִגְּפוּ
  choice: tinham sido derrotados
  rationale: O nifal expressa derrota militar sofrida; a forma composta deixa clara a anterioridade em relação ao que eles viram.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: diante de Israel
  rationale: Preserva de modo inteligível o idioma hebraico, que neste contexto indica derrota perante ou pelas forças de Israel.
- source_word: וַיַּשְׁלִימוּ עִם דָּוִיד
  choice: fizeram as pazes com Davi
  rationale: Expressa naturalmente a celebração de paz ou acordo com Davi.
- source_word: וַיַּעַבְדֻהוּ
  choice: passaram a servi-lo
  rationale: Indica que, após o acordo, ficaram politicamente sujeitos a Davi; “passaram a” torna natural em português a mudança de condição implícita na sequência.
- source_word: אֲרָם
  choice: Aram
  rationale: Mantém o nome próprio hebraico e sua referência coletiva, sem substituí-lo pelo nome geopolítico posterior “Síria”.
- source_word: לְהוֹשִׁיעַ
  choice: ajudar
  rationale: No contexto de aliança militar, o verbo significa acudir ou prestar auxílio, não exigindo a formulação mais ampla “salvar”.
- source_word: בְּנֵי עַמּוֹן
  choice: os amonitas
  rationale: A expressão literal “filhos de Amom” funciona como designação étnica; “os amonitas” é a forma corrente e clara em português.
- source_word: לֹא אָבָה ... עוֹד
  choice: não quis mais
  rationale: Reproduz de forma natural a combinação de falta de disposição com a ideia temporal de não continuar a prestar ajuda.
