  text: חֲזַ֤ק וְ/נִֽתְחַזְּקָה֙ בְּעַד עַמֵּ֔/נוּ וּ/בְעַ֖ד עָרֵ֣י אֱלֹהֵ֑י/נוּ וַֽ/יהוָ֔ה הַ/טּ֥וֹב בְּ/עֵינָ֖י/ו יַעֲשֶֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/013.yaml
  text: Be strong[a], and let us be strong for our people and for the cities of our God[b], and may Yahweh do what is good in his eyes.
translation:
  language: pt
  text: Seja forte, e sejamos fortes[a] pelo nosso povo e pelas cidades do nosso Deus; e que Yahweh faça o que é bom aos seus olhos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e fortaleçamo-nos”. O verbo hebraico tem forma reflexiva ou intensiva e expressa resolução ativa.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e Yahweh fará o que é bom aos seus olhos”. Neste contexto, a forma hebraica pode ser entendida como volitiva ou preditiva.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֲזַק
  choice: Seja forte
  rationale: O imperativo qal, masculino singular, exorta diretamente à força e à coragem. “Seja forte” é conciso, natural e mantém a ligação verbal com a exortação seguinte.
- source_word: וְנִתְחַזְּקָה
  choice: e sejamos fortes
  rationale: O hitpael coortativo, primeira pessoa do plural, expressa resolução e envolvimento ativo. “Sejamos fortes” é a formulação mais natural em português; a nota registra a possível explicitação reflexiva ou intensiva.
- source_word: בְּעַד
  choice: pelo / pelas
  rationale: Neste contexto militar e comunitário, a preposição indica agir em defesa ou em benefício de alguém. “Pelo nosso povo” e “pelas cidades” comunicam isso de modo idiomático.
- source_word: עַמֵּנוּ
  choice: nosso povo
  rationale: עַם designa o povo como coletividade, não apenas o exército; por isso, “povo” preserva a abrangência do hebraico.
- source_word: עָרֵי אֱלֹהֵינוּ
  choice: as cidades do nosso Deus
  rationale: A construção possessiva é mantida de modo transparente, preservando a afirmação de que essas cidades pertencem a Deus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הַטּוֹב בְּעֵינָיו
  choice: o que é bom aos seus olhos
  rationale: Mantém a imagem do idioma hebraico e comunica aquilo que Deus considera bom ou correto.
- source_word: יַעֲשֶׂה
  choice: que ... faça
  rationale: No contexto das exortações anteriores, o imperfeito admite força volitiva, expressando entrega respeitosa do resultado a Deus. A nota preserva também a leitura preditiva.
theological_decisions:
- issue: Forma de verter o nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR / Jeová
  rationale: O texto traz diretamente o nome da aliança. “Yahweh” preserva-o como nome pessoal, sem substituí-lo por um título.
- issue: Nuance modal da oração final
  choice: e que Yahweh faça o que é bom aos seus olhos
  alternative: e Yahweh fará o que é bom aos seus olhos
  rationale: A leitura volitiva combina a determinação humana com a submissão à vontade de Deus; a leitura preditiva continua gramaticalmente possível e é registrada em nota, sem eliminar a ambiguidade.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A coordenação e o paralelismo do hebraico foram preservados; o ponto e vírgula separa a exortação humana da entrega do resultado a Yahweh.
