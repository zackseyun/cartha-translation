  text: וַ/יֻּגַּ֣ד לְ/דָוִ֗יד וַ/יֶּאֱסֹ֤ף אֶת כָּל יִשְׂרָאֵל֙ וַ/יַּעֲבֹ֣ר הַ/יַּרְדֵּ֔ן וַ/יָּבֹ֣א אֲלֵ/הֶ֔ם וַֽ/יַּעֲרֹ֖ךְ אֲלֵ/הֶ֑ם וַ/יַּעֲרֹ֨ךְ דָּוִ֜יד לִ/קְרַ֤את אֲרָם֙ מִלְחָמָ֔ה וַ/יִּֽלָּחֲמ֖וּ עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/017.yaml
  text: When it was reported to David[a], he gathered all Israel, crossed the Jordan, came against them, and drew up in battle formation against them. Then David drew up for battle to meet Aram, and they fought with him.
translation:
  language: pt
  text: Quando isso foi informado a Davi, ele reuniu todo o Israel, atravessou o Jordão, avançou contra eles e dispôs as tropas em formação de batalha contra eles. Então Davi dispôs suas tropas para a batalha, ao encontro de Arã, e eles combateram contra ele[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “combateram com ele”. Neste contexto, a expressão descreve combate contra Davi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד לְדָוִיד
  choice: Quando isso foi informado a Davi
  rationale: Mantém a construção passiva e impessoal do hebraico, sem introduzir quem levou a notícia; “isso” retoma naturalmente os acontecimentos anteriores.
- source_word: וַיֶּאֱסֹף אֶת כָּל יִשְׂרָאֵל
  choice: ele reuniu todo o Israel
  rationale: “Reuniu” expressa com naturalidade o ajuntamento de Israel, provavelmente para fins militares, sem tornar explícito mais do que o texto diz.
- source_word: וַיַּעֲבֹר הַיַּרְדֵּן
  choice: atravessou o Jordão
  rationale: Tradução direta e idiomática do movimento de cruzar o rio.
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: avançou contra eles
  rationale: O verbo com אֶל pode significar simplesmente “foi até eles”, mas o contexto militar favorece um movimento hostil; “avançou contra” comunica isso sem excessiva expansão.
- source_word: וַיַּעֲרֹךְ אֲלֵיהֶם
  choice: dispôs as tropas em formação de batalha diante deles
  rationale: Em contexto militar, ערך indica pôr em ordem ou formar a linha de batalha. A menção a “tropas” está implícita no ato de Davi reunir Israel e torna a frase clara em português.
- source_word: וַיַּעֲרֹךְ דָּוִיד לִקְרַאת אֲרָם מִלְחָמָה
  choice: Então Davi dispôs suas tropas para a batalha, ao encontro de Arã
  rationale: Preserva a repetição de ערך por meio de “dispôs”, expressa מִלְחָמָה como “para a batalha” e mantém em לִקְרַאת a ideia de ir ao encontro do adversário, sem reduzi-la automaticamente a “contra”.
- source_word: אֲרָם
  choice: Arã
  rationale: Emprega a forma portuguesa tradicional e atual do nome do território ou povo, evitando o anacrônico “Síria” e sem substituir o nome hebraico pelo interpretativo “arameus”.
- source_word: וַיִּלָּחֲמוּ עִמּוֹ
  choice: e eles combateram com ele
  rationale: Conserva a preposição עִם, literalmente “com”, e a ambiguidade formal da expressão, enquanto “combateram” deixa claro que se trata de confronto; a nota registra o sentido contextual provável.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sequência narrativa foi mantida de forma fluente; o vocabulário militar explicita apenas o sentido contextual de ערך. O marcador [a] foi colocado junto à expressão a que a nota se refere.
