    text: 'Literalmente: “combateram com ele”. Neste contexto, a expressão descreve combate contra Davi.'
    reason: lexical_alternative
  revision_rationale: A revisão corrige o valor adversativo de עליהם na primeira disposição de batalha e torna explícito, na tradução principal, o sentido contextual adversativo de לחם עם. A nota preserva a formulação literal hebraica, sem atribuir ao texto uma nuance doutrinária ou histórica adicional.
