base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/004.yaml
  text: So Hanun took David’s servants[a], shaved them, cut their garments in half up to the hips[b], and sent them away.
translation:
  language: pt
  text: Então Hanum pegou os servos de Davi[a], raspou-os, cortou-lhes as roupas pela metade, até as nádegas[b], e os mandou embora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O relato paralelo em 2 Samuel 10:4 especifica que Hanum raspou metade da barba deles. Crônicas diz apenas que ele “os raspou”.
    reason: cross_reference
  - marker: b
    text: Ou “até a região traseira”. O hebraico se refere à área das nádegas e ressalta a humilhação pública causada pela exposição.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי
  choice: servos
  rationale: O substantivo pode designar servos ou escravos; neste contexto, refere-se aos homens que serviam a Davi como enviados reais, sem destacar condição de escravidão.
- source_word: וַיְגַלְּחֵם
  choice: raspou-os
  rationale: O verbo significa raspar ou barbear. Crônicas não explicita o que foi raspado, por isso a tradução preserva essa indeterminação, sem importar do paralelo em 2 Samuel a menção à metade da barba.
- source_word: מַדְוֵיהֶם
  choice: as roupas deles
  rationale: O termo designa vestes ou roupas. Esta formulação é clara e natural em português contemporâneo.
- source_word: בַּחֵצִי
  choice: pela metade
  rationale: Expressa que as roupas foram cortadas até a metade; a formulação portuguesa comunica de modo idiomático o corte mutilador.
- source_word: עַד הַמִּפְשָׂעָה
  choice: até as nádegas
  rationale: O substantivo aponta para a região traseira ou das nádegas. A tradução direta preserva a humilhação pública causada pela exposição corporal.
- source_word: וַיְשַׁלְּחֵם
  choice: os mandou embora
  rationale: O verbo significa enviar; no contexto, a expressão transmite naturalmente que Hanum os despachou depois de humilhá-los.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura narrativa concisa do hebraico foi mantida, assim como a indeterminação do objeto do ato de raspar. “Nádegas” foi preferido a um eufemismo menos preciso por refletir diretamente o referente hebraico sem recorrer a linguagem vulgar.
