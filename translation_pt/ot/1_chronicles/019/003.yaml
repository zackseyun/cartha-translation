base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/003.yaml
  text: But the princes of the Ammonites said to Hanun[a], “Is David honoring your father in your sight because he has sent comforters to you? Have not his servants come to you in order to search out, to overthrow[b], and to spy out the land?”
translation:
  language: pt
  text: 'Mas os príncipes dos amonitas disseram a Hanum: “Será que, aos seus olhos[a], Davi está honrando seu pai porque enviou consoladores a você? Não foi para investigar, subverter[b] e espionar a terra que os servos dele vieram até você?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em sua opinião”. Literalmente, “aos seus olhos”; expressão hebraica que se refere à percepção ou avaliação de Hanum.
    reason: lexical_alternative
  - marker: b
    text: Ou “virar de ponta-cabeça” ou “derrubar”. O verbo hebraico significa virar ou revirar e, neste contexto, sugere uma ação hostil contra a terra.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי
  choice: príncipes
  rationale: O termo designa governantes ou altos oficiais; “príncipes” preserva a elevada posição política no contexto da corte.
- source_word: הַמְכַבֵּד
  choice: está honrando
  rationale: O particípio de כבד expressa tratar alguém com honra ou respeito, aqui dentro de uma pergunta que lança suspeita sobre a intenção de Davi.
- source_word: בְּעֵינֶיךָ
  choice: aos seus olhos
  rationale: Mantém a imagem do idioma hebraico e indica a percepção ou avaliação de Hanum.
- source_word: מְנַחֲמִים
  choice: consoladores
  rationale: O particípio de נחם designa pessoas enviadas para consolar alguém após uma perda; “consoladores” é conciso e adequado ao luto.
- source_word: בַּעֲבוּר
  choice: para
  rationale: A preposição introduz a finalidade atribuída pelos príncipes à visita dos enviados.
- source_word: לַחְקֹר
  choice: investigar
  rationale: חקר pode significar examinar ou pesquisar minuciosamente; “investigar” é natural e combina com o contexto de reconhecimento hostil.
- source_word: וְלַהֲפֹךְ
  choice: subverter
  rationale: הפך significa literalmente virar ou revirar; neste contexto político-militar, “subverter” comunica uma ação hostil sem eliminar a imagem lexical, registrada em nota.
- source_word: וּלְרַגֵּל
  choice: espionar
  rationale: No piel, רגל costuma indicar espionagem ou reconhecimento; “espionar” é direto e corrente.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: אֶרֶץ refere-se aqui ao território dos amonitas; “a terra” preserva o sentido territorial amplo e o registro narrativo bíblico.
- source_word: עֲבָדָיו
  choice: os servos dele
  rationale: Em contexto régio, עֶבֶד pode designar servos ou enviados da corte; a tradução direta evita especificar uma função não declarada.
