base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/005.yaml
  text: They went and told David about the men[a], and he sent to meet them, because the men were greatly humiliated. And the king said, “Stay in Jericho until your beards have grown back[b], then return.”
translation:
  language: pt
  text: 'Foram e contaram a Davi a respeito dos homens, e ele mandou ao encontro deles,[a] pois os homens estavam profundamente humilhados.[b] O rei disse: “Fiquem em Jericó até que as barbas de vocês cresçam de novo; depois, voltem.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “enviou mensageiros ao encontro deles”. Literalmente, “mandou/enviou ao encontro deles”; o hebraico não diz explicitamente quem foi enviado.'
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido por “profundamente envergonhados” ou “totalmente desonrados”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ וַיַּגִּידוּ לְדָוִיד עַל הָאֲנָשִׁים
  choice: Foram contar a Davi o que havia acontecido com aqueles homens
  rationale: Expressa em português natural a ida e o relato a respeito dos homens. A formulação explicita apenas o conteúdo contextualmente evidente do relato, sem identificar quem informou Davi.
- source_word: וַיִּשְׁלַח לִקְרָאתָם
  choice: ele mandou pessoas ao encontro deles
  rationale: O hebraico não declara o objeto de 'mandou'; pessoas encarregadas de ir ao encontro deles estão naturalmente implícitas. A nota preserva essa elipse.
- source_word: נִכְלָמִים מְאֹד
  choice: profundamente humilhados
  rationale: O particípio nifal de כלם indica vergonha ou humilhação sofrida, e מְאֹד intensifica o estado. No contexto de desonra pública, 'profundamente humilhados' é claro e idiomático.
- source_word: שְׁבוּ בִירֵחוֹ
  choice: Fiquem em Jericó
  rationale: ישׁב, neste contexto, significa permanecer; 'fiquem' comunica naturalmente a ordem. O topônimo é vertido pela forma portuguesa consagrada.
- source_word: עַד אֲשֶׁר יְצַמַּח זְקַנְכֶם
  choice: até que a barba de vocês cresça de novo
  rationale: צמח significa crescer ou brotar. 'De novo' decorre do contexto imediato, no qual parte da barba havia sido rapada. O singular coletivo 'a barba de vocês' é natural em português.
- source_word: וְשַׁבְתֶּם
  choice: depois, voltem
  rationale: Após a oração introduzida por 'até que', a forma verbal indica a ação subsequente; 'depois' torna a sequência clara.
- source_word: הַמֶּלֶךְ
  choice: O rei
  rationale: Mantém o título definido usado no hebraico para Davi, sem substituí-lo pelo nome próprio.
