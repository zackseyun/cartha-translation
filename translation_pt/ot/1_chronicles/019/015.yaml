base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/015.yaml
  text: When the Ammonites saw that Aram had fled[a], they also fled before Abishai his brother and entered the city[b]. Then Joab came to Jerusalem.
translation:
  language: pt
  text: Quando os amonitas viram que os arameus tinham fugido, eles também fugiram de diante de Abisai, irmão de Joabe,[a] e entraram na cidade. Então Joabe foi para Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Abisai, seu irmão”; isto é, irmão de Joabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי עַמּוֹן
  choice: os amonitas
  rationale: A expressão idiomática “filhos de Amom” designa o povo de Amom; o gentílico é natural e exato em português.
- source_word: רָאוּ כִּי נָס
  choice: viram que ... tinham fugido
  rationale: כִּי introduz o conteúdo percebido, e o mais-que-perfeito explicita naturalmente que a fuga dos arameus precedeu a reação dos amonitas.
- source_word: אֲרָם
  choice: os arameus
  rationale: O nome coletivo refere-se aqui às forças arameias. O gentílico evita a possível impressão de que o território literalmente fugiu e não usa o nome tradicional menos preciso “sírios”.
- source_word: וַיָּנוּסוּ גַם הֵם מִפְּנֵי
  choice: eles também fugiram de diante de
  rationale: Preserva a comparação enfática com a fuga dos arameus e a expressão militar de retirada diante do adversário.
- source_word: אַבְשַׁי אָחִיו
  choice: Abisai, irmão de Joabe
  rationale: O sufixo “seu” tem Joabe como referente no contexto; explicitar o nome evita ambiguidade artificial em português.
- source_word: וַיָּבֹאוּ הָעִירָה
  choice: entraram na cidade
  rationale: O ה direcional indica movimento para dentro da cidade; “entraram” é claro e natural.
- source_word: וַיָּבֹא יוֹאָב יְרוּשָׁלִָם
  choice: Então Joabe foi para Jerusalém
  rationale: A construção dá continuidade à narrativa. Em português, “foi para” expressa naturalmente o deslocamento sem acrescentar que Joabe retornou, ideia não explícita no verbo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com nomes nas formas bíblicas correntes em português. A referência coletiva a Aram foi traduzida como “os arameus” para clareza. A única nota preserva a forma pronominal do hebraico e esclarece seu referente contextual.
