  text: וַ/יַּ֣רְא יוֹאָ֗ב כִּֽי הָיְתָ֧ה פְנֵי הַ/מִּלְחָמָ֛ה אֵלָ֖י/ו פָּנִ֣ים וְ/אָח֑וֹר וַ/יִּבְחַ֗ר מִ/כָּל בָּחוּר֙ בְּ/יִשְׂרָאֵ֔ל וַֽ/יַּעֲרֹ֖ךְ לִ/קְרַ֥את אֲרָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/010.yaml
  text: When Joab saw that the battle line was set against him in front and in the rear[b][a], he chose some of the best men from all Israel and arranged them to meet Aram.
translation:
  language: pt
  text: Quando Joabe viu que a batalha estava disposta contra ele, tanto pela frente como pela retaguarda, escolheu alguns dos melhores guerreiros de todo o Israel[a] e os dispôs em formação para enfrentar Arã[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dentre todos os guerreiros escolhidos de Israel”. A expressão hebraica se refere a combatentes selecionados ou de elite.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “Arã”; isto é, as forças arameias.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: viu
  rationale: Preserva o sentido narrativo básico de ראה e permite que o contexto comunique a percepção da situação tática.
- source_word: פְנֵי הַמִּלְחָמָה אֵלָיו פָּנִים וְאָחוֹר
  choice: a batalha vinha contra ele tanto pela frente como pela retaguarda
  rationale: Expressa em português natural que Joabe enfrentava forças inimigas em duas direções, sem tornar explícita uma ideia de cerco total que o hebraico não exige.
- source_word: וַיִּבְחַר
  choice: escolheu
  rationale: Equivalente direto e corrente de בחר, adequado à simplicidade da narrativa.
- source_word: מִכָּל בָּחוּר בְּיִשְׂרָאֵל
  choice: alguns dos melhores guerreiros de todo o Israel
  rationale: No contexto militar, בָּחוּר designa homens escolhidos ou guerreiros de elite; a formulação também representa o valor partitivo de מִן.
- source_word: וַיַּעֲרֹךְ
  choice: os dispôs em formação
  rationale: 'Comunica o sentido militar de ערך: organizar ou posicionar tropas para o combate.'
- source_word: לִקְרַאת אֲרָם
  choice: para enfrentar Arã
  rationale: לקראת tem aqui sentido de encontro hostil ou confronto; 'enfrentar' torna clara a função militar da expressão.
- source_word: אֲרָם
  choice: Arã
  rationale: Mantém o nome próprio hebraico em sua forma portuguesa, em vez de substituí-lo pelo nome geográfico posterior 'Síria'.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira ampla. A construção militar foi tornada idiomática sem eliminar o contraste hebraico entre frente e retaguarda; 'dispôs em formação' preserva a ação tática de organizar as tropas.
