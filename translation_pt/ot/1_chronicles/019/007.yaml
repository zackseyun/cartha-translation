base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/007.yaml
  text: So they hired for themselves thirty-two thousand chariots[a], and the king of Maacah with his people. They came and camped before Medeba[b], and the sons of Ammon gathered from their cities and came to battle.
translation:
  language: pt
  text: Assim, contrataram para si trinta e dois mil carros de guerra[a], e o rei de Maaca com o seu povo. Eles vieram e acamparam diante de Medeba, e os filhos de Amom[b] se reuniram, vindos de suas cidades, e vieram para a batalha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Carros de guerra” também pode designar coletivamente uma força de carros, e não necessariamente apenas o número de veículos individuais.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os amonitas”. O hebraico diz literalmente “os filhos de Amom”, uma designação étnica comum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂכְּרוּ לָהֶם
  choice: contrataram para si
  rationale: O verbo שׂכר expressa contratação mediante pagamento, e לָהֶם indica benefício próprio. A formulação preserva ambos os elementos sem explicitar além do texto que se tratava de mercenários.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף
  choice: trinta e dois mil
  rationale: Mantém exatamente o valor numérico em ordem natural no português moderno.
- source_word: רֶכֶב
  choice: carros de guerra
  rationale: No contexto militar, רֶכֶב pode designar carros ou, coletivamente, uma força de carros. 'Carros de guerra' evita a possível leitura moderna de automóveis, sem eliminar o sentido coletivo.
- source_word: מֶלֶךְ מַעֲכָה
  choice: o rei de Maaca
  rationale: A relação construta indica o rei que governava Maaca; a forma do nome segue a transliteração bíblica corrente em português.
- source_word: עַמּוֹ
  choice: o seu povo
  rationale: Traduz diretamente עַם, preservando a possibilidade contextual de que se refira ao contingente militar do rei sem reduzi-lo explicitamente a 'tropas'.
- source_word: וַיָּבֹאוּ וַיַּחֲנוּ
  choice: Eles vieram e acamparam
  rationale: Reproduz de modo claro e natural a sequência narrativa dos dois verbos hebraicos.
- source_word: לִפְנֵי מֵידְבָא
  choice: diante de Medeba
  rationale: Preserva a relação espacial expressa por לִפְנֵי, que neste contexto pode significar diante de, em frente a ou nas proximidades voltadas para a cidade.
- source_word: בְנֵי עַמּוֹן
  choice: os filhos de Amom
  rationale: Mantém a expressão étnica hebraica literalmente, sem ocultar sua forma; a alternativa idiomática é indicada em nota.
- source_word: נֶאֶסְפוּ מֵעָרֵיהֶם
  choice: se reuniram, saindo das suas cidades
  rationale: Expressa a reunião militar e torna clara a relação de origem marcada por מִן, sem sugerir que as cidades, e não os homens, se reuniram.
- source_word: וַיָּבֹאוּ לַמִּלְחָמָה
  choice: vieram para a batalha
  rationale: Traduz o movimento dirigido ao confronto, preservando o artigo e a formulação concreta do hebraico.
