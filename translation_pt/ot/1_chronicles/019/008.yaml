  yaml_path: translation/ot/1_chronicles/019/008.yaml
  text: When David heard, he sent Joab and all the army of the mighty men.
translation:
  language: pt
  text: Quando Davi soube disso[a], enviou Joabe e todo o exército dos guerreiros valentes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi informado disso” ou “ficou sabendo disso”.'
    reason: lexical_alternative
  - marker: b
    text: “Guerreiros valentes” pode se referir aos combatentes de destaque de Davi ou à sua tropa de elite.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: soube disso
  rationale: No contexto narrativo, שׁמע indica que Davi recebeu a notícia do que havia acontecido. “Soube disso” é natural em português e explicita apenas o referente já presente no contexto.
- source_word: וַיִּשְׁלַח
  choice: enviou
  rationale: Equivalente direto e corrente de שלח numa narrativa militar.
- source_word: יוֹאָב
  choice: Joabe
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: כָּל
  choice: todo
  rationale: Preserva o alcance total de כָּל sobre a expressão nominal seguinte.
- source_word: צָבָא
  choice: exército
  rationale: Neste contexto militar, צבא designa uma força organizada de combate; “exército” é claro e atual.
- source_word: הַגִּבּוֹרִים
  choice: os guerreiros valentes
  rationale: גִּבּוֹרִים pode designar homens fortes ou valentes e, em contexto militar, guerreiros de destaque. A expressão preserva tanto o caráter marcial quanto a ideia de valentia.
- source_word: וְאֵת כָּל צְבָא הַגִּבּוֹרִים
  choice: e todo o exército dos guerreiros valentes
  rationale: Mantém Joabe e a força militar como objetos do verbo e conserva a relação construta do hebraico, sem reduzi-la simplesmente a “todo o seu exército”.
