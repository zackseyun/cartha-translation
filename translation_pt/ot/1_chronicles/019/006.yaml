source:
  edition: WLC
  text: וַ/יִּרְאוּ֙ בְּנֵ֣י עַמּ֔וֹן כִּ֥י הִֽתְבָּאֲשׁ֖וּ עִם דָּוִ֑יד וַ/יִּשְׁלַ֣ח חָ֠נוּן וּ/בְנֵ֨י עַמּ֜וֹן אֶ֣לֶף כִּכַּר כֶּ֗סֶף לִ/שְׂכֹּ֣ר לָ֠/הֶם מִן אֲרַ֨ם נַהֲרַ֜יִם וּ/מִן אֲרַ֤ם מַעֲכָה֙ וּ/מִ/צּוֹבָ֔ה רֶ֖כֶב וּ/פָרָשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/006.yaml
  text: When the Ammonites saw that they had become odious to David[a], Hanun and the Ammonites sent a thousand talents of silver to hire for themselves chariots and horsemen from Aram-naharaim, from Aram-maacah[b], and from Zobah.
translation:
  language: pt
  text: Quando os amonitas perceberam que se haviam tornado detestáveis para Davi[a], Hanum e os amonitas enviaram mil talentos de prata para contratar para si carros de guerra e cavaleiros de Arã-Naaraim[b], de Arã-Maaca e de Zobá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, a expressão traduzida por “se haviam tornado detestáveis” significa literalmente “se haviam feito feder” para Davi; é uma maneira de dizer que se tornaram ofensivos ou repugnantes para ele.
    reason: lexical_alternative
  - marker: b
    text: Arã-Naaraim é tradicionalmente entendido como “Arã dos Dois Rios”, isto é, a Mesopotâmia.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: perceberam
  rationale: Neste contexto, o verbo indica o reconhecimento da situação, não apenas percepção visual. “Perceberam” comunica naturalmente esse sentido em português.
- source_word: בְּנֵי עַמּוֹן
  choice: os amonitas
  rationale: É a forma natural do gentílico em português e corresponde à expressão hebraica literalmente traduzida por “filhos de Amom”.
- source_word: הִתְבָּאֲשׁוּ עִם דָּוִיד
  choice: se haviam tornado detestáveis para Davi
  rationale: A forma verbal emprega literalmente a imagem de “feder”, mas funciona como expressão idiomática para alguém se tornar ofensivo ou repugnante perante outra pessoa. A tradução conserva a força negativa sem reproduzir uma construção pouco natural.
- source_word: וַיִּשְׁלַח
  choice: enviaram
  rationale: O verbo governa aqui “mil talentos de prata”, indicando o envio do pagamento destinado à contratação das forças militares.
- source_word: אֶלֶף כִּכַּר כֶּסֶף
  choice: mil talentos de prata
  rationale: “Talento” é a designação bíblica convencional desta unidade de peso; não se faz uma conversão moderna incerta no texto principal.
- source_word: לִשְׂכֹּר לָהֶם
  choice: para contratar para si
  rationale: “Contratar” expressa o sentido de obter tropas mediante pagamento, e “para si” preserva a ideia de benefício ou interesse próprio indicada pelo hebraico.
- source_word: אֲרַם נַהֲרַיִם
  choice: Arã-Naaraim
  rationale: Mantém o caráter de nome geográfico, em forma adaptada à ortografia portuguesa, enquanto a identificação tradicional é explicada em nota.
- source_word: אֲרַם מַעֲכָה
  choice: Arã-Maaca
  rationale: Preserva o nome regional composto em forma adaptada ao português.
- source_word: מִצּוֹבָה
  choice: de Zobá
  rationale: Emprega a forma portuguesa tradicional do topônimo e preserva a preposição de origem.
- source_word: רֶכֶב וּפָרָשִׁים
  choice: carros de guerra e cavaleiros
  rationale: O singular coletivo רֶכֶב designa a força de carros; “carros de guerra” evita a possível ambiguidade moderna de “carros”. “Cavaleiros” expressa concretamente as tropas montadas.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Os nomes próprios foram adaptados à ortografia portuguesa. A ordem das regiões e a coordenação entre Hanum e os amonitas seguem o hebraico; a metáfora idiomática de mau cheiro foi preservada em nota.
