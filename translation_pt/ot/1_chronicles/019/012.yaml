base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/012.yaml
  text: And he said[a], “If Aram is too strong for me, then you shall be my salvation; but if the Ammonites are too strong for you[b], then I will save you.”
translation:
  language: pt
  text: 'E ele disse: “Se Arã for forte demais para mim, você virá em meu socorro; mas, se os amonitas forem fortes demais para você, eu o socorrerei.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ele disse
  rationale: Reproduz naturalmente a sequência narrativa do wayyiqtol hebraico.
- source_word: תֶּחֱזַק / יֶחֶזְקוּ (חזק + מן)
  choice: for forte demais para / forem fortes demais para
  rationale: No contexto militar, a construção comparativa indica ser mais forte que alguém ou prevalecer contra ele; esta formulação é natural e mantém esse sentido.
- source_word: אֲרָם
  choice: Arã
  rationale: Mantém o nome hebraico da região ou povo, em sua forma tradicional portuguesa, sem substituí-lo pelo nome geopolítico posterior 'Síria'.
- source_word: וְהָיִיתָ לִּי לִתְשׁוּעָה
  choice: você virá em meu socorro
  rationale: Expressa em português corrente o idiomatismo literal 'você será para mim para salvação', que neste contexto se refere ao auxílio e livramento em batalha.
- source_word: בְּנֵי עַמּוֹן
  choice: os amonitas
  rationale: É o gentílico português natural para o hebraico literal 'filhos de Amom'.
- source_word: וְהוֹשַׁעְתִּיךָ (ישע)
  choice: eu o socorrerei
  rationale: O hifil de ישע denota salvar ou livrar; 'socorrerei' preserva aqui o sentido concreto de auxílio militar e cria correspondência com a oração anterior.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A tradução conserva o paralelismo militar do hebraico e evita que 'salvação' seja entendida primariamente em sentido teológico fora do contexto imediato.
