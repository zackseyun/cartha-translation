  text: וַ/יַּ֣רְא אֲרָ֗ם כִּ֣י נִגְּפוּ֮ לִ/פְנֵ֣י יִשְׂרָאֵל֒ וַֽ/יִּשְׁלְחוּ֙ מַלְאָכִ֔ים וַ/יּוֹצִ֣יאוּ אֶת אֲרָ֔ם אֲשֶׁ֖ר מֵ/עֵ֣בֶר הַ/נָּהָ֑ר וְ/שׁוֹפַ֛ךְ שַׂר צְבָ֥א הֲדַדְעֶ֖זֶר לִ/פְנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/016.yaml
  text: When Aram saw that they had been defeated before Israel[a], they sent messengers and brought out the Arameans who were from beyond the River[b], with Shophach the commander of Hadadezer’s army before them.
translation:
  language: pt
  text: Quando Arã viu que tinha sido derrotado diante de Israel, enviou mensageiros e trouxe os arameus de além do Rio[a], com Sofaque, comandante do exército de Hadadezer, à frente deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, provavelmente, de além do Eufrates; o hebraico diz apenas “de além do Rio”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרָם
  choice: Arã / os arameus
  rationale: O nome próprio designa primeiro o povo ou reino e depois suas tropas. “Arã” preserva o nome hebraico, enquanto “arameus” identifica naturalmente o contingente.
- source_word: נִגְּפוּ
  choice: tinha sido derrotado
  rationale: O nifal indica sofrer derrota em combate; a formulação é clara sem sugerir necessariamente aniquilação.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: diante de Israel
  rationale: Preserva a expressão hebraica, que no contexto comunica derrota perante ou às mãos de Israel.
- source_word: מַלְאָכִים
  choice: mensageiros
  rationale: No contexto político-militar, refere-se a emissários humanos.
- source_word: וַיּוֹצִיאוּ אֶת אֲרָם
  choice: trouxe os arameus
  rationale: O hifil de יצא significa fazer sair ou trazer; aqui descreve a mobilização de forças arameias adicionais. O singular concorda naturalmente com o sujeito coletivo “Arã” expresso na oração anterior.
- source_word: מֵעֵבֶר הַנָּהָר
  choice: do outro lado do Rio
  rationale: Mantém a formulação do hebraico sem identificar explicitamente o rio como o Eufrates.
- source_word: וְשׁוֹפַךְ
  choice: tendo ... Sofaque
  rationale: A conjunção introduz Sofaque como elemento acompanhante e comandante do contingente.
- source_word: שַׂר צְבָא הֲדַדְעֶזֶר
  choice: comandante do exército de Hadadezer
  rationale: Expressa em português atual o título militar hebraico.
- source_word: לִפְנֵיהֶם
  choice: à frente
  rationale: Literalmente “diante deles”; no contexto militar indica a posição de Sofaque à frente das tropas, sem precisar se ele apenas as precedia ou as liderava.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. Conserva “Arã” e “arameus” em vez da identificação tradicional com “Síria” e “sírios”. A ambiguidade espacial e funcional de לִפְנֵיהֶם é preservada por “à frente”.
