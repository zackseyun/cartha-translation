revisions:
- from: Quando Arã viu que tinha sido derrotado diante de Israel, enviou mensageiros e trouxe os arameus que estavam do outro lado do Rio[a], tendo à frente Sofaque, comandante do exército de Hadadezer.
  to: Quando Arã viu que tinha sido derrotado diante de Israel, enviou mensageiros e trouxe os arameus de além do Rio[a], com Sofaque, comandante do exército de Hadadezer, à frente deles.
  rationale: A revisão conserva o sentido e a ambiguidade do texto hebraico, mas exprime com maior precisão a procedência geográfica dos arameus e a posição de Sofaque à frente do contingente.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T22:51:30Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente Arã/arameus, a derrota militar, os mensageiros, o contingente vindo de além do Rio e o título de Sofaque. Contudo, “que estavam do outro lado do Rio” tende a descrever a localização momentânea das tropas, enquanto מֵעֵבֶר הַנָּהָר as qualifica como vindas de além do Rio. A formulação final também pode explicitar melhor que Sofaque estava à frente delas.
  naturalness: O português é moderno e claro. “Além do Rio” é mais conciso e natural que “do outro lado do Rio” neste uso geográfico; “com Sofaque ... à frente deles” evita a leve ambiguidade de ligação em “tendo à frente Sofaque”.
  terminology: “Arã”, “arameus”, “mensageiros”, “Sofaque” e “Hadadezer” são adequados e mantêm a distinção entre o nome da entidade e seu povo/forças. “Comandante do exército” traduz bem שַׂר צְבָא.
  issues:
  - severity: low
    issue: A oração relativa “que estavam do outro lado do Rio” pode alterar a nuance de origem/procedência.
    rationale: O hebraico diz literalmente “de além do Rio”, qualificando os arameus como provenientes daquela região, sem afirmar apenas onde se encontravam naquele momento.
  - severity: low
    issue: “Tendo à frente Sofaque” deixa menos explícita a referência pronominal de לִפְנֵיהֶם.
    rationale: A construção é compreensível, mas “à frente deles” reproduz de modo mais direto o “diante deles/à frente deles” hebraico e identifica claramente os arameus como o referente.
  revised_text: Quando Arã viu que tinha sido derrotado diante de Israel, enviou mensageiros e trouxe os arameus de além do Rio[a], com Sofaque, comandante do exército de Hadadezer, à frente deles.
  revised_footnotes:
  - marker: a
    text: Isto é, provavelmente, de além do Eufrates; o hebraico diz apenas “de além do Rio”.
    reason: lexical_alternative
  revision_rationale: A revisão conserva o sentido e a ambiguidade do texto hebraico, mas exprime com maior precisão a procedência geográfica dos arameus e a posição de Sofaque à frente do contingente.
