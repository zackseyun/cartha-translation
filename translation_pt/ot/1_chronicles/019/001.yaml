base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/001.yaml
  text: After this, Nahash king of the Ammonites died, and his son reigned in his place.
translation:
  language: pt
  text: Depois disso, Naás, rei dos amonitas, morreu, e seu filho reinou em seu lugar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Depois disso
  rationale: A fórmula narrativa hebraica significa literalmente “e aconteceu depois disso”. Em português atual, “Depois disso” mantém com naturalidade a transição temporal.
- source_word: וַיָּמָת
  choice: morreu
  rationale: O verbo מות significa diretamente “morrer”; “morreu” reproduz o sentido sem eufemismo.
- source_word: נָחָשׁ
  choice: Naás
  rationale: Forma tradicional e reconhecível em português para o nome hebraico Nāḥāš.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: rei dos amonitas
  rationale: Embora a construção seja literalmente “rei dos filhos de Amom”, “rei dos amonitas” é a forma idiomática em português para o gentílico.
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: O verbo מלך denota exercer ou assumir o governo real; “reinou” conserva a concisão e a sequência narrativa do hebraico.
- source_word: בְּנוֹ
  choice: seu filho
  rationale: O sufixo pronominal remete claramente a Naás; “seu filho” é direto e natural.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: A expressão indica sucessão na posição ocupada por Naás; “em seu lugar” preserva esse sentido.
