  text: וְ/אֵת֙ יֶ֣תֶר הָ/עָ֔ם נָתַ֕ן בְּ/יַ֖ד אַבְשַׁ֣י אָחִ֑י/ו וַ/יַּ֣עַרְכ֔וּ לִ/קְרַ֖את בְּנֵ֥י עַמּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/011.yaml
  text: He put the rest of the troops under the command of Abishai his brother[a], and they drew up in battle formation to meet the Ammonites.
translation:
  language: pt
  text: Ele pôs o restante das tropas sob o comando de seu irmão Abisai[a], e eles se posicionaram em formação de batalha para enfrentar os amonitas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “deu na mão de seu irmão Abisai”, expressão que significa confiar à sua autoridade ou ao seu comando.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר הָעָם
  choice: o restante das tropas
  rationale: Embora הָעָם signifique literalmente “o povo”, no contexto militar designa os combatentes; “tropas” comunica esse sentido com naturalidade.
- source_word: נָתַן בְּיַד
  choice: pôs ... sob o comando de
  rationale: A expressão idiomática significa literalmente “deu na mão de” e, aqui, indica confiar homens à autoridade ou ao comando de alguém.
- source_word: אַבְשַׁי אָחִיו
  choice: seu irmão Abisai
  rationale: “Abisai” é a forma portuguesa corrente do nome; a relação de parentesco com Joabe é preservada.
- source_word: וַיַּעַרְכוּ
  choice: eles se posicionaram em formação de batalha
  rationale: Em contexto militar, ערך descreve a disposição organizada das tropas para o combate.
- source_word: לִקְרַאת
  choice: para enfrentar
  rationale: A preposição pode significar “ao encontro de” ou “diante de”; no contexto de batalha, “enfrentar” expressa naturalmente a relação hostil sem ampliar o sentido.
- source_word: בְּנֵי עַמּוֹן
  choice: os amonitas
  rationale: É a forma portuguesa natural do etnônimo hebraico literalmente expresso como “filhos de Amom”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com vocabulário militar natural. A ordem “seu irmão Abisai” favorece a fluidez em português sem alterar a referência a Joabe.
