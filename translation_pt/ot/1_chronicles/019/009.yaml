base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/009.yaml
  text: And the sons of Ammon came out and drew up for battle at the entrance of the city[d][c][b][a], while the kings who had come were by themselves in the field.
translation:
  language: pt
  text: Os amonitas[a] saíram e se puseram em formação de batalha[b] à entrada da cidade[c], enquanto os reis que tinham vindo ficaram separados deles no campo[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “os filhos de Amom”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “dispuseram suas tropas para a batalha”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “junto à entrada da cidade”. O hebraico usa o termo geral para “entrada” ou “abertura”, não a palavra usual para “portão”.'
    reason: lexical_alternative
  - marker: d
    text: Isto é, os reis aliados estavam posicionados à parte das forças amonitas, no campo.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: saíram
  rationale: O verbo יצא indica sair; o português dispensa escolher entre os deíticos ingleses “came out” e “went out”.
- source_word: בְּנֵי עַמּוֹן
  choice: os amonitas
  rationale: É o gentílico natural e claro em português para a expressão hebraica literalmente traduzida por “filhos de Amom”; a forma literal é preservada em nota.
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: se puseram em formação de batalha
  rationale: A expressão militar descreve a disposição organizada das tropas para o combate, não simplesmente o ato de lutar.
- source_word: פֶּתַח הָעִיר
  choice: à entrada da cidade
  rationale: פתח significa abertura ou entrada; evita substituir o termo pelo hebraico mais específico para “portão”.
- source_word: וְהַמְּלָכִים אֲשֶׁר בָּאוּ
  choice: enquanto os reis que tinham vindo
  rationale: “Enquanto” expressa naturalmente o contraste circunstancial entre a posição dos amonitas e a dos reis aliados.
- source_word: לְבַדָּם
  choice: separados deles
  rationale: No contexto militar, indica que os reis e suas tropas estavam posicionados à parte dos amonitas, não que cada rei estivesse sozinho.
- source_word: בַּשָּׂדֶה
  choice: no campo
  rationale: Tradução direta de שׂדה, sem acrescentar explicitamente “aberto”, embora o contexto indique terreno fora da cidade.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Preferiu-se o gentílico natural “amonitas”, mantendo em nota a forma hebraica literal. A construção esclarece o referente implícito de לְבַדָּם sem sugerir que os reis estivessem individualmente sozinhos.
