  text: וַ/יֹּ֨אמֶר דָּוִ֜יד אֶֽעֱשֶׂה חֶ֣סֶד עִם חָנ֣וּן בֶּן נָחָ֗שׁ כִּֽי עָשָׂ֨ה אָבִ֤י/ו עִמִּ/י֙ חֶ֔סֶד וַ/יִּשְׁלַ֥ח דָּוִ֛יד מַלְאָכִ֖ים לְ/נַחֲמ֣/וֹ עַל אָבִ֑י/ו וַ/יָּבֹאוּ֩ עַבְדֵ֨י דָוִ֜יד אֶל אֶ֧רֶץ בְּנֵי עַמּ֛וֹן אֶל חָנ֖וּן לְ/נַחֲמֽ/וֹ־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/002.yaml
  text: And David said[a], “I will show kindness to Hanun son of Nahash, because his father showed kindness to me.” So David sent messengers to comfort him concerning his father. And David’s servants came to the land of the Ammonites, to Hanun, to comfort him.
translation:
  language: pt
  text: 'Davi disse: “Vou tratar Hanum, filho de Naás, com bondade, porque seu pai me tratou com bondade.” Então Davi enviou mensageiros para consolá-lo pela morte de seu pai.[a] E os servos de Davi foram à terra dos amonitas, até Hanum, para consolá-lo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a respeito de seu pai” ou “por causa de seu pai”. Nesse contexto, o consolo se devia à morte do pai de Hanum.
    reason: A expressão hebraica deixa a morte implícita; a nota registra a forma mais literal e esclarece a explicitação adotada no texto.
lexical_decisions:
- source_word: חֶסֶד
  choice: bondade
  rationale: Neste contexto interpessoal e diplomático, indica benevolência ou lealdade demonstrada em ações. “Bondade” é clara, natural e adequada às duas ocorrências, sem impor um sentido estritamente pactual.
- source_word: עָשָׂה חֶסֶד עִם
  choice: tratar com bondade
  rationale: A expressão idiomática hebraica significa agir bondosamente para com alguém. “Tratar com bondade” soa natural em português e preserva o caráter ativo da expressão.
- source_word: מַלְאָכִים
  choice: mensageiros
  rationale: O referente são representantes humanos enviados por Davi. “Mensageiros” mantém a amplitude lexical sem afirmar além do texto que fossem emissários com estatuto diplomático formal.
- source_word: לְנַחֲמוֹ
  choice: para consolá-lo
  rationale: O verbo, neste contexto de luto, descreve o ato de oferecer consolo a quem perdeu o pai.
- source_word: עַל אָבִיו
  choice: pela morte de seu pai
  rationale: Com o verbo “consolar”, a expressão indica que a morte do pai era a causa do luto, embora a palavra “morte” esteja implícita no hebraico.
- source_word: אֶרֶץ בְּנֵי עַמּוֹן
  choice: terra dos amonitas
  rationale: Emprega o etnônimo português convencional e conserva o sentido geográfico de אֶרֶץ.
- source_word: בֶּן נָחָשׁ
  choice: filho de Naás
  rationale: Mantém a relação filial e usa formas portuguesas tradicionais e reconhecíveis para os nomes próprios.
- source_word: עַבְדֵי דָוִיד
  choice: servos de Davi
  rationale: É a tradução direta de pessoas a serviço de Davi; o contexto não exige especificar “oficiais” ou “cortesãos”.
- source_word: וַיֹּאמֶר ... וַיִּשְׁלַח ... וַיָּבֹאוּ
  choice: Davi disse ... Então Davi enviou ... E os servos de Davi foram
  rationale: Reproduz a sequência narrativa, usando conectores naturais em português; “Então” expressa adequadamente que o envio executou a intenção declarada por Davi.
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação “tratar com bondade” evita rigidez literal e mantém a repetição significativa de חֶסֶד. Os nomes seguem formas portuguesas bíblicas usuais: Davi, Hanum e Naás.'
