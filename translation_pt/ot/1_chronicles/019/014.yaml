base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/014.yaml
  text: So Joab and the people who were with him advanced before Aram for battle[a], and they fled before him.
translation:
  language: pt
  text: Então Joabe e o povo que estava com ele avançaram para a batalha contra Arã[a], e os arameus fugiram diante dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «avançaram diante de Arã para a batalha». O hebraico diz literalmente «diante de Arã», usando o nome próprio e uma expressão espacial em contexto de combate.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: avançaram
  rationale: O verbo נגשׁ significa literalmente “aproximar-se”. No contexto militar e com a expressão “para a batalha”, “avançaram” comunica naturalmente o movimento rumo ao confronto.
- source_word: וְהָעָם אֲשֶׁר עִמּוֹ
  choice: e o povo que estava com ele
  rationale: Mantém o sentido literal de הָעָם, “o povo”, sem substituir explicitamente por “tropas” ou “exército”, embora o contexto indique uma força combatente.
- source_word: לִפְנֵי אֲרָם
  choice: diante de Arã
  rationale: Preserva a expressão espacial hebraica לִפְנֵי, “diante de/na presença de”, bem como o nome próprio Arã, deixando a interpretação militar mais explícita para a nota.
- source_word: אֲרָם
  choice: Arã
  rationale: Emprega a forma portuguesa tradicional do nome próprio hebraico, evitando o anacrônico “Síria”; “os arameus” seria uma explicitação contextual.
- source_word: לַמִּלְחָמָה
  choice: para a batalha
  rationale: Expressa a finalidade do avanço e conserva o sentido militar direto de מִלְחָמָה.
- source_word: וַיָּנוּסוּ
  choice: eles fugiram
  rationale: נוס significa “fugir”; a tradução mantém o verbo forte e o sujeito plural não expresso do hebraico, sem suavizá-lo como “recuaram”.
- source_word: מִפָּנָיו
  choice: de diante dele
  rationale: Reproduz de perto a expressão hebraica “de sua face/presença”; o sufixo singular refere-se mais naturalmente a Joabe.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com estrutura próxima do hebraico. A formulação “diante de Arã” preserva deliberadamente a expressão espacial da fonte, enquanto a nota oferece as leituras contextuais mais naturais. O pronome plural “eles” mantém a forma do hebraico e remete contextualmente às forças de Arã.
