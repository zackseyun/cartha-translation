review_pass:
  verdict: revise
  source_fidelity: O texto identifica corretamente Joabe e seus acompanhantes como os que avançam, e o verbo final descreve a fuga das forças arameias diante de Joabe. Porém, em português, o sujeito de «eles fugiram» fica excessivamente ambíguo e pode ser entendido como Joabe e seu povo, invertendo o sentido narrativo. «Contra Arã» é a explicitação contextual segura de לִפְנֵי אֲרָם neste contexto militar; a nota conserva a formulação literal.
  naturalness: «Avançaram diante de Arã para a batalha» é pouco natural em português moderno e não comunica com clareza a relação bélica. «Avançaram para a batalha contra Arã» é idiomático. Explicitar «os arameus» no segundo membro elimina uma ambiguidade prejudicial sem alterar o sentido.
  terminology: «Joabe», «Arã», «arameus», «batalha» e «fugiram» são adequados. «Arã» preserva o nome próprio, enquanto «os arameus» no sujeito implícito da fuga traduz adequadamente as forças identificadas pelo contexto.
  issues:
  - severity: medium
    issue: O pronome «eles» tem antecedente ambíguo.
    rationale: Gramaticalmente, pode retomar «Joabe e o povo que estava com ele», embora o hebraico e o contexto indiquem que os fugitivos são os arameus. Nomear o sujeito evita uma possível inversão de sentido.
  - severity: low
    issue: «Diante de Arã para a batalha» é uma construção pouco idiomática em português.
    rationale: A expressão espacial hebraica funciona como idioma militar. «Contra Arã» comunica naturalmente a relação de combate, e a nota pode registrar o literal «diante de Arã».
