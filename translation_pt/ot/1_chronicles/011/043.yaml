- source_word: וְיוֹשָׁפָט
  choice: e Josafá
  rationale: A conjunção é vertida por “e”; o nome יוֹשָׁפָט recebe a forma portuguesa corrente “Josafá”, que representa adequadamente a forma hebraica presente no versículo.
- source_word: הַמִּתְנִי
  choice: o mitnita
  rationale: Gentílico ou designação de pertencimento a lugar ou clã, preservado como tal em português.
