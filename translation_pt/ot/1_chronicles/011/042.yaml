- source_word: הָרְאוּבֵנִי
  choice: o rubenita
  rationale: O gentílico com artigo identifica a afiliação tribal de Adina.
- source_word: רֹאשׁ לָרְאוּבֵנִי
  choice: chefe dos rubenitas
  rationale: Neste contexto de lista militar, רֹאשׁ designa posição de liderança, e ל marca a esfera ou o grupo liderado.
- source_word: וְעָלָיו שְׁלוֹשִׁים
  choice: e com ele estavam trinta homens
  rationale: No contexto da lista, a expressão provavelmente indica trinta homens associados a Adina. O substantivo 'homens' está implícito e foi explicitado para produzir português natural.
