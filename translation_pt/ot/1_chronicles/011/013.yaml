base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/013.yaml
  text: He was with David at Pas-dammim[a], where the Philistines had gathered for battle. Now the plot of the field was full of barley[b], and the people fled from before the Philistines.
translation:
  language: pt
  text: Ele estava com Davi em Pas-Damim[a], onde os filisteus haviam se reunido para a batalha. Havia ali uma porção do campo cheia de cevada, e o povo fugiu diante dos filisteus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pas-Damim é o nome de um lugar. Compare o relato paralelo em 1 Samuel 17:1, que chama o local de Efes-Damim.
    reason: cross_reference
lexical_decisions:
- source_word: בַּפַּס דַּמִּים
  choice: em Pas-Damim
  rationale: O hebraico trata a expressão como topônimo. A transliteração preserva o nome do lugar sem impor uma interpretação etimológica incerta.
- source_word: נֶאֱסְפוּ
  choice: haviam se reunido
  rationale: O nifal de אסף indica que os filisteus se ajuntaram; o mais-que-perfeito esclarece que essa reunião já havia ocorrido no cenário narrado.
- source_word: לַמִּלְחָמָה
  choice: para a batalha
  rationale: No contexto de um confronto militar específico, 'batalha' é mais preciso e natural que o sentido mais amplo de 'guerra'.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: uma porção do campo
  rationale: חלקה designa uma parte ou parcela delimitada de terreno; a formulação conserva essa ideia concreta em português corrente.
- source_word: מְלֵאָה שְׂעוֹרִים
  choice: cheia de cevada
  rationale: O texto especifica cevada, não cereal ou grão em sentido genérico.
- source_word: וְהָעָם
  choice: o povo
  rationale: Mantém a amplitude lexical de עם sem restringir explicitamente o referente a soldados, embora o contexto seja militar.
- source_word: נָסוּ מִפְּנֵי פְלִשְׁתִּים
  choice: fugiu diante dos filisteus
  rationale: 'Expressão portuguesa natural que preserva o sentido do idioma hebraico: retirar-se ou fugir perante o avanço do inimigo.'
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem narrativa e os detalhes agrícolas do hebraico foram preservados sem literalismo pouco natural.
