  text: וַ/יֵּ֥לֶךְ דָּוִ֖יד הָל֣וֹךְ וְ/גָד֑וֹל וַ/יהוָ֥ה צְבָא֖וֹת עִמּֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/009.yaml
  text: And David became greater and greater[a], and Yahweh of hosts was with him.
translation:
  language: pt
  text: Davi se tornava cada vez mais poderoso[a], e Yahweh dos Exércitos estava com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Davi ia, indo e tornando-se grande”; uma expressão idiomática que indica que ele se tornava progressivamente mais poderoso.'
    reason: Explica de modo mais fiel a construção hebraica incomum e sua força progressiva.
lexical_decisions:
- source_word: וַיֵּלֶךְ הָלוֹךְ וְגָדוֹל
  choice: se tornava cada vez mais poderoso
  rationale: A construção idiomática hebraica expressa crescimento progressivo. Em português, esta formulação comunica naturalmente o processo contínuo e, no contexto da ascensão régia de Davi, o aumento de poder e importância.
- source_word: דָּוִיד
  choice: Davi
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַיהוָה צְבָאוֹת
  choice: e Yahweh dos Exércitos
  rationale: Mantém a conjunção coordenativa sem introduzir causalidade e preserva tanto o nome divino quanto a imagem militar do título צְבָאוֹת.
- source_word: עִמּוֹ
  choice: estava com ele
  rationale: Expressa diretamente a presença e o acompanhamento divinos indicados pela preposição עִם com sufixo pronominal.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o Tetragrama como nome próprio; a transliteração preserva o nome pactual sem substituí-lo por um título.
- issue: Relação entre o crescimento de Davi e a presença divina
  choice: e
  alternative: pois
  rationale: O hebraico emprega a conjunção ו, que coordena as orações. Traduzir por “pois” tornaria explícita uma relação causal que, embora possível no contexto, não é marcada diretamente.
- issue: Sentido de גָדוֹל no contexto
  choice: poderoso
  alternative: grande
  rationale: “Poderoso” comunica de modo natural a crescente posição, força e importância de Davi como rei, sem limitar o termo a tamanho físico.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural. “Yahweh dos Exércitos” preserva o nome divino e o título hebraico; “cada vez mais poderoso” transmite a progressão idiomática sem tradução excessivamente literal.
