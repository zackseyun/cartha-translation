  yaml_path: translation/ot/1_chronicles/011/032.yaml
  text: Hurai from the wadis of Gaash[b][a], Abiel the Arbathite.
translation:
  language: pt
  text: Hurai, dos vales de Gaás[a]; Abiel, o arbatita[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “das ravinas de Gaás”, “dos leitos de torrente de Gaás” ou “dos riachos de Gaás”. O termo hebraico pode designar um vale, uma ravina, um leito de torrente ou um curso de água sazonal.
    reason: lexical_alternative
  - marker: b
    text: “Arbatita” é um gentílico, isto é, designa um homem de Arbate, localidade possivelmente relacionada à Arabá.
    reason: cultural_note
lexical_decisions:
- source_word: חוּרַי
  choice: Hurai
  rationale: Nome próprio transliterado de forma simples e reconhecível em português.
- source_word: מִנַּחֲלֵי
  choice: dos vales de
  rationale: O substantivo נַחַל pode indicar vale, ravina, leito de torrente ou curso de água sazonal. “Vales” é natural e amplamente compreensível em português, enquanto a nota preserva a amplitude geográfica do termo.
- source_word: גָעַשׁ
  choice: Gaás
  rationale: Topônimo transliterado, com acento para indicar claramente a pronúncia da sílaba final em português.
- source_word: אֲבִיאֵל
  choice: Abiel
  rationale: Nome próprio transliterado segundo uma forma natural em português.
- source_word: הָעַרְבָתִי
  choice: o arbatita
  rationale: Gentílico que indica a procedência de Abiel. A tradução mantém a designação geográfica sem identificar com certeza a localidade subjacente.
