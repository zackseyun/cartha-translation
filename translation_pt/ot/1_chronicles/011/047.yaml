  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico הַמְּצֹבָיָה é uma designação gentílica, provavelmente indicando que Jaasiel era de Mezobá ou de algum lugar ou clã com nome semelhante. O topônimo exato é incerto; por isso, também são possíveis transliterações como “misobaíta”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלִיאֵל
  choice: Eliel
  rationale: Nome próprio transliterado segundo a forma tradicional e natural em português.
- source_word: וְעוֹבֵד
  choice: Obede
  rationale: Nome próprio com conjunção prefixada; em português, a conjunção é expressa naturalmente apenas antes do último elemento da lista.
- source_word: וְיַעֲשִׂיאֵל
  choice: e Jaasiel
  rationale: Nome próprio transliterado; a conjunção hebraica é representada segundo o uso natural do português na enumeração.
- source_word: הַמְּצֹבָיָה
  choice: o mezobaíta
  rationale: Designação gentílica ou de pertencimento, com artigo, que identifica Jaasiel por lugar ou clã. A transliteração evita determinar de modo especulativo o topônimo subjacente.
