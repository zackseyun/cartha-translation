  text: the sons of Hashem the Gizonite[a], Jonathan son of Shagee the Hararite;
translation:
  language: pt
  text: os filhos de Hasém, o gizonita[a], e Jônatas, filho de Sagé, o hararita;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico diz “os filhos de Hasém, o gizonita”. A lista paralela em 2Samuel 23:32 apresenta uma sequência diferente de nomes, muitas vezes refletida em traduções ou reconstruções.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי
  choice: os filhos de
  rationale: Plural construto de בֵּן. Preserva a leitura do texto massorético, sem harmonizá-la com a lista paralela de 2Samuel 23.
- source_word: הָשֵׁם
  choice: Hasém
  rationale: Nome próprio transliterado de modo natural em português, com acento gráfico para indicar a tonicidade final e distingui-lo da expressão hebraica HaShem.
- source_word: הַגִּזוֹנִי
  choice: o gizonita
  rationale: Gentílico ou designação de procedência com artigo; a terminação portuguesa “-ita” expressa naturalmente esse valor.
- source_word: יוֹנָתָן
  choice: Jônatas
  rationale: Forma tradicional e amplamente reconhecível do nome em português.
- source_word: בֶּן
  choice: filho de
  rationale: Equivalente natural do singular construto que introduz a filiação.
- source_word: שָׁגֵה
  choice: Sagé
  rationale: Transliteração portuguesa do nome próprio, com acento gráfico para representar a tonicidade final.
- source_word: הַהֲרָרִי
  choice: o hararita
  rationale: Gentílico ou designação de origem com artigo, vertido pela forma portuguesa usual em “-ita”.
