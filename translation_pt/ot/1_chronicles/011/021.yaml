base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/021.yaml
  text: He was more honored than the two among the three[a], and he became their commander; but he did not attain to the three.
translation:
  language: pt
  text: Dos três, ele era mais honrado do que os outros dois[a] e tornou-se comandante deles; contudo, não chegou ao nível dos Três.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele foi mais honrado do que os três pelos dois”. O hebraico é condensado e difícil; o sentido geral é que ele recebeu grande honra dentro de um grupo hierarquizado, mas não se igualou aos “Três”.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִן הַשְּׁלוֹשָׁה בַשְּׁנַיִם
  choice: Dos três, ele era mais honrado do que os outros dois
  rationale: A expressão hebraica é condensada e difícil. No contexto da classificação dos guerreiros de Davi, a leitura mais natural entende Abisai como o mais destacado dentro de um grupo de três, acima dos outros dois, sem o igualar ao primeiro grupo conhecido como “os Três”.
- source_word: נִכְבָּד
  choice: mais honrado
  rationale: O nifal de כבד indica que ele era honrado ou altamente estimado; a construção comparativa pede “mais honrado” em português.
- source_word: וַיְהִי לָהֶם לְשָׂר
  choice: e tornou-se comandante deles
  rationale: שַׂר designa chefe, líder ou comandante. “Comandante” é natural no contexto militar e mantém clara a relação com os demais integrantes do grupo.
- source_word: וְעַד הַשְּׁלוֹשָׁה לֹא בָא
  choice: contudo, não chegou ao nível dos Três
  rationale: בוא com עַד expressa aqui alcançar determinada posição ou categoria, não movimento físico. “Chegar ao nível” comunica em português corrente que ele não igualou a posição do grupo principal.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com construção comparativa explicitada para clareza. “Três” recebe inicial maiúscula na última ocorrência para indicar a designação do grupo de elite, enquanto a primeira ocorrência descreve o grupo ao qual Abisai pertencia.
