  text: וַ/יִּ֤בֶן הָ/עִיר֙ מִ/סָּבִ֔יב מִן הַ/מִּלּ֖וֹא וְ/עַד הַ/סָּבִ֑יב וְ/יוֹאָ֕ב יְחַיֶּ֖ה אֶת שְׁאָ֥ר הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/008.yaml
  text: He built the city all around[a], from the Millo even to the surrounding area[b], and Joab restored the rest of the city.
translation:
  language: pt
  text: Ele construiu a cidade por toda a volta, desde o Milo[a] até os arredores, e Joabe restaurou o restante da cidade.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Milo” é um elemento topográfico de Jerusalém cuja natureza exata é incerta; talvez fosse uma estrutura em terraços ou um aterro.
    reason: cultural_note
  - marker: b
    text: O verbo hebraico traduzido como “restaurou” significa literalmente “fez viver” e, neste contexto, provavelmente se refere à recuperação ou reparação da cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Ele construiu
  rationale: O qal narrativo de בנה indica a ação passada de construir. O sujeito, retomado do versículo anterior, é Davi; “reconstruiu” acrescentaria uma ideia não explicitada pelo verbo.
- source_word: הָעִיר מִסָּבִיב
  choice: a cidade ao redor
  rationale: Mantém “cidade” para עִיר e expressa de modo natural o alcance circundante de מִסָּבִיב, sem ampliar para “toda ao redor” de maneira desnecessária.
- source_word: מִן הַמִּלּוֹא
  choice: desde o Milo
  rationale: מִלּוֹא é conservado como nome topográfico, pois sua referência exata é incerta. “Desde” funciona naturalmente com a construção correlativa מן...ועד.
- source_word: וְעַד הַסָּבִיב
  choice: até os arredores
  rationale: O hebraico é compacto e indica o limite ou perímetro da obra. “Os arredores” preserva essa noção sem impor uma identificação arquitetônica precisa.
- source_word: וְיוֹאָב יְחַיֶּה
  choice: e Joabe restaurou
  rationale: O piel de חיה significa literalmente “fazer viver”; aplicado à cidade, indica torná-la novamente funcional ou habitável. “Restaurou” comunica o provável sentido idiomático.
- source_word: אֶת שְׁאָר הָעִיר
  choice: o restante da cidade
  rationale: שְׁאָר designa aquilo que sobrou ou permaneceu; “o restante” é claro e digno em português corrente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem da frase acompanha de perto o hebraico, mas a correlação “desde... até...” e o verbo “restaurou” tornam seu sentido idiomático natural. Todos os marcadores de nota aparecem no texto.
