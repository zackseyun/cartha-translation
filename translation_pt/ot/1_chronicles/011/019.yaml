base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/019.yaml
  text: And he said[a], “Far be it from me, by my God, to do this! Shall I drink the blood of these men at the cost of their lives? For they brought it at the cost of their lives.” So he was not willing to drink it[b]. These things the three mighty men did.
translation:
  language: pt
  text: 'E ele disse: “Longe de mim, diante do meu Deus, fazer uma coisa dessas! Beberia eu o sangue[a] destes homens, arriscando eles a própria vida[b]? Pois foi arriscando a própria vida[b] que trouxeram a água.” Por isso, não quis bebê-la. Foi isso que fizeram os três guerreiros valentes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Davi fala da água como se fosse o sangue dos homens, pois eles a conseguiram expondo a vida a perigo mortal.
    reason: cultural_note
  - marker: b
    text: 'Hebraico: “com a vida deles”. A expressão aparece duas vezes para dar ênfase; indica que eles trouxeram a água expondo a vida a perigo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי מֵאֱלֹהַי מֵעֲשׂוֹת זֹאת
  choice: Longe de mim, diante do meu Deus, fazer uma coisa dessas
  rationale: A expressão חָלִילָה comunica repúdio enfático. “Longe de mim” mantém a forma idiomática, enquanto “diante do meu Deus” conserva a referência divina sem transformar a frase numa fórmula denominacional. “Uma coisa dessas” é uma expressão portuguesa natural para זֹאת neste contexto.
- source_word: הֲדַם הָאֲנָשִׁים הָאֵלֶּה אֶשְׁתֶּה
  choice: Beberia eu o sangue destes homens
  rationale: A construção interrogativa é retórica. “Sangue” permanece literal, preservando a imagem forte com que Davi avalia a água obtida sob perigo mortal.
- source_word: בְנַפְשׁוֹתָם
  choice: arriscaram a própria vida / arriscando a própria vida
  rationale: נֶפֶשׁ designa aqui a vida física. A formulação comunica que os homens se expuseram a perigo mortal, sem sugerir que de fato morreram. A repetição no texto principal reflete a repetição enfática do hebraico.
- source_word: וְלֹא אָבָה לִשְׁתּוֹתָם
  choice: Por isso, não quis beber a água
  rationale: אָבָה expressa vontade ou consentimento. “Não quis” é corrente e fiel. O referente pronominal é explicitado como “a água” para evitar em português a leitura equivocada de que Davi não quis beber o sangue dos homens.
- source_word: אֵלֶּה עָשׂוּ שְׁלֹשֶׁת הַגִּבּוֹרִים
  choice: Foi isso que fizeram os três guerreiros valentes
  rationale: גִּבּוֹרִים identifica guerreiros de reconhecida valentia. A formulação portuguesa é natural e preserva o caráter resumitivo da frase.
theological_decisions:
- issue: Sentido de “sangue” na pergunta de Davi
  choice: Manter “sangue” literalmente e explicar a imagem em nota
  alternative: Substituir no texto principal por “água obtida com risco de vida”
  rationale: 'O hebraico diz explicitamente “sangue”. A imagem exprime a avaliação ética de Davi: beber a água equivaleria a apropriar-se da vida que os homens puseram em perigo.'
- issue: Sentido contextual de נֶפֶשׁ
  choice: Traduzir como “vida”
  alternative: Traduzir como “alma”
  rationale: Neste contexto, o termo se refere à vida física exposta ao perigo, não faz uma afirmação sobre uma parte imaterial do ser humano.
- issue: Valor da preposição em מֵאֱלֹהַי
  choice: diante do meu Deus
  alternative: por meu Deus; que meu Deus não permita
  rationale: A forma hebraica admite discussão quanto à nuance exata da referência a Deus. “Diante do meu Deus” conserva a relação religiosa da rejeição sem resolver de modo excessivo se a frase tem força estritamente juramentária ou deprecativa.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Preferiu-se “guerreiros valentes” a “valentes” ou “homens poderosos” para tornar claro o sentido militar de גִּבּוֹרִים. A repetição referente ao risco de vida foi mantida por corresponder à ênfase do hebraico.
