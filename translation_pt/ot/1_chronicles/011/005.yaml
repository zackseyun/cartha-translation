base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/005.yaml
  text: The inhabitants of Jebus said to David[a], “You will not come in here.” But David captured the stronghold of Zion, that is, the City of David.
translation:
  language: pt
  text: 'Os habitantes de Jebus disseram a Davi[a]: “Você não entrará aqui.” Mas Davi conquistou a fortaleza de Sião, que é a Cidade de Davi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Você não virá aqui”. O hebraico diz literalmente “você não virá aqui”, expressão que, neste contexto, funciona como uma recusa de entrada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבֵי יְבוּס
  choice: os habitantes de Jebus
  rationale: A construção designa coletivamente os que moravam em Jebus; “habitantes” é natural, preciso e amplamente compreensível em português.
- source_word: לֹא תָבוֹא הֵנָּה
  choice: Você não entrará aqui
  rationale: Embora o hebraico diga literalmente “você não virá aqui”, no contexto a frase funciona como recusa de entrada. “Entrará” comunica naturalmente essa força sem alterar o sentido.
- source_word: וַיִּלְכֹּד
  choice: conquistou
  rationale: Em contexto militar, o verbo indica tomar ou capturar um lugar. “Conquistou” é idiomático em português para a tomada de uma fortificação.
- source_word: מְצֻדַת צִיּוֹן
  choice: a fortaleza de Sião
  rationale: מְצוּדָה denota uma fortificação ou posição defensiva; “fortaleza” é corrente e preserva claramente o sentido militar.
- source_word: הִיא עִיר דָּוִיד
  choice: que é a Cidade de Davi
  rationale: A oração identifica a fortaleza de Sião com o lugar conhecido como Cidade de Davi. “Que é” mantém essa identificação de modo natural, sem acrescentar uma interpretação temporal.
- source_word: עִיר דָּוִיד
  choice: Cidade de Davi
  rationale: Trata-se de uma designação geográfica estabelecida, por isso se empregam iniciais maiúsculas.
