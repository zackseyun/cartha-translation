base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/024.yaml
  text: These things Benaiah son of Jehoiada did[a], and he had a name among the three mighty men.
translation:
  language: pt
  text: Esses feitos realizou Benaia, filho de Joiada, e ele tinha renome[a] entre os três guerreiros valentes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “tinha um nome”.'
    reason: Registra o idioma hebraico subjacente, no qual “nome” pode significar reputação ou renome.
lexical_decisions:
- source_word: אֵלֶּה עָשָׂה
  choice: Esses feitos realizou
  rationale: O demonstrativo plural retoma as façanhas narradas anteriormente. A explicitação de “feitos” produz uma retomada natural em português, e “realizou” resume adequadamente os atos de Benaia.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: Benaia, filho de Joiada
  rationale: Emprega as formas tradicionais e amplamente reconhecíveis dos nomes em português e traduz diretamente a relação de filiação.
- source_word: וְלוֹ שֵׁם
  choice: e ele tinha renome
  rationale: A construção com ל expressa posse, enquanto שֵׁם, literalmente “nome”, designa aqui reputação ou notoriedade. “Tinha renome” comunica o sentido de modo natural sem sugerir que ele o adquiriu naquele momento.
- source_word: בִּשְׁלוֹשָׁה הַגִּבֹּרִים
  choice: entre os três guerreiros valentes
  rationale: A preposição ב indica associação ou posição em relação ao grupo. “Guerreiros valentes” torna explícito o caráter militar de גִּבֹּרִים e preserva sua força descritiva.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com ordem verbal levemente elevada para dar ênfase resumitiva aos feitos. A expressão “guerreiros valentes” é clara para leitores comuns e mantém o contexto militar.
