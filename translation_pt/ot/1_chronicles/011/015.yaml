base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/015.yaml
  text: Then three of the thirty chiefs went down to the rock[a], to David, at the cave of Adullam, while the camp of the Philistines was encamped in the Valley of Rephaim.
translation:
  language: pt
  text: Então, três dos trinta chefes desceram até a rocha[a], para junto de Davi, que estava na caverna de Adulão, enquanto o acampamento dos filisteus estava instalado no vale de Refaim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “três dos trinta chefes desceram sobre a rocha, até Davi, até a caverna de Adulão”. A sintaxe hebraica é condensada; no texto principal, “que estava na caverna de Adulão” esclarece a localização de Davi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: desceram
  rationale: Preserva o sentido direcional do verbo ירד e funciona naturalmente na sequência narrativa.
- source_word: שְׁלוֹשָׁה מִן־הַשְּׁלוֹשִׁים רֹאשׁ
  choice: três dos chefes dos Trinta
  rationale: Entende רֹאשׁ como indicação de posição ou liderança e trata “os Trinta” como a designação conhecida do grupo de guerreiros de Davi.
- source_word: עַל־הַצּוּר
  choice: até a rocha
  rationale: Mantém a referência topográfica concreta e expressa movimento em direção ao local, sem identificar a rocha de modo mais específico do que o hebraico permite.
- source_word: אֶל־דָּוִיד
  choice: ao encontro de Davi
  rationale: Expressa de modo natural em português a direção pessoal marcada por אֶל, sem sugerir finalidade ou benefício.
- source_word: אֶל־מְעָרַת עֲדֻלָּם
  choice: na caverna de Adulão
  rationale: Interpreta a segunda expressão direcional como esclarecimento da localização de Davi, evitando uma repetição pouco natural de “até”.
- source_word: וּמַחֲנֵה פְלִשְׁתִּים חֹנָה
  choice: enquanto o acampamento dos filisteus estava instalado
  rationale: Torna explícito o valor circunstancial do particípio חֹנָה e conserva a imagem de um acampamento estabelecido no local.
- source_word: בְּעֵמֶק רְפָאִים
  choice: no vale de Refaim
  rationale: Emprega a forma portuguesa tradicional e transparente do topônimo רְפָאִים.
