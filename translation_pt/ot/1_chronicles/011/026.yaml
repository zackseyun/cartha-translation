base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/026.yaml
  text: 'And the mighty warriors were: Asahel the brother of Joab[a], Elhanan son of Dodo, from Bethlehem.'
translation:
  language: pt
  text: 'E os guerreiros valentes eram: Asael, irmão de Joabe; Elanã, filho de Dodô, de Belém.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o belemita”. O hebraico diz literalmente “de Belém”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגִבּוֹרֵי הַחֲיָלִים
  choice: E os guerreiros valentes
  rationale: A expressão designa combatentes de destaque, valentes e capazes. “Guerreiros valentes” preserva o sentido militar em linguagem atual, enquanto “E” mantém a continuidade da lista.
- source_word: עֲשָׂהאֵל
  choice: Asael
  rationale: Transliteração portuguesa convencional do nome próprio.
- source_word: אֲחִי יוֹאָב
  choice: irmão de Joabe
  rationale: Reproduz de modo natural a relação identificadora expressa pela construção hebraica.
- source_word: אֶלְחָנָן
  choice: Elanã
  rationale: Forma portuguesa consagrada do nome próprio hebraico.
- source_word: בֶּן דּוֹדוֹ
  choice: filho de Dodô
  rationale: A fórmula genealógica é vertida diretamente; aqui, Dodô é nome próprio.
- source_word: מִבֵּית לָחֶם
  choice: de Belém
  rationale: A preposição com o topônimo indica procedência. “De Belém” traduz diretamente o hebraico e é mais transparente que o gentílico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno. O verbo “eram”, implícito na frase nominal hebraica, foi acrescentado para dar fluidez à introdução da lista. O ponto e vírgula distingue com clareza os dois guerreiros nomeados. O marcador da nota foi colocado após “Belém”, expressão à qual a alternativa lexical se refere.
