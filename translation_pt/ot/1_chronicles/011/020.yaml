base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/020.yaml
  text: And Abishai[a], the brother of Joab, was chief of the Three. He brandished his spear against three hundred slain[c][b], and had a name among the Three.
translation:
  language: pt
  text: Abisai, irmão de Joabe, era o chefe dos Três.[a] Ele brandiu sua lança[b] e matou trezentos homens;[c] conquistou renome entre os Três.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os Três”. No relato paralelo (2 Samuel 23:18), a relação entre “três” e “trinta” apresenta dificuldades textuais e contextuais.'
    reason: textual_variant
  - marker: b
    text: Ou “ergueu” ou “empunhou”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “contra trezentos mortos”.
    reason: lexical_alternative
  - marker: d
    text: Literalmente, “teve um nome”, isto é, tornou-se renomado.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: chefe
  rationale: Neste contexto militar, indica liderança ou posição de destaque, não a cabeça em sentido literal.
- source_word: הַשְּׁלוֹשָׁה / בַּשְּׁלוֹשָׁה
  choice: os Três / entre os Três
  rationale: Preserva a leitura do texto hebraico massorético sem harmonizá-la com referências aos Trinta no contexto mais amplo ou em tradições textuais paralelas.
- source_word: עוֹרֵר אֶת־חֲנִיתוֹ
  choice: brandiu sua lança
  rationale: O verbo significa literalmente despertar ou incitar; aplicado à lança, descreve de modo vívido o ato de erguê-la ou manejá-la em combate.
- source_word: עַל שְׁלֹשׁ מֵאוֹת חָלָל
  choice: contra trezentos homens, matando-os
  rationale: חָלָל designa alguém morto ou ferido mortalmente. A formulação portuguesa explicita o resultado da façanha sem perder o valor bélico da expressão.
- source_word: שֵׁם
  choice: conquistou renome
  rationale: A expressão hebraica é literalmente ter um nome e, neste contexto, significa alcançar fama ou reputação.
- source_word: אַבְשַׁי
  choice: Abisai
  rationale: Segue a forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֲחִי יוֹאָב
  choice: irmão de Joabe
  rationale: Reproduz naturalmente a relação familiar expressa pela construção hebraica.
