  rationale: A revisão conserva todos os elementos essenciais do texto massorético e a designação «os Três», mas torna explícito, em português natural, o resultado da façanha que a expressão hebraica com «trezentos mortos» comunica. A nota lexical registra a forma literal sem sugerir uma alternativa semanticamente menos precisa.
