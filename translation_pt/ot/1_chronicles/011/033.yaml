lexical_decisions:
- source_word: עַזְמָוֶת
  choice: Azmavete
  rationale: Nome próprio transliterado em forma natural para leitores de português, preservando de modo aproximado os elementos consonantais do hebraico.
- source_word: הַבַּחֲרוּמִי
  choice: o baarumita
  rationale: Gentílico articulado. A forma segue de perto a vocalização massorética e evita substituir no texto principal a possível identificação com Baurim.
- source_word: אֶלְיַחְבָּא
  choice: Eliaba
  rationale: Nome próprio transliterado de modo claro e corrente em português, sem traduzir seus possíveis elementos etimológicos.
- source_word: הַשַּׁעַלְבֹנִי
  choice: o saalbonita
  rationale: Gentílico articulado que indica procedência ou associação com Saalbon; a transliteração concisa preserva o estilo da lista.
