base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/001.yaml
  text: Then all Israel gathered to David at Hebron, saying, “Look, we are your bone and your flesh.”
translation:
  language: pt
  text: 'Então todo o Israel se reuniu com Davi em Hebrom, dizendo: “Eis que somos osso teu e carne tua.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: se reuniu
  rationale: O verbo expressa ajuntamento; em português, o sujeito coletivo singular “todo o Israel” pede naturalmente o verbo no singular.
- source_word: אֶל־דָּוִיד
  choice: com Davi
  rationale: Neste contexto, a preposição indica que o povo se reuniu junto a Davi; “com” comunica essa aproximação de modo natural.
- source_word: הִנֵּה
  choice: Nós somos
  rationale: A partícula chama atenção para a declaração seguinte. Em português, sua força pode ser transmitida naturalmente pela afirmação direta, sem o pouco usual “eis”.
- source_word: עַצְמְךָ וּבְשָׂרְךָ
  choice: seus ossos e sua carne
  rationale: Preserva a metáfora hebraica de parentesco, solidariedade e identidade compartilhada, evitando reduzi-la a uma paráfrase interpretativa.
theological_decisions:
- issue: Abrangência de “todo o Israel”
  choice: todo o Israel
  alternative: todos os israelitas
  rationale: Mantém a formulação coletiva do texto e sua dimensão nacional, sem decidir se cada indivíduo estava pessoalmente presente.
- issue: Metáfora de parentesco e unidade
  choice: seus ossos e sua carne
  alternative: somos do mesmo sangue que você
  rationale: A tradução literal conserva a imagem bíblica e sua possível amplitude política e familiar, sem restringi-la a uma única interpretação.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Conserva a metáfora hebraica e emprega concordância natural com o sujeito coletivo “todo o Israel”.
