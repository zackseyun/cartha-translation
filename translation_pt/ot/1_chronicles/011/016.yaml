base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/016.yaml
  text: David was in the stronghold[b][a], and the garrison of the Philistines was then in Bethlehem.
translation:
  language: pt
  text: Davi estava então na fortaleza[a], e a guarnição dos filisteus estava então em Belém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lugar fortificado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְּצוּדָה
  choice: fortaleza
  rationale: O termo designa um lugar fortificado ou refúgio defensável. “Fortaleza” é natural em português e conserva o sentido concreto e militar do contexto.
- source_word: נְצִיב
  choice: guarnição
  rationale: Neste contexto, com os filisteus instalados em Belém, o termo indica um posto ou contingente militar, não um governante civil.
- source_word: פְּלִשְׁתִּים
  choice: filisteus
  rationale: Forma portuguesa convencional para esse povo.
- source_word: בְּבֵית לָחֶם
  choice: em Belém
  rationale: A preposição ב indica localização; “em Belém” é a expressão natural para uma cidade.
- source_word: אָז ... אָז
  choice: então ... então
  rationale: A repetição de אָז nas duas orações foi preservada para refletir a estrutura e a ênfase temporal do hebraico.
- source_word: וְדָוִיד
  choice: Davi
  rationale: O waw inicial liga a frase ao contexto narrativo, mas não exige uma conjunção explícita em português; começar diretamente com “Davi” produz leitura natural sem acrescentar um marcador temporal inexistente.
