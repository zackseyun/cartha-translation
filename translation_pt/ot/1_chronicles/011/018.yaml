  text: וַ/יִּבְקְע֨וּ הַ/שְּׁלֹשָׁ֜ה בְּ/מַחֲנֵ֣ה פְלִשְׁתִּ֗ים וַ/יִּֽשְׁאֲבוּ מַ֨יִם֙ מִ/בּ֤וֹר בֵּֽית לֶ֨חֶם֙ אֲשֶׁ֣ר בַּ/שַּׁ֔עַר וַ/יִּשְׂא֖וּ וַ/יָּבִ֣אוּ אֶל דָּוִ֑יד וְ/לֹֽא אָבָ֤ה דָוִיד֙ לִ/שְׁתּוֹתָ֔/ם וַ/יְנַסֵּ֥ךְ אֹתָ֖/ם לַ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/018.yaml
  text: So the three broke through into the camp of the Philistines and drew water from the well of Bethlehem that was by the gate[a], and carried it and brought it to David. But David was not willing to drink it; instead, he poured it out to Yahweh.
translation:
  language: pt
  text: Assim, os três irromperam no acampamento dos filisteus, tiraram água do poço de Belém que ficava junto ao portão, carregaram-na e a levaram a Davi. Mas Davi não quis bebê-la; em vez disso, derramou-a em libação a Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “derramou-a a Yahweh”. O verbo hebraico pode designar o derramamento de uma libação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְקְעוּ
  choice: romperam as linhas
  rationale: No contexto militar, o verbo descreve a passagem forçada pela posição inimiga. A expressão portuguesa explicita naturalmente esse sentido sem sugerir uma divisão literal.
- source_word: הַשְּׁלֹשָׁה
  choice: os três
  rationale: O hebraico diz apenas “os três”; a identificação como guerreiros valentes vem do contexto e não precisa ser acrescentada neste versículo.
- source_word: בְּמַחֲנֵה פְלִשְׁתִּים
  choice: do acampamento dos filisteus
  rationale: Com “romperam as linhas”, a construção indica a posição inimiga pela qual eles abriram passagem.
- source_word: וַיִּשְׁאֲבוּ מַיִם
  choice: tiraram água
  rationale: Expressão corrente e clara em português para retirar água de um poço.
- source_word: מִבּוֹר בֵּית לֶחֶם אֲשֶׁר בַּשַּׁעַר
  choice: do poço de Belém que ficava junto ao portão
  rationale: בּוֹר pode designar poço ou cisterna; o ato de retirar água favorece “poço”. “Junto ao portão” preserva a localização sem especificação indevida.
- source_word: וַיִּשְׂאוּ
  choice: carregaram-na
  rationale: O sentido contextual é transportar a água; o pronome retoma “água” de modo natural em português.
- source_word: וַיָּבִיאוּ אֶל־דָּוִיד
  choice: a levaram a Davi
  rationale: Mantém a sequência narrativa simples. Não se acrescenta “de volta”, pois isso é apenas implícito.
- source_word: וְלֹא אָבָה דָוִיד לִשְׁתּוֹתָם
  choice: Davi não quis bebê-la
  rationale: אָבָה exprime vontade ou consentimento. “Não quis” é natural e preserva essa nuance sem intensificá-la para “recusou-se”.
- source_word: וַיְנַסֵּךְ אֹתָם לַיהוָה
  choice: derramou-a diante de Yahweh
  rationale: נסך descreve o derramamento e pode ter força cultual de libação. “Diante de” comunica que o ato foi dirigido a Yahweh sem tornar explícita no texto principal uma classificação ritual que permanece implícita no verbo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Significado cultual do derramamento da água por Davi
  choice: Manter no texto principal o ato concreto — “derramou-a diante de Yahweh” — e registrar em nota seu possível sentido de libação.
  alternative: “derramou-a como oferta de bebida a Yahweh” ou “ofereceu-a como libação a Yahweh”
  rationale: O verbo hebraico pode designar um derramamento ritual, mas a narrativa também ressalta o gesto visível. A formulação adotada preserva ambos os aspectos sem resolver além do necessário a extensão exata de sua força cultual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva o ritmo narrativo hebraico sem rigidez excessiva. O nome Yahweh é mantido como nome próprio, e a nota preserva a nuance sacrificial sem sobrecarregar o texto principal.
