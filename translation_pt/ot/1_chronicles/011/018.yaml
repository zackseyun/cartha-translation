revisions:
- from: Assim, os três romperam as linhas do acampamento dos filisteus, tiraram água do poço de Belém que ficava junto ao portão, carregaram-na e a levaram a Davi. Mas Davi não quis bebê-la; em vez disso, derramou-a diante de Yahweh.[a]
  to: Assim, os três irromperam no acampamento dos filisteus, tiraram água do poço de Belém que ficava junto ao portão, carregaram-na e a levaram a Davi. Mas Davi não quis bebê-la; em vez disso, derramou-a em libação a Yahweh.[a]
  rationale: A revisão elimina o acréscimo interpretativo «linhas» e ajusta a última oração para refletir tanto o destinatário marcado por לַיהוה quanto a acepção cultual de נסך. A nota preserva a possibilidade de formular o ato de modo mais concreto, sem reduzir sua força de libação.
