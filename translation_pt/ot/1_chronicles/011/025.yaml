base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/025.yaml
  text: Among the Thirty[a], he was indeed honored, but he did not attain to the Three[b]; and David appointed him over his bodyguard.
translation:
  language: pt
  text: Era mais honrado do que os Trinta[a], mas não alcançou os Três[b]. Davi o nomeou comandante de sua guarda pessoal[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Entre os Trinta, ele era honrado”. A expressão hebraica pode indicar posição entre os Trinta, mas neste contexto favorece o sentido comparativo: “mais honrado do que os Trinta”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “não chegou aos Três”; isto é, não alcançou a posição deles.'
    reason: idiom_explanation
  - marker: c
    text: 'Ou: “de sua guarda” ou “dos que estavam sob suas ordens”. O termo hebraico pode designar mais amplamente uma unidade de guarda ou um grupo sujeito à autoridade de Davi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשְּׁלוֹשִׁים
  choice: Entre os Trinta
  rationale: Toma מִן em sentido partitivo no contexto da lista de guerreiros e mantém “os Trinta” como designação do grupo. A construção também admite leitura comparativa, registrada em nota.
- source_word: הִנּוֹ נִכְבָּד
  choice: ele era muito estimado
  rationale: הִנּוֹ reforça a afirmação, e o niphal נִכְבָּד indica elevada consideração ou honra. “Muito estimado” transmite ambos de modo natural em português.
- source_word: וְאֶל הַשְּׁלוֹשָׁה לֹא בָא
  choice: mas não chegou a igualar os Três
  rationale: O verbo בוא com אֶל é usado aqui idiomaticamente para alcançar posição ou nível, não para mero deslocamento físico. “Chegou a igualar” torna clara a comparação hierárquica sem acrescentar o título “principais”.
- source_word: וַיְשִׂימֵהוּ דָוִיד
  choice: Davi o nomeou comandante
  rationale: שׂים significa literalmente pôr ou colocar, mas neste contexto militar descreve a designação para uma função de comando.
- source_word: עַל מִשְׁמַעְתּוֹ
  choice: de sua guarda pessoal
  rationale: מִשְׁמַעַת pode designar um corpo sujeito a ordens, uma guarda ou uma unidade sob autoridade. “Guarda pessoal” é plausível no contexto, enquanto a nota preserva a extensão semântica mais ampla.
theological_decisions:
- issue: Relação de Benaia com os Trinta e os Três
  choice: Apresentá-lo como estimado entre os Trinta, sem igualar o nível dos Três
  alternative: Apresentá-lo como mais honrado do que os Trinta, mas abaixo dos Três
  rationale: A sintaxe com מִן permite uma leitura partitiva ou comparativa. O texto principal segue a leitura contextual adotada, e a nota conserva a alternativa genuína sem transformar a classificação em uma afirmação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. As designações militares “os Trinta” e “os Três” foram mantidas com maiúscula por funcionarem como nomes reconhecíveis de grupos específicos.
