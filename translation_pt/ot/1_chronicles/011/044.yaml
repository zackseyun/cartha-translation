base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/044.yaml
  text: Uzzia the Ashterathite[a], Shama and Jeiel[b], the sons of Hotham the Aroerite.
translation:
  language: pt
  text: Uzias, o asteratita[a]; Samá e Jeuel[b], filhos de Hotão, o aroerita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “astarotita”; o gentílico provavelmente designa alguém de Asterote ou Astarote.
    reason: lexical_alternative
  - marker: b
    text: “Jeiel” é uma forma variante tradicional deste nome.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֻזִּיָא
  choice: Uzias
  rationale: Nome pessoal transliterado segundo a forma consagrada e facilmente reconhecível em português.
- source_word: הָעֲשְׁתְּרָתִי
  choice: o asteratita
  rationale: Gentílico ligado ao topônimo Asterote/Astarote; a forma escolhida acompanha de perto a vocalização hebraica presente, sem explicar além do texto.
- source_word: שָׁמָע
  choice: Samá
  rationale: Transliteração portuguesa da forma hebraica, com acento gráfico para indicar a tonicidade final.
- source_word: ויעואל
  choice: e Jeuel
  rationale: A conjunção ו é traduzida por “e”; o nome segue a forma consonantal Jeuel preservada no texto hebraico, enquanto a variante tradicional Jeiel é registrada em nota.
- source_word: בְּנֵי
  choice: filhos de
  rationale: Plural construto de “filho”; a expressão familiar é reproduzida diretamente e com naturalidade em português.
- source_word: חוֹתָם
  choice: Hotão
  rationale: Transliteração portuguesa do nome pessoal, representando a consoante inicial hebraica por H e a terminação nasal de modo natural.
- source_word: הָעֲרֹעֵרִי
  choice: o aroerita
  rationale: Gentílico derivado de Aroer; a forma portuguesa mantém o topônimo e emprega a terminação gentílica natural.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas de nomes adaptadas à leitura lusófona. O ponto e vírgula separa os nomes e reduz a possibilidade de se entender que Samá também era chamado de asteratita; as notas preservam variantes relevantes sem sobrecarregar o versículo.
