source:
  edition: WLC
  text: וַ֠/יָּבֹאוּ כָּל זִקְנֵ֨י יִשְׂרָאֵ֤ל אֶל הַ/מֶּ֨לֶךְ֙ חֶבְר֔וֹנָ/ה וַ/יִּכְרֹת֩ לָ/הֶ֨ם דָּוִ֥יד בְּרִ֛ית בְּ/חֶבְר֖וֹן לִ/פְנֵ֣י יְהוָ֑ה וַ/יִּמְשְׁח֨וּ אֶת דָּוִ֤יד לְ/מֶ֨לֶךְ֙ עַל יִשְׂרָאֵ֔ל כִּ/דְבַ֥ר יְהוָ֖ה בְּ/יַד שְׁמוּאֵֽל־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/003.yaml
  text: So all the elders of Israel came to the king at Hebron[a], and David made a covenant with them at Hebron before Yahweh. Then they anointed David king over Israel, according to the word of Yahweh by Samuel.
translation:
  language: pt
  text: Assim, todos os anciãos de Israel foram até o rei, em Hebrom, e Davi firmou uma aliança com eles ali, diante de Yahweh. Então ungiram Davi rei sobre Israel, conforme a palavra de Yahweh transmitida por meio de Samuel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “pela mão de Samuel”, expressão que significa “por meio de Samuel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי
  choice: anciãos
  rationale: Designa os representantes reconhecidos de Israel e preserva o caráter sociopolítico específico do termo.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Mantém o título definido do hebraico; a oração seguinte identifica o rei como Davi.
- source_word: חֶבְרוֹנָה / בְּחֶבְרוֹן
  choice: até o rei, em Hebrom / em Hebrom
  rationale: A primeira forma indica movimento em direção a Hebrom, enquanto a preposição da segunda ocorrência localiza ali a aliança. A formulação portuguesa distingue naturalmente essas funções.
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: firmou uma aliança
  rationale: Expressa em português corrente o idioma hebraico literalmente equivalente a “cortar uma aliança”, mantendo Davi como agente.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Preserva a ideia solene de que a aliança foi celebrada na presença e sob o testemunho divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: וַיִּמְשְׁחוּ
  choice: ungiram
  rationale: Mantém o ato concreto de unção ligado à instalação real.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: rei sobre Israel
  rationale: Representa de modo direto e natural a nomeação de Davi para governar Israel.
- source_word: כִּדְבַר יְהוָה
  choice: conforme a palavra de Yahweh
  rationale: Conserva o substantivo דָבָר e sua referência à declaração divina, sem restringi-lo a “promessa”.
- source_word: בְּיַד שְׁמוּאֵל
  choice: transmitida por meio de Samuel
  rationale: Comunica naturalmente o idioma de agência ou mediação, cujo sentido literal é “pela mão de Samuel”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Papel de Samuel na palavra divina
  choice: a palavra foi transmitida por meio de Samuel
  alternative: a palavra foi dita por Samuel; pela mão de Samuel
  rationale: A expressão hebraica indica mediação ou agência. A tradução evita fazer de Samuel a origem da palavra e identifica Yahweh como sua fonte.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Firmou uma aliança” evita o literalismo opaco de “cortou uma aliança”. O advérbio “ali” reduz a repetição pesada de “em Hebrom” sem perder a localização explícita. O marcador da nota foi colocado após “Samuel”, ao qual a nota efetivamente se refere.
