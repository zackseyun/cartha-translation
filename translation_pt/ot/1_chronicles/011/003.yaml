  source_fidelity: 'O texto traduz adequadamente todos os elementos do hebraico: os anciãos chegam ao rei em Hebrom; Davi firma a aliança diante de Yahweh; eles unem Davi como rei sobre Israel; e isso ocorre em conformidade com a palavra de Yahweh mediada por Samuel. A substituição da segunda menção explícita de Hebrom por “ali” não perde a referência nem introduz ambiguidade relevante.'
