base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/046.yaml
  text: Eliel the Mahavite[a], and Jeribai and Joshaviah, the sons of Elnaam[b], and Ithmah the Moabite.
translation:
  language: pt
  text: Eliel, o maavita[a]; Jeribai e Josavias, filhos de Elnaão; e Itma, o moabita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: maavita; não se sabe ao certo qual lugar ou clã está por trás dessa designação.'
    reason: cultural_note
lexical_decisions:
- source_word: אֱלִיאֵל
  choice: Eliel
  rationale: Nome próprio transliterado segundo formas correntes em português.
- source_word: הַמַּחֲוִים
  choice: o maavita
  rationale: Gentílico ou designação de clã de identificação incerta; a transliteração preserva a forma hebraica sem atribuir uma localização não comprovada.
- source_word: וִירִיבַי
  choice: Jeribai
  rationale: Nome próprio transliterado; esta forma representa de modo legível a vocalização massorética.
- source_word: וְיוֹשַׁוְיָה
  choice: Josavias
  rationale: Nome próprio apresentado em forma portuguesa reconhecível, refletindo as consoantes e a vocalização do hebraico.
- source_word: בְּנֵי
  choice: filhos de
  rationale: Plural construto que identifica Jeribai e Josavias como filhos de Elnaão.
- source_word: אֶלְנָעַם
  choice: Elnaão
  rationale: Transliteração aportuguesada do nome próprio, conservando a sequência vocálica final do hebraico.
- source_word: וְיִתְמָה
  choice: Itma
  rationale: Nome próprio transliterado de maneira natural em português; o yod inicial representa aqui uma vogal.
- source_word: הַמּוֹאָבִי
  choice: o moabita
  rationale: Gentílico definido usado como epíteto identificador de Itma.
