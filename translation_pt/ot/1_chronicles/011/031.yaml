- source_word: בְּנָיָה
  choice: Benaia
  rationale: Nome próprio transliterado em forma corrente na tradição bíblica de língua portuguesa.
- source_word: הַפִּרְעָתֹנִי
  choice: o piratonita
  rationale: O gentílico com artigo identifica Benaia por sua procedência ou associação com Piratom.
