  text: וַ/יִּֽתְיַצְּב֤וּ בְ/תוֹךְ הַ/חֶלְקָה֙ וַ/יַּצִּיל֔וּ/הָ וַ/יַּכּ֖וּ אֶת פְּלִשְׁתִּ֑ים וַ/יּ֥וֹשַׁע יְהוָ֖ה תְּשׁוּעָ֥ה גְדוֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/014.yaml
  text: And they took their stand in the middle of the plot and delivered it[a], and they struck down the Philistines, and Yahweh saved by a great victory.
translation:
  language: pt
  text: Eles tomaram posição no meio do terreno, defenderam-no e abateram os filisteus. E Yahweh concedeu uma grande vitória.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Yahweh realizou um grande livramento” ou “Yahweh trouxe grande salvação”.
    reason: O substantivo תְּשׁוּעָה pode indicar vitória, livramento ou salvação; o contexto é militar, mas convém preservar a amplitude lexical.
lexical_decisions:
- source_word: וַיִּתְיַצְּבוּ
  choice: tomaram posição
  rationale: Expressa a ideia reflexiva e deliberada de se colocar firmemente em posição, especialmente adequada ao contexto de combate.
- source_word: בְתוֹךְ הַחֶלְקָה
  choice: no meio do terreno
  rationale: הַחֶלְקָה designa uma parcela delimitada de terra; “terreno” é claro e natural em português, sem ampliar indevidamente para um campo inteiro.
- source_word: וַיַּצִּילוּהָ
  choice: defenderam-no
  rationale: O sufixo feminino hebraico retoma a parcela de terra. Como “terreno” é masculino em português, usa-se “-no”. “Defenderam” comunica naturalmente que impediram que o terreno caísse nas mãos do inimigo, embora o verbo também possa ser traduzido por “salvaram” ou “livraram”.
- source_word: וַיַּכּוּ אֶת־פְּלִשְׁתִּים
  choice: abateram os filisteus
  rationale: No contexto militar, נכה denota golpear com efeito destrutivo; “abateram” preserva essa força sem substituir o verbo simplesmente por “derrotaram”.
- source_word: וַיּוֹשַׁע יְהוָה תְּשׁוּעָה גְדוֹלָה
  choice: Yahweh concedeu uma grande vitória
  rationale: A combinação do verbo ישׁע com o substantivo cognato תְּשׁוּעָה atribui decisivamente a Yahweh o grande livramento ou triunfo. “Concedeu uma grande vitória” é natural no contexto bélico, enquanto a nota preserva outras possibilidades lexicais.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, preservando-o como nome próprio em vez de substituí-lo por um título.
theological_decisions:
- issue: Agente da vitória
  choice: Yahweh concedeu uma grande vitória
  alternative: Yahweh realizou um grande livramento
  rationale: A tradução mantém Yahweh como o agente explícito e não atribui o resultado apenas à coragem dos combatentes. A alternativa preserva mais diretamente o campo semântico de salvação e livramento.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome próprio divino; sua transliteração preserva essa distinção sem introduzir uma interpretação denominacional.
translation_notes:
  register: Português atual, digno e acessível, com sintaxe narrativa fluente. “Tomaram posição” conserva o tom militar; “terreno” evita o tecnicismo de “parcela”, e “defenderam-no” torna explícita de modo natural a preservação daquela área de terra.
