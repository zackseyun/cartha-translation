  text: וַ/יֵּ֥שֶׁב דָּוִ֖יד בַּ/מְצָ֑ד עַל כֵּ֥ן קָרְאוּ ל֖/וֹ עִ֥יר דָּוִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/007.yaml
  text: David lived in the stronghold[a]; therefore they called it the City of David.
translation:
  language: pt
  text: Davi morou na fortaleza[a]; por isso, chamaram-na Cidade de Davi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “posição fortificada”. O hebraico מְצָד refere-se a um lugar fortificado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: passou a morar
  rationale: Em narrativa, ישב com indicação de lugar significa residir ou estabelecer-se. “Passou a morar” comunica naturalmente que Davi fixou residência no local conquistado.
- source_word: בַּמְצָד
  choice: na fortaleza
  rationale: מְצָד designa um lugar fortificado e defensável. “Fortaleza” é claro e corrente em português; a alternativa “reduto fortificado” consta na nota.
- source_word: עַל כֵּן
  choice: por isso
  rationale: A expressão introduz a consequência do fato anterior; “por isso” preserva a relação causal em linguagem natural.
- source_word: קָרְאוּ לוֹ
  choice: chamaram-na
  rationale: O hebraico emprega uma forma ativa plural. O pronome feminino retoma “fortaleza” e mantém a construção ativa, sem identificar sujeitos que o texto não especifica.
- source_word: עִיר דָּוִיד
  choice: Cidade de Davi
  rationale: Trata-se de uma designação geográfica estabelecida; as iniciais maiúsculas assinalam seu uso como nome próprio.
