base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/017.yaml
  text: And David longed and said[b][a], “Who will give me water to drink from the well of Bethlehem that is by the gate?”
translation:
  language: pt
  text: 'Davi sentiu um forte desejo e disse: “Quem me dará de beber da água do poço[b] de Belém, que fica junto ao portão?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “Quem dera alguém me desse de beber da água do poço de Belém, junto ao portão!”'
    reason: lexical_alternative
  - marker: b
    text: A palavra hebraica traduzida como “poço” também pode significar “cisterna” ou “cova”; aqui, refere-se a uma fonte de água potável.
    reason: lexical_alternative
lexical_decisions:
- source_word: ויתאו
  choice: sentiu um forte desejo
  rationale: O verbo no hitpael expressa desejo intenso. A formulação é natural em português atual e preserva a força do hebraico sem excessiva poeticidade.
- source_word: מי
  choice: Quem me dará
  rationale: Mantém a forma interrogativa do hebraico, que neste contexto também expressa um anseio, sem convertê-la silenciosamente numa exclamação optativa.
- source_word: ישקני מים
  choice: me dará de beber da água
  rationale: Reproduz o sentido causativo de שקה e mantém a menção explícita à água. A construção é corrente e digna em português.
- source_word: מבּור
  choice: do poço
  rationale: Embora בור possa designar poço, cisterna ou cova, o contexto indica uma fonte conhecida de água potável; “poço” é a opção contextual mais clara, preservando a alternativa em nota.
- source_word: בית לחם
  choice: Belém
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: אשר בשער
  choice: que fica junto ao portão
  rationale: Expressa de modo natural a localização do poço em relação ao portão da cidade, sem afirmar precisão espacial maior que a do hebraico.
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem das notas acompanha sua primeira relevância no texto: [a] explica a forma da expressão de desejo; [b], o alcance semântico de “poço”.'
