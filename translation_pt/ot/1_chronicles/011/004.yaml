base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/004.yaml
  text: Then David and all Israel went to Jerusalem—that is[a], Jebus—where the Jebusites, the inhabitants of the land, were.
translation:
  language: pt
  text: Então Davi e todo o Israel foram a Jerusalém — isto é, Jebus —, onde estavam os jebuseus[a], habitantes da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “e ali o jebuseu, habitantes da terra”; “o jebuseu” é um singular coletivo e, por isso, foi traduzido por “os jebuseus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Então ... foram
  rationale: O wayyiqtol faz a narrativa avançar. Em português, “Então ... foram” expressa naturalmente a sequência; o plural concorda com o sujeito composto Davi e todo o Israel.
- source_word: וְכָל יִשְׂרָאֵל
  choice: e todo o Israel
  rationale: Mantém a conjunção e a designação coletiva nacional do hebraico em formulação corrente e tradicional em português.
- source_word: יְרוּשָׁלִַם הִיא יְבוּס
  choice: Jerusalém, isto é, Jebus
  rationale: O pronome הִיא identifica Jerusalém com o nome antigo Jebus; a expressão explicativa preserva essa equivalência com clareza.
- source_word: וְשָׁם
  choice: onde
  rationale: Embora literalmente seja “e ali”, “onde” liga de modo natural a descrição dos moradores à cidade mencionada, sem alterar o sentido.
- source_word: הַיְבוּסִי
  choice: os jebuseus
  rationale: O substantivo gentílico está morfologicamente no singular, mas tem valor coletivo, confirmado pelo particípio plural seguinte; o plural é natural em português.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: habitantes daquela terra
  rationale: O particípio em construção significa “habitantes de”. “Daquela terra” comunica a referência contextual ao território local habitado pelos jebuseus e evita sugerir toda a terra em sentido amplo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução segue equivalência ótima, preservando a progressão narrativa e o caráter coletivo de “Israel” e “jebuseu”, sem acrescentar interpretação teológica.
