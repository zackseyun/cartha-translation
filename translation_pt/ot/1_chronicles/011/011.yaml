  text: וְ/אֵ֛לֶּה מִסְפַּ֥ר הַ/גִּבֹּרִ֖ים אֲשֶׁ֣ר לְ/דָוִ֑יד יָשָׁבְעָ֣ם בֶּן חַכְמוֹנִ֗י רֹ֚אשׁ ה/שלושים הֽוּא עוֹרֵ֧ר אֶת חֲנִית֛/וֹ עַל שְׁלֹשׁ מֵא֥וֹת חָלָ֖ל בְּ/פַ֥עַם אֶחָֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/011.yaml
  text: 'And these are the number of David’s mighty men: Jashobeam son of Hachmoni[a], the chief of the Thirty; he wielded his spear against three hundred slain in one encounter.'
translation:
  language: pt
  text: 'E esta é a lista dos guerreiros valentes de Davi: Jasobeão, filho de Hacmoni, chefe dos Trinta. Ele brandiu a sua lança[a] contra trezentos homens e os matou numa só ocasião.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ergueu a sua lança”. A expressão hebraica é compacta e pode descrever o ato de levantar, brandir ou manejar a lança em combate.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפַּר
  choice: lista
  rationale: Embora o sentido básico seja “número” ou “contagem”, aqui o substantivo introduz uma relação nominal de guerreiros; “lista” comunica essa função com naturalidade em português.
- source_word: הַגִּבֹּרִים
  choice: guerreiros valentes
  rationale: A expressão reúne o sentido militar de “guerreiros” e a ideia de força ou valentia própria de גִּבּוֹר, sem depender do uso substantivado menos claro de “valentes”.
- source_word: אֲשֶׁר לְדָוִיד
  choice: de Davi
  rationale: A construção com לְ indica relação ou pertencimento; “de Davi” é a forma portuguesa direta e não especifica além do texto se eram propriedade, seguidores ou companheiros dele.
- source_word: יָשָׁבְעָם בֶּן חַכְמוֹנִי
  choice: Jasobeão, filho de Hacmoni
  rationale: Os nomes são transliterados em formas legíveis em português, e a relação filial explícita é preservada.
- source_word: רֹאשׁ הַשלושים
  choice: chefe dos Trinta
  rationale: רֹאשׁ indica liderança ou posição principal neste contexto; “os Trinta” é mantido como designação do grupo de elite.
- source_word: עוֹרֵר אֶת חֲנִיתוֹ
  choice: brandiu a sua lança
  rationale: O verbo significa literalmente despertar ou incitar, mas forma aqui uma expressão militar compacta; “brandiu” conserva a imagem de ação vigorosa com a lança.
- source_word: עַל שְׁלֹשׁ מֵאוֹת חָלָל
  choice: contra trezentos homens e os matou
  rationale: עַל expressa ação hostil dirigida contra os trezentos, e חָלָל os caracteriza como mortos em combate. A formulação portuguesa explicita a relação naturalmente implicada no relato.
- source_word: בְּפַעַם אֶחָת
  choice: numa só ocasião
  rationale: A expressão significa uma única vez ou ocorrência. “Numa só ocasião” preserva essa unidade sem sugerir, como “num só golpe”, que todos morreram por um único movimento físico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com nomes adaptados à leitura lusófona. “Guerreiros valentes” evita tanto um arcaísmo excessivo quanto uma paráfrase que apagaria a força do termo hebraico.
