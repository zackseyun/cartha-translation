  text: Hezro the Carmelite[a], Naarai son of Ezbai[b];
translation:
  language: pt
  text: Hezro, o carmelita[a], Naarai, filho de Ezbai[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o homem de Carmel». O gentílico hebraico designa alguém pertencente a Carmel.
    reason: lexical_alternative
  - marker: b
    text: 'Na lista paralela de 2 Samuel 23:35, os nomes correspondentes são diferentes: «Hezrai, o carmelita, Paarai, o arbita». Crônicas preserva aqui uma forma distinta.'
    reason: cross_reference
lexical_decisions:
- source_word: חֶצְרוֹ
  choice: Hezro
  rationale: Transliteração da forma hebraica preservada em Crônicas; a forma distinta da lista paralela não substitui a leitura do texto-fonte.
- source_word: הַכַּרְמְלִי
  choice: o carmelita
  rationale: Gentílico com artigo que designa alguém pertencente a Carmel. A forma tradicional e concisa é natural em português, embora possa ser confundida com a ordem religiosa posterior; a nota esclarece o sentido geográfico.
- source_word: נַעֲרַי
  choice: Naarai
  rationale: Transliteração direta do nome próprio hebraico, preservando a sequência vocálica.
- source_word: בֶּן
  choice: filho de
  rationale: Em uma lista de nomes, o sentido genealógico imediato de בֶּן é adequadamente expresso por «filho de».
- source_word: אֶזְבָּי
  choice: Ezbai
  rationale: Transliteração direta da forma hebraica do nome próprio.
