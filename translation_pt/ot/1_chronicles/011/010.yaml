  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה רָאשֵׁ֤י הַ/גִּבּוֹרִים֙ אֲשֶׁ֣ר לְ/דָוִ֔יד הַ/מִּתְחַזְּקִ֨ים עִמּ֧/וֹ בְ/מַלְכוּת֛/וֹ עִם כָּל יִשְׂרָאֵ֖ל לְ/הַמְלִיכ֑/וֹ כִּ/דְבַ֥ר יְהוָ֖ה עַל יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/010.yaml
  text: These were the chiefs of the mighty men who belonged to David[a], who strengthened themselves with him in his kingdom, together with all Israel, to make him king[b], according to the word of Yahweh concerning Israel.
translation:
  language: pt
  text: Estes foram os chefes dos guerreiros de Davi, que lhe deram forte apoio em seu reinado, juntamente com todo o Israel, para fazê-lo rei, segundo a palavra de Yahweh a respeito de Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאשֵׁי הַגִּבּוֹרִים
  choice: os chefes dos guerreiros
  rationale: רָאשֵׁי indica os principais ou líderes, e הַגִּבּוֹרִים designa aqui os combatentes de elite de Davi. “Chefes dos guerreiros” é claro e mantém o caráter militar da expressão.
- source_word: אֲשֶׁר לְדָוִיד
  choice: de Davi
  rationale: O lamed expressa pertença ou associação. O possessivo português comunica naturalmente que esses guerreiros estavam ligados a Davi, sem sugerir propriedade literal.
- source_word: הַמִּתְחַזְּקִים עִמּוֹ
  choice: que lhe deram forte apoio
  rationale: O hitpael de חזק com עִם pode indicar mostrar-se forte ao lado de alguém e, neste contexto de ascensão real, apoiá-lo vigorosamente. A formulação evita o pouco natural “fortaleceram-se com ele”.
- source_word: בְמַלְכוּתוֹ
  choice: em seu reinado
  rationale: מַלְכוּת pode significar realeza, domínio, reinado ou reino. Como o contexto trata do estabelecimento de Davi como rei, “reinado” ressalta seu governo sem transformar a expressão em referência territorial.
- source_word: עִם כָּל יִשְׂרָאֵל
  choice: juntamente com todo o Israel
  rationale: A expressão marca participação conjunta dos guerreiros e da coletividade de Israel.
- source_word: לְהַמְלִיכוֹ
  choice: para fazê-lo rei
  rationale: O hiphil de מלך significa fazer alguém rei; esta é a correspondência direta e idiomática em português.
- source_word: כִּדְבַר יְהוָה
  choice: segundo a palavra de Yahweh
  rationale: “Palavra” preserva a referência formal à declaração divina, e “Yahweh” translitera o nome próprio יהוה em vez de substituí-lo por um título.
- source_word: עַל יִשְׂרָאֵל
  choice: a respeito de Israel
  rationale: 'Com דָּבָר, עַל naturalmente introduz o assunto da palavra: aquilo que Yahweh declarou a respeito de Israel.'
theological_decisions:
- issue: Sentido da ação expressa por הַמִּתְחַזְּקִים עִמּוֹ
  choice: apoio político-militar vigoroso a Davi
  alternative: fortaleceram-se com ele / mostraram-se fortes ao lado dele
  rationale: A finalidade imediatamente declarada, “para fazê-lo rei”, favorece a ideia de apoio ativo à ascensão de Davi. A tradução comunica esse sentido contextual sem atribuir uma forma específica de coroação.
- issue: Amplitude semântica de בְמַלְכוּתוֹ
  choice: em seu reinado
  alternative: em seu reino / em sua realeza
  rationale: O contexto enfatiza o estabelecimento do governo real de Davi. “Reinado” é natural em português, embora o hebraico também possa abranger a condição ou autoridade régia.
- issue: Relação de עַל יִשְׂרָאֵל com a frase precedente
  choice: a palavra de Yahweh a respeito de Israel
  alternative: a palavra de Yahweh sobre Israel
  rationale: A leitura adotada liga a locução à palavra divina, e não ao âmbito do reinado de Davi, preservando a sintaxe mais provável.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem da frase foi suavemente ajustada para evitar construções artificiais. Não se acrescentou marcador discursivo equivalente a “ora/agora”, pois o hebraico começa apenas com a conjunção וְ.
