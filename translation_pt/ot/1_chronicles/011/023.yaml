base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/023.yaml
  text: And he struck down the Egyptian[a], a man five cubits tall. In the Egyptian’s hand was a spear like a weaver’s beam, and he went down to him with a staff, snatched the spear from the Egyptian’s hand[c][b], and killed him with his own spear.
translation:
  language: pt
  text: Ele abateu o egípcio, um homem de cinco côvados de altura[a][b]. O egípcio tinha na mão uma lança semelhante à viga de um tear. Ele desceu até o egípcio com um bastão[c], arrancou-lhe a lança da mão e o matou com a própria lança do egípcio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um homem de grande estatura, de cinco côvados de altura”. A expressão hebraica diz literalmente “um homem de medida”.'
    reason: lexical_alternative
  - marker: b
    text: O côvado era uma antiga unidade de comprimento baseada aproximadamente na distância entre o cotovelo e a ponta dos dedos.
    reason: cultural_note
  - marker: c
    text: 'Ou: “com uma vara” ou “com um cajado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  choice: abateu
  rationale: Expressa um golpe que derruba sem antecipar o verbo explícito “matou”, que aparece no fim do versículo.
- source_word: הָאִישׁ הַמִּצְרִי
  choice: o egípcio
  rationale: É natural em português e identifica claramente o homem pela nacionalidade sem repetição desnecessária.
- source_word: אִישׁ מִדָּה חָמֵשׁ בָּאַמָּה
  choice: um homem de cinco côvados de altura
  rationale: Integra a expressão idiomática “homem de medida” à medida que vem em seguida, comunicando de modo claro sua estatura excepcional.
- source_word: חֲנִית
  choice: lança
  rationale: Designa adequadamente a arma comprida comparada à viga de um tear e funciona naturalmente no contexto de combate.
- source_word: כִּמְנוֹר אֹרְגִים
  choice: semelhante à viga de um tear
  rationale: Comunica em linguagem atual a comparação entre a haste da lança e uma peça estrutural espessa do tear.
- source_word: וַיֵּרֶד אֵלָיו
  choice: desceu até o egípcio
  rationale: Preserva o sentido espacial do verbo ירד sem acrescentar uma interpretação não expressa, como “avançou para atacá-lo”.
- source_word: בַּשָּׁבֶט
  choice: com um bastão
  rationale: Mantém o contraste com a lança e representa de modo amplo o campo semântico de שבט, que também pode indicar vara ou cajado.
- source_word: וַיִּגְזֹל
  choice: arrancou-lhe
  rationale: Transmite a tomada à força e a rapidez da ação em combate, além de evitar o sentido econômico de “roubar”.
- source_word: וַיַּהַרְגֵהוּ
  choice: o matou
  rationale: Traduz diretamente o verbo explícito de matar em linguagem moderna.
- source_word: בַּחֲנִיתוֹ
  choice: com a própria lança dele
  rationale: Torna claro que a lança pertencia ao egípcio, preservando a ironia narrativa sem deixar o pronome ambíguo em português.
