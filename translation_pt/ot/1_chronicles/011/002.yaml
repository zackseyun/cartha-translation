  text: גַּם תְּמ֣וֹל גַּם שִׁלְשׁ֗וֹם גַּ֚ם בִּ/הְי֣וֹת שָׁא֣וּל מֶ֔לֶךְ אַתָּ֛ה הַ/מּוֹצִ֥יא וְ/הַ/מֵּבִ֖יא אֶת יִשְׂרָאֵ֑ל וַ/יֹּאמֶר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ לְ/ךָ֗ אַתָּ֨ה תִרְעֶ֤ה אֶת עַמִּ/י֙ אֶת יִשְׂרָאֵ֔ל וְ/אַתָּה֙ תִּהְיֶ֣ה נָגִ֔יד עַ֖ל עַמִּ֥/י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/002.yaml
  text: Even in times past[a], even before, when Saul was king, you were the one who led Israel out and brought them in; and Yahweh your God said to you, ‘You shall shepherd my people Israel[c][b], and you shall be ruler over my people Israel.’
translation:
  language: pt
  text: 'Já em tempos passados,[a] quando Saul era rei, era você quem conduzia Israel em suas saídas e entradas;[b] e Yahweh, seu Deus, lhe disse: “Você pastoreará o meu povo, Israel, e será o líder[c] do meu povo, Israel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “tanto ontem como anteontem”, expressão idiomática hebraica que significa “antigamente” ou “em tempos passados”.
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, “era você quem fazia Israel sair e entrar”, expressão hebraica que, neste contexto, descreve o exercício da liderança sobre o povo.
    reason: lexical_alternative
  - marker: c
    text: Ou “governante”, “príncipe” ou “chefe”. O termo hebraico não é a palavra habitual para “rei”.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם תְּמוֹל גַּם שִׁלְשׁוֹם
  choice: Mesmo antes, em tempos passados
  rationale: Expressa em português natural o idioma hebraico referente ao passado, preservando também sua ênfase temporal sem reproduzir literalmente uma fórmula que poderia ser mal compreendida.
- source_word: בִּהְיוֹת שָׁאוּל מֶלֶךְ
  choice: quando Saul era rei
  rationale: A construção com infinitivo estabelece uma oração temporal; esta formulação é direta e natural.
- source_word: אַתָּה הַמּוֹצִיא וְהַמֵּבִיא אֶת יִשְׂרָאֵל
  choice: era você quem fazia Israel sair e entrar
  rationale: Preserva a imagem concreta do hebraico e a ênfase em David como aquele que conduzia Israel, enquanto a nota esclarece o sentido de liderança.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: תִרְעֶה
  choice: pastoreará
  rationale: Mantém a metáfora régia do pastor presente explicitamente no hebraico.
- source_word: נָגִיד
  choice: líder
  rationale: Comunica o papel de autoridade sem confundir נָגִיד com מֶלֶךְ, o termo comum para “rei” usado anteriormente no versículo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome divino pessoal; “Yahweh” o representa diretamente, sem substituí-lo por um título.
- issue: Metáfora de governo em תִרְעֶה
  choice: Você pastoreará o meu povo Israel
  alternative: Você governará/cuidará do meu povo Israel
  rationale: Preserva a metáfora pastoral e sua tensão régia, sem reduzi-la a uma descrição abstrata de governo.
- issue: Distinção entre נָגִיד e מֶלֶךְ
  choice: líder
  alternative: governante; príncipe; chefe
  rationale: “Líder” mantém o campo semântico de autoridade e evita identificar automaticamente o termo com “rei”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva as imagens hebraicas de fazer o povo sair e entrar e de pastorear, esclarecendo por notas seu valor idiomático. Os marcadores seguem a ordem de ocorrência no texto.
