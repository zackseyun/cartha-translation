base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/022.yaml
  text: Benaiah son of Jehoiada[a], son of a mighty man, a man of many deeds, from Kabzeel—he struck down the two heroes of Moab. He also went down and struck down the lion in the midst of a pit on a snowy day.
translation:
  language: pt
  text: Benaia, filho de Joiada, era filho de um homem valente, de muitos feitos, natural de Cabzeel. Ele abateu os dois heróis de Moabe[a]. Também desceu e, dentro da cova, abateu o leão, num dia de neve.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica é incerta. Também pode significar “os dois filhos de Ariel, de Moabe”, “os dois Ariéis de Moabe” ou “os dois heróis semelhantes a leões de Moabe”.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ חַיִל
  choice: um homem valente
  rationale: No contexto de uma lista de guerreiros, a expressão indica força e valor comprovados. “Homem valente” é natural, digno e preserva o sentido marcial sem acrescentar posição social.
- source_word: רַב פְּעָלִים
  choice: de muitos feitos
  rationale: Reproduz de perto a ideia de numerosos atos ou façanhas notáveis, em português claro e conciso.
- source_word: מִן קַבְצְאֵל
  choice: natural de Cabzeel
  rationale: O מן indica procedência. “Natural de” expressa de modo idiomático a origem geográfica.
- source_word: הִכָּה
  choice: abateu
  rationale: O verbo נכה tem sentido amplo de golpear ou derrubar. Neste relato de façanhas militares e no episódio do leão, “abateu” comunica a ação violenta e seu provável resultado sem recorrer ao arcaísmo “feriu de morte”.
- source_word: שְׁנֵי אֲרִיאֵל מוֹאָב
  choice: os dois heróis de Moabe
  rationale: אֲרִיאֵל é incerto neste contexto e pode estar ligado à imagem do leão ou funcionar como nome próprio. “Heróis” oferece um sentido contextual plausível e inteligível, enquanto a nota preserva as demais leituras relevantes.
- source_word: יָרַד
  choice: desceu
  rationale: Mantém o movimento descendente expresso pelo verbo e sua provável referência à entrada na cova.
- source_word: הָאֲרִי
  choice: um leão
  rationale: O substantivo designa claramente o animal. Embora o hebraico tenha artigo definido, o português normalmente introduz esse participante pela primeira vez com artigo indefinido.
- source_word: בְּתוֹךְ הַבּוֹר
  choice: a uma cova ... lá dentro
  rationale: A construção portuguesa distribui naturalmente o movimento de descida e a localização interna. בּוֹר pode designar cova, poço ou cisterna; “cova” se ajusta bem ao episódio sem exigir que fosse uma estrutura para água.
- source_word: בְּיוֹם הַשָּׁלֶג
  choice: num dia de neve
  rationale: É uma tradução idiomática da expressão literal “no dia da neve” e conserva a circunstância marcante do feito.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A sintaxe foi levemente reorganizada para evitar uma longa cadeia ambígua de aposições, sem alterar as relações indicadas pelo hebraico. A nota foi colocada junto à expressão incerta a que efetivamente se refere.
