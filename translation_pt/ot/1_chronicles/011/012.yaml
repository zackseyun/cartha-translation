base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/012.yaml
  text: After him was Eleazar son of Dodo the Ahohite[a]; he was among the three mighty men.
translation:
  language: pt
  text: Depois dele, Eleazar, filho de Dodô, o aoíta, estava entre os três guerreiros valentes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ele era um dos três guerreiros valentes”. A expressão hebraica pode indicar que Eleazar fazia parte do grupo de elite conhecido como “os três”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: Depois dele
  rationale: A expressão indica a sequência na lista dos guerreiros de Davi. Em português, “Depois dele” comunica isso naturalmente sem precisar reproduzir a conjunção inicial.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Transliteração portuguesa tradicional e reconhecível do nome próprio hebraico.
- source_word: בֶּן
  choice: filho de
  rationale: O sentido genealógico imediato é o mais natural neste contexto.
- source_word: דּוֹדוֹ
  choice: Dodô
  rationale: Representa a forma consonantal e a pronúncia do nome próprio neste versículo, distinguindo-a da variante Dodai encontrada em outro lugar.
- source_word: הָאֲחוֹחִי
  choice: o aoíta
  rationale: Mantém como designação de clã ou origem o gentílico hebraico, em forma corrente na tradição bíblica portuguesa.
- source_word: הוּא בִּשְׁלוֹשָׁה
  choice: ele estava entre os três
  rationale: A construção indica inclusão no conhecido grupo dos três, preservando a formulação hebraica sem explicitar mais do que o texto.
- source_word: הַגִּבֹּרִים
  choice: guerreiros valentes
  rationale: Expressa tanto o caráter militar quanto a força ou bravura associada ao termo, que aqui funciona quase como título dos combatentes de elite de Davi.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com nomes em formas reconhecíveis ao leitor lusófono. “Vinha” torna natural a sequência da lista; “guerreiros valentes” evita que o substantivo tradicional “valentes” pareça vago fora do contexto militar.
