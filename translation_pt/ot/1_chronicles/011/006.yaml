  text: וַ/יֹּ֣אמֶר דָּוִ֔יד כָּל מַכֵּ֤ה יְבוּסִי֙ בָּ/רִ֣אשׁוֹנָ֔ה יִהְיֶ֥ה לְ/רֹ֖אשׁ וּ/לְ/שָׂ֑ר וַ/יַּ֧עַל בָּ/רִאשׁוֹנָ֛ה יוֹאָ֥ב בֶּן צְרוּיָ֖ה וַ/יְהִ֥י לְ/רֹֽאשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/006.yaml
  text: And David said[a], “Whoever strikes down a Jebusite first shall become chief and commander.” So Joab son of Zeruiah went up first[b], and he became chief.
translation:
  language: pt
  text: 'E Davi disse: “Quem primeiro derrotar um jebuseu se tornará chefe e comandante[a]”. Então Joabe, filho de Zeruia, subiu primeiro[b] e se tornou chefe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “será o líder e comandante”.'
    reason: lexical_alternative
  - marker: b
    text: “Subiu” pode indicar aqui que ele avançou para atacar a fortaleza, mas o hebraico diz simplesmente “subiu”.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל מַכֵּה יְבוּסִי
  choice: Quem [...] derrotar um jebuseu
  rationale: כָּל com o particípio מַכֵּה funciona como relativo indefinido, “quem” ou “aquele que”. No contexto militar, נכה pode indicar vencer ou abater; “derrotar” comunica naturalmente o sentido marcial sem exigir que o indivíduo seja morto. O singular יְבוּסִי é entendido de modo genérico.
- source_word: בָּרִאשׁוֹנָה
  choice: primeiro
  rationale: O uso adverbial expressa prioridade na ação. “Primeiro” é claro e natural em português e é mantido nas duas ocorrências.
- source_word: יִהְיֶה לְרֹאשׁ וּלְשָׂר
  choice: se tornará chefe e comandante
  rationale: היה com לְ indica a aquisição de uma posição. רֹאשׁ designa aquele que ocupa a liderança, e שַׂר, neste contexto militar, um comandante. A formulação conserva os dois termos sem recorrer a linguagem arcaica.
- source_word: וַיַּעַל
  choice: subiu
  rationale: עלה significa literalmente “subir”. Embora o contexto possa sugerir o avanço contra uma fortaleza, a tradução mantém a expressão concreta e deixa a possível implicação militar para a nota.
- source_word: יוֹאָב בֶּן צְרוּיָה
  choice: Joabe, filho de Zeruia
  rationale: Emprega as formas portuguesas tradicionais e amplamente reconhecidas dos nomes, com a filiação apresentada de maneira natural.
- source_word: וַיְהִי לְרֹאשׁ
  choice: e se tornou chefe
  rationale: Repete “chefe” para preservar a ligação lexical com רֹאשׁ na promessa anterior. Como o texto aqui menciona apenas רֹאשׁ, não se repete “comandante”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi ajustada para “quem primeiro derrotar” a fim de expressar naturalmente a prioridade indicada pelo hebraico. Preservou-se “subiu” em vez de explicitar “atacou”, evitando resolver uma implicação contextual que o texto não declara.
