  text: Ahiam son of Sachar the Hararite[a], Eliphal son of Ur.
translation:
  language: pt
  text: Aião, filho de Sacar, o hararita; Elifal, filho de Ur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲחִיאָם
  choice: Aião
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio hebraico, adequada à legibilidade brasileira.
- source_word: בֶּן
  choice: filho de
  rationale: Neste contexto de uma lista militar, a filiação imediata é o sentido mais natural; a formulação também preserva a concisão do hebraico.
- source_word: שָׂכָר
  choice: Sacar
  rationale: Transliteração portuguesa clara do nome próprio hebraico.
- source_word: הַהֲרָרִי
  choice: o hararita
  rationale: Mantém o gentílico ou qualificativo geográfico sem identificar de modo especulativo o lugar subjacente.
- source_word: אֱלִיפַל
  choice: Elifal
  rationale: Transliteração portuguesa do nome próprio, distinguindo-o de formas diferentes em outros contextos.
- source_word: אוּר
  choice: Ur
  rationale: Transliteração direta do nome pessoal; o contexto não se refere à cidade mesopotâmica.
theological_decisions: []
translation_notes:
  register: Português moderno, conciso e digno, com pontuação que torna clara a sequência dos nomes na lista. Não se acrescentou nota sobre a possibilidade mais ampla de בֶּן significar «descendente de», pois neste registro a filiação imediata é o sentido contextual mais natural e a alternativa não afeta de modo significativo a leitura do versículo.
