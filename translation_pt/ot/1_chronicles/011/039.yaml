  text: Zelek the Ammonite[a], Naharai the Beerothite, the armor-bearer of Joab son of Zeruiah;
translation:
  language: pt
  text: Zeleque, o amonita; Naarai, o beerotita, escudeiro[a] de Joabe, filho de Zeruia;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “aquele que carregava as armas de Joabe”.
