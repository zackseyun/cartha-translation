lexical_decisions:
- source_word: צֶלֶק
  choice: Zeleque
  rationale: Forma portuguesa tradicional e legível do nome próprio hebraico.
- source_word: הָעַמּוֹנִי
  choice: o amonita
  rationale: O gentílico com artigo identifica a origem étnica ou geográfica de Zeleque.
- source_word: נַחְרַי
  choice: Naarai
  rationale: Transliteração portuguesa que representa o nome próprio hebraico e se harmoniza com o uso bíblico corrente em português.
- source_word: הַבֵּרֹתִי
  choice: o beerotita
  rationale: Gentílico derivado de Beerote; a forma preserva de modo transparente a ligação com o nome do lugar.
- source_word: נֹשֵׂא כְּלֵי
  choice: escudeiro
  rationale: Equivalente idiomático natural para a expressão hebraica que designa quem carregava as armas ou o equipamento de um guerreiro; a tradução mais literal é preservada em nota.
- source_word: יוֹאָב
  choice: Joabe
  rationale: Forma portuguesa tradicional do nome próprio.
- source_word: בֶּן צְרוּיָה
  choice: filho de Zeruia
  rationale: Preserva a identificação de Joabe por sua linhagem materna, conforme o hebraico.
