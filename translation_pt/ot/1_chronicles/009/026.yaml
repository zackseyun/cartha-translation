  text: כִּ֣י בֶ/אֱמוּנָ֞ה הֵ֗מָּה אַרְבַּ֨עַת֙ גִּבֹּרֵ֣י הַ/שֹּׁעֲרִ֔ים הֵ֖ם הַ/לְוִיִּ֑ם וְ/הָיוּ֙ עַל הַ/לְּשָׁכ֔וֹת וְ/עַ֥ל הָ/אֹצְר֖וֹת בֵּ֥ית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/026.yaml
  text: For these four mighty gatekeepers[a], who were Levites[b], were entrusted with the chambers and with the storehouses of the house of God.
translation:
  language: pt
  text: Pois aqueles quatro valentes porteiros, que eram levitas, exerciam fielmente o seu encargo[a] e eram responsáveis pelas salas e pelos depósitos[b] da casa de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ocupavam uma posição de confiança”. O hebraico ressalta a fidelidade ou confiabilidade com que esses quatro porteiros exerciam sua função.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “tesouros” ou “salas do tesouro”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz uma explicação ligada à distribuição de funções descrita no contexto anterior.
- source_word: בֶאֱמוּנָה
  choice: exerciam fielmente o seu encargo
  rationale: Preserva a ideia de fidelidade e confiabilidade no desempenho de uma função oficial, sem fundi-la com a construção posterior וְהָיוּ עַל.
- source_word: הֵמָּה
  choice: aqueles
  rationale: Retoma enfaticamente os porteiros já mencionados no contexto.
- source_word: אַרְבַּעַת גִּבֹּרֵי הַשֹּׁעֲרִים
  choice: quatro valentes porteiros
  rationale: Mantém a força lexical de גִּבּוֹר, que os caracteriza como homens fortes, capazes ou destacados, evitando substituí-la silenciosamente por uma indicação apenas hierárquica.
- source_word: הֵם הַלְוִיִּם
  choice: que eram levitas
  rationale: Expressa naturalmente em português a identificação parentética dos quatro porteiros.
- source_word: וְהָיוּ עַל
  choice: eram responsáveis por
  rationale: Comunica de forma idiomática a responsabilidade de supervisão indicada por היה com עַל.
- source_word: הַלְּשָׁכוֹת
  choice: as salas
  rationale: Termo claro e atual para os aposentos ou câmaras vinculados ao serviço do templo.
- source_word: הָאֹצְרוֹת
  choice: os depósitos
  rationale: Abrange lugares destinados à guarda de provisões e objetos valiosos sem restringir o sentido a dinheiro.
- source_word: בֵּית הָאֱלֹהִים
  choice: a casa de Deus
  rationale: Reproduz de modo transparente a expressão hebraica e conserva sua referência ao templo.
