  text: וּ/מֵ/הֶ֗ם מְמֻנִּים֙ עַל הַ/כֵּלִ֔ים וְ/עַ֖ל כָּל כְּלֵ֣י הַ/קֹּ֑דֶשׁ וְ/עַל הַ/סֹּ֨לֶת֙ וְ/הַ/יַּ֣יִן וְ/הַ/שֶּׁ֔מֶן וְ/הַ/לְּבוֹנָ֖ה וְ/הַ/בְּשָׂמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/029.yaml
  text: And some of them were appointed over the vessels[a], over all the holy vessels, and over the fine flour, the wine, the oil, the frankincense, and the spices.
translation:
  language: pt
  text: Alguns deles foram encarregados dos utensílios, de todos os utensílios sagrados[a], da farinha fina, do vinho, do óleo, do olíbano e das especiarias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de todos os utensílios do santuário”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵהֶם
  choice: Alguns deles
  rationale: 'Expressa de modo natural o sentido partitivo de מן: pessoas escolhidas dentre o grupo mencionado.'
- source_word: מְמֻנִּים עַל
  choice: foram encarregados de
  rationale: O particípio passivo com עַל indica atribuição de responsabilidade; a formulação portuguesa preserva tanto a nomeação quanto a esfera do encargo.
- source_word: הַכֵּלִים
  choice: os utensílios
  rationale: כְּלִים é um termo amplo para objetos e implementos; “utensílios” é claro e apropriado ao contexto do templo.
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: todos os utensílios sagrados
  rationale: Mantém de forma compacta a construção hebraica, entendendo הַקֹּדֶשׁ como qualidade ou esfera de santidade, sem excluir a leitura ligada ao santuário.
- source_word: הַסֹּלֶת
  choice: a farinha fina
  rationale: סֹלֶת designa farinha de qualidade fina, especialmente usada nas ofertas, e não farinha em sentido genérico.
- source_word: הַיַּיִן
  choice: o vinho
  rationale: Equivalente lexical direto, adequado aos suprimentos destinados ao serviço sagrado.
- source_word: הַשֶּׁמֶן
  choice: o azeite
  rationale: No contexto israelita antigo, שֶׁמֶן normalmente se refere ao óleo de oliva; “azeite” é a forma portuguesa natural, embora o hebraico não especifique aqui a matéria-prima.
- source_word: הַלְּבוֹנָה
  choice: o incenso puro
  rationale: לְבוֹנָה designa especificamente olíbano ou franquincenso; “incenso puro” é uma expressão bíblica portuguesa acessível, mais reconhecível que o termo técnico.
- source_word: הַבְּשָׂמִים
  choice: as especiarias
  rationale: O termo abrange substâncias aromáticas usadas em preparações sagradas; “especiarias” conserva essa amplitude sem sugerir uso meramente cosmético.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A repetição completa de “encarregados de” foi condensada numa enumeração natural, sem alterar as esferas de responsabilidade. “Utensílios sagrados” preserva a formulação concisa do hebraico, e a nota registra a alternativa locativa “do santuário”.
