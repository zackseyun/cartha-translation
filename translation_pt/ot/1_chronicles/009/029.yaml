  terminology: «Utensílios», «utensílios sagrados», «farinha fina», «vinho» e «especiarias» são escolhas adequadas. «Olíbano» é o equivalente específico de לְבוֹנָה; «óleo» evita especificar a origem vegetal que o texto não declara.
