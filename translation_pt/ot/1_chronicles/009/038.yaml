base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/038.yaml
  text: Mikloth fathered Shimeam[a]. They also lived opposite their brothers in Jerusalem[b], with their brothers.
translation:
  language: pt
  text: Miclote gerou Simeão[a]. Eles também moravam diante de seus irmãos, em Jerusalém[b], com seus irmãos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico Shimeam; algumas traduções trazem «Simeia», provavelmente por harmonização com formas genealógicas paralelas.
    reason: alternative_reading
  - marker: b
    text: Ou «em frente a seus irmãos» ou «perto de seus irmãos».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִקְלוֹת
  choice: Miclot
  rationale: Nome próprio transliterado em forma natural para leitores de português; a conjunção inicial é absorvida pela continuidade narrativa.
- source_word: הוֹלִיד
  choice: gerou
  rationale: No contexto genealógico, o hifil de ילד indica gerar ou tornar-se pai de; “gerou” é conciso e corrente.
- source_word: אֶת שִׁמְאָם
  choice: Simeão
  rationale: Segue a forma consonantal שִׁמְאָם deste versículo, sem harmonizá-la silenciosamente com formas genealógicas paralelas.
- source_word: וְאַף הֵם
  choice: Eles também
  rationale: Preserva o valor aditivo e enfático de וְאַף em português natural.
- source_word: נֶגֶד
  choice: diante de
  rationale: Mantém a noção espacial relacional do hebraico sem decidir com excessiva precisão entre “diante de”, “em frente a” e “perto de”.
- source_word: אֲחֵיהֶם
  choice: seus irmãos
  rationale: Reproduz o sentido literal e mantém a referência genealógica masculina.
- source_word: יָשְׁבוּ
  choice: moravam
  rationale: Neste aviso de residência, ישב descreve habitação contínua; “moravam” é moderno e natural.
- source_word: בִירוּשָׁלִַם
  choice: em Jerusalém
  rationale: Forma portuguesa consagrada do topônimo, com a preposição preservada.
- source_word: עִם אֲחֵיהֶם
  choice: com seus irmãos
  rationale: Preserva a associação expressa por עִם e também a repetição intencional de “seus irmãos” no hebraico.
