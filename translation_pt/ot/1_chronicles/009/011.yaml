source:
  edition: WLC
  text: וַ/עֲזַרְיָ֨ה בֶן חִלְקִיָּ֜ה בֶּן מְשֻׁלָּ֣ם בֶּן צָד֗וֹק בֶּן מְרָיוֹת֙ בֶּן אֲחִיט֔וּב נְגִ֖יד בֵּ֥ית הָ/אֱלֹהִֽים־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/011.yaml
  text: and Azariah son of Hilkiah[a], son of Meshullam, son of Zadok, son of Meraioth, son of Ahitub, chief officer of the house of God.
translation:
  language: pt
  text: e Azarias, filho de Hilquias, filho de Mesulão, filho de Zadoque, filho de Meraiote, filho de Aitube, dirigente[a] da casa de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «líder», «chefe» ou «governante».
    reason: Alternativas lexicais legítimas para נְגִיד; a nota preserva a amplitude do termo hebraico.
lexical_decisions:
- source_word: וַ/עֲזַרְיָה
  choice: e Azarias
  rationale: A conjunção ו dá continuidade à lista do versículo anterior; o nome recebe sua forma portuguesa tradicional e amplamente reconhecida.
- source_word: בֶן
  choice: filho de
  rationale: A fórmula genealógica repetida é traduzida literalmente e com consistência. Embora genealogias hebraicas possam omitir gerações, não é necessário explicitar aqui «descendente de».
- source_word: חִלְקִיָּה
  choice: Hilquias
  rationale: Forma portuguesa tradicional do nome próprio.
- source_word: מְשֻׁלָּם
  choice: Mesulão
  rationale: Forma portuguesa tradicional e legível do nome próprio.
- source_word: צָדוֹק
  choice: Zadoque
  rationale: Forma portuguesa tradicional do nome próprio.
- source_word: מְרָיוֹת
  choice: Meraiote
  rationale: Transliteração adaptada à ortografia e à pronúncia portuguesas.
- source_word: אֲחִיטוּב
  choice: Aitube
  rationale: Forma portuguesa tradicional do nome próprio.
- source_word: נְגִיד
  choice: dirigente
  rationale: O termo designa alguém colocado à frente, com autoridade e responsabilidade de supervisão. «Dirigente» é natural no contexto institucional do templo e evita a conotação monárquica de «príncipe».
- source_word: בֵּית הָאֱלֹהִים
  choice: a casa de Deus
  rationale: Preserva a imagem hebraica e sua ressonância cultual; «templo de Deus» seria correto no contexto, mas menos formalmente transparente.
theological_decisions:
- issue: Sentido de אֱלֹהִים na designação do santuário
  choice: Deus
  alternative: os deuses
  rationale: No contexto do santuário de Israel, o termo se refere inequivocamente ao Deus de Israel; o singular é necessário para transmitir o sentido do texto.
translation_notes:
  register: Português moderno, claro e digno, com nomes bíblicos em formas tradicionais de ampla legibilidade. A repetição genealógica foi mantida. O marcador da nota foi colocado junto de «dirigente», termo ao qual a alternativa lexical realmente se refere.
