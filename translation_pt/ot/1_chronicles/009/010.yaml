lexical_decisions:
- source_word: וּמִן
  choice: E, dentre
  rationale: 'O וְ liga este grupo ao contexto anterior, e מִן tem sentido partitivo: são mencionados alguns dentre o conjunto dos sacerdotes.'
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Tradução corrente e direta do substantivo plural definido, que identifica o grupo sacerdotal enumerado.
- source_word: יְדַעְיָה
  choice: Jedaías
  rationale: Forma tradicional e reconhecível em português para este nome hebraico, com acento gráfico que orienta a pronúncia.
- source_word: וִיהוֹיָרִיב
  choice: Joiaribe
  rationale: Forma tradicional em português do nome hebraico; a conjunção prefixada é representada pela coordenação natural da lista.
- source_word: וְיָכִין
  choice: e Jaquim
  rationale: Forma tradicional em português; preserva-se explicitamente a conjunção que introduz o último nome da enumeração.
