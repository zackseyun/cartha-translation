  text: And Phinehas son of Eleazar had formerly been chief over them[a]; Yahweh was with him.
translation:
  language: pt
  text: E Fineias, filho de Eleazar, anteriormente havia sido o chefe deles[a]; Yahweh estava com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E Fineias, filho de Eleazar, era o chefe deles em tempos passados.” A ordem das palavras no hebraico permite relacionar mais estreitamente a expressão temporal tanto com “havia sido o chefe” quanto com a oração inteira.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפִינְחָס
  choice: E Fineias
  rationale: O nome próprio segue a forma portuguesa consagrada, e a conjunção prefixada é preservada para manter a ligação com o contexto.
- source_word: בֶּן אֶלְעָזָר
  choice: filho de Eleazar
  rationale: Reproduz de modo conciso e natural a relação genealógica expressa pelo construto hebraico.
- source_word: נָגִיד
  choice: chefe
  rationale: Designa alguém em posição de liderança ou autoridade; “chefe” se ajusta ao contexto cultual-administrativo sem sugerir necessariamente realeza.
- source_word: הָיָה עֲלֵיהֶם
  choice: havia sido o chefe deles
  rationale: Expressa a autoridade exercida sobre o grupo mencionado anteriormente e, com o advérbio temporal, apresenta essa situação como anterior.
- source_word: לְפָנִים
  choice: anteriormente
  rationale: O termo funciona adverbialmente e remete a um período anterior; a posição do hebraico permite certa ambiguidade quanto ao seu vínculo sintático, preservada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: עִמּוֹ
  choice: estava com ele
  rationale: Preserva a formulação simples que pode expressar presença e favor divinos sem explicitação interpretativa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o caráter de nome pessoal sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação mantém a concisão narrativa e registra em nota a ambiguidade temporal genuína do hebraico.
