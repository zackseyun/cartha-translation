- source_word: וּ/גְד֣וֹר
  choice: e Gedor
  rationale: Nome próprio com a conjunção וּ. Mantém-se a forma tradicional e reconhecível em português.
- source_word: וְ/אַחְי֔וֹ
  choice: Aiô
  rationale: O nome próprio hebraico é transliterado segundo a forma bíblica corrente em português; a conjunção da enumeração não precisa ser repetida diante de cada nome.
- source_word: וּ/זְכַרְיָ֖ה
  choice: Zacarias
  rationale: Emprega-se a forma portuguesa tradicional do nome hebraico זְכַרְיָה, mais natural e reconhecível do que uma transliteração estrita.
- source_word: וּ/מִקְלֽוֹת
  choice: Miclote
  rationale: Adota-se a forma convencional em português, com vogal final para acomodar naturalmente o grupo consonantal hebraico.
