  yaml_path: translation/ot/1_chronicles/009/043.yaml
  text: And Moza fathered Binea[a], and his son was Rephaiah, his son Eleasah, his son Azel.
translation:
  language: pt
  text: Moza gerou Bineá[a]. Bineá foi pai de Refaías; Refaías foi pai de Eleasa, e Eleasa foi pai de Azel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente: “e Refaías, seu filho; Eleasa, seu filho; Azel, seu filho”. A tradução explicita os elos da genealogia para deixar claro que Refaías é filho de Bineá, Eleasa é filho de Refaías e Azel é filho de Eleasa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָא
  choice: Moza
  rationale: Nome próprio transliterado segundo a forma massorética, em grafia clara para leitores de língua portuguesa.
- source_word: הוֹלִיד
  choice: gerou
  rationale: No contexto genealógico, o hifil de ילד indica que alguém gerou ou se tornou pai de outro; “gerou” é conciso, corrente e preserva a força genealógica.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: Marcador hebraico de objeto direto, sem equivalente lexical independente em português.
- source_word: בִּנְעָא
  choice: Bineá
  rationale: Transliteração do nome próprio que procura refletir a vocalização massorética e indicar naturalmente a tonicidade em português.
- source_word: וּרְפָיָה בְנוֹ
  choice: seu filho foi Refaías
  rationale: O hebraico passa do verbo “gerou” para uma cadeia genealógica nominal. A cópula “foi” é suprida em português para produzir uma frase natural sem atribuí-la ao texto hebraico.
- source_word: אֶלְעָשָׂה בְנוֹ
  choice: seu filho Eleasa
  rationale: Mantém de maneira concisa a repetição da relação filial na cadeia genealógica.
- source_word: אָצֵל בְנוֹ
  choice: e seu filho Azel
  rationale: Preserva o último elo da genealogia e a relação filial expressa no hebraico.
