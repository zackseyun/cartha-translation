base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/009.yaml
  text: And their brothers[a], according to their generations, were nine hundred and fifty-six[b]. All these men were heads of fathers’ houses in their fathers’ households.
translation:
  language: pt
  text: Seus irmãos[a], segundo suas linhagens[b], eram novecentos e cinquenta e seis. Todos esses homens eram chefes de famílias em suas casas paternas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “parentes” ou “membros do mesmo clã”.
    reason: lexical_alternative
  - marker: b
    text: Ou “segundo suas genealogias”. O termo hebraico se refere às linhas de descendência ou aos registros familiares.
    reason: lexical_alternative
  - marker: c
    text: “Casas paternas” eram unidades familiares ou clânicas organizadas segundo a descendência paterna.
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: Seus irmãos
  rationale: Preserva o termo hebraico de parentesco, que neste contexto genealógico também pode designar parentes ou membros do mesmo clã.
- source_word: לְתֹלְדוֹתָם
  choice: segundo suas linhagens
  rationale: Expressa de modo natural o sentido genealógico de תּוֹלְדוֹת como linhas de descendência, sem restringi-lo necessariamente a documentos escritos.
- source_word: תְּשַׁע מֵאוֹת וַחֲמִשִּׁים וְשִׁשָּׁה
  choice: novecentos e cinquenta e seis
  rationale: Reprodução direta e idiomática do número cardinal hebraico.
- source_word: כָּל אֵלֶּה אֲנָשִׁים
  choice: Todos esses homens
  rationale: Mantém a referência masculina explícita aos integrantes e chefes genealógicos mencionados.
- source_word: רָאשֵׁי אָבוֹת
  choice: chefes de famílias
  rationale: Comunica em português corrente a função dos líderes de unidades familiares ou clânicas paternas, evitando uma tradução rígida e pouco clara.
- source_word: לְבֵית אֲבֹתֵיהֶם
  choice: em suas casas paternas
  rationale: Preserva a linguagem social e genealógica da 'casa do pai', isto é, a unidade familiar ancestral organizada pela linha paterna.
