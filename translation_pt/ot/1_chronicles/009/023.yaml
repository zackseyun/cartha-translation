source:
  edition: WLC
  text: וְ/הֵ֨ם וּ/בְנֵי/הֶ֜ם עַל הַ/שְּׁעָרִ֧ים לְ/בֵית יְהוָ֛ה לְ/בֵ֥ית הָ/אֹ֖הֶל לְ/מִשְׁמָרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/023.yaml
  text: They and their sons were over the gates of the house of Yahweh[a], that is, the house of the tent, as guards.
translation:
  language: pt
  text: Eles e seus filhos estavam encarregados das portas da casa de Yahweh, isto é, da casa da tenda[a], servindo como guardas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da casa do tabernáculo”. Em hebraico: “da casa da tenda”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵם
  choice: Eles
  rationale: O pronome com a conjunção retoma o sujeito; em português, «Eles» expressa essa retomada com naturalidade, sem exigir um «E» inicial.
- source_word: וּבְנֵיהֶם
  choice: e seus filhos
  rationale: בנים designa aqui os filhos ou descendentes homens que exerciam hereditariamente a função de porteiros.
- source_word: עַל הַשְּׁעָרִים
  choice: estavam encarregados das portas
  rationale: Neste contexto administrativo, עַל indica responsabilidade e supervisão, não apenas localização física.
- source_word: לְבֵית יְהוָה
  choice: das portas da casa de Yahweh
  rationale: A expressão liga as portas à casa de Yahweh; a formulação portuguesa explicita essa relação de modo natural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: לְבֵית הָאֹהֶל
  choice: da casa da tenda
  rationale: Preserva a expressão incomum e teologicamente significativa do hebraico, sem reduzi-la interpretativamente a «tabernáculo».
- source_word: לְמִשְׁמָרוֹת
  choice: servindo como guardas
  rationale: Comunica de forma clara a função de vigilância e guarda indicada pelo substantivo plural.
theological_decisions:
- issue: Relação entre «casa de Yahweh» e «casa da tenda»
  choice: Tratar a segunda expressão como uma designação explicativa da primeira, introduzida por «isto é».
  alternative: Entender «casa da tenda» como um lugar distinto ou vertê-la simplesmente como «tabernáculo».
  rationale: A aposição é favorecida pelo contexto e preserva a associação feita pelo Cronista entre a casa de Yahweh e o antigo santuário em forma de tenda, sem eliminar a expressão peculiar do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por clareza funcional em «encarregados» e preservação formal da expressão «casa da tenda».
