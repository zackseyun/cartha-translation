base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/031.yaml
  text: And Mattithiah[a], from the Levites, the firstborn of Shallum the Korahite[b], was entrusted with the work of the flat cakes.
translation:
  language: pt
  text: E Matitias, um dos levitas, primogênito de Salum, o coreíta, estava encarregado[a] do preparo dos pães achatados[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cumpria fielmente a responsabilidade pelo”; a expressão hebraica pode indicar tanto que Matitias recebeu um encargo de confiança como que realizava fielmente a tarefa.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico designa uma espécie de bolo ou pão assado, possivelmente preparado numa assadeira ou chapa.
    reason: cultural_note
lexical_decisions:
- source_word: וּמַתִּתְיָה
  choice: E Matitias
  rationale: O nome próprio é apresentado em sua forma portuguesa tradicional, e a conjunção dá continuidade à lista de servidores.
- source_word: מִן הַלְוִיִּם
  choice: um dos levitas
  rationale: A preposição מִן indica pertencimento ao grupo; esta formulação é natural em português e conserva esse sentido.
- source_word: הוּא הַבְּכוֹר לְשַׁלֻּם
  choice: primogênito de Salum
  rationale: בְּכוֹר designa o primeiro filho; “primogênito” preserva a expressão familiar sem explicitação desnecessária.
- source_word: הַקָּרְחִי
  choice: o coraíta
  rationale: O gentílico identifica Salum como pertencente à linhagem de Corá.
- source_word: בֶּאֱמוּנָה עַל
  choice: estava encarregado
  rationale: No contexto de atribuições administrativas, a expressão comunica uma responsabilidade confiada. A nota preserva a possibilidade de referência à maneira fiel como a tarefa era cumprida.
- source_word: מַעֲשֵׂה
  choice: preparo
  rationale: Embora o termo possa significar genericamente “trabalho” ou “obra”, neste contexto culinário “preparo” expressa com clareza a atividade indicada.
- source_word: הַחֲבִתִּים
  choice: pães achatados
  rationale: O termo se refere a uma espécie de bolo ou pão preparado em assadeira ou chapa; a tradução mantém o sentido culinário concreto sem acrescentar uma função sacrificial não expressa no versículo.
theological_decisions: []
translation_notes:
  register: 'Português atual, claro e digno, com formas onomásticas bíblicas correntes. A redação busca equivalência ótima: torna natural a atribuição administrativa e o contexto culinário, enquanto as notas preservam a ambiguidade de בֶּאֱמוּנָה e a incerteza sobre o tipo exato de pão.'
