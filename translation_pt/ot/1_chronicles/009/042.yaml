base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/042.yaml
  text: Ahaz fathered Jarah[a], and Jarah fathered Alemeth, Azmaveth, and Zimri; and Zimri fathered Moza.
translation:
  language: pt
  text: Acaz gerou Jará[a], e Jará gerou Alemete, Azmavete e Zinri; e Zinri gerou Moza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A genealogia paralela em 1 Crônicas 8:36 traz “Jeoadá” em vez de “Jará”. Os manuscritos de Crônicas neste versículo trazem “Jará”, forma mantida no texto principal.
    reason: textual_variant
lexical_decisions:
- source_word: הוֹלִיד
  choice: gerou
  rationale: No contexto genealógico, o hifil de ילד indica gerar ou tornar-se pai de alguém. “Gerou” é conciso, natural na linguagem bíblica em português e preserva o sentido genealógico masculino.
- source_word: יַעְרָה
  choice: Jará
  rationale: Nome próprio transliterado diretamente da forma hebraica deste versículo, com acentuação gráfica adequada ao português.
- source_word: עָלֶמֶת
  choice: Alemete
  rationale: Transliteração adaptada à fonologia e à ortografia do português.
- source_word: עַזְמָוֶת
  choice: Azmavete
  rationale: Transliteração adaptada ao português, preservando de modo reconhecível os elementos consonantais do nome hebraico.
- source_word: זִמְרִי
  choice: Zinri
  rationale: Forma tradicional e legível em português para o nome hebraico, com assimilação gráfica de /m/ antes de /r/ conforme o uso consagrado.
- source_word: מוֹצָא
  choice: Moza
  rationale: Nome próprio transliterado de modo simples e natural em português.
- source_word: וְ
  choice: e
  rationale: A conjunção liga aditivamente os elos da genealogia; “e” preserva com naturalidade a sequência do hebraico.
- source_word: אֶת
  choice: '[não traduzido]'
  rationale: O marcador hebraico de objeto direto não tem equivalente lexical necessário em português; sua função é expressa pela sintaxe.
