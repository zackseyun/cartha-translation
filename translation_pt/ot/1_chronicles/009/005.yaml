  text: וּ/מִן הַ/שִּׁ֣ילוֹנִ֔י עֲשָׂיָ֥ה הַ/בְּכ֖וֹר וּ/בָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/005.yaml
  text: 'And from the Shilonites: Asaiah the firstborn and his sons[a].'
translation:
  language: pt
  text: 'E dos silonitas: Asaías, o primogênito, e seus filhos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “os selonitas”, segundo uma identificação tradicional alternativa do nome deste clã.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִן
  choice: E dos
  rationale: A conjunção liga este item à lista anterior, enquanto a preposição indica procedência ou pertencimento ao grupo.
- source_word: הַ/שִּׁילוֹנִי
  choice: os silonitas
  rationale: Embora a forma hebraica seja morfologicamente singular, neste registro o gentílico tem sentido coletivo. “Silonitas” representa diretamente a forma consonantal do texto.
- source_word: עֲשָׂיָה
  choice: Asaías
  rationale: Transliteração portuguesa corrente do nome pessoal hebraico.
- source_word: הַ/בְּכֹר
  choice: o primogênito
  rationale: Preserva o sentido familiar específico de quem nasceu primeiro, em vez do sentido mais geral de “mais velho”.
- source_word: וּ/בָנָיו
  choice: e seus filhos
  rationale: O substantivo hebraico designa especificamente filhos do sexo masculino, e a conjunção mantém a estrutura aditiva da lista.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com a concisão própria de um registro genealógico. O gentílico singular hebraico foi vertido coletivamente no plural para soar natural em português.
