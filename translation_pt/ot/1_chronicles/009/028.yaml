  text: וּ/מֵ/הֶ֖ם עַל כְּלֵ֣י הָ/עֲבוֹדָ֑ה כִּֽי בְ/מִסְפָּ֣ר יְבִיא֔וּ/ם וּ/בְ/מִסְפָּ֖ר יוֹצִיאֽוּ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/028.yaml
  text: Some of them were in charge of the vessels of service[a], for they brought them in by count and took them out by count.
translation:
  language: pt
  text: Alguns deles eram responsáveis pelos utensílios usados no serviço[a], pois os traziam para dentro mediante contagem e os levavam para fora mediante contagem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os objetos usados no serviço” ou “os instrumentos usados no serviço”. O termo hebraico pode designar de modo amplo utensílios, recipientes, objetos ou instrumentos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵהֶם
  choice: Alguns deles
  rationale: A preposição מִן com o sufixo pronominal tem sentido partitivo, indicando alguns dentre o grupo mencionado anteriormente.
- source_word: עַל
  choice: eram responsáveis por
  rationale: Neste contexto administrativo, עַל indica responsabilidade ou supervisão; a formulação é natural e preserva esse sentido.
- source_word: כְּלֵי הָעֲבוֹדָה
  choice: os utensílios usados no serviço
  rationale: כְּלִי pode designar utensílio, recipiente, objeto ou instrumento, enquanto הָעֲבוֹדָה se refere aqui ao serviço do templo. A tradução mantém a amplitude básica sem recorrer a linguagem excessivamente técnica.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação da responsabilidade atribuída a esses homens.
- source_word: בְמִסְפָּר
  choice: mediante contagem
  rationale: A expressão indica controle numérico ou conferência de inventário; a repetição é mantida para ressaltar a prestação de contas.
- source_word: יְבִיאוּם
  choice: os traziam para dentro
  rationale: O hifil de בוא com sufixo de objeto significa fazer entrar ou trazer para dentro. O imperfeito descreve uma prática habitual.
- source_word: יוֹצִיאוּם
  choice: os levavam para fora
  rationale: O hifil de יצא significa fazer sair, levar ou trazer para fora; a escolha forma um paralelo claro com 'traziam para dentro'.
