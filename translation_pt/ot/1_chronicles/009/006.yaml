  yaml_path: translation/ot/1_chronicles/009/006.yaml
  text: 'And from the sons of Zerah: Jeuel and their brothers[a], six hundred and ninety.'
translation:
  language: pt
  text: 'E dos filhos de Zerá: Jeuel e os irmãos deles[a], seiscentos e noventa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Jeuel e seus irmãos, seiscentos e noventa”, se Jeuel for entendido como o chefe representativo do clã. O sufixo hebraico de “irmãos deles” está no plural, embora algumas traduções o ajustem ao singular para relacioná-lo diretamente a Jeuel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִן
  choice: E dos
  rationale: O וְ prefixado liga o versículo à lista anterior, enquanto מִן indica procedência ou pertencimento; “E dos” preserva o fluxo aditivo.
- source_word: בְּנֵי
  choice: filhos de
  rationale: É a correspondência mais direta e convencional em uma lista genealógica, sem excluir o sentido mais amplo de descendentes ou membros do clã.
- source_word: זֶרַח
  choice: Zerá
  rationale: Transliteração tradicional e legível em português do nome próprio hebraico.
- source_word: יְעוּאֵל
  choice: Jeuel
  rationale: Transliteração portuguesa clara do nome próprio hebraico.
- source_word: וַ/אֲחֵי/הֶם
  choice: e os irmãos deles
  rationale: Conserva o sufixo hebraico de terceira pessoa do plural, embora o referente plural esteja implícito no contexto do clã.
- source_word: שֵׁשׁ מֵאוֹת וְ/תִשְׁעִים
  choice: seiscentos e noventa
  rationale: Reproduz por extenso o número cardinal e se ajusta ao estilo de um registro bíblico.
