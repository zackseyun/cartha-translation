  text: וּ/מִן בְּנֵ֖י בִּנְיָמִ֑ן סַלּוּא֙ בֶּן מְשֻׁלָּ֔ם בֶּן הוֹדַוְיָ֖ה בֶּן הַ/סְּנֻאָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/007.yaml
  text: 'And from the sons of Benjamin: Sallu son of Meshullam[a], son of Hodaviah[c][b], son of Hassenuah.'
translation:
  language: pt
  text: 'E, dos filhos de Benjamim: Salu, filho de Mesulão[a], filho de Hodavias[b], filho de Hassenua.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nas genealogias hebraicas, “filho de” também pode indicar um descendente, e não necessariamente um filho direto.
    reason: cultural_note
  - marker: b
    text: O nome Hodavias aparece com grafia diferente em algumas tradições genealógicas relacionadas.
    reason: textual_variant
lexical_decisions:
- source_word: וּ/מִן
  choice: E, dos
  rationale: A conjunção liga o versículo à lista anterior, e a preposição indica que Salu pertence ao grupo mencionado.
- source_word: בְּנֵי בִּנְיָמִן
  choice: filhos de Benjamim
  rationale: Preserva a formulação genealógica hebraica, que aqui designa membros ou descendentes da tribo de Benjamim.
- source_word: סַלּוּא
  choice: Salu
  rationale: Transliteração portuguesa corrente do nome hebraico.
- source_word: בֶּן
  choice: filho de
  rationale: Reproduz a fórmula genealógica repetida no hebraico, sem excluir a possibilidade de descendência genealógica mais ampla.
- source_word: מְשֻׁלָּם
  choice: Mesulão
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio hebraico.
- source_word: הוֹדַוְיָה
  choice: Hodavias
  rationale: Segue a forma massorética presente neste versículo, em transliteração adaptada ao português.
- source_word: הַ/סְּנֻאָה
  choice: Hassenua
  rationale: Entendido como nome próprio no contexto genealógico; a grafia conserva a consoante duplicada associada ao artigo assimilado.
