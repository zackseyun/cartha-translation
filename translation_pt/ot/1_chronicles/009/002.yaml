base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/002.yaml
  text: The first inhabitants who lived in their possessions in their cities were Israel[a], the priests, the Levites, and the temple servants.
translation:
  language: pt
  text: Os primeiros habitantes que viviam em suas propriedades, nas suas cidades, foram os israelitas, os sacerdotes, os levitas e os servidores do templo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: netinim, nome tradicional de uma classe destinada ao serviço do templo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיּוֹשְׁבִים הָרִאשֹׁנִים
  choice: Os primeiros habitantes
  rationale: Mantém a referência aos primeiros moradores ou residentes, em linguagem portuguesa natural, sem introduzir um marcador temporal inexistente no hebraico.
- source_word: אֲשֶׁר בַּאֲחֻזָּתָם
  choice: a se estabelecerem em suas propriedades
  rationale: O hebraico combina uma expressão relativa elíptica com אֲחֻזָּה, uma posse ou propriedade territorial. “Estabelecerem-se” explicita de modo natural a residência implícita, e “propriedades” preserva o sentido de posses de terra sem restringi-lo indevidamente a uma noção jurídica específica de herança.
- source_word: בְּעָרֵיהֶם
  choice: nas suas cidades
  rationale: Tradução direta e idiomática de עָרִים no contexto de povoamento.
- source_word: יִשְׂרָאֵל
  choice: os israelitas
  rationale: O nome coletivo “Israel” designa aqui o povo ou seus membros como grupo, em paralelo com sacerdotes, levitas e servidores do templo. “Os israelitas” torna essa função clara em português.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Equivalente português padrão e adequado ao contexto cultual.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: Equivalente português padrão para a classe levítica, distinguida dos sacerdotes no texto.
- source_word: וְהַנְּתִינִים
  choice: e os servidores do templo[a]
  rationale: נְתִינִים designa uma classe reconhecida de pessoas destinadas ao serviço do templo. A tradução funcional é compreensível ao leitor moderno, enquanto a transliteração tradicional é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita acrescentar explicitamente “voltaram”, ideia sugerida pelo contexto histórico, mas não expressa por um verbo correspondente neste versículo. O marcador da nota foi colocado junto a “servidores do templo”, termo ao qual a alternativa lexical realmente se refere.
