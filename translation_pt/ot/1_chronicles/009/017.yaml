base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/017.yaml
  text: And the gatekeepers were Shallum[a], Akkub, Talmon, Ahiman, and their brothers; Shallum was the chief.
translation:
  language: pt
  text: Os guardas dos portões eram Salum, Acube, Talmom, Aimã e seus irmãos[a]; Salum era o chefe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «seus parentes». O hebraico diz literalmente «seus irmãos», expressão que, em listas desse tipo, também pode referir-se a membros do mesmo clã.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁעֲרִים
  choice: os guardas dos portões
  rationale: Designa os encarregados de vigiar e guardar os portões. A expressão é clara em português atual e comunica melhor a função do que o tradicional, porém menos transparente, «porteiros».
- source_word: שַׁלּוּם
  choice: Salum
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico.
- source_word: עַקּוּב
  choice: Acube
  rationale: Transliteração portuguesa corrente do nome hebraico.
- source_word: טַלְמֹן
  choice: Talmom
  rationale: Transliteração adaptada à ortografia e à pronúncia portuguesas.
- source_word: אֲחִימָן
  choice: Aimã
  rationale: Forma portuguesa tradicional do nome hebraico.
- source_word: אֲחִיהֶם
  choice: irmão deles
  rationale: A vocalização massorética está no singular, literalmente «irmão deles». O termo pode ter sentido mais amplo de parente ou membro do mesmo clã; essa possibilidade é preservada em nota.
- source_word: הָרֹאשׁ
  choice: o chefe
  rationale: Neste contexto, רֹאשׁ indica primazia ou função de liderança, não uma parte do corpo. «O chefe» é natural e preciso.
- source_word: וְ...וְ...וַ...וַ
  choice: coordenação por vírgulas e frase explicativa
  rationale: A pontuação portuguesa organiza a enumeração de modo natural. A segunda frase reproduz a informação final do hebraico sem ocultar a repetição do nome Salum.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com nomes em formas portuguesas reconhecíveis. A redação segue de perto o texto hebraico massorético, inclusive sua repetição de Salum, e evita suavizar a forma singular de אֲחִיהֶם para um plural não expresso na vocalização.
