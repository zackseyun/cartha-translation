  text: and Bakbakkar[a], Heresh, and Galal, and Mattaniah son of Mica, son of Zichri[b], son of Asaph.
translation:
  language: pt
  text: e Baquebacar, Heres e Galal, e Matanias, filho[a] de Mica[b], filho de Zicri, filho de Asafe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “filho” também pode designar um descendente mais remoto; aqui, o termo foi mantido literalmente na cadeia genealógica.
