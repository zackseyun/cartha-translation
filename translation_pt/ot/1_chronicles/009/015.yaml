    text: “Mica” reproduz a forma hebraica do nome encontrada neste versículo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַקְבַּקַּר
  choice: e Bacbacar
  rationale: O וּ inicial dá continuidade à lista anterior e é traduzido por “e”; o nome é transliterado segundo a forma bíblica corrente em português.
- source_word: חֶרֶשׁ
  choice: Heres
  rationale: Transliteração clara do nome hebraico, sem acrescentar sentido lexical ao nome próprio.
- source_word: וְ/גָלָל
  choice: e Galal
  rationale: Mantém a conjunção hebraica e translitera o nome próprio.
- source_word: וּ/מַתַּנְיָה
  choice: e Matanias
  rationale: Preserva a conjunção que estrutura a enumeração e emprega a forma portuguesa tradicional do nome.
- source_word: בֶּן
  choice: filho de
  rationale: É o sentido direto de בֶּן nesta cadeia genealógica, embora o termo também possa indicar um descendente mais remoto.
- source_word: מִיכָא
  choice: Mica
  rationale: Representa a forma hebraica específica מִיכָא e a distingue de formas hebraicas próximas.
- source_word: זִכְרִי
  choice: Zicri
  rationale: Forma transliterada natural em português, preservando a identidade do nome próprio.
- source_word: אָסָף
  choice: Asafe
  rationale: Forma bíblica tradicional e amplamente reconhecida em português.
