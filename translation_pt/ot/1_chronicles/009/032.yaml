  text: וּ/מִן בְּנֵ֧י הַ/קְּהָתִ֛י מִן אֲחֵי/הֶ֖ם עַל לֶ֣חֶם הַֽ/מַּעֲרָ֑כֶת לְ/הָכִ֖ין שַׁבַּ֥ת שַׁבָּֽת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/032.yaml
  text: And some of the sons of the Kohathites[a], from among their brothers, were in charge of the bread of the arrangement, to prepare it Sabbath by Sabbath.
translation:
  language: pt
  text: Alguns dos filhos dos coatitas, dentre seus irmãos, eram responsáveis pelo pão disposto em ordem[a], para prepará-lo sábado após sábado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “os pães da proposição” ou “os pães da Presença”. O hebraico se refere literalmente ao pão arranjado ou disposto em ordem.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: Alguns dos
  rationale: A combinação da conjunção com a preposição tem sentido partitivo no contexto; em português, “alguns dos” comunica naturalmente que se trata de uma parte do grupo levítico mencionado.
- source_word: בְּנֵי הַקְּהָתִי
  choice: filhos dos coatitas
  rationale: Preserva a expressão familiar e clânica do hebraico, identificando membros do clã de Coate sem substituir a imagem por uma paráfrase completa.
- source_word: מִן אֲחֵיהֶם
  choice: dentre seus irmãos
  rationale: Mantém o segundo מִן com valor partitivo e traduz אֲחֵיהֶם diretamente, sem decidir de modo explícito se “irmãos” designa apenas os coatitas ou, de forma mais ampla, seus companheiros levitas.
- source_word: עַל
  choice: eram responsáveis por
  rationale: No contexto de atribuições administrativas e cultuais, a preposição indica responsabilidade ou encargo; a formulação é clara e corrente em português.
- source_word: לֶחֶם הַמַּעֲרָכֶת
  choice: o pão disposto em ordem
  rationale: Expressa o sentido concreto de pão arranjado ou colocado ordenadamente, evitando o termo tradicional pouco transparente “pães da proposição” e sem acrescentar “presença”, palavra que não aparece nesta expressão hebraica.
- source_word: לְהָכִין
  choice: para prepará-lo
  rationale: O infinitivo indica a finalidade do encargo. O pronome retoma explicitamente “o pão”, objeto implícito no hebraico.
- source_word: שַׁבַּת שַׁבָּת
  choice: sábado após sábado
  rationale: A repetição do substantivo tem valor distributivo e indica uma ação realizada a cada sábado; a formulação conserva esse ritmo reiterativo em português natural.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva a linguagem clânica (“filhos”, “irmãos”) e o caráter distributivo de “sábado após sábado”, enquanto esclarece de modo natural a atribuição cultual.
