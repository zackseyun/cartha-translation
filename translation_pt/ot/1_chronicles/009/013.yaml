  text: וַ/אֲחֵי/הֶ֗ם רָאשִׁים֙ לְ/בֵ֣ית אֲבוֹתָ֔/ם אֶ֕לֶף וּ/שְׁבַ֥ע מֵא֖וֹת וְ/שִׁשִּׁ֑ים גִּבּ֣וֹרֵי חֵ֔יל מְלֶ֖אכֶת עֲבוֹדַ֥ת בֵּית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/013.yaml
  text: And their brothers[a], heads of their fathers’ houses[c][b], were 1,760 mighty men of valor for the work of the service of the house of God.
translation:
  language: pt
  text: Seus irmãos[a], chefes de suas casas paternas, eram 1.760 homens capazes[b] de realizar o trabalho do serviço da casa de Deus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “parentes”. O termo hebraico traduzido como “irmãos” também pode designar membros do mesmo clã, e não apenas irmãos biológicos.
    reason: lexical_alternative
  - marker: b
    text: Ou “homens valentes” ou “homens de valor”. A expressão hebraica indica força, valor ou capacidade comprovada; neste contexto, não se refere necessariamente à habilidade militar.
    reason: lexical_alternative
  - marker: c
    text: Isto é, o templo.
    reason: clarification
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: Seus irmãos
  rationale: Mantém a linguagem de parentesco do hebraico, que pode indicar irmãos em sentido estrito ou membros do mesmo clã; a nota registra essa amplitude.
- source_word: רָאשִׁים לְבֵית אֲבוֹתָם
  choice: chefes de suas casas paternas
  rationale: Preserva a expressão genealógica e administrativa hebraica, referente às unidades familiares ancestrais, sem reduzi-la simplesmente a “famílias”.
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת וְשִׁשִּׁים
  choice: '1.760'
  rationale: Representa em formato numérico português o total expresso diretamente pela sequência cardinal hebraica.
- source_word: גִּבּוֹרֵי חֵיל
  choice: homens capazes
  rationale: No contexto do serviço do templo, destaca força, competência e aptidão comprovada sem restringir a expressão à valentia militar.
- source_word: מְלֶאכֶת עֲבוֹדַת
  choice: realizar o trabalho do serviço
  rationale: Conserva os dois elementos da construção hebraica — trabalho e serviço — em uma formulação portuguesa compreensível.
- source_word: בֵּית הָאֱלֹהִים
  choice: casa de Deus
  rationale: Reproduz a expressão hebraica e sua ressonância própria; neste contexto, ela designa o templo.
theological_decisions:
- issue: Amplitude da linguagem masculina de parentesco
  choice: irmãos
  alternative: parentes; membros do mesmo clã
  rationale: O referente é um grupo masculino no contexto sacerdotal e genealógico. “Irmãos” conserva a forma do hebraico, enquanto a nota evita limitá-la necessariamente a irmãos biológicos.
- issue: Sentido de גִּבּוֹרֵי חֵיל no serviço sagrado
  choice: homens capazes
  alternative: homens valentes; homens de valor
  rationale: A expressão pode indicar força, valor ou capacidade comprovada. Como o contexto é o trabalho na casa de Deus, “capazes” evita introduzir um sentido exclusivamente militar, sem ocultar as alternativas.
- issue: Terminologia referente ao santuário
  choice: casa de Deus
  alternative: templo de Deus
  rationale: A tradução mantém a designação usada no texto hebraico, enquanto a nota esclarece seu referente histórico sem substituir a imagem original.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação mantém os principais termos institucionais e a imagem hebraica “casa de Deus”, usando “homens capazes” para comunicar naturalmente a força honorífica da expressão no contexto não militar.
