  yaml_path: translation/ot/1_chronicles/009/041.yaml
  text: 'And the sons of Micah: Pithon, Melech, and Tahrea.'
translation:
  language: pt
  text: 'E os filhos de Mica: Pitom, Meleque e Tareia.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: E os filhos de
  rationale: O ו conjuntivo liga esta linha à genealogia anterior, e o plural construto de בֵּן introduz os descendentes nomeados. A formulação preserva a estrutura genealógica de Crônicas em português natural.
- source_word: מִיכָה
  choice: Mica
  rationale: Nome próprio transliterado segundo a forma tradicional e reconhecível em português.
- source_word: פִּיתוֹן
  choice: Pitom
  rationale: Transliteração portuguesa do nome próprio hebraico, com -m final para representar naturalmente o נ final nesta tradição de nomes bíblicos.
- source_word: וָמֶלֶךְ
  choice: Meleque
  rationale: Nome próprio transliterado em forma legível em português. A conjunção prefixada não é repetida, pois a enumeração portuguesa emprega normalmente a conjunção apenas antes do último item.
- source_word: וְתַחְרֵעַ
  choice: e Tareia
  rationale: O nome próprio é transliterado como Tareia, e a conjunção hebraica é expressa por “e” antes do último nome, conforme o uso natural do português.
