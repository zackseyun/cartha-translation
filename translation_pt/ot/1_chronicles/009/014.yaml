  text: וּ/מִֽן הַ/לְוִיִּ֑ם שְׁמַֽעְיָ֧ה בֶן חַשּׁ֛וּב בֶּן עַזְרִיקָ֥ם בֶּן חֲשַׁבְיָ֖ה מִן בְּנֵ֥י מְרָרִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/014.yaml
  text: 'And from the Levites: Shemaiah son of Hasshub[a], son of Azrikam, son of Hashabiah, from the sons of Merari.'
translation:
  language: pt
  text: 'E dos levitas: Semaías, filho de Hassube, filho de Azricão, filho de Hasabias, dos filhos de Merari[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «dos descendentes de Merari». A expressão hebraica «filhos de» pode designar uma linhagem ou clã mais amplo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: E dos
  rationale: A conjunção וּ mantém a ligação aditiva com a lista anterior, e מִן introduz o grupo do qual Semaías fazia parte.
- source_word: הַלְוִיִּם
  choice: levitas
  rationale: Designação consagrada e natural em português para os membros da tribo de Levi.
- source_word: שְׁמַעְיָה
  choice: Semaías
  rationale: Forma portuguesa bíblica tradicional e reconhecível do nome hebraico.
- source_word: בֶן
  choice: filho de
  rationale: Na cadeia genealógica, a expressão indica naturalmente filiação, sem excluir que genealogias hebraicas possam ocasionalmente omitir gerações.
- source_word: חַשּׁוּב
  choice: Hassube
  rationale: Transliteração adaptada à leitura em português, preservando a consoante enfática/dobrada indicada pelo hebraico.
- source_word: עַזְרִיקָם
  choice: Azricão
  rationale: Forma aportuguesada e corrente do nome próprio hebraico.
- source_word: חֲשַׁבְיָה
  choice: Hasabias
  rationale: Forma aportuguesada, reconhecível e adequada ao registro bíblico.
- source_word: מִן בְּנֵי מְרָרִי
  choice: dos descendentes de Merari
  rationale: Aqui בְּנֵי identifica uma linhagem ou clã levítico; “descendentes” comunica esse sentido com mais naturalidade e precisão em português do que o literal “filhos”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com nomes próprios em formas bíblicas aportuguesadas. A sintaxe nominal concisa preserva o caráter de lista genealógica do hebraico.
