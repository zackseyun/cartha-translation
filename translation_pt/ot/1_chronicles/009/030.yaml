base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/030.yaml
  text: And some of the sons of the priests were compounders of the ointment of spices[a].
translation:
  language: pt
  text: E alguns dos filhos dos sacerdotes preparavam a mistura de especiarias[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: preparavam a mistura perfumada para as substâncias aromáticas.'
    reason: A construção hebraica pode descrever uma mistura feita de especiarias aromáticas ou uma preparação destinada a elas.
lexical_decisions:
- source_word: וּמִן
  choice: E alguns dos
  rationale: 'A combinação da conjunção com a preposição tem sentido partitivo: dentre o grupo mencionado, alguns exerciam essa função. A formulação é natural em português e mantém a ligação com o contexto.'
- source_word: בְּנֵי הַכֹּהֲנִים
  choice: filhos dos sacerdotes
  rationale: Preserva a expressão familiar e genealógica de Crônicas. No contexto, pode abranger membros das famílias sacerdotais, mas não é necessário explicitar essa extensão no texto.
- source_word: רֹקְחֵי
  choice: preparavam
  rationale: O particípio designa os que compunham ou misturavam uma preparação aromática. O verbo 'preparavam' comunica claramente a função sem recorrer a termos técnicos ou arcaicos.
- source_word: הַמִּרְקַחַת
  choice: a mistura
  rationale: O substantivo se refere a uma preparação composta, possivelmente um unguento ou perfume. 'Mistura' preserva a amplitude lexical e evita definir indevidamente sua consistência.
- source_word: לַבְּשָׂמִים
  choice: de especiarias
  rationale: בְּשָׂמִים são substâncias aromáticas. Em português, 'mistura de especiarias' expressa com naturalidade a relação entre a preparação e seus ingredientes aromáticos; a possível leitura de finalidade é registrada na nota.
