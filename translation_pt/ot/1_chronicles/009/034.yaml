  text: אֵלֶּה֩ רָאשֵׁ֨י הָ/אָב֧וֹת לַ/לְוִיִּ֛ם לְ/תֹלְדוֹתָ֖/ם רָאשִׁ֑ים אֵ֖לֶּה יָשְׁב֥וּ בִ/ירוּשָׁלִָֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/034.yaml
  text: These were the heads of the fathers’ houses of the Levites[a], according to their generations, heads[b]. These lived in Jerusalem.
translation:
  language: pt
  text: Estes eram os chefes das casas paternas dos levitas, segundo as suas gerações — os chefes. Eles moravam em Jerusalém.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאשֵׁי הָאָבוֹת
  choice: chefes das casas paternas
  rationale: A expressão designa os responsáveis pelas unidades familiares ou clânicas ancestrais. A tradução conserva a estrutura social do hebraico sem reduzi-la a famílias nucleares.
- source_word: לַלְוִיִּם
  choice: dos levitas
  rationale: O לְ indica aqui relação ou pertencimento; em português, “dos levitas” identifica naturalmente essas casas paternas como levíticas.
- source_word: לְתֹלְדוֹתָם
  choice: segundo as suas gerações
  rationale: Mantém o sentido genealógico formal de תּוֹלְדוֹת, referente às linhas de descendência, sem pressupor explicitamente registros escritos.
- source_word: רָאשִׁים
  choice: os chefes
  rationale: Preserva a repetição enfática da raiz רֹאשׁ presente no hebraico. O travessão torna a aposição compreensível em português.
- source_word: יָשְׁבוּ
  choice: moravam
  rationale: Neste contexto, o verbo indica residência habitual. “Moravam” é natural e atual, sem a conotação de processo que “estabeleceram-se” poderia sugerir.
- source_word: בִירוּשָׁלִָם
  choice: em Jerusalém
  rationale: Tradução locativa direta do nome do lugar.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Conservou-se a repetição enfática “chefes... os chefes” do hebraico, enquanto “casas paternas” mantém o sentido técnico de unidades ancestrais ou clânicas. O pronome “Eles” retoma os chefes mencionados e evita a rigidez de “Estes” na segunda frase.
