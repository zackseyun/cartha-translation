  text: Uthai son of Ammihud[a], son of Omri, son of Imri, son of Bani, from the sons of Perez son of Judah.
translation:
  language: pt
  text: Utai, filho de Amiúde, filho de Onri, filho de Inri, filho de Bani,[a] dos descendentes de Perez, filho de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tradição textual hebraica neste ponto é difícil. A palavra traduzida como “Bani” também pode ser lida como “dos”, resultando em: “filho de Inri, dos descendentes de Perez, filho de Judá”. O texto principal adota a leitura como nome genealógico porque ela se encaixa melhor na sequência de nomes.'
    reason: textual_variant
lexical_decisions:
- source_word: עוּתַי
  choice: Utai
  rationale: Nome pessoal transliterado em forma natural e corrente em português.
- source_word: בֶּן
  choice: filho de
  rationale: Preserva a forma genealógica direta do hebraico; como em outras genealogias bíblicas, a expressão também pode abranger uma linhagem com gerações omitidas.
- source_word: עַמִּיהוּד
  choice: Amiúde
  rationale: Transliteração portuguesa tradicional e legível do nome pessoal.
- source_word: עָמְרִי
  choice: Onri
  rationale: Forma portuguesa convencional do nome pessoal, distinguindo-o de אִמְרִי.
- source_word: אִמְרִי
  choice: Inri
  rationale: Transliteração portuguesa que representa o nome e o distingue de Onri.
- source_word: בני/מן
  choice: Bani
  rationale: A forma textual transmitida é difícil. A leitura como nome próprio se encaixa na sequência genealógica e é mantida no texto principal, sem ocultar a alternativa indicada em nota.
- source_word: בְּנֵי
  choice: os descendentes de
  rationale: Neste contexto de identidade de clã, comunica naturalmente o sentido genealógico do plural construto, sem sugerir apenas filhos imediatos.
- source_word: פֶרֶץ
  choice: Perez
  rationale: Forma convencional do nome pessoal em português.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma portuguesa convencional; aqui identifica Perez dentro da linhagem de Judá.
