base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/035.yaml
  text: In Gibeon lived Jeiel the father of Gibeon[b][a], and his wife's name was Maacah.
translation:
  language: pt
  text: Em Gibeão morava Jeiel[b], pai de Gibeão[a], e o nome de sua mulher era Maaca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «fundador de Gibeão» ou «chefe de Gibeão»; em hebraico, literalmente, «pai de Gibeão».
    reason: lexical_alternative
  - marker: b
    text: O nome também pode ser representado como «Jeuel»; compare o texto paralelo em 1 Crônicas 8:29.
    reason: textual_variant
lexical_decisions:
- source_word: וּ/בְ/גִבְע֛וֹן
  choice: Em Gibeão
  rationale: A combinação da conjunção com a preposição significa literalmente «e em Gibeão». No início desta frase, «Em Gibeão» expressa naturalmente o valor locativo; a conjunção pode ficar implícita.
- source_word: יָשְׁב֥וּ
  choice: morava
  rationale: O verbo ישב indica residência neste contexto. Embora a forma hebraica seja plural, a fórmula genealógica introduz Jeiel como o residente nomeado; o singular produz uma frase natural em português.
- source_word: אֲבִֽי גִבְע֖וֹן
  choice: pai de Gibeão
  rationale: A expressão construta significa literalmente «pai de Gibeão». Como pode designar o fundador, ancestral ou chefe associado à cidade ou ao clã, a tradução literal fica no texto e as possibilidades contextuais aparecem em nota.
- source_word: יעואל
  choice: Jeiel
  rationale: A tradição de leitura e o paralelo de 1 Crônicas 8:29 favorecem a forma Jeiel. A grafia consonantal presente pode também ser representada como Jeuel, preservada em nota.
- source_word: וְ/שֵׁ֥ם אִשְׁתּ֖/וֹ
  choice: e o nome de sua mulher era
  rationale: Tradução direta e digna da expressão nominal, preservando explicitamente a relação possessiva.
- source_word: מַעֲכָֽה
  choice: Maaca
  rationale: Forma tradicional e amplamente reconhecível em português para este nome próprio.
