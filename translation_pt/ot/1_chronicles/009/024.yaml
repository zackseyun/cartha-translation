  text: לְ/אַרְבַּ֣ע רוּח֔וֹת יִהְי֖וּ הַ/שֹּׁעֲרִ֑ים מִזְרָ֥ח יָ֖מָּ/ה צָפ֥וֹנָ/ה וָ/נֶֽגְבָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/024.yaml
  text: 'The gatekeepers were at the four directions: east[a], west, north, and south.'
translation:
  language: pt
  text: 'Os guardas dos portões estavam nas quatro direções[a]: a leste, a oeste, ao norte e ao sul.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “aos quatro ventos”; aqui, “ventos” indica as quatro direções ou os quatro pontos cardeais.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַרְבַּע רוּחוֹת
  choice: nas quatro direções
  rationale: A expressão significa literalmente “aos quatro ventos”, mas, neste contexto espacial e diante da enumeração dos pontos cardeais, refere-se às quatro direções. A preposição לְ indica aqui a distribuição dos guardas por esses locais.
- source_word: יִהְיוּ
  choice: ficavam
  rationale: O verbo expressa a localização dos guardas no arranjo descrito. “Ficavam” preserva essa ideia sem acrescentar explicitamente que foram designados ou posicionados.
- source_word: הַשֹּׁעֲרִים
  choice: os guardas dos portões
  rationale: O substantivo designa os responsáveis por guardar ou cuidar dos portões. Esta formulação é mais clara no português corrente do que “porteiros” no contexto do templo.
- source_word: מִזְרָח יָמָּה צָפוֹנָה וָנֶגְבָּה
  choice: a leste, a oeste, ao norte e ao sul
  rationale: As formas direcionais enumeram os quatro pontos cardeais. Embora יָמָּה seja literalmente “em direção ao mar” e נֶגְבָּה possa aludir ao Neguebe, nesta lista ambas funcionam como indicações de oeste e sul.
