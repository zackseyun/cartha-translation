  text: וְ/נֵר֙ הוֹלִ֣יד אֶת קִ֔ישׁ וְ/קִ֖ישׁ הוֹלִ֣יד אֶת שָׁא֑וּל וְ/שָׁא֗וּל הוֹלִ֤יד אֶת יְהֽוֹנָתָן֙ וְ/אֶת מַלְכִּי שׁ֔וּעַ וְ/אֶת אֲבִינָדָ֖ב וְ/אֶת אֶשְׁבָּֽעַל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/039.yaml
  text: Ner fathered Kish[a], and Kish fathered Saul, and Saul fathered Jonathan, Malchi-shua, Abinadab, and Eshbaal.
translation:
  language: pt
  text: Ner gerou Quis, Quis gerou Saul, e Saul gerou Jônatas, Malquisua, Abinadabe e Esbaal[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Esbaal é chamado Isbosete em 2 Samuel 2:8 e em passagens relacionadas.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹלִיד
  choice: gerou
  rationale: No contexto genealógico, o hifil de ילד indica gerar ou tornar-se pai de alguém. “Gerou” é conciso, natural no registro bíblico em português e preserva a relação genealógica sem ampliar o sentido.
- source_word: נֵר
  choice: Ner
  rationale: Nome próprio transliterado em forma corrente e transparente em português.
- source_word: קִישׁ
  choice: Quis
  rationale: Forma tradicional e reconhecível do nome em português.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Forma portuguesa tradicional e amplamente reconhecida.
- source_word: יְהוֹנָתָן
  choice: Jônatas
  rationale: Forma portuguesa tradicional e amplamente reconhecida.
- source_word: מַלְכִּי שׁוּעַ
  choice: Malquisua
  rationale: O hebraico apresenta dois elementos que funcionam juntos como um único nome pessoal; a forma unida é natural em português e acompanha o uso bíblico corrente.
- source_word: אֲבִינָדָב
  choice: Abinadabe
  rationale: Forma tradicional do nome em português, adequada à leitura brasileira e internacional.
- source_word: אֶשְׁבָּעַל
  choice: Esbaal
  rationale: Segue diretamente a forma do texto hebraico de Crônicas, sem harmonizá-la com Isbosete, nome usado em Samuel.
- source_word: וְ
  choice: e
  rationale: As conjunções coordenam a sequência genealógica; foram reproduzidas onde soam naturais em português, sem repetição mecânica.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: Marcador hebraico de objeto direto, sem equivalente lexical independente em português; sua função é expressa pela sintaxe.
theological_decisions:
- issue: Relação entre Esbaal em Crônicas e Isbosete em Samuel
  choice: Manter “Esbaal” no texto e registrar “Isbosete” em nota
  alternative: Substituir no texto por “Isbosete”
  rationale: O texto massorético de 1 Crônicas traz אֶשְׁבָּעַל. Preservar essa forma respeita a evidência fonte e evita harmonização silenciosa, enquanto a nota ajuda o leitor a identificar a mesma personagem nas narrativas de Samuel.
translation_notes:
  register: Português moderno, claro e digno, com formas tradicionais dos nomes próprios e estrutura concisa apropriada a uma genealogia. O marcador [a] foi colocado após “Quis” para corresponder ao material fornecido, embora a nota trate de Esbaal.
