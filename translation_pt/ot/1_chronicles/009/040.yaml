  yaml_path: translation/ot/1_chronicles/009/040.yaml
  text: And the son of Jehonathan was Merib-baal[b][a], and Merib-baal fathered Micah.
translation:
  language: pt
  text: E o filho de Jeonatã foi Meribe-Baal[b][a]; e Meribe-Baal gerou Mica.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em hebraico, o nome do pai aparece neste versículo em duas formas ligeiramente diferentes: “Meribe-Baal” e uma forma abreviada, “Meri-Baal”. A tradução uniformiza o nome para maior clareza.'
    reason: textual_variant
  - marker: b
    text: Em 1 Samuel 14:49, o filho de Saul é chamado de “Jônatas”, e não de “Jeonatã”. Aqui, a forma hebraica usada pelo Cronista é “Jeonatã”.
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בֶן
  choice: E o filho de
  rationale: בֶן significa “filho”; o ו prefixado foi traduzido por “E” para preservar a ligação genealógica com o versículo anterior.
- source_word: יְהוֹנָתָן
  choice: Jeonatã
  rationale: Translitera a forma hebraica específica usada pelo Cronista, sem a normalizar para a forma mais conhecida “Jônatas”.
- source_word: מְרִיב בָּעַל
  choice: Meribe-Baal
  rationale: Nome próprio composto, transliterado em forma clara e corrente em português, com hífen para refletir seus dois elementos.
- source_word: וּ/מְרִי בַעַל
  choice: e Meribe-Baal
  rationale: A segunda ocorrência apresenta uma forma hebraica ligeiramente abreviada do mesmo nome; o texto a regulariza para clareza, preservando a diferença em nota.
- source_word: הוֹלִיד
  choice: gerou
  rationale: No contexto genealógico, o hifil de ילד indica que alguém se tornou pai de outro; “gerou” é conciso, digno e natural na linguagem bíblica portuguesa.
- source_word: אֶת מִיכָה
  choice: Mica
  rationale: אֶת é o marcador do objeto direto e não recebe tradução própria; מִיכָה é vertido pela forma portuguesa tradicional “Mica”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém a ligação narrativa por meio de “E”, conserva a forma onomástica própria de Crônicas e usa “gerou” como fórmula genealógica concisa. Todos os marcadores de nota constam no texto principal.
