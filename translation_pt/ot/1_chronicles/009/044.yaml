base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/044.yaml
  text: 'Azel had six sons[a], and these were their names: Azrikam his firstborn, Ishmael, Sheariah, Obadiah, and Hanan[b]. These were the sons of Azel.'
translation:
  language: pt
  text: 'Azel teve seis filhos[a], cujos nomes eram: Azricão, seu primogênito[b], Ismael, Searias, Obadias e Hanã. Esses foram os filhos de Azel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: «E a Azel, seis filhos». O texto hebraico emprega uma fórmula genealógica concisa.'
    reason: lexical_alternative
  - marker: b
    text: No hebraico, «seu primogênito» identifica Azricão como o filho primogênito de Azel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאָצֵל
  choice: Azel teve
  rationale: A preposição לְ na fórmula genealógica indica posse ou descendência; «Azel teve» expressa isso de modo natural em português.
- source_word: שִׁשָּׁה בָנִים
  choice: seis filhos
  rationale: בָנִים designa especificamente filhos do sexo masculino.
- source_word: וְאֵלֶּה שְׁמוֹתָם
  choice: cujos nomes eram
  rationale: Forma corrente e clara de introduzir a lista, preservando a referência plural aos seis filhos.
- source_word: עַזְרִיקָם בֹּכְרוּ
  choice: Azricão, seu primogênito
  rationale: בֹּכְרוּ identifica Azricão como o primogênito de Azel; a vírgula evita incorporar o título ao nome.
- source_word: יִשְׁמָעֵאל
  choice: Ismael
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: שְׁעַרְיָה
  choice: Searias
  rationale: Forma portuguesa consagrada para o nome hebraico, adequada à legibilidade bíblica moderna.
- source_word: עֹבַדְיָה
  choice: Obadias
  rationale: Forma tradicional portuguesa do nome.
- source_word: חָנָן
  choice: Hanã
  rationale: Transliteração portuguesa que representa adequadamente o nome hebraico e o distingue de nomes aparentados.
- source_word: אֵלֶּה בְּנֵי אָצַל
  choice: Esses foram os filhos de Azel
  rationale: Preserva a fórmula genealógica conclusiva e repete o nome para manter a clareza do hebraico.
