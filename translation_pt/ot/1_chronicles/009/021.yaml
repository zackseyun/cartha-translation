base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/021.yaml
  text: Zechariah son of Meshelemiah was gatekeeper at the entrance to the tent of meeting[a].
translation:
  language: pt
  text: Zacarias, filho de Meselemias, era porteiro à entrada da tenda do encontro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «guardião da porta da tenda do encontro».'
    reason: Alternativa lexical para «porteiro» e «entrada»; preserva a função de שֹׁעֵר e a possibilidade de traduzir פֶּתַח por «porta».
lexical_decisions:
- source_word: זְכַרְיָה
  choice: Zacarias
  rationale: Forma tradicional e amplamente reconhecida em português para o nome hebraico.
- source_word: בֶּן
  choice: filho de
  rationale: O contexto genealógico favorece o sentido filial comum, e não o sentido mais amplo de descendente.
- source_word: מְשֶׁלֶמְיָה
  choice: Meselemias
  rationale: Transliteração portuguesa tradicional do nome próprio hebraico.
- source_word: שֹׁעֵר
  choice: porteiro
  rationale: Designa o responsável por guardar ou controlar uma entrada; «porteiro» é natural em português e adequado ao contexto do santuário.
- source_word: פֶּתַח
  choice: entrada
  rationale: Expressa de modo claro e corrente a abertura ou o acesso indicado pelo hebraico.
- source_word: לְאֹהֶל
  choice: da tenda
  rationale: A preposição hebraica estabelece aqui a relação entre a entrada e a tenda; «entrada da tenda» é idiomático em português.
- source_word: מוֹעֵד
  choice: encontro
  rationale: Na expressão fixa אֹהֶל מוֹעֵד, preserva a ideia de encontro marcado entre Deus e seu povo sem recorrer ao termo interpretativo «tabernáculo».
- source_word: אֹהֶל מוֹעֵד
  choice: tenda do encontro
  rationale: Tradução transparente da designação hebraica do santuário, clara para leitores modernos e próxima da forma do original.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com nomes bíblicos em formas portuguesas reconhecíveis. A tradução mantém a designação concreta «tenda do encontro» e evita substituir o hebraico pelo termo mais interpretativo «tabernáculo».
