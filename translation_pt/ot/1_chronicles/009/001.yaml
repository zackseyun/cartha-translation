  to: Assim, todo o Israel foi registrado genealogicamente[a]; e eis que estão inscritos no Livro dos Reis de Israel; e Judá foi levado para o exílio para a Babilônia por causa de sua infidelidade[b].
  rationale: A revisão substitui a expressão locativa “na Babilônia” pela expressão direcional “para a Babilônia”, em conformidade com לְבָבֶל. Também elimina um pronome desnecessário e restabelece a coordenação explícita da cláusula relativa a Judá. As demais opções preservam com fidelidade o sentido do hebraico e são naturais em português moderno.
