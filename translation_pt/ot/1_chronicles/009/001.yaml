  text: וְ/כָל יִשְׂרָאֵל֙ הִתְיַחְשׂ֔וּ וְ/הִנָּ֣/ם כְּתוּבִ֔ים עַל סֵ֖פֶר מַלְכֵ֣י יִשְׂרָאֵ֑ל וִ/יהוּדָ֛ה הָגְל֥וּ לְ/בָבֶ֖ל בְּ/מַעֲלָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/001.yaml
  text: So all Israel was enrolled by genealogy[a], and behold, they are written in the Book of the Kings of Israel[b]; and Judah was taken into exile to Babylon because of their unfaithfulness.
translation:
  language: pt
  text: Assim, todo o Israel foi registrado genealogicamente[a]; e eis que estão inscritos no Livro dos Reis de Israel; e Judá foi levado para o exílio para a Babilônia por causa de sua infidelidade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foi contado segundo as genealogias” ou “foi registrado nas genealogias”.
    reason: lexical_alternative
  - marker: b
    text: Ou “por causa de sua traição” ou “por causa de sua quebra de fidelidade”. O termo hebraico pode indicar violação da fidelidade devida, especialmente a Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְיַחְשׂוּ
  choice: foi registrado segundo as genealogias
  rationale: O hitpael de יחס indica apuração ou registro de linhagem, não mera contagem. A formulação preserva o sentido genealógico-administrativo em português claro.
- source_word: וְהִנָּם
  choice: e eis que eles
  rationale: Mantém a força apresentativa e enfática do marcador hebraico, com o pronome plural explicitando que se refere aos israelitas registrados.
- source_word: כְּתוּבִים
  choice: estão inscritos
  rationale: O particípio passivo tem valor de estado resultante. “Estão inscritos” é idiomático e conserva a ideia de nomes presentes em um registro.
- source_word: עַל סֵפֶר
  choice: no Livro
  rationale: Embora עַל possa significar literalmente “sobre”, em contexto documental a expressão idiomática portuguesa é “no livro”.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: dos Reis de Israel
  rationale: A capitalização apresenta a expressão como título de uma fonte documental identificável, sem fazer afirmação adicional sobre sua natureza.
- source_word: וִיהוּדָה
  choice: Judá
  rationale: O nome designa coletivamente o reino ou povo de Judá. A transição para a nova oração é marcada pelo ponto, evitando uma coordenação pesada em português.
- source_word: הָגְלוּ
  choice: foi levado para o exílio
  rationale: A forma hofal expressa que Judá sofreu a deportação. A construção passiva preserva isso e concorda naturalmente com o nome coletivo singular.
- source_word: לְבָבֶל
  choice: na Babilônia
  rationale: Com “levado para o exílio”, a formulação indica Babilônia como destino e lugar do exílio de modo natural em português.
- source_word: בְּמַעֲלָם
  choice: por causa de sua infidelidade
  rationale: מַעַל denota quebra de fidelidade ou traição, muitas vezes em contexto de aliança. “Infidelidade” comunica essa dimensão sem explicitar além do texto.
theological_decisions:
- issue: Natureza da falta expressa por בְּמַעֲלָם
  choice: infidelidade
  alternative: transgressão; culpa; traição
  rationale: “Infidelidade” preserva a noção de quebra de lealdade, frequentemente pactual, sem reduzir o termo a uma infração genérica nem inserir explicação doutrinária.
- issue: Voz de הָגְלוּ
  choice: Judá foi levado para o exílio
  alternative: Judá foi para o exílio
  rationale: A forma causativo-passiva indica que Judá foi submetido à deportação, e não que partiu por iniciativa própria.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “E eis que” conserva deliberadamente a ênfase do hebraico, enquanto “estão inscritos” e “foi levado para o exílio” evitam construções excessivamente literais. O marcador [b] foi colocado junto de “infidelidade”, termo ao qual sua nota efetivamente se refere.
