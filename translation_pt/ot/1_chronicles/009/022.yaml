  text: כֻּלָּ֤/ם הַ/בְּרוּרִים֙ לְ/שֹׁעֲרִ֣ים בַּ/סִּפִּ֔ים מָאתַ֖יִם וּ/שְׁנֵ֣ים עָשָׂ֑ר הֵ֤מָּה בְ/חַצְרֵי/הֶם֙ הִתְיַחְשָׂ֔/ם הֵ֣מָּה יִסַּ֥ד דָּוִ֛יד וּ/שְׁמוּאֵ֥ל הָ/רֹאֶ֖ה בֶּ/אֱמוּנָתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/022.yaml
  text: All these who were chosen as gatekeepers at the thresholds were two hundred and twelve[a]. They were enrolled by genealogy in their villages. David and Samuel the seer established them in their office of trust.
translation:
  language: pt
  text: Todos os que foram escolhidos como guardas dos portões, junto às soleiras, eram duzentos e doze. Eles foram registrados genealogicamente em seus povoados. Davi e Samuel, o vidente, os estabeleceram em sua função de confiança.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os estabeleceram por causa da fidelidade deles”; ou: “os estabeleceram em sua fidelidade”.'
    reason: A expressão hebraica בֶּאֱמוּנָתָם pode indicar uma função ou encargo confiado, a fidelidade como motivo da designação ou a condição em que foram estabelecidos.
lexical_decisions:
- source_word: הַבְּרוּרִים
  choice: os escolhidos
  rationale: O particípio passivo indica pessoas selecionadas para uma função; “escolhidos” preserva a ideia sem especificar indevidamente o modo de seleção.
- source_word: לְשֹׁעֲרִים
  choice: para serem guardas dos portões
  rationale: שֹׁעֵר designa quem guarda uma porta ou portão; a expressão é clara no contexto do serviço do templo.
- source_word: בַּסִּפִּים
  choice: junto às soleiras
  rationale: סַף significa propriamente soleira ou limiar; “junto às soleiras” mantém a precisão concreta e indica o lugar em que exerciam a guarda.
- source_word: מָאתַיִם וּשְׁנֵים עָשָׂר
  choice: duzentos e doze
  rationale: Tradução direta do numeral cardinal.
- source_word: בְחַצְרֵיהֶם
  choice: em seus povoados
  rationale: Neste contexto genealógico e residencial, חָצֵר se refere a povoados ou assentamentos, não aos pátios do templo.
- source_word: הִתְיַחְשָׂם
  choice: foram registrados genealogicamente
  rationale: A forma verbal de יחס indica inscrição ou registro segundo a genealogia.
- source_word: יִסַּד
  choice: estabeleceram
  rationale: יסד comunica fundar ou estabelecer; aqui descreve a instituição da função sem introduzir terminologia eclesiástica posterior.
- source_word: הָרֹאֶה
  choice: o vidente
  rationale: Preserva o título específico רֹאֶה aplicado a Samuel, em vez de nivelá-lo ao termo mais geral “profeta”.
- source_word: בֶּאֱמוּנָתָם
  choice: nesse encargo de confiança
  rationale: אֱמוּנָה pode expressar fidelidade, confiabilidade ou uma responsabilidade confiada. O contexto administrativo favorece um encargo de confiança, sem eliminar a nuance moral.
theological_decisions:
- issue: Sentido de בֶּאֱמוּנָתָם no fim do versículo
  choice: Davi e Samuel os estabeleceram num encargo de confiança
  alternative: Davi e Samuel os estabeleceram por causa da fidelidade deles; ou os estabeleceram em sua fidelidade
  rationale: A expressão hebraica é sintaticamente condensada e semanticamente flexível. O contexto dos guardas e de seu registro oficial favorece a ideia de uma responsabilidade confiada, mas as possíveis referências à fidelidade são preservadas em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Guardas dos portões” evita a ambiguidade moderna de “porteiros”, enquanto “soleiras”, “vidente” e “registrados genealogicamente” preservam elementos específicos do hebraico.
