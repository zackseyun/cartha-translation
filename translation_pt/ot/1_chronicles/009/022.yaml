  verdict: revise
  source_fidelity: A tradução transmite corretamente a seleção dos guardas, o número, o registro genealógico em seus povoados e a atribuição a Davi e Samuel, o vidente. No entanto, «nesse encargo» introduz um demonstrativo sem antecedente textual e deixa de refletir claramente o sufixo possessivo em בֶּאֱמוּנָתָם («sua/deles»).
  naturalness: O português é claro e de registro adequado. «Todos os que foram escolhidos como guardas dos portões» é mais direto e idiomático do que «Todos os escolhidos para serem guardas dos portões». «Em sua função de confiança» flui melhor e evita o demonstrativo impreciso.
  terminology: «Guardas dos portões», «soleiras», «registrados genealogicamente», «povoados» e «o vidente» são escolhas apropriadas. «Função de confiança» conserva a leitura administrativa de אֱמוּנָה sem eliminar, por meio da nota, as alternativas ligadas à fidelidade.
