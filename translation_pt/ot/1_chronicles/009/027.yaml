review_pass:
  verdict: revise
  source_fidelity: 'A primeira oração e a atribuição da guarda refletem bem o hebraico. Contudo, «eram responsáveis pela chave[a], para abri-la» cria uma referência pronominal defeituosa: «abri-la» remete naturalmente a «chave», não à casa. Além disso, a formulação mistura a alternativa lexical («chave») com a interpretação de que a incumbência era abrir o edifício. Uma redação principal que expresse a responsabilidade pela abertura, com nota para «chave», corresponde melhor ao contexto e preserva a ambiguidade lexical documentada.'
  naturalness: «Passavam a noite ao redor da casa de Deus» e «estavam encarregados da guarda» são naturais e adequados. A sequência final, porém, é ambígua de modo involuntário e soa sintaticamente inadequada em português.
  terminology: «Casa de Deus» preserva apropriadamente בֵּית הָאֱלֹהִים. «Guarda» comunica bem מִשְׁמֶרֶת. A nota deve manter «chave» como alternativa, sem fazer com que o texto principal pareça dizer que se abria uma chave.
  issues:
  - severity: medium
    issue: Referência ambígua de «abri-la»
    rationale: Em «responsáveis pela chave, para abri-la», o pronome feminino tem como antecedente imediato «chave». Isso produz a leitura imprópria de abrir a chave, em vez de abrir a casa de Deus.
  - severity: low
    issue: A construção final combina duas opções interpretativas no texto principal
    rationale: «Pela chave» mantém a leitura lexical, enquanto «para abri-la» introduz a leitura contextual de abertura. É mais claro adotar a leitura contextual no texto e registrar a alternativa «chave» na nota.
  revised_text: Eles passavam a noite ao redor da casa de Deus, pois estavam encarregados da guarda e eram responsáveis por abrir a casa de Deus, manhã após manhã[a].
  revised_footnotes:
