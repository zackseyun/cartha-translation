base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/027.yaml
  text: They spent the night around the house of God[a], because the duty of guarding it was upon them, and they were in charge of opening it morning by morning.
translation:
  language: pt
  text: Eles passavam a noite ao redor da casa de Deus, pois estavam encarregados da guarda e eram responsáveis por abrir a casa de Deus, manhã após manhã[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “estavam sobre a chave”. O hebraico pode referir-se tanto à custódia da chave quanto à responsabilidade de abrir a casa de Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּסְבִיבוֹת
  choice: ao redor
  rationale: Expressa naturalmente a localização na área circundante, preservando o sentido espacial do hebraico.
- source_word: בֵּית הָאֱלֹהִים
  choice: a casa de Deus
  rationale: Mantém a expressão hebraica literal e reconhecível, sem substituí-la pelo termo mais específico “templo”.
- source_word: יָלִינוּ
  choice: passavam a noite
  rationale: Comunica de modo corrente a ideia de permanecer ou alojar-se durante a noite, sem sugerir necessariamente que dormiam.
- source_word: כִּי עֲלֵיהֶם מִשְׁמֶרֶת
  choice: pois estavam encarregados da guarda
  rationale: Torna natural em português o idioma hebraico segundo o qual a responsabilidade da guarda estava “sobre eles”.
- source_word: וְהֵם עַל הַמַּפְתֵּחַ
  choice: e eram responsáveis pela chave
  rationale: Preserva a referência lexical à chave e expressa com clareza a construção administrativa “estar sobre”, sem decidir silenciosamente se o foco recai na custódia da chave ou na abertura.
- source_word: וְלַבֹּקֶר לַבֹּקֶר
  choice: para abri-la manhã após manhã
  rationale: A repetição hebraica indica recorrência diária; “manhã após manhã” preserva seu ritmo, enquanto “para abri-la” explicita a ação exigida pelo contexto.
