source:
  edition: WLC
  text: וְ/עֹבַדְיָה֙ בֶּֽן שְׁמַֽעְיָ֔ה בֶּן גָּלָ֖ל בֶּן יְדוּת֑וּן וּ/בֶרֶכְיָ֤ה בֶן אָסָא֙ בֶּן אֶלְקָנָ֔ה הַ/יּוֹשֵׁ֖ב בְּ/חַצְרֵ֥י נְטוֹפָתִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/016.yaml
  text: and Obadiah son of Shemaiah[a], son of Galal, son of Jeduthun, and Berechiah son of Asa, son of Elkanah, who lived in the villages of the Netophathites.
translation:
  language: pt
  text: e Obadias, filho de Semaías, filho de Galal, filho de Jedutum; e Berequias, filho de Asa, filho de Elcana, que habitava nos povoados dos netofatitas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nos povoados de Netofa” — o gentílico hebraico pode ser expresso pelo nome do povo (“netofatitas”) ou pelo nome do lugar (“Netofa”).
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עֹבַדְיָה
  choice: e Obadias
  rationale: A conjunção liga Obadias à lista anterior; emprega-se a forma tradicional e reconhecível do nome em português.
- source_word: בֶּן
  choice: filho de
  rationale: Na fórmula genealógica, esta é a correspondência direta e natural, sem excluir a possibilidade geral de genealogias abreviadas.
- source_word: שְׁמַעְיָה
  choice: Semaías
  rationale: Forma portuguesa tradicional do nome pessoal hebraico.
- source_word: גָּלָל
  choice: Galal
  rationale: Transliteração natural do nome pessoal em português.
- source_word: יְדוּתוּן
  choice: Jedutum
  rationale: Forma portuguesa tradicional do nome pessoal.
- source_word: וּ/בֶרֶכְיָה
  choice: e Berequias
  rationale: A conjunção introduz outro integrante da lista; usa-se a forma portuguesa tradicional do nome.
- source_word: אָסָא
  choice: Asa
  rationale: Forma tradicional do nome em português; o contexto apenas o identifica como antepassado de Berequias.
- source_word: אֶלְקָנָה
  choice: Elcana
  rationale: Forma portuguesa tradicional do nome pessoal.
- source_word: הַ/יּוֹשֵׁב
  choice: que habitava
  rationale: O particípio com artigo descreve Berequias como residente; o imperfeito português expressa naturalmente essa situação contínua no contexto narrativo passado.
- source_word: בְּ/חַצְרֵי
  choice: nos povoados dos
  rationale: חָצֵר, nesta expressão geográfica, designa pequenos núcleos rurais ou assentamentos, não pátios literais.
- source_word: נְטוֹפָתִי
  choice: netofatitas
  rationale: O gentílico identifica os habitantes ligados a Netofa; a forma plural concorda idiomaticamente com a expressão portuguesa 'povoados dos netofatitas'.
theological_decisions: []
