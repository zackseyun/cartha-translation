  text: וַ/עֲדָיָה֙ בֶּן יְרֹחָ֔ם בֶּן פַּשְׁח֖וּר בֶּן מַלְכִּיָּ֑ה וּ/מַעְשַׂ֨י בֶּן עֲדִיאֵ֧ל בֶּן יַחְזֵ֛רָה בֶּן מְשֻׁלָּ֥ם בֶּן מְשִׁלֵּמִ֖ית בֶּן אִמֵּֽר־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/012.yaml
  text: and Adaiah son of Jeroham[a], son of Pashhur, son of Malchijah, and Maasai son of Adiel, son of Jahzerah, son of Meshullam, son of Meshillemith, son of Immer.
translation:
  language: pt
  text: e Adaías, filho de Jeroão, filho de Pasur, filho de Malquias; e Maasai, filho de Adiel, filho de Jazera, filho de Mesulão, filho de Mesilemite[a], filho de Imer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz aqui a forma מְשִׁלֵּמִית, traduzida por “Mesilemite”; em outro lugar aparece a forma relacionada “Mesilemote”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/עֲדָיָה
  choice: e Adaías
  rationale: A conjunção ו dá continuidade à lista do versículo anterior; o nome próprio é transliterado segundo formas correntes em português.
- source_word: בֶּן
  choice: filho de
  rationale: Em uma sequência genealógica, esta é a correspondência mais natural e preserva a estrutura repetitiva do hebraico, embora o termo possa, em outros contextos, indicar descendência mais remota.
- source_word: יְרֹחָם
  choice: Jeroão
  rationale: Transliteração em forma bíblica corrente em português.
- source_word: פַּשְׁחוּר
  choice: Pasur
  rationale: Transliteração em forma bíblica corrente e legível em português.
- source_word: מַלְכִּיָּה
  choice: Malquias
  rationale: Forma tradicional portuguesa do nome, adequada ao hebraico מַלְכִּיָּה.
- source_word: וּ/מַעְשַׂי
  choice: e Maasai
  rationale: A conjunção é preservada, e o nome segue a forma consonantal específica deste texto, sem identificá-lo com o nome mais longo Maaseias.
- source_word: עֲדִיאֵל
  choice: Adiel
  rationale: Transliteração direta e corrente em português.
- source_word: יַחְזֵרָה
  choice: Jazera
  rationale: Transliteração adaptada à ortografia portuguesa, mantendo a identificação do nome hebraico.
- source_word: מְשֻׁלָּם
  choice: Mesulão
  rationale: Forma aportuguesada tradicional, natural para leitores de português.
- source_word: מְשִׁלֵּמִית
  choice: Mesilemite
  rationale: Representa diretamente a forma massorética presente, distinguindo-a da variante nominal relacionada Mesilemote.
- source_word: אִמֵּר
  choice: Imer
  rationale: Transliteração simples e legível em português.
theological_decisions: []
