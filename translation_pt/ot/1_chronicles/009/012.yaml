  register: Português moderno, digno e amplamente compreensível, com nomes adaptados à convenção bíblica lusófona. A repetição de “filho de” conserva a forma genealógica do hebraico; o ponto e vírgula separa com clareza as duas linhagens sem alterar sua relação sintática.
