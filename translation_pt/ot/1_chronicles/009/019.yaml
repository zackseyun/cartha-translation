  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/שַׁלּ֣וּם בֶּן ק֠וֹרֵא בֶּן אֶבְיָסָ֨ף בֶּן קֹ֜רַח וְֽ/אֶחָ֧י/ו לְ/בֵית אָבִ֣י/ו הַ/קָּרְחִ֗ים עַ֚ל מְלֶ֣אכֶת הָ/עֲבוֹדָ֔ה שֹׁמְרֵ֥י הַ/סִּפִּ֖ים לָ/אֹ֑הֶל וַ/אֲבֹֽתֵי/הֶם֙ עַל מַחֲנֵ֣ה יְהוָ֔ה שֹׁמְרֵ֖י הַ/מָּבֽוֹא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/019.yaml
  text: And Shallum son of Kore[a], son of Ebiasaph, son of Korah, and his brothers from his father’s house, the Korahites, were over the work of the service, keepers of the thresholds of the tent; and their fathers had been over the camp of Yahweh[b], keepers of the entrance.
translation:
  language: pt
  text: E Salum, filho de Coré, filho de Ebiasafe, filho de Corá, e seus irmãos da casa de seu pai, os coraítas, estavam encarregados do trabalho do serviço, como guardas dos limiares da tenda[a]; e seus antepassados haviam estado encarregados do acampamento de Yahweh[b], como guardas da entrada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “guardas dos portões da tenda”. O hebraico diz literalmente “guardas dos limiares da tenda”.
    reason: lexical_alternative
  - marker: b
    text: “Yahweh” é a transliteração do nome divino hebraico YHWH, tradicionalmente representado por “SENHOR”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשַׁלּוּם
  choice: E Salum
  rationale: A conjunção liga o versículo à lista anterior; “E” conserva essa continuidade simples. “Salum” é a forma portuguesa corrente do nome.
- source_word: בֶּן ... בֶּן ... בֶּן
  choice: filho de ... filho de ... filho de
  rationale: Mantém a fórmula genealógica repetida, que apresenta uma linhagem específica.
- source_word: וְאֶחָיו לְבֵית אָבִיו
  choice: e seus irmãos da casa de seu pai
  rationale: Preserva tanto o termo comum “irmãos” como a expressão de pertencimento familiar e clânico.
- source_word: הַקָּרְחִים
  choice: os coraítas
  rationale: Designa os membros da linhagem ou do clã de Corá; “coraítas” é a forma portuguesa tradicional e precisa.
- source_word: עַל מְלֶאכֶת הָעֲבוֹדָה
  choice: estavam encarregados do trabalho do serviço
  rationale: עַל indica responsabilidade ou supervisão. “Serviço” evita conotações eclesiásticas posteriores que “ministério” poderia introduzir.
- source_word: שֹׁמְרֵי הַסִּפִּים לָאֹהֶל
  choice: como guardas dos limiares da tenda
  rationale: O particípio expressa uma função contínua de guarda. “Limiares” conserva a imagem concreta do hebraico, e “tenda” traduz o termo simples sem substituí-lo pelo mais interpretativo “tabernáculo”.
- source_word: וַאֲבֹתֵיהֶם
  choice: e seus antepassados haviam estado
  rationale: Embora o termo seja literalmente “pais”, aqui aponta para gerações anteriores. “Antepassados” comunica naturalmente esse sentido em português, e o mais-que-perfeito composto explicita a referência retrospectiva.
- source_word: עַל מַחֲנֵה יְהוָה
  choice: encarregados do acampamento de Yahweh
  rationale: A construção volta a indicar responsabilidade. “Acampamento” preserva a evocação do acampamento de Israel em torno do santuário, e o nome divino é transliterado como “Yahweh”.
- source_word: שֹׁמְרֵי הַמָּבוֹא
  choice: como guardas da entrada
  rationale: Mantém a repetição funcional de שֹׁמְרֵי e traduz הַמָּבוֹא de modo direto como “a entrada”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título; a nota informa a tradição de representá-lo como “SENHOR”.
- issue: Grau de especificidade do vocabulário do santuário
  choice: tenda
  alternative: tabernáculo
  rationale: O hebraico emprega o termo comum para “tenda”. A tradução conserva essa forma e deixa implícita a referência histórica ao santuário, sem torná-la mais técnica do que o original.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A sintaxe mantém a progressão genealógica e o paralelismo entre as duas funções de guarda, mas usa “como guardas” para evitar uma sequência nominal excessivamente rígida. Os marcadores de nota foram colocados junto aos termos efetivamente explicados.
