  text: וּ/בִ/ירוּשָׁלִַ֨ם֙ יָשְׁב֔וּ מִן בְּנֵ֥י יְהוּדָ֖ה וּ/מִן בְּנֵ֣י בִנְיָמִ֑ן וּ/מִן בְּנֵ֥י אֶפְרַ֖יִם וּ/מְנַשֶּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/003.yaml
  text: And in Jerusalem some from the sons of Judah, and some from the sons of Benjamin, and some from the sons of Ephraim and Manasseh, lived there.
translation:
  language: pt
  text: Em Jerusalém moravam alguns dos filhos de Judá, alguns dos filhos de Benjamim e alguns dos filhos de Efraim e Manassés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבִירוּשָׁלִַם
  choice: Em Jerusalém
  rationale: A locução preserva o sentido de lugar. O וּ inicial funciona como ligação com o contexto anterior, mas não precisa ser reproduzido por “e” em português, onde isso deixaria a abertura menos natural.
- source_word: יָשְׁבוּ
  choice: moravam
  rationale: O verbo יָשַׁב, neste contexto, indica residência. “Moravam” é corrente e claro, sem o tom arcaico de “habitavam” nem a ideia mais específica de um ato inicial sugerida por “se estabeleceram”.
- source_word: מִן
  choice: alguns dos
  rationale: A preposição repetida identifica pessoas provenientes de cada grupo tribal. Como o sujeito está implícito no hebraico, “alguns dos” o torna natural em português e evita sugerir que todos os membros dessas tribos moravam em Jerusalém.
- source_word: בְּנֵי יְהוּדָה / בְּנֵי בִנְיָמִן / בְּנֵי אֶפְרַיִם
  choice: filhos de Judá / filhos de Benjamim / filhos de Efraim
  rationale: “Filhos de” conserva o idioma genealógico e tribal característico de Crônicas, mantendo também a repetição estrutural do hebraico.
- source_word: וּמְנַשֶּׁה
  choice: e Manassés
  rationale: O hebraico não repete בְּנֵי nem מִן diante de Manassés; em português, “filhos de” se estende naturalmente a “Efraim e Manassés”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi ajustada para a construção idiomática “Em Jerusalém moravam...”, sem alterar a ênfase locativa. Conservou-se “filhos de” para refletir a linguagem tribal e genealógica do texto hebraico.
