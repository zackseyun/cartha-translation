  text: And their brothers in their villages were to come in every seven days[a], from time to time[b], with these.
translation:
  language: pt
  text: E seus irmãos, que moravam em seus povoados, deviam vir de tempos em tempos, a cada sete dias[a], com estes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “durante sete dias”. A expressão hebraica provavelmente se refere a uma rotação de serviço a cada sete dias.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “com estes”, isto é, com os que já estavam servindo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: E seus irmãos
  rationale: Mantém o sentido literal de אֲחֵיהֶם; no contexto, o termo pode abranger seus parentes ou companheiros levitas, mas não é necessário explicitar isso no texto.
- source_word: בְּחַצְרֵיהֶם
  choice: que moravam em seus povoados
  rationale: חָצֵר pode indicar pátio, recinto ou povoado. Aqui se refere aos lugares onde esses levitas residiam fora do recinto do templo; a oração relativa produz português natural.
- source_word: לָבוֹא
  choice: deviam vir
  rationale: O infinitivo com ל, dentro da descrição da organização do serviço, expressa a incumbência prevista na escala.
- source_word: לְשִׁבְעַת הַיָּמִים
  choice: a cada sete dias
  rationale: No contexto, a expressão provavelmente indica uma rotação semanal, embora a construção também possa ser entendida como 'durante sete dias'; a alternativa é preservada em nota.
- source_word: מֵעֵת אֶל עֵת
  choice: de tempos em tempos
  rationale: Reproduz de modo idiomático a ideia de ocasiões recorrentes ou sucessivas.
- source_word: עִם אֵלֶּה
  choice: para se juntar a estes
  rationale: A expressão significa literalmente 'com estes' e aponta para os porteiros já em serviço. A formulação escolhida explicita em português natural o movimento de vir para estar com eles, sem identificar além do que o contexto permite.
