  text: וְ/אֵ֣לֶּה הַ֠/מְשֹׁרְרִים רָאשֵׁ֨י אָב֧וֹת לַ/לְוִיִּ֛ם בַּ/לְּשָׁכֹ֖ת פטירים כִּֽי יוֹמָ֥ם וָ/לַ֛יְלָה עֲלֵי/הֶ֖ם בַּ/מְּלָאכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/033.yaml
  text: These were the singers[a], heads of fathers’ houses of the Levites, in the chambers, free from other duties, for they were occupied in the work day and night.
translation:
  language: pt
  text: Estes eram os cantores, chefes das famílias dos levitas, nas salas, dispensados de outras tarefas,[a] pois estavam ocupados no trabalho dia e noite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “isentos” ou “liberados”. O termo hebraico é raro e provavelmente indica que eles estavam dispensados de outras tarefas por causa de sua responsabilidade contínua no serviço de canto.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְשֹׁרְרִים
  choice: os cantores
  rationale: O particípio de שׁיר designa os que cantavam; “cantores” é mais preciso do que o termo mais amplo “músicos”.
- source_word: רָאשֵׁי אָבוֹת
  choice: chefes das famílias
  rationale: Expressa de modo natural em português os responsáveis pelos grupos familiares ou casas ancestrais, sem a construção pouco idiomática “chefes de casas paternas”.
- source_word: לַלְוִיִּם
  choice: dos levitas
  rationale: Identifica esses chefes como pertencentes aos levitas.
- source_word: בַּלְּשָׁכוֹת
  choice: nas salas
  rationale: לשכה indica salas ou aposentos do complexo institucional; “salas” é claro e não acrescenta explicitamente “do templo”.
- source_word: פטירים
  choice: dispensados de outras tarefas
  rationale: A forma rara provavelmente indica que estavam livres ou isentos; o contexto sugere isenção de outras obrigações levíticas, não ausência de todo serviço.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão de estarem dispensados de outras tarefas.
- source_word: יוֹמָם וָלַיְלָה
  choice: dia e noite
  rationale: Preserva diretamente o par temporal hebraico e sua ideia de responsabilidade contínua.
- source_word: עֲלֵיהֶם
  choice: estavam ocupados
  rationale: A expressão literal “sobre eles” comunica aqui encargo ou responsabilidade; a formulação portuguesa transmite esse valor idiomático.
- source_word: בַּמְּלָאכָה
  choice: nesse serviço
  rationale: מלאכה significa trabalho ou tarefa; “serviço” se ajusta ao contexto levítico, enquanto “nesse” retoma a função dos cantores sem especificar detalhes ausentes do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem mantém as salas como local em que os cantores permaneciam e explicita apenas na medida necessária que a rara forma פטירים se refere à dispensa de outras tarefas.
