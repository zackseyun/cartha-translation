    issue: «ficavam» em vez de uma cópula locativa
    rationale: 'A forma verbal portuguesa sugere permanência habitual ou ação repetida. O hebraico tem uma construção nominal: «[eles] no portão do rei ...; eles, os porteiros». «Estavam» reproduz melhor a informação locativa sem acrescentar aspecto.'
  - severity: medium
    issue: «guardas dos portões dos acampamentos»
    rationale: A formulação introduz explicitamente «portões» no plural e faz deles uma cadeia possessiva dos acampamentos. O texto hebraico chama o grupo de porteiros e indica que seu encargo era relativo aos acampamentos dos filhos de Levi.
  revised_text: Até então, eles estavam no portão do rei, a leste[a]; eram os porteiros encarregados dos acampamentos dos filhos de Levi[b].
