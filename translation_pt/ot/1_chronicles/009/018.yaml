  text: וְֽ/עַד הֵ֔נָּה בְּ/שַׁ֥עַר הַ/מֶּ֖לֶךְ מִזְרָ֑חָ/ה הֵ֚מָּה הַ/שֹּׁ֣עֲרִ֔ים לְ/מַחֲנ֖וֹת בְּנֵ֥י לֵוִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/018.yaml
  text: Until then they were at the king’s gate on the east[b][a]; they were the gatekeepers for the camps of the sons of Levi.
translation:
  language: pt
  text: Até então, eles estavam no portão do rei, a leste[a]; eram os porteiros encarregados dos acampamentos dos filhos de Levi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Até agora”. A expressão hebraica também pode indicar continuidade até o momento do narrador.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “das divisões dos filhos de Levi”. O termo hebraico pode referir-se tanto a acampamentos quanto a agrupamentos organizados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַד הֵנָּה
  choice: Até então
  rationale: A expressão temporal indica continuidade até aquele ponto do relato. “Até então” é natural em português e preserva a possível referência retrospectiva.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: junto ao portão do rei
  rationale: A preposição é locativa; “junto ao” expressa com naturalidade a posição no portão sem sugerir necessariamente que estivessem dentro dele.
- source_word: מִזְרָחָה
  choice: a leste
  rationale: A forma direcional/local situa o portão no lado oriental; “a leste” é conciso e idiomático.
- source_word: הֵמָּה
  choice: eles ... eram
  rationale: O pronome independente retoma com ênfase o grupo já mencionado; o português requer a cópula na segunda oração.
- source_word: הַשֹּׁעֲרִים
  choice: os guardas dos portões
  rationale: O substantivo designa as pessoas encarregadas de vigiar os portões. Esta formulação é clara e evita a possível impressão moderna de simples atendentes.
- source_word: לְמַחֲנוֹת
  choice: dos acampamentos
  rationale: מַחֲנוֹת significa literalmente “acampamentos”, embora no contexto também possa designar agrupamentos ou divisões organizadas. A tradução principal conserva a imagem concreta.
- source_word: בְּנֵי לֵוִי
  choice: dos filhos de Levi
  rationale: Preserva a expressão genealógica hebraica, em vez de substituí-la pela forma interpretativa abreviada “levitas”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. Mantém a expressão genealógica “filhos de Levi” e registra em notas as ambiguidades temporal e organizacional do hebraico.
