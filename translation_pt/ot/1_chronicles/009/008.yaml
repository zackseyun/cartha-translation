lexical_decisions:
- source_word: וְ
  choice: e
  rationale: A conjunção prefixada liga os nomes à lista anterior. Foi mantida nos pontos principais, enquanto a pontuação torna a enumeração natural em português.
- source_word: יִבְנְיָה
  choice: Ibneias
  rationale: Nome próprio transliterado segundo formas bíblicas usuais em português, sem traduzir seu possível significado.
- source_word: בֶּן
  choice: filho de
  rationale: Nesta genealogia, a expressão indica filiação; não há no contexto razão suficiente para ampliar explicitamente o sentido para «descendente de».
- source_word: יְרֹחָם
  choice: Jeroão
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico.
- source_word: אֵלָה
  choice: Elá
  rationale: Transliteração em português com acento para indicar a tonicidade e distingui-lo na leitura.
- source_word: עֻזִּי
  choice: Uzi
  rationale: Transliteração simples e corrente em português.
- source_word: מִכְרִי
  choice: Micri
  rationale: Transliteração que representa naturalmente em português as consoantes do nome hebraico.
- source_word: מְשֻׁלָּם
  choice: Mesulão
  rationale: Forma bíblica portuguesa consolidada e de leitura natural.
- source_word: שְׁפַטְיָה
  choice: Sefatias
  rationale: Forma portuguesa reconhecível que preserva a identidade do nome hebraico.
- source_word: רְעוּאֵל
  choice: Reuel
  rationale: Representa diretamente a forma do texto massorético, sem adotar a variante tradicional «Raguel».
- source_word: יִבְנִיָּה
  choice: Ibnias
  rationale: Transliteração portuguesa distinta de יִבְנְיָה, preservando a diferença gráfica entre os dois nomes no hebraico.
