base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/051.yaml
  text: 'Hadad died[a], and the chiefs of Edom were: Chief Timna, Chief Aliah[c][b], Chief Jetheth.'
translation:
  language: pt
  text: 'Hadade morreu, e os chefes[b] de Edom foram: o chefe Timna, o chefe Aliah[a] e o chefe Jetete.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em Gênesis 36:40, o nome correspondente aparece como “Alvá”; aqui, Crônicas traz “Aliah”.
    reason: textual_variant
  - marker: b
    text: O termo hebraico pode designar o chefe de um clã ou de uma tribo edomita. Versões antigas também o traduzem por “duque”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: morreu
  rationale: O perfeito consecutivo de מות dá sequência à narrativa; o pretérito perfeito expressa isso naturalmente em português.
- source_word: הֲדָד
  choice: Hadade
  rationale: Transliteração portuguesa corrente do nome hebraico.
- source_word: וַיִּהְיוּ
  choice: e estes foram
  rationale: Nesse contexto, היה introduz a lista que segue. A formulação explicita com naturalidade o valor apresentativo sem alterar o conteúdo.
- source_word: אַלּוּפֵי / אַלּוּף
  choice: chefes / o chefe
  rationale: No contexto edomita, אַלּוּף designa líderes tribais ou de clãs; “chefe” é claro, atual e preserva a repetição estrutural do hebraico.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Forma tradicional e amplamente reconhecida em português.
- source_word: תִּמְנָע
  choice: Timna
  rationale: Transliteração direta e natural do nome hebraico.
- source_word: עליה
  choice: Aliah
  rationale: A forma registrada em Crônicas sustenta “Aliah”; a diferença em relação ao paralelo de Gênesis é preservada em nota.
- source_word: יְתֵת
  choice: Jetete
  rationale: Transliteração adaptada à ortografia e à pronúncia portuguesas.
