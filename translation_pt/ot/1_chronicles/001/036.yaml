source:
  edition: WLC
  text: בְּנֵ֖י אֱלִיפָ֑ז תֵּימָ֤ן וְ/אוֹמָר֙ צְפִ֣י וְ/גַעְתָּ֔ם קְנַ֖ז וְ/תִמְנָ֥ע וַ/עֲמָלֵֽק׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/036.yaml
  text: 'The sons of Eliphaz: Teman[a], Omar, Zephi, Gatam, Kenaz, Timna[b], and Amalek.'
translation:
  language: pt
  text: 'Os filhos de Elifaz: Temã, Omar, Zefi[a], Gaetã, Quenaz, Timna[b] e Amaleque.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico Zefi; em Gênesis 36:11 aparece a forma variante Zefo.
    reason: textual_variant
  - marker: b
    text: Gênesis 36:12 identifica Timna como concubina de Elifaz e Amaleque como filho dela. Aqui, Crônicas inclui os dois nomes na lista dos filhos de Elifaz.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי
  choice: Os filhos de
  rationale: Plural construto de בֵּן que introduz uma lista genealógica; “os filhos de” é a correspondência mais direta e precisa.
- source_word: אֱלִיפָז
  choice: Elifaz
  rationale: Forma consagrada em português para este nome pessoal.
- source_word: תֵּימָן
  choice: Temã
  rationale: Transliteração tradicional e reconhecível em português.
- source_word: אוֹמָר
  choice: Omar
  rationale: Transliteração direta do nome pessoal.
- source_word: צְפִי
  choice: Zefi
  rationale: Representa a forma específica de Crônicas, צְפִי, distinguindo-a da variante צְפוֹ de Gênesis 36:11.
- source_word: גַעְתָּם
  choice: Gaetã
  rationale: Forma portuguesa legível que representa o nome hebraico.
- source_word: קְנַז
  choice: Quenaz
  rationale: Grafia tradicional em português, na qual “qu” representa naturalmente o som inicial /k/ antes de “e”.
- source_word: תִמְנָע
  choice: Timna
  rationale: Transliteração clara do nome conforme vocalizado neste versículo.
- source_word: עֲמָלֵק
  choice: Amaleque
  rationale: Forma tradicional e amplamente reconhecida em português.
- source_word: וְ / וַ
  choice: vírgulas, com “e” antes do último nome
  rationale: Conserva a estrutura da enumeração hebraica em estilo natural no português moderno.
theological_decisions:
- issue: Relação genealógica de Timna e Amaleque neste versículo em comparação com Gênesis 36:12
  choice: Apresentar Timna e Amaleque, no texto principal, entre os nomes introduzidos por “Os filhos de Elifaz”, conforme a forma direta de Crônicas.
  alternative: Harmonizar o texto com Gênesis 36:12, tratando Timna como concubina de Elifaz e Amaleque como filho dela.
  rationale: O hebraico de Crônicas oferece uma lista simples após “Os filhos de Elifaz”. A tradução mantém essa formulação e preserva na nota a tensão com o relato paralelo, sem resolver a diferença por harmonização.
translation_notes:
  register: 'Português moderno, digno e de ampla compreensão, com formas de nomes reconhecíveis no uso bíblico brasileiro. A enumeração é fluente, sem repetir mecanicamente a conjunção hebraica. Os marcadores foram colocados junto aos nomes pertinentes: a variante textual em Zefi e a questão genealógica em Timna.'
