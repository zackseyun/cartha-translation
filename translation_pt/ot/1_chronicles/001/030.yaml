lexical_decisions:
- source_word: מִשְׁמָע
  choice: Misma
  rationale: Nome próprio em uma lista genealógica; transliterado segundo formas correntes e legíveis em português.
- source_word: וְ/דוּמָה
  choice: Dumá
  rationale: דוּמָה é nome próprio, transliterado; a conjunção hebraica não precisa ser repetida neste ponto em uma enumeração portuguesa natural.
- source_word: מַשָּׂא
  choice: Massá
  rationale: O contexto genealógico indica um nome próprio, não o substantivo comum que pode significar «carga» ou «oráculo»; a transliteração mantém a consoante dupla perceptível em português.
- source_word: חֲדַד
  choice: Hadade
  rationale: Transliteração portuguesa tradicional e legível do nome חֲדַד, preservando a leitura de 1 Crônicas, distinta da forma do texto paralelo em Gênesis 25:15.
- source_word: וְ/תֵימָא
  choice: e Temá
  rationale: תֵימָא é transliterado como nome próprio, e a conjunção וְ é expressa naturalmente antes do último elemento da lista.
