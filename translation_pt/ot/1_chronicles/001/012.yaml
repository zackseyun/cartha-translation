  text: וְֽ/אֶת פַּתְרֻסִ֞ים וְ/אֶת כַּסְלֻחִ֗ים אֲשֶׁ֨ר יָצְא֥וּ מִ/שָּׁ֛ם פְּלִשְׁתִּ֖ים וְ/אֶת כַּפְתֹּרִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/012.yaml
  text: and the Pathrusites[a], and the Casluhites (from whom the Philistines came), and the Caphtorites.
translation:
  language: pt
  text: e os patrusitas, os casluítas (dos quais vieram os filisteus)[a] e os caftoritas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “de lá saíram os filisteus”. Aqui em Crônicas, o hebraico liga mais naturalmente essa oração aos casluítas; Gênesis 10:14 traz a mesma redação, enquanto outros textos também associam os filisteus a Caftor (ver Amós 9:7; Jeremias 47:4).
    reason: Esclarecer a formulação literal, a ligação gramatical e a tensão com referências bíblicas relacionadas.
lexical_decisions:
- source_word: פַּתְרֻסִים
  choice: patrusitas
  rationale: Translitera o nome do povo ligado a Patros e usa a terminação portuguesa corrente para gentílicos bíblicos.
- source_word: כַּסְלֻחִים
  choice: casluítas
  rationale: Preserva por transliteração um etnônimo de identificação incerta, sem impor uma localização ou interpretação não expressa no hebraico.
- source_word: אֲשֶׁר יָצְאוּ מִשָּׁם
  choice: dos quais vieram
  rationale: Expressa de modo natural, no contexto genealógico, a origem indicada literalmente por “que saíram de lá”, ligando a oração ao grupo imediatamente anterior sem ocultar em nota a formulação espacial do hebraico.
- source_word: פְּלִשְׁתִּים
  choice: os filisteus
  rationale: Emprega a designação portuguesa tradicional e amplamente reconhecida desse povo.
- source_word: כַּפְתֹּרִים
  choice: caftoritas
  rationale: Translitera o etnônimo relacionado a Caftor com forma natural em português.
- source_word: וְאֶת
  choice: e
  rationale: Na sequência genealógica, representa a conjunção, enquanto o marcador hebraico de objeto direto não exige tradução explícita em português.
theological_decisions:
- issue: Antecedente da origem dos filisteus
  choice: A oração é ligada no texto principal aos casluítas, o antecedente gramatical imediato.
  alternative: Relacionar diretamente os filisteus aos caftoritas ou manter apenas a expressão espacial “de lá”.
  rationale: A sintaxe de 1Crônicas 1:12 favorece os casluítas como antecedente imediato, mas outros textos bíblicos associam os filisteus a Caftor; a nota preserva essa tensão sem harmonização silenciosa.
translation_notes:
  register: Português moderno, claro e digno, com formas transliteradas inteligíveis para os nomes dos povos. A estrutura conserva o caráter de lista genealógica e a conjunção inicial, pois o versículo continua a frase anterior.
