  register: Português moderno, claro e digno, com legibilidade brasileira e formas portuguesas reconhecíveis dos nomes próprios. A sintaxe acompanha de perto as fórmulas hebraicas sem soar artificial. O marcador da variante Paí/Paú foi colocado junto ao nome a que se refere.
