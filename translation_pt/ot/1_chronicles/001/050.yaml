base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/050.yaml
  text: Baal-hanan died[a], and Hadad reigned in his place. The name of his city was Pai, and the name of his wife was Mehetabel daughter of Matred[b], daughter of Mezahab.
translation:
  language: pt
  text: Baal-Hanã morreu, e Hadade reinou em seu lugar. O nome da sua cidade era Paí[a], e o nome da sua mulher era Meetabel, filha de Matrede, filha de Mezaabe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em Gênesis 36:39, o nome da cidade aparece como “Paú”; em Crônicas, o texto hebraico traz “Paí”.
    reason: textual_variant
  - marker: b
    text: Em linguagem genealógica, a segunda ocorrência de “filha de” pode ter o sentido de “neta de”; aqui, porém, a formulação hebraica foi mantida mais literalmente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת בַּעַל חָנָן
  choice: Baal-Hanã morreu
  rationale: A forma narrativa de מות expressa de modo direto a morte de Baal-Hanã na sequência de sucessão. O nome próprio é transliterado segundo convenções correntes em português.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: reinou em seu lugar
  rationale: מלך, nesta lista régia, indica que Hadade assumiu o reinado; תחתיו preserva a ideia de sucessão.
- source_word: הֲדַד
  choice: Hadade
  rationale: Transliteração tradicional e reconhecível em português do nome próprio hebraico.
- source_word: וְשֵׁם עִירוֹ
  choice: O nome da sua cidade era
  rationale: A oração nominal hebraica requer a cópula em português; “sua” retoma naturalmente Hadade.
- source_word: פָּעִי
  choice: Paí
  rationale: Representa a forma de Crônicas, פָּעִי, sem substituí-la pela forma paralela Paú de Gênesis 36:39.
- source_word: וְשֵׁם אִשְׁתּוֹ
  choice: e o nome da sua mulher era
  rationale: Mantém a fórmula hebraica de nomeação em linguagem portuguesa clara e digna.
- source_word: מְהֵיטַבְאֵל
  choice: Meetabel
  rationale: Transliteração portuguesa do nome próprio.
- source_word: בַּת מַטְרֵד בַּת מֵי זָהָב
  choice: filha de Matrede, filha de Mezaabe
  rationale: Preserva literalmente a repetição de בַּת e não resolve a possível relação genealógica como “neta”.
- source_word: מֵי זָהָב
  choice: Mezaabe
  rationale: O contexto trata a expressão como nome próprio; por isso, ela é transliterada, não traduzida como uma expressão comum.
