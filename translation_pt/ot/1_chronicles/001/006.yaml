  yaml_path: translation/ot/1_chronicles/001/006.yaml
  text: 'And the sons of Gomer: Ashkenaz[a], Diphath, and Togarmah.'
translation:
  language: pt
  text: 'E os filhos de Gômer: Asquenaz, Difate[a] e Togarma.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em Gênesis 10:3, a genealogia paralela traz “Rifate”; aqui, o texto hebraico de Crônicas traz “Difate”.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: E os filhos de
  rationale: בְּנֵי é o plural construto de “filhos”; em genealogias, “os filhos de” preserva com clareza a linguagem de linhagem. O וּ inicial é traduzido por “E”, mantendo a continuidade da lista.
- source_word: גֹּמֶר
  choice: Gômer
  rationale: Nome próprio transliterado em forma corrente e legível em português, com acento para indicar a pronúncia.
- source_word: אַשְׁכֲּנַז
  choice: Asquenaz
  rationale: Nome próprio transliterado segundo convenções ortográficas naturais do português.
- source_word: דִיפַת
  choice: Difate
  rationale: Segue a leitura דִיפַת do texto hebraico massorético de Crônicas. A variante “Rifate” de Gênesis 10:3 é registrada em nota, sem substituir a leitura do versículo traduzido.
- source_word: תוֹגַרְמָה
  choice: Togarma
  rationale: Nome próprio transliterado em forma tradicional e natural em português.
