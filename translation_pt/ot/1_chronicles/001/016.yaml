  text: and the Arvadites[a], and the Zemarites, and the Hamathites.
translation:
  language: pt
  text: e os arvadeus[a], e os zemareus, e os hamateus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Aqui, os gentílicos hebraicos estão gramaticalmente no singular, mas têm sentido coletivo e se referem a povos ou clãs: arvadeu, zemareu e hamateu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: e
  rationale: Na lista genealógica, a conjunção introduz cada novo grupo; o marcador de objeto אֵת não requer tradução separada em português.
- source_word: הָאַרְוָדִי
  choice: os arvadeus
  rationale: Embora o gentílico hebraico esteja formalmente no singular, ele tem sentido coletivo e designa o povo ou clã ligado a Arvade.
- source_word: הַצְּמָרִי
  choice: os zemareus
  rationale: O singular gentílico hebraico funciona coletivamente; o plural português expressa com naturalidade o povo associado a Zemar.
- source_word: הַחֲמָתִי
  choice: os hamateus
  rationale: O gentílico designa coletivamente os habitantes ou o clã ligado a Hamate; o plural é natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com gentílicos tradicionais e leitura natural no plural. A repetição de “e” preserva o ritmo enumerativo do hebraico.
