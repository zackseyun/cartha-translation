  yaml_path: translation/ot/1_chronicles/001/047.yaml
  text: Hadad died[a], and Samlah from Masrekah reigned in his place.
translation:
  language: pt
  text: Hadade morreu, e Samlá, de Masreca, reinou em seu lugar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “depois dele”. A expressão hebraica significa literalmente “debaixo dele” ou “no lugar dele” e, neste contexto, indica sucessão real.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: morreu
  rationale: O wayyiqtol de מוּת indica diretamente a morte; “morreu” é a forma simples, natural e não eufemística em português.
- source_word: הֲדָד
  choice: Hadade
  rationale: Nome próprio transliterado segundo a forma tradicional e corrente em português.
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: No contexto de uma fórmula de sucessão real, o wayyiqtol de מָלַךְ é bem representado por “reinou”, preservando o estilo conciso da lista de reis.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: A preposição תַּחַת com sufixo pronominal marca aqui a substituição no trono; “em seu lugar” expressa de modo natural a sucessão, sem excluir a nuance temporal de “depois dele”.
- source_word: שַׂמְלָה
  choice: Samlá
  rationale: Nome próprio transliterado em forma adequada ao português, com acento para indicar a tonicidade final.
- source_word: מִמַּשְׂרֵקָה
  choice: de Masreca
  rationale: A preposição מִן indica origem ou associação geográfica. “De Masreca” é conciso e natural em português e conserva essa possível amplitude.
