lexical_decisions:
- source_word: בְּנֵי
  choice: os filhos de
  rationale: O plural construto de בֵּן, em uma genealogia, é expresso naturalmente por “os filhos de”, preservando a forma masculina e específica do hebraico.
- source_word: עֲנָה
  choice: Aná
  rationale: Nome próprio transliterado em forma corrente e legível em português.
- source_word: דִּישׁוֹן
  choice: Disom
  rationale: Nome próprio transliterado de modo compatível com convenções bíblicas em português; a mesma forma é mantida nas duas ocorrências.
- source_word: וּבְנֵי
  choice: E os filhos de
  rationale: A conjunção וּ é preservada por “E”, mantendo a estrutura encadeada da lista genealógica.
- source_word: חַמְרָן
  choice: Hamrã
  rationale: Segue diretamente a leitura חַמְרָן do Texto Massorético de 1Crônicas; a forma divergente da genealogia paralela é registrada em nota.
- source_word: אֶשְׁבָּן
  choice: Esbã
  rationale: Transliteração portuguesa simples do nome próprio hebraico.
- source_word: יִתְרָן
  choice: Itrã
  rationale: Transliteração direta e legível do nome hebraico, sem recorrer à forma anglicizada.
- source_word: כְרָן
  choice: Querã
  rationale: Transliteração adaptada à ortografia portuguesa para representar naturalmente o som consonantal inicial.
