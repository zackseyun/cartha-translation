lexical_decisions:
- source_word: קֵינָן
  choice: Quenã
  rationale: Nome próprio transliterado diretamente da forma hebraica Qênān, com grafia adaptada ao português. Evita fazer da forma influenciada pelo grego uma tradução do hebraico.
- source_word: מַהֲלַלְאֵל
  choice: Maalalel
  rationale: Nome próprio transliterado, com forma legível e já reconhecível em português; a sequência hebraica é preservada sem traduzir os elementos do nome.
- source_word: יָרֶד
  choice: Jarede
  rationale: Adota a forma tradicional e amplamente reconhecível em português, embora a transliteração mais estrita do hebraico seja «Iérede» ou «Yered».
