base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/029.yaml
  text: 'These are their generations: the firstborn of Ishmael[a], Nebaioth, Kedar, Adbeel, and Mibsam.'
translation:
  language: pt
  text: 'Estes são os seus descendentes: Nebaiote, o primogênito de Ismael, Quedar, Adbeel e Mibsão.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה תֹּלְדוֹתָם
  choice: Estes são os seus descendentes
  rationale: No contexto genealógico, תּוֹלְדוֹת pode designar descendência ou linhagem. “Descendentes” comunica esse sentido com naturalidade no português atual, enquanto mantém o pronome plural do hebraico.
- source_word: בְּכוֹר יִשְׁמָעֵאל נְבָיוֹת
  choice: Nebaiote, o primogênito de Ismael
  rationale: A reorganização põe o nome antes do aposto para deixar clara, em português, a relação entre Nebaiote e sua condição de primogênito, sem acrescentar “filho”, ausente no hebraico.
- source_word: יִשְׁמָעֵאל
  choice: Ismael
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome.
- source_word: נְבָיוֹת
  choice: Nebaiote
  rationale: Forma portuguesa bíblica estabelecida, correspondente ao nome hebraico.
- source_word: קֵדָר
  choice: Quedar
  rationale: Forma portuguesa bíblica estabelecida do nome próprio.
- source_word: אַדְבְּאֵל
  choice: Adbeel
  rationale: Transliteração tradicional e transparente do nome próprio em português.
- source_word: מִבְשָׂם
  choice: Mibsão
  rationale: Forma portuguesa bíblica tradicional do nome próprio.
