  text: וַ/יָּ֖מָת בָּ֑לַע וַ/יִּמְלֹ֣ךְ תַּחְתָּ֔י/ו יוֹבָ֥ב בֶּן זֶ֖רַח מִ/בָּצְרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/044.yaml
  text: Bela died[a], and Jobab son of Zerah from Bozrah reigned in his place.
translation:
  language: pt
  text: Belá morreu, e Jobabe, filho de Zerá, de Bozra,[a] reinou em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “de Bozra” pode indicar que Jobabe era procedente da cidade ou que estava associado a ela.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: morreu
  rationale: O wayyiqtol de מוּת dá sequência à narrativa. Em português, a coordenação é expressa naturalmente por “Belá morreu, e...”, sem necessidade de iniciar a frase com “E”.
- source_word: בָּלַע
  choice: Belá
  rationale: Nome próprio transliterado com acento para indicar a tonicidade final em português e evitar a leitura como o adjetivo “bela”.
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: O Qal wayyiqtol de מלך, nesta fórmula de sucessão, descreve a ascensão e o exercício da realeza; “reinou” preserva a formulação concisa do cronista.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: תחת com sufixo pronominal, em contexto de sucessão, indica que alguém ocupa o lugar do governante anterior.
- source_word: יוֹבָב
  choice: Jobabe
  rationale: Transliteração tradicional e inteligível do nome próprio em português.
- source_word: בֶּן זֶרַח
  choice: filho de Zerá
  rationale: Reproduz de modo transparente a construção patronímica hebraica.
- source_word: מִבָּצְרָה
  choice: de Bozra
  rationale: A preposição מִן pode indicar procedência ou associação com um lugar. A expressão portuguesa “de Bozra” mantém essa concisão e parte da ambiguidade.
theological_decisions: []
translation_notes:
  register: Português atual, digno e conciso, com a fórmula de sucessão preservada. O marcador da nota foi colocado após “Bozra”, termo ao qual a observação lexical se refere.
