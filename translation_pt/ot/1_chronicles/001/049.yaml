  text: And Shaul died[a], and Baal-hanan son of Akbor reigned in his place.
translation:
  language: pt
  text: Shaul morreu[a], e Baal-Hanan, filho de Akbor, reinou em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Versões portuguesas tradicionais costumam grafar estes nomes como “Saul”, “Baal-Hanan” e “Acbor”. Aqui se empregam transliterações mais próximas do hebraico para os nomes pessoais.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: morreu
  rationale: 'O qal wayyiqtol de מות expressa a sequência narrativa normal: “e morreu”. Em português, “morreu” é direto, natural e não eufemístico; a conjunção seguinte preserva adequadamente o encadeamento do versículo.'
- source_word: שָׁאוּל
  choice: Shaul
  rationale: Transliteração próxima do hebraico, preservando o som inicial de שׁ e tratando o termo como nome próprio, sem o traduzir.
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: O qal wayyiqtol de מלך, nesta fórmula de sucessão real, indica que o sucessor passou a exercer o reinado. “Reinou” é conciso, digno e idiomático.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: A preposição תַּחַת com sufixo pronominal exprime substituição ou sucessão. “Em seu lugar” conserva esse sentido sem o reduzir apenas a uma sequência cronológica.
- source_word: בַּעַל חָנָן
  choice: Baal-Hanã
  rationale: Transliteração do nome composto hebraico. O hífen torna visível sua composição, e “Hanã” oferece uma forma legível em português.
- source_word: בֶּן
  choice: filho de
  rationale: Neste registro genealógico e régio, בֶּן indica naturalmente filiação imediata.
- source_word: עַכְבּוֹר
  choice: Akbor
  rationale: Transliteração simplificada do nome hebraico, aproximando suas consoantes da forma de origem sem recorrer à grafia tradicional portuguesa “Acbor”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com a concisão própria de uma fórmula de sucessão real. A ordem foi ajustada de modo natural para o português, sem perder a sequência narrativa nem o sentido substitutivo de תַּחְתָּיו.
