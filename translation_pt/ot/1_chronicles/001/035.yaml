  text: 'The sons of Esau: Eliphaz[a], Reuel, Jeush, Jalam, and Korah.'
translation:
  language: pt
  text: 'Os filhos de Esaú: Elifaz, Reuel[a], Jeús, Jalão e Corá.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em algumas tradições, este nome também aparece como “Raguel”, devido a uma via diferente de transliteração, não a um nome hebraico diferente.
