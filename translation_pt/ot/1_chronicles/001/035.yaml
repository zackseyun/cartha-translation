lexical_decisions:
- source_word: בְּנֵי
  choice: os filhos de
  rationale: O plural construto de בֵּן introduz uma lista genealógica; “filhos de” expressa aqui o sentido direto e convencional.
- source_word: עֵשָׂו
  choice: Esaú
  rationale: Forma consagrada e amplamente reconhecida em português para o nome hebraico.
- source_word: אֱלִיפַז
  choice: Elifaz
  rationale: Transliteração tradicional em português, próxima da forma hebraica.
- source_word: רְעוּאֵל
  choice: Reuel
  rationale: Representa diretamente o nome hebraico e corresponde à forma mais comum nas traduções portuguesas.
- source_word: וִיעוּשׁ
  choice: Jeús
  rationale: Forma tradicional em português para o nome יְעוּשׁ; a conjunção hebraica foi vertida conforme a coordenação natural da lista.
- source_word: וְיַעְלָם
  choice: Jalão
  rationale: Forma bíblica tradicional e reconhecível em português para יַעְלָם.
- source_word: וְקֹרַח
  choice: e Corá
  rationale: “Corá” é a forma portuguesa consagrada; preserva-se a conjunção no último item da enumeração.
