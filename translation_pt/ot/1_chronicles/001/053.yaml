lexical_decisions:
- source_word: אַלּוּף
  choice: chefe
  rationale: No contexto das listas edomitas, o termo designa o líder de um clã ou grupo tribal. “Chefe” é conciso, atual e preserva o formato repetitivo do hebraico; a nota registra o sentido mais explícito.
- source_word: קְנַז
  choice: Quenaz
  rationale: Nome próprio transliterado segundo a forma bíblica corrente e facilmente legível em português.
- source_word: תֵּימָן
  choice: Temã
  rationale: Neste contexto, funciona como nome próprio na lista de chefes edomitas; por isso, é transliterado, sem convertê-lo em designação regional.
- source_word: מִבְצָר
  choice: Mibzar
  rationale: Nome próprio transliterado, em vez de traduzido segundo seu possível sentido lexical.
