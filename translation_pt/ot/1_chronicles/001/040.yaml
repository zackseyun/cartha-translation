- source_word: בְּנֵי
  choice: Os filhos de
  rationale: Em uma genealogia, a expressão designa aqui os filhos nomeados diretamente; a formulação preserva o sentido literal e soa natural em português.
- source_word: שׁוֹבָל
  choice: Sobal
  rationale: Transliteração do nome próprio hebraico segundo convenções bíblicas correntes em português.
- source_word: עַלְיָן
  choice: Aliã
  rationale: Representa diretamente a forma de Crônicas; a variante Alvã, presente no paralelo de Gênesis 36:23, é registrada em nota.
- source_word: מָנַחַת
