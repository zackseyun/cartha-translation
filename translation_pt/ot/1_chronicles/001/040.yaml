  rationale: Representa a forma de Crônicas; a forma variante Sefô no paralelo de Gênesis é indicada em nota.
- source_word: אוֹנָם
  choice: Onã
  rationale: Transliteração portuguesa natural do nome próprio hebraico.
- source_word: צִבְעוֹן
  choice: Zibeão
  rationale: Forma adaptada à ortografia e pronúncia bíblica corrente em português.
- source_word: אַיָּה
  choice: Aiá
  rationale: Transliteração clara da forma hebraica para leitores de português.
- source_word: עֲנָה
  choice: Aná
  rationale: Transliteração direta e natural do nome hebraico.
- source_word: וְ / וּ / וַ
  choice: e
  rationale: As conjunções coordenam os nomes e as duas partes da genealogia; 'e' preserva essa estrutura sem acrescentar nuance interpretativa.
