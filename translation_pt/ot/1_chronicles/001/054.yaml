  yaml_path: translation/ot/1_chronicles/001/054.yaml
  text: Chief Magdiel[a], chief Iram. These were the chiefs of Edom.
translation:
  language: pt
  text: chefe Magdiel, chefe Irã. Esses foram os chefes de Edom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os chefes dos clãs de Edom”. O termo hebraico pode designar líderes tribais ou de clãs; versões antigas também empregam “duques”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּף
  choice: chefe
  rationale: No contexto das listas políticas e genealógicas de Edom, o termo designa um líder tribal ou de clã. “Chefe” é claro, atual e conciso, além de preservar a repetição do hebraico.
- source_word: מַגְדִּיאֵל
  choice: Magdiel
  rationale: Nome próprio transliterado segundo a forma tradicional e reconhecível em português, sem traduzir seu possível significado.
- source_word: עִירָם
  choice: Irã
  rationale: Nome próprio vertido na forma tradicional em português bíblico; o contexto impede confusão com o nome moderno do país.
- source_word: אֵלֶּה
  choice: Esses foram
  rationale: A oração hebraica não contém verbo expresso. O pretérito torna natural em português o resumo retrospectivo da lista anterior.
- source_word: אַלּוּפֵי אֱדֹם
  choice: os chefes de Edom
  rationale: A construção resume os nomes precedentes como líderes edomitas e mantém coerência lexical com as ocorrências anteriores de אַלּוּף.
