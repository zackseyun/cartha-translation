  text: וּ/בְנֵ֥י לוֹטָ֖ן חֹרִ֣י וְ/הוֹמָ֑ם וַ/אֲח֥וֹת לוֹטָ֖ן תִּמְנָֽע׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/039.yaml
  text: 'The sons of Lotan: Hori and Homam[a]; and Lotan’s sister was Timna.'
translation:
  language: pt
  text: 'Os filhos de Lotã: Hori e Homã[a]. A irmã de Lotã era Timna.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Na genealogia paralela de Gênesis 36:22, o nome aparece como Hemã, em vez de Homã.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: Os filhos de
  rationale: בְּנֵי é o plural construto de “filhos”; em genealogias, “os filhos de” é a forma portuguesa padrão. A conjunção prefixada pode ser representada pela continuidade do contexto, sem um “E” inicial pouco natural.
- source_word: לוֹטָן
  choice: Lotã
  rationale: Nome próprio transliterado segundo a forma hebraica e a convenção portuguesa de indicar com til a nasalização final.
- source_word: חֹרִי
  choice: Hori
  rationale: O contexto genealógico indica um nome pessoal, não o gentílico “horeu”.
- source_word: וְהוֹמָם
  choice: e Homã
  rationale: Preserva a forma הוֹמָם de Crônicas. A forma divergente de Gênesis 36:22 é registrada em nota, sem substituir a leitura do texto-base.
- source_word: וַאֲחוֹת לוֹטָן
  choice: A irmã de Lotã era
  rationale: אֲחוֹת significa “irmã”. O verbo “era”, ausente na frase nominal hebraica, é suprido naturalmente em português. A frase foi separada para tornar clara a informação genealógica.
- source_word: תִּמְנָע
  choice: Timna
  rationale: Transliteração do nome próprio conforme a forma consonantal deste versículo.
theological_decisions: []
