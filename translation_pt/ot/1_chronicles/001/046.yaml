  source_fidelity: 'O texto preserva adequadamente a sequência narrativa hebraica: a morte de Husã, a sucessão de Hadade, sua identificação pela ação contra Midiã em Moabe e o nome de sua cidade. “Feriu” reproduz de modo sóbrio e não excessivamente interpretativo o particípio de נכה; “território de Moabe” representa de modo natural o valor geográfico possível de שָׂדֶה neste contexto.'
