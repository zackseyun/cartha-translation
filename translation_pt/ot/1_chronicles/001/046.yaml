base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/046.yaml
  text: And Husham died[a], and Hadad son of Bedad reigned in his place, who struck Midian in the field of Moab; and the name of his city was Avith.
translation:
  language: pt
  text: Husã morreu, e Hadade, filho de Bedade, reinou em seu lugar. Foi ele quem feriu Midiã no território de Moabe. O nome de sua cidade era Avite[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Aiote”, transliteração alternativa do nome da cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: morreu
  rationale: Forma narrativa comum do verbo מות; a tradução direta evita eufemismo.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: reinou em seu lugar
  rationale: Expressa tanto o governo real indicado por מלך quanto a sucessão indicada por תחתיו.
- source_word: חוּשָׁם
  choice: Husã
  rationale: Transliteração portuguesa corrente do nome pessoal hebraico.
- source_word: הֲדַד בֶּן בְּדַד
  choice: Hadade, filho de Bedade
  rationale: Translitera os nomes segundo formas naturais em português e preserva explicitamente o patronímico בן.
- source_word: הַמַּכֶּה
  choice: Foi ele quem feriu
  rationale: O particípio identifica Hadade por uma ação notável; 'feriu' permanece próximo do sentido básico de נכה sem explicitar além do texto que ele derrotou ou exterminou Midiã.
- source_word: אֶת מִדְיָן
  choice: Midiã
  rationale: Mantém o nome próprio sem decidir se, neste contexto, designa primordialmente o povo ou seu território.
- source_word: בִּשְׂדֵה מוֹאָב
  choice: no território de Moabe
  rationale: שׂדה pode designar campo, região aberta ou território. Aqui 'território' comunica naturalmente o sentido geográfico em português.
- source_word: וְשֵׁם עִירוֹ
  choice: O nome de sua cidade era
  rationale: Reproduz com clareza a fórmula hebraica de identificação da cidade.
- source_word: עיות
  choice: Avite
  rationale: Adota a forma portuguesa tradicional do topônimo, registrando em nota a transliteração alternativa sugerida pela grafia hebraica desta passagem.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas onomásticas de boa legibilidade brasileira. A longa coordenação hebraica foi dividida em três frases para tornar a sucessão das informações natural, sem alterar suas relações. O marcador da nota foi colocado junto ao topônimo ao qual se refere.
