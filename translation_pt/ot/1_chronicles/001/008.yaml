base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/008.yaml
  text: 'The sons of Ham: Cush[a], Mizraim, Put[b], and Canaan.'
translation:
  language: pt
  text: 'Os filhos[a] de Cam: Cuxe, Mizraim[b], Pute e Canaã.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “descendentes de Cam”. A fórmula genealógica hebraica “filhos de” pode indicar filhos imediatos ou descendentes de gerações posteriores.
    reason: lexical_alternative
  - marker: b
    text: Hebraico “Mizraim”, nome tradicionalmente associado ao Egito. Aqui se conserva a transliteração porque o termo aparece numa lista genealógica como nome próprio ao lado de Cuxe, Pute e Canaã.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: filhos de
  rationale: Plural construto de בֵּן em fórmula genealógica. “Filhos de” é natural e preserva a forma hebraica, embora no contexto possa abranger descendentes posteriores.
- source_word: חָם
  choice: Cam
  rationale: Nome próprio vertido segundo a forma tradicional e amplamente reconhecida em português.
- source_word: כּוּשׁ
  choice: Cuxe
  rationale: Forma portuguesa tradicional do nome próprio hebraico; no contexto genealógico, pode designar um ancestral epônimo associado a um povo ou região.
- source_word: מִצְרַיִם
  choice: Mizraim
  rationale: Mantém o nome hebraico transliterado porque, nesta genealogia, ele aparece como nome próprio ou ancestral epônimo ao lado de Cuxe, Pute e Canaã, em vez de funcionar simplesmente como o topônimo “Egito”.
- source_word: פּוּט
  choice: Pute
  rationale: Forma portuguesa tradicional e clara do nome próprio hebraico.
- source_word: כְנָעַן
  choice: Canaã
  rationale: Forma portuguesa consagrada do nome próprio; aqui funciona como nome do ancestral epônimo na genealogia.
