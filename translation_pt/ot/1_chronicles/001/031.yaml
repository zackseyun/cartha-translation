  yaml_path: translation/ot/1_chronicles/001/031.yaml
  text: Jetur[a], Naphish, and Kedemah. These were the sons of Ishmael.
translation:
  language: pt
  text: Jetur, Nafis e Quedemá.[a] Estes foram os filhos de Ismael.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome Quedemá também pode ser transliterado como “Qedemá”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְטוּר
  choice: Jetur
  rationale: Nome próprio transliterado na forma consagrada em português bíblico.
- source_word: נָפִישׁ
  choice: Nafis
  rationale: Nome próprio transliterado de modo natural em português, representando o som de שׁ por “s”.
- source_word: וָ/קֵדְמָה
  choice: e Quedemá
  rationale: A conjunção ו é traduzida por “e”; o nome próprio קֵדְמָה recebe a forma portuguesa corrente “Quedemá”, com acento para indicar a tonicidade final.
- source_word: אֵלֶּה הֵם
  choice: Estes foram
  rationale: A cláusula nominal hebraica identifica e resume os nomes anteriores; o passado é natural no contexto genealógico em português.
- source_word: בְּנֵי
  choice: filhos de
  rationale: O construto significa literalmente “filhos de” e, neste contexto, designa os filhos homens de Ismael enumerados na genealogia.
- source_word: יִשְׁמָעֵאל
  choice: Ismael
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
