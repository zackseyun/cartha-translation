base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/042.yaml
  text: 'The sons of Ezer: Bilhan[a], Zaavan, and Jaakan[b]. The sons of Dishon: Uz and Aran.'
translation:
  language: pt
  text: 'Os filhos de Ezer: Bilã, Zaavã e Jaacã[a]. Os filhos de Disom: Uz e Arã.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em Gênesis 36:27, a genealogia paralela traz Acã.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי
  choice: Os filhos de
  rationale: Plural construto de בֵּן, usado aqui para introduzir os filhos imediatos numa genealogia; esta é a forma mais direta e natural em português.
- source_word: אֵצֶר
  choice: Ezer
  rationale: Nome próprio transliterado de modo claro e reconhecível em português.
- source_word: בִּלְהָן
  choice: Bilã
  rationale: Transliteração portuguesa do nome próprio, com a terminação nasal indicada de forma natural.
- source_word: זַעֲוָן
  choice: Zaavã
  rationale: Transliteração que representa as sílabas do hebraico e mantém o nome reconhecível em português.
- source_word: יַעֲקָן
  choice: Jaacã
  rationale: Transliteração da forma específica de Crônicas; a variante da genealogia paralela é indicada em nota.
- source_word: דִישׁוֹן
  choice: Disom
  rationale: Transliteração portuguesa que distingue דִישׁוֹן (Dishon) do nome semelhante דִישָׁן (Dishan), vertido como Disã.
- source_word: עוּץ
  choice: Uz
  rationale: Forma tradicional e amplamente reconhecida em português para o nome hebraico.
- source_word: אֲרָן
  choice: Arã
  rationale: Transliteração portuguesa natural do nome próprio hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com a estrutura genealógica concisa do hebraico preservada. Os nomes seguem formas de boa legibilidade em português. A nota proposta na camada inglesa sobre Zaavã não foi reproduzida, pois o texto hebraico massorético de Gênesis 36:27 apresenta o mesmo nome זַעֲוָן; não há ali uma variante textual a preservar. A variante real, יַעֲקָן em Crônicas versus עֲקָן em Gênesis, foi registrada na nota.
