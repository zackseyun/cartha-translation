  text: וּ/לְ/עֵ֥בֶר יֻלַּ֖ד שְׁנֵ֣י בָנִ֑ים שֵׁ֣ם הָ/אֶחָ֞ד פֶּ֗לֶג כִּ֤י בְ/יָמָי/ו֙ נִפְלְגָ֣ה הָ/אָ֔רֶץ וְ/שֵׁ֥ם אָחִ֖י/ו יָקְטָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/019.yaml
  text: 'And to Eber were born two sons: the name of the one was Peleg[a], because in his days the earth was divided; and his brother’s name was Joktan.'
translation:
  language: pt
  text: 'E a Éber nasceram dois filhos: o nome de um era Pelegue[a], porque em seus dias a terra foi dividida; e o nome de seu irmão era Joctã.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o território foi dividido”. O termo hebraico pode referir-se à terra inteira ou a uma terra ou território; o texto não especifica a natureza da divisão.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וּלְעֵבֶר
  choice: E a Éber
  rationale: Preserva a conjunção, a construção indireta com a preposição e o fluxo genealógico.
- source_word: יֻלַּד שְׁנֵי בָנִים
  choice: nasceram dois filhos
  rationale: Expressa naturalmente em português o passivo de ילד, tendo 'dois filhos' como sujeito semântico plural.
- source_word: שֵׁם הָאֶחָד
  choice: o nome de um era
  rationale: Mantém a distinção hebraica entre os dois filhos sem interpretar אֶחָד como 'primeiro'.
- source_word: פֶּלֶג
  choice: Pelegue
  rationale: Transliteração portuguesa clara do nome hebraico, preservando sua forma e a relação sonora com o verbo subsequente.
- source_word: כִּי בְיָמָיו
  choice: porque em seus dias
  rationale: Torna explícita a função causal de כִּי na explicação do nome.
- source_word: נִפְלְגָה הָאָרֶץ
  choice: a terra foi dividida
  rationale: Conserva o sentido amplo de אֶרֶץ e o passivo de פלג, sem especificar a natureza da divisão.
- source_word: וְשֵׁם אָחִיו
  choice: e o nome de seu irmão
  rationale: Reproduz com naturalidade a relação possessiva e o paralelismo da frase hebraica.
- source_word: יָקְטָן
  choice: Joctã
  rationale: Forma portuguesa tradicional e amplamente reconhecível do nome hebraico.
theological_decisions:
- issue: Sentido de 'a terra foi dividida' na explicação do nome Pelegue
  choice: Manter a formulação ampla 'a terra foi dividida'.
  alternative: Traduzir 'aquela terra foi dividida' ou explicitar uma divisão de povos, línguas ou território.
  rationale: O hebraico não define a extensão nem a natureza da divisão. A tradução preserva essa ambiguidade e não introduz uma identificação específica com Babel ou com uma divisão geográfica.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe próxima do hebraico sem rigidez. 'Éber', 'Pelegue' e 'Joctã' seguem formas portuguesas reconhecíveis; a nota preserva a amplitude semântica de אֶרֶץ.
