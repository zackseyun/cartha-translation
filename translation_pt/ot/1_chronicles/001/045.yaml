base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/045.yaml
  text: And Yobab died[b][a], and Husham from the land of the Temanites reigned in his place.
translation:
  language: pt
  text: Jobabe morreu, e Husão, da terra dos temanitas[a], reinou em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da terra de Temã” ou “da terra do temanita”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: morreu
  rationale: O wayyiqtol de מות dá continuidade à sequência narrativa; em português, o sujeito expresso, “Jobabe”, torna a frase clara e natural.
- source_word: יוֹבָב
  choice: Jobabe
  rationale: Forma tradicional e amplamente reconhecível em português para o nome hebraico Yovav, adaptada à fonologia portuguesa.
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: Neste contexto de sucessão régia, מלך indica que Husão assumiu o reinado e governou; “reinou” preserva a fórmula concisa do hebraico.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: A expressão indica substituição ou sucessão direta e é idiomática em português.
- source_word: חוּשָׁם
  choice: Husão
  rationale: Transliteração portuguesa tradicional e legível do nome hebraico Ḥusham.
- source_word: מֵאֶרֶץ
  choice: da terra
  rationale: A preposição מן com אֶרֶץ indica procedência geográfica; “da terra” expressa isso naturalmente.
- source_word: הַתֵּימָנִי
  choice: dos temanitas
  rationale: O gentílico definido singular pode funcionar coletivamente após “terra”; a forma plural produz uma leitura natural em português, enquanto a nota preserva as outras análises possíveis.
