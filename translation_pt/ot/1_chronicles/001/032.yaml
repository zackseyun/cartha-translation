base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/032.yaml
  text: 'And the sons of Keturah[a], Abraham’s concubine: she bore Zimran, Jokshan, Medan, Midian, Ishbak, and Shuah. And the sons of Jokshan: Sheba and Dedan.'
translation:
  language: pt
  text: 'E os filhos de Quetura[a], concubina de Abraão: ela deu à luz Zinrã, Jocsã, Medã, Midiã, Isbaque e Suá. E os filhos de Jocsã: Sebá e Dedã.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gênesis 25:1 chama Quetura de esposa de Abraão; aqui o cronista a chama especificamente de concubina.
    reason: Referência cruzada que preserva e esclarece a diferença terminológica entre as passagens.
lexical_decisions:
- source_word: וּבְנֵי
  choice: E os filhos de
  rationale: Preserva tanto o sentido construto de בְּנֵי como a conjunção que dá continuidade à sequência genealógica.
- source_word: קְטוּרָה
  choice: Quetura
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: פִּילֶגֶשׁ
  choice: concubina
  rationale: Expressa a união reconhecida, mas de condição inferior à da esposa principal, sem harmonizar o termo com Gênesis 25:1.
- source_word: יָלְדָה
  choice: ela deu à luz
  rationale: O verbo feminino singular retoma Quetura; a explicitação do pronome torna a relação clara e natural em português.
- source_word: זִמְרָן
  choice: Zinrã
  rationale: Transliteração portuguesa tradicional do nome próprio.
- source_word: יָקְשָׁן
  choice: Jocsã
  rationale: Forma convencional do nome em traduções portuguesas.
- source_word: מְדָן
  choice: Medã
  rationale: Forma portuguesa convencional do nome próprio.
- source_word: מִדְיָן
  choice: Midiã
  rationale: Forma portuguesa tradicional e reconhecível.
- source_word: יִשְׁבָּק
  choice: Isbaque
  rationale: Forma aportuguesada que representa o nome hebraico com clareza.
- source_word: שׁוּחַ
  choice: Suá
  rationale: Forma tradicional portuguesa do nome neste contexto genealógico.
- source_word: שְׁבָא
  choice: Sabá
  rationale: Forma consagrada em português para o nome hebraico.
- source_word: דְדָן
  choice: Dedã
  rationale: Forma tradicional portuguesa do nome próprio.
theological_decisions:
- issue: Condição de Quetura em relação a Abraão
  choice: concubina
  alternative: esposa; esposa secundária
  rationale: O texto hebraico deste versículo emprega explicitamente פִּילֶגֶשׁ. A tradução mantém esse termo sem o harmonizar com Gênesis 25:1, preservando a tensão entre as passagens.
