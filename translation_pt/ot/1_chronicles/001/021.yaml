lexical_decisions:
- source_word: הֲדוֹרָם
  choice: Hadorão
  rationale: Nome próprio transliterado segundo a forma tradicional e natural em português, refletindo o hebraico Hădôrām.
- source_word: אוּזָל
  choice: Uzal
  rationale: Nome próprio transliterado diretamente do hebraico, em forma clara e corrente em português.
- source_word: דִּקְלָה
  choice: Dicla
  rationale: Nome próprio transliterado em ortografia portuguesa; a letra final ה integra a vocalização final do nome, não exigindo um h gráfico em português.
- source_word: וְ/אֶת ... וְ/אֶת ... וְ/אֶת
  choice: lista simples, com «e» antes do último nome
  rationale: O hebraico repete a conjunção e o marcador de objeto antes de cada nome. Em português, a coordenação natural preserva o sentido por meio de uma lista, sem reproduzir de modo artificial cada elemento gramatical.
