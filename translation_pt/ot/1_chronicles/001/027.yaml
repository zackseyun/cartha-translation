lexical_decisions:
- source_word: אַבְרָם
  choice: Abrão
  rationale: Nome próprio apresentado na forma tradicional e amplamente reconhecida em português.
- source_word: הוּא
  choice: isto é
  rationale: Embora o pronome independente signifique literalmente “ele”, nesta oração nominal entre dois nomes ele funciona como fórmula de identificação; “isto é” expressa essa função com naturalidade em português.
- source_word: אַבְרָהָם
  choice: Abraão
  rationale: Nome próprio apresentado na forma tradicional e amplamente reconhecida em português; o texto identifica Abrão pelo nome Abraão.
theological_decisions:
- issue: Tradução da fórmula nominal de identificação no contexto genealógico
  choice: Abrão — isto é, Abraão.
  alternative: 'Abrão, ele é Abraão; ou: Abrão é Abraão.'
  rationale: O hebraico liga os dois nomes pelo pronome הוּא, sem verbo expresso. “Isto é” comunica de modo natural a identificação explicativa, sem acrescentar interpretação teológica.
translation_notes:
  register: Português moderno, claro e digno, com formas tradicionais dos nomes bíblicos. O travessão assinala a identificação explicativa, e a nota preserva as traduções mais formais da oração nominal hebraica.
