  text: Chief Oholibamah[a], chief Elah, chief Pinon.
translation:
  language: pt
  text: O chefe Oolibama[a], o chefe Elá, o chefe Pinom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chefe de clã”. Traduções antigas também empregam “duque”, termo hoje potencialmente enganoso.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּף
  choice: chefe
  rationale: Na lista edomita, o termo designa o líder de um clã ou grupo tribal. “Chefe” é conciso, atual e preserva a fórmula titular repetida.
- source_word: אָהֳלִיבָמָה
  choice: Oolibama
  rationale: O nome próprio é transliterado de acordo com uma forma corrente e legível em português bíblico.
- source_word: אֵלָה
  choice: Elá
  rationale: Transliteração do nome próprio hebraico, com acento gráfico para indicar a pronúncia final tônica em português.
- source_word: פִּינֹן
  choice: Pinom
  rationale: Transliteração adaptada à ortografia portuguesa, na qual o m final representa a nasalização.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com repetição deliberada do título conforme a estrutura hebraica. Os nomes seguem formas portuguesas legíveis.
