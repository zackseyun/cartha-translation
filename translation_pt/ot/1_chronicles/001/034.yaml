base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/034.yaml
  text: 'Abraham fathered Isaac[a]. The sons of Isaac: Esau and Israel.'
translation:
  language: pt
  text: Abraão gerou Isaque. Os filhos de Isaque foram Esaú e Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Israel, isto é, Jacó.
    reason: Esclarece que o nome Israel se refere aqui a Jacó, sem substituir no texto principal a forma hebraica explicitamente usada.
lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: gerou
  rationale: No hifil de ילד em contexto genealógico, indica que Abraão se tornou pai de Isaque; “gerou” é conciso, natural e tradicional sem ser obscuro.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: É a partícula que marca o objeto direto definido e não possui equivalente lexical independente em português.
- source_word: בְּנֵי
  choice: Os filhos de
  rationale: Plural em estado construto de בן, introduzindo a geração seguinte da genealogia.
- source_word: עֵשָׂו
  choice: Esaú
  rationale: Forma consagrada do nome pessoal em português.
- source_word: וְיִשְׂרָאֵל
  choice: e Israel
  rationale: Preserva o nome que aparece explicitamente no texto hebraico, em vez de substituí-lo por “Jacó”.
theological_decisions:
- issue: Tradução de יִשְׂרָאֵל numa genealogia em que a pessoa referida é Jacó
  choice: Israel
  alternative: Jacó
  rationale: O hebraico nomeia os filhos de Isaque como “Esaú e Israel”. Embora Israel seja Jacó, manter o nome presente no texto evita uma harmonização interpretativa; a nota esclarece a identidade.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. A forma verbal “foram” foi acrescentada para dar fluidez à fórmula genealógica nominal, sem alterar seu sentido.
