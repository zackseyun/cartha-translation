base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/033.yaml
  text: 'The sons of Midian: Ephah[a], Epher, Hanoch, Abida, and Eldaah. All these were the sons of Keturah.'
translation:
  language: pt
  text: 'Os filhos de Midiã: Efá, Éfer, Enoque, Abida e Eldaá. Todos estes foram filhos de Quetura.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי מִדְיָן
  choice: Os filhos de Midiã
  rationale: O plural construto de בֵּן é vertido naturalmente como “os filhos de”; a conjunção inicial não precisa ser explicitada no começo deste item genealógico em português.
- source_word: עֵיפָה
  choice: Efá
  rationale: Forma tradicional e reconhecível do nome hebraico em português bíblico.
- source_word: וָעֵפֶר
  choice: Éfer
  rationale: Transliteração portuguesa clara do nome próprio; a conjunção hebraica é representada pela estrutura da enumeração.
- source_word: וַחֲנוֹךְ
  choice: Enoque
  rationale: Forma tradicional portuguesa de חֲנוֹךְ, amplamente reconhecida e adequada ao registro bíblico.
- source_word: וַאֲבִידָע
  choice: Abida
  rationale: Transliteração direta do nome próprio hebraico, sem acrescentar um h final sem valor fonético em português.
- source_word: וְאֶלְדָּעָה
  choice: e Elda
  rationale: A conjunção é expressa no último elemento da lista; “Elda” reproduz o nome em forma natural para leitores de português.
- source_word: כָּל אֵלֶּה
  choice: Todos esses
  rationale: Equivalência direta e idiomática da expressão demonstrativa que retoma os nomes enumerados.
- source_word: בְּנֵי קְטוּרָה
  choice: foram filhos de Quetura
  rationale: O verbo “foram” é suprido para formar uma oração portuguesa completa; “filhos de Quetura” preserva a relação genealógica do construto hebraico.
