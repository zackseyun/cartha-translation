lexical_decisions:
- source_word: וּ/כְנַעַן
  choice: E Canaã
  rationale: Translitera o nome próprio conforme a forma portuguesa consagrada e preserva a conjunção que dá continuidade à genealogia.
- source_word: יָלַד
  choice: gerou
  rationale: No contexto genealógico e com sujeito masculino, expressa a geração ou paternidade; “gerou” é conciso, corrente em genealogias bíblicas e fiel ao sentido.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: É o marcador hebraico de objeto direto definido e não possui equivalente independente necessário em português.
- source_word: צִידוֹן
  choice: Sidom
  rationale: Emprega a forma tradicional e amplamente reconhecida em português para o nome próprio.
- source_word: בְּכֹר/וֹ
  choice: seu primogênito
  rationale: Preserva de modo direto tanto a relação possessiva quanto a ênfase hebraica na ordem de nascimento.
- source_word: וְ/אֶת
  choice: e
  rationale: A conjunção introduz o segundo descendente; o marcador de objeto direto não requer tradução separada.
- source_word: חֵת
  choice: Hete
  rationale: Mantém o nome pessoal do ancestral mencionado no texto, sem substituí-lo interpretativamente pelo nome do povo hitita.
