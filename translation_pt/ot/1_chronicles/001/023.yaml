  text: וְ/אֶת אוֹפִ֥יר וְ/אֶת חֲוִילָ֖ה וְ/אֶת יוֹבָ֑ב כָּל אֵ֖לֶּה בְּנֵ֥י יָקְטָֽן־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/023.yaml
  text: and Ophir[a], Havilah, and Jobab. All these were the sons of Joktan.
translation:
  language: pt
  text: e Ofir, Havilá e Jobabe. Todos esses foram filhos de Joctã.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “descendentes de Joctã”. O hebraico diz “filhos de Joctã”, mas, em contextos genealógicos, “filhos” pode às vezes indicar uma linhagem mais ampla.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: e
  rationale: אֵת é o marcador de objeto direto e não recebe tradução independente; o וְ coordena os últimos nomes da lista e é vertido naturalmente por “e”.
- source_word: אוֹפִיר
  choice: Ofir
  rationale: Nome próprio transliterado segundo a forma bíblica tradicional e reconhecível em português.
- source_word: חֲוִילָה
  choice: Havilá
  rationale: Nome próprio transliterado em forma corrente nas Bíblias em português, com acento para indicar a pronúncia.
- source_word: יוֹבָב
  choice: Jobabe
  rationale: Nome próprio apresentado na forma tradicional e reconhecível em português.
- source_word: כָּל אֵלֶּה
  choice: Todos esses
  rationale: Resume enfaticamente os nomes anteriores e reproduz de modo natural o sentido do quantificador com o demonstrativo.
- source_word: בְּנֵי
  choice: filhos de
  rationale: O hebraico emprega o plural masculino construto de בֵּן. “Filhos de” preserva a formulação explícita, embora em genealogias o termo possa abranger descendentes.
- source_word: יָקְטָן
  choice: Joctã
  rationale: Forma bíblica tradicional em português, escolhida por reconhecibilidade e legibilidade.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas tradicionais dos nomes próprios. A repetição hebraica do marcador de objeto não foi reproduzida, pois não tem equivalente natural em português. O marcador da nota foi colocado após a afirmação a que se refere.
