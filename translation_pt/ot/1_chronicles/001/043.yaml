base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/043.yaml
  text: 'And these are the kings who reigned in the land of Edom before any king reigned over the sons of Israel: Bela son of Beor, and the name of his city was Dinhabah.'
translation:
  language: pt
  text: 'E estes são os reis que reinaram na terra de Edom antes que um rei reinasse sobre os filhos de Israel[a]: Bela, filho de Beor, e o nome da sua cidade era Dinabá.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “antes que algum rei reinasse sobre os filhos de Israel”. O hebraico diz literalmente: “antes do reinar de um rei para/sobre os filhos de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: E estes são
  rationale: Mantém a conjunção que liga o versículo à sequência genealógica e reproduz de modo natural a fórmula hebraica de apresentação.
- source_word: הַמְּלָכִים אֲשֶׁר מָלְכוּ
  choice: os reis que reinaram
  rationale: Conserva a relação lexical entre “reis” e “reinaram” e expressa com clareza o exercício da realeza.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: na terra de Edom
  rationale: Retém o substantivo explícito “terra” sem prejudicar a naturalidade em português.
- source_word: לִפְנֵי מְלָךְ מֶלֶךְ
  choice: antes que um rei reinasse
  rationale: Traduz de perto a construção com o infinitivo do verbo “reinar” e o substantivo singular “rei”, em português claro e idiomático.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: sobre os filhos de Israel
  rationale: “Sobre” explicita a relação de governo indicada no contexto, enquanto “filhos de Israel” preserva a expressão hebraica.
- source_word: בֶּלַע בֶּן בְּעוֹר
  choice: Bela, filho de Beor
  rationale: Emprega as formas tradicionais dos nomes em português e pontuação natural para a relação filial.
- source_word: וְשֵׁם עִירוֹ דִּנְהָבָה
  choice: o nome da sua cidade era Dinabá
  rationale: Expressa naturalmente a oração nominal hebraica e usa a forma portuguesa tradicional do topônimo.
theological_decisions:
- issue: Se a frase indica um rei individual ou a existência da monarquia em Israel
  choice: antes que um rei reinasse sobre os filhos de Israel
  alternative: antes que algum rei reinasse sobre os filhos de Israel
  rationale: O hebraico usa o singular indefinido “rei” e pode referir-se à instituição da monarquia, sem identificar um rei específico. O texto principal mantém o singular, e a nota registra a leitura distributiva possível sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A abertura com “E” preserva a continuidade da lista. A pontuação evita uma repetição desnecessária da conjunção antes da informação sobre a cidade.
