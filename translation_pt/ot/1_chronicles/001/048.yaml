base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/048.yaml
  text: Samlah died[a], and Shaul from Rehoboth by the River reigned in his place.
translation:
  language: pt
  text: Samlá morreu, e Saul, de Reobote, junto ao Rio[a], reinou em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o rio”; muitos entendem que se trata do Eufrates.
    reason: Preserva a leitura literal com o artigo definido e informa a identificação geográfica frequente sem inseri-la no texto principal.
lexical_decisions:
- source_word: וַיָּמָת
  choice: morreu
  rationale: O qal wayyiqtol de מות indica diretamente a morte; “morreu” é claro, natural e evita eufemismo desnecessário.
- source_word: שַׂמְלָה
  choice: Samlá
  rationale: Forma portuguesa clara do nome próprio hebraico, com acento gráfico para indicar a tonicidade final.
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: מלך, nesta fórmula de sucessão real, é vertido naturalmente por “reinou”, preservando a concisão narrativa.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: תחת com sufixo pronominal expressa substituição ou sucessão; “em seu lugar” comunica isso de modo idiomático.
- source_word: שָׁאוּל
  choice: Saul
  rationale: “Saul” é a forma portuguesa convencional do nome hebraico שָׁאוּל; o contexto identifica claramente este personagem como rei edomita.
- source_word: מֵרְחֹבוֹת
  choice: de Reobote
  rationale: O prefixo מ־ indica procedência ou associação, e Reobote é tratado como topônimo.
- source_word: הַנָּהָר
  choice: o Rio
  rationale: A expressão significa literalmente “o rio” e pode funcionar como designação geográfica conhecida. A inicial maiúscula preserva essa provável força toponímica sem explicitar “Eufrates”, que não aparece no hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe concisa própria de uma fórmula narrativa de sucessão. A vírgula em torno da expressão de procedência facilita a leitura, e “junto ao Rio” expressa localização sem sugerir que a cidade ficava sobre as águas.
