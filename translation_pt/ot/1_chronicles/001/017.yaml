base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/017.yaml
  text: 'The sons of Shem: Elam[a], Asshur, Arpachshad, Lud, and Aram; Uz, Hul, Gether, and Meshech.'
translation:
  language: pt
  text: 'Os filhos de Sem foram: Elão, Assur, Arfaxade, Lude e Arã; Uz, Hul, Géter e Meseque.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Na genealogia paralela, Gênesis 10:23 traz “Mas” em vez de “Meseque”.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי
  choice: Os filhos de
  rationale: O plural construto de בֵּן introduz a genealogia. “Os filhos de” reproduz diretamente a formulação hebraica sem ampliar o sentido para “descendentes”.
- source_word: שֵׁם
  choice: Sem
  rationale: Forma tradicional e amplamente reconhecida em português para o nome próprio hebraico.
- source_word: עֵילָם
  choice: Elão
  rationale: Forma portuguesa consagrada do nome próprio/topônimo hebraico.
- source_word: אַשּׁוּר
  choice: Assur
  rationale: No contexto genealógico, designa o ancestral nomeado, não primariamente o território posterior da Assíria.
- source_word: אַרְפַּכְשַׁד
  choice: Arfaxade
  rationale: Forma bíblica tradicional e inteligível em português para o nome hebraico.
- source_word: לוּד
  choice: Lude
  rationale: Representa o nome próprio singular hebraico, sem confundi-lo com o etnônimo plural “luditas”.
- source_word: אֲרָם
  choice: Arã
  rationale: Mantém o nome do ancestral no contexto genealógico, em vez de substituí-lo pela designação territorial posterior “Síria”.
- source_word: עוּץ
  choice: Uz
  rationale: Transliteração portuguesa clara e amplamente usada do nome próprio.
- source_word: חוּל
  choice: Hul
  rationale: Transliteração direta e legível do nome próprio hebraico.
- source_word: גֶתֶר
  choice: Géter
  rationale: Transliteração adaptada à pronúncia e à acentuação naturais do português.
- source_word: מֶשֶׁךְ
  choice: Meseque
  rationale: Traduz a leitura do Texto Massorético de 1 Crônicas 1:17; a leitura diferente da genealogia paralela é preservada em nota.
theological_decisions:
- issue: Relação de Uz, Hul, Géter e Meseque com Arã
  choice: Preservar a sequência e a divisão sugerida pelo texto hebraico mediante ponto e vírgula, sem acrescentar “filhos de Arã”
  alternative: Inserir “os filhos de Arã foram”, conforme a formulação explícita de Gênesis 10:23
  rationale: O Texto Massorético de 1 Crônicas 1:17 não repete a expressão “filhos de Arã”. Acrescentá-la resolveria uma tensão do texto com base no paralelo; a tradução conserva a forma efetivamente atestada e usa pontuação para tornar a lista legível.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas tradicionais dos nomes bíblicos quando consolidadas. O verbo “foram” foi acrescentado por naturalidade sintática em português. O ponto e vírgula preserva a divisão perceptível da lista sem inserir palavras ausentes do hebraico.
