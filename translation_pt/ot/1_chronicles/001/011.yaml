  yaml_path: translation/ot/1_chronicles/001/011.yaml
  text: Mizraim fathered the Ludites[a], the Anamites, the Lehabites, and the Naphtuhites.
translation:
  language: pt
  text: Mizraim gerou Ludim, Anamim, Leabim e Naftuim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִצְרַיִם
  choice: Mizraim
  rationale: Na genealogia, o termo funciona como nome próprio de um ancestral; por isso, foi transliterado, em vez de traduzido como o topônimo “Egito”.
- source_word: יָלַד
  choice: gerou
  rationale: No contexto genealógico, indica procriação ou descendência ancestral. “Gerou” é a formulação portuguesa tradicional, clara e concisa, e preserva o enquadramento masculino do hebraico.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: É uma partícula que marca o objeto direto definido e não possui equivalente lexical independente em português; sua função é expressa pela sintaxe.
- source_word: לודיים
  choice: luditas
  rationale: Forma portuguesa natural para designar o povo descendente de Mizraim; a transliteração mais direta “Ludim” é registrada em nota.
- source_word: עֲנָמִים
  choice: anamitas
  rationale: Gentílico português formado de modo paralelo aos demais nomes da lista, favorecendo a leitura sem ocultar a forma hebraica alternativa.
- source_word: לְהָבִים
  choice: leabitas
  rationale: Gentílico português legível, baseado na forma hebraica, com a transliteração mais direta preservada em nota.
- source_word: נַפְתֻּחִים
  choice: naftuítas
  rationale: Gentílico português que representa de modo natural o nome do grupo; “Naftuim” permanece disponível como transliteração mais direta.
