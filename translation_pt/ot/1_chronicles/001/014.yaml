  text: the Jebusites[a], the Amorites, and the Girgashites.
translation:
  language: pt
  text: os jebuseus[a], os amorreus e os girgaseus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em hebraico, os gentílicos aparecem no singular, mas são empregados coletivamente para designar estes povos: jebuseus, amorreus e girgaseus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְבוּסִי
  choice: os jebuseus
  rationale: Embora a forma gentílica hebraica seja singular, ela tem sentido coletivo nesta lista genealógica; o plural é a forma natural em português para designar esse povo.
- source_word: הָאֱמֹרִי
  choice: os amorreus
  rationale: O gentílico singular hebraico designa coletivamente o povo; o plural português preserva essa função e se ajusta ao estilo da lista.
- source_word: הַגִּרְגָּשִׁי
  choice: os girgaseus
  rationale: A forma hebraica singular é coletiva. O etnônimo plural «girgaseus» é claro e tradicional em português.
- source_word: וְאֶת / וְאֵת
  choice: e
  rationale: A conjunção é traduzida na coordenação da lista, enquanto o marcador hebraico de objeto direto não recebe equivalente explícito em português; a repetição é expressa naturalmente por vírgulas e pelo «e» final.
