  text: וְ/כ֖וּשׁ יָלַ֣ד אֶת נִמְר֑וֹד ה֣וּא הֵחֵ֔ל לִ/הְי֥וֹת גִּבּ֖וֹר בָּ/אָֽרֶץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/010.yaml
  text: And Cush fathered Nimrod[a]; he began to be a mighty one in the land.
translation:
  language: pt
  text: E Cuxe gerou Ninrode; ele começou a ser um poderoso na terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no país” ou “naquela terra”. O hebraico אֶרֶץ pode significar “terra”, em sentido amplo, ou uma terra ou região específica.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כּוּשׁ
  choice: E Cuxe
  rationale: A conjunção liga esta informação à genealogia anterior. O nome próprio é apresentado na forma portuguesa corrente, “Cuxe”.
- source_word: יָלַד
  choice: gerou
  rationale: No contexto genealógico, o verbo indica procriação ou paternidade. “Gerou” é conciso, corrente em genealogias bíblicas e próximo da forma hebraica.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: É o marcador hebraico do objeto direto definido e não requer uma palavra correspondente em português.
- source_word: נִמְרֹד
  choice: Ninrode
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: הוּא
  choice: ele
  rationale: O pronome independente retoma Ninrode com alguma ênfase; “ele” preserva essa retomada sem torná-la artificial.
- source_word: הֵחֵל
  choice: começou
  rationale: O hifil de חלל seguido de infinitivo normalmente significa “começar”. A tradução mantém essa construção sem decidir se Ninrode foi o primeiro de sua espécie.
- source_word: לִהְיוֹת
  choice: a ser
  rationale: O infinitivo de היה significa “ser” ou, conforme o contexto, “tornar-se”. Com “começou”, “a ser” reproduz de modo natural a construção hebraica.
- source_word: גִּבּוֹר
  choice: um poderoso
  rationale: O termo pode designar alguém poderoso, valente, heroico ou guerreiro. “Um poderoso” mantém a caracterização ampla e evita restringi-la indevidamente ao âmbito militar.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: אֶרֶץ pode significar uma terra ou região, ou a terra em sentido mais amplo. “Na terra” é natural em português e preserva certa abertura sem explicitar um alcance universal; a alternativa é indicada em nota.
theological_decisions:
- issue: Alcance de בָּאָרֶץ na descrição da proeminência de Ninrode
  choice: na terra
  alternative: no país / naquela terra
  rationale: O substantivo hebraico pode ter alcance local ou mais amplo, e o versículo não o determina de modo inequívoco. O texto principal mantém a formulação portuguesa tradicional e ampla, enquanto a nota registra a possibilidade regional.
- issue: Sentido da afirmação הֵחֵל לִהְיוֹת גִּבּוֹר
  choice: começou a ser um poderoso
  alternative: foi o primeiro a tornar-se poderoso
  rationale: Embora a construção possa ser entendida de modo ingressivo ou pioneiro, a forma escolhida acompanha mais diretamente o hebraico e não acrescenta a ideia explícita de que Ninrode tenha sido o primeiro.
translation_notes:
  register: Português moderno, digno e acessível, com cadência adequada a uma genealogia. “Gerou” conserva o estilo genealógico bíblico; “um poderoso” evita tanto o arcaísmo de “varão valente” quanto a especificação militar de “guerreiro”.
