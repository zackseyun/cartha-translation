lexical_decisions:
- source_word: וְ/אֶת
  choice: e / coordenação por vírgulas
  rationale: A conjunção וְ com o marcador de objeto אֶת introduz cada nome da lista. Em português, o marcador não é traduzido, e a coordenação é expressa por vírgula e pelo «e» antes do último nome.
- source_word: עֵיבָל
  choice: Ebal
  rationale: Nome próprio transliterado da forma hebraica do texto massorético. A forma «Obal» na genealogia paralela de Gênesis 10:28 é preservada em nota.
- source_word: אֲבִימָאֵל
  choice: Abimael
  rationale: Transliteração tradicional e transparente do nome próprio hebraico.
- source_word: שְׁבָא
  choice: Sabá
  rationale: Forma portuguesa tradicional para o nome hebraico שְׁבָא, distinguindo-o do nome semelhante סְבָא, normalmente vertido como «Sebá».
