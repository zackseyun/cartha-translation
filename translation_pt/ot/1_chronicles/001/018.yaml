base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/018.yaml
  text: Arpachshad fathered Shelah[b][a], and Shelah fathered Eber.
translation:
  language: pt
  text: Arfaxade[a] gerou Selá[b], e Selá gerou Éber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico Arpachshad; «Arfaxade» é a forma tradicional em português, influenciada pela forma grega do nome.
    reason: lexical_alternative
  - marker: b
    text: Hebraico Selá; algumas traduções usam a forma tradicional Salá.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְפַּכְשַׁד
  choice: Arfaxade
  rationale: Forma tradicional e amplamente reconhecível em português, correspondente ao nome hebraico Arpakshad e mediada pela tradição grega; evita uma transliteração pouco familiar sem alterar a identificação da pessoa.
- source_word: יָלַד
  choice: gerou
  rationale: No contexto genealógico e com sujeito masculino, expressa de modo conciso e digno a descendência paterna. É a formulação corrente nas genealogias bíblicas em português.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: Marcador hebraico de objeto direto, cuja função é representada pela sintaxe portuguesa.
- source_word: שָׁלַח / שֶׁלַח
  choice: Selá
  rationale: Transliteração portuguesa próxima das duas formas vocalizadas do mesmo nome no texto massorético. As pequenas diferenças de vocalização não indicam pessoas distintas.
- source_word: עֵבֶר
  choice: Éber
  rationale: Transliteração portuguesa direta do hebraico, com acento gráfico para indicar a pronúncia paroxítona natural do nome.
