  text: וּ/בְנֵ֣י כ֔וּשׁ סְבָא֙ וַ/חֲוִילָ֔ה וְ/סַבְתָּ֥א וְ/רַעְמָ֖א וְ/סַבְתְּכָ֑א וּ/בְנֵ֥י רַעְמָ֖א שְׁבָ֥א וּ/דְדָֽן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/009.yaml
  text: 'The sons of Cush: Seba[a], Havilah, Sabta, Raama, and Sabteca[c][b]. And the sons of Raama: Sheba and Dedan.'
translation:
  language: pt
  text: 'Os filhos de Cuxe: Sebá, Havilá, Sabtá, Raamá e Sabtecá. E os filhos de Raamá: Sabá e Dedã.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Os filhos de
  rationale: Preserva a fórmula genealógica de בְּנֵי, em vez de ampliá-la para “descendentes”. A conjunção inicial não é expressa, pois em português o versículo começa naturalmente como continuação de uma lista.
- source_word: כּוּשׁ
  choice: Cuxe
  rationale: Forma portuguesa consagrada para o nome próprio hebraico כּוּשׁ.
- source_word: סְבָא
  choice: Sebá
  rationale: Transliteração portuguesa do nome próprio, com acento para indicar a tonicidade final.
- source_word: חֲוִילָה
  choice: Havilá
  rationale: Forma transliterada corrente em português, preservando o nome próprio.
- source_word: סַבְתָּא
  choice: Sabtá
  rationale: Transliteração direta, com acento gráfico adequado à pronúncia portuguesa e sem acrescentar consoante final ausente.
- source_word: רַעְמָא
  choice: Raamá
  rationale: Transliteração que distingue as duas vogais e marca a tonicidade final, de acordo com a forma hebraica.
- source_word: סַבְתְּכָא
  choice: Sabtecá
  rationale: Transliteração portuguesa que preserva a sequência consonantal do hebraico e indica a tonicidade final.
- source_word: וּבְנֵי רַעְמָא
  choice: E os filhos de Raamá
  rationale: Mantém a conjunção porque ela introduz um novo ramo dentro da genealogia; “filhos” conserva a fórmula do original.
- source_word: שְׁבָא
  choice: Sabá
  rationale: Forma tradicional portuguesa do nome Sheba, distinguindo-o de Sebá (סְבָא) no início do versículo.
- source_word: דְדָן
  choice: Dedã
  rationale: Forma portuguesa consagrada do nome próprio hebraico, sem ampliar o sentido para uma linhagem ou povo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura concisa própria de uma genealogia. Os nomes seguem formas portuguesas reconhecíveis e recebem acentuação gráfica quando necessária para orientar a pronúncia. A repetição de “filhos” e a segunda conjunção foram mantidas para refletir a organização do texto hebraico.
