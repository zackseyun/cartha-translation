  text: וְ/אֶת הַ/חִוִּ֥י וְ/אֶת הַֽ/עַרְקִ֖י וְ/אֶת הַ/סִּינִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/015.yaml
  text: and the Hivites[a], and the Arkites, and the Sinites.
translation:
  language: pt
  text: e os heveus[a], os arqueus e os sineus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico emprega gentílicos no singular com o artigo (“o heveu”, “o arqueu”, “o sineu”), mas, neste contexto genealógico, eles designam povos ou clãs; por isso, são traduzidos no plural.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: e
  rationale: A conjunção ו é traduzida por “e”. O marcador de objeto direto אֵת não tem equivalente natural em português e fica implícito na coordenação da lista.
- source_word: הַ/חִוִּי
  choice: os heveus
  rationale: Gentílico com artigo definido. Embora esteja formalmente no singular em hebraico, neste contexto genealógico designa coletivamente um povo; o plural é natural em português.
- source_word: הַֽ/עַרְקִי
  choice: os arqueus
  rationale: Gentílico com valor coletivo numa lista de povos descendentes de Canaã; “arqueus” segue a forma tradicional e inteligível em português.
- source_word: הַ/סִּינִי
  choice: os sineus
  rationale: Gentílico com valor coletivo no contexto. O plural “sineus” expressa naturalmente a referência ao povo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas tradicionais dos etnônimos bíblicos e sintaxe natural de enumeração. O primeiro “e” preserva a continuidade com o versículo anterior.
