  text: 'The sons of Japheth: Gomer[a], Magog, Madai, Javan, Tubal, Meshech, and Tiras.'
translation:
  language: pt
  text: 'Os filhos de Jafé[a]: Gômer, Magogue, Madai, Javã, Tubal, Meseque e Tiras.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em genealogias, a expressão hebraica traduzida como “filhos de” pode indicar filhos imediatos ou, em certos contextos, descendentes em sentido mais amplo; aqui ela introduz a linhagem de Jafé em forma de lista.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Os filhos de
  rationale: Plural construto de בֵּן que introduz a lista genealógica. “Filhos de” mantém a forma do hebraico e é natural neste contexto, embora o termo possa ter alcance genealógico mais amplo em outros contextos.
- source_word: יֶפֶת
  choice: Jafé
  rationale: Nome próprio vertido segundo a forma bíblica tradicional e amplamente reconhecida em português.
- source_word: גֹּמֶר
  choice: Gômer
  rationale: Transliteração corrente do nome próprio em português; o acento gráfico preserva a pronúncia paroxítona.
- source_word: מָגוֹג
  choice: Magogue
  rationale: Forma tradicional portuguesa do nome próprio, adequada à fonologia e à ortografia do idioma.
- source_word: מָדַי
  choice: Madai
  rationale: O texto apresenta um nome pessoal/genealógico; a transliteração preserva essa forma, sem interpretá-la no texto principal como designação étnica dos medos.
- source_word: יָוָן
  choice: Javã
  rationale: Forma bíblica tradicional em português para o nome hebraico, preservando-o como nome genealógico sem substituí-lo por “Grécia” ou “jônios”.
- source_word: תֻבָל
  choice: Tubal
  rationale: Transliteração tradicional e reconhecível do nome próprio.
- source_word: מֶשֶׁךְ
  choice: Meseque
  rationale: Forma portuguesa tradicional, que representa de modo legível a pronúncia do nome hebraico.
- source_word: תִירָס
  choice: Tiras
  rationale: Transliteração direta e corrente do nome próprio.
- source_word: וְ / וּ
  choice: vírgulas, com “e” antes do último nome
  rationale: As conjunções hebraicas marcam os itens da lista. A pontuação com conjunção final comunica naturalmente a mesma função no português moderno, evitando repetição rígida.
