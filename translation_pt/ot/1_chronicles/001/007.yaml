base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/007.yaml
  text: 'And the sons of Javan: Elishah[a], Tarshish, Kittim, and Rodanim.'
translation:
  language: pt
  text: 'E os filhos de Javã: Elisá, Társis, Quitim e Rodanim.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em Gênesis 10:4, o nome aparece como “Dodanim”, em vez de “Rodanim”, refletindo uma variante textual.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: E os filhos de
  rationale: Mantém a forma genealógica explícita do hebraico. Embora בְּנֵי possa abranger descendentes em certos contextos, aqui “filhos de” é claro, tradicional e fiel à estrutura da lista.
- source_word: יָוָן
  choice: Javã
  rationale: Nome próprio transliterado segundo a forma consagrada e legível em português; o texto o apresenta genealogicamente, não como o nome geográfico “Grécia”.
- source_word: אֱלִישָׁה
  choice: Elisá
  rationale: Transliteração portuguesa clara do nome próprio hebraico.
- source_word: תַּרְשִׁישָׁה
  choice: Társis
  rationale: Emprega a forma tradicional em português para o nome próprio; o ה final desta grafia hebraica não exige representação distinta na tradução.
- source_word: כִּתִּים
  choice: Quitim
  rationale: Forma aportuguesada e reconhecível do etnônimo ou nome de povo, representando o כ inicial de modo natural na ortografia portuguesa.
- source_word: וְרוֹדָנִים
  choice: e Rodanim
  rationale: Segue a leitura do Texto Massorético de 1 Crônicas, רוֹדָנִים. A variante “Dodanim” do paralelo em Gênesis é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com formas tradicionais e amplamente reconhecíveis dos nomes bíblicos. A construção nominal com dois-pontos preserva o estilo conciso da genealogia. O marcador da nota foi colocado após “Rodanim”, o nome ao qual a variante textual se refere.
