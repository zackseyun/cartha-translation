  rationale: Transliteração tradicional e amplamente reconhecida em português para o nome próprio hebraico.
- source_word: נַחַת
  choice: Naate
  rationale: Nome próprio transliterado segundo a forma consagrada em português bíblico, sem traduzir seu possível sentido lexical.
- source_word: זֶרַח
  choice: Zerá
  rationale: Nome próprio transliterado em forma corrente em português; o possível sentido lexical da raiz não é traduzido.
- source_word: שַׁמָּה
  choice: Samá
  rationale: Nome próprio transliterado de modo legível e tradicional em português, representando a pronúncia hebraica sem conservar uma grafia inglesa.
- source_word: וּ/מִזָּה
  choice: e Mizá
  rationale: A conjunção וּ é traduzida por “e”, e o nome próprio é transliterado em forma natural para leitores de português.
