  text: וּ/בְנֵ֥י אַפַּ֖יִם יִשְׁעִ֑י וּ/בְנֵ֤י יִשְׁעִי֙ שֵׁשָׁ֔ן וּ/בְנֵ֥י שֵׁשָׁ֖ן אַחְלָֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/031.yaml
  text: 'The sons of Appaim: Ishi[a]; and the sons of Ishi: Sheshan; and the sons of Sheshan: Ahlai.'
translation:
  language: pt
  text: 'E os filhos[a] de Apaim: Isi; e os filhos de Isi: Sesã; e os filhos de Sesã: Alai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “descendentes”, em cada ocorrência de “filhos de”; em genealogias, o hebraico pode indicar membros de uma linhagem, embora “filhos de” seja aqui a tradução mais direta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: e os filhos de
  rationale: A fórmula genealógica repetida indica filhos ou membros da linhagem. “Filhos de” é a tradução mais direta, enquanto “descendentes de” explicitaria uma abrangência que o hebraico apenas permite.
- source_word: אַפַּיִם
  choice: Apaim
  rationale: Nome próprio transliterado segundo uma forma natural em português, preservando aproximadamente os sons e a terminação do hebraico.
- source_word: יִשְׁעִי
  choice: Isi
  rationale: Nome próprio transliterado em forma legível em português; o yod inicial é representado por I, e o shin por s neste nome tradicionalmente aportuguesado.
- source_word: שֵׁשָׁן
  choice: Sesã
  rationale: Nome próprio apresentado na forma portuguesa consagrada, com “s” para o som de shin e terminação nasal que reflete a consoante final.
- source_word: אַחְלָי
  choice: Alai
  rationale: Nome próprio transliterado de modo claro em português; a consoante gutural medial não possui equivalente exato natural e não é marcada por diacrítico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura genealógica concisa e paralela. Mantiveram-se as três conjunções do hebraico e a fórmula plural “filhos de”, mesmo quando apenas um nome é apresentado.
