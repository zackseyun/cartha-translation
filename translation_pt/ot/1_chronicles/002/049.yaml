base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/049.yaml
  text: Shepha fathered Sheva, the father of Machbenah and the father of Gibea; and Caleb’s daughter was Acsah.
translation:
  language: pt
  text: Ela deu à luz Saafe, pai de Madmana, e Seva, pai de Macbena e pai de Gibeá. A filha de Calebe era Acsa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: Ela também deu à luz
  rationale: Mantém o sujeito feminino retomado do contexto anterior e expressa naturalmente a continuação indicada pelo waw.
- source_word: שַׁעַף
  choice: Saafe
  rationale: Transliteração portuguesa inteligível do nome hebraico Shaaph.
- source_word: אֲבִי
  choice: pai de
  rationale: Reproduz literalmente o termo genealógico hebraico sem decidir se indica pai biológico, ancestral ou fundador de uma localidade.
- source_word: מַדְמַנָּה
  choice: Madmana
  rationale: Preserva o topônimo/nome presente no texto hebraico, embora ausente da camada inglesa fornecida.
- source_word: שְׁוָא
  choice: Seva
  rationale: Transliteração portuguesa do nome hebraico, distinguindo-o de Saafe.
- source_word: מַכְבֵּנָה
  choice: Macbena
  rationale: Forma transliterada adequada à ortografia portuguesa.
- source_word: גִבְעָא
  choice: Gibeá
  rationale: Forma tradicional e legível em português para o nome hebraico.
- source_word: עַכְסָה
  choice: Acsa
  rationale: Forma tradicional em português do nome Acsah.
theological_decisions:
- issue: Sentido genealógico de אֲבִי aplicado a nomes possivelmente geográficos
  choice: pai de
  alternative: fundador de / ancestral dos habitantes de
  rationale: O hebraico permite mais de uma relação genealógica ou fundacional; a tradução mantém a formulação aberta em vez de resolver a ambiguidade.
- issue: Inclusão de Saafe como pai de Madmana
  choice: Traduzir integralmente וַתֵּלֶד שַׁעַף אֲבִי מַדְמַנָּה
  alternative: Seguir a camada inglesa e omitir Madmana
  rationale: A evidência da WLC contém explicitamente Saafe e sua relação com Madmana; a fonte hebraica tem prioridade.
translation_notes:
  register: Português moderno, claro e digno, com nomes adaptados à leitura brasileira. A ordem e as relações do texto hebraico foram preservadas, inclusive a menção a Madmana ausente na camada inglesa.
