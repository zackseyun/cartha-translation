source:
  edition: WLC
  text: וְ/אִישַׁ֛י הוֹלִ֥יד אֶת בְּכֹר֖/וֹ אֶת אֱלִיאָ֑ב וַ/אֲבִינָדָב֙ הַ/שֵּׁנִ֔י וְ/שִׁמְעָ֖א הַ/שְּׁלִישִֽׁי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/013.yaml
  text: And Jesse fathered his firstborn Eliab[a], Abinadab the second, and Shimea the third.
translation:
  language: pt
  text: Jessé gerou Eliabe, seu primogênito, Abinadabe, o segundo, e Simeia[a], o terceiro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz “Simeia”; a lista paralela em 1 Samuel 16.9 traz “Samá”.
    reason: cross_reference
lexical_decisions:
- source_word: וְאִישַׁי
  choice: Jessé
  rationale: A conjunção וְ liga este versículo à genealogia anterior, mas não precisa ser representada por “E” em português, pois o início direto com o nome é mais natural e mantém a continuidade da lista. אִישַׁי é vertido pela forma portuguesa tradicional “Jessé”.
- source_word: הוֹלִיד
  choice: gerou
  rationale: O hifil de ילד, em contexto genealógico, significa gerar ou tornar-se pai de. “Gerou” é a formulação portuguesa corrente, concisa e adequada ao registro genealógico.
- source_word: אֶת בְּכֹרוֹ אֶת אֱלִיאָב
  choice: Eliabe, seu primogênito
  rationale: בְּכֹרוֹ significa “seu primogênito”, e אֱלִיאָב é o nome do filho. A ordem em português identifica primeiro Eliabe e depois o qualifica, sem acrescentar “filho”, que permanece implícito.
- source_word: וַאֲבִינָדָב הַשֵּׁנִי
  choice: Abinadabe, o segundo
  rationale: O nome recebe sua forma portuguesa tradicional, e o ordinal הַשֵּׁנִי é preservado como “o segundo”; o verbo elíptico é naturalmente recuperado da primeira oração.
- source_word: וְשִׁמְעָא הַשְּׁלִישִׁי
  choice: e Simeia, o terceiro
  rationale: שִׁמְעָא é transliterado de acordo com a forma própria de Crônicas, “Simeia”, sem harmonizá-lo com o nome diferente da passagem paralela em Samuel. הַשְּׁלִישִׁי é traduzido diretamente por “o terceiro”.
