- source_word: סִסְמָי
  choice: Sismai
  rationale: Nome próprio transliterado de modo foneticamente próximo ao hebraico e adequado ao português.
- source_word: וְ
  choice: e
  rationale: Conjunção coordenativa simples que liga as duas declarações genealógicas.
- source_word: שַׁלּוּם
  choice: Salum
  rationale: Forma tradicional em português para o nome hebraico, preservando sua identificação como nome próprio.
