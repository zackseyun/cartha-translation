  yaml_path: translation/ot/1_chronicles/002/004.yaml
  text: Tamar[a], his daughter-in-law, bore Perez and Zerah to him[b]. All the sons of Judah were five.
translation:
  language: pt
  text: Tamar, sua nora, lhe deu à luz Perez e Zerá. Ao todo, os filhos de Judá foram cinco.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O total inclui Er, Onã e Selá, mencionados no versículo anterior, além de Perez e Zerá.
    reason: cross_reference
lexical_decisions:
- source_word: תָמָר
  choice: Tamar
  rationale: Nome próprio transliterado na forma bíblica corrente em português.
- source_word: כַּלָּתוֹ
  choice: sua nora
  rationale: כַּלָּה com sufixo de terceira pessoa masculina singular designa a esposa do filho; “nora” é o termo natural e preciso em português.
- source_word: יָלְדָה לּוֹ
  choice: lhe deu à luz
  rationale: Expressa o parto e mantém a referência relacional a Judá indicada por לּוֹ, sem sugerir que ele tenha dado à luz.
- source_word: פֶּרֶץ
  choice: Perez
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: זָרַח
  choice: Zerá
  rationale: Transliteração portuguesa corrente, com acento para indicar a tonicidade final do nome hebraico.
- source_word: כָּל בְּנֵי יְהוּדָה חֲמִשָּׁה
  choice: Ao todo, os filhos de Judá foram cinco
  rationale: Reproduz a função resumitiva da cláusula hebraica em ordem natural no português, preservando “filhos” e o total explícito.
theological_decisions:
- issue: Resumo genealógico depois de Perez e Zerá
  choice: Ao todo, os filhos de Judá foram cinco
  alternative: Todos os filhos de Judá foram cinco
  rationale: A formulação escolhida deixa clara a função de soma da cláusula sem acrescentar interpretação teológica.
- issue: Terminologia de parentesco e descendência marcada por gênero
  choice: nora; filhos
  alternative: parente por casamento; descendentes
  rationale: O hebraico emprega termos específicos para a esposa do filho e para filhos homens; a tradução conserva essa precisão.
translation_notes:
  register: Português moderno, claro e digno, com fluidez brasileira e compreensão internacional. A construção “lhe deu à luz” preserva a relação expressa no hebraico; “ao todo” torna natural a frase resumitiva. O marcador [a] aparece no texto e esclarece a contagem genealógica.
