base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/030.yaml
  text: 'The sons of Nadab: Seled and Appaim[a]. Seled died without sons.'
translation:
  language: pt
  text: Os filhos de Nadabe foram Selede e Apaim. Selede morreu sem filhos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Selede morreu e não teve filhos”.'
    reason: Alternativa sintática que explicita a afirmação elíptica hebraica לֹא בָנִים.
lexical_decisions:
- source_word: וּבְנֵי
  choice: Os filhos de
  rationale: O plural construto de בֵּן introduz uma nota genealógica. Em português, “Os filhos de” é natural; a conjunção inicial não precisa ser representada separadamente.
- source_word: נָדָב
  choice: Nadabe
  rationale: Nome próprio vertido segundo a forma tradicional e legível em português.
- source_word: סֶלֶד
  choice: Selede
  rationale: Nome próprio transliterado em forma adequada à pronúncia e à tradição bíblica portuguesa, de modo uniforme nas duas ocorrências.
- source_word: וְאַפָּיִם
  choice: e Apaim
  rationale: Neste contexto genealógico, a forma é um nome pessoal, não o substantivo comum relacionado a “narinas” ou “rosto”; por isso, é transliterada.
- source_word: וַיָּמָת
  choice: morreu
  rationale: A forma narrativa de מוּת relata o acontecimento seguinte; o pretérito perfeito comunica isso naturalmente sem sobrecarregar a conjunção hebraica.
- source_word: לֹא בָנִים
  choice: sem filhos
  rationale: A expressão é literalmente “não filhos”. Depois de “morreu”, “sem filhos” é a formulação portuguesa mais natural e mantém a referência específica a descendentes do sexo masculino, embora “filhos” também possa ter uso inclusivo em português.
