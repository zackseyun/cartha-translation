  yaml_path: translation/ot/1_chronicles/002/047.yaml
  text: 'The sons of Jahdai: Regem, Jotham, Geshan, Pelet, Ephah, and Shaaph.'
translation:
  language: pt
  text: 'Os filhos de Jaadai: Regém, Jotão, Gesã, Pelete, Efá e Saafe.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Os filhos de
  rationale: בְנֵי é o plural construto de “filhos” e introduz uma lista genealógica. O וּ inicial funciona como elo de continuidade; em português, pode ficar implícito sem perda de sentido e com maior naturalidade.
- source_word: יָהְדָּי
  choice: Jadai
  rationale: Nome próprio transliterado em forma adaptada à ortografia e à tradição bíblica portuguesa.
- source_word: רֶגֶם
  choice: Regém
  rationale: Transliteração do nome próprio com acento gráfico para indicar uma pronúncia natural em português.
- source_word: יוֹתָם
  choice: Jotão
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico Yotam.
- source_word: גֵישָׁן
  choice: Gesã
  rationale: Transliteração adaptada à fonologia e à ortografia portuguesas.
- source_word: פֶלֶט
  choice: Pelete
  rationale: Forma aportuguesada que preserva de modo reconhecível o nome hebraico.
- source_word: עֵיפָה
  choice: Efá
  rationale: Nome próprio aqui, transliterado pela forma portuguesa tradicional; não é traduzido como a unidade de medida homônima.
- source_word: שָׁעַף
  choice: Saafe
  rationale: Transliteração aportuguesada do nome próprio hebraico, preservando suas duas sílabas vocálicas.
