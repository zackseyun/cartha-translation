id: 1CH.2.24
reference: 1 Chronicles 2:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אַחַ֥ר מוֹת חֶצְר֖וֹן בְּ/כָלֵ֣ב אֶפְרָ֑תָה וְ/אֵ֤שֶׁת חֶצְרוֹן֙ אֲבִיָּ֔ה וַ/תֵּ֣לֶד ל֔/וֹ אֶת אַשְׁח֖וּר אֲבִ֥י תְקֽוֹעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/024.yaml
  text: After Hezron died in Caleb-ephrathah[a], Hezron’s wife Abijah bore to him Ashhur[b], the father of Tekoa.
translation:
  language: pt
  text: Depois que Hezrom morreu em Calebe-Efrata[a], Abia, mulher de Hezrom, deu-lhe à luz Asur, pai de Tecoa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica “em Calebe-Efrata” é difícil. Pode designar um lugar ou um clã; tradicionalmente, é traduzida como “Calebe-Efrata” ou “Calebe Efrata”.
    reason: alternative_reading
  - marker: b
    text: Ou “fundador de Tecoa”. Nas genealogias, “pai de” pode indicar o fundador ou antepassado principal de uma localidade ou de um clã, e não apenas o pai biológico imediato.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר מוֹת
  choice: Depois que ... morreu
  rationale: Expressa de modo natural em português o valor temporal de אַחַר com o infinitivo construto מוֹת.
- source_word: חֶצְרוֹן
  choice: Hezrom
  rationale: Forma portuguesa reconhecível do nome hebraico חֶצְרוֹן.
- source_word: בְּכָלֵב אֶפְרָתָה
  choice: em Calebe-Efrata
  rationale: Entende-se בְּ em sentido locativo. O hífen indica que os dois elementos formam uma única designação, embora a construção hebraica seja difícil.
- source_word: וְאֵשֶׁת חֶצְרוֹן אֲבִיָּה
  choice: Abia, mulher de Hezrom
  rationale: A ordem foi ajustada para produzir uma identificação clara e natural em português, sem alterar a relação expressa pelo hebraico.
- source_word: וַתֵּלֶד לוֹ
  choice: deu-lhe à luz
  rationale: Preserva tanto o ato de dar à luz quanto a relação indicada pelo pronome indireto לוֹ, em formulação concisa e digna.
- source_word: אַשְׁחוּר
  choice: Asur
  rationale: Transliteração portuguesa corrente e legível do nome hebraico.
- source_word: אֲבִי תְקוֹעַ
  choice: pai de Tecoa
  rationale: Traduz formalmente אָב; no contexto genealógico, a expressão também pode indicar fundador ou antepassado principal de uma localidade ou clã, possibilidade registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com nomes em formas reconhecíveis ao leitor lusófono. A redação mantém a construção difícil referente a Calebe-Efrata e evita resolver de modo indevido o alcance genealógico de “pai de Tecoa”.
