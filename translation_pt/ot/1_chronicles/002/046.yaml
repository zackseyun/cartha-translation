base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/046.yaml
  text: And Ephah[a], Caleb’s concubine, bore Haran, Moza, and Gazez; and Haran fathered Gazez.
translation:
  language: pt
  text: E Efá, concubina de Calebe, deu à luz Harã, Mosa e Gazez; e Harã gerou Gazez.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵיפָה
  choice: Efa
  rationale: Nome próprio apresentado na forma tradicional e natural em português.
- source_word: פִּילֶגֶשׁ
  choice: concubina
  rationale: Equivalente português conciso para uma mulher de condição conjugal reconhecida, porém subordinada, no contexto social antigo.
- source_word: כָּלֵב
  choice: Calebe
  rationale: Forma consagrada do nome próprio em português.
- source_word: יָלְדָה
  choice: deu à luz
  rationale: Com uma mulher como sujeito, expressa de modo natural e claro o sentido de gerar ou dar à luz em uma genealogia.
- source_word: חָרָן
  choice: Harã
  rationale: Forma tradicional portuguesa do nome; mantida de maneira idêntica nas duas ocorrências.
- source_word: מוֹצָא
  choice: Moza
  rationale: Transliteração clara do nome próprio, coerente com o hebraico.
- source_word: גָּזֵז
  choice: Gazez
  rationale: Transliteração do nome próprio, repetida sem alteração nas duas ocorrências para preservar a redação hebraica.
- source_word: הֹלִיד
  choice: gerou
  rationale: Verbo natural e digno em genealogias portuguesas, preservando a ideia de descendência masculina sem recorrer a linguagem arcaica.
- source_word: וְ
  choice: e
  rationale: A conjunção coordena diretamente tanto os nomes quanto as orações na sequência genealógica.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: Marcador hebraico de objeto direto, representado implicitamente pela sintaxe portuguesa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas de nomes amplamente reconhecíveis para leitores brasileiros. A repetição de Gazez foi preservada, sem tentar esclarecer se as duas ocorrências designam a mesma pessoa. Não se reproduziu a nota inglesa fornecida, pois seu conteúdo não corresponde ao marcador colocado após Efa e a alternativa mencionada já traduz explicitamente a segunda oração do texto hebraico.
