  yaml_path: translation/ot/1_chronicles/002/036.yaml
  text: Attai fathered Nathan, and Nathan fathered Zabad.
translation:
  language: pt
  text: E Atai gerou Natã, e Natã gerou Zabade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/עַתַּי
  choice: Atai
  rationale: Nome próprio transliterado segundo a forma tradicional e corrente em português; o וְ inicial liga o versículo à genealogia anterior, mas não exige um “e” na abertura em português.
- source_word: הֹלִיד / הוֹלִיד
  choice: gerou
  rationale: No contexto genealógico, o hifil de ילד significa gerar ou tornar-se pai de alguém. “Gerou” é conciso, natural no registro bíblico português e preserva a relação genealógica.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: Marcador hebraico de objeto direto, representado pela ordem normal das palavras em português.
- source_word: נָתָן
  choice: Natã
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio hebraico.
- source_word: וְ/נָתָן
  choice: e Natã
  rationale: A conjunção וְ é traduzida por “e”, e o nome recebe sua forma portuguesa tradicional.
- source_word: זָבָד
  choice: Zabade
  rationale: Forma tradicional portuguesa do nome próprio hebraico, clara e adequada à leitura moderna.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação genealógica concisa. Mantém-se a repetição de “gerou” do hebraico, sem recorrer ao arcaísmo “gerou a” nem expandir para “tornou-se pai de”.
