base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/055.yaml
  text: 'and the families of the scribes who lived at Jabez: the Tirathites[a], the Shimeathites, and the Sucathites. These are the Kenites who came from Hammath, the father of the house of Rechab.'
translation:
  language: pt
  text: 'e as famílias dos escribas que moravam em Jabez: os tiratitas, os simeatitas e os sucatitas. Estes são os queneus que vieram de Hamate, pai da casa de Recabe.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “antepassado” ou “fundador da casa de Recabe”. Em contextos genealógicos, o hebraico “pai” pode designar um progenitor ou fundador.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁפְּחוֹת סֹפְרִים
  choice: e as famílias dos escribas
  rationale: Mantém a conjunção que dá continuidade à genealogia e traduz מִשְׁפְּחוֹת como grupos familiares ou clãs. סֹפְרִים é vertido pelo termo tradicional e direto “escribas”, sem especificar além do hebraico sua função social.
- source_word: ישבו יַעְבֵּץ
  choice: que moravam em Jabez
  rationale: Expressa em português natural a residência desses grupos em Jabez. “Moravam” é corrente e preserva o sentido de ישבו sem o arcaísmo de “habitavam”.
- source_word: תִּרְעָתִים שִׁמְעָתִים שׂוּכָתִים
  choice: os tiratitas, os simeatitas e os sucatitas
  rationale: Os três gentílicos ou nomes de clãs são transliterados segundo formas claras e naturais em português.
- source_word: הֵמָּה הַקִּינִים
  choice: Estes são os queneus
  rationale: Preserva a construção identificadora e usa a forma tradicional portuguesa do nome do povo.
- source_word: הַבָּאִים מֵחַמַּת
  choice: que vieram de Hamate
  rationale: Mantém a amplitude da expressão hebraica, que pode indicar procedência ou origem, sem transformá-la explicitamente em descendência.
- source_word: אֲבִי בֵית רֵכָב
  choice: pai da casa de Recabe
  rationale: Conserva de modo transparente o idioma genealógico hebraico. A nota registra que “pai” pode designar também um antepassado ou fundador.
theological_decisions: []
