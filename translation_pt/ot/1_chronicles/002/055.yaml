  register: Português moderno, digno e acessível, com sintaxe natural e continuidade genealógica preservada. Os nomes próprios seguem formas portuguesas correntes; a ambiguidade de “vieram de” e a expressão hebraica “pai da casa” foram mantidas, com esclarecimento lexical em nota.
