  text: Azubah died[a], and Caleb took Ephrath as his wife[b], and she bore Hur to him.
translation:
  language: pt
  text: Azuba morreu, e Calebe tomou Efrate[a] por mulher[b]. Ela lhe deu à luz Hur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome também pode aparecer como “Efrata” em formas relacionadas em outros textos, mas aqui o hebraico traz a forma mais curta “Efrate”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “casou-se com Efrate”. O hebraico diz literalmente “tomou Efrate”, expressão idiomática para casamento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּמָת
  choice: morreu
  rationale: Forma narrativa do verbo מות, o termo comum e direto para morrer; evita eufemismo desnecessário.
- source_word: עֲזוּבָה
  choice: Azuba
  rationale: Nome próprio transliterado segundo formas correntes em português.
- source_word: וַיִּקַּח לוֹ
  choice: tomou ... por mulher
  rationale: Preserva de modo compreensível o idioma hebraico em que לקח, tendo uma mulher como objeto, indica casamento.
- source_word: כָלֵב
  choice: Calebe
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֶפְרָת
  choice: Efrate
  rationale: Representa a forma hebraica mais curta אֶפְרָת presente neste versículo, sem substituí-la pela forma relacionada Efrata.
- source_word: וַתֵּלֶד לוֹ
  choice: ela lhe deu à luz
  rationale: Expressa naturalmente em português o parto e conserva a referência indireta a Calebe contida em לּוֹ.
- source_word: חוּר
  choice: Hur
  rationale: Transliteração tradicional do nome próprio hebraico.
