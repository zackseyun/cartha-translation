base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/016.yaml
  text: 'Their sisters were Zeruiah and Abigail. The sons of Zeruiah: Abishai, Joab, and Asahel—three.'
translation:
  language: pt
  text: As irmãs deles eram Zeruia e Abigail. Os filhos de Zeruia foram Abisai, Joabe e Asael — três.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲחֹתֵיהֶם
  choice: As irmãs deles eram
  rationale: Preserva o plural «irmãs» e o sufixo possessivo masculino plural, em formulação natural no português atual; a conjunção hebraica funciona como continuidade genealógica e não precisa ser representada por «e» no início da frase.
- source_word: צְרוּיָה
  choice: Zeruia
  rationale: Transliteração tradicional e reconhecível do nome pessoal em português.
- source_word: וַאֲבִיגָיִל
  choice: e Abigail
  rationale: Mantém a conjunção e emprega a forma tradicional do nome pessoal em português.
- source_word: וּבְנֵי צְרוּיָה
  choice: Os filhos de Zeruia foram
  rationale: O construto significa «os filhos de Zeruia»; «foram» completa naturalmente a identificação introduzida pela lista, sem acrescentar conteúdo substantivo.
- source_word: אַבְשַׁי
  choice: Abisai
  rationale: Forma tradicional do nome pessoal em português.
- source_word: וְיוֹאָב
  choice: Joabe
  rationale: Forma tradicional do nome pessoal em português; a conjunção é expressa antes do último item, conforme o padrão natural das listas.
- source_word: וַעֲשָׂהאֵל
  choice: e Asael
  rationale: Forma tradicional do nome pessoal em português, com a conjunção preservada na enumeração.
- source_word: שְׁלֹשָׁה
  choice: três
  rationale: Mantém explicitamente o numeral recapitulativo do hebraico, embora a lista já contenha três nomes.
