lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: foram
  rationale: Na fórmula genealógica, o verbo היה funciona como cópula que apresenta os descendentes; “foram” é natural em português e preserva o sentido.
- source_word: בְנֵי
  choice: filhos de
  rationale: O contexto enumera a linhagem masculina imediata, por isso “filhos de” é mais preciso que “descendentes de”.
- source_word: אוֹנָם
  choice: Onã
  rationale: Transliteração tradicional e reconhecível do nome hebraico em português.
- source_word: שַׁמַּי
  choice: Samai
  rationale: Transliteração portuguesa do nome próprio, mantida nas duas ocorrências.
- source_word: יָדָע
  choice: Jada
  rationale: Transliteração do nome próprio segundo a forma consonantal hebraica e o uso bíblico em português.
- source_word: וּבְנֵי
  choice: E os filhos de
  rationale: O “E” conserva a conjunção hebraica que introduz o ramo genealógico seguinte, sem tornar a frase artificial em português.
- source_word: נָדָב
  choice: Nadabe
  rationale: Forma tradicional portuguesa do nome próprio hebraico.
- source_word: אֲבִישׁוּר
  choice: Abisur
  rationale: Transliteração portuguesa clara e convencional do nome próprio.
