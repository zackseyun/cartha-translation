  text: Nahshon fathered Salma[a], and Salma fathered Boaz.
translation:
  language: pt
  text: Naassom gerou Salma[a], e Salma gerou Boaz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: Salma; algumas traduções trazem Salmom, em harmonização com genealogias relacionadas (por exemplo, Rute 4:20–21; Mateus 1:4–5).'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/נַחְשׁוֹן
  choice: Naassom
  rationale: Nome próprio transliterado segundo a forma consagrada em português, representando נַחְשׁוֹן de modo reconhecível ao leitor.
- source_word: הוֹלִיד
  choice: gerou
  rationale: No contexto genealógico, o hifil de ילד indica gerar ou tornar-se pai de alguém; “gerou” é conciso, corrente e adequado ao registro bíblico moderno.
- source_word: אֶת
  choice: '[não traduzido]'
  rationale: Partícula que marca o objeto direto definido em hebraico, sem equivalente lexical independente necessário em português.
- source_word: שַׂלְמָא
  choice: Salma
  rationale: A forma hebraica neste versículo é שַׂלְמָא, representada diretamente por “Salma”, sem harmonização silenciosa com genealogias relacionadas.
- source_word: וְ/שַׂלְמָא
  choice: e Salma
  rationale: A conjunção וְ é traduzida naturalmente por “e”, e o nome preserva a forma textual Salma.
- source_word: בֹּעַז
  choice: Boaz
  rationale: Transliteração portuguesa tradicional e amplamente reconhecida do nome hebraico בֹּעַז.
