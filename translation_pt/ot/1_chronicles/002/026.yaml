  text: וַ/תְּהִ֨י אִשָּׁ֥ה אַחֶ֛רֶת לִֽ/ירַחְמְאֵ֖ל וּ/שְׁמָ֣/הּ עֲטָרָ֑ה הִ֖יא אֵ֥ם אוֹנָֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/026.yaml
  text: Jerahmeel also had another wife, and her name was Atarah; she was the mother of Onam.
translation:
  language: pt
  text: Jerameel também teve outra esposa, chamada Atara; ela foi a mãe de Onã.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי ... לִירַחְמְאֵל
  choice: Jerameel também teve
  rationale: A construção היה com ל expressa posse ou relação; em uma genealogia, “teve” comunica isso naturalmente. “Também” apresenta esta esposa como adicional no contexto.
- source_word: אִשָּׁה אַחֶרֶת
  choice: outra esposa
  rationale: אִשָּׁה tem aqui o sentido contextual de “esposa”, e אַחֶרֶת indica outra, além da já mencionada.
- source_word: וּשְׁמָהּ עֲטָרָה
  choice: chamada Atara
  rationale: A fórmula hebraica significa literalmente “e o nome dela era Atara”; “chamada Atara” mantém o conteúdo em português natural e conciso.
- source_word: הִיא אֵם אוֹנָם
  choice: ela foi a mãe de Onã
  rationale: Preserva o pronome explícito הִיא e traduz diretamente a identificação genealógica.
- source_word: יְרַחְמְאֵל / עֲטָרָה / אוֹנָם
  choice: Jerameel / Atara / Onã
  rationale: Transliterações adaptadas às convenções e à legibilidade do português.
