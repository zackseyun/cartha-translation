base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/006.yaml
  text: 'And the sons of Zerah: Zimri[a], Ethan, Heman, Kalkol[b], and Dara—five in all.'
translation:
  language: pt
  text: 'E os filhos de Zerá: Zinri, Etã, Hemã, Calcol e Dara[a] — cinco ao todo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico traz “Dara”; a passagem paralela em 1 Reis 4:31 traz “Darda”.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי
  choice: E os filhos de
  rationale: Mantém a conjunção que dá continuidade à genealogia e traduz o plural construto בְּנֵי pela expressão genealógica portuguesa usual.
- source_word: זֶרַח
  choice: Zerá
  rationale: Forma portuguesa corrente do nome próprio hebraico, com acento indicado para leitura natural.
- source_word: זִמְרִי
  choice: Zinri
  rationale: Forma consagrada e legível em português para o nome hebraico Zimri.
- source_word: וְאֵיתָן
  choice: Etã
  rationale: Transliteração portuguesa corrente do nome hebraico, incorporada naturalmente à enumeração.
- source_word: וְהֵימָן
  choice: Hemã
  rationale: Forma portuguesa corrente, preservando a aspiração inicial representada pelo hebraico ה.
- source_word: וְכַלְכֹּל
  choice: Calcol
  rationale: 'Transliteração adequada ao português: o c representa o som /k/ antes de a e o, refletindo as consoantes hebraicas sem recorrer à grafia inglesa com K.'
- source_word: וָדָרַע
  choice: e Dara
  rationale: Segue a leitura do texto hebraico desta passagem, דָרַע, sem harmonizá-la com o nome Darda da passagem paralela.
- source_word: כֻּלָּם חֲמִשָּׁה
  choice: cinco ao todo
  rationale: Expressão portuguesa natural que comunica integralmente o sentido de 'todos eles, cinco'.
