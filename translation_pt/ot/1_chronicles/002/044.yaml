base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/044.yaml
  text: Shema fathered Raham[a], the father of Jorkeam; and Rekem fathered Shammai.
translation:
  language: pt
  text: Sema gerou a Raão[a], pai de Jorqueão; e Requém gerou Samai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Raão, fundador/antepassado de Jorqueão». A expressão hebraica «pai de» pode indicar uma relação fundacional ou ancestral, especialmente em genealogias ligadas a clãs ou povoados.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: gerou
  rationale: No contexto genealógico, o hifil de ילד indica que alguém se tornou pai ou antepassado de outro. «Gerou» é conciso, corrente em genealogias bíblicas em português e preserva a relação de descendência sem recorrer ao arcaísmo «engendrou».
- source_word: אֲבִי
  choice: pai de
  rationale: A construção com אָב pode indicar pai, antepassado ou fundador de um clã ou povoado. «Pai de» reproduz de modo transparente a forma hebraica, enquanto a possível acepção fundacional ou ancestral fica registrada em nota.
- source_word: יָרְקֳעָם
  choice: Jorqueão
  rationale: Nome próprio transliterado segundo convenções naturais em português, com «J» para o yod inicial, «qu» diante de e e terminação nasal «-ão» para o elemento final.
- source_word: שֶׁמַע
  choice: Sema
  rationale: Nome próprio transliterado em forma corrente e legível em português.
- source_word: רַחַם
  choice: Raão
  rationale: Nome próprio transliterado em forma portuguesa, representando a consoante gutural hebraica sem inserir um som consonantal artificial.
- source_word: רֶקֶם
  choice: Requém
  rationale: Nome próprio transliterado segundo a ortografia portuguesa, usando «qu» para manter o som oclusivo diante de e e acento para indicar a tonicidade final.
- source_word: שַׁמָּי
  choice: Samai
  rationale: Nome próprio transliterado de modo legível em português; «s» representa aqui o som de שׁ e o ditongo final reflete a forma hebraica.
