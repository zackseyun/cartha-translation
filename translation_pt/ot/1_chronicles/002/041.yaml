  rationale: No hifil de ילד, em contexto genealógico, significa gerar ou tornar-se pai de alguém. “Gerou” é conciso, digno e corrente na linguagem genealógica bíblica em português.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: Marcador hebraico de objeto direto, cuja função é expressa pela ordem natural das palavras em português.
- source_word: יְקַמְיָה / וִיקַמְיָה
  choice: Jecamias / e Jecamias
  rationale: Nome próprio na forma tradicional portuguesa; a conjunção ו é traduzida por “e”, e a repetição do nome é mantida conforme o hebraico.
- source_word: אֱלִישָׁמָע
  choice: Elisama
  rationale: Nome próprio vertido pela forma tradicional e reconhecível em português.
