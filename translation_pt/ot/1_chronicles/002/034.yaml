base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/034.yaml
  text: Sheshan had no sons[a], only daughters. And Sheshan had an Egyptian slave whose name was Jarha.
translation:
  language: pt
  text: Sesã não teve filhos homens, mas somente filhas. Sesã tinha um escravo[a] egípcio chamado Jará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servo”. O termo hebraico עֶבֶד pode designar um servo ou um escravo; aqui se usa “escravo” para não atenuar o possível sentido de condição de sujeição.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיָה לְשֵׁשָׁן
  choice: Sesã não teve / Sesã tinha
  rationale: A construção hebraica de existência com לְ indica posse; em português natural, o verbo “ter” expressa adequadamente a ideia.
- source_word: בָּנִים
  choice: filhos homens
  rationale: O termo está em contraste explícito com “filhas”; “filhos homens” evita que o plural português “filhos” seja entendido de modo inclusivo.
- source_word: כִּי אִם
  choice: mas somente
  rationale: Depois da negação, a expressão significa “senão / mas apenas”; “mas somente” preserva claramente o contraste.
- source_word: בָּנוֹת
  choice: filhas
  rationale: Equivalente direto, necessário para preservar o contraste de sexo na genealogia.
- source_word: עֶבֶד
  choice: escravo
  rationale: O termo pode designar servo ou escravo, mas “escravo” preserva sem atenuação o possível estatuto de sujeição e propriedade implicado no contexto.
- source_word: מִצְרִי
  choice: egípcio
  rationale: Identifica a origem étnica ou nacional do escravo.
- source_word: וּשְׁמוֹ
  choice: chamado
  rationale: Equivale naturalmente à fórmula hebraica “e o nome dele era”, sem perda de informação.
- source_word: יַרְחָע
  choice: Jará
  rationale: Transliteração adaptada à ortografia e à pronúncia correntes em português.
