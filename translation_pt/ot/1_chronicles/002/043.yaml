base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/043.yaml
  text: 'The sons of Hebron: Korah[a], Tappuah, Rekem, and Shema.'
translation:
  language: pt
  text: 'E os filhos de Hebrom: Corá, Tapua, Requém e Sema.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: E os filhos de
  rationale: O substantivo no construto plural significa literalmente “filhos de” e introduz uma lista genealógica; a conjunção וּ foi preservada como “E”, pois liga o versículo ao contexto anterior.
- source_word: חֶבְרוֹן
  choice: Hebrom
  rationale: Forma tradicional e amplamente reconhecida em português para o nome próprio hebraico.
- source_word: קֹרַח
  choice: Corá
  rationale: Transliteração portuguesa consagrada do nome próprio, ajustada à ortografia e à pronúncia correntes.
- source_word: תַפֻּחַ
  choice: Tapua
  rationale: O termo funciona aqui como nome próprio; foi transliterado, e não traduzido pelo sentido lexical possível de “maçã”.
- source_word: רֶקֶם
  choice: Requém
  rationale: Transliteração natural em português, usando “qu” para conservar o som consonantal antes de “e” e acento para indicar a tonicidade.
- source_word: שָׁמַע
  choice: Sema
  rationale: Transliteração do nome conforme a vocalização massorética שָׁמַע; não há base no texto hebraico fornecido para atribuir a este nome a nota inglesa sobre uma variante “Shamma”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas de nomes bíblicos reconhecíveis ao leitor brasileiro. A estrutura concisa da genealogia foi mantida, inclusive a conjunção inicial do hebraico.
