  yaml_path: translation/ot/1_chronicles/002/001.yaml
  text: 'These are the sons of Israel: Reuben, Simeon, Levi, Judah, Issachar, and Zebulun.'
translation:
  language: pt
  text: 'Estes são os filhos de Israel: Rúben, Simeão, Levi, Judá, Issacar e Zebulom.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Estes são
  rationale: O demonstrativo plural introduz a lista; em português, a cópula expressa resulta numa abertura natural e fiel.
- source_word: בְּנֵי
  choice: filhos de
  rationale: O termo designa aqui os filhos homens de Jacó/Israel, nomeados individualmente, e não seus descendentes em sentido amplo.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém o nome usado no hebraico, embora o referente seja o patriarca também chamado Jacó.
- source_word: רְאוּבֵן
  choice: Rúben
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: שִׁמְעוֹן
  choice: Simeão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: לֵוִי
  choice: Levi
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וִיהוּדָה
  choice: Judá
  rationale: Forma tradicional do nome em português; a conjunção hebraica não é reproduzida neste ponto porque o português corrente coordena naturalmente a enumeração com uma única conjunção antes do último item.
- source_word: יִשָׂשכָר
  choice: Issacar
  rationale: Forma bíblica tradicional e reconhecida em português.
- source_word: וּזְבֻלוּן
  choice: e Zebulom
  rationale: A conjunção fecha naturalmente a lista em português, e Zebulom é uma forma tradicional e amplamente reconhecida do nome.
