lexical_decisions:
- source_word: וּ/בֹעַז
  choice: Boaz
  rationale: Nome próprio vertido segundo a forma tradicional e amplamente reconhecida em português; a conjunção inicial não precisa ser expressa, pois o versículo começa uma nova unidade na citação isolada.
- source_word: הוֹלִיד
  choice: gerou
  rationale: No hifil de ילד, em contexto genealógico, indica que o homem gerou ou foi pai do descendente. “Gerou” é conciso, natural nas genealogias bíblicas em português e preserva a força genealógica do hebraico.
- source_word: אֶת
  choice: '[não traduzido]'
  rationale: Marcador hebraico de objeto direto, sem equivalente lexical necessário em português; sua função é indicada pela sintaxe.
- source_word: עוֹבֵד
  choice: Obede
  rationale: Forma tradicional portuguesa do nome próprio hebraico עוֹבֵד.
- source_word: וְ/עוֹבֵד
  choice: e Obede
  rationale: A conjunção וְ é traduzida por “e”, ligando as duas declarações genealógicas; o nome segue sua forma tradicional portuguesa.
- source_word: הוֹלִיד
  choice: gerou
  rationale: A repetição do verbo genealógico é mantida para reproduzir o paralelismo e a concisão do texto hebraico.
- source_word: יִשָׁי
  choice: Jessé
  rationale: Forma tradicional e amplamente reconhecida do nome em português, adequada à legibilidade bíblica moderna.
