source:
  edition: WLC
  text: וַ/יִּהְי֧וּ בְנֵי יְרַחְמְאֵ֛ל בְּכ֥וֹר חֶצְר֖וֹן הַ/בְּכ֣וֹר רָ֑ם וּ/בוּנָ֥ה וָ/אֹ֛רֶן וָ/אֹ֖צֶם אֲחִיָּֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/025.yaml
  text: The sons of Jerahmeel[a], the firstborn of Hezron, were Ram his firstborn, Bunah, Oren, Ozem, and Ahijah.
translation:
  language: pt
  text: 'Os filhos de Jerameel[a], o primogênito de Hezrom, foram: Ram, seu primogênito, Buna, Orém, Ozém e Aías.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A sintaxe hebraica pode ser entendida como uma lista de cinco filhos de Jerameel, na qual Ram é identificado como “seu primogênito”. Alguns intérpretes propõem entender “Aías” de outra maneira em relação à lista, mas a leitura mais direta o considera mais um nome pessoal da série.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: foram
  rationale: Em uma lista genealógica, introduz os membros da linhagem; “foram” é natural em português.
- source_word: בְנֵי
  choice: filhos de
  rationale: Preserva a referência masculina e genealógica do hebraico.
- source_word: יְרַחְמְאֵל
  choice: Jerameel
  rationale: Transliteração portuguesa corrente do nome pessoal.
- source_word: בְּכוֹר חֶצְרוֹן
  choice: o primogênito de Hezrom
  rationale: Identifica Jerameel como primogênito de Hezrom e mantém a relação apositiva.
- source_word: הַבְּכוֹר
  choice: seu primogênito
  rationale: A expressão se refere mais naturalmente a Ram como primogênito de Jerameel; o possessivo esclarece a relação sem eliminar a repetição do hebraico.
- source_word: רָם
  choice: Ram
  rationale: Transliteração do nome pessoal.
- source_word: וּבוּנָה
  choice: Buna
  rationale: Transliteração do nome pessoal.
- source_word: וָאֹרֶן
  choice: Orém
  rationale: Transliteração adaptada à leitura em português.
- source_word: וָאֹצֶם
  choice: Ozém
  rationale: Transliteração adaptada à leitura em português.
- source_word: אֲחִיָּה
  choice: Aías
  rationale: Forma portuguesa tradicional e amplamente reconhecível do nome pessoal.
theological_decisions:
- issue: Relação de אֲחִיָּה com a lista genealógica
  choice: Aías é apresentado como o quinto filho enumerado
  alternative: Interpretar Aías de outra maneira em relação à lista
  rationale: A leitura sintática mais direta entende אֲחִיָּה como mais um nome pessoal na série, embora a construção tenha recebido outras propostas de interpretação.
translation_notes:
  register: Português moderno, digno e acessível, com pontuação que torna clara a enumeração. Os nomes seguem formas portuguesas reconhecíveis ou transliterações legíveis.
