  text: Caleb’s concubine Maacah bore Sheber and Tirhanah[a].
translation:
  language: pt
  text: Maaca, concubina de Calebe, deu à luz a Séber e a Tiraná.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “Maaca, concubina de Calebe, gerou Séber e Tiraná”, caso o verbo hebraico seja entendido aqui no sentido genealógico mais amplo. Como o sujeito é explicitamente feminino, o texto principal traz “deu à luz”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּלֶגֶשׁ
  choice: concubina
  rationale: Designa uma mulher numa união conjugal reconhecida, porém de condição subordinada; “concubina” é o equivalente português tradicional, conciso e adequado ao contexto genealógico.
- source_word: כָּלֵב
  choice: Calebe
  rationale: Forma portuguesa consagrada do nome pessoal hebraico.
- source_word: מַעֲכָה
  choice: Maaca
  rationale: Transliteração portuguesa corrente do nome pessoal hebraico.
- source_word: יָלַד
  choice: deu à luz
  rationale: Embora o verbo possa ter sentido genealógico mais amplo, o sujeito explícito é uma mulher; por isso, “deu à luz” é natural e preserva o sentido concreto mais provável.
- source_word: שֶׁבֶר
  choice: Seber
  rationale: Transliteração do nome pessoal segundo convenções portuguesas, representando שׁ por “s” neste nome bíblico.
- source_word: וְאֶת
  choice: e
  rationale: A conjunção introduz o segundo objeto direto; o marcador hebraico de objeto não recebe tradução independente em português.
- source_word: תִּרְחֲנָה
  choice: Tiraná
  rationale: Transliteração portuguesa legível do nome pessoal hebraico, com acento gráfico para indicar a tonicidade final.
