  text: וּ/בְנֵ֖י כַּרְמִ֑י עָכָר֙ עוֹכֵ֣ר יִשְׂרָאֵ֔ל אֲשֶׁ֥ר מָעַ֖ל בַּ/חֵֽרֶם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/007.yaml
  text: 'And the sons of Karmi: Achar[a], the troubler of Israel[b], who acted unfaithfully regarding the devoted things.'
translation:
  language: pt
  text: 'E os filhos de Carmi: Acar[a], o perturbador de Israel, que agiu com infidelidade em relação à coisa consagrada à destruição[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Acã”. Crônicas usa aqui a forma “Acar”, provavelmente fazendo eco ao termo hebraico traduzido como “perturbador”. Veja Josué 7.
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “a coisa consagrada à destruição”. A expressão pode referir-se coletivamente ao que havia sido colocado sob interdição e destinado à destruição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: E os filhos de
  rationale: A forma construta plural de בֵּן, ligada pela conjunção, introduz uma subdivisão genealógica; “filhos de” é a formulação genealógica mais precisa e natural.
- source_word: כַּרְמִי
  choice: Carmi
  rationale: Translitera o nome hebraico segundo a forma tradicional e amplamente reconhecível em português.
- source_word: עָכָר
  choice: Acar
  rationale: Preserva a forma específica de Crônicas, עָכָר, sem harmonizá-la silenciosamente com עָכָן (“Acã”) de Josué 7; essa forma também sustenta o jogo de palavras com עוֹכֵר.
- source_word: עוֹכֵר יִשְׂרָאֵל
  choice: o perturbador de Israel
  rationale: O particípio qal está em aposição a Acar. “Perturbador” conserva a formulação nominal compacta e, na medida do possível, a ligação sonora e semântica com o nome.
- source_word: אֲשֶׁר
  choice: que
  rationale: Pronome relativo natural em português, introduzindo a oração que descreve a transgressão de Acar.
- source_word: מָעַל
  choice: agiu com infidelidade
  rationale: מעל indica quebra de fidelidade, frequentemente com dimensão sacrílega. A expressão comunica tanto o ato quanto sua gravidade moral e religiosa sem recorrer a jargão técnico.
- source_word: בַּחֵרֶם
  choice: em relação às coisas consagradas à destruição
  rationale: חֵרֶם designa aquilo que foi colocado sob interdição e destinado à destruição. O plural “coisas” expressa naturalmente em português o sentido coletivo do singular hebraico neste contexto, enquanto “consagradas à destruição” mantém juntas suas dimensões de dedicação e juízo.
theological_decisions:
- issue: Sentido de חֵרֶם no relato de sacrilégio e juízo
  choice: as coisas consagradas à destruição
  alternative: a coisa interditada; aquilo que havia sido destinado à destruição
  rationale: O termo envolve algo irrevogavelmente dedicado a Deus e, neste contexto, destinado à destruição e proibido para uso particular. A tradução conserva essas duas dimensões sem reduzir o conceito apenas a “proibição” ou apenas a “consagração”.
- issue: Forma do nome עָכָר em comparação com עָכָן em Josué 7
  choice: Acar
  alternative: Acã
  rationale: Crônicas emprega deliberadamente a forma עָכָר, provavelmente para criar uma associação com “perturbador”. Preservar “Acar” respeita o texto recebido e evita harmonização; a forma mais conhecida é indicada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura genealógica concisa foi preservada; “Acar” mantém a forma própria de Crônicas, e a nota esclarece sua relação com o nome mais conhecido “Acã”. O conceito culturalmente distante de חֵרֶם foi explicitado de maneira breve no texto e qualificado na nota.
