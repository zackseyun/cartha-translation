source:
  edition: WLC
  text: וַ/יִּקַּ֣ח גְּשֽׁוּר וַ֠/אֲרָם אֶת חַוֺּ֨ת יָאִ֧יר מֵ/אִתָּ֛/ם אֶת קְנָ֥ת וְ/אֶת בְּנֹתֶ֖י/הָ שִׁשִּׁ֣ים עִ֑יר כָּל אֵ֕לֶּה בְּנֵ֖י מָכִ֥יר אֲבִי גִלְעָֽד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/023.yaml
  text: But Geshur and Aram took the villages of Jair from them[a], along with Kenath and its daughter towns—sixty cities. All these were the sons of Machir[c][b], the father of Gilead.
translation:
  language: pt
  text: Mas Gesur e Arã tomaram deles as aldeias de Jair[a], além de Quenate e suas localidades dependentes[b] — ao todo, sessenta cidades. Todos esses eram filhos de Maquir[c], pai de Gileade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Havote-Jair”, nome de lugar que significa “aldeias de tendas de Jair”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “suas filhas”, isto é, as povoações dependentes situadas ao redor de Quenate.
    reason: cultural_note
  - marker: c
    text: “Filhos de Maquir” pode significar descendentes ou membros do clã, e não necessariamente filhos imediatos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: tomaram
  rationale: Expressa de modo amplo a tomada de localidades, sem acrescentar ao verbo uma nuance militar mais específica do que o hebraico exige. O plural é natural em português com o sujeito composto.
- source_word: גְּשׁוּר וַאֲרָם
  choice: Gesur e Arã
  rationale: Mantém os nomes próprios hebraicos em formas correntes e legíveis em português, sem substituir Arã por “Síria”.
- source_word: חַוֺּת יָאִיר
  choice: as aldeias de Jair
  rationale: Traduz o sentido transparente da expressão e mantém no rodapé a possibilidade de entendê-la como o topônimo Havote-Jair.
- source_word: מֵאִתָּם
  choice: deles
  rationale: Preserva a indicação de que as localidades foram tiradas da posse ou do controle do grupo mencionado anteriormente.
- source_word: קְנָת
  choice: Quenate
  rationale: Usa uma transliteração adaptada à ortografia e à pronúncia do português.
- source_word: בְּנֹתֶיהָ
  choice: suas localidades dependentes
  rationale: Comunica o sentido do idiomatismo urbano sem tornar obscura a frase; a metáfora literal “suas filhas” é registrada em nota.
- source_word: שִׁשִּׁים עִיר
  choice: ao todo, sessenta cidades
  rationale: Apresenta com clareza o total fornecido pelo hebraico e traduz עִיר pelo equivalente usual “cidades”.
- source_word: כָּל אֵלֶּה
  choice: Todos esses
  rationale: Mantém a formulação aberta do hebraico, embora o predicado seguinte oriente a leitura para pessoas ou membros do clã, e não simplesmente para as localidades.
- source_word: בְּנֵי מָכִיר
  choice: filhos de Maquir
  rationale: Preserva a expressão genealógica hebraica sem decidir no texto principal se designa filhos imediatos, descendentes ou membros do clã.
- source_word: אֲבִי גִלְעָד
  choice: pai de Gileade
  rationale: Conserva o idiomatismo hebraico, que no contexto genealógico pode indicar progenitor ou ancestral.
