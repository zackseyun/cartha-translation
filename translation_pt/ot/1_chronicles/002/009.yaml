base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/009.yaml
  text: 'The sons of Hezron who were born to him: Jerahmeel[a], Ram, and Chelubai.'
translation:
  language: pt
  text: Os filhos de Hezrom que lhe nasceram foram Jerameel, Ram e Quelubai[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Quelubai provavelmente é a mesma pessoa que, em outros trechos desta genealogia, é chamada Calebe.
    reason: Registra a provável identificação com Calebe sem substituir nem harmonizar a forma do nome presente no texto hebraico deste versículo.
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Os filhos de
  rationale: O plural construto de בֵּן introduz a lista genealógica. A conjunção inicial é absorvida em português para dar naturalidade à frase sem alterar seu sentido.
- source_word: חֶצְרוֹן
  choice: Hezrom
  rationale: Transliteração do nome próprio hebraico segundo uma forma reconhecível em português.
- source_word: אֲשֶׁר נוֹלַד לוֹ
  choice: que lhe nasceram
  rationale: Preserva a construção relativa e o valor passivo de נולד com o complemento לוֹ, ao mesmo tempo que mantém um português natural e digno.
- source_word: אֶת
  choice: —
  rationale: Partícula que marca o objeto direto definido em hebraico; não possui equivalente lexical direto em português.
- source_word: יְרַחְמְאֵל
  choice: Jerameel
  rationale: Transliteração portuguesa clara do nome próprio hebraico.
- source_word: רָם
  choice: Ram
  rationale: Transliteração direta do nome próprio hebraico.
- source_word: כְּלוּבָי
  choice: Quelubai
  rationale: Representa diretamente a forma consonantal hebraica כְּלוּבָי, sem harmonizá-la no texto principal com o nome mais conhecido Calebe.
