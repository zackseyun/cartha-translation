  text: וּ/שְׂג֖וּב הוֹלִ֣יד אֶת יָאִ֑יר וַֽ/יְהִי ל֗/וֹ עֶשְׂרִ֤ים וְ/שָׁלוֹשׁ֙ עָרִ֔ים בְּ/אֶ֖רֶץ הַ/גִּלְעָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/022.yaml
  text: Segub fathered Jair, and he had twenty-three cities in the land of Gilead.
translation:
  language: pt
  text: Segube gerou Jair, e este possuía vinte e três cidades na terra de Gileade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּשְׂגוּב
  choice: Segube
  rationale: O nome próprio é transliterado segundo a forma tradicional e amplamente reconhecível em português; a conjunção inicial é refletida pela continuidade da frase.
- source_word: הוֹלִיד
  choice: gerou
  rationale: No hifil de ילד e em contexto genealógico, o verbo indica que Segube foi pai de Jair. “Gerou” é conciso, natural em genealogias bíblicas e preserva a relação paterna.
- source_word: יָאִיר
  choice: Jair
  rationale: Transliteração tradicional do nome próprio em português.
- source_word: וַיְהִי לוֹ
  choice: e este possuía
  rationale: A construção היה + ל expressa posse. O pronome “este” aponta naturalmente para Jair, o referente mais próximo, sem repetir o nome.
- source_word: עֶשְׂרִים וְשָׁלוֹשׁ
  choice: vinte e três
  rationale: Forma cardinal corrente em português.
- source_word: עָרִים
  choice: cidades
  rationale: עִיר pode designar cidade ou povoado; “cidades” é a equivalência tradicional e adequada ao resumo territorial.
- source_word: בְּאֶרֶץ הַגִּלְעָד
  choice: na terra de Gileade
  rationale: Preserva tanto אֶרֶץ, “terra/território”, quanto o nome geográfico em sua forma portuguesa tradicional.
theological_decisions:
- issue: Referente do pronome em וַיְהִי לוֹ
  choice: Jair (“este”)
  alternative: Segube (“ele”)
  rationale: A sintaxe e o contexto favorecem Jair como referente imediato e como possuidor das cidades, em consonância com a notícia paralela sobre Jair; a formulação evita uma atribuição ambígua em português.
translation_notes:
  register: Português moderno, claro e digno, com concisão apropriada a uma genealogia. Mantém a terminologia bíblica reconhecível sem recorrer a formas arcaicas.
