base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/053.yaml
  text: 'And the clans of Kiriath-jearim: the Ithrites[a], the Puthites, the Shumathites, and the Mishraites[b]. From these came the Zorathites and the Eshtaolites.'
translation:
  language: pt
  text: 'E os clãs[a] de Quiriate-Jearim: os itreus, os puteus, os sumateus e os misraeus. Destes procederam[b] os zoratitas e os estaolitas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “famílias”; o termo hebraico pode indicar grupos extensos de parentesco em uma genealogia tribal.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “saíram”; aqui, a expressão indica que esses grupos tiveram origem nos clãs mencionados anteriormente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁפְּחוֹת
  choice: E os clãs
  rationale: Em contexto genealógico, מִשְׁפָּחוֹת designa grupos extensos de parentesco, não apenas famílias nucleares; “clãs” expressa melhor essa estrutura.
- source_word: קִרְיַת יְעָרִים
  choice: Quiriate-Jearim
  rationale: Nome de lugar transliterado segundo formas bíblicas reconhecíveis em português.
- source_word: הַיִּתְרִי
  choice: os itreus
  rationale: Gentílico ou designação de clã, transliterado e adaptado à morfologia portuguesa.
- source_word: וְהַפּוּתִי
  choice: os puteus
  rationale: Nome de clã transliterado e adaptado ao português.
- source_word: וְהַשֻּׁמָתִי
  choice: os sumateus
  rationale: A forma conserva de maneira reconhecível o radical hebraico do gentílico.
- source_word: וְהַמִּשְׁרָעִי
  choice: os misraeus
  rationale: Nome de clã transliterado com adaptação natural à leitura em português.
- source_word: מֵאֵלֶּה
  choice: Destes
  rationale: Retoma de modo conciso os clãs anteriormente enumerados.
- source_word: יָצְאוּ
  choice: procederam
  rationale: O verbo significa literalmente “saíram”, mas aqui indica origem genealógica; “procederam” preserva a ideia de proveniência sem especificar além do texto.
- source_word: הַצָּרְעָתִי
  choice: os zoratitas
  rationale: Gentílico ligado a Zorá, apresentado em forma portuguesa reconhecível.
- source_word: וְהָאֶשְׁתָּאֻלִי
  choice: os estaolitas
  rationale: Gentílico derivado de Estaol, transliterado em forma natural em português.
