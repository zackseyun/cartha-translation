base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/045.yaml
  text: And the son of Shammai was Maon[a], and Maon was the father of Beth-zur.
translation:
  language: pt
  text: E o filho de Samai foi Maom, e Maom foi o pai de Bete-Zur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «ancestral ou fundador de Bete-Zur». Nas genealogias, «pai de» também pode designar o fundador ou o principal ancestral de um clã ou povoado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בֶן
  choice: E o filho de
  rationale: A conjunção dá continuidade à genealogia, e בֶן é traduzido naturalmente como «filho de».
- source_word: שַׁמַּי
  choice: Samai
  rationale: Nome próprio transliterado em forma natural para leitores de língua portuguesa.
- source_word: מָעוֹן
  choice: Maom
  rationale: O contexto genealógico indica aqui um nome pessoal; a transliteração «Maom» representa o hebraico מָעוֹן sem o confundir com uma palavra comum portuguesa.
- source_word: וּ/מָעוֹן
  choice: e Maom
  rationale: Mantém-se a repetição do nome, característica da fórmula genealógica hebraica.
- source_word: אֲבִי
  choice: foi o pai de
  rationale: Preserva a fórmula genealógica usual, enquanto a nota registra que o termo também pode indicar ancestral ou fundador.
- source_word: בֵית צוּר
  choice: Bete-Zur
  rationale: Nome próprio de lugar ou clã, transliterado como composto em vez de traduzido literalmente como «casa de Zur».
