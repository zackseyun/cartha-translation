- source_word: בְּכוֹר יְרַחְמְאֵל
  choice: o primogênito de Jerameel
  rationale: A construção hebraica e o contexto imediato identificam Rão como o primogênito de Jerameel, não Jerameel como o primogênito de Rão.
- source_word: מַעַץ
  choice: Maaz
  rationale: Transliteração portuguesa reconhecível do nome próprio hebraico.
- source_word: יָמִין
  choice: Jamim
  rationale: Forma portuguesa convencional do nome próprio hebraico neste contexto.
- source_word: עֵקֶר
  choice: Équer
  rationale: Transliteração adaptada à ortografia e à pronúncia do português.
