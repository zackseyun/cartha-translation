lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: foram
  rationale: O verbo introduz e identifica os integrantes da lista genealógica; “foram” preserva essa função com naturalidade em português.
- source_word: בְנֵי
  choice: filhos de
  rationale: Neste contexto genealógico, o termo designa os filhos homens nomeados na sequência.
- source_word: רָם
