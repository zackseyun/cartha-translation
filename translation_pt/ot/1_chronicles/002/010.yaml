base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/010.yaml
  text: Ram fathered Amminadab[a], and Amminadab fathered Nahshon, leader of the sons of Judah.
translation:
  language: pt
  text: Ram gerou Aminadabe, e Aminadabe gerou Naassom, líder dos filhos de Judá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “príncipe dos filhos de Judá” ou “chefe dos filhos de Judá”.
    reason: Alternativas lexicais possíveis para נְשִׂיא.
lexical_decisions:
- source_word: הוֹלִיד
  choice: gerou
  rationale: No contexto genealógico, o hifil de ילד indica gerar ou tornar-se pai de alguém. “Gerou” é conciso, natural em genealogias bíblicas em português e preserva o sentido masculino da linhagem.
- source_word: נְשִׂיא
  choice: líder
  rationale: נָשִׂיא designa alguém em posição elevada, como líder, chefe ou príncipe. “Líder” comunica claramente a função reconhecida de Naassom sem sugerir necessariamente realeza.
- source_word: בְּנֵי יְהוּדָה
  choice: os filhos de Judá
  rationale: A expressão hebraica diz literalmente “filhos de Judá”. Esta forma preserva o enquadramento masculino, tribal e genealógico do texto.
- source_word: רָם / עַמִּינָדָב / נַחְשׁוֹן
  choice: Ram / Aminadabe / Naassom
  rationale: Os nomes pessoais são apresentados em formas portuguesas tradicionais e reconhecíveis, mantendo correspondência clara com os nomes hebraicos.
