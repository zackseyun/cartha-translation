  text: וּ/בְנֵ֤י כָלֵב֙ אֲחִ֣י יְרַחְמְאֵ֔ל מֵישָׁ֥ע בְּכֹר֖/וֹ ה֣וּא אֲבִי זִ֑יף וּ/בְנֵ֥י מָרֵשָׁ֖ה אֲבִ֥י חֶבְרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/042.yaml
  text: 'And the sons of Caleb the brother of Jerahmeel: Mesha his firstborn[a], who was the father of Ziph[b], and the sons of Mareshah the father of Hebron.'
translation:
  language: pt
  text: 'E os filhos de Calebe, irmão de Jerameel: Messa, seu primogênito, que era pai de Zife[a], e os filhos de Maressa, pai de Hebrom[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em Crônicas, “pai de” pode indicar não apenas o pai biológico, mas também um antepassado, chefe de clã ou fundador associado a um lugar.
    reason: cultural_note
  - marker: b
    text: 'A sintaxe hebraica da cláusula final é difícil. O Texto Massorético diz literalmente: “e os filhos de Maressa, pai de Hebrom”. Alguns entendem que o sentido é “Maressa, pai de Hebrom”; outros conservam a redação tal como está traduzida.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי
  choice: E os filhos de
  rationale: Preserva a fórmula genealógica hebraica, que pode abranger filhos imediatos ou descendentes, sem explicitar além do texto.
- source_word: כָלֵב
  choice: Calebe
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: אֲחִי יְרַחְמְאֵל
  choice: irmão de Jerameel
  rationale: Reproduz naturalmente em português a relação expressa pelo construto hebraico.
- source_word: מֵישָׁע
  choice: Messa
  rationale: Transliteração portuguesa que distingue o nome do substantivo comum 'mesa'.
- source_word: בְּכֹרוֹ
  choice: seu primogênito
  rationale: Conserva tanto a ordem de nascimento quanto a possível relevância de posição familiar.
- source_word: הוּא
  choice: que foi
  rationale: Retoma Messa em uma oração relativa natural em português.
- source_word: אֲבִי זִיף
  choice: pai de Zife
  rationale: Mantém a expressão hebraica sem decidir se indica pai biológico, ancestral, chefe de clã ou fundador ligado a um lugar.
- source_word: וּבְנֵי מָרֵשָׁה
  choice: e os filhos de Maressa
  rationale: Preserva literalmente a difícil construção do Texto Massorético, em vez de emendá-la ou harmonizá-la.
- source_word: אֲבִי חֶבְרוֹן
  choice: pai de Hebrom
  rationale: Mantém a formulação hebraica e sua possível referência a uma pessoa, clã ou localidade.
theological_decisions:
- issue: Sentido genealógico e toponímico de אָב ('pai')
  choice: Manter 'pai de' no texto e explicar sua amplitude em nota
  alternative: Traduzir como 'fundador de' ou 'antepassado de'
  rationale: O hebraico permite mais de uma relação, e a tradução não deve resolver silenciosamente a ambiguidade.
- issue: Sintaxe da cláusula final
  choice: Conservar 'e os filhos de Maressa, pai de Hebrom'
  alternative: Entender que Maressa foi pai de Hebrom ou reestruturar/emendar a frase
  rationale: A redação massorética é difícil; a tradução formalmente próxima retém essa tensão textual, acompanhada de nota.
translation_notes:
  register: Português moderno, digno e acessível, com formas onomásticas bíblicas correntes. A estrutura genealógica e a dificuldade da cláusula final foram preservadas. Os marcadores foram posicionados junto às expressões que cada nota esclarece.
