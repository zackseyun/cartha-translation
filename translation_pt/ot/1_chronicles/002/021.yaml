source:
  edition: WLC
  text: וְ/אַחַ֗ר בָּ֤א חֶצְרוֹן֙ אֶל בַּת מָכִיר֙ אֲבִ֣י גִלְעָ֔ד וְ/ה֣וּא לְקָחָ֔/הּ וְ/ה֖וּא בֶּן שִׁשִּׁ֣ים שָׁנָ֑ה וַ/תֵּ֥לֶד ל֖/וֹ אֶת שְׂגֽוּב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/021.yaml
  text: Afterward Hezron went in to the daughter of Machir the father of Gilead[a], and he took her when he was sixty years old[c][b], and she bore Segub to him.
translation:
  language: pt
  text: Depois, Hezrom foi ter com a filha de Maquir[a], pai de Gileade[b], e a tomou por mulher[c] quando tinha sessenta anos. Ela lhe deu à luz Segube.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica também pode ser entendida como “aproximou-se de”; neste contexto, é uma forma discreta de se referir à união conjugal ou sexual.
    reason: lexical_alternative
  - marker: b
    text: Em linguagem genealógica, “pai de Gileade” também pode significar antepassado ou fundador de Gileade.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “a tomou”; a expressão pode significar “casou-se com ela”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: Depois
  rationale: Expressa de modo natural a sequência temporal assinalada pelo hebraico.
- source_word: בָּא אֶל
  choice: foi ter com
  rationale: Mantém o caráter discreto e relativamente aberto da expressão hebraica, que neste contexto pode indicar união conjugal ou sexual, sem recorrer a uma formulação portuguesa artificial.
- source_word: בַּת מָכִיר
  choice: a filha de Maquir
  rationale: Reproduz diretamente a relação genealógica da cadeia construta hebraica.
- source_word: אֲבִי גִלְעָד
  choice: pai de Gileade
  rationale: É a correspondência mais direta, preservando a possibilidade de que 'pai' tenha sentido genealógico mais amplo.
- source_word: לְקָחָהּ
  choice: a tomou por mulher
  rationale: Torna explícito em português corrente o sentido matrimonial normalmente assumido por לקח quando o objeto é uma mulher, enquanto a nota registra a formulação mais literal.
- source_word: וְהוּא בֶּן שִׁשִּׁים שָׁנָה
  choice: quando tinha sessenta anos
  rationale: Verte de maneira idiomática a expressão hebraica de idade e liga naturalmente a informação à tomada da mulher no fluxo da frase.
- source_word: וַתֵּלֶד לוֹ
  choice: Ela lhe deu à luz
  rationale: Conserva tanto a ideia de dar à luz como o pronome dativo לוֹ em português natural.
- source_word: שְׂגוּב
  choice: Segube
  rationale: Transliteração portuguesa tradicional e inteligível do nome hebraico.
theological_decisions:
- issue: Natureza da relação indicada por בָּא אֶל e לְקָחָהּ
  choice: O texto principal usa linguagem matrimonial discreta, sem detalhar a relação sexual.
  alternative: Traduzir explicitamente como 'teve relações com ela' ou, de modo mais literal, 'entrou a ela' e 'a tomou'.
  rationale: A combinação das expressões favorece um contexto matrimonial, mas a redação e as notas preservam a amplitude do primeiro idioma e a forma literal do segundo, sem impor uma interpretação denominacional.
- issue: Sentido de 'pai de Gileade'
  choice: Manter 'pai' no texto principal.
  alternative: Traduzir como 'antepassado de Gileade' ou 'fundador de Gileade'.
  rationale: אָב pode indicar pai imediato, antepassado ou fundador em genealogias; a tradução direta evita resolver uma ambiguidade que o hebraico conserva.
translation_notes:
  register: Português moderno, digno e acessível, com formas onomásticas de leitura corrente no contexto bíblico. A redação evita o literalismo pouco natural de 'entrou a ela', mas conserva a discrição do hebraico e registra as principais ambiguidades em notas.
