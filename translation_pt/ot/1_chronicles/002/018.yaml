base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/018.yaml
  text: 'And Caleb son of Hezron fathered children by Azubah his wife[a], and by Jerioth; and these were her sons: Jesher, Shobab[b], and Ardon.'
translation:
  language: pt
  text: 'Calebe, filho de Hezrom, teve filhos com Azuba, sua mulher[a], e com Jeriote; e estes foram os filhos dela[b]: Jeser, Sobabe e Ardom.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A sintaxe hebraica é difícil. Jeriote pode ser entendida como outra mulher ligada a Calebe ou, em algumas interpretações, como uma designação em aposição a Azuba.
    reason: alternative_reading
  - marker: b
    text: 'Literalmente, em hebraico: «os filhos dela». O sufixo é feminino singular, embora alguns intérpretes reconstruam a genealogia de outra maneira.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: teve filhos com
  rationale: O hifil de ילד significa gerar ou ser pai. Diante dos nomes femininos que seguem, «teve filhos com» expressa naturalmente em português a relação genealógica sem sugerir que Azuba e Jeriote sejam objetos gerados.
- source_word: אֶת עֲזוּבָה אִשָּׁה וְאֶת יְרִיעוֹת
  choice: com Azuba, sua mulher, e com Jeriote
  rationale: A construção hebraica é difícil e compacta. A tradução entende אִשָּׁה em aposição a Azuba e coordena Jeriote como outra mulher, mas assinala em nota a ambiguidade sintática.
- source_word: אִשָּׁה
  choice: sua mulher
  rationale: No contexto genealógico, «mulher» no sentido de esposa é a leitura mais natural. O possessivo, embora implícito, torna a relação clara em português.
- source_word: וְאֵלֶּה בָנֶיהָ
  choice: e estes foram os filhos dela
  rationale: O sufixo de בָנֶיהָ é feminino singular, por isso «dela» preserva a forma do Texto Massorético. O passado se ajusta à narração genealógica em português.
- source_word: יֵשֶׁר וְשׁוֹבָב וְאַרְדּוֹן
  choice: Jeser, Sobabe e Ardom
  rationale: Os nomes pessoais são transliterados em formas naturais e reconhecíveis em português.
theological_decisions:
- issue: Ambiguidade genealógica quanto às mulheres mencionadas
  choice: Calebe teve filhos com Azuba, sua mulher, e com Jeriote; os homens enumerados são chamados de «filhos dela», conforme o sufixo feminino do Texto Massorético.
  alternative: Jeriote pode estar em aposição a Azuba, e não designar uma segunda mulher; também há reconstruções que distribuem os filhos de outra maneira.
  rationale: A dificuldade é sintática e textual, não doutrinária. O texto principal oferece uma leitura portuguesa coerente, enquanto as notas preservam tanto a ambiguidade da construção quanto o gênero feminino do sufixo hebraico.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. «Teve filhos com» evita o arcaísmo «gerou de» e comunica com precisão o sentido genealógico. Os marcadores [a] e [b] aparecem no texto principal.
