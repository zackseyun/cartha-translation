  text: וַ/עֲזַרְיָה֙ הֹלִ֣יד אֶת חָ֔לֶץ וְ/חֶ֖לֶץ הֹלִ֥יד אֶת אֶלְעָשָֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/039.yaml
  text: Azariah fathered Helez[a], and Helez fathered Eleasah.
translation:
  language: pt
  text: Azarias gerou Helez, e Helez gerou Eleasa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, «Elasa»; aqui, a forma hebraica é representada mais diretamente por «Eleasa».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲזַרְיָה
  choice: Azarias
  rationale: Nome próprio vertido na forma tradicional e amplamente reconhecível em português; o waw inicial é representado pelo encadeamento natural da genealogia, sem necessidade de um «e» separado no início do versículo.
- source_word: הֹלִיד
  choice: gerou
  rationale: No hifil e em contexto genealógico, ילד indica gerar ou tornar-se pai de alguém. «Gerou» é conciso, natural e preserva o sentido genealógico masculino.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: Marcador hebraico do objeto direto, sem equivalente lexical independente em português; sua função é expressa pela sintaxe.
- source_word: חָלֶץ / וְחֶלֶץ
  choice: Helez / e Helez
  rationale: O mesmo nome próprio ocorre nos dois elos da genealogia; a transliteração «Helez» mantém reconhecível a forma hebraica, e o waw da segunda ocorrência é traduzido por «e».
- source_word: אֶלְעָשָׂה
  choice: Eleasa
  rationale: Transliteração portuguesa que representa de modo direto a forma hebraica vocalizada neste versículo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com a fórmula genealógica concisa «gerou». Os nomes seguem formas legíveis em português e próximas do hebraico. O marcador da nota foi colocado após «Eleasa», o nome ao qual a variante se refere.
