  text: וּ/בְנֵ֤י יָדָע֙ אֲחִ֣י שַׁמַּ֔י יֶ֖תֶר וְ/יוֹנָתָ֑ן וַ/יָּ֥מָת יֶ֖תֶר לֹ֥א בָנִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/032.yaml
  text: 'The sons of Jada[a], Shammai’s brother: Jether and Jonathan. Jether died without sons.'
translation:
  language: pt
  text: Os filhos de Jada, irmão de Samai, foram Jéter e Jônatas. Jéter morreu sem filhos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Os filhos de
  rationale: O plural em estado construto introduz uma nova subdivisão genealógica. A conjunção hebraica não precisa ser representada por “e” em português, pois o início direto é mais natural.
- source_word: יָדָע
  choice: Jada
  rationale: Transliteração portuguesa do nome próprio hebraico, com a sílaba tônica indicada pela forma terminada em “a”.
- source_word: אֲחִי שַׁמַּי
  choice: irmão de Samai
  rationale: Mantém a relação familiar literal expressa pelo construto hebraico e usa uma forma natural em português.
- source_word: יֶתֶר
  choice: Jéter
  rationale: Transliteração portuguesa do nome próprio, empregada de modo consistente nas duas ocorrências.
- source_word: וְיוֹנָתָן
  choice: e Jônatas
  rationale: Representa a conjunção e adota a forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַיָּמָת
  choice: morreu
  rationale: O wayyiqtol apresenta o evento seguinte na notícia genealógica; o pretérito perfeito é a forma portuguesa natural.
- source_word: לֹא בָנִים
  choice: sem filhos
  rationale: A expressão elíptica significa literalmente “não filhos”. “Sem filhos” comunica de forma clara e concisa que Jéter morreu sem descendentes, no contexto genealógico.
theological_decisions:
- issue: Alcance de בָנִים
  choice: filhos
  alternative: filhos homens
  rationale: Embora בָנִים possa, em certos contextos genealógicos, salientar descendentes masculinos, o termo comum “filhos” preserva a formulação hebraica sem acrescentar uma especificação que o texto não explicita.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe fluente para uma lista genealógica. Os nomes seguem formas portuguesas reconhecíveis. Não foi necessária nota de rodapé, pois “sem filhos” traduz adequadamente a expressão hebraica elíptica.
