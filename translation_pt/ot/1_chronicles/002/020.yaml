  rationale: Nome próprio transliterado segundo a forma tradicional e amplamente reconhecível em português.
- source_word: הוֹלִיד
  choice: gerou
  rationale: No contexto genealógico, o hifil de ילד indica que alguém se tornou pai de um descendente; “gerou” é conciso, natural no registro bíblico português e preserva a força genealógica.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: Marcador hebraico de objeto direto, sem equivalente lexical independente em português; sua função é expressa pela sintaxe.
- source_word: אוּרִי
  choice: Uri
  rationale: Nome próprio transliterado em forma simples e reconhecível em português.
- source_word: וְ
  choice: e
  rationale: Conjunção simples que liga as duas declarações genealógicas sucessivas.
- source_word: בְּצַלְאֵל
  choice: Bezalel
  rationale: Nome próprio transliterado conforme a forma tradicional em português, mantendo correspondência clara com o hebraico.
