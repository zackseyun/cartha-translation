  yaml_path: translation/ot/1_chronicles/002/035.yaml
  text: Sheshan gave his daughter to Jarha his slave as a wife[a], and she bore Attai to him.
translation:
  language: pt
  text: Sesã deu sua filha a Jarha, seu escravo, por mulher[a], e ela lhe deu à luz Atai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «seu servo». O hebraico עֶבֶד pode designar tanto um servo como um escravo; usa-se «escravo» aqui porque a condição dependente de Jarha dentro da casa de Sesã parece ser socialmente significativa na narrativa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: deu
  rationale: Traduz diretamente נתן e, com «por mulher», expressa de modo claro o contexto matrimonial sem expandir o verbo.
- source_word: שֵׁשָׁן
  choice: Sesã
  rationale: Forma portuguesa tradicional e legível do nome próprio hebraico.
- source_word: בִּתּוֹ
  choice: sua filha
  rationale: Reproduz diretamente o termo de parentesco com o sufixo possessivo masculino singular.
- source_word: לְיַרְחָע
  choice: a Jará
  rationale: Nome próprio com a preposição que indica o destinatário; usa-se uma forma portuguesa estabelecida e fonologicamente natural.
- source_word: עַבְדּוֹ
  choice: seu escravo
  rationale: עֶבֶד pode significar servo ou escravo. Aqui, a condição dependente de Jará dentro da casa de Sesã é socialmente relevante, de modo que «escravo» preserva melhor essa força.
- source_word: לְאִשָּׁה
  choice: por mulher
  rationale: Expressão portuguesa concisa que corresponde à fórmula matrimonial hebraica «para mulher/esposa» e conserva o estilo genealógico.
- source_word: וַתֵּלֶד לוֹ
  choice: ela lhe deu à luz
  rationale: Verte a fórmula de nascimento de maneira natural em português, mantendo a relação indicada pelo pronome dativo.
- source_word: עַתָּי
  choice: Atai
  rationale: Transliteração portuguesa clara do nome próprio hebraico.
