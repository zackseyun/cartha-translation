base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/050.yaml
  text: 'These were the sons of Caleb son of Hur[a], the firstborn of Ephrathah: Shobal, father of Kiriath-jearim.'
translation:
  language: pt
  text: 'Estes foram os filhos de Calebe, filho de Hur, o primogênito de Efrata: Sobal, pai de Quiriate-Jearim[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fundador de Quiriate-Jearim” ou “antepassado de Quiriate-Jearim”; em contextos genealógicos, o hebraico “pai de” pode referir-se ao fundador de uma povoação ou ao antepassado de um clã.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה הָיוּ
  choice: Estes foram
  rationale: O demonstrativo plural e o perfeito de היה introduzem a nota genealógica; o passado é natural no contexto narrativo em português.
- source_word: בְּנֵי כָלֵב
  choice: os filhos de Calebe
  rationale: Preserva o sentido formal de בֵּן no plural e usa a forma portuguesa tradicional do nome próprio.
- source_word: בֶּן חוּר
  choice: filho de Hur
  rationale: Mantém a relação genealógica expressa literalmente pelo construto hebraico, sem ampliá-la para “descendente”.
- source_word: בְּכוֹר אֶפְרָתָה
  choice: o primogênito de Efrata
  rationale: A aposição foi colocada junto de Hur, ligação sintática favorecida pela sequência hebraica e preservada pela camada inglesa auditada.
- source_word: שׁוֹבָל
  choice: Sobal
  rationale: Forma portuguesa corrente do nome próprio hebraico.
- source_word: אֲבִי
  choice: pai de
  rationale: Conserva o idioma hebraico; em genealogias ligadas a povoações, o termo também pode designar fundador ou antepassado, alternativas registradas em nota.
- source_word: קִרְיַת יְעָרִים
  choice: Quiriate-Jearim
  rationale: Translitera o topônimo segundo formas bíblicas reconhecíveis em português, em vez de traduzir literalmente o nome.
