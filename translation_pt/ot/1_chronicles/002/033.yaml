  yaml_path: translation/ot/1_chronicles/002/033.yaml
  text: 'And the sons of Jonathan: Peleth and Zaza. These were the sons of Jerahmeel.'
translation:
  language: pt
  text: E os filhos de Jônatas foram Pelete e Zaza. Esses foram os filhos de Jerameel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי יוֹנָתָן
  choice: E os filhos de Jônatas foram
  rationale: O ו preserva a sequência genealógica; a forma verbal «foram» é acrescentada em português para tornar natural a oração nominal hebraica. בְּנֵי é mantido como «filhos», e o nome recebe a forma portuguesa corrente «Jônatas».
- source_word: פֶּלֶת
  choice: Pelete
  rationale: Transliteração do nome próprio hebraico ajustada à ortografia e à pronúncia correntes em português.
- source_word: וְזָזָא
  choice: e Zaza
  rationale: A conjunção liga o segundo filho ao primeiro; o nome próprio é transliterado como «Zaza».
- source_word: אֵלֶּה הָיוּ
  choice: Esses foram
  rationale: O demonstrativo retoma os homens mencionados, e היה funciona aqui como cópula de identificação em um resumo genealógico.
- source_word: בְּנֵי יְרַחְמְאֵל
  choice: os filhos de Jerameel
  rationale: A construção hebraica é traduzida diretamente. «Filhos» preserva a linguagem formal da genealogia sem ampliar o sentido para «descendentes»; «Jerameel» representa o nome hebraico em forma natural para leitores de português.
