  text: וַ/אֲבִיגַ֕יִל יָלְדָ֖ה אֶת עֲמָשָׂ֑א וַ/אֲבִ֣י עֲמָשָׂ֔א יֶ֖תֶר הַ/יִּשְׁמְעֵאלִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/017.yaml
  text: Abigail bore Amasa[a], and the father of Amasa was Jether the Ishmaelite.
translation:
  language: pt
  text: Abigail deu à luz Amasa[a], e o pai de Amasa era Jéter, o ismaelita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos e o texto paralelo de 2 Samuel 17:25 trazem “Itra, o israelita” em vez de “Jéter, o ismaelita”. O Texto Massorético aqui traz “Jéter, o ismaelita”.
    reason: textual_variant
lexical_decisions:
- source_word: יָלְדָה
  choice: deu à luz
  rationale: Com sujeito feminino, o qal de ילד significa aqui “dar à luz”. A expressão é natural em português e preserva explicitamente o sentido materno.
- source_word: אֶת עֲמָשָׂא
  choice: Amasa
  rationale: אֶת é a marca do objeto direto e não recebe tradução independente; o nome pessoal é transliterado segundo a forma portuguesa consagrada.
- source_word: וַאֲבִי עֲמָשָׂא
  choice: e o pai de Amasa
  rationale: Reproduz com clareza e naturalidade a relação genealógica explícita da construção hebraica.
- source_word: יֶתֶר
  choice: Jéter
  rationale: Transliteração do nome pessoal adaptada à ortografia e à pronúncia correntes em português.
- source_word: הַיִּשְׁמְעֵאלִי
  choice: o ismaelita
  rationale: O hebraico traz o artigo definido; a designação gentílica identifica Jéter.
