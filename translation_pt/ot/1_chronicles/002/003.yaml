base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/003.yaml
  text: 'The sons of Judah: Er[a], Onan, and Shelah; three were born to him by Bath-shua the Canaanite. Er, Judah’s firstborn, was evil in the sight of Yahweh[b], and he put him to death.'
translation:
  language: pt
  text: 'Os filhos de Judá: Er, Onã e Selá; esses três nasceram da filha de Sua, a cananeia.[a] Er, o primogênito de Judá, era mau aos olhos de Yahweh, e Yahweh o matou.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de Bate-Sua, a cananeia”, entendendo “Bate-Sua” como nome próprio. O hebraico também pode ser lido literalmente como “da filha de Sua, a cananeia”.'
    reason: lexical_alternative
  - marker: b
    text: No hebraico, o sujeito de “o matou” está implícito; o contexto o identifica mais naturalmente com Yahweh, mencionado na oração anterior.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יְהוּדָה
  choice: Os filhos de Judá
  rationale: Reproduz a construção genealógica de modo claro e natural em português.
- source_word: שְׁלוֹשָׁה נוֹלַד לוֹ
  choice: Esses três nasceram
  rationale: Mantém explicitamente o número recapitulativo e o sentido passivo do nifal de ילד, evitando transformar a frase em uma formulação ativa como “Judá gerou”.
- source_word: מִבַּת שׁוּעַ הַכְּנַעֲנִית
  choice: da filha de Sua, a cananeia
  rationale: Segue a segmentação mais direta do hebraico, “da filha de Sua, a cananeia”, enquanto a nota registra a possível leitura de Bate-Sua como nome próprio.
- source_word: בְּכוֹר יְהוּדָה
  choice: o primogênito de Judá
  rationale: Expressa naturalmente a relação de construto e conserva o destaque genealógico.
- source_word: רַע בְּעֵינֵי יְהוָה
  choice: era mau aos olhos de Yahweh
  rationale: Preserva a fórmula avaliativa hebraica e sua metáfora visual em português corrente e digno.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: וַיְמִיתֵהוּ
  choice: e este o matou
  rationale: Comunica com naturalidade o sentido causativo do verbo. “Este” aponta para Yahweh, o referente imediatamente anterior, sem repetir o nome.
theological_decisions:
- issue: Sujeito implícito de וַיְמִיתֵהוּ
  choice: “e este o matou”, referindo “este” a Yahweh
  alternative: “e Yahweh o matou” ou simplesmente “e o matou”
  rationale: O hebraico não repete o sujeito; o referente mais natural é Yahweh, mencionado na oração anterior. O demonstrativo torna a referência inteligível sem inserir novamente o nome no texto.
- issue: Forma do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: A transliteração preserva no texto o caráter de nome próprio do tetragrama.
translation_notes:
  register: Português moderno, claro e digno, com cadência genealógica. “Onã” e “Selá” seguem formas portuguesas usuais; a fórmula “aos olhos de” conserva a imagem hebraica sem soar obscura.
