base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/054.yaml
  text: 'The sons of Salma: Bethlehem[a], the Netophathites, Atroth-beth-joab, half of the Manahathites[b], the Zorites.'
translation:
  language: pt
  text: 'Os filhos de Salma: Belém, os netofatitas, Atarote-Bete-Joabe, metade dos manaatitas e os zoreítas[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, «menuotitas». A associação exata deste gentílico hebraico com um nome de lugar é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Os filhos de
  rationale: Mantém a fórmula genealógica hebraica, embora neste contexto ela possa abranger descendentes ou grupos de clãs, e não apenas filhos imediatos.
- source_word: שַׂלְמָא
  choice: Salma
  rationale: Transliteração natural do nome próprio segundo a forma consonantal hebraica.
- source_word: בֵּית לֶחֶם
  choice: Belém
  rationale: Emprega a forma portuguesa consagrada do topônimo; na lista genealógica, o nome provavelmente representa a comunidade ou o clã ligado a Belém.
- source_word: וּנְטוֹפָתִי
  choice: os netofatitas
  rationale: O gentílico singular hebraico tem sentido coletivo no contexto, por isso foi vertido no plural como designação de um grupo.
- source_word: עַטְרוֹת בֵּית יוֹאָב
  choice: Atrote-Bete-Joabe
  rationale: Preserva como nome próprio composto aquilo que, no contexto genealógico e geográfico, é mais provavelmente um topônimo ou nome de clã.
- source_word: וַחֲצִי הַמָּנַחְתִּי
  choice: metade dos manatitas
  rationale: Expressa em português natural a referência coletiva do gentílico hebraico e conserva a ideia literal de metade do grupo.
- source_word: הַצָּרְעִי
  choice: os zoritas
  rationale: Trata o gentílico singular como coletivo e mantém uma forma transliterada concisa ligada provavelmente a Zorá.
theological_decisions: []
