  register: Português moderno, claro e digno, com formas de nomes legíveis para o público brasileiro. Os gentílicos hebraicos no singular foram vertidos como coletivos no plural. A estrutura concisa de lista foi preservada, e as incertezas referentes aos gentílicos foram mantidas em notas.
