base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/052.yaml
  text: 'And Shobal the father of Kiriath-jearim had sons: Haroeh[c][b][a], half of the Manahathites.'
translation:
  language: pt
  text: 'Sobal, pai[a] de Quiriate-Jearim, teve filhos: Haroé[b] e metade dos menuotitas[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fundador de Quiriate-Jearim”. Nas genealogias, “pai de” pode indicar o ancestral, fundador ou chefe ligado a uma cidade.
    reason: lexical_alternative
  - marker: b
    text: Haroé talvez seja uma forma de um nome próprio também vertido como “Reaías” em algumas tradições.
    reason: alternative_reading
  - marker: c
    text: 'Hebraico: “metade de Menuote”. A expressão também pode significar “metade dos habitantes” ou “metade do clã de Menuote (Manaate)”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ בָנִים לְשׁוֹבָל
  choice: Sobal ... teve estes filhos
  rationale: A construção hebraica significa literalmente “houve filhos para Sobal”; em português natural, “Sobal teve estes filhos” preserva o sentido genealógico e introduz adequadamente os nomes ou grupos seguintes.
- source_word: אֲבִי קִרְיַת יְעָרִים
  choice: pai de Quiriate-Jearim
  rationale: Mantém a expressão hebraica de modo transparente. Em genealogias ligadas a povoações, “pai” pode indicar ancestral, fundador ou chefe associado à cidade, possibilidade registrada em nota.
- source_word: קִרְיַת יְעָרִים
  choice: Quiriate-Jearim
  rationale: Transliteração portuguesa corrente do topônimo hebraico, em vez de traduzir seu significado como “Cidade das Florestas”.
- source_word: הָרֹאֶה
  choice: Haroé
  rationale: No contexto da genealogia, a forma é tratada como nome próprio e transliterada segundo sua vocalização no texto massorético, sem identificá-la de modo definitivo com “Reaías” nem traduzi-la como “o vidente”.
- source_word: חֲצִי הַמְּנֻחוֹת
  choice: metade dos menuotitas
  rationale: A expressão literalmente ambígua, “metade de Menuote/dos Menuote”, provavelmente designa metade de um clã ou população ligada a Menuote. A formulação gentilícia é inteligível em português, enquanto outras possibilidades permanecem na nota.
theological_decisions: []
translation_notes:
  register: Português atual, digno e de leitura ampla, com grafias bíblicas reconhecíveis no uso brasileiro. A ordem das notas acompanha a ocorrência dos termos no texto. O acréscimo de “e” antes de “metade” apresenta os dois elementos como descendência de Sobal, mas a sintaxe hebraica permanece difícil e permite entender a expressão final como qualificação de Haroé.
