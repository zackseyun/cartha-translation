  text: וַ/יֹּ֤אמֶר יְהוָה֙ לַ/מַּלְאָ֔ךְ וַ/יָּ֥שֶׁב חַרְבּ֖/וֹ אֶל נְדָנָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/027.yaml
  text: And Yahweh spoke to the angel[b][a], and he returned his sword to its sheath.
translation:
  language: pt
  text: Então Yahweh falou ao anjo, e ele pôs sua espada de volta na bainha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיֹּאמֶר
  choice: falou
  rationale: אמר significa basicamente “dizer”; com o complemento “ao anjo”, “falou” é natural em português e não explicita indevidamente a ideia de ordem.
- source_word: לַמַּלְאָךְ
  choice: ao anjo
  rationale: Embora מַלְאָךְ também possa significar “mensageiro”, o contexto do ser celestial com a espada desembainhada favorece “anjo”.
- source_word: וַיָּשֶׁב
  choice: pôs de volta
  rationale: A forma causativa de שׁוב comunica fazer voltar ou recolocar; com “espada”, “pôs de volta” é claro e idiomático.
- source_word: חַרְבּוֹ
  choice: sua espada
  rationale: Reproduz naturalmente a construção possessiva, cujo referente contextual é o anjo.
- source_word: אֶל נְדָנָהּ
  choice: na bainha
  rationale: נְדָן designa a bainha da espada; em português, “pôr de volta na bainha” expressa de modo natural o movimento indicado por אֶל.
theological_decisions:
- issue: Sujeito de וַיָּשֶׁב (“e pôs de volta”)
  choice: O anjo é o sujeito contextual de “pôs sua espada de volta”.
  alternative: Yahweh seria o sujeito gramatical e faria a espada voltar.
  rationale: A menção imediatamente anterior do anjo e a expressão “sua espada” favorecem fortemente o anjo como aquele que a recoloca na bainha, em resposta à palavra de Yahweh.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Então” dá continuidade natural à sequência narrativa; a formulação concisa acompanha a estrutura hebraica sem rigidez artificial.
