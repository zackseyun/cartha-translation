  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּתֵּ֧ן יְהוָ֛ה דֶּ֖בֶר בְּ/יִשְׂרָאֵ֑ל וַ/יִּפֹּל֙ מִ/יִּשְׂרָאֵ֔ל שִׁבְעִ֥ים אֶ֖לֶף אִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/014.yaml
  text: So Yahweh sent a plague on Israel[a], and seventy thousand men of Israel fell.
translation:
  language: pt
  text: Então Yahweh enviou uma praga sobre Israel[a], e setenta mil homens de Israel caíram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “peste”. O termo hebraico indica um surto mortal, muitas vezes no contexto do juízo divino.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, preservando-o como nome pessoal em vez de substituí-lo por um título.
- source_word: וַיִּתֵּן
  choice: enviou
  rationale: Embora o verbo signifique literalmente “deu”, com דֶּבֶר o português idiomático pede “enviou uma praga”, sem atenuar a agência divina expressa no hebraico.
- source_word: דֶּבֶר
  choice: uma praga
  rationale: Designa um surto mortal, frequentemente associado ao juízo divino; “praga” é claro e corrente em português.
- source_word: בְּיִשְׂרָאֵל
  choice: sobre Israel
  rationale: Expressa de modo natural a vinda da praga contra ou sobre o povo, preservando a força da preposição no contexto.
- source_word: וַיִּפֹּל
  choice: caíram
  rationale: Mantém o idioma hebraico de cair em morte ou juízo, inteligível em português, sem explicitar além do texto que “morreram”.
- source_word: מִיִּשְׂרָאֵל
  choice: de Israel
  rationale: Indica naturalmente pertencimento ao povo de Israel.
- source_word: שִׁבְעִים אֶלֶף אִישׁ
  choice: setenta mil homens
  rationale: Preserva אִישׁ, usado coletivamente após o numeral, sem generalizá-lo silenciosamente para “pessoas”.
theological_decisions:
- issue: Agência divina no juízo
  choice: Yahweh enviou uma praga
  alternative: Yahweh permitiu que uma praga viesse
  rationale: O hebraico atribui diretamente a ação a Yahweh e não contém um verbo de permissão; a tradução preserva essa tensão teológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Então” dá continuidade narrativa; “caíram” conserva o idioma solene do hebraico sem soar arcaico.
