  text: וּ/מִשְׁכַּ֣ן יְ֠הוָה אֲשֶׁר עָשָׂ֨ה מֹשֶׁ֧ה בַ/מִּדְבָּ֛ר וּ/מִזְבַּ֥ח הָ/עוֹלָ֖ה בָּ/עֵ֣ת הַ/הִ֑יא בַּ/בָּמָ֖ה בְּ/גִבְעֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/029.yaml
  text: The tabernacle of Yahweh, which Moses had made in the wilderness, and the altar of burnt offering were at that time on the high place at Gibeon.
translation:
  language: pt
  text: O tabernáculo de Yahweh, que Moisés havia feito no deserto, e o altar do holocausto estavam, naquele tempo, no lugar alto em Gibeão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁכַּן
  choice: tabernáculo
  rationale: No contexto do santuário mosaico, “tabernáculo” é o termo cultual consagrado e mais preciso em português; “morada” seria amplo demais.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֲשֶׁר עָשָׂה
  choice: que Moisés havia feito
  rationale: A forma mais-que-perfeita composta expressa naturalmente, em português moderno, a construção anterior do tabernáculo por Moisés.
- source_word: בַמִּדְבָּר
  choice: no deserto
  rationale: “Deserto” é a forma corrente e clara em português para o cenário ermo da peregrinação de Israel.
- source_word: מִזְבַּח הָעוֹלָה
  choice: o altar do holocausto
  rationale: Expressão cultual tradicional e inteligível para o altar destinado à oferta inteiramente queimada.
- source_word: בָּעֵת הַהִיא
  choice: naquele tempo
  rationale: Reproduz com naturalidade a indicação temporal do hebraico.
- source_word: בַּבָּמָה
  choice: no lugar alto
  rationale: Mantém o sentido cultual de בָּמָה sem reduzir a expressão simplesmente a uma localização geográfica elevada.
- source_word: בְּגִבְעוֹן
  choice: de Gibeão
  rationale: Em ligação com “lugar alto”, a construção “lugar alto de Gibeão” identifica de modo natural o local associado à cidade.
- source_word: וּ
  choice: e
  rationale: A conjunção liga “o altar” a “o tabernáculo”; não se acrescenta um marcador temporal como “ora”, ausente do texto-fonte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome pessoal divino; a transliteração conserva essa distinção e evita substituí-lo silenciosamente por um título.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e terminologia cultual reconhecível. A concordância no plural reflete o sujeito composto “o tabernáculo... e o altar”. A posição de “naquele tempo” foi marcada por vírgulas para facilitar a leitura.
