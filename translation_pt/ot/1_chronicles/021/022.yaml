  text: וַ/יֹּ֨אמֶר דָּוִ֜יד אֶל אָרְנָ֗ן תְּנָ/ה לִּ/י֙ מְק֣וֹם הַ/גֹּ֔רֶן וְ/אֶבְנֶה בּ֥/וֹ מִזְבֵּ֖חַ לַ/יהוָ֑ה בְּ/כֶ֤סֶף מָלֵא֙ תְּנֵ֣/הוּ לִ֔/י וְ/תֵעָצַ֥ר הַ/מַּגֵּפָ֖ה מֵ/עַ֥ל הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/022.yaml
  text: Then David said to Ornan, “Give me the place of the threshing floor, so that I may build on it an altar to the LORD. Give it to me for the full price, so that the plague may be stopped from upon the people.”
translation:
  language: pt
  text: 'Então Davi disse a Ornã: “Dê-me o lugar da eira, para que eu construa nele um altar ao SENHOR. Dê-o a mim pelo preço integral, para que a praga seja afastada do povo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְקוֹם הַגֹּרֶן
  choice: o lugar da eira
  rationale: Traduz diretamente a expressão hebraica, preservando tanto o sentido espacial de מְקוֹם quanto o termo agrícola tradicional e compreensível “eira” para גֹּרֶן.
- source_word: בְּכֶסֶף מָלֵא
  choice: pelo preço integral
  rationale: A expressão indica pagamento completo, sem desconto ou doação; “preço integral” comunica isso naturalmente em português.
- source_word: וְתֵעָצַר
  choice: para que ... cesse
  rationale: No contexto de uma praga, o verbo passivo de deter/conter é expresso com naturalidade por “cessar”, sem alterar a relação final introduzida pela conjunção.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: YHWH / Javé
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o Tetragrama por “SENHOR” em versaletes, sem impor uma vocalização discutida.
- issue: Construção מֵעַל הָעָם
  choice: cesse de sobre o povo
  alternative: seja afastada do povo
  rationale: A formulação mantém a imagem e a relação espacial do hebraico, evitando explicitar um afastamento que, embora provável no sentido, não é formulado diretamente.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “você” implícito nas formas de terceira pessoa. Conserva “eira” por precisão histórica e mantém uma leve literalidade em “cesse de sobre o povo” para refletir o hebraico.
