  text: וּ/דְבַר הַ/מֶּ֖לֶךְ חָזַ֣ק עַל יוֹאָ֑ב וַ/יֵּצֵ֣א יוֹאָ֗ב וַ/יִּתְהַלֵּךְ֙ בְּ/כָל יִשְׂרָאֵ֔ל וַ/יָּבֹ֖א יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/004.yaml
  text: But the king’s word prevailed against Joab[a]. So Joab went out and went throughout all Israel[b], and he came to Jerusalem.
translation:
  language: pt
  text: Mas a palavra do rei prevaleceu contra Joabe[a]. Então Joabe saiu, percorreu todo o Israel[b] e chegou a Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a ordem do rei prevaleceu sobre Joabe”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “viajou por todo o Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְבַר הַמֶּלֶךְ
  choice: Mas a palavra do rei
  rationale: דָּבָר significa literalmente “palavra” ou “assunto”, mas aqui designa a ordem verbal do rei. “Palavra” preserva a expressão hebraica, e “Mas” marca o contraste com a objeção de Joabe no contexto anterior.
- source_word: חָזַק עַל
  choice: prevaleceu contra
  rationale: A construção expressa que a palavra do rei se mostrou mais forte que a resistência de Joabe. “Prevaleceu contra” mantém a força e a direção do idioma hebraico sem explicá-lo em excesso.
- source_word: וַיֵּצֵא יוֹאָב
  choice: Então Joabe saiu
  rationale: יָצָא é o verbo comum para “sair”. “Então” apresenta a ação seguinte como consequência narrativa da decisão do rei.
- source_word: וַיִּתְהַלֵּךְ בְּכָל יִשְׂרָאֵל
  choice: percorreu todo o Israel
  rationale: O hitpael de הָלַךְ sugere deslocar-se por uma região. “Percorreu” é natural e conciso em português e comunica o movimento por todo o território sem acrescentar detalhes ausentes do texto.
- source_word: כָּל יִשְׂרָאֵל
  choice: todo o Israel
  rationale: Equivalência direta e idiomática da expressão que indica a extensão nacional completa da viagem de Joabe.
- source_word: וַיָּבֹא יְרוּשָׁלִָם
  choice: e chegou a Jerusalém
  rationale: בּוֹא significa “vir”, “entrar” ou, conforme a perspectiva em português, “chegar”. Embora o contexto possa sugerir retorno, o hebraico não emprega um verbo específico para “voltar”.
