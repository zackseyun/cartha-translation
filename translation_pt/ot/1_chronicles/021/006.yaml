  text: וְ/לֵוִי֙ וּ/בִנְיָמִ֔ן לֹ֥א פָקַ֖ד בְּ/תוֹכָ֑/ם כִּֽי נִתְעַ֥ב דְּבַר הַ/מֶּ֖לֶךְ אֶת יוֹאָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/006.yaml
  text: But he did not count Levi and Benjamin among them[a], because the king’s command was detestable to Joab.
translation:
  language: pt
  text: Mas não contou Levi e Benjamim entre eles, porque a ordem do rei era repugnante para Joabe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a palavra do rei era repugnante para Joabe”.
    reason: Preserva como alternativa o sentido mais literal de דְּבַר (“palavra”), sem excluir o sentido contextual de “ordem”.
lexical_decisions:
- source_word: וְ/לֵוִי
  choice: Mas Levi
  rationale: O nome tribal é vertido como “Levi”. A conjunção recebe valor adversativo (“Mas”) por causa do contraste com os totais do recenseamento mencionados anteriormente.
- source_word: וּ/בִנְיָמִן
  choice: e Benjamim
  rationale: O nome tribal é vertido na forma portuguesa consagrada “Benjamim” e coordenado com Levi como uma das duas tribos omitidas.
- source_word: לֹא פָקַד
  choice: não contou
  rationale: No contexto de um recenseamento, פקד significa contar ou incluir na contagem. “Não contou” é claro, natural e fiel ao contexto.
- source_word: בְּ/תוֹכָ/ם
  choice: entre eles
  rationale: A expressão significa literalmente “no meio deles” e, aqui, indica que Levi e Benjamim não foram incluídos entre os grupos recenseados.
- source_word: כִּי
  choice: porque
  rationale: Introduz a causa da omissão das duas tribos.
- source_word: נִתְעַב
  choice: era repugnante
  rationale: O nifal expressa que algo era considerado abominável ou causava forte aversão. “Repugnante” preserva a intensidade sem soar arcaico.
- source_word: דְּבַר הַ/מֶּלֶךְ
  choice: a ordem do rei
  rationale: דבר pode significar “palavra”, “assunto” ou “ordem”. Neste contexto, refere-se à determinação real de realizar o recenseamento; “ordem” comunica esse sentido com naturalidade.
- source_word: אֶת יוֹאָב
  choice: para Joabe
  rationale: Depois de uma expressão de avaliação ou aversão, אֶת assinala a pessoa para quem a ordem era repugnante.
