  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/מַלְאַ֧ךְ יְהוָ֛ה אָמַ֥ר אֶל גָּ֖ד לֵ/אמֹ֣ר לְ/דָוִ֑יד כִּ֣י יַעֲלֶ֣ה דָוִ֗יד לְ/הָקִ֤ים מִזְבֵּ֨חַ֙ לַ/יהוָ֔ה בְּ/גֹ֖רֶן אָרְנָ֥ן הַ/יְבֻסִֽי־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/018.yaml
  text: And the angel of Yahweh said to Gad to tell David that David should go up to set up an altar to Yahweh on the threshing floor of Ornan the Jebusite[a][b].
translation:
  language: pt
  text: E o anjo de Yahweh[a] disse a Gade que dissesse a Davi que Davi subisse[b] para erguer um altar a Yahweh na eira de Ornã, o jebuseu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o mensageiro de Yahweh”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que Davi deveria subir” ou “que Davi tinha de subir”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְאַךְ יְהוָה
  choice: E o anjo de Yahweh
  rationale: מַלְאַךְ pode designar um mensageiro humano ou celestial; neste contexto narrativo, trata-se de um ser celestial, por isso “anjo” é a forma mais natural. O nome divino יְהוָה é transliterado como “Yahweh”.
- source_word: אָמַר אֶל גָּד
  choice: disse a Gade
  rationale: Tradução direta e idiomática do verbo comum אָמַר com seu destinatário.
- source_word: לֵאמֹר לְדָוִיד
  choice: que dissesse a Davi
  rationale: Conserva a repetição do verbo de fala e expressa naturalmente, em português, que Gade deveria transmitir a mensagem a Davi.
- source_word: כִּי יַעֲלֶה דָוִיד
  choice: que Davi subisse
  rationale: O imperfeito hebraico, no conteúdo da instrução, tem força diretiva. “Subisse” preserva essa força e o sentido espacial de עלה sem torná-lo apenas “fosse”.
- source_word: לְהָקִים
  choice: para erguer
  rationale: O infinitivo expressa a finalidade da subida. “Erguer” corresponde bem a קום no causativo quando aplicado à instalação de um altar.
- source_word: מִזְבֵּחַ
  choice: um altar
  rationale: Equivalente português convencional para a estrutura sacrificial indicada pelo substantivo hebraico.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição marca a dedicação ou relação do altar com Yahweh; “um altar a Yahweh” é conciso e natural.
- source_word: בְּגֹרֶן
  choice: na eira
  rationale: גֹרֶן designa o espaço em que se debulhavam cereais; “eira” é o termo português preciso e tradicional.
- source_word: אָרְנָן הַיְבֻסִי
  choice: de Ornã, o jebuseu
  rationale: O nome próprio é apresentado em sua forma portuguesa corrente, e o gentílico definido é traduzido por aposição.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz explicitamente o Tetragrama. “Yahweh” preserva o nome próprio e evita substituí-lo por um título.
- issue: Força modal de יַעֲלֶה no discurso transmitido
  choice: que Davi subisse
  alternative: que Davi deveria subir; que Davi tinha de subir
  rationale: O contexto comunica uma instrução, mas a forma hebraica isoladamente não exige que se escolha entre uma formulação prescritiva mais branda e outra de obrigação mais forte. O subjuntivo português conserva a diretividade sem resolver excessivamente essa nuance.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição de “Davi” foi mantida para evitar a ambiguidade pronominal que “ele” poderia criar entre Gade e Davi. “Eira” conserva a precisão histórica do local.
