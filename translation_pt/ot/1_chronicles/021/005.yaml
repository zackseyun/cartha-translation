base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/005.yaml
  text: Joab gave the number of the census of the people to David. All Israel was 1,100,000 men drawing the sword[a], and Judah was 470,000 men drawing the sword.
translation:
  language: pt
  text: Joabe entregou a Davi o total do recenseamento do povo. Todo o Israel totalizava 1.100.000 homens que sacavam a espada, e Judá, 470.000 homens que sacavam a espada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִסְפַּר מִפְקַד הָעָם
  choice: o total do recenseamento do povo
  rationale: Preserva a ideia combinada de número total e recenseamento, evitando a formulação pouco natural «o número do recenseamento».
- source_word: וַיְהִי כָל יִשְׂרָאֵל
  choice: Todo o Israel somava
  rationale: Expressa naturalmente em português a construção resultativa hebraica que introduz o total apurado.
- source_word: אֶלֶף אֲלָפִים וּמֵאָה אֶלֶף
  choice: 1.100.000
  rationale: Algarismos e separadores segundo o uso corrente em português tornam o número extenso imediatamente legível; a forma literal é preservada em nota.
- source_word: אִישׁ
  choice: homens
  rationale: No contexto de recenseamento militar, o substantivo designa especificamente os homens contados para o combate.
- source_word: שֹׁלֵף חֶרֶב
  choice: capazes de empunhar a espada
  rationale: Comunica o valor militar do idioma hebraico de sacar ou desembainhar a espada, com clareza natural para leitores modernos.
- source_word: וִיהוּדָה
  choice: e Judá
  rationale: Mantém o paralelismo entre os totais de Israel e de Judá; o verbo «somava» fica elíptico, de maneira natural em português.
- source_word: אַרְבַּע מֵאוֹת וְשִׁבְעִים אֶלֶף
  choice: '470.000'
  rationale: A apresentação em algarismos é clara e natural em português contemporâneo.
