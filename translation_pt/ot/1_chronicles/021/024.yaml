base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/024.yaml
  text: But King David said to Ornan[a], “No, for I will surely buy it for the full price in silver, because I will not take for Yahweh what is yours[b], nor offer up a burnt offering for nothing.”
translation:
  language: pt
  text: 'Mas o rei Davi disse a Ornã: “Não! Eu certamente o comprarei pelo preço integral em prata, pois não tomarei para Yahweh o que é seu, nem oferecerei um holocausto sem custo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא כִּי
  choice: Não! ... pois
  rationale: Expressa a recusa firme de Davi e conserva o valor explicativo/causal da sequência hebraica em português natural.
- source_word: קָנֹה אֶקְנֶה
  choice: Eu certamente o comprarei
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a decisão de comprar; “certamente” preserva essa ênfase.
- source_word: בְּכֶסֶף מָלֵא
  choice: pelo preço integral em prata
  rationale: Indica pagamento monetário completo, não simbólico, e mantém explícito que o pagamento seria em prata.
- source_word: אֶשָּׂא אֲשֶׁר לְךָ
  choice: não tomarei ... o que é seu
  rationale: Neste contexto, נשׂא designa tomar ou apropriar-se de algo pertencente a outra pessoa; a formulação preserva claramente a posse.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: Mantém o nome divino do texto hebraico e o sentido de destinar algo a Yahweh em contexto sacrificial.
- source_word: וְהַעֲלוֹת עוֹלָה
  choice: nem oferecerei um holocausto
  rationale: “Holocausto” é o termo português tradicional e preciso para a oferta inteiramente queimada; “nem” torna natural a continuidade negativa implícita.
- source_word: חִנָּם
  choice: sem pagar por ele
  rationale: No contexto da compra recusada como presente, comunica com clareza que Davi não apresentaria uma oferta que nada lhe tivesse custado.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico traz diretamente o Tetragrama; “Yahweh” preserva o nome próprio e segue a decisão doutrinária fornecida, sem substituí-lo por um título.
- issue: Sentido de חִנָּם no contexto do sacrifício
  choice: sem pagar por ele
  alternative: de graça / sem custo
  rationale: A escolha mantém o foco imediato no pagamento integral pela propriedade e não transforma a declaração em uma máxima teológica mais ampla, embora essa implicação permaneça possível.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem “tomarei para Yahweh o que é seu” acompanha de perto a estrutura hebraica. O pronome “o” em “o comprarei” retoma naturalmente o bem oferecido no contexto imediato.
