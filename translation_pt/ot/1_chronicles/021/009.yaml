  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל גָּ֔ד חֹזֵ֥ה דָוִ֖יד לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/009.yaml
  text: And Yahweh spoke to Gad[a], David’s seer, saying,
translation:
  language: pt
  text: 'E Yahweh[a] falou a Gade, o vidente de Davi, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido como “SENHOR”.'
    reason: Esclarece a forma hebraica do nome divino e sua tradução tradicional.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O verbo דבר, com waw consecutivo, dá continuidade à narrativa e introduz a fala divina; “falou” é natural e preciso em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição indica o destinatário da fala; “falou a Gade” reproduz essa relação de modo claro e digno.
- source_word: גָּד
  choice: Gade
  rationale: Emprega a forma portuguesa tradicional e reconhecível do nome próprio.
- source_word: חֹזֵה
  choice: vidente
  rationale: Preserva o sentido de alguém que recebe revelação por visão e mantém a distinção lexical em relação ao termo mais amplo “profeta”.
- source_word: דָוִיד
  choice: de Davi
  rationale: Expressa naturalmente em português a relação construta hebraica, identificando Gade como o vidente ligado a Davi.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Conserva a fórmula hebraica que introduz o discurso direto, sem antecipar ou parafrasear seu conteúdo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama. A transliteração preserva o caráter de nome pessoal, enquanto “SENHOR” reflete a substituição tradicional por um título.
translation_notes:
  register: Português moderno, claro e solene. A construção “o vidente de Davi” mantém a função de Gade sem ampliar “vidente” para “profeta”; “dizendo” preserva a fórmula narrativa hebraica.
