  text: וַ/יֵּ֨רַע֙ בְּ/עֵינֵ֣י הָ/אֱלֹהִ֔ים עַל הַ/דָּבָ֖ר הַ/זֶּ֑ה וַ/יַּ֖ךְ אֶת יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/007.yaml
  text: But this matter was evil in the sight of God[a], so he struck Israel.
translation:
  language: pt
  text: Mas esse ato foi mau aos olhos de Deus[a], e ele feriu Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desagradou a Deus”. O hebraico diz literalmente: “foi mau aos olhos de Deus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרַע
  choice: foi mau
  rationale: Preserva a força avaliativa do verbo hebraico, que caracteriza o ato como mau, sem atenuá-lo para uma simples reação de desagrado.
- source_word: בְּעֵינֵי הָאֱלֹהִים
  choice: aos olhos de Deus
  rationale: Reproduz de modo claro e natural em português a metáfora hebraica que expressa a avaliação divina.
- source_word: הָאֱלֹהִים
  choice: Deus
  rationale: O texto emprega Elohim, e não o nome divino YHWH; por isso, a tradução adequada é “Deus”.
- source_word: עַל הַדָּבָר הַזֶּה
  choice: esse ato
  rationale: Neste contexto, דָּבָר se refere ao recenseamento ordenado por Davi. “Esse ato” é natural e específico o bastante, sem acrescentar uma interpretação além do contexto imediato.
- source_word: וַיַּךְ
  choice: feriu
  rationale: Traduz o verbo נכה sem especificar indevidamente que todo Israel foi morto; também conserva a ideia de uma ação punitiva direta.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém o objeto coletivo tal como aparece no hebraico, sem expandi-lo desnecessariamente para “o povo de Israel”.
- source_word: וַ
  choice: Mas ... e
  rationale: “Mas” expressa a leve contraposição entre a ação anteriormente narrada e sua avaliação por Deus. O segundo waw permanece como “e”, preservando a sequência narrativa sem tornar explícita uma relação causal além da construção hebraica.
theological_decisions:
- issue: A avaliação divina do recenseamento de Davi e o juízo subsequente
  choice: O ato é declarado mau aos olhos de Deus, que então fere Israel.
  alternative: Traduzir a avaliação apenas como desagrado e suavizar “feriu” como uma resposta não judicial.
  rationale: A formulação preserva tanto a forte avaliação moral quanto a ação divina direta. Também mantém, sem tentar solucioná-la, a tensão narrativa de que o ato de Davi é condenado, mas Israel é atingido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A expressão “aos olhos de Deus” é corrente e conserva a imagem do hebraico; “feriu” evita tanto o arcaísmo de “castigou com golpes” quanto a especificação excessiva de “matou”.
