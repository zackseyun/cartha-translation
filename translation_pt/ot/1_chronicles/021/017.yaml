  text: וַ/יֹּ֣אמֶר דָּוִ֣יד אֶֽל הָ/אֱלֹהִ֡ים הֲ/לֹא֩ אֲנִ֨י אָמַ֜רְתִּי לִ/מְנ֣וֹת בָּ/עָ֗ם וַ/אֲנִי ה֤וּא אֲשֶׁר חָטָ֨אתִי֙ וְ/הָרֵ֣עַ הֲרֵע֔וֹתִי וְ/אֵ֥לֶּה הַ/צֹּ֖אן מֶ֣ה עָשׂ֑וּ יְהוָ֣ה אֱלֹהַ֗/י תְּהִ֨י נָ֤א יָֽדְ/ךָ֙ בִּ֚/י וּ/בְ/בֵ֣ית אָבִ֔/י וּֽ/בְ/עַמְּ/ךָ֖ לֹ֥א לְ/מַגֵּפָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/017.yaml
  text: Then David said to God[a], “Was it not I who ordered the people to be counted? I am the one who has sinned and done great evil. But these sheep—what have they done? O Yahweh my God, please let your hand be against me and against my father’s house[d][c][b], but not against your people for a plague.”
translation:
  language: pt
  text: 'Então Davi disse a Deus: “Não fui eu que mandei contar o povo[a]? Eu sou aquele que pecou e agi muito mal. Mas estas ovelhas[b], o que fizeram? Ó Yahweh, meu Deus, por favor, que a tua mão seja contra mim e contra a casa de meu pai[c], mas não contra o teu povo, trazendo uma praga[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “disse para contar o povo”; isto é, ordenou que o povo fosse contado.'
    reason: lexical_alternative
  - marker: b
    text: “Estas ovelhas” é uma metáfora para o povo.
    reason: cultural_note
  - marker: c
    text: 'Ou: “que a tua mão esteja sobre mim e sobre a casa de meu pai”. A “mão” representa aqui o poder de Deus em ação ou em juízo.'
    reason: lexical_alternative
  - marker: d
    text: 'Também é possível traduzir: “mas não seja contra o teu povo com uma praga”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא אֲנִי אָמַרְתִּי לִמְנוֹת בָּעָם
  choice: Não fui eu que mandei contar o povo?
  rationale: Conserva a pergunta retórica e expressa em português natural a ordem de Davi que deu início ao recenseamento; literalmente, o hebraico diz que ele ‘disse para contar’.
- source_word: וַאֲנִי הוּא אֲשֶׁר חָטָאתִי
  choice: Eu sou aquele que pecou
  rationale: Mantém a construção enfática pela qual Davi assume pessoalmente a culpa.
- source_word: וְהָרֵעַ הֲרֵעוֹתִי
  choice: e agiu muito mal
  rationale: O infinitivo absoluto junto ao verbo conjugado intensifica a afirmação. A formulação preserva essa ênfase de modo claro e idiomático.
- source_word: וְאֵלֶּה הַצֹּאן
  choice: Mas estas ovelhas
  rationale: Mantém explícita a metáfora pastoral usada por Davi para se referir ao povo.
- source_word: יְהוָה אֱלֹהַי
  choice: Ó Yahweh, meu Deus
  rationale: Reproduz o nome divino e o possessivo da invocação direta; ‘Ó’ assinala o vocativo em português natural e solene.
- source_word: תְּהִי נָא יָדְךָ בִּי
  choice: por favor, que a tua mão seja contra mim
  rationale: Preserva a metáfora hebraica da ‘mão’ como poder divino em ação, enquanto ‘contra’ explicita o sentido punitivo indicado pelo contexto.
- source_word: בִּי וּבְבֵית אָבִי
  choice: contra mim e contra a casa de meu pai
  rationale: Conserva a repetição da relação preposicional e a expressão hebraica para a família, linhagem ou dinastia paterna.
- source_word: וּבְעַמְּךָ לֹא לְמַגֵּפָה
  choice: mas não contra o teu povo, trazendo uma praga
  rationale: Comunica o pedido de que a ação punitiva de Deus não recaia sobre o povo na forma de uma praga, sem eliminar a relação sintática compacta e algo ambígua do hebraico.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio na invocação. A transliteração ‘Yahweh’ preserva essa função, em vez de substituí-lo por um título.
- issue: Alcance de ‘a casa de meu pai’
  choice: Manter a expressão sem restringi-la
  alternative: minha família; minha dinastia
  rationale: A expressão pode abranger a família ou linhagem de Davi. Mantê-la literalmente preserva essa amplitude e evita definir de modo indevido quem estaria incluído.
- issue: Inocência do povo na pergunta sobre as ovelhas
  choice: Preservar como pergunta retórica
  alternative: Declarar diretamente que o povo era inocente
  rationale: Davi contrasta sua própria culpa com a situação do povo, mas o hebraico formula isso como pergunta. A tradução não transforma a implicação em afirmação teológica explícita.
translation_notes:
  register: 'Português moderno, digno e de ampla compreensão, com formas pronominais em ‘tu’ coerentes com a invocação direta. A ordem das frases acompanha de perto o movimento retórico do hebraico: confissão pessoal, defesa metafórica do povo e súplica. O nome divino é transliterado como ‘Yahweh’.'
