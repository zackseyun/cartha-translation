  text: וַ/יִּשָּׂ֨א דָוִ֜יד אֶת עֵינָ֗י/ו וַ/יַּ֞רְא אֶת מַלְאַ֤ךְ יְהוָה֙ עֹמֵ֗ד בֵּ֤ין הָ/אָ֨רֶץ֙ וּ/בֵ֣ין הַ/שָּׁמַ֔יִם וְ/חַרְבּ֤/וֹ שְׁלוּפָה֙ בְּ/יָד֔/וֹ נְטוּיָ֖ה עַל יְרוּשָׁלִָ֑ם וַ/יִּפֹּ֨ל דָּוִ֧יד וְ/הַ/זְּקֵנִ֛ים מְכֻסִּ֥ים בַּ/שַּׂקִּ֖ים עַל פְּנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/016.yaml
  text: David lifted up his eyes and saw the angel of Yahweh standing between the earth and the heavens[a], with his sword drawn in his hand, stretched out over Jerusalem. Then David and the elders, covered in sackcloth, fell on their faces.
translation:
  language: pt
  text: Davi levantou os olhos e viu o anjo de Yahweh em pé entre a terra e os céus[a], com a espada desembainhada em sua mão e estendida sobre Jerusalém. Então Davi e os anciãos, cobertos de pano de saco, prostraram-se com o rosto em terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entre a terra e o céu”. O hebraico diz literalmente “entre a terra e os céus”.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וַיִּשָּׂא ... עֵינָיו
  choice: levantou os olhos
  rationale: Preserva a expressão concreta e solene do hebraico, sendo também natural em português.
- source_word: מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  rationale: Traduz diretamente a relação construtiva e conserva Yahweh como nome divino pessoal.
- source_word: עֹמֵד
  choice: em pé
  rationale: Expressa de modo natural a postura visível indicada pelo particípio hebraico.
- source_word: בֵּין הָאָרֶץ וּבֵין הַשָּׁמַיִם
  choice: entre a terra e os céus
  rationale: Mantém o contraste cósmico e representa o plural morfológico hebraico שָׁמַיִם.
- source_word: וְחַרְבּוֹ שְׁלוּפָה
  choice: com a espada desembainhada
  rationale: Comunica de modo idiomático o estado resultante da espada retirada da bainha.
- source_word: בְּיָדוֹ
  choice: na mão
  rationale: Tradução direta e corrente da locução preposicional.
- source_word: נְטוּיָה עַל יְרוּשָׁלִָם
  choice: estendida sobre Jerusalém
  rationale: Preserva a imagem ameaçadora da espada dirigida e mantida sobre a cidade.
- source_word: וַיִּפֹּל ... עַל פְּנֵיהֶם
  choice: prostraram-se com o rosto em terra
  rationale: Transmite tanto o movimento físico quanto a atitude de humilhação ou reverência da expressão hebraica.
- source_word: וְהַזְּקֵנִים
  choice: e os anciãos
  rationale: Equivalente direto e amplamente compreensível para os líderes mais velhos da comunidade.
- source_word: מְכֻסִּים בַּשַּׂקִּים
  choice: cobertos de pano de saco
  rationale: Segue de perto o particípio passivo e preserva a referência cultural ao tecido usado em luto e penitência.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto traz o Tetragrama como nome pessoal. A transliteração Yahweh preserva essa função sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe narrativa clara. Conserva imagens hebraicas inteligíveis e esclarece em nota a diferença entre o plural hebraico “céus” e a formulação portuguesa alternativa no singular.
