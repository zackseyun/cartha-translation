id: 1CH.21.30
reference: 1 Chronicles 21:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/לֹא יָכֹ֥ל דָּוִ֛יד לָ/לֶ֥כֶת לְ/פָנָ֖י/ו לִ/דְרֹ֣שׁ אֱלֹהִ֑ים כִּ֣י נִבְעַ֔ת מִ/פְּנֵ֕י חֶ֖רֶב מַלְאַ֥ךְ יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/030.yaml
  text: But David could not go before it to seek God[a], because he was terrified by the sword of the angel of Yahweh.
translation:
  language: pt
  text: Mas Davi não pôde ir até lá para buscar a Deus[a], porque estava aterrorizado com a espada do anjo de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ir diante dele para buscar a Deus”, se o pronome se refere a Deus, e não ao tabernáculo em Gibeom.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/לֹא
  choice: Mas ... não
  rationale: A conjunção com a negação dá continuidade à narrativa com leve contraste em relação ao versículo anterior; “Mas” expressa isso naturalmente.
- source_word: יָכֹל
  choice: pôde
  rationale: O verbo indica capacidade; com a negação, “não pôde” é uma formulação natural e direta.
- source_word: לָ/לֶכֶת
  choice: ir
  rationale: O infinitivo de הלך indica deslocamento até um lugar; “ir” é o equivalente idiomático no contexto.
- source_word: לְ/פָנָי/ו
  choice: até lá
  rationale: O sufixo masculino singular provavelmente retoma o tabernáculo ou lugar de culto em Gibeom mencionado no contexto imediato. “Até lá” comunica o deslocamento ao lugar sem atribuir explicitamente o pronome a Deus.
- source_word: לִ/דְרֹשׁ אֱלֹהִים
  choice: para buscar a Deus
  rationale: דרש com Deus pode abranger buscar sua presença e orientação por meio de culto ou oração; “buscar a Deus” preserva essa amplitude.
- source_word: כִּי
  choice: porque
  rationale: A conjunção introduz a causa de Davi não poder ir.
- source_word: נִבְעַת
  choice: estava aterrorizado
  rationale: O nifal transmite terror intenso, não mero susto; “estava aterrorizado” expressa adequadamente esse estado.
- source_word: מִ/פְּנֵי
  choice: com
  rationale: Com um verbo de temor, a preposição assinala aquilo que provoca o medo. Em português, “aterrorizado com” é natural neste contexto.
- source_word: חֶרֶב
  choice: espada
  rationale: Trata-se da arma literal, retomando a espada desembainhada do anjo na narrativa.
- source_word: מַלְאַךְ
  choice: anjo
  rationale: Embora מלאך também possa significar “mensageiro”, aqui o contexto apresenta claramente um ser celestial.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal do texto hebraico e segue a prática indicada pelo texto de consulta do projeto.
theological_decisions:
- issue: Referente do pronome em לְפָנָיו
  choice: Referência ao tabernáculo ou lugar de culto em Gibeom, vertida como “até lá”.
  alternative: 'Referência a Deus: “diante dele”.'
  rationale: O contexto imediato menciona o tabernáculo de Yahweh e o altar no alto de Gibeom; o versículo explica por que Davi não foi até esse local. Como o hebraico admite que o pronome se refira a Deus, a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Até lá” evita o pouco natural “diante dele” para um tabernáculo e mantém a referência provável ao lugar mencionado no contexto; a ambiguidade hebraica é registrada em nota.
