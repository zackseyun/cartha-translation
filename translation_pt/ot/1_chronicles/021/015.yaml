  text: וַ/יִּשְׁלַח֩ הָ/אֱלֹהִ֨ים מַלְאָ֥ךְ לִֽ/ירוּשָׁלִַם֮ לְ/הַשְׁחִיתָ/הּ֒ וּ/כְ/הַשְׁחִ֗ית רָאָ֤ה יְהוָה֙ וַ/יִּנָּ֣חֶם עַל הָֽ/רָעָ֔ה וַ/יֹּ֨אמֶר לַ/מַּלְאָ֤ךְ הַ/מַּשְׁחִית֙ רַ֔ב עַתָּ֖ה הֶ֣רֶף יָדֶ֑/ךָ וּ/מַלְאַ֤ךְ יְהוָה֙ עֹמֵ֔ד עִם גֹּ֖רֶן אָרְנָ֥ן הַ/יְבוּסִֽי׀׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/015.yaml
  text: And God sent an angel to Jerusalem to destroy it[a], but as he was destroying it, Yahweh saw and relented concerning the calamity, and he said to the destroying angel, “Enough[b]; now withdraw your hand.” And the angel of Yahweh was standing by the threshing floor of Ornan the Jebusite.
translation:
  language: pt
  text: 'Deus enviou um anjo a Jerusalém para destruí-la. Mas, enquanto ele a destruía, Yahweh viu e desistiu da calamidade; então disse ao anjo destruidor: “Basta! Agora retire a sua mão”. O anjo de Yahweh estava junto à eira de Ornã, o jebuseu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֱלֹהִים
  choice: Deus
  rationale: O artigo e o contexto verbal singular identificam o Deus de Israel; “Deus” é a forma natural em português.
- source_word: מַלְאָךְ
  choice: anjo
  rationale: Neste contexto de juízo, trata-se de um ser celestial enviado por Deus; “anjo” comunica melhor o referente do que o sentido mais amplo de “mensageiro”.
- source_word: לִירוּשָׁלִַם
  choice: a Jerusalém
  rationale: A preposição indica direção para a cidade; o propósito hostil é expresso pelo infinitivo seguinte.
- source_word: לְהַשְׁחִיתָהּ
  choice: para destruí-la
  rationale: O hifil de שׁחת indica ação destrutiva contra a cidade; a forma pronominal retoma Jerusalém com clareza.
- source_word: וּכְהַשְׁחִית
  choice: Mas, enquanto ele a destruía
  rationale: A construção indica ação em curso e simultânea à reação de Yahweh; “mas” torna natural a virada narrativa.
- source_word: וַיִּנָּחֶם עַל הָרָעָה
  choice: desistiu da calamidade
  rationale: נחם retrata Yahweh suspendendo o juízo no curso da narrativa, enquanto רעה denota aqui calamidade ou desastre, não maldade moral. “Desistiu” preserva a resposta divina sem acrescentar uma explicação filosófica.
- source_word: הַמַּלְאָךְ הַמַּשְׁחִית
  choice: o anjo destruidor
  rationale: A expressão portuguesa é concisa, natural e mantém a força ativa do particípio hebraico.
- source_word: רַב
  choice: Basta!
  rationale: A palavra funciona como uma exclamação breve que ordena o fim da ação.
- source_word: הֶרֶף יָדֶךָ
  choice: retire a sua mão
  rationale: O idioma hebraico ordena a interrupção da ação executada pela mão; esta formulação é clara e atual.
- source_word: גֹּרֶן אָרְנָן הַיְבוּסִי
  choice: a eira de Ornã, o jebuseu
  rationale: “Eira” é o equivalente preciso e ainda compreensível para o lugar de debulha; o aposto identifica Ornã.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- issue: Linguagem antropopática em וַיִּנָּחֶם עַל הָרָעָה
  choice: desistiu da calamidade
  alternative: lamentou o desastre; mudou de ideia quanto à calamidade
  rationale: A redação mantém a apresentação narrativa de Deus respondendo ao que vê, sem negar essa resposta nem transformá-la em uma formulação filosófica que o versículo não oferece.
- issue: Identidade de מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  alternative: o próprio Yahweh manifestado como anjo; um anjo criado
  rationale: A tradução conserva a expressão hebraica sem decidir a identidade ontológica da figura.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A pontuação explicita a progressão narrativa sem alterar seu conteúdo. “Eira” conserva o termo histórico concreto; “Ornã” e “jebuseu” seguem formas portuguesas estabelecidas.
