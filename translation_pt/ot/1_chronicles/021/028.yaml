  text: בָּ/עֵ֣ת הַ/הִ֔יא בִּ/רְא֤וֹת דָּוִיד֙ כִּי עָנָ֣/הוּ יְהוָ֔ה בְּ/גֹ֖רֶן אָרְנָ֣ן הַ/יְבוּסִ֑י וַ/יִּזְבַּ֖ח שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/028.yaml
  text: At that time[a], when David saw that Yahweh had answered him at the threshing floor of Ornan the Jebusite, he sacrificed there.
translation:
  language: pt
  text: Naquele tempo, quando Davi viu que Javé lhe havia respondido[a] na eira de Ornã, o jebuseu, sacrificou ali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o havia atendido». Neste contexto, o verbo hebraico pode indicar uma resposta de Deus a uma oração ou a um sacrifício.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Naquele tempo
  rationale: Expressão temporal corrente que preserva a ligação narrativa sem indicar uma imediatidade maior do que a do hebraico.
- source_word: בִּרְאוֹת דָּוִיד
  choice: quando Davi viu
  rationale: O infinitivo construto com בְּ indica uma circunstância temporal; a oração com «quando» é natural em português.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo do que Davi percebeu, sem transformar a relação em uma afirmação causal explícita.
- source_word: עָנָהוּ
  choice: lhe havia respondido
  rationale: O verbo ענה significa responder e, neste contexto, pode envolver atender a uma oração ou oferta. O mais-que-perfeito composto marca naturalmente que a resposta precedeu a percepção de Davi.
- source_word: יְהוָה
  choice: Javé
  rationale: Reproduz em forma portuguesa reconhecível o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּגֹרֶן
  choice: na eira
  rationale: גֹּרֶן designa a eira, lugar onde se debulhavam os cereais; a preposição portuguesa preserva o valor locativo.
- source_word: אָרְנָן הַיְבוּסִי
  choice: Ornã, o jebuseu
  rationale: Emprega as formas portuguesas usuais do nome próprio e do gentílico, mantendo a aposição hebraica.
- source_word: וַיִּזְבַּח שָׁם
  choice: sacrificou ali
  rationale: Traduz de modo conciso o verbo זבח e o advérbio locativo, sem acrescentar número ou objeto não expressos no texto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Javé
  alternative: SENHOR
  rationale: O texto hebraico apresenta o nome próprio divino; «Javé» o conserva de maneira clara e corrente em português, enquanto «SENHOR» o substituiria por um título.
- issue: Sentido de ענה na resposta divina
  choice: lhe havia respondido
  alternative: o havia atendido
  rationale: «Respondido» mantém o sentido lexical amplo e a linguagem relacional do hebraico; «atendido» explicita mais diretamente que Deus acolheu a oração ou o sacrifício, sentido possível pelo contexto, mas não obrigatório.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe narrativa natural. «Eira» conserva o termo histórico preciso; «Javé» e «Ornã» seguem formas portuguesas reconhecíveis.
