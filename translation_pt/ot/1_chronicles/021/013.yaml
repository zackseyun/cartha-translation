source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר דָּוִ֛יד אֶל גָּ֖ד צַר לִ֣/י מְאֹ֑ד אֶפְּלָה נָּ֣א בְ/יַד יְהוָ֗ה כִּֽי רַבִּ֤ים רַחֲמָי/ו֙ מְאֹ֔ד וּ/בְ/יַד אָדָ֖ם אַל אֶפֹּֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/013.yaml
  text: Then David said to Gad[a], “I am in great distress. Please let me fall into the hand of Yahweh, for his mercies are very great; but do not let me fall into the hand of man.”
translation:
  language: pt
  text: 'Então Davi disse a Gade: “Estou em grande angústia. Por favor, que eu caia na mão de Yahweh, pois são muitíssimas as suas misericórdias; mas que eu não caia na mão do homem[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em mãos humanas”. O hebraico traz o singular “na mão do homem”, em contraste com “a mão de Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַר לִי מְאֹד
  choice: Estou em grande angústia
  rationale: A expressão idiomática comunica aflição intensa e circunstâncias opressivas. A formulação é natural em português atual e mantém a força emocional do hebraico.
- source_word: אֶפְּלָה נָּא
  choice: Por favor, que eu caia
  rationale: O coortativo acompanhado de נָא expressa um pedido urgente. A construção preserva tanto o caráter volitivo quanto o tom de súplica.
- source_word: בְיַד יְהוָה
  choice: na mão de Yahweh
  rationale: A expressão indica ficar entregue ao poder ou ao juízo de alguém. A manutenção de “mão” conserva a imagem hebraica e o paralelismo com “a mão do homem”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino expresso diretamente pelo Tetragrama no texto hebraico.
- source_word: כִּי רַבִּים רַחֲמָיו מְאֹד
  choice: pois são muitíssimas as suas misericórdias
  rationale: רַחֲמִים está no plural e denota as manifestações abundantes da compaixão divina. “Muitíssimas” comunica conjuntamente רַבִּים e מְאֹד sem reduzir o plural a uma abstração singular.
- source_word: וּבְיַד אָדָם
  choice: mas que eu não caia na mão do homem
  rationale: A tradução mantém o singular hebraico e o contraste literário entre a mão de Yahweh e o poder humano, enquanto a nota registra uma alternativa mais idiomática.
- source_word: אָדָם
  choice: homem
  rationale: Neste contexto, o termo designa genericamente um agente humano em contraste com Yahweh. O singular representativo é preservado no texto.
- source_word: אַל אֶפֹּל
  choice: que eu não caia
  rationale: A partícula negativa com o verbo na primeira pessoa expressa o desejo ou a súplica de Davi para que esse resultado não ocorra, em paralelo com o pedido anterior.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O versículo emprega diretamente o Tetragrama. “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Sentido de אָדָם no contraste com Yahweh
  choice: homem
  alternative: ser humano; mãos humanas
  rationale: O hebraico usa o singular de modo representativo para contrastar o juízo divino com o poder humano. A tradução conserva essa tensão sem transformar o termo em uma coletividade abstrata.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível. Conservam-se a imagem da “mão”, o paralelismo hebraico e o plural “misericórdias”; a alternativa idiomática é oferecida em nota.
