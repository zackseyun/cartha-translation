  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִיד֙ אֶל הָ֣/אֱלֹהִ֔ים חָטָ֣אתִֽי מְאֹ֔ד אֲשֶׁ֥ר עָשִׂ֖יתִי אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה וְ/עַתָּ֗ה הַֽעֲבֶר נָא֙ אֶת עֲו֣וֹן עַבְדְּ/ךָ֔ כִּ֥י נִסְכַּ֖לְתִּי מְאֹֽד־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/008.yaml
  text: Then David said to God[a], “I have sinned greatly in doing this thing. But now, please take away the guilt of your servant, for I have acted very foolishly.”
translation:
  language: pt
  text: 'Então Davi disse a Deus: “Pequei gravemente ao fazer isso. Mas agora, por favor, remove a culpa[a] do teu servo, pois agi com muita insensatez.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a iniquidade do teu servo”. A palavra hebraica pode significar iniquidade, culpa ou a responsabilidade decorrente da culpa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa com naturalidade a sequência dos acontecimentos.
- source_word: אֶל הָאֱלֹהִים
  choice: a Deus
  rationale: Neste contexto, אֱלֹהִים se refere ao Deus de Israel; em português, a forma idiomática é “Deus”, sem artigo.
- source_word: חָטָאתִי מְאֹד
  choice: Pequei gravemente
  rationale: Mantém a confissão direta e a força intensificadora de מְאֹד em português natural e solene.
- source_word: אֲשֶׁר עָשִׂיתִי אֶת הַדָּבָר הַזֶּה
  choice: ao fazer isso
  rationale: Expressa de modo conciso a relação entre o pecado confessado e o ato específico praticado, sem a rigidez de “esta coisa”.
- source_word: וְעַתָּה
  choice: Mas agora
  rationale: Marca a passagem retórica da confissão para a súplica.
- source_word: הַעֲבֶר נָא
  choice: por favor, remove
  rationale: O imperativo hifil de עבר, acompanhado de נָא, comunica uma súplica para retirar ou afastar algo; “por favor, remove” preserva tanto o sentido quanto o tom.
- source_word: עֲוֹן
  choice: culpa
  rationale: O termo pode designar iniquidade, culpa ou a responsabilidade decorrente dela. “Culpa” se ajusta àquilo que Davi pede que Deus remova, sem restringir o sentido apenas ao ato ou apenas à punição.
- source_word: עַבְדְּךָ
  choice: teu servo
  rationale: É uma autodesignação reverente diante de Deus; “servo” comunica melhor essa relação contextual do que “escravo”.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente, em português, a razão apresentada para a súplica.
- source_word: נִסְכַּלְתִּי מְאֹד
  choice: agi com muita insensatez
  rationale: Preserva o caráter verbal da expressão — Davi reconhece ter agido de modo insensato — e também a intensidade de מְאֹד.
theological_decisions:
- issue: Sentido de עָוֹן na súplica de Davi
  choice: culpa
  alternative: iniquidade; responsabilidade ou consequência decorrente da culpa
  rationale: O contexto reúne confissão e pedido de perdão. “Culpa” comunica bem o peso moral que Davi pede que Deus remova, enquanto a nota preserva a amplitude semântica do hebraico e evita decidir que o termo indica exclusivamente o ato pecaminoso ou sua punição.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Teu servo” preserva o tom reverente da fala dirigida a Deus; “ao fazer isso” evita literalismo pouco natural, e “agi com muita insensatez” mantém a força verbal da confissão.
