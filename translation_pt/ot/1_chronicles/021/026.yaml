source:
  edition: WLC
  text: וַ/יִּבֶן֩ שָׁ֨ם דָּוִ֤יד מִזְבֵּ֨חַ֙ לַ/יהוָ֔ה וַ/יַּ֥עַל עֹל֖וֹת וּ/שְׁלָמִ֑ים וַ/יִּקְרָא֙ אֶל יְהוָ֔ה וַ/יַּֽעֲנֵ֤/הוּ בָ/אֵשׁ֙ מִן הַ/שָּׁמַ֔יִם עַ֖ל מִזְבַּ֥ח הָ/עֹלָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/026.yaml
  text: There David built an altar to Yahweh and offered up burnt offerings and peace offerings. He called on Yahweh[a], and he answered him with fire from heaven on the altar of burnt offering.
translation:
  language: pt
  text: Ali Davi construiu um altar a Yahweh e ofereceu holocaustos e ofertas pacíficas.[a] Invocou Yahweh, e ele lhe respondeu com fogo vindo do céu sobre o altar do holocausto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ofertas de comunhão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן שָׁם
  choice: Ali Davi construiu
  rationale: “Ali” retoma de modo natural o local mencionado no contexto, e “construiu” expressa claramente a ação concreta de edificar.
- source_word: מִזְבֵּחַ לַיהוָה
  choice: um altar a Yahweh
  rationale: “Altar” é o termo cultual corrente; a preposição indica dedicação ou destinação, e o nome divino é transliterado como “Yahweh”.
- source_word: וַיַּעַל עֹלוֹת
  choice: ofereceu holocaustos
  rationale: No contexto sacrificial, o verbo indica apresentar ofertas, enquanto “holocaustos” é a designação portuguesa tradicional e precisa para sacrifícios inteiramente queimados.
- source_word: וּשְׁלָמִים
  choice: e ofertas pacíficas
  rationale: A expressão conserva a ligação lexical do termo hebraico com paz e é reconhecível em português; a alternativa “ofertas de comunhão” é registrada em nota.
- source_word: וַיִּקְרָא אֶל יְהוָה
  choice: Invocou Yahweh
  rationale: No contexto de oração, a construção significa dirigir-se a Deus em súplica; “invocou” é conciso, natural e digno.
- source_word: וַיַּעֲנֵהוּ בָאֵשׁ
  choice: ele lhe respondeu com fogo
  rationale: Mantém o sujeito pronominal implícito do hebraico e representa o fogo como o meio ou manifestação da resposta divina.
- source_word: מִן הַשָּׁמַיִם
  choice: vindo do céu
  rationale: Embora o substantivo hebraico tenha forma plural, “do céu” é o equivalente idiomático em português; “vindo” deixa clara a procedência do fogo.
- source_word: עַל מִזְבַּח הָעֹלָה
  choice: sobre o altar do holocausto
  rationale: Reproduz a localização do fogo e identifica o altar associado ao holocausto sem acrescentar explicação ao texto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome próprio da aliança presente no texto hebraico, sem substituí-lo por um título.
- issue: Natureza da resposta divina pelo fogo
  choice: “ele lhe respondeu com fogo vindo do céu”
  alternative: Explicitar que Yahweh enviou ou fez descer o fogo
  rationale: A formulação conserva a afirmação narrativa e o valor instrumental do hebraico, sem acrescentar um verbo de envio ou uma interpretação simbólica não expressa.
- issue: Referente do sujeito em וַיַּעֲנֵהוּ
  choice: “ele”, retomando Yahweh
  alternative: “Yahweh lhe respondeu”
  rationale: O referente é claro no contexto, e o pronome preserva a progressão e a concisão do hebraico.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. Emprega “holocausto” em seu sentido sacrificial bíblico e evita construções excessivamente arcaicas.
