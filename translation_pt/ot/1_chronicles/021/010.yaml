  source_fidelity: 'O texto preserva todos os elementos centrais do hebraico: a ordem ao mensageiro, o destinatário Davi, a fórmula profética, o nome Yahweh, as três realidades deixadas semanticamente abertas, a ordem de escolher uma delas e a aplicação da escolha a Davi. “Três coisas” é um suprimento mínimo e apropriado para o objeto elíptico de שָׁלוֹשׁ.'
  naturalness: O português é moderno, claro e de registro bíblico sóbrio. “Vá e fale a Davi” é uma construção aceitável no registro formal; a pontuação introduz a fala diretamente de modo natural. “Eu a farei recair sobre você” comunica bem, no contexto imediato de juízo, a força adversativa de וְאֶעֱשֶׂה לָּךְ.
  terminology: “Yahweh” representa coerentemente o Tetragrama. “Assim diz Yahweh” conserva a fórmula de mensageiro, e “três coisas” evita antecipar ou especificar indevidamente os juízos/alternativas que o hebraico ainda não nomeia.
