  text: לֵךְ֩ וְ/דִבַּרְתָּ֨ אֶל דָּוִ֜יד לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה שָׁל֕וֹשׁ אֲנִ֖י נֹטֶ֣ה עָלֶ֑י/ךָ בְּחַר לְ/ךָ֛ אַחַ֥ת מֵ/הֵ֖נָּה וְ/אֶֽעֱשֶׂה לָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/010.yaml
  text: 'Go and speak to David[a], saying, ‘Thus says Yahweh: I am setting three things before you. Choose one of them for yourself, and I will do it to you.’'
translation:
  language: pt
  text: 'Vá e fale a Davi: “Assim diz Yahweh: Estou colocando três coisas diante de você.[a] Escolha para si uma delas, e eu a farei recair sobre você.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Três eu estou estendendo sobre você”. O hebraico não declara o que são as três; pelo contexto, trata-se de três alternativas apresentadas a Davi.'
    reason: A nota registra a imagem lexical de נֹטֶה e a ausência de um substantivo expresso, ambas suavizadas no texto principal para produzir português compreensível.
lexical_decisions:
- source_word: לֵךְ וְדִבַּרְתָּ אֶל דָּוִיד
  choice: Vá e fale a Davi
  rationale: Mantém os dois verbos e traduz naturalmente a ordem dirigida ao mensageiro; דבר com אֶל significa normalmente “falar a” alguém.
- source_word: לֵאמֹר
  choice: introdução direta da citação, sem “dizendo”
  rationale: Em português atual, os dois-pontos introduzem a fala de modo mais natural e cumprem a função do infinitivo quotativo hebraico.
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Preserva a fórmula profética de mensageiro e representa diretamente o nome divino.
- source_word: שָׁלוֹשׁ אֲנִי נֹטֶה עָלֶיךָ
  choice: Estou colocando três coisas diante de você
  rationale: O hebraico não declara o substantivo contado. “Coisas” é um complemento mínimo que evita antecipar “castigos”, “pragas” ou “opções”; “colocando ... diante de você” comunica a apresentação das três alternativas no contexto.
- source_word: בְּחַר לְךָ אַחַת מֵהֵנָּה
  choice: Escolha para si uma delas
  rationale: Reproduz a ordem, o valor pessoal de לְךָ e a construção partitiva “uma delas”.
- source_word: וְאֶעֱשֶׂה לָּךְ
  choice: e eu a farei recair sobre você
  rationale: No contexto punitivo, expressa que a alternativa escolhida será aplicada a Davi. Evita o ambíguo e pouco natural “farei isso com você”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino; “Yahweh” o preserva sem substituí-lo por um título.
- issue: Objeto não expresso após “três”
  choice: três coisas
  alternative: três castigos; três pragas; três opções
  rationale: O hebraico deixa o substantivo implícito. A formulação escolhida preserva essa indeterminação até que as alternativas sejam apresentadas no versículo seguinte.
- issue: Sentido de וְאֶעֱשֶׂה לָּךְ no contexto de juízo
  choice: eu a farei recair sobre você
  alternative: eu farei isso a você; eu a farei por você
  rationale: O contexto exige efeito adverso sobre Davi, mas a tradução não especifica além do texto qual será o castigo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe profética “Assim diz Yahweh” foi mantida por seu caráter formular; formas arcaicas como “escolhe”, “ti” e “ta farei” foram evitadas.
