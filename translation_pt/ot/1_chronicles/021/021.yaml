base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/021.yaml
  text: When David came to Ornan[a], Ornan looked and saw David, and he went out from the threshing floor and bowed down before David with his face to the ground.
translation:
  language: pt
  text: Quando Davi chegou até Ornã, Ornã olhou e viu Davi. Então saiu da eira e se prostrou diante de Davi, com o rosto em terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “inclinou-se profundamente diante de Davi”. O hebraico descreve uma prostração completa, com o rosto voltado para o chão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא דָוִיד עַד אָרְנָן
  choice: Quando Davi chegou até Ornã
  rationale: בוא pode indicar vir, ir ou chegar conforme a perspectiva; “chegou até” expressa naturalmente o movimento de Davi em direção a Ornã, enquanto עַד marca o ponto alcançado.
- source_word: וַיַּבֵּט אָרְנָן וַיַּרְא אֶת דָּוִיד
  choice: Ornã olhou e viu Davi
  rationale: Mantém a sequência de dois verbos do hebraico — dirigir o olhar e ver — sem acrescentar que Ornã tenha olhado para cima.
- source_word: וַיֵּצֵא מִן הַגֹּרֶן
  choice: Então saiu da eira
  rationale: יצא com מִן indica sair de um lugar; “eira” é o termo português tradicional e preciso para o espaço onde se debulhavam cereais.
- source_word: וַיִּשְׁתַּחוּ לְדָוִיד
  choice: se prostrou diante de Davi
  rationale: A forma verbal descreve curvar-se ou prostrar-se perante alguém. “Se prostrou” comunica claramente o gesto físico sem caracterizá-lo como adoração.
- source_word: אַפַּיִם אָרְצָה
  choice: com o rosto em terra
  rationale: A expressão idiomática, literalmente relacionada ao rosto voltado para o chão, descreve uma prostração completa; esta formulação é natural, concisa e digna em português.
theological_decisions:
- issue: Se o gesto de Ornã deve ser traduzido como adoração a Davi
  choice: se prostrou diante de Davi
  alternative: adorou Davi; inclinou-se diante de Davi
  rationale: השתחוה pode designar tanto adoração quanto reverência diante de uma autoridade humana, conforme o contexto. Aqui, o complemento humano e a descrição do rosto em terra favorecem a representação concreta do gesto, sem impor a noção de culto divino.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Eira” conserva a precisão histórica; “se prostrou” evita tanto enfraquecer o gesto quanto interpretá-lo como adoração. O marcador da nota foi colocado após a descrição completa do gesto a que ela se refere.
