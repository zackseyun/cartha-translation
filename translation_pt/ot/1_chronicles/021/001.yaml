base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/001.yaml
  text: Then Satan stood up against Israel and incited David to count Israel[a][b].
translation:
  language: pt
  text: Então Satanás[a] se levantou contra Israel e incitou Davi a contar Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «um adversário». A palavra hebraica satan pode significar «adversário» ou funcionar como nome ou título pessoal: «Satanás».'
    reason: lexical_alternative
  - marker: b
    text: Em 2 Samuel 24:1, a incitação é atribuída à ira do SENHOR contra Israel. Crônicas apresenta Satanás como o agente imediato, mantendo uma tensão teológica entre os relatos sem apagar nenhum deles.
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: se levantou
  rationale: Preserva a imagem concreta de עמד e, no contexto, comunica iniciativa hostil em português natural.
- source_word: שָׂטָן
  choice: Satanás
  rationale: Embora o substantivo sem artigo também possa significar «um adversário», o contexto favorece seu uso como designação pessoal; a alternativa lexical genuína é mantida em nota.
- source_word: עַל יִשְׂרָאֵל
  choice: contra Israel
  rationale: A preposição עַל, nesta construção de sentido hostil, é expressa naturalmente por «contra».
- source_word: וַיָּסֶת
  choice: incitou
  rationale: O hifil de סות indica induzir ou instigar alguém a agir; «incitou» transmite esse impulso causativo sem sugerir compulsão irresistível.
- source_word: לִמְנוֹת
  choice: a contar
  rationale: Traduz diretamente מנה, evitando a expansão interpretativa «fazer um recenseamento».
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém a formulação concisa do hebraico, na qual Israel representa naturalmente o povo.
theological_decisions:
- issue: Identidade e sentido de שָׂטָן
  choice: Satanás como figura adversária pessoal
  alternative: um adversário
  rationale: O termo hebraico admite o sentido comum de «adversário», mas neste contexto é plausível entendê-lo como designação pessoal. A nota preserva a ambiguidade lexical sem diluir o texto principal.
- issue: Relação com 2 Samuel 24:1
  choice: Manter Satanás como agente imediato na apresentação de Crônicas
  alternative: Harmonizar explicitamente o versículo com a atribuição à ira do SENHOR em 2 Samuel 24:1
  rationale: Os relatos fazem atribuições distintas e não devem ser silenciosamente fundidos. A nota registra a tensão teológica e canônica sem impor uma solução.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem é natural em português, e os termos «se levantou», «incitou» e «contar» conservam a concisão e a força do hebraico.
