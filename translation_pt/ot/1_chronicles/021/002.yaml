base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/002.yaml
  text: Then David said to Joab and to the commanders of the people[a], “Go, count Israel from Beersheba to Dan, and bring it to me, so that I may know their number.”
translation:
  language: pt
  text: 'Então Davi disse a Joabe e aos chefes do povo: “Vão, contem Israel desde Berseba até Dã[a] e tragam-me o resultado, para que eu saiba o número deles.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica “desde Berseba até Dã” significa de uma extremidade de Israel à outra.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então Davi disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: שָׂרֵי הָעָם
  choice: os chefes do povo
  rationale: שָׂרִים pode designar chefes, autoridades ou comandantes. “Chefes” preserva a amplitude do termo e é natural neste contexto administrativo-militar.
- source_word: לְכוּ סִפְרוּ
  choice: Vão, contem
  rationale: Reproduz de modo direto os dois imperativos plurais, mantendo a concisão do hebraico.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém o objeto coletivo sem explicitar desnecessariamente “o povo de Israel”.
- source_word: מִבְּאֵר שֶׁבַע וְעַד דָּן
  choice: desde Berseba até Dã
  rationale: Preserva os limites geográficos mencionados e a expressão meridional-setentrional; a nota esclarece seu valor idiomático.
- source_word: וְהָבִיאוּ אֵלַי
  choice: e tragam-me o resultado
  rationale: O hebraico omite o objeto expresso; “o resultado” torna clara, sem restringir indevidamente, a referência ao levantamento solicitado.
- source_word: וְאֵדְעָה אֶת מִסְפָּרָם
  choice: para que eu saiba quantos são
  rationale: Expressa a finalidade ou o resultado desejado do coortativo e traduz de forma idiomática “saiba o número deles”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O plural “Vão, contem” concorda com Joabe e os chefes. A nota foi colocada junto à expressão geográfica que esclarece.
