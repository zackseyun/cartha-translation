base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/023.yaml
  text: And Ornan said to David, “Take it for yourself, and let my lord the king do what is good in his eyes. See, I have given the cattle for burnt offerings, the threshing sledges for wood, and the wheat for the grain offering. I have given it all.”
translation:
  language: pt
  text: 'E Ornã disse a Davi: “Tome para você, e que o rei, meu senhor, faça o que lhe parecer bom.[a] Veja: dei o gado para os holocaustos,[b] os trenós de debulhar para servirem de lenha[c] e o trigo para a oferta de cereal.[d] Dei tudo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o que for bom aos seus olhos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “os bois para os holocaustos”. O termo hebraico pode designar o gado bovino coletivamente ou, mais especificamente, os bois.
    reason: lexical_alternative
  - marker: c
    text: Isto é, os instrumentos de debulha seriam usados como combustível para o sacrifício.
    reason: cultural_note
  - marker: d
    text: Ou “oferta”. Em contextos sacrificiais, o termo hebraico costuma indicar uma oferta feita de cereal.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח לָךְ
  choice: Tome-o para você
  rationale: Preserva tanto o imperativo quanto a nuance de apropriação pessoal expressa por לָךְ; o pronome retoma naturalmente o local mencionado no contexto.
- source_word: וְיַעַשׂ אֲדֹנִי הַמֶּלֶךְ הַטּוֹב בְּעֵינָיו
  choice: e faça o rei, meu senhor, o que lhe parecer bom
  rationale: Reproduz a permissão respeitosa e comunica em português natural o idioma hebraico que diz literalmente 'o que é bom aos seus olhos'.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: o rei, meu senhor
  rationale: Trata-se de uma forma cortês de dirigir-se a Davi, não de um título divino; a ordem escolhida soa natural em português.
- source_word: רְאֵה
  choice: Veja
  rationale: Mantém a função enfática e discursiva do imperativo sem recorrer a uma formulação arcaica.
- source_word: הַבָּקָר לָעֹלוֹת
  choice: os bois para os holocaustos
  rationale: בקר pode designar coletivamente o gado bovino; neste contexto sacrificial, 'bois' é concreto e corrente. עֹלוֹת é vertido pelo termo sacrificial estabelecido 'holocaustos'.
- source_word: הַמּוֹרִגִּים לָעֵצִים
  choice: os trenós de debulhar como lenha
  rationale: מורגים designa implementos ou trenós de debulha, e לָעֵצִים indica que seriam usados como combustível.
- source_word: הַחִטִּים לַמִּנְחָה
  choice: o trigo para a oferta de cereal
  rationale: Mantém literalmente o trigo e traduz מנחה, neste contexto cultual, pela expressão específica e compreensível 'oferta de cereal'.
- source_word: הַכֹּל נָתָתִּי
  choice: Dou tudo
  rationale: O perfeito hebraico apresenta a entrega como decidida e completa; no ato de oferta, o presente português expressa naturalmente a doação imediata sem enfraquecer sua totalidade.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva a cortesia régia, o vocabulário sacrificial e a concretude dos objetos oferecidos, enquanto a nota registra o idioma hebraico.
