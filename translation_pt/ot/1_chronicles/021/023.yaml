revisions:
- from: 'E Ornã disse a Davi: “Tome-o para você, e faça o rei, meu senhor, o que lhe parecer bom.[a] Veja: dou os bois para os holocaustos,[b] os trenós de debulhar como lenha[c] e o trigo para a oferta de cereal.[d] Dou tudo.”'
  to: 'E Ornã disse a Davi: “Tome para você, e que o rei, meu senhor, faça o que lhe parecer bom.[a] Veja: dei o gado para os holocaustos,[b] os trenós de debulhar para servirem de lenha[c] e o trigo para a oferta de cereal.[d] Dei tudo.”'
  rationale: A revisão remove um pronome de gênero inadequadamente especificado, representa de modo mais próximo os dois perfeitos hebraicos e conserva o valor coletivo de בקר. Também ajusta levemente a sintaxe da deferência régia e explicita a finalidade dos trenós como combustível, em conformidade com o contexto e com a nota cultural.
