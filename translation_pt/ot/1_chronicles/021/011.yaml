  text: וַ/יָּ֥בֹא גָ֖ד אֶל דָּוִ֑יד וַ/יֹּ֥אמֶר ל֛/וֹ כֹּֽה אָמַ֥ר יְהוָ֖ה קַבֶּל לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/011.yaml
  text: So Gad came to David and said to him[a], “Thus says Yahweh, ‘Choose for yourself—’”
translation:
  language: pt
  text: 'Então Gade foi até Davi e lhe disse: “Assim diz Yahweh: ‘Escolha para si[a] —’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “Aceite para si”; no contexto, trata-se de escolher entre as opções apresentadas no versículo seguinte.
    reason: alternativa lexical
lexical_decisions:
- source_word: וַיָּבֹא
  choice: foi até
  rationale: O verbo בוא descreve o movimento de Gade em direção a Davi. Em português, “foi até” expressa naturalmente esse deslocamento sem depender do ponto de vista dêitico de “veio”.
- source_word: גָד
  choice: Gade
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: אֶל דָּוִיד
  choice: até Davi
  rationale: A preposição אֶל marca movimento em direção a uma pessoa; “até Davi” é natural no contexto narrativo.
- source_word: וַיֹּאמֶר לוֹ
  choice: e lhe disse
  rationale: Reproduz de modo conciso e natural o verbo אמר com objeto indireto pronominal.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Mantém a fórmula profética solene e convencional, com presente português adequado à introdução de uma mensagem divina citada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: קַבֶּל
  choice: Escolha
  rationale: Embora o sentido lexical básico seja “aceite” ou “receba”, o contexto imediato apresenta opções entre as quais Davi deve escolher; a alternativa mais literal é preservada em nota.
- source_word: לָךְ
  choice: para você
  rationale: Representa o dativo pronominal e indica que a decisão cabe pessoalmente a Davi.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo pelo título “SENHOR”.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A fórmula profética “Assim diz Yahweh” conserva a solenidade do hebraico. O travessão final mantém a frase em aberto, pois as opções aparecem no versículo seguinte.
