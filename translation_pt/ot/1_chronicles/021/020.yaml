base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/020.yaml
  text: Ornan turned and saw the angel[a], and his four sons with him were hiding themselves, while Ornan was threshing wheat.
translation:
  language: pt
  text: Ornã voltou-se e viu o anjo, e seus quatro filhos, que estavam com ele, estavam se escondendo[a], enquanto Ornã debulhava trigo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: escondiam-se. O particípio reflexivo hebraico apresenta a ação como em andamento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: voltou-se
  rationale: O verbo שׁוב pode indicar voltar ou virar-se. No contexto, descreve Ornã mudando de direção para então ver o anjo; “voltou-se” preserva essa ideia sem acrescentar um marcador temporal ausente no hebraico.
- source_word: וַיַּרְא אֶת הַמַּלְאָךְ
  choice: viu o anjo
  rationale: Embora מַלְאָךְ também possa significar “mensageiro”, o contexto da narrativa de juízo divino identifica uma figura sobrenatural, tornando “anjo” a tradução adequada.
- source_word: וְאַרְבַּעַת בָּנָיו עִמּוֹ
  choice: e seus quatro filhos, que estavam com ele
  rationale: A formulação explicita em português que עִמּוֹ se refere aos filhos, evitando uma ligação momentaneamente ambígua, sem alterar o conteúdo.
- source_word: מִתְחַבְּאִים
  choice: esconderam-se
  rationale: A forma Hitpael tem sentido reflexivo ou médio. “Esconderam-se” preserva essa nuance de modo natural e conciso; a forma participial também permite uma leitura progressiva, registrada em nota.
- source_word: וְאָרְנָן דָּשׁ חִטִּים
  choice: enquanto Ornã debulhava trigo
  rationale: A oração descreve a ação de fundo em curso. “Enquanto” comunica com clareza essa relação circunstancial, e חִטִּים designa especificamente trigo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Emprega-se “Ornã”, forma portuguesa tradicional do nome, e “debulhava” como termo corrente para a separação dos grãos.
