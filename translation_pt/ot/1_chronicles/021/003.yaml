  text: וַ/יֹּ֣אמֶר יוֹאָ֗ב יוֹסֵף֩ יְהוָ֨ה עַל עַמּ֤/וֹ כָּ/הֵם֙ מֵאָ֣ה פְעָמִ֔ים הֲ/לֹא֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כֻּלָּ֥/ם לַ/אדֹנִ֖/י לַ/עֲבָדִ֑ים לָ֣/מָּה יְבַקֵּ֥שׁ זֹאת֙ אֲדֹנִ֔/י לָ֛/מָּה יִהְיֶ֥ה לְ/אַשְׁמָ֖ה לְ/יִשְׂרָאֵֽל־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/003.yaml
  text: But Joab said[a], “May Yahweh add to his people a hundred times as many as they are! Are they not all, my lord the king[c][b], servants of my lord? Why does my lord seek this? Why should it become guilt for Israel?”
translation:
  language: pt
  text: 'Mas Joabe disse: “Que Yahweh multiplique por cem o número do seu povo![a] Ó rei, meu senhor, não são todos eles servos do meu senhor?[b] Por que meu senhor busca isso? Por que isso haveria de trazer culpa sobre Israel?[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que Yahweh acrescente ao seu povo cem vezes o número que ele tem agora!”'
    reason: Alternativa mais literal para o verbo hebraico “acrescentar” e para a comparação numérica.
  - marker: b
    text: 'Ou: “Não são todos eles escravos do meu senhor?”'
    reason: O termo hebraico pode significar tanto servos quanto escravos, conforme o contexto.
  - marker: c
    text: Isto é, culpa ou responsabilidade que recairia sobre Israel por causa dessa ação.
    reason: Esclarece o sentido contextual de “culpa”, sem o confundir com uma oferta sacrificial.
lexical_decisions:
- source_word: יוֹסֵף
  choice: Que ... multiplique
  rationale: O jussivo expressa um desejo ou oração de Joabe. A construção com “Que” comunica naturalmente essa força volitiva em português; “multiplique” se ajusta ao complemento idiomático que indica aumento numérico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, preservando-o como nome próprio em vez de substituí-lo por um título.
- source_word: עַל עַמּוֹ כָּהֵם מֵאָה פְעָמִים
  choice: por cem o número do seu povo
  rationale: A expressão hebraica descreve o povo tornando-se cem vezes tão numeroso quanto no presente. Esta formulação transmite o valor comparativo de modo claro e natural.
- source_word: הֲלֹא
  choice: não são ...?
  rationale: Mantém a pergunta retórica negativa, que espera concordância do interlocutor.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Ó rei, meu senhor
  rationale: Reproduz o tratamento respeitoso dirigido ao rei, com uma ordem de palavras natural em português.
- source_word: כֻּלָּם לַאדֹנִי לַעֲבָדִים
  choice: não são todos eles servos do meu senhor?
  rationale: “Servos” comunica aqui a sujeição política ao rei sem impor ao contexto a ideia mais específica de escravidão.
- source_word: יְבַקֵּשׁ זֹאת
  choice: busca isso
  rationale: Conserva o sentido amplo de buscar, procurar ou pretender algo, sem especificar além do hebraico a forma pela qual o censo seria realizado.
- source_word: יִהְיֶה לְאַשְׁמָה לְיִשְׂרָאֵל
  choice: haveria de trazer culpa sobre Israel
  rationale: Expressa com naturalidade a culpa ou responsabilidade resultante que recairia sobre Israel, sem interpretar o substantivo como uma oferta sacrificial.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
- issue: Sentido de עֲבָדִים na relação entre o povo e o rei
  choice: servos
  alternative: escravos
  rationale: Embora o termo possa designar escravos, neste contexto a ênfase recai na subordinação e disponibilidade política do povo perante o rei. “Servos” mantém essa amplitude contextual.
- issue: Natureza de אַשְׁמָה
  choice: culpa ou responsabilidade que recai sobre Israel
  alternative: oferta pela culpa
  rationale: O contexto trata da consequência culpável do recenseamento, não de um sacrifício. A tradução preserva tanto a culpabilidade quanto a ideia de responsabilidade decorrente.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento “Ó rei, meu senhor” conserva a deferência cortesã sem recorrer a fórmulas excessivamente arcaicas. A tradução mantém a pergunta retórica, o nome divino e a tensão entre culpa moral e responsabilidade coletiva.
