id: 1CH.21.12
reference: 1 Chronicles 21:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אִם שָׁל֨וֹשׁ שָׁנִ֜ים רָעָ֗ב וְ/אִם שְׁלֹשָׁ֨ה חֳדָשִׁ֜ים נִסְפֶּ֥ה מִ/פְּנֵי צָרֶי/ךָ֮ וְ/חֶ֣רֶב אוֹיְבֶ֣/ךָ לְ/מַשֶּׂגֶת֒ וְ/אִם שְׁלֹ֣שֶׁת יָ֠מִים חֶ֣רֶב יְהוָ֤ה וְ/דֶ֨בֶר֙ בָּ/אָ֔רֶץ וּ/מַלְאַ֣ךְ יְהוָ֔ה מַשְׁחִ֖ית בְּ/כָל גְּב֣וּל יִשְׂרָאֵ֑ל וְ/עַתָּ֣ה רְאֵ֔ה מָֽה אָשִׁ֥יב אֶת שֹׁלְחִ֖/י דָּבָֽר־־־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/012.yaml
  text: either three years of famine[a], or three months of being swept away before your foes while the sword of your enemies overtakes you, or three days of the sword of Yahweh, even pestilence in the land, with the angel of Yahweh destroying throughout all the territory of Israel[b]. Now consider what answer I should return to the one who sent me.
translation:
  language: pt
  text: ou três anos de fome; ou três meses sendo varrido[a] diante dos seus adversários, enquanto a espada dos seus inimigos o alcança; ou três dias da espada de Yahweh, isto é, peste[b] na terra, com o anjo de Yahweh destruindo por todo o território de Israel. Agora, considere que resposta devo dar àquele que me enviou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «sendo consumido» ou «perecendo diante dos seus inimigos». O particípio hebraico pode indicar ser levado à ruína numa derrota militar.
    reason: alternativa lexical
  - marker: b
    text: Ou «praga». O termo hebraico designa uma doença epidêmica em contexto de juízo.
    reason: alternativa lexical
lexical_decisions:
- source_word: רָעָב
  choice: fome
  rationale: Em contexto de juízo nacional, indica escassez generalizada de alimentos; «fome» é a forma bíblica e corrente em português.
- source_word: נִסְפֶּה
  choice: sendo arrasado
  rationale: O particípio nifal expressa ser levado à ruína ou eliminado; «arrasado» preserva a força militar sem restringir o sentido apenas à morte.
- source_word: מִפְּנֵי צָרֶיךָ
  choice: diante dos seus adversários
  rationale: Mantém a expressão espacial hebraica em sentido militar e evita repetir «inimigos» da oração seguinte.
- source_word: חֶרֶב אוֹיְבֶיךָ
  choice: a espada dos seus inimigos
  rationale: Preserva a imagem marcial e o contraste com «a espada de Yahweh».
- source_word: לְמַשֶּׂגֶת
  choice: o alcança
  rationale: O infinitivo expressa alcançar alguém durante uma perseguição; a construção portuguesa é natural e mantém a imagem.
- source_word: חֶרֶב יְהוָה
  choice: a espada de Yahweh
  rationale: Conserva a metáfora e o nome divino presentes no texto hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: דֶבֶר
  choice: peste
  rationale: Designa doença epidêmica em contexto de juízo; «peste» é claro, grave e corrente em português.
- source_word: מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  rationale: É a equivalência normal no contexto narrativo e não especifica além do texto a identidade desse agente.
- source_word: מַשְׁחִית
  choice: destruindo
  rationale: Reproduz o valor verbal contínuo do particípio hifil de שׁחת.
- source_word: בְּכָל גְּבוּל יִשְׂרָאֵל
  choice: por todo o território de Israel
  rationale: Aqui גְּבוּל abrange toda a extensão territorial, não apenas as linhas de fronteira.
- source_word: רְאֵה
  choice: considere
  rationale: O imperativo pede reflexão e decisão, não percepção visual literal.
- source_word: מָה אָשִׁיב אֶת שֹׁלְחִי דָּבָר
  choice: que resposta devo levar àquele que me enviou
  rationale: Expressa de modo natural a obrigação de retornar ao remetente com uma resposta, preservando a relação de envio.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico emprega diretamente o Tetragrama; «Yahweh» conserva o nome próprio em vez de trocá-lo por um título.
- issue: Identidade do מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  alternative: o mensageiro de Yahweh
  rationale: A tradução mantém o valor lexical contextual sem decidir se a figura é um anjo criado ou uma manifestação divina específica.
- issue: Relação entre «espada de Yahweh» e «peste»
  choice: isto é, peste na terra
  alternative: a espada de Yahweh e peste na terra
  rationale: A sintaxe apresenta a peste como explicação ou concretização da espada de Yahweh. «Isto é» torna essa relação inteligível sem fundir a peste com a ação subsequente do anjo.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. O paralelismo das três opções foi mantido com ponto e vírgula. Emprega-se «seus» em referência a Davi e «o» como objeto, evitando regionalismos. As notas [a] e [b] aparecem no texto principal.
