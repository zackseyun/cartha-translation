  naturalness: 'O texto é em geral claro e digno, mas havia mistura de tratamento: «dos seus adversários», «o alcança» e «considere» combinam referências de terceira pessoa com um imperativo formal. A revisão usa o tratamento formal de modo consistente. «Ser varrido» é natural no quadro de perseguição militar e evita sugerir necessariamente destruição total.'
  terminology: «Fome», «espada», «peste», «anjo de Yahweh» e «território de Israel» são adequados. «Yahweh» preserva corretamente o Tetragrama. A nota sobre «peste» passa a registrar a alternativa lexical pertinente; a nota sobre o particípio passa a estar ancorada no termo que comenta.
