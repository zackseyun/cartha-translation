    issue: «sendo arrasado» restringe excessivamente נִסְפֶּה.
    rationale: «Arrasado» tende a comunicar devastação ou aniquilação completa. No contexto de fuga e alcance pela espada inimiga, «sendo varrido» conserva o sentido de ruína/eliminação sem resolver se o foco é derrota, morte ou destruição.
  - severity: medium
