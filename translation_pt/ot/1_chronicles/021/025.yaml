base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/025.yaml
  text: And David gave Ornan six hundred shekels of gold by weight for the place[a].
translation:
  language: pt
  text: Davi deu a Ornã, pelo lugar, seiscentos siclos de ouro, em peso[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O relato paralelo em 2 Samuel 24:24 menciona cinquenta siclos de prata; aqui, Crônicas traz seiscentos siclos de ouro. A diferença talvez reflita um alcance distinto da compra ou uma tradição textual diferente.
    reason: Referência cruzada que preserva e explica, sem harmonizar, a diferença entre os relatos.
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: deu
  rationale: O verbo נָתַן significa normalmente “dar”. Embora o contexto seja de compra, “deu” preserva a formulação hebraica, e o preço mencionado deixa claro o sentido de pagamento.
- source_word: לְאָרְנָן
  choice: a Ornã
  rationale: O texto de Crônicas traz o nome Ornã. A forma Araúna pertence ao relato paralelo em Samuel e não deve substituir o nome presente na fonte imediata.
- source_word: בַּמָּקוֹם
  choice: pelo lugar
  rationale: מָקוֹם pode significar “lugar” ou “local”. Neste contexto de compra, a preposição indica aquilo pelo que se paga; “pelo lugar” expressa isso de modo conciso.
- source_word: שִׁקְלֵי זָהָב
  choice: siclos de ouro
  rationale: Mantém a antiga unidade de peso e o material especificado pelo hebraico, usando a forma tradicional e reconhecível em português.
- source_word: מִשְׁקָל
  choice: por peso
  rationale: מִשְׁקָל esclarece que os siclos são uma medida de peso. “Por peso” conserva essa informação sem converter a unidade antiga.
- source_word: שֵׁשׁ מֵאוֹת
  choice: seiscentos
  rationale: Tradução direta do numeral hebraico, sem ajustá-lo ao valor diferente encontrado no relato paralelo.
theological_decisions:
- issue: Diferença numérica em relação ao relato paralelo de 2 Samuel 24:24
  choice: Manter “seiscentos siclos de ouro”, conforme o texto hebraico de Crônicas.
  alternative: Harmonizar a passagem com os cinquenta siclos de prata mencionados em 2 Samuel 24:24.
  rationale: Crônicas declara explicitamente seiscentos siclos de ouro. A tradução deve preservar o dado da fonte e a tensão entre os relatos, sem impor uma harmonização. Uma diferença no alcance da compra ou na tradição textual é possível, mas não deve ser afirmada como solução certa no texto principal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Conserva “siclos” como unidade antiga e “Ornã” conforme o texto de Crônicas. A expressão “por peso” mantém uma informação explícita do hebraico, ainda que tenha leve sabor bíblico.
