  text: וַ/יַּ֤עַל דָּוִיד֙ בִּ/דְבַר גָּ֔ד אֲשֶׁ֥ר דִּבֶּ֖ר בְּ/שֵׁ֥ם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/019.yaml
  text: So David went up at the word of Gad[b][a], which he had spoken in the name of Yahweh.
translation:
  language: pt
  text: Então Davi subiu conforme a palavra que Gade havia dito em nome de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: subiu
  rationale: Preserva a nuance direcional do verbo עלה no contexto da ida de Davi à eira, sem acrescentar um destino que não aparece neste versículo.
- source_word: בִּדְבַר גָּד
  choice: conforme a palavra de Gade
  rationale: A preposição בְּ indica aqui conformidade ou fundamento. A formulação mantém o sentido de Davi agir em obediência à mensagem transmitida por Gade.
- source_word: אֲשֶׁר דִּבֶּר
  choice: que ele havia proferido
  rationale: O mais natural no contexto é que a oração relativa retome a palavra de Gade. O mais-que-perfeito indica de modo idiomático em português que a fala precedeu a ação de Davi.
- source_word: בְּשֵׁם יְהוָה
  choice: em nome de Yahweh
  rationale: Mantém a expressão hebraica que apresenta Gade falando sob a autoridade divina e preserva o nome próprio representado pelo Tetragrama.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal, em vez de substituí-lo por um título.
- issue: Referente implícito de אֲשֶׁר דִּבֶּר
  choice: Gade havia proferido a palavra
  alternative: Davi havia proferido a palavra
  rationale: A sintaxe e o contexto favorecem Gade como o falante da mensagem dada em nome de Yahweh, embora o pronome português mantenha uma leve correspondência com a forma não expressa do sujeito hebraico.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com nomes na forma tradicional portuguesa (“Davi”, “Gade”) e sintaxe próxima do hebraico sem rigidez artificial.
