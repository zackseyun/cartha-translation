base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/065.yaml
  text: 'And from the tribe of Gad: Ramoth in Gilead with its pasturelands[a], and Mahanaim with its pasturelands.'
translation:
  language: pt
  text: 'E da tribo de Gade: Ramote, em Gileade, com suas terras de pastagem, e Maanaim, com suas terras de pastagem.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִמַּטֵּה
  choice: E, da tribo de
  rationale: No contexto da distribuição territorial, מַטֶּה designa uma tribo. A conjunção e a preposição são expressas naturalmente por “E, da”.
- source_word: גָד
  choice: Gade
  rationale: Forma portuguesa consagrada do nome da tribo.
- source_word: רָאמוֹת בַּגִּלְעָד
  choice: Ramote, em Gileade
  rationale: Preserva a construção hebraica com a preposição בְּ (“em”) e emprega formas reconhecíveis em português.
- source_word: מִגְרָשֶׁיהָ
  choice: suas pastagens
  rationale: מִגְרָשׁ designa as terras abertas ao redor de uma cidade levítica, destinadas sobretudo ao pastoreio; “pastagens” é claro e conciso neste contexto.
- source_word: מַחֲנַיִם
  choice: Maanaim
  rationale: Transliteração tradicional e amplamente reconhecida em português.
- source_word: וְאֶת
  choice: e
  rationale: O marcador de objeto direto repetido organiza a lista; em português, a coordenação simples com “e” transmite naturalmente essa função.
