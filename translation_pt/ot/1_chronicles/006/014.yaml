lexical_decisions:
- source_word: בְּנֵי
  choice: Os filhos de
  rationale: Plural construto de בֵּן que introduz a genealogia. “Os filhos de” reproduz diretamente a forma hebraica; em linguagem genealógica, o termo também pode abranger descendentes.
- source_word: מְרָרִי
  choice: Merari
  rationale: Nome próprio transliterado segundo a forma tradicional e amplamente reconhecida em português.
- source_word: מַחְלִי
  choice: Mali
  rationale: Nome próprio vertido pela forma tradicional em português, clara e corrente em traduções bíblicas.
- source_word: לִבְנִי
  choice: Libni
  rationale: Nome próprio transliterado de modo natural em português.
- source_word: בְנוֹ
  choice: seu filho
  rationale: O substantivo com sufixo masculino singular indica a relação filial. “Seu filho”, repetido após cada nome, preserva a cadeia genealógica do hebraico.
- source_word: שִׁמְעִי
  choice: Simei
  rationale: Nome próprio vertido pela forma tradicional em português.
- source_word: עֻזָּה
  choice: Uzá
  rationale: Transliteração portuguesa que representa o nome hebraico e emprega acento para indicar naturalmente a tonicidade final.
