  text: 'The sons of Merari: Mahli[a], Libni his son, Shimei his son, Uzzah his son.'
translation:
  language: pt
  text: 'Os filhos[a] de Merari: Mali; Libni, seu filho; Simei, seu filho; Uzá, seu filho.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, em sentido mais amplo na linguagem genealógica, “descendentes de Merari”.
