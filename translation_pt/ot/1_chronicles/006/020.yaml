lexical_decisions:
- source_word: בֶּן
  choice: filho de
  rationale: Em uma genealogia, בֶּן indica filiação ou descendência. A repetição de “filho de” preserva a estrutura encadeada do hebraico e é natural em português.
- source_word: ציף
  choice: Zife
  rationale: Nome próprio transliterado em forma portuguesa, de acordo com a pronúncia aproximada do hebraico e o uso bíblico corrente.
- source_word: אֶלְקָנָה
  choice: Elcana
  rationale: Nome próprio apresentado na forma portuguesa tradicional e amplamente reconhecível.
- source_word: מַחַת
  choice: Maate
  rationale: Nome próprio transliterado em forma portuguesa, sem traduzir seu possível sentido etimológico.
- source_word: עֲמָשָׂי
  choice: Amasai
  rationale: Nome próprio transliterado de modo claro e reconhecível em português.
