  yaml_path: translation/ot/1_chronicles/006/059.yaml
  text: 'and from the tribe of Asher: Mashal with its pasturelands[a], and Abdon with its pasturelands.'
translation:
  language: pt
  text: 'e da tribo de Aser: Masal com suas pastagens[a], e Abdom com suas pastagens.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, Masal segue a forma encontrada em Crônicas; a lista paralela em Josué 21:30 traz Misal.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  choice: e, da tribo de
  rationale: Em contextos de distribuição territorial, מַטֶּה designa uma tribo; a conjunção e a preposição são representadas por “e, da”.
- source_word: אָשֵׁר
  choice: Aser
  rationale: Forma tradicional e amplamente reconhecida em português para o nome da tribo.
- source_word: אֶת מָשָׁל
  choice: Masal
  rationale: O marcador de objeto direto não é traduzido. O topônimo segue a forma do texto de Crônicas; a variante do paralelo em Josué é preservada em nota.
- source_word: מִגְרָשֶׁיהָ
  choice: suas pastagens
  rationale: מִגְרָשׁ designa as terras abertas ao redor de uma cidade, usadas especialmente para pastoreio; “pastagens” é natural e claro neste contexto. O sufixo feminino singular retoma cada cidade.
- source_word: עַבְדּוֹן
  choice: Abdom
  rationale: Transliteração portuguesa corrente do topônimo hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas de nomes reconhecíveis ao leitor lusófono. A sintaxe conserva a continuidade com os versículos anteriores, e “pastagens” comunica de modo natural a função das terras vinculadas às cidades levíticas.
