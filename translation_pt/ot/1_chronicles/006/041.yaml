  yaml_path: translation/ot/1_chronicles/006/041.yaml
  text: But the fields of the city and its pasturelands they gave to Caleb son of Jephunneh[a].
translation:
  language: pt
  text: Mas os campos da cidade e suas terras adjacentes[a] foram dados a Calebe, filho de Jefoné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas terras de pastagem”, “seus povoados” ou “seus assentamentos”. Neste contexto de distribuição de terras, o hebraico pode referir-se a áreas vinculadas à cidade; não se trata de pátios urbanos.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂדֵה הָעִיר
  choice: os campos da cidade
  rationale: שָׂדֶה designa campo, terra aberta ou cultivável; no coletivo ligado à cidade, a expressão se refere aos campos pertencentes a ela.
- source_word: חֲצֵרֶיהָ
  choice: as terras ao redor dela
  rationale: חָצֵר pode designar povoados dependentes ou áreas abertas associadas à cidade. A tradução mantém o sentido territorial apropriado ao contexto de distribuição de terras sem restringi-lo indevidamente a pastagens.
- source_word: נָתְנוּ
  choice: foram dados
  rationale: O qal perfeito de נתן significa literalmente “deram”. A voz passiva em português evita um sujeito indeterminado pouco natural e preserva o ato simples de concessão.
- source_word: לְכָלֵב בֶּן יְפֻנֶּה
  choice: a Calebe, filho de Jefoné
  rationale: O לְ marca o destinatário; os nomes seguem formas portuguesas tradicionais e amplamente reconhecidas.
- source_word: וְאֶת ... וְאֶת
  choice: Mas ... e ...
  rationale: 'O primeiro וְ assume valor contrastivo no contexto: a cidade foi destinada aos sacerdotes, mas suas terras anexas ficaram com Calebe.'
