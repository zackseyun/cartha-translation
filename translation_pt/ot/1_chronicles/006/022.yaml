lexical_decisions:
- source_word: בֶּן
  choice: filho de
  rationale: Na fórmula genealógica, traduz de modo direto e natural a relação filial indicada pelo hebraico. Embora genealogias possam omitir gerações, este versículo não exige o sentido mais amplo de “descendente de”.
- source_word: תַּחַת
  choice: Taate
  rationale: Nome próprio transliterado conforme uma forma corrente e legível em português.
- source_word: אַסִּיר
  choice: Assir
  rationale: Nome próprio transliterado de modo próximo ao hebraico e conforme o uso bíblico em português.
- source_word: אֶבְיָסָף
  choice: Ebiasafe
  rationale: Transliteração que representa de perto a forma massorética hebraica; a variante Abiasafe é registrada em nota.
- source_word: קֹרַח
  choice: Corá
  rationale: Forma tradicional e amplamente reconhecível em português para o nome hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, preservando a estrutura concisa e repetitiva da genealogia hebraica. A nota foi colocada em Ebiasafe, pois é esse nome que apresenta a variante lexical.
