base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/013.yaml
  text: 'And the sons of Samuel: the firstborn[a], Vashni, and Abijah.'
translation:
  language: pt
  text: 'E os filhos de Samuel: o primogênito, Vasni[a], e Abias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: Vasni. A expressão também pode ser entendida como “e o segundo”; compare 1 Samuel 8:2, que identifica os filhos de Samuel como Joel e Abias.'
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: E os filhos de
  rationale: A conjunção preserva a sequência genealógica, e a construção com o nome pessoal é expressa naturalmente por “os filhos de”.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Forma consagrada e amplamente reconhecida do nome em português.
- source_word: הַבְּכֹר
  choice: o primogênito
  rationale: O termo definido indica a posição do filho segundo a ordem de nascimento; “primogênito” é preciso e natural em contexto genealógico.
- source_word: וַשְׁנִי
  choice: Vasni
  rationale: A vocalização massorética permite tratar a forma como nome próprio, embora as mesmas consoantes possam ser entendidas como “e o segundo”; a ambiguidade é preservada em nota.
- source_word: וַאֲבִיָּה
  choice: e Abias
  rationale: Traduz a conjunção e emprega a forma portuguesa tradicional e inteligível do nome.
theological_decisions:
- issue: Dificuldade genealógica e textual referente aos filhos de Samuel
  choice: Manter “Vasni” no texto principal, conforme a forma massorética vocalizada
  alternative: Entender a expressão como “o primogênito e o segundo, Abias”, ou suprir “Joel” com base em 1 Samuel 8:2
  rationale: A redação hebraica recebida é preservada sem harmonização silenciosa. Como 1 Samuel 8:2 identifica Joel e Abias como filhos de Samuel, a dificuldade e a leitura alternativa são indicadas em nota.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe genealógica concisa. Os nomes seguem formas correntes em português, e a ambiguidade real do hebraico é mantida por meio de nota.
