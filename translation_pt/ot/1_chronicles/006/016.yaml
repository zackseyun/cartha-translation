id: 1CH.6.16
reference: 1 Chronicles 6:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אֵ֗לֶּה אֲשֶׁ֨ר הֶעֱמִ֥יד דָּוִ֛יד עַל יְדֵי שִׁ֖יר בֵּ֣ית יְהוָ֑ה מִ/מְּנ֖וֹחַ הָ/אָרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/016.yaml
  text: These are the men whom David appointed over the service of song in the house of Yahweh[b][a], after the ark came to rest.
translation:
  language: pt
  text: Estes são os que Davi encarregou do serviço do canto[a] na casa de Yahweh, depois que a arca repousou[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «do canto» ou «para dirigir o canto». A expressão hebraica indica responsabilidade pelo canto no santuário.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: «desde o repouso da arca».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Estes são
  rationale: Introduz a lista seguinte. A omissão de «e» é natural em português e mantém a força demonstrativa.
- source_word: אֲשֶׁר הֶעֱמִיד דָּוִיד
  choice: os que Davi encarregou
  rationale: O hifil de עמד, neste contexto de organização do culto, indica que Davi designou essas pessoas para uma função, não apenas que as colocou fisicamente em pé.
- source_word: עַל יְדֵי שִׁיר
  choice: do serviço do canto
  rationale: A expressão indica responsabilidade pelo canto cultual. «Serviço do canto» conserva tanto a função musical quanto seu caráter organizado, sem acrescentar uma categoria eclesiástica posterior.
- source_word: בֵּית יְהוָה
  choice: na casa de Yahweh
  rationale: Mantém a imagem hebraica de «casa» para o santuário e translitera o nome divino explícito, sem substituí-lo por um título.
- source_word: מִמְּנוֹחַ הָאָרוֹן
  choice: depois que a arca repousou
  rationale: Expressa em português natural o valor temporal da construção, preservando a ideia de a arca ter chegado ao seu lugar de repouso.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. «Yahweh» procura representá-lo diretamente, em vez de substituí-lo por um título.
- issue: Natureza da função musical
  choice: serviço do canto
  alternative: ministério de música; encarregados de cantar
  rationale: A formulação preserva a função cultual e administrativa sem importar terminologia eclesiástica posterior nem limitar a expressão ao simples ato de cantar.
translation_notes:
  register: Português atual, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. «Casa» preserva a expressão do hebraico; «arca» não é ampliada para «arca da aliança», pois o complemento não aparece neste versículo.
