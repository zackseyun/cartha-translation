lexical_decisions:
- source_word: אֶלְקָנָה
  choice: Elcana
  rationale: Nome próprio transliterado na forma consagrada e natural em português, sem traduzir seu significado.
- source_word: בְנוֹ
  choice: seu filho
  rationale: O substantivo בֵּן com sufixo masculino singular significa mais diretamente “seu filho”; embora genealogias possam empregar linguagem filial para relações mais amplas, não há razão textual para explicitar “descendente” aqui.
- source_word: וְ
  choice: e
  rationale: Conjunção simples que liga os membros da genealogia; em português, a primeira ocorrência pode ficar implícita na enumeração, enquanto a última é expressa para dar fluidez natural.
- source_word: אֶבְיָסָף
  choice: Ebiasafe
  rationale: Transliteração portuguesa clara da forma hebraica apresentada, com terminação adaptada à leitura corrente em português.
- source_word: אַסִּיר
  choice: Assir
  rationale: Transliteração direta do nome hebraico, preservando a consoante duplicada indicada pelo daguesh.
