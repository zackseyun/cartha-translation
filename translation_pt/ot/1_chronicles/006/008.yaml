  text: Elcana, seu filho, e Ebiasafe[a], seu filho, e Assir, seu filho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Abiasafe», forma tradicional encontrada em algumas versões e em formas genealógicas paralelas.
