translation:
  language: pt
  text: Ramote com suas terras de pastagem, e Aném[a] com suas terras de pastagem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Aném”; a lista paralela em Josué 21:25 traz “Aner”.'
