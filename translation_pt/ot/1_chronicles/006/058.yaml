lexical_decisions:
- source_word: רָאמוֹת
  choice: Ramote
  rationale: Topônimo transliterado segundo a forma tradicional e legível em português, sem traduzir o nome próprio.
- source_word: מִגְרָשֶׁיהָ
  choice: suas terras de pastagem
  rationale: מִגְרָשׁ designa as áreas abertas pertencentes à cidade, frequentemente destinadas ao pastoreio; a expressão é clara no contexto das cidades levíticas e conserva o sufixo feminino referente a cada cidade.
- source_word: עָנֵם
  choice: Aném
  rationale: Translitera a leitura do Texto Massorético, עָנֵם, preservando em nota a variante da lista paralela.
- source_word: וְאֶת
  choice: e
  rationale: O marcador de objeto אֶת não tem equivalente explícito natural em português; a conjunção וְ é representada por «e» na enumeração.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural de enumeração. «Terras de pastagem» comunica com precisão funcional o sentido do termo hebraico sem recorrer ao arcaico «arrabaldes». O marcador da nota foi ligado diretamente a «Aném», termo ao qual a variante textual se refere.
