base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/047.yaml
  text: 'And to the sons of Gershom[a], according to their clans, from the tribe of Issachar, and from the tribe of Asher, and from the tribe of Naphtali[b], and from the tribe of Manasseh in Bashan: thirteen cities.'
translation:
  language: pt
  text: E aos filhos de Gérsom[a], segundo os seus clãs, deram, da tribo de Issacar, da tribo de Aser, da tribo de Naftali e da tribo de Manassés em Basã[b], treze cidades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico deste versículo traz a forma “Gérsom”; “Gérson” é a forma tradicional do nome do clã em português.
    reason: alternative_reading
  - marker: b
    text: Algumas traduções trazem “a meia tribo de Manassés em Basã” para explicitar a referência geográfica; “meia tribo” não consta no hebraico deste versículo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי
  choice: E aos filhos de
  rationale: A conjunção, a preposição e o substantivo introduzem a próxima concessão da lista. “Filhos de” mantém a expressão genealógica do hebraico; o verbo “deram” é suprido em português a partir do contexto sintático da enumeração para formar uma frase natural.
- source_word: גֵרְשׁוֹם
  choice: Gérson
  rationale: Adota-se a forma portuguesa tradicional do nome do clã levítico, registrando em nota que o hebraico deste versículo apresenta a grafia Gérsom.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: segundo os seus clãs
  rationale: No contexto de organização tribal, מִשְׁפָּחָה designa agrupamentos de parentesco maiores que a família doméstica; “clãs” comunica essa função com precisão.
- source_word: מִמַּטֵּה
  choice: da tribo de
  rationale: מַטֶּה significa “tribo” neste contexto territorial e genealógico. A repetição é preservada de modo próximo ao hebraico.
- source_word: יִשָׂשכָר
  choice: Issacar
  rationale: Forma consagrada e amplamente reconhecível em português.
- source_word: אָשֵׁר
  choice: Aser
  rationale: Forma consagrada e amplamente reconhecível em português.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Transliteração portuguesa moderna e reconhecível do nome tribal.
- source_word: מְנַשֶּׁה בַּבָּשָׁן
  choice: Manassés, em Basã
  rationale: Mantém a formulação explícita do hebraico sem acrescentar “meia tribo”; Basã identifica a região do território manassita a leste do Jordão.
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה
  choice: treze cidades
  rationale: Equivalência direta da expressão cardinal hebraica, com o número escrito por extenso conforme o estilo bíblico.
theological_decisions:
- issue: Identificação de Manassés em Basã
  choice: Manassés, em Basã
  alternative: a meia tribo de Manassés, em Basã
  rationale: Embora a referência geográfica corresponda à parte transjordaniana de Manassés, “meia tribo” não aparece no hebraico deste versículo e, por isso, não é inserido no texto.
translation_notes:
  register: Português moderno, claro e digno, com nomes bíblicos correntes. A ordem enumerativa e a repetição de “tribo” refletem a estrutura administrativa do hebraico. O verbo “deram”, implícito na construção elíptica deste item da lista, foi explicitado para assegurar uma frase completa e natural em português.
