  text: 'And the sons of Kohath: Amram, Izhar, Hebron, and Uzziel.'
translation:
  language: pt
  text: 'E os filhos de Coate: Anrão, Izar, Hebrom e Uziel.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: E os filhos de
  rationale: A conjunção וּ preserva a sequência genealógica, e בְנֵי, em estado construto, é traduzido naturalmente por “os filhos de”; aqui são filhos imediatos, não descendentes em sentido amplo.
- source_word: קְהָת
  choice: Coate
  rationale: Forma tradicional e amplamente reconhecida em português para o nome próprio hebraico.
- source_word: עַמְרָם
  choice: Anrão
  rationale: Forma portuguesa consagrada do nome próprio hebraico.
- source_word: וְיִצְהָר
  choice: Isar
  rationale: Forma portuguesa corrente do nome próprio; a conjunção prefixada é representada pela estrutura da enumeração.
- source_word: וְחֶבְרוֹן
  choice: Hebrom
  rationale: Forma portuguesa consagrada; no contexto, trata-se de uma pessoa, não da cidade de mesmo nome.
- source_word: וְעֻזִּיאֵל
  choice: Uziel
  rationale: Forma portuguesa corrente do nome próprio; a conjunção é expressa por “e” antes do último elemento da lista.
