base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/062.yaml
  text: 'To the sons of Merari who remained[a], from the tribe of Zebulun: Rimmono and its pasturelands, Tabor and its pasturelands.'
translation:
  language: pt
  text: 'Aos filhos de Merari que restavam, da tribo de Zebulom: Rimono[a] e suas pastagens, Tabor e suas pastagens.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico traz “Rimono”; a passagem paralela em Josué 21:35 traz “Dimna”.
    reason: textual_variant
lexical_decisions:
- source_word: לִבְנֵי מְרָרִי
  choice: Aos filhos de Merari
  rationale: O לְ prefixado indica os destinatários da distribuição; “aos filhos de Merari” mantém a forma genealógica do hebraico e é natural no contexto.
- source_word: הַנּוֹתָרִים
  choice: que restavam
  rationale: O particípio indica os meraritas restantes após as distribuições anteriores, preservando o sentido sequencial.
- source_word: מִמַּטֵּה זְבוּלֻן
  choice: da tribo de Zebulom
  rationale: Neste contexto de repartição territorial, מַטֶּה significa “tribo”; “Zebulom” é a forma portuguesa tradicional e amplamente reconhecida.
- source_word: רִמּוֹנוֹ
  choice: Rimono
  rationale: Segue a leitura do Texto Massorético, transliterada de modo acessível em português; a variante do paralelo é registrada em nota.
- source_word: מִגְרָשֶׁיהָ
  choice: suas pastagens
  rationale: Nas listas de cidades levíticas, מִגְרָשׁ designa os terrenos abertos ao redor da cidade, usados especialmente para o pastoreio.
- source_word: תָּבוֹר
  choice: Tabor
  rationale: Nome próprio do lugar, mantido na forma portuguesa corrente; aqui designa uma cidade.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A expressão verbal “foram dadas” foi explicitada a partir do contexto da lista de distribuição, embora esteja elíptica neste versículo hebraico. O marcador da nota foi colocado junto a “Rimono”, termo ao qual a variante textual de fato se refere.
