base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/039.yaml
  text: These were their dwelling places according to their settlements within their territory[a], for the sons of Aaron, of the family of the Kohathites; for the lot was theirs.
translation:
  language: pt
  text: Estes eram seus lugares de moradia, segundo seus povoados, dentro de seu território[a], para os filhos de Arão, da família dos coatitas, pois a sorte lhes coube.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “segundo seus acampamentos” ou “em suas aldeias”, em vez de “segundo seus povoados”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשְׁבוֹתָם
  choice: os lugares onde moravam
  rationale: Expressa de modo natural e concreto os lugares de residência indicados pelo substantivo hebraico.
- source_word: לְטִירוֹתָם
  choice: segundo seus povoados
  rationale: טִירָה pode indicar povoado, acampamento ou aldeia cercada; “povoados” se ajusta ao contexto territorial sem restringir demais o sentido.
- source_word: בִּגְבוּלָם
  choice: dentro do seu território
  rationale: Aqui גְּבוּל designa a área territorial atribuída, e não apenas sua linha de fronteira.
- source_word: לִבְנֵי אַהֲרֹן
  choice: destinados aos filhos de Arão
  rationale: Mantém a designação familiar tradicional e explicita naturalmente em português a relação de atribuição marcada pela preposição.
- source_word: לְמִשְׁפַּחַת הַקְּהָתִי
  choice: da família dos coatitas
  rationale: Identifica com clareza a afiliação ao grupo coatita, preservando a linguagem familiar do texto.
- source_word: כִּי לָהֶם הָיָה הַגּוֹרָל
  choice: pois o sorteio lhes coube
  rationale: Comunica a atribuição por sortes de maneira idiomática, preservando a imagem do sorteio presente no hebraico.
