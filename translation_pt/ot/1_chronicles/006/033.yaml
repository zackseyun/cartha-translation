  text: וַ/אֲחֵי/הֶ֖ם הַ/לְוִיִּ֑ם נְתוּנִ֕ים לְ/כָ֨ל עֲבוֹדַ֔ת מִשְׁכַּ֖ן בֵּ֥ית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/033.yaml
  text: And their brothers the Levites were appointed for all the service of the tabernacle of the house of God[a].
translation:
  language: pt
  text: E seus irmãos, os levitas, foram designados para todo o serviço do tabernáculo da casa de Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foram dados”; o particípio hebraico significa literalmente “dados” e, neste contexto, tem o sentido de destinados ou designados para uma função.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: E seus irmãos
  rationale: O waw é traduzido naturalmente por “E” no contexto da lista. “Irmãos” preserva o termo hebraico de parentesco, que aqui também pode abranger membros do mesmo clã.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: Designação tribal direta e tradicional para os membros da tribo de Levi.
- source_word: נְתוּנִים
  choice: foram designados
  rationale: O particípio passivo de נתן significa literalmente “dados”, mas neste contexto de funções cultuais comunica a ideia de serem destinados ou designados para o serviço.
- source_word: לְכָל עֲבוֹדַת
  choice: para todo o serviço
  rationale: A preposição לְ indica a esfera ou finalidade da designação, e עֲבוֹדָה, em contexto cultual, refere-se ao serviço realizado no santuário.
- source_word: מִשְׁכַּן
  choice: tabernáculo
  rationale: Termo consagrado e reconhecível para a morada sagrada móvel, mantendo a distinção lexical presente no hebraico.
- source_word: בֵּית הָאֱלֹהִים
  choice: casa de Deus
  rationale: Tradução direta da expressão hebraica, sem substituí-la interpretativamente por “templo”.
theological_decisions:
- issue: Relação entre “tabernáculo” e “casa de Deus” no contexto do Cronista
  choice: tabernáculo da casa de Deus
  alternative: casa de Deus; tenda do templo de Deus
  rationale: O hebraico contém tanto מִשְׁכַּן (“tabernáculo”) quanto בֵּית הָאֱלֹהִים (“casa de Deus”). Preservar os dois termos evita eliminar a tensão histórica e cultual da formulação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação mantém o vocabulário cultual tradicional sem recorrer a terminologia eclesiástica posterior.
