lexical_decisions:
- source_word: בֶּן
  choice: filho de
  rationale: Mantém a fórmula genealógica repetitiva do hebraico. Embora בֶּן possa indicar descendência mais ampla em certas genealogias, aqui a tradução formal «filho de» é natural e preserva a estrutura do texto.
- source_word: אֶלְקָנָה
  choice: Elcana
  rationale: Forma portuguesa tradicional e amplamente reconhecível do nome hebraico.
- source_word: יְרֹחָם
  choice: Jeroão
  rationale: Transliteração portuguesa corrente do nome hebraico, com leitura natural para o público lusófono.
- source_word: אֱלִיאֵל
  choice: Eliel
  rationale: Transliteração direta e já corrente em português.
- source_word: תּוֹחַ
  choice: Toá
  rationale: Representa a forma massorética deste versículo, distinguindo-a sem corrigi-la silenciosamente pela forma encontrada na genealogia paralela.
