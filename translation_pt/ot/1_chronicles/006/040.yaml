  text: They gave them Hebron in the land of Judah[a], with its pasturelands around it.
translation:
  language: pt
  text: Deram-lhes Hebrom, na terra de Judá, com as pastagens[a] ao redor da cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «terras de uso comum». O termo hebraico se refere aos terrenos abertos ligados a uma cidade, muitas vezes usados para pastoreio.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Deram
  rationale: O wayyiqtol qal de נתן dá continuidade à narrativa e indica a ação passada de dar; em português, o pretérito perfeito sem a conjunção inicial produz uma narrativa natural.
- source_word: לָהֶם
  choice: lhes
  rationale: A preposição לְ marca o objeto indireto; o pronome átono «lhes» expressa de modo conciso e idiomático «a eles».
- source_word: חֶבְרוֹן
  choice: Hebrom
  rationale: Forma tradicional e amplamente reconhecida em português para o topônimo hebraico.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: na terra de Judá
  rationale: Preserva o substantivo אֶרֶץ e sua designação geográfica sem restringi-lo indevidamente a uma divisão administrativa.
- source_word: מִגְרָשֶׁיהָ
  choice: as pastagens
  rationale: מִגְרָשׁ designa os terrenos abertos vinculados à cidade, frequentemente usados para o pastoreio no contexto das cidades levíticas; «pastagens» comunica com clareza sua função habitual.
- source_word: סְבִיבֹתֶיהָ
  choice: ao redor da cidade
  rationale: O termo indica a área circundante. Repetir «da cidade» evita a possível ambiguidade do pronome feminino português, que poderia remeter a «terra» ou «pastagens».
