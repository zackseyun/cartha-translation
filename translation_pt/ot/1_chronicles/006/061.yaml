base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/061.yaml
  text: 'And from the tribe of Naphtali: Kedesh in Galilee with its pasturelands[a], Hammon with its pasturelands, and Kiriathaim with its pasturelands.'
translation:
  language: pt
  text: 'E da tribo de Naftali: Quedes, na Galileia, com suas pastagens[a]; Hamom, com suas pastagens; e Quiriataim, com suas pastagens.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “terras comuns”; o hebraico se refere à área aberta pertencente a cada cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמַּטֵּה
  choice: E da tribo de
  rationale: Em contextos de distribuição territorial, מַטֶּה designa uma tribo; a conjunção e a preposição prefixadas são naturalmente traduzidas por “E da”.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Forma tradicional e amplamente reconhecida em português para o nome da tribo.
- source_word: קֶדֶשׁ בַּגָּלִיל
  choice: Quedes, na Galileia
  rationale: Quedes é a forma portuguesa tradicional do topônimo, e בַּגָּלִיל indica sua localização na Galileia.
- source_word: מִגְרָשֶׁיהָ
  choice: suas pastagens
  rationale: מִגְרָשׁ refere-se à área aberta vinculada à cidade, usada especialmente para pastagem; o sufixo feminino singular retoma cada cidade.
- source_word: חַמּוֹן
  choice: Hamom
  rationale: Transliteração portuguesa do topônimo hebraico, com terminação consonantal representada de modo natural em português.
- source_word: קִרְיָתַיִם
  choice: Quiriataim
  rationale: Transliteração portuguesa clara do topônimo hebraico, em conformidade com convenções bíblicas correntes.
