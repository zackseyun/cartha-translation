  text: Joah his son[a], Iddo his son, Zerah his son, Jeatherai his son.
translation:
  language: pt
  text: Joá, seu filho; Ido, seu filho; Zerá, seu filho; Jeaterai[a], seu filho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Jeterai”.
    reason: Alternativa de transliteração do nome próprio hebraico יְאָתְרַי. O marcador foi ligado ao nome correspondente, em vez de a “Joá” como aparece na camada inglesa de consulta.
lexical_decisions:
- source_word: יוֹאָח
  choice: Joá
  rationale: Nome próprio transliterado de acordo com a forma tradicional e reconhecível em português.
- source_word: בְּנוֹ
  choice: seu filho
  rationale: Na fórmula genealógica, בֵּן com sufixo de terceira pessoa masculina singular significa naturalmente “seu filho”. Embora genealogias possam omitir gerações, não há razão lexical para substituir aqui por “descendente”.
- source_word: עִדּוֹ
  choice: Ido
  rationale: Transliteração corrente e natural do nome próprio em português.
- source_word: זֶרַח
  choice: Zerá
  rationale: Transliteração portuguesa que representa o nome próprio hebraico e assinala sua tonicidade final.
- source_word: יְאָתְרַי
  choice: Jeaterai
  rationale: Transliteração próxima da vocalização massorética; “Jeterai” permanece uma representação alternativa possível.
