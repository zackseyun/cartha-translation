base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/001.yaml
  text: 'The sons of Levi: Gershom[a], Kohath[b], and Merari.'
translation:
  language: pt
  text: 'Os filhos de Levi: Gérson[a], Coate e Merari.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico deste versículo traz a forma Gershom; em passagens relacionadas, aparece também a forma Gershon. Em português, ambas costumam ser representadas por “Gérson”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: filhos de
  rationale: É o plural construto de בֵּן. Embora a linguagem genealógica hebraica às vezes possa abranger descendentes, neste contexto os nomes são os três filhos imediatos de Levi.
- source_word: לֵוִי
  choice: Levi
  rationale: Nome próprio apresentado na forma tradicional e amplamente reconhecida em português.
- source_word: גֵּרְשֹׁם
  choice: Gérson
  rationale: Nome próprio. A forma portuguesa tradicional Gérson corresponde ao nome hebraico deste filho de Levi; a grafia do texto massorético neste versículo é Gershom, enquanto passagens relacionadas apresentam a variante Gershon.
- source_word: קְהָת
  choice: Coate
  rationale: Forma tradicional e amplamente inteligível em português para o nome hebraico.
- source_word: וּ/מְרָרִי
  choice: e Merari
  rationale: Traduz a conjunção וּ por “e” e conserva a forma tradicional portuguesa do nome próprio.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com as formas tradicionais dos nomes bíblicos. O verbo “foram” foi acrescentado por naturalidade, pois a frase nominal hebraica não possui verbo expresso.
