lexical_decisions:
- source_word: בֶּן
  choice: filho de
  rationale: Em uma genealogia, בֶּן significa mais naturalmente «filho de». Embora genealogias possam omitir gerações, nada neste trecho exige o sentido mais amplo de «descendente de» no texto principal.
- source_word: יַחַת
  choice: Jaate
  rationale: Forma portuguesa convencional e reconhecível do nome hebraico יַחַת.
- source_word: גֵּרְשֹׁם
  choice: Gérson
  rationale: Representa em português a forma hebraica גֵּרְשֹׁם deste versículo, sem substituí-la pela forma distinta גֵּרְשׁוֹן, também encontrada em contextos genealógicos.
- source_word: לֵוִי
  choice: Levi
  rationale: Forma portuguesa convencional do nome hebraico לֵוִי.
