lexical_decisions:
- source_word: בֶּן
  choice: filho de
  rationale: Na fórmula genealógica repetida, בֶּן é traduzido naturalmente por “filho de”. Embora genealogias hebraicas possam omitir gerações, o contexto imediato não exige a forma mais ampla “descendente de”.
- source_word: יִצְהָר
  choice: Isaar
  rationale: Transliteração tradicional e reconhecível em português para o nome hebraico Yitshar.
- source_word: קְהָת
  choice: Coate
  rationale: Forma tradicional e amplamente reconhecida em português para o nome hebraico Qehat.
- source_word: לֵוִי
  choice: Levi
  rationale: Forma convencional do nome próprio em português.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: O texto hebraico traz “Israel”, e não “Jacó”; por isso, o nome presente na fonte é preservado no texto principal.
