  text: son of Amzi[a], son of Bani, son of Shemer.
translation:
  language: pt
  text: filho de Amzi[a], filho de Bani, filho de Semer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “descendente de” em cada ocorrência de “filho de”, pois as genealogias hebraicas podem omitir gerações intermediárias.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן
  choice: filho de
  rationale: Em genealogias hebraicas, בֶּן pode indicar tanto filiação imediata quanto descendência linear. “Filho de” preserva a forma repetitiva e transparente do hebraico; a possível compressão genealógica é indicada em nota.
- source_word: אַמְצִי
  choice: Amzi
  rationale: Transliteração do nome próprio hebraico em forma clara e compatível com o uso bíblico corrente em português.
- source_word: בָּנִי
  choice: Bani
  rationale: Transliteração direta do nome próprio hebraico.
- source_word: שָׁמֶר
  choice: Semer
  rationale: Forma portuguesa legível que representa o nome hebraico שָׁמֶר, adaptando a consoante inicial ao padrão tradicional de transliteração bíblica em português.
theological_decisions: []
