- source_word: מִגְרָשֶׁיהָ
  choice: suas pastagens
  rationale: O termo designa as terras abertas pertencentes à cidade, usadas especialmente como áreas de pasto; o sufixo feminino singular se refere a cada cidade.
- source_word: מֵיפַעַת
  choice: Mefaate
  rationale: Nome próprio de lugar, transliterado de modo legível em português.
- source_word: וְאֶת ... וְאֶת
  choice: e ... e
  rationale: A conjunção com o marcador de objeto direto organiza a sequência de cidades e respectivas terras; a coordenação com «e» preserva naturalmente a força aditiva.
