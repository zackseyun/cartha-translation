source:
  edition: WLC
  text: וְ/אֵ֥לֶּה הָ/עֹמְדִ֖ים וּ/בְנֵי/הֶ֑ם מִ/בְּנֵי֙ הַ/קְּהָתִ֔י הֵימָן֙ הַ/מְשׁוֹרֵ֔ר בֶּן יוֹאֵ֖ל בֶּן שְׁמוּאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/018.yaml
  text: 'And these are the ones who stood[a], and their sons: from the sons of the Kohathites: Heman the singer, son of Joel[b], son of Samuel.'
translation:
  language: pt
  text: 'E estes são os que estavam a postos[a], junto com seus filhos[b]: dos descendentes de Coate, Hemã, o cantor, filho de Joel, filho de Samuel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que permaneciam de pé”; no contexto, a expressão pode indicar os que estavam posicionados para o serviço.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “e seus filhos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: E estes são
  rationale: Preserva tanto a conjunção introdutória como a força demonstrativa da expressão hebraica, com naturalidade em português.
- source_word: הָעֹמְדִים
  choice: os que estavam a postos
  rationale: Mantém a imagem concreta de estar de pé ou em posição, ao mesmo tempo que sugere, sem explicitar em excesso, a função organizada desses cantores.
- source_word: וּבְנֵיהֶם
  choice: junto com seus filhos
  rationale: Exprime naturalmente em português a associação entre os homens mencionados e seus filhos; a forma mais literal é registrada em nota.
- source_word: מִבְּנֵי הַקְּהָתִי
  choice: dos descendentes de Coate
  rationale: Comunica com clareza a pertença à linhagem ou ao clã de Coate, evitando a construção pouco natural 'dos filhos do coatita'.
- source_word: הֵימָן
  choice: Hemã
  rationale: Forma tradicional e reconhecível do nome hebraico em português.
- source_word: הַמְשׁוֹרֵר
  choice: o cantor
  rationale: Traduz diretamente a função de cantar; 'músico' seria mais amplo que o termo hebraico.
- source_word: בֶּן יוֹאֵל בֶּן שְׁמוּאֵל
  choice: filho de Joel, filho de Samuel
  rationale: Preserva de modo direto a sequência genealógica hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas onomásticas correntes em traduções bíblicas lusófonas. A expressão “estavam a postos” conserva a imagem hebraica sem reduzir o sentido simplesmente a “serviam”.
