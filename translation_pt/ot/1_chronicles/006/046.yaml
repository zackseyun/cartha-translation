base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/046.yaml
  text: And to the sons of Kohath[a] who remained, from the families of the tribe, from the half-tribe, the half of Manasseh, ten cities were given by lot.
translation:
  language: pt
  text: E aos filhos de Coate que restavam foram dadas, por sorteio, dez cidades das famílias da tribo, da meia tribo — a metade de Manassés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico traz uma formulação repetitiva e difícil, literalmente: “da família da tribo, da metade da tribo, a metade de Manassés”. A expressão se refere à meia tribo de Manassés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי קְהָת
  choice: E aos filhos de Coate
  rationale: Mantém a construção genealógica hebraica e usa a forma portuguesa tradicional do nome, adequada ao contexto levítico e tribal.
- source_word: הַנּוֹתָרִים
  choice: que restavam
  rationale: O particípio identifica os coatitas ainda não contemplados nas distribuições anteriores; a oração relativa preserva esse valor sem sugerir sobrevivência a uma calamidade.
- source_word: מִמִּשְׁפַּחַת הַמַּטֶּה מִמַּחֲצִית מַטֵּה חֲצִי מְנַשֶּׁה
  choice: provenientes das famílias da meia tribo de Manassés
  rationale: Expressa em português claro a referência contextual à metade ocidental ou oriental da tribo de Manassés sem especificar qual delas, algo que o versículo não declara. A formulação hebraica incomum e repetitiva é documentada na nota.
- source_word: בַּגּוֹרָל
  choice: por sorteio
  rationale: Indica o procedimento de distribuição por sortes e é uma expressão corrente e inteligível em português moderno.
- source_word: עָרִים עָשֶׂר
  choice: dez cidades
  rationale: Conserva o substantivo e a quantidade do hebraico; a forma verbal passiva é suprida pelo contexto da lista de concessões.
