lexical_decisions:
- source_word: חוּקֹק
  choice: Hoquaque
  rationale: Nome próprio de lugar; transliterado de acordo com uma forma portuguesa legível. O texto massorético traz חוּקֹק, enquanto a forma paralela em Josué 21:31 é Helcate.
- source_word: מִגְרָשֶׁיהָ
  choice: suas pastagens
  rationale: Designa as terras abertas pertencentes à cidade, usadas especialmente para pastoreio; “pastagens” expressa de modo claro e concreto o sentido no contexto das cidades levíticas.
- source_word: רְחֹב
  choice: Reobe
  rationale: Nome próprio de lugar, transliterado em forma adaptada à leitura em português.
- source_word: וְאֶת
  choice: e ... com
  rationale: A conjunção e o marcador de objeto introduzem os itens coordenados da lista; em português, a relação entre cada cidade e suas terras é expressa naturalmente por “com”.
