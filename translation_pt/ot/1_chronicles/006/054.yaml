  yaml_path: translation/ot/1_chronicles/006/054.yaml
  text: and Aijalon with its pasturelands[a], and Gath-rimmon with its pasturelands.
translation:
  language: pt
  text: e Aijalom com suas pastagens[a], e Gate-Rimom com suas pastagens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “terras comuns” ou “terrenos ao redor”. O termo hebraico se refere às terras abertas pertencentes a uma cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיָּלוֹן
  choice: Aijalom
  rationale: Nome próprio de lugar transliterado segundo formas bíblicas correntes em português, sem traduzir seu possível sentido etimológico.
- source_word: מִגְרָשֶׁיהָ
  choice: suas pastagens
  rationale: O termo designa os terrenos abertos pertencentes à cidade, especialmente usados como pasto; esta escolha é clara e natural no contexto da lista de cidades levíticas.
- source_word: גַּת רִמּוֹן
  choice: Gate-Rimom
  rationale: Nome composto de lugar transliterado; o hífen deixa claro que se trata de um único topônimo.
- source_word: וְאֶת
  choice: e
  rationale: A conjunção e o marcador de objeto introduzem cada item da lista; em português, o marcador não é expresso, enquanto a conjunção é preservada.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com topônimos em formas de ampla legibilidade brasileira. Mantém a estrutura coordenada do hebraico e emprega “pastagens” para o terreno aberto associado às cidades levíticas.
