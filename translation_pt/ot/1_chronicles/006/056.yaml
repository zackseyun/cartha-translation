base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/056.yaml
  text: 'To the sons of Gershom[a], from the clan of the half-tribe of Manasseh: Golan in Bashan with its pasturelands, and Ashtaroth with its pasturelands.'
translation:
  language: pt
  text: 'Para os filhos de Gérson, do clã da meia tribo de Manassés: Golã, em Basã, com suas pastagens[a], e Astarote, com suas pastagens.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “terras comuns”; o termo hebraico se refere às áreas abertas pertencentes a uma cidade, muitas vezes usadas para pastoreio.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי גֵּרְשׁוֹם
  choice: Aos filhos de Gérson
  rationale: O לְ marca o destinatário da concessão. “Filhos de Gérson” preserva a expressão genealógica hebraica, que neste contexto abrange sua linhagem.
- source_word: מִמִּשְׁפַּחַת חֲצִי מַטֵּה מְנַשֶּׁה
  choice: do clã da meia tribo de Manassés
  rationale: מִשְׁפָּחָה designa aqui uma subdivisão tribal, portanto “clã” é mais preciso que “família”; “meia tribo” é a designação corrente da divisão territorial de Manassés.
- source_word: אֶת גּוֹלָן בַּבָּשָׁן
  choice: Golã, em Basã
  rationale: Golã é a cidade e Basã, a região; a vírgula favorece a leitura clara em português.
- source_word: מִגְרָשֶׁיהָ
  choice: suas pastagens
  rationale: מִגְרָשׁ indica as terras abertas pertencentes à cidade, frequentemente destinadas ao pastoreio. “Pastagens” comunica o uso principal, enquanto a nota preserva a extensão semântica.
- source_word: עַשְׁתָּרוֹת
  choice: Astarote
  rationale: Transliteração portuguesa reconhecível do topônimo hebraico.
- source_word: וְאֶת ... וְאֶת
  choice: com ... e ... com
  rationale: A formulação representa naturalmente em português a enumeração de cada cidade juntamente com as terras a ela vinculadas.
- source_word: '[verbo elíptico]'
  choice: deram
  rationale: O hebraico do versículo é uma continuação elíptica da lista de concessões. A inclusão de “deram” em português completa a oração sem alterar o sentido contextual.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas toponímicas usuais para leitores brasileiros. A estrutura de concessão foi explicitada com “deram” para formar uma oração natural, enquanto a relação tribal e a repetição das pastagens foram preservadas.
