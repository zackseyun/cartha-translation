    issue: A nota de rodapé afirma uma variante na lista paralela que não é sustentada pelo hebraico de Josué 21:28.
    rationale: A lista paralela também lê דָּבְרַת (Daberate/Daberath). Manter a nota introduziria uma informação textual incorreta.
  - severity: low
    issue: «Pastagens» pode ser entendido apenas como a vegetação ou o uso do solo, não como as áreas territoriais pertencentes à cidade.
    rationale: «Terras de pastagem» representa com mais precisão מִגְרָשֶׁיהָ, os terrenos adjacentes associados a cada cidade levítica.
