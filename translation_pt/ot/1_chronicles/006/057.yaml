base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/057.yaml
  text: 'And from the tribe of Issachar: Kedesh with its pasturelands[a], and Daberath with its pasturelands.'
translation:
  language: pt
  text: 'E da tribo de Issacar: Quedes e suas terras de pastagem, e Daberate e suas terras de pastagem.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  choice: E da tribo de
  rationale: 'מַטֶּה, no contexto da distribuição territorial, designa uma tribo. A conjunção e a preposição dão continuidade à lista: “E da tribo de”.'
- source_word: יִשָׂשכָר
  choice: Issacar
  rationale: Forma tradicional e amplamente reconhecida em português para o nome da tribo.
- source_word: קֶדֶשׁ
  choice: Quedes
  rationale: Transliteração tradicional em português do topônimo hebraico, sem acrescentar qualificadores ausentes do texto.
- source_word: מִגְרָשֶׁיהָ
  choice: suas pastagens
  rationale: מִגְרָשׁ designa os terrenos abertos ao redor de uma cidade levítica, usados especialmente para pastagem. “Pastagens” é claro e natural; o pronome se refere a cada cidade.
- source_word: דָּבְרַת
  choice: Daberate
  rationale: Forma portuguesa clara e próxima do topônimo hebraico; a variação do nome na lista paralela é preservada em nota.
