  yaml_path: translation/ot/1_chronicles/006/002.yaml
  text: 'These are the names of the sons of Gershom: Libni and Shimei[a].'
translation:
  language: pt
  text: 'Estes são os nomes dos filhos de Gershom: Libni e Simei.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome hebraico neste versículo é Gershom; em contextos genealógicos relacionados, algumas tradições usam Gershon.
