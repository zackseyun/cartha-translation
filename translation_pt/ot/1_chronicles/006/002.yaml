lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Estes são
  rationale: A expressão introduz a lista. Em português atual, a conjunção hebraica pode ficar implícita sem perda do valor apresentativo.
- source_word: שְׁמוֹת
  choice: os nomes
  rationale: Na construção שְׁמוֹת בְּנֵי, a forma idiomática em português é “os nomes dos filhos de”.
- source_word: בְּנֵי
  choice: dos filhos de
  rationale: Embora o termo possa significar descendentes em certos contextos genealógicos, aqui os dois nomes são apresentados como filhos imediatos de Gérson.
- source_word: גֵרְשׁוֹם
  choice: Gérson
  rationale: Nome próprio transliterado segundo a forma tradicional e amplamente reconhecida em português; o hebraico deste versículo traz a forma Gershom, não a variante Gershon.
- source_word: לִבְנִי
  choice: Libni
  rationale: Transliteração tradicional e transparente do nome próprio hebraico.
- source_word: וְשִׁמְעִי
  choice: e Simei
  rationale: A conjunção coordena o segundo nome; “Simei” é a forma tradicional em português.
