  yaml_path: translation/ot/1_chronicles/006/035.yaml
  text: 'And these were the sons of Aaron: Eleazar his son, Phinehas his son, Abishua his son.'
translation:
  language: pt
  text: 'E estes foram os filhos de Arão: Eleazar, seu filho; Fineias, seu filho; Abisua, seu filho.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: E estes foram
  rationale: A conjunção com o demonstrativo introduz a sequência genealógica. O pretérito é natural em português neste contexto narrativo, embora o hebraico possa ser vertido formalmente como “estes são”.
- source_word: בְּנֵי
  choice: os filhos de
  rationale: Embora o termo possa designar descendentes em genealogias, a sequência seguinte apresenta filiação direta; “filhos de” preserva essa formulação.
- source_word: אַהֲרֹן
  choice: Arão
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: בְּנוֹ
  choice: seu filho
  rationale: O substantivo com sufixo masculino singular indica relação filial direta; “seu filho” é uma tradução natural e exata.
- source_word: פִּינְחָס
  choice: Fineias
  rationale: Forma bíblica tradicional e amplamente reconhecida em português.
- source_word: אֲבִישׁוּעַ
  choice: Abisua
  rationale: Forma bíblica tradicional do nome em português, adequada ao hebraico.
