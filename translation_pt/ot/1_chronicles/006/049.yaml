lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: deram
  rationale: O qal wayyiqtol de נתן exprime aqui a ação narrativa simples de dar; “deram” é direto e natural.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a forma concreta do hebraico, em vez de substituí-la no texto principal pelo equivalente idiomático “os israelitas”.
- source_word: לַלְוִיִּם
  choice: aos levitas
  rationale: Traduz de modo preciso o complemento dativo e a designação tribal לְוִיִּם.
- source_word: הֶעָרִים
  choice: as cidades
  rationale: עָרִים pode indicar cidades ou povoados; “cidades” mantém a terminologia tradicional e contextual das cidades levíticas.
- source_word: מִגְרְשֵׁיהֶם
  choice: suas pastagens
  rationale: מִגְרָשׁ designa as áreas abertas ao redor das cidades, frequentemente destinadas ao pastoreio; “pastagens” comunica com clareza esse uso concreto.
