  text: And the sons of Israel gave to the Levites the cities and their pasturelands[a][b].
translation:
  language: pt
  text: E os filhos de Israel deram aos levitas as cidades e suas pastagens.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os israelitas”. O hebraico diz literalmente “os filhos de Israel”.'
