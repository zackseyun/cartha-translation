base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/034.yaml
  text: And Aaron and his sons were offering on the altar of burnt offering and on the altar of incense[a], for all the work of the Most Holy Place and to make atonement for Israel, according to all that Moses the servant of God had commanded.
translation:
  language: pt
  text: Arão e seus filhos faziam ofertas sobre o altar do holocausto e sobre o altar do incenso, para realizar todo o serviço do Lugar Santíssimo[a] e fazer expiação por Israel, conforme tudo o que Moisés, servo de Deus, havia ordenado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “das coisas santíssimas”; a expressão hebraica também pode ser traduzida tradicionalmente por “Santo dos Santos”.
    reason: Preservar a ambiguidade lexical entre o recinto interior do santuário e as coisas de santidade máxima.
lexical_decisions:
- source_word: מַקְטִירִים
  choice: faziam ofertas
  rationale: O particípio hifil de קטר descreve fazer subir em fumaça uma oferta ou incenso. A formulação abrange naturalmente tanto o altar do holocausto quanto o altar do incenso, sem acrescentar 'sacrifícios', termo que não está explícito.
- source_word: מִזְבַּח הָעֹלָה
  choice: o altar do holocausto
  rationale: Equivalente cultual consagrado e claro para o altar associado à oferta totalmente queimada.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: o altar do incenso
  rationale: Tradução direta, natural e reconhecível da expressão hebraica.
- source_word: לְכֹל מְלֶאכֶת
  choice: para realizar todo o serviço de
  rationale: מְלָאכָה designa aqui o trabalho ou serviço incumbido aos sacerdotes; 'realizar todo o serviço' é idiomático e preserva o sentido contextual.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: o Lugar Santíssimo
  rationale: No contexto do ministério sacerdotal e da expiação, a referência ao santuário interior é plausível; a ambiguidade entre lugar e coisas santíssimas é preservada em nota.
- source_word: וּלְכַפֵּר עַל יִשְׂרָאֵל
  choice: e fazer expiação por Israel
  rationale: '''Fazer expiação'' mantém o sentido sacrificial amplo de כפר sem impor uma teoria específica da expiação.'
- source_word: כְּכֹל אֲשֶׁר צִוָּה
  choice: conforme tudo o que ... havia ordenado
  rationale: A formulação expressa conformidade com a totalidade da ordem dada por Moisés.
- source_word: עֶבֶד הָאֱלֹהִים
  choice: servo de Deus
  rationale: Preserva de modo digno e natural o título formal aplicado a Moisés.
theological_decisions:
- issue: Referente de קֹדֶשׁ הַקֳּדָשִׁים
  choice: 'Referência de lugar: ''Lugar Santíssimo'''
  alternative: '''as coisas santíssimas'' ou, tradicionalmente, ''o Santo dos Santos'''
  rationale: A expressão hebraica pode indicar o recinto mais santo ou coisas de santidade máxima. O contexto favorece plausivelmente o lugar, mas a nota mantém aberta a alternativa.
- issue: Sentido de כפר
  choice: fazer expiação
  alternative: expiar
  rationale: A tradução conserva o termo sacrificial em sua amplitude e não o restringe a um modelo teológico particular.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Holocausto', 'altar do incenso', 'Lugar Santíssimo' e 'fazer expiação' mantêm a precisão do vocabulário cultual sem linguagem excessivamente arcaica.
