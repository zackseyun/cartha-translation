  source_fidelity: 'A tradução acompanha de perto o hebraico: preserva o destinatário (“aos filhos de Arão”), o verbo “deram”, a designação técnica “cidades de refúgio” e a enumeração das localidades. “Campos ao redor” comunica adequadamente מִגְרָשֶׁיהָ como terreno aberto vinculado à cidade, sem reduzi-lo necessariamente a pastagem. A redação tampouco tenta resolver ou harmonizar a construção textual em que “cidades de refúgio” introduz a lista.'
  naturalness: O português é moderno, claro e de registro apropriado. Os topônimos Hebrom, Libna, Jatir e Estemoa são formas portuguesas reconhecíveis. A enumeração flui naturalmente, e a ausência de repetição da nota no segundo emprego do mesmo termo não prejudica a leitura.
  terminology: “Cidades de refúgio” é a expressão estabelecida e fiel ao termo jurídico hebraico. “Filhos de Arão” conserva a formulação genealógica do texto sem impor interpretação adicional. A nota lexical apresenta de modo útil a alternativa “terras de uso comum” e esclarece o sentido de terrenos abertos pertencentes à cidade.
