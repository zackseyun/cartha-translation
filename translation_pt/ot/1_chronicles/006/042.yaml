  text: וְ/לִ/בְנֵ֣י אַהֲרֹ֗ן נָתְנוּ֙ אֶת עָרֵ֣י הַ/מִּקְלָ֔ט אֶת חֶבְר֥וֹן וְ/אֶת לִבְנָ֖ה וְ/אֶת מִגְרָשֶׁ֑י/הָ וְ/אֶת יַתִּ֥ר וְ/אֶֽת אֶשְׁתְּמֹ֖עַ וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/042.yaml
  text: 'And to the sons of Aaron they gave the cities of refuge: Hebron[a], and Libnah with its pasturelands, and Jattir, and Eshtemoa with its pasturelands.'
translation:
  language: pt
  text: 'E aos filhos de Arão deram as cidades de refúgio: Hebrom, Libna com seus campos ao redor[a], Jatir e Estemoa com seus campos ao redor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas terras de uso comum”; o hebraico se refere aos terrenos abertos pertencentes a uma cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי אַהֲרֹן
  choice: E aos filhos de Arão
  rationale: A preposição לְ marca os destinatários; “aos filhos de Arão” reproduz diretamente a expressão hebraica e é natural no contexto levítico.
- source_word: נָתְנוּ
  choice: deram
  rationale: O verbo נָתַן tem o sentido básico de “dar”. Embora “designaram” seja possível no contexto de repartição territorial, “deram” preserva melhor a formulação do hebraico.
- source_word: עָרֵי הַמִּקְלָט
  choice: as cidades de refúgio
  rationale: Expressão consagrada e clara para as cidades legalmente destinadas a acolher quem buscava proteção.
- source_word: אֶת חֶבְרוֹן
  choice: Hebrom
  rationale: Forma portuguesa tradicional e amplamente reconhecida do topônimo.
- source_word: וְאֶת לִבְנָה
  choice: Libna
  rationale: Transliteração portuguesa corrente do topônimo hebraico.
- source_word: מִגְרָשֶׁיהָ
  choice: com seus campos ao redor
  rationale: מִגְרָשׁ designa o terreno aberto pertencente à cidade, situado ao redor dela. A expressão evita restringir indevidamente o uso desses terrenos apenas a pastagem; o sufixo feminino singular remete à cidade imediatamente anterior.
- source_word: וְאֶת יַתִּר
  choice: Jatir
  rationale: Transliteração portuguesa corrente do topônimo hebraico.
- source_word: וְאֶת אֶשְׁתְּמֹעַ
  choice: e Estemoa
  rationale: Transliteração portuguesa clara e reconhecível do topônimo hebraico.
- source_word: וְאֶת מִגְרָשֶׁיהָ
  choice: com seus campos ao redor
  rationale: A repetição do termo é traduzida de modo uniforme; o sufixo se refere a Estemoa.
theological_decisions:
- issue: Relação entre “as cidades de refúgio” e a lista que começa com Hebrom
  choice: Manter a formulação plural do hebraico e introduzir a lista com dois-pontos
  alternative: Explicitar que apenas Hebrom era cidade de refúgio
  rationale: O texto hebraico traz literalmente “as cidades de refúgio, Hebrom” antes das demais cidades. A tradução preserva essa forma e não acrescenta uma explicação que o versículo não oferece.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas toponímicas usuais em português. A enumeração recebeu pontuação clara sem alterar a estrutura do hebraico.
