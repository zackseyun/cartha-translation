base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/024.yaml
  text: 'And his brother Asaph stood at his right hand: Asaph son of Berechiah[a], son of Shimea.'
translation:
  language: pt
  text: 'E seu irmão Asafe estava à sua direita[a]: Asafe, filho de Berequias, filho de Simeia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “sobre a sua mão direita”, expressão que indica a posição ao lado direito de alguém.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָחִיו
  choice: E seu irmão
  rationale: Mantém a conjunção simples e o sentido direto de אָח com sufixo de terceira pessoa masculina singular. Embora אָח possa, em certos contextos, designar um parente ou companheiro, aqui não há razão suficiente para abandonar o sentido comum “irmão”.
- source_word: אָסָף
  choice: Asafe
  rationale: Forma consagrada e inteligível em português para o nome próprio hebraico; as duas ocorrências foram preservadas.
- source_word: הָעֹמֵד
  choice: ficava
  rationale: O particípio de עמד descreve a posição ocupada por Asafe. “Ficava” soa natural em português para uma disposição estável de serviço, sem perder o valor posicional do hebraico.
- source_word: עַל יְמִינוֹ
  choice: à sua direita
  rationale: Expressão portuguesa natural para a posição ao lado direito de alguém; conserva a referência espacial sem reproduzir de modo artificial o hebraísmo “sobre sua mão direita”.
- source_word: בֶּן
  choice: filho de
  rationale: Mantém a fórmula genealógica hebraica nas duas ocorrências.
- source_word: בֶּרֶכְיָהוּ
  choice: Berequias
  rationale: Forma tradicional portuguesa do nome hebraico, com grafia natural para leitores de português.
- source_word: שִׁמְעָא
  choice: Simeia
  rationale: Transliteração portuguesa tradicional e legível do nome hebraico.
