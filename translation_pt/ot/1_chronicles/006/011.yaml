  yaml_path: translation/ot/1_chronicles/006/011.yaml
  text: Elkanah his son[a], Elkanah his son, Zophai his son, and Nahath his son.
translation:
  language: pt
  text: Elcana, seu filho; Elcana, seu filho; Zofai[a], seu filho; e Naate, seu filho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Zufai”, conforme outra tradição de vocalização e transliteração do nome צוֹפַי.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלְקָנָה
  choice: Elcana
  rationale: Nome próprio vertido segundo a forma tradicional e amplamente reconhecível em português; a repetição foi preservada porque ocorre no texto hebraico.
- source_word: בְּנוֹ / בנו
  choice: seu filho
  rationale: O substantivo com sufixo masculino singular indica relação filial; esta é a formulação genealógica natural em português, repetida para conservar a cadência do hebraico.
- source_word: צוֹפַי
  choice: Zofai
  rationale: Transliteração portuguesa da forma vocalizada massorética; a alternativa “Zufai” é registrada em nota por refletir outra tradição de vocalização/transliteração.
- source_word: וְ
  choice: e
  rationale: Conjunção simples que liga o último membro da sequência genealógica.
- source_word: נַחַת
  choice: Naate
  rationale: Forma portuguesa tradicional do nome próprio hebraico, adequada à leitura corrente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas onomásticas familiares ao leitor lusófono. Os pontos e vírgulas distinguem os elos da sequência e preservam sua cadência genealógica. O marcador da nota foi colocado junto de “Zofai”, o nome ao qual a variante se refere.
