base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/055.yaml
  text: 'And from the half-tribe of Manasseh: Aner with its pasturelands[a], and Bileam with its pasturelands, for the clan of the remaining sons of Kohath.'
translation:
  language: pt
  text: E, da meia tribo de Manassés, Aner com suas pastagens e Bileão[a] com suas pastagens, para o clã dos filhos restantes de Coate.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico traz Bileão; o trecho paralelo em Josué 21:25 traz Ibleão.
    reason: textual_variant
lexical_decisions:
- source_word: וּמִמַּחֲצִית מַטֵּה מְנַשֶּׁה
  choice: E, da meia tribo de Manassés
  rationale: מַחֲצִית significa “metade”, e מַטֶּה, neste contexto de distribuição territorial, significa “tribo”. “Meia tribo” é a expressão portuguesa corrente e concisa.
- source_word: אֶת עָנֵר
  choice: Aner
  rationale: Nome de lugar transliterado segundo a forma usual em português.
- source_word: מִגְרָשֶׁיהָ
  choice: com suas pastagens
  rationale: מִגְרָשׁ designa os terrenos abertos ligados a uma cidade, especialmente os destinados ao uso das cidades levíticas; “pastagens” comunica naturalmente essa função.
- source_word: בִּלְעָם
  choice: Bileã
  rationale: A tradução segue o texto consonantal hebraico deste versículo e adapta o nome à forma portuguesa; a variante do paralelo em Josué 21:25 é registrada em nota.
- source_word: לְמִשְׁפַּחַת לִבְנֵי קְהָת הַנּוֹתָרִים
  choice: para o clã dos demais filhos de Coate
  rationale: O singular מִשְׁפַּחַת indica aqui um grupo familiar ou clã. הַנּוֹתָרִים refere-se aos coatitas que ainda não haviam sido contemplados na distribuição; “demais” expressa isso com naturalidade.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas de nomes bíblicos legíveis no Brasil. A estrutura de lista do hebraico foi preservada sem rigidez excessiva; o marcador da nota foi colocado diretamente após “Bileã”, onde se encontra a variante textual.
