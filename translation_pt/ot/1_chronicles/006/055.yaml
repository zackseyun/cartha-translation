  naturalness: A construção de lista é natural em português moderno. «Pastagens» é uma boa solução clara para os terrenos abertos associados às cidades. A revisão mantém a fluidez, com formas de nomes mais estabelecidas no uso bíblico português.
  terminology: «Meia tribo», «clã», «Coate» e «pastagens» são adequados. «Bileão» e «Ibleão» correspondem às formas portuguesas bíblicas mais correntes para Bileam e Ibleam e tornam consistente o texto e a nota.
