  text: Tahath his son[a], Uriel his son, Uzziah his son, and Shaul his son.
translation:
  language: pt
  text: Taate, seu filho; Uriel, seu filho; Uzias, seu filho; e Shaul[a], seu filho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Saul”, forma tradicional do nome em português.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: Taate
  rationale: Nome próprio transliterado segundo uma forma natural em português, sem traduzir seu possível significado.
- source_word: בְּנוֹ
  choice: seu filho
  rationale: Reproduz a fórmula genealógica hebraica. Embora בֵּן possa, em certos contextos, designar um descendente mais remoto, o sentido normal aqui é “filho”, sem explicitar uma possível compressão genealógica.
- source_word: אוּרִיאֵל
  choice: Uriel
  rationale: Transliteração convencional e clara do nome próprio em português.
- source_word: עֻזִּיָּה
  choice: Uzias
  rationale: Forma portuguesa tradicional e amplamente reconhecível do nome hebraico.
- source_word: וְשָׁאוּל
  choice: e Shaul
  rationale: Mantém de perto a vocalização hebraica do nome e traduz a conjunção וְ por “e”; a forma portuguesa tradicional “Saul” é registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível. A repetição de “seu filho” preserva a estrutura formular do hebraico, enquanto os pontos e vírgulas tornam clara a sequência genealógica. O marcador da nota foi colocado junto a “Shaul”, o termo ao qual a variante se refere.
