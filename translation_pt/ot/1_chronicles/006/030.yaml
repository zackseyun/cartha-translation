lexical_decisions:
- source_word: בֶּן
  choice: filho de
  rationale: Na fórmula genealógica, בֶּן indica filiação imediata ou pertencimento à linhagem. A repetição de «filho de» preserva a estrutura concisa do hebraico e é natural em listas genealógicas em português.
- source_word: חֲשַׁבְיָה
  choice: Hasabias
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico, adequada a uma tradução bíblica de leitura ampla.
- source_word: אֲמַצְיָה
  choice: Amazias
  rationale: Forma portuguesa tradicional do nome hebraico, transliterada de modo reconhecível para leitores modernos.
- source_word: חִלְקִיָּה
  choice: Hilquias
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
