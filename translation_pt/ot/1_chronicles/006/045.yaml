base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/045.yaml
  text: 'and from the tribe of Benjamin: Geba with its pasturelands[a], Alemeth with its pasturelands, and Anathoth with its pasturelands—all their cities were thirteen cities according to their families.'
translation:
  language: pt
  text: 'e da tribo de Benjamim: Geba com suas pastagens, Alemete[a] com suas pastagens e Anatote com suas pastagens. Ao todo, suas cidades eram treze, segundo as suas famílias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz “Alemete”; a lista paralela em Josué 21:18 traz “Almom”.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִמַּטֵּה בִנְיָמִן
  choice: e, da tribo de Benjamim
  rationale: מַטֶּה designa a tribo neste contexto de distribuição territorial; a conjunção e a preposição dão continuidade à lista anterior.
- source_word: גֶּבַע
  choice: Geba
  rationale: Nome próprio de lugar, transliterado conforme o uso bíblico corrente em português.
- source_word: מִגְרָשֶׁיהָ
  choice: suas pastagens
  rationale: מִגְרָשׁ denota as terras abertas ao redor da cidade, especialmente destinadas ao pastoreio; “pastagens” é claro e natural em português.
- source_word: עָלֶמֶת
  choice: Alemete
  rationale: Reproduz o nome presente no texto hebraico de Crônicas, sem substituí-lo pela forma da lista paralela em Josué.
- source_word: עֲנָתוֹת
  choice: Anatote
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio.
- source_word: כָּל עָרֵיהֶם שְׁלֹשׁ עֶשְׂרֵה עִיר
  choice: Ao todo, eram treze cidades
  rationale: Expressa naturalmente em português a fórmula hebraica de totalização, preservando o número declarado pelo texto.
- source_word: בְּמִשְׁפְּחוֹתֵיהֶם
  choice: distribuídas entre suas famílias
  rationale: No contexto, a expressão indica a repartição das cidades segundo os grupos familiares; a formulação torna explícita essa relação sem especificar além do hebraico.
