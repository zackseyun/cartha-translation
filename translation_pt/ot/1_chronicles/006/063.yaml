base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/063.yaml
  text: 'And beyond the Jordan at Jericho[a], east of the Jordan, from the tribe of Reuben: Bezer in the wilderness, with its pasturelands, and Jahzah, with its pasturelands.'
translation:
  language: pt
  text: 'E, do outro lado do Jordão, em frente de Jericó, a leste do Jordão, da tribo de Rúben: Bezer, no deserto, com suas terras de pastagem; e Jaza[a], com suas terras de pastagem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também chamado Jaaz em algumas traduções.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵבֶר לְיַרְדֵּן יְרֵחוֹ
  choice: E, do outro lado do Jordão, na altura de Jericó
  rationale: Expressa de modo natural a localização além do Jordão, no trecho correspondente a Jericó, sem transformar a referência geográfica em uma afirmação de que Jericó ficava a leste do rio.
- source_word: לְמִזְרַח הַיַּרְדֵּן
  choice: a leste do Jordão
  rationale: מִזְרָח indica a direção leste; a formulação é clara e idiomática em português.
- source_word: מִמַּטֵּה רְאוּבֵן
  choice: da tribo de Rúben
  rationale: Neste contexto de distribuição territorial, מַטֶּה designa uma tribo.
- source_word: בֶּצֶר
  choice: Beser
  rationale: Transliteração portuguesa legível do nome geográfico hebraico.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: מִדְבָּר designa uma região erma; “deserto” é corrente e adequado ao contexto geográfico.
- source_word: מִגְרָשֶׁיהָ
  choice: suas terras de pastagem
  rationale: Nas listas de cidades levíticas, מִגְרָשׁ refere-se às áreas abertas ao redor da cidade, especialmente destinadas aos rebanhos.
- source_word: יַהְצָה
  choice: Jaza
  rationale: Forma portuguesa simples para o topônimo; a nota registra outra forma tradicional decorrente da transliteração.
