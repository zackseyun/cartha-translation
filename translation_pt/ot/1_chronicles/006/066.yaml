  text: and Heshbon with its pasturelands[a], and Jazer with its pasturelands.
translation:
  language: pt
  text: e Hesbom com suas pastagens[a], e Jazer com suas pastagens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “terras de uso comum” ou “terras abertas ao redor”; o termo hebraico se refere à área aberta pertencente a uma cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶשְׁבּוֹן
  choice: Hesbom
  rationale: Nome próprio de lugar na forma tradicional e amplamente reconhecida em português bíblico.
- source_word: מִגְרָשֶׁיהָ
  choice: suas pastagens
  rationale: No contexto das cidades levíticas, מִגְרָשׁ designa a área aberta pertencente à cidade, usada especialmente como pastagem. O sufixo feminino singular refere-se, em cada ocorrência, à respectiva cidade.
- source_word: יַעְזֵיר
  choice: Jazer
  rationale: Transliteração portuguesa convencional deste nome próprio de lugar.
- source_word: וְאֶת
  choice: e
  rationale: A conjunção repetida organiza a enumeração; o marcador hebraico de objeto direto não precisa de representação independente em português.
