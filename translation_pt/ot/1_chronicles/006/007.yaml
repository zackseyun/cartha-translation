lexical_decisions:
- source_word: בְּנֵי
  choice: Os filhos de
  rationale: Mantém a fórmula genealógica hebraica no plural construto. Embora genealogias possam omitir gerações, a repetição de בְּנוֹ favorece a linguagem filial direta.
- source_word: קְהָת
  choice: Coate
  rationale: Forma tradicional e amplamente reconhecida do nome bíblico em português.
- source_word: עַמִּינָדָב
  choice: Aminadabe
  rationale: Translitera o nome conforme a convenção bíblica portuguesa e representa o texto hebraico desta passagem, apesar da diferença nas genealogias paralelas.
- source_word: בְּנוֹ
  choice: seu filho
  rationale: Reproduz diretamente a relação filial expressa pelo substantivo singular com sufixo masculino, preservando a estrutura encadeada da genealogia.
- source_word: קֹרַח
  choice: Corá
  rationale: Forma tradicional e corrente do nome bíblico em português.
- source_word: אַסִּיר
  choice: Assir
  rationale: Transliteração tradicional do nome próprio; não se traduz aqui seu possível sentido lexical.
