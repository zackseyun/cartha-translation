revisions:
- from: Por sorteio, deram estas cidades das tribos dos filhos de Judá, dos filhos de Simeão e dos filhos de Benjamim, cidades estas chamadas pelos seus nomes.[a]
  to: Por sorteio, atribuíram estas cidades da tribo dos filhos de Judá, da tribo dos filhos de Simeão e da tribo dos filhos de Benjamim, cidades que chamaram pelos nomes.[a]
  rationale: A revisão preserva a distribuição por sorteio, a procedência de cada uma das três tribos e a construção verbal da fórmula hebraica final. A nota explica a função formulaica da expressão sem substituir no texto a imagem verbal do original.
  reviewer_model: gpt-5.6-terra
