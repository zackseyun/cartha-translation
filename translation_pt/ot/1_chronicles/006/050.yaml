base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/050.yaml
  text: They assigned by lot from the tribe of the sons of Judah[a], and from the tribe of the sons of Simeon, and from the tribe of the sons of Benjamin, these cities, which they called by name.
translation:
  language: pt
  text: Por sorteio, atribuíram estas cidades da tribo dos filhos de Judá, da tribo dos filhos de Simeão e da tribo dos filhos de Benjamim, cidades que chamaram pelos nomes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais dinâmico: «estas cidades, alistadas pelo nome». O hebraico diz literalmente «que chamaram pelos nomes», fórmula que introduz a lista de cidades que segue.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: deram
  rationale: Preserva o sentido básico de נתן e, com «por sorteio», comunica naturalmente a concessão das cidades aos levitas.
- source_word: בַגּוֹרָל
  choice: Por sorteio
  rationale: Expressa o meio de distribuição indicado por גּוֹרָל em português corrente e claro.
- source_word: מִמַּטֵּה בְנֵי יְהוּדָה ... בְנֵי שִׁמְעוֹן ... בְּנֵי בִנְיָמִן
  choice: das tribos dos filhos de Judá, dos filhos de Simeão e dos filhos de Benjamim
  rationale: Traduz מַטֶּה por «tribo» e mantém a linguagem genealógico-tribal «filhos de», evitando repetir «tribo» onde a coordenação hebraica permite uma formulação portuguesa mais fluida.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: estas cidades
  rationale: Equivalência direta e natural do substantivo com o demonstrativo.
- source_word: אֲשֶׁר יִקְרְאוּ אֶתְהֶם בְּשֵׁמוֹת
  choice: cidades estas chamadas pelos seus nomes
  rationale: Conserva a ideia verbal de קרא e a fórmula hebraica com «nomes», embora a expressão introduza funcionalmente a lista nominal que segue.
