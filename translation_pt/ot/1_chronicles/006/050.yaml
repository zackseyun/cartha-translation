review_pass:
  verdict: revise
  source_fidelity: O sentido geral está preservado, mas a redação atual reduz as três ocorrências de «tribo» do hebraico a uma só e transforma a oração final ativa («que eles chamaram») em passiva («chamadas»). A revisão restabelece esses elementos sem tornar o português excessivamente literal.
  naturalness: «Deram estas cidades das tribos» pode sugerir que as cidades pertenciam às tribos, em vez de que foram atribuídas a partir delas. «Atribuíram ... da tribo ...» explicita melhor a relação distributiva. «Pelos seus nomes» é pouco natural e o possessivo é desnecessário.
  terminology: «Tribo», «filhos de Judá/Simeão/Benjamim», «cidades» e «por sorteio» são adequados. «Atribuíram» comunica naturalmente, neste contexto administrativo, o valor de נתן.
  issues:
  - severity: medium
    issue: A expressão «das tribos dos filhos de Judá, dos filhos de Simeão e dos filhos de Benjamim» não repete «tribo» para Simeão e Benjamim.
    rationale: O hebraico repete מִמַּטֵּה («da tribo de») diante de cada um dos três grupos. Em português, a repetição é clara e natural neste registro.
  - severity: medium
    issue: «cidades estas chamadas pelos seus nomes» altera a voz da oração final e soa pouco idiomático.
    rationale: O hebraico traz um verbo ativo com sujeito indeterminado/contextual («que eles chamaram pelos nomes»). A fórmula é incomum, mas deve ser conservada no texto, com esclarecimento em nota.
  - severity: low
    issue: «deram estas cidades das tribos» é sintaticamente ambíguo.
    rationale: Pode ser lido como uma caracterização das cidades, e não como indicação das tribos de onde procedeu a atribuição.
  revised_text: Por sorteio, atribuíram estas cidades da tribo dos filhos de Judá, da tribo dos filhos de Simeão e da tribo dos filhos de Benjamim, cidades que chamaram pelos nomes.[a]
  revised_footnotes:
  - marker: a
    text: 'Ou, de modo mais dinâmico: «estas cidades, alistadas pelo nome». O hebraico diz literalmente «que chamaram pelos nomes», fórmula que introduz a lista de cidades que segue.'
    reason: lexical_alternative
  revision_rationale: A revisão preserva a distribuição por sorteio, a procedência de cada uma das três tribos e a construção verbal da fórmula hebraica final. A nota explica a função formulaica da expressão sem substituir no texto a imagem verbal do original.
