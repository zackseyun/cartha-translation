  yaml_path: translation/ot/1_chronicles/006/010.yaml
  text: 'And the sons of Elkanah: Amasai and Ahimoth[a].'
translation:
  language: pt
  text: 'E os filhos de Elcana: Amasai e Aimote.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: E os filhos de
  rationale: A conjunção וּ foi mantida como “E” para preservar a sequência genealógica; בְנֵי, em estado construto com o nome seguinte, significa naturalmente “os filhos de”.
- source_word: אֶלְקָנָה
  choice: Elcana
  rationale: Nome próprio transliterado segundo a forma consagrada e facilmente reconhecível em português.
- source_word: עֲמָשַׂי
  choice: Amasai
  rationale: Transliteração direta e corrente em português, sem necessidade de registrar uma variante meramente baseada em convenções ortográficas inglesas.
- source_word: וַ/אֲחִימוֹת
  choice: e Aimote
  rationale: A conjunção prefixada foi traduzida por “e”; o nome próprio foi vertido na forma portuguesa Aimote, refletindo a pronúncia hebraica de modo legível.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura concisa apropriada a uma genealogia. Os nomes seguem formas portuguesas legíveis; não se incluiu a nota inglesa sobre “Amassai”, pois essa variante decorre especificamente de convenções ortográficas do inglês.
