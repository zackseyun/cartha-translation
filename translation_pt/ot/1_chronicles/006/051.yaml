  yaml_path: translation/ot/1_chronicles/006/051.yaml
  text: And from the families of the sons of Kohath[b][a], the cities of their territory were from the tribe of Ephraim.
translation:
  language: pt
  text: E, dentre as famílias dos filhos de Coate[a], as cidades de seu território[b] eram da tribo de Efraim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos clãs dos filhos de Coate”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “as cidades de sua região delimitada” ou “suas cidades fronteiriças”. A palavra hebraica pode significar “limite”, “fronteira” ou “território”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמִּשְׁפְּחוֹת
  choice: E algumas das famílias
  rationale: 'A preposição מִן tem valor partitivo: trata-se de uma parte das famílias ou clãs. Em português, “algumas das famílias” expressa esse sentido com clareza, enquanto “E das famílias” deixaria a frase truncada.'
- source_word: בְּנֵי קְהָת
  choice: dos filhos de Coate
  rationale: Mantém a forma genealógica hebraica, que neste contexto abrange os descendentes de Coate.
- source_word: וַיְהִי
  choice: receberam
  rationale: O hebraico emprega הָיָה numa construção breve para indicar que as cidades lhes couberam. “Receberam” torna explícita em português a ideia de atribuição presente no contexto, sem alterar os beneficiários.
- source_word: עָרֵי גְבוּלָם
  choice: cidades em seu território
  rationale: גְּבוּל pode designar limite, região delimitada ou território. Aqui se refere à área territorial da qual foram separadas as cidades levíticas.
- source_word: מִמַּטֵּה אֶפְרָיִם
  choice: da tribo de Efraim
  rationale: Em contextos de organização e distribuição territorial, מַטֶּה significa “tribo”; a preposição indica de que tribo procediam as cidades.
