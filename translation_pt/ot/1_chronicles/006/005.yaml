  rationale: Nome próprio, transliterado segundo a forma bíblica corrente em português.
- source_word: בְנוֹ
  choice: seu filho
  rationale: O substantivo com sufixo masculino singular indica filiação direta; “seu filho” é claro e natural em português.
- source_word: יַחַת
  choice: Jaate
  rationale: Nome próprio, apresentado em forma bíblica portuguesa reconhecível.
- source_word: זִמָּה
  choice: Zima
  rationale: Aqui o termo funciona como nome próprio e, portanto, é transliterado, sem importar o sentido do substantivo comum relacionado.
