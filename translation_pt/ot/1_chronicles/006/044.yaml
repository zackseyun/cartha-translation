lexical_decisions:
- source_word: עָשָׁן
  choice: Asã
  rationale: Nome próprio de lugar transliterado segundo uma forma natural em português; o texto massorético de Crônicas traz עָשָׁן, enquanto a variante «Aim» é registrada em nota.
- source_word: מִגְרָשֶׁיהָ
  choice: suas pastagens
  rationale: O termo designa as áreas abertas pertencentes à cidade, usadas especialmente como pasto no contexto das cidades levíticas; o possessivo feminino singular hebraico é expresso naturalmente por «suas».
- source_word: בֵּית שֶׁמֶשׁ
  choice: Bete-Semes
  rationale: Topônimo transliterado, e não traduzido literalmente; a grafia é clara e tradicionalmente reconhecível em português.
- source_word: וְאֶת
  choice: e
  rationale: A conjunção coordena os itens da lista; o marcador hebraico de objeto direto não requer equivalente explícito em português.
