  text: Asã, com suas terras de pastagem[a], e Bete-Semes, com suas terras de pastagem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns testemunhos paralelos e traduções trazem «Ain» em vez de «Asã» neste ponto; o Texto Massorético de Crônicas traz «Asã».
