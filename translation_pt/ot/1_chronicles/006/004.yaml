  text: 'The sons of Merari: Mahli and Mushi[b][a]. These were the clans of the Levites according to their fathers’ houses.'
translation:
  language: pt
  text: 'Os filhos de Merari: Mali e Musi. Estas eram as famílias dos levitas, segundo as casas de seus pais.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “segundo seus pais”; neste contexto genealógico, a expressão indica a organização por casas paternas ou linhagens ancestrais.'
