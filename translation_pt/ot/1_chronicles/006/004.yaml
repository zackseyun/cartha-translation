lexical_decisions:
- source_word: בְּנֵי
  choice: Os filhos de
  rationale: O plural em estado construto introduz os filhos nomeados de Merari; a formulação é natural e tradicional em genealogias.
- source_word: מְרָרִי
  choice: Merari
  rationale: Nome próprio transliterado segundo a forma portuguesa consagrada.
- source_word: מַחְלִי
  choice: Mali
  rationale: Nome próprio vertido na forma portuguesa bíblica usual.
- source_word: וּמֻשִׁי
  choice: e Musi
  rationale: Nome próprio com a conjunção coordenativa, na forma portuguesa usual.
- source_word: וְאֵלֶּה
  choice: Estas eram
  rationale: O demonstrativo plural introduz um resumo genealógico; o imperfeito português fornece uma ligação natural com a enumeração passada, sem dar destaque indevido à conjunção hebraica.
- source_word: מִשְׁפְּחוֹת
  choice: as famílias
  rationale: No contexto genealógico, designa grupos de parentesco. “Famílias” é claro em português e evita o tom sociológico ou tribal mais estreito de “clãs”.
- source_word: הַלֵּוִי
  choice: dos levitas
  rationale: Embora a forma hebraica seja singular, o gentílico com artigo tem sentido coletivo no resumo genealógico; o plural português expressa naturalmente o grupo descendente de Levi.
- source_word: לַאֲבוֹתֵיהֶם
  choice: segundo as casas de seus pais
  rationale: O hebraico diz literalmente “segundo seus pais”; “casas” explicita com moderação a classificação genealógica por linhagens paternas, conforme o uso contextual.
