  text: וּ/בְנֵ֧י מְרָרִ֛י אֲחֵי/הֶ֖ם עַֽל הַ/שְּׂמֹ֑אול אֵיתָן֙ בֶּן קִישִׁ֔י בֶּן עַבְדִּ֖י בֶּן מַלּֽוּךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/029.yaml
  text: 'And the sons of Merari[a], their brothers, were on the left: Ethan son of Kishi, son of Abdi, son of Malluch.'
translation:
  language: pt
  text: 'E os filhos de Merari, irmãos deles[a], estavam à esquerda: Etã, filho de Quisi, filho de Abdi, filho de Maluque.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «parentes deles». O hebraico «irmãos» pode referir-se mais amplamente a membros do mesmo clã ou grupo aparentado em contextos genealógicos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי מְרָרִי
  choice: E os filhos de Merari
  rationale: Preserva a forma genealógica hebraica; neste contexto, “filhos” também pode abranger os descendentes ou o clã de Merari.
- source_word: אֲחֵיהֶם
  choice: irmãos deles
  rationale: Mantém o sentido básico de אחים e a linguagem familiar do hebraico; no contexto levítico, refere-se aos grupos aparentados mencionados anteriormente.
- source_word: עַל הַשְּׂמֹאול
  choice: ficavam à esquerda
  rationale: A expressão significa literalmente “à esquerda”. O verbo “ficavam” explicita com naturalidade a construção elíptica hebraica e indica a posição designada no contexto.
- source_word: אֵיתָן
  choice: Etã
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico.
- source_word: בֶּן
  choice: filho de
  rationale: Reproduz naturalmente a fórmula genealógica repetida no hebraico, sem enfraquecê-la para “descendente de”.
- source_word: קִישִׁי
  choice: Quisi
  rationale: Transliteração adaptada à ortografia e à pronúncia correntes em português bíblico.
- source_word: עַבְדִּי
  choice: Abdi
  rationale: Transliteração direta e corrente em português.
- source_word: מַלּוּךְ
  choice: Maluque
  rationale: Transliteração adaptada à ortografia portuguesa, tornando explícita a consoante final hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e claro, com estrutura genealógica preservada. A tradução mantém “irmãos” sem nota, pois o sentido ampliado de parentes ou membros de grupos levíticos aparentados é natural no contexto. “Ficavam” supre a elipse verbal do hebraico sem acrescentar uma interpretação específica.
