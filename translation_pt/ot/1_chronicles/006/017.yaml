revisions:
- from: Eles ministravam diante do tabernáculo, a tenda do encontro, com cânticos[a], até Salomão construir a casa de Yahweh[b] em Jerusalém; e ocupavam seus postos no serviço segundo a norma estabelecida para eles[c].
  to: Eles ministravam diante do tabernáculo, a tenda do encontro, com canto[a], até Salomão construir a casa de Yahweh[b] em Jerusalém; e ocupavam seus postos segundo a norma estabelecida para eles[c], no serviço.
  rationale: A revisão limita-se a aproximar “com canto” do singular coletivo hebraico e a reposicionar a locução que traduz כְּמִשְׁפָּטָם. Mantêm-se a ambiguidade funcional de עַל עֲבוֹדָתָם em “no serviço”, a designação dupla do santuário e a tradução literal de “casa de Yahweh”.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T22:52:23Z'
