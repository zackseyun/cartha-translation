  text: וַ/יִּהְי֨וּ מְשָׁרְתִ֜ים לִ/פְנֵ֨י מִשְׁכַּ֤ן אֹֽהֶל מוֹעֵד֙ בַּ/שִּׁ֔יר עַד בְּנ֧וֹת שְׁלֹמֹ֛ה אֶת בֵּ֥ית יְהוָ֖ה בִּ/ירוּשָׁלִָ֑ם וַ/יַּעַמְד֥וּ כְ/מִשְׁפָּטָ֖/ם עַל עֲבוֹדָתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/017.yaml
  text: They were ministering before the tabernacle[a], the tent of meeting, with song until Solomon built the house of Yahweh in Jerusalem[c][b], and they stood according to their ordinance over their service.
translation:
  language: pt
  text: Eles ministravam diante do tabernáculo, a tenda do encontro, com canto[a], até Salomão construir a casa de Yahweh[b] em Jerusalém; e ocupavam seus postos segundo a norma estabelecida para eles[c], no serviço.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em canto”, “cantando” ou “por meio do canto”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, o templo de Yahweh.
    reason: referent_clarification
  - marker: c
    text: Ou “segundo a ordem prescrita para eles” ou “conforme o costume deles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשָׁרְתִים
  choice: ministravam
  rationale: O particípio descreve o desempenho contínuo de funções ligadas ao culto; “ministravam” é natural nesse contexto e mais específico que “serviam”.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Expressa a relação espacial e cultual do serviço realizado perante o santuário.
- source_word: מִשְׁכַּן אֹהֶל מוֹעֵד
  choice: o tabernáculo, a tenda do encontro
  rationale: Mantém os dois termos hebraicos, entendendo “a tenda do encontro” como explicação do “tabernáculo”, sem reduzi-los a um só termo.
- source_word: בַּשִּׁיר
  choice: com cânticos
  rationale: Indica o meio ou modo musical do ministério. O plural coletivo “cânticos” soa natural em português, embora o hebraico empregue o singular.
- source_word: עַד בְּנוֹת שְׁלֹמֹה
  choice: até Salomão construir
  rationale: O infinitivo construto após עַד marca o limite temporal; a oração verbal é clara e fiel em português.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Preserva a palavra hebraica “casa” em vez de explicitar “templo” no texto principal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: וַיַּעַמְדוּ
  choice: ocupavam seus postos
  rationale: Comunica o sentido contextual de permanecer ou tomar posição no dever designado, evitando o português pouco natural “ficavam de pé”.
- source_word: כְמִשְׁפָּטָם
  choice: segundo a norma estabelecida para eles
  rationale: No contexto administrativo e cultual, מִשְׁפָּט indica a regra, disposição ou ordem prescrita para o serviço.
- source_word: עַל עֲבוֹדָתָם
  choice: no serviço
  rationale: A expressão relaciona a posição ocupada às funções atribuídas; “no serviço” transmite essa relação de modo idiomático.
theological_decisions:
- issue: Forma portuguesa do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico apresenta o nome pessoal do Deus de Israel. “Yahweh” preserva-o por transliteração sem substituir o nome por um título.
- issue: Identificação da “casa de Yahweh”
  choice: Manter “casa” no texto principal
  alternative: Traduzir diretamente como “templo”
  rationale: Embora o referente seja o templo construído por Salomão, o hebraico diz literalmente “casa”; a nota esclarece o referente sem apagar a formulação original.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a terminologia cultual (“ministravam”, “tabernáculo”) e torna idiomática a expressão hebraica relativa a ocupar o posto de serviço. Os marcadores foram posicionados junto às palavras que cada nota efetivamente explica.
