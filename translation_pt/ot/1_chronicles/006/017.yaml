  terminology: “Tabernáculo”, “tenda do encontro”, “ministravam” e “casa de Yahweh” são escolhas consistentes, compreensíveis e fiéis. “Norma estabelecida para eles” expressa de modo aceitável o sentido de כְּמִשְׁפָּטָם, sem impor uma leitura confessional.
