lexical_decisions:
- source_word: חִילֵז
  choice: Hilém
  rationale: Nome próprio de lugar, transliterado diretamente da forma massorética de Crônicas. A terminação foi adaptada à leitura natural em português, sem substituí-la pela forma paralela de Josué.
- source_word: מִגְרָשֶׁיהָ
  choice: suas pastagens
  rationale: Designa as terras abertas vinculadas à cidade levítica, usadas especialmente para pastoreio. «Pastagens» é claro e natural no contexto desta lista.
- source_word: דְּבִיר
  choice: Debir
  rationale: Nome próprio de lugar, transliterado segundo a forma hebraica e a convenção corrente em português.
- source_word: וְ/אֶת
  choice: e
  rationale: A conjunção introduz cada item da lista; o marcador de objeto direto não possui equivalente explícito em português.
- source_word: אֶת
  choice: —
  rationale: Marcador hebraico de objeto direto, sem tradução lexical em português; sua função é refletida pela estrutura da enumeração.
