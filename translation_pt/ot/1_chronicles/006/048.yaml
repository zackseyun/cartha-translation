base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/048.yaml
  text: To the sons of Merari, according to their clans, from the tribe of Reuben, from the tribe of Gad, and from the tribe of Zebulun, twelve cities by lot.
translation:
  language: pt
  text: Aos filhos de Merari, segundo os seus clãs, foram dadas, por sorteio, doze cidades da tribo de Rúben, da tribo de Gade e da tribo de Zebulom.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי מְרָרִי
  choice: aos filhos de Merari
  rationale: O לְ introduz os destinatários da distribuição, e “filhos de Merari” preserva a expressão genealógica formal do hebraico.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: segundo os seus clãs
  rationale: No contexto da organização tribal, מִשְׁפָּחָה designa os clãs ou subdivisões familiares da linhagem.
- source_word: מִמַּטֵּה
  choice: das tribos de
  rationale: מַטֶּה significa “tribo” neste contexto de distribuição territorial; a formulação no plural reúne naturalmente as três ocorrências hebraicas.
- source_word: רְאוּבֵן וְגָד וּזְבוּלֻן
  choice: Rúben, Gade e Zebulom
  rationale: Empregam-se as formas portuguesas tradicionais e amplamente reconhecidas dos nomes tribais.
- source_word: בַּגּוֹרָל
  choice: por sorte
  rationale: A expressão indica o meio pelo qual se fez a distribuição e corresponde ao uso bíblico corrente em português.
- source_word: עָרִים שְׁתֵּים עֶשְׂרֵה
  choice: doze cidades
  rationale: A ordem portuguesa natural antepõe o numeral ao substantivo sem alterar o sentido.
