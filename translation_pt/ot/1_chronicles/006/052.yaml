base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/052.yaml
  text: 'They gave them the cities of refuge: Shechem with its pasturelands in the hill country of Ephraim[a], and Gezer with its pasturelands.'
translation:
  language: pt
  text: 'Deram-lhes as cidades de refúgio: Siquém com suas pastagens, na região montanhosa de Efraim[a], e Gezer com suas pastagens.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “as cidades de refúgio: Siquém e suas pastagens, na região montanhosa de Efraim, e Gezer e suas pastagens”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Deram
  rationale: O wayyiqtol de נתן dá sequência à narrativa; em português, a conjunção pode ser omitida sem perder esse sentido.
- source_word: לָהֶם
  choice: lhes
  rationale: O pronome retoma naturalmente os destinatários identificados no contexto anterior.
- source_word: עָרֵי הַמִּקְלָט
  choice: as cidades de refúgio
  rationale: Expressão técnica clara e consagrada para as cidades destinadas a oferecer refúgio.
- source_word: שְׁכֶם
  choice: Siquém
  rationale: Forma tradicional e amplamente reconhecível do topônimo em português.
- source_word: מִגְרָשֶׁיהָ
  choice: suas pastagens
  rationale: Designa as áreas abertas pertencentes à cidade, usadas especialmente para pastoreio; evita o sentido urbano moderno de 'subúrbios'.
- source_word: בְּהַר אֶפְרָיִם
  choice: na região montanhosa de Efraim
  rationale: A expressão indica a zona de colinas ou terras altas associada a Efraim, não necessariamente um monte isolado.
- source_word: גֶּזֶר
  choice: Gezer
  rationale: Transliteração corrente e reconhecível do topônimo.
- source_word: וְאֶת ... וְאֶת
  choice: e ... com
  rationale: A sintaxe portuguesa agrupa naturalmente cada cidade com suas pastagens, sem reproduzir de modo rígido os marcadores de objeto hebraicos.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A formulação principal esclarece a relação entre cada cidade e suas pastagens, enquanto a nota preserva mais de perto a coordenação do hebraico.
