  text: כִּ֚י אָמַ֣ר דָּוִ֔יד הֵנִ֛יחַ יְהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל לְ/עַמּ֑/וֹ וַ/יִּשְׁכֹּ֥ן בִּ/ירוּשָׁלִַ֖ם עַד לְ/עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/025.yaml
  text: For David said[a], “Yahweh, the God of Israel, has given rest to his people, and he has dwelt in Jerusalem forever.”
translation:
  language: pt
  text: 'Pois Davi disse: “Yahweh, o Deus de Israel, deu descanso ao seu povo e habita em Jerusalém para sempre[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e habitará em Jerusalém para sempre”. O verbo hebraico pode ser entendido como referência à morada estabelecida e duradoura de Yahweh ali.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da instrução anterior e mantém de modo natural a função explicativa da conjunção.
- source_word: הֵנִיחַ
  choice: deu descanso
  rationale: O hiphil de נוח expressa a ação de conceder descanso ou segurança; a formulação é clara e preserva o sentido causativo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reproduz naturalmente a construção hebraica em aposição a Yahweh.
- source_word: לְעַמּוֹ
  choice: ao seu povo
  rationale: Marca o povo como beneficiário da concessão de descanso.
- source_word: וַיִּשְׁכֹּן
  choice: e passou a habitar
  rationale: Expressa a entrada numa condição de morada estabelecida, indicada pela forma narrativa, sem perder a continuidade sugerida por “para sempre”.
- source_word: בִּירוּשָׁלִַם עַד לְעוֹלָם
  choice: em Jerusalém para sempre
  rationale: Mantém diretamente o lugar e a duração indefinidamente contínua da morada.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto hebraico traz o nome pessoal divino; a transliteração preserva essa distinção sem substituí-lo por um título.
- issue: Valor temporal da morada de Yahweh em Jerusalém
  choice: passou a habitar em Jerusalém para sempre
  alternative: habitará em Jerusalém para sempre
  rationale: A forma verbal pode apresentar a morada como estabelecida na sequência do descanso concedido, enquanto o contexto e “para sempre” ressaltam sua permanência. A alternativa futura permanece possível e é registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluente para leitores brasileiros e compreensão ampla no mundo lusófono. “Deu descanso” conserva a expressão bíblica sem soar arcaica; “passou a habitar” comunica uma morada iniciada e permanente.
