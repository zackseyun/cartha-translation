base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/019.yaml
  text: 'The sons of Hebron: Jeriah the first[a], Amariah the second, Jahaziel the third, and Jekameam the fourth.'
translation:
  language: pt
  text: 'Os filhos de Hebrom: Jerias, o primeiro[a]; Amarias, o segundo; Jaaziel, o terceiro; e Jecameão, o quarto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente “o cabeça” ou “o chefe”; neste contexto, a expressão funciona como “o primeiro”, em paralelo com “o segundo”, “o terceiro” e “o quarto”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי חֶבְרוֹן
  choice: Os filhos de Hebrom
  rationale: O plural construto de בֵּן introduz uma lista genealógica imediata; “filhos” é mais direto e preciso aqui do que “descendentes”.
- source_word: יְרִיָּהוּ
  choice: Jerias
  rationale: Forma tradicional e natural do nome em português bíblico, correspondente ao nome hebraico Yəriyyāhû.
- source_word: הָרֹאשׁ
  choice: o primeiro
  rationale: Embora רֹאשׁ signifique literalmente “cabeça” e possa indicar “chefe”, aqui funciona ordinalmente em paralelo com “o segundo”, “o terceiro” e “o quarto”.
- source_word: אֲמַרְיָה
  choice: Amarias
  rationale: Transliteração adaptada à forma tradicional e legível em português.
- source_word: הַשֵּׁנִי
  choice: o segundo
  rationale: Adjetivo ordinal que assinala a sequência da lista.
- source_word: יַחֲזִיאֵל
  choice: Jaaziel
  rationale: Forma portuguesa convencional do nome hebraico, mantendo distinção clara entre os personagens.
- source_word: הַשְּׁלִישִׁי
  choice: o terceiro
  rationale: Adjetivo ordinal que assinala a sequência da lista.
- source_word: וִיקַמְעָם
  choice: e Jecameão
  rationale: A conjunção foi vertida por “e”; o nome foi adaptado à forma portuguesa tradicional e pronunciável.
- source_word: הָרְבִיעִי
  choice: o quarto
  rationale: Adjetivo ordinal que encerra a sequência.
