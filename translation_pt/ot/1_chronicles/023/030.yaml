  text: וְ/לַ/עֲמֹד֙ בַּ/בֹּ֣קֶר בַּ/בֹּ֔קֶר לְ/הֹד֥וֹת וּ/לְ/הַלֵּ֖ל לַ/יהוָ֑ה וְ/כֵ֖ן לָ/עָֽרֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/030.yaml
  text: and to stand every morning to give thanks and to praise Yahweh[a], and likewise at evening,
translation:
  language: pt
  text: e estar de pé todas as manhãs[a] para dar graças e louvar a Yahweh, e igualmente à tarde,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “manhã após manhã”, expressão que indica uma obrigação diária regular.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לַ/עֲמֹד
  choice: e estar de pé
  rationale: O infinitivo com וְ e לְ continua a descrição das funções atribuídas no contexto. “Estar de pé” preserva a postura concreta e o caráter formal do serviço, sem ampliar o sentido para “ministrar”.
- source_word: בַּ/בֹּקֶר בַּ/בֹּקֶר
  choice: todas as manhãs
  rationale: A repetição tem valor distributivo e indica uma obrigação diária regular. “Todas as manhãs” é natural em português; a forma hebraica mais literal é registrada em nota.
- source_word: לְ/הֹדֹות
  choice: para dar graças
  rationale: No contexto de culto, o hifil de ידה expressa ação de graças. A formulação também se harmoniza naturalmente com o verbo seguinte.
- source_word: וּ/לְ/הַלֵּל
  choice: e louvar
  rationale: O piel de הלל significa louvar. “Louvar” é direto e não acrescenta a ideia específica de canto, que o verbo por si só não exige.
- source_word: לַ/יהוָה
  choice: a Yahweh
  rationale: Reproduz o nome divino יהוה como nome próprio, preservando sua ocorrência explícita no texto hebraico.
- source_word: וְ/כֵן
  choice: e igualmente
  rationale: Indica que a mesma função realizada pela manhã também devia ser cumprida à tarde.
- source_word: לָ/עָרֶב
  choice: à tarde
  rationale: Expressa de modo conciso e idiomático em português o período correspondente do entardecer.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” preserva o nome próprio e evita substituí-lo por um título; “SENHOR” e “Jeová” são tradições de tradução possíveis, mas não foram adotadas aqui.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A construção mantém o caráter de continuação sintática do versículo e conserva a imagem concreta de permanecer de pé no serviço litúrgico.
