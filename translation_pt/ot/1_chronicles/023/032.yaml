base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/032.yaml
  text: And they were to keep charge of the tent of meeting[a], the charge of the holy place, and the charge of the sons of Aaron their brothers, for the service of the house of Yahweh.
translation:
  language: pt
  text: Deveriam estar encarregados da Tenda do Encontro, do lugar santo[a] e dos filhos de Arão, seus irmãos, para o serviço da casa de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do santuário”. O termo hebraico pode designar o lugar santo ou, de modo mais amplo, a área sagrada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: Deveriam cumprir
  rationale: O verbo שׁמר exprime guardar, observar ou cumprir. Neste resumo das funções levíticas, a construção modal comunica uma responsabilidade atribuída, e não apenas um acontecimento passado.
- source_word: מִשְׁמֶרֶת
  choice: as responsabilidades relativas a
  rationale: O substantivo indica encargo, obrigação ou responsabilidade de guarda. A formulação portuguesa é clara no contexto administrativo e cultual; um único substantivo no plural abrange a série coordenada do hebraico sem alterar seus três âmbitos.
- source_word: אֹהֶל מוֹעֵד
  choice: Tenda do Encontro
  rationale: Tradução transparente dos componentes hebraicos e designação compreensível do santuário móvel, sem recorrer ao termo tradicional menos imediato “tabernáculo”.
- source_word: הַקֹּדֶשׁ
  choice: o lugar santo
  rationale: No contexto cultual, o termo designa aquilo que pertence à esfera sagrada, podendo referir-se ao lugar santo ou, de modo mais amplo, ao santuário. A nota preserva essa amplitude.
- source_word: בְּנֵי אַהֲרֹן אֲחֵיהֶם
  choice: os filhos de Arão, seus irmãos
  rationale: Mantém a linguagem familiar e sacerdotal do hebraico e identifica os sacerdotes aarônicos como irmãos dos demais levitas, sem substituir “filhos” pela interpretação “descendentes”.
- source_word: לַעֲבֹדַת
  choice: no serviço
  rationale: עֲבֹדָה denota trabalho ou serviço e, neste contexto, o serviço cultual realizado na casa de Yahweh.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Preserva a imagem hebraica de “casa” e verte diretamente o nome divino יְהוָה como “Yahweh”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o tetragrama como nome próprio. “Yahweh” preserva explicitamente o nome da aliança, enquanto “SENHOR” representa a tradição de substituição na leitura.
- issue: Relação entre os levitas e os filhos de Arão
  choice: responsabilidades relativas [...] aos filhos de Arão
  alternative: trabalhar sob as ordens dos filhos de Arão
  rationale: A construção hebraica repete מִשְׁמֶרֶת antes de “filhos de Arão”, mas não explicita nesta frase se a relação é auxílio, supervisão ou obediência. A tradução conserva essa abertura em vez de definir uma hierarquia não expressa diretamente.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Tenda do Encontro” e “casa de Yahweh” preservam as imagens concretas do hebraico. A enumeração foi mantida, mas a repetição rígida de “responsabilidade” foi condensada numa única expressão plural para maior naturalidade em português.
