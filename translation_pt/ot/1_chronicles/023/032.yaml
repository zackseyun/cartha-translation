  rationale: A revisão usa «estar encarregados de» para expressar a responsabilidade atribuída e deixa a regência repetir-se em cada membro da enumeração («da... do... e dos...»), refletindo de modo mais transparente os três usos de מִשְׁמֶרֶת. «Para o serviço» traduz de forma direta לַעֲבֹדַת, sem definir além do que o texto afirma a relação funcional com os sacerdotes aarônicos.
