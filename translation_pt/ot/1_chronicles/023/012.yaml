  text: בְּנֵ֣י קְהָ֗ת עַמְרָ֥ם יִצְהָ֛ר חֶבְר֥וֹן וְ/עֻזִּיאֵ֖ל אַרְבָּעָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/012.yaml
  text: 'The sons of Kohath: Amram, Izhar, Hebron, and Uzziel—four.'
translation:
  language: pt
  text: 'Os filhos de Coate: Anrão, Isar, Hebrom e Uziel — quatro.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Os filhos de
  rationale: Plural construto de בֵּן que introduz uma lista genealógica. Como o versículo enumera quatro filhos específicos, «filhos de» é mais preciso do que «descendentes de».
- source_word: קְהָת
  choice: Coate
  rationale: Forma tradicional e amplamente reconhecida do nome em português bíblico.
- source_word: עַמְרָם
  choice: Anrão
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio.
- source_word: יִצְהָר
  choice: Isar
  rationale: Forma portuguesa estabelecida do nome próprio, com grafia acessível ao leitor moderno.
- source_word: חֶבְרוֹן
  choice: Hebrom
  rationale: Forma portuguesa tradicional; o contexto genealógico deixa claro que aqui se trata de uma pessoa, não do lugar de mesmo nome.
- source_word: וְעֻזִּיאֵל
  choice: e Uziel
  rationale: A conjunção וְ é expressa por «e», e o nome recebe sua forma portuguesa bíblica usual.
- source_word: אַרְבָּעָה
  choice: quatro
  rationale: Número cardinal que resume o total dos filhos enumerados. O travessão preserva de modo natural sua função de observação recapitulativa.
