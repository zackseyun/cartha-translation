  text: And as for Moses, the man of God, his sons were counted among the tribe of Levi.
translation:
  language: pt
  text: Quanto a Moisés, o homem de Deus, seus filhos foram contados entre os membros da tribo de Levi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: o homem de Deus
  rationale: Expressão hebraica tradicional e clara que designa Moisés por sua relação e serviço a Deus.
- source_word: יִקָּרְאוּ עַל שֵׁבֶט הַלֵּוִי
  choice: foram contados entre os membros da tribo de Levi
  rationale: O verbo passivo, neste contexto genealógico e administrativo, indica que os filhos de Moisés foram registrados ou classificados como integrantes da tribo de Levi; a formulação evita o sentido pouco natural de simplesmente receberem um nome.
theological_decisions:
- issue: A posição dos filhos de Moisés na organização levítica
  choice: foram contados entre os membros da tribo de Levi
  alternative: foram chamados segundo a tribo de Levi
  rationale: A tradução contextual comunica inclusão tribal, sem atribuir aos descendentes de Moisés uma categoria sacerdotal ou um privilégio especial não declarado no texto.
translation_notes:
  register: Português moderno, digno e acessível. A abertura «Quanto a Moisés» preserva a mudança de tópico marcada no hebraico; «entre os membros» torna explícito de modo natural o sentido de inclusão na tribo.
