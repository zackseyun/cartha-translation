  text: וּ/לְ/כֹ֨ל הַעֲל֤וֹת עֹלוֹת֙ לַ/יהוָ֔ה לַ/שַּׁבָּת֔וֹת לֶ/חֳדָשִׁ֖ים וְ/לַ/מֹּעֲדִ֑ים בְּ/מִסְפָּ֨ר כְּ/מִשְׁפָּ֧ט עֲלֵי/הֶ֛ם תָּמִ֖יד לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/031.yaml
  text: and for all the burnt offerings offered to Yahweh on the Sabbaths[a], at the new moons, and at the appointed feasts, by number according to the ordinance concerning them, continually before Yahweh.
translation:
  language: pt
  text: e para oferecer todos os holocaustos a Yahweh, nos sábados, nas luas novas e nas festas determinadas, em número, conforme a norma estabelecida para eles, continuamente diante de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְכֹל הַעֲלוֹת עֹלוֹת
  choice: e para oferecer todos os holocaustos
  rationale: O infinitivo construto הַעֲלוֹת seguido do substantivo cognato עֹלוֹת exprime o ato sacrificial. Em português, esta formulação é natural e mantém tanto a ação quanto o tipo de oferta.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição indica a apresentação dos sacrifícios a Deus; o nome próprio יהוה é transliterado como «Yahweh».
- source_word: לַשַּׁבָּתוֹת
  choice: nos sábados
  rationale: A preposição assinala as ocasiões em que os holocaustos eram oferecidos, preservando-se o plural hebraico.
- source_word: לֶחֳדָשִׁים
  choice: nas luas novas
  rationale: Neste contexto do calendário cultual, חֳדָשִׁים designa as celebrações da lua nova, não simplesmente os meses.
- source_word: וְלַמֹּעֲדִים
  choice: e nas festas determinadas
  rationale: מוֹעֲדִים refere-se às ocasiões festivas fixadas no calendário sagrado; «determinadas» preserva a ideia de tempos designados.
- source_word: בְּמִסְפָּר כְּמִשְׁפָּט עֲלֵיהֶם
  choice: no número prescrito para cada ocasião
  rationale: A expressão indica que a quantidade obedecia à norma aplicável. «Para cada ocasião» torna explícito o referente contextual de עֲלֵיהֶם sem alterar o sentido administrativo e cultual.
- source_word: תָּמִיד
  choice: continuamente
  rationale: Mantém o sentido de serviço regular e constante, além da ressonância cultual do termo.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Equivalente natural e próximo da expressão hebraica para o serviço realizado na presença de Deus.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. «Yahweh» preserva o nome da aliança e segue a orientação fornecida, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e acessível, com terminologia cultual consolidada. A sintaxe foi suavizada para clareza, sobretudo em בְּמִסְפָּר כְּמִשְׁפָּט עֲלֵיהֶם, sem eliminar a ideia de quantidade regulamentada.
