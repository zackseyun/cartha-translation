  text: בְּנֵ֣י שִׁמְעִ֗י שלמות וַ/חֲזִיאֵ֛ל וְ/הָרָ֖ן שְׁלֹשָׁ֑ה אֵ֛לֶּה רָאשֵׁ֥י הָ/אָב֖וֹת לְ/לַעְדָּֽן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/009.yaml
  text: 'The sons of Shimei: Shelomoth[a], Haziel, and Haran—three. These were the heads of the fathers’ houses of Ladan.'
translation:
  language: pt
  text: Os filhos de Simei foram Selomote[a], Haziel e Harã — três ao todo. Eles eram os chefes das casas paternas de Ladã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Selomite”, variante comum de transliteração do nome.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי שִׁמְעִי
  choice: Os filhos de Simei
  rationale: Neste contexto genealógico, בְּנֵי designa naturalmente filhos, e não apenas descendentes; o nome שִׁמְעִי é transliterado na forma portuguesa tradicional Simei.
- source_word: שלמות
  choice: Selomote
  rationale: A forma portuguesa Selomote representa o nome conforme a vocalização do texto hebraico neste contexto; a variante Selomite é registrada em nota.
- source_word: וַחֲזִיאֵל
  choice: Haziel
  rationale: Transliteração direta de חֲזִיאֵל, sem importar a forma distinta Jaaziel encontrada em outros contextos.
- source_word: וְהָרָן
  choice: e Harã
  rationale: Mantém a conjunção e emprega a forma portuguesa corrente do nome próprio.
- source_word: שְׁלֹשָׁה
  choice: três ao todo
  rationale: Conserva explicitamente a soma genealógica do hebraico, com expressão natural em português.
- source_word: אֵלֶּה רָאשֵׁי הָאָבוֹת
  choice: Eles eram os chefes das casas paternas
  rationale: רָאשֵׁי indica os representantes principais ou chefes, enquanto הָאָבוֹת, no uso administrativo de Crônicas, refere-se às casas paternas ou unidades familiares ancestrais.
- source_word: לְלַעְדָּן
  choice: de Ladã
  rationale: O prefixo לְ marca aqui relação ou pertencimento à linhagem de Ladã; a construção com “de” é idiomática em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com terminologia genealógica suficientemente formal. A expressão “três ao todo” torna natural a contagem explícita do hebraico sem omiti-la; “casas paternas” preserva a estrutura familiar do texto.
