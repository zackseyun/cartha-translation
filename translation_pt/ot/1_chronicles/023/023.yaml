  text: 'Os filhos de Musi: Mali, Éder e Jerimote — três.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Os filhos de
  rationale: Plural construto de “filho”, usado para introduzir uma lista genealógica. “Os filhos de” é direto e adequado, pois são apresentados três indivíduos pelo nome.
- source_word: מוּשִׁי
  choice: Musi
  rationale: Nome próprio transliterado em forma natural para leitores de língua portuguesa.
- source_word: מַחְלִי
  choice: Mali
  rationale: Nome próprio transliterado segundo o uso bíblico corrente em português.
- source_word: וְעֵדֶר
  choice: Éder
  rationale: A conjunção hebraica é representada pela coordenação portuguesa da lista; o nome recebe acento para indicar claramente a pronúncia.
- source_word: וִירֵמוֹת
  choice: Jeremote
  rationale: Transliteração portuguesa natural do nome próprio hebraico, sem depender da variante ortográfica tradicional inglesa.
- source_word: שְׁלֹשָׁה
  choice: três
  rationale: O numeral cardinal resume o total dos filhos enumerados. O travessão preserva a estrutura de lista seguida pela totalização.
