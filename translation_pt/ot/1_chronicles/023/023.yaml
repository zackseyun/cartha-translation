  register: Português moderno, claro e digno, com sintaxe genealógica concisa. Os nomes seguem formas legíveis em português; não se reproduziu a nota inglesa sobre Jeremoth/Jerimoth, pois ela trata especificamente de variantes de grafia em inglês e não corresponde a uma ambiguidade do texto hebraico.
