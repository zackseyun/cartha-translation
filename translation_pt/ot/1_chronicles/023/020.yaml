  language: en
  yaml_path: translation/ot/1_chronicles/023/020.yaml
  text: 'The sons of Uzziel: Micah the first[b][a], and Isshiah the second.'
translation:
  language: pt
  text: 'Os filhos de Uziel: Mica, o primeiro[a], e Issias, o segundo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o chefe”; em hebraico, literalmente, “a cabeça”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Os filhos de
  rationale: Plural construto de בֵּן que introduz uma breve lista genealógica; “filhos de” é direto e natural no contexto.
- source_word: עֻזִּיאֵל
  choice: Uziel
  rationale: Forma tradicional e reconhecível do nome hebraico em português.
- source_word: מִיכָה
  choice: Mica
  rationale: Transliteração portuguesa tradicional e reconhecível do nome próprio hebraico.
- source_word: הָרֹאשׁ
  choice: o primeiro
  rationale: Embora רֹאשׁ signifique literalmente “cabeça” e possa indicar “chefe”, o paralelo com הַשֵּׁנִי, “o segundo”, favorece aqui o sentido ordinal “o primeiro”.
- source_word: וְיִשִּׁיָּה
  choice: e Issias
  rationale: O nome é transliterado em uma forma portuguesa legível, conservando de modo aproximado a forma hebraica יִשִּׁיָּה.
- source_word: הַשֵּׁנִי
  choice: o segundo
  rationale: Adjetivo ordinal que identifica o segundo nome da lista.
theological_decisions:
- issue: Sentido de הָרֹאשׁ
  choice: o primeiro
  alternative: o chefe; literalmente, a cabeça
  rationale: A oposição imediata a “o segundo” indica provavelmente ordem ou primazia. A nota preserva a possibilidade lexical de função ou liderança sem impor essa leitura ao texto.
translation_notes:
  register: Português moderno, claro e digno, com formas de nomes tradicionalmente legíveis para o público lusófono. A construção nominal concisa reproduz o caráter de lista genealógica do hebraico.
