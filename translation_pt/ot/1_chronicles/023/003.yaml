base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/003.yaml
  text: The Levites were counted from thirty years old and upward[a], and their number by heads, man by man, was thirty-eight thousand.
translation:
  language: pt
  text: Os levitas de trinta anos para cima foram contados, e o número deles, por cabeça[a], isto é, homem por homem, era de trinta e oito mil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “pelas suas cabeças, como homens”; a expressão indica uma contagem individual de homens adultos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּפְרוּ
  choice: foram contados
  rationale: Expressa naturalmente em português a forma passiva do hebraico e preserva o sentido de recenseamento.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: É a designação tradicional e amplamente compreendida para os integrantes da tribo de Levi.
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמָעְלָה
  choice: de trinta anos para cima
  rationale: Reproduz com clareza o limite mínimo de idade indicado pela expressão hebraica.
- source_word: וַיְהִי מִסְפָּרָם
  choice: O número deles ... foi
  rationale: Segue diretamente a construção hebraica que introduz o total do recenseamento.
- source_word: לְגֻלְגְּלֹתָם
  choice: contado cabeça por cabeça
  rationale: Mantém a imagem concreta de 'cabeças' e comunica uma contagem individual.
- source_word: לִגְבָרִים
  choice: entre os homens
  rationale: Preserva a especificação masculina do hebraico sem criar em português a possível impressão de que cada homem efetuava a contagem.
- source_word: שְׁלֹשִׁים וּשְׁמוֹנָה אָלֶף
  choice: trinta e oito mil
  rationale: Tradução direta do total numérico hebraico.
