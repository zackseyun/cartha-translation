- from: Os levitas de trinta anos para cima foram contados. O número deles, contado cabeça por cabeça, entre os homens[a], foi de trinta e oito mil.
  to: Os levitas de trinta anos para cima foram contados, e o número deles, por cabeça[a], isto é, homem por homem, era de trinta e oito mil.
  rationale: A revisão substitui a expressão imprecisa “entre os homens” por “homem por homem”, preservando a especificação dos recenseados como homens adultos. A nota explica a expressão hebraica concreta “pelas suas cabeças”, enquanto o texto principal mantém leitura moderna e clara.
