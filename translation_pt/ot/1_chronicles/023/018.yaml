lexical_decisions:
- source_word: בְּנֵי
  choice: Dos filhos de
  rationale: O plural construto de בֵּן introduz os membros da linhagem de Isaar. “Dos filhos de” preserva a formulação genealógica direta e se encaixa naturalmente na construção elíptica do versículo.
- source_word: יִצְהָר
  choice: Isaar
  rationale: Nome próprio transliterado segundo uma forma bíblica portuguesa reconhecível, mantendo a identificação da personagem hebraica Yitshar.
- source_word: שְׁלֹמִית
  choice: Selomite
  rationale: Nome próprio transliterado em forma natural e tradicionalmente reconhecível em português.
- source_word: הָרֹאשׁ
  choice: o chefe
  rationale: Com o artigo, רֹאשׁ funciona aqui provavelmente como designação de liderança ou primazia. “O chefe” comunica essa função com clareza em português atual, sem eliminar as possibilidades literais “a cabeça” e “o primeiro”, registradas em nota.
