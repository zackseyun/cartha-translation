base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/017.yaml
  text: 'The sons of Eliezer: Rehabiah was the chief[a], and Eliezer had no other sons; but the sons of Rehabiah became very many.'
translation:
  language: pt
  text: 'Os filhos de Eliézer: Reabias era o chefe. Eliézer não teve outros filhos, mas os filhos de Reabias se multiplicaram extraordinariamente.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tornaram-se extremamente numerosos”.'
    reason: Alternativa lexical que preserva a possibilidade de entender רָבוּ como estado resultante, em vez de enfatizar o processo de multiplicação.
lexical_decisions:
- source_word: וַיִּהְיוּ בְנֵי אֱלִיעֶזֶר
  choice: 'Os filhos de Eliézer:'
  rationale: A fórmula genealógica é vertida como introdução nominal, natural em português e fiel à função enumerativa do hebraico.
- source_word: רְחַבְיָה
  choice: Reabias
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio hebraico.
- source_word: הָרֹאשׁ
  choice: era o chefe
  rationale: Preserva o sentido de liderança ou primazia de רֹאשׁ no contexto genealógico, sem reduzi-lo necessariamente a uma afirmação de ordem de nascimento.
- source_word: וְלֹא הָיָה לֶאֱלִיעֶזֶר בָּנִים אֲחֵרִים
  choice: Eliézer não teve outros filhos
  rationale: Expressa idiomaticamente em português a construção existencial possessiva do hebraico.
- source_word: וּבְנֵי רְחַבְיָה
  choice: mas os filhos de Reabias
  rationale: A conjunção recebe valor adversativo para tornar explícito o contraste contextual entre Eliézer não ter outros filhos e a grande multiplicação da descendência de Reabias.
- source_word: רָבוּ לְמָעְלָה
  choice: se multiplicaram extraordinariamente
  rationale: רָבוּ indica aumento ou multiplicação, e לְמָעְלָה funciona aqui como intensificador; a expressão escolhida comunica ambos com clareza e dignidade.
