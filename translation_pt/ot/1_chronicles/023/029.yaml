revisions:
- from: e do pão disposto em fileiras[a], da farinha fina para a oferta de cereal, dos pães finos sem fermento, do que era preparado na chapa, do que era bem misturado e de toda medida de capacidade e de tamanho.
  to: e do pão disposto em fileiras[a], da farinha fina para a oferta de cereal, dos pães achatados sem fermento, do que era preparado na chapa, do que era bem misturado e de toda medida de capacidade e de tamanho.
  rationale: Foi substituído apenas «pães finos sem fermento» por «pães achatados sem fermento», para transmitir o sentido de pães delgados de רְקִיקִים e eliminar uma ambiguidade natural do português. O restante foi preservado.
