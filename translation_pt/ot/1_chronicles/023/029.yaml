  text: וּ/לְ/לֶ֨חֶם הַֽ/מַּעֲרֶ֜כֶת וּ/לְ/סֹ֤לֶת לְ/מִנְחָה֙ וְ/לִ/רְקִיקֵ֣י הַ/מַּצּ֔וֹת וְ/לַֽ/מַּחֲבַ֖ת וְ/לַ/מֻּרְבָּ֑כֶת וּ/לְ/כָל מְשׂוּרָ֖ה וּ/מִדָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/029.yaml
  text: and for the bread of the arrangement[a], and for the fine flour for the grain offering, and for the wafers of unleavened bread, and for what is cooked on the griddle, and for what is well-mixed, and for every measure and size,
translation:
  language: pt
  text: e do pão disposto em fileiras[a], da farinha fina para a oferta de cereal, dos pães achatados sem fermento, do que era preparado na chapa, do que era bem misturado e de toda medida de capacidade e de tamanho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pão da Presença” ou “pães da proposição”. O hebraico diz literalmente “pão da disposição”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם הַמַּעֲרֶכֶת
  choice: pão disposto em fileiras
  rationale: Expressa de modo claro o sentido literal de pão organizado ou disposto, preservando o caráter técnico do termo cultual sem recorrer à forma tradicional e pouco transparente “pães da proposição”.
- source_word: סֹלֶת
  choice: farinha fina
  rationale: Equivalente corrente e claro para a farinha refinada empregada nas ofertas.
- source_word: מִנְחָה
  choice: oferta de cereal
  rationale: Neste contexto cultual, designa uma oferta feita de produto cerealífero, e não uma oferta genérica.
- source_word: רְקִיקֵי הַמַּצּוֹת
  choice: pães finos sem fermento
  rationale: רְקִיקִים indica bolos ou pães delgados; a formulação é natural em português e mantém a qualificação de que eram sem fermento.
- source_word: מַּחֲבַת
  choice: o que era preparado na chapa
  rationale: O substantivo designa a chapa ou frigideira rasa usada no preparo. A formulação refere-se ao alimento preparado nela, como requer a sequência de itens.
- source_word: מֻּרְבָּכֶת
  choice: o que era bem misturado
  rationale: Mantém a forma passiva e a provável ideia de uma preparação bem misturada, sem especificar além do que o termo hebraico permite.
- source_word: מְשׂוּרָה
  choice: medida de capacidade
  rationale: Indica uma medida padronizada de quantidade ou capacidade e permite distingui-la do termo seguinte.
- source_word: מִדָּה
  choice: tamanho
  rationale: No par com מְשׂוּרָה, comunica de maneira natural a ideia complementar de dimensão ou padrão de tamanho.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção iniciada por “e do” preserva a ligação sintática deste versículo com a oração anterior. Os termos cultuais são traduzidos de modo transparente, e a alternativa tradicional é mantida em nota.
