  text: וַ/יֶּאֱסֹף֙ אֶת כָּל שָׂרֵ֣י יִשְׂרָאֵ֔ל וְ/הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/002.yaml
  text: And he gathered all the leaders of Israel[a], and the priests and the Levites.
translation:
  language: pt
  text: E reuniu todos os líderes de Israel[a], os sacerdotes e os levitas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chefes de Israel”, “autoridades de Israel” ou “oficiais de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: E reuniu
  rationale: O waw consecutivo dá continuidade à narrativa, e o verbo אסף, neste contexto, descreve a convocação ou reunião das pessoas mencionadas. “E reuniu” é natural e mantém a ligação narrativa.
- source_word: כָּל
  choice: todos
  rationale: O quantificador expressa totalidade e concorda naturalmente em português com o plural “líderes”.
- source_word: שָׂרֵי יִשְׂרָאֵל
  choice: os líderes de Israel
  rationale: שָׂרִים pode designar líderes, chefes, autoridades ou oficiais. “Líderes” é amplo, atual e adequado ao contexto administrativo, sem sugerir especificamente filhos do rei.
- source_word: וְהַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Tradução direta do substantivo definido no plural; em português, a coordenação após “todos os líderes de Israel” pode ser expressa naturalmente por vírgula.
- source_word: וְהַלְוִיִּם
  choice: e os levitas
  rationale: “Levitas” é a designação tradicional, clara e direta para o grupo tribal e cultual indicado pelo hebraico.
