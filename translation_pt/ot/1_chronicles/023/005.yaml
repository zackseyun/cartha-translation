  text: וְ/אַרְבַּ֥עַת אֲלָפִ֖ים שֹׁעֲרִ֑ים וְ/אַרְבַּ֤עַת אֲלָפִים֙ מְהַֽלְלִ֣ים לַ/יהוָ֔ה בַּ/כֵּלִ֕ים אֲשֶׁ֥ר עָשִׂ֖יתִי לְ/הַלֵּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/005.yaml
  text: and four thousand gatekeepers[a], and four thousand praising Yahweh with the instruments that I made to praise him.
translation:
  language: pt
  text: e quatro mil porteiros, e quatro mil que louvavam Yahweh com os instrumentos que fiz para o louvor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «que fiz para louvar». O hebraico expressa a finalidade dos instrumentos sem indicar aqui um objeto pronominal explícito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁעֲרִים
  choice: porteiros
  rationale: Designa os encarregados dos portões. «Porteiros» é claro e natural no contexto da administração do templo.
- source_word: מְהַֽלְלִים
  choice: que louvavam
  rationale: O particípio indica a função contínua desse grupo; a oração relativa soa natural em português e mantém esse valor funcional.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Reproduz o nome divino יְהוָה como nome próprio, sem substituí-lo por um título.
- source_word: בַּכֵּלִים
  choice: com os instrumentos
  rationale: Embora כֵּלִים seja um termo amplo, o contexto de louvor torna evidente o sentido de instrumentos usados na música, sem necessidade de explicitar «musicais».
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: que fiz
  rationale: Mantém a primeira pessoa do singular e traduz diretamente a oração relativa.
- source_word: לְהַלֵּל
  choice: para o louvor
  rationale: Expressa a finalidade dos instrumentos sem acrescentar um objeto pronominal que não aparece explicitamente no hebraico.
- source_word: וְאַרְבַּעַת אֲלָפִים ... וְאַרְבַּעַת אֲלָפִים
  choice: e quatro mil ... e quatro mil
  rationale: Preserva a repetição e a distinção enfática entre os dois grupos.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o Tetragrama como nome próprio; «Yahweh» preserva diretamente o nome da aliança, em vez de substituí-lo pelo título «SENHOR».
- issue: Objeto implícito de לְהַלֵּל
  choice: para o louvor
  alternative: para louvá-lo
  rationale: O hebraico não apresenta objeto pronominal expresso. A formulação escolhida preserva essa concisão, embora o contexto indique que Yahweh é o destinatário do louvor.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe simples. A repetição do hebraico foi mantida, e evitou-se tornar explícito o que o infinitivo final deixa implícito.
