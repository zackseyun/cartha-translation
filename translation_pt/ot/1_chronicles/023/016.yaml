base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/016.yaml
  text: 'The sons of Gershom: Shebuel the chief[a].'
translation:
  language: pt
  text: 'Os filhos de Gérson: Sebuel, o chefe[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o cabeça”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Os filhos de
  rationale: Plural construto de בֵּן, que introduz uma linha genealógica. “Os filhos de” é direto e natural nesta lista; “os descendentes de” ampliaria desnecessariamente o sentido.
- source_word: גֵרְשׁוֹם
  choice: Gérson
  rationale: Transliteração portuguesa da forma hebraica Gershom, distinguindo-a de Gershon e seguindo a forma tradicionalmente reconhecível em português.
- source_word: שְׁבוּאֵל
  choice: Sebuel
  rationale: Transliteração convencional e reconhecível em português do nome próprio hebraico.
- source_word: הָרֹאשׁ
  choice: o chefe
  rationale: Neste contexto administrativo e genealógico, רֹאשׁ com artigo indica primazia ou liderança. “O chefe” comunica essa função com naturalidade; “a cabeça” seria excessivamente literal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com redação concisa própria de uma lista genealógica e administrativa. Preserva-se a alternativa lexical de רֹאשׁ em nota.
