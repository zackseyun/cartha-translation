  yaml_path: translation/ot/1_chronicles/023/006.yaml
  text: 'David divided them into divisions for the sons of Levi: Gershon[a], Kohath, and Merari.'
translation:
  language: pt
  text: 'Davi os dividiu em divisões entre os filhos de Levi: Gérson[a], Coate e Merari.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «... entre os filhos de Levi: para Gérson, Coate e Merari».'
    reason: A preposição לְ antes de «Gérson» pode ser explicitada como regendo a lista dos três ramos.
lexical_decisions:
- source_word: וַיֶּחָלְקֵם
  choice: os dividiu
  rationale: O piel de חלק expressa dividir ou repartir, e o sufixo de terceira pessoa do plural exige que se preserve o objeto «os».
- source_word: מַחְלְקוֹת
  choice: em turmas
  rationale: O substantivo designa divisões ou grupos organizados. «Turmas» comunica de modo natural a organização dos levitas, sem reduzir o termo a grupos informais.
- source_word: לִבְנֵי לֵוִי
  choice: segundo os filhos de Levi
  rationale: Preserva a formulação genealógica explícita «filhos de Levi»; «segundo» torna natural em português a relação entre a divisão e as linhagens enumeradas.
- source_word: לְגֵרְשׁוֹן קְהָת וּמְרָרִי
  choice: Gérson, Coate e Merari
  rationale: São os três principais ancestrais dos clãs levíticos. A lista após os dois-pontos pode ser entendida como especificação dos filhos de Levi, embora a preposição ל diante de Gérson permita uma construção alternativa.
