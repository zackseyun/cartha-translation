  text: אֵ֣לֶּה בְנֵֽי לֵוִי֩ לְ/בֵ֨ית אֲבֹתֵי/הֶ֜ם רָאשֵׁ֧י הָ/אָב֣וֹת לִ/פְקוּדֵי/הֶ֗ם בְּ/מִסְפַּ֤ר שֵׁמוֹת֙ לְ/גֻלְגְּלֹתָ֔/ם עֹשֵׂה֙ הַ/מְּלָאכָ֔ה לַ/עֲבֹדַ֖ת בֵּ֣ית יְהוָ֑ה מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וָ/מָֽעְלָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/024.yaml
  text: These were the sons of Levi by their fathers’ houses[a], the heads of the fathers’ houses, according to those counted of them, by the number of names, head by head, doing the work for the service of the house of Yahweh, from twenty years old and upward.
translation:
  language: pt
  text: 'Estes eram os filhos de Levi, segundo suas famílias patriarcais: os chefes das famílias, conforme o recenseamento deles, pelo número dos nomes, um por um[a], que realizavam o trabalho para o serviço da casa de Yahweh, de vinte anos de idade para cima.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “por suas cabeças” ou “por seus crânios”; expressão que indica que cada pessoa foi contada separadamente.
    reason: Explica a imagem literal preservada pelo hebraico por trás da tradução idiomática “um por um”.
lexical_decisions:
- source_word: לְבֵית אֲבֹתֵיהֶם
  choice: segundo suas famílias patriarcais
  rationale: A expressão classifica os levitas por suas unidades familiares ancestrais. “Famílias patriarcais” comunica essa estrutura social de modo mais natural em português do que o decalque “casas de seus pais”.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: os chefes das famílias
  rationale: No contexto, a expressão designa os líderes das unidades familiares ancestrais; a formulação evita o pouco natural “chefes dos pais”.
- source_word: לִפְקוּדֵיהֶם
  choice: conforme o recenseamento deles
  rationale: A forma deriva de פקד no sentido de contar ou registrar. “Recenseamento” preserva a referência ao registro oficial sem tornar a frase excessivamente literal.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: pelo número dos nomes
  rationale: 'Mantém a imagem concreta do hebraico: os indivíduos constavam nominalmente no registro.'
- source_word: לְגֻלְגְּלֹתָם
  choice: um por um
  rationale: Literalmente, “por seus crânios/cabeças”; trata-se de uma expressão idiomática para a contagem individual. A tradução comunica diretamente o sentido, enquanto a nota preserva a imagem original.
- source_word: עֹשֵׂה הַמְּלָאכָה
  choice: os que faziam o trabalho
  rationale: O particípio singular hebraico tem valor coletivo e se refere aos levitas recenseados que executavam o trabalho.
- source_word: לַעֲבֹדַת בֵּית יְהוָה
  choice: relacionado ao serviço da casa de Yahweh
  rationale: עֲבֹדָה abrange as funções práticas e cultuais vinculadas ao santuário. “Serviço” mantém essa amplitude, e “relacionado ao” expressa a finalidade do trabalho sem redundância excessiva.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: de vinte anos de idade para cima
  rationale: Expressa de modo corrente e preciso a idade mínima estabelecida no hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino e evita substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Famílias patriarcais” apresenta a organização ancestral israelita sem o decalque pouco natural “casas dos pais”. A enumeração relativamente longa conserva a estrutura de registro genealógico do original, mas a pontuação torna suas relações compreensíveis.
