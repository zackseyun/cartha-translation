revisions:
- from: 'Os filhos de Anrão: Arão e Moisés. Arão foi separado, ele e seus filhos para sempre, para consagrar as coisas santíssimas[a], queimar incenso diante de Yahweh, servi-lo e abençoar em seu nome para sempre.'
  to: 'Os filhos de Anrão: Arão e Moisés. Arão foi separado para consagrá-lo como santíssimo — ele e seus filhos, para sempre —, para queimar incenso diante de Yahweh, ministrar-lhe e abençoar em seu nome para sempre.[a]'
  rationale: A revisão restaura o objeto singular de “para consagrá-lo” e entende “santíssimo” como o qualificativo superlativo de Arão, sem introduzir “coisas” que não constam no hebraico. Mantém-se a disposição de Arão e de seus filhos como linhagem sacerdotal duradoura e as funções cultuais subsequentes. A nota documenta a alternativa idiomática para o superlativo hebraico, sem transformar uma paráfrase sintaticamente menos provável em leitura principal.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T22:51:45Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução principal altera indevidamente o complemento de לְהַקְדִּישׁוֹ קֹדֶשׁ קָדָשִׁים para “consagrar as coisas santíssimas”. O sufixo singular em לְהַקְדִּישׁוֹ é mais naturalmente objeto e remete a Arão; a expressão קֹדֶשׁ קָדָשִׁים qualifica sua consagração como “santíssimo”. A alternativa proposta pela nota não deve ficar relegada à nota, pois é a leitura que melhor representa o hebraico e o audit trail inglês.
  naturalness: A redação revista conserva um português moderno e claro. “Ministrar-lhe” transmite melhor o matiz cultual de לְשָׁרְתוֹ do que o mais amplo “servi-lo”, e o travessão torna legível a aposição “ele e seus filhos, para sempre”.
  terminology: “Anrão”, “Arão”, “Moisés” e “Yahweh” estão adequados e coerentes com a convenção do projeto. “Santíssimo” reproduz apropriadamente o superlativo hebraico; “queimar incenso”, “ministrar-lhe” e “abençoar em seu nome” preservam o registro sacerdotal e a ambiguidade de “em seu nome”.
  issues:
  - severity: high
    issue: O texto traduz לְהַקְדִּישׁוֹ קֹדֶשׁ קָדָשִׁים como “consagrar as coisas santíssimas”.
    rationale: O hebraico traz sufixo pronominal singular em “consagrá-lo”, não um substantivo plural “as coisas”. A leitura adotada introduz um objeto ausente e desloca a referência de Arão, contrariando a sintaxe mais provável e a decisão lexical do audit trail.
  - severity: medium
    issue: A nota apresenta como alternativa a leitura que deve figurar no texto principal.
    rationale: Embora a formulação hebraica seja compacta, a leitura de Arão como o consagrado é a mais natural no contexto imediato e é a sustentada pelo audit trail. A nota deve, em vez disso, explicar o superlativo literal, sem promover uma leitura que acrescenta “coisas” ao texto.
  - severity: low
    issue: “Servi-lo” é semanticamente possível, mas perde parte da nuance sacerdotal de לְשָׁרְתוֹ.
    rationale: “Ministrar-lhe” é natural em português e preserva mais explicitamente o sentido de serviço cultual dirigido a Yahweh.
