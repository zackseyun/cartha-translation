base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/013.yaml
  text: 'The sons of Amram: Aaron and Moses. And Aaron was set apart[a], he and his sons forever, to sanctify him as most holy, to burn incense before Yahweh, to minister to him, and to bless in his name forever.'
translation:
  language: pt
  text: 'Os filhos de Anrão: Arão e Moisés. Arão foi separado para consagrá-lo como santíssimo — ele e seus filhos, para sempre —, para queimar incenso diante de Yahweh, ministrar-lhe e abençoar em seu nome para sempre.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como santo dos santos”. Literalmente, “santidade de santidades”, uma expressão superlativa com o sentido de “santíssimo”.'
    reason: alternativa lexical para a expressão superlativa קֹדֶשׁ קָדָשִׁים
lexical_decisions:
- source_word: בְּנֵי עַמְרָם
  choice: Os filhos de Anrão
  rationale: A expressão designa aqui os filhos imediatos de Anrão, pois Arão e Moisés são nomeados em seguida.
- source_word: וַיִּבָּדֵל
  choice: foi separado
  rationale: O nifal de בדל indica separação para uma função especial; a formulação é clara e conserva o tom consagratório.
- source_word: לְהַקְדִּישׁוֹ קֹדֶשׁ קָדָשִׁים
  choice: para consagrar as coisas santíssimas
  rationale: 'O sufixo do infinitivo pode ser entendido como sujeito, e קֹדֶשׁ קָדָשִׁים como seu objeto: Arão foi separado para consagrar aquilo que era santíssimo. Como a construção também admite outra análise, a alternativa é registrada em nota.'
- source_word: הוּא וּבָנָיו עַד עוֹלָם
  choice: ele e seus filhos para sempre
  rationale: Mantém a ampliação do referente de Arão para sua linhagem sacerdotal e traduz עַד עוֹלָם com sua força duradoura.
- source_word: לְהַקְטִיר
  choice: queimar incenso
  rationale: No contexto das funções sacerdotais, o verbo descreve naturalmente a queima ritual de incenso, embora em outros contextos possa incluir ofertas feitas subir em fumaça.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: לִפְנֵי expressa presença diante da divindade, e Yahweh representa diretamente o nome próprio יהוה.
- source_word: לְשָׁרְתוֹ
  choice: servi-lo
  rationale: O verbo שרת denota serviço ministerial ou cultual; em português, “servi-lo” é natural e mantém Yahweh como referente provável do sufixo.
- source_word: וּלְבָרֵךְ בִּשְׁמוֹ
  choice: e abençoar em seu nome
  rationale: Preserva a formulação hebraica e sua possível nuance de autoridade, invocação ou representação ligada ao nome divino.
theological_decisions:
- issue: Análise de לְהַקְדִּישׁוֹ קֹדֶשׁ קָדָשִׁים
  choice: “para consagrar as coisas santíssimas”, entendendo o sufixo como sujeito do infinitivo e קֹדֶשׁ קָדָשִׁים como objeto
  alternative: “para consagrá-lo como santíssimo”, entendendo o sufixo como objeto referente a Arão e קֹדֶשׁ קָדָשִׁים como predicativo
  rationale: As duas análises são gramaticalmente possíveis. O texto principal adota a leitura tradicional ligada às funções sacerdotais, enquanto a nota preserva a ambiguidade real sem decidir silenciosamente a questão.
- issue: Referente do sufixo em לְשָׁרְתוֹ
  choice: Yahweh
  alternative: Arão
  rationale: A menção imediatamente anterior a Yahweh e a lógica do serviço sacerdotal favorecem o referente divino, sem necessidade de explicitação adicional no texto.
translation_notes:
  register: Português moderno, digno e acessível, com ordem próxima à do hebraico. “Ele e seus filhos para sempre” conserva a expansão parentética do sujeito. O nome divino é transliterado como “Yahweh”, em consonância com a camada inglesa fornecida.
