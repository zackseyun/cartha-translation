  text: 'The sons of Merari: Mahli and Mushi. The sons of Mahli: Eleazar and Kish.'
translation:
  language: pt
  text: 'Os filhos de Merari: Mali e Musi. Os filhos de Mali: Eleazar e Quis.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Os filhos de
  rationale: Plural construto de בֵּן que introduz uma lista genealógica. “Os filhos de” reproduz diretamente o sentido e a estrutura do hebraico.
- source_word: מְרָרִי
  choice: Merari
  rationale: Nome próprio transliterado segundo a forma tradicional e amplamente reconhecida em português.
- source_word: מַחְלִי
  choice: Mali
  rationale: Nome próprio transliterado conforme a forma tradicional em português; ocorre tanto como filho de Merari quanto como pai de Eleazar e Quis.
- source_word: וּמוּשִׁי
  choice: e Musi
  rationale: A conjunção hebraica é representada por “e”, seguida da transliteração tradicional do nome próprio.
- source_word: בְּנֵי מַחְלִי
  choice: Os filhos de Mali
  rationale: A repetição da fórmula genealógica preserva a estrutura do hebraico e deixa clara a passagem para o núcleo familiar de Mali.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Nome próprio na forma tradicional e amplamente reconhecida em português.
- source_word: וְקִישׁ
  choice: e Quis
  rationale: A conjunção é traduzida por “e”; o nome próprio segue a forma tradicional em português.
