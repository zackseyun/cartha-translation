  text: מֵ/אֵ֗לֶּה לְ/נַצֵּ֨חַ֙ עַל מְלֶ֣אכֶת בֵּית יְהוָ֔ה עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָ֑לֶף וְ/שֹׁטְרִ֥ים וְ/שֹׁפְטִ֖ים שֵׁ֥שֶׁת אֲלָפִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/004.yaml
  text: Of these, twenty-four thousand were to oversee the work of the house of Yahweh, and six thousand were officers and judges.
translation:
  language: pt
  text: Desses, vinte e quatro mil foram encarregados de supervisionar o trabalho da casa de Yahweh, e seis mil eram oficiais e juízes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵאֵלֶּה
  choice: Desses
  rationale: 'Preserva de modo natural em português o sentido partitivo: trata-se de uma parcela dos levitas mencionados anteriormente.'
- source_word: לְנַצֵּחַ
  choice: foram encarregados de supervisionar
  rationale: O infinitivo piel expressa aqui a função ou designação de dirigir e fiscalizar o trabalho, não liderança musical.
- source_word: עַל מְלֶאכֶת
  choice: o trabalho de
  rationale: Mantém a amplitude de מְלָאכָה, que abrange trabalho, tarefa ou atividade, sem restringir indevidamente a referência ao serviço cultual.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Conserva a imagem hebraica de 'casa' e translitera o nome divino expresso pelo tetragrama, evitando a interpretação adicional de 'templo'.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: vinte e quatro mil
  rationale: Equivalente direto do numeral, escrito por extenso para fluidez no texto corrido.
- source_word: וְשֹׁטְרִים
  choice: oficiais
  rationale: שֹׁטְרִים designa funcionários com atribuições administrativas; 'oficiais' é uma equivalência ampla e estabelecida.
- source_word: וְשֹׁפְטִים
  choice: juízes
  rationale: Equivalente direto para os que exerciam função judicial.
- source_word: שֵׁשֶׁת אֲלָפִים
  choice: seis mil
  rationale: Equivalente direto do numeral, por extenso em coerência com o número anterior.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o tetragrama. 'Yahweh' preserva o nome próprio da aliança, sem substituí-lo por um título; 'Jeová' reflete uma forma híbrida posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção 'foram encarregados de supervisionar' explicita naturalmente o valor de designação do infinitivo hebraico sem acrescentar uma função ausente do texto.
