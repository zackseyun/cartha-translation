base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/022.yaml
  text: Eleazar died and had no sons[a], but only daughters; and the sons of Kish, their brothers[b], married them.
translation:
  language: pt
  text: Eleazar morreu sem ter filhos homens, mas apenas filhas. Os filhos de Quis, irmãos delas[a], casaram-se com elas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “irmãos” provavelmente indica parentes próximos do mesmo clã, não necessariamente irmãos nascidos dos mesmos pais.
    reason: cultural_note
  - marker: b
    text: 'Mais literalmente: “tomaram-nas” — isto é, tomaram-nas por esposas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: morreu
  rationale: O verbo מות significa diretamente “morrer”; a forma simples evita eufemismo.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וְלֹא הָיוּ לוֹ בָּנִים
  choice: sem ter filhos homens
  rationale: Embora בנים possa designar filhos em geral, o contraste explícito com “filhas” exige aqui o sentido masculino.
- source_word: כִּי אִם בָּנוֹת
  choice: mas apenas filhas
  rationale: A expressão כי אם é exceptiva e contrastiva; “mas apenas” comunica o contraste com naturalidade.
- source_word: וַיִּשָּׂאוּם
  choice: casaram-se com elas
  rationale: Nesse contexto, נשׂא com mulheres como objeto significa tomá-las em casamento. A formulação escolhida é clara e idiomática em português moderno.
- source_word: בְּנֵי קִישׁ
  choice: os filhos de Quis
  rationale: Mantém a estrutura genealógica do hebraico e emprega a forma portuguesa tradicional do nome.
- source_word: אֲחֵיהֶם
  choice: irmãos delas
  rationale: Preserva a designação literal de parentesco do texto, sem substituir no corpo do versículo por uma interpretação mais ampla.
