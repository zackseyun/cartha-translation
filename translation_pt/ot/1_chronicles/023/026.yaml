  text: וְ/גַ֖ם לַ/לְוִיִּ֑ם אֵין לָ/שֵׂ֧את אֶת הַ/מִּשְׁכָּ֛ן וְ/אֶת כָּל כֵּלָ֖י/ו לַ/עֲבֹדָתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/026.yaml
  text: And also[a], the Levites no longer need to carry the tabernacle and all its utensils for its service.
translation:
  language: pt
  text: Além disso[a], os levitas já não precisam carregar o tabernáculo e todos os seus utensílios para o serviço dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E também não há necessidade de os levitas carregarem o tabernáculo e todos os seus utensílios para o serviço dele.”'
    reason: 'Alternativa mais formal que preserva a construção existencial do hebraico: “para os levitas, não há [necessidade] de carregar”.'
lexical_decisions:
- source_word: וְגַם
  choice: Além disso
  rationale: Expressa de modo natural tanto a continuidade com a declaração anterior quanto a força aditiva da partícula.
- source_word: לַלְוִיִּם
  choice: os levitas
  rationale: Embora a construção hebraica seja literalmente “para os levitas”, em português o grupo afetado funciona naturalmente como sujeito da oração.
- source_word: אֵין לָשֵׂאת
  choice: já não precisam carregar
  rationale: No contexto da reorganização promovida por Davi, a expressão indica que transportar o tabernáculo deixou de ser necessário, e não que isso passou a ser moralmente proibido.
- source_word: הַמִּשְׁכָּן
  choice: o tabernáculo
  rationale: É o termo português tradicional, reconhecível e preciso para a habitação sagrada móvel de Israel.
- source_word: וְאֶת כָּל כֵּלָיו
  choice: e todos os seus utensílios
  rationale: Preserva a coordenação e a totalidade expressas no hebraico; “utensílios” abrange os objetos e instrumentos ligados ao tabernáculo.
- source_word: לַעֲבֹדָתוֹ
  choice: para o serviço dele
  rationale: Mantém a relação funcional dos utensílios com o serviço do tabernáculo e torna explícito, em português corrente, o referente mais provável do sufixo.
theological_decisions:
- issue: Natureza da dispensa do transporte
  choice: “já não precisam carregar” indica cessação de uma necessidade prática
  alternative: “não devem carregar” poderia indicar uma proibição
  rationale: O contexto afirma que o SENHOR deu descanso e estabeleceu sua habitação em Jerusalém; por isso, o transporte deixou de ser necessário. A formulação evita transformar essa mudança de função em proibição religiosa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Além disso” evita a rigidez de “E também” no texto principal; a nota conserva uma representação mais formal da sintaxe hebraica.
