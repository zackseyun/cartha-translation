base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/001.yaml
  text: David was old and full of days[a], and he made his son Solomon king over Israel.
translation:
  language: pt
  text: Davi era velho e cheio de dias[a], e constituiu seu filho Salomão rei sobre Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “avançado em anos”; literalmente, “velho e cheio de dias”.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָקֵן
  choice: já era velho
  rationale: O qatal descreve o estado de Davi em idade avançada. “Já era velho” é natural em português e, no contexto narrativo, comunica que ele havia chegado à velhice sem acrescentar um marcador temporal independente.
- source_word: וְשָׂבַע יָמִים
  choice: e avançado em dias
  rationale: A expressão hebraica significa literalmente estar saciado ou cheio de dias. “Avançado em dias” conserva parte da imagem e soa digna e compreensível em português; a nota registra a forma mais literal.
- source_word: וַיַּמְלֵךְ
  choice: fez ... rei
  rationale: 'O hifil de מלך tem força causativa: Davi estabeleceu Salomão como rei. “Fez ... rei” preserva essa força sem introduzir uma cerimônia de coroação que o texto não menciona.'
- source_word: אֶת שְׁלֹמֹה בְנוֹ
  choice: seu filho Salomão
  rationale: Esta ordem é idiomática em português e mantém explicitamente a relação filial indicada no hebraico.
- source_word: עַל יִשְׂרָאֵל
  choice: sobre Israel
  rationale: Com linguagem de entronização, עַל indica o povo sobre o qual Salomão passa a reinar. O texto não diz “todo o Israel”, por isso “todo” não foi acrescentado.
- source_word: וְ
  choice: e
  rationale: A conjunção inicial conecta a afirmação ao contexto. Em português, a conexão pode ser expressa naturalmente dentro da frase sem acrescentar “Ora” ou “Então”, que poderiam sugerir uma nuance temporal ou discursiva mais específica.
