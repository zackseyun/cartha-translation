base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/011.yaml
  text: Jahath was the first and Zizah the second[a]; Jeush and Beriah did not have many sons[b], so they became one father’s house for one reckoning.
translation:
  language: pt
  text: Jaate era o primeiro, e Ziza, o segundo[a]. Jeús e Berias não tiveram muitos filhos; por isso, formaram uma só casa paterna, contada como uma única unidade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome Ziza também pode ser transliterado como “Zizá”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “para um só recenseamento” ou “para um só registro”. A expressão indica que essa casa paterna era contada como uma única unidade administrativa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי יַחַת הָרֹאשׁ
  choice: Jaate era o primeiro
  rationale: Neste registro genealógico, היה funciona como cópula, e הָרֹאשׁ, em paralelo com “o segundo”, indica a primeira posição, não necessariamente chefia.
- source_word: זִיזָה הַשֵּׁנִי
  choice: Ziza, o segundo
  rationale: O nome próprio segue a forma portuguesa corrente “Ziza”; o ordinal preserva a ordem expressa no hebraico.
- source_word: וִיעוּשׁ וּבְרִיעָה
  choice: Jeús e Berias
  rationale: Formas portuguesas tradicionais e reconhecíveis dos nomes hebraicos.
- source_word: לֹא הִרְבּוּ בָנִים
  choice: não tiveram muitos filhos
  rationale: Expressa naturalmente o idioma hebraico, literalmente “não multiplicaram filhos”, sem perder a referência à descendência.
- source_word: וַיִּהְיוּ לְבֵית אָב
  choice: formaram uma só casa paterna
  rationale: O singular exigido pelo contexto é explicitado em português; “casa paterna” preserva o termo técnico de parentesco בית אב.
- source_word: לִפְקֻדָּה אֶחָת
  choice: contada como uma única unidade
  rationale: פקדה pode envolver recenseamento, registro ou organização administrativa. A formulação comunica que os dois grupos foram computados conjuntamente sem reduzir o termo a uma simples tarefa.
