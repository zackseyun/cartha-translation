  text: כִּ֣י מַעֲמָדָ֞/ם לְ/יַד בְּנֵ֣י אַהֲרֹ֗ן לַ/עֲבֹדַת֙ בֵּ֣ית יְהוָ֔ה עַל הַ/חֲצֵרוֹת֙ וְ/עַל הַ/לְּשָׁכ֔וֹת וְ/עַֽל טָהֳרַ֖ת לְ/כָל קֹ֑דֶשׁ וּ/מַֽעֲשֵׂ֔ה עֲבֹדַ֖ת בֵּ֥ית הָ/אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/028.yaml
  text: For their duty was to assist the sons of Aaron in the service of the house of Yahweh, concerning the courts and the chambers, and the purification of all that is holy, and the work of the service of the house of God.
translation:
  language: pt
  text: Pois a função deles[a] era auxiliar[b] os filhos de Arão no serviço da casa de Yahweh, quanto aos pátios e às câmaras, à purificação de tudo o que é santo[c] e ao trabalho do serviço da casa de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o posto deles” ou “o encargo deles”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “estar à mão dos filhos de Arão”, isto é, ao lado deles, prestando-lhes auxílio.
    reason: lexical_alternative
  - marker: c
    text: Ou “de cada coisa santa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz uma explicação para a atribuição dos levitas no contexto, preservando de modo natural o valor explicativo da conjunção.
- source_word: מַעֲמָדָם
  choice: a função deles
  rationale: O substantivo indica a posição ou incumbência atribuída aos levitas; “função” comunica o caráter prático do encargo sem reduzi-lo apenas a uma localização.
- source_word: לְיַד בְּנֵי אַהֲרֹן
  choice: auxiliar os filhos de Arão
  rationale: A expressão significa literalmente estar “à mão” ou “ao lado” deles e, neste contexto, descreve serviço de apoio, sem afirmar uma estrutura hierárquica além do que o texto exige.
- source_word: לַעֲבֹדַת בֵּית יְהוָה
  choice: no serviço da casa de Yahweh
  rationale: עֲבֹדָה designa aqui o serviço ligado ao templo; “casa” conserva a imagem hebraica, e o nome divino é transliterado.
- source_word: עַל הַחֲצֵרוֹת וְעַל הַלְּשָׁכוֹת
  choice: quanto aos pátios e às câmaras
  rationale: עַל introduz os âmbitos de responsabilidade. “Quanto a” preserva essa relação sem sugerir necessariamente autoridade sobre esses espaços.
- source_word: וְעַל טָהֳרַת לְכָל קֹדֶשׁ
  choice: à purificação de tudo o que é santo
  rationale: Mantém a amplitude do singular coletivo קֹדֶשׁ e evita especificar objetos que o hebraico não identifica.
- source_word: וּמַעֲשֵׂה עֲבֹדַת בֵּית הָאֱלֹהִים
  choice: e ao trabalho do serviço da casa de Deus
  rationale: Conserva os dois substantivos hebraicos, “trabalho” e “serviço”, refletindo o estilo administrativo e abrangente de Crônicas.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto contém diretamente o tetragrama. “Yahweh” preserva o nome próprio sem substituí-lo por um título.
- issue: Relação dos levitas com os sacerdotes aarônicos em לְיַד בְּנֵי אַהֲרֹן
  choice: auxiliar os filhos de Arão
  alternative: estar ao lado dos filhos de Arão; estar sob a direção dos filhos de Arão
  rationale: “Auxiliar” expressa a função de apoio indicada pelo idioma hebraico, sem impor uma afirmação mais forte sobre autoridade ou hierarquia.
- issue: Alcance de כָּל־קֹדֶשׁ
  choice: tudo o que é santo
  alternative: cada coisa santa; todas as coisas sagradas
  rationale: A formulação conserva o sentido coletivo e a possível abrangência da expressão, sem restringi-la a uma classe específica de objetos rituais.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe mantém o caráter explicativo e administrativo do original, enquanto “quanto aos” evita atribuir a עַל um sentido hierárquico ou locativo excessivamente definido.
