base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/008.yaml
  text: 'The sons of Ladan: Jehiel the head[a], and Zetham and Joel—three.'
translation:
  language: pt
  text: 'Os filhos de Ladã: Jeiel, o chefe[a], Zetã e Joel — três ao todo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o principal” ou “a cabeça”; o hebraico provavelmente identifica Jeiel como o líder ou o primeiro entre os filhos.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Os filhos de
  rationale: É o plural construto de “filhos de”. Embora possa abranger descendentes em genealogias, aqui introduz três nomes e é mais naturalmente traduzido como filhos.
- source_word: לַעְדָּן
  choice: Ladã
  rationale: Forma portuguesa consagrada e legível do nome hebraico.
- source_word: הָרֹאשׁ
  choice: o chefe
  rationale: O substantivo significa literalmente “a cabeça” e, aplicado a uma pessoa, pode indicar o chefe, líder ou principal. “O chefe” preserva melhor essa ideia do que o ordinal “o primeiro”.
- source_word: יְחִיאֵל
  choice: Jeiel
  rationale: Transliteração tradicional e corrente em português bíblico.
- source_word: וְזֵתָם
  choice: Zetã
  rationale: Conjunção hebraica seguida de nome próprio; a coordenação é expressa naturalmente pela enumeração portuguesa.
- source_word: וְיוֹאֵל
  choice: e Joel
  rationale: Conjunção seguida do nome próprio, traduzida diretamente.
- source_word: שְׁלֹשָׁה
  choice: três ao todo
  rationale: O numeral resume explicitamente o total dos nomes apresentados; “ao todo” torna clara em português sua função recapitulativa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas nominais familiares ao leitor brasileiro. A construção concisa conserva o caráter de lista genealógica, enquanto “três ao todo” explicita naturalmente a função resumidora do numeral hebraico.
