  yaml_path: translation/ot/1_chronicles/023/027.yaml
  text: For by the last words of David[a], the sons of Levi were numbered from twenty years old and upward.
translation:
  language: pt
  text: Pois, segundo as últimas palavras de Davi[a], os filhos de Levi foram contados a partir dos vinte anos de idade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pelas últimas palavras de Davi”. O hebraico pode indicar que essa contagem foi feita com base na orientação final de Davi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da afirmação anterior e mantém de modo natural a ligação discursiva.
- source_word: בְּדִבְרֵי דָוִיד הָאַחֲרֹנִים
  choice: segundo as últimas palavras de Davi
  rationale: A preposição בְּ pode indicar a base segundo a qual se realizou a contagem. A formulação preserva a referência às palavras finais de Davi sem explicitar como certeza que se tratava de uma ordem.
- source_word: הֵמָּה מִסְפַּר
  choice: foram contados
  rationale: A construção hebraica é elíptica; no contexto, indica que os levitas foram incluídos na contagem.
- source_word: בְּנֵי לֵוִי
  choice: os filhos de Levi
  rationale: Preserva a expressão genealógica hebraica, usada coletivamente para os descendentes de Levi.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וּלְמָעְלָה
  choice: a partir dos vinte anos de idade
  rationale: Expressa em português natural a faixa etária inclusiva, abrangendo os que tinham vinte anos ou mais.
