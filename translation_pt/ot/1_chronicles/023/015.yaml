  text: 'The sons of Moses: Gershom and Eliezer.'
translation:
  language: pt
  text: 'Os filhos de Moisés: Gérson e Eliézer.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Os filhos de
  rationale: O plural construto de בֵּן introduz aqui uma lista genealógica. “Os filhos de” é direto, natural e mais preciso neste contexto do que “os descendentes de”.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Nome próprio vertido segundo a forma tradicional e amplamente reconhecida em português.
- source_word: גֵּרְשֹׁם
  choice: Gérson
  rationale: Nome do filho de Moisés, apresentado na forma tradicional em português. Embora coincida em português com a forma geralmente usada para outro nome hebraico semelhante, o contexto identifica claramente este indivíduo.
- source_word: וֶ/אֱלִיעֶזֶר
  choice: e Eliézer
  rationale: A conjunção ו é aditiva e foi traduzida por “e”. אֱלִיעֶזֶר é vertido pela forma portuguesa tradicional “Eliézer”, sem confundi-lo com Eleazar, nome distinto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura nominal concisa que preserva o formato genealógico do hebraico. Os nomes seguem formas bíblicas tradicionais e legíveis em português.
