  language: en
  yaml_path: translation/ot/1_chronicles/012/028.yaml
  text: and Jehoiada[a], the leader of Aaron, and with him three thousand seven hundred.
translation:
  language: pt
  text: e Joiada, o líder de Arão,[a] e com ele três mil e setecentos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “líder para Arão”, isto é, o chefe ligado à casa sacerdotal aarônica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִ/יהוֹיָדָע
  choice: e Joiada
  rationale: O ו conjuntivo dá continuidade à lista e é representado por “e”; o nome יהוידע recebe a forma portuguesa tradicional “Joiada”.
- source_word: הַ/נָּגִיד
  choice: líder
  rationale: נָגִיד designa um líder, chefe ou governante; “líder” é natural no português atual e não sugere necessariamente realeza.
- source_word: לְ/אַהֲרֹן
  choice: da casa de Arão
  rationale: O ל indica aqui relação ou pertencimento. A explicitação “casa de” comunica naturalmente a vinculação à linhagem sacerdotal de Arão, sem identificar Arão como contemporâneo de Joiada.
- source_word: וְ/עִמּ/וֹ
  choice: e com ele
  rationale: Preserva a coordenação e introduz o contingente que acompanhava Joiada.
- source_word: שְׁלֹשֶׁת אֲלָפִים וּ/שְׁבַע מֵאוֹת
  choice: três mil e setecentos homens
  rationale: Mantém o número exato; “homens” é uma explicitação contextual natural do contingente enumerado.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva o estilo coordenado da lista. “Casa de Arão” torna explícita a relação de pertencimento implícita no hebraico; a nota preserva a alternativa mais formal.
