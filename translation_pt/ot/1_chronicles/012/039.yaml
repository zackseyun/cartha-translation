  text: כָּל אֵ֜לֶּה אַנְשֵׁ֣י מִלְחָמָה֮ עֹדְרֵ֣י מַעֲרָכָה֒ בְּ/לֵבָ֤ב שָׁלֵם֙ בָּ֣אוּ חֶבְר֔וֹנָ/ה לְ/הַמְלִ֥יךְ אֶת דָּוִ֖יד עַל כָּל יִשְׂרָאֵ֑ל וְ֠/גַם כָּל שֵׁרִ֧ית יִשְׂרָאֵ֛ל לֵ֥ב אֶחָ֖ד לְ/הַמְלִ֥יךְ אֶת דָּוִֽיד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/039.yaml
  text: All these were men of war[a], arrayed for battle, who came to Hebron with a whole heart to make David king over all Israel; and also all the rest of Israel were of one heart to make David king.
translation:
  language: pt
  text: Todos estes eram homens de guerra, em ordem de batalha; foram a Hebrom com coração íntegro, para constituir Davi rei sobre todo Israel. Também todo o restante de Israel[a] tinha um só coração para constituir Davi rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todo o remanescente de Israel”. Neste contexto, o sentido mais provável é “todo o restante de Israel”, e não o uso profético-teológico de “remanescente”.
    reason: Alternativa lexical para שְׁאֵרִית e esclarecimento de sua provável função contextual.
lexical_decisions:
- source_word: אַנְשֵׁי מִלְחָמָה
  choice: homens de guerra
  rationale: Reproduz de modo transparente a construção masculina hebraica e seu sentido militar, sem perder a dignidade do registro narrativo.
- source_word: עֹדְרֵי מַעֲרָכָה
  choice: dispostos em formação de batalha
  rationale: Expressa a ideia participial de organizar ou ocupar uma linha de combate; é mais específica que simplesmente 'prontos para a batalha'.
- source_word: בְּלֵבָב שָׁלֵם
  choice: de coração inteiro
  rationale: Mantém a imagem do coração e a noção de integridade ou inteireza da intenção, sem restringi-la apenas a lealdade ou entusiasmo.
- source_word: בָּאוּ חֶבְרוֹנָה
  choice: foram a Hebrom
  rationale: O he direcional indica movimento rumo a Hebrom. Em português narrativo, 'foram a' comunica esse movimento com naturalidade.
- source_word: לְהַמְלִיךְ אֶת דָּוִיד
  choice: para fazer Davi rei
  rationale: Traduz diretamente o hifil de מלך, que aqui significa levar Davi a reinar ou instituí-lo como rei, sem acrescentar uma cerimônia de coroação não explicitada.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: sobre todo o Israel
  rationale: Formulação portuguesa natural para o domínio régio sobre a totalidade da nação.
- source_word: כָּל שֵׁרִית יִשְׂרָאֵל
  choice: todo o restante de Israel
  rationale: No contexto narrativo, refere-se aos israelitas que não faziam parte dos grupos recém-enumerados. 'Restante' evita impor aqui o sentido teológico técnico que 'remanescente' pode adquirir.
- source_word: לֵב אֶחָד
  choice: tinha um só coração
  rationale: Preserva a metáfora hebraica de unidade de intenção e produz uma frase clara e natural em português.
theological_decisions:
- issue: Possíveis conotações teológicas de שֵׁרִית ('remanescente')
  choice: todo o restante de Israel
  alternative: todo o remanescente de Israel
  rationale: Embora שֵׁרִית possa ter importância teológica, especialmente nos profetas, aqui resume o apoio nacional a Davi e designa os demais israelitas. A tradução contextual evita introduzir uma teologia técnica do remanescente que o versículo não destaca, enquanto a nota preserva a alternativa lexical.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. As imagens hebraicas do coração foram preservadas; a sintaxe foi ajustada apenas o necessário para fluência em português.
