base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/003.yaml
  text: The chief was Ahiezer[a], then Joash, the sons of Shemaah the Gibeathite; and Jeziel and Pelet, the sons of Azmaveth[b]; and Beracah and Jehu the Anathothite.
translation:
  language: pt
  text: O chefe era Aiezer, e Joás, ambos filhos de Semaá, o gibeatita; Jeziel e Pelete, filhos de Azmavete; e Beraca e Jeú, o anatotita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: O chefe era
  rationale: Neste contexto de lista, רֹאשׁ designa o principal ou líder; a cópula é acrescentada para produzir português natural.
- source_word: אֲחִיעֶזֶר
  choice: Aiezer
  rationale: Transliteração portuguesa corrente do nome hebraico.
- source_word: וְיוֹאָשׁ
  choice: depois, Joás
  rationale: O hebraico traz a conjunção simples 'e'; 'depois' torna clara a sequência da lista sem alterar sua relação básica.
- source_word: בְּנֵי הַשְּׁמָעָה
  choice: ambos filhos de Semaá
  rationale: בְּנֵי indica filiação no plural. 'Ambos' esclarece em português que Aiezer e Joás são os dois filhos mencionados.
- source_word: הַגִּבְעָתִי
  choice: o gibeatita
  rationale: Gentílico que identifica Semaá como natural ou habitante de Gibeá.
- source_word: ויזואל
  choice: Jeziel
  rationale: Forma consonantal do nome, aqui transliterada segundo o uso bíblico português corrente.
- source_word: וָפֶלֶט
  choice: e Pelete
  rationale: Transliteração direta do nome próprio, com a conjunção preservada.
- source_word: בְּנֵי עַזְמָוֶת
  choice: filhos de Azmavete
  rationale: Construção genealógica padrão, traduzida diretamente.
- source_word: וּבְרָכָה
  choice: e ainda Beraca
  rationale: Transliteração portuguesa do nome; 'ainda' ajuda a marcar a continuação da lista.
- source_word: וְיֵהוּא
  choice: e Jeú
  rationale: Transliteração portuguesa consagrada do nome próprio.
- source_word: הָעֲנְּתֹתִי
  choice: o anatotita
  rationale: Gentílico derivado de Anatote, mantido em forma compacta como no hebraico.
