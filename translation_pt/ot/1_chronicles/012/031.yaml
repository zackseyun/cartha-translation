base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/031.yaml
  text: And from the sons of Ephraim[a], twenty thousand eight hundred mighty men of valor, men of renown according to their fathers’ houses.
translation:
  language: pt
  text: E dos filhos de Efraim, vinte mil e oitocentos guerreiros valentes, homens de renome[a], segundo suas casas paternas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «homens de nomes», expressão que significa homens notáveis ou bem conhecidos; também pode ser traduzido por «homens ilustres».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: E dos
  rationale: A conjunção e a preposição dão continuidade à enumeração tribal do contexto; «E dos» preserva essa ligação.
- source_word: בְּנֵי אֶפְרַיִם
  choice: filhos de Efraim
  rationale: Mantém a forma genealógica do hebraico, que neste contexto designa os membros ou descendentes da tribo de Efraim.
- source_word: עֶשְׂרִים אֶלֶף וּשְׁמוֹנֶה מֵאוֹת
  choice: vinte mil e oitocentos
  rationale: Reproduz por extenso e com exatidão o número 20.800.
- source_word: גִּבּוֹרֵי חַיִל
  choice: guerreiros valentes
  rationale: Expressa de modo natural tanto o sentido militar quanto a ideia de força, capacidade e coragem presente na expressão hebraica.
- source_word: אַנְשֵׁי שֵׁמוֹת
  choice: homens de renome
  rationale: O hebraísmo literal «homens de nomes» refere-se a pessoas notáveis ou bem conhecidas; «homens de renome» conserva seu caráter honorífico.
- source_word: לְבֵית אֲבוֹתָם
  choice: segundo suas casas paternas
  rationale: Preserva a classificação por unidades ancestrais ou clãs indicada pelo hebraico, em linguagem formal e compreensível.
