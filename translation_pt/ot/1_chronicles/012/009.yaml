  text: וּ/מִן הַ/גָּדִ֡י נִבְדְּל֣וּ אֶל דָּוִיד֩ לַ/מְצַ֨ד מִדְבָּ֜רָ/ה גִּבֹּרֵ֣י הַ/חַ֗יִל אַנְשֵׁ֤י צָבָא֙ לַ/מִּלְחָמָ֔ה עֹרְכֵ֥י צִנָּ֖ה וָ/רֹ֑מַח וּ/פְנֵ֤י אַרְיֵה֙ פְּנֵי/הֶ֔ם וְ/כִ/צְבָאיִ֥ם עַל הֶ/הָרִ֖ים לְ/מַהֵֽר־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/009.yaml
  text: Some of the Gadites separated themselves to David at the stronghold in the wilderness[a], mighty warriors, men of the army for battle, able to handle shield and spear, whose faces were like the faces of lions[c][b], and who were as swift as gazelles on the mountains.
translation:
  language: pt
  text: Alguns dos gaditas se separaram para ir até Davi, na fortaleza do deserto[a]. Eram guerreiros valentes, homens de guerra preparados para a batalha, capazes de manejar escudo e lança[b]. Tinham o rosto como o de leões e eram velozes como gazelas nos montes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “rumo à fortaleza no deserto”. A sequência de preposições em hebraico pode indicar tanto a chegada à fortaleza como o movimento em direção a ela.'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “que dispunham escudo e lança”. A expressão descreve homens preparados e habilidosos para o combate.
    reason: lexical_alternative
  - marker: c
    text: 'A construção hebraica também pode ser traduzida: “como gazelas nos montes, rápidos para se mover”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַגָּדִי
  choice: Alguns dos gaditas
  rationale: A construção indica que se tratava de uma parte dos membros da tribo de Gade, não da tribo inteira.
- source_word: נִבְדְּלוּ אֶל דָּוִיד
  choice: se separaram para ir até Davi
  rationale: Preserva a ideia de separação expressa pelo nifal de בדל e o movimento em direção a Davi, sem explicitar além do texto de quem se separaram nem formular uma motivação.
- source_word: לַמְצַד מִדְבָּרָה
  choice: na fortaleza do deserto
  rationale: מְצַד designa uma fortaleza ou reduto. A formulação locativa é natural no contexto, enquanto a possível leitura direcional é registrada em nota.
- source_word: גִּבֹּרֵי הַחַיִל
  choice: guerreiros valentes
  rationale: Expressa de modo atual e digno a força e a capacidade militar da locução hebraica, sem recorrer ao arcaísmo 'homens de valor'.
- source_word: אַנְשֵׁי צָבָא לַמִּלְחָמָה
  choice: homens de guerra preparados para a batalha
  rationale: Mantém a identidade militar e a prontidão para o combate, evitando a formulação pouco natural 'homens do exército para a guerra'.
- source_word: עֹרְכֵי צִנָּה וָרֹמַח
  choice: capazes de manejar escudo e lança
  rationale: No contexto militar, o particípio de ערך descreve homens que dispõem ou preparam essas armas para o combate; 'manejar' comunica com naturalidade sua aptidão guerreira.
- source_word: וּפְנֵי אַרְיֵה פְּנֵיהֶם
  choice: Tinham o rosto como o de leões
  rationale: Conserva a comparação leonina e parte da repetição enfática de 'rosto', mas com sintaxe portuguesa natural.
- source_word: וְכִצְבָאִים עַל הֶהָרִים לְמַהֵר
  choice: eram velozes como gazelas nos montes
  rationale: Integra o infinitivo לְמַהֵר à comparação, tornando explícita a rapidez evocada pelas gazelas sem perder a imagem do terreno montanhoso.
