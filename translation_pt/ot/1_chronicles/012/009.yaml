  source_fidelity: 'O texto português transmite com fidelidade os elementos centrais do hebraico: um grupo dos gaditas se separa e vai a Davi, ligado à fortaleza no deserto; são combatentes valentes, preparados para o confronto e associados a escudo e lança; sua aparência é comparada à de leões e sua rapidez à das gazelas nos montes. “Se separaram para ir até Davi” mantém a separação e o movimento direcional sem especificar de quem se separaram. As notas preservam de modo adequado a ambiguidade da relação com a fortaleza e esclarecem as expressões militares e a comparação final.'
