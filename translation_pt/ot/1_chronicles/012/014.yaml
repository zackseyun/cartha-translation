base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/014.yaml
  text: Jeremiah the tenth[a], Machbannai the eleventh.
translation:
  language: pt
  text: Jeremias, o décimo; Macbanai, o décimo primeiro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, «onze»; neste contexto de lista, a expressão tem o sentido de «o décimo primeiro».
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְמְיָהוּ
  choice: Jeremias
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico Yirmeyahu.
- source_word: הָעֲשִׂירִי
  choice: o décimo
  rationale: Adjetivo ordinal definido, usado em aposição numa lista ordenada; em português, o artigo definido expressa naturalmente essa função.
- source_word: מַכְבַּנַּי
  choice: Macbanai
  rationale: Transliteração do nome próprio hebraico adaptada à ortografia portuguesa, preservando de modo legível sua estrutura consonantal.
- source_word: עַשְׁתֵּי עָשָׂר
  choice: o décimo primeiro
  rationale: A expressão hebraica é literalmente o cardinal «onze», mas, em paralelo com «o décimo» e no contexto desta lista, desempenha função ordinal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas de nomes bíblicos reconhecíveis. O ponto e vírgula conserva a estrutura compacta da lista. A nota preserva a diferença entre a forma cardinal do hebraico e sua função ordinal no contexto.
