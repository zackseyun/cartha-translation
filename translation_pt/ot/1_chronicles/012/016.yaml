  verdict: revise
  source_fidelity: A tradução transmite corretamente a travessia do Jordão, a cheia no primeiro mês, a ação de pôr em fuga e a abrangência para leste e oeste. A metonímia de «todos os vales» é esclarecida de forma adequada pela nota.
  naturalness: O texto é claro e de registro apropriado. Contudo, «Estes foram os homens» altera desnecessariamente a fórmula identificadora no presente do hebraico; «Estes são os homens» é mais fiel e natural. «Transbordava por todas as suas margens» é menos idiomático do que «transbordava sobre todas as suas margens».
  terminology: «Jordão», «primeiro mês», «puseram em fuga», «vales», «leste» e «oeste» são escolhas adequadas. A nota preserva apropriadamente a formulação literal hebraica e explica a metonímia sem impor interpretação teológica.
