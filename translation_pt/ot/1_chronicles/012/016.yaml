base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/016.yaml
  text: These are the men who crossed the Jordan in the first month[a], when it was overflowing all its banks, and they put to flight all those in the valleys, to the east and to the west.
translation:
  language: pt
  text: Estes são os homens que atravessaram o Jordão no primeiro mês, quando ele transbordava sobre todas as suas margens. Eles puseram em fuga todos os que estavam nos vales[a], tanto a leste como a oeste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “todos os vales”; pelo sentido do verbo, a expressão se refere às pessoas que estavam nos vales.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה הֵם
  choice: Estes foram os homens
  rationale: A fórmula enfática identifica pessoas já conhecidas pelo contexto. “Os homens” explicita de modo natural que se trata dos guerreiros mencionados no trecho, sem alterar o referente.
- source_word: אֲשֶׁר עָבְרוּ אֶת הַיַּרְדֵּן
  choice: que atravessaram o Jordão
  rationale: עָבַר significa aqui atravessar ou passar para o outro lado; “atravessaram o Jordão” é a formulação corrente e concreta em português.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: no primeiro mês
  rationale: Tradução direta da expressão temporal hebraica, preservando o modo bíblico de designar o mês sem acrescentar uma identificação calendárica não expressa no texto.
- source_word: וְהוּא מְמַלֵּא עַל כָּל גְּדִיתָיו
  choice: quando ele transbordava por todas as suas margens
  rationale: A oração descreve o Jordão em época de cheia. A formulação portuguesa comunica que suas águas ultrapassavam as margens e mantém a referência a todas elas.
- source_word: וַיַּבְרִיחוּ
  choice: Eles puseram em fuga
  rationale: 'O hifil de ברח tem sentido causativo: fazer fugir. “Puseram em fuga” preserva a ação militar sem exagerá-la como destruição completa.'
- source_word: אֶת כָּל הָעֲמָקִים
  choice: todos os que estavam nos vales
  rationale: O hebraico diz literalmente “todos os vales”, mas o verbo exige seres capazes de fugir. A tradução torna explícita a metonímia, deixando a forma literal registrada em nota.
- source_word: לַמִּזְרָח וְלַמַּעֲרָב
  choice: tanto a leste como a oeste
  rationale: Expressa de maneira natural em português a extensão espacial indicada pelas duas direções, sem decidir além do necessário se elas qualificam estritamente os vales ou a fuga.
theological_decisions: []
