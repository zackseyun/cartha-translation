  text: מִ/זְּבֻל֞וּן יוֹצְאֵ֣י צָבָ֗א עֹרְכֵ֧י מִלְחָמָ֛ה בְּ/כָל כְּלֵ֥י מִלְחָמָ֖ה חֲמִשִּׁ֣ים אָ֑לֶף וְ/לַ/עֲדֹ֖ר בְּ/לֹא לֵ֥ב וָ/לֵֽב־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/034.yaml
  text: From Zebulun[a], fifty thousand men fit for military service, prepared for battle with every kind of weapon of war[b], to help without a divided heart.
translation:
  language: pt
  text: De Zebulom, cinquenta mil homens aptos para o serviço militar, preparados para a batalha com todo tipo de arma de guerra, para prestar apoio[a] sem o coração dividido[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para se juntarem às fileiras”. O verbo hebraico é raro neste contexto e pode se referir a prestar apoio ou a integrar ordenadamente as fileiras.
    reason: alternative_reading
  - marker: b
    text: Literalmente, “sem coração e coração”, expressão hebraica que indica ausência de lealdade dividida ou duplicidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְּבֻלוּן
  choice: De Zebulom
  rationale: 'A preposição מִן indica origem: esse contingente vinha da tribo de Zebulom.'
- source_word: יוֹצְאֵי צָבָא
  choice: homens aptos para o serviço militar
  rationale: A expressão designa os que estavam disponíveis ou habilitados para servir no exército, e não meramente os que saíam fisicamente.
- source_word: עֹרְכֵי מִלְחָמָה
  choice: preparados para a batalha
  rationale: O particípio de ערך descreve a disposição ou organização para o combate; a tradução comunica prontidão militar em português natural.
- source_word: בְּכָל כְּלֵי מִלְחָמָה
  choice: com todo tipo de arma de guerra
  rationale: כְּלֵי מִלְחָמָה abrange armas ou equipamento militar; “todo tipo de” expressa a abrangência de בְּכָל sem sugerir necessariamente cada objeto individual.
- source_word: חֲמִשִּׁים אָלֶף
  choice: cinquenta mil
  rationale: Tradução direta do numeral cardinal.
- source_word: וְלַעֲדֹר
  choice: para prestar apoio
  rationale: O verbo é raro e seu sentido exato neste contexto é incerto. “Prestar apoio” conserva a ideia contextual de se juntar solidariamente à causa, sem impor uma tecnicidade militar duvidosa.
- source_word: בְּלֹא לֵב וָלֵב
  choice: sem o coração dividido
  rationale: A expressão literalmente fala de “coração e coração” e indica lealdade dividida ou duplicidade. A formulação mantém a imagem hebraica do coração e torna o idioma compreensível.
theological_decisions:
- issue: Natureza do apoio prestado pelo contingente
  choice: para prestar apoio
  alternative: para se juntar às fileiras
  rationale: O raro verbo וְלַעֲדֹר permite mais de uma nuance. A tradução principal não especifica além da evidência se a ação era tecnicamente formar fileiras ou, de modo mais amplo, apoiar a causa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conservou-se a imagem bíblica do coração, enquanto o idioma hebraico foi explicitado de forma inteligível.
