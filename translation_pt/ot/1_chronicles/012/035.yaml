base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/035.yaml
  text: 'From Naphtali: 1,000 commanders[b][a], and with them 37,000 with shield and spear.'
translation:
  language: pt
  text: 'De Naftali: 1.000 comandantes[a] e, com eles, 37.000 com escudo[b] e lança.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chefes”, “líderes” ou “capitães”.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico pode designar especificamente um escudo grande.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִנַּפְתָּלִי
  choice: De Naftali
  rationale: Em uma enumeração tribal, a forma concisa e natural em português preserva a ideia de procedência; o וּ funciona como ligação com a lista anterior.
- source_word: שָׂרִים
  choice: comandantes
  rationale: O termo designa chefes, oficiais ou líderes; no contexto militar, “comandantes” comunica com clareza sua função sem definir um posto técnico específico.
- source_word: אָלֶף
  choice: '1.000'
  rationale: O numeral é apresentado em algarismos para facilitar a leitura e manter o estilo de recenseamento militar.
- source_word: וְעִמָּהֶם
  choice: e, com eles
  rationale: Preserva tanto a coordenação expressa pela conjunção quanto a relação entre os comandantes e o contingente que os acompanha.
- source_word: בְּצִנָּה
  choice: armados de escudo
  rationale: A preposição indica equipamento ou porte; “armados de” torna explícita e natural em português a relação com o contingente, enquanto “escudo” preserva o sentido básico do substantivo.
- source_word: וַחֲנִית
  choice: e lança
  rationale: “Lança” é o equivalente português corrente e direto para a arma indicada.
- source_word: שְׁלֹשִׁים וְשִׁבְעָה אָלֶף
  choice: '37.000'
  rationale: O número é apresentado em algarismos, de modo coerente com o primeiro numeral e adequado a uma lista militar.
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e digno, com pontuação de lista e numerais no padrão gráfico de ampla legibilidade brasileira. A expressão “homens armados de” é uma explicitação contextual mínima: o hebraico traz literalmente “com escudo e lança”, referindo-se ao contingente de 37.000.'
