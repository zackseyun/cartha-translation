base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/002.yaml
  text: They were archers[a], able to use both the right hand and the left in hurling stones and shooting arrows with the bow; they were from Saul’s brothers, from Benjamin.
translation:
  language: pt
  text: Estavam armados com arcos e sabiam usar tanto a mão direita como a esquerda para lançar pedras e disparar flechas com o arco; eram dos irmãos[a] de Saul, da tribo de Benjamim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “parentes de Saul” ou “familiares de Saul”. A palavra hebraica traduzida como “irmãos” também pode designar membros de uma família mais ampla ou da mesma tribo.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשְׁקֵי קֶשֶׁת
  choice: armados com arcos
  rationale: Reproduz de perto a construção participial hebraica, que descreve homens equipados com o arco, sem restringir o sentido apenas à função de arqueiros.
- source_word: מַיְמִינִים וּמַשְׂמִאלִים
  choice: sabiam usar tanto a mão direita como a esquerda
  rationale: Expressa em português natural a habilidade funcional com ambas as mãos indicada pelos particípios hebraicos.
- source_word: בָּאֲבָנִים
  choice: para lançar pedras
  rationale: Explicita a ação militar implícita no uso de pedras, sem acrescentar uma funda, que não é mencionada no texto.
- source_word: וּבַחִצִּים בַּקָּשֶׁת
  choice: e disparar flechas com o arco
  rationale: Comunica claramente o uso das flechas por meio do arco e mantém o paralelismo com o lançamento de pedras.
- source_word: מֵאֲחֵי שָׁאוּל
  choice: dos irmãos de Saul
  rationale: Mantém o sentido lexical direto de אָח, enquanto a nota registra que, neste contexto tribal, o termo pode designar parentes ou membros do mesmo grupo familiar.
- source_word: מִבִּנְיָמִן
  choice: da tribo de Benjamim
  rationale: Torna explícita a procedência tribal indicada por Benjamim, produzindo uma formulação clara e idiomática em português.
