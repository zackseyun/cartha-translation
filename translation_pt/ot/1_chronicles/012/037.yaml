  yaml_path: translation/ot/1_chronicles/012/037.yaml
  text: And from Asher[a], forty thousand who went out for military service, to array themselves for battle.
translation:
  language: pt
  text: E de Aser, quarenta mil que saíam para o serviço militar, a fim de se posicionarem em formação de batalha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «quarenta mil aptos a se posicionar para a guerra». O hebraico combina a ideia de sair para o serviço militar com um verbo que significa organizar ou dispor em formação de batalha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֵ/אָשֵׁר
  choice: E de Aser
  rationale: Preserva tanto a conjunção quanto a preposição hebraicas e mantém Aser como nome tribal, sem explicitar desnecessariamente «tribo».
- source_word: יוֹצְאֵי צָבָא
  choice: que saíam para o serviço militar
  rationale: A combinação designa os que saíam ou se apresentavam para o serviço organizado de guerra; a formulação mantém o valor participial e é clara em português atual.
- source_word: לַ/עֲרֹךְ מִלְחָמָה
  choice: a fim de se posicionarem em formação de batalha
  rationale: Em contexto militar, ערך indica dispor ou pôr tropas em ordem; a construção reflexiva expressa naturalmente que esses homens tomavam posição para a batalha.
- source_word: אַרְבָּעִים אָלֶף
  choice: quarenta mil
  rationale: Tradução direta da expressão numérica hebraica.
