  text: בְּ/לֶכְתּ֣/וֹ אֶל צִֽיקְלַ֗ג נָפְל֣וּ עָלָ֣י/ו מִֽ/מְּנַשֶּׁ֡ה עַ֠דְנַח וְ/יוֹזָבָ֤ד וִ/ידִֽיעֲאֵל֙ וּ/מִיכָאֵ֣ל וְ/יוֹזָבָ֔ד וֶ/אֱלִיה֖וּא וְ/צִלְּתָ֑י רָאשֵׁ֥י הָ/אֲלָפִ֖ים אֲשֶׁ֥ר לִ/מְנַשֶּֽׁה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/021.yaml
  text: 'As he went to Ziklag[a], some from Manasseh defected to him: Adnah, Jozabad, Jediael, Michael, another Jozabad, Elihu, and Zillethai[c][b], chiefs of the thousands that belonged to Manasseh.'
translation:
  language: pt
  text: 'Quando ele ia para Ziclague, alguns homens de Manassés passaram para o lado dele[a]: Adná, Jozabade, Jediael, Micael, outro Jozabade[b], Eliú e Ziletai, chefes dos milhares[c] de Manassés.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “caíram sobre ele”, expressão idiomática que significa que passaram para o lado de Davi.
    reason: lexical_alternative
  - marker: b
    text: O nome Jozabade aparece duas vezes na lista hebraica, indicando dois homens diferentes com o mesmo nome.
    reason: cultural_note
  - marker: c
    text: “Chefes dos milhares” pode designar comandantes de unidades militares ou líderes de divisões de clãs de Manassés.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֶכְתּוֹ
  choice: Quando ele ia
  rationale: A preposição בְּ com o infinitivo construto de הלך e sufixo pronominal tem valor temporal. A formulação é natural em português e conserva a referência circunstancial sem rigidez literal.
- source_word: אֶל צִיקְלַג
  choice: para Ziclague
  rationale: אֶל indica movimento em direção a um destino; “para Ziclague” é a formulação idiomática neste contexto.
- source_word: נָפְלוּ עָלָיו
  choice: passaram para o lado dele
  rationale: A expressão idiomática, em contexto político-militar, indica mudança de lealdade. A escolha comunica isso claramente sem reproduzir o literal pouco inteligível “caíram sobre ele”.
- source_word: מִמְּנַשֶּׁה
  choice: alguns homens de Manassés
  rationale: A preposição מִן marca a origem tribal. “Alguns homens” torna explícito em português o referente humano já indicado pelos nomes, sem alterar o sentido.
- source_word: עַדְנַח וְיוֹזָבָד וִידִיעֲאֵל וּמִיכָאֵל וְיוֹזָבָד וֶאֱלִיהוּא וְצִלְּתָי
  choice: Adná, Jozabade, Jediael, Micael, outro Jozabade, Eliú e Ziletai
  rationale: Os nomes são transliterados em formas correntes em português. “Outro” esclarece que o texto hebraico repete Jozabade e se refere a dois homens distintos, sem emendar a lista.
- source_word: רָאשֵׁי הָאֲלָפִים
  choice: chefes dos milhares
  rationale: 'A tradução mantém a expressão hebraica e sua ambiguidade: אֲלָפִים pode designar unidades militares de mil homens ou divisões de clãs.'
- source_word: אֲשֶׁר לִמְנַשֶּׁה
  choice: de Manassés
  rationale: A construção indica que esses grupos ou divisões pertenciam a Manassés. A formulação concisa é natural e não especifica além do hebraico.
