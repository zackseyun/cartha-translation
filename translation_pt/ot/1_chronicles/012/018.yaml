  to: 'Davi foi ao encontro deles e respondeu, dizendo: “Se vocês vieram em paz para me ajudar, meu coração estará unido a vocês; mas, se vieram para me trair em favor dos meus inimigos[a], embora não haja violência em minhas mãos, que o Deus de nossos pais veja e julgue[b].”'
  rationale: A revisão substitui uma expressão espacial pouco natural por uma formulação idiomática contextual e remove a explicitação indevida de «entregar». «Em favor dos meus inimigos» mantém a relação indicada pela preposição hebraica sem afirmar uma ação adicional. Também ajusta «se unirá» para «estará unido», que comunica com mais naturalidade o estado de solidariedade expresso pelo idiomatismo hebraico.
