  naturalness: «Para diante deles» não é uma formulação natural em português moderno. «Foi ao encontro deles» comunica de maneira idiomática o movimento de Davi para a presença do grupo no contexto narrativo.
  terminology: «Davi», «em paz», «me ajudar», «coração ... unido», «violência em minhas mãos», «Deus de nossos pais» e «julgue» são adequados. A nota sobre «trair» preserva corretamente a alternativa lexical.
