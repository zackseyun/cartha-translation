base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/018.yaml
  text: David went out before them and answered and said to them[a], “If you have come to me in peace to help me, my heart will be united with you; but if you have come to betray me to my enemies, though there is no violence in my hands[b], may the God of our fathers see and judge.”
translation:
  language: pt
  text: 'Davi foi ao encontro deles e respondeu, dizendo: “Se vocês vieram em paz para me ajudar, meu coração estará unido a vocês; mas, se vieram para me trair em favor dos meus inimigos[a], embora não haja violência em minhas mãos, que o Deus de nossos pais veja e julgue[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “me enganar”. O verbo hebraico pode indicar engano traiçoeiro; “trair” foi usado por causa do contexto de hostilidade dos inimigos.
    reason: lexical_alternative
  - marker: b
    text: Ou “veja e repreenda” ou “veja e decida”. O verbo final pode ter o sentido de repreender, arbitrar uma causa ou emitir uma decisão.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא דָוִיד לִפְנֵיהֶם
  choice: Davi saiu para diante deles
  rationale: Mantém o movimento expresso por יצא e o sentido espacial de לִפְנֵיהֶם sem acrescentar explicitamente a ideia interpretativa de que saiu “ao encontro” deles.
- source_word: וַיַּעַן וַיֹּאמֶר לָהֶם
  choice: respondeu, dizendo
  rationale: Conserva os dois verbos da fórmula narrativa hebraica em uma construção natural no português atual.
- source_word: אִם לְשָׁלוֹם בָּאתֶם אֵלַי לְעָזְרֵנִי
  choice: Se vocês vieram em paz para me ajudar
  rationale: “Em paz” reproduz de modo direto לְשָׁלוֹם, e o infinitivo “para me ajudar” expressa claramente a finalidade.
- source_word: יִהְיֶה לִּי עֲלֵיכֶם לֵבָב לְיָחַד
  choice: meu coração se unirá a vocês
  rationale: A expressão hebraica é idiomática e comunica solidariedade de coração. A formulação portuguesa preserva a imagem do coração e transmite união leal sem rigidez artificial.
- source_word: לְרַמּוֹתַנִי
  choice: para me trair
  rationale: O piel de רמה pode indicar engano traiçoeiro. Neste contexto político-militar, em que Davi teme ser entregue aos adversários, “trair” comunica melhor a força contextual, enquanto a alternativa “enganar” é preservada em nota.
- source_word: לְצָרַי
  choice: entregando-me aos meus inimigos
  rationale: A preposição indica movimento ou transferência para os inimigos. “Entregando-me” explicita naturalmente em português a relação implícita no contexto, sem alterar a natureza da ameaça.
- source_word: בְּלֹא חָמָס בְּכַפַּי
  choice: embora não haja violência em minhas mãos
  rationale: Preserva tanto חָמָס como “violência” quanto a imagem hebraica das mãos como esfera de ação e culpa. “Embora” torna explícita a força concessiva exigida pelo contexto.
- source_word: יֵרֶא אֱלֹהֵי אֲבוֹתֵינוּ
  choice: que o Deus de nossos pais veja
  rationale: A construção com “que” comunica o valor volitivo ou de apelo dos imperfeitos no contexto, sem convertê-los em previsão categórica. “Nossos pais” conserva a expressão pactual e a forma masculina do hebraico.
- source_word: וְיוֹכַח
  choice: e julgue
  rationale: O verbo יכח pode significar repreender, decidir uma causa ou arbitrar. “Julgue” se ajusta ao apelo forense para que Deus examine a inocência e a traição alegada, sem eliminar as alternativas lexicais indicadas em nota.
theological_decisions:
- issue: Ação divina no apelo final
  choice: que o Deus de nossos pais veja e julgue
  alternative: o Deus de nossos pais verá e julgará; que o Deus de nossos pais veja e repreenda
  rationale: Os imperfeitos hebraicos, após a condição sobre uma possível traição, são entendidos naturalmente como apelo solene à decisão divina. A tradução evita transformá-los em promessa preditiva e mantém em nota a amplitude do verbo final.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com tratamento por “vocês” para boa legibilidade brasileira e compreensão internacional. A sintaxe narrativa foi suavemente ajustada sem omitir os dois verbos hebraicos. As notas estão posicionadas junto aos termos a que efetivamente se referem.
