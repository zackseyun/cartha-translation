  register: Português atual, digno e acessível, com terminologia militar clara. A estrutura coordenada e elíptica do hebraico foi preservada por fazer parte de uma lista maior; “família paterna” torna compreensível o antigo idioma social sem eliminar suas alternativas, registradas em nota.
