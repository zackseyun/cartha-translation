base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/029.yaml
  text: And Zadok[a], a young man mighty in valor[b], and from his father’s house twenty-two commanders.
translation:
  language: pt
  text: E Zadoque, jovem e valente guerreiro, e vinte e dois comandantes de sua casa paterna.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de sua casa ancestral” ou “de seu clã”.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָדוֹק
  choice: Zadoque
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico, adequada à legibilidade moderna.
- source_word: נַעַר
  choice: jovem
  rationale: Neste contexto militar, indica naturalmente um homem jovem, sem impor o sentido possível de servo.
- source_word: גִּבּוֹר חָיִל
  choice: guerreiro valente
  rationale: Expressa de modo natural a força e a valentia militar da locução hebraica, sem a rigidez de uma tradução palavra por palavra.
- source_word: בֵית אָבִיו
  choice: sua família paterna
  rationale: Comunica o sentido social da expressão hebraica, isto é, a casa ancestral ou linhagem organizada pelo lado paterno.
- source_word: שָׂרִים
  choice: comandantes
  rationale: No contexto de uma relação de forças militares, designa líderes investidos de comando.
- source_word: עֶשְׂרִים וּשְׁנָיִם
  choice: vinte e dois
  rationale: Tradução direta e idiomática do numeral cardinal.
- source_word: וְ
  choice: E
  rationale: Mantém a ligação desta entrada com a enumeração precedente.
