  text: They were there with David for three days[a], eating and drinking, because their brothers had prepared for them.
translation:
  language: pt
  text: Estiveram ali com Davi durante três dias, comendo e bebendo, porque seus irmãos[a] tinham preparado para eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus parentes”. O hebraico diz literalmente “seus irmãos”, expressão que, neste contexto, pode referir-se de modo mais amplo a membros do mesmo clã ou tribo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ שָׁם
  choice: Ficaram ali
  rationale: Embora היה possa indicar simplesmente presença, em combinação com a duração de três dias, “ficaram ali” expressa com naturalidade a permanência no local sem acrescentar uma ideia estranha ao contexto.
- source_word: עִם דָּוִיד
  choice: com Davi
  rationale: A preposição עִם indica diretamente companhia ou associação.
- source_word: יָמִים שְׁלוֹשָׁה
  choice: durante três dias
  rationale: A expressão marca duração; “durante três dias” é uma formulação clara e idiomática em português.
- source_word: אֹכְלִים וְשׁוֹתִים
  choice: comendo e bebendo
  rationale: Os particípios descrevem atividades contínuas durante a permanência. A tradução conserva os dois verbos explícitos, sem condensá-los interpretativamente em “festejando”.
- source_word: כִּי
  choice: porque
  rationale: A conjunção introduz a razão pela qual havia comida e bebida.
- source_word: הֵכִינוּ
  choice: haviam preparado tudo
  rationale: O hifil de כון significa “preparar” ou “deixar pronto”. O mais-que-perfeito explicita que os preparativos antecederam a permanência; “tudo” funciona como complemento elíptico natural, retomando o necessário para comer e beber.
- source_word: לָהֶם
  choice: para eles
  rationale: A expressão pronominal indica os beneficiários dos preparativos.
- source_word: אֲחֵיהֶם
  choice: seus irmãos
  rationale: Preserva o termo masculino concreto do hebraico, embora no contexto tribal ele possa ter sentido social mais amplo.
theological_decisions:
- issue: Alcance do termo אֲחֵיהֶם no contexto tribal
  choice: seus irmãos
  alternative: seus parentes; seus compatriotas
  rationale: O texto hebraico diz literalmente “irmãos”. A tradução principal mantém essa imagem de parentesco sem restringir nem ampliar silenciosamente seu referente; a nota registra os sentidos coletivos possíveis no contexto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem foi levemente ajustada para fluência, e o marcador da nota foi colocado junto de “irmãos”, termo ao qual a nota lexical se refere.
