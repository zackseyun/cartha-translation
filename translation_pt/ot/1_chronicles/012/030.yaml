source:
  edition: WLC
  text: וּ/מִן בְּנֵ֧י בִנְיָמִ֛ן אֲחֵ֥י שָׁא֖וּל שְׁלֹ֣שֶׁת אֲלָפִ֑ים וְ/עַד הֵ֨נָּה֙ מַרְבִּיתָ֔/ם שֹׁמְרִ֕ים מִשְׁמֶ֖רֶת בֵּ֥ית שָׁאֽוּל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/030.yaml
  text: And from the sons of Benjamin[a], Saul’s brothers, three thousand[b]; until then most of them had been keeping watch over the house of Saul.
translation:
  language: pt
  text: E dos filhos de Benjamim, irmãos de Saul[a], três mil; até então, a maioria deles vinha mantendo a guarda da casa de Saul[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “parentes de Saul”. Em hebraico, “irmãos” pode designar um grupo de parentesco mais amplo, e não apenas irmãos literais.
    reason: lexical_alternative
  - marker: b
    text: “Casa de Saul” pode referir-se à família ou casa real de Saul, à sua linhagem ou aos interesses ligados a ela.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: E dos
  rationale: Preserva tanto a conjunção aditiva quanto a preposição, dando continuidade à lista numérica do contexto.
- source_word: בְּנֵי בִנְיָמִן
  choice: filhos de Benjamim
  rationale: Mantém o idioma tribal e genealógico do hebraico, adequado ao caráter enumerativo da passagem.
- source_word: אֲחֵי שָׁאוּל
  choice: irmãos de Saul
  rationale: Reproduz de perto o termo hebraico, que pode designar não apenas irmãos literais, mas também parentes ou membros do mesmo grupo de parentesco; essa amplitude é indicada em nota.
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: três mil
  rationale: Tradução numérica direta e natural.
- source_word: וְעַד הֵנָּה
  choice: até então
  rationale: No contexto narrativo, aponta para o período anterior à ocasião relatada, e não para o presente do leitor.
- source_word: מַרְבִּיתָם
  choice: a maioria deles
  rationale: Expressa com clareza o sentido de maior parte ou maior número.
- source_word: שֹׁמְרִים מִשְׁמֶרֶת
  choice: vinha mantendo a guarda
  rationale: A construção com particípio descreve uma atividade ou compromisso contínuo até aquele momento; a locução portuguesa conserva também a repetição semântica entre o verbo e o substantivo hebraicos sem soar excessivamente artificial.
- source_word: בֵּית שָׁאוּל
  choice: casa de Saul
  rationale: Preserva a amplitude de בַּיִת, que pode indicar a família, a casa real, a linhagem dinástica ou seus interesses, sem decidir indevidamente entre essas possibilidades.
theological_decisions:
- issue: Alcance de “casa de Saul”
  choice: Manter a expressão ampla “casa de Saul”
  alternative: “família de Saul”, “dinastia de Saul” ou “interesses de Saul”
  rationale: O hebraico permite mais de um referente relacionado, e o contexto não exige que a tradução escolha apenas o sentido doméstico, familiar ou dinástico.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A estrutura enumerativa do hebraico foi preservada, e as ambiguidades de parentesco e de “casa” foram mantidas no texto com esclarecimentos em notas.
