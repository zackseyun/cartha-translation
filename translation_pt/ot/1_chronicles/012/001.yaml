  text: וְ/אֵ֗לֶּה הַ/בָּאִ֤ים אֶל דָּוִיד֙ לְ/צִ֣יקְלַ֔ג ע֣וֹד עָצ֔וּר מִ/פְּנֵ֖י שָׁא֣וּל בֶּן קִ֑ישׁ וְ/הֵ֨מָּה֙ בַּ/גִּבּוֹרִ֔ים עֹזְרֵ֖י הַ/מִּלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/001.yaml
  text: These are the men who came to David at Ziklag while he was still kept back because of Saul son of Kish[a]; and they were among the mighty warriors[b], helpers in war.
translation:
  language: pt
  text: Estes são os homens que vieram a Davi em Ziclague, quando ele ainda estava retido por causa de Saul, filho de Quis[a]; eles estavam entre os guerreiros valentes[b], ajudantes na guerra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “impedido” ou “confinado” por causa de Saul, filho de Quis.
    reason: lexical_alternative
  - marker: b
    text: Ou “homens poderosos”; o hebraico gibbôrîm se refere a guerreiros valentes ou heróis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Estes são
  rationale: Introduz a nova lista de modo natural, preservando o demonstrativo; o valor conectivo de וְ não exige um marcador temporal como “agora”.
- source_word: הַבָּאִים אֶל דָּוִיד לְצִיקְלַג
  choice: os homens que vieram a Davi em Ziclague
  rationale: O particípio substantivado é expresso naturalmente por uma oração relativa. “Em Ziclague” identifica o lugar onde foram encontrar Davi, sem repetir uma construção direcional pouco natural.
- source_word: עוֹד עָצוּר
  choice: ainda estava impedido
  rationale: “Ainda” expressa a continuidade indicada por עוֹד, e “impedido” conserva a ideia de restrição sem afirmar que Davi estivesse formalmente preso.
- source_word: מִפְּנֵי שָׁאוּל בֶּן קִישׁ
  choice: por causa de Saul, filho de Quis
  rationale: מִפְּנֵי indica aqui a causa da situação de Davi; a aposição com vírgulas é idiomática em português.
- source_word: בַּגִּבּוֹרִים
  choice: entre os guerreiros valentes
  rationale: גִּבּוֹרִים designa homens de reconhecida valentia militar; a formulação mantém o sentido marcial e é clara para leitores atuais.
- source_word: עֹזְרֵי הַמִּלְחָמָה
  choice: seus auxiliares na guerra
  rationale: Reproduz a função militar expressa pelo sintagma construto, entendendo pelo contexto que o apoio era prestado a Davi; “auxiliares” evita sugerir uma categoria militar técnica não indicada no hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com grafia de nomes tradicional em português. A sintaxe acompanha de perto o hebraico, mas evita rigidez desnecessária; as notas preservam a amplitude lexical de עָצוּר e גִּבּוֹרִים.
