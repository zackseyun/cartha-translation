base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/036.yaml
  text: From Dan[a], twenty-eight thousand six hundred prepared for battle.
translation:
  language: pt
  text: De Dã, 28.600 homens preparados para a batalha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dispostos em ordem de batalha” ou “formados para a batalha”. A expressão hebraica enfatiza prontidão militar ou formação de combate.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַדָּנִי
  choice: De Dã
  rationale: O gentílico hebraico com artigo representa aqui a tribo de Dã na lista militar. O וּ conjuntivo não precisa ser explicitado em português, pois a sequência enumerativa já estabelece a ligação.
- source_word: עֹרְכֵי מִלְחָמָה
  choice: homens preparados para a batalha
  rationale: A expressão participial descreve pessoas dispostas em ordem de combate ou prontas para guerrear. A inclusão de “homens” torna explícito em português o referente humano implícito no particípio plural, enquanto “preparados para a batalha” comunica naturalmente a prontidão militar.
- source_word: עֶשְׂרִים וּשְׁמוֹנָה אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: '28.600'
  rationale: Representação numérica corrente e clara em português de vinte e oito mil e seiscentos.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe concisa apropriada a uma lista militar. “Batalha” foi preferido a “guerra” por se ajustar melhor à ideia de formação concreta para o combate.
