base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/023.yaml
  text: For day by day they came to David to help him[a], until there was a great camp, like the camp of God.
translation:
  language: pt
  text: Pois dia após dia, vinham a Davi para ajudá-lo, até que se formou um grande acampamento, como o acampamento de Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «como um acampamento divino» ou «como um acampamento celestial». A expressão hebraica é concisa e evocativa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz uma explicação ligada ao contexto anterior; «Pois» preserva essa função discursiva sem impor uma causalidade mais rígida.
- source_word: לְעֶת יוֹם בְּיוֹם
  choice: dia após dia
  rationale: Expressa com naturalidade a repetição contínua ao longo de dias sucessivos.
- source_word: יָבֹאוּ
  choice: chegavam
  rationale: O imperfeito, em contexto narrativo, descreve uma ação passada reiterada; «chegavam» combina naturalmente com «dia após dia».
- source_word: עַל דָּוִיד
  choice: a Davi
  rationale: Com o verbo de movimento e a finalidade expressa em seguida, a preposição indica direção para Davi, não hostilidade contra ele.
- source_word: לְעָזְרוֹ
  choice: para ajudá-lo
  rationale: O infinitivo com sufixo pronominal expressa finalidade de modo direto.
- source_word: עַד לְמַחֲנֶה גָדוֹל
  choice: até se formar um grande exército
  rationale: A construção indica o resultado alcançado pelas chegadas sucessivas. מַחֲנֶה pode designar acampamento ou força militar; no contexto, «exército» comunica com clareza o grupo reunido, embora a imagem literal de acampamento seja registrada na nota.
- source_word: כְּמַחֲנֵה אֱלֹהִים
  choice: como o exército de Deus
  rationale: Mantém o símile e o genitivo hebraico, preservando sua força evocativa e a possível ideia de uma hoste extraordinariamente grande.
theological_decisions:
- issue: Sentido de אֱלֹהִים no símile כְּמַחֲנֵה אֱלֹהִים
  choice: Deus
  alternative: divino ou celestial
  rationale: «De Deus» é a leitura mais direta e preserva a ressonância teológica e a ambiguidade expressiva do hebraico, sem reduzi-la a um mero intensificador.
- issue: Valor de מַחֲנֶה no contexto
  choice: exército
  alternative: acampamento
  rationale: O contexto trata da concentração de apoiadores armados de Davi, favorecendo o sentido metonímico de força militar. A alternativa literal permanece na nota para conservar a imagem hebraica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. «Dia após dia» e «chegavam» explicitam a ação reiterada sem acrescentar um sujeito ausente no hebraico.
