base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/015.yaml
  text: These were from the sons of Gad[a], heads of the army; the least was for a hundred, and the greatest for a thousand.
translation:
  language: pt
  text: Estes eram dos filhos de Gade, chefes do exército; o menor valia por cem, e o maior, por mil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “o menor, um por cem; e o maior, por mil”. A expressão provavelmente indica capacidade ou eficácia militar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה מִבְּנֵי גָד
  choice: Estes eram dos filhos de Gade
  rationale: Preserva a expressão tribal e familiar do hebraico, suprindo naturalmente o verbo em português numa oração hebraica sem cópula expressa.
- source_word: רָאשֵׁי הַצָּבָא
  choice: chefes do exército
  rationale: Traduz de modo direto o sentido de 'cabeças/chefes' e comunica claramente sua função de liderança militar.
- source_word: אֶחָד לְמֵאָה הַקָּטָן
  choice: o menor valia por cem
  rationale: A construção hebraica é elíptica; 'valia por' expressa em português a proporção de capacidade ou eficácia militar, sem especificar indevidamente se se trata de combate individual, comando ou importância.
- source_word: וְהַגָּדוֹל לְאָלֶף
  choice: e o maior, por mil
  rationale: Mantém o paralelismo com a oração anterior; a elipse de 'valia' é natural em português e conserva a concisão do hebraico.
