base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/007.yaml
  text: Elkanah[a], Isshiah, Azarel, Joezer, and Jashobeam, the Korahites.
translation:
  language: pt
  text: Elcana, Issias, Azarel, Joezer e Jasobeão, os coraítas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os descendentes de Corá”.
    reason: Alternativa explicativa para o gentílico hebraico, que pode ser expresso em português como relação de descendência.
lexical_decisions:
- source_word: אֶלְקָנָה
  choice: Elcana
  rationale: Nome próprio vertido na forma bíblica portuguesa corrente, correspondente ao hebraico ʾElqānāh.
- source_word: יִשִּׁיָּהוּ
  choice: Issias
  rationale: Forma portuguesa legível do nome hebraico Yiššiyyāhû, preservando sua identificação como nome próprio.
- source_word: עֲזַרְאֵל
  choice: Azarel
  rationale: Transliteração natural em português do nome hebraico ʿAzarʾēl.
- source_word: יוֹעֶזֶר
  choice: Joezer
  rationale: Forma transliterada tradicional e clara em português para o hebraico Yôʿezer.
- source_word: יָשָׁבְעָם
  choice: Jasobeão
  rationale: Forma portuguesa consagrada para o nome hebraico Yāšobʿām; não se adota uma forma nominal diferente atestada em outro contexto.
- source_word: הַקָּרְחִים
  choice: os coraítas
  rationale: O hebraico apresenta um gentílico masculino plural com artigo, designando membros do clã ligado a Corá; “os coraítas” reproduz essa forma de maneira concisa e natural.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas nominais bíblicas de fácil reconhecimento. A enumeração e o gentílico plural do hebraico foram preservados; o marcador da nota foi colocado junto a “coraítas”, termo ao qual a alternativa lexical se refere.
