source:
  edition: WLC
  text: וְ/גַ֣ם הַ/קְּרֽוֹבִים אֲ֠לֵי/הֶם עַד יִשָׂשכָ֨ר וּ/זְבֻל֜וּן וְ/נַפְתָּלִ֗י מְבִיאִ֣ים לֶ֡חֶם בַּ/חֲמוֹרִ֣ים וּ/בַ/גְּמַלִּ֣ים וּ/בַ/פְּרָדִ֣ים וּֽ/בַ/בָּקָ֡ר מַאֲכָ֡ל קֶ֠מַח דְּבֵלִ֨ים וְ/צִמּוּקִ֧ים וְ/יַֽיִן וְ/שֶׁ֛מֶן וּ/בָקָ֥ר וְ/צֹ֖אן לָ/רֹ֑ב כִּ֥י שִׂמְחָ֖ה בְּ/יִשְׂרָאֵֽל־־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/041.yaml
  text: 'Also those near them[a], as far as Issachar and Zebulun and Naphtali, were bringing food on donkeys, camels, mules, and cattle: provisions of flour, fig cakes, raisin cakes, wine, oil, cattle, and sheep in abundance[c][b], for there was joy in Israel.'
translation:
  language: pt
  text: 'Também os que estavam perto deles, até Issacar, Zebulom e Naftali,[a] traziam alimentos[b] em jumentos, camelos, mulas e bois: mantimentos — farinha, bolos de figos, passas,[c] vinho, azeite, bois e ovelhas em abundância —, pois havia alegria em Israel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «alcançando até Issacar, Zebulom e Naftali». A expressão hebraica indica a extensão geográfica dos que levavam os mantimentos.'
    reason: alternative_reading
  - marker: b
    text: O termo hebraico significa literalmente «pão», mas aqui abrange os diversos tipos de alimento enumerados em seguida.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «uvas secas»; também se entende que eram massas ou bolos de passas prensadas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Também
  rationale: Preserva a continuação e a força aditiva do hebraico em português natural.
- source_word: הַקְּרוֹבִים אֲלֵיהֶם
  choice: os que estavam perto deles
  rationale: Mantém o sentido relacional e geográfico sem restringi-lo a vizinhos residentes.
- source_word: עַד יִשָׂשכָר וּזְבֻלוּן וְנַפְתָּלִי
  choice: até Issacar, Zebulom e Naftali
  rationale: עַד indica extensão; a formulação preserva a possível nuance geográfica sem definir além do texto a relação exata entre essas tribos e o grupo anterior.
- source_word: מְבִיאִים
  choice: traziam
  rationale: O particípio expressa ação em curso ou repetida no contexto narrativo.
- source_word: לֶחֶם
  choice: alimentos
  rationale: Embora o sentido literal seja «pão», a lista que segue mostra que aqui o termo abrange provisões de vários tipos.
- source_word: בַּחֲמוֹרִים וּבַגְּמַלִּים וּבַפְּרָדִים וּבַבָּקָר
  choice: em jumentos, camelos, mulas e bois
  rationale: A preposição indica o meio de transporte. בָּקָר designa gado, não carros; «bois» é adequado aqui como animais usados no transporte.
- source_word: מַאֲכָל
  choice: mantimentos
  rationale: Introduz a lista detalhada das provisões destinadas à grande reunião.
- source_word: קֶמַח
  choice: farinha
  rationale: Equivalente usual para o produto de cereal finamente moído.
- source_word: דְּבֵלִים
  choice: bolos de figos
  rationale: Refere-se a massas de figos prensados, preparadas para conservação e transporte.
- source_word: צִמּוּקִים
  choice: passas
  rationale: O termo designa uvas secas; «passas» é a forma corrente e não afirma necessariamente que estavam prensadas em bolos.
- source_word: יַיִן
  choice: vinho
  rationale: Equivalente direto e corrente.
- source_word: שֶׁמֶן
  choice: azeite
  rationale: Embora o hebraico diga genericamente «óleo», no contexto alimentar israelita a referência normal é ao azeite; esta é também a designação portuguesa natural.
- source_word: לָרֹב
  choice: em abundância
  rationale: Expressa claramente a grande quantidade dos animais fornecidos.
- source_word: כִּי שִׂמְחָה בְּיִשְׂרָאֵל
  choice: pois havia alegria em Israel
  rationale: Preserva tanto a relação causal introduzida por כִּי como a formulação coletiva do hebraico.
