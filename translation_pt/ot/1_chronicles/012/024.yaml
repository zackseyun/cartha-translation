  text: וְ֠/אֵלֶּה מִסְפְּרֵ֞י רָאשֵׁ֤י הֶֽ/חָלוּץ֙ לַ/צָּבָ֔א בָּ֥אוּ עַל דָּוִ֖יד חֶבְר֑וֹנָ/ה לְ/הָסֵ֞ב מַלְכ֥וּת שָׁא֛וּל אֵלָ֖י/ו כְּ/פִ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/024.yaml
  text: And these are the numbers of the heads of the armed troops for war[a], who came to David at Hebron to turn Saul’s kingdom over to him, according to the word of Yahweh.
translation:
  language: pt
  text: Estes são os números dos chefes dos homens armados para a guerra que vieram a Davi, em Hebrom, para transferir o reino de Saul para ele, conforme a palavra de Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “conforme a boca de Yahweh”, expressão idiomática que significa “conforme a palavra de Yahweh” ou “como Yahweh havia falado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפְּרֵי
  choice: os números de
  rationale: O plural em estado construto introduz a enumeração que se segue; “os números” preserva essa forma sem reduzir o termo a um singular abstrato.
- source_word: רָאשֵׁי
  choice: os chefes de
  rationale: Expressa naturalmente em português o sentido de liderança de “cabeças de”, mantendo a nuance militar e administrativa.
- source_word: הֶחָלוּץ לַצָּבָא
  choice: os homens armados para a guerra
  rationale: O substantivo coletivo designa os equipados ou mobilizados para combate; a formulação mantém tanto a preparação militar quanto sua finalidade.
- source_word: בָּאוּ עַל דָּוִיד
  choice: vieram até Davi
  rationale: Neste contexto, a preposição indica aproximação e adesão, não hostilidade. “Até” preserva o movimento em direção a Davi sem explicitar além do texto a ideia de mudança de lealdade.
- source_word: חֶבְרוֹנָה
  choice: em Hebrom
  rationale: Embora o hê direcional marque movimento rumo a Hebrom, em português a construção mais natural é “vieram até Davi, em Hebrom”, identificando o lugar em que Davi se encontrava.
- source_word: לְהָסֵב
  choice: para fazer passar
  rationale: A forma causativa de סבב comunica que o domínio seria transferido ou feito passar a Davi; a escolha conserva a imagem verbal hebraica.
- source_word: מַלְכוּת שָׁאוּל
  choice: o reino de Saul
  rationale: מַלְכוּת pode referir-se ao reino ou ao poder régio. “Reino” é natural no contexto narrativo, embora “reinado” seja lexicalmente possível.
- source_word: כְּפִי יְהוָה
  choice: conforme a palavra de Yahweh
  rationale: A expressão significa literalmente “conforme a boca de Yahweh” e funciona como idioma para aquilo que Yahweh disse; “palavra” comunica esse sentido com clareza.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” representa o nome pessoal divino sem substituí-lo por um título.
- issue: Natureza da transferência de מַלְכוּת שָׁאוּל
  choice: fazer passar a ele o reino de Saul
  alternative: transferir a ele o reinado de Saul
  rationale: A redação preserva a ação causativa e deixa em aberto se מַלְכוּת enfatiza o domínio, a instituição régia ou o território governado, sem impor uma leitura teológica mais específica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A sintaxe conserva a estrutura enumerativa e militar do hebraico, enquanto a pontuação esclarece que Hebrom é o local onde Davi estava.
