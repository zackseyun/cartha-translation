lexical_decisions:
- source_word: עֵזֶר
  choice: Ézer
  rationale: Nome próprio transliterado segundo a forma consagrada em português, com acento para indicar a pronúncia.
- source_word: הָרֹאשׁ
  choice: o chefe
  rationale: Embora רֹאשׁ signifique literalmente “cabeça”, neste contexto de lista indica primazia, posição ou liderança; “o chefe” comunica naturalmente essa função.
- source_word: עֹבַדְיָה
  choice: Obadias
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: הַשֵּׁנִי
  choice: o segundo
  rationale: Tradução direta do ordinal definido, preservando a ordem ou posição indicada na lista.
- source_word: אֱלִיאָב
  choice: Eliabe
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: הַשְּׁלִשִׁי
  choice: o terceiro
  rationale: Tradução direta do ordinal definido, preservando o paralelismo da enumeração.
