  text: Ézer, o chefe[a]; Obadias, o segundo; Eliabe, o terceiro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Ézer, o líder”; em hebraico, literalmente, “Ézer, a cabeça”.
