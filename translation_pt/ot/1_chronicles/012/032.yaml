base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/032.yaml
  text: And from the half-tribe of Manasseh[a], eighteen thousand, who were designated by name, came to make David king.
translation:
  language: pt
  text: E da meia tribo de Manassés vieram dezoito mil que foram indicados por nome[a], para fazer Davi rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nomeados por nome”, isto é, identificados individualmente ou incluídos expressamente numa lista.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵחֲצִי מַטֵּה מְנַשֶּׁה
  choice: E da meia tribo de Manassés
  rationale: Mantém a conjunção e a ideia de metade de uma tribo; “meia tribo” é uma expressão concisa e reconhecível em português.
- source_word: שְׁמוֹנָה עָשָׂר אָלֶף
  choice: dezoito mil
  rationale: Tradução direta do numeral cardinal.
- source_word: אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת
  choice: designados nominalmente
  rationale: Preserva o sentido passivo de pessoas identificadas ou indicadas de modo expresso, em formulação natural em português; a nota registra a construção hebraica mais literal.
- source_word: לָבוֹא
  choice: vieram
  rationale: Embora seja formalmente um infinitivo, no contexto enumerativo o movimento é expresso com naturalidade como verbo finito, sem alterar o sentido.
- source_word: לְהַמְלִיךְ אֶת דָּוִיד
  choice: para fazer Davi rei
  rationale: Expressa diretamente o causativo de מלך, sem restringir o ato a uma cerimônia de coroação ou entronização.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem foi ajustada para evitar que “dezoito mil” parecesse modificar apenas “Manassés”, mantendo o fluxo natural da enumeração.
