  text: וּ/מִֽ/מְּנַשֶּׁ֞ה נָפְל֣וּ עַל דָּוִ֗יד בְּ/בֹא֨/וֹ עִם פְּלִשְׁתִּ֧ים עַל שָׁא֛וּל לַ/מִּלְחָמָ֖ה וְ/לֹ֣א עֲזָרֻ֑/ם כִּ֣י בְ/עֵצָ֗ה שִׁלְּחֻ֜/הוּ סַרְנֵ֤י פְלִשְׁתִּים֙ לֵ/אמֹ֔ר בְּ/רָאשֵׁ֕י/נוּ יִפּ֖וֹל אֶל אֲדֹנָ֥י/ו שָׁאֽוּל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/020.yaml
  text: Some from Manasseh also defected to David when he came with the Philistines against Saul for battle[a], though they did not help them, because the lords of the Philistines, after taking counsel, sent him away, saying[b], “He may defect to his master Saul at the cost of our heads.”
translation:
  language: pt
  text: 'Alguns de Manassés também passaram para o lado de Davi[a] quando ele veio com os filisteus contra Saul para a batalha. Contudo, eles não os ajudaram, pois, depois de deliberarem, os governantes dos filisteus mandaram Davi embora, dizendo: “Ele pode passar para o lado de seu senhor Saul, ao custo de nossas cabeças[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “caíram sobre Davi”; neste contexto, o idioma hebraico significa passar para o lado de alguém ou juntar-se a ele.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “com nossas cabeças”; isto é, ao custo de nossa vida ou para nossa própria ruína.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמְּנַשֶּׁה
  choice: Alguns de Manassés também
  rationale: A preposição מן tem sentido partitivo no contexto, e o versículo seguinte identifica pessoas específicas; “também” comunica a força aditiva da conjunção.
- source_word: נָפְלוּ עַל דָּוִיד
  choice: passaram para o lado de Davi
  rationale: O idioma militar e político não descreve uma queda literal, mas a adesão ao lado de alguém. A formulação também permite repetir o mesmo sentido na fala dos governantes filisteus.
- source_word: בְּבֹאוֹ עִם פְּלִשְׁתִּים עַל שָׁאוּל לַמִּלְחָמָה
  choice: quando ele veio com os filisteus contra Saul para a batalha
  rationale: Mantém o valor temporal do infinitivo, o acompanhamento indicado por עִם, a direção hostil de עַל e a finalidade de לַמִּלְחָמָה.
- source_word: וְלֹא עֲזָרֻם
  choice: Contudo, eles não os ajudaram
  rationale: Preserva o pronome plural masculino do hebraico e sua referência contextual mais natural aos filisteus, sem inserir no texto um referente nominal ausente no original.
- source_word: כִּי בְעֵצָה
  choice: pois, depois de deliberarem
  rationale: Exprime naturalmente a consulta ou deliberação que precedeu a decisão dos governantes filisteus.
- source_word: שִׁלְּחֻהוּ
  choice: mandaram Davi embora
  rationale: O Piel de שלח significa aqui dispensar ou mandar embora. O nome “Davi” esclarece em português o referente do sufixo masculino sem alterar o sentido.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: os governantes dos filisteus
  rationale: סַרְנֵי é um título próprio dos dirigentes filisteus. “Governantes” comunica sua autoridade sem restringir indevidamente a função a um comando apenas militar.
- source_word: בְּרָאשֵׁינוּ
  choice: ao custo de nossas cabeças
  rationale: Conserva a imagem concreta do hebraico e comunica que a possível deserção de Davi poderia custar a vida dos governantes.
- source_word: יִפּוֹל אֶל אֲדֹנָיו שָׁאוּל
  choice: Ele pode passar para o lado de Saul, seu senhor
  rationale: O imperfeito expressa a apreensão dos filisteus; נפל tem aqui o mesmo sentido político-militar de mudar de lado, e “senhor” preserva a relação de lealdade política indicada por אֲדֹנָיו.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais no Brasil sem regionalismos marcados. A repetição de “passar para o lado” preserva a ligação lexical entre a adesão dos homens de Manassés e o temor de que Davi voltasse para Saul. O pronome em “não os ajudaram” mantém a forma do hebraico e a discreta ambiguidade referencial, embora o antecedente contextual mais provável sejam os filisteus.
