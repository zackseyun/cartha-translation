base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/006.yaml
  text: Eluzai[a], Jerimoth, Bealiah, Shemariahu, and Shephatiah the Haruphite.
translation:
  language: pt
  text: Eluzai, Jerimote, Bealias, Semarias e Sefatias, o harifita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “harufita”. A designação hebraica parece indicar um clã ou família cujo nome aparece com formas relacionadas.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלְעוּזַי
  choice: Eluzai
  rationale: Nome próprio transliterado de modo próximo ao hebraico e natural em português.
- source_word: וִירִימוֹת
  choice: Jerimote
  rationale: Forma portuguesa legível do nome próprio hebraico; a conjunção prefixada é representada pela estrutura normal da enumeração.
- source_word: וּבְעַלְיָה
  choice: Bealias
  rationale: Transliteração portuguesa tradicional e legível do nome próprio; a terminação em -s reflete uso bíblico consolidado em português, não plural.
- source_word: וּשְׁמַרְיָהוּ
  choice: Semarias
  rationale: Forma portuguesa corrente do nome, preservando de maneira natural o elemento final teofórico hebraico.
- source_word: וּשְׁפַטְיָהוּ
  choice: Sefatias
  rationale: Forma portuguesa corrente e inteligível do nome próprio hebraico.
- source_word: הַחֲרִיפִי
  choice: o harifita
  rationale: Gentílico ou designação de clã com artigo definido. A forma vocalizada do texto massorético aponta diretamente para Harife, daí “harifita”; a variante “harufita” é registrada em nota por sua relação possível com outra forma do nome de família.
theological_decisions: []
