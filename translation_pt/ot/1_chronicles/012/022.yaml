base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/022.yaml
  text: And they helped David against the raiding band[a], for all of them were mighty men of valor[c][b], and they became commanders in the army.
translation:
  language: pt
  text: E eles ajudaram Davi contra o bando de saqueadores[a], pois todos eram guerreiros valentes[b] e se tornaram comandantes[c] no exército.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «contra o bando» ou «contra a tropa»; o hebraico גְּדוּד pode referir-se a um destacamento militar ou a um bando de saqueadores.
    reason: lexical_alternative
  - marker: b
    text: Ou «homens valentes»; a expressão hebraica גְּדוּרֵי חַיִל designa combatentes corajosos e capazes.
    reason: lexical_alternative
  - marker: c
    text: Ou «chefes» ou «capitães».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמָּה
  choice: E eles
  rationale: Mantém a conjunção e o pronome independente enfático, em formulação natural em português.
- source_word: עָזְרוּ עִם דָּוִיד
  choice: ajudaram Davi
  rationale: Embora עִם normalmente signifique «com», com o verbo «ajudar» o português expressa naturalmente o beneficiário como objeto direto.
- source_word: עַל הַגְּדוּד
  choice: contra o bando de saqueadores
  rationale: עַל assume sentido hostil no contexto, e גְּדוּד pode designar um bando armado dedicado a incursões ou saques.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação causal preservando o fluxo narrativo e um registro digno.
- source_word: גִבּוֹרֵי חַיִל כֻּלָּם
  choice: todos eram guerreiros valentes
  rationale: A expressão hebraica caracteriza homens de reconhecida capacidade e bravura militar; «todos» preserva a abrangência explícita de כֻּלָּם.
- source_word: וַיִּהְיוּ שָׂרִים
  choice: e se tornaram comandantes
  rationale: O verbo indica aqui a passagem a uma condição ou função, e שָׂרִים, no contexto militar, refere-se a líderes ou oficiais.
- source_word: בַּצָּבָא
  choice: no exército
  rationale: צָבָא designa neste contexto a força militar organizada; «exército» é o equivalente moderno mais natural.
