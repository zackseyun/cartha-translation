  text: and Joelah and Zebadiah[a], the sons of Jeroham from Gedor.
translation:
  language: pt
  text: e Jeoela e Zebadias, filhos de Jeroão, de Gedor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/יוֹעֵאלָה
  choice: e Joela
  rationale: O וְ inicial dá continuidade à lista e é traduzido por “e”. O nome próprio é transliterado na forma portuguesa clara e tradicional “Joela”.
- source_word: וּ/זְבַדְיָה
  choice: e Zebadias
  rationale: A conjunção וּ é traduzida por “e”; o nome próprio recebe a forma portuguesa consagrada “Zebadias”.
- source_word: בְּנֵי
  choice: filhos de
  rationale: O plural construto de בֵּן indica mais naturalmente filiação direta neste contexto; “filhos de” preserva essa leitura sem ampliar para “descendentes”.
- source_word: יְרֹחָם
  choice: Jeroão
  rationale: Forma portuguesa tradicional e legível do nome hebraico יְרֹחָם.
- source_word: מִן הַ/גְּדֽוֹר
  choice: de Gedor
  rationale: A expressão indica procedência. Em português, “de Gedor” é natural, tratando Gedor como topônimo e sem reproduzir de modo artificial o artigo hebraico.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com formas tradicionais dos nomes bíblicos. A estrutura concisa preserva o caráter de continuação de uma lista, inclusive o “e” inicial.
