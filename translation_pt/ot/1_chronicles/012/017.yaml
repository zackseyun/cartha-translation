base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/017.yaml
  text: And some of the sons of Benjamin and Judah came to the stronghold[b][a], to David.
translation:
  language: pt
  text: Alguns dos filhos de Benjamim e de Judá[a] vieram até Davi na fortaleza[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dentre os filhos de Benjamim e de Judá”. A construção hebraica é partitiva e indica que apenas alguns membros desses grupos vieram.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “refúgio fortificado”. O termo hebraico designa um lugar protegido usado como posição defensiva.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: vieram
  rationale: O wayyiqtol de בוא dá prosseguimento à narrativa e indica movimento em direção ao lugar onde Davi estava; “vieram” preserva essa orientação dêitica.
- source_word: מִן
  choice: alguns dos
  rationale: 'A preposição tem sentido partitivo neste contexto: vieram membros desses grupos, não todos eles. “Alguns dos” torna isso explícito em português natural.'
- source_word: בְּנֵי בִנְיָמִן וִיהוּדָה
  choice: filhos de Benjamim e de Judá
  rationale: Mantém a expressão de parentesco do hebraico e explicita de modo natural a elipse relativa a Judá, sem restringi-la a filhos biológicos imediatos.
- source_word: עַד לַמְצָד
  choice: na fortaleza
  rationale: No contexto de movimento, עַד marca o destino. Com “vieram até Davi”, o português localiza Davi na fortaleza sem reproduzir de maneira rígida e pouco natural a sequência de preposições hebraica.
- source_word: לְדָוִיד
  choice: até Davi
  rationale: A preposição apresenta Davi como a pessoa a quem eles se dirigiram. “Até Davi” expressa o destino de forma concisa e idiomática.
- source_word: הַמְצָד
  choice: a fortaleza
  rationale: מְצָד designa um refúgio fortificado ou posição defensiva; “fortaleza” é claro, digno e adequado ao contexto.
