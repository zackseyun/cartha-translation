base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/038.yaml
  text: And from beyond the Jordan[a], from the Reubenites, the Gadites, and the half-tribe of Manasseh, with every kind of military equipment for war, there were one hundred twenty thousand.
translation:
  language: pt
  text: E, do outro lado do Jordão[a], dos rubenitas, dos gaditas e da metade da tribo de Manassés, vieram cento e vinte mil, com todo o equipamento de guerra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de além do Jordão”. A expressão hebraica pode ser traduzida de formas diferentes conforme o ponto de vista geográfico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵבֶר לַיַּרְדֵּן
  choice: E, do outro lado do Jordão
  rationale: A expressão hebraica designa a região situada além ou do outro lado do Jordão, conforme o ponto de vista geográfico. “Do outro lado do Jordão” é natural em português e mantém a expressão espacial sem definir além do que o texto diz.
- source_word: מִן הָראוּבֵנִי וְהַגָּדִי וַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: dos rubenitas, dos gaditas e da meia tribo de Manassés
  rationale: Os gentílicos hebraicos no singular têm sentido coletivo; o plural em português identifica naturalmente os grupos tribais. “Meia tribo de Manassés” reproduz com clareza a expressão hebraica.
- source_word: בְּכֹל כְּלֵי צְבָא מִלְחָמָה
  choice: com todo tipo de equipamento militar para a guerra
  rationale: כְּלֵי pode abranger utensílios, armas e equipamentos; no contexto militar, “equipamento militar” preserva essa amplitude. “Todo tipo de” expressa o valor abrangente de בְּכֹל.
- source_word: מֵאָה וְעֶשְׂרִים אָלֶף
  choice: cento e vinte mil
  rationale: Tradução direta e idiomática do número cardinal em português.
