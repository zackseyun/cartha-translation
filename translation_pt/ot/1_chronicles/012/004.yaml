base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/004.yaml
  text: and Ishmaiah the Gibeonite[b][a], a mighty man among the Thirty and over the Thirty.
translation:
  language: pt
  text: e Ismaías, o gibeonita, um guerreiro valente entre os Trinta[a] e chefe dos Trinta.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «dos Trinta»; a preposição hebraica pode indicar que ele pertencia ao grupo de elite chamado «os Trinta».'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica indica provavelmente uma posição de liderança ou categoria superior em relação aos Trinta.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/יִֽשְׁמַֽעְיָ֧ה
  choice: e Ismaías
  rationale: Mantém a conjunção que dá continuidade à lista e usa a forma portuguesa tradicional do nome.
- source_word: הַ/גִּבְעוֹנִ֛י
  choice: o gibeonita
  rationale: O gentílico com artigo identifica sua origem ou vinculação a Gibeão; a forma nominal é natural em português.
- source_word: גִּבּ֥וֹר
  choice: um guerreiro valente
  rationale: No contexto militar, גִּבּוֹר designa alguém forte e valoroso, especialmente um guerreiro; a expressão comunica claramente ambos os aspectos.
- source_word: בַּ/שְּׁלֹשִׁ֖ים
  choice: entre os Trinta
  rationale: A preposição ב pode situá-lo entre os integrantes do grupo de elite conhecido como os Trinta, embora também possa ser traduzida como «dos Trinta».
- source_word: וְ/עַל הַ/שְּׁלֹשִֽׁים
  choice: e chefe dos Trinta
  rationale: Neste contexto, עַל indica autoridade sobre o grupo. A explicitação de «chefe» torna natural em português a relação hierárquica expressa pelo hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Guerreiro valente» é mais claro no contexto militar do que o decalque «homem poderoso». A ordem dos marcadores foi regularizada para que cada nota apareça imediatamente após a expressão relevante.
