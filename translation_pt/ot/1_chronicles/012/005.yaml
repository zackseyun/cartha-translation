- source_word: יוֹחָנָן
  choice: Joanã
  rationale: Forma tradicional em português para este nome hebraico, distinta de João e adequada ao personagem do texto.
- source_word: יוֹזָבָד
  choice: Jozabade
  rationale: Transliteração tradicional portuguesa do nome próprio hebraico.
- source_word: הַגְּדֵרָתִי
  choice: o gederatita
  rationale: O gentílico hebraico com artigo identifica Jozabade por sua origem geográfica ou associação de clã; “gederatita” mantém de modo conciso a forma gentílica do original.
