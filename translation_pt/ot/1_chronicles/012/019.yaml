  text: וְ/ר֣וּחַ לָבְשָׁ֗ה אֶת עֲמָשַׂי֮ רֹ֣אשׁ ה/שלושים לְ/ךָ֤ דָוִיד֙ וְ/עִמְּ/ךָ֣ בֶן יִשַׁ֔י שָׁל֨וֹם שָׁל֜וֹם לְ/ךָ֗ וְ/שָׁלוֹם֙ לְ/עֹ֣זְרֶ֔/ךָ כִּ֥י עֲזָרְ/ךָ֖ אֱלֹהֶ֑י/ךָ וַ/יְקַבְּלֵ֣/ם דָּוִ֔יד וַֽ/יִּתְּנֵ֖/ם בְּ/רָאשֵׁ֥י הַ/גְּדֽוּד־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/019.yaml
  text: And the Spirit clothed Amasai, chief of the Thirty, and he said, “Yours are we, David, and with you, son of Jesse! Peace, peace to you, and peace to your helpers, for your God helps you.” Then David received them and made them chiefs of the troops.
translation:
  language: pt
  text: 'Então o Espírito[a] revestiu Amasai, chefe dos Trinta, e ele declarou:


    “Somos seus, Davi,

    e estamos com você, filho de Jessé!

    Paz, paz para você,

    e paz para os que o ajudam,[b]

    pois o seu Deus o ajuda[c].”


    Davi os recebeu e os nomeou chefes da tropa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um espírito revestiu Amasai” ou “o espírito veio sobre Amasai”. O hebraico diz literalmente “espírito revestiu Amasai”.
    reason: alternative_reading
  - marker: b
    text: Ou “para aquele que o ajuda” ou “para o seu ajudante”. O hebraico emprega o singular, que pode ter sentido coletivo.
    reason: lexical_alternative
  - marker: c
    text: Ou “pois o seu Deus o ajudou” ou “pois o seu Deus tem ajudado você”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ לָבְשָׁה אֶת־עֲמָשַׂי
  choice: Então o Espírito revestiu Amasai
  rationale: Preserva a metáfora hebraica de לָבַשׁ, literalmente “vestir/revestir”, e entende רוּחַ como provável referência ao Espírito de Deus no contexto de capacitação divina. A nota mantém explícitas as outras leituras possíveis.
- source_word: רֹאשׁ הַשְּׁלֹשִׁים
  choice: chefe dos Trinta
  rationale: רֹאשׁ indica liderança, e “os Trinta” parece designar um grupo militar reconhecido; a inicial maiúscula deixa isso claro sem acrescentar “guerreiros” ao texto.
- source_word: לְךָ דָוִיד וְעִמְּךָ בֶן־יִשַׁי
  choice: Somos teus, ó Davi, e estamos contigo, filho de Jessé!
  rationale: Explicita naturalmente em português as duas orações nominais elípticas, preservando tanto a declaração de lealdade quanto o paralelismo.
- source_word: שָׁלוֹם שָׁלוֹם לְךָ
  choice: Paz, paz para você
  rationale: Mantém a repetição enfática de שָׁלוֹם. “Você” oferece legibilidade brasileira moderna, sem perder o tom digno.
- source_word: וְשָׁלוֹם לְעֹזְרֶךָ
  choice: e paz para os que o ajudam
  rationale: O particípio está formalmente no singular, mas pode ter sentido coletivo. O plural se ajusta ao grupo que apoia Davi, enquanto a nota registra a forma singular.
- source_word: כִּי עֲזָרְךָ אֱלֹהֶיךָ
  choice: pois o seu Deus o ajuda
  rationale: O perfeito hebraico pode expressar ajuda já demonstrada ou sustento vigente. O presente comunica o apoio contínuo sugerido pelo contexto, e a nota preserva a alternativa perfectiva.
- source_word: וַיְקַבְּלֵם דָּוִיד
  choice: Davi os recebeu
  rationale: קבל significa receber ou aceitar; “recebeu” preserva a sequência narrativa sem sugerir um rito formal.
- source_word: וַיִּתְּנֵם בְּרָאשֵׁי הַגְּדוּד
  choice: os nomeou chefes das tropas
  rationale: A construção idiomática indica que Davi lhes conferiu liderança militar. “Nomeou” torna a função clara; “tropas” expressa naturalmente o sentido militar de גְּדוּד.
theological_decisions:
- issue: Se רוּחַ designa o Espírito de Deus ou apenas um espírito/impulso
  choice: o Espírito
  alternative: um espírito; o espírito
  rationale: O padrão de Crônicas e a metáfora de o espírito revestir alguém favorecem a atuação capacitadora do Espírito de Deus. Como o hebraico não traz artigo, a nota conserva a ambiguidade real.
- issue: Aspecto temporal de עֲזָרְךָ
  choice: o seu Deus o ajuda
  alternative: o seu Deus o ajudou; o seu Deus tem ajudado você
  rationale: O perfeito pode apontar para ajuda já concedida, mas aqui também fundamenta a confiança presente em Davi. A tradução principal mantém essa força atual sem excluir a leitura perfectiva, registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A fala foi disposta em linhas para conservar seu paralelismo e sua força retórica. Empregou-se “você” nas bênçãos por naturalidade no português brasileiro contemporâneo, mantendo “teus” na fórmula solene de lealdade; a alternância reflete funções discursivas distintas, embora possa ser uniformizada editorialmente se o projeto exigir consistência pronominal estrita.
