  text: וּ/מִ/בְּנֵ֣י יִשָּׂשכָ֗ר יוֹדְעֵ֤י בִינָה֙ לַֽ/עִתִּ֔ים לָ/דַ֖עַת מַה יַּעֲשֶׂ֣ה יִשְׂרָאֵ֑ל רָאשֵׁי/הֶ֣ם מָאתַ֔יִם וְ/כָל אֲחֵי/הֶ֖ם עַל פִּי/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/033.yaml
  text: 'From the sons of Issachar[a], men who understood the times, to know what Israel should do: their chiefs were two hundred[b], and all their brothers were under their command.'
translation:
  language: pt
  text: 'Dos filhos de Issacar, homens que sabiam discernir os tempos, para saber o que Israel devia fazer: seus chefes eram duzentos, e todos os seus irmãos seguiam suas ordens.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “estavam segundo a boca deles”, expressão que indica que seguiam sua direção ou suas ordens.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי יִשָּׂשכָר
  choice: Dos filhos de Issacar
  rationale: A preposição מִן com בְּנֵי indica procedência dentro da lista das tribos. A conjunção inicial pode ser absorvida naturalmente em português.
- source_word: יוֹדְעֵי בִינָה לָעִתִּים
  choice: homens que sabiam discernir os tempos
  rationale: A construção expressa posse de entendimento ou discernimento aplicado aos tempos. Esta formulação natural conserva a ideia de percepção adequada ao momento histórico.
- source_word: לָדַעַת מַה יַעֲשֶׂה יִשְׂרָאֵל
  choice: para saber o que Israel devia fazer
  rationale: O infinitivo indica finalidade, e o imperfeito, neste contexto, aponta para a ação apropriada. 'Devia fazer' comunica orientação prática sem transformar a frase em previsão.
- source_word: רָאשֵׁיהֶם מָאתַיִם
  choice: seus chefes eram duzentos
  rationale: רָאשֵׁיהֶם designa chefes ou líderes. A oração nominal hebraica recebe o verbo 'eram' para fluência em português.
- source_word: וְכָל אֲחֵיהֶם
  choice: e todos os seus irmãos
  rationale: Mantém o sentido direto de אֲחִים; no contexto tribal e militar, refere-se aos demais homens de Issacar.
- source_word: עַל־פִּיהֶם
  choice: seguiam suas ordens
  rationale: O idiomatismo, literalmente 'segundo a boca deles', indica submissão à palavra, direção ou autoridade desses chefes.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do hebraico sem rigidez. 'Discernir os tempos' preserva a dimensão de entendimento do momento histórico; 'seguiam suas ordens' torna explícito o idiomatismo final. O marcador da nota aparece no texto principal.
