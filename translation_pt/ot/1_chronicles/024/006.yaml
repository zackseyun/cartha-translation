base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/006.yaml
  text: Shemaiah son of Nethanel[a], the scribe from among the Levites, recorded them in the presence of the king, the officials, Zadok the priest, Ahimelech son of Abiathar, and the heads of the fathers’ houses of the priests and of the Levites—one father’s house being taken for Eleazar, and one being taken for Ithamar.
translation:
  language: pt
  text: Semaías, filho de Natanael, o escriba dentre os levitas, registrou-os na presença do rei, dos oficiais, do sacerdote Zadoque, de Aimeleque, filho de Abiatar, e dos chefes das casas paternas dos sacerdotes e dos levitas — uma casa paterna era tomada para Eleazar, e uma era tomada para Itamar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico é condensado e repete “tomada”: literalmente, “uma casa paterna, uma tomada para Eleazar, e tomada, tomada para Itamar”. A construção indica a seleção de casas paternas das linhagens de Eleazar e de Itamar; a relação exata expressa pela repetição é discutida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתְּבֵם
  choice: registrou-os
  rationale: O verbo כתב com sufixo de terceira pessoa do plural indica que Semaías pôs por escrito os grupos ou resultados mencionados no contexto. “Registrou-os” conserva o caráter documental sem especificar o suporte.
- source_word: הַסּוֹפֵר
  choice: o escriba
  rationale: סֹפֵר designa aqui o escriba ou redator oficial; “escriba” preserva com clareza a função histórica.
- source_word: מִן הַלֵּוִי
  choice: dentre os levitas
  rationale: A expressão assinala que Semaías pertencia ao grupo levítico, preservando o valor partitivo de מן.
- source_word: לִפְנֵי
  choice: na presença de
  rationale: Neste procedimento público, לִפְנֵי indica que o registro foi feito diante das autoridades e testemunhas enumeradas.
- source_word: הַשָּׂרִים
  choice: os oficiais
  rationale: No contexto administrativo da corte, שׂרים refere-se a autoridades ou oficiais, sem necessariamente indicar príncipes de sangue real.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: os chefes das casas paternas
  rationale: A formulação conserva a expressão genealógica e administrativa característica de Crônicas, designando os responsáveis por unidades de parentesco.
- source_word: לַכֹּהֲנִים וְלַלְוִיִּם
  choice: dos sacerdotes e dos levitas
  rationale: A expressão identifica os grupos aos quais pertenciam as casas paternas mencionadas.
- source_word: בֵּית אָב אֶחָד
  choice: uma casa paterna
  rationale: בית אב é uma unidade familiar ou clânica; “casa paterna” mantém a estrutura social do texto hebraico.
- source_word: אָחֻז
  choice: era tomada
  rationale: O particípio passivo de אחז significa literalmente “tomada”. No contexto da distribuição por sortes, indica a seleção de uma unidade familiar, sem exigir que a tradução explicite além do hebraico o mecanismo exato.
- source_word: לְאֶלְעָזָר ... לְאִיתָמָר
  choice: para Eleazar ... para Itamar
  rationale: A preposição ל relaciona cada casa paterna às duas linhagens sacerdotais; “para” preserva de modo conciso a ideia de atribuição.
- source_word: וְאָחֻז אָחֻז לְאִיתָמָר
  choice: e uma era tomada para Itamar
  rationale: O hebraico é comprimido e repete אָחֻז. O texto principal supre “uma” a partir da oração anterior para produzir português inteligível, enquanto a nota conserva a forma e a possível força distributiva do original.
