  register: Português moderno, digno e acessível, com terminologia histórica transparente. Mantiveram-se “escriba” e “casas paternas” por sua relevância institucional em Crônicas. A sintaxe final foi levemente explicitada, mas sua compressão e possível sentido distributivo foram preservados em nota.
