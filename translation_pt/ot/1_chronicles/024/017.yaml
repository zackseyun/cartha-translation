  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/יָכִין
  choice: para Jaquim
  rationale: Neste contexto de uma lista de turnos sacerdotais, לְ indica a atribuição do turno. O nome יָכִין é transliterado na forma portuguesa tradicional «Jaquim».
- source_word: אֶחָד וְ/עֶשְׂרִים
  choice: o vigésimo primeiro
  rationale: Embora a expressão hebraica seja formalmente cardinal, literalmente «um e vinte», sua função na sequência enumerada é ordinal.
- source_word: לְ/גָמוּל
  choice: para Gamul
  rationale: Assim como na primeira oração, לְ marca a atribuição do turno à pessoa ou casa nomeada. גָמוּל é transliterado como «Gamul».
- source_word: שְׁנַיִם וְ/עֶשְׂרִים
  choice: o vigésimo segundo
  rationale: A expressão formalmente cardinal, literalmente «dois e vinte», tem valor ordinal nesta lista de turnos.
