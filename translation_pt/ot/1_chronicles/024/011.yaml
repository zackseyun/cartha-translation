lexical_decisions:
- source_word: לְיֵשׁוּעַ
  choice: para Jesua
  rationale: A preposição לְ marca aqui a atribuição na sequência dos turnos sacerdotais definidos por sorteio. “Para” expressa essa destinação de modo natural, e o nome hebraico é transliterado como “Jesua”.
- source_word: הַתְּשִׁעִי
  choice: o nono
  rationale: O ordinal com artigo é usado substantivamente e indica o nono lugar ou turno na sequência. A forma concisa preserva o estilo enumerativo do hebraico.
- source_word: לִשְׁכַנְיָהוּ
  choice: para Secanias
  rationale: Como na primeira expressão, לְ indica atribuição. “Secanias” é uma forma portuguesa clara e tradicional do nome hebraico שְׁכַנְיָהוּ.
- source_word: הָעֲשִׂרִי
  choice: o décimo
  rationale: O ordinal definido designa o décimo lugar ou turno da série, mantendo a formulação breve da lista hebraica.
