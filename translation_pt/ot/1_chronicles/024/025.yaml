  rationale: Forma portuguesa tradicional do nome, adequada à leitura bíblica moderna; é mantida nas duas ocorrências.
- source_word: לִבְנֵי
  choice: dos filhos de
  rationale: Neste contexto genealógico, לִבְנֵי marca descendência ou pertencimento ao grupo, expresso naturalmente por “dos filhos de”.
- source_word: זְכַרְיָהוּ
  choice: Zacarias
  rationale: Forma tradicional e amplamente reconhecida em português para o nome hebraico.
