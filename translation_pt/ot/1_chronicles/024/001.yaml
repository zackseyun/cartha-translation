base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/001.yaml
  text: 'These were the divisions of the sons of Aaron: the sons of Aaron were Nadab and Abihu[a], Eleazar and Ithamar.'
translation:
  language: pt
  text: 'Quanto aos filhos de Arão, estas eram as suas divisões[a]: os filhos de Arão eram Nadabe e Abiú, Eleazar e Itamar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus turnos”; o termo hebraico se refere a agrupamentos sacerdotais organizados.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי
  choice: Quanto aos filhos de Arão
  rationale: A combinação da conjunção com a preposição introduz o novo assunto da seção. “Quanto aos” reproduz naturalmente essa função em português, sem acrescentar uma ideia temporal inexistente no hebraico.
- source_word: מַחְלְקוֹתָם
  choice: as suas divisões
  rationale: O substantivo indica divisões ou agrupamentos organizados, aqui relacionados ao serviço sacerdotal. O sufixo possessivo plural é expresso por “suas”.
- source_word: בְּנֵי אַהֲרֹן
  choice: os filhos de Arão
  rationale: Tradução direta e natural da construção hebraica, preservando a referência masculina específica.
- source_word: נָדָב
  choice: Nadabe
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַאֲבִיהוּא
  choice: e Abiú
  rationale: Forma tradicional do nome em português, com a conjunção preservada.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וְאִיתָמָר
  choice: e Itamar
  rationale: Forma tradicional do nome em português, com a conjunção preservada.
