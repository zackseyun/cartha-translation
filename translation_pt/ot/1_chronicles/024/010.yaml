  text: o sétimo para Hacoz[a], o oitavo para Abias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a Hacoz... a Abias”. A preposição hebraica ל pode ser traduzida das duas maneiras nesta lista de atribuições.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַקּוֹץ
  choice: para Hacoz
  rationale: A preposição לְ marca a atribuição na lista de turnos. “Para” expressa naturalmente essa relação em português; Hacoz é a forma portuguesa tradicional do nome.
- source_word: הַשְּׁבִעִי
  choice: o sétimo
  rationale: O ordinal articulado identifica o sétimo turno na sequência e preserva o estilo elíptico da lista hebraica.
- source_word: לַאֲבִיָּה
  choice: para Abias
  rationale: A preposição לַ marca novamente a atribuição do turno; Abias é a forma portuguesa tradicional do nome.
- source_word: הַשְּׁמִינִי
  choice: o oitavo
  rationale: O ordinal articulado, paralelo a “o sétimo”, identifica o oitavo turno da sequência.
