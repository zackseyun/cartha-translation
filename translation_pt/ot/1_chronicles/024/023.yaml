  yaml_path: translation/ot/1_chronicles/024/023.yaml
  text: 'And the sons of Jeriah: Amariah the second[a], Jahaziel the third, Jekameam the fourth.'
translation:
  language: pt
  text: 'E os filhos de Jerias: Amarias, o segundo[a]; Jaaziel, o terceiro; Jecameão, o quarto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A construção hebraica da lista é elíptica; literalmente: “E os filhos de Jerias: Amarias, o segundo; Jaaziel, o terceiro; Jecameão, o quarto”. Também se pode explicitar o verbo subentendido: “Amarias era o segundo”, e assim por diante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנָי
  choice: E os filhos de
  rationale: O waw liga o versículo à lista anterior, e o construto plural בְנֵי designa os filhos ou descendentes masculinos neste registro genealógico.
- source_word: יְרִיָּהוּ
  choice: Jerias
  rationale: Forma tradicional e reconhecível do nome em português, baseada na transliteração do hebraico.
- source_word: אֲמַרְיָהוּ
  choice: Amarias
  rationale: Forma portuguesa tradicional do nome próprio hebraico.
- source_word: הַשֵּׁנִי
  choice: o segundo
  rationale: Mantém o ordinal e a sintaxe elíptica e concisa da lista hebraica, sem acrescentar verbo.
- source_word: יַחֲזִיאֵל
  choice: Jaaziel
  rationale: Forma portuguesa tradicional que representa o nome próprio hebraico.
- source_word: הַשְּׁלִישִׁי
  choice: o terceiro
  rationale: Preserva diretamente o ordinal e o paralelismo da enumeração.
- source_word: יְקַמְעָם
  choice: Jecameão
  rationale: Forma portuguesa consagrada para o nome, compatível com a vocalização massorética.
- source_word: הָרְבִיעִי
  choice: o quarto
  rationale: Preserva o ordinal final sem explicitar além do necessário a relação elíptica da lista.
