base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/021.yaml
  text: For Rehabiah[a], from the sons of Rehabiah, the chief was Isshiah.
translation:
  language: pt
  text: Quanto a Reabias, dos filhos de Reabias, o chefe era Issias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִ/רְחַבְיָהוּ
  choice: Quanto a Reabias
  rationale: O לְ prefixado introduz o ramo familiar seguinte na enumeração. “Quanto a” expressa naturalmente essa mudança de tópico em português.
- source_word: לִ/בְנֵי רְחַבְיָהוּ
  choice: dos filhos de Reabias
  rationale: בְּנֵי significa literalmente “filhos de” e, neste contexto genealógico, também pode abranger descendentes; a formulação mantém a expressão concreta do hebraico.
- source_word: הָ/רֹאשׁ
  choice: o chefe
  rationale: רֹאשׁ significa literalmente “cabeça”, mas aqui designa o principal representante do grupo familiar; “chefe” é claro e adequado ao registro administrativo.
- source_word: יִשִּׁיָּה
  choice: Issias
  rationale: Adota-se a forma portuguesa tradicional e legível do nome hebraico, em vez de uma transliteração inglesa.
