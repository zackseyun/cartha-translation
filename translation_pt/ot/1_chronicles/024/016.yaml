  text: para Petaías, o décimo nono; para Jehezquel[a], o vigésimo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Ezequiel». «Jehezquel» representa mais de perto a forma hebraica do nome; algumas traduções empregam a forma mais conhecida «Ezequiel».
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְתַחְיָה
  choice: para Petaías
  rationale: A preposição לְ marca aqui a atribuição do turno ou sorte à casa sacerdotal indicada. O nome próprio é transliterado na forma portuguesa corrente.
- source_word: תִּשְׁעָה עָשָׂר
  choice: o décimo nono
  rationale: Embora formalmente cardinal, a expressão funciona como ordinal nesta sequência de turnos sacerdotais; o substantivo fica implícito, como no hebraico.
- source_word: לִיחֶזְקֵאל
  choice: para Jeezquel[a]
  rationale: A preposição לְ novamente indica atribuição. «Jeezquel» representa de modo mais próximo a forma hebraica do nome neste rol, sem substituí-la silenciosamente pela forma portuguesa mais conhecida «Ezequiel».
- source_word: הָעֶשְׂרִים
  choice: o vigésimo
  rationale: O numeral com artigo tem valor ordinal na enumeração, com «turno» ou «sorte» subentendido.
