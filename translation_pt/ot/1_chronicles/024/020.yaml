base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/020.yaml
  text: 'And for the remaining sons of Levi: for the sons of Amram[a], Shubael; for the sons of Shubael[b], Jehdeiah.'
translation:
  language: pt
  text: 'Quanto aos restantes filhos de Levi: dos filhos de Anrão, Subael; dos filhos de Subael, Jedias.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico é elíptico nesta lista: os nomes pessoais provavelmente indicam o chefe ou representante de cada ramo familiar.'
    reason: cultural_note
lexical_decisions:
- source_word: וְ/לִ/בְנֵי לֵוִי הַ/נּוֹתָרִים
  choice: Quanto aos restantes filhos de Levi
  rationale: A combinação da conjunção com a preposição introduz uma nova seção da lista. “Quanto aos” reproduz naturalmente essa função classificatória, enquanto “restantes” traduz o particípio הַנּוֹתָרִים sem acrescentar explicação ao texto.
- source_word: לִ/בְנֵי עַמְרָם
  choice: dos filhos de Anrão
  rationale: A preposição introduz o ramo familiar na lista. “Anrão” é a forma tradicional e amplamente reconhecida em português para עַמְרָם.
- source_word: שׁוּבָאֵל
  choice: Subael
  rationale: Transliteração portuguesa corrente do nome hebraico, preservando sua função elíptica como nome representativo do ramo familiar.
- source_word: לִ/בְנֵי שׁוּבָאֵל
  choice: dos filhos de Subael
  rationale: Mantém a estrutura repetitiva e administrativa do hebraico, introduzindo a subdivisão seguinte da família.
- source_word: יֶחְדְּיָהוּ
  choice: Jedias
  rationale: Forma portuguesa tradicional e legível do nome hebraico; variantes de transliteração como “Jeadias” são possíveis.
