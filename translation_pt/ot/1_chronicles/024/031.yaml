base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/031.yaml
  text: These also cast lots alongside their brothers[a], the sons of Aaron, before King David, Zadok, Ahimelech[b], and the heads of the fathers’ houses of the priests and of the Levites—the chief fathers’ houses as well as those of their younger brothers.
translation:
  language: pt
  text: Eles também lançaram sortes ao lado de seus irmãos[a], os filhos de Arão, na presença do rei Davi, de Zadoque, de Aimeleque e dos chefes das famílias dos sacerdotes e dos levitas — as famílias dos chefes, assim como as de seus irmãos mais novos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em correspondência com seus irmãos”. A expressão hebraica pode indicar posição oposta, correspondência ou disposição paralela.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “as famílias do chefe em correspondência com seu irmão mais novo”. A frase é condensada; os singulares podem ter sentido distributivo, indicando que as famílias principais e as de seus irmãos mais novos participaram de modo correspondente no sorteio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפִּילוּ ... גּוֹרָלוֹת
  choice: lançaram sortes
  rationale: Expressão portuguesa corrente para o idioma hebraico de lançar sortes, preservando o caráter formal do procedimento.
- source_word: גַם הֵם
  choice: Também estes
  rationale: Retoma os grupos levíticos mencionados anteriormente e indica que eles igualmente participaram do sorteio.
- source_word: לְעֻמַּת אֲחֵיהֶם בְּנֵי אַהֲרֹן
  choice: em igualdade com seus irmãos, os filhos de Arão
  rationale: לְעֻמַּת admite os sentidos de diante de, em correspondência com e em paralelo com. No contexto administrativo, esta formulação comunica tratamento correspondente sem impor uma disposição espacial.
- source_word: לִפְנֵי
  choice: na presença de
  rationale: Torna explícito o cenário público e oficial do sorteio.
- source_word: דָוִיד הַמֶּלֶךְ
  choice: o rei Davi
  rationale: Segue a ordem natural do título e do nome em português.
- source_word: וְצָדוֹק וַאֲחִימֶלֶךְ
  choice: de Zadoque, de Aimeleque
  rationale: Emprega formas portuguesas tradicionais dos nomes e repete a preposição para tornar clara a coordenação com 'na presença de'.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: os chefes das famílias
  rationale: Designa os líderes das casas ancestrais; 'famílias' comunica de modo natural a estrutura social pretendida, sem a estranheza de uma tradução literal.
- source_word: לַכֹּהֲנִים וְלַלְוִיִּם
  choice: dos sacerdotes e dos levitas
  rationale: Identifica os grupos aos quais pertenciam as famílias e seus chefes.
- source_word: אָבוֹת הָרֹאשׁ לְעֻמַּת אָחִיו הַקָּטָן
  choice: tanto a família do chefe como a de seu irmão mais novo
  rationale: Mantém os singulares e a concisão da construção hebraica, entendendo אָבוֹת no sentido de casa ou família ancestral. A correlação 'tanto... como' expressa a participação equivalente indicada por לְעֻמַּת sem transformar explicitamente os termos em ramos coletivos.
