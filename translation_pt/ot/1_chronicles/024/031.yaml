review_pass:
  verdict: revise
  source_fidelity: A tradução de וַיַּפִּילוּ ... גּוֹרָלוֹת como “lançaram sortes” é fiel. Contudo, “em igualdade com” para לְעֻמַּת antecipa como afirmação principal uma implicação de paridade que o termo, semanticamente mais amplo, não exige; “ao lado de” preserva melhor a relação paralela sem a definir em excesso. No membro final, os singulares hebraicos provavelmente têm valor distributivo, e a formulação plural institucional comunica isso com mais clareza em português.
  naturalness: O texto é geralmente claro e de registro adequado. “Também estes” é possível, mas “Eles também” é mais natural no português atual. A expressão “a família do chefe” soa excessivamente individual e cria uma imagem menos clara do que a referência a casas/famílias ancestrais; a construção plural distributiva é mais idiomática.
  terminology: “Arão”, “Davi”, “Zadoque”, “Aimeleque”, “sacerdotes” e “levitas” são formas adequadas. “Chefes das famílias” é uma solução legível para רָאשֵׁי הָאָבוֹת, embora “famílias” deva ser entendido no sentido de casas ancestrais. A nota b deve referir-se a “irmãos mais novos”, não a “membros mais novos”.
  issues:
  - severity: medium
    issue: “em igualdade com seus irmãos” restringe excessivamente לְעֻמַּת.
    rationale: O termo pode expressar posição correspondente, paralela ou oposta; a igualdade de tratamento é uma interpretação contextual plausível, mas não deve substituir no texto a relação mais aberta.
  - severity: medium
    issue: 'O trecho final usa singular individualizante: “a família do chefe como a de seu irmão mais novo”.'
    rationale: A construção hebraica é condensada e os singulares são provavelmente distributivos. Em português, a redação plural referente às casas ancestrais preserva melhor o sentido institucional e evita sugerir apenas um chefe e um irmão.
  - severity: low
    issue: A nota b diz “membros mais novos”.
    rationale: אָחִיו הַקָּטָן significa literalmente “seu irmão mais novo”; “membros” não corresponde ao termo hebraico e enfraquece a relação expressa.
  revised_text: Eles também lançaram sortes ao lado de seus irmãos[a], os filhos de Arão, na presença do rei Davi, de Zadoque, de Aimeleque e dos chefes das famílias dos sacerdotes e dos levitas — as famílias dos chefes, assim como as de seus irmãos mais novos[b].
