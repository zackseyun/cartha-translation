revisions:
- from: Também estes lançaram sortes, em igualdade com seus irmãos[a], os filhos de Arão, na presença do rei Davi, de Zadoque, de Aimeleque e dos chefes das famílias dos sacerdotes e dos levitas — tanto a família do chefe como a de seu irmão mais novo[b].
  to: Eles também lançaram sortes ao lado de seus irmãos[a], os filhos de Arão, na presença do rei Davi, de Zadoque, de Aimeleque e dos chefes das famílias dos sacerdotes e dos levitas — as famílias dos chefes, assim como as de seus irmãos mais novos[b].
  rationale: A revisão substitui a afirmação interpretativa de igualdade por uma formulação que conserva a amplitude de לְעֻמַּת, melhora a fluência inicial e torna o membro final institucional e distributivo, sem eliminar a ambiguidade do hebraico. As notas foram ajustadas para refletir com precisão as alternativas lexicais e a relação de parentesco do texto-fonte.
