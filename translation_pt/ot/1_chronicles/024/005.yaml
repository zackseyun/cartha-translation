base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/005.yaml
  text: So they divided them by lots[a], these with those[b], because there were officers of the sanctuary and officers of God from the sons of Eleazar and from the sons of Ithamar.
translation:
  language: pt
  text: Assim, eles os repartiram por sorteio, estes com aqueles[a], pois havia autoridades do santuário e autoridades de Deus[b] tanto entre os filhos de Eleazar como entre os filhos de Itamar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “estes com estes”; uma expressão que relaciona grupos correspondentes.
    reason: lexical_alternative
  - marker: b
    text: Ou “chefes do santuário e chefes de Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְלְקוּם
  choice: eles os repartiram
  rationale: O piel de חלק com sufixo de terceira pessoa plural expressa a distribuição dos grupos sacerdotais. “Repartiram” preserva a ideia concreta de divisão e atribuição.
- source_word: בְּגוֹרָלוֹת
  choice: por sorteio
  rationale: גורל designa o uso de sortes como meio de atribuição. Em português atual, “por sorteio” comunica naturalmente o procedimento, embora o hebraico empregue o plural.
- source_word: אֵלֶּה עִם אֵלֶּה
  choice: uns com os outros
  rationale: A expressão demonstrativa é tersa e põe os dois grupos em correspondência. A formulação portuguesa preserva o sentido distributivo sem especificar além do texto.
- source_word: שָׂרֵי קֹדֶשׁ
  choice: chefes do santuário
  rationale: שׂרים pode indicar chefes, líderes ou autoridades. Neste contexto cultual, קֹדֶשׁ aponta naturalmente para a esfera santa, aqui expressa como “santuário”.
- source_word: וְשָׂרֵי הָאֱלֹהִים
  choice: e chefes de Deus
  rationale: A tradução mantém a formulação incomum e literalmente atestada, sem acrescentar “casa” ou “serviço”, palavras ausentes do hebraico.
- source_word: מִבְּנֵי אֶלְעָזָר וּבִבְנֵי אִיתָמָר
  choice: tanto entre os filhos de Eleazar como entre os filhos de Itamar
  rationale: A construção identifica representantes nas duas linhagens sacerdotais. “Tanto... como...” torna clara a correspondência, e “filhos” mantém a expressão genealógica tradicional.
theological_decisions:
- issue: Sentido de שָׂרֵי קֹדֶשׁ וְשָׂרֵי הָאֱלֹהִים
  choice: Preservar as duas designações paralelas como “chefes do santuário e chefes de Deus”.
  alternative: “autoridades das coisas sagradas e autoridades de Deus” ou entender a segunda expressão como “chefes da casa de Deus”.
  rationale: O hebraico apresenta duas designações paralelas, mas não explica precisamente a distinção entre elas. A tradução não as harmoniza nem acrescenta uma referência explícita à casa ou ao serviço de Deus.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Por sorteio” é mais idiomático do que a reprodução formal do plural hebraico; a expressão incomum “chefes de Deus” foi mantida para preservar a ambiguidade do original.
