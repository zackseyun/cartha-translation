  naturalness: O texto é geralmente claro e de registro apropriado. “Estes com aqueles” é uma formulação um pouco mais marcada, mas é clara no contexto e preserva melhor a expressão hebraica. “Chefes de Deus” é incomum em português, porém a estranheza reflete uma designação elíptica do original; “autoridades de Deus” soa mais digno e menos coloquial sem suprir “casa” ou “serviço”.
  terminology: “Santuário” é uma boa solução para קֹדֶשׁ neste paralelismo cultual. “Autoridades” representa adequadamente שָׂרִים. Mantém-se “de Deus” sem expandir indevidamente a expressão hebraica.
