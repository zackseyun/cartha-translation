lexical_decisions:
- source_word: לְמַחְלִי
  choice: Quanto a Mali
  rationale: O לְ prefixado funciona provavelmente como marcador de tópico ou cabeçalho na lista genealógica. “Quanto a Mali” é natural em português e preserva essa estrutura.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Forma tradicional e amplamente reconhecida do nome pessoal em português.
- source_word: וְלֹא הָיָה לוֹ
  choice: e ele não teve
  rationale: O idioma hebraico, literalmente “e não havia para ele”, expressa posse; em português corrente, “ele não teve” comunica naturalmente o sentido, mantendo a conjunção simples.
- source_word: בָּנִים
  choice: filhos
  rationale: בָּנִים designa filhos do sexo masculino neste contexto genealógico; “filhos” preserva a referência relevante à linhagem.
