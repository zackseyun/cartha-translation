base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/002.yaml
  text: But Nadab and Abihu died before their father[a], and they had no sons; so Eleazar and Ithamar served as priests.
translation:
  language: pt
  text: Nadabe e Abiú morreram antes de seu pai[a] e não tiveram filhos; por isso, Eleazar e Itamar serviram como sacerdotes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na presença de seu pai”. A expressão hebraica pode ser entendida em sentido espacial (“diante de”, “na presença de”) ou temporal (“antes de”, isto é, durante a vida do pai).'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּמָת
  choice: morreram
  rationale: O wayyiqtol de מוּת relata um acontecimento passado. Como o verbo antecede o sujeito composto Nadabe e Abiú, o português pede naturalmente o plural.
- source_word: לִפְנֵי
  choice: antes de
  rationale: Com “seu pai”, a expressão pode indicar anterioridade temporal — isto é, que morreram enquanto o pai ainda vivia —, mas também admite o sentido espacial “na presença de”; a ambiguidade é preservada em nota.
- source_word: אֲבִיהֶם
  choice: seu pai
  rationale: O substantivo com sufixo de terceira pessoa do plural refere-se ao pai de Nadabe e Abiú. Em português, “seu pai” é claro e natural neste contexto.
- source_word: וּבָנִים לֹא הָיוּ לָהֶם
  choice: não tiveram filhos
  rationale: בָּנִים designa descendentes masculinos neste contexto genealógico e sacerdotal. “Filhos” conserva o dado lexical sem ampliar para “crianças” ou “descendentes”.
- source_word: וַיְכַהֲנוּ
  choice: serviram como sacerdotes
  rationale: O piel de כָּהַן expressa o exercício do serviço sacerdotal; esta formulação conserva a força verbal e é clara em português moderno.
- source_word: אֶלְעָזָר וְאִיתָמָר
  choice: Eleazar e Itamar
  rationale: Formas tradicionais e amplamente reconhecíveis dos nomes bíblicos em português.
