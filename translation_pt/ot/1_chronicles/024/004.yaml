revisions:
- from: 'Constatou-se que havia mais chefes de homens[a] entre os filhos de Eleazar do que entre os filhos de Itamar; então, eles os dividiram assim: para os filhos de Eleazar, dezesseis chefes de casas paternas; e para os filhos de Itamar, oito, segundo suas casas paternas[b].'
  to: 'Verificou-se que, entre os filhos de Eleazar, havia mais homens que eram chefes[a] do que entre os filhos de Itamar. E eles os dividiram assim: para os filhos de Eleazar, dezesseis chefes de casas paternas; e, para os filhos de Itamar, oito segundo suas casas paternas[b].'
  rationale: A revisão esclarece em português a relação entre «homens» e «chefes», evita apresentar a divisão como necessariamente consequente e simplifica a nota lexical para que ela informe uma possibilidade sem impor uma identificação contextual. Os números, a estrutura de casas paternas e a ambiguidade lexical relevante são preservados.
