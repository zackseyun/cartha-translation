base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/004.yaml
  text: 'The sons of Eleazar were found to be more numerous[a], as heads of the men, than the sons of Ithamar, and they divided them thus: for the sons of Eleazar, sixteen heads of fathers’ houses, and for the sons of Ithamar, according to their fathers’ houses[b], eight.'
translation:
  language: pt
  text: 'Verificou-se que, entre os filhos de Eleazar, havia mais homens que eram chefes[a] do que entre os filhos de Itamar. E eles os dividiram assim: para os filhos de Eleazar, dezesseis chefes de casas paternas; e, para os filhos de Itamar, oito segundo suas casas paternas[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido por «homens» também pode ter a conotação de homens fortes ou valentes. Outra tradução possível é «homens valentes que eram chefes».
    reason: lexical_alternative
  - marker: b
    text: «Casas paternas» eram clãs ou grupos familiares ancestrais, uma unidade comum da organização familiar e administrativa de Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּמָּצְאוּ רַבִּים
  choice: Constatou-se que havia mais
  rationale: O nifal de מצא apresenta uma situação constatada, e רַבִּים tem sentido comparativo no contexto. A formulação comunica isso naturalmente em português sem sugerir uma descoberta física.
- source_word: לְרָאשֵׁי הַגְּבָרִים
  choice: chefes de homens
  rationale: רֹאשׁ designa chefe ou líder, enquanto גְּבָרִים significa homens e pode, em outros contextos, enfatizar força ou valentia. A tradução mantém a expressão abrangente e evita impor uma referência militar pouco provável neste contexto sacerdotal.
- source_word: וַיַּחְלְקוּם
  choice: então, eles os dividiram assim
  rationale: O verbo descreve a distribuição dos sacerdotes em grupos. O pronome sujeito preserva a referência implícita aos responsáveis mencionados no contexto anterior, e “assim” introduz a distribuição numérica.
- source_word: רָאשִׁים לְבֵית אָבוֹת
  choice: chefes de casas paternas
  rationale: A expressão designa líderes das unidades familiares ancestrais de Israel. “Casas paternas” conserva a terminologia estrutural e genealógica de Crônicas.
- source_word: שִׁשָּׁה עָשָׂר ... שְׁמוֹנָה
  choice: dezesseis ... oito
  rationale: Os números indicam, respectivamente, a quantidade de chefes ou grupos atribuídos aos descendentes de Eleazar e aos de Itamar.
- source_word: לְבֵית אֲבוֹתָם
  choice: segundo suas casas paternas
  rationale: A expressão com sufixo pronominal indica que os descendentes de Itamar foram organizados de acordo com suas próprias unidades familiares ancestrais.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita o literalismo pouco natural de “foram achados mais numerosos”, mas preserva a ideia de uma situação constatada. Mantém-se “casas paternas” por seu valor técnico no contexto genealógico, explicado em nota.
