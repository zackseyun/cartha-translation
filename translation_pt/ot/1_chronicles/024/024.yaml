  text: בְּנֵ֤י עֻזִּיאֵל֙ מִיכָ֔ה לִ/בְנֵ֥י מִיכָ֖ה שמור׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/024.yaml
  text: 'The sons of Uzziel: Micah[a]; of the sons of Micah: Shamir.'
translation:
  language: pt
  text: 'Dos filhos de Uziel: Mica; dos filhos de Mica: Samir.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Semor”.
    reason: A grafia hebraica שמור permite esta representação alternativa do nome próprio.
lexical_decisions:
- source_word: בְּנֵי
  choice: Dos filhos de
  rationale: O plural construto de בֵּן introduz uma fórmula genealógica. “Dos filhos de” é direto, natural em português e adequado ao formato de lista.
- source_word: עֻזִּיאֵל
  choice: Uziel
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: מִיכָה
  choice: Mica
  rationale: Forma portuguesa tradicional do nome próprio hebraico, adequada ao registro bíblico sem dificultar a leitura.
- source_word: לִ/בְנֵי
  choice: dos filhos de
  rationale: Nesta enumeração genealógica, o לְ funciona como elo ou cabeçalho da lista; “dos filhos de” reproduz idiomaticamente a relação sem impor a tradução rígida “para”.
- source_word: שמור
  choice: Samir
  rationale: Forma convencional do nome próprio em traduções portuguesas; a grafia consonantal hebraica também admite representação alternativa, registrada em nota.
