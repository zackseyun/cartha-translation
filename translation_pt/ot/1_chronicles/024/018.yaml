  text: para Delaías, o vigésimo terceiro; para Maazias, o vigésimo quarto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִ/דְלָיָהוּ
  choice: para Delaías
  rationale: O prefixo לְ marca a atribuição do turno ou sorte nesta lista de divisões sacerdotais. “Para Delaías” expressa naturalmente essa relação em português, preservando o nome por transliteração.
- source_word: שְׁלֹשָׁה וְ/עֶשְׂרִים
  choice: o vigésimo terceiro
  rationale: A expressão hebraica é formalmente cardinal, literalmente “três e vinte”, mas funciona como ordinal na sequência dos turnos. A forma ordinal é a expressão idiomática adequada em português.
- source_word: לְ/מַעַזְיָהוּ
  choice: para Maazias
  rationale: Como no primeiro nome, o prefixo לְ indica a atribuição do turno ou sorte. “Para Maazias” comunica esse sentido com clareza e naturalidade.
- source_word: אַרְבָּעָה וְ/עֶשְׂרִים
  choice: o vigésimo quarto
  rationale: Embora a construção hebraica seja formalmente cardinal, “quatro e vinte”, seu valor nesta enumeração é ordinal. “O vigésimo quarto” reproduz essa função em português corrente.
