lexical_decisions:
- source_word: וּבְנֵי מוּשִׁי
  choice: E os filhos de Musi
  rationale: Mantém a conjunção que liga o versículo à lista anterior e conserva a fórmula genealógica hebraica de modo natural em português.
- source_word: מַחְלִי וְעֵדֶר וִירִימוֹת
  choice: Mali, Éder e Jerimote
  rationale: Translitera os nomes próprios em formas correntes e legíveis em português; as conjunções hebraicas são representadas pela coordenação natural da lista portuguesa.
- source_word: אֵלֶּה בְּנֵי הַלְוִיִּם
  choice: Estes foram os filhos dos levitas
  rationale: Conserva a expressão genealógica literal “filhos dos levitas”; o verbo no passado, suprido em português, harmoniza-se com o registro narrativo da genealogia.
- source_word: לְבֵית אֲבֹתֵיהֶם
  choice: segundo as suas casas paternas
  rationale: Expressa a organização por famílias ou clãs da linhagem paterna, preservando a imagem institucional do hebraico.
