  text: 'And the sons of Mushi: Mahli[a], Eder, and Jeremoth. These were the sons of the Levites according to their fathers'' houses.'
translation:
  language: pt
  text: 'E os filhos de Musi: Mali, Éder e Jerimote[a]. Estes foram os filhos dos levitas, segundo as suas casas paternas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
