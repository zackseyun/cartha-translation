  text: for Huppah[a], the thirteenth; for Jeshebeab, the fourteenth.
translation:
  language: pt
  text: para Hupá, o décimo terceiro; para Jesebeabe, o décimo quarto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/חֻפָּה
  choice: para Hupá
  rationale: O לְ prefixado marca a atribuição do turno à casa sacerdotal nomeada; “para Hupá” é natural em português e preserva o sentido da designação.
- source_word: שְׁלֹשָׁה עָשָׂר
  choice: o décimo terceiro
  rationale: Embora a expressão hebraica seja formalmente cardinal, neste contexto de sorteio ordenado tem função ordinal.
- source_word: לְ/יֶשֶׁבְאָב
  choice: para Jesebeabe
  rationale: Como no primeiro nome, o לְ indica a atribuição do turno. “Jesebeabe” representa o nome próprio hebraico de modo legível e reconhecível em português.
- source_word: אַרְבָּעָה עָשָׂר
  choice: o décimo quarto
  rationale: A expressão cardinal hebraica funciona como ordinal na sequência dos turnos sorteados.
theological_decisions: []
translation_notes:
  register: Tradução concisa e digna, adequada ao formato enumerativo do contexto. A preposição “para” comunica naturalmente a atribuição dos turnos em português, sem necessidade de nota, pois a alternativa literal “a” não constitui diferença material de sentido.
