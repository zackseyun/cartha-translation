  text: the eleventh to Eliashib[b][a], the twelfth to Jakim.
translation:
  language: pt
  text: A décima primeira[b], para Eliasibe[a]; a décima segunda, para Jaquim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a Eliasibe ... a Jaquim”. A preposição hebraica pode ser traduzida das duas maneiras nesta lista de atribuições.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “onze ... doze”; neste contexto, os números funcionam como ordinais na sequência das sortes.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/אֶלְיָשִׁיב
  choice: para Eliasibe
  rationale: O לְ prefixado indica atribuição nesta lista de turnos; “para” expressa isso naturalmente em português. O nome é transliterado na forma portuguesa corrente “Eliasibe”.
- source_word: עַשְׁתֵּי עָשָׂר
  choice: a décima primeira
  rationale: Embora a expressão hebraica seja literalmente cardinal, “onze”, no contexto da sequência de sortes ela funciona como ordinal. Não se acrescenta “sorte”, pois o termo está apenas implícito.
- source_word: לְ/יָקִים
  choice: para Jaquim
  rationale: O לְ prefixado volta a marcar atribuição. “Jaquim” representa de modo natural em português a vocalização hebraica יָקִים.
- source_word: שְׁנֵים עָשָׂר
  choice: a décima segunda
  rationale: A expressão cardinal “doze” tem função ordinal nesta lista administrativa. “Sorte” permanece implícito e, por isso, não é inserido no texto.
