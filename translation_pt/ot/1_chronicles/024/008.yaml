lexical_decisions:
- source_word: לְחָרִם
  choice: para Harim
  rationale: A preposição לְ marca a atribuição do turno por sorteio. “Para” expressa essa relação naturalmente em português, e Harim é transliterado como nome próprio.
- source_word: הַשְּׁלִישִׁי
  choice: o terceiro
  rationale: O ordinal definido se refere elipticamente ao terceiro sorteio ou turno; preserva-se a forma concisa da lista hebraica.
- source_word: לִשְׂעֹרִים
  choice: para Seorim
  rationale: Como no primeiro nome, a preposição לְ indica atribuição por sorteio. Seorim é transliterado diretamente da forma hebraica.
- source_word: הָרְבִעִי
  choice: o quarto
  rationale: O ordinal definido, paralelo a “o terceiro”, se refere ao quarto sorteio ou turno e mantém a concisão do original.
