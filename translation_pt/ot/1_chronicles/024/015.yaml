- source_word: לְחֵזִיר
  choice: para Hezir
  rationale: O prefixo לְ marca a atribuição do turno por sorteio; em português, «para Hezir» expressa naturalmente essa distribuição. O nome próprio é transliterado.
- source_word: שִׁבְעָה עָשָׂר
  choice: o décimo sétimo
  rationale: No contexto da sequência ordenada dos turnos sacerdotais, o numeral cardinal hebraico tem função ordinal.
- source_word: לְהַפִּצֵּץ
  choice: para Hapises
  rationale: O prefixo לְ indica novamente a atribuição na sequência. «Hapises» é uma transliteração portuguesa legível do nome próprio hebraico.
- source_word: שְׁמוֹנָה עָשָׂר
  choice: o décimo oitavo
  rationale: O contexto da lista de sorteios requer sentido ordinal em português.
