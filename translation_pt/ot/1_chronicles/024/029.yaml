base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/029.yaml
  text: 'For Kish: the sons of Kish[a], Jerahmeel.'
translation:
  language: pt
  text: 'Quanto a Quis[a]: os filhos de Quis: Jerameel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “De Quis” ou “No que se refere a Quis”; a preposição hebraica pode funcionar como cabeçalho nesta lista.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקִישׁ
  choice: Quanto a Quis
  rationale: O לְ prefixado funciona aqui como marcador de tópico ou cabeçalho na lista. “Quanto a Quis” reproduz naturalmente essa função sem forçar uma relação de posse.
- source_word: בְּנֵי
  choice: dos filhos de
  rationale: É o plural construto de “filho”. Como o texto nomeia em seguida um único integrante, “dos filhos de Quis, Jerameel” preserva a forma elíptica da lista e evita ampliar desnecessariamente para “descendentes”.
- source_word: קִישׁ
  choice: Quis
  rationale: Forma tradicional e amplamente reconhecível em português para o nome próprio hebraico.
- source_word: יְרַחְמְאֵל
  choice: Jerameel
  rationale: Transliteração portuguesa clara do nome próprio hebraico, compatível com o uso bíblico corrente.
