base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/027.yaml
  text: 'The sons of Merari: of Jaaziah, his son, Shoham, Zaccur, and Ibri.'
translation:
  language: pt
  text: 'Os filhos de Merari: de Jaazias, seu filho[a], Soão, Zacur e Ibri.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “seu filho”. A sintaxe é difícil; alguns entendem a expressão como o nome próprio “Benô”, enquanto outros a interpretam no plural, “seus filhos”.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי מְרָרִי
  choice: Os filhos de Merari
  rationale: O construto plural introduz uma lista genealógica. “Filhos de” é direto e convencional, sem excluir a ideia mais ampla de descendentes.
- source_word: לְיַעֲזִיָּהוּ
  choice: de Jaazias
  rationale: O prefixo לְ é entendido aqui em sentido genealógico, indicando o ramo associado a Jaazias.
- source_word: בְנוֹ
  choice: seu filho
  rationale: A vocalização massorética dá literalmente “seu filho”. A sintaxe é difícil, por isso outras interpretações são registradas em nota.
- source_word: וְשֹׁהַם
  choice: Soão
  rationale: Nome próprio transliterado segundo forma portuguesa clara e corrente.
- source_word: וְזַכּוּר
  choice: Zacur
  rationale: Nome próprio transliterado segundo forma portuguesa corrente.
- source_word: וְעִבְרִי
  choice: Ibri
  rationale: Nome próprio transliterado.
