  text: אֵ֣לֶּה פְקֻדָּתָ֞/ם לַ/עֲבֹדָתָ֗/ם לָ/ב֤וֹא לְ/בֵית יְהוָה֙ כְּ/מִשְׁפָּטָ֔/ם בְּ/יַ֖ד אַהֲרֹ֣ן אֲבִי/הֶ֑ם כַּ/אֲשֶׁ֣ר צִוָּ֔/הוּ יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/019.yaml
  text: These were their appointed duties for their service[a], to enter the house of Yahweh according to their ordinance, under the hand of Aaron their father, as Yahweh, the God of Israel[b], had commanded him.
translation:
  language: pt
  text: 'Estas eram as atribuições designadas para o serviço deles: entrar na casa de Yahweh conforme a ordem prescrita[a], sob a autoridade de Arão, pai deles[b], assim como Yahweh, o Deus de Israel, lhe havia ordenado.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “conforme a sua ordenança”. O termo hebraico pode designar uma norma, ordenança ou procedimento prescrito.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica diz literalmente “sob/pela mão de Arão” e pode indicar administração, direção ou autoridade. Aqui, “pai” também tem o sentido genealógico de ancestral.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדָּתָם
  choice: as atribuições designadas
  rationale: O substantivo derivado de פקד indica aqui incumbências formalmente atribuídas aos grupos sacerdotais; a expressão comunica tanto a nomeação quanto as responsabilidades decorrentes dela.
- source_word: לַעֲבֹדָתָם
  choice: para o serviço deles
  rationale: עֲבֹדָה, no contexto do templo, designa serviço cultual. “Serviço” é claro e evita associações eclesiásticas posteriores que “ministério” poderia sugerir.
- source_word: לָבוֹא לְבֵית יְהוָה
  choice: entrar na casa de Yahweh
  rationale: O infinitivo בוא expressa vir ou entrar; neste contexto, “entrar” explicita naturalmente o acesso à casa de Yahweh para o serviço, enquanto “casa” preserva a expressão hebraica em vez de substituí-la por “templo”.
- source_word: כְּמִשְׁפָּטָם
  choice: conforme a ordem prescrita
  rationale: מִשְׁפָּט pode indicar norma, ordenança ou procedimento estabelecido. Aqui se refere à regulamentação que governava a escala e o serviço sacerdotal; “ordem prescrita” preserva esse caráter formal sem sugerir uma decisão judicial.
- source_word: בְּיַד אַהֲרֹן
  choice: sob a autoridade de Arão
  rationale: A expressão idiomática, literalmente “sob/pela mão de Arão”, pode denotar administração, direção ou autoridade. A tradução comunica seu sentido no contexto sacerdotal, e a forma literal é registrada em nota.
- source_word: אֲבִיהֶם
  choice: seu pai
  rationale: O hebraico diz literalmente “pai deles”. Arão é o ancestral da linhagem sacerdotal, e “pai” mantém a formulação genealógica do texto.
- source_word: כַּאֲשֶׁר צִוָּהוּ
  choice: assim como ... lhe havia ordenado
  rationale: O sufixo singular de צִוָּהוּ refere-se naturalmente a Arão. O mais-que-perfeito deixa claro, em português, que a ordem divina precedeu a organização aqui descrita.
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: Yahweh, o Deus de Israel
  rationale: A forma mantém o nome divino e apresenta “o Deus de Israel” como aposição, refletindo a sequência hebraica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o tetragrama. “Yahweh” preserva o nome pactual e evita substituí-lo por um título, sem ocultar que outras tradições portuguesas usam “SENHOR” ou “Jeová”.
- issue: Sentido de בְּיַד אַהֲרֹן na administração sacerdotal
  choice: sob a autoridade de Arão
  alternative: pela mão de Arão; sob a mão de Arão
  rationale: A locução pode indicar agência ou autoridade. O contexto favorece a supervisão administrativa de Arão; a nota conserva a imagem literal e a ambiguidade idiomática.
translation_notes:
  register: Português atual, digno e de leitura ampla, com boa naturalidade no Brasil. “Atribuições designadas” preserva o caráter formal das incumbências sacerdotais; “casa de Yahweh” mantém a imagem hebraica. Os dois-pontos apresentam com clareza o conteúdo das atribuições sem alterar a relação sintática do versículo.
