  text: The first lot came out for Jehoiarib[a], the second for Jedaiah.
translation:
  language: pt
  text: A primeira sorte saiu para Jeoiaribe[a]; a segunda, para Jedaías.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de forma mais idiomática: “A primeira sorte coube a Jeoiaribe; a segunda, a Jedaías”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: Preserva o sentido básico de יצא, «sair», e é natural em português para indicar o resultado de um sorteio.
- source_word: הַגּוֹרָל
  choice: sorteio
  rationale: Neste contexto, גּוֹרָל pode designar o procedimento ou resultado da distribuição por sortes. «Sorteio» comunica com clareza o procedimento de atribuição das divisões sacerdotais.
- source_word: הָרִאשׁוֹן
  choice: o primeiro
  rationale: Mantém a sequência ordinal e o artigo definido do hebraico.
- source_word: לִיהוֹיָרִיב
  choice: para Jeoiaribe
  rationale: A preposição ל marca o destinatário da atribuição; «para» é natural em português. A forma do nome segue uma transliteração portuguesa legível.
- source_word: לִידַעְיָה
  choice: para Jedaías
  rationale: A preposição ל indica o destinatário do segundo resultado; «para» expressa adequadamente essa atribuição.
- source_word: הַשֵּׁנִי
  choice: o segundo
  rationale: Reproduz a sequência ordinal do hebraico; a elipse de «sorteio saiu» na segunda oração evita repetição sem perda de sentido.
