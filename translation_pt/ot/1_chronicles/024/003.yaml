base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/003.yaml
  text: David[a], with Zadok from the sons of Eleazar and Ahimelech from the sons of Ithamar, divided them according to their appointment in their service.
translation:
  language: pt
  text: Davi, com Zadoque, dentre os filhos de Eleazar, e Aimeleque, dentre os filhos de Itamar, dividiu-os[a] de acordo com suas atribuições em seu serviço.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dividiu-os para as funções que lhes foram designadas no serviço”. A expressão hebraica reúne as ideias de incumbência, supervisão e organização por funções.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחָלְקֵם
  choice: dividiu-os
  rationale: Traduz diretamente o verbo חלק com o sufixo de terceira pessoa do plural. O contexto indica uma organização em grupos, mas “dividiu-os” preserva a forma concisa do hebraico.
- source_word: וְצָדוֹק
  choice: com Zadoque
  rationale: A conjunção hebraica liga Zadoque à ação de Davi; “com” expressa naturalmente sua participação sem acrescentar uma relação hierárquica.
- source_word: מִן בְּנֵי אֶלְעָזָר
  choice: dos filhos de Eleazar
  rationale: Identifica Zadoque como pertencente à linhagem de Eleazar. “Filhos” mantém a expressão genealógica do hebraico, podendo abranger descendentes.
- source_word: וַאֲחִימֶלֶךְ
  choice: e Aimeleque
  rationale: Emprega a forma tradicional e amplamente reconhecível do nome em português.
- source_word: מִן בְּנֵי אִיתָמָר
  choice: dos filhos de Itamar
  rationale: Mantém o paralelismo com a identificação da linhagem de Zadoque.
- source_word: לִפְקֻדָּתָם
  choice: de acordo com suas atribuições
  rationale: פקדה pode indicar incumbência, função, supervisão ou ordenação administrativa. “Atribuições” comunica funções designadas sem restringir indevidamente a nuance.
- source_word: בַּעֲבֹדָתָם
  choice: no serviço
  rationale: עבודה designa trabalho ou serviço e, neste contexto, o serviço sacerdotal. A formulação é clara sem explicitar no texto aquilo que o contexto já estabelece.
