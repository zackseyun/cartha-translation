  text: בְּנֵ֣י מְנַשֶּׁ֔ה אַשְׂרִיאֵ֖ל אֲשֶׁ֣ר יָלָ֑דָה פִּֽילַגְשׁ/וֹ֙ הָֽ/אֲרַמִּיָּ֔ה יָלְדָ֕ה אֶת מָכִ֖יר אֲבִ֥י גִלְעָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/014.yaml
  text: 'The sons of Manasseh: Asriel[a], whom his Aramean concubine bore[c][b]; she bore Machir the father of Gilead.'
translation:
  language: pt
  text: 'Os filhos de Manassés: Asriel,[a] a quem a concubina arameia de Manassés[b] deu à luz; ela deu à luz Maquir, pai de Gileade.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Os descendentes de Manassés”. Nas genealogias, “filhos” às vezes pode designar descendentes de modo mais amplo.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “a arameia”; tradicionalmente: “a síria”.'
    reason: lexical_alternative
  - marker: c
    text: “Pai de Gileade” também pode ter o sentido de “antepassado” ou “fundador” no uso genealógico.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי מְנַשֶּׁה
  choice: Os filhos de Manassés
  rationale: Mantém o sentido formal e o estilo genealógico do construto plural hebraico; em genealogias, porém, “filhos” também pode abranger descendentes, possibilidade registrada em nota.
- source_word: אַשְׂרִיאֵל
  choice: Asriel
  rationale: Emprega a forma tradicional e reconhecível do nome próprio em português.
- source_word: אֲשֶׁר יָלָדָה
  choice: a quem ... deu à luz
  rationale: Reproduz a oração relativa e o verbo feminino do hebraico, antecipando como sujeito a concubina mencionada em seguida.
- source_word: פִּילַגְשׁוֹ
  choice: sua concubina
  rationale: “Concubina” é a correspondência direta e convencional; “esposa secundária” seria mais interpretativo.
- source_word: הָאֲרַמִּיָּה
  choice: arameia
  rationale: Identifica com precisão histórica a mulher como arameia, evitando o tradicional “síria”, que pode sugerir uma realidade posterior.
- source_word: יָלְדָה אֶת מָכִיר
  choice: ela deu à luz Maquir
  rationale: Conserva a repetição enfática do verbo feminino e o novo aviso de nascimento, sem acrescentar uma conjunção ausente no hebraico.
- source_word: אֲבִי גִלְעָד
  choice: pai de Gileade
  rationale: É a tradução mais direta de אָב; os sentidos genealógicos mais amplos, como “antepassado” ou “fundador”, permanecem em nota.
theological_decisions: []
