  yaml_path: translation/ot/1_chronicles/007/006.yaml
  text: 'The sons of Benjamin: Bela[a], Beker, and Jediael—three.'
translation:
  language: pt
  text: 'Os filhos de Benjamim: Belá, Bequer e Jediael — três.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּנְיָמִן
  choice: Benjamim
  rationale: Nome pessoal e tribal na forma tradicional e amplamente reconhecida em português; o contexto genealógico permite explicitar a relação com a expressão “Os filhos de”.
- source_word: בֶּלַע
  choice: Bela
  rationale: Transliteração natural do nome hebraico em português.
- source_word: בֶּכֶר
  choice: Bequer
  rationale: Representa em ortografia portuguesa o som consonantal de כּ/כ neste nome e evita que “Beker” seja lido com pronúncia inadequada por leitores lusófonos.
- source_word: יְדִיעֲאֵל
  choice: Jediael
  rationale: Forma transliterada clara e já reconhecível em português, sem tentar reproduzir de modo artificial cada detalhe fonético hebraico.
- source_word: שְׁלֹשָׁה
  choice: três
  rationale: Número cardinal que resume os três nomes enumerados.
- source_word: '[cabeçalho genealógico implícito]'
  choice: 'Os filhos de Benjamim:'
  rationale: O hebraico é elíptico e não traz verbo nem termo explícito para “filhos”; a relação é suprida pelo contexto genealógico e expressa naturalmente em português.
