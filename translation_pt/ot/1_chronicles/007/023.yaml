base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/023.yaml
  text: Then he went in to his wife[a], and she conceived and bore a son, and he called his name Beriah[c][b], because disaster had been in his house.
translation:
  language: pt
  text: Depois, ele se uniu à sua mulher, e ela ficou grávida e deu à luz um filho. Ele lhe deu o nome de Berias[a], porque havia desgraça em sua casa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, o nome Berias participa de um jogo de palavras com a palavra traduzida por “desgraça”.
    reason: wordplay
  - marker: b
    text: “Desgraça” significa aqui calamidade ou infortúnio, não maldade moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֶל אִשְׁתּוֹ
  choice: ele se uniu à sua mulher
  rationale: A expressão hebraica é um eufemismo convencional para relações sexuais. “Se uniu à sua mulher” comunica o sentido com dignidade e naturalidade em português moderno.
- source_word: וַתַּהַר
  choice: ela ficou grávida
  rationale: Forma corrente e imediatamente compreensível em português para indicar a concepção nesse contexto narrativo.
- source_word: וַתֵּלֶד בֵּן
  choice: deu à luz um filho
  rationale: Expressão natural em português que reproduz com clareza a fórmula hebraica de nascimento.
- source_word: וַיִּקְרָא אֶת שְׁמוֹ בְּרִיעָה
  choice: ele lhe deu o nome de Berias
  rationale: Equivalente idiomático da fórmula hebraica “chamou o nome dele”, evitando uma construção artificial em português.
- source_word: בְּרִיעָה
  choice: Berias
  rationale: Adota a forma portuguesa tradicional e reconhecível do nome hebraico, cujo som se relaciona no contexto com רָעָה, “desgraça”.
- source_word: כִּי
  choice: porque
  rationale: Introduz de modo claro a razão dada para a escolha do nome.
- source_word: בְרָעָה
  choice: a desgraça
  rationale: Neste contexto, רָעָה designa calamidade ou infortúnio, e não maldade moral. “Desgraça” também preserva parcialmente o jogo sonoro com Berias.
- source_word: הָיְתָה בְּבֵיתוֹ
  choice: havia atingido sua casa
  rationale: Embora o hebraico diga literalmente “estava/havia em sua casa”, a formulação eventiva comunica naturalmente que a calamidade sobreviera à família, sem sugerir localização física.
- source_word: בְּבֵיתוֹ
  choice: sua casa
  rationale: Preserva a imagem do hebraico בַּיִת, que aqui pode abranger a casa, a família ou o lar.
theological_decisions:
- issue: Sentido de רָעָה
  choice: desgraça, no sentido de calamidade familiar
  alternative: mal ou maldade moral
  rationale: O contexto anterior relata a morte dos filhos de Efraim; portanto, a palavra descreve infortúnio ou calamidade, não culpa moral.
- issue: Alcance de בֵּיתוֹ
  choice: casa, com sentido inclusivo de família ou lar
  alternative: edifício residencial apenas
  rationale: No uso hebraico, “casa” frequentemente designa o grupo familiar; manter “casa” preserva a metáfora sem restringi-la ao edifício.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tradução usa equivalência ótima: verte naturalmente o eufemismo sexual e a fórmula de nomeação, preserva “casa” e explicita em nota o jogo de palavras e a alternativa mais literal da cláusula final.'
