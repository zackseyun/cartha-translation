  text: 'E os filhos de Ula: Ara, Haniel e Rizia.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ula também pode ser transliterado como «Ulla»; Haniel, como «Hanniel»; e Rizia, como «Riziah».
