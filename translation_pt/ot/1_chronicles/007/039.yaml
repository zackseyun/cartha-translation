lexical_decisions:
- source_word: וּבְנֵי
  choice: E os filhos de
  rationale: Traduz o substantivo construto בְנֵי por sua correspondência genealógica direta, «os filhos de», e preserva a conjunção hebraica וּ, que liga o versículo à lista anterior.
- source_word: עֻלָּא
  choice: Ula
  rationale: Transliteração do nome próprio hebraico em forma natural em português; a duplicação gráfica de l não é necessária para representar o nome.
- source_word: אָרַח
  choice: Ará
  rationale: Transliteração portuguesa do nome próprio, com acento para indicar a tonicidade final e h final não pronunciado omitido.
- source_word: חַנִּיאֵל
  choice: Haniel
  rationale: Transliteração corrente e legível em português; o elemento final אֵל é representado por «el».
- source_word: רִצְיָא
  choice: Rizia
  rationale: Transliteração próxima da vocalização massorética e adequada à ortografia portuguesa.
