base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/032.yaml
  text: Heber fathered Japhlet[a], Shomer, Hotham[b], and Shua their sister.
translation:
  language: pt
  text: Héber gerou Jaflete, Somer, Hotã e a irmã deles, Sua.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶבֶר
  choice: Héber
  rationale: Nome próprio transliterado segundo a forma tradicional e reconhecível em português.
- source_word: הוֹלִיד
  choice: gerou
  rationale: No contexto genealógico, o hifil de ילד indica gerar descendentes; “gerou” é conciso, natural no registro bíblico português e preserva a força genealógica.
- source_word: אֶת
  choice: '[não traduzido]'
  rationale: Marcador hebraico de objeto direto, sem equivalente lexical necessário em português.
- source_word: יַפְלֵט
  choice: Jaflete
  rationale: Nome próprio transliterado em forma adaptada à ortografia e à pronúncia portuguesas.
- source_word: שׁוֹמֵר
  choice: Somer
  rationale: Transliteração do nome conforme a vocalização massorética; em português, “Somer” representa a consoante inicial hebraica sem recorrer ao dígrafo inglês “sh”.
- source_word: חוֹתָם
  choice: Hotã
  rationale: Transliteração adaptada ao português; o h inicial representa a consoante hebraica e o final nasalizado segue convenção corrente para nomes bíblicos.
- source_word: שׁוּעָא
  choice: Sua
  rationale: Transliteração portuguesa simples do nome hebraico, sem o dígrafo inglês “sh”.
- source_word: אֲחוֹתָם
  choice: a irmã deles
  rationale: O substantivo traz sufixo masculino plural, literalmente “irmã deles”, referindo-se naturalmente aos homens antes enumerados; a ordem portuguesa explicita a aposição sem alterar a relação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com concisão própria de uma genealogia. Os nomes foram adaptados às convenções portuguesas, evitando variantes meramente ortográficas do inglês, que não exigem notas. A expressão “a irmã deles” preserva o plural explícito do hebraico.
