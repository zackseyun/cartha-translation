base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/019.yaml
  text: The sons of Shemida were Ahian[a], Shechem, Likhi, and Aniam.
translation:
  language: pt
  text: Os filhos[a] de Semida foram Aiã, Siquém, Liqui e Anião.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “descendentes de Semida”. Nas genealogias, “filhos” às vezes pode designar descendentes masculinos de modo mais amplo, embora o contexto imediato aqui favoreça “filhos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: foram
  rationale: Na fórmula genealógica, o verbo היה introduz os nomes que compõem a descendência mencionada; “foram” reproduz essa estrutura de modo natural e sem acrescentar uma ideia de mudança.
- source_word: בְּנֵי
  choice: filhos de
  rationale: Embora בְּנֵי possa designar descendentes em sentido mais amplo em genealogias, a enumeração imediata de nomes masculinos favorece aqui a tradução formal “filhos de”; a possível extensão semântica é preservada em nota.
- source_word: שְׁמִידָע
  choice: Semida
  rationale: Forma portuguesa legível que translitera o nome hebraico sem tentar traduzi-lo.
- source_word: אַחְיָן
  choice: Aiã
  rationale: Transliteração adaptada à ortografia e à pronúncia correntes em português.
- source_word: שֶׁכֶם
  choice: Siquém
  rationale: Emprega-se a forma portuguesa tradicional do nome hebraico; a sintaxe do versículo mostra que aqui se trata de uma pessoa.
- source_word: לִקְחִי
  choice: Liqui
  rationale: Transliteração legível em português, usando “qu” para representar adequadamente o som consonantal antes de “i”.
- source_word: אֲנִיעָם
  choice: Anião
  rationale: Forma portuguesa tradicional e legível do nome próprio hebraico.
theological_decisions: []
