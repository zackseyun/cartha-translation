base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/008.yaml
  text: 'And the sons of Becher: Zemirah[a], Joash, Eliezer, Elioenai, Omri, Jeremoth, Abijah, Anathoth, and Alemeth. All these were the sons of Becher.'
translation:
  language: pt
  text: E os filhos de Bequer foram Zemira, Joás, Eliézer, Elioenai, Onri, Jeremote[a], Abias, Anatote e Alemete. Todos esses foram filhos de Bequer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome Jeremote também pode ser grafado «Jerimote».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: E os filhos de
  rationale: Mantém a conjunção que dá continuidade à genealogia e traduz o plural construto בְּנֵי pela fórmula genealógica natural e precisa «os filhos de».
- source_word: בֶכֶר
  choice: Bequer
  rationale: Forma tradicional e legível em português para o nome hebraico.
- source_word: זְמִירָה
  choice: Zemira
  rationale: Transliteração portuguesa clara do nome próprio, sem acrescentar um h final sem valor fonético em português.
- source_word: יוֹעָשׁ
  choice: Joás
  rationale: Forma bíblica consagrada em português, com acento para indicar a pronúncia.
- source_word: אֱלִיעֶזֶר
  choice: Eliézer
  rationale: Forma corrente em português, com acentuação adequada à pronúncia.
- source_word: אֶלְיוֹעֵינַי
  choice: Elioenai
  rationale: Transliteração próxima do hebraico e reconhecível na tradição bíblica portuguesa.
- source_word: עָמְרִי
  choice: Onri
  rationale: Forma tradicional portuguesa do nome, adaptando a sequência consonantal à pronúncia usual.
- source_word: יְרֵמוֹת
  choice: Jeremote
  rationale: Forma portuguesa convencional; a variante «Jerimote» é registrada em nota por refletir outra representação tradicional do mesmo nome.
- source_word: אֲבִיָּה
  choice: Abias
  rationale: Forma tradicional portuguesa para o nome hebraico, natural ao leitor contemporâneo.
- source_word: עֲנָתוֹת
  choice: Anatote
  rationale: Transliteração portuguesa convencional; neste contexto genealógico, o termo designa uma pessoa.
- source_word: עָלָמֶת
  choice: Alemete
  rationale: Forma portuguesa convencional e próxima da vocalização massorética.
- source_word: כָּל אֵלֶּה
  choice: Todos esses
  rationale: Reprodução natural em português da expressão hebraica de recapitulação.
