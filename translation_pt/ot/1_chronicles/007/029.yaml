  text: וְ/עַל יְדֵ֣י בְנֵי מְנַשֶּׁ֗ה בֵּית שְׁאָ֤ן וּ/בְנֹתֶ֨י/הָ֙ תַּעְנַ֣ךְ וּ/בְנֹתֶ֔י/הָ מְגִדּ֥וֹ וּ/בְנוֹתֶ֖י/הָ דּ֣וֹר וּ/בְנוֹתֶ֑י/הָ בְּ/אֵ֨לֶּה֙ יָשְׁב֔וּ בְּנֵ֥י יוֹסֵ֖ף בֶּן יִשְׂרָאֵֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/029.yaml
  text: And along the borders of the sons of Manasseh were Beth-shean and its daughter towns[a], Taanach and its daughter towns, Megiddo and its daughter towns, Dor and its daughter towns[b]. In these lived the sons of Joseph son of Israel.
translation:
  language: pt
  text: Junto às fronteiras dos filhos de Manassés[b] ficavam Bete-Seã e suas cidades dependentes[a], Taanaque e suas cidades dependentes, Megido e suas cidades dependentes, e Dor e suas cidades dependentes. Nessas localidades habitavam os filhos de José, filho de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “suas filhas”; expressão hebraica para os povoados ou assentamentos dependentes de uma cidade principal.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ao lado dos filhos de Manassés”. O idioma hebraico indica aqui proximidade ou contiguidade territorial.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יְדֵי
  choice: Junto às fronteiras de
  rationale: O idioma, numa lista territorial, indica proximidade ou contiguidade geográfica, e não a ideia literal de “mãos”. A tradução comunica naturalmente essa relação sem eliminar a alternativa mais literal, registrada em nota.
- source_word: בְנֵי מְנַשֶּׁה
  choice: os filhos de Manassés
  rationale: Mantém a linguagem genealógica característica do contexto, na qual “filhos” também designa os descendentes tribais.
- source_word: בֵּית שְׁאָן
  choice: Bete-Seã
  rationale: Forma portuguesa reconhecível do topônimo conforme a vocalização massorética.
- source_word: וּבְנֹתֶיהָ / וּבְנוֹתֶיהָ
  choice: e suas cidades dependentes
  rationale: No vocabulário territorial, as “filhas” de uma cidade são os núcleos menores subordinados a ela. A expressão escolhida explicita o sentido, enquanto a metáfora hebraica é preservada em nota.
- source_word: תַּעְנַךְ
  choice: Taanaque
  rationale: Forma portuguesa tradicional e legível do topônimo.
- source_word: מְגִדּוֹ
  choice: Megido
  rationale: Forma portuguesa corrente do topônimo.
- source_word: דּוֹר
  choice: Dor
  rationale: Transliteração direta e corrente do topônimo.
- source_word: בְאֵלֶּה
  choice: Nessas localidades
  rationale: O demonstrativo retoma as cidades e seus assentamentos recém-enumerados; “localidades” torna explícito o referente sem acrescentar interpretação substantiva.
- source_word: יָשְׁבוּ
  choice: habitavam
  rationale: Expressa residência continuada em registro atual e digno, sem sugerir necessariamente o ato inicial de colonização.
- source_word: בְנֵי יוֹסֵף
  choice: os filhos de José
  rationale: Conserva o idioma genealógico e a ligação com as tribos oriundas de José.
- source_word: בֶּן יִשְׂרָאֵל
  choice: filho de Israel
  rationale: Preserva de modo direto a identificação genealógica de José.
