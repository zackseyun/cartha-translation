base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/005.yaml
  text: And their brothers[a], throughout all the families of Issachar, were mighty men of valor, eighty-seven thousand in all[b], enrolled by genealogy.
translation:
  language: pt
  text: Seus irmãos[a], em todas as famílias de Issacar, eram guerreiros valentes; ao todo, eram oitenta e sete mil, conforme os registros genealógicos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “parentes” ou “membros do mesmo clã”; em contextos de clã e genealogia, o hebraico “irmãos” pode designar mais do que irmãos imediatos.
    reason: lexical_alternative
  - marker: b
    text: Ou “registrados por genealogia”. O verbo hebraico se refere ao registro ou cômputo de pessoas segundo sua genealogia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: Seus irmãos
  rationale: Preserva o sentido básico de אָח e o idioma hebraico, embora, neste contexto genealógico, o termo possa abranger parentes do mesmo clã.
- source_word: לְכֹל מִשְׁפְּחוֹת יִשָׂשכָר
  choice: de todas as famílias de Issacar
  rationale: 'Expressa de modo natural o âmbito indicado por לְכֹל: os diversos grupos familiares da tribo de Issacar.'
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: guerreiros valentes
  rationale: A expressão designa homens de reconhecida força e capacidade militar; esta formulação é clara, digna e idiomática em português atual.
- source_word: שְׁמוֹנִים וְשִׁבְעָה אֶלֶף
  choice: oitenta e sete mil
  rationale: Reprodução direta do número cardinal em prosa corrente.
- source_word: הִתְיַחְשָׂם
  choice: registrados por genealogia
  rationale: O hitpael de יחשׂ se refere à inclusão ou ao cômputo de pessoas mediante registros genealógicos.
- source_word: לַכֹּל
  choice: ao todo
  rationale: Comunica com naturalidade que o número apresentado é o total geral.
