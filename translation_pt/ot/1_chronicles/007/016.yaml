  text: וַ/תֵּ֨לֶד מַעֲכָ֤ה אֵֽשֶׁת מָכִיר֙ בֵּ֔ן וַ/תִּקְרָ֤א שְׁמ/וֹ֙ פֶּ֔רֶשׁ וְ/שֵׁ֥ם אָחִ֖י/ו שָׁ֑רֶשׁ וּ/בָנָ֖י/ו אוּלָ֥ם וָ/רָֽקֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/016.yaml
  text: Maacah the wife of Machir bore a son[a], and she called his name Peresh; and the name of his brother was Sheresh[b], and his sons were Ulam and Rakem.
translation:
  language: pt
  text: Maaca, esposa de Maquir, deu à luz um filho e lhe deu o nome de Peres. O irmão dele se chamava Seres, e os filhos de Seres eram Ulão e Requém.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: deu à luz
  rationale: Expressão natural e digna em português para ילד no contexto genealógico.
- source_word: אֵשֶׁת מָכִיר
  choice: mulher de Maquir
  rationale: Reproduz diretamente a relação expressa pelo construto hebraico; no contexto, 'mulher' significa esposa.
- source_word: בֵּן
  choice: um filho
  rationale: Mantém o substantivo masculino singular que introduz a criança antes do nome.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: lhe deu o nome de
  rationale: Equivalente idiomático moderno da expressão hebraica literalmente 'chamou o nome dele', sem alterar seu sentido.
- source_word: פֶּרֶשׁ
  choice: Peres
  rationale: Transliteração portuguesa do nome próprio hebraico, distinguindo-o do nome hebraico פֶּרֶץ, geralmente vertido Perez.
- source_word: וְשֵׁם אָחִיו שָׁרֶשׁ
  choice: O irmão dele se chamava Seres
  rationale: Forma portuguesa natural que preserva a identificação do irmão de Peres.
- source_word: וּבָנָיו
  choice: e os filhos de Seres eram
  rationale: Mantém o sentido masculino de בנים na genealogia e explicita o antecedente provável do sufixo, Seres, para evitar ambiguidade artificial em português.
- source_word: אוּלָם וָרָקֶם
  choice: Ulão e Requém
  rationale: Transliteração dos nomes próprios segundo convenções fonéticas e ortográficas portuguesas.
theological_decisions:
- issue: Antecedente do sufixo em וּבָנָיו ('seus filhos')
  choice: Seres
  alternative: Peres
  rationale: O antecedente masculino singular mais próximo é Seres. A tradução explicita essa referência para clareza, embora o hebraico use apenas o pronome possessivo.
translation_notes:
  register: Português moderno, claro e digno, com concisão adequada a uma lista genealógica. A construção idiomática 'lhe deu o nome de' evita o decalque pouco natural 'chamou o nome dele'. Não foram necessárias notas de rodapé.
