  text: 'And the sons of Jether: Jephunneh[a], Pispa, and Ara.'
translation:
  language: pt
  text: 'E os filhos de Jéter: Jefuné, Pispa e Ara.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: E os filhos de
  rationale: בְּנֵי é o plural construto de “filhos” e integra uma fórmula genealógica; “filhos de” preserva com naturalidade essa expressão. O וּ inicial é traduzido por “E”, acompanhando a continuidade da lista.
- source_word: יֶתֶר
  choice: Jéter
  rationale: Nome próprio transliterado segundo a forma tradicional e corrente em português bíblico, com acento para indicar a pronúncia.
- source_word: יְפֻנֶּה
  choice: Jefuné
  rationale: Nome próprio transliterado em forma portuguesa reconhecível e compatível com a pronúncia hebraica.
- source_word: וּפִסְפָּה
  choice: Pispa
  rationale: O nome próprio é transliterado sem representar o ה final, que aqui não exige um som consonantal distinto; o וּ prefixado é expresso pela coordenação da lista em português.
- source_word: וַאְרָא
  choice: e Ara
  rationale: O termo é entendido como nome próprio no contexto genealógico. A conjunção prefixada é traduzida por “e” antes do último elemento da enumeração.
