  text: 'The son of Helem his brother: Zophah[a], Imna, Shelesh, and Amal.'
translation:
  language: pt
  text: 'E o filho de Hélem, seu irmão: Zofá[a], Imna, Seles e Amal.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, conforme outra convenção de transliteração da letra hebraica final ח, “Zofaque”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן
  choice: E o filho de
  rationale: Mantém o singular da forma construta בֶן e também a conjunção וּ, natural na continuidade da genealogia.
- source_word: הֵלֶם
  choice: Helém
  rationale: Nome próprio transliterado segundo convenções naturais em português, com acento para indicar a tonicidade.
- source_word: אָחִיו
  choice: seu irmão
  rationale: Preserva literalmente o termo de parentesco e o sufixo masculino singular, sem explicitar o antecedente, que permanece dependente do contexto.
- source_word: צוֹפַח
  choice: Zofá
  rationale: Transliteração portuguesa legível do nome próprio; a consoante final ח admite outras convenções de transliteração, registradas em nota.
- source_word: וְיִמְנָע
  choice: Imna
  rationale: Nome próprio transliterado; a coordenação hebraica é representada pela pontuação da enumeração em português.
- source_word: וְשֵׁלֶשׁ
  choice: Seles
  rationale: Transliteração adaptada à leitura portuguesa, em que 'sh' não é necessário para representar o som hebraico שׁ.
- source_word: וְעָמָל
  choice: e Amal
  rationale: A conjunção hebraica é expressa pela conjunção portuguesa antes do último nome da lista.
