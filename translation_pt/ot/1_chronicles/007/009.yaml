  text: וְ/הִתְיַחְשָׂ֣/ם לְ/תֹלְדוֹתָ֗/ם רָאשֵׁי֙ בֵּ֣ית אֲבוֹתָ֔/ם גִּבּוֹרֵ֖י חָ֑יִל עֶשְׂרִ֥ים אֶ֖לֶף וּ/מָאתָֽיִם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/009.yaml
  text: 'They were enrolled by genealogy[a], according to their generations, as heads of their fathers’ houses[b], mighty men of valor: twenty thousand two hundred.'
translation:
  language: pt
  text: 'Foram registrados genealogicamente[a], segundo as suas gerações, como chefes das suas casas paternas[b], homens valentes e poderosos: vinte mil e duzentos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Foram inscritos nos registros genealógicos”. O verbo hebraico se refere à inclusão em um registro genealógico.'
    reason: lexical_alternative
  - marker: b
    text: “Casas paternas” eram unidades familiares baseadas na descendência de um ancestral, não apenas famílias nucleares.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִתְיַחְשָׂם
  choice: Foram registrados genealogicamente
  rationale: O hitpael de יחשׂ em Crônicas indica a inclusão ou o reconhecimento de pessoas em registros genealógicos; esta formulação preserva tanto o sentido administrativo quanto o genealógico.
- source_word: לְתֹלְדוֹתָם
  choice: segundo as suas gerações
  rationale: Mantém o sentido de gerações ou linhas de descendência sem explicitar além do hebraico.
- source_word: רָאשֵׁי בֵּית אֲבוֹתָם
  choice: como chefes das suas casas paternas
  rationale: Preserva a expressão social e clânica típica de Crônicas, distinguindo essas unidades ancestrais da mera família nuclear.
- source_word: גִּבּוֹרֵי חָיִל
  choice: homens valentes e poderosos
  rationale: Expressa força, capacidade e valor sem restringir necessariamente a frase ao combate, embora a aptidão militar esteja incluída no contexto.
- source_word: עֶשְׂרִים אֶלֶף וּמָאתָיִם
  choice: vinte mil e duzentos
  rationale: Reprodução direta do numeral hebraico, por extenso para adequação ao estilo literário.
