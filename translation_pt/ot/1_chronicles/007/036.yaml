  yaml_path: translation/ot/1_chronicles/007/036.yaml
  text: 'The sons of Zophah: Suah[a], Harnepher, Shual, Beri, and Imrah.'
translation:
  language: pt
  text: 'Os filhos de Zofa: Suá, Harnefer, Sual, Beri e Imrá.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Os descendentes de Zofa”. Em listas genealógicas, o termo hebraico traduzido como “filhos” às vezes pode indicar uma linhagem mais ampla.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Os filhos de
  rationale: É o plural construto de בֵּן, “filho”. Nesta genealogia, “filhos de” é a tradução mais direta, embora o termo possa abranger descendentes em sentido mais amplo.
- source_word: צוֹפָח
  choice: Zofa
  rationale: Nome próprio transliterado segundo convenções naturais do português, preservando a forma consonantal e a vocalização massorética.
- source_word: סוּחַ
  choice: Suá
  rationale: Transliteração portuguesa do nome próprio, com acento para indicar naturalmente a tonicidade final.
- source_word: חַרְנֶפֶר
  choice: Harnefer
  rationale: Transliteração direta e legível do nome próprio hebraico.
- source_word: שׁוּעָל
  choice: Sual
  rationale: O contexto genealógico identifica a forma como nome pessoal; por isso, ela é transliterada, não traduzida como o substantivo comum homógrafo.
- source_word: בֵרִי
  choice: Beri
  rationale: Transliteração do nome conforme a vocalização do Texto Massorético neste versículo.
- source_word: יִמְרָה
  choice: Imrá
  rationale: Transliteração portuguesa do nome, representando o yod inicial vocálico por I e marcando a tonicidade final.
