base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/013.yaml
  text: 'The sons of Naphtali: Jahziel[a], Guni, Jezer, and Shallum—the sons of Bilhah.'
translation:
  language: pt
  text: 'Os filhos de Naftali: Jaziel[a], Guni, Jezer e Salum[b] — os filhos de Bila.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em Gênesis 46:24, este nome aparece como «Jazeel».
    reason: alternative_reading
  - marker: b
    text: Em Gênesis 46:24, este nome aparece como «Silém».
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: filhos de
  rationale: O plural construto de בֵּן significa mais diretamente “filhos de”. Aqui introduz quatro homens nomeados numa genealogia.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Forma portuguesa corrente do nome pessoal e tribal.
- source_word: יַחֲצִיאֵל
  choice: Jazeel
  rationale: Transliteração legível em português, conservando a forma de Crônicas sem identificá-la silenciosamente com a variante de Gênesis 46:24.
- source_word: גוּנִי
  choice: Guni
  rationale: Transliteração direta e corrente do nome próprio.
- source_word: יֵצֶר
  choice: Jezer
  rationale: Transliteração tradicional e inteligível em português.
- source_word: שַׁלּוּם
  choice: Salum
  rationale: Segue a leitura do texto massorético de Crônicas, שַׁלּוּם, enquanto a forma paralela de Gênesis é registrada em nota.
- source_word: בְּנֵי בִלְהָה
  choice: filhos de Bila
  rationale: A expressão final funciona como identificação genealógica em aposição, ligando os quatro nomes à linhagem de Bila.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas de nomes amplamente reconhecíveis. O travessão preserva a aposição genealógica final. A nota evita sugerir uma diferença visível na transliteração portuguesa quando as formas hebraicas diferem apenas na grafia consonantal.
