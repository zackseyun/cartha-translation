base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/004.yaml
  text: And with them, by their generations, according to their fathers' houses, were 36,000 troops for the army of war, for they had many wives and sons.
translation:
  language: pt
  text: Com eles, segundo as suas gerações e por suas casas paternas, as tropas do exército para a guerra[b] somavam 36.000, pois tinham muitas esposas[a] e muitos filhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mulheres”; o termo hebraico pode ter os dois sentidos, mas “esposas” se ajusta melhor ao contexto genealógico e familiar.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica é uma construção militar condensada, que também pode ser traduzida como “divisões militares para a batalha”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲלֵיהֶם
  choice: Com eles
  rationale: Nesse contexto de recenseamento e listagem, a expressão introduz os que estavam associados aos anteriormente mencionados; “com eles” comunica isso naturalmente.
- source_word: לְתֹלְדוֹתָם
  choice: segundo as suas gerações
  rationale: Mantém o sentido genealógico de תּוֹלְדוֹת e sua função de organizar o registro conforme a descendência.
- source_word: לְבֵית אֲבוֹתָם
  choice: por suas casas paternas
  rationale: Reproduz a expressão social e genealógica hebraica referente aos grupos familiares definidos pela linhagem paterna.
- source_word: גְּדוּדֵי צְבָא מִלְחָמָה
  choice: as tropas do exército para a guerra
  rationale: Preserva a formulação militar cumulativa do hebraico, mas com uma sintaxe compreensível em português; a nota registra uma alternativa mais idiomática.
- source_word: שְׁלֹשִׁים וְשִׁשָּׁה אָלֶף
  choice: '36.000'
  rationale: Apresenta com exatidão o numeral hebraico na convenção gráfica usual do português.
- source_word: כִּי
  choice: pois
  rationale: Introduz de modo natural a razão apresentada para o grande contingente.
- source_word: הִרְבּוּ
  choice: tinham muitas
  rationale: O hifil de רבה expressa aumento ou multiplicidade; com esposas e filhos, “tinham muitas” é a forma idiomática em português.
- source_word: נָשִׁים
  choice: esposas
  rationale: Embora o termo também possa significar “mulheres”, o contexto doméstico e genealógico, junto de “filhos”, favorece “esposas”.
- source_word: וּבָנִים
  choice: e filhos
  rationale: Conserva o sentido lexical específico de בָּנִים, sem ampliá-lo para “crianças” ou “descendentes”.
