  text: And Shuppim and Huppim were the sons of Ir[b][a]; Hushim was the son of Aher.
translation:
  language: pt
  text: Supim e Hupim[a] eram filhos de Ir; Husim, filhos de Aher[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em genealogias relacionadas, estes nomes aparecem em formas variantes, como Sefufã e Hufã.
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “filhos de Aher”. A construção é difícil, pois “filhos” está no plural, embora Husim seja um nome singular. Alguns entendem Aher como nome próprio; outros traduzem a palavra como “outro”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שֻׁפִּם
  choice: Supim
  rationale: Nome próprio transliterado segundo formas naturais em português; a conjunção inicial não precisa ser reproduzida isoladamente no começo do versículo.
- source_word: וְ/חֻפִּם
  choice: e Hupim
  rationale: Nome próprio transliterado, preservando também a conjunção hebraica.
- source_word: בְּנֵי
  choice: eram filhos de
  rationale: Em contexto genealógico, o sentido normal é 'filhos de'; o verbo 'eram' explicita naturalmente em português a oração nominal hebraica.
- source_word: עִיר
  choice: Ir
  rationale: Transliteração direta do nome próprio conforme o texto massorético desta passagem.
- source_word: חֻשִׁם
  choice: Husim
  rationale: Transliteração do nome próprio em forma legível para o público lusófono.
- source_word: בְּנֵי אַחֵר
  choice: era filho de Aer
  rationale: A tradução no singular produz uma frase portuguesa inteligível com Husim como sujeito, enquanto a nota preserva a dificuldade do plural hebraico e a possível leitura de אַחֵר como 'outro'.
