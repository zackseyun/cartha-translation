  text: וְ/זָבָ֥ד בְּנ֛/וֹ וְ/שׁוּתֶ֥לַח בְּנ֖/וֹ וְ/עֵ֣זֶר וְ/אֶלְעָ֑ד וַ/הֲרָג֗וּ/ם אַנְשֵׁי גַת֙ הַ/נּוֹלָדִ֣ים בָּ/אָ֔רֶץ כִּ֣י יָרְד֔וּ לָ/קַ֖חַת אֶת מִקְנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/021.yaml
  text: Zabad his son[a], and Shuthelah his son, and Ezer and Elead; the men of Gath who were born in the land killed them[b], because they had gone down to take their livestock.
translation:
  language: pt
  text: Zabade, seu filho, e Sutela, seu filho, e Ézer e Eleade; os homens de Gate que haviam nascido na terra[a] os mataram, porque eles tinham descido para tomar os rebanhos dos homens de Gate.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os homens de Gate, nascidos na terra”. O hebraico diz literalmente “os homens de Gate, os nascidos na terra”.'
    reason: lexical_alternative
  - marker: b
    text: Pelo contexto, “eles” provavelmente se refere a Ézer e Eleade, os nomes plurais mais próximos.
    reason: referent_clarification
lexical_decisions:
- source_word: בְּנוֹ
  choice: seu filho
  rationale: O substantivo em estado construto com sufixo de terceira pessoa masculina singular é vertido pela forma genealógica natural em português. A repetição foi mantida.
- source_word: וְעֵזֶר וְאֶלְעָד
  choice: e Ézer e Eleade
  rationale: Os nomes pessoais seguem formas portuguesas reconhecíveis, e as conjunções preservam a estrutura cumulativa da lista.
- source_word: וַהֲרָגוּם
  choice: os mataram
  rationale: A forma verbal de הרג com sufixo de objeto masculino plural expressa diretamente que eles foram mortos.
- source_word: אַנְשֵׁי גַת
  choice: os homens de Gate
  rationale: Mantém o sentido concreto de אַנְשֵׁי e a designação geográfica tradicional em português.
- source_word: הַנּוֹלָדִים בָּאָרֶץ
  choice: que haviam nascido naquela terra
  rationale: Reproduz de perto o particípio passivo e evita transformar implicitamente a expressão em uma categoria étnica; o mais-que-perfeito situa o nascimento antes do episódio narrado.
- source_word: כִּי
  choice: porque
  rationale: Introduz de modo claro e natural a causa do homicídio.
- source_word: יָרְדוּ
  choice: tinham descido
  rationale: Preserva a imagem espacial de 'descer' e indica uma ação anterior ao homicídio.
- source_word: לָקַחַת
  choice: para tomar
  rationale: Mantém o sentido amplo de לקח sem impor a ideia mais específica de roubar ou saquear.
- source_word: מִקְנֵיהֶם
  choice: os rebanhos dos homens de Gate
  rationale: מִקְנֶה designa animais de criação ou rebanhos. A explicitação do referente do sufixo evita, em português, que 'deles' pareça remeter aos homens mortos; o contexto indica os animais pertencentes aos homens de Gate.
theological_decisions:
- issue: Sujeito de יָרְדוּ ('tinham descido')
  choice: O texto principal conserva o pronome 'eles', e a nota identifica Ézer e Eleade como o referente contextual mais provável.
  alternative: Entender que os homens de Gate haviam descido.
  rationale: A forma verbal isolada admite sujeito masculino plural, mas a lógica do relato e a referência aos rebanhos dos homens de Gate favorecem Ézer e Eleade como aqueles que desceram para tomá-los.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção genealógica repetitiva do hebraico foi preservada; o ponto e vírgula separa a lista da ação narrativa. Os nomes foram apresentados nas formas portuguesas Zabade, Sutela, Ézer, Eleade e Gate.
