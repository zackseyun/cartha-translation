  text: בֶּ֣צֶר וָ/ה֗וֹד וְ/שַׁמָּ֧א וְ/שִׁלְשָׁ֛ה וְ/יִתְרָ֖ן וּ/בְאֵרָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/037.yaml
  text: Bezer[a], Hod, Shamma, Shilshah, Ithran[c][b], and Beera.
translation:
  language: pt
  text: Bezer, Hode, Samá, Silsá, Itrã e Beera.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Be'era”, com indicação explícita do álefe hebraico no meio do nome.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּצֶר
  choice: Bezer
  rationale: Nome próprio em uma genealogia; transliterado de modo próximo ao hebraico e conforme a forma portuguesa já reconhecível.
- source_word: הוֹד
  choice: Hode
  rationale: Embora possa significar “majestade” ou “esplendor” como substantivo comum, o contexto indica um nome pessoal; a vogal final facilita a leitura em português sem afastar-se da forma hebraica.
- source_word: שַׁמָּא
  choice: Sama
  rationale: Transliteração portuguesa direta do nome, sem o dígrafo inglês “sh” nem acréscimo de consoante final ausente nesta grafia hebraica.
- source_word: שִׁלְשָׁה
  choice: Silsa
  rationale: Forma adaptada à ortografia portuguesa, representando os sons do hebraico de maneira legível; não se acrescenta “h” final, que em português não expressaria valor fonético.
- source_word: יִתְרָן
  choice: Itrã
  rationale: 'Transliteração adaptada ao português: o yod inicial é representado por I, e a terminação hebraica -ān por “ã”, oferecendo pronúncia natural e próxima da fonte.'
- source_word: בְאֵרָא
  choice: Beera
  rationale: Forma portuguesa legível que preserva a sequência vocálica do hebraico; o alef medial não é marcado no texto principal.
theological_decisions: []
translation_notes:
  register: Lista genealógica apresentada com concisão. Os nomes foram transliterados diretamente do hebraico e adaptados à ortografia e à pronúncia corrente do português, evitando formas anglicizadas. A conjunção hebraica repetida foi vertida naturalmente por vírgulas e por “e” antes do último nome.
