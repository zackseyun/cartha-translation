base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/028.yaml
  text: Their holdings and settlements were Bethel and its daughter towns[a], and to the east Naaran, and to the west Gezer and its daughter towns, and Shechem and its daughter towns[c][b], as far as Ayyah and its daughter towns.
translation:
  language: pt
  text: Suas propriedades e povoações eram Betel e suas cidades dependentes[a]; a leste, Naarã[b]; a oeste, Gezer e suas cidades dependentes, Siquém e suas cidades dependentes, até Aia[c] e suas cidades dependentes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “suas filhas”, expressão que designa cidades menores ou povoados dependentes de uma cidade principal.
    reason: cultural_note
  - marker: b
    text: Alguns traduzem este nome como “Naará”, com base em uma tradição relacionada do topônimo em outra passagem.
    reason: alternative_reading
  - marker: c
    text: O texto hebraico massorético traz “Aia”; alguns testemunhos antigos e traduções refletem “Gaza”.
    reason: textual_variant
lexical_decisions:
- source_word: אֲחֻזָּתָם
  choice: suas propriedades
  rationale: O termo designa propriedades ou possessões territoriais. “Propriedades” é claro no contexto geográfico e evita introduzir a ideia mais específica de herança.
- source_word: מֹשְׁבוֹתָם
  choice: povoações
  rationale: Neste contexto territorial, refere-se aos lugares habitados do grupo; “povoações” é natural e abrange núcleos de diferentes dimensões.
- source_word: בֵּית אֵל
  choice: Betel
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: בְנֹתֶיהָ
  choice: suas cidades dependentes
  rationale: O hebraico diz literalmente “suas filhas”, expressão para localidades menores subordinadas a uma cidade principal. A tradução comunica o sentido com clareza, e a metáfora original é registrada em nota.
- source_word: לַמִּזְרָח
  choice: a leste
  rationale: Expressa de modo conciso e natural a orientação geográfica indicada pelo hebraico.
- source_word: נַעֲרָן
  choice: Naarã
  rationale: Translitera a forma massorética נַעֲרָן de maneira adequada ao português; a tradição alternativa é preservada em nota.
- source_word: לַמַּעֲרָב
  choice: a oeste
  rationale: É o correspondente natural em português à indicação geográfica do texto.
- source_word: גֶּזֶר
  choice: Gezer
  rationale: Transliteração consagrada e inteligível do topônimo.
- source_word: שְׁכֶם
  choice: Siquém
  rationale: Forma tradicional portuguesa do topônimo bíblico.
- source_word: עַד
  choice: até
  rationale: Marca com naturalidade o limite ou alcance territorial da enumeração.
- source_word: עַיָּה
  choice: Aia
  rationale: Representa em português a leitura do Texto Massorético; a leitura alternativa presente em alguns testemunhos antigos é mantida em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário de alcance internacional. A estrutura enumerativa e as orientações geográficas do hebraico foram preservadas, enquanto o idioma “cidades-filhas” foi expresso no texto como “cidades dependentes” e explicado em nota.
