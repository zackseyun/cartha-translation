  text: וּ/בְנֵ֥י עֻזִּ֖י יִֽזְרַֽחְיָ֑ה וּ/בְנֵ֣י יִֽזְרַֽחְיָ֗ה מִֽיכָאֵ֡ל וְ֠/עֹבַדְיָה וְ/יוֹאֵ֧ל יִשִּׁיָּ֛ה חֲמִשָּׁ֖ה רָאשִׁ֥ים כֻּלָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/003.yaml
  text: 'And the sons of Uzzi: Izrahiah. And the sons of Izrahiah: Michael[a], Obadiah, Joel, and Isshiah—five, all of them heads.'
translation:
  language: pt
  text: 'Os filhos de Uzi: Izraías. Os filhos de Izraías: Micael, Obadias, Joel e Issias — cinco chefes, todos eles.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente: “cinco cabeças, todos eles”. A expressão também pode ser entendida como “cinco homens principais” ou “cinco chefes de família”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Os filhos de
  rationale: בְּנֵי é a forma construta plural de “filhos de”, fórmula genealógica comum. O וּ inicial marca continuidade, mas não precisa ser representado por “e” no início das duas frases em português.
- source_word: עֻזִּי
  choice: Uzi
  rationale: Nome próprio transliterado numa forma clara e corrente em português.
- source_word: יִזְרַחְיָה
  choice: Izraías
  rationale: Forma tradicional e legível em português para o nome hebraico; a mesma grafia é mantida nas duas ocorrências.
- source_word: מִיכָאֵל
  choice: Micael
  rationale: Transliteração portuguesa convencional do nome próprio.
- source_word: וְעֹבַדְיָה
  choice: Obadias
  rationale: Forma tradicional portuguesa do nome próprio; a conjunção é expressa pela pontuação da lista.
- source_word: וְיוֹאֵל
  choice: Joel
  rationale: Forma convencional e amplamente reconhecida em português.
- source_word: יִשִּׁיָּה
  choice: Issias
  rationale: Forma portuguesa legível que representa o nome próprio hebraico e é conhecida na tradição bíblica lusófona.
- source_word: חֲמִשָּׁה
  choice: cinco
  rationale: Tradução direta do numeral cardinal.
- source_word: רָאשִׁים
  choice: chefes
  rationale: Embora o sentido concreto seja “cabeças”, no contexto genealógico o termo designa chefes ou líderes de famílias; “chefes” comunica esse valor naturalmente sem especificar além do hebraico.
- source_word: כֻּלָּם
  choice: todos eles
  rationale: Mantém o resumo enfático do hebraico e sua posição após “cinco chefes”.
theological_decisions:
- issue: A relação entre os quatro filhos nomeados de Izraías e a expressão “cinco chefes”
  choice: Preservar a formulação hebraica sem identificar explicitamente quem é o quinto.
  alternative: Explicitar que Izraías e seus quatro filhos perfazem cinco chefes.
  rationale: O texto hebraico não explica diretamente a contagem. Tornar Izraías o quinto chefe no corpo do texto eliminaria uma ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e acessível, com formas de nomes reconhecíveis ao leitor lusófono. A pontuação segmenta a fórmula genealógica, e a construção final conserva a concisão e a tensão numérica do hebraico.
