  yaml_path: translation/ot/1_chronicles/007/001.yaml
  text: 'The sons of Issachar: Tola[a], Puah, Jashub[b], and Shimron—four.'
translation:
  language: pt
  text: 'Os filhos de Issacar foram: Tolá, Puá[a], Jasube[b] e Sinrom — quatro ao todo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: Puá; algumas tradições usam “Puvá”, com base numa forma paralela presente em outras listas genealógicas.'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: Jasube; em Gênesis 46:13, o nome paralelo aparece na forma “Isvi”.'
    reason: cross_reference
lexical_decisions:
- source_word: וְ/לִ/בְנֵי
  choice: Os filhos de ... foram
  rationale: A expressão introduz a genealogia da tribo. Em português, a formulação com “foram” apresenta a lista com naturalidade; a conjunção e a preposição prefixadas não precisam ser reproduzidas separadamente.
- source_word: יִשָׂשכָר
  choice: Issacar
  rationale: Forma tradicional e amplamente reconhecida em português para o nome próprio.
- source_word: תּוֹלָע
  choice: Tolá
  rationale: Transliteração portuguesa do nome próprio hebraico, com acento para indicar a tonicidade.
- source_word: וּ/פוּאָה
  choice: Puá
  rationale: Segue a vocalização do texto hebraico de Crônicas e adapta o nome à ortografia portuguesa.
- source_word: ישיב
  choice: Jasube
  rationale: Representa a forma consonantal de Crônicas, distinguindo-a da forma paralela Isvi em Gênesis 46:13.
- source_word: וְ/שִׁמְרוֹן
  choice: e Sinrom
  rationale: Transliteração portuguesa natural do nome próprio, com a conjunção que introduz o último item da lista.
- source_word: אַרְבָּעָה
  choice: quatro ao todo
  rationale: Expressa claramente que o numeral resume a quantidade de filhos enumerados.
