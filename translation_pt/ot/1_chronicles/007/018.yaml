base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/018.yaml
  text: His sister Hammoleketh bore Ishhod[a], Abiezer, and Mahlah.
translation:
  language: pt
  text: Sua irmã, Hamolequete[a], deu à luz Isode, Abiezer e Maalá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, Hammoleketh; também pode ser transliterado “Molequete”. O nome tem forma relacionada a uma palavra que significa “rainha” ou “governante”, mas aqui é melhor entendido como nome pessoal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֹתוֹ
  choice: Sua irmã
  rationale: אֲחוֹת com sufixo de terceira pessoa masculina singular significa literalmente “sua irmã”. O waw liga o versículo à genealogia anterior, mas não precisa ser expresso em português para que a frase soe natural.
- source_word: הַמֹּלֶכֶת
  choice: Hamolequete
  rationale: No contexto genealógico, a forma funciona como nome próprio. “Hamolequete” translitera o elemento inicial do hebraico e segue uma forma inteligível na tradição portuguesa, sem traduzir o nome como título.
- source_word: יָלְדָה
  choice: deu à luz
  rationale: A forma verbal feminina de ילד apresenta Hamolequete como mãe. “Deu à luz” explicita naturalmente em português o sentido materno do verbo.
- source_word: אִישְׁהוֹד
  choice: Isode
  rationale: Forma portuguesa tradicional e legível do nome hebraico Ishhod.
- source_word: אֲבִיעֶזֶר
  choice: Abiezer
  rationale: Transliteração já estabelecida e natural em português do nome hebraico.
- source_word: מַחְלָה
  choice: Maalá
  rationale: Forma portuguesa que representa o nome hebraico e assinala a tonicidade final.
