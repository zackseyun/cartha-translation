base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/025.yaml
  text: Rephah his son[a], Resheph, Telah his son, Tahan his son.
translation:
  language: pt
  text: Refa, seu filho,[a] Resefe, Tela, seu filho, e Taã, seu filho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'As genealogias hebraicas muitas vezes omitem um verbo explícito; a sequência apresenta uma lista de descendentes: «Refa, seu filho, Resefe, Tela, seu filho, e Taã, seu filho».'
    reason: cultural_note
lexical_decisions:
- source_word: רֶפַח
  choice: Refá
  rationale: Nome próprio transliterado segundo formas portuguesas legíveis, com «f» para a fricativa hebraica e acento para indicar a tonicidade final.
- source_word: בְּנוֹ
  choice: seu filho
  rationale: O substantivo com sufixo masculino singular significa literalmente «filho dele»; «seu filho» preserva de modo natural a fórmula genealógica repetida.
- source_word: רֶשֶׁף
  choice: Resefe
  rationale: Neste contexto genealógico, a forma é nome próprio, não o substantivo comum que pode significar «chama» ou «praga»; por isso, é transliterada.
- source_word: תֶלַח
  choice: Telá
  rationale: Nome próprio transliterado em forma portuguesa legível; o acento explicita a tonicidade final.
- source_word: תַחַן
  choice: Taã
  rationale: Nome próprio transliterado; «ã» representa de maneira portuguesa e legível a sequência final com consoante gutural.
- source_word: וְ
  choice: pontuação e «e»
  rationale: A conjunção prefixada encadeia os nomes. Vírgulas e um «e» antes do último membro produzem uma lista natural sem apagar sua estrutura.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com nomes próprios adaptados à leitura lusófona. A construção elíptica e repetitiva do hebraico genealógico foi mantida, sem acrescentar relações não explicitadas no versículo.
