base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/017.yaml
  text: 'And the sons of Ulam: Bedan. These were the sons of Gilead son of Machir[a], son of Manasseh.'
translation:
  language: pt
  text: 'E os filhos de Ulão: Bedã. Estes foram os filhos de Gileade, filho de Maquir[a], filho de Manassés.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Estes são/foram os filhos de Gileade...”. A frase pode funcionar como um resumo genealógico que liga a linhagem de Ulão, por meio de Gileade e Maquir, a Manassés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: E os filhos de
  rationale: O וּ liga esta entrada à genealogia anterior, e בְנֵי é a fórmula genealógica no plural construto, preservada de modo transparente.
- source_word: אוּלָם
  choice: Ulão
  rationale: Forma portuguesa tradicional e reconhecível do nome pessoal hebraico.
- source_word: בְּדָן
  choice: Bedã
  rationale: Transliteração portuguesa corrente do nome pessoal.
- source_word: אֵלֶּה
  choice: Estes foram
  rationale: O hebraico traz literalmente apenas o demonstrativo; a cópula é suprida em português, e o passado se ajusta ao relato genealógico retrospectivo sem alterar a referência.
- source_word: בְּנֵי גִלְעָד
  choice: os filhos de Gileade
  rationale: Mantém o idioma genealógico formal 'filhos de', em vez de explicitar 'descendentes', preservando a formulação e sua possível amplitude.
- source_word: בֶּן מָכִיר
  choice: filho de Maquir
  rationale: Preserva a ligação genealógica singular e usa a forma portuguesa corrente do nome.
- source_word: בֶּן מְנַשֶּׁה
  choice: filho de Manassés
  rationale: Preserva a ligação genealógica singular e a forma portuguesa consagrada do nome do ancestral tribal.
