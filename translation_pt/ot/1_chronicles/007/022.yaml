  text: וַ/יִּתְאַבֵּ֛ל אֶפְרַ֥יִם אֲבִי/הֶ֖ם יָמִ֣ים רַבִּ֑ים וַ/יָּבֹ֥אוּ אֶחָ֖י/ו לְ/נַחֲמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/022.yaml
  text: And Ephraim their father mourned for many days[a], and his brothers came to comfort him.
translation:
  language: pt
  text: E Efraim, pai deles, ficou de luto por muitos dias, e seus irmãos vieram consolá-lo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְאַבֵּל
  choice: ficou de luto
  rationale: O hitpael de אבל indica entrar ou permanecer em estado de luto, especialmente após uma morte. “Ficou de luto” expressa isso com naturalidade em português.
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: אֲבִיהֶם
  choice: pai deles
  rationale: O substantivo em estado construto com sufixo masculino plural identifica Efraim como pai dos filhos mencionados no contexto anterior.
- source_word: יָמִים רַבִּים
  choice: por muitos dias
  rationale: O idioma hebraico expressa duração; a preposição “por” torna essa relação temporal natural em português.
- source_word: וַיָּבֹאוּ
  choice: vieram
  rationale: בוא descreve aqui a aproximação dos irmãos de Efraim e é naturalmente traduzido por “vieram”.
- source_word: אֶחָיו
  choice: seus irmãos
  rationale: O sentido direto de אח com sufixo é “seus irmãos”; embora o termo possa às vezes designar parentes, o contexto não exige ampliar o sentido.
- source_word: לְנַחֲמוֹ
  choice: consolá-lo
  rationale: O infinitivo de נחם neste contexto designa consolar alguém enlutado; “consolá-lo” é idiomático e preciso em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa fluente. A aposição “pai deles” preserva a relação explícita no hebraico sem tornar a frase artificial. Não foi incluída nota, pois a alternativa inglesa “to console him” corresponde à própria tradução portuguesa “consolá-lo”, e não a uma variante distinta.
