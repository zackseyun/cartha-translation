  text: וּ/מָכִ֞יר לָקַ֤ח אִשָּׁה֙ לְ/חֻפִּ֣ים וּ/לְ/שֻׁפִּ֔ים וְ/שֵׁ֤ם אֲחֹת/וֹ֙ מַעֲכָ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖י צְלָפְחָ֑ד וַ/תִּהְיֶ֥נָה לִ/צְלָפְחָ֖ד בָּנֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/015.yaml
  text: Machir took a wife for Huppim and for Shuppim. The name of his sister was Maacah[a], and the name of the second was Zelophehad; and Zelophehad had daughters.
translation:
  language: pt
  text: Maquir tomou uma esposa para Hupim e para Supim. O nome da irmã dele era Maaca, e o nome do segundo era Zelofeade[a]; e Zelofeade teve filhas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e o nome do segundo filho era Zelofeade”. O hebraico diz apenas “o segundo”, deixando implícito a quem a expressão se refere.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָקַח אִשָּׁה
  choice: tomou uma esposa
  rationale: A expressão hebraica significa normalmente “tomar uma esposa” ou “casar-se”. Aqui, a construção seguinte indica que Maquir tomou a esposa para Hupim e Supim; por isso, a tradução conserva tanto o sentido idiomático quanto a sintaxe incomum.
- source_word: לְחֻפִּים וּלְשֻׁפִּים
  choice: para Hupim e para Supim
  rationale: A repetição da preposição לְ é reproduzida por “para ... e para ...”, sem resolver a construção incomum nem explicar além do que o hebraico afirma.
- source_word: וְשֵׁם אֲחֹתוֹ מַעֲכָה
  choice: O nome da irmã dele era Maaca
  rationale: Tradução direta da fórmula hebraica de nomeação. “Dele” preserva a referência pronominal do texto, cujo antecedente mais próximo no contexto é Maquir.
- source_word: וְשֵׁם הַשֵּׁנִי צְלָפְחָד
  choice: e o nome do segundo era Zelofeade
  rationale: O hebraico diz literalmente “o segundo” e deixa implícito o referente. A tradução não acrescenta “filho” ao texto principal, preservando sua concisão e ambiguidade.
- source_word: וַתִּהְיֶנָה לִצְלָפְחָד בָּנוֹת
  choice: e Zelofeade teve filhas
  rationale: Forma portuguesa natural de expressar a construção hebraica de existência e posse, mantendo a informação genealógica de que Zelofeade teve filhas.
theological_decisions:
- issue: Ambiguidade genealógica em “o segundo”
  choice: Manter “o segundo” no texto principal sem acrescentar “filho”
  alternative: “o segundo filho” ou “o outro”
  rationale: Embora não seja uma questão doutrinária central, a identificação genealógica é interpretativamente relevante. Como o hebraico não explicita o substantivo, a tradução preserva a formulação elíptica e registra em nota a leitura explicativa comum.
translation_notes:
  register: 'Português moderno, claro e digno, com formas onomásticas tradicionais e amplamente reconhecíveis em português: Maquir, Hupim, Supim, Maaca e Zelofeade. A repetição de “para” e a expressão “o segundo” conservam aspectos deliberadamente incomuns do hebraico.'
