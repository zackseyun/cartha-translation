  text: כָּל אֵ֜לֶּה בְּנֵ֤י יְדִֽיעֲאֵל֙ לְ/רָאשֵׁ֣י הָ/אָב֔וֹת גִּבּוֹרֵ֖י חֲיָלִ֑ים שִׁבְעָֽה עָשָׂ֥ר אֶ֨לֶף֙ וּ/מָאתַ֔יִם יֹצְאֵ֥י צָבָ֖א לַ/מִּלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/011.yaml
  text: All these were sons of Jediael[a], according to the heads of the fathers’ houses, mighty men of valor, seventeen thousand two hundred[d][c][b], able to go out in the army for war.
translation:
  language: pt
  text: Todos esses eram descendentes de Jediael[a]; segundo os chefes das famílias paternas[b], eram guerreiros valentes[c], num total de dezessete mil e duzentos homens aptos para o serviço militar em tempo de guerra[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “filhos de Jediael”. Em listas genealógicas, a expressão hebraica também pode designar descendentes.
    reason: lexical_alternative
  - marker: b
    text: A expressão se refere aos chefes dos grupos familiares ou clãs ancestrais.
    reason: cultural_note
  - marker: c
    text: Ou “homens de valor”.
    reason: lexical_alternative
  - marker: d
    text: Literalmente, “os que saem para o exército, para a guerra”, expressão que indica homens disponíveis ou aptos para o serviço militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: Todos esses
  rationale: Mantém a expressão resumitiva e compacta do hebraico, sem acrescentar um substantivo no início.
- source_word: בְּנֵי יְדִיעֲאֵל
  choice: descendentes de Jediael
  rationale: Embora בְּנֵי signifique literalmente “filhos de”, em listas genealógicas pode abranger descendentes posteriores; o contexto censitário favorece essa acepção ampla em português.
- source_word: לְרָאשֵׁי הָאָבוֹת
  choice: Segundo os chefes das famílias paternas
  rationale: Representa a relação expressa por לְ e comunica de modo inteligível a estrutura ancestral ou clânica indicada por אָבוֹת.
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: guerreiros valentes
  rationale: Expressa naturalmente em português a força, a coragem e a capacidade militar da locução hebraica.
- source_word: שִׁבְעָה עָשָׂר אֶלֶף וּמָאתַיִם
  choice: dezessete mil e duzentos
  rationale: Conserva por extenso o total exato do censo e o registro formal.
- source_word: יֹצְאֵי צָבָא לַמִּלְחָמָה
  choice: homens aptos a sair com o exército para a guerra
  rationale: Traduz a imagem verbal hebraica e, ao mesmo tempo, deixa claro que se trata de homens disponíveis ou qualificados para o serviço militar.
