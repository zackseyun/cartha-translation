  text: וּ/בְנֵ֖י שָׁ֑מֶר אֲחִ֥י ו/רוהגה יחבה וַ/אֲרָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/034.yaml
  text: 'And the sons of Shemer: Ahi[a], Rohgah, Jehubbah[b], and Aram.'
translation:
  language: pt
  text: 'E os filhos[a] de Semer: Aí, Roga, Jeubá[b] e Arã.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nas genealogias hebraicas, “filhos” pode indicar descendentes ou integrantes de um clã, e não apenas filhos imediatos.
    reason: cultural_note
  - marker: b
    text: O nome também pode ser transliterado como “Hubá”; a forma hebraica admite variação na transliteração.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: E os filhos
  rationale: O plural construto de בֵּן, com a conjunção, introduz a lista genealógica. “Filhos” é a formulação portuguesa natural e preserva o sentido amplo que o termo pode ter em genealogias.
- source_word: שָׁמֶר
  choice: Semer
  rationale: Transliteração adaptada à ortografia e à tradição bíblica em português.
- source_word: אֲחִי
  choice: Aí
  rationale: No contexto da lista, a forma funciona como nome próprio. “Aí” é uma transliteração portuguesa reconhecível, em vez de traduzir o possível elemento lexical relacionado a “irmão”.
- source_word: ו/רוהגה
  choice: Roga
  rationale: O nome próprio é transliterado em forma natural para leitores de português; a conjunção prefixada é representada pela coordenação da lista.
- source_word: יחבה
  choice: Jeubá
  rationale: Transliteração portuguesa convencional que representa a forma hebraica como nome próprio, sem lhe atribuir significado não expresso no contexto.
- source_word: וַ/אֲרָם
  choice: e Arã
  rationale: O nome אֲרָם é transliterado como “Arã”, forma corrente em português, e a conjunção prefixada é traduzida por “e”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com a concisão própria de uma lista genealógica. Os nomes seguem formas legíveis e reconhecíveis em português, e a ambiguidade do uso genealógico de “filhos” é preservada em nota.
