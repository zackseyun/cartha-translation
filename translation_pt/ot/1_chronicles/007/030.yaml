base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/030.yaml
  text: 'The sons of Asher: Imnah[a], Ishvah, Ishvi, and Beriah, and Serah their sister.'
translation:
  language: pt
  text: 'Os filhos de Aser: Imna, Isvá, Isvi, Berias e Sera, irmã deles.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'As grafias desses nomes variam entre as traduções: Imna também aparece como Jimna; Isvá, como Isua; e Isvi, como Isuí.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Os filhos de
  rationale: É o plural construto de בֵּן, “filho”. Como introduz uma lista de filhos imediatos, a tradução direta é preferível a “descendentes”.
- source_word: אָשֵׁר
  choice: Aser
  rationale: Forma tradicional e amplamente reconhecida em português para o nome hebraico.
- source_word: יִמְנָה
  choice: Imna
  rationale: Transliteração portuguesa natural da forma massorética, sem o h final próprio de convenções inglesas.
- source_word: יִשְׁוָה
  choice: Isvá
  rationale: Representa em português a vocalização massorética, com acento gráfico para indicar a tonicidade final.
- source_word: יִשְׁוִי
  choice: Isvi
  rationale: Transliteração clara da forma hebraica, preservando a distinção em relação a Isvá.
- source_word: בְרִיעָה
  choice: Berias
  rationale: Forma consagrada nas Bíblias em português e natural para leitores lusófonos.
- source_word: שֶׂרַח
  choice: Será
  rationale: Transliteração que preserva o nome distinto de Sara; o acento indica a tonicidade e evita leitura ambígua em português.
- source_word: אֲחוֹתָם
  choice: a irmã deles
  rationale: O sufixo hebraico é masculino plural e identifica Será como irmã coletiva dos irmãos enumerados.
