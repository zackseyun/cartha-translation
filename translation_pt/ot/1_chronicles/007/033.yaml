base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/033.yaml
  text: 'The sons of Japhlet: Pasach[a], Bimhal, and Ashvath[b]. These were the sons of Japhlet.'
translation:
  language: pt
  text: 'Os filhos de Jaflete: Pasac, Bimal e Asvate. Estes foram[a] os filhos de Jaflete.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Estes são os filhos de Jaflete”. O hebraico não traz verbo nessa fórmula genealógica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי
  choice: filhos de
  rationale: O plural construto de בֵּן, numa lista genealógica imediata, indica naturalmente filhos, sem exigir o sentido mais amplo de descendentes.
- source_word: יַפְלֵט
  choice: Jaflete
  rationale: O nome próprio foi transliterado numa forma natural e reconhecível em português.
- source_word: פָּסַךְ
  choice: Pasá
  rationale: O nome próprio foi transliterado de modo legível em português; a consoante hebraica final admite representação mais explícita, registrada em nota.
- source_word: וּבִמְהָל
  choice: e Bimal
  rationale: A conjunção prefixada foi traduzida separadamente, e o nome foi transliterado segundo a fonética e a ortografia correntes do português.
- source_word: וְעַשְׁוָת
  choice: e Asvate
  rationale: A conjunção foi traduzida, e o nome próprio recebeu uma transliteração portuguesa legível que conserva aproximadamente a sequência consonantal hebraica.
- source_word: אֵלֶּה
  choice: Esses foram
  rationale: A fórmula demonstrativa resume a lista genealógica. O passado soa natural no contexto narrativo português, embora o hebraico não expresse aqui uma cópula temporal.
- source_word: בְּנֵי יַפְלֵט
  choice: os filhos de Jaflete
  rationale: A repetição integral preserva a fórmula de encerramento e a estrutura enfática do hebraico.
