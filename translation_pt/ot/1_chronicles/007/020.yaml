base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/020.yaml
  text: 'The sons of Ephraim: Shuthelah[a], and Bered his son, and Tahath his son, and Eleadah his son, and Tahath his son.'
translation:
  language: pt
  text: 'Os filhos de Efraim: Sutela[a], e Berede, seu filho; Taate, seu filho; Eleada, seu filho; e Taate, seu filho.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nas genealogias, o hebraico “filho” pode às vezes indicar um descendente mais remoto; porém, em cada etapa, o texto diz literalmente “seu filho”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אֶפְרַיִם
  choice: Os filhos de Efraim
  rationale: A construção genealógica funciona como cabeçalho. Em português, a omissão do וּ inicial evita um começo artificial sem perder sua função discursiva.
- source_word: שׁוּתָלַח
  choice: Sutela
  rationale: Forma portuguesa tradicional e legível do nome hebraico, preservando sua identificação bíblica.
- source_word: וּבֶרֶד
  choice: Berede
  rationale: Transliteração adaptada à fonologia e à ortografia portuguesas; a conjunção é representada pela estrutura da enumeração.
- source_word: בְּנוֹ
  choice: seu filho
  rationale: בן com sufixo masculino singular significa naturalmente 'seu filho'. Embora genealogias possam omitir gerações, não se substitui o valor lexical por 'descendente' no texto principal.
- source_word: וְתַחַת
  choice: Taate
  rationale: Neste contexto, תַחַת é nome próprio, não a preposição ou o substantivo comum com o sentido de 'debaixo'.
- source_word: וְאֶלְעָדָה
  choice: Eleada
  rationale: Transliteração portuguesa clara do nome próprio na sequência genealógica.
- source_word: וְתַחַת בְּנוֹ
  choice: e Taate, seu filho
  rationale: Mantém a repetição do nome e da fórmula genealógica do hebraico, com pontuação natural em português.
