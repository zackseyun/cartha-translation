  text: כָּל אֵ֣לֶּה בְנֵי אָ֠שֵׁר רָאשֵׁ֨י בֵית הָ/אָב֤וֹת בְּרוּרִים֙ גִּבּוֹרֵ֣י חֲיָלִ֔ים רָאשֵׁ֖י הַ/נְּשִׂיאִ֑ים וְ/הִתְיַחְשָׂ֤/ם בַּ/צָּבָא֙ בַּ/מִּלְחָמָ֔ה מִסְפָּרָ֣/ם אֲנָשִׁ֔ים עֶשְׂרִ֥ים וְ/שִׁשָּׁ֖ה אָֽלֶף־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/040.yaml
  text: All these were sons of Asher[a], heads of fathers’ houses, select men, mighty warriors, chief leaders; and they were enrolled for service in the army for war. Their number in men was twenty-six thousand.
translation:
  language: pt
  text: Todos esses eram filhos de Aser, chefes de casas paternas, homens escolhidos, guerreiros valentes e chefes entre os líderes. Foram registrados por genealogia[a] para o serviço militar na guerra. O número deles era de vinte e seis mil homens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foram alistados”. O verbo hebraico frequentemente se refere, em Crônicas, ao registro segundo a genealogia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי אָשֵׁר
  choice: filhos de Aser
  rationale: Mantém a expressão genealógica direta do hebraico; no contexto, pode abranger os descendentes de Aser.
- source_word: רָאשֵׁי בֵית הָאָבוֹת
  choice: chefes de casas paternas
  rationale: Preserva a estrutura social e genealógica de Crônicas em português claro, sem reduzir as unidades ancestrais simplesmente a 'famílias'.
- source_word: בְּרוּרִים
  choice: homens escolhidos
  rationale: O particípio passivo indica pessoas selecionadas ou de qualidade reconhecida; 'escolhidos' conserva esse sentido.
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: guerreiros valentes
  rationale: Expressa de modo natural tanto o caráter militar quanto a força e a bravura indicadas pela locução hebraica.
- source_word: רָאשֵׁי הַנְּשִׂיאִים
  choice: chefes entre os líderes
  rationale: A expressão hebraica é compacta e denota posição elevada. Esta formulação evita a conotação monárquica potencialmente enganosa de 'príncipes' e comunica liderança de destaque.
- source_word: וְהִתְיַחְשָׂם
  choice: foram registrados genealogicamente
  rationale: O hitpael de יחס em Crônicas costuma indicar inscrição ou registro segundo a genealogia; a tradução torna explícito esse aspecto administrativo sem separá-lo do contexto militar.
- source_word: בַּצָּבָא בַּמִּלְחָמָה
  choice: para servir no exército em tempo de guerra
  rationale: Traduz idiomaticamente a inscrição para atividade militar vinculada à guerra.
- source_word: מִסְפָּרָם אֲנָשִׁים עֶשְׂרִים וְשִׁשָּׁה אָלֶף
  choice: O número deles era de 26 mil homens
  rationale: Conserva a contagem explícita de homens e apresenta o numeral de forma natural no português moderno.
