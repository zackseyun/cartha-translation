base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/002.yaml
  text: 'The sons of Tola: Uzzi[a], Rephaiah, Jeriel, Jahmai, Ibsam, and Samuel, heads of their fathers’ houses belonging to Tola, mighty men of valor according to their generations[c][b]. Their number in the days of David was twenty-two thousand six hundred.'
translation:
  language: pt
  text: 'Os filhos de Tolá: Uzi, Refaías, Jeriel, Jamai, Ibsã e Samuel, chefes[a] das suas casas paternas na linhagem de Tolá, guerreiros valentes[b], segundo suas genealogias[c]. Nos dias de Davi, o número deles era de 22.600.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “líderes”.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido como “homens poderosos e valentes” ou “homens de valor”.
    reason: lexical_alternative
  - marker: c
    text: Ou “segundo suas gerações” ou “por suas linhagens”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי תוֹלָע
  choice: Os filhos de Tolá
  rationale: Em contexto genealógico, בנים designa naturalmente os filhos, embora possa abranger descendentes. A conjunção inicial não precisa ser representada para que o português seja fluente.
- source_word: עֻזִּי וּרְפָיָה וִירִיאֵל וְיַחְמַי וְיִבְשָׂם וּשְׁמוּאֵל
  choice: Uzi, Refaías, Jeriel, Jamai, Ibsã e Samuel
  rationale: Formas portuguesas claras e usuais dos nomes próprios hebraicos.
- source_word: רָאשִׁים
  choice: chefes
  rationale: No contexto das casas paternas, o substantivo indica os responsáveis ou líderes dos grupos familiares; “chefes” comunica naturalmente essa função.
- source_word: לְבֵית אֲבוֹתָם
  choice: das suas casas paternas
  rationale: Preserva a expressão social e genealógica בית אבות sem reduzi-la simplesmente a “famílias”.
- source_word: לְתוֹלָע
  choice: na linhagem de Tolá
  rationale: Explicita de modo natural em português a afiliação desses chefes ao ramo genealógico de Tolá, sem sugerir que agiam em benefício dele.
- source_word: גִּבּוֹרֵי חַיִל
  choice: guerreiros valentes
  rationale: A expressão fixa denota homens de força, capacidade e valor, com provável nuance militar neste contexto.
- source_word: לְתֹלְדוֹתָם
  choice: segundo suas genealogias
  rationale: Aqui תולדות se refere aos registros ou agrupamentos por descendência; “genealogias” torna essa função clara, enquanto a nota preserva alternativas mais formais.
- source_word: מִסְפָּרָם ... עֶשְׂרִים וּשְׁנַיִם אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: o número deles era de 22.600
  rationale: Reproduz a declaração censitária do hebraico de modo direto e natural.
