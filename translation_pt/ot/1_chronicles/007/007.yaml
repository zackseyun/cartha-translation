  register: Português moderno, claro e digno, com terminologia genealógica compreensível. A pontuação divide a longa sequência hebraica sem alterar suas relações sintáticas; “casas paternas” conserva a estrutura social antiga, enquanto “guerreiros valentes” comunica naturalmente a expressão militar.
