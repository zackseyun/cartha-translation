base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/007.yaml
  text: 'And the sons of Bela: Ezbon[a], Uzzi, Uzziel, Jerimoth, and Iri—five heads of fathers’ houses, mighty men of valor; and their genealogical enrollment was twenty-two thousand and thirty-four.'
translation:
  language: pt
  text: 'E os filhos de Bela: Esbom, Uzi, Uziel, Jerimote e Iri — cinco chefes de casas paternas, guerreiros valentes. O seu registro genealógico era de vinte e dois mil e trinta e quatro.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי בֶלַע
  choice: E os filhos de Bela
  rationale: Mantém o sentido direto de בְּנֵי no contexto de uma lista genealógica, sem excluir que o termo possa ter alcance mais amplo em outros contextos.
- source_word: אֶצְבּוֹן
  choice: Esbom
  rationale: Transliteração adaptada à ortografia e à pronúncia naturais do português.
- source_word: עֻזִּי
  choice: Uzi
  rationale: Transliteração simples e legível do nome hebraico.
- source_word: עֻזִּיאֵל
  choice: Uziel
  rationale: Forma transliterada corrente e transparente em português.
- source_word: יְרִימוֹת
  choice: Jerimote
  rationale: Transliteração aportuguesada, com vogal final para leitura natural.
- source_word: עִירִי
  choice: Iri
  rationale: Transliteração direta do nome próprio.
- source_word: רָאשֵׁי בֵּית אָבוֹת
  choice: chefes de casas paternas
  rationale: 'Preserva a linguagem social e genealógica do hebraico: líderes das unidades familiares ancestrais.'
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: guerreiros valentes
  rationale: Expressa de modo natural a ideia de homens fortes e capazes para a guerra, evitando uma formulação arcaica.
- source_word: וְהִתְיַחְשָׂם
  choice: o número dos registrados em suas genealogias
  rationale: O Hitpael de יחס em Crônicas designa o registro ou alistamento segundo genealogias; a formulação explicita naturalmente a relação entre o registro e o total que segue.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף וּשְׁלֹשִׁים וְאַרְבָּעָה
  choice: vinte e dois mil e trinta e quatro
  rationale: Reproduz exatamente o total hebraico de 22.034 em forma escrita.
