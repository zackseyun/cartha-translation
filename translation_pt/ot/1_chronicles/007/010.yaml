base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/010.yaml
  text: 'And the sons of Jediael: Bilhan. And the sons of Bilhan: Jeush[a], Benjamin, Ehud, Chenaanah, Zethan, Tarshish, and Ahishahar.'
translation:
  language: pt
  text: 'E os filhos de Jediael: Bilã. E os filhos de Bilã: Jeús[a], Benjamim, Eúde, Quenaaná, Zetã, Társis e Aisaar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A forma hebraica do nome do primeiro filho é incomum (יעיש). “Jeús” segue o nome próprio provavelmente pretendido nesta genealogia; outras possibilidades são “Jaaís” ou “Jaís”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: E os filhos de
  rationale: Preserva a fórmula genealógica hebraica; embora בֵּן possa incluir descendentes, a estrutura imediata apresenta uma filiação direta.
- source_word: יְדִיעֲאֵל
  choice: Jediael
  rationale: Transliteração corrente em português do nome próprio hebraico.
- source_word: בִּלְהָן
  choice: Bilã
  rationale: Forma portuguesa tradicional e legível do nome próprio.
- source_word: יעיש
  choice: Jeús
  rationale: Segue a provável identificação com o nome יְעוּשׁ, mantendo em nota a grafia incomum do texto hebraico e alternativas possíveis.
- source_word: וּבִנְיָמִן
  choice: Benjamim
  rationale: Forma consagrada em português.
- source_word: וְאֵהוּד
  choice: Eúde
  rationale: Forma portuguesa tradicional do nome próprio.
- source_word: וּכְנַעֲנָה
  choice: Quenaaná
  rationale: Translitera o nome pessoal e evita confundi-lo com o topônimo ou etnônimo Canaã.
- source_word: וְזֵיתָן
  choice: Zetã
  rationale: Forma portuguesa natural baseada no nome hebraico.
- source_word: וְתַרְשִׁישׁ
  choice: Társis
  rationale: Forma tradicional portuguesa; neste contexto designa uma pessoa, não um lugar.
- source_word: וַאֲחִישָׁחַר
  choice: Aisaar
  rationale: Transliteração portuguesa fluente do nome hebraico, representando seus elementos sonoros sem impor harmonização com outro nome.
