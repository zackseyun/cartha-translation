  text: וּ/בְנֵ֣י בְרִיעָ֔ה חֶ֖בֶר וּ/מַלְכִּיאֵ֑ל ה֖וּא אֲבִ֥י ברזות׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/031.yaml
  text: 'The sons of Beriah: Heber and Malchiel[b][a]; he was the father of Birzaith.'
translation:
  language: pt
  text: E os filhos de Berias foram Héber e Malquiel; este foi o pai[a] de Birzait.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “antepassado de” ou “fundador de”. Em genealogias, “pai” pode indicar o antepassado de um clã ou o fundador de uma povoação, não necessariamente o pai biológico imediato.
    reason: lexical_alternative
  - marker: b
    text: A forma e a vocalização deste nome hebraico são incertas; também pode ser transliterado como “Birzote” ou “Berazote”.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי בְרִיעָה
  choice: E os filhos de Berias
  rationale: A conjunção וּ é preservada por “E”, e o plural construto בְנֵי é traduzido naturalmente por “os filhos de”. O nome בְרִיעָה segue a forma portuguesa tradicional “Berias”.
- source_word: חֶבֶר
  choice: Héber
  rationale: Transliteração portuguesa tradicional do nome próprio, com acento gráfico para indicar a pronúncia.
- source_word: וּמַלְכִּיאֵל
  choice: e Malquiel
  rationale: O וּ conjuntivo é traduzido por “e”; “Malquiel” é uma forma portuguesa clara e tradicional do nome próprio.
- source_word: הוּא
  choice: este
  rationale: O pronome retoma naturalmente Malquiel, o referente masculino singular imediatamente anterior. “Este” preserva essa retomada sem acrescentar interpretação.
- source_word: אֲבִי
  choice: o pai de
  rationale: Mantém a expressão genealógica hebraica, deixando em nota os sentidos mais amplos que “pai” pode ter nesse contexto.
- source_word: ברזות
  choice: Birzait
  rationale: O nome incomum e de identificação incerta é transliterado de modo conservador, sem decidir se designa uma pessoa, um clã ou um lugar.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas onomásticas de boa legibilidade no Brasil. A estrutura genealógica concisa do hebraico foi preservada, inclusive a conjunção inicial e a ambiguidade de “pai”.
