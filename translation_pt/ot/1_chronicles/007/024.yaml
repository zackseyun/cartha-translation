base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/024.yaml
  text: His daughter was Sheerah[a], and she built Lower Beth-horon and Upper Beth-horon[b], and Uzzen-sheerah.
translation:
  language: pt
  text: Sua filha era Seerá[a], que construiu Bete-Horom de Baixo, Bete-Horom de Cima[b] e Uzém-Seerá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “e sua filha, Seerá”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “e [marcador de objeto] a de cima”; “Bete-Horom” está subentendido com base na expressão anterior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִתּוֹ שֶׁאֱרָה
  choice: Sua filha era Seerá
  rationale: A expressão começa literalmente com “e sua filha”, seguida do nome próprio. Em português genealógico, “Sua filha era Seerá” expressa com naturalidade a relação familiar e a identificação, sem tornar o início abrupto.
- source_word: וַתִּבֶן
  choice: que construiu
  rationale: O verbo בנה significa normalmente “construir”. O relativo “que” liga naturalmente a ação à mulher recém-identificada, sem acrescentar a ideia não explícita de fundar ou reconstruir.
- source_word: בֵּית חוֹרוֹן הַתַּחְתּוֹן
  choice: Bete-Horom de Baixo
  rationale: Mantém a forma tradicional e reconhecível do topônimo em português e traduz הַתַּחְתּוֹן como “de Baixo”, distinguindo a cidade correspondente.
- source_word: הָעֶלְיוֹן
  choice: Bete-Horom de Cima
  rationale: O hebraico diz literalmente “e a de cima”, deixando Bete-Horom subentendido. A repetição do topônimo em português torna clara a referência, enquanto a nota registra a elipse do original.
- source_word: אֻזֵּן שֶׁאֱרָה
  choice: Uzém-Seerá
  rationale: O nome de lugar composto é transliterado e unido por hífen para que seja reconhecido como um único topônimo. “Uzém” representa de modo legível em português a forma hebraica.
