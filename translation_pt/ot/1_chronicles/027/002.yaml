base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/002.yaml
  text: Over the first division for the first month was Jashobeam son of Zabdiel[a], and in his division were twenty-four thousand.
translation:
  language: pt
  text: À frente da primeira divisão, para o primeiro mês, estava Jasobeão, filho de Zabdiel; sua divisão contava com vinte e quatro mil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “e sobre a sua divisão, vinte e quatro mil”. O hebraico é elíptico; “contava com” foi acrescentado para expressar que o número indica o efetivo da unidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל הַמַּחֲלֹקֶת
  choice: À frente da ... divisão
  rationale: Neste contexto administrativo e militar, עַל apresenta quem exercia o comando da unidade; “à frente de” comunica essa autoridade com naturalidade em português.
- source_word: הָרִאשׁוֹנָה
  choice: primeira
  rationale: O adjetivo indica a posição inicial na sequência das divisões mensais.
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: correspondente ao primeiro mês
  rationale: A expressão identifica a divisão designada para servir no primeiro mês; esta formulação torna clara a rotação mensal sem ampliar indevidamente o texto.
- source_word: יָשָׁבְעָם
  choice: Jasobeão
  rationale: Transliteração portuguesa corrente do nome hebraico, adequada ao uso bíblico em português.
- source_word: בֶּן זַבְדִּיאֵל
  choice: filho de Zabdiel
  rationale: בֶּן tem aqui seu sentido genealógico normal, “filho de”; Zabdiel preserva de perto a forma hebraica e é reconhecível em português.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: e sua divisão tinha
  rationale: O hebraico é elíptico, literalmente “e sobre a sua divisão”; o verbo “tinha” explicita de modo mínimo que o número seguinte indica o efetivo da unidade.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: vinte e quatro mil homens
  rationale: O número é vertido por extenso. “Homens” explicita o referente humano exigido pelo contexto militar, embora não esteja expresso no hebraico.
