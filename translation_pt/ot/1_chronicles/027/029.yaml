  text: וְ/עַל הַ/בָּקָר֙ הָ/רֹעִ֣ים בַּ/שָּׁר֔וֹן שטרי הַ/שָּׁרוֹנִ֑י וְ/עַל הַ/בָּקָר֙ בָּֽ/עֲמָקִ֔ים שָׁפָ֖ט בֶּן עַדְלָֽי־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/029.yaml
  text: Over the herds grazing in Sharon was Shitrai the Sharonite[b][a], and over the herds in the valleys was Shaphat son of Adlai.
translation:
  language: pt
  text: Sitrai, o saronita[b], era responsável pelo gado[a] que pastava em Sarom; e Safate, filho de Adlai, pelo gado nos vales.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pelos rebanhos bovinos”.
    reason: lexical_alternative
  - marker: b
    text: Sarom era a região da planície costeira de Israel; “saronita” significa um homem de Sarom.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַל
  choice: era responsável por / pelo
  rationale: No contexto desta lista administrativa, a preposição indica supervisão ou responsabilidade. A formulação é natural em português e explicita a função sem acrescentar uma ideia ausente.
- source_word: הַבָּקָר
  choice: o gado
  rationale: בקר designa coletivamente animais bovinos. “Gado” é a equivalência portuguesa mais direta e natural neste contexto.
- source_word: הָרֹעִים
  choice: que pastava
  rationale: O particípio de רעה descreve o gado alimentando-se no pasto. O singular concorda naturalmente com o coletivo “gado” em português.
- source_word: בַּשָּׁרוֹן
  choice: em Sarom
  rationale: Sarom é o nome geográfico da planície costeira; a tradução mantém o topônimo sem expansão no corpo do versículo.
- source_word: שטרי
  choice: Sitrai
  rationale: Transliteração portuguesa do nome pessoal hebraico.
- source_word: הַשָּׁרוֹנִי
  choice: o saronita
  rationale: Preserva o gentílico hebraico que identifica Sitrai como homem de Sarom.
- source_word: בָּעֲמָקִים
  choice: nos vales
  rationale: עמקים é o plural de “vale” ou “região baixa”; “nos vales” conserva de modo direto a imagem geográfica.
- source_word: שָׁפָט
  choice: Safate
  rationale: Forma transliterada tradicional e legível em português para o nome pessoal hebraico.
- source_word: בֶּן עַדְלָי
  choice: filho de Adlai
  rationale: Reproduz de maneira transparente a construção patronímica hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção administrativa foi vertida por “era responsável”, mais idiomático que o decalque “sobre”. Os marcadores seguem imediatamente os termos a que se referem.
