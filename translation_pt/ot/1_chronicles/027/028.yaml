base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/028.yaml
  text: Over the olive trees and the sycamore trees in the Shephelah was Baal-hanan the Gederite[b][a]; and over the stores of oil was Joash.
translation:
  language: pt
  text: Baal-Hanã, o gederita, era responsável pelas oliveiras e pelos sicômoros[a] que estavam na Sefelá[b]; e Joás, pelos depósitos de azeite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “figueiras-sicômoros”.
    reason: lexical_alternative
  - marker: b
    text: Ou “na região baixa”. A Sefelá é a região de colinas baixas de Judá.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַל
  choice: era responsável por / pelos
  rationale: No contexto desta lista administrativa, עַל indica a área confiada à supervisão de cada oficial. A formulação é clara e natural em português moderno.
- source_word: הַזֵּיתִים
  choice: as oliveiras
  rationale: Neste contexto de administração agrícola, o plural designa as árvores, não os frutos.
- source_word: וְהַשִּׁקְמִים
  choice: e os sicômoros
  rationale: שִׁקְמִים designa árvores da espécie também chamada figueira-sicômoro; “sicômoros” é conciso, e a alternativa mais específica consta em nota.
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: que havia na Sefelá
  rationale: שְׁפֵלָה funciona aqui como designação geográfica. A transliteração preserva o nome regional, com explicação em nota.
- source_word: בַּעַל חָנָן
  choice: Baal-Hanã
  rationale: Transliteração adaptada às convenções bíblicas e fonológicas do português.
- source_word: הַגְּדֵרִי
  choice: o gederita
  rationale: O gentílico hebraico é preservado como gentílico em português, sem decidir se aponta especificamente para uma localidade chamada Geder.
- source_word: אֹצְרוֹת הַשֶּׁמֶן
  choice: os depósitos de azeite
  rationale: A expressão pode referir-se a locais ou reservas de armazenamento. “Depósitos de azeite” comunica naturalmente o sentido administrativo e material sem exigir uma arquitetura específica.
- source_word: יוֹעָשׁ
  choice: Joás
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
