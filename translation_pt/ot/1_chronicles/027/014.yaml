base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/014.yaml
  text: For the twelfth month[a], Benaiah the Pirathonite, from the sons of Ephraim; and over his division were twenty-four thousand.
translation:
  language: pt
  text: No décimo primeiro mês, Benaia, o piratonita, dos filhos de Efraim[a], comandava uma divisão de vinte e quatro mil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de Efraim”. Literalmente, “dos filhos de Efraim”; a expressão indica descendência tribal.'
    reason: Preserva a formulação genealógica hebraica e oferece a alternativa mais concisa sem eliminar a nuance tribal.
lexical_decisions:
- source_word: עַשְׁתֵּי עָשָׂר לְעַשְׁתֵּי עָשָׂר הַחֹדֶשׁ
  choice: Para o décimo primeiro mês
  rationale: O hebraico identifica tanto a décima primeira divisão quanto o décimo primeiro mês. A fórmula repetitiva do capítulo permite expressar naturalmente a designação mensal sem perder o sentido. Embora a camada inglesa fornecida diga “twelfth”, o texto hebraico de 1Crônicas 27:14 diz “décimo primeiro”; o décimo segundo aparece no versículo seguinte.
- source_word: בְּנָיָה
  choice: Benaia
  rationale: Forma tradicional e amplamente reconhecida em português para este nome hebraico.
- source_word: הַפִּרְעָתוֹנִי
  choice: o piratonita
  rationale: Preserva o gentílico derivado de Piratom e a identificação geográfica do personagem.
- source_word: מִן בְּנֵי אֶפְרָיִם
  choice: dos filhos de Efraim
  rationale: Mantém a formulação genealógica explícita do hebraico, que neste contexto indica pertencimento tribal, não necessariamente filiação imediata.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: e sua divisão contava com
  rationale: מַחֲלֻקָה designa aqui a divisão militar sob seu comando. A construção portuguesa comunica de modo natural a composição numérica da unidade.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: vinte e quatro mil homens
  rationale: O numeral é direto; “homens” explicita o referente humano já estabelecido pelo contexto militar do capítulo.
