    rationale: O hebraico usa uma fórmula elíptica que depende do padrão do capítulo; em português, explicitar o comando da divisão preserva a função contextual e melhora a legibilidade.
  - severity: low
    issue: “Homens” não está expresso no numeral hebraico.
    rationale: O contexto é militar e permite inferir pessoas, mas “vinte e quatro mil” já preserva o texto sem acrescentar um substantivo.
  - severity: low
    issue: A nota começa com “Isto é”, apresentando a identificação tribal como explicação exclusiva.
    rationale: A nota deve manter a leitura mais literal e indicar a alternativa “de Efraim”, enquanto explica com cautela o provável sentido tribal.
