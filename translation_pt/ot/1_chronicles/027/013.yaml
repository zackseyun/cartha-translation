base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/013.yaml
  text: 'The tenth[a], for the tenth month: Mahrai the Netophathite, of the Zerahites; and over his division were twenty-four thousand.'
translation:
  language: pt
  text: 'O décimo, para o décimo mês: Maarai, o netofatita, dos zeraítas[a]; e sua divisão tinha vinte e quatro mil.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «do clã zeraíta».'
    reason: A forma gentílica singular hebraica pode designar a pertença individual ou a afiliação ao clã zeraíta.
lexical_decisions:
- source_word: הָעֲשִׂירִי
  choice: O décimo
  rationale: O ordinal é usado de modo substantivado nesta lista; o contexto deixa implícito que se trata do décimo responsável ou turno.
- source_word: לַחֹדֶשׁ הָעֲשִׂירִי
  choice: para o décimo mês
  rationale: A preposição לְ indica a designação para o rodízio mensal, expressa de forma concisa e natural.
- source_word: מַהְרַי
  choice: Maarai
  rationale: Transliteração portuguesa que representa a forma hebraica do nome próprio.
- source_word: הַנְּטוֹפָתִי
  choice: o netofatita
  rationale: O gentílico indica procedência ou vínculo com Netofa; a forma tradicional portuguesa é compacta.
- source_word: לַזַּרְחִי
  choice: dos zeraítas
  rationale: O gentílico singular hebraico expressa aqui a vinculação ao clã de Zerá; a formulação plural coletiva é natural em português.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: e sua divisão tinha
  rationale: מַחֲלֻקָה designa a divisão militar de serviço. A formulação comunica naturalmente que o contingente sob sua direção era de 24 mil.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: vinte e quatro mil homens
  rationale: Forma numérica corrente em português; 'homens' explicita o referente humano implícito no contexto militar.
