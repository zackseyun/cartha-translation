  text: וְ/עַל֙ אֹצְר֣וֹת הַ/מֶּ֔לֶךְ עַזְמָ֖וֶת בֶּן עֲדִיאֵ֑ל וְ/עַ֣ל הָֽ/אֹצָר֡וֹת בַּ/שָּׂדֶ֞ה בֶּ/עָרִ֤ים וּ/בַ/כְּפָרִים֙ וּ/בַ/מִּגְדָּל֔וֹת יְהוֹנָתָ֖ן בֶּן עֻזִּיָּֽהוּ־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/025.yaml
  text: Over the king’s treasuries was Azmaveth son of Adiel[a], and over the treasuries in the countryside, in the cities, in the villages, and in the towers[b], was Jehonathan son of Uzziah.
translation:
  language: pt
  text: Azmavete, filho de Adiel, era responsável pelos depósitos do rei; e Jônatas[b], filho de Uzias, pelos depósitos da zona rural[a], das cidades, das aldeias e das torres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “no campo”. O singular hebraico provavelmente tem sentido coletivo aqui e se refere às áreas rurais, em contraste com as cidades, aldeias e torres.
    reason: lexical_alternative
  - marker: b
    text: O hebraico traz aqui a forma longa do nome, Yehonatan; “Jônatas” é a forma portuguesa tradicional.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: era responsável por
  rationale: Neste registro administrativo, עַל indica supervisão ou responsabilidade. A formulação comunica essa função com clareza em português atual.
- source_word: אֹצְרוֹת / הָאֹצָרוֹת
  choice: depósitos / depósitos
  rationale: אֹצָר pode designar tesouro, reserva ou local de armazenamento. “Depósitos” se ajusta tanto às instalações reais quanto às distribuídas por áreas rurais e povoadas, além de preservar a repetição lexical do hebraico.
- source_word: הַמֶּלֶךְ
  choice: do rei
  rationale: Reproduz de modo natural em português a relação expressa pela construção hebraica.
- source_word: עַזְמָוֶת
  choice: Azmavete
  rationale: Forma transliterada legível e corrente em português para o nome hebraico.
- source_word: בֶּן עֲדִיאֵל
  choice: filho de Adiel
  rationale: Tradução direta da identificação patronímica.
- source_word: בַּשָּׂדֶה
  choice: da zona rural
  rationale: Embora o hebraico diga literalmente “no campo”, o singular parece ter sentido coletivo e contrasta com cidades, aldeias e torres.
- source_word: בֶּעָרִים
  choice: das cidades
  rationale: Expressa naturalmente a localização dos depósitos dentro da enumeração geográfica.
- source_word: וּבַכְּפָרִים
  choice: das aldeias
  rationale: כְּפָרִים designa pequenos povoados ou aldeias; “aldeias” é claro e corrente.
- source_word: וּבַמִּגְדָּלוֹת
  choice: das torres
  rationale: Mantém o sentido não especificado de מִגְדָּלוֹת, sem acrescentar que fossem necessariamente torres de vigia ou fortificadas.
- source_word: יְהוֹנָתָן
  choice: Jônatas
  rationale: Emprega a forma portuguesa tradicional e reconhecível; uma nota registra que o hebraico apresenta aqui a forma longa do nome.
- source_word: בֶּן עֻזִּיָּהוּ
  choice: filho de Uzias
  rationale: Tradução direta com a forma portuguesa convencional do nome.
theological_decisions: []
