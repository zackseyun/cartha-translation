  source_fidelity: A identificação de Benaia, os Trinta, a divisão e Amizabade está correta. Contudo, «chefe dos Trinta» explicita como título a relação de autoridade expressa por עַל («sobre»), e «seu filho Amizabade» pode criar momentânea ambiguidade quanto ao antecedente de «seu».
