base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/006.yaml
  text: This was Benaiah[a], a mighty man of the Thirty and over the Thirty; and his division was under Ammizabad his son.
translation:
  language: pt
  text: Este era Benaia, guerreiro valente entre os Trinta e sobre os Trinta; e sua divisão estava sob o comando de Amizabade, seu filho.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוּא בְנָיָהוּ
  choice: Este era Benaia
  rationale: O pronome enfático retoma Benaia, mencionado no versículo anterior; “Este era” explicita naturalmente essa ligação em português.
- source_word: גִּבּוֹר
  choice: guerreiro valente
  rationale: No contexto das listas militares de Crônicas, o termo designa um combatente de reconhecida valentia; esta formulação é clara e preserva o sentido militar.
- source_word: הַשְּׁלֹשִׁים
  choice: os Trinta
  rationale: Designa o conhecido corpo de guerreiros de elite de Davi, e não apenas uma quantidade; a inicial maiúscula sinaliza o nome do grupo.
- source_word: וְעַל הַשְּׁלֹשִׁים
  choice: e chefe dos Trinta
  rationale: A preposição עַל exprime aqui autoridade sobre o grupo. “Chefe” comunica essa relação de modo natural, sem especificar um posto militar não declarado no hebraico.
- source_word: מַחֲלֻקְתּוֹ
  choice: sua divisão
  rationale: No contexto de 1 Crônicas 27, refere-se a uma das divisões militares que serviam em sistema de rodízio.
- source_word: עַמִּיזָבָד בְּנוֹ
  choice: seu filho Amizabade
  rationale: A ordem portuguesa é mais natural que a aposição literal “Amizabade, seu filho” e preserva integralmente a relação familiar.
