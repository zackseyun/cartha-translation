  text: for Levi[a], Hashabiah son of Kemuel; for Aaron, Zadok.
translation:
  language: pt
  text: para Levi, Hasabias, filho de Quemuel; para Arão[a], Zadoque.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, «Arão» provavelmente designa a casa sacerdotal de Arão, isto é, os aaronitas.
    reason: cultural_note
lexical_decisions:
- source_word: לְ/לֵוִי
  choice: para Levi
  rationale: Nesta lista administrativa, a preposição לְ indica o grupo pelo qual o oficial nomeado era responsável. A tradução preserva o nome ancestral no singular, sem explicitar interpretativamente «os levitas».
- source_word: חֲשַׁבְיָה
  choice: Hasabias
  rationale: Forma portuguesa tradicional e reconhecível do nome pessoal hebraico.
- source_word: בֶן
  choice: filho de
  rationale: Equivalente natural da construção genealógica hebraica.
- source_word: קְמוּאֵל
  choice: Quemuel
  rationale: Transliteração portuguesa corrente do nome pessoal hebraico.
- source_word: לְ/אַהֲרֹן
  choice: para Arão
  rationale: Mantém a estrutura paralela a «para Levi» e preserva o nome ancestral usado no hebraico, sem substituir no texto principal pela interpretação «casa de Arão» ou «aaronitas».
- source_word: צָדוֹק
  choice: Zadoque
  rationale: Forma portuguesa tradicional e reconhecível do nome pessoal hebraico.
theological_decisions:
- issue: Se «Arão» deve ser explicitado como referência à casa sacerdotal aarônica
  choice: Manter «para Arão» no texto principal
  alternative: para a casa de Arão; para os aaronitas
  rationale: O hebraico traz apenas o nome ancestral Arão. A formulação literal conserva a metonímia e o paralelismo da lista, enquanto a nota esclarece sua provável referência institucional sem eliminar a ambiguidade do texto.
translation_notes:
  register: Português moderno, claro e digno, com formas onomásticas tradicionais de ampla legibilidade no contexto bíblico. A concisão e o paralelismo da lista hebraica foram preservados.
