base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/015.yaml
  text: The twelfth[a], for the twelfth month, was Heldai the Netophathite, of Othniel[b]; and over his division were twenty-four thousand.
translation:
  language: pt
  text: O décimo segundo, para o décimo segundo mês, era Heldai[a], o netofatita, de Otniel[b]; e sua divisão era de vinte e quatro mil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Algumas tradições paralelas trazem o nome “Helede” em vez de “Heldai”.
    reason: cross_reference
  - marker: b
    text: 'Hebraico: “de Otniel”; a expressão também pode significar “pertencente a Otniel” ou “descendente de Otniel” e provavelmente indica vínculo familiar ou de clã.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁנֵים עָשָׂר
  choice: O décimo segundo
  rationale: O contexto é o de uma sequência numerada de turnos militares; o substantivo subentendido pode permanecer implícito em português.
- source_word: לִשְׁנֵים עָשָׂר הַחֹדֶשׁ
  choice: para o décimo segundo mês
  rationale: A preposição ל indica a designação do turno para esse mês, e a formulação preserva a estrutura administrativa do hebraico.
- source_word: חֶלְדַּי
  choice: Heldai
  rationale: Transliteração da forma do nome presente no texto hebraico deste versículo.
- source_word: הַנְּטוֹפָתִי
  choice: o netofatita
  rationale: Adjetivo gentílico que identifica Heldai como originário de Netofa; a forma tradicional é concisa e inteligível.
- source_word: לְעָתְנִיאֵל
  choice: da família de Otniel
  rationale: Neste contexto, ל provavelmente expressa vínculo familiar ou de clã, não subordinação direta ao antigo juiz Otniel. A expressão portuguesa comunica essa relação sem definir o grau de descendência.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: Em sua divisão havia
  rationale: מַחֲלֻקָה designa aqui uma divisão ou turma militar. A formulação é natural em português e introduz adequadamente o efetivo mencionado a seguir.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: vinte e quatro mil homens
  rationale: Indica o efetivo da divisão; “homens” é explicitado naturalmente a partir do contexto militar.
theological_decisions: []
