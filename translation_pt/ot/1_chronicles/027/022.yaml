  yaml_path: translation/ot/1_chronicles/027/022.yaml
  text: 'For Dan: Azarel son of Jeroham[a]. These were the leaders of the tribes of Israel.'
translation:
  language: pt
  text: 'Para Dã: Azarel, filho de Jeroão. Estes eram os líderes[a] das tribos de Israel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chefes” ou “autoridades”.
