lexical_decisions:
- source_word: לְ/דָן
  choice: Para Dã
  rationale: O לְ introduz o cabeçalho tribal nesta lista administrativa; “Para Dã” expressa naturalmente a associação do líder com a tribo.
- source_word: עֲזַרְאֵל
  choice: Azarel
  rationale: Transliteração clara e corrente do nome hebraico עֲזַרְאֵל.
- source_word: בֶּן
  choice: filho de
  rationale: O construto indica filiação, expressa de modo direto e natural em português.
- source_word: יְרֹחָם
  choice: Jeroão
  rationale: Forma portuguesa bíblica reconhecível para o nome hebraico יְרֹחָם.
- source_word: אֵלֶּה
  choice: Esses eram
  rationale: O pronome demonstrativo introduz a síntese da lista; o verbo de ligação, ausente no hebraico nominal, é suprido naturalmente em português, com valor retrospectivo no contexto narrativo.
- source_word: שָׂרֵי
  choice: líderes
  rationale: No contexto da administração tribal, “líderes” comunica a função de autoridade sem sugerir necessariamente realeza nem uma burocracia moderna.
- source_word: שִׁבְטֵי
  choice: das tribos de
  rationale: Tradução direta do plural construto, formando a relação genitiva com Israel.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Forma convencional em português do nome nacional.
theological_decisions: []
