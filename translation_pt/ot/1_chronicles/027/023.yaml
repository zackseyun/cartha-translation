id: 1CH.27.23
reference: 1 Chronicles 27:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/לֹא נָשָׂ֤א דָוִיד֙ מִסְפָּרָ֔/ם לְ/מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וּ/לְ/מָ֑טָּה כִּ֚י אָמַ֣ר יְהוָ֔ה לְ/הַרְבּ֥וֹת אֶת יִשְׂרָאֵ֖ל כְּ/כוֹכְבֵ֥י הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/023.yaml
  text: But David did not count them from twenty years old and under[b][a], because Yahweh had said he would multiply Israel like the stars of the heavens.
translation:
  language: pt
  text: Mas Davi não contou os que tinham vinte anos ou menos[a], porque Yahweh havia dito que multiplicaria Israel como as estrelas dos céus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não tomou o número deles”. O idioma hebraico diz literalmente “não levantou o número deles”, isto é, não os contou nem os incluiu no recenseamento.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “como as estrelas do céu”. A comparação retoma a promessa de que Israel se tornaria extremamente numeroso.'
    reason: cross_reference
lexical_decisions:
- source_word: וְלֹא
  choice: Mas ... não
  rationale: A conjunção liga o versículo ao contexto anterior com valor contrastivo; “mas” expressa essa relação com naturalidade.
- source_word: נָשָׂא ... מִסְפָּרָם
  choice: não contou
  rationale: A expressão hebraica, literalmente “levantar o número deles”, é um idiomatismo para contar ou realizar um recenseamento.
- source_word: לְמִבֶּן עֶשְׂרִים שָׁנָה וּלְמָטָּה
  choice: os que tinham vinte anos ou menos
  rationale: A formulação comunica com clareza a faixa etária inclusiva, dos vinte anos para baixo, sem reproduzir de modo artificial o hebraico “filho de vinte anos”.
- source_word: כִּי
  choice: porque
  rationale: A partícula introduz a razão pela qual Davi não contou essa faixa etária.
- source_word: אָמַר יְהוָה
  choice: Yahweh havia dito
  rationale: O mais-que-perfeito situa a declaração divina antes da decisão de Davi, e o nome divino é transliterado como “Yahweh”.
- source_word: לְהַרְבּוֹת אֶת יִשְׂרָאֵל
  choice: que multiplicaria Israel
  rationale: O infinitivo expressa o conteúdo da declaração divina; “multiplicaria” preserva a imagem de aumento numérico.
- source_word: כְּכוֹכְבֵי הַשָּׁמָיִם
  choice: como as estrelas dos céus
  rationale: A expressão mantém a comparação e o plural hebraico “céus”, além de conservar a ressonância das promessas patriarcais.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o Tetragrama; “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Relação entre a declaração divina e a decisão de Davi
  choice: porque Yahweh havia dito que multiplicaria Israel
  alternative: pois Yahweh disse que multiplicaria Israel
  rationale: A redação apresenta a palavra anterior de Yahweh como motivo da decisão de Davi, sem acrescentar uma avaliação moral nem resolver além do texto a tensão com o recenseamento.
translation_notes:
  register: Português atual, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada para soar natural em português, mantendo o sentido censitário, a faixa etária inclusiva e a imagem tradicional das estrelas dos céus.
