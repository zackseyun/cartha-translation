  text: הַ/שְּׁמִינִי֙ לַ/חֹ֣דֶשׁ הַ/שְּׁמִינִ֔י סִבְּכַ֥י הַ/חֻשָׁתִ֖י לַ/זַּרְחִ֑י וְ/עַל֙ מַחֲלֻקְתּ֔/וֹ עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/011.yaml
  text: 'The eighth[a], for the eighth month: Sibbecai the Hushathite, of the Zerahites; and over his division were twenty-four thousand.'
translation:
  language: pt
  text: 'O oitavo, para o oitavo mês: Sibecai, o husatita, dos zeraítas[a]. Sua divisão tinha vinte e quatro mil.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do zeraíta”. A expressão hebraica está no singular e, tomada mais literalmente, pode designar “o zeraíta”; no contexto, porém, provavelmente indica a filiação ao clã dos zeraítas.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁמִינִי
  choice: O oitavo
  rationale: O ordinal aparece de forma elíptica numa lista de turnos militares. A formulação concisa preserva essa estrutura sem inserir “comandante” ou “divisão”, termos apenas implícitos no contexto.
- source_word: לַחֹדֶשׁ הַשְּׁמִינִי
  choice: para o oitavo mês
  rationale: A preposição ל indica a designação do turno para esse mês de serviço; a expressão é clara e natural em português.
- source_word: סִבְּכַי
  choice: Sibecai
  rationale: Forma tradicional e reconhecível do nome hebraico em português.
- source_word: הַחֻשָׁתִי
  choice: o husatita
  rationale: O gentílico identifica a associação familiar ou geográfica de Sibecai; “husatita” preserva a forma tradicional em português.
- source_word: לַזַּרְחִי
  choice: dos zeraítas
  rationale: Neste contexto genealógico-militar, o ל provavelmente assinala pertencimento ao clã de Zerá. O plural coletivo comunica essa filiação com naturalidade, sem esconder a possibilidade de leitura mais literal indicada na nota.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: Sua divisão tinha
  rationale: A expressão hebraica introduz o contingente sob a autoridade de Sibecai. A construção portuguesa comunica de modo direto e idiomático a relação entre o chefe e a unidade.
- source_word: מַחֲלֻקְתּוֹ
  choice: divisão
  rationale: No contexto administrativo e militar do capítulo, designa uma unidade organizada de serviço; “divisão” é atual e evita o tom arcaico de “turno” como nome da tropa.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: vinte e quatro mil homens
  rationale: É a expressão numérica direta. “Homens” explicita naturalmente os integrantes da divisão militar, implícitos no contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém-se a concisão formular da lista, enquanto a segunda oração recebe uma sintaxe natural em português. A nota foi colocada junto de “zeraítas”, expressão a que a variante realmente se refere.
