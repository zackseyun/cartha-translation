  text: וְ/אַחֲרֵ֣י אֲחִיתֹ֗פֶל יְהוֹיָדָ֤ע בֶּן בְּנָיָ֨הוּ֙ וְ/אֶבְיָתָ֔ר וְ/שַׂר צָבָ֥א לַ/מֶּ֖לֶךְ יוֹאָֽב־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/034.yaml
  text: After Ahithophel came Jehoiada son of Benaiah and Abiathar[a]; and Joab was commander of the army for the king.
translation:
  language: pt
  text: Depois de Aitofel vieram Joiada, filho de Benaia, e Abiatar[a]; e Joabe era o comandante do exército do rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Depois de Aitofel, Joiada, filho de Benaia, e Abiatar”. No hebraico, o verbo fica implícito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחֲרֵי
  choice: Depois de ... vieram
  rationale: אַחֲרֵי significa “depois de”. Como o hebraico não traz verbo expresso, “vieram” comunica naturalmente a provável ideia de sucessão nesta lista administrativa, sem escondê-la na nota.
- source_word: אֲחִיתֹפֶל
  choice: Aitofel
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio hebraico.
- source_word: יְהוֹיָדָע
  choice: Joiada
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio hebraico.
- source_word: בֶּן בְּנָיָהוּ
  choice: filho de Benaia
  rationale: Tradução direta da construção patronímica hebraica.
- source_word: וְ/אֶבְיָתָר
  choice: e Abiatar
  rationale: A conjunção liga Abiatar a Joiada; ambos são apresentados depois de Aitofel.
- source_word: וְ/שַׂר צָבָא
  choice: e ... era o comandante do exército
  rationale: שַׂר צָבָא designa o chefe militar. O verbo “era” é suprido em português para formar uma oração natural.
- source_word: לַ/מֶּלֶךְ
  choice: do rei
  rationale: Neste contexto, o ל indica a relação de serviço ao rei; em português, “comandante do exército do rei” expressa essa relação com naturalidade.
- source_word: יוֹאָב
  choice: Joabe
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio hebraico.
theological_decisions: []
