  text: וְ/עַל הַ/צֹּ֖אן יָזִ֣יז הַֽ/הַגְרִ֑י כָּל אֵ֨לֶּה֙ שָׂרֵ֣י הָ/רְכ֔וּשׁ אֲשֶׁ֖ר לַ/מֶּ֥לֶךְ דָּוִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/031.yaml
  text: Over the flocks was Jaziz the Hagrite[a]. All these were officers over the property that belonged to King David.
translation:
  language: pt
  text: Sobre os rebanhos estava Jaziz, o hagareno[a]. Todos esses eram os encarregados dos bens que pertenciam ao rei Davi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “hagrita”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Sobre
  rationale: Neste catálogo administrativo, עַל indica responsabilidade ou supervisão. “Sobre” preserva de modo conciso a fórmula da lista e soa natural em português.
- source_word: הַצֹּאן
  choice: os rebanhos
  rationale: צֹאן pode designar ovelhas ou, coletivamente, animais de pequeno porte, sobretudo ovelhas e cabras. “Rebanhos” mantém essa abrangência sem especificar além do hebraico.
- source_word: יָזִיז
  choice: Jaziz
  rationale: Nome próprio transliterado de forma tradicional e inteligível em português.
- source_word: הַהַגְרִי
  choice: o hagareno
  rationale: Gentílico ligado a Hagar; “hagareno” é uma forma portuguesa clara e tradicional, enquanto “hagrita” representa mais diretamente a forma do gentílico hebraico.
- source_word: כָּל אֵלֶּה
  choice: Todos esses
  rationale: Expressão conclusiva que resume os funcionários enumerados no contexto anterior.
- source_word: שָׂרֵי
  choice: os encarregados
  rationale: Aqui שָׂרִים designa responsáveis administrativos pelos recursos reais, não necessariamente príncipes ou comandantes. “Encarregados” comunica claramente a função no contexto.
- source_word: הָרְכוּשׁ
  choice: dos bens
  rationale: רְכוּשׁ denota propriedade, posses ou recursos. “Bens” é natural em português e adequado ao contexto patrimonial.
- source_word: אֲשֶׁר לַמֶּלֶךְ דָּוִיד
  choice: que pertenciam ao rei Davi
  rationale: A oração relativa expressa posse. Esta formulação torna explícita e natural a relação dos bens com o rei sem acrescentar conteúdo.
