base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/008.yaml
  text: The fifth[a], for the fifth month, was the commander Shamhuth the Izrahite; and over his division were twenty-four thousand.
translation:
  language: pt
  text: O quinto[a], para o quinto mês, era o comandante Samute, o izraíta; e sua divisão tinha vinte e quatro mil homens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o zeraíta”. O gentílico hebraico aqui é tradicionalmente traduzido assim em algumas versões.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲמִישִׁי
  choice: O quinto
  rationale: O ordinal é usado substantivamente nesta lista militar e se refere ao quinto grupo na sequência; em português, o substantivo pode ficar implícito.
- source_word: לַחֹדֶשׁ הַחֲמִישִׁי
  choice: para o quinto mês
  rationale: O לְ indica a designação do grupo para o mês correspondente; a formulação preserva o sentido administrativo.
- source_word: הַשַּׂר
  choice: o comandante
  rationale: שַׂר designa um líder ou oficial e, neste contexto militar, “comandante” é claro e atual.
- source_word: שַׁמְהוּת
  choice: Samute
  rationale: Transliteração portuguesa do nome hebraico segundo a vocalização massorética.
- source_word: הַיִּזְרָח
  choice: o izraíta
  rationale: Reproduz de perto a forma gentílica do texto hebraico; a identificação tradicional alternativa é registrada em nota.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: e sua divisão tinha
  rationale: מַחֲלֻקָה refere-se à divisão militar. A formulação portuguesa expressa naturalmente a relação administrativa indicada por עַל.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: vinte e quatro mil homens
  rationale: Forma portuguesa natural do numeral; “homens” explicita o referente humano implícito no contexto da contagem militar.
