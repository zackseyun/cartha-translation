  language: en
  yaml_path: translation/ot/1_chronicles/027/019.yaml
  text: for Zebulun, Ishmaiah son of Obadiah; for Naphtali, Jerimoth son of Azriel.
translation:
  language: pt
  text: para Zebulom, Ismaías, filho de Obadias; para Naftali, Jerimote, filho de Azriel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִ/זְבוּלֻן
  choice: para Zebulom
  rationale: O ל prefixado indica atribuição ou representação nesta lista administrativa. “Para Zebulom” preserva de modo conciso a relação do oficial com a tribo.
- source_word: יִשְׁמַעְיָהוּ
  choice: Ismaías
  rationale: Adota-se a forma portuguesa tradicional e reconhecível do nome hebraico, adequada à leitura bíblica corrente.
- source_word: בֶּן
  choice: filho de
  rationale: Na fórmula identificadora, בֶּן expressa filiação direta; “filho de” é o equivalente natural em português.
- source_word: עֹבַדְיָהוּ
  choice: Obadias
  rationale: Usa-se a forma portuguesa bíblica consagrada do nome próprio.
- source_word: לְ/נַפְתָּלִי
  choice: para Naftali
  rationale: Como na primeira metade do versículo, o ל prefixado assinala a tribo à qual o oficial está atribuído ou que representa.
- source_word: יְרִימוֹת
  choice: Jerimote
  rationale: Transliteração aportuguesada e corrente do nome próprio hebraico.
- source_word: עַזְרִיאֵל
  choice: Azriel
  rationale: A forma “Azriel” é clara, próxima do hebraico e já natural em português bíblico.
