base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/009.yaml
  text: 'The sixth, for the sixth month: Ira son of Ikkesh the Tekoite; and over his division were twenty-four thousand.'
translation:
  language: pt
  text: 'O sexto, para o sexto mês: Ira, filho de Iques, o tecoíta; e em sua divisão havia vinte e quatro mil.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשִּׁשִּׁי
  choice: O sexto
  rationale: O ordinal aparece de forma elíptica na fórmula da lista e se refere ao sexto chefe militar; a tradução mantém a concisão sem explicitar uma função ausente no hebraico.
- source_word: לַחֹדֶשׁ הַשִּׁשִּׁי
  choice: para o sexto mês
  rationale: A preposição ל indica aqui a designação para o período mensal de serviço.
- source_word: עִירָא
  choice: Ira
  rationale: Transliteração corrente do nome pessoal hebraico.
- source_word: בֶן עִקֵּשׁ
  choice: filho de Iques
  rationale: Tradução direta da construção filial, com forma portuguesa natural do nome.
- source_word: הַתְּקוֹעִי
  choice: o tecoíta
  rationale: O gentílico identifica Ira como homem de Tecoa; a forma portuguesa é concisa e tradicional.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: e em sua divisão havia
  rationale: מַחֲלֻקָה designa a divisão militar de serviço. Esta formulação comunica naturalmente que o contingente enumerado pertencia à unidade sob sua responsabilidade, sem inserir o verbo 'comandar'.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: vinte e quatro mil
  rationale: Forma cardinal corrente em português.
