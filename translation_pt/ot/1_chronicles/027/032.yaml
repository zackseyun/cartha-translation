base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/032.yaml
  text: Jonathan[a], David’s uncle, was a counselor, a man of understanding, and a scribe[b]; and Jehiel son of Hachmoni was with the king’s sons.
translation:
  language: pt
  text: Jônatas, tio de Davi, era conselheiro, homem de discernimento e escriba; e Jeiel, filho de Hacmoni, estava com os filhos do rei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, conforme o sentido sugerido pelo contexto, “era responsável pelos filhos do rei”. O hebraico diz literalmente “estava com os filhos do rei”.
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹד
  choice: tio
  rationale: Neste contexto familiar e cortesão, o termo indica mais naturalmente o parentesco de Jônatas com Davi; “tio” preserva o sentido contextual usual.
- source_word: יוֹעֵץ
  choice: conselheiro
  rationale: O particípio designa alguém que aconselha, provavelmente em função oficial na corte.
- source_word: אִישׁ מֵבִין
  choice: homem de discernimento
  rationale: A expressão elogia a capacidade de compreender e julgar com sensatez; esta formulação preserva a descrição masculina singular e soa natural em português.
- source_word: סוֹפֵר
  choice: escriba
  rationale: O termo pode designar um oficial letrado, secretário ou escriba. “Escriba” mantém a amplitude da função sem especificá-la além do hebraico.
- source_word: עִם
  choice: estava com
  rationale: A preposição significa literalmente “com”. Embora o contexto possa sugerir serviço ou supervisão, o texto não explicita essa função.
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: os filhos do rei
  rationale: A expressão hebraica diz explicitamente “filhos do rei”; a tradução evita substituir a formulação por uma interpretação como “príncipes”.
- source_word: חַכְמוֹנִי
  choice: Hacmoni
  rationale: Transliteração clara e corrente do nome próprio hebraico para leitores de língua portuguesa.
theological_decisions: []
