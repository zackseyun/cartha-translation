base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/033.yaml
  text: And Ahithophel was counselor to the king[a], and Hushai the Archite was the king’s friend.
translation:
  language: pt
  text: Aitofel era conselheiro do rei, e Husai, o arquita, era amigo[a] do rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “companheiro” ou “associado”; o termo hebraico pode designar um amigo em sentido geral e, num contexto real, também pode indicar um companheiro de confiança da corte.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחִיתֹפֶל
  choice: Aitofel
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico, adequada à transliteração bíblica corrente.
- source_word: יוֹעֵץ לַמֶּלֶךְ
  choice: conselheiro do rei
  rationale: יוֹעֵץ designa quem aconselha, especialmente em contexto de corte. Embora לַמֶּלֶךְ seja literalmente “para/ao rei”, “conselheiro do rei” expressa essa relação de serviço de modo natural em português.
- source_word: חוּשַׁי
  choice: Husai
  rationale: Transliteração portuguesa corrente do nome próprio hebraico.
- source_word: הָאַרְכִּי
  choice: o arquita
  rationale: Gentílico ou designação de grupo associado a Husai; “arquita” é a forma tradicional em português e não especifica além do que o hebraico permite.
- source_word: רֵעַ
  choice: amigo
  rationale: Sentido lexical direto e claro. No contexto real, pode também designar um companheiro ou associado de confiança da corte, ambiguidade preservada em nota.
- source_word: הַמֶּלֶךְ
  choice: do rei
  rationale: 'Expressa em português natural a relação genitiva: “amigo do rei”.'
- source_word: וְ
  choice: e
  rationale: Mantém a ligação coordenativa com a lista de oficiais e entre as duas afirmações do versículo.
theological_decisions: []
translation_notes:
  register: Português atual, digno e acessível, com sintaxe natural. A repetição de “era” na segunda oração torna explícita em português a estrutura nominal elíptica do hebraico. O marcador da nota foi colocado após “amigo”, termo ao qual a alternativa lexical se refere.
