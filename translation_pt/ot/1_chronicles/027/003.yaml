  yaml_path: translation/ot/1_chronicles/027/003.yaml
  text: From the sons of Perez[b][a], the chief over all the commanders of the divisions for the first month.
translation:
  language: pt
  text: Dos filhos de Perez[a], ele era o chefe de todos os comandantes das tropas[b] no primeiro mês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos descendentes de Perez”. O hebraico diz literalmente “dos filhos de Perez”, expressão genealógica que pode indicar uma linhagem mais ampla.
    reason: lexical_alternative
  - marker: b
    text: Ou “dos exércitos”. O termo hebraico frequentemente significa “exércitos” ou “hostes”, mas neste capítulo se refere às tropas organizadas em turnos mensais.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן בְּנֵי פֶרֶץ
  choice: Dos filhos de Perez
  rationale: Preserva a expressão genealógica hebraica e a ideia de procedência ou linhagem introduzida por מִן; nesse contexto, “filhos” pode abranger descendentes posteriores.
- source_word: הָרֹאשׁ
  choice: o chefe
  rationale: רֹאשׁ designa aqui a pessoa em posição principal de autoridade; “chefe” é natural e adequado ao contexto militar-administrativo.
- source_word: לְכָל שָׂרֵי הַצְּבָאוֹת
  choice: de todos os comandantes das tropas
  rationale: A construção indica a posição principal em relação ao conjunto dos comandantes. “Tropas” conserva o sentido militar de צְבָאוֹת sem sugerir necessariamente vários exércitos nacionais distintos.
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: no primeiro mês
  rationale: A expressão identifica o primeiro período mensal do sistema de turnos descrito no capítulo; “no primeiro mês” é idiomático em português.
