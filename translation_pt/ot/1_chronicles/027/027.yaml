base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/027.yaml
  text: Over the vineyards was Shimei the Ramathite[b][a]; and over the produce of the vineyards for the wine cellars was Zabdi the Shiphmite.
translation:
  language: pt
  text: Simei, o ramatita, era encarregado das vinhas; Zabdi, o sifmita, era encarregado da produção das vinhas[a] para os depósitos de vinho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “o que havia nas vinhas”; no contexto, provavelmente se refere à produção delas.
    reason: lexical_alternative
  - marker: b
    text: Ou “armazéns de vinho” ou “adegas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: encarregado de
  rationale: Nesta lista administrativa, עַל introduz a área sob a responsabilidade de cada oficial. “Encarregado de” comunica essa função com naturalidade em português.
- source_word: הַכְּרָמִים
  choice: as vinhas
  rationale: כֶּרֶם designa normalmente uma vinha ou um vinhedo; o plural definido se refere às vinhas administradas pelo rei.
- source_word: שִׁמְעִי
  choice: Simei
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico.
- source_word: הָרָמָתִי
  choice: o ramatita
  rationale: O gentílico hebraico é preservado como gentílico em português, sem especificar qual localidade chamada Ramá está em vista.
- source_word: שֶׁבַּכְּרָמִים
  choice: a produção das vinhas
  rationale: A expressão significa literalmente “o que havia nas vinhas”. No contexto, em contraste com as próprias vinhas e em relação ao armazenamento de vinho, indica provavelmente sua produção.
- source_word: לְאֹצְרוֹת הַיַּיִן
  choice: destinada aos depósitos de vinho
  rationale: אֹצָר pode designar depósito, armazém ou tesouro. Com “vinho”, refere-se a instalações de armazenamento; “destinada aos” explicita de modo natural a relação expressa por לְ sem alterar seu sentido contextual.
- source_word: זַבְדִּי
  choice: Zabdi
  rationale: Transliteração direta e reconhecível do nome pessoal.
- source_word: הַשִּׁפְמִי
  choice: o sifmita
  rationale: O gentílico derivado de um topônimo de identificação incerta é preservado, evitando uma localização especulativa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura nominal adequada a uma lista de oficiais. “Encarregado de” torna explícita a função administrativa implícita na construção hebraica. Os gentílicos foram mantidos em formas portuguesas concisas.
