base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/012.yaml
  text: 'The ninth, for the ninth month: Abiezer the Anathothite, from Benjamin; and over his division were twenty-four thousand.'
translation:
  language: pt
  text: O nono, para o nono mês, era Abiezer, o anatotita, de Benjamim; em sua divisão havia vinte e quatro mil homens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַתְּשִׁיעִי לַחֹדֶשׁ הַתְּשִׁיעִי
  choice: O nono, para o nono mês
  rationale: Preserva a estrutura enumerativa e a correspondência explícita entre a nona divisão e o nono mês, com sintaxe natural em português.
- source_word: הָעַנְּתֹתִי
  choice: o anatotita
  rationale: Gentílico que identifica Abiezer como natural ou residente de Anatote; a transliteração segue forma portuguesa clara e tradicional.
- source_word: ל/בנימיני
  choice: de Benjamim
  rationale: O texto consonantal e a tradição massorética apresentam dificuldade morfológica; a formulação concisa mantém a associação de Abiezer com Benjamim sem impor o gentílico 'benjamita'.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: em sua divisão
  rationale: No contexto da lista militar, a construção indica o contingente sob sua responsabilidade; 'em sua divisão' comunica isso naturalmente sem repetir um verbo de comando não expresso.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: vinte e quatro mil homens
  rationale: O substantivo contado é elíptico no hebraico, mas o contexto militar deixa claro que se trata de homens; a explicitação evita uma frase incompleta em português.
