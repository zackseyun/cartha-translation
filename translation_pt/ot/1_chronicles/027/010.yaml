base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/010.yaml
  text: 'The seventh[a], for the seventh month: Helez the Pelonite, from the sons of Ephraim; and over his division were twenty-four thousand.'
translation:
  language: pt
  text: O sétimo[a], para o sétimo mês, era Helez, o pelonita, dos filhos de Efraim; e sua divisão tinha vinte e quatro mil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “o paltita”, segundo outra identificação tradicional do clã de Helez.
    reason: alternative_reading
lexical_decisions:
- source_word: הַשְּׁבִיעִי
  choice: O sétimo
  rationale: O ordinal é usado de forma elíptica no contexto da lista e se refere ao sétimo chefe militar. A formulação concisa preserva a estrutura do hebraico sem acrescentar um substantivo ausente.
- source_word: לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: para o sétimo mês
  rationale: A preposição לְ marca aqui a designação mensal do serviço; esta formulação comunica naturalmente a atribuição administrativa.
- source_word: חֶלֶץ
  choice: Helez
  rationale: Nome próprio transliterado segundo uma forma portuguesa clara e próxima do hebraico.
- source_word: הַפְּלוֹנִי
  choice: o pelonita
  rationale: Gentílico ou designação de clã conforme o texto consonantal massorético deste versículo. A leitura tradicional alternativa é registrada em nota.
- source_word: מִן בְּנֵי אֶפְרָיִם
  choice: dos filhos de Efraim
  rationale: Preserva o idioma tribal hebraico e permanece compreensível em português moderno.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: e sua divisão tinha
  rationale: מַחֲלֻקָה designa a divisão militar sob o comando de Helez. A expressão portuguesa apresenta com naturalidade o efetivo que segue, embora a construção hebraica seja literalmente 'e sobre sua divisão'.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: vinte e quatro mil homens
  rationale: Expressa o número por extenso. 'Homens' explicita o referente militar implícito no contexto da lista, sem alterar a quantidade.
