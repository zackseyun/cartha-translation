base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/016.yaml
  text: 'And over the tribes of Israel: for the Reubenites[a], Eliezer son of Zichri was leader; for the Simeonites, Shephatiah son of Maacah.'
translation:
  language: pt
  text: 'E sobre as tribos de Israel: para os rubenitas, Eliezer, filho de Zicri, era líder; para os simeonitas, Sefatias, filho de Maaca.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל
  choice: Sobre
  rationale: Introduz uma nova seção da lista administrativa e expressa responsabilidade ou autoridade sobre as tribos; em português, a ligação com o contexto não exige reproduzir mecanicamente a conjunção.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: as tribos de Israel
  rationale: Reproduz de maneira direta e natural a cadeia construta hebraica.
- source_word: לָרְאוּבֵנִי
  choice: dos rubenitas
  rationale: O gentílico designa o grupo tribal, não o patriarca. A construção com «dos» é idiomática na enumeração dos responsáveis pelas tribos.
- source_word: נָגִיד
  choice: líder
  rationale: Designa alguém colocado em posição de autoridade. «Líder» é claro, atual e evita as conotações régias que «príncipe» poderia sugerir neste contexto administrativo.
- source_word: אֱלִיעֶזֶר בֶּן זִכְרִי
  choice: Eliezer, filho de Zicri
  rationale: Emprega formas portuguesas reconhecíveis dos nomes e explicita naturalmente o patronímico hebraico.
- source_word: לַשִּׁמְעוֹנִי
  choice: dos simeonitas
  rationale: O gentílico se refere ao corpo tribal e mantém o paralelismo com «dos rubenitas».
- source_word: שְׁפַטְיָהוּ בֶּן מַעֲכָה
  choice: Sefatias, filho de Maaca
  rationale: Emprega formas portuguesas dos nomes e preserva literalmente a relação de filiação, sem tentar determinar pelo nome o sexo de Maaca.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura concisa própria de uma lista administrativa. O verbo «era», expresso na primeira entrada e elíptico na segunda, torna natural em português a oração nominal do hebraico sem alterar seu sentido.
