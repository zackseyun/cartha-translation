source:
  edition: WLC
  text: וּ/בְנֵ֣י יִשְׂרָאֵ֣ל לְֽ/מִסְפָּרָ֡/ם רָאשֵׁ֣י הָ/אָב֣וֹת וְ/שָׂרֵ֣י הָֽ/אֲלָפִ֣ים וְ/הַ/מֵּא֡וֹת וְ/שֹׁטְרֵי/הֶם֩ הַ/מְשָׁרְתִ֨ים אֶת הַ/מֶּ֜לֶךְ לְ/כֹ֣ל דְּבַ֣ר הַֽ/מַּחְלְק֗וֹת הַ/בָּאָ֤ה וְ/הַ/יֹּצֵאת֙ חֹ֣דֶשׁ בְּ/חֹ֔דֶשׁ לְ/כֹ֖ל חָדְשֵׁ֣י הַ/שָּׁנָ֑ה הַֽ/מַּחֲלֹ֨קֶת֙ הָֽ/אַחַ֔ת עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף׀׀־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/001.yaml
  text: The sons of Israel according to their number—the heads of fathers’ houses[a], and the commanders of thousands and of hundreds[c][b], and their officers who served the king in every matter of the divisions that came in and went out month by month throughout all the months of the year—each division was twenty-four thousand.
translation:
  language: pt
  text: Os filhos de Israel[a], segundo a sua contagem — os chefes das casas paternas[b], os comandantes de milhares e de centenas e seus oficiais, que serviam ao rei em todos os assuntos das divisões que entravam e saíam[c], mês após mês, durante todos os meses do ano —. Cada divisão era de vinte e quatro mil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Os israelitas”, forma coletiva mais idiomática de “os filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: “Casas paternas” é uma expressão administrativa baseada nos grupos de parentesco e nas linhagens familiares.
    reason: cultural_note
  - marker: c
    text: Isto é, as divisões se revezavam, entrando e saindo do serviço real a cada mês.
    reason: clarification
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Os filhos de Israel
  rationale: Preserva a expressão hebraica tradicional e sua forma masculina concreta; o sentido coletivo mais idiomático, “os israelitas”, é registrado em nota.
- source_word: לְמִסְפָּרָם
  choice: segundo a sua contagem
  rationale: Expressa o recenseamento ou arranjo numérico administrativo indicado pela frase hebraica.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: os chefes das casas paternas
  rationale: Mantém o caráter técnico da organização familiar e administrativa de Israel, sem reduzi-la simplesmente a “famílias”.
- source_word: וְשָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: os comandantes de milhares e de centenas
  rationale: No contexto das divisões de serviço, שרים designa dirigentes militares ou administrativos; “comandantes” comunica adequadamente essa função.
- source_word: וְשֹׁטְרֵיהֶם
  choice: e seus oficiais
  rationale: O termo pode designar oficiais ou administradores, por vezes ligados à escrita; “oficiais” se ajusta ao contexto militar-administrativo sem estreitar indevidamente o sentido.
- source_word: הַמְשָׁרְתִים אֶת הַמֶּלֶךְ
  choice: que serviam ao rei
  rationale: Reproduz com naturalidade o particípio que descreve serviço oficial contínuo ao rei.
- source_word: לְכֹל דְּבַר הַמַּחְלְקוֹת
  choice: em todos os assuntos das divisões
  rationale: דבר tem aqui o sentido amplo de assunto, negócio ou incumbência; a tradução conserva essa abrangência administrativa.
- source_word: הַבָּאָה וְהַיֹּצֵאת
  choice: que entravam e saíam
  rationale: Conserva o par concreto de movimentos do hebraico, entendido no contexto como a entrada e saída periódica das divisões do serviço real.
- source_word: חֹדֶשׁ בְּחֹדֶשׁ
  choice: mês após mês
  rationale: Forma portuguesa natural para o idioma distributivo hebraico.
- source_word: לְכֹל חָדְשֵׁי הַשָּׁנָה
  choice: durante todos os meses do ano
  rationale: Indica que o sistema de rodízio abrangia o ciclo anual inteiro.
- source_word: הַמַּחֲלֹקֶת הָאַחַת
  choice: cada divisão
  rationale: 'Embora a forma seja literalmente “a divisão uma”, o contexto lhe confere sentido distributivo: cada divisão individual do ciclo.'
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: vinte e quatro mil
  rationale: Tradução direta do numeral, sem acrescentar um substantivo ausente no hebraico.
