  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva os termos administrativos do hebraico, mas emprega sintaxe corrente. O ponto e vírgula após o travessão acomoda a longa enumeração e mantém a declaração final sobre o tamanho de cada divisão sem inserir “homens”, termo não expresso no original.
