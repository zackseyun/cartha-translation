  text: וְ/עַ֗ל עֹשֵׂי֙ מְלֶ֣אכֶת הַ/שָּׂדֶ֔ה לַ/עֲבֹדַ֖ת הָ/אֲדָמָ֑ה עֶזְרִ֖י בֶּן כְּלֽוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/026.yaml
  text: And over those who did the work of the field for the cultivation of the ground was Ezri son of Chelub[a][b].
translation:
  language: pt
  text: Sobre os que faziam o trabalho do campo para cultivar o solo estava Ezri, filho de Quelube.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os trabalhadores do campo”. A expressão participial hebraica admite esta forma mais compacta.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para trabalhar a terra”. A expressão se refere ao cultivo agrícola.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Sobre
  rationale: Neste contexto de lista administrativa, עַל apresenta a pessoa encarregada de uma área de responsabilidade. Em português, iniciar com “Sobre” preserva o sentido de supervisão; a conjunção pode ficar implícita com naturalidade na sequência da lista.
- source_word: עֹשֵׂי מְלֶאכֶת הַשָּׂדֶה
  choice: os que faziam o trabalho do campo
  rationale: A expressão participial designa as pessoas ocupadas no trabalho agrícola. A tradução mantém a estrutura hebraica sem especificar tarefas além do texto.
- source_word: לַעֲבֹדַת הָאֲדָמָה
  choice: para cultivar o solo
  rationale: Neste contexto agrícola, עֲבֹדָה indica o trabalho ou cultivo da terra, e אֲדָמָה designa o solo cultivável. A formulação é clara e natural em português.
- source_word: עֶזְרִי בֶּן כְּלוּב
  choice: Ezri, filho de Quelube
  rationale: Os nomes são transliterados em forma legível em português, e בֶּן é traduzido pela fórmula convencional “filho de”.
