base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/018.yaml
  text: For Judah[a], Elihu, one of David’s brothers; for Issachar, Omri son of Michael.
translation:
  language: pt
  text: Para Judá, Eliú[a], um dos irmãos de Davi; para Issacar, Onri, filho de Micael.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz “Eliú”. Algumas versões antigas e alguns intérpretes leem “Eliabe”, provavelmente por harmonização com o nome de um irmão de Davi mencionado em outras passagens.
    reason: alternative_reading
lexical_decisions:
- source_word: לִיהוּדָה
  choice: Para Judá
  rationale: O לְ prefixado introduz a tribo nesta lista administrativa; “Para Judá” preserva de modo natural a estrutura concisa da lista.
- source_word: אֱלִיהוּ
  choice: Eliú
  rationale: O texto consonantal massorético traz אֱלִיהוּ, vertido pela forma portuguesa tradicional “Eliú”. A variante “Eliabe” é registrada em nota, sem substituir a leitura hebraica principal.
- source_word: מֵאֲחֵי דָוִיד
  choice: um dos irmãos de Davi
  rationale: 'A preposição מִן diante do plural construto tem sentido partitivo: Eliú era um dentre os irmãos de Davi. Esta formulação é clara e natural em português.'
- source_word: לְיִשָׂשכָר
  choice: para Issacar
  rationale: Assim como no caso de Judá, o לְ introduz o representante da tribo na lista.
- source_word: עָמְרִי
  choice: Onri
  rationale: Emprega-se a forma tradicional portuguesa do nome próprio hebraico עָמְרִי.
- source_word: בֶּן מִיכָאֵל
  choice: filho de Micael
  rationale: A construção patronímica hebraica é traduzida diretamente, com a forma portuguesa tradicional “Micael”.
