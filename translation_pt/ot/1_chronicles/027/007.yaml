base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/007.yaml
  text: The fourth[a], for the fourth month, was Asahel the brother of Joab, and Zebadiah his son after him; and over his division were twenty-four thousand.
translation:
  language: pt
  text: O quarto, para o quarto mês, era Asael, irmão de Joabe, e, depois dele, seu filho Zebadias; sua divisão tinha vinte e quatro mil.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרְבִיעִי
  choice: O quarto
  rationale: O ordinal é usado substantivamente na fórmula da lista. A forma elíptica preserva a estrutura do hebraico e é compreensível pelo contexto.
- source_word: לַחֹדֶשׁ הָרְבִיעִי
  choice: para o quarto mês
  rationale: A preposição ל indica a atribuição ao turno mensal; esta formulação é natural em português e conserva o sentido administrativo.
- source_word: עֲשָׂהאֵל
  choice: Asael
  rationale: Transliteração portuguesa corrente do nome próprio hebraico.
- source_word: אֲחִי יוֹאָב
  choice: irmão de Joabe
  rationale: Reproduz diretamente a relação expressa pela construção hebraica, com forma idiomática em português.
- source_word: וּזְבַדְיָה בְנוֹ אַחֲרָיו
  choice: e, depois dele, seu filho Zebadias
  rationale: Mantém a expressão literal 'depois dele', que neste contexto indica sucessão, sem tornar explícito no texto mais do que o hebraico afirma.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: sua divisão tinha
  rationale: מַחֲלֻקָה designa aqui uma divisão militar. A formulação portuguesa comunica naturalmente a composição da unidade, embora a expressão hebraica use עַל, literalmente 'sobre'.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: vinte e quatro mil homens
  rationale: Forma numérica corrente em português; 'homens' é uma explicitação contextual mínima do contingente militar contado.
