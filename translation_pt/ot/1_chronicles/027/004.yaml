base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/004.yaml
  text: Over the division for the second month was Dodai the Ahohite[a], and Mikloth was the leader over his division; and in his division were twenty-four thousand.
translation:
  language: pt
  text: À frente da divisão do segundo mês estava Dodai, o aoíta[a], e Miclote era o líder de sua divisão; sua divisão tinha vinte e quatro mil homens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e sua divisão, tendo Miclote como líder”. A sequência hebraica é condensada, e não fica claro se Miclote é apresentado como subordinado de Dodai dentro da divisão ou como aquele que estava à frente dela.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַחֲלֹקֶת / מַחֲלֻקְתּוֹ
  choice: divisão / sua divisão
  rationale: No contexto militar e administrativo de 1 Crônicas 27, o termo designa a unidade em rodízio para o serviço mensal. “Divisão” é claro, atual e preserva o sentido organizacional.
- source_word: הַחֹדֶשׁ הַשֵּׁנִי
  choice: o segundo mês
  rationale: Expressão ordinal direta que identifica o mês correspondente no rodízio.
- source_word: דּוֹדַי
  choice: Dodai
  rationale: Transliteração da forma do nome próprio presente neste versículo, sem harmonizá-la com formas relacionadas encontradas em outros lugares.
- source_word: הָאֲחוֹחִי
  choice: o aoíta
  rationale: Designação gentílica ou clânica com artigo. “Aoíta” segue uma forma corrente em português bíblico e permanece inteligível.
- source_word: וּמִקְלוֹת
  choice: Miclote
  rationale: Forma aportuguesada e reconhecível do nome próprio hebraico.
- source_word: הַנָּגִיד
  choice: o líder
  rationale: O termo pode indicar líder, chefe ou comandante. “Líder” preserva a amplitude sem impor uma patente militar específica.
- source_word: וְעַל־מַחֲלֻקְתּוֹ
  choice: de sua divisão
  rationale: A redação expressa a função de liderança de Miclote em relação à divisão, mantendo em nota a ambiguidade causada pela sequência hebraica comprimida.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: vinte e quatro mil homens
  rationale: A cardinalidade é vertida por extenso; “homens” explicita naturalmente os integrantes da unidade militar, implícitos no contexto.
