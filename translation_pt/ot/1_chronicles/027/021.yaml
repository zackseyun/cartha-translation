base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/021.yaml
  text: 'for the half-tribe of Manasseh in Gilead: Iddo son of Zechariah[a]; for Benjamin: Jaasiel son of Abner.'
translation:
  language: pt
  text: 'pela meia tribo de Manassés em Gileade: Ido, filho de Zacarias; por Benjamim: Jaasiel[a], filho de Abner.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Jasiel”.
    reason: Variante de transliteração do nome próprio.
lexical_decisions:
- source_word: לַחֲצִי הַמְנַשֶּׁה
  choice: pela meia tribo de Manassés
  rationale: O לְ marca o grupo representado na lista administrativa. “Tribo” é explicitado para deixar claro que se trata de uma das duas metades territoriais de Manassés.
- source_word: גִּלְעָדָה
  choice: em Gileade
  rationale: Embora a terminação possa ter valor direcional, neste contexto ela identifica a região transjordânica à qual pertencia essa metade da tribo; “em Gileade” expressa naturalmente essa relação geográfica.
- source_word: יִדּוֹ
  choice: Ido
  rationale: Forma portuguesa tradicional e clara do nome próprio.
- source_word: בֶּן זְכַרְיָהוּ
  choice: filho de Zacarias
  rationale: Tradução corrente da fórmula genealógica, com a forma portuguesa consagrada do nome.
- source_word: לְבִנְיָמִן
  choice: por Benjamim
  rationale: O לְ assinala novamente o grupo representado; a formulação concisa acompanha a estrutura da lista.
- source_word: יַעֲשִׂיאֵל
  choice: Jaasiel
  rationale: Transliteração que representa de perto a vocalização massorética; a variante “Jasiel” é registrada em nota.
- source_word: בֶּן אַבְנֵר
  choice: filho de Abner
  rationale: Tradução direta da fórmula genealógica, mantendo a forma tradicional do nome próprio.
