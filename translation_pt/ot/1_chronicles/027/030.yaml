base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/030.yaml
  text: Over the camels was Obil the Ishmaelite[a], and over the female donkeys was Jehdeiah the Meronothite.
translation:
  language: pt
  text: Obil, o ismaelita, estava encarregado dos camelos; e Jedias, o meronotita, das jumentas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל
  choice: Sobre
  rationale: No contexto desta lista administrativa, a preposição indica responsabilidade ou supervisão. “Sobre” preserva a estrutura concisa e repetida do hebraico.
- source_word: הַגְּמַלִּים
  choice: os camelos
  rationale: Tradução direta do substantivo masculino plural definido.
- source_word: אוֹבִיל
  choice: Obil
  rationale: Transliteração tradicional e transparente do nome próprio hebraico.
- source_word: הַיִּשְׁמְעֵאלִי
  choice: o ismaelita
  rationale: O gentílico identifica Obil por sua associação étnica ou clânica com Ismael; a forma portuguesa é natural e preserva essa identificação.
- source_word: הָאֲתֹנוֹת
  choice: as jumentas
  rationale: O termo hebraico designa especificamente jumentos do sexo feminino. “Jumentas” expressa essa precisão lexical de modo claro e corrente, sem necessidade de nota.
- source_word: יֶחְדְּיָהוּ
  choice: Jedias
  rationale: Forma portuguesa tradicional do nome próprio, adequada à legibilidade bíblica moderna.
- source_word: הַמֵּרֹנֹתִי
  choice: o meronotita
  rationale: Gentílico provavelmente derivado de um topônimo; a transliteração preserva a identificação sem resolver além da evidência se indica origem geográfica ou associação de clã.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com paralelismo administrativo preservado. A elipse verbal na segunda oração reproduz naturalmente a concisão do hebraico. Não se manteve a nota da camada inglesa porque “jumentas” já comunica no texto a especificidade feminina de הָאֲתֹנוֹת; além disso, o marcador inglês estava ligado a “ismaelita”, embora a nota tratasse dos animais.
