base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/005.yaml
  text: The commander of the third division for the third month was Benaiah son of Jehoiada the chief[a], and in his division were twenty-four thousand.
translation:
  language: pt
  text: O comandante da terceira divisão, designada para o terceiro mês, era Benaia, filho de Joiada, o sacerdote, chefe[a]. Sua divisão era de vinte e quatro mil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, quanto à pontuação e à vinculação das expressões: “Benaia, filho de Joiada, o sacerdote principal”. O hebraico também pode entender “o sacerdote” como referência a Joiada e “chefe” como aposição a Benaia.'
    reason: A sequência hebraica הַכֹּהֵן רֹאשׁ permite mais de uma análise sintática; a nota preserva essa ambiguidade sem transformar «sacerdote principal» em título técnico inequívoco.
lexical_decisions:
- source_word: שַׂר הַצָּבָא
  choice: o comandante
  rationale: שַׂר, em combinação com הַצָּבָא e no contexto das divisões militares mensais, designa quem exerce o comando; “comandante” é claro e natural.
- source_word: הַשְּׁלִישִׁי לַחֹדֶשׁ הַשְּׁלִישִׁי
  choice: da terceira divisão, correspondente ao terceiro mês
  rationale: O primeiro ordinal identifica a terceira unidade da sequência, enquanto o segundo qualifica o mês. “Divisão” é suprido a partir da estrutura repetida do capítulo.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: Benaia, filho de Joiada
  rationale: Empregam-se as formas portuguesas tradicionais e amplamente reconhecíveis dos nomes hebraicos.
- source_word: הַכֹּהֵן רֹאשׁ
  choice: o sacerdote principal
  rationale: A combinação pode descrever Joiada como sacerdote de posição elevada. “Principal” traduz o valor de רֹאשׁ sem impor necessariamente o título técnico “sumo sacerdote”.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: Sua divisão tinha
  rationale: A expressão relaciona Benaia à divisão sob sua responsabilidade; no padrão da lista, a oração informa o efetivo dessa unidade.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: vinte e quatro mil homens
  rationale: O número é direto; “homens” explicita naturalmente o referente militar implícito no contexto.
theological_decisions:
- issue: Vinculação e função de הַכֹּהֵן רֹאשׁ
  choice: o sacerdote principal, como descrição de Joiada
  alternative: “Benaia, filho de Joiada, o sacerdote, era o chefe” ou “Benaia, filho de Joiada, o sacerdote-chefe”
  rationale: A sequência hebraica permite mais de uma vinculação sintática. A redação principal entende a expressão como descrição de Joiada e evita o título técnico “sumo sacerdote”; a nota conserva as demais leituras possíveis.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e inteligibilidade internacional. “Correspondente ao” esclarece a organização mensal sem tornar a frase excessivamente literal; “sacerdote principal” preserva a ideia de proeminência sem introduzir um título técnico não inequívoco no hebraico.
