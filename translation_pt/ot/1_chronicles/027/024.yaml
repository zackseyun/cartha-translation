base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/024.yaml
  text: Joab son of Zeruiah began to count[a], but he did not finish; and because of this wrath came upon Israel[b]. And the number was not entered in the account of the chronicles of King David.
translation:
  language: pt
  text: 'Joabe, filho de Zeruia, começou a contar, mas não terminou; por causa disso, a ira veio sobre Israel. E o número não foi registrado[a] nos anais[b] do rei Davi.


    [a] Literalmente, “não subiu”; expressão que, neste contexto, significa que o número não foi incluído ou registrado em um documento oficial.


    [b] Os “anais” eram os registros oficiais ligados ao reinado de Davi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “não subiu”; expressão que, neste contexto, significa que o número não foi incluído ou registrado em um documento oficial.
    reason: lexical_alternative
  - marker: b
    text: Os “anais” eram os registros oficiais ligados ao reinado de Davi.
    reason: cultural_note
lexical_decisions:
- source_word: הֵחֵל לִמְנוֹת
  choice: começou a contar
  rationale: Reproduz diretamente a construção com החל (“começar”) e מנה (“contar”), sem explicitar “recenseamento” além do que a frase declara.
- source_word: וְלֹא כִלָּה
  choice: mas não terminou
  rationale: כלה indica concluir ou terminar; a formulação é natural e concisa em português.
- source_word: וַיְהִי בָזֹאת קֶצֶף עַל יִשְׂרָאֵל
  choice: por causa disso, veio ira sobre Israel
  rationale: Mantém a relação causal de בָזֹאת e a imagem de קצף sobrevindo a Israel, sem nomear explicitamente o agente.
- source_word: הַמִּסְפָּר
  choice: o número
  rationale: Refere-se ao total resultante da contagem e conserva a ligação lexical com o verbo anterior.
- source_word: וְלֹא עָלָה
  choice: não foi registrado
  rationale: Embora עלה signifique literalmente “subir”, aqui funciona em contexto administrativo para a inclusão de uma informação em registro oficial.
- source_word: בְּמִסְפַּר דִּבְרֵי הַיָּמִים
  choice: nos anais
  rationale: דברי הימים designa anais ou registros históricos oficiais; a repetição de מספר não soa natural em português e seu valor administrativo é comunicado por “registrado nos anais”.
- source_word: לַמֶּלֶךְ דָּוִיד
  choice: do rei Davi
  rationale: O lamed expressa aqui relação ou pertencimento; “do rei Davi” é a formulação portuguesa mais natural.
theological_decisions:
- issue: Identificação da origem da ira
  choice: 'Manter o agente implícito: “veio ira sobre Israel”'
  alternative: “A ira do SENHOR veio sobre Israel” ou “Deus se irou contra Israel”
  rationale: O contexto mais amplo aponta para ira divina, mas esta oração hebraica não nomeia Deus como agente. A tradução preserva essa forma e sua tensão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Joabe”, “Zeruia” e “Davi” seguem as formas bíblicas correntes. Os marcadores foram posicionados junto aos termos que realmente explicam, corrigindo o desalinhamento aparente da camada inglesa fornecida.
