base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/004.yaml
  text: 'And Obed-edom had sons: Shemaiah the firstborn[a], Jehozabad the second, Joah the third, and Sakar the fourth[b], and Nethanel the fifth.'
translation:
  language: pt
  text: 'Obede-Edom teve filhos: Semaías, o primogênito; Jeozabade, o segundo; Joá, o terceiro; Sacar, o quarto[a]; e Natanael, o quinto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome “Sacar” corresponde aqui a uma forma hebraica distinta de “Issacar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/עֹבֵד אֱדֹם בָּנִים
  choice: Obede-Edom teve estes filhos
  rationale: A construção hebraica é elíptica, literalmente próxima de “e para Obede-Edom, filhos”. A inclusão de “teve estes” expressa de modo natural em português a fórmula genealógica sem alterar seu sentido.
- source_word: שְׁמַעְיָה הַבְּכוֹר
  choice: Semaías, o primogênito
  rationale: “Primogênito” preserva o valor familiar de בְּכוֹר, que é mais específico do que um simples ordinal.
- source_word: יְהוֹזָבָד הַשֵּׁנִי
  choice: Jeozabade, o segundo
  rationale: O nome é transliterado conforme forma corrente em português, e o ordinal é traduzido diretamente.
- source_word: יוֹאָח הַשְּׁלִשִׁי
  choice: Joá, o terceiro
  rationale: Transliteração portuguesa direta do nome hebraico, seguida do ordinal correspondente.
- source_word: וְשָׂכָר הָרְבִיעִי
  choice: Sakar, o quarto
  rationale: A forma hebraica é Sakar, distinta do nome Issacar; a transliteração conserva essa diferença textual.
- source_word: וּנְתַנְאֵל הַחֲמִישִׁי
  choice: e Natanael, o quinto
  rationale: “Natanael” é a forma tradicional e amplamente reconhecível em português para o nome hebraico, acompanhada do ordinal direto.
