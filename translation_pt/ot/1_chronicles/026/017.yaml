base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/017.yaml
  text: On the east were six Levites; on the north[a], four a day; on the south, four a day; and at the storehouses, two by two.
translation:
  language: pt
  text: No lado leste, havia seis levitas; no lado norte, quatro por dia; no lado sul, quatro por dia; e nos depósitos[a], dois a dois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: Asupim; o termo talvez seja o nome de um lugar ou de um conjunto específico de câmaras, em vez de uma referência geral a depósitos.'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמִּזְרָח
  choice: no lado leste
  rationale: A expressão direcional indica o local da designação; “no lado leste” é natural e mantém o paralelismo com norte e sul.
- source_word: הַלְוִיִּם שִׁשָּׁה
  choice: havia seis levitas
  rationale: O verbo “havia” é suprido em português para formar uma oração natural, sem alterar a contagem hebraica.
- source_word: לַצָּפוֹנָה לַיּוֹם אַרְבָּעָה
  choice: no lado norte, quatro por dia
  rationale: “Por dia” expressa claramente o valor distributivo de לַיּוֹם no contexto da escala de serviço.
- source_word: לַנֶּגְבָּה לַיּוֹם אַרְבָּעָה
  choice: no lado sul, quatro por dia
  rationale: Mantém a estrutura paralela e a distribuição diária indicada no hebraico.
- source_word: וְלָאֲסֻפִּים
  choice: e nos depósitos
  rationale: אֲסֻפִּים provavelmente designa depósitos ou câmaras de armazenamento do complexo, embora também possa ser entendido como nome próprio; a incerteza é registrada em nota.
- source_word: שְׁנַיִם שְׁנָיִם
  choice: dois a dois
  rationale: A repetição do numeral tem sentido distributivo; “dois a dois” preserva de modo conciso a forma e a possível ambiguidade do hebraico.
