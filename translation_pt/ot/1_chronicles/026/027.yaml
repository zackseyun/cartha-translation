  text: מִן הַ/מִּלְחָמ֥וֹת וּ/מִן הַ/שָּׁלָ֖ל הִקְדִּ֑ישׁוּ לְ/חַזֵּ֖ק לְ/בֵ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/027.yaml
  text: From the wars and from the spoil they had dedicated things to strengthen the house of Yahweh.
translation:
  language: pt
  text: Das guerras e dos despojos, eles consagraram bens[a] para fortalecer a casa de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico não expressa o objeto de “consagraram”; literalmente, “das guerras e dos despojos, eles consagraram”.
    reason: Esclarecer o objeto subentendido e preservar a concisão ambígua do texto hebraico.
lexical_decisions:
- source_word: מִן הַמִּלְחָמוֹת
  choice: Das guerras
  rationale: מִן indica origem ou procedência, e o plural מִלְחָמוֹת abrange as guerras ou campanhas militares.
- source_word: וּמִן הַשָּׁלָל
  choice: e dos despojos
  rationale: שָׁלָל designa bens tomados em guerra; “despojos” é claro, conciso e adequado ao registro militar.
- source_word: הִקְדִּישׁוּ
  choice: eles consagraram bens
  rationale: O hifil de קדשׁ significa separar para uso sagrado ou dedicar. “Bens” foi acrescentado para tornar explícito em português o objeto que permanece subentendido no hebraico; a nota registra essa particularidade.
- source_word: לְחַזֵּק
  choice: para fortalecer
  rationale: O infinitivo de חזק expressa tornar forte ou reforçar. No contexto do templo, pode envolver sustentação, conservação ou reparos, mas “fortalecer” preserva a formulação mais ampla do hebraico.
- source_word: לְבֵית יְהוָה
  choice: a casa de Yahweh
  rationale: “Casa” preserva a designação hebraica do santuário, enquanto “Yahweh” representa diretamente o nome divino יְהוָה.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o tetragrama. “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Finalidade dos bens consagrados
  choice: para fortalecer a casa de Yahweh
  alternative: para reparar ou manter a casa de Yahweh
  rationale: חזק pode assumir uma aplicação concreta de reparo ou manutenção neste contexto, mas o texto emprega o sentido mais amplo de fortalecer; a tradução não restringe indevidamente a finalidade.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com sintaxe próxima ao hebraico. “Casa de Yahweh” conserva a imagem tradicional do santuário; “bens” evita o vago “coisas”, e sua condição de complemento suprido é indicada em nota.
