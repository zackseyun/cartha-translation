base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/016.yaml
  text: For Shuppim and Hosah[a], the lot fell to the west, with the Gate of Shallecheth on the ascending highway, guard corresponding to guard.
translation:
  language: pt
  text: Para Supim e Hosa, o sorteio determinou o lado oeste, junto ao portão de Salequete[a], na estrada elevada que sobe, posto de guarda diante de posto de guarda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “portão da Expulsão”. “Salequete” parece ser um nome próprio derivado de um verbo que significa “lançar fora” ou “derrubar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשֻׁפִּים וּלְחֹסָה
  choice: Para Supim e Hosa
  rationale: As preposições ל marcam os destinatários da atribuição no contexto da distribuição por sorteio. A repetição pode ser expressa naturalmente em português por uma única preposição coordenando os dois nomes.
- source_word: לַמַּעֲרָב
  choice: o lado oeste
  rationale: Indica a localização ocidental atribuída; “o lado oeste” é claro e natural no contexto espacial.
- source_word: עִם
  choice: junto a
  rationale: Expressa a associação espacial com o portão sem definir de modo excessivamente preciso a relação topográfica.
- source_word: שַׁעַר שַׁלֶּכֶת
  choice: o portão de Salequete
  rationale: Salequete é provavelmente o nome próprio do portão; por isso, o nome é transliterado no texto, mantendo em nota a possível tradução etimológica.
- source_word: בַּמְסִלָּה הָעוֹלָה
  choice: na estrada elevada que sobe
  rationale: מְסִלָּה pode designar uma estrada construída ou elevada, e o particípio הָעוֹלָה indica que ela sobe. A formulação preserva ambos os elementos topográficos.
- source_word: מִשְׁמָר לְעֻמַּת מִשְׁמָר
  choice: posto de guarda diante de posto de guarda
  rationale: A expressão hebraica é concisa e pode indicar postos ou turnos correspondentes, possivelmente situados frente a frente. “Diante de” preserva a relação espacial sem sugerir hostilidade.
