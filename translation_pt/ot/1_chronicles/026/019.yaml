base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/019.yaml
  text: These were the divisions of the gatekeepers for the sons of the Korahites and for the sons of Merari[a].
translation:
  language: pt
  text: Estas eram as divisões dos porteiros para os filhos dos coraítas e para os filhos de Merari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Estas são as divisões dos porteiros para os filhos dos coraítas e para os filhos de Merari”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Estas eram
  rationale: A oração hebraica não tem verbo expresso e, literalmente, admite “Estas são”. No contexto de encerramento da lista, o pretérito soa natural em português e apresenta um resumo das divisões mencionadas.
- source_word: מַחְלְקוֹת
  choice: divisões
  rationale: O substantivo designa grupos organizados ou turnos de serviço. “Divisões” preserva o sentido administrativo sem acrescentar uma especificação ausente no hebraico.
- source_word: הַשֹּׁעֲרִים
  choice: porteiros
  rationale: Designa os responsáveis por guardar e supervisionar as portas do templo. “Porteiros” é uma designação bíblica corrente e compreensível em português.
- source_word: לִבְנֵי
  choice: entre os descendentes de
  rationale: Embora a forma literal seja “para os filhos de”, aqui a expressão indica os grupos familiares aos quais pertenciam as divisões. “Entre os descendentes de” comunica naturalmente essa distribuição por linhagens.
- source_word: הַקָּרְחִי
  choice: os coraítas
  rationale: É uma designação gentílica ou clânica derivada de Corá; o plural português identifica corretamente o grupo familiar.
- source_word: וְלִבְנֵי מְרָרִי
  choice: e os descendentes de Merari
  rationale: Mantém a referência explícita à linhagem de Merari e o paralelismo com o grupo anterior, em português natural.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A tradução usa “descendentes” no texto para tornar natural a referência clânica, enquanto a nota preserva a forma hebraica mais literal “filhos”. O marcador [a] aparece no texto principal.
