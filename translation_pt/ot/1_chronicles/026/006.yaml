base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/006.yaml
  text: And to Shemaiah his son[a], sons were born who ruled over their fathers’ house[b], for they were mighty men of valor.
translation:
  language: pt
  text: A Semaías, seu filho, nasceram filhos que exerciam autoridade sobre a casa de seus antepassados[a], pois eram homens valentes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “governavam” ou “eram chefes da casa de seus antepassados”.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica também pode designar homens de força, capacidade, competência ou posição comprovadas, e não apenas guerreiros corajosos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִשְׁמַעְיָה
  choice: A Semaías
  rationale: A preposição לְ integra a fórmula hebraica de nascimento e indica que os filhos nasceram a Semaías; a conjunção וְ dá continuidade à genealogia, sem exigir um “e” explícito em português.
- source_word: בְנוֹ
  choice: seu filho
  rationale: Identifica Semaías naturalmente como filho do homem mencionado antes, Obede-Edom.
- source_word: נוֹלַד בָּנִים
  choice: nasceram filhos
  rationale: Embora נוֹלַד tenha forma singular, a construção hebraica apresenta בָּנִים como sujeito lógico; o plural é exigido pelo português corrente.
- source_word: הַמִּמְשָׁלִים
  choice: que governavam
  rationale: O particípio de משל expressa exercício de governo ou autoridade. A forma verbal liga-se naturalmente a “filhos” e evita reduzi-los apenas a detentores de um título.
- source_word: לְבֵית אֲבִיהֶם
  choice: a casa de seu pai
  rationale: Mantém o singular בֵית e o sentido social de “casa” como família ou unidade ancestral. O sufixo plural indica o pai comum deles, não vários pais.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão pela qual esses filhos exerciam autoridade, em registro narrativo digno e corrente.
- source_word: גִּבּוֹרֵי חַיִל
  choice: homens valentes
  rationale: Conserva a força da expressão tradicional sem restringi-la necessariamente a guerreiros; no contexto, ela pode abranger força, capacidade, competência e posição reconhecida.
- source_word: הֵמָּה
  choice: eram
  rationale: O pronome independente reforça o sujeito; em português, o destaque é transmitido adequadamente pela oração causal sem acrescentar uma forma enfática artificial.
