translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Casa de seu pai” preserva a imagem e a estrutura familiar do hebraico; as notas mantêm a amplitude semântica de governar e de גִּבּוֹרֵי חַיִל.
