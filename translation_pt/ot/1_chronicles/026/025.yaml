base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/025.yaml
  text: 'And his brothers belonging to Eliezer: Rehabiah his son[a], and Jeshaiah his son, and Joram his son, and Zichri his son, and Shelomith his son.'
translation:
  language: pt
  text: '25 Quanto aos parentes de Eliézer[a]: Reabias, seu filho; Jesaías, seu filho; Jorão, seu filho; Zicri, seu filho; e Selomite, seu filho.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: «E seus irmãos, de Eliézer». A construção hebraica provavelmente introduz o ramo da família descendente de Eliézer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶחָיו
  choice: Quanto aos parentes de Sebuel
  rationale: Embora אָחִים signifique literalmente «irmãos», em contexto genealógico o plural pode abranger parentes ou membros do mesmo grupo familiar. «Parentes» evita sugerir que todos os nomes seguintes eram irmãos imediatos de Sebuel; o nome «Sebuel», antecedente no versículo anterior, explicita em português o referente do sufixo.
- source_word: לֶאֱלִיעֶזֶר
  choice: da linhagem de Eliézer
  rationale: A preposição לְ indica aqui a relação com Eliézer e introduz o ramo familiar que descende dele. «Da linhagem de» comunica essa função genealógica em português natural sem transformar Eliézer em mais um nome da cadeia.
- source_word: רְחַבְיָהוּ
  choice: Reabias
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico, adequada a um texto bíblico moderno.
- source_word: בְנוֹ
  choice: seu filho
  rationale: A repetição preserva a cadeia filial expressa no hebraico. Como o possessivo português pode retomar o nome imediatamente anterior, mantém-se também a concisão e certa ambiguidade formal do original.
- source_word: וִישַׁעְיָהוּ
  choice: Jesaías
  rationale: Transliteração portuguesa convencional deste nome; distingue-se naturalmente no contexto pela genealogia, sem necessidade de paráfrase.
- source_word: וְיֹרָם
  choice: Jorão
  rationale: Representa a forma curta יֹרָם, em vez da forma mais longa equivalente a Jeorão.
- source_word: וְזִכְרִי
  choice: Zicri
  rationale: Transliteração portuguesa clara e convencional do nome próprio.
- source_word: וּשְׁלֹמוֹת
  choice: Selomite
  rationale: Forma portuguesa tradicional do nome próprio, preferível a uma transliteração rígida e menos legível.
