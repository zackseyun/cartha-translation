translation_notes:
  register: Português moderno, digno e acessível, com formas onomásticas usuais em português. A abertura foi levemente explicitada para ligar o versículo ao antecedente imediato e tornar compreensível a construção genealógica, enquanto a repetição de «seu filho» conserva o ritmo e a estrutura da cadeia hebraica.
