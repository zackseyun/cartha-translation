  text: בְּנֵ֖י יְחִֽיאֵלִ֑י זֵתָם֙ וְ/יוֹאֵ֣ל אָחִ֔י/ו עַל אֹצְר֖וֹת בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/022.yaml
  text: 'The sons of Jehieli: Zetham and Joel his brother were over the treasuries of the house of Yahweh[a].'
translation:
  language: pt
  text: Os filhos de Jeieli, Zetã e seu irmão Joel, eram responsáveis pelos tesouros da casa de Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “casa de Yahweh”; tradicionalmente traduzido por “casa do SENHOR”.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יְחִיאֵלִי
  choice: Os filhos de Jeieli
  rationale: Mantém a construção genealógica direta do hebraico. יְחִיאֵלִי é entendido como nome próprio em aposição, conforme favorece o contexto administrativo e genealógico.
- source_word: זֵתָם
  choice: Zetã
  rationale: Transliteração portuguesa do nome próprio, com terminação nasal representada de modo natural em português.
- source_word: וְיוֹאֵל אָחִיו
  choice: e seu irmão Joel
  rationale: Preserva o sufixo masculino singular de אָחִיו, que naturalmente apresenta Joel como irmão de Zetã, em ordem mais idiomática em português.
- source_word: עַל
  choice: eram responsáveis por
  rationale: No contexto administrativo, עַל expressa supervisão ou responsabilidade. A formulação é clara e natural em português atual.
- source_word: אֹצְרוֹת
  choice: os tesouros
  rationale: O termo pode designar tanto os bens valiosos quanto os depósitos que os guardavam. 'Tesouros' preserva a referência aos bens sob administração sem excluir a nuance institucional.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Traduz literalmente בֵּית como 'casa' e representa o nome divino יהוה como 'Yahweh', sem substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome pessoal divino. 'Yahweh' o representa diretamente, enquanto 'SENHOR' o substitui por um título e 'Jeová' reflete uma forma tradicional híbrida.
- issue: Sentido de אֹצְרוֹת no contexto do templo
  choice: tesouros
  alternative: tesourarias; depósitos
  rationale: O hebraico permite referência aos bens armazenados ou aos locais/instituições que os guardavam. 'Tesouros' mantém essa tensão lexical sem impor exclusivamente o sentido arquitetônico ou administrativo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe foi levemente reorganizada para naturalidade, sem eliminar o singular de “seu irmão” nem a expressão concreta “casa de Yahweh”.
