base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/014.yaml
  text: The lot for the east fell to Shelemyahu. Then they cast lots for his son Zekaryahu[a], a counselor with insight, and his lot came out for the north.
translation:
  language: pt
  text: A sorte para o leste coube a Selemias. Em seguida, lançaram sortes para seu filho Zacarias, conselheiro com discernimento[a], e lhe saiu a sorte para o norte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um conselheiro prudente”. A expressão hebraica descreve Zacarias como “conselheiro com discernimento”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל הַגּוֹרָל
  choice: A sorte ... caiu
  rationale: Preserva a imagem concreta do idioma hebraico נפל + גורל e continua compreensível em português no contexto do sorteio.
- source_word: מִזְרָחָה
  choice: para o leste
  rationale: O ה direcional indica a direção ou área atribuída; a formulação explicita que o lote correspondia ao lado leste.
- source_word: לְשֶׁלֶמְיָהוּ
  choice: a Selemias
  rationale: A preposição לְ marca o destinatário da atribuição; Selemias é a forma portuguesa tradicional e reconhecível do nome.
- source_word: וּזְכַרְיָהוּ בְנוֹ
  choice: Depois ... para seu filho Zacarias
  rationale: A formulação torna clara a relação filial e a progressão narrativa expressa pelo waw, sem acrescentar conteúdo substantivo.
- source_word: יוֹעֵץ בְּשֶׂכֶל
  choice: um conselheiro com discernimento
  rationale: Mantém separadamente o particípio יוֹעֵץ, 'conselheiro', e בְּשֶׂכֶל, que expressa discernimento, prudência ou sensatez.
- source_word: הִפִּילוּ גּוֹרָלוֹת
  choice: lançaram sortes
  rationale: É a expressão portuguesa natural para o hifil de נפל com גורלות, isto é, realizar um sorteio.
- source_word: וַיֵּצֵא גוֹרָלוֹ
  choice: e a sorte dele saiu
  rationale: Reproduz a imagem distinta de יצא, segundo a qual o resultado do sorteio 'saiu', sem confundi-la com o verbo anterior 'cair'.
- source_word: צָפוֹנָה
  choice: para o norte
  rationale: O ה direcional indica a direção atribuída e forma um paralelo claro com 'para o leste'.
