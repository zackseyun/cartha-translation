    issue: Construção administrativa pouco idiomática
    rationale: “Estavam encarregados da supervisão de Israel” repete de modo algo abstrato a ideia de encargo e supervisão. “Eram responsáveis pela supervisão de Israel” soa mais fluente sem alterar o alcance de פְּקֻדָּה.
  - severity: low
    issue: Preposição das atribuições finais
    rationale: O hebraico usa לְ tanto para “todo o trabalho de Yahweh” quanto para “o serviço do rei”. “Para todo o trabalho ... e para o serviço ...” preserva mais claramente a finalidade/área de responsabilidade do que “em ... e no ...”.
