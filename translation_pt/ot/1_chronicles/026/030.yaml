  text: לַֽ/חֶבְרוֹנִ֡י חֲשַׁבְיָהוּ֩ וְ/אֶחָ֨י/ו בְּנֵי חַ֜יִל אֶ֣לֶף וּ/שְׁבַע מֵא֗וֹת עַ֚ל פְּקֻדַּ֣ת יִשְׂרָאֵ֔ל מֵ/עֵ֥בֶר לַ/יַּרְדֵּ֖ן מַעְרָ֑בָ/ה לְ/כֹל֙ מְלֶ֣אכֶת יְהוָ֔ה וְ/לַ/עֲבֹדַ֖ת הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/030.yaml
  text: 'For the Hebronites: Hashabiah and his brothers[a], 1,700 capable men, were in charge of the oversight of Israel west of the Jordan, for all the work of the LORD and for the service of the king.'
translation:
  language: pt
  text: Quanto aos hebronitas, Hasabias e seus irmãos, 1.700 homens capazes, eram responsáveis pela supervisão de Israel a oeste do Jordão[a], para todo o trabalho de Yahweh e para o serviço do rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “além do Jordão, para o oeste”, isto é, no lado ocidental do Jordão.'
    reason: Preserva a formulação geográfica mais literal do hebraico e esclarece seu sentido contextual.
lexical_decisions:
- source_word: לַחֶבְרוֹנִי
  choice: Quanto aos hebronitas
  rationale: O gentílico no singular coletivo designa aqui o clã levítico dos hebronitas; a formulação introduz naturalmente este grupo na lista administrativa.
- source_word: חֲשַׁבְיָהוּ
  choice: Hasabias
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico, adequada à legibilidade moderna.
- source_word: וְאֶחָיו
  choice: e seus irmãos
  rationale: Mantém o termo familiar do hebraico, que neste contexto de clã também pode abranger parentes próximos.
- source_word: בְּנֵי חַיִל
  choice: homens capazes
  rationale: No contexto de responsabilidade administrativa, a expressão indica competência e aptidão, sem exigir sentido militar.
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת
  choice: '1.700'
  rationale: Emprega a notação numérica usual em português.
- source_word: עַל פְּקֻדַּת יִשְׂרָאֵל
  choice: estavam encarregados da supervisão de Israel
  rationale: Expressa a ideia de responsabilidade, encargo ou supervisão, preservando a amplitude administrativa de פְּקֻדָּה.
- source_word: מֵעֵבֶר לַיַּרְדֵּן מַעְרָבָה
  choice: a oeste do Jordão
  rationale: Equivalente idiomático claro da indicação geográfica literalmente expressa como 'além do Jordão, para o oeste'; a nota conserva a forma mais próxima do hebraico.
- source_word: לְכֹל מְלֶאכֶת יְהוָה
  choice: em todo o trabalho de Yahweh
  rationale: Mantém a amplitude de מְלָאכָה, que pode abranger trabalho, tarefa ou atividade ligada ao serviço divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: וְלַעֲבֹדַת הַמֶּלֶךְ
  choice: e no serviço do rei
  rationale: Preserva a distinção e o paralelismo entre as responsabilidades relativas a Yahweh e as relativas ao rei.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto contém diretamente o Tetragrama; a transliteração preserva seu caráter de nome próprio sem acrescentar uma interpretação denominacional.
- issue: Natureza das funções dos hebronitas
  choice: linguagem ampla de supervisão e trabalho
  alternative: administração civil ou serviço cúltico exclusivamente
  rationale: O hebraico não limita claramente as funções a uma categoria moderna ou exclusivamente religiosa; a tradução preserva essa abrangência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura administrativa do versículo foi mantida sem burocratização excessiva, e a nota registra a expressão geográfica literal.
