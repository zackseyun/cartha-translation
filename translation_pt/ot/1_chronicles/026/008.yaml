base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/008.yaml
  text: All these were from the sons of Obed-edom—they and their sons and their brothers, able men with strength for the service—sixty-two belonging to Obed-edom.
translation:
  language: pt
  text: Todos esses eram dos filhos de Obede-Edom. Eles, seus filhos e seus irmãos[a] eram homens capazes[b], com força para o serviço — sessenta e dois ao todo, pertencentes a Obede-Edom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus parentes”; o termo hebraico traduzido por “irmãos” também pode designar, em sentido mais amplo, parentes do sexo masculino no clã.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica traduzida por “homens capazes” também pode significar “homens valentes” ou “homens valorosos”; aqui, provavelmente destaca homens competentes e fortes, aptos para o serviço.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּנֵי עֹבֵד אֱדֹם
  choice: dos filhos de Obede-Edom
  rationale: O מן ligado a 'filhos' indica procedência ou pertencimento ao grupo familiar; 'dos filhos de' preserva naturalmente o sentido genealógico.
- source_word: הֵמָּה וּבְנֵיהֶם וַאֲחֵיהֶם
  choice: Eles, seus filhos e seus irmãos
  rationale: Mantém os três grupos enumerados e traduz אחים em seu sentido direto, sem eliminar a possibilidade contextual mais ampla registrada em nota.
- source_word: אִישׁ חַיִל
  choice: homens capazes
  rationale: Neste contexto de funções do templo, a expressão ressalta aptidão e competência, embora também possa denotar homens valentes ou valorosos.
- source_word: בַּכֹּחַ לַעֲבֹדָה
  choice: fortes para o serviço
  rationale: Expressa de modo idiomático tanto a força (כח) quanto a aptidão para a tarefa designada (עבודה), sem especificar além do hebraico.
- source_word: שִׁשִּׁים וּשְׁנַיִם לְעֹבֵד אֱדֹם
  choice: sessenta e dois ao todo, pertencentes a Obede-Edom
  rationale: O numeral é direto, e o לְ final indica associação com a casa ou linhagem de Obede-Edom; 'ao todo' torna clara a função resumitiva da frase.
