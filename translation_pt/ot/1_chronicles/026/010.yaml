  text: וּ/לְ/חֹסָ֥ה מִן בְּנֵי מְרָרִ֖י בָּנִ֑ים שִׁמְרִ֤י הָ/רֹאשׁ֙ כִּ֣י לֹא הָיָ֣ה בְכ֔וֹר וַ/יְשִׂימֵ֥/הוּ אָבִ֖י/הוּ לְ/רֹֽאשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/010.yaml
  text: 'And Hosah[a], from the sons of Merari, had sons: Shimri the chief, though he was not the firstborn; his father made him chief.'
translation:
  language: pt
  text: 'E Hosa[a], dos filhos de Merari, teve filhos: Sinri, o chefe, embora não fosse o primogênito; seu pai o constituiu chefe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois ele não era o primogênito”; a conjunção hebraica pode ser entendida tanto em sentido explicativo quanto concessivo.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וּלְחֹסָה
  choice: E Hosa
  rationale: A conjunção liga esta nota à lista anterior, enquanto a preposição com o nome introduz Hosa como aquele que teve os filhos mencionados. Em português, a formulação concisa e natural é “E Hosa”.
- source_word: מִן בְּנֵי מְרָרִי
  choice: dos filhos de Merari
  rationale: Preserva a identificação de Hosa como pertencente à descendência ou ao clã de Merari, sem substituir a expressão por um gentílico interpretativo.
- source_word: בָּנִים
  choice: teve filhos
  rationale: O hebraico traz apenas “filhos” numa construção nominal; “teve filhos” fornece a ligação verbal mínima exigida pelo português.
- source_word: שִׁמְרִי
  choice: Sinri
  rationale: Transliteração portuguesa corrente do nome hebraico, com “n” antes de “r” para representar naturalmente a consoante nasal em português.
- source_word: הָרֹאשׁ
  choice: o chefe
  rationale: רֹאשׁ indica aqui posição de liderança ou precedência no grupo familiar, não a parte do corpo. “Chefe” é claro e mantém a repetição lexical da cláusula final.
- source_word: כִּי לֹא הָיָה בְכוֹר
  choice: embora não fosse o primogênito
  rationale: A leitura concessiva explicita o contraste contextual entre não ser o primogênito e ocupar a chefia. Como כִּי também pode ser explicativo, a alternativa é preservada em nota.
- source_word: בְכוֹר
  choice: o primogênito
  rationale: Equivalente português normal para o termo de ordem de nascimento; o contexto já deixa claro que se trata de um filho.
- source_word: וַיְשִׂימֵהוּ אָבִיהוּ לְרֹאשׁ
  choice: seu pai o constituiu chefe
  rationale: O verbo שׂים com ל indica colocação ou designação para uma função. “Constituiu chefe” comunica a nomeação de modo digno e natural, preservando a correspondência com הָרֹאשׁ.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura genealógica concisa. A tradução conserva a repetição de “chefe” e registra em nota a ambiguidade da conjunção hebraica.
