base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/028.yaml
  text: And all that Samuel the seer[a], Saul son of Kish, Abner son of Ner[b], and Joab son of Zeruiah had dedicated—everything that anyone had dedicated—was under the care of Shelomith and his brothers.
translation:
  language: pt
  text: E tudo o que Samuel, o vidente[a], Saul, filho de Quis, Abner, filho de Ner, e Joabe, filho de Zeruia, haviam dedicado — tudo o que havia sido dedicado — estava sob a responsabilidade de Selomite e de seus irmãos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Vidente” é o título hebraico רֹאֶה, uma designação antiga para um profeta.
    reason: cultural_note
  - marker: b
    text: Ou “seus parentes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  choice: E tudo o que
  rationale: Expressa de modo natural o sentido abrangente de כֹּל e introduz os bens dedicados mencionados no contexto.
- source_word: הַהִקְדִּישׁ
  choice: haviam dedicado
  rationale: O hifil de קדשׁ indica destinar algo ao uso sagrado; “dedicado” preserva esse sentido sem tornar explícito um destinatário não mencionado no versículo.
- source_word: שְׁמוּאֵל הָרֹאֶה
  choice: Samuel, o vidente
  rationale: “Vidente” preserva o título hebraico específico רֹאֶה, em vez de harmonizá-lo com o termo mais amplo “profeta”.
- source_word: בֶּן
  choice: filho de
  rationale: Tradução direta da fórmula genealógica neste contexto.
- source_word: צְרוּיָה
  choice: Zeruia
  rationale: Forma portuguesa corrente do nome próprio hebraico.
- source_word: כֹּל הַמַּקְדִּישׁ
  choice: tudo o que qualquer pessoa havia dedicado
  rationale: Representa a construção coletiva e abrangente, incluindo os bens dedicados por qualquer pessoa, e evita uma repetição portuguesa pouco clara.
- source_word: עַל יַד
  choice: estava sob a responsabilidade de
  rationale: Neste contexto administrativo, a expressão idiomática indica encargo, custódia ou supervisão, não ação literal da mão.
- source_word: שְׁלֹמִית
  choice: Selomite
  rationale: Transliteração portuguesa corrente do nome próprio.
- source_word: וְאֶחָיו
  choice: e de seus irmãos
  rationale: É o sentido mais direto de אחים com o sufixo masculino singular, embora o termo também possa abranger parentes próximos.
