base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/031.yaml
  text: For the Hebronites[a], Jeriah was the chief of the Hebronites according to his generations by fathers’ houses. In the fortieth year of David’s reign they were sought out[c][b], and among them mighty men of valor were found at Jazer of Gilead.
translation:
  language: pt
  text: Quanto aos hebronitas[a], Jerias era o chefe dos hebronitas, conforme suas gerações e casas paternas.[b] No quadragésimo ano do reinado de Davi, foram feitas averiguações a respeito deles, e entre eles foram encontrados homens valentes[c] em Jazer de Gileade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Dos hebronitas”.'
    reason: lexical_alternative
  - marker: b
    text: “Casas paternas” eram agrupamentos de parentesco definidos pela descendência ancestral, não apenas famílias nucleares.
    reason: cultural_note
  - marker: c
    text: 'Ou: “guerreiros valentes” ou “homens de grande capacidade”; a expressão hebraica pode indicar força, bravura ou competência comprovada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַחֶבְרוֹנִי
  choice: Quanto aos hebronitas
  rationale: O לְ prefixado introduz aqui o grupo como tópico. “Quanto aos” reproduz essa função discursiva de modo natural em português.
- source_word: יְרִיָּה
  choice: Jerias
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio hebraico.
- source_word: הָרֹאשׁ
  choice: era o chefe
  rationale: No contexto genealógico e administrativo, רֹאשׁ designa o principal representante ou líder do grupo.
- source_word: לְתֹלְדֹתָיו לְאָבוֹת
  choice: segundo suas linhagens, por casas paternas
  rationale: “Linhagens” expressa as linhas de descendência de תֹּלְדוֹת, enquanto “casas paternas” preserva o termo técnico de organização ancestral sem reduzi-lo à família nuclear.
- source_word: בִּשְׁנַת הָאַרְבָּעִים לְמַלְכוּת דָּוִיד
  choice: No quadragésimo ano do reinado de Davi
  rationale: Tradução direta e idiomática da fórmula de datação régia.
- source_word: נִדְרָשׁוּ
  choice: foram feitas averiguações a respeito deles
  rationale: O nifal de דרש indica uma busca ou investigação deliberada. A formulação evita a conotação criminal de “foram investigados” e preserva o sentido administrativo do contexto.
- source_word: וַיִּמָּצֵא בָהֶם
  choice: e entre eles foram encontrados
  rationale: A construção hebraica, embora use verbo morfologicamente singular, tem sentido existencial ou passivo, com o grupo plural seguinte como conteúdo encontrado.
- source_word: גִּבּוֹרֵי חַיִל
  choice: homens valentes e capazes
  rationale: A expressão pode abranger força, valor militar e competência comprovada. A tradução mantém essa amplitude sem restringi-la apenas a guerreiros.
- source_word: בְּיַעְזֵיר גִּלְעָד
  choice: em Jazer de Gileade
  rationale: Forma portuguesa clara para a localização geográfica, entendendo Gileade como identificação regional de Jazer.
