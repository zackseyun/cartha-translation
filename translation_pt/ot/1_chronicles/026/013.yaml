lexical_decisions:
- source_word: וַיַּפִּילוּ גוֹרָלוֹת
  choice: lançaram sortes
  rationale: Expressão portuguesa corrente que corresponde ao idioma hebraico com o hifil de נפל e גוֹרָלוֹת, indicando o uso de sortes para determinar as atribuições.
- source_word: כַּקָּטֹן כַּגָּדוֹל
  choice: tanto os pequenos como os grandes
  rationale: Preserva o contraste idiomático hebraico e comunica participação sem distinção de posição, sem restringir indevidamente o sentido a idade.
- source_word: לְבֵית אֲבוֹתָם
  choice: segundo as suas casas paternas
  rationale: Mantém a referência às divisões familiares ou clânicas organizadas pela linhagem paterna; 'segundo' expressa adequadamente a distribuição conforme essas casas.
- source_word: לְשַׁעַר וָשָׁעַר
  choice: para cada porta
  rationale: A repetição do substantivo singular tem força distributiva; 'cada porta' transmite isso de modo natural em português.
