base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/001.yaml
  text: 'For the divisions of the gatekeepers: of the Korahites[a], Meshelemiah son of Kore, from the sons of Asaph.'
translation:
  language: pt
  text: 'Quanto às divisões dos porteiros[a]: dos coraítas, Meselemias, filho de Coré, dos filhos de Asafe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Segundo as divisões dos porteiros”. A frase inicial funciona como título da seção que apresenta as divisões dos porteiros.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַחְלְקוֹת לְשֹׁעֲרִים
  choice: Quanto às divisões dos porteiros
  rationale: A sequência introduz o assunto da seção. “Quanto às” funciona naturalmente como fórmula de tópico, enquanto “divisões” conserva o sentido de grupos organizados ou turnos de serviço.
- source_word: לַקָּרְחִים
  choice: dos coraítas
  rationale: Identifica o clã dos descendentes de Corá entre os porteiros; a forma gentílica “coraítas” é clara e tradicional em português.
- source_word: מְשֶׁלֶמְיָהוּ
  choice: Meselemias
  rationale: Transliteração portuguesa corrente do nome próprio hebraico nesta passagem.
- source_word: בֶן קֹרֵא
  choice: filho de Coré
  rationale: בֶן indica aqui uma relação genealógica direta, e “Coré” é a forma portuguesa convencional do nome.
- source_word: מִן בְּנֵי אָסָף
  choice: dos filhos de Asafe
  rationale: Preserva de modo conciso a ideia de pertencimento ou procedência dentro da linhagem de Asafe, sem identificar esse Asafe além do que o texto afirma.
