  text: וְֽ/הַ/לְוִיִּ֑ם אֲחִיָּ֗ה עַל אֽוֹצְרוֹת֙ בֵּ֣ית הָ/אֱלֹהִ֔ים וּ/לְ/אֹֽצְר֖וֹת הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/020.yaml
  text: And of the Levites[b][a], Ahijah was over the treasuries of the house of God and the treasuries of the holy things.
translation:
  language: pt
  text: Quanto aos levitas,[a] Aías estava encarregado dos tesouros da casa de Deus e dos tesouros das coisas sagradas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E os levitas: Aías estava encarregado...”. O início hebraico é um tanto elíptico e pode funcionar como uma transição semelhante a um título.'
    reason: alternative_reading
  - marker: b
    text: “Coisas sagradas” também pode ser traduzido por “coisas dedicadas” ou “coisas consagradas”; refere-se a bens separados para uso sagrado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: Quanto aos levitas
  rationale: A conjunção seguida do substantivo definido funciona provavelmente como transição de tópico. A formulação mantém a construção um tanto elíptica do hebraico e introduz com clareza a responsabilidade levítica mencionada em seguida.
- source_word: אֲחִיָּה
  choice: Aías
  rationale: Forma tradicional e amplamente reconhecível em português para a transliteração do nome hebraico.
- source_word: עַל
  choice: estava encarregado de
  rationale: Neste contexto administrativo, a preposição indica autoridade ou supervisão. A expressão é natural em português e comunica essa responsabilidade sem especificar além do texto.
- source_word: אֹצְרוֹת
  choice: tesouros
  rationale: O termo pode designar depósitos, tesourarias ou os bens neles guardados. No contexto da casa de Deus, “tesouros” preserva essa amplitude sem impor uma identificação arquitetônica.
- source_word: בֵּית הָאֱלֹהִים
  choice: casa de Deus
  rationale: Tradução direta da expressão hebraica, que neste contexto se refere ao santuário e suas dependências.
- source_word: וּלְאֹצְרוֹת
  choice: e dos tesouros
  rationale: A preposição liga o segundo grupo de tesouros à mesma função de supervisão expressa anteriormente; não é necessário repetir “encarregado” em português.
- source_word: הַקֳּדָשִׁים
  choice: as coisas sagradas
  rationale: O plural substantivado designa coisas separadas para uso sagrado. A escolha é direta e mantém aberta a possibilidade de serem objetos, ofertas ou outros bens consagrados.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura corrente, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. A transição inicial preserva a elipse do hebraico sem soar truncada, e “casa de Deus” mantém a imagem concreta do texto-fonte.
