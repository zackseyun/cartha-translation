  yaml_path: translation/ot/1_chronicles/026/029.yaml
  text: For the Izharites[a], Chenaniah and his sons were assigned to the outside work over Israel, as officers and judges.
translation:
  language: pt
  text: Quanto aos izaritas, Quenanias e seus filhos foram designados para o trabalho externo[a] sobre Israel, como oficiais e juízes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, tarefas fora do serviço central do santuário, provavelmente responsabilidades administrativas e judiciais entre o povo de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיִּצְהָרִי
  choice: Quanto aos isaritas
  rationale: A preposição לְ com o nome do clã introduz uma categoria na lista. “Quanto aos” expressa isso naturalmente em português, e “isaritas” translitera o nome da família.
- source_word: כְּנַנְיָהוּ
  choice: Quenanias
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico, sem traduzir seu significado.
- source_word: וּבָנָיו
  choice: e seus filhos
  rationale: בָּנִים está no masculino plural e, neste contexto genealógico e familiar, refere-se aos filhos homens.
- source_word: לַמְּלָאכָה הַחִיצוֹנָה
  choice: foram designados para o trabalho externo
  rationale: מְלָאכָה indica trabalho ou tarefa, e חִיצוֹנָה significa externo ou de fora. A formulação verbal explicita de modo natural a incumbência subentendida na lista, sem definir excessivamente a natureza da função.
- source_word: עַל יִשְׂרָאֵל
  choice: em Israel
  rationale: Neste contexto administrativo, עַל pode indicar âmbito de responsabilidade ou supervisão. “Em Israel” é idiomático em português e evita a impressão de domínio político total, enquanto “oficiais e juízes” esclarece a função exercida.
- source_word: לְשֹׁטְרִים
  choice: como oficiais
  rationale: שֹׁטְרִים designa responsáveis administrativos, não policiais no sentido moderno. “Oficiais” mantém o caráter institucional do cargo.
- source_word: וּלְשֹׁפְטִים
  choice: e juízes
  rationale: O termo designa pessoas que exerciam função judicial; “juízes” é a tradução direta e transparente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas onomásticas reconhecíveis no uso bíblico lusófono. A expressão “trabalho externo” preserva a concisão e a relativa ambiguidade do hebraico; a nota explica o provável contraste com o serviço interno do santuário sem torná-lo parte explícita do texto.
