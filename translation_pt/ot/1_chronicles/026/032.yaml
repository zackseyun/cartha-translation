base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/032.yaml
  text: And his brothers[a], valiant men, were two thousand seven hundred heads of fathers’ houses; and King David appointed them over the Reubenites, the Gadites, and the half-tribe of Manasseh for every matter of God and of the king.
translation:
  language: pt
  text: E seus irmãos, homens valentes, eram dois mil e setecentos chefes de famílias. O rei Davi os encarregou dos rubenitas, dos gaditas e da meia tribo de Manassés, para todos os assuntos de Deus e do rei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶחָיו
  choice: E seus irmãos
  rationale: Traduz diretamente o plural masculino de אָח com sufixo, que retoma Hasabias no versículo anterior; no contexto do clã, pode abranger parentes próximos, mas não há necessidade de ampliar isso no texto.
- source_word: בְּנֵי חַיִל
  choice: homens valentes
  rationale: Preserva a força idiomática da expressão, que pode indicar valor, força e competência, sem reduzi-la apenas à aptidão administrativa.
- source_word: אַלְפַּיִם וּשְׁבַע מֵאוֹת
  choice: dois mil e setecentos
  rationale: Correspondência direta ao numeral hebraico.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: chefes de famílias ancestrais
  rationale: Expressa de modo natural em português a unidade genealógica e administrativa designada literalmente pelos 'pais', evitando a formulação pouco idiomática 'casas dos pais'.
- source_word: וַיַּפְקִידֵם
  choice: os encarregou
  rationale: O hifil de פקד indica que Davi lhes atribuiu responsabilidade ou supervisão oficial; 'encarregou' transmite esse sentido no contexto.
- source_word: עַל
  choice: dos
  rationale: Com 'encarregou', a preposição portuguesa 'de' expressa naturalmente a responsabilidade sobre os grupos mencionados.
- source_word: הָראוּבֵנִי וְהַגָּדִי וַחֲצִי שֵׁבֶט הַמְנַשִּׁי
  choice: os rubenitas, os gaditas e a meia tribo de Manassés
  rationale: Os gentílicos singulares hebraicos têm sentido coletivo e são vertidos naturalmente no plural; 'meia tribo' conserva a designação tradicional e precisa.
- source_word: לְכָל דְּבַר הָאֱלֹהִים וּדְבַר הַמֶּלֶךְ
  choice: para todos os assuntos de Deus e do rei
  rationale: דבר pode significar assunto, questão ou negócio. 'Assuntos' conserva a generalidade e a ambiguidade do hebraico, enquanto a elipse em 'e do rei' reproduz naturalmente o paralelismo.
theological_decisions:
- issue: Âmbito da responsabilidade administrativa quanto a Deus e ao rei
  choice: A responsabilidade abrangia todos os assuntos de Deus e do rei, mantendo as duas esferas em paralelo.
  alternative: Traduzir como 'todo o serviço de Deus e os negócios do rei', explicitando funções religiosas e civis.
  rationale: O hebraico distingue os referentes divino e régio, mas não define com precisão a natureza das tarefas nem estabelece uma hierarquia teológica entre elas; a tradução evita importar categorias posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o tom administrativo-genealógico de Crônicas sem literalismos pouco naturais.
