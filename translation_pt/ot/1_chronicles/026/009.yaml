base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/009.yaml
  text: And Shelemiah had sons and brothers[a], valiant men[b], eighteen.
translation:
  language: pt
  text: Quanto a Meselemias[a], seus filhos e irmãos, homens valentes[b], eram dezoito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “para Meselemias”; construção hebraica que introduz a pessoa cujos familiares estão sendo contados.
    reason: lexical_alternative
  - marker: b
    text: Ou “homens de valor” ou “homens capazes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/מְשֶֽׁלֶמְיָ֗הוּ
  choice: Quanto a Meselemias
  rationale: A conjunção seguida da preposição לְ introduz a pessoa cuja casa está sendo contada. “Quanto a Meselemias” reproduz naturalmente essa função discursiva em português.
- source_word: בָּנִים
  choice: filhos
  rationale: O substantivo hebraico indica especificamente descendentes do sexo masculino neste contexto.
- source_word: וְ/אַחִים
  choice: e irmãos
  rationale: “Irmãos” é o sentido normal de אַחִים; não há necessidade contextual de ampliá-lo para “parentes”.
- source_word: בְּנֵי חָיִל
  choice: homens valentes
  rationale: A expressão idiomática, literalmente “filhos de força/valor”, descreve homens fortes, capazes ou valorosos. “Homens valentes” conserva o teor elogioso e é corrente em português.
- source_word: שְׁמוֹנָה עָשָׂר
  choice: dezoito
  rationale: Tradução direta do numeral cardinal, mantido no fim para refletir a ordem e a estrutura enumerativa do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação “Quanto a” torna natural a construção enumerativa hebraica; “eram” explicita a relação da contagem exigida pela sintaxe portuguesa sem alterar o sentido. A posição final de “dezoito” preserva, na medida do possível, a disposição do original.
