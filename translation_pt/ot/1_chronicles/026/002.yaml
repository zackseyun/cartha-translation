base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/002.yaml
  text: 'And Shelemiah had sons: Zechariah the firstborn[a], Jediael the second, Zebadiah the third[b], and Jathniel the fourth.'
translation:
  language: pt
  text: Meselemias teve estes filhos:[a] Zacarias, o primogênito; Jediael, o segundo; Zebadias, o terceiro; e Jatniel,[b] o quarto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “e para Meselemias, filhos”, construção genealógica com o sentido de “Meselemias teve filhos”.'
    reason: cultural_note
  - marker: b
    text: Ou “Iatniel”, representando de modo mais direto a consoante inicial do nome hebraico.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִמְשֶׁלֶמְיָהוּ בָּנִים
  choice: Meselemias teve estes filhos
  rationale: A construção hebraica nominal diz literalmente «e para Meselemias, filhos». Em português natural, ela expressa posse e é bem representada por «Meselemias teve estes filhos». O demonstrativo introduz com clareza a lista que vem a seguir.
- source_word: מְשֶׁלֶמְיָהוּ
  choice: Meselemias
  rationale: Forma tradicional e reconhecível do nome hebraico em português bíblico.
- source_word: זְכַרְיָהוּ הַבְּכוֹר
  choice: Zacarias, o primogênito
  rationale: «Zacarias» é a forma portuguesa estabelecida do nome; בְּכוֹר designa especificamente o filho primogênito, e não apenas o mais velho em sentido genérico.
- source_word: יְדִיעֲאֵל הַשֵּׁנִי
  choice: Jediael, o segundo
  rationale: O nome é transliterado segundo o uso bíblico português, e o ordinal é traduzido diretamente.
- source_word: זְבַדְיָהוּ הַשְּׁלִישִׁי
  choice: Zebadias, o terceiro
  rationale: «Zebadias» é uma forma portuguesa tradicional do nome, seguida da tradução direta do ordinal.
- source_word: יַתְנִיאֵל הָרְבִיעִי
  choice: Jatniel, o quarto
  rationale: «Jatniel» segue a convenção portuguesa tradicional de representar o yod inicial de nomes bíblicos por J; o ordinal é traduzido diretamente.
