base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/026.yaml
  text: Shelomoth and his brothers were over all the treasuries of the holy things that King David[a], the heads of the fathers’ houses, the commanders of thousands and of hundreds[b], and the commanders of the army had dedicated.
translation:
  language: pt
  text: Selomite e seus irmãos estavam encarregados de todas as tesourarias das coisas consagradas[a], que o rei Davi, os chefes das famílias[b], os comandantes de milhares e de centenas e os comandantes do exército haviam consagrado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “das coisas sagradas” ou “das ofertas dedicadas”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “chefes das casas paternas”, termo administrativo baseado em grupos familiares ancestrais.'
    reason: cultural_note
lexical_decisions:
- source_word: הוּא שְׁלֹמוֹת וְאֶחָיו עַל
  choice: Selomote e seus irmãos estavam encarregados de
  rationale: A construção hebraica começa literalmente com o pronome singular “ele”, retomando Selomote, e acrescenta seus irmãos. O plural em português expressa naturalmente o sujeito composto, enquanto “encarregados de” comunica o sentido administrativo de עַל.
- source_word: שְׁלֹמוֹת
  choice: Selomote
  rationale: Emprega-se a forma portuguesa tradicional e reconhecível do nome próprio hebraico.
- source_word: כָּל אֹצְרוֹת הַקֳּדָשִׁים
  choice: todos os tesouros das coisas sagradas
  rationale: אֹצָר pode indicar tanto o local de armazenamento quanto o patrimônio guardado; “tesouros” preserva essa amplitude. הַקֳּדָשִׁים designa objetos ou ofertas separados para uso sagrado.
- source_word: אֲשֶׁר הִקְדִּישׁ
  choice: que haviam sido consagradas por
  rationale: O hifil de קדשׁ significa dedicar ou consagrar. A construção passiva permite uma enumeração clara dos vários agentes em português e mantém a ligação com “coisas sagradas”.
- source_word: דָּוִיד הַמֶּלֶךְ
  choice: o rei Davi
  rationale: A ordem título-nome é idiomática em português e corresponde ao sentido do hebraico.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: os chefes das famílias paternas
  rationale: A expressão é um termo administrativo baseado no parentesco. “Famílias paternas” é compreensível e preserva o componente ancestral do hebraico sem recorrer ao literalismo obscuro “cabeças dos pais”.
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: os comandantes de milhares e de centenas
  rationale: שָׂרִים designa oficiais ou comandantes, e “milhares” e “centenas” são as unidades organizacionais explicitamente mencionadas no texto.
- source_word: שָׂרֵי הַצָּבָא
  choice: os comandantes do exército
  rationale: Neste contexto, צָבָא se refere à força militar, e não a um exército celestial.
theological_decisions:
- issue: Alcance dos agentes que consagraram as coisas sagradas
  choice: A consagração é atribuída conjuntamente ao rei Davi, aos chefes das famílias paternas, aos comandantes de milhares e de centenas e aos comandantes do exército.
  alternative: Entender apenas Davi como agente da consagração e relacionar os demais grupos de outra maneira sintática.
  rationale: A sequência coordenada é mais naturalmente entendida como uma lista de agentes. A formulação passiva com “por” repetido torna essa leitura clara, sem acrescentar distinções teológicas ausentes do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva a terminologia administrativa e militar do texto, mas evita construções excessivamente literais. Os marcadores foram posicionados junto às expressões que efetivamente explicam.
