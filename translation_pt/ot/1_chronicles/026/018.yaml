    reason: lexical_alternative
lexical_decisions:
- source_word: פַּרְבָּר
  choice: Parbar
  rationale: O termo hebraico é raro e sua referência arquitetônica exata é incerta. A transliteração evita impor uma identificação específica, como “colunata”, “pátio” ou “anexo”.
- source_word: מַעֲרָב
  choice: lado oeste
  rationale: Indica a direção ou o lado ocidental; “no lado oeste” é claro e natural neste contexto de distribuição de postos.
- source_word: אַרְבָּעָה
  choice: quatro
  rationale: Número cardinal que indica quantos porteiros ou postos foram designados nesse local.
- source_word: מְסִלָּה
  choice: estrada elevada
  rationale: O substantivo pode designar uma estrada, via de acesso ou calçada elevada. “Estrada elevada” conserva sua possível nuance estrutural sem excluir o sentido geral de via.
- source_word: שְׁנַיִם
  choice: dois
  rationale: Número cardinal que indica a segunda quantidade da distribuição.
- source_word: לְ
  choice: quanto a / junto a
  rationale: A preposição repetida marca os locais de atribuição. As formas escolhidas expressam idiomaticamente em português a introdução do setor e a posição dos postos.
