  text: 'For the Parbar on the west: four at the road[b][a], and two at the Parbar.'
translation:
  language: pt
  text: 'Quanto ao Parbar[a], a oeste: quatro na estrada[b] e dois no Parbar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “recinto”, “pátio”, “anexo” ou, tradicionalmente, “subúrbio”. O termo hebraico Parbar é raro, e sua referência arquitetônica exata é incerta.
