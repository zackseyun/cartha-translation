base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/012.yaml
  text: For these divisions of the gatekeepers[a], the chief men had assigned duties corresponding to those of their brothers, to minister in the house of Yahweh.
translation:
  language: pt
  text: Para essas divisões dos porteiros[a], os homens principais tinham turnos de serviço correspondentes aos de seus irmãos, para servirem na casa de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os homens principais tinham turnos de serviço junto com seus irmãos”. O hebraico é compacto, e מִשְׁמָרוֹת também pode significar “turnos”, “guardas” ou “encargos de serviço”.'
    reason: alternativa lexical e sintática
lexical_decisions:
- source_word: לְאֵלֶּה מַחְלְקוֹת
  choice: Para essas divisões
  rationale: Mantém a construção introdutória com לְ e o sentido administrativo de מַחְלְקוֹת, sem transformá-la numa oração nominal mais explícita do que o hebraico.
- source_word: הַשֹּׁעֲרִים
  choice: dos porteiros
  rationale: No contexto do templo, designa os responsáveis por guardar e administrar as portas; 'porteiros' é natural e claro em português.
- source_word: לְרָאשֵׁי הַגְּבָרִים
  choice: os homens principais
  rationale: Preserva tanto a ideia de liderança em רָאשֵׁי quanto a referência masculina de גְּבָרִים, sem lhe atribuir sentido militar.
- source_word: מִשְׁמָרוֹת
  choice: tinham deveres designados
  rationale: O substantivo pode indicar turnos, guardas ou encargos de serviço. A formulação verbal torna inteligível a elipse hebraica, sem especificar quem fez a designação.
- source_word: לְעֻמַּת אֲחֵיהֶם
  choice: em correspondência com os de seus irmãos
  rationale: Expressa a relação paralela ou correspondente indicada por לְעֻמַּת e conserva literalmente a referência a 'irmãos'.
- source_word: לְשָׁרֵת
  choice: para servir
  rationale: '''Servir'' é natural em português e, neste contexto, comunica o serviço sagrado sem exigir o termo potencialmente eclesiástico ''ministrar''.'
- source_word: בְּבֵית יְהוָה
  choice: na casa de Yahweh
  rationale: Preserva a expressão hebraica 'casa de Yahweh' e translitera o nome divino pessoal.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; 'Yahweh' representa diretamente o nome pessoal, em vez de substituí-lo por um título.
- issue: Referência masculina em גְּבָרִים
  choice: homens
  alternative: pessoas; líderes
  rationale: A forma hebraica é masculina e, no cenário histórico, refere-se aos homens encarregados do serviço do templo.
- issue: Natureza do serviço em לְשָׁרֵת
  choice: servir
  alternative: ministrar
  rationale: O contexto deixa claro que se trata de serviço no santuário; 'servir' evita acrescentar conotações eclesiásticas posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe ligeiramente formal conserva a concisão administrativa do hebraico; a nota registra sua ambiguidade sem sobrecarregar o texto principal.
