base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/024.yaml
  text: And Shebuel son of Gershom[a], son of Moses[b], was chief over the treasuries.
translation:
  language: pt
  text: E Sebuel, filho de Gérson, filho de Moisés, era o chefe[a] dos tesouros[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dirigente”, “supervisor” ou “príncipe”. O termo hebraico indica alguém colocado em posição de autoridade.
    reason: lexical_alternative
  - marker: b
    text: Ou “tesourarias” ou “depósitos”. O termo pode referir-se aos bens valiosos ou aos lugares onde eram guardados, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁבֻאֵל
  choice: E Sebuel
  rationale: A conjunção ו mantém a ligação com a lista administrativa precedente; o nome próprio segue a forma portuguesa tradicional.
- source_word: בֶּן גֵּרְשׁוֹם בֶּן מֹשֶׁה
  choice: filho de Gérson, filho de Moisés
  rationale: בֶּן indica aqui a relação genealógica direta e é repetido para preservar claramente a cadeia de filiação.
- source_word: נָגִיד
  choice: chefe
  rationale: No contexto administrativo, designa alguém posto em posição de autoridade. “Chefe” comunica essa função sem sugerir necessariamente realeza.
- source_word: עַל
  choice: dos
  rationale: Na construção portuguesa “chefe dos tesouros”, a preposição expressa de modo natural a autoridade ou supervisão indicada por עַל.
- source_word: הָאֹצָרוֹת
  choice: os tesouros
  rationale: O termo pode designar tanto os bens valiosos guardados quanto os locais em que eram armazenados. “Tesouros” é natural no contexto dos bens sagrados sob supervisão, enquanto a nota preserva a amplitude lexical.
