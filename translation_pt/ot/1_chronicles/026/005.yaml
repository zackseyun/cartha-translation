base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/005.yaml
  text: Ammiel the sixth[a], Issachar the seventh, Peullethai the eighth; for God had blessed him.
translation:
  language: pt
  text: Amiel, o sexto; Issacar, o sétimo; Peuletai, o oitavo, pois Deus o abençoou.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porque Deus o tinha abençoado”.'
    reason: Alternativa legítima para a conjunção כִּי e para a relação temporal implícita do perfeito hebraico.
lexical_decisions:
- source_word: עַמִּיאֵל
  choice: Amiel
  rationale: Nome próprio vertido segundo a forma tradicional e natural em português.
- source_word: הַשִּׁשִּׁי
  choice: o sexto
  rationale: Ordinal definido que dá continuidade à ordem dos filhos.
- source_word: יִשָׂשכָר
  choice: Issacar
  rationale: Forma tradicional portuguesa do nome próprio; neste contexto, designa uma pessoa, não a tribo.
- source_word: הַשְּׁבִיעִי
  choice: o sétimo
  rationale: Ordinal definido, paralelo aos demais itens da lista.
- source_word: פְּעֻלְּתַי
  choice: Peuletai
  rationale: Transliteração portuguesa que representa de modo legível a vocalização hebraica do nome.
- source_word: הַשְּׁמִינִי
  choice: o oitavo
  rationale: Ordinal definido que completa a sequência.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente em português a explicação para o número de filhos enumerados.
- source_word: בֵרֲכוֹ
  choice: o abençoou
  rationale: Traduz diretamente o perfeito hebraico e o sufixo masculino singular, sem impor uma relação temporal de mais-que-perfeito.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Designação comum de Deus, com sentido singular exigido pelo contexto.
theological_decisions:
- issue: Referente do pronome em “o abençoou”
  choice: Mantém-se o pronome masculino singular, cujo referente contextual mais natural é Obede-Edom.
  alternative: Entender a bênção de modo mais amplo como dirigida à sua casa ou linhagem.
  rationale: O texto hebraico traz apenas um sufixo masculino singular. O contexto de 1Cr 26:4–8 favorece Obede-Edom, mas a tradução não substitui o pronome pelo nome nem explicita além do original.
translation_notes:
  register: Português moderno, claro e digno, com formas tradicionais de nomes bíblicos quando consolidadas. A pontuação evidencia a estrutura da lista; a oração explicativa preserva o pronome e a concisão do hebraico.
