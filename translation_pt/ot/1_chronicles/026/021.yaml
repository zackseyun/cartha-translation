base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/021.yaml
  text: 'The sons of Ladan[b][a], the sons of the Gershonite belonging to Ladan: the heads of the fathers’ houses belonging to Ladan the Gershonite were Jehieli.'
translation:
  language: pt
  text: 'Os filhos de Ladã, dos gersonitas, pertencentes a Ladã; os chefes das casas paternas de Ladã, o gersonita: Jeieli.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: filhos / descendentes
  rationale: A primeira ocorrência mantém a forma genealógica tradicional “filhos”; a segunda é traduzida como “descendentes” para expressar com naturalidade a linhagem indicada no contexto.
- source_word: לַעְדָּן
  choice: Ladã
  rationale: Transliteração portuguesa corrente do nome hebraico, com terminação nasal marcada por til.
- source_word: הַגֵּרְשֻׁנִּי
  choice: o gersonita
  rationale: O gentílico identifica a afiliação ao clã de Gérson; “gersonita” é conciso e tradicional em português bíblico.
- source_word: לְלַעְדָּן
  choice: ligados a Ladã / de Ladã
  rationale: A preposição לְ marca aqui relação ou classificação genealógica, não movimento. A variação evita uma sequência pesada de expressões idênticas sem apagar a relação de pertencimento.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: chefes das casas paternas
  rationale: Preserva a imagem hebraica das unidades familiares ancestrais e esclarece que רָאשֵׁי designa seus líderes.
- source_word: יְחִיאֵלִי
  choice: os jeielitas
  rationale: A forma pode funcionar como designação patronímica ou clânica. O plural “os jeielitas” concorda com “chefes” e torna inteligível a sintaxe comprimida, enquanto a nota conserva a possibilidade de lê-la como o nome próprio “Jeieli”.
