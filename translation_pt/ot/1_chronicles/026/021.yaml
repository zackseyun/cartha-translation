- from: 'Os filhos de Ladã[a], descendentes do gersonita ligados a Ladã: os chefes das casas paternas[b] de Ladã, o gersonita, eram os jeielitas.[c]'
  to: 'Os filhos de Ladã, dos gersonitas, pertencentes a Ladã; os chefes das casas paternas de Ladã, o gersonita: Jeieli.'
