review_pass:
  verdict: revise
  source_fidelity: A tradução capta a moldura genealógica e a expressão «casas paternas», mas «os jeielitas» transforma a forma hebraica singular יְחִיאֵלִי em um gentílico plural. No contexto, a forma funciona como o nome próprio Jeieli, que introduz a casa/família tratada nos versículos seguintes. Além disso, «descendentes do gersonita» é uma reestruturação pouco precisa e pouco natural para a repetição hebraica de «filhos».
  naturalness: A redação atual é compreensível, mas «descendentes do gersonita ligados a Ladã» e «eram os jeielitas» soam artificialmente analíticos em português. Uma construção de tópico seguida de dois-pontos reproduz com clareza a sintaxe genealógica condensada, sem atribuir um plural não expresso ao nome final.
  terminology: «Ladã», «gersonita», «chefes» e «casas paternas» são escolhas adequadas. «Jeieli» deve ser mantido como nome próprio, sem nota que proponha uma leitura clânica plural como se fosse alternativa equivalente neste versículo.
  issues:
  - severity: high
    issue: «os jeielitas» traduz יְחִיאֵלִי como designação plural de grupo.
    rationale: O hebraico apresenta a forma singular Jeieli; o plural português altera a forma e obscurece a função do nome como cabeçalho genealógico para o desenvolvimento subsequente.
  - severity: medium
    issue: A expressão «descendentes do gersonita ligados a Ladã» não preserva bem a formulação genealógica repetida nem é idiomática.
    rationale: A fonte repete «filhos» e associa Ladã à linhagem gersonita. «Filhos de Ladã, dos gersonitas» mantém a concisão e evita tratar «o gersonita» como um ancestral individual indefinido.
  - severity: low
    issue: A nota c introduz uma ambiguidade inadequada e sustenta a alteração plural do texto.
    rationale: A nota sugere uma designação de membros da família de Jeiel, mas o texto hebraico aqui não exige essa conversão para plural; a identificação como Jeieli é a leitura segura.
  revised_text: 'Os filhos de Ladã, dos gersonitas, pertencentes a Ladã; os chefes das casas paternas de Ladã, o gersonita: Jeieli.'
  revised_footnotes:
