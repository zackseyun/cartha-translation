    reason: cultural_note
  revision_rationale: A revisão conserva a repetição genealógica e as relações de pertencimento expressas no hebraico, melhora a fluidez em português e restitui «Jeieli» como nome próprio singular. Os dois-pontos refletem a função de cabeçalho genealógico da frase final. A nota c foi removida porque a leitura plural «jeielitas» não é uma tradução segura da forma hebraica neste contexto.
