base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/015.yaml
  text: To Obed-edom[a], the south; and to his sons, the house of stores.
translation:
  language: pt
  text: A Obede-Edom coube o lado sul; e a seus filhos, a casa dos depósitos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a casa dos armazéns” ou “a casa das coleções”. O termo hebraico se refere a uma área de armazenamento ou a depósitos.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֹבֵד אֱדֹם
  choice: A Obede-Edom coube
  rationale: O לְ marca a atribuição por sorteio no contexto. A formulação com “coube” torna essa relação clara e natural em português.
- source_word: נֶגְבָּה
  choice: o lado sul
  rationale: A forma direcional indica o setor meridional atribuído a Obede-Edom; “o lado sul” é claro no contexto das entradas.
- source_word: וּלְבָנָיו
  choice: e a seus filhos
  rationale: Mantém os filhos de Obede-Edom como destinatários de outra atribuição e preserva o sentido masculino de בָּנִים.
- source_word: בֵּית
  choice: a casa
  rationale: Preserva o valor arquitetônico e a construção nominal hebraica sem tornar a expressão excessivamente técnica.
- source_word: הָאֲסֻפִּים
  choice: dos depósitos
  rationale: Derivado da ideia de reunir, o termo designa locais ou compartimentos destinados ao armazenamento. “Depósitos” produz uma expressão natural em português e evita duplicar “casa” com “armazéns”.
