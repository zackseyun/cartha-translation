base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/007.yaml
  text: 'The sons of Shemaiah: Othni[a], Rephael, Obed, Elzabad, whose brothers were capable men, Elihu and Semakiah.'
translation:
  language: pt
  text: 'Os filhos de Semaías: Otni, Refael, Obede e Elzabade, cujos irmãos, Eliú e Semaquias, eram homens capazes.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “homens valentes” ou “homens aptos”. A expressão hebraica pode indicar força, valentia ou competência; aqui, provavelmente ressalta a capacidade para o serviço.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי שְׁמַעְיָה
  choice: Os filhos de Semaías
  rationale: Mantém a relação filial expressa pela cadeia construta e o estilo formal de uma lista genealógica.
- source_word: עָתְנִי וּרְפָאֵל וְעוֹבֵד אֶלְזָבָד
  choice: Otni, Refael, Obede e Elzabade
  rationale: Translitera os nomes segundo formas claras e correntes em português, com adaptações fonológicas e ortográficas naturais.
- source_word: אֶחָיו
  choice: cujos irmãos
  rationale: Preserva o sufixo hebraico de terceira pessoa masculina singular e o liga naturalmente a Elzabade, o antecedente mais próximo.
- source_word: בְּנֵי חָיִל
  choice: homens capazes
  rationale: Neste contexto de serviço como porteiros, a expressão provavelmente destaca aptidão e competência, sem exigir uma conotação especificamente militar.
- source_word: אֱלִיהוּ וּסְמַכְיָהוּ
  choice: Eliú e Semaquias
  rationale: Emprega transliterações portuguesas inteligíveis dos nomes hebraicos, preservando sua identificação na lista.
