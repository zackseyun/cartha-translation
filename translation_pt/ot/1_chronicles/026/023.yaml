  text: For the Amramites[a], the Izharites, the Hebronites, and the Uzzielites.
translation:
  language: pt
  text: Quanto aos anramitas[a], aos isaritas, aos hebronitas e aos uzielitas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Dos anramitas, dos isaritas, dos hebronitas e dos uzielitas”. O hebraico traz apenas quatro designações de clãs com a preposição ל, funcionando como cabeçalho de uma lista.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעַמְרָמִי
  choice: Quanto aos anramitas
  rationale: O ל prefixado introduz uma designação de clã e, neste contexto, funciona como cabeçalho de lista. “Quanto aos” expressa naturalmente essa função em português, sem transformá-la numa oração completa.
- source_word: לַיִּצְהָרִי
  choice: aos isaritas
  rationale: Forma gentílica derivada de Isar, aqui entendida como designação concisa do clã; mantém-se paralela às demais designações familiares.
- source_word: לַחֶבְרוֹנִי
  choice: aos hebronitas
  rationale: Designação gentílica do grupo familiar ligado a Hebrom. A forma tradicional “hebronitas” preserva o caráter nominal e compacto da lista.
- source_word: לָעָזִּיאֵלִי
  choice: e aos uzielitas
  rationale: Designação gentílica do clã de Uziel. A conjunção “e” é acrescentada conforme o uso natural do português para encerrar a enumeração.
