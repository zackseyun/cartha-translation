base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/007.yaml
  text: 'And his brothers by their clans[a], in the genealogy of their generations: the chief was Jeiel, and Zechariah.'
translation:
  language: pt
  text: 'E seus irmãos, segundo os seus clãs, quando foram registrados genealogicamente conforme as suas gerações: o chefe era Jeiel, e Zacarias.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶחָיו
  choice: E seus irmãos
  rationale: Traduz diretamente אָח no contexto genealógico; embora possa abranger parentes do sexo masculino, “irmãos” preserva o sentido básico sem ampliar desnecessariamente.
- source_word: לְמִשְׁפְּחֹתָיו
  choice: segundo os seus clãs
  rationale: מִשְׁפָּחָה designa divisões familiares ou tribais; “clãs” é mais preciso que “famílias” neste registro. Mantém-se o sufixo masculino singular do hebraico em “seus”, cuja referência é determinada pelo contexto.
- source_word: בְּהִתְיַחֵשׂ
  choice: quando foram registrados genealogicamente
  rationale: O hitpael de יחס em Crônicas indica inscrição ou registro com base na genealogia. A oração temporal produz português natural e explicita a natureza genealógica do registro.
- source_word: לְתֹלְדוֹתָם
  choice: conforme as suas gerações
  rationale: תּוֹלְדוֹת refere-se aqui às gerações ou linhas de descendência registradas; “conforme as suas gerações” conserva a formulação genealógica sem reduzi-la a simples nascimentos.
- source_word: הָרֹאשׁ
  choice: o chefe era
  rationale: רֹאשׁ identifica o principal ou líder do grupo. “Chefe” comunica essa posição com clareza em português moderno.
- source_word: יְעִיאֵל
  choice: Jeiel
  rationale: Transliteração portuguesa bíblica reconhecível do nome hebraico.
- source_word: וּזְכַרְיָהוּ
  choice: e Zacarias
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome hebraico זְכַרְיָהוּ.
