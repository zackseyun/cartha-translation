  text: וּ/בְנֵ֗י חֲצִי֙ שֵׁ֣בֶט מְנַשֶּׁ֔ה יָשְׁב֖וּ בָּ/אָ֑רֶץ מִ/בָּשָׁ֞ן עַד בַּ֧עַל חֶרְמ֛וֹן וּ/שְׂנִ֥יר וְ/הַר חֶרְמ֖וֹן הֵ֥מָּה רָבֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/023.yaml
  text: And the sons of the half-tribe of Manasseh lived in the land from Bashan as far as Baal-hermon[a], Senir, and Mount Hermon[b]; they became numerous.
translation:
  language: pt
  text: Os filhos da meia tribo de Manassés habitavam na terra, desde Basã até Baal-Hermom, Senir e o monte Hermom[a]; eles se tornaram numerosos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baal-Hermom, Senir e o monte Hermom são nomes geográficos que assinalam a extensão setentrional do território.
    reason: cultural_note
  - marker: b
    text: Ou “aumentaram em número” ou “se multiplicaram”. O verbo hebraico enfatiza o crescimento numérico.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Os filhos de
  rationale: Mantém a linguagem genealógica do hebraico; no contexto tribal, abrange os membros e descendentes do grupo.
- source_word: חֲצִי שֵׁבֶט
  choice: a meia tribo
  rationale: Designa a unidade tribal reconhecida de Manassés situada a leste do Jordão e é uma formulação clara em português.
- source_word: מְנַשֶּׁה
  choice: Manassés
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: יָשְׁבוּ
  choice: habitavam
  rationale: Expressa residência contínua na região sem sugerir apenas o ato inicial de se estabelecer.
- source_word: בָּאָרֶץ
  choice: na terra que se estendia
  rationale: Conserva o sentido territorial de אֶרֶץ e torna natural, em português, a delimitação geográfica introduzida por מִן...עַד.
- source_word: מִבָּשָׁן עַד
  choice: desde Basã até
  rationale: Reproduz de modo idiomático o par de preposições que indica extensão geográfica.
- source_word: בַּעַל חֶרְמוֹן
  choice: Baal-Hermom
  rationale: Translitera o topônimo composto e usa hífen para evidenciar sua unidade.
- source_word: וּשְׂנִיר
  choice: Senir
  rationale: Transliteração portuguesa direta do nome geográfico.
- source_word: וְהַר חֶרְמוֹן
  choice: e o monte Hermom
  rationale: Traduz הַר por “monte” e conserva a forma portuguesa tradicional do topônimo.
- source_word: הֵמָּה רָבוּ
  choice: eles se tornaram numerosos
  rationale: Expressa o crescimento numérico indicado pelo qal de רבה e conserva a ênfase do pronome explícito הֵמָּה.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com formas onomásticas usuais no contexto bíblico lusófono. A estrutura geográfica foi levemente explicitada por “que se estendia” para evitar a leitura pouco natural de que Basã fosse apenas o ponto inicial externo à terra habitada. Os marcadores das notas foram posicionados junto aos elementos que efetivamente explicam.
