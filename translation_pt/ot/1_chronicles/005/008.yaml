base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/008.yaml
  text: and Bela son of Azaz[a], son of Shema, son of Joel; he lived in Aroer, as far as Nebo and Baal-meon.
translation:
  language: pt
  text: E Bela, filho de Azaz, filho de Sema, filho de Joel; ele morava[a] em Aroer, até Nebo e Baal-Meom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «residia»; o particípio hebraico descreve residência.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶלַע
  choice: e Belá
  rationale: A conjunção preserva a continuidade da lista genealógica; o nome próprio é transliterado segundo a forma corrente em português.
- source_word: בֶּן
  choice: filho de
  rationale: Mantém a estrutura genealógica formal do hebraico; o contexto não exige a formulação mais ampla «descendente de».
- source_word: עָזָז
  choice: Azaz
  rationale: Transliteração do nome próprio hebraico.
- source_word: שֶׁמַע
  choice: Sema
  rationale: Transliteração adequada ao uso e à ortografia do português.
- source_word: יוֹאֵל
  choice: Joel
  rationale: Forma tradicional e amplamente reconhecida em português.
- source_word: הוּא
  choice: Ele
  rationale: O pronome independente retoma e destaca Belá depois da sequência genealógica; a oração separada é natural em português.
- source_word: יוֹשֵׁב
  choice: morava
  rationale: O particípio qal de ישׁב indica residência habitual. «Morava» é claro, atual e natural, sem o tom arcaico de «habitava» em certos contextos.
- source_word: בַּעֲרֹעֵר
  choice: em Aroer
  rationale: A preposição marca localização, expressa naturalmente por «em».
- source_word: וְעַד
  choice: até
  rationale: Indica a extensão geográfica do território associado à residência de Belá.
- source_word: נְבוֹ
  choice: Nebo
  rationale: Forma tradicional do topônimo em português.
- source_word: וּבַעַל מְעוֹן
  choice: e Baal-Meom
  rationale: Translitera o topônimo composto e conserva a coordenação hebraica entre os limites geográficos.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas tradicionais reconhecíveis dos nomes bíblicos. A pontuação divide a genealogia da informação geográfica para facilitar a leitura sem alterar as relações sintáticas. O marcador da nota foi colocado junto a «morava», termo ao qual a alternativa lexical se refere.
