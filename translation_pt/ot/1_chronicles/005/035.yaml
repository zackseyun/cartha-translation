lexical_decisions:
- source_word: וַ/אֲחִימַעַץ
  choice: Aimaás
  rationale: Nome próprio transliterado segundo a forma bíblica tradicional e reconhecível em português; a conjunção inicial não precisa ser expressa no começo deste versículo isolado.
- source_word: הוֹלִיד
  choice: gerou
  rationale: No contexto genealógico, o hifil de ילד indica gerar ou tornar-se pai de alguém. “Gerou” é conciso, corrente em genealogias bíblicas e preserva a relação genealógica sem explicitação adicional.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: Marcador hebraico de objeto direto, cuja função é representada pela ordem natural das palavras em português.
- source_word: עֲזַרְיָה
  choice: Azarias
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio hebraico.
- source_word: וַ/עֲזַרְיָה
  choice: e Azarias
  rationale: A conjunção וְ liga naturalmente a segunda declaração genealógica à primeira.
- source_word: יוֹחָנָן
  choice: Joanã
  rationale: Transliteração portuguesa consagrada do nome hebraico יוֹחָנָן neste contexto genealógico.
