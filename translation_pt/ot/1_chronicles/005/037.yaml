- source_word: אֲמַרְיָה
  choice: Amarias
  rationale: Forma portuguesa tradicional do nome próprio, usada de modo consistente nas duas ocorrências.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: Marcador hebraico de objeto direto, cuja função é expressa pela ordem natural das palavras em português.
- source_word: אֲחִיטוּב
  choice: Aitube
  rationale: Forma portuguesa tradicional e legível do nome próprio hebraico.
- source_word: וַ / וַ
  choice: e
  rationale: A conjunção hebraica liga as duas declarações genealógicas; “e” reproduz naturalmente essa coordenação.
