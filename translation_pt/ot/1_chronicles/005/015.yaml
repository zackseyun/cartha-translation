  text: אֲחִי֙ בֶּן עַבְדִּיאֵ֣ל בֶּן גּוּנִ֔י רֹ֖אשׁ לְ/בֵ֥ית אֲבוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/015.yaml
  text: Ahi son of Abdiel[a], son of Guni, was head of their fathers’ houses.
translation:
  language: pt
  text: Aí, filho de Abdiel, filho de Guni, era chefe da casa de seus antepassados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chefe de seu grupo familiar”. Literalmente, “chefe da casa de seus antepassados”; a expressão pode designar uma unidade familiar ou clânica ancestral.
    reason: Esclarece o sentido técnico de בֵּית אֲבוֹתָם sem reduzir “antepassados” aos pais imediatos.
lexical_decisions:
- source_word: אֲחִי
  choice: Aí
  rationale: Nome próprio transliterado segundo a forma tradicional e natural em português.
- source_word: בֶּן
  choice: filho de
  rationale: Na fórmula genealógica deste contexto, indica mais naturalmente filiação direta; embora possa também significar um descendente mais remoto.
- source_word: עַבְדִּיאֵל
  choice: Abdiel
  rationale: Nome próprio transliterado segundo a convenção corrente em português.
- source_word: גּוּנִי
  choice: Guni
  rationale: Nome próprio transliterado segundo a convenção corrente em português.
- source_word: רֹאשׁ
  choice: chefe
  rationale: Expressa com naturalidade a ideia de liderança inerente ao substantivo hebraico, cujo sentido literal é “cabeça”.
- source_word: לְבֵית אֲבוֹתָם
  choice: da casa ancestral deles
  rationale: A expressão designa a unidade familiar ou clânica vinculada aos antepassados. “Casa ancestral” conserva a imagem hebraica sem sugerir apenas um edifício; “deles” preserva o pronome plural do texto-fonte.
