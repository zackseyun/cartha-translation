lexical_decisions:
- source_word: וַיַּעֲשׂוּ מִלְחָמָה
  choice: Fizeram guerra
  rationale: Reproduz de modo claro o idioma hebraico formado por עשה, «fazer», e מִלְחָמָה, «guerra», preservando o sentido amplo de guerrear sem reduzi-lo a uma única batalha.
- source_word: עִם
  choice: contra
  rationale: Embora a preposição normalmente possa significar «com», neste contexto bélico expressa oposição; «contra» comunica naturalmente essa relação.
- source_word: הַגְרִיאִים
  choice: os hagritas
  rationale: Translitera o etnônimo segundo sua forma hebraica e representa o artigo definido. A forma portuguesa tradicional «hagarenos» é registrada em nota como alternativa.
- source_word: וִיטוּר
  choice: Jetur
  rationale: Forma portuguesa corrente do nome próprio hebraico.
- source_word: וְנָפִישׁ
  choice: Nafis
  rationale: Transliteração portuguesa clara do nome próprio, ajustando o som hebraico à ortografia portuguesa.
- source_word: וְנוֹדָב
  choice: e Nodabe
  rationale: Forma portuguesa do nome próprio, com a conjunção preservada para marcar o último elemento da lista.
