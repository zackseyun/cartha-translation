translation:
  language: pt
  text: Fizeram guerra contra os hagritas[a], Jetur, Nafis e Nodabe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «hagarenos». O etnônimo hebraico admite essas duas formas em português.
