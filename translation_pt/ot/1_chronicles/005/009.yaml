- from: A leste, ele se estabeleceu até a entrada do deserto desde o rio Eufrates[a], porque os seus rebanhos tinham se multiplicado na terra de Gileade.
  to: A leste, ele se estabeleceu até a entrada do deserto, a partir do rio Eufrates[a], porque seus rebanhos tinham se multiplicado na terra de Gileade.
  rationale: A revisão ajusta apenas a expressão geográfica difícil para uma ordem mais idiomática em português. A vírgula e «a partir do» evitam sugerir que o rio seja origem da «entrada», mas não impõem uma reconstrução geográfica específica; a nota conserva a alternativa e declara a ambiguidade do hebraico. Também foi feita a pequena regularização estilística de «os seus» para «seus».
