base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/009.yaml
  text: To the east he settled as far as the entrance to the wilderness from the river Euphrates[a], because their livestock had multiplied in the land of Gilead.
translation:
  language: pt
  text: A leste, ele se estabeleceu até a entrada do deserto, a partir do rio Eufrates[a], porque seus rebanhos tinham se multiplicado na terra de Gileade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até o deserto, a partir do rio Eufrates”. A descrição dos limites em hebraico é condensada e pode ser entendida de mais de uma maneira.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְלַמִּזְרָח
  choice: A leste
  rationale: Expressa naturalmente a orientação espacial em português; a conjunção inicial não precisa ser reproduzida de modo explícito no começo da frase.
- source_word: יָשַׁב
  choice: ele se estabeleceu
  rationale: O singular representa coletivamente o grupo tribal, e “se estabeleceu” comunica ocupação territorial melhor do que o mais estático “habitou”.
- source_word: עַד לְבוֹא מִדְבָּרָה
  choice: até a entrada do deserto
  rationale: Conserva a imagem concreta de chegada ou acesso ao deserto presente na expressão hebraica.
- source_word: לְמִן הַנָּהָר פְּרָת
  choice: desde o rio Eufrates
  rationale: Segue de perto a formulação hebraica comprimida sem decidir silenciosamente qual relação geográfica exata a expressão estabelece.
- source_word: כִּי
  choice: porque
  rationale: Introduz com clareza a razão da expansão para o leste.
- source_word: מִקְנֵיהֶם
  choice: os seus rebanhos
  rationale: Designa coletivamente os animais possuídos, sem restringir o sentido apenas a bovinos.
- source_word: רָבוּ
  choice: tinham se multiplicado
  rationale: Indica aumento numérico anterior que explica o avanço territorial.
- source_word: בְּאֶרֶץ גִּלְעָד
  choice: na terra de Gileade
  rationale: Preserva tanto o valor territorial de אֶרֶץ quanto a forma portuguesa tradicional e corrente do topônimo.
