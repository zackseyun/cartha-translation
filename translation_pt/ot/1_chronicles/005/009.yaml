    issue: Construção geográfica pouco natural em «até a entrada do deserto desde o rio Eufrates».
    rationale: Embora reproduza a compressão sintática do hebraico e do inglês de auditoria, em português «desde» ligado diretamente a «entrada» é difícil de processar. Uma pausa e «a partir de» preservam a indeterminação da descrição de limite, que permanece explicitada na nota.
  revised_text: A leste, ele se estabeleceu até a entrada do deserto, a partir do rio Eufrates[a], porque seus rebanhos tinham se multiplicado na terra de Gileade.
  revised_footnotes:
