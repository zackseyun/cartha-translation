  text: וּ/בְנֵ֨י רְאוּבֵ֥ן בְּכֽוֹר יִשְׂרָאֵל֮ כִּ֣י ה֣וּא הַ/בְּכוֹר֒ וּֽ/בְ/חַלְּל/וֹ֙ יְצוּעֵ֣י אָבִ֔י/ו נִתְּנָה֙ בְּכֹ֣רָת֔/וֹ לִ/בְנֵ֥י יוֹסֵ֖ף בֶּן יִשְׂרָאֵ֑ל וְ/לֹ֥א לְ/הִתְיַחֵ֖שׂ לַ/בְּכֹרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/001.yaml
  text: The sons of Reuben[a], the firstborn of Israel—for he was the firstborn, but because he defiled his father’s bed, his birthright was given to the sons of Joseph son of Israel[b], though not to be enrolled by birthright—
translation:
  language: pt
  text: Os filhos de Rúben, o primogênito de Israel — pois ele era o primogênito, mas, por ter profanado o leito de seu pai[a], seu direito de primogenitura foi dado aos filhos de José, filho de Israel; contudo, não para ser registrado genealogicamente segundo a primogenitura[b] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “os leitos de seu pai”. O plural hebraico é uma expressão referente ao leito conjugal.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “contudo, não para ser contado na genealogia conforme o direito de primogenitura”. A construção hebraica não declara um sujeito e distingue a transferência dos direitos de primogenitura do registro genealógico.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי רְאוּבֵן
  choice: Os filhos de Rúben
  rationale: Traduz diretamente a expressão genealógica. O waw liga o versículo ao contexto, mas não exige um marcador temporal ou discursivo independente em português.
- source_word: בְּכוֹר יִשְׂרָאֵל
  choice: o primogênito de Israel
  rationale: Preserva tanto a ordem de nascimento quanto a designação formal de Rúben.
- source_word: כִּי הוּא הַבְּכוֹר
  choice: pois ele era o primogênito
  rationale: כִּי introduz aqui uma explicação parentética; “pois” comunica essa função naturalmente.
- source_word: וּבְחַלְּלוֹ
  choice: mas, por ter profanado
  rationale: O infinitivo com בְּ expressa a causa ou circunstância. “Profanado” mantém o peso moral e a ligação lexical com a ideia de tornar desonroso.
- source_word: יְצוּעֵי אָבִיו
  choice: o leito de seu pai
  rationale: Embora יְצוּעֵי esteja no plural, a expressão é idiomática e se refere ao leito conjugal do pai; o singular é natural em português, com nota sobre a forma hebraica.
- source_word: נִתְּנָה בְּכֹרָתוֹ
  choice: seu direito de primogenitura foi dado
  rationale: בְּכֹרָה designa os direitos e privilégios próprios do primogênito, não apenas a condição cronológica de ter nascido primeiro.
- source_word: לִבְנֵי יוֹסֵף בֶּן יִשְׂרָאֵל
  choice: aos filhos de José, filho de Israel
  rationale: Mantém explícita a identificação genealógica de José como filho de Israel.
- source_word: וְלֹא לְהִתְיַחֵשׂ לַבְּכֹרָה
  choice: contudo, ele não devia ser registrado genealogicamente segundo a primogenitura
  rationale: התיחשׂ é um termo de registro ou classificação genealógica. A formulação mantém a construção difícil e a distinção entre receber os direitos de primogenitura e ser contado genealogicamente segundo ela, sem especificar além do hebraico quem é o sujeito implícito.
theological_decisions:
- issue: Distinção entre primogenitura biológica, direitos de primogenitura e registro genealógico
  choice: Rúben continua identificado como o primogênito, enquanto seu direito de primogenitura é transferido aos filhos de José; a cláusula final limita ou qualifica essa transferência no âmbito genealógico.
  alternative: Entender que José ou seus filhos substituíram Rúben como primogênito em todos os sentidos.
  rationale: O texto afirma simultaneamente a condição de Rúben como primogênito, a transferência de seus direitos e uma ressalva quanto ao registro genealógico. A tradução conserva essa tensão.
- issue: Sujeito implícito da cláusula final
  choice: Empregar “ele”, preservando a possibilidade contextual de referência ao portador do estatuto de primogênito, e explicar a dificuldade em nota.
  alternative: Explicitar “José” ou “os filhos de José” como sujeito da cláusula.
  rationale: O hebraico usa um infinitivo reflexivo sem sujeito nominal expresso. Explicitar José ou seus filhos resolveria uma ambiguidade que o texto não resolve formalmente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A frase permanece aberta com travessão porque o versículo continua sintaticamente no contexto seguinte. “Direito de primogenitura” evita confundir privilégio jurídico-familiar com mera ordem de nascimento.
