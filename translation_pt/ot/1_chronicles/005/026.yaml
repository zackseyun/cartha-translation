revisions:
- from: Por isso, o Deus de Israel despertou o espírito de Pul, rei da Assíria, e o espírito de Tilgate-Pilneser[b], rei da Assíria.[a] Ele levou para o exílio os rubenitas, os gaditas e a meia tribo de Manassés e os trouxe para Hala, Habor, Hara e o rio de Gozã, onde permanecem até o dia de hoje.
  to: O Deus de Israel despertou o espírito de Pul, rei da Assíria, e o espírito de Tilgate-Pilneser[b], rei da Assíria[a]. Ele levou para o exílio os rubenitas, os gaditas e a meia tribo de Manassés e os trouxe para Hala, Habor, Hara e o rio de Gozã, onde estão até hoje.
  rationale: A revisão elimina a inferência causal acrescentada por “Por isso”, conserva a coordenação e a repetição do hebraico sem decidir no texto principal se os nomes designam um ou dois reis, e torna a cláusula final idiomática em português sem expandir indevidamente seu sentido. Os marcadores continuam válidos e foram posicionados junto aos respectivos referentes.
