source:
  edition: WLC
  text: וַ/יָּעַר֩ אֱלֹהֵ֨י יִשְׂרָאֵ֜ל אֶת ר֣וּחַ פּ֣וּל מֶֽלֶךְ אַשּׁ֗וּר וְ/אֶת ר֨וּחַ֙ תִּלְּגַ֤ת פִּלְנֶ֨סֶר֙ מֶ֣לֶךְ אַשּׁ֔וּר וַ/יַּגְלֵ/ם֙ לָ/ראוּבֵנִ֣י וְ/לַ/גָּדִ֔י וְ/לַ/חֲצִ֖י שֵׁ֣בֶט מְנַשֶּׁ֑ה וַ֠/יְבִיאֵ/ם לַ/חְלַ֨ח וְ/חָב֤וֹר וְ/הָרָא֙ וּ/נְהַ֣ר גּוֹזָ֔ן עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/026.yaml
  text: So the God of Israel stirred up the spirit of Pul king of Assyria[a], even the spirit of Tilgath-pilneser king of Assyria, and he took the Reubenites, the Gadites, and the half-tribe of Manasseh into exile, and brought them to Halah, Habor, Hara, and the river Gozan[b], to this day.
translation:
  language: pt
  text: O Deus de Israel despertou o espírito de Pul, rei da Assíria, e o espírito de Tilgate-Pilneser[b], rei da Assíria[a]. Ele levou para o exílio os rubenitas, os gaditas e a meia tribo de Manassés e os trouxe para Hala, Habor, Hara e o rio de Gozã, onde estão até hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pul e Tilgate-Pilneser podem ser dois nomes do mesmo rei da Assíria, geralmente identificado como Tiglate-Pileser III. A construção hebraica também pode ser entendida como referência a dois governantes distintos.
    reason: alternative_reading
  - marker: b
    text: “Tilgate-Pilneser” reflete a forma hebraica empregada aqui; em português, a forma mais conhecida é “Tiglate-Pileser”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּעַר
  choice: despertou
  rationale: O verbo indica que Deus moveu ou despertou alguém para agir. “Despertou” é natural em português e não acrescenta a conotação negativa que “incitou” poderia sugerir.
- source_word: ר֣וּחַ ... ר֨וּחַ
  choice: o espírito de ... o espírito de
  rationale: A repetição preserva a forma enfática do hebraico e apresenta רוּחַ como o impulso ou disposição interior do rei, sem reduzi-lo apenas a “mente” ou “vontade”.
- source_word: פּוּל
  choice: Pul
  rationale: Transliteração corrente e direta do nome próprio hebraico.
- source_word: תִּלְּגַת פִּלְנֶסֶר
  choice: Tilgate-Pilneser
  rationale: A forma procura refletir de perto a grafia hebraica específica de Crônicas, em vez de substituí-la silenciosamente pela forma portuguesa mais conhecida, “Tiglate-Pileser”.
- source_word: וַיַּגְלֵם
  choice: levou para o exílio
  rationale: O hifil de גלה designa levar ou deportar pessoas para o exílio. A expressão escolhida é clara, concreta e menos burocrática que “deportou”.
- source_word: לָראוּבֵנִי וְלַגָּדִי
  choice: os rubenitas, os gaditas
  rationale: São formas gentílicas que designam os membros das tribos de Rúben e Gade; os gentílicos portugueses são naturais e precisos.
- source_word: וְלַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: a meia tribo de Manassés
  rationale: Expressão tradicional e clara para a parte da tribo de Manassés estabelecida a leste do Jordão.
- source_word: וַיְבִיאֵם
  choice: os trouxe
  rationale: Tradução direta do hifil de בוא, adequada à sequência de exílio e reassentamento.
- source_word: לַחְלַח וְחָבוֹר וְהָרָא וּנְהַר גּוֹזָן
  choice: para Hala, Habor, Hara e o rio de Gozã
  rationale: Os topônimos são transliterados, e נְהַר גּוֹזָן é expresso naturalmente como “o rio de Gozã”.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até o dia de hoje
  rationale: Mantém o idiomatismo temporal hebraico em linguagem portuguesa clara e digna.
theological_decisions:
- issue: Relação entre Pul e Tilgate-Pilneser
  choice: 'Manter as duas expressões coordenadas: “o espírito de Pul ... e o espírito de Tilgate-Pilneser”.'
  alternative: 'Entender os dois nomes como designações do mesmo rei e traduzir de modo appositivo: “o espírito de Pul ... isto é, o espírito de Tilgate-Pilneser”.'
  rationale: O hebraico repete “o espírito de” e liga as expressões com וְ, o que permite formalmente a leitura de dois governantes, embora a identificação histórica de Pul com Tiglate-Pileser III favoreça a leitura de dois nomes do mesmo rei. O texto principal preserva a estrutura e a ambiguidade; a nota registra a identificação possível.
- issue: Sujeito singular de וַיַּגְלֵם após os dois nomes régios
  choice: Iniciar nova frase com “Ele”, conservando o sujeito masculino singular do hebraico sem identificá-lo explicitamente.
  alternative: Explicitar “Tilgate-Pilneser” ou usar um sujeito plural, conforme a interpretação adotada.
  rationale: O verbo hebraico está no singular. “Ele” mantém esse dado e preserva a tensão sintática ligada à possível identidade entre Pul e Tilgate-Pilneser.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla inteligibilidade internacional. A repetição de “o espírito de” foi mantida para preservar a forma e a ambiguidade do hebraico. Os marcadores [a] e [b] aparecem no texto principal junto às questões que explicam.
