  source_fidelity: A tradução preserva adequadamente os dois sintagmas repetidos “o espírito de” e mantém, no texto principal, a ambiguidade quanto à relação entre Pul e Tilgate-Pilneser. Contudo, “Por isso” introduz uma relação inferencial que não está expressa no hebraico, e “onde permanecem” formula de modo mais específico do que o necessário a implicação de עד היום הזה.
  naturalness: O português é claro e de registro apropriado. “Até hoje” é mais idiomático e conciso do que “até o dia de hoje”; com “onde estão até hoje”, comunica naturalmente a cláusula temporal final aplicada aos deportados em seus lugares de reassentamento.
  terminology: Os gentílicos, os nomes tribais e os topônimos estão adequados. “Tilgate-Pilneser” é uma transliteração defensável da forma hebraica, e a nota oferece corretamente a forma portuguesa mais familiar. As notas devem permanecer ancoradas junto aos elementos que explicam.
  issues:
  - severity: medium
    issue: “Por isso” no início
    rationale: O waw narrativo hebraico introduz a ação sem explicitar uma conclusão causal em relação ao contexto anterior. “Por isso” acrescenta uma inferência não marcada pelo versículo.
  - severity: low
    issue: “onde permanecem”
    rationale: A cláusula עד היום הזה significa “até hoje”; no contexto ela pode implicar que os deportados ainda estão nesses lugares, mas “permanecem” torna essa implicação mais explícita. “Onde estão até hoje” é formulação portuguesa convencional e mais próxima da elipse contextual.
  - severity: low
    issue: Posicionamento da nota de leitura alternativa
    rationale: A nota sobre a relação entre os dois nomes deve ficar imediatamente após a segunda designação régia, em vez de depois do período, para que seu alcance seja inequívoco.
