base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/011.yaml
  text: And the sons of Gad lived opposite them in the land of Bashan[b][a], as far as Salecah.
translation:
  language: pt
  text: ¹¹ E os filhos de Gade moravam em frente deles[a], na terra de Basã, até Salca[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao lado deles”, “diante deles” ou “defronte deles”. A expressão hebraica indica a posição relativa aos rubenitas mencionados anteriormente.
    reason: lexical_alternative
  - marker: b
    text: O nome deste lugar também pode ser transliterado “Salecá” ou “Salcá”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי גָד
  choice: E os filhos de Gade
  rationale: Mantém a coordenação do hebraico e sua expressão genealógico-tribal tradicional; aqui, “filhos” designa os integrantes ou descendentes da tribo de Gade.
- source_word: לְנֶגְדָּם
  choice: em frente deles
  rationale: Preserva o sentido espacial de posição diante de, em face de ou defronte do grupo mencionado anteriormente, sem definir com precisão uma geografia que o hebraico deixa aberta.
- source_word: יָשְׁבוּ
  choice: moravam
  rationale: No contexto de ocupação territorial, o verbo descreve residência contínua. “Moravam” é corrente e natural, sem a possível ênfase ingressiva de “se estabeleceram”.
- source_word: בְּאֶרֶץ הַבָּשָׁן
  choice: na terra de Basã
  rationale: Traduz אֶרֶץ como uma região territorial e mantém a forma portuguesa consagrada do topônimo Basã.
- source_word: עַד סַלְכָה
  choice: até Salca
  rationale: עַד indica o limite ou alcance geográfico; “até” expressa isso naturalmente. “Salca” é uma forma portuguesa reconhecível do topônimo hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe simples. “Moravam” evita o tom arcaico de “habitavam”, e “em frente deles” conserva a ambiguidade espacial do hebraico. Os topônimos seguem formas de boa legibilidade em português.
