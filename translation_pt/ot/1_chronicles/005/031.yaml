  rationale: No contexto genealógico, o hifil de ילד indica gerar ou tornar-se pai de alguém; “gerou” é conciso, natural nesse gênero e preserva a relação genealógica.
- source_word: אֶת
  choice: '[não traduzido]'
  rationale: Marcador hebraico de objeto direto, sem equivalente natural em português.
- source_word: בֻּקִּי
  choice: Buqui
  rationale: Transliteração portuguesa convencional do nome próprio.
- source_word: וּ/בֻקִּי
  choice: e Buqui
  rationale: A conjunção prefixada ו é traduzida por “e”, preservando a sequência simples da genealogia.
- source_word: עֻזִּי
  choice: Uzi
  rationale: Forma portuguesa clara e convencional do nome próprio hebraico.
