lexical_decisions:
- source_word: אֲחִיטוּב
  choice: Aitube
  rationale: Nome próprio transliterado segundo a forma tradicional e reconhecível em português.
- source_word: הוֹלִיד
  choice: gerou
  rationale: No contexto genealógico, o hifil de ילד indica gerar ou tornar-se pai de alguém. “Gerou” é conciso, digno e natural na linguagem bíblica portuguesa atual.
- source_word: אֶת
  choice: '[não traduzido]'
  rationale: Marcador hebraico de objeto direto, sem equivalente lexical independente em português; sua função é expressa pela sintaxe.
- source_word: צָדוֹק
  choice: Zadoque
  rationale: Nome próprio vertido na forma tradicional e amplamente reconhecida em português.
- source_word: וְ
  choice: e
  rationale: Conjunção simples que liga as duas declarações genealógicas.
- source_word: הוֹלִיד
  choice: gerou
  rationale: Repetição do verbo genealógico, traduzida de modo consistente para preservar o paralelismo do original.
- source_word: אֲחִימָעַץ
  choice: Aimaás
  rationale: Nome próprio transliterado na forma tradicional em português.
