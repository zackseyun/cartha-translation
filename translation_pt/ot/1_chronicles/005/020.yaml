  text: וַ/יֵּעָזְר֣וּ עֲלֵי/הֶ֔ם וַ/יִּנָּתְנ֤וּ בְ/יָדָ/ם֙ הַֽ/הַגְרִיאִ֔ים וְ/כֹ֖ל שֶׁ֣/עִמָּ/הֶ֑ם כִּ֠י לֵ/אלֹהִ֤ים זָעֲקוּ֙ בַּ/מִּלְחָמָ֔ה וְ/נַעְתּ֥וֹר לָ/הֶ֖ם כִּי בָ֥טְחוּ בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/020.yaml
  text: They were helped against them[a], and the Hagrites and all who were with them were given into their hand, because they cried out to God in the battle[c][b], and he answered them because they trusted in him.
translation:
  language: pt
  text: Eles receberam ajuda contra os hagarenos, e estes, com todos os que estavam com eles, foram entregues nas mãos deles[b], porque, durante a batalha, clamaram a Deus, e ele atendeu às suas súplicas[c]. Pois confiaram nele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Hebraico: “foram entregues na mão deles”, expressão que significa serem submetidos ao poder deles e derrotados.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “ele se deixou suplicar por eles”, isto é, respondeu favoravelmente à oração deles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּעָזְרוּ עֲלֵיהֶם
  choice: Eles receberam ajuda contra os inimigos
  rationale: O nifal de עזר é passivo. A formulação mantém implícito o agente imediato da ajuda, enquanto o restante do versículo aponta para Deus, e evita a ambiguidade pouco natural de dois pronomes idênticos em português.
- source_word: וַיִּנָּתְנוּ בְיָדָם
  choice: foram entregues nas mãos deles
  rationale: Preserva a imagem do idioma hebraico militar, que indica entrega ao poder do vencedor e consequente derrota.
- source_word: הַהַגְרִיאִים
  choice: os hagarenos
  rationale: Forma portuguesa reconhecível para o nome desse povo, associada a Hagar; a variante transliterada mais estrita é registrada em nota.
- source_word: וְכֹל שֶׁעִמָּהֶם
  choice: com todos os que estavam com eles
  rationale: Refere-se naturalmente aos aliados ou contingentes que acompanhavam os hagarenos.
- source_word: כִּי לֵאלֹהִים זָעֲקוּ בַּמִּלְחָמָה
  choice: porque, durante a batalha, clamaram a Deus
  rationale: זעק expressa um clamor urgente por socorro; בַּמִּלְחָמָה aponta para a batalha específica do contexto.
- source_word: וְנַעְתּוֹר לָהֶם
  choice: e ele atendeu às suas súplicas
  rationale: O nifal de עתר comunica que Deus se deixou suplicar ou respondeu favoravelmente. A tradução explicita de modo natural o conteúdo implícito da resposta sem reduzir a expressão a uma simples resposta verbal.
- source_word: כִּי בָטְחוּ בוֹ
  choice: pois confiaram nele
  rationale: Mantém a relação causal e o sentido de dependência ou confiança expresso por בטח ב.
theological_decisions:
- issue: Agente da ajuda na batalha
  choice: Manter o agente imediato implícito em “receberam ajuda”
  alternative: “Deus os ajudou contra os inimigos”
  rationale: A forma hebraica é passiva. O contexto deixa claro que Deus é a fonte última da ajuda, mas a tradução não transforma desnecessariamente a sintaxe em uma declaração ativa explícita.
- issue: Resposta divina à oração
  choice: “ele atendeu às suas súplicas”
  alternative: “ele se deixou suplicar por eles”
  rationale: A opção escolhida comunica em português atual a resposta favorável de Deus, preservando a ligação entre clamor, confiança e intervenção divina.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A repetição pronominal potencialmente confusa foi esclarecida por “os inimigos”, sem identificar além do contexto os adversários referidos. Os marcadores de nota aparecem junto aos termos pertinentes.
