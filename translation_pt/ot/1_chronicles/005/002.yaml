id: 1CH.5.2
reference: 1 Chronicles 5:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֤י יְהוּדָה֙ גָּבַ֣ר בְּ/אֶחָ֔י/ו וּ/לְ/נָגִ֖יד מִמֶּ֑/נּוּ וְ/הַ/בְּכֹרָ֖ה לְ/יוֹסֵֽף׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/002.yaml
  text: For Judah prevailed over his brothers[a], and from him came the ruler, though the birthright belonged to Joseph.
translation:
  language: pt
  text: Pois Judá prevaleceu sobre seus irmãos, e dele veio o governante[a], embora o direito de primogenitura pertencesse a José.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “líder” ou “príncipe”.
    reason: Registra alternativas legítimas para נָגִיד, termo que pode designar governante, líder ou príncipe.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da afirmação anterior sobre a perda da primogenitura de Rúben e preserva de modo natural a ligação discursiva.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio.
- source_word: גָּבַר
  choice: prevaleceu
  rationale: Expressa a ideia de mostrar-se forte ou superior em relação aos irmãos, sem reduzir o sentido apenas a força física.
- source_word: בְּאֶחָיו
  choice: sobre seus irmãos
  rationale: Com גָּבַר, indica a superioridade ou preeminência de Judá em relação aos seus irmãos.
- source_word: וּלְנָגִיד מִמֶּנּוּ
  choice: e dele veio o governante
  rationale: Transmite de maneira idiomática que de Judá procedeu aquele que exerceria liderança, preservando o sentido de origem expresso por מִמֶּנּוּ.
- source_word: וְהַבְּכֹרָה
  choice: embora o direito de primogenitura pertencesse
  rationale: Explicita naturalmente o contraste contextual entre a liderança de Judá e a prerrogativa de primogênito atribuída a José.
- source_word: לְיוֹסֵף
  choice: a José
  rationale: O לְ marca aqui posse; a construção portuguesa completa é “pertencesse a José”.
theological_decisions:
- issue: Relação entre a preeminência de Judá e a primogenitura de José
  choice: Distinguir a supremacia e a liderança provenientes de Judá do direito de primogenitura pertencente a José.
  alternative: Entender de modo mais geral que Judá se tornou o mais forte, enquanto José conservou privilégios de herança.
  rationale: O hebraico justapõe a preeminência de Judá e a procedência do נָגִיד com a atribuição da בְּכֹרָה a José. A tradução mantém distintas essas prerrogativas sem resolver a tensão teológica do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Direito de primogenitura” comunica com precisão o status e as prerrogativas do primogênito. O marcador da nota foi colocado após “governante”, o termo ao qual a alternativa lexical se refere.
