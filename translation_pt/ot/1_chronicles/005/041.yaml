  text: וִ/יהוֹצָדָ֣ק הָלַ֔ךְ בְּ/הַגְל֣וֹת יְהוָ֔ה אֶת יְהוּדָ֖ה וִ/ירוּשָׁלִָ֑ם בְּ/יַ֖ד נְבֻכַדְנֶאצַּֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/041.yaml
  text: And Jehozadak went away when Yahweh sent Judah and Jerusalem into exile by the hand of Nebuchadnezzar[a].
translation:
  language: pt
  text: E Jeozadaque partiu quando Yahweh levou Judá e Jerusalém ao exílio pela mão de Nabucodonosor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “E Jeozadaque foi quando Yahweh exilou Judá e Jerusalém pela mão de Nabucodonosor.”'
    reason: Alternativa lexical e mais formal para o infinitivo temporal e para o verbo הָלַךְ.
lexical_decisions:
- source_word: וִיהוֹצָדָק
  choice: E Jeozadaque
  rationale: O nome próprio é transliterado na forma portuguesa corrente, preservando a forma hebraica mais plena; a conjunção prefixada é traduzida por “E”.
- source_word: הָלַךְ
  choice: foi embora
  rationale: O verbo significa normalmente “ir”; no contexto da deportação, “foi embora” expressa a saída sem sugerir que Jeozadaque tenha conduzido ou iniciado o exílio.
- source_word: בְּהַגְלוֹת
  choice: quando ... levou ... ao exílio
  rationale: A preposição com o infinitivo construto tem valor temporal. A formulação finita é natural em português e mantém Yahweh como agente da ação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֶת יְהוּדָה וִירוּשָׁלָם
  choice: Judá e Jerusalém
  rationale: O texto nomeia diretamente o reino ou território e a cidade; acrescentar “o povo de” explicaria além da formulação hebraica.
- source_word: בְּיַד
  choice: pelas mãos de
  rationale: O idioma hebraico indica agência ou instrumentalidade. A expressão portuguesa mantém a imagem e identifica Nabucodonosor como agente humano da ação divina.
- source_word: נְבֻכַדְנֶאצַּר
  choice: Nabucodonosor
  rationale: Forma tradicional e amplamente reconhecida do nome do rei babilônico em português.
theological_decisions:
- issue: Agência divina e humana no exílio
  choice: Yahweh é apresentado como aquele que levou Judá e Jerusalém ao exílio, pelas mãos de Nabucodonosor.
  alternative: Apresentar somente Nabucodonosor como agente efetivo do exílio.
  rationale: A sintaxe faz de Yahweh o sujeito da ação e marca Nabucodonosor como agente instrumental. A tradução preserva conjuntamente a soberania divina e a atuação histórica babilônica.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Foi embora” é idiomático sem ser coloquial demais; “pelas mãos de” conserva de modo inteligível a expressão hebraica de agência.
