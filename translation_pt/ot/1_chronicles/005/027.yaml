  text: בְּנֵ֖י לֵוִ֑י גֵּרְשׁ֕וֹן קְהָ֖ת וּ/מְרָרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/027.yaml
  text: 'The sons of Levi: Gershon[a], Kohath, and Merari.'
translation:
  language: pt
  text: 'Os filhos de Levi: Gérson[a], Coate e Merari.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “descendentes de Levi”. Nas genealogias, “filhos de” às vezes pode designar uma linhagem mais ampla, embora aqui se refira mais naturalmente aos três filhos imediatos de Levi.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: filhos de
  rationale: Plural construto de בֵּן. Em genealogias, pode indicar descendentes de modo mais amplo, mas aqui apresenta naturalmente os três filhos imediatos de Levi; “filhos de” preserva a forma e soa natural em português.
- source_word: לֵוִי
  choice: Levi
  rationale: Nome próprio em sua forma tradicional e amplamente reconhecida em português.
- source_word: גֵּרְשׁוֹן
  choice: Gérson
  rationale: Transliteração tradicional em português do nome hebraico aqui empregado, distinta de Gérsom.
- source_word: קְהָת
  choice: Coate
  rationale: Forma tradicional e reconhecível em português para o nome hebraico.
- source_word: מְרָרִי
  choice: Merari
  rationale: Forma tradicional e reconhecível em português para o nome hebraico.
- source_word: וּ
  choice: e
  rationale: Conjunção simples que liga o último nome da lista.
