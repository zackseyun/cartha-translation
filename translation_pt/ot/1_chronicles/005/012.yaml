lexical_decisions:
- source_word: יוֹאֵל
  choice: Joel
  rationale: Nome próprio vertido segundo a forma tradicional e amplamente reconhecida em português.
- source_word: הָרֹאשׁ
  choice: o chefe
  rationale: Embora רֹאשׁ signifique literalmente «cabeça», aqui indica primazia ou liderança; «o chefe» expressa naturalmente essa função.
- source_word: וְשָׁפָם
  choice: Safã
  rationale: Transliteração portuguesa tradicional do nome próprio hebraico.
- source_word: הַמִּשְׁנֶה
  choice: o segundo em posição
  rationale: מִשְׁנֶה indica a segunda posição hierárquica. A formulação explicita o sentido sem definir de modo indevido uma função administrativa específica.
- source_word: וְיַעְנַי
  choice: Janai
  rationale: Transliteração clara e natural do nome próprio hebraico para leitores de português.
- source_word: וְשָׁפָט
  choice: Safate
  rationale: Forma portuguesa tradicional do nome próprio hebraico.
- source_word: בַּבָּשָׁן
  choice: em Basã
  rationale: O topônimo é vertido pela forma portuguesa consagrada, e a preposição prefixada é traduzida por «em».
