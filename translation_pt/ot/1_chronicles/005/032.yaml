  text: E Uzi gerou Zeraías, e Zeraías gerou Meraiote.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/עֻזִּי
  choice: Uzi
  rationale: Nome próprio transliterado segundo a forma bíblica corrente em português; a conjunção inicial não precisa ser explicitada neste versículo isolado, pois apenas dá continuidade à genealogia anterior.
- source_word: הוֹלִיד
  choice: gerou
  rationale: O hifil de ילד, em contexto genealógico, indica que alguém foi pai de outro. “Gerou” é conciso, natural no registro genealógico bíblico em português e evita o tom arcaico de “engendrou”.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: Partícula hebraica que marca o objeto direto definido; não possui equivalente lexical necessário em português.
- source_word: זְרַחְיָה
  choice: Zeraías
  rationale: Transliteração adaptada à tradição onomástica bíblica em português e à leitura natural do público-alvo.
- source_word: וּֽ/זְרַֽחְיָה
  choice: e Zeraías
  rationale: A conjunção e a repetição do nome são mantidas para preservar com clareza a estrutura encadeada da genealogia.
- source_word: הוֹלִיד
  choice: gerou
  rationale: A repetição do verbo genealógico é preservada para manter o paralelismo e a consistência do texto hebraico.
- source_word: מְרָיֽוֹת
  choice: Meraiote
  rationale: Forma portuguesa tradicional e legível do nome próprio hebraico.
