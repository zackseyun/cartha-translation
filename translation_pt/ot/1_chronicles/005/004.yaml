lexical_decisions:
- source_word: בְּנֵי
  choice: Os filhos de
  rationale: Plural construto de בֵּן que introduz a linhagem. “Filhos de” é a tradução mais direta e convencional; embora possa abranger descendentes, a repetição de “seu filho” favorece aqui uma linha filial direta.
- source_word: יוֹאֵל
  choice: Joel
  rationale: Nome próprio vertido segundo a forma bíblica consagrada em português.
- source_word: שְׁמַעְיָה
  choice: Semaías
  rationale: Nome próprio vertido segundo a forma bíblica tradicional e reconhecível em português.
- source_word: בְנוֹ
  choice: seu filho
  rationale: O substantivo com sufixo masculino singular marca a relação filial; “seu filho” é a formulação natural em português e preserva a repetição genealógica do hebraico.
- source_word: גּוֹג
  choice: Gogue
  rationale: Forma tradicional portuguesa do nome próprio; neste contexto, funciona simplesmente como nome genealógico.
- source_word: שִׁמְעִי
  choice: Simei
  rationale: Forma bíblica consagrada em português para este nome próprio.
