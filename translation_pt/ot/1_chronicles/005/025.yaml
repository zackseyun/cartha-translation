  to: Mas eles foram infiéis ao Deus de seus antepassados e se prostituíram, seguindo os deuses dos povos da terra[a], povos que Deus havia destruído de diante deles.
  rationale: A revisão torna mais natural a expressão da infidelidade, preserva a metáfora deliberada do hebraico e restitui em «de diante deles» a nuance de remoção/destruição indicada por מִפְּנֵיהֶם. A repetição controlada de «povos» mantém inequívoco que Deus destruiu os povos, não os deuses.
