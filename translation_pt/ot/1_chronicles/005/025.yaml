  text: וַ/יִּֽמְעֲל֔וּ בֵּ/אלֹהֵ֖י אֲבוֹתֵי/הֶ֑ם וַ/יִּזְנ֗וּ אַחֲרֵי֙ אֱלֹהֵ֣י עַמֵּי הָ/אָ֔רֶץ אֲשֶׁר הִשְׁמִ֥יד אֱלֹהִ֖ים מִ/פְּנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/025.yaml
  text: But they acted unfaithfully against the God of their fathers and prostituted themselves after the gods of the peoples of the land[b][a], whom God had destroyed before them.
translation:
  language: pt
  text: Mas eles foram infiéis ao Deus de seus antepassados e se prostituíram, seguindo os deuses dos povos da terra[a], povos que Deus havia destruído de diante deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico usa uma metáfora sexual forte para a idolatria e a infidelidade à aliança. Também se pode traduzir: «prostituíram-se atrás dos deuses».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְעֲלוּ
  choice: agiram com infidelidade
  rationale: Expressa a quebra de lealdade no contexto religioso e pactual, sem recorrer ao arcaísmo «prevaricaram».
- source_word: בֵּאלֹהֵי אֲבוֹתֵיהֶם
  choice: contra o Deus de seus antepassados
  rationale: Com מָעַל, a preposição בְּ indica aquele contra quem se comete a infidelidade. «Antepassados» é mais claro e abrangente no português atual que o possível sentido estrito de «pais».
- source_word: וַיִּזְנוּ אַחֲרֵי
  choice: se prostituíram, seguindo
  rationale: Mantém a forte metáfora sexual de זנה e também comunica, em português natural, a ideia de seguir ou buscar expressa por אַחֲרֵי.
- source_word: אֱלֹהֵי עַמֵּי הָאָרֶץ
  choice: os deuses dos povos da terra
  rationale: Reproduz diretamente a cadeia construta e preserva «povos» para עַמֵּי.
- source_word: אֲשֶׁר הִשְׁמִיד אֱלֹהִים מִפְּנֵיהֶם
  choice: povos que Deus havia destruído diante deles
  rationale: Explicita que o relativo retoma os povos, não os deuses. O mais-que-perfeito composto assinala que essa destruição precedeu a infidelidade narrada.
theological_decisions:
- issue: Manutenção da metáfora sexual para a idolatria
  choice: se prostituíram, seguindo os deuses
  alternative: foram infiéis e seguiram os deuses
  rationale: O hebraico emprega deliberadamente זנה para retratar a idolatria como infidelidade relacional e pactual; uma formulação genérica enfraqueceria essa imagem.
- issue: Sentido singular de אֱלֹהִים na oração relativa
  choice: Deus havia destruído
  alternative: deuses haviam destruído
  rationale: O verbo singular הִשְׁמִיד identifica אֱלֹהִים como o Deus de Israel, apesar da forma morfologicamente plural do substantivo.
- issue: Antecedente da oração relativa
  choice: povos que Deus havia destruído
  alternative: os quais Deus havia destruído
  rationale: A explicitação evita que, em português, a oração seja entendida como referência aos deuses; no contexto, são os povos da terra que Deus havia destruído diante de Israel.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção «agiram com infidelidade» conserva o teor pactual; «se prostituíram, seguindo» mantém a metáfora hebraica sem produzir uma combinação preposicional pouco natural em português.
