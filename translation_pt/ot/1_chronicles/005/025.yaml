  naturalness: «Agiram com infidelidade contra» é compreensível, mas «foram infiéis ao» é mais idiomático em português moderno. A repetição de «povos» é aceitável e ajuda a impedir que a relativa seja ligada a «deuses».
  terminology: «Deus», «antepassados», «deuses», «povos da terra» e «se prostituíram, seguindo» são escolhas adequadas. A nota deve explicar a construção metafórica sem apresentar uma paráfrase pouco natural como se fosse alternativa direta.
