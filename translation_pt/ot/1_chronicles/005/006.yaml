source:
  edition: WLC
  text: בְּאֵרָ֣ה בְנ֔/וֹ אֲשֶׁ֣ר הֶגְלָ֔ה תִּלְּגַ֥ת פִּלְנְאֶ֖סֶר מֶ֣לֶךְ אַשֻּׁ֑ר ה֥וּא נָשִׂ֖יא לָ/רֽאוּבֵנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/006.yaml
  text: Beerah his son[a], whom Tilgath-pilneser king of Assyria carried away into exile—he was a chief of the Reubenites.
translation:
  language: pt
  text: Beerá, seu filho, a quem Tilgate-Pilneser[a], rei da Assíria, levou para o exílio — ele era chefe dos rubenitas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A forma hebraica do nome do rei assírio neste versículo é “Tilgate-Pilneser”; muitas traduções usam a forma histórica mais conhecida “Tiglate-Pileser”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵרָה
  choice: Beerá
  rationale: Nome próprio transliterado de modo claro para leitores de português, com acento para indicar a tonicidade final.
- source_word: בְנוֹ
  choice: seu filho
  rationale: O substantivo com sufixo de terceira pessoa retoma o antepassado citado no contexto genealógico; esta é a forma idiomática em português.
- source_word: אֲשֶׁר
  choice: a quem
  rationale: Introduz a oração relativa em que Beerá é o objeto humano do verbo de deportação.
- source_word: הֶגְלָה
  choice: levou para o exílio
  rationale: O hifil de גלה expressa a ação causativa de fazer alguém ir para o exílio; a formulação é natural e preserva esse sentido.
- source_word: תִּלְגַת פִּלְנְאֶסֶר
  choice: Tilgate-Pilneser
  rationale: Representa diretamente a forma hebraica específica deste versículo, sem harmonizá-la silenciosamente com a forma histórica mais conhecida.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: rei da Assíria
  rationale: Tradução natural da cadeia construta, em aposição ao nome do monarca.
- source_word: הוּא
  choice: ele
  rationale: Preserva o pronome independente e enfático que retoma Beerá depois da oração relativa.
- source_word: נָשִׂיא
  choice: chefe
  rationale: No contexto tribal, designa um líder reconhecido; “chefe” evita a conotação especificamente monárquica de “príncipe”.
- source_word: לָרְאוּבֵנִי
  choice: dos rubenitas
  rationale: O ל marca aqui a relação entre o chefe e o grupo tribal sob sua liderança.
theological_decisions: []
