  register: Português moderno, digno e acessível, com sintaxe próxima do hebraico sem sacrificar a naturalidade. O travessão destaca a retomada enfática de Beerá pelo pronome הוּא. O marcador da nota foi colocado junto ao nome a que ela se refere.
