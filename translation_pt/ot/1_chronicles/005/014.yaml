  text: אֵ֣לֶּה בְּנֵ֣י אֲבִיחַ֗יִל בֶּן חוּרִ֡י בֶּן יָ֠רוֹחַ בֶּן גִּלְעָ֧ד בֶּן מִיכָאֵ֛ל בֶּן יְשִׁישַׁ֥י בֶּן יַחְדּ֖וֹ בֶּן בּֽוּז׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/014.yaml
  text: These were the sons of Abihail son of Huri[a], son of Jaroah, son of Gilead, son of Michael, son of Jeshishai, son of Jahdo, son of Buz.
translation:
  language: pt
  text: Estes foram os filhos de Abiail, filho de Huri[a], filho de Jaroá, filho de Gileade, filho de Micael, filho de Jesisai, filho de Jado, filho de Buz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No hebraico, “filhos de” e a repetição de “filho de” podem designar uma linhagem familiar e não exigem necessariamente que todas as gerações estejam mencionadas.
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה
  choice: Estes foram
  rationale: O demonstrativo plural introduz a linhagem; o passado soa natural em português na apresentação de um registro genealógico.
- source_word: בְּנֵי
  choice: os filhos de
  rationale: Preserva o sentido direto e a estrutura formal do construto plural, sem eliminar sua possível abrangência genealógica, esclarecida em nota.
- source_word: אֲבִיחַיִל
  choice: Abiail
  rationale: Transliteração portuguesa tradicional e legível do nome próprio.
- source_word: בֶּן
  choice: filho de
  rationale: Reproduz a fórmula genealógica singular repetida no hebraico; a possibilidade de gerações não mencionadas é preservada em nota.
- source_word: חוּרִי
  choice: Huri
  rationale: Transliteração clara do nome próprio hebraico.
- source_word: יָרוֹחַ
  choice: Jaroá
  rationale: Forma adaptada à leitura portuguesa, representando o nome hebraico e sua consoante final sem grafia excessivamente técnica.
- source_word: גִּלְעָד
  choice: Gileade
  rationale: Forma portuguesa consagrada do nome próprio.
- source_word: מִיכָאֵל
  choice: Micael
  rationale: Transliteração portuguesa que conserva mais diretamente a forma hebraica do nome.
- source_word: יְשִׁישַׁי
  choice: Jesisai
  rationale: Transliteração legível em português, próxima da configuração consonantal e vocálica hebraica.
- source_word: יַחְדּוֹ
  choice: Jado
  rationale: Forma portuguesa legível do nome, evitando uma transliteração técnica com dígrafo incomum.
- source_word: בּוּז
  choice: Buz
  rationale: Transliteração direta e natural do nome próprio.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com nomes adaptados à leitura lusófona. A repetição de “filho de” foi mantida para preservar a cadência e a estrutura genealógica do hebraico; a nota conserva a flexibilidade semântica própria das genealogias bíblicas.
