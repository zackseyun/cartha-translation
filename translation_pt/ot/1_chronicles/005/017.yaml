base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/017.yaml
  text: All of them were enrolled by genealogy in the days of Jotham king of Judah[a], and in the days of Jeroboam king of Israel.
translation:
  language: pt
  text: Todos eles foram registrados genealogicamente[a] nos dias de Jotão, rei de Judá, e nos dias de Jeroboão, rei de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foram inscritos em registros genealógicos” ou “foram contados segundo a genealogia”. O verbo hebraico se refere à inclusão em um registro genealógico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: Todos eles
  rationale: Preserva a ideia de totalidade e a força explícita do sufixo pronominal masculino plural.
- source_word: הִתְיַחְשׂוּ
  choice: foram registrados genealogicamente
  rationale: O hitpael de יחשׂ em Crônicas se refere à inclusão ou ao cômputo de pessoas em registros genealógicos. A formulação expressa com clareza tanto o caráter administrativo quanto o genealógico.
- source_word: בִּימֵי ... וּבִימֵי
  choice: nos dias de ... e nos dias de
  rationale: Mantém o paralelismo e o idioma temporal hebraico, que também é compreensível e digno em português.
- source_word: יוֹתָם
  choice: Jotão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: מֶלֶךְ יְהוּדָה
  choice: rei de Judá
  rationale: Tradução direta da construção nominal hebraica.
- source_word: יָרָבְעָם
  choice: Jeroboão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: rei de Israel
  rationale: Tradução direta da construção nominal hebraica.
