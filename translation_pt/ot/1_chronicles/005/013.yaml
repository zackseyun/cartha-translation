base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/013.yaml
  text: 'And their brothers[a], according to their fathers’ houses: Michael, Meshullam, Sheba, Jorai, Jachan, Zia[d][c][b], and Eber—seven.'
translation:
  language: pt
  text: 'E seus irmãos[a], segundo as suas famílias paternas[b]: Micael, Mesulão, Seba, Jorai, Jaacã, Zia[c] e Éber — sete.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «parentes»; em genealogias, o termo hebraico para «irmãos» pode incluir outros parentes do mesmo clã.
    reason: lexical_alternative
  - marker: b
    text: Isto é, segundo as casas ancestrais de linhagem paterna.
    reason: cultural_note
  - marker: c
    text: Algumas tradições trazem «Ziza», por variação textual ou de transliteração.
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: E seus irmãos
  rationale: Preserva o sentido direto do hebraico, que em contexto genealógico também pode abranger parentes do mesmo clã.
- source_word: לְבֵית אֲבוֹתֵיהֶם
  choice: segundo as suas famílias paternas
  rationale: Expressa de modo natural a organização por casas ancestrais de linhagem paterna, evitando a tradução pouco idiomática «casas de seus pais».
- source_word: מִיכָאֵל
  choice: Micael
  rationale: Transliteração portuguesa tradicional do nome hebraico.
- source_word: וּמְשֻׁלָּם
  choice: Mesulão
  rationale: Forma portuguesa bíblica corrente para o nome hebraico.
- source_word: וְשֶׁבַע
  choice: Seba
  rationale: Transliteração legível e próxima da forma massorética do nome pessoal.
- source_word: וְיוֹרַי
  choice: Jorai
  rationale: Transliteração direta do nome hebraico, adequada ao português.
- source_word: וְיַעְכָּן
  choice: Jacã
  rationale: Transliteração portuguesa concisa da forma massorética yaʿkan.
- source_word: וְזִיעַ
  choice: Zia
  rationale: Segue a vocalização massorética do WLC; a variante «Ziza» não corresponde diretamente ao texto hebraico fornecido.
- source_word: וָעֵבֶר
  choice: e Éber
  rationale: Forma portuguesa convencional do nome, com acento para indicar a pronúncia.
- source_word: שִׁבְעָה
  choice: sete
  rationale: Número cardinal que recapitula a quantidade de homens enumerados; o travessão destaca sua função resumitiva.
