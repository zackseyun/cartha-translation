  text: בְּנֵֽי רְאוּבֵ֨ן וְ/גָדִ֜י וַ/חֲצִ֥י שֵֽׁבֶט מְנַשֶּׁה֮ מִן בְּנֵי חַיִל֒ אֲ֠נָשִׁים נֹשְׂאֵ֨י מָגֵ֤ן וְ/חֶ֨רֶב֙ וְ/דֹ֣רְכֵי קֶ֔שֶׁת וּ/לְמוּדֵ֖י מִלְחָמָ֑ה אַרְבָּעִ֨ים וְ/אַרְבָּעָ֥ה אֶ֛לֶף וּ/שְׁבַע מֵא֥וֹת וְ/שִׁשִּׁ֖ים יֹצְאֵ֥י צָבָֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/018.yaml
  text: The sons of Reuben and the Gadites and the half-tribe of Manasseh[a], valiant men, men who carried shield and sword, who drew the bow, and who were trained for war, were forty-four thousand seven hundred sixty[c][b], able to go out to war.
translation:
  language: pt
  text: Os filhos de Rúben, os gaditas e a meia tribo de Manassés tinham 44.760 homens valentes[a], que portavam escudo e espada, manejavam o arco[b], eram treinados para a guerra e estavam aptos para sair em campanha militar[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “homens poderosos” ou “homens de valor”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “pisavam” ou “vergavam o arco”, expressão hebraica referente ao manejo do arco para atirar.
    reason: cultural_note
  - marker: c
    text: Ou “aptos para o serviço militar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי רְאוּבֵן
  choice: Os filhos de Rúben
  rationale: Mantém a forma explícita de parentesco do hebraico, embora no contexto designe os descendentes e membros da tribo de Rúben.
- source_word: וְגָדִי
  choice: os gaditas
  rationale: A forma gentílica hebraica indica os membros da tribo de Gade, não o patriarca individual.
- source_word: וַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: a meia tribo de Manassés
  rationale: Expressão corrente e clara que preserva a designação tribal do texto.
- source_word: מִן בְּנֵי חַיִל
  choice: homens valentes
  rationale: No contexto militar, a expressão descreve homens capazes e valorosos; a construção foi integrada naturalmente à indicação do contingente.
- source_word: נֹשְׂאֵי מָגֵן וְחֶרֶב
  choice: que portavam escudo e espada
  rationale: Preserva a imagem concreta do particípio hebraico, que significa levar ou portar armas.
- source_word: וְדֹרְכֵי קֶשֶׁת
  choice: manejavam o arco
  rationale: Comunica em português natural a ação militar expressa pelo idioma hebraico de pisar ou vergar o arco, sem reduzi-la simplesmente a 'arqueiros'.
- source_word: וּלְמוּדֵי מִלְחָמָה
  choice: eram treinados para a guerra
  rationale: Reproduz o sentido passivo e resultativo de homens instruídos ou exercitados na guerra.
- source_word: אַרְבָּעִים וְאַרְבָּעָה אֶלֶף וּשְׁבַע מֵאוֹת וְשִׁשִּׁים
  choice: '44.760'
  rationale: Apresenta com clareza, na convenção numérica do português, o total exato de quarenta e quatro mil setecentos e sessenta.
- source_word: יֹצְאֵי צָבָא
  choice: aptos para sair em campanha militar
  rationale: Conserva a imagem de 'sair' com as forças militares e explicita que se trata de homens habilitados ou disponíveis para o serviço de guerra.
