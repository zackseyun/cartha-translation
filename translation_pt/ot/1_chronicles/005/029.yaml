base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/029.yaml
  text: 'The sons of Amram: Aaron[a], Moses, and Miriam; and the sons of Aaron: Nadab and Abihu, Eleazar and Ithamar.'
translation:
  language: pt
  text: 'Os filhos[a] de Anrão: Arão, Moisés e Miriã; e os filhos de Arão: Nadabe, Abiú, Eleazar e Itamar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «filhos de». Neste contexto genealógico, o termo introduz os descendentes ou filhos de Anrão; a própria lista inclui Miriã, além de Arão e Moisés.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי עַמְרָם
  choice: Os filhos de Anrão
  rationale: O plural construto בְּנֵי introduz a lista genealógica. A conjunção inicial não precisa ser reproduzida isoladamente em português, pois o segmento funciona como cabeçalho de uma lista. Adota-se a forma portuguesa tradicional do nome Anrão.
- source_word: אַהֲרֹן וּמֹשֶׁה וּמִרְיָם
  choice: Arão, Moisés e Miriã
  rationale: Os nomes seguem as formas portuguesas bíblicas correntes. As conjunções hebraicas repetidas são representadas pela coordenação natural do português, com vírgulas e «e» antes do último elemento.
- source_word: וּבְנֵי אַהֲרֹן
  choice: e os filhos de Arão
  rationale: A conjunção é mantida para ligar a segunda lista genealógica à primeira.
- source_word: נָדָב וַאֲבִיהוּא אֶלְעָזָר וְאִיתָמָר
  choice: Nadabe, Abiú, Eleazar e Itamar
  rationale: Empregam-se formas portuguesas estabelecidas dos nomes e uma enumeração idiomática, sem alterar a composição da lista.
theological_decisions:
- issue: Uso de «filhos» numa lista que inclui Miriã
  choice: Manter «filhos», com nota explicativa
  alternative: Traduzir por «filhos e filha» ou «descendentes»
  rationale: O hebraico usa literalmente o plural masculino בְּנֵי. Alterá-lo no texto principal resolveria uma tensão presente na forma genealógica da fonte; a nota esclarece que Miriã também está incluída.
translation_notes:
  register: Português moderno, claro e digno, com pontuação de lista para preservar a estrutura nominal concisa do hebraico. Os nomes próprios seguem formas bíblicas amplamente reconhecidas em português.
