lexical_decisions:
- source_word: וְ
  choice: '[não traduzido]'
  rationale: A conjunção liga esta frase à genealogia anterior. Em português, no início deste versículo, omiti-la produz uma sequência genealógica mais natural sem perder a continuidade do hebraico.
- source_word: שַׁלּוּם
  choice: Salum
  rationale: Transliteração portuguesa tradicional e amplamente reconhecível do nome hebraico.
- source_word: הוֹלִיד
  choice: gerou
  rationale: No hifil e em contexto genealógico, o verbo indica gerar ou tornar-se pai de alguém. “Gerou” é conciso, corrente em genealogias bíblicas e preserva a linhagem paterna.
- source_word: אֶת
  choice: '[não traduzido]'
  rationale: Marcador hebraico de objeto direto, sem equivalente lexical necessário em português.
- source_word: חִלְקִיָּה
  choice: Hilquias
  rationale: Forma portuguesa tradicional e legível do nome hebraico, usada de modo consistente nas duas ocorrências.
- source_word: וְ
  choice: e
  rationale: A conjunção coordena o elo genealógico seguinte sem acrescentar valor temporal ou explicativo.
- source_word: עֲזַרְיָה
  choice: Azarias
  rationale: Forma portuguesa tradicional, clara e amplamente reconhecida do nome hebraico.
