id: 1CH.5.22
reference: 1 Chronicles 5:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי חֲלָלִ֤ים רַבִּים֙ נָפָ֔לוּ כִּ֥י מֵ/הָ/אֱלֹהִ֖ים הַ/מִּלְחָמָ֑ה וַ/יֵּשְׁב֥וּ תַחְתֵּי/הֶ֖ם עַד הַ/גֹּלָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/022.yaml
  text: For many slain fell[a], because the battle was from God; and they lived in their place until the exile.
translation:
  language: pt
  text: Pois muitos caíram mortos, porque a batalha vinha de Deus[a]; e eles passaram a morar no lugar dos vencidos até o exílio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a batalha pertencia a Deus”. A expressão hebraica ressalta que o desfecho da batalha procedeu de Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da vitória narrada anteriormente e preserva o valor causal de modo natural em português.
- source_word: חֲלָלִים רַבִּים נָפָלוּ
  choice: muitos caíram mortos
  rationale: Combina o sentido militar de חֲלָלִים, pessoas mortas ou mortalmente feridas em combate, com o verbo נפל, sem produzir a expressão pouco natural 'muitos mortos caíram'.
- source_word: כִּי
  choice: porque
  rationale: Explicita a relação causal entre as numerosas mortes e a origem divina da batalha.
- source_word: מֵהָאֱלֹהִים הַמִּלְחָמָה
  choice: a batalha vinha de Deus
  rationale: Preserva a preposição de origem מִן e a formulação incomum do hebraico, atribuindo a Deus a procedência ou o resultado decisivo da batalha sem ampliar a afirmação.
- source_word: וַיֵּשְׁבוּ
  choice: passaram a morar
  rationale: Neste contexto, ישב descreve a ocupação duradoura do território conquistado; a formulação comunica tanto residência quanto início de assentamento.
- source_word: תַחְתֵּיהֶם
  choice: no lugar dos vencidos
  rationale: O idioma indica substituição dos habitantes derrotados, e não localização física 'debaixo deles'. 'Dos vencidos' torna claro o referente contextual do pronome.
- source_word: עַד הַגֹּלָה
  choice: até o exílio
  rationale: גּוֹלָה designa o exílio ou deportação posterior das tribos; 'exílio' é a forma histórica, concisa e corrente.
theological_decisions:
- issue: Participação divina na guerra
  choice: a batalha vinha de Deus
  alternative: a batalha pertencia a Deus
  rationale: A tradução mantém a afirmação explícita de que a batalha tinha em Deus sua origem ou determinação, mas não desenvolve além do texto uma teologia mais abrangente de guerra santa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção 'caíram mortos' conserva a linguagem de combate sem soar arcaica; 'passaram a morar' expressa ocupação territorial de maneira acessível.
