source:
  edition: WLC
  text: וְ/אֵ֖לֶּה רָאשֵׁ֣י בֵית אֲבוֹתָ֑/ם וְ/עֵ֡פֶר וְ/יִשְׁעִ֡י וֶ/אֱלִיאֵ֡ל וְ֠/עַזְרִיאֵל וְ/יִרְמְיָ֨ה וְ/הוֹדַוְיָ֜ה וְ/יַחְדִּיאֵ֗ל אֲנָשִׁים֙ גִּבּ֣וֹרֵי חַ֔יִל אַנְשֵׁ֣י שֵׁמ֔וֹת רָאשִׁ֖ים לְ/בֵ֥ית אֲבוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/024.yaml
  text: 'These were the heads of their fathers’ houses: Epher[a], Ishi, Eliel, Azriel, Jeremiah, Hodaviah, and Jahdiel, mighty men of valor, men of renown[b], heads of their fathers’ houses.'
translation:
  language: pt
  text: 'Estes eram os chefes de suas casas ancestrais[a]: Éfer, Isi, Eliel, Azriel, Jeremias, Hodavias e Jadiel. Eram homens valentes e poderosos, homens de renome[b] e chefes de suas casas ancestrais.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, grupos familiares ou clãs ligados a um antepassado comum.
    reason: cultural_note
  - marker: b
    text: Em hebraico, literalmente, “homens de nomes”, isto é, homens notáveis ou distintos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Estes eram
  rationale: Introduz de modo natural a lista genealógica; a conjunção hebraica é absorvida no português sem perda do vínculo contextual.
- source_word: רָאשֵׁי בֵית אֲבוֹתָם
  choice: os chefes de suas casas ancestrais
  rationale: Expressa as unidades familiares organizadas segundo um antepassado comum, evitando a leitura estritamente doméstica que 'casas de seus pais' poderia sugerir em português moderno.
- source_word: עֵפֶר
  choice: Éfer
  rationale: Transliteração portuguesa direta do nome hebraico.
- source_word: יִשְׁעִי
  choice: Isi
  rationale: Transliteração legível em português, mantendo aproximadamente a forma hebraica.
- source_word: אֱלִיאֵל
  choice: Eliel
  rationale: Forma tradicional e direta em português.
- source_word: עַזְרִיאֵל
  choice: Azriel
  rationale: Transliteração direta e reconhecível em português.
- source_word: יִרְמְיָה
  choice: Jeremias
  rationale: Forma portuguesa consagrada do nome.
- source_word: הוֹדַוְיָה
  choice: Hodavias
  rationale: Transliteração conservadora adaptada à forma portuguesa dos nomes terminados em -ias.
- source_word: יַחְדִּיאֵל
  choice: Jadiel
  rationale: Forma portuguesa legível que representa o nome hebraico sem importar uma grafia inglesa.
- source_word: אֲנָשִׁים גִּבּוֹרֵי חַיִל
  choice: homens valentes e poderosos
  rationale: O sintagma indica força, coragem e capacidade, frequentemente militar; esta formulação preserva sua amplitude sem restringi-lo explicitamente a 'guerreiros'.
- source_word: אַנְשֵׁי שֵׁמוֹת
  choice: homens de renome
  rationale: Traduz naturalmente o idiomatismo literal 'homens de nomes', indicando pessoas notáveis ou distintas.
- source_word: רָאשִׁים לְבֵית אֲבוֹתָם
  choice: chefes de suas casas ancestrais
  rationale: Mantém a repetição deliberada do texto hebraico e reafirma a posição dos homens na estrutura dos clãs.
theological_decisions: []
