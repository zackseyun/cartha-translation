base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/021.yaml
  text: 'They captured their livestock: 50,000 camels[a], 250,000 sheep, 2,000 donkeys, and 100,000 people.'
translation:
  language: pt
  text: 'Eles capturaram os animais deles: 50.000 camelos, 250.000 ovelhas, 2.000 jumentos e 100.000 pessoas[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “alma humana” ou “pessoa humana” (נֶפֶשׁ אָדָם); isto é, 100.000 pessoas levadas cativas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: Eles capturaram
  rationale: O verbo שׁבה indica tomar como presa ou levar cativo. “Capturaram” funciona naturalmente tanto para os animais quanto para as pessoas enumeradas.
- source_word: מִקְנֵיהֶם
  choice: os animais deles
  rationale: מִקְנֶה pode designar gado, rebanhos ou bens adquiridos; a lista seguinte especifica animais. “Os animais deles” é abrangente e claro, sem restringir a expressão ao gado bovino.
- source_word: גְּמַלֵּיהֶם
  choice: camelos
  rationale: Tradução direta do substantivo plural; a relação possessiva já está expressa em “os animais deles”.
- source_word: וְצֹאן
  choice: ovelhas
  rationale: צֹאן designa coletivamente animais de pequeno porte, sobretudo ovelhas e cabras. “Ovelhas” é a tradução tradicional e provável neste inventário, embora o termo hebraico possa ser mais abrangente.
- source_word: וַחֲמוֹרִים
  choice: jumentos
  rationale: Termo corrente e digno em português para חֲמוֹרִים.
- source_word: וְנֶפֶשׁ אָדָם
  choice: pessoas[a]
  rationale: A expressão significa literalmente algo como “pessoa humana” ou “ser humano” e, no contexto, designa pessoas levadas cativas. A tradução natural é “pessoas”, com nota preservando a forma do hebraico.
- source_word: מֵאָה אָלֶף
  choice: '100.000'
  rationale: A forma numérica favorece a leitura e mantém consistência com as demais quantidades do versículo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com números em algarismos e separador de milhares conforme o uso brasileiro. “Os animais deles” evita o sentido excessivamente estreito que “gado” pode ter e explicita de modo natural o sufixo possessivo hebraico.
