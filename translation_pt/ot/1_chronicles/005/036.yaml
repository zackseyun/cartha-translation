base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/036.yaml
  text: And Johanan fathered Azariah[a]; he was the one who served as priest in the house that Solomon built in Jerusalem.
translation:
  language: pt
  text: E Joanã gerou Azarias; foi ele quem serviu como sacerdote na casa[a] que Salomão construiu em Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no templo”; em hebraico, “na casa”, uma forma comum de se referir ao templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹחָנָן
  choice: E Joanã
  rationale: O ו preserva a sequência genealógica; Joanã é a forma portuguesa tradicional e legível do nome.
- source_word: הוֹלִיד אֶת עֲזַרְיָה
  choice: gerou Azarias
  rationale: No hifil e em contexto genealógico, ילד indica gerar ou tornar-se pai de; “gerou” é conciso e digno, sem o arcaísmo de “procriou”.
- source_word: הוּא אֲשֶׁר
  choice: ele foi quem
  rationale: Reproduz a ênfase identificadora do pronome retomado sem tornar a frase artificial em português.
- source_word: כִּהֵן
  choice: serviu como sacerdote
  rationale: Preserva a força verbal de exercer o sacerdócio, em vez de apenas indicar condição ou título.
- source_word: בַּ/בַּיִת
  choice: na Casa
  rationale: Mantém o termo hebraico “casa”; a inicial maiúscula sinaliza naturalmente que se trata da Casa de Deus, identificada no contexto como o templo.
- source_word: אֲשֶׁר בָּנָה שְׁלֹמֹה
  choice: que Salomão construiu
  rationale: Tradução direta e natural da oração relativa.
- source_word: בִּ/ירוּשָׁלִָם
  choice: em Jerusalém
  rationale: Forma portuguesa padrão do topônimo, com a preposição preservada.
