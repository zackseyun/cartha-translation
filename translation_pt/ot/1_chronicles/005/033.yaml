lexical_decisions:
- source_word: מְרָיוֹת
  choice: Meraiote
  rationale: Nome próprio transliterado segundo a forma bíblica tradicional e reconhecível em português.
- source_word: הוֹלִיד
  choice: gerou
  rationale: No contexto genealógico, o hifil de ילד indica geração ou descendência paterna; “gerou” é conciso, digno e corrente na linguagem bíblica portuguesa.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: Marcador hebraico de objeto direto, sem equivalente lexical independente em português; sua função é expressa pela sintaxe.
- source_word: אֲמַרְיָה
  choice: Amarias
  rationale: Nome próprio vertido na forma tradicional amplamente reconhecida em português.
- source_word: וַ/אֲמַרְיָה
  choice: e Amarias
  rationale: O waw é traduzido pela coordenação simples “e”, enquanto o nome conserva sua forma portuguesa tradicional.
- source_word: הוֹלִיד
  choice: gerou
  rationale: A repetição do verbo genealógico é mantida para reproduzir a estrutura e a clareza do hebraico.
- source_word: אֲחִיטוּב
  choice: Aitube
  rationale: Nome próprio vertido na forma bíblica tradicional em português, com adaptação fonológica e ortográfica estabelecida.
