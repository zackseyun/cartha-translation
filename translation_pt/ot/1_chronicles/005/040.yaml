lexical_decisions:
- source_word: וַ/עֲזַרְיָה
  choice: Azarias
  rationale: Nome próprio vertido segundo a forma bíblica tradicional e amplamente reconhecível em português.
- source_word: הוֹלִיד
  choice: gerou
  rationale: No contexto genealógico, o hifil de ילד indica paternidade; “gerou” é conciso, digno e corrente na linguagem bíblica portuguesa.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: Marcador hebraico de objeto direto, representado naturalmente pela sintaxe portuguesa.
- source_word: שְׂרָיָה
  choice: Seraías
  rationale: Transliteração portuguesa convencional do nome próprio hebraico.
- source_word: וּ/שְׂרָיָה
  choice: e Seraías
  rationale: A conjunção prefixada וּ é traduzida por “e”, ligando as duas declarações genealógicas.
- source_word: הוֹלִיד
  choice: gerou
  rationale: A repetição do verbo genealógico é preservada para manter a clareza e o paralelismo do original.
- source_word: יְהוֹצָדָק
  choice: Jeozadaque
  rationale: Forma portuguesa reconhecível que representa o nome hebraico e se ajusta à ortografia portuguesa.
