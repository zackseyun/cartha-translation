  text: וַ/יֵּֽשְׁב֛וּ בַּ/גִּלְעָ֥ד בַּ/בָּשָׁ֖ן וּ/בִ/בְנֹתֶ֑י/הָ וּ/בְ/כָֽל מִגְרְשֵׁ֥י שָׁר֖וֹן עַל תּוֹצְאוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/016.yaml
  text: They lived in Gilead[a], in Bashan and its towns, and in all the pasturelands of Sharon[c][b], as far as their borders.
translation:
  language: pt
  text: Eles moravam em Gileade, em Basã e nas localidades dependentes dela[a], bem como em todas as pastagens de Sarom[b], até os seus limites[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “filhas dela”, expressão hebraica que designa localidades, vilas ou povoações dependentes.
    reason: lexical_alternative
  - marker: b
    text: Ou “terras abertas” ou “terras comunais de Sarom”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “sobre as suas saídas”, isto é, até suas extremidades ou fronteiras.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: Eles moravam
  rationale: ישב, neste aviso geográfico, indica residência contínua. “Moravam” é natural em português moderno e evita tanto o tom arcaico de “habitavam” quanto a possível ênfase de “estabeleceram-se” no início da ocupação.
- source_word: בַּגִּלְעָד
  choice: em Gileade
  rationale: Forma consagrada em português para o nome geográfico.
- source_word: בַּבָּשָׁן
  choice: em Basã
  rationale: Forma consagrada em português para o nome geográfico.
- source_word: וּבִבְנֹתֶיהָ
  choice: e nas localidades dependentes dela
  rationale: Literalmente, “e em suas filhas”; trata-se de um idioma hebraico para povoações subordinadas ou vinculadas. O sufixo feminino singular remete mais naturalmente a Basã, o antecedente imediato. “Localidades dependentes” preserva essa relação melhor que o genérico “cidades”.
- source_word: וּבְכָל מִגְרְשֵׁי
  choice: bem como em todas as pastagens de
  rationale: מִגְרָשׁ designa terras abertas ao redor de povoações, muitas vezes usadas para pastoreio. “Pastagens” é claro e adequado ao contexto territorial, enquanto a nota registra alternativas mais amplas.
- source_word: שָׁרוֹן
  choice: Sarom
  rationale: Forma tradicional e amplamente reconhecida em português para o topônimo.
- source_word: עַל תּוֹצְאוֹתָם
  choice: até os seus limites
  rationale: A expressão, literalmente relacionada às “saídas” ou extremidades, tem sentido espacial e indica a extensão exterior. O pronome plural permanece deliberadamente sem explicitação, como no hebraico.
theological_decisions: []
translation_notes:
  register: 'Português moderno, digno e de leitura ampla, com formas toponímicas correntes no uso bíblico lusófono. A tradução busca equivalência ótima: torna explícito o idioma de “filhas” sem eliminar sua nota literal e conserva a leve ambiguidade do referente em “seus limites”.'
