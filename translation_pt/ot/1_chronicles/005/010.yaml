base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/010.yaml
  text: In the days of Saul they made war with the Hagrites[a], and they fell into their hand[b]; and they lived in their tents throughout all the region east of Gilead.
translation:
  language: pt
  text: Nos dias de Saul, eles guerrearam contra os hagarenos[a], que caíram em suas mãos[b], e moraram nas tendas deles por toda a região a leste de Gileade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “hagritas”. O nome hebraico provavelmente designa um povo associado a Hagar.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “caíram em suas mãos”, isto é, ficaram sob o poder deles. Pelo contexto, quem caiu foram os hagarenos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִימֵי שָׁאוּל
  choice: Nos dias de Saul
  rationale: Reproduz de modo natural e digno o idioma hebraico que indica o período em que Saul viveu ou reinou.
- source_word: עָשׂוּ מִלְחָמָה עִם
  choice: guerrearam contra
  rationale: A expressão hebraica significa travar guerra; em português, “contra” explicita naturalmente a relação adversativa indicada pelo contexto.
- source_word: הַהַגְרִאִים
  choice: os hagarenos
  rationale: Forma portuguesa reconhecível para o etnônimo hebraico, provavelmente associado a Hagar; a nota registra uma transliteração alternativa.
- source_word: וַיִּפְּלוּ בְּיָדָם
  choice: que caíram em suas mãos
  rationale: Preserva a imagem idiomática hebraica de cair sob o poder de alguém, deixando claro pelo relativo que o sujeito são os hagarenos.
- source_word: וַיֵּשְׁבוּ בְּאָהֳלֵיהֶם
  choice: então passaram a morar nas tendas deles
  rationale: O verbo ישב, neste contexto de ocupação após a vitória, indica habitar ou estabelecer residência, sem necessariamente afirmar permanência definitiva. “Deles” mantém a referência provável aos hagarenos.
- source_word: עַל כָּל פְּנֵי מִזְרָח לַגִּלְעָד
  choice: por toda a região a leste de Gileade
  rationale: Expressa em português corrente a extensão espacial do idioma hebraico e a localização oriental em relação a Gileade.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A formulação preserva a imagem hebraica de “cair nas mãos”, esclarecida em nota, e evita arcaísmos como “habitaram” ou “fizeram guerra” quando uma expressão corrente comunica melhor o sentido.
