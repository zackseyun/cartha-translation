lexical_decisions:
- source_word: מִיכָה
  choice: Mica
  rationale: Nome próprio transliterado segundo a forma tradicional e natural em português.
- source_word: בְנֹו
  choice: seu filho
  rationale: O substantivo com sufixo masculino singular significa literalmente «seu filho»; a repetição preserva a estrutura da cadeia genealógica.
- source_word: רְאָיָה
  choice: Reaías
  rationale: Nome próprio transliterado em uma forma consagrada e reconhecível em português.
- source_word: בַּעַל
  choice: Baal
  rationale: No contexto desta genealogia, a palavra funciona como nome pessoal; por isso, é transliterada, e não traduzida como título.
theological_decisions:
- issue: Se בַּעַל deve ser traduzido como título ou mantido como nome pessoal
  choice: Manter o nome pessoal «Baal»
  alternative: Traduzir como «senhor»
  rationale: A posição do termo em uma sequência genealógica indica que ele é um nome próprio. Traduzir como «senhor» obscureceria a sintaxe e acrescentaria ao texto uma interpretação desnecessária.
translation_notes:
  register: Português moderno, claro e digno, com pontuação que evidencia cada elo da genealogia. O marcador da nota foi colocado após «Baal», termo ao qual a explicação se refere.
