  source_fidelity: 'A tradução preserva os elementos essenciais: Miclote como pai de Simeia, a inclusão enfática de «eles também», a residência em Jerusalém e a repetição de «seus irmãos». Contudo, a ordem de «em Jerusalém» antes de «em frente aos seus irmãos» afasta-se da construção hebraica, na qual a relação expressa por נֶגֶד antecede a localização em Jerusalém.'
  naturalness: «Moravam» e «junto com» são naturais no registro solicitado. «Diante de seus irmãos, em Jerusalém, com seus irmãos» mantém a sequência do original e a tensão aparentemente redundante entre a posição «diante de» e a companhia «com», sem tentar harmonizá-la.
  terminology: «Miclote» e «Simeia» são formas portuguesas aceitáveis dos nomes. «Irmãos» traduz adequadamente אֲחֵיהֶם, com a nota explicando seu possível alcance clânico. A alternativa para נֶגֶד é devidamente preservada em nota.
