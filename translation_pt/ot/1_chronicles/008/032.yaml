  text: Mikloth fathered Shimeah[a]. They too lived opposite their brothers in Jerusalem[b], with their brothers.
translation:
  language: pt
  text: Miclote gerou Simeia. Eles também moravam em frente aos seus irmãos, em Jerusalém, junto com seus irmãos.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “perto de seus irmãos”; a preposição hebraica pode indicar uma posição diante de alguém, em frente a alguém ou nas proximidades.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “irmãos” provavelmente se refere a membros do mesmo clã ou a parentes dentro da genealogia benjaminita, e não necessariamente apenas a irmãos biológicos.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִקְלוֹת
  choice: Miclote
  rationale: Transliteração portuguesa corrente do nome próprio; a conjunção prefixada fica implícita na sequência genealógica, evitando um início artificial.
- source_word: הוֹלִיד
  choice: gerou
  rationale: Expressa de modo conciso e atual o sentido genealógico masculino de gerar ou tornar-se pai de.
- source_word: אֶת שִׁמְאָה
  choice: Simeia
  rationale: O marcador de objeto direto não é traduzido; emprega-se uma forma portuguesa reconhecível do nome próprio.
- source_word: וְאַף הֵמָּה
  choice: Eles também
  rationale: Preserva a força inclusiva e enfática da combinação hebraica em português natural.
- source_word: נֶגֶד
  choice: em frente aos
  rationale: Mantém a relação espacial concreta do hebraico sem reduzi-la apenas à ideia de proximidade.
- source_word: אֲחֵיהֶם
  choice: seus irmãos
  rationale: Reproduz o termo hebraico literalmente; neste contexto genealógico, ele pode abranger parentes ou membros do mesmo clã.
- source_word: יָשְׁבוּ
  choice: moravam
  rationale: Forma moderna e natural para indicar residência habitual.
- source_word: בִּירוּשָׁלִַם
  choice: em Jerusalém
  rationale: Forma portuguesa consagrada do topônimo com a preposição exigida pelo contexto.
- source_word: עִם אֲחֵיהֶם
  choice: junto com seus irmãos
  rationale: Traduz עִם com clareza e conserva a repetição de 'irmãos', presente no hebraico.
