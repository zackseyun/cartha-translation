  text: These were heads of fathers’ houses according to their generations[a], chief men. These lived in Jerusalem.
translation:
  language: pt
  text: Estes eram os chefes das casas paternas, segundo as suas gerações[a], os principais. Estes moravam em Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “segundo as suas genealogias”. O hebraico repete a palavra relacionada a “cabeça/chefe” para dar ênfase.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי אָבוֹת
  choice: chefes das casas paternas
  rationale: Preserva o idioma social hebraico que designa os líderes de unidades ancestrais ou familiares, com formulação compreensível em português.
- source_word: לְתֹלְדוֹתָם
  choice: segundo as suas gerações
  rationale: Mantém o sentido genealógico formal de linhagens ou gerações sem pressupor explicitamente registros escritos.
- source_word: רָאשִׁים
  choice: os principais
  rationale: Conserva a ênfase produzida pela repetição da raiz רֹאשׁ, evitando uma repetição excessivamente dura de “chefes” em português.
- source_word: יָשְׁבוּ
  choice: moravam
  rationale: Neste contexto genealógico, o verbo indica residência habitual, não o ato de sentar-se.
- source_word: בִירוּשָׁלָם
  choice: em Jerusalém
  rationale: Forma portuguesa padrão do topônimo, preservando a preposição.
- source_word: אֵלֶּה ... אֵלֶּה
  choice: Estes ... Estes
  rationale: Retém a repetição estrutural e enfática dos demonstrativos hebraicos.
