  text: וַֽ/יִּהְי֣וּ בְנֵי א֠וּלָם אֲנָשִׁ֨ים גִּבֹּרֵי חַ֜יִל דֹּ֣רְכֵי קֶ֗שֶׁת וּ/מַרְבִּ֤ים בָּנִים֙ וּ/בְנֵ֣י בָנִ֔ים מֵאָ֖ה וַ/חֲמִשִּׁ֑ים כָּל אֵ֖לֶּה מִ/בְּנֵ֥י בִנְיָמִֽן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/040.yaml
  text: The sons of Ulam were mighty men of valor[a], drawers of the bow, and had many sons and grandsons, one hundred and fifty[c][b]. All these were from the sons of Benjamin.
translation:
  language: pt
  text: Os filhos de Ulão eram homens valentes e poderosos, arqueiros, e tiveram muitos filhos e netos, cento e cinquenta ao todo. Todos esses eram descendentes de Benjamim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «estavam entre os filhos de Benjamim», isto é, pertenciam à tribo de Benjamim.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: eram
  rationale: O wayyiqtol de היה introduz uma descrição dos filhos de Ulão; «eram» é natural no resumo genealógico.
- source_word: בְנֵי אוּלָם
  choice: Os filhos de Ulão
  rationale: Mantém a cadeia construta e o estilo genealógico formal em português.
- source_word: אֲנָשִׁים גִּבֹּרֵי חַיִל
  choice: homens valentes e poderosos
  rationale: Expressa força, capacidade e bravura, inclusive a provável conotação militar, sem recorrer a uma formulação arcaica.
- source_word: דֹּרְכֵי קֶשֶׁת
  choice: arqueiros
  rationale: A expressão significa literalmente os que vergam ou manejam o arco; «arqueiros» comunica de modo claro e natural o sentido idiomático.
- source_word: וּמַרְבִּים בָּנִים וּבְנֵי בָנִים
  choice: e tiveram muitos filhos e netos
  rationale: O particípio hifil de רבה indica aqui abundância de descendentes; «netos» traduz naturalmente «filhos dos filhos».
- source_word: מֵאָה וַחֲמִשִּׁים
  choice: cento e cinquenta ao todo
  rationale: O número aparece após filhos e netos; «ao todo» deixa claro, sem alterar o sentido, que se trata do total do grupo mencionado.
- source_word: כָּל אֵלֶּה
  choice: Todos esses
  rationale: Preserva a expressão resumitiva que encerra a genealogia.
- source_word: מִבְּנֵי בִנְיָמִן
  choice: eram descendentes de Benjamim
  rationale: A construção מן + בני indica origem ou filiação tribal; a formulação escolhida é clara e idiomática.
theological_decisions:
- issue: Sentido de מִבְּנֵי בִנְיָמִן
  choice: descendentes de Benjamim
  alternative: entre os filhos de Benjamim
  rationale: O contexto genealógico favorece descendência tribal, mas a nota preserva a alternativa estrutural mais próxima do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «Ulão» segue a forma portuguesa tradicional do nome; «arqueiros» evita o literalismo pouco natural «os que vergavam o arco».
