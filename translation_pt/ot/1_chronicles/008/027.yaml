lexical_decisions:
- source_word: יַעֲרֶשְׁיָה
  choice: Jaaresias
  rationale: Nome próprio transliterado em forma portuguesa, preservando a configuração do hebraico e adotando a terminação tradicional portuguesa -ias.
- source_word: אֵלִיָּה
  choice: Elias
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: זִכְרִי
  choice: Zicri
  rationale: Transliteração corrente e clara em português, sem traduzir o nome próprio.
- source_word: בְּנֵי
  choice: filhos de
  rationale: O plural construto de בֵּן significa mais diretamente “filhos de”; os três indivíduos nomeados são homens, embora o termo possa ter alcance genealógico mais amplo.
- source_word: יְרֹחָם
  choice: Jeroão
  rationale: Forma aportuguesada tradicional do nome hebraico, adequada à leitura corrente.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com formas tradicionais dos nomes bíblicos. O verbo “eram” foi explicitado naturalmente, pois a oração nominal hebraica não contém verbo expresso. O marcador foi colocado após a frase porque a nota esclarece o alcance genealógico de “filhos de Jeroão”.
