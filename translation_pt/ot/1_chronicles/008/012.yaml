base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/012.yaml
  text: 'The sons of Elpaal: Eber[a], Misham, and Shemed[b]; he built Ono and Lod and its villages.'
translation:
  language: pt
  text: 'Os filhos de Elpaal: Éber, Misã e Semede. Foi ele[a] quem construiu Ono, Lode e os povoados que dela dependiam[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ele” provavelmente se refere a Semede, o último filho mencionado, embora também possa se referir de modo mais amplo à linhagem familiar.
    reason: alternative_reading
  - marker: b
    text: Literalmente, “e suas filhas”, expressão hebraica que indica os povoados dependentes de uma cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אֶלְפַּעַל
  choice: Os filhos de Elpaal
  rationale: A construção hebraica introduz uma lista genealógica. A conjunção inicial não precisa ser expressa em português neste versículo isolado; os nomes são transliterados de modo claro e corrente.
- source_word: עֵבֶר וּמִשְׁעָם וָשָׁמֶד
  choice: Éber, Misã e Semede
  rationale: Nomes próprios transliterados diretamente do hebraico, com formas adaptadas à fonologia e à ortografia portuguesas.
- source_word: הוּא בָּנָה
  choice: Foi ele quem construiu
  rationale: A construção enfática preserva o pronome hebraico independente e sua referência masculina singular, sem inserir a identificação de seu antecedente no corpo do texto.
- source_word: אֶת אוֹנוֹ וְאֶת לֹד
  choice: Ono, Lode
  rationale: Topônimos transliterados a partir das formas hebraicas, sem substituir Lode por uma forma posterior derivada do grego.
- source_word: וּבְנֹתֶיהָ
  choice: e os povoados que dela dependiam
  rationale: Literalmente 'e suas filhas'; no uso geográfico hebraico, designa os assentamentos subordinados a uma cidade. A formulação comunica o idioma sem sugerir descendência literal.
theological_decisions:
- issue: Antecedente de הוּא ('ele')
  choice: Manter o pronome sem identificar explicitamente o antecedente no texto
  alternative: Traduzir 'Semede construiu'
  rationale: O antecedente mais natural é Semede, o último nome mencionado, mas a sintaxe também permite uma relação mais ampla com a linhagem familiar. A tradução conserva essa pequena ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com nomes próprios adaptados ao uso lusófono. A repetição de 'e' antes dos povoados acompanha a coordenação hebraica, enquanto a explicitação da dependência traduz o sentido idiomático de 'filhas'.
