base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/037.yaml
  text: And Moza fathered Binea; Rephah was his son, Eleasah his son, Azel his son.
translation:
  language: pt
  text: E Moza gerou Bineá; Rafa era seu filho, Eleasá, seu filho, e Azel, seu filho.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מוֹצָא
  choice: E Moza
  rationale: A conjunção וּ liga o versículo à sequência genealógica anterior; o nome מוֹצָא é transliterado de modo simples como “Moza”.
- source_word: הוֹלִיד
  choice: gerou
  rationale: No hifil e em contexto genealógico, ילד indica que alguém gerou ou foi pai de outro. “Gerou” é conciso, corrente em genealogias bíblicas e preserva o sentido masculino.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: A partícula marca o objeto direto em hebraico e não requer equivalente independente em português.
- source_word: בִּנְעָא
  choice: Bineá
  rationale: Transliteração adaptada à leitura portuguesa; o acento assinala a tonicidade final e torna audível a terminação do nome hebraico.
- source_word: רָפָה
  choice: Rafa
  rationale: Transliteração natural em português da forma hebraica רָפָה.
- source_word: בְנ֛/וֹ
  choice: era seu filho
  rationale: O hebraico diz literalmente “seu filho”. A cópula “era” torna a relação natural em português sem alterar a estrutura genealógica.
- source_word: אֶלְעָשָׂה
  choice: Eleasá
  rationale: A forma conserva os principais elementos consonantais e vocálicos do nome hebraico, com acento gráfico para orientar a pronúncia em português.
- source_word: בְנ֖/וֹ
  choice: seu filho
  rationale: A expressão repetida mantém a sucessão genealógica e a concisão do original.
- source_word: אָצֵל
  choice: Azel
  rationale: Transliteração portuguesa direta e inteligível do nome hebraico.
- source_word: בְּנֽ/וֹ
  choice: seu filho
  rationale: A repetição encerra a cadeia genealógica preservando a formulação concisa do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e conciso, adequado ao estilo de uma genealogia. Mantém-se a repetição de “seu filho” e sua referência formalmente aberta, em vez de reescrever a sequência como uma série explícita de “que gerou”, o que resolveria a estrutura do original.
