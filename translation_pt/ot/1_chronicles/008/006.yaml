base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/006.yaml
  text: 'These were the sons of Ehud[a]. These were the heads of fathers’ houses for the inhabitants of Geba[b], and they carried them into exile to Manahath:'
translation:
  language: pt
  text: 'Estes foram os filhos de Eúde. Estes eram os chefes das casas paternas[a] dos habitantes de Geba e os deportaram para Manaate[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica “chefes das casas paternas” refere-se aos líderes de clãs ou de famílias ancestrais.
    reason: cultural_note
  - marker: b
    text: 'Ou: “e os levaram para o exílio, para Manaate”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Estes foram
  rationale: Introduz uma nova nota genealógica; o verbo de ligação é suprido naturalmente em português, e a conjunção inicial pode ser omitida sem perda da função discursiva.
- source_word: בְּנֵי
  choice: os filhos de
  rationale: É a forma genealógica tradicional e pode abranger descendentes no contexto, sem explicitar além do hebraico.
- source_word: אֵחוּד
  choice: Eúde
  rationale: Transliteração portuguesa consagrada do nome pessoal.
- source_word: אֵלֶּה הֵם
  choice: Eles eram
  rationale: Retoma enfaticamente o grupo já mencionado, evitando em português uma repetição excessivamente rígida de “estes”.
- source_word: רָאשֵׁי אָבוֹת
  choice: os chefes das casas paternas
  rationale: Preserva a estrutura social de linhagens ou unidades domésticas ancestrais expressa pelo termo técnico hebraico.
- source_word: לְיֹשְׁבֵי גֶבַע
  choice: dos habitantes de Geba
  rationale: Expressa naturalmente a relação entre os chefes e a população de Geba, sem especificar mais do que o contexto permite.
- source_word: גֶבַע
  choice: Geba
  rationale: Transliteração convencional do topônimo.
- source_word: וַיַּגְלוּם
  choice: e os deportaram
  rationale: O hifil de גלה com sufixo pronominal indica fazer alguém ir para o exílio; “deportaram” comunica de modo conciso a remoção forçada, mantendo indefinidos os referentes dos pronomes.
- source_word: אֶל מָנָחַת
  choice: para Manaate
  rationale: Traduz a direção marcada por אֶל e emprega uma transliteração portuguesa legível do topônimo.
