  text: וְ/נֵר֙ הוֹלִ֣יד אֶת קִ֔ישׁ וְ/קִ֖ישׁ הוֹלִ֣יד אֶת שָׁא֑וּל וְ/שָׁא֗וּל הוֹלִ֤יד אֶת יְהֽוֹנָתָן֙ וְ/אֶת מַלְכִּי שׁ֔וּעַ וְ/אֶת אֲבִֽינָדָ֖ב וְ/אֶת אֶשְׁבָּֽעַל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/033.yaml
  text: Ner fathered Kish[a], and Kish fathered Saul, and Saul fathered Jonathan, Malchi-shua, Abinadab, and Eshbaal.
translation:
  language: pt
  text: Ner gerou Quis, Quis gerou Saul, e Saul gerou Jônatas, Malquisua, Abinadabe e Esbaal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Esbaal é chamado Isbosete em 2 Samuel.
    reason: Forma alternativa do nome em outro livro bíblico.
lexical_decisions:
- source_word: הוֹלִיד
  choice: gerou
  rationale: No contexto genealógico, o hifil de ילד indica descendência paterna direta. “Gerou” é conciso, corrente em genealogias bíblicas e preserva essa relação.
- source_word: נֵר
  choice: Ner
  rationale: Nome pessoal transliterado segundo a forma tradicional em português.
- source_word: קִישׁ
  choice: Quis
  rationale: Forma tradicional e reconhecível do nome em português.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Forma tradicional e amplamente reconhecida em português.
- source_word: יְהוֹנָתָן
  choice: Jônatas
  rationale: Forma tradicional portuguesa do nome do filho de Saul, embora a forma hebraica neste versículo seja a variante mais longa Yehonatan.
- source_word: מַלְכִּי שׁוּעַ
  choice: Malquisua
  rationale: Transliteração adaptada à ortografia e à pronúncia usuais em português.
- source_word: אֲבִינָדָב
  choice: Abinadabe
  rationale: Forma tradicional portuguesa do nome pessoal.
- source_word: אֶשְׁבָּעַל
  choice: Esbaal
  rationale: Reflete diretamente o nome presente no texto hebraico de Crônicas, sem harmonizá-lo com a forma Isbosete encontrada em Samuel.
theological_decisions:
- issue: Forma do nome do último filho de Saul mencionado no versículo
  choice: Esbaal no texto principal
  alternative: Isbosete
  rationale: O hebraico de Crônicas traz explicitamente Esbaal. A forma conhecida de Samuel é indicada em nota para orientar o leitor, sem substituir nem harmonizar o texto-fonte.
translation_notes:
  register: Português moderno, claro e digno, com formas tradicionais dos nomes bíblicos reconhecíveis a leitores brasileiros. A repetição de “gerou” conserva o ritmo genealógico do hebraico; antes da lista final, o verbo não é repetido para cada filho, acompanhando a estrutura da fonte.
