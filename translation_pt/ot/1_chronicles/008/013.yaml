base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/013.yaml
  text: And Beriah and Shema—they were heads of fathers’ houses among the inhabitants of Aijalon[b][a]; they were the ones who drove out the inhabitants of Gath.
translation:
  language: pt
  text: Berias e Sema eram chefes das famílias[a] entre os habitantes de Aijalom; foram eles que expulsaram[b] os habitantes de Gate.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “chefes das casas paternas”, expressão que designa a liderança de famílias extensas ou clãs.'
    reason: cultural_note
  - marker: b
    text: Ou “puseram em fuga” ou “fizeram fugir”. O verbo hebraico enfatiza que eles fizeram os habitantes de Gate fugir; “expulsaram” expressa o provável resultado no contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרִעָה וָשֶׁמַע
  choice: Berias e Sema
  rationale: Os nomes pessoais são transliterados em formas naturais em português. A conjunção hebraica liga os dois nomes; no contexto genealógico, não é necessário iniciar a frase com “E” em português.
- source_word: הֵמָּה רָאשֵׁי הָאָבוֹת
  choice: eram chefes das famílias
  rationale: A expressão designa líderes de unidades familiares ou clânicas. “Chefes das famílias” comunica com clareza a função social, enquanto a nota preserva a forma cultural mais literal.
- source_word: לְיוֹשְׁבֵי אַיָּלוֹן
  choice: entre os habitantes de Aijalom
  rationale: Neste contexto, a preposição לְ relaciona a liderança com a população de Aijalom; “entre” indica naturalmente que eles exerciam essa posição no âmbito dessa comunidade.
- source_word: הֵמָּה
  choice: foram eles que
  rationale: A construção clivada reproduz de modo idiomático a ênfase do segundo pronome independente hebraico.
- source_word: הִבְרִיחוּ
  choice: expulsaram
  rationale: O hifil de ברח expressa fazer fugir. “Expulsaram” transmite de modo natural o sentido causativo e seu provável resultado no contexto, sem ocultar a alternativa lexical registrada em nota.
- source_word: אֶת יֹשְׁבֵי גַת
  choice: os habitantes de Gate
  rationale: Tradução direta do objeto, mantendo “habitantes” em paralelo com a expressão anterior e usando a forma portuguesa corrente do topônimo.
