lexical_decisions:
- source_word: יִפְדְיָה
  choice: Jifdeias
  rationale: Nome próprio transliterado conforme formas correntes em português bíblico; o yod inicial é representado por J, e a terminação teofórica é vertida pela forma portuguesa tradicional -ias.
- source_word: פניאל
  choice: Peniel
  rationale: Nome próprio transliterado. A forma consonantal e a vocalização massorética neste texto favorecem Peniel; não se impõe a variante Penuel adotada em algumas tradições.
- source_word: בְּנֵי
  choice: filhos de
  rationale: Plural construto de 'filho'. A formulação nominal e concisa é natural numa genealogia em português e dispensa acrescentar um verbo ausente no hebraico.
- source_word: שָׁשָׁק
  choice: Sasaque
  rationale: Nome próprio transliterado com adaptação fonológica e ortográfica ao português.
