  rationale: Nome próprio transliterado diretamente do hebraico; o acento explicita em português a tonicidade inicial da forma hebraica.
- source_word: אֱלִיאֵל
  choice: Eliel
  rationale: Nome próprio transliterado segundo a forma já natural e reconhecível em português, sem traduzir seus elementos teofóricos.
- source_word: וְ / וָ / וֶ
  choice: e
  rationale: Os waw prefixados coordenam os nomes; em português natural, a enumeração usa vírgulas e apenas a conjunção final.
