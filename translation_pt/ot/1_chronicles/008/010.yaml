  yaml_path: translation/ot/1_chronicles/008/010.yaml
  text: and Jeuz[a], and Sachia, and Mirmah. These were his sons, heads of fathers’ houses.
translation:
  language: pt
  text: e Jeús, Saquias e Mirma. Estes foram seus filhos, chefes de famílias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chefes de clãs”. O hebraico diz literalmente “cabeças de pais”, expressão que designa líderes de famílias ancestrais ou de grupos familiares.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְעוּץ
  choice: Jeús
  rationale: Nome próprio transliterado em forma natural para leitores de português, preservando aproximadamente a vocalização hebraica.
- source_word: שָׂכְיָה
  choice: Saquias
  rationale: Nome próprio transliterado segundo uma forma portuguesa clara; o uso de “qu” representa naturalmente o som consonantal antes de “i”.
- source_word: מִרְמָה
  choice: Mirma
  rationale: Neste contexto genealógico, a palavra é nome próprio e não deve ser traduzida pelo sentido do substantivo comum, “engano”.
- source_word: אֵלֶּה
  choice: Esses
  rationale: O demonstrativo plural retoma os nomes que acabam de ser mencionados; “esses” é natural nessa referência retrospectiva.
- source_word: בָנָיו
  choice: seus filhos
  rationale: O plural masculino ocorre numa genealogia e indica especificamente os filhos do personagem citado no contexto.
- source_word: רָאשֵׁי אָבוֹת
  choice: chefes de famílias paternas
  rationale: A expressão hebraica é um idioma genealógico para os líderes de unidades familiares ancestrais. A tradução comunica a função e preserva a referência paterna sem reproduzir literalmente uma construção obscura em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com formas portuguesas dos nomes próprios. A conjunção inicial “e” foi mantida porque o versículo continua a lista do contexto anterior. A expressão genealógica hebraica foi vertida de modo compreensível, e sua forma literal e principal alternativa foram registradas em nota.
