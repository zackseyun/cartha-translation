base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/009.yaml
  text: And he fathered Jobab[a], Zibia, Mesha, and Malcam by Hodesh his wife.
translation:
  language: pt
  text: E ele gerou, de sua mulher Hodes, Jobabe[a], Zíbia, Messa e Malcã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «com sua mulher Hodes». A preposição hebraica admite as duas formas de tradução nesta fórmula genealógica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: ele gerou
  rationale: O hifil de ילד, em contexto genealógico, indica que o homem foi pai dos filhos mencionados. «Gerou» é conciso, tradicional e ainda compreensível em português.
- source_word: מִן
  choice: com
  rationale: Nesta fórmula genealógica, a preposição assinala Hodes como mãe dos filhos. «Com sua mulher Hodes» é a formulação portuguesa mais natural, embora o hebraico também possa ser vertido mais literalmente como «de sua mulher Hodes».
- source_word: חֹדֶשׁ
  choice: Hodes
  rationale: Nome pessoal transliterado segundo uma forma adequada ao português; o ch inicial não foi usado, pois poderia sugerir pronúncia imprópria ao leitor lusófono.
- source_word: אִשְׁתּוֹ
  choice: sua mulher
  rationale: Neste contexto, אִשָּׁה com sufixo significa esposa. «Sua mulher» é natural e amplamente inteligível no português contemporâneo.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: marcadores de objeto omitidos; nomes coordenados por vírgulas e «e»
  rationale: O marcador hebraico de objeto direto não tem equivalente lexical em português; a coordenação repetida é representada por uma lista natural.
- source_word: יוֹבָב
  choice: Jobabe
  rationale: Forma portuguesa tradicional e fonologicamente adaptada do nome hebraico.
- source_word: צִבְיָא
  choice: Zíbia
  rationale: Transliteração adaptada ao português, com acento gráfico para indicar a pronúncia pretendida.
- source_word: מֵישָׁא
  choice: Messa
  rationale: Forma adaptada ao português que representa o shin hebraico por «ss» em posição intervocálica.
- source_word: מַלְכָּם
  choice: Malcã
  rationale: Transliteração portuguesa do nome pessoal, com «c» para כ e terminação «ã» para representar a sílaba final.
