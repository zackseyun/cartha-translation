lexical_decisions:
- source_word: וְ/אַחְיוֹ
  choice: E Aiô
  rationale: O וְ inicial foi traduzido por “E”, preservando a continuidade da lista genealógica. אַחְיוֹ foi tratado como nome próprio e transliterado na forma portuguesa tradicional “Aiô”.
- source_word: שָׁשָׁק
  choice: Sasaque
  rationale: Nome próprio transliterado segundo convenções naturais do português, com “que” para representar o som consonantal final.
- source_word: וִ/ירֵמוֹת
  choice: e Jeremote
  rationale: A conjunção וִ foi traduzida por “e”. O nome foi vertido como “Jeremote”, forma portuguesa que representa adequadamente a vocalização massorética יְרֵמוֹת.
