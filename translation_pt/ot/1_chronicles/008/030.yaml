base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/030.yaml
  text: His firstborn son was Abdon[a], then Zur, Kish, Baal, and Nadab.
translation:
  language: pt
  text: Seu filho primogênito foi Abdom[a]; depois vieram Zur, Quis, Baal e Nadabe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais formal: «E seu filho primogênito: Abdom, Zur, Quis, Baal e Nadabe».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנוֹ
  choice: Seu filho
  rationale: O substantivo com sufixo pronominal significa «seu filho». A conjunção inicial liga o versículo ao fluxo genealógico, mas não precisa ser reproduzida de maneira rígida em português.
- source_word: הַבְּכוֹר
  choice: primogênito
  rationale: Designa o primeiro filho na ordem de nascimento; «primogênito» preserva diretamente o sentido genealógico.
- source_word: עַבְדּוֹן
  choice: Abdom
  rationale: Nome próprio vertido segundo a forma tradicional e reconhecível em português.
- source_word: וְצוּר
  choice: depois vieram Zur
  rationale: A conjunção introduz a continuação da lista. «Depois vieram» produz uma enumeração natural em português sem afirmar mais que a sequência genealógica apresentada.
- source_word: וְקִישׁ
  choice: Quis
  rationale: Nome próprio vertido segundo a forma tradicional em português.
- source_word: וּבַעַל
  choice: Baal
  rationale: Neste contexto, trata-se de um nome pessoal na genealogia; por isso, é transliterado, não traduzido como título.
- source_word: וְנָדָב
  choice: Nadabe
  rationale: Nome próprio vertido segundo a forma tradicional em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com formas de nomes bíblicos reconhecíveis para leitores brasileiros. O ponto e vírgula e a expressão «depois vieram» tornam natural a lista, enquanto a nota preserva a estrutura nominal e a conjunção inicial do hebraico.
