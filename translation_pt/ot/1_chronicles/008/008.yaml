base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/008.yaml
  text: And Shaharaim fathered children in the country of Moab after he sent away Hushim and Baara[b][a], his wives.
translation:
  language: pt
  text: E Saaraim gerou filhos no território de Moabe, depois de mandar embora[a] Husim e Baara, suas esposas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «do seu mandar embora a elas»; a expressão provavelmente significa «depois de mandar embora». Outra tradução possível de «território»: «campo».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שַׁחֲרַיִם
  choice: E Saaraim
  rationale: A conjunção liga o versículo à sequência genealógica. O nome é transliterado em forma natural para leitores de português.
- source_word: הוֹלִיד
  choice: gerou filhos
  rationale: No contexto genealógico, o hifil de ילד significa gerar ou tornar-se pai. “Gerou filhos” preserva o sentido sem antecipar os nomes apresentados no versículo seguinte.
- source_word: בִּ/שְׂדֵה מוֹאָב
  choice: no território de Moabe
  rationale: Embora שָׂדֶה possa significar literalmente “campo”, em expressão geográfica pode designar uma região ou território.
- source_word: מִן שִׁלְח/וֹ אֹתָם
  choice: depois de mandar embora
  rationale: A preposição מִן com o infinitivo construto indica aqui uma circunstância temporal. A formulação portuguesa comunica naturalmente “depois de ele as mandar embora”.
- source_word: חוּשִׁים
  choice: Husim
  rationale: Nome próprio transliterado segundo formas legíveis em português.
- source_word: וְ/אֶת בַּעֲרָא
  choice: e Baara
  rationale: O marcador de objeto introduz o segundo nome; em português, basta a conjunção “e”.
- source_word: נָשָׁיו
  choice: suas esposas
  rationale: O substantivo plural com sufixo possessivo refere-se claramente às esposas de Saaraim e funciona como aposto aos dois nomes.
