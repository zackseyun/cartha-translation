  text: וּ/בִ֨נְיָמִ֔ן הוֹלִ֖יד אֶת בֶּ֣לַע בְּכֹר֑/וֹ אַשְׁבֵּל֙ הַ/שֵּׁנִ֔י וְ/אַחְרַ֖ח הַ/שְּׁלִישִֽׁי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/001.yaml
  text: Benjamin fathered Bela his firstborn[a], Ashbel the second, and Aharah the third.
translation:
  language: pt
  text: Benjamim gerou Belá, seu primogênito, Asbel, o segundo, e Aará[a], o terceiro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: Aharah; algumas versões transliteram o nome como Ahrah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִנְיָמִן
  choice: Benjamim
  rationale: O nome próprio segue a forma consagrada em português. A conjunção inicial וּ não precisa ser explicitada neste contexto genealógico.
- source_word: הוֹלִיד
  choice: gerou
  rationale: No contexto genealógico, o hifil de ילד indica que alguém se tornou pai de um descendente; “gerou” é claro, conciso e preserva o sentido masculino da genealogia.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: O marcador hebraico de objeto direto não tem equivalente independente necessário em português.
- source_word: בֶּלַע
  choice: Belá
  rationale: Forma portuguesa convencional do nome próprio hebraico.
- source_word: בְּכֹרוֹ
  choice: seu primogênito
  rationale: Tradução direta que preserva a terminologia hebraica relativa à ordem de nascimento.
- source_word: אַשְׁבֵּל
  choice: Asbel
  rationale: Forma portuguesa convencional do nome próprio.
- source_word: הַשֵּׁנִי
  choice: o segundo
  rationale: Mantém a enumeração explícita do texto hebraico em português natural.
- source_word: וְאַחְרַח
  choice: e Aará[a]
  rationale: “Aará” representa em forma portuguesa a leitura massorética אַחְרַח; a conjunção וְ é traduzida por “e”. A nota registra uma transliteração alternativa sem alterar o texto principal.
- source_word: הַשְּׁלִישִׁי
  choice: o terceiro
  rationale: Mantém a ordem enumerada expressa pelo ordinal hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas de nomes bíblicos reconhecíveis para leitores brasileiros. A construção concisa conserva o estilo genealógico do hebraico. O marcador da nota foi colocado junto a “Aará”, termo ao qual a variante se refere.
