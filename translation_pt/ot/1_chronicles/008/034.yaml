base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/034.yaml
  text: And the son of Jehonathan was Merib-baal[a], and Merib-baal fathered Micah.
translation:
  language: pt
  text: O filho de Jeonatã foi Meribe-Baal; e Meribe-Baal gerou Mica.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em 2 Samuel 9:12, este nome aparece com uma grafia hebraica variante.
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בֶן
  choice: O filho de
  rationale: בֶּן introduz o elo genealógico seguinte. O waw é representado pela continuidade da frase, enquanto a formulação portuguesa evita um início pesado com “E o filho de”.
- source_word: יְהוֹנָתָן
  choice: Jeonatã
  rationale: A forma portuguesa translitera a forma hebraica mais longa Yehonatan, sem a normalizar para o nome mais conhecido Jônatas.
- source_word: מְרִיב בָּעַל / מְרִיב בַּעַל
  choice: Meribe-Baal
  rationale: O nome próprio aparece graficamente em duas partes no hebraico. O hífen deixa claro, em português, que se trata de um único nome; a repetição retoma a mesma pessoa.
- source_word: הוֹלִיד
  choice: gerou
  rationale: No hifil e em contexto genealógico, ילד indica que alguém se tornou pai de outro. “Gerou” é a fórmula portuguesa concisa e tradicional, ainda compreensível hoje.
- source_word: אֶת מִיכָה
  choice: Mica
  rationale: אֶת é a marca do objeto direto e não recebe tradução própria; מִיכָה é vertido pela forma portuguesa estabelecida “Mica”.
