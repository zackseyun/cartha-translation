lexical_decisions:
- source_word: וּ/זְבַדְיָה
  choice: e Zebadias
  rationale: Nome próprio com a conjunção prefixada וּ. Usa-se a forma portuguesa bíblica reconhecível “Zebadias”.
- source_word: וּ/מְשֻׁלָּם
  choice: Mesulão
  rationale: Nome próprio transliterado segundo a forma tradicional e reconhecível em português. A conjunção hebraica não precisa ser repetida em todos os itens da enumeração para produzir português natural.
- source_word: וְ/חִזְקִי
  choice: Hizqui
  rationale: Transliteração do nome חִזְקִי que preserva sua distinção em relação ao nome mais longo Ezequias.
- source_word: וָ/חָבֶר
  choice: e Héber
  rationale: Nome próprio vertido pela forma bíblica convencional em português, com a conjunção final exigida pelo uso natural em uma enumeração.
