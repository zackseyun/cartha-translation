lexical_decisions:
- source_word: וּבְנֵי
  choice: E os filhos de
  rationale: Mantém a conjunção que dá continuidade à genealogia e traduz בְנֵי em seu sentido genealógico imediato.
- source_word: מִיכָה
  choice: Mica
  rationale: Transliteração portuguesa corrente do nome hebraico.
- source_word: פִּיתוֹן
  choice: Pitom
  rationale: Transliteração natural em português, representando o nome próprio hebraico.
- source_word: וָמֶלֶךְ
  choice: Meleque
  rationale: O contexto genealógico exige um nome próprio, não a tradução do substantivo comum como «rei»; a forma adapta a pronúncia ao português.
- source_word: וְתַאְרֵעַ
  choice: Tareia
  rationale: Translitera o nome hebraico תַאְרֵעַ de modo legível em português, preservando sua sequência consonantal e vocálica.
- source_word: וְאָחָז
  choice: Acaz
  rationale: Forma tradicional e amplamente reconhecida em português para o nome hebraico.
