base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/011.yaml
  text: And by Hushim he fathered Abitub and Elpaal[a].
translation:
  language: pt
  text: E, de Husim, ele gerou Abitube e Elpaal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «por meio de Husim». A preposição hebraica indica origem ou relação e, neste contexto genealógico, pode apresentar Husim como a mulher por meio de quem ele gerou esses filhos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֵ/חֻשִׁים
  choice: E, de Husim
  rationale: A conjunção mantém o encadeamento genealógico, e a preposição מִן expressa origem ou relação. Em português, «de Husim» preserva de modo natural a forma e a ambiguidade do hebraico sem explicitar além do texto a relação materna.
- source_word: הוֹלִיד
  choice: ele gerou
  rationale: O hifil de ילד, em genealogias, significa «gerar» ou «tornar-se pai de». «Gerou» é conciso, corrente em contexto genealógico e conserva o sentido masculino da construção.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: Marcador do objeto direto, sem equivalente lexical independente em português.
- source_word: אֲבִיטוּב
  choice: Abitube
  rationale: Transliteração adaptada à tradição ortográfica portuguesa dos nomes bíblicos e à pronúncia legível em português.
- source_word: וְ/אֶת
  choice: e
  rationale: A conjunção é traduzida por «e»; o marcador de objeto direto não recebe tradução separada.
- source_word: אֶלְפָּעַל
  choice: Elpaal
  rationale: Transliteração legível do nome hebraico, sem apóstrofo, preservando seus elementos sonoros principais.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação genealógica concisa. O pronome «ele» mantém o sujeito masculino implícito no verbo hebraico e ajuda a evitar que «Husim» seja entendido como sujeito de «gerou».
