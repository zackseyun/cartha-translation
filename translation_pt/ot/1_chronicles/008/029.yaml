  text: וּ/בְ/גִבְע֥וֹן יָשְׁב֖וּ אֲבִ֣י גִבְע֑וֹן וְ/שֵׁ֥ם אִשְׁתּ֖/וֹ מַעֲכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/029.yaml
  text: In Gibeon lived the father of Gibeon[a], and his wife’s name was Maacah.
translation:
  language: pt
  text: Em Gibeão morava o pai de Gibeão[a], e o nome de sua mulher era Maaca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o fundador de Gibeão” ou “o chefe de Gibeão”; literalmente, em hebraico, “o pai de Gibeão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/גִבְעוֹן
  choice: Em Gibeão
  rationale: A combinação da conjunção com a preposição significa literalmente “e em Gibeão”. Em português, a conjunção pode ser omitida aqui para que a abertura soe natural, sem perda do sentido locativo.
- source_word: יָשְׁבוּ
  choice: morava
  rationale: Embora a forma hebraica seja plural, o contexto e a passagem paralela em 1Crônicas 9:35 favorecem a referência singular ao pai de Gibeão. “Morava” é uma expressão corrente e digna para residência.
- source_word: אֲבִי גִבְעוֹן
  choice: o pai de Gibeão
  rationale: Preserva a expressão hebraica literal e sua ambiguidade. Neste contexto genealógico e geográfico, “pai” também pode indicar fundador ou chefe ligado à cidade; essas possibilidades são registradas em nota.
- source_word: וְ/שֵׁם אִשְׁתּוֹ
  choice: e o nome de sua mulher era
  rationale: Reproduz de maneira clara a construção nominal hebraica, mantendo o vínculo possessivo sem tornar a frase artificial em português.
- source_word: מַעֲכָה
  choice: Maaca
  rationale: Transliteração portuguesa tradicional e amplamente reconhecível do nome próprio hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação literal “pai de Gibeão” foi mantida no texto para não eliminar a ambiguidade histórica e genealógica do hebraico; alternativas contextuais aparecem na nota.
