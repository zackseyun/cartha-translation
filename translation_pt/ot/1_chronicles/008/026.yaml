lexical_decisions:
- source_word: שַׁמְשְׁרַי
  choice: Sansrai
  rationale: Nome próprio masculino em uma genealogia; transliterado em forma adequada ao português, sem tentar atribuir-lhe um significado não expresso no contexto.
- source_word: שְׁחַרְיָה
  choice: Se arias
  rationale: Nome próprio masculino; a forma portuguesa «Se arias» representa o nome hebraico e seu elemento final ligado ao nome divino, seguindo a forma tradicional em português.
- source_word: עֲתַלְיָה
  choice: Atalia
  rationale: Nome próprio; emprega-se a forma tradicional e legível em português, «Atalia».
- source_word: וְ / וּ / וַ
  choice: e
  rationale: As três formas são variantes prefixadas da conjunção hebraica waw. A repetição de «e» preserva a estrutura enumerativa e a cadência da genealogia.
