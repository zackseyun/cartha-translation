- source_word: וְ/יוֹחָא
  choice: Joa
  rationale: Forma transliterada legível em português, com J para o yod inicial e sem acrescentar sons não indicados pelo hebraico.
- source_word: בְּנֵי
  choice: filhos de
  rationale: No contexto genealógico, designa diretamente os filhos homens relacionados na linhagem.
- source_word: בְרִיעָה
  choice: Berias
  rationale: Emprega-se a forma portuguesa tradicional do nome bíblico.
