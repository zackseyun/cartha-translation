- source_word: וַ/אֲבִישׁוּעַ
  choice: Abisua
  rationale: O nome próprio אֲבִישׁוּעַ é transliterado segundo a forma bíblica tradicional e reconhecível em português. A conjunção ו integra a coordenação da lista, expressa naturalmente pelo «e» antes do último nome.
- source_word: וְ/נַעֲמָן
  choice: Naamã
  rationale: O nome נַעֲמָן é apresentado na forma consagrada em português. Embora o hebraico repita a conjunção, o português moderno coordena naturalmente os três nomes com vírgula e um único «e» final.
- source_word: וַ/אֲחוֹחַ
  choice: e Aoá
  rationale: A conjunção ו é expressa como «e» no último elemento da enumeração. אֲחוֹחַ é transliterado como «Aoá», forma adequada à fonologia e à acentuação gráfica do português.
