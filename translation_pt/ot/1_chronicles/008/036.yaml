base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/036.yaml
  text: Ahaz fathered Jehoaddah[a], and Jehoaddah fathered Alemeth, Azmaveth, and Zimri; and Zimri fathered Moza.
translation:
  language: pt
  text: Acaz gerou Jeoadá[a]; Jeoadá gerou Alemete, Azmavete e Zinri; e Zinri gerou Moza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: Jeoaddá; algumas tradições textuais e traduções trazem Jeoada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: gerou
  rationale: No contexto genealógico, o hifil de ילד indica que alguém se tornou pai de um descendente. “Gerou” é conciso, corrente em genealogias bíblicas em português e mantém a relação paterna expressa no hebraico.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: Marca o objeto direto em hebraico e não possui equivalente autônomo necessário em português; sua função é refletida pela ordem normal da frase.
- source_word: יְהוֹעַדָּה
  choice: Jeoadá
  rationale: Nome próprio transliterado segundo convenções naturais do português, refletindo a forma consonantal e a acentuação do texto hebraico fornecido.
- source_word: עָלֶמֶת
  choice: Alemete
  rationale: Transliteração portuguesa do nome próprio, com vogal final para leitura natural.
- source_word: עַזְמָוֶת
  choice: Azmavete
  rationale: Forma portuguesa convencional que preserva de modo reconhecível os elementos consonantais do nome hebraico.
- source_word: זִמְרִי
  choice: Zinri
  rationale: Transliteração portuguesa corrente do nome, usada de modo consistente nas duas ocorrências.
- source_word: מוֹצָא
  choice: Moza
  rationale: Transliteração simples e legível do nome próprio hebraico.
- source_word: וְ
  choice: e
  rationale: A conjunção liga pessoas e orações na genealogia; “e” preserva a estrutura coordenada do hebraico sem acrescentar uma relação temporal não explícita.
