- source_word: וַ/עֲרָד
  choice: Arade
  rationale: O nome עֲרָד foi vertido pela forma portuguesa “Arade”. A conjunção prefixada integra a coordenação da lista e não precisa ser repetida antes de cada nome em português.
- source_word: וָ/עָדֶר
  choice: e Éder
  rationale: A conjunção וָ foi traduzida por “e” antes do último elemento da lista. O nome עָדֶר foi transliterado como “Éder”, refletindo a vocalização massorética.
