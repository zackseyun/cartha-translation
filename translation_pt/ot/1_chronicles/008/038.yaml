base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/038.yaml
  text: 'Azel had six sons[a], and these were their names: Azrikam his firstborn, Ishmael, Sheariah, Obadiah, and Hanan. All these were the sons of Azel.'
translation:
  language: pt
  text: 'Azel teve seis filhos, e estes eram os seus nomes: Azricão, Bocru[a], Ismael, Searias, Obadias e Hanã. Todos estes eram filhos de Azel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Azricão, seu primogênito”. A forma hebraica também pode receber essa leitura; porém, a enumeração de seis filhos e a lista paralela em 1 Crônicas 9:44 favorecem entender Bocru como nome próprio.'
    reason: textual_lexical_ambiguity
lexical_decisions:
- source_word: וּלְאָצֵל שִׁשָּׁה בָנִים
  choice: Azel teve seis filhos
  rationale: A construção hebraica com לְ expressa posse numa fórmula genealógica. Em português atual, “Azel teve seis filhos” comunica o sentido com naturalidade, e בָנִים designa filhos homens neste contexto.
- source_word: וְאֵלֶּה שְׁמוֹתָם
  choice: cujos nomes eram
  rationale: Reproduz de modo fluente a fórmula de apresentação dos nomes e mantém o referente plural indicado pelo sufixo hebraico.
- source_word: עַזְרִיקָם
  choice: Azricão
  rationale: Forma tradicional e reconhecível do nome em português bíblico.
- source_word: בֹּכְרוּ
  choice: Bocru
  rationale: Tratado como nome próprio, em harmonia com a afirmação de que havia seis filhos e com a lista paralela de 1 Crônicas 9:44. A possível leitura morfológica “seu primogênito” é preservada em nota.
- source_word: יִשְׁמָעֵאל
  choice: Ismael
  rationale: Forma portuguesa convencional do nome próprio.
- source_word: שְׁעַרְיָה
  choice: Searias
  rationale: Forma tradicional do nome em português bíblico, clara para leitores modernos.
- source_word: עֹבַדְיָה
  choice: Obadias
  rationale: Forma portuguesa convencional do nome próprio.
- source_word: חָנָן
  choice: Hanã
  rationale: Transliteração portuguesa corrente, com acento que orienta a pronúncia.
- source_word: כָּל אֵלֶּה בְּנֵי אָצַל
  choice: Todos esses foram filhos de Azel
  rationale: Mantém a fórmula genealógica conclusiva do hebraico em português natural.
