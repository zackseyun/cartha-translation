  register: Português moderno, digno e acessível, com formas de nomes já consolidadas no uso bíblico em português. A sintaxe foi levemente condensada para evitar a repetição pouco natural de “e estes eram os nomes deles”, sem omitir conteúdo. A ambiguidade de בֹּכְרוּ foi explicitamente preservada em nota.
