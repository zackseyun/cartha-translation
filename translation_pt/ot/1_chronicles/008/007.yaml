  text: and Naaman[a], Ahijah[b], and Gera—he carried them into exile and fathered Uzza and Ahihud.
translation:
  language: pt
  text: e Naamã, Aías e Gera — ele os levou para o exílio[a][b] e gerou Uzá e Aíude.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O sujeito de “ele” está no singular e se refere mais naturalmente a Gera, embora a genealogia desta seção seja textual e sintaticamente difícil.
    reason: alternative_reading
  - marker: b
    text: 'Ou “os exilou” ou “os deportou”. O verbo hebraico é causativo: literalmente, “fez com que fossem para o exílio”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲמָן
  choice: Naamã
  rationale: Forma tradicional e reconhecível do nome hebraico em português.
- source_word: אֲחִיָּה
  choice: Aías
  rationale: Forma portuguesa tradicional do nome próprio hebraico.
- source_word: גֵרָא
  choice: Gera
  rationale: Transliteração corrente do nome próprio em português.
- source_word: הוּא
  choice: foi ele quem
  rationale: Reproduz o pronome independente com sua força enfática ou resumptiva e liga naturalmente Gera à ação seguinte, sem ocultar a dificuldade sintática.
- source_word: הֶגְלָם
  choice: os levou para o exílio
  rationale: O hifil de גלה com sufixo de terceira pessoa masculina plural expressa fazer com que eles fossem para o exílio; a formulação preserva tanto a causatividade quanto o objeto plural.
- source_word: וְהוֹלִיד
  choice: e gerou
  rationale: Em contexto genealógico, o hifil de ילד indica gerar ou tornar-se pai; “gerou” é conciso, atual e fiel ao sentido masculino genealógico.
- source_word: עֻזָּא
  choice: Uzá
  rationale: Forma portuguesa do nome próprio, com acento para indicar a tonicidade final.
- source_word: אֲחִיחֻד
  choice: Aiúde
  rationale: Forma portuguesa tradicional do nome próprio hebraico.
