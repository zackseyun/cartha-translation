  text: אַֽל תִּגְּעוּ֙ בִּ/מְשִׁיחָ֔/י וּ/בִ/נְבִיאַ֖/י אַל תָּרֵֽעוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/022.yaml
  text: Do not touch my anointed ones[a], and do not harm my prophets.
translation:
  language: pt
  text: Não toquem nos meus ungidos[a] e não façam mal aos meus profetas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nos meus consagrados”; literalmente, “nos meus ungidos”. O termo hebraico está relacionado a “Messias”, mas aqui se refere de modo mais amplo aos que foram ungidos por Deus, não especificamente ao Messias.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּגְּעוּ
  choice: toquem
  rationale: נגע significa normalmente “tocar”. Neste contexto proibitivo, o paralelismo com “não façam mal” sugere contato hostil, sem exigir que esse sentido seja explicitado no verbo.
- source_word: בִּמְשִׁיחָי
  choice: nos meus ungidos
  rationale: מָשִׁיחַ significa “ungido”. A forma hebraica é plural e tem sufixo de primeira pessoa do singular; “meus ungidos” preserva esses elementos e evita o sentido específico que “messias” costuma ter em português.
- source_word: וּבִנְבִיאַי
  choice: aos meus profetas
  rationale: נָבִיא significa “profeta”; a forma plural com sufixo de primeira pessoa do singular corresponde naturalmente a “meus profetas”.
- source_word: תָּרֵעוּ
  choice: façam mal
  rationale: No hifil, רעע expressa causar mal ou dano. “Façam mal” é natural, abrangente e mantém a ligação lexical com o mal sem especificar indevidamente o tipo de dano.
- source_word: אַל
  choice: não
  rationale: אַל seguido dessas formas verbais introduz proibições; “não” é o equivalente português direto e idiomático.
theological_decisions:
- issue: Sentido de מְשִׁיחָי em um contexto plural não especificamente messiânico
  choice: meus ungidos
  alternative: meus messias
  rationale: O termo hebraico está relacionado a “Messias”, mas aqui é um substantivo comum no plural, referido de modo amplo àqueles que Deus ungiu. A tradução evita importar uma referência ao Messias singular que o texto não afirma.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção paralela foi preservada; “façam mal” comunica de modo natural a amplitude do segundo verbo hebraico.
