  text: ה֚וּא יְהוָ֣ה אֱלֹהֵ֔י/נוּ בְּ/כָל הָ/אָ֖רֶץ מִשְׁפָּטָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/014.yaml
  text: He is Yahweh our God[b][a]; his judgments are in all the earth.
translation:
  language: pt
  text: Ele é Yahweh, nosso Deus[b]; seus juízos estão em toda a terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em todo o território”, se אֶרֶץ for entendido em sentido mais localizado; aqui “terra” é preferido por causa do contexto, que enfatiza o alcance mundial.
    reason: lexical_alternative
  - marker: b
    text: O nome divino em hebraico é YHWH, tradicionalmente traduzido como “o SENHOR”.
    reason: alternative_reading
lexical_decisions:
- source_word: הוּא
  choice: Ele é
  rationale: O pronome independente tem valor enfático numa oração sem verbo expresso; em português, “Ele é” preserva naturalmente essa ênfase.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH em vez de substituí-lo por um título.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Embora אֱלֹהִים tenha forma morfologicamente plural, aqui designa claramente o único Deus de Israel; o sufixo indica “nosso”.
- source_word: בְּכָל הָאָרֶץ
  choice: em toda a terra
  rationale: Mantém o sentido universal mais provável no contexto, sem excluir a possibilidade lexical mais localizada de “por toda a terra” no sentido de território.
- source_word: מִשְׁפָּטָיו
  choice: seus juízos
  rationale: Preserva a amplitude de מִשְׁפָּטִים, que pode abranger decisões judiciais, atos de julgamento e manifestações da justiça divina.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome pessoal YHWH; “Yahweh” o representa diretamente, enquanto “SENHOR” o substitui por um título.
- issue: Alcance de הָאָרֶץ
  choice: terra, em sentido mundial
  alternative: terra ou território, em sentido localizado
  rationale: O contexto de louvor favorece uma afirmação do governo judicial universal de Yahweh, mas a nota conserva a alternativa lexical genuína.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A ordem dos marcadores foi normalizada para que [b] acompanhe “Yahweh” e [a] acompanhe “terra”.
