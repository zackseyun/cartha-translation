  text: וְ/אִמְר֕וּ הוֹשִׁיעֵ֨/נוּ֙ אֱלֹהֵ֣י יִשְׁעֵ֔/נוּ וְ/קַבְּצֵ֥/נוּ וְ/הַצִּילֵ֖/נוּ מִן הַ/גּוֹיִ֑ם לְ/הֹדוֹת֙ לְ/שֵׁ֣ם קָדְשֶׁ֔/ךָ לְ/הִשְׁתַּבֵּ֖חַ בִּ/תְהִלָּתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/035.yaml
  text: And say[a], “Save us, O God of our salvation; gather us and deliver us from the nations[b], that we may give thanks to your holy name and glory in your praise.”
translation:
  language: pt
  text: 'E digam: “Salva-nos, ó Deus da nossa salvação; reúne-nos e livra-nos das nações, para darmos graças ao teu santo nome e nos gloriarmos no teu louvor.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִמְרוּ
  choice: E digam
  rationale: Preserva a conjunção e o imperativo plural, mantendo o fluxo litúrgico do contexto.
- source_word: הוֹשִׁיעֵנוּ
  choice: Salva-nos
  rationale: Expressa naturalmente o imperativo de ישׁע e mantém distinção em relação a נצל, traduzido depois por “livra-nos”.
- source_word: אֱלֹהֵי יִשְׁעֵנוּ
  choice: ó Deus da nossa salvação
  rationale: Mantém a construção hebraica e usa “ó” para marcar de modo natural o vocativo solene em português.
- source_word: וְקַבְּצֵנוּ
  choice: reúne-nos
  rationale: Comunica o ato de congregar os dispersos e preserva a possível nuance de restauração.
- source_word: וְהַצִּילֵנוּ
  choice: e livra-nos
  rationale: Representa o resgate de perigo ou poder hostil sem apagar a distinção lexical em relação a “salva-nos”.
- source_word: מִן־הַגּוֹיִם
  choice: dentre as nações
  rationale: Indica que o povo deve ser reunido e retirado do meio das nações; evita importar a categoria teológica posterior de “gentios”.
- source_word: לְהוֹדוֹת
  choice: para darmos graças
  rationale: Explicita o valor de finalidade do infinitivo com ל e traduz ידה pelo sentido usual de agradecer.
- source_word: לְשֵׁם קָדְשֶׁךָ
  choice: ao teu santo nome
  rationale: É a construção portuguesa natural com “dar graças” e preserva a fórmula reverente do hebraico.
- source_word: לְהִשְׁתַּבֵּחַ
  choice: e nos gloriarmos
  rationale: Conserva a forma reflexiva do hitpael e o sentido positivo de exultar ou vangloriar-se em Deus.
- source_word: בִּתְהִלָּתֶךָ
  choice: no teu louvor
  rationale: Preserva a preposição ב e a ambiguidade entre o louvor dirigido a Deus e aquilo pelo qual ele é louvado.
theological_decisions:
- issue: Se הַגּוֹיִם deve ser traduzido por “nações” ou “gentios”
  choice: dentre as nações
  alternative: dentre os gentios
  rationale: Neste contexto, o termo designa os povos entre os quais Israel pode estar disperso. “Nações” preserva o sentido histórico sem introduzir uma oposição teológica posterior entre judeus e gentios.
- issue: Como representar a linguagem reflexiva de louvor na cláusula final
  choice: nos gloriarmos no teu louvor
  alternative: nos exaltarmos no teu louvor; nos alegrarmos no teu louvor
  rationale: A formulação mantém a força reflexiva e exultante do hebraico, deixando claro pelo complemento que a glória está centrada no louvor de Deus, não no mérito humano.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A colocação pronominal enclítica sustenta o tom solene sem arcaísmo excessivo. “Teu” mantém unidade de número com o hebraico, que se dirige a Deus no singular.
