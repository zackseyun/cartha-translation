  text: וְ/עִמָּ/הֶם֙ הֵימָ֣ן וִֽ/ידוּת֔וּן וּ/שְׁאָר֙ הַ/בְּרוּרִ֔ים אֲשֶׁ֥ר נִקְּב֖וּ בְּ/שֵׁמ֑וֹת לְ/הֹדוֹת֙ לַֽ/יהוָ֔ה כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/041.yaml
  text: And with them were Heman and Jeduthun and the rest of those chosen, who were designated by name to give thanks to Yahweh, for his steadfast love endures forever.
translation:
  language: pt
  text: Com eles estavam Hemã, Jedutum e os demais escolhidos, que foram designados nominalmente[a] para dar graças a Yahweh, pois o seu amor leal dura para sempre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que foram indicados pelo nome” ou “que foram nomeados individualmente”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “pois o seu amor leal é para sempre”, um refrão litúrgico recorrente.'
    reason: cultural_note
lexical_decisions:
- source_word: וְעִמָּהֶם
  choice: Com eles estavam
  rationale: A locução preposicional introduz Hemã, Jedutum e o grupo que os acompanhava; o verbo plural, implícito no hebraico, foi suprido para produzir português natural.
- source_word: הֵימָן וִידוּתוּן
  choice: Hemã, Jedutum
  rationale: Nomes próprios transliterados conforme formas bíblicas correntes em português.
- source_word: וּשְׁאָר הַבְּרוּרִים
  choice: e os demais escolhidos
  rationale: שְׁאָר indica o restante, e o particípio passivo הַבְּרוּרִים designa os que foram escolhidos, sem tornar explícito um substantivo como “homens”.
- source_word: אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת
  choice: que haviam sido designados nominalmente
  rationale: O Nifal de נקב com בְּשֵׁמוֹת comunica identificação ou designação expressa pelo nome; o mais-que-perfeito esclarece que essa designação precedeu a função indicada a seguir.
- source_word: לְהֹדוֹת
  choice: para dar graças
  rationale: Neste contexto litúrgico, o Hifil de ידה exprime ação de graças, sentido reforçado pelo refrão seguinte.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Mantém o nome divino pessoal representado pelo Tetragrama no texto hebraico.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: pois o seu amor leal dura para sempre
  rationale: כִּי introduz a razão ou o conteúdo da ação de graças; חֶסֶד expressa amor fiel e comprometido, e “dura para sempre” verte a fórmula litúrgica em português idiomático.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o caráter de nome pessoal sem substituí-lo por um título.
- issue: Sentido de חֶסֶד no refrão litúrgico
  choice: amor leal
  alternative: misericórdia; bondade; amor constante
  rationale: “Amor leal” conserva tanto o afeto quanto a fidelidade relacional do termo, sem restringi-lo somente a misericórdia ou importar uma formulação teológica mais específica do que o hebraico exige.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e alcance internacional. A sintaxe acompanha de perto o hebraico sem sacrificar a naturalidade; “nominalmente” evita uma repetição pesada de “nome”, e as notas preservam alternativas legítimas.
