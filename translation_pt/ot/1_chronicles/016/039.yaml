base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/039.yaml
  text: And Zadok the priest and his fellow priests were before the tabernacle of Yahweh at the high place that was in Gibeon,[a]
translation:
  language: pt
  text: e Zadoque, o sacerdote, e seus irmãos, os sacerdotes, diante do tabernáculo de Yahweh, no lugar alto que ficava em Gibeão,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵת
  choice: e
  rationale: O waw mantém a coordenação com o versículo anterior; o marcador de objeto direto אֵת não recebe tradução própria. A construção depende do verbo do contexto anterior.
- source_word: צָדוֹק הַכֹּהֵן
  choice: Zadoque, o sacerdote
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português e traduz literalmente o título definido.
- source_word: וְאֶחָיו הַכֹּהֲנִים
  choice: e seus irmãos, os sacerdotes
  rationale: Preserva a formulação hebraica e sua possível amplitude relacional, sem decidir silenciosamente que se trata apenas de colegas de ofício.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Expressa de modo natural a posição em frente ao santuário e conserva o valor locativo do hebraico.
- source_word: מִשְׁכַּן יְהוָה
  choice: tabernáculo de Yahweh
  rationale: “Tabernáculo” é o termo português consagrado para o santuário móvel; o nome divino é representado diretamente como Yahweh.
- source_word: בַּבָּמָה
  choice: no lugar alto
  rationale: Mantém o termo cultual convencional sem introduzir aqui uma avaliação negativa que o contexto não explicita.
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: que ficava em Gibeão
  rationale: Traduz a oração relativa em português corrente e identifica com clareza a localização do lugar alto.
theological_decisions:
- issue: Representação de יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz explicitamente o Tetragrama; “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Sentido de אֶחָיו no grupo sacerdotal
  choice: seus irmãos, os sacerdotes
  alternative: seus colegas sacerdotes
  rationale: Embora “irmãos” possa designar companheiros do mesmo grupo, a tradução formal preserva a expressão hebraica e sua ambiguidade, enquanto a aposição esclarece que o grupo é sacerdotal.
translation_notes:
  register: Português moderno, digno e de leitura ampla. O fragmento começa com minúscula e termina com vírgula porque sua sintaxe continua a frase iniciada no versículo anterior; não se acrescentou verbo inexistente neste versículo.
