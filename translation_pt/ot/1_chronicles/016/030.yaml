id: 1CH.16.30
reference: 1 Chronicles 16:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: חִ֤ילוּ מִ/לְּ/פָנָי/ו֙ כָּל הָ/אָ֔רֶץ אַף תִּכּ֥וֹן תֵּבֵ֖ל בַּל תִּמּֽוֹט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/030.yaml
  text: Tremble before him[a], all the earth; indeed, the world is established; it shall not be moved.
translation:
  language: pt
  text: Trema diante dele, toda a terra! Sim, o mundo está firmemente estabelecido; não será abalado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não vacilará” ou “não será movido”. A imagem hebraica expressa estabilidade firme.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִילוּ
  choice: Trema
  rationale: O imperativo qal de חול pode descrever contorcer-se ou estremecer; neste contexto de louvor diante da presença divina, “tremer” comunica de modo natural a reação reverente e assombrada.
- source_word: מִלְּפָנָיו
  choice: diante dele
  rationale: Representa a expressão hebraica literalmente ligada à face ou presença, preservando o sentido relacional sem tornar a frase artificial em português.
- source_word: כָּל הָאָרֶץ
  choice: toda a terra
  rationale: O contexto cósmico e universal favorece “terra”, não uma região ou país específico.
- source_word: אַף
  choice: Sim
  rationale: Aqui a partícula reforça a afirmação seguinte. “Sim” conserva essa ênfase de maneira clara e corrente.
- source_word: תִּכּוֹן
  choice: está firmemente estabelecido
  rationale: O nifal de כון expressa condição firme e estável. O advérbio explicita em português a firmeza inerente ao verbo hebraico.
- source_word: תֵּבֵל
  choice: o mundo
  rationale: תבל designa o mundo ordenado, muitas vezes com a nuance de mundo habitado; “o mundo” é a forma concisa e natural em português.
- source_word: בַּל תִּמּוֹט
  choice: não será abalado
  rationale: A construção poética nega que o mundo vacile, cambaleie ou perca sua estabilidade. “Não será abalado” preserva a imagem sem sugerir uma tese científica sobre ausência absoluta de movimento.
theological_decisions:
- issue: Linguagem sobre a estabilidade cósmica
  choice: Afirmar que o mundo, estabelecido sob o governo de Deus, não será abalado.
  alternative: Traduzir mais concretamente como “não vacilará” ou, de forma mais literal e potencialmente ambígua, “não será movido”.
  rationale: O hebraico poético enfatiza firmeza, segurança e ordem sustentada por Deus. “Não será abalado” mantém essa afirmação teológica sem introduzir conclusões cosmológicas posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A exclamação após a convocação reflete sua força imperativa; o restante conserva o paralelismo poético e a imagem de estabilidade.
