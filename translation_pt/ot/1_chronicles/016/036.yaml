  text: בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל מִן הָ/עוֹלָ֖ם וְ/עַ֣ד הָ/עֹלָ֑ם וַ/יֹּאמְר֤וּ כָל הָ/עָם֙ אָמֵ֔ן וְ/הַלֵּ֖ל לַֽ/יהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/036.yaml
  text: Blessed be Yahweh[a], the God of Israel, from everlasting to everlasting. Then all the people said[b], “Amen!” and praised Yahweh.
translation:
  language: pt
  text: 'Bendito seja Yahweh, o Deus de Israel, de eternidade a eternidade.[a] E todo o povo disse: “Amém!” e louvou Yahweh.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “desde sempre e para sempre” ou “para todo o sempre”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “Amém e louvor a Yahweh”. O hebraico é uma expressão compacta; o sentido é que o povo respondeu com amém e louvor.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Bendito seja
  rationale: O particípio passivo integra uma fórmula doxológica. “Bendito seja” conserva o tom litúrgico e a força de aclamação do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta da cadeia construta, com artigo natural em português na aposição.
- source_word: מִן הָעוֹלָם וְעַד הָעֹלָם
  choice: de eternidade a eternidade
  rationale: Reproduz a estrutura temporal abrangente da fórmula hebraica e mantém seu registro elevado sem lhe impor precisão filosófica indevida.
- source_word: וַיֹּאמְרוּ כָל הָעָם
  choice: E todo o povo disse
  rationale: Mantém a progressão narrativa marcada pelo waw e traduz עָם pelo referente coletivo natural neste contexto.
- source_word: אָמֵן
  choice: Amém!
  rationale: A transliteração é a resposta litúrgica consagrada e reconhecível em português; a exclamação comunica a força da aclamação coletiva.
- source_word: וְהַלֵּל לַיהוָה
  choice: e louvou Yahweh
  rationale: Entende a expressão compacta como continuação verbal da resposta do povo. O singular concorda naturalmente com o coletivo “todo o povo”, preservando a ambiguidade do hebraico em nota.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto traz o nome pessoal divino. “Yahweh” preserva esse nome sem substituí-lo por um título ou adotar outra forma tradicional.
- issue: Alcance temporal de עוֹלָם na doxologia
  choice: de eternidade a eternidade
  alternative: desde sempre e para sempre; para todo o sempre
  rationale: A escolha conserva a repetição e a amplitude temporal do idioma hebraico, sem transformar a fórmula poética em uma definição metafísica.
- issue: Análise de וְהַלֵּל לַיהוָה
  choice: 'oração narrativa: “e louvou Yahweh”'
  alternative: 'aclamação citada: “e louvem Yahweh” ou “e louvor a Yahweh”'
  rationale: A forma hebraica é compacta e admite mais de uma análise. A leitura narrativa se integra ao sujeito coletivo anterior, enquanto a nota preserva as alternativas legítimas.
translation_notes:
  register: Português moderno, claro e digno, com cadência litúrgica. Mantém “Yahweh” como nome próprio e usa “de eternidade a eternidade” para conservar o paralelismo da doxologia. As duas notas estão marcadas no texto principal e registram alternativas reais do hebraico.
