  text: זִכְר֗וּ נִפְלְאֹתָי/ו֙ אֲשֶׁ֣ר עָשָׂ֔ה מֹפְתָ֖י/ו וּ/מִשְׁפְּטֵי פִֽי/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/012.yaml
  text: Remember his wondrous deeds that he has done[a], his signs[c][b], and the judgments of his mouth.
translation:
  language: pt
  text: Lembrem-se dos feitos maravilhosos que ele fez[a], dos seus sinais[b] e dos juízos de sua boca[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “das maravilhas que ele fez”.
    reason: lexical_alternative
  - marker: b
    text: Ou “dos seus prodígios” ou “dos seus portentos”.
    reason: lexical_alternative
  - marker: c
    text: Ou “dos decretos de sua boca”.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ
  choice: Lembrem-se
  rationale: O imperativo plural de זכר convoca os ouvintes a trazer ativamente à memória os atos de Deus. “Lembrem-se” é natural e preserva a força exortativa.
- source_word: נִפְלְאֹתָיו
  choice: seus feitos maravilhosos
  rationale: O termo designa atos extraordinários que despertam admiração. “Feitos maravilhosos” explicita que se trata de ações realizadas por Deus, sem perder a ideia de maravilha.
- source_word: אֲשֶׁר עָשָׂה
  choice: que ele fez
  rationale: A oração relativa identifica os feitos como ações concluídas por Deus. A formulação é direta, corrente e fiel ao verbo עשה.
- source_word: מֹפְתָיו
  choice: seus sinais
  rationale: מופת pode indicar um sinal, prodígio ou portento que manifesta poder divino. “Sinais” é claro e não restringe indevidamente o alcance semântico a milagres.
- source_word: וּמִשְׁפְּטֵי פִיהוּ
  choice: e dos juízos de sua boca
  rationale: משפטים pode significar juízos, decisões ou decretos. A tradução mantém a imagem hebraica da boca de Deus e preserva tanto a nuance judicial quanto a declarativa.
theological_decisions:
- issue: Distinção entre os termos paralelos נִפְלְאֹתָיו e מֹפְתָיו
  choice: “feitos maravilhosos” e “sinais”
  alternative: “maravilhas” e “prodígios”
  rationale: O hebraico emprega dois termos relacionados, mas distintos. A tradução conserva essa diferenciação poética e evita fundi-los numa única ideia.
- issue: Sentido de מִשְׁפְּטֵי na expressão “juízos de sua boca”
  choice: juízos
  alternative: decretos ou determinações
  rationale: “Juízos” mantém aberta a abrangência do termo hebraico, que pode se referir tanto a decisões judiciais quanto a determinações divinas pronunciadas.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção “juízos de sua boca” conserva deliberadamente a imagem poética hebraica, enquanto as notas registram alternativas lexicais genuínas.
