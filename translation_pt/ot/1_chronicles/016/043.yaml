base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/043.yaml
  text: Then all the people went[a], each man to his house, and David turned to bless his household.
translation:
  language: pt
  text: Então todo o povo foi embora, cada um para sua casa, e Davi se voltou para abençoar sua família.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sua casa”. A palavra hebraica pode se referir tanto à casa física quanto à família ou ao grupo doméstico que a compõe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: foi embora
  rationale: O wayyiqtol de הלך introduz a ação narrativa seguinte. No contexto de encerramento da reunião, “foi embora” comunica naturalmente que o povo partiu para casa.
- source_word: כָל הָעָם
  choice: todo o povo
  rationale: עם designa aqui a população reunida; “todo o povo” conserva o sentido comum e coletivo do hebraico.
- source_word: אִישׁ
  choice: cada um
  rationale: אִישׁ tem função distributiva depois de “todo o povo”. Em português atual, “cada um” expressa essa individualização com mais naturalidade do que o rígido “cada homem”, sem mudar o referente contextual.
- source_word: לְבֵיתוֹ
  choice: para a sua casa
  rationale: בַּיִת indica aqui o lugar onde cada pessoa mora. “Casa” é direto, claro e mais próximo do termo hebraico.
- source_word: וַיִּסֹּב
  choice: se voltou
  rationale: O verbo סבב indica uma mudança de direção. “Se voltou” preserva esse sentido sem introduzir a ideia mais específica de que Davi necessariamente “retornou”.
- source_word: לְבָרֵךְ
  choice: para abençoar
  rationale: O infinitivo de ברך expressa propósito. “Abençoar” mantém de modo conciso a força religiosa e relacional do verbo.
- source_word: בֵּיתוֹ
  choice: a sua família
  rationale: Na ação de abençoar, בַּיִת provavelmente designa as pessoas da casa de Davi, e não o edifício. “Família” comunica esse sentido provável em português natural, enquanto a nota preserva a alternativa literal.
theological_decisions:
- issue: O referente de בֵּיתוֹ na expressão final
  choice: sua família
  alternative: sua casa
  rationale: O hebraico pode indicar tanto a casa quanto o grupo familiar. O contexto favorece as pessoas da casa como objeto da bênção, mas a nota mantém aberta a ambiguidade lexical.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção distributiva foi vertida idiomaticamente como “cada um”, e a ambiguidade do último בֵּיתוֹ foi preservada em nota.
