base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/024.yaml
  text: Declare his glory among the nations, his wondrous deeds among all the peoples.
translation:
  language: pt
  text: Anunciem entre as nações a sua glória, entre todos os povos, as suas maravilhas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סַפְּרוּ
  choice: Anunciem
  rationale: O imperativo plural de ספר pede uma comunicação pública. “Anunciem” expressa com naturalidade o caráter proclamador da ordem.
- source_word: בַגּוֹיִם
  choice: entre as nações
  rationale: 'גּוֹיִם designa aqui as nações em sentido amplo, e a preposição ב tem sentido locativo: a proclamação deve ocorrer entre elas.'
- source_word: כְּבוֹדוֹ
  choice: a sua glória
  rationale: כָּבוֹד reúne as ideias de honra, esplendor e manifestação da grandeza divina; “glória” é a forma consagrada e adequada ao contexto.
- source_word: בְּכָל־הָעַמִּים
  choice: entre todos os povos
  rationale: “Povos” preserva a distinção poética em relação a גּוֹיִם, traduzido como “nações”, e “entre” reflete a preposição ב.
- source_word: נִפְלְאֹתָיו
  choice: as suas maravilhas
  rationale: O termo se refere aos atos extraordinários de Deus que despertam admiração. Em português bíblico atual, “maravilhas” comunica de modo conciso tanto os feitos quanto seu caráter admirável.
theological_decisions:
- issue: Referência dos sufixos pronominais (“sua/suas”)
  choice: Os pronomes se referem ao SENHOR, o Deus de Israel, cuja glória e cujos feitos devem ser anunciados universalmente.
  alternative: Repetir explicitamente “do SENHOR” e “do Senhor” em lugar dos pronomes.
  rationale: O contexto imediato identifica claramente o referente, enquanto o hebraico mantém os sufixos pronominais. A tradução conserva essa forma sem acrescentar explicitação doutrinária.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. O paralelismo entre “nações” e “povos” foi preservado, assim como o paralelismo verbal elíptico da segunda oração.
