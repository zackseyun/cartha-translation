  text: הוֹד֤וּ לַ/יהוָה֙ כִּ֣י ט֔וֹב כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/034.yaml
  text: Give thanks to Yahweh[a], for he is good[b]; for his steadfast love endures forever.
translation:
  language: pt
  text: Deem graças a Yahweh[a], porque ele é bom; porque o seu amor leal[b] dura para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”, geralmente vocalizado “Yahweh”; muitas traduções trazem “o SENHOR”.'
    reason: alternative_reading
  - marker: b
    text: Também pode ser traduzido por “fidelidade à aliança”. O termo hebraico חֶסֶד expressa amor constante, lealdade e compromisso fiel.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹד֤וּ
  choice: Deem graças
  rationale: O imperativo plural de ידה no hifil, nesta fórmula litúrgica, pede que a comunidade expresse gratidão e louvor. “Deem graças” é natural, preciso e preserva o valor imperativo.
- source_word: לַ/יהוָה֙
  choice: a Yahweh
  rationale: Reproduz o nome divino יהוה como nome próprio, em vez de substituí-lo por um título, preservando a referência pactual do hebraico.
- source_word: כִּ֣י ... כִּ֥י
  choice: porque ... porque
  rationale: As duas ocorrências introduzem os motivos para a ação de graças. A repetição mantém o paralelismo e a cadência da fórmula hebraica.
- source_word: ט֔וֹב
  choice: bom
  rationale: Equivalente direto e suficiente para a bondade moral e benéfica atribuída a Deus.
- source_word: חַסְדּֽ/וֹ
  choice: o seu amor leal
  rationale: חֶסֶד reúne as ideias de amor, lealdade e compromisso constante. “Amor leal” conserva essa amplitude melhor que uma opção restrita apenas a misericórdia ou afeto.
- source_word: לְ/עוֹלָ֖ם חַסְדּֽ/וֹ
  choice: o seu amor leal dura para sempre
  rationale: A oração hebraica não traz verbo expresso. “Dura” explicita naturalmente em português a permanência indicada por לְעוֹלָם sem alterar o sentido.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome próprio e evita substituí-lo silenciosamente por um título; a nota informa a forma hebraica.
- issue: Sentido pactual de חֶסֶד
  choice: amor leal
  alternative: fidelidade à aliança; misericórdia; amor constante
  rationale: “Amor leal” mantém juntas as dimensões afetiva e relacional de חֶסֶד e sua constância, sem limitar o termo a uma única nuance. A nota registra uma alternativa explicitamente pactual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A repetição de “porque” preserva o caráter litúrgico e o paralelismo do hebraico; “o seu” evita possível rigidez sem perder a referência.
