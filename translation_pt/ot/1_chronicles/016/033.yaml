  text: אָ֥ז יְרַנְּנ֖וּ עֲצֵ֣י הַ/יָּ֑עַר מִ/לִּ/פְנֵ֣י יְהוָ֔ה כִּי בָ֖א לִ/שְׁפּ֥וֹט אֶת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/033.yaml
  text: Then the trees of the forest will sing for joy before Yahweh[c][b][a], for he comes to judge the earth.
translation:
  language: pt
  text: Então as árvores da floresta cantarão de alegria[a] diante de Yahweh, pois ele vem[b] julgar a terra[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aclamarão de alegria”. O verbo hebraico pode indicar uma jubilosa expressão vocal, cantada ou bradada.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “está vindo para julgar a terra”. No contexto poético, a forma hebraica pode apresentar uma ação que se aproxima com vívida certeza.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “o país”, se o termo for entendido em sentido mais local; neste contexto cósmico, “a terra” é mais provável.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Introduz naturalmente, em português, a cena que se segue.
- source_word: יְרַנְּנוּ
  choice: cantarão de alegria
  rationale: O piel de רנן indica uma jubilosa expressão vocal, que pode ser canto ou aclamação; a escolha preserva o caráter poético e celebrativo.
- source_word: עֲצֵי הַיָּעַר
  choice: as árvores da floresta
  rationale: Reproduz diretamente a construção hebraica e mantém a personificação poética.
- source_word: מִלִּפְנֵי
  choice: diante de
  rationale: Expressa de modo natural a presença perante Yahweh, sem a rigidez de uma reprodução literal da preposição composta.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: כִּי
  choice: pois
  rationale: Introduz de maneira concisa e poética a razão da alegria da criação.
- source_word: בָא
  choice: vem
  rationale: Preserva a vivacidade e a certeza poética do qatal, sem o limitar inequivocamente ao passado.
- source_word: לִשְׁפּוֹט
  choice: julgar
  rationale: Representa o sentido judicial primário, que também pode envolver o exercício do governo justo.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: No contexto cósmico do cântico, refere-se preferencialmente à terra como um todo, embora o hebraico também possa significar uma região ou país.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; ou SENHOR como substituição tradicional
  rationale: O texto traz diretamente o tetragrama; a transliteração preserva o nome pessoal sem transformá-lo em título.
- issue: Alcance de הָאָרֶץ
  choice: a terra, em sentido global
  alternative: a terra ou o país, em sentido local
  rationale: A convocação da criação para se alegrar favorece o alcance cósmico, mas a nota conserva a possibilidade lexical mais local.
- issue: Valor temporal de בָא
  choice: vem
  alternative: está vindo; veio
  rationale: A forma hebraica, no contexto poético, pode apresentar uma ação vindoura como vívida e certa; a tradução evita determinar em excesso seu aspecto temporal.
translation_notes:
  register: Português moderno, digno e acessível, com leve cadência poética. A ordem das notas acompanha os termos a que se referem no versículo; todos os marcadores aparecem no texto principal.
