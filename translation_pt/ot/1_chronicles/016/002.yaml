id: 1CH.16.2
reference: 1 Chronicles 16:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְכַ֣ל דָּוִ֔יד מֵ/הַעֲל֥וֹת הָ/עֹלָ֖ה וְ/הַ/שְּׁלָמִ֑ים וַ/יְבָ֥רֶךְ אֶת הָ/עָ֖ם בְּ/שֵׁ֥ם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/002.yaml
  text: When David finished offering up the burnt offering and the peace offerings[a], he blessed the people in the name of Yahweh.
translation:
  language: pt
  text: Quando Davi terminou de oferecer o holocausto e as ofertas de comunhão[a], abençoou o povo em nome de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir por “ofertas pacíficas” ou “ofertas de bem-estar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: Quando ... terminou
  rationale: O wayyiqtol de כלה marca a conclusão da ação e sua ligação temporal com a bênção que se segue; esta formulação é natural em português.
- source_word: מֵהַעֲלוֹת
  choice: de oferecer
  rationale: A construção de מן com o infinitivo após כלה significa concluir ou terminar de fazer algo; o verbo 'oferecer' comunica naturalmente a ação sacrificial.
- source_word: הָעֹלָה
  choice: o holocausto
  rationale: עֹלָה é o termo sacrificial convencional para a oferta inteiramente queimada; 'holocausto' é a designação bíblica consagrada e reconhecível em português.
- source_word: וְהַשְּׁלָמִים
  choice: e as ofertas de comunhão
  rationale: שְׁלָמִים designa sacrifícios ligados à paz, ao bem-estar e à comunhão. 'Ofertas de comunhão' é compreensível no português atual e evita que 'ofertas pacíficas' seja entendido apenas como ofertas não violentas; alternativas legítimas são registradas em nota.
- source_word: וַיְבָרֶךְ
  choice: abençoou
  rationale: ברך significa aqui conceder ou pronunciar uma bênção; o verbo simples preserva a concisão do hebraico.
- source_word: אֶת־הָעָם
  choice: o povo
  rationale: O objeto direto é simplesmente 'o povo'; não se acrescenta 'todo', ausente no texto deste versículo.
- source_word: בְּשֵׁם יְהוָה
  choice: em nome de Yahweh
  rationale: בְּשֵׁם corresponde naturalmente a 'em nome de', e o nome divino é transliterado como Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome pessoal divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do termo sacrificial שְׁלָמִים
  choice: ofertas de comunhão
  alternative: ofertas pacíficas; ofertas de bem-estar
  rationale: O termo hebraico abrange ideias de paz, integridade, bem-estar e comunhão. A tradução principal privilegia clareza contemporânea sem negar as demais nuances, que são preservadas em nota.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o Tetragrama. 'Yahweh' preserva o caráter de nome próprio e segue a orientação lexical fornecida, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção temporal reproduz a sequência narrativa hebraica; a elipse do sujeito antes de 'abençoou' é natural em português e mantém Davi como referente inequívoco.
