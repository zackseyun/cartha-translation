base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/017.yaml
  text: And he confirmed it to Jacob as a statute[a], to Israel as an everlasting covenant[b],
translation:
  language: pt
  text: E a confirmou a Jacó como decreto[a], a Israel como aliança perpétua[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a estabeleceu”. O verbo hebraico pode transmitir a ideia de fazer algo permanecer firme.
    reason: lexical_alternative
  - marker: b
    text: Ou “aliança eterna”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמִידֶהָ
  choice: E a confirmou
  rationale: O hifil de עמד expressa fazer algo permanecer firme ou válido. O pronome feminino “a” preserva a referência anafórica à aliança, palavra ou promessa jurada do contexto anterior, sem restringi-la indevidamente.
- source_word: לְיַעֲקֹב
  choice: a Jacó
  rationale: A preposição לְ marca aqui o destinatário ou beneficiário; “a Jacó” mantém a construção paralela do hebraico.
- source_word: לְחֹק
  choice: como decreto
  rationale: חֹק designa algo fixado ou estabelecido com força normativa. “Decreto” é atual, claro e conserva o tom formal e jurídico do contexto da aliança.
- source_word: לְיִשְׂרָאֵל
  choice: a Israel
  rationale: Mantém o paralelismo com “a Jacó” e preserva a repetição intencional dos nomes no texto hebraico.
- source_word: בְּרִית עוֹלָם
  choice: como aliança perpétua
  rationale: “Aliança” preserva o termo teológico central בְּרִית, e “perpétua” comunica a duração permanente de עוֹלָם sem impor uma formulação filosófica mais específica.
theological_decisions:
- issue: Referente do sufixo feminino em וַיַּעֲמִידֶהָ
  choice: O pronome “a” remete de modo aberto à realidade pactual mencionada no contexto anterior.
  alternative: Entendê-lo especificamente como referência apenas ao juramento.
  rationale: Os versículos anteriores aproximam aliança, palavra prometida e juramento. O pronome preserva a anáfora e a ambiguidade contextual, sem selecionar silenciosamente um único antecedente.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A conjunção inicial foi preservada; a estrutura paralela “a Jacó... a Israel...” e a terminologia da aliança foram mantidas.
