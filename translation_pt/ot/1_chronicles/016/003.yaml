base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/003.yaml
  text: He distributed to every person of Israel[a], from man to woman, to each one a loaf of bread, a portion of meat, and a raisin cake.
translation:
  language: pt
  text: E distribuiu a cada israelita, homem ou mulher, um pão, uma porção de carne[a] e um bolo de passas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “uma porção” ou outro alimento. A palavra hebraica אֶשְׁפָּר é rara, e seu sentido exato é incerto; muitos a entendem aqui como uma porção de carne.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַלֵּק
  choice: E distribuiu
  rationale: O piel de חלק indica repartir ou distribuir porções entre muitas pessoas; “distribuiu” é claro e natural, e a conjunção preserva a sequência narrativa.
- source_word: לְכָל אִישׁ יִשְׂרָאֵל
  choice: a cada israelita
  rationale: אִישׁ tem força distributiva neste contexto. “Cada israelita” comunica que a dádiva foi entregue individualmente e, junto da expressão seguinte, inclui homens e mulheres.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: homem ou mulher
  rationale: A expressão hebraica abrange explicitamente ambos os sexos. Esta formulação é natural em português e preserva a extensão individual dos destinatários.
- source_word: לְאִישׁ
  choice: a cada [um]
  rationale: A ideia distributiva é expressa pela construção “a cada israelita”; repetir “a cada um” tornaria a frase pesada em português sem acrescentar conteúdo.
- source_word: כִּכַּר לֶחֶם
  choice: um pão
  rationale: כִּכָּר designa aqui um pão inteiro, provavelmente arredondado; “um pão” é idiomático e suficientemente preciso.
- source_word: אֶשְׁפָּר
  choice: uma porção de carne
  rationale: O termo é raro e de sentido incerto. No contexto de uma distribuição festiva de alimentos, “porção de carne” representa uma interpretação contextual comum, com a incerteza registrada em nota.
- source_word: אֲשִׁישָׁה
  choice: um bolo de passas
  rationale: O substantivo designa um bolo prensado, geralmente entendido como feito de passas; “bolo de passas” é conciso e amplamente compreensível.
