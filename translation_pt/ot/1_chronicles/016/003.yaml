  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A formulação compacta evita uma repetição pouco natural, mas mantém a distribuição individual e a inclusão explícita de homens e mulheres. A nota foi colocada junto ao termo realmente incerto.
