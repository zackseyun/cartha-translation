  text: הוֹד֤וּ לַֽ/יהוָה֙ קִרְא֣וּ בִ/שְׁמ֔/וֹ הוֹדִ֥יעוּ בָ/עַמִּ֖ים עֲלִילֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/008.yaml
  text: Give thanks to Yahweh[a]; call on his name[b]; make his deeds known among the peoples.
translation:
  language: pt
  text: Deem graças a Yahweh; invoquem o seu nome; tornem conhecidos entre os povos os seus feitos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹד֤וּ
  choice: Deem graças
  rationale: O imperativo plural do hifil de ידה, neste contexto de louvor, expressa ação de graças; a formulação é natural e preserva o valor verbal.
- source_word: לַֽיהוָה
  choice: a Yahweh
  rationale: Reproduz o nome divino יהוה como nome próprio, de acordo com a evidência hebraica e a convenção indicada para o projeto.
- source_word: קִרְא֣וּ בִשְׁמוֹ
  choice: invoquem o seu nome
  rationale: A construção קרא בְּשֵׁם denota aqui invocar ou apelar a Deus; 'invoquem o seu nome' é idiomático e mantém a dimensão cultual.
- source_word: הוֹדִ֥יעוּ
  choice: tornem conhecidos
  rationale: O hifil de ידע tem força causativa, 'fazer saber'; a escolha comunica essa força em português corrente.
- source_word: בָעַמִּים
  choice: entre os povos
  rationale: עמּים designa coletividades humanas ou povos no plural; 'povos' conserva melhor essa amplitude étnica do que o sentido geopolítico moderno de 'nações'.
- source_word: עֲלִילֹתָיו
  choice: os seus feitos
  rationale: O substantivo designa atos ou ações; 'feitos' mantém o sentido amplo sem acrescentar a qualificação interpretativa 'poderosos'.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz explicitamente o Tetragrama. 'Yahweh' preserva sua função de nome próprio sem substituí-lo por um título nem adotar a forma híbrida tradicional 'Jeová'.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com imperativos no plural. A sequência coordenada e concisa dos três apelos do hebraico foi preservada.
