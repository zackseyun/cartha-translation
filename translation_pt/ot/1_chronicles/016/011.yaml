base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/011.yaml
  text: Seek Yahweh and his strength[a]; seek his face continually.
translation:
  language: pt
  text: Busquem Yahweh e a sua força; busquem a sua face[a] continuamente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a sua presença”; literalmente, “a sua face”.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּרְשׁוּ
  choice: Busquem
  rationale: O imperativo chama o povo a voltar-se ativamente para Deus e procurá-lo; “busquem” comunica essa ação com clareza e dignidade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְעֻזּוֹ
  choice: e a sua força
  rationale: עֹז denota aqui força ou poder; a tradução direta mantém o paralelismo com a busca da face de Deus.
- source_word: בַּקְּשׁוּ
  choice: busquem
  rationale: O verbo expressa procura intencional e perseverante. Repetir “busquem” preserva o paralelismo poético dos dois imperativos hebraicos sem impor uma distinção artificial.
- source_word: פָנָיו
  choice: a sua face
  rationale: Mantém a imagem concreta do hebraico, que neste contexto também pode designar a presença pessoal de Deus.
- source_word: תָּמִיד
  choice: continuamente
  rationale: Expressa constância ou regularidade persistente e conserva o tom exortativo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido de פָנָיו
  choice: a sua face
  alternative: a sua presença
  rationale: A tradução principal conserva a metáfora hebraica e sua força relacional, enquanto a nota registra o sentido idiomático possível sem eliminar a ambiguidade.
translation_notes:
  register: Português moderno, claro e solene, com forma verbal plural inclusiva e legível tanto no Brasil quanto internacionalmente. A ordem foi ajustada para “continuamente a sua face”, mais natural em português, sem alterar o alcance do advérbio.
