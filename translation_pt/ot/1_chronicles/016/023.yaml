base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/023.yaml
  text: Sing to Yahweh[a], all the earth[b]; proclaim his salvation from day to day.
translation:
  language: pt
  text: Cantem a Yahweh[a], toda a terra; anunciem, dia após dia, a sua salvação.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH” (יהוה), o nome divino, aqui representado como “Yahweh”. Muitas traduções portuguesas usam “SENHOR”.'
    reason: divine_name
  - marker: b
    text: 'Ou: “proclamem as boas notícias da sua salvação, de dia em dia”. O verbo hebraico pode indicar o anúncio de boas notícias, e “salvação” também pode significar “livramento”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: Cantem
  rationale: Imperativo plural de שׁיר. “Cantem” transmite diretamente a convocação coletiva, sem acrescentar um objeto como “louvores”.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל marca o destinatário do canto, e o nome divino יהוה é transliterado como “Yahweh” para preservar o nome próprio presente no hebraico.
- source_word: כָּל הָאָרֶץ
  choice: todos os habitantes da terra
  rationale: Literalmente, “toda a terra”. Como o imperativo plural se dirige a pessoas capazes de cantar e anunciar, a formulação explicita a metonímia natural sem restringir o alcance universal.
- source_word: בַּשְּׂרוּ
  choice: anunciem
  rationale: O piel imperativo de בשׂר significa trazer ou anunciar boas notícias. “Anunciem” é natural em português e mantém a força pública da proclamação.
- source_word: מִיּוֹם אֶל יוֹם
  choice: dia após dia
  rationale: Expressa repetição contínua e diária. “Dia após dia” é idiomático e conserva a cadência poética.
- source_word: יְשׁוּעָתוֹ
  choice: a salvação que ele dá
  rationale: יְשׁוּעָה pode denotar salvação ou livramento. A expressão evita a possível leitura, em português, de que Deus seja aquele que precisa ser salvo, comunicando que a salvação procede dele.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título; a nota registra a convenção portuguesa mais difundida.
- issue: Sentido de יְשׁוּעָתוֹ
  choice: a salvação que ele dá
  alternative: sua salvação; seu livramento; sua vitória
  rationale: A escolha comunica de modo natural que Yahweh é a fonte da salvação. A nota preserva a forma mais literal e a amplitude lexical entre salvação e livramento.
- issue: Alcance de כָּל הָאָרֶץ
  choice: todos os habitantes da terra
  alternative: toda a terra; toda a região
  rationale: No contexto hínico, a convocação tem alcance universal. A personificação/metonímia do hebraico é explicitada no texto, enquanto a forma literal fica registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com imperativos no plural. A formulação conserva o paralelismo poético e a universalidade da convocação, usando “dia após dia” como expressão corrente. Os marcadores [a] e [b] aparecem no texto principal.
