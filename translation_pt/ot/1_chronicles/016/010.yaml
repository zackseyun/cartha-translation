source:
  edition: WLC
  text: הִֽתְהַֽלְלוּ֙ בְּ/שֵׁ֣ם קָדְשׁ֔/וֹ יִשְׂמַ֕ח לֵ֖ב מְבַקְשֵׁ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/010.yaml
  text: Boast in his holy name[a]; let the hearts of those who seek Yahweh rejoice.
translation:
  language: pt
  text: Gloriem-se no seu santo nome; alegre-se o coração dos que buscam Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH, o nome divino, tradicionalmente traduzido como “SENHOR”; outra forma: “Javé”.'
    reason: Identifica o Tetragrama e registra tanto a tradução tradicional por título quanto uma transliteração portuguesa alternativa.
lexical_decisions:
- source_word: הִתְהַלְלוּ
  choice: Gloriem-se
  rationale: O hitpael imperativo plural de הלל expressa exultar ou gloriar-se em alguém. “Gloriem-se” conserva a força imperativa e a construção com בְּ, sem introduzir a conotação predominantemente negativa que “orgulhem-se” pode ter em português.
- source_word: בְּשֵׁם קָדְשׁוֹ
  choice: no seu santo nome
  rationale: A preposição בְּ indica a esfera ou base do ato de gloriar-se; “no seu santo nome” é fiel à construção hebraica e natural em português.
- source_word: יִשְׂמַח
  choice: alegre-se
  rationale: Embora seja formalmente um imperfeito de terceira pessoa masculina singular, no contexto poético e exortativo tem valor jussivo. “Alegre-se” preserva esse sentido.
- source_word: לֵב
  choice: o coração
  rationale: O substantivo está no singular e funciona coletivamente como referência ao ser interior. O singular foi mantido por ser claro e idiomático em português.
- source_word: מְבַקְשֵׁי
  choice: dos que buscam
  rationale: O particípio substantivado descreve pessoas caracterizadas por buscar continuamente; “os que buscam” reproduz esse valor de modo natural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio, enquanto “SENHOR” representa a substituição tradicional por um título.
translation_notes:
  register: Português moderno, claro e reverente, com paralelismo poético preservado. “Gloriem-se” mantém dignidade sem soar excessivamente arcaico. O marcador da nota foi colocado junto de “Yahweh”, termo ao qual a nota efetivamente se refere.
