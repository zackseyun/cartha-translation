  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הָב֥וּ לַ/יהוָ֖ה כְּב֣וֹד שְׁמ֑/וֹ שְׂא֤וּ מִנְחָה֙ וּ/בֹ֣אוּ לְ/פָנָ֔י/ו הִשְׁתַּחֲו֥וּ לַ/יהוָ֖ה בְּ/הַדְרַת קֹֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/029.yaml
  text: Ascribe to Yahweh the glory due his name; bring an offering and come before him[a]. Bow down to Yahweh in holy splendor.
translation:
  language: pt
  text: Deem a Yahweh a glória devida ao seu nome; tragam uma oferta e venham à sua presença. Prostrem-se diante de Yahweh no esplendor da santidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em santo esplendor”; possivelmente: “com trajes santos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ
  choice: Deem
  rationale: Neste imperativo litúrgico, o verbo significa atribuir ou reconhecer honra, e não transferir algo material; “deem” preserva a forma direta e soa natural em português.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: O nome divino יהוה é transliterado como “Yahweh”, preservando o nome da aliança presente no texto hebraico.
- source_word: כְּבוֹד שְׁמוֹ
  choice: a glória devida ao seu nome
  rationale: A expressão construta indica a glória associada ao nome ou que lhe é devida; a formulação explicita de modo natural o sentido idiomático.
- source_word: שְׂאוּ מִנְחָה
  choice: tragam uma oferta
  rationale: Embora שְׂאוּ possa significar literalmente “levantem” ou “carreguem”, com מִנְחָה expressa o ato de trazer ou apresentar uma oferta.
- source_word: וּבֹאוּ לְפָנָיו
  choice: e venham à sua presença
  rationale: A expressão hebraica descreve a aproximação reverente diante de Deus; “à sua presença” comunica naturalmente o idioma espacial.
- source_word: הִשְׁתַּחֲווּ
  choice: Prostrem-se
  rationale: O verbo denota inclinar-se profundamente ou prostrar-se em adoração; “prostrem-se” preserva melhor o gesto corporal do que o termo mais interpretativo “adorem”.
- source_word: בְּהַדְרַת קֹדֶשׁ
  choice: no esplendor da santidade
  rationale: A expressão poética pode indicar a beleza esplêndida da santidade ou vestes/adornos santos. A tradução principal mantém a relação entre esplendor e santidade sem restringi-la ao vestuário.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; “Yahweh” preserva o nome próprio da aliança sem substituí-lo por um título.
- issue: Sentido de בְּהַדְרַת קֹדֶשׁ
  choice: no esplendor da santidade
  alternative: em santo esplendor; com trajes santos
  rationale: A formulação principal preserva a linguagem teológico-estética e a ambiguidade do hebraico; a possível referência a vestes cultuais é mantida em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com imperativos no plural e paralelismo litúrgico preservado. O marcador [a] foi colocado imediatamente após a expressão ambígua a que se refere.
