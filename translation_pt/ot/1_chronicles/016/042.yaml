    text: 'Ou: “para a porta”; possivelmente, para o serviço da porta.'
    reason: lexical_alternative
  revision_rationale: A revisão substitui uma construção transitiva interpretativa por “para soarem”, que preserva a finalidade sonora indicada pelo hebraico e soa naturalmente em português. A nota é ajustada para registrar a alternativa funcional sem fixar uma interpretação além do que a expressão hebraica exige.
