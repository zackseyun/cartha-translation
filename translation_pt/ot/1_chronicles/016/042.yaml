base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/042.yaml
  text: And with them were Heman and Jeduthun with trumpets and cymbals for sounding aloud[a], and instruments for the songs of God; and the sons of Jeduthun were at the gate.
translation:
  language: pt
  text: Com eles estavam Hemã e Jedutum, com trombetas e címbalos para soarem, e com instrumentos para os cânticos de Deus; os filhos de Jedutum estavam à porta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para a porta”; possivelmente, para o serviço da porta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעִמָּהֶם
  choice: Com eles estavam
  rationale: A expressão preposicional introduz as pessoas que acompanhavam o grupo; o verbo “estavam” é suprido naturalmente em português.
- source_word: הֵימָן
  choice: Hemã
  rationale: Forma tradicional e corrente do nome hebraico em português.
- source_word: וִידוּתוּן
  choice: e Jedutum
  rationale: Transliteração portuguesa corrente do nome próprio.
- source_word: חֲצֹצְרוֹת
  choice: trombetas
  rationale: Equivalente usual das trombetas metálicas cerimoniais empregadas no culto.
- source_word: וּמְצִלְתַּיִם
  choice: e címbalos
  rationale: Designação moderna e reconhecível do instrumento de percussão.
- source_word: לְמַשְׁמִיעִים
  choice: para fazê-los ressoar
  rationale: O particípio causativo de שמע expressa fazer ouvir ou produzir som. A formulação portuguesa relaciona naturalmente a ação às trombetas e aos címbalos, sem especificar melodia.
- source_word: וּכְלֵי שִׁיר
  choice: e com instrumentos para os cânticos
  rationale: Preserva a relação literal com “cântico” sem reduzir a expressão ao termo genérico “instrumentos musicais”; a repetição de “com” torna clara a sintaxe elíptica.
- source_word: הָאֱלֹהִים
  choice: de Deus
  rationale: Mantém a construção hebraica e evita decidir se os cânticos pertenciam a Deus ou eram destinados especificamente ao seu culto.
- source_word: וּבְנֵי יְדוּתוּן
  choice: os filhos de Jedutum
  rationale: Tradução direta e adequada ao contexto genealógico e levítico.
- source_word: לַשַּׁעַר
  choice: estavam à porta
  rationale: A preposição hebraica pode indicar localização ou designação para o serviço da porta. O texto principal conserva a formulação concisa, e a nota registra a alternativa funcional.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e terminologia cultual amplamente compreensível. A ambiguidade de לַשַּׁעַר entre localização e função foi preservada no texto e explicitada em nota.
