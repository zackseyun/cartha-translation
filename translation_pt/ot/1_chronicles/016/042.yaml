revisions:
- from: Com eles estavam Hemã e Jedutum, com trombetas e címbalos para fazê-los ressoar, e com instrumentos para os cânticos de Deus; os filhos de Jedutum estavam à porta.[a]
  to: Com eles estavam Hemã e Jedutum, com trombetas e címbalos para soarem, e com instrumentos para os cânticos de Deus; os filhos de Jedutum estavam à porta.[a]
  rationale: A revisão substitui uma construção transitiva interpretativa por “para soarem”, que preserva a finalidade sonora indicada pelo hebraico e soa naturalmente em português. A nota é ajustada para registrar a alternativa funcional sem fixar uma interpretação além do que a expressão hebraica exige.
