base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/021.yaml
  text: He allowed no man to oppress them[a], and he rebuked kings on their account,
translation:
  language: pt
  text: 'Não permitiu que ninguém os oprimisse e, por causa deles[a], repreendeu reis:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em favor deles” ou “por eles”.
    reason: Alternativas lexicais para עֲלֵיהֶם, cuja relação pode ser entendida em sentido causal ou benéfico.
lexical_decisions:
- source_word: הִנִּיחַ
  choice: permitiu
  rationale: No hifil, com a negação e um infinitivo, expressa permitir ou deixar que algo aconteça. “Não permitiu” é claro, natural e preserva a ação protetora do sujeito.
- source_word: אִישׁ
  choice: ninguém
  rationale: Embora o hebraico use o singular masculino אִישׁ, a construção negativa tem sentido genérico. “Ninguém” transmite esse valor idiomaticamente em português, sem restringi-lo a homens.
- source_word: לְעָשְׁקָם
  choice: que ... os oprimisse
  rationale: עשׁק abrange oprimir, explorar ou lesar. “Oprimisse” conserva o sentido amplo de maus-tratos e se ajusta ao resumo histórico.
- source_word: וַיּוֹכַח
  choice: repreendeu
  rationale: יכח, neste contexto, indica censurar ou repreender. “Repreendeu” mantém a força da intervenção dirigida contra reis.
- source_word: עֲלֵיהֶם
  choice: por causa deles
  rationale: A preposição עַל com o sufixo pode indicar que a ação foi tomada em consideração a eles, por causa deles ou em favor deles. A formulação escolhida é natural e deixa a nuance causal/protetora suficientemente aberta.
- source_word: מְלָכִים
  choice: reis
  rationale: É o equivalente direto e contextualmente adequado de מְלָכִים.
theological_decisions:
- issue: Sujeito implícito dos verbos
  choice: Deus, retomado pelo sujeito verbal não expresso
  alternative: Um sujeito não especificado
  rationale: O contexto anterior identifica o SENHOR como aquele que protege os patriarcas. O português permite conservar o sujeito oculto, evitando inserir um pronome ou nome ausente deste versículo sem tornar a frase obscura.
- issue: Sentido de עֲלֵיהֶם
  choice: por causa deles
  alternative: em favor deles; por eles
  rationale: A expressão pode destacar tanto a causa quanto o benefício da intervenção divina. A tradução principal preserva a relação sem definir de modo exclusivo se a ênfase é causal ou protetora.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém a coordenação compacta do hebraico e os dois verbos no passado. O sujeito fica oculto, como é natural em português e como no texto hebraico, sendo identificado pelo contexto. Os dois-pontos refletem a continuidade para a fala do versículo seguinte.
