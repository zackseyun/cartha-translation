  text: כִּ֠י כָּל אֱלֹהֵ֤י הָ/עַמִּים֙ אֱלִילִ֔ים וַ/יהוָ֖ה שָׁמַ֥יִם עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/026.yaml
  text: For all the gods of the peoples are idols[b][a], but Yahweh made the heavens.
translation:
  language: pt
  text: Pois todos os deuses dos povos[a] são ídolos, mas[b] Yahweh fez os céus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “das nações”.'
    reason: lexical_alternative
  - marker: b
    text: 'A conjunção hebraica significa literalmente “e”, mas aqui tem sentido de contraste: “mas Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da convocação à adoração no contexto e preserva de modo natural o valor explicativo da conjunção.
- source_word: כָּל
  choice: todos
  rationale: Mantém o alcance abrangente da afirmação hebraica.
- source_word: אֱלֹהֵי
  choice: deuses
  rationale: No construto com “dos povos”, refere-se às divindades cultuadas por esses povos; “deuses” é a tradução direta e corrente.
- source_word: הָעַמִּים
  choice: dos povos
  rationale: “Povos” representa diretamente o plural hebraico e evita a conotação predominantemente política que “nações” pode sugerir.
- source_word: אֱלִילִים
  choice: ídolos
  rationale: O termo designa ídolos e possui matiz depreciativo, associado à falta de valor; “ídolos” comunica o referente com clareza sem ampliar o texto por paráfrase.
- source_word: וַיהוָה
  choice: mas Yahweh
  rationale: Embora ו seja literalmente “e”, a relação entre as orações é contrastiva. O nome divino יהוה é transliterado como “Yahweh”.
- source_word: שָׁמַיִם
  choice: os céus
  rationale: O plural português preserva a forma hebraica e é natural em linguagem de criação.
- source_word: עָשָׂה
  choice: fez
  rationale: Traduz diretamente o sentido amplo de עשה; evita a especificação interpretativa maior de “criou”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o Tetragrama como nome próprio. “Yahweh” procura representar diretamente o nome divino sem substituí-lo por um título.
- issue: Valor da conjunção ו antes de יהוה
  choice: contraste adversativo (“mas”)
  alternative: coordenação simples (“e”)
  rationale: A forma hebraica é uma conjunção coordenativa, mas o discurso contrapõe os ídolos dos povos a Yahweh, que fez os céus. “Mas” torna explícita em português essa relação contextual sem alterar o conteúdo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A formulação concisa acompanha o paralelismo e o contraste do hebraico.
