id: 1CH.16.25
reference: 1 Chronicles 16:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּי֩ גָד֨וֹל יְהוָ֤ה וּ/מְהֻלָּל֙ מְאֹ֔ד וְ/נוֹרָ֥א ה֖וּא עַל כָּל אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/025.yaml
  text: For Yahweh is great and greatly to be praised[a], and he is to be feared above all gods.
translation:
  language: pt
  text: Pois Yahweh é grande e muito digno de louvor; ele deve ser temido acima de todos os deuses.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ele inspira temor mais do que todos os deuses”. O hebraico expressa temor reverente e assombro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão para o chamado à adoração no contexto e preserva de modo natural a função explicativa da conjunção.
- source_word: גָדוֹל
  choice: grande
  rationale: Expressa diretamente a grandeza, a majestade e a posição elevada de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: מְהֻלָּל מְאֹד
  choice: muito digno de louvor
  rationale: Comunica o valor predicativo do particípio passivo e a forte intensificação de מְאֹד em português natural; evita a impressão de que o texto apenas relata que Yahweh já é louvado.
- source_word: נוֹרָא
  choice: deve ser temido
  rationale: Preserva a ideia de inspirar temor reverente e assombro, sem reduzir o termo ao sentido coloquial de “impressionante” nem sugerir apenas terror.
- source_word: עַל כָּל אֱלֹהִים
  choice: acima de todos os deuses
  rationale: Mantém o sentido comparativo de superioridade sobre os deuses das nações e segue de perto a construção hebraica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o Tetragrama como nome pessoal; a transliteração preserva esse dado sem substituí-lo por um título.
- issue: Sentido de נוֹרָא aplicado a Yahweh
  choice: deve ser temido
  alternative: é temível; inspira temor
  rationale: A escolha conserva tanto o temor reverente quanto o assombro implicados pela raiz ירא, sem resolver a expressão como mero medo ou simples admiração.
- issue: Referência de אֱלֹהִים no plural
  choice: deuses
  alternative: seres divinos
  rationale: No contexto imediato, o contraste é com os deuses das nações. “Deuses” preserva o sentido lexical e a força polêmica sem definir aqui a natureza ou realidade desses deuses.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Pois” mantém a ligação argumentativa com o contexto; o ponto e vírgula separa as duas afirmações paralelas sem romper sua unidade poética.
