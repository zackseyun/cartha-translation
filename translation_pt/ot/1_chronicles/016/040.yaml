id: 1CH.16.40
reference: 1 Chronicles 16:40
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לְֽ/הַעֲלוֹת֩ עֹל֨וֹת לַ/יהוָ֜ה עַל מִזְבַּ֧ח הָ/עֹלָ֛ה תָּמִ֖יד לַ/בֹּ֣קֶר וְ/לָ/עָ֑רֶב וּ/לְ/כָל הַ/כָּתוּב֙ בְּ/תוֹרַ֣ת יְהוָ֔ה אֲשֶׁ֥ר צִוָּ֖ה עַל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/040.yaml
  text: to offer burnt offerings to Yahweh on the altar of burnt offering continually[a], morning and evening, and according to all that is written in the law of Yahweh, which he commanded for Israel.
translation:
  language: pt
  text: para oferecer continuamente holocaustos a Yahweh sobre o altar do holocausto, de manhã e à tarde, conforme tudo o que está escrito na lei[a] de Yahweh, que ele ordenou a Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na instrução de Yahweh”. O termo hebraico torá pode significar tanto “lei” como “instrução”.
    reason: Alternativa lexical legítima para תּוֹרָה.
lexical_decisions:
- source_word: לְהַעֲלוֹת
  choice: para oferecer
  rationale: O infinitivo hifil de עלה significa literalmente “fazer subir”, mas, em contexto sacrificial, designa o ato de oferecer; “oferecer” comunica naturalmente esse sentido em português.
- source_word: עֹלוֹת
  choice: holocaustos
  rationale: עֹלָה é o termo sacrificial para a oferta inteiramente queimada. “Holocaustos” é a designação bíblica consagrada em português, embora no uso moderno também tenha outras associações.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל marca o destinatário da oferta, e o nome divino יהוה é transliterado como “Yahweh”.
- source_word: מִזְבַּח הָעֹלָה
  choice: o altar do holocausto
  rationale: A construção identifica o altar destinado ao holocausto; esta formulação é clara e tradicional em português.
- source_word: תָּמִיד
  choice: continuamente
  rationale: O termo indica continuidade ou regularidade cultual; “continuamente” preserva sua força, enquanto “de manhã e à tarde” esclarece o ritmo diário.
- source_word: לַבֹּקֶר וְלָעָרֶב
  choice: de manhã e à tarde
  rationale: A expressão indica os dois momentos diários das ofertas e é vertida de maneira idiomática em português.
- source_word: וּלְכָל הַכָּתוּב
  choice: conforme tudo o que está escrito
  rationale: Neste contexto, ל expressa conformidade com as prescrições registradas; “conforme” torna essa relação explícita sem alterar o sentido.
- source_word: בְּתוֹרַת יְהוָה
  choice: na lei de Yahweh
  rationale: תּוֹרָה pode significar “lei” ou “instrução”. Neste contexto de prescrições cultuais escritas, “lei” é clara e natural, e a alternativa lexical é preservada em nota.
- source_word: אֲשֶׁר צִוָּה עַל יִשְׂרָאֵל
  choice: que ele ordenou a Israel
  rationale: A expressão apresenta as prescrições como impostas a Israel. A formulação portuguesa é natural e conserva Israel como destinatário da ordem.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o tetragrama; “Yahweh” preserva o nome pactual sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe infinitiva inicial (“para oferecer”) foi mantida porque o versículo continua a estrutura da frase anterior. O marcador [a] foi colocado junto de “lei”, expressão à qual a nota efetivamente se refere.
