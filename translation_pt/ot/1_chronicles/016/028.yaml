  text: הָב֤וּ לַֽ/יהוָה֙ מִשְׁפְּח֣וֹת עַמִּ֔ים הָב֥וּ לַ/יהוָ֖ה כָּב֥וֹד וָ/עֹֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/028.yaml
  text: Ascribe to Yahweh[a], families of the peoples, ascribe to Yahweh glory and strength.
translation:
  language: pt
  text: Atribuam a Yahweh, ó famílias dos povos,[a] atribuam a Yahweh glória e força.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “clãs dos povos” ou “famílias das nações”.
    reason: Alternativas lexicais legítimas para מִשְׁפְּחוֹת עַמִּים.
lexical_decisions:
- source_word: הָבוּ
  choice: Atribuam
  rationale: O imperativo plural de יהב, neste contexto litúrgico, convoca os povos a reconhecer como pertencentes a Yahweh a glória e a força, e não a lhe transferir literalmente alguma coisa. “Atribuam” comunica essa força idiomática e preserva a repetição poética.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל marca aquele a quem se atribuem glória e força; o nome divino é transliterado como “Yahweh”.
- source_word: מִשְׁפְּחוֹת עַמִּים
  choice: famílias dos povos
  rationale: מִשְׁפְּחוֹת designa grupos de parentesco, famílias ou clãs, enquanto עַמִּים é plural. A formulação preserva a construção hebraica e o alcance universal do chamado.
- source_word: כָּבוֹד
  choice: glória
  rationale: No contexto de louvor, כָּבוֹד indica a honra, majestade ou glória reconhecida como própria de Deus; “glória” é natural e adequada ao registro.
- source_word: וָעֹז
  choice: e força
  rationale: עֹז denota força ou poder. “Força” mantém o paralelismo conciso com “glória” sem acrescentar uma interpretação.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome da aliança em vez de substituí-lo por um título, sem introduzir uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição do imperativo e a ordem poética do hebraico foram preservadas; a vírgula mantém o fluxo da convocação.
