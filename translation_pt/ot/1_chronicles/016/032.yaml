  text: יִרְעַ֤ם הַ/יָּם֙ וּ/מְלוֹא֔/וֹ יַעֲלֹ֥ץ הַ/שָּׂדֶ֖ה וְ/כָל אֲשֶׁר בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/032.yaml
  text: Let the sea thunder[a], and all that fills it; let the field exult[b], and all that is in it.
translation:
  language: pt
  text: Ruja o mar[a] e tudo o que o enche[b]; exulte o campo e tudo o que nele há.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Retumbe o mar”. O verbo hebraico pode indicar um forte estrondo, retumbo ou rugido.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “a sua plenitude”, isto é, tudo o que enche o mar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְעַם
  choice: ruja
  rationale: O verbo רעם descreve um som forte, retumbante, como um estrondo ou rugido. “Ruja” mantém a personificação poética do mar e soa natural em português; “troveje” seria mais literal quanto à associação com o trovão, mas menos idiomático com “mar”.
- source_word: הַיָּם
  choice: o mar
  rationale: Equivalente direto e corrente de יָם, adequado ao paralelismo poético do versículo.
- source_word: וּמְלוֹאוֹ
  choice: e tudo o que o enche
  rationale: מְלוֹא significa literalmente “plenitude” e, neste contexto, designa tudo o que enche ou povoa o mar. A formulação escolhida conserva essa imagem de maneira clara e natural.
- source_word: יַעֲלֹץ
  choice: exulte
  rationale: עלץ expressa alegria intensa e jubilosa. “Exulte” preserva a força elevada da poesia sem deixar de ser compreensível.
- source_word: הַשָּׂדֶה
  choice: o campo
  rationale: Tradução direta de שָׂדֶה, que pode indicar campo ou terra aberta; “campo” mantém a concisão e o paralelismo com “mar”.
- source_word: וְכָל אֲשֶׁר בּוֹ
  choice: e tudo o que nele há
  rationale: A expressão abrange tudo o que se encontra no campo. Esta tradução reproduz naturalmente a construção relativa hebraica e a abrangência de כָל.
theological_decisions: []
