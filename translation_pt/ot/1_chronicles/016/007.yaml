base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/007.yaml
  text: On that day then David first appointed Asaph and his brothers to give thanks to Yahweh[a].
translation:
  language: pt
  text: Naquele dia, Davi encarregou pela primeira vez Asafe e seus irmãos de dar graças a Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Naquele dia, Davi colocou Asafe e seus irmãos à frente da ação de graças a Yahweh”. A expressão hebraica pode destacar o início dessa atividade, sua prioridade ou a posição de liderança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא אָז
  choice: Naquele dia
  rationale: A expressão situa a ação naquele momento da narrativa. Em português, “naquele dia” comunica naturalmente a força temporal, sem a redundância pouco fluente de reproduzir אָז separadamente.
- source_word: נָתַן
  choice: encarregou
  rationale: Embora o verbo signifique literalmente “deu”, neste contexto administrativo e litúrgico indica a atribuição de uma responsabilidade.
- source_word: בָּרֹאשׁ
  choice: pela primeira vez
  rationale: A expressão idiomática pode indicar prioridade temporal, posição principal ou liderança. No contexto, a leitura temporal é natural, mas as demais possibilidades são preservadas em nota.
- source_word: לְהֹדוֹת
  choice: de dar graças
  rationale: O infinitivo hifil de ידה, em contexto litúrgico, denota agradecer ou louvar; “dar graças” mantém a formulação bíblica clara e corrente.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino יְהוָה, preservando-o como nome próprio da aliança.
- source_word: בְּיַד אָסָף וְאֶחָיו
  choice: Asafe e seus irmãos
  rationale: A construção literal “pela mão de” expressa agência. Em português natural, os agentes são integrados como complemento direto de “encarregou”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva sua função de nome próprio sem substituí-lo por um título.
- issue: Sentido de בָּרֹאשׁ
  choice: pela primeira vez
  alternative: como responsáveis principais / à frente
  rationale: A leitura temporal se ajusta à instituição da atividade naquele dia, mas o hebraico permite também uma nuance de primazia ou liderança, mantida explicitamente na nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A formulação evita literalismos opacos, preservando em nota a ambiguidade genuína de בָּרֹאשׁ.
