  text: And Obed-edom and their brothers[a], sixty-eight; and Obed-edom son of Jeduthun and Hosah were gatekeepers.
translation:
  language: pt
  text: E Obede-Edom e os irmãos deles[a], sessenta e oito; e Obede-Edom, filho de Jedutum, e Hosa eram porteiros.
  philosophy: optimal-equivalence
  footnotes:
