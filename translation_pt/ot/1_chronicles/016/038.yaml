    text: 'Hebraico: “os irmãos deles”. Algumas traduções usam “os irmãos dele” para esclarecer a relação, mas o texto principal preserva o sufixo plural do texto hebraico recebido.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/עֹבֵד אֱדֹם
  choice: E Obede-Edom
  rationale: A conjunção mantém a continuação da lista, e o nome próprio segue a forma tradicional e inteligível em português.
- source_word: וַ/אֲחֵי/הֶם
  choice: e os irmãos deles
  rationale: Preserva o sufixo masculino plural da forma hebraica recebida, sem regularizá-lo silenciosamente para o singular.
- source_word: שִׁשִּׁים וּ/שְׁמוֹנָה
  choice: sessenta e oito
  rationale: Emprega a forma cardinal natural do português moderno.
- source_word: וְ/עֹבֵד אֱדֹם
  choice: e Obede-Edom
  rationale: Repete o nome como no hebraico, introduzindo a especificação seguinte sem fundir as duas partes da lista.
- source_word: בֶּן יְדִיתוּן
  choice: filho de Jedutum
  rationale: Traduz diretamente a identificação genealógica, relevante no contexto de Crônicas.
- source_word: וְ/חֹסָה
  choice: e Hosa
  rationale: Translitera o nome próprio e o coordena com Obede-Edom na função indicada a seguir.
- source_word: לְ/שֹׁעֲרִים
  choice: eram porteiros
  rationale: O לְ indica função ou designação; a cópula é suprida para produzir uma predicação clara e natural em português.
