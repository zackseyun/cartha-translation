  text: שִׁ֤ירוּ ל/וֹ֙ זַמְּרוּ ל֔/וֹ שִׂ֖יחוּ בְּ/כָל נִפְלְאֹתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/009.yaml
  text: Sing to him[a]; sing praises to him; speak of all his wondrous deeds.
translation:
  language: pt
  text: Cantem a ele, cantem-lhe louvores; falem de todos os seus feitos maravilhosos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contem todos os seus feitos maravilhosos” ou “meditem em todos os seus feitos maravilhosos”. O verbo hebraico pode indicar tanto falar quanto refletir; neste contexto de exortação pública, o sentido de expressão verbal parece mais provável.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: Cantem
  rationale: Imperativo plural de שׁיר. “Cantem” é a forma direta, natural e adequada ao paralelismo poético.
- source_word: לֹו
  choice: a ele / lhe
  rationale: A preposição ל com sufixo de terceira pessoa masculina singular indica aqui o destinatário do canto e do louvor. A variação pronominal evita repetição pesada sem alterar o sentido.
- source_word: זַמְּרוּ
  choice: cantem-lhe louvores
  rationale: O piel de זמר pode significar fazer música ou cantar louvores. A formulação explicita o caráter de louvor e distingue este verbo do primeiro “cantem”.
- source_word: שִׂיחוּ
  choice: falem de
  rationale: שׂיח pode expressar falar, narrar ou meditar. Neste chamado público, o sentido verbal exterior é o mais provável, embora a nuance reflexiva permaneça possível e seja registrada em nota.
- source_word: בְּכָל
  choice: de todos
  rationale: Com “falem”, o português idiomático pede “de”; “todos” preserva a abrangência de כָּל.
- source_word: נִפְלְאֹתָיו
  choice: seus feitos maravilhosos
  rationale: נִפְלָאוֹת designa atos extraordinários que despertam admiração, frequentemente as obras poderosas de Deus. “Feitos maravilhosos” comunica tanto os atos concretos quanto seu caráter admirável.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com imperativos no plural. A colocação “cantem-lhe” preserva fluidez e solenidade sem arcaísmo excessivo. A nota mantém a ambiguidade lexical genuína de שׂיח.
