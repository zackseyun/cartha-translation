  text: וַ/יַּֽעֲזָב שָׁ֗ם לִ/פְנֵי֙ אֲר֣וֹן בְּרִית יְהוָ֔ה לְ/אָסָ֖ף וּ/לְ/אֶחָ֑י/ו לְ/שָׁרֵ֞ת לִ/פְנֵ֧י הָ/אָר֛וֹן תָּמִ֖יד לִ/דְבַר י֥וֹם בְּ/יוֹמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/037.yaml
  text: So he left Asaph and his brothers there before the ark of the covenant of Yahweh[a], to minister before the ark continually, according to each day's requirement.
translation:
  language: pt
  text: Ele deixou Asafe e seus irmãos ali, diante da arca da aliança de Yahweh, para ministrarem continuamente diante da arca, conforme a tarefa de cada dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “conforme a tarefa de um dia no seu dia”; isto é, conforme o que cada dia exigia.'
    reason: A construção idiomática hebraica admite uma tradução funcional, enquanto a nota preserva sua forma e nuance literais.
lexical_decisions:
- source_word: וַיַּעֲזָב
  choice: ele deixou
  rationale: O sentido lexical básico é “deixar”. No contexto, indica que Davi deixou Asafe e seus irmãos naquele lugar para o serviço contínuo, sem acrescentar a ideia mais interpretativa de “designou”.
- source_word: שָׁם
  choice: ali
  rationale: Advérbio locativo simples; “ali” é natural em português e retoma o lugar mencionado no contexto.
- source_word: לִפְנֵי אֲרוֹן בְּרִית יְהוָה
  choice: diante da arca da aliança de Yahweh
  rationale: “Diante de” preserva o sentido espacial e cultual de לִפְנֵי; a cadeia construta é mantida, e o nome divino é transliterado como Yahweh.
- source_word: לְאָסָף וּלְאֶחָיו
  choice: Asafe e seus irmãos
  rationale: Mantém o sentido direto de אֶחָיו. Embora possa abranger companheiros levitas, “irmãos” preserva a expressão hebraica sem resolver excessivamente sua abrangência.
- source_word: לְשָׁרֵת
  choice: para ministrarem
  rationale: No contexto cultual, שרת designa serviço ministerial ligado ao santuário. O plural é exigido naturalmente em português porque o sujeito é Asafe e seus irmãos.
- source_word: לִפְנֵי הָאָרוֹן
  choice: diante da arca
  rationale: Repete de modo coerente a expressão espacial e litúrgica anterior.
- source_word: תָּמִיד
  choice: continuamente
  rationale: Expressa a regularidade persistente do serviço cultual.
- source_word: לִדְבַר יוֹם בְּיוֹמוֹ
  choice: conforme a tarefa de cada dia
  rationale: Comunica de modo natural a obrigação ou atividade correspondente a cada dia, preservando em nota a forma mais literal do idioma hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e segue a decisão editorial fornecida, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantém a estrutura do hebraico quando natural, empregando equivalência funcional apenas no idioma final. O marcador [a] aparece no texto principal e esclarece a expressão temporal-administrativa final.
