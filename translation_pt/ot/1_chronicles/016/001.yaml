language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יָּבִ֨יאוּ֙ אֶת אֲר֣וֹן הָֽ/אֱלֹהִ֔ים וַ/יַּצִּ֣יגוּ אֹת֔/וֹ בְּ/ת֣וֹךְ הָ/אֹ֔הֶל אֲשֶׁ֥ר נָֽטָה ל֖/וֹ דָּוִ֑יד וַ/יַּקְרִ֛יבוּ עֹל֥וֹת וּ/שְׁלָמִ֖ים לִ/פְנֵ֥י הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/001.yaml
  text: So they brought in the ark of God and set it in the midst of the tent that David had pitched for it[b][a], and they offered burnt offerings and peace offerings before God.
translation:
  language: pt
  text: Assim, trouxeram a arca de Deus e a colocaram no meio da tenda que Davi havia armado para ela[a]; e ofereceram holocaustos e ofertas de comunhão[b] diante de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dentro da tenda”. A expressão hebraica pode indicar tanto o meio de algo quanto, de modo mais geral, seu interior.
    reason: lexical_alternative
  - marker: b
    text: Também chamadas “ofertas pacíficas” ou “ofertas de bem-estar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: trouxeram
  rationale: O hifil de בוא significa aqui “trazer”. Em português, o contexto da entrada na tenda torna desnecessário explicitar “para dentro”.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: a arca de Deus
  rationale: Reproduz a expressão hebraica sem acrescentar “da aliança”, ausente neste versículo.
- source_word: וַיַּצִּיגוּ אֹתוֹ
  choice: a colocaram
  rationale: יצג, neste contexto causativo, indica pôr ou colocar algo em sua posição.
- source_word: בְּתוֹךְ הָאֹהֶל
  choice: no meio da tenda
  rationale: Preserva a nuance espacial concreta de בְּתוֹךְ, embora a expressão também possa significar simplesmente “dentro da tenda”.
- source_word: הָאֹהֶל
  choice: a tenda
  rationale: O substantivo hebraico comum significa “tenda”; “tabernáculo” introduziria uma identificação cultual não explicitada no texto.
- source_word: אֲשֶׁר נָטָה לוֹ דָּוִיד
  choice: que Davi havia armado para ela
  rationale: נטה, empregado com “tenda”, significa armá-la ou estendê-la; לוֹ refere-se naturalmente à arca.
- source_word: וַיַּקְרִיבוּ
  choice: ofereceram
  rationale: No contexto sacrificial, o hifil de קרב significa apresentar ou oferecer uma oferta.
- source_word: עֹלוֹת
  choice: holocaustos
  rationale: Termo português consagrado para a oferta inteiramente queimada, preservando a categoria sacrificial específica.
- source_word: שְׁלָמִים
  choice: ofertas de comunhão
  rationale: Comunica o caráter relacional e compartilhado desse tipo de sacrifício; “ofertas pacíficas” e “ofertas de bem-estar” também são possíveis.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: diante de Deus
  rationale: Equivalente natural e transparente da expressão hebraica “perante a face/presença de Deus”.
theological_decisions:
- issue: Terminologia sacrificial
  choice: Manter as categorias específicas “holocaustos” e “ofertas de comunhão”.
  alternative: Generalizar como “sacrifícios” ou traduzir שְׁלָמִים como “ofertas pacíficas”.
  rationale: O texto distingue dois tipos de oferta. Preservar essa distinção mantém sua especificidade ritual e teológica sem impor interpretação denominacional.
- issue: Identificação da tenda
  choice: Traduzir הָאֹהֶל como “a tenda”.
  alternative: “O tabernáculo”.
  rationale: O versículo emprega o substantivo comum e afirma que Davi a armou para a arca; “tabernáculo” poderia identificá-la indevidamente com o tabernáculo mosaico.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Holocaustos” mantém a terminologia bíblica tradicional; “ofertas de comunhão” evita a possível impressão de que שְׁלָמִים se refere apenas à ausência de conflito.
