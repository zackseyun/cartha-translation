base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/005.yaml
  text: Asaph was the chief[a], and second to him was Zechariah; then Jeiel, Shemiramoth, Jehiel, Mattithiah, Eliab, Benaiah, Obed-edom, and Jeiel, with instruments of harps and lyres[b]; and Asaph sounded the cymbals.
translation:
  language: pt
  text: Asafe era o chefe[a], e Zacarias, o segundo depois dele; Jeiel, Semiramote, Jehiel, Matitias, Eliabe, Benaia, Obede-Edom e Jeiel, com instrumentos — harpas e liras —; e Asafe fazia soar os címbalos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e Zacarias era o segundo depois dele”. O termo hebraico indica uma posição secundária em relação a Asafe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: o chefe
  rationale: Neste rol de músicos, רֹאשׁ indica posição de liderança, não a parte do corpo. “O chefe” é claro, natural e preserva a ideia de primazia.
- source_word: וּמִשְׁנֵהוּ
  choice: e Zacarias, o segundo depois dele
  rationale: O substantivo com sufixo de terceira pessoa masculina singular situa Zacarias em segundo lugar em relação a Asafe. A formulação mantém explícita essa relação de hierarquia.
- source_word: יְעִיאֵל / וִיעִיאֵל
  choice: Jeiel
  rationale: Adota-se uma transliteração portuguesa corrente e uniforme nas três ocorrências gráficas do nome no versículo.
- source_word: בִּכְלֵי נְבָלִים וּבְכִנֹּרוֹת
  choice: com instrumentos, harpas e liras
  rationale: כְּלֵי é representado por “instrumentos”, enquanto נְבָלִים e כִּנֹּרוֹת são mantidos como dois tipos distintos de instrumentos de cordas. Em português, “harpas e liras” comunica essa distinção de modo reconhecível.
- source_word: בַּמְצִלְתַּיִם
  choice: os címbalos
  rationale: O termo designa címbalos e traz artigo definido no hebraico; o português natural também admite o artigo neste contexto.
- source_word: מַשְׁמִיעַ
  choice: fazia soar
  rationale: 'O particípio hifil de שמע tem sentido causativo: Asafe fazia os címbalos serem ouvidos. “Fazia soar” conserva essa nuance melhor que o simples “tocava”.'
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com nomes próprios em formas correntes nas Bíblias em português. A sintaxe foi levemente reorganizada para tornar inteligível a lista de funções, sem eliminar a relação hierárquica nem a distinção entre os instrumentos.
