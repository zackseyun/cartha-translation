  text: saying[a], “To you I will give the land of Canaan[b], the portion of your inheritance.”
translation:
  language: pt
  text: 'dizendo[a]: “A você darei a terra de Canaã, a porção[b] da herança de vocês.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No hebraico, há uma mudança do singular (“a você”) para o plural (“de vocês”), possivelmente passando do patriarca a quem Deus se dirige para os seus descendentes como herdeiros da aliança.
    reason: lexical_alternative
  - marker: b
    text: Ou “quinhão”. A palavra hebraica refere-se literalmente a uma corda ou linha de medição e, por extensão, a uma parcela demarcada de terra.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo construto de אמר introduz o conteúdo da declaração da aliança iniciada no versículo anterior; “dizendo” mantém essa ligação de modo claro e tradicional.
- source_word: לְךָ
  choice: a você
  rationale: A forma pronominal está no masculino singular e funciona como destinatário do verbo “dar”. “A você” preserva o singular e tem ampla legibilidade, especialmente no português brasileiro.
- source_word: אֶתֵּן
  choice: darei
  rationale: O imperfeito qal na presente declaração tem força promissória futura; “darei” expressa diretamente a promessa divina.
- source_word: אֶרֶץ כְּנָעַן
  choice: a terra de Canaã
  rationale: A expressão nomeia concretamente o território prometido; “terra de Canaã” conserva tanto o sentido territorial de אֶרֶץ quanto o nome próprio.
- source_word: חֶבֶל
  choice: porção
  rationale: Embora o termo possa designar literalmente uma corda ou linha de medição, neste contexto territorial refere-se à parte demarcada ou atribuída. “Porção” é natural e mantém a imagem de uma parcela concedida.
- source_word: נַחֲלַתְכֶם
  choice: da herança de vocês
  rationale: נחלה designa uma propriedade recebida como herança, particularmente a terra da aliança. A formulação explicita o possessivo plural e, assim, preserva a mudança de número presente no hebraico.
theological_decisions:
- issue: Mudança do destinatário singular para o possessivo plural
  choice: Manter “a você” no singular e “de vocês” no plural.
  alternative: Uniformizar o número em toda a frase ou explicitar interpretativamente “a você e aos seus descendentes”.
  rationale: O hebraico justapõe deliberadamente לְךָ, singular, e נַחֲלַתְכֶם, plural. A tradução conserva essa tensão entre o patriarca a quem a promessa é dirigida e a comunidade que recebe a herança, sem acrescentar uma explicação ao texto principal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “A você” e “de vocês” tornam audível a mudança de número do original; a construção apositiva “a terra de Canaã, a porção...” segue de perto a sintaxe hebraica sem perder naturalidade.
