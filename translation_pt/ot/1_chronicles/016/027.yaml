base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/027.yaml
  text: Splendor and majesty are before him[a]; strength and joy are in his place.
translation:
  language: pt
  text: Esplendor e majestade estão diante dele; força e alegria estão em seu lugar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em sua morada” ou “em seu santuário”. O hebraico diz “em seu lugar”, uma expressão mais ampla que a formulação paralela em Salmo 96:6.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹד
  choice: esplendor
  rationale: Expressa magnificência imponente e forma, com “majestade”, um par poético distinto e natural em português.
- source_word: הָדָר
  choice: majestade
  rationale: Preserva o sentido elevado de dignidade e grandeza régia sem se confundir com הוֹד.
- source_word: לְפָנָיו
  choice: diante dele
  rationale: Reproduz naturalmente a imagem espacial e relacional do hebraico, literalmente “diante de sua face”.
- source_word: עֹז
  choice: força
  rationale: É a correspondência direta e corrente para a ideia de vigor ou poder expressa pelo substantivo.
- source_word: חֶדְוָה
  choice: alegria
  rationale: Traduz de modo claro e conciso o estado de júbilo, mantendo o equilíbrio poético com “força”.
- source_word: בִּמְקֹמוֹ
  choice: em seu lugar
  rationale: Mantém a formulação ampla do texto de Crônicas, sem substituí-la pela expressão mais específica “em seu santuário” do paralelo em Salmo 96:6.
theological_decisions:
- issue: Se מְקוֹמוֹ deve ser interpretado especificamente como o santuário ou templo
  choice: em seu lugar
  alternative: em sua morada; em seu santuário
  rationale: Embora o contexto litúrgico e o paralelo de Salmo 96:6 possam sugerir o santuário, Crônicas emprega o termo geral “lugar”. A tradução preserva essa amplitude e registra as leituras contextuais em nota, sem harmonizar os textos.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. “Diante dele” e “em seu lugar” preservam as imagens e a amplitude lexical do hebraico; a nota esclarece possibilidades contextuais sem estreitar o texto principal.
