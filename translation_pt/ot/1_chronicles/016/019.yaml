  yaml_path: translation/ot/1_chronicles/016/019.yaml
  text: when you were few in number[a], very few, and sojourners in it,
translation:
  language: pt
  text: quando vocês eram poucos em número[a], pouquíssimos, e estrangeiros residentes nela,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «bem poucos» ou «quase ninguém»; o hebraico intensifica como era pequeno o número deles.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּהְיוֹתְכֶם
  choice: quando vocês eram
  rationale: A preposição ב com o infinitivo construto de היה e o sufixo de segunda pessoa masculina plural introduz uma oração temporal. A formulação é natural em português e mantém esse valor temporal.
- source_word: מְתֵי מִסְפָּר
  choice: poucos em número
  rationale: A expressão idiomática designa um grupo pequeno, facilmente contável. Esta tradução conserva tanto a ideia quantitativa quanto a estrutura enfática do hebraico.
- source_word: כִּמְעַט
  choice: pouquíssimos
  rationale: No contexto, a expressão intensifica a pequenez numérica mencionada anteriormente. «Pouquíssimos» transmite essa ênfase de modo claro e natural, enquanto a nota preserva outras nuances possíveis.
- source_word: וְגָרִים
  choice: e estrangeiros residentes
  rationale: O particípio de גור descreve pessoas que vivem numa terra que não é sua, sem plena posse ou condição nativa. «Estrangeiros residentes» comunica melhor essa situação social do que apenas «estrangeiros», embora «residentes temporários» também seja possível.
- source_word: בָּהּ
  choice: nela
  rationale: O sufixo pronominal feminino singular retoma a terra mencionada no contexto. «Nela» preserva naturalmente essa referência em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. «Vocês» representa claramente a segunda pessoa do plural; «estrangeiros residentes» preserva a dimensão social de גרים sem recorrer ao pouco corrente «peregrinos».
