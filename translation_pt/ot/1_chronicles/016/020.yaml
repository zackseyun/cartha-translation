base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/020.yaml
  text: And they wandered from nation to nation[a], and from one kingdom to another people.
translation:
  language: pt
  text: E eles andaram de nação em nação e de um reino para outro povo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְהַלְּכוּ
  choice: iam
  rationale: O hitpael de הלך, unido às expressões «de... em...» que se seguem, indica deslocamento continuado ou repetido. «Iam» comunica esse movimento com naturalidade, sem acrescentar necessariamente a ideia negativa ou desorientada que «vagavam» pode sugerir.
- source_word: מִגּוֹי אֶל גּוֹי
  choice: de nação em nação
  rationale: Mantém a repetição hebraica e expressa de modo idiomático em português o movimento sucessivo entre nações.
- source_word: וּמִמַּמְלָכָה
  choice: e de um reino
  rationale: מַמְלָכָה significa «reino». O artigo indefinido explicita naturalmente em português o valor distributivo do paralelismo, embora não haja numeral no hebraico.
- source_word: אֶל עַם אַחֵר
  choice: para outro povo
  rationale: Preserva a distinção lexical entre גּוֹי, «nação», e עַם, «povo», e traduz אַחֵר por «outro».
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura poética concisa. A formulação conserva o paralelismo e a distinção entre «nação», «reino» e «povo». Não se incluiu nota, pois a alternativa «vagavam» é lexical, mas pode introduzir uma conotação de falta de rumo não exigida pelo contexto.
