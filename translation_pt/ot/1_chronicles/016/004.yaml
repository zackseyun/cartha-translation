  text: וַ/יִּתֵּ֞ן לִ/פְנֵ֨י אֲר֧וֹן יְהוָ֛ה מִן הַ/לְוִיִּ֖ם מְשָׁרְתִ֑ים וּ/לְ/הַזְכִּיר֙ וּ/לְ/הוֹד֣וֹת וּ/לְ/הַלֵּ֔ל לַ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/004.yaml
  text: He appointed some of the Levites to minister before the ark of Yahweh[a], to commemorate, to give thanks, and to praise Yahweh, the God of Israel.
translation:
  language: pt
  text: Ele designou alguns dos levitas para servirem diante da arca de Yahweh, para fazer memória[a], dar graças e louvar Yahweh, o Deus de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mencionar” ou “comemorar”. O verbo hebraico pode se referir a fazer ou trazer algo à memória em sentido litúrgico.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: designou
  rationale: Embora o verbo signifique literalmente “deu” ou “pôs”, neste contexto administrativo indica a designação de pessoas para uma função.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Expressa de modo natural tanto a posição espacial quanto o serviço na presença da arca.
- source_word: אֲרוֹן יְהוָה
  choice: arca de Yahweh
  rationale: Preserva diretamente a relação construta e mantém o nome divino como nome próprio.
- source_word: מִן הַלְוִיִּם
  choice: alguns dos levitas
  rationale: Representa o sentido partitivo da preposição מִן em português corrente.
- source_word: מְשָׁרְתִים
  choice: para servirem
  rationale: Transmite a função cultual dos levitas em linguagem clara, sem restringir o verbo além do que o contexto permite.
- source_word: וּלְהַזְכִּיר
  choice: para celebrar
  rationale: No contexto litúrgico, o hifil de זכר pode indicar fazer memória ou comemorar. “Celebrar” é natural em português, enquanto a nota conserva a amplitude lexical.
- source_word: וּלְהוֹדוֹת
  choice: dar graças
  rationale: No contexto de culto, ידה tem claramente o sentido de agradecer.
- source_word: וּלְהַלֵּל
  choice: louvar
  rationale: Equivalente direto e corrente do piel de הלל, sem acrescentar a ideia explícita de canto.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reproduz claramente a construção hebraica e seu título pactual.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega o Tetragrama como nome próprio; “Yahweh” o representa por transliteração, em vez de substituí-lo por um título.
- issue: Sentido litúrgico de וּלְהַזְכִּיר
  choice: celebrar, com nota explicativa
  alternative: fazer memória; mencionar; trazer à memória
  rationale: A forma causativa admite mais de uma nuance no âmbito do culto. O texto principal usa uma expressão natural, e a nota preserva a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A coordenação verbal foi mantida concisa, e o nome Yahweh foi preservado como nome próprio.
