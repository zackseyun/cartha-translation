source:
  edition: WLC
  text: זֶ֚רַע יִשְׂרָאֵ֣ל עַבְדּ֔/וֹ בְּנֵ֥י יַעֲקֹ֖ב בְּחִירָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/013.yaml
  text: O offspring of Israel his servant[a], sons of Jacob[c][b], his chosen ones.
translation:
  language: pt
  text: Ó descendência[a] de Israel, seu servo, filhos de Jacó[b], seus escolhidos[c]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “semente de Israel”; o hebraico usa um singular coletivo para falar dos descendentes.
    reason: lexical_alternative
  - marker: b
    text: Ou “descendentes de Jacó”; literalmente, “filhos de Jacó”.
    reason: lexical_alternative
  - marker: c
    text: Ou “seus eleitos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶרַע
  choice: descendência
  rationale: O substantivo designa coletivamente a posteridade de Israel. “Descendência” é natural em português, preserva o valor coletivo singular e evita a possível leitura concreta de “semente”.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: עַבְדּוֹ
  choice: seu servo
  rationale: Neste contexto de aliança, עבד caracteriza Israel em sua relação com Deus; “servo” comunica melhor essa função do que “escravo”, sem acrescentar uma ênfase social ausente do contexto.
- source_word: בְּנֵי
  choice: filhos de
  rationale: Reproduz a expressão masculina plural do hebraico e sua forma genealógica e corporativa convencional.
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: Forma tradicional do nome do patriarca em português.
- source_word: בְּחִירָיו
  choice: seus escolhidos
  rationale: Expressa claramente o plural e a ideia dos que foram escolhidos por Deus, evitando a carga teológica adicional que “eleitos” pode adquirir.
theological_decisions:
- issue: Referente dos sufixos masculinos singulares em “seu servo” e “seus escolhidos”
  choice: 'Os possessivos são mantidos de modo direto, e o contexto aponta para Deus como referente: Israel é servo dele, e os filhos de Jacó são escolhidos dele.'
  alternative: Ler as expressões apenas como aposições poéticas com referente menos explicitado.
  rationale: O contexto conclama o povo a recordar as obras do SENHOR e o identifica por sua relação com ele. A tradução conserva os possessivos do hebraico sem inserir o nome “Deus” no versículo.
translation_notes:
  register: Português moderno, claro e solene, com forma vocativa marcada por “Ó”. As duas expressões paralelas e suas aposições foram preservadas. Os possessivos mantêm a formulação hebraica e deixam que o contexto identifique Deus como referente.
