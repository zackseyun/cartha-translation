reference: 1 Chronicles 16:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יִשְׂמְח֤וּ הַ/שָּׁמַ֨יִם֙ וְ/תָגֵ֣ל הָ/אָ֔רֶץ וְ/יֹאמְר֥וּ בַ/גּוֹיִ֖ם יְהוָ֥ה מָלָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/031.yaml
  text: Let the heavens rejoice[a], and let the earth be glad; and let them say among the nations, “Yahweh reigns!”
translation:
  language: pt
  text: 'Alegrem-se os céus, e exulte a terra! Digam entre as nações: “Yahweh reina!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Yahweh tornou-se rei!”'
    reason: A forma hebraica também pode ser entendida como anúncio da entrada no exercício da realeza, embora “reina” expresse bem a proclamação de seu governo presente.
lexical_decisions:
- source_word: יִשְׂמְחוּ
  choice: Alegrem-se
  rationale: O imperfeito qal, neste contexto poético e volitivo, funciona como convocação. O imperativo em português transmite essa força com naturalidade.
- source_word: הַשָּׁמַיִם
  choice: os céus
  rationale: Preserva a forma plural e, no paralelismo cósmico com a terra, designa a esfera celeste, não apenas o céu visível.
- source_word: וְתָגֵל
  choice: e exulte
  rationale: גיל expressa alegria intensa ou exultação. “Exulte” mantém o paralelismo poético sem repetir “alegrem-se”.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: No paralelismo com “os céus”, a referência é cósmica; “terra” é preferível ao sentido localizado de “país” ou “território”.
- source_word: וְיֹאמְרוּ
  choice: Digam
  rationale: O imperfeito qal dá continuidade à sequência volitiva. O imperativo plural conserva a convocação sem acrescentar um sujeito que o hebraico não explicita.
- source_word: בַגּוֹיִם
  choice: entre as nações
  rationale: גּוֹיִם refere-se aqui aos povos do mundo. “Entre as nações” expressa uma proclamação pública, sem introduzir o contraste posterior sugerido por “gentios”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: מָלָךְ
  choice: reina
  rationale: Neste anúncio poético de realeza, o perfeito pode proclamar a realidade vigente do governo de Yahweh. “Reina” é claro e idiomático em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome próprio, sem substituí-lo por um título.
- issue: Valor temporal e aspectual de מָלָךְ
  choice: reina
  alternative: tornou-se rei; é rei
  rationale: A fórmula pode anunciar a realeza presente de Yahweh, embora a forma perfeita também admita uma formulação ingressiva. A nota preserva essa possibilidade sem impô-la ao texto principal.
translation_notes:
  register: Português moderno, digno e de ampla compreensão. Os imperativos mantêm o caráter convocatório do paralelismo poético; “exulte” conserva a elevação do registro sem tornar a frase arcaica.
