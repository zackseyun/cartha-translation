base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/006.yaml
  text: And Benaiah and Jahaziel the priests were continually with the trumpets before the ark of the covenant of God[a].
translation:
  language: pt
  text: Benaia e Jaaziel, os sacerdotes, permaneciam continuamente com as trombetas diante da arca da aliança de Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «tocavam continuamente as trombetas diante da arca da aliança de Deus». O hebraico não declara explicitamente o verbo, embora esse provavelmente seja o sentido pretendido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנָיָהוּ וְ/יַחֲזִיאֵל
  choice: Benaia e Jaaziel
  rationale: Os nomes próprios são transliterados segundo formas portuguesas correntes; a conjunção inicial é absorvida naturalmente na continuidade narrativa.
- source_word: הַ/כֹּהֲנִים
  choice: os sacerdotes
  rationale: O substantivo plural definido identifica o ofício de Benaia e Jaaziel.
- source_word: בַּ/חֲצֹצְרוֹת
  choice: com as trombetas
  rationale: O termo designa especificamente trombetas, e a preposição pode indicar associação ou instrumento. A tradução não acrescenta no texto principal o verbo implícito «tocar».
- source_word: תָּמִיד
  choice: continuamente
  rationale: Expressa constância ou regularidade persistente sem determinar um cronograma preciso.
- source_word: לִ/פְנֵי
  choice: diante de
  rationale: Preserva tanto a localização física quanto a possível nuance cultual.
- source_word: אֲרוֹן בְּרִית הָ/אֱלֹהִים
  choice: a arca da aliança de Deus
  rationale: Reproduz com clareza a cadeia construta e conserva a formulação bíblica bem estabelecida em português.
theological_decisions:
- issue: Explicitar ou não que os sacerdotes tocavam as trombetas
  choice: Manter no texto principal «permaneciam continuamente com as trombetas»
  alternative: «tocavam continuamente as trombetas»
  rationale: O hebraico não contém um verbo explícito para «tocar». Embora essa ação seja provavelmente o sentido pretendido no contexto, mantê-la em nota preserva a elipse e a ambiguidade do texto-fonte.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. «Permaneciam» foi suprido para formar uma oração natural sem transformar em afirmação explícita a ação de tocar; a alternativa contextual aparece em nota.
