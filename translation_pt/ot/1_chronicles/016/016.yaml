  text: אֲשֶׁ֤ר כָּרַת֙ אֶת אַבְרָהָ֔ם וּ/שְׁבוּעָת֖/וֹ לְ/יִצְחָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/016.yaml
  text: which he made with Abraham[a], and his oath to Isaac—
translation:
  language: pt
  text: que ele fez com Abraão[a], e o seu juramento a Isaque—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “que ele cortou com Abraão”, expressão idiomática hebraica que significa “fez uma aliança com Abraão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: que
  rationale: Pronome relativo que retoma «a aliança» do versículo anterior; «que» é natural e claro em português.
- source_word: כָּרַת
  choice: fez
  rationale: O verbo significa literalmente «cortar», mas integra a expressão idiomática hebraica para estabelecer uma aliança; «fez» comunica naturalmente esse sentido.
- source_word: אֶת אַבְרָהָם
  choice: com Abraão
  rationale: Embora אֶת costume marcar o objeto direto, a expressão idiomática de celebração de aliança pede «com» em português.
- source_word: וּשְׁבוּעָתוֹ
  choice: e o seu juramento
  rationale: Preserva o substantivo «juramento», o sufixo possessivo masculino singular e o paralelismo com a aliança mencionada anteriormente.
- source_word: לְיִצְחָק
  choice: a Isaque
  rationale: A preposição ל indica aqui o destinatário do juramento; «a» mantém essa relação de modo conciso.
theological_decisions:
- issue: Expressão idiomática de aliança indicada por כָּרַת e pelo antecedente do versículo anterior
  choice: que ele fez com Abraão
  alternative: que ele cortou com Abraão
  rationale: Traduz o sentido convencional da expressão hebraica sem tornar o texto obscuro, enquanto a nota registra sua forma literal.
translation_notes:
  register: Português moderno, digno e acessível, com ordem próxima à do hebraico. «Isaque» segue a forma bíblica amplamente reconhecida. O travessão final preserva a continuidade sintática com o versículo seguinte.
