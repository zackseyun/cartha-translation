source:
  edition: WLC
  text: זִכְר֤וּ לְ/עוֹלָם֙ בְּרִית֔/וֹ דָּבָ֥ר צִוָּ֖ה לְ/אֶ֥לֶף דּֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/015.yaml
  text: Remember his covenant forever[a], the word he commanded for a thousand generations.
translation:
  language: pt
  text: Lembrem-se para sempre de sua aliança, da palavra que ele ordenou para mil gerações.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da promessa que ele ordenou para mil gerações”.'
    reason: Alternativa lexical para דָּבָר no contexto da aliança.
lexical_decisions:
- source_word: זִכְרוּ
  choice: Lembrem-se
  rationale: Imperativo qal masculino plural de זכר, dirigido à comunidade. A forma pronominal é natural em português e mantém a exortação direta.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Expressa duração perpétua; “para sempre” é claro, atual e adequado ao contexto.
- source_word: בְּרִיתוֹ
  choice: de sua aliança
  rationale: בְּרִית designa uma aliança ou compromisso vinculante, especialmente no contexto da relação de Deus com seu povo.
- source_word: דָּבָר
  choice: da palavra
  rationale: Preserva o sentido amplo do hebraico דָּבָר sem restringi-lo à interpretação “promessa”; a construção em aposição explica “sua aliança”.
- source_word: צִוָּה
  choice: ele ordenou
  rationale: O sentido comum de צוה é “ordenar”. Esta escolha mantém a força do decreto divino sem suavizá-la para “estabeleceu”.
- source_word: לְאֶלֶף דּוֹר
  choice: para mil gerações
  rationale: Reproduz de modo idiomático a extensão temporal indicada pelo לְ, sem decidir se “mil” deve ser entendido de forma estritamente numérica ou como expressão de vastíssima duração.
theological_decisions:
- issue: Se דָּבָר deve ser traduzido como “palavra” ou como a interpretação mais específica “promessa”
  choice: palavra
  alternative: promessa
  rationale: “Palavra” preserva a amplitude lexical e a tensão do hebraico. O paralelismo com “aliança” permite entender uma promessa, mas não exige que essa interpretação substitua o termo mais amplo no texto principal.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Emprega-se “Lembrem-se” como imperativo comunitário e mantém-se a formulação compacta e poética do hebraico.
