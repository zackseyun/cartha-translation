  text: וַ/יִּֽתְקַדְּשׁ֔וּ הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּ֑ם לְ/הַעֲל֕וֹת אֶת אֲר֥וֹן יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/014.yaml
  text: So the priests and the Levites consecrated themselves to bring up the ark of Yahweh[a], the God of Israel.
translation:
  language: pt
  text: Então os sacerdotes e os levitas se consagraram para fazer subir a arca de Yahweh, o Deus de Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְקַדְּשׁוּ
  choice: se consagraram
  rationale: O hitpael de קדשׁ expressa preparação reflexiva para um serviço sagrado. “Se consagraram” é natural em português e preserva o sentido ritual de santidade.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Equivalente corrente de כֹּהֲנִים no contexto do culto de Israel.
- source_word: וְהַלְוִיִּם
  choice: e os levitas
  rationale: Tradução consagrada e direta, mantendo o artigo definido.
- source_word: לְהַעֲלוֹת
  choice: para levar
  rationale: O hifil de עלה significa fazer subir ou levar para cima. No contexto da condução da arca a Jerusalém, “levar” soa natural sem especificar indevidamente o modo de transporte.
- source_word: אֶת אֲרוֹן
  choice: a arca
  rationale: “Arca” é a designação estabelecida e contextualmente precisa para אֲרוֹן neste relato.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reproduz diretamente a cadeia construta, em aposição a Yahweh.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O hebraico traz explicitamente o Tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção reflexiva preserva a preparação ritual; “levar” evita uma formulação portuguesa artificial como “fazer subir”.
