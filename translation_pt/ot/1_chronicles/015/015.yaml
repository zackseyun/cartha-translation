  text: וַ/יִּשְׂא֣וּ בְנֵֽי הַ/לְוִיִּ֗ם אֵ֚ת אֲר֣וֹן הָֽ/אֱלֹהִ֔ים כַּ/אֲשֶׁ֛ר צִוָּ֥ה מֹשֶׁ֖ה כִּ/דְבַ֣ר יְהוָ֑ה בִּ/כְתֵפָ֥/ם בַּ/מֹּט֖וֹת עֲלֵי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/015.yaml
  text: And the sons of the Levites carried the ark of God on their shoulders with the poles upon them[a], just as Moses had commanded according to the word of Yahweh.
translation:
  language: pt
  text: E os filhos dos levitas carregaram a arca de Deus sobre os ombros, com as varas apoiadas neles[a], assim como Moisés havia ordenado, segundo a palavra de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com as varas sobre eles”. A expressão hebraica indica que, enquanto carregavam a arca, as varas ficavam apoiadas nos ombros deles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: carregaram
  rationale: Neste contexto, נשא descreve o transporte da arca, não apenas o ato momentâneo de levantá-la. “Carregaram” é natural e preciso em português.
- source_word: בְנֵי הַלְוִיִּם
  choice: os filhos dos levitas
  rationale: Preserva a expressão filial e tribal explícita do hebraico, em vez de reduzi-la simplesmente a “os levitas”.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: a arca de Deus
  rationale: Traduz exatamente a expressão do versículo, sem acrescentar “da aliança”, ausente aqui.
- source_word: כַּאֲשֶׁר צִוָּה מֹשֶׁה
  choice: assim como Moisés havia ordenado
  rationale: “Assim como” expressa conformidade, e “havia ordenado” indica que a ordem precedeu o transporte.
- source_word: כִּדְבַר יְהוָה
  choice: segundo a palavra de Yahweh
  rationale: Mantém o sentido formal de דָּבָר como “palavra” e preserva o nome divino.
- source_word: בִּכְתֵפָם
  choice: sobre os ombros
  rationale: Expressa de modo idiomático o local de apoio durante o transporte.
- source_word: בַּמֹּטוֹת עֲלֵיהֶם
  choice: com as varas apoiadas neles
  rationale: Torna explícita de modo natural a relação indicada por עֲלֵיהֶם, sem eliminar a possível referência gramatical aos carregadores; a nota esclarece o sentido contextual.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome próprio divino sem substituí-lo por um título.
- issue: Designação tribal masculina בְנֵי הַלְוִיִּם
  choice: os filhos dos levitas
  alternative: os levitas
  rationale: A tradução conserva a formulação filial masculina presente no hebraico, sem generalizá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, mantendo a progressão e as relações do hebraico.
