base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/017.yaml
  text: So the Levites appointed Heman son of Joel[a], and from his brothers Asaph son of Berechiah, and from the sons of Merari, their brothers[b], Ethan son of Kushaiah.
translation:
  language: pt
  text: Assim, os levitas designaram[a] Hemã, filho de Joel; dentre seus irmãos, Asafe, filho de Berequias; e dentre os filhos de Merari[b], seus irmãos, Etã, filho de Cusaías.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “puseram em posição” ou “colocaram em seu posto”; o verbo hebraico pode indicar fazer alguém ficar de pé numa função que lhe foi atribuída.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “filhos de Merari”, isto é, membros do clã merarita.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲמִידוּ
  choice: designaram
  rationale: O hifil de עמד expressa fazer alguém ficar de pé ou ocupar uma posição. No contexto da organização dos músicos levíticos, “designaram” comunica com naturalidade a atribuição de uma função, sem eliminar a alternativa mais concreta indicada em nota.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: Forma portuguesa corrente para a designação tribal, preservando o artigo definido.
- source_word: הֵימָן בֶּן יוֹאֵל
  choice: Hemã, filho de Joel
  rationale: Emprega as formas tradicionais dos nomes em português e preserva explicitamente a relação genealógica.
- source_word: וּמִן אֶחָיו
  choice: dentre os irmãos dele
  rationale: מן indica seleção no interior de um grupo. “Dentre” explicita essa relação, e “dele” conserva o referente singular do hebraico sem o tornar mais definido do que o texto permite.
- source_word: אָסָף בֶּן בֶּרֶכְיָהוּ
  choice: Asafe, filho de Berequias
  rationale: Usa as formas tradicionais dos nomes em português e mantém a filiação expressa no hebraico.
- source_word: וּמִן בְּנֵי מְרָרִי
  choice: e dentre os filhos de Merari
  rationale: Preserva a expressão genealógica literal do hebraico, enquanto a nota esclarece seu sentido de grupo clânico.
- source_word: אֲחֵיהֶם
  choice: irmãos deles
  rationale: Mantém o termo familiar e o pronome plural do texto, sem substituí-lo interpretativamente por “parentes” ou “companheiros”.
- source_word: אֵיתָן בֶּן קוּשָׁיָהוּ
  choice: Etã, filho de Cusaías
  rationale: Adota formas portuguesas tradicionais dos nomes e conserva a relação genealógica.
