    rationale: Embora o contexto permita inferir a retirada da arca, o verbo hebraico significa literalmente fazê-la subir. «Levá-la para cima» conserva esse elemento sem especificar um destino ausente do versículo.
  revised_text: Assim, Davi, os anciãos de Israel e os comandantes de milhares foram buscar, com alegria, a arca da aliança de Yahweh da casa de Obede-Edom, para levá-la para cima.
