  source_fidelity: A tradução transmite corretamente os participantes, a arca, a casa de Obede-Edom e a alegria. Contudo, «comandantes de mil» não conserva bem o plural de הָאֲלָפִים, e «levar de lá» deixa de explicitar a direção ascendente de לְהַעֲלוֹת.
  naturalness: A redação é clara e de registro apropriado. A revisão proposta mantém a fluência em português moderno, explicitando de modo natural tanto os grupos de milhares quanto o movimento de subida.
  terminology: «Anciãos de Israel», «arca da aliança de Yahweh» e «Obede-Edom» são adequados. «Comandantes de milhares» representa melhor a expressão hebraica para chefes de unidades de mil.
