base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/025.yaml
  text: So David, and the elders of Israel, and the commanders of the thousands went to bring up the ark of the covenant of Yahweh from the house of Obed-edom with joy.
translation:
  language: pt
  text: Assim, Davi, os anciãos de Israel e os comandantes de milhares foram buscar, com alegria, a arca da aliança de Yahweh da casa de Obede-Edom, para levá-la para cima.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Assim, ... foram
  rationale: A forma narrativa introduz a ação; em português atual, “Assim” e o verbo finito “foram” reproduzem com naturalidade sua função discursiva, sem uma fórmula existencial artificial.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: os anciãos de Israel
  rationale: Expressão consagrada e lexicalmente precisa para o grupo reconhecido de líderes de Israel.
- source_word: שָׂרֵי הָאֲלָפִים
  choice: os comandantes de mil
  rationale: שָׂרֵי designa dirigentes ou comandantes, e אֲלָפִים se refere aqui a unidades militares ou administrativas de mil. A formulação preserva essa organização sem especificações adicionais.
- source_word: הַהֹלְכִים לְהַעֲלוֹת
  choice: foram ... para levar de lá
  rationale: O particípio descreve o deslocamento do grupo, enquanto o infinitivo causativo indica transportar a arca para cima. A redação portuguesa expressa idiomaticamente a ida até a casa e a retirada da arca, sem a construção pouco natural “fazer subir”.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: a arca da aliança de Yahweh
  rationale: 'Mantém com clareza a cadeia construta: a arca vinculada à aliança de Yahweh.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מִן בֵּית עֹבֵד אֱדֹם
  choice: à casa de Obede-Edom ... de lá
  rationale: A reorganização sintática explicita de modo natural em português que o grupo foi à casa e retirou dali a arca, preservando a relação indicada por מִן.
- source_word: בְּשִׂמְחָה
  choice: com alegria
  rationale: Equivalente adverbial direto e natural, que conserva o tom festivo da ação.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino e representa de modo amplamente reconhecido sua provável vocalização.
translation_notes:
  register: Português moderno, digno e acessível, com ordem sintática natural. “Obede-Edom” segue a forma tradicionalmente reconhecível em português. A direção inerente a לְהַעֲלוֹת é acomodada na expressão contextual “levar de lá”, evitando uma formulação rígida ou ambígua sobre o movimento físico.
