  text: וַ/יַּקְהֵ֥ל דָּוִ֛יד אֶת כָּל יִשְׂרָאֵ֖ל אֶל יְרֽוּשָׁלִָ֑ם לְ/הַעֲלוֹת֙ אֶת אֲר֣וֹן יְהוָ֔ה אֶל מְקוֹמ֖/וֹ אֲשֶׁר הֵכִ֥ין לֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/003.yaml
  text: And David assembled all Israel at Jerusalem to bring up the ark of Yahweh to its place[b][a], which he had prepared for it.
translation:
  language: pt
  text: Davi reuniu todo o Israel em Jerusalém[a] para fazer subir a arca de Yahweh ao seu lugar, que ele havia preparado para ela[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “a Jerusalém”.
    reason: lexical_alternative
  - marker: b
    text: Ou “para ele”. O pronome hebraico é masculino, concordando naturalmente com o substantivo hebraico traduzido por “arca”, mas sua referência pode parecer ambígua em tradução.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: reuniu
  rationale: O hifil de קהל indica fazer um grupo reunir-se. “Reuniu” é corrente, claro e preserva a ação de Davi como agente.
- source_word: כָּל יִשְׂרָאֵל
  choice: todo o Israel
  rationale: Mantém a expressão coletiva referente ao povo ou a seus representantes, sem explicitar além do texto.
- source_word: אֶל יְרוּשָׁלִָם
  choice: em Jerusalém
  rationale: Embora אֶל normalmente indique movimento em direção a um lugar, com “reunir” o português emprega naturalmente “em” para indicar o local da assembleia; a forma mais literal é registrada em nota.
- source_word: לְהַעֲלוֹת
  choice: para levar
  rationale: Neste contexto de transporte, o hifil de עלה significa fazer subir ou levar para cima. “Levar” soa natural em português; o destino implícito conserva a ideia de condução até Jerusalém.
- source_word: אֲרוֹן יְהוָה
  choice: a arca de Yahweh
  rationale: Reproduz a construção hebraica e mantém o nome divino como nome próprio.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o Tetragrama como nome pessoal, em vez de substituí-lo por um título.
- source_word: אֶל מְקוֹמוֹ
  choice: ao seu lugar
  rationale: Preserva de modo conciso o substantivo “lugar” com o sufixo pronominal, cujo referente contextual mais natural é a arca.
- source_word: אֲשֶׁר הֵכִין לוֹ
  choice: que ele havia preparado para ela
  rationale: O mais provável é que Davi tenha preparado o lugar para a arca. O mais-que-perfeito marca adequadamente que a preparação ocorreu antes da reunião.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico apresenta o Tetragrama. “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título.
- issue: Referente do sufixo em לוֹ
  choice: para ela, referindo-se à arca
  alternative: para ele
  rationale: No contexto imediato, o destino foi preparado para a arca. Contudo, o hebraico usa um sufixo masculino, compatível gramaticalmente com אֲרוֹן, e uma tradução isolada como “para ele” pode conservar outra leitura; a ambiguidade é indicada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A ordem da frase acompanha de perto o hebraico sem sacrificar a fluidez. Os marcadores [a] e [b] aparecem no texto principal.
