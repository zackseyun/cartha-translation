  text: וַ/יֹּ֣אמֶר לָ/הֶ֔ם אַתֶּ֛ם רָאשֵׁ֥י הָ/אָב֖וֹת לַ/לְוִיִּ֑ם הִֽתְקַדְּשׁוּ֙ אַתֶּ֣ם וַ/אֲחֵי/כֶ֔ם וְ/הַֽעֲלִיתֶ֗ם אֵ֣ת אֲר֤וֹן יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֶל הֲכִינ֖וֹתִי לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/012.yaml
  text: And he said to them[a], “You are the heads of the fathers’ houses of the Levites. Sanctify yourselves, you and your brothers, and bring up the ark of Yahweh, the God of Israel, to the place I have prepared for it.”
translation:
  language: pt
  text: 'E ele lhes disse: “Vocês são os chefes das casas paternas dos levitas. Santifiquem-se[a], vocês e seus irmãos, e façam subir a arca de Yahweh, o Deus de Israel, ao lugar que preparei para ela.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Consagrem-se”. O verbo hebraico se refere à santificação ritual.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי הָאָבוֹת לַלְוִיִּם
  choice: os chefes das casas paternas dos levitas
  rationale: A expressão designa os líderes das unidades ancestrais ou clãs levíticos. “Casas paternas” conserva a estrutura social do hebraico com mais precisão do que o termo genérico “famílias”.
- source_word: הִתְקַדְּשׁוּ
  choice: Santifiquem-se
  rationale: O hitpael de קדשׁ indica que eles deveriam preparar-se mediante santificação ritual. A formulação mantém o sentido cultual, com uma alternativa mais corrente indicada em nota.
- source_word: וַאֲחֵיכֶם
  choice: vocês e seus irmãos
  rationale: “Irmãos” reproduz o termo hebraico e, no contexto, refere-se aos demais levitas ligados a esses chefes.
- source_word: וְהַעֲלִיתֶם
  choice: façam subir
  rationale: O hifil de עלה significa literalmente causar que algo suba. A expressão preserva a nuance direcional e cerimonial do transporte da arca.
- source_word: אֲרוֹן יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: a arca de Yahweh, o Deus de Israel
  rationale: Mantém integralmente a construção com o nome divino e a aposição que identifica Yahweh como o Deus de Israel.
- source_word: אֶל הֲכִינוֹתִי לוֹ
  choice: ao lugar que preparei para ela
  rationale: Depois de אֶל, o destino está implícito no hebraico. “Lugar” explicita de modo natural o local preparado no contexto, enquanto “para ela” retoma a arca.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” o representa diretamente, sem substituí-lo por um título.
- issue: Natureza da santificação exigida
  choice: Santifiquem-se
  alternative: Consagrem-se
  rationale: O verbo expressa preparação ritual para o serviço sagrado. A tradução evita reduzir a ordem a mera pureza moral e preserva seu caráter cultual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas brasileiras naturais como “vocês”. “Casas paternas” e “façam subir” mantêm traços importantes do hebraico sem tornar a frase obscura.
