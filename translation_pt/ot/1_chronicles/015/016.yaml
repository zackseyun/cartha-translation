base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/016.yaml
  text: Then David told the leaders of the Levites to appoint their brothers, the singers, with musical instruments—harps, lyres, and cymbals—sounding aloud, to raise songs of joy.
translation:
  language: pt
  text: Então Davi disse aos líderes dos levitas que encarregassem seus irmãos[a], os cantores, de tocar instrumentos musicais — harpas, liras e címbalos —, fazendo-os ressoar e elevando a voz com alegria.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Seus irmãos” refere-se aos outros levitas.
    reason: cultural_note
  - marker: b
    text: 'Ou: “elevando o som para alegria”. O hebraico diz literalmente algo como “elevar com voz/som para alegria”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então Davi disse
  rationale: O waw consecutivo dá continuidade à narrativa; “Então” expressa naturalmente a sequência, enquanto “disse” mantém o sentido básico do verbo sem explicitar além do texto a força de ordem presente na construção seguinte.
- source_word: לְשָׂרֵי הַלְוִיִּם
  choice: aos líderes dos levitas
  rationale: שָׂרִים designa chefes, dirigentes ou autoridades; “líderes” é claro, atual e adequado ao contexto organizacional.
- source_word: לְהַעֲמִיד
  choice: que designassem
  rationale: O hifil de עמד pode significar fazer ficar de pé, colocar, estabelecer ou designar. Neste contexto de organização dos músicos levíticos, “designassem” comunica a atribuição formal de uma função.
- source_word: אֶת אֲחֵיהֶם
  choice: seus irmãos
  rationale: Preserva o termo hebraico de parentesco, que aqui se refere aos demais levitas; uma nota esclarece o referente contextual.
- source_word: הַמְשֹׁרְרִים
  choice: os cantores
  rationale: O particípio derivado de שׁיר identifica especificamente os que cantavam, embora também fossem acompanhados por instrumentos.
- source_word: בִּכְלֵי שִׁיר
  choice: com instrumentos musicais
  rationale: É uma tradução natural da expressão construta “instrumentos de música/canto”, sem reproduzir uma formulação pouco idiomática em português.
- source_word: נְבָלִים
  choice: harpas
  rationale: A identificação exata do instrumento antigo é incerta, mas “harpas” é uma equivalência tradicional e reconhecível, mantida distinta de כִּנּוֹר.
- source_word: וְכִנֹּרוֹת
  choice: liras
  rationale: כִּנּוֹר é geralmente identificado como uma lira; a escolha preserva a distinção entre os dois tipos de instrumentos de cordas mencionados.
- source_word: וּמְצִלְתָּיִם
  choice: címbalos
  rationale: O substantivo designa címbalos, sem exigir por si só uma qualificação adicional como “retumbantes”.
- source_word: מַשְׁמִיעִים
  choice: fazendo-os soar bem alto
  rationale: O hifil de שׁמע significa fazer ouvir ou produzir som. “Fazendo-os soar” liga naturalmente o particípio aos instrumentos; “bem alto” expressa sua audibilidade pública, em conexão com a elevação do som na oração seguinte.
- source_word: לְהָרִים בְּקוֹל לְשִׂמְחָה
  choice: erguendo a voz com alegria
  rationale: A expressão é literalmente próxima de “elevar com voz/som para alegria”. A tradução conserva a imagem de elevar a voz e a relação com a alegria, enquanto a nota registra a possibilidade de entender קוֹל como “som”.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem dos instrumentos segue o hebraico, e a formulação final mantém a imagem hebraica sem ocultar a ambiguidade de קוֹל entre “voz” e “som”.
