revisions:
- from: Então Davi disse aos líderes dos levitas que designassem seus irmãos[a], os cantores, com instrumentos musicais — harpas, liras e címbalos —, fazendo-os soar bem alto e erguendo a voz com alegria.[b]
  to: Então Davi disse aos líderes dos levitas que encarregassem seus irmãos[a], os cantores, de tocar instrumentos musicais — harpas, liras e címbalos —, fazendo-os ressoar e elevando a voz com alegria.[b]
  rationale: A revisão esclarece que os cantores são encarregados de executar os instrumentos, substitui a intensificação não necessária «bem alto» por «fazer ressoar» e ajusta a nota para refletir com maior precisão a ambiguidade de קוֹל, “voz” ou “som”.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T22:51:38Z'
review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva adequadamente os principais referentes: Davi, os líderes levíticos, os irmãos/correligionários levitas, os cantores e a enumeração dos instrumentos. Contudo, «fazendo-os soar bem alto» introduz uma intensidade («bem alto») que não é exigida por מַשְׁמִיעִים e pode fazer parecer que os instrumentos, e não os cantores designados, são o sujeito principal das ações finais. A revisão torna explícita, em português, a incumbência dada aos cantores e conserva a imagem de fazer ressoar/elevar a voz.'
  naturalness: «Designassem seus irmãos ... com instrumentos musicais» soa sintaticamente pouco natural em português, pois «designar alguém com instrumentos» não expressa claramente a função atribuída. «Encarregassem ... de tocar» torna a construção fluente e mantém o sentido organizacional do hifil de עמד. A coordenação verbal também fica mais clara.
  terminology: «Líderes», «levitas», «cantores», «harpas», «liras» e «címbalos» são escolhas apropriadas e distintas. «Encarregar» representa bem, neste contexto, a designação formal sem impor uma terminologia institucional específica.
  issues:
  - severity: medium
    issue: Construção ambígua e pouco idiomática com «designassem ... com instrumentos musicais».
    rationale: Em português, a locução pode sugerir que os irmãos são designados juntamente com instrumentos, sem explicitar que sua tarefa é executá-los. O hebraico apresenta a nomeação dos cantores em conexão com os instrumentos e as ações musicais subsequentes.
  - severity: low
    issue: «Bem alto» intensifica desnecessariamente מַשְׁמִיעִים.
    rationale: O particípio significa fazer ouvir, produzir som ou fazer ressoar; não exige necessariamente uma indicação de volume máximo. «Fizessem ressoar» comunica o sentido sem acréscimo.
  - severity: low
    issue: A nota b propõe «para celebrar», formulação mais interpretativa que o hebraico.
    rationale: לְשִׂמְחָה expressa alegria/regozijo. A nota deve registrar a alternativa lexical de קוֹל («voz»/«som») e a relação com a alegria, sem substituir isso por uma finalidade mais específica.
  revised_text: Então Davi disse aos líderes dos levitas que encarregassem seus irmãos[a], os cantores, de tocar instrumentos musicais — harpas, liras e címbalos —, fazendo-os ressoar e elevando a voz com alegria.[b]
  revised_footnotes:
  - marker: a
    text: “Seus irmãos” refere-se aos outros levitas.
    reason: cultural_note
  - marker: b
    text: 'Ou: “elevando o som para alegria”. O hebraico diz literalmente algo como “elevar com voz/som para alegria”.'
    reason: lexical_alternative
  revision_rationale: A revisão esclarece que os cantores são encarregados de executar os instrumentos, substitui a intensificação não necessária «bem alto» por «fazer ressoar» e ajusta a nota para refletir com maior precisão a ambiguidade de קוֹל, “voz” ou “som”.
