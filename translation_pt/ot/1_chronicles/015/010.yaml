base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/010.yaml
  text: 'For the sons of Uzziel: Amminadab the chief[a], and his brothers, one hundred and twelve.'
translation:
  language: pt
  text: 'Dos filhos de Uziel: Aminadabe, o chefe[a], e seus irmãos, cento e doze.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “líder” ou “príncipe”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִ/בְנֵי
  choice: Dos filhos de
  rationale: O לְ introduz aqui mais um grupo na lista. Em português, “Dos filhos de” expressa naturalmente a relação com o grupo enumerado e preserva a linguagem genealógica e clânica de בנים.
- source_word: עֻזִּיאֵל
  choice: Uziel
  rationale: Nome próprio transliterado segundo a forma tradicional e corrente em português.
- source_word: עַמִּינָדָב
  choice: Aminadabe
  rationale: Nome próprio transliterado segundo a forma tradicional e reconhecível em português.
- source_word: הַ/שָּׂר
  choice: o chefe
  rationale: שַׂר pode designar chefe, líder, oficial ou príncipe. Neste contexto de uma lista de dirigentes de clãs levíticos, “o chefe” é claro, natural e adequado.
- source_word: וְ/אֶחָי/ו
  choice: e seus irmãos
  rationale: אָח pode indicar irmãos propriamente ditos ou parentes e membros masculinos do mesmo grupo. “Irmãos” preserva a linguagem familiar do hebraico sem restringir explicitamente o sentido.
- source_word: מֵאָה וּ/שְׁנֵים עָשָׂר
  choice: cento e doze
  rationale: Tradução direta do número cardinal em português corrente.
