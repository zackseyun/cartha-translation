base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/009.yaml
  text: 'For the sons of Hebron: Eliel the chief[a], and eighty of his brothers.'
translation:
  language: pt
  text: 'Dos filhos de Hebrom: Eliel, o chefe, e oitenta de seus irmãos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “parentes”. O hebraico diz literalmente “irmãos”, provavelmente referindo-se aos homens do grupo do clã representado por Eliel.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי
  choice: Dos filhos de
  rationale: O לְ introduz o grupo do clã nesta lista. “Dos filhos de” é natural em português e preserva a expressão hebraica de parentesco, que aqui pode abranger descendentes.
- source_word: חֶבְרוֹן
  choice: Hebrom
  rationale: Nome próprio vertido na forma tradicional e amplamente reconhecida em português bíblico.
- source_word: אֱלִיאֵל
  choice: Eliel
  rationale: Transliteração convencional do nome próprio em português.
- source_word: הַשָּׂר
  choice: o chefe
  rationale: שַׂר designa um chefe, líder ou oficial. Neste contexto de representantes de clãs, “chefe” expressa a função sem sugerir necessariamente realeza ou comando militar.
- source_word: וְאֶחָיו
  choice: e ... seus irmãos
  rationale: Preserva o sentido literal de אַחִים. No contexto, pode referir-se de modo mais amplo aos homens do mesmo grupo familiar ou clã.
- source_word: שְׁמוֹנִים
  choice: oitenta
  rationale: Número cardinal que indica quantos homens estavam associados a Eliel.
