base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/011.yaml
  text: 'Then David called for Zadok and Abiathar the priests, and for the Levites: Uriel, Asaiah, Joel, Shemaiah, Eliel, and Amminadab.'
translation:
  language: pt
  text: 'Então Davi mandou chamar os sacerdotes Zadoque e Abiatar, e os levitas: Uriel, Asaías, Joel, Semaías, Eliel e Aminadabe.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: mandou chamar
  rationale: No contexto, o verbo קרא introduz a convocação de pessoas específicas. “Mandou chamar” expressa esse sentido de modo natural em português sem acrescentar uma formalidade não exigida pelo hebraico.
- source_word: לְצָדוֹק וּלְאֶבְיָתָר הַכֹּהֲנִים
  choice: os sacerdotes Zadoque e Abiatar
  rationale: A construção identifica Zadoque e Abiatar como os sacerdotes convocados. Em português, colocar “os sacerdotes” antes dos nomes é claro e natural, preservando a determinação do artigo hebraico.
- source_word: וְלַלְוִיִּם
  choice: e os levitas
  rationale: O ל repetido marca também os levitas como objeto da convocação. Como “mandou chamar” rege objeto direto em português, não é necessário reproduzir a preposição de forma mecânica.
- source_word: לְאוּרִיאֵל עֲשָׂיָה וְיוֹאֵל שְׁמַעְיָה וֶאֱלִיאֵל וְעַמִּינָדָב
  choice: Uriel, Asaías, Joel, Semaías, Eliel e Aminadabe
  rationale: Os nomes pessoais seguem formas portuguesas bíblicas reconhecíveis. Os dois-pontos esclarecem que os seis nomes especificam quais levitas foram chamados.
- source_word: דָוִיד
  choice: Davi
  rationale: Forma tradicional e amplamente reconhecida em português.
theological_decisions: []
