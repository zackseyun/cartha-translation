  yaml_path: translation/ot/1_chronicles/015/019.yaml
  text: The singers were Heman[a], Asaph, and Ethan, with bronze cymbals to sound aloud.
translation:
  language: pt
  text: Os cantores eram Hemã, Asafe e Etã, com címbalos de bronze para fazer soar alto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “para fazer ouvir”; também pode ser traduzido como “para fazer ressoar”.
    reason: Preserva a construção causativa do hebraico e indica uma alternativa portuguesa natural, sem acrescentar um objeto explícito ou uma noção de intensidade extrema.
lexical_decisions:
- source_word: וְהַמְשֹׁרְרִים
  choice: Os cantores
  rationale: O particípio substantivado com artigo designa especificamente os que cantam; a conjunção inicial é absorvida no fluxo natural do versículo em português.
- source_word: הֵימָן אָסָף וְאֵיתָן
  choice: Hemã, Asafe e Etã
  rationale: Formas portuguesas tradicionais e reconhecíveis dos nomes próprios, mantendo a conjunção no último item da lista.
- source_word: בִּמְצִלְתַּיִם נְחֹשֶׁת
  choice: tocavam címbalos de bronze
  rationale: A preposição tem sentido instrumental. O verbo 'tocavam' torna explícita em português a relação idiomática com os címbalos, enquanto 'bronze' é a designação moderna apropriada do metal nesse contexto.
- source_word: לְהַשְׁמִיעַ
  choice: para produzir um som bem audível
  rationale: O infinitivo hifil de שׁמע significa literalmente 'fazer ouvir'. No contexto musical, a formulação comunica que os címbalos deveriam soar de modo claramente perceptível, sem impor a ideia mais específica de volume extremo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas nominais familiares no uso bíblico brasileiro. A redação explicita de maneira natural a ação instrumental apenas implícita na construção hebraica.
