source:
  edition: WLC
  text: כִּ֛י לְ/מַ בָּ/רִ֥אשׁוֹנָ֖ה לֹ֣א אַתֶּ֑ם פָּרַ֨ץ יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ בָּ֔/נוּ כִּי לֹ֥א דְרַשְׁנֻ֖/הוּ כַּ/מִּשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/013.yaml
  text: Because you were not there the first time[a], Yahweh our God broke out against us[b], because we did not seek him according to the ordinance.
translation:
  language: pt
  text: Pois, visto que vocês não estavam presentes da primeira vez[a], Yahweh, nosso Deus, irrompeu contra nós, porque não o buscamos[b] conforme a norma estabelecida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Porque, da primeira vez, não foram vocês”. O início hebraico é condensado e também pode dar a entender que os levitas não participaram da primeira tentativa de levar a arca.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “porque não o consultamos segundo a norma prescrita”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַ בָּרִאשׁוֹנָה לֹא אַתֶּם
  choice: como vocês não estavam lá da primeira vez
  rationale: A construção hebraica é elíptica. No contexto do discurso de Davi aos levitas, sua ausência na primeira tentativa de transportar a arca está implícita; a formulação portuguesa explicita apenas o necessário para tornar a frase inteligível.
- source_word: פָּרַץ
  choice: irrompeu contra
  rationale: O verbo descreve uma ação súbita e severa de juízo divino e também ecoa o episódio de Perez-Uzá. “Irrompeu contra” preserva essa força sem suavizar a ação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Tradução direta do substantivo com o sufixo de primeira pessoa do plural.
- source_word: בָּנוּ
  choice: contra nós
  rationale: Com פָּרַץ em contexto de juízo, a preposição indica o alvo adversamente atingido.
- source_word: דְרַשְׁנֻהוּ
  choice: não o buscamos
  rationale: דרשׁ pode significar buscar, consultar ou indagar. “Buscar” conserva a amplitude religiosa do verbo, enquanto a nota registra a alternativa mais especificamente consultiva.
- source_word: כַּמִּשְׁפָּט
  choice: conforme a norma estabelecida
  rationale: Neste contexto, מִשְׁפָּט se refere à exigência normativa para o transporte da arca. A expressão comunica tanto o caráter prescrito quanto o aspecto procedimental.
theological_decisions:
- issue: Elipse na oração inicial
  choice: Entender que os levitas não estavam presentes na primeira tentativa de levar a arca.
  alternative: 'Ler de modo mais literal e comprimido: “Porque, da primeira vez, não foram vocês, Yahweh, nosso Deus, irrompeu contra nós”.'
  rationale: O contexto dos versículos 2 e 12–15 indica que a primeira tentativa ocorreu sem que os levitas transportassem a arca como prescrito. A tradução torna explícita a ausência, mas não acrescenta no texto principal que eles deveriam estar carregando a arca.
- issue: Natureza da ação divina expressa por פָּרַץ
  choice: Uma irrupção repentina do juízo de Yahweh contra o povo.
  alternative: Uma brecha aberta por Yahweh entre nós.
  rationale: “Irrompeu contra nós” mantém a severidade ligada à santidade divina e o eco lexical do juízo ocorrido com Uzá, sem explicar além do que o texto afirma.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Vocês” representa o plural dirigido aos levitas; “Yahweh” preserva o nome divino. A redação mantém a força do juízo e registra em nota a ambiguidade do início hebraico.
