source:
  edition: WLC
  text: וּ/כְנַנְיָ֥הוּ שַֽׂר הַ/לְוִיִּ֖ם בְּ/מַשָּׂ֑א יָסֹר֙ בַּ/מַּשָּׂ֔א כִּ֥י מֵבִ֖ין הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/022.yaml
  text: And Chenaniah[a], chief of the Levites, directed the carrying[b], because he was skillful at it.
translation:
  language: pt
  text: Quenanias[a], chefe dos levitas, dirigia o transporte[b], porque era habilidoso nessa tarefa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quenanias, chefe dos levitas, dirigia o canto, porque era habilidoso nisso”. A palavra hebraica מַשָּׂא geralmente significa “carga” ou “transporte”, mas alguns a entendem aqui em sentido musical por causa das referências próximas a cantores e músicos.'
    reason: alternative_reading
  - marker: b
    text: 'O hebraico repete o mesmo substantivo: “no transporte [...] no transporte”. A segunda ocorrência foi traduzida de modo idiomático como “nessa tarefa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְנַנְיָהוּ
  choice: Quenanias
  rationale: Transliteração portuguesa corrente do nome hebraico, com forma natural para leitores lusófonos.
- source_word: שַׂר
  choice: chefe
  rationale: No contexto administrativo e cultual, indica alguém em posição de liderança ou supervisão entre os levitas.
- source_word: הַלְוִיִּם
  choice: dos levitas
  rationale: Designação tradicional e clara do grupo; a construção portuguesa expressa a relação de chefia indicada pelo hebraico.
- source_word: בְּמַשָּׂא
  choice: o transporte
  rationale: מַשָּׂא significa normalmente carga, ato de carregar ou transporte. No contexto do deslocamento da arca, 'transporte' comunica com naturalidade a tarefa, sem excluir em nota a interpretação musical.
- source_word: יָסֹר
  choice: dirigia
  rationale: O verbo expressa orientação ou supervisão. O imperfeito português se ajusta à descrição da função exercida por Quenanias.
- source_word: בַּמַּשָּׂא
  choice: nessa tarefa
  rationale: Retoma idiomaticamente a repetição do mesmo substantivo hebraico, evitando uma repetição pouco natural em português.
- source_word: כִּי
  choice: porque
  rationale: Introduz de modo claro a razão de Quenanias dirigir a atividade.
- source_word: מֵבִין הוּא
  choice: era habilidoso
  rationale: O particípio de בין indica aqui entendimento prático, competência ou perícia, e não apenas compreensão intelectual.
theological_decisions:
- issue: Sentido de מַשָּׂא no contexto cultual
  choice: transporte
  alternative: canto
  rationale: O sentido lexical mais comum é 'carga' ou 'transporte', adequado ao contexto do transporte da arca. Como o contexto próximo também menciona cantores e músicos, a leitura musical permanece genuinamente possível e é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação principal preserva o sentido concreto mais provável, enquanto as notas registram tanto a ambiguidade contextual quanto a repetição hebraica.
