base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/018.yaml
  text: 'And with them were their brothers of the second rank: Zechariah[a], Ben-Jaaziel, and Shemiramoth, and Jehiel, and Unni, Eliab, and Benaiah, and Maaseiah, and Mattithiah, and Eliphelehu, and Mikneiah, and Obed-edom, and Jeiel, the gatekeepers.'
translation:
  language: pt
  text: 'Com eles estavam seus irmãos da segunda ordem[a]: Zacarias, Ben, Jaaziel, Semiramote, Jeiel, Uni, Eliabe, Benaia, Maaseias, Matitias, Elifeleu, Micneias, Obede-Edom e Jeiel, os porteiros.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do segundo grupo” ou “de segunda categoria”. A expressão hebraica distingue provavelmente uma ordem ou posição secundária entre os levitas ou músicos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעִמָּהֶם
  choice: Com eles estavam
  rationale: A expressão preposicional introduz o grupo acompanhante; o verbo “estavam” é suprido naturalmente em português numa oração nominal hebraica.
- source_word: אֲחֵיהֶם
  choice: seus irmãos
  rationale: Mantém o sentido direto do hebraico, que neste contexto pode designar irmãos levitas ou companheiros do mesmo grupo.
- source_word: הַמִּשְׁנִים
  choice: da segunda ordem
  rationale: Expressa a ideia de posição ou grupo secundário sem definir com excessiva precisão a natureza da distinção.
- source_word: זְכַרְיָהוּ בֵּן וְיַעֲזִיאֵל
  choice: Zacarias, Ben, Jaaziel
  rationale: O texto hebraico coordenado apresenta בֵּן como item nominal seguido de “e Jaaziel”; por isso, são mantidos como nomes distintos, em vez de fundidos em “Ben-Jaaziel” ou interpretados como “filho de Jaaziel”.
- source_word: הַשֹּׁעֲרִים
  choice: os porteiros
  rationale: O plural definido descreve a função exercida pelos nomes finais da lista, Obede-Edom e Jeiel.
