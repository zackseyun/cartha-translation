base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/006.yaml
  text: 'For the sons of Merari: Asaiah the chief[a], and 220 of his brothers.'
translation:
  language: pt
  text: 'Dos filhos de Merari: Asaías, o chefe, e seus irmãos, duzentos e vinte.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “parentes”; o termo hebraico pode referir-se, de modo mais amplo, aos membros masculinos do mesmo clã ou grupo familiar.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי
  choice: Dos filhos de
  rationale: O לְ introduz este grupo dentro de uma lista; em português, “Dos filhos de” preserva com naturalidade a estrutura enumerativa e mantém a expressão genealógica hebraica.
- source_word: מְרָרִי
  choice: Merari
  rationale: Nome próprio transliterado segundo a forma portuguesa tradicional e reconhecível.
- source_word: עֲשָׂיָה
  choice: Asaías
  rationale: Nome próprio vertido pela forma consagrada em português.
- source_word: הַשָּׂר
  choice: o chefe
  rationale: שַׂר designa aqui o líder ou cabeça reconhecido do grupo; “chefe” comunica essa função sem sugerir necessariamente condição real.
- source_word: וְאֶחָיו
  choice: e 220 de seus irmãos
  rationale: אָח pode indicar irmãos em sentido estrito ou, em contexto clânico, parentes e membros masculinos do mesmo grupo. “Irmãos” mantém o sentido mais direto, com nota para a extensão possível.
- source_word: מָאתַיִם וְעֶשְׂרִים
  choice: '220'
  rationale: O numeral hebraico é apresentado em algarismos para facilitar a leitura moderna, sem alteração de sentido.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura concisa adequada à lista. Mantém-se “filhos de” como fórmula genealógica e “irmãos” como tradução direta, sem eliminar a amplitude semântica indicada em nota.
