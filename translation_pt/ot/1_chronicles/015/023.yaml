lexical_decisions:
- source_word: בֶּרֶכְיָה
  choice: Berequias
  rationale: Transliteração tradicional e amplamente reconhecida em português do nome hebraico.
- source_word: אֶלְקָנָה
  choice: Elcana
  rationale: Transliteração tradicional e natural em português do nome hebraico.
- source_word: שֹׁעֲרִים
  choice: porteiros
  rationale: Designa os responsáveis por guardar ou controlar uma entrada; “porteiros” é a forma corrente e contextualmente adequada em português.
- source_word: לָאָרוֹן
  choice: encarregados da arca
  rationale: Expressa de modo natural a relação de responsabilidade ou designação indicada pela preposição ל, sem excluir completamente a possível nuance de localização junto à arca.
- source_word: וְ
  choice: e
  rationale: Conjunção coordenativa que liga os dois nomes.
