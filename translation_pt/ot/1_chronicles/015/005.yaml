base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/005.yaml
  text: 'For the sons of Kohath: Uriel the chief[a], and 120 of his brothers.'
translation:
  language: pt
  text: 'Dos filhos de Coate: Uriel, o chefe, e 120 de seus irmãos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “parentes”; aqui, “irmãos” provavelmente se refere a outros membros do clã coatita, e não apenas a irmãos biológicos.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי
  choice: Dos filhos de
  rationale: A preposição ל introduz o grupo do clã nesta lista. “Dos filhos de” soa natural em português e mantém a designação genealógica do hebraico, que também pode abranger descendentes do clã.
- source_word: קְהָת
  choice: Coate
  rationale: Forma tradicional e amplamente reconhecida em português para o nome do antepassado levítico.
- source_word: אוּרִיאֵל
  choice: Uriel
  rationale: Transliteração portuguesa corrente do nome próprio.
- source_word: הַשָּׂר
  choice: o chefe
  rationale: שַׂר designa um chefe, líder ou oficial. Neste rol administrativo e cultual, “o chefe” expressa a liderança do grupo sem sugerir realeza.
- source_word: וְאֶחָיו
  choice: e seus irmãos
  rationale: A tradução conserva o sentido básico de אחים, embora no contexto a palavra provavelmente designe parentes ou membros do mesmo clã, e não apenas irmãos biológicos.
- source_word: מֵאָה וְעֶשְׂרִים
  choice: '120'
  rationale: O numeral preserva exatamente a contagem hebraica e favorece a leitura clara de uma lista.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe concisa própria de uma lista. Mantém-se “filhos” e “irmãos” no texto para refletir o vocabulário genealógico hebraico, enquanto a nota esclarece o provável sentido mais amplo de clã.
