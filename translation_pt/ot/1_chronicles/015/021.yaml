base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/021.yaml
  text: and Mattithiah[a], Eliphelehu, Mikneiah, Obed-edom, Jeiel, and Azaziah were to lead with lyres according to the Sheminith.
translation:
  language: pt
  text: e Matitias, Elifeleu, Micneias, Obede-Edom, Jeiel e Azazias deviam conduzir com liras segundo a Seminite.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com liras na oitava” ou “com liras no registro mais grave”. A expressão hebraica “segundo a Seminite” é um termo musical cujo sentido exato é incerto.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַתִּתְיָהוּ
  choice: Matitias
  rationale: Nome próprio transliterado na forma portuguesa tradicional e reconhecível.
- source_word: אֱלִיפְלֵהוּ
  choice: Elifeleu
  rationale: Transliteração adaptada à fonologia e ortografia portuguesas, preservando a terminação hebraica.
- source_word: מִקְנֵיָהוּ
  choice: Micneias
  rationale: Nome próprio vertido em forma portuguesa legível, mantendo correspondência aproximada com o hebraico.
- source_word: עֹבֵד אֱדֹם
  choice: Obede-Edom
  rationale: Forma portuguesa convencional do nome composto, com hífen para clareza.
- source_word: יעִיאֵל
  choice: Jeiel
  rationale: Transliteração portuguesa convencional do nome próprio.
- source_word: עֲזַזְיָהוּ
  choice: Azazias
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico.
- source_word: בְּכִנֹּרוֹת
  choice: com liras
  rationale: כִּנּוֹר designa um instrumento de cordas mais precisamente identificado como lira; a preposição tem sentido instrumental.
- source_word: עַל הַשְּׁמִינִית
  choice: segundo a Seminite
  rationale: A expressão é um termo musical técnico de significado exato incerto; a transliteração preserva essa incerteza, enquanto 'segundo' representa naturalmente עַל neste contexto.
- source_word: לְנַצֵּחַ
  choice: deviam conduzir
  rationale: Em contexto musical, o verbo pode indicar liderar, supervisionar ou dirigir a execução; 'conduzir' comunica essa função sem impor um cargo técnico específico.
