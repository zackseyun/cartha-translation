base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/024.yaml
  text: And Shebaniah[a], Jehoshaphat, Nethanel, Amasai, Zechariah, Benaiah, and Eliezer the priests were blowing the trumpets before the ark of God[c][b], and Obed-edom and Jehiah were gatekeepers for the ark.
translation:
  language: pt
  text: Sebanias, Josafá, Natanael, Amasai, Zacarias, Benaías e Eliezer, os sacerdotes, tocavam[a] as trombetas[b] diante da arca de Deus; Obede-Edom e Jeías eram porteiros[c] da arca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “faziam soar”.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico costuma designar as trombetas retas usadas pelos sacerdotes no culto.
    reason: cultural_note
  - marker: c
    text: 'Ou: “guardas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: O artigo definido identifica os homens mencionados como sacerdotes; a expressão funciona naturalmente como aposto à lista de nomes.
- source_word: מחצצרים
  choice: tocavam
  rationale: O particípio descreve uma ação contínua durante a procissão. Em português, “tocavam” expressa com naturalidade o ato de fazer soar as trombetas.
- source_word: בַּחֲצֹצְרוֹת
  choice: as trombetas
  rationale: O termo designa trombetas, especialmente as trombetas retas de uso sacerdotal. Não se acrescenta “de prata”, pois esse detalhe não está explícito neste versículo.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Mantém o sentido espacial da posição dos sacerdotes na procissão.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: a arca de Deus
  rationale: Tradução direta e idiomática da construção hebraica.
- source_word: שֹׁעֲרִים
  choice: porteiros
  rationale: O termo designa responsáveis por entradas ou portões em contexto sagrado e pode também implicar a função de guarda.
- source_word: לָאָרוֹן
  choice: da arca
  rationale: 'O lamed indica a esfera de responsabilidade ou serviço: eles exerciam a função de porteiros em relação à arca.'
- source_word: וְעֹבֵד אֱדֹם
  choice: Obede-Edom
  rationale: Transliteração conforme a forma tradicional e reconhecível em português.
- source_word: וִיחִיָּה
  choice: Jeías
  rationale: Forma portuguesa clara e próxima da transliteração do nome hebraico.
