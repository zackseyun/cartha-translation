  naturalness: O português é claro, moderno e de registro apropriado. «Davi também usava» é uma boa solução idiomática para a oração final. A pequena revisão proposta melhora a precisão sem sacrificar a fluência.
  terminology: «Manto de linho fino», «levitas», «arca», «cantores», «Quenanias» e «éfode» são escolhas apropriadas. «Éfode» preserva corretamente o termo cultual sem inferências sobre ofício sacerdotal.
