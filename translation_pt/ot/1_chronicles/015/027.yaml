base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/027.yaml
  text: David was clothed with a robe of fine linen[a], as were all the Levites who were carrying the ark, and the singers, and Chenaniah, the leader of the singing of the singers; and on David was a linen ephod.
translation:
  language: pt
  text: Davi estava vestido com um manto de linho fino, assim como todos os levitas que carregavam a arca, os cantores e Quenanias, o chefe do transporte entre os cantores[a]. Davi também usava um éfode de linho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “Quenanias, chefe do canto” ou “chefe da música”. A expressão hebraica é difícil.
    reason: alternative_reading
lexical_decisions:
- source_word: מְכֻרְבָּל
  choice: estava vestido
  rationale: O particípio passivo indica que Davi estava trajado; a formulação é natural em português e mantém o estado descrito.
- source_word: מְעִיל בּוּץ
  choice: um manto de linho fino
  rationale: מְעִיל designa uma veste exterior, e בּוּץ, linho fino de qualidade elevada.
- source_word: הַלְוִיִּם הַנֹּשְׂאִים אֶת הָאָרוֹן
  choice: os levitas que carregavam a arca
  rationale: O particípio expressa a ação em curso durante a procissão; 'carregavam' é claro e contemporâneo.
- source_word: הַמְשֹׁרְרִים
  choice: os cantores
  rationale: O termo se refere especificamente aos que cantavam, sem ampliar indevidamente o sentido para todos os músicos.
- source_word: כְנַנְיָה
  choice: Quenanias
  rationale: Transliteração portuguesa corrente do nome hebraico.
- source_word: הַשַּׂר הַמַּשָּׂא הַמְשֹׁרְרִים
  choice: o chefe encarregado do transporte dos cantores
  rationale: Mantém no texto principal o sentido básico de מַשָּׂא como transporte ou carregamento, ao mesmo tempo que sinaliza em nota a dificuldade sintática e outras construções possíveis.
- source_word: אֵפוֹד בָּד
  choice: um éfode de linho
  rationale: Preserva o nome da veste cultual sem acrescentar uma interpretação sobre função sacerdotal; בָּד especifica o material.
- source_word: וְעַל דָּוִיד
  choice: Davi também usava
  rationale: Expressa em português natural a construção elíptica 'e sobre Davi [havia]', deixando claro que o éfode era uma peça adicional.
theological_decisions:
- issue: Natureza da veste de Davi no contexto litúrgico
  choice: Manter 'éfode' como nome específico da veste, sem qualificá-la como sacerdotal.
  alternative: Traduzir como 'veste sacerdotal' ou inferir que Davi exercia aqui o sacerdócio.
  rationale: O texto informa o que Davi vestia, mas não declara neste versículo que ele ocupava função sacerdotal.
- issue: Construção difícil הַשַּׂר הַמַּשָּׂא הַמְשֹׁרְרִים
  choice: Traduzir de modo conservador com 'transporte dos cantores' e registrar outras possibilidades em nota.
  alternative: Entender a expressão como 'chefe do canto' ou 'chefe da música'.
  rationale: A sintaxe massorética é incomum, e מַשָּׂא normalmente se relaciona a carga ou transporte. A nota evita ocultar a incerteza textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Preferiu-se 'manto' a termos mais arcaicos e 'carregavam' a 'levavam'. O marcador [a] foi colocado junto à expressão realmente explicada pela nota.
