  text: וַֽ/יְהִי֙ בֶּ/עְזֹ֣ר הָֽ/אֱלֹהִ֔ים אֶ֨ת הַ/לְוִיִּ֔ם נֹשְׂאֵ֖י אֲר֣וֹן בְּרִית יְהוָ֑ה וַ/יִּזְבְּח֥וּ שִׁבְעָֽה פָרִ֖ים וְ/שִׁבְעָ֥ה אֵילִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/026.yaml
  text: And when God helped the Levites who were carrying the ark of the covenant of Yahweh[a], they sacrificed seven bulls and seven rams.
translation:
  language: pt
  text: Quando Deus ajudou os levitas que carregavam a arca da aliança de Yahweh, eles sacrificaram sete touros e sete carneiros.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּעְזֹר
  choice: quando ... ajudou
  rationale: O infinitivo construto com ב, após ויהי, introduz uma circunstância temporal; esta formulação preserva com naturalidade o sentido de “quando/ao ajudar”.
- source_word: הָאֱלֹהִים
  choice: Deus
  rationale: O termo com artigo refere-se aqui ao Deus de Israel; em português, o nome é naturalmente empregado sem artigo nesta construção.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: Designação corrente do grupo tribal, com a determinação do hebraico preservada.
- source_word: נֹשְׂאֵי
  choice: que carregavam
  rationale: O particípio qualifica os levitas e expressa a ação em curso durante a cena.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: a arca da aliança de Yahweh
  rationale: Preserva de modo transparente a cadeia construta hebraica e mantém o nome divino como nome próprio.
- source_word: וַיִּזְבְּחוּ
  choice: eles sacrificaram
  rationale: O verbo está no masculino plural e, neste contexto cultual, “sacrificaram” expressa diretamente a ação sem especificar além do hebraico quem compunha o sujeito plural.
- source_word: שִׁבְעָה פָרִים
  choice: sete novilhos
  rationale: פָרִים designa bovinos machos empregados em sacrifício; “novilhos” é uma expressão bíblica natural em português e evita a possível ideia genérica de bois castrados.
- source_word: וְשִׁבְעָה אֵילִים
  choice: e sete carneiros
  rationale: אֵילִים significa carneiros adultos; a repetição de “sete” preserva a forma e o ritmo do hebraico.
theological_decisions:
- issue: Sujeito da ação sacrificial
  choice: eles sacrificaram
  alternative: ele sacrificou
  rationale: וַיִּזְבְּחוּ está na terceira pessoa masculina plural. A tradução mantém essa pluralidade sem identificar de forma indevida um grupo mais específico nem atribuir a ação somente a Davi.
- issue: Relação de Yahweh com a aliança
  choice: a arca da aliança de Yahweh
  alternative: a arca da aliança que pertence a Yahweh
  rationale: A formulação conserva a concisão e a ambiguidade relacional da cadeia construta, sem desenvolver uma interpretação possessiva mais explícita do que o hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A abertura “E aconteceu que” conserva a estrutura narrativa de ויהי sem tornar o restante da frase excessivamente literal. O nome divino é transliterado como “Yahweh”.
