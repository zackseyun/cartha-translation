revisions:
- from: E aconteceu que, quando Deus ajudou os levitas que carregavam a arca da aliança de Yahweh[a], eles sacrificaram sete novilhos e sete carneiros.
  to: Quando Deus ajudou os levitas que carregavam a arca da aliança de Yahweh, eles sacrificaram sete touros e sete carneiros.
  rationale: A revisão melhora a fluência, usa «touros» como equivalente direto de פָּרִים e elimina uma nota que não apresenta variante real nem é necessária para a fidelidade do versículo. Mantêm-se a pluralidade não especificada do sujeito de «sacrificaram» e a formulação concisa da cadeia construta.
