source:
  edition: WLC
  text: וַ/יַּֽעַשׂ ל֥/וֹ בָתִּ֖ים בְּ/עִ֣יר דָּוִ֑יד וַ/יָּ֤כֶן מָקוֹם֙ לַֽ/אֲר֣וֹן הָֽ/אֱלֹהִ֔ים וַ/יֶּט ל֖/וֹ אֹֽהֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/001.yaml
  text: And he made houses for himself in the city of David[a], and he prepared a place for the ark of God and pitched a tent for it.
translation:
  language: pt
  text: Davi construiu casas para si na Cidade de Davi, preparou um lugar para a arca de Deus e armou uma tenda para ela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “armou para si uma tenda”. O sufixo hebraico pode se referir à arca ou a Davi, embora o contexto imediato favoreça a arca.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ לֹו בָתִּים
  choice: construiu casas para si
  rationale: Embora עשה tenha o sentido amplo de “fazer”, com “casas” o português natural pede “construiu”. O pronome reflexivo preserva explicitamente o benefício para Davi indicado por לֹו.
- source_word: בְּעִיר דָּוִיד
  choice: na Cidade de Davi
  rationale: Tradução locativa direta; a inicial maiúscula trata a expressão como o nome tradicional do lugar.
- source_word: וַיָּכֶן מָקוֹם
  choice: preparou um lugar
  rationale: No hifil, כון pode significar “preparar” ou “deixar pronto”; “preparou” é claro e adequado ao objeto מָקוֹם.
- source_word: לַאֲרוֹן הָאֱלֹהִים
  choice: para a arca de Deus
  rationale: Mantém a designação simples e tradicional do objeto sagrado, sem acrescentar qualificações ausentes no hebraico.
- source_word: וַיֶּט ... אֹהֶל
  choice: armou uma tenda
  rationale: נטה significa literalmente “estender”, mas, com אֹהֶל, a expressão idiomática em português é “armar uma tenda”. O artigo indefinido acompanha a ausência de artigo no hebraico.
- source_word: לֹו
  choice: para ela
  rationale: O referente mais provável no contexto imediato é “a arca de Deus”; o feminino em português concorda com “arca”. A possível referência a Davi é preservada em nota.
theological_decisions:
- issue: Referente do sufixo pronominal em וַיֶּט לֹו אֹהֶל
  choice: 'O sufixo se refere à arca: “armou uma tenda para ela”.'
  alternative: 'O sufixo se refere a Davi: “armou para si uma tenda”.'
  rationale: A frase anterior trata do lugar preparado para a arca, de modo que a continuidade temática favorece a arca como referente. Como a gramática hebraica também permite retomar Davi, a alternativa não é eliminada, mas registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Construiu” e “armou” são equivalentes contextuais naturais, enquanto a ordem das ações e a repetição dos complementos preservam de perto a estrutura do hebraico.
