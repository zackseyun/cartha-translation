  text: לִ/בְנֵ֖י אֱלִֽיצָפָ֑ן שְׁמַֽעְיָ֥ה הַ/שָּׂ֖ר וְ/אֶחָ֥י/ו מָאתָֽיִם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/008.yaml
  text: 'For the sons of Elizaphan: Shemaiah the chief[a], and two hundred of his brothers.'
translation:
  language: pt
  text: 'Dos filhos de Elisafã: Semaías, o chefe, e duzentos de seus irmãos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “parentes”; o termo hebraico traduzido como “irmãos” também pode se referir a membros do mesmo clã.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי
  choice: Dos filhos de
  rationale: Neste item da lista, o לְ introduz o grupo familiar; em português, “dos filhos de” é natural e preserva בְּנֵי, que funciona como designação de linhagem ou clã.
- source_word: אֱלִיצָפָן
  choice: Elisafã
  rationale: Transliteração tradicional e reconhecível em português do nome hebraico.
- source_word: שְׁמַעְיָה
  choice: Semaías
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico.
- source_word: הַשָּׂר
  choice: o chefe
  rationale: שַׂר designa aqui o dirigente do grupo familiar, sem exigir a ideia de príncipe ou de oficial militar.
- source_word: וְאֶחָיו
  choice: e seus irmãos
  rationale: אָח pode indicar irmãos literais ou parentes e membros do mesmo clã. A tradução mantém o termo mais literal e deixa a extensão contextual indicada em nota.
- source_word: מָאתָיִם
  choice: duzentos
  rationale: Correspondência direta do numeral cardinal hebraico.
