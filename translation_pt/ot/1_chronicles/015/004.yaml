  text: And David gathered the sons of Aaron and the Levites.
translation:
  language: pt
  text: Davi reuniu os filhos de Arão e os levitas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: reuniu
  rationale: O verbo אסף, nesta forma narrativa, indica fazer com que pessoas se juntem. “Reuniu” é natural em português atual e se ajusta bem a uma lista de pessoas como objeto.
- source_word: דָּוִיד
  choice: Davi
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: בְּנֵי אַהֲרֹן
  choice: os filhos de Arão
  rationale: Reproduz o sentido genealógico literal da expressão hebraica. Embora o contexto provavelmente se refira aos sacerdotes aarônicos, a tradução não explicita além do que o texto diz.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: Equivalente português consagrado para o grupo levítico e adequado ao contexto cultual.
- source_word: אֵת ... וְאֵת
  choice: não traduzido separadamente; expresso pela coordenação dos objetos diretos
  rationale: אֵת marca objetos diretos definidos e não possui equivalente lexical direto em português. A repetição é representada naturalmente por “os filhos de Arão e os levitas”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão e com legibilidade brasileira. A formulação mantém a concisão do hebraico e preserva a designação genealógica “filhos de Arão” sem interpretá-la explicitamente como “sacerdotes” ou “descendentes”.
