base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/020.yaml
  text: and Zechariah[a], Aziel, Shemiramoth, Jehiel, Unni, Eliab, Maaseiah, and Benaiah, with harps according to Alamoth.
translation:
  language: pt
  text: e Zacarias, Aziel, Semiramote, Jeiel, Uni, Eliabe, Maaseias e Benaías, com harpas, segundo Alamote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com harpas em registro agudo”; o termo hebraico “Alamote” talvez seja uma indicação musical associada a jovens mulheres ou a uma tessitura semelhante à de soprano.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּנְבָלִים
  choice: com harpas
  rationale: O termo נְבָלִים designa instrumentos de cordas, tradicionalmente entendidos como harpas ou liras. “Harpas” é claro e natural neste inventário musical, e a preposição בִּ é expressa em sentido instrumental por “com”.
- source_word: עַל
  choice: segundo
  rationale: Neste contexto musical, עַל provavelmente introduz o modo, a afinação ou o registro associado a עֲלָמוֹת. “Segundo” preserva essa flexibilidade sem definir em excesso o sentido técnico.
- source_word: עֲלָמוֹת
  choice: Alamote
  rationale: A palavra está relacionada lexicalmente a “jovens mulheres”, mas aqui parece funcionar como indicação musical técnica, talvez de registro agudo. A transliteração tradicional portuguesa “Alamote” preserva a incerteza, explicada em nota.
- source_word: וּ/זְכַרְיָה וַ/עֲזִיאֵל וּ/שְׁמִירָמוֹת וִֽ/יחִיאֵל וְ/עֻנִּי וֶֽ/אֱלִיאָב וּ/מַעֲשֵׂיָהוּ וּ/בְנָיָהוּ
  choice: e Zacarias, Aziel, Semiramote, Jeiel, Uni, Eliabe, Maaseias e Benaías
  rationale: Os nomes pessoais são transliterados em formas reconhecíveis e naturais em português. A conjunção inicial do hebraico é mantida, e a coordenação da lista segue o uso corrente do português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas de nomes bíblicos reconhecíveis para leitores brasileiros e internacionais. A formulação mantém o caráter de lista e não resolve indevidamente a incerteza do termo musical técnico.
