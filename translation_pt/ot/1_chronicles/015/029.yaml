  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִ֗י אֲרוֹן֙ בְּרִ֣ית יְהוָ֔ה בָּ֖א עַד עִ֣יר דָּוִ֑יד וּ/מִיכַ֨ל בַּת שָׁא֜וּל נִשְׁקְפָ֣ה בְּעַ֣ד הַ/חַלּ֗וֹן וַ/תֵּ֨רֶא אֶת הַ/מֶּ֤לֶךְ דָּוִיד֙ מְרַקֵּ֣ד וּ/מְשַׂחֵ֔ק וַ/תִּ֥בֶז ל֖/וֹ בְּ/לִבָּֽ/הּ־־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/029.yaml
  text: And as the ark of the covenant of Yahweh came to the city of David[a], Michal the daughter of Saul looked out through the window and saw King David dancing and playing, and she despised him in her heart.
translation:
  language: pt
  text: Quando a arca da aliança de Yahweh chegou à Cidade de Davi, Mical, filha de Saul, olhou pela janela e viu o rei Davi dançando e festejando[a]; então o desprezou em seu coração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se alegrando”, “brincando” ou “se divertindo”.'
    reason: O particípio מְשַׂחֵק admite sentidos festivos e lúdicos; “festejando” se ajusta ao contexto, mas a amplitude lexical merece ser preservada.
lexical_decisions:
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: a arca da aliança de Yahweh
  rationale: Reproduz naturalmente em português a cadeia construta e preserva o nome divino expresso no hebraico.
- source_word: בָּא עַד עִיר דָּוִיד
  choice: chegou à Cidade de Davi
  rationale: בוא com עַד indica aqui a chegada ao destino; “chegou a” é corrente e não afirma além do texto o momento exato da entrada.
- source_word: מִיכַל בַּת שָׁאוּל
  choice: Mical, filha de Saul
  rationale: Mantém a identificação que ressalta a ligação de Mical com Saul, em formulação natural em português.
- source_word: נִשְׁקְפָה בְּעַד הַחַלּוֹן
  choice: olhou pela janela
  rationale: Expressa de modo idiomático o ato de olhar para fora ou para baixo através da janela, sem impor uma direção não essencial.
- source_word: וַתֵּרֶא אֶת הַמֶּלֶךְ דָּוִיד
  choice: e viu o rei Davi
  rationale: Preserva o título definido do hebraico em ordem natural no português.
- source_word: מְרַקֵּד
  choice: dançando
  rationale: O particípio descreve movimento rítmico e vigoroso; “dançando” é claro e adequado à procissão festiva.
- source_word: וּמְשַׂחֵק
  choice: festejando
  rationale: שׂחק pode descrever brincar, alegrar-se ou celebrar festivamente; no contexto da procissão, “festejando” comunica a ação alegre sem sugerir mera brincadeira.
- source_word: וַתִּבֶז לוֹ
  choice: então o desprezou
  rationale: בזה denota desprezo ou desdém; a formulação conserva a força do verbo e explicita com naturalidade a sequência narrativa.
- source_word: בְּלִבָּהּ
  choice: em seu coração
  rationale: Tradução direta e idiomática que preserva o caráter interior do desprezo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino; “Yahweh” o translitera em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. “Cidade de Davi” recebe maiúscula por funcionar como topônimo. A sintaxe evita uma longa sequência de coordenações sem perder a progressão narrativa hebraica.
