base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/007.yaml
  text: 'For the sons of Gershom: Joel the chief[b][a], and 130 of his brothers.'
translation:
  language: pt
  text: 'Dos filhos de Gérsom[a]: Joel, o chefe, e 130 de seus irmãos[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Gérson”, conforme a forma tradicional mais conhecida do nome do clã; aqui, o hebraico traz “Gérsom”.
    reason: alternative_reading
  - marker: b
    text: Aqui, “irmãos” se refere aos homens do mesmo grupo familiar levítico, não necessariamente aos irmãos imediatos de Joel.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִ/בְנֵי
  choice: Dos filhos de
  rationale: O לְ introduz este grupo na lista, e בְּנֵי identifica a divisão genealógica. “Dos filhos de” preserva essa forma concisa e funciona naturalmente como cabeçalho da enumeração.
- source_word: גֵּרְשׁוֹם
  choice: Gérsom
  rationale: A forma hebraica deste versículo termina em m (Gershom). “Gérsom” a translitera de modo legível em português, sem substituí-la pela forma tradicional “Gérson”.
- source_word: יוֹאֵל
  choice: Joel
  rationale: Forma portuguesa consagrada e correspondente ao nome hebraico.
- source_word: הַ/שָּׂר
  choice: o chefe
  rationale: שַׂר designa aqui o responsável ou líder da divisão familiar. “Chefe” expressa a função sem sugerir necessariamente dignidade régia.
- source_word: וְ/אֶחָי/ו
  choice: e ... seus irmãos
  rationale: Mantém o sentido básico de אַחִים, embora, nesta lista levítica, o termo abranja homens do mesmo grupo familiar, não apenas irmãos imediatos.
- source_word: מֵאָה וּ/שְׁלֹשִׁים
  choice: '130'
  rationale: Representa diretamente o numeral hebraico e facilita a leitura em uma lista.
