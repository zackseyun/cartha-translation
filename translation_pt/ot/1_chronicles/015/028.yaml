id: 1CH.15.28
reference: 1 Chronicles 15:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/כָל יִשְׂרָאֵ֗ל מַעֲלִים֙ אֶת אֲר֣וֹן בְּרִית יְהוָ֔ה בִּ/תְרוּעָה֙ וּ/בְ/ק֣וֹל שׁוֹפָ֔ר וּ/בַ/חֲצֹצְר֖וֹת וּ/בִ/מְצִלְתָּ֑יִם מַשְׁמִעִ֕ים בִּ/נְבָלִ֖ים וְ/כִנֹּרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/028.yaml
  text: And all Israel was bringing up the ark of the covenant of Yahweh with shouting[a], with the sound of a horn, with trumpets, and with cymbals[b], making music with harps and lyres.
translation:
  language: pt
  text: E todo o Israel levava a arca da aliança de Yahweh com aclamações[a], ao som de uma trompa[b], de trombetas e de címbalos, fazendo soar harpas e liras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com um grande clamor”; o termo hebraico pode indicar um grito forte de celebração ou aclamação.
    reason: lexical_alternative
  - marker: b
    text: Hebraico shofar, uma trompa tradicional, distinta das “trombetas” mencionadas em seguida.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלִים
  choice: levava
  rationale: O particípio hifil expressa a ação em andamento de fazer a arca subir até Jerusalém. O singular concorda naturalmente com o sujeito coletivo “todo o Israel” em português.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: a arca da aliança de Yahweh
  rationale: Reproduz com clareza a cadeia construta e conserva tanto a especificidade da aliança quanto o nome divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no hebraico, em vez de substituí-lo por um título.
- source_word: תְרוּעָה
  choice: aclamações
  rationale: Abrange o clamor forte e coletivo próprio de celebração pública, sem restringi-lo a uma formulação verbal específica.
- source_word: קוֹל שׁוֹפָר
  choice: ao som de uma trompa
  rationale: Mantém explícito קוֹל, “som”, e distingue o שׁוֹפָר das trombetas mencionadas em seguida.
- source_word: חֲצֹצְרוֹת
  choice: trombetas
  rationale: Equivalente corrente para as trombetas cerimoniais retas, distintas da trompa anterior.
- source_word: מְצִלְתַּיִם
  choice: címbalos
  rationale: Equivalente português convencional para esse instrumento de percussão.
- source_word: מַשְׁמִעִים
  choice: faziam ressoar
  rationale: Preserva o valor causativo e auditivo do hifil de שׁמע e liga naturalmente a ação aos instrumentos de cordas seguintes.
- source_word: נְבָלִים
  choice: harpas
  rationale: Identificação moderna aproximada, mas convencional, que permite distingui-las das liras no mesmo versículo.
- source_word: כִנֹּרוֹת
  choice: liras
  rationale: Termo convencional escolhido para preservar a distinção entre os dois tipos de instrumento de cordas.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o Tetragrama como nome próprio; “Yahweh” o representa diretamente, sem substituí-lo pelo título tradicional.
translation_notes:
  register: 'Português atual, digno e amplamente compreensível, com fluidez brasileira. A colocação da nota [b] junto de “trompa” corrige sua associação lexical: ela explica שׁוֹפָר, não “címbalos”. A oração final no plural reflete o particípio hebraico plural e explicita que os israelitas faziam soar os instrumentos.'
