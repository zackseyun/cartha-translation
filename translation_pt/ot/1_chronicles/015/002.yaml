source:
  edition: WLC
  text: אָ֚ז אָמַ֣ר דָּוִ֔יד לֹ֤א לָ/שֵׂאת֙ אֶת אֲר֣וֹן הָֽ/אֱלֹהִ֔ים כִּ֖י אִם הַ/לְוִיִּ֑ם כִּי בָ֣/ם בָּחַ֣ר יְהוָ֗ה לָ/שֵׂ֞את אֶת אֲר֧וֹן יְהוָ֛ה וּֽ/לְ/שָׁרְת֖/וֹ עַד עוֹלָֽם־־־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/002.yaml
  text: Then David said[a], “No one is to carry the ark of God except the Levites[b], for Yahweh has chosen them to carry the ark of Yahweh and to minister to him forever.”
translation:
  language: pt
  text: 'Então Davi disse[a]: “Ninguém deve carregar a arca de Deus, a não ser os levitas, pois Yahweh os escolheu para carregar a arca de Yahweh e servi-lo para sempre.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Então Davi disse: ‘A arca de Deus não deve ser carregada por ninguém, a não ser pelos levitas.’” O hebraico é elíptico e deixa o sujeito implícito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Marca a sequência narrativa de modo natural e direto em português.
- source_word: אָמַר דָּוִיד
  choice: Davi disse
  rationale: É a forma narrativa não marcada e corresponde diretamente ao hebraico.
- source_word: לֹא לָשֵׂאת אֶת אֲרוֹן הָאֱלֹהִים כִּי אִם הַלְוִיִּם
  choice: Ninguém deve carregar a arca de Deus, a não ser os levitas
  rationale: O hebraico é elíptico e não expressa o sujeito de לָשֵׂאת. A formulação supre 'ninguém' e preserva tanto a restrição quanto a exceção.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: a arca de Deus
  rationale: '''Arca'' é o termo tradicional, claro e adequado para o objeto sagrado neste contexto.'
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: Designação convencional e amplamente compreendida em português.
- source_word: כִּי בָם בָּחַר יְהוָה
  choice: pois Yahweh os escolheu
  rationale: כִּי introduz a razão da restrição, e o perfeito בָּחַר indica a escolha divina já realizada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, em vez de substituí-lo por um título.
- source_word: לָשֵׂאת
  choice: carregar
  rationale: Expressa claramente a ação física de transportar a arca e é mais corrente do que 'levar aos ombros' ou 'portar'.
- source_word: אֲרוֹן יְהוָה
  choice: a arca de Yahweh
  rationale: Preserva a relação de posse e a repetição deliberada do texto hebraico.
- source_word: וּלְשָׁרְתוֹ
  choice: e servi-lo
  rationale: שרת denota serviço, frequentemente sagrado ou litúrgico; 'servi-lo' é natural em português e mantém Yahweh como o referente mais provável do sufixo.
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: Equivalente português natural para uma nomeação duradoura e contínua.
theological_decisions:
- issue: Referente do sufixo em וּלְשָׁרְתוֹ
  choice: O pronome em 'servi-lo' refere-se a Yahweh.
  alternative: Entender a expressão como serviço diante da arca ou junto dela.
  rationale: Yahweh é o antecedente pessoal explícito e o serviço levítico é regularmente descrito como prestado a ele. A tradução conserva essa leitura provável sem ampliar a frase.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A construção 'a não ser' comunica naturalmente a exceção; 'servi-lo' evita o tom excessivamente técnico de 'ministrar-lhe' sem perder o contexto de serviço sagrado.
