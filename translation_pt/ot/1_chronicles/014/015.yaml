  text: וִ֠/יהִי כְּֽ/שָׁמְעֲ/ךָ֞ אֶת ק֤וֹל הַ/צְּעָדָה֙ בְּ/רָאשֵׁ֣י הַ/בְּכָאִ֔ים אָ֖ז תֵּצֵ֣א בַ/מִּלְחָמָ֑ה כִּֽי יָצָ֤א הָֽ/אֱלֹהִים֙ לְ/פָנֶ֔י/ךָ לְ/הַכּ֖וֹת אֶת מַחֲנֵ֥ה פְלִשְׁתִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/015.yaml
  text: And when you hear the sound of marching in the tops of the balsam trees[a], then go out to battle, for God has gone out before you to strike down the camp of the Philistines.
translation:
  language: pt
  text: Quando você ouvir o som de passos no alto das árvores de bálsamo[a], então saia para a batalha, pois Deus terá saído à sua frente para atacar o acampamento dos filisteus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “árvores de baca”; tradicionalmente, “amoreiras”. Não se sabe ao certo qual espécie de árvore o termo hebraico designa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי כְּשָׁמְעֲךָ
  choice: Quando você ouvir
  rationale: A construção com היה e כְּ mais infinitivo introduz uma circunstância temporal. A formulação é natural em português e não acrescenta a ideia mais enfática de “assim que”.
- source_word: קוֹל הַצְּעָדָה
  choice: o som de passos
  rationale: קוֹל designa aqui um fenômeno audível, e הַצְּעָדָה se refere ao ato de pisar ou marchar. “Som de passos” preserva a imagem sonora sem tornar explícita demais a interpretação militar de “marcha”.
- source_word: בְּרָאשֵׁי הַבְּכָאִים
  choice: no alto das árvores de bálsamo
  rationale: רָאשִׁים indica as partes superiores das árvores. A espécie indicada por בְּכָאִים é incerta; “árvores de bálsamo” oferece uma identificação comum e compreensível, com a incerteza registrada em nota.
- source_word: אָז תֵּצֵא בַמִּלְחָמָה
  choice: então saia para a batalha
  rationale: אָז marca a ação consequente, e יצא mantém a imagem de sair ou avançar. “Sair para a batalha” é uma expressão portuguesa natural e próxima da forma hebraica.
- source_word: כִּי יָצָא הָאֱלֹהִים לְפָנֶיךָ
  choice: pois Deus terá saído à sua frente
  rationale: כִּי introduz a razão da ordem. O perfeito יָצָא apresenta a ação divina como já realizada no momento em que o sinal for ouvido; o futuro composto expressa essa anterioridade dentro da instrução futura.
- source_word: לְהַכּוֹת אֶת מַחֲנֵה פְלִשְׁתִּים
  choice: para atacar o acampamento dos filisteus
  rationale: O hifil de נכה pode significar golpear, atacar ou derrotar. “Atacar” preserva a ação militar sem afirmar antecipadamente o resultado, e מַחֲנֶה é vertido diretamente como “acampamento”.
theological_decisions:
- issue: Sentido de הָאֱלֹהִים
  choice: Deus
  alternative: os deuses
  rationale: Embora אֱלֹהִים tenha forma plural, o verbo singular e o contexto identificam o Deus de Israel como sujeito.
- issue: Valor temporal do perfeito יָצָא
  choice: terá saído
  alternative: saiu / vai à sua frente
  rationale: A fala dá uma instrução para uma situação futura, mas apresenta a saída de Deus como anterior à ação de Davi. “Terá saído” conserva essa relação temporal sem transformar o verbo em mero presente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega “você” por ser amplamente compreensível e evita linguagem arcaica. A tradução mantém a imagem concreta do som nas copas e a anterioridade da ação divina.
