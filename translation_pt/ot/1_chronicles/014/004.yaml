  text: 'And these are the names of the children born to him in Jerusalem: Shammua[a], Shobab, Nathan, and Solomon.'
translation:
  language: pt
  text: 'Estes são os nomes dos que lhe nasceram em Jerusalém: Samua, Sobabe, Natã e Salomão.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Estes são
  rationale: O demonstrativo introduz a lista seguinte. Em português, a omissão de uma conjunção inicial produz uma abertura mais natural sem perder a ligação contextual.
- source_word: שְׁמוֹת הַיְלוּדִים אֲשֶׁר הָיוּ לוֹ
  choice: os nomes dos que lhe nasceram
  rationale: O particípio passivo הַיְלוּדִים significa literalmente «os nascidos», e não emprega o substantivo comum para «filhos». A formulação portuguesa preserva essa nuance e expressa naturalmente a relação indicada por הָיוּ לוֹ.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: Expressão locativa direta, indicando o lugar em que nasceram.
- source_word: שַׁמּוּעַ
  choice: Samua
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico.
- source_word: שׁוֹבָב
  choice: Sobabe
  rationale: Transliteração adaptada à ortografia e à pronúncia portuguesas.
- source_word: נָתָן
  choice: Natã
  rationale: Forma portuguesa tradicional do nome hebraico.
- source_word: שְׁלֹמֹה
  choice: Salomão
  rationale: Forma portuguesa tradicional e amplamente estabelecida do nome.
