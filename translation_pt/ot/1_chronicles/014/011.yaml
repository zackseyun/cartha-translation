base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/011.yaml
  text: So they went up to Baal-perazim[a], and David struck them down there. And David said, “God has broken through my enemies by my hand, like a bursting flood of waters.” Therefore they called the name of that place Baal-perazim.
translation:
  language: pt
  text: 'Assim, eles subiram a Baal-Perazim[a], e ali Davi os derrotou. Então Davi disse: “Deus abriu uma brecha entre os meus inimigos por minha mão, como uma torrente de águas que irrompe.” Por isso deram àquele lugar o nome de Baal-Perazim.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baal-Perazim soa como “senhor” ou “mestre das brechas/rompimentos” e pode evocar um lugar de brechas. O nome faz um jogo de palavras com a declaração de Davi de que Deus abriu uma brecha entre os seus inimigos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: eles subiram
  rationale: Preserva o sentido direcional comum de עלה em contexto de deslocamento militar, sem especificar além do texto se vieram ou avançaram.
- source_word: בְּבַעַל פְּרָצִים / בַּעַל פְּרָצִים
  choice: Baal-Perazim
  rationale: Mantém transliterado o nome do lugar e deixa a nota explicar o jogo de palavras com a raiz פרץ.
- source_word: וַיַּכֵּם
  choice: Davi os derrotou
  rationale: Em contexto de batalha, נכה pode indicar golpear ou derrotar; “derrotou” é natural e claro em português, sem afirmar explicitamente que todos foram mortos.
- source_word: פָּרַץ
  choice: abriu uma brecha
  rationale: Expressa a ação de romper ou abrir passagem e conserva a ligação lexical e imagética com Perazim e com águas que irrompem.
- source_word: הָאֱלֹהִים
  choice: Deus
  rationale: O verbo singular identifica um sujeito divino singular; em português, a forma idiomática adequada é “Deus”.
- source_word: אֶת אוֹיְבַי
  choice: entre os meus inimigos
  rationale: Com “abrir uma brecha”, a construção portuguesa “entre os meus inimigos” comunica naturalmente o objeto sobre o qual se deu o rompimento, sem eliminar a imagem militar.
- source_word: בְּיָדִי
  choice: por meio da minha mão
  rationale: Preserva a imagem hebraica da mão como instrumento da ação divina, embora a expressão seja deliberadamente mais formal do que “por meu intermédio”.
- source_word: כְּפֶרֶץ מָיִם
  choice: como águas que irrompem
  rationale: Reproduz de maneira vívida e natural a imagem de águas rompendo uma barreira e mantém o eco verbal de פרץ.
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Conector causal e conclusivo natural no português narrativo moderno.
- source_word: קָרְאוּ שֵׁם הַמָּקוֹם הַהוּא
  choice: deram àquele lugar o nome de
  rationale: Mantém o sujeito plural do hebraico e verte de modo idiomático a fórmula hebraica de nomeação.
theological_decisions:
- issue: Referência de אֱלֹהִים na declaração de Davi
  choice: Deus como sujeito singular que age por meio de Davi
  alternative: Entender אֱלֹהִים como seres divinos ou deuses
  rationale: O verbo singular פָּרַץ aponta para um referente singular. A frase atribui a vitória a Deus e, ao mesmo tempo, apresenta a mão de Davi como instrumento humano, sem confundir as duas agências.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O texto preserva o nome próprio e seu jogo de palavras por meio da nota. “Por meio da minha mão” conserva intencionalmente a imagem concreta do hebraico, enquanto “derrotou” evita sobretraduzir o alcance de נכה.
