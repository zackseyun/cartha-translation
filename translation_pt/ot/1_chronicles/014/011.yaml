  terminology: «Baal-Perazim» é a transliteração adequada. A nota deve explicar que o nome soa como «senhor/mestre das brechas/rompimentos» e que também pode evocar um lugar caracterizado por brechas, em vez de apresentar «lugar dos rompimentos» como significado lexical direto de Baal.
