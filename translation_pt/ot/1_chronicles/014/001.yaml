base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/001.yaml
  text: Then Hiram king of Tyre sent messengers to David[a], and cedar timber, masons, and carpenters[b], to build a house for him.
translation:
  language: pt
  text: Então Hirão, rei de Tiro, enviou mensageiros[a] a Davi, e madeira de cedro, pedreiros e carpinteiros, para lhe construírem uma casa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “enviados”. O termo hebraico pode designar representantes oficiais em um contexto real.
    reason: lexical_alternative
  - marker: b
    text: Ou “um palácio”. A palavra hebraica traduzida como “casa” também pode referir-se a uma residência real.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Então ... enviou
  rationale: O wayyiqtol dá continuidade à narrativa; “Então” expressa de modo natural a sequência do relato.
- source_word: חירם
  choice: Hirão
  rationale: Forma tradicional e amplamente reconhecida em português para o nome próprio.
- source_word: מֶלֶךְ צֹר
  choice: rei de Tiro
  rationale: A cadeia construta identifica diretamente o cargo e o domínio de Hirão.
- source_word: מַלְאָכִים
  choice: mensageiros
  rationale: Preserva o sentido lexical amplo; neste contexto real, também pode indicar enviados oficiais.
- source_word: וַעֲצֵי אֲרָזִים
  choice: além de madeira de cedro
  rationale: O contexto de construção indica madeira utilizada como material, não árvores vivas; “além de” esclarece que Hirão enviou tanto pessoas quanto materiais.
- source_word: חָרָשֵׁי קִיר
  choice: pedreiros
  rationale: A expressão designa artesãos que trabalham na construção de paredes; “pedreiros” é a equivalência portuguesa corrente.
- source_word: חָרָשֵׁי עֵצִים
  choice: carpinteiros
  rationale: Designa artesãos que trabalham com madeira, especialmente em contexto de construção.
- source_word: לִבְנוֹת לוֹ בָּיִת
  choice: para lhe construírem uma casa
  rationale: O infinitivo expressa finalidade. “Casa” mantém o equivalente direto de בָּיִת sem decidir no texto principal que se trata especificamente de um palácio.
