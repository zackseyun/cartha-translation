base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/003.yaml
  text: And David took more wives in Jerusalem[a], and David fathered more sons and daughters.
translation:
  language: pt
  text: Davi tomou mais esposas em Jerusalém[a] e gerou mais filhos e filhas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “casou-se com mais mulheres”. O hebraico diz literalmente: “tomou mais esposas”; a palavra também pode significar “mulheres”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: tomou
  rationale: Preserva o sentido básico de לקח e a formulação concreta do hebraico; neste contexto, a relação conjugal é esclarecida pelo objeto “mulheres” e pela nota.
- source_word: עוֹד
  choice: ainda outras / mais
  rationale: O termo indica acréscimo quantitativo. “Ainda outras” soa natural com mulheres, enquanto “mais” é natural com filhos e filhas.
- source_word: נָשִׁים
  choice: mulheres
  rationale: O substantivo pode significar “mulheres” ou “esposas”. “Mulheres” preserva a amplitude lexical, enquanto a nota registra explicitamente a alternativa contextual “esposas”.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: Tradução locativa direta da preposição בְּ com o nome do lugar.
- source_word: וַיּוֹלֶד
  choice: gerou
  rationale: Com sujeito masculino, ילד expressa que ele se tornou pai. “Gerou” é conciso, corrente no registro bíblico moderno e mais específico que “teve”.
- source_word: בָּנִים וּבָנוֹת
  choice: filhos e filhas
  rationale: Mantém a menção explícita dos dois grupos feita pelo hebraico, em vez de generalizá-la como “filhos” ou “crianças”.
- source_word: דָּוִיד
  choice: Davi
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Descrição narrativa da poligamia de Davi
  choice: Relatar o ato sem qualificação moral acrescentada.
  alternative: Introduzir linguagem que indique aprovação ou reprovação.
  rationale: O versículo descreve Davi tomando outras mulheres e gerando descendentes, mas não apresenta aqui uma avaliação moral explícita; a tradução preserva essa postura narrativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção evita o arcaísmo “desposou” e mantém a repetição do nome Davi apenas uma vez, como é natural em português, sem perda de referente.
