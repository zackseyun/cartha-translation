base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/012.yaml
  text: And they left their gods there[a], and David gave the order[b], and they were burned with fire.
translation:
  language: pt
  text: Eles deixaram ali os seus deuses[a]. Então Davi deu a ordem[b], e estes foram queimados com fogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os seus ídolos”. O hebraico diz literalmente “os seus deuses”, embora provavelmente se refira às imagens usadas no culto.'
    reason: lexical_alternative
  - marker: b
    text: 'O relato paralelo em 2 Samuel 5:21 traz uma ação diferente: “Davi e os seus homens os levaram embora”. Em Crônicas, estes foram queimados com fogo por ordem de Davi.'
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: deixaram
  rationale: עזב significa deixar ou abandonar. “Deixaram” descreve de modo natural os filisteus deixando para trás seus objetos de culto, sem acrescentar uma ênfase interpretativa.
- source_word: שָׁם
  choice: ali
  rationale: O advérbio indica simplesmente o lugar já mencionado; “ali” é conciso e natural em português.
- source_word: אֶת אֱלֹהֵיהֶם
  choice: os seus deuses
  rationale: O hebraico diz literalmente “os deuses deles”. Embora provavelmente se refira às imagens cultuais, a tradução preserva a expressão do texto-fonte e apresenta “ídolos” em nota como alternativa interpretativa.
- source_word: וַיֹּאמֶר דָּוִיד
  choice: Então Davi deu a ordem
  rationale: Literalmente, “e Davi disse”. No contexto, a fala tem a função de uma ordem que resulta na queima; esta formulação comunica isso em português natural sem especificar palavras não registradas.
- source_word: וַיִּשָּׂרְפוּ
  choice: eles foram queimados
  rationale: A forma é entendida em sentido passivo, tendo como referente os deuses ou objetos cultuais mencionados. Isso evita inserir um objeto explícito ausente do hebraico.
- source_word: בָּאֵשׁ
  choice: no fogo
  rationale: A expressão indica o meio pelo qual foram queimados. “No fogo” é idiomático e claro em português.
theological_decisions:
- issue: Tradução de אֱלֹהֵיהֶם no contexto de objetos cultuais pagãos
  choice: os seus deuses
  alternative: os seus ídolos
  rationale: A tradução mantém a formulação literal do hebraico, sem substituir de modo silencioso “deuses” pela identificação interpretativa “ídolos”. A nota esclarece o provável referente.
- issue: Relação com o relato paralelo de 2 Samuel 5:21
  choice: 'preservar a redação própria de Crônicas: foram queimados por ordem de Davi'
  alternative: 'harmonizar com 2 Samuel: Davi e seus homens os levaram embora'
  rationale: A redação de Crônicas não deve ser harmonizada com o relato paralelo. A diferença textual é preservada e informada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Os seus deuses” preserva a forma hebraica; “deu a ordem” expressa naturalmente a função contextual de וַיֹּאמֶר. Os marcadores [a] e [b] aparecem no texto principal.
