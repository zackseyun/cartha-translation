lexical_decisions:
- source_word: וֶ/אֱלִישָׁמָע
  choice: e Elisama
  rationale: O ו conjuntivo é traduzido por “e”. O nome próprio אֱלִישָׁמָע é transliterado na forma portuguesa convencional “Elisama”.
- source_word: וּ/בְעֶלְיָדָע
  choice: Beeliada
  rationale: O ו conjuntivo é representado pela coordenação natural da enumeração em português. A forma consonantal בְעֶלְיָדָע é preservada como “Beeliada”, em vez de ser harmonizada com a forma paralela “Eliada” de 2 Samuel 5:16.
- source_word: וֶ/אֱלִיפָלֶט
  choice: e Elifelete
  rationale: O ו conjuntivo é traduzido por “e”. O nome אֱלִיפָלֶט é transliterado segundo a forma portuguesa convencional “Elifelete”.
theological_decisions: []
translation_notes:
