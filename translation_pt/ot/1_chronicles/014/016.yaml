base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/016.yaml
  text: So David did as God had commanded him, and they struck down the Philistine army from Gibeon as far as Gezer.
translation:
  language: pt
  text: Assim, Davi fez como Deus lhe havia ordenado, e eles derrotaram o exército dos filisteus[a] desde Gibeão até Gezer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o acampamento dos filisteus”; aqui, “acampamento” provavelmente designa, por metonímia, a força militar ali reunida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fez
  rationale: O verbo עשה introduz de modo direto a obediência de Davi; a expressão natural em português é “fez como”.
- source_word: כַּאֲשֶׁר
  choice: como
  rationale: Expressa conformidade entre a ação de Davi e a ordem divina, de maneira concisa e idiomática.
- source_word: צִוָּהוּ
  choice: lhe havia ordenado
  rationale: צוה significa ordenar; o mais-que-perfeito composto explicita naturalmente que a ordem precedeu a ação de Davi.
- source_word: הָאֱלֹהִים
  choice: Deus
  rationale: Embora tenha artigo em hebraico, no contexto funciona como designação do Deus de Israel; “Deus” é a forma natural em português.
- source_word: וַיַּכּוּ
  choice: eles derrotaram
  rationale: A forma verbal é plural e aponta para Davi e suas tropas. No contexto militar, נכה pode indicar vencer ou derrotar; “derrotaram” evita a possível impressão de que golpearam literalmente um acampamento.
- source_word: מַחֲנֵה פְלִשְׁתִּים
  choice: o exército dos filisteus
  rationale: מַחֲנֶה significa literalmente “acampamento”, mas pode designar metonimicamente a força acampada. “Exército” comunica com clareza o referente militar, enquanto a nota preserva a expressão literal.
- source_word: מִגִּבְעוֹן וְעַד גָּזְרָה
  choice: desde Gibeão até Gezer
  rationale: A construção marca os limites geográficos da derrota ou perseguição; “desde... até...” reproduz naturalmente essa extensão em português.
theological_decisions:
- issue: Sujeito de וַיַּכּוּ
  choice: 'sujeito plural: Davi e seus homens'
  alternative: Davi sozinho como sujeito representativo
  rationale: O verbo hebraico está morfologicamente no plural, e o contexto pressupõe que as tropas de Davi agiram com ele. O pronome “eles” preserva esse dado gramatical.
translation_notes:
  register: Português atual, claro e digno, com ampla legibilidade brasileira. A formulação mantém a sequência narrativa, explicita o sujeito plural e registra em nota o sentido literal de מַחֲנֶה.
