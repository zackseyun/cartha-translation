base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/008.yaml
  text: When the Philistines heard that David had been anointed king over all Israel[a], all the Philistines went up to seek David. And David heard, and went out before them.
translation:
  language: pt
  text: Quando os filisteus ouviram que Davi havia sido ungido rei sobre todo Israel, todos os filisteus subiram à procura de Davi. Davi soube disso e saiu ao encontro deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “saiu diante deles”; a expressão também pode significar “saiu ao encontro deles” ou “saiu contra eles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ פְלִשְׁתִּים
  choice: os filisteus ouviram
  rationale: שׁמע, nesta narrativa, indica receber uma notícia; “ouviram” preserva diretamente o verbo hebraico e é natural em português.
- source_word: כִּי נִמְשַׁח דָּוִיד לְמֶלֶךְ
  choice: que Davi havia sido ungido rei
  rationale: כִּי introduz o conteúdo ouvido, e o nifal נִמְשַׁח expressa que Davi recebeu a unção. O mais-que-perfeito composto deixa clara a anterioridade sem alterar o sentido.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: sobre todo o Israel
  rationale: עַל assinala aqui o âmbito do governo real, e כָּל destaca que a realeza abrangia Israel inteiro.
- source_word: וַיַּעֲלוּ כָל פְּלִשְׁתִּים
  choice: todos eles subiram
  rationale: עלה é mantido como “subiram”, sem acrescentar ao verbo uma especificação militar. “Todos eles” retoma de modo claro e natural os filisteus, preservando a força coletiva de כָּל.
- source_word: לְבַקֵּשׁ אֶת דָּוִיד
  choice: à procura de Davi
  rationale: בקשׁ significa procurar ou buscar. A formulação conserva a finalidade da ação sem explicitar além do texto a intenção hostil.
- source_word: וַיִּשְׁמַע דָּוִיד
  choice: Davi soube disso
  rationale: A segunda ocorrência de שׁמע significa que Davi recebeu a notícia da movimentação filisteia. “Soube disso” evita uma oração incompleta em português e explicita apenas o referente contextual.
- source_word: וַיֵּצֵא לִפְנֵיהֶם
  choice: saiu ao encontro deles
  rationale: A expressão significa literalmente “saiu diante deles”, mas em contexto narrativo-militar pode indicar sair para encontrá-los ou enfrentá-los. “Ao encontro deles” é natural e preserva a ambiguidade quanto à natureza exata da confrontação; a literalidade é registrada em nota.
