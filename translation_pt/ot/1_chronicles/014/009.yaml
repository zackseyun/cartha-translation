  text: The Philistines came and raided the Valley of Rephaim[a].
translation:
  language: pt
  text: Os filisteus vieram e fizeram uma incursão no vale de Refaim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se espalharam pelo vale de Refaim”. O verbo hebraico pode indicar o posicionamento ou avanço de tropas, bem como uma incursão; o contexto é de ação militar hostil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פְלִשְׁתִּים
  choice: Os filisteus
  rationale: פְלִשְׁתִּים é o nome do povo. O ו inicial marca a continuidade narrativa, que em português pode ficar implícita sem a introdução artificial de “então” ou “ora”.
- source_word: בָּאוּ
  choice: vieram
  rationale: O qal perfeito de בוא significa de modo direto “vieram”; o pretérito perfeito é natural na sequência narrativa.
- source_word: וַֽ/יִּפְשְׁטוּ
  choice: fizeram uma incursão
  rationale: Em contexto militar, פשט pode indicar espalhar-se ou avançar em incursão. “Fizeram uma incursão” comunica a ação militar hostil sem restringi-la necessariamente a saque.
- source_word: בְּ/עֵמֶק
  choice: no vale de
  rationale: עֵמֶק significa “vale”, e a preposição ב é expressa naturalmente por “no”.
- source_word: רְפָאִים
  choice: Refaim
  rationale: Aqui רְפָאִים integra o topônimo “vale de Refaim”; por isso, é transliterado como nome próprio.
