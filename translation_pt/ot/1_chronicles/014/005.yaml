  rationale: Nome próprio transliterado do hebraico; a forma preserva de modo claro a consoante gutural representada por “h” e é adequada ao português.
- source_word: אֱלִישׁוּעַ
  choice: Elisua
  rationale: Transliteração natural em português da leitura massorética de Crônicas, sem importar a forma diferente encontrada no relato paralelo.
- source_word: אֶלְפָּלֶט
  choice: Elpelete
  rationale: Forma aportuguesada que acompanha de perto a vocalização massorética e evita depender de grafias convencionais inglesas.
- source_word: וְ
  choice: e
  rationale: A conjunção prefixada coordena os últimos nomes da lista; em português, a coordenação natural requer “e” antes do último nome.
