revisions:
- from: 'Então Davi consultou a Deus outra vez, e Deus lhe disse: “Não suba atrás deles. Afaste-se deles, dê a volta e avance contra eles diante das árvores de bálsamo[a].”'
  to: 'Então Davi consultou a Deus outra vez, e Deus lhe disse: “Não suba atrás deles. Dê a volta, afastando-se deles, e avance contra eles diante das árvores de bálsamo[a].”'
  rationale: 'A revisão é limitada à apresentação da ordem tática central: «Dê a volta, afastando-se deles» reproduz de modo coeso o imperativo com sua expressão direcional, preservando a ambiguidade do hebraico e sem introduzir a formulação «por trás deles». A nota e os demais termos permanecem adequados.'
