    issue: 'A ordem הָסֵב מֵעֲלֵיהֶם foi vertida como dois imperativos coordenados: «Afaste-se deles, dê a volta».'
    rationale: O hebraico apresenta um imperativo de mudar de direção/contornar qualificado por «afastando-se deles». A revisão une esses elementos e evita que a tradução pareça especificar duas manobras independentes.
  revised_text: 'Então Davi consultou a Deus outra vez, e Deus lhe disse: “Não suba atrás deles. Dê a volta, afastando-se deles, e avance contra eles diante das árvores de bálsamo[a].”'
