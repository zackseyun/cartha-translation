base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/014.yaml
  text: So David inquired of God again[a], and God said to him, “You shall not go up after them. Circle around from behind them, and come against them opposite the balsam trees.”
translation:
  language: pt
  text: 'Então Davi consultou a Deus outra vez, e Deus lhe disse: “Não suba atrás deles. Dê a volta, afastando-se deles, e avance contra eles diante das árvores de bálsamo[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “as árvores de baca”; não se sabe ao certo qual era a espécie. Algumas traduções tradicionais trazem “amoreiras”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בֵּאלֹהִים
  choice: consultou a Deus
  rationale: O verbo שׁאל com ב, neste contexto, indica buscar orientação divina; “consultou a Deus” comunica esse sentido em português natural.
- source_word: עוֹד
  choice: outra vez
  rationale: Marca a repetição da consulta de Davi e soa corrente na narrativa.
- source_word: לֹא תַעֲלֶה אַחֲרֵיהֶם
  choice: Não suba atrás deles
  rationale: Preserva o verbo espacial עלה, “subir”, e evita explicitar “atacar” além do que o hebraico declara, embora o contexto seja militar.
- source_word: הָסֵב מֵעֲלֵיהֶם
  choice: Afaste-se deles, dê a volta
  rationale: הָסֵב ordena uma mudança de direção ou movimento em circuito, enquanto מֵעֲלֵיהֶם indica afastamento deles; a formulação portuguesa torna clara a manobra sem transformar a expressão em “vá para trás deles”, leitura presente no paralelo de 2 Samuel, mas não neste texto hebraico.
- source_word: וּבָאתָ לָהֶם
  choice: e avance contra eles
  rationale: No contexto militar, בוא com ל indica aproximar-se de um adversário; “avance contra eles” expressa naturalmente esse movimento hostil.
- source_word: מִמּוּל
  choice: diante de
  rationale: Designa uma posição defronte ou em frente de algo; “diante de” é natural e não exige precisão espacial maior que a do hebraico.
- source_word: הַבְּכָאִים
  choice: as árvores de bálsamo
  rationale: A espécie exata é incerta. “Árvores de bálsamo” representa uma identificação lexical comum, enquanto a nota preserva a incerteza botânica.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa direta. O imperativo foi expresso com formas correntes no português brasileiro, sem perder o movimento tático do hebraico. O marcador da nota foi colocado junto ao termo botânico a que efetivamente se refere.
