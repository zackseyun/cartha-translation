base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/017.yaml
  text: And David’s name went out into all the lands[b][a], and Yahweh put the fear of him on all the nations.
translation:
  language: pt
  text: E a fama de Davi se espalhou por todas as terras, e Yahweh fez com que todas as nações temessem Davi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: “Yahweh infundiu em todas as nações o seu temor”, entendendo-se “seu” como referência a Yahweh. O contexto favorece a referência a Davi.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא שֵׁם דָּוִיד
  choice: a fama de Davi se espalhou
  rationale: A expressão hebraica diz literalmente que o “nome” de Davi “saiu”, um idiomatismo referente à difusão de sua fama ou reputação. A tradução natural explicita esse sentido sem alterar a ideia.
- source_word: בְּכָל הָאֲרָצוֹת
  choice: por todas as terras
  rationale: O plural אֲרָצוֹת designa as diversas terras ou territórios ao redor; “por” expressa naturalmente a extensão da fama.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: נָתַן אֶת פַּחְדּוֹ עַל
  choice: fez com que ... tivessem medo dele
  rationale: A construção hebraica significa literalmente pôr o medo de alguém sobre outros. A formulação causal comunica com clareza que Yahweh produziu nas nações o medo de Davi.
- source_word: כָּל הַגּוֹיִם
  choice: todas as nações
  rationale: גּוֹיִם refere-se aqui aos povos ou nações ao redor; “nações” mantém a correspondência lexical e é natural em português.
theological_decisions:
- issue: Referente do sufixo pronominal em פַּחְדּוֹ
  choice: 'O sufixo refere-se a Davi: as nações tiveram medo dele.'
  alternative: 'O sufixo poderia ser entendido como referência a Yahweh: temor dele, isto é, temor de Yahweh.'
  rationale: O contexto imediato trata da fama de Davi após suas vitórias, favorecendo Davi como referente. A nota preserva a ambiguidade gramatical genuína do sufixo hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A imagem hebraica literal de o nome “sair” foi traduzida pelo idiomatismo natural “a fama ... se espalhou”; a ambiguidade do referente de “dele” foi preservada em nota.
