  text: וַ/יִּשְׁאַ֨ל דָּוִ֤יד בֵּ/אלֹהִים֙ לֵ/אמֹ֔ר הַ/אֶֽעֱלֶה֙ עַל פלשתיים וּ/נְתַתָּ֖/ם בְּ/יָדִ֑/י וַ/יֹּ֨אמֶר ל֤/וֹ יְהוָה֙ עֲלֵ֔ה וּ/נְתַתִּ֖י/ם בְּ/יָדֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/010.yaml
  text: And David inquired of God[a], saying, “Shall I go up against the Philistines, and will you give them into my hand?” And Yahweh said to him, “Go up, and I will give them into your hand.”
translation:
  language: pt
  text: 'Davi consultou a Deus, dizendo: “Devo subir contra os filisteus? Tu os entregarás nas minhas mãos[a]?” Yahweh lhe respondeu: “Sobe, e eu os entregarei nas tuas mãos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “tu os darás em minha mão?”. “Dar na mão de alguém” é um idioma hebraico que significa colocar sob o poder dessa pessoa.
    reason: Explica o sentido e a forma literal do idioma hebraico נתן ביד.
lexical_decisions:
- source_word: וַיִּשְׁאַל בֵּאלֹהִים
  choice: consultou a Deus
  rationale: Neste contexto, o verbo descreve a busca de orientação divina, não uma pergunta casual. A construção portuguesa comunica naturalmente que Davi dirigiu sua consulta a Deus.
- source_word: הַאֶעֱלֶה
  choice: Devo subir
  rationale: A pergunta busca saber se Davi deve empreender o avanço militar. “Subir” conserva o verbo hebraico e sua repetição na resposta.
- source_word: עַל פלשתיים
  choice: contra os filisteus
  rationale: Em contexto militar, a preposição indica movimento hostil contra esse povo.
- source_word: וּנְתַתָּם בְּיָדִי
  choice: Tu os entregarás nas minhas mãos
  rationale: A expressão נתן ביד significa colocar alguém sob o poder de outra pessoa. “Entregar nas mãos” é natural em português e mantém a imagem do idioma hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עֲלֵה
  choice: Suba
  rationale: Repete na resposta o mesmo verbo de movimento militar usado na pergunta de Davi.
- source_word: וּנְתַתִּים בְּיָדֶךָ
  choice: eu os entregarei nas suas mãos
  rationale: Espelha a formulação da pergunta e preserva a imagem hebraica de colocar o inimigo sob o poder de Davi.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto traz diretamente o Tetragrama. A transliteração preserva o nome pessoal e evita substituí-lo silenciosamente por um título.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira. Emprega “tu” na pergunta dirigida a Deus, mas usa o imperativo brasileiro corrente “Suba” e “suas mãos” na resposta; o referente de “suas” é Davi. Mantém “subir” para reproduzir a correspondência verbal do hebraico.
