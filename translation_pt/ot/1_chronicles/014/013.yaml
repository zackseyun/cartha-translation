  yaml_path: translation/ot/1_chronicles/014/013.yaml
  text: And the Philistines again spread out in the valley[a].
translation:
  language: pt
  text: Os filisteus voltaram a se espalhar no vale.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mais uma vez se posicionaram no vale”.'
    reason: Alternativa lexical que explicita o possível sentido militar de פשט e representa a repetição marcada por וַיֹּסִיפוּ עוֹד.
lexical_decisions:
- source_word: וַיֹּסִיפוּ עוֹד
  choice: voltaram a
  rationale: A combinação de יסף com עוֹד indica repetição. Em português, “voltaram a” expressa naturalmente que os filisteus repetiram a ação, sem reproduzir de modo artificial os dois elementos hebraicos.
- source_word: פְּלִשְׁתִּים
  choice: os filisteus
  rationale: Forma tradicional e amplamente reconhecida em português para o nome desse povo; o artigo é natural no contexto.
- source_word: וַיִּפְשְׁטוּ
  choice: se espalhar
  rationale: Neste contexto militar, פשט descreve as tropas estendendo-se ou dispondo-se pelo terreno. “Se espalhar” preserva essa imagem sem especificar indevidamente uma incursão de saque.
- source_word: בָּעֵמֶק
  choice: pelo vale
  rationale: Embora ב seja frequentemente locativo, com um verbo de expansão “pelo vale” comunica em português tanto o âmbito espacial quanto a distribuição das tropas dentro dele.
