  text: וַ/יֵּ֣דַע דָּוִ֔יד כִּֽי הֱכִינ֧/וֹ יְהוָ֛ה לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵ֑ל כִּֽי נִשֵּׂ֤את לְ/מַ֨עְלָ/ה֙ מַלְכוּת֔/וֹ בַּ/עֲב֖וּר עַמּ֥/וֹ יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/002.yaml
  text: And David knew that Yahweh had established him as king over Israel[b][a], for his kingdom had been greatly exalted for the sake of his people Israel.
translation:
  language: pt
  text: Davi reconheceu que Yahweh o havia estabelecido como rei sobre Israel, pois o seu reino havia sido grandemente exaltado[a] em benefício do seu povo Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “havia sido elevado às alturas”.'
    reason: lexical_alternative
  - marker: b
    text: “Seu povo” pode referir-se ao povo de Yahweh; também pode ser entendido como o povo de Davi.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּדַע
  choice: reconheceu
  rationale: O qal de ידע pode indicar saber ou chegar a reconhecer. Neste contexto narrativo, “reconheceu” comunica naturalmente que Davi compreendeu a ação de Yahweh sem acrescentar uma ideia estranha ao hebraico.
- source_word: הֱכִינוֹ
  choice: o havia estabelecido
  rationale: O hifil de כון expressa firmar, confirmar ou estabelecer. A formulação escolhida se ajusta à confirmação de Davi no ofício real.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: como rei sobre Israel
  rationale: A preposição לְ marca aqui a função para a qual Davi foi estabelecido, e עַל indica sua autoridade régia sobre Israel.
- source_word: נִשֵּׂאת לְמַעְלָה
  choice: havia sido grandemente exaltado
  rationale: A expressão descreve o reino como elevado a uma posição de grande destaque. A tradução mantém a voz passiva e apresenta em português natural a força intensificadora de לְמַעְלָה.
- source_word: מַלְכוּתוֹ
  choice: o seu reino
  rationale: מַלְכוּת pode significar reino, realeza ou reinado. “Reino” preserva a amplitude do termo e sua referência ao domínio real de Davi.
- source_word: בַּעֲבוּר
  choice: por causa de
  rationale: A locução pode indicar causa, propósito ou benefício. “Por causa de” preserva certa abertura sem impor exclusivamente uma dessas nuances; a nota registra a leitura de benefício.
- source_word: עַמּוֹ יִשְׂרָאֵל
  choice: do seu povo Israel
  rationale: A expressão hebraica é reproduzida sem explicitar no corpo do texto a quem se refere o possessivo, preservando a ambiguidade gramatical.
theological_decisions:
- issue: Referente do possessivo em “seu povo Israel”
  choice: Manter o possessivo sem referente explicitado no texto
  alternative: Explicitar “o povo de Yahweh” ou entender “seu” como referência a Davi
  rationale: A forma hebraica admite formalmente ambos os referentes. Embora o contexto favoreça Israel como povo de Yahweh, a tradução não deve eliminar silenciosamente a ambiguidade.
- issue: Força do segundo כִּי
  choice: causal, “pois”
  alternative: explicativo ou completivo, “que”
  rationale: A segunda oração apresenta de modo natural a base pela qual Davi reconheceu que Yahweh o havia estabelecido; “pois” torna clara essa relação sem alterar o conteúdo.
- issue: Agente da exaltação do reino
  choice: Manter a construção passiva sem nomear o agente
  alternative: Explicitar Yahweh como agente
  rationale: O hebraico usa uma forma passiva e não declara o agente nessa oração. Ainda que Yahweh seja plausivelmente pressuposto pelo contexto, não é necessário acrescentá-lo.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Reconheceu” evita a rigidez de “soube” neste contexto; “Yahweh” preserva o nome divino. Os marcadores foram colocados após a oração pertinente, em ordem alfabética.
