revisions:
- from: Além disso, por causa do meu prazer na casa do meu Deus, entreguei à casa do meu Deus o meu tesouro particular de ouro e prata, além de tudo o que preparei para a casa santa.[a]
  to: Além disso, por causa do meu apreço pela casa do meu Deus, tenho um tesouro particular de ouro e prata, e o entreguei à casa do meu Deus, além de tudo o que preparei para a casa santa.[a]
  rationale: A revisão explicita a construção possessiva "tenho um tesouro particular", preservando a sequência do hebraico antes de "o entreguei". Também substitui uma expressão portuguesa menos idiomática por "apreço pela casa", que transmite o agrado ou a disposição favorável de Davi sem introduzir interpretação doutrinária. Mantêm-se a terminologia de "casa" e a alternativa de nota.
