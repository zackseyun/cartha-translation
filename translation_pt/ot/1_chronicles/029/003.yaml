  source_fidelity: 'O sentido central é preservado: a declaração adicional de Davi, seu apreço pela casa de Deus, o tesouro pessoal de ouro e prata e sua doação além dos preparativos anteriores. Contudo, o hebraico apresenta explicitamente a posse ("tenho") antes da doação; a revisão a conserva.'
  naturalness: '"Por causa do meu prazer na casa" é compreensível, mas soa pouco idiomático em português e pode sugerir prazer experimentado dentro do edifício, em vez de apreço pela casa de Deus. "Por causa do meu apreço pela casa" é natural e mantém a relação semântica pretendida.'
  terminology: '"Casa do meu Deus" e "casa santa" refletem de modo consistente בית. "Tesouro particular" comunica adequadamente a noção de propriedade pessoal valiosa (סְגֻלָּה). A nota para "casa santa" mantém uma alternativa lexical legítima.'
