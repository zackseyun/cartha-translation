  text: וְ/ע֗וֹד בִּ/רְצוֹתִ/י֙ בְּ/בֵ֣ית אֱלֹהַ֔/י יֶשׁ לִ֥/י סְגֻלָּ֖ה זָהָ֣ב וָ/כָ֑סֶף נָתַ֤תִּי לְ/בֵית אֱלֹהַ/י֙ לְ/מַ֔עְלָ/ה מִ/כָּל הֲכִינ֖וֹתִי לְ/בֵ֥ית הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/003.yaml
  text: Moreover[a], because of my delight in the house of my God, I have a personal treasure of gold and silver, and I have given it to the house of my God[c][b], over and above all that I have prepared for the holy house.
translation:
  language: pt
  text: Além disso, por causa do meu apreço pela casa do meu Deus, tenho um tesouro particular de ouro e prata, e o entreguei à casa do meu Deus, além de tudo o que preparei para a casa santa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para o santuário”. Hebraico: “para a casa de santidade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹד
  choice: Além disso
  rationale: Introduz uma contribuição adicional à já mencionada no contexto, preservando a função aditiva e enfática.
- source_word: בִּרְצוֹתִי בְּבֵית אֱלֹהַי
  choice: por causa do meu prazer na casa do meu Deus
  rationale: O substantivo com sufixo expressa o prazer ou agrado de Davi, e בְּ indica naturalmente o objeto ou âmbito desse prazer.
- source_word: יֶשׁ לִי סְגֻלָּה
  choice: o meu tesouro particular
  rationale: A construção existencial indica posse, e סְגֻלָּה designa aqui bens valiosos pertencentes pessoalmente a Davi, em contraste com os recursos antes preparados.
- source_word: זָהָב וָכָסֶף
  choice: ouro e prata
  rationale: Equivalência direta dos termos materiais.
- source_word: נָתַתִּי לְבֵית אֱלֹהַי
  choice: entreguei à casa do meu Deus
  rationale: O perfeito apresenta a ação como realizada; com נתן, לְ marca o destino da oferta. 'Entreguei' soa natural e evita a possível leitura de que Davi deu o edifício em si.
- source_word: לְמַעְלָה מִכָּל הֲכִינוֹתִי
  choice: além de tudo o que preparei
  rationale: Expressa uma contribuição adicional que excede os preparativos já feitos.
- source_word: לְבֵית הַקֹּדֶשׁ
  choice: para a casa santa
  rationale: Preserva a imagem reiterada de בַּיִת, literalmente 'casa', e o caráter consagrado expresso por הַקֹּדֶשׁ.
theological_decisions:
- issue: Terminologia para o lugar de culto em construção
  choice: casa do meu Deus / casa santa
  alternative: templo do meu Deus / santuário
  rationale: O hebraico repete בַּיִת, 'casa'. Manter 'casa' conserva a ressonância da morada de Deus e evita substituir a imagem por uma interpretação, embora 'templo' e 'santuário' sejam equivalentes contextuais possíveis.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluente. A ordem foi ajustada para evitar uma sequência pesada de orações e manter claro que o tesouro pessoal foi entregue por Davi. O marcador [a] aparece no texto junto à expressão a que se refere.
