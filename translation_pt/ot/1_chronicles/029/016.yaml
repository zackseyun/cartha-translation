source:
  edition: WLC
  text: יְהוָ֣ה אֱלֹהֵ֔י/נוּ כֹ֣ל הֶ/הָמ֤וֹן הַ/זֶּה֙ אֲשֶׁ֣ר הֲכִינֹ֔נוּ לִ/בְנֽוֹת לְ/ךָ֥ בַ֖יִת לְ/שֵׁ֣ם קָדְשֶׁ֑/ךָ מִ/יָּדְ/ךָ֥ היא וּ/לְ/ךָ֥ הַ/כֹּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/016.yaml
  text: O Yahweh our God[a], all this abundance that we have prepared to build you a house for your holy name is from your hand[c][b], and all things are yours.
translation:
  language: pt
  text: Ó Yahweh, nosso Deus, toda esta abundância que preparamos para construir para ti uma casa dedicada ao teu santo nome vem da tua mão, e tudo é teu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Ó Yahweh, nosso Deus
  rationale: O vocativo é expresso naturalmente em português; o nome divino é transliterado como “Yahweh”, e אֱלֹהֵינוּ, neste contexto, significa “nosso Deus”.
- source_word: כֹל הֶהָמוֹן הַזֶּה
  choice: toda esta abundância
  rationale: הָמוֹן indica aqui a grande quantidade de recursos e materiais reunidos para a construção, não uma multidão de pessoas.
- source_word: אֲשֶׁר הֲכִינֹנוּ
  choice: que preparamos
  rationale: O perfeito hebraico descreve a preparação já realizada; o pretérito perfeito é claro e natural em português.
- source_word: לִבְנוֹת לְךָ בַיִת
  choice: para construir para ti uma casa
  rationale: Mantém explicitamente o beneficiário expresso por לְךָ e conserva “casa”, em vez de substituir o termo hebraico por “templo”.
- source_word: לְשֵׁם קָדְשֶׁךָ
  choice: dedicada ao teu santo nome
  rationale: No contexto da construção de uma casa para Deus, a expressão indica sua dedicação ao nome santo; “dedicada” torna essa relação clara sem trocar “nome” por outra ideia.
- source_word: מִיָּדְךָ הִיא
  choice: vem da tua mão
  rationale: Preserva a imagem hebraica da mão como fonte da provisão, em formulação idiomática portuguesa.
- source_word: וּלְךָ הַכֹּל
  choice: e tudo é teu
  rationale: Reproduz de modo direto e natural a afirmação hebraica de que a totalidade pertence a Deus.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto contém o Tetragrama; “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título.
- issue: Sentido de לְשֵׁם קָדְשֶׁךָ
  choice: dedicada ao teu santo nome
  alternative: para o teu santo nome
  rationale: A opção escolhida explicita a relação de dedicação inerente ao contexto, mantendo a centralidade do nome santo e sem identificar a casa simplesmente com o próprio nome.
translation_notes:
  register: Português moderno, solene e acessível, com formas amplamente compreensíveis. Emprega “ti/teu” de maneira coerente no discurso dirigido a Deus. Não foram necessárias notas, pois as alternativas lexicais não afetam materialmente a compreensão do versículo.
