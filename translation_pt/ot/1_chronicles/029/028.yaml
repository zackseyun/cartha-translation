base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/028.yaml
  text: And he died in a good old age[a], full of days, riches, and honor; and Solomon his son reigned in his place.
translation:
  language: pt
  text: E morreu em boa velhice, satisfeito de dias[a], riquezas e honra; e seu filho Salomão reinou em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cheio de dias”. Expressão hebraica que descreve uma vida longa e plenamente vivida.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: E morreu
  rationale: O wayyiqtol de מות dá sequência à narrativa; “E morreu” preserva essa progressão sem acrescentar interpretação.
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: em boa velhice
  rationale: A expressão descreve positivamente a condição em que ocorreu a morte. “Em boa velhice” mantém de perto o idioma hebraico e é clara em português.
- source_word: שְׂבַע יָמִים
  choice: satisfeito de dias
  rationale: A construção hebraica indica uma vida longa e plenamente vivida. “Satisfeito de dias” preserva o sentido de saciedade de שְׂבַע e a imagem de “dias”, sem reduzir a expressão apenas à idade avançada.
- source_word: עֹשֶׁר וְכָבוֹד
  choice: riquezas e honra
  rationale: עֹשֶׁר designa riqueza material, enquanto כָבוֹד, neste contexto régio e humano, refere-se sobretudo a honra ou prestígio.
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: O Qal de מלך significa “reinar” ou “ser rei”; “reinou” é conciso e apropriado à fórmula de sucessão.
- source_word: שְׁלֹמֹה בְנוֹ
  choice: seu filho Salomão
  rationale: A ordem portuguesa é mais natural do que a reprodução rígida da ordem hebraica e conserva integralmente a relação filial.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: Na fórmula de sucessão, תחת com sufixo indica que Salomão ocupou a posição régia de Davi.
