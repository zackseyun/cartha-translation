  yaml_path: translation/ot/1_chronicles/029/026.yaml
  text: And David son of Jesse reigned over all Israel.
translation:
  language: pt
  text: E Davi, filho de Jessé, reinou sobre todo o Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/דָוִיד
  choice: E Davi
  rationale: A conjunção וְ funciona como ligação simples com a continuação narrativa; “E” a preserva de modo natural. O nome próprio é vertido na forma portuguesa consagrada, “Davi”.
- source_word: בֶּן יִשָׁי
  choice: filho de Jessé
  rationale: A construção nominal significa literalmente “filho de Jessé”. A forma sem artigo é natural em português e mantém a identificação genealógica.
- source_word: מָלַךְ
  choice: reinou
  rationale: O qal perfeito de מלך, neste contexto, descreve o exercício do governo real, e não apenas a subida ao trono. “Reinou” expressa diretamente esse sentido.
- source_word: עַל
  choice: sobre
  rationale: Com o verbo מלך, a preposição עַל indica o povo ou domínio governado. “Sobre” é a correspondência idiomática apropriada em português.
- source_word: כָּל יִשְׂרָאֵל
  choice: todo o Israel
  rationale: כָּל expressa a totalidade da nação. “Todo o Israel” é uma formulação clara e corrente em português, preservando a abrangência do governo de Davi.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do hebraico sem perder naturalidade. A forma brasileira consagrada “Davi” foi preferida; “Jessé” e “Israel” seguem o uso bíblico corrente.
