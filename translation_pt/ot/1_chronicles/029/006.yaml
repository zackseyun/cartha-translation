  text: וַ/יִּֽתְנַדְּבוּ֩ שָׂרֵ֨י הָ/אָב֜וֹת וְ/שָׂרֵ֣י שִׁבְטֵ֣י יִשְׂרָאֵ֗ל וְ/שָׂרֵ֤י הָ/אֲלָפִים֙ וְ/הַ/מֵּא֔וֹת וּ/לְ/שָׂרֵ֖י מְלֶ֥אכֶת הַ/מֶּֽלֶךְ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/006.yaml
  text: Then the leaders of the fathers’ houses[a], and the leaders of the tribes of Israel, and the commanders of the thousands and of the hundreds, and the overseers of the king’s work[c][b], gave willingly.
translation:
  language: pt
  text: Então contribuíram voluntariamente[a] os chefes das casas paternas[b], os chefes das tribos de Israel, os comandantes das unidades de mil e de cem[c] e os supervisores do trabalho do rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “fizeram ofertas de livre vontade” ou “se ofereceram voluntariamente”. O verbo hebraico enfatiza a espontaneidade; neste contexto, refere-se provavelmente a contribuições materiais.
    reason: lexical_alternative
  - marker: b
    text: As “casas paternas” eram grupos familiares ou clãs organizados segundo a ascendência paterna.
    reason: cultural_note
  - marker: c
    text: “Mil” e “cem” designam aqui unidades militares ou administrativas; por isso, seus chefes são chamados de comandantes.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְנַדְּבוּ
  choice: contribuíram voluntariamente
  rationale: O hitpael de נדב destaca uma resposta espontânea e livre. Neste contexto, trata-se de contribuições materiais para o templo; a formulação portuguesa comunica tanto a ação de contribuir quanto seu caráter voluntário, sem inserir um objeto ausente no hebraico.
- source_word: שָׂרֵי
  choice: chefes / comandantes / supervisores
  rationale: 'שָׂרִים designa pessoas investidas de autoridade. A tradução varia naturalmente conforme cada grupo: “chefes” para estruturas familiares e tribais, “comandantes” para unidades de mil e cem e “supervisores” para a administração do trabalho real.'
- source_word: הָאָבוֹת
  choice: casas paternas
  rationale: A expressão refere-se às divisões familiares ancestrais organizadas pela linhagem paterna. “Casas paternas” preserva essa estrutura social antiga, complementada por nota explicativa.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: tribos de Israel
  rationale: Tradução direta e consagrada para as unidades tribais de Israel.
- source_word: הָאֲלָפִים וְהַמֵּאוֹת
  choice: unidades de mil e de cem
  rationale: Os números designam unidades militares ou administrativas, não apenas quantidades abstratas. Como שָׂרֵי rege os dois termos, “comandantes das unidades” explicita de modo natural a relação sintática.
- source_word: מְלֶאכֶת הַמֶּלֶךְ
  choice: trabalho do rei
  rationale: מְלָאכָה pode indicar trabalho, tarefa ou empreendimento. “Trabalho do rei” mantém deliberadamente amplo o âmbito das atividades sob responsabilidade desses oficiais.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem verbal inicial preserva o movimento do hebraico sem produzir uma frase artificial. Os termos funcionais variam conforme o contexto para evitar a repetição pouco natural de “chefes”, mantendo a mesma noção geral de autoridade.
