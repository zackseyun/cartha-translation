source:
  edition: WLC
  text: וְ/עַתָּ֣ה אֱלֹהֵ֔י/נוּ מוֹדִ֥ים אֲנַ֖חְנוּ לָ֑/ךְ וּֽ/מְהַֽלְלִ֖ים לְ/שֵׁ֥ם תִּפְאַרְתֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/013.yaml
  text: And now[a], our God, we give thanks to you and praise the name of your glory.
translation:
  language: pt
  text: E agora, nosso Deus, nós te damos graças e louvamos o teu nome glorioso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “louvamos o nome da tua glória”.'
    reason: alternativa lexical e preservação da construção hebraica
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a conjunção que liga a frase ao fluxo da oração quanto o marcador temporal que introduz a resposta presente.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Reproduz diretamente o substantivo com o sufixo da primeira pessoa do plural, sem acrescentar uma partícula vocativa inexistente no hebraico.
- source_word: מוֹדִים אֲנַחְנוּ לָךְ
  choice: nós te damos graças
  rationale: Neste contexto de culto, o hifil de ידה expressa gratidão ou louvor. A formulação preserva o pronome enfático אֲנַחְנוּ e distingue este verbo do paralelo 'louvamos'.
- source_word: וּמְהַלְלִים
  choice: e louvamos
  rationale: O particípio piel de הלל denota louvar ou exaltar. O presente simples é natural em português para a ação realizada nesta oração.
- source_word: לְשֵׁם תִּפְאַרְתֶּךָ
  choice: o teu nome glorioso
  rationale: A expressão hebraica é literalmente 'o nome da tua glória'. A forma adjetival comunica com naturalidade em português que o nome de Deus é revestido de glória, sem eliminar a linguagem bíblica do 'nome'; a construção mais formal é preservada em nota.
theological_decisions:
- issue: Forma do tratamento direto a Deus
  choice: nosso Deus
  alternative: ó nosso Deus
  rationale: Embora o contexto seja uma oração e permita entender a expressão como vocativo, o hebraico não contém partícula vocativa. A tradução evita acrescentar solenidade litúrgica não explicitada no texto.
- issue: Sentido teológico da expressão sobre o nome de Deus
  choice: louvamos o teu nome glorioso
  alternative: louvamos o nome da tua glória
  rationale: Mantém-se a referência ao 'nome', importante na linguagem bíblica sobre a reputação e a honra reveladas de Deus. A tradução principal usa português idiomático, enquanto a nota conserva a estrutura nominal e sua possível tensão interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O uso de “te” após “nosso Deus” é corrente e evita tanto arcaísmo quanto excesso de formalidade. O pronome explícito “nós” conserva a ênfase do hebraico.
