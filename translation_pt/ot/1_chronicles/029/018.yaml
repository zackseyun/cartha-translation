source:
  edition: WLC
  text: יְהוָ֗ה אֱ֠לֹהֵי אַבְרָהָ֞ם יִצְחָ֤ק וְ/יִשְׂרָאֵל֙ אֲבֹתֵ֔י/נוּ שֳׁמְרָ/ה זֹּ֣את לְ/עוֹלָ֔ם לְ/יֵ֥צֶר מַחְשְׁב֖וֹת לְבַ֣ב עַמֶּ֑/ךָ וְ/הָכֵ֥ן לְבָבָ֖/ם אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/018.yaml
  text: O Yahweh[a], God of Abraham, Isaac, and Israel, our fathers, keep this forever in the intentions of the thoughts of the heart of your people[d][c][b], and direct their heart toward you.
translation:
  language: pt
  text: Ó Yahweh, Deus de Abraão, Isaque e Israel[a], nossos pais, conserva isto para sempre como a disposição dos pensamentos do coração do teu povo[b] e firma o coração deles para ti[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz “Israel”; embora nesta fórmula patriarcal muitos esperem “Jacó”, o texto não deve ser harmonizado.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “conserva isto para sempre como a inclinação dos pensamentos do coração do teu povo”. A construção hebraica também pode ser entendida em termos de propósito ou disposição interior.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “dirige o coração deles para ti”; também é possível: “estabelece o coração deles para ti”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico, preservando sua função de nome próprio da aliança.
- source_word: אֱלֹהֵי
  choice: Deus de
  rationale: Reproduz de modo natural o estado construto diante dos nomes dos patriarcas.
- source_word: אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל אֲבֹתֵינוּ
  choice: Abraão, Isaque e Israel, nossos pais
  rationale: Mantém “Israel”, conforme o hebraico, sem harmonizá-lo com a fórmula mais comum que usa “Jacó”; “nossos pais” conserva a referência masculina específica aos patriarcas.
- source_word: שָׁמְרָה זֹּאת לְעוֹלָם
  choice: conserva para sempre esta disposição
  rationale: שׁמר pede que Deus preserve de modo duradouro aquilo que acaba de ser demonstrado pelo povo; “esta disposição” explicita o referente de זֹאת à luz da expressão seguinte.
- source_word: לְיֵצֶר מַחְשְׁבוֹת לְבַב עַמֶּךָ
  choice: nos pensamentos do coração do teu povo
  rationale: A expressão hebraica reúne inclinação ou disposição, pensamentos e coração. A formulação portuguesa mantém a antropologia bíblica de “coração” e evita uma cadeia nominal excessivamente artificial.
- source_word: וְהָכֵן
  choice: e firma
  rationale: O hifil de כון pode significar estabelecer, preparar, tornar firme ou orientar. “Firma” combina naturalmente com “coração” e preserva a ideia de estabilidade e orientação.
- source_word: לְבָבָם אֵלֶיךָ
  choice: o coração deles em ti
  rationale: Preserva o singular coletivo לְבָבָם e expressa em português a orientação estável do coração para Deus.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz explicitamente o Tetragrama. A transliteração “Yahweh” preserva o nome próprio sem substituí-lo por um título.
- issue: Identidade do terceiro patriarca na fórmula
  choice: Israel
  alternative: Jacó
  rationale: Embora “Jacó” seja esperado em fórmulas patriarcais semelhantes, o texto massorético lê יִשְׂרָאֵל, por isso a tradução não harmoniza a passagem.
- issue: Sentido de וְהָכֵן aplicado ao coração
  choice: firma
  alternative: dirige; prepara; estabelece
  rationale: O verbo comporta tanto a ideia de estabelecer quanto a de orientar. “Firma” preserva a estabilidade da lealdade a Deus sem excluir a direção indicada por אֵלֶיךָ.
translation_notes:
  register: Português moderno, reverente e amplamente compreensível, com legibilidade brasileira. A oração mantém “Ó” como vocativo solene, conserva “coração” como centro da vontade e dos pensamentos e evita uma reprodução excessivamente rígida da cadeia nominal hebraica.
