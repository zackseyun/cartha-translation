base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/020.yaml
  text: Then David said to all the assembly, “Now bless Yahweh your God.” And all the assembly blessed Yahweh, the God of their fathers, and bowed their heads and prostrated themselves before Yahweh and before the king.
translation:
  language: pt
  text: 'Então Davi disse a toda a assembleia: “Bendigam agora a Yahweh, seu Deus”.[a] E toda a assembleia bendisse a Yahweh, o Deus de seus pais; eles se inclinaram e se prostraram diante de Yahweh e diante do rei.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por favor, bendigam a Yahweh, seu Deus”. A partícula hebraica נָא pode expressar apelo ou urgência.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz que eles “se prostraram” diante de “Yahweh e do rei”. A expressão descreve homenagem corporal; em relação ao rei, algumas traduções dizem “prestaram homenagem”.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּרְכוּ נָא
  choice: Bendigam agora
  rationale: O imperativo plural de ברך exorta a assembleia a bendizer ou louvar a Deus. נָא acrescenta apelo ou urgência; “agora” preserva essa força em português corrente, enquanto a nota registra a alternativa de súplica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: הַקָּהָל
  choice: a assembleia
  rationale: Designa o povo reunido; “assembleia” é claro, digno e adequado ao contexto público.
- source_word: אֱלֹהֵי אֲבֹתֵיהֶם
  choice: o Deus de seus pais
  rationale: Mantém o idioma histórico da aliança e o substantivo masculino plural do hebraico, sem excluir seu sentido ancestral.
- source_word: וַיִּקְּדוּ
  choice: se inclinaram
  rationale: קדד descreve o ato de curvar-se ou inclinar-se. A formulação evita acrescentar “a cabeça”, que não está expressa, e distingue o gesto da prostração indicada pelo verbo seguinte.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: se prostraram
  rationale: Preserva a ação corporal concreta, sem convertê-la antecipadamente no termo interpretativo “adoraram”, especialmente porque o enunciado inclui Yahweh e o rei.
- source_word: לַיהוָה וְלַמֶּלֶךְ
  choice: diante de Yahweh e diante do rei
  rationale: Com o verbo de prostração, “diante de” é idiomático em português. A repetição mantém ambos os referentes explícitos sem afirmar que receberam honra de natureza idêntica.
theological_decisions:
- issue: A ação do povo em relação a Yahweh e ao rei
  choice: 'Manter a linguagem corporal: “se inclinaram e se prostraram diante de Yahweh e diante do rei”'
  alternative: “adoraram Yahweh e prestaram homenagem ao rei”
  rationale: O hebraico associa a mesma sequência de ações aos dois referentes. A tradução não diferencia interpretativamente os atos nem sugere que o rei recebeu adoração divina; preserva a tensão e deixa explícita a postura corporal descrita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Bendigam” conserva o vocabulário cultual sem soar arcaico; “se inclinaram” e “se prostraram” mantêm distintos os dois movimentos corporais. Todos os marcadores de nota aparecem no texto.
