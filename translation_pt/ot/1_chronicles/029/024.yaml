base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/024.yaml
  text: And all the officials[a], the mighty men, and also all the sons of King David pledged allegiance to King Solomon.
translation:
  language: pt
  text: Todos os oficiais, os homens valentes e também todos os filhos do rei Davi juraram lealdade[a] ao rei Salomão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “deram a mão sob Salomão, o rei”, expressão hebraica que indica submissão ou compromisso de lealdade.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָּׂרִים
  choice: oficiais
  rationale: O termo designa autoridades ou altos funcionários; “oficiais” é claro no contexto da corte e não restringe a função à esfera militar.
- source_word: גִּבֹּרִים
  choice: homens valentes
  rationale: Preserva a amplitude do termo, que pode indicar homens de bravura, poder ou destaque, muitas vezes com conotação militar, sem reduzi-lo apenas a “guerreiros”.
- source_word: בְּנֵי הַמֶּלֶךְ דָּוִיד
  choice: filhos do rei Davi
  rationale: Mantém de modo natural a relação filial explícita e o título real ligado a Davi.
- source_word: נָתְנוּ יָד תַּחַת
  choice: juraram lealdade a
  rationale: A expressão hebraica, literalmente “deram a mão sob”, comunica submissão e compromisso de fidelidade a um superior. “Juraram lealdade” transmite essa força idiomática em português corrente e digno.
- source_word: שְׁלֹמֹה הַמֶּלֶךְ
  choice: rei Salomão
  rationale: É a ordem mais natural em português para a aposição hebraica e deixa claro o reconhecimento da condição real de Salomão.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com sintaxe natural. “Homens valentes” conserva a amplitude tradicional de גִּבֹּרִים, enquanto a nota torna transparente o idioma hebraico por trás de “juraram lealdade”.
