  text: וְ/לִ/שְׁלֹמֹ֣ה בְנִ֗/י תֵּ֚ן לֵבָ֣ב שָׁלֵ֔ם לִ/שְׁמוֹר֙ מִצְוֺתֶ֔י/ךָ עֵדְוֺתֶ֖י/ךָ וְ/חֻקֶּ֑י/ךָ וְ/לַ/עֲשׂ֣וֹת הַ/כֹּ֔ל וְ/לִ/בְנ֖וֹת הַ/בִּירָ֥ה אֲשֶׁר הֲכִינֽוֹתִי־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/019.yaml
  text: And give to Solomon my son a whole heart to keep your commandments[a], your testimonies, and your statutes, and to do all of them, and to build the fortress that I have prepared.
translation:
  language: pt
  text: E dá a Salomão, meu filho, um coração íntegro para guardar os teus mandamentos, os teus testemunhos e os teus estatutos, para cumprir tudo isso e para construir a cidadela[a] que preparei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «palácio»; neste contexto, refere-se ao templo. O termo hebraico é incomum e designa uma estrutura grandiosa ou fortificada, aqui o santuário que Davi deixou preparado para Salomão construir.
    reason: Alternativa lexical e esclarecimento do referente contextual de בִּירָה.
lexical_decisions:
- source_word: וְלִשְׁלֹמֹה בְנִי תֵּן
  choice: E dá a Salomão, meu filho
  rationale: A preposição marca Salomão como objeto indireto do pedido. A ordem foi ajustada para soar natural em português, mantendo explicitamente «meu filho».
- source_word: לֵבָב שָׁלֵם
  choice: um coração íntegro
  rationale: לֵבָב designa o centro interior da vontade e do pensamento, e שָׁלֵם comunica inteireza, integridade e plenitude. «Íntegro» conserva esse sentido sem sugerir perfeição absoluta.
- source_word: לִשְׁמוֹר
  choice: para guardar
  rationale: No contexto dos mandamentos da aliança, שׁמר significa guardar ou observar. «Guardar» preserva a imagem hebraica e é corrente no português bíblico.
- source_word: מִצְוֺתֶיךָ עֵדְוֺתֶיךָ וְחֻקֶּיךָ
  choice: os teus mandamentos, os teus testemunhos e os teus estatutos
  rationale: 'A tradução mantém a distinção entre os três termos jurídicos e pactuais: מצוה, עדות e חק.'
- source_word: וְלַעֲשׂוֹת הַכֹּל
  choice: para cumprir tudo isso
  rationale: Literalmente, «e para fazer tudo». «Cumprir tudo isso» retoma naturalmente o conjunto de mandamentos, testemunhos e estatutos sem acrescentar conteúdo.
- source_word: וְלִבְנוֹת הַבִּירָה
  choice: e para construir a cidadela
  rationale: בִּירָה é um termo incomum para uma estrutura grandiosa, palaciana ou fortificada. «Cidadela» preserva essa nuance lexical marcada; a nota esclarece que, neste contexto, a referência é ao santuário preparado por Davi.
- source_word: אֲשֶׁר הֲכִינוֹתִי
  choice: que preparei
  rationale: O hifil de כון significa preparar ou deixar pronto. O perfeito hebraico é expresso naturalmente pelo pretérito perfeito em português.
theological_decisions:
- issue: Sentido de בִּירָה em relação ao santuário de Jerusalém
  choice: cidadela, com nota explicativa
  alternative: palácio; templo; templo-fortaleza
  rationale: O termo pode denotar uma cidadela ou estrutura palaciana e fortificada, mas aqui se refere ao projeto do santuário. Traduzir apenas «templo» apagaria a peculiaridade lexical; «palácio» poderia sugerir erroneamente uma residência real. O texto mantém a imagem marcada e a nota identifica o referente contextual sem eliminar a ambiguidade.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas pronominais tradicionais («teus») coerentes com a oração dirigida a Deus. «Coração íntegro» é natural e preserva a metáfora hebraica; «testemunhos» mantém a distinção entre os termos pactuais. A marca [a] foi colocada junto a «cidadela», o termo ao qual a nota se refere.
