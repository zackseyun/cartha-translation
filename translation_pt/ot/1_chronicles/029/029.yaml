  text: וְ/דִבְרֵי֙ דָּוִ֣יד הַ/מֶּ֔לֶךְ הָ/רִאשֹׁנִ֖ים וְ/הָ/אֲחרֹנִ֑ים הִנָּ֣/ם כְּתוּבִ֗ים עַל דִּבְרֵי֙ שְׁמוּאֵ֣ל הָ/רֹאֶ֔ה וְ/עַל דִּבְרֵי֙ נָתָ֣ן הַ/נָּבִ֔יא וְ/עַל דִּבְרֵ֖י גָּ֥ד הַ/חֹזֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/029.yaml
  text: The acts of David the king[a], the former and the latter, are written in the records of Samuel the seer, and in the records of Nathan the prophet[c][b], and in the records of Gad the seer.
translation:
  language: pt
  text: Os feitos do rei Davi, do início ao fim,[a] estão escritos nos registros[b] de Samuel, o vidente, nos registros de Natã, o profeta, e nos registros de Gade, o vidente.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os primeiros e os últimos”, expressão que abrange todo o período.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “estão escritos sobre as palavras de Samuel... Natã... Gade”. Aqui, “registros” expressa o sentido de fontes escritas.'
    reason: lexical_alternative
  - marker: c
    text: O hebraico emprega dois títulos diferentes para Samuel (רֹאֶה, ro’eh) e Gade (חֹזֶה, hozeh). Ambos são traduzidos aqui como “vidente”; para Gade, também se poderia usar “visionário”, embora essa palavra possa ter outro sentido no português atual.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי דָּוִיד הַמֶּלֶךְ
  choice: os feitos do rei Davi
  rationale: Neste contexto de síntese régia, דִּבְרֵי designa os feitos, acontecimentos ou assuntos do reinado, e não apenas palavras faladas. “Feitos” é conciso, digno e natural em português.
- source_word: הָרִאשֹׁנִים וְהָאֲחֲרֹנִים
  choice: do início ao fim
  rationale: O par “os primeiros e os últimos” abrange toda a extensão do reinado. A formulação idiomática portuguesa comunica esse merismo com clareza, enquanto a forma mais literal é preservada em nota.
- source_word: הִנָּם כְּתוּבִים
  choice: estão escritos
  rationale: Preserva diretamente a afirmação documental. A força dêitica de הִנָּם não exige “eis que” no português corrente.
- source_word: עַל דִּבְרֵי שְׁמוּאֵל / נָתָן / גָּד
  choice: nos registros de Samuel / Natã / Gade
  rationale: A construção aponta para fontes escritas. “Registros” transmite o sentido documental sem especificar indevidamente o gênero como crônicas ou livros.
- source_word: הָרֹאֶה
  choice: o vidente
  rationale: Título profético tradicional e natural para רֹאֶה, distinto de נָבִיא.
- source_word: הַנָּבִיא
  choice: o profeta
  rationale: Equivalente português corrente e preciso de נָבִיא.
- source_word: הַחֹזֶה
  choice: o vidente
  rationale: Embora חֹזֶה seja lexicalmente distinto de רֹאֶה, “vidente” é o equivalente português mais natural para ambos neste contexto; “visionário” poderia sugerir em português moderno uma pessoa idealista, em vez de um título profético.
theological_decisions:
- issue: Distinção entre os títulos proféticos רֹאֶה e חֹזֶה
  choice: Traduzir ambos como “vidente” no texto principal, registrando a distinção hebraica em nota
  alternative: Traduzir רֹאֶה por “vidente” e חֹזֶה por “visionário”
  rationale: A distinção é lexical e histórica, não uma diferença doutrinária explicitada pelo versículo. Empregar “visionário” poderia produzir um sentido moderno inadequado; a nota conserva a informação do original sem tornar o texto principal artificial.
- issue: Sentido abrangente de הָרִאשֹׁנִים וְהָאֲחֲרֹנִים
  choice: “do início ao fim”
  alternative: “os primeiros e os últimos”
  rationale: 'A leitura principal expressa o merismo sem resolver além do que o contexto permite: trata-se dos feitos de todo o período do reinado. A correspondência formal permanece disponível na nota.'
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. Evita arcaísmos como “eis que” e preserva em notas as formas hebraicas mais literais e a distinção entre os títulos proféticos.
