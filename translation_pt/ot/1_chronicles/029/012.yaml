  text: וְ/הָ/עֹ֤שֶׁר וְ/הַ/כָּבוֹד֙ מִ/לְּ/פָנֶ֔י/ךָ וְ/אַתָּה֙ מוֹשֵׁ֣ל בַּ/כֹּ֔ל וּ/בְ/יָדְ/ךָ֖ כֹּ֣חַ וּ/גְבוּרָ֑ה וּ/בְ/יָ֣דְ/ךָ֔ לְ/גַדֵּ֥ל וּ/לְ/חַזֵּ֖ק לַ/כֹּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/012.yaml
  text: Both riches and honor come from before you[a], and you rule over all. In your hand are power and might[c][b], and in your hand it is to make great and to strengthen all.
translation:
  language: pt
  text: Tanto as riquezas como a honra[b] vêm da tua presença[a], e tu dominas sobre tudo. Na tua mão estão a força e o poder, e está em tua mão engrandecer[c] e fortalecer a todos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “de diante de ti”; também pode ser traduzido por “vêm de ti”.
    reason: lexical_alternative
  - marker: b
    text: “Honra” também pode ser traduzida por “glória”.
    reason: lexical_alternative
  - marker: c
    text: “Engrandecer” também pode ter o sentido de “exaltar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֹשֶׁר
  choice: as riquezas
  rationale: O substantivo designa abundância material ou riqueza; o plural idiomático em português combina naturalmente com “a honra” no contexto elevado da oração.
- source_word: הַכָּבוֹד
  choice: a honra
  rationale: Neste contexto, indica dignidade, prestígio ou esplendor concedido por Deus. “Honra” forma um par natural com “riquezas”, sem excluir o sentido possível de “glória”.
- source_word: מִלְּפָנֶיךָ
  choice: vêm da tua presença
  rationale: A expressão significa literalmente “de diante da tua face”. A formulação escolhida preserva a imagem da presença divina e, ao mesmo tempo, soa natural em português.
- source_word: מוֹשֵׁל בַּכֹּל
  choice: dominas sobre tudo
  rationale: O particípio expressa governo contínuo. “Dominas sobre tudo” comunica soberania abrangente de modo claro e solene.
- source_word: בְיָדְךָ
  choice: na tua mão / em tua mão
  rationale: Mantém a metáfora concreta hebraica de posse, capacidade e controle, em vez de reduzi-la apenas à ideia abstrata de poder.
- source_word: כֹּחַ וּגְבוּרָה
  choice: a força e o poder
  rationale: Os dois substantivos semanticamente próximos são mantidos como termos distintos, expressando capacidade e poderio sem fundi-los.
- source_word: לְגַדֵּל
  choice: engrandecer
  rationale: Reproduz o sentido causativo de “tornar grande” e pode incluir a ideia de elevar ou exaltar alguém.
- source_word: לְחַזֵּק
  choice: fortalecer
  rationale: É a correspondência direta e natural para a ação de tornar forte ou dar firmeza.
- source_word: לַכֹּל
  choice: a todos
  rationale: No contexto de engrandecer e fortalecer, a referência pessoal é natural; “todos” ainda preserva a abrangência da expressão hebraica.
theological_decisions:
- issue: A relação de מִלְּפָנֶיךָ com a origem das riquezas e da honra
  choice: vêm da tua presença
  alternative: vêm de ti; vêm de diante de ti
  rationale: A tradução conserva a imagem hebraica da presença ou face de Deus, apresentando-o como a fonte das riquezas e da honra sem acrescentar uma explicação doutrinária.
- issue: O alcance de לַכֹּל
  choice: a todos
  alternative: a tudo
  rationale: O ato de engrandecer e fortalecer favorece uma referência a pessoas, mas o hebraico é amplo; a alternativa é registrada implicitamente na análise sem restringir a soberania divina mencionada na frase anterior.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “na tua mão/em tua mão” preserva o paralelismo e a metáfora hebraica; a leve variação preposicional evita rigidez sem alterar o sentido.
