base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/005.yaml
  text: gold for the things of gold[a], and silver for the things of silver, and for every kind of work by the hands of craftsmen. And who is willing to fill his hand today for Yahweh?
translation:
  language: pt
  text: ouro para os objetos de ouro, prata para os objetos de prata e para todo trabalho realizado pelas mãos dos artesãos. E quem se dispõe voluntariamente a encher a sua mão[a] hoje para Yahweh?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “encher a mão”. Este idioma hebraico pode referir-se à consagração ou à apresentação de uma oferta para o serviço sagrado.
    reason: A expressão literal não é transparente em português e admite mais de uma nuance cultual relevante.
lexical_decisions:
- source_word: לַזָּהָב לַזָּהָב
  choice: ouro para os objetos de ouro
  rationale: A repetição hebraica é elíptica e indica ouro destinado ao que seria feito de ouro. “Objetos” explicita apenas o elemento subentendido e mantém a estrutura paralela.
- source_word: וְלַכֶּסֶף לַכֶּסֶף
  choice: prata para os objetos de prata
  rationale: Mantém o paralelismo com a expressão referente ao ouro e comunica que a prata se destinava às peças feitas desse metal.
- source_word: וּלְכָל מְלָאכָה
  choice: e para todo trabalho
  rationale: מְלָאכָה abrange aqui o trabalho necessário ao projeto, sem exigir uma distinção mais estreita entre tarefa e obra artesanal.
- source_word: בְּיַד חָרָשִׁים
  choice: realizado pelas mãos dos artesãos
  rationale: Preserva a imagem hebraica da mão e expressa com clareza que o trabalho seria executado por profissionais habilidosos.
- source_word: וּמִי מִתְנַדֵּב
  choice: E quem se dispõe voluntariamente
  rationale: O hitpael de נדב expressa disposição espontânea ou oferecimento voluntário; a formulação portuguesa conserva o caráter retórico do apelo.
- source_word: לְמַלֹּאות יָדוֹ
  choice: a encher ... a mão
  rationale: Mantém literalmente o idioma cultual, sem decidir no texto principal se a ênfase recai sobre consagração pessoal, investidura ou apresentação de uma oferta; a nota esclarece a amplitude.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Equivalente temporal direto e natural em português atual.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: Reproduz o nome divino יהוה como nome próprio e conserva a direção do ato expressa pela preposição ל.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Sentido do idioma cultual לְמַלֹּאות יָדוֹ
  choice: manter “encher a mão” no texto e explicar em nota
  alternative: consagrar-se; apresentar uma oferta completa; dedicar a mão
  rationale: O idioma pode evocar consagração ou investidura e, neste contexto, a oferta voluntária para o serviço sagrado. A tradução literal preserva essa tensão em vez de fixar uma única interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O início fragmentário acompanha a continuação sintática do versículo anterior. A repetição referente ao ouro e à prata foi levemente explicitada; o idioma teologicamente significativo “encher a mão” foi preservado e anotado.
