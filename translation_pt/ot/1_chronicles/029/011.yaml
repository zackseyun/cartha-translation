  source_fidelity: A lista de atributos, a oração causal, a repetição enfática de pertencimento e a nota sobre נֵצַח refletem adequadamente o hebraico. Contudo, «tu te elevas» tende a comunicar uma ação reflexiva de autoexaltação. No contexto, o particípio מִתְנַשֵּׂא descreve Yahweh como aquele que está/existe exaltado, isto é, exaltado como cabeça sobre todos.
