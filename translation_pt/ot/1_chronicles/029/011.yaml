  text: לְ/ךָ֣ יְ֠הוָה הַ/גְּדֻלָּ֨ה וְ/הַ/גְּבוּרָ֤ה וְ/הַ/תִּפְאֶ֨רֶת֙ וְ/הַ/נֵּ֣צַח וְ/הַ/ה֔וֹד כִּי כֹ֖ל בַּ/שָּׁמַ֣יִם וּ/בָ/אָ֑רֶץ לְ/ךָ֤ יְהוָה֙ הַ/מַּמְלָכָ֔ה וְ/הַ/מִּתְנַשֵּׂ֖א לְ/כֹ֥ל לְ/רֹֽאשׁ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/011.yaml
  text: Yours[a], O Yahweh, are the greatness and the power and the splendor and the victory and the majesty, for everything in the heavens and on the earth is yours. Yours, O Yahweh, is the kingdom, and you are exalted as head over all.
translation:
  language: pt
  text: A ti, ó Yahweh, pertencem a grandeza, o poder, o esplendor, a vitória[a] e a majestade, pois tudo o que há nos céus e na terra é teu. Teu, ó Yahweh, é o reino, e tu és exaltado como cabeça sobre todos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a eternidade” ou “a preeminência”. Aqui, o hebraico נֵצַח pode indicar supremacia duradoura, além de vitória.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera diretamente o nome divino, de acordo com a evidência do texto hebraico e com a orientação do projeto.
- source_word: לְךָ
  choice: Teus / é teu / Teu
  rationale: Expressa pertencimento e preserva a repetição enfática do hebraico, com concordância natural em português.
- source_word: הַגְּדֻלָּה
  choice: a grandeza
  rationale: Equivalente direto e digno do substantivo abstrato hebraico.
- source_word: הַגְּבוּרָה
  choice: o poder
  rationale: Comunica força ou poder em linguagem moderna e se ajusta à série de atributos régios.
- source_word: הַתִּפְאֶרֶת
  choice: o esplendor
  rationale: Preserva o campo semântico de beleza, glória e magnificência sem se confundir com הוֹד.
- source_word: הַנֵּצַח
  choice: a vitória
  rationale: No contexto desta lista doxológica, comunica triunfo ou supremacia, enquanto a ambiguidade lexical é preservada em nota.
- source_word: הַהוֹד
  choice: a majestade
  rationale: Expressa dignidade, esplendor e honra em um contexto real.
- source_word: כִּי כֹל בַּשָּׁמַיִם וּבָאָרֶץ
  choice: pois tudo o que há nos céus e na terra
  rationale: Toma כִּי em sentido causal e explicita de modo natural em português o valor abrangente de כֹל.
- source_word: הַמַּמְלָכָה
  choice: o reino
  rationale: É a correspondência mais direta e corrente, abrangendo também a ideia de domínio régio.
- source_word: וְהַמִּתְנַשֵּׂא
  choice: e tu te elevas
  rationale: Mantém o valor reflexivo/formal do particípio hitpael e evita decidir além do necessário entre estado exaltado e ação de elevar-se.
- source_word: לְכֹל לְרֹאשׁ
  choice: como cabeça sobre todos
  rationale: Preserva a metáfora hebraica de cabeça, isto é, chefe ou autoridade suprema, e entende כֹל como referente abrangente pessoal/coletivo neste contexto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz o Tetragrama; a transliteração Yahweh preserva o nome próprio sem substituí-lo por um título.
- issue: Sentido de נֵצַח na série de louvor
  choice: vitória
  alternative: eternidade ou preeminência
  rationale: “Vitória” se ajusta à sequência de atributos de soberania, mas o alcance semântico do termo permanece discutido e é registrado em nota.
- issue: Valor de וְהַמִּתְנַשֵּׂא
  choice: tu te elevas
  alternative: tu és exaltado
  rationale: A forma hebraica permite uma expressão reflexiva ou de estado elevado; a tradução mantém a forma reflexiva sem excluir a ideia de supremacia.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com cadência doxológica. A repetição de “teu/teus” conserva a ênfase do original, e a enumeração mantém os artigos para clareza e dignidade.
