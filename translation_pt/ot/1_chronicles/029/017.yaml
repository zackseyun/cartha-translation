  text: וְ/יָדַ֣עְתִּי אֱלֹהַ֔/י כִּ֤י אַתָּה֙ בֹּחֵ֣ן לֵבָ֔ב וּ/מֵישָׁרִ֖ים תִּרְצֶ֑ה אֲנִ֗י בְּ/יֹ֤שֶׁר לְבָבִ/י֙ הִתְנַדַּ֣בְתִּי כָל אֵ֔לֶּה וְ/עַתָּ֗ה עַמְּ/ךָ֙ הַ/נִּמְצְאוּ פֹ֔ה רָאִ֥יתִי בְ/שִׂמְחָ֖ה לְ/הִֽתְנַדֶּב לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/017.yaml
  text: And I know[a], my God, that you test the heart and take pleasure in uprightness. I, in the uprightness of my heart, have willingly offered all these things[b], and now I have seen your people who are present here willingly offer to you with joy.
translation:
  language: pt
  text: Eu sei, meu Deus, que tu examinas o coração e te agradas da retidão.[a] Eu, com coração íntegro, ofereci voluntariamente todas estas coisas; e agora vi, com alegria, o teu povo que está aqui[b] fazer ofertas voluntárias a ti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tens prazer na integridade”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “que é encontrado aqui”, isto é, “que está presente aqui”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּחֵן לֵבָב
  choice: examinas o coração
  rationale: בֹּחֵן expressa exame ou prova avaliativa. “Examinas” é natural em português e preserva o sentido de sondar a pessoa interior, enquanto “coração” mantém a metáfora antropológica hebraica.
- source_word: וּמֵישָׁרִים תִּרְצֶה
  choice: te agradas da retidão
  rationale: מֵישָׁרִים designa retidão ou integridade, e תִּרְצֶה comunica agrado ou aceitação. A formulação preserva tanto a qualidade moral quanto a disposição favorável de Deus.
- source_word: בְּיֹשֶׁר לְבָבִי
  choice: com coração íntegro
  rationale: A expressão indica a disposição moral com que Davi ofertou. Esta tradução é corrente e digna, sem perder a referência explícita ao coração.
- source_word: הִתְנַדַּבְתִּי
  choice: ofereci voluntariamente
  rationale: O hitpael de נדב indica uma oferta feita de livre vontade; “ofereci voluntariamente” se ajusta ao contexto de doações.
- source_word: כָל אֵלֶּה
  choice: todas estas coisas
  rationale: O demonstrativo retoma os bens e ofertas mencionados no contexto; “coisas” explicita naturalmente o referente sem o restringir além do hebraico.
- source_word: עַמְּךָ הַנִּמְצְאוּ פֹה
  choice: o teu povo que está aqui
  rationale: O nifal de מצא pode significar literalmente “ser encontrado”, mas neste contexto tem o sentido idiomático de estar presente.
- source_word: רָאִיתִי בְשִׂמְחָה
  choice: vi, com alegria
  rationale: A locução preposicional descreve a alegria com que Davi contempla a ação do povo, preservando a ligação sintática mais direta.
- source_word: לְהִתְנַדֶּב לָךְ
  choice: oferecer voluntariamente a ti
  rationale: O infinitivo de נדב repete a ideia de oferta espontânea. A tradução mantém a correspondência lexical com a oferta voluntária de Davi.
- source_word: אֱלֹהַי
  choice: meu Deus
  rationale: Forma possessiva de tratamento, traduzida de modo direto e tradicional.
theological_decisions:
- issue: Sentido antropológico de לֵבָב
  choice: coração como centro da pessoa interior, incluindo vontade e intenção
  alternative: mente ou ser interior
  rationale: “Coração” conserva a metáfora hebraica e sua amplitude antropológica, sem reduzir o termo apenas ao pensamento ou às emoções.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Emprega “tu” em referência a Deus para acompanhar as formas de segunda pessoa do hebraico. O tom é reverente e claro; a repetição de “oferecer voluntariamente” reflete a repetição de נדב no original.
