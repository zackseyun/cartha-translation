  text: וַ/יְגַדֵּ֨ל יְהוָ֤ה אֶת שְׁלֹמֹה֙ לְ/מַ֔עְלָ/ה לְ/עֵינֵ֖י כָּל יִשְׂרָאֵ֑ל וַ/יִּתֵּ֤ן עָלָי/ו֙ ה֣וֹד מַלְכ֔וּת אֲ֠שֶׁר לֹֽא הָיָ֧ה עַל כָּל מֶ֛לֶךְ לְ/פָנָ֖י/ו עַל יִשְׂרָאֵֽל־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/025.yaml
  text: And Yahweh made Solomon exceedingly great in the sight of all Israel[a], and gave him royal majesty such as had not been on any king before him over Israel.
translation:
  language: pt
  text: Yahweh engrandeceu extraordinariamente Salomão diante de todo o Israel e lhe concedeu majestade real[a], como nenhum rei antes dele sobre Israel jamais tivera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esplendor régio” ou “majestade da realeza”.
    reason: Alternativas lexicais para הוֹד מַלְכוּת, expressão que reúne as ideias de esplendor ou majestade e de realeza.
lexical_decisions:
- source_word: וַיְגַדֵּל ... לְמַעְלָה
  choice: engrandeceu extraordinariamente
  rationale: O hifil de גדל tem sentido causativo, “tornar grande, engrandecer”, e לְמַעְלָה funciona aqui como intensificador. A expressão portuguesa conserva ambos os elementos com naturalidade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְעֵינֵי כָּל יִשְׂרָאֵל
  choice: diante de todo o Israel
  rationale: Reproduz de modo idiomático a ideia de algo público e reconhecido por toda a comunidade de Israel.
- source_word: וַיִּתֵּן עָלָיו
  choice: lhe concedeu
  rationale: O hebraico diz literalmente “deu sobre ele”; “lhe concedeu” comunica naturalmente a ideia de outorga.
- source_word: הוֹד מַלְכוּת
  choice: majestade real
  rationale: הוֹד expressa majestade, esplendor ou dignidade, enquanto מַלְכוּת delimita o âmbito régio.
- source_word: אֲשֶׁר לֹא הָיָה עַל כָּל מֶלֶךְ לְפָנָיו עַל יִשְׂרָאֵל
  choice: como nunca tivera nenhum rei que antes dele governara Israel
  rationale: Expressa em português corrente a comparação com todos os reis anteriores que reinaram sobre Israel, sem reproduzir de modo artificial o hebraico literal “não estivera sobre”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome próprio em vez de o substituir por um título.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Engrandeceu extraordinariamente” mantém a força causativa e intensiva do hebraico; a oração final foi reestruturada para evitar uma construção portuguesa ambígua ou artificial.
