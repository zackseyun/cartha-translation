id: 1CH.29.15
reference: 1 Chronicles 29:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי גֵרִ֨ים אֲנַ֧חְנוּ לְ/פָנֶ֛י/ךָ וְ/תוֹשָׁבִ֖ים כְּ/כָל אֲבֹתֵ֑י/נוּ כַּ/צֵּ֧ל יָמֵ֛י/נוּ עַל הָ/אָ֖רֶץ וְ/אֵ֥ין מִקְוֶֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/015.yaml
  text: For we are sojourners before you[a], and temporary residents, as all our fathers were. Our days on the earth are like a shadow[c][b], and there is no hope.
translation:
  language: pt
  text: Pois somos estrangeiros diante de ti[a] e residentes temporários[b], como todos os nossos antepassados. Nossos dias sobre a terra são como a sombra, e não há esperança[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “forasteiros na tua presença”.
    reason: lexical_alternative
  - marker: b
    text: Ou “moradores sem residência permanente”.
    reason: lexical_alternative
  - marker: c
    text: Neste contexto, “não há esperança” se refere à brevidade da vida humana na terra; não é uma negação absoluta da esperança em Deus.
    reason: cross_reference
lexical_decisions:
- source_word: גֵרִים
  choice: estrangeiros
  rationale: O termo designa pessoas que vivem numa terra sem possuir plena condição nativa. “Estrangeiros” é claro no português atual e preserva a condição social expressa pelo hebraico.
- source_word: לְפָנֶיךָ
  choice: diante de ti
  rationale: Reproduz de modo natural a expressão hebraica literalmente ligada à presença ou face de Deus e mantém a orientação da oração a ele.
- source_word: תוֹשָׁבִים
  choice: residentes temporários
  rationale: Expressa pessoas que habitam num lugar sem permanência ou pleno pertencimento, mantendo o paralelismo com גֵרִים.
- source_word: כְּכָל אֲבֹתֵינוּ
  choice: como todos os nossos antepassados
  rationale: “Antepassados” comunica no português corrente o sentido coletivo de gerações anteriores, sem sugerir apenas os pais imediatos.
- source_word: כַּצֵּל
  choice: como a sombra
  rationale: Conserva a metáfora bíblica da brevidade e transitoriedade da vida.
- source_word: יָמֵינוּ עַל הָאָרֶץ
  choice: nossos dias sobre a terra
  rationale: Tradução direta e natural da expressão temporal e espacial.
- source_word: וְאֵין מִקְוֶה
  choice: e não há esperança
  rationale: מִקְוֶה pode indicar esperança ou expectativa. A formulação direta preserva a força e a tensão do hebraico, enquanto a nota esclarece seu alcance contextual sem alterar o texto.
theological_decisions:
- issue: Sentido de וְאֵין מִקְוֶה no contexto da mortalidade humana
  choice: “e não há esperança”, preservando a afirmação categórica do hebraico
  alternative: “e não há expectativa” ou “e não há esperança duradoura”
  rationale: O contexto enfatiza a transitoriedade da vida humana na terra. Acrescentar “duradoura” ao texto resolveria interpretativamente uma tensão que o hebraico deixa aberta; por isso, a tradução mantém a formulação e oferece esclarecimento contextual em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “ti” em concordância com a tradição de tratamento direto a Deus, sem arcaísmos sintáticos. Mantém a metáfora da sombra e a tensão da frase final.
