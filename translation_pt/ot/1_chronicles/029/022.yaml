  text: וַ/יֹּאכְל֨וּ וַ/יִּשְׁתּ֜וּ לִ/פְנֵ֧י יְהוָ֛ה בַּ/יּ֥וֹם הַ/ה֖וּא בְּ/שִׂמְחָ֣ה גְדוֹלָ֑ה וַ/יַּמְלִ֤יכוּ שֵׁנִית֙ לִ/שְׁלֹמֹ֣ה בֶן דָּוִ֔יד וַ/יִּמְשְׁח֧וּ לַ/יהוָ֛ה לְ/נָגִ֥יד וּ/לְ/צָד֖וֹק לְ/כֹהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/022.yaml
  text: And they ate and drank before Yahweh on that day with great joy[a], and they made Solomon son of David king a second time, and they anointed him for Yahweh as ruler[d][c][b], and Zadok as priest.
translation:
  language: pt
  text: Naquele dia, comeram e beberam diante de Yahweh[a] com grande alegria. Pela segunda vez[b], fizeram rei Salomão, filho de Davi, e o ungiram para Yahweh[c] como governante[d], e ungiram Zadoque como sacerdote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na presença de Yahweh”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “novamente”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “diante de Yahweh”. O hebraico pode indicar dedicação a Yahweh ou uma ação realizada em sua presença.'
    reason: alternative_reading
  - marker: d
    text: “Governante” traduz o hebraico nagid, que também pode ser vertido como “líder” ou, em certos contextos, “príncipe”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: A expressão denota estar diante ou na presença de Yahweh; “diante de” é natural em português e preserva o contexto cultual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּשִׂמְחָה גְדוֹלָה
  choice: com grande alegria
  rationale: Expressa de modo idiomático a circunstância ou maneira da celebração.
- source_word: וַיַּמְלִיכוּ
  choice: fizeram rei
  rationale: O hifil de מלך significa fazer reinar ou constituir rei; evita acrescentar uma coroação não explicitada.
- source_word: שֵׁנִית
  choice: pela segunda vez
  rationale: Mantém a indicação explícita de repetição específica, mais precisa que simplesmente “novamente”.
- source_word: וַיִּמְשְׁחוּ
  choice: ungiram
  rationale: É o termo tradicional e direto para a unção ritual ligada à instalação régia e sacerdotal.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: Preserva a relação, dedicação ou serviço a Yahweh indicada pelo ל, sem restringir a frase a uma única interpretação.
- source_word: לְנָגִיד
  choice: como governante
  rationale: נָגִיד designa quem exerce liderança ou autoridade; “governante” é claro e evita a possível ideia dinástica de “príncipe”.
- source_word: לְכֹהֵן
  choice: como sacerdote
  rationale: Expressa diretamente o ofício sacerdotal e acompanha a estrutura da nomeação de Salomão.
- source_word: בֶן דָּוִיד
  choice: filho de Davi
  rationale: Mantém a identificação filial e dinástica do texto hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome divino; “Yahweh” conserva sua forma como nome pessoal em vez de substituí-lo por um título.
- issue: Sentido de לַיהוָה na cláusula da unção
  choice: ungiram-no para Yahweh
  alternative: ungiram-no diante de Yahweh; ungiram-no a Yahweh
  rationale: O hebraico admite relação ou dedicação a Yahweh e também pode ser entendido em sentido locativo ou cerimonial. A tradução principal preserva a ideia de designação para Yahweh, e a nota registra a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluidez, sem perder as relações sintáticas. A repetição de “ungiram” antes de Zadoque explicita em português a elipse coordenada do hebraico.
