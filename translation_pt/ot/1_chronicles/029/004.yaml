  text: שְׁלֹ֧שֶׁת אֲלָפִ֛ים כִּכְּרֵ֥י זָהָ֖ב מִ/זְּהַ֣ב אוֹפִ֑יר וְ/שִׁבְעַ֨ת אֲלָפִ֤ים כִּכַּר כֶּ֨סֶף֙ מְזֻקָּ֔ק לָ/ט֖וּחַ קִיר֥וֹת הַ/בָּתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/004.yaml
  text: three thousand talents of gold[a], from the gold of Ophir, and seven thousand talents of refined silver, to overlay the walls of the buildings[b],
translation:
  language: pt
  text: três mil talentos de ouro, do ouro de Ofir[a], e sete mil talentos[b] de prata refinada, para revestir as paredes dos edifícios,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica pode indicar ouro proveniente de Ofir ou descrever sua qualidade como “ouro de Ofir”.
    reason: lexical_alternative
  - marker: b
    text: “Talento” é uma antiga unidade de peso, não uma aptidão ou habilidade.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: três mil
  rationale: Reprodução direta e natural da expressão numérica cardinal.
- source_word: כִּכְּרֵי / כִּכַּר
  choice: talentos
  rationale: O termo designa uma grande unidade antiga de peso. “Talentos” é a forma tradicional em português e evita uma conversão moderna imprecisa.
- source_word: זָהָב
  choice: ouro
  rationale: Equivalente direto do nome do metal.
- source_word: מִזְּהַב אוֹפִיר
  choice: do ouro de Ofir
  rationale: Mantém a preposição hebraica e a repetição de “ouro”, permitindo entender Ofir como procedência do metal sem eliminar a possível leitura qualificativa.
- source_word: וְשִׁבְעַת אֲלָפִים
  choice: e sete mil
  rationale: Tradução direta da expressão numérica, com a conjunção preservada.
- source_word: כֶּסֶף
  choice: prata
  rationale: Neste contexto, o termo se refere ao metal precioso, não a dinheiro.
- source_word: מְזֻקָּק
  choice: refinada
  rationale: O particípio passivo descreve prata submetida a refino; a forma concorda naturalmente com “prata” em português.
- source_word: לָטוּחַ
  choice: para revestir
  rationale: No contexto da aplicação de metais preciosos às paredes, “revestir” comunica a cobertura de uma superfície sem sugerir reboco de argamassa.
- source_word: קִירוֹת
  choice: as paredes
  rationale: Equivalente corrente do substantivo plural em construção com o termo seguinte.
- source_word: הַבָּתִּים
  choice: os edifícios
  rationale: Embora o termo possa significar literalmente “as casas”, no contexto do complexo do templo “os edifícios” expressa melhor as estruturas arquitetônicas sem restringi-las a moradias.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição “ouro, do ouro de Ofir” foi mantida por corresponder à formulação hebraica. A vírgula final preserva o caráter de continuação do versículo dentro da frase iniciada no contexto anterior.
