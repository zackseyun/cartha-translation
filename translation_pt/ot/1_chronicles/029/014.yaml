review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz bem a pergunta retórica, a capacidade de fazer uma oferta voluntária, a origem divina de tudo e o ato de dar a Deus. Contudo, «próprias» não tem correspondente explícito no hebraico e acrescenta uma ênfase desnecessária; além disso, o hebraico está no singular, «da tua mão».
  naturalness: O texto tem registro digno, claro e amplamente compreensível. «Da tua mão te demos» é natural em registro bíblico-literário e preserva a imagem hebraica sem a construção enfática «foi das tuas próprias mãos».
  terminology: «Contribuir voluntariamente» comunica adequadamente o caráter de oferta espontânea no contexto. A nota deve manter o sentido de capacidade/força sem introduzir uma forma verbal passada que não corresponde bem à construção do texto.
  issues:
  - severity: medium
    issue: «das tuas próprias mãos» acrescenta «próprias» e pluraliza «mão».
    rationale: O texto hebraico diz literalmente «da tua mão» (singular), sem o intensificador «próprias». A imagem de provisão divina é preservada de modo mais fiel por «da tua mão».
  - severity: low
    issue: A nota usa «retivéssemos força».
    rationale: Embora reflita a imagem lexical de reter/conservar força, a forma no passado é pouco apropriada ao sentido da construção. «Tenhamos força» mantém melhor a capacidade expressa no contexto.
