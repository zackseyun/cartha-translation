  text: וְ/כִ֨י מִ֤י אֲנִי֙ וּ/מִ֣י עַמִּ֔/י כִּֽי נַעְצֹ֣ר כֹּ֔חַ לְ/הִתְנַדֵּ֖ב כָּ/זֹ֑את כִּֽי מִמְּ/ךָ֣ הַ/כֹּ֔ל וּ/מִ/יָּדְ/ךָ֖ נָתַ֥נּוּ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/014.yaml
  text: But who am I[a], and who are my people, that we should be able to offer willingly like this? For everything comes from you, and from your hand we have given to you.
translation:
  language: pt
  text: Mas quem sou eu, e quem é o meu povo, para que tenhamos condições de contribuir voluntariamente dessa maneira?[a] Pois tudo vem de ti, e da tua mão te demos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “para que tenhamos força para contribuir voluntariamente assim?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Mas
  rationale: Introduz naturalmente o contraste humilde e a retomada retórica na oração de Davi.
- source_word: מִי אֲנִי וּמִי עַמִּי
  choice: quem sou eu, e quem é o meu povo
  rationale: Preserva a pergunta retórica sobre condição e dignidade, com as cópulas necessárias em português.
- source_word: נַעְצֹר כֹּחַ
  choice: tenhamos condições
  rationale: Expressa o sentido idiomático de possuir capacidade ou recursos, evitando uma tradução literal obscura de 'reter força'.
- source_word: לְהִתְנַדֵּב
  choice: contribuir voluntariamente
  rationale: Comunica tanto a oferta concreta no contexto quanto seu caráter espontâneo, sem impor terminologia cultual técnica.
- source_word: כָּזֹאת
  choice: dessa maneira
  rationale: Retoma de modo natural a extraordinária generosidade descrita no contexto.
- source_word: מִמְּךָ הַכֹּל
  choice: tudo vem de ti
  rationale: Declara com clareza que Deus é a fonte de tudo, mantendo concisão e dignidade.
- source_word: וּמִיָּדְךָ
  choice: das tuas próprias mãos
  rationale: Conserva a imagem hebraica da mão como fonte e provisão; 'próprias' torna enfática e natural a relação com a dádiva devolvida.
- source_word: נָתַנּוּ לָךְ
  choice: te demos
  rationale: Reproduz diretamente o ato concluído de dar a Deus, com ordem idiomática em português.
theological_decisions:
- issue: Propriedade divina e contribuição humana
  choice: A contribuição do povo procede daquilo que primeiro recebeu das mãos de Deus.
  alternative: Explicitar interpretativamente que o povo apenas devolve a Deus o que já lhe pertence.
  rationale: O hebraico afirma a origem divina de tudo e da própria oferta, mas não formula explicitamente a expansão 'apenas devolvemos o que é teu'; a tradução preserva a afirmação sem acrescentá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa singular coerentes com o tratamento tradicional de Deus. 'Contribuir voluntariamente' é natural no contexto de doações e preserva a voluntariedade do hebraico.
