  text: וַֽ/יִּתְּנ֞וּ לַ/עֲבוֹדַ֣ת בֵּית הָ/אֱלֹהִ֗ים זָהָ֞ב כִּכָּרִ֣ים חֲמֵֽשֶׁת אֲלָפִים֮ וַ/אֲדַרְכֹנִ֣ים רִבּוֹ֒ וְ/כֶ֗סֶף כִּכָּרִים֙ עֲשֶׂ֣רֶת אֲלָפִ֔ים וּ/נְחֹ֕שֶׁת רִבּ֛וֹ וּ/שְׁמוֹנַ֥ת אֲלָפִ֖ים כִּכָּרִ֑ים וּ/בַרְזֶ֖ל מֵֽאָה אֶ֥לֶף כִּכָּרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/007.yaml
  text: And they gave for the service of the house of God five thousand talents of gold and ten thousand darics[a], and ten thousand talents of silver, and eighteen thousand talents of bronze[c][b], and one hundred thousand talents of iron.
translation:
  language: pt
  text: E deram para o serviço da casa de Deus cinco mil talentos de ouro e dez mil dáricos[a], dez mil talentos de prata, dezoito mil talentos de bronze e cem mil talentos de ferro.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O dárico era uma moeda persa de ouro.
    reason: cultural_note
  - marker: b
    text: O talento era uma grande unidade antiga de peso, não “talento” no sentido moderno de aptidão.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: E deram
  rationale: Traduz de modo direto a ação narrativa concluída; “contribuíram” seria possível, mas um pouco mais interpretativo.
- source_word: לַעֲבוֹדַת בֵּית הָאֱלֹהִים
  choice: para o serviço da casa de Deus
  rationale: Preserva a amplitude de עֲבוֹדָה, que pode envolver trabalho e serviço, e mantém a expressão hebraica “casa de Deus” sem substituí-la por “templo”.
- source_word: כִּכָּרִים
  choice: talentos
  rationale: Emprega o termo tradicional para a grande unidade antiga de peso, esclarecido em nota para evitar o sentido moderno de aptidão.
- source_word: אֲדַרְכֹנִים
  choice: dáricos
  rationale: Mantém a identificação histórica específica da moeda persa, em vez de generalizá-la como “moedas de ouro”.
- source_word: רִבּוֹ וּשְׁמוֹנַת אֲלָפִים
  choice: dezoito mil
  rationale: 'Expressa naturalmente em português a soma indicada pela construção hebraica: dez mil mais oito mil.'
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: O termo pode designar cobre ou bronze; “bronze” é a tradução convencional e provável neste contexto de metais destinados à casa de Deus.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do hebraico sem artificialidade. A enumeração foi pontuada para leitura fluida. “Casa de Deus” preserva a formulação da fonte, e os termos históricos “talento” e “dárico” são explicados em notas.
