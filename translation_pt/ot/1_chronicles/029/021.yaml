  text: וַ/יִּזְבְּח֣וּ לַ/יהוָ֣ה זְ֠בָחִים וַ/יַּעֲל֨וּ עֹל֜וֹת לַ/יהוָ֗ה לְֽ/מָחֳרַת֮ הַ/יּ֣וֹם הַ/הוּא֒ פָּרִ֨ים אֶ֜לֶף אֵילִ֥ים אֶ֛לֶף כְּבָשִׂ֥ים אֶ֖לֶף וְ/נִסְכֵּי/הֶ֑ם וּ/זְבָחִ֥ים לָ/רֹ֖ב לְ/כָל יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/021.yaml
  text: 'They sacrificed sacrifices to Yahweh and offered up burnt offerings to Yahweh on the next day after that day: one thousand bulls[a], one thousand rams, one thousand lambs, and their drink offerings[c][b], and sacrifices in abundance for all Israel.'
translation:
  language: pt
  text: No dia seguinte[a], ofereceram sacrifícios a Yahweh e apresentaram a Yahweh, como holocaustos, mil touros, mil carneiros e mil cordeiros, com as suas ofertas de libação[b]. Também ofereceram sacrifícios em abundância para todo o Israel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “no dia posterior àquele dia”.
    reason: lexical_alternative
  - marker: b
    text: As ofertas de libação eram ofertas líquidas derramadas junto com os sacrifícios de animais.
    reason: cultural_note
  - marker: c
    text: Ou “em favor de todo o Israel”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְבְּחוּ ... זְבָחִים
  choice: ofereceram sacrifícios
  rationale: A combinação cognata hebraica descreve o abate e a oferta cultual. Em português, “ofereceram sacrifícios” comunica o sentido com naturalidade, sem a redundância pouco idiomática de “sacrificaram sacrifícios”.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição indica que as ofertas eram dirigidas ou dedicadas a Yahweh; o nome divino é transliterado em vez de ser substituído por um título.
- source_word: עֹלוֹת
  choice: holocaustos
  rationale: Termo cultual tradicional e preciso para sacrifícios inteiramente queimados no altar; evita confundi-los com os demais sacrifícios mencionados no versículo.
- source_word: לְמָחֳרַת הַיּוֹם הַהוּא
  choice: No dia seguinte
  rationale: Expressa de modo natural o valor temporal da frase hebraica, literalmente “no dia posterior àquele dia”, sem perder a sequência narrativa.
- source_word: פָּרִים אֶלֶף
  choice: mil novilhos
  rationale: פָּרִים designa bovinos machos empregados em sacrifício. “Novilhos” é uma designação cultual corrente e mais específica em português bíblico do que o genérico “bois”.
- source_word: אֵילִים אֶלֶף
  choice: mil carneiros
  rationale: אֵילִים refere-se especificamente a machos adultos do rebanho ovino.
- source_word: כְּבָשִׂים אֶלֶף
  choice: mil cordeiros
  rationale: No contexto sacrificial, כְּבָשִׂים designa cordeiros ou ovinos jovens; “cordeiros” é claro e convencional.
- source_word: וְנִסְכֵּיהֶם
  choice: com as respectivas ofertas de libação
  rationale: נסכים são ofertas líquidas derramadas que acompanhavam os animais. “Respectivas” torna explícita a referência do sufixo hebraico a cada grupo de holocaustos, e a nota explica “libação”.
- source_word: וּזְבָחִים לָרֹב
  choice: Também ofereceram sacrifícios em abundância
  rationale: A frase distingue os numerosos sacrifícios adicionais dos holocaustos enumerados. A divisão em nova oração preserva essa distinção e melhora a clareza.
- source_word: לְכָל יִשְׂרָאֵל
  choice: por todo o Israel
  rationale: Mantém o sentido amplo da preposição ל sem decidir se os sacrifícios eram representativos, destinados ao povo ou feitos em seu benefício.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino. “Yahweh” o preserva de forma reconhecível, sem substituí-lo por um título.
- issue: Alcance de לְכָל יִשְׂרָאֵל
  choice: por todo o Israel
  alternative: em favor de todo o Israel; em nome de todo o Israel
  rationale: “Por” conserva a amplitude e certa ambiguidade do hebraico, sem impor uma teoria específica de representação ou expiação.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. A sintaxe foi dividida em duas frases para distinguir os holocaustos enumerados dos numerosos sacrifícios adicionais. Mantiveram-se os termos cultuais “holocaustos” e “ofertas de libação”, sendo o segundo esclarecido em nota.
