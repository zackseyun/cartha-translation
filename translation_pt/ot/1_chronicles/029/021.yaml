revisions:
- from: No dia seguinte[a], ofereceram sacrifícios a Yahweh e apresentaram a Yahweh como holocaustos mil novilhos, mil carneiros e mil cordeiros, com as respectivas ofertas de libação[b]. Também ofereceram sacrifícios em abundância por todo o Israel[c].
  to: No dia seguinte[a], ofereceram sacrifícios a Yahweh e apresentaram a Yahweh, como holocaustos, mil touros, mil carneiros e mil cordeiros, com as suas ofertas de libação[b]. Também ofereceram sacrifícios em abundância para todo o Israel[c].
  rationale: A revisão substitui “novilhos” por “touros”, evita o sentido geográfico introduzido por “por todo o Israel” e reduz uma explicitação desnecessária em “respectivas”. Mantém a ordem narrativa, a distinção entre sacrifícios e holocaustos, os números e a ambiguidade moderada do escopo indicado por לְכָל יִשְׂרָאֵל.
