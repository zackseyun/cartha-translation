  text: וּֽ/כְ/כָל כֹּחִ֞/י הֲכִינ֣וֹתִי לְ/בֵית אֱלֹהַ֗/י הַ/זָּהָ֣ב לַ֠/זָּהָב וְ/הַ/כֶּ֨סֶף לַ/כֶּ֜סֶף וְ/הַ/נְּחֹ֣שֶׁת לַ/נְּחֹ֗שֶׁת הַ/בַּרְזֶל֙ לַ/בַּרְזֶ֔ל וְ/הָ/עֵצִ֖ים לָ/עֵצִ֑ים אַבְנֵי שֹׁ֨הַם וּ/מִלּוּאִ֜ים אַבְנֵי פ֣וּךְ וְ/רִקְמָ֗ה וְ/כֹ֨ל אֶ֧בֶן יְקָרָ֛ה וְ/אַבְנֵי שַׁ֖יִשׁ לָ/רֹֽב־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/002.yaml
  text: 'And with all my strength I have prepared for the house of my God: the gold for the things of gold[a], and the silver for the things of silver, and the bronze for the things of bronze, the iron for the things of iron, and the wood for the things of wood; onyx stones, settings, stones of antimony, variegated stones, every precious stone[d][c][b], and marble stones in abundance.'
translation:
  language: pt
  text: E, com todas as minhas forças, preparei para a casa do meu Deus o ouro para o que será feito de ouro, a prata para o que será feito de prata, o bronze para o que será feito de bronze, o ferro para o que será feito de ferro e a madeira para o que será feito de madeira; pedras de ônix[a], engastes[b], pedras de antimônio[c], pedras multicolores[d], toda pedra preciosa e pedras de mármore em abundância.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A identificação exata de algumas pedras deste versículo é incerta. “Ônix”, para שֹׁהַם, e “mármore”, para שַׁיִשׁ, seguem traduções tradicionais, embora outras identificações tenham sido propostas.
    reason: lexical_alternative
  - marker: b
    text: Ou, possivelmente, “montagens”, “incrustações” ou “pedras para engaste” (מִלּוּאִים).
    reason: lexical_alternative
  - marker: c
    text: A expressão traduzida como “pedras de antimônio” (אַבְנֵי פוּךְ) é difícil; pode referir-se a pedras associadas a pigmento escuro, a incrustações decorativas ou a outro material ornamental.
    reason: lexical_alternative
  - marker: d
    text: “Pedras multicolores” traduz רִקְמָה à luz da lista de pedras e materiais de construção; em outros contextos, a palavra pode designar trabalho bordado ou ricamente ornamentado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְכָל־כֹּחִי
  choice: E, com todas as minhas forças
  rationale: כֹּחַ pode indicar força ou capacidade. A expressão portuguesa comunica o empenho total de Davi e mantém a intensidade pessoal do hebraico.
- source_word: הֲכִינוֹתִי
  choice: preparei
  rationale: O perfeito hebraico apresenta a preparação como realizada. O pretérito perfeito é direto e natural no discurso em português.
- source_word: לְבֵית אֱלֹהַי
  choice: para a casa do meu Deus
  rationale: Preserva a expressão concreta e devocional do hebraico sem substituí-la pela interpretação contextual “templo”.
- source_word: הַזָּהָב לַזָּהָב ... וְהָעֵצִים לָעֵצִים
  choice: o ouro para o que será feito de ouro ... e a madeira para o que será feito de madeira
  rationale: A repetição hebraica designa cada material para os objetos correspondentes. A formulação explicita em português o sentido elíptico, preservando o paralelismo.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: O termo pode indicar cobre ou bronze; “bronze” é a designação tradicional e contextualmente adequada para objetos trabalhados do santuário.
- source_word: אַבְנֵי שֹׁהַם
  choice: pedras de ônix
  rationale: “Ônix” segue a identificação tradicional, embora a espécie mineral exata permaneça incerta, o que é registrado em nota.
- source_word: וּמִלּוּאִים
  choice: engastes
  rationale: O termo se relaciona a enchimento, incrustação ou montagem de pedras. “Engastes” é conciso e adequado ao contexto ornamental, sem ocultar outras possibilidades.
- source_word: אַבְנֵי פוּךְ
  choice: pedras de antimônio
  rationale: פּוּךְ normalmente designa antimônio ou pigmento mineral escuro. A tradução permanece próxima da construção hebraica e deixa a dificuldade de identificação para a nota.
- source_word: וְרִקְמָה
  choice: pedras multicolores
  rationale: רִקְמָה pode denotar trabalho variado, bordado ou ricamente colorido. No contexto de pedras e materiais de construção, “pedras multicolores” expressa a leitura contextual provável.
- source_word: וְאַבְנֵי שַׁיִשׁ לָרֹב
  choice: e pedras de mármore em abundância
  rationale: “Mármore” conserva a identificação tradicional de שַׁיִשׁ, e לָרֹב é vertido naturalmente como “em abundância”.
