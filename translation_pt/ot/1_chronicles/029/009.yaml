  text: וַ/יִּשְׂמְח֤וּ הָ/עָם֙ עַל הִֽתְנַדְּבָ֔/ם כִּ֚י בְּ/לֵ֣ב שָׁלֵ֔ם הִֽתְנַדְּב֖וּ לַ/יהוָ֑ה וְ/גַם֙ דָּוִ֣יד הַ/מֶּ֔לֶךְ שָׂמַ֖ח שִׂמְחָ֥ה גְדוֹלָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/009.yaml
  text: Then the people rejoiced because they had offered willingly[a], for with a whole heart they had offered willingly to Yahweh[b]; and David the king also rejoiced with great joy.
translation:
  language: pt
  text: Então o povo se alegrou por terem ofertado voluntariamente[a], pois haviam ofertado voluntariamente a Yahweh de todo o coração[b]; e também o rei Davi se alegrou com grande alegria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por causa de sua oferta voluntária”. O verbo hebraico enfatiza que a oferta foi feita livremente e de boa vontade.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “de todo o coração”, expressão que indica sinceridade, integridade ou dedicação não dividida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ הָעָם
  choice: Então o povo se alegrou
  rationale: Emprega uma forma narrativa corrente para o wayyiqtol e mantém עָם como o coletivo “o povo”, com concordância singular natural em português.
- source_word: עַל הִתְנַדְּבָם
  choice: porque tinha ofertado voluntariamente
  rationale: 'Expressa a causa da alegria e conserva o sentido do hitpael de נדב: contribuir ou ofertar por livre disposição, no contexto das dádivas para o templo.'
- source_word: כִּי
  choice: pois
  rationale: Mantém a relação explicativa com a oração anterior.
- source_word: בְּלֵב שָׁלֵם
  choice: de coração inteiro
  rationale: Preserva a imagem concreta do hebraico e a ideia de sinceridade, integridade e devoção não dividida.
- source_word: הִתְנַדְּבוּ
  choice: tinha ofertado voluntariamente
  rationale: Repete a mesma formulação usada para a ocorrência anterior da raiz נדב, refletindo a repetição enfática do texto hebraico.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino יהוה, preservando-o como nome próprio da aliança.
- source_word: וְגַם דָּוִיד הַמֶּלֶךְ
  choice: também o rei Davi
  rationale: Comunica a ideia aditiva de וְגַם em ordem natural no português moderno.
- source_word: שָׂמַח שִׂמְחָה גְדוֹלָה
  choice: se alegrou com grande alegria
  rationale: Conserva, em português compreensível, a ênfase do acusativo cognato hebraico e a repetição da raiz de alegria.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama; “Yahweh” preserva o nome próprio sem substituí-lo por um título.
- issue: Sentido de בְּלֵב שָׁלֵם
  choice: de coração inteiro
  alternative: de todo o coração; com coração íntegro
  rationale: A formulação escolhida mantém a metáfora hebraica e deixa presentes tanto a sinceridade quanto a noção de lealdade não dividida, sem reduzir a expressão a uma interpretação única.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A repetição de “ofertado voluntariamente” e a expressão “com grande alegria” foram mantidas deliberadamente para refletir as repetições enfáticas do hebraico.
