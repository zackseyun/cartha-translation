revisions:
- from: Então o povo se alegrou porque tinha ofertado voluntariamente[a], pois, de coração inteiro[b], tinha ofertado voluntariamente a Yahweh; também o rei Davi se alegrou com grande alegria.
  to: Então o povo se alegrou por terem ofertado voluntariamente[a], pois haviam ofertado voluntariamente a Yahweh de todo o coração[b]; e também o rei Davi se alegrou com grande alegria.
  rationale: A revisão é estilística e idiomática. Substitui «de coração inteiro» por «de todo o coração» e ajusta a primeira oração causal para uma construção mais natural com o coletivo «o povo». Mantêm-se a repetição deliberada de «ofertado voluntariamente», o nome Yahweh, a ordem dos sentidos e as duas âncoras de nota.
