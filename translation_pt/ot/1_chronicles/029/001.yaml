base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/001.yaml
  text: Then King David said to all the assembly, “Solomon my son, the one God has chosen, is young and inexperienced, and the work is great; for the palace is not for man, but for the LORD God.”
translation:
  language: pt
  text: 'Então o rei Davi disse a toda a assembleia: “Meu filho Salomão, aquele que Deus escolheu, é jovem e inexperiente, e a obra é grandiosa, pois o palácio não é para um ser humano, mas para o SENHOR Deus.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַקָּהָל
  choice: a assembleia
  rationale: Representa de modo natural e preciso a reunião pública convocada, sem restringi-la a uma congregação religiosa moderna.
- source_word: אֶחָד בָּחַר בּוֹ אֱלֹהִים
  choice: aquele que Deus escolheu
  rationale: Entende אֶחָד em função individualizadora, em consonância com o contexto e com a ordem hebraica incomum, sem introduzir a ideia mais forte de que somente Salomão foi escolhido.
- source_word: נַעַר וָרָךְ
  choice: jovem e inexperiente
  rationale: Transmite a juventude e a falta de preparo ou experiência sugerida por רַךְ neste contexto, em português corrente.
- source_word: הַמְּלָאכָה גְדוֹלָה
  choice: a obra é grandiosa
  rationale: Mantém a referência ao empreendimento de construção e a sua grande magnitude e importância.
- source_word: הַבִּירָה
  choice: o palácio
  rationale: Preserva o termo raro usado aqui para a edificação destinada a Deus; no contexto, designa o templo concebido como palácio divino.
- source_word: לַיהוָה אֱלֹהִים
  choice: para o SENHOR Deus
  rationale: Segue a convenção portuguesa tradicional de representar o Tetragrama por SENHOR em versaletes, mantendo também אֱלֹהִים.
theological_decisions:
- issue: Alcance de אֶחָד na escolha de Salomão
  choice: aquele que Deus escolheu
  alternative: o único que Deus escolheu
  rationale: A formulação escolhida identifica Salomão como o escolhido sem afirmar exclusividade de maneira mais explícita do que o hebraico exige.
- issue: Natureza da edificação chamada הַבִּירָה
  choice: palácio
  alternative: templo
  rationale: “Palácio” conserva a metáfora teológica do edifício como residência régia de Deus, enquanto “templo” explicitaria o referente e apagaria a escolha lexical do texto.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluente e vocabulário de ampla compreensão no Brasil e no mundo lusófono. A fala direta e o contraste final do hebraico foram preservados.
