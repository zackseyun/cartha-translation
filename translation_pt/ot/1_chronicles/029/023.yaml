source:
  edition: WLC
  text: וַ/יֵּ֣שֶׁב שְׁ֠לֹמֹה עַל כִּסֵּ֨א יְהוָ֧ה לְ/מֶ֛לֶךְ תַּֽחַת דָּוִ֥יד אָבִ֖י/ו וַ/יַּצְלַ֑ח וַ/יִּשְׁמְע֥וּ אֵלָ֖י/ו כָּל יִשְׂרָאֵֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/023.yaml
  text: Then Solomon sat on the throne of Yahweh as king in place of David his father[a], and he prospered, and all Israel listened to him.
translation:
  language: pt
  text: Então Salomão se assentou no trono de Yahweh como rei, no lugar de Davi, seu pai. Ele prosperou, e todo o Israel lhe deu ouvidos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lhe obedeceu”. Neste contexto régio, a expressão hebraica indica não apenas ouvir com atenção, mas também acatar a autoridade do rei.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: se assentou
  rationale: Preserva a imagem concreta do hebraico, que, acompanhada de “no trono”, comunica naturalmente a entronização sem substituir o verbo por uma explicação.
- source_word: כִּסֵּא יְהוָה
  choice: o trono de Yahweh
  rationale: Mantém a construção hebraica e sua afirmação de que a realeza davídica era exercida sob o governo divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: לְמֶלֶךְ
  choice: como rei
  rationale: Expressa de modo idiomático a função ou o cargo indicado pela preposição ל.
- source_word: תַּחַת דָּוִיד אָבִיו
  choice: no lugar de Davi, seu pai
  rationale: Em contexto de sucessão dinástica, תַּחַת indica substituição, não apenas posterioridade temporal.
- source_word: וַיַּצְלַח
  choice: prosperou
  rationale: Transmite de forma concisa a ideia de obter êxito ou avançar com sucesso, sem explicitar uma causa que o texto não declara nesta frase.
- source_word: וַיִּשְׁמְעוּ אֵלָיו
  choice: lhe deu ouvidos
  rationale: A expressão portuguesa preserva o sentido básico de ouvir com atenção e, no contexto da resposta de Israel ao rei, admite a implicação de acatamento e obediência.
- source_word: כָּל יִשְׂרָאֵל
  choice: todo o Israel
  rationale: É a forma coletiva corrente para a nação inteira e não exige expansão.
theological_decisions:
- issue: Sentido de “o trono de Yahweh” em relação ao reinado de Salomão
  choice: Manter literalmente “o trono de Yahweh”, preservando a apresentação do reinado de Salomão como exercido sob a autoridade divina.
  alternative: Parafrasear como “o trono pertencente a Yahweh” ou reduzir a expressão a uma referência meramente política ao trono de Israel.
  rationale: A formulação do Cronista atribui significado teológico à monarquia davídica. A tradução retém essa afirmação sem definir além do texto a natureza exata dessa representação.
- issue: Força de שׁמע אל na resposta de Israel ao rei
  choice: Usar “lhe deu ouvidos”, mantendo juntas as ideias de escuta atenta e acatamento.
  alternative: Traduzir explicitamente como “lhe obedeceu”.
  rationale: O contexto régio favorece a ideia de obediência, mas o verbo conserva a imagem de ouvir. A formulação escolhida evita eliminar essa amplitude sem enfraquecer a submissão implícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A divisão em duas frases evita uma sequência excessiva de orações coordenadas sem alterar a progressão do hebraico. A vírgula em “Davi, seu pai” torna natural o aposto em português.
