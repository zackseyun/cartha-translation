base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/027.yaml
  text: The days that he reigned over Israel were forty years. In Hebron he reigned seven years, and in Jerusalem he reigned thirty-three years.
translation:
  language: pt
  text: O tempo durante o qual ele reinou sobre Israel foi de quarenta anos. Em Hebrom, reinou sete anos; em Jerusalém, reinou trinta e três anos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר מָלַךְ
  choice: O tempo durante o qual ele reinou
  rationale: A expressão hebraica literalmente fala dos “dias” em que ele reinou, mas funciona como indicação da duração do reinado. “O tempo durante o qual” comunica esse sentido com naturalidade em português moderno.
- source_word: עַל יִשְׂרָאֵל
  choice: sobre Israel
  rationale: A preposição עַל com מָלַךְ indica o povo sobre o qual se exerce o governo. Não se acrescenta “todo”, pois isso não está expresso no versículo.
- source_word: אַרְבָּעִים שָׁנָה
  choice: quarenta anos
  rationale: Equivalente português normal da construção hebraica de numeral com substantivo singular coletivo.
- source_word: בְּחֶבְרוֹן מָלַךְ שֶׁבַע שָׁנִים
  choice: Em Hebrom, reinou sete anos
  rationale: Preserva a localização, a repetição do verbo e a estrutura paralela do hebraico em formulação portuguesa clara.
- source_word: וּבִירוּשָׁלִַם מָלַךְ שְׁלֹשִׁים וְשָׁלוֹשׁ
  choice: em Jerusalém, reinou trinta e três anos
  rationale: Traduz diretamente a segunda parte do paralelismo e expressa o numeral segundo o uso corrente do português.
