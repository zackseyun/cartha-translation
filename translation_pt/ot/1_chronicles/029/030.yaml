  register: 'Português moderno, digno e acessível, com legibilidade brasileira. A tradução emprega equivalência ótima: usa ''sobrevieram'' para tornar compreensível o idioma hebraico, enquanto a nota preserva sua imagem literal; mantém ''terras'' no plural para refletir a forma e o alcance provável do original.'
