base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/030.yaml
  text: along with all his reign and his might[b][a], and the times that passed over him and over Israel and over all the kingdoms of the lands.
translation:
  language: pt
  text: bem como todo o seu reinado e o seu poder, e os tempos que sobrevieram a ele[a], a Israel e a todos os reinos das terras[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que passaram sobre ele”. A expressão hebraica diz literalmente que os tempos “passaram sobre” ele.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “todos os reinos dos países”. O hebraico traz “terras” no plural, referindo-se aos territórios ou povos ao redor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִם
  choice: bem como
  rationale: Liga este último conjunto de informações ao conteúdo do versículo anterior de modo natural em português.
- source_word: מַלְכוּתוֹ
  choice: todo o seu reinado
  rationale: No resumo da vida de Davi, o sentido temporal e abstrato de seu governo é mais adequado que o territorial 'reino'.
- source_word: גְבוּרָתוֹ
  choice: o seu poder
  rationale: Preserva a amplitude do termo, que pode indicar força, poder ou proezas, sem limitá-lo indevidamente a feitos específicos.
- source_word: הָעִתִּים
  choice: os tempos
  rationale: Mantém a formulação ampla do hebraico, abrangendo períodos e circunstâncias históricas.
- source_word: אֲשֶׁר עָבְרוּ עָלָיו
  choice: que sobrevieram a ele
  rationale: Expressa em português corrente a ideia idiomática de tempos que passaram sobre alguém, sem reduzir o sentido simplesmente ao que ele experimentou.
- source_word: וְעַל יִשְׂרָאֵל
  choice: a Israel
  rationale: A regência de 'sobrevieram' permite a construção natural 'a Israel'; a repetição semântica da preposição hebraica continua abrangendo Davi, Israel e os reinos.
- source_word: כָּל מַמְלְכוֹת הָאֲרָצוֹת
  choice: todos os reinos das terras
  rationale: Conserva o plural hebraico 'terras', provavelmente referente aos países ou territórios ao redor, e evita universalizar como 'toda a terra'.
theological_decisions: []
