  text: וַ/יְבָ֤רֶךְ דָּוִיד֙ אֶת יְהוָ֔ה לְ/עֵינֵ֖י כָּל הַ/קָּהָ֑ל וַ/יֹּ֣אמֶר דָּוִ֗יד בָּר֨וּךְ אַתָּ֤ה יְהוָה֙ אֱלֹהֵי֙ יִשְׂרָאֵ֣ל אָבִ֔י/נוּ מֵ/עוֹלָ֖ם וְ/עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/010.yaml
  text: Then David blessed Yahweh in the sight of all the assembly[a], and David said, “Blessed are you, Yahweh, the God of Israel our father, from everlasting to everlasting.”
translation:
  language: pt
  text: 'Então Davi bendisse Yahweh diante de toda a assembleia e disse: “Bendito és tu, Yahweh, Deus de Israel, nosso pai[a], de eternidade em eternidade.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deus de Israel, nosso Pai”, se “nosso Pai” for entendido como referência direta a Deus, e não a Israel/Jacó.'
    reason: Leitura alternativa da relação sintática e do referente de אָבִינוּ.
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: bendisse
  rationale: O piel de ברך, tendo Deus como objeto, exprime uma declaração de bênção e louvor. “Bendisse” preserva a ligação lexical com בָּרוּךְ (“Bendito”) e o tom litúrgico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְעֵינֵי
  choice: diante de
  rationale: Equivalente português natural do idioma literal “aos olhos de”, mantendo o caráter público do ato.
- source_word: כָּל הַקָּהָל
  choice: toda a assembleia
  rationale: קָהָל designa a comunidade reunida; “assembleia” é claro, atual e apropriado ao contexto público.
- source_word: בָּרוּךְ אַתָּה
  choice: Bendito és tu
  rationale: Preserva a fórmula predicativa de bênção, o tratamento direto e o registro doxológico.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Deus de Israel
  rationale: Tradução direta e natural da cadeia construta hebraica.
- source_word: אָבִינוּ
  choice: nosso pai
  rationale: Mantém o substantivo e o sufixo de primeira pessoa do plural. No texto principal, a pontuação o apresenta como aposto de Israel/Jacó, sem ocultar a leitura alternativa indicada em nota.
- source_word: מֵעוֹלָם וְעַד עוֹלָם
  choice: de eternidade a eternidade
  rationale: Expressa duração ilimitada e conserva o paralelismo e o registro elevado do idioma hebraico.
theological_decisions:
- issue: Referente de “nosso pai” em “Deus de Israel, nosso pai”
  choice: “nosso pai” refere-se a Israel/Jacó
  alternative: “nosso Pai” é um vocativo ou aposto referente a Deus
  rationale: A leitura adotada entende אָבִינוּ como aposto de Israel, isto é, o patriarca Jacó. Como a construção hebraica também pode ser relacionada diretamente a Deus, a alternativa é preservada em nota, sem resolver indevidamente a tensão.
translation_notes:
  register: Português moderno, digno e acessível, com cadência litúrgica. “Diante de” evita o literalismo pouco natural de “aos olhos de”; “de eternidade a eternidade” conserva a solenidade e a estrutura do hebraico. O marcador [a] foi colocado junto à expressão a que a nota se refere.
