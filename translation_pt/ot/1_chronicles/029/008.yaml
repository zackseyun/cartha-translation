  text: וְ/הַ/נִּמְצָ֤א אִתּ/וֹ֙ אֲבָנִ֔ים נָתְנ֖וּ לְ/אוֹצַ֣ר בֵּית יְהוָ֑ה עַ֥ל יַד יְחִיאֵ֖ל הַ/גֵּרְשֻׁנִּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/008.yaml
  text: Whoever had precious stones gave them to the treasury of the house of Yahweh, into the care of Jehiel the Gershonite.
translation:
  language: pt
  text: Quem tinha pedras preciosas as entregou ao tesouro da casa de Yahweh, aos cuidados de Jeiel, o gersonita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “pela mão de Jeiel”, expressão que aqui indica cuidado ou supervisão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנִּמְצָא אִתּוֹ
  choice: Quem tinha
  rationale: A construção com o particípio nifal de מצא e אִתּוֹ indica aquilo que se encontrava na posse de alguém; em português corrente, “quem tinha” expressa naturalmente esse sentido distributivo.
- source_word: אֲבָנִים
  choice: pedras preciosas
  rationale: Embora o substantivo isolado signifique “pedras”, o contexto de contribuições para o templo e de depósito no tesouro aponta para pedras de valor; a tradução explicita esse sentido contextual sem identificar tipos específicos.
- source_word: נָתְנוּ
  choice: as entregou
  rationale: נתן significa dar ou entregar. O singular concorda em português com o pronome distributivo “quem”, enquanto “as” retoma as pedras preciosas.
- source_word: לְאוֹצַר
  choice: ao tesouro
  rationale: אוֹצָר pode designar tesouro ou depósito; no contexto dos bens valiosos da casa de Yahweh, “tesouro” é claro e apropriado.
- source_word: בֵּית יְהוָה
  choice: casa de Yahweh
  rationale: Preserva a expressão hebraica “casa de YHWH” em vez de substituí-la interpretativamente por “templo”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico, em vez de substituí-lo por um título.
- source_word: עַל יַד
  choice: aos cuidados de
  rationale: A expressão, literalmente “pela mão de”, aqui indica custódia ou supervisão; “aos cuidados de” comunica de modo natural que os bens ficaram sob a responsabilidade de Jeiel.
- source_word: יְחִיאֵל
  choice: Jeiel
  rationale: Forma tradicional e corrente em português para o nome hebraico יְחִיאֵל.
- source_word: הַגֵּרְשֻׁנִּי
  choice: o gersonita
  rationale: Identifica Jeiel como membro do clã de Gérson sem acrescentar a designação “levita”, que não está explícita no versículo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal, sem substituí-lo por um título.
- issue: Valor contextual de אֲבָנִים
  choice: pedras preciosas
  alternative: pedras
  rationale: O hebraico diz literalmente “pedras”, mas o contexto do tesouro do templo sugere pedras valiosas. A qualificação é contextual, não uma identificação de gemas específicas.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe distributiva foi naturalizada, e a expressão concreta “casa de Yahweh” foi preservada.
