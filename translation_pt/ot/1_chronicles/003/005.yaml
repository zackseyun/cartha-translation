base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/005.yaml
  text: 'These were born to him in Jerusalem: Shimea[a], Shobab, Nathan[b], and Solomon—four by Bath-shua daughter of Ammiel.'
translation:
  language: pt
  text: 'Estes lhe nasceram em Jerusalém: Simeia[a], Sobabe, Natã e Salomão — quatro filhos de Bate-Sua[b], filha de Amiel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em 2 Samuel 5:14 e passagens paralelas, o nome aparece como Samua.
    reason: textual_variant
  - marker: b
    text: Em 2 Samuel 11:3 e passagens relacionadas, ela é chamada Bate-Seba, filha de Eliã.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Estes
  rationale: Introduz este novo grupo da genealogia, preservando a força demonstrativa com formulação natural em português.
- source_word: נוּלְּדוּ לוֹ
  choice: lhe nasceram
  rationale: Reproduz o passivo de ילד e mantém a referência pronominal a Davi sem repetir seu nome.
- source_word: בִּירוּשָׁלָיִם
  choice: em Jerusalém
  rationale: Expressa diretamente o local de nascimento.
- source_word: שִׁמְעָא
  choice: Simeia
  rationale: Representa a forma do nome no texto de Crônicas; a forma diferente no paralelo de Samuel é registrada em nota.
- source_word: שׁוֹבָב
  choice: Sobabe
  rationale: Forma portuguesa legível do nome próprio hebraico.
- source_word: נָתָן
  choice: Natã
  rationale: Forma portuguesa tradicional e amplamente reconhecida.
- source_word: שְׁלֹמֹה
  choice: Salomão
  rationale: Forma portuguesa convencional do conhecido nome régio.
- source_word: אַרְבָּעָה
  choice: quatro filhos
  rationale: O numeral resume os quatro homens mencionados; “filhos” explicita naturalmente em português o referente já indicado por “nasceram”.
- source_word: לְבַת שׁוּעַ
  choice: de Bate-Sua
  rationale: Neste contexto genealógico, a preposição indica a mãe dos quatro filhos; “de” é uma formulação portuguesa concisa e natural.
- source_word: בַּת עַמִּיאֵל
  choice: filha de Amiel
  rationale: Traduz diretamente a expressão hebraica de filiação.
theological_decisions:
- issue: Forma do nome da esposa de Davi em Crônicas em comparação com o paralelo de Samuel
  choice: Bate-Sua, filha de Amiel
  alternative: Bate-Seba, filha de Eliã
  rationale: Segue-se o texto hebraico de Crônicas sem harmonizá-lo silenciosamente com 2 Samuel; a identificação paralela é preservada em nota.
translation_notes:
  register: Português atual, digno e de leitura ampla, com formas portuguesas tradicionais dos nomes. A sintaxe conserva a concisão genealógica do hebraico sem soar artificial.
