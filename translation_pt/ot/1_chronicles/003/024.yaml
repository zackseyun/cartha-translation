  yaml_path: translation/ot/1_chronicles/003/024.yaml
  text: 'And the sons of Elyoenai: Hodaviah[a], Eliashib, Pelaiah, Akkub, Johanan, Delaiah, and Anani—seven.'
translation:
  language: pt
  text: 'E os filhos de Elioenai: Hodavias[a], Eliasibe, Pelaías, Acube, Joanã, Delaías e Anani — sete.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A grafia hebraica deste primeiro nome é incomum. “Hodavias” segue a identificação tradicional mais provável; outras possibilidades incluem “Hodias” ou uma transliteração mais fonética, como “Hodevahu”.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: E os filhos de
  rationale: Mantém a conjunção que dá continuidade à genealogia e traduz o plural construto בְּנֵי pela forma genealógica corrente em português.
- source_word: אֶלְיוֹעֵינַי
  choice: Elioenai
  rationale: Transliteração consagrada e legível em português para o nome próprio hebraico.
- source_word: הדיוהו
  choice: Hodavias
  rationale: Adota a identificação tradicional mais provável em forma portuguesa, enquanto a grafia hebraica incomum e outras possibilidades são registradas em nota.
- source_word: וְאֶלְיָשִׁיב
  choice: Eliasibe
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico.
- source_word: וּפְלָיָה
  choice: Pelaías
  rationale: Forma portuguesa que representa o nome teofórico terminado em -yāh.
- source_word: וְעַקּוּב
  choice: Acube
  rationale: Transliteração portuguesa convencional do nome próprio hebraico.
- source_word: וְיוֹחָנָן
  choice: Joanã
  rationale: Forma portuguesa convencional para יוֹחָנָן, distinguindo-a de variantes teofóricas mais longas.
- source_word: וּדְלָיָה
  choice: Delaías
  rationale: Forma portuguesa convencional do nome hebraico terminado em -yāh.
- source_word: וַעֲנָנִי
  choice: e Anani
  rationale: Translitera o nome próprio e expressa naturalmente a conjunção antes do último elemento da lista.
- source_word: שִׁבְעָה
  choice: sete
  rationale: Preserva explicitamente a soma genealógica presente no hebraico.
