lexical_decisions:
- source_word: אֱלִישָׁמָע
  choice: Elisama
  rationale: Nome próprio transliterado segundo a forma tradicional e natural em português.
- source_word: אֶלְיָדָע
  choice: Eliada
  rationale: Nome próprio transliterado de modo claro e convencional em português.
- source_word: אֱלִיפֶלֶט
  choice: Elifelete
  rationale: A forma portuguesa representa a grafia hebraica plena presente neste versículo e mantém distinção em relação a variantes abreviadas encontradas em outros contextos.
- source_word: וְ / וֶ
  choice: vírgulas e «e» antes do último nome
  rationale: Os waw prefixados ligam os nomes; em português corrente, a coordenação é expressa naturalmente por vírgulas e pela conjunção apenas antes do último item.
- source_word: תִּשְׁעָה
  choice: nove
  rationale: Número cardinal que, no contexto, funciona como contagem conclusiva dos filhos enumerados nos versículos 5–8; foi preservado como total independente.
