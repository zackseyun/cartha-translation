base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/018.yaml
  text: Malchiram[a], Pedaiah, Shenazzar, Jekamiah, Hoshama, and Nedabiah.
translation:
  language: pt
  text: Malquirão[a], Pedaías, Senazar, Jecamias, Hosama e Nedabias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os nomes pessoais hebraicos podem ser transliterados de outras maneiras; por exemplo, «Malquiram» em vez de «Malquirão» ou «Iecamias» em vez de «Jecamias».
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכִּירָם
  choice: Malquirão
  rationale: Nome pessoal transliterado segundo uma forma bíblica corrente e legível em português, preservando aproximadamente a vocalização massorética.
- source_word: פְדָיָה
  choice: Pedaías
  rationale: Nome pessoal transliterado; a terminação teofórica hebraica -yāh é representada pela forma portuguesa tradicional «-aías».
- source_word: שֶׁנְאַצַּר
  choice: Senazar
  rationale: Nome pessoal transliterado em forma natural para o português; «z» representa de modo legível o valor consonantal relevante, sem reproduzir mecanicamente a geminação.
- source_word: יְקַמְיָה
  choice: Jecamias
  rationale: Nome pessoal transliterado conforme convenções portuguesas, com J inicial e a terminação teofórica tradicional «-ias».
- source_word: הוֹשָׁמָע
  choice: Hosama
  rationale: Nome pessoal transliterado de maneira próxima à vocalização hebraica e legível em português.
- source_word: נְדַבְיָה
  choice: Nedabias
  rationale: Nome pessoal transliterado; a terminação teofórica é apresentada pela forma portuguesa convencional «-ias».
- source_word: וּ / וְ
  choice: e
  rationale: As conjunções hebraicas ligam os nomes. Em português natural, usam-se vírgulas e apenas um «e» antes do último item.
