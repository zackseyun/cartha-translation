base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/023.yaml
  text: 'The sons of Neariah: Elioenai[a], Hezekiah, and Azrikam—three.'
translation:
  language: pt
  text: 'Os filhos de Nearias: Elioenai[a], Ezequias e Azricão — três ao todo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz literalmente “filho de Nearias”, no singular; neste contexto genealógico, porém, a expressão introduz três descendentes e funciona como um cabeçalho coletivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן
  choice: Os filhos de
  rationale: Embora a forma hebraica seja singular, literalmente “e o filho de”, ela introduz aqui uma lista de três descendentes, confirmada pelo número final “três”. O plural funciona naturalmente como cabeçalho genealógico em português, sem ocultar a forma do texto-fonte, registrada em nota.
- source_word: נְעַרְיָה
  choice: Nearias
  rationale: Nome próprio transliterado numa forma portuguesa clara, com terminação tradicional em -as.
- source_word: אֶלְיוֹעֵינַי
  choice: Elioenai
  rationale: Transliteração do nome próprio hebraico, preservando uma forma reconhecível e próxima da fonte.
- source_word: וְחִזְקִיָּה
  choice: Ezequias
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: וְעַזְרִיקָם
  choice: e Azricão
  rationale: Nome próprio vertido na forma portuguesa tradicional, com a conjunção expressa.
- source_word: שְׁלֹשָׁה
  choice: três ao todo
  rationale: Mantém explicitamente o número cardinal que encerra e resume a lista; “ao todo” torna natural em português sua função recapitulativa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas de nomes familiares ao leitor brasileiro e inteligíveis internacionalmente. A construção concisa preserva o estilo genealógico, enquanto “ao todo” comunica naturalmente a função resumitiva do número final.
