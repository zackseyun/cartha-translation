  text: the third[a], Absalom son of Maacah, daughter of Talmai king of Geshur; the fourth, Adonijah son of Haggith.
translation:
  language: pt
  text: o terceiro, Absalão, filho de Maaca, filha de Talmai, rei de Gesur; o quarto, Adonias, filho de Hagite.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַ/שְּׁלִשִׁי
  choice: o terceiro
  rationale: O ordinal definido dá continuidade à enumeração dos filhos de Davi iniciada no versículo anterior.
- source_word: לְ/אַבְשָׁלוֹם
  choice: Absalão
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: בֶּן
  choice: filho de
  rationale: Expressa de maneira direta e concisa a relação de filiação na genealogia.
- source_word: מַעֲכָה
  choice: Maaca
  rationale: Transliteração tradicional e inteligível do nome próprio em português.
- source_word: בַּת
  choice: filha de
  rationale: É o sentido lexical mais direto; embora o termo possa designar uma descendente mais remota em certos contextos genealógicos, o versículo não exige esse sentido ampliado.
- source_word: תַּלְמַי
  choice: Talmai
  rationale: Transliteração clara do nome próprio hebraico.
- source_word: מֶלֶךְ גְּשׁוּר
  choice: rei de Gesur
  rationale: Reproduz a cadeia construta que identifica a posição real de Talmai e o território sobre o qual reinava.
- source_word: הָ/רְבִיעִי
  choice: o quarto
  rationale: O ordinal definido mantém a estrutura enumerativa do texto.
- source_word: אֲדֹנִיָּה
  choice: Adonias
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: חַגִּית
  choice: Hagite
  rationale: Forma portuguesa tradicional do nome próprio.
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e digno, com a concisão própria de uma lista genealógica. As vírgulas em torno das relações familiares evitam ambiguidade sintática: Maaca é identificada como filha de Talmai. Não se acrescentou nota sobre uma possível descendência mais remota, pois o hebraico lê diretamente ''filha de'' e o contexto não fornece motivo específico para preferir ''neta''.'
