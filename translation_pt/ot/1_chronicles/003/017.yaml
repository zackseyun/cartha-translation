  text: וּ/בְנֵי֙ יְכָנְיָ֣ה אַסִּ֔ר שְׁאַלְתִּיאֵ֖ל בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/017.yaml
  text: 'And the sons of Jeconiah: Assir[a], Shealtiel his son.'
translation:
  language: pt
  text: 'E os filhos de Jeconias: Assir[a], Sealtiel seu filho.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E os filhos de Jeconias, o cativo: Sealtiel, seu filho.” O hebraico אַסִּר pode ser lido tanto como o nome próprio Assir quanto como o substantivo “cativo” ou “prisioneiro”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: E os filhos de
  rationale: A conjunção ו é traduzida por “E” para preservar a sequência genealógica, e בְנֵי recebe seu sentido genealógico normal, “filhos de”.
- source_word: יְכָנְיָה
  choice: Jeconias
  rationale: Adota-se a forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: אַסִּר
  choice: Assir
  rationale: No contexto da lista genealógica, o termo é apresentado no texto principal como nome próprio, de acordo com a vocalização massorética; sua possível leitura como substantivo comum é preservada em nota.
- source_word: שְׁאַלְתִּיאֵל
  choice: Sealtiel
  rationale: Emprega-se a transliteração portuguesa corrente do nome hebraico.
- source_word: בְּנוֹ
  choice: seu filho
  rationale: O sufixo possessivo é vertido naturalmente por “seu”; a expressão identifica Sealtiel como filho, referindo-se mais diretamente a Jeconias na formulação genealógica.
theological_decisions:
- issue: Se אַסִּר deve ser entendido como nome próprio ou como substantivo comum (“prisioneiro/cativo”)
  choice: Manter “Assir” como nome próprio no texto principal.
  alternative: '“E os filhos de Jeconias, o cativo: Sealtiel, seu filho.”'
  rationale: A forma hebraica permite ambas as leituras. A vocalização massorética e a estrutura de lista favorecem o nome próprio, mas a leitura como designação de Jeconias tem relevância histórica e interpretativa; por isso, a ambiguidade é explicitamente preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com formas de nomes reconhecíveis para leitores brasileiros e internacionais. A pontuação conserva o caráter condensado da genealogia, e a ambiguidade lexical do hebraico é mantida por meio da nota.
