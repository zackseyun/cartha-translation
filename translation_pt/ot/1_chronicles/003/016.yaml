base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/016.yaml
  text: 'And the sons of Jehoiakim: Jeconiah his son[a], Zedekiah his son.'
translation:
  language: pt
  text: 'E os filhos de Jeoaquim: Jeconias, seu filho; Zedequias, seu filho[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico é conciso: “Jeconias, seu filho; Zedequias, seu filho”. A frase pode ser entendida como uma sequência genealógica simples, embora haja divergência sobre se ambos os nomes são filhos de Jeoaquim ou se Zedequias é apresentado como filho de Jeconias.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: E os filhos de
  rationale: בְּנֵי é o plural construto de “filhos” e introduz a nota genealógica; o ו inicial é mantido como “E” para preservar a continuidade da lista.
- source_word: יְהוֹיָקִים
  choice: Jeoaquim
  rationale: Forma tradicional e amplamente reconhecida em português para o nome próprio hebraico.
- source_word: יְכָנְיָה
  choice: Jeconias
  rationale: Forma bíblica consagrada em português que corresponde ao nome hebraico יְכָנְיָה.
- source_word: בְנ֖/וֹ
  choice: seu filho
  rationale: O substantivo com sufixo masculino singular significa literalmente “seu filho”; a formulação natural em português preserva a relação pronominal sem explicitar um antecedente que o hebraico deixa ambíguo.
- source_word: צִדְקִיָּה
  choice: Zedequias
  rationale: Forma tradicional e amplamente reconhecida em português para o nome hebraico.
- source_word: בְנֽ/וֹ
  choice: seu filho
  rationale: A repetição do marcador genealógico é mantida, refletindo a estrutura concisa do hebraico e evitando resolver interpretativamente seu referente.
theological_decisions:
- issue: Sintaxe genealógica e parentesco nesta nota difícil
  choice: 'Preservar a sequência literal e concisa: “Jeconias, seu filho; Zedequias, seu filho”.'
  alternative: Entender os dois nomes como filhos de Jeoaquim, ou entender Zedequias como filho de Jeconias numa sucessão linear.
  rationale: O hebraico repete בְּנוֹ (“seu filho”) depois de cada nome, mas não explicita novamente o antecedente do segundo pronome. A tradução mantém essa ambiguidade, sem harmonizar o texto com outras passagens históricas nem reconstruir a linhagem.
translation_notes:
  register: Português moderno, digno e acessível, com nomes próprios em suas formas bíblicas correntes no Brasil. A pontuação esclarece a estrutura da lista sem eliminar a ambiguidade do original.
