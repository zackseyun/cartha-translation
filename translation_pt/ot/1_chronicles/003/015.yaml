base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/015.yaml
  text: 'And the sons of Josiah: the firstborn[a], Johanan; the second, Jehoiakim; the third, Zedekiah; the fourth, Shallum.'
translation:
  language: pt
  text: 'E os filhos de Josias foram: o primogênito, Joanã; o segundo, Jeoaquim; o terceiro, Zedequias; e o quarto, Salum.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Salum é geralmente identificado com Jeoacaz em 2 Reis 23:30–34 e Jeremias 22:11; aqui, na genealogia de Josias, o Cronista preserva o nome Salum.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי
  choice: E os filhos de
  rationale: Mantém a conjunção que dá continuidade à genealogia e traduz בְנֵי em seu sentido direto, pois são enumerados filhos imediatos.
- source_word: יֹאשִׁיָּהוּ
  choice: Josias
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: הַבְּכוֹר
  choice: o primogênito
  rationale: Expressa diretamente tanto a ordem de nascimento quanto a condição indicada por בְּכוֹר.
- source_word: יוֹחָנָן
  choice: Joanã
  rationale: Forma portuguesa tradicional correspondente ao nome hebraico יוֹחָנָן.
- source_word: הַשֵּׁנִי
  choice: o segundo
  rationale: Tradução direta do ordinal, preservando a sequência da lista.
- source_word: יְהוֹיָקִים
  choice: Jeoaquim
  rationale: Forma portuguesa tradicional do nome que aparece no texto hebraico.
- source_word: הַשְּׁלִשִׁי
  choice: o terceiro
  rationale: Tradução direta e coerente do ordinal.
- source_word: צִדְקִיָּהוּ
  choice: Zedequias
  rationale: Forma portuguesa tradicional e reconhecível do nome real.
- source_word: הָרְבִיעִי
  choice: o quarto
  rationale: Tradução direta do ordinal, mantendo a estrutura da enumeração.
- source_word: שַׁלּוּם
  choice: Salum
  rationale: Transliteração tradicional em português do nome preservado no texto hebraico.
theological_decisions:
- issue: Ordem genealógica em contraste com a sucessão ao trono
  choice: Manter os nomes e os ordinais exatamente na ordem apresentada pelo texto hebraico, como uma lista dos filhos de Josias.
  alternative: Reordenar ou modificar a lista para ajustá-la à sequência dos reis depois de Josias.
  rationale: O versículo apresenta explicitamente uma sequência genealógica. A tradução não deve harmonizá-la no corpo do texto com os relatos de sucessão real; a identificação histórica pertinente fica em nota.
translation_notes:
  register: Português atual, claro e digno, com formas onomásticas tradicionais de ampla legibilidade no Brasil. O verbo «foram» foi acrescentado por naturalidade sintática, sem alterar o caráter enumerativo do hebraico. O marcador da nota foi colocado após Salum, a informação específica explicada pela nota.
