lexical_decisions:
- source_word: יִבְחָר
  choice: Ibhar
  rationale: Nome próprio transliterado do hebraico. A forma preserva o yod inicial como I, de modo natural e reconhecível em português.
- source_word: אֱלִישָׁמָע
  choice: Elisama
  rationale: Forma portuguesa tradicional e transparente do nome hebraico; o shin é representado por s, e o ayin final não recebe representação gráfica específica.
- source_word: אֱלִיפָלֶט
  choice: Elifelete
  rationale: Transliteração aportuguesada e convencional, com f para a consoante fricativa e vogal final de apoio para leitura natural em português.
- source_word: וְ
  choice: e
  rationale: A conjunção prefixada coordena os nomes. Em uma lista portuguesa corrente, basta explicitá-la antes do último nome.
