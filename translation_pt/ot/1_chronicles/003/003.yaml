  text: the fifth[a], Shephatiah, by Abital; the sixth, Ithream[b], by Eglah his wife.
translation:
  language: pt
  text: o quinto, Sefatias, de Abital[a]; o sexto, Itreão, de Eglá, esposa de Davi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “para Abital” e “para Eglá”; nesta fórmula genealógica, o sentido é que Sefatias nasceu de Abital e Itreão, de Eglá.
    reason: lexical_alternative
  - marker: b
    text: Alguns intérpretes identificam Eglá com Mical, mas o próprio texto não afirma isso.
    reason: alternative_reading
lexical_decisions:
- source_word: הַחֲמִישִׁי
  choice: o quinto
  rationale: Ordinal definido que dá continuidade à enumeração dos filhos de Davi.
- source_word: שְׁפַטְיָה
  choice: Sefatias
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico.
- source_word: לַאֲבִיטָל
  choice: de Abital
  rationale: Neste contexto genealógico, a preposição ל marca a relação materna; em português, “de Abital” expressa de modo conciso que ele era filho dela, sem a ambiguidade moderna de “por Abital”.
- source_word: הַשִּׁשִּׁי
  choice: o sexto
  rationale: Preserva o paralelismo e a estrutura numerada da lista.
- source_word: יִתְרְעָם
  choice: Itreão
  rationale: Forma portuguesa tradicional e legível do nome próprio hebraico.
- source_word: לְעֶגְלָה
  choice: de Eglá
  rationale: Como na expressão paralela anterior, indica maternidade na fórmula genealógica.
- source_word: אִשְׁתּוֹ
  choice: sua esposa
  rationale: Sentido marital normal de אִשָּׁה com sufixo masculino singular; no contexto, refere-se naturalmente a Eglá como esposa de Davi.
theological_decisions:
- issue: Referente e possível significado especial de “sua esposa”
  choice: Manter a afirmação simples de que Eglá era esposa de Davi, sem explicar por que ela é designada assim.
  alternative: Entender a expressão como indicação de um estatuto especial ou identificar Eglá com Mical.
  rationale: O texto hebraico apenas acrescenta “sua esposa” a Eglá. Não declara que ela tinha estatuto singular nem a identifica com Mical; essas conclusões não devem ser introduzidas na tradução.
translation_notes:
  register: Português moderno, claro e digno, com formas onomásticas correntes em traduções portuguesas. A construção “de Abital/de Eglá” mantém a concisão da genealogia e comunica a maternidade de modo natural. Todos os marcadores de nota aparecem no texto.
