base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/022.yaml
  text: 'And the sons of Shecaniah: Shemaiah. And the sons of Shemaiah: Hattush[a], Igal, Bariah, Neariah, and Shaphat—six.'
translation:
  language: pt
  text: 'E os filhos de Secanias: Semaías. E os filhos de Semaías: Hatus, Igal, Barias, Nearias e Safate — seis.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico diz “seis”, embora o Texto Massorético apresente aqui apenas cinco nomes. Isso pode refletir um problema textual ou a omissão de um nome durante a transmissão do texto.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: E os filhos de
  rationale: Traduz diretamente o plural construto בְּנֵי e preserva a fórmula genealógica hebraica; embora possa significar “descendentes” em certos contextos, aqui introduz nomes numa linhagem imediata.
- source_word: שְׁכַנְיָה
  choice: Secanias
  rationale: Forma tradicional e reconhecível em português para o nome próprio hebraico, adequada à leitura brasileira e internacional.
- source_word: שְׁמַעְיָה
  choice: Semaías
  rationale: Transliteração portuguesa corrente do nome próprio, com acentuação que facilita a pronúncia.
- source_word: חַטּוּשׁ
  choice: Hatus
  rationale: Forma portuguesa reconhecível do nome hebraico, preservando aproximadamente sua forma sonora.
- source_word: יִגְאָל
  choice: Igal
  rationale: Transliteração direta e corrente em português, sem substituir o nome por outro mais familiar.
- source_word: בָרִיחַ
  choice: Barias
  rationale: Forma onomástica tradicional em português que representa o nome lido no Texto Massorético, sem alterá-lo para o nome hebraico distinto Berias.
- source_word: נְעַרְיָה
  choice: Nearias
  rationale: Forma portuguesa tradicional e legível do nome próprio.
- source_word: שָׁפָט
  choice: Safate
  rationale: Forma portuguesa tradicional do nome próprio, adaptada à fonologia e ortografia do idioma.
- source_word: שִׁשָּׁה
  choice: seis
  rationale: O numeral é traduzido literalmente, apesar de o Texto Massorético apresentar apenas cinco nomes nesta lista; a dificuldade textual não deve ser corrigida silenciosamente.
