- source_word: יֹאשִׁיָּ֥הוּ
  choice: Josias
  rationale: Forma tradicional e amplamente reconhecida em português para o nome hebraico יֹאשִׁיָּהוּ.
- source_word: בְנֽוֹ
  choice: seu filho
  rationale: A repetição da mesma fórmula genealógica é mantida para refletir a estrutura concisa e paralela do hebraico.
