base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/004.yaml
  text: Six were born to him in Hebron, and he reigned there seven years and six months; and in Jerusalem he reigned thirty-three years.
translation:
  language: pt
  text: Seis filhos nasceram a Davi em Hebrom. Ali ele reinou sete anos e seis meses; em Jerusalém, reinou trinta e três anos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁשָּׁה נוֹלַד לוֹ
  choice: Seis filhos nasceram a Davi
  rationale: O hebraico diz literalmente que “seis nasceram para ele”. “Filhos” é suprido pelo contexto da lista genealógica, e “a Davi” explicita com naturalidade o referente do pronome sem alterar o sentido.
- source_word: בְחֶבְרוֹן
  choice: em Hebrom
  rationale: Tradução locativa direta do nome do lugar, usando a forma portuguesa consagrada.
- source_word: וַיִּמְלָךְ שָׁם
  choice: Ali ele reinou
  rationale: מלך, neste contexto, descreve o exercício do reinado; “ali” retoma Hebrom de maneira natural.
- source_word: שֶׁבַע שָׁנִים וְשִׁשָּׁה חֳדָשִׁים
  choice: sete anos e seis meses
  rationale: Representação direta e idiomática da duração indicada no hebraico.
- source_word: וּשְׁלֹשִׁים וְשָׁלוֹשׁ שָׁנָה
  choice: trinta e três anos
  rationale: A ordem numérica hebraica é expressa na forma natural do português moderno.
- source_word: מָלַךְ בִּירוּשָׁלִָם
  choice: em Jerusalém, reinou
  rationale: A posição inicial do local preserva o contraste geográfico com Hebrom, sem sacrificar a fluidez em português.
