  yaml_path: translation/ot/1_chronicles/003/012.yaml
  text: Amaziah his son[a], Azariah his son, Jotham his son.
translation:
  language: pt
  text: Amazias, seu filho; Azarias[a], seu filho; Jotão, seu filho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este rei também é conhecido em outros textos como Uzias.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲמַצְיָהוּ
  choice: Amazias
  rationale: Nome próprio vertido segundo a forma tradicional e amplamente reconhecida em português.
- source_word: בְנוֹ
  choice: seu filho
  rationale: A expressão hebraica com sufixo de terceira pessoa do singular significa diretamente “seu filho”; a repetição foi preservada nas três ocorrências.
- source_word: עֲזַרְיָה
  choice: Azarias
  rationale: Reproduz o nome presente no texto hebraico, sem harmonizá-lo com a forma alternativa “Uzias” usada em outros textos.
- source_word: יוֹתָם
  choice: Jotão
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
theological_decisions:
- issue: Linguagem filial na genealogia real
  choice: Manter “seu filho” em todas as ocorrências.
  alternative: Usar “seu descendente” para admitir possível abreviação genealógica.
  rationale: O hebraico repete explicitamente בְנוֹ (“seu filho”). Embora genealogias bíblicas possam omitir gerações, não há razão textual neste versículo para substituir a formulação filial por uma expressão mais geral.
- issue: Identidade de Azarias e Uzias
  choice: Traduzir o nome escrito no versículo como “Azarias” e registrar “Uzias” em nota.
  alternative: Empregar “Uzias” no texto principal para harmonizar o nome com outras passagens.
  rationale: A tradução conserva a forma עֲזַרְיָה do texto hebraico e informa a forma alternativa sem apagar a variação nominal.
translation_notes:
  register: Português moderno, claro e digno, com os nomes bíblicos tradicionais de uso corrente. Os pontos e vírgulas tornam legível a fórmula genealógica repetida sem acrescentar conteúdo ao hebraico.
