base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/020.yaml
  text: and Hashubah[a], Ohel, Berekiah, Hasadiah[b], and Jushab-hesed—five.
translation:
  language: pt
  text: E Hasubá, Oel, Berequias, Hasadias e Jusabe-Hesede[b] — cinco.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz simplesmente «cinco», resumindo os cinco nomes que acabam de ser mencionados; a construção é elíptica.
    reason: lexical_alternative
  - marker: b
    text: O último nome aparece no hebraico como dois elementos, «Jusabe Hesede», mas é entendido aqui como um único nome pessoal composto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/חֲשֻׁבָה
  choice: e Hasubá
  rationale: Nome próprio com a conjunção ו; transliterado em forma natural para leitores de língua portuguesa.
- source_word: וָ/אֹהֶל
  choice: Oel
  rationale: Nome próprio, não o substantivo comum hebraico para «tenda»; a transliteração evita inserir um significado lexical indevido.
- source_word: וּ/בֶרֶכְיָה
  choice: Berequias
  rationale: Forma portuguesa bíblica legível que representa o nome hebraico בֶרֶכְיָה.
- source_word: וַֽ/חֲסַדְיָה
  choice: Hasadias
  rationale: Transliteração adaptada ao português, mantendo reconhecível o elemento final -יה.
- source_word: י֥וּשַׁב חֶ֖סֶד
  choice: Jusabe-Hesede
  rationale: Os dois elementos gráficos hebraicos são apresentados com hífen como um único nome pessoal composto, sem traduzir seus componentes.
- source_word: חָמֵשׁ
  choice: cinco
  rationale: Mantém a conclusão numérica elíptica do hebraico, sem acrescentar «eram».
