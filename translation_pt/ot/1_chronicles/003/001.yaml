  text: וְ/אֵ֤לֶּה הָיוּ֙ בְּנֵ֣י דָויִ֔ד אֲשֶׁ֥ר נֽוֹלַד ל֖/וֹ בְּ/חֶבְר֑וֹן הַ/בְּכ֣וֹר אַמְנֹ֗ן לַ/אֲחִינֹ֨עַם֙ הַ/יִּזְרְעֵאלִ֔ית שֵׁנִי֙ דָּנִיֵּ֔אל לַ/אֲבִיגַ֖יִל הַֽ/כַּרְמְלִֽית־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/001.yaml
  text: 'These were David’s sons who were born to him in Hebron: the firstborn[a], Amnon, by Ahinoam the Jezreelite; the second, Daniel, by Abigail the Carmelite.'
translation:
  language: pt
  text: 'Estes foram os filhos de Davi que lhe nasceram em Hebrom: o primogênito, Amnom, filho de Ainoã, a jezreelita; o segundo, Daniel[a], filho de Abigail, a carmelita.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Na lista paralela de 2 Samuel 3:3, este filho é chamado Quileabe, e não Daniel.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה הָיוּ
  choice: Estes foram
  rationale: Introduz a seção genealógica e mantém o valor passado de הָיוּ. O conectivo וְ não precisa ser expresso por “e” em português, pois aqui funciona naturalmente como transição discursiva.
- source_word: בְּנֵי דָוִיד
  choice: os filhos de Davi
  rationale: Preserva a referência masculina e a relação de posse da construção hebraica.
- source_word: אֲשֶׁר נוֹלַד לוֹ
  choice: que lhe nasceram
  rationale: Mantém a formulação de nascimento e a relação indicada por לוֹ, em português natural, sem converter a expressão em uma afirmação ativa de geração.
- source_word: בְּחֶבְרוֹן
  choice: em Hebrom
  rationale: Forma locativa corrente para o nome da cidade.
- source_word: הַבְּכוֹר
  choice: o primogênito
  rationale: Preserva o termo de posição genealógica, mais específico que apenas “o mais velho”.
- source_word: לַאֲחִינֹעַם
  choice: filho de Ainoã
  rationale: Neste contexto genealógico, לְ diante do nome materno identifica a mãe. “Filho de” torna a relação inequívoca e soa mais natural em português do que uma reprodução literal com “a”.
- source_word: הַיִּזְרְעֵאלִית
  choice: a jezreelita
  rationale: Mantém o gentílico feminino que identifica a origem de Ainoã.
- source_word: שֵׁנִי
  choice: o segundo
  rationale: Conserva a ordem explícita da lista.
- source_word: דָּנִיֵּאל
  choice: Daniel
  rationale: Transliteração portuguesa convencional do nome apresentado no texto massorético de Crônicas.
- source_word: לַאֲבִיגַיִל הַכַּרְמְלִית
  choice: filho de Abigail, a carmelita
  rationale: Explicita a relação materna indicada por לְ e preserva o gentílico feminino.
