  yaml_path: translation/ot/1_chronicles/003/010.yaml
  text: And the son of Solomon was Rehoboam; Abijah his son[a], Asa his son, Jehoshaphat his son.
translation:
  language: pt
  text: E o filho de Salomão foi Roboão; Abias[a], seu filho; Asa, seu filho; Josafá, seu filho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «Abias». Em 1–2 Reis, esse mesmo rei também é mencionado pela forma variante «Abião».'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בֶן שְׁלֹמֹה
  choice: O filho de Salomão
  rationale: Expressa naturalmente em português o elo genealógico introduzido pela conjunção ו e pelo substantivo בֶן em estado construto; a ligação com o contexto é preservada pela continuidade da lista.
- source_word: רְחַבְעָם
  choice: Roboão
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: אֲבִיָּה
  choice: Abias
  rationale: Forma portuguesa consagrada correspondente ao nome אֲבִיָּה presente em Crônicas, sem substituí-lo pela variante encontrada em Reis.
- source_word: בְנ/וֹ
  choice: o filho deste
  rationale: O substantivo com sufixo masculino singular indica sucessão filial. «O filho deste» evita em português a possível ambiguidade de uma sequência de «seu filho» e mantém clara a progressão genealógica.
- source_word: אָסָא
  choice: Asa
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: יְהוֹשָׁפָט
  choice: Josafá
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
