base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/019.yaml
  text: 'The sons of Pedaiah: Zerubbabel and Shimei[a]. And the sons of Zerubbabel: Meshullam and Hananiah; and Shelomith was their sister.'
translation:
  language: pt
  text: 'Os filhos de Pedaías: Zorobabel e Simei. E os filhos de Zorobabel[a]: Mesulão e Hananias; e Selomite, irmã deles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “o filho de Zorobabel”. Como em seguida são mencionados Mesulão e Hananias, muitos entendem o singular como uma irregularidade textual ou como um uso genealógico de sentido coletivo.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי פְדָיָה
  choice: Os filhos de Pedaías
  rationale: Em contexto genealógico, בְנֵי designa naturalmente filhos. A conjunção inicial não precisa ser explicitada em português, pois a frase funciona como transição genealógica.
- source_word: זְרֻבָּבֶל וְשִׁמְעִי
  choice: Zorobabel e Simei
  rationale: Empregam-se as formas tradicionais e amplamente reconhecidas desses nomes em português.
- source_word: וּבֶן זְרֻבָּבֶל
  choice: E os filhos de Zorobabel[a]
  rationale: Embora o texto hebraico tenha o singular בֶן, a sequência apresenta dois homens e depois a irmã deles. O plural comunica o sentido aparente da genealogia em português fluente, enquanto a nota preserva a irregularidade do texto-fonte.
- source_word: מְשֻׁלָּם וַחֲנַנְיָה
  choice: Mesulão e Hananias
  rationale: Nomes transliterados segundo formas bíblicas correntes em português, com a coordenação simples do hebraico.
- source_word: וּשְׁלֹמִית אֲחוֹתָם
  choice: Selomite era irmã deles
  rationale: O pronome sufixado é plural e se refere mais naturalmente a Mesulão e Hananias. O verbo “era” é acrescentado para tornar natural em português a oração nominal hebraica.
