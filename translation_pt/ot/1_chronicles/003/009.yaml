  yaml_path: translation/ot/1_chronicles/003/009.yaml
  text: All these were David’s sons[a], besides the sons of the concubines; and Tamar was their sister.
translation:
  language: pt
  text: Todos esses eram filhos de Davi[a], além dos filhos das concubinas; e Tamar era irmã deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à parte dos filhos das concubinas”. A expressão hebraica pode excluir esses filhos do total precedente ou mencioná-los adicionalmente, fora da lista principal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: Todos esses
  rationale: Expressa a totalidade dos nomes anteriormente enumerados e funciona naturalmente como resumo genealógico em português.
- source_word: בְּנֵי דָוִיד
  choice: filhos de Davi
  rationale: O substantivo hebraico está no masculino plural; “filhos” preserva essa especificidade.
- source_word: מִלְּבַד
  choice: além de
  rationale: A locução pode indicar elementos fora do grupo principal, quer como acréscimo, quer como exclusão da enumeração; a nota preserva essa amplitude.
- source_word: בְּנֵי פִילַגְשִׁים
  choice: os filhos das concubinas
  rationale: Tradução direta e clara; o contexto torna desnecessário acrescentar “de Davi”.
- source_word: פִילַגְשִׁים
  choice: concubinas
  rationale: Termo português convencional e preciso para essa categoria social no contexto da casa real.
- source_word: וְתָמָר
  choice: e Tamar
  rationale: Reproduz a conjunção simples e mantém a forma consagrada do nome próprio.
- source_word: אֲחוֹתָם
  choice: era irmã deles
  rationale: O hebraico apresenta uma oração nominal; o português requer naturalmente a cópula “era”, e “deles” retoma os filhos mencionados.
