base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/021.yaml
  text: 'And the sons of Hananiah: Pelatiah and Jeshaiah; the sons of Rephaiah[a], the sons of Arnan, the sons of Obadiah, the sons of Shecaniah.'
translation:
  language: pt
  text: 'E o filho de Hananias: Pelatias e Jesaías; os filhos de Refaías[a], os filhos de Arnã, os filhos de Obadias, os filhos de Secanias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A sintaxe hebraica é condensada e um tanto difícil. Literalmente: “E o filho de Hananias: Pelatias e Jesaías; os filhos de Refaías, os filhos de Arnã, os filhos de Obadias, os filhos de Secanias”. Alguns entendem parte dessa sequência em sentido mais amplo, como uma linhagem de descendentes, e não necessariamente como filhos imediatos.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבֶן
  choice: E os filhos de
  rationale: Embora o texto massorético tenha literalmente o singular “e o filho de”, os dois nomes coordenados que seguem indicam uma referência plural no sentido. A tradução adota o plural no texto corrente, sem ocultar a forma singular hebraica, registrada na nota.
- source_word: חֲנַנְיָה
  choice: Hananias
  rationale: Nome próprio transliterado em forma corrente e reconhecível em português.
- source_word: פְּלַטְיָה
  choice: Pelatias
  rationale: Nome próprio transliterado segundo o uso bíblico corrente em português.
- source_word: וִישַׁעְיָה
  choice: e Jesaías
  rationale: Nome próprio com a conjunção preservada; “Jesaías” distingue esta forma onomástica de “Isaías” no uso português.
- source_word: בְּנֵי
  choice: os filhos de
  rationale: A expressão genealógica é mantida de maneira formal; pode abranger descendentes mais remotos, possibilidade indicada na nota.
- source_word: רְפָיָה
  choice: Refaías
  rationale: Nome próprio transliterado em forma natural para leitores de português.
- source_word: אַרְנָן
  choice: Arnã
  rationale: Nome próprio transliterado com terminação portuguesa natural.
- source_word: עֹבַדְיָה
  choice: Obadias
  rationale: Forma tradicional e amplamente reconhecida em português.
- source_word: שְׁכַנְיָה
  choice: Secanias
  rationale: Forma portuguesa corrente do nome próprio.
