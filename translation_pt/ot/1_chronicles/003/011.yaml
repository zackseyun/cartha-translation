  rationale: Forma tradicional e amplamente reconhecida em português para o nome hebraico; “Jeorão” é uma forma alternativa do mesmo nome.
- source_word: בְּנוֹ
  choice: seu filho
  rationale: O substantivo בֵּן com sufixo de terceira pessoa masculina singular significa mais diretamente “seu filho”. Embora em genealogias possa indicar um descendente posterior, aqui a fórmula concisa apresenta a sucessão régia.
- source_word: אֲחַזְיָהוּ
  choice: Acazias
  rationale: Forma bíblica tradicional e corrente em português para o nome hebraico.
- source_word: יוֹאָשׁ
  choice: Joás
  rationale: Forma bíblica tradicional e corrente em português; “Jeoás” é uma forma alternativa do mesmo nome.
