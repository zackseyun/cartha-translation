base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/006.yaml
  text: Then he called for Solomon his son and commanded him to build a house for Yahweh[a], the God of Israel.
translation:
  language: pt
  text: Então Davi chamou seu filho Salomão e lhe ordenou que construísse uma casa para Yahweh[a], o Deus de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um templo para Yahweh”. O hebraico diz literalmente “uma casa para Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: Então Davi chamou
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência. O sujeito implícito foi explicitado como Davi para clareza em uma unidade isolada, conforme o contexto imediato.
- source_word: לִשְׁלֹמֹה בְנוֹ
  choice: seu filho Salomão
  rationale: Reproduz de modo natural a identificação familiar e o nome próprio, sem acrescentar ênfase ausente no hebraico.
- source_word: וַיְצַוֵּהוּ
  choice: e lhe ordenou
  rationale: Preserva a força autoritativa de צוה em português moderno e claro.
- source_word: לִבְנוֹת
  choice: que construísse
  rationale: Após “ordenou”, a oração subordinada com subjuntivo é uma formulação portuguesa natural para o conteúdo da ordem.
- source_word: בַּיִת
  choice: uma casa
  rationale: Mantém o sentido literal de בית e a imagem do templo como casa de Deus; “templo” é registrado como alternativa explicativa.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: A preposição ל indica finalidade ou dedicação da construção. “Yahweh” translitera o nome divino expresso no texto hebraico.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta e convencional da construção que identifica Yahweh como o Deus de Israel.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico traz diretamente o Tetragrama; “Yahweh” preserva o caráter de nome próprio, enquanto “SENHOR” representa a tradição de leitura substitutiva.
- issue: Sentido cultual de בַּיִת
  choice: casa
  alternative: templo
  rationale: “Casa” conserva a metáfora e a forma lexical do hebraico; no contexto, ela designa o templo, alternativa explicitada em nota sem substituir silenciosamente a expressão original.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com ordem sintática natural. O nome “Davi”, implícito no verbo hebraico, foi explicitado porque a referência é apresentada como versículo isolado. A vírgula antes da nota mantém clara a aposição “o Deus de Israel”.
