base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/012.yaml
  text: Only[a], may Yahweh give you insight and understanding, and command you concerning Israel[b], that you may keep the law of Yahweh your God.
translation:
  language: pt
  text: Que Yahweh lhe conceda, acima de tudo[a], prudência e entendimento e o encarregue de Israel[b], para que você guarde a lei de Yahweh, seu Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “somente”. A partícula hebraica pode restringir, enfatizar ou introduzir um contraste: “certamente”, “de fato” ou “mas”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “lhe dê ordens a respeito de Israel” ou “o ponha sobre Israel”. A construção hebraica pode indicar uma ordem relativa a Israel ou o encargo de governá-lo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Somente
  rationale: 'A partícula introduz e enfatiza o desejo de Davi, com sentido restritivo ou focal: ''acima de tudo, isto''.'
- source_word: יִתֶּן
  choice: que ... dê
  rationale: Embora seja formalmente um imperfeito, no contexto expressa desejo ou bênção.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama.
- source_word: שֵׂכֶל
  choice: sabedoria prática
  rationale: Comunica bom senso, prudência e capacidade de agir com acerto, distinguindo o termo de בִינָה.
- source_word: בִינָה
  choice: entendimento
  rationale: Expressa compreensão e discernimento, preservando o par de qualidades mentais do hebraico.
- source_word: וִיצַוְּךָ עַל יִשְׂרָאֵל
  choice: o encarregue de Israel
  rationale: Mantém a ideia de receber responsabilidade ou encargo sobre Israel, adequada ao contexto régio, sem tornar explícita uma nomeação que o verbo não exige.
- source_word: וְלִשְׁמוֹר
  choice: para que você guarde
  rationale: Expressa naturalmente a relação de propósito do infinitivo hebraico.
- source_word: תּוֹרַת
  choice: a lei de
  rationale: No contexto da aliança, 'lei' é uma tradução clara e reconhecível, embora o termo também possa significar 'instrução'.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz diretamente a designação pactual com sufixo de segunda pessoa masculina singular.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; 'Yahweh' preserva o nome próprio sem substituí-lo por um título.
- issue: Sentido de וִיצַוְּךָ עַל יִשְׂרָאֵל no contexto régio
  choice: o encarregue de Israel
  alternative: lhe dê ordens a respeito de Israel; o ponha sobre Israel
  rationale: A construção admite a ideia de confiar responsabilidade sobre Israel, mas sua ambiguidade lexical deve permanecer visível em nota.
- issue: Amplitude semântica de תּוֹרָה
  choice: lei
  alternative: instrução
  rationale: '''Lei'' se ajusta ao contexto pactual, enquanto a nota preserva o sentido alternativo e mais amplo de ''instrução''.'
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas brasileiras naturais. O tratamento por 'você' torna explícita a segunda pessoa singular dirigida a Salomão. A formulação preserva em notas a ambiguidade da partícula inicial e da comissão relativa a Israel.
