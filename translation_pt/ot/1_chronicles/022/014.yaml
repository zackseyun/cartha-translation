  text: וְ/הִנֵּ֨ה בְ/עָנְיִ֜/י הֲכִינ֣וֹתִי לְ/בֵית יְהוָ֗ה זָהָ֞ב כִּכָּרִ֤ים מֵֽאָה אֶ֨לֶף֙ וְ/כֶ֗סֶף אֶ֤לֶף אֲלָפִים֙ כִּכָּרִ֔ים וְ/לַ/נְּחֹ֤שֶׁת וְ/לַ/בַּרְזֶל֙ אֵ֣ין מִשְׁקָ֔ל כִּ֥י לָ/רֹ֖ב הָיָ֑ה וְ/עֵצִ֤ים וַ/אֲבָנִים֙ הֲכִינ֔וֹתִי וַ/עֲלֵי/הֶ֖ם תּוֹסִֽיף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/014.yaml
  text: Behold[a], in my affliction I have prepared for the house of Yahweh one hundred thousand talents of gold, and one million talents of silver; and for the bronze and the iron there is no weighing, for it was in abundance. I have prepared timber and stones[c][b], and you may add to them.
translation:
  language: pt
  text: Eis que, em minha aflição[a], preparei para a casa de Yahweh cem mil talentos de ouro e um milhão de talentos de prata[b]. Quanto ao bronze e ao ferro, não há como pesá-los, pois são abundantes. Também preparei madeira e pedras, e você poderá acrescentar mais a eles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em minha pobreza”. O termo hebraico pode indicar aflição, dificuldade ou pobreza.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “mil milhares”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “e você deverá acrescentar mais a eles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Eis que
  rationale: Mantém o marcador de apresentação e ênfase do hebraico sem acrescentar uma ideia temporal ausente no texto-fonte.
- source_word: בְעָנְיִי
  choice: em meio à minha aflição
  rationale: עֳנִי pode indicar aflição, dificuldade ou pobreza. A escolha conserva o sentido amplo de adversidade e soa natural em português; a possibilidade de pobreza é registrada em nota.
- source_word: הֲכִינוֹתִי
  choice: preparei
  rationale: O hifil de כון significa preparar ou deixar pronto. O pretérito perfeito comunica uma ação concluída cujos resultados estão disponíveis a Salomão.
- source_word: לְבֵית יְהוָה
  choice: para a casa de Yahweh
  rationale: Preserva tanto o substantivo concreto 'casa', que neste contexto designa o templo, quanto o nome divino expresso no hebraico.
- source_word: כִּכָּרִים
  choice: talentos
  rationale: Talento é o equivalente convencional para a grande unidade antiga de peso כִּכָּר; evita uma conversão moderna necessariamente incerta.
- source_word: מֵאָה אֶלֶף
  choice: cem mil
  rationale: Representa diretamente o número hebraico.
- source_word: אֶלֶף אֲלָפִים
  choice: um milhão
  rationale: Expressa em português corrente a quantidade indicada literalmente por 'mil milhares'; a forma hebraica é preservada em nota.
- source_word: וְלַנְּחֹשֶׁת וְלַבַּרְזֶל אֵין מִשְׁקָל
  choice: Quanto ao bronze e ao ferro, não há como pesá-los
  rationale: Comunica que não se fornece ou não se consegue estabelecer a pesagem devido à enorme quantidade, sem sugerir que os metais não tenham peso.
- source_word: כִּי לָרֹב הָיָה
  choice: pois são abundantes
  rationale: Explicita naturalmente em português que a falta de pesagem decorre da abundância dos metais; o plural retoma bronze e ferro.
- source_word: וְעֵצִים וַאֲבָנִים הֲכִינוֹתִי
  choice: Também preparei madeira e pedras
  rationale: Madeira é clara e abrangente no contexto de materiais de construção; 'também' reproduz adequadamente a coordenação aditiva.
- source_word: וַעֲלֵיהֶם תּוֹסִיף
  choice: e você poderá acrescentar mais
  rationale: O imperfeito dirigido a Salomão admite valor permissivo ou diretivo. A tradução principal mantém a leitura permissiva, enquanto a leitura mais imperativa aparece em nota.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o tetragrama. 'Yahweh' preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Força modal de וַעֲלֵיהֶם תּוֹסִיף
  choice: você poderá acrescentar mais
  alternative: você deverá acrescentar mais
  rationale: A forma verbal pode ser entendida como permissão/predição ou como instrução. A versão principal conserva o tom permissivo contextual, e a alternativa mais forte é indicada em nota para não eliminar a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação preserva 'casa de Yahweh' e 'talentos' como expressões bíblicas reconhecíveis, evita um 'agora' sem correspondente lexical e distribui os marcadores de nota junto às expressões a que se referem.
