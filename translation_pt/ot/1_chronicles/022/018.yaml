  text: הֲ/לֹ֨א יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ עִמָּ/כֶ֔ם וְ/הֵנִ֥יחַ לָ/כֶ֖ם מִ/סָּבִ֑יב כִּ֣י נָתַ֣ן בְּ/יָדִ֗/י אֵ֚ת יֹשְׁבֵ֣י הָ/אָ֔רֶץ וְ/נִכְבְּשָׁ֥ה הָ/אָ֛רֶץ לִ/פְנֵ֥י יְהוָ֖ה וְ/לִ/פְנֵ֥י עַמּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/018.yaml
  text: Is not Yahweh your God with you? And has he not given you rest on every side? For he has given the inhabitants of the land into my hand[a], and the land has been subdued before Yahweh and before his people.
translation:
  language: pt
  text: Não está Yahweh, o Deus de vocês, com vocês? E não lhes deu descanso por todos os lados? Pois ele entregou em minhas mãos os habitantes da terra, e a terra foi subjugada diante de Yahweh e diante do seu povo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em «seu povo», o pronome se refere mais provavelmente a Yahweh, embora também possa ser entendido como uma referência a Davi. «Diante» também pode ser traduzido aqui por «à vista de».
    reason: Preserva a possível ambiguidade do referente pronominal e registra uma nuance lexical legítima de לִפְנֵי.
lexical_decisions:
- source_word: הֲלֹא
  choice: Por acaso... não
  rationale: Preserva a pergunta retórica que espera resposta afirmativa e soa natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: No contexto de Yahweh e de Israel, a forma morfologicamente plural funciona como designação singular de Deus; 'de vocês' oferece ampla legibilidade brasileira.
- source_word: עִמָּכֶם
  choice: está com vocês
  rationale: Expressa diretamente a presença e o apoio divinos.
- source_word: וְהֵנִיחַ לָכֶם מִסָּבִיב
  choice: E não lhes deu descanso por todos os lados?
  rationale: O verbo indica a concessão de descanso ou alívio em relação aos inimigos circundantes; a continuação negativa é suprida naturalmente em português sob o alcance da pergunta retórica iniciada por הֲלֹא.
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que fundamenta a afirmação implícita na pergunta retórica.
- source_word: נָתַן בְּיָדִי
  choice: entregou em minhas mãos
  rationale: Mantém a imagem hebraica de colocar alguém sob o poder de outro, usando o plural idiomático mais natural em português.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: os habitantes da terra
  rationale: Equivalência direta e corrente para o particípio substantivado que designa os moradores da terra.
- source_word: וְנִכְבְּשָׁה הָאָרֶץ
  choice: e a terra foi subjugada
  rationale: Reproduz a voz passiva do nifal de כבש e apresenta a conquista como fato consumado.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Preserva o sentido espacial e relacional de לִפְנֵי, que também pode implicar presença e autoridade.
- source_word: וְלִפְנֵי עַמּוֹ
  choice: e diante do seu povo
  rationale: Mantém o paralelismo com a expressão anterior e conserva a referência pronominal sem explicitação no corpo do versículo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o Tetragrama; a transliteração preserva o nome pessoal e evita substituí-lo por um título.
- issue: Referente do sufixo em עַמּוֹ ('seu povo')
  choice: O pronome é mantido sem explicitação no texto, sendo Yahweh o referente mais provável
  alternative: O pronome pode ser entendido como referência a Davi
  rationale: A proximidade e a coordenação — 'diante de Yahweh e diante do seu povo' — favorecem Yahweh como referente, mas a forma hebraica isoladamente não elimina por completo a referência a Davi; a nota preserva essa ambiguidade.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formulação natural para leitores brasileiros. Emprega 'vocês' e mantém 'Yahweh', a metáfora das mãos e o paralelismo 'diante de... diante de'. O marcador [a] aparece no texto principal.
