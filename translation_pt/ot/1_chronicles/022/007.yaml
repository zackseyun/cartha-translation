source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר דָּוִ֖יד לִ/שְׁלֹמֹ֑ה בנ/ו אֲנִי֙ הָיָ֣ה עִם לְבָבִ֔/י לִ/בְנ֣וֹת בַּ֔יִת לְ/שֵׁ֖ם יְהוָ֥ה אֱלֹהָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/007.yaml
  text: And David said to Solomon his son[a], “As for me[b], it was in my heart to build a house for the name of Yahweh my God.”
translation:
  language: pt
  text: 'Davi disse a seu filho Salomão: “Quanto a mim, estava no meu coração[a] construir uma casa[b] para o nome de Yahweh, meu Deus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eu tinha no coração”. A expressão hebraica indica a intenção ou resolução interior de Davi.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “um templo”. Literalmente, “uma casa” para o nome de Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: O waw consecutivo dá continuidade à narrativa. Em português, essa progressão é transmitida naturalmente sem a necessidade de acrescentar uma conjunção.
- source_word: לִשְׁלֹמֹה בְנוֹ
  choice: a seu filho Salomão
  rationale: Expressa com clareza e naturalidade tanto o destinatário quanto a relação filial presentes no hebraico.
- source_word: אֲנִי
  choice: Quanto a mim
  rationale: Preserva a ênfase do pronome pessoal explícito no hebraico.
- source_word: הָיָה עִם לְבָבִי
  choice: estava no meu coração
  rationale: Conserva a imagem hebraica do coração como sede da intenção ou resolução, em linguagem compreensível em português.
- source_word: לִבְנוֹת בַּיִת
  choice: construir uma casa
  rationale: Mantém o sentido literal de בַּיִת e a expressão bíblica de uma casa dedicada ao nome de Deus; o referente é o templo.
- source_word: לְשֵׁם
  choice: para o nome de
  rationale: Preserva a formulação teológica e cultual do hebraico, em vez de reduzi-la simplesmente a 'para' ou explicá-la como homenagem.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, preservando-o como nome pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהָי
  choice: meu Deus
  rationale: Mantém o sufixo de primeira pessoa do singular e a relação pessoal explicitada por Davi.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama. 'Yahweh' preserva o nome divino em vez de substituí-lo por um título.
- issue: Sentido de בַּיִת no contexto do santuário
  choice: casa
  alternative: templo
  rationale: Embora o referente seja o templo, o hebraico emprega 'casa'. A tradução mantém essa dicção teológica e registra a explicitação possível em nota.
- issue: Expressão idiomática הָיָה עִם לְבָבִי
  choice: estava no meu coração
  alternative: eu tinha no coração; eu pretendia
  rationale: A opção escolhida preserva a imagem do original sem eliminar seu sentido de intenção ou resolução interior.
translation_notes:
  register: Português moderno, claro e digno, de leitura natural no Brasil e compreensível internacionalmente. A formulação mantém a ênfase de “Quanto a mim”, a imagem do coração e a expressão teológica “para o nome de Yahweh”.
