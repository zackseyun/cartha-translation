language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אָ֣ז תַּצְלִ֔יחַ אִם תִּשְׁמ֗וֹר לַ/עֲשׂוֹת֙ אֶת הַֽ/חֻקִּ֣ים וְ/אֶת הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה עַל יִשְׂרָאֵ֑ל חֲזַ֣ק וֶ/אֱמָ֔ץ אַל תִּירָ֖א וְ/אַל תֵּחָֽת־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/013.yaml
  text: Then you will prosper[a], if you are careful to do the statutes and the judgments that Yahweh commanded Moses for Israel. Be strong and courageous. Do not fear[b], and do not be dismayed.
translation:
  language: pt
  text: Então você prosperará[a], se tiver o cuidado de cumprir os estatutos e as ordenanças que Yahweh ordenou a Moisés para Israel. Seja forte e corajoso. Não tenha medo e não desanime.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “terá êxito”. O verbo hebraico pode indicar tanto prosperar quanto ser bem-sucedido.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Marca o resultado ligado à exortação anterior, de modo natural e direto em português.
- source_word: תַּצְלִיחַ
  choice: você prosperará
  rationale: O hifil de צלח pode indicar prosperar ou ter êxito; “prosperará” preserva a amplitude do sentido no contexto da obediência.
- source_word: אִם תִּשְׁמוֹר לַעֲשׂוֹת
  choice: se tiver o cuidado de cumprir
  rationale: Expressa tanto a atenção diligente quanto a obediência efetiva implícitas no idioma hebraico.
- source_word: הַחֻקִּים
  choice: os estatutos
  rationale: Termo jurídico reconhecível que mantém a distinção em relação a מִשְׁפָּטִים.
- source_word: הַמִּשְׁפָּטִים
  choice: as ordenanças
  rationale: Representa o segundo termo legal hebraico em português corrente, sem confundi-lo com חֻקִּים.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה עַל יִשְׂרָאֵל
  choice: que Yahweh ordenou a Moisés para Israel
  rationale: Preserva Moisés como objeto direto do verbo e entende עַל contextualmente como indicação da esfera ou dos destinatários das ordens.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama.
- source_word: חֲזַק וֶאֱמָץ
  choice: Seja forte e corajoso
  rationale: Reproduz de maneira natural e digna a fórmula hebraica de exortação.
- source_word: אַל תִּירָא
  choice: Não tenha medo
  rationale: Forma idiomática e corrente em português para a proibição hebraica.
- source_word: וְאַל תֵּחָת
  choice: e não desanime
  rationale: Comunica o sentido de não se deixar abater ou desencorajar, com clareza para leitores modernos.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico contém explicitamente o Tetragrama; “Yahweh” preserva o nome próprio em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A distinção entre os dois termos jurídicos hebraicos é mantida por “estatutos” e “ordenanças”. O marcador [a] aparece no texto principal; não se acrescentou nota sem marcador correspondente.
