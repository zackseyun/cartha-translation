source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֔יד זֶ֣ה ה֔וּא בֵּ֖ית יְהוָ֣ה הָ/אֱלֹהִ֑ים וְ/זֶה מִּזְבֵּ֥חַ לְ/עֹלָ֖ה לְ/יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/001.yaml
  text: Then David said[a], “This is the house of Yahweh God[b], and this is the altar for burnt offering for Israel.”
translation:
  language: pt
  text: 'Então Davi disse: “Esta é a casa de Yahweh Deus e este é o altar de holocaustos para Israel.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo dá sequência à narrativa; “Então” expressa essa progressão de modo natural em português.
- source_word: דָּוִיד
  choice: Davi
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: זֶה הוּא
  choice: Esta é
  rationale: Preserva a identificação enfática e direta do hebraico, sem acrescentar a ideia interpretativa de “este é o lugar”.
- source_word: בֵּית
  choice: casa
  rationale: Traduz literalmente o substantivo hebraico e conserva sua ressonância teológica; “templo” explicitaria o referente, mas seria mais interpretativo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto, em vez de substituí-lo por um título.
- source_word: הָאֱלֹהִים
  choice: Deus
  rationale: 'Funciona em aposição ao nome divino: “Yahweh Deus”.'
- source_word: מִּזְבֵּחַ
  choice: altar
  rationale: Equivalente português corrente para a estrutura sacrificial indicada pelo substantivo hebraico.
- source_word: לְעֹלָה
  choice: de holocaustos
  rationale: Embora o hebraico esteja no singular, o substantivo pode ter sentido genérico ou coletivo; o plural é natural em português para indicar a categoria de sacrifícios oferecidos no altar.
- source_word: לְיִשְׂרָאֵל
  choice: para Israel
  rationale: Reproduz de modo conciso a relação indicada pela preposição hebraica, sem expandir desnecessariamente para “o povo de Israel”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o tetragrama. “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Tradução de בֵּית יְהוָה הָאֱלֹהִים
  choice: a casa de Yahweh Deus
  alternative: o templo de Yahweh Deus
  rationale: “Casa” corresponde ao termo hebraico e mantém sua amplitude e ressonância; “templo” identifica corretamente o referente contextual, mas resolve a expressão de maneira mais interpretativa.
- issue: Número de עֹלָה
  choice: holocaustos
  alternative: holocausto
  rationale: O singular hebraico pode ser genérico ou coletivo. O plural em português comunica naturalmente o tipo recorrente de oferta, sem afirmar que o hebraico esteja morfologicamente no plural.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe direta. Mantém “casa” e o nome divino “Yahweh”, enquanto usa “holocaustos” no sentido sacrificial bíblico tradicional.
