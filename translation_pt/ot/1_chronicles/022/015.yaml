  text: וְ/עִמְּ/ךָ֤ לָ/רֹב֙ עֹשֵׂ֣י מְלָאכָ֔ה חֹצְבִ֕ים וְ/חָרָשֵׁ֥י אֶ֖בֶן וָ/עֵ֑ץ וְ/כָל חָכָ֖ם בְּ/כָל מְלָאכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/015.yaml
  text: 'And with you in abundance are workers for the task: stonecutters[a], and craftsmen of stone and wood, and every skilled man for every kind of work.'
translation:
  language: pt
  text: 'E com você há muitos trabalhadores para a obra: cortadores de pedra, artesãos que trabalham com pedra e madeira, e todo homem hábil[a] em todo tipo de trabalho.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todo trabalhador hábil”. O hebraico está literalmente no masculino singular, “todo homem hábil”, empregado aqui em sentido representativo para os trabalhadores especializados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעִמְּךָ
  choice: E com você há
  rationale: Preserva a ligação com o contexto anterior e a referência direta a Salomão, acrescentando o verbo existencial exigido pelo português natural.
- source_word: לָרֹב
  choice: muitos
  rationale: Expressa de modo claro e corrente a grande quantidade indicada pela locução hebraica.
- source_word: עֹשֵׂי מְלָאכָה
  choice: trabalhadores para a obra
  rationale: Designa as pessoas encarregadas do trabalho e mantém a obra de construção como referente concreto.
- source_word: חֹצְבִים
  choice: cortadores de pedra
  rationale: No contexto de construção, o particípio designa trabalhadores que cortam ou lavram pedra; o objeto implícito é explicitado para maior clareza.
- source_word: וְחָרָשֵׁי אֶבֶן וָעֵץ
  choice: artesãos que trabalham com pedra e madeira
  rationale: Comunica tanto a habilidade profissional de חָרָשׁ quanto os materiais indicados, em formulação natural em português.
- source_word: וְכָל חָכָם
  choice: e todo homem hábil
  rationale: חָכָם denota aqui habilidade prática, não sabedoria abstrata; a formulação conserva o masculino singular representativo do hebraico.
- source_word: בְּכָל מְלָאכָה
  choice: em todo tipo de trabalho
  rationale: Reflete a preposição בְּ e comunica naturalmente a competência nas diversas modalidades de trabalho necessárias.
theological_decisions:
- issue: Linguagem de gênero em וְכָל חָכָם
  choice: todo homem hábil
  alternative: todo trabalhador hábil
  rationale: O hebraico apresenta uma forma masculina singular usada de maneira representativa. A tradução conserva essa forma sem restringir indevidamente a referência, esclarecida em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Artesãos que trabalham com” evita a construção menos natural “artesãos de pedra e madeira”; “obra” mantém o contexto do projeto de construção.
