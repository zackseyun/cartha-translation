  text: עַתָּ֣ה בְנִ֔/י יְהִ֥י יְהוָ֖ה עִמָּ֑/ךְ וְ/הִצְלַחְתָּ֗ וּ/בָנִ֨יתָ֙ בֵּ֚ית יְהוָ֣ה אֱלֹהֶ֔י/ךָ כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר עָלֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/011.yaml
  text: Now[a], my son, may Yahweh be with you, and may you prosper and build the house of Yahweh your God[c][b], as he has spoken concerning you.
translation:
  language: pt
  text: Agora, meu filho, que Yahweh esteja com você, e que você tenha êxito[a] e construa a casa de Yahweh, seu Deus[b], conforme ele falou a seu respeito[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “prospere”. O verbo hebraico pode significar “ter êxito” ou “prosperar”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o templo de Yahweh, seu Deus”. Literalmente: “a casa de Yahweh, seu Deus”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “conforme ele prometeu a seu respeito”. Mais literalmente, o hebraico diz: “conforme ele falou a seu respeito”.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַתָּה
  choice: Agora
  rationale: Marca a transição para a bênção e exortação de Davi de modo natural e direto.
- source_word: בְנִי
  choice: meu filho
  rationale: Preserva o tratamento direto e o tom paterno.
- source_word: יְהִי יְהוָה עִמָּךְ
  choice: que Yahweh esteja com você
  rationale: O jussivo expressa desejo ou bênção, não mera previsão; o nome divino é transliterado como Yahweh.
- source_word: וְהִצְלַחְתָּ
  choice: e que você tenha êxito
  rationale: O hifil de צלח pode indicar ter êxito ou prosperar. Aqui, 'ter êxito' evita sugerir especificamente prosperidade material e acompanha a força optativa da bênção.
- source_word: וּבָנִיתָ
  choice: e construa
  rationale: A forma verbal, na sequência da bênção, é apresentada com força modal coordenada, sem convertê-la em simples previsão futura.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: a casa de Yahweh, seu Deus
  rationale: Mantém literalmente a imagem hebraica de 'casa', enquanto a vírgula deixa claro que 'seu Deus' se refere a Yahweh.
- source_word: כַּאֲשֶׁר דִּבֶּר עָלֶיךָ
  choice: conforme ele falou a seu respeito
  rationale: Preserva o sentido amplo de דבר + על sem especificá-lo como promessa, embora o contexto permita essa compreensão.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- issue: Força da sequência verbal dirigida a Salomão
  choice: 'Bênção ou desejo: ''que... esteja... e que... tenha êxito e construa'''
  alternative: 'Predição: ''estará... terá êxito e construirá'''
  rationale: O jussivo inicial יְהִי favorece uma leitura beneditória, cuja força se estende naturalmente à sequência, embora as formas seguintes também possam soar como resultado esperado.
- issue: Sentido de 'casa de Yahweh'
  choice: casa de Yahweh
  alternative: templo de Yahweh
  rationale: '''Casa'' conserva a expressão e a imagem teológica do hebraico; ''templo'' esclarece o referente, mas é mais interpretativo.'
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação preserva o tom paterno e beneditório, mantém 'casa' no texto principal e registra em notas as alternativas lexicais e contextuais genuínas.
