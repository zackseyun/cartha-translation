  text: Then David commanded all the leaders of Israel to help Solomon his son.
translation:
  language: pt
  text: Então Davi ordenou a todos os líderes de Israel que ajudassem Salomão, seu filho.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: Então Davi ordenou
  rationale: O wayyiqtol de צוה faz a narrativa avançar e expressa uma determinação dotada de autoridade. “Então” comunica com naturalidade a sequência narrativa.
- source_word: שָׂרֵי
  choice: líderes
  rationale: שָׂרִים designa autoridades ou dirigentes. “Líderes” é atual, claro e suficientemente abrangente, sem restringir o termo a um cargo específico.
- source_word: לְכָל שָׂרֵי יִשְׂרָאֵל
  choice: a todos os líderes de Israel
  rationale: A formulação preserva tanto a abrangência de כָל quanto a relação dos líderes com Israel.
- source_word: לַעְזֹר
  choice: que ajudassem
  rationale: O infinitivo de עזר expressa o conteúdo ou propósito da ordem. Em português, a oração com “que” após “ordenou” é mais natural do que “ordenou ... a ajudar” e mantém o sentido de prestar auxílio.
- source_word: לִשְׁלֹמֹה בְנוֹ
  choice: seu filho Salomão
  rationale: A expressão identifica Salomão como filho de Davi. Esta ordem das palavras é idiomática em português e evita a possível rigidez de “Salomão, seu filho”.
