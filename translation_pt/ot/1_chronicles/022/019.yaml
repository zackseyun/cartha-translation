  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עַתָּ֗ה תְּנ֤וּ לְבַבְ/כֶם֙ וְ/נַפְשְׁ/כֶ֔ם לִ/דְר֖וֹשׁ לַ/יהוָ֣ה אֱלֹהֵי/כֶ֑ם וְ/ק֗וּמוּ וּ/בְנוּ֙ אֶת מִקְדַּשׁ֙ יְהוָ֣ה הָֽ/אֱלֹהִ֔ים לְ/הָבִ֞יא אֶת אֲר֣וֹן בְּרִית יְהוָ֗ה וּ/כְלֵי֙ קֹ֣דֶשׁ הָֽ/אֱלֹהִ֔ים לַ/בַּ֖יִת הַ/נִּבְנֶ֥ה לְ/שֵׁם יְהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/019.yaml
  text: Now set your heart and your soul to seek Yahweh your God[a]. Rise up and build the sanctuary of Yahweh God[b], to bring the ark of the covenant of Yahweh and the holy vessels of God into the house that is to be built for the name of Yahweh.
translation:
  language: pt
  text: Agora, dediquem seu coração e sua alma a buscar Yahweh, seu Deus.[a] Levantem-se e construam o santuário de Yahweh Deus, a fim de levar a arca da aliança de Yahweh e os utensílios sagrados de Deus para a casa que será construída para o nome de Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “deem seu coração e sua alma para buscar Yahweh, seu Deus”.'
    reason: lexical_alternative
  - marker: b
    text: A “casa” é o edifício do templo que será construído para o nome de Yahweh.
    reason: cultural_note
lexical_decisions:
- source_word: עַתָּה
  choice: Agora
  rationale: Marca a transição para uma exortação imediata e urgente, de modo natural em português.
- source_word: תְּנוּ לְבַבְכֶם וְנַפְשְׁכֶם
  choice: disponham o coração e a alma
  rationale: A expressão hebraica significa literalmente “deem o coração e a alma”. “Disponham” comunica decisão e dedicação sem reduzir os dois termos a uma abstração única.
- source_word: לְבָב / נֶפֶשׁ
  choice: coração e alma
  rationale: Mantém explicitamente o par antropológico hebraico e sua força retórica, sem lhe impor uma divisão técnica das faculdades humanas.
- source_word: לִדְרוֹשׁ
  choice: buscar
  rationale: No contexto da relação com Deus, o verbo expressa voltar-se para ele com devoção e dependência; “buscar” é claro e consagrado em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em conformidade com a orientação do projeto.
- source_word: וְקוּמוּ וּבְנוּ
  choice: Levantem-se e construam
  rationale: Reproduz a sequência coordenada de imperativos plurais com tom digno e atual.
- source_word: מִקְדַּשׁ
  choice: santuário
  rationale: Designa o lugar santo e evita substituir o termo pelo mais amplo “templo”, especialmente porque a frase seguinte também menciona a casa a ser construída.
- source_word: יְהוָה הָאֱלֹהִים
  choice: Yahweh Deus
  rationale: Preserva de modo direto a justaposição hebraica do nome divino e do título אֱלֹהִים, sem inserir pontuação interpretativa.
- source_word: לְהָבִיא
  choice: a fim de levar
  rationale: Torna explícito, de maneira natural, o valor de finalidade do infinitivo hebraico.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: a arca da aliança de Yahweh
  rationale: Conserva claramente a cadeia genitiva e a ligação da aliança com Yahweh.
- source_word: כְלֵי קֹדֶשׁ הָאֱלֹהִים
  choice: os utensílios sagrados de Deus
  rationale: “Utensílios” abrange os objetos empregados no serviço sagrado sem especificar uma categoria mais estreita que o hebraico.
- source_word: לַבַּיִת הַנִּבְנֶה לְשֵׁם יְהוָה
  choice: para a casa que será construída para o nome de Yahweh
  rationale: Mantém a metáfora cultual de “casa”, o caráter futuro/passivo da construção e a fórmula teológica “para o nome de Yahweh”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: O par “coração e alma”
  choice: Manter os dois termos explicitamente
  alternative: todo o ser; mente e coração
  rationale: O hebraico emprega dois termos para intensificar a dedicação integral. Mantê-los preserva a tensão antropológica e retórica sem definir uma psicologia técnica.
- issue: A fórmula יְהוָה הָאֱלֹהִים
  choice: Yahweh Deus
  alternative: Yahweh, o Deus; o SENHOR Deus
  rationale: A opção conserva a forma compacta do hebraico e evita decidir se אֱלֹהִים deve ser entendido como título apositivo ou parte de uma designação composta.
- issue: Construção “para o nome de Yahweh”
  choice: Preservar a referência ao nome
  alternative: em honra de Yahweh; para Yahweh
  rationale: A formulação possui relevância teológica própria e não deve ser explicada ou simplificada dentro do texto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com imperativos no plural. A formulação preserva “coração e alma”, “santuário”, “casa” e “para o nome de Yahweh”, evitando tanto arcaísmos desnecessários quanto paráfrases teologicamente redutoras.
