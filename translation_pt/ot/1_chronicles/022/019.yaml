  source_fidelity: A tradução preserva adequadamente a sequência de imperativos, o par hebraico “coração e alma”, a finalidade de buscar Yahweh, a distinção entre “santuário” e “casa”, a arca, os objetos santos e a fórmula “para o nome de Yahweh”. “A fim de levar” comunica corretamente o infinitivo de propósito. Contudo, “disponham o coração e a alma” não é uma formulação portuguesa suficientemente clara ou idiomática para o sentido de dedicação expresso por תְּנוּ.
  naturalness: “Dediquem seu coração e sua alma a buscar” é uma construção atual, clara e digna, que conserva os dois termos hebraicos e a ideia de entregar/dedicar-se. O restante do versículo é natural e apropriado ao registro bíblico moderno.
