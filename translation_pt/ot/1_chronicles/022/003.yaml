base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/003.yaml
  text: And David prepared iron in abundance for the nails for the doors of the gates and for the fastenings[b][a], and bronze in abundance without weight.
translation:
  language: pt
  text: Davi preparou ferro em grande quantidade para os pregos das portas dos portões e para as peças de ligação[a], e bronze em tão grande quantidade que não se podia pesar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dobradiças”. O termo hebraico é mais amplo e designa peças que ligam ou unem.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “não havia peso”, isto é, a quantidade era grande demais para ser pesada.'
    reason: idiom_clarification
lexical_decisions:
- source_word: בַרְזֶל
  choice: ferro
  rationale: Designa diretamente o ferro como material de construção.
- source_word: לָרֹב
  choice: em grande quantidade
  rationale: Expressa abundância de modo natural e claro no contexto de provisão de materiais.
- source_word: מִּסְמְרִים
  choice: pregos
  rationale: É o equivalente mais natural no contexto das portas, sem especificar indevidamente tamanho ou formato.
- source_word: דַלְתוֹת הַשְּׁעָרִים
  choice: as portas dos portões
  rationale: Mantém a relação construta do hebraico e distingue as folhas móveis das estruturas de entrada.
- source_word: מְחַבְּרוֹת
  choice: peças de ligação
  rationale: Preserva o sentido amplo de componentes que unem ou conectam, sem restringi-los necessariamente a dobradiças.
- source_word: הֵכִין
  choice: preparou
  rationale: Reflete o ato de providenciar e deixar prontos os materiais para a construção.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: No contexto de materiais bíblicos de construção, é a designação contextual tradicional e provável do metal ou liga.
- source_word: אֵין מִשְׁקָל
  choice: em tão grande quantidade que não se podia pesar
  rationale: 'Comunica naturalmente a força idiomática da expressão: a quantidade era grande demais para ser pesada, e não que o metal carecesse literalmente de peso.'
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem da frase acompanha de perto o hebraico, enquanto a expressão final é vertida idiomaticamente para evitar a leitura literal equivocada de que o bronze não tinha peso.
