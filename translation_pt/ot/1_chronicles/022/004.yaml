  text: וַ/עֲצֵ֥י אֲרָזִ֖ים לְ/אֵ֣ין מִסְפָּ֑ר כִּֽי הֵ֠בִיאוּ הַ/צִּֽידֹנִ֨ים וְ/הַ/צֹּרִ֜ים עֲצֵ֧י אֲרָזִ֛ים לָ/רֹ֖ב לְ/דָוִֽיד׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/004.yaml
  text: and cedar timbers without number[a], for the Sidonians and Tyrians had brought cedar timbers in abundance to David.
translation:
  language: pt
  text: e madeira de cedro em quantidade impossível de contar[a], pois os sidônios e os tírios haviam trazido madeira de cedro em abundância a Davi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “toras de cedro”. O hebraico pode referir-se de modo amplo à madeira de cedro; neste contexto de construção, provavelmente se trata de madeira preparada para esse fim.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/עֲצֵי אֲרָזִים
  choice: e madeira de cedro
  rationale: No contexto de materiais para construção, עֲצֵי אֲרָזִים designa a madeira proveniente de cedros, não árvores ainda em pé. “Madeira de cedro” é natural e abrangente em português; uma nota registra a alternativa mais específica “toras de cedro”.
- source_word: לְ/אֵין מִסְפָּר
  choice: em quantidade impossível de contar
  rationale: A expressão hebraica indica uma quantidade inumerável. Esta formulação comunica o sentido com clareza e naturalidade, sem exigir a leitura literal menos idiomática “sem número”.
- source_word: כִּי
  choice: pois
  rationale: Aqui כִּי introduz a explicação da quantidade mencionada anteriormente. “Pois” mantém a ligação causal e o tom narrativo digno.
- source_word: הֵבִיאוּ
  choice: haviam trazido
  rationale: O perfeito hebraico expressa a ação de trazer. O mais-que-perfeito composto esclarece em português que esse fornecimento explica a disponibilidade já mencionada no contexto narrativo.
- source_word: הַ/צִּידֹנִים
  choice: os sidônios
  rationale: Gentílico plural referente aos habitantes de Sidom; “sidônios” é a forma portuguesa tradicional e concisa.
- source_word: וְ/הַ/צֹּרִים
  choice: e os tírios
  rationale: Gentílico plural referente aos habitantes de Tiro; “tírios” é a forma portuguesa padrão e corresponde bem a “sidônios”.
- source_word: לָ/רֹב
  choice: em abundância
  rationale: A locução denota grande quantidade. “Em abundância” é natural em português e apropriado ao contexto de fornecimento de materiais.
- source_word: לְ/דָוִד
  choice: a Davi
  rationale: A preposição לְ marca aqui o destinatário; “a Davi” preserva diretamente essa relação sem interpretar o material apenas como destinado ao seu benefício.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantém-se a continuação sintática do versículo anterior por meio do “e” inicial. Os gentílicos tradicionais “sidônios” e “tírios” preservam concisão e familiaridade bíblica.
