  text: וַ/יֹּ֣אמֶר דָּוִ֔יד לִ/כְנוֹס֙ אֶת הַ/גֵּרִ֔ים אֲשֶׁ֖ר בְּ/אֶ֣רֶץ יִשְׂרָאֵ֑ל וַ/יַּעֲמֵ֣ד חֹֽצְבִ֗ים לַ/חְצוֹב֙ אַבְנֵ֣י גָזִ֔ית לִ/בְנ֖וֹת בֵּ֥ית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/002.yaml
  text: And David ordered the foreigners who were in the land of Israel to be gathered[c][b][a], and he appointed stonecutters to cut dressed stones for building the house of God.
translation:
  language: pt
  text: Davi ordenou que fossem reunidos os estrangeiros residentes[a] na terra de Israel e designou cortadores de pedra para lavrar pedras de cantaria[b] destinadas à construção da casa de Deus.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os residentes estrangeiros”. O hebraico se refere a não israelitas que viviam na terra.
    reason: lexical_alternative
  - marker: b
    text: Isto é, pedras cortadas e aparelhadas para construção; também se pode traduzir por “pedras lavradas”.
    reason: lexical_alternative
  - marker: c
    text: Isto é, o templo.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ordenou
  rationale: Embora o verbo signifique literalmente “disse”, seguido do infinitivo ele introduz aqui uma ordem; “ordenou” expressa essa força diretiva em português natural.
- source_word: לִכְנוֹס
  choice: que fossem reunidos
  rationale: O infinitivo apresenta o conteúdo da ordem. A construção passiva deixa claro que Davi mandou outros reunir essas pessoas.
- source_word: הַגֵּרִים
  choice: os estrangeiros residentes
  rationale: גֵּרִים designa não israelitas que residiam na terra. A expressão evita tanto a ideia de simples visitantes quanto o tom burocrático de “estrangeiros residentes legais”.
- source_word: בְּאֶרֶץ יִשְׂרָאֵל
  choice: na terra de Israel
  rationale: Mantém explicitamente אֶרֶץ e o sentido territorial da expressão.
- source_word: וַיַּעֲמֵד
  choice: designou
  rationale: No contexto administrativo, o verbo indica que Davi encarregou trabalhadores de uma função específica.
- source_word: חֹצְבִים
  choice: cortadores de pedra
  rationale: Designa trabalhadores que extraem ou talham pedra; a formulação é clara e corrente em português.
- source_word: לַחְצוֹב
  choice: para lavrar
  rationale: “Lavrar” expressa o trabalho de cortar e preparar a pedra para construção, sem recorrer ao menos corrente “desbastar” como termo principal.
- source_word: אַבְנֵי גָזִית
  choice: pedras de cantaria
  rationale: A expressão se refere a pedras cortadas e aparelhadas para construção. “Pedras de cantaria” é precisa e inteligível, com alternativa explicada em nota.
- source_word: לִבְנוֹת
  choice: destinadas à construção
  rationale: Expressa naturalmente em português a finalidade indicada pelo infinitivo hebraico.
- source_word: בֵּית הָאֱלֹהִים
  choice: a casa de Deus
  rationale: Preserva a forma concreta do hebraico e não substitui no texto principal a expressão pelo referente interpretativo “templo”.
theological_decisions:
- issue: Sentido de בֵּית הָאֱלֹהִים
  choice: a casa de Deus
  alternative: o templo de Deus
  rationale: O projeto é o futuro templo, mas o texto hebraico diz literalmente “casa de Deus”. A tradução mantém essa expressão e esclarece o referente em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe evita literalismo rígido, mas conserva a terminologia concreta e a relação de finalidade do hebraico.
