  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הִנֵּה בֵ֞ן נוֹלָ֣ד לָ֗/ךְ ה֤וּא יִהְיֶה֙ אִ֣ישׁ מְנוּחָ֔ה וַ/הֲנִח֥וֹתִי ל֛/וֹ מִ/כָּל אוֹיְבָ֖י/ו מִ/סָּבִ֑יב כִּ֤י שְׁלֹמֹה֙ יִהְיֶ֣ה שְׁמ֔/וֹ וְ/שָׁל֥וֹם וָ/שֶׁ֛קֶט אֶתֵּ֥ן עַל יִשְׂרָאֵ֖ל בְּ/יָמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/009.yaml
  text: Behold[a], a son will be born to you. He will be a man of rest, and I will give him rest from all his enemies all around; for Solomon will be his name[b], and I will give peace and quiet to Israel in his days.
translation:
  language: pt
  text: Eis que um filho nascerá para você. Ele será um homem de descanso, e eu lhe darei descanso de todos os seus inimigos ao redor; pois Salomão será o seu nome,[a] e darei paz e tranquilidade a Israel nos dias dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, o nome “Salomão” está ligado à palavra “paz” (shalom); o versículo também o descreve como “um homem de descanso”.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Mantém a função de chamar a atenção e o tom solene do anúncio, sem recorrer a uma expressão coloquial.
- source_word: בֵן נוֹלָד לָךְ
  choice: um filho nascerá para você
  rationale: O futuro explicita o valor prospectivo do particípio no contexto da promessa; “para você” exprime de modo natural o dativo referente a Davi.
- source_word: אִישׁ מְנוּחָה
  choice: um homem de descanso
  rationale: A formulação deliberadamente próxima do hebraico preserva a repetição temática com o verbo נוח na oração seguinte, sem substituir מְנוּחָה antecipadamente por “paz”.
- source_word: וַהֲנִחוֹתִי לוֹ
  choice: e eu lhe darei descanso
  rationale: Conserva a ligação lexical com מְנוּחָה e comunica com clareza que Deus lhe concederá segurança.
- source_word: מִכָּל אוֹיְבָיו מִסָּבִיב
  choice: de todos os seus inimigos ao redor
  rationale: Preserva tanto a totalidade quanto a ideia espacial de inimigos circundantes.
- source_word: שְׁלֹמֹה יִהְיֶה שְׁמוֹ
  choice: Salomão será o seu nome
  rationale: Mantém a ênfase inicial do hebraico no nome e sua ligação sonora e temática com שָׁלוֹם.
- source_word: וְשָׁלוֹם וָשֶׁקֶט
  choice: e darei paz e tranquilidade
  rationale: Distingue os dois substantivos hebraicos e evita confundi-los com o “descanso” anteriormente expresso por outra raiz.
- source_word: בְּיָמָיו
  choice: nos dias dele
  rationale: Forma clara e corrente que se refere ao período do reinado de Salomão.
theological_decisions:
- issue: Ligação entre descanso, o nome Salomão e paz
  choice: Manter “descanso” para מְנוּחָה/נוח e “paz” para שָׁלוֹם, transliterando o nome como “Salomão”.
  alternative: Traduzir אִישׁ מְנוּחָה como “homem de paz” para tornar a relação temática mais imediata.
  rationale: O texto articula termos relacionados, mas não idênticos. A escolha conserva a distinção lexical e deixa visível a progressão de descanso para paz, sem impor uma equivalência maior do que a presente no hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A expressão menos habitual “homem de descanso” foi mantida para preservar a repetição intencional do hebraico; a nota esclarece o jogo de palavras com Salomão e paz.
