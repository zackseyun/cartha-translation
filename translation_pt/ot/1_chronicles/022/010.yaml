  text: הֽוּא יִבְנֶ֥ה בַ֨יִת֙ לִ/שְׁמִ֔/י וְ/הוּא֙ יִהְיֶה לִּ֣/י לְ/בֵ֔ן וַ/אֲנִי ל֖/וֹ לְ/אָ֑ב וַ/הֲכִ֨ינוֹתִ֜י כִּסֵּ֧א מַלְכוּת֛/וֹ עַל יִשְׂרָאֵ֖ל עַד עוֹלָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/010.yaml
  text: He will build a house for my name[a], and he will be a son to me, and I will be a father to him, and I will establish the throne of his kingdom over Israel forever.
translation:
  language: pt
  text: Ele construirá uma casa para o meu nome[a]. Ele será meu filho, e eu serei seu pai. Estabelecerei para sempre o trono do seu reino sobre Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um templo para o meu nome”. O hebraico diz literalmente “uma casa para o meu nome”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַיִת
  choice: casa
  rationale: Preserva o sentido básico do hebraico e sua expressão teológica, enquanto o contexto deixa claro que se trata do templo; a nota explicita essa referência.
- source_word: לִשְׁמִי
  choice: para o meu nome
  rationale: Tradução direta da expressão hebraica, que comunica dedicação ao nome e à presença de Deus sem desenvolver o sentido por paráfrase.
- source_word: לְבֵן / לְאָב
  choice: meu filho / seu pai
  rationale: 'Em português, os possessivos expressam com naturalidade a relação predicativa direta da fórmula pactual: literalmente, ''filho para mim'' e ''pai para ele''.'
- source_word: וַהֲכִינוֹתִי
  choice: Firmarei
  rationale: O hifil de כון indica tornar firme, consolidar ou estabelecer. 'Firmarei' é claro, digno e mantém essa imagem verbal.
- source_word: כִּסֵּא מַלְכוּתוֹ
  choice: o trono do seu reino
  rationale: Conserva os dois elementos do hebraico — trono e reino — e, portanto, a dimensão régia e dinástica da promessa.
- source_word: עַל יִשְׂרָאֵל
  choice: sobre Israel
  rationale: Com governo régio, עַל indica domínio ou reinado sobre alguém.
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: Expressão portuguesa corrente que preserva a força duradoura e aberta da promessa hebraica.
theological_decisions:
- issue: Fórmula pactual de pai e filho aplicada a Salomão, com relevância canônica para a promessa davídica
  choice: Ele será meu filho, e eu serei seu pai.
  alternative: Eu o tratarei como filho, e serei como um pai para ele.
  rationale: A formulação direta preserva tanto a referência imediata a Salomão quanto a tensão e o alcance canônico da promessa, sem reduzir a filiação a mera comparação nem impor uma conclusão doutrinária posterior.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A estrutura foi dividida em três frases para fluidez, sem alterar as relações sintáticas ou teológicas do hebraico.
