  text: לַ/זָּהָ֥ב לַ/כֶּ֛סֶף וְ/לַ/נְּחֹ֥שֶׁת וְ/לַ/בַּרְזֶ֖ל אֵ֣ין מִסְפָּ֑ר ק֣וּם וַ/עֲשֵׂ֔ה וִ/יהִ֥י יְהוָ֖ה עִמָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/016.yaml
  text: For the gold[a], the silver, the bronze, and the iron, there is no number. Rise up and work[c][b], and may Yahweh be with you.
translation:
  language: pt
  text: Quanto ao ouro, à prata, ao bronze[b] e ao ferro, não há como contá-los[a]. Levante-se e trabalhe, e que Yahweh esteja com você[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também: “não têm conta” ou “são incontáveis”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “bronze”; em alguns contextos, o termo também pode ser traduzido por “cobre”.'
    reason: lexical_alternative
  - marker: c
    text: Também pode ser entendido como “e Yahweh estará com você” ou “e que Yahweh fique com você”. A forma hebraica pode expressar um desejo ou uma bênção.
    reason: alternative_reading
lexical_decisions:
- source_word: לַזָּהָב לַכֶּסֶף וְלַנְּחֹשֶׁת וְלַבַּרְזֶל
  choice: Quanto ao ouro, à prata, ao bronze e ao ferro
  rationale: As preposições לְ introduzem os materiais como tópico, retomando os preparativos mencionados no contexto anterior. A construção com “quanto a” conserva essa força tópica em português natural.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: Em listas de materiais de construção e utensílios do mundo antigo, o termo costuma designar bronze, embora “cobre” continue sendo uma alternativa lexical possível.
- source_word: אֵין מִסְפָּר
  choice: não há como contá-los
  rationale: A expressão idiomática indica quantidade incontável. Esta formulação comunica o sentido com clareza sem reduzir a afirmação a um número apenas elevado.
- source_word: קוּם
  choice: Levante-se
  rationale: O imperativo exorta Salomão a passar à ação. “Levante-se” mantém o tom digno e é corrente no português moderno.
- source_word: וַעֲשֵׂה
  choice: e trabalhe
  rationale: Neste contexto de preparação e construção do templo, עשה se refere concretamente à execução da obra; “trabalhe” é mais claro que o genérico “faça”.
- source_word: וִיהִי יְהוָה עִמָּךְ
  choice: e que Yahweh esteja com você
  rationale: A forma volitiva expressa naturalmente um desejo ou uma bênção. “Esteja com você” reproduz a expressão hebraica de presença e auxílio.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama. “Yahweh” preserva o nome pessoal da aliança e evita substituí-lo por um título, sem acrescentar uma interpretação denominacional.
- issue: Valor da forma וִיהִי na declaração final
  choice: 'desejo ou bênção: “que Yahweh esteja com você”'
  alternative: 'promessa futura: “Yahweh estará com você”; permissão/exortação: “que Yahweh fique com você”'
  rationale: A forma jussiva favorece o valor volitivo, mas a nota conserva a possibilidade de entendê-la como declaração futura, sem resolver silenciosamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Quanto ao” preserva a introdução tópica dos materiais; “Levante-se e trabalhe” mantém a sequência direta dos imperativos. O pronome “você” é usado por sua compreensão ampla no português brasileiro contemporâneo.
