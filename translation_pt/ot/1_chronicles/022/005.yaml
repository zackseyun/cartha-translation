base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/005.yaml
  text: And David said[a], “My son Solomon is young and inexperienced, and the house to be built for Yahweh must be made exceedingly great in fame and splendor in all lands[c][b]. I will now make preparation for it.” So David made abundant preparations before his death.
translation:
  language: pt
  text: 'Davi disse: “Meu filho Salomão é jovem e inexperiente[a], e a casa[b] que será construída para Yahweh deve ser extraordinariamente grandiosa, para renome e esplendor em todas as terras[c]. Farei agora os preparativos para ela.” Assim, antes de morrer, Davi fez preparativos em abundância.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “jovem e tenro”. O adjetivo hebraico pode significar “tenro”, “delicado” ou “imaturo”; aqui, provavelmente se refere à pouca experiência de Salomão.
    reason: lexical_alternative
  - marker: b
    text: Ou “templo”. Em hebraico, “casa”.
    reason: lexical_alternative
  - marker: c
    text: Ou “para nome e glória” ou “para renome e beleza”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר וָרָךְ
  choice: jovem e inexperiente
  rationale: נַעַר indica a relativa juventude de Salomão; רַךְ significa literalmente “tenro” ou “delicado”, mas, neste contexto, ressalta sua falta de maturidade e experiência para uma obra tão grande.
- source_word: הַבַּיִת
  choice: a casa
  rationale: Preserva a designação concreta do hebraico e sua ressonância teológica. O contexto deixa claro que se trata do santuário, embora “templo” seja uma tradução interpretativa possível.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo tetragrama יהוה.
- source_word: לְהַגְדִּיל לְמַעְלָה
  choice: deve ser extraordinariamente grandiosa
  rationale: Comunica a força intensiva da expressão, que apresenta a casa como grandiosa em grau excepcional.
- source_word: לְשֵׁם וּלְתִפְאֶרֶת
  choice: para ter renome e esplendor
  rationale: 'Mantém a finalidade expressa pelas preposições: a casa deveria ser conhecida e magnífica. “Renome” traduz o valor contextual de שֵׁם, literalmente “nome”.'
- source_word: לְכָל הָאֲרָצוֹת
  choice: em todas as terras
  rationale: O plural aponta para os países ou regiões entre os quais a fama e o esplendor da casa seriam conhecidos.
- source_word: אָכִינָה נָּא לוֹ
  choice: Farei desde já os preparativos para ela
  rationale: O coortativo expressa a resolução de Davi; “desde já” comunica a prontidão associada a נָא. O pronome foi entendido como referência à casa ou ao projeto.
- source_word: וַיָּכֶן דָּוִיד לָרֹב
  choice: Davi fez preparativos em grande quantidade
  rationale: Reproduz explicitamente a ideia quantitativa de לָרֹב sem acrescentar quais materiais ou providências foram preparados.
- source_word: לִפְנֵי מוֹתוֹ
  choice: antes de morrer
  rationale: Expressão temporal direta e natural em português.
theological_decisions:
- issue: Forma portuguesa do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o nome divino pessoal. “Yahweh” o representa por transliteração, sem substituí-lo por um título.
- issue: Tradução de הַבַּיִת
  choice: casa
  alternative: templo
  rationale: “Casa” segue diretamente o hebraico e preserva a imagem bíblica; “templo” esclareceria o referente, mas seria mais interpretativo.
- issue: Sentido de רַךְ aplicado a Salomão
  choice: inexperiente
  alternative: tenro; imaturo
  rationale: A tradução contextual relaciona a juventude de Salomão à necessidade dos preparativos de Davi, enquanto a nota preserva o sentido literal e a ambiguidade lexical.
- issue: Referente do sufixo em לוֹ
  choice: a casa ou o projeto (“para ela”)
  alternative: Salomão (“para ele”)
  rationale: A referência ao empreendimento é a leitura contextual mais provável, mas a forma hebraica pode, gramaticalmente, apontar para Salomão.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe narrativa natural. “Extraordinariamente grandiosa” conserva a intensidade do hebraico sem soar arcaico; “em grande quantidade” evita uma formulação excessivamente literária e mantém explícita a abundância dos preparativos.
