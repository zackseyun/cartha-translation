source:
  edition: WLC
  text: וַ/יְהִ֨י עָלַ֤/י דְּבַר יְהוָה֙ לֵ/אמֹ֔ר דָּ֤ם לָ/רֹב֙ שָׁפַ֔כְתָּ וּ/מִלְחָמ֥וֹת גְּדֹל֖וֹת עָשִׂ֑יתָ לֹֽא תִבְנֶ֥ה בַ֨יִת֙ לִ/שְׁמִ֔/י כִּ֚י דָּמִ֣ים רַבִּ֔ים שָׁפַ֥כְתָּ אַ֖רְצָ/ה לְ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/008.yaml
  text: But the word of Yahweh came to me[a], saying, ‘You have shed much blood and fought great wars. You shall not build a house for my name[d][c][b], because you have shed much blood on the earth before me.’
translation:
  language: pt
  text: 'Mas a palavra de Yahweh veio a mim, dizendo: “Você derramou muito sangue[a] e travou grandes guerras[b]. Não construirá uma casa para o meu nome[c], porque derramou muito sangue sobre a terra[d] diante de mim.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sangue em abundância”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “fez grandes guerras”.'
    reason: lexical_alternative
  - marker: c
    text: 'Isto é, o templo. O hebraico diz: “uma casa para o meu nome”.'
    reason: cultural_note
  - marker: d
    text: 'Ou: “ao chão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Preserva a fórmula profética e traduz diretamente o nome divino יְהוָה como “Yahweh”.
- source_word: וַיְהִי עָלַי
  choice: veio a mim
  rationale: Expressa em português natural o idioma hebraico segundo o qual a palavra divina esteve ou veio sobre o receptor.
- source_word: דָּם לָרֹב
  choice: muito sangue
  rationale: Mantém a imagem concreta do sangue e comunica sua grande quantidade sem recorrer a uma abstração.
- source_word: שָׁפַכְתָּ
  choice: derramou
  rationale: Com “sangue” como objeto, corresponde ao idioma português “derramar sangue”.
- source_word: וּמִלְחָמוֹת גְּדֹלוֹת עָשִׂיתָ
  choice: travou grandes guerras
  rationale: É a forma idiomática e corrente de comunicar em português a expressão literalmente equivalente a “fez grandes guerras”.
- source_word: לֹא תִבְנֶה בַיִת לִשְׁמִי
  choice: Não construirá uma casa para o meu nome
  rationale: Conserva tanto “casa” quanto “para o meu nome”, preservando a imagem hebraica e a linguagem teológica sem substituir o referente por “templo” no texto principal.
- source_word: כִּי
  choice: porque
  rationale: Introduz claramente a razão da proibição.
- source_word: דָּמִים רַבִּים
  choice: muito sangue
  rationale: Mantém a repetição e a imagem concreta do original, embora o plural hebraico também possa sugerir derramamento de sangue ou culpa de sangue.
- source_word: אַרְצָה
  choice: sobre a terra
  rationale: Representa a forma direcional hebraica de modo natural no contexto; “ao chão” continua sendo uma alternativa possível.
- source_word: לְפָנַי
  choice: diante de mim
  rationale: Preserva a força da afirmação de que o sangue foi derramado na presença e à vista de Deus.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; “Yahweh” preserva o nome pactual em vez de substituí-lo por um título.
- issue: Sentido de בַיִת
  choice: casa
  alternative: templo
  rationale: Embora o referente seja o templo, “casa” traduz o substantivo hebraico e conserva o motivo bíblico da casa de Deus.
- issue: Modalidade de לֹא תִבְנֶה
  choice: Não construirá
  alternative: Não construa; você não poderá construir
  rationale: A forma hebraica pode funcionar como declaração enfática ou proibição. “Não construirá” preserva essa tensão sem explicitar uma modalidade que o texto não determina inteiramente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “a palavra de Yahweh veio a mim” mantém a fórmula bíblica sem soar excessivamente arcaica. A repetição de “muito sangue” foi preservada por ser retoricamente significativa no hebraico.
