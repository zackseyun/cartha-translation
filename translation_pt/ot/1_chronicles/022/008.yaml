  source_fidelity: 'O texto traduz fielmente a construção hebraica: a palavra de Yahweh veio a Davi; o motivo apresentado é o amplo derramamento de sangue e as grandes guerras; e a consequência é que ele não edificará uma casa para o nome divino. A repetição de «muito sangue» preserva adequadamente a ênfase do original. «Sobre a terra» é uma opção contextual defensável para אַרְצָה, com a alternativa «ao chão» devidamente anotada.'
  naturalness: O português é moderno, claro e de registro bíblico sóbrio. «Travou grandes guerras», «construirá uma casa para o meu nome» e «diante de mim» soam naturais e mantêm proximidade apropriada ao texto-fonte. O uso de «Você» é coerente com a legibilidade brasileira e não compromete a dignidade do discurso.
  terminology: «Yahweh» corresponde ao Tetragrama conforme a decisão editorial fornecida. «Casa» preserva o termo hebraico sem antecipar interpretativamente «templo» no texto principal; a nota identifica com precisão o referente. As notas lexicais estão ancoradas nos elementos pertinentes e exprimem alternativas legítimas.
