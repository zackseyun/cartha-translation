  text: וַ/יֹּ֨אמֶר דָּוִ֜יד לִ/שְׁלֹמֹ֣ה בְנ֗/וֹ חֲזַ֤ק וֶ/אֱמַץ֙ וַ/עֲשֵׂ֔ה אַל תִּירָ֖א וְ/אַל תֵּחָ֑ת כִּי֩ יְהוָ֨ה אֱלֹהִ֤ים אֱלֹהַ/י֙ עִמָּ֔/ךְ לֹ֤א יַרְפְּ/ךָ֙ וְ/לֹ֣א יַֽעַזְבֶ֔/ךָּ עַד לִ/כְל֕וֹת כָּל מְלֶ֖אכֶת עֲבוֹדַ֥ת בֵּית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/020.yaml
  text: And David said to Solomon his son[a], “Be strong and courageous, and do it. Do not fear or be dismayed, for Yahweh God, my God, is with you. He will not fail you or forsake you until all the work for the service of the house of Yahweh is finished.”
translation:
  language: pt
  text: 'Davi disse a seu filho Salomão: “Seja forte e corajoso e faça isso. Não tenha medo nem desanime, pois Yahweh Deus, o meu Deus, está com você. Ele não o deixará desamparado[a] nem o abandonará, até que termine toda a obra do serviço da casa de Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não soltará você”; o verbo hebraico pode transmitir a ideia de não afrouxar o apoio ou não deixar alguém cair.'
    reason: Registra a imagem e a alternativa lexical do verbo רפה, que a expressão idiomática “deixar desamparado” não torna plenamente explícita.
lexical_decisions:
- source_word: חֲזַק וֶאֱמַץ
  choice: Seja forte e corajoso
  rationale: Reproduz a dupla exortação hebraica com uma formulação natural e consagrada em português, mantendo tanto a força quanto a firmeza de ânimo.
- source_word: וַעֲשֵׂה
  choice: e faça isso
  rationale: Conserva a ordem direta e orientada à ação; “isso” retoma, pelo contexto, a obra do templo sem acrescentar uma especificação ausente do verbo hebraico.
- source_word: אַל תִּירָא וְאַל תֵּחָת
  choice: Não tenha medo nem desanime
  rationale: 'Expressa as duas proibições: não temer e não perder a firmeza ou deixar-se abater. A redação é clara e atual em português.'
- source_word: יְהוָה אֱלֹהִים אֱלֹהַי
  choice: Yahweh Deus, o meu Deus
  rationale: Mantém o nome divino e a sequência enfática do hebraico, incluindo a relação pessoal indicada por “meu Deus”.
- source_word: עִמָּךְ
  choice: está com você
  rationale: A frase nominal hebraica afirma a presença de Deus; o presente em português preserva essa afirmação direta.
- source_word: לֹא יַרְפְּךָ
  choice: não o deixará desamparado
  rationale: Comunica que Deus não afrouxará seu apoio nem deixará Salomão sem auxílio. A nota registra de modo mais literal a imagem possível do verbo.
- source_word: וְלֹא יַעַזְבֶךָּ
  choice: nem o abandonará
  rationale: Traduz diretamente a garantia de que Deus não deixará Salomão, preservando a distinção possível em relação ao verbo anterior.
- source_word: עַד לִכְלוֹת
  choice: até que termine
  rationale: Mantém a indicação hebraica do ponto até o qual a promessa é explicitamente relacionada à tarefa, sem resolver a possível tensão temporal.
- source_word: כָּל מְלֶאכֶת עֲבוֹדַת בֵּית יְהוָה
  choice: toda a obra do serviço da casa de Yahweh
  rationale: Preserva os dois elementos da cadeia construta, “obra” e “serviço”, e mantém “casa de Yahweh” como designação do templo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto traz o nome pessoal divino, não um título. A transliteração “Yahweh” o preserva sem substituí-lo por “Senhor”.
- issue: Alcance temporal de עַד לִכְלוֹת
  choice: até que termine
  alternative: durante toda a realização da obra
  rationale: A tradução conserva o marcador temporal do hebraico e não amplia nem restringe silenciosamente a promessa para resolver uma possível inferência sobre o período posterior à conclusão da obra.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construções de boa legibilidade brasileira. Emprega “você” para comunicar com naturalidade o singular dirigido a Salomão, sem perder a solenidade do discurso.
