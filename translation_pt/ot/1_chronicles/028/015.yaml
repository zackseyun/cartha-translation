base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/015.yaml
  text: and the weight for the lampstands of gold and their lamps of gold[a], by the weight of each lampstand and its lamps; and for the lampstands of silver, by weight for each lampstand and its lamps, according to the service of each lampstand.
translation:
  language: pt
  text: e o peso para os candelabros de ouro e suas lâmpadas de ouro, conforme o peso de cada candelabro e de suas lâmpadas; e, para os candelabros de prata, o peso de cada candelabro e de suas lâmpadas, de acordo com a função de cada candelabro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente “candelabro e candelabro”, tanto na expressão sobre o peso como na expressão sobre a função; essa repetição tem sentido distributivo: cada candelabro individualmente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁקָל
  choice: peso
  rationale: O substantivo indica peso medido ou quantidade determinada por peso no contexto dos materiais do templo.
- source_word: מְנֹרוֹת
  choice: candelabros
  rationale: Refere-se aos suportes que sustentavam as lâmpadas, não às lâmpadas propriamente ditas; “candelabros” é a designação bíblica corrente e inteligível em português.
- source_word: נֵרֹתֵיהֶם / נֵרֹתֶיהָ
  choice: lâmpadas
  rationale: Distingue corretamente as fontes individuais de luz dos candelabros que as sustentavam.
- source_word: זָהָב / הַכֶּסֶף
  choice: ouro / prata
  rationale: Mantém os termos materiais explícitos e o paralelismo entre os dois grupos de candelabros.
- source_word: בְּמִשְׁקַל מְנוֹרָה וּמְנוֹרָה
  choice: conforme o peso de cada candelabro
  rationale: A repetição distributiva hebraica, literalmente “candelabro e candelabro”, é expressa naturalmente por “cada candelabro”.
- source_word: כַּעֲבוֹדַת מְנוֹרָה וּמְנוֹרָה
  choice: de acordo com a função de cada candelabro
  rationale: עֲבוֹדָה pode indicar serviço, uso ou função; neste contexto, “função” comunica de modo natural que o peso variava segundo a finalidade de cada candelabro, sem impor uma interpretação litúrgica mais específica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura paralela próxima ao hebraico. O versículo continua a construção sintática do contexto anterior. Preferiu-se “função” a “serviço” para evitar a impressão de que o objeto em si presta serviço, preservando, porém, a possível referência ao uso cultual.
