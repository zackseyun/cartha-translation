source:
  edition: WLC
  text: וְ/אַתָּ֣ה שְׁלֹמֹֽה בְנִ֡/י דַּע֩ אֶת אֱלֹהֵ֨י אָבִ֜י/ךָ וְ/עָבְדֵ֗/הוּ בְּ/לֵ֤ב שָׁלֵם֙ וּ/בְ/נֶ֣פֶשׁ חֲפֵצָ֔ה כִּ֤י כָל לְבָבוֹת֙ דּוֹרֵ֣שׁ יְהוָ֔ה וְ/כָל יֵ֥צֶר מַחֲשָׁב֖וֹת מֵבִ֑ין אִֽם תִּדְרְשֶׁ֨/נּוּ֙ יִמָּ֣צֵא לָ֔/ךְ וְ/אִם תַּֽעַזְבֶ֖/נּוּ יַזְנִיחֲ/ךָ֥ לָ/עַֽד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/009.yaml
  text: And you[a], Solomon my son, know the God of your father and serve him with a whole heart and a willing soul, for Yahweh searches all hearts and understands every intention of the thoughts. If you seek him, he will let himself be found by you; but if you forsake him[b], he will cast you off forever.
translation:
  language: pt
  text: E você, Salomão, meu filho, conheça o Deus de seu pai e sirva-o de coração inteiro e com alma disposta, pois Yahweh sonda todos os corações e compreende toda intenção dos pensamentos. Se você o buscar, ele se deixará encontrar por você[a]; mas, se você o abandonar, ele o rejeitará para sempre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ele será encontrado por você”. O verbo hebraico tem forma passiva ou reflexiva.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ele o repudiará para sempre”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּע
  choice: conheça
  rationale: O imperativo de ידע chama Salomão a reconhecer e conhecer pessoalmente o Deus de seu pai, não apenas a ter informação intelectual sobre ele.
- source_word: אֱלֹהֵי אָבִיךָ
  choice: o Deus de seu pai
  rationale: Preserva a construção hebraica e destaca a continuidade familiar e pactual entre Davi e Salomão.
- source_word: וְעָבְדֵהוּ
  choice: e sirva-o
  rationale: עבד abrange serviço, obediência e culto; “sirva-o” mantém essa amplitude melhor do que uma formulação limitada ao ato de adorar.
- source_word: בְּלֵב שָׁלֵם
  choice: de coração inteiro
  rationale: שָׁלֵם comunica inteireza, integridade e ausência de divisão. “Coração inteiro” conserva a imagem hebraica sem sugerir perfeição sem falhas.
- source_word: וּבְנֶפֶשׁ חֲפֵצָה
  choice: com alma disposta
  rationale: נֶפֶשׁ designa a pessoa interior ou o próprio ser, enquanto חֲפֵצָה expressa disposição, desejo e boa vontade.
- source_word: כִּי כָל לְבָבוֹת דּוֹרֵשׁ יְהוָה
  choice: pois Yahweh sonda todos os corações
  rationale: Neste contexto, דרשׁ significa examinar ou perscrutar. “Sonda” é natural em português e evita a ideia de que Deus procura por desconhecer.
- source_word: וְכָל יֵצֶר מַחֲשָׁבוֹת מֵבִין
  choice: e compreende toda intenção dos pensamentos
  rationale: יֵצֶר pode indicar formação, inclinação ou intenção; em ligação com מַחֲשָׁבוֹת, aponta para o impulso interior que dá forma aos pensamentos.
- source_word: אִם תִּדְרְשֶׁנּוּ
  choice: Se você o buscar
  rationale: Aqui דרשׁ exprime a busca de Deus em devoção e dependência, e não apenas uma consulta pontual.
- source_word: יִמָּצֵא לָךְ
  choice: ele se deixará encontrar por você
  rationale: O Nifal de מצא tem sentido passivo ou reflexivo. A formulação preserva tanto a busca humana quanto a disponibilidade de Deus para ser encontrado.
- source_word: תַּעַזְבֶנּוּ
  choice: se você o abandonar
  rationale: עזב expressa abandono da lealdade a Deus; “abandonar” é corrente e mantém a gravidade pactual.
- source_word: יַזְנִיחֲךָ לָעַד
  choice: ele o rejeitará para sempre
  rationale: O Hifil de זנח indica rejeitar ou repudiar. A tradução conserva sem atenuação a severidade e a duração explícitas da advertência.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Linguagem antropológica de “coração” e “alma”
  choice: 'Mantidos os dois termos distintos: “de coração inteiro e com alma disposta”.'
  alternative: “com mente íntegra e boa vontade”
  rationale: O hebraico distingue לֵב de נֶפֶשׁ e retrata a devoção do ser interior em sua totalidade; reduzir ambos a categorias mentais apagaria essa distinção.
- issue: Acessibilidade divina em יִמָּצֵא לָךְ
  choice: “ele se deixará encontrar por você”
  alternative: “ele será encontrado por você”
  rationale: A forma verbal permite leitura passiva ou reflexiva. A redação principal comunica em português natural que Deus pode ser encontrado sem transformar a frase em simples conquista humana.
- issue: Severidade da advertência pactual
  choice: “ele o rejeitará para sempre”
  alternative: “ele o abandonará para sempre”
  rationale: A tradução mantém a força da advertência dirigida a Salomão sem suavizá-la nem resolver questões teológicas mais amplas que o versículo não discute.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você” adequado à legibilidade brasileira. Conservam-se as imagens hebraicas de coração e alma, enquanto “sonda” e “compreende” dão fluidez sem diluir o sentido. Os marcadores foram posicionados junto às expressões a que as notas efetivamente se referem.
