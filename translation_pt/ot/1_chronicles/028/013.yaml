base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/013.yaml
  text: for the divisions of the priests and the Levites[a], and for all the work of the service of the house of Yahweh[b], and for all the vessels of service of the house of Yahweh.
translation:
  language: pt
  text: e para as divisões dos sacerdotes e dos levitas[a], para todo o trabalho do serviço da casa de Yahweh e para todos os utensílios[b] do serviço da casa de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “turnos” dos sacerdotes e dos levitas.
    reason: lexical_alternative
  - marker: b
    text: Ou “objetos” ou “instrumentos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְלְקוֹת
  choice: divisões
  rationale: Em Crônicas, o termo designa grupos organizados de sacerdotes e levitas com atribuições ou turnos definidos. “Divisões” preserva esse sentido administrativo sem restringi-lo apenas à escala de serviço.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Equivalente corrente para a classe sacerdotal de Israel, mantendo o artigo definido.
- source_word: וְהַלְוִיִּם
  choice: e dos levitas
  rationale: Mantém a designação tradicional e reconhecível dos membros da tribo de Levi ligados ao serviço do santuário.
- source_word: מְלֶאכֶת
  choice: trabalho
  rationale: Termo amplo que abrange o conjunto das tarefas relacionadas ao serviço da casa de Yahweh.
- source_word: עֲבוֹדַת
  choice: serviço
  rationale: Expressa o trabalho cultual e as funções designadas no santuário sem introduzir linguagem eclesiástica posterior.
- source_word: בֵּית יְהוָה
  choice: casa de Yahweh
  rationale: Preserva a expressão hebraica “casa de YHWH” e verte diretamente o nome divino conforme a orientação do projeto.
- source_word: כְּלֵי
  choice: utensílios
  rationale: Designa de modo abrangente os objetos e instrumentos empregados no serviço do santuário; não se limita a recipientes.
- source_word: לְכָל
  choice: para todo / para todos
  rationale: A preposição repetida organiza as categorias abrangidas pelas instruções ou pelo plano mencionado no contexto; a flexão acompanha naturalmente os substantivos em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o Tetragrama; “Yahweh” preserva o nome divino pessoal em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição de “serviço” e “casa de Yahweh” foi mantida por corresponder à estrutura enfática do hebraico. O primeiro “e” foi conservado porque o versículo continua a enumeração iniciada no contexto anterior.
