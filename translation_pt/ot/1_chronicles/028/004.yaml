revisions:
- from: Contudo, Yahweh, o Deus de Israel, escolheu a mim dentre toda a casa de meu pai para ser rei sobre Israel para sempre[a]; pois escolheu Judá como líder[b] e, na casa de Judá, a casa de meu pai; e, entre os filhos de meu pai, agradou-se de mim para me fazer rei sobre todo o Israel.
  to: Contudo, Yahweh, o Deus de Israel, escolheu-me dentre toda a casa de meu pai para ser rei sobre Israel para sempre[a]; pois escolheu Judá como líder[b]; e, na casa de Judá, escolheu a casa de meu pai; e, entre os filhos de meu pai, agradou-se de mim para fazer-me rei sobre todo o Israel.
  rationale: A revisão resolve a quebra sintática mediante a repetição de «escolheu», verbo que o hebraico deixa subentendido na cadeia de escolhas. Mantém-se «na casa de Judá», correspondente direto da preposição hebraica, bem como a ordem e o alcance da progressão. Ajustaram-se «escolheu-me» e «fazer-me» para fluência portuguesa.
