source:
  edition: WLC
  text: וַ/יִּבְחַ֡ר יְהוָ֣ה אֱלֹהֵי֩ יִשְׂרָאֵ֨ל בִּ֜/י מִ/כֹּ֣ל בֵּית אָבִ֗/י לִ/הְי֨וֹת לְ/מֶ֤לֶךְ עַל יִשְׂרָאֵל֙ לְ/עוֹלָ֔ם כִּ֤י בִֽ/יהוּדָה֙ בָּחַ֣ר לְ/נָגִ֔יד וּ/בְ/בֵ֥ית יְהוּדָ֖ה בֵּ֣ית אָבִ֑/י וּ/בִ/בְנֵ֣י אָבִ֔/י בִּ֣/י רָצָ֔ה לְ/הַמְלִ֖יךְ עַל כָּל יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/004.yaml
  text: Yet Yahweh[a], the God of Israel, chose me from all my father's house to be king over Israel forever; for he chose Judah as leader, and in the house of Judah, my father's house, and among my father's sons[b], he took pleasure in me to make me king over all Israel.
translation:
  language: pt
  text: Contudo, Yahweh, o Deus de Israel, escolheu-me dentre toda a casa de meu pai para ser rei sobre Israel para sempre[a]; pois escolheu Judá como líder[b]; e, na casa de Judá, escolheu a casa de meu pai; e, entre os filhos de meu pai, agradou-se de mim para fazer-me rei sobre todo o Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Para sempre” traduz um termo hebraico que pode indicar duração contínua ou permanente; aqui, a expressão aparece no contexto da realeza davídica.
    reason: cultural_note
  - marker: b
    text: Ou “como governante” ou “como príncipe” (hebraico nagid).
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título, preservando sua forma pessoal no texto hebraico.
- source_word: וַיִּבְחַר / בָּחַר
  choice: escolheu
  rationale: Mantém a repetição do verbo בחר e expressa de modo natural a seleção divina.
- source_word: בִּי מִכֹּל בֵּית אָבִי
  choice: escolheu a mim dentre toda a casa de meu pai
  rationale: “Dentre” deixa claro que Davi foi escolhido no interior de sua linhagem paterna e preserva a força comparativa de מִכֹּל.
- source_word: לִהְיוֹת לְמֶלֶךְ
  choice: para ser rei
  rationale: Expressa de forma direta a finalidade e o resultado da escolha.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Preserva a força duradoura e dinástica da expressão hebraica sem explicar no corpo do versículo como ela se cumpre.
- source_word: לְנָגִיד
  choice: como líder
  rationale: נָגִיד designa alguém investido de liderança ou governo; “líder” comunica isso sem sugerir necessariamente o sentido moderno e hereditário de “príncipe”.
- source_word: וּבְבֵית יְהוּדָה בֵּית אָבִי
  choice: e, na casa de Judá, a casa de meu pai
  rationale: Conserva a preposição hebraica e a progressão genealógica de Judá para a casa paterna de Davi; a elipse do verbo “escolheu” permanece compreensível em português.
- source_word: וּבִבְנֵי אָבִי
  choice: e, entre os filhos de meu pai
  rationale: Reproduz a formulação genealógica explícita do hebraico, em vez de reduzi-la a “meus irmãos”.
- source_word: בִּי רָצָה
  choice: agradou-se de mim
  rationale: Expressa o favor e o beneplácito pessoal de רצה, distinguindo-o do verbo “escolher” já empregado.
- source_word: לְהַמְלִיךְ
  choice: para me fazer rei
  rationale: Preserva o valor causativo da forma hifil de מלך.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: sobre todo o Israel
  rationale: Mantém o alcance completo da autoridade régia declarada no hebraico.
theological_decisions:
- issue: Força de לְעוֹלָם aplicada ao reinado de Davi
  choice: para sempre
  alternative: por tempo duradouro
  rationale: A tradução mantém o horizonte permanente da realeza davídica e a tensão entre o reinado pessoal de Davi e sua dimensão dinástica, sem inserir uma interpretação posterior no versículo.
- issue: Sentido de נָגִיד
  choice: líder
  alternative: governante; príncipe
  rationale: “Líder” preserva a noção ampla de autoridade conferida, sem impor uma distinção técnica entre príncipe e rei que o contexto não exige.
- issue: Elipse na sequência de escolhas
  choice: Manter “escolheu” subentendido em “na casa de Judá, a casa de meu pai”
  alternative: Repetir explicitamente “escolheu”
  rationale: A construção conserva mais de perto a concisão e a progressão retórica do hebraico, permanecendo inteligível em português.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem genealógica e a repetição temática da escolha divina foram preservadas, assim como a elipse compacta do hebraico.
