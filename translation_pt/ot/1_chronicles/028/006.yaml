base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/006.yaml
  text: And he said to me[a], ‘Solomon your son—he will build my house and my courts, for I have chosen him for myself as a son, and I will be to him as a father.’
translation:
  language: pt
  text: 'E ele me disse: “Salomão, teu filho, é quem construirá a minha casa e os meus pátios, pois eu o escolhi para ser meu filho, e serei seu pai”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit., “eu o escolhi para mim como filho, e serei para ele como pai”.
    reason: Registra a formulação hebraica com a dupla construção relacional לְ, enquanto o texto principal a exprime em português idiomático.
lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  choice: E ele me disse
  rationale: Traduz o verbo narrativo no passado e expressa naturalmente o objeto indireto לִי.
- source_word: שְׁלֹמֹה בִנְךָ הוּא
  choice: Salomão, seu filho — ele
  rationale: Mantém a ordem e a aposição do hebraico; o travessão e o pronome explícito preservam a ênfase de הוּא.
- source_word: יִבְנֶה בֵיתִי
  choice: construirá a minha casa
  rationale: Preserva o sentido literal de בֵּיתִי, sem substituir interpretativamente 'casa' por 'templo'.
- source_word: וַחֲצֵרוֹתָי
  choice: e os meus pátios
  rationale: No contexto do santuário, חֲצֵרוֹת designa as áreas abertas e delimitadas ao redor do edifício; 'pátios' é claro e corrente em português.
- source_word: כִּי בָחַרְתִּי בוֹ
  choice: pois eu o escolhi
  rationale: כִּי apresenta a razão, e o perfeito expressa uma escolha divina já realizada e vigente.
- source_word: לִי לְבֵן
  choice: para mim como filho
  rationale: Conserva, tanto quanto o português permite, a dupla construção com לְ e a nuance relacional da formulação hebraica, sem reduzi-la silenciosamente a um simples possessivo.
- source_word: וַאֲנִי אֶהְיֶה לוֹ לְאָב
  choice: e eu serei para ele como pai
  rationale: Reproduz de perto a construção 'serei para ele por pai', preservando sua forma pactual e relacional; a alternativa idiomática consta em nota.
theological_decisions:
- issue: Linguagem de pai e filho na relação de Deus com Salomão
  choice: eu o escolhi para mim como filho, e eu serei para ele como pai
  alternative: eu o escolhi para ser meu filho, e serei seu pai
  rationale: A redação mantém diretamente a linguagem filial da aliança real e sua tensão relacional, sem enfraquecê-la como mera função nem importar conclusões cristológicas posteriores para o referente imediato.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O travessão ressalta o pronome enfático הוּא; 'casa' preserva a imagem hebraica, e 'pátios' comunica com clareza o contexto do santuário.
