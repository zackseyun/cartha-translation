base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/019.yaml
  text: All this he made clear to me in writing from the hand of Yahweh[b][a], all the works of the pattern.
translation:
  language: pt
  text: Tudo isso veio por escrito, da mão de Yahweh; ele me fez compreender todas as obras do projeto[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A mão de Yahweh estava sobre mim; ele me fez compreender todas as obras do projeto.”'
    reason: alternative_reading
  - marker: b
    text: “Projeto” também pode ser traduzido como “plano”, “modelo” ou “desenho”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּל
  choice: Tudo isso
  rationale: O contexto aponta para a totalidade das instruções e disposições do templo mencionadas anteriormente; “tudo isso” expressa de modo natural a abrangência de כֹּל.
- source_word: בִּכְתָב
  choice: por escrito
  rationale: Indica que a revelação ou instrução foi comunicada em forma escrita, preservando o valor do hebraico sem sugerir apenas transmissão oral.
- source_word: מִיַּד יְהוָה
  choice: da mão de Yahweh
  rationale: Mantém a imagem hebraica de origem e ação divina direta, em vez de reduzi-la simplesmente a “de Yahweh”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal de maneira reconhecível em português.
- source_word: עָלַי הִשְׂכִּיל
  choice: ele me fez compreender
  rationale: O hifil de שׂכל comunica a ideia causativa de conceder entendimento. A formulação portuguesa é clara, enquanto a nota registra a possibilidade de ligar עָלַי diretamente à “mão de Yahweh”.
- source_word: כֹּל מַלְאֲכוֹת
  choice: todas as obras
  rationale: Abrange os diversos trabalhos, elementos e tarefas necessários para executar o santuário.
- source_word: הַתַּבְנִית
  choice: o projeto
  rationale: No contexto arquitetônico, “projeto” comunica naturalmente o plano ou padrão revelado, sem excluir os sentidos próximos de modelo e desenho.
theological_decisions:
- issue: Construção da frase hebraica comprimida מִיַּד יְהוָה עָלַי הִשְׂכִּיל
  choice: Yahweh é o sujeito implícito de “ele me fez compreender”, e o escrito procede de sua mão.
  alternative: “A mão de Yahweh esteve sobre mim e me fez compreender todas as obras do projeto.”
  rationale: O hebraico permite mais de uma ligação sintática para עָלַי. O texto principal conserva a agência divina e a procedência do escrito; a nota mantém disponível a leitura em que a mão de Yahweh repousa sobre Davi.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A expressão deliberadamente incomum “da mão de Yahweh” preserva a imagem do hebraico; os dois-pontos apresentam “todas as obras do projeto” como o conteúdo de “tudo isso” sem apagar a concisão do original.
