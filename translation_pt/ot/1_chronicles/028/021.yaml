base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/021.yaml
  text: And behold[a], the divisions of the priests and the Levites are for all the service of the house of God, and with you in all the work will be every willing man skilled in wisdom for every kind of service; the officials also, and all the people[b], will be wholly at your command.
translation:
  language: pt
  text: 'E veja: as divisões dos sacerdotes e dos levitas estão encarregadas de todo o serviço da casa de Deus. Em toda a obra, estará com você todo homem disposto e habilidoso[a] para todo serviço. Também os oficiais e todo o povo estarão prontos para cumprir tudo o que você disser.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todo homem disposto, dotado de sabedoria”. O hebraico diz literalmente “todo homem disposto em sabedoria”; aqui, a expressão se refere à habilidade prática para o serviço.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “para todas as suas palavras”; isto é, prontos para executar todas as suas orientações.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E veja
  rationale: Conserva a função de chamar a atenção do ouvinte, mas em português atual e natural, sem o tom excessivamente arcaico de “e eis”.
- source_word: מַחְלְקוֹת
  choice: divisões
  rationale: Designa os grupos organizados ou turnos dos sacerdotes e levitas; “divisões” preserva a estrutura institucional do texto.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: os sacerdotes e os levitas
  rationale: Mantém os dois grupos específicos ligados ao serviço do santuário.
- source_word: לְכָל עֲבוֹדַת בֵּית הָאֱלֹהִים
  choice: encarregadas de todo o serviço da casa de Deus
  rationale: “Encarregadas de” explicita naturalmente a finalidade das divisões, enquanto “casa de Deus” preserva a expressão concreta do hebraico em vez de substituí-la por “templo”.
- source_word: וְעִמְּךָ בְכָל מְלָאכָה
  choice: Em toda a obra, estará com você
  rationale: Mantém a ideia de apoio pessoal a Salomão em todo o trabalho relacionado ao projeto.
- source_word: לְכָל נָדִיב
  choice: todo homem de coração disposto
  rationale: Expressa a disposição voluntária ou generosa indicada por נָדִיב e conserva o masculino singular distributivo do hebraico.
- source_word: בַּחָכְמָה
  choice: habilidoso
  rationale: Neste contexto de trabalho e serviço, חָכְמָה indica sabedoria prática ou perícia; “habilidoso” comunica esse sentido com naturalidade.
- source_word: לְכָל עֲבוֹדָה
  choice: para cada tipo de serviço
  rationale: Reflete a abrangência da expressão e distingue, tanto quanto possível, עֲבוֹדָה da referência anterior à obra, מְלָאכָה.
- source_word: וְהַשָּׂרִים
  choice: Também os oficiais
  rationale: No contexto administrativo da monarquia, שָׂרִים são autoridades ou dirigentes; “oficiais” evita a possível noção hereditária de “príncipes”.
- source_word: וְכָל הָעָם
  choice: e todo o povo
  rationale: Tradução direta que preserva a abrangência do apoio prometido.
- source_word: לְכָל דְּבָרֶיךָ
  choice: prontos para cumprir tudo o que você disser
  rationale: A expressão significa literalmente “para todas as suas palavras”, mas, no contexto, comunica prontidão para executar as determinações de Salomão. A formulação preserva tanto a referência às palavras quanto sua força diretiva.
theological_decisions:
- issue: Referência masculina em נָדִיב
  choice: todo homem de coração disposto
  alternative: toda pessoa disposta; todo voluntário
  rationale: O hebraico emprega uma forma masculina singular distributiva. A tradução conserva essa forma sem impedir que o contexto descreva coletivamente os trabalhadores disponíveis.
- issue: Tradução de בֵּית הָאֱלֹהִים
  choice: casa de Deus
  alternative: templo
  rationale: A expressão concreta e cultual do original é preservada, evitando substituir o texto por uma identificação contextual, embora “templo” seja referencialmente correto.
- issue: Força de לְכָל דְּבָרֶיךָ
  choice: prontos para cumprir tudo o que você disser
  alternative: para todas as suas palavras; às suas ordens em todos os assuntos
  rationale: A redação comunica a prontidão para obedecer às diretrizes de Salomão sem transformar de modo indevido “palavras” em um termo técnico de autoridade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “E veja” retém a ênfase discursiva sem arcaísmo; “casa de Deus” conserva a imagem cultual; e as construções explicativas tornam naturais as relações sintáticas compactas do hebraico.
