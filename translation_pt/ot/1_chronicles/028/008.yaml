source:
  edition: WLC
  text: וְ֠/עַתָּה לְ/עֵינֵ֨י כָל יִשְׂרָאֵ֤ל קְהַל יְהוָה֙ וּ/בְ/אָזְנֵ֣י אֱלֹהֵ֔י/נוּ שִׁמְר֣וּ וְ/דִרְשׁ֔וּ כָּל מִצְוֺ֖ת יְהוָ֣ה אֱלֹהֵי/כֶ֑ם לְמַ֤עַן תִּֽירְשׁוּ֙ אֶת הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה וְ/הִנְחַלְתֶּ֛ם לִ/בְנֵי/כֶ֥ם אַחֲרֵי/כֶ֖ם עַד עוֹלָֽם־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/008.yaml
  text: And now[a], in the sight of all Israel, the assembly of Yahweh, and in the hearing of our God, keep and seek all the commandments of Yahweh your God[b], so that you may possess the good land and leave it as an inheritance to your sons after you forever.
translation:
  language: pt
  text: E agora, diante de todo o Israel — a assembleia de Yahweh — e aos ouvidos do nosso Deus, guardem e busquem todos os mandamentos de Yahweh, seu Deus, para que possuam[a] a boa terra e a deixem como herança a seus filhos[b] depois de vocês, para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “herdem”. O verbo hebraico pode significar “herdar” ou “possuir”, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “filhos”; o termo está no masculino plural, não sendo um termo mais geral para “descendentes”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a ligação com o discurso anterior quanto a transição retórica.
- source_word: לְעֵינֵי
  choice: diante de
  rationale: Expressa de modo natural o sentido público e testemunhal da expressão hebraica literalmente ligada aos olhos.
- source_word: קְהַל יְהוָה
  choice: a assembleia de Yahweh
  rationale: קהל designa a comunidade reunida; “assembleia” mantém esse sentido formal sem impor terminologia eclesiástica posterior.
- source_word: וּבְאָזְנֵי אֱלֹהֵינוּ
  choice: e aos ouvidos do nosso Deus
  rationale: Conserva a imagem antropomórfica do hebraico em uma formulação portuguesa compreensível e digna.
- source_word: שִׁמְרוּ
  choice: guardem
  rationale: Mantém a linguagem de observância cuidadosa e fiel dos mandamentos.
- source_word: וְדִרְשׁוּ
  choice: e busquem
  rationale: Preserva a ideia volitiva de procurar e dedicar-se aos mandamentos, sem reduzi-la a mero estudo intelectual.
- source_word: כָּל מִצְוֺת
  choice: todos os mandamentos
  rationale: Representa diretamente a construção plural com כָּל.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico em vez de substituí-lo por um título.
- source_word: לְמַעַן
  choice: para que
  rationale: Comunica com naturalidade a relação de propósito ou resultado.
- source_word: תִּירְשׁוּ
  choice: possuam
  rationale: No contexto da boa terra, expressa adequadamente a permanência de Israel em sua posse, deixando em nota a possibilidade lexical de “herdar”.
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: a boa terra
  rationale: Tradução direta que conserva a conhecida descrição pactual da terra prometida.
- source_word: וְהִנְחַלְתֶּם
  choice: e a deixem como herança
  rationale: 'Expressa em português natural o causativo hebraico: fazer os filhos herdarem a terra.'
- source_word: לִבְנֵיכֶם
  choice: aos seus filhos
  rationale: Mantém o substantivo masculino plural explícito no hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pactual em vez de substituí-lo por um título.
- issue: Gênero do termo בנים
  choice: filhos
  alternative: filhos e filhas / descendentes
  rationale: O hebraico usa o masculino plural; a tradução conserva essa forma sem ampliar silenciosamente o referente.
- issue: Relação entre obediência e posse continuada da terra
  choice: para que possuam
  alternative: para que herdem
  rationale: A oração de finalidade é mantida sem explicar teologicamente além do texto a relação entre a observância dos mandamentos e a posse da terra.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas verbais de terceira pessoa do plural (“guardem”, “busquem”) para boa legibilidade brasileira. A ordem retórica e as imagens públicas de testemunho foram preservadas. Os marcadores das notas foram reposicionados junto aos termos a que realmente se referem, corrigindo o desalinhamento presente na camada inglesa de consulta.
