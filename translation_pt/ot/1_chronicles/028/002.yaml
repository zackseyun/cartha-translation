  text: וַ/יָּ֨קָם דָּוִ֤יד הַ/מֶּ֨לֶךְ֙ עַל רַגְלָ֔י/ו וַ/יֹּ֕אמֶר שְׁמָע֖וּ/נִי אַחַ֣/י וְ/עַמִּ֑/י אֲנִ֣י עִם לְבָבִ֡/י לִ/בְנוֹת֩ בֵּ֨ית מְנוּחָ֜ה לַ/אֲר֣וֹן בְּרִית יְהוָ֗ה וְ/לַ/הֲדֹם֙ רַגְלֵ֣י אֱלֹהֵ֔י/נוּ וַ/הֲכִינ֖וֹתִי לִ/בְנֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/002.yaml
  text: Then King David rose to his feet and said[a], “Hear me, my brothers and my people. It was in my heart to build a house of rest for the ark of the covenant of Yahweh, and for the footstool of our God[c][b], and I made preparations to build it.”
translation:
  language: pt
  text: 'Então o rei Davi levantou-se e disse: “Escutem-me, meus irmãos[a] e meu povo. Eu tinha no coração construir uma casa de repouso[b] para a arca da aliança de Yahweh e para o estrado dos pés do nosso Deus[c], e fiz os preparativos para construí-la.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meus parentes”. O hebraico diz literalmente “meus irmãos”, forma masculina plural empregada neste discurso público.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido como “um lugar de repouso”, isto é, uma morada permanente para a arca.
    reason: lexical_alternative
  - marker: c
    text: A arca é descrita como o estrado ligado à presença do Deus de Israel; compare Salmo 132:7.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּקָם דָּוִיד הַמֶּלֶךְ עַל רַגְלָיו
  choice: Então o rei Davi se levantou e ficou de pé
  rationale: Expressa de modo natural a ação enfática de levantar-se sobre os próprios pés, sem omitir a locução hebraica.
- source_word: שְׁמָעוּנִי
  choice: Escutem-me
  rationale: Equivalente atual e direto do imperativo de שמע com sufixo de primeira pessoa, apropriado a um discurso público solene.
- source_word: אַחַי וְעַמִּי
  choice: meus irmãos e meu povo
  rationale: Preserva o termo masculino de parentesco e a distinção entre vínculo fraterno e identidade nacional.
- source_word: אֲנִי עִם לְבָבִי
  choice: Eu tinha no coração
  rationale: Reproduz naturalmente o idioma hebraico de intenção interior, sem convertê-lo em decisão já cumprida.
- source_word: בֵּית מְנוּחָה
  choice: uma casa de repouso
  rationale: Mantém a imagem formal de uma casa estável onde a arca encontraria repouso; a alternativa mais idiomática é indicada em nota.
- source_word: לַאֲרוֹן בְּרִית יְהוָה
  choice: para a arca da aliança de Yahweh
  rationale: Preserva claramente a cadeia construta hebraica e translitera o nome divino.
- source_word: וְלַהֲדֹם רַגְלֵי אֱלֹהֵינוּ
  choice: e para o estrado dos pés do nosso Deus
  rationale: Conserva a metáfora cultual e a coordenação do hebraico sem resolver no corpo do texto se a expressão é estritamente apositiva.
- source_word: וַהֲכִינוֹתִי לִבְנוֹת
  choice: e fiz os preparativos para construí-la
  rationale: Comunica o sentido causativo/preparatório do Hifil e explicita em português o objeto feminino recuperado de 'casa'.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; 'Yahweh' preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Relação entre a arca e o estrado dos pés de Deus
  choice: 'Manter a coordenação: “para a arca... e para o estrado...”'
  alternative: 'Explicitar: “a saber, o estrado dos pés...”'
  rationale: A construção pode ser entendida em aposição, identificando a arca com o estrado ligado à presença divina, mas o וְ hebraico permite conservar a coordenação e deixar a relação interpretativa para a nota.
- issue: Alcance de אַחַי
  choice: meus irmãos
  alternative: meus parentes; meus irmãos e irmãs
  rationale: Mantém a forma masculina plural do hebraico e evita ampliar lexicalmente o texto; a possível referência coletiva é esclarecida em nota.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com boa legibilidade brasileira. Conservam-se as imagens hebraicas “casa de repouso” e “estrado dos pés”, enquanto as notas esclarecem alternativas e relações sem eliminar ambiguidades legítimas.
