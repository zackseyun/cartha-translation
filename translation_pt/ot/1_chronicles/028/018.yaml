base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/018.yaml
  text: and for the altar of incense[a], refined gold by weight; and for the pattern of the chariot[b], the cherubim of gold spreading out their wings and overshadowing the ark of the covenant of Yahweh.
translation:
  language: pt
  text: e, para o altar do incenso, ouro refinado por peso; e, para o modelo do carro[a], os querubins de ouro, estendendo as asas e cobrindo[b] a arca da aliança de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o projeto/a forma do carro”. A expressão hebraica é difícil e talvez se refira à estrutura dos querubins, associada à arca, concebida como um carro-trono.
    reason: alternative_reading
  - marker: b
    text: Também pode ser traduzido por “fazendo sombra sobre” ou “protegendo”; a imagem é a dos querubins com as asas abertas sobre a arca.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: altar do incenso
  rationale: Reproduz com clareza a relação construta e usa a designação corrente do objeto cultual.
- source_word: זָהָב מְזֻקָּק
  choice: ouro refinado
  rationale: Preserva o sentido metalúrgico de ouro purificado por refinação, sem reduzi-lo simplesmente a “ouro puro”.
- source_word: בַּמִּשְׁקָל
  choice: conforme o peso
  rationale: Indica que a quantidade de ouro era especificada por peso e soa naturalmente em português.
- source_word: תַבְנִית
  choice: modelo
  rationale: Abrange a ideia de forma, projeto ou padrão e se ajusta ao contexto dos planos do templo.
- source_word: הַמֶּרְכָּבָה
  choice: carro
  rationale: Mantém o sentido lexical básico do hebraico sem resolver de modo indevido a difícil imagem como “trono”; a nota explica a possível estrutura de carro-trono.
- source_word: הַכְּרֻבִים
  choice: querubins
  rationale: É o termo técnico bíblico consagrado em português para o plural de querubim.
- source_word: זָהָב
  choice: de ouro
  rationale: Expressa diretamente o material dos querubins.
- source_word: לְפֹרְשִׂים
  choice: que estendiam as asas
  rationale: O verbo significa estender ou abrir; “as asas” é o objeto implícito exigido pela conhecida imagem dos querubins sobre a arca.
- source_word: וְסֹכְכִים
  choice: e cobriam
  rationale: Conserva o sentido concreto de cobrir ou proteger por cima; a nota registra a alternativa imagética “faziam sombra sobre”.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: a arca da aliança de Yahweh
  rationale: Preserva de modo transparente toda a cadeia construta hebraica e mantém o nome divino pessoal.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; o SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título; “Javé” é uma forma portuguesa possível, e “o SENHOR” representa a tradição de leitura substitutiva.
- issue: Relação entre o carro e os querubins
  choice: “o modelo do carro, os querubins de ouro”
  alternative: “o modelo do carro-trono dos querubins de ouro”
  rationale: A redação principal conserva a construção difícil e sua tensão, enquanto a alternativa explicita uma interpretação plausível da estrutura dos querubins como trono móvel divino.
translation_notes:
  register: Português atual, digno e de leitura ampla, com sintaxe próxima da enumeração do hebraico. “Carro” foi mantido por transparência lexical, apesar de sua possível associação moderna com automóvel; a nota delimita o sentido antigo. Os marcadores foram colocados junto às expressões efetivamente explicadas pelas notas.
