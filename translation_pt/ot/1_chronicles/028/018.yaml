  terminology: «Altar do incenso», «ouro refinado», «querubins», «arca da aliança» e «Yahweh» são adequados. «Carro» conserva de maneira transparente o termo difícil מֶרְכָּבָה; a nota contextualiza seu provável valor sem impor uma interpretação.
