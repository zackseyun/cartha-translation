  text: וְ/תַבְנִ֗ית כֹּל֩ אֲשֶׁ֨ר הָיָ֤ה בָ/ר֨וּחַ֙ עִמּ֔/וֹ לְ/חַצְר֧וֹת בֵּית יְהוָ֛ה וּ/לְ/כָל הַ/לְּשָׁכ֖וֹת סָבִ֑יב לְ/אֹֽצְרוֹת֙ בֵּ֣ית הָ/אֱלֹהִ֔ים וּ/לְ/אֹצְר֖וֹת הַ/קֳּדָשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/012.yaml
  text: 'and the plan of all that was in the Spirit with him: for the courts of the house of Yahweh[a], for all the surrounding chambers, for the treasuries of the house of God, and for the treasuries of the holy things.'
translation:
  language: pt
  text: 'e o projeto de tudo o que ele trazia em seu espírito[a]: os pátios da casa do SENHOR, todas as câmaras ao redor, os depósitos da casa de Deus e os depósitos das coisas sagradas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tudo o que estava com ele pelo Espírito”, isto é, pelo Espírito divino. A expressão hebraica também pode se referir ao espírito, à mente ou ao coração de Davi.'
    reason: A expressão hebraica é sintaticamente ambígua quanto à referência de “espírito”; a nota preserva a leitura de origem divina sem impô-la no texto.
lexical_decisions:
- source_word: תַבְנִית
  choice: projeto
  rationale: No contexto da construção do templo, o termo indica o plano ou modelo arquitetônico. “Projeto” é natural em português e abrange tanto a disposição geral quanto os diversos espaços enumerados.
- source_word: כֹּל אֲשֶׁר
  choice: tudo o que
  rationale: Preserva a abrangência da expressão hebraica em linguagem corrente.
- source_word: הָיָה בָרוּחַ עִמּוֹ
  choice: ele tinha consigo pelo Espírito
  rationale: Expressa de modo compreensível a provável ideia de que o projeto estava com Davi por ação do Espírito, sem ocultar em nota a possibilidade de referência ao espírito, mente ou intenção do próprio Davi.
- source_word: לְחַצְרוֹת
  choice: os pátios
  rationale: É a designação clara e habitual para as áreas abertas do complexo do templo.
- source_word: בֵּית יְהוָה
  choice: a casa do SENHOR
  rationale: Mantém a imagem hebraica de “casa” aplicada ao templo e representa o nome divino יהוה pela convenção portuguesa “SENHOR”.
- source_word: לְּשָׁכוֹת
  choice: câmaras
  rationale: Designa adequadamente os aposentos ou salas anexas do complexo do templo.
- source_word: סָבִיב
  choice: ao redor
  rationale: Reproduz de forma natural a localização circundante das câmaras.
- source_word: אֹצְרוֹת
  choice: depósitos
  rationale: O termo se refere a recintos onde bens eram guardados. “Depósitos” é claro e não limita indevidamente o conteúdo a riquezas monetárias.
- source_word: בֵּית הָאֱלֹהִים
  choice: a casa de Deus
  rationale: Preserva a expressão hebraica e o paralelismo com “casa do SENHOR”.
- source_word: הַקֳּדָשִׁים
  choice: as coisas sagradas
  rationale: Traduz diretamente o plural substantivado, que provavelmente indica objetos santos ou consagrados, sem especificar além do texto.
theological_decisions:
- issue: Sentido de בָרוּחַ עִמּוֹ
  choice: 'Referência ao Espírito divino: “ele tinha consigo pelo Espírito”'
  alternative: 'Referência ao espírito, mente ou intenção de Davi: “estava no espírito dele”'
  rationale: O contexto mais amplo, especialmente o versículo 19, favorece a origem divina do projeto. Contudo, a formulação hebraica admite a leitura antropológica; por isso, a alternativa é explicitamente preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Projeto” e “depósitos” evitam arcaísmo excessivo; “câmaras” conserva a precisão arquitetônica. A coordenação foi apresentada como enumeração após dois-pontos, acompanhando a estrutura do hebraico.
