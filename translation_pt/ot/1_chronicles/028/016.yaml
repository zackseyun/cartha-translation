  text: and the weight of the gold for the tables of the arrangement[a], for each table and table, and silver for the silver tables.
translation:
  language: pt
  text: e o peso do ouro para as mesas da disposição[a], para cada mesa, e a prata para as mesas de prata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «mesas para os pães da disposição». Tradicionalmente, «mesas dos pães da proposição».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁקָל
  choice: peso
  rationale: No contexto da lista de materiais do templo, indica a quantidade de metal determinada por peso.
- source_word: שֻׁלְחֲנוֹת הַמַּעֲרֶכֶת
  choice: mesas dos pães dispostos
  rationale: מַעֲרֶכֶת designa aquilo que é posto em ordem; neste contexto cultual, refere-se provavelmente aos pães dispostos diante de Deus. A formulação comunica o referente em português sem depender apenas do termo tradicional.
- source_word: לְשֻׁלְחָן וְשֻׁלְחָן
  choice: para cada mesa
  rationale: A repetição do singular tem sentido distributivo. A tradução natural em português é “para cada mesa”.
- source_word: כֶּסֶף
  choice: prata
  rationale: É o nome simples do material, em contraste com o ouro.
- source_word: שֻׁלְחֲנוֹת הַכָּסֶף
  choice: mesas de prata
  rationale: A construção indica naturalmente mesas feitas de prata ou caracterizadas por esse material.
