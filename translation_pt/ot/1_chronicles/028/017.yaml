base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/017.yaml
  text: and the forks, the basins, and the pitchers of pure gold; and for the golden bowls, by weight for each bowl and bowl; and for the silver bowls, by weight for each bowl and bowl.
translation:
  language: pt
  text: e os garfos, as bacias e os jarros[a], de ouro puro; e, para as tigelas de ouro, o peso de cada tigela[b]; e, para as tigelas de prata, o peso de cada tigela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “recipientes para libações”. O termo hebraico se refere a um recipiente usado para derramar líquidos, mas seu formato exato é incerto.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “para tigela e tigela”, expressão distributiva que indica que cada recipiente tinha seu próprio peso determinado. O mesmo vale para as tigelas de prata.
    reason: source_form
lexical_decisions:
- source_word: הַמִּזְלָגוֹת
  choice: os garfos
  rationale: O substantivo designa utensílios semelhantes a garfos usados no serviço do templo. “Garfos” é concreto, atual e mais claro que formas técnicas ou arcaicas.
- source_word: הַמִּזְרָקוֹת
  choice: as bacias
  rationale: O termo costuma indicar recipientes rituais, especialmente bacias ligadas ao serviço sacrificial. “Bacias” também o distingue de כְפוֹרֵי, traduzido depois como “tigelas”.
- source_word: הַקְּשָׂוֹת
  choice: os jarros
  rationale: O termo denota recipientes associados ao ato de derramar. “Jarros” comunica naturalmente essa provável função, embora a identificação exata do formato seja incerta.
- source_word: זָהָב טָהוֹר
  choice: de ouro puro
  rationale: A expressão especifica o material dos utensílios mencionados e é vertida de modo idiomático e direto.
- source_word: כְפוֹרֵי
  choice: tigelas
  rationale: Neste inventário, o substantivo designa recipientes provavelmente baixos ou arredondados. “Tigelas” evita confusão com as “bacias” mencionadas antes.
- source_word: בְּמִשְׁקָל
  choice: o peso
  rationale: No contexto elíptico de uma lista de materiais e medidas determinados por Davi, a expressão indica o peso atribuído a cada objeto. A formulação nominal preserva a estrutura do inventário.
- source_word: לִכְפוֹר וּכְפוֹר
  choice: de cada tigela
  rationale: A repetição hebraica “para tigela e tigela” tem sentido distributivo. “De cada tigela” expressa esse valor com naturalidade em português, enquanto a nota registra a forma da expressão original.
- source_word: הַכֶּסֶף
  choice: de prata
  rationale: Tradução usual do nome do metal, em contraste direto com o ouro.
