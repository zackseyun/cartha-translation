source:
  edition: WLC
  text: וַ/יַּקְהֵ֣ל דָּוִ֣יד אֶת כָּל שָׂרֵ֣י יִשְׂרָאֵ֡ל שָׂרֵ֣י הַ/שְּׁבָטִ֣ים וְ/שָׂרֵ֣י הַ/מַּחְלְק֣וֹת הַ/מְשָׁרְתִ֪ים אֶת הַ/מֶּ֟לֶךְ וְ/שָׂרֵ֣י הָ/אֲלָפִ֣ים וְ/שָׂרֵ֣י הַ/מֵּא֡וֹת וְ/שָׂרֵ֣י כָל רְכוּשׁ וּ/מִקְנֶה֩ לַ/מֶּ֨לֶךְ וּ/לְ/בָנָ֜י/ו עִם הַ/סָּרִיסִ֧ים וְ/הַ/גִּבּוֹרִ֛ים וּֽ/לְ/כָל גִּבּ֥וֹר חָ֖יִל אֶל יְרוּשָׁלִָֽם־־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/001.yaml
  text: 'Then David assembled at Jerusalem all the leaders of Israel: the leaders of the tribes[a], the leaders of the divisions that served the king, the commanders of thousands and of hundreds, and the leaders over all the property and livestock belonging to the king and to his sons, together with the officials, the mighty men, and every mighty man of valor.'
translation:
  language: pt
  text: 'Então Davi reuniu em Jerusalém todos os líderes de Israel: os líderes das tribos, os líderes das divisões que serviam ao rei, os comandantes de milhares e de centenas, os responsáveis por todos os bens e rebanhos do rei e de seus filhos, bem como os oficiais da corte[a], os valentes e todos os guerreiros valorosos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “eunucos”; o termo hebraico pode referir-se tanto a eunucos propriamente ditos quanto, de modo mais geral, a oficiais da corte real.
    reason: Preserva a amplitude lexical de סָרִיסִים sem impor uma identificação física aos integrantes deste grupo administrativo.
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: reuniu
  rationale: O hifil de קהל indica que Davi fez uma assembleia formal; “reuniu” é natural e preserva essa ação causativa no contexto público.
- source_word: שָׂרֵי יִשְׂרָאֵל / שָׂרֵי הַשְּׁבָטִים
  choice: líderes de Israel / líderes das tribos
  rationale: שַׂר abrange líderes, autoridades e comandantes. “Líderes” funciona como termo geral e mantém o paralelismo da lista.
- source_word: שָׂרֵי הַמַּחְלְקוֹת הַמְשָׁרְתִים אֶת הַמֶּלֶךְ
  choice: líderes das divisões que serviam ao rei
  rationale: מַחְלְקוֹת designa grupos organizados ou turnos de serviço; a formulação conserva tanto a organização administrativa quanto o serviço prestado ao rei.
- source_word: שָׂרֵי הָאֲלָפִים וְשָׂרֵי הַמֵּאוֹת
  choice: comandantes de milhares e de centenas
  rationale: No contexto militar e administrativo, “comandantes” expressa adequadamente שָׂרֵי; “milhares” e “centenas” preservam as designações hebraicas sem decidir se eram números exatos ou unidades organizacionais.
- source_word: שָׂרֵי כָל רְכוּשׁ וּמִקְנֶה
  choice: responsáveis por todos os bens e rebanhos
  rationale: Aqui שָׂרֵי indica supervisão, por isso “responsáveis” é mais natural em português. רְכוּשׁ abrange posses ou bens, e מִקְנֶה, animais mantidos como propriedade; “rebanhos” comunica bem o par no contexto régio.
- source_word: לַמֶּלֶךְ וּלְבָנָיו
  choice: do rei e de seus filhos
  rationale: O ל indica aqui posse ou vinculação; a construção portuguesa expressa essa relação sem explicitação excessiva.
- source_word: הַסָּרִיסִים
  choice: oficiais da corte
  rationale: סָרִיסִים pode designar eunucos literalmente ou, por extensão funcional, oficiais régios. Nesta lista administrativa, “oficiais da corte” é claro e contextual, enquanto a alternativa literal é preservada em nota.
- source_word: הַגִּבּוֹרִים
  choice: os valentes
  rationale: גִּבּוֹרִים descreve homens reconhecidos por força e proeza, frequentemente os guerreiros destacados de Davi. “Os valentes” é conciso, digno e tradicional sem ser obscuro.
- source_word: כָל גִּבּוֹר חָיִל
  choice: todos os guerreiros valorosos
  rationale: A expressão reúne capacidade guerreira, força e valor. “Guerreiros valorosos” transmite naturalmente o sentido militar sem reduzir חַיִל a uma única nuance.
