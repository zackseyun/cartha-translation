id: 1CH.28.3
reference: 1 Chronicles 28:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָ/אֱלֹהִים֙ אָ֣מַר לִ֔/י לֹא תִבְנֶ֥ה בַ֖יִת לִ/שְׁמִ֑/י כִּ֣י אִ֧ישׁ מִלְחָמ֛וֹת אַ֖תָּה וְ/דָמִ֥ים שָׁפָֽכְתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/003.yaml
  text: But God said to me[a], ‘You shall not build a house for my name[b], because you are a man of wars and have shed blood.’
translation:
  language: pt
  text: 'Mas Deus me disse: “Você não construirá uma casa para o meu nome,[a] porque é homem de guerras[b] e derramou sangue.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Uma casa para o meu nome” refere-se ao templo como o lugar associado ao nome e à presença de Deus.
    reason: cultural_note
  - marker: b
    text: Ou “homem de guerra”. O hebraico diz literalmente “homem de guerras”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֱלֹהִים
  choice: Mas Deus
  rationale: O nome אֱלֹהִים refere-se aqui ao Deus de Israel. Embora וְ normalmente signifique “e”, “mas” expressa naturalmente o contraste com o desejo de Davi de construir o templo.
- source_word: אָמַר לִי
  choice: me disse
  rationale: Tradução direta e natural da fórmula de fala, mantendo Deus como sujeito e Davi como destinatário.
- source_word: לֹא תִבְנֶה
  choice: Você não construirá
  rationale: A forma futura conserva, melhor do que uma ordem direta, a tensão entre proibição solene e declaração divina do que Davi não fará.
- source_word: בַיִת
  choice: uma casa
  rationale: Mantém o sentido básico de בַיִת e o modo bíblico de falar do templo, sem substituir o termo por uma interpretação explícita.
- source_word: לִשְׁמִי
  choice: para o meu nome
  rationale: Reproduz de modo direto a expressão bíblica que associa o santuário ao nome e à presença de Deus.
- source_word: כִּי
  choice: porque
  rationale: Introduz claramente a razão apresentada por Deus.
- source_word: אִישׁ מִלְחָמוֹת
  choice: homem de guerras
  rationale: Preserva o plural hebraico מִלְחָמוֹת e destaca a participação repetida em guerras, embora “homem de guerra” seja mais idiomático.
- source_word: וְדָמִים שָׁפָכְתָּ
  choice: e derramou sangue
  rationale: “Derramar sangue” é a correspondência idiomática natural para דָּמִים שָׁפַךְ; o português emprega “sangue” no singular.
theological_decisions:
- issue: Razão pela qual Davi não pode construir o templo
  choice: A identidade de Davi como homem de guerras e o fato de ter derramado sangue são mantidos como as razões declaradas por Deus.
  alternative: Entender o sangue derramado especificamente como violência moralmente culpável, ou apenas como uma incompatibilidade ritual apesar de guerras legítimas.
  rationale: O versículo não determina se o derramamento de sangue foi pecaminoso, se causou uma desqualificação ritual ou se apenas tornou Davi inadequado para a função de construtor do templo. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Você não construirá” mantém solenidade sem recorrer ao arcaizante “não edificarás”; “casa” e “meu nome” preservam a linguagem teológica do hebraico.
