  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: רְאֵ֣ה עַתָּ֗ה כִּֽי יְהוָ֛ה בָּ֧חַר בְּ/ךָ֛ לִ/בְנֽוֹת בַּ֥יִת לַ/מִּקְדָּ֖שׁ חֲזַ֥ק וַ/עֲשֵֽׂה׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/010.yaml
  text: See now[a], for Yahweh has chosen you to build a house for the sanctuary. Be strong[b], and do it.
translation:
  language: pt
  text: Veja agora[a], pois Yahweh escolheu você para construir uma casa para o santuário[b]. Seja forte e faça isso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “Considere agora” ou “Preste atenção agora”. O imperativo inicial é um chamado à atenção e à reflexão, não apenas ao ato físico de ver.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “uma casa para o santuário”; isto é, o edifício do templo como lugar santo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה עַתָּה
  choice: Veja agora
  rationale: O imperativo de ראה funciona aqui como chamado à atenção e à reflexão, enquanto עתה reforça a urgência imediata. “Veja agora” preserva a forma direta do hebraico; a nota registra alternativas idiomáticas.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão que fundamenta a exortação inicial; “pois” expressa naturalmente essa relação em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בָּחַר בְּךָ
  choice: escolheu você
  rationale: Expressa a escolha divina de Salomão para uma tarefa específica. O pretérito perfeito comunica uma escolha concluída com relevância presente.
- source_word: לִבְנוֹת
  choice: para construir
  rationale: Tradução natural do infinitivo de בנה e adequada ao encargo dado a Salomão.
- source_word: בַּיִת לַמִּקְדָּשׁ
  choice: uma casa para o santuário
  rationale: Mantém os dois substantivos do hebraico e a imagem bíblica da “casa”, sem reduzir interpretativamente toda a expressão a “templo”.
- source_word: חֲזַק
  choice: Seja forte
  rationale: Preserva a exortação à força, firmeza e resolução no contexto de uma comissão.
- source_word: וַעֲשֵׂה
  choice: e faça isso
  rationale: Em contexto, o objeto implícito é a tarefa de construir; “isso” torna a referência natural em português sem acrescentar uma ideia estranha ao texto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome pessoal divino. “Yahweh” preserva o Tetragrama como nome, sem substituí-lo por um título.
- issue: Sentido de בַּיִת לַמִּקְדָּשׁ
  choice: uma casa para o santuário
  alternative: o templo; uma casa como santuário
  rationale: A referência contextual é ao templo, mas a formulação escolhida conserva a distinção lexical e a construção do hebraico, deixando a nota esclarecer seu sentido.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução mantém a concisão e a força exortativa do hebraico, preserva o nome Yahweh e conserva a expressão concreta “casa para o santuário”, acompanhada de esclarecimento em nota.
