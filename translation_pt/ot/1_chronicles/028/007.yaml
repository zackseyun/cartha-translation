id: 1CH.28.7
reference: 1 Chronicles 28:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/הֲכִינוֹתִ֥י אֶת מַלְכוּת֖/וֹ עַד לְ/עוֹלָ֑ם אִם יֶחֱזַ֗ק לַ/עֲשׂ֛וֹת מִצְוֺתַ֥/י וּ/מִשְׁפָּטַ֖/י כַּ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/007.yaml
  text: And I will establish his kingdom forever[a], if he is strong to do my commandments and my judgments[c][b], as at this day.
translation:
  language: pt
  text: E firmarei o reino dele para sempre[a], se ele se mantiver firme em cumprir os meus mandamentos e as minhas ordenanças, como faz hoje[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estabelecerei” ou “confirmarei o reino dele”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “como neste dia”, isto é, como ele faz agora.'
    reason: cultural_note
lexical_decisions:
- source_word: וַהֲכִינוֹתִי
  choice: E firmarei
  rationale: O hifil de כון expressa fazer permanecer firme, confirmar ou estabelecer. “Firmarei” preserva a imagem lexical e soa natural no contexto do reino.
- source_word: מַלְכוּתוֹ
  choice: o reino dele
  rationale: מַלְכוּת pode indicar reino, reinado ou realeza. “O reino dele” é claro e amplo o bastante para o contexto dinástico.
- source_word: עַד לְעוֹלָם
  choice: para sempre
  rationale: A expressão comunica duração permanente; “para sempre” é a formulação portuguesa corrente e direta.
- source_word: אִם
  choice: se
  rationale: A partícula introduz explicitamente uma condição, que deve ser preservada.
- source_word: יֶחֱזַק
  choice: ele se mantiver firme
  rationale: חזק neste contexto indica firmeza ou resolução perseverante. A expressão liga naturalmente essa firmeza ao cumprimento do que Deus ordena, sem reduzi-la a força física.
- source_word: לַעֲשׂוֹת
  choice: em cumprir
  rationale: Embora עשה signifique literalmente “fazer”, em português “cumprir mandamentos e ordenanças” expressa com naturalidade a execução obediente requerida.
- source_word: מִצְוֺתַי
  choice: os meus mandamentos
  rationale: “Mandamentos” mantém o tom pactual e jurídico de מִצְוָה.
- source_word: וּמִשְׁפָּטַי
  choice: e as minhas ordenanças
  rationale: מִשְׁפָּטִים pode significar juízos, normas ou ordenanças. “Ordenanças” comunica aqui prescrições divinas e evita que “juízos” seja entendido primariamente como sentenças judiciais.
- source_word: כַּיּוֹם הַזֶּה
  choice: como faz hoje
  rationale: A expressão hebraica é literalmente “como neste dia”; no contexto, aponta à conduta presente dele. A tradução explicita apenas o referente pragmático do idioma.
theological_decisions:
- issue: Condicionalidade da promessa relativa ao reino de Salomão
  choice: 'Manter a condição explícita: “se ele se mantiver firme”.'
  alternative: Suavizar a oração como simples descrição da conduta ou do caráter de Salomão.
  rationale: אִם introduz inequivocamente uma condição. A tradução preserva a tensão entre esta formulação condicional e outros aspectos da promessa davídica, sem harmonização doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “O reino dele” evita a possível ambiguidade oral de “seu reino”. A formulação mantém o tom solene sem recorrer a sintaxe arcaica.
