  text: וַ/יִּתֵּ֣ן דָּוִ֣יד לִ/שְׁלֹמֹ֣ה בְנ֡/וֹ אֶת תַּבְנִ֣ית הָ/אוּלָם֩ וְֽ/אֶת בָּ֨תָּ֜י/ו וְ/גַנְזַכָּ֧י/ו וַ/עֲלִיֹּתָ֛י/ו וַ/חֲדָרָ֥י/ו הַ/פְּנִימִ֖ים וּ/בֵ֥ית הַ/כַּפֹּֽרֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/011.yaml
  text: Then David gave to Solomon his son the plan of the portico[a], its houses, its treasuries, its upper rooms, its inner chambers, and the house of the mercy seat.
translation:
  language: pt
  text: Então Davi entregou a seu filho Salomão a planta do pórtico, de seus edifícios, de seus depósitos, de suas salas superiores, de seus aposentos internos e do recinto do propiciatório[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tampa da expiação”. O hebraico כַּפֹּרֶת designa a cobertura da arca no Lugar Santíssimo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Então Davi entregou
  rationale: O waw consecutivo dá prosseguimento à narrativa. “Então” expressa a sequência, e “entregou” é natural para a transmissão de uma planta arquitetônica.
- source_word: תַּבְנִית
  choice: planta
  rationale: No contexto da construção do templo, designa o modelo ou projeto especificado; “planta” é o termo arquitetônico corrente e claro em português.
- source_word: הָאוּלָם
  choice: o pórtico
  rationale: O termo indica o vestíbulo ou estrutura de entrada de um edifício monumental. “Pórtico” preserva adequadamente o sentido arquitetônico.
- source_word: בָּתָּיו
  choice: seus edifícios
  rationale: Embora o substantivo possa significar literalmente “casas”, aqui o plural se refere às estruturas do complexo do templo; “edifícios” evita sugerir moradias.
- source_word: גַנְזַכָּיו
  choice: seus depósitos
  rationale: Refere-se a locais destinados à guarda de objetos valiosos ou consagrados. “Depósitos” é claro, sem excluir a função de tesouraria.
- source_word: עֲלִיֹּתָיו
  choice: suas salas superiores
  rationale: Designa salas ou aposentos situados no piso superior; a formulação é concreta e compreensível.
- source_word: חֲדָרָיו הַפְּנִימִים
  choice: seus aposentos internos
  rationale: Mantém o sentido de cômodos no interior sem acrescentar a ideia superlativa de “mais internos” ou “recônditos”.
- source_word: בֵית הַכַּפֹּרֶת
  choice: o recinto do propiciatório
  rationale: A expressão é literalmente “casa do kapporet” e provavelmente identifica o recinto que o abrigava. “Recinto” comunica a referência arquitetônica melhor do que a pouco natural “casa do propiciatório”.
theological_decisions:
- issue: Tradução de כַּפֹּרֶת na terminologia do santuário
  choice: propiciatório
  alternative: tampa da expiação
  rationale: “Propiciatório” é o termo cultual tradicional e reconhecível em português para a cobertura da arca. Como o hebraico também pode ser expresso de modo funcional como “tampa da expiação”, a alternativa é registrada em nota sem eliminar a tensão lexical.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A enumeração arquitetônica foi mantida, e o marcador da nota foi colocado junto ao termo que ela explica.
