  text: וּ/מִ/כָּ֨ל בָּנַ֔/י כִּ֚י רַבִּ֣ים בָּנִ֔ים נָ֥תַן לִ֖/י יְהוָ֑ה וַ/יִּבְחַר֙ בִּ/שְׁלֹמֹ֣ה בְנִ֔/י לָ/שֶׁ֗בֶת עַל כִּסֵּ֛א מַלְכ֥וּת יְהוָ֖ה עַל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/005.yaml
  text: And from among all my sons—for Yahweh has given me many sons—he chose Solomon my son to sit on the throne of the kingdom of Yahweh over Israel[a][b].
translation:
  language: pt
  text: E, dentre todos os meus filhos — pois Yahweh me deu muitos filhos —, ele escolheu Salomão, meu filho, para assentar-se no trono do reino de Yahweh sobre Israel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “o trono do reino de Yahweh” ressalta que o reino sobre Israel pertence, em última instância, a Yahweh, embora Salomão seja o rei humano.
    reason: cross_reference
lexical_decisions:
- source_word: וּמִכָּל בָּנַי
  choice: E, dentre todos os meus filhos
  rationale: A combinação de ו, מִן e כָּל expressa escolha a partir de um grupo; “dentre todos” é natural em português e “filhos” preserva o masculino plural pertinente à sucessão real.
- source_word: כִּי רַבִּים בָּנִים נָתַן לִי יְהוָה
  choice: pois Yahweh me deu muitos filhos
  rationale: כִּי introduz uma explicação parentética. O pretérito perfeito traduz naturalmente a ação concluída cujo resultado permanece no contexto.
- source_word: וַיִּבְחַר בִּשְׁלֹמֹה בְנִי
  choice: ele escolheu Salomão, meu filho
  rationale: O sujeito continua sendo Yahweh; com בחר, a preposição ב marca a pessoa escolhida e não precisa ser reproduzida literalmente em português.
- source_word: לָשֶׁבֶת עַל כִּסֵּא
  choice: para se assentar no trono
  rationale: Em contexto de entronização, ישב com כִּסֵּא descreve ocupar o trono e, por implicação, reinar; a formulação conserva a imagem hebraica.
- source_word: מַלְכוּת יְהוָה
  choice: do reino de Yahweh
  rationale: Mantém integralmente a cadeia construta e a afirmação de que o reino pertence, em última instância, a Yahweh.
- source_word: עַל יִשְׂרָאֵל
  choice: sobre Israel
  rationale: A preposição עַל, no contexto de reino e trono, indica domínio ou governo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Preserva a referência explícita ao nome da aliança conforme a convenção do projeto, sem substituí-lo por um título.
- issue: Sentido de “o trono do reino de Yahweh”
  choice: Conservar a expressão completa
  alternative: o trono real; o trono do reino de Israel
  rationale: O hebraico atribui expressamente o reino a Yahweh. Reduzir ou reformular a expressão apagaria a tensão teológica entre o reinado divino e o rei humano.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os travessões preservam a explicação parentética do hebraico; “se assentar no trono” mantém a imagem de entronização sem substituir explicitamente seu sentido por “reinar”.
