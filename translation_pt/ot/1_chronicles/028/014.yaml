  text: the weight of the gold for all the articles of every kind of service[a], and the weight of the silver for all the articles of every kind of service.
translation:
  language: pt
  text: o peso do ouro para todos os utensílios de ouro destinados a cada tipo de serviço[a], e o peso da prata para todos os utensílios de prata destinados a cada tipo de serviço.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico repete literalmente «serviço e serviço», expressão distributiva que significa algo como «para cada tipo de serviço» ou «para cada uso».
    reason: lexical_alternative
lexical_decisions:
- source_word: זָּהָב
  choice: ouro
  rationale: Termo básico para o material; o artigo hebraico é expresso naturalmente pela contração «do» na construção «o peso do ouro».
- source_word: בַּמִּשְׁקָל
  choice: o peso
  rationale: Embora a forma hebraica contenha a preposição ב, o contexto elíptico de inventário permite uma expressão nominal em português, clara e paralela para ouro e prata.
- source_word: כְּלֵי
  choice: utensílios
  rationale: Termo abrangente e corrente para objetos usados no serviço do templo, sem restringi-los apenas a recipientes.
- source_word: עֲבוֹדָה
  choice: serviço
  rationale: No contexto do templo, designa o trabalho ou serviço cultual; «serviço» conserva esse sentido sem introduzir terminologia denominacional.
- source_word: עֲבוֹדָה וַעֲבוֹדָה
  choice: cada tipo de serviço
  rationale: A repetição tem força distributiva; esta formulação comunica de modo idiomático as diversas categorias ou utilizações.
- source_word: כֶּסֶף
  choice: prata
  rationale: Designa o material atribuído aos utensílios e forma o paralelo direto com «ouro».
- source_word: לְכָל / לְכֹל
  choice: para todos
  rationale: A preposição com כֹּל indica abrangência; «para todos» preserva essa extensão de modo natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura de inventário. «Destinados a» explicita a relação funcional indicada pelas construções com לְ, sem acrescentar uma categoria teológica. A nota preserva a forma incomum e a ambiguidade lexical da repetição hebraica.
