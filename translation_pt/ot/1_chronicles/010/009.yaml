  text: וַ/יַּ֨פְשִׁיטֻ֔/הוּ וַ/יִּשְׂא֥וּ אֶת רֹאשׁ֖/וֹ וְ/אֶת כֵּלָ֑י/ו וַ/יְשַׁלְּח֨וּ בְ/אֶֽרֶץ פְלִשְׁתִּ֜ים סָבִ֗יב לְ/בַשֵּׂ֛ר אֶת עֲצַבֵּי/הֶ֖ם וְ/אֶת הָ/עָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/009.yaml
  text: They stripped him[a], took his head and his weapons, and sent word throughout the land of the Philistines to proclaim the news to their idols and to the people.
translation:
  language: pt
  text: Eles o despiram, pegaram sua cabeça e suas armas e enviaram a notícia por toda a terra dos filisteus, para anunciá-la aos seus ídolos[a] e ao povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas imagens”. O termo hebraico pode se referir a imagens de culto; “ídolos” foi usado porque o contexto é religioso e o termo tem conotação depreciativa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפְשִׁיטֻהוּ
  choice: Eles o despiram
  rationale: O verbo פשט, nesta forma, indica retirar roupa ou armadura. Como o objeto expresso é o próprio Saul e a armadura não é mencionada nesta oração, a tradução evita acrescentá-la.
- source_word: וַיִּשְׂאוּ אֶת רֹאשׁוֹ
  choice: pegaram sua cabeça
  rationale: נשא pode significar levantar, carregar ou tomar. No contexto de despojo de guerra, “pegaram” comunica que levaram a cabeça como troféu sem explicitar além do texto o ato de decapitação.
- source_word: כֵּלָיו
  choice: suas armas
  rationale: כְּלִי é um termo amplo para objetos, utensílios ou equipamento; no contexto do campo de batalha, “armas” expressa com clareza o referente mais provável.
- source_word: וַיְשַׁלְּחוּ
  choice: enviaram a notícia
  rationale: O verbo significa simplesmente “enviaram”. A notícia é inferida do infinitivo seguinte, “anunciar”; esta formulação portuguesa mantém o sentido sem inserir mensageiros não mencionados explicitamente.
- source_word: בְאֶרֶץ פְלִשְׁתִּים סָבִיב
  choice: por toda a terra dos filisteus
  rationale: A expressão indica circulação em todas as direções pelo território filisteu; esta é uma formulação natural e fiel em português moderno.
- source_word: לְבַשֵּׂר
  choice: para anunciá-la
  rationale: בשר significa anunciar ou trazer notícias. Aqui se trata da proclamação triunfal da derrota de Saul, sem necessidade de qualificar expressamente a notícia como boa.
- source_word: עֲצַבֵּיהֶם
  choice: seus ídolos
  rationale: עֶצֶב pode designar uma imagem cultual ou um ídolo e frequentemente carrega sentido depreciativo no discurso bíblico. “Ídolos” é claro no contexto religioso filisteu, enquanto a alternativa lexical é registrada em nota.
- source_word: הָעָם
  choice: o povo
  rationale: O hebraico traz o substantivo coletivo definido no singular. “O povo” preserva essa forma sem acrescentar o possessivo “deles”.
theological_decisions:
- issue: Sentido de עֲצַבֵּיהֶם no contexto cultual
  choice: seus ídolos
  alternative: suas imagens
  rationale: O termo se refere às divindades filisteias representadas por imagens de culto. “Ídolos” conserva a avaliação negativa inerente ao uso bíblico, mas a nota mantém disponível a alternativa mais concreta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem narrativa concisa do hebraico foi preservada, e evitou-se acrescentar “armadura”, “decapitaram” ou “mensageiros”, elementos possíveis pelo contexto, mas não expressos nesta oração.
