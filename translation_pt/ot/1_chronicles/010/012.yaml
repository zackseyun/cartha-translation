base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/012.yaml
  text: Then all the valiant men arose and carried away the body of Saul and the bodies of his sons[a], and brought them to Jabesh[b]. They buried their bones under the oak in Jabesh and fasted seven days.
translation:
  language: pt
  text: Então todos os homens valentes se levantaram, levaram o corpo de Saul e os corpos de seus filhos e os trouxeram para Jabes[a]. Sepultaram os ossos de Saul e de seus filhos debaixo do carvalho[b], em Jabes, e jejuaram durante sete dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A narrativa mais ampla identifica o lugar como Jabes-Gileade; aqui o texto hebraico traz apenas “Jabes”.
    reason: cross_reference
  - marker: b
    text: Ou “terebinto”. A palavra hebraica אֵלָה pode designar uma árvore grande do tipo terebinto ou carvalho.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ חַיִל
  choice: todos os homens valentes
  rationale: A expressão אִישׁ חַיִל caracteriza homens de força, coragem ou valor militar. “Homens valentes” é natural, clara e preserva esse sentido marcial e honorífico.
- source_word: גּוּפַת ... גּוּפֹת
  choice: o corpo de Saul e os corpos de seus filhos
  rationale: גּוּפָה designa o corpo de uma pessoa morta. “Corpo/corpos” comunica isso claramente no contexto sem recorrer ao termo mais áspero “cadáver/cadáveres”.
- source_word: וַיִּשְׂאוּ
  choice: levaram
  rationale: נשא indica aqui erguer e transportar os corpos para longe do local onde estavam. “Levaram” expressa naturalmente o deslocamento no contexto.
- source_word: וַיְבִיאוּם יָבֵישָׁה
  choice: os trouxeram para Jabes
  rationale: O hebraico deste versículo traz apenas “Jabes”, com a terminação direcional. A tradução mantém a forma abreviada do topônimo, deixando a identificação mais completa para a nota.
- source_word: עַצְמוֹתֵיהֶם
  choice: os ossos deles
  rationale: עֶצֶם significa literalmente “osso”. A tradução conserva a imagem concreta e a aparente progressão entre transportar os corpos e sepultar os ossos, sem harmonizá-la para “restos mortais”.
- source_word: תַּחַת הָאֵלָה
  choice: debaixo do carvalho
  rationale: אֵלָה pode designar uma árvore grande do tipo carvalho ou terebinto. “Carvalho” é corrente e compreensível; a incerteza botânica genuína é preservada em nota.
- source_word: וַיָּצֻמוּ שִׁבְעַת יָמִים
  choice: e jejuaram durante sete dias
  rationale: Tradução direta do jejum de sete dias associado ao luto; “durante” torna natural em português a expressão de duração.
