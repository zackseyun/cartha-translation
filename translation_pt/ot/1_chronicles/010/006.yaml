base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/006.yaml
  text: So Saul died[a], and his three sons, and all his house died together.
translation:
  language: pt
  text: Assim, Saul morreu, e seus três filhos e toda a sua casa[a] morreram juntos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “toda a sua família” ou “todos os de sua casa”. Em hebraico, literalmente, “toda a sua casa”; a expressão pode referir-se ao grupo doméstico, à família ou à linhagem, e não a um edifício.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: Assim, Saul morreu
  rationale: O wayyiqtol de מוּת dá continuidade à narrativa e, neste contexto, apresenta o resultado dos acontecimentos anteriores. “Assim” comunica essa progressão de modo natural, enquanto “morreu” traduz diretamente o verbo.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וּשְׁלֹשֶׁת בָּנָיו
  choice: seus três filhos
  rationale: A construção com o numeral, o substantivo e o sufixo de terceira pessoa masculina singular significa “seus três filhos”, referindo-se aos filhos já mencionados no contexto.
- source_word: וְכָל בֵּיתוֹ
  choice: e toda a sua casa
  rationale: בַּיִת pode designar casa, família, grupo doméstico ou linhagem. “Casa” preserva essa amplitude sem restringir o sentido a uma única possibilidade interpretativa.
- source_word: יַחְדָּו
  choice: todos juntos
  rationale: O advérbio significa “juntos”. A inclusão de “todos” torna explícito em português o valor coletivo da frase, sem alterar seu alcance.
- source_word: מֵתוּ
  choice: também morreram
  rationale: O perfeito qal na terceira pessoa do plural retoma coletivamente os filhos e a casa de Saul. A repetição de “morreram” preserva a ênfase e a estrutura do hebraico; “também” liga naturalmente a segunda afirmação à morte de Saul.
theological_decisions:
- issue: Alcance de “toda a sua casa”
  choice: Manter “toda a sua casa” no texto principal, sem definir a expressão como todos os parentes ou descendentes de Saul.
  alternative: “toda a sua família” ou “todos os da sua casa”
  rationale: A expressão hebraica pode indicar família, grupo doméstico ou casa dinástica. Preservar “casa” mantém a ambiguidade genuína e evita transformar o verso em uma afirmação mais específica sobre cada parente ou descendente de Saul.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade no Brasil e compreensão internacional. O ponto e vírgula preserva a afirmação inicial sobre Saul e permite que o plural hebraico subsequente seja expresso com naturalidade. A repetição de “morreu/morreram” conserva a ênfase do original.
