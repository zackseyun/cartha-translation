  to: 'Então Saul disse ao seu escudeiro: “Tire a sua espada da bainha e atravesse-me com ela, para que estes incircuncisos não venham e me tratem de modo humilhante[a]”. Mas o escudeiro não quis, pois estava com muito medo. Então Saul pegou a espada e caiu sobre ela.'
