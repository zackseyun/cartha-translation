  text: וַ/יֹּ֣אמֶר שָׁאוּל֩ אֶל נֹשֵׂ֨א כֵלָ֜י/ו שְׁלֹ֥ף חַרְבְּ/ךָ֣ וְ/דָקְרֵ֣/נִי בָ֗/הּ פֶּן יָבֹ֜אוּ הָ/עֲרֵלִ֤ים הָ/אֵ֨לֶּה֙ וְ/הִתְעַלְּלוּ בִ֔/י וְ/לֹ֤א אָבָה֙ נֹשֵׂ֣א כֵלָ֔י/ו כִּ֥י יָרֵ֖א מְאֹ֑ד וַ/יִּקַּ֤ח שָׁאוּל֙ אֶת הַ/חֶ֔רֶב וַ/יִּפֹּ֖ל עָלֶֽי/הָ־׀־־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/004.yaml
  text: Then Saul said to his armor-bearer[a], “Draw your sword and thrust me through with it, lest these uncircumcised men come and mistreat me.” But his armor-bearer was not willing, because he was very afraid[c][b]. So Saul took the sword and fell on it.
translation:
  language: pt
  text: 'Então Saul disse ao seu escudeiro: “Tire a sua espada da bainha e atravesse-me com ela, para que estes incircuncisos não venham e me tratem de modo humilhante[a]”. Mas o escudeiro não quis, pois estava com muito medo. Então Saul pegou a espada e caiu sobre ela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “me maltratem”, “abusem de mim” ou “façam de mim objeto de escárnio”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: seu escudeiro
  rationale: O hebraico designa aquele que carregava as armas ou o equipamento de Saul; “escudeiro” é a expressão militar convencional e natural em português.
- source_word: שְׁלֹף חַרְבְּךָ
  choice: Tire a sua espada da bainha
  rationale: No contexto de uma espada, o imperativo significa sacá-la; a formulação explicita naturalmente em português o ato indicado pelo verbo hebraico.
- source_word: וְדָקְרֵנִי בָהּ
  choice: e atravesse-me com ela
  rationale: דקר indica perfurar com uma arma. “Atravesse-me” comunica a intenção fatal sem enfraquecer a força da ordem.
- source_word: פֶּן
  choice: para que ... não
  rationale: Expressa em português corrente o resultado temido introduzido pela partícula hebraica.
- source_word: הָעֲרֵלִים הָאֵלֶּה
  choice: estes incircuncisos
  rationale: Preserva a designação étnico-religiosa e depreciativa do hebraico, sem substituí-la pela identificação contextual “filisteus”.
- source_word: וְהִתְעַלְּלוּ בִי
  choice: e me tratem de modo humilhante
  rationale: O verbo abrange tratamento abusivo, cruel e degradante, sem definir exatamente sua forma; esta tradução conserva essa amplitude.
- source_word: וְלֹא אָבָה
  choice: não quis
  rationale: Equivale de modo direto e natural à falta de disposição ou consentimento expressa pelo hebraico.
- source_word: כִּי יָרֵא מְאֹד
  choice: pois estava com muito medo
  rationale: Mantém tanto a relação causal quanto a intensificação do medo.
- source_word: וַיִּפֹּל עָלֶיהָ
  choice: lançou-se sobre ela
  rationale: Embora literalmente seja “caiu sobre ela”, o contexto indica uma ação deliberada; “lançou-se” torna isso claro sem alterar o resultado narrado.
theological_decisions:
- issue: Natureza do tratamento que Saul temia
  choice: me tratem de modo humilhante
  alternative: abusem de mim; maltratem-me; façam de mim objeto de diversão
  rationale: O hebraico sugere tratamento degradante e possivelmente violento, mas não especifica sua forma. A tradução preserva a gravidade e a ambiguidade sem importar um cenário mais preciso.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe narrativa permanece direta; “incircuncisos” conserva a linguagem marcada do original, enquanto a nota registra a amplitude semântica do tratamento temido por Saul.
