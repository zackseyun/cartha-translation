base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/007.yaml
  text: When all the men of Israel who were in the valley saw that they had fled and that Saul and his sons were dead[a], they abandoned their cities and fled[c][b]; then the Philistines came and lived in them.
translation:
  language: pt
  text: Quando todos os homens de Israel[b] que estavam no vale[a] viram que eles haviam fugido e que Saul e seus filhos estavam mortos, abandonaram suas cidades e fugiram. Então os filisteus vieram e moraram nelas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na planície”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente “todo homem de Israel”, empregando linguagem masculina.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “se instalaram nelas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: viram
  rationale: Preserva o sentido básico e concreto de ראה, sem substituí-lo pelo mais interpretativo “perceberam”.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: todos os homens de Israel
  rationale: אִישׁ está no singular distributivo depois de כָּל e emprega linguagem explicitamente masculina; “homens” mantém esse dado do texto.
- source_word: אֲשֶׁר בָּעֵמֶק
  choice: que estavam no vale
  rationale: “Vale” é o sentido topográfico mais direto de עֵמֶק neste contexto; “planície” continua possível e é registrada em nota.
- source_word: כִּי נָסוּ
  choice: que eles haviam fugido
  rationale: O mais-que-perfeito expressa que a fuga já ocorrera quando foi observada. O pronome conserva a referência não explicitada do sujeito plural hebraico, sem identificar além do texto.
- source_word: וְכִי מֵתוּ שָׁאוּל וּבָנָיו
  choice: e que Saul e seus filhos estavam mortos
  rationale: A formulação apresenta naturalmente em português o estado resultante que os observadores constataram.
- source_word: וַיַּעַזְבוּ עָרֵיהֶם
  choice: abandonaram suas cidades
  rationale: “Abandonaram” transmite a ideia de deixar para trás sob a pressão da derrota, inerente ao contexto militar.
- source_word: וַיָּנֻסוּ
  choice: e fugiram
  rationale: “Fugiram” é a equivalência corrente, concisa e digna para נוס.
- source_word: וַיָּבֹאוּ פְלִשְׁתִּים
  choice: Então os filisteus vieram
  rationale: “Então” torna clara a progressão narrativa expressa pelo consecutivo hebraico sem acrescentar conteúdo.
- source_word: וַיֵּשְׁבוּ בָּהֶם
  choice: e passaram a morar nelas
  rationale: A expressão comunica em português atual a ocupação continuada das cidades abandonadas; “instalaram-se nelas” é uma alternativa possível.
