  text: וַ/יַּ֥רְא נֹשֵֽׂא כֵלָ֖י/ו כִּ֣י מֵ֣ת שָׁא֑וּל וַ/יִּפֹּ֥ל גַּם ה֛וּא עַל הַ/חֶ֖רֶב וַ/יָּמֹֽת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/005.yaml
  text: When his armor-bearer saw that Saul was dead[b][a], he too fell on the sword and died.
translation:
  language: pt
  text: Quando o seu escudeiro[a] viu que Saul estava morto, também ele caiu sobre a espada[b] e morreu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “o portador de suas armas”.'
    reason: lexical_alternative
  - marker: b
    text: “Cair sobre a espada” significa aqui matar a si mesmo com uma espada.
    reason: cultural_note
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: seu escudeiro
  rationale: A expressão significa literalmente “o portador de suas armas/equipamentos”. “Escudeiro” é o termo militar tradicional, natural e compreensível em português para essa função.
- source_word: כִּי
  choice: que
  rationale: 'Introduz o conteúdo percebido pelo escudeiro: ele viu que Saul estava morto.'
- source_word: מֵת
  choice: estava morto
  rationale: Expressa o estado de Saul no momento em que o escudeiro o viu, sem converter desnecessariamente a forma em uma ação anterior.
- source_word: וַיִּפֹּל
  choice: caiu
  rationale: Preserva o sentido comum do verbo נפל e a imagem concreta da expressão hebraica, enquanto a nota esclarece sua força no contexto.
- source_word: גַּם הוּא
  choice: também ele
  rationale: 'Mantém a ênfase aditiva: o escudeiro seguiu Saul na morte.'
- source_word: עַל הַחֶרֶב
  choice: sobre a espada
  rationale: Reproduz a formulação hebraica sem acrescentar o possessivo “sua”, que não aparece no texto-fonte.
- source_word: וַיָּמֹת
  choice: e morreu
  rationale: Mantém a sequência narrativa breve e confirma o resultado da ação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com vocabulário militar tradicional de ampla compreensão. A ordem foi ajustada de modo natural, sem eliminar a concisão nem a imagem do hebraico.
