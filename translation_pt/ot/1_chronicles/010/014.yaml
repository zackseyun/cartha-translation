  text: וְ/לֹֽא דָרַ֥שׁ בַּֽ/יהוָ֖ה וַ/יְמִיתֵ֑/הוּ וַ/יַּסֵּב֙ אֶת הַ/מְּלוּכָ֔ה לְ/דָוִ֖יד בֶּן יִשָֽׁי־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/014.yaml
  text: He did not seek Yahweh[b][a], so he put him to death and turned the kingdom over to David son of Jesse.
translation:
  language: pt
  text: Não buscou Yahweh[a]; por isso, Yahweh o fez morrer e transferiu o reino[b] para Davi, filho de Jessé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não consultou Yahweh” ou “não pediu orientação a Yahweh”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o reino”; também pode ser entendido como “a realeza” ou “o poder régio”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָרַשׁ בַּיהוָה
  choice: buscou Yahweh
  rationale: דָרַשׁ com ב e um referente divino pode significar buscar, consultar ou pedir orientação. “Buscou Yahweh” preserva tanto a ideia de consulta quanto a dimensão relacional mais ampla, sem restringir indevidamente o sentido.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: וַיְמִיתֵהוּ
  choice: Yahweh o fez morrer
  rationale: O hifil de מות expressa causação. A repetição de “Yahweh” em português elimina a ambiguidade pronominal e deixa clara a agência divina atribuída pelo contexto, sem explicar como essa agência se relaciona com causas secundárias.
- source_word: וַיַּסֵּב
  choice: transferiu
  rationale: O hifil de סבב, neste contexto de sucessão real, indica fazer passar ou transferir o domínio a outro.
- source_word: הַמְּלוּכָה
  choice: o reino
  rationale: מְלוּכָה pode designar reino, realeza ou poder régio. “O reino” é natural em português e mantém a amplitude do termo; “a realeza” continua sendo alternativa possível.
- source_word: לְדָוִיד בֶּן־יִשַׁי
  choice: para Davi, filho de Jessé
  rationale: Forma portuguesa natural para o patronímico hebraico e para o destinatário da transferência.
theological_decisions:
- issue: Agência na morte de Saul
  choice: O texto atribui a Yahweh a ação de fazer Saul morrer.
  alternative: Yahweh apenas permitiu que Saul morresse.
  rationale: A sequência verbal apresenta Yahweh como sujeito implícito de וַיְמִיתֵהוּ, e a forma causativa não deve ser suavizada para mera permissão. A tradução não desenvolve uma teoria sobre causas secundárias.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição do nome “Yahweh” evita que “ele o fez morrer” pareça ter Saul como sujeito. O ponto e vírgula e “por isso” tornam explícita a relação consequencial presente no contexto.
