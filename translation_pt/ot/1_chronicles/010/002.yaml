base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/002.yaml
  text: And the Philistines pursued Saul and his sons[a], and the Philistines struck down Jonathan, Abinadab, and Malchi-shua, the sons of Saul.
translation:
  language: pt
  text: Os filisteus perseguiram de perto Saul e seus filhos[a], e os filisteus abateram Jônatas, Abinadabe e Malquisua, filhos de Saul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «foram no encalço de Saul e de seus filhos». O verbo hebraico tem literalmente o sentido de «grudar-se» ou «apegar-se» e, aqui, descreve uma perseguição implacável em batalha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּדְבְּקוּ ... אַחֲרֵי
  choice: perseguiram de perto
  rationale: A construção com דבק, literalmente «grudar-se/apegar-se», seguida de אַחֲרֵי, descreve uma perseguição cerrada e persistente em contexto de batalha. «Perseguiram de perto» comunica naturalmente essa intensidade em português.
- source_word: בָנָיו
  choice: seus filhos
  rationale: O substantivo indica descendentes do sexo masculino, como confirmam os nomes apresentados em seguida.
- source_word: וַיַּכּוּ
  choice: mataram
  rationale: נכה pode significar ferir, golpear ou abater. Neste relato de batalha, os homens nomeados morrem; por isso, «mataram» expressa com clareza o resultado contextual sem arcaísmo.
- source_word: פְלִשְׁתִּים
  choice: os filisteus
  rationale: Forma tradicional e amplamente reconhecida em português para o nome desse povo. A segunda ocorrência explícita do hebraico foi absorvida para evitar repetição pesada, sem perda de referente.
- source_word: יוֹנָתָן
  choice: Jônatas
  rationale: Forma portuguesa bíblica tradicional e reconhecível do nome.
- source_word: אֲבִינָדָב
  choice: Abinadabe
  rationale: Forma portuguesa bíblica tradicional e reconhecível do nome.
- source_word: מַלְכִּי שׁוּעַ
  choice: Malquisua
  rationale: Transliteração portuguesa corrente do nome hebraico composto, adaptada à ortografia e à pronúncia do português.
- source_word: בְּנֵי שָׁאוּל
  choice: filhos de Saul
  rationale: Mantém a expressão apositiva que identifica os três homens nomeados, com formulação natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A intensidade do primeiro verbo foi preservada por «perseguiram de perto»; evitou-se repetir «os filisteus» na segunda oração porque a repetição soa pesada em português e o sujeito permanece inequívoco.
