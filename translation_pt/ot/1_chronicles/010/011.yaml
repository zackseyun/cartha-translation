  yaml_path: translation/ot/1_chronicles/010/011.yaml
  text: When all Jabesh-gilead heard all that the Philistines had done to Saul[b][a],
translation:
  language: pt
  text: Quando todos os habitantes de Jabes-Gileade[a] ouviram tudo o que os filisteus tinham feito a Saul[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “toda Jabes-Gileade”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “tinham feito contra Saul”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: Quando ... ouviram
  rationale: O wayyiqtol dá continuidade à narrativa, mas, neste contexto, introduz a circunstância temporal para a ação do versículo seguinte. “Quando ... ouviram” expressa naturalmente essa relação em português.
- source_word: כֹּל יָבֵישׁ גִּלְעָד
  choice: todos os habitantes de Jabes-Gileade
  rationale: A expressão hebraica diz literalmente “toda Jabes-Gileade”, usando o nome do lugar por seus moradores. A explicitação evita uma formulação pouco natural em português sem alterar o referente.
- source_word: אֵת כָּל אֲשֶׁר
  choice: tudo o que
  rationale: Reproduz de modo corrente e preciso a totalidade indicada pela construção hebraica.
- source_word: עָשׂוּ
  choice: tinham feito
  rationale: O mais-que-perfeito composto esclarece que as ações dos filisteus antecederam a notícia recebida pelos habitantes.
- source_word: פְלִשְׁתִּים
  choice: os filisteus
  rationale: Forma tradicional, amplamente reconhecida em português, para o nome desse povo.
- source_word: לְשָׁאוּל
  choice: a Saul
  rationale: A preposição לְ marca aqui a pessoa afetada pela ação. “A Saul” preserva a formulação menos interpretativa do hebraico; “contra Saul” explicita uma nuance possível.
