base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/001.yaml
  text: The Philistines fought against Israel[a], and the men of Israel fled from before the Philistines and fell slain on Mount Gilboa.
translation:
  language: pt
  text: Os filisteus lutaram contra Israel, e os homens de Israel[a] fugiram de diante dos filisteus e caíram mortos no monte Gilboa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “o homem de Israel fugiu”; o singular “homem” tem aqui sentido coletivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: Os filisteus
  rationale: O waw liga a narrativa ao contexto, mas não exige um marcador temporal explícito. “Filisteus” é a forma portuguesa consagrada para o nome desse povo.
- source_word: נִלְחֲמוּ בְיִשְׂרָאֵל
  choice: lutaram contra Israel
  rationale: O nifal de לחם com ב, neste contexto militar hostil, expressa combate contra um adversário; “lutaram contra” é claro e idiomático.
- source_word: וַיָּנָס אִישׁ יִשְׂרָאֵל
  choice: e os homens de Israel fugiram
  rationale: Embora אִישׁ esteja no singular, a expressão tem sentido coletivo. O plural natural em português comunica esse valor sem transformar o grupo militar em uma referência genérica a todo o povo.
- source_word: מִפְּנֵי פְלִשְׁתִּים
  choice: de diante dos filisteus
  rationale: Preserva a imagem espacial do idioma hebraico e comunica a retirada diante do inimigo, mantendo uma formulação digna e compreensível.
- source_word: וַיִּפְּלוּ חֲלָלִים
  choice: e caíram mortos
  rationale: A combinação é uma expressão de batalha que indica os que tombaram como vítimas fatais. “Caíram mortos” é natural em português e retém a imagem do verbo נפל.
- source_word: בְּהַר גִּלְבֹּעַ
  choice: no monte Gilboa
  rationale: “Monte Gilboa” é a forma toponímica natural em português, e a preposição “no” se ajusta ao cenário geográfico do combate.
