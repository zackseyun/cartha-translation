base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/010.yaml
  text: They put his armor in the house of their gods[b][a], and they fastened his skull in the house of Dagon.
translation:
  language: pt
  text: Puseram as armas de Saul no templo de seus deuses[a] e prenderam seu crânio[b] no templo de Dagom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “na casa de seus deuses”. A palavra “casa” é frequentemente usada para o templo de uma divindade.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sua cabeça”. O termo hebraico pode referir-se ao crânio ou à cabeça, mas “crânio” é a correspondência lexical mais precisa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: Puseram
  rationale: O verbo שׂים significa pôr, colocar ou depositar; “puseram” é natural e direto em português.
- source_word: כֵּלָיו
  choice: as armas de Saul
  rationale: כְּלִי pode designar objetos, utensílios, equipamentos ou armas. No contexto da morte em batalha e à luz do paralelo de 1 Samuel 31:10, “armas” comunica melhor o provável referente. O nome “Saul” explicita o possuidor sem ambiguidade em português.
- source_word: בֵּית אֱלֹהֵיהֶם
  choice: no templo de seus deuses
  rationale: בַּיִת significa literalmente “casa”, mas, quando se refere ao edifício dedicado a uma divindade, “templo” expressa naturalmente o sentido contextual em português.
- source_word: גֻּלְגָּלְתּוֹ
  choice: seu crânio
  rationale: גֻּלְגֹּלֶת designa especificamente o crânio, embora também possa referir-se à cabeça; “crânio” preserva a precisão e o caráter sombrio da exposição dos restos de Saul.
- source_word: תָקְעוּ
  choice: prenderam
  rationale: תקע pode significar cravar, fincar ou fixar. “Prenderam” comunica a fixação para exposição sem impor a imagem mais específica e incerta de empalamento.
- source_word: בֵּית דָּגוֹן
  choice: no templo de Dagom
  rationale: Em contexto cultual, בַּיִת denota o templo da divindade. דָּגוֹן é transliterado pela forma portuguesa tradicional “Dagom”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. Preferiu-se “templo” no texto por naturalidade contextual, preservando a forma literal “casa” em nota. A repetição de “templo” mantém o paralelismo do hebraico.
