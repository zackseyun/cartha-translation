  text: The battle grew heavy against Saul, and the archers found him, and he was badly wounded by the archers.
translation:
  language: pt
  text: A batalha se intensificou contra Saul. Os arqueiros o alcançaram, e ele foi ferido pelos arqueiros.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ele ficou muito angustiado por causa dos arqueiros”. O verbo hebraico também pode indicar grande angústia, em vez de ferimento físico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְבַּד
  choice: se intensificou
  rationale: O verbo כבד expressa literalmente a ideia de tornar-se pesado; no contexto de combate, indica que a batalha se tornou mais intensa ou pressionou com mais força. A formulação escolhida comunica naturalmente esse sentido em português.
- source_word: הַמִּלְחָמָה עַל שָׁאוּל
  choice: A batalha ... contra Saul
  rationale: מִלְחָמָה significa “batalha”, e עַל tem aqui sentido hostil, expresso naturalmente por “contra”.
- source_word: וַיִּמְצָאֻהוּ
  choice: o alcançaram
  rationale: מצא significa normalmente “encontrar”, mas, nesta narrativa militar, descreve os arqueiros chegando até Saul ou dando alcance a ele. “Alcançaram” torna esse sentido contextual claro sem acrescentar uma ação não indicada.
- source_word: הַמּוֹרִים בַּקָּשֶׁת
  choice: os arqueiros
  rationale: A expressão significa literalmente “os que atiram com o arco”; “os arqueiros” é sua forma corrente e precisa em português.
- source_word: וַיָּחֶל
  choice: ficou gravemente ferido
  rationale: A forma verbal é difícil e pode indicar ferimento grave ou intensa angústia. No contexto imediato e à luz do paralelo de 1 Samuel 31:3, a referência a ferimento é uma leitura plausível; “gravemente” representa a intensidade tradicionalmente associada à forma, enquanto a alternativa semântica é preservada em nota.
- source_word: מִן הַיּוֹרִים
  choice: pelos arqueiros
  rationale: מִן pode marcar origem, causa ou agente. Com a leitura passiva de וַיָּחֶל, “pelos arqueiros” é natural em português.
theological_decisions:
- issue: Natureza da condição de Saul expressa por וַיָּחֶל
  choice: ferimento físico grave
  alternative: grande angústia ou terror por causa dos arqueiros
  rationale: A ambiguidade é lexical, não propriamente doutrinária. O texto principal adota a leitura física favorecida pelo contexto narrativo, mas a nota mantém visível a leitura de sofrimento intenso para não eliminar uma possibilidade real do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Se intensificou” evita o pouco natural “ficou pesada”, embora não reproduza literalmente a imagem hebraica. A repetição de “arqueiros” foi mantida porque corresponde à repetição de designações no hebraico e ajuda a preservar a estrutura do versículo.
