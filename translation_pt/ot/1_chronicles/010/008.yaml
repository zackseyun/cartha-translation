  text: וַ/יְהִי֙ מִֽ/מָּחֳרָ֔ת וַ/יָּבֹ֣אוּ פְלִשְׁתִּ֔ים לְ/פַשֵּׁ֖ט אֶת הַֽ/חֲלָלִ֑ים וַֽ/יִּמְצְא֤וּ אֶת שָׁאוּל֙ וְ/אֶת בָּנָ֔י/ו נֹפְלִ֖ים בְּ/הַ֥ר גִּלְבֹּֽעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/008.yaml
  text: It happened on the next day that the Philistines came to strip the slain[b][a], and they found Saul and his sons fallen on Mount Gilboa.
translation:
  language: pt
  text: No dia seguinte[a], os filisteus vieram para despojar os mortos[b] e encontraram Saul e seus filhos caídos no monte Gilboa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “No outro dia”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, retirar dos mortos em combate objetos como roupas, armas e armaduras.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: No dia seguinte
  rationale: A fórmula narrativa introduz o acontecimento ocorrido no dia posterior aos eventos recém-narrados. Em português, a expressão temporal por si só dá continuidade natural à narrativa, sem exigir um marcador como “ora”.
- source_word: לְפַשֵּׁט
  choice: despojar
  rationale: Neste contexto de campo de batalha, o verbo indica retirar dos mortos bens como roupas, armas e armaduras. “Despojar” expressa essa ação com precisão e dignidade.
- source_word: הַחֲלָלִים
  choice: os mortos
  rationale: O termo designa os que foram mortos em combate. “Os mortos” é claro e natural em português; o contexto militar preserva o sentido específico.
- source_word: נֹפְלִים
  choice: caídos
  rationale: Mantém a imagem literal hebraica e o uso narrativo militar do particípio, que aqui implica que Saul e seus filhos estavam mortos.
- source_word: בְּהַר גִּלְבֹּעַ
  choice: no monte Gilboa
  rationale: Forma portuguesa natural para o nome geográfico e a localização sobre o monte.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Despojar” conserva o sentido específico do saque dos mortos sem recorrer a uma paráfrase extensa no texto principal.
