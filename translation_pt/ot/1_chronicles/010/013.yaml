source:
  edition: WLC
  text: וַ/יָּ֣מָת שָׁא֗וּל בְּ/מַֽעֲל/וֹ֙ אֲשֶׁ֣ר מָעַ֣ל בַּֽ/יהוָ֔ה עַל דְּבַ֥ר יְהוָ֖ה אֲשֶׁ֣ר לֹא שָׁמָ֑ר וְ/גַם לִ/שְׁא֥וֹל בָּ/א֖וֹב לִ/דְרֽוֹשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/013.yaml
  text: So Saul died for his unfaithfulness by which he was unfaithful to Yahweh[a], because of the word of Yahweh, which he did not keep, and also because he asked counsel of a medium[b], to inquire.
translation:
  language: pt
  text: Assim, Saul morreu por sua infidelidade, pela qual foi infiel a Yahweh[a], por não ter guardado a palavra de Yahweh e também por ter consultado uma médium[b], a fim de buscar orientação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por sua quebra de fidelidade, pela qual agiu de modo infiel contra Yahweh”.'
    reason: lexical_alternative
  - marker: b
    text: “Médium” é uma pessoa que procura obter informações dos mortos ou de espíritos; compare 1 Samuel 28:7.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָת
  choice: Assim, ... morreu
  rationale: O waw consecutivo dá continuidade à narrativa e, neste contexto conclusivo, também apresenta a morte como resultado do que foi narrado.
- source_word: בְּמַעֲלוֹ אֲשֶׁר מָעַל
  choice: por sua infidelidade, pela qual foi infiel
  rationale: Preserva a repetição enfática do substantivo e do verbo cognatos e expressa a quebra de lealdade pactual, não apenas um erro genérico.
- source_word: בַּיהוָה
  choice: a Yahweh
  rationale: Com מָעַל, a preposição indica aquele contra quem ou em relação a quem se cometeu a infidelidade; em português, 'ser infiel a' é natural.
- source_word: עַל דְּבַר יְהוָה אֲשֶׁר לֹא שָׁמָר
  choice: não guardou a palavra de Yahweh
  rationale: A formulação mantém 'palavra' e o sentido pactual de שׁמר como observar ou obedecer, evitando uma construção causal pesada em português.
- source_word: וְגַם לִשְׁאוֹל בָּאוֹב לִדְרֹשׁ
  choice: e também consultou uma médium para buscar orientação
  rationale: Representa os infinitivos hebraicos por uma oração finita natural e conserva a finalidade expressa por לִדְרֹשׁ, sem especificar indevidamente de quem se buscava resposta.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o nome pactual; 'Yahweh' o representa como nome próprio, em vez de substituí-lo por um título.
- issue: Caracterização do pecado de Saul
  choice: infidelidade / foi infiel
  alternative: transgressão / transgrediu; quebra de fidelidade
  rationale: Mantém tanto a dimensão pactual de מַעַל quanto a repetição cognata deliberada do hebraico.
- issue: Referente de אוֹב
  choice: médium
  alternative: espírito; espírito familiar; necromante
  rationale: No contexto de 1 Samuel 28, o termo se refere naturalmente à pessoa consultada, mas sua amplitude histórico-lexical justifica uma nota explicativa.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura foi ligeiramente reorganizada para evitar ambiguidade causal e preservar a dupla acusação: Saul não guardou a palavra de Yahweh e consultou uma médium.'
