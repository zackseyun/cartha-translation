base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/011.yaml
  text: And David was angry because Yahweh had broken out against Uzza[a]; so he called that place Perez-uzza to this day.
translation:
  language: pt
  text: Davi ficou irado porque Yahweh irrompeu contra Uzá[a]; por isso, deu àquele lugar o nome de Perez-Uzá, nome que conserva até hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Perez-Uzá” soa como “brecha contra Uzá” ou “irrupção contra Uzá”, retomando o jogo de palavras hebraico da expressão “Yahweh irrompeu contra Uzá”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְדָוִיד
  choice: Davi ficou irado
  rationale: A expressão idiomática indica que a ira de Davi se acendeu. “Ficou irado” comunica claramente a força emocional em português atual e digno.
- source_word: כִּי
  choice: porque
  rationale: Introduz diretamente a causa da ira de Davi.
- source_word: פָרַץ יְהוָה פֶּרֶץ
  choice: Yahweh irrompeu
  rationale: O verbo e o substantivo cognatos descrevem uma irrupção ou ruptura súbita. “Irrompeu” preserva a imagem verbal de força repentina; o jogo completo de palavras é explicado na nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּעֻזָּא
  choice: contra Uzá
  rationale: A preposição indica aqui o alvo da irrupção divina; “contra” é natural e inequívoco em português.
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: por isso, deu àquele lugar o nome de
  rationale: Expressa naturalmente em português a fórmula hebraica de nomeação e deixa claro que Perez-Uzá é um topônimo.
- source_word: פֶּרֶץ עֻזָּא
  choice: Perez-Uzá
  rationale: Mantém o nome do lugar por transliteração, com acentuação adequada à leitura portuguesa; seu sentido e o jogo de palavras são preservados em nota.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: como é chamado até hoje
  rationale: No contexto da nomeação, explicita naturalmente que o nome permaneceu em uso até o tempo do narrador.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. A transliteração conserva o nome pessoal divino sem substituí-lo por um título.
- issue: Natureza da reação de Davi
  choice: ficou irado
  alternative: ficou desgostoso
  rationale: O idioma חרה ל normalmente expressa ira acesa. A tradução mantém essa tensão narrativa sem atenuar ou explicar contra quem a ira foi dirigida.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém a concisão narrativa, o nome divino transliterado e o jogo etimológico por meio de nota, sem tornar o corpo do versículo artificial.
