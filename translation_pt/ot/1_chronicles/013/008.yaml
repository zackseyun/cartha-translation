  text: וְ/דָוִ֣יד וְ/כָל יִשְׂרָאֵ֗ל מְשַׂחֲקִ֛ים לִ/פְנֵ֥י הָ/אֱלֹהִ֖ים בְּ/כָל עֹ֑ז וּ/בְ/שִׁירִ֤ים וּ/בְ/כִנֹּרוֹת֙ וּ/בִ/נְבָלִ֣ים וּ/בְ/תֻפִּ֔ים וּ/בִ/מְצִלְתַּ֖יִם וּ/בַ/חֲצֹצְרֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/008.yaml
  text: And David and all Israel were celebrating before God with all their might[a], with songs, lyres, harps, tambourines, cymbals, and trumpets.
translation:
  language: pt
  text: Davi e todo o Israel celebravam[a] diante de Deus com todas as suas forças, com cânticos, liras, harpas, pandeiros, címbalos e trombetas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: festejavam, alegravam-se ou brincavam diante de Deus; o verbo hebraico pode indicar uma atividade festiva, alegre ou lúdica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׂחֲקִים
  choice: celebravam
  rationale: O particípio de שׂחק pode descrever atividade lúdica, alegre ou festiva. No contexto da procissão acompanhada por música, “celebravam” comunica de modo natural a alegria pública, sem limitar a ação ao ato de tocar instrumentos.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: diante de Deus
  rationale: Reproduz de forma concisa a ideia de atividade realizada na presença de Deus, com sentido cultual e relacional.
- source_word: בְּכָל עֹז
  choice: com todas as suas forças
  rationale: עֹז denota força ou vigor. A expressão portuguesa comunica a intensidade da celebração e concorda naturalmente com o sujeito coletivo plural.
- source_word: שִׁירִים
  choice: cânticos
  rationale: Preserva o substantivo plural e, neste contexto de celebração religiosa, soa mais apropriado e digno do que o termo mais genérico “canções”.
- source_word: כִנֹּרוֹת
  choice: liras
  rationale: כִּנּוֹר designa provavelmente um instrumento de cordas do tipo lira; esta opção é mais precisa do que a tradução tradicional “harpas” e mantém a distinção em relação a נְבָלִים.
- source_word: נְבָלִים
  choice: harpas
  rationale: Designa outro instrumento de cordas, distinto da lira. Como sua forma exata é incerta, “harpas” oferece um equivalente moderno reconhecível sem recorrer a termos arcaicos.
- source_word: תֻפִּים
  choice: tamborins
  rationale: תֹּף era um tambor de moldura ou instrumento semelhante ao tamborim. “Tamborins” é uma designação acessível e adequada em português.
- source_word: מְצִלְתַּיִם
  choice: címbalos
  rationale: É o equivalente português convencional e preciso para esse instrumento de percussão.
- source_word: חֲצֹצְרוֹת
  choice: trombetas
  rationale: O termo designa trombetas cerimoniais, provavelmente retas. O material de fabricação não é especificado neste versículo e, por isso, não foi acrescentado.
- source_word: וְדָוִיד וְכָל יִשְׂרָאֵל
  choice: Davi e todo o Israel
  rationale: Mantém a designação coletiva nacional de maneira natural. A conjunção inicial não é necessária em português quando o versículo é apresentado isoladamente, embora sua função narrativa permaneça implícita.
theological_decisions:
- issue: Sentido de הָאֱלֹהִים com artigo
  choice: Deus
  alternative: o Deus
  rationale: Embora o hebraico empregue o artigo, aqui a expressão funciona como designação usual do Deus de Israel. “Deus” é natural em português e não altera a identidade daquele diante de quem ocorre a celebração.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A tradução conserva a lista de instrumentos e o caráter vigoroso da celebração, evitando tanto arcaísmos como especificações instrumentais não presentes no texto.
