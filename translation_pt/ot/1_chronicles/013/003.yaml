source:
  edition: WLC
  text: וְ/נָסֵ֛בָּה אֶת אֲר֥וֹן אֱלֹהֵ֖י/נוּ אֵלֵ֑י/נוּ כִּי לֹ֥א דְרַשְׁנֻ֖/הוּ בִּ/ימֵ֥י שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/003.yaml
  text: And let us bring the ark of our God back to us[a], for we did not seek it in the days of Shaul.
translation:
  language: pt
  text: E vamos trazer de volta para junto de nós a arca do nosso Deus[a], pois não a buscamos nos dias de Saul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não a consultamos”; também se pode entender: “não o buscamos/consultamos”, isto é, a Deus. O verbo hebraico pode significar tanto buscar como consultar, e o referente pretendido admite mais de uma interpretação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסֵבָּה
  choice: E vamos trazer de volta
  rationale: O coortativo na primeira pessoa do plural expressa uma proposta coletiva. No contexto do transporte da arca, “vamos trazer de volta” comunica naturalmente o movimento de retorno.
- source_word: אֶת אֲרוֹן אֱלֹהֵינוּ
  choice: a arca do nosso Deus
  rationale: Reproduz diretamente a cadeia construta e mantém a referência concreta ao objeto sagrado.
- source_word: אֵלֵינוּ
  choice: para junto de nós
  rationale: Expressa a direção para a comunidade e evita a formulação menos natural “de volta para nós”.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da proposta com tom narrativo digno e natural.
- source_word: לֹא דְרַשְׁנֻהוּ
  choice: não a buscamos
  rationale: דרשׁ pode significar buscar, procurar ou consultar. O sufixo masculino singular retoma gramaticalmente אֲרוֹן, substantivo masculino em hebraico; em português, a concordância com “arca” exige o pronome feminino “a”.
- source_word: בִּימֵי שָׁאוּל
  choice: nos dias de Saul
  rationale: É a expressão portuguesa tradicional, clara e amplamente reconhecida para o nome hebraico שָׁאוּל.
theological_decisions:
- issue: Objeto de “não buscamos”
  choice: “não a buscamos”, referindo-se gramaticalmente à arca
  alternative: “não o buscamos” ou “não consultamos a Deus”
  rationale: O sufixo hebraico aponta mais naturalmente para “arca”, embora a frase possa implicar a negligência em buscar ou consultar Deus por meio dela. A tradução principal preserva a referência gramatical concreta, e a nota registra a ambiguidade sem resolvê-la doutrinariamente.
translation_notes:
  register: 'Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Saul” segue a forma portuguesa consolidada. A construção evita atribuir gênero natural ao referente hebraico: o pronome feminino decorre da gramática portuguesa de “arca”.'
