base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/004.yaml
  text: And all the assembly said to do so[a], for the matter was right in the eyes of all the people.
translation:
  language: pt
  text: E toda a assembleia disse que se fizesse assim[a], pois isso era correto aos olhos de todo o povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Toda a assembleia concordou em fazer assim”; a formulação hebraica expressa o consentimento da assembleia com a proposta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: concordou
  rationale: Embora o verbo seja literalmente “disse”, neste contexto ele expressa verbalmente o consentimento coletivo da assembleia; “concordou” comunica essa função com naturalidade, sem sugerir mero assentimento interior.
- source_word: כָל הַקָּהָל
  choice: toda a assembleia
  rationale: קָהָל designa a comunidade reunida. “Toda a assembleia” é claro, digno e evita uma possível conotação eclesiástica de “congregação”.
- source_word: לַעֲשׂוֹת כֵּן
  choice: em fazer assim
  rationale: A construção com o infinitivo de עשה e כֵּן significa agir conforme a proposta anteriormente apresentada; “fazer assim” preserva de modo natural a expressão hebraica.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão do consentimento da assembleia; “pois” mantém com concisão a relação explicativa.
- source_word: יָשַׁר
  choice: pareceu correta
  rationale: O adjetivo descreve a proposta como reta, apropriada ou aceitável segundo a avaliação do povo. Com a expressão “a todo o povo”, “pareceu correta” reproduz naturalmente essa perspectiva.
- source_word: הַדָּבָר
  choice: a proposta
  rationale: דָּבָר pode significar palavra, assunto ou coisa. Aqui se refere ao plano apresentado no contexto imediato; “proposta” torna o referente claro sem alterar seu sentido.
- source_word: בְּעֵינֵי
  choice: pareceu ... a
  rationale: O idioma hebraico “era reto aos olhos de” é expresso em português corrente por “pareceu correto a”, preservando a ideia de avaliação.
- source_word: כָל הָעָם
  choice: todo o povo
  rationale: עָם refere-se coletivamente ao povo, e כָל é mantido por “todo”.
