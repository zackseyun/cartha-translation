base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/009.yaml
  text: When they came to the threshing floor of Kidon[a], Uzza reached out his hand to take hold of the ark, because the oxen stumbled.
translation:
  language: pt
  text: Quando chegaram à eira de Quidom, Uzá estendeu a mão para segurar a arca, porque os bois tropeçaram[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “escorregaram”. O verbo hebraico pode indicar escorregar ou deixar cair alguma coisa; aqui descreve o movimento dos bois que desestabilizou a carga.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּרֶן כִּידֹן
  choice: a eira de Quidom
  rationale: גֹּרֶן designa a área onde se debulhavam cereais; “eira” é o equivalente português preciso e corrente no contexto bíblico. כִּידֹן é nome de lugar, transliterado como “Quidom” segundo a ortografia portuguesa.
- source_word: וַיִּשְׁלַח ... אֶת יָדוֹ
  choice: estendeu a mão
  rationale: A construção idiomática com שׁלח e “mão” descreve o ato físico de estender a mão; a formulação é natural e mantém a ação explícita.
- source_word: לֶאֱחֹז
  choice: para segurar
  rationale: 'O infinitivo de אחז expressa a finalidade do gesto: agarrar ou segurar. “Segurar” convém ao contexto sem sugerir uma apreensão violenta.'
- source_word: הָאָרוֹן
  choice: a arca
  rationale: O hebraico traz apenas “a arca”; não se acrescenta “de Deus”, embora essa identificação esteja clara no contexto mais amplo.
- source_word: כִּי
  choice: porque
  rationale: כִּי introduz a razão pela qual Uzá estendeu a mão.
- source_word: שָׁמְטוּ
  choice: tropeçaram
  rationale: O verbo pode indicar escorregar ou deixar cair/soltar. Tendo “os bois” como sujeito, “tropeçaram” comunica de modo natural o movimento que ameaçou a estabilidade da arca, sem eliminar a alternativa lexical.
- source_word: הַבָּקָר
  choice: os bois
  rationale: Embora בָּקָר possa designar gado de modo geral, neste contexto são os animais de tração que puxavam o carro; “bois” é a opção mais precisa.
