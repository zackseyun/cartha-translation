base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/001.yaml
  text: And David consulted with the commanders of the thousands and the hundreds[a], with every leader.
translation:
  language: pt
  text: Davi se aconselhou com os comandantes de milhares e de centenas, com todos os líderes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Davi consultou os chefes de milhares e de centenas, todos os líderes”.'
    reason: Alternativa de redação que usa “consultou” e conserva uma construção mais próxima da sintaxe concisa do hebraico; a relação exata entre os grupos pode ser entendida de formas ligeiramente diferentes.
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: consultou
  rationale: O nifal de יעץ expressa deliberação ou consulta; “consultou” é natural e preserva esse sentido.
- source_word: עִם
  choice: os
  rationale: Em português, o verbo “consultar” rege objeto direto; assim, a ideia associativa de עִם é expressa idiomaticamente sem “com”.
- source_word: שָׂרֵי
  choice: comandantes
  rationale: Na combinação com unidades de mil e de cem, שָׂרֵי indica chefes militares ou administrativos; “comandantes” comunica bem essa função.
- source_word: הָאֲלָפִים וְהַמֵּאוֹת
  choice: das unidades de mil e de cem
  rationale: Os números designam divisões militares ou administrativas, não apenas quantidades de indivíduos; “unidades” torna isso claro sem apagar a estrutura numérica hebraica.
- source_word: לְכָל נָגִיד
  choice: isto é, todos os líderes
  rationale: A expressão provavelmente explicita a totalidade dos comandantes mencionados. “Líderes” preserva a amplitude de נָגִיד, enquanto “isto é” apresenta a leitura apositiva no texto.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. “Unidades de mil e de cem” evita a estranheza de “os milhares e as centenas” e esclarece o provável contexto organizacional. A nota preserva a alternativa mais formal e a possível ambiguidade sintática.
