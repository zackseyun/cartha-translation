base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/012.yaml
  text: And David feared God that day[a], saying, “How can I bring the ark of God to me?”
translation:
  language: pt
  text: 'Naquele dia, Davi teve medo de Deus[a] e disse: “Como poderei trazer para junto de mim a arca de Deus?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “temeu a Deus”; o verbo hebraico pode indicar medo, pavor ou temor reverente, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירָא
  choice: teve medo de
  rationale: O verbo ירא, no contexto imediato da morte de Uzá, expressa medo ou temor diante do juízo divino. “Teve medo de” comunica naturalmente essa reação em português, enquanto a nota preserva a possibilidade de temor reverente.
- source_word: אֶת הָאֱלֹהִים
  choice: Deus
  rationale: O marcador de objeto direto não se traduz, e “Deus” é a forma portuguesa natural para o substantivo definido neste contexto.
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Expressão temporal direta e idiomática, que mantém a referência ao dia dos acontecimentos anteriores.
- source_word: לֵאמֹר
  choice: e disse
  rationale: O infinitivo hebraico introduz discurso direto. Em narrativa portuguesa, “e disse” reproduz sua função com maior naturalidade do que o gerúndio “dizendo”.
- source_word: הֵיךְ
  choice: Como poderei
  rationale: Introduz uma pergunta sobre a possibilidade de levar a arca. O futuro “poderei” expressa naturalmente a inquietação de Davi quanto ao que pretende fazer.
- source_word: אָבִיא
  choice: trazer
  rationale: O hifil de בוא tem sentido causativo, “fazer vir”, normalmente expresso em português por “trazer”.
- source_word: אֵלַי
  choice: para junto de mim
  rationale: Preserva a direção para Davi sem explicitar indevidamente se o destino era sua pessoa, residência ou cidade.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: a arca de Deus
  rationale: Reproduz com clareza a cadeia construta e mantém a terminologia solene recorrente da narrativa.
theological_decisions:
- issue: Natureza da reação de Davi ao juízo de Deus
  choice: teve medo de Deus
  alternative: temeu a Deus; reverenciou a Deus
  rationale: A morte de Uzá torna o medo a nuance contextual mais imediata. A tradução não suaviza a reação para simples reverência, e a nota reconhece a amplitude semântica do verbo hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem temporal inicial e o discurso direto mantêm o fluxo narrativo; “para junto de mim” conserva a ambiguidade do destino implícita no hebraico.
