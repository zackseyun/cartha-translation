  text: וַ/יַּ֨עַל דָּוִ֤יד וְ/כָל יִשְׂרָאֵל֙ בַּעֲלָ֔תָ/ה אֶל קִרְיַ֥ת יְעָרִ֖ים אֲשֶׁ֣ר לִ/יהוּדָ֑ה לְ/הַעֲל֣וֹת מִ/שָּׁ֗ם אֵת֩ אֲר֨וֹן הָ/אֱלֹהִ֧ים יְהוָ֛ה יוֹשֵׁ֥ב הַ/כְּרוּבִ֖ים אֲשֶׁר נִקְרָ֥א שֵֽׁם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/006.yaml
  text: So David and all Israel went up to Baalah[a], that is, to Kiriath-jearim, which belongs to Judah, to bring up from there the ark of God, Yahweh who is enthroned above the cherubim, whose name is called upon it.
translation:
  language: pt
  text: Assim, Davi e todo o Israel subiram a Baalá, isto é, a Quiriate-Jearim, que pertence a Judá, para trazer de lá a arca de Deus — Yahweh, que está entronizado sobre os querubins —, a qual é chamada pelo Nome.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a arca de Deus — Yahweh, que está entronizado sobre os querubins —, sobre a qual se invoca o nome dele”. Compare 2 Samuel 6:2.'
    reason: O hebraico da oração final é elíptico e permite relacionar de maneiras diferentes a arca, o Nome e Yahweh; o paralelo em 2 Samuel sustenta a alternativa apresentada.
lexical_decisions:
- source_word: וַיַּעַל
  choice: foram
  rationale: Embora עלה tenha o sentido básico de “subir”, em contexto de deslocamento a forma plural natural em português é “foram”, concordando semanticamente com Davi e todo o Israel; a ideia de elevação reaparece em לְהַעֲלוֹת.
- source_word: בַּעֲלָתָה
  choice: a Baalá
  rationale: Nome geográfico com ה direcional, indicando movimento para Baalá; a forma portuguesa recebe acento para orientar a pronúncia.
- source_word: אֶל קִרְיַת יְעָרִים
  choice: isto é, a Quiriate-Jearim
  rationale: O segundo topônimo identifica de modo apositivo o lugar chamado Baalá; “isto é” torna essa relação clara em português corrente.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: que pertence a Judá
  rationale: A construção com ל indica associação com Judá, provavelmente seu território tribal; “pertence a” preserva essa relação sem reduzi-la apenas à localização.
- source_word: לְהַעֲלוֹת מִשָּׁם
  choice: para trazer de lá
  rationale: O hifil de עלה descreve o transporte da arca daquele lugar. “Trazer de lá” é natural em português e evita a expressão pouco idiomática “fazer subir”, embora não explicite a direção ascendente.
- source_word: אֵת אֲרוֹן הָאֱלֹהִים
  choice: a arca de Deus
  rationale: Tradução direta e consagrada da construção nominal hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: יוֹשֵׁב הַכְּרוּבִים
  choice: que está entronizado sobre os querubins
  rationale: O particípio יוֹשֵׁב, associado aos querubins e à arca, evoca o reinado de Yahweh. “Sobre” comunica a imagem sem inserir o interpretativo “entre”, ausente no hebraico.
- source_word: אֲשֶׁר נִקְרָא שֵׁם
  choice: a qual é chamada pelo Nome
  rationale: A frase hebraica é elíptica e admite mais de uma análise. Esta formulação portuguesa conserva a passiva e a referência solene ao Nome, enquanto a nota registra a leitura que relaciona o nome invocado à arca.
theological_decisions:
- issue: Representação do tetragrama יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz explicitamente o nome divino; transliterá-lo preserva a distinção entre nome próprio e título.
- issue: Sentido da oração final אֲשֶׁר נִקְרָא שֵׁם
  choice: a qual é chamada pelo Nome
  alternative: sobre a qual o nome dele é invocado
  rationale: O hebraico massorético é comprimido e seu antecedente não é plenamente explícito. A tradução principal evita decidir em excesso, e a nota oferece a leitura favorecida pelo paralelo de 2 Samuel 6:2.
- issue: Relação de Yahweh com os querubins
  choice: entronizado sobre os querubins
  alternative: sentado entre os querubins
  rationale: A linguagem de entronização expressa a imagem régia sugerida pelo contexto da arca, mas não acrescenta “entre”, relação espacial que o hebraico deste versículo não marca.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas toponímicas reconhecíveis para leitores brasileiros. Os travessões delimitam a aposição referente a Yahweh e reduzem a ambiguidade sintática sem apagar a dificuldade real da oração final.
