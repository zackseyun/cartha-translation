    issue: Perda do sentido direcional em «foram»
    rationale: וַיַּעַל significa literalmente «subiu/subiram». Embora «foram» seja possível como simplificação idiomática, «subiram» é natural em português e preserva a escolha verbal do hebraico, especialmente em paralelo com o infinitivo causativo posterior.
  - severity: low
    issue: Formulação da nota alternativa
    rationale: «o nome dele é invocado» é compreensível, mas «se invoca o nome dele» é mais natural em português e evita uma passiva menos fluida. A alternativa deve continuar marcada como leitura possível do hebraico elíptico, não como resolução do texto.
