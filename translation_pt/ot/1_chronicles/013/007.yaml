base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/007.yaml
  text: So they set the ark of God on a new cart from the house of Abinadab[a], and Uzza and Ahio were guiding the cart.
translation:
  language: pt
  text: Então transportaram a arca de Deus da casa de Abinadabe num carro novo. Uzá e Aiô conduziam o carro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dirigiam o carro”. O particípio hebraico pode se referir a guiar ou dirigir um veículo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְכִּיבוּ
  choice: puseram ... sobre
  rationale: O hifil de רכב expressa fazer algo ir ou ser transportado sobre um veículo. A formulação comunica de modo natural a colocação da arca no carro, sem perder a imagem concreta.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: a arca de Deus
  rationale: Reproduz de modo idiomático a construção hebraica e conserva o termo tradicional e preciso para אֲרוֹן neste contexto sagrado.
- source_word: עַל עֲגָלָה חֲדָשָׁה
  choice: sobre um carro novo
  rationale: עגלה designa um carro ou carroça. “Carro” é claro neste contexto antigo, e “sobre” preserva a relação espacial expressa por עַל.
- source_word: מִבֵּית אֲבִינָדָב
  choice: da casa de Abinadabe
  rationale: A preposição מן indica a origem do transporte. A expressão foi integrada a “a levaram” para produzir português natural e explicitar o movimento já contido na construção hebraica.
- source_word: עֻזָּא
  choice: Uzá
  rationale: Transliteração portuguesa corrente do nome hebraico, com acento para indicar a pronúncia.
- source_word: אַחְיוֹ
  choice: Aiô
  rationale: Transliteração portuguesa corrente, com acento para indicar a tonicidade final.
- source_word: נֹהֲגִים
  choice: conduziam
  rationale: O particípio de נהג pode descrever quem guia ou dirige um veículo. O imperfeito português retrata a ação em andamento no pano de fundo narrativo.
- source_word: בָּעֲגָלָה
  choice: o carro
  rationale: Com נהג, a preposição ב pode introduzir o veículo conduzido. Em português, o objeto direto é a construção mais natural.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com nomes adaptados à forma portuguesa. A tradução mantém a sequência narrativa e usa “conduziam” sem especificar indevidamente se os homens guiavam os animais de tração ou controlavam diretamente o carro.
