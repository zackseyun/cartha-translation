source:
  edition: WLC
  text: וְ/לֹֽא הֵסִ֨יר דָּוִ֧יד אֶת הָ/אָר֛וֹן אֵלָ֖י/ו אֶל עִ֣יר דָּוִ֑יד וַ/יַּטֵּ֕/הוּ אֶל בֵּ֥ית עֹבֵֽד אֱדֹ֖ם הַ/גִּתִּֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/013.yaml
  text: So David did not bring the ark to himself[a], into the City of David; instead[b], he turned it aside to the house of Obed-edom the Gittite.
translation:
  language: pt
  text: Por isso, Davi não levou a arca para junto de si[a], à Cidade de Davi; em vez disso, desviou-a[b] para a casa de Obede-Edom, o geteu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «não retirou a arca para junto de si». O verbo hebraico pode significar «retirar» ou, neste contexto, «levar».
    reason: lexical_alternative
  - marker: b
    text: Ou «fez com que ela se desviasse» ou «levou-a para outro lugar».
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסִיר
  choice: não levou
  rationale: No hifil, סוּר pode significar retirar, afastar ou fazer mudar de lugar. Neste contexto, a arca não prossegue até o destino pretendido; «não levou» comunica isso naturalmente em português, enquanto a nota preserva o valor mais literal.
- source_word: אֵלָיו
  choice: para junto de si
  rationale: A expressão é literalmente «para ele», mas refere-se ao próprio Davi e ao lugar sob seu domínio. «Para junto de si» conserva o sentido reflexivo sem confundi-lo com o destino geográfico explicitado a seguir.
- source_word: עִיר דָּוִיד
  choice: Cidade de Davi
  rationale: Forma consagrada e clara do nome do lugar em português.
- source_word: וַיַּטֵּהוּ
  choice: desviou-a
  rationale: O verbo נָטָה indica aqui que Davi fez a arca mudar da rota pretendida. «Desviou-a» é conciso, natural e mantém a ideia concreta de redirecionamento.
- source_word: בֵּית
  choice: casa
  rationale: Pode designar casa física ou família. Como a arca foi encaminhada a um local onde ficaria alojada, «casa» é a opção imediata, sem excluir por completo a ideia de unidade doméstica.
- source_word: עֹבֵד אֱדֹם
  choice: Obede-Edom
  rationale: Transliteração tradicional e amplamente reconhecível em português.
- source_word: הַגִּתִּי
  choice: o geteu
  rationale: Gentílico tradicional correspondente a Gate; reproduz diretamente a identificação presente no hebraico.
