  text: וַ/יֹּ֨אמֶר דָּוִ֜יד לְ/כֹ֣ל קְהַ֣ל יִשְׂרָאֵ֗ל אִם עֲלֵי/כֶ֨ם ט֜וֹב וּ/מִן יְהוָ֣ה אֱלֹהֵ֗י/נוּ נִפְרְצָה֙ נִשְׁלְחָ֞ה עַל אַחֵ֣י/נוּ הַ/נִּשְׁאָרִ֗ים בְּ/כֹל֙ אַרְצ֣וֹת יִשְׂרָאֵ֔ל וְ/עִמָּ/הֶ֛ם הַ/כֹּהֲנִ֥ים וְ/הַ/לְוִיִּ֖ם בְּ/עָרֵ֣י מִגְרְשֵׁי/הֶ֑ם וְ/יִקָּבְצ֖וּ אֵלֵֽי/נוּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/002.yaml
  text: And David said to all the assembly of Israel[a], “If it seems good to you, and if it is from Yahweh our God, let us send word to our brothers who remain in all the lands of Israel, and also to the priests and Levites with them in the cities of their pasturelands[d][c][b], that they may gather to us.”
translation:
  language: pt
  text: 'Davi disse a toda a assembleia de Israel: “Se vocês acharem bom, e se isso vier de Yahweh, nosso Deus, enviemos uma convocação por toda parte[a] aos nossos irmãos[b] que permanecem em todas as regiões[c] de Israel, bem como aos sacerdotes e levitas que estão com eles, em suas cidades, com as terras de pastagem[d], para que se reúnam conosco.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente algo como “irrompamos; enviemos”. A expressão provavelmente indica que a convocação deveria ser enviada de maneira ampla.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “irmãos” refere-se de modo representativo aos demais israelitas.
    reason: lexical_alternative
  - marker: c
    text: Ou “terras de Israel”; o hebraico emprega o plural.
    reason: lexical_alternative
  - marker: d
    text: Isto é, as áreas abertas ou pastagens pertencentes a essas cidades.
    reason: cultural_note
lexical_decisions:
- source_word: קְהַל
  choice: assembleia
  rationale: Designa o conjunto nacional reunido; “assembleia” é claro e evita conotações eclesiásticas posteriores.
- source_word: אִם עֲלֵיכֶם טוֹב
  choice: Se vocês acharem bom
  rationale: Expressa de modo natural a aprovação ou concordância solicitada ao povo, preservando a condição.
- source_word: וּמִן יְהוָה אֱלֹהֵינוּ
  choice: e se isso vier de Yahweh, nosso Deus
  rationale: Explicita o predicado implícito e mantém a coordenação entre a aprovação do povo e a sanção divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico.
- source_word: נִפְרְצָה נִשְׁלְחָה
  choice: enviemos mensageiros por toda parte
  rationale: A combinação incomum significa literalmente algo como “irrompamos; enviemos”; no contexto, comunica o envio amplo de uma convocação. A nota preserva a imagem e a ambiguidade lexical.
- source_word: עַל אַחֵינוּ
  choice: aos nossos irmãos
  rationale: Com o verbo “enviar”, a preposição indica os destinatários. “Irmãos” conserva a metáfora familiar representativa dos demais israelitas.
- source_word: הַנִּשְׁאָרִים
  choice: que permanecem
  rationale: Traduz o particípio sem introduzir a carga teológica que “remanescente” poderia sugerir.
- source_word: בְּכֹל אַרְצוֹת יִשְׂרָאֵל
  choice: em todas as regiões de Israel
  rationale: “Regiões” comunica naturalmente o plural hebraico e a dispersão territorial dentro de Israel.
- source_word: מִגְרְשֵׁיהֶם
  choice: terras de pastagem
  rationale: Refere-se às áreas abertas vinculadas às cidades levíticas, usadas especialmente para pastoreio.
- source_word: וְיִקָּבְצוּ אֵלֵינוּ
  choice: para que se reúnam conosco
  rationale: Expressa a finalidade da convocação em português natural; “conosco” comunica a reunião junto a Davi e à assembleia.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Sentido de הַנִּשְׁאָרִים
  choice: que permanecem
  alternative: o remanescente
  rationale: O contexto descreve israelitas espalhados pelo território, sem exigir que o particípio seja transformado no conceito teológico de “remanescente”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O discurso direto usa “vocês” para a assembleia nacional. A formulação mantém a consulta ao povo e a dependência da aprovação de Yahweh, sem resolver além do texto a relação entre ambas.
