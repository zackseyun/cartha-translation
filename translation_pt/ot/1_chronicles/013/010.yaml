source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/עֻזָּ֔א וַ/יַּכֵּ֕/הוּ עַ֛ל אֲשֶׁר שָׁלַ֥ח יָד֖/וֹ עַל הָ/אָר֑וֹן וַ/יָּ֥מָת שָׁ֖ם לִ/פְנֵ֥י אֱלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/010.yaml
  text: Then Yahweh’s anger burned against Uzza[a], and he struck him down because he had put out his hand to the ark; and he died there before God.
translation:
  language: pt
  text: Então a ira de Yahweh se acendeu contra Uzá, e ele o feriu porque estendeu a mão para a arca[a]; e Uzá morreu ali diante de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porque pôs a mão sobre a arca”.'
    reason: A expressão שָׁלַח יָדוֹ עַל pode descrever tanto o ato de estender a mão em direção à arca quanto o de pôr a mão sobre ela.
lexical_decisions:
- source_word: וַיִּחַר אַף יְהוָה
  choice: Então a ira de Yahweh se acendeu
  rationale: Preserva a força da expressão idiomática hebraica, literalmente associada à ira que arde, em português natural e solene.
- source_word: בְּעֻזָּא
  choice: contra Uzá
  rationale: A preposição marca Uzá como alvo da ira; “contra” é a formulação mais natural neste contexto.
- source_word: וַיַּכֵּהוּ
  choice: ele o feriu
  rationale: נכה denota golpear ou ferir. A morte é declarada na oração seguinte, por isso a tradução evita antecipá-la com “matou”.
- source_word: עַל אֲשֶׁר
  choice: porque
  rationale: Introduz de modo direto e natural a razão apresentada pelo texto para o juízo.
- source_word: שָׁלַח יָדוֹ עַל הָאָרוֹן
  choice: estendeu a mão para a arca
  rationale: Reproduz a ação física sem atribuir uma intenção não expressa. A preposição e a expressão admitem também a ideia de pôr a mão sobre ou na arca, registrada em nota.
- source_word: הָאָרוֹן
  choice: a arca
  rationale: O hebraico traz apenas “a arca”; o referente já está claro no contexto, sem necessidade de expansão.
- source_word: וַיָּמָת שָׁם
  choice: e Uzá morreu ali
  rationale: Traduz diretamente a sequência narrativa e mantém o advérbio שָׁם. A repetição do nome evita possível ambiguidade do pronome em português.
- source_word: לִפְנֵי אֱלֹהִים
  choice: diante de Deus
  rationale: Equivalente corrente e solene de לִפְנֵי, preservando a noção de estar perante Deus.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pactual e segue a orientação fornecida.
- issue: Variação entre יְהוָה e אֱלֹהִים no mesmo versículo
  choice: Manter “Yahweh” na primeira oração e “Deus” no final
  alternative: Harmonizar ambos como “Yahweh” ou substituir o segundo por um pronome
  rationale: A distinção lexical pertence ao texto hebraico e não deve ser eliminada por harmonização.
- issue: Causa declarada do juízo
  choice: 'Manter a relação causal explícita: “porque estendeu a mão para a arca”'
  alternative: Atenuar ou explicar a causa com base no contexto mais amplo
  rationale: עַל אֲשֶׁר apresenta a ação como razão do golpe; a tradução conserva essa tensão sem acrescentar uma explicação teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem narrativa e a solenidade do hebraico foram preservadas sem arcaísmos. O marcador da nota foi colocado junto à expressão a que ela se refere.
