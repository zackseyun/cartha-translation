  text: וַ/יֵּשֶׁב֩ אֲר֨וֹן הָ/אֱלֹהִ֜ים עִם בֵּ֨ית עֹבֵ֥ד אֱדֹ֛ם בְּ/בֵית֖/וֹ שְׁלֹשָׁ֣ה חֳדָשִׁ֑ים וַ/יְבָ֧רֶךְ יְהוָ֛ה אֶת בֵּ֥ית עֹבֵֽד אֱדֹ֖ם וְ/אֶת כָּל אֲשֶׁר לֽ/וֹ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/014.yaml
  text: And the ark of God remained with the household of Obed-edom[a], in his house, for three months. And Yahweh blessed the household of Obed-edom and all that belonged to him.
translation:
  language: pt
  text: A arca de Deus permaneceu com a casa de Obede-Edom[a], em sua casa, durante três meses. E Yahweh abençoou a casa de Obede-Edom e tudo o que lhe pertencia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “família de Obede-Edom”, nas duas ocorrências; o termo hebraico בֵּית pode designar tanto uma casa física quanto uma unidade doméstica ou família.
    reason: alternativa lexical
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: permaneceu
  rationale: O verbo יָשַׁב pode significar sentar-se, habitar ou permanecer. Neste contexto, “permaneceu” expressa naturalmente a estadia temporária da arca.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: a arca de Deus
  rationale: Reproduz a expressão hebraica exata, sem acrescentar “da aliança”, ausente neste versículo.
- source_word: עִם בֵּית עֹבֵד אֱדֹם
  choice: com a família de Obede-Edom
  rationale: בֵּית pode designar tanto uma casa física quanto uma família. Aqui, “família” diferencia esta expressão da localização concreta indicada logo depois por “na casa dele”.
- source_word: בְּבֵיתוֹ
  choice: na casa dele
  rationale: A expressão indica o lugar físico onde a arca permaneceu; a formulação também deixa claro que a casa era de Obede-Edom.
- source_word: שְׁלֹשָׁה חֳדָשִׁים
  choice: durante três meses
  rationale: Formulação portuguesa natural para indicar a duração da permanência.
- source_word: וַיְבָרֶךְ יְהוָה
  choice: E Yahweh abençoou
  rationale: Mantém a sequência narrativa e apresenta Yahweh como sujeito explícito da bênção.
- source_word: אֶת בֵּית עֹבֵד אֱדֹם
  choice: a família de Obede-Edom
  rationale: Neste contexto de bênção, בֵּית provavelmente abrange as pessoas da casa, embora o sentido físico “casa” continue lexicalmente possível.
- source_word: וְאֶת כָּל אֲשֶׁר לוֹ
  choice: e tudo o que lhe pertencia
  rationale: Preserva o alcance amplo da expressão hebraica, que pode incluir bens e tudo o que estava sob sua esfera doméstica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome divino em vez de substituí-lo por um título.
- issue: Alcance da bênção sobre בֵּית עֹבֵד אֱדֹם
  choice: a família de Obede-Edom
  alternative: a casa de Obede-Edom
  rationale: “Família” comunica o provável sentido coletivo da bênção, enquanto a nota conserva a ambiguidade lexical entre família e casa física.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A repetição de “família de Obede-Edom” acompanha a estrutura hebraica, e a nota preserva a ambiguidade de בֵּית.
