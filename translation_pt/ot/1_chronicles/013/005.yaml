  text: וַ/יַּקְהֵ֤ל דָּוִיד֙ אֶת כָּל יִשְׂרָאֵ֔ל מִן שִׁיח֥וֹר מִצְרַ֖יִם וְ/עַד לְב֣וֹא חֲמָ֑ת לְ/הָבִיא֙ אֶת אֲר֣וֹן הָ/אֱלֹהִ֔ים מִ/קִּרְיַ֖ת יְעָרִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/005.yaml
  text: So David assembled all Israel[a], from the Shihor of Egypt to Lebo-hamath[b], to bring the ark of God from Kiriath-jearim.
translation:
  language: pt
  text: Assim, Davi reuniu todo o Israel, desde o Sior do Egito[a] até Lebo-Hamate[b], para trazer a arca de Deus de Quiriate-Jearim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sior do Egito” é uma designação da fronteira sul; alguns a entendem como “o ribeiro do Egito”.
    reason: cultural_note
  - marker: b
    text: Ou, mais literalmente, “até a entrada de Hamate”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: reuniu
  rationale: O hifil de קהל indica fazer com que um grupo se reúna; “reuniu” é natural em português e adequado a uma convocação nacional.
- source_word: כָּל יִשְׂרָאֵל
  choice: todo o Israel
  rationale: Mantém a expressão coletiva nacional do hebraico, que pode representar o conjunto da nação sem exigir que cada indivíduo estivesse presente.
- source_word: מִן שִׁיחוֹר מִצְרַיִם
  choice: desde o Sior do Egito
  rationale: Preserva Sior como nome geográfico e evita identificar no texto principal, de modo prematuro, qual curso de água está em vista.
- source_word: וְעַד לְבוֹא חֲמָת
  choice: até Lebo-Hamate
  rationale: Trata a expressão como designação geográfica reconhecida, preservando também em nota a leitura mais literal.
- source_word: לְהָבִיא
  choice: para trazer
  rationale: Expressa com clareza a finalidade indicada pelo infinitivo hebraico.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: a arca de Deus
  rationale: Tradução direta e corrente da construção hebraica, sem expansão interpretativa.
- source_word: מִקִּרְיַת יְעָרִים
  choice: de Quiriate-Jearim
  rationale: Emprega uma transliteração portuguesa reconhecível do topônimo hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem final “de Quiriate-Jearim a arca de Deus” evita sugerir que Davi levaria a arca para Quiriate-Jearim e preserva com naturalidade a origem indicada pelo hebraico.
