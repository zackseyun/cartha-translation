  text: כִּ֗י כַּֽ/אֲשֶׁ֤ר שְׁתִיתֶם֙ עַל הַ֣ר קָדְשִׁ֔/י יִשְׁתּ֥וּ כָֽל הַ/גּוֹיִ֖ם תָּמִ֑יד וְ/שָׁת֣וּ וְ/לָע֔וּ וְ/הָי֖וּ כְּ/ל֥וֹא הָיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/016.yaml
  text: For just as you drank on my holy mountain[a], all the nations will drink continually; they will drink and swallow[b], and they will be as though they had never been.
translation:
  language: pt
  text: Pois assim como vocês beberam no meu santo monte, todas as nações beberão sem cessar[a]; beberão e engolirão[b], e serão como se nunca tivessem existido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A imagem de beber provavelmente representa experimentar o juízo divino, metáfora comum nos profetas.
    reason: cross_reference
  - marker: b
    text: 'Ou: “beberão até o fim”. O verbo hebraico pode enfatizar engolir ou consumir completamente; outras interpretações contextuais incluem cambalear ou ficar desnorteado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento do juízo anunciado anteriormente, com fluidez natural em português.
- source_word: כַּאֲשֶׁר
  choice: assim como
  rationale: Explicita a comparação entre o que os destinatários fizeram no monte santo e o que todas as nações experimentarão.
- source_word: שְׁתִיתֶם
  choice: vocês beberam
  rationale: Representa o perfeito qal na segunda pessoa do plural em linguagem moderna e clara, preservando a referência direta aos destinatários.
- source_word: עַל הַר קָדְשִׁי
  choice: no meu santo monte
  rationale: Mantém a imagem concreta e a referência a Sião/Jerusalém, com formulação idiomática em português.
- source_word: יִשְׁתּוּ
  choice: beberão
  rationale: O imperfeito, neste contexto profético, anuncia a consequência futura para as nações.
- source_word: כָל הַגּוֹיִם
  choice: todas as nações
  rationale: Traduz גּוֹיִם em seu sentido amplo, sem introduzir a distinção posterior sugerida por 'gentios'.
- source_word: תָּמִיד
  choice: sem cessar
  rationale: Comunica a continuidade insistente da ação de modo natural e forte em português.
- source_word: וְשָׁתוּ
  choice: beberão
  rationale: Preserva a repetição retórica do verbo hebraico em vez de condensá-la.
- source_word: וְלָעוּ
  choice: engolirão
  rationale: Mantém o provável sentido lexical de engolir ou consumir completamente, sem acrescentar um objeto ausente no hebraico; a ambiguidade é registrada em nota.
- source_word: וְהָיוּ כְּלֹא הָיוּ
  choice: serão como se nunca tivessem existido
  rationale: Expressa de forma idiomática a comparação hebraica e sua forte ideia de desaparecimento, sem transformá-la numa declaração direta que elimine o 'como se'.
theological_decisions:
- issue: Natureza da imagem de beber
  choice: Manter no texto a linguagem concreta de beber, permitindo que ela comunique metaforicamente a experiência do juízo divino.
  alternative: Explicitar no texto que as nações beberão o cálice da ira divina.
  rationale: O contexto de juízo e o uso profético mais amplo sustentam a metáfora, mas o hebraico deste versículo não menciona expressamente nem 'cálice' nem 'ira'; a nota esclarece a provável imagem sem sobrecarregar o texto.
- issue: Referente da segunda pessoa do plural
  choice: Preservar a interpelação direta por meio de 'vocês', entendendo-a contextualmente como dirigida a Edom.
  alternative: Substituir o pronome por 'Edom' ou entender a interpelação como dirigida coletivamente às nações ou a Judá.
  rationale: O contexto circundante dirige a acusação a Edom, mas inserir o nome no versículo eliminaria a forma pronominal do original e tornaria explícito o que permanece contextual.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Emprega 'vocês' para representar claramente a segunda pessoa do plural sem recorrer ao hoje pouco usual 'vós'. A repetição de 'beberão' e a comparação final foram preservadas para conservar a força retórica e a tensão do hebraico.
