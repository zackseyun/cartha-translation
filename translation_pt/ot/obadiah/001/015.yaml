  text: כִּֽי קָר֥וֹב יוֹם יְהוָ֖ה עַל כָּל הַ/גּוֹיִ֑ם כַּ/אֲשֶׁ֤ר עָשִׂ֨יתָ֙ יֵעָ֣שֶׂה לָּ֔/ךְ גְּמֻלְ/ךָ֖ יָשׁ֥וּב בְּ/רֹאשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/015.yaml
  text: For the day of Yahweh is near upon all the nations[a]. As you have done, it will be done to you[b]; your recompense will return on your own head.
translation:
  language: pt
  text: 'Pois o dia de Yahweh está próximo: ele virá sobre todas as nações[a]. Assim como você fez, será feito a você; sua retribuição[b] voltará sobre sua própria cabeça.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contra todas as nações”. A preposição hebraica pode indicar que o juízo é dirigido contra as nações.
    reason: lexical_alternative
  - marker: b
    text: “Retribuição” refere-se aqui ao que volta para alguém em resposta aos seus atos; também pode ser traduzido por “pagamento” ou “tratamento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou explicação da advertência anterior e mantém de modo natural a força causal do hebraico.
- source_word: קָרוֹב
  choice: está próximo
  rationale: Expressa a iminência indicada pelo adjetivo predicativo em linguagem portuguesa clara e corrente.
- source_word: יוֹם יְהוָה
  choice: o dia de Yahweh
  rationale: Preserva a expressão profética reconhecível e translitera o nome divino pessoal יהוה, em vez de substituí-lo por um título.
- source_word: עַל כָּל הַגּוֹיִם
  choice: sobre todas as nações
  rationale: Mantém a amplitude semântica de עַל, indicando que o dia alcança as nações, sem explicitar no texto principal apenas a leitura hostil de 'contra'.
- source_word: כַּאֲשֶׁר עָשִׂיתָ
  choice: Assim como você fez
  rationale: Conserva a fórmula comparativa que introduz a correspondência entre a conduta de Edom e o juízo que receberá.
- source_word: יֵעָשֶׂה לָּךְ
  choice: será feito a você
  rationale: Reproduz o sentido passivo do nifal e espelha deliberadamente o verbo da oração anterior.
- source_word: גְּמֻלְךָ
  choice: a sua retribuição
  rationale: Comunica a resposta recebida em consequência dos próprios atos, com a nuance moral e judicial apropriada ao contexto.
- source_word: יָשׁוּב
  choice: voltará
  rationale: Traduz diretamente o verbo de retorno e retrata as consequências dos atos de Edom recaindo sobre ele.
- source_word: בְּרֹאשֶׁךָ
  choice: sobre a sua própria cabeça
  rationale: Preserva a imagem hebraica das consequências recaindo sobre o responsável e torna clara, com 'própria', sua força reflexiva.
theological_decisions:
- issue: Alcance e força do “dia de Yahweh”
  choice: Anúncio profético de juízo divino iminente que abrange todas as nações, embora a segunda pessoa continue dirigindo-se diretamente a Edom.
  alternative: Juízo limitado somente a Edom no contexto imediato.
  rationale: A expressão 'sobre todas as nações' amplia o horizonte, enquanto os sufixos de segunda pessoa mantêm Edom como destinatário direto. A tradução conserva ambos os aspectos.
- issue: Fórmula de justiça retributiva
  choice: O que Edom fez será feito a ele, e sua retribuição recairá sobre sua própria cabeça.
  alternative: Uma lei impessoal de causa e efeito, sem ação judicial divina.
  rationale: O contexto do 'dia de Yahweh' situa a correspondência dentro do juízo divino. A tradução mantém essa força judicial sem inserir uma explicação doutrinária no versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção 'está próximo sobre' conserva o tom profético e a ambiguidade da preposição hebraica; a nota registra a leitura alternativa 'contra'. O paralelismo verbal foi mantido em 'fez / será feito', e a imagem idiomática 'sobre a sua própria cabeça' foi preservada.
