review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente o contraste com o juízo precedente, a promessa de livramento em Sião, a santidade do monte e a retomada das possessões pela casa de Jacó. Contudo, “daquilo que lhe pertence” explicita e suaviza a repetição possessiva do hebraico, além de tornar o referente singular; uma formulação mais próxima preserva melhor a construção enfática sem impor a leitura de recuperação.
  naturalness: 'O registro é moderno e claro. “Tomará posse de suas posses” mantém a ênfase do original e é compreensível em registro profético. A nota a requer pequeno ajuste sintático: “tanto... quanto...” não deve coordenar três alternativas com “ou” após “tanto”.'
  terminology: “Monte Sião”, “santo” e “casa de Jacó” são escolhas adequadas e consistentes com o registro bíblico. “Livramento” preserva legitimamente a amplitude de פְלֵיטָה. A alternativa agentiva deve permanecer em nota, pois é interpretativamente relevante.
  issues:
  - severity: low
    issue: A expressão “daquilo que lhe pertence” substitui a formulação possessiva enfática do hebraico por uma paráfrase.
    rationale: מוֹרָשֵׁיהֶם significa mais diretamente “suas possessões/heranças”. A paráfrase é possível, mas reduz a correspondência lexical e torna o pronome singular em referência a “a casa”, enquanto o hebraico emprega sufixo plural.
  - severity: low
    issue: A nota a contém coordenação sintática imprecisa.
    rationale: “Pode indicar tanto livramento ou escape quanto aqueles que escapam” deve ser reformulado para listar as alternativas sem conflito entre “tanto... quanto” e “ou”.
  revised_text: Mas, no monte Sião, haverá livramento[a], e o monte será santo; a casa de Jacó tomará posse de suas posses[b][c].
  revised_footnotes:
  - marker: a
    text: Ou “haverá sobreviventes”; o substantivo hebraico pode indicar livramento, escape ou aqueles que escapam.
    reason: lexical_alternative
  - marker: b
    text: Ou “herdará a sua herança”.
    reason: lexical_alternative
  - marker: c
    text: Possivelmente, “a casa de Jacó desapossará aqueles que a desapossaram”, caso o termo final seja entendido em sentido agentivo.
    reason: alternative_reading
  revision_rationale: A revisão restaura uma expressão portuguesa que corresponde mais diretamente à ênfase possessiva de “suas possessões”, sem decidir pela alternativa agentiva nem introduzir a ideia explícita de recuperação. Também corrige a sintaxe da nota lexical, mantendo todas as alternativas relevantes.
