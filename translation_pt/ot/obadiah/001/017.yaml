language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/בְ/הַ֥ר צִיּ֛וֹן תִּהְיֶ֥ה פְלֵיטָ֖ה וְ/הָ֣יָה קֹ֑דֶשׁ וְ/יָֽרְשׁוּ֙ בֵּ֣ית יַֽעֲקֹ֔ב אֵ֖ת מוֹרָֽשֵׁי/הֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/017.yaml
  text: But on Mount Zion there will be deliverance[a], and it will be holy[c][b], and the house of Jacob will possess their possessions.
translation:
  language: pt
  text: Mas, no monte Sião, haverá livramento[a], e o monte será santo; a casa de Jacó tomará posse daquilo que lhe pertence[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “haverá sobreviventes”; o substantivo hebraico pode indicar tanto livramento ou escape quanto aqueles que escapam.
    reason: lexical_alternative
  - marker: b
    text: Ou “herdará a sua herança”.
    reason: lexical_alternative
  - marker: c
    text: Possivelmente, “a casa de Jacó desapossará aqueles que a desapossaram”, caso o termo final seja entendido em sentido agentivo.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְהַר צִיּוֹן
  choice: Mas, no monte Sião
  rationale: A conjunção pode significar simplesmente “e”, mas aqui introduz um contraste forte com o juízo de Edom no versículo anterior. “Mas” comunica esse movimento discursivo com naturalidade.
- source_word: תִּהְיֶה פְלֵיטָה
  choice: haverá livramento
  rationale: פְלֵיטָה pode designar livramento, escape ou os sobreviventes. “Livramento” preserva a amplitude do substantivo sem restringi-lo apenas ao ato de escapar ou às pessoas que escapam.
- source_word: וְהָיָה קֹדֶשׁ
  choice: e o monte será santo
  rationale: O verbo masculino singular aponta naturalmente para o monte Sião como sujeito implícito. A repetição de “o monte” elimina uma ambiguidade pronominal artificial em português, sem acrescentar conteúdo.
- source_word: וְיָרְשׁוּ
  choice: tomará posse
  rationale: ירשׁ pode significar possuir, herdar ou desapossar. “Tomará posse” expressa aqui a recuperação efetiva do que pertence à casa de Jacó, sem impor exclusivamente o sentido jurídico de herança.
- source_word: בֵּית יַעֲקֹב
  choice: a casa de Jacó
  rationale: Mantém a expressão profética e pactual tradicional que designa os descendentes de Jacó, isto é, Israel.
- source_word: אֵת מוֹרָשֵׁיהֶם
  choice: daquilo que lhe pertence
  rationale: A expressão comunica em português natural a ideia nominal de possessão ou herança e representa o sufixo pronominal. A leitura agentiva alternativa permanece registrada em nota.
theological_decisions:
- issue: Natureza da restauração prometida em Sião
  choice: O versículo anuncia livramento e restauração reais, centrados no monte Sião, sem definir se פְלֵיטָה enfatiza principalmente o resgate ou as pessoas que escapam.
  alternative: Entender a promessa sobretudo como a presença de sobreviventes em Sião, ou sobretudo como a restauração de Sião como lugar santo.
  rationale: O hebraico permite a sobreposição das ideias de escape, sobrevivência e santidade. A tradução mantém essa tensão profética e registra a principal alternativa lexical.
- issue: Sentido da retomada pela casa de Jacó
  choice: A casa de Jacó retoma aquilo que lhe pertence.
  alternative: A casa de Jacó desapossa aqueles que a desapossaram.
  rationale: O sentido nominal de מוֹרָשֵׁיהֶם como “suas possessões” se ajusta bem à morfologia e ao contexto de restauração, mas a possível leitura agentiva afeta a interpretação e por isso é preservada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Monte Sião” e “casa de Jacó” preservam o registro profético tradicional; “tomará posse daquilo que lhe pertence” evita uma repetição pouco natural em português sem apagar o sentido possessivo do hebraico.
