  text: וְ/גָלֻ֣ת הַֽ/חֵל הַ֠/זֶּה לִ/בְנֵ֨י יִשְׂרָאֵ֤ל אֲשֶֽׁר כְּנַעֲנִים֙ עַד צָ֣רְפַ֔ת וְ/גָלֻ֥ת יְרוּשָׁלִַ֖ם אֲשֶׁ֣ר בִּ/סְפָרַ֑ד יִֽרְשׁ֕וּ אֵ֖ת עָרֵ֥י הַ/נֶּֽגֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/020.yaml
  text: And the exiles of this host of the sons of Israel, who are among the Canaanites as far as Zarephath, and the exiles of Jerusalem who are in Sepharad, will possess the cities of the Negev.
translation:
  language: pt
  text: Os exilados deste contingente dos filhos de Israel, que estão entre os cananeus até Sarepta[a], e os exilados de Jerusalém que estão em Sefarade possuirão as cidades do Neguebe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conforme outra análise da construção hebraica difícil: «os que estão em Canaã até Sarepta». O hebraico é elíptico neste ponto.'
    reason: Assinala a dificuldade de אֲשֶׁר כְּנַעֲנִים e identifica a formulação principal como uma interpretação contextual, sem escolher uma reconstrução textual ou localização moderna.
lexical_decisions:
- source_word: גָלֻת
  choice: os exilados
  rationale: O substantivo coletivo pode designar o grupo levado ao exílio; em português, o plural pessoal expressa isso com clareza e concorda naturalmente com o verbo plural יִרְשׁוּ.
- source_word: הַחֵל הַזֶּה
  choice: deste contingente
  rationale: חֵל admite sentidos como força, tropa ou hoste. “Contingente” preserva a ideia de um corpo organizado de pessoas sem sugerir necessariamente um exército em combate.
- source_word: אֲשֶׁר כְּנַעֲנִים
  choice: que estão entre os cananeus
  rationale: A construção é textualmente difícil e elíptica. Esta tradução segue a leitura contextual tradicional, entendendo כְּנַעֲנִים como referência aos cananeus e suprindo apenas o verbo exigido pelo português.
- source_word: צָרְפַת
  choice: Sarepta
  rationale: Forma portuguesa consagrada do topônimo bíblico Zarephath.
- source_word: סְפָרַד
  choice: Sefarade
  rationale: Transliteração portuguesa do topônimo hebraico, cuja localização histórica exata permanece incerta.
- source_word: יִרְשׁוּ
  choice: possuirão
  rationale: O verbo ירשׁ pode significar tomar posse, herdar ou despossuir. “Possuirão” corresponde diretamente ao resultado anunciado sem explicitar além do texto o modo da aquisição.
- source_word: עָרֵי הַנֶּגֶב
  choice: as cidades do Neguebe
  rationale: Neguebe é aqui o nome regional do sul de Judá, por isso é preservado como topônimo.
theological_decisions:
- issue: Identidade e localização dos grupos exilados
  choice: Manter separados os exilados de Israel e os de Jerusalém, conforme a sintaxe do verso.
  alternative: Fundir todos os exilados em um único grupo ou identificar suas localizações com territórios modernos específicos.
  rationale: O hebraico coordena dois grupos e não fornece base segura para identificações geográficas modernas, especialmente no caso de Sefarade.
- issue: Natureza da posse prometida
  choice: Traduzir simplesmente “possuirão”, sem definir o mecanismo como conquista militar, herança jurídica ou restauração escatológica.
  alternative: Explicitar “conquistarão”, “herdarão” ou uma interpretação profética específica.
  rationale: O campo semântico de ירשׁ e o contexto permitem mais de uma nuance; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com formas toponímicas bíblicas familiares ao leitor brasileiro. A ordem mantém os dois grupos coordenados do hebraico. Não foram inseridas notas porque nenhuma foi necessária para a leitura básica; a dificuldade textual de אֲשֶׁר כְּנַעֲנִים foi tratada de modo conservador na tradução e registrada nas decisões lexicais.
