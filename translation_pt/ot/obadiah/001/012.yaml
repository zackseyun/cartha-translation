source:
  edition: WLC
  text: וְ/אַל תֵּ֤רֶא בְ/יוֹם אָחִ֨י/ךָ֙ בְּ/י֣וֹם נָכְר֔/וֹ וְ/אַל תִּשְׂמַ֥ח לִ/בְנֵֽי יְהוּדָ֖ה בְּ/י֣וֹם אָבְדָ֑/ם וְ/אַל תַּגְדֵּ֥ל פִּ֖י/ךָ בְּ/י֥וֹם צָרָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/012.yaml
  text: Do not look on your brother in the day of his misfortune[a], and do not rejoice over the sons of Judah in the day of their destruction[c][b]; and do not make your mouth great in the day of distress.
translation:
  language: pt
  text: Não olhe com satisfação para o seu irmão no dia da desgraça dele[a]; não se alegre por causa dos filhos de Judá no dia da ruína deles; nem fale com arrogância[b] no dia da aflição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no dia em que ele se tornou estrangeiro” ou “no dia do seu infortúnio”. O termo hebraico pode indicar calamidade, alienação ou a condição de estrangeiro.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “nem engrandeça a sua boca”, expressão que significa falar de modo arrogante ou jactancioso.'
    reason: idiom_explanation
lexical_decisions:
- source_word: תֵּרֶא
  choice: olhe com satisfação
  rationale: O verbo significa literalmente “ver/olhar”, mas, em paralelo com alegrar-se e falar com arrogância, descreve aqui um olhar de satisfação maliciosa. A formulação mantém a imagem visual sem reduzir o sentido à mera observação.
- source_word: אָחִיךָ
  choice: seu irmão
  rationale: Preserva a linguagem familiar do hebraico e a força moral da denúncia contra Edom por agir assim para com Judá, povo irmão.
- source_word: נָכְרוֹ
  choice: desgraça dele
  rationale: נָכְרוֹ é difícil e pode apontar para calamidade, alienação ou para o momento em que alguém se torna estrangeiro. “Desgraça” se ajusta ao paralelismo com ruína e aflição, enquanto a ambiguidade é registrada em nota.
- source_word: תִּשְׂמַח
  choice: se alegre
  rationale: Equivalente corrente de שמח, apropriado ao tom profético e ao paralelismo da passagem.
- source_word: לִבְנֵי יְהוּדָה
  choice: por causa dos filhos de Judá
  rationale: Mantém a expressão familiar e nacional explícita “filhos de Judá”. A preposição ל pode introduzir a pessoa a respeito de quem ocorre a alegria hostil; “por causa de” expressa isso naturalmente em português.
- source_word: אָבְדָם
  choice: ruína deles
  rationale: O infinitivo de אבד indica o perecimento ou colapso do povo. “Ruína” comunica com naturalidade a catástrofe nacional sem exigir aniquilação absoluta.
- source_word: תַּגְדֵּל פִּיךָ
  choice: fale com arrogância
  rationale: A expressão literal “engrandecer a boca” é um idiomatismo para falar de maneira arrogante ou jactanciosa. A tradução comunica seu sentido em português atual, e a imagem hebraica é preservada em nota.
- source_word: צָרָה
  choice: aflição
  rationale: צָרָה denota angústia, aperto ou adversidade. “Aflição” preserva o registro solene e distingue este termo dos demais vocábulos de desastre no versículo.
theological_decisions:
- issue: Linguagem de parentesco entre Edom e Judá
  choice: seu irmão
  alternative: seu parente
  rationale: “Irmão” preserva a metáfora histórica de parentesco entre Edom e Judá e intensifica a censura da traição, sem acrescentar uma interpretação denominacional.
- issue: Natureza da conduta proibida no primeiro membro
  choice: olhe com satisfação
  alternative: olhe / exulte sobre
  rationale: O hebraico usa o verbo comum “ver”, mas o paralelismo indica observação maliciosamente satisfeita. A tradução explicita essa força pragmática sem transformar o verbo simplesmente em “exultar”, que já se aproxima demais do membro seguinte.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. As três proibições paralelas foram mantidas. A pontuação com ponto e vírgula destaca sua progressão, e as notas preservam tanto a dificuldade lexical de נָכְרוֹ quanto a imagem concreta do idioma hebraico.
