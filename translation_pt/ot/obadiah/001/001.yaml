id: OBA.1.1
reference: Obadiah 1:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: חֲז֖וֹן עֹֽבַדְיָ֑ה כֹּֽה אָמַר֩ אֲדֹנָ֨/י יְהוִ֜ה לֶ/אֱד֗וֹם שְׁמוּעָ֨ה שָׁמַ֜עְנוּ מֵ/אֵ֤ת יְהוָה֙ וְ/צִיר֙ בַּ/גּוֹיִ֣ם שֻׁלָּ֔ח ק֛וּמוּ וְ/נָק֥וּמָה עָלֶי/הָ לַ/מִּלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/001.yaml
  text: 'The vision of Obadiah[a]. Thus says the Lord GOD concerning Edom: We have heard a report from Yahweh, and a messenger has been sent among the nations: “Rise up[c][b], and let us rise against her for battle.”'
translation:
  language: pt
  text: 'Visão de Obadias. Assim diz o Senhor Yahweh a respeito de Edom:


    “Ouvimos uma notícia da parte de Yahweh,

    e um mensageiro[a] foi enviado entre as nações:

    ‘Levantem-se, e levantemo-nos contra ela[b] para a batalha’”.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um emissário” ou “um enviado”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, contra Edom, apresentada aqui como uma nação; também se poderia traduzir “contra Edom”.
    reason: lexical_alternative
  - marker: c
    text: O hebraico não especifica quem está incluído em “ouvimos” e “levantemo-nos”; os dois plurais podem ser entendidos de mais de uma maneira.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲזוֹן
  choice: visão
  rationale: É o sentido direto e convencional do substantivo em uma introdução profética, sem definir além do texto o modo da revelação.
- source_word: עֹבַדְיָה
  choice: Obadias
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: כֹּה אָמַר
  choice: assim diz
  rationale: Preserva a fórmula profética no presente e mantém um registro digno e natural.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Representa tanto o título אֲדֹנָי quanto o nome divino יהוה, sem reduzir os dois elementos a um só.
- source_word: לֶאֱדוֹם
  choice: a respeito de Edom
  rationale: Neste contexto, a preposição introduz o tema ou destinatário do pronunciamento; esta formulação evita transformar a frase em discurso direto a Edom.
- source_word: שְׁמוּעָה
  choice: notícia
  rationale: Expressa algo ouvido ou comunicado. É clara no contexto e não sugere a incerteza que “rumor” poderia transmitir.
- source_word: שָׁמַעְנוּ
  choice: ouvimos
  rationale: O perfeito hebraico indica a recepção já ocorrida da notícia; o pretérito perfeito é idiomático e mantém a força imediata no português.
- source_word: מֵאֵת יְהוָה
  choice: da parte de Yahweh
  rationale: Indica explicitamente Yahweh como a fonte da notícia.
- source_word: וְצִיר
  choice: e um mensageiro
  rationale: É uma tradução abrangente e natural; a nota preserva os sentidos diplomáticos mais específicos de emissário ou enviado.
- source_word: בַּגּוֹיִם
  choice: entre as nações
  rationale: Adequa-se ao cenário internacional e evita o sentido religioso potencialmente inadequado de “gentios”.
- source_word: שֻׁלָּח
  choice: foi enviado
  rationale: Reproduz de modo natural o perfeito passivo, sem acrescentar a identidade de quem enviou o mensageiro.
- source_word: קוּמוּ
  choice: levantem-se
  rationale: Mantém o imperativo plural e sua força como convocação para a guerra.
- source_word: עָלֶיהָ
  choice: contra ela
  rationale: Conserva o pronome feminino hebraico, cujo referente é Edom entendida como nação.
- source_word: לַמִּלְחָמָה
  choice: para a batalha
  rationale: Preserva a finalidade militar explícita e o tom profético conciso.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto emprega o nome divino diretamente. “Yahweh” distingue o nome do título אֲדֹנָי e permite traduzir a expressão composta como “Senhor Yahweh”.
- issue: Identidade dos sujeitos plurais em “ouvimos” e “levantemo-nos”
  choice: manter os plurais sem identificar os falantes
  alternative: explicitar profeta e aliados, conselho celestial ou nações convocadas
  rationale: O hebraico não identifica de forma inequívoca quem está incluído em cada primeira pessoa do plural. A tradução e a nota preservam essa ambiguidade literária e teológica.
- issue: Gênero do referente em “contra ela”
  choice: preservar o feminino
  alternative: traduzir “contra Edom” ou “contra esse povo”
  rationale: O sufixo hebraico é feminino e retoma Edom como entidade nacional; mantê-lo conserva a forma do texto sem obscurecer o referente, esclarecido em nota.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. A disposição em linhas realça a estrutura do pronunciamento sem introduzir divisões ausentes do conteúdo. As aspas distinguem a declaração profética da convocação transmitida.
