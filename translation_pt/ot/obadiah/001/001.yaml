  source_fidelity: 'A tradução reproduz com precisão a estrutura e o sentido do hebraico: o título profético, a fórmula de fala divina, o assunto do oráculo, a notícia recebida de Yahweh, o envio do mensageiro entre as nações e a convocação plural para a guerra. Os plurais indeterminados são preservados, e o feminino de “contra ela” corresponde ao sufixo hebraico que retoma Edom.'
