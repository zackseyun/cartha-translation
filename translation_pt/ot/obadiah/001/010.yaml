  text: מֵ/חֲמַ֛ס אָחִ֥י/ךָ יַעֲקֹ֖ב תְּכַסְּ/ךָ֣ בוּשָׁ֑ה וְ/נִכְרַ֖תָּ לְ/עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/010.yaml
  text: Because of the violence done to your brother Jacob[a], shame will cover you, and you will be cut off forever.
translation:
  language: pt
  text: Por causa da violência contra seu irmão Jacó, a vergonha cobrirá você, e você será eliminado para sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵחֲמַס
  choice: Por causa da violência contra
  rationale: חָמָס denota violência, injustiça ou dano violento; o prefixo מִן tem aqui valor causal. A formulação preserva essa relação sem explicitar além do hebraico.
- source_word: אָחִיךָ
  choice: seu irmão
  rationale: Mantém a linguagem familiar direta e sua força moral no vínculo entre Edom e Jacó/Israel.
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: Conserva o nome presente no hebraico e a representação do povo por seu ancestral, sem substituí-lo interpretativamente por “Israel”.
- source_word: תְּכַסְּךָ
  choice: cobrirá você
  rationale: Traduz diretamente a imagem de כסה, na qual a vergonha envolve ou cobre o destinatário.
- source_word: בּוּשָׁה
  choice: a vergonha
  rationale: Preserva tanto a dimensão moral quanto a desonra pública do termo.
- source_word: וְנִכְרַתָּ
  choice: e você será eliminado
  rationale: O nifal de כרת significa ser cortado, excluído ou destruído. “Será eliminado” comunica em português natural a retirada destrutiva implicada no contexto.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Expressa a duração permanente do juízo em português corrente.
theological_decisions:
- issue: Referente de “Jacó” e força da linguagem de parentesco
  choice: Manter “seu irmão Jacó”, entendendo Jacó como o ancestral que representa Israel.
  alternative: Substituir “Jacó” por “Israel” para tornar explícito o referente nacional.
  rationale: O hebraico nomeia Jacó e enfatiza a culpa de Edom como violência contra um povo irmão. Preservar o nome evita transformar a interpretação contextual em texto principal.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. A ordem foi ajustada apenas conforme a sintaxe portuguesa; a causalidade, a imagem da vergonha que cobre e o caráter definitivo do juízo foram preservados.
