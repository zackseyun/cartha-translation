id: OBA.1.21
reference: Obadiah 1:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עָל֤וּ מֽוֹשִׁעִים֙ בְּ/הַ֣ר צִיּ֔וֹן לִ/שְׁפֹּ֖ט אֶת הַ֣ר עֵשָׂ֑ו וְ/הָיְתָ֥ה לַֽ/יהוָ֖ה הַ/מְּלוּכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/021.yaml
  text: Deliverers will go up on Mount Zion to judge the hill country of Esau[c][b][a], and the kingdom will belong to Yahweh.
translation:
  language: pt
  text: Libertadores subirão ao monte Sião para julgar a região montanhosa de Esaú[a][b]; e o reino pertencerá a Yahweh.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Salvadores”. O termo hebraico refere-se aqui a agentes que trazem livramento; isso não nega que a salvação última pertence a Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Ou “o monte de Esaú”. A expressão provavelmente se refere ao território montanhoso de Edom.
    reason: lexical_alternative
  - marker: c
    text: Ou “a realeza será de Yahweh” ou “o domínio pertencerá a Yahweh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלוּ
  choice: subirão
  rationale: O perfeito qal com waw, na sequência profética, expressa naturalmente uma ação futura. “Subirão” preserva a ideia concreta de ascensão até Sião.
- source_word: מוֹשִׁעִים
  choice: Libertadores
  rationale: O particípio substantivado plural designa agentes que trazem livramento. “Libertadores” mantém o plural humano e evita transformar o termo em um título divino exclusivo.
- source_word: בְּהַר צִיּוֹן
  choice: ao monte Sião
  rationale: Com o verbo de subida, a preposição pode marcar o destino alcançado. “Ao monte Sião” é natural em português e preserva a referência topográfica.
- source_word: לִשְׁפֹּט
  choice: para julgar
  rationale: Preserva o sentido lexical central de שפט, embora o ato de julgar aqui também possa envolver governar ou exercer autoridade.
- source_word: אֶת הַר עֵשָׂו
  choice: a região montanhosa de Esaú
  rationale: הַר pode designar não só um monte isolado, mas uma área montanhosa. Aqui Esaú representa Edom e seu território.
- source_word: וְהָיְתָה לַיהוָה
  choice: e ... pertencerá a Yahweh
  rationale: A construção com היה e ל de posse é expressa idiomaticamente em português por “pertencerá a”, sem perder o valor futuro da sequência.
- source_word: הַמְּלוּכָה
  choice: o reino
  rationale: O substantivo pode indicar reino, realeza ou domínio soberano. “O reino” é claro e solene, enquanto as outras nuances são registradas em nota.
theological_decisions:
- issue: Agentes humanos plurais chamados מוֹשִׁעִים em contexto de soberania divina
  choice: Libertadores
  alternative: Salvadores
  rationale: A tradução conserva a atuação instrumental de agentes humanos sem negar que a soberania e a salvação últimas pertencem a Yahweh, como afirma a cláusula final.
- issue: Amplitude semântica de הַמְּלוּכָה
  choice: o reino pertencerá a Yahweh
  alternative: a realeza será de Yahweh; o domínio pertencerá a Yahweh
  rationale: “Reino” oferece uma formulação natural, mas o hebraico também pode enfatizar a dignidade régia ou o exercício do governo; a nota preserva essa abertura.
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: A transliteração comunica que o texto hebraico emprega o nome pessoal divino, em consonância com a camada inglesa fornecida, sem substituir o nome por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem da frase acompanha de perto o hebraico sem soar artificial. “Região montanhosa” explicita o provável sentido territorial de הַר, e as notas preservam as alternativas lexicais genuínas.
