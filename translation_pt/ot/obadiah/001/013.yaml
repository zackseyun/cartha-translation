revisions:
- from: Não entre pela porta do meu povo no dia da calamidade deles; não contemple, você também, a desgraça dele no dia da sua calamidade; e não ponha as mãos nos bens dele no dia da sua calamidade.[a]
  to: Não entre pelo portão do meu povo no dia da calamidade deles; não olhe, nem você, para a calamidade dele no dia da sua calamidade; e não estenda a mão contra os bens dele no dia da sua calamidade.[a]
  rationale: A revisão melhora a precisão de «portão» para a entrada urbana, torna a segunda proibição mais natural sem sobreinterpretar ראה como regozijo e aproxima «estenda a mão contra» do idiomatismo hebraico. Mantêm-se a repetição retórica, os pronomes plural e singular do texto-fonte e a ambiguidade de חֵיל na nota.
