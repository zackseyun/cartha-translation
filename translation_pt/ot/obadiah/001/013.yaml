  source_fidelity: A tradução conserva adequadamente a sequência de proibições, a repetição de «no dia da calamidade» e a alternância hebraica entre o plural («deles») e o singular coletivo («dele/sua»). «Bens» é uma opção contextual defensável para חֵיל, desde que as alternativas permaneçam em nota.
  naturalness: «Porta do meu povo» soa pouco natural para o portão/entrada urbana implicado por שַׁעַר. «Portão do meu povo» é mais claro e preserva a imagem concreta. «Olhe para» é mais corrente que «contemple» neste contexto, sem impor a ideia interpretativa de regozijo.
  terminology: «Calamidade» traduz אֵיד de modo consistente e digno. «Desgraça» para רָעָה é possível, mas «calamidade» oferece maior coesão e evita uma conotação potencialmente mais coloquial. «Estenda a mão contra» representa de modo mais próximo o idiomatismo hebraico de ação hostil/apropriação.
