    rationale: שַׁעַר designa o portão ou a entrada da cidade; «portão» é mais idiomático e preciso em português neste cenário.
  - severity: low
    issue: «contemple»
    rationale: Embora possível, é menos natural em uma proibição direta. «Olhe para» preserva o valor lexical básico de ראה e deixa que o contexto comunique a censura.
  - severity: low
    issue: Formulação da nota sobre «bens»
    rationale: A nota atual diz que «bens» corresponde ao saque, quando o termo designa antes os bens/recursos que poderiam ser saqueados. A formulação pode ser esclarecida sem alterar a decisão lexical.
