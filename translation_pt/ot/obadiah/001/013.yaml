  text: אַל תָּב֤וֹא בְ/שַֽׁעַר עַמִּ/י֙ בְּ/י֣וֹם אֵידָ֔/ם אַל תֵּ֧רֶא גַם אַתָּ֛ה בְּ/רָעָת֖/וֹ בְּ/י֣וֹם אֵיד֑/וֹ וְ/אַל תִּשְׁלַ֥חְנָה בְ/חֵיל֖/וֹ בְּ/י֥וֹם אֵידֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/013.yaml
  text: Do not enter the gate of my people in the day of their disaster[a]; do not look on his calamity, even you, in the day of his disaster[b]; and do not lay hands on his wealth in the day of his disaster.
translation:
  language: pt
  text: Não entre pelo portão do meu povo no dia da calamidade deles; não olhe, nem você, para a calamidade dele no dia da sua calamidade; e não estenda a mão contra os bens dele no dia da sua calamidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Bens” também pode ser traduzido por “força”, “exército” ou “recursos”; a palavra hebraica admite esses sentidos. Neste contexto, “bens” é provável, pois a sequência se refere à apropriação oportunista depois da calamidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּבוֹא בְשַׁעַר עַמִּי
  choice: entre pela porta do meu povo
  rationale: Preserva a imagem concreta da porta como acesso à cidade ou comunidade, em português natural.
- source_word: בְּיוֹם אֵידָם / בְּיוֹם אֵידוֹ
  choice: no dia da calamidade deles / no dia da sua calamidade
  rationale: אֵיד indica calamidade ou desastre; a tradução mantém a repetição retórica e a mudança hebraica do plural para o singular.
- source_word: תֵּרֶא
  choice: contemple
  rationale: O verbo significa literalmente ver ou olhar. No contexto, o olhar é hostil, mas a tradução evita tornar explícita uma satisfação maliciosa que o verbo isoladamente não exige.
- source_word: גַם אַתָּה
  choice: você também
  rationale: Mantém a ênfase acusatória dirigida a Edom em linguagem portuguesa atual.
- source_word: בְרָעָתוֹ
  choice: a desgraça dele
  rationale: רָעָה aqui designa o mal sofrido, a adversidade ou desgraça, e não necessariamente maldade moral.
- source_word: וְאַל תִּשְׁלַחְנָה בְחֵילוֹ
  choice: e não ponha as mãos nos bens dele
  rationale: שלח ב pode expressar estender ou lançar a mão sobre algo; חַיִל admite riqueza, força ou exército. O contexto imediato de saque favorece 'bens', sem ocultar as alternativas.
theological_decisions:
- issue: Alternância entre sufixos pronominais plurais e singulares
  choice: Manter 'deles' na primeira ocorrência e formas singulares nas seguintes
  alternative: Harmonizar todas as referências no plural ou todas no singular
  rationale: O hebraico passa do povo coletivo no plural para uma representação singular, possivelmente a nação personificada ou Jacó como irmão. Preservar a alternância evita resolver a tensão textual.
- issue: Força contextual do verbo ראה
  choice: Traduzir por 'contemple'
  alternative: Traduzir por 'exulte com' ou 'olhe com satisfação para'
  rationale: O contexto pode sugerir um olhar malicioso, mas o verbo em si é 'ver/olhar'. A opção escolhida conserva a censura contextual sem inserir explicitamente a emoção de regozijo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de 'no dia da sua calamidade' foi preservada por seu efeito profético. O singular coletivo foi mantido, embora em português exija formas como 'dele' e 'sua'.
