  - severity: low
    issue: “E diz no coração” omite o possessivo e fica ligeiramente abrupto em português.
    rationale: “E que diz em seu coração” é mais idiomático e mantém a ligação com o destinatário coletivo.
  - severity: low
    issue: A nota d é desnecessária após a harmonização idiomática da pessoa gramatical e sua localização depois da fala não corresponde a uma dificuldade que precise ser sinalizada ao leitor.
    rationale: A alternância hebraica é real, mas não afeta o sentido nem requer nota em uma tradução corrente; as formas de terceira pessoa funcionam descritivamente dentro da interpelação a Edom.
