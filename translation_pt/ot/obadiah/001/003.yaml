  naturalness: O texto é em geral atual e compreensível. A revisão torna a cadeia descritiva mais fluida e explicita o possessivo em “em seu coração”, sem eliminar a interpelação direta a Edom.
  terminology: “Soberba”, “coração”, “fendas da rocha” e “fará descer” são escolhas apropriadas ao registro profético e ao sentido hebraico. “No alto” comunica naturalmente a localização elevada da morada.
