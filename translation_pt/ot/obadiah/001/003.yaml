  text: זְד֤וֹן לִבְּ/ךָ֙ הִשִּׁיאֶ֔/ךָ שֹׁכְנִ֥י בְ/חַגְוֵי סֶּ֖לַע מְר֣וֹם שִׁבְתּ֑/וֹ אֹמֵ֣ר בְּ/לִבּ֔/וֹ מִ֥י יוֹרִדֵ֖/נִי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/003.yaml
  text: The pride of your heart has deceived you[a], you who dwell in the clefts of the rock, whose dwelling is on high, who say in your heart[c][b], “Who will bring me down to the ground?”
translation:
  language: pt
  text: 'A soberba do seu coração enganou você[a], você que mora nas fendas da rocha[b], cuja morada está no alto, e que diz em seu coração: “Quem me fará descer até o chão[c]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “arrogância” ou “presunção”.
    reason: lexical_alternative
  - marker: b
    text: Ou “nas reentrâncias da rocha”. A expressão evoca fortalezas rochosas e habitações protegidas nos penhascos.
    reason: cultural_note
  - marker: c
    text: Ou “até a terra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְדוֹן
  choice: soberba
  rationale: O substantivo indica orgulho arrogante e presunçoso. “Soberba” é natural no registro profético e expressa a exaltação de si mesmo atribuída a Edom.
- source_word: לִבְּךָ
  choice: seu coração
  rationale: “Coração” preserva o idioma hebraico para o íntimo da pessoa, incluindo pensamento, vontade e atitude.
- source_word: הִשִּׁיאֶךָ
  choice: enganou você
  rationale: O hifil de נשׁא significa aqui induzir ao erro ou enganar. A formulação é clara no português moderno e mantém a ideia de que a própria soberba de Edom produziu uma falsa segurança.
- source_word: שֹׁכְנִי
  choice: você que mora
  rationale: O particípio funciona como descrição do destinatário. A oração relativa mantém viva a interpelação direta e soa natural em português.
- source_word: בְחַגְוֵי סֶּלַע
  choice: nas fendas da rocha
  rationale: חגוי designa fendas, reentrâncias ou esconderijos. “Fendas da rocha” é concreto e evoca as fortalezas protegidas dos penhascos de Edom.
- source_word: מְרוֹם שִׁבְתּוֹ
  choice: em uma morada elevada
  rationale: A expressão descreve a localização alta e aparentemente inacessível da habitação. A formulação evita introduzir um possuidor não identificado, sem ocultar em nota a mudança pronominal do hebraico.
- source_word: אֹמֵר בְּלִבּוֹ
  choice: e diz no coração
  rationale: A locução conserva o idioma semítico de falar interiormente, isto é, pensar consigo mesmo. O sujeito continua sendo Edom, tratado como singular coletivo.
- source_word: מִי יוֹרִדֵנִי
  choice: Quem me fará descer
  rationale: O hifil de ירד exprime fazer descer. A pergunta comunica a autoconfiança desafiadora do ocupante das alturas.
- source_word: אָרֶץ
  choice: até o chão
  rationale: Neste contexto, a palavra contrasta com a morada elevada. “Chão” comunica com clareza tanto o movimento vertical quanto a ideia de humilhação, enquanto “terra” permanece como alternativa possível.
theological_decisions:
- issue: Mudança entre a interpelação na segunda pessoa e formas na terceira pessoa do singular
  choice: Manter Edom como destinatário direto ao longo da frase, usando “você” e deixando implícito o mesmo sujeito nas orações seguintes.
  alternative: 'Reproduzir mecanicamente a terceira pessoa: “aquele que mora... sua morada... diz no coração dele”.'
  rationale: O versículo começa com formas de segunda pessoa dirigidas a Edom, e as formas de terceira pessoa descrevem esse mesmo destinatário coletivo. A tradução contínua em discurso direto preserva a força profética e evita sugerir uma pessoa diferente; a peculiaridade gramatical do hebraico é registrada em nota.
translation_notes:
  register: Português atual, digno e acessível, com boa legibilidade brasileira e vocabulário amplamente compreensível. “Soberba” mantém o tom profético; “enganou você” evita uma construção pronominal excessivamente formal; e “morada elevada” conserva a imagem poética sem criar ambiguidade desnecessária.
