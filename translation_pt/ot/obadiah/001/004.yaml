  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אִם תַּגְבִּ֣יהַּ כַּ/נֶּ֔שֶׁר וְ/אִם בֵּ֥ין כּֽוֹכָבִ֖ים שִׂ֣ים קִנֶּ֑/ךָ מִ/שָּׁ֥ם אוֹרִֽידְ/ךָ֖ נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/004.yaml
  text: Though you soar high like the eagle[a], and though you set your nest among the stars, from there I will bring you down, declares Yahweh.
translation:
  language: pt
  text: Ainda que te eleves como a águia[a] e ponhas o teu ninho entre as estrelas, de lá eu te farei descer — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se subires alto como uma águia e se colocares o teu ninho entre as estrelas”. A partícula hebraica pode significar “se”, mas aqui tem provável sentido concessivo: mesmo na maior altura possível, Yahweh fará Edom descer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם ... וְאִם
  choice: Ainda que ... e
  rationale: 'As partículas condicionais formam aqui uma concessão poética: mesmo que Edom alcance uma altura inimaginável, Yahweh o fará descer. A segunda ocorrência é representada naturalmente pela coordenação com “e”, sem necessidade de repetir “ainda que”.'
- source_word: תַּגְבִּיהַּ
  choice: te eleves
  rationale: O hifil de גבה comunica tornar alto ou elevar. “Te eleves” preserva tanto a imagem espacial ligada à águia quanto a conotação contextual de exaltação orgulhosa.
- source_word: כַּנֶּשֶׁר
  choice: como a águia
  rationale: A preposição כְּ marca comparação, e o artigo hebraico é refletido por “a águia”, expressão natural em português para essa imagem proverbial.
- source_word: בֵּין כּוֹכָבִים
  choice: entre as estrelas
  rationale: בֵּין, diante de um plural coletivo, indica localização no meio de vários elementos; “entre as estrelas” é idiomático e conserva a imagem de altura extrema.
- source_word: שִׂים קִנֶּךָ
  choice: ponhas o teu ninho
  rationale: שׂים significa pôr ou colocar, e קֵן é literalmente “ninho”. A tradução mantém a continuidade da figura da águia e da morada aparentemente segura.
- source_word: מִשָּׁם
  choice: de lá
  rationale: A expressão é mantida de modo direto para salientar que nem mesmo aquele refúgio elevadíssimo está fora do alcance divino.
- source_word: אוֹרִידְךָ
  choice: eu te farei descer
  rationale: O hifil de ירד é causativo, literalmente “farei descer”. A formulação conserva essa estrutura e o contraste com a elevação inicial.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: נְאֻם é uma fórmula profética de pronunciamento solene. O nome divino יְהוָה é representado como “Yahweh”, preservando o nome próprio no texto-fonte.
theological_decisions:
- issue: Força condicional ou concessiva de אִם
  choice: Ainda que
  alternative: Se
  rationale: Embora אִם normalmente introduza uma condição, a promessa categórica de que Deus fará Edom descer confere às duas orações força concessiva. A alternativa literal permanece registrada em nota para preservar a ambiguidade gramatical.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico traz explicitamente o Tetragrama como nome próprio. “Yahweh” o representa sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção poética é concisa; “te eleves” mantém juntas as ideias de altura física e autoexaltação, sem explicitar além do hebraico.
