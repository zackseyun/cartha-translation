  text: Look[a], I have made you small among the nations[b]; you are greatly despised.
translation:
  language: pt
  text: Eis que eu tornei você pequeno[a] entre as nações[b]; você é muito desprezado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “insignificante entre as nações”.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico diz literalmente: “eu te dei pequeno entre as nações”, expressão cujo sentido é “eu tornei você pequeno entre as nações”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Veja
  rationale: Introduz a declaração chamando a atenção com força retórica. “Veja” é direto e atual, sem o tom mais arcaico de “Eis”.
- source_word: קָטֹן
  choice: pequeno
  rationale: Expressa pequenez ou baixa posição no conjunto das nações. A opção direta “pequeno” preserva a imagem hebraica; “insignificante” explicita uma possível nuance contextual e fica em nota.
- source_word: נְתַתִּיךָ
  choice: eu fiz você
  rationale: 'Embora נָתַן signifique literalmente “dar”, a construção com o adjetivo predicativo tem sentido resultativo ou causativo: Deus fez que o destinatário se tornasse pequeno.'
- source_word: בַּגּוֹיִם
  choice: entre as nações
  rationale: גּוֹיִם designa aqui as nações ou povos em geral, não especificamente os “gentios” em contraste religioso posterior.
- source_word: בָּזוּי
  choice: desprezado
  rationale: O particípio passivo descreve o destinatário como objeto de desprezo. “Desprezado” é conciso e mantém essa relação passiva.
- source_word: מְאֹד
  choice: muito
  rationale: Marca intensidade e modifica “desprezado”; “muito” é a forma mais natural e clara em português atual.
theological_decisions:
- issue: Aspecto perfeito na declaração profética de juízo
  choice: eu fiz você
  alternative: eu farei você pequeno; eu torno você pequeno
  rationale: O perfeito hebraico pode apresentar a ação divina como realizada ou decretada de modo certo, com resultado presente. O pretérito perfeito português conserva melhor essa força declarativa sem transformar desnecessariamente a frase em previsão futura.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O tratamento por “você” torna natural a interpelação direta, enquanto o masculino singular preserva a forma gramatical do hebraico e evita acrescentar ao texto um substantivo como “nação”.
