base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/007.yaml
  text: All the men of your covenant have sent you to the border[a]; the men at peace with you have deceived you and prevailed against you[c][b]. Those who eat your bread have set a trap under you—there is no understanding in him.
translation:
  language: pt
  text: Todos os que fizeram aliança contigo te enviaram até a fronteira[a]. Os que viviam em paz contigo te enganaram e prevaleceram contra ti. Os que comem do teu pão armaram uma cilada debaixo de ti[b] — não há discernimento nele[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “te expulsaram até a fronteira” ou “te acompanharam até a fronteira”. O verbo hebraico pode ter sentido neutro ou hostil neste contexto.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “puseram um laço debaixo de ti”. A palavra hebraica traduzida por “cilada” é rara, e seu sentido exato é incerto.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “não há entendimento nele”. O pronome talvez se refira a Edom; outros entendem “nisso” ou interpretam a frase de outra maneira, pois o referente hebraico é ambíguo.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַד הַגְּבוּל
  choice: até a fronteira
  rationale: Preserva o destino espacial concreto da expressão hebraica sem decidir se se trata de expulsão hostil ou de acompanhamento.
- source_word: שִׁלְּחוּךָ
  choice: te mandaram
  rationale: O piel de שלח pode significar mandar embora ou despachar. A formulação mantém a amplitude do verbo; o contexto sugere traição, mas não obriga a explicitar expulsão.
- source_word: אַנְשֵׁי בְרִיתֶךָ
  choice: todos os que fizeram aliança contigo
  rationale: Expressa de modo natural a relação de aliança ou tratado indicada pelo hebraico, sem reduzi-la simplesmente a amizade.
- source_word: הִשִּׁיאוּךָ
  choice: te enganaram
  rationale: O hiphil de נשׁא neste contexto indica fazer alguém se enganar ou ser desencaminhado; 'enganaram' é claro e adequado à traição política descrita.
- source_word: יָכְלוּ לְךָ
  choice: prevaleceram contra ti
  rationale: Reproduz de perto o idioma hebraico de conseguir prevalecer ou vencer alguém, sem acrescentar uma imagem física de força.
- source_word: אַנְשֵׁי שְׁלֹמֶךָ
  choice: os que viviam em paz contigo
  rationale: Conserva a ideia relacional de pessoas ligadas a Edom por relações pacíficas, evitando interpretar o grupo apenas como amigos.
- source_word: לַחְמְךָ
  choice: os que comem do teu pão
  rationale: Mantém a imagem do pão e da comunhão à mesa. A formulação explicita em português a relação elíptica tradicionalmente entendida no hebraico.
- source_word: יָשִׂימוּ מָזוֹר תַּחְתֶּיךָ
  choice: armaram uma cilada debaixo de ti
  rationale: A palavra rara מָזוֹר parece designar uma armadilha ou laço. 'Cilada' comunica naturalmente a traição, enquanto 'debaixo de ti' preserva a imagem espacial incomum.
- source_word: אֵין תְּבוּנָה בּוֹ
  choice: não há discernimento nele
  rationale: Mantém a construção breve e o pronome masculino singular do hebraico, sem resolver seu referente incerto.
theological_decisions:
- issue: Referente do sufixo masculino em בּוֹ
  choice: nele
  alternative: nisso; em você; Edom não tem discernimento
  rationale: O texto hebraico contém um referente masculino singular não expresso. A tradução preserva essa ambiguidade, em vez de identificar explicitamente Edom, a pessoa traída ou a situação.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com construções de boa legibilidade brasileira. Conservam-se as imagens concretas de aliança, pão, fronteira e cilada, bem como a ambiguidade final do hebraico.
