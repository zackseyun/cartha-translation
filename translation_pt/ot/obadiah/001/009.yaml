id: OBA.1.9
reference: Obadiah 1:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/חַתּ֥וּ גִבּוֹרֶ֖י/ךָ תֵּימָ֑ן לְמַ֧עַן יִכָּֽרֶת אִ֛ישׁ מֵ/הַ֥ר עֵשָׂ֖ו מִ/קָּֽטֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/009.yaml
  text: And your mighty men[a], Teman, will be shattered[c][b], so that every man from the mountain of Esau may be cut off by slaughter.
translation:
  language: pt
  text: E os seus guerreiros, Temã[b], ficarão aterrorizados[a], para que todo homem do monte de Esaú seja eliminado pela matança[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ficarão desalentados”, “ficarão apavorados” ou “serão destroçados”. O verbo hebraico pode destacar tanto o pânico quanto o colapso.
    reason: lexical_alternative
  - marker: b
    text: Temã era uma cidade ou região de Edom; seu nome está relacionado à palavra “sul”.
    reason: cultural_note
  - marker: c
    text: 'Também é possível entender: “para que todo homem do monte de Esaú seja eliminado na matança”. A frase final permite pequenas diferenças de relação sintática.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְחַתּוּ
  choice: ficarão aterrorizados
  rationale: O verbo חתת pode expressar tanto terror e desânimo quanto colapso ou ruína. No contexto da derrota militar, “ficarão aterrorizados” comunica de modo natural o aspecto de pânico sem excluir a consequente desintegração da resistência.
- source_word: גִבּוֹרֶיךָ
  choice: os seus guerreiros
  rationale: גִּבּוֹר designa aqui homens fortes em função militar. “Guerreiros” é claro e corrente em português, além de evitar a possível ambiguidade moderna de “valentes”.
- source_word: תֵּימָן
  choice: Temã
  rationale: O termo funciona como nome próprio de uma localidade ou região edomita. A forma portuguesa “Temã” é mantida como vocativo em aposição, sem acrescentar uma partícula inexistente no hebraico.
- source_word: לְמַעַן
  choice: para que
  rationale: Reproduz de maneira natural a relação de propósito ou resultado introduzida por לְמַעַן.
- source_word: יִכָּרֶת
  choice: seja eliminado
  rationale: O nifal de כרת significa “ser cortado, eliminado”. O subjuntivo depois de “para que” preserva a dependência sintática do imperfeito hebraico.
- source_word: אִישׁ
  choice: todo homem
  rationale: O singular masculino tem valor distributivo. “Todo homem” conserva tanto esse valor quanto a forma masculina da imagem de perda total entre os homens de Edom.
- source_word: מֵהַר עֵשָׂו
  choice: do monte de Esaú
  rationale: A tradução mantém o singular הַר e o sentido territorial da expressão, sem convertê-la necessariamente em um topônimo fixo como “Monte Esaú”.
- source_word: מִקָּטֶל
  choice: pela matança
  rationale: A preposição מִן pode indicar aqui meio, causa ou circunstância associada. “Pela matança” preserva essa concisão e a força sombria da expressão.
theological_decisions:
- issue: Masculino singular אִישׁ em um oráculo coletivo de juízo
  choice: todo homem
  alternative: todos; cada pessoa
  rationale: A formulação mantém o masculino singular distributivo do hebraico e a provável referência aos homens, especialmente aos combatentes, de Edom, sem neutralizar a retórica do texto.
- issue: Identificação de תֵּימָן
  choice: Temã, como nome próprio
  alternative: sul
  rationale: Neste contexto, Temã é uma localidade ou região de Edom e funciona como destinatário do anúncio. Traduzir por “sul” obscureceria essa referência geográfica.
- issue: Valor de לְמַעַן com o imperfeito יִכָּרֶת
  choice: para que ... seja eliminado
  alternative: de modo que ... será eliminado
  rationale: A construção admite matiz de propósito e de resultado. O subjuntivo português conserva a relação sintática sem transformar silenciosamente a oração em simples predição indicativa.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi levemente ajustada para soar natural, mantendo Temã como vocativo em aposição. “Guerreiros” explicita o contexto militar; “todo homem” conserva o gênero e o valor distributivo do hebraico.
