source:
  edition: WLC
  text: הֲ/ל֛וֹא בַּ/יּ֥וֹם הַ/ה֖וּא נְאֻם יְהוָ֑ה וְ/הַאֲבַדְתִּ֤י חֲכָמִים֙ מֵֽ/אֱד֔וֹם וּ/תְבוּנָ֖ה מֵ/הַ֥ר עֵשָֽׂו־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/008.yaml
  text: Will I not[a], on that day, declares Yahweh, destroy the wise men from Edom, and understanding from the mountain of Esau?
translation:
  language: pt
  text: “Naquele dia”, declara Yahweh, “será que não destruirei os sábios de Edom e o entendimento do monte de Esaú[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «do Monte de Esaú» ou «da região montanhosa de Esaú». O hebraico diz literalmente «do monte de Esaú».
    reason: A expressão hebraica pode designar tanto um monte quanto a região montanhosa associada a Esaú/Edom; a nota preserva essa ambiguidade.
lexical_decisions:
- source_word: הֲלוֹא
  choice: será que não
  rationale: Mantém a forma de pergunta retórica, que espera resposta afirmativa, em português corrente.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: É a forma temporal natural em português e corresponde de perto ao hebraico.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Preserva a fórmula profética solene e apresenta o nome divino explicitamente.
- source_word: וְהַאֲבַדְתִּי
  choice: eliminarei
  rationale: O hifil de אבד indica a ação de fazer desaparecer ou remover; no contexto, 'eliminar' comunica claramente o juízo divino sem sugerir necessariamente destruição física de cada indivíduo.
- source_word: חֲכָמִים
  choice: os sábios
  rationale: Designa pessoas reconhecidas por sua sabedoria. Em português, o masculino plural conserva a forma do hebraico e soa mais natural que 'homens sábios'.
- source_word: מֵאֱדוֹם
  choice: de Edom
  rationale: A preposição marca a esfera ou origem da qual os sábios serão removidos.
- source_word: וּתְבוּנָה
  choice: o entendimento
  rationale: Conserva o substantivo abstrato e o paralelismo com 'os sábios'.
- source_word: מֵהַר עֵשָׂו
  choice: da região montanhosa de Esaú
  rationale: הַר pode designar não só um monte isolado, mas a região montanhosa associada a Esaú; essa leitura geográfica é natural no contexto e mantém o paralelo com Edom.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o nome pessoal divino. 'Yahweh' o translitera, em vez de substituí-lo por um título.
- issue: Alcance de חֲכָמִים
  choice: os sábios
  alternative: os homens sábios; as pessoas sábias
  rationale: A expressão mantém o masculino plural hebraico sem acrescentar 'homens', podendo referir-se à classe reconhecida de sábios de Edom.
- issue: Sentido geográfico de הַר עֵשָׂו
  choice: região montanhosa de Esaú
  alternative: monte de Esaú; monte Esaú
  rationale: A expressão pode indicar o território montanhoso de Edom, associado a Esaú. A tradução evita transformá-la indevidamente no nome de um pico específico.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem foi levemente ajustada para tornar clara a pergunta retórica e a fórmula profética. As aspas distinguem a declaração divina sem alterar seu conteúdo.
