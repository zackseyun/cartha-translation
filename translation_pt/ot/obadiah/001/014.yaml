  text: וְ/אַֽל תַּעֲמֹד֙ עַל הַ/פֶּ֔רֶק לְ/הַכְרִ֖ית אֶת פְּלִיטָ֑י/ו וְ/אַל תַּסְגֵּ֥ר שְׂרִידָ֖י/ו בְּ/י֥וֹם צָרָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/014.yaml
  text: Do not stand at the crossroads to cut off his fugitives[c][b][a], and do not hand over his survivors in the day of distress.
translation:
  language: pt
  text: Não se poste na encruzilhada[a] para eliminar os seus fugitivos[c], nem entregue[b] os seus sobreviventes no dia da angústia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na bifurcação do caminho” ou “na passagem da montanha”. O termo hebraico indica um lugar onde os fugitivos podiam ser interceptados.
    reason: lexical_alternative
  - marker: b
    text: Ou “entregue nas mãos do inimigo”. O verbo hebraico significa literalmente “fechar”, mas aqui é usado no sentido de entregar alguém ao poder de um inimigo.
    reason: lexical_alternative
  - marker: c
    text: Ou “os seus escapados”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּעֲמֹד
  choice: se poste
  rationale: O verbo significa literalmente “ficar de pé” ou “tomar posição”. Neste contexto, “se poste” comunica naturalmente a ação deliberada de ocupar um lugar para interceptar quem foge.
- source_word: הַפֶּרֶק
  choice: a encruzilhada
  rationale: O termo indica um ponto de passagem ou divisão de caminhos onde fugitivos poderiam ser interceptados. “Encruzilhada” preserva a imagem concreta sem impor uma topografia incerta.
- source_word: לְהַכְרִית
  choice: para eliminar
  rationale: כרת pode significar “cortar” ou “eliminar”. Aqui, “eliminar” expressa o propósito hostil contra os fugitivos e é mais natural em português do que uma reprodução literal de “cortar”.
- source_word: פְּלִיטָיו
  choice: os fugitivos dele
  rationale: פליט designa quem escapou ou fugiu de uma catástrofe. “Fugitivos” é conciso e mantém a ideia de pessoas em fuga, enquanto “dele” preserva o sufixo pronominal hebraico sem explicitar além do texto.
- source_word: תַּסְגֵּר
  choice: entregue
  rationale: Embora סגר signifique literalmente “fechar”, neste contexto tem o sentido idiomático de entregar pessoas ao poder do inimigo.
- source_word: שְׂרִידָיו
  choice: os sobreviventes dele
  rationale: שרד se refere aos que restaram depois de uma calamidade. “Sobreviventes” transmite claramente o sentido contextual e evita sugerir, sem necessidade, um uso técnico-teológico de “remanescente”.
- source_word: בְּיוֹם צָרָה
  choice: no dia da angústia
  rationale: A expressão é temporal, e “angústia” comunica a gravidade de צָרָה em português atual e digno.
theological_decisions:
- issue: Possível nuance teológica de שְׂרִידָיו
  choice: os sobreviventes dele
  alternative: o remanescente dele
  rationale: “Remanescente” é lexicalmente possível, mas pode evocar um conceito teológico técnico da literatura profética. Neste contexto, a referência imediata é aos judeus que sobreviveram ao ataque; por isso, “sobreviventes” evita acrescentar uma nuance não exigida pelo versículo.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A construção negativa paralela preserva a forma exortativa do hebraico; “se poste” mantém a imagem deliberada de tomar posição para interceptar fugitivos.
