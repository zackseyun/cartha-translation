source:
  edition: WLC
  text: וְ/יָרְשׁ֨וּ הַ/נֶּ֜גֶב אֶת הַ֣ר עֵשָׂ֗ו וְ/הַ/שְּׁפֵלָה֙ אֶת פְּלִשְׁתִּ֔ים וְ/יָרְשׁוּ֙ אֶת שְׂדֵ֣ה אֶפְרַ֔יִם וְ/אֵ֖ת שְׂדֵ֣ה שֹׁמְר֑וֹן וּ/בִנְיָמִ֖ן אֶת הַ/גִּלְעָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/019.yaml
  text: Those of the Negev will possess the hill country of Esau[a], and those of the Shephelah the land of the Philistines; they will also possess the territory of Ephraim and the territory of Samaria[b], and Benjamin will possess Gilead.
translation:
  language: pt
  text: Os habitantes do Neguebe tomarão posse[a] da região montanhosa de Esaú; os habitantes da Sefelá tomarão posse da terra dos filisteus[b]. Também tomarão posse do território de Efraim e do território de Samaria; e Benjamim tomará posse de Gileade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “herdarão”; o verbo hebraico, repetido ao longo do versículo, pode indicar herdar uma terra ou tomar posse dela.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “os filisteus”; a tradução explicita o sentido territorial como “a terra dos filisteus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרְשׁוּ
  choice: tomarão posse
  rationale: O verbo ירשׁ pode indicar herdar ou entrar na posse de uma terra, inclusive por conquista. “Tomar posse” é natural neste contexto territorial e não limita o modo pelo qual a posse se concretiza.
- source_word: הַנֶּגֶב
  choice: os habitantes do Neguebe
  rationale: O nome da região funciona metonimicamente como sujeito, referindo-se a seus habitantes. A explicitação evita que uma região pareça agir e preserva o topônimo tradicional.
- source_word: הַר עֵשָׂו
  choice: a região montanhosa de Esaú
  rationale: Em expressão territorial, הַר designa aqui uma região montanhosa, não necessariamente um monte isolado.
- source_word: הַשְּׁפֵלָה
  choice: os habitantes da Sefelá
  rationale: Assim como “Neguebe”, o termo geográfico representa os habitantes da região. “Sefelá” preserva o nome próprio da baixada de Judá.
- source_word: פְּלִשְׁתִּים
  choice: a terra dos filisteus
  rationale: O hebraico traz literalmente o etnônimo “filisteus”, mas, como objeto de posse numa enumeração territorial, refere-se à terra deles. A formulação explicita esse sentido sem recorrer ao topônimo menos transparente “Filístia”.
- source_word: שְׂדֵה אֶפְרַיִם
  choice: o território de Efraim
  rationale: Embora שָׂדֶה tenha o sentido básico de “campo”, nesta fórmula geográfica denota a região ou território associado a Efraim.
- source_word: שְׂדֵה שֹׁמְרוֹן
  choice: o território de Samaria
  rationale: A expressão se refere à região de Samaria, e não a um campo individual; “território” comunica claramente o sentido geográfico.
- source_word: בִנְיָמִן
  choice: Benjamim
  rationale: O nome funciona coletivamente, representando a tribo ou o povo de Benjamim. Manter apenas o nome é conciso e natural em português bíblico.
- source_word: הַגִּלְעָד
  choice: Gileade
  rationale: Trata-se do nome próprio tradicional da região; o artigo hebraico não precisa ser reproduzido em português.
theological_decisions: []
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. Os gentílicos regionais implícitos foram explicitados como “habitantes”, e os topônimos tradicionais Neguebe, Sefelá e Gileade foram preservados. A repetição de “tomar posse” acompanha a estrutura territorial do hebraico e mantém coesão lexical.
