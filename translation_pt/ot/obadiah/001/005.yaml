revisions:
- from: Se ladrões viessem até você, se assaltantes viessem de noite — como você foi destruído! —, não roubariam apenas o quanto lhes bastasse? Se vindimadores viessem até você, não deixariam algumas uvas para a rebusca?
  to: Se ladrões viessem a você, se saqueadores noturnos viessem — como você foi destruído! —, não roubariam apenas o bastante para si? Se colhedores de uvas viessem a você, não deixariam uvas remanescentes?
