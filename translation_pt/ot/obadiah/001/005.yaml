  naturalness: «Até você» é pouco idiomático neste contexto e cria uma ênfase espacial desnecessária. «Colhedores de uvas» e «uvas remanescentes» são mais transparentes para leitores internacionais, inclusive brasileiros, do que «vindimadores» e «rebusca».
  terminology: «Ladrões», «saqueadores noturnos», «destruído», «o bastante para si» e «colhedores de uvas» representam adequadamente os termos hebraicos e mantêm o contraste entre o saque limitado e a devastação total.
