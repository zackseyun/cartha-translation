  text: אִם גַּנָּבִ֤ים בָּאֽוּ לְ/ךָ֙ אִם שׁ֣וֹדְדֵי לַ֔יְלָה אֵ֣יךְ נִדְמֵ֔יתָה הֲ/ל֥וֹא יִגְנְב֖וּ דַּיָּ֑/ם אִם בֹּֽצְרִים֙ בָּ֣אוּ לָ֔/ךְ הֲ/ל֖וֹא יַשְׁאִ֥ירוּ עֹלֵלֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/005.yaml
  text: If thieves came to you[a], if robbers by night—how you have been destroyed!—would they not steal only enough for themselves? If grape gatherers came to you[b], would they not leave gleanings?
translation:
  language: pt
  text: Se ladrões viessem a você, se saqueadores noturnos viessem — como você foi destruído! —, não roubariam apenas o bastante para si? Se colhedores de uvas viessem a você, não deixariam uvas remanescentes?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּנָּבִים
  choice: ladrões
  rationale: Equivalente português comum e direto para pessoas que furtam ou roubam.
- source_word: שֹׁדְדֵי לַיְלָה
  choice: assaltantes viessem de noite
  rationale: Expressa o caráter violento dos saqueadores e preserva a referência temporal, com sintaxe natural em português.
- source_word: אֵיךְ נִדְמֵיתָה
  choice: como você foi destruído
  rationale: O nifal de דמה, neste contexto, indica destruição ou ruína; a construção exclamativa preserva a interrupção de tom lamentoso.
- source_word: הֲלוֹא יִגְנְבוּ דַּיָּם
  choice: não roubariam apenas o quanto lhes bastasse?
  rationale: Torna natural o idioma baseado em דַּי, 'suficiência', e comunica que ladrões comuns levariam somente o bastante para si.
- source_word: בֹּצְרִים
  choice: vindimadores
  rationale: Designa especificamente os que colhem uvas; o termo preserva a imagem da vindima, embora seja menos coloquial que 'colhedores de uvas'.
- source_word: יַשְׁאִירוּ עֹלֵלוֹת
  choice: não deixariam algumas uvas para a rebusca?
  rationale: עֹלֵלוֹת refere-se às uvas remanescentes após a colheita principal; a formulação explicita a imagem agrícola sem reduzi-la a sobras genéricas.
- source_word: לְךָ / לָךְ
  choice: até você
  rationale: Representa naturalmente o movimento em direção ao destinatário; a hostilidade já fica clara pelos sujeitos e pelo contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Mantém a comparação retórica e a exclamação parentética do hebraico. 'Vindimadores' e 'rebusca' preservam com precisão a imagem vitícola; o contexto imediato esclarece esses termos.
