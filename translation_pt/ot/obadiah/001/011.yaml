  text: בְּ/יוֹם֙ עֲמָֽדְ/ךָ֣ מִ/נֶּ֔גֶד בְּ/י֛וֹם שְׁב֥וֹת זָרִ֖ים חֵיל֑/וֹ וְ/נָכְרִ֞ים בָּ֣אוּ שער/ו וְ/עַל יְרוּשָׁלִַ֨ם֙ יַדּ֣וּ גוֹרָ֔ל גַּם אַתָּ֖ה כְּ/אַחַ֥ד מֵ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/011.yaml
  text: On the day when you stood aloof[a], on the day strangers carried off his wealth, and foreigners entered his gates and cast lots over Jerusalem[c][b], you too were like one of them.
translation:
  language: pt
  text: No dia em que ficaste à distância[a], no dia em que estranhos levaram embora os seus bens[b], quando estrangeiros entraram pelo seu portão[c] e lançaram sortes sobre Jerusalém, tu também foste como um deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ficaste de lado” ou “ficaste afastado”. A expressão hebraica fala literalmente de ficar em frente ou à distância.
    reason: lexical_alternative
  - marker: b
    text: Ou “a sua força” ou “o seu exército”. O termo hebraico חֵיל pode indicar força militar, capacidade, recursos ou riqueza.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “seu portão”, provavelmente em referência a Jerusalém ou Judá personificado. Pelo contexto, também se pode traduzir “seus portões”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲמָדְךָ מִנֶּגֶד
  choice: ficaste à distância
  rationale: A expressão combina “ficar de pé” com a ideia de estar em frente ou à distância. No contexto, descreve uma postura de afastamento e não intervenção, sem eliminar o sentido espacial do hebraico.
- source_word: שְׁבוֹת
  choice: levaram embora
  rationale: O verbo costuma indicar levar cativo ou capturar. Como o objeto aqui é חֵילוֹ, e não pessoas explicitamente, “levaram embora” comunica a apreensão dos recursos sem restringir indevidamente o sentido.
- source_word: זָרִים
  choice: estranhos
  rationale: Designa pessoas alheias ao povo. “Estranhos” mantém uma distinção lexical em relação a נָכְרִים, traduzido em seguida por “estrangeiros”.
- source_word: חֵילוֹ
  choice: os seus bens
  rationale: חֵיל pode indicar força, exército, capacidade ou riqueza. No cenário de invasão e pilhagem, “bens” é provável, mas a ambiguidade relevante é preservada em nota.
- source_word: נָכְרִים
  choice: estrangeiros
  rationale: O termo identifica pessoas reconhecidas como estrangeiras e preserva a variação vocabular do paralelo hebraico.
- source_word: בָּאוּ שַׁעֲרוֹ
  choice: entraram pelo seu portão
  rationale: 'A forma consonantal é singular e traz sufixo masculino: literalmente, “entraram em/pelo portão dele”. O singular foi mantido, apesar de “portões” também ser uma formulação contextual possível.'
- source_word: יַדּוּ גוֹרָל
  choice: lançaram sortes
  rationale: É a expressão convencional para decidir posse ou divisão por sorteio, possivelmente no contexto da repartição da cidade ou de seus despojos.
- source_word: גַּם אַתָּה
  choice: tu também
  rationale: Marca a inclusão de Edom na culpa dos invasores, com uma formulação direta e enfática.
- source_word: כְּאַחַד מֵהֶם
  choice: foste como um deles
  rationale: Mantém a força comparativa da acusação sem convertê-la numa afirmação mais forte de identidade absoluta.
theological_decisions:
- issue: Força interpretativa da postura de Edom em עמד מנגד
  choice: A tradução apresenta Edom mantendo-se à distância, postura que, no contexto, o torna moralmente comparável aos atacantes.
  alternative: A expressão poderia ser entendida apenas como descrição da posição física de Edom, sem explicitar não intervenção culpável.
  rationale: A conclusão “tu também foste como um deles” confere força acusatória à postura de Edom. “Ficaste à distância” conserva tanto a imagem espacial quanto a implicação contextual, sem inserir na linha principal uma interpretação mais explícita do que o hebraico.
- issue: Referente dos sufixos em חֵילוֹ e שַׁעֲרוֹ
  choice: Foram mantidos pronomes masculinos em “os seus bens” e “seu portão”, deixando o referente contextual implícito.
  alternative: Explicitar “os bens de Jerusalém/Judá” e “os portões de Jerusalém”.
  rationale: O hebraico personifica o referente com sufixos masculinos, enquanto Jerusalém só é nomeada adiante. Explicitar um referente eliminaria uma pequena ambiguidade do texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Conserva o tratamento singular “tu” por corresponder à interpelação direta a Edom e mantém a repetição profética de “no dia”. A ordem das notas acompanha os respectivos termos no texto.
