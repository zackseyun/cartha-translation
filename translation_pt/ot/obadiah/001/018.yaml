  text: וְ/הָיָה֩ בֵית יַעֲקֹ֨ב אֵ֜שׁ וּ/בֵ֧ית יוֹסֵ֣ף לֶהָבָ֗ה וּ/בֵ֤ית עֵשָׂו֙ לְ/קַ֔שׁ וְ/דָלְק֥וּ בָ/הֶ֖ם וַ/אֲכָל֑וּ/ם וְ/לֹֽא יִֽהְיֶ֤ה שָׂרִיד֙ לְ/בֵ֣ית עֵשָׂ֔ו כִּ֥י יְהוָ֖ה דִּבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/018.yaml
  text: The house of Jacob will be a fire[a], and the house of Joseph a flame, and the house of Esau stubble. They will burn them and consume them, and there will be no survivor for the house of Esau[b], for Yahweh has spoken.
translation:
  language: pt
  text: A casa de Jacó será fogo, e a casa de José será chama; a casa de Esaú será restolho. Eles os incendiarão[a] e os consumirão, e não haverá sobrevivente algum da casa de Esaú[b], pois Yahweh falou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “arderão entre eles e os consumirão”. O hebraico é compacto e pode descrever mais diretamente o fogo agindo contra a casa de Esaú.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “remanescente”. O termo hebraico שָׂרִיד pode indicar um sobrevivente ou aquilo que resta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵית יַעֲקֹב
  choice: a casa de Jacó
  rationale: Preserva a expressão profética de sentido coletivo, referente ao povo ligado a Jacó, sem reduzi-la a uma residência ou família doméstica.
- source_word: אֵשׁ
  choice: fogo
  rationale: Mantém de modo direto a metáfora de poder destruidor e forma um paralelo natural com “chama”.
- source_word: בֵית יוֹסֵף
  choice: a casa de José
  rationale: Conserva o paralelismo com “casa de Jacó” e a referência coletiva aos grupos israelitas associados a José.
- source_word: לֶהָבָה
  choice: chama
  rationale: É o correspondente natural de “fogo” e preserva a intensificação poética da imagem.
- source_word: בֵית עֵשָׂו
  choice: a casa de Esaú
  rationale: Mantém a fórmula profética e sua referência coletiva à descendência e ao povo de Esaú, isto é, Edom.
- source_word: לְקַשׁ
  choice: restolho
  rationale: Designa os resíduos secos deixados no campo, facilmente consumidos pelo fogo, e reproduz com precisão a imagem do hebraico.
- source_word: וְדָלְקוּ בָהֶם
  choice: Eles os incendiarão
  rationale: Expressa em português natural a ação hostil da imagem do fogo. A construção hebraica é compacta e admite uma versão mais formal, registrada em nota.
- source_word: וַאֲכָלוּם
  choice: e os consumirão
  rationale: No contexto da metáfora do fogo, “consumir” comunica naturalmente a destruição completa sugerida por אכל.
- source_word: שָׂרִיד
  choice: sobrevivente
  rationale: O contexto anuncia destruição total; “sobrevivente” preserva esse sentido sem as possíveis conotações teológicas positivas de “remanescente”.
- source_word: כִּי יְהוָה דִּבֵּר
  choice: pois Yahweh falou
  rationale: Conserva o nome divino e a fórmula profética que fundamenta a certeza do anúncio na palavra de Yahweh.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Emprega uma forma amplamente reconhecida do nome próprio divino e preserva sua força pactual sem substituí-lo por um título.
- issue: Sentido de “casa de Jacó”, “casa de José” e “casa de Esaú”
  choice: Entidades coletivas ligadas aos patriarcas
  alternative: Famílias domésticas ou dinastias em sentido estrito
  rationale: O paralelismo e o contexto de Obadias apontam para povos ou grupos nacionais; a tradução conserva a expressão original sem impor uma identificação teológica posterior.
- issue: Sentido de שָׂרִיד no anúncio de juízo
  choice: sobrevivente
  alternative: remanescente
  rationale: A frase nega que alguém da casa de Esaú escape da destruição; “sobrevivente” transmite isso diretamente, enquanto “remanescente” pode sugerir preservação positiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Preservam-se o paralelismo profético, a metáfora agrícola do fogo e o uso coletivo de “casa”. “Restolho” foi mantido por sua precisão imagética; o contexto deixa claro que se trata de material seco e combustível.
