  text: How Esau has been searched out! His hidden treasures have been sought out![a][b]
translation:
  language: pt
  text: Como Esaú foi vasculhado! Seus tesouros escondidos foram descobertos![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, Esaú se refere coletivamente a seus descendentes, o povo de Edom, ou à própria Edom.
    reason: cross_reference
  - marker: b
    text: 'Ou: “Como Esaú foi saqueado! Seus depósitos secretos foram postos a descoberto!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Como
  rationale: Introduz uma exclamação de espanto, não uma pergunta; “Como” conserva de modo natural a força profética.
- source_word: נֶחְפְּשׂוּ
  choice: foi vasculhado
  rationale: O nifal perfeito plural de חפשׂ comunica busca minuciosa. O singular concorda com “Esaú”, nome coletivo, e “vasculhado” sugere tanto busca completa quanto saque no contexto.
- source_word: עֵשָׂו
  choice: Esaú
  rationale: Mantém o nome pessoal do hebraico, usado metonimicamente para seus descendentes ou para Edom, sem substituir o texto por uma interpretação.
- source_word: נִבְעוּ
  choice: foram descobertos
  rationale: O nifal perfeito indica que as coisas ocultas foram procuradas até serem expostas. “Descobertos” distingue este verbo do anterior e preserva o paralelismo resultativo.
- source_word: מַצְפֻּנָיו
  choice: seus tesouros escondidos
  rationale: O substantivo com sufixo de terceira pessoa masculina singular designa coisas escondidas ou armazenadas; no contexto, refere-se naturalmente a bens valiosos ocultos.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção exclamativa conserva a intensidade do hebraico; “vasculhado” e “descobertos” mantêm a progressão e evitam repetir o mesmo verbo.
