base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/008.yaml
  text: All of them are holding swords[a], trained in warfare; each man has his sword at his thigh because of terror in the nights.
translation:
  language: pt
  text: Todos eles empunham espadas, treinados para a guerra; cada homem leva sua espada junto à coxa, por causa do terror nas noites.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à noite”. O hebraico diz literalmente “nas noites”, expressão plural que pode intensificar poeticamente a ideia do perigo noturno.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: Todos eles
  rationale: Expressa claramente a totalidade do grupo indicada pelo sufixo pronominal.
- source_word: אֲחֻזֵי חֶרֶב
  choice: empunham espadas
  rationale: A construção descreve homens que seguram ou portam espadas; o plural distributivo é natural em português.
- source_word: מְלֻמְּדֵי מִלְחָמָה
  choice: treinados para a guerra
  rationale: Preserva a ideia de homens instruídos e preparados para o combate, em linguagem corrente e digna.
- source_word: אִישׁ
  choice: cada homem
  rationale: Reproduz o singular distributivo masculino no quadro imediato de guardas armados.
- source_word: חַרְבּוֹ עַל יְרֵכוֹ
  choice: leva a espada junto à coxa
  rationale: Conserva a imagem concreta da arma presa ou pronta para uso ao lado da coxa, sem sugerir que ela esteja literalmente apoiada sobre a perna.
- source_word: מִפַּחַד
  choice: por causa do terror
  rationale: Entende a preposição מִן em sentido causal e traduz פַּחַד com a intensidade apropriada ao perigo que exige proteção.
- source_word: בַּלֵּילוֹת
  choice: durante as noites
  rationale: Mantém o plural poético hebraico e situa o terror no período noturno sem o reduzir silenciosamente ao singular.
