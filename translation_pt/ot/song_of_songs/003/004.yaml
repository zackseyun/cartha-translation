  text: כִּ/מְעַט֙ שֶׁ/עָבַ֣רְתִּי מֵ/הֶ֔ם עַ֣ד שֶֽׁ/מָּצָ֔אתִי אֵ֥ת שֶׁ/אָהֲבָ֖ה נַפְשִׁ֑/י אֲחַזְתִּי/ו֙ וְ/לֹ֣א אַרְפֶּ֔/נּוּ עַד שֶׁ֤/הֲבֵיאתִי/ו֙ אֶל בֵּ֣ית אִמִּ֔/י וְ/אֶל חֶ֖דֶר הוֹרָתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/004.yaml
  text: I had scarcely passed by them when I found the one my soul loves[a]. I held on to him and would not let him go until I had brought him into my mother's house[b], into the chamber of the one who conceived me.
translation:
  language: pt
  text: Mal eu tinha passado por eles, encontrei aquele a quem minha alma ama[a]. Agarrei-me a ele e não o deixei ir até levá-lo à casa de minha mãe, ao quarto daquela que me concebeu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de maneira menos formal: “aquele que minha alma ama”.'
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, “o quarto daquela que me concebeu”, expressão poética paralela a “casa de minha mãe”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְעַט
  choice: Mal eu tinha
  rationale: No contexto temporal, a expressão indica que o encontro ocorreu quase imediatamente depois de ela passar pelos guardas; esta construção é natural em português e evita o sentido literal inadequado de “um pouco”.
- source_word: שֶׁעָבַרְתִּי מֵהֶם
  choice: passado por eles
  rationale: O verbo com a preposição indica que ela seguiu adiante, deixando para trás os guardas mencionados anteriormente.
- source_word: עַד שֶׁמָּצָאתִי
  choice: encontrei
  rationale: Depois de “Mal eu tinha passado”, a sequência direta comunica com naturalidade a quase simultaneidade; traduzir mecanicamente עַד שֶׁ por “até que” produziria uma construção menos idiomática.
- source_word: אֵת שֶׁאָהֲבָה נַפְשִׁי
  choice: aquele a quem minha alma ama
  rationale: Mantém a expressão recorrente do poema, inclusive “minha alma”, e usa uma construção portuguesa clara e digna.
- source_word: אֲחַזְתִּיו
  choice: Agarrei-me a ele
  rationale: Expressa firme apego sem sugerir necessariamente violência, adequando-se ao contexto afetivo.
- source_word: וְלֹא אַרְפֶּנּוּ
  choice: e não o deixei ir
  rationale: Representa de modo natural o sentido causativo de não soltar ou não liberar alguém.
- source_word: עַד שֶׁהֲבֵיאתִיו
  choice: até levá-lo
  rationale: Preserva o limite temporal da ação de segurá-lo e evita uma forma verbal pesada em português.
- source_word: אֶל בֵּית אִמִּי
  choice: à casa de minha mãe
  rationale: Comunica o movimento em direção ao interior da casa de maneira idiomática; a continuação especifica o espaço interno.
- source_word: וְאֶל חֶדֶר הוֹרָתִי
  choice: ao quarto daquela que me concebeu
  rationale: Preserva a imagem específica do particípio הוֹרָתִי e o paralelismo poético, sem reduzi-lo a mera repetição de “minha mãe”.
- source_word: נַפְשִׁי
  choice: minha alma
  rationale: Embora נֶפֶשׁ possa designar a pessoa ou o ser interior, “minha alma” conserva a textura poética e emocional do refrão.
