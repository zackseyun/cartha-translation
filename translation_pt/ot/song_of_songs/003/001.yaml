  text: עַל מִשְׁכָּבִ/י֙ בַּ/לֵּיל֔וֹת בִּקַּ֕שְׁתִּי אֵ֥ת שֶׁ/אָהֲבָ֖ה נַפְשִׁ֑/י בִּקַּשְׁתִּ֖י/ו וְ/לֹ֥א מְצָאתִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/001.yaml
  text: On my bed in the nights I sought the one my soul loves; I sought him[a], but I did not find him.
translation:
  language: pt
  text: Em minha cama, noite após noite, procurei aquele a quem a minha alma ama; procurei-o, mas não o encontrei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “nas noites”, no plural, o que pode indicar noites repetidas ou períodos noturnos. Por isso, traduz-se aqui “noite após noite”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל מִשְׁכָּבִי
  choice: Em minha cama
  rationale: מִשְׁכָּבִי designa o lugar onde a pessoa se deita. “Em minha cama” é natural em português e mantém a imagem concreta.
- source_word: בַּלֵּילוֹת
  choice: noite após noite
  rationale: O hebraico emprega o plural “noites”. A expressão preserva a ideia de repetição ou de sucessivos períodos noturnos sem a estranheza de uma reprodução literal como “nas noites”.
- source_word: בִּקַּשְׁתִּי
  choice: procurei
  rationale: בקשׁ significa buscar ou procurar. “Procurei” é claro, corrente e apropriado ao contexto de alguém ausente.
- source_word: אֵת שֶׁאָהֲבָה נַפְשִׁי
  choice: aquele a quem a minha alma ama
  rationale: A formulação conserva נֶפֶשׁ como “alma” e mantém o presente poético de אָהֲבָה, expressando amor persistente sem reduzi-lo simplesmente a “quem eu amo”.
- source_word: בִּקַּשְׁתִּיו
  choice: procurei-o
  rationale: Mantém a repetição enfática do verbo hebraico e representa explicitamente o sufixo masculino de terceira pessoa.
- source_word: וְלֹא מְצָאתִיו
  choice: mas não o encontrei
  rationale: “Mas” expressa naturalmente o contraste entre a procura e seu resultado frustrado; “não o encontrei” reflete de perto o hebraico.
