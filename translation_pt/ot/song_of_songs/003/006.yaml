  verdict: revise
  source_fidelity: A tradução preserva bem a interrogativa, o demonstrativo feminino, o movimento de subida, a imagem das colunas de fumaça e os aromáticos. Contudo, «com todos os pós aromáticos» torna distributivo e totalizante o singular construto hebraico מִכֹּל אַבְקַת רוֹכֵל (“de todo pó aromático de mercador” / “de toda espécie de pó aromático de mercador”) e «com» enfraquece a preposição מן, que apresenta a procedência ou o meio aromático.
  naturalness: O texto é poético, claro e natural em português internacional de boa legibilidade brasileira. «Fumaça», «perfumada», «mirra» e «incenso» são escolhas correntes. A revisão proposta mantém esse registro.
  terminology: «Mirra» e «incenso» são adequados para מוֹר e לְבוֹנָה. «Deserto» é possível para מִדְבָּר, com a alternativa indicada. «Pó aromático» representa bem אַבְקָה no contexto; o singular coletivo e «de toda espécie de» refletem melhor a construção hebraica.
  issues:
  - severity: medium
    issue: «com todos os pós aromáticos do mercador» altera a construção final.
    rationale: O hebraico tem מִכֹּל (“de todo/de cada espécie de”), seguido de אַבְקַת no singular construto e de רוֹכֵל (“mercador”). «De toda espécie de pó aromático de mercador» conserva a relação de procedência/qualificação, evita introduzir «todos» como conjunto definido e mantém o singular coletivo.
  revised_text: Quem é esta que vem subindo do deserto[a], como colunas de fumaça[b], perfumada de mirra e incenso, de toda espécie de pó aromático de mercador?
