translation:
  language: pt
  text: Quem é esta que vem subindo do deserto[a], como colunas de fumaça[b], perfumada de mirra e incenso, de toda espécie de pó aromático de mercador?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «da região erma».
    reason: lexical_alternative
  - marker: b
    text: Ou «como pilares de fumaça».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֹאת
  choice: Quem é esta
  rationale: Traduz diretamente o interrogativo e o demonstrativo feminino, preservando no português a referência feminina explícita.
- source_word: עֹלָה
  choice: que vem subindo
  rationale: Expressa naturalmente o movimento ascendente e orientado em direção ao ponto de vista do observador.
- source_word: מִן הַמִּדְבָּר
  choice: do deserto
  rationale: מדבר pode designar deserto ou região erma; «deserto» é claro e idiomático, enquanto a alternativa é registrada em nota.
- source_word: כְּתִימֲרוֹת עָשָׁן
  choice: como colunas de fumaça
  rationale: Preserva a imagem de formações verticais e ascendentes de fumaça sem recorrer a uma formulação excessivamente tradicional.
- source_word: מְקֻטֶּרֶת
  choice: perfumada
  rationale: O particípio passivo descreve alguém impregnado do aroma de substâncias aromáticas; «perfumada» comunica o resultado com naturalidade.
- source_word: מוֹר
  choice: mirra
  rationale: Equivalente português consagrado para a resina aromática מור.
- source_word: וּלְבוֹנָה
  choice: e incenso
  rationale: «Incenso» é a designação portuguesa corrente da resina aromática לבונה neste contexto.
- source_word: מִכֹּל אַבְקַת רוֹכֵל
  choice: com todos os pós aromáticos do mercador
  rationale: אבקה indica pó; o contexto de mirra, incenso e comércio sustenta «pós aromáticos». O מִן pode indicar a fonte dos aromas, expressa naturalmente em português por «com» após «perfumada».
theological_decisions: []
