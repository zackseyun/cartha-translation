base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/007.yaml
  text: Look[a], it is Solomon’s couch; sixty mighty men are around it, from the mighty men of Israel.
translation:
  language: pt
  text: 'Vejam[a] o leito de Salomão: sessenta guerreiros estão ao redor dele, dentre os guerreiros de Israel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cama”. O termo hebraico pode designar uma cama, um leito ou um lugar de repouso; à luz do contexto, alguns o entendem como uma liteira real transportável.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Vejam
  rationale: Introduz a cena chamando a atenção dos ouvintes. O plural é natural no contexto poético e conserva a força dêitica sem tom arcaico.
- source_word: מִטָּתוֹ
  choice: liteira
  rationale: O substantivo pode designar cama ou lugar de repouso; neste contexto, cercado por guardas e relacionado à procissão real, “liteira” comunica naturalmente o provável objeto transportável, enquanto a nota preserva a amplitude lexical.
- source_word: שֶׁלִּשְׁלֹמֹה
  choice: de Salomão
  rationale: Expressa posse de maneira direta e idiomática em português.
- source_word: שִׁשִּׁים
  choice: sessenta
  rationale: Correspondência direta do numeral cardinal.
- source_word: גִּבֹּרִים
  choice: guerreiros
  rationale: Neste cenário de escolta armada, o termo se refere naturalmente a homens valentes e aptos para o combate; a repetição do mesmo termo no versículo é preservada.
- source_word: סָבִיב לָהּ
  choice: ao redor dela
  rationale: Expressa a posição circundante; o pronome feminino concorda naturalmente em português com “liteira”.
- source_word: מִגִּבֹּרֵי יִשְׂרָאֵל
  choice: dos guerreiros de Israel
  rationale: 'O מִן tem valor partitivo: os sessenta são escolhidos dentre os guerreiros de Israel. “Dos” preserva essa relação de modo natural.'
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com ritmo poético. “Vejam” evita o arcaísmo de “eis”. “Guerreiros” é mais claro no contexto militar do que “homens valentes”. A exclamação após “Salomão” reproduz a vivacidade da apresentação sem eliminar a ambiguidade lexical indicada em nota.
