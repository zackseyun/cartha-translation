  yaml_path: translation/ot/song_of_songs/003/009.yaml
  text: King Solomon made for himself a palanquin from the trees of Lebanon[a].
translation:
  language: pt
  text: O rei Salomão fez para si um palanquim de madeira do Líbano[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “liteira”, “carruagem” ou “cadeira de arruar”; o termo hebraico é raro, e não se sabe ao certo a que tipo de condução se refere, embora denote claramente um meio de transporte luxuoso.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַפִּרְיוֹן
  choice: palanquim
  rationale: O termo hebraico é raro e seu referente exato é incerto; “palanquim” comunica uma condução luxuosa transportada por pessoas sem definir em excesso sua construção.
- source_word: עָשָׂה
  choice: fez
  rationale: Traduz de modo direto e natural o verbo comum “fazer”, sem acrescentar detalhes como “construiu” ou “fabricou”.
- source_word: לּוֹ
  choice: para si
  rationale: Embora possa significar “para ele”, a referência imediata a Salomão favorece o sentido reflexivo, indicando uso ou posse pessoal.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: O rei Salomão
  rationale: Forma natural em português para o título seguido do nome próprio.
- source_word: מֵעֲצֵי
  choice: com árvores de
  rationale: Preserva a imagem literal das “árvores” como origem do material, embora “madeira de” também seja possível e mais interpretativo.
- source_word: הַלְּבָנוֹן
  choice: Líbano
  rationale: Forma portuguesa consagrada do topônimo.
theological_decisions: []
