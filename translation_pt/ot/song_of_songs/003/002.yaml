base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/002.yaml
  text: I will rise now and go about the city[a], in the marketplaces and in the streets; I will seek the one my soul loves. I sought him, but I did not find him.
translation:
  language: pt
  text: Vou me levantar agora e percorrer a cidade, pelos mercados e pelas ruas; vou procurar aquele que minha alma ama.[a] Eu o procurei, mas não o encontrei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, em formulação mais formal: “aquele a quem minha alma ama”.'
    reason: Alternativa de formulação para a oração relativa, preservando a imagem hebraica de “minha alma”.
lexical_decisions:
- source_word: אָקוּמָה נָּא
  choice: Vou me levantar agora
  rationale: O coortativo na primeira pessoa expressa resolução ou autoexortação, e נָא acrescenta urgência ou imediatismo. A formulação preserva ambos em português natural.
- source_word: וַאֲסוֹבְבָה בָעִיר
  choice: e percorrer a cidade
  rationale: O verbo סבב, também no coortativo, descreve o movimento de circular ou andar por diferentes partes da cidade. “Percorrer” comunica de modo conciso essa busca ativa.
- source_word: בַּשְּׁוָקִים וּבָרְחֹבוֹת
  choice: pelas ruas e pelas praças
  rationale: 'Os termos designam espaços públicos urbanos e têm campos semânticos parcialmente sobrepostos: שׁוּק pode indicar rua ou área de mercado, e רְחוֹב uma via larga ou praça aberta. A combinação “ruas e praças” é natural e preserva a abrangência da busca pública.'
- source_word: אֲבַקְשָׁה
  choice: vou procurar
  rationale: בקשׁ significa buscar ou procurar. “Vou procurar” soa corrente em português e mantém o valor volitivo do coortativo.
- source_word: אֵת שֶׁאָהֲבָה נַפְשִׁי
  choice: aquele a quem minha alma ama
  rationale: A tradução conserva a expressão poética com נֶפֶשׁ e o refrão característico do livro, sem substituí-la silenciosamente por “coração” ou apenas “eu”.
- source_word: בִּקַּשְׁתִּיו וְלֹא מְצָאתִיו
  choice: Eu o procurei, mas não o encontrei
  rationale: Os sufixos masculinos singulares são explicitados por “o”. “Mas” expressa naturalmente o contraste contextual introduzido pelo waw, enquanto a repetição de “procurar” preserva a repetição hebraica de בקשׁ.
