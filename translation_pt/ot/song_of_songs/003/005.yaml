  text: הִשְׁבַּ֨עְתִּי אֶתְ/כֶ֜ם בְּנ֤וֹת יְרוּשָׁלִַ֨ם֙ בִּ/צְבָא֔וֹת א֖וֹ בְּ/אַיְל֣וֹת הַ/שָּׂדֶ֑ה אִם תָּעִ֧ירוּ וְֽ/אִם תְּעֽוֹרְר֛וּ אֶת הָ/אַהֲבָ֖ה עַ֥ד שֶׁ/תֶּחְפָּֽץ־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/005.yaml
  text: I adjure you[a], daughters of Jerusalem, by the gazelles or by the does of the field[b], that you not stir up or awaken love until it desires.
translation:
  language: pt
  text: 'Eu as faço jurar[a], ó filhas de Jerusalém, pelas gazelas ou pelas corças do campo[b]: não despertem nem acordem o amor até que ele queira.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu as ponho sob juramento”.'
    reason: alternative_reading
  - marker: b
    text: O hebraico provavelmente se refere literalmente a gazelas e corças do campo; a palavra traduzida por “gazelas” também pode produzir um jogo poético de sons com o termo hebraico para “exércitos”.
    reason: cultural_note
lexical_decisions:
- source_word: הִשְׁבַּעְתִּי אֶתְכֶם
  choice: Eu as faço jurar
  rationale: O hifil de שׁבע expressa fazer alguém jurar ou colocá-lo sob juramento. A formulação é solene, natural em português e mantém o objeto feminino plural indicado pelo contexto.
- source_word: בְּנוֹת יְרוּשָׁלִַם
  choice: ó filhas de Jerusalém
  rationale: Preserva o vocativo poético e a expressão característica do Cântico; “ó” torna clara a função de chamamento sem modernizar o referente para “mulheres” ou “jovens”.
- source_word: בִּצְבָאוֹת אֹו בְּאַיְלוֹת הַשָּׂדֶה
  choice: pelas gazelas ou pelas corças do campo
  rationale: O paralelismo favorece os sentidos animais literais. “Corças” é corrente e poético em português, enquanto a preposição “pelas” conserva a fórmula de juramento.
- source_word: אִם ... וְאִם
  choice: não ... nem
  rationale: Na fórmula de juramento, a construção hebraica introduz uma proibição enfática; “não... nem” transmite essa força idiomaticamente.
- source_word: תָּעִירוּ וְתְּעוֹרְרוּ
  choice: despertem nem provoquem
  rationale: Os dois verbos cognatos intensificam a advertência. A dupla evita repetição artificial e comunica tanto despertar quanto incitar, sem tornar a expressão sexualmente mais específica do que o hebraico.
- source_word: הָאַהֲבָה
  choice: o amor
  rationale: Mantém o substantivo comum e sua possível personificação, sem decidir se o referente é a experiência do amor, o desejo ou uma pessoa amada.
- source_word: עַד שֶׁתֶּחְפָּץ
  choice: antes que ele queira
  rationale: O verbo feminino singular concorda gramaticalmente com אַהֲבָה, feminino em hebraico. Em português, “amor” é masculino, por isso “ele” preserva a concordância com o substantivo traduzido e mantém o amor como sujeito volitivo.
theological_decisions:
- issue: Referente e personificação de “amor” na oração final
  choice: Manter “o amor” como sujeito de “queira”, com o pronome masculino exigido pela gramática portuguesa.
  alternative: “até que ela queira”, “até que ele queira” referindo-se a uma pessoa, ou “até quando lhe agrade”
  rationale: O hebraico associa naturalmente o verbo feminino ao substantivo feminino “amor”, mas não identifica uma mulher nem um homem. A tradução conserva a personificação e a ambiguidade, sem atribuir o verbo a uma pessoa específica.
translation_notes:
  register: Português atual, digno e de leitura ampla, com vocabulário poético acessível. A colocação pronominal em “Eu as faço jurar” é natural no português brasileiro formal e inteligível internacionalmente. A tradução preserva a fórmula de juramento, o paralelismo e a personificação ambígua do amor.
