  text: עַמּוּדָי/ו֙ עָ֣שָׂה כֶ֔סֶף רְפִידָת֣/וֹ זָהָ֔ב מֶרְכָּב֖/וֹ אַרְגָּמָ֑ן תּוֹכ/וֹ֙ רָצ֣וּף אַהֲבָ֔ה מִ/בְּנ֖וֹת יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/010.yaml
  text: He made its pillars of silver[a], its back of gold, its seat of purple[c][b]; its interior was inlaid with love by the daughters of Jerusalem.
translation:
  language: pt
  text: Fez de prata as suas colunas, de ouro o seu apoio[a] e de púrpura o seu assento[b]; seu interior foi incrustado de amor[c] pelas filhas de Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a sua base”, “o seu suporte” ou “o seu encosto”; o termo hebraico é raro e seu sentido exato é incerto.
    reason: lexical_alternative
  - marker: b
    text: Ou “a sua carruagem” ou “o seu lugar de transporte”; o termo hebraico pode designar de modo mais amplo a parte em que alguém viaja.
    reason: lexical_alternative
  - marker: c
    text: Ou “seu interior foi pavimentado de amor”. A expressão hebraica é incomum e provavelmente descreve, em linguagem poética, uma ornamentação luxuosa. A preposição final também pode ser entendida como “procedente das filhas de Jerusalém”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדָיו
  choice: as suas colunas
  rationale: O substantivo designa normalmente colunas ou pilares. “Colunas” conserva a imagem arquitetônica e soa natural na descrição de uma liteira real.
- source_word: עָשָׂה
  choice: Fez
  rationale: Tradução direta do verbo comum “fazer”. O sujeito masculino singular, retomado do contexto, permanece implícito como é natural em português.
- source_word: כֶסֶף
  choice: de prata
  rationale: Sentido comum do nome do metal; a preposição “de” expressa naturalmente o material em português.
- source_word: רְפִידָתוֹ
  choice: o seu apoio
  rationale: O termo é raro e seu referente exato é incerto. “Apoio” preserva a ideia de uma parte estrutural ou destinada ao repouso sem especificar indevidamente que se trata de encosto ou base.
- source_word: זָהָב
  choice: de ouro
  rationale: Tradução padrão do nome do metal.
- source_word: מֶרְכָּבוֹ
  choice: o seu assento
  rationale: Embora o substantivo possa designar carro, carruagem ou lugar de condução, neste contexto parece indicar o lugar onde se viaja ou se senta dentro da liteira. “Assento” é claro e concreto.
- source_word: אַרְגָּמָן
  choice: de púrpura
  rationale: Designa púrpura ou material tingido de púrpura, associado ao luxo. A expressão portuguesa mantém tanto a cor quanto a possível referência ao tecido.
- source_word: תּוֹכוֹ
  choice: seu interior
  rationale: Refere-se à parte interna da liteira. “Interior” é natural, digno e preciso.
- source_word: רָצוּף
  choice: foi incrustado
  rationale: O particípio descreve algo disposto, revestido ou embutido ornamentalmente. “Incrustado” conserva a imagem de trabalho decorativo e também a formulação poética incomum.
- source_word: אַהֲבָה
  choice: de amor
  rationale: Mantém o sentido lexical direto, “amor”, mesmo que a imagem seja incomum. Evita substituir o texto massorético por conjecturas como “couro” ou “revestimento”.
- source_word: מִבְּנוֹת יְרוּשָׁלִָם
  choice: pelas filhas de Jerusalém
  rationale: Entende a preposição como indicação de agente, leitura coerente com o interior adornado por elas, sem apagar a possibilidade semântica de origem indicada em nota.
theological_decisions:
- issue: A imagem enigmática de um interior “incrustado de amor”
  choice: Conservar literalmente “amor” e a tensão poética da expressão
  alternative: Normalizar a frase como referência a couro, tecido ou outra decoração material
  rationale: O texto massorético traz claramente אַהֲבָה, “amor”. A tradução não deve resolver por conjectura uma imagem deliberadamente evocativa ou textualmente difícil.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com ordem sintática fluente e leve elevação poética. A tradução mantém as imagens materiais em paralelo — prata, ouro e púrpura — e preserva a expressão surpreendente “incrustado de amor”, enquanto as notas registram as incertezas lexicais reais.
