  text: צְאֶ֧ינָה וּֽ/רְאֶ֛ינָה בְּנ֥וֹת צִיּ֖וֹן בַּ/מֶּ֣לֶךְ שְׁלֹמֹ֑ה בָּ/עֲטָרָ֗ה שֶׁ/עִטְּרָה לּ֤/וֹ אִמּ/וֹ֙ בְּ/י֣וֹם חֲתֻנָּת֔/וֹ וּ/בְ/י֖וֹם שִׂמְחַ֥ת לִבּֽ/וֹ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/011.yaml
  text: Go out and look[a], O daughters of Zion, at King Solomon, with the crown with which his mother crowned him on the day of his wedding, on the day of the joy of his heart.
translation:
  language: pt
  text: Saiam e vejam, filhas de Sião, o rei Salomão com a coroa[a] com que sua mãe o coroou no dia do seu casamento, no dia da alegria do seu coração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “grinalda”; o termo hebraico pode designar uma coroa festiva ou uma grinalda, o que se ajusta ao contexto de casamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: צְאֶינָה וּרְאֶינָה
  choice: Saiam e vejam
  rationale: Os dois imperativos femininos plurais convocam as filhas de Sião a sair e olhar. A formulação é direta, natural e preserva o movimento para fora seguido da contemplação.
- source_word: בְּנוֹת צִיּוֹן
  choice: filhas de Sião
  rationale: Mantém o vocativo poético dirigido às mulheres de Sião/Jerusalém, sem acrescentar uma interjeição hoje pouco corrente.
- source_word: בַּמֶּלֶךְ שְׁלֹמֹה
  choice: o rei Salomão
  rationale: Depois de ראה, a preposição ב marca aqui o objeto contemplado; em português, o verbo transitivo “ver” dispensa preposição.
- source_word: בָּעֲטָרָה
  choice: com a coroa
  rationale: A preposição descreve Salomão acompanhado ou adornado pela coroa. “Com a coroa” conserva a estrutura hebraica sem explicitar além do texto que ele a está usando.
- source_word: עֲטָרָה
  choice: coroa
  rationale: O termo pode designar coroa ou grinalda. “Coroa” é a opção mais ampla no texto principal; a alternativa festiva é registrada em nota.
- source_word: שֶׁעִטְּרָה לּוֹ אִמּוֹ
  choice: com que sua mãe o coroou
  rationale: Preserva a relação etimológica e poética entre עֲטָרָה, “coroa”, e עטר, “coroar”.
- source_word: בְּיוֹם חֲתֻנָּתוֹ
  choice: no dia do seu casamento
  rationale: Expressa claramente o dia das núpcias e segue de perto a construção hebraica.
- source_word: וּבְיוֹם שִׂמְחַת לִבּוֹ
  choice: no dia da alegria do seu coração
  rationale: Mantém o paralelismo com a frase anterior e conserva a imagem poética e afetiva do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e poético, com boa legibilidade brasileira. O vocativo foi mantido sem “ó”, e a repetição “coroa... coroou” conserva o jogo lexical do hebraico. O marcador da nota foi colocado junto de “coroa”, termo ao qual a alternativa lexical se refere.
