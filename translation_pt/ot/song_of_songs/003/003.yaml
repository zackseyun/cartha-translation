base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/003.yaml
  text: 'The watchmen who go about the city found me: “Have you seen the one whom my soul loves?”[a][b]'
translation:
  language: pt
  text: Os guardas que rondavam a cidade me encontraram. “Vocês viram aquele a quem a minha alma ama?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “aquele a quem a minha alma ama”, expressão poética recorrente no Cântico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְצָאוּנִי
  choice: me encontraram
  rationale: O qal perfeito com sufixo de primeira pessoa significa diretamente “me encontraram”; a formulação é natural e adequada ao encontro durante a busca noturna.
- source_word: הַשֹּׁמְרִים
  choice: os guardas
  rationale: O particípio substantivado designa os responsáveis por vigiar a cidade. “Guardas” é corrente no português moderno e se ajusta ao contexto urbano noturno.
- source_word: הַסֹּבְבִים בָּעִיר
  choice: que rondavam a cidade
  rationale: O particípio de סבב descreve os guardas circulando pela cidade. “Rondavam” comunica suas voltas regulares sem recorrer ao termo mais moderno e institucional “patrulhavam”.
- source_word: אֵת שֶׁאָהֲבָה נַפְשִׁי
  choice: aquele a quem a minha alma ama
  rationale: Preserva a expressão poética recorrente do Cântico e mantém נֶפֶשׁ como “alma”, sem reduzi-la a “coração” nem explicitar além do hebraico a ideia de ser inteiro.
- source_word: רְאִיתֶם
  choice: Vocês viram
  rationale: A forma verbal é segunda pessoa masculina plural. “Vocês viram?” é uma pergunta direta, natural e amplamente compreensível em português, apropriada à busca em andamento.
