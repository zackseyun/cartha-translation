  text: I am a wall[a], and my breasts are like towers; then I was in his eyes like one who finds peace.
translation:
  language: pt
  text: 'Eu sou uma muralha,

    e meus seios são como torres;

    então, aos olhos dele,

    eu era como aquela que encontra paz.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como aquela que alcança paz”. A expressão hebraica também pode ter o sentido mais amplo de encontrar bem-estar, plenitude ou favor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹמָה
  choice: muralha
  rationale: O substantivo designa uma parede ou muralha, provavelmente defensiva. “Muralha” mantém com naturalidade em português a imagem arquitetônica que se liga às “torres”.
- source_word: שָׁדַי
  choice: meus seios
  rationale: A forma hebraica se refere explicitamente aos seios da mulher. A tradução direta preserva a linguagem corporal do poema.
- source_word: כַּמִּגְדָּלוֹת
  choice: como torres
  rationale: Mantém a comparação arquitetônica no plural e a correspondência poética com “muralha”.
- source_word: אָז
  choice: então
  rationale: Preserva de modo conciso a transição temporal ou consequencial, sem decidir entre essas duas nuances.
- source_word: הָיִיתִי
  choice: eu fui
  rationale: O perfeito de היה descreve o estado da mulher na percepção dele. “Eu fui” acompanha o valor passado do contexto sem impor a nuance ingressiva de “tornei-me”.
- source_word: בְעֵינָיו
  choice: aos olhos dele
  rationale: Reproduz o idioma hebraico de maneira corrente em português, indicando a percepção ou avaliação dele.
- source_word: כְּמוֹצְאֵת
  choice: como aquela que encontra
  rationale: O particípio feminino singular de מצא significa mais naturalmente “a que encontra/obtém”. “Aquela que encontra” conserva o gênero, a forma participial e a abertura da expressão.
- source_word: שָׁלוֹם
  choice: paz
  rationale: “Paz” é a equivalência mais direta e reconhecível, embora שָׁלוֹם possa abranger bem-estar, integridade e favor; essa amplitude é registrada na nota.
