  text: הַ/יוֹשֶׁ֣בֶת בַּ/גַּנִּ֗ים חֲבֵרִ֛ים מַקְשִׁיבִ֥ים לְ/קוֹלֵ֖/ךְ הַשְׁמִיעִֽי/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/013.yaml
  text: You who dwell in the gardens[a], companions are listening for your voice; let me hear it.
translation:
  language: pt
  text: Você que habita nos jardins, os companheiros estão atentos à sua voz; deixe-me ouvi-la.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “faça-me ouvir”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹשֶׁבֶת
  choice: Você que habita
  rationale: O particípio feminino singular com artigo funciona como forma de dirigir-se à mulher. “Habita” preserva o sentido contínuo e soa natural no contexto poético.
- source_word: בַּגַּנִּים
  choice: nos jardins
  rationale: Mantém o substantivo no plural e traduz diretamente a preposição com o artigo, sem reduzi-lo a um único jardim.
- source_word: חֲבֵרִים
  choice: os companheiros
  rationale: Expressa a ideia de amigos ou associados e conserva o tom relacional e poético do original.
- source_word: מַקְשִׁיבִים
  choice: estão atentos
  rationale: O particípio hiphil indica escuta atenta. Em ligação com “à sua voz”, esta formulação comunica atenção contínua sem acrescentar uma ação não expressa.
- source_word: לְקוֹלֵךְ
  choice: à sua voz
  rationale: קוֹל designa naturalmente a voz da mulher nesse discurso direto; o possessivo feminino singular é comunicado pelo contexto.
- source_word: הַשְׁמִיעִינִי
  choice: deixe-me ouvi-la
  rationale: O imperativo hiphil feminino singular com sufixo de primeira pessoa significa literalmente “faça-me ouvir”. A formulação escolhida é idiomática em português, e “-la” retoma claramente “voz”.
theological_decisions: []
translation_notes:
  register: Português moderno, poético e digno, com boa legibilidade brasileira. O tratamento por “você” evita a solenidade regionalmente marcada de “tu” e mantém clara a interpelação direta; a referência feminina decorre do contexto e da forma hebraica.
