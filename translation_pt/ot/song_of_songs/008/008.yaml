  yaml_path: translation/ot/song_of_songs/008/008.yaml
  text: We have a little sister[a], and she has no breasts. What shall we do for our sister on the day when she is spoken for?
translation:
  language: pt
  text: Temos uma irmãzinha, e ela não tem seios. O que faremos por nossa irmã no dia em que ela for pedida em casamento[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no dia em que falarem dela”. O hebraico pode se referir de modo geral ao que será dito a respeito dela, embora, neste contexto, provavelmente indique uma proposta ou negociação de casamento.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָחוֹת לָנוּ
  choice: Temos uma irmãzinha
  rationale: A construção expressa posse ou vínculo — literalmente, uma irmã pertence a nós. Em português corrente, “temos uma irmã” comunica isso naturalmente.
- source_word: קְטַנָּה
  choice: irmãzinha
  rationale: O adjetivo pode indicar pequenez ou pouca idade. O diminutivo português preserva essa amplitude e se ajusta ao contexto familiar sem fixar uma idade precisa.
- source_word: וְשָׁדַיִם אֵין לָהּ
  choice: e ela não tem seios
  rationale: Mantém a formulação concreta e direta do hebraico, que apresenta a imaturidade física sem a explicitar por paráfrase.
- source_word: מַה נַּעֲשֶׂה
  choice: O que faremos
  rationale: O imperfeito na primeira pessoa do plural tem sentido deliberativo; o futuro português transmite naturalmente a decisão que está sendo considerada.
- source_word: לַאֲחֹתֵנוּ
  choice: por nossa irmã
  rationale: A preposição ל indica aqui ação em favor da irmã; “por” preserva esse sentido.
- source_word: בַּיּוֹם
  choice: no dia
  rationale: Conserva a expressão temporal do hebraico de maneira clara e natural.
- source_word: שֶׁיְדֻבַּר בָּהּ
  choice: em que ela for pedida em casamento
  rationale: A expressão passiva significa literalmente que se falará dela ou a respeito dela. No contexto, provavelmente se refere a uma proposta ou negociação matrimonial; a tradução explicita esse sentido provável, enquanto a leitura mais geral é preservada em nota.
