translation_notes:
  register: Português moderno, poético e amplamente compreensível, com legibilidade brasileira. A tradução conserva a pergunta retórica do hebraico e a personificação do amor, evitando tanto o arcaísmo “adjuro” no texto principal quanto a explicitação denominacional ou interpretativa.
