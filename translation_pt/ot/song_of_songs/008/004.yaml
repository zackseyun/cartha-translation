translation:
  language: pt
  text: 'Eu as faço jurar, ó filhas de Jerusalém: por que haveriam de despertar ou atiçar o amor até que o amor queira?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu as conjuro, ó filhas de Jerusalém, a não despertar nem atiçar o amor até que ele queira.” A construção hebraica tem forma interrogativa, embora, neste refrão, funcione como forte apelo para que o amor não seja provocado antes de seu próprio momento. O verbo final está no feminino singular em hebraico e concorda com «amor», personificado.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִשְׁבַּעְתִּי אֶתְכֶם
  choice: Eu as faço jurar
  rationale: O hifil de שׁבע expressa impor um juramento ou conjurar solenemente. A formulação conserva a primeira pessoa e a força solene, com linguagem portuguesa corrente; o pronome feminino plural retoma as filhas de Jerusalém.
- source_word: בְּנוֹת יְרוּשָׁלִָם
  choice: ó filhas de Jerusalém
  rationale: Mantém literalmente a forma poética de tratamento; “ó” deixa claro o vocativo em português.
- source_word: מַה
  choice: por que
  rationale: Preserva a forma interrogativa do hebraico, que neste refrão tem força de apelo semelhante a uma proibição, sem transformá-la silenciosamente numa ordem explícita.
- source_word: תָּעִירוּ
  choice: despertariam
  rationale: Traduz o hifil de עור e conserva a metáfora de fazer o amor despertar.
- source_word: תְּעֹרְרוּ
  choice: atiçariam
  rationale: Reproduz o paralelismo com um verbo relacionado, mas distinto, transmitindo a ideia de estimular ou avivar uma paixão.
- source_word: הָאַהֲבָה
  choice: o amor
  rationale: Mantém a amplitude do substantivo, que pode designar o amor como experiência ou paixão, sem especificação interpretativa indevida.
- source_word: עַד שֶׁתֶּחְפָּץ
  choice: antes que ele próprio o queira
  rationale: 'Expressa idiomaticamente o limite temporal e preserva a personificação: o verbo hebraico feminino singular concorda com “amor”, substantivo feminino em hebraico. “Próprio” enfatiza que o amor não deve ser forçado antes de sua vontade ou ocasião.'
