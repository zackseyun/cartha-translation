base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/011.yaml
  text: Solomon had a vineyard at Baal-hamon[a]; he gave the vineyard to keepers[c][b]. Each man was to bring a thousand pieces of silver for its fruit.
translation:
  language: pt
  text: Salomão tinha uma vinha em Baal-Hamom. Ele entregou a vinha aos que cuidavam dela. Cada um devia trazer mil peças de prata pelo seu fruto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do seu fruto” ou “com o fruto dele”. No hebraico, o pronome pode referir-se à vinha ou, distributivamente, à produção de cada responsável.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּרֶם
  choice: vinha
  rationale: O substantivo designa uma área cultivada com videiras, não uma única videira; “vinha” é a equivalência portuguesa natural nas duas ocorrências.
- source_word: הָיָה לִשְׁלֹמֹה
  choice: Salomão tinha
  rationale: A construção possessiva hebraica, literalmente “havia para Salomão”, é expressa naturalmente em português por “Salomão tinha”.
- source_word: בְּבַעַל הָמוֹן
  choice: em Baal-Hamom
  rationale: A expressão é entendida como topônimo e transliterada; “em” expressa de modo natural a localização.
- source_word: נָתַן אֶת־הַכֶּרֶם לַנֹּטְרִים
  choice: entregou a vinha aos que cuidavam dela
  rationale: נָתַן significa amplamente “dar/entregar”; no contexto, indica que a vinha foi confiada a responsáveis por sua guarda e manejo, sem especificar juridicamente um arrendamento.
- source_word: לַנֹּטְרִים
  choice: aos que cuidavam dela
  rationale: O particípio de נטר envolve guardar ou vigiar. No contexto de uma vinha, a formulação abrange tanto sua proteção quanto seu cuidado e soa mais natural que “guardiões”.
- source_word: אִישׁ
  choice: cada um
  rationale: O singular distributivo refere-se a cada responsável pela vinha; “cada um” conserva essa distribuição sem introduzir uma ênfase masculina desnecessária em português.
- source_word: יָבִא
  choice: devia trazer
  rationale: O imperfeito descreve a ação esperada ou devida dentro do acordo, sem precisar apresentá-la como ordem direta.
- source_word: בְּפִרְיוֹ
  choice: pelo seu fruto
  rationale: “Pelo” expressa a relação do pagamento com a produção. O pronome hebraico pode remeter à vinha (“seu fruto”) ou, distributivamente, ao produto de cada responsável; a nota preserva essa ambiguidade.
- source_word: אֶלֶף כָּסֶף
  choice: mil peças de prata
  rationale: O hebraico diz literalmente “mil de prata” sem declarar a unidade. “Peças de prata” evita acrescentar “siclos” ou “moedas” ao texto.
