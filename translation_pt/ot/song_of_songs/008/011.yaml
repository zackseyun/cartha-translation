  register: Português moderno, claro e digno, com boa legibilidade brasileira. A tradução mantém a concisão poética e a ambiguidade real de בְּפִרְיוֹ. Evita especificar uma modalidade jurídica de arrendamento e não acrescenta uma unidade monetária ausente no hebraico.
