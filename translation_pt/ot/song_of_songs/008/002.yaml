base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/002.yaml
  text: I would lead you and bring you into my mother’s house[a], where she taught me; I would give you spiced wine to drink[b], from the juice of my pomegranate.
translation:
  language: pt
  text: Eu te conduziria e te levaria à casa de minha mãe, ela que me ensinava[a]. Eu te daria a beber vinho aromatizado e suco da minha romã[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tu me ensinarias”. A forma hebraica, entendida mais naturalmente como terceira pessoa feminina singular, refere-se à mãe; pela sintaxe poética concisa, alguns a entendem como dirigida ao amado.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “mosto doce da minha romã”. O termo hebraico pode designar suco fresco, bebida doce ou mosto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶנְהָגֲךָ
  choice: Eu te conduziria
  rationale: O imperfeito qal na primeira pessoa do singular, com sufixo de segunda pessoa masculina, tem aqui força desiderativa ou hipotética. “Conduziria” preserva tanto essa modalidade quanto a ideia concreta de guiar.
- source_word: אֲבִיאֲךָ
  choice: e te levaria
  rationale: O imperfeito hifil de בוא expressa fazer alguém entrar ou chegar. Em coordenação com “conduziria”, “levaria” é natural em português e mantém o movimento em direção à casa.
- source_word: בֵּית אִמִּי
  choice: à casa de minha mãe
  rationale: A expressão construta, regida por אֶל, indica direção. “À casa de minha mãe” é idiomático e não explicita além do necessário se a ação culmina dentro da casa.
- source_word: תְּלַמְּדֵנִי
  choice: onde ela me ensinava
  rationale: A forma verbal pode ser analisada como terceira pessoa feminina singular, retomando “minha mãe”, ou como segunda pessoa masculina singular, dirigindo-se ao amado. O texto principal adota a primeira leitura, favorecida pelo antecedente feminino imediato, e a nota preserva a ambiguidade morfológica.
- source_word: אַשְׁקְךָ
  choice: Eu te daria de beber
  rationale: O hifil de שקה significa fazer beber ou dar de beber. Esta formulação é corrente, evita uma conotação coercitiva e conserva o valor causativo.
- source_word: מִיַּיִן הָרֶקַח
  choice: vinho com especiarias
  rationale: A expressão designa vinho preparado ou misturado com substâncias aromáticas. “Vinho com especiarias” é claro e atual, sem perder a imagem sensorial.
- source_word: מֵעֲסִיס רִמֹּנִי
  choice: feito do suco da minha romã
  rationale: עָסִיס pode indicar suco, bebida doce recém-extraída ou mosto. “Suco” preserva a imagem da fruta sem impor fermentação; “feito do” explicita de modo natural a relação de origem expressa por מִן.
