base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/005.yaml
  text: Who is this coming up from the wilderness[a], leaning on her beloved? Under the apple tree I awakened you; there your mother was in labor with you[c][b]; there she who bore you was in labor.
translation:
  language: pt
  text: Quem é esta que vem subindo do deserto, apoiada em seu amado? Debaixo da macieira[a], eu despertei você[c][b]; ali sua mãe sentiu as dores do parto ao dar você à luz; ali sentiu as dores do parto aquela que deu você à luz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, «damasqueiro». A espécie exata indicada pela palavra hebraica é incerta; «macieira» é a tradução tradicional.
    reason: lexical_alternative
  - marker: b
    text: Ou «provoquei você» ou «excitei você». Neste contexto de poesia amorosa, o verbo hebraico pode sugerir mais do que simplesmente acordar.
    reason: alternative_reading
  - marker: c
    text: No meio do versículo, a fala parece passar da descrição para o tratamento direto, mas o hebraico não identifica explicitamente quem está falando.
    reason: alternative_reading
lexical_decisions:
- source_word: עֹלָה
  choice: vem subindo
  rationale: O particípio expressa movimento ascendente; «vem subindo» é natural em português e conserva tanto a direção quanto a perspectiva de quem observa.
- source_word: הַמִּדְבָּר
  choice: o deserto
  rationale: מִדְבָּר designa uma região erma e não cultivada. «Deserto» é claro e corrente em português, sem exigir que se trate apenas de dunas arenosas.
- source_word: מִתְרַפֶּקֶת עַל
  choice: apoiada em
  rationale: A forma rara sugere apoio físico próximo ou apego. «Apoiada em» se ajusta naturalmente à cena e evita definir em excesso a intensidade do gesto.
- source_word: דּוֹדָהּ
  choice: seu amado
  rationale: Em Cântico dos Cânticos, דּוֹד designa o homem amado. «Amado» mantém o tom afetivo e poético sem soar arcaico.
- source_word: תַּחַת הַתַּפּוּחַ
  choice: Debaixo da macieira
  rationale: «Macieira» é a tradução tradicional de תַּפּוּחַ, embora a espécie botânica exata seja incerta; essa incerteza é registrada em nota.
- source_word: עוֹרַרְתִּיךָ
  choice: eu despertei você
  rationale: O verbo pode significar despertar ou provocar/excitar. «Despertei» preserva o sentido lexical central e deixa aberta a possível nuance amorosa.
- source_word: חִבְּלַתְךָ
  choice: sentiu as dores do parto ao dar você à luz
  rationale: O verbo descreve as dores ou contorções do parto. A formulação explicita em português natural a relação com o complemento pronominal sem confundi-la com concepção.
- source_word: יְלָדַתְךָ
  choice: lhe deu à luz
  rationale: ילד indica dar à luz. A expressão é clara, digna e conserva a referência ao nascimento.
- source_word: שָׁמָּה ... שָׁמָּה
  choice: ali ... ali
  rationale: A repetição do advérbio é mantida para preservar a ênfase e o paralelismo poético hebraicos.
theological_decisions:
- issue: Mudança de voz e de destinatário na segunda metade do versículo
  choice: 'Manter a pergunta descritiva na terceira pessoa e, em seguida, a fala direta na segunda pessoa: «eu despertei você... sua mãe...»'
  alternative: Uniformizar todo o versículo como fala das observadoras ou identificar explicitamente a mulher como a falante da segunda metade.
  rationale: O hebraico passa de «seu amado» para formas de segunda pessoa, mas não identifica expressamente quem pronuncia a segunda parte. A tradução conserva a mudança poética sem impor uma identidade ao falante.
- issue: Possível nuance erótica de עוֹרַרְתִּיךָ
  choice: Traduzir por «despertei», registrando em nota a alternativa «provoquei» ou «excitei».
  alternative: Traduzir diretamente por «excitei».
  rationale: No contexto da poesia amorosa, uma nuance erótica é possível, porém não obrigatória. A escolha mantém a ambiguidade em vez de torná-la explícita no texto principal.
translation_notes:
  register: Português moderno, poético e acessível, com construção de ampla compreensão internacional e boa legibilidade brasileira. Emprega «você» para refletir com clareza o singular da segunda pessoa no hebraico. Preserva a repetição de «ali» e a mudança não identificada de falante.
