base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/012.yaml
  text: My vineyard[a], my very own, is before me. The thousand is for you, Solomon[b], and two hundred for those who keep its fruit.
translation:
  language: pt
  text: Minha vinha, que é só minha, está diante de mim.[a] Os mil[b] são para você, Salomão, e duzentos para os que guardam o fruto dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Está diante de mim” também pode sugerir “está sob meus cuidados” ou “está sob meu controle”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, mil peças de prata. O versículo anterior menciona “mil peças de prata”, mas este versículo diz apenas “os mil”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּרְמִי
  choice: Minha vinha
  rationale: כֶּרֶם significa normalmente “vinha” ou “vinhedo”. A imagem pode ter ressonância metafórica no Cântico, mas deve ser preservada, não explicitada no texto principal.
- source_word: שֶׁלִּי
  choice: que é só minha
  rationale: A repetição possessiva enfatiza que a vinha pertence à voz que fala. “Que é só minha” comunica essa ênfase com naturalidade em português.
- source_word: לְפָנַי
  choice: está diante de mim
  rationale: Mantém o sentido espacial literal e a ambiguidade poética, que no contexto também pode sugerir que a vinha está sob a posse, guarda ou controle de quem fala.
- source_word: הָאֶלֶף
  choice: Os mil
  rationale: O hebraico traz literalmente “os mil”, sem repetir nesta frase a unidade monetária mencionada no versículo anterior.
- source_word: לְךָ שְׁלֹמֹה
  choice: são para você, Salomão
  rationale: A preposição לְ indica destinação ou atribuição. “São para você” é corrente e preserva o discurso direto dirigido a Salomão.
- source_word: וּמָאתַיִם
  choice: e duzentos
  rationale: Reproduz o numeral sem acrescentar uma unidade monetária ausente neste versículo.
- source_word: לְנֹטְרִים
  choice: para os que guardam
  rationale: O particípio de נטר pode significar guardar, vigiar ou cuidar. “Os que guardam” preserva a ligação lexical com os guardas da vinha do versículo anterior.
- source_word: אֶת־פִּרְיוֹ
  choice: o fruto dela
  rationale: פְּרִי designa fruto ou produção. Em português, “dela” retoma com clareza “vinha” e evita a ambiguidade referencial de “seu fruto”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva a metáfora da vinha, a ênfase possessiva e a ambiguidade de לְפָנַי. A colocação dos marcadores foi ajustada para que [a] acompanhe “diante de mim” e [b] acompanhe “os mil”, em correspondência com o conteúdo efetivo das notas.
