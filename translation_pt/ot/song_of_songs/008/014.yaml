translation:
  language: pt
  text: Foge[a], meu amado[c], e sê como uma gazela ou como um jovem cervo[b] sobre os montes de especiarias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vai embora depressa”. O verbo hebraico significa literalmente “fugir” ou “ir embora correndo”, mas, neste contexto amoroso, provavelmente retrata movimento rápido, não uma fuga motivada por medo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a cria dos cervos”. A expressão hebraica refere-se literalmente a um animal jovem dos cervos ou veados.'
    reason: lexical_alternative
  - marker: c
    text: Compare Cântico dos Cânticos 2:17, que emprega imagem semelhante do amado como uma gazela ou um jovem cervo sobre os montes.
    reason: cross_reference
lexical_decisions:
- source_word: בְּרַח
  choice: Foge
  rationale: O imperativo de ברח significa literalmente “foge” ou “vai embora depressa”. “Foge” preserva de modo conciso a força e o movimento do hebraico; a nota esclarece que, nesta imagem amorosa, não é necessário entender uma fuga motivada por medo.
- source_word: דּוֹדִי
  choice: meu amado
  rationale: Em Cântico dos Cânticos, דּוֹדִי é a forma carinhosa com que a mulher se refere ao homem amado. “Meu amado” é natural, digna e mantém a especificidade relacional.
- source_word: וּדְמֵה לְךָ
  choice: e sê como
  rationale: A construção com דמה expressa semelhança. “Sê como” mantém o valor imperativo e o paralelismo poético de forma concisa.
- source_word: לִצְבִי
  choice: a gazela
  rationale: צְבִי designa uma gazela ou animal semelhante, conhecido pela graça e rapidez. “Gazela” é o equivalente moderno mais claro.
- source_word: אֹו לְעֹפֶר הָאַיָּלִים
  choice: ou como o jovem cervo
  rationale: עֹפֶר indica um animal jovem, e הָאַיָּלִים se refere a cervos. “Jovem cervo” conserva a imagem masculina que corresponde ao amado e evita uma formulação portuguesa artificialmente literal.
- source_word: עַל הָרֵי בְשָׂמִים
  choice: sobre os montes de aromas
  rationale: עַל indica posição ou movimento sobre os montes, enquanto בְשָׂמִים abrange especiarias, substâncias aromáticas e perfumes. “Montes de aromas” preserva a imagem poética sem restringi-la indevidamente a um produto específico.
