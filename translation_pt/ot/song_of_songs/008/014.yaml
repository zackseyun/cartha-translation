translation_notes:
  register: Português moderno, poético e amplamente compreensível, com boa legibilidade brasileira. O uso de “sê” mantém a forma imperativa singular e o tom lírico; “montes de aromas” conserva a evocação sensorial do hebraico sem especificação botânica indevida.
