base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/007.yaml
  text: Many waters cannot quench love[a], nor can rivers sweep it away. If a man were to give all the wealth of his house for love, he would be utterly despised.
translation:
  language: pt
  text: 'Muitas águas não podem apagar o amor,

    nem os rios podem arrastá-lo.

    Se um homem desse toda a riqueza de sua casa em troca do amor,

    certamente o desprezariam.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ele seria completamente desprezado”. O hebraico enfatiza fortemente o desprezo por meio de um infinitivo absoluto seguido de um verbo finito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם רַבִּים
  choice: Muitas águas
  rationale: Preserva a imagem poética e o idioma hebraico sem reduzi-lo a uma referência específica a enchentes.
- source_word: לֹא יוּכְלוּ לְכַבּוֹת
  choice: não podem apagar
  rationale: כבה indica apagar ou extinguir, especialmente fogo; “apagar” mantém o contraste com a imagem flamejante do amor em 8:6 e soa natural em português.
- source_word: הָאַהֲבָה
  choice: o amor
  rationale: O substantivo designa diretamente o amor; o artigo definido é natural em português para essa abstração personificada no poema.
- source_word: וּנְהָרוֹת לֹא יִשְׁטְפוּהָ
  choice: nem os rios podem arrastá-lo
  rationale: שטף pode indicar inundar, levar pela corrente ou arrastar; a formulação comunica a força destrutiva das águas e mantém o paralelismo negativo.
- source_word: אִם יִתֵּן אִישׁ
  choice: Se um homem desse
  rationale: O imperfeito na condição apresenta uma hipótese; “um homem” corresponde a אִישׁ sem generalizar silenciosamente o referente.
- source_word: כָּל הוֹן בֵּיתוֹ
  choice: toda a riqueza de sua casa
  rationale: הוֹן significa riqueza ou bens, e “casa” pode abranger a casa e o patrimônio familiar; a expressão conserva de perto a estrutura hebraica.
- source_word: בָּאַהֲבָה
  choice: em troca do amor
  rationale: Neste contexto, ב tem sentido transacional. A escolha explicita com naturalidade a tentativa de obter o amor mediante toda a riqueza.
- source_word: בּוֹז יָבֻזוּ לוֹ
  choice: certamente o desprezariam
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ação; “certamente” representa essa ênfase, e o sujeito indeterminado no plural preserva a forma ativa do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, poético e acessível, com paralelismo preservado. “Apagar” mantém a relação com o fogo do versículo anterior; “arrastá-lo” comunica a força das correntes. O texto principal conserva o plural ativo e indeterminado do hebraico, enquanto a nota registra a alternativa passiva idiomática.
