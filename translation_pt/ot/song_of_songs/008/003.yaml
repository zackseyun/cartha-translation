  yaml_path: translation/ot/song_of_songs/008/003.yaml
  text: His left hand is under my head[a], and his right hand embraces me.
translation:
  language: pt
  text: A mão esquerda dele está debaixo da minha cabeça,[a] e a direita me abraça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “a esquerda dele... e a direita dele”; “mão” é explicitado em português pelo sentido das expressões paralelas.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂמֹאלוֹ
  choice: a mão esquerda dele
  rationale: O substantivo designa o lado ou a mão esquerda. Em português, explicitar “mão” torna natural a imagem do abraço, sem recorrer à opção mais interpretativa “braço”.
- source_word: תַּחַת
  choice: debaixo de
  rationale: Equivalente direto e corrente da preposição hebraica, adequado à posição descrita.
- source_word: רֹאשִׁי
  choice: minha cabeça
  rationale: Tradução direta do substantivo com sufixo de primeira pessoa do singular.
- source_word: וִימִינוֹ
  choice: e a direita
  rationale: A construção paralela permite omitir “mão” na segunda expressão em português, recuperando-a naturalmente da primeira e preservando a concisão poética.
- source_word: תְּחַבְּקֵנִי
  choice: me abraça
  rationale: O verbo חבק significa “abraçar”. O presente expressa com naturalidade a cena vívida indicada pelo imperfeito hebraico.
