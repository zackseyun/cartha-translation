  text: שִׂימֵ֨/נִי כַֽ/חוֹתָ֜ם עַל לִבֶּ֗/ךָ כַּֽ/חוֹתָם֙ עַל זְרוֹעֶ֔/ךָ כִּֽי עַזָּ֤ה כַ/מָּ֨וֶת֙ אַהֲבָ֔ה קָשָׁ֥ה כִ/שְׁא֖וֹל קִנְאָ֑ה רְשָׁפֶ֕י/הָ רִשְׁפֵּ֕י אֵ֖שׁ שַׁלְהֶ֥בֶתְ יָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/006.yaml
  text: Set me as a seal upon your heart[a], as a seal upon your arm; for love is as strong as death, jealousy as relentless as Sheol. Its flashes are flashes of fire[c][b], a flame of Yah.
translation:
  language: pt
  text: Coloque-me como um selo sobre o seu coração, como um selo sobre o seu braço; pois o amor é forte como a morte, e o ciúme, inexorável como o Sheol.[a] Os fulgores do ciúme são fulgores de fogo[b], uma chama de Yah.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e o ciúme, duro como a sepultura”. “Sheol” é o termo hebraico para o domínio dos mortos e, em alguns contextos, pode ser entendido de modo mais geral como a sepultura.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “Suas centelhas são centelhas de fogo”.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “uma chama de Yah”. Yah é a forma breve do nome divino; a expressão também pode ser entendida como um intensivo: “uma chama poderosa” ou “uma chama ardente”.'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׂימֵנִי
  choice: Coloque-me
  rationale: Imperativo masculino singular com sufixo de primeira pessoa; expressa de modo direto e natural o pedido íntimo da voz poética.
- source_word: כַחוֹתָם
  choice: como um selo
  rationale: חוֹתָם designa selo ou sinete, associado a identidade, pertencimento e autenticação. “Selo” preserva a metáfora com linguagem acessível.
- source_word: עַל לִבֶּךָ
  choice: sobre o seu coração
  rationale: Mantém a localização metafórica e o paralelismo poético com “sobre o seu braço”.
- source_word: עַל זְרוֹעֶךָ
  choice: sobre o seu braço
  rationale: Tradução direta de זְרוֹעַ, preservando a imagem corporal paralela ao coração.
- source_word: כִּי עַזָּה כַמָּוֶת אַהֲבָה
  choice: pois o amor é forte como a morte
  rationale: עַזָּה comunica força ou poder. A formulação mantém a comparação contundente e soa natural em português.
- source_word: קָשָׁה כִשְׁאוֹל קִנְאָה
  choice: e o ciúme, inexorável como o Sheol
  rationale: קִנְאָה conserva o sentido de ciúme ou zelo exclusivo; “inexorável” exprime a dureza irresistível de קָשָׁה em relação ao Sheol sem introduzir a ideia potencialmente enganosa de crueldade.
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: Mantém o termo hebraico específico para o domínio dos mortos, evitando reduzi-lo apenas à sepultura física.
- source_word: רְשָׁפֶיהָ
  choice: Seus fulgores
  rationale: רֶשֶׁף pode indicar fulgor, centelha, chama ou projétil ardente. “Fulgores” preserva a imagem luminosa e intensa; o possessivo retoma poeticamente o amor e o ciúme.
- source_word: רִשְׁפֵּי אֵשׁ
  choice: são fulgores de fogo
  rationale: Repete “fulgores” como o hebraico repete רֶשֶׁף, conservando a ênfase e a estrutura poética.
- source_word: שַׁלְהֶבֶתְ יָה
  choice: uma chama de Yah
  rationale: Preserva יָה, forma breve do nome divino, sem eliminar a ambiguidade da expressão rara, que também pode funcionar como intensivo.
theological_decisions:
- issue: Se שַׁלְהֶבֶתְ יָה contém referência explícita ao nome divino ou funciona apenas como superlativo intensivo
  choice: 'Manter a referência explícita: “uma chama de Yah”'
  alternative: “uma chama poderosa” ou “uma chama ardente”
  rationale: O texto hebraico contém יָה, forma breve do nome divino. Mantê-la dá prioridade à evidência textual, enquanto a possível leitura intensiva é registrada em nota.
- issue: Se קִנְאָה deve ser suavizado para “paixão”, “ardor” ou “zelo” no contexto amoroso
  choice: ciúme
  alternative: paixão, ardor ou zelo
  rationale: “Ciúme” preserva o núcleo lexical de exclusividade e a tensão intensa do poema, sem harmonizá-lo com uma leitura romântica mais branda.
translation_notes:
  register: Português moderno, digno e poético, com ampla legibilidade brasileira. Preservam-se o paralelismo, a repetição e as imagens corporais do hebraico. “Sheol” e “Yah” mantêm a especificidade do texto-fonte, com esclarecimentos em notas.
