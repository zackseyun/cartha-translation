  text: אִם חוֹמָ֣ה הִ֔יא נִבְנֶ֥ה עָלֶ֖י/הָ טִ֣ירַת כָּ֑סֶף וְ/אִם דֶּ֣לֶת הִ֔יא נָצ֥וּר עָלֶ֖י/הָ ל֥וּחַ אָֽרֶז־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/009.yaml
  text: If she is a wall[a], we will build on her a battlement of silver; but if she is a door[b], we will enclose her with a board of cedar.
translation:
  language: pt
  text: Se ela for uma muralha, construiremos sobre ela uma torre de prata; mas, se for uma porta, nós a cercaremos com uma tábua de cedro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nós a fecharemos com uma prancha de cedro”. O verbo hebraico pode significar cercar, encerrar, sitiar ou resguardar; a ação pode ser entendida como proteção ou restrição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹמָה
  choice: muralha
  rationale: O substantivo indica um muro defensivo. “Muralha” preserva com naturalidade tanto a imagem arquitetônica quanto sua possível força metafórica, sem explicá-la.
- source_word: נִבְנֶה
  choice: construiremos
  rationale: O imperfeito qal na primeira pessoa do plural expressa adequadamente a ação futura prevista pela condição.
- source_word: טִירַת כָּסֶף
  choice: uma torre de prata
  rationale: טִירָה pode designar uma estrutura fortificada ou semelhante a uma torre. “Torre” é clara em português e mantém a relação arquitetônica com “muralha”; “fortificação” também é possível.
- source_word: דֶּלֶת
  choice: porta
  rationale: É o sentido comum do substantivo e conserva a imagem concreta e o contraste com “muralha”.
- source_word: נָצוּר
  choice: nós a cercaremos
  rationale: O verbo pode ter o sentido de cercar, encerrar, sitiar ou resguardar. “Cercaremos” conserva essa amplitude melhor do que uma formulação que determine se a ação é exclusivamente protetora ou restritiva.
- source_word: לוּחַ אָרֶז
  choice: uma tábua de cedro
  rationale: לוּחַ designa uma peça plana de madeira, como tábua ou prancha. “Tábua de cedro” é concreta, corrente e fiel ao material indicado.
- source_word: עָלֶיהָ
  choice: sobre ela / a
  rationale: Na primeira oração, “sobre ela” mantém diretamente a preposição e a imagem de construir sobre a muralha. Na segunda, o pronome objeto em “a cercaremos” produz português natural, enquanto “com uma tábua” expressa o meio empregado.
- source_word: וְאִם
  choice: mas, se
  rationale: Embora וְ seja literalmente aditivo, aqui introduz a condição contrastante paralela; “mas, se” torna o contraste claro em português.
theological_decisions:
- issue: Sentido metafórico de “muralha” e “porta”
  choice: Manter as imagens sem explicitar castidade, firmeza, receptividade ou vulnerabilidade
  alternative: Interpretar diretamente as imagens como comportamento sexual ou proteção familiar
  rationale: O verso não declara explicitamente a aplicação das metáforas. Preservá-las mantém a ambiguidade poética e evita impor uma interpretação teológica ou moral específica.
- issue: Finalidade de cercar a porta
  choice: Usar o verbo semanticamente amplo “cercar”
  alternative: Traduzir como “proteger”, “fechar” ou “barricar”
  rationale: O hebraico admite nuances de encerrar, sitiar ou guardar. A escolha evita resolver se a ação é honorífica, protetora ou restritiva.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara. “Muralha”, “torre”, “porta” e “tábua de cedro” preservam o paralelismo arquitetônico e a ambiguidade poética. O marcador [a] aparece no texto principal e corresponde à nota.
