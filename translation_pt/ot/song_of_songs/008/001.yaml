base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/001.yaml
  text: Oh[a], that you were like a brother to me, who nursed at my mother’s breasts! If I found you outside, I would kiss you[c][b], and no one would despise me.
translation:
  language: pt
  text: Quem dera[a] que você fosse como um irmão para mim, que mamou nos seios de minha mãe![b] Se eu encontrasse você lá fora, eu beijaria você, e ninguém me desprezaria.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ah, se você fosse como um irmão para mim”. A expressão hebraica inicial comunica um desejo.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, como um irmão que tivesse sido amamentado pela mesma mãe, tornando socialmente aceitável uma demonstração pública de afeto.
    reason: cultural_note
  - marker: c
    text: 'Hebraico, literalmente: “e eles não me desprezariam”; o plural indefinido se refere à desaprovação das pessoas em geral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֶּנְךָ
  choice: Quem dera que você fosse
  rationale: A expressão idiomática hebraica introduz um desejo, não uma pergunta literal sobre quem daria o amado. “Quem dera” comunica naturalmente esse valor optativo.
- source_word: כְּאָח לִי
  choice: como um irmão para mim
  rationale: כְּ indica comparação, não identidade. A formulação preserva tanto a figura de comparação quanto a relação pessoal expressa por לִי.
- source_word: יוֹנֵק שְׁדֵי אִמִּי
  choice: que mamou aos seios de minha mãe
  rationale: O particípio יוֹנֵק descreve alguém que mamou. A tradução mantém a imagem materna concreta e soa natural em português.
- source_word: אֶמְצָאֲךָ בַחוּץ
  choice: Se eu encontrasse você lá fora
  rationale: O contexto desejoso favorece uma construção hipotética. “Lá fora” conserva o sentido amplo de um espaço exterior e público sem especificar indevidamente uma rua.
- source_word: אֶשָׁקְךָ
  choice: eu beijaria você
  rationale: O condicional acompanha a hipótese da oração anterior, e a ordem escolhida é clara e natural para leitores brasileiros sem perder inteligibilidade internacional.
- source_word: גַּם לֹא יָבֻזוּ לִי
  choice: e ninguém me desprezaria
  rationale: A terceira pessoa do plural funciona de modo indefinido, indicando a desaprovação pública em geral. “Ninguém” expressa esse sentido idiomaticamente em português.
theological_decisions:
- issue: Imagem fraternal dentro da poesia amorosa
  choice: Manter a comparação com um irmão como expressão de uma condição social imaginada, sem afirmar parentesco literal
  alternative: Suprimir ou reformular a imagem fraternal para evitar seu aparente desconforto
  rationale: O texto deseja que o amado fosse socialmente comparável a um irmão que recebeu o mesmo aleitamento, pois assim uma demonstração pública de afeto não provocaria desprezo. A tradução conserva a tensão e a imagem do hebraico sem acrescentar inferências morais ou doutrinárias.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Você” evita a oscilação regional de formas de segunda pessoa; “mamou aos seios” preserva a concretude poética sem soar clínico, e “lá fora” mantém o cenário público sem estreitá-lo a uma rua específica.
