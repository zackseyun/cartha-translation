base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/005.yaml
  text: Turn your eyes away from me[a], for they overwhelm me[b]. Your hair is like a flock of goats streaming down from Gilead.
translation:
  language: pt
  text: Desvia de mim os teus olhos, pois eles me dominam[a]. Teu cabelo é como um rebanho de cabras que descem de Gileade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “eles me desconcertam” ou “eles me subjugam”. O verbo hebraico é raro, e sua nuance neste contexto é discutida.
    reason: lexical_alternative
  - marker: b
    text: Ou “que fluem de Gileade” ou “que descem pelas encostas de Gileade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָסֵבִּי
  choice: Desvia
  rationale: O imperativo feminino singular pede que a mulher afaste ou desvie os olhos. “Desvia” mantém a força direta do hebraico e soa natural em português.
- source_word: עֵינַיִךְ מִנֶּגְדִּי
  choice: de mim os teus olhos
  rationale: A construção com מִן e נֶגֶד indica afastamento da posição diante do falante. A formulação preserva a imagem concreta dos olhos e a relação direta entre os amantes.
- source_word: שֶׁהֵם הִרְהִיבֻנִי
  choice: pois eles me dominam
  rationale: O verbo רהב é raro e sua nuance aqui é discutida. No contexto amoroso, comunica que o olhar dela exerce sobre ele uma força perturbadora ou irresistível. “Me dominam” expressa essa intensidade sem definir além do necessário se o efeito é emocional, intimidador ou arrebatador.
- source_word: שַׂעְרֵךְ
  choice: Teu cabelo
  rationale: Tradução direta do substantivo com sufixo possessivo, introduzindo a comparação poética.
- source_word: כְּעֵדֶר הָעִזִּים
  choice: como um rebanho de cabras
  rationale: עֵדֶר designa um grupo de animais de pastoreio. “Rebanho de cabras” é claro, corrente e preserva a imagem pastoril.
- source_word: שֶׁגָּלְשׁוּ
  choice: que descem
  rationale: גלשׁ descreve movimento para baixo, possivelmente com a sugestão visual de deslizar ou fluir. “Descem” preserva o sentido básico sem acrescentar ao texto uma localização topográfica explícita.
- source_word: מִן הַגִּלְעָד
  choice: de Gileade
  rationale: O hebraico traz literalmente “de Gileade”. Mantém-se o nome regional sem inserir “monte” ou “encostas”, elementos apenas implícitos na imagem.
