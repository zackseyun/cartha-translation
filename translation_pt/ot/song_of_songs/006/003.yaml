  text: I am my beloved's[a], and my beloved is mine, who grazes among the lilies.
translation:
  language: pt
  text: Eu sou do meu amado, e o meu amado é meu; ele pastoreia[a] entre os lírios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ele se alimenta entre os lírios”. O particípio hebraico pode significar pastorear, apascentar ou alimentar-se.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי לְדוֹדִי
  choice: Eu sou do meu amado
  rationale: A construção com ל expressa pertencimento. “Sou do meu amado” reproduz de modo natural em português a afirmação de entrega e pertença, sem acrescentar interpretação alegórica.
- source_word: וְדוֹדִי לִי
  choice: e o meu amado é meu
  rationale: A oração nominal hebraica pede a cópula em português. A formulação mantém o paralelismo e a reciprocidade poética do primeiro segmento.
- source_word: הָרֹעֶה
  choice: ele pastoreia
  rationale: O particípio Qal de רעה pode descrever pastorear, apascentar ou alimentar-se. “Pastoreia” preserva a imagem pastoril sem inserir um objeto, como “o rebanho”, que não aparece no hebraico.
- source_word: בַּשׁוֹשַׁנִּים
  choice: entre os lírios
  rationale: A preposição ב indica aqui localização no meio de algo, e שׁוֹשַׁנִּים mantém a imagem floral recorrente do Cântico, tradicional e plausivelmente traduzida por “lírios”.
theological_decisions:
- issue: Linguagem relacional no Cântico
  choice: Manter a linguagem poética de pertença mútua entre os amantes, sem expansão alegórica.
  alternative: Identificar na própria tradução o amado com Deus ou com o Messias.
  rationale: O hebraico apresenta diretamente a reciprocidade amorosa. Leituras alegóricas posteriores não devem ser incorporadas ao texto traduzido.
- issue: Ambiguidade da imagem pastoril
  choice: Usar “pastoreia” no texto e registrar em nota a possibilidade de “se alimenta”.
  alternative: Explicitar “apascenta o seu rebanho” ou escolher apenas a imagem de alimentar-se.
  rationale: O particípio hebraico admite mais de um matiz, e o original não declara um objeto. A tradução e a nota preservam essa abertura lexical.
translation_notes:
  register: Português moderno, poético e amplamente compreensível, com boa legibilidade brasileira. O ponto e vírgula destaca a passagem da declaração recíproca para a imagem pastoril sem romper a unidade do verso.
