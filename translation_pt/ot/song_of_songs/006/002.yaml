base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/002.yaml
  text: My beloved has gone down to his garden[a], to the beds of spices[b], to graze in the gardens and to gather lilies.
translation:
  language: pt
  text: O meu amado desceu ao seu jardim, aos canteiros de plantas aromáticas, para pastar[a] nos jardins e colher lírios.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “apascentar” ou “alimentar”. O verbo hebraico pode indicar pastar ou dar pasto e talvez preserve intencionalmente a ambiguidade pastoril.
    reason: lexical_alternative
  - marker: b
    text: A espécie exata da flor indicada pelo termo hebraico é incerta; tradicionalmente, “lírios”.
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹדִי
  choice: O meu amado
  rationale: No Cântico dos Cânticos, דּוֹדִי designa habitualmente o homem amado pela mulher. “O meu amado” é afetuoso, natural e evita as possíveis conotações mais estreitas de “meu amante”.
- source_word: יָרַד
  choice: desceu
  rationale: O qatal apresenta a ação como concluída, e “desceu” conserva de modo claro e idiomático o movimento descendente de ירד.
- source_word: לְגַנּוֹ
  choice: ao seu jardim
  rationale: A preposição ל indica direção; “ao seu jardim” mantém esse sentido e soa natural em português.
- source_word: לַעֲרוּגוֹת הַבֹּשֶׂם
  choice: aos canteiros de plantas aromáticas
  rationale: עֲרוּגוֹת são canteiros ou parcelas cultivadas, enquanto בֹּשֶׂם se refere a especiarias, bálsamo ou substâncias aromáticas. A formulação preserva tanto a imagem hortícola quanto a fragrância sem exigir uma identificação botânica específica.
- source_word: לִרְעוֹת
  choice: para pastorear
  rationale: רעה pode significar pastar, apascentar, alimentar ou conduzir ao pasto. “Pastorear” conserva a imagem pastoril e, sem objeto explícito, evita acrescentar ao texto um rebanho não mencionado.
- source_word: בַּגַּנִּים
  choice: nos jardins
  rationale: Mantém a preposição ב e o plural do hebraico, sem harmonizá-lo com o jardim singular da frase anterior.
- source_word: וְלִלְקֹט
  choice: e colher
  rationale: לקט significa recolher, juntar ou colher. “Colher” é a opção mais natural para flores neste contexto.
- source_word: שׁוֹשַׁנִּים
  choice: lírios
  rationale: “Lírios” é a tradução tradicional e amplamente reconhecida, embora a espécie exata da flor hebraica permaneça incerta.
