  text: Há sessenta rainhas, oitenta concubinas e jovens mulheres sem número.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁשִּׁים
  choice: sessenta
  rationale: Número cardinal traduzido diretamente.
- source_word: הֵמָּה
  choice: Há
  rationale: A construção existencial é natural em português para introduzir a enumeração e comunica o valor enfático do pronome independente sem produzir uma formulação rígida.
- source_word: מְּלָכוֹת
  choice: rainhas
  rationale: Plural de 'rainha'; é a designação natural no contexto régio.
- source_word: וּשְׁמֹנִים
  choice: oitenta
  rationale: Número cardinal coordenado; a conjunção é expressa de modo natural na enumeração portuguesa.
- source_word: פִּילַגְשִׁים
  choice: concubinas
  rationale: Termo português preciso e consagrado para mulheres reconhecidas em uma união de posição inferior à das esposas ou rainhas.
- source_word: וַעֲלָמוֹת
  choice: e jovens mulheres
  rationale: עֲלָמוֹת designa amplamente mulheres jovens em idade de casar; a escolha evita restringir indevidamente o termo a 'virgens'.
- source_word: אֵין מִסְפָּר
  choice: sem número
  rationale: Expressão poética e idiomática que conserva a ideia de uma quantidade incontável.
