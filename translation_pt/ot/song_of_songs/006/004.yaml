  text: יָפָ֨ה אַ֤תְּ רַעְיָתִ/י֙ כְּ/תִרְצָ֔ה נָאוָ֖ה כִּ/ירוּשָׁלִָ֑ם אֲיֻמָּ֖ה כַּ/נִּדְגָּלֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/004.yaml
  text: You are beautiful[a], my love, like Tirzah, lovely like Jerusalem, awe-inspiring as bannered armies.
translation:
  language: pt
  text: 'Você é bela, meu amor, como Tirza,

    encantadora como Jerusalém,

    imponente como tropas sob bandeiras.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “temível como tropas com bandeiras”. A imagem hebraica é de formações militares organizadas sob estandartes e ressalta um esplendor que causa assombro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָפָה
  choice: bela
  rationale: Adjetivo predicativo que elogia diretamente a beleza da mulher; “bela” é natural, digna e concisa em português.
- source_word: רַעְיָתִי
  choice: meu amor
  rationale: Expressão afetuosa recorrente no Cântico; “meu amor” comunica intimidade romântica com naturalidade, sem a rigidez de “minha companheira”.
- source_word: כְּתִרְצָה
  choice: como Tirza
  rationale: A preposição כְּ introduz comparação. Conserva-se o nome geográfico Tirza sem explicitar no texto associações que o hebraico deixa implícitas.
- source_word: נָאוָה
  choice: encantadora
  rationale: Mantém a variação poética em relação a יָפָה e expressa beleza agradável e atraente sem recorrer ao pouco corrente “formosa”.
- source_word: כִּירוּשָׁלִָם
  choice: como Jerusalém
  rationale: Preserva com clareza o paralelismo comparativo e emprega a forma portuguesa convencional do nome da cidade.
- source_word: אֲיֻמָּה
  choice: imponente
  rationale: O termo descreve algo que inspira temor ou assombro. “Imponente” se ajusta ao elogio amoroso e conserva a ideia de presença avassaladora, enquanto a nota registra a leitura mais forte “temível”.
- source_word: כַּנִּדְגָּלוֹת
  choice: como tropas sob bandeiras
  rationale: A forma evoca grupos organizados em torno de estandartes. “Tropas sob bandeiras” preserva a imagem militar, a ordem e o esplendor visual sem acrescentar explicitamente “exércitos”, ausente como substantivo no hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, poético e amplamente compreensível, com boa legibilidade brasileira. Os três elogios foram dispostos em linhas paralelas para refletir a cadência do hebraico. “Tirza” segue a forma tradicional em português; “Jerusalém”, a forma consagrada. A tradução evita linguagem arcaica e conserva a tensão entre beleza e temor na imagem militar final.
