  text: Your cheeks are like a slice of pomegranate behind your veil[a].
translation:
  language: pt
  text: Como um gomo de romã são as suas têmporas, por trás do seu véu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por trás das suas mechas” ou “através dos seus cabelos”, caso לְצַמָּתֵךְ se refira aos cabelos, e não a um véu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּפֶלַח
  choice: Como um gomo
  rationale: O prefixo כְּ marca comparação, e פֶלַח designa uma parte ou segmento separado. “Gomo” é natural em português para uma seção de fruta e preserva a imagem poética.
- source_word: הָרִמּוֹן
  choice: de romã
  rationale: O substantivo significa “romã”. Em português, a construção idiomática dispensa a reprodução literal do artigo hebraico.
- source_word: רַקָּתֵךְ
  choice: as suas têmporas
  rationale: רַקָּה designa primariamente a têmpora, a lateral da cabeça. O plural é natural em português e evita ampliar o referente para as bochechas sem necessidade.
- source_word: מִבַּעַד
  choice: por trás
  rationale: A expressão indica que algo é visto por detrás ou através de uma cobertura interveniente. “Por trás” combina naturalmente com “véu” e mantém a ideia de ocultação parcial.
- source_word: לְצַמָּתֵךְ
  choice: do seu véu
  rationale: Neste contexto, o termo é frequentemente entendido como véu ou cobertura, embora sua referência a cabelos ou mechas seja lexicalmente possível; a alternativa é preservada em nota.
