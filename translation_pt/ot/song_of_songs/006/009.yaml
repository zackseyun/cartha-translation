  text: אַחַ֥ת הִיא֙ יוֹנָתִ֣/י תַמָּתִ֔/י אַחַ֥ת הִיא֙ לְ/אִמָּ֔/הּ בָּרָ֥ה הִ֖יא לְ/יֽוֹלַדְתָּ֑/הּ רָא֤וּ/הָ בָנוֹת֙ וַֽ/יְאַשְּׁר֔וּ/הָ מְלָכ֥וֹת וּ/פִֽילַגְשִׁ֖ים וַֽ/יְהַלְלֽוּ/הָ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/009.yaml
  text: My dove[a], my flawless one, is the only one; she is the only one of her mother, pure to the one who bore her. Daughters saw her and called her blessed[c][b]; queens and concubines also praised her.
translation:
  language: pt
  text: 'Minha pomba, minha perfeita[a], ela é a única;

    é a única de sua mãe,

    a preferida[b] daquela que a deu à luz.


    As moças[c] a viram e a chamaram feliz;

    rainhas e concubinas a elogiaram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “minha íntegra” ou “minha sem defeito”. O termo hebraico pode expressar inteireza, perfeição ou ausência de culpa.
    reason: lexical_alternative
  - marker: b
    text: Ou “pura” ou “radiante”. O adjetivo hebraico pode destacar pureza, brilho ou qualidade excepcional.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “filhas”; no idioma poético do Cântico, a palavra pode referir-se de modo mais amplo a jovens mulheres.
    reason: cultural_note
lexical_decisions:
- source_word: יוֹנָתִי
  choice: minha pomba
  rationale: Mantém literalmente a imagem poética da pomba, usada no Cântico como expressão de carinho e beleza, sem reduzi-la a um termo afetivo genérico.
- source_word: תַמָּתִי
  choice: minha perfeita
  rationale: O termo comunica inteireza, completude ou ausência de defeito. “Perfeita” é natural no contexto amoroso e evita a conotação predominantemente moral de “irrepreensível”.
- source_word: אַחַת הִיא
  choice: é única
  rationale: A repetição enfatiza singularidade e exclusividade, mais do que simples valor numérico.
- source_word: לְאִמָּהּ
  choice: de sua mãe
  rationale: Expressa a relação singular dela com a mãe. A formulação preserva o paralelismo poético, embora possa sugerir tanto filha única quanto filha singularmente estimada.
- source_word: בָּרָה
  choice: a preferida
  rationale: O adjetivo pode indicar pureza, brilho ou qualidade excepcional. No paralelismo sobre sua relação com a mãe que a gerou, “preferida” comunica de modo natural a ideia de alguém distinta ou escolhida, sem ocultar as alternativas em nota.
- source_word: לְיוֹלַדְתָּהּ
  choice: daquela que a deu à luz
  rationale: Reproduz o particípio hebraico referente à mulher que a gerou, sem substituir a expressão poética pela simples repetição de “mãe”.
- source_word: בָנוֹת
  choice: jovens
  rationale: Embora signifique literalmente “filhas”, no idioma poético do livro o substantivo pode designar jovens mulheres. “Jovens” é claro e natural em português.
- source_word: וַיְאַשְּׁרוּהָ
  choice: a chamaram feliz
  rationale: O piel de אשר significa declarar alguém feliz ou afortunado. “Chamaram feliz” conserva o valor avaliativo sem introduzir necessariamente uma fórmula religiosa.
- source_word: מְלָכוֹת וּפִילַגְשִׁים
  choice: rainhas e concubinas
  rationale: Tradução direta dos dois grupos femininos mencionados no texto.
- source_word: וַיְהַלְלוּהָ
  choice: a elogiaram
  rationale: Expressa com linguagem corrente o sentido de louvar ou exaltar alguém.
theological_decisions: []
translation_notes:
  register: Português moderno, poético e acessível, com paralelismo em linhas. A repetição de “única” preserva a ênfase do hebraico. “Concubinas” é mantido por precisão histórica, e as ambiguidades de תַמָּתִי e בָּרָה são registradas em notas.
