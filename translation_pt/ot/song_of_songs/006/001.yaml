  yaml_path: translation/ot/song_of_songs/006/001.yaml
  text: Where has your beloved gone[a], most beautiful among women? Where has your beloved turned, that we may seek him with you?
translation:
  language: pt
  text: Para onde foi o seu amado, ó mais bela entre as mulheres? Para onde se voltou o seu amado[a], para que o procuremos com você?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Para onde se desviou o seu amado?» O verbo pode sugerir mudança de direção ou afastamento, não apenas deslocamento físico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָ֚נָה
  choice: Para onde
  rationale: O advérbio interrogativo pergunta pelo destino ou direção; «para onde» é natural em português e preserva esse valor direcional.
- source_word: הָלַ֣ךְ
  choice: foi
  rationale: O qal perfeito de הלך indica que o amado partiu; no português corrente, «foi» expressa com naturalidade a ação concluída ligada ao seu paradeiro atual.
- source_word: דּוֹדֵ֔ךְ
  choice: seu amado
  rationale: No Cântico, דּוֹד designa o homem amado em sentido afetivo e romântico; «amado» mantém o registro poético sem enfraquecer nem ampliar a sensualidade.
- source_word: הַ/יָּפָ֖ה בַּ/נָּשִׁ֑ים
  choice: ó mais bela entre as mulheres
  rationale: A expressão funciona como vocativo e como superlativo idiomático. «Ó» torna clara a interpelação, e «mais bela entre as mulheres» comunica o sentido em linguagem poética atual.
- source_word: פָּנָ֣ה
  choice: se voltou
  rationale: O qal perfeito de פנה significa literalmente «voltou-se» e, neste contexto, pergunta que direção ele tomou, preservando a imagem e o paralelismo com a primeira pergunta.
- source_word: וּ/נְבַקְשֶׁ֖/נּוּ
  choice: para que o procuremos
  rationale: A forma de primeira pessoa do plural, neste contexto, expressa a finalidade da pergunta e a intenção de participar da busca.
- source_word: עִמָּֽ/ךְ
  choice: com você
  rationale: A preposição com sufixo feminino singular indica acompanhamento; «com você» é claro e amplamente compreensível em português moderno.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e poético, com ampla legibilidade brasileira. O paralelismo das duas perguntas foi preservado, assim como a distinção lexical entre «foi» e «se voltou». O marcador [a] está ligado à primeira pergunta, conforme a nota lexical fornecida.
