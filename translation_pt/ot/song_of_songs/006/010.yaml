  source_fidelity: 'O texto preserva bem a pergunta retórica feminina de מִי זֹאת e a sequência de imagens: aurora, lua, sol e exércitos identificados por estandartes. “Surge” é uma opção contextual defensável para הַנִּשְׁקָפָה, cuja nuance visual alternativa é devidamente registrada. “Brilhante” corresponde adequadamente a בָּרָה no paralelismo luminoso, sem excluir em nota os sentidos “pura” e “límpida”. “Imponente” comunica de modo aceitável a força de אֲיֻמָּה, embora esta também contenha a ideia de assombro ou temor.'
