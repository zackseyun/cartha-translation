  register: Português moderno, poético e amplamente compreensível, com boa legibilidade brasileira. A cadência paralela das três comparações foi preservada. As ambiguidades relevantes de הַנִּשְׁקָפָה, בָּרָה e כַּנִּדְגָּלוֹת são registradas em notas sem sobrecarregar o texto principal.
