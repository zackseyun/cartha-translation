  text: מִי זֹ֥את הַ/נִּשְׁקָפָ֖ה כְּמוֹ שָׁ֑חַר יָפָ֣ה כַ/לְּבָנָ֗ה בָּרָה֙ כַּֽ/חַמָּ֔ה אֲיֻמָּ֖ה כַּ/נִּדְגָּלֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/010.yaml
  text: Who is this who looks forth like the dawn[a], beautiful as the moon, bright as the sun[c][b], awe-inspiring as bannered armies?
translation:
  language: pt
  text: Quem é esta que surge como a aurora,[a] bela como a lua, brilhante como o sol,[b] imponente como exércitos com seus estandartes?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que olha do alto como a aurora”.'
    reason: lexical_alternative
  - marker: b
    text: O adjetivo hebraico traduzido por “brilhante” também pode significar “pura” ou “límpida”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “imponente como hostes sob estandartes”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֹאת
  choice: Quem é esta
  rationale: Mantém de modo natural a pergunta retórica e o demonstrativo feminino do hebraico, deixando claro que a referência é à mulher.
- source_word: הַנִּשְׁקָפָה
  choice: que surge
  rationale: O particípio de שׁקף pode sugerir olhar de um ponto elevado ou aparecer. No contexto da aurora, “surge” produz uma imagem natural em português sem eliminar a alternativa visual, registrada em nota.
- source_word: כְּמוֹ שָׁחַר
  choice: como a aurora
  rationale: שַׁחַר designa a aurora ou o romper do dia; “aurora” é conciso, claro e poético.
- source_word: יָפָה
  choice: bela
  rationale: Expressa diretamente a beleza e preserva o registro poético com linguagem atual.
- source_word: כַלְּבָנָה
  choice: como a lua
  rationale: Reproduz com simplicidade a comparação celestial do hebraico.
- source_word: בָּרָה
  choice: brilhante
  rationale: O adjetivo pode significar pura, límpida ou brilhante. A imagem do sol favorece o sentido luminoso, enquanto a amplitude lexical é preservada em nota.
- source_word: כַחַמָּה
  choice: como o sol
  rationale: Equivalente direto e natural da comparação hebraica.
- source_word: אֲיֻמָּה
  choice: imponente
  rationale: Comunica uma presença que inspira assombro e temor reverente sem a conotação exclusivamente negativa que “terrível” costuma ter no português atual.
- source_word: כַנִּדְגָּלוֹת
  choice: como exércitos com seus estandartes
  rationale: Preserva a metáfora militar ligada a grupos ou hostes identificados por estandartes. A formulação é clara e digna em português contemporâneo.
theological_decisions: []
