  text: Your teeth are like a flock of ewes that have come up from the washing[a], all of them bearing twins[b], and none among them has lost her young.
translation:
  language: pt
  text: Seus dentes são como um rebanho de ovelhas que subiram da lavagem; todas dão à luz gêmeos[a], e nenhuma delas está privada de crias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todas estão emparelhadas”. A imagem provavelmente indica que cada dente tem seu correspondente.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente, “e nenhuma entre elas é enlutada” ou “está privada de crias”. A metáfora sugere completude: nenhum dente está sem o seu par.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁנַּיִךְ
  choice: Seus dentes
  rationale: Reproduz diretamente o plural com sufixo possessivo feminino singular, em formulação natural em português.
- source_word: כְּעֵדֶר הָרְחֵלִים
  choice: como um rebanho de ovelhas
  rationale: רְחֵלִים designa especificamente fêmeas ovinas; “ovelhas” preserva essa precisão e permite que as referências posteriores a gêmeos e crias permaneçam naturais.
- source_word: שֶׁעָלוּ מִן הָרַחְצָה
  choice: que acabam de subir do banho
  rationale: A imagem é de ovelhas que sobem após a lavagem. “Acabam de” comunica naturalmente o resultado recente sugerido pela cena, enquanto “do banho” mantém a imagem concreta e a alvura implícita.
- source_word: שֶׁכֻּלָּם מַתְאִימוֹת
  choice: todas têm gêmeos
  rationale: O termo derivado de תאם pode retratar as ovelhas como produtoras de pares/gêmeos e, no plano da comparação, os dentes como perfeitamente emparelhados. A redação conserva a metáfora pastoril sem apagar sua implicação.
- source_word: וְשַׁכֻּלָה אֵין בָּהֶם
  choice: e nenhuma delas perdeu suas crias
  rationale: שַׁכֻּלָה significa literalmente “privada de filhos/crias, enlutada”. A formulação mantém a metáfora das ovelhas e sugere, em relação aos dentes, que nenhum está faltando.
