  text: Before I knew it[b][a], my soul set me among the chariots of my noble people.
translation:
  language: pt
  text: Antes que eu percebesse, minha alma me pôs entre os carros do meu povo nobre.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico é difícil. “Minha alma” também pode ser entendido como “meu próprio ser”, “meu coração” ou “meu desejo”; a frase ainda pode ser traduzida: “fez de mim como os carros do meu povo principesco”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão final também pode ser entendida como “os carros de Ammi-Nadib”, tomando as palavras hebraicas como nome próprio.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יָדַעְתִּי
  choice: Antes que eu percebesse
  rationale: Embora a expressão signifique literalmente “eu não sabia”, neste contexto poético ela comunica que algo aconteceu de modo súbito ou sem que a pessoa se desse conta.
- source_word: נַפְשִׁי
  choice: minha alma
  rationale: Preserva de modo conciso a amplitude poética de נֶפֶשׁ, que também pode indicar o próprio ser, o íntimo ou o desejo; a ambiguidade é registrada em nota.
- source_word: שָׂמַתְנִי
  choice: me pôs entre
  rationale: Reproduz o sentido básico de שׂוּם, “pôr, colocar”, sem transformar a construção incerta numa comparação explícita.
- source_word: מַרְכְּבוֹת
  choice: os carros
  rationale: “Carros” é a designação bíblica natural em português para veículos de guerra ou cerimoniais puxados por cavalos.
- source_word: עַמִּי נָדִיב
  choice: do meu povo nobre
  rationale: Entende עַמִּי como “meu povo” e נָדִיב como qualificativo, “nobre”; a sintaxe difícil e a possível leitura como nome próprio são preservadas em nota.
