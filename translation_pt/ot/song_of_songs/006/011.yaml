base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/011.yaml
  text: I went down to the walnut grove to look at the shoots in the valley[a], to see whether the vine had budded[c][b], whether the pomegranates had blossomed.
translation:
  language: pt
  text: Desci ao jardim de nogueiras[a] para ver os brotos no vale[b], para ver se a videira havia brotado[c] e se as romãzeiras haviam florescido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bosque de nogueiras” ou “pomar de nogueiras”. O hebraico provavelmente se refere a uma plantação de nogueiras ou de outras árvores de frutos de casca rija.
    reason: lexical_alternative
  - marker: b
    text: “Vale” traduz um termo hebraico que também pode designar uma ravina, um uádi ou o leito de uma torrente.
    reason: lexical_alternative
  - marker: c
    text: Ou “havia florescido”. O verbo hebraico pode se referir tanto ao brotar como ao florescer.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּנַּת אֱגוֹז
  choice: bosque de nogueiras
  rationale: גִּנָּה designa um jardim ou plantação, e אֱגוֹז, uma nogueira ou árvore de frutos de casca rija. “Bosque de nogueiras” é natural, mantém o cenário cultivado e evita o pouco idiomático “jardim de nozes”.
- source_word: יָרַדְתִּי
  choice: Desci
  rationale: Preserva de modo conciso e natural o sentido direcional de ירד.
- source_word: לִרְאוֹת
  choice: para ver / para ver se
  rationale: As duas ocorrências mantêm a ideia de observação; na segunda, a construção interrogativa hebraica pede naturalmente “para ver se” em português.
- source_word: בְּאִבֵּי הַנָּחַל
  choice: os brotos no vale
  rationale: אִבִּים refere-se ao crescimento novo ou aos brotos, enquanto נַחַל pode indicar vale, ravina, leito de torrente ou uádi. A tradução é clara e preserva a imagem vegetal, com a amplitude geográfica indicada em nota.
- source_word: הֲפָרְחָה הַגֶּפֶן
  choice: se a videira havia brotado
  rationale: פרח pode expressar brotar ou florescer. “Havia brotado” preserva uma distinção lexical em relação ao verbo seguinte, usado para a floração das romãzeiras.
- source_word: הֵנֵצוּ הָרִמֹּנִים
  choice: se as romãzeiras estavam floridas
  rationale: נוץ descreve o surgimento das flores. “Romãzeiras” explicita naturalmente em português que se trata das árvores, sem alterar a imagem.
