base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/013.yaml
  text: Let us rise early for the vineyards[a]; let us see whether the vine has budded, whether the blossom has opened, whether the pomegranates are in bloom[c][b]. There I will give you my love.
translation:
  language: pt
  text: Levantemo-nos cedo e vamos aos vinhedos[a]; vejamos se a videira brotou[b], se a flor da videira se abriu, se as romãzeiras estão floridas. Ali lhe darei o meu amor[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «partamos cedo para os vinhedos». O verbo pode incluir a ideia de levantar-se cedo ou de sair cedo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «se a videira floresceu». O verbo hebraico pode referir-se tanto ao brotar como ao florescer; «brotou» conserva a possível progressão até a abertura da flor na frase seguinte.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: «meus amores», provavelmente uma expressão intensiva ou coletiva que pode significar «meu amor» ou «minhas carícias».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַשְׁכִּימָה
  choice: Levantemo-nos cedo
  rationale: O hifil cohortativo na primeira pessoa do plural expressa um convite compartilhado e inclui a ideia de levantar-se ou partir cedo.
- source_word: לַכְּרָמִים
  choice: e vamos aos vinhedos
  rationale: A preposição ל indica naturalmente direção. A explicitação de «vamos» produz português corrente depois de «levantemo-nos cedo» sem alterar o destino indicado no hebraico.
- source_word: נִרְאֶה
  choice: vejamos
  rationale: O cohortativo de ראה tem força volitiva; «vejamos» preserva de modo conciso o convite à observação.
- source_word: אִם
  choice: se
  rationale: Neste contexto, אִם introduz perguntas indiretas. Em português, «se» é a formulação natural, sem exigir a repetição de «será que».
- source_word: פָּרְחָה הַגֶּפֶן
  choice: a videira brotou
  rationale: פרח pode indicar brotar ou florescer. «Brotou» preserva a provável progressão para a abertura da flor na oração seguinte, sem eliminar a alternativa semântica.
- source_word: פִּתַּח הַסְּמָדַר
  choice: a flor da videira se abriu
  rationale: סמדר designa a flor ou floração inicial da videira, e פתח indica abrir-se. A expressão explicita o referente com clareza em português.
- source_word: הֵנֵצוּ הָרִמּוֹנִים
  choice: as romãzeiras estão floridas
  rationale: נוץ descreve o surgimento de flores. O hebraico nomeia literalmente as romãs, mas o português idiomático atribui a floração às romãzeiras.
- source_word: שָׁם
  choice: Ali
  rationale: O advérbio é espacial e remete aos vinhedos; «ali» conserva essa referência locativa.
- source_word: אֶתֵּן
  choice: darei
  rationale: נתן tem o sentido comum de dar; o futuro português expressa adequadamente a forma verbal e a promessa.
- source_word: דֹּדַי
  choice: o meu amor
  rationale: O plural pode ser intensivo ou coletivo, referindo-se ao amor, às carícias ou ao ato amoroso. «O meu amor» é natural e mantém a intimidade sem especificá-la excessivamente.
