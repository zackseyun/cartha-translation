translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A construção mantém o paralelismo poético e a progressão botânica. «Vinhedos» foi preferido a «vinhas» para indicar os lugares cultivados, enquanto «videira» designa a planta.
