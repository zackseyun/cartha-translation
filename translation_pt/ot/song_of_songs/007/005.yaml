base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/005.yaml
  text: Your neck is like a tower of ivory[a]; your eyes are pools in Heshbon, by the gate of Bath-rabbim. Your nose is like the tower of Lebanon[c][b], looking toward Damascus.
translation:
  language: pt
  text: 'Seu pescoço é como uma torre de marfim;

    seus olhos são como os tanques em Hesbom,

    junto ao portão de Bate-Rabim.[a]

    Seu nariz[b] é como a torre do Líbano,

    voltada para Damasco.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “junto ao portão da cidade populosa” ou “junto ao portão de muitos”. A expressão hebraica “Bate-Rabim” pode ser um nome de lugar ou ter sentido descritivo.
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “nariz”. A imagem provavelmente elogia o perfil nobre da amada, em vez de destacar isoladamente um traço como faria uma descrição moderna.'
    reason: cultural_note
  - marker: c
    text: Ou “com vista para Damasco” ou “de frente para Damasco”.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַוָּארֵךְ
  choice: seu pescoço
  rationale: O substantivo designa o pescoço ou a nuca; “pescoço” é natural e preserva a imagem concreta do poema.
- source_word: כְּמִגְדַּל הַשֵּׁן
  choice: como uma torre de marfim
  rationale: A preposição comparativa כְּ é expressa por “como”, e שֵׁן, literalmente relacionado a dente ou presa, designa idiomaticamente o marfim como material.
- source_word: עֵינַיִךְ בְּרֵכוֹת
  choice: seus olhos são como os tanques
  rationale: בְּרֵכוֹת refere-se a tanques, reservatórios ou piscinas. “Tanques” evita a conotação recreativa moderna de “piscinas” e mantém a imagem de águas tranquilas; “como” explicita em português a comparação nominal implícita.
- source_word: בְּחֶשְׁבּוֹן
  choice: de Hesbom
  rationale: O nome geográfico é transliterado. Neste contexto, o hebraico pode indicar os conhecidos tanques situados em Hesbom, daí a formulação portuguesa natural “tanques de Hesbom”.
- source_word: עַל שַׁעַר בַּת רַבִּים
  choice: junto ao portão de Bate-Rabim
  rationale: עַל tem valor locativo, bem expresso por “junto a”. A expressão ambígua בַּת־רַבִּים é mantida como possível topônimo no texto, sem eliminar seu possível sentido descritivo.
- source_word: אַפֵּךְ
  choice: seu nariz
  rationale: O sentido concreto mais provável é “nariz”. Substituí-lo por “rosto” apagaria a especificidade da descrição poética.
- source_word: כְּמִגְדַּל הַלְּבָנוֹן
  choice: como a torre do Líbano
  rationale: A construção é preservada sem decidir se se trata de um monumento conhecido ou de uma imagem poética idealizada.
- source_word: צוֹפֶה פְּנֵי דַמָּשֶׂק
  choice: voltada para Damasco
  rationale: O particípio descreve a orientação de uma torre de observação, e a expressão com פְּנֵי indica direção. “Voltada para” é idiomático e conserva a imagem espacial.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e poético, com leitura natural no Brasil e compreensão internacional. Mantém o paralelismo e as imagens corporais concretas do hebraico. Os versos foram dispostos em linhas poéticas, sem acrescentar qualificadores ausentes do texto-fonte.
