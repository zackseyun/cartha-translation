base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/012.yaml
  text: Come[a], my beloved, let us go out to the countryside[b]; let us spend the night among the villages.
translation:
  language: pt
  text: Venha, meu amado, vamos sair para o campo; passemos a noite nos povoados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entre os povoados”. Alguns entendem a expressão hebraica como “entre as flores de hena”, relacionando-a com a planta mencionada em Cântico dos Cânticos 1:14; o contexto imediato favorece “povoados”.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְכָה
  choice: Venha
  rationale: O imperativo de הלך funciona aqui como convite dirigido ao amado. “Venha” transmite esse chamado de modo natural, embora o verbo tenha literalmente o sentido de ir ou caminhar.
- source_word: דוֹדִי
  choice: meu amado
  rationale: Termo recorrente de afeto no Cântico dos Cânticos; preserva o tom íntimo e poético.
- source_word: נֵצֵא
  choice: vamos sair
  rationale: A forma coortativa plural de יצא expressa uma ação conjunta proposta pela mulher e conserva a ideia de sair do lugar onde estão.
- source_word: הַשָּׂדֶה
  choice: para o campo
  rationale: O singular pode designar o espaço rural ou aberto de modo coletivo. “Para o campo” é natural em português e mantém proximidade com a imagem hebraica.
- source_word: נָלִינָה
  choice: passemos a noite
  rationale: A forma coortativa plural de לון/לין indica permanecer ou alojar-se durante a noite; a expressão escolhida é clara, atual e adequada ao contexto poético.
- source_word: בַּכְּפָרִים
  choice: entre os povoados
  rationale: Neste contexto rural, כפרים é mais naturalmente entendido como “povoados”. “Entre” comunica bem a localização sem excluir a possibilidade de passarem por mais de um povoado.
