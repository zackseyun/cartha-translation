  to: 'Volte, volte, ó sulamita;

    volte, volte, para que olhemos para você.


    Por que[a] vocês olham para a sulamita

    como para a dança de Maanaim[b]?'
  rationale: A revisão conserva a repetição e a ambiguidade interpretativa do original, mas emprega «olhar para» nas duas ocorrências. Isso torna visível o paralelismo entre וְנֶחֱזֶה בָּךְ e תֶּחֱזוּ e traduz de modo idiomático a comparação introduzida por כ, sem decidir além do necessário o sentido da imagem.
