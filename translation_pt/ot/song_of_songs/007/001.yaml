  text: שׁ֤וּבִי שׁ֨וּבִי֙ הַ/שּׁ֣וּלַמִּ֔ית שׁ֥וּבִי שׁ֖וּבִי וְ/נֶחֱזֶה בָּ֑/ךְ מַֽה תֶּחֱזוּ֙ בַּ/שּׁ֣וּלַמִּ֔ית כִּ/מְחֹלַ֖ת הַֽ/מַּחֲנָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/001.yaml
  text: Return[a], return, O Shulammite; return, return, that we may look at you[b]. Why do you look at the Shulammite as at the dance of Mahanaim?
translation:
  language: pt
  text: 'Volte, volte, ó sulamita;

    volte, volte, para que olhemos para você.


    Por que[a] vocês olham para a sulamita

    como para a dança de Maanaim[b]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O que vocês veem na sulamita? — como a dança de Maanaim”. O hebraico desta oração é difícil, e מַה pode ser entendido como “o que”, em vez de “por que”.'
    reason: alternative_reading
  - marker: b
    text: Maanaim provavelmente é o nome de um lugar; o próprio nome pode significar “dois acampamentos”.
    reason: cultural_note
lexical_decisions:
- source_word: שׁוּבִי
  choice: Volte
  rationale: Imperativo feminino singular de שוב. “Volte” preserva a repetição enfática e não especifica se o retorno é físico ou relacional.
- source_word: הַשּׁוּלַמִּית
  choice: a sulamita
  rationale: Mantém transliterada a designação da mulher e preserva a ambiguidade entre gentílico, título ou designação poética.
- source_word: וְנֶחֱזֶה בָּךְ
  choice: para que contemplemos você
  rationale: Expressa naturalmente a finalidade após os imperativos e conserva o sentido visual de חזה sem recorrer a linguagem arcaica.
- source_word: מַה
  choice: Por que
  rationale: Embora מַה normalmente signifique “o que”, aqui pode introduzir uma pergunta de valor explicativo, “por que”. A leitura alternativa é preservada em nota.
- source_word: תֶּחֱזוּ
  choice: vocês contemplam
  rationale: A segunda pessoa masculina plural marca a mudança de interlocutor. “Contemplam” mantém a ligação lexical com a forma anterior de חזה.
- source_word: כִּמְחֹלַת
  choice: como se contempla a dança de
  rationale: A preposição כ estabelece comparação. A repetição de “contempla” torna a relação sintática compreensível em português sem eliminar a comparação.
- source_word: הַמַּחֲנָיִם
  choice: Maanaim
  rationale: É mais provavelmente o topônimo Maanaim. A transliteração preserva sua função de nome próprio; o possível significado do nome é indicado em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com repetição poética preservada. “Sulamita” permanece como designação transliterada, e “Maanaim” segue a forma portuguesa tradicional do topônimo. A sintaxe comparativa incomum é mantida, mas levemente explicitada para ser inteligível.
