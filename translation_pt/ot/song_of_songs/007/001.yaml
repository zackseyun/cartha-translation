review_pass:
  verdict: revise
  source_fidelity: A repetição do imperativo feminino singular, a designação «sulamita», a mudança para a segunda pessoa do plural e a leitura principal de מַה como «por que» são preservadas. Contudo, «como se contempla a dança» introduz uma construção impessoal que não representa com precisão o paralelismo verbal do hebraico («olhar para ... como para ...»).
  naturalness: «Contemplemos você» é compreensível, mas combina um tratamento de segunda pessoa mais marcado no português brasileiro com uma dicção poética elevada. «Olhemos para você» é mais natural e torna explícita, sem acréscimo interpretativo, a regência que também resolve a comparação final.
  terminology: «Sulamita» e «Maanaim» são formas adequadas. A nota sobre Maanaim é apropriada. A nota da leitura alternativa deve conservar a pergunta alternativa sem acrescentar «Algo», que não está expresso no hebraico.
  issues:
  - severity: medium
    issue: 'A cláusula comparativa foi transformada em construção impessoal: «como se contempla a dança de Maanaim».'
    rationale: O hebraico mantém o mesmo verbo de visão, com sujeito plural («por que vocês olham ... como para a dança...»). A formulação atual obscurece esse paralelismo e pode sugerir uma generalização impessoal ausente do texto.
  - severity: low
    issue: A nota alternativa acrescenta «Algo» à pergunta.
    rationale: A alternativa pode ser vertida diretamente como «O que vocês veem na sulamita? — como a dança de Maanaim», preservando melhor a elipse e a dificuldade sintática do hebraico.
  revised_text: 'Volte, volte, ó sulamita;

