  yaml_path: translation/ot/song_of_songs/007/008.yaml
  text: This stature of yours is like a palm tree[a], and your breasts are like clusters of fruit.
translation:
  language: pt
  text: Essa sua estatura é como uma palmeira, e seus seios são como cachos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cachos de uvas”. O termo hebraico muitas vezes se refere a cachos de uvas, embora aqui o fruto não seja especificado.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת קוֹמָתֵךְ
  choice: Esse seu porte
  rationale: A combinação do demonstrativo feminino com קוֹמָה aponta de modo imediato para a figura ou estatura da mulher. “Esse seu porte” é natural em português e abrange sua forma e altura sem reduzir a imagem a uma medida física.
- source_word: דָּמְתָה
  choice: é semelhante
  rationale: O verbo דמה expressa semelhança. O presente transmite de modo idiomático a comparação poética do perfeito hebraico.
- source_word: לְתָמָר
  choice: a uma palmeira
  rationale: A preposição לְ introduz a comparação, e תָּמָר designa a palmeira, cuja forma alta e ereta sustenta a imagem.
- source_word: וְשָׁדַיִךְ
  choice: e seus seios
  rationale: שָׁדַיִם designa diretamente os seios. A tradução mantém a linguagem corporal explícita da poesia amorosa, sem eufemismo.
- source_word: לְאַשְׁכֹּלוֹת
  choice: a cachos
  rationale: אַשְׁכֹּלוֹת significa “cachos” e frequentemente se refere a cachos de uvas, embora o fruto não seja especificado neste versículo. A formulação preserva essa abertura lexical.
