base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/002.yaml
  text: How beautiful are your feet in sandals[a], O noble daughter! The curves of your thighs are like jewels[b], the work of the hands of a master craftsman.
translation:
  language: pt
  text: Como são belos os seus pés, calçados de sandálias, ó filha nobre! As curvas das suas coxas[a] são como joias[b], obra das mãos de um mestre artesão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos seus quadris”. O termo hebraico pode abranger a região da coxa e do quadril.
    reason: lexical_alternative
  - marker: b
    text: Ou “adornos” ou “colares”. O termo hebraico provavelmente se refere a adornos preciosos trabalhados.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה יָּפ֧וּ
  choice: Como são belos
  rationale: מַה tem força exclamativa, e o plural verbal concorda com “pés”; a formulação comunica admiração de modo natural e digno.
- source_word: פְעָמַיִךְ
  choice: os seus pés
  rationale: Embora פעם possa indicar “passo”, a menção das sandálias favorece aqui o sentido concreto de “pés”.
- source_word: בַּנְּעָלִים
  choice: nas sandálias
  rationale: Expressa de forma idiomática a preposição ב e conserva a imagem concreta do hebraico.
- source_word: בַּת נָדִיב
  choice: ó filha nobre
  rationale: Mantém a forma vocativa e a concisão poética; נָדִיב pode sugerir tanto condição nobre quanto distinção de caráter, sem exigir a paráfrase mais específica “filha de um príncipe”.
- source_word: חַמּוּקֵי
  choice: As curvas
  rationale: O termo evoca contornos arredondados; “curvas” preserva a força estética da descrição sem recorrer a linguagem excessivamente anatômica.
- source_word: יְרֵכַיִךְ
  choice: das suas coxas
  rationale: יָרֵךְ abrange a região da coxa e do quadril. “Coxas” é uma tradução direta do dual neste contexto, enquanto a alternativa “quadris” é registrada em nota.
- source_word: חֲלָאִים
  choice: joias
  rationale: O raro termo parece designar adornos preciosos trabalhados. “Joias” transmite a preciosidade e o caráter artesanal sem especificar indevidamente o tipo de ornamento.
- source_word: מַעֲשֵׂה יְדֵי אָמָּן
  choice: obra das mãos de um mestre artesão
  rationale: Preserva a imagem hebraica das mãos e destaca a perícia artística indicada por אָמָּן.
