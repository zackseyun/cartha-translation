  text: Your head upon you is like Carmel[a], and the flowing hair of your head like purple[c][b]; a king is held captive in the tresses.
translation:
  language: pt
  text: Sua cabeça, erguida sobre você, é como o Carmelo[a], e as mechas de sua cabeça são como púrpura[b]; um rei fica preso em suas mechas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O Carmelo provavelmente é o monte Carmelo, cuja altura e beleza majestosa são evocadas aqui.
    reason: cultural_note
  - marker: b
    text: Ou «os cabelos pendentes de sua cabeça». O termo hebraico é raro e pode se referir a cabelos pendentes ou soltos.
    reason: lexical_alternative
  - marker: c
    text: Ou «um rei está atado nas galerias». A última palavra hebraica é difícil e tem sido entendida de mais de uma maneira; o texto principal segue a imagem dos cabelos presente nas linhas ao redor.
    reason: alternative_reading
lexical_decisions:
- source_word: רֹאשֵׁךְ עָלַיִךְ
  choice: Sua cabeça se ergue
  rationale: A expressão hebraica diz literalmente «sua cabeça sobre você». Em português, «se ergue» comunica com naturalidade a posição elevada e imponente sugerida pela comparação, sem trocar «cabeça» por uma interpretação como «coroa».
- source_word: כַּכַּרְמֶל
  choice: como o Carmelo
  rationale: Mantém o nome próprio e a comparação compacta do hebraico. O artigo é natural em português para o monte; uma nota esclarece a referência geográfica provável.
- source_word: דַלַּת רֹאשֵׁךְ
  choice: os cabelos que lhe caem da cabeça
  rationale: דַלָּה é raro e provavelmente designa cabelos pendentes ou esvoaçantes. A formulação conserva a imagem de cabelos que descem da cabeça e permanece compreensível em português atual.
- source_word: כָּאַרְגָּמָן
  choice: como a púrpura
  rationale: אַרְגָּמָן pode indicar o corante ou tecido púrpura, associado a luxo e dignidade. «A púrpura» preserva tanto a cor quanto essa associação sem especificar indevidamente o material.
- source_word: מֶלֶךְ
  choice: um rei
  rationale: O substantivo hebraico não tem artigo; «um rei» conserva a indefinição e o efeito hiperbólico da imagem.
- source_word: אָסוּר
  choice: fica preso
  rationale: O particípio passivo de אסר significa «atado» ou «preso». A escolha mantém a metáfora de aprisionamento e soa natural no contexto amoroso.
- source_word: בָּרְהָטִים
  choice: em suas mechas
  rationale: O termo plural é difícil e recebeu interpretações diversas. Pelo contexto imediato dos cabelos, «mechas» produz uma imagem coerente, enquanto a alternativa tradicional «galerias» é preservada em nota.
