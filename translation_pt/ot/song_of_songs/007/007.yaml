  text: How beautiful and how delightful you are[a], O love[b], with your pleasures!
translation:
  language: pt
  text: Como você é bela e como é encantadora, ó amor[b], entre as delícias[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em delícias” ou “com delícias”. A expressão hebraica é compacta e pode indicar a esfera do deleite ou caracterizar a mulher amada por delícias.
    reason: lexical_alternative
  - marker: b
    text: Ou “meu amor” ou “amada”. A palavra hebraica significa literalmente “amor” e aqui é usada como forma de tratamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה יָּפִית
  choice: Como você é bela
  rationale: O מַה exclamativo diante da forma verbal/adjetival expressa admiração, não uma pergunta. A formulação mantém a referência feminina singular e soa natural em português.
- source_word: וּמַה נָּעַמְתְּ
  choice: e encantadora
  rationale: נעם comunica aquilo que é agradável, prazeroso ou deleitável. “Encantadora” preserva o elogio amoroso e a fluidez poética sem reduzir o termo à aparência física.
- source_word: אַהֲבָה
  choice: ó amor
  rationale: O substantivo “amor” funciona como vocativo. “Ó amor” conserva essa forma abstrata de tratamento sem acrescentar o possessivo “meu”, ausente do hebraico.
- source_word: בַּתַּעֲנוּגִים
  choice: entre as delícias
  rationale: A construção compacta com ב pode indicar esfera, situação ou associação. “Entre as delícias” permanece próxima do texto e evita acrescentar um possessivo não expresso, enquanto a nota registra outras leituras possíveis.
theological_decisions: []
translation_notes:
  register: Português moderno, poético e digno, com ampla legibilidade brasileira. A ordem preserva o paralelismo exclamativo hebraico; “você” explicita naturalmente a segunda pessoa feminina singular. As notas mantêm abertas as ambiguidades lexicais sem impor possessivo ou interpretação alegórica.
