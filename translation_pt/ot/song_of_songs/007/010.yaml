  naturalness: “E a sua boca é como o melhor vinho” soa natural em português moderno. “Que flui suavemente para o meu amado” conserva a direção/relação expressa por לְדוֹדִי com mais fluidez do que “desce ... para”.
  terminology: “Boca” comunica idiomaticamente o hebraico חֵךְ no contexto amoroso, sem confundi-lo com o sentido português de “paladar”. A nota esclarece a acepção mais específica de “palato/céu da boca” e mantém a alternativa “gosto”.
