  register: Português moderno, poético e acessível, com concordância nominal e pronominal natural para leitores brasileiros. A tradução mantém a imagem sensorial, o paralelismo romântico e a ambiguidade do verbo raro, sem tornar explícita uma interpretação que o hebraico não exige.
