base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/010.yaml
  text: And your mouth is like the best wine[a], going down smoothly for my beloved[b], gliding over the lips of sleepers.
translation:
  language: pt
  text: E a sua boca[a] é como o melhor vinho, que flui suavemente para o meu amado, deslizando sobre os lábios dos que dormem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu palato”; o termo hebraico se refere mais especificamente ao céu da boca e, por extensão, pode referir-se à boca ou ao gosto.
    reason: lexical_alternative
  - marker: b
    text: Ou “fazendo falar os lábios dos que dormem”. O verbo hebraico é raro e pode descrever tanto um movimento suave sobre os lábios quanto o efeito do vinho de fazê-los falar.
    reason: alternative_reading
lexical_decisions:
- source_word: חִכֵּךְ
  choice: seu paladar
  rationale: O substantivo designa mais precisamente o palato, o céu da boca, e por extensão o gosto ou a boca. “Paladar” preserva a imagem sensorial e poética sem soar excessivamente anatômico.
- source_word: כְּיֵין הַטּוֹב
  choice: como o melhor vinho
  rationale: A expressão descreve vinho de excelente qualidade; “o melhor vinho” comunica naturalmente essa força no contexto.
- source_word: הוֹלֵךְ
  choice: que desce
  rationale: Embora o particípio signifique literalmente “indo”, aplicado ao vinho descreve de modo idiomático seu movimento ao ser bebido.
- source_word: לְדוֹדִי
  choice: para o meu amado
  rationale: 'A preposição pode indicar direção ou relação. “Para o meu amado” mantém ambas as ideias possíveis: o vinho se dirige a ele e é destinado ao seu prazer.'
- source_word: לְמֵישָׁרִים
  choice: suavemente
  rationale: Literalmente ligado à retidão ou ao movimento direto, no contexto do vinho indica que ele corre ou desce sem dificuldade.
- source_word: דּוֹבֵב
  choice: deslizando sobre
  rationale: O particípio raro pode retratar um movimento suave do vinho sobre os lábios. A tradução conserva a imagem física no texto e registra em nota a possível leitura causativa.
- source_word: שִׂפְתֵי יְשֵׁנִים
  choice: os lábios dos que dormem
  rationale: Tradução próxima da forma hebraica, preservando a imagem poética incomum e sua ambiguidade.
