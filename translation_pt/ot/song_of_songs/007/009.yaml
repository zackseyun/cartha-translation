base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/009.yaml
  text: I said[a], “I will climb the palm tree; I will take hold of its branches. May your breasts be like clusters of the vine[b], and the fragrance of your breath like apples.”
translation:
  language: pt
  text: 'Eu disse: “Subirei à palmeira e agarrarei seus ramos[a]. Que os seus seios sejam como cachos da videira, e o aroma do seu nariz[b], como o das maçãs.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas hastes frutíferas”; o termo hebraico pode referir-se aos ramos da palmeira ou aos brotos que sustentam seus frutos.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “seu nariz”. A imagem pode evocar o aroma associado ao hálito ou, de modo mais amplo, à região do rosto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָמָר
  choice: palmeira
  rationale: O substantivo designa a palmeira, especialmente a tamareira. “Palmeira” preserva a imagem concreta e é natural em português amplo.
- source_word: אֶעֱלֶה
  choice: subirei
  rationale: עלה significa subir ou ascender; no contexto da palmeira, implica trepar nela, mas “subirei” preserva de modo natural a formulação hebraica.
- source_word: אֹחֲזָה
  choice: agarrarei
  rationale: אחז expressa agarrar ou segurar firmemente. “Agarrarei” mantém a vivacidade da imagem sem acrescentar violência indevida.
- source_word: סַנְסִנָּיו
  choice: seus ramos
  rationale: O termo raro pode indicar os ramos da palmeira ou suas hastes frutíferas. “Ramos” é claro no texto, e a nota conserva a especificidade possível.
- source_word: וְיִהְיוּ נָא
  choice: Que ... sejam
  rationale: A construção volitiva com נָא exprime desejo ou pedido; “Que ... sejam” comunica adequadamente esse tom optativo.
- source_word: שָׁדַיִךְ
  choice: os seus seios
  rationale: O hebraico designa diretamente os seios. A tradução preserva sem eufemismo a linguagem erótica do poema.
- source_word: אֶשְׁכְּלֹת הַגֶּפֶן
  choice: cachos da videira
  rationale: Tradução próxima da expressão hebraica, mantendo tanto os cachos quanto a videira na comparação.
- source_word: רֵיחַ
  choice: aroma
  rationale: No contexto sensual e positivo, “aroma” transmite um cheiro agradável com registro poético e atual.
- source_word: אַפֵּךְ
  choice: seu hálito
  rationale: O sentido lexical direto é “seu nariz”, mas, associado a aroma, a imagem provavelmente aponta para o hálito ou para a região do rosto. “Hálito” produz sentido natural em português, enquanto a nota registra a forma literal e a ambiguidade.
- source_word: כַּתַּפּוּחִים
  choice: como o das maçãs
  rationale: תפוחים é tradicionalmente identificado como maçãs, embora a espécie exata seja discutida. A inserção de “o das” deixa claro em português que o aroma é comparado ao aroma das frutas.
theological_decisions: []
translation_notes:
  register: Português moderno, poético e acessível, com formas verbais dignas e naturais. A linguagem sensual explícita do hebraico foi preservada sem eufemismo. As notas mantêm as alternativas lexicais reais do termo raro para os ramos e de אַף, literalmente “nariz”.
