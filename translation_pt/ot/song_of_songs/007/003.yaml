  - marker: b
    text: 'Ou: “vinho aromatizado”. O hebraico se refere a vinho misturado, provavelmente com água ou especiarias.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “Seu útero”, caso o termo seja entendido em sentido interno, e não como referência à parte externa do corpo; no contexto, porém, “ventre” é mais provável.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁרְרֵךְ
  choice: seu umbigo
  rationale: A tradução tradicional “umbigo” se encaixa na sequência poética de partes do corpo e continua sendo lexicalmente defensável. Como o sentido mais explicitamente erótico é possível, mas discutido, ele é preservado em nota.
- source_word: אַגַּן הַסַּהַר
  choice: uma taça redonda
  rationale: אַגַּן designa um recipiente, como taça, tigela ou bacia, e הַסַּהַר indica forma circular. “Taça redonda” conserva a imagem e soa poético e natural em português.
- source_word: אַל יֶחְסַר
  choice: que nunca lhe falte
  rationale: Reproduz o valor volitivo do jussivo hebraico como desejo, em vez de transformá-lo numa simples afirmação.
- source_word: הַמָּזֶג
  choice: vinho misturado
  rationale: O termo se refere a vinho preparado por mistura, possivelmente com água ou especiarias. A tradução mantém a formulação abrangente do hebraico.
- source_word: בִּטְנֵךְ
  choice: seu ventre
  rationale: O substantivo normalmente indica barriga ou ventre e, em certos contextos, pode indicar o útero. Aqui a descrição externa do corpo favorece “ventre”, sem eliminar a alternativa interna.
- source_word: עֲרֵמַת חִטִּים
  choice: um monte de trigo
  rationale: Tradução direta que preserva a imagem agrícola e a textura poética do original.
- source_word: סוּגָה בַּשּׁוֹשַׁנִּים
  choice: cercado de lírios
  rationale: A forma passiva expressa algo rodeado ou encerrado, e a preposição introduz aquilo que o circunda. “Cercado de lírios” é claro e poético.
