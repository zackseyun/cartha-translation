  text: Your navel is a rounded bowl[a]; may it never lack mixed wine. Your belly is a heap of wheat[c][b], encircled with lilies.
translation:
  language: pt
  text: Seu umbigo é uma taça redonda[a]; que nunca lhe falte vinho misturado[b]. Seu ventre[c] é um monte de trigo, cercado de lírios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: “Sua vulva é uma taça redonda”. O termo hebraico tradicionalmente traduzido por “umbigo” é discutido neste contexto de poesia erótica.'
