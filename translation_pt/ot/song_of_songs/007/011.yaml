lexical_decisions:
- source_word: אֲנִי
  choice: Eu
  rationale: O pronome de primeira pessoa está explícito no hebraico e é mantido para preservar a ênfase poética.
- source_word: לְדוֹדִי
  choice: pertenço ao meu amado
  rationale: A construção nominal com לְ expressa aqui pertença e vínculo relacional. Em português, “pertenço ao meu amado” comunica naturalmente esse sentido e se harmoniza com o refrão recorrente do Cântico, sem eliminar a tradução mais literal indicada em nota.
- source_word: וְעָלַי
  choice: por mim
  rationale: Com תְּשׁוּקָה, a preposição עַל indica o objeto ou a direção do desejo; “por mim” é a formulação idiomática em português.
- source_word: תְּשׁוּקָתוֹ
  choice: o desejo dele
  rationale: תְּשׁוּקָה denota desejo ou anseio. “Desejo” é direto e preserva a conexão lexical com Gênesis 3:16 e 4:7; “dele” representa o sufixo masculino sem tornar o verso artificial.
theological_decisions:
- issue: Sentido da oração relacional
  choice: 'Pertença mútua em linguagem amorosa: “Eu pertenço ao meu amado”'
  alternative: “Eu sou para o meu amado”
  rationale: O hebraico apresenta uma oração sem verbo que, literalmente, pode ser entendida como “Eu [sou] para o meu amado”. No refrão recorrente do Cântico, porém, o sentido contextual é de pertença relacional. A nota preserva a forma mais literal sem introduzir uma leitura alegórica posterior.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Meu amado” conserva o caráter romântico do poema; “pertenço” torna explícito em português o sentido da oração nominal hebraica.
