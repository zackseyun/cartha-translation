  text: I am my beloved's[a], and his desire is for me.
translation:
  language: pt
  text: Eu pertenço ao meu amado[a], e o desejo dele é por mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Eu sou para o meu amado”.'
