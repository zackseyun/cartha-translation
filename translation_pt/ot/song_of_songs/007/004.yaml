  text: Your two breasts are like two fawns[b][a], twins of a gazelle.
translation:
  language: pt
  text: Seus dois seios são como dois filhotes, gêmeos de uma gazela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “corça”. Os termos hebraicos podem designar mais amplamente crias de cervídeos e uma fêmea dessa família.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנֵי שָׁדַיִךְ
  choice: seus dois seios
  rationale: O numeral em estado construto e o substantivo com sufixo de segunda pessoa feminina singular indicam dois seios da mulher diretamente interpelada; a formulação concreta preserva o caráter erótico do poema sem eufemismo.
- source_word: כִּשְׁנֵי
  choice: como dois
  rationale: A preposição comparativa introduz uma símile; “como dois” é natural em português e mantém explicitamente o número.
- source_word: עֳפָרִים
  choice: filhotes de gazela
  rationale: O termo designa crias de cervídeos ou gazelas. No contexto, a expressão seguinte identifica a mãe como צְבִיָּה, favorecendo “filhotes de gazela”; a repetição é aceitável e torna clara a espécie da imagem.
- source_word: תָּאֳמֵי
  choice: gêmeos de
  rationale: A forma construta plural caracteriza os dois filhotes como nascidos juntos e correspondentes entre si; “gêmeos de” conserva de perto a construção hebraica.
- source_word: צְבִיָּה
  choice: uma gazela
  rationale: A forma feminina singular designa uma gazela fêmea; em português, “gazela” já é substantivo feminino e comunica com naturalidade a imagem recorrente no Cântico.
