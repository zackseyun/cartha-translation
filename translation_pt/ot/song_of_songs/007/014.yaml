base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/014.yaml
  text: The mandrakes give off fragrance[a], and at our doorways are all choice fruits, new as well as old, which I have stored up for you[b], my beloved.
translation:
  language: pt
  text: As mandrágoras exalam perfume[a], e junto às nossas portas há toda sorte de frutos seletos[b], novos e também velhos, que guardei para você, meu amado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “maçãs de amor”, denominação tradicional ligada à associação da mandrágora com o amor e a fertilidade.
    reason: lexical_alternative
  - marker: b
    text: Ou “todas as iguarias” ou “todas as coisas preciosas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדּוּדָאִים
  choice: As mandrágoras
  rationale: O termo designa mandrágoras, plantas tradicionalmente associadas ao amor e à fertilidade; a equivalência direta preserva a imagem botânica.
- source_word: נָתְנוּ רֵיחַ
  choice: exalam seu perfume
  rationale: A expressão hebraica significa literalmente que as plantas 'deram aroma'; o presente poético e o verbo 'exalar' produzem uma formulação natural em português.
- source_word: וְעַל פְּתָחֵינוּ
  choice: e junto às nossas portas
  rationale: פֶּתַח indica abertura, entrada ou porta; עַל admite aqui uma relação espacial que, no contexto, se expressa naturalmente por 'junto a'.
- source_word: כָּל מְגָדִים
  choice: toda espécie de frutos deliciosos
  rationale: מְגָדִים pode indicar produtos seletos, iguarias ou coisas preciosas. No cenário vegetal e sensual do poema, 'frutos deliciosos' mantém a imagem concreta sem ocultar a amplitude lexical, registrada em nota.
- source_word: חֲדָשִׁים גַּם יְשָׁנִים
  choice: novos e velhos
  rationale: A formulação concisa conserva o contraste e a força inclusiva de גַּם.
- source_word: צָפַנְתִּי לָךְ
  choice: que guardei para você
  rationale: צפן significa guardar, reservar ou entesourar. 'Guardei para você' preserva tanto a ideia concreta de reserva quanto a dedicação pessoal.
- source_word: דּוֹדִי
  choice: meu amado
  rationale: No Cântico dos Cânticos, דּוֹד é uma forma íntima e poética de tratamento; 'meu amado' é natural, digna e afetiva.
