translation_notes:
  register: Português moderno, poético e amplamente compreensível, com boa legibilidade brasileira. A sintaxe acompanha o fluxo sensorial do hebraico, sem tornar a linguagem artificialmente arcaica. Todos os marcadores de nota aparecem no texto.
