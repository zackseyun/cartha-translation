  text: Your lips are like a scarlet thread[a], and your mouth is lovely[c][b]. Your temples are like a slice of pomegranate behind your veil.
translation:
  language: pt
  text: Seus lábios são como um fio escarlate, e sua boca é encantadora[a]. Suas têmporas são como uma fatia de romã por trás do seu véu[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu falar é encantador”. O termo hebraico pode referir-se à fala ou ao modo de falar, embora, nesta sequência de traços físicos, possa designar a boca por metonímia.
    reason: lexical_alternative
  - marker: b
    text: Ou “através do seu véu”; a expressão hebraica pode descrever algo visto através de uma cobertura ou por trás dela.
    reason: lexical_alternative
  - marker: c
    text: Ou “dos seus cabelos” ou “das suas mechas”; o sentido do termo hebraico traduzido por “véu” é discutido neste contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּחוּט הַשָּׁנִי
  choice: como um fio escarlate
  rationale: חוּט designa fio, cordão ou linha, e שָׁנִי indica a cor escarlate ou carmesim. “Fio escarlate” conserva a delicadeza e a vivacidade da comparação poética.
- source_word: שִׂפְתֹתַיִךְ
  choice: seus lábios
  rationale: A forma dual/plural de שָׂפָה refere-se naturalmente aos dois lábios.
- source_word: וּמִדְבָּרֵיךְ
  choice: e sua boca
  rationale: מִדְבָּר pode designar fala ou modo de falar; no contexto da sequência de traços físicos, “boca” funciona como metonímia natural em português. A alternativa mais literal é preservada em nota.
- source_word: נָאוֶה
  choice: é encantadora
  rationale: נָאוֶה expressa beleza, encanto ou adequação. O feminino “encantadora” concorda com “boca” e mantém o tom íntimo e poético.
- source_word: כְּפֶלַח הָרִמּוֹן
  choice: como um pedaço de romã
  rationale: פֶּלַח é uma porção, segmento ou parte cortada. “Pedaço de romã” comunica a imagem com naturalidade, sem sugerir especificamente um único bago.
- source_word: רַקָּתֵךְ
  choice: suas têmporas
  rationale: רַקָּה designa a região lateral da cabeça, especialmente a têmpora; “têmporas” é mais preciso que “faces”.
- source_word: מִבַּעַד
  choice: por trás de
  rationale: A expressão indica algo visto por trás ou através de uma cobertura interveniente. “Por trás de” é conciso, e a nuance alternativa fica registrada em nota.
- source_word: לְצַמָּתֵךְ
  choice: do seu véu
  rationale: צַמָּה é tradicionalmente entendido aqui como véu ou cobertura, embora sua identificação seja discutida e possa referir-se aos cabelos ou mechas. A incerteza é preservada em nota.
