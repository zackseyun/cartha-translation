  yaml_path: translation/ot/song_of_songs/004/007.yaml
  text: You are altogether beautiful[a], my beloved[c][b], and there is no blemish in you.
translation:
  language: pt
  text: Você é inteiramente bela[a], minha amada[b], e não há defeito algum em você[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Você é bela por inteiro” ou “Tudo em você é belo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “meu amor”, “minha querida” ou “minha companheira”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “imperfeição”, “mácula” ou “falha”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּךְ
  choice: inteiramente
  rationale: O termo com sufixo feminino singular abrange a mulher por completo. “Inteiramente” expressa essa força abrangente de modo natural e poético em português.
- source_word: יָפָה
  choice: bela
  rationale: “Bela” é o equivalente contemporâneo mais direto e apropriado ao registro poético.
- source_word: רַעְיָתִי
  choice: minha amada
  rationale: No Cântico dos Cânticos, o termo funciona como forma íntima de tratamento dirigida à mulher. “Minha amada” preserva o afeto e a relação sem se tornar coloquial demais.
- source_word: וּמוּם
  choice: defeito algum
  rationale: מוּם denota defeito, imperfeição ou mácula. “Defeito algum” comunica com clareza a ausência completa de imperfeição no contexto poético.
- source_word: אֵין בָּךְ
  choice: não há ... em você
  rationale: A construção existencial negativa com preposição é reproduzida naturalmente por “não há ... em você”, mantendo-se próxima da estrutura hebraica.
