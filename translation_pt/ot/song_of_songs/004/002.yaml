base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/002.yaml
  text: Your teeth are like a flock of shorn ewes that have come up from the washing[a], all of them bearing twins[b], and none among them has lost her young.
translation:
  language: pt
  text: Seus dentes são como um rebanho de ovelhas tosquiadas[a] que saíram da lavagem. Todas elas têm crias gêmeas[b], e nenhuma perdeu suas crias.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “as tosquiadas”; “ovelhas” está implícito na imagem e nas formas femininas seguintes.
    reason: lexical_alternative
  - marker: b
    text: Ou “todas elas estão emparelhadas”. A imagem sugere uma dentição completa, uniforme e disposta em pares.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “e nenhuma entre elas está enlutada” ou “privada de crias”. O hebraico mantém a imagem das ovelhas em vez de dizer diretamente que não falta nenhum dente.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁנַּיִךְ
  choice: Seus dentes
  rationale: Tradução direta do substantivo com sufixo feminino singular; o hebraico não traz qualquer adjetivo como “de marfim”.
- source_word: כְּעֵדֶר
  choice: como um rebanho
  rationale: עֵדֶר designa normalmente um rebanho, em especial de animais de pequeno porte, e introduz a comparação pastoral.
- source_word: הַקְּצוּבוֹת
  choice: de ovelhas tosquiadas
  rationale: O particípio passivo feminino plural descreve animais tosquiados. “Ovelhas” é uma explicitação natural exigida em português pelo substantivo elíptico e apoiada pelas formas femininas que dão continuidade à imagem.
- source_word: שֶׁעָלוּ מִן הָרַחְצָה
  choice: que sobem do lavadouro
  rationale: Conserva o movimento concreto dos animais que saem limpos da lavagem; “lavadouro” comunica de modo natural o local ou contexto da lavagem sem transformar a imagem em uma afirmação abstrata de brancura.
- source_word: שֶׁכֻּלָּם מַתְאִימוֹת
  choice: Todas elas têm gêmeos
  rationale: מַתְאִימוֹת pode descrever animais que dão crias gêmeas ou estão emparelhados. A formulação mantém a metáfora das ovelhas e sugere dentes completos e simétricos sem substituir a imagem por sua interpretação.
- source_word: וְשַׁכֻּלָה אֵין בָּהֶם
  choice: e nenhuma perdeu suas crias
  rationale: שַׁכֻּלָה significa literalmente “privada dos filhos/crias, enlutada”. A tradução preserva a linguagem do rebanho e deixa implícita, como no hebraico, a ideia de que não falta nenhum dente.
