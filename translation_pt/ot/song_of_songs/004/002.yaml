translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A comparação pastoral foi mantida em todas as suas partes, evitando explicitar no corpo do versículo a interpretação dos dentes como brancos, uniformes ou completos.
