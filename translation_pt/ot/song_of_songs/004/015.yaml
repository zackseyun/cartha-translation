translation_notes:
  register: Português moderno, poético e acessível, com preservação do paralelismo nominal e da imagem hebraica. O plural “águas vivas” soa natural em português e mantém a expressão original; a formulação final evita introduzir no texto principal um substantivo que não está expresso no hebraico.
