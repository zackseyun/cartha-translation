base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/015.yaml
  text: A spring of gardens[a], a well of living water[c][b], and streams flowing from Lebanon.
translation:
  language: pt
  text: Uma fonte de jardins[a], um poço de águas vivas[b] e águas que correm do Líbano[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma nascente de jardins”; o termo hebraico pode designar uma nascente ou o ponto de onde a água brota.
    reason: lexical_alternative
  - marker: b
    text: “Águas vivas” é uma expressão hebraica para águas frescas e correntes, não estagnadas.
    reason: cultural_note
  - marker: c
    text: 'Outra tradução possível: “e correntes que fluem do Líbano”. O particípio hebraico enfatiza a água em movimento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעְיַן
  choice: fonte
  rationale: Designa uma nascente ou fonte natural; “fonte” é corrente em português e mantém a imagem poética.
- source_word: גַּנִּים
  choice: jardins
  rationale: Preserva o plural explícito do hebraico, que sugere abundância ou vários espaços cultivados.
- source_word: בְּאֵר
  choice: poço
  rationale: É o sentido usual do substantivo e, ao contrário de “cisterna”, não sugere simplesmente água armazenada.
- source_word: מַיִם חַיִּים
  choice: águas vivas
  rationale: Preserva a expressão hebraica e sua força literária; no contexto, refere-se a águas frescas e correntes.
- source_word: וְנֹזְלִים
  choice: e águas que correm
  rationale: O particípio plural descreve algo que flui ou corre. “Águas” é suprido naturalmente pelo contexto e evita especificar “riachos”, substantivo ausente do hebraico.
- source_word: מִן לְבָנוֹן
  choice: do Líbano
  rationale: Reproduz de modo direto a origem geográfica indicada pela preposição hebraica.
