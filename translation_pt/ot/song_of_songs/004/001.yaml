base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/001.yaml
  text: Look[a], you are beautiful, my darling; look, you are beautiful. Your eyes are doves behind your veil[b]. Your hair is like a flock of goats streaming down from Mount Gilead.
translation:
  language: pt
  text: Como você é linda, minha amada! Como você é linda! Seus olhos são pombas por trás[a] do seu véu[b]. Seu cabelo é como um rebanho de cabras que descem do monte de Gileade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “através”. A expressão hebraica sugere que os olhos são vistos por trás de algo que os encobre parcialmente, ou através desse objeto.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico traduzido como “véu” também pode ser entendido como “madeixas” ou “trança”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנָּךְ
  choice: Como você é
  rationale: A partícula deítica e exclamativa com sufixo feminino introduz uma exclamação vívida. Em português atual, “Como você é...” transmite isso com mais naturalidade do que o arcaizante “Eis que você é”.
- source_word: יָפָה
  choice: linda
  rationale: Equivalente corrente e afetivo para o adjetivo de beleza, adequado à poesia amorosa e à concordância feminina.
- source_word: רַעְיָתִי
  choice: minha amada
  rationale: No Cântico, o termo funciona como forma íntima de tratamento da mulher amada; “minha amada” preserva o afeto e a dignidade poética, embora o sentido lexical também possa envolver a ideia de companheira.
- source_word: עֵינַיִךְ יוֹנִים
  choice: Seus olhos são pombas
  rationale: Mantém a metáfora direta da construção nominal hebraica, sem acrescentar o comparativo “como”.
- source_word: מִבַּעַד
  choice: por trás
  rationale: Expressa a posição atrás de algo que encobre parcialmente; a alternativa “através” é registrada em nota para preservar a nuance visual possível.
- source_word: לְצַמָּתֵךְ
  choice: do seu véu
  rationale: O substantivo é raro e discutido. “Véu” se ajusta bem à preposição e à imagem dos olhos parcialmente ocultos, mas as possibilidades “madeixas” ou “trança” são mantidas em nota.
- source_word: שַׂעְרֵךְ
  choice: Seu cabelo
  rationale: Tradução direta e natural do substantivo com sufixo possessivo feminino.
- source_word: כְּעֵדֶר הָעִזִּים
  choice: como um rebanho de cabras
  rationale: Preserva a comparação pastoril; “rebanho” é idiomático em português para um grupo de cabras.
- source_word: שֶׁגָּלְשׁוּ
  choice: que desce em ondas
  rationale: A expressão comunica o movimento coletivo para baixo e, ao mesmo tempo, evoca visualmente o cabelo ondulante, sem abandonar a imagem literal das cabras.
- source_word: מֵהַר גִּלְעָד
  choice: do monte de Gileade
  rationale: Mantém a origem do movimento indicada pela preposição hebraica e conserva a referência geográfica sem especificar uma topografia além do texto.
