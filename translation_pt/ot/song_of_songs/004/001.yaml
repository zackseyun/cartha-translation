  naturalness: O português é moderno, claro e poeticamente adequado. “Como você é linda” reproduz naturalmente a exclamação hebraica; “por trás do seu véu” é fluente. “Monte de Gileade” é uma designação geográfica natural e amplamente compreensível.
  terminology: “Minha amada” é uma escolha apropriada para רַעְיָתִי, sem impor uma leitura doutrinal. “Véu” é uma opção contextual plausível para o termo discutido, e a nota preserva alternativas relevantes. “Pombas” mantém a metáfora predicativa direta do hebraico.
