  yaml_path: translation/ot/song_of_songs/004/009.yaml
  text: You have captured my heart[a], my sister, my bride; you have captured my heart with one glance of your eyes[c][b], with one jewel of your necklace.
translation:
  language: pt
  text: Você arrebatou meu coração[a], minha irmã, minha noiva; arrebatou meu coração com um só olhar dos seus olhos[b], com um só ornamento do seu pescoço[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Você conquistou meu coração”. O verbo hebraico é raro e indica que a amada comoveu ou dominou intensamente o coração de quem fala.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “com um dos seus olhos”. O sentido provável é “com um só olhar”.
    reason: lexical_alternative
  - marker: c
    text: O hebraico também pode ser entendido como “com uma só corrente do seu pescoço” ou “com um dos ornamentos do seu pescoço”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבַּבְתִּנִי
  choice: arrebatou meu coração
  rationale: O verbo raro לבב descreve o efeito poderoso da amada sobre o coração do amado. A expressão preserva a intensidade poética e sua repetição no hebraico.
- source_word: אֲחֹתִי
  choice: minha irmã
  rationale: Mantém literalmente o termo afetivo de intimidade empregado no Cântico, sem convertê-lo numa afirmação de parentesco biológico.
- source_word: כַלָּה
  choice: minha noiva
  rationale: Preserva o sentido nupcial e soa natural no vocativo português.
- source_word: בְאֶחָד מֵעֵינַיִךְ
  choice: com um só olhar dos seus olhos
  rationale: O hebraico diz de modo condensado 'com um de seus olhos'; 'um só olhar' comunica naturalmente a provável ideia de um único olhar, sem eliminar a formulação literal da nota.
- source_word: בְּאַחַד עֲנָק
  choice: com um só enfeite
  rationale: עֲנָק designa um adorno ou corrente para o pescoço. 'Enfeite' preserva a imagem sem especificar indevidamente que se trata de uma joia individual.
- source_word: מִצַּוְּרֹנָיִךְ
  choice: dos colares do seu pescoço
  rationale: A forma incomum ligada a 'pescoço' pode aludir aos adornos ou correntes usados nele. A tradução conserva tanto a imagem do pescoço quanto a provável referência aos colares.
