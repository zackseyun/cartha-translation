  text: מַה יָּפ֥וּ דֹדַ֖יִ/ךְ אֲחֹתִ֣/י כַלָּ֑ה מַה טֹּ֤בוּ דֹדַ֨יִ/ךְ֙ מִ/יַּ֔יִן וְ/רֵ֥יחַ שְׁמָנַ֖יִ/ךְ מִ/כָּל בְּשָׂמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/010.yaml
  text: How beautiful your love is[a], my sister, my bride! How much better your love is than wine[b], and the fragrance of your oils than all spices!
translation:
  language: pt
  text: Como é belo o seu amor[a], minha irmã, minha noiva! Como o seu amor é melhor do que o vinho, e a fragrância dos seus óleos[b], melhor do que todas as especiarias!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «as suas carícias», nas duas ocorrências; o termo hebraico pode se referir ao amor manifestado em afeto físico.
    reason: lexical_alternative
  - marker: b
    text: Provavelmente óleos perfumados ou unguentos aromáticos.
    reason: cultural_note
lexical_decisions:
- source_word: מַה יָּפוּ
  choice: Como é belo
  rationale: מַה tem valor exclamativo, e יָפוּ expressa beleza ou encanto. Em português, a construção no singular concorda naturalmente com o coletivo «amor», embora o hebraico use a forma verbal plural com דֹדַיִךְ.
- source_word: דֹדַיִךְ
  choice: o seu amor
  rationale: דּוֹדִים pode designar o amor e suas manifestações físicas, como carícias. «O seu amor» mantém a amplitude poética e relacional; a nota registra a alternativa mais concreta.
- source_word: אֲחֹתִי כַלָּה
  choice: minha irmã, minha noiva
  rationale: Preserva os dois termos de tratamento afetivo do hebraico, sem fundi-los nem omitir a imagem incomum.
- source_word: מַה טֹּבוּ ... מִיַּיִן
  choice: Como ... é melhor do que o vinho
  rationale: A segunda ocorrência de מַה também é exclamativa, e a construção com מִן estabelece uma comparação direta.
- source_word: וְרֵיחַ שְׁמָנַיִךְ
  choice: e a fragrância dos seus óleos
  rationale: רֵיחַ é um cheiro percebido positivamente no contexto; «fragrância» comunica esse valor. שֶׁמֶן significa literalmente óleo, provavelmente um óleo perfumado usado no corpo.
- source_word: מִכָּל בְּשָׂמִים
  choice: melhor do que todas as especiarias
  rationale: A expressão continua a comparação anterior. בְּשָׂמִים são substâncias aromáticas; «especiarias» mantém a imagem concreta e antiga.
theological_decisions: []
translation_notes:
  register: Português moderno, poético e digno, com ampla legibilidade brasileira. A repetição de «o seu amor» e os dois vocativos foram preservados. A elipse comparativa do último membro foi explicitada com «melhor» para produzir uma frase natural em português sem alterar o paralelismo.
