  yaml_path: translation/ot/song_of_songs/004/004.yaml
  text: Your neck is like the tower of David[a], built in rows of stone; a thousand shields hang on it[b], all the small shields of the warriors.
translation:
  language: pt
  text: Seu pescoço é como a torre de Davi, construída em fileiras[a]; nela estão pendurados mil escudos, todos os escudos dos guerreiros[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «construída para arsenais», «construída com ameias» ou «construída em fiadas». O termo hebraico תַלְפִּיּוֹת é raro, e seu sentido exato é incerto.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico emprega dois termos diferentes para equipamento defensivo: מָגֵן, traduzido por «escudos», e שֶׁלֶט, também traduzido aqui por «escudos». O segundo termo pode designar um tipo diferente de escudo; também é entendido por alguns de modo mais geral como «armas».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמִגְדַּל דָּוִיד
  choice: como a torre de Davi
  rationale: O prefixo כְּ marca comparação, e a relação construta com דָּוִיד favorece a forma definida «a torre de Davi», preservando a imagem arquitetônica do hebraico.
- source_word: צַוָּארֵךְ
  choice: seu pescoço
  rationale: Tradução direta e natural da metáfora corporal dirigida à amada.
- source_word: בָּנוּי לְתַלְפִּיּוֹת
  choice: construída em fileiras de pedras
  rationale: בָּנוּי mantém a ideia de construção. Como תַלְפִּיּוֹת é um termo raro e de sentido incerto, esta opção preserva a imagem de uma torre cuidadosamente edificada sem apresentar como certa uma interpretação militar especulativa; a incerteza fica explícita em nota.
- source_word: אֶלֶף הַמָּגֵן
  choice: mil escudos
  rationale: O substantivo singular com o numeral tem valor coletivo; o plural em português é claro e idiomático.
- source_word: תָּלוּי עָלָיו
  choice: nela estão pendurados
  rationale: Expressa naturalmente o estado visual indicado pelo particípio hebraico. «Nela» retoma a torre na formulação portuguesa.
- source_word: שִׁלְטֵי הַגִּבּוֹרִים
  choice: os escudos menores dos guerreiros
  rationale: Mantém a distinção entre שֶׁלֶט e מָגֵן, entendendo o primeiro como outro tipo de escudo, possivelmente menor, e traduz גִּבּוֹרִים pelo termo moderno e contextual «guerreiros».
