base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/008.yaml
  text: Come with me from Lebanon[a], my bride; with me from Lebanon, come. Look from the summit of Amanah, from the summit of Senir and Hermon, from lions’ dens[b], from mountains of leopards.
translation:
  language: pt
  text: 'Venha comigo do Líbano, minha noiva;

    venha comigo do Líbano.


    Olhe[a] do cume do Amaná,

    do cume do Senir[b] e do Hermom,

    dos covis dos leões,

    das montanhas dos leopardos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desça”. O verbo hebraico é raro e pode referir-se a olhar desde as alturas; pelo contexto, alguns entendem que indica descer ou partir delas.
    reason: lexical_alternative
  - marker: b
    text: Senir é um nome antigo de parte da cordilheira do Hermom.
    reason: cultural_note
lexical_decisions:
- source_word: אִתִּי
  choice: comigo
  rationale: A preposição com sufixo de primeira pessoa significa naturalmente “comigo”; a repetição foi preservada como ênfase poética do convite.
- source_word: מִלְּבָנוֹן
  choice: do Líbano
  rationale: A preposição מִן indica procedência. “Do Líbano” conserva o movimento a partir desse lugar e o paralelismo repetido.
- source_word: כַּלָּה
  choice: minha noiva
  rationale: O substantivo designa a amada como noiva. O possessivo, embora implícito no vocativo hebraico, é natural em português e expressa a relação sem acrescentar uma interpretação doutrinária.
- source_word: תָּבוֹאִי
  choice: venha
  rationale: No contexto, a forma tem força de convite ou chamado. “Venha” é natural e evita definir a forma estritamente como futuro ou obrigação.
- source_word: תָּשׁוּרִי
  choice: olhe
  rationale: O verbo raro é mais provavelmente ligado ao sentido de olhar ou contemplar desde as alturas. A tradução mantém esse sentido no texto e registra em nota a possibilidade contextual de movimento ou descida.
- source_word: מֵרֹאשׁ
  choice: do cume de
  rationale: Embora רֹאשׁ signifique literalmente “cabeça”, em referência a montanhas “cume” é a expressão portuguesa precisa e idiomática.
- source_word: אֲמָנָה
  choice: Amaná
  rationale: Nome geográfico transliterado em forma natural para leitores de português.
- source_word: שְׂנִיר
  choice: Senir
  rationale: Nome geográfico antigo preservado por transliteração.
- source_word: חֶרְמוֹן
  choice: Hermom
  rationale: Forma portuguesa tradicional e reconhecível do nome geográfico.
- source_word: מִמְּעֹנוֹת אֲרָיוֹת
  choice: das cavernas dos leões
  rationale: מְעוֹנוֹת indica moradas ou covis. “Cavernas dos leões” comunica de modo claro e poético os locais perigosos onde eles habitam.
- source_word: מֵהַרְרֵי נְמֵרִים
  choice: das montanhas dos leopardos
  rationale: A construção nominal foi vertida diretamente, preservando a imagem poética e o paralelismo com as moradas dos leões.
theological_decisions:
- issue: Natureza do poema
  choice: Manter o chamado amoroso em seu sentido poético direto
  alternative: Introduzir no versículo uma identificação alegórica da noiva e do noivo
  rationale: O hebraico não explicita aqui uma interpretação alegórica; a tradução não acrescenta uma identificação teológica ou denominacional.
translation_notes:
  register: Português moderno, poético e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A repetição do convite e a sequência dos lugares foram preservadas. Os marcadores foram colocados junto aos termos que cada nota esclarece.
