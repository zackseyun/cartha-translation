  yaml_path: translation/ot/song_of_songs/004/013.yaml
  text: Your shoots are an orchard of pomegranates with choice fruits, henna with nards.
translation:
  language: pt
  text: 'Seus brotos são um pomar de romãs,

    com frutos excelentes,

    henas e nardos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁלָחַיִךְ
  choice: Seus brotos
  rationale: O termo pode designar brotos, rebentos ou aquilo que se estende. No contexto da imagem vegetal do pomar, “brotos” preserva a metáfora e permanece natural em português.
- source_word: פַּרְדֵּס
  choice: um pomar
  rationale: Refere-se a um parque, jardim ou pomar cultivado. “Pomar” combina diretamente com as romãs mencionadas e comunica a imagem com clareza.
- source_word: רִמּוֹנִים
  choice: romãs
  rationale: Equivalente direto e comum para o fruto mencionado.
- source_word: פְּרִי מְגָדִים
  choice: frutos excelentes
  rationale: A expressão indica frutos preciosos, agradáveis ou seletos. “Excelentes” conserva a avaliação positiva sem restringi-la indevidamente à raridade ou ao sabor.
- source_word: כְּפָרִים
  choice: henas
  rationale: Plural de כֹּפֶר no sentido botânico, a planta aromática Lawsonia inermis. “Henas” mantém o plural do hebraico e evita confusão com outros sentidos possíveis da raiz.
- source_word: נְרָדִים
  choice: nardos
  rationale: Plural da planta ou substância aromática conhecida como nardo. O plural português acompanha a forma hebraica e a enumeração botânica.
