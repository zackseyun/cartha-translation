base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/006.yaml
  text: Until the day breathes and the shadows flee[b][a], I will go to the mountain of myrrh and to the hill of frankincense.
translation:
  language: pt
  text: Até que o dia respire e as sombras fujam[a], irei[b] ao monte da mirra e à colina do olíbano.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Até que o dia sopre (ou fique fresco) e as sombras fujam”. A expressão pode evocar tanto a brisa do entardecer como o romper da manhã.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico também pode ser vertido literalmente como “irei para mim”. Esse pronome provavelmente acrescenta ênfase ou envolvimento pessoal, sem expressar necessariamente uma ideia distinta.
    reason: lexical_alternative
  - marker: c
    text: O olíbano é uma resina aromática usada como incenso.
    reason: lexical_clarification
lexical_decisions:
- source_word: עַד שֶׁיָּפוּחַ הַיּוֹם
  choice: Até que o dia respire
  rationale: Mantém a oração temporal e a personificação poética do hebraico. O verbo פוח pode significar “respirar” ou “soprar”, sem determinar por si só se a cena evoca a brisa do entardecer ou o romper da manhã.
- source_word: וְנָסוּ הַצְּלָלִים
  choice: e as sombras fujam
  rationale: Reproduz a imagem concreta de נוס, “fugir”, em vez de substituí-la pela interpretação menos figurada “desapareçam”.
- source_word: אֵלֶךְ לִי
  choice: irei
  rationale: אֵלֶךְ é “irei”; o pronome dativo לִי provavelmente acrescenta envolvimento pessoal ou ênfase, sem exigir uma expressão separada no texto principal.
- source_word: הַר הַמּוֹר
  choice: o monte da mirra
  rationale: Conserva literalmente a imagem do monte e o nome da resina aromática, sem impor uma identificação alegórica.
- source_word: גִּבְעַת הַלְּבוֹנָה
  choice: a colina do incenso
  rationale: Distingue גִּבְעָה, “colina”, do precedente הַר, “monte”. “Incenso” é a forma corrente e compreensível em português para a substância aromática לְבוֹנָה; a nota registra o termo mais específico “olíbano”.
theological_decisions:
- issue: Identificação do monte da mirra e da colina do incenso
  choice: Preservar as imagens poéticas sem identificar explicitamente seu referente
  alternative: Explicitar no texto uma metáfora erótica do corpo da amada ou uma interpretação simbólica ligada ao culto
  rationale: O hebraico oferece imagens sugestivas, mas não declara seu referente. A tradução mantém a tensão poética e evita incorporar uma leitura alegórica ou doutrinária específica.
- issue: Momento do dia sugerido pela respiração do dia e pela fuga das sombras
  choice: Manter a formulação ambígua no texto principal
  alternative: Traduzir especificamente como o romper da manhã ou como a brisa fresca do entardecer
  rationale: A expressão admite mais de uma compreensão contextual. Definir um único momento eliminaria uma ambiguidade real do original.
translation_notes:
  register: Português moderno, poético e acessível, com cadência solene sem arcaísmos. “Monte” e “colina” preservam o contraste do hebraico; “incenso” favorece a compreensão ampla, enquanto a nota fornece o termo botânico e litúrgico mais específico, “olíbano”.
