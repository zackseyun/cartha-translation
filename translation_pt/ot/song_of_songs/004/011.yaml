  terminology: «Mel do favo» mantém de forma adequada a distinção poética entre נֹפֶת e o posterior דְּבַשׁ; «fragrância», «vestes» e «Líbano» são escolhas apropriadas. As notas mantêm as âncoras e explicam as duas decisões lexicais relevantes.
