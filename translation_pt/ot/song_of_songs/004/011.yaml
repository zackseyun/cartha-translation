  text: נֹ֛פֶת תִּטֹּ֥פְנָה שִׂפְתוֹתַ֖יִ/ךְ כַּלָּ֑ה דְּבַ֤שׁ וְ/חָלָב֙ תַּ֣חַת לְשׁוֹנֵ֔/ךְ וְ/רֵ֥יחַ שַׂלְמֹתַ֖יִ/ךְ כְּ/רֵ֥יחַ לְבָנֽוֹן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/011.yaml
  text: Your lips drip honeycomb[a], bride; honey and milk are under your tongue[b], and the fragrance of your garments is like the fragrance of Lebanon.
translation:
  language: pt
  text: Teus lábios gotejam mel do favo[a], noiva; mel e leite estão debaixo da tua língua[b], e a fragrância das tuas vestes é como a fragrância do Líbano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «mel do favo que escorre». O termo hebraico נֹפֶת é mais específico que a palavra geral para «mel» usada em seguida.
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, «mel e leite», e não a expressão mais conhecida «leite e mel».
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹפֶת
  choice: mel do favo
  rationale: Distingue o mel que flui do favo do termo mais geral דְּבַשׁ, usado em seguida, e mantém a imagem poética em português natural.
- source_word: תִּטֹּפְנָה
  choice: destilam
  rationale: Expressa o gotejar ou fluir em gotas, com dicção poética natural aplicada aos lábios.
- source_word: שִׂפְתוֹתַיִךְ
  choice: seus lábios
  rationale: Equivalente direto e idiomático do plural com sufixo feminino de segunda pessoa.
- source_word: כַּלָּה
  choice: minha noiva
  rationale: Preserva a imagem nupcial e funciona como forma natural de tratamento; o possessivo é contextual, não lexical.
- source_word: דְּבַשׁ וְחָלָב
  choice: mel e leite
  rationale: Mantém a ordem hebraica, evitando substituí-la pela expressão bíblica mais conhecida «leite e mel».
- source_word: תַּחַת לְשׁוֹנֵךְ
  choice: debaixo da sua língua
  rationale: Preserva de modo claro e concreto a imagem sensual do hebraico.
- source_word: רֵיחַ
  choice: fragrância
  rationale: No contexto positivo, comunica um aroma agradável em registro poético digno.
- source_word: שַׂלְמֹתַיִךְ
  choice: suas vestes
  rationale: Traduz a referência às roupas exteriores com linguagem elevada, mas corrente.
- source_word: כְּרֵיחַ לְבָנוֹן
  choice: como a fragrância do Líbano
  rationale: Mantém literalmente a imagem geográfica e poética, sem explicitar cedros ou montanhas que o texto não nomeia.
