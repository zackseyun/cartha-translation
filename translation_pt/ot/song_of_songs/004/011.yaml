translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O verso conserva o paralelismo sensual, a ordem hebraica «mel e leite» e a distinção entre נֹפֶת e דְּבַשׁ. «Destilam» oferece dignidade poética sem soar arcaico; «minha noiva» é uma forma natural de vocativo em português.
