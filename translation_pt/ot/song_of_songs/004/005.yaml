  text: שְׁנֵ֥י שָׁדַ֛יִ/ךְ כִּ/שְׁנֵ֥י עֳפָרִ֖ים תְּאוֹמֵ֣י צְבִיָּ֑ה הָ/רוֹעִ֖ים בַּ/שּׁוֹשַׁנִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/005.yaml
  text: Your two breasts are like two fawns[a], twins of a gazelle, grazing among the lilies.
translation:
  language: pt
  text: Seus dois seios são como dois filhotes, gêmeos de uma gazela, que pastam entre os lírios.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁנֵי שָׁדַיִךְ
  choice: seus dois seios
  rationale: Mantém o numeral explícito do hebraico e o paralelismo com os dois filhotes.
- source_word: כִּשְׁנֵי
  choice: são como dois
  rationale: A preposição כְּ introduz a comparação; o verbo «são» é naturalmente suprido em português na oração nominal.
- source_word: עֳפָרִים
  choice: filhotes de gazela
  rationale: O substantivo designa crias de cervídeos ou gazelas. A formulação é clara em português e, junto de צְבִיָּה, sustenta a imagem recorrente da gazela no Cântico.
- source_word: תְּאוֹמֵי צְבִיָּה
  choice: gêmeos
  rationale: A construção significa literalmente «gêmeos de uma gazela». Como «filhotes de gazela» já identifica o animal, «gêmeos» preserva a simetria sem repetição pesada.
- source_word: הָרֹעִים
  choice: que pastam
  rationale: O particípio de רעה retrata os animais alimentando-se; «pastam» conserva a imagem pastoril e concorda naturalmente com os filhotes.
- source_word: בַּשּׁוֹשַׁנִּים
  choice: entre os lírios
  rationale: Traduz a designação floral convencional por «lírios» e emprega «entre» para expressar os animais no meio das flores.
