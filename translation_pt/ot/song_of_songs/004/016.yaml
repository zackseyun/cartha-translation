  text: ע֤וּרִי צָפוֹן֙ וּ/ב֣וֹאִי תֵימָ֔ן הָפִ֥יחִי גַנִּ֖/י יִזְּל֣וּ בְשָׂמָ֑י/ו יָבֹ֤א דוֹדִ/י֙ לְ/גַנּ֔/וֹ וְ/יֹאכַ֖ל פְּרִ֥י מְגָדָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/016.yaml
  text: Awake[a], north wind, and come, south wind! Blow on my garden, so that its spices may flow[c][b]. Let my beloved come into his garden and eat its choice fruits.
translation:
  language: pt
  text: Desperte, vento norte, e venha, vento sul! Sopre sobre o meu jardim, para que se espalhem os seus aromas.[a] Que o meu amado venha ao seu jardim[b] e coma os seus frutos excelentes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «para que fluam as suas especiarias» ou «para que exale o seu perfume». O hebraico pode indicar tanto substâncias aromáticas quanto o aroma que elas produzem.'
    reason: lexical_alternative
  - marker: b
    text: A mudança de «meu jardim» para «seu jardim» está no texto hebraico e expressa a linguagem de pertencimento mútuo entre os amantes.
    reason: cross_reference
lexical_decisions:
- source_word: ע֤וּרִי צָפוֹן֙
  choice: Desperte, vento norte
  rationale: O imperativo feminino singular personifica o norte; explicitar «vento» torna natural em português o agente que sopra, sem alterar a imagem.
- source_word: וּב֣וֹאִי תֵימָ֔ן
  choice: e venha, vento sul
  rationale: Mantém o imperativo simples «venha» e explicita o vento subentendido pelo paralelismo e pelo verbo seguinte.
- source_word: הָפִ֥יחִי גַנִּ֖י
  choice: Sopre sobre o meu jardim
  rationale: Expressa de modo idiomático a ação do vento sobre o jardim e conserva o possessivo da primeira pessoa.
- source_word: יִזְּל֣וּ בְשָׂמָ֑יו
  choice: para que se espalhem os seus aromas
  rationale: O verbo descreve algo que flui ou emana, e בְּשָׂמִים pode designar substâncias aromáticas ou o perfume que produzem. Em português, aromas que «se espalham» preserva naturalmente o efeito pretendido; a alternativa concreta é registrada em nota.
- source_word: יָבֹ֤א דוֹדִי֙
  choice: Que o meu amado venha
  rationale: A construção volitiva é representada naturalmente por «Que ... venha», e «meu amado» mantém o tom afetivo do poema.
- source_word: לְגַנּ֔וֹ
  choice: ao seu jardim
  rationale: Preserva a mudança intencional de «meu jardim» para «seu jardim» e traduz a preposição de direção sem forçar a distinção entre «a» e «para dentro de».
- source_word: וְיֹאכַ֖ל פְּרִ֥י מְגָדָֽיו
  choice: e coma os seus frutos excelentes
  rationale: Mantém literalmente a imagem de comer e traduz מֶגֶד como qualidade desejável ou excelente, sem introduzir um superlativo ausente.
theological_decisions:
- issue: Imagem erótica do jardim e mudança de posse
  choice: Manter a metáfora sensual e a passagem de «meu jardim» para «seu jardim», sem explicá-la alegoricamente.
  alternative: Tornar a alegoria explícita ou uniformizar os possessivos.
  rationale: O hebraico apresenta diretamente a linguagem íntima e a reciprocidade dos amantes. A tradução deve conservar essa tensão poética sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português atual, digno e poético, de ampla compreensão internacional e com leitura natural no Brasil. A personificação dos ventos e a sensualidade discreta da imagem foram preservadas.
