lexical_decisions:
- source_word: נֵרְדְּ
  choice: nardo
  rationale: Equivalente português tradicional e preciso para a planta ou substância aromática.
- source_word: כַרְכֹּם
  choice: açafrão
  rationale: Identificação lexical padrão da especiaria aromática valiosa.
- source_word: קָנֶה
  choice: cálamo
  rationale: No catálogo de perfumes, designa uma cana aromática; “cálamo” mantém essa identificação sem reduzi-la a uma cana genérica.
- source_word: קִנָּמוֹן
  choice: canela
  rationale: Equivalente português corrente e padrão para a especiaria.
- source_word: עִם כָּל עֲצֵי לְבוֹנָה
  choice: com todas as árvores de incenso
  rationale: Reproduz de perto a expressão hebraica coletiva e preserva a imagem das árvores, em vez de mencionar somente a resina.
- source_word: מֹר
  choice: mirra
  rationale: Equivalente português consagrado para a resina aromática.
- source_word: אֲהָלוֹת
  choice: aloés
  rationale: Preserva a designação bíblica tradicional, esclarecida em nota como madeira aromática, não aloe vera.
- source_word: רָאשֵׁי בְשָׂמִים
  choice: as especiarias mais finas
  rationale: Comunica naturalmente o sentido idiomático de “principais” ou “melhores” especiarias.
