  yaml_path: translation/ot/song_of_songs/004/012.yaml
  text: A locked garden is my sister[a], my bride; a locked spring[b], a sealed fountain.
translation:
  language: pt
  text: Um jardim trancado[a] é minha irmã, minha noiva; uma nascente trancada[b], uma fonte selada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fechado”, nas duas ocorrências de “trancado”.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico traduzido como “nascente” pode significar “monte” em outros contextos, mas aqui o paralelismo com “fonte” favorece o sentido de uma fonte de água.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּן
  choice: jardim
  rationale: O substantivo significa basicamente “jardim”. A ideia de acesso restrito é expressa pelo particípio seguinte, por isso não foi incorporada também ao substantivo.
- source_word: נָעוּל
  choice: trancado
  rationale: O particípio passivo indica algo fechado ou trancado. “Trancado” comunica de modo vívido a restrição de acesso e foi repetido nas duas ocorrências, acompanhando a repetição hebraica.
- source_word: אֲחֹתִי
  choice: minha irmã
  rationale: Embora funcione como tratamento amoroso em Cântico dos Cânticos, conserva-se o termo literal de parentesco e a peculiaridade poética do original.
- source_word: כַלָּה
  choice: minha noiva
  rationale: 'O termo significa “noiva”. O possessivo torna natural em português a sequência de tratamento em aposição: “minha irmã, minha noiva”.'
- source_word: גַּל
  choice: nascente
  rationale: Embora a mesma forma possa significar “monte” em outros contextos, o paralelismo com מַעְיָן favorece aqui a referência a uma fonte de água. “Nascente” expressa esse sentido sem antecipar a palavra “fonte” do membro seguinte.
- source_word: מַעְיָן
  choice: fonte
  rationale: O termo designa uma fonte ou nascente de água. “Fonte” preserva o paralelismo poético com “nascente” sem produzir repetição desnecessária em português.
- source_word: חָתוּם
  choice: selada
  rationale: O particípio passivo significa “selado”. A tradução direta mantém a imagem distinta de uma fonte protegida e complementa “trancada”.
