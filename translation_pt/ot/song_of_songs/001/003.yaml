lexical_decisions:
- source_word: לְרֵיחַ
  choice: A fragrância de
  rationale: רֵיחַ designa cheiro, aroma ou fragrância. “Fragrância” comunica naturalmente a avaliação positiva do contexto; a preposição לְ integra a sintaxe poética condensada.
- source_word: שְׁמָנֶיךָ
  choice: seus óleos
  rationale: O plural de שֶׁמֶן se refere provavelmente a óleos aromáticos ou unguentos. “Óleos” conserva a imagem concreta e a ligação lexical com o singular da cláusula seguinte.
- source_word: טוֹבִים
  choice: é agradável
  rationale: Embora o adjetivo hebraico esteja no plural e concorde formalmente com “óleos”, a formulação portuguesa avalia de modo natural a fragrância, preservando o sentido positivo de טוֹב.
- source_word: שֶׁמֶן תּוּרַק
  choice: como óleo derramado
  rationale: שֶׁמֶן significa “óleo”, e o Hofal תּוּרַק expressa o ato passivo de ser derramado. A inclusão de “como” torna explícita em português a metáfora nominal condensada do hebraico.
- source_word: שְׁמֶךָ
  choice: seu nome
  rationale: Mantém a referência explícita ao nome, que no poema evoca a pessoa e sua reputação sem dissolver a metáfora.
- source_word: עַל־כֵּן
  choice: por isso
  rationale: Expressa de forma atual e clara a relação de consequência ou fundamento indicada pela locução hebraica.
- source_word: עֲלָמוֹת
  choice: as jovens
  rationale: O termo designa moças ou mulheres jovens em idade de casar, sem exigir por si só a especificação de virgindade. “As jovens” é natural, conciso e não sobreinterpreta.
- source_word: אֲהֵבוּךָ
  choice: amam você
  rationale: O perfeito de אָהַב é entendido aqui como afirmação poética de uma realidade presente ou geral. “Amam você” é claro no português contemporâneo e mantém a segunda pessoa masculina.
