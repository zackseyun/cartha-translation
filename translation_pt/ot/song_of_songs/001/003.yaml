translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Preserva-se a repetição de “óleo/óleos” e a metáfora do nome fragrante. “Você” oferece tratamento natural no português brasileiro contemporâneo; os possessivos não ambíguos mantêm claro que a fala se dirige ao amado.
