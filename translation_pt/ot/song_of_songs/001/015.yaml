  text: Look[a], you are beautiful, my beloved; look, you are beautiful—your eyes are doves.
translation:
  language: pt
  text: 'Veja como você é linda, minha amada!

    Veja como você é linda!

    Seus olhos são pombas.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Seus olhos são como pombas”. O hebraico expressa a imagem de modo conciso: “Seus olhos são pombas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנָּךְ
  choice: Veja como você é
  rationale: A partícula dêitica/exclamativa הִנֵּה com sufixo feminino singular chama a atenção para a pessoa diante do falante. “Veja como você é” transmite a admiração direta em português atual, sem o tom arcaico de “eis que”.
- source_word: יָפָה
  choice: linda
  rationale: O adjetivo descreve beleza e atração. “Linda” é natural numa declaração amorosa contemporânea e mantém a força afetiva do elogio.
- source_word: רַעְיָתִי
  choice: minha amada
  rationale: No Cântico dos Cânticos, o termo funciona como tratamento íntimo dirigido à mulher amada. “Minha amada” preserva tanto a afeição quanto a forma nominal do vocativo.
- source_word: הִנָּךְ יָפָה
  choice: Veja como você é linda
  rationale: A expressão é repetida no hebraico; a tradução conserva integralmente essa repetição enfática e poética.
- source_word: עֵינַיִךְ
  choice: Seus olhos
  rationale: Equivalência direta da forma com sufixo feminino singular de segunda pessoa.
- source_word: יוֹנִים
  choice: pombas
  rationale: O hebraico apresenta uma metáfora nominal breve, literalmente “seus olhos [são] pombas”. A tradução mantém essa imagem compacta, deixando a formulação comparativa explícita como alternativa em nota.
