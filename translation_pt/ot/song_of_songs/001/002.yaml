translation:
  language: pt
  text: Que ele me beije com os beijos da boca dele, pois o teu amor[a] é melhor do que o vinho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as tuas carícias são melhores do que o vinho”. O hebraico emprega um substantivo plural que também pode designar manifestações concretas de amor ou carícias.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׁקֵנִי
  choice: Que ele me beije
  rationale: O imperfeito qal na terceira pessoa masculina com sufixo de primeira pessoa singular expressa aqui desejo ou anseio; a construção com “que” comunica naturalmente essa nuance volitiva em português.
- source_word: מִנְּשִׁיקוֹת
  choice: com os beijos
  rationale: Embora מִן tenha como sentido básico “de”, neste contexto pode ter valor instrumental ou partitivo. “Com os beijos” preserva a imagem concreta e soa natural em português.
- source_word: פִּיהוּ
  choice: da sua boca
  rationale: Tradução direta da expressão hebraica, mantendo sem atenuação a concretude sensual da poesia.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão do desejo expresso na oração anterior e conserva a ligação causal em registro poético natural.
- source_word: טוֹבִים
  choice: é melhor
  rationale: O adjetivo hebraico está no plural para concordar com דֹּדֶיךָ. Como “amor” é empregado em português como nome abstrato singular, “é melhor” oferece a concordância idiomática adequada.
- source_word: דֹּדֶיךָ
  choice: o seu amor
  rationale: O plural hebraico pode indicar amor, manifestações de afeto ou carícias. “O seu amor” é natural em português e preserva a amplitude semântica, enquanto a alternativa mais concreta é registrada em nota.
- source_word: מִיָּיִן
  choice: do que o vinho
  rationale: Depois de טוֹבִים, a preposição מִן introduz a comparação; “do que o vinho” é a formulação idiomática em português.
