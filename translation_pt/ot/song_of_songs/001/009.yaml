  text: לְ/סֻסָתִ/י֙ בְּ/רִכְבֵ֣י פַרְעֹ֔ה דִּמִּיתִ֖י/ךְ רַעְיָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/009.yaml
  text: I compare you[a], my beloved, to my mare among Pharaoh’s chariots.
translation:
  language: pt
  text: Eu comparo você, minha amada, à minha égua[a] entre os carros de guerra do faraó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a uma égua”. Embora o hebraico tenha literalmente o sufixo possessivo “minha”, ele pode ser entendido com menor destaque dentro da comparação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְסֻסָתִי
  choice: à minha égua
  rationale: סוּסָה é um substantivo feminino singular, “égua”, e o sufixo da primeira pessoa indica “minha”. A forma feminina é relevante para a imagem poética e deve ser preservada. A nota registra a possibilidade de entender o possessivo de modo menos destacado na expressão comparativa.
- source_word: בְּרִכְבֵי פַרְעֹה
  choice: entre os carros de guerra do faraó
  rationale: רִכְבֵי é o plural construto de “carro de guerra/carruagem de guerra”. Com בְּ, “entre” expressa naturalmente a posição ou associação da égua no meio dos carros reais. “Carros de guerra” evita que o leitor moderno entenda simples automóveis.
- source_word: דִּמִּיתִיךְ
  choice: Eu comparo você
  rationale: A forma piel perfeita com sufixo feminino significa “comparei/comparo você”. O presente português comunica com naturalidade o ato poético de estabelecer a comparação, sem impor uma anterioridade temporal que o contexto não exige.
- source_word: רַעְיָתִי
  choice: minha amada
  rationale: No Cântico dos Cânticos, o termo funciona como tratamento íntimo dirigido à mulher amada. “Minha amada” preserva tanto o afeto quanto o registro poético e digno.
theological_decisions: []
translation_notes:
  register: Português atual, poético e acessível, com ordem sintática natural. “Carros de guerra” explicita o referente antigo de modo claro, enquanto “faraó” permanece como título em minúscula.
