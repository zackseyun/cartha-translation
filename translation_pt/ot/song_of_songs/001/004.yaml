  to: Atraia-me[a]; corramos atrás de você! O rei me levou aos seus aposentos. Exultaremos e nos alegraremos em você; celebraremos o seu amor[b] mais do que o vinho. Com razão amam você[c].
  rationale: 'A revisão restaura a imagem e a sintaxe do hebraico: o amado é solicitado a atrair a mulher, e então o grupo declara que correrá atrás dele. Mantém-se a leitura perfeita de “me levou”, o registro poético e a ambiguidade literária de “o rei”. As notas foram separadas e reposicionadas para que cada marcador corresponda à alternativa que explica. A tradução coletiva “o seu amor” evita restringir indevidamente דֹדֶיךָ a contato físico, enquanto a nota preserva “carícias” como opção legítima.'
  reviewer_model: gpt-5.6-terra
