  text: מָשְׁכֵ֖/נִי אַחֲרֶ֣י/ךָ נָּר֑וּצָה הֱבִיאַ֨/נִי הַ/מֶּ֜לֶךְ חֲדָרָ֗י/ו נָגִ֤ילָה וְ/נִשְׂמְחָה֙ בָּ֔/ךְ נַזְכִּ֤ירָה דֹדֶ֨י/ךָ֙ מִ/יַּ֔יִן מֵישָׁרִ֖ים אֲהֵבֽוּ/ךָ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/004.yaml
  text: Draw me after you[a]; let us run. The king has brought me into his chambers. We will rejoice and be glad in you; we will extol your love more than wine[b]. Rightly do they love you.
translation:
  language: pt
  text: Atraia-me[a]; corramos atrás de você! O rei me levou aos seus aposentos. Exultaremos e nos alegraremos em você; celebraremos o seu amor[b] mais do que o vinho. Com razão amam você[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Puxe-me”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “recordaremos”, “mencionaremos” ou “proclamaremos o seu amor”. “Suas carícias” também é possível.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “Os íntegros amam você”. O hebraico מֵישָׁרִים pode ser entendido adverbialmente (“com razão”) ou como substantivo (“os íntegros”).'
    reason: alternative_reading
lexical_decisions:
- source_word: מָשְׁכֵנִי
  choice: Leve-me com você
  rationale: O verbo משׁך significa literalmente “puxar, atrair”. Em português, “leve-me com você” expressa com naturalidade o apelo amoroso e se liga de modo fluente a “corramos”, sem reduzir o sentido a atração meramente psicológica.
- source_word: אַחֲרֶיךָ נָּרוּצָה
  choice: com você; corramos
  rationale: Preserva a passagem do objeto singular (“me”) para a primeira pessoa do plural (“corramos”) e traduz a nuance volitiva do coortativo.
- source_word: הֱבִיאַנִי
  choice: me levou
  rationale: A forma é entendida como perfeito, indicando ação realizada, e não como pedido ou desejo.
- source_word: הַמֶּלֶךְ
  choice: O rei
  rationale: Tradução direta, sem acrescentar identificação divina, messiânica ou histórica não explícita no verso.
- source_word: חֲדָרָיו
  choice: aos seus aposentos
  rationale: “Aposentos” comunica os cômodos interiores e mantém o tom poético e íntimo.
- source_word: נָגִילָה וְנִשְׂמְחָה
  choice: Exultaremos e nos alegraremos
  rationale: Mantém os dois verbos paralelos de celebração e sua forma de primeira pessoa do plural.
- source_word: בָּךְ
  choice: em você
  rationale: Conserva a referência pessoal direta e a flexibilidade da preposição ב como esfera ou motivo da alegria.
- source_word: נַזְכִּירָה
  choice: celebraremos
  rationale: O verbo básico é “lembrar, mencionar”; no contexto, “celebraremos” transmite naturalmente a ideia de recordar ou proclamar com apreço, sem limitar indevidamente a opção lexical.
- source_word: דֹדֶיךָ
  choice: suas carícias
  rationale: O plural דֹדִים pode indicar manifestações de amor, afeto erótico ou carícias. O plural concreto preserva melhor aqui a forma hebraica e o caráter amoroso do poema.
- source_word: מִיַּיִן
  choice: mais do que o vinho
  rationale: Expressa a comparação contextual de preferência ou superioridade.
- source_word: מֵישָׁרִים
  choice: Com razão
  rationale: Toma o termo adverbialmente, no sentido de “justamente, com boa razão”, em português corrente e digno.
- source_word: אֲהֵבוּךָ
  choice: amam você
  rationale: O perfeito poético é entendido como realidade geral presente; a terceira pessoa do plural indefinida é mantida.
theological_decisions:
- issue: Identidade de “o rei”
  choice: Manter “O rei” como figura literária do poema, sem identificação teológica explícita.
  alternative: Entendê-lo alegoricamente como Deus ou como o Messias/Cristo.
  rationale: O texto hebraico deste verso não exige nenhuma dessas identificações; explicitá-las resolveria interpretativamente uma questão deixada em aberto.
- issue: Sentido de מֵישָׁרִים
  choice: 'Leitura adverbial: “Com razão”.'
  alternative: 'Leitura substantiva: “Os íntegros amam você”.'
  rationale: As duas análises são possíveis; a leitura adverbial produz uma conclusão natural no contexto, enquanto a alternativa genuína é preservada em nota.
translation_notes:
  register: Português moderno, poético e amplamente compreensível, com boa legibilidade brasileira. Mantém a alternância singular/plural do hebraico e evita linguagem excessivamente arcaica. “Você” preserva a distinção de número no português brasileiro e combina naturalmente com os possessivos “suas” e “seus”.
