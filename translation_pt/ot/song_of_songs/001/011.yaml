base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/011.yaml
  text: We will make for you ornaments of gold[b][a], with studs of silver.
translation:
  language: pt
  text: Faremos para você adornos de ouro[a], com detalhes de prata[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “correntes de ouro” ou “fileiras de ouro”; o termo hebraico provavelmente designa algum tipo de adorno ou peça de joalheria, mas sua forma exata é incerta.
    reason: lexical_alternative
  - marker: b
    text: Ou “contas de prata”, “pontos de prata” ou “lantejoulas de prata”; o hebraico se refere a pequenos elementos decorativos de prata.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרֵי
  choice: adornos
  rationale: O termo plural designa algum tipo de peça ornamental ou joia, mas sua forma exata é incerta. “Adornos” preserva o sentido no contexto sem especificar indevidamente correntes, fileiras ou diademas.
- source_word: זָהָב
  choice: ouro
  rationale: Tradução direta do nome do metal que constitui os adornos.
- source_word: נַעֲשֶׂה
  choice: faremos
  rationale: O imperfeito qal na primeira pessoa do plural expressa naturalmente, neste contexto, uma intenção ou promessa futura. “Façamos” continua possível, mas é menos provável.
- source_word: לָּךְ
  choice: para você
  rationale: A preposição com sufixo feminino singular indica que os adornos serão feitos para a mulher a quem se dirige a fala.
- source_word: עִם
  choice: com
  rationale: Liga os adornos de ouro aos pequenos elementos decorativos de prata.
- source_word: נְקֻדּוֹת
  choice: detalhes
  rationale: O substantivo se refere a pequenos pontos ou elementos decorativos. “Detalhes” é natural em português e evita definir como contas, lantejoulas ou incrustações aquilo cuja forma exata permanece incerta.
- source_word: הַכָּסֶף
  choice: prata
  rationale: Tradução direta do nome do metal; o artigo hebraico não precisa ser reproduzido nesta construção em português.
