base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/008.yaml
  text: If you do not know[a], most beautiful among women, go out for yourself in the tracks of the flock[b], and pasture your young goats beside the shepherds’ tents.
translation:
  language: pt
  text: Se você não sabe, ó mais bela entre as mulheres, saia seguindo as pegadas do rebanho[a] e faça suas cabritinhas pastarem junto às tendas dos pastores[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vá atrás do rebanho”. O hebraico diz literalmente “nas pegadas do rebanho”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “apascenta suas cabritinhas junto às moradas dos pastores”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא תֵדְעִי
  choice: Se você não sabe
  rationale: 'A combinação condicional אִם לֹא com o verbo ידע expressa uma condição real: “se você não sabe”. No contexto, trata-se de não saber aonde ir ou o que fazer.'
- source_word: הַיָּפָה בַּנָּשִׁים
  choice: ó mais bela entre as mulheres
  rationale: O adjetivo seguido de בְּ e um grupo plural tem valor superlativo. A partícula “ó” torna explícito o vocativo e produz uma formulação natural e digna em português.
- source_word: צְאִי לָךְ
  choice: saia
  rationale: O imperativo feminino צְאִי significa “saia”. O dativo reflexivo לָךְ acrescenta envolvimento pessoal, mas traduzi-lo literalmente como “para você mesma” seria pouco natural; o contexto e o imperativo já comunicam adequadamente essa nuance.
- source_word: בְּעִקְבֵי הַצֹּאן
  choice: seguindo as pegadas do rebanho
  rationale: עִקְבֵי designa pegadas, rastros ou calcanhares. “Seguindo as pegadas” preserva a imagem concreta e expressa naturalmente a ideia de avançar pelo caminho marcado pelo rebanho.
- source_word: וּרְעִי
  choice: leve ... para pastar
  rationale: O imperativo de רעה aqui significa apascentar ou fazer pastar. A construção portuguesa “levar para pastar” é clara e natural com cabritinhas como objeto.
- source_word: גְּדִיֹּתַיִךְ
  choice: suas cabritinhas
  rationale: O termo designa cabritos jovens, em forma feminina. “Cabritinhas” conserva tanto a espécie quanto o gênero e a juventude dos animais, sem a ambiguidade de “crias”.
- source_word: עַל מִשְׁכְּנוֹת הָרֹעִים
  choice: junto às tendas dos pastores
  rationale: מִשְׁכְּנוֹת são moradas ou lugares de habitação; no cenário pastoril, “tendas” é a expressão contextual mais concreta. עַל pode indicar proximidade espacial, aqui traduzida por “junto a”.
