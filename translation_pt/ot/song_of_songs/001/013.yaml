  text: My beloved is to me a sachet of myrrh[c][b][a]; he lies between my breasts.
translation:
  language: pt
  text: O meu amado é para mim um sachê de mirra[a]; entre os meus seios, ele passa a noite.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um pacotinho de mirra”. O hebraico צְרוֹר indica um pequeno embrulho ou saquinho; “sachê” expressa aqui a ideia de um recipiente perfumado usado junto ao corpo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ele repousa entre os meus seios”. O verbo hebraico pode significar “alojar-se” ou “passar a noite”, intensificando a imagem íntima.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צְרוֹר
  choice: sachê
  rationale: Designa um pequeno embrulho ou saquinho. Com mirra e junto ao corpo, “sachê” comunica naturalmente um pequeno recipiente perfumado, embora “pacotinho” também seja possível.
- source_word: הַמֹּר
  choice: mirra
  rationale: É a designação portuguesa consagrada para a resina aromática מור e preserva a referência concreta ao perfume.
- source_word: דּוֹדִי
  choice: o meu amado
  rationale: No Cântico dos Cânticos, דּוֹדִי designa o homem amado em contexto romântico; “meu amado” mantém afeto, intimidade e dignidade poética.
- source_word: לִי
  choice: para mim
  rationale: 'Preserva a relação pessoal expressa pela preposição e forma uma comparação idiomática em português: “é para mim”.'
- source_word: בֵּין
  choice: entre
  rationale: Mantém o sentido espacial direto da imagem corporal.
- source_word: שָׁדַי
  choice: os meus seios
  rationale: Traduz explicitamente o referente anatômico do hebraico, sem o suavizar para “colo” ou “peito”.
- source_word: יָלִין
  choice: ele passa a noite
  rationale: O verbo לין significa alojar-se ou passar a noite. A forma masculina permite retomar “o meu amado”, ao mesmo tempo que sustenta a metáfora do sachê mantido junto ao corpo durante a noite.
