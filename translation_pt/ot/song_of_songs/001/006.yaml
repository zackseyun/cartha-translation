base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/006.yaml
  text: Do not stare at me because I am dark[a], because the sun has scorched me. My mother’s sons were angry with me; they made me keeper of the vineyards[d][c][b], but my own vineyard I have not kept.
translation:
  language: pt
  text: Não olhem fixamente para mim porque sou escura[a], pois o sol me queimou[b]. Os filhos de minha mãe[c] ficaram irados comigo; puseram-me para guardar as vinhas, mas não guardei a minha própria vinha[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porque sou negra”. O adjetivo hebraico descreve uma aparência ou tez muito escura.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pois o sol me abrasou”. O verbo hebraico refere-se ao efeito abrasador do sol.'
    reason: lexical_alternative
  - marker: c
    text: A expressão específica “filhos de minha mãe” pode referir-se aos irmãos da mulher, preservando uma possível nuance de distanciamento.
    reason: lexical_alternative
  - marker: d
    text: “Minha própria vinha” provavelmente é uma metáfora, mas o texto hebraico não esclarece seu referente exato.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּרְאוּנִי
  choice: Não olhem fixamente para mim
  rationale: O hebraico significa literalmente “não olhem para mim”. “Olhem fixamente” comunica, em português natural, a ideia contextual de um olhar insistente ou avaliador sem transformar o verbo em uma paráfrase excessiva.
- source_word: שְׁחַרְחֹרֶת
  choice: escura
  rationale: O adjetivo descreve a aparência ou tez escura da mulher. “Escura” preserva o sentido básico e evita impor uma identificação étnica não expressa pelo texto.
- source_word: שֶׁשֱּׁזָפַתְנִי הַשָּׁמֶשׁ
  choice: pois o sol me queimou
  rationale: Neste contexto, o verbo indica o efeito abrasador do sol sobre a aparência da mulher. “Queimou” é claro e corrente, embora a expressão hebraica também tenha sido entendida literalmente como o sol ter olhado para ela.
- source_word: בְּנֵי אִמִּי
  choice: Os filhos de minha mãe
  rationale: A tradução formal preserva a formulação específica do hebraico e sua possível nuance de distanciamento, em vez de reduzi-la simplesmente a “meus irmãos”.
- source_word: נִחֲרוּ בִי
  choice: ficaram irados comigo
  rationale: O verbo retrata a ira como algo aceso ou inflamado. “Ficaram irados comigo” transmite o sentido com clareza e dignidade em português atual.
- source_word: שָׂמֻנִי נֹטֵרָה אֶת־הַכְּרָמִים
  choice: puseram-me para guardar as vinhas
  rationale: A construção indica que os filhos da mãe lhe impuseram a função de guardar ou vigiar vinhas. A formulação mantém tanto a ação causativa quanto o caráter laboral da tarefa.
- source_word: כַּרְמִי שֶׁלִּי
  choice: a minha própria vinha
  rationale: O possessivo enfático do hebraico é representado naturalmente por “minha própria”, preservando o contraste com “as vinhas” alheias.
- source_word: לֹא נָטָרְתִּי
  choice: não guardei
  rationale: “Guardei” repete a mesma raiz verbal usada anteriormente e mantém aberta a possível dimensão metafórica da vinha, sem especificar cuidar, cultivar ou proteger.
theological_decisions:
- issue: Sentido metafórico de “minha própria vinha”
  choice: Manter literalmente a imagem da vinha no texto principal, sem identificar seu referente.
  alternative: Explicar a vinha como o corpo ou a aparência da mulher, sua vida pessoal ou sua castidade.
  rationale: Embora a vinha provavelmente tenha força metafórica, o hebraico não declara com precisão o que ela representa. Preservar a imagem conserva a ambiguidade poética e evita impor uma interpretação teológica ou sexual específica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível. A sintaxe poética foi mantida sem arcaísmos; a repetição de “guardar” preserva a ligação lexical e o contraste do original.
