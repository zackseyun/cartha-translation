base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/016.yaml
  text: Look[a], you are beautiful, my beloved—indeed, pleasant! Indeed, our couch is luxuriant.
translation:
  language: pt
  text: Veja como você é belo, meu amado — sim, encantador! Sim, o nosso leito é verdejante.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o nosso leito é verde” ou “viçoso”. O adjetivo hebraico sugere literalmente frescor ou verdor, provavelmente evocando um cenário natural exuberante.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְּךָ
  choice: Veja como você é
  rationale: A partícula dêitica com sufixo masculino singular chama vividamente a atenção para o amado. “Veja como você é” soa natural em português moderno e conserva a força exclamativa.
- source_word: יָפֶה
  choice: belo
  rationale: O adjetivo expressa beleza ou atratividade. “Belo” concorda com o destinatário masculino e mantém o registro poético.
- source_word: דוֹדִי
  choice: meu amado
  rationale: No Cântico dos Cânticos, o termo designa o amante como objeto de afeto. “Meu amado” é claro, digno e poeticamente apropriado.
- source_word: אַף
  choice: sim
  rationale: Nas duas ocorrências, a partícula tem força enfática e aditiva. A repetição de “sim” preserva a intensificação do hebraico sem tornar a frase pesada.
- source_word: נָעִים
  choice: encantador
  rationale: O adjetivo comunica agrado, encanto e deleite. “Encantador” aplica-se naturalmente ao amado e distingue esta qualidade de sua beleza.
- source_word: עַרְשֵׂנוּ
  choice: o nosso leito
  rationale: O substantivo pode indicar cama, divã ou lugar de repouso. “Leito” mantém a imagem poética sem eliminar possíveis conotações íntimas nem restringir o objeto a um móvel específico.
- source_word: רַעֲנָנָה
  choice: verdejante
  rationale: O adjetivo sugere frescor, verdor e vegetação viçosa. “Verdejante” conserva a imagem incomum do hebraico e evoca plausivelmente um cenário natural exuberante.
theological_decisions: []
translation_notes:
  register: Português moderno, poético e acessível, com concordância masculina para o amado. A repetição enfática de “sim” reflete as duas ocorrências de אַף, e “verdejante” preserva a imagem vegetal deliberadamente incomum.
