base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/005.yaml
  text: I am dark[a], yet lovely, daughters of Jerusalem, like the tents of Kedar, like the curtains of Solomon.
translation:
  language: pt
  text: Sou escura, mas[a] bela, ó filhas de Jerusalém, como as tendas de Quedar, como as cortinas de Salomão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Sou escura e bela”. A conjunção hebraica significa literalmente “e”; “mas” expressa o provável contraste no contexto.'
    reason: alternative_reading
lexical_decisions:
- source_word: שְׁחוֹרָה
  choice: morena
  rationale: O adjetivo descreve coloração escura. Em português, “morena” comunica com naturalidade a pele escurecida da mulher no contexto imediato, sem especificar etnia; a nota registra a alternativa mais literal “escura”.
- source_word: וְנָאוָה
  choice: mas bela
  rationale: Embora ו seja normalmente coordenativo (“e”), o contexto sugere contraste com uma possível avaliação negativa da aparência escura. “Mas bela” expressa esse valor adversativo em português corrente, preservando-se “e bela” na nota.
- source_word: בְּנוֹת יְרוּשָׁלִָם
  choice: ó filhas de Jerusalém
  rationale: A tradução direta mantém a forma poética de tratamento. O vocativo “ó” torna clara e natural a interpelação em português.
- source_word: כְּאָהֳלֵי קֵדָר
  choice: como as tendas de Quedar
  rationale: Mantém diretamente o símile e o topônimo tradicional em português; as tendas de Quedar evocam a coloração escura sem explicitar essa associação no texto.
- source_word: כִּירִיעוֹת שְׁלֹמֹה
  choice: como as cortinas de Salomão
  rationale: “Cortinas” é uma tradução clara e acessível de יְרִיעוֹת, termo que também pode designar panos ou cortinas de tenda, sem acrescentar ao texto uma especificação incerta.
theological_decisions:
- issue: Valor da conjunção ו antes de נָאוָה
  choice: 'valor adversativo: “mas bela”'
  alternative: 'coordenação simples: “e bela”'
  rationale: A conjunção hebraica significa formalmente “e”, mas o contexto pode implicar contraste entre a pele escura da mulher e a avaliação de sua beleza. A tradução principal comunica esse contraste provável, enquanto a nota preserva a ambiguidade gramatical.
translation_notes:
  register: Português moderno, digno e poético, com leitura natural no Brasil e ampla inteligibilidade internacional. “Morena” foi preferido no texto por sua naturalidade contextual, enquanto a alternativa mais formal foi preservada em nota.
