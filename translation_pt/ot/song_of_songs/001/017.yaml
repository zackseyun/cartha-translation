  text: As vigas de nossa casa[a] são cedros; nossas traves[b] são ciprestes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “nossas casas”; a forma hebraica está no plural, embora possa ter sentido coletivo: “nossa casa” ou “nosso lar”.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico traduzido por “traves” é incerto; também pode indicar revestimentos de madeira ou galerias.
    reason: lexical_alternative
  - marker: c
    text: Ou “zimbros” ou “abetos”; a identificação exata da árvore é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹרוֹת
  choice: vigas
  rationale: Designa madeiras estruturais, provavelmente vigas do teto; “vigas” é natural em português e mantém o paralelismo arquitetônico.
- source_word: בָּתֵּינוּ
  choice: nossa casa
  rationale: Embora a forma hebraica seja morfologicamente plural, neste contexto poético pode ter sentido coletivo e indicar a morada compartilhada dos amantes.
- source_word: אֲרָזִים
  choice: cedros
  rationale: Tradução direta do substantivo plural, aqui empregado para caracterizar a madeira das vigas.
- source_word: רַחִיטֵנוּ
  choice: nossas traves
  rationale: O termo arquitetônico é incerto; “traves” mantém a referência geral a elementos estruturais e evita repetir “vigas”.
- source_word: בְּרוֹתִים
  choice: ciprestes
  rationale: A identificação botânica é discutida; “ciprestes” é uma tradução tradicional e plausível no contexto de madeira para construção.
