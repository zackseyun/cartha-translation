  text: עַד שֶׁ֤/הַ/מֶּ֨לֶךְ֙ בִּ/מְסִבּ֔/וֹ נִרְדִּ֖/י נָתַ֥ן רֵיחֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/012.yaml
  text: While the king was at his table[b][a], my nard gave its fragrance.
translation:
  language: pt
  text: Enquanto o rei estava à sua mesa[a], meu nardo[b] exalava sua fragrância.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em seu banquete” ou “em seu divã”. O termo hebraico pode indicar o ambiente de um banquete ou pessoas reclinadas para uma refeição.'
    reason: lexical_alternative
  - marker: b
    text: 'Tradicionalmente: “espicanardo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: Enquanto
  rationale: Embora עַד frequentemente signifique “até”, aqui introduz de modo natural a circunstância temporal durante a qual o nardo exala sua fragrância.
- source_word: שֶׁהַמֶּלֶךְ
  choice: o rei
  rationale: A expressão é definida e, no sentido literário imediato do poema, designa o amado como rei, sem exigir a importação de uma leitura messiânica.
- source_word: בִּמְסִבּוֹ
  choice: à sua mesa
  rationale: מְסִבָּה pode indicar a mesa, o ambiente de um banquete ou o lugar onde se reclina. “À sua mesa” é claro e idiomático, mantendo a imagem de uma refeição sem especificá-la em excesso.
- source_word: נִרְדִּי
  choice: meu nardo
  rationale: O termo designa o nardo, planta ou essência aromática valiosa; o sufixo de primeira pessoa é conservado em “meu”.
- source_word: נָתַן רֵיחוֹ
  choice: exalava sua fragrância
  rationale: A expressão hebraica diz literalmente que o nardo “deu sua fragrância”. “Exalava sua fragrância” comunica naturalmente em português a emissão contínua do aroma no cenário descrito.
theological_decisions:
- issue: Se “rei” deve ser grafado com inicial maiúscula como título teológico ou messiânico
  choice: “rei” com inicial minúscula, como referente poético e literário
  alternative: “Rei”, sugerindo uma leitura teológica ou tipológica
  rationale: O hebraico não exige aqui um título divino ou messiânico. A tradução mantém o sentido imediato do poema sem impor uma interpretação alegórica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Nardo” preserva o termo botânico tradicional em forma atual; “exalava sua fragrância” reproduz de modo natural a imagem sensorial e o aspecto contextual da frase.
