base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/007.yaml
  text: Tell me[a], you whom my soul loves, where you pasture your flock, where you make it lie down at noon; for why should I be like one who veils herself beside the flocks of your companions?
translation:
  language: pt
  text: 'Diga-me, você a quem minha alma ama: onde você apascenta o rebanho? Onde o faz repousar ao meio-dia? Pois por que eu seria como uma mulher que se cobre com um véu[a] junto aos rebanhos dos teus companheiros?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como quem vagueia” junto aos rebanhos dos teus companheiros. A expressão hebraica pode indicar uma mulher que se cobre com um véu ou, por interpretação contextual, alguém que anda de um lado para outro à procura do amado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּידָה לִּי
  choice: Diga-me
  rationale: Traduz diretamente o imperativo de נגד com objeto indireto de primeira pessoa, em português natural e digno.
- source_word: שֶׁאָהֲבָה נַפְשִׁי
  choice: você a quem minha alma ama
  rationale: Conserva o idioma poético com נֶפֶשׁ, em vez de reduzi-lo simplesmente a “a quem amo”.
- source_word: אֵיכָה
  choice: onde
  rationale: No paralelismo pastoral, a pergunta diz respeito ao lugar em que o rebanho é apascentado e posto a repousar.
- source_word: תִרְעֶה
  choice: você apascenta o rebanho
  rationale: רעה pode significar pastorear ou apascentar. “O rebanho” é explicitado por clareza, embora esteja implícito no hebraico.
- source_word: תַּרְבִּיץ
  choice: o faz repousar
  rationale: Preserva o valor causativo do hifil de רבץ; o pronome singular retoma “o rebanho” como coletivo.
- source_word: בַּצָּהֳרָיִם
  choice: ao meio-dia
  rationale: Equivalente temporal direto e idiomático em português.
- source_word: שַׁלָּמָה אֶהְיֶה
  choice: Pois por que eu seria
  rationale: A formulação mantém tanto a força explicativa da oração quanto o caráter retórico e potencial do imperfeito.
- source_word: כְּעֹטְיָה
  choice: como uma mulher que se cobre com um véu
  rationale: Deriva do sentido lexical comum de עטה, “cobrir-se, envolver-se”. A leitura contextual “como quem vagueia” é mantida em nota devido à ambiguidade interpretativa.
- source_word: עַל עֶדְרֵי חֲבֵרֶיךָ
  choice: junto aos rebanhos dos seus companheiros
  rationale: “Junto a” expressa naturalmente o valor espacial de עַל, e “companheiros” preserva o sentido relacional de חֲבֵרִים.
