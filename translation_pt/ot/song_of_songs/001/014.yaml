  text: My beloved is to me a cluster of henna blossoms in the vineyards of En-gedi[a].
translation:
  language: pt
  text: O meu amado é para mim um cacho de flores de hena[a] nas vinhas de En-Gedi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «cânfora», em traduções tradicionais; o termo hebraico provavelmente designa a hena, planta apreciada por suas flores perfumadas.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁכֹּל
  choice: um cacho
  rationale: O substantivo indica um cacho ou agrupamento, muitas vezes de uvas; aqui se refere ao conjunto de flores da hena. «Cacho» preserva de modo concreto a imagem poética.
- source_word: הַכֹּפֶר
  choice: flores de hena
  rationale: O termo provavelmente designa a hena (Lawsonia inermis), conhecida por suas flores perfumadas. A explicitação de «flores» torna natural em português a combinação com «cacho» e corresponde ao contexto poético.
- source_word: דּוֹדִי
  choice: o meu amado
  rationale: No Cântico dos Cânticos, o termo designa o homem amado. «Meu amado» mantém o tom afetivo e poético sem introduzir uma nuance indevidamente sexualizada.
- source_word: לִי
  choice: é para mim
  rationale: A preposição expressa relação pessoal ou apreciação. «É para mim» conserva essa relação e soa natural em português.
- source_word: בְּכַרְמֵי
  choice: nas vinhas
  rationale: A preposição בְּ com o plural construto de כֶּרֶם indica localização; «nas vinhas» reproduz a imagem sem especificar além do texto.
- source_word: עֵין גֶּדִי
  choice: En-Gedi
  rationale: Trata-se de um topônimo, aqui transliterado na forma amplamente reconhecível em português.
