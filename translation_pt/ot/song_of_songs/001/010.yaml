  yaml_path: translation/ot/song_of_songs/001/010.yaml
  text: Your cheeks are lovely with ornaments[b][a], your neck with strings of jewels.
translation:
  language: pt
  text: Como são belas as suas faces com enfeites em fileiras[a], e o seu pescoço com colares de contas[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com fileiras”; o termo hebraico provavelmente se refere a fileiras ou arranjos de adornos. Alguns o entendem de modo mais específico como um tipo de ornamento.
    reason: lexical_alternative
  - marker: b
    text: Ou “com contas” ou “com cordões de joias”; o hebraico se refere a ornamentos enfiados em fios.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָאווּ
  choice: são belas
  rationale: O verbo נאה expressa beleza ou graça; “são belas” é natural, atual e adequado ao elogio poético.
- source_word: לְחָיַיִךְ
  choice: as suas faces
  rationale: לְחָיַיִךְ designa as duas faces, ou a região das faces e maxilares. “Faces” preserva o plural hebraico e é claro em português.
- source_word: בַּתֹּרִים
  choice: entre fileiras de adornos
  rationale: No contexto de joias e em paralelo com חֲרוּזִים, o termo provavelmente indica fileiras ou arranjos ornamentais. A formulação conserva tanto a disposição em fileiras quanto a natureza decorativa.
- source_word: צַוָּארֵךְ
  choice: o seu pescoço
  rationale: Equivalente anatômico direto e natural em português.
- source_word: בַּחֲרוּזִים
  choice: entre colares de contas
  rationale: חֲרוּזִים refere-se a ornamentos enfiados ou encordoados, provavelmente contas ou colares. “Colares de contas” comunica de modo concreto a imagem e mantém o paralelismo poético.
