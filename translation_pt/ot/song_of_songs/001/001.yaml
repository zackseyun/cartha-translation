  text: The Song of Songs[b][a], which is Solomon’s.
translation:
  language: pt
  text: O Cântico dos Cânticos[b], que é de Salomão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por Salomão”, “para Salomão” ou “a respeito de Salomão”; a preposição hebraica pode indicar diferentes tipos de relação.
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “Cântico dos Cânticos”, expressão superlativa que indica um cântico extraordinário ou o maior dos cânticos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר
  choice: Cântico
  rationale: O substantivo significa “cântico” ou “canção”. “Cântico” é natural e digno em português e, neste título tradicional, identifica claramente a obra.
- source_word: הַשִּׁירִים
  choice: dos Cânticos
  rationale: Preserva a forma hebraica שִׁיר הַשִּׁירִים, uma construção de excelência ou valor superlativo, sem substituí-la no texto principal pela interpretação mais explícita “o maior dos cânticos”.
- source_word: אֲשֶׁר
  choice: que
  rationale: O pronome relativo introduz naturalmente em português a oração que associa o cântico a Salomão.
- source_word: לִשְׁלֹמֹה
  choice: é de Salomão
  rationale: A preposição ל pode indicar posse, autoria, destinação ou associação. “É de Salomão” mantém em português uma amplitude semelhante, sem afirmar de modo inequívoco que ele foi o autor.
- source_word: שְׁלֹמֹה
  choice: Salomão
  rationale: Emprega a forma portuguesa consagrada do nome próprio.
theological_decisions:
- issue: Relação do cântico com Salomão indicada por לִשְׁלֹמֹה
  choice: que é de Salomão
  alternative: por Salomão; para Salomão; a respeito de Salomão
  rationale: O hebraico não define inequivocamente autoria. A formulação ampla preserva a abertura interpretativa e evita impor uma conclusão histórica ou teológica mais específica do que a expressão permite.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Conserva-se o título tradicional “Cântico dos Cânticos” e a ambiguidade genuína da associação com Salomão.
