lexical_decisions:
- source_word: אֲנִי
  choice: Eu sou
  rationale: O pronome independente explicita a autoidentificação em primeira pessoa; em português, a cópula é naturalmente expressa.
- source_word: חֲבַצֶּלֶת
  choice: açafrão
  rationale: A identificação exata da flor é incerta. “Açafrão” oferece uma aproximação botânica corrente para uma flor silvestre, sem adotar como certa a tradução tradicional “rosa”.
- source_word: הַשָּׁרוֹן
  choice: de Sarom
  rationale: Sarom é um nome geográfico próprio; a relação de construto é expressa naturalmente por “de Sarom”.
- source_word: שׁוֹשַׁנַּת
  choice: lírio
  rationale: Embora a espécie exata também possa ser incerta, “lírio” é a tradução tradicional e lexicalmente defensável no uso bíblico, preservando a imagem poética.
- source_word: הָעֲמָקִים
  choice: dos vales
  rationale: O substantivo plural designa vales ou terras baixas; “dos vales” é claro, natural e mantém o paralelismo poético.
