  text: Eu sou um croco de Sarom[a], um lírio dos vales.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “rosa de Sarom”. O termo hebraico חֲבַצֶּלֶת designa uma flor cuja espécie exata é incerta; “croco” é adotado aqui como uma identificação provável, enquanto a tradução tradicional é preservada como alternativa.
