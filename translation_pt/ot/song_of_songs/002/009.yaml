base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/009.yaml
  text: My beloved is like a gazelle or a young stag[a]. Look—there he stands behind our wall, gazing through the windows[b], peering through the lattice.
translation:
  language: pt
  text: Meu amado é como uma gazela ou um jovem cervo.[a] Eis que ele está de pé atrás do nosso muro, olhando pelas janelas, espreitando pelas treliças.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um filhote de cervo”. A expressão hebraica se refere a um animal jovem da família dos cervos; “jovem cervo” preserva a imagem masculina usada para descrever o amado.
    reason: lexical_alternative
  - marker: b
    text: As “treliças” eram aberturas protegidas por uma estrutura vazada ou por ripas; não se tratava necessariamente de um elemento separado de uma janela moderna.
    reason: cultural_note
lexical_decisions:
- source_word: דּוֹמֶה דוֹדִי
  choice: Meu amado é como
  rationale: A construção expressa comparação, e “meu amado” transmite de modo natural e poético o sentido afetivo de דּוֹדִי no Cântico.
- source_word: לִצְבִי
  choice: uma gazela
  rationale: “Gazela” é um equivalente moderno, claro e reconhecível para צְבִי.
- source_word: לְעֹפֶר הָאַיָּלִים
  choice: um jovem cervo
  rationale: עֹפֶר designa um animal jovem, e a expressão com אַיָּלִים aponta para a família dos cervos; “jovem cervo” preserva a imagem masculina sem soar arcaico.
- source_word: הִנֵּה זֶה
  choice: Vejam! Lá está ele
  rationale: A expressão dêitica chama vividamente a atenção para a presença do amado; esta formulação reproduz essa força em português corrente.
- source_word: עוֹמֵד אַחַר כָּתְלֵנוּ
  choice: parado atrás do nosso muro
  rationale: O particípio retrata uma cena presente e vívida; “muro” se ajusta melhor que “parede” à imagem de alguém do lado de fora de uma construção ou recinto.
- source_word: מַשְׁגִּיחַ מִן הַחֲלֹּנוֹת
  choice: olhando pelas janelas
  rationale: O particípio indica olhar atentamente; “olhando pelas janelas” é natural e evita a possível conotação ameaçadora de “vigiando”.
- source_word: מֵצִיץ מִן הַחֲרַכִּים
  choice: espreitando pelas treliças
  rationale: מֵצִיץ sugere olhar por uma abertura estreita, enquanto חֲרַכִּים pode indicar aberturas ou trabalho de treliça; a tradução conserva a imagem arquitetônica e poética.
