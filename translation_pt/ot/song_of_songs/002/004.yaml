  text: He brought me into the house of wine[a], and his banner over me was love.
translation:
  language: pt
  text: Ele me levou à casa do vinho[a], e sua bandeira sobre mim era amor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à casa do banquete”. O hebraico diz, mais literalmente, “à casa do vinho”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֱבִיאַנִי
  choice: Ele me levou
  rationale: O hifil perfeito de בוא com sufixo de primeira pessoa tem o sentido causativo de fazer entrar, trazer ou levar. “Levou” expressa com naturalidade, em português, o movimento até o lugar mencionado, sem acrescentar uma nuance aspectual ausente do contexto.
- source_word: אֶל
  choice: à
  rationale: Com verbo de movimento e um destino, אֶל indica direção e chegada. A contração “à” é idiomática em português e, no contexto, implica entrada na casa.
- source_word: בֵּית הַיָּיִן
  choice: casa do vinho
  rationale: A expressão construta significa literalmente “casa do vinho”. Esta forma preserva a imagem concreta e poética do hebraico; “casa do banquete” é uma interpretação contextual válida, registrada em nota.
- source_word: וְדִגְלוֹ
  choice: e sua bandeira
  rationale: דֶּגֶל designa uma bandeira ou estandarte. “Bandeira” é clara para leitores modernos e conserva a imagem de algo erguido ou exibido publicamente.
- source_word: עָלַי
  choice: sobre mim
  rationale: A preposição עַל, ligada à imagem da bandeira, é representada diretamente por “sobre mim”, preservando sua dimensão espacial.
- source_word: אַהֲבָה
  choice: o amor
  rationale: O substantivo significa “amor” e funciona como predicativo na frase nominal. O artigo torna a construção natural em português sem inserir o possessivo interpretativo “seu”.
