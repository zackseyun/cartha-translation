  text: My beloved is mine[c][b][a], and I am his—he who grazes among the lilies.
translation:
  language: pt
  text: O meu amado é meu, e eu sou dele — ele, que se alimenta[a] entre os lírios.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ele, que pastoreia” ou “ele, que apascenta”. O particípio hebraico também pode ter o sentido de alimentar-se ou pastar.'
    reason: lexical_alternative
  - marker: b
    text: A identificação exata da flor traduzida como “lírios” é incerta; o termo pode designar de modo mais amplo uma flor vistosa.
    reason: cultural_note
lexical_decisions:
- source_word: דּוֹדִי
  choice: o meu amado
  rationale: No Cântico dos Cânticos, דּוֹד designa o homem amado pela mulher em sentido romântico e íntimo. “Meu amado” é natural, digno e preserva o afeto sem reduzir a expressão ao aspecto sexual.
- source_word: לִי
  choice: é meu
  rationale: A preposição com sufixo exprime posse ou vínculo relacional. “É meu” reproduz de maneira concisa a construção hebraica e mantém o paralelismo com a oração seguinte.
- source_word: וַאֲנִי לוֹ
  choice: e eu sou dele
  rationale: A formulação conserva a concisão e a reciprocidade do hebraico, em equilíbrio direto com “é meu”.
- source_word: הָרֹעֶה
  choice: ele, que pastoreia
  rationale: O particípio Qal de רעה pode significar pastorear, apascentar ou alimentar-se. “Pastoreia” preserva a imagem pastoral e a força verbal sem fornecer um objeto ausente no hebraico; a ambiguidade é registrada em nota.
- source_word: בַּשּׁוֹשַׁנִּים
  choice: entre os lírios
  rationale: “Lírios” mantém a tradução tradicional de שׁוֹשַׁנִּים, embora a espécie botânica seja incerta. “Entre” expressa com naturalidade o valor locativo da preposição no cenário poético.
