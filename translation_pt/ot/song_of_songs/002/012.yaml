translation:
  language: pt
  text: As flores aparecem na terra; chegou o tempo de cantar[a], e a voz da rola se ouve em nossa terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “chegou o tempo da poda”. O hebraico זָמִיר pode indicar tanto canto como poda; “cantar” é preferido aqui por combinar com a menção paralela à voz da rola.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּצָּנִים
  choice: as flores
  rationale: O termo designa flores ou flores desabrochando na primavera. “As flores” é natural e amplamente compreensível em português, sem sugerir especificamente botões ainda fechados.
- source_word: נִרְאוּ
  choice: aparecem
  rationale: O nifal de ראה indica que algo se torna visível. “Aparecem” preserva o sentido intransitivo e combina com a descrição sazonal.
- source_word: בָאָרֶץ
  choice: na terra
  rationale: Neste cenário poético e localizado, “na terra” mantém a amplitude de אֶרֶץ e soa mais lírico do que “no país”.
- source_word: עֵת הַזָּמִיר
  choice: o tempo de cantar
  rationale: עֵת indica tempo ou estação, e זָמִיר admite os sentidos de canto e poda. “Tempo de cantar” é preferido por seu paralelismo com a voz da rolinha, mantendo-se a alternativa lexical em nota.
- source_word: הִגִּיעַ
  choice: chegou
  rationale: O verbo exprime chegada. O pretérito perfeito é idiomático e comunica que a estação esperada já chegou.
- source_word: וְקוֹל
  choice: e a voz
  rationale: קוֹל pode significar voz ou som. “Voz” conserva a personificação e a qualidade lírica do hebraico.
- source_word: הַתּוֹר
  choice: a rolinha
  rationale: תּוֹר designa especificamente a rola ou rolinha. “Rolinha” é um nome corrente e reconhecível no português brasileiro, adequado ao registro poético.
- source_word: נִשְׁמַע
  choice: se ouve
  rationale: O nifal de שמע significa “é ouvida”. A construção impessoal “se ouve” é natural em português e mantém o foco no som sem acrescentar “cantar” ou “chamar”.
- source_word: בְּאַרְצֵנוּ
  choice: em nossa terra
  rationale: Preserva o sufixo possessivo da primeira pessoa do plural e o cenário íntimo e compartilhado do poema.
