base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/017.yaml
  text: Until the day breathes and the shadows flee[a], turn[b], my beloved—be like a gazelle or a young stag on the mountains of Bether.
translation:
  language: pt
  text: Até que o dia respire e as sombras fujam[a], vire-se, meu amado; seja como uma gazela ou um cervo jovem sobre os montes de Beter[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Até que o dia refresque e as sombras fujam”. O hebraico fala literalmente do dia “respirar” ou “soprar”, expressão poética que pode aludir à brisa da tarde ou ao frescor da madrugada.'
    reason: lexical_alternative
  - marker: b
    text: “Beter” talvez seja o nome de um lugar. A expressão também pode significar “montes da separação” ou, com menor probabilidade, “montes recortados”.
    reason: alternative_reading
lexical_decisions:
- source_word: עַד שֶׁיָּפוּחַ הַיּוֹם
  choice: Até que o dia respire
  rationale: O verbo פוח expressa soprar ou respirar. A tradução mantém a personificação poética do dia sem decidir se a imagem indica a brisa da tarde ou o frescor da madrugada.
- source_word: וְנָסוּ הַצְּלָלִים
  choice: e as sombras fujam
  rationale: נוס significa normalmente fugir. A formulação conserva a força e o movimento da imagem poética, em vez de reduzi-la a 'desapareçam'.
- source_word: סֹב
  choice: vire-se
  rationale: O imperativo de סבב significa basicamente virar-se ou dar a volta. 'Vire-se' preserva esse sentido sem interpretar a ordem necessariamente como 'volte'.
- source_word: דְּמֵה לְךָ
  choice: seja como
  rationale: A expressão introduz uma comparação e se verte naturalmente em português por 'seja como'.
- source_word: דוֹדִי
  choice: meu amado
  rationale: דוֹדִי é uma forma íntima de tratamento recorrente no Cântico. 'Meu amado' transmite afeto em registro poético e digno.
- source_word: לִצְבִי
  choice: como uma gazela
  rationale: A preposição ל, regida por דמה, marca o termo da comparação; 'gazela' é a correspondência direta e corrente.
- source_word: לְעֹפֶר הָאַיָּלִים
  choice: ou um cervo jovem
  rationale: עֹפֶר designa um animal novo e, com אַיָּלִים, aponta para um cervídeo jovem. 'Cervo jovem' é natural em português e conserva a imagem masculina.
- source_word: עַל הָרֵי בָתֶר
  choice: sobre os montes de Beter
  rationale: בתר pode ser um topônimo ou um substantivo relacionado a divisão ou corte. A transliteração 'Beter' evita resolver uma incerteza real do hebraico; as alternativas ficam registradas em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, poético e acessível, com preferência por imagens concretas do hebraico. A pontuação mantém juntas as duas ordens dirigidas ao amado. O marcador [b] foi colocado junto de “Beter”, termo ao qual a nota efetivamente se refere.
