  register: Português moderno, poético e acessível, com construção de ampla compreensão e boa legibilidade brasileira. A tradução preserva o desenvolvimento inicial dos figos, a possível ambiguidade botânica de סְמָדַר por meio de nota e o caráter íntimo do convite.
