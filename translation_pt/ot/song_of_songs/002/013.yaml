base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/013.yaml
  text: The fig tree has ripened its early figs[a], and the vines in blossom give off fragrance. Arise, my love, my beautiful one[c][b], and come away.
translation:
  language: pt
  text: A figueira formou seus primeiros figos[a], e as videiras em flor exalam sua fragrância[b]. Levante-se, meu amor, minha bela, e venha[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “produziu seus figos verdes”. O verbo e o substantivo hebraicos podem destacar o estágio inicial de desenvolvimento do fruto, e não sua plena maturação.
    reason: lexical_alternative
  - marker: b
    text: Ou “as videiras com cachos tenros espalham seu aroma”. O termo hebraico pode se referir às flores da videira ou ao começo da formação das uvas.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “e vai para ti”. Neste contexto, a expressão funciona como um convite para partir com quem fala.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנְטָה פַגֶּיהָ
  choice: formou seus primeiros figos
  rationale: O verbo חנט, junto de פגים, descreve o aparecimento ou desenvolvimento inicial dos figos. A formulação evita afirmar plena maturação e preserva a imagem sazonal em português natural.
- source_word: סְמָדַר
  choice: em flor
  rationale: O termo pode indicar a floração da videira ou o estágio inicial dos cachos. “Em flor” se ajusta à menção da fragrância e mantém a imagem botânica.
- source_word: נָתְנוּ רֵיחַ
  choice: exalam sua fragrância
  rationale: Expressa naturalmente em português a locução hebraica “dão cheiro”, conservando a imagem sensorial e o valor positivo de רֵיחַ no contexto.
- source_word: קוּמִי
  choice: Levante-se
  rationale: Imperativo feminino singular usado como convite. A escolha é clara, atual e digna, sem o tom mais arcaico de “Ergue-te”.
- source_word: רַעְיָתִי
  choice: meu amor
  rationale: Termo íntimo dirigido à mulher amada. “Meu amor” comunica afeto de modo natural e não força o sentido mais literal possível de “companheira”.
- source_word: יָפָתִי
  choice: minha bela
  rationale: Reproduz de modo conciso o adjetivo substantivado de beleza, preservando o paralelismo afetivo com “meu amor”.
- source_word: וּלְכִי לָךְ
  choice: e venha comigo
  rationale: Embora a expressão seja formalmente “e vai para ti”, no contexto é um convite para a mulher sair e acompanhar o falante. “Venha comigo” transmite essa força discursiva em português natural.
theological_decisions: []
