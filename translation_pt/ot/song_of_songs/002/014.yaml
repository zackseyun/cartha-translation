base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/014.yaml
  text: My dove[a], in the clefts of the rock, in the hiding place of the cliff, let me see your appearance; let me hear your voice, for your voice is sweet[b], and your appearance is lovely.
translation:
  language: pt
  text: Minha pomba, nas fendas da rocha, no esconderijo da escarpa[a], deixe-me ver sua aparência[b]; deixe-me ouvir sua voz, pois sua voz é doce, e sua aparência é bela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no lugar oculto da subida íngreme” ou “no abrigo do precipício”; a palavra hebraica traduzida como “escarpa” é rara e pode indicar uma subida rochosa íngreme ou um ressalto de rocha.
    reason: lexical_alternative
  - marker: b
    text: Ou “mostre-me seu rosto”; o hebraico também pode referir-se mais especificamente ao aspecto visível ou ao semblante.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹנָתִי
  choice: Minha pomba
  rationale: Mantém literalmente a imagem poética e o tom afetuoso do termo hebraico.
- source_word: בְּחַגְוֵי הַסֶּלַע
  choice: nas fendas da rocha
  rationale: Expressa de modo concreto e natural o plural חַגְוֵי, que indica fendas ou reentrâncias rochosas.
- source_word: בְּסֵתֶר הַמַּדְרֵגָה
  choice: no esconderijo da escarpa
  rationale: סֵתֶר indica lugar oculto ou abrigo; מַדְרֵגָה é raro e provavelmente descreve um lugar rochoso íngreme, ressalto ou escarpa. A nota preserva a incerteza topográfica.
- source_word: הַרְאִינִי אֶת־מַרְאַיִךְ
  choice: deixe-me ver sua aparência
  rationale: Transmite naturalmente o pedido do imperativo causativo. מַרְאֶה pode indicar aparência, aspecto ou semblante; 'aparência' evita restringi-lo ao rosto.
- source_word: הַשְׁמִיעִינִי אֶת־קוֹלֵךְ
  choice: deixe-me ouvir sua voz
  rationale: É a forma idiomática em português para o pedido literalmente expresso como 'faça-me ouvir'.
- source_word: עָרֵב
  choice: doce
  rationale: O adjetivo denota algo agradável ou doce; 'voz doce' é uma combinação natural em português e adequada ao contexto amoroso.
- source_word: נָאוֶה
  choice: encantadora
  rationale: Comunica a beleza e o encanto expressos pelo adjetivo, em registro poético atual.
- source_word: מַרְאַיִךְ / מַרְאֵיךְ
  choice: aparência
  rationale: A repetição da mesma escolha preserva a coesão lexical e o paralelismo do hebraico.
