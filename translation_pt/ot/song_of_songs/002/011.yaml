base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/011.yaml
  text: For look[a], the winter has passed; the rain is over and gone.
translation:
  language: pt
  text: 'Pois veja: o inverno[a] passou; a chuva cessou e foi embora.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a estação chuvosa”. O termo hebraico traduzido como “inverno” pode designar mais especificamente a estação das chuvas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação do convite anterior e preserva de modo natural o valor conectivo do hebraico.
- source_word: הִנֵּה
  choice: veja
  rationale: Partícula dêitica que chama a atenção; “veja” é atual e vívido, sem o tom arcaico de “eis”.
- source_word: הַסְּתָו
  choice: o inverno
  rationale: O termo designa o inverno ou, mais especificamente, a estação chuvosa. “O inverno” é idiomático no texto principal, enquanto a nota preserva a alternativa lexical relevante.
- source_word: עָבַר
  choice: passou
  rationale: O perfeito qal apresenta a estação como já terminada; o pretérito perfeito é conciso e natural em português.
- source_word: הַגֶּשֶׁם
  choice: a chuva
  rationale: Correspondência direta do substantivo definido hebraico.
- source_word: חָלַף
  choice: cessou
  rationale: Expressa que a chuva acabou, evitando repetir “passou” e mantendo o avanço poético.
- source_word: הָלַךְ לוֹ
  choice: e foi embora
  rationale: 'Reproduz a expressão intensificadora: a chuva não apenas cessou, mas se foi completamente.'
