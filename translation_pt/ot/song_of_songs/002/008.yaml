  text: The sound of my beloved! Look[a], here he comes, leaping over the mountains, bounding over the hills.
translation:
  language: pt
  text: A voz[a] do meu amado! Vejam, aí vem ele, saltando sobre os montes, pulando sobre as colinas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O som do meu amado!”; o hebraico qol pode significar “voz” ou “som”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: A voz de
  rationale: קוֹל pode significar tanto “voz” como “som”. Em português, “A voz do meu amado!” forma uma exclamação poética natural e pode indicar que ela reconhece a aproximação dele pelo que ouve; a alternativa “O som” permanece possível e é registrada em nota.
- source_word: דּוֹדִי
  choice: meu amado
  rationale: No Cântico dos Cânticos, דּוֹדִי designa o homem amado pela mulher. “Meu amado” preserva o afeto, a dignidade poética e a naturalidade bíblica em português.
- source_word: הִנֵּה זֶה
  choice: Vejam, aí vem ele
  rationale: A expressão chama vividamente a atenção para alguém que se aproxima. “Aí vem ele” é corrente e deítica em português, sem a solenidade arcaizante de “eis”.
- source_word: בָּא
  choice: vem
  rationale: No contexto, a forma descreve de modo vívido a aproximação em curso; o presente português é natural e conciso.
- source_word: מְדַלֵּג
  choice: saltando
  rationale: O particípio retrata movimento ágil e vigoroso. “Saltando” é claro, poético e natural.
- source_word: עַל הֶהָרִים
  choice: sobre os montes
  rationale: Com verbo de movimento, עַל apresenta o percurso por cima ou através do relevo. “Sobre os montes” conserva a imagem poética e o paralelismo.
- source_word: מְקַפֵּץ
  choice: pulando
  rationale: O verbo é próximo de מְדַלֵּג e acrescenta variação ao movimento repetido e ágil. “Pulando” evita repetir “saltando” sem perder a vivacidade.
- source_word: עַל הַגְּבָעוֹת
  choice: sobre as colinas
  rationale: Mantém o paralelismo com “sobre os montes” e distingue naturalmente גְּבָעוֹת de הָרִים.
