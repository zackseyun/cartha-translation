  terminology: “Gazelas”, “corças do campo”, “filhas de Jerusalém” e “amor” são boas escolhas. A expressão “até que ele queira” mantém em português a concordância com “amor”, embora a nota deva esclarecer que o hebraico usa feminino e pode ser vertido explicitamente como “ela”.
