base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/007.yaml
  text: 'I adjure you[a], daughters of Jerusalem[c][b], by the gazelles or by the does of the field: do not stir up or awaken love until it pleases.'
translation:
  language: pt
  text: 'Eu as conjuro[a], ó filhas de Jerusalém, pelas gazelas ou pelas corças do campo[b]: não despertem nem suscitem o amor até que ele queira[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “Eu as faço jurar”.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica “pelas gazelas ou pelas corças do campo” é uma fórmula poética de juramento. Alguns veem nela um jogo de palavras que evoca títulos divinos, mas a referência aos animais é o sentido mais direto neste contexto.
    reason: cultural_note
  - marker: c
    text: 'Ou: “até que ela queira”. Em hebraico, o verbo traduzido por “queira” está no feminino e concorda com a palavra hebraica para “amor”.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִשְׁבַּעְתִּי
  choice: Eu as conjuro
  rationale: O hifil de שׁבע, nesta fórmula, significa pôr alguém sob juramento ou fazer uma exortação solene. “Conjuro” conserva de modo conciso e digno a força formal do juramento; a nota esclarece seu sentido literal.
- source_word: בְּנוֹת יְרוּשָׁלִַם
  choice: ó filhas de Jerusalém
  rationale: Mantém a forma direta e poética do vocativo hebraico, sem reduzi-la simplesmente a “mulheres” ou “jovens de Jerusalém”.
- source_word: בִּצְבָאוֹת
  choice: pelas gazelas
  rationale: Neste paralelismo poético, צְבָאוֹת designa gazelas, e não exércitos ou hostes. A preposição “pelas” preserva a fórmula de juramento.
- source_word: אוֹ
  choice: ou
  rationale: Reproduz o valor normal da conjunção hebraica e mantém a alternância entre as duas imagens animais.
- source_word: בְּאַיְלוֹת הַשָּׂדֶה
  choice: pelas corças do campo
  rationale: “Corças” comunica o referente feminino e preserva a linguagem poética; “do campo” traduz diretamente o complemento hebraico.
- source_word: אִם תָּעִירוּ וְאִם תְּעוֹרְר֛וּ
  choice: não incitem nem despertem
  rationale: Depois de uma fórmula de juramento, אִם assume força proibitiva. Os dois verbos próximos em sentido são mantidos para conservar a intensificação poética, com formulação natural em português.
- source_word: הָאַהֲבָה
  choice: o amor
  rationale: O artigo é natural em português com o substantivo abstrato neste contexto. “Amor” conserva a abertura do referente sem restringi-lo a uma experiência ou pessoa específica.
- source_word: עַד שֶׁתֶּחְפָּץ
  choice: até que ele queira
  rationale: O verbo hebraico na terceira pessoa feminina retoma אַהֲבָה, substantivo feminino em hebraico. Como “amor” é masculino em português, “ele” segue naturalmente a gramática da língua receptora sem eliminar a personificação.
theological_decisions:
- issue: Referente e personificação de “amor” na oração final
  choice: Entender “amor” como antecedente do verbo e traduzir “até que ele queira”.
  alternative: 'Traduzir de modo menos personificado, “até que seja o momento”, ou omitir o pronome: “até que queira”.'
  rationale: A concordância feminina do hebraico aponta naturalmente para אַהֲבָה como antecedente. A tradução conserva essa relação e a tensão poética de um amor dotado de vontade própria, sem determinar de modo interpretativo qual seria seu tempo adequado.
- issue: Força da construção de juramento com אִם
  choice: 'Expressá-la no texto principal como proibição direta: “não incitem nem despertem”.'
  alternative: 'Preservar a subordinação formal: “que vocês não incitem nem despertem”.'
  rationale: A construção hebraica é idiomática em juramentos e tem força proibitiva. A proibição direta é mais clara em português moderno, enquanto a nota registra a alternativa sintática mais próxima da forma hebraica.
translation_notes:
  register: Português moderno, literário e acessível, com leitura natural no Brasil e inteligibilidade internacional. O vocativo “ó filhas de Jerusalém” e o verbo “conjuro” preservam a solenidade poética; a nota explica o termo menos cotidiano. A repetição semântica dos verbos e as imagens animais foram mantidas, evitando explicar no corpo do verso quando ou de que maneira o amor deve despertar.
