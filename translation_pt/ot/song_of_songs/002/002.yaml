  text: כְּ/שֽׁוֹשַׁנָּה֙ בֵּ֣ין הַ/חוֹחִ֔ים כֵּ֥ן רַעְיָתִ֖/י בֵּ֥ין הַ/בָּנֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/002.yaml
  text: Like a lily among thorns[b][a], so is my beloved among the daughters.
translation:
  language: pt
  text: Como um lírio entre os espinhos, assim é a minha amada[b] entre as filhas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as jovens”; a expressão hebraica pode referir-se às mulheres do grupo em geral, não apenas a filhas em sentido literal.
    reason: lexical_alternative
  - marker: b
    text: Ou “meu amor”, “minha querida” ou “minha companheira”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/שֽׁוֹשַׁנָּה
  choice: Como um lírio
  rationale: O substantivo שׁוֹשַׁנָּה designa tradicionalmente uma flor semelhante ao lírio, embora a espécie exata seja incerta. “Lírio” preserva a imagem poética tradicional sem pretender precisão botânica; a preposição כְּ é traduzida por “como”.
- source_word: בֵּ֣ין
  choice: entre
  rationale: “Entre” corresponde naturalmente à relação espacial expressa por בֵּין com um referente plural e funciona bem na comparação poética.
- source_word: הַ/חוֹחִ֔ים
  choice: os espinhos
  rationale: חוֹחִים refere-se a plantas espinhosas. “Espinhos” é conciso e mantém o contraste poético entre a beleza da flor e o ambiente hostil.
- source_word: כֵּ֥ן
  choice: assim é
  rationale: כֵּן introduz o segundo termo da comparação; “assim é” completa o paralelismo de modo claro e natural em português.
- source_word: רַעְיָתִ֖/י
  choice: a minha amada
  rationale: רַעְיָתִי designa a mulher amada ou companheira do eu lírico. “Minha amada” comunica intimidade com dignidade e concorda com a voz masculina do contexto.
- source_word: הַ/בָּנוֹת
  choice: as filhas
  rationale: בָּנוֹת significa literalmente “filhas”, mas pode designar idiomaticamente as jovens ou mulheres de um grupo. A tradução principal conserva a expressão hebraica recorrente, e a nota registra a alternativa idiomática.
theological_decisions: []
translation_notes:
  register: Português moderno, poético e digno, com ampla legibilidade brasileira. A construção paralela “Como..., assim...” preserva a forma da comparação hebraica. Os marcadores aparecem junto aos termos a que se referem; sua ordem no versículo segue a posição textual, embora as notas sejam identificadas pelas letras fornecidas.
