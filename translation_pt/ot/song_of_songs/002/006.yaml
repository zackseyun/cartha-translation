  text: His left hand is under my head[a], and his right hand embraces me.
translation:
  language: pt
  text: A mão esquerda dele está debaixo da minha cabeça[a], e a mão direita dele me abraça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o braço esquerdo dele... o braço direito dele”, pois os termos hebraicos para “esquerda” e “direita” podem indicar, conforme o contexto, o lado correspondente ou a mão/o braço.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂמֹאלוֹ
  choice: a mão esquerda dele
  rationale: O termo designa o lado esquerdo e, neste contexto corporal, pode indicar a mão ou o braço. A explicitação com “mão” é natural em português e mantém o paralelismo.
- source_word: תַּחַת
  choice: debaixo de
  rationale: A preposição indica posição inferior. “Debaixo da minha cabeça” é claro e idiomático em português atual.
- source_word: לְרֹאשִׁי
  choice: da minha cabeça
  rationale: רֹאשׁ significa “cabeça”; a construção com תַּחַת resulta naturalmente em “debaixo da minha cabeça”, sem necessidade de expansão interpretativa.
- source_word: וִימִינוֹ
  choice: e a mão direita dele
  rationale: Em paralelo com שְׂמֹאלוֹ, o termo designa o lado direito e pode referir-se à mão ou ao braço. “Mão direita” torna a imagem explícita, preservando a alternativa em nota.
- source_word: תְּחַבְּקֵנִי
  choice: me abraça
  rationale: A forma vem de חבק, “abraçar”. O presente comunica com naturalidade a cena poética vívida e conserva a intimidade física da imagem.
theological_decisions: []
