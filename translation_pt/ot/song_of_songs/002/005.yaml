translation_notes:
  register: Português moderno, poético e digno, com imperativos no plural preservados. A voz feminina indicada pela forma hebraica חוֹלַת não aparece morfologicamente em “doente”, que funciona bem para leitores de ambos os principais padrões do português; o contexto literário identifica a voz.
