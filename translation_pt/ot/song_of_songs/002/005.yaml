  text: סַמְּכ֨וּ/נִי֙ בָּֽ/אֲשִׁישׁ֔וֹת רַפְּד֖וּ/נִי בַּ/תַּפּוּחִ֑ים כִּי חוֹלַ֥ת אַהֲבָ֖ה אָֽנִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/005.yaml
  text: Sustain me with raisin cakes[a]; refresh me with apples[c][b], for I am sick with love.
translation:
  language: pt
  text: Sustentem-me com bolos de passas[a]; reanimem-me com maçãs[b], pois estou doente de amor[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bolos de uvas prensadas”.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico tradicionalmente traduzido por “maçãs” pode designar de modo mais amplo uma fruta aromática; a identificação botânica exata é incerta.
    reason: cultural_note
  - marker: c
    text: Ou “enferma de amor” ou “desfalecendo de amor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַמְּכוּנִי
  choice: Sustentem-me
  rationale: O imperativo plural de סמך pede apoio ou amparo. “Sustentem-me” preserva tanto a fraqueza física quanto a emocional e mantém o plural do hebraico.
- source_word: בָּאֲשִׁישׁוֹת
  choice: com bolos de passas
  rationale: אֲשִׁישׁוֹת designa bolos prensados, geralmente entendidos como feitos de passas ou uvas; a expressão é clara sem ocultar a incerteza lexical.
- source_word: רַפְּדוּנִי
  choice: reanimem-me
  rationale: Embora רפד possa ter o sentido concreto de dispor ou estender algo como apoio, no paralelismo e junto à imagem de alimentos comunica restauração; “reanimem-me” expressa isso naturalmente.
- source_word: בַּתַּפּוּחִים
  choice: com maçãs
  rationale: תַּפּוּחִים é tradicionalmente traduzido por “maçãs”, embora a identificação botânica exata seja incerta; a nota preserva essa cautela.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão dos dois imperativos e mantém um tom poético natural em português.
- source_word: חוֹלַת אַהֲבָה
  choice: doente de amor
  rationale: A construção expressa enfermidade ou fraqueza causada pelo amor. “Doente de amor” conserva diretamente a metáfora, sem reduzi-la apenas a uma emoção sentimental.
- source_word: אָֽנִי
  choice: estou
  rationale: A primeira pessoa é expressa naturalmente pela flexão verbal portuguesa; o pronome independente hebraico não exige um “eu” explícito neste verso.
