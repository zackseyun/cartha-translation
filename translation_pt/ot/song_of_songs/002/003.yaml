  text: כְּ/תַפּ֨וּחַ֙ בַּ/עֲצֵ֣י הַ/יַּ֔עַר כֵּ֥ן דּוֹדִ֖/י בֵּ֣ין הַ/בָּנִ֑ים בְּ/צִלּ/וֹ֙ חִמַּ֣דְתִּי וְ/יָשַׁ֔בְתִּי וּ/פִרְי֖/וֹ מָת֥וֹק לְ/חִכִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/003.yaml
  text: Like an apple tree among the trees of the forest[a], so is my beloved among the sons. In his shade I delighted to sit[b], and his fruit was sweet to my taste.
translation:
  language: pt
  text: Como a macieira entre as árvores da floresta, assim é o meu amado entre os jovens.[a] Desejei sentar-me à sua sombra e ali me sentei, e o seu fruto foi doce ao meu paladar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “entre os filhos”; isto é, entre os jovens homens.
    reason: lexical_alternative
  - marker: b
    text: A espécie exata indicada pelo termo hebraico é incerta; tradicionalmente, “macieira”.
    reason: cultural_note
lexical_decisions:
- source_word: תַּפּוּחַ
  choice: macieira
  rationale: É a tradução tradicional e mais reconhecível; a identificação botânica exata é incerta, por isso a incerteza é registrada em nota.
- source_word: בַּעֲצֵי הַיַּעַר
  choice: entre as árvores da floresta
  rationale: Preserva a comparação partitiva e a imagem de uma árvore frutífera distinta em meio às árvores silvestres.
- source_word: דּוֹדִי
  choice: meu amado
  rationale: No Cântico, designa o homem amado em contexto romântico; a expressão é natural, digna e poeticamente adequada em português.
- source_word: בֵּין הַבָּנִים
  choice: entre os jovens
  rationale: Embora בָּנִים signifique literalmente 'filhos', aqui indica os pares masculinos do amado; 'os jovens' comunica o sentido contextual sem a estranheza de 'os filhos' em português.
- source_word: בְּצִלּוֹ
  choice: à sua sombra
  rationale: Mantém o sufixo masculino e a sobreposição poética entre a árvore e o amado.
- source_word: חִמַּדְתִּי וְיָשַׁבְתִּי
  choice: Desejei sentar-me
  rationale: A sequência expressa o desejo prazeroso seguido da ação de sentar-se; esta formulação preserva a volição e soa natural em português, sem explicitar além do hebraico se a ênfase recai no desejo ou no deleite.
- source_word: וּפִרְיוֹ
  choice: e o seu fruto
  rationale: Conserva a metáfora pessoal da árvore aplicada ao amado.
- source_word: מָתוֹק לְחִכִּי
  choice: foi doce ao meu paladar
  rationale: Traduz de modo concreto חֵךְ, 'paladar/palato', e mantém a imagem sensorial e o aspecto retrospectivo do verso.
theological_decisions:
- issue: Possíveis sentidos alegóricos ou sexuais da imagem da sombra e do fruto
  choice: Preservar a linguagem poética concreta sem identificar seu referente além do que o verso declara
  alternative: Explicitar uma interpretação alegórica, conjugal ou sexual
  rationale: O hebraico sustenta uma metáfora amorosa sugestiva, mas não determina neste verso uma única leitura teológica ou fisiológica; explicitá-la resolveria indevidamente a tensão poética.
translation_notes:
  register: Português moderno, poético e acessível, com legibilidade brasileira. 'Meu amado' conserva o tom elevado; 'entre os jovens' comunica o sentido contextual de בֵּין הַבָּנִים. A única nota registra a incerteza botânica, e seu marcador aparece no texto principal.
