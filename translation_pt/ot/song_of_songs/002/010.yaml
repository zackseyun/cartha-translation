  yaml_path: translation/ot/song_of_songs/002/010.yaml
  text: My beloved answered and said to me, “Rise up, my love, my beautiful one, and come away.”
translation:
  language: pt
  text: 'Meu amado respondeu e me disse: “Levante-se, minha amada, minha bela, e vá.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָנָה
  choice: tomou a palavra
  rationale: Neste contexto, o verbo não exige resposta a uma pergunta anterior; a expressão portuguesa introduz naturalmente o início da fala.
- source_word: דּוֹדִי
  choice: meu amado
  rationale: Expressa o vínculo amoroso e mantém o termo recorrente do poema.
- source_word: רַעְיָתִי
  choice: minha amada
  rationale: Embora o substantivo possa sugerir companheira ou amiga íntima, no contexto amoroso esta é a forma mais natural e clara em português.
- source_word: יָפָתִי
  choice: minha bela
  rationale: Preserva o tratamento substantivado e afetuoso, sem acrescentar ideias ausentes do hebraico.
- source_word: קוּמִי לָךְ
  choice: Levante-se
  rationale: O imperativo feminino com לָךְ funciona aqui de modo idiomático e enfático; a forma portuguesa comunica o chamado com naturalidade.
- source_word: וּלְכִי לָךְ
  choice: e venha comigo
  rationale: לכי significa literalmente “vá”, mas, na situação de convite do amado, o sentido discursivo é acompanhar quem fala; “venha comigo” comunica isso naturalmente e corresponde ao movimento conjunto implícito no contexto.
