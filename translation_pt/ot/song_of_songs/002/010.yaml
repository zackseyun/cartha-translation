translation_notes:
  register: Português moderno, claro e poético, com tratamento formal amplamente compreensível. A repetição hebraica “respondeu e disse” foi vertida pela expressão idiomática “tomou a palavra e me disse”, evitando rigidez sem alterar o conteúdo.
