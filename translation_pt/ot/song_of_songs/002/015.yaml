source:
  edition: WLC
  text: אֶֽחֱזוּ לָ֨/נוּ֙ שֽׁוּעָלִ֔ים שֽׁוּעָלִ֥ים קְטַנִּ֖ים מְחַבְּלִ֣ים כְּרָמִ֑ים וּ/כְרָמֵ֖י/נוּ סְמָדַֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/015.yaml
  text: Catch the foxes for us[a], the little foxes that ruin the vineyards[c][b], for our vineyards are in blossom.
translation:
  language: pt
  text: 'Apanhem para nós as raposas[a],

    as raposinhas que estragam as vinhas[b],

    pois as nossas vinhas estão em flor.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico também pode significar “chacais” em alguns contextos.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que devastam as vinhas”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “estão florescendo”; menos provavelmente, “têm uvas ainda tenras”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶֽחֱזוּ
  choice: Apanhem
  rationale: O imperativo plural de אחז pede uma ação efetiva de captura. “Apanhem” é natural em português para capturar animais e preserva a força da ordem.
- source_word: לָנוּ
  choice: para nós
  rationale: 'A preposição com sufixo de primeira pessoa do plural indica benefício ou interesse: “para nós”.'
- source_word: שׁוּעָלִים
  choice: raposas
  rationale: “Raposas” é o sentido mais comum e se ajusta naturalmente à imagem das vinhas; “chacais” continua sendo uma alternativa lexical possível e é registrada em nota.
- source_word: שׁוּעָלִים קְטַנִּים
  choice: as raposinhas
  rationale: O diminutivo português transmite de modo natural tanto o tamanho reduzido indicado por קְטַנִּים quanto o tom poético da expressão, preservando a repetição de “raposas”.
- source_word: מְחַבְּלִים
  choice: que estragam
  rationale: O particípio descreve uma ação danosa em curso. “Estragam” comunica prejuízo real sem necessariamente implicar destruição total.
- source_word: כְּרָמִים
  choice: as vinhas
  rationale: O substantivo designa vinhedos ou vinhas como áreas cultivadas. “Vinhas” é corrente, conciso e poético em português.
- source_word: וּכְרָמֵינוּ
  choice: pois as nossas vinhas
  rationale: Embora וְ seja formalmente uma conjunção, o contexto permite explicitar a relação causal em português com “pois”; o sufixo plural é preservado em “nossas”.
- source_word: סְמָדַר
  choice: estão em flor
  rationale: O termo aponta para a fase de floração da videira. “Estão em flor” é claro, atual e preserva a imagem sazonal sem adotar a interpretação menos provável de uvas ainda tenras.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e poético, com ampla legibilidade brasileira. A disposição em três linhas acompanha o paralelismo do verso. “Raposinhas” conserva a repetição enfática e torna קְטַנִּים idiomático; as alternativas lexicais genuínas são mantidas em notas.
