base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/002.yaml
  text: 'I was asleep[a], but my heart was awake. The sound of my beloved knocking: “Open to me, my sister, my darling, my dove, my blameless one, for my head is drenched with dew[b], my locks with the drops of the night.”'
translation:
  language: pt
  text: 'Eu dormia, mas meu coração estava desperto.

    O som[a] do meu amado batendo:


    “Abra para mim, minha irmã,

    minha amada, minha pomba,

    minha íntegra[b],

    pois minha cabeça está coberta de orvalho,

    e minhas mechas, das gotas da noite.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a voz do meu amado”. A palavra hebraica pode significar tanto “som” como “voz”, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido como “minha perfeita” ou “minha pura”. O termo hebraico transmite a ideia de inteireza, inocência ou pureza.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשֵׁנָה
  choice: Eu dormia
  rationale: O adjetivo feminino singular tem função predicativa. “Eu dormia” estabelece a cena com naturalidade em português e mantém o contraste com o coração desperto.
- source_word: לִבִּי עֵר
  choice: meu coração estava desperto
  rationale: “Coração” preserva a imagem hebraica do íntimo da pessoa, e “desperto” forma o contraste direto com o sono.
- source_word: קוֹל דּוֹדִי
  choice: É a voz do meu amado
  rationale: קוֹל pode designar voz ou som. Como vêm em seguida palavras pronunciadas pelo amado, “voz” funciona naturalmente no texto, enquanto “som” é preservado em nota.
- source_word: דוֹפֵק
  choice: que está batendo
  rationale: O particípio apresenta uma ação em curso; a forma progressiva conserva essa vivacidade. O objeto implícito, provavelmente a porta, não é acrescentado ao texto.
- source_word: פִּתְחִי לִי
  choice: Abra para mim
  rationale: Mantém o imperativo e o complemento לִי sem explicitar “a porta”, que está subentendida no hebraico.
- source_word: אֲחֹתִי
  choice: minha irmã
  rationale: Preserva literalmente a expressão afetiva característica do Cântico.
- source_word: רַעְיָתִי
  choice: minha amada
  rationale: Expressa de modo natural e digno a relação amorosa, sem enfraquecer o tom afetuoso.
- source_word: יוֹנָתִי
  choice: minha pomba
  rationale: Conserva a metáfora transparente do original.
- source_word: תַמָּתִי
  choice: minha íntegra
  rationale: “Íntegra” comunica inteireza, inocência e pureza sem impor a ideia moderna de perfeição absoluta. Outras possibilidades são registradas em nota.
- source_word: שֶׁרֹּאשִׁי נִמְלָא טָל
  choice: pois minha cabeça está coberta de orvalho
  rationale: A tradução idiomática comunica que a cabeça está inteiramente molhada pelo orvalho e conserva a conjunção explicativa.
- source_word: קְוֻּצּוֹתַי
  choice: minhas mechas
  rationale: O termo se refere às mechas ou madeixas do cabelo; “mechas” é claro e mantém a especificidade da imagem.
- source_word: רְסִיסֵי לָיְלָה
  choice: as gotas da noite
  rationale: A formulação literal conserva o paralelismo poético com o orvalho e evita definir as gotas de maneira mais estreita que o original.
