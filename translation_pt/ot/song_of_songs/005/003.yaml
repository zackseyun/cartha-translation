  text: I have taken off my tunic—how can I put it on again? I have washed my feet—how can I soil them?[a][b]
translation:
  language: pt
  text: Já tirei a minha túnica; como vou vesti-la de novo? Já lavei os pés; como vou sujá-los?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Já despi a minha roupa; como poderei vesti-la de novo? Já lavei os pés; como poderei sujá-los?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּשַׁטְתִּי
  choice: Já tirei
  rationale: O verbo indica despir ou tirar uma peça de roupa. “Já tirei” é natural em português e, com “já”, comunica a ação concluída que fundamenta a objeção.
- source_word: כֻּתָּנְתִּי
  choice: a minha túnica
  rationale: כֻּתֹּנֶת designa uma peça básica usada junto ao corpo. “Túnica” conserva melhor a especificidade do objeto do que “roupa” ou “vestimenta”.
- source_word: אֵיכָכָה
  choice: como vou
  rationale: A interrogação expressa relutância diante de ter de desfazer uma ação já concluída. “Como vou” reproduz essa objeção de modo corrente, sem sugerir impossibilidade literal.
- source_word: אֶלְבָּשֶׁנָּה
  choice: vesti-la de novo
  rationale: O verbo significa vestir ou pôr, e o sufixo feminino retoma “túnica”. “De novo” torna explícita em português a reversão pressuposta pelo contexto.
- source_word: רָחַצְתִּי
  choice: Já lavei
  rationale: A forma verbal apresenta uma ação concluída com relevância presente. O uso de “já” expressa isso naturalmente em português.
- source_word: רַגְלַי
  choice: os pés
  rationale: A forma refere-se aos dois pés. O artigo definido com posse subentendida é idiomático em português depois de “lavei”.
- source_word: אֲטַנְּפֵם
  choice: sujá-los
  rationale: O piel de טנף significa tornar sujo, sujar. “Sujá-los” preserva a imagem física concreta e evita a conotação religiosa indevida de “profaná-los” ou “contaminá-los”.
theological_decisions:
- issue: Interpretação da fala da mulher
  choice: Traduzir como uma objeção doméstica concreta, sem inserir eufemismo sexual no texto principal.
  alternative: Ler a linguagem da túnica e dos pés primordialmente como metáfora erótica.
  rationale: Embora Cântico dos Cânticos admita dimensões literárias e simbólicas, a formulação imediata deste versículo é concreta e doméstica. A tradução preserva esse sentido sem excluir possíveis leituras no plano interpretativo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A fala mantém tom íntimo e doméstico. “Como vou” soa natural e comunica relutância; “túnica” preserva a referência cultural específica. O marcador [a] aparece no texto principal.
