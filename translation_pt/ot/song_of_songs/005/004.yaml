  text: My beloved put his hand through the opening[b][a], and my inward parts trembled for him.
translation:
  language: pt
  text: Meu amado estendeu a mão pela abertura[a], e minhas entranhas[b] se agitaram por ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pelo buraco”. O hebraico diz literalmente “do buraco”, provavelmente referindo-se a uma abertura na porta.
    reason: lexical_alternative
  - marker: b
    text: Ou “meu íntimo se comoveu por ele” ou “minhas entranhas estremeceram por ele”. O hebraico descreve uma emoção profunda por meio de uma reação corporal.
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹדִי
  choice: meu amado
  rationale: Designa o homem amado pela mulher no Cântico. “Meu amado” conserva o tom relacional e poético sem tornar explícita uma nuance sexual que, embora possa estar presente no contexto, não precisa ser acrescentada aqui.
- source_word: שָׁלַח יָדוֹ
  choice: estendeu a mão
  rationale: Embora שׁלח costume significar “enviar”, com “mão” descreve o ato de estendê-la ou introduzi-la. “Estendeu a mão” é natural em português e preserva o movimento sem especificar além do texto até onde ela chegou.
- source_word: מִן הַחֹר
  choice: pela abertura
  rationale: O substantivo חֹר indica um buraco ou abertura, provavelmente na porta. A preposição é literalmente “de/desde”, mas neste contexto o português idiomático emprega “pela” para expressar o movimento através da abertura.
- source_word: וּמֵעַי
  choice: minhas entranhas
  rationale: O termo se refere literalmente aos órgãos internos e, por extensão, à sede de emoções profundas. “Minhas entranhas” mantém a imagem corporal hebraica, ao passo que “meu coração” seria mais interpretativo.
- source_word: הָמוּ
  choice: se agitaram
  rationale: O verbo expressa movimento, tumulto ou comoção interior. “Se agitaram” preserva tanto a dimensão física quanto a emocional sem limitar o sentido a tremor, desejo ou compaixão.
- source_word: עָלָיו
  choice: por ele
  rationale: Neste contexto emocional, a preposição indica que o amado é o objeto ou motivo da comoção. “Por ele” conserva de modo conciso essa relação, sem decidir entre desejo, ternura e perturbação.
