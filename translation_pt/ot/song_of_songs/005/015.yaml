  text: שׁוֹקָי/ו֙ עַמּ֣וּדֵי שֵׁ֔שׁ מְיֻסָּדִ֖ים עַל אַדְנֵי פָ֑ז מַרְאֵ֨/הוּ֙ כַּ/לְּבָנ֔וֹן בָּח֖וּר כָּ/אֲרָזִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/015.yaml
  text: His legs are pillars of marble[a], set on bases of fine gold. His appearance is like Lebanon[b], choice as the cedars.
translation:
  language: pt
  text: Suas pernas são colunas de mármore[a], assentadas sobre bases de ouro fino. Seu aspecto é como o Líbano[b], excelente como os cedros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «colunas de alabastro»; o hebraico שֵׁשׁ pode designar uma pedra branca de alta qualidade, não necessariamente mármore.
    reason: lexical_alternative
  - marker: b
    text: Ou «Seu aspecto é como o Líbano, distinto como os cedros». Aqui, o hebraico בָּחוּר provavelmente expressa excelência singular, e não «jovem».
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹקָיו
  choice: suas pernas
  rationale: O termo pode abranger a perna ou a coxa; no retrato poético, «pernas» é natural, amplo e adequado à comparação com colunas.
- source_word: עַמּוּדֵי שֵׁשׁ
  choice: colunas de mármore
  rationale: «Colunas» conserva a imagem arquitetônica, e «mármore» representa de modo tradicional e compreensível a pedra branca e fina indicada por שֵׁשׁ, sem ocultar a incerteza lexical registrada na nota.
- source_word: מְיֻסָּדִים עַל אַדְנֵי פָז
  choice: assentadas sobre bases de ouro fino
  rationale: «Assentadas» comunica a colocação firme das colunas; «bases» é o equivalente arquitetônico claro de אַדְנֵי, e «ouro fino» expressa a alta qualidade de פָז.
- source_word: מַרְאֵהוּ
  choice: sua aparência
  rationale: O substantivo designa o aspecto ou a forma visível e, aqui, resume a impressão geral causada pelo homem descrito.
- source_word: כַּלְּבָנוֹן
  choice: como o Líbano
  rationale: Mantém a comparação geográfica, que evoca imponência, beleza e majestade.
- source_word: בָּחוּר כָּאֲרָזִים
  choice: magnífica como os cedros
  rationale: Neste contexto, בָּחוּר provavelmente indica qualidade escolhida, distinta ou excelente, e não simplesmente juventude; «magnífica» produz uma predicação natural em português e preserva o elogio elevado.
