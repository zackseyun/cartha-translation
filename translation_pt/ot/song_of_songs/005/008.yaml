  text: הִשְׁבַּ֥עְתִּי אֶתְ/כֶ֖ם בְּנ֣וֹת יְרוּשָׁלִָ֑ם אִֽם תִּמְצְאוּ֙ אֶת דּוֹדִ֔/י מַה תַּגִּ֣ידוּ ל֔/וֹ שֶׁ/חוֹלַ֥ת אַהֲבָ֖ה אָֽנִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/008.yaml
  text: 'I adjure you[a], daughters of Jerusalem: if you find my beloved, what will you tell him? That I am sick with love.'
translation:
  language: pt
  text: 'Eu as faço jurar, ó filhas de Jerusalém: se encontrarem o meu amado, o que lhe dirão? Que estou doente de amor.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que desfaleço de amor”. O hebraico diz literalmente “doente de amor”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁבַּעְתִּי אֶתְכֶם
  choice: Eu as faço jurar
  rationale: O hifil de שׁבע, com objeto direto, expressa impor um juramento ou fazer alguém jurar. A formulação preserva a solenidade e a urgência sem recorrer ao pouco corrente “conjuro”.
- source_word: בְּנוֹת יְרוּשָׁלִָם
  choice: ó filhas de Jerusalém
  rationale: Reprodução direta do vocativo convencional do Cântico; “ó” torna clara e natural a interpelação poética em português.
- source_word: אִם תִּמְצְאוּ
  choice: se encontrarem
  rationale: Mantém o valor condicional normal de אִם, sem transformá-lo na expectativa mais definida de “quando”.
- source_word: דּוֹדִי
  choice: o meu amado
  rationale: No Cântico, דּוֹדִי designa o parceiro amado. “Meu amado” é digno, natural e menos estreito que “meu amante”.
- source_word: מַה תַּגִּידוּ לוֹ
  choice: o que lhe dirão?
  rationale: Conserva a pergunta direta e traduz naturalmente o hifil de נגד como comunicar ou dizer algo a alguém.
- source_word: שֶׁחוֹלַת אַהֲבָה אָנִי
  choice: Que estou doente de amor
  rationale: 'Preserva a imagem concreta e a ordem comunicativa da resposta hebraica: a mulher está enferma por causa do amor, em vez de comprimir a expressão numa paráfrase.'
- source_word: אַהֲבָה
  choice: amor
  rationale: Equivalente direto, corrente e poeticamente apropriado.
theological_decisions: []
translation_notes:
  register: Português moderno, poético e amplamente compreensível, com boa legibilidade brasileira. O plural feminino é explicitado em “as faço jurar” porque a fala se dirige às filhas de Jerusalém. A tradução conserva a condição “se”, a pergunta retórica e a metáfora corporal do hebraico.
