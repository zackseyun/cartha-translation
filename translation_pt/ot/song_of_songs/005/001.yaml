base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/001.yaml
  text: I have come into my garden[a], my sister, my bride; I have gathered my myrrh with my spice. I have eaten my honeycomb with my honey; I have drunk my wine with my milk. Eat, friends; drink, and be drunk, beloved ones.
translation:
  language: pt
  text: Entrei no meu jardim, minha irmã, minha noiva; recolhi a minha mirra com as minhas especiarias. Comi o meu favo com o meu mel; bebi o meu vinho com o meu leite. Comam, amigos; bebam e embriaguem-se, amantes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “bebam e embriaguem-se de amor”. O termo hebraico pode ser entendido como vocativo (“amantes”) ou como referência ao amor e às suas expressões.'
    reason: alternative_reading
lexical_decisions:
- source_word: בָּאתִי לְגַנִּי
  choice: Entrei no meu jardim
  rationale: O perfeito de בוא descreve a chegada já realizada; com o destino marcado por לְ, “entrei” expressa naturalmente em português o ingresso no jardim.
- source_word: אֲחֹתִי כַלָּה
  choice: minha irmã, minha noiva
  rationale: Mantém separadamente os dois vocativos afetivos característicos do Cântico, sem transformá-los num composto artificial.
- source_word: אָרִיתִי
  choice: recolhi
  rationale: O verbo ארה indica colher ou ajuntar produtos aromáticos; “recolhi” é claro e suficientemente abrangente para a mirra e as especiarias.
- source_word: מוֹרִי עִם בְּשָׂמִי
  choice: a minha mirra com as minhas especiarias
  rationale: “Mirra” preserva a resina aromática concreta. בְּשָׂמִי é formalmente singular coletivo e pode designar substâncias aromáticas; o plural idiomático “especiarias” evita sugerir uma única especiaria específica.
- source_word: יַעְרִי עִם דִּבְשִׁי
  choice: o meu favo com o meu mel
  rationale: יַעַר, neste contexto, refere-se ao favo ou ao mel ainda no favo; “favo” preserva o paralelismo concreto com “mel”.
- source_word: יֵינִי עִם חֲלָבִי
  choice: o meu vinho com o meu leite
  rationale: Tradução direta dos substantivos possessivos, preservando a abundante imagem sensorial do banquete.
- source_word: אִכְלוּ רֵעִים
  choice: Comam, amigos
  rationale: O imperativo plural e o vocativo são reproduzidos de modo natural e atual.
- source_word: שְׁתוּ וְשִׁכְרוּ דּוֹדִים
  choice: bebam e embriaguem-se, amantes
  rationale: Trata דּוֹדִים como vocativo, leitura sintaticamente direta, e mantém a intensidade do imperativo שִׁכְרוּ sem acrescentar um complemento ausente no hebraico.
theological_decisions:
- issue: Sentido de דּוֹדִים no convite final
  choice: 'vocativo: “amantes”'
  alternative: 'substantivo abstrato: “embriaguem-se de amor”'
  rationale: A forma pode evocar tanto os amantes quanto o amor ou suas carícias no Cântico. Como não há preposição equivalente a “de/com” no texto, a tradução principal adota o vocativo e registra em nota a leitura abstrata, preservando a ambiguidade poética sem impor interpretação alegórica ou doutrinária.
translation_notes:
  register: Português moderno, digno e poético, com ampla legibilidade brasileira. Preferiu-se o pretérito perfeito para a sequência hebraica de ações concluídas e o imperativo na terceira pessoa do plural, corrente no português brasileiro. A repetição dos possessivos conserva o ritmo e a exuberância sensorial do original.
