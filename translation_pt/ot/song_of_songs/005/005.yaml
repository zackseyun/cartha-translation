  text: I arose to open to my beloved[a], and my hands dripped with myrrh, my fingers with flowing myrrh[b], on the handles of the bolt.
translation:
  language: pt
  text: Levantei-me para abrir ao meu amado; minhas mãos gotejavam mirra, e meus dedos, mirra que escorria[a] sobre os puxadores do ferrolho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mirra líquida” ou “mirra fluida”.
    reason: lexical_alternative
  - marker: b
    text: Ou “as maçanetas da fechadura” ou “o trinco”.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַמְתִּי אֲנִי
  choice: Levantei-me
  rationale: O perfeito qal na primeira pessoa, acompanhado do pronome explícito, dá ênfase à ação da mulher. “Levantei-me” preserva o tom literário sem soar arcaico.
- source_word: לִפְתֹּחַ לְדוֹדִי
  choice: para abrir ao meu amado
  rationale: O infinitivo פתח significa “abrir”, e דּוֹדִי designa o amado no Cântico. A formulação concisa conserva a construção do hebraico e deixa implícita a porta, como no original.
- source_word: יָדַי נָטְפוּ מוֹר
  choice: minhas mãos gotejavam mirra
  rationale: נטף expressa o ato de gotejar. A tradução mantém a imagem sensorial e o paralelismo com os dedos.
- source_word: אֶצְבְּעֹתַי
  choice: meus dedos
  rationale: Equivalente direto e natural do substantivo hebraico no plural.
- source_word: מוֹר עֹבֵר
  choice: mirra fluida
  rationale: עֹבֵר, literalmente “que passa”, parece caracterizar aqui a mirra como líquida ou escorrendo. “Fluida” preserva essa qualidade sem definir além do que o contexto permite.
- source_word: עַל כַּפּוֹת הַמַּנְעוּל
  choice: sobre os puxadores do ferrolho
  rationale: עַל indica contato ou localização. No contexto de uma porta, כַּפּוֹת refere-se às partes seguradas com a mão, e מַנְעוּל ao dispositivo que fecha a porta. “Puxadores do ferrolho” comunica a ferragem antiga com clareza razoável.
