  text: חִכּ/וֹ֙ מַֽמְתַקִּ֔ים וְ/כֻלּ֖/וֹ מַחֲּמַדִּ֑ים זֶ֤ה דוֹדִ/י֙ וְ/זֶ֣ה רֵעִ֔/י בְּנ֖וֹת יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/016.yaml
  text: His mouth is sweetness itself[a], and all of him is desirable. This is my beloved, and this is my friend[b], O daughters of Jerusalem.
translation:
  language: pt
  text: Sua boca é pura doçura[a], e todo ele é desejável[b]. Este é o meu amado, e este é o meu amigo, ó filhas de Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “seu palato [é] doçuras”; também pode ser entendido como “sua boca é doce”.
    reason: lexical_alternative
  - marker: b
    text: Ou “todo ele é encantador” ou, mais literalmente, “todo ele é coisas desejáveis”. O hebraico emprega um plural intensivo para expressar quanto ele é desejável ou encantador.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִכּוֹ
  choice: sua boca
  rationale: O substantivo designa literalmente o palato ou céu da boca, mas aqui funciona poeticamente por metonímia para a boca, possivelmente evocando beijos, fala ou sabor. “Sua boca” é natural e mantém a imagem corporal; a nota preserva o sentido mais literal.
- source_word: מַמְתַקִּים
  choice: pura doçura
  rationale: O plural hebraico tem valor intensivo ou abstrato. “Pura doçura” comunica essa intensidade em português corrente e poético, sem recorrer ao plural pouco natural “doçuras”.
- source_word: וְכֻלּוֹ
  choice: e ele por inteiro
  rationale: Reproduz a ideia concreta de “todo ele” em uma construção portuguesa fluente, mantendo o foco na pessoa como um todo.
- source_word: מַחֲמַדִּים
  choice: é desejável
  rationale: O termo expressa aquilo que é desejável, precioso ou encantador. O adjetivo predicativo é natural em português, enquanto a nota registra o plural intensivo do hebraico e outras possibilidades poéticas.
- source_word: זֶה דוֹדִי
  choice: Este é o meu amado
  rationale: Mantém o demonstrativo enfático e traduz דּוֹדִי pelo termo afetivo e poético usual “meu amado”, sem estreitar seu sentido para uma designação apenas sexual.
- source_word: וְזֶה רֵעִי
  choice: e este é o meu amigo
  rationale: Conserva a repetição enfática do demonstrativo e o sentido direto de רֵעַ como amigo ou companheiro.
- source_word: בְּנוֹת יְרוּשָׁלִָם
  choice: ó filhas de Jerusalém
  rationale: Preserva a forma poética e recorrente de tratamento no Cântico. A partícula “ó” deixa clara a função vocativa em português.
theological_decisions:
- issue: Possível leitura messiânica ou devocional de מַחֲמַדִּים
  choice: 'Traduzir no sentido imediato do poema de amor: “desejável”.'
  alternative: Empregar uma formulação tradicional como “totalmente encantador”, potencialmente carregada de ressonâncias devocionais posteriores.
  rationale: O contexto apresenta a mulher elogiando seu amado. A tradução não transforma o vocábulo em título nem introduz uma identificação teológica que o hebraico, neste verso, não exige.
translation_notes:
  register: Português moderno, poético e digno, com ampla legibilidade brasileira. A repetição de “este é” conserva o paralelismo enfático do hebraico; “ó filhas de Jerusalém” mantém o refrão literário tradicional sem arcaísmo excessivo.
