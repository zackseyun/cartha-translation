base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/006.yaml
  text: I opened to my beloved[a], but my beloved had turned away and gone. My soul went out when he spoke; I sought him, but I did not find him. I called him[b], but he did not answer me.
translation:
  language: pt
  text: Eu abri para o meu amado, mas o meu amado já havia se esquivado e partido.[a] Minha alma se foi quando ele falou.[b] Eu o procurei, mas não o encontrei; chamei por ele, mas ele não me respondeu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “havia escapado e passado adiante”. O hebraico emprega dois verbos para enfatizar a partida dele.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Minha alma desfaleceu quando ele falou” ou “Fiquei fora de mim quando ele falou”. A expressão hebraica é vívida e admite mais de uma compreensão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּתַחְתִּי אֲנִי
  choice: Eu abri
  rationale: O pronome independente אֲנִי dá alguma ênfase ao sujeito, mas o português não exige “eu mesma” neste contexto; a presença explícita de “eu” preserva de modo natural parte dessa ênfase.
- source_word: לְדוֹדִי
  choice: para o meu amado
  rationale: Com o verbo “abrir”, a preposição ל indica aquele para quem se abre. “Para o meu amado” é natural em português e mantém o sentido afetivo de דּוֹד.
- source_word: וְדוֹדִי
  choice: mas o meu amado
  rationale: 'Embora וְ normalmente seja aditivo, aqui a sequência cria um contraste claro: ela abre, mas ele já partiu. “Mas” explicita essa relação discursiva sem alterar o sentido.'
- source_word: חָמַק עָבָר
  choice: já havia se esquivado e partido
  rationale: Os dois verbos retratam e intensificam a retirada do amado. “Se esquivado e partido” mantém as duas ações, enquanto “já havia” esclarece que a partida precedeu o momento em que ela abriu.
- source_word: נַפְשִׁי יָצְאָה
  choice: Minha alma se foi
  rationale: A formulação conserva a imagem hebraica intensa e sua ambiguidade poética, sem reduzi-la a uma única reação psicológica como “desfaleci” ou “fiquei fora de mim”.
- source_word: בְדַבְּרוֹ
  choice: quando ele falou
  rationale: A preposição בְּ com o infinitivo pode ter valor temporal. A tradução é clara e permite que a fala seja entendida em conexão com a voz do amado no contexto anterior.
- source_word: בִּקַּשְׁתִּיהוּ
  choice: Eu o procurei
  rationale: בקשׁ indica buscar ou procurar. “Procurei” é corrente em português e adequado à busca concreta narrada.
- source_word: וְלֹא מְצָאתִיהוּ
  choice: mas não o encontrei
  rationale: A negação simples do perfeito é preservada sem acrescentar uma ideia de incapacidade, como ocorreria em “não consegui encontrá-lo”.
- source_word: קְרָאתִיו
  choice: chamei por ele
  rationale: Embora o hebraico traga sufixo de objeto direto, “chamar por ele” é a construção idiomática mais natural em português para clamar a alguém ausente.
- source_word: וְלֹא עָנָנִי
  choice: mas ele não me respondeu
  rationale: ענה significa responder neste contexto. A formulação mantém o caráter pessoal e doloroso do silêncio do amado.
