  yaml_path: translation/ot/song_of_songs/005/012.yaml
  text: His eyes are like doves beside streams of water[a], bathed in milk, sitting by fullness.
translation:
  language: pt
  text: Seus olhos são como pombas junto aos cursos de água, banhadas em leite, pousadas junto à plenitude.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico da frase final é difícil. A expressão “junto à plenitude” também pode referir-se a olhos bem assentados em seu encaixe ou retratar pombas junto a águas abundantes ou a um reservatório cheio.
    reason: alternative_reading
lexical_decisions:
- source_word: עֵינָיו
  choice: Seus olhos
  rationale: עַיִן significa normalmente “olho”; o sufixo possessivo e a comparação com pombas indicam aqui os olhos do amado, não fontes.
- source_word: כְּיוֹנִים
  choice: como pombas
  rationale: A preposição כ introduz uma comparação; “como pombas” é natural em português e mantém a imagem poética.
- source_word: עַל אֲפִיקֵי מָיִם
  choice: junto aos cursos de água
  rationale: אֲפִיקִים designa canais, leitos ou cursos de água. “Junto aos cursos de água” conserva tanto a proximidade expressa por עַל quanto o cenário aquático.
- source_word: רֹחֲצוֹת
  choice: banhadas
  rationale: O particípio feminino plural de רחץ concorda formalmente com “pombas” e pode descrever as pombas como banhando-se ou já banhadas. “Banhadas” é fluente e preserva a imagem.
- source_word: בֶּחָלָב
  choice: em leite
  rationale: A preposição ב pode ser entendida em sentido locativo; a formulação mantém a imagem vívida da brancura do leite.
- source_word: יֹשְׁבוֹת
  choice: pousadas
  rationale: O particípio feminino plural de ישב significa literalmente “sentadas” ou “habitantes”. Para pombas, “pousadas” exprime naturalmente a posição sem eliminar a metáfora.
- source_word: עַל מִלֵּאת
  choice: junto a um tanque cheio
  rationale: A expressão é rara e difícil. Esta leitura entende מִלֵּאת como algo cheio, provavelmente um reservatório ou tanque, e mantém a cena das pombas junto à água; a possível referência ao bom assentamento dos olhos é registrada em nota.
