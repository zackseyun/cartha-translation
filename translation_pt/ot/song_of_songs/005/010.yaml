  text: My beloved is radiant and ruddy[a], distinguished among ten thousand.
translation:
  language: pt
  text: 'O meu amado é radiante e corado,

    destacado entre dez mil.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “assinalado como por uma bandeira entre dez mil”; ou “conspícuo entre dez mil”.
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹדִי
  choice: o meu amado
  rationale: No Cântico dos Cânticos, דּוֹד designa repetidamente o homem amado pela mulher. “O meu amado” é natural, digno e mantém a linguagem relacional recorrente do livro.
- source_word: צַח
  choice: radiante
  rationale: O adjetivo comunica brilho, claridade ou aparência luminosa. “Radiante” preserva essa imagem sem reduzi-la a uma referência inequívoca à cor da pele.
- source_word: וְאָדוֹם
  choice: e corado
  rationale: אָדוֹם indica coloração vermelha. Aplicado à aparência de uma pessoa, “corado” exprime em português atual uma tonalidade avermelhada e saudável com mais naturalidade do que “vermelho”.
- source_word: דָּגוּל
  choice: inconfundível
  rationale: A forma está ligada à ideia de bandeira ou estandarte e, no contexto, provavelmente descreve alguém claramente marcado, destacado ou conspícuo. “Inconfundível” comunica que ele se sobressai visualmente, sem afirmar uma superioridade abstrata mais forte que o hebraico.
- source_word: מֵרְבָבָה
  choice: entre dez mil
  rationale: A preposição מִן apresenta o grande conjunto do qual ele se destaca. “Entre dez mil” é uma expressão poética natural e conserva o número do texto hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, poético e digno, com leitura natural sobretudo no Brasil e compreensão internacional. O paralelismo foi disposto em dois versos. A nota preserva a imagem etimológica incerta de דָּגוּל sem tornar a tradução principal obscura.
