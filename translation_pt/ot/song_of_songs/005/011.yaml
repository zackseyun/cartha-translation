  yaml_path: translation/ot/song_of_songs/005/011.yaml
  text: His head is finest gold[a]; his locks are wavy[b], black as a raven.
translation:
  language: pt
  text: Sua cabeça é ouro finíssimo[a]; suas mechas são onduladas[b], negras como o corvo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ouro fino”; o hebraico reúne dois termos para ouro, reforçando a ideia de elevada qualidade.
    reason: lexical_alternative
  - marker: b
    text: Ou “encaracoladas” ou “em cachos”; o termo hebraico é raro e poético.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁוֹ
  choice: Sua cabeça
  rationale: רֹאשׁ tem aqui o sentido anatômico concreto de “cabeça”, adequado à descrição poética do corpo do amado.
- source_word: כֶּתֶם פָּז
  choice: ouro finíssimo
  rationale: A combinação de dois termos ligados ao ouro enfatiza seu caráter precioso e sua alta qualidade. “Ouro finíssimo” preserva essa força poética sem reproduzir de modo artificial a construção hebraica.
- source_word: קְוּצּוֹתָיו
  choice: suas mechas
  rationale: O termo designa mechas ou cachos de cabelo. “Mechas” é natural, poético e não antecipa a forma descrita pela palavra seguinte.
- source_word: תַּלְתַּלִּים
  choice: onduladas
  rationale: O termo poético raro parece descrever cabelos em ondas ou cachos. “Onduladas” mantém a imagem e evita especificar além da certeza lexical.
- source_word: שְׁחֹרוֹת
  choice: negras
  rationale: O adjetivo indica diretamente a cor preta; “negras” concorda com “mechas” e conserva a intensidade da comparação.
- source_word: כָּעוֹרֵב
  choice: como o corvo
  rationale: A preposição comparativa e o substantivo “corvo” formam uma imagem poética da negrura do cabelo. O artigo definido soa natural em português nesse tipo de comparação.
