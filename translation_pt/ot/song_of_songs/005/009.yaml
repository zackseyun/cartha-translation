base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/009.yaml
  text: What is your beloved more than another beloved[a], most beautiful among women? What is your beloved more than another beloved[b], that you have made us swear thus?
translation:
  language: pt
  text: O que o seu amado tem a mais que outro amado[a], ó mais bela entre as mulheres? O que o seu amado tem a mais que outro amado, que você nos fez jurar assim[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o seu querido” ao longo do versículo; o termo hebraico דּוֹד designa aqui a pessoa amada em sentido romântico.
    reason: lexical_alternative
  - marker: b
    text: Ou “que você nos tenha posto sob juramento”; o verbo hebraico significa fazer alguém jurar.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה דּוֹדֵךְ מִדּוֹד
  choice: O que o seu amado tem a mais que outro amado
  rationale: A construção interrogativa com מִן expressa comparação. “Tem a mais que” é natural em português e preserva a pergunta reiterada e o paralelismo hebraico.
- source_word: דּוֹדֵךְ
  choice: seu amado
  rationale: No Cântico, דּוֹד designa o homem amado em sentido romântico. “Amado” conserva o tom poético e relacional; “amante” é possível, mas pode sugerir em português uma relação extraconjugal não indicada pelo texto.
- source_word: הַיָּפָה בַּנָּשִׁים
  choice: ó mais bela entre as mulheres
  rationale: A expressão funciona contextualmente como superlativo. O vocativo com “ó” mantém a dignidade poética e deixa clara a forma de tratamento.
- source_word: שֶׁכָּכָה
  choice: assim
  rationale: O advérbio indica modo ou intensidade e remete à maneira enfática como ela as fez jurar. “Assim” é corrente, conciso e fiel.
- source_word: הִשְׁבַּעְתָּנוּ
  choice: você nos tenha feito jurar
  rationale: O hifil de שבע significa causar alguém a jurar ou pôr alguém sob juramento. A formulação escolhida é transparente em português moderno.
theological_decisions: []
translation_notes:
  register: Português moderno, poético e amplamente compreensível, com boa legibilidade brasileira. A repetição da pergunta foi mantida para preservar o paralelismo do original. O singular feminino “você” corresponde à forma hebraica dirigida à mulher.
