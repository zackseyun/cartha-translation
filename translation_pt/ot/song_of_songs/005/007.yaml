base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/007.yaml
  text: The watchmen who go about the city found me[a]; they struck me, they wounded me[b]; the keepers of the walls took my cloak from me.
translation:
  language: pt
  text: Os guardas que rondavam a cidade me encontraram; bateram em mim e me feriram; os guardas das muralhas tiraram de mim meu manto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meu véu” ou “meu xale”. O termo hebraico רְדִיד designa uma peça exterior usada como envoltório ou cobertura.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְצָאֻנִי
  choice: me encontraram
  rationale: Traduz diretamente מצא e se ajusta ao contexto em que a mulher percorria a cidade à procura do amado.
- source_word: הַשֹּׁמְרִים
  choice: os guardas
  rationale: Designa aqueles que mantêm vigilância; em português atual, “guardas” é natural no cenário urbano e noturno.
- source_word: הַסֹּבְבִים בָּעִיר
  choice: que rondavam a cidade
  rationale: Preserva o sentido de סבב, “andar ao redor, circular”, e expressa naturalmente as rondas dos guardas sem acrescentar uma instituição policial moderna.
- source_word: הִכּוּנִי
  choice: bateram em mim
  rationale: נכה é um verbo amplo de golpear; a formulação é clara e natural, enquanto o verbo seguinte explicita que houve ferimento.
- source_word: פְצָעוּנִי
  choice: me feriram
  rationale: Mantém o sentido forte e distinto de פצע, indicando que os golpes causaram feridas.
- source_word: נָשְׂאוּ אֶת רְדִידִי מֵעָלַי
  choice: arrancaram de mim o meu manto
  rationale: נשא com מֵעָלַי indica retirar a peça que estava sobre ela; “arrancaram” comunica a remoção violenta sugerida pelo contexto, e “manto” representa uma cobertura exterior sem definir indevidamente seu formato.
- source_word: שֹׁמְרֵי הַחֹמוֹת
  choice: os guardas das muralhas
  rationale: Traduz a construção como os homens encarregados de vigiar as muralhas e mantém a ligação lexical com os “guardas” da primeira oração.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Rondavam” conserva o movimento circular do particípio hebraico; “muralhas” evita a leitura doméstica que “paredes” poderia sugerir. A violência da sequência foi preservada sem eufemismo.
