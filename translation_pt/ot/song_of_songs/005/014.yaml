  text: יָדָי/ו֙ גְּלִילֵ֣י זָהָ֔ב מְמֻלָּאִ֖ים בַּ/תַּרְשִׁ֑ישׁ מֵעָי/ו֙ עֶ֣שֶׁת שֵׁ֔ן מְעֻלֶּ֖פֶת סַפִּירִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/014.yaml
  text: His hands are rods of gold[a], set with beryl; his body is polished ivory[c][b], covered with sapphires.
translation:
  language: pt
  text: Suas mãos são cilindros de ouro[a], cravejados de berilo[b]; seu ventre é uma peça de marfim polido[c], revestida de safiras[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “anéis de ouro”. O termo hebraico descreve formas arredondadas ou cilíndricas e pode evocar joias finamente trabalhadas.
    reason: lexical_alternative
  - marker: b
    text: Ou “topázio” ou “crisólito”. Não se sabe ao certo qual pedra é designada pelo termo hebraico תַּרְשִׁישׁ.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “suas partes internas” ou “seu abdômen”. Neste contexto, a expressão descreve literalmente a região do ventre.'
    reason: lexical_alternative
  - marker: d
    text: A pedra antiga chamada סַפִּיר pode não corresponder exatamente à safira moderna.
    reason: lexical_uncertainty
lexical_decisions:
- source_word: יָדָיו
  choice: suas mãos
  rationale: יָד significa normalmente “mão”, embora possa se estender ao braço. “Mãos” preserva a referência corporal direta e a sequência poética.
- source_word: גְּלִילֵי זָהָב
  choice: cilindros de ouro
  rationale: גְּלִילִים designa formas arredondadas ou cilíndricas. “Cilindros” conserva essa imagem sem decidir pela interpretação tradicional “anéis”.
- source_word: מְמֻלָּאִים בַּתַּרְשִׁישׁ
  choice: cravejados de berilo
  rationale: No contexto de ourivesaria, o particípio “cheios” indica pedras engastadas; “cravejados” é idiomático em português. A identificação de תַּרְשִׁישׁ é incerta, e “berilo” é uma aproximação tradicional plausível, assinalada em nota.
- source_word: מֵעָיו
  choice: seu ventre
  rationale: מֵעֶה pode indicar as partes internas ou a região abdominal. Neste retrato físico, “ventre” mantém o sentido corporal e a dignidade poética sem ampliá-lo para todo o corpo.
- source_word: עֶשֶׁת שֵׁן
  choice: uma peça de marfim polido
  rationale: A expressão sugere marfim maciço e trabalhado. “Peça de marfim polido” comunica tanto o objeto elaborado quanto seu acabamento lustroso.
- source_word: מְעֻלֶּפֶת סַפִּירִים
  choice: revestida de safiras
  rationale: O particípio exprime estar coberto ou sobreposto; “revestida” preserva a rica imagem ornamental. “Safiras” segue a identificação tradicional de סַפִּירִים, com ressalva em nota.
