base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/013.yaml
  text: His cheeks are like beds of spice[a], mounds of perfumes; his lips are lilies, dripping flowing myrrh.
translation:
  language: pt
  text: 'Suas faces são como um canteiro de especiarias,

    montes de perfumes[a];

    seus lábios são lírios

    que gotejam mirra líquida.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “torres de perfumes” ou “canteiros elevados de especiarias”. A imagem hebraica é difícil e pode indicar elevações ou montes de plantas e preparados aromáticos, em vez de torres literais.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְחָיָו
  choice: suas faces
  rationale: O plural com sufixo masculino singular designa os lados do rosto, isto é, as faces. Em português, “faces” mantém o tom poético e evita o sentido predominantemente infantil ou coloquial que “bochechas” pode assumir.
- source_word: כַּעֲרוּגַת הַבֹּשֶׂם
  choice: como canteiros de especiarias
  rationale: עֲרוּגָה é um canteiro ou parcela cultivada, e בֹּשֶׂם designa substância ou planta aromática. O plural em português acompanha naturalmente as duas faces, embora o hebraico use o singular coletivo na comparação.
- source_word: מִגְדְּלוֹת מֶרְקָחִים
  choice: elevações de aromas
  rationale: A expressão hebraica é difícil. מִגְדְּלוֹת pode evocar torres ou formas elevadas, enquanto מֶרְקָחִים se refere a misturas aromáticas ou perfumes preparados. “Elevações de aromas” preserva a verticalidade incomum da imagem sem sugerir necessariamente construções literais; a alternativa mais literal aparece em nota.
- source_word: שִׂפְתוֹתָיו
  choice: seus lábios
  rationale: Equivalência direta e natural do substantivo plural com sufixo masculino singular.
- source_word: שׁוֹשַׁנִּים
  choice: lírios
  rationale: “Lírios” conserva a identificação tradicional e reconhecível do termo floral, cuja espécie botânica exata permanece incerta.
- source_word: נֹטְפוֹת
  choice: que gotejam
  rationale: O particípio descreve gotas que escorrem ou caem suavemente. A oração relativa produz uma imagem clara e poética em português.
- source_word: מוֹר עֹבֵר
  choice: mirra fluida
  rationale: מוֹר é a resina aromática conhecida como mirra. עֹבֵר, literalmente associado a passar ou fluir, qualifica aqui a mirra como líquida e corrente; “fluida” preserva esse valor sem tornar a expressão pesada.
