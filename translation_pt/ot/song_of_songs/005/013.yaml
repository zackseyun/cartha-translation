translation_notes:
  register: Português moderno, poético e digno, com versos breves que conservam o paralelismo. “Faces” foi preferido a “bochechas” pelo registro lírico. A imagem obscura de מִגְדְּלוֹת foi mantida aberta no texto e explicitada em nota, sem resolver indevidamente sua ambiguidade.
