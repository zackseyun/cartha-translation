  text: צָרַ֥ר ר֛וּחַ אוֹתָ֖/הּ בִּ/כְנָפֶ֑י/הָ וְ/יֵבֹ֖שׁוּ מִ/זִּבְחוֹתָֽ/םס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/019.yaml
  text: The wind has wrapped her in its wings[a], and they will be put to shame because of their sacrifices.
translation:
  language: pt
  text: O vento a envolveu em suas asas[a], e eles serão envergonhados por causa dos seus sacrifícios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Um espírito a prendeu em suas asas.” A palavra hebraica רוּחַ pode significar “vento”, “sopro” ou “espírito”, e o verbo pode significar “atar”, “cercar” ou “envolver”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרַר
  choice: envolveu
  rationale: O verbo expressa a ideia de atar, cercar ou envolver. Com “vento” e “asas”, “envolveu” conserva de modo natural a força da imagem poética e apresenta a ação como concluída, com consequências presentes.
- source_word: רוּחַ
  choice: vento
  rationale: Embora também possa significar “espírito” ou “sopro”, a imagem das asas e o contexto de juízo favorecem “vento”, sem especificar se a figura representa exílio, calamidade ou outro instrumento de juízo.
- source_word: אוֹתָהּ
  choice: a
  rationale: O pronome objeto feminino singular retoma a coletividade personificada no contexto, provavelmente Israel/Efraim.
- source_word: בִּכְנָפֶיהָ
  choice: em suas asas
  rationale: A preposição e o sufixo feminino singular formam a imagem de alguém apanhado dentro das “asas” do vento. Em português, “suas” concorda naturalmente com “asas” e remete ao vento pelo contexto.
- source_word: וְיֵבֹשׁוּ
  choice: e eles serão envergonhados
  rationale: O verbo denota vergonha ou desonra. A formulação comunica o resultado do juízo e preserva o plural hebraico.
- source_word: מִזִּבְחוֹתָם
  choice: por causa dos seus sacrifícios
  rationale: 'A preposição מן é entendida causalmente: os sacrifícios, idólatras no contexto, são a causa da vergonha. “Por causa de” torna essa relação clara sem acrescentar interpretação ao texto principal.'
theological_decisions:
- issue: Referente e imagem do juízo
  choice: O versículo retrata a coletividade feminina personificada como envolvida por um vento destrutivo e conduzida à vergonha por causa de seus sacrifícios.
  alternative: A imagem pode aludir mais especificamente ao exílio ou a uma calamidade que toma a nação; רוּחַ também pode ser entendido como “espírito”.
  rationale: O contexto imediato trata de infidelidade no culto, mas o texto não identifica diretamente o vento com exílio, calamidade ou outro agente específico. A tradução conserva essa tensão e explica apenas a alternativa lexical em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem e a metáfora poética do hebraico foram preservadas sem esclarecer em excesso a identidade do vento nem o sentido específico do juízo.
