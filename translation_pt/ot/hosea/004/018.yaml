  yaml_path: translation/ot/hosea/004/018.yaml
  text: When their drink is gone[a], they give themselves to prostitution[c][b]; her shields dearly love shame.
translation:
  language: pt
  text: Quando a bebida deles acaba[a], eles se entregam à prostituição; os escudos dela[b] amam profundamente a vergonha.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quando a bebida deles azeda” ou “Quando passa a bebedeira deles”. O início do texto hebraico é difícil e pode se referir tanto ao fim de uma bebedeira quanto a uma bebida que se alterou ou estragou.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “os escudos dela”; provavelmente uma metáfora para os governantes ou protetores dela.'
    reason: lexical_alternative
  - marker: c
    text: 'A expressão hebraica traduzida como “amam profundamente a vergonha” é difícil. Alguns entendem o termo intermediário de modo mais literal: “amam: ‘Deem vergonha!’”.'
    reason: alternative_reading
lexical_decisions:
- source_word: סָר
  choice: acaba
  rationale: O verbo סור significa literalmente “desviar-se, afastar-se, partir”. Com o substantivo seguinte, “acaba” expressa de modo natural a possível ideia de que a bebida ou a bebedeira chegou ao fim, sem ocultar outras leituras na nota.
- source_word: סָבְאָם
  choice: a bebida deles
  rationale: O substantivo, com sufixo de terceira pessoa do plural, pode indicar bebida, bebedeira ou consumo intoxicante. “A bebida deles” mantém a imagem concreta e corresponde de perto à forma hebraica.
- source_word: הַזְנֵה הִזְנוּ
  choice: eles se entregam à prostituição
  rationale: A construção com infinitivo absoluto e verbo finito intensifica a ação. Esta formulação conserva a imagem forte da prostituição, recorrente em Oseias para a infidelidade, e soa atual sem recorrer a vocabulário arcaico.
- source_word: אָהֲבוּ הֵבוּ
  choice: amam profundamente
  rationale: A sequência hebraica é difícil. אָהֲבוּ significa “amam/amaram”, e הֵבוּ pode ser entendido aqui como elemento intensificador. A tradução conjunta comunica apego intenso sem inserir no texto principal a leitura alternativa, mais literal e obscura, “Deem vergonha!”.
- source_word: קָלוֹן
  choice: vergonha
  rationale: Equivalente direto e corrente para o substantivo que denota vergonha, desonra ou ignomínia.
- source_word: מָגִנֶּיהָ
  choice: os escudos dela
  rationale: A expressão significa literalmente “os escudos dela”. A metáfora, provavelmente referente a governantes ou protetores, é preservada no texto e explicada em nota.
theological_decisions:
- issue: Se a linguagem de prostituição em Oseias deve ser suavizada como mera infidelidade
  choice: Conservar a linguagem concreta de prostituição no texto principal
  alternative: 'Traduzir de modo abstrato: “eles se entregam completamente à infidelidade”'
  rationale: Oseias emprega deliberadamente a imagem sexual para representar a infidelidade de Israel. Preservá-la mantém a força profética e não resolve antecipadamente a relação entre o sentido concreto e o metafórico.
- issue: Se מָגִנֶּיהָ deve ser interpretado no texto como governantes
  choice: Traduzir literalmente “os escudos dela” e explicar a provável metáfora em nota
  alternative: “os governantes dela” ou “os protetores dela”
  rationale: O referente provável são autoridades ou protetores, mas a imagem poética hebraica é genuína e deve permanecer visível ao leitor.
- issue: Como apresentar a difícil sequência אָהֲבוּ הֵבוּ קָלוֹן
  choice: “amam profundamente a vergonha” no texto, com a leitura mais literal em nota
  alternative: '“amam: ‘Deem vergonha!’”'
  rationale: A sintaxe e a função de הֵבוּ são incertas. A opção principal oferece uma leitura coerente e natural, enquanto a nota conserva a ambiguidade textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “se entregam à prostituição” preserva a intensidade sem soar arcaica; “os escudos dela” mantém deliberadamente a metáfora incomum do original.
