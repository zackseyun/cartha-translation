id: HOS.4.1
reference: Hosea 4:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שִׁמְע֥וּ דְבַר יְהוָ֖ה בְּנֵ֣י יִשְׂרָאֵ֑ל כִּ֣י רִ֤יב לַֽ/יהוָה֙ עִם יוֹשְׁבֵ֣י הָ/אָ֔רֶץ כִּ֠י אֵין אֱמֶ֧ת וְֽ/אֵין חֶ֛סֶד וְ/אֵֽין דַּ֥עַת אֱלֹהִ֖ים בָּ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/001.yaml
  text: Hear the word of Yahweh[a], sons of Israel, for Yahweh has a case against the inhabitants of the land, because there is no truth, no faithfulness[d][c][b], and no knowledge of God in the land.
translation:
  language: pt
  text: Ouçam a palavra de Yahweh[a], filhos de Israel[b], pois Yahweh tem uma causa[c] contra os habitantes da terra[d], porque não há verdade, nem amor leal[e], nem conhecimento de Deus na terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh representa o nome divino escrito em hebraico com as quatro consoantes YHWH; tradicionalmente, muitas traduções usam “SENHOR”.
    reason: divine_name
  - marker: b
    text: Ou “filhos e filhas de Israel” ou “povo de Israel”. O hebraico diz literalmente “filhos de Israel”.
    reason: lexical_alternative
  - marker: c
    text: Ou “tem uma acusação contra” ou “está em disputa com”. A expressão tem sentido jurídico.
    reason: lexical_alternative
  - marker: d
    text: Aqui, “terra” provavelmente se refere à terra de Israel; também pode ser traduzido como “país”.
    reason: scope_clarification
  - marker: e
    text: O termo hebraico também pode ser traduzido como “fidelidade”, “amor constante”, “lealdade” ou “misericórdia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Ouçam
  rationale: O imperativo plural preserva a convocação profética e se dirige diretamente ao povo.
- source_word: דְבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Mantém a fórmula profética tradicional e traduz o nome divino como nome próprio, não como título.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Reproduz com precisão a expressão hebraica e preserva sua ressonância nacional e pactual.
- source_word: רִיב
  choice: tem uma causa
  rationale: Comunica em português corrente o sentido jurídico de uma acusação ou disputa formal.
- source_word: עִם יוֹשְׁבֵי הָאָרֶץ
  choice: contra os habitantes da terra
  rationale: No contexto jurídico, a preposição indica a parte contra a qual Yahweh apresenta sua causa; 'habitantes' traduz naturalmente o particípio.
- source_word: אֱמֶת
  choice: verdade
  rationale: É uma tradução direta que conserva tanto a dimensão de veracidade quanto sua possível conotação de confiabilidade.
- source_word: חֶסֶד
  choice: amor leal
  rationale: Expressa de modo conciso a união de afeição e lealdade relacional própria do termo, sem inserir explicitamente 'aliança' no texto.
- source_word: דַּעַת אֱלֹהִים
  choice: conhecimento de Deus
  rationale: Preserva a formulação hebraica e permite que o contexto comunique seu sentido relacional e moral, não meramente intelectual.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o Tetragrama como nome pessoal; 'Yahweh' o representa diretamente, sem substituí-lo por um título.
- issue: Sentido de חֶסֶד na acusação profética
  choice: amor leal
  alternative: fidelidade; amor constante; misericórdia
  rationale: A escolha preserva a combinação de amor e lealdade, enquanto a nota mantém abertas as nuances legítimas do termo no contexto da relação de Israel com Deus.
- issue: Alcance de הָאָרֶץ
  choice: terra, provavelmente a terra de Israel
  alternative: mundo; país
  rationale: A convocação aos filhos de Israel e o contexto da acusação favorecem uma referência à terra em que eles habitam, sem acrescentar 'de Israel' ao texto.
- issue: Caráter jurídico de רִיב
  choice: tem uma causa contra
  alternative: tem uma acusação contra; está em disputa com
  rationale: A expressão conserva a imagem de um processo ou pleito judicial sem transformar a metáfora em terminologia excessivamente técnica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação “não há verdade, nem amor leal, nem conhecimento” reproduz com naturalidade a tripla negação hebraica. Mantiveram-se a convocação profética, a imagem judicial e as ambiguidades semânticas relevantes em notas breves.
