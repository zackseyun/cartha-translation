  text: כְּ/רֻבָּ֖/ם כֵּ֣ן חָֽטְאוּ לִ֑/י כְּבוֹדָ֖/ם בְּ/קָל֥וֹן אָמִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/007.yaml
  text: The more they increased[a], the more they sinned against me[b]; I will change their glory into disgrace.
translation:
  language: pt
  text: Quanto mais eles se multiplicavam[a], mais pecavam contra mim; trocarei a glória deles por desonra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “À medida que se multiplicavam, assim pecavam contra mim.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “transformarei a glória deles em desonra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרֻבָּם ... כֵּן
  choice: Quanto mais eles se multiplicavam, mais
  rationale: A construção correlativa expressa progressão proporcional. A fórmula portuguesa «quanto mais... mais...» é natural e conserva essa relação; «se multiplicavam» preserva a ideia de aumento numérico.
- source_word: חָטְאוּ לִי
  choice: pecavam contra mim
  rationale: חטא com ל indica aqui pecado dirigido contra alguém. A expressão portuguesa comunica claramente a ofensa contra Deus sem acrescentar interpretação.
- source_word: כְּבוֹדָם
  choice: a glória deles
  rationale: כָּבוֹד pode designar glória, honra ou posição. «Glória» mantém a amplitude e a possível ironia do termo, sem identificar indevidamente seu referente.
- source_word: בְּקָלוֹן
  choice: por desonra
  rationale: קָלוֹן significa desonra, vergonha ou ignomínia. Com o verbo de troca, «por desonra» expressa de modo idiomático a substituição da glória.
- source_word: אָמִיר
  choice: trocarei
  rationale: A forma verbal significa mudar ou trocar. «Trocarei ... por» reproduz com clareza a relação entre aquilo que se perde e aquilo que toma seu lugar.
theological_decisions:
- issue: Referente de «a glória deles»
  choice: Mantido sem explicação interpretativa
  alternative: Sua honra sacerdotal, sua riqueza ou posição, ou o próprio Deus como sua glória
  rationale: O hebraico não especifica o referente. Preservar «a glória deles» mantém a ambiguidade e a tensão teológica do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A correlação «quanto mais... mais...» comunica de modo claro a sintaxe hebraica, enquanto «a glória deles» permanece deliberadamente sem expansão interpretativa.
