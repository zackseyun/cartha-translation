  text: חֲב֧וּר עֲצַבִּ֛ים אֶפְרָ֖יִם הַֽנַּֽח לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/017.yaml
  text: Ephraim is joined to idols[a]; leave him alone.
translation:
  language: pt
  text: Efraim está ligado aos ídolos[a]; deixe-o em paz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Efraim está preso aos ídolos; deixe-o estar”. O hebraico é conciso, e a ordem final pode indicar que Efraim está sendo abandonado à idolatria que escolheu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲבוּר
  choice: está ligado
  rationale: O particípio passivo de חבר expressa a condição de estar unido ou preso a algo. “Está ligado” é natural em português e preserva a natureza exata do vínculo sem explicá-la em excesso.
- source_word: עֲצַבִּים
  choice: ídolos
  rationale: Embora o substantivo possa designar imagens, na polêmica profética refere-se com frequência a objetos de culto idolátrico. “Ídolos” comunica com clareza tanto o referente religioso quanto a censura do contexto.
- source_word: אֶפְרָיִם
  choice: Efraim
  rationale: Mantém-se o nome próprio por transliteração. Em Oseias, ele pode representar o reino do norte, mas essa metonímia não deve substituir o nome no texto principal.
- source_word: הַנַּח
  choice: deixe ... em paz
  rationale: O imperativo significa deixar, permitir que permaneça ou não interferir. “Deixe-o em paz” reproduz em português atual a ordem breve e abrupta do hebraico.
- source_word: לוֹ
  choice: -o
  rationale: O sufixo pronominal é masculino singular e retoma Efraim, aqui personificado. Com “deixe ... em paz”, o pronome oblíquo “o” é a forma natural em português.
theological_decisions:
- issue: Referente de Efraim
  choice: Mantém-se Efraim como sujeito nomeado, sem expansão no texto principal.
  alternative: Entender Efraim como designação metonímica do reino do norte ou de Israel.
  rationale: O versículo personifica Efraim e provavelmente se refere de modo coletivo ao reino do norte. Preservar o nome mantém a retórica profética e evita inserir uma explicação interpretativa no corpo do texto.
- issue: Força do imperativo final
  choice: 'Entende-se a frase como ordem dada a um interlocutor implícito para não interferir mais com Efraim: “deixe-o em paz”.'
  alternative: “Deixe-o estar” ou uma ordem de afastamento de Efraim; também se pode discutir a identidade do interlocutor não expresso.
  rationale: A leitura mais direta toma o imperativo masculino singular como dirigido a um interlocutor implícito, em vista do apego de Efraim à idolatria. Como a sintaxe hebraica é muito concisa, a nota preserva a nuance de abandono à escolha feita sem especificar além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação concisa procura conservar o caráter abrupto do hebraico; “Efraim” permanece personificado, e a nota registra alternativas lexicais e a possível nuance de abandono.
