  text: וְ/הָיָ֥ה כָ/עָ֖ם כַּ/כֹּהֵ֑ן וּ/פָקַדְתִּ֤י עָלָי/ו֙ דְּרָכָ֔י/ו וּ/מַעֲלָלָ֖י/ו אָשִׁ֥יב לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/009.yaml
  text: 'And it will be: like people[a], like priest. And I will punish him for his ways[b], and repay him for his deeds.'
translation:
  language: pt
  text: 'E será: como o povo, como o sacerdote[a]. E eu o castigarei por seus caminhos[b] e lhe retribuirei seus feitos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, de forma concisa: “como o povo, como o sacerdote”. A comparação indica que povo e sacerdote estarão sujeitos ao mesmo juízo.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico emprega pronomes no singular (“o”, “seus”, “lhe”). Eles podem ter sentido distributivo, aplicando-se ao grupo, ou podem concentrar o foco no sacerdote.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: E acontecerá
  rationale: Introduz em português natural a situação futura resultante expressa pelo verbo hebraico, sem acrescentar uma relação causal.
- source_word: כָעָם כַּכֹּהֵן
  choice: ao povo o mesmo que ao sacerdote
  rationale: Transmite a comparação hebraica concisa como igualdade de tratamento ou destino, com clareza para leitores modernos.
- source_word: וּפָקַדְתִּי
  choice: Eu o castigarei
  rationale: Neste contexto de juízo, פקד com עַל indica chamar alguém a prestar contas ou puni-lo; “castigarei” comunica diretamente o sentido judicial.
- source_word: עָלָיו
  choice: o
  rationale: Mantém o pronome no singular, como no hebraico, sem decidir se ele tem sentido distributivo/coletivo ou se se refere especificamente ao sacerdote.
- source_word: דְּרָכָיו
  choice: seus caminhos
  rationale: Preserva a metáfora hebraica comum para a conduta e o modo de viver.
- source_word: וּמַעֲלָלָיו
  choice: seus feitos
  rationale: Expressa atos moralmente avaliados de maneira concisa e dignificada.
- source_word: אָשִׁיב לוֹ
  choice: lhe retribuirei
  rationale: No contexto judicial, o Hifil de שוב com ל indica dar a alguém a paga correspondente à sua conduta.
theological_decisions:
- issue: Referente e número dos pronomes singulares na declaração de juízo
  choice: Manter o singular em “o”, “seus” e “lhe”
  alternative: Empregar o plural (“os”, “seus”, “lhes”) ou entender explicitamente o singular apenas como referência ao sacerdote
  rationale: O hebraico passa de uma comparação entre povo e sacerdote para sufixos singulares. A manutenção do singular preserva a possibilidade de uso distributivo ou coletivo e também a possibilidade de foco específico no sacerdote, sem resolver indevidamente a tensão.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação é clara e dignificada, preserva a linguagem judicial e mantém no singular a ambiguidade referencial do hebraico.
