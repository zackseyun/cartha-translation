source:
  edition: WLC
  text: אָלֹ֣ה וְ/כַחֵ֔שׁ וְ/רָצֹ֥חַ וְ/גָנֹ֖ב וְ/נָאֹ֑ף פָּרָ֕צוּ וְ/דָמִ֥ים בְּ/דָמִ֖ים נָגָֽעוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/002.yaml
  text: Cursing[a], lying, murder, theft, and adultery break out[b]; bloodshed follows bloodshed.
translation:
  language: pt
  text: Maldição[a], mentira, assassinato, furto e adultério irrompem; um derramamento de sangue sucede outro.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico também pode indicar juramento falso ou violação de juramento neste contexto de acusação da aliança.
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente, “sangues tocam sangues”: os atos de derramamento de sangue vêm um após outro, sem intervalo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָלֹה
  choice: maldição
  rationale: O termo pode designar a expressão de uma maldição ou um juramento falso/violado. “Maldição” preserva o sentido mais direto e mantém a concisão da lista, enquanto a nota registra a ambiguidade contextual.
- source_word: כַחֵשׁ
  choice: mentira
  rationale: Expressa mentir ou agir falsamente; o substantivo forma uma lista compacta e natural em português.
- source_word: רָצֹחַ
  choice: assassinato
  rationale: רצח normalmente indica morte ilícita, não o ato de matar em sentido genérico; “assassinato” conserva essa força moral.
- source_word: גָנֹב
  choice: roubo
  rationale: “Roubo” é uma formulação nominal concisa e corrente, adequada ao paralelismo da enumeração.
- source_word: נָאֹף
  choice: adultério
  rationale: O verbo se refere especificamente a cometer adultério; a forma nominal mantém o ritmo da lista.
- source_word: פָּרָצוּ
  choice: irrompem
  rationale: O verbo transmite a ideia de romper, abrir passagem ou explodir em ocorrência. “Irrompem” é vívido e evita acrescentar um objeto ausente do hebraico, como em “rompem todos os limites”.
- source_word: דָמִים
  choice: derramamento de sangue
  rationale: O plural hebraico “sangues” designa aqui atos de violência sangrenta, e não apenas sangue como substância.
- source_word: בְּדָמִים נָגָעוּ
  choice: derramamento de sangue se sucede a derramamento de sangue
  rationale: A expressão literal “sangues tocam sangues” retrata atos sangrentos encostando-se uns aos outros, isto é, ocorrendo em sucessão contínua.
theological_decisions:
- issue: Alcance de אָלֹה no contexto da acusação da aliança
  choice: Manter “maldição” no texto e registrar em nota a possibilidade de juramento falso ou violado
  alternative: Traduzir diretamente como “violação de juramentos”
  rationale: O hebraico permite mais de uma nuance. Tornar “violação de juramentos” a única leitura resolveria uma ambiguidade real e estreitaria indevidamente a acusação profética.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A enumeração nominal preserva o ritmo incisivo da lista hebraica; “irrompem” conserva sua imagem de violência que rompe para fora. As notas mantêm as duas ambiguidades lexicais relevantes sem sobrecarregar o texto principal.
