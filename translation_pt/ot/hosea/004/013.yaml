source:
  edition: WLC
  text: עַל רָאשֵׁ֨י הֶ/הָרִ֜ים יְזַבֵּ֗חוּ וְ/עַל הַ/גְּבָעוֹת֙ יְקַטֵּ֔רוּ תַּ֣חַת אַלּ֧וֹן וְ/לִבְנֶ֛ה וְ/אֵלָ֖ה כִּ֣י ט֣וֹב צִלָּ֑/הּ עַל כֵּ֗ן תִּזְנֶ֨ינָה֙ בְּנ֣וֹתֵי/כֶ֔ם וְ/כַלּוֹתֵי/כֶ֖ם תְּנָאַֽפְנָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/013.yaml
  text: On the tops of the mountains they sacrifice[a], and on the hills they burn incense, under oak and poplar and terebinth, because their shade is good. Therefore your daughters prostitute themselves[c][b], and your daughters-in-law commit adultery.
translation:
  language: pt
  text: No topo das montanhas, eles oferecem sacrifícios; nas colinas, queimam ofertas[a], debaixo de carvalhos, choupos e terebintos[b], porque a sombra dessas árvores é agradável. Por isso, as filhas de vocês se prostituem[c], e suas noras cometem adultério.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “queimam incenso”. O verbo hebraico pode referir-se especificamente à queima de incenso ou, de forma mais ampla, à queima de ofertas para fazê-las subir em fumaça.
    reason: lexical_alternative
  - marker: b
    text: Essas árvores são tradicionalmente identificadas como carvalho, choupo e terebinto; os equivalentes botânicos exatos não são totalmente certos.
    reason: cultural_note
  - marker: c
    text: Oseias frequentemente usa a infidelidade sexual como imagem da infidelidade à aliança; aqui, as palavras também descrevem claramente pecado sexual literal.
    reason: cross_reference
lexical_decisions:
- source_word: רָאשֵׁי הֶהָרִים
  choice: no topo das montanhas
  rationale: A expressão hebraica significa literalmente “nas cabeças dos montes” e, de modo idiomático, designa seus cumes. “No topo das montanhas” é natural e conserva a imagem dos lugares elevados de culto.
- source_word: יְזַבֵּחוּ
  choice: oferecem sacrifícios
  rationale: O piel de זבח denota sacrificar ou oferecer sacrifícios. A locução explicita com naturalidade o ato cultual.
- source_word: יְקַטֵּרוּ
  choice: queimam ofertas
  rationale: O verbo pode indicar a queima de incenso em particular ou, mais amplamente, fazer ofertas subir em fumaça. A escolha preserva o sentido cultual mais abrangente, e a alternativa específica é registrada em nota.
- source_word: תַּחַת אַלּוֹן וְלִבְנֶה וְאֵלָה
  choice: debaixo de carvalhos, choupos e terebintos
  rationale: Os substantivos singulares podem ter valor genérico. Os nomes tradicionais das árvores são mantidos, sem ocultar a incerteza botânica indicada em nota.
- source_word: כִּי טוֹב צִלָּהּ
  choice: porque a sombra dessas árvores é agradável
  rationale: O hebraico diz que a sombra é “boa”. “Agradável” expressa naturalmente sua qualidade convidativa, e “dessas árvores” torna claro o referente coletivo do sufixo feminino singular.
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Marca a consequência entre as práticas cultuais descritas e a conduta sexual subsequente, em linguagem portuguesa corrente.
- source_word: תִּזְנֶינָה
  choice: se prostituem
  rationale: זנה conserva a forte linguagem de prostituição e pode ter alcance literal e figurado. A forma reflexiva é natural em português e não reduz o termo a uma formulação genérica.
- source_word: בְּנוֹתֵיכֶם
  choice: as filhas de vocês
  rationale: Tradução direta do termo familiar, usando uma forma de segunda pessoa plural amplamente compreensível e natural no português brasileiro.
- source_word: וְכַלּוֹתֵיכֶם
  choice: suas noras
  rationale: כַּלָּה pode significar “noiva” ou “nora”; em paralelo com “filhas” e dentro do contexto familiar, “noras” é a opção mais provável e natural.
- source_word: תְּנָאַפְנָה
  choice: cometem adultério
  rationale: נאף designa especificamente o adultério. A tradução mantém a distinção em relação ao verbo mais amplo זנה da oração anterior.
theological_decisions:
- issue: Se a linguagem sexual deve ser entendida apenas como metáfora de infidelidade espiritual ou também como pecado sexual literal
  choice: O texto principal descreve diretamente a prostituição e o adultério, enquanto a nota reconhece a dimensão simbólica recorrente em Oseias.
  alternative: Traduzir a linguagem exclusivamente como prostituição espiritual ou idolatria.
  rationale: A sintaxe imediata menciona filhas e noras e emprega dois verbos sexuais concretos. Ao mesmo tempo, Oseias usa repetidamente a infidelidade sexual como imagem da infidelidade à aliança. A tradução preserva as duas dimensões sem reduzir uma à outra.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” para a segunda pessoa plural, “noras” em vez de uma expressão mais longa e nomes tradicionais das árvores. A pontuação evidencia o paralelismo poético e a relação de consequência.
