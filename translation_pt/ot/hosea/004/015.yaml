reference: Hosea 4:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אִם זֹנֶ֤ה אַתָּה֙ יִשְׂרָאֵ֔ל אַל יֶאְשַׁ֖ם יְהוּדָ֑ה וְ/אַל תָּבֹ֣אוּ הַ/גִּלְגָּ֗ל וְ/אַֽל תַּעֲלוּ֙ בֵּ֣ית אָ֔וֶן וְ/אַל תִּשָּׁבְע֖וּ חַי יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/015.yaml
  text: Though you prostitute yourself[a], Israel, let not Judah become guilty. And do not go to Gilgal, and do not go up to Beth-aven, and do not swear, ‘As Yahweh lives.’
translation:
  language: pt
  text: 'Embora você se prostitua[a], Israel, que Judá não se torne culpado. Não vão a Gilgal, não subam a Bete-Áven[b] e não jurem: “Tão certo como Yahweh vive.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se você se prostitui”.'
    reason: A partícula hebraica pode ser entendida formalmente como condicional, embora o contexto favoreça aqui o sentido concessivo.
  - marker: b
    text: Bete-Áven significa “casa da maldade” ou “casa da iniquidade”; provavelmente é um nome polêmico para Betel.
    reason: A nota preserva no texto o nome hebraico depreciativo e esclarece seu sentido e sua provável referência.
lexical_decisions:
- source_word: אִם
  choice: Embora
  rationale: 'Neste contexto, a partícula introduz uma concessão: a infidelidade de Israel é pressuposta, e Judá é advertido a não participar dela. “Embora” comunica esse sentido naturalmente, sem transformar a declaração em mera hipótese.'
- source_word: זֹנֶה
  choice: você se prostitua
  rationale: O particípio de זנה conserva a metáfora sexual deliberadamente forte de Oseias para a infidelidade de Israel à aliança. A formulação é atual e compreensível, sem suavizar a imagem profética.
- source_word: אַל יֶאְשַׁם
  choice: que Judá não se torne culpado
  rationale: O verbo אשם no qal pode indicar tornar-se culpado ou incorrer em culpa. A construção com “que... não” reproduz adequadamente a força volitiva da advertência.
- source_word: תָּבֹאוּ הַגִּלְגָּל
  choice: não vão a Gilgal
  rationale: בוא pode significar vir, ir ou entrar. Neste contexto de proibição de dirigir-se a um local de culto, “ir a” é a expressão portuguesa mais natural.
- source_word: תַּעֲלוּ
  choice: não subam
  rationale: עלה significa literalmente subir. A tradução mantém a linguagem de deslocamento para um local de culto e o paralelismo com a proibição anterior.
- source_word: בֵּית אָוֶן
  choice: Bete-Áven
  rationale: O nome polêmico é transliterado, em vez de ser substituído por Betel, preservando o recurso retórico do texto hebraico; seu sentido é explicado em nota.
- source_word: תִּשָּׁבְעוּ
  choice: não jurem
  rationale: O nifal de שבע aqui se refere a prestar juramento. “Jurar” é direto e idiomático em português.
- source_word: חַי יְהוָה
  choice: Tão certo como vive Yahweh!
  rationale: A expressão é uma fórmula de juramento. Esta redação comunica em português sua função idiomática e mantém explicitamente o nome divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O tetragrama é representado pelo nome pessoal “Yahweh”, em vez de ser substituído por um título.
theological_decisions:
- issue: Metáfora sexual profética para a infidelidade à aliança
  choice: Conservar explicitamente “se prostitua”.
  alternative: “seja infiel” ou “cometa adultério espiritual”
  rationale: Oseias emprega intencionalmente uma imagem sexual contundente para denunciar a idolatria. A tradução preserva sua força literária e teológica sem acrescentar a qualificação interpretativa “espiritual”.
- issue: Valor da partícula אִם
  choice: 'Leitura concessiva: “Embora”.'
  alternative: 'Leitura condicional: “Se”.'
  rationale: O contexto trata a prostituição de Israel como realidade e adverte Judá a não compartilhar sua culpa. Ainda assim, a forma hebraica também admite tradução formalmente condicional, registrada em nota.
- issue: Nome divino na fórmula de juramento
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto traz diretamente o tetragrama יהוה. A tradução preserva o nome da aliança em vez de substituí-lo por um título.
- issue: Identificação de Bete-Áven
  choice: Manter o nome polêmico Bete-Áven no texto.
  alternative: Substituí-lo por Betel ou traduzi-lo como “Casa da Maldade”.
  rationale: A provável referência a Betel não deve apagar a forma intencionalmente depreciativa empregada pelo profeta. A nota informa o significado e a identificação provável sem apresentá-la como certeza absoluta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por “você” torna natural a personificação singular de Israel; as proibições seguintes permanecem no plural, como no hebraico. Os topônimos seguem formas portuguesas correntes, e “Yahweh” preserva o nome divino.
