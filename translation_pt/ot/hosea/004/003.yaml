id: HOS.4.3
reference: Hosea 4:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עַל כֵּ֣ן תֶּאֱבַ֣ל הָ/אָ֗רֶץ וְ/אֻמְלַל֙ כָּל יוֹשֵׁ֣ב בָּ֔/הּ בְּ/חַיַּ֥ת הַ/שָּׂדֶ֖ה וּ/בְ/ע֣וֹף הַ/שָּׁמָ֑יִם וְ/גַם דְּגֵ֥י הַ/יָּ֖ם יֵאָסֵֽפוּ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/003.yaml
  text: Therefore the land mourns[a], and everyone who dwells in it languishes, along with the beasts of the field and the birds of the heavens[b]; even the fish of the sea are taken away.
translation:
  language: pt
  text: Por isso, a terra se lamenta[a], e todos os que nela vivem definham, juntamente com os animais do campo e as aves do céu; até os peixes do mar são levados[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico também pode significar “o país”. No contexto, refere-se principalmente à terra de Israel, embora “terra” preserve a abrangência do termo.
    reason: alternative_reading
  - marker: b
    text: Ou “são recolhidos” ou “são retirados”. O verbo hebraico indica que até os peixes desaparecem sob o juízo, sem explicitar o modo de sua remoção.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּאֱבַל
  choice: se lamenta
  rationale: Preserva a personificação da terra e o sentido predominante do verbo, ligado ao luto e à lamentação, sem reduzi-lo à ideia física de secar.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: No contexto imediato, designa mais provavelmente a terra de Israel; a formulação portuguesa permanece natural e conserva alguma abertura para o sentido mais amplo de “terra”.
- source_word: וְאֻמְלַל
  choice: definham
  rationale: Comunica enfraquecimento e decadência progressivos e pode abranger tanto os habitantes humanos quanto os animais mencionados em seguida.
- source_word: כָּל יוֹשֵׁב בָּהּ
  choice: todos os que nela vivem
  rationale: Expressa naturalmente em português o valor coletivo do particípio singular precedido de כָּל.
- source_word: בְּחַיַּת הַשָּׂדֶה
  choice: assim como os animais do campo
  rationale: Liga os animais ao mesmo destino dos habitantes e mantém a categoria bíblica sem recorrer ao termo mais restrito “animais selvagens”.
- source_word: וּבְעוֹף הַשָּׁמָיִם
  choice: e as aves do céu
  rationale: É uma expressão corrente e digna em português, correspondente ao hebraico sem a artificialidade de “aves dos céus” neste contexto.
- source_word: וְגַם
  choice: até
  rationale: Marca a progressão enfática do juízo, que alcança inclusive os peixes do mar.
- source_word: דְּגֵי הַיָּם
  choice: os peixes do mar
  rationale: Reproduz diretamente a expressão hebraica e completa a sequência de animais terrestres, aves e peixes.
- source_word: יֵאָסֵפוּ
  choice: são levados
  rationale: O Nifal de אסף pode indicar que algo é recolhido ou retirado. “São levados” comunica a remoção resultante do juízo sem especificar indevidamente o modo ou afirmar de forma explícita que morrem.
theological_decisions:
- issue: Alcance de הָאָרֶץ
  choice: a terra, entendida no contexto principalmente como a terra de Israel
  alternative: a terra em sentido universal
  rationale: A denúncia de Oseias se dirige imediatamente a Israel e à sua terra. A tradução não acrescenta “de Israel” ao texto, evitando eliminar a amplitude lexical do termo hebraico.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A personificação profética foi preservada, e a ordem climática — seres humanos, animais terrestres, aves e até peixes — permanece evidente.
