  text: חַטַּ֥את עַמִּ֖/י יֹאכֵ֑לוּ וְ/אֶל עֲוֺנָ֖/ם יִשְׂא֥וּ נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/008.yaml
  text: They feed on the sin of my people[b][a], and they set their appetite on their iniquity.
translation:
  language: pt
  text: Eles se alimentam do pecado do meu povo[a] e desejam avidamente a iniquidade deles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Eles comem a oferta pelo pecado do meu povo». A palavra hebraica pode significar tanto «pecado» como «oferta pelo pecado».'
    reason: alternative_reading
  - marker: b
    text: 'Literalmente: «e para a iniquidade deles erguem a alma dele». A expressão hebraica indica desejo ou avidez, mas o singular «alma dele» é gramaticalmente difícil neste contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטַּאת
  choice: pecado
  rationale: O substantivo pode significar tanto «pecado» como «oferta pelo pecado». O paralelismo com «iniquidade» favorece o sentido moral no texto principal, sem excluir a possível alusão ao proveito que os sacerdotes tiravam das ofertas.
- source_word: יֹאכֵלוּ
  choice: se alimentam
  rationale: O verbo significa literalmente «comer». «Se alimentam» preserva a imagem de consumo e expressa com naturalidade a ideia de tirar proveito do pecado alheio.
- source_word: עַמִּי
  choice: meu povo
  rationale: Reprodução direta do substantivo com o sufixo de primeira pessoa do singular.
- source_word: עֲוֺנָם
  choice: iniquidade deles
  rationale: עָוֹן pode indicar iniquidade, culpa ou punição. Aqui, o sentido moral corresponde melhor ao paralelismo com «pecado» e mantém a força ética da acusação.
- source_word: יִשְׂאוּ נַפְשׁוֹ
  choice: desejam avidamente
  rationale: A construção idiomática exprime desejo intenso e dirigido. Esta formulação comunica a avidez em português natural sem esconder, por meio da nota, a forma incomum do hebraico.
- source_word: נַפְשׁוֹ
  choice: incorporado idiomaticamente em «desejam avidamente»
  rationale: A forma consonantal é singular, «sua alma» ou «a alma dele», embora o verbo seja plural. O texto principal traduz o sentido contextual do idioma; a dificuldade gramatical fica preservada na nota.
theological_decisions:
- issue: Sentido de חַטַּאת no contexto da corrupção sacerdotal
  choice: «pecado» no texto principal
  alternative: «oferta pelo pecado»
  rationale: O hebraico permite os dois sentidos. «Pecado» mantém ampla a denúncia moral e se harmoniza com «iniquidade»; a nota conserva a leitura cultual, segundo a qual os sacerdotes comiam porções das ofertas e lucravam com os pecados do povo.
- issue: Referente do singular נַפְשׁוֹ após um verbo plural
  choice: Expressar no plural contextual o desejo dos sacerdotes
  alternative: Reproduzir literalmente «erguem a alma dele» ou entender um sujeito singular
  rationale: O contexto apresenta os sacerdotes como grupo, mas a forma singular é genuinamente difícil. A tradução corrente comunica o sentido provável, enquanto a nota evita resolver silenciosamente a tensão gramatical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Se alimentam» conserva a metáfora concreta sem soar excessivamente literal; «desejam avidamente» torna claro o idioma hebraico. As duas notas preservam tanto a ambiguidade sacrificial quanto a dificuldade do singular.
