  source_fidelity: A tradução transmite corretamente a acusação, a reciprocidade entre rejeitar e ser rejeitado e o juízo sobre os filhos. Contudo, “como meu sacerdote” não expressa com precisão a construção מִכַּהֵן לִי, que exclui o destinatário do serviço sacerdotal para Deus; a revisão explicita essa exclusão sem acrescentar interpretação.
  naturalness: O português é claro e de registro apropriado. “Meu povo é destruído” evita o aspecto progressivo introduzido por “está sendo destruído”, que é menos adequado ao perfeito hebraico apresentado como declaração de juízo. “Já que” é mais direto e natural no encadeamento acusatório.
  terminology: “Conhecimento”, “lei”, “sacerdote” e “filhos” preservam bem os termos e as imagens do hebraico. A nota sobre torá conserva adequadamente a alternativa “instrução”. A nota sobre filhos é ajustada para indicar, sem confundir, a possível leitura estritamente masculina do plural hebraico.
