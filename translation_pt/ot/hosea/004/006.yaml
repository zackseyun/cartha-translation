  text: נִדְמ֥וּ עַמִּ֖/י מִ/בְּלִ֣י הַ/דָּ֑עַת כִּֽי אַתָּ֞ה הַ/דַּ֣עַת מָאַ֗סְתָּ וְ/אֶמְאָֽסְא/ךָ֙ מִ/כַּהֵ֣ן לִ֔/י וַ/תִּשְׁכַּח֙ תּוֹרַ֣ת אֱלֹהֶ֔י/ךָ אֶשְׁכַּ֥ח בָּנֶ֖י/ךָ גַּם אָֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/006.yaml
  text: My people are destroyed for lack of knowledge[a]. Because you have rejected knowledge, I also reject you from being priest to me. Since you have forgotten the law of your God[c][b], I also will forget your children.
translation:
  language: pt
  text: Meu povo é destruído por falta de conhecimento.[a] Já que você rejeitou o conhecimento, também rejeito você, para que não seja sacerdote para mim. Já que você se esqueceu da lei[b] do seu Deus, também me esquecerei dos seus filhos.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “perece”, “é silenciado” ou “é eliminado”.
    reason: lexical_alternative
  - marker: b
    text: A palavra hebraica torá também pode significar “instrução”.
    reason: lexical_alternative
  - marker: c
    text: O hebraico também pode ser entendido mais estritamente como “filhos homens”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדְמוּ
  choice: está sendo destruído
  rationale: O nifal de דמה, neste contexto de juízo, indica ruína ou destruição. A forma portuguesa expressa a declaração profética como realidade em curso, sem reduzi-la à ideia de silêncio.
- source_word: מִבְּלִי הַדָּעַת
  choice: por falta de conhecimento
  rationale: A expressão indica privação e causa; esta formulação é concisa, natural e fiel em português.
- source_word: הַדָּעַת / הַדַּעַת
  choice: o conhecimento
  rationale: Preserva o sentido lexical sem explicitar no texto principal “conhecimento de Deus”, embora o contexto lhe dê dimensão relacional, moral e pactual.
- source_word: מָאַסְתָּ
  choice: você rejeitou
  rationale: מאס comunica rejeição ou recusa, por vezes com desprezo; “rejeitou” mantém a força e a reciprocidade do juízo.
- source_word: וְאֶמְאָסְאֲךָ מִכַּהֵן לִי
  choice: eu também rejeito você como meu sacerdote
  rationale: Expressa naturalmente em português a exclusão do destinatário da função sacerdotal e conserva a correspondência entre sua rejeição do conhecimento e a rejeição divina.
- source_word: וַתִּשְׁכַּח
  choice: você se esqueceu
  rationale: Mantém o sentido verbal de esquecer e a acusação por uma ação passada com consequências presentes.
- source_word: תּוֹרַת אֱלֹהֶיךָ
  choice: a lei do seu Deus
  rationale: “Lei” é clara e reconhecível no contexto pactual, enquanto uma nota conserva o alcance mais amplo de תּוֹרָה como instrução.
- source_word: אֶשְׁכַּח
  choice: eu também me esquecerei
  rationale: Preserva a metáfora, o valor futuro e a simetria retórica com “você se esqueceu”.
- source_word: בָּנֶיךָ
  choice: seus filhos
  rationale: בנים pode designar filhos ou descendentes sem limitar necessariamente a referência ao sexo masculino; “filhos” é natural e pode funcionar de modo abrangente em português.
theological_decisions:
- issue: Sentido de “conhecimento” na controvérsia pactual de Oseias
  choice: Manter simplesmente “conhecimento” no texto principal
  alternative: “conhecimento de Deus”
  rationale: Embora o contexto de Oseias dê ao termo uma dimensão de relacionamento e fidelidade a Deus, o hebraico desta oração não acrescenta explicitamente “de Deus”.
- issue: Referente da segunda pessoa do singular
  choice: Conservar “você” no singular, com a função sacerdotal explícita
  alternative: Interpretar como singular coletivo dirigido a Israel
  rationale: A referência a exercer o sacerdócio favorece um destinatário sacerdotal ou representativo, mas a tradução não identifica além do que o texto declara.
- issue: Alcance de בָּנֶיךָ
  choice: “seus filhos” em sentido potencialmente abrangente
  alternative: “seus filhos homens” ou “seus descendentes”
  rationale: O masculino plural hebraico pode designar a descendência de modo geral; a tradução preserva a imagem familiar sem impor uma restrição masculina.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O paralelismo entre rejeitar/ser rejeitado e esquecer/ser esquecido foi preservado; evitou-se ampliar “conhecimento” para uma formulação teologicamente mais específica que o hebraico.
