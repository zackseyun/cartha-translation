  text: זְנ֛וּת וְ/יַ֥יִן וְ/תִיר֖וֹשׁ יִֽקַּֽח לֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/011.yaml
  text: Sexual immorality[a], wine, and new wine take away the heart.
translation:
  language: pt
  text: A imoralidade sexual, o vinho e o vinho novo tiram o coração.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tiram o entendimento” ou “privam do bom senso”; em hebraico, “tiram o coração”.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְנוּת
  choice: imoralidade sexual
  rationale: Expressa de modo claro e atual a conduta sexual ilícita, preservando a amplitude do termo e suas possíveis conotações de prostituição e infidelidade à aliança em Oseias.
- source_word: יַיִן
  choice: vinho
  rationale: É o equivalente português comum e direto para vinho fermentado.
- source_word: תִירוֹשׁ
  choice: vinho novo
  rationale: Mantém a distinção lexical em relação a יַיִן e corresponde ao sentido usual de vinho novo ou fresco.
- source_word: יִקַּח
  choice: tiram
  rationale: Conserva o sentido básico de tomar ou retirar; a flexão no plural torna a frase natural em português com o sujeito composto.
- source_word: לֵב
  choice: o coração
  rationale: Preserva a imagem concreta e a antropologia hebraica, na qual o coração abrange entendimento, vontade e discernimento, sem reduzir o termo a uma única faculdade.
theological_decisions:
- issue: Se a expressão final deve ser interpretada como perda do entendimento ou mantida com a imagem do coração
  choice: Manter “tiram o coração” no texto principal.
  alternative: “tiram o entendimento” ou “privam do bom senso”
  rationale: A formulação concreta preserva a tensão e a riqueza do idioma hebraico acerca da pessoa interior; as paráfrases interpretativas são registradas em nota, sem serem impostas ao texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A repetição de “vinho” conserva a distinção entre os dois termos hebraicos, e a expressão incomum “tiram o coração” mantém deliberadamente a imagem do original.
