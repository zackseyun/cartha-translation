source:
  edition: WLC
  text: לֹֽא אֶפְק֨וֹד עַל בְּנוֹתֵי/כֶ֜ם כִּ֣י תִזְנֶ֗ינָה וְ/עַל כַּלּֽוֹתֵי/כֶם֙ כִּ֣י תְנָאַ֔פְנָה כִּי הֵם֙ עִם הַ/זֹּנ֣וֹת יְפָרֵ֔דוּ וְ/עִם הַ/קְּדֵשׁ֖וֹת יְזַבֵּ֑חוּ וְ/עָ֥ם לֹֽא יָבִ֖ין יִלָּבֵֽט־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/014.yaml
  text: I will not punish your daughters when they prostitute themselves[a], nor your daughters-in-law when they commit adultery; for the men themselves go apart with prostitutes and sacrifice with cult prostitutes[c][b], and a people without understanding comes to ruin.
translation:
  language: pt
  text: Não castigarei suas filhas quando se prostituírem, nem suas noras quando cometerem adultério, porque os próprios homens se retiram com prostitutas[a] e oferecem sacrifícios com prostitutas cultuais[b]; um povo sem entendimento acaba em ruína.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se separam com prostitutas” ou “se juntam a prostitutas”. O verbo hebraico significa literalmente separar-se ou ir à parte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “prostitutas do templo”. O termo hebraico designa mulheres associadas a práticas cultuais ilícitas; literalmente, pode significar “mulheres consagradas”.'
    reason: lexical_alternative
  - marker: c
    text: O último verbo hebraico é raro e também pode significar “é derrubado” ou “fica transtornado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְקוֹד
  choice: castigarei
  rationale: No contexto de juízo, פקד com עַל significa pedir contas ou aplicar punição. “Castigarei” expressa de modo claro o sentido judicial.
- source_word: תִזְנֶינָה
  choice: se prostituírem
  rationale: זנה denota conduta sexual ilícita e, em Oseias, mantém forte imagem de prostituição; a forma pronominal reproduz naturalmente o sentido em português.
- source_word: כַלּוֹתֵיכֶם
  choice: suas noras
  rationale: O plural construto de כלה designa aqui as esposas dos filhos, não apenas noivas.
- source_word: תְנָאַפְנָה
  choice: cometerem adultério
  rationale: נאף designa especificamente adultério e deve permanecer distinto do verbo זנה.
- source_word: יְפָרֵדוּ
  choice: se retiram
  rationale: פרד significa literalmente separar-se ou afastar-se. “Se retiram” preserva a imagem de os homens irem à parte com as prostitutas sem tornar a frase opaca.
- source_word: הַזֹּנוֹת
  choice: prostitutas
  rationale: Equivalente moderno e direto do substantivo feminino derivado de זנה.
- source_word: הַקְּדֵשׁוֹת
  choice: prostitutas cultuais
  rationale: A expressão conserva tanto a associação com culto ilícito quanto, no paralelismo contextual, a dimensão sexual, sem restringir o cenário necessariamente a um templo.
- source_word: יְזַבֵּחוּ
  choice: oferecem sacrifícios
  rationale: Tradução natural do verbo sacrificial זבח, tornando explícito em português o objeto implícito.
- source_word: וְעָם לֹא יָבִין
  choice: um povo sem entendimento
  rationale: Mantém o substantivo coletivo sem artigo e expressa idiomaticamente a ausência de discernimento.
- source_word: יִלָּבֵט
  choice: acaba em ruína
  rationale: O verbo raro indica queda, transtorno ou destruição. A formulação comunica o resultado geral sem impor uma nuance excessivamente específica.
theological_decisions:
- issue: Se Deus está desculpando o pecado sexual das mulheres
  choice: A declaração não absolve as mulheres; ela recusa destacá-las para castigo enquanto os próprios homens participam da mesma corrupção sexual e cultual.
  alternative: Entender a frase como recusa incondicional de castigar as mulheres, independentemente da conduta masculina.
  rationale: A oração causal introduzida por כִּי fundamenta a declaração na culpa dos próprios homens. A tradução mantém a tensão do texto sem acrescentar uma explicação doutrinária.
- issue: Identidade das קְדֵשׁוֹת
  choice: prostitutas cultuais
  alternative: mulheres consagradas; prostitutas do templo
  rationale: O contexto associa essas mulheres ao culto ilícito e as coloca em paralelo com prostitutas. “Cultuais” evita afirmar que a prática ocorria necessariamente dentro de um templo.
translation_notes:
  register: Português moderno, digno e acessível, com vocabulário amplamente compreensível no Brasil e em outros contextos lusófonos. Mantiveram-se a distinção entre prostituição e adultério, a responsabilidade dos homens e a incerteza lexical do verbo final.
