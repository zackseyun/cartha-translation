base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/016.yaml
  text: For Israel is as stubborn as a stubborn heifer[a]; now Yahweh will pasture them like a lamb in a broad place.
translation:
  language: pt
  text: Pois Israel é teimoso como uma novilha teimosa; agora Yahweh os fará pastar como um cordeiro em campo aberto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como uma ovelha em lugar aberto” ou “num lugar espaçoso”. A imagem hebraica pode indicar tanto pastagem aberta quanto exposição vulnerável sob juízo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento da acusação e da consequência anterior, de modo natural em português.
- source_word: כְּפָרָה
  choice: como uma novilha
  rationale: Preserva a imagem agrícola feminina de uma vaca jovem, com formulação corrente e vívida.
- source_word: סֹרֵרָה / סָרַר
  choice: teimoso como uma novilha teimosa
  rationale: Mantém a repetição enfática da mesma raiz hebraica. A concordância de “teimoso” com Israel e de “teimosa” com novilha é natural em português.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Forma tradicional e corrente do nome próprio em português.
- source_word: עַתָּה
  choice: agora
  rationale: Marca a consequência que decorre da obstinação de Israel.
- source_word: יִרְעֵם
  choice: os levará a pastar
  rationale: Expressa o sentido de conduzir ou deixar pastar, preserva a imagem pecuária e evita dar à oração um tom pastoral inequivocamente positivo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: כְּכֶבֶשׂ
  choice: como um cordeiro
  rationale: Conserva o animal singular e sua possível conotação de vulnerabilidade.
- source_word: בַּמֶּרְחָב
  choice: em campo aberto
  rationale: Comunica de maneira natural um lugar amplo e aberto, sem decidir se a imagem indica pastagem livre ou exposição vulnerável.
theological_decisions:
- issue: Tom da oração final
  choice: Preservar a ambiguidade entre provisão pastoral e exposição irônica ou judicial.
  alternative: Explicitar que Yahweh cuidará ternamente de Israel, ou, no sentido oposto, que o abandonará à vulnerabilidade do juízo.
  rationale: O hebraico descreve pastoreio em lugar amplo, imagem que pode sugerir liberdade e alimento ou, no contexto de juízo, exposição e dispersão. A tradução não resolve além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. “Novilha teimosa” preserva a repetição retórica; “campo aberto” soa mais natural que o literal “lugar largo” e mantém a ambiguidade da imagem.
