  naturalness: O português é atual, claro e de registro bíblico sóbrio. A pequena revisão na última oração mantém a fluência e evita que “obedecer” imponha uma relação sintática mais definida do que a do hebraico.
  terminology: “Yahweh” segue a política informada para o Tetragrama. “Entregar-se à prostituição” é uma opção legítima para זנה e a nota preserva a alternativa mais ampla de imoralidade sexual e a possível ressonância de infidelidade à aliança. As âncoras a, b e c permanecem adequadamente associadas aos pontos que explicam.
