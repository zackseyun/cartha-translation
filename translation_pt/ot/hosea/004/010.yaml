  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אָֽכְלוּ֙ וְ/לֹ֣א יִשְׂבָּ֔עוּ הִזְנ֖וּ וְ/לֹ֣א יִפְרֹ֑צוּ כִּֽי אֶת יְהוָ֥ה עָזְב֖וּ לִ/שְׁמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/010.yaml
  text: They will eat[a], but not be satisfied; they will commit sexual immorality, but not increase, because they have abandoned Yahweh[c][b], to cherish prostitution.
translation:
  language: pt
  text: Comerão, mas não ficarão satisfeitos; entregar-se-ão à prostituição[a], mas não se multiplicarão[b], porque abandonaram Yahweh, deixando de dar-lhe atenção.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico pode significar prostituir-se ou praticar imoralidade sexual. Em Oseias, muitas vezes também sugere infidelidade à aliança.
    reason: lexical_alternative
  - marker: b
    text: Ou “não aumentarão em número”. O verbo hebraico significa literalmente irromper ou romper limites e, aqui, provavelmente se refere ao aumento da descendência ou da população.
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico é conciso: “abandonaram Yahweh, para guardar/observar”. A construção provavelmente indica que deixaram de dar atenção a Yahweh ou de o observar; outros entendem que há um objeto implícito, como a lei ou os caminhos dele.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָכְלוּ
  choice: Comerão
  rationale: O perfeito com waw, neste anúncio profético de juízo, expressa naturalmente em português a consequência futura anunciada.
- source_word: יִשְׂבָּעוּ
  choice: ficarão satisfeitos
  rationale: שׂבע indica ficar saciado ou ter o bastante após comer; a expressão é corrente e mantém o contraste com “comerão”.
- source_word: הִזְנוּ
  choice: entregar-se-ão à prostituição
  rationale: זנה pode indicar prostituição propriamente dita ou conduta sexual ilícita e, em Oseias, também evoca infidelidade à aliança. A formulação conserva a imagem concreta sem excluir sua ressonância figurada.
- source_word: יִפְרֹצוּ
  choice: não se multiplicarão
  rationale: Embora פרץ tenha o sentido básico de irromper ou romper limites, aqui, em paralelo com a prostituição, provavelmente se refere ao aumento por descendência ou ao crescimento numérico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עָזְבוּ
  choice: abandonaram
  rationale: “Abandonaram” comunica de modo claro a deserção e a infidelidade à aliança presentes na acusação.
- source_word: לִשְׁמֹר
  choice: deixaram de lhe obedecer
  rationale: O infinitivo “guardar/observar” aparece de modo elíptico após “abandonaram Yahweh”. A tradução exprime a provável ideia de cessar a observância ou atenção devida a Yahweh, e a nota registra a concisão do hebraico.
theological_decisions:
- issue: Sentido de זנה na acusação de Oseias
  choice: “entregar-se-ão à prostituição”, mantendo a imagem sexual concreta e sua possível ressonância de infidelidade à aliança
  alternative: “praticarão imoralidade sexual” ou uma formulação explicitamente metafórica de idolatria
  rationale: O paralelo com a falta de multiplicação favorece uma referência concreta à atividade sexual, enquanto o uso recorrente da imagem em Oseias permite também uma dimensão de infidelidade à aliança. A tradução não torna exclusiva nenhuma das duas dimensões.
- issue: Interpretação de לִשְׁמֹר depois de “abandonaram Yahweh”
  choice: Entendido como deixar de observar ou obedecer a Yahweh
  alternative: “abandonaram Yahweh para guardar”, “deixaram de guardar [a lei dele]” ou considerar a expressão incompleta
  rationale: O hebraico é conciso e elíptico. A formulação portuguesa fornece apenas o complemento pronominal exigido para uma leitura natural, sem introduzir especificamente “lei”, “caminhos” ou outro objeto ausente do texto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção futura mantém o tom profético de juízo; “entregar-se à prostituição” preserva a imagem incisiva de Oseias sem recorrer a vocabulário arcaico. As notas registram as ambiguidades lexicais e sintáticas relevantes.
