id: HOS.4.5
reference: Hosea 4:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/כָשַׁלְתָּ֣ הַ/יּ֔וֹם וְ/כָשַׁ֧ל גַּם נָבִ֛יא עִמְּ/ךָ֖ לָ֑יְלָה וְ/דָמִ֖יתִי אִמֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/005.yaml
  text: You will stumble by day[a], and the prophet also will stumble with you by night[c][b]; and I will destroy your mother.
translation:
  language: pt
  text: Você tropeçará de dia, e também o profeta[a] tropeçará com você de noite; e eu destruirei[b] sua mãe.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um profeta”.
    reason: lexical_alternative
  - marker: b
    text: Ou “silenciarei” ou “eliminarei”; neste contexto de juízo, o verbo hebraico pode assumir sentidos relacionados.
    reason: lexical_alternative
  - marker: c
    text: “Sua mãe” provavelmente representa, de modo figurado, o povo, a nação ou a comunidade da aliança.
    reason: cultural_note
lexical_decisions:
- source_word: וְכָשַׁלְתָּ
  choice: você tropeçará
  rationale: O qal perfeito na segunda pessoa masculina singular tem aqui valor futuro/resultativo no anúncio profético. “Tropeçará” preserva a metáfora sem intensificá-la para uma queda definitiva.
- source_word: הַיּוֹם
  choice: de dia
  rationale: O contraste explícito com לָיְלָה indica o par temporal dia/noite, e não o sentido de “hoje”.
- source_word: וְכָשַׁל
  choice: tropeçará
  rationale: Mantém o mesmo verbo da primeira oração e o valor futuro adequado ao anúncio de juízo.
- source_word: גַּם נָבִיא
  choice: também o profeta
  rationale: גַּם acrescenta o profeta à pessoa interpelada. Embora נָבִיא não tenha artigo em hebraico, o artigo definido em português permite uma referência representativa natural; a leitura indefinida permanece em nota.
- source_word: עִמְּךָ
  choice: com você
  rationale: Tradução direta e natural da preposição עם com sufixo de segunda pessoa masculina singular.
- source_word: לָיְלָה
  choice: de noite
  rationale: Forma um paralelo conciso e natural com “de dia”.
- source_word: וְדָמִיתִי
  choice: e eu destruirei
  rationale: No contexto de juízo, o verbo דמה é mais bem entendido como levar à ruína ou destruir. Sentidos relacionados, como “silenciar” e “eliminar”, são registrados em nota.
- source_word: אִמֶּךָ
  choice: sua mãe
  rationale: Preserva literalmente a imagem materna do hebraico, sem identificar de modo definitivo seu referente no corpo do texto.
theological_decisions:
- issue: Referente de “sua mãe”
  choice: manter a metáfora “sua mãe” no texto principal
  alternative: explicitar “Israel”, “a nação”, “a terra” ou “a comunidade da aliança”
  rationale: A linguagem familiar é importante na imagética de Oseias. Conservar a metáfora preserva sua força literária e a incerteza quanto ao referente preciso.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O paralelismo “de dia/de noite” foi mantido, assim como a metáfora de tropeçar e a imagem não resolvida da mãe.
