  text: עַמִּ/י֙ בְּ/עֵצ֣/וֹ יִשְׁאָ֔ל וּ/מַקְל֖/וֹ יַגִּ֣יד ל֑/וֹ כִּ֣י ר֤וּחַ זְנוּנִים֙ הִתְעָ֔ה וַ/יִּזְנ֖וּ מִ/תַּ֥חַת אֱלֹהֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/012.yaml
  text: My people consult their piece of wood[a], and their staff tells them; for a spirit of whoredom has led them astray, and they have played the whore[c][b], departing from under their God.
translation:
  language: pt
  text: Meu povo consulta seu pedaço de madeira[a], e seu bastão lhe dá a resposta; pois um espírito de prostituição[b] o desencaminhou, e eles se prostituíram, afastando-se de debaixo do seu Deus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «sua madeira» ou, de modo mais interpretativo, «seu ídolo de madeira». O hebraico diz literalmente «sua madeira» e provavelmente se refere a um objeto de culto feito de madeira e usado para adivinhação.
    reason: lexical_alternative
  - marker: b
    text: Ou «um espírito de infidelidade». O hebraico mantém explícita a metáfora da prostituição.
    reason: lexical_alternative
  - marker: c
    text: A expressão hebraica significa literalmente «de debaixo do seu Deus» e retrata o abandono da lealdade e da autoridade devidas a Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמִּי
  choice: Meu povo
  rationale: Preserva o sentido coletivo e relacional da fala de YHWH a respeito de Israel.
- source_word: בְּעֵצוֹ
  choice: consulta seu pedaço de madeira
  rationale: Mantém a concretude e o provável tom de desprezo do hebraico, sem tornar explícito no texto principal o sentido interpretativo de ídolo ou objeto divinatório.
- source_word: יִשְׁאַל
  choice: consulta
  rationale: Expressa de modo natural a busca de orientação por meio de adivinhação.
- source_word: וּמַקְלוֹ יַגִּיד לוֹ
  choice: e seu bastão lhe dá a resposta
  rationale: Comunica idiomaticamente que o bastão supostamente fornece a informação buscada, preservando o singular coletivo do hebraico.
- source_word: רוּחַ זְנוּנִים
  choice: um espírito de prostituição
  rationale: Retém a metáfora sexual explícita e forte de Oseias em português atual.
- source_word: הִתְעָה
  choice: o desencaminhou
  rationale: Abrange a ideia causativa de fazer o povo errar ou desviar-se.
- source_word: וַיִּזְנוּ
  choice: eles se prostituíram
  rationale: Preserva a repetição da metáfora de prostituição aplicada à infidelidade religiosa.
- source_word: מִתַּחַת אֱלֹהֵיהֶם
  choice: afastando-se de debaixo do seu Deus
  rationale: Conserva a imagem incomum de sair de sob a autoridade e lealdade devidas a Deus, com uma forma verbal que esclarece a relação sintática.
theological_decisions:
- issue: Metáfora sexual profética para a idolatria
  choice: Manter no texto principal “espírito de prostituição” e “se prostituíram”
  alternative: Suavizar para “espírito de infidelidade” e “foram infiéis”
  rationale: O hebraico emprega deliberadamente linguagem sexual para retratar a ruptura da fidelidade a Deus; a tradução não deve neutralizar essa tensão retórica e teológica.
- issue: Singular coletivo e mudança de número
  choice: Manter “meu povo” e os possessivos no singular, passando a “eles” onde o verbo hebraico está no plural
  alternative: Regularizar toda a referência no plural
  rationale: Essa solução reproduz a oscilação significativa do hebraico entre o povo como unidade coletiva e seus integrantes como agentes da infidelidade.
- issue: Imagem de submissão em מִתַּחַת אֱלֹהֵיהֶם
  choice: Preservar “de debaixo do seu Deus”
  alternative: Interpretar simplesmente como “afastando-se do seu Deus”
  rationale: A formulação mais formal conserva a possível noção de abandono da autoridade e da lealdade devidas a Deus, sem reduzir a expressão a mera distância espacial ou relacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação mantém a linguagem profética explícita, a oscilação entre o coletivo singular e o plural e a imagem hebraica incomum no final. Evitou-se especificar no texto principal o método exato de adivinhação.
