id: HOS.4.4
reference: Hosea 4:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַ֥ךְ אִ֛ישׁ אַל יָרֵ֖ב וְ/אַל יוֹכַ֣ח אִ֑ישׁ וְ/עַמְּ/ךָ֖ כִּ/מְרִיבֵ֥י כֹהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/004.yaml
  text: Yet let no man contend[a], and let no man reprove[b], for your people are like those who contend with a priest.
translation:
  language: pt
  text: Contudo, ninguém entre em discussão, e ninguém repreenda[a], pois o seu povo é como os que discutem com um sacerdote.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “corrija” ou “conteste”; o verbo hebraico pode indicar correção, repreensão ou argumentação de uma causa.
    reason: lexical_alternative
  - marker: b
    text: A comparação talvez evoque a gravidade de resistir ao julgamento sacerdotal estabelecido na Lei; compare Deuteronômio 17:12.
    reason: cross_reference
lexical_decisions:
- source_word: אַךְ
  choice: Contudo
  rationale: Marca a transição adversativa abrupta em relação à acusação anterior, em português natural e digno.
- source_word: אִישׁ ... אִישׁ
  choice: ninguém ... ninguém
  rationale: Embora o hebraico repita o substantivo masculino singular, as construções negativas têm sentido genérico; “ninguém” reproduz com naturalidade a abrangência e a repetição.
- source_word: אַל יָרֵב
  choice: ninguém entre em discussão
  rationale: ריב pode indicar disputa, contenda ou litígio. A expressão mantém o sentido amplo sem impor um cenário judicial estrito.
- source_word: וְאַל יוֹכַח
  choice: e ninguém repreenda
  rationale: יכח no hifil pode significar repreender, corrigir ou argumentar uma causa. “Repreenda” conserva aqui o aspecto de censura corretiva.
- source_word: וְעַמְּךָ
  choice: pois o seu povo
  rationale: A conjunção é entendida como explicativa, introduzindo a razão das proibições precedentes.
- source_word: כִּמְרִיבֵי
  choice: é como os que discutem
  rationale: Preserva a comparação marcada por כ e a relação lexical com ריב usado anteriormente, empregando formulação portuguesa clara.
- source_word: כֹהֵן
  choice: um sacerdote
  rationale: O singular é melhor entendido genericamente, sem referência necessária a um sacerdote específico.
theological_decisions:
- issue: Sentido da cláusula final sobre discutir com um sacerdote
  choice: Manter a comparação como descrição da recusa rebelde do povo em aceitar correção
  alternative: Entendê-la como alusão específica à pena por resistir à decisão sacerdotal em Deuteronômio 17:12
  rationale: O hebraico apresenta claramente uma comparação, mas não determina por si só se a alusão jurídica é intencional. O texto principal preserva essa abertura, e a nota registra a possível relação legal.
translation_notes:
  register: Português moderno de ampla compreensão, com legibilidade brasileira e tom bíblico digno. A repetição “ninguém ... ninguém” conserva o paralelismo; “discussão/discutem” mantém a ligação lexical do hebraico sem soar excessivamente técnica.
