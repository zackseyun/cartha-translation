id: HOS.12.6
reference: Hosea 12:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַֽ/יהוָ֖ה אֱלֹהֵ֣י הַ/צְּבָא֑וֹת יְהוָ֖ה זִכְרֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/006.yaml
  text: And Yahweh[b][a], the God of hosts—Yahweh is his memorial name.
translation:
  language: pt
  text: E Yahweh[a], o Deus dos Exércitos — Yahweh é o nome pelo qual ele é lembrado.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome hebraico YHWH é tradicionalmente traduzido por “SENHOR”; outra forma encontrada é “Jeová”.
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “Yahweh é o seu memorial”; isto é, o nome pelo qual ele é lembrado ou invocado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: E Yahweh
  rationale: A conjunção וַ é vertida por “E”, mantendo a continuidade com o contexto anterior; יהוה é transliterado como o nome pessoal “Yahweh”.
- source_word: אֱלֹהֵי הַצְּבָאוֹת
  choice: o Deus dos Exércitos
  rationale: A construção significa literalmente “Deus dos exércitos”. “Exércitos” conserva a amplitude da expressão hebraica, que pode abranger forças celestiais, sem a restringir a exércitos humanos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A repetição do tetragrama é preservada, em vez de ser substituída por um título.
- source_word: זִכְרוֹ
  choice: o nome pelo qual ele é lembrado
  rationale: O substantivo זֵכֶר com sufixo pode significar “sua lembrança” ou “seu memorial”; neste contexto, refere-se ao nome pelo qual Deus é lembrado ou invocado. A formulação explicita naturalmente em português o referente implícito, sem apagar a leitura literal indicada em nota.
theological_decisions:
- issue: Forma de representar o nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o tetragrama. A transliteração “Yahweh” preserva seu caráter de nome pessoal e evita substituí-lo silenciosamente por um título.
- issue: Sentido de זִכְרוֹ em relação a יהוה
  choice: Yahweh é o nome pelo qual ele é lembrado
  alternative: Yahweh é o seu memorial; Yahweh é a sua lembrança
  rationale: A tradução principal comunica o sentido idiomático de um nome pelo qual Deus é lembrado ou invocado, enquanto a nota conserva a forma mais literal e a ambiguidade lexical.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A expressão tradicional “Deus dos Exércitos” foi mantida por sua concisão e amplitude; as notas registram as principais alternativas sem sobrecarregar o texto.
