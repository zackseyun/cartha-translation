reference: Hosea 12:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/בְ/נָבִ֕יא הֶעֱלָ֧ה יְהוָ֛ה אֶת יִשְׂרָאֵ֖ל מִ/מִּצְרָ֑יִם וּ/בְ/נָבִ֖יא נִשְׁמָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/014.yaml
  text: By a prophet Yahweh brought Israel up from Egypt[b][a], and by a prophet he was guarded.
translation:
  language: pt
  text: Por meio de um profeta, Yahweh fez Israel subir do Egito; e, por meio de um profeta, Israel foi guardado.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O profeta é provavelmente Moisés, no contexto do êxodo.
    reason: cross_reference
  - marker: b
    text: 'Ou: “foi protegido” ou “foi preservado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנָבִיא
  choice: por meio de um profeta
  rationale: A preposição בְּ indica aqui meio ou agência. A formulação é natural em português e preserva a repetição enfática dos dois membros.
- source_word: הֶעֱלָה
  choice: fez Israel subir
  rationale: O hifil de עלה significa literalmente “fazer subir” ou “levar para cima”. A escolha conserva a expressão hebraica do êxodo sem reduzi-la simplesmente a “tirou”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino יהוה, preservando-o como nome próprio em vez de substituí-lo por um título.
- source_word: מִמִּצְרַיִם
  choice: do Egito
  rationale: Equivalente geográfico corrente e direto em português.
- source_word: נִשְׁמָר
  choice: foi guardado
  rationale: O nifal de שׁמר tem sentido passivo, “ser guardado, protegido ou preservado”. A repetição explícita de “Israel” evita a ambiguidade pronominal pouco natural em português, sem alterar o referente contextual.
theological_decisions:
- issue: Identificação implícita do profeta nos dois membros
  choice: Manter “um profeta” indefinido no texto principal
  alternative: Traduzir “o profeta” ou inserir explicitamente “Moisés”
  rationale: O hebraico não nomeia o profeta nem traz artigo explícito. O contexto aponta provavelmente para Moisés, mas o texto enfatiza a mediação profética; por isso, a identificação fica em nota.
- issue: Referente de נִשְׁמָר
  choice: Explicitar “Israel” como sujeito de “foi guardado”
  alternative: Usar “ele foi guardado”, preservando formalmente o sujeito implícito
  rationale: O referente mais natural no paralelismo é Israel. Em português, o pronome poderia ser associado ao profeta; repetir “Israel” torna a relação clara sem resolver além do que a sintaxe contextual sustenta.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. Conserva-se o paralelismo “por meio de um profeta” e a imagem hebraica “fez Israel subir”. Os marcadores aparecem após a frase a que as duas notas se referem.
