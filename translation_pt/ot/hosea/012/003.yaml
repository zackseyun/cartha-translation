base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/003.yaml
  text: Yahweh has a charge against Judah[a], and he will punish Jacob according to his ways[b]; according to his deeds he will repay him.
translation:
  language: pt
  text: Yahweh tem uma acusação contra Judá[a] e há de pedir contas a Jacó[b] por seus caminhos; segundo seus feitos, lhe retribuirá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Yahweh tem uma causa contra Judá» ou «Yahweh está em disputa com Judá». O hebraico emprega linguagem de contenda judicial.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «castigará Jacó conforme seus caminhos». A expressão hebraica significa literalmente «visitar sobre» e, neste contexto, indica responsabilização ou punição judicial.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רִיב
  choice: tem uma acusação contra
  rationale: Em contexto profético e jurídico, רִיב designa uma disputa, causa ou acusação. A formulação preserva a linguagem forense e soa natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עִם יְהוּדָה
  choice: contra Judá
  rationale: Depois de רִיב, עִם indica a parte contrária numa disputa judicial; «contra» explicita esse valor idiomático.
- source_word: לִפְקֹד עַל
  choice: há de pedir contas a
  rationale: A expressão indica visitação judicial, responsabilização ou punição. «Pedir contas» comunica o acerto de contas sem reduzir toda a amplitude ao ato de punir.
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: Mantém o nome presente no hebraico e sua possível ressonância tanto patriarcal quanto coletiva.
- source_word: כִדְרָכָיו
  choice: por seus caminhos
  rationale: Preserva a metáfora hebraica de «caminhos» para a conduta, em construção portuguesa natural.
- source_word: כְמַעֲלָלָיו
  choice: segundo seus feitos
  rationale: מַעֲלָלִים refere-se a atos ou obras com coloração moral; «feitos» é conciso e digno.
- source_word: יָשִׁיב לוֹ
  choice: lhe retribuirá
  rationale: No contexto judicial, o hifil de שוב com ל expressa retribuição correspondente à conduta anterior.
theological_decisions:
- issue: Distinção entre Judá e Jacó no juízo profético
  choice: 'Preservar os dois nomes como aparecem: Judá como parte contra a qual Yahweh tem uma acusação, e Jacó como alvo da prestação de contas e da retribuição.'
  alternative: Entender e traduzir «Jacó» explicitamente como sinônimo de toda a nação, incluindo Judá e Israel.
  rationale: O texto nomeia Judá e Jacó separadamente. A tradução mantém essa tensão e deixa aberta a extensão corporativa de «Jacó», sem harmonizá-los.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Registro digno e claro; conserva a linguagem jurídica, a metáfora dos «caminhos» e a distinção textual entre Judá e Jacó.
