source:
  edition: WLC
  text: אֶפְרַ֜יִם רֹעֶ֥ה ר֨וּחַ֙ וְ/רֹדֵ֣ף קָדִ֔ים כָּל הַ/יּ֕וֹם כָּזָ֥ב וָ/שֹׁ֖ד יַרְבֶּ֑ה וּ/בְרִית֙ עִם אַשּׁ֣וּר יִכְרֹ֔תוּ וְ/שֶׁ֖מֶן לְ/מִצְרַ֥יִם יוּבָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/002.yaml
  text: Ephraim feeds on wind and pursues the east wind all day long[a]; he multiplies lies and destruction. They make a covenant with Assyria[e][d][c][b], and oil is carried to Egypt.
translation:
  language: pt
  text: Efraim se alimenta de vento[a] e persegue o vento do leste o dia inteiro[b]; multiplica a falsidade e a devastação[c]. Eles fazem uma aliança com a Assíria[d], e óleo é levado ao Egito[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pastoreia o vento”; o verbo hebraico pode significar “apascentar”, “pastorear” ou “alimentar”.
    reason: lexical_alternative
  - marker: b
    text: O vento do leste era quente e destrutivo; a imagem sugere tanto inutilidade quanto dano.
    reason: cultural_note
  - marker: c
    text: Ou “mentira e destruição”, “engano e violência”.
    reason: lexical_alternative
  - marker: d
    text: Literalmente, “cortam uma aliança”, expressão hebraica usual para fazer uma aliança ou firmar um tratado.
    reason: lexical_alternative
  - marker: e
    text: Provavelmente azeite enviado como tributo, presente diplomático ou pagamento ao Egito.
    reason: cultural_note
lexical_decisions:
- source_word: רֹעֶה רוּחַ
  choice: se alimenta de vento
  rationale: רעה pode significar apascentar, pastorear ou alimentar-se. Com “vento”, a expressão retrata algo vazio e incapaz de sustentar; “se alimenta de vento” conserva a metáfora com naturalidade em português.
- source_word: וְרֹדֵף קָדִים
  choice: e persegue o vento leste
  rationale: רדף significa perseguir; קדים designa o vento vindo do leste, conhecido por seu caráter quente e destrutivo. A imagem concreta é preservada sem transformar a metáfora em explicação.
- source_word: כָּל הַיּוֹם
  choice: o dia inteiro
  rationale: Expressão portuguesa natural que comunica ação contínua ao longo de todo o dia.
- source_word: כָּזָב וָשֹׁד
  choice: a falsidade e a devastação
  rationale: כזב denota falsidade ou mentira, enquanto שד pode indicar devastação, destruição, violência ou saque. “Falsidade e devastação” preserva a amplitude da denúncia profética sem limitar שד apenas à violência interpessoal.
- source_word: יַרְבֶּה
  choice: multiplica
  rationale: A forma causativa expressa tornar numeroso ou aumentar. O singular acompanha Efraim como sujeito coletivo.
- source_word: וּבְרִית עִם אַשּׁוּר יִכְרֹתוּ
  choice: Eles fazem uma aliança com a Assíria
  rationale: כרת ברית, literalmente “cortar uma aliança”, é a expressão hebraica usual para estabelecer uma aliança ou tratado. O plural “eles fazem” mantém a mudança do singular coletivo para o verbo plural no hebraico.
- source_word: וְשֶׁמֶן לְמִצְרַיִם יוּבָל
  choice: e óleo é levado ao Egito
  rationale: שמן é óleo, provavelmente azeite, e יוּבָל é uma forma passiva, “é levado”. Não se especifica no texto se o óleo era tributo, presente diplomático ou pagamento.
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Mantém o nome presente no hebraico, embora em Oseias ele frequentemente represente o reino do norte como um todo.
theological_decisions:
- issue: Acusação política expressa por metáfora
  choice: Manter as imagens de alimentar-se de vento e perseguir o vento leste.
  alternative: Parafrasear como “Efraim busca o vazio e a destruição”.
  rationale: As imagens comunicam simultaneamente inutilidade e perigo e fazem parte da força poética da denúncia; explicá-las no texto principal resolveria indevidamente a metáfora.
- issue: Mudança de número gramatical
  choice: Usar o singular em “multiplica” e o plural em “Eles fazem”.
  alternative: Uniformizar todo o versículo no singular ou no plural.
  rationale: O hebraico passa de Efraim como sujeito coletivo singular para um verbo plural, possivelmente focalizando o povo ou seus líderes. A tradução preserva essa oscilação significativa.
- issue: Natureza da relação com a Assíria
  choice: Traduzir ברית por “aliança”.
  alternative: Traduzir por “tratado”.
  rationale: “Aliança” preserva o termo mais amplo e formal do hebraico, que neste contexto também possui dimensão política, sem reduzir antecipadamente seu alcance.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com leitura natural no Brasil. Preserva a metáfora profética, a mudança hebraica do singular coletivo para o plural e a passiva final. “Vento leste” foi preferido a “vento oriental” por ser mais corrente, e “óleo” evita especificar “azeite” no texto principal.
