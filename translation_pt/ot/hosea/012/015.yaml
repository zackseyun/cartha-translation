id: HOS.12.15
reference: Hosea 12:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הִכְעִ֥יס אֶפְרַ֖יִם תַּמְרוּרִ֑ים וְ/דָמָי/ו֙ עָלָ֣י/ו יִטּ֔וֹשׁ וְ/חֶ֨רְפָּת֔/וֹ יָשִׁ֥יב ל֖/וֹ אֲדֹנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/015.yaml
  text: Ephraim has provoked bitter anger[a]; his bloodguilt will be left on him[b], and his Lord will repay him for his disgrace.
translation:
  language: pt
  text: Efraim provocou uma ira amarga[a]; sua culpa de sangue ficará sobre ele[b], e seu Senhor[c] fará recair sobre ele a sua afronta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “provocou amarguras”; também pode ser entendido como “provocou amargamente” ou “provocou amarga indignação”.
    reason: lexical_alternative
  - marker: b
    text: Ou “seu sangue” ou “seu derramamento de sangue permanecerá sobre ele”. No hebraico, “sangues” pode indicar a culpa pelo sangue derramado.
    reason: lexical_alternative
  - marker: c
    text: Ou “seu senhor” ou “seu amo”. O título provavelmente se refere a Deus, mas o nome divino não aparece no hebraico deste versículo.
    reason: alternative_reading
lexical_decisions:
- source_word: הִכְעִיס תַּמְרוּרִים
  choice: provocou uma ira amarga
  rationale: O hifil de כעס significa provocar à ira, enquanto תמרורים intensifica a ideia com a noção de amargura. A formulação comunica de modo natural tanto a provocação quanto sua intensidade.
- source_word: וְדָמָיו
  choice: sua culpa de sangue
  rationale: O plural דמים pode designar sangue derramado e, em contexto judicial, a responsabilidade decorrente dele. “Culpa de sangue” preserva essa dimensão forense sem limitar a expressão ao sangue físico.
- source_word: עָלָיו יִטּוֹשׁ
  choice: ficará sobre ele
  rationale: נטש aqui expressa deixar algo sobre alguém, sem removê-lo. A formulação portuguesa mantém o foco na culpa que continua pesando sobre Efraim, sem explicitar um sujeito que o hebraico deixa implícito.
- source_word: וְחֶרְפָּתוֹ
  choice: a sua afronta
  rationale: חרפה abrange afronta, vergonha e desonra. “Afronta” preserva tanto a ideia de conduta ultrajante quanto a de opróbrio resultante, sem resolver indevidamente a ambiguidade.
- source_word: יָשִׁיב לוֹ
  choice: fará recair sobre ele
  rationale: O hifil de שוב com ל transmite a ideia de devolver ou retribuir. “Fará recair sobre ele” expressa o caráter retributivo e mantém a imagem de a afronta voltar ao responsável.
- source_word: אֲדֹנָיו
  choice: seu Senhor
  rationale: A forma funciona como título singular e, no contexto profético, provavelmente se refere a Deus. A inicial maiúscula sinaliza essa leitura sem substituir o título pelo nome divino, que não aparece no texto.
theological_decisions:
- issue: Referente de אֲדֹנָיו
  choice: Título divino, traduzido por “seu Senhor”
  alternative: “seu senhor” ou “seu amo”
  rationale: O agente do juízo no contexto é provavelmente Deus. “Seu Senhor” conserva o título presente no hebraico e evita introduzir o nome YHWH, que não consta deste versículo.
- issue: Natureza de דָמָיו
  choice: Responsabilidade judicial pelo sangue derramado
  alternative: “seu sangue” ou “seu derramamento de sangue”
  rationale: O uso profético e judicial de דמים favorece “culpa de sangue”, mas a nota preserva as possibilidades lexicais mais literais.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção direta. “Culpa de sangue” conserva o registro judicial profético; “fará recair sobre ele” reproduz de modo idiomático a retribuição expressa por “devolver a ele”. Os marcadores [a], [b] e [c] aparecem no texto principal.
