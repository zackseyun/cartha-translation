  text: Jacob fled to the field of Aram[a]; Israel served for a wife[b], and for a wife he kept watch.
translation:
  language: pt
  text: Jacó fugiu para o campo de Arã[a]; Israel serviu por uma mulher, e por uma mulher vigiou[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para a região de Arã”. A expressão hebraica é literalmente “campo de Arã”.
    reason: lexical_alternative
  - marker: b
    text: Ou “guardou” ou “cuidou”. O verbo não traz objeto expresso; no contexto, pode referir-se a guardar ou cuidar dos rebanhos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: fugiu
  rationale: O verbo ברח expressa fugir ou escapar. “Fugiu” é conciso, natural e preserva a força narrativa sem especificar indevidamente a motivação.
- source_word: שְׂדֵה אֲרָם
  choice: para o campo de Arã
  rationale: שָׂדֶה significa literalmente “campo” e, nesta construção, pode designar a região ou o território rural de Arã. A tradução conserva a imagem hebraica, com a alternativa idiomática indicada em nota.
- source_word: וַיַּעֲבֹד
  choice: serviu
  rationale: עבד pode significar servir ou trabalhar. “Serviu” corresponde ao serviço de Jacó sob Labão e mantém o valor amplo do verbo.
- source_word: בְּאִשָּׁה / וּבְאִשָּׁה
  choice: por uma mulher / e por uma mulher
  rationale: 'A preposição ב tem aqui valor de finalidade ou compensação: Jacó prestou serviço para obter uma mulher como esposa. “Por uma mulher” preserva a formulação concisa e a repetição retórica do hebraico.'
- source_word: שָׁמָר
  choice: cuidou dos rebanhos
  rationale: שׁמר significa guardar, vigiar ou cuidar. No contexto da história de Jacó e Labão, o objeto implícito provavelmente são os rebanhos; a explicitação produz português natural, sem esconder em nota que o hebraico não nomeia o objeto.
- source_word: יַעֲקֹב / יִשְׂרָאֵל
  choice: Jacó / Israel
  rationale: A alternância intencional entre os dois nomes é preservada, mantendo tanto a referência ao patriarca quanto sua associação temática com o povo.
theological_decisions:
- issue: Alternância entre os nomes Jacó e Israel
  choice: Preservar distintamente “Jacó” e “Israel” no texto principal
  alternative: Uniformizar ambos como “Jacó” ou ambos como “Israel”
  rationale: O hebraico alterna deliberadamente os nomes, evocando ao mesmo tempo o patriarca e a nação que dele descende. Uniformizá-los eliminaria uma tensão significativa do texto.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e alcance internacional. Conserva-se o paralelismo e a alternância dos nomes. “Arã” segue a forma bíblica portuguesa tradicional; “mulher” mantém a repetição lexical do hebraico, enquanto o contexto deixa claro que se trata da mulher que Jacó buscava como esposa.
