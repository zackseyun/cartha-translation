  text: וְ/אָנֹכִ֛י יְהוָ֥ה אֱלֹהֶ֖י/ךָ מֵ/אֶ֣רֶץ מִצְרָ֑יִם עֹ֛ד אוֹשִֽׁיבְ/ךָ֥ בָ/אֳהָלִ֖ים כִּ/ימֵ֥י מוֹעֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/010.yaml
  text: Yet I am Yahweh your God from the land of Egypt; I will again make you dwell in tents[a], as in the days of the appointed feast.
translation:
  language: pt
  text: Mas eu sou Yahweh, seu Deus, da terra do Egito. Mais uma vez farei você habitar em tendas, como nos dias da festa designada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do tempo designado” ou “da festa”. A expressão pode aludir à Festa das Cabanas, quando Israel habitava em abrigos temporários.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָנֹכִי
  choice: Mas eu
  rationale: O pronome enfático אָנֹכִי mantém o sujeito explícito, e a conjunção recebe valor adversativo adequado ao contraste com a repreensão do contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz de modo natural a designação de aliança e o sufixo de segunda pessoa masculina singular.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: desde a terra do Egito
  rationale: A preposição pode ter nuance temporal neste contexto, evocando a relação de Yahweh com Israel desde o êxodo sem apagar a referência geográfica.
- source_word: עֹד
  choice: ainda
  rationale: Com o verbo no futuro, indica uma ação futura ou renovada. “Ainda” preserva melhor que “novamente” a abertura entre continuidade e repetição.
- source_word: אוֹשִׁיבְךָ
  choice: farei você habitar
  rationale: Preserva o sentido causativo do hifil de ישב em português atual e inteligível.
- source_word: בָאֳהָלִים
  choice: em tendas
  rationale: Traduz o sentido concreto do substantivo sem inserir no texto principal a terminologia tradicional “tabernáculos”.
- source_word: כִּימֵי
  choice: como nos dias da
  rationale: Expressa naturalmente a comparação com a ocasião histórica ou cultual mencionada.
- source_word: מוֹעֵד
  choice: festa marcada
  rationale: מוֹעֵד pode significar tempo determinado ou festa. A expressão conserva tanto a noção de data estabelecida quanto a dimensão festiva, sem identificar de forma absoluta qual festa está em vista.
theological_decisions:
- issue: Se a habitação em tendas é promessa, ameaça ou reversão irônica
  choice: Apresentar a ação sem qualificá-la como bênção ou castigo.
  alternative: Interpretá-la explicitamente como renovação da comunhão do êxodo, ameaça de exílio e privação, ou referência direta à Festa das Cabanas.
  rationale: O hebraico não inclui uma avaliação explícita. A formulação preserva a tensão entre restauração, juízo e alusão à experiência do deserto ou à celebração festiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Farei você habitar” mantém o causativo hebraico sem recorrer ao mais arcaizante “farei habitar-te”. O marcador [a] aparece no texto principal.
