  text: וַ/יֹּ֣אמֶר אֶפְרַ֔יִם אַ֣ךְ עָשַׁ֔רְתִּי מָצָ֥אתִי א֖וֹן לִ֑/י כָּל יְגִיעַ֕/י לֹ֥א יִמְצְאוּ לִ֖/י עָוֺ֥ן אֲשֶׁר חֵֽטְא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/009.yaml
  text: And Ephraim said[a], “Surely I have become rich; I have found wealth for myself[c][b]. In all my labor they will not find in me iniquity that is sin.”
translation:
  language: pt
  text: 'E Efraim disse: “Certamente enriqueci; consegui riqueza para mim.[a] Em todo o meu trabalho, não encontrarão em mim culpa alguma que seja pecado.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “consegui força para mim” ou “consegui recursos para mim”. A palavra hebraica pode significar força, riqueza ou bens; neste contexto, provavelmente se refere à riqueza material.
    reason: lexical_alternative
  - marker: b
    text: Ou “Em todos os meus ganhos, não encontrarão em mim culpa alguma que seja pecado”. O hebraico desta oração é condensado e permite entender o termo tanto como trabalho quanto como o ganho produzido por ele.
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Certamente
  rationale: Expressa a confiança enfática da afirmação de Efraim sem impor o sentido exclusivo de “somente”.
- source_word: עָשַׁרְתִּי
  choice: enriqueci
  rationale: O perfeito indica que Efraim alcançou a riqueza; a forma portuguesa é natural e conserva esse valor resultativo.
- source_word: אוֹן
  choice: riqueza
  rationale: Embora o termo possa indicar força ou recursos, o contexto comercial favorece riqueza material.
- source_word: כָּל יְגִיעַי
  choice: em todo o meu trabalho
  rationale: Conserva o singular hebraico e parte da amplitude entre o esforço realizado e o resultado obtido.
- source_word: יִמְצְאוּ לִי
  choice: não encontrarão em mim
  rationale: Comunica de modo natural a alegação de que ninguém conseguirá detectar ou atribuir culpabilidade a Efraim.
- source_word: עָוֺן
  choice: culpa alguma
  rationale: O termo abrange tanto a conduta perversa quanto a culpabilidade resultante; “culpa” se ajusta ao tom de autojustificação.
- source_word: אֲשֶׁר חֵטְא
  choice: que seja pecado
  rationale: Mantém a formulação breve e tensa do hebraico, sem decidir se a expressão qualifica, equipara ou delimita a culpa.
theological_decisions:
- issue: Perspectiva do orador e ironia moral
  choice: Apresentar a fala como a alegação autoconfiante e autojustificadora de Efraim, sem endossá-la.
  alternative: Explicitar no texto que a alegação é enganosa, irônica ou condenável.
  rationale: O hebraico registra diretamente as palavras de Efraim; a avaliação profética emerge do contexto, não de uma glosa inserida na tradução.
- issue: Relação entre culpa e pecado
  choice: Preservar a expressão “culpa alguma que seja pecado”.
  alternative: Interpretar como “culpa que constitua delito” ou “iniquidade que equivalha a pecado”.
  rationale: A construção hebraica é elíptica e admite mais de uma relação sintática; a tradução evita resolver indevidamente a possível distinção retórica feita por Efraim.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A fala direta preserva a autoconfiança de Efraim e a construção final mantém a tensão do hebraico, enquanto as notas registram as principais alternativas lexicais e sintáticas.
