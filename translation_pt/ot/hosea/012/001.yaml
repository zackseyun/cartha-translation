  text: סְבָבֻ֤/נִי בְ/כַ֨חַשׁ֙ אֶפְרַ֔יִם וּ/בְ/מִרְמָ֖ה בֵּ֣ית יִשְׂרָאֵ֑ל וִֽ/יהוּדָ֗ה עֹ֥ד רָד֙ עִם אֵ֔ל וְ/עִם קְדוֹשִׁ֖ים נֶאֱמָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/001.yaml
  text: Ephraim has surrounded me with lies[a], and the house of Israel with deceit[b]; but Judah still roams with God and is faithful with the Holy One.
translation:
  language: pt
  text: Efraim cercou-me de mentiras, e a casa de Israel, de engano; mas Judá ainda caminha[a] com Deus e é fiel ao Santo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O verbo hebraico é difícil. Também pode ser traduzido por “vagueia” ou “governa”. Outra leitura possível da oração é: “Judá continua indomável contra Deus, contra o Santo, que é fiel”.'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “com santos”. A expressão também pode referir-se a seres celestiais; aqui foi entendida como “ao Santo”, isto é, Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סְבָבֻנִי
  choice: cercou-me
  rationale: O qal perfeito com sufixo de primeira pessoa expressa literalmente a ideia de cercar. Em português, “cercou-me” preserva com clareza a metáfora, tratando Efraim como nome coletivo singular.
- source_word: בְכַחַשׁ
  choice: de mentiras
  rationale: כחש indica falsidade ou negação enganosa. “De mentiras” é corrente e se combina naturalmente com o verbo “cercar”.
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Mantém-se o nome próprio, embora em Oseias ele frequentemente represente o reino do norte.
- source_word: וּבְמִרְמָה
  choice: de engano
  rationale: מרמה designa engano, fraude ou traição. “Engano” preserva a distinção em relação a “mentiras” sem especificar além do texto.
- source_word: בֵּית יִשְׂרָאֵל
  choice: a casa de Israel
  rationale: Conserva a expressão hebraica e seu registro profético.
- source_word: וִיהוּדָה
  choice: mas Judá
  rationale: A conjunção permite valor adversativo; “mas” torna explícito o contraste sugerido pela leitura positiva da última oração.
- source_word: עֹד
  choice: ainda
  rationale: Expressa continuação ou persistência.
- source_word: רָד עִם אֵל
  choice: caminha com Deus
  rationale: O verbo é raro e de interpretação incerta. “Caminha com Deus” oferece uma leitura positiva e relacional coerente com נֶאֱמָן, sem ocultar em nota as leituras “vagueia”, “governa” ou “é indomável”.
- source_word: אֵל
  choice: Deus
  rationale: Neste contexto, אֵל funciona naturalmente como título divino, não sendo necessário transliterá-lo como “El”.
- source_word: וְעִם קְדוֹשִׁים
  choice: ao Santo
  rationale: Embora קְדוֹשִׁים tenha forma plural, no contexto pode ser entendido como referência intensiva ou majestática a Deus. A construção portuguesa “fiel ao Santo” é idiomática; o plural formal é preservado em nota.
- source_word: נֶאֱמָן
  choice: é fiel
  rationale: O particípio/adjetivo nifal comunica fidelidade, confiabilidade ou firmeza. Na leitura principal, predica a fidelidade de Judá.
theological_decisions:
- issue: Sentido da oração sobre Judá em um texto hebraico lexical e sintaticamente difícil
  choice: 'Leitura positiva: Judá ainda caminha com Deus e é fiel ao Santo.'
  alternative: 'Leitura negativa: Judá continua indomável contra Deus, contra o Santo, que é fiel; também são possíveis leituras como “vagueia” ou “governa”.'
  rationale: נֶאֱמָן pode descrever Judá como fiel, produzindo contraste com a falsidade de Efraim e Israel. Contudo, רָד é obscuro, e outra análise pode fazer de Deus o fiel e de Judá o rebelde. A tradução principal adota a leitura positiva, mas a nota preserva a tensão real.
- issue: Referente de קְדוֹשִׁים
  choice: O Santo, como referência a Deus
  alternative: os santos, possivelmente seres celestiais
  rationale: A forma é morfologicamente plural, mas pode funcionar poeticamente como designação divina. Como ambas as análises são possíveis, a alternativa plural é explicitada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A elipse em “e a casa de Israel, de engano” evita repetição pesada sem perder o paralelismo. As notas registram, sem resolver silenciosamente, a dificuldade do verbo רָד, a possível mudança de referente de נֶאֱמָן e o plural de קְדוֹשִׁים.
