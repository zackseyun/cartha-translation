source:
  edition: WLC
  text: וְ/אַתָּ֖ה בֵּ/אלֹהֶ֣י/ךָ תָשׁ֑וּב חֶ֤סֶד וּ/מִשְׁפָּט֙ שְׁמֹ֔ר וְ/קַוֵּ֥ה אֶל אֱלֹהֶ֖י/ךָ תָּמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/007.yaml
  text: So you[a], by your God, return; keep steadfast love and justice[b], and wait continually for your God.
translation:
  language: pt
  text: Mas você, com o seu Deus, volte[a]; mantenha o amor leal e a justiça e espere sempre em seu Deus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “volte para o seu Deus”. O hebraico diz literalmente “com/por seu Deus, volte”, uma construção incomum que pode indicar meio, relação ou direção.'
    reason: lexical_alternative
  - marker: b
    text: “Espere” também pode ser traduzido por “tenha esperança” ou “aguarde com expectativa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהֶיךָ
  choice: com o seu Deus
  rationale: A preposição ב pode indicar meio, relação ou esfera. “Com o seu Deus” conserva a construção incomum e a dimensão relacional sem definir de modo rígido se Deus é o meio ou o destino do retorno.
- source_word: תָשׁוּב
  choice: volte
  rationale: שׁוב significa normalmente voltar ou retornar. “Volte” preserva tanto o sentido básico quanto o chamado de restauração da aliança, sem explicitar “arrependa-se” no texto principal.
- source_word: חֶסֶד
  choice: amor leal
  rationale: A expressão comunica amor fiel, misericórdia e lealdade relacional, incluindo a dimensão da aliança, em português claro e atual.
- source_word: מִשְׁפָּט
  choice: justiça
  rationale: Neste contexto de exortação ética, “justiça” expressa melhor a prática do que é reto nas relações sociais e judiciais.
- source_word: שְׁמֹר
  choice: mantenha
  rationale: O imperativo pede que o povo preserve e pratique continuamente essas qualidades. “Mantenha” é natural com os objetos abstratos “amor leal e justiça” e permanece próximo da ideia de guardar.
- source_word: וְקַוֵּה
  choice: espere
  rationale: קוה reúne as ideias de esperar, ter esperança e aguardar com expectativa. “Espere” mantém essa postura de dependência, enquanto a nota registra a nuance de esperança.
- source_word: אֶל אֱלֹהֶיךָ
  choice: em seu Deus
  rationale: Com “esperar”, o português idiomático admite “esperar em Deus”, comunicando expectativa confiante e preservando o objeto pessoal, “seu Deus”.
- source_word: תָּמִיד
  choice: sempre
  rationale: תמיד indica continuidade. “Sempre” é direto, natural e adequado à exortação.
theological_decisions:
- issue: Se o chamado deve ser traduzido explicitamente como arrependimento
  choice: volte
  alternative: arrependa-se
  rationale: Embora o contexto seja um chamado de retorno à fidelidade da aliança, o verbo hebraico é mais amplo que uma formulação penitencial explícita. “Volte” preserva essa amplitude e a tensão teológica.
- issue: Sentido da construção בֵּאלֹהֶיךָ תָשׁוּב
  choice: com o seu Deus, volte
  alternative: volte para o seu Deus
  rationale: O hebraico emprega a preposição ב, não a preposição normalmente esperada para indicar direção. A tradução principal conserva a relação incomum com Deus, e a nota apresenta a leitura direcional possível sem impô-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem ligeiramente marcada em “com o seu Deus, volte” preserva a construção hebraica incomum; as demais expressões priorizam clareza natural sem apagar as nuances da aliança e da expectativa confiante.
