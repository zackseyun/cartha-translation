  text: וָ/יָּ֤שַׂר אֶל מַלְאָךְ֙ וַ/יֻּכָ֔ל בָּכָ֖ה וַ/יִּתְחַנֶּן ל֑/וֹ בֵּֽית אֵל֙ יִמְצָאֶ֔/נּוּ וְ/שָׁ֖ם יְדַבֵּ֥ר עִמָּֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/005.yaml
  text: He strove with the angel and prevailed[a]; he wept and sought his favor. At Bethel he found him[b], and there he spoke with us—
translation:
  language: pt
  text: Ele lutou com o anjo e prevaleceu; chorou e implorou-lhe favor. Em Betel, ele o encontrou, e ali falou conosco[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “conosco”. Alguns entendem “com ele”, regularizando a mudança de pessoa.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשַׂר
  choice: lutou
  rationale: No contexto da narrativa de Jacó (Gênesis 32), o verbo שרה indica luta ou confronto. “Lutou” é claro e preserva a alusão.
- source_word: מַלְאָךְ
  choice: o anjo
  rationale: O contexto remete ao ser sobrenatural do episódio em que Jacó lutou; por isso, “anjo” é mais adequado que o sentido geral “mensageiro”. O artigo definido decorre do referente conhecido no contexto.
- source_word: וַיֻּכָל
  choice: prevaleceu
  rationale: Aqui יכל exprime êxito no confronto. “Prevaleceu” mantém a força da alusão narrativa sem sugerir mais do que o hebraico afirma.
- source_word: בָּכָה
  choice: chorou
  rationale: Tradução direta, natural e precisa do verbo בכה.
- source_word: וַיִּתְחַנֶּן לוֹ
  choice: lhe suplicou por favor
  rationale: O hitpael de חנן expressa súplica por favor ou misericórdia. A formulação retém tanto a ação de implorar quanto o componente lexical de favor.
- source_word: בֵּית אֵל
  choice: Betel
  rationale: Forma consagrada e amplamente reconhecida em português para o nome do lugar.
- source_word: יִמְצָאֶנּוּ
  choice: ele o encontrou
  rationale: 'A leitura mais imediata entende Jacó como sujeito singular e Deus como objeto: ele o encontrou em Betel. A tradução preserva a sequência pessoal do relato.'
- source_word: וְשָׁם יְדַבֵּר עִמָּנוּ
  choice: e ali falou conosco
  rationale: Mantém o sufixo de primeira pessoa plural do Texto Massorético, preservando a mudança incomum de pessoa que associa os ouvintes à experiência de Jacó. O imperfeito é vertido como passado no fluxo da recordação narrativa.
theological_decisions:
- issue: Mudança de pronome na cláusula final
  choice: manter “conosco” no texto principal
  alternative: “com ele”
  rationale: O Texto Massorético traz a primeira pessoa plural, uma leitura difícil, mas significativa, que vincula Israel à experiência de Jacó. A tradução não harmoniza silenciosamente o pronome com o singular anterior.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação conserva a mudança pronominal e a tensão do hebraico sem explicá-las no corpo do versículo.
