source:
  edition: WLC
  text: אִם גִּלְעָ֥ד אָ֨וֶן֙ אַךְ שָׁ֣וְא הָי֔וּ בַּ/גִּלְגָּ֖ל שְׁוָרִ֣ים זִבֵּ֑חוּ גַּ֤ם מִזְבְּחוֹתָ/ם֙ כְּ/גַלִּ֔ים עַ֖ל תַּלְמֵ֥י שָׂדָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/012.yaml
  text: If Gilead is iniquity[a], they have surely become nothing; in Gilgal they sacrifice bulls; indeed[c][b], their altars are like stone heaps on the furrows of the field.
translation:
  language: pt
  text: Se Gileade é iniquidade[a], certamente não passam de nada[b]. Em Gilgal sacrificam touros; até os seus altares são como montões de pedras[c] nos sulcos do campo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Certamente Gileade é iniquidade”; a partícula hebraica pode ser entendida como enfática, e não condicional.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “certamente são inutilidade” ou “falsidade”. A expressão hebraica é condensada e pode enfatizar vazio, inutilidade ou falsidade.'
    reason: lexical_alternative
  - marker: c
    text: A imagem talvez compare os numerosos altares a montões de pedras vistos junto aos sulcos dos campos arados.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Preserva a forma condicional e a força retórica da partícula hebraica, sem excluir seu possível valor enfático.
- source_word: גִּלְעָד
  choice: Gileade
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: אָוֶן
  choice: iniquidade
  rationale: Expressa a culpa moral e mantém amplitude suficiente para possíveis conotações de idolatria.
- source_word: אַךְ שָׁוְא הָיוּ
  choice: eles certamente se tornaram nada
  rationale: Reproduz a ênfase de אַךְ e o juízo comprimido de שָׁוְא, que pode indicar vazio, inutilidade ou falsidade.
- source_word: בַּגִּלְגָּל
  choice: Em Gilgal
  rationale: Tradução locativa direta do nome do centro de culto.
- source_word: שְׁוָרִים זִבֵּחוּ
  choice: sacrificam touros
  rationale: O presente comunica uma prática cultual habitual, e 'touros' é natural no contexto sacrificial.
- source_word: גַּם מִזְבְּחוֹתָם
  choice: até os seus altares
  rationale: '''Até'' comunica a progressão enfática de גַּם para a imagem culminante dos altares.'
- source_word: כְּגַלִּים עַל תַּלְמֵי שָׂדָי
  choice: como montões de pedras nos sulcos do campo
  rationale: Torna concreta a imagem agrícola de גַּלִּים, montes ou pilhas provavelmente formados por pedras.
theological_decisions:
- issue: Sentido da cláusula inicial אִם גִּלְעָד אָוֶן
  choice: Se Gileade é iniquidade
  alternative: Certamente Gileade é iniquidade
  rationale: A partícula אִם pode ser condicional ou enfática no discurso profético. A redação principal conserva a tensão retórica, e a nota registra a leitura enfática.
- issue: Força de שָׁוְא no veredito sobre o povo
  choice: se tornaram nada
  alternative: se tornaram inúteis / falsos
  rationale: A expressão hebraica reúne ideias de vazio, inutilidade e falsidade. A tradução mantém sua formulação contundente sem restringi-la a apenas uma dessas nuances.
translation_notes:
  register: Português moderno, digno e de leitura natural, com formas reconhecidas no Brasil e compreensíveis internacionalmente. A sintaxe poética e a acusação profética foram mantidas sem explicar em excesso no corpo do versículo.
