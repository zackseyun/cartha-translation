  naturalness: “Se Gileade é iniquidade” e o restante do versículo têm registro apropriado. A substituição de “eles certamente se tornaram nada” por “certamente não passam de nada” conserva o juízo de nulidade/vaidade e produz português moderno mais natural.
  terminology: “Iniquidade”, “touros”, “altares”, “montões de pedras” e “sulcos” são escolhas adequadas. A nota lexical deve usar substantivos (“inutilidade”, “falsidade”), em paralelo com o sentido de שָׁוְא, em vez de adjetivos que ficam sintaticamente imprecisos após “se tornaram”.
