  text: כְּנַ֗עַן בְּ/יָד֛/וֹ מֹאזְנֵ֥י מִרְמָ֖ה לַ/עֲשֹׁ֥ק אָהֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/008.yaml
  text: A merchant—with deceptive scales in his hand—loves to oppress[a].
translation:
  language: pt
  text: O mercador — com balanças enganosas na mão — ama oprimir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Canaã”. A palavra também pode ser entendida como “cananeu” ou, por extensão, “mercador” ou “comerciante”; o sentido comercial combina com o contexto das balanças enganosas.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּנַעַן
  choice: O mercador
  rationale: Embora a forma hebraica seja o nome próprio “Canaã”, o contexto imediato das balanças fraudulentas favorece o sentido por extensão “mercador” ou “comerciante”. A possível evocação de Canaã é preservada em nota.
- source_word: בְּיָדוֹ
  choice: na mão
  rationale: Mantém de modo natural em português a imagem concreta de alguém segurando o instrumento de pesagem.
- source_word: מֹאזְנֵי
  choice: balanças
  rationale: É o equivalente corrente em português para instrumentos de pesagem e se ajusta à linguagem comercial do contexto.
- source_word: מִרְמָה
  choice: enganosas
  rationale: Expressa o substantivo hebraico “engano, fraude” em função atributiva, indicando balanças usadas para iludir.
- source_word: לַעֲשֹׁק
  choice: de oprimir
  rationale: Preserva a amplitude do verbo hebraico, que pode envolver opressão, exploração e fraude; o contexto comercial também permite “defraudar”.
- source_word: אָהֵב
  choice: gosta
  rationale: Em português atual, “gosta de” comunica com naturalidade a inclinação característica expressa pelo hebraico, sem sugerir necessariamente afeto pessoal.
theological_decisions:
- issue: Se כְּנַעַן deve ser entendido como nome próprio (“Canaã”), designação étnica (“cananeu”) ou substantivo comum (“mercador”)
  choice: mercador
  alternative: Canaã; cananeu
  rationale: As balanças enganosas tornam o sentido comercial o mais claro no contexto. Contudo, a forma hebraica pode evocar “Canaã” e talvez identificar retoricamente Efraim com práticas cananeias; essa tensão é preservada na nota.
- issue: Amplitude moral de עָשַׁק no contexto comercial
  choice: oprimir
  alternative: defraudar; explorar; extorquir
  rationale: “Oprimir” conserva a acusação ampla de exploração, enquanto as balanças enganosas deixam evidente sua manifestação econômica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção entre travessões conserva o destaque da imagem concreta. “Mercador” mantém um tom profético elevado sem ser obscuro; “gosta de oprimir” soa mais natural no português corrente do que “ama oprimir”.
