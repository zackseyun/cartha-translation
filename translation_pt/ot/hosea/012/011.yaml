id: HOS.12.11
reference: Hosea 12:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/דִבַּ֨רְתִּי֙ עַל הַ/נְּבִיאִ֔ים וְ/אָנֹכִ֖י חָז֣וֹן הִרְבֵּ֑יתִי וּ/בְ/יַ֥ד הַ/נְּבִיאִ֖ים אֲדַמֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/011.yaml
  text: I spoke through the prophets[a]; I myself multiplied visions[c][b], and through the hand of the prophets I gave parables.
translation:
  language: pt
  text: Falei aos profetas[a]; eu mesmo multipliquei as visões e, por meio dos profetas[b], falei em comparações[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Falei por meio dos profetas”. A preposição hebraica pode ser entendida de mais de uma maneira aqui; o paralelismo com a última oração favorece a ideia de fala mediada pelos profetas.
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “pela mão dos profetas”, expressão idiomática que indica agência ou mediação.'
    reason: lexical_alternative
  - marker: c
    text: Ou “apresentei parábolas” ou “usei semelhanças”. O verbo hebraico é difícil e pode se referir à comunicação por linguagem figurada ou comparações.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִבַּרְתִּי עַל הַנְּבִיאִים
  choice: Falei aos profetas
  rationale: Com דִּבֵּר, a preposição עַל pode indicar o destinatário da fala, embora também admita outras relações. “Aos profetas” é direto e natural; a possível ideia de mediação é preservada em nota.
- source_word: וְאָנֹכִי
  choice: eu mesmo
  rationale: O pronome independente אָנֹכִי enfatiza o sujeito, já indicado pelas formas verbais. “Eu mesmo” reproduz essa ênfase em português corrente.
- source_word: חָזוֹן הִרְבֵּיתִי
  choice: multipliquei as visões
  rationale: O hifil de רבה significa fazer aumentar ou multiplicar. A tradução conserva חָזוֹן como objeto concreto e mantém a formulação enfática do hebraico.
- source_word: וּבְיַד הַנְּבִיאִים
  choice: por meio dos profetas
  rationale: A expressão idiomática בְּיַד, literalmente “pela mão de”, marca agência ou mediação. “Por meio dos profetas” comunica naturalmente esse sentido em português.
- source_word: אֲדַמֶּה
  choice: falei em comparações
  rationale: O piel de דמה é difícil neste contexto e pode indicar representar por semelhanças ou comunicar mediante comparações. A escolha mantém o caráter figurado sem restringi-lo necessariamente a parábolas formais.
theological_decisions:
- issue: Modo da revelação profética
  choice: A primeira oração é apresentada como fala dirigida aos profetas, enquanto a última declara explicitamente a mediação deles.
  alternative: A primeira oração também pode ser entendida como fala de Deus por meio dos profetas.
  rationale: 'A preposição עַל permite mais de uma compreensão, e o paralelismo favorece considerar a mediação profética. A tradução não apaga essa tensão: adota o valor direcional no texto e registra a leitura instrumental em nota.'
- issue: Natureza das comparações proféticas
  choice: “Falei em comparações” preserva um modo figurado de comunicação sem definir uma forma literária específica.
  alternative: “Apresentei parábolas” ou “usei semelhanças”.
  rationale: O verbo hebraico é semanticamente difícil. Evitar uma formulação excessivamente específica impede que a tradução imponha uma categoria literária não exigida pelo texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade no Brasil. A sintaxe preserva o paralelismo e a ênfase do pronome hebraico; as notas conservam as ambiguidades lexical e sintática sem sobrecarregar o texto principal.
