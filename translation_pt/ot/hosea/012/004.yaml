base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/004.yaml
  text: In the womb he grasped his brother’s heel[b][a], and in his strength he contended with God.
translation:
  language: pt
  text: No ventre materno, ele agarrou o calcanhar de seu irmão[a] e, com sua força, lutou com Deus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tomou seu irmão pelo calcanhar”. O verbo hebraico evoca o relato do nascimento de Jacó e também pode sugerir a ideia ampliada de suplantar.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “lutou com um ser divino”. O versículo seguinte identifica a figura como “o anjo”; assim, Oseias preserva a tensão entre as duas descrições.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּבֶּטֶן
  choice: No ventre materno
  rationale: בטן pode designar ventre ou útero. A expressão natural em português, no contexto de Jacó antes do nascimento, é “ventre materno”.
- source_word: עָקַב
  choice: agarrou o calcanhar
  rationale: O verbo evoca diretamente o relato do nascimento de Jacó em Gênesis 25:26 e o motivo etimológico do calcanhar. A tradução conserva a imagem concreta sem antecipar o sentido ampliado de suplantar.
- source_word: אָחִיו
  choice: de seu irmão
  rationale: A construção portuguesa “agarrou o calcanhar de seu irmão” expressa com clareza a relação indicada pelo hebraico.
- source_word: וּבְאוֹנוֹ
  choice: com sua força
  rationale: און denota força, vigor ou potência. “Com sua força” é corrente e preserva o sentido instrumental ou circunstancial da preposição sem especificar indevidamente idade ou virilidade.
- source_word: שָׂרָה
  choice: lutou
  rationale: O verbo indica combate ou contenda e evoca tanto a luta de Jacó quanto o nome Israel. “Lutou” é natural em português e não acrescenta a ideia de vitória, ausente nesta oração.
- source_word: אֶת אֱלֹהִים
  choice: com Deus
  rationale: Embora אֵת tenha aqui a forma do marcador de objeto, com este verbo a relação é expressa idiomaticamente em português por “lutar com”. אֱלֹהִים é mantido como “Deus”, sem harmonizá-lo com “o anjo” no versículo seguinte.
theological_decisions:
- issue: Referente de אֱלֹהִים na luta de Jacó
  choice: Deus
  alternative: um ser divino; o anjo, à luz do versículo seguinte
  rationale: O texto deste versículo diz אֱלֹהִים, portanto a tradução principal mantém “Deus”. Como o versículo seguinte chama a figura de “o anjo”, a nota preserva a tensão entre a descrição divina e a angélica em vez de resolvê-la.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Ventre materno” evita a estranheza de “barriga” e esclarece o contexto pré-natal; “lutou” mantém a alusão narrativa sem linguagem excessivamente técnica. Os marcadores aparecem junto às expressões a que se referem, em ordem alfabética.
