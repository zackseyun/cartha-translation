base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/005.yaml
  text: And on that day I will break the bow of Israel in the Valley of Jezreel[a].
translation:
  language: pt
  text: E, naquele dia, quebrarei o arco de Israel no vale de Jezreel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “despedaçarei o arco de Israel”. O “arco” representa a força militar de Israel.'
    reason: Registra uma alternativa lexical legítima para שׁבר e esclarece a função metonímica da imagem sem substituí-la no texto principal.
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: E, naquele dia
  rationale: A expressão introduz um acontecimento futuro profético. Esta formulação preserva a ligação com o contexto e a referência temporal sem reproduzir de modo artificial a construção hebraica “e acontecerá”.
- source_word: וְשָׁבַרְתִּי
  choice: quebrarei
  rationale: O verbo שׁבר significa “quebrar” ou “despedaçar”. “Quebrarei” é direto e natural, além de conservar a imagem da destruição do arco.
- source_word: קֶשֶׁת יִשְׂרָאֵל
  choice: o arco de Israel
  rationale: A tradução literal preserva a imagem militar e sua força simbólica, em vez de substituí-la por uma explicação interpretativa.
- source_word: בְּעֵמֶק יִזְרְעֶאל
  choice: no vale de Jezreel
  rationale: עֵמֶק designa um vale, e Jezreel é a forma tradicional e amplamente reconhecida do nome geográfico em português.
theological_decisions:
- issue: Se “arco” deve ser mantido como imagem concreta ou interpretado como poder militar
  choice: Manter “o arco de Israel” no texto principal
  alternative: a força militar de Israel
  rationale: O hebraico emprega uma imagem concreta que funciona como metonímia do poder militar. Preservá-la mantém a retórica profética e evita inserir a interpretação diretamente no texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A inversão verbal em “quebrarei” preserva concisão e solenidade sem soar arcaica; a imagem profética e o nome geográfico foram mantidos.
