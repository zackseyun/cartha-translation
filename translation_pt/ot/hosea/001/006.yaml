- from: 'Depois, ela engravidou novamente e deu à luz uma filha. E ele lhe disse: “Dê a ela o nome de Lo-Ruamá[a], pois não voltarei a ter compaixão da casa de Israel, a ponto de lhes perdoar de todo.[b]”'
  to: 'Depois, ela engravidou novamente e deu à luz uma filha. E ele lhe disse: “Dê-lhe o nome de Lo-Ruama[a], pois não voltarei a ter compaixão da casa de Israel e certamente não lhes perdoarei.[b]”'
  rationale: A revisão torna explícita a negação que, na leitura de «perdoar», está sob o alcance da declaração anterior de retirada da compaixão, e representa a ênfase verbal com «certamente». Também ajusta a forma do nome e a respectiva nota para uso português mais natural. As notas permanecem ancoradas no nome e na oração final difícil.
