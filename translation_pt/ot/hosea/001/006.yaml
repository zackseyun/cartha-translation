  naturalness: O texto é geralmente natural. «Dê-lhe o nome de» é mais idiomático e conciso que «Dê a ela o nome de». «Lo-Ruama» segue a forma corrente em português bíblico, sem um acento que não é usual na apresentação portuguesa desse nome.
  terminology: «Compaixão» preserva adequadamente o elo lexical com רחם. A nota do nome deve explicá-lo de forma portuguesa natural, evitando o pouco usual «não compadecida».
