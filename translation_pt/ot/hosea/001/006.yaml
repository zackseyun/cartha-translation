base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/006.yaml
  text: Then she conceived again and gave birth to a daughter[a]. And he said to him, “Call her name Lo-ruhamah, for I will no longer again show compassion to the house of Israel[b], that I should surely forgive them.”
translation:
  language: pt
  text: 'Depois, ela engravidou novamente e deu à luz uma filha. E ele lhe disse: “Dê-lhe o nome de Lo-Ruama[a], pois não voltarei a ter compaixão da casa de Israel e certamente não lhes perdoarei.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lo-Ruama significa aproximadamente “aquela que não recebeu compaixão” ou “sem compaixão”.
    reason: lexical_alternative
  - marker: b
    text: 'Outra tradução possível: “pois certamente os levarei embora”. A oração final em hebraico é difícil.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: Depois, ela engravidou novamente
  rationale: Expressa com naturalidade a sequência narrativa do wayyiqtol e o valor reiterativo de עוֹד.
- source_word: וַתֵּלֶד בַּת
  choice: e deu à luz uma filha
  rationale: Tradução direta e corrente de ילד com בַּת em português moderno.
- source_word: וַיֹּאמֶר לוֹ
  choice: E ele lhe disse
  rationale: Mantém os dois pronomes presentes no hebraico sem inserir explicitamente sujeitos ou destinatários que o versículo não nomeia.
- source_word: קְרָא שְׁמָהּ
  choice: Dê a ela o nome de
  rationale: Reproduz de modo natural em português a fórmula hebraica de nomeação.
- source_word: לֹא רֻחָמָה
  choice: Lo-Ruamá
  rationale: Translitera o nome pessoal e conserva em nota seu sentido ligado à raiz רחם.
- source_word: לֹא אוֹסִיף עוֹד אֲרַחֵם
  choice: não voltarei a ter compaixão
  rationale: A construção com יסף, עוֹד e רחם indica cessação; 'ter compaixão' preserva a ligação lexical com o nome Lo-Ruamá sem redundância artificial em português.
- source_word: בֵּית יִשְׂרָאֵל
  choice: a casa de Israel
  rationale: Preserva a expressão nacional e pactual explícita do hebraico.
- source_word: כִּי נָשֹׂא אֶשָּׂא לָהֶם
  choice: a ponto de lhes perdoar de todo
  rationale: Entende נשׂא no sentido de perdoar e o infinitivo absoluto como intensificação. A formulação fica sob o alcance da negação anterior, enquanto a leitura alternativa é indicada em nota.
theological_decisions:
- issue: Sentido do nome simbólico da filha
  choice: Transliterar como “Lo-Ruamá” no texto e explicar o significado em nota.
  alternative: Traduzir o nome como “Não Compadecida”, “Sem Compaixão” ou “Sem Misericórdia”.
  rationale: A transliteração trata o termo como nome pessoal, enquanto a nota conserva a força teológica do nome-sinal e sua relação com a retirada da compaixão.
- issue: Interpretação da difícil oração final כִּי נָשֹׂא אֶשָּׂא לָהֶם
  choice: Entendê-la como referência enfática ao perdão que já não será concedido.
  alternative: 'Entendê-la como declaração de juízo: “pois certamente os levarei embora”.'
  rationale: נשׂא pode relacionar-se ao perdão, como remoção da culpa, e essa leitura se encaixa no alcance da negação anterior. Como a sintaxe hebraica é difícil e permite outra interpretação antiga, a alternativa não deve ser ocultada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “E ele lhe disse” conserva a referência pronominal do hebraico sem explicitar indevidamente os participantes. A repetição pouco natural equivalente a “não mais novamente” foi vertida idiomaticamente por “não voltarei a”.
