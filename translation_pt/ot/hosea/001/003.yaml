  text: וַ/יֵּ֨לֶךְ֙ וַ/יִּקַּ֔ח אֶת גֹּ֖מֶר בַּת דִּבְלָ֑יִם וַ/תַּ֥הַר וַ/תֵּֽלֶד ל֖/וֹ בֵּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/003.yaml
  text: So he went and took Gomer daughter of Diblaim[a], and she conceived and bore him a son.
translation:
  language: pt
  text: Então ele foi e tomou Gômer, filha de Diblaim[a]. Ela engravidou e deu-lhe à luz um filho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “casou-se com Gômer” ou “tomou Gômer por mulher”. O hebraico diz literalmente “tomou”; o contexto indica o sentido matrimonial.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Então ele foi
  rationale: O wayyiqtol de הלך faz a narrativa avançar. “Então ele foi” comunica com naturalidade a sequência do hebraico.
- source_word: וַיִּקַּח
  choice: tomou
  rationale: לקח significa literalmente “tomou” e, neste contexto, tem sentido matrimonial. A opção preserva a formulação hebraica, enquanto a nota esclarece a alternativa explícita em português.
- source_word: אֶת גֹּמֶר
  choice: Gômer
  rationale: A marca de objeto direto não é traduzida. O nome próprio recebe acento gráfico para indicar a pronúncia natural em português.
- source_word: בַּת דִּבְלָיִם
  choice: filha de Diblaim
  rationale: בת seguido de nome próprio é uma expressão patronímica comum; “filha de Diblaim” é direta e natural.
- source_word: וַתַּהַר
  choice: Ela engravidou
  rationale: הרה significa conceber ou ficar grávida. “Engravidou” é atual, claro e idiomático.
- source_word: וַתֵּלֶד
  choice: deu um filho
  rationale: ילד, nesta forma, significa dar à luz. Em conjunto com לוֹ e בֵּן, “lhe deu um filho” expressa naturalmente a fórmula de nascimento.
- source_word: לוֹ
  choice: lhe
  rationale: A preposição ל com sufixo pronominal indica a relação com Oseias; “lhe” preserva esse sentido de modo conciso.
- source_word: בֵּן
  choice: um filho
  rationale: בן designa um filho do sexo masculino. O artigo indefinido é natural porque a criança é introduzida antes de receber nome no versículo seguinte.
theological_decisions:
- issue: Se o sentido matrimonial de וַיִּקַּח deve ser explicitado no texto
  choice: Manter “tomou” no texto principal.
  alternative: “casou-se com Gômer” ou “tomou Gômer por mulher”.
  rationale: Embora o contexto torne claro o sentido matrimonial, o verbo hebraico diz literalmente “tomou”. A tradução mantém a expressão do texto e deixa a explicitação contextual para a nota, sem acrescentar ao enunciado mais do que ele diz.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção “lhe deu um filho” evita o literário e potencialmente menos acessível “lhe deu à luz um filho”, sem perder a relação expressa por לוֹ.
