  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלָ֔י/ו קְרָ֥א שְׁמ֖/וֹ יִזְרְעֶ֑אל כִּי ע֣וֹד מְעַ֗ט וּ/פָ֨קַדְתִּ֜י אֶת דְּמֵ֤י יִזְרְעֶאל֙ עַל בֵּ֣ית יֵה֔וּא וְ/הִ֨שְׁבַּתִּ֔י מַמְלְכ֖וּת בֵּ֥ית יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/004.yaml
  text: Then Yahweh said to him[a], “Call his name Jezreel, for in a little while I will punish the house of Jehu for the bloodshed of Jezreel[b], and I will put an end to the kingdom of the house of Israel.”
translation:
  language: pt
  text: 'Então Yahweh lhe disse: “Dê-lhe o nome de Jezreel[b], pois, dentro de pouco tempo, castigarei a casa de Jeú pelo derramamento de sangue de Jezreel[a] e acabarei com o reino da casa de Israel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “pelo sangue de Jezreel” ou “pela culpa de sangue de Jezreel”. A expressão hebraica diz literalmente “pelos sangues de Jezreel”.
    reason: lexical_alternative
  - marker: b
    text: Jezreel é tanto o nome simbólico da criança quanto o nome do lugar associado aos atos violentos de Jeú.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: קְרָא שְׁמוֹ
  choice: Dê-lhe o nome de
  rationale: Expressão natural em português para o ato de nomear, preservando o sentido da construção hebraica.
- source_word: יִזְרְעֶאל
  choice: Jezreel
  rationale: Mantém a forma tradicional do nome próprio e a repetição intencional entre o nome simbólico da criança e o lugar.
- source_word: כִּי עוֹד מְעַט
  choice: pois, dentro de pouco tempo
  rationale: Comunica tanto a função explicativa de כִּי quanto a proximidade temporal indicada pela expressão.
- source_word: וּפָקַדְתִּי
  choice: castigarei
  rationale: No contexto de juízo, פקד tem sentido punitivo; a escolha é clara e corrente em português.
- source_word: דְּמֵי יִזְרְעֶאל
  choice: o derramamento de sangue em Jezreel
  rationale: O plural idiomático דְּמֵי, literalmente “sangues”, aponta para sangue derramado ou culpa de sangue. “Em Jezreel” expressa naturalmente a provável referência locativa sem eliminar as alternativas em nota.
- source_word: עַל בֵּית יֵהוּא
  choice: a casa de Jeú
  rationale: Com o verbo “castigar”, o alvo da punição é expresso naturalmente como objeto direto em português.
- source_word: וְהִשְׁבַּתִּי
  choice: acabarei com
  rationale: Traduz o hifil de שבת como ação de fazer cessar ou pôr fim a algo, em linguagem atual e solene.
- source_word: מַמְלְכוּת בֵּית יִשְׂרָאֵל
  choice: o reino da casa de Israel
  rationale: Preserva a cadeia nominal hebraica e sua possível ênfase dinástica ou nacional, embora “reino de Israel” fosse mais fluente.
theological_decisions:
- issue: Natureza do juízo contra Jeú
  choice: Apresentar o anúncio de que Deus castigará a casa de Jeú pelo sangue derramado associado a Jezreel, sem explicar por que esse ato é agora julgado.
  alternative: Interpretar explicitamente o massacre de Jeú como pecaminoso em si mesmo, ou dizer que apenas os pecados posteriores de sua dinastia são condenados.
  rationale: O versículo anuncia claramente o castigo, mas não resolve a tensão com a comissão divina narrada em 2Reis 9–10. A tradução não deve impor uma harmonização nem uma leitura polêmica.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A colocação dos marcadores foi ajustada para que [b] explique o nome Jezreel e [a] acompanhe a expressão ambígua sobre o derramamento de sangue.
