  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אֶת בֵּ֤ית יְהוּדָה֙ אֲרַחֵ֔ם וְ/הֽוֹשַׁעְתִּ֖י/ם בַּ/יהוָ֣ה אֱלֹֽהֵי/הֶ֑ם וְ/לֹ֣א אֽוֹשִׁיעֵ֗/ם בְּ/קֶ֤שֶׁת וּ/בְ/חֶ֨רֶב֙ וּ/בְ/מִלְחָמָ֔ה בְּ/סוּסִ֖ים וּ/בְ/פָרָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/007.yaml
  text: But I will have compassion on the house of Judah[a], and I will save them by Yahweh their God; I will not save them by bow, or by sword, or by war, by horses, or by horsemen.
translation:
  language: pt
  text: Mas terei compaixão da casa de Judá e os salvarei por Yahweh, o Deus deles[a]. Não os salvarei por meio de arco, espada ou guerra, nem por meio de cavalos ou cavaleiros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «por meio de Yahweh, o Deus deles». A preposição hebraica pode indicar meio ou agência. O texto principal usa «por» porque a frase seguinte contrapõe Yahweh aos meios militares de livramento.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אֶת
  choice: Mas
  rationale: A conjunção introduz contraste com o juízo anunciado contra Israel no versículo anterior; em português, «Mas» explicita naturalmente essa força adversativa.
- source_word: בֵּית יְהוּדָה
  choice: a casa de Judá
  rationale: Preserva a expressão nacional e pactual do hebraico e o registro profético.
- source_word: אֲרַחֵם
  choice: terei compaixão
  rationale: Comunica a dimensão afetiva de רחם em português atual e digno, sem restringi-la apenas à clemência judicial.
- source_word: וְהוֹשַׁעְתִּים
  choice: e os salvarei
  rationale: O hifil de ישׁע significa salvar ou livrar; «salvarei» conserva a amplitude do termo e permite repetir o mesmo verbo na oração seguinte.
- source_word: בַּיהוָה אֱלֹהֵיהֶם
  choice: por meio de Yahweh, o Deus deles
  rationale: A preposição ב é mais naturalmente instrumental no contexto, em contraste com os meios militares depois negados. «Por meio de» evita a possível leitura portuguesa de autoria pessoal sugerida por «por Yahweh», sem eliminar a ambiguidade do hebraico, registrada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: וְלֹא אוֹשִׁיעֵם
  choice: Não os salvarei
  rationale: Repete «salvar», como no hebraico, reforçando o contraste entre a ação divina e os recursos militares.
- source_word: בְּקֶשֶׁת וּבְחֶרֶב וּבְמִלְחָמָה
  choice: por meio de arco, espada ou guerra
  rationale: Mantém a lista cumulativa de armas e ação militar, usando elipse natural em português sem perder os elementos do original.
- source_word: בְּסוּסִים וּבְפָרָשִׁים
  choice: nem por meio de cavalos ou cavaleiros
  rationale: Preserva as imagens concretas dos recursos militares e distingue os animais dos combatentes montados.
theological_decisions:
- issue: Forma portuguesa do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o tetragrama; «Yahweh» preserva o nome pessoal e evita substituí-lo por um título.
- issue: Sentido de בַּיהוָה אֱלֹהֵיהֶם
  choice: 'instrumental: «por meio de Yahweh, o Deus deles»'
  alternative: 'agência: «por Yahweh, o Deus deles»; relacional/locativo: «em Yahweh, o Deus deles»'
  rationale: A sequência contrasta Yahweh com arco, espada, guerra, cavalos e cavaleiros, favorecendo o sentido de meio ou agência. A nota preserva a amplitude real da preposição hebraica.
- issue: Formulação em terceira pessoa de Yahweh como agente da fala divina
  choice: preservar «eu os salvarei por meio de Yahweh»
  alternative: harmonizar para «eu, Yahweh, o Deus deles, os salvarei»
  rationale: A construção marcante do original deve permanecer, sem ser harmonizada nem explicada no corpo do texto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno e profético. A repetição de «salvarei» e a expressão «casa de Judá» foram mantidas por sua função retórica; a coordenação da lista militar foi suavizada apenas o necessário para soar natural em português.
