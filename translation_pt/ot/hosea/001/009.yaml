  text: And he said[a], “Call his name Not-My-People, for you are not my people, and I am not yours.”
translation:
  language: pt
  text: 'E ele disse: “Dê-lhe o nome de Não-Meu-Povo, pois vocês não são meu povo, e eu não serei para vocês[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e eu não serei de vocês”. Muitos entendem a frase no sentido da aliança: “e eu não serei o Deus de vocês”.'
    reason: Registra traduções possíveis da oração hebraica elíptica sem inserir no texto principal palavras que não aparecem expressamente no original.
lexical_decisions:
- source_word: קְרָא שְׁמוֹ
  choice: Dê ao menino o nome de
  rationale: Expressa em português natural a fórmula hebraica de nomeação, literalmente “chame o nome dele”, e deixa claro que se trata do nome dado à criança.
- source_word: לֹא עַמִּי
  choice: Não-Meu-Povo
  rationale: Traduz o significado do nome simbólico em vez de apenas transliterá-lo; os hífens indicam que a expressão funciona como nome próprio e preservam sua ligação imediata com a explicação seguinte.
- source_word: כִּי
  choice: pois
  rationale: Mantém o valor causal da conjunção e introduz com naturalidade a razão do nome simbólico.
- source_word: אַתֶּם לֹא עַמִּי
  choice: vocês não são meu povo
  rationale: Reproduz diretamente a reversão da fórmula de aliança. “Vocês” oferece ampla legibilidade no português moderno e distingue o plural do singular.
- source_word: וְאָנֹכִי לֹא אֶהְיֶה לָכֶם
  choice: e eu não serei para vocês
  rationale: Conserva o futuro de אֶהְיֶה e a construção elíptica com לָכֶם, sem acrescentar “Deus” nem transformar silenciosamente a frase em uma declaração de posse. A formulação deliberadamente incomum preserva a tensão do hebraico.
theological_decisions:
- issue: Reversão da fórmula de aliança na oração final
  choice: e eu não serei para vocês
  alternative: e eu não serei de vocês; e eu não serei o Deus de vocês
  rationale: O hebraico alude à fórmula da aliança, mas não traz explicitamente “Deus” nem um pronome possessivo. O texto principal mantém a elipse e o valor futuro; a nota registra duas maneiras comuns de explicitar seu sentido.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. O nome simbólico foi traduzido e hifenizado. A oração final conserva de propósito a concisão e a estranheza do hebraico para não eliminar sua ambiguidade de aliança.
