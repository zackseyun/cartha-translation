source:
  edition: WLC
  text: תְּחִלַּ֥ת דִּבֶּר יְהוָ֖ה בְּ/הוֹשֵׁ֑עַ וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל הוֹשֵׁ֗עַ לֵ֣ךְ קַח לְ/ךָ֞ אֵ֤שֶׁת זְנוּנִים֙ וְ/יַלְדֵ֣י זְנוּנִ֔ים כִּֽי זָנֹ֤ה תִזְנֶה֙ הָ/אָ֔רֶץ מֵֽ/אַחֲרֵ֖י יְהוָֽה־פ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/002.yaml
  text: The beginning of the word of Yahweh through Hosea[a]. And Yahweh said to Hosea, “Go, take for yourself a wife of whoredom and children of whoredom[c][b], for the land utterly commits whoredom by turning away from Yahweh.”
translation:
  language: pt
  text: 'O início da palavra de Yahweh por meio de Oseias.[a] Yahweh disse a Oseias: “Vá, tome para si uma mulher de prostituição e filhos de prostituição[b], pois a terra se entrega completamente à prostituição, afastando-se de Yahweh”.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quando Yahweh começou a falar por meio de Oseias”. A abertura hebraica pode ser entendida como um título introdutório ou como uma oração temporal.'
    reason: alternative_reading
  - marker: b
    text: Também se pode traduzir “uma mulher promíscua e filhos de promiscuidade”. O termo hebraico pode indicar imoralidade sexual em sentido amplo ou, mais especificamente, prostituição.
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “pois, prostituindo-se, a terra se prostitui, deixando de seguir Yahweh”. A repetição verbal hebraica intensifica a denúncia de extrema infidelidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחִלַּת דִּבֶּר יְהוָה בְּהוֹשֵׁעַ
  choice: O início da palavra de Yahweh por meio de Oseias
  rationale: Preserva a possível função de incipit de תְּחִלַּת e entende בְּהוֹשֵׁעַ em sentido instrumental, distinguindo-o de אֶל הוֹשֵׁעַ na oração seguinte. A ambiguidade temporal é registrada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: לֵךְ קַח לְךָ
  choice: Vá, tome para si
  rationale: Mantém os dois imperativos e representa explicitamente לְךָ, sem converter interpretativamente קַח em “case-se”.
- source_word: אֵשֶׁת זְנוּנִים
  choice: uma mulher de prostituição
  rationale: Conserva a formulação áspera e metafórica do hebraico. “Prostituição” comunica a dimensão sexual sem restringir necessariamente a expressão ao comércio sexual; outras possibilidades são indicadas em nota.
- source_word: יַלְדֵי זְנוּנִים
  choice: filhos de prostituição
  rationale: Mantém o paralelismo lexical com a expressão anterior e não define além do texto a relação exata dos filhos com a prostituição.
- source_word: כִּי זָנֹה תִזְנֶה
  choice: pois a terra se entrega completamente à prostituição
  rationale: Expressa em português corrente a intensificação produzida pelo infinitivo absoluto seguido do verbo finito, preservando a personificação da terra.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Preserva a amplitude do termo, que pode abranger tanto o território de Israel quanto seus habitantes no contexto profético.
- source_word: מֵאַחֲרֵי יְהוָה
  choice: afastando-se de Yahweh
  rationale: Verte de modo natural o afastamento implícito na expressão literalmente relacionada a deixar de seguir Yahweh.
theological_decisions:
- issue: Força da imagem sexual aplicada à infidelidade da terra
  choice: Preservar a linguagem explícita de “prostituição”
  alternative: Suavizar como “promiscuidade” ou especificar como “adultério”
  rationale: A imagem deliberadamente chocante integra a denúncia profética da infidelidade a Yahweh. “Adultério” estreitaria o campo semântico, enquanto “promiscuidade” reduziria sua força.
- issue: Sentido de בְּהוֹשֵׁעַ na abertura
  choice: por meio de Oseias
  alternative: a Oseias ou com Oseias
  rationale: A oração seguinte emprega אֶל הוֹשֵׁעַ para a fala dirigida a Oseias; por isso, o valor instrumental na abertura é contextualmente preferível, sem eliminar em nota a ambiguidade da construção completa.
- issue: Identidade e condição da mulher e dos filhos
  choice: Manter as expressões genitivas sem explicar se descrevem origem, conduta ou associação
  alternative: uma prostituta e filhos nascidos da prostituição
  rationale: O hebraico é mais aberto do que essa paráfrase. A tradução evita determinar se a descrição é retrospectiva, prospectiva ou simbólica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estranheza controlada de “mulher de prostituição” e “filhos de prostituição” preserva a formulação profética e sua ambiguidade, enquanto a segunda ocorrência é vertida de forma mais natural para comunicar a intensificação hebraica.
