id: HOS.1.1
reference: Hosea 1:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: דְּבַר יְהוָ֣ה אֲשֶׁ֣ר הָיָ֗ה אֶל הוֹשֵׁ֨עַ֙ בֶּן בְּאֵרִ֔י בִּ/ימֵ֨י עֻזִּיָּ֥ה יוֹתָ֛ם אָחָ֥ז יְחִזְקִיָּ֖ה מַלְכֵ֣י יְהוּדָ֑ה וּ/בִ/ימֵ֛י יָרָבְעָ֥ם בֶּן יוֹאָ֖שׁ מֶ֥לֶךְ יִשְׂרָאֵֽל־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/001.yaml
  text: The word of Yahweh that came to Hosea son of Beeri in the days of Uzziah[a], Jotham, Ahaz, and Hezekiah, kings of Judah, and in the days of Jeroboam son of Joash, king of Israel.
translation:
  language: pt
  text: A palavra de Yahweh[a] que veio a Oseias, filho de Beeri, nos dias de Uzias, Jotão, Acaz e Ezequias, reis de Judá, e nos dias de Jeroboão, filho de Joás, rei de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «YHWH». Tradicionalmente traduzido por «SENHOR»; também transliterado «Javé».'
    reason: Identifica o Tetragrama e informa as principais formas de representação em português.
lexical_decisions:
- source_word: דְּבַר יְהוָה
  choice: A palavra de Yahweh
  rationale: Preserva a fórmula profética de revelação, «palavra de YHWH», sem ampliar interpretativamente para «mensagem». O artigo definido é natural em português porque o nome divino torna definida a construção hebraica.
- source_word: אֲשֶׁר הָיָה אֶל
  choice: que veio a
  rationale: Na fórmula introdutória profética, a expressão indica que a palavra divina foi comunicada ao profeta; «veio a» mantém a imagem hebraica e soa natural em português.
- source_word: הוֹשֵׁעַ בֶּן בְּאֵרִי
  choice: Oseias, filho de Beeri
  rationale: Emprega as formas portuguesas usuais dos nomes e reproduz diretamente o patronímico.
- source_word: בִּימֵי
  choice: nos dias de
  rationale: Mantém o idioma temporal hebraico e o tom solene da inscrição, sem converter explicitamente o período em «reinados».
- source_word: עֻזִּיָּה יוֹתָם אָחָז יְחִזְקִיָּה
  choice: Uzias, Jotão, Acaz e Ezequias
  rationale: Usa as formas portuguesas bíblicas amplamente reconhecidas.
- source_word: מַלְכֵי יְהוּדָה
  choice: reis de Judá
  rationale: Reproduz a aposição que identifica os quatro nomes anteriores.
- source_word: וּבִימֵי יָרָבְעָם בֶּן יוֹאָשׁ
  choice: e nos dias de Jeroboão, filho de Joás
  rationale: Conserva a repetição estrutural hebraica e apresenta o patronímico com pontuação natural em português.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: rei de Israel
  rationale: Mantém a aposição singular que identifica Jeroboão.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto hebraico traz diretamente o Tetragrama YHWH. A transliteração «Yahweh» preserva o caráter de nome próprio, enquanto a nota registra a substituição tradicional por um título e a forma portuguesa alternativa.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima da inscrição profética hebraica. Os nomes próprios seguem formas bíblicas correntes em português; a repetição «nos dias de» foi preservada para refletir a estrutura do original.
