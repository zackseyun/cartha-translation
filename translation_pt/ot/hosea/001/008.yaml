  text: After she had weaned Lo-ruhamah[a], she conceived and gave birth to a son.
translation:
  language: pt
  text: Depois de desmamar Lo-Ruama[a], ela engravidou e deu à luz um filho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lo-Ruama significa “Não recebeu misericórdia” ou “Não foi alvo de compaixão”. O significado do nome é importante no contexto próximo, embora o nome seja transliterado no texto principal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגְמֹל
  choice: Depois de desmamar
  rationale: O qal de גמל significa “desmamar” neste contexto. A construção temporal em português expressa com naturalidade que isso ocorreu antes da gravidez e do parto seguintes.
- source_word: אֶת
  choice: '[marcador de objeto direto, não traduzido]'
  rationale: Marca o objeto direto definido em hebraico e não requer uma palavra correspondente em português.
- source_word: לֹא רֻחָמָה
  choice: Lo-Ruama
  rationale: É um nome pessoal, portanto foi transliterado no texto principal. O hífen preserva a forma composta, e “Ruama” representa de modo natural a pronúncia hebraica em português.
- source_word: וַתַּהַר
  choice: ela engravidou
  rationale: Tradução clara e corrente de הרה, apropriada à fórmula narrativa de nascimento.
- source_word: וַתֵּלֶד
  choice: deu à luz
  rationale: Expressão moderna e natural em português para ילד neste contexto.
- source_word: בֵּן
  choice: um filho
  rationale: O substantivo significa “filho”; o artigo indefinido é natural ao introduzir outra criança na narrativa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sequência narrativa natural. O nome hebraico foi transliterado no texto e explicado em nota.
