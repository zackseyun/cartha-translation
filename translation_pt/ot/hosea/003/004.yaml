source:
  edition: WLC
  text: כִּ֣י יָמִ֣ים רַבִּ֗ים יֵֽשְׁבוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֵ֥ין מֶ֨לֶךְ֙ וְ/אֵ֣ין שָׂ֔ר וְ/אֵ֥ין זֶ֖בַח וְ/אֵ֣ין מַצֵּבָ֑ה וְ/אֵ֥ין אֵפ֖וֹד וּ/תְרָפִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/003/004.yaml
  text: For many days the sons of Israel will dwell without king or prince[a], without sacrifice or pillar[c][b], and without ephod or household idols.
translation:
  language: pt
  text: Pois durante muitos dias os filhos de Israel permanecerão sem rei, sem príncipe, sem sacrifício, sem coluna sagrada[a], sem éfode[b] e sem ídolos domésticos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pedra erguida”; o termo hebraico designa um monumento de pedra colocado em pé com função cultual.
    reason: lexical_alternative
  - marker: b
    text: “Éfode” é um termo cultual hebraico que muitas vezes se refere a uma veste sacerdotal ou a um objeto ritual associado.
    reason: cultural_note
  - marker: c
    text: Ou “terafins”; isto é, objetos de culto ou ídolos domésticos.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação do sinal encenado no contexto; conserva a força explicativa e preditiva sem torná-la enfática demais.
- source_word: יָמִים רַבִּים
  choice: durante muitos dias
  rationale: Preserva o idioma hebraico para um período longo, mas indeterminado, em formulação natural em português.
- source_word: יֵשְׁבוּ
  choice: permanecerão
  rationale: ישׁב pode significar sentar-se, habitar ou permanecer. Aqui descreve a continuidade de uma condição ao longo do tempo; “permanecerão” é natural e evita sugerir uma ação literal de sentar.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Reproduz de perto a expressão hebraica e sua referência coletiva tradicional, mantendo boa inteligibilidade em português.
- source_word: אֵין מֶלֶךְ
  choice: sem rei
  rationale: A preposição “sem” transmite de modo conciso a privação expressa por אֵין.
- source_word: שָׂר
  choice: príncipe
  rationale: Designa um governante ou alto oficial; “príncipe” preserva a conhecida combinação político-régia “rei e príncipe” sem ampliar o sentido para qualquer líder.
- source_word: זֶבַח
  choice: sacrifício
  rationale: É o equivalente corrente para uma oferta sacrificial, especialmente um animal abatido em rito.
- source_word: מַצֵּבָה
  choice: coluna sagrada
  rationale: Refere-se a uma pedra erguida com função cultual. “Coluna sagrada” torna explícito o caráter religioso do objeto sem decidir se seu uso, neste contexto, é legítimo ou ilícito.
- source_word: אֵפוֹד
  choice: éfode
  rationale: Mantém o termo técnico hebraico aportuguesado, pois ele pode designar uma veste sacerdotal ou um objeto ritual associado, e nenhum equivalente único cobre todas as ocorrências.
- source_word: תְרָפִים
  choice: ídolos domésticos
  rationale: Comunica de forma acessível a natureza cultual doméstica dos terafins, evitando a opacidade de uma simples transliteração no texto principal.
theological_decisions:
- issue: Se a lista reúne instituições cultuais legítimas e ilegítimas
  choice: Traduzir cada elemento diretamente e preservar a justaposição entre sacrifício, coluna sagrada, éfode e ídolos domésticos.
  alternative: Interpretar todos os elementos como formas exclusivamente legítimas ou exclusivamente ilegítimas de culto.
  rationale: O hebraico reúne objetos e práticas que, em outros contextos, podem estar ligados tanto ao culto aprovado quanto ao condenado. A tradução não deve harmonizar nem resolver essa tensão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A repetição de “sem” conserva a cadência de privação do hebraico; “e” reproduz a coordenação da lista. Os marcadores seguem a ordem em que aparecem no texto.
