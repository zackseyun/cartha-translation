  terminology: “Éfode” é o termo técnico aportuguesado adequado, com nota explicativa. “Ídolos domésticos” comunica bem o provável sentido de terafins, e a nota preserva a alternativa transliterada. “Coluna sagrada” é aceitável para uma pedra/coluna cultual; a nota especifica o referente sem lhe atribuir legitimidade ou ilegitimidade.
