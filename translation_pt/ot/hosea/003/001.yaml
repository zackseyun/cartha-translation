source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י ע֚וֹד לֵ֣ךְ אֱֽהַב אִשָּׁ֔ה אֲהֻ֥בַת רֵ֖עַ וּ/מְנָאָ֑פֶת כְּ/אַהֲבַ֤ת יְהוָה֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/הֵ֗ם פֹּנִים֙ אֶל אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/אֹהֲבֵ֖י אֲשִׁישֵׁ֥י עֲנָבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/003/001.yaml
  text: And Yahweh said to me again[a], “Go, love a woman loved by another and committing adultery, just as Yahweh loves the children of Israel[b], though they turn to other gods and love raisin cakes.”
translation:
  language: pt
  text: 'E Yahweh me disse outra vez: “Vá, ame uma mulher amada por outro[a] e que comete adultério, assim como Yahweh ama os filhos de Israel, embora eles se voltem para outros deuses e amem bolos de passas[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mulher” também pode ser traduzido por “esposa”; “outro” traduz um termo que pode significar “companheiro”, “amigo” ou, neste contexto, possivelmente “marido”.
    reason: lexical_alternative
  - marker: b
    text: Os “bolos de passas” eram feitos de passas prensadas e talvez estivessem ligados a celebrações ou práticas idólatras.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, distinguindo-o de títulos como “Senhor” e preservando sua ocorrência explícita no hebraico.
- source_word: עוֹד
  choice: outra vez
  rationale: No contexto narrativo, indica que Yahweh torna a falar e dá uma nova ordem ao profeta.
- source_word: לֵךְ אֱהַב
  choice: Vá, ame
  rationale: Mantém distintos os dois imperativos e preserva a repetição do verbo “amar” na comparação com o amor de Yahweh.
- source_word: אִשָּׁה
  choice: uma mulher
  rationale: O substantivo pode significar “mulher” ou “esposa”. A formulação genérica evita identificar além do que o versículo declara.
- source_word: אֲהֻבַת רֵעַ
  choice: amada por outro
  rationale: Preserva a indefinição de רֵעַ, que pode designar companheiro, amigo, associado ou, neste contexto, possivelmente marido, sem especificar indevidamente a relação.
- source_word: וּמְנָאָפֶת
  choice: e que comete adultério
  rationale: Expressa de modo natural o particípio feminino, que descreve conduta adúltera em curso ou característica.
- source_word: כְּאַהֲבַת יְהוָה אֶת בְּנֵי יִשְׂרָאֵל
  choice: assim como Yahweh ama os filhos de Israel
  rationale: Torna clara a comparação e conserva a repetição lexical de “amar”.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém de perto a expressão nacional e pactual hebraica, ainda compreensível em português bíblico atual.
- source_word: וְהֵם פֹּנִים אֶל אֱלֹהִים אֲחֵרִים
  choice: embora eles se voltem para outros deuses
  rationale: O presente habitual traduz o particípio, e “embora” explicita a forte relação concessiva entre o amor de Yahweh e a infidelidade de Israel.
- source_word: וְאֹהֲבֵי אֲשִׁישֵׁי עֲנָבִים
  choice: e amem bolos de passas
  rationale: Preserva a repetição de “amar” e traduz a expressão concreta de modo natural em português.
theological_decisions:
- issue: Identidade da mulher no sinal profético de Oseias
  choice: Traduzir genericamente como “uma mulher”.
  alternative: Traduzir “sua esposa” ou identificá-la como Gômer.
  rationale: O versículo não nomeia Gômer nem contém pronome possessivo. A tradução mantém a ambiguidade sobre se se trata de Gômer ou de outra mulher.
- issue: Identidade daquele que ama a mulher
  choice: Traduzir “amada por outro”.
  alternative: Traduzir “amada pelo marido”, “amada por um companheiro” ou “que tem um amante”.
  rationale: רֵעַ não identifica de maneira inequívoca marido ou amante. A escolha evita resolver uma questão interpretativa que o hebraico deixa aberta.
- issue: Relação entre o amor de Yahweh e a apostasia de Israel
  choice: Usar a construção concessiva “embora”.
  alternative: 'Manter apenas a coordenação: “e eles se voltam”.'
  rationale: A concessão comunica naturalmente o contraste discursivo implícito, sem alterar o conteúdo teológico.
translation_notes:
  register: 'Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Mantém “Yahweh” como nome divino, a expressão formal “filhos de Israel” e a repetição temática do verbo “amar”. Os marcadores foram posicionados após as expressões a que se referem: [a] após a descrição ambígua da mulher e [b] após “bolos de passas”.'
