base_translation:
  language: en
  yaml_path: translation/ot/hosea/003/005.yaml
  text: Afterward the children of Israel will return and seek Yahweh their God and David their king[c][b][a], and they will come in fear to Yahweh and to his goodness in the latter days.
translation:
  language: pt
  text: Depois disso, os filhos de Israel voltarão e buscarão Yahweh, seu Deus, e Davi, seu rei.[a] Eles se aproximarão de Yahweh e da sua bondade, tremendo,[b] nos últimos dias.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Davi, seu rei” pode referir-se a Davi como figura régia representativa ou a um futuro governante da linhagem de Davi; o hebraico não desenvolve a expressão.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “temerão Yahweh e sua bondade”. O verbo hebraico pode significar “temer” ou, nesta construção, aproximar-se tremendo.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “nos dias vindouros” ou “no fim dos dias”. A expressão hebraica é uma fórmula profética para um tempo futuro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר
  choice: Depois disso
  rationale: Expressa naturalmente a sequência temporal em relação ao período descrito nos versículos anteriores.
- source_word: יָשֻׁבוּ
  choice: voltarão
  rationale: Preserva tanto o sentido básico de retornar como sua possível dimensão de restauração da aliança, sem explicitar além do texto a ideia de arrependimento.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém o conhecido idioma familiar e pactual hebraico em português claro.
- source_word: וּבִקְשׁוּ
  choice: e buscarão
  rationale: Traduz diretamente a procura intencional ou zelosa indicada pelo verbo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיהֶם
  choice: seu Deus
  rationale: Reproduz a relação expressa pelo sufixo pronominal; em português, o singular concorda naturalmente com o sujeito coletivo.
- source_word: וְאֵת דָּוִד מַלְכָּם
  choice: e Davi, seu rei
  rationale: Mantém Davi como segundo objeto do verbo buscar e conserva a formulação profética sem definir a identidade exata do referente.
- source_word: וּפָחֲדוּ אֶל
  choice: Eles se aproximarão, tremendo, de
  rationale: A combinação do verbo de temor ou tremor com a preposição direcional favorece a ideia de aproximação reverente, sem apagar o elemento de temor.
- source_word: וְאֶל טוּבוֹ
  choice: e da sua bondade
  rationale: Conserva a amplitude de טוּב, que pode abranger tanto a bondade divina como seus benefícios e sua generosidade.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: nos últimos dias
  rationale: É uma formulação profética reconhecível e formalmente próxima do hebraico, sem impor um esquema escatológico específico.
theological_decisions:
- issue: Identidade de “Davi, seu rei”
  choice: Manter “Davi, seu rei” sem expansão interpretativa.
  alternative: Explicitar como o Davi histórico restaurado ou como um futuro rei davídico/messiânico.
  rationale: O hebraico nomeia Davi diretamente, mas não esclarece aqui se se trata do próprio Davi como figura régia representativa ou de um governante davídico futuro.
- issue: Sentido de וּפָחֲדוּ אֶל יְהוָה וְאֶל טוּבוֹ
  choice: Expressar uma aproximação em tremor reverente.
  alternative: “Temerão Yahweh e sua bondade.”
  rationale: A preposição אֶל sugere direção ou movimento para Yahweh e sua bondade; a tradução conserva simultaneamente esse movimento e o temor reverente.
- issue: Alcance de “últimos dias”
  choice: Preservar a expressão profética sem explicação no texto principal.
  alternative: “dias vindouros” ou uma identificação explícita com um período escatológico definido.
  rationale: A expressão pode apontar de modo amplo para um tempo futuro ou adquirir peso escatológico; o versículo não determina sozinho um cronograma específico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das notas segue sua posição no texto; a construção “se aproximarão, tremendo” preserva a tensão entre movimento em direção a Deus e temor reverente.
