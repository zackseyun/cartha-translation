  yaml_path: translation/ot/hosea/003/003.yaml
  text: And I said to her, “You must remain for me many days; you must not prostitute yourself, and you must not belong to a man; and I also will be toward you.”
translation:
  language: pt
  text: 'E eu lhe disse: “Você permanecerá para mim por muitos dias; não se prostituirá nem pertencerá a homem algum; e eu também serei para você.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico termina de modo elíptico, literalmente: “e também eu para você”. A frase pode expressar reciprocidade, inclusive a dedicação exclusiva de Oseias a ela.'
    reason: Esclarece a construção incompleta do original e sua possível força sem resolver definitivamente a ambiguidade no texto principal.
lexical_decisions:
- source_word: תֵּשְׁבִי לִי
  choice: permanecerá reservada para mim
  rationale: O verbo ישׁב pode significar ficar ou permanecer; com לִי, a expressão indica que ela deve permanecer para ele. “Reservada para mim” comunica naturalmente em português a exclusividade exigida pelo contexto, sem pressupor convivência imediata.
- source_word: לֹא תִזְנִי
  choice: não se prostituirá
  rationale: O verbo זנה designa prostituição ou conduta sexual infiel. A tradução direta preserva tanto o sentido concreto no casamento simbólico quanto sua força no contexto profético.
- source_word: וְלֹא תִהְיִי לְאִישׁ
  choice: nem pertencerá a homem algum
  rationale: A construção literal é “nem será para/de um homem”. “Pertencerá a homem algum” preserva a ideia de vínculo exclusivo e acompanha a formulação auditada, sem inserir “outro”, palavra ausente do hebraico.
- source_word: וְגַם אֲנִי אֵלָיִךְ
  choice: e eu também serei para você
  rationale: A frase hebraica é elíptica, literalmente próxima de “e também eu para você”. A formulação portuguesa mantém a reciprocidade e a abertura sem completar silenciosamente o sentido como “não me unirei a outra” ou “viverei com você”.
theological_decisions:
- issue: Sentido da declaração final elíptica
  choice: 'Manter a formulação aberta: “eu também serei para você”'
  alternative: “eu também ficarei reservado para você” ou “eu também agirei assim com você”
  rationale: As alternativas explicitam abstinência ou reciprocidade conjugal, ideias plausíveis no contexto, mas não verbalizadas no texto hebraico. A opção adotada preserva a tensão e evita transformar uma elipse em afirmação doutrinariamente mais específica.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para ampla legibilidade brasileira. A expressão final é deliberadamente incomum, mas inteligível, a fim de refletir a elipse do hebraico; a nota oferece o esclarecimento necessário.
