base_translation:
  language: en
  yaml_path: translation/ot/hosea/003/002.yaml
  text: So I bought her for myself for fifteen shekels of silver and a homer and a lethech of barley[a][b].
translation:
  language: pt
  text: Assim, eu a comprei para mim por quinze siclos de prata, um ômer de cevada e um leteque de cevada[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O leteque era provavelmente uma medida de capacidade para produtos secos equivalente à metade de um ômer.
    reason: cultural_note
  - marker: b
    text: Ou “por quinze peças de prata”. Em hebraico, literalmente, “por quinze prata”; a unidade monetária fica subentendida pelo contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶכְּרֶהָ
  choice: eu a comprei
  rationale: Neste contexto, o verbo כרה indica adquiri-la mediante pagamento. “Comprei” é natural, específico e combina com o preço apresentado em seguida.
- source_word: לִּי
  choice: para mim
  rationale: Preserva o dativo de interesse pessoal sem ampliar indevidamente a reflexividade; em português, “comprei para mim” expressa com naturalidade a ideia.
- source_word: בַּחֲמִשָּׁה עָשָׂר כָּסֶף
  choice: por quinze siclos de prata
  rationale: O hebraico diz literalmente “por quinze prata”, deixando a unidade monetária implícita. “Siclos de prata” explicita a unidade provável para o leitor moderno, enquanto a nota preserva a forma menos explícita do original.
- source_word: חֹמֶר
  choice: um ômer
  rationale: Translitera a antiga medida de secos, evitando uma conversão moderna imprecisa.
- source_word: שְׂעֹרִים
  choice: de cevada
  rationale: Tradução direta do cereal mencionado; pela construção hebraica, a expressão qualifica conjuntamente as duas medidas.
- source_word: לֵתֶךְ
  choice: um leteque
  rationale: Mantém por transliteração o nome da medida antiga; sua provável equivalência é explicada em nota.
theological_decisions: []
