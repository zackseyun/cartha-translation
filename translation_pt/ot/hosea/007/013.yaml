  text: א֤וֹי לָ/הֶם֙ כִּֽי נָדְד֣וּ מִמֶּ֔/נִּי שֹׁ֥ד לָ/הֶ֖ם כִּֽי פָ֣שְׁעוּ בִ֑/י וְ/אָנֹכִ֣י אֶפְדֵּ֔/ם וְ/הֵ֕מָּה דִּבְּר֥וּ עָלַ֖/י כְּזָבִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/013.yaml
  text: Woe to them[a], for they have wandered away from me! Destruction is theirs, for they have rebelled against me. Though I would redeem them, they speak lies against me.
translation:
  language: pt
  text: 'Ai deles, porque se afastaram de mim!


    A destruição os espera, porque se rebelaram contra mim!


    Embora eu quisesse resgatá-los[a], eles mentem contra mim.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “No entanto, eu os resgataria”; alguns entendem o verbo no passado: “Mas eu os resgatei”.'
    reason: Leituras alternativas possíveis para o imperfeito hebraico e para a relação de contraste com a oração seguinte.
lexical_decisions:
- source_word: א֤וֹי לָהֶם֙
  choice: Ai deles
  rationale: Preserva tanto o lamento quanto a ameaça próprios da exclamação profética, em formulação corrente e digna em português.
- source_word: נָדְד֣וּ מִמֶּ֔נִּי
  choice: se afastaram de mim
  rationale: נדד expressa o movimento para longe, podendo incluir errância ou fuga. “Afastaram-se” comunica claramente a ruptura relacional sem especificar mais intenção do que o hebraico.
- source_word: שֹׁ֥ד לָהֶ֖ם
  choice: a destruição os espera
  rationale: A frase nominal anuncia devastação destinada a eles. A formulação verbal é natural em português e mantém o caráter de juízo, sem tornar a expressão obscura ou artificial.
- source_word: פָ֣שְׁעוּ בִ֑י
  choice: se rebelaram contra mim
  rationale: פשע denota rebelião e quebra de lealdade, sentido mais forte e preciso do que uma referência genérica ao pecado.
- source_word: וְאָנֹכִ֣י אֶפְדֵּ֔ם
  choice: Embora eu queira resgatá-los
  rationale: O imperfeito pode expressar disposição ou intenção divina de resgatar. A construção concessiva torna natural o contraste com a conduta deles, sem eliminar outras possibilidades temporais.
- source_word: דִּבְּר֥וּ עָלַ֖י כְּזָבִֽים
  choice: eles dizem mentiras a meu respeito
  rationale: Comunica fala falsa dirigida contra Deus. “A meu respeito” é português natural e não força o sentido mais específico de calúnia.
theological_decisions:
- issue: Sentido de וְאָנֹכִי אֶפְדֵּם, a declaração divina de resgate
  choice: Embora eu queira resgatá-los
  alternative: 'No entanto, eu os resgataria; ou, com valor passado: Mas eu os resgatei'
  rationale: O imperfeito hebraico favorece uma leitura não passada e pode exprimir vontade ou intenção. A tradução mantém a tensão entre a disposição de Deus para resgatar e as mentiras do povo; a nota registra as demais leituras plausíveis.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O paralelismo profético foi conservado em três linhas, e o marcador da nota foi colocado junto à expressão verbal a que se refere.
