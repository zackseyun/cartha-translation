source:
  edition: WLC
  text: בְּ/רָעָתָ֖/ם יְשַׂמְּחוּ מֶ֑לֶךְ וּ/בְ/כַחֲשֵׁי/הֶ֖ם שָׂרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/003.yaml
  text: By their evil they make the king glad[a], and by their lies the princes.
translation:
  language: pt
  text: Com sua maldade, eles alegram o rei; com suas mentiras, os príncipes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com seus enganos, as autoridades”.'
    reason: Alternativas lexicais possíveis para כַחֲשֵׁיהֶם e שָׂרִים.
lexical_decisions:
- source_word: בְּרָעָתָם
  choice: Com sua maldade
  rationale: 'O בְּ tem valor instrumental: a maldade deles é o meio pelo qual alegram o rei. “Maldade” é natural, clara e preserva o substantivo coletivo singular.'
- source_word: יְשַׂמְּחוּ
  choice: eles alegram
  rationale: 'O piel de שׂמח tem força causativa: eles fazem alguém ficar alegre. “Alegram” expressa isso de modo direto e idiomático em português.'
- source_word: מֶלֶךְ
  choice: o rei
  rationale: Embora o hebraico não use artigo, o contexto aponta para o monarca de Israel; em português, o referente definido pede “o rei”.
- source_word: וּבְכַחֲשֵׁיהֶם
  choice: com suas mentiras
  rationale: כחשׁ pode indicar mentiras, falsidade ou engano. “Mentiras” é a opção mais direta e legível, e “com” mantém o paralelismo instrumental.
- source_word: שָׂרִים
  choice: os príncipes
  rationale: שׂרים designa líderes de alta posição. “Príncipes” preserva o ambiente político da corte e o paralelismo com “o rei”, embora “autoridades” também seja possível.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção paralela e concisa. O pronome possessivo singular em “sua maldade” representa naturalmente o coletivo hebraico, enquanto “suas mentiras” preserva o plural do original.
