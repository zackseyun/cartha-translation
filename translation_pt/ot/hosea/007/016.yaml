  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יָשׁ֣וּבוּ לֹ֣א עָ֗ל הָיוּ֙ כְּ/קֶ֣שֶׁת רְמִיָּ֔ה יִפְּל֥וּ בַ/חֶ֛רֶב שָׂרֵי/הֶ֖ם מִ/זַּ֣עַם לְשׁוֹנָ֑/ם ז֥וֹ לַעְגָּ֖/ם בְּ/אֶ֥רֶץ מִצְרָֽיִם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/016.yaml
  text: They turn[a], but not upward; they are like a deceitful bow. Their princes will fall by the sword because of the insolence of their tongue[b]. This will be their mockery in the land of Egypt.
translation:
  language: pt
  text: Eles se voltam[a], mas não para o alto; são como um arco traiçoeiro[b]. Seus príncipes cairão à espada por causa da fúria de sua língua. Isso será motivo de zombaria contra eles na terra do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mas não para o Altíssimo”. Essa leitura entende “para o alto” como referência elíptica a Deus, influenciada pela formulação do versículo anterior.'
    reason: alternative_reading
  - marker: b
    text: “Arco traiçoeiro” também pode ser entendido como um arco frouxo, enganoso ou defeituoso, isto é, um arco no qual não se pode confiar para acertar o alvo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשׁוּבוּ
  choice: Eles se voltam
  rationale: שׁוּב pode significar voltar-se ou retornar. Aqui descreve uma mudança de direção moral e política, e “se voltam” conserva esse sentido sem especificar um destino que o hebraico não declara.
- source_word: לֹא עָל
  choice: mas não para o alto
  rationale: A expressão hebraica é difícil e literalmente indica direção para cima. A tradução principal preserva essa formulação, enquanto a possível referência elíptica ao Altíssimo é registrada em nota.
- source_word: הָיוּ כְּקֶשֶׁת רְמִיָּה
  choice: são como um arco traiçoeiro
  rationale: Embora הָיוּ seja morfologicamente perfeito, a comparação tem valor presente ou resultativo. רְמִיָּה comunica engano, traição ou falta de confiabilidade; “arco traiçoeiro” mantém a força da imagem profética.
- source_word: יִפְּלוּ בַחֶרֶב
  choice: cairão à espada
  rationale: Expressão idiomática tradicional e natural para morrer pela espada, em batalha ou juízo.
- source_word: שָׂרֵיהֶם
  choice: seus príncipes
  rationale: שַׂר designa governantes, chefes ou altos oficiais. “Príncipes” preserva o registro político elevado do oráculo.
- source_word: מִזַּעַם לְשׁוֹנָם
  choice: por causa da fúria de sua língua
  rationale: זַעַם denota indignação, ira ou fúria. Ligado à língua, caracteriza uma fala violenta, provocadora ou arrogante; a formulação mantém de perto a imagem hebraica.
- source_word: זֹו לַעְגָּם
  choice: Isso será motivo de zombaria contra eles
  rationale: לַעַג indica zombaria ou escárnio. A formulação explicita naturalmente em português que o juízo sofrido por eles dará ocasião para serem ridicularizados, sem alterar o referente do demonstrativo.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: na terra do Egito
  rationale: Mantém a forma plena do hebraico e sua ressonância profética.
theological_decisions:
- issue: Interpretação de לֹא עָל
  choice: Traduzir no texto principal como “mas não para o alto”
  alternative: “mas não para o Altíssimo”
  rationale: O versículo não contém explicitamente o termo “Altíssimo”, embora o contexto anterior favoreça essa compreensão elíptica. A tradução principal conserva a expressão direcional e a nota preserva a alternativa teológica legítima.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção preserva as metáforas do hebraico, sua ambiguidade em לֹא עָל e o paralelismo conciso do oráculo profético.
