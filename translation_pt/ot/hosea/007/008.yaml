reference: Hosea 7:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֶפְרַ֕יִם בָּ/עַמִּ֖ים ה֣וּא יִתְבּוֹלָ֑ל אֶפְרַ֛יִם הָיָ֥ה עֻגָ֖ה בְּלִ֥י הֲפוּכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/008.yaml
  text: Ephraim mixes himself among the peoples[b][a]; Ephraim has become a cake not turned.
translation:
  language: pt
  text: Efraim se mistura entre os povos; Efraim tornou-se um pão que não foi virado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A imagem é de um pão que não foi virado durante o cozimento, ficando queimado de um lado e mal assado do outro.
    reason: cultural_note
lexical_decisions:
- source_word: יִתְבּוֹלָל
  choice: se mistura
  rationale: A forma reflexiva expressa a participação de Efraim em sua própria mistura com outros povos; a construção portuguesa é natural e preserva essa nuance.
- source_word: בָּעַמִּים
  choice: entre os povos
  rationale: Mantém o plural e o sentido amplo de grupos estrangeiros, sem impor a noção geopolítica moderna de Estados-nação.
- source_word: עֻגָה
  choice: pão
  rationale: O termo designa um pão redondo assado sobre pedras aquecidas ou brasas. Em português atual, “pão” comunica a imagem culinária com mais clareza do que “bolo”, que sugeriria um doce.
- source_word: בְּלִי הֲפוּכָה
  choice: que não foi virado
  rationale: Expressa de modo claro e conciso que o pão não foi virado durante o cozimento, sem acrescentar ao texto o resultado implícito.
- source_word: הָיָה
  choice: tornou-se
  rationale: 'Representa o estado resultante indicado no contexto profético: Efraim passou a ser como esse pão mal assado.'
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Preserva o nome usado no hebraico, que funciona contextualmente como designação do reino do norte.
theological_decisions:
- issue: Referente de “Efraim”
  choice: Manter “Efraim” como referente nomeado, representando implicitamente o reino do norte de Israel.
  alternative: Substituir por “Israel” ou “o reino do norte”.
  rationale: A substituição resolveria interpretativamente uma metonímia histórica que o texto-fonte mantém. A tradução preserva o nome e sua tensão contextual.
- issue: Sentido da metáfora do pão não virado
  choice: Manter a metáfora sem explicitar no corpo do versículo a condição desigual do pão.
  alternative: Traduzir interpretativamente como “queimado de um lado e cru do outro”.
  rationale: O hebraico afirma apenas que o pão não foi virado; o efeito culinário provável é esclarecido em nota, sem ser incorporado como se fosse texto explícito.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Se mistura” conserva a reflexividade sem soar artificial; “pão” evita a associação moderna de “bolo” com confeitaria. O marcador [a] aparece no texto principal.
