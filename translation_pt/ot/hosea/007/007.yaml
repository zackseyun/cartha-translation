id: HOS.7.7
reference: Hosea 7:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כֻּלָּ֤/ם יֵחַ֨מּוּ֙ כַּ/תַּנּ֔וּר וְ/אָכְל֖וּ אֶת שֹֽׁפְטֵי/הֶ֑ם כָּל מַלְכֵי/הֶ֣ם נָפָ֔לוּ אֵין קֹרֵ֥א בָ/הֶ֖ם אֵלָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/007.yaml
  text: All of them are hot like an oven[a], and they devour their judges; all their kings have fallen. None among them calls to me.
translation:
  language: pt
  text: Todos eles estão ardentes como um forno e devoram os seus juízes[a]; todos os seus reis caíram. Nenhum deles clama a mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os seus governantes”. A palavra hebraica pode designar autoridades governamentais em sentido mais amplo, não apenas autoridades judiciais.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: Todos eles
  rationale: Preserva a abrangência explícita da acusação e soa natural em português.
- source_word: יֵחַמּוּ
  choice: estão ardentes
  rationale: Mantém a ideia de calor intenso ou inflamação em ligação direta com a imagem do forno, sem especificar indevidamente luxúria, ira ou conspiração.
- source_word: כַּתַּנּוּר
  choice: como um forno
  rationale: Reproduz de modo direto e natural a comparação recorrente no contexto.
- source_word: וְאָכְלוּ
  choice: e devoram
  rationale: O presente vívido expressa ação característica ou repetida; “devoram” conserva a força destrutiva da metáfora hebraica.
- source_word: אֶת שֹׁפְטֵיהֶם
  choice: os seus juízes
  rationale: É a correspondência lexical mais direta, embora o termo também possa designar governantes em sentido mais amplo, possibilidade registrada em nota.
- source_word: כָּל מַלְכֵיהֶם
  choice: todos os seus reis
  rationale: Preserva a repetição da linguagem totalizante e o foco político do versículo.
- source_word: נָפָלוּ
  choice: caíram
  rationale: Expressa concisamente o resultado da instabilidade política e deixa em aberto se a queda ocorreu por morte, deposição ou ambas.
- source_word: אֵין קֹרֵא בָהֶם אֵלָי
  choice: Nenhum deles clama a mim
  rationale: Preserva a negação abrangente e o ato de recorrer a Deus, em linguagem natural e digna.
theological_decisions:
- issue: Se a imagem do forno deve ser explicitamente interpretada como luxúria, ira ou conspiração
  choice: Manter a metáfora sem identificar a paixão específica
  alternative: “Todos eles ardem de desejo como um forno” ou “Todos eles estão inflamados como um forno”
  rationale: O contexto associa a imagem a paixões intensas e tramas destrutivas, mas o versículo não nomeia uma delas; explicitar uma opção resolveria uma ambiguidade genuína do hebraico.
- issue: Se שֹׁפְטֵיהֶם deve ser entendido estritamente como autoridades judiciais ou amplamente como governantes
  choice: Usar “juízes” no texto e registrar “governantes” em nota
  alternative: “os seus governantes”
  rationale: “Juízes” segue mais diretamente o termo hebraico, enquanto a nota preserva seu possível alcance político mais amplo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva a concisão profética, a imagem do forno e a ambiguidade quanto à natureza da paixão e ao modo da queda dos reis.
