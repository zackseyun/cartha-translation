base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/006.yaml
  text: For they draw near with their hearts like an oven in their lying in wait[a]; all night their baker sleeps[b], but in the morning it burns like a flaming fire.
translation:
  language: pt
  text: Pois eles se aproximam com o coração semelhante a um forno enquanto ficam à espreita[a]. Durante toda a noite, o padeiro deles dorme[b]; pela manhã, arde como fogo em chamas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “durante a emboscada deles” ou “enquanto armam uma emboscada”. A expressão hebraica transmite a ideia de espreitar ou tramar um ataque.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o padeiro deles”. Na metáfora prolongada do forno, a expressão provavelmente representa quem alimenta ou atiça a trama acalorada.'
    reason: cultural_note
lexical_decisions:
- source_word: קֵרְבוּ
  choice: eles se aproximam
  rationale: O verbo descreve uma aproximação ou movimento rumo à ação. A formulação mantém a imagem verbal sem acrescentar um objeto que o hebraico não explicita.
- source_word: כַתַּנּוּר
  choice: semelhante a um forno
  rationale: Preserva a comparação explícita introduzida por כ e a metáfora recorrente do calor que se intensifica.
- source_word: לִבָּם
  choice: o coração
  rationale: Mantém o substantivo coletivo no singular, como no hebraico, com referência ao íntimo ou às disposições dos conspiradores.
- source_word: בְּאָרְבָּם
  choice: enquanto ficam à espreita
  rationale: Expressa naturalmente o sentido de ארב, que envolve espreitar, emboscar ou aguardar ocultamente o momento de atacar.
- source_word: יָשֵׁן
  choice: dorme
  rationale: Tradução verbal direta e natural do estado descrito pelo hebraico.
- source_word: אֹפֵהֶם
  choice: o padeiro deles
  rationale: Retém literalmente o personagem da metáfora do forno, sem identificar de modo indevido quem ele representa.
- source_word: בֹעֵר
  choice: arde
  rationale: Comunica a ação contínua e intensa do particípio hebraico, em harmonia com a imagem do fogo.
- source_word: כְאֵשׁ לֶהָבָה
  choice: como fogo em chamas
  rationale: Preserva a intensificação formada por 'fogo' e 'chama' em português corrente e expressivo.
theological_decisions:
- issue: Sujeito e agente na metáfora do forno
  choice: Manter o coração semelhante a um forno e conservar o referente de 'ele' sem identificação explícita
  alternative: Explicitar que o coração, o forno ou a trama é aquilo que arde pela manhã
  rationale: A sintaxe hebraica é condensada, e o pronome masculino singular pode retomar uma imagem anterior sem eliminar toda a ambiguidade. A tradução evita impor uma interpretação específica.
- issue: Identidade do “padeiro”
  choice: Conservar “o padeiro deles” como elemento figurado
  alternative: Interpretá-lo diretamente como o instigador ou líder da conspiração
  rationale: O contexto sugere alguém que alimenta ou atiça a trama, mas o texto mantém a figura metafórica e não identifica essa pessoa de forma inequívoca.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluente para leitores brasileiros e compreensão internacional. A metáfora do forno foi preservada, assim como a ambiguidade do referente que arde pela manhã.
