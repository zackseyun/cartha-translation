base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/005.yaml
  text: On the day of our king[a], the princes made themselves sick with the heat of wine[c][b]; he stretched out his hand with mockers.
translation:
  language: pt
  text: No dia do nosso rei[a], os príncipes adoeceram com o ardor do vinho[b]; ele estendeu a mão aos zombadores[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “No dia do rei que é nosso”. Alguns entendem a expressão como referência a uma festa real, mas “dia do nosso rei” corresponde mais diretamente ao hebraico.'
    reason: lexical_alternative
  - marker: b
    text: O “ardor do vinho” também pode ser entendido como “a queima causada pelo vinho” ou, com menor probabilidade, “o veneno do vinho”.
    reason: lexical_alternative
  - marker: c
    text: Isto é, ele se associou aos zombadores, estendendo-lhes a mão.
    reason: cultural_note
lexical_decisions:
- source_word: י֣וֹם מַלְכֵּ֔נוּ
  choice: No dia do nosso rei
  rationale: Reproduz de modo direto a construção hebraica “dia do nosso rei”. A ideia de uma festa real é possível pelo contexto, mas não está expressa no texto.
- source_word: הֶחֱל֥וּ
  choice: adoeceram
  rationale: O hifil de חלה aponta aqui para causar doença ou fraqueza; sem objeto expresso e no contexto de excesso de vinho, o português natural permite o valor reflexivo de que os príncipes fizeram a si mesmos adoecer.
- source_word: שָׂרִ֖ים
  choice: os príncipes
  rationale: Preserva o ambiente da corte e o sentido comum de שׂרים como príncipes, governantes ou altos oficiais.
- source_word: חֲמַ֣ת מִיָּ֑יִן
  choice: com o ardor do vinho
  rationale: “Ardor” conserva a imagem ambígua de calor ou queima associada ao vinho, sem transformá-la em veneno literal nem explicá-la apenas como embriaguez.
- source_word: מָשַׁ֥ךְ יָד֖וֹ
  choice: ele estendeu a mão
  rationale: Mantém a imagem concreta do hebraico. No contexto, o gesto provavelmente indica aproximação, acolhimento ou associação, esclarecidos em nota sem substituir a formulação figurada.
- source_word: אֶת לֹצְצִֽים
  choice: aos zombadores
  rationale: לֹצְצִים designa zombadores ou escarnecedores. Depois de “estendeu a mão”, a preposição portuguesa “aos” expressa naturalmente a direção do gesto, enquanto a nota registra seu provável sentido associativo.
theological_decisions:
- issue: Identidade do sujeito de “ele estendeu a mão”
  choice: Mantém-se o sujeito apenas como “ele”, tendo o rei como antecedente mais natural.
  alternative: Entender a ação de modo mais geral no ambiente da corte ou relacioná-la, pelo sentido, aos príncipes.
  rationale: O verbo hebraico está no singular, e “nosso rei” é o antecedente singular mais próximo e natural. Como o sujeito não é repetido explicitamente, a tradução evita inserir “o rei” e conserva a pequena margem de ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Ardor” preserva a metáfora hebraica com mais naturalidade do que “calor”, e a estrutura concisa mantém o tom profético. Todos os marcadores aparecem no texto principal.
