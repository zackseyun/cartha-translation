  text: וּ/בַל יֹֽאמְרוּ֙ לִ/לְבָבָ֔/ם כָּל רָעָתָ֖/ם זָכָ֑רְתִּי עַתָּה֙ סְבָב֣וּ/ם מַֽעַלְלֵי/הֶ֔ם נֶ֥גֶד פָּנַ֖/י הָיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/002.yaml
  text: And they do not say in their heart that I remember all their evil[a]. Now their deeds surround them[c][b]; they are before my face.
translation:
  language: pt
  text: 'E eles não dizem em seu coração: “Eu me lembro de toda a maldade deles”.[a] Agora, seus atos os cercam; eles estão diante do meu rosto.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não dizem a si mesmos”. O hebraico diz literalmente “não dizem ao seu coração”.'
    reason: lexical_alternative
  - marker: b
    text: “Diante do meu rosto” é uma expressão que indica exposição direta à presença e ao exame de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַל
  choice: E eles não
  rationale: Preserva o encadeamento da acusação hebraica sem impor uma força adversativa mais marcada, embora “Mas” ou “Contudo” sejam possíveis.
- source_word: יֹאמְרוּ לִלְבָבָם
  choice: dizem no coração
  rationale: Mantém a imagem do idioma hebraico, que descreve a reflexão interior, com formulação compreensível em português.
- source_word: כָּל רָעָתָם
  choice: toda a maldade deles
  rationale: רָעָה denota aqui o mal moral de modo coletivo; “maldade” comunica tanto o caráter perverso quanto suas manifestações.
- source_word: זָכָרְתִּי
  choice: Eu me lembro
  rationale: O perfeito hebraico expressa uma consciência divina estabelecida e relevante no presente; o presente é natural em português.
- source_word: עַתָּה
  choice: Agora
  rationale: Marca a situação presente resultante da falta de reflexão deles.
- source_word: סְבָבוּם
  choice: os cercam
  rationale: Preserva a metáfora dos próprios atos envolvendo e acuando os culpados.
- source_word: מַעַלְלֵיהֶם
  choice: seus atos
  rationale: Traduz de modo corrente e digno as ações com carga moral negativa no contexto profético.
- source_word: נֶגֶד פָּנַי
  choice: diante do meu rosto
  rationale: Conserva a expressão concreta e antropomórfica do hebraico, indicando exposição direta à presença e ao escrutínio de Deus.
- source_word: הָיוּ
  choice: estão
  rationale: Embora formalmente perfeito, descreve o estado presente dos atos deles perante Deus, em harmonia com “Agora”.
theological_decisions:
- issue: Expressão antropomórfica da consciência e do juízo divinos
  choice: diante do meu rosto
  alternative: diante de mim
  rationale: A forma concreta do hebraico intensifica a ideia de que os atos estão plenamente expostos à presença e ao exame de Deus, sem exigir corporeidade literal.
- issue: Referente implícito de הָיוּ
  choice: os atos deles estão diante do rosto de Deus
  alternative: eles próprios estão diante do rosto de Deus
  rationale: O antecedente gramatical mais próximo é מַעַלְלֵיהֶם, “seus atos”; a tradução mantém esse referente sem repeti-lo, preservando a concisão do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem e as imagens centrais do hebraico foram preservadas, evitando explicitação teológica além do texto.
