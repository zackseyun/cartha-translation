    reason: alternative_reading
  revision_rationale: A revisão conserva a leitura principal cautelosa “ajuntam-se” e a ambiguidade lexical do hebraico. Apenas fortalece de modo moderado a tradução de יְיֵלִילוּ e corrige a sintaxe e a naturalidade da nota, sem resolver a questão disputada em favor de uma interpretação ritual específica.
