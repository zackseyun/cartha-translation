  text: וְ/לֹֽא זָעֲק֤וּ אֵלַ/י֙ בְּ/לִבָּ֔/ם כִּ֥י יְיֵלִ֖ילוּ עַל מִשְׁכְּבוֹתָ֑/ם עַל דָּגָ֧ן וְ/תִיר֛וֹשׁ יִתְגּוֹרָ֖רוּ יָס֥וּרוּ בִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/014.yaml
  text: They do not cry out to me from their heart[a], but they wail on their beds; for grain and new wine they gather themselves; they turn away from me.
translation:
  language: pt
  text: Eles não clamam a mim de coração, mas lamentam em suas camas; por cereal e vinho novo, ajuntam-se[a]; afastam-se de mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fazem cortes em si mesmos por cereal e vinho novo”. O verbo hebraico é difícil e pode indicar tanto que eles se ajuntam quanto que fazem cortes em si mesmos em um lamento ritual.'
    reason: alternative_reading
lexical_decisions:
- source_word: זָעֲקוּ
  choice: clamam
  rationale: O verbo expressa um forte clamor por socorro; “clamam” conserva a intensidade e é natural no registro bíblico moderno.
- source_word: אֵלַי בְּלִבָּם
  choice: a mim de coração
  rationale: A expressão comunica sinceridade interior e contrasta com a lamentação exterior descrita em seguida.
- source_word: כִּי
  choice: mas
  rationale: 'No contexto, a partícula introduz contraste: em vez de clamarem sinceramente a Deus, eles apenas gemem.'
- source_word: יְיֵלִילוּ
  choice: gemem
  rationale: O verbo descreve lamentação sonora. “Gemem” é claro e digno, embora “uivam” ou “lamentam” também sejam possíveis.
- source_word: עַל מִשְׁכְּבוֹתָם
  choice: em suas camas
  rationale: Tradução locativa natural em português, preservando a imagem do texto.
- source_word: דָּגָן וְתִירוֹשׁ
  choice: cereal e vinho novo
  rationale: דָּגָן designa cereal ou grão como produto agrícola, e תִירוֹשׁ refere-se tipicamente ao vinho novo.
- source_word: יִתְגּוֹרָרוּ
  choice: ajuntam-se
  rationale: A forma hebraica é difícil. “Ajuntam-se” traduz a leitura refletida pelo texto consonantal/massorético sem tornar certa a possível interpretação de cortes rituais; a ambiguidade é registrada em nota.
- source_word: יָסוּרוּ בִי
  choice: afastam-se de mim
  rationale: Expressa o desvio ou afastamento em relação a Deus sem intensificar a frase para “rebelam-se”.
theological_decisions:
- issue: Sentido de יִתְגּוֹרָרוּ
  choice: ajuntam-se por cereal e vinho novo
  alternative: ferem-se ou fazem cortes em si mesmos por cereal e vinho novo
  rationale: O verbo é textualmente e lexicalmente difícil. A tradução principal segue a leitura de reunião ou ajuntamento, enquanto a nota preserva a interpretação antiga e amplamente defendida de automutilação ritual, sem decidir silenciosamente a questão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “De coração” evita uma formulação rígida; “cereal” comunica o produto agrícola de modo abrangente. A nota mantém a ambiguidade genuína do verbo difícil.
