base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/009.yaml
  text: Strangers have devoured his strength[a], but he does not know it; even gray hair is sprinkled on him[b], but he does not know it.
translation:
  language: pt
  text: Estrangeiros devoraram sua força[a], mas ele não percebe; até os cabelos brancos se espalharam sobre ele[b], mas ele não percebe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Estrangeiros consumiram seu vigor”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “cabelos brancos foram espalhados sobre ele”, imagem de envelhecimento e decadência.
    reason: cultural_note
lexical_decisions:
- source_word: אָכְלוּ
  choice: devoraram
  rationale: O qal perfeito de אכל descreve metaforicamente o consumo da força e dos recursos; “devoraram” preserva a vivacidade da imagem.
- source_word: זָרִים
  choice: Estrangeiros
  rationale: No contexto, designa gente de fora, especialmente potências estrangeiras, e não apenas pessoas desconhecidas.
- source_word: כֹּחוֹ
  choice: sua força
  rationale: כֹּחַ abrange força, vigor e capacidade; “força” mantém essa amplitude sem restringir o sentido ao poder militar.
- source_word: וְהוּא לֹא יָדָע
  choice: mas ele não percebe
  rationale: A repetição ressalta que Efraim não reconhece sua própria decadência. “Percebe” expressa naturalmente o conhecimento não alcançado no contexto, enquanto “mas” explicita a relação adversativa.
- source_word: גַּם
  choice: até
  rationale: 'Marca a intensificação: além da força consumida, já aparecem nele sinais visíveis de envelhecimento e declínio.'
- source_word: שֵׂיבָה
  choice: os cabelos brancos
  rationale: Preserva a imagem concreta da brancura dos cabelos, em vez de substituí-la pela ideia abstrata de velhice.
- source_word: זָרְקָה
  choice: se espalharam
  rationale: O verbo denota lançar, aspergir ou espalhar. Com cabelos brancos como sujeito, “se espalharam” comunica de modo natural seu aparecimento progressivo sem eliminar a metáfora.
- source_word: בּוֹ
  choice: sobre ele
  rationale: Mantém a preposição hebraica e apresenta os cabelos brancos como sinal visível que apareceu nele.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com repetição deliberada de “mas ele não percebe” para conservar a ênfase profética. A tradução mantém as imagens concretas de devorar a força e do cabelo branco espalhado.
