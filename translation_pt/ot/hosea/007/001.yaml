revisions:
- from: Quando eu quero curar Israel[a], fica exposta a iniquidade de Efraim e as maldades de Samaria, pois eles praticam a falsidade. O ladrão entra, e bandos de saqueadores atacam do lado de fora.[b]
  to: Quando eu ia curar Israel[a], fica exposta a iniquidade de Efraim e as maldades de Samaria, pois eles agem com falsidade. O ladrão entra, e um bando de saqueadores saqueia lá fora.[b]
