  - severity: medium
    issue: “bandos de saqueadores atacam” muda o singular de גְּדוּד e generaliza o referente.
    rationale: O hebraico emprega um singular coletivo, “um bando”; o verbo também é singular. A revisão conserva esse número e explicita o saque, sentido contextual de פשט com גדוד.
  - severity: low
