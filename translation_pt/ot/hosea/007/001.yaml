  source_fidelity: A abertura temporal e a exposição da culpa são bem representadas, mas “quero curar” tende a expressar mera vontade presente, em vez da ação divina iminente/intencionada que o hebraico pode indicar. Além disso, גדוד está no singular; “bandos” altera o número. A revisão conserva a ambiguidade temporal em nota e restitui o singular.
  naturalness: “Quando eu ia curar Israel” é uma formulação moderna e natural que comunica a iminência ou intenção da cura sem forçar uma interpretação doutrinária. “Agem com falsidade” e “um bando de saqueadores saqueia lá fora” soam idiomáticos e mantêm o contraste entre o ladrão que entra e a violência exterior.
  terminology: “Iniquidade”, “Efraim” e “Samaria” são adequados. “Maldades” preserva o plural moral de רָעוֹת. “Falsidade” corresponde bem a שָׁקֶר; a construção verbal foi ajustada para maior naturalidade.
