  text: כְּ/רָפְאִ֣/י לְ/יִשְׂרָאֵ֗ל וְ/נִגְלָ֞ה עֲוֺ֤ן אֶפְרַ֨יִם֙ וְ/רָע֣וֹת שֹֽׁמְר֔וֹן כִּ֥י פָעֲל֖וּ שָׁ֑קֶר וְ/גַנָּ֣ב יָב֔וֹא פָּשַׁ֥ט גְּד֖וּד בַּ/חֽוּץ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/001.yaml
  text: When I would heal Israel[a], the iniquity of Ephraim is uncovered, and the evil deeds of Samaria; for they practice falsehood. A thief comes in[c][b]; a raiding band strips outside.
translation:
  language: pt
  text: Quando eu ia curar Israel[a], fica exposta a iniquidade de Efraim e as maldades de Samaria, pois eles agem com falsidade. O ladrão entra, e um bando de saqueadores saqueia lá fora.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quando curo Israel”, “Quando curei Israel” ou “Enquanto eu curava Israel”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “O ladrão invade, e um bando saqueia lá fora”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרָפְאִי
  choice: Quando eu quero curar
  rationale: A construção com כְּ é temporal, e o sufixo de primeira pessoa identifica Deus como aquele que cura. “Quero curar” comunica a ação pretendida ou iniciada sem excluir as alternativas “quando curo” e “enquanto curo”.
- source_word: וְנִגְלָה
  choice: fica exposta
  rationale: O nifal de גלה indica que algo é revelado ou posto a descoberto. A forma presente preserva a vivacidade da sequência profética.
- source_word: עֲוֺן
  choice: iniquidade
  rationale: O termo pode expressar iniquidade, culpa ou perversidade; aqui designa a corrupção moral de Efraim que vem à luz.
- source_word: וְרָעוֹת
  choice: as maldades
  rationale: O plural refere-se, neste contexto, a males morais praticados, não a calamidades sofridas. “Maldades” é natural em português e mantém o plural substantivo.
- source_word: פָעֲלוּ שָׁקֶר
  choice: praticam a falsidade
  rationale: A combinação de “fazer/praticar” com שקר descreve conduta enganosa habitual, e não apenas uma mentira isolada.
- source_word: וְגַנָּב יָבוֹא
  choice: O ladrão entra
  rationale: בוא tem o sentido básico de vir ou entrar. O artigo em português apresenta o ladrão como figura genérica, sem acrescentar explicitamente a ideia de arrombamento.
- source_word: פָּשַׁט גְּדוּד בַּחוּץ
  choice: bandos de saqueadores atacam do lado de fora
  rationale: פשט com גדוד evoca incursão e saque por um grupo armado. A formulação preserva o contraste entre o ladrão que entra e a violência aberta no exterior, em português natural.
theological_decisions:
- issue: Enquadramento temporal da cura divina e da exposição do pecado
  choice: A tentativa ou disposição de Deus para curar Israel coincide com a exposição da iniquidade de Efraim.
  alternative: “Quando curei Israel” ou “Enquanto eu curava Israel”, como referência a uma cura passada ou em andamento.
  rationale: O hebraico admite mais de uma nuance temporal. O texto principal expressa a ação pretendida sem sugerir que a restauração divina ignore a corrupção revelada; a nota conserva as demais leituras legítimas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantêm-se os nomes Efraim e Samaria e o paralelismo entre crime oculto no interior e saque aberto no exterior.
