    issue: «chamam pelo Egito»
    rationale: Embora seja formalmente possível, a expressão pode sugerir pedir que o Egito seja chamado ou simplesmente pedir pelo Egito. No contexto de alianças políticas, קרא indica dirigir um apelo ou buscar auxílio. «Apelam ao Egito» transmite esse sentido de forma mais clara e natural.
