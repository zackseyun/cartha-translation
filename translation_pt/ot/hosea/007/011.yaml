source:
  edition: WLC
  text: וַ/יְהִ֣י אֶפְרַ֔יִם כְּ/יוֹנָ֥ה פוֹתָ֖ה אֵ֣ין לֵ֑ב מִצְרַ֥יִם קָרָ֖אוּ אַשּׁ֥וּר הָלָֽכוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/011.yaml
  text: Ephraim has become like a silly dove[a], without sense; they call to Egypt, they go to Assyria.
translation:
  language: pt
  text: Efraim tornou-se como uma pomba ingênua, sem entendimento[a]; apelam ao Egito, vão para a Assíria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “sem coração”; aqui, a expressão significa sem entendimento ou discernimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: tornou-se
  rationale: O wayyiqtol de היה apresenta a condição em que Efraim veio a estar. “Tornou-se” é natural em português e mantém a ideia de mudança para um estado resultante.
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Mantém-se o nome próprio do texto hebraico, embora em Oseias ele represente frequentemente o reino do norte.
- source_word: כְּיוֹנָה
  choice: como uma pomba
  rationale: “Pomba” é o equivalente corrente de יוֹנָה e preserva a imagem da comparação.
- source_word: פוֹתָה
  choice: ingênua
  rationale: O termo descreve quem é simplório, crédulo ou facilmente enganado. “Ingênua” comunica a falta de discernimento sem sugerir apenas comicidade ou pouca inteligência.
- source_word: אֵין לֵב
  choice: sem entendimento
  rationale: Literalmente, “sem coração”; aqui לֵב designa a capacidade de compreender e julgar. A tradução expressa o sentido idiomático e a nota preserva a forma hebraica.
- source_word: מִצְרַיִם קָרָאוּ
  choice: chamam pelo Egito
  rationale: קרא neste contexto indica recorrer ao Egito ou solicitar seu auxílio. “Chamam pelo Egito” mantém concisão e evita uma conotação necessariamente religiosa.
- source_word: אַשּׁוּר הָלָכוּ
  choice: vão para a Assíria
  rationale: “Assíria” é a forma geográfica corrente; הלך indica o movimento em sua direção. O presente dá vivacidade à descrição da conduta política recorrente.
theological_decisions:
- issue: Referente de Efraim
  choice: Conservar “Efraim” como a entidade nomeada, representando implicitamente o reino do norte.
  alternative: Traduzir interpretativamente como “Israel” ou “o reino do norte”.
  rationale: A retenção do nome respeita a formulação profética e evita explicitar no texto principal uma metonímia que o contexto permite reconhecer.
- issue: Natureza da acusação “sem coração”
  choice: Entender לֵב como entendimento ou discernimento.
  alternative: Traduzir literalmente “sem coração”, o que em português poderia sugerir crueldade ou falta de afeto.
  rationale: No contexto, a crítica recai sobre a falta de juízo na busca de alianças estrangeiras, não sobre ausência de compaixão.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Ingênua” conserva a ideia de credulidade; “chamam pelo Egito” e “vão para a Assíria” mantêm o paralelismo breve e incisivo do hebraico.
