  text: כֻּלָּ/ם֙ מְנָ֣אֲפִ֔ים כְּמ֣וֹ תַנּ֔וּר בֹּעֵ֖רָה מֵֽ/אֹפֶ֑ה יִשְׁבּ֣וֹת מֵעִ֔יר מִ/לּ֥וּשׁ בָּצֵ֖ק עַד חֻמְצָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/004.yaml
  text: All of them are adulterers[a], like an oven heated by a baker[c][b], who stops stirring from the kneading of the dough until its leavening.
translation:
  language: pt
  text: Todos eles são adúlteros, como um forno aquecido pelo padeiro,[a] que deixa de atiçá-lo[b] desde que sova a massa até que ela fermente.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ardendo” ou “em brasa”. O particípio hebraico pode ressaltar que o forno está ativamente em combustão.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “de mexê-lo” ou “de atiçar o fogo”. O verbo hebraico é difícil neste contexto e provavelmente se refere à interrupção temporária do cuidado com o forno.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “até que ela cresça”. O hebraico se refere ao processo de fermentação da massa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: Todos eles
  rationale: Preserva a abrangência enfática e distributiva da expressão hebraica em português natural.
- source_word: מְנָאֲפִים
  choice: são adúlteros
  rationale: O particípio funciona como substantivo plural. A tradução mantém a acusação concreta sem explicitar no texto a possível dimensão metafórica de infidelidade à aliança.
- source_word: כְּמוֹ תַנּוּר
  choice: como um forno
  rationale: Reproduz de modo claro a comparação e a imagem doméstica ligada ao preparo do pão.
- source_word: בֹּעֵרָה
  choice: aquecido
  rationale: Expressa o estado intenso do forno no contexto da panificação sem exigir que a ênfase recaia sobre chamas visíveis; a ideia mais ativa de estar ardendo permanece indicada em nota.
- source_word: מֵאֹפֶה
  choice: pelo padeiro
  rationale: Entende a preposição como indicadora do agente que aquece ou prepara o forno, leitura adequada à sequência da comparação.
- source_word: יִשְׁבּוֹת
  choice: deixa de
  rationale: Comunica com naturalidade a ideia de cessar ou interromper uma atividade.
- source_word: מֵעִיר
  choice: atiçá-lo
  rationale: O verbo literalmente sugere despertar ou fazer levantar; no contexto do forno, provavelmente se refere a atiçar o fogo ou tornar a mexê-lo. O pronome retoma o forno sem inserir 'fogo' no texto principal.
- source_word: מִלּוּשׁ בָּצֵק
  choice: desde que sova a massa
  rationale: Conserva o início do intervalo temporal indicado pela preposição e apresenta o ato de amassar em português corrente.
- source_word: עַד חֻמְצָתוֹ
  choice: até que ela fermente
  rationale: Representa o processo de fermentação indicado pela raiz hebraica, deixando em nota a formulação contextual 'cresça'.
theological_decisions:
- issue: Se 'adúlteros' deve ser ampliado para explicitar a infidelidade espiritual ou à aliança
  choice: Manter apenas 'adúlteros' no texto principal
  alternative: pessoas infiéis à aliança; adúlteros espirituais
  rationale: Embora a profecia de Oseias use frequentemente o adultério como imagem da infidelidade à aliança, o termo deste versículo é concreto. A tradução preserva a tensão entre o sentido literal e o metafórico sem impor uma interpretação.
translation_notes:
  register: Português moderno, digno e acessível, com construção compreensível tanto no Brasil quanto em outros contextos lusófonos. 'Sovar a massa' é corrente no português brasileiro; a formulação conserva a sequência temporal e a imagem do padeiro sem suavizar a acusação profética.
