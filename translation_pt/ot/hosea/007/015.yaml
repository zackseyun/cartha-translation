id: HOS.7.15
reference: Hosea 7:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/אֲנִ֣י יִסַּ֔רְתִּי חִזַּ֖קְתִּי זְרֽוֹעֹתָ֑/ם וְ/אֵלַ֖/י יְחַשְּׁבוּ רָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/015.yaml
  text: Though I trained and strengthened their arms[a], yet they devise evil against me.
translation:
  language: pt
  text: Embora eu os tenha instruído e fortalecido os seus braços[a], eles planejam o mal contra mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “disciplinado” ou “castigado”; o verbo hebraico pode indicar tanto formação e instrução como correção e castigo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִסַּרְתִּי
  choice: instruído
  rationale: O verbo יסר pode expressar instrução, formação, disciplina ou castigo. Em paralelo com “fortalecido os seus braços”, o sentido formativo é o mais provável; “instruído” é natural e mantém aberta, em nota, a possível nuance disciplinar.
- source_word: חִזַּקְתִּי
  choice: fortalecido
  rationale: O piel de חזק significa fazer forte ou fortalecer; esta tradução é direta e idiomática.
- source_word: זְרֹעוֹתָם
  choice: os seus braços
  rationale: Preserva a imagem concreta do hebraico, na qual os braços também podem representar capacidade ou força.
- source_word: וְאֵלַי
  choice: contra mim
  rationale: Embora a preposição signifique literalmente “para mim” ou “em direção a mim”, com o planejamento do mal ela indica intenção hostil dirigida contra Deus.
- source_word: יְחַשְּׁבוּ רָע
  choice: planejam o mal
  rationale: חשב com רע denota conceber ou planejar o mal, não apenas pensar nele; “planejam o mal” é claro e corrente.
- source_word: וַאֲנִי
  choice: Embora eu
  rationale: A conjunção e o pronome introduzem um contraste concessivo entre a ação de Deus e a resposta hostil do povo.
theological_decisions:
- issue: Natureza da ação anterior de Deus expressa por יִסַּרְתִּי
  choice: 'ação formativa e benéfica: “instruído”'
  alternative: “disciplinado” ou “castigado”
  rationale: O paralelo “fortalecido os seus braços” favorece a ideia de preparar ou formar. A nota conserva a amplitude semântica do verbo e evita eliminar a possível dimensão corretiva.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “fortalecido os seus braços” preserva a coordenação verbal do hebraico e evita a possível leitura de que apenas os braços, e não o povo, sejam objeto dos dois verbos.
