base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/012.yaml
  text: As they go[a], I will spread my net over them; like the birds of the heavens I will bring them down[b]. I will chasten them according to the report to their assembly.
translation:
  language: pt
  text: Quando eles forem, estenderei sobre eles a minha rede; como as aves do céu, eu os farei descer. Eu os disciplinarei conforme a notícia dada à sua assembleia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A última frase é difícil. Também pode ser traduzida: “Eu os disciplinarei conforme o que sua assembleia ouviu” ou “Eu os disciplinarei conforme o anúncio feito à sua assembleia”. O verbo traduzido por “disciplinarei” também pode significar “castigarei” ou “corrigirei”.'
    reason: alternative_reading
lexical_decisions:
- source_word: כַּאֲשֶׁר יֵלֵכוּ
  choice: Enquanto eles vão
  rationale: A expressão introduz uma circunstância temporal em curso. A formulação preserva o movimento de Efraim no contexto sem especificar indevidamente seu destino.
- source_word: אֶפְרוֹשׂ עֲלֵיהֶם רִשְׁתִּי
  choice: estenderei sobre eles a minha rede
  rationale: Mantém a imagem concreta de uma rede aberta sobre a presa e reproduz naturalmente a relação espacial expressa por עַל.
- source_word: כְּעוֹף הַשָּׁמַיִם
  choice: como aves do céu
  rationale: עוֹף funciona coletivamente; o plural é natural em português. 'Do céu' conserva a imagem hebraica em linguagem corrente e digna.
- source_word: אוֹרִידֵם
  choice: eu os farei descer
  rationale: O hifil de ירד é causativo. A tradução conserva essa força e a imagem de aves derrubadas ou obrigadas a descer, sem acrescentar 'ao chão'.
- source_word: אַיְסִרֵם
  choice: Eu os disciplinarei
  rationale: O verbo יסר pode indicar disciplina corretiva e também castigo. 'Disciplinarei' preserva melhor essa tensão do que uma formulação exclusivamente penal.
- source_word: כְּשֵׁמַע לַעֲדָתָם
  choice: conforme o que foi anunciado à sua assembleia
  rationale: A cláusula é difícil. Esta formulação entende שֵׁמַע como aquilo que foi ouvido ou anunciado e ל como indicando o destinatário, oferecendo português compreensível sem ocultar a incerteza textual.
theological_decisions:
- issue: Natureza da ação divina em אַיְסִרֵם
  choice: Eu os disciplinarei
  alternative: Eu os castigarei; eu os corrigirei
  rationale: O hebraico comporta correção disciplinar e punição judicial. A escolha evita reduzir a ação divina a mera retribuição, e a nota preserva a alternativa penal.
- issue: Sentido da cláusula final כְּשֵׁמַע לַעֲדָתָם
  choice: conforme o que foi anunciado à sua assembleia
  alternative: conforme o relato dirigido à sua assembleia; como a sua comunidade ouviu
  rationale: A sintaxe e o referente de שֵׁמַע são incertos. O texto principal oferece uma leitura possível e inteligível, enquanto a nota registra a ambiguidade genuína.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom permanece profético e digno; evita-se tanto o arcaísmo 'castigarei' como única leitura quanto vocabulário eclesiástico específico. A única nota reúne as ambiguidades lexical e sintática da frase final, e seu marcador aparece no texto principal.
