revisions:
- from: Enquanto eles vão, estenderei sobre eles a minha rede; como aves do céu, eu os farei descer. Eu os disciplinarei conforme o que foi anunciado à sua assembleia.[a]
  to: Quando eles forem, estenderei sobre eles a minha rede; como as aves do céu, eu os farei descer. Eu os disciplinarei conforme a notícia dada à sua assembleia.[a]
  rationale: A revisão substitui a formulação interpretativa «o que foi anunciado» por «a notícia dada», que conserva o sentido nominal de שֵׁמַע e a orientação de ל sem eliminar a dificuldade da frase. A nota mantém explicitamente as principais possibilidades de leitura. Também torna a oração inicial mais idiomática em português contemporâneo.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:47:25Z'
review_pass:
  verdict: revise
  source_fidelity: 'A imagem da rede e das aves, bem como o valor causativo de «farei descer», estão bem representados. Contudo, «conforme o que foi anunciado à sua assembleia» resolve indevidamente a construção difícil כְּשֵׁמַע לַעֲדָתָם: «anunciado» introduz uma ação passiva que o substantivo שֵׁמַע (‘notícia, relato, o que se ouviu’) não exige. Uma formulação mais aberta no texto e alternativas na nota preservam melhor a incerteza.'
  naturalness: «Enquanto eles vão» é compreensível, mas soa pouco idiomático e excessivamente progressivo neste contexto profético. «Quando eles forem» é natural em português moderno e conserva a relação temporal. O restante mantém registro profético claro e acessível.
  terminology: «Rede», «aves do céu» e «disciplinarei» são escolhas adequadas. «Disciplinarei» mantém a abrangência de יסר sem impor uma leitura exclusivamente punitiva. «Assembleia» é uma tradução apropriada e não eclesiasticamente marcada de עֵדָה.
  issues:
  - severity: medium
    issue: A cláusula final é apresentada como se «o que foi anunciado» fosse seu sentido principal.
    rationale: O hebraico כְּשֵׁמַע לַעֲדָתָם é sintaticamente difícil; שֵׁמַע designa primariamente notícia, relato ou aquilo que foi ouvido. A noção específica de anúncio feito à assembleia deve permanecer como alternativa, não como resolução no texto principal.
  - severity: low
    issue: «Enquanto eles vão» é uma formulação temporal pouco natural.
    rationale: A oração hebraica pode ser expressa naturalmente por «Quando eles forem», sem alterar a abertura temporal nem especificar o destino deles.
  revised_text: Quando eles forem, estenderei sobre eles a minha rede; como as aves do céu, eu os farei descer. Eu os disciplinarei conforme a notícia dada à sua assembleia.[a]
  revised_footnotes:
  - marker: a
    text: 'A última frase é difícil. Também pode ser traduzida: “Eu os disciplinarei conforme o que sua assembleia ouviu” ou “Eu os disciplinarei conforme o anúncio feito à sua assembleia”. O verbo traduzido por “disciplinarei” também pode significar “castigarei” ou “corrigirei”.'
    reason: alternative_reading
  revision_rationale: A revisão substitui a formulação interpretativa «o que foi anunciado» por «a notícia dada», que conserva o sentido nominal de שֵׁמַע e a orientação de ל sem eliminar a dificuldade da frase. A nota mantém explicitamente as principais possibilidades de leitura. Também torna a oração inicial mais idiomática em português contemporâneo.
