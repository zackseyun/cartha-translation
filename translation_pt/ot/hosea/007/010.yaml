source:
  edition: WLC
  text: וְ/עָנָ֥ה גְאֽוֹן יִשְׂרָאֵ֖ל בְּ/פָנָ֑י/ו וְ/לֹֽא שָׁ֨בוּ֙ אֶל יְהוָ֣ה אֱלֹֽהֵי/הֶ֔ם וְ/לֹ֥א בִקְשֻׁ֖/הוּ בְּ/כָל זֹֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/010.yaml
  text: The pride of Israel testifies against him[a], yet they do not return to Yahweh their God[b], nor do they seek him in all this.
translation:
  language: pt
  text: O orgulho de Israel testemunha contra ele[a], mas eles não voltam para Yahweh, seu Deus, nem o buscam em tudo isso[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “diante dele” ou “na sua própria face”; literalmente, “em/contra o rosto dele”.
    reason: lexical_alternative
  - marker: b
    text: Ou “apesar de tudo isso”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנָה
  choice: testemunha
  rationale: No idioma formado com גְּאוֹן יִשְׂרָאֵל e בְּפָנָיו, o verbo tem sentido de dar testemunho contra alguém; “testemunha” preserva o tom de acusação profética.
- source_word: גְּאוֹן יִשְׂרָאֵל
  choice: o orgulho de Israel
  rationale: Embora גָּאוֹן possa indicar exaltação ou majestade, o contexto de repreensão favorece o sentido negativo de orgulho.
- source_word: בְּפָנָיו
  choice: contra ele
  rationale: A expressão significa literalmente “em/contra o rosto dele”. Com o sentido forense de ענה, “contra ele” é natural e mantém o sufixo hebraico no singular.
- source_word: שָׁבוּ אֶל
  choice: voltam para
  rationale: שׁוב com אֶל expressa retorno, inclusive retorno relacional e arrependimento, sem exigir paráfrase explicativa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיהֶם
  choice: seu Deus
  rationale: O possessivo plural é expresso naturalmente em português por “seu” com o sujeito plural “eles” e mantém a ironia pactual da recusa em voltar para o Deus deles.
- source_word: בִּקְשֻׁהוּ
  choice: o buscam
  rationale: בקש aqui abrange buscar Deus relacionalmente ou recorrer a ele; “buscar” mantém essa amplitude.
- source_word: בְּכָל זֹאת
  choice: em meio a tudo isso
  rationale: A formulação aponta para a totalidade das circunstâncias ou juízos anteriores e soa natural em português, sem impor plenamente o valor concessivo possível.
theological_decisions:
- issue: Referente do sufixo singular em בְּפָנָיו
  choice: “contra ele”, mantendo o singular
  alternative: “contra eles” para explicitar o sentido corporativo, ou “diante dele”
  rationale: O hebraico traz um sufixo singular, provavelmente retomando Israel como coletivo. Mantê-lo conserva a mudança de número entre “Israel/ele” e “eles”, sem harmonizar a tensão gramatical.
- issue: Valor contextual de בְּכָל זֹאת
  choice: “em meio a tudo isso”
  alternative: “apesar de tudo isso”
  rationale: A preposição pode situar a recusa no conjunto das circunstâncias, enquanto o contexto também permite leitura concessiva. A tradução principal permanece próxima da forma hebraica, e a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A coordenação com “mesmo assim” explicita a força adversativa de וְ sem apagar a formulação hebraica; “em meio a tudo isso” evita a expressão menos idiomática “em tudo isso”. Todos os marcadores de nota aparecem no texto.
