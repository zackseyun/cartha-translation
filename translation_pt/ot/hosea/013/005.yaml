  text: אֲנִ֥י יְדַעְתִּ֖י/ךָ בַּ/מִּדְבָּ֑ר בְּ/אֶ֖רֶץ תַּלְאֻבֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/005.yaml
  text: I knew you in the wilderness[b][a], in a land of severe drought.
translation:
  language: pt
  text: Eu conheci você[a] no deserto, numa terra de seca extrema[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Eu cuidei de você” ou “Eu reconheci você”; o verbo hebraico pode ter conotações relacionais ou pactuais além de simples conhecimento.
    reason: lexical_alternative
  - marker: b
    text: Ou “numa terra de sede”, “numa terra de calor abrasador” ou “numa terra ressequida”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדַעְתִּיךָ
  choice: Eu conheci você
  rationale: Mantém o sentido lexical básico de ידע e permite que o contexto comunique sua possível dimensão relacional ou pactual, sem explicitá-la indevidamente.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: Em português corrente, “deserto” expressa com naturalidade a região erma e árida e preserva a evocação do período do êxodo.
- source_word: בְּאֶרֶץ
  choice: numa terra
  rationale: Reproduz de modo natural a construção hebraica sem artigo definido neste contexto.
- source_word: תַּלְאֻבוֹת
  choice: ressequida
  rationale: O substantivo raro indica sede, secura extrema ou calor abrasador; “ressequida” comunica de forma clara a condição árida sem restringir excessivamente o sentido.
theological_decisions:
- issue: Nuance do conhecimento divino em relação a Israel
  choice: A dimensão relacional ou pactual fica implícita em “Eu conheci você”
  alternative: “Eu cuidei de você” ou “Eu reconheci você”
  rationale: Embora o contexto provavelmente evoque o cuidado pactual de YHWH por Israel no deserto, o verbo hebraico empregado é “conhecer”. A tradução principal preserva esse núcleo lexical e registra as possibilidades interpretativas em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome “você” torna explícito o objeto singular do hebraico; “ressequida” conserva a imagem concreta e a ambiguidade aproximada do termo raro.
