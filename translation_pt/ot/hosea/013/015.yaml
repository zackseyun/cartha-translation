reference: Hosea 13:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י ה֔וּא בֵּ֥ן אַחִ֖ים יַפְרִ֑יא יָב֣וֹא קָדִים֩ ר֨וּחַ יְהוָ֜ה מִ/מִּדְבָּ֣ר עֹלֶ֗ה וְ/יֵב֤וֹשׁ מְקוֹר/וֹ֙ וְ/יֶחֱרַ֣ב מַעְיָנ֔/וֹ ה֣וּא יִשְׁסֶ֔ה אוֹצַ֖ר כָּל כְּלִ֥י חֶמְדָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/015.yaml
  text: Though he may flourish among his brothers[a], an east wind will come—the wind of Yahweh, rising from the wilderness—and his spring will dry up, and his fountain will be dried out[c][b]; it will plunder the storehouse of every precious vessel.
translation:
  language: pt
  text: Embora ele floresça entre seus irmãos[a], virá um vento oriental — o vento de Yahweh[b], que sobe do deserto —, e sua nascente secará, e seu manancial ficará seco; ele saqueará o depósito de todos os objetos preciosos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois ele frutifica entre irmãos”. O hebraico admite uma tradução mais formal e causal; no contexto, porém, a ideia pode ser concessiva: apesar da prosperidade de Efraim, o juízo está chegando.'
    reason: lexical_alternative
  - marker: b
    text: “O vento de Yahweh” também pode ser traduzido como “o sopro de Yahweh”; aqui, “vento” corresponde melhor ao “vento oriental” que sobe do deserto.
    reason: alternative_reading
  - marker: c
    text: O sujeito de “saqueará” é provavelmente o vento oriental, mas também pode ser entendido como um invasor implícito. A última expressão também pode ser traduzida como “o tesouro de todos os objetos preciosos”.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Embora
  rationale: 'No contexto, introduz uma concessão: apesar da prosperidade de Efraim, o juízo virá. A nota preserva a possibilidade causal mais formal.'
- source_word: בֵּן אַחִים יַפְרִיא
  choice: ele floresça entre seus irmãos
  rationale: Expressa de modo natural a prosperidade de Efraim dentro de seu grupo de irmãos, conservando a imagem vegetal de frutificação sem reproduzir literalmente a expressão difícil 'filho de irmãos'.
- source_word: קָדִים
  choice: vento oriental
  rationale: Designa o vento quente e destrutivo vindo do leste; 'vento oriental' é claro e mantém o tom profético.
- source_word: רוּחַ יְהוָה
  choice: o vento de Yahweh
  rationale: O paralelo com 'vento oriental' e sua subida do deserto favorecem o sentido meteorológico de רוּחַ, ao mesmo tempo que a construção atribui o juízo a Yahweh.
- source_word: מִמִּדְבָּר עֹלֶה
  choice: que sobe do deserto
  rationale: Conserva a vivacidade do particípio e identifica a origem desértica do vento.
- source_word: מְקוֹרוֹ ... מַעְיָנוֹ
  choice: sua nascente ... seu manancial
  rationale: Mantém o paralelismo entre duas fontes de água com termos portugueses concretos e naturais.
- source_word: וְיֵבֹשׁ ... וְיֶחֱרַב
  choice: secará ... ficará seco
  rationale: Representa a progressão paralela da perda de água sem deslocar a imagem para uma devastação genérica.
- source_word: יִשְׁסֶה
  choice: Ele saqueará
  rationale: O verbo significa despojar ou saquear. O pronome retoma mais naturalmente o vento oriental, embora o referente exato seja suficientemente incerto para merecer nota.
- source_word: אוֹצַר כָּל כְּלִי חֶמְדָּה
  choice: o depósito de todos os objetos preciosos
  rationale: Traduz אוֹצַר como lugar onde bens são guardados e כְּלִי de modo abrangente como 'objetos', evitando restringi-lo a vasos ou utensílios.
theological_decisions:
- issue: Agência do vento destrutivo
  choice: O vento oriental é apresentado como o vento de Yahweh, instrumento do juízo divino.
  alternative: Entender רוּחַ יְהוָה como 'sopro de Yahweh' ou como referência mais pessoal ao Espírito de Yahweh.
  rationale: O paralelismo imediato com o vento oriental e a menção de sua subida do deserto favorecem 'vento'. Essa opção preserva a agência divina sem introduzir uma afirmação pneumatológica que o contexto não exige.
- issue: Sujeito de 'saqueará'
  choice: O vento oriental é o antecedente mais provável.
  alternative: Um invasor implícito ou Efraim personificado pode ser entendido como sujeito.
  rationale: A forma masculina pode retomar קָדִים, 'vento oriental', e a sequência descreve seus efeitos destrutivos; contudo, a transição da imagem meteorológica para o saque permite mais de uma compreensão, preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva as imagens proféticas de fecundidade, vento e fontes de água; as ambiguidades reais quanto à conjunção inicial, ao sentido de רוּחַ e ao agente do saque são explicitadas em notas.
