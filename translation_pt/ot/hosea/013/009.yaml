  text: You have destroyed yourself[a], Israel, because your help is in me.
translation:
  language: pt
  text: Ele destruiu você, Israel,[a] porque em mim está o seu auxílio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico deste versículo é difícil. Outras traduções possíveis são: “Você se destruiu, Israel, pois em mim está o seu auxílio”; ou, mais literalmente, “Sua destruição, Israel...”. Alguns entendem a construção inteira de modo diferente: “Sua destruição, Israel, é que você esteja contra mim, contra o seu auxílio”.'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁחֶתְךָ
  choice: Ele destruiu você
  rationale: A vocalização massorética pode ser entendida como forma verbal na terceira pessoa masculina singular, com sufixo de objeto na segunda pessoa masculina singular. Como o sujeito está implícito, o português requer “Ele”. A construção hebraica, porém, é difícil, e as leituras reflexiva e nominal são registradas na nota.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém-se a forma tradicional do nome próprio em português.
- source_word: כִּי
  choice: porque
  rationale: Introduz naturalmente a explicação ou fundamento da declaração anterior, sem eliminar a tensão da passagem.
- source_word: בִי
  choice: em mim
  rationale: Preserva o sentido normal da preposição ב e apresenta Deus como a fonte em quem se encontra o auxílio de Israel. A leitura adversativa “contra mim” permanece possível no hebraico difícil e é mencionada na nota.
- source_word: בְעֶזְרֶךָ
  choice: está o seu auxílio
  rationale: עֵזֶר significa “auxílio, ajuda”. A inclusão de “está” torna idiomática em português a expressão hebraica comprimida, preservando o substantivo.
theological_decisions:
- issue: Interpretação da abertura sintaticamente difícil
  choice: Ele destruiu você, Israel
  alternative: 'Você se destruiu, Israel; ou: Sua destruição, Israel'
  rationale: A tradução principal segue de perto a vocalização do Texto Massorético, sem introduzir silenciosamente um objeto reflexivo ausente da forma escrita. A nota conserva as principais leituras tradicionais e reconhece a dificuldade real do hebraico.
- issue: Relação entre a ruína de Israel e Deus como seu auxílio
  choice: porque em mim está o seu auxílio
  alternative: pois você está contra mim, contra o seu auxílio
  rationale: A leitura principal conserva o valor usual de בִי e o contraste teológico entre a ruína de Israel e sua verdadeira fonte de auxílio. A leitura adversativa possível não é suprimida, mas registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Auxílio” preserva o substantivo hebraico e um tom solene sem soar arcaico. A nota explicita a incerteza sintática e semântica sem impor uma solução denominacional.
