  text: כְּ/מַרְעִיתָ/ם֙ וַ/יִּשְׂבָּ֔עוּ שָׂבְע֖וּ וַ/יָּ֣רָם לִבָּ֑/ם עַל כֵּ֖ן שְׁכֵחֽוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/006.yaml
  text: As their pasture[a], they were satisfied; they were satisfied, and their heart was lifted up[b]; therefore they forgot me.
translation:
  language: pt
  text: Quando tinham pasto[a], ficaram saciados; ficaram saciados, e o coração deles se elevou[b]; por isso se esqueceram de mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Conforme o seu pasto” ou “Quando eram apascentados”. A expressão hebraica é compacta e pode descrever as circunstâncias de sua abundância.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “o coração deles se elevou”, expressão que indica que se tornaram orgulhosos.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַרְעִיתָם
  choice: Quando tinham pasto
  rationale: A construção hebraica é compacta. O כְּ pode ter valor temporal ou circunstancial, e מַרְעִיתָם se refere ao pasto ou à pastagem deles. A formulação comunica naturalmente a abundância que antecede a saciedade, enquanto a nota preserva outras possibilidades.
- source_word: וַיִּשְׂבָּעוּ שָׂבְעוּ
  choice: ficaram saciados; ficaram saciados
  rationale: A repetição do radical שבע é retoricamente importante e foi mantida. “Saciados” expressa estar plenamente alimentado ou satisfeito sem ampliar indevidamente o sentido.
- source_word: וַיָּרָם לִבָּם
  choice: o coração deles se elevou
  rationale: A tradução conserva a metáfora hebraica da elevação do coração, que no contexto comunica orgulho, sem substituí-la diretamente por uma interpretação.
- source_word: עַל כֵּן
  choice: por isso
  rationale: Marca de modo claro e natural a consequência indicada pela expressão inferencial hebraica.
- source_word: שְׁכֵחוּנִי
  choice: se esqueceram de mim
  rationale: Reproduz diretamente a acusação hebraica e conserva sua força relacional e pactual.
theological_decisions:
- issue: A elevação do coração como expressão de orgulho
  choice: 'Conservar a metáfora: “o coração deles se elevou”'
  alternative: “eles se tornaram orgulhosos”
  rationale: 'A metáfora mantém a textura teológica do texto: a abundância conduz à autoexaltação e, em seguida, ao esquecimento de Deus. A nota esclarece o valor idiomático sem apagar a imagem.'
- issue: Relação entre abundância e saciedade na expressão inicial
  choice: Traduzir temporalmente, mantendo alternativas em nota
  alternative: “Conforme o seu pasto” ou “Quando eram apascentados”
  rationale: O hebraico admite mais de uma análise circunstancial. A redação principal é natural em português, e a nota evita apresentar a leitura temporal como a única possível.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição enfática de “ficaram saciados” e a metáfora do coração elevado foram preservadas; as ambiguidades da expressão inicial foram registradas em nota.
