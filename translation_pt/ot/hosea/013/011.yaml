  text: I gave you a king in my anger[b][a], and I took him away in my wrath.
translation:
  language: pt
  text: Eu lhe dei um rei na minha ira[a] e o tirei no meu furor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em uma tradução mais literal: “Eu lhe dou um rei na minha ira e o tiro no meu furor”. As formas verbais hebraicas são imperfeitas e podem ser traduzidas no presente ou no futuro, embora o contexto favoreça aqui o sentido retrospectivo.'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “e tirei”; o objeto, “o rei”, está subentendido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶתֶּן
  choice: dei
  rationale: Embora seja uma forma imperfeita do qal na primeira pessoa do singular, o contexto profético favorece uma leitura retrospectiva. O pretérito comunica naturalmente em português a concessão passada da monarquia.
- source_word: לְךָ
  choice: lhe
  rationale: Representa o objeto indireto de segunda pessoa masculina singular, dirigindo-se coletivamente a Israel, sem marcar gênero no português.
- source_word: מֶלֶךְ
  choice: um rei
  rationale: O substantivo sem artigo é naturalmente expresso com o artigo indefinido e se refere à concessão de um rei ou da monarquia.
- source_word: בְּאַפִּי
  choice: na minha ira
  rationale: אַף designa ira neste uso. A formulação preserva a relação circunstancial ou causal da preposição בְּ e o tom profético.
- source_word: וְאֶקַּח
  choice: e o tirei
  rationale: לקח significa literalmente tomar; neste contexto, comunica a retirada do rei. O pronome explicita em português o objeto subentendido no hebraico.
- source_word: בְּעֶבְרָתִי
  choice: no meu furor
  rationale: עֶבְרָה expressa ira intensa. 'Furor' mantém a força do termo e a distinção lexical em relação a אַף, traduzido como 'ira'.
theological_decisions:
- issue: Tempo e aspecto das duas formas verbais imperfeitas na primeira pessoa
  choice: 'Sentido retrospectivo no pretérito: “dei... tirei”'
  alternative: 'Presente ou futuro: “dou... tiro/tirarei”'
  rationale: A morfologia permite valor presente ou futuro, mas o contexto relembra a concessão e a remoção de reis como atos do juízo divino. A nota conserva a ambiguidade formal do hebraico.
- issue: Objeto implícito de וְאֶקַּח
  choice: Explicitar o rei por meio do pronome “o”
  alternative: 'Deixar o objeto implícito: “e tirei”'
  rationale: O hebraico não repete o objeto, mas מֶלֶךְ o fornece claramente. Em português, o pronome torna a frase natural sem introduzir um referente novo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Ira” e “furor” preservam a gradação e o paralelismo do hebraico; “lhe” mantém Israel como destinatário coletivo singular.
