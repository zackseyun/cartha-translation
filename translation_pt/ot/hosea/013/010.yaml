  text: אֱהִ֤י מַלְכְּ/ךָ֙ אֵפ֔וֹא וְ/יוֹשִֽׁיעֲ/ךָ֖ בְּ/כָל עָרֶ֑י/ךָ וְ/שֹׁ֣פְטֶ֔י/ךָ אֲשֶׁ֣ר אָמַ֔רְתָּ תְּנָ/ה לִּ֖/י מֶ֥לֶךְ וְ/שָׂרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/010.yaml
  text: Where now is your king[a], that he may save you in all your cities, and your judges, of whom you said[b], “Give me a king and princes”?
translation:
  language: pt
  text: 'Onde está agora o seu rei[a], para que ele o salve em todas as suas cidades? E onde estão os seus juízes, dos quais você disse: “Dê-me um rei e líderes”[b]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, menos provavelmente: “Eu seria o seu rei; onde, então, está quem possa salvá-lo...?” A abertura hebraica é difícil.'
    reason: alternative_reading
  - marker: b
    text: “Líderes” também pode ser traduzido por “príncipes”, “autoridades” ou “governantes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱהִי ... אֵפוֹא
  choice: Onde está agora
  rationale: A abertura hebraica é difícil. Em seu contexto, foi entendida como uma pergunta retórica que desafia a confiança de Israel na monarquia. אֵפוֹא reforça a pergunta com a ideia de “agora”.
- source_word: מַלְכְּךָ
  choice: o seu rei
  rationale: Mantém o substantivo singular com o sufixo possessivo e corresponde ao pedido de Israel por um rei.
- source_word: וְיוֹשִׁיעֲךָ
  choice: para que ele o salve
  rationale: O hifil de ישׁע significa salvar ou livrar. A oração final expressa naturalmente, em português, o desafio irônico da pergunta.
- source_word: בְּכָל עָרֶיךָ
  choice: em todas as suas cidades
  rationale: Reproduz de modo direto o sentido locativo da preposição ב e conserva a abrangência de כָל.
- source_word: וְשֹׁפְטֶיךָ
  choice: os seus governantes
  rationale: Embora שֹׁפְטִים possa significar literalmente “juízes”, aqui designa autoridades políticas em paralelo com rei e líderes. “Governantes” comunica essa função sem restringi-la ao âmbito judicial.
- source_word: אֲשֶׁר אָמַרְתָּ
  choice: sobre os quais você disse
  rationale: Retoma as autoridades mencionadas e preserva a relação relativa sem sugerir necessariamente que o pedido lhes tenha sido dirigido.
- source_word: תְּנָה לִּי
  choice: Dê-me
  rationale: Tradução direta e natural do imperativo de נתן com o pronome dativo לִי.
- source_word: מֶלֶךְ וְשָׂרִים
  choice: um rei e líderes
  rationale: מֶלֶךְ é “rei”; שָׂרִים admite “príncipes”, “autoridades” ou “líderes”. “Líderes” é atual, amplo e compreensível, enquanto a nota preserva as alternativas lexicais.
theological_decisions:
- issue: Interpretação da abertura difícil אֱהִי
  choice: 'Pergunta retórica: “Onde está agora o seu rei...?”'
  alternative: “Eu seria o seu rei; onde, então, está quem possa salvá-lo...?” ou “Eu serei o seu rei...”
  rationale: A leitura interrogativa se harmoniza com a censura contextual à confiança de Israel em reis humanos e com a referência ao rei dado e retirado no contexto próximo. A alternativa é mantida em nota, pois a forma hebraica é genuinamente difícil.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “onde estão” explicita em português a elipse hebraica e mantém a força da pergunta retórica. O pronome “você” representa o singular dirigido coletivamente a Israel.
