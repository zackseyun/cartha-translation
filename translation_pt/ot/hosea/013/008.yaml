base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/008.yaml
  text: I will attack them like a bear robbed of her cubs[a], and I will tear open the enclosure of their heart; there I will devour them like a lioness[b]; a wild beast of the field will rip them apart.
translation:
  language: pt
  text: Eu os atacarei como uma ursa privada de seus filhotes e rasgarei o invólucro do coração deles[a]. Ali os devorarei como uma leoa[b]; uma fera do campo os despedaçará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a cobertura do coração deles”, possivelmente referindo-se ao peito. A expressão hebraica é rara e de sentido incerto.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “como um leão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְגְּשֵׁם
  choice: Eu os atacarei
  rationale: Embora פגשׁ possa significar “encontrar” ou “confrontar”, o contexto de juízo e as imagens de animais predadores indicam um encontro hostil; “atacarei” expressa isso naturalmente.
- source_word: כְּדֹב שַׁכּוּל
  choice: como uma ursa privada de seus filhotes
  rationale: שַׁכּוּל descreve quem sofreu a perda dos filhos ou das crias. A formulação preserva a imagem materna e sua ferocidade sem acrescentar detalhes.
- source_word: וְאֶקְרַע
  choice: e rasgarei
  rationale: קרע significa rasgar ou romper. “Rasgarei” mantém a força concreta e violenta da imagem.
- source_word: סְגוֹר לִבָּם
  choice: o invólucro do coração deles
  rationale: A expressão hebraica é rara e difícil. סְגוֹר indica algo fechado ou que envolve; “invólucro” conserva essa imagem sem reduzi-la interpretativamente a “peito”.
- source_word: וְאֹכְלֵם שָׁם
  choice: Ali os devorarei
  rationale: No contexto predatório, אכל é bem representado por “devorar”; “ali” conserva o advérbio שָׁם.
- source_word: כְּלָבִיא
  choice: como uma leoa
  rationale: לָבִיא pode designar um leão ou uma leoa. “Leoa” é defensável no contexto da ursa privada das crias, mas a alternativa masculina é registrada em nota.
- source_word: חַיַּת הַשָּׂדֶה
  choice: um animal selvagem
  rationale: A construção singular e o verbo singular favorecem um referente singular. “Animal selvagem” transmite de modo natural a ideia de uma fera do campo aberto.
- source_word: תְּבַקְּעֵם
  choice: os despedaçará
  rationale: בקע significa fender, partir ou abrir. Na imagem de ataque animal, “despedaçará” comunica de forma idiomática o resultado violento.
theological_decisions:
- issue: Autodescrição divina por meio de imagens de animais predadores
  choice: Manter a fala divina na primeira pessoa e as metáforas violentas sem suavização.
  alternative: Substituir as imagens por uma formulação geral de juízo.
  rationale: O hebraico apresenta Deus como agente direto do juízo da aliança por meio de uma sequência de imagens predatórias. A tradução preserva essa severidade e a tensão teológica do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe mantém a progressão rápida das imagens de ataque; termos excessivamente técnicos ou arcaicos foram evitados.
