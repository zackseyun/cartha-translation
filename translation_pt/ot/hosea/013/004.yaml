  text: וְ/אָנֹכִ֛י יְהוָ֥ה אֱלֹהֶ֖י/ךָ מֵ/אֶ֣רֶץ מִצְרָ֑יִם וֵ/אלֹהִ֤ים זֽוּלָתִ/י֙ לֹ֣א תֵדָ֔ע וּ/מוֹשִׁ֥יעַ אַ֖יִן בִּלְתִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/004.yaml
  text: But I am Yahweh your God from the land of Egypt[a]; you know no God besides me[b], and there is no savior except me.
translation:
  language: pt
  text: Mas eu sou Yahweh, seu Deus, desde o Egito[a]. Você não conhece nenhum Deus além de mim[b], e não há salvador senão eu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da terra do Egito” ou “ao tirar você da terra do Egito”. A expressão hebraica pode destacar tanto a relação de Yahweh com Israel desde a época do êxodo quanto sua ação salvadora ao tirá-lo de lá.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “você não conhecerá nenhum Deus além de mim”. O verbo hebraico pode ser entendido como declaração, mas também pode ter força pactual ou proibitiva: “não reconheça nenhum Deus além de mim”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: Mas eu
  rationale: A conjunção com o pronome enfático marca contraste no contexto; “Mas eu” o expressa naturalmente em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Com Yahweh e o sufixo da segunda pessoa do singular, a expressão tem sentido singular e pactual.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: desde a terra do Egito
  rationale: A preposição pode ter nuance temporal ou de origem. No contexto, “desde” evoca a relação de Yahweh com Israel a partir do êxodo, sem eliminar as outras possibilidades, registradas em nota.
- source_word: וֵאלֹהִים זוּלָתִי
  choice: nenhum Deus além de mim
  rationale: אֱלֹהִים tem aqui sentido singular indefinido, e זוּלָתִי exprime exclusão.
- source_word: לֹא תֵדָע
  choice: Você não conhecerá
  rationale: O imperfeito admite força declarativa futura e também ressonância pactual ou proibitiva; o futuro em português preserva melhor essa abertura do que uma formulação explicitamente imperativa.
- source_word: וּמוֹשִׁיעַ
  choice: e não há salvador
  rationale: O particípio designa aquele que salva ou livra; o substantivo “salvador” é claro e natural.
- source_word: אַיִן בִּלְתִּי
  choice: não há ... senão eu
  rationale: A construção combina negação existencial e exceção, formando uma afirmação enfática de exclusividade.
theological_decisions:
- issue: Identidade divina e salvação exclusivas
  choice: Yahweh declara que Israel não deve conhecer nenhum Deus além dele e que não existe outro salvador.
  alternative: A primeira afirmação pode ser entendida mais estritamente como temporal (“sou seu Deus desde o Egito”), e a segunda como constatação (“você não conhece nenhum Deus além de mim”).
  rationale: O hebraico fundamenta no êxodo uma declaração pactual da exclusividade de Yahweh como Deus e salvador, sem exigir a importação de formulações doutrinárias posteriores.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Mantém “Yahweh” como nome pessoal divino, usa “você” para o singular hebraico e conserva em nota as ambiguidades temporal/originária da primeira expressão e declarativa/proibitiva do verbo ידע.
