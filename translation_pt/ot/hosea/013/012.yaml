  text: צָרוּר֙ עֲוֺ֣ן אֶפְרָ֔יִם צְפוּנָ֖ה חַטָּאתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/012.yaml
  text: Ephraim’s iniquity is bound up[a]; his sin is stored up.
translation:
  language: pt
  text: A iniquidade de Efraim está amarrada; seu pecado está guardado[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “escondido”. O hebraico pode indicar algo oculto ou mantido em reserva, provavelmente no sentido de que o pecado de Efraim está sendo guardado para uma prestação de contas futura.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרוּר
  choice: está amarrada
  rationale: O particípio passivo de צרר descreve algo atado ou amarrado. A escolha preserva a imagem concreta de algo mantido de modo seguro e forma paralelo com “está guardado”.
- source_word: עֲוֺן
  choice: iniquidade
  rationale: Embora עָוֹן possa significar iniquidade, culpa ou a consequência da culpa, o paralelismo com “pecado” favorece aqui a própria transgressão moral.
- source_word: אֶפְרָיִם
  choice: de Efraim
  rationale: O nome próprio é transliterado na forma portuguesa consagrada, e a relação genitiva é expressa naturalmente com “de”.
- source_word: צְפוּנָה
  choice: está guardado
  rationale: O particípio passivo de צפן pode indicar algo escondido, armazenado ou reservado. “Guardado” conserva a ambiguidade entre ocultação e conservação para prestação de contas futura, sem explicitar no texto mais do que o hebraico afirma.
- source_word: חַטָּאתוֹ
  choice: seu pecado
  rationale: חַטָּאת significa aqui “pecado”, não “oferta pelo pecado”; o sufixo masculino singular remete a Efraim entendido coletivamente.
theological_decisions:
- issue: Força metafórica do versículo
  choice: A iniquidade de Efraim é retratada como atada, e seu pecado como guardado, sugerindo que não foram removidos nem esquecidos.
  alternative: Entender צְפוּנָה apenas como “escondido”, sem a possível ideia de algo reservado para juízo futuro.
  rationale: Os dois particípios passivos, no contexto de juízo em Oseias, sugerem culpa conservada para acerto futuro. A tradução mantém as imagens e deixa a nota explicar a amplitude lexical, sem transformar a sugestão contextual em afirmação doutrinária explícita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O paralelismo conciso do hebraico foi preservado; “amarrada” mantém a metáfora concreta, enquanto “guardado” é natural e conserva a ambiguidade relevante.
