  text: חֶבְלֵ֥י יֽוֹלֵדָ֖ה יָבֹ֣אוּ ל֑/וֹ הוּא בֵן֙ לֹ֣א חָכָ֔ם כִּֽי עֵ֥ת לֹֽא יַעֲמֹ֖ד בְּ/מִשְׁבַּ֥ר בָּנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/013.yaml
  text: The labor pains of a woman giving birth come upon him[a]; he is an unwise son[b], for at the proper time he does not present himself at the opening of the womb.
translation:
  language: pt
  text: As dores de parto de uma mulher que está dando à luz vêm sobre ele; ele é um filho sem sabedoria, pois, quando chega a hora, não se coloca na abertura do ventre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «não se põe no lugar de rompimento dos filhos». A expressão hebraica é rara e pode se referir ao lugar ou ao momento do nascimento; também se pode entender «na abertura do ventre».
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶבְלֵי יֹלֵדָה
  choice: As dores de parto de uma mulher que está dando à luz
  rationale: O contexto obstétrico determina que חֶבְלֵי se refere a dores de parto, não a cordas. A formulação mantém tanto a expressão nominal quanto o particípio que retrata a mulher no ato de dar à luz.
- source_word: יָבֹאוּ לוֹ
  choice: vêm sobre ele
  rationale: Conserva o movimento figurado das dores que chegam ao referente masculino, sem acrescentar uma ideia punitiva não expressa.
- source_word: בֵן לֹא חָכָם
  choice: um filho sem sabedoria
  rationale: Reproduz de perto a negação hebraica e preserva a imagem familiar, sem intensificá-la para 'tolo'.
- source_word: כִּי עֵת לֹא יַעֲמֹד
  choice: pois, quando chega a hora, não se apresenta
  rationale: Expressa em português corrente o momento decisivo do parto e o sentido contextual de יעמד, literalmente 'fica de pé/permanece', sem achatar a metáfora.
- source_word: בְּמִשְׁבַּר בָּנִים
  choice: à abertura do ventre
  rationale: A expressão rara designa o lugar ou momento em que os filhos irrompem no nascimento. 'Abertura do ventre' conserva a imagem concreta, enquanto a nota registra a formulação literal e a dificuldade lexical.
theological_decisions:
- issue: Referente metafórico das imagens de parto
  choice: Manter os pronomes masculinos e a figura do filho sem nomear Efraim ou Israel no versículo.
  alternative: 'Explicitar: ''Efraim é um filho sem sabedoria''.'
  rationale: Embora o contexto identifique o referente, o hebraico deste versículo não o nomeia; explicitá-lo resolveria no texto algo deixado implícito.
- issue: Sentido da demora do filho no nascimento
  choice: Traduzir contextualmente 'não se apresenta à abertura do ventre'.
  alternative: Traduzir literalmente 'não permanece no lugar onde os filhos irrompem'.
  rationale: A tradução principal comunica a imagem de um filho que não vem à luz no momento crítico, enquanto a nota preserva a forma incomum e a ambiguidade da expressão hebraica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição ligada ao parto foi mantida por refletir a intensidade da imagem hebraica; evitou-se nomear o referente implícito ou moralizar 'sem sabedoria' como 'tolo'.
