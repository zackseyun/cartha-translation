  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַתָּ֣ה יוֹסִ֣פוּ לַ/חֲטֹ֗א וַ/יַּעְשׂ֣וּ לָ/הֶם֩ מַסֵּכָ֨ה מִ/כַּסְפָּ֤/ם כִּ/תְבוּנָ/ם֙ עֲצַבִּ֔ים מַעֲשֵׂ֥ה חָרָשִׁ֖ים כֻּלֹּ֑/ה לָ/הֶם֙ הֵ֣ם אֹמְרִ֔ים זֹבְחֵ֣י אָדָ֔ם עֲגָלִ֖ים יִשָּׁקֽוּ/ן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/002.yaml
  text: 'And now they keep on sinning: they make cast images for themselves from their silver, idols made according to their own skill—all of it the work of craftsmen. Of them they say[a], “Those who sacrifice human beings kiss calves[b][c].”'
translation:
  language: pt
  text: 'E agora eles continuam pecando: fazem para si imagens fundidas de sua prata, ídolos feitos segundo a sua própria habilidade — tudo obra de artesãos. A respeito deles dizem[a]: “Os que sacrificam seres humanos beijam bezerros[b][c]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “a eles dizem”; a relação de “a eles” com as palavras seguintes é sintaticamente difícil.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “Que os que oferecem sacrifícios beijem bezerros”. Essa leitura entende “ser humano” em sentido genérico como sujeito e atribui ao verbo final força semelhante à do jussivo; a forma massorética é mais naturalmente indicativa: “beijam”.'
    reason: alternative_reading
  - marker: c
    text: Isto é, ídolos em forma de bezerro.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto o valor temporal de עַתָּה como a força conectiva de וְ.
- source_word: יוֹסִפוּ לַחֲטֹא
  choice: eles continuam pecando
  rationale: Expressa a continuação ou repetição do pecado em português natural.
- source_word: וַיַּעְשׂוּ לָהֶם מַסֵּכָה
  choice: fazem para si imagens de metal fundido
  rationale: מַסֵּכָה designa objeto moldado ou fundido; o plural explicita naturalmente o sentido coletivo no contexto dos ídolos.
- source_word: מִכַּסְפָּם
  choice: com a sua prata
  rationale: Indica a matéria da qual as imagens são feitas; esta formulação é idiomática e não perde a ideia de que empregam a própria prata.
- source_word: כִּתְבוּנָם
  choice: segundo a sua própria habilidade
  rationale: No contexto imediato da fabricação e da obra de artesãos, תְּבוּנָה aponta para perícia ou capacidade técnica, com provável ironia.
- source_word: עֲצַבִּים
  choice: ídolos feitos
  rationale: O acréscimo de 'feitos' liga os ídolos ao processo de fabricação já mencionado sem acrescentar uma afirmação alheia ao texto.
- source_word: מַעֲשֵׂה חָרָשִׁים כֻּלֹּה
  choice: tudo obra de artesãos
  rationale: Conserva a ênfase na origem inteiramente humana dos ídolos e o plural 'artesãos'.
- source_word: לָהֶם הֵם אֹמְרִים
  choice: A respeito deles dizem
  rationale: Relaciona a expressão seguinte aos ídolos de forma compreensível, enquanto uma nota registra que o hebraico diz literalmente 'a eles' e é sintaticamente difícil.
- source_word: זֹבְחֵי אָדָם
  choice: Os que sacrificam seres humanos
  rationale: Toma אָדָם como objeto coletivo do particípio, leitura sintaticamente natural do texto massorético, sem restringir o sentido a homens do sexo masculino.
- source_word: עֲגָלִים יִשָּׁקוּן
  choice: beijam bezerros
  rationale: Mantém o indicativo mais natural da forma massorética e preserva a imagem incisiva de Oseias; a referência a ídolos em forma de bezerro é explicada em nota.
theological_decisions:
- issue: Interpretação de זֹבְחֵי אָדָם עֲגָלִים יִשָּׁקוּן
  choice: “Os que sacrificam seres humanos beijam bezerros.”
  alternative: “Que os que oferecem sacrifícios beijem bezerros.”
  rationale: O hebraico é comprimido e admite mais de uma análise. O texto principal segue a leitura em que אָדָם é objeto de 'sacrificam' e o verbo final é indicativo, formalmente a análise mais direta do texto massorético. A leitura genérica e exortativa permanece na nota para não eliminar uma alternativa antiga e plausível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A redação mantém a imagem concreta e a aspereza retórica do hebraico, esclarecendo em notas — sem resolver silenciosamente — a sintaxe notoriamente difícil da frase final.
