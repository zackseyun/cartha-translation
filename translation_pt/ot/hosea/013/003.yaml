base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/003.yaml
  text: Therefore they will be like the morning cloud[a], and like the dew that goes away early, like chaff whirled from the threshing floor, and like smoke from a window.
translation:
  language: pt
  text: Por isso, serão como a nuvem da manhã, como o orvalho que logo desaparece, como a palha varrida da eira pelo vendaval e como a fumaça que sai de uma janela[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de uma abertura com treliça”. O termo hebraico pode designar uma janela ou uma abertura com treliça.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Expressa de modo natural a consequência da acusação e do juízo apresentados no contexto anterior.
- source_word: יִהְיוּ
  choice: serão
  rationale: Reproduz o valor futuro simples do verbo היה e mantém a declaração profética de consequência.
- source_word: כַּעֲנַן בֹּקֶר
  choice: como a nuvem da manhã
  rationale: Preserva a imagem de algo passageiro e sem permanência.
- source_word: וְכַטַּל מַשְׁכִּים הֹלֵךְ
  choice: como o orvalho que logo desaparece
  rationale: Comunica tanto a ideia de desaparecer quanto a rapidez indicada por מַשְׁכִּים, em português corrente e sem ampliar indevidamente a imagem.
- source_word: כְּמֹץ יְסֹעֵר מִגֹּרֶן
  choice: como a palha varrida da eira pelo vendaval
  rationale: מוֹץ designa a palha leve separada na debulha; יְסֹעֵר sugere movimento violento causado por tempestade ou vento forte. A formulação conserva a vivacidade da imagem agrícola.
- source_word: וּכְעָשָׁן מֵאֲרֻבָּה
  choice: e como a fumaça que sai por uma janela
  rationale: Mantém o paralelismo das comparações. אֲרֻבָּה designa uma abertura, frequentemente uma janela, embora também possa indicar uma abertura com treliça; essa alternativa é registrada em nota.
