source:
  edition: WLC
  text: כְּ/דַבֵּ֤ר אֶפְרַ֨יִם֙ רְתֵ֔ת נָשָׂ֥א ה֖וּא בְּ/יִשְׂרָאֵ֑ל וַ/יֶּאְשַׁ֥ם בַּ/בַּ֖עַל וַ/יָּמֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/001.yaml
  text: When Ephraim spoke[a], there was trembling; he was exalted in Israel[b]. But he became guilty through Baal and died.
translation:
  language: pt
  text: Quando Efraim falava, havia tremor; ele se elevou em Israel.[a] Mas tornou-se culpado por causa de Baal[b] e morreu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «ele era exaltado em Israel» ou «tornou-se proeminente em Israel». A frase hebraica é breve e pode ser entendida em sentido passivo/resultativo ou ativo-reflexivo.'
    reason: alternative_reading
  - marker: b
    text: «Por causa de Baal» também pode ser entendido como «por meio de Baal», «por meio do culto a Baal» ou «em associação com Baal».
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדַבֵּר
  choice: Quando ... falava
  rationale: A preposição כְּ com o infinitivo construto de דבר tem valor temporal. O imperfeito português expressa com naturalidade a situação passada associada à fala de Efraim.
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Mantém-se o nome próprio; no contexto de Oseias, ele pode representar o reino do norte, mas essa identificação não deve ser inserida no texto.
- source_word: רְתֵת
  choice: tremor
  rationale: O substantivo indica tremor ou estremecimento. «Tremor» conserva a imagem e não determina se a reação era medo, reverência ou pavor político.
- source_word: נָשָׂא הוּא בְּיִשְׂרָאֵל
  choice: ele era exaltado em Israel
  rationale: A frase hebraica é condensada e admite leitura passiva/resultativa ou ativa-reflexiva. A opção passiva é natural em português e preserva a ideia de elevada posição; a alternativa é registrada em nota.
- source_word: וַיֶּאְשַׁם
  choice: tornou-se culpado
  rationale: אשם comunica tornar-se culpado ou incorrer em culpa. A formulação mantém a força moral e pactual sem acrescentar uma infração específica.
- source_word: בַּבַּעַל
  choice: por meio de Baal
  rationale: A preposição בְּ pode ser instrumental ou associativa. «Por meio de Baal» conserva o nome da divindade e a concisão do original, sem inserir explicitamente «culto» no texto.
- source_word: וַיָּמֹת
  choice: e morreu
  rationale: Reproduz de modo direto a consequência abrupta, sem decidir se a morte é individual e literal, corporativa, política ou espiritual.
theological_decisions:
- issue: A ascensão e a queda de Efraim
  choice: Efraim é apresentado como exaltado em Israel, mas depois culpado por sua relação com Baal, vindo a morrer.
  alternative: Efraim exaltou a si mesmo em Israel; «morreu» pode referir-se à morte corporativa ou política do reino.
  rationale: A tradução conserva a sequência profética de proeminência, culpa e morte, sem explicitar Efraim como o reino do norte nem resolver o caráter da morte.
- issue: Voz e sentido de נָשָׂא
  choice: 'Leitura passiva/resultativa: «era exaltado».'
  alternative: 'Leitura ativa-reflexiva: «exaltou a si mesmo» ou «se engrandeceu».'
  rationale: A construção é breve e sintaticamente ambígua. A leitura principal segue uma interpretação plausível do hebraico, enquanto a nota preserva a alternativa genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a concisão proféticas foram preservadas; as ambiguidades reais relativas a נָשָׂא, à preposição בְּ e ao sentido de «morreu» não foram resolvidas de forma denominacional.
