    issue: Voz de נָשָׂא הוּא
    rationale: A tradução principal «ele era exaltado» é passiva, embora o hebraico apresente o verbo na forma ativa e o pronome explícito «ele». A concisão permite discussão do sentido, mas não justifica transformar a voz verbal na leitura principal.
