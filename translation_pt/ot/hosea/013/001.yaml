    issue: Formulação de בַּבַּעַל
    rationale: «Por meio de Baal» é possível, mas em português sugere mais fortemente que Baal é um instrumento. «Por causa de Baal» comunica de modo mais idiomático a relação que ocasiona a culpa sem acrescentar «culto» ao texto.
