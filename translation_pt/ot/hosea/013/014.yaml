language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מִ/יַּ֤ד שְׁאוֹל֙ אֶפְדֵּ֔/ם מִ/מָּ֖וֶת אֶגְאָלֵ֑/ם אֱהִ֨י דְבָרֶי/ךָ֜ מָ֗וֶת אֱהִ֤י קָֽטָבְ/ךָ֙ שְׁא֔וֹל נֹ֖חַם יִסָּתֵ֥ר מֵ/עֵינָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/014.yaml
  text: From the hand of Sheol I will ransom them[a]; from death I will redeem them. O Death, where are your plagues? O Sheol[c][b], where is your destruction? Compassion will be hidden from my eyes.
translation:
  language: pt
  text: Da mão do Sheol eu os resgatarei[a]; da morte eu os redimirei. Onde estão as suas pragas, ó Morte? Onde está a sua destruição, ó Sheol?[b][c] A compaixão ficará oculta aos meus olhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu os resgatarei da mão do Sheol? Eu os redimirei da morte?” Nesse caso, as linhas iniciais seriam perguntas retóricas de juízo, não promessas de libertação.'
    reason: alternative_reading
  - marker: b
    text: 'O hebraico אֱהִי também pode ser entendido como “serei” ou “que eu seja”: “Serei as suas pragas, ó Morte; serei a sua destruição, ó Sheol”.'
    reason: alternative_reading
  - marker: c
    text: 'Tradução tradicional influenciada pela tradição grega: “Onde está, ó Morte, o seu aguilhão? Onde está, ó Sheol, a sua vitória ou o seu aguilhão?” Compare 1 Coríntios 15:55.'
    reason: cross_reference
lexical_decisions:
- source_word: מִיַּד
  choice: da mão de
  rationale: Preserva a metáfora concreta do hebraico; nesse idioma, “mão” também pode indicar poder ou domínio.
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: Mantém o termo hebraico para o domínio dos mortos, mais amplo que uma sepultura individual, sem identificá-lo automaticamente com conceitos posteriores.
- source_word: אֶפְדֵּם
  choice: eu os resgatarei
  rationale: פדה expressa resgate ou libertação mediante resgate; “resgatarei” também o distingue do verbo גאל no membro paralelo.
- source_word: מִמָּוֶת
  choice: da morte
  rationale: Tradução direta e natural, paralela a “da mão do Sheol”.
- source_word: אֶגְאָלֵם
  choice: eu os redimirei
  rationale: גאל carrega a ideia de reivindicar ou libertar, por vezes com conotações de parentesco e aliança; “redimirei” preserva sua distinção em relação a “resgatarei”.
- source_word: אֱהִי
  choice: onde estão / onde está
  rationale: A forma é ambígua, mas pode introduzir aqui perguntas de desafio dirigidas à Morte e ao Sheol. A leitura “serei” ou “que eu seja” é mantida em nota.
- source_word: דְבָרֶיךָ
  choice: suas pragas
  rationale: No contexto, o substantivo é entendido no sentido de pestes ou pragas, em paralelo com a destruição; evita importar “aguilhão” da tradição grega para o texto principal.
- source_word: קָטָבְךָ
  choice: sua destruição
  rationale: קטב denota destruição ou devastação mortal; “destruição” exprime diretamente o sentido hebraico e corresponde ao paralelismo poético.
- source_word: נֹחַם
  choice: a compaixão
  rationale: O termo pode indicar compaixão, pesar ou disposição de voltar atrás. “Compaixão” comunica que a piedade não intervirá, sem apagar inteiramente a tensão contextual.
- source_word: יִסָּתֵר מֵעֵינָי
  choice: ficará oculta aos meus olhos
  rationale: Reproduz o imperfeito nifal com valor prospectivo e conserva a imagem hebraica de algo retirado da vista divina.
theological_decisions:
- issue: Se as linhas iniciais são promessas de libertação ou perguntas retóricas de juízo
  choice: Declarações de libertação, seguidas por um desafio à Morte e ao Sheol
  alternative: “Eu os resgataria da mão do Sheol? Eu os redimiria da morte?”, perguntas que implicariam recusa de libertação
  rationale: As formas verbais permitem naturalmente declarações na primeira pessoa, e as linhas seguintes podem ser lidas como desafio à Morte e ao Sheol. Contudo, o contexto de juízo admite a leitura interrogativa; por isso, ela é explicitamente preservada em nota.
- issue: Sentido da forma אֱהִי nas interpelações à Morte e ao Sheol
  choice: 'Valor interrogativo: “onde estão?” / “onde está?”'
  alternative: 'Valor verbal ou volitivo: “serei” / “que eu seja”'
  rationale: O paralelismo poético e a antiga recepção do versículo favorecem a leitura interrogativa, mas a forma consonantal hebraica sustenta a alternativa verbal, que altera significativamente o sentido e deve permanecer visível.
translation_notes:
  register: Português atual, digno e de leitura ampla, com sintaxe poética clara. “Sheol” foi preservado e pode exigir apoio editorial em glossário. As personificações “Morte” e “Sheol” recebem maiúsculas por serem diretamente interpeladas. A formulação mantém as ambiguidades textuais relevantes em notas, sem impor uma harmonização denominacional.
