  yaml_path: translation/ot/hosea/013/007.yaml
  text: So I became to them like a lion[a]; like a leopard I lurked by the way.
translation:
  language: pt
  text: Assim, tornei-me para eles como um leão; como um leopardo, fiquei à espreita junto ao caminho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como um leopardo, vigiei junto ao caminho” ou “como um leopardo, fiquei de tocaia à beira da estrada”. A palavra final é difícil e pode ser entendida como um verbo na primeira pessoa, com o sentido de vigiar ou ficar à espreita, em vez do nome geográfico “Assíria”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֱהִי
  choice: Por isso, tornei-me
  rationale: O wayyiqtol qal na primeira pessoa do singular de היה admite sentido ingressivo, “tornei-me”. “Por isso” expressa naturalmente a força resultativa do waw no contexto do juízo.
- source_word: לָהֶם
  choice: para eles
  rationale: A preposição ל com sufixo indica a relação de Deus para com o povo; “para eles” é natural com “tornei-me”.
- source_word: כְּמוֹ שָׁחַל
  choice: como um leão
  rationale: כְּמוֹ introduz a comparação, e שָׁחַל designa um leão, possivelmente com ênfase em sua ferocidade. A tradução geral “leão” é clara e não acrescenta uma especificação etária incerta.
- source_word: כְּנָמֵר
  choice: como um leopardo
  rationale: נָמֵר é o felino predador malhado tradicionalmente identificado como leopardo; a escolha mantém a imagem zoológica direta.
- source_word: עַל דֶּרֶךְ
  choice: junto ao caminho
  rationale: A expressão situa o predador numa posição de emboscada ao lado de uma rota transitada. “Junto ao caminho” é corrente e preserva essa imagem.
- source_word: אָשׁוּר
  choice: fiquei à espreita
  rationale: Embora a grafia também corresponda a “Assíria”, o paralelismo dos predadores e o contexto favorecem uma leitura verbal na primeira pessoa, ligada à ideia de observar ou espreitar. “Fiquei à espreita” comunica naturalmente a emboscada sem eliminar a dificuldade textual, registrada em nota.
theological_decisions:
- issue: Descrição antropomórfica de Deus como predador no juízo
  choice: Manter diretamente as comparações “como um leão” e “como um leopardo” e a ação de ficar à espreita.
  alternative: Abrandar a imagem com uma formulação como “vigiei junto ao caminho”.
  rationale: O hebraico apresenta Deus por meio de imagens severas de um predador que executa juízo. A tradução preserva a força e a tensão teológica do texto, sem suavizá-las.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Fiquei à espreita” conserva a intensidade da imagem predatória sem soar excessivamente arcaico; a nota mantém visível a ambiguidade lexical da palavra final.
