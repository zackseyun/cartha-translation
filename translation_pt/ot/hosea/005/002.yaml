  text: וְ/שַׁחֲטָ֥ה שֵׂטִ֖ים הֶעְמִ֑יקוּ וַ/אֲנִ֖י מוּסָ֥ר לְ/כֻלָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/002.yaml
  text: The rebels have gone deep into slaughter[b][a], but I am a rebuke to all of them.
translation:
  language: pt
  text: Os rebeldes se aprofundaram na matança[a], mas eu sou disciplina para todos eles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Os que se desviaram se aprofundaram na matança”.'
    reason: lexical_alternative
  - marker: b
    text: O termo também pode significar “correção”, “repreensão” ou “instrução”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁחֲטָה
  choice: na matança
  rationale: O substantivo indica matança ou morticínio. Com o verbo seguinte, “na matança” conserva a imagem de aprofundamento na violência, sem introduzir a ideia textual de uma cova.
- source_word: שֵׂטִים
  choice: os rebeldes
  rationale: O termo raro descreve os que se desviam ou se afastam. “Rebeldes” comunica em português atual a força moral e religiosa da acusação profética sem recorrer ao tom mais técnico de “apóstatas”.
- source_word: הֶעְמִיקוּ
  choice: se afundaram
  rationale: A forma verbal significa literalmente “fizeram profundo” e, neste contexto, expressa envolvimento intenso no mal. “Se afundaram” preserva a metáfora e soa natural em português.
- source_word: וַאֲנִי
  choice: mas eu
  rationale: Embora a conjunção também possa ser traduzida por “e”, o valor adversativo explicita naturalmente o contraste contextual entre a corrupção dos rebeldes e a resposta do SENHOR.
- source_word: מוּסָר
  choice: disciplinarei
  rationale: O substantivo pode indicar disciplina, correção, repreensão ou instrução. A forma verbal em português transmite de modo natural, no contexto, a ação corretiva anunciada, enquanto a nota registra a construção nominal incomum do hebraico.
- source_word: לְכֻלָּם
  choice: todos eles
  rationale: A expressão indica que a disciplina divina alcança a totalidade do grupo acusado; a relação marcada pela preposição hebraica fica idiomaticamente incorporada ao verbo português.
theological_decisions:
- issue: Identidade do falante e natureza da resposta divina
  choice: O SENHOR anuncia que disciplinará todos os rebeldes.
  alternative: 'A cláusula pode ser entendida de modo nominal e mais pedagógico: “eu sou disciplina/correção/instrução para todos eles”.'
  rationale: O contexto imediato de acusação e juízo favorece a ideia de disciplina corretiva, mas a nota preserva a amplitude semântica de מוּסָר e a tensão entre punição, correção e instrução.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Se afundaram” mantém a metáfora hebraica; a formulação verbal da segunda oração evita uma construção nominal pouco natural em português, e a nota preserva sua forma e ambiguidade.
