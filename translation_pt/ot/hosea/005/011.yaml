  text: עָשׁ֥וּק אֶפְרַ֖יִם רְצ֣וּץ מִשְׁפָּ֑ט כִּ֣י הוֹאִ֔יל הָלַ֖ךְ אַחֲרֵי צָֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/011.yaml
  text: Ephraim is oppressed, crushed in judgment, because he was determined to walk after filth.
translation:
  language: pt
  text: 'Efraim está oprimido,

    esmagado no juízo,

    porque decidiu seguir um mandamento.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico preservado diz «andar após uma ordem» ou «um mandamento». Como a palavra é incomum neste contexto, alguns propõem uma forma hebraica diferente e traduzem «seguir a imundície»; outros entendem uma referência a ídolos.
    reason: Registra a dificuldade textual sem apresentar como literal uma tradução idiomática e sem tratar uma emenda conjectural como leitura do texto principal.
lexical_decisions:
- source_word: עָשׁוּק (ʿāšûq)
  choice: oprimido
  rationale: O particípio passivo descreve Efraim como vítima de opressão; “oprimido” é direto, natural e mantém a força do hebraico.
- source_word: רְצוּץ מִשְׁפָּט (rəṣûṣ mišpāṭ)
  choice: esmagado pelo juízo
  rationale: רְצוּץ significa “esmagado/quebrado”. מִשְׁפָּט pode indicar juízo, justiça ou processo judicial; “pelo juízo” preserva a formulação concisa e a possibilidade de o juízo ser o âmbito ou instrumento do esmagamento.
- source_word: הוֹאִיל (hôʾîl)
  choice: decidiu
  rationale: Neste contexto, o verbo expressa disposição deliberada ou determinação. “Decidiu” comunica escolha voluntária sem acrescentar a intensidade de “persistiu”.
- source_word: צָו (ṣāw)
  choice: mandamento
  rationale: O texto massorético traz צָו, “ordem/mandamento/preceito”. Embora a expressão seja incomum e haja propostas de correção textual, a tradução principal segue a evidência hebraica preservada.
theological_decisions:
- issue: Objeto seguido por Efraim em צָו
  choice: mandamento
  alternative: imundície; ídolo
  rationale: “Mandamento” traduz o texto consonantal e vocalizado da WLC sem adotar uma emenda conjectural. A nota reconhece a dificuldade e as alternativas, preservando a ambiguidade textual sem transformar uma conjectura em afirmação teológica.
- issue: Sentido de מִשְׁפָּט
  choice: juízo
  alternative: justiça; em seu direito
  rationale: “Juízo” mantém aberta a tensão entre castigo judicial e justiça que foi esmagada, em vez de definir silenciosamente qual leitura contextual é exclusiva.
translation_notes:
  register: Português moderno, claro e digno, com disposição poética em três linhas. “Efraim” segue o uso bíblico corrente; “mandamento” é amplamente compreensível e conserva o dado lexical do texto massorético.
