  text: הָיוּ֙ שָׂרֵ֣י יְהוּדָ֔ה כְּ/מַסִּיגֵ֖י גְּב֑וּל עֲלֵי/הֶ֕ם אֶשְׁפּ֥וֹךְ כַּ/מַּ֖יִם עֶבְרָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/010.yaml
  text: The princes of Judah have become like those who move a boundary marker[a]; on them I will pour out my wrath like water.
translation:
  language: pt
  text: Os príncipes de Judá se tornaram como os que deslocam um marco de divisa[a]; sobre eles derramarei como água a minha ira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como os que removem uma linha divisória”. A imagem pode se referir literalmente à alteração dos limites de uma propriedade ou, em sentido figurado, à violação dos limites estabelecidos por Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיוּ
  choice: se tornaram
  rationale: O qatal de היה pode indicar um estado resultante; “se tornaram” expressa que os príncipes vieram a agir como violadores de limites.
- source_word: שָׂרֵי יְהוּדָה
  choice: os príncipes de Judá
  rationale: שָׂרִים designa governantes, príncipes ou altos oficiais; “príncipes” preserva o sentido político elevado e é natural no registro profético.
- source_word: כְּמַסִּיגֵי גְּבוּל
  choice: como os que deslocam um marco de divisa
  rationale: A expressão evoca a alteração ilícita dos limites de uma propriedade; a formulação mantém concreta a imagem jurídica e territorial.
- source_word: גְּבוּל
  choice: marco de divisa
  rationale: Embora possa significar limite ou fronteira, neste idioma o termo sugere o marco que delimita uma propriedade.
- source_word: עֲלֵיהֶם
  choice: sobre eles
  rationale: Tradução direta da preposição com o pronome, indicando os destinatários do juízo.
- source_word: אֶשְׁפּוֹךְ
  choice: derramarei
  rationale: O verbo preserva a metáfora vívida de ira vertida em abundância.
- source_word: כַּמַּיִם
  choice: como água
  rationale: Mantém a comparação expressa no hebraico sem acrescentar a imagem específica de uma inundação.
- source_word: עֶבְרָתִי
  choice: a minha ira
  rationale: עֶבְרָה denota ira intensa; “ira” é conciso, solene e adequado à linguagem profética de juízo.
theological_decisions:
- issue: Natureza da acusação contra os governantes de Judá
  choice: Preservar a imagem concreta da deslocação de um marco de divisa sem definir se a acusação é literal ou figurada.
  alternative: Entender exclusivamente como apropriação de terras, transgressão moral dos limites estabelecidos por Deus ou invasão política de fronteiras tribais.
  rationale: A imagem evoca uma conhecida violação dos direitos territoriais, mas pode ser aplicada por Oseias a uma transgressão mais ampla da aliança. A tradução conserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Marco de divisa” mantém a imagem concreta e jurídica sem linguagem excessivamente técnica; a ordem “derramarei como água a minha ira” preserva a associação direta entre o ato de derramar e a comparação hebraica.
