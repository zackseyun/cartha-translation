  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בְּ/צֹאנָ֣/ם וּ/בִ/בְקָרָ֗/ם יֵֽלְכ֛וּ לְ/בַקֵּ֥שׁ אֶת יְהוָ֖ה וְ/לֹ֣א יִמְצָ֑אוּ חָלַ֖ץ מֵ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/006.yaml
  text: With their flocks and with their herds they will go to seek Yahweh[a], but they will not find him[b]; he has withdrawn from them.
translation:
  language: pt
  text: Com seus rebanhos e com seu gado[a], eles irão buscar Yahweh, mas não o encontrarão; ele se retirou deles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A menção dos rebanhos e do gado provavelmente indica que eles iriam buscar Yahweh levando animais para sacrifício.
    reason: cultural_note
  - marker: b
    text: 'Ou: “ele se afastou deles” ou “ele se removeu deles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֹאנָם
  choice: com seus rebanhos
  rationale: צֹאן designa o gado miúdo, sobretudo ovelhas e cabras; “rebanhos” é um coletivo natural em português, e בְּ indica aqui acompanhamento.
- source_word: וּבִבְקָרָם
  choice: e seu gado
  rationale: בָּקָר designa bovinos ou gado de grande porte. “Gado” preserva de modo claro e natural o contraste com “rebanhos”.
- source_word: יֵלְכוּ
  choice: eles irão
  rationale: O imperfeito qal de terceira pessoa do plural tem sentido futuro natural neste discurso profético.
- source_word: לְבַקֵּשׁ
  choice: buscar
  rationale: בקש significa procurar ou buscar e, neste contexto religioso, conserva a ideia de procurar acesso e favor junto a Deus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְלֹא יִמְצָאוּ
  choice: mas não o encontrarão
  rationale: A conjunção tem força adversativa no contexto. O pronome “o”, implícito em hebraico por continuidade sintática, é necessário para a clareza idiomática em português.
- source_word: חָלַץ מֵהֶם
  choice: ele se retirou deles
  rationale: חלץ pode expressar afastar-se ou remover-se. “Se retirou deles” comunica a ruptura relacional e judicial sem explicar além do que o texto afirma; o perfeito indica uma ação consumada com efeito presente.
theological_decisions:
- issue: Tradução do nome divino
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico emprega diretamente יְהוָה. “Yahweh” preserva o nome pactual em vez de substituí-lo por um título.
- issue: Natureza da busca de Israel
  choice: Manter no texto a busca acompanhada de rebanhos e gado, explicando em nota a provável dimensão sacrificial
  alternative: Explicitar no corpo do versículo que eles levam animais para sacrifício
  rationale: A presença dos animais sugere fortemente uma aproximação sacrificial, mas essa finalidade não é declarada de maneira explícita no hebraico. A nota preserva a implicação cultural sem convertê-la em afirmação textual.
- issue: Sentido de חָלַץ מֵהֶם
  choice: ele se retirou deles
  alternative: ele se afastou deles; ele se removeu deles
  rationale: A formulação conserva a imagem de Deus tornando-se inacessível à busca ritual, sem resolver de modo excessivo a amplitude lexical do verbo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente naturalizada sem perder o paralelismo entre rebanhos e gado. Os marcadores foram posicionados junto às afirmações que cada nota esclarece.
