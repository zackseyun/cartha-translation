id: HOS.5.7
reference: Hosea 5:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בַּ/יהוָ֣ה בָּגָ֔דוּ כִּֽי בָנִ֥ים זָרִ֖ים יָלָ֑דוּ עַתָּ֛ה יֹאכְלֵ֥/ם חֹ֖דֶשׁ אֶת חֶלְקֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/007.yaml
  text: They have dealt faithlessly with Yahweh[a], for they have borne foreign children[b]. Now the new moon will devour them with their portions.
translation:
  language: pt
  text: Eles foram infiéis ao SENHOR, pois geraram filhos estrangeiros[b]. Agora a lua nova os devorará com as porções deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Agora, um mês os devorará, junto com as porções deles”. A palavra hebraica חֹדֶשׁ pode significar tanto “lua nova” como “mês”.'
    reason: alternative_reading
  - marker: b
    text: “Filhos estrangeiros” pode se referir a filhos de uniões contrárias à aliança ou, de modo mais amplo, a uma geração afastada do SENHOR.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיהוָה
  choice: ao SENHOR
  rationale: Com בגד, a preposição ב indica aquele contra quem se comete a infidelidade. “SENHOR” segue a convenção portuguesa tradicional para o nome divino YHWH.
- source_word: בָּגָדוּ
  choice: foram infiéis
  rationale: בגד expressa traição ou infidelidade, aqui com força relacional e pactual. A formulação é natural e digna em português.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da acusação anterior.
- source_word: בָנִים זָרִים
  choice: filhos estrangeiros
  rationale: Preserva a imagem e a ambiguidade de זָרִים, sem restringi-la indevidamente à ilegitimidade, à etnia ou à alienação espiritual.
- source_word: יָלָדוּ
  choice: geraram
  rationale: Verbo parental abrangente em português, sem especificar exclusivamente a perspectiva materna ou paterna.
- source_word: עַתָּה
  choice: Agora
  rationale: Mantém a iminência profética da consequência.
- source_word: יֹאכְלֵם
  choice: os devorará
  rationale: Embora אכל signifique literalmente “comer”, “devorar” comunica naturalmente o consumo destrutivo da imagem de juízo.
- source_word: חֹדֶשׁ
  choice: a lua nova
  rationale: חֹדֶשׁ pode significar “lua nova” ou “mês”. A leitura principal preserva a possível ressonância cultual do calendário festivo em Oseias; a alternativa temporal aparece em nota.
- source_word: חֶלְקֵיהֶם
  choice: as porções deles
  rationale: חלק pode designar porções, propriedades ou parcelas atribuídas. “Porções” mantém o sentido amplo sem especificar apenas terras ou heranças.
theological_decisions:
- issue: Sentido de “filhos estrangeiros”
  choice: Manter a expressão concreta e ambígua, com possível referência a filhos marcados por afastamento da aliança.
  alternative: Filhos de uniões com estrangeiros; filhos ilegítimos; ou, metaforicamente, uma geração afastada do SENHOR.
  rationale: O texto profético não deve ser reduzido a uma afirmação puramente étnica nem ter sua imagem familiar espiritualizada de modo definitivo.
- issue: Sentido de חֹדֶשׁ na declaração de juízo
  choice: “a lua nova”, preservando uma possível alusão cultual ao ciclo festivo.
  alternative: “um mês”, indicando que o juízo virá em breve.
  rationale: Os dois sentidos são lexicalmente possíveis; a nota conserva a alternativa temporal sem eliminar a tensão do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Foram infiéis” comunica a dimensão pactual sem arcaísmo; “geraram” evita limitar o sujeito a mães ou pais. Os marcadores foram posicionados imediatamente após as expressões às quais suas notas se referem.
