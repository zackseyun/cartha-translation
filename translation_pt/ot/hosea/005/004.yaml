  source_fidelity: 'A tradução reproduz com fidelidade a sequência e o sentido do hebraico: os atos impedem o retorno a Deus; um espírito de prostituição está interiormente presente; e o povo não conhece Yahweh. “Voltar” conserva a abertura semântica de שׁוּב, inclusive sua ressonância pactual, sem a reduzir a “arrepender-se”.'
