id: HOS.5.4
reference: Hosea 5:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לֹ֤א יִתְּנוּ֙ מַ֣עַלְלֵי/הֶ֔ם לָ/שׁ֖וּב אֶל אֱלֹֽהֵי/הֶ֑ם כִּ֣י ר֤וּחַ זְנוּנִים֙ בְּ/קִרְבָּ֔/ם וְ/אֶת יְהוָ֖ה לֹ֥א יָדָֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/004.yaml
  text: Their deeds do not allow them to return to their God[a], for a spirit of whoredom is within them, and they do not know Yahweh.
translation:
  language: pt
  text: Seus atos não lhes permitem voltar para o seu Deus, pois há dentro deles um espírito de prostituição[a], e eles não conhecem Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um espírito de devassidão” ou “um espírito de prostituições”. O hebraico emprega a imagem da infidelidade sexual para falar da infidelidade à aliança e da idolatria.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְּנוּ
  choice: permitem
  rationale: No idioma hebraico, o sentido contextual é que os atos deles não dão lugar nem possibilidade ao retorno; “permitem” comunica isso naturalmente em português.
- source_word: מַעַלְלֵיהֶם
  choice: seus atos
  rationale: Expressa as ações ou práticas do povo e conserva o peso moral da acusação profética.
- source_word: לָשׁוּב
  choice: voltar
  rationale: Preserva tanto a ideia de retorno quanto sua ressonância de arrependimento e restauração da aliança, sem explicitar apenas uma dessas dimensões.
- source_word: אֶל אֱלֹהֵיהֶם
  choice: para o seu Deus
  rationale: Embora אֱלֹהִים possa ter forma plural, o contexto da aliança aponta para o Deus de Israel, de quem o povo se afastou.
- source_word: רוּחַ זְנוּנִים
  choice: um espírito de prostituição
  rationale: Mantém a forte metáfora sexual de infidelidade à aliança e idolatria, em linguagem atual e compreensível em português.
- source_word: בְּקִרְבָּם
  choice: dentro deles
  rationale: Comunica que a corrupção moral e espiritual está arraigada no interior do povo, preservando o sentido contextual da expressão.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: לֹא יָדָעוּ
  choice: não conhecem
  rationale: É uma tradução direta que preserva a profundidade relacional e pactual de ידע sem reduzi-la a simples cognição, reconhecimento ou obediência.
theological_decisions:
- issue: Metáfora profética de infidelidade sexual
  choice: espírito de prostituição
  alternative: espírito de devassidão; espírito de prostituições
  rationale: “Prostituição” conserva a imagem chocante usada por Oseias para a idolatria e a quebra da aliança, sendo mais corrente no português moderno do que alternativas arcaicas.
- issue: Sentido pactual de “conhecer”
  choice: não conhecem Yahweh
  alternative: não reconhecem Yahweh; não têm relacionamento com Yahweh
  rationale: A formulação direta preserva conjuntamente as dimensões de conhecimento, relação e fidelidade, sem resolver a tensão mediante paráfrase.
- issue: Referente de אֱלֹהֵיהֶם
  choice: seu Deus, no singular
  alternative: seus deuses
  rationale: No contexto da acusação pactual, trata-se do retorno ao verdadeiro Deus de Israel, e não aos deuses idolátricos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe permanece próxima do paralelismo hebraico, enquanto “não lhes permitem voltar” verte naturalmente o idioma com נתן. O marcador [a] aparece imediatamente após a expressão a que se refere.
