  terminology: “Seu Deus” reflete adequadamente o singular contextual de אֱלֹהֵיהֶם; “Yahweh” mantém o nome divino de modo consistente; e “não conhecem” preserva o valor relacional-pactual de ידע. “Espírito de prostituição” conserva, em linguagem atual, a imagem sexual de infidelidade que o texto emprega.
