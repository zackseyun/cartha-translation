  text: אֵלֵ֤ךְ אָשׁ֨וּבָה֙ אֶל מְקוֹמִ֔/י עַ֥ד אֲשֶֽׁר יֶאְשְׁמ֖וּ וּ/בִקְשׁ֣וּ פָנָ֑/י בַּ/צַּ֥ר לָ/הֶ֖ם יְשַׁחֲרֻֽ/נְנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/015.yaml
  text: I will go[a], I will return to my place until they acknowledge their guilt and seek my face[b]; in their distress they will seek me earnestly.
translation:
  language: pt
  text: Irei, voltarei ao meu lugar, até que reconheçam sua culpa[a] e busquem a minha face; na angústia deles, eles me buscarão com empenho.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “carreguem sua culpa” ou “sejam considerados culpados”. O verbo hebraico pode indicar culpa incorrida ou reconhecida; o contexto de buscar a Deus favorece “reconheçam sua culpa”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “eles me buscarão cedo”. A expressão hebraica provavelmente comunica uma busca diligente e intensa, não apenas realizada nas primeiras horas do dia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֵךְ
  choice: Irei
  rationale: O Qal na primeira pessoa expressa simplesmente movimento. “Irei” preserva a sequência hebraica sem explicitar além do texto a natureza da retirada.
- source_word: אָשׁוּבָה
  choice: voltarei
  rationale: שׁוב significa comumente “voltar” ou “retornar”. “Voltarei” combina naturalmente com “ao meu lugar” e mantém o paralelismo verbal.
- source_word: מְקוֹמִי
  choice: meu lugar
  rationale: A tradução direta preserva a imagem espacial da retirada divina sem especificar “morada”, “casa” ou outro referente não expresso no hebraico.
- source_word: עַד אֲשֶׁר
  choice: até que
  rationale: A locução introduz o limite temporal da retirada e é reproduzida de modo natural em português.
- source_word: יֶאְשְׁמוּ
  choice: reconheçam sua culpa
  rationale: O verbo אשם pode indicar culpa incorrida, culpa suportada ou reconhecimento da culpa. As ações subsequentes de buscar a face de Deus favorecem aqui o reconhecimento da culpa, sem ocultar as alternativas em nota.
- source_word: וּבִקְשׁוּ פָנַי
  choice: e busquem a minha face
  rationale: A expressão idiomática refere-se a buscar a presença ou o favor de alguém. A formulação literal permanece inteligível em português e conserva a imagem bíblica.
- source_word: בַּצַּר לָהֶם
  choice: na sua angústia
  rationale: A expressão indica a circunstância em que a aflição lhes sobrevém. “Na sua angústia” é uma equivalência portuguesa natural e concisa.
- source_word: יְשַׁחֲרֻנְנִי
  choice: eles me buscarão com empenho
  rationale: No Piel, שׁחר pode evocar a busca feita cedo, mas frequentemente comunica diligência e intensidade. “Com empenho” transmite esse valor idiomático sem impor uma referência meramente cronológica.
theological_decisions:
- issue: Sentido da retirada divina
  choice: Deus se retira e volta ao seu lugar até que o povo reconheça a culpa e o busque.
  alternative: Entender a declaração como abandono total ou, no extremo oposto, apenas como mudança na percepção humana.
  rationale: Os verbos de movimento apresentam uma retirada divina em contexto de juízo, mas o versículo não define sua natureza metafísica. A tradução mantém a imagem e a tensão sem acrescentar uma explicação sistemática.
- issue: Valor de יֶאְשְׁמוּ
  choice: reconheçam sua culpa
  alternative: “carreguem sua culpa” ou “sejam considerados culpados”
  rationale: O contexto de busca por Deus favorece uma resposta de reconhecimento, mas a amplitude semântica do verbo é preservada na nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Conserva-se a expressão bíblica “buscar a minha face”, enquanto “com empenho” comunica de forma natural a intensidade do último verbo. Os marcadores foram colocados junto às palavras a que suas respectivas notas se referem.
