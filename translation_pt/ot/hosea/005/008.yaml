source:
  edition: WLC
  text: תִּקְע֤וּ שׁוֹפָר֙ בַּ/גִּבְעָ֔ה חֲצֹצְרָ֖ה בָּ/רָמָ֑ה הָרִ֨יעוּ֙ בֵּ֣ית אָ֔וֶן אַחֲרֶ֖י/ךָ בִּנְיָמִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/008.yaml
  text: 'Blow the horn in Gibeah[a], the trumpet in Ramah; raise the battle cry at Beth-aven: “Behind you[b], Benjamin!”'
translation:
  language: pt
  text: 'Toquem a trombeta de chifre em Gibeá, a trombeta em Ramá; deem o grito de alarme em Bete-Áven[a]: “Atrás de você, Benjamim!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bete-Áven provavelmente é um nome polêmico para Betel; pode sugerir “casa da maldade” ou “casa da vaidade”.
    reason: cultural_note
  - marker: b
    text: 'Ou: “Soem o alarme em Bete-Áven: ‘O inimigo está atrás de você, Benjamim!’”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְעוּ
  choice: Toquem
  rationale: O imperativo plural de תקע refere-se a fazer soar um instrumento; “toquem” é natural em português e rege adequadamente os dois instrumentos no paralelismo.
- source_word: שׁוֹפָר
  choice: trombeta de chifre
  rationale: Identifica o instrumento feito de chifre e mantém sua distinção em relação à trombeta metálica חֲצֹצְרָה.
- source_word: בַּגִּבְעָה
  choice: em Gibeá
  rationale: Reproduz naturalmente a preposição e o topônimo.
- source_word: חֲצֹצְרָה
  choice: a trombeta
  rationale: Designa a trombeta metálica, distinta do שׁוֹפָר; o verbo fica subentendido pelo paralelismo hebraico e também funciona naturalmente em português.
- source_word: בָּרָמָה
  choice: em Ramá
  rationale: Mantém o paralelismo geográfico com “em Gibeá”.
- source_word: הָרִיעוּ
  choice: deem o grito de alarme
  rationale: No contexto militar, o hifil imperativo transmite a ideia de lançar um brado de advertência; a formulação preserva tanto o ato vocal quanto sua função de alarme.
- source_word: בֵּית אָוֶן
  choice: Bete-Áven
  rationale: Preserva o topônimo hebraico, em vez de substituí-lo interpretativamente por Betel ou por uma tradução de seu sentido polêmico.
- source_word: אַחֲרֶיךָ
  choice: Atrás de você
  rationale: Mantém a expressão abrupta e exclamativa do hebraico, provavelmente um aviso de perigo vindo pela retaguarda, sem inserir explicitamente “o inimigo” no texto principal.
- source_word: בִּנְיָמִין
  choice: Benjamim
  rationale: Forma portuguesa tradicional do nome, aqui usada como vocativo dirigido à tribo ou ao seu território.
theological_decisions:
- issue: Identificação de בֵּית אָוֶן como designação polêmica de Betel
  choice: Manter “Bete-Áven” no texto principal e explicar a provável alusão em nota.
  alternative: Traduzir como “casa da maldade/vaidade” ou substituir diretamente por “Betel”.
  rationale: O texto hebraico apresenta um nome próprio, enquanto a nota permite conservar sua provável força polêmica sem apagar a forma textual nem tornar certa uma identificação interpretativa.
- issue: Sentido da exclamação אַחֲרֶיךָ בִּנְיָמִין
  choice: 'Preservar a formulação elíptica: “Atrás de você, Benjamim!”'
  alternative: 'Explicitar: “O inimigo está atrás de você, Benjamim!”'
  rationale: A expressão hebraica não nomeia o sujeito implícito. A tradução principal conserva essa concisão e ambiguidade, enquanto a nota registra a leitura contextual provável.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Trombeta de chifre” evita a transliteração pouco transparente “shofar” e distingue os dois instrumentos. A sintaxe breve e os imperativos preservam a urgência do aviso militar.
