source:
  edition: WLC
  text: שִׁמְעוּ זֹ֨את הַ/כֹּהֲנִ֜ים וְ/הַקְשִׁ֣יבוּ בֵּ֣ית יִשְׂרָאֵ֗ל וּ/בֵ֤ית הַ/מֶּ֨לֶךְ֙ הַאֲזִ֔ינוּ כִּ֥י לָ/כֶ֖ם הַ/מִּשְׁפָּ֑ט כִּֽי פַח֙ הֱיִיתֶ֣ם לְ/מִצְפָּ֔ה וְ/רֶ֖שֶׁת פְּרוּשָׂ֥ה עַל תָּבֽוֹר־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/001.yaml
  text: Hear this[a], O priests; pay attention, house of Israel; and give ear, house of the king. For the judgment is for you[b], because you have been a trap at Mizpah and a net spread out upon Tabor.
translation:
  language: pt
  text: 'Ouçam isto, sacerdotes;

    casa de Israel, prestem atenção;

    e casa do rei, deem ouvidos.

    Pois o julgamento diz respeito a vocês[a],

    porque vocês foram uma armadilha em Mispá

    e uma rede estendida sobre o Tabor[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o julgamento é contra vocês”. A expressão hebraica é compacta e pode indicar tanto que o julgamento lhes diz respeito quanto que é dirigido contra eles.'
    reason: alternative_reading
  - marker: b
    text: Mispá e Tabor são nomes de lugares, provavelmente evocados aqui como locais conhecidos em Israel e associados à imagem de capturar com armadilha e rede.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Ouçam
  rationale: Imperativo plural que introduz a convocação profética com linguagem atual e direta.
- source_word: הַקְשִׁיבוּ
  choice: prestem atenção
  rationale: Distingue este segundo chamado do primeiro e expressa a ideia intensiva de ouvir atentamente.
- source_word: הַאֲזִינוּ
  choice: deem ouvidos
  rationale: Mantém um terceiro verbo de audição, reproduzindo a progressão retórica do hebraico em registro digno.
- source_word: בֵּית יִשְׂרָאֵל
  choice: casa de Israel
  rationale: Preserva a expressão coletiva e pactual do hebraico; a formulação com “vocês da” permite manter naturalmente o imperativo plural.
- source_word: בֵּית הַמֶּלֶךְ
  choice: casa do rei
  rationale: Conserva o paralelismo com “casa de Israel” e não restringe o referente à corte ou à dinastia, embora ambas sejam possibilidades contextuais.
- source_word: כִּי לָכֶם הַמִּשְׁפָּט
  choice: Pois o julgamento diz respeito a vocês
  rationale: Reproduz a formulação compacta sem decidir por completo se o julgamento apenas lhes concerne ou se é explicitamente dirigido contra eles; a nota registra a leitura adversativa.
- source_word: מִּשְׁפָּט
  choice: julgamento
  rationale: No contexto acusatório, designa uma ação ou decisão judicial, não apenas justiça em sentido abstrato.
- source_word: פַח
  choice: armadilha
  rationale: Termo moderno e claro para um dispositivo destinado a capturar uma presa.
- source_word: לְמִצְפָּה
  choice: em Mispá
  rationale: Interpreta a preposição idiomaticamente como localização junto ao nome de lugar, sem explicar além do texto.
- source_word: רֶשֶׁת פְּרוּשָׂה
  choice: uma rede estendida
  rationale: Mantém a imagem concreta e a construção descritiva do hebraico.
- source_word: עַל תָּבוֹר
  choice: sobre o Tabor
  rationale: Preserva a preposição e o sentido topográfico associado ao monte Tabor.
theological_decisions:
- issue: Relação dos grupos interpelados com o julgamento
  choice: Os sacerdotes, a casa de Israel e a casa do rei são apresentados como responsáveis e sujeitos ao julgamento, sem tornar a frase mais explícita do que o hebraico.
  alternative: Traduzir diretamente “o julgamento é contra vocês”, explicitando condenação.
  rationale: As imagens de armadilha e rede indicam culpa e força adversativa, mas a expressão hebraica לָכֶם הַמִּשְׁפָּט é compacta e também pode significar que o julgamento ou caso judicial lhes diz respeito. O texto principal preserva essa tensão, e a nota apresenta a alternativa.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. Os três imperativos de audição foram diferenciados para conservar a progressão retórica. A inclusão de “vocês da” antes das duas expressões coletivas mantém naturalmente o plural dos verbos hebraicos sem abandonar “casa de Israel” e “casa do rei”.
