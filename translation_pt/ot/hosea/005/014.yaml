  text: כִּ֣י אָנֹכִ֤י כַ/שַּׁ֨חַל֙ לְ/אֶפְרַ֔יִם וְ/כַ/כְּפִ֖יר לְ/בֵ֣ית יְהוּדָ֑ה אֲנִ֨י אֲנִ֤י אֶטְרֹף֙ וְ/אֵלֵ֔ךְ אֶשָּׂ֖א וְ/אֵ֥ין מַצִּֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/014.yaml
  text: For I am like a lion to Ephraim[a], and like a young lion to the house of Judah; I, I myself, will tear and go away; I will carry off[b], and there is no one to rescue.
translation:
  language: pt
  text: Pois eu sou como um leão para Efraim[a] e como um leão jovem para a casa de Judá. Eu, eu mesmo, despedaçarei e irei embora; levarei, e não há quem resgate[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico também pode sugerir um leão forte ou feroz.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e ninguém pode livrar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַּׁחַל
  choice: leão
  rationale: O termo designa um leão, possivelmente com ênfase em força ou ferocidade. “Leão” preserva a imagem sem explicitar além do hebraico.
- source_word: כְּפִיר
  choice: leão novo
  rationale: O termo costuma indicar um leão jovem. “Leão novo” é natural, mantém a força predatória e preserva o paralelismo poético.
- source_word: לְאֶפְרַיִם
  choice: para Efraim
  rationale: A preposição marca a relação do predador com o alvo do juízo; “para Efraim” reproduz essa relação com clareza.
- source_word: לְבֵית יְהוּדָה
  choice: para a casa de Judá
  rationale: “Casa de Judá” conserva a expressão corporativa hebraica para o povo ou reino de Judá.
- source_word: אֲנִי אֲנִי
  choice: Eu, eu mesmo
  rationale: A repetição enfática do pronome é mantida em português, preservando a insistência de que o próprio Deus executará o juízo.
- source_word: אֶטְרֹף
  choice: despedaçarei
  rationale: No contexto da metáfora do leão, o verbo descreve a ação de dilacerar a presa. “Despedaçarei” comunica essa violência predatória e deixa o objeto implícito, como no hebraico.
- source_word: וְאֵלֵךְ
  choice: e irei embora
  rationale: Depois de atacar, o predador se afasta. “Irei embora” expressa esse movimento de modo natural.
- source_word: אֶשָּׂא
  choice: carregarei a presa
  rationale: O verbo pode significar levantar, levar ou carregar. A presa não é nomeada no hebraico, mas é o objeto implícito na imagem; sua explicitação em português torna a cena natural sem mudar o referente.
- source_word: וְאֵין מַצִּיל
  choice: e ninguém a livrará
  rationale: A expressão declara que não existe quem possa resgatar aquilo que foi levado. O pronome retoma naturalmente a presa explicitada na oração anterior.
theological_decisions:
- issue: Autodescrição divina como predador no juízo
  choice: Manter diretamente a comparação de Deus com um leão que despedaça e leva sua presa.
  alternative: Suavizar a metáfora como uma declaração geral de castigo.
  rationale: O hebraico emprega duas imagens leoninas e uma sequência de verbos predatórios. Preservar sua força evita atenuar o caráter severo do oráculo de juízo.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura poética próxima do hebraico. A repetição enfática foi preservada. “Casa de Judá” mantém a expressão bíblica corporativa; “leão novo” evita o tom diminutivo que “filhote de leão” poderia produzir.
