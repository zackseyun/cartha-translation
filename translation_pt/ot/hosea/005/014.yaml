revisions:
- from: Pois eu serei como um leão para Efraim[a] e como um leão novo para a casa de Judá. Eu, eu mesmo, despedaçarei e irei embora; carregarei a presa, e ninguém a livrará[b].
  to: Pois eu sou como um leão para Efraim[a] e como um leão jovem para a casa de Judá. Eu, eu mesmo, despedaçarei e irei embora; levarei, e não há quem resgate[b].
  rationale: A revisão corrige o tempo presente da comparação inicial e elimina a explicitação de «a presa» e o pronome que a retoma, preservando os objetos implícitos do hebraico. Também substitui «leão novo» por «leão jovem», expressão mais natural em português contemporâneo. As âncoras e notas lexicais são mantidas.
