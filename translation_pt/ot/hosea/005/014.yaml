  source_fidelity: A forma verbal inicial אָנֹכִי é presente («sou»), não futura («serei»). Além disso, אֶשָּׂא e וְאֵין מַצִּיל deixam o objeto de «levar» e de «resgatar» implícito; a introdução de «a presa» e do pronome «a» restringe e explicita indevidamente o texto.
  naturalness: «Leão jovem» é mais corrente e claro do que «leão novo» neste contexto. A formulação revista conserva o paralelismo e a contundência poética em português moderno.
  terminology: «Efraim» e «casa de Judá» estão corretos. «Leão», «leão jovem», «despedaçar», «levar» e «resgatar» representam adequadamente as imagens e os verbos hebraicos, sem suavizar o juízo.
