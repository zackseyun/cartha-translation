  text: וְ/עָנָ֥ה גְאֽוֹן יִשְׂרָאֵ֖ל בְּ/פָנָ֑י/ו וְ/יִשְׂרָאֵ֣ל וְ/אֶפְרַ֗יִם יִכָּֽשְׁלוּ֙ בַּ/עֲוֺנָ֔/ם כָּשַׁ֥ל גַּם יְהוּדָ֖ה עִמָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/005.yaml
  text: The pride of Israel testifies against him[a], and Israel and Ephraim will stumble in their guilt[c][b]; Judah also will stumble with them.
translation:
  language: pt
  text: O orgulho de Israel testemunha contra ele[a]; Israel e Efraim tropeçarão em sua culpa[b], e Judá também tropeçou com eles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A majestade de Israel testemunha diante dele” ou “na sua presença”. O hebraico traz literalmente uma expressão espacial, “em seu rosto”, mas o texto principal apresenta o provável sentido judicial.'
    reason: lexical_alternative
  - marker: b
    text: “Em sua culpa” também pode ser traduzido como “em sua iniquidade” ou “por causa de sua culpa”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “e Judá também tropeçará com eles” ou “e Judá também tropeça com eles”. A forma do verbo hebraico difere da usada na oração anterior e admite mais de uma compreensão temporal.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָנָה
  choice: testemunha
  rationale: Neste contexto, o verbo tem sentido forense de dar testemunho; o orgulho de Israel funciona como prova contra ele.
- source_word: גְאוֹן
  choice: orgulho
  rationale: Embora possa significar majestade ou exaltação, o contexto de acusação, culpa e queda favorece o sentido moral negativo.
- source_word: בְפָנָיו
  choice: contra ele
  rationale: A expressão significa literalmente 'em seu rosto' ou 'diante dele'; com o verbo 'testemunhar', 'contra ele' comunica naturalmente o provável sentido judicial. O pronome singular trata Israel como entidade coletiva.
- source_word: יִשְׂרָאֵל וְאֶפְרַיִם
  choice: Israel e Efraim
  rationale: Os nomes são preservados, mantendo a linguagem profética em que ambos podem designar o reino do norte.
- source_word: יִכָּשְׁלוּ
  choice: tropeçarão
  rationale: Preserva tanto a metáfora de כשל quanto o valor prospectivo do imperfeito hebraico.
- source_word: בַּעֲוֹנָם
  choice: em sua culpa
  rationale: A formulação compacta preserva a amplitude de עָוֹן, que pode envolver iniquidade, culpa e suas consequências, sem converter explicitamente a preposição em causa.
- source_word: כָּשַׁל
  choice: tropeçou
  rationale: O perfeito singular difere do imperfeito plural anterior. O pretérito preserva essa diferença aspectual sem impor uma explicação cronológica rígida.
- source_word: גַּם
  choice: também
  rationale: 'Expressa a força aditiva simples: Judá participa do mesmo tropeço.'
- source_word: עִמָּם
  choice: com eles
  rationale: Retoma Israel e Efraim e associa Judá à situação deles.
theological_decisions:
- issue: Sentido do 'orgulho de Israel' na primeira oração
  choice: Orgulho moral que testemunha contra Israel
  alternative: A majestade ou exaltação de Israel testemunha diante dele
  rationale: O contexto imediato é de acusação, culpa e queda sob juízo; 'orgulho' mantém a força da denúncia sem excluir em nota a possibilidade lexical de 'majestade'.
- issue: Valor temporal e aspectual do verbo referente a Judá
  choice: Judá também tropeçou com eles
  alternative: Judá também tropeçará com eles; Judá também tropeça com eles
  rationale: O hebraico muda do imperfeito plural para o perfeito singular. A tradução principal preserva essa diferença, enquanto a nota reconhece que a sequência profética admite outras formulações temporais.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. Mantém a metáfora de tropeçar, a personificação corporativa de Israel no singular e a diferença formal entre os verbos referentes a Israel/Efraim e a Judá.
