id: HOS.5.3
reference: Hosea 5:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֲנִי֙ יָדַ֣עְתִּי אֶפְרַ֔יִם וְ/יִשְׂרָאֵ֖ל לֹֽא נִכְחַ֣ד מִמֶּ֑/נִּי כִּ֤י עַתָּה֙ הִזְנֵ֣יתָ אֶפְרַ֔יִם נִטְמָ֖א יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/003.yaml
  text: I know Ephraim[a], and Israel is not hidden from me; for now, Ephraim, you have played the prostitute[b]; Israel is defiled.
translation:
  language: pt
  text: Eu conheço Efraim, e Israel não está escondido de mim; pois agora, Efraim, você se prostituiu[a]; Israel está impuro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “você agiu como prostituta”. O hebraico emprega a imagem da prostituição para falar da infidelidade à aliança.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Israel tornou-se impuro” ou “Israel foi contaminado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: conheço
  rationale: Embora a forma hebraica seja perfeita, aqui expressa o conhecimento certo e presente de Deus a respeito de Efraim. O presente é a forma mais natural em português.
- source_word: נִכְחַד מִמֶּנִּי
  choice: não está escondido de mim
  rationale: Preserva o sentido passivo do nifal de כחד e mantém a afirmação direta de que Israel não escapa ao conhecimento divino.
- source_word: כִּי עַתָּה
  choice: pois agora
  rationale: “Pois” mantém a relação explicativa introduzida por כִּי, e “agora” conserva a ênfase temporal de עַתָּה.
- source_word: הִזְנֵיתָ
  choice: você se prostituiu
  rationale: Conserva a imagem explícita de prostituição usada por Oseias para a infidelidade à aliança, em linguagem moderna e compreensível.
- source_word: נִטְמָא
  choice: está impuro
  rationale: Expressa o estado resultante de contaminação ou impureza indicado pelo nifal de טמא, preservando sua dimensão moral e cultual.
- source_word: אֶפְרַיִם / יִשְׂרָאֵל
  choice: Efraim / Israel
  rationale: Mantém os dois nomes e o paralelismo profético; em Oseias, Efraim frequentemente representa o reino do norte, sem ser simplesmente substituído por “Israel”.
theological_decisions:
- issue: Força metafórica da linguagem sexual para a infidelidade à aliança
  choice: Manter “você se prostituiu” no texto principal
  alternative: “você foi infiel”
  rationale: A metáfora sexual é deliberada e central à denúncia profética de Oseias. Uma formulação genérica enfraqueceria a imagem do hebraico.
- issue: Aspecto do conhecimento divino
  choice: Usar o presente “conheço”
  alternative: “conheci” ou “tenho conhecido”
  rationale: O contexto destaca o conhecimento atual e permanente de Deus, sem transformar a forma verbal hebraica em mera referência ao passado.
- issue: Sentido moral e cultual de נִטְמָא
  choice: Traduzir “está impuro”
  alternative: “foi contaminado” ou “tornou-se impuro”
  rationale: A formulação preserva o estado resultante sem decidir de modo desnecessário entre impureza predominantemente moral ou cultual.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A repetição dos nomes próprios e a metáfora incisiva do hebraico foram preservadas.
