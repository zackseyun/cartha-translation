  text: וַ/אֲנִ֥י כָ/עָ֖שׁ לְ/אֶפְרָ֑יִם וְ/כָ/רָקָ֖ב לְ/בֵ֥ית יְהוּדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/012.yaml
  text: So I am like a moth to Ephraim[a], and like rot to the house of Judah.
translation:
  language: pt
  text: Eu sou como a traça para Efraim e como a podridão para a casa de Judá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲנִי
  choice: Assim, sou
  rationale: A conjunção com o pronome independente introduz e enfatiza uma declaração divina que decorre do juízo descrito no contexto. Em português, «Assim, sou» expressa essa consequência com naturalidade; o verbo flexionado já comunica a primeira pessoa.
- source_word: כָעָשׁ
  choice: como a traça
  rationale: עָשׁ designa normalmente a traça e evoca um agente que consome aos poucos. A formulação mantém tanto a comparação quanto a imagem de destruição gradual.
- source_word: לְאֶפְרָיִם
  choice: para Efraim
  rationale: A preposição ל marca Efraim como alvo ou parte afetada pela comparação. «Para Efraim» é natural em português e conserva o nome específico do reino do norte.
- source_word: וְכָרָקָב
  choice: e como a podridão
  rationale: רָקָב pode indicar podridão, apodrecimento ou decomposição. «Podridão» preserva de modo conciso a imagem de deterioração interna e representa a conjunção e a partícula comparativa.
- source_word: לְבֵית יְהוּדָה
  choice: para a casa de Judá
  rationale: A expressão conserva a formulação hebraica e seu sentido coletivo, referente ao povo ou reino de Judá, sem reduzi-la simplesmente a «Judá».
theological_decisions:
- issue: Autodescrição divina por meio de agentes destrutivos
  choice: Manter Deus como sujeito que se compara diretamente à traça e à podridão, imagens de juízo gradual contra Efraim e Judá.
  alternative: Explicitar o efeito em forma verbal, como «consumirei Efraim como a traça e farei Judá apodrecer».
  rationale: O hebraico apresenta comparações nominais, não uma explicação verbal de seus efeitos. Preservar as metáforas mantém a força e a tensão da imagem profética sem acrescentar uma paráfrase interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe paralela preserva a concisão poética do hebraico. «Traça» e «podridão» são termos correntes e vívidos; «casa de Judá» mantém o caráter coletivo da expressão original.
