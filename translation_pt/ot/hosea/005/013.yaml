  text: וַ/יַּ֨רְא אֶפְרַ֜יִם אֶת חָלְי֗/וֹ וִֽ/יהוּדָה֙ אֶת מְזֹר֔/וֹ וַ/יֵּ֤לֶךְ אֶפְרַ֨יִם֙ אֶל אַשּׁ֔וּר וַ/יִּשְׁלַ֖ח אֶל מֶ֣לֶךְ יָרֵ֑ב וְ/ה֗וּא לֹ֤א יוּכַל֙ לִ/רְפֹּ֣א לָ/כֶ֔ם וְ/לֹֽא יִגְהֶ֥ה מִ/כֶּ֖ם מָזֽוֹר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/013.yaml
  text: When Ephraim saw his sickness[a], and Judah his wound, then Ephraim went to Assyria and sent to King Jareb; but he cannot heal you, nor can he cure your wound.
translation:
  language: pt
  text: Quando Efraim viu a sua enfermidade, e Judá, a sua ferida, Efraim foi à Assíria e enviou ao rei Jarebe[a]. Mas ele não pode curar vocês nem sarar a ferida de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “ao rei vingador” ou “ao grande rei”; o hebraico Jarebe pode ser entendido como um título, e não como nome próprio.
    reason: 'O sentido de יָרֵב é incerto: pode ser uma designação transliterada ou um título descritivo.'
lexical_decisions:
- source_word: חָלְיוֹ
  choice: a sua enfermidade
  rationale: Mantém a metáfora médica aplicada à condição nacional de Efraim, em linguagem corrente e digna.
- source_word: מְזֹרוֹ / מָזוֹר
  choice: a sua ferida / a ferida de vocês
  rationale: O substantivo denota ferida ou chaga; “ferida” é natural em português e preserva a imagem corporal sem especificar demais a patologia.
- source_word: אַשּׁוּר
  choice: Assíria
  rationale: É a forma portuguesa consagrada para a potência geopolítica mencionada no contexto.
- source_word: מֶלֶךְ יָרֵב
  choice: rei Jarebe
  rationale: Mantém no texto a leitura tradicional como nome ou designação transliterada, enquanto a possível interpretação como título descritivo é registrada em nota.
- source_word: וַיִּשְׁלַח אֶל
  choice: enviou mensageiros ao
  rationale: O objeto de “enviou” está implícito no hebraico. Em português, explicitar “mensageiros” comunica naturalmente a ação sem alterar seu sentido contextual.
- source_word: לָכֶם
  choice: vocês
  rationale: O pronome hebraico é plural e se refere coletivamente aos dois reinos ou a seus povos.
- source_word: יִגְהֶה מִכֶּם
  choice: sarar a ferida de vocês
  rationale: O verbo raro ocorre em paralelismo com “curar”. “Sarar” preserva a imagem terapêutica e produz português claro, sem impor uma definição médica específica.
- source_word: וְהוּא
  choice: mas ele
  rationale: Embora a conjunção seja formalmente aditiva, o contexto exige contraste entre a procura de auxílio assírio e a incapacidade desse auxílio.
theological_decisions:
- issue: Referente de “ele” em “ele não pode curar vocês”
  choice: O rei Jarebe, o governante assírio, como antecedente singular imediato
  alternative: A Assíria entendida de modo mais amplo como poder político
  rationale: O rei é o antecedente gramatical mais próximo. A formulação preserva também, por implicação, a incapacidade da potência assíria de remediar o juízo que aflige Efraim e Judá.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. O paralelismo entre enfermidade, ferida, curar e sarar foi preservado; o plural “vocês” reproduz a mudança do relato sobre Efraim e Judá para a interpelação direta aos dois reinos.
