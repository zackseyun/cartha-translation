  text: אֶפְרַ֨יִם֙ לְ/שַׁמָּ֣ה תִֽהְיֶ֔ה בְּ/י֖וֹם תּֽוֹכֵחָ֑ה בְּ/שִׁבְטֵי֙ יִשְׂרָאֵ֔ל הוֹדַ֖עְתִּי נֶאֱמָנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/009.yaml
  text: Ephraim will become a desolation in the day of rebuke[c][b][a]; among the tribes of Israel I have made known what is sure.
translation:
  language: pt
  text: Efraim se tornará uma desolação no dia da repreensão[a]; entre as tribos de Israel, dei a conhecer o que é seguro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «algo horrível» ou «objeto de horror»; também «no dia do castigo» ou «no dia do julgamento». Aqui, «repreensão» tem força judicial e punitiva.
    reason: lexical_alternative
  - marker: b
    text: Ou «dei a conhecer o que é certo». A expressão hebraica ressalta a certeza e a confiabilidade do juízo anunciado.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Mantém o nome próprio do hebraico, sem explicitar no texto principal sua referência metonímica ao reino do norte.
- source_word: לְשַׁמָּה
  choice: uma desolação
  rationale: Expressa devastação e ruína, preservando também a possibilidade de algo que causa espanto, indicada em nota.
- source_word: תִהְיֶה
  choice: se tornará
  rationale: A construção com לְ indica a entrada em um estado, mais bem refletida por «se tornará» do que simplesmente por «será».
- source_word: בְּיוֹם תּוֹכֵחָה
  choice: no dia da repreensão
  rationale: Mantém o sentido lexical de censura ou repreensão sem eliminar a força punitiva que o contexto profético lhe confere.
- source_word: בְּשִׁבְטֵי יִשְׂרָאֵל
  choice: entre as tribos de Israel
  rationale: Entende a preposição בְּ em sentido locativo ou de esfera; «entre» é natural em português e evita convertê-la sem necessidade em «contra».
- source_word: הוֹדַעְתִּי
  choice: dei a conhecer
  rationale: Traduz o hifil de ידע como declaração feita e agora válida, em formulação corrente e digna em português.
- source_word: נֶאֱמָנָה
  choice: o que é certo
  rationale: Trata a forma como substantivada e comunica firmeza, confiabilidade e certeza daquilo que foi anunciado.
theological_decisions:
- issue: Explicitar que Efraim representa o reino do norte
  choice: Manter «Efraim» sem expansão
  alternative: «o reino do norte» ou «Israel»
  rationale: O hebraico nomeia Efraim diretamente. A referência metonímica pode ser percebida no contexto, e explicitá-la no texto principal resolveria uma inferência interpretativa.
- issue: Força judicial de תּוֹכֵחָה
  choice: «repreensão»
  alternative: «castigo» ou «julgamento»
  rationale: Embora o contexto envolva juízo punitivo, o substantivo designa mais diretamente repreensão ou censura. A tradução preserva essa tensão lexical.
- issue: Sentido de נֶאֱמָנָה na frase final
  choice: «o que é certo»
  alternative: «uma coisa segura», «o que é digno de confiança» ou entender a expressão como qualificando a certeza do anúncio
  rationale: A formulação preserva a ênfase na firmeza e confiabilidade do pronunciamento sem especificar além do que o hebraico permite.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A ordem das orações e o ponto e vírgula preservam o paralelismo profético sem produzir sintaxe artificial.
