source:
  edition: WLC
  text: בְּ/בֵית֙ יִשְׂרָאֵ֔ל רָאִ֖יתִי שעריריה שָׁ֚ם זְנ֣וּת לְ/אֶפְרַ֔יִם נִטְמָ֖א יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/010.yaml
  text: 'In the house of Israel I have seen a horrible thing: there is prostitution in Ephraim[c][b][a]; Israel has defiled itself.'
translation:
  language: pt
  text: Na casa de Israel vi uma coisa horrível:[a] ali há prostituição em Efraim;[b] Israel se tornou impuro.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma coisa estarrecedora”. O termo hebraico indica algo chocante ou atroz.
    reason: lexical_alternative
  - marker: b
    text: 'A expressão hebraica é condensada. Também pode ser traduzida: “ali há prostituição de Efraim” ou “ali a prostituição pertence a Efraim”.'
    reason: alternative_reading
  - marker: c
    text: Ou “Israel está impuro”, “Israel foi contaminado” ou “Israel se contaminou”.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּבֵית יִשְׂרָאֵל
  choice: Na casa de Israel
  rationale: Preserva a imagem coletiva e familiar de בֵית יִשְׂרָאֵל, sem reduzi-la simplesmente a “em Israel”.
- source_word: רָאִיתִי
  choice: vi
  rationale: O perfeito hebraico de primeira pessoa é expresso naturalmente pelo pretérito perfeito em português; o contexto profético mantém a relevância presente da constatação.
- source_word: שעריריה
  choice: uma coisa horrível
  rationale: Comunica de modo atual e digno o caráter chocante e atroz indicado pelo raro substantivo hebraico.
- source_word: שָׁם
  choice: ali
  rationale: Retém explicitamente o advérbio locativo, remetendo à casa de Israel mencionada antes.
- source_word: זְנוּת
  choice: prostituição
  rationale: Preserva a forte metáfora sexual recorrente em Oseias e permite tanto a referência à imoralidade quanto à infidelidade à aliança, sem decidir entre elas.
- source_word: לְאֶפְרַיִם
  choice: de Efraim
  rationale: A construção comprimida com לְ admite associação, atribuição ou localização. “De Efraim” mantém essa relação relativamente aberta e soa natural em português.
- source_word: נִטְמָא
  choice: se tornou impuro
  rationale: Expressa adequadamente o nifal como entrada em estado de impureza, sem converter de modo excessivamente explícito a forma hebraica em reflexivo causativo.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém o nome do povo da aliança e a progressão retórica entre casa de Israel, Efraim e Israel.
theological_decisions:
- issue: Se זְנוּת deve destacar pecado sexual literal, idolatria metafórica ou ambos
  choice: prostituição
  alternative: imoralidade sexual; prostituição cultual; infidelidade
  rationale: “Prostituição” conserva a imagem profética de Oseias sem restringi-la exclusivamente a um referente literal ou metafórico.
- issue: Se נִטְמָא descreve um estado, uma mudança de estado ou autoprofanação culpável
  choice: se tornou impuro
  alternative: está impuro; foi contaminado; contaminou-se
  rationale: A escolha preserva o valor médio-passivo e resultativo possível do nifal. A nota registra as alternativas sem eliminar a responsabilidade de Israel sugerida pelo contexto.
- issue: Como representar a relação ambígua de לְאֶפְרַיִם
  choice: a prostituição de Efraim
  alternative: há prostituição em Efraim; a prostituição pertence a Efraim
  rationale: O hebraico é elíptico. O genitivo português conserva associação ampla, enquanto a nota explicita as principais leituras possíveis.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem e as imagens centrais do hebraico foram preservadas, enquanto as ambiguidades de לְאֶפְרַיִם e נִטְמָא foram mantidas por meio de notas.
