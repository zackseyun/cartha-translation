  naturalness: «Na casa de Israel vi uma coisa horrível» é natural, claro e de registro profético digno. A substituição de «ali está a prostituição de Efraim» por «ali há prostituição em Efraim» melhora significativamente a fluência sem apagar a ambiguidade, que permanece registrada em nota. «Israel se tornou impuro» é compreensível e conserva adequadamente a ideia de entrada em estado de impureza.
  terminology: «Efraim», «Israel», «prostituição» e «impuro» são escolhas adequadas. «Prostituição» mantém a imagem sexual deliberadamente aberta de Oseias, sem reduzir o termo nem a pecado sexual literal nem a idolatria. «Impuro» preserva a linguagem de contaminação do hebraico sem introduzir uma explicação doutrinária.
