base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/004.yaml
  text: What shall I do with you[a], Ephraim? What shall I do with you, Judah? Your loyalty is like a morning cloud, and like dew that goes away early.
translation:
  language: pt
  text: O que farei com você, Efraim? O que farei com você, Judá? A lealdade de vocês[a] é como uma nuvem da manhã e como o orvalho que desaparece cedo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “amor leal”, “fidelidade” ou “lealdade à aliança”. O termo hebraico חֶסֶד expressa amor e lealdade em um relacionamento de compromisso.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֶעֱשֶׂה לְךָ
  choice: O que farei com você
  rationale: Preserva a deliberação retórica e exasperada da expressão hebraica em português natural, sem reduzi-la a uma simples pergunta informativa.
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Mantém o nome próprio, que aqui representa e interpela diretamente o reino do norte.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Mantém o nome próprio em paralelo com Efraim, designando o reino do sul personificado.
- source_word: חַסְדְּכֶם
  choice: a lealdade de vocês
  rationale: Neste contexto de repreensão, חֶסֶד designa a lealdade amorosa e relacional esperada do povo. 'Lealdade' é conciso e não torna explícita no corpo do texto uma referência à aliança que permanece semanticamente implícita; a riqueza do termo é indicada em nota.
- source_word: כַּעֲנַן בֹּקֶר
  choice: como a nuvem da manhã
  rationale: Preserva literalmente a imagem de algo matinal, transitório e rapidamente dissipado.
- source_word: וְכַטַּל מַשְׁכִּים הֹלֵךְ
  choice: como o orvalho que logo desaparece
  rationale: 'Expressa em português corrente o sentido conjunto de מַשְׁכִּים e הֹלֵךְ: o orvalho se vai cedo ou rapidamente. ''Logo desaparece'' comunica com clareza a fugacidade enfatizada pelo paralelismo.'
theological_decisions:
- issue: Sentido de חֶסֶד na repreensão profética
  choice: lealdade
  alternative: amor leal; fidelidade; lealdade à aliança
  rationale: O termo reúne dimensões de amor, fidelidade e compromisso relacional. O contexto da aliança é relevante, mas não deve ser transformado em uma explicitação obrigatória no texto principal. A nota preserva a amplitude sem resolver indevidamente a tensão lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O singular “você” acompanha cada reino na interpelação direta; o plural “de vocês” reflete o sufixo plural de חַסְדְּכֶם e reúne Efraim e Judá na avaliação divina.
