source:
  edition: WLC
  text: גַּם יְהוּדָ֕ה שָׁ֥ת קָצִ֖יר לָ֑/ךְ בְּ/שׁוּבִ֖/י שְׁב֥וּת עַמִּֽ/י־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/011.yaml
  text: Also for you[a], Judah, a harvest is appointed[b], when I restore the fortunes of my people.
translation:
  language: pt
  text: Também para você, Judá, está determinada uma colheita, quando eu restaurar a sorte do meu povo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando eu trouxer de volta os cativos do meu povo”. A expressão hebraica também pode significar “quando eu restaurar a sorte do meu povo”.'
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם
  choice: Também
  rationale: Preserva a força aditiva, incluindo Judá na declaração precedente, em português natural.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma portuguesa consagrada do nome próprio do reino e povo do sul.
- source_word: שָׁת
  choice: está determinada
  rationale: O verbo significa pôr ou estabelecer; com “colheita”, a formulação expressa algo fixado ou designado sem tornar explícito quem o estabeleceu.
- source_word: קָצִיר
  choice: uma colheita
  rationale: Mantém a metáfora do hebraico sem decidir se indica juízo ou bênção.
- source_word: לָךְ
  choice: para você
  rationale: Representa o sufixo de segunda pessoa feminina singular, dirigido a Judá, e conserva sua posição enfática próxima ao início.
- source_word: בְּשׁוּבִי
  choice: quando eu restaurar
  rationale: Na construção com שְׁבוּת, traduz naturalmente a ideia de reversão da condição do povo.
- source_word: שְׁבוּת
  choice: a sorte
  rationale: A expressão profética idiomática denota a reversão da situação adversa ou a restauração da condição do povo; a alternativa formal ligada ao cativeiro é registrada em nota.
- source_word: עַמִּי
  choice: do meu povo
  rationale: Traduz diretamente a expressão de pertencimento pactual.
theological_decisions:
- issue: Se “colheita” deve ser interpretada explicitamente como juízo ou como bênção
  choice: Manter apenas “uma colheita”
  alternative: “uma colheita de juízo” ou “uma colheita de bênção/restauração”
  rationale: O contexto favorece conotações de juízo, enquanto a cláusula seguinte fala de restauração. A tradução conserva essa tensão e não qualifica a metáfora.
- issue: Sentido da fórmula בְּשׁוּבִי שְׁבוּת עַמִּי
  choice: “quando eu restaurar a sorte do meu povo”
  alternative: “quando eu trouxer de volta os cativos do meu povo”
  rationale: A fórmula pode referir-se amplamente à reversão da condição adversa, embora uma referência mais concreta ao cativeiro continue lexicalmente possível.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem “Também para você, Judá” acompanha a ênfase do hebraico. “Está determinada” evita o sujeito indefinido exigido por uma tradução mais literal de שָׁת.
