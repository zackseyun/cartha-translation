base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/002.yaml
  text: He will revive us after two days[a]; on the third day he will raise us up[d][c][b], that we may live before him.
translation:
  language: pt
  text: Depois de dois dias, ele nos dará vida[a]; no terceiro dia[c], nos levantará[b], e viveremos diante dele[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Em dois dias”; a expressão temporal hebraica pode indicar um breve intervalo que culmina no terceiro dia.'
    reason: lexical_alternative
  - marker: b
    text: “Nos levantará” também pode ser entendido, de modo mais geral, como “nos restaurará” ou “nos porá de pé”.
    reason: lexical_alternative
  - marker: c
    text: Muitos cristãos veem na expressão “no terceiro dia” uma antecipação tipológica da ressurreição do Messias, embora o versículo fale diretamente da restauração do povo.
    reason: cross_reference
  - marker: d
    text: 'Ou: “em sua presença”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַיֵּנוּ
  choice: ele nos fará reviver
  rationale: 'O piel de חיה com objeto na primeira pessoa do plural tem sentido causativo: dar vida novamente, reanimar. A formulação preserva a força vital do verbo e se ajusta ao contexto de restauração coletiva.'
- source_word: מִיֹּמָיִם
  choice: depois de dois dias
  rationale: A preposição מִן com a expressão temporal admite aqui o sentido idiomático de “depois de”. A alternativa “em dois dias” permanece possível e é registrada em nota.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: no terceiro dia
  rationale: Equivalente português natural da expressão temporal hebraica, mantendo a progressão marcada entre os dois dias e o terceiro dia.
- source_word: יְקִימֵנוּ
  choice: nos levantará
  rationale: O hifil de קום pode significar levantar, pôr de pé ou restabelecer. “Nos levantará” preserva tanto a imagem de restauração após um estado semelhante à morte quanto possíveis ressonâncias de ressurreição, sem especificá-las indevidamente.
- source_word: וְנִחְיֶה
  choice: e viveremos
  rationale: A conjunção וְ permite conservar a coordenação simples do hebraico. Em português, “e viveremos” mantém aberta a relação como sequência ou resultado, em vez de impor uma leitura exclusivamente final.
- source_word: לְפָנָיו
  choice: diante dele
  rationale: Tradução direta e idiomática de לְפָנָיו, com a nuance relacional de viver em sua presença.
theological_decisions:
- issue: Se a tradução deve apresentar o versículo como profecia messiânica direta de ressurreição ou como declaração de restauração coletiva
  choice: O texto principal conserva a primeira pessoa do plural e apresenta a restauração do povo por Deus.
  alternative: Alguns cristãos entendem a referência ao “terceiro dia” como antecipação tipológica ou profética da ressurreição do Messias.
  rationale: O referente imediato do hebraico é coletivo (“nós”). A tradução não deve inserir no texto uma identificação cristológica mais específica do que a redação original, mas a nota pode reconhecer a leitura tipológica cristã.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Fará reviver” conserva o valor causativo do primeiro verbo; “levantará” preserva a imagem do segundo sem resolver sua amplitude semântica. As notas foram condensadas em dois marcadores, ambos presentes no texto principal.
