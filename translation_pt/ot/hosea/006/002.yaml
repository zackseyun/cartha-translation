  terminology: «Nos levantará» preserva de modo acertado a imagem de יְקִימֵנוּ sem restringi-la a uma ressurreição individual. «Diante dele» é direto e natural para לְפָנָיו. Convém separar as notas lexical, tipológica e de alternativa para «diante dele», ancorando cada uma no trecho a que se refere.
