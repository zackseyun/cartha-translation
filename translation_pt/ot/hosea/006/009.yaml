    rationale: O hebraico evoca quem espera em emboscada; em português, “homens que ficam à espreita” comunica essa ação sem criar uma categoria nominal estranha.
  - severity: low
    issue: “um bando de sacerdotes comete assassinatos” é estilisticamente pesado.
    rationale: A formulação com os sacerdotes como sujeito plural permite traduzir o plural verbal hebraico de modo natural, sem alterar a imagem de ação grupal.
  - severity: low
    issue: A nota b está ancorada em “de fato”, embora explique “infâmia”.
    rationale: A relocação da âncora torna transparente a relação entre a nota lexical e זִמָּה.
