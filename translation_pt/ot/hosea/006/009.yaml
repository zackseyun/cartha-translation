  text: וּ/כְ/חַכֵּ֨י אִ֜ישׁ גְּדוּדִ֗ים חֶ֚בֶר כֹּֽהֲנִ֔ים דֶּ֖רֶךְ יְרַצְּחוּ שֶׁ֑כְמָ/ה כִּ֥י זִמָּ֖ה עָשֽׂוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/009.yaml
  text: And like men lying in wait[a], a band of priests murders on the way to Shechem; indeed[b], they have committed wickedness.
translation:
  language: pt
  text: E, como homens que ficam à espreita[a], os sacerdotes, em bando, assassinam no caminho para Siquém; de fato, eles cometeram uma infâmia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico é difícil. Outra tradução possível: “Como salteadores ficam à espreita de um homem, assim um bando de sacerdotes assassina no caminho para Siquém”.'
    reason: alternative_reading
  - marker: b
    text: Ou “um crime vergonhoso”, “uma perversidade”. O termo hebraico designa um ato hediondo ou ultrajante.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְחַכֵּי אִישׁ גְּדוּדִים
  choice: E, como homens de emboscada
  rationale: O hebraico é condensado e difícil, mas evoca pessoas que ficam à espreita como salteadores. A formulação preserva a comparação e a imagem predatória sem reconstruir a sintaxe com certeza indevida.
- source_word: חֶבֶר כֹּהֲנִים
  choice: um bando de sacerdotes
  rationale: חֶבֶר designa um grupo ou companhia; “bando” combina com o contexto hostil e conspiratório.
- source_word: דֶּרֶךְ
  choice: no caminho para
  rationale: Expressa de modo natural o sentido locativo de “caminho/estrada” seguido do destino.
- source_word: יְרַצְּחוּ
  choice: comete assassinatos
  rationale: רצח denota assassinato, não apenas morte em sentido genérico. A locução mantém a força criminosa do verbo e concorda naturalmente com o sujeito coletivo.
- source_word: שֶׁכְמָה
  choice: Siquém
  rationale: O nome do lugar traz a terminação direcional; “para Siquém” comunica esse movimento em português.
- source_word: כִּי
  choice: de fato
  rationale: Neste contexto, a partícula introduz uma afirmação enfática e explicativa, não necessariamente uma causa estrita.
- source_word: זִמָּה
  choice: infâmia
  rationale: O termo indica um ato perverso, vergonhoso ou ultrajante. “Infâmia” preserva a gravidade moral sem restringir o sentido à imoralidade sexual.
- source_word: עָשׂוּ
  choice: eles cometeram
  rationale: “Cometer” combina idiomaticamente com “infâmia” e representa a ação concluída.
theological_decisions:
- issue: Interpretação da difícil comparação inicial וּכְחַכֵּי אִישׁ גְּדוּדִים
  choice: Os sacerdotes são comparados a homens que armam emboscadas, como salteadores.
  alternative: “Como salteadores ficam à espreita de um homem, assim um bando de sacerdotes comete assassinatos no caminho para Siquém.”
  rationale: A sintaxe hebraica é comprimida e incerta. O texto principal conserva a imagem central de emboscada e violência sem apresentar como certa uma reconstrução possível do enunciado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Siquém” segue a forma bíblica tradicional em português; “bando” e “emboscada” mantêm a contundência da denúncia profética.
