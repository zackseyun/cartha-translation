  text: וְ/נֵדְעָ֣ה נִרְדְּפָ֗ה לָ/דַ֨עַת֙ אֶת יְהוָ֔ה כְּ/שַׁ֖חַר נָכ֣וֹן מֽוֹצָא֑/וֹ וְ/יָב֤וֹא כַ/גֶּ֨שֶׁם֙ לָ֔/נוּ כְּ/מַלְק֖וֹשׁ י֥וֹרֶה אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/003.yaml
  text: So let us know[a]; let us press on to know Yahweh. His going forth is as sure as the dawn, and he will come to us like the rain[d][c][b], like the spring rain that waters the earth.
translation:
  language: pt
  text: Conheçamos e empenhemo-nos em conhecer Yahweh. Seu aparecimento é tão certo quanto o amanhecer, e ele virá a nós como a chuva[a], como a chuva da primavera que rega a terra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e que ele venha a nós como a chuva”. O verbo hebraico também pode expressar um desejo, embora o contexto favoreça o futuro confiante: “ele virá”.'
    reason: alternative_reading
  - marker: b
    text: “Chuva da primavera” traduz a chuva tardia da estação, importante para a maturação das plantações. “Seu aparecimento” traduz literalmente “sua saída” ou “seu ato de sair”.
    reason: cultural_and_lexical_note
lexical_decisions:
- source_word: וְנֵדְעָה
  choice: Conheçamos, pois
  rationale: O coortativo hebraico expressa convite ou exortação coletiva. “Pois” liga naturalmente o chamado à ação ao contexto anterior.
- source_word: נִרְדְּפָה לָדַעַת
  choice: prossigamos em conhecer
  rationale: רדף significa literalmente perseguir e, nesta construção, comunica empenho persistente. A formulação preserva tanto a perseverança quanto o amplo sentido relacional de ידע.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מוֹצָאוֹ
  choice: Sua manifestação
  rationale: O substantivo significa literalmente “saída” ou “ato de sair”; no contexto, refere-se provavelmente ao aparecimento de Yahweh, comparado ao amanhecer. A alternativa literal é registrada em nota.
- source_word: נָכוֹן
  choice: tão certa
  rationale: Comunica a ideia de algo firme, estabelecido e confiável, adequada à regularidade do amanhecer.
- source_word: וְיָבוֹא
  choice: e ele virá
  rationale: O imperfeito é entendido como futuro confiante no encadeamento da frase, embora a possibilidade volitiva seja preservada em nota.
- source_word: כְמַלְקוֹשׁ
  choice: como a chuva da primavera
  rationale: מַלְקוֹשׁ designa a chuva tardia da estação agrícola, que cai na primavera e favorece a maturação das culturas.
- source_word: יוֹרֶה אָרֶץ
  choice: que rega a terra
  rationale: A expressão descreve a chuva caindo sobre a terra; “rega” transmite de modo natural seu efeito vivificante.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Preserva no texto o nome pessoal indicado pelo Tetragrama, sem substituí-lo por um título.
- issue: Força verbal de וְיָבוֹא
  choice: 'futuro indicativo: “ele virá”'
  alternative: 'valor volitivo: “que ele venha”'
  rationale: A certeza da manifestação, comparada ao amanhecer e à chuva, favorece uma declaração confiante; a ambiguidade gramatical é mantida em nota.
- issue: Amplitude de ידע
  choice: conhecer
  alternative: reconhecer
  rationale: “Conhecer” mantém a amplitude cognitiva, relacional e pactual do verbo sem restringi-lo a mero reconhecimento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A cadência exortativa e as imagens agrícolas foram preservadas sem arcaísmos desnecessários.
