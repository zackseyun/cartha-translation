  text: עַל כֵּ֗ן חָצַ֨בְתִּי֙ בַּ/נְּבִיאִ֔ים הֲרַגְתִּ֖י/ם בְּ/אִמְרֵי פִ֑/י וּ/מִשְׁפָּטֶ֖י/ךָ א֥וֹר יֵצֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/005.yaml
  text: Therefore I have hewn them by the prophets; I have slain them by the words of my mouth[a], and my judgments go forth like light.
translation:
  language: pt
  text: Por isso, eu os talhei por meio dos profetas; eu os matei com as palavras da minha boca, e os teus juízos saem como a luz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e o meu juízo sai como a luz”. O texto hebraico vocalizado diz “os teus juízos”, mas alguns entendem o sentido como o juízo ou a justiça de Deus que se manifesta.'
    reason: Leitura alternativa decorrente da dificuldade do sufixo hebraico e do contexto em primeira pessoa.
lexical_decisions:
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Marca de modo natural e conciso a consequência da acusação precedente.
- source_word: חָצַבְתִּי
  choice: eu os talhei
  rationale: Preserva a metáfora vigorosa de cortar ou lavrar material duro, sem reduzi-la a uma formulação abstrata.
- source_word: בַּנְּבִיאִים
  choice: por meio dos profetas
  rationale: Entende a preposição como instrumental e deixa claro que os profetas são o meio da ação divina.
- source_word: הֲרַגְתִּים
  choice: eu os matei
  rationale: Mantém sem atenuação a severidade do verbo hebraico, em português atual e direto.
- source_word: בְּאִמְרֵי פִי
  choice: com as palavras da minha boca
  rationale: Conserva a imagem concreta da palavra pronunciada por Deus.
- source_word: וּמִשְׁפָּטֶיךָ
  choice: e os teus juízos
  rationale: Segue o texto massorético vocalizado, com sufixo de segunda pessoa masculina singular, e preserva a difícil mudança para o discurso direto.
- source_word: אוֹר יֵצֵא
  choice: saem como a luz
  rationale: Expressa em português a manifestação pública e evidente dos juízos, tornando explícito o valor comparativo sugerido pelo contexto poético.
theological_decisions:
- issue: Referente e sufixo em וּמִשְׁפָּטֶיךָ
  choice: os teus juízos saem como a luz
  alternative: o meu juízo sai como a luz
  rationale: O texto massorético vocalizado traz o sufixo 'teus', embora a construção seja difícil. Mantê-lo no texto principal evita corrigir silenciosamente o hebraico; a leitura contextual 'meu juízo' é registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A metáfora de talhar, o paralelismo profético e a tensão textual em torno de “teus juízos” foram preservados.
