  source_fidelity: 'A tradução segue de perto o hebraico: mantém a sequência consequencial, as duas ações divinas no perfeito, os profetas e as palavras da boca divina como meios instrumentais, e preserva a difícil leitura massorética com o sufixo de segunda pessoa em “os teus juízos”. “Talhei” conserva adequadamente a metáfora incisiva de חָצַבְתִּי.'
  naturalness: O português é moderno, claro e de registro apropriadamente solene. “Por meio dos profetas”, “com as palavras da minha boca” e “saem como a luz” são formulações naturais. Embora o hebraico associe um sujeito formalmente plural a verbo singular, a concordância plural portuguesa em “os teus juízos saem” é a solução idiomática adequada sem alterar o referente.
  terminology: “Profetas”, “juízos”, “luz” e a linguagem de fala divina são consistentes com o registro bíblico e não introduzem interpretação denominacional. A nota apresenta com cautela a alternativa contextual “meu juízo”, sem suprimir a leitura difícil do texto vocalizado.
