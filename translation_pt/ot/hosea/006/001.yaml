  source_fidelity: A primeira metade transmite bem o apelo e a sequência de ferir/curar. Porém, «cuidará de nossas feridas» enfraquece e explicita em excesso o verbo חבש, que significa propriamente atar/enfaixar (as feridas), e deixa de manter Yahweh como o agente que age diretamente sobre «nós».
  naturalness: «Venham, voltemos para Yahweh» é natural e adequado. «Mas nos enfaixará» seria compreensível, mas «atará nossas feridas» oferece português moderno, claro e internacional, além de preservar melhor a imagem hebraica.
  terminology: «Yahweh», «dilacerou», «curará» e «feriu» são escolhas apropriadas. «Atará nossas feridas» conserva a metáfora médica sem a reduzir ao sentido mais geral de cuidar.
