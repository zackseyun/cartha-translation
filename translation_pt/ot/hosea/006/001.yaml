id: HOS.6.1
reference: Hosea 6:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לְכוּ֙ וְ/נָשׁ֣וּבָה אֶל יְהוָ֔ה כִּ֛י ה֥וּא טָרָ֖ף וְ/יִרְפָּאֵ֑/נוּ יַ֖ךְ וְ/יַחְבְּשֵֽׁ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/001.yaml
  text: Come[a], let us return to Yahweh, for he has torn us, but he will heal us; he has struck us[b], but he will bind us up.
translation:
  language: pt
  text: Venham, voltemos para Yahweh, pois ele nos dilacerou[a], mas[b] nos curará; ele nos feriu, mas atará nossas feridas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico evoca uma fera dilacerando a presa, ressaltando a severidade do juízo de Yahweh.
    reason: cultural_note
  - marker: b
    text: Ou “e nos curará [...] e atará nossas feridas”. A conjunção hebraica é simplesmente “e”, mas “mas” explicita em português o contraste do paralelismo.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: Venham
  rationale: O imperativo plural de הלך funciona aqui como exortação que introduz um apelo coletivo. “Venham, voltemos” comunica esse valor de modo natural em português.
- source_word: וְנָשׁוּבָה
  choice: voltemos
  rationale: O coortativo na primeira pessoa do plural expressa decisão compartilhada. “Voltemos” preserva tanto o movimento em direção a Yahweh quanto a linguagem de retorno pactual, sem substituí-la pelo termo mais interpretativo “arrependamo-nos”.
- source_word: אֶל יְהוָה
  choice: para Yahweh
  rationale: A preposição marca direção, expressa naturalmente por “para”. O nome divino é transliterado como “Yahweh”, preservando o nome próprio do texto hebraico.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão para a exortação e mantém de forma concisa a relação lógica do verso.
- source_word: טָרָף
  choice: nos dilacerou
  rationale: O verbo costuma descrever o ato de uma fera que rasga a presa. “Dilacerou” conserva a força da imagem; o objeto “nos” está implícito e é confirmado pelos sufixos e pelo paralelismo.
- source_word: וְיִרְפָּאֵנוּ
  choice: mas nos curará
  rationale: A forma verbal aponta para a restauração esperada. Embora וְ seja literalmente “e”, “mas” torna natural em português o contraste entre o juízo sofrido e a cura futura.
- source_word: יַךְ
  choice: nos feriu
  rationale: No paralelismo poético, a forma é entendida em conjunto com o perfeito anterior, descrevendo o dano já infligido. “Feriu” é atual e liga-se naturalmente à imagem subsequente do tratamento das feridas.
- source_word: וְיַחְבְּשֵׁנוּ
  choice: mas cuidará de nossas feridas
  rationale: O verbo חבש descreve o ato de atar ou enfaixar uma ferida. A formulação escolhida comunica a metáfora médica de modo idiomático em português, sem o pouco natural “nos enfaixará”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Aspecto e sequência do juízo e da restauração divina
  choice: Dano passado (“dilacerou”, “feriu”) seguido de restauração futura (“curará”, “cuidará”)
  alternative: Traduzir as quatro ações como futuras ou manter todas as orações apenas coordenadas por “e”
  rationale: O paralelismo apresenta o retorno a Yahweh à luz da esperança de que aquele que infligiu o juízo também restaure. A tradução mantém, sem suavizá-la, a tensão entre a ação divina de ferir e a de curar.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Venham, voltemos” preserva a exortação comunitária; “dilacerou” mantém a imagem poética forte, e “cuidará de nossas feridas” apresenta de forma idiomática a metáfora de enfaixar.
