    rationale: חבש é o ato concreto de atar ou enfaixar uma ferida. A formulação atual transforma a imagem em cuidado inespecífico e desloca o objeto pronominal «nos» para uma possessiva. «Atará nossas feridas» preserva de forma natural a imagem e o sentido do hebraico.
