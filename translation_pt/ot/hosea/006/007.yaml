id: HOS.6.7
reference: Hosea 6:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הֵ֕מָּה כְּ/אָדָ֖ם עָבְר֣וּ בְרִ֑ית שָׁ֖ם בָּ֥גְדוּ בִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/007.yaml
  text: But they[a], like Adam, transgressed the covenant; there they dealt faithlessly with me.
translation:
  language: pt
  text: Mas eles, como Adão[a], transgrediram a aliança; ali foram infiéis a mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como o ser humano” ou “como a humanidade”. O hebraico אָדָם pode referir-se tanto a Adão pessoalmente quanto à humanidade em geral.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵמָּה
  choice: Mas eles
  rationale: O pronome é enfático, e a conjunção admite valor adversativo no contexto, marcando contraste com a descrição positiva anterior.
- source_word: כְּאָדָם
  choice: como Adão
  rationale: אָדָם pode ser o nome próprio Adão ou uma referência genérica ao ser humano ou à humanidade. A leitura como nome próprio é plausível no contexto de transgressão da aliança, enquanto a ambiguidade é preservada em nota.
- source_word: עָבְרוּ
  choice: transgrediram
  rationale: Com בְרִית, o verbo expressa ultrapassar os limites da aliança, isto é, violá-la. “Transgrediram” conserva tanto a força da imagem quanto o peso pactual.
- source_word: בְרִית
  choice: a aliança
  rationale: Embora o substantivo não tenha artigo no hebraico, o contexto aponta para uma relação de aliança específica, e o português pede naturalmente a forma definida.
- source_word: שָׁם
  choice: ali
  rationale: Mantém o sentido locativo mais direto do advérbio hebraico, sem explicitar um referente que o texto deixa implícito.
- source_word: בָּגְדוּ
  choice: foram infiéis
  rationale: O verbo denota infidelidade traiçoeira, especialmente em relações de aliança. A formulação é natural e clara em português moderno.
- source_word: בִי
  choice: a mim
  rationale: Com “foram infiéis”, a regência idiomática em português expressa adequadamente o objeto pessoal da infidelidade.
theological_decisions:
- issue: Interpretação de כְּאָדָם no contexto da aliança
  choice: como Adão
  alternative: como o ser humano; como a humanidade
  rationale: A leitura como nome próprio preserva a possível alusão à primeira transgressão humana da aliança. Como o hebraico também permite uma referência genérica ao ser humano ou à humanidade, essa alternativa legítima é registrada em nota, sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Ali” conserva a referência espacial indefinida; “foram infiéis a mim” comunica de modo natural a traição da relação de aliança.
