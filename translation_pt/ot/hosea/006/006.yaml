id: HOS.6.6
reference: Hosea 6:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֛י חֶ֥סֶד חָפַ֖צְתִּי וְ/לֹא זָ֑בַח וְ/דַ֥עַת אֱלֹהִ֖ים מֵ/עֹלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/006.yaml
  text: For I desire steadfast love and not sacrifice[b][a], and the knowledge of God rather than burnt offerings.
translation:
  language: pt
  text: Pois quero amor leal[a], e não sacrifício; o conhecimento de Deus, mais do que holocaustos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “misericórdia” ou “amor fiel”. O hebraico חֶסֶד pode incluir misericórdia, lealdade e fidelidade à aliança.
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente, “de holocaustos”; neste contexto, a preposição hebraica expressa comparação ou preferência: “mais do que holocaustos” ou “em vez de holocaustos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da repreensão no contexto e soa natural em português.
- source_word: חֶסֶד
  choice: amor leal
  rationale: Expressa amor fiel e lealdade pactual sem reduzir o termo apenas a sentimento ou compaixão.
- source_word: חָפַצְתִּי
  choice: quero
  rationale: Comunica de modo direto e corrente o desejo ou prazer de Deus no contraste apresentado.
- source_word: זָבַח
  choice: sacrifício
  rationale: Mantém o sentido cultual amplo e o contraste com o termo mais específico para holocaustos.
- source_word: דַעַת אֱלֹהִים
  choice: o conhecimento de Deus
  rationale: Preserva a forma nominal e sua relação paralela com “amor leal”; no contexto, pode abranger conhecimento relacional e pactual.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Traduz corretamente o título divino, que não é o Tetragrama neste texto.
- source_word: מֵעֹלוֹת
  choice: mais do que holocaustos
  rationale: Representa o מ comparativo como preferência, sem tornar explícita uma abolição absoluta dos sacrifícios.
- source_word: עֹלוֹת
  choice: holocaustos
  rationale: Termo português convencional para ofertas inteiramente queimadas no altar.
theological_decisions:
- issue: Se o versículo rejeita o sacrifício de forma absoluta ou estabelece uma preferência comparativa
  choice: 'Manter a formulação profética contundente no primeiro membro e explicitar a comparação no segundo: Deus prefere amor leal e conhecimento verdadeiro a ritos sacrificiais.'
  alternative: Entender o texto como rejeição absoluta de todo o sistema sacrificial.
  rationale: O paralelismo hebraico combina negação e comparação. A tradução preserva essa tensão, sem reduzir a força da crítica nem afirmar que todo sacrifício legítimo foi abolido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Amor leal” preserva a riqueza relacional de חֶסֶד; “holocaustos” mantém o vocabulário bíblico convencional.
