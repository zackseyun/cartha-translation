lexical_decisions:
- source_word: גִּלְעָד
  choice: Gileade
  rationale: Forma tradicional e amplamente reconhecida em português para o topônimo hebraico.
- source_word: קִרְיַת
  choice: cidade de
  rationale: O substantivo em estado construto introduz a expressão participial seguinte; “cidade de” é natural e fiel em português.
- source_word: פֹּעֲלֵי אָוֶן
  choice: malfeitores
  rationale: Expressa de modo conciso e corrente pessoas que praticam o mal, preservando a força moral da construção hebraica.
- source_word: עֲקֻבָּה מִדָּם
  choice: marcada por rastros de sangue
  rationale: A expressão hebraica é rara e difícil. Esta formulação conserva tanto a ideia de marcas ou vestígios quanto a possível imagem de pegadas sangrentas, sem escolher de modo excessivamente rígido uma única interpretação.
