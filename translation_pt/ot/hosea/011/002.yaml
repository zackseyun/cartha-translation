id: HOS.11.2
reference: Hosea 11:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: קָרְא֖וּ לָ/הֶ֑ם כֵּ֚ן הָלְכ֣וּ מִ/פְּנֵי/הֶ֔ם לַ/בְּעָלִ֣ים יְזַבֵּ֔חוּ וְ/לַ/פְּסִלִ֖ים יְקַטֵּרֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/002.yaml
  text: The more they called to them[a], the more they went away from them[b]; they kept sacrificing to the Baals and burning incense to idols.
translation:
  language: pt
  text: Quanto mais os chamavam[a], mais eles se afastavam deles; continuavam oferecendo sacrifícios aos baalins e queimando incenso aos ídolos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “À medida que os chamavam, assim eles se afastavam deles”. O hebraico não especifica quem os chamava.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “às imagens esculpidas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְאוּ לָהֶם
  choice: os chamavam
  rationale: O qal perfeito na terceira pessoa do plural, com ל e sufixo pronominal, é mantido na voz ativa. Em português, o sujeito oculto de “chamavam” preserva a indefinição do hebraico sem identificar indevidamente quem fazia o chamado.
- source_word: כֵּן
  choice: quanto mais... mais
  rationale: 'A construção correlativa expressa proporcionalidade: à medida que eram chamados, mais se afastavam. Esta formulação é natural em português e reproduz bem a força idiomática do verso.'
- source_word: הָלְכוּ מִפְּנֵיהֶם
  choice: eles se afastavam deles
  rationale: A expressão com הלך, מן e פנים indica afastamento da presença ou rejeição relacional. “Afastavam-se deles” conserva o pronome plural e não explicita além do texto a identidade de seu referente.
- source_word: לַבְּעָלִים
  choice: aos baalins
  rationale: O plural refere-se às diversas manifestações, divindades ou cultos de Baal. “Baalins” preserva o plural do hebraico em forma reconhecível no uso bíblico português.
- source_word: יְזַבֵּחוּ
  choice: continuavam oferecendo sacrifícios
  rationale: O imperfeito, neste contexto poético e profético, descreve uma prática reiterada ou habitual; “continuavam oferecendo sacrifícios” comunica essa persistência com clareza.
- source_word: לַפְּסִלִים
  choice: aos ídolos
  rationale: O termo designa imagens cultuais esculpidas. “Ídolos” é a equivalência corrente e natural, enquanto a nuance material é preservada em nota.
- source_word: יְקַטֵּרוּן
  choice: queimando incenso
  rationale: No contexto cultual, o piel de קטר normalmente indica fazer subir fumaça aromática ou queimar incenso. A expressão escolhida é clara, idiomática e adequada ao objeto indireto “ídolos”.
theological_decisions:
- issue: Sujeito não especificado de “os chamavam”
  choice: Manter um sujeito plural oculto e não identificado
  alternative: “Deus os chamava”, “os profetas os chamavam” ou “eles eram chamados”
  rationale: O hebraico não identifica expressamente o sujeito do verbo. O contexto admite que se pense em Deus, em seus mensageiros ou em ambos, mas a tradução não deve resolver essa ambiguidade legítima.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição pronominal em “eles se afastavam deles” foi mantida para preservar a formulação compacta e a ambiguidade referencial do hebraico. “Baalins” conserva o plural cultual sem transformar o termo em singular.
