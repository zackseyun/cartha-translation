  source_fidelity: A tradução preserva adequadamente as imagens, os lugares de origem, a causatividade de וְהוֹשַׁבְתִּים e a fórmula profética com o nome divino. Contudo, «como um pássaro do Egito» e «como uma pomba da terra da Assíria» podem ser lidos em português como identificação da espécie/origem das aves, não como movimento procedente desses lugares, nuance que o contexto e a opção adotada para יֶחֶרְדוּ procuram comunicar.
  naturalness: O registro é atual e apropriado. Tornar explícita, de maneira moderada, a procedência mediante «vindo/vinda» elimina uma ambiguidade pouco natural sem alterar o sentido contextual. A vírgula após «tremendo» também melhora a leitura da comparação.
  terminology: «Pássaro», «pomba», «Assíria», «farei habitar» e «Yahweh» são escolhas adequadas. «Fare i habitar» mantém de modo transparente o valor causativo do hifil.
  issues:
