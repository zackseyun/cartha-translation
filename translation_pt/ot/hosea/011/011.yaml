    issue: Ambiguidade em «um pássaro do Egito» e «uma pomba da terra da Assíria».
    rationale: Embora reproduza formalmente as expressões hebraicas, em português essas construções podem designar aves egípcias/assírias, em vez de aves que vêm desses lugares. «Vindo/vinda» comunica a procedência implicada pelo contexto e pela tradução principal «virão tremendo».
  revised_text: Eles virão tremendo, como um pássaro vindo do Egito e como uma pomba vinda da terra da Assíria; eu os farei habitar em suas casas — declara Yahweh.
