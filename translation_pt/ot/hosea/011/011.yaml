  text: יֶחֶרְד֤וּ כְ/צִפּוֹר֙ מִ/מִּצְרַ֔יִם וּ/כְ/יוֹנָ֖ה מֵ/אֶ֣רֶץ אַשּׁ֑וּר וְ/הוֹשַׁבְתִּ֥י/ם עַל בָּתֵּי/הֶ֖ם נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/011.yaml
  text: They will come trembling like a bird from Egypt[a], and like a dove from the land of Assyria; and I will settle them in their homes, declares Yahweh.
translation:
  language: pt
  text: Eles virão tremendo, como um pássaro vindo do Egito e como uma pomba vinda da terra da Assíria; eu os farei habitar em suas casas — declara Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֶחֶרְדוּ
  choice: virão tremendo
  rationale: O verbo חרד expressa tremor, temor ou movimento inquieto. Neste contexto de deslocamento desde o Egito e a Assíria em resposta ao chamado do versículo anterior, “virão tremendo” conserva o tremor e torna explícito o movimento contextual sem reduzir o verbo a simples chegada.
- source_word: כְצִפּוֹר
  choice: como um pássaro
  rationale: צִפּוֹר é um termo geral para ave, muitas vezes pequena; “pássaro” preserva a imagem sem especificar indevidamente uma espécie.
- source_word: מִמִּצְרַיִם
  choice: do Egito
  rationale: Reproduz de modo direto e natural a indicação de procedência geográfica.
- source_word: וּכְיוֹנָה
  choice: e como uma pomba
  rationale: יוֹנָה designa normalmente a pomba; a escolha também preserva a imagem recorrente em Oseias.
- source_word: מֵאֶרֶץ אַשּׁוּר
  choice: da terra da Assíria
  rationale: Mantém o substantivo אֶרֶץ expresso no hebraico, em formulação natural em português.
- source_word: וְהוֹשַׁבְתִּים
  choice: eu os farei habitar
  rationale: O hifil de ישׁב tem sentido causativo, “fazer habitar” ou “estabelecer”. A formulação conserva explicitamente essa causatividade e a ideia de restauração residencial.
- source_word: עַל בָּתֵּיהֶם
  choice: em suas casas
  rationale: Embora עַל tenha como sentido básico “sobre”, com o verbo de habitar a expressão indica estabelecimento nas casas. “Em suas casas” transmite a relação idiomática sem sugerir que estarão fisicamente sobre os telhados.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: נְאֻם introduz uma fórmula profética solene. O nome próprio da aliança, יהוה, é transliterado como “Yahweh” em vez de ser substituído por um título.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” o representa diretamente e evita substituí-lo pelo título “Senhor”.
- issue: Nuance da restauração na cláusula final
  choice: eu os farei habitar em suas casas
  alternative: eu os farei voltar às suas casas; eu os estabelecerei em seus lares
  rationale: A forma causativa comunica reassentamento e habitação segura, mas o verbo não diz explicitamente “voltar”. A tradução preserva a restauração contextual sem acrescentar esse componente lexical.
- issue: Movimento implícito em יֶחֶרְדוּ
  choice: virão tremendo
  alternative: tremerão
  rationale: O contexto anterior descreve a resposta dos filhos ao chamado de Yahweh, e as expressões “do Egito” e “da terra da Assíria” sugerem deslocamento. Ainda assim, como o verbo propriamente enfatiza o tremor, a leitura mais estrita é registrada em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “fazer habitar” foi mantida por precisão quanto à forma causativa hebraica; o travessão realça naturalmente a fórmula profética final.
