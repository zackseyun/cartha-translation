  rationale: A revisão esclarece que Egito e Assíria são os lugares de onde vêm os retratados na comparação, preservando a leitura contextual de יֶחֶרְדוּ como «virão tremendo». A nota mantém, sem privilegiá-la indevidamente, a alternativa mais estrita «tremerão».
