base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/007.yaml
  text: My people are bent on turning away from me[a]; though they call to the Most High[b], together he does not lift them up.
translation:
  language: pt
  text: Meu povo está inclinado a se afastar de mim[a]. Embora clamem ao Altíssimo, juntos, ele não os levanta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão traduzida por «se afastar» também pode significar «apostatar» ou «voltar atrás».
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «juntos, não o exaltam», ou: «ninguém o exalta de modo algum». O hebraico da frase final é difícil.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַמִּי
  choice: Meu povo
  rationale: עַם designa aqui o povo da aliança, não principalmente uma entidade política; o sufixo de primeira pessoa exige «meu».
- source_word: תְלוּאִים
  choice: está inclinado a
  rationale: O particípio difícil sugere estar preso, ligado ou persistentemente voltado para algo. A expressão portuguesa comunica uma disposição arraigada sem transformar a imagem hebraica pouco clara numa afirmação excessivamente categórica.
- source_word: לִמְשׁוּבָתִי
  choice: se afastar de mim
  rationale: מְשׁוּבָה costuma indicar apostasia, infidelidade ou retrocesso. Neste contexto, a construção com o sufixo de primeira pessoa expressa o afastamento do povo em relação a Deus.
- source_word: וְאֶל־עַל
  choice: Embora clamem ao Altíssimo
  rationale: אֶל־עַל é entendido como referência ao Altíssimo. «Embora» explicita o contraste contextual entre o clamor e a ausência de socorro, enquanto «clamem» traduz naturalmente o apelo dirigido a Deus.
- source_word: יַחַד לֹא יְרוֹמֵם
  choice: ele não os levanta
  rationale: רוּם pode significar levantar ou exaltar. A leitura adotada toma o Altíssimo como sujeito e entende a frase como ausência de livramento; «os» explicita em português o povo como objeto implícito. A dificuldade sintática e as leituras alternativas são registradas em nota.
theological_decisions:
- issue: Interpretação da frase final יַחַד לֹא יְרוֹמֵם
  choice: 'O Altíssimo é o sujeito: apesar de clamarem, ele não os levanta.'
  alternative: «Juntos, não o exaltam» ou «ninguém o exalta de modo algum».
  rationale: A sintaxe hebraica é condensada e admite tanto uma referência à ausência de resposta divina quanto à recusa de Israel em exaltar Deus. O contraste contextual favorece a primeira leitura, mas a nota preserva a ambiguidade real.
translation_notes:
  register: Português moderno, corrente e digno, com boa legibilidade brasileira e compreensão internacional. Emprega-se «Altíssimo» por ser uma designação bíblica reconhecível, e «levanta» mantém tanto a ideia de erguer quanto, no contexto, a de socorrer.
