  text: וְ/אָנֹכִ֤י תִרְגַּ֨לְתִּי֙ לְ/אֶפְרַ֔יִם קָחָ֖/ם עַל זְרֽוֹעֹתָ֑י/ו וְ/לֹ֥א יָדְע֖וּ כִּ֥י רְפָאתִֽי/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/003.yaml
  text: Yet it was I who taught Ephraim to walk[a], taking them in my arms, but they did not know that I healed them.
translation:
  language: pt
  text: Contudo, fui eu que ensinei Efraim a andar, tomando-os nos braços[a]; mas eles não reconheceram que eu os curei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico massorético traz aqui uma construção difícil, literalmente próxima de “ele os tomou sobre os seus braços”. Muitos entendem que o sentido continua a fala do SENHOR em primeira pessoa: “eu os tomei nos meus braços”.'
    reason: textual_variant
lexical_decisions:
- source_word: תִרְגַּלְתִּי
  choice: ensinei ... a andar
  rationale: O verbo, neste contexto, retrata o cuidado de quem ensina uma criança a dar os primeiros passos. A formulação preserva a imagem parental concreta.
- source_word: לְאֶפְרַיִם
  choice: Efraim
  rationale: 'A preposição hebraica é incorporada de modo idiomático à construção verbal portuguesa: “ensinei Efraim a andar”.'
- source_word: קָחָם
  choice: tomando-os
  rationale: A forma massorética é difícil e, tal como vocalizada, aponta para a terceira pessoa (“ele os tomou”). O gerúndio mantém a continuidade natural do discurso divino em primeira pessoa sem ocultar a dificuldade, registrada na nota.
- source_word: עַל זְרֹעֹתָיו
  choice: nos braços
  rationale: A expressão portuguesa natural para carregar uma criança é “nos braços”. A omissão do possessivo no texto principal evita impor “meus” ou o inesperado “seus”; a forma de terceira pessoa do Texto Massorético é explicitada na nota.
- source_word: וְלֹא יָדְעוּ
  choice: mas eles não reconheceram
  rationale: “Mas” expressa o contraste contextual. “Reconheceram” comunica que Israel não percebeu nem admitiu quem era o agente de sua cura, sentido contextual de ידע.
- source_word: רְפָאתִים
  choice: eu os tinha curado
  rationale: רפא significa normalmente “curar” e pode também sugerir restauração. O mais-que-perfeito composto apresenta de modo natural em português a cura divina anterior que eles deixaram de reconhecer.
theological_decisions:
- issue: Imagem parental antropomórfica aplicada a Deus
  choice: Preservar a imagem concreta de Deus ensinando Efraim a andar e tomando o povo nos braços.
  alternative: Generalizar a linguagem como simples cuidado ou orientação divina.
  rationale: O hebraico retrata cuidado íntimo semelhante ao de um pai ou uma mãe com uma criança; substituir essa figura por linguagem abstrata enfraqueceria a imagem teológica do texto.
- issue: Mudança difícil para a terceira pessoa no meio da fala divina
  choice: Manter no texto principal uma construção fluente e sem possessivo expresso, documentando em nota a terceira pessoa do Texto Massorético.
  alternative: Traduzir literalmente “ele os tomou sobre os seus braços” ou harmonizar explicitamente como “eu os tomei nos meus braços”.
  rationale: O contexto é fala divina em primeira pessoa, mas a forma consonantal/vocalizada e o sufixo massoréticos apresentam terceira pessoa. A solução adotada preserva a leitura contextual sem apagar a ambiguidade textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Contudo, fui eu” conserva a ênfase de וְאָנֹכִי; a imagem parental permanece concreta. O possessivo foi evitado no texto principal para não esconder nem reproduzir de maneira obscura a anomalia de pessoa do Texto Massorético.
