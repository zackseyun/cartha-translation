source:
  edition: WLC
  text: אַחֲרֵ֧י יְהוָ֛ה יֵלְכ֖וּ כְּ/אַרְיֵ֣ה יִשְׁאָ֑ג כִּֽי ה֣וּא יִשְׁאַ֔ג וְ/יֶחֶרְד֥וּ בָנִ֖ים מִ/יָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/010.yaml
  text: They will walk after Yahweh[a]; he will roar like a lion. For he himself will roar[b], and sons will come trembling from the west.
translation:
  language: pt
  text: Eles seguirão Yahweh; ele rugirá como um leão. Pois ele mesmo rugirá, e filhos[a] virão tremendo do oeste[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “crianças” ou “descendentes”; o hebraico traz literalmente o masculino plural “filhos”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “do mar”. Aqui, “o mar” provavelmente indica o oeste como direção geográfica.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי יְהוָה יֵלְכוּ
  choice: Eles seguirão Yahweh
  rationale: A construção com אַחֲרֵי e o verbo הלך significa literalmente ir ou andar atrás de alguém, mas em português atual “seguir” expressa de modo natural a imagem e o sentido, sem acrescentar um destino não declarado.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כְּאַרְיֵה יִשְׁאָג
  choice: ele rugirá como um leão
  rationale: שאג é o verbo característico do rugido do leão; a comparação é direta e natural em português.
- source_word: כִּי הוּא יִשְׁאַג
  choice: Pois ele rugirá
  rationale: כִּי é entendido como explicativo. O pronome explícito הוּא identifica e destaca o sujeito, mas o português já lhe dá destaque suficiente com “ele”, sem exigir “ele mesmo”.
- source_word: וְיֶחֶרְדוּ
  choice: virão tremendo
  rationale: חרד denota tremer de medo, assombro ou reverência. O contexto de retorno permite explicitar o movimento com “virão”, sem acrescentar um objeto como “até ele”.
- source_word: בָנִים
  choice: filhos
  rationale: O substantivo hebraico é masculino plural e significa literalmente “filhos”; o possível sentido coletivo é registrado em nota.
- source_word: מִיָּם
  choice: do oeste
  rationale: Literalmente “do mar”; na geografia hebraica, o mar frequentemente designa o oeste. A direção provável é comunicada no texto, e a forma concreta fica preservada em nota.
theological_decisions:
- issue: A resposta ao rugido divino como retorno
  choice: “virão tremendo” apresenta os filhos respondendo ao rugido de Yahweh com movimento de retorno.
  alternative: Traduzir apenas “tremerão”, sem tornar explícito o movimento implícito no contexto.
  rationale: O contexto de restauração em Oseias 11.8–11 favorece a ideia de retorno, mas o texto evita acrescentar “a ele”, que não aparece no hebraico.
- issue: Força do pronome הוּא na repetição do rugido
  choice: “Pois ele rugirá”
  alternative: “Pois ele mesmo rugirá”
  rationale: O pronome explícito mantém Yahweh como sujeito enfático, mas “ele mesmo” poderia sugerir um contraste mais forte do que o contexto exige. A repetição de “rugirá” conserva a ênfase retórica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. “Seguirão” evita o pouco natural “andarão após”, enquanto “virão tremendo” preserva tanto a reação de temor quanto o movimento sugerido pelo contexto. Os marcadores foram colocados junto aos termos efetivamente explicados pelas notas.
