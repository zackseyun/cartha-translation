base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/004.yaml
  text: I drew them with cords of a man[a], with ropes of love; and I was to them like those who lift a yoke from their jaws[b], and I bent down to him and fed him.
translation:
  language: pt
  text: Eu os atraí com cordas humanas[a], com cordas de amor; fui para eles como os que levantam o jugo de sobre suas faces; inclinei-me para ele e lhe dei de comer.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com cordas de homem”. A expressão hebraica pode indicar uma maneira humana e delicada de conduzir, em contraste com o tratamento dado a um animal.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico passa do plural (“eles”, “suas”) para o singular: “para ele... lhe dei de comer”. Muitas traduções regularizam a frase para o plural.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּחַבְלֵי אָדָם
  choice: com cordas humanas
  rationale: Preserva a imagem concreta de חַבְלֵי e entende אָדָם como qualificando o modo humano ou bondoso de conduzir, formulação natural em português. A leitura mais literal é registrada em nota.
- source_word: אֶמְשְׁכֵם
  choice: Eu os atraí
  rationale: משך significa puxar ou atrair. “Atraí” mantém tanto a força da imagem das cordas quanto sua dimensão relacional.
- source_word: בַּעֲבֹתוֹת אַהֲבָה
  choice: com laços de amor
  rationale: עֲבֹתוֹת indica cordas ou amarras grossas. “Laços” evita repetição imediata de “cordas” e conserva o paralelismo poético e a imagem de vínculo.
- source_word: וָאֶהְיֶה לָהֶם
  choice: fui para eles
  rationale: Reproduz de modo conciso a construção copular hebraica e introduz naturalmente a comparação seguinte.
- source_word: כִּמְרִימֵי עֹל
  choice: como quem levanta o jugo
  rationale: “Como quem” é idiomático em português e deixa aberta a referência do particípio plural hebraico, sem transformar a figura em explicação abstrata.
- source_word: עַל לְחֵיהֶם
  choice: de sobre suas mandíbulas
  rationale: לְחִי pode designar face, queixo ou mandíbula. “Mandíbulas” se ajusta à imagem de um animal aliviado do jugo, enquanto “de sobre” conserva a preposição עַל.
- source_word: וְאַט
  choice: inclinei-me
  rationale: Expressa o gesto de abaixar-se ou curvar-se e preserva a imagem concreta do cuidado divino.
- source_word: אֵלָיו
  choice: para ele / lhe
  rationale: Mantém o sufixo singular do texto massorético, apesar dos referentes plurais anteriores, sem normalizá-lo silenciosamente.
- source_word: אוֹכִיל
  choice: dei de comer
  rationale: O hifil de אכל significa fazer comer ou alimentar. “Dei de comer” é claro, natural e permite conservar o pronome singular.
theological_decisions:
- issue: Imagens antropomórfica e pastoril do cuidado de Deus
  choice: Conservar as ações concretas de atrair, levantar o jugo, inclinar-se e dar de comer.
  alternative: Parafrasear como Deus guiando Israel com bondade e provendo suas necessidades.
  rationale: As imagens hebraicas unem ternura e autoridade. Mantê-las evita uma expansão alegórica ou doutrinária não expressa no versículo.
- issue: Mudança de referentes plurais para o singular אֵלָיו
  choice: Manter o singular em “inclinei-me para ele e lhe dei de comer”.
  alternative: 'Regularizar para o plural: “inclinei-me para eles e lhes dei de comer”.'
  rationale: O texto massorético traz o singular, que pode apresentar Israel coletivamente como um só filho. A tensão gramatical deve permanecer no texto, com esclarecimento em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A tradução conserva a poesia e a metáfora rural, evita arcaísmos desnecessários e mantém em nota tanto a alternativa mais literal de בְּחַבְלֵי אָדָם quanto a mudança pronominal do plural para o singular.
