source:
  edition: WLC
  text: אֵ֞יךְ אֶתֶּנְ/ךָ֣ אֶפְרַ֗יִם אֲמַגֶּנְ/ךָ֙ יִשְׂרָאֵ֔ל אֵ֚יךְ אֶתֶּנְ/ךָ֣ כְ/אַדְמָ֔ה אֲשִֽׂימְ/ךָ֖ כִּ/צְבֹאיִ֑ם נֶהְפַּ֤ךְ עָלַ/י֙ לִבִּ֔/י יַ֖חַד נִכְמְר֥וּ נִחוּמָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/008.yaml
  text: How can I give you up[a], Ephraim? How can I hand you over, Israel? How can I make you like Admah? How can I set you like Zeboiim? My heart is turned over within me[c][b]; all my compassions are stirred.
translation:
  language: pt
  text: Como poderia eu abandonar você, Efraim? Como poderia entregar você, Israel? Como poderia tornar você semelhante a Admá? Como poderia tornar você semelhante a Zeboim?[a] Meu coração se revira dentro de mim;[b] toda a minha compaixão se inflama.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Admá e Zeboim eram cidades associadas à mesma destruição de Sodoma e Gomorra; a comparação evoca destruição total (ver Deuteronômio 29:23).
    reason: cross_reference
  - marker: b
    text: 'Ou: “Meu coração muda dentro de mim”. Mais literalmente, o hebraico retrata o coração de Deus como “virado” ou “revolvido”, exprimindo intensa comoção interior.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “toda a minha compaixão se comove” ou “se aquece”. O hebraico pode descrever a compaixão como aquecida, acesa ou profundamente despertada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Como poderia
  rationale: A forma interrogativa repetida expressa espanto, relutância e uma impossibilidade afetiva, não apenas uma pergunta sobre o modo de agir.
- source_word: אֶתֶּנְךָ
  choice: abandonar você
  rationale: Embora נתן signifique literalmente “dar”, neste contexto de entrega ao juízo a expressão comunica desistir de Efraim sem inserir explicitamente o agente destruidor.
- source_word: אֲמַגֶּנְךָ
  choice: entregar você
  rationale: O Piel de מגן aqui tem o sentido de entregar ou deixar nas mãos de outro; a escolha preserva o paralelismo sem repetir “abandonar”.
- source_word: אֶפְרַיִם / יִשְׂרָאֵל
  choice: Efraim / Israel
  rationale: Os nomes próprios são mantidos. No contexto, designam em paralelo o reino do norte e o povo da aliança, mas a tradução não substitui os nomes por essa interpretação.
- source_word: כְאַדְמָה
  choice: como Admá
  rationale: O nome da cidade é preservado, juntamente com a comparação ao seu destino de destruição; a nota esclarece a alusão histórica.
- source_word: אֲשִׂימְךָ כִּצְבֹאיִם
  choice: fazer com você o mesmo que com Zeboim
  rationale: A formulação torna natural em português o sentido contextual de שׂים seguido da comparação, sem apagar o nome próprio nem explicitar além do texto o modo da destruição.
- source_word: נֶהְפַּךְ עָלַי לִבִּי
  choice: Meu coração se revira dentro de mim
  rationale: “Se revira” preserva a imagem visceral de um coração que se volta ou se revolve e comunica intensa comoção interior, em vez de reduzi-la à afirmação abstrata de uma mudança de decisão.
- source_word: יַחַד
  choice: toda
  rationale: Embora signifique literalmente “juntamente” ou “ao mesmo tempo”, aqui apresenta os sentimentos de compaixão em sua totalidade; “toda” produz uma expressão idiomática em português.
- source_word: נִכְמְרוּ
  choice: se inflama
  rationale: O verbo descreve algo que se aquece ou se acende e, figuradamente, uma emoção profunda. “Se inflama” conserva a metáfora térmica, enquanto a nota registra alternativas menos figurativas.
- source_word: נִחוּמָי
  choice: minha compaixão
  rationale: Neste contexto, o substantivo plural relacionado a נחם indica sentimentos de piedade e misericórdia. O singular coletivo é mais natural em português e, com “toda”, mantém a ideia de plenitude.
theological_decisions:
- issue: Linguagem antropopática sobre o movimento interior de Deus
  choice: Manter a imagem vívida do coração de Deus que se revira e de sua compaixão que se inflama
  alternative: Parafrasear de modo abstrato, como “mudei de ideia”
  rationale: O hebraico apresenta deliberadamente a compaixão divina em termos viscerais e relacionais. A tradução preserva essa tensão teológica, sem explicá-la como simples mudança mental.
- issue: Identificação de Admá e Zeboim
  choice: Conservar os nomes das cidades no texto principal e explicar a alusão em nota
  alternative: Substituir os nomes por algo como “as cidades que destruí”
  rationale: O texto-fonte nomeia diretamente as cidades. A nota permite ao leitor perceber a alusão ao juízo total sem transformar a tradução em paráfrase.
- issue: Relação entre juízo e compaixão divina
  choice: Preservar a sequência de perguntas e a forte virada emocional
  alternative: Harmonizar a passagem como uma revogação explícita e definitiva de todo juízo
  rationale: O versículo expressa a tensão entre a entrega ao juízo e a compaixão de Deus, mas não formula aqui uma explicação sistemática dessa relação.
translation_notes:
  register: Português atual, digno e acessível, com construção legível no Brasil. O uso de “você” evita a oscilação regional de formas verbais ligadas a “tu”. As perguntas repetidas preservam o ritmo retórico. “Se revira” e “se inflama” mantêm as imagens corporais e térmicas do hebraico sem adotar terminologia confessional.
