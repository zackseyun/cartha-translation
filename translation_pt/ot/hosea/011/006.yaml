  yaml_path: translation/ot/hosea/011/006.yaml
  text: A sword will whirl through his cities[a], and will consume his bars[b], and devour them because of their counsels.
translation:
  language: pt
  text: A espada girará pelas suas cidades[a], consumirá as suas trancas[b] e devorará por causa de seus conselhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cairá sobre as suas cidades” ou “se enfurecerá nas suas cidades”. O verbo hebraico é difícil e pode indicar movimento giratório, queda ou agitação furiosa.
    reason: lexical_alternative
  - marker: b
    text: Isto é, provavelmente, as trancas dos portões. Outros entendem o termo hebraico como “seus governantes”, mas o contexto de cidades sob ataque favorece as defesas físicas. O hebraico usa sufixos possessivos singulares em “suas cidades” e “suas trancas”, mas um sufixo plural em “seus conselhos”. O objeto de “devorará” não é expresso no hebraico.
    reason: alternative_reading
lexical_decisions:
- source_word: וְחָלָה
  choice: girará
  rationale: O verbo é difícil neste contexto e pode sugerir movimento violento, queda ou fúria. “Girará” preserva a imagem dinâmica da espada sem reduzir a expressão a uma simples ocorrência de guerra.
- source_word: חֶרֶב
  choice: a espada
  rationale: Mantém o substantivo concreto singular do hebraico, que também pode representar coletivamente a guerra.
- source_word: בְּעָרָיו
  choice: pelas suas cidades
  rationale: A preposição significa normalmente “em”, mas, com a ação dinâmica atribuída à espada, “pelas” comunica de modo natural seu movimento destrutivo dentro das cidades.
- source_word: וְכִלְּתָה
  choice: consumirá
  rationale: Expressa a ideia de levar ao fim, acabar com ou consumir e se ajusta ao paralelismo destrutivo do verso.
- source_word: בַדָּיו
  choice: as suas trancas
  rationale: No cenário de cidades atacadas, o termo provavelmente designa as trancas defensivas dos portões. “Trancas” é concreto e natural em português.
- source_word: וְאָכָלָה
  choice: e os devorará
  rationale: O verbo significa literalmente comer ou devorar. “Devorará” preserva a personificação vívida da espada; o objeto “os” é suprido para formar uma oração natural em português e retoma os habitantes implícitos das cidades.
- source_word: מִמֹּעֲצוֹתֵיהֶם
  choice: por causa dos seus próprios conselhos
  rationale: A preposição מן é entendida causalmente. “Conselhos” preserva o vínculo lexical com עצה, enquanto “próprios” explicita que o possessivo plural se refere aos atingidos, sem eliminar a mudança de número presente no hebraico.
theological_decisions:
- issue: Mudança dos sufixos pronominais do singular em “suas cidades” e “suas trancas” para o plural em “seus conselhos”
  choice: Preservar em português a tensão entre o referente corporativo singular e o grupo plural, usando possessivos formalmente ambíguos e indicando a mudança na nota.
  alternative: 'Uniformizar tudo no plural: “as cidades deles... as trancas deles... os conselhos deles”.'
  rationale: O hebraico passa deliberadamente de sufixos singulares para um sufixo plural. Isso pode apresentar Israel/Efraim como uma unidade coletiva e depois enfocar as pessoas; harmonizar os números apagaria essa tensão.
- issue: Objeto de “devorará”
  choice: Suprir “os”, entendendo como objeto implícito os habitantes atingidos pela espada.
  alternative: 'Deixar o verbo sem objeto: “e devorará por causa dos seus conselhos”.'
  rationale: O hebraico não traz objeto expresso, mas o verbo transitivo pede complemento mais naturalmente em português. A inserção é interpretativa e, por isso, é assinalada em nota.
translation_notes:
  register: Português atual, digno e acessível, com cadência profética. “Girará” mantém a poesia incomum do hebraico; “trancas” é preferível a “barras” por designar naturalmente a defesa dos portões. Os possessivos “suas/seus” permitem conservar a oscilação corporativa do original, explicada na nota.
