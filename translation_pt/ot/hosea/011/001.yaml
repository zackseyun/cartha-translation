  text: כִּ֛י נַ֥עַר יִשְׂרָאֵ֖ל וָ/אֹהֲבֵ֑/הוּ וּ/מִ/מִּצְרַ֖יִם קָרָ֥אתִי לִ/בְנִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/001.yaml
  text: When Israel was a child[a], I loved him, and out of Egypt I called my son.
translation:
  language: pt
  text: Quando Israel era menino[a], eu o amei e do Egito chamei meu filho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Pois Israel era menino, e eu o amei». A expressão hebraica inicial pode ter sentido causal («pois/porque») ou temporal («quando»); o sentido temporal se ajusta à recordação do passado neste versículo. «Do Egito chamei meu filho» é citado posteriormente em Mateus 2:15.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Quando
  rationale: Neste contexto retrospectivo, introduz naturalmente uma oração temporal ou circunstancial. A nota preserva a possível leitura causal.
- source_word: נַעַר
  choice: menino
  rationale: Expressa a juventude de Israel personificado como filho e preserva o masculino singular do hebraico. «Criança» seria possível, mas menos específica.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém o nome próprio do povo, aqui personificado no singular.
- source_word: וָאֹהֲבֵהוּ
  choice: eu o amei
  rationale: Preserva a primeira pessoa do falante divino e o objeto masculino singular que retoma Israel.
- source_word: וּמִמִּצְרַיִם
  choice: e do Egito
  rationale: A preposição indica origem ou procedência e evoca naturalmente o êxodo.
- source_word: קָרָאתִי
  choice: chamei
  rationale: Mantém o sentido amplo de chamar ou convocar sem acrescentar uma interpretação não explicitada pelo hebraico.
- source_word: לִבְנִי
  choice: meu filho
  rationale: Com o verbo «chamar», a construção identifica aquele que foi chamado; preserva a metáfora filial aplicada a Israel.
theological_decisions:
- issue: Israel coletivo como «meu filho» e posterior uso cristológico
  choice: Traduzir segundo o sentido histórico imediato de Oseias, no qual Israel é personificado como filho de Deus.
  alternative: Formular o texto como uma predição messiânica exclusiva e direta.
  rationale: O referente imediato é o Israel coletivo na tradição do êxodo. A redação continua compatível com a citação em Mateus 2:15, sem importar essa aplicação posterior para o texto principal de Oseias.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Menino» preserva a personificação masculina e filial de Israel; a ordem «do Egito chamei meu filho» conserva a ênfase inicial na origem e a formulação reconhecível da citação posterior.
