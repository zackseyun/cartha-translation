source:
  edition: WLC
  text: לֹ֤א יָשׁוּב֙ אֶל אֶ֣רֶץ מִצְרַ֔יִם וְ/אַשּׁ֖וּר ה֣וּא מַלְכּ֑/וֹ כִּ֥י מֵאֲנ֖וּ לָ/שֽׁוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/005.yaml
  text: He will not return to the land of Egypt[a], but Assyria will be his king[b], because they have refused to return.
translation:
  language: pt
  text: Ele não voltará à terra do Egito; mas a Assíria será o seu rei[a], porque eles se recusaram a voltar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais formal: “mas a Assíria — ela será o seu rei”. A construção hebraica é condensada.'
    reason: lexical_alternative
  - marker: b
    text: “Voltar” também pode ter aqui o sentido de “voltar-se” ou “arrepender-se”. O hebraico preserva tanto a ideia de retorno quanto a de mudança espiritual.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יָשׁוּב
  choice: não voltará
  rationale: O imperfeito qal com negação é entendido como anúncio profético futuro. “Voltará” mantém a ligação lexical com לָשׁוּב no fim do versículo.
- source_word: אֶל אֶרֶץ מִצְרַיִם
  choice: para a terra do Egito
  rationale: Preserva a preposição e o substantivo “terra”, com sua possível ressonância histórica do cativeiro e do êxodo.
- source_word: וְאַשּׁוּר
  choice: pelo contrário, a Assíria
  rationale: A conjunção recebe valor adversativo no contraste entre Egito e Assíria. “Pelo contrário” expressa naturalmente que o destino não será o Egito, mas a dominação assíria.
- source_word: הוּא מַלְכּוֹ
  choice: será o seu rei
  rationale: O futuro se ajusta ao contexto profético, e a imagem de a Assíria ser “rei” é preservada, sem paráfrase como “dominará sobre ele”.
- source_word: כִּי
  choice: porque
  rationale: Introduz a razão do juízo anunciado.
- source_word: מֵאֲנוּ
  choice: eles se recusaram
  rationale: Traduz o perfeito 3cp e mantém implícito, como no hebraico, o referente coletivo.
- source_word: לָשׁוּב
  choice: a voltar
  rationale: “Voltar” conserva tanto a possível ideia de retorno quanto a de conversão e repete a raiz verbal usada no início do versículo.
theological_decisions:
- issue: Sentido de שוב nas duas ocorrências
  choice: Traduzir ambas por formas de “voltar”.
  alternative: Distinguir entre “regressar” na primeira ocorrência e “arrepender-se” na segunda.
  rationale: A repetição preserva o jogo entre retorno geográfico e volta espiritual, sem resolver uma ambiguidade genuína do texto.
- issue: Referente do verbo plural מֵאֲנוּ
  choice: Manter “eles”, sem explicitar o antecedente.
  alternative: Traduzir “o meu povo se recusou”.
  rationale: O hebraico emprega a terceira pessoa do plural sem sujeito expresso; inserir “meu povo” dependeria do contexto e ultrapassaria a formulação deste versículo.
- issue: Imagem da Assíria como rei
  choice: Conservar “a Assíria será o seu rei”.
  alternative: Parafrasear como “a Assíria o dominará”.
  rationale: A formulação metafórica apresenta a potência estrangeira como soberana de Israel e deve permanecer visível na tradução.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Mantém a estrutura profética, a metáfora política e a repetição intencional de “voltar”.
