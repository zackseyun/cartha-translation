source:
  edition: WLC
  text: לֹ֤א יָשׁוּב֙ אֶל אֶ֣רֶץ מִצְרַ֔יִם וְ/אַשּׁ֖וּר ה֣וּא מַלְכּ֑/וֹ כִּ֥י מֵאֲנ֖וּ לָ/שֽׁוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/005.yaml
  text: He will not return to the land of Egypt[a], but Assyria will be his king[b], because they have refused to return.
translation:
  language: pt
  text: Ele não voltará à terra do Egito[a]; mas a Assíria será o seu rei, porque eles se recusaram a voltar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais formal: “Ele não voltará à terra do Egito, mas a Assíria — ela será o seu rei”. A construção hebraica é condensada.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “voltar” também pode ter o sentido de “mudar de rumo” ou “arrepender-se”. O hebraico permite tanto a ideia de retorno quanto a de conversão.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יָשׁוּב
  choice: não voltará
  rationale: O imperfeito qal com negação tem sentido futuro no anúncio profético. “Voltará” também preserva a ligação lexical com לָשׁוּב no fim do versículo.
- source_word: אֶל אֶרֶץ מִצְרַיִם
  choice: à terra do Egito
  rationale: Mantém a preposição e o substantivo “terra”, preservando a possível evocação do antigo cativeiro de Israel e do êxodo.
- source_word: וְאַשּׁוּר
  choice: mas a Assíria
  rationale: 'A conjunção recebe valor adversativo contextual: não o Egito, mas a Assíria. A formulação conserva o contraste sem expandi-lo.'
- source_word: הוּא מַלְכּוֹ
  choice: será o seu rei
  rationale: O futuro se ajusta ao contexto profético, enquanto “seu rei” mantém a metáfora hebraica de domínio estrangeiro em vez de parafraseá-la como “governará sobre ele”.
- source_word: כִּי
  choice: porque
  rationale: Introduz diretamente a razão do juízo anunciado.
- source_word: מֵאֲנוּ
  choice: eles se recusaram
  rationale: O perfeito na terceira pessoa do plural descreve a recusa do povo coletivamente. O pronome plural preserva o sujeito implícito do hebraico sem acrescentar “meu povo” ao texto.
- source_word: לָשׁוּב
  choice: a voltar
  rationale: “Voltar” pode indicar tanto retorno quanto mudança de direção ou arrependimento. A repetição do mesmo verbo português preserva o jogo lexical e a ambiguidade do hebraico.
theological_decisions:
- issue: Sentido de שוב nas duas ocorrências
  choice: Traduzir ambas por “voltar”
  alternative: Traduzir a primeira por “regressar” e a segunda por “arrepender-se”
  rationale: Em Oseias, שוב pode reunir sentidos geográficos e espirituais. Manter o mesmo verbo não resolve indevidamente a tensão entre retorno físico e conversão pactual.
- issue: Referente do verbo plural מֵאֲנוּ
  choice: Manter “eles” com antecedente implícito
  alternative: Explicitar “meu povo” ou “os israelitas”
  rationale: O hebraico traz um verbo plural sem sujeito nominal nesta oração. Deixar o referente implícito evita importar palavras do contexto próximo.
- issue: Relação entre Egito e Assíria
  choice: Expressar contraste com “mas”
  alternative: Usar a coordenação simples “e”
  rationale: O contexto favorece o contraste entre não voltar ao Egito e ficar sujeito à Assíria, embora a construção hebraica permaneça condensada.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A sintaxe mantém o contraste e a metáfora do original sem soar arcaica. Os marcadores [a] e [b] aparecem no texto principal e correspondem às notas.
