  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לֹ֤א אֶֽעֱשֶׂה֙ חֲר֣וֹן אַפִּ֔/י לֹ֥א אָשׁ֖וּב לְ/שַׁחֵ֣ת אֶפְרָ֑יִם כִּ֣י אֵ֤ל אָֽנֹכִי֙ וְ/לֹא אִ֔ישׁ בְּ/קִרְבְּ/ךָ֣ קָד֔וֹשׁ וְ/לֹ֥א אָב֖וֹא בְּ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/009.yaml
  text: I will not carry out the fierceness of my anger[a]; I will not again destroy Ephraim. For I am God and not a man, the Holy One in your midst[c][b], and I will not come into the city.
translation:
  language: pt
  text: Não executarei o furor da minha ira[b]; não voltarei a destruir Efraim[c]. Pois eu sou Deus, e não homem, o Santo no seu meio; não entrarei na cidade[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não virei com fúria”. A cláusula hebraica final é difícil; o texto massorético pode ser traduzido mais literalmente como “não entrarei na cidade”, enquanto alguns a entendem como uma negação da vinda de Deus como destruidor.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “o ardor da minha ira”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “não destruirei Efraim outra vez”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעֱשֶׂה חֲרוֹן אַפִּי
  choice: executarei o furor da minha ira
  rationale: O verbo עשה é amplo, mas, com a expressão que descreve a ira ardente, indica pôr essa ira em ação. “Executarei” mantém a ideia de juízo efetivado sem ampliar o sentido.
- source_word: חֲרוֹן אַפִּי
  choice: o furor da minha ira
  rationale: A expressão hebraica evoca o ardor ou calor da ira. “Furor da minha ira” preserva sua intensidade em português digno e compreensível.
- source_word: אָשׁוּב לְשַׁחֵת
  choice: voltarei a destruir
  rationale: שׁוב seguido de infinitivo pode indicar retorno ou repetição. “Voltarei a destruir” conserva as duas nuances melhor que uma formulação apenas adverbial.
- source_word: אֵל אָנֹכִי וְלֹא אִישׁ
  choice: eu sou Deus, e não homem
  rationale: A antítese hebraica contrasta Deus com um ser humano. A formulação concisa reproduz a estrutura e a força retórica do original.
- source_word: בְּקִרְבְּךָ קָדוֹשׁ
  choice: o Santo no seu meio
  rationale: קָדוֹשׁ funciona substantivamente como designação divina, enquanto בְּקִרְבְּךָ expressa presença no meio do destinatário coletivo.
- source_word: וְלֹא אָבוֹא בְּעִיר
  choice: não entrarei na cidade
  rationale: A vocalização massorética de בְּעִיר favorece o sentido concreto “na cidade”. Embora a cláusula seja difícil no contexto, a tradução principal mantém essa leitura textual e registra a interpretação contextual em nota.
theological_decisions:
- issue: A recusa divina de executar plenamente o juízo
  choice: A declaração é mantida como recusa de executar o furor e de voltar a destruir Efraim, fundamentada na identidade de Deus como o Santo presente no meio do povo.
  alternative: Explicar a fala como simples mudança emocional ou harmonizá-la explicitamente com uma doutrina filosófica da imutabilidade.
  rationale: O versículo relaciona misericórdia, ira, santidade e presença divina sem explicar filosoficamente essa relação; a tradução preserva essa tensão.
- issue: Sentido da cláusula וְלֹא אָבוֹא בְּעִיר
  choice: não entrarei na cidade
  alternative: não virei com fúria
  rationale: A leitura principal segue de perto o texto massorético vocalizado. A alternativa, coerente com o contexto de juízo suspenso, é apresentada em nota sem substituir a dificuldade genuína do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe paralela e a antítese do hebraico foram preservadas. O tratamento singular de בְּקִרְבְּךָ aparece como “no seu meio”, adequado ao destinatário coletivo personificado, sem introduzir marca regional excessiva.
