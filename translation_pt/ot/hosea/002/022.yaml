  yaml_path: translation/ot/hosea/002/022.yaml
  text: And I will betroth you to myself in faithfulness[a], and you shall know Yahweh.
translation:
  language: pt
  text: E eu tomarei você como noiva para mim, em fidelidade[a], e você conhecerá Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em firmeza” ou, mais formalmente, “em fé”. O termo hebraico expressa confiabilidade e fidelidade à aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵרַשְׂתִּיךְ
  choice: E eu me casarei com você
  rationale: O verbo ארשׂ designa o ato de tomar alguém como noiva ou firmar um compromisso matrimonial. Em português atual, “me casarei com você” comunica com naturalidade a imagem matrimonial, embora “ficarei noivo de você” seja mais formalmente específico.
- source_word: לִי
  choice: com você
  rationale: O hebraico é literalmente “para mim”. Integrado à construção verbal idiomática em português, exprime que Yahweh toma a mulher para si em vínculo matrimonial.
- source_word: בֶּאֱמוּנָה
  choice: em fidelidade
  rationale: אֱמוּנָה pode indicar firmeza, confiabilidade, fé ou fidelidade. No contexto matrimonial e de aliança, “fidelidade” preserva melhor a ideia de lealdade confiável sem reduzir o termo à crença subjetiva.
- source_word: וְיָדַעַתְּ
  choice: e você conhecerá
  rationale: ידע significa “conhecer” e, neste contexto, conserva profundidade relacional e pactual. A tradução não explicita essa profundidade para evitar resolver a riqueza do original.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, em vez de substituí-lo por um título.
theological_decisions:
- issue: Força relacional de ידע no contexto matrimonial e de aliança
  choice: manter “conhecerá” sem expansão interpretativa
  alternative: “reconhecerá” ou “conhecerá intimamente”
  rationale: “Conhecerá” preserva tanto o sentido básico do verbo quanto sua profundidade relacional contextual, sem estreitar nem ampliar indevidamente o texto.
- issue: Especificidade do verbo de compromisso matrimonial
  choice: “me casarei com você” no texto principal
  alternative: “ficarei noivo de você” ou “tomarei você por noiva”
  rationale: A alternativa escolhida é clara e natural para leitores modernos, mantendo a metáfora matrimonial; a nota registra a precisão formal do hebraico, que aponta especificamente para o noivado ou compromisso matrimonial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva a repetição solene de “E eu” e mantém o nome divino Yahweh. A formulação natural “me casarei com você” prioriza clareza, enquanto a nota preserva a especificidade lexical do noivado.
