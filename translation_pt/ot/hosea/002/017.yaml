id: HOS.2.17
reference: Hosea 2:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/נָתַ֨תִּי לָ֤/הּ אֶת כְּרָמֶ֨י/הָ֙ מִ/שָּׁ֔ם וְ/אֶת עֵ֥מֶק עָכ֖וֹר לְ/פֶ֣תַח תִּקְוָ֑ה וְ/עָ֤נְתָה שָּׁ֨מָּ/ה֙ כִּ/ימֵ֣י נְעוּרֶ֔י/הָ וִּ/כְ/י֖וֹם עֲלֹתָ֥/הּ מֵ/אֶֽרֶץ מִצְרָֽיִם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/017.yaml
  text: And from there I will give her her vineyards[a], and the Valley of Achor as a door of hope. There she will answer as in the days of her youth[b], as on the day when she came up from the land of Egypt.
translation:
  language: pt
  text: E dali lhe darei as suas vinhas e o vale de Acor[a] como porta de esperança. Ali ela responderá[b] como nos dias da sua juventude, como no dia em que subiu da terra do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O vale de Acor lembra o lugar ligado ao julgamento de Acã (Js 7.24–26); assim, um lugar de aflição se transforma em porta de esperança.
    reason: cross_reference
  - marker: b
    text: Ou “cantará ali”; o verbo hebraico pode indicar uma resposta e, neste contexto, talvez implique canto responsivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: E ... darei
  rationale: O perfeito Qal com conjunção, no fluxo profético, tem sentido futuro; “dar” preserva o sentido comum de נתן.
- source_word: כְּרָמֶיהָ
  choice: as suas vinhas
  rationale: כֶּרֶם designa normalmente uma vinha, e o plural com sufixo feminino aponta para a restauração da prosperidade agrícola dela, isto é, de Israel.
- source_word: מִשָּׁם
  choice: dali
  rationale: Mantém de modo natural em português a ligação espacial com o deserto mencionado no contexto anterior.
- source_word: עֵמֶק עָכוֹר
  choice: o vale de Acor
  rationale: Conserva o topônimo por transliteração e permite preservar sua alusão ao episódio de Josué 7.
- source_word: לְפֶתַח תִּקְוָה
  choice: como porta de esperança
  rationale: “Porta” representa diretamente a imagem de פתח, enquanto “como” expressa a função ou o resultado indicado pela preposição לְ.
- source_word: וְעָנְתָה
  choice: ela responderá
  rationale: O sentido lexical básico do Qal é “responder”; a possível nuance de cantar responsivamente é mantida em nota, sem estreitar a ambiguidade no texto principal.
- source_word: שָׁמָּה
  choice: Ali
  rationale: Preserva o advérbio de lugar e liga a resposta restaurada ao lugar que Deus transforma.
- source_word: כִּימֵי נְעוּרֶיהָ
  choice: como nos dias da sua juventude
  rationale: Reproduz naturalmente a comparação e a evocação do período inicial da relação de Israel com Deus.
- source_word: וּכְיוֹם עֲלֹתָהּ מֵאֶרֶץ מִצְרָיִם
  choice: como no dia em que subiu da terra do Egito
  rationale: Preserva a imagem hebraica de subir do Egito e a referência histórica ao êxodo.
theological_decisions:
- issue: Sentido de וְעָנְתָה no contexto da restauração
  choice: ela responderá
  alternative: ela cantará; ela responderá cantando
  rationale: “Responder” conserva o sentido básico do verbo e a tensão do texto. O contexto pode sugerir canto responsivo e alegria renovada, mas não exige que essa nuance mais específica seja incorporada ao texto principal.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A sintaxe mantém a coordenação hebraica sem explicitar além do texto, e as notas preservam tanto a alusão histórica de Acor quanto a ambiguidade lexical de “responderá”.
