  text: לָ/כֵ֣ן אָשׁ֔וּב וְ/לָקַחְתִּ֤י דְגָנִ/י֙ בְּ/עִתּ֔/וֹ וְ/תִירוֹשִׁ֖/י בְּ/מֽוֹעֲד֑/וֹ וְ/הִצַּלְתִּי֙ צַמְרִ֣/י וּ/פִשְׁתִּ֔/י לְ/כַסּ֖וֹת אֶת עֶרְוָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/011.yaml
  text: Therefore I will return and take back my grain in its time[a], and my new wine in its season; and I will take away my wool and my flax[b], which were to cover her nakedness.
translation:
  language: pt
  text: Por isso, voltarei e tomarei de volta os meus grãos no tempo certo e o meu vinho novo na estação própria; retirarei[a] a minha lã e o meu linho, que serviam para cobrir a nudez dela[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “arrancarei”, destacando uma retirada súbita ou vigorosa.'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica é literalmente “a nudez dela” e também pode evocar a vergonha causada pela exposição.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Marca de modo natural a consequência da acusação e do juízo anunciados anteriormente.
- source_word: אָשׁוּב וְלָקַחְתִּי
  choice: voltarei e tomarei de volta
  rationale: Preserva o sentido de retorno de שׁוב e torna explícita, conforme o contexto, a retomada dos bens anteriormente concedidos.
- source_word: דְגָנִי
  choice: os meus grãos
  rationale: דגן designa coletivamente a produção de grãos. O plural é mais natural em português corrente do que o singular massivo 'meu grão' ou 'meu cereal'.
- source_word: בְּעִתּוֹ
  choice: no tempo certo
  rationale: Expressa o momento próprio da colheita sem introduzir uma precisão ausente do hebraico.
- source_word: תִירוֹשִׁי
  choice: o meu vinho novo
  rationale: תירוש se refere ao produto recente da videira; 'vinho novo' mantém a nuance agrícola e é mais acessível do que 'mosto'.
- source_word: בְּמוֹעֲדוֹ
  choice: na estação própria
  rationale: מועד indica o tempo ou período determinado; a formulação mantém o paralelismo temporal com os grãos.
- source_word: וְהִצַּלְתִּי
  choice: retirarei
  rationale: Neste contexto, o Hifil de נצל indica remover ou arrebatar os materiais que cobriam a mulher. 'Retirarei' comunica claramente a ação, enquanto a nota preserva a alternativa mais vigorosa.
- source_word: צַמְרִי וּפִשְׁתִּי
  choice: a minha lã e o meu linho
  rationale: Mantém os dois materiais têxteis e os possessivos divinos. 'Linho' é a designação portuguesa corrente para a planta/fibra de פשתה.
- source_word: לְכַסּוֹת
  choice: que serviam para cobrir
  rationale: Explicita com naturalidade o valor de finalidade do infinitivo sem alterar sua relação com a lã e o linho.
- source_word: עֶרְוָתָהּ
  choice: a nudez dela
  rationale: Preserva a imagem concreta de exposição corporal e não reduz antecipadamente suas conotações de vergonha a uma abstração.
theological_decisions:
- issue: Se deve ficar explícito que YHWH retoma dádivas anteriormente concedidas
  choice: Traduzir וְלָקַחְתִּי como 'e tomarei de volta'
  alternative: Traduzir apenas como 'e tomarei'
  rationale: O contexto apresenta os produtos como bens pertencentes a YHWH e concedidos à mulher; 'de volta' comunica a reversão implícita sem acrescentar uma doutrina externa ao texto.
- issue: Se a imagem de exposição em עֶרְוָתָהּ deve ser suavizada
  choice: Manter 'a nudez dela' no texto principal
  alternative: Usar 'a vergonha dela'
  rationale: A metáfora profética depende da exposição corporal concreta, embora também evoque vergonha. A tradução conserva essa tensão em vez de resolvê-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o paralelismo agrícola do hebraico, evita termos excessivamente técnicos e conserva a imagem forte da nudez exposta.
