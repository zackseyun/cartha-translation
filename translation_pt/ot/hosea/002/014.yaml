base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/014.yaml
  text: And I will lay waste her vine and her fig tree[a], of which she said, ‘These are my wages that my lovers gave me.’ I will make them a forest, and the wild animals of the field will devour them.
translation:
  language: pt
  text: 'Devastarei a sua videira e a sua figueira, das quais ela disse: “São o pagamento[a] que os meus amantes me deram”. Eu as transformarei numa floresta, e os animais selvagens do campo as devorarão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “salário”; o termo hebraico também pode referir-se ao pagamento de uma prostituta, na metáfora de infidelidade de Oseias.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲשִׁמֹּתִי
  choice: Devastarei
  rationale: O hifil de שׁמם expressa causar devastação ou desolação. “Devastarei” preserva a força do juízo e soa natural em português atual.
- source_word: גַּפְנָהּ וּתְאֵנָתָהּ
  choice: a sua videira e a sua figueira
  rationale: Mantém as imagens agrícolas no singular e traduz diretamente os nomes das plantas, sem generalizá-los como vinha ou pomar.
- source_word: אֶתְנָה
  choice: pagamento
  rationale: Conserva o caráter transacional do termo e permite que sua conotação de pagamento por prostituição, ativa na metáfora de Oseias, seja indicada em nota sem explicitação excessiva no texto.
- source_word: מְאַהֲבַי
  choice: os meus amantes
  rationale: Tradução direta e corrente que preserva a imagem de infidelidade e não define de modo indevido os referentes metafóricos.
- source_word: וְשַׂמְתִּים לְיַעַר
  choice: Eu as transformarei em mata
  rationale: Comunica naturalmente que o cultivo se tornará vegetação silvestre. “Mata” é mais idiomático neste contexto do que dizer que as plantas se tornarão literalmente uma floresta.
- source_word: וַאֲכָלָתַם חַיַּת הַשָּׂדֶה
  choice: e os animais selvagens as devorarão
  rationale: “Devorar” transmite a ação destrutiva de אכל com animais como sujeito; “animais selvagens” expressa em português moderno a locução hebraica.
theological_decisions:
- issue: Explicitação da conotação sexual de אֶתְנָה
  choice: Usar “pagamento” no texto e registrar em nota a possível tradução “pagamento de prostituta”.
  alternative: Traduzir diretamente “pagamento de prostituta” no texto principal.
  rationale: O contexto sustenta essa conotação, mas o substantivo não traz aqui uma expansão explícita. A solução conserva a metáfora e sua tensão sem impor a interpretação no corpo do versículo.
- issue: Identidade dos “amantes”
  choice: Manter “os meus amantes” sem identificá-los.
  alternative: Explicá-los como falsos deuses ou aliados estrangeiros.
  rationale: O termo participa da metáfora de infidelidade, mas o versículo não resolve sozinho todos os seus referentes. A tradução preserva essa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das frases segue de perto o hebraico, enquanto “transformarei em mata” evita uma formulação excessivamente literal e pouco natural.
