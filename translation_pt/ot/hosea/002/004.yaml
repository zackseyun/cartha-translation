  text: רִ֤יבוּ בְ/אִמְּ/כֶם֙ רִ֔יבוּ כִּֽי הִיא֙ לֹ֣א אִשְׁתִּ֔/י וְ/אָנֹכִ֖י לֹ֣א אִישָׁ֑/הּ וְ/תָסֵ֤ר זְנוּנֶ֨י/הָ֙ מִ/פָּנֶ֔י/ה וְ/נַאֲפוּפֶ֖י/הָ מִ/בֵּ֥ין שָׁדֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/004.yaml
  text: Contend with your mother[a], contend, for she is not my wife, and I am not her husband[b]; let her remove her prostitutions from her face and her adulteries from between her breasts.
translation:
  language: pt
  text: Contendam com sua mãe[a], contendam, pois ela não é minha mulher, e eu não sou seu marido. Que ela afaste de seu rosto suas prostituições e de entre seus seios seus adultérios[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Apresentem uma acusação contra sua mãe”. O verbo hebraico pode ter sentido jurídico.'
    reason: lexical_alternative
  - marker: b
    text: Em Oseias, “prostituições” e “adultérios” podem designar tanto conduta sexual quanto, metaforicamente, infidelidade à aliança por meio da idolatria.
    reason: cultural_note
lexical_decisions:
- source_word: רִיבוּ בְאִמְּכֶם רִיבוּ
  choice: Acusem sua mãe, acusem-na
  rationale: O imperativo plural de ריב tem aqui força de disputa e acusação, possivelmente jurídica. “Acusem” comunica essa força em português corrente; a repetição preserva a urgência do hebraico.
- source_word: כִּי הִיא לֹא אִשְׁתִּי וְאָנֹכִי לֹא אִישָׁהּ
  choice: pois ela não é minha mulher, e eu não sou seu marido
  rationale: אשה e איש são termos conjugais comuns neste contexto. “Mulher” e “marido” formam uma declaração matrimonial natural em português e mantêm a metáfora profética.
- source_word: וְתָסֵר
  choice: Que ela afaste
  rationale: A forma verbal expressa exortação ou desejo após a declaração sobre o vínculo matrimonial. “Que ela afaste” reproduz essa nuance sem transformá-la numa afirmação futura.
- source_word: זְנוּנֶיהָ מִפָּנֶיהָ
  choice: do rosto as suas prostituições
  rationale: “Prostituições” conserva a linguagem sexual forte e o plural do hebraico; “do rosto” mantém a imagem corporal concreta, sem explicar de modo especulativo como essas prostituições estariam ali representadas.
- source_word: וְנַאֲפוּפֶיהָ מִבֵּין שָׁדֶיהָ
  choice: do meio dos seios, os seus adultérios
  rationale: “Adultérios” preserva o plural e a ligação com נאף. “Do meio dos seios” traduz diretamente a imagem explícita e concreta do texto.
theological_decisions:
- issue: Metáfora matrimonial da ruptura da aliança
  choice: Manter literalmente a linguagem de mulher e marido.
  alternative: Explicitar no texto principal a infidelidade de Israel à aliança com Deus.
  rationale: O hebraico apresenta a acusação por meio da metáfora matrimonial. Explicá-la no corpo do versículo eliminaria parte da tensão e acrescentaria interpretação à formulação profética.
- issue: Linguagem de infidelidade sexual
  choice: Usar “prostituições” e “adultérios”.
  alternative: Suavizar como “infidelidades” ou “imoralidade”.
  rationale: Os termos hebraicos são deliberadamente fortes e podem evocar tanto conduta sexual quanto, no contexto de Oseias, infidelidade à aliança e idolatria. A tradução preserva essa sobreposição sem reduzi-la a apenas um referente.
- issue: Estado da relação matrimonial
  choice: 'Traduzir a negação de modo direto: “ela não é minha mulher, e eu não sou seu marido”.'
  alternative: Parafrasear como divórcio formal ou como mera ameaça de separação.
  rationale: A declaração hebraica é contundente, mas o versículo não especifica sozinho todas as implicações jurídicas ou a condição final da relação; a tradução não as resolve.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A linguagem sexual explícita e as imagens corporais do hebraico foram preservadas, sem arcaísmos nem explicações denominacionais.
