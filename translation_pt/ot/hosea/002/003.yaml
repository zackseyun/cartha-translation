  yaml_path: translation/ot/hosea/002/003.yaml
  text: Say to your brothers[a], “My people,” and to your sisters[b], “Shown mercy.”
translation:
  language: pt
  text: 'Digam aos seus irmãos[a]: “Meu povo”; e às suas irmãs[b]: “Alcançada pela misericórdia”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: Ammi, nome simbólico que significa “Meu povo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: Ruhamá, nome simbólico que significa “Alcançada pela misericórdia” ou “que recebeu compaixão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרוּ
  choice: Digam
  rationale: Imperativo masculino plural de אמר. “Digam” reproduz de modo natural e direto a força do imperativo dirigido a mais de uma pessoa.
- source_word: לַאֲחֵיכֶם
  choice: a seus irmãos
  rationale: O substantivo masculino plural e o sufixo de segunda pessoa plural são mantidos literalmente; o paralelo feminino aparece na oração seguinte.
- source_word: עַמִּי
  choice: Meu povo
  rationale: Traduz o sentido do nome simbólico Ammi e torna explícita a reversão profética em relação a “Não Meu Povo”, sem ocultar seu valor nominal.
- source_word: וְלַאֲחוֹתֵיכֶם
  choice: e a suas irmãs
  rationale: Preserva o feminino plural explícito no hebraico e o paralelismo com “irmãos”.
- source_word: רֻחָמָה
  choice: Compadecida
  rationale: Forma passiva feminina ligada a רחם. “Compadecida” é concisa, concorda com “irmãs” e preserva tanto a ideia de ter recebido compaixão como o caráter de nome simbólico.
theological_decisions:
- issue: Traduzir semanticamente ou transliterar os nomes proféticos עַמִּי e רֻחָמָה
  choice: Traduzir no texto como “Meu povo” e “Compadecida”, registrando Ammi e Ruhamá nas notas
  alternative: Usar “Ammi” e “Ruhamá” diretamente no texto principal
  rationale: O significado dos nomes constitui parte essencial da mensagem de restauração. A tradução semântica comunica essa reversão ao leitor, enquanto as notas preservam a forma nominal hebraica e sua ligação com os nomes dos filhos de Oseias.
- issue: Nuance de רֻחָמָה
  choice: Compadecida
  alternative: Alcançada pela misericórdia; tratada com compaixão
  rationale: A forma hebraica admite a ideia de alguém que recebeu compaixão ou misericórdia. “Compadecida” mantém a passividade e a concisão do nome, sem especificar além do texto.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. A construção paralela e o gênero explícito de “irmãos/irmãs” foram preservados. O ponto e vírgula ajuda a apresentar as duas ordens paralelas sem tornar o versículo artificial.
