review_pass:
  verdict: revise
  source_fidelity: 'O hebraico diz literalmente: “Digam a seus irmãos: ‘Meu povo’; e a suas irmãs: ‘Recebeu misericórdia/foi objeto de compaixão’.” A tradução de עַמִּי como “Meu povo” preserva adequadamente tanto o sentido quanto a função de nome simbólico. Para רֻחָמָה, “Compadecida” é possível, mas em português tende a sugerir alguém que sente compaixão, e não com clareza alguém que a recebeu; por isso não representa com segurança o particípio passivo hebraico.'
  naturalness: A construção paralela com dois-pontos é clara e natural. “Digam aos seus irmãos” e “às suas irmãs” é ligeiramente mais fluente no português moderno do que “a seus” e elimina uma possível leitura menos imediata. “Alcançada pela misericórdia” expressa idiomaticamente o passivo, embora seja mais longo do que o nome hebraico.
  terminology: “Misericórdia” é um equivalente estabelecido e adequado para רחם neste contexto. A nota deve indicar que Ruhamá é um nome simbólico e que o termo significa alguém que recebeu misericórdia ou compaixão. “Ammi” deve conservar a forma hebraica convencional na nota.
  issues:
  - severity: medium
    issue: “Compadecida” é semanticamente ambígua em português.
    rationale: Embora possa significar “objeto de compaixão”, o uso moderno frequentemente a entende como “que tem compaixão”, deslocando a voz passiva de רֻחָמָה. Uma formulação passiva explícita preserva melhor o hebraico e a reversão do nome simbólico de Oseias.
  revised_text: 'Digam aos seus irmãos[a]: “Meu povo”; e às suas irmãs[b]: “Alcançada pela misericórdia”.'
