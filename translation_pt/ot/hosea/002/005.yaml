base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/005.yaml
  text: or else I will strip her naked and expose her as on the day she was born[a], and make her like the wilderness, and make her like a parched land[b], and let her die of thirst.
translation:
  language: pt
  text: Do contrário[a], eu a despirei, deixando-a nua, e a exporei como no dia em que nasceu; eu a tornarei como o deserto, eu a tornarei como uma terra ressequida e a farei morrer de sede[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que eu não a dispa, deixando-a nua, e não a exponha como no dia em que nasceu”. A partícula hebraica também pode introduzir a consequência ameaçada com o sentido de “para que não”.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “e cause a morte dela pela sede”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: senão
  rationale: Introduz de modo natural em português a consequência ameaçada, preservando a força de advertência do hebraico.
- source_word: אַפְשִׁיטֶנָּה עֲרֻמָּה
  choice: eu a despirei, deixando-a nua
  rationale: Mantém tanto a ação causativa de tirar a roupa quanto o estado resultante de nudez, sem suavizar a imagem de vergonha e juízo.
- source_word: וְהִצַּגְתִּיהָ
  choice: e a exporei
  rationale: Expressa a ideia de colocá-la à vista e se ajusta ao contexto de exposição pública, com maior naturalidade que uma reprodução mecânica de 'pôr'.
- source_word: כְּיוֹם הִוָּלְדָהּ
  choice: como no dia em que nasceu
  rationale: Conserva a comparação com o estado descoberto e indefeso do nascimento em linguagem portuguesa corrente.
- source_word: וְשַׂמְתִּיהָ כַמִּדְבָּר
  choice: farei dela como o deserto
  rationale: Preserva a metáfora de desolação e esterilidade de מִדְבָּר.
- source_word: וְשַׁתִּהָ כְּאֶרֶץ צִיָּה
  choice: farei dela como uma terra ressequida
  rationale: צִיָּה descreve terra extremamente seca; 'ressequida' oferece uma imagem vívida e compreensível.
- source_word: וַהֲמִתִּיהָ בַּצָּמָא
  choice: e a farei morrer de sede
  rationale: Reproduz de maneira natural a força causativa do hifil e a sede como meio ou causa da morte.
theological_decisions:
- issue: Imagem metafórica de juízo contra a mulher infiel/Israel
  choice: Manter as imagens concretas de nudez, exposição, deserto, terra ressequida e morte por sede.
  alternative: Substituí-las por uma paráfrase abstrata de humilhação, privação e castigo.
  rationale: A força teológica do texto está nas imagens severas de juízo da aliança; traduzi-las diretamente evita impor uma interpretação que dissolva a metáfora.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva a dureza e o paralelismo das imagens hebraicas sem arcaísmo desnecessário.
