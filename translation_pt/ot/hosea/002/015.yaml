  text: וּ/פָקַדְתִּ֣י עָלֶ֗י/הָ אֶת יְמֵ֤י הַ/בְּעָלִים֙ אֲשֶׁ֣ר תַּקְטִ֣יר לָ/הֶ֔ם וַ/תַּ֤עַד נִזְמָ/הּ֙ וְ/חֶלְיָתָ֔/הּ וַ/תֵּ֖לֶךְ אַחֲרֵ֣י מְאַהֲבֶ֑י/הָ וְ/אֹתִ֥/י שָׁכְחָ֖ה נְאֻם יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/015.yaml
  text: And I will punish her for the days of the Baals[a], when she burned incense to them and adorned herself with her ring and her jewelry, and went after her lovers, but forgot me, declares Yahweh.
translation:
  language: pt
  text: Eu a castigarei pelos dias dos baalins, em que ela lhes queimava incenso, se enfeitava com seu anel[a] e suas joias, ia atrás de seus amantes, mas se esquecia de mim — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “anel de nariz” ou “brinco”. O termo hebraico נֶזֶם designa um anel, muitas vezes usado no nariz ou na orelha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי עָלֶיהָ
  choice: Eu a castigarei
  rationale: פָקַד com עַל, em contexto de juízo, expressa a ideia de pedir contas e punir. “Castigarei” comunica com clareza a força judicial em português.
- source_word: יְמֵי הַבְּעָלִים
  choice: os dias dos baalins
  rationale: Mantém o plural hebraico, que pode apontar para diferentes manifestações ou imagens de Baal, e preserva a expressão aberta “dias de”, sem defini-la necessariamente como festas.
- source_word: אֲשֶׁר תַּקְטִיר לָהֶם
  choice: quando ela lhes queimava incenso
  rationale: O hifil de קטר denota produzir fumaça sacrificial e frequentemente se refere à queima de incenso. O imperfeito português comunica a prática habitual passada.
- source_word: וַתַּעַד
  choice: se enfeitava
  rationale: Expressa de modo natural o ato de adornar-se indicado pelo verbo no contexto.
- source_word: נִזְמָהּ
  choice: seu anel
  rationale: נֶזֶם pode designar um anel, inclusive de nariz ou de orelha. A forma genérica evita especificar o tipo no texto, enquanto a nota registra as possibilidades.
- source_word: וְחֶלְיָתָהּ
  choice: suas joias
  rationale: חֶלְיָה designa adorno ou joia; o plural idiomático em português comunica bem o sentido coletivo.
- source_word: מְאַהֲבֶיהָ
  choice: seus amantes
  rationale: Preserva a metáfora conjugal de Oseias e sua referência a parceiros ilícitos, representativos dos deuses e vínculos que Israel buscava.
- source_word: וְאֹתִי שָׁכְחָה
  choice: mas se esquecia de mim
  rationale: “Mas” explicita a força adversativa contextual entre buscar os amantes e esquecer Yahweh; o imperfeito retrata a conduta reiterada.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: “Declara” é uma formulação profética digna e corrente; “Yahweh” representa diretamente o nome divino יְהוָה.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” preserva sua função de nome pactual sem substituí-lo por um título.
- issue: Identidade dos “amantes”
  choice: Preservar a metáfora como “amantes”
  alternative: Explicitar no texto como deuses estrangeiros ou aliados políticos
  rationale: O versículo mantém deliberadamente a imagem de infidelidade conjugal. A tradução não restringe sua referência simbólica a apenas idolatria ou apenas alianças políticas.
translation_notes:
  register: Português moderno, natural e digno, com boa legibilidade brasileira. Os pretéritos imperfeitos apresentam as ações idólatras como práticas habituais. “Baalins” conserva o plural tradicional do nome Baal, e a nota foi posicionada junto a “anel”, termo ao qual se refere.
