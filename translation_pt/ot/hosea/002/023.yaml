revisions:
- from: E acontecerá, naquele dia — declara Yahweh —, que eu responderei; responderei aos céus, e eles responderão à terra.[a]
  to: 'E acontecerá naquele dia: eu responderei — declara Yahweh —, responderei aos céus, e eles responderão à terra.[a]'
  rationale: A revisão melhora a fluidez e torna mais clara a relação entre a fórmula profética e a dupla ocorrência de “responderei”, sem fundir nem explicar a cadeia poética do hebraico. A nota conserva a alternativa contextual de אֶרֶץ sem usar “país”, termo potencialmente anacrônico. Embora a mesma palavra portuguesa “terra” cubra ambas as possibilidades, a nota especifica o sentido regional alternativo.
