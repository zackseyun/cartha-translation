  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא אֶֽעֱנֶה֙ נְאֻם יְהוָ֔ה אֶעֱנֶ֖ה אֶת הַ/שָּׁמָ֑יִם וְ/הֵ֖ם יַעֲנ֥וּ אֶת הָ/אָֽרֶץ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/023.yaml
  text: And it shall happen in that day[a], declares Yahweh, that I will answer the heavens, and they shall answer the earth.
translation:
  language: pt
  text: 'E acontecerá naquele dia: eu responderei — declara Yahweh —, responderei aos céus, e eles responderão à terra.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a terra”. A palavra hebraica אֶרֶץ pode significar tanto “terra” como “terra” no sentido de uma região; aqui, “terra” preserva o par poético com “os céus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: E acontecerá
  rationale: Introduz uma cena futura. A formulação é natural em português atual e conserva o caráter profético da expressão.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Preserva a expressão temporal profética sem recorrer a linguagem arcaica.
- source_word: אֶעֱנֶה ... אֶעֱנֶה
  choice: eu responderei; responderei
  rationale: Mantém a repetição enfática do verbo hebraico e prepara a cadeia poética de respostas entre Yahweh, os céus e a terra.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Expressa com clareza e solenidade a fórmula profética, preservando o nome divino.
- source_word: הַשָּׁמַיִם
  choice: os céus
  rationale: Conserva a imagem elevada e a correspondência poética com a terra, sem reduzi-la simplesmente ao céu atmosférico.
- source_word: וְהֵם יַעֲנוּ
  choice: e eles responderão
  rationale: O pronome retoma os céus. A repetição de 'responder' conserva o paralelismo e a personificação do original.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Combina naturalmente com 'os céus' na cadeia cósmico-agrícola. O hebraico também pode designar uma terra ou região específica, possibilidade registrada em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Translitera o nome pessoal presente no texto, em vez de substituí-lo por um título.
- issue: Sentido da repetição de ענה
  choice: Conservar a linguagem de resposta
  alternative: Explicitar a imagem como envio de chuva ou produção de fertilidade
  rationale: O original constrói uma cadeia poética mediante a repetição do mesmo verbo. Explicar diretamente a chuva ou a fertilidade eliminaria parte da imagem e anteciparia o desenvolvimento do contexto.
- issue: Primeira ocorrência independente de אֶעֱנֶה
  choice: Preservar como 'eu responderei' antes de 'responderei aos céus'
  alternative: 'Fundir as duas ocorrências em uma única oração: ''responderei aos céus'''
  rationale: A repetição está expressa no texto hebraico e tem valor retórico; mantê-la representa mais plenamente a forma do original sem prejudicar a compreensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os travessões destacam a fórmula profética sem obscurecer a repetição deliberada de “responderei”. O marcador da nota foi colocado após “terra”, termo ao qual a alternativa lexical se refere.
