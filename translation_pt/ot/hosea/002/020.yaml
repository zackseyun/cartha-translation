base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/020.yaml
  text: And on that day I will make for them a covenant with the wild animals of the field[a], with the birds of the heavens, and with the creeping things of the ground; and I will break bow and sword and war from the land[c][b], and I will make them lie down in safety.
translation:
  language: pt
  text: Naquele dia, farei para eles uma aliança com os animais selvagens do campo, com as aves do céu e com os seres que rastejam sobre o solo. Eliminarei da terra o arco, a espada e a guerra[a] e farei com que eles se deitem em segurança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “quebrarei da terra o arco, a espada e a guerra”. O termo traduzido por “terra” também pode significar “país”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָרַתִּי ... בְּרִית
  choice: farei ... uma aliança
  rationale: A expressão hebraica significa literalmente “cortar uma aliança”, mas é a fórmula idiomática comum para estabelecer uma aliança. “Farei uma aliança” comunica naturalmente o sentido em português.
- source_word: לָהֶם
  choice: para eles
  rationale: Preserva a preposição ל e distingue os beneficiários humanos da aliança dos animais introduzidos por עִם, “com”.
- source_word: חַיַּת הַשָּׂדֶה
  choice: os animais selvagens
  rationale: Expressa de modo claro e atual os animais não domesticados; “do campo” pode ser omitido em português sem perder o valor semântico da expressão hebraica.
- source_word: עוֹף הַשָּׁמַיִם
  choice: as aves do céu
  rationale: Tradução natural e próxima do hebraico, cujo plural שָׁמַיִם designa aqui o céu visível.
- source_word: רֶמֶשׂ הָאֲדָמָה
  choice: os seres que rastejam sobre o solo
  rationale: Abrange as criaturas rastejantes e mantém אֲדָמָה como “solo”, distinguindo-o de אֶרֶץ mais adiante.
- source_word: וְקֶשֶׁת וְחֶרֶב וּמִלְחָמָה
  choice: o arco, a espada e a guerra
  rationale: Mantém a enumeração poética de armas específicas seguida pela guerra em sentido geral.
- source_word: אֶשְׁבּוֹר מִן הָאָרֶץ
  choice: Eliminarei da terra
  rationale: O verbo significa literalmente “quebrarei”, mas aplicado conjuntamente ao arco, à espada e à guerra, “eliminarei” produz português natural sem reduzir os três elementos a armas. “Terra” preserva a possível referência tanto ao território quanto, em alcance mais amplo, à terra.
- source_word: וְהִשְׁכַּבְתִּים לָבֶטַח
  choice: farei com que eles se deitem em segurança
  rationale: Conserva a força causativa do hifil e a imagem concreta de repouso seguro.
theological_decisions:
- issue: Relação entre os beneficiários e as partes mencionadas na aliança
  choice: Deus faz uma aliança “para eles” com o mundo animal.
  alternative: Deus faz uma aliança conjuntamente “com eles” e com os animais.
  rationale: O hebraico distingue לָהֶם, “para eles”, do עִם, “com”, repetido diante dos grupos animais. A tradução mantém essa distinção sem definir além do texto a natureza jurídica das partes.
- issue: Alcance de מִן הָאָרֶץ
  choice: da terra
  alternative: do país / da região
  rationale: אֶרֶץ permite tanto uma referência territorial quanto uma referência mais ampla à terra. “Terra” conserva essa ambiguidade legítima, enquanto “país” estreitaria o sentido.
- issue: Referente dos pronomes plurais
  choice: “para eles” e “eles” permanecem sem explicitação nominal.
  alternative: Explicitar “para o meu povo” e “o meu povo”.
  rationale: O referente é recuperado do contexto, mas não é nomeado neste versículo. Manter os pronomes evita acrescentar uma identificação ao texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem foi levemente ajustada para fluência, preservando a progressão entre reconciliação com os animais, fim da guerra e repouso seguro.
