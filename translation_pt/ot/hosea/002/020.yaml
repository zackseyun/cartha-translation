    rationale: חַיַּת הַשָּׂדֶה inclui explicitamente a qualificação «do campo». Embora «animais selvagens» comunique parte do sentido, a omissão reduz um elemento lexical presente no texto-fonte sem necessidade de fluência.
  - severity: low
    issue: A nota de rodapé apresenta «eliminarei do país» como alternativa, embora «eliminarei» já seja o verbo do texto principal e a variação relevante seja o alcance de «terra/país».
    rationale: Uma nota mais precisa deve indicar que «terra» também pode ser entendida como «país», sem chamar a formulação inteira de tradução literal quando o verbo principal foi contextualizado como «eliminarei».
