source:
  edition: WLC
  text: וְ/הִשְׁבַּתִּי֙ כָּל מְשׂוֹשָׂ֔/הּ חַגָּ֖/הּ חָדְשָׁ֣/הּ וְ/שַׁבַּתָּ֑/הּ וְ/כֹ֖ל מוֹעֲדָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/013.yaml
  text: And I will put an end to all her rejoicing—her feasts[a], her new moons, her Sabbaths[b], and all her appointed times.
translation:
  language: pt
  text: E porei fim a toda a sua alegria — às suas festas, às suas luas novas, aos seus sábados e a todos os seus tempos determinados[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todas as suas festas fixadas”. O termo hebraico também pode significar “tempos determinados”; neste contexto, refere-se a observâncias religiosas estabelecidas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  choice: E porei fim
  rationale: 'O hifil de שׁבת tem sentido causativo: Deus fará cessar as celebrações. “Porei fim” é natural e mantém a força do juízo anunciado.'
- source_word: כָּל מְשׂוֹשָׂהּ
  choice: a toda a sua alegria
  rationale: Preserva tanto o alcance abrangente de כָּל como o sentido de alegria ou júbilo de מָשׂוֹשׂ.
- source_word: חַגָּהּ
  choice: às suas festas
  rationale: חַג designa festas religiosas, frequentemente festas de peregrinação. O plural comunica em português o sentido coletivo e recorrente da referência.
- source_word: חָדְשָׁהּ
  choice: às suas luas novas
  rationale: No contexto do calendário religioso, חֹדֶשׁ se refere às celebrações da lua nova, e não apenas aos meses.
- source_word: וְשַׁבַּתָּהּ
  choice: aos seus sábados
  rationale: O termo designa os dias sabáticos como observâncias recorrentes; “sábados” é a forma corrente e inteligível em português.
- source_word: וְכֹל מוֹעֲדָהּ
  choice: e a todas as suas ocasiões marcadas
  rationale: מוֹעֵד pode indicar um tempo determinado ou uma celebração fixada. “Ocasiões marcadas” conserva essa amplitude sem repetir simplesmente “festas”.
theological_decisions:
- issue: Natureza das ocasiões enumeradas
  choice: A lista descreve principalmente celebrações e observâncias do calendário religioso que cessariam sob o juízo divino.
  alternative: A expressão inicial também pode abranger, de modo mais amplo, todas as ocasiões de alegria social.
  rationale: A sequência de festas, luas novas, sábados e מועדים é linguagem típica do calendário cultual, enquanto “toda a sua alegria” mantém o alcance mais amplo da declaração.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. A enumeração preserva o caráter litúrgico do original, e a nota mantém a ambiguidade legítima de מוֹעֵד.
