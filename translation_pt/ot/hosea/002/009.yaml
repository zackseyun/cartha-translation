source:
  edition: WLC
  text: וְ/רִדְּפָ֤ה אֶת מְאַהֲבֶ֨י/הָ֙ וְ/לֹֽא תַשִּׂ֣יג אֹתָ֔/ם וּ/בִקְשָׁ֖תַ/ם וְ/לֹ֣א תִמְצָ֑א וְ/אָמְרָ֗ה אֵלְכָ֤ה וְ/אָשׁ֨וּבָה֙ אֶל אִישִׁ֣/י הָֽ/רִאשׁ֔וֹן כִּ֣י ט֥וֹב לִ֛/י אָ֖ז מֵ/עָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/009.yaml
  text: She will pursue her lovers[a], but she will not overtake them; she will seek them, but she will not find them. Then she will say, ‘I will go and return to my first husband, for it was better for me then than now.’
translation:
  language: pt
  text: 'Ela perseguirá os seus amantes, mas não os alcançará; irá procurá-los, mas não os encontrará. Então dirá: “Irei e voltarei para o meu primeiro marido[a], pois eu estava melhor naquele tempo do que agora.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “marido anterior”. O hebraico diz literalmente “meu primeiro marido”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרִדְּפָה
  choice: Ela perseguirá
  rationale: O perfeito qal com conjunção, neste discurso profético, aponta naturalmente para uma ação futura. “Perseguirá” mantém a imagem de ir ativamente atrás de alguém.
- source_word: מְאַהֲבֶיהָ
  choice: os seus amantes
  rationale: No contexto da metáfora matrimonial de Oseias, o termo designa amantes ilícitos, não apenas pessoas que têm afeição por ela.
- source_word: תַשִּׂיג
  choice: não os alcançará
  rationale: O hifil de נשׂג, após “perseguirá”, indica alcançar quem vai adiante. A escolha conserva a imagem da perseguição sem exigir o menos formal “apanhar”.
- source_word: וּבִקְשָׁתַם
  choice: irá procurá-los
  rationale: בקש com o sufixo de objeto expressa uma busca intencional. “Procurar” é corrente em português e forma um paralelo natural com “encontrar”.
- source_word: תִמְצָא
  choice: não os encontrará
  rationale: מצא denota encontrar aquilo que se procura; a tradução direta preserva o paralelismo do hebraico.
- source_word: וְאָמְרָה
  choice: Então dirá
  rationale: A conjunção introduz a etapa seguinte, após o fracasso da busca. “Então” explicita essa progressão sem acrescentar uma relação causal indevida.
- source_word: אֵלְכָה וְאָשׁוּבָה
  choice: Irei e voltarei
  rationale: As formas de primeira pessoa expressam decisão. A tradução mantém os dois verbos do hebraico, em vez de reduzi-los simplesmente a “voltarei”.
- source_word: אֶל אִישִׁי הָרִאשׁוֹן
  choice: para o meu primeiro marido
  rationale: אישׁ, neste contexto matrimonial, significa “marido”, e הָרִאשׁוֹן significa literalmente “o primeiro”, embora também possa ser entendido como “anterior”.
- source_word: כִּי טוֹב לִי אָז מֵעָתָּה
  choice: pois eu estava melhor naquele tempo do que agora
  rationale: A formulação portuguesa comunica com naturalidade o contraste entre a condição passada e a presente, preservando os marcadores temporais אָז e מֵעָתָּה.
theological_decisions:
- issue: Metáfora matrimonial da infidelidade de Israel
  choice: Manter diretamente a linguagem de “amantes” e “marido”
  alternative: Substituí-la por termos interpretativos como “aliados”, “provedores” ou “deuses estrangeiros”
  rationale: O versículo integra a metáfora continuada de Oseias, na qual a relação de aliança é retratada como casamento. Embora os amantes possam representar divindades estrangeiras ou alianças políticas, o texto não identifica aqui uma única referência, por isso a imagem e sua tensão são preservadas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A colocação pronominal e o futuro simples preservam o tom profético; “Irei e voltarei” mantém deliberadamente a duplicação verbal do hebraico. O marcador da nota foi colocado junto a “primeiro marido”, expressão à qual a alternativa lexical se refere.
