  text: וְ/אֶת בָּנֶ֖י/הָ לֹ֣א אֲרַחֵ֑ם כִּֽי בְנֵ֥י זְנוּנִ֖ים הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/006.yaml
  text: And I will not show compassion to her children[a], for they are children of whoredom.
translation:
  language: pt
  text: E não terei compaixão dos filhos dela, pois são filhos de prostituição.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «filhos de devassidão» ou «filhos de promiscuidade». O hebraico preserva a imagem forte da infidelidade sexual, que simboliza a infidelidade à aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: E
  rationale: A conjunção introduz a cláusula seguinte; o marcador de objeto direto não requer tradução separada em português.
- source_word: בָּנֶיהָ
  choice: dos filhos dela
  rationale: בנים pode designar filhos ou descendentes de modo genérico. A construção com «dela» é clara e natural, além de manter explícita a referência à mãe.
- source_word: לֹא אֲרַחֵם
  choice: não terei compaixão
  rationale: O piel de רחם expressa ter ou demonstrar compaixão. A formulação é atual, digna e preserva a força afetiva e pactual do verbo.
- source_word: כִּי
  choice: pois
  rationale: A conjunção apresenta a razão da recusa de compaixão e «pois» se ajusta ao estilo profético.
- source_word: בְנֵי זְנוּנִים
  choice: filhos de prostituição
  rationale: A expressão mantém a imagem sexual dura de זְנוּנִים e sua função metafórica de infidelidade à aliança, sem reduzi-la a uma abstração.
- source_word: הֵמָּה
  choice: são
  rationale: A cópula em português comunica naturalmente a predicação enfática do pronome hebraico no contexto.
theological_decisions:
- issue: A acusação בְנֵי זְנוּנִים no contexto da metáfora matrimonial de Oseias
  choice: filhos de prostituição
  alternative: filhos de infidelidade
  rationale: A tradução preserva a imagem sexual deliberadamente severa que representa a infidelidade à aliança, mas não define além do texto se a filiação deve ser entendida literalmente.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. «Prostituição» conserva a aspereza profética sem recorrer ao termo hoje menos corrente «prostituição cultual» nem introduzir essa especificação no texto.
