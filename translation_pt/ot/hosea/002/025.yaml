base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/025.yaml
  text: And I will sow her for myself in the land[a], and I will have mercy on No Mercy, and I will say to Not My People, ‘You are my people,’ and he will say[c][b], ‘My God.’
translation:
  language: pt
  text: 'Eu a semearei para mim na terra[a]; terei compaixão de Não-Recebeu-Compaixão[b] e direi a Não-Meu-Povo: “Você é meu povo”; e ele dirá[c]: “Meu Deus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no país”. O hebraico אֶרֶץ pode designar a terra, um território ou um país; o contexto permite uma referência específica à terra restaurada sem excluir a amplitude da expressão.
    reason: lexical_alternative
  - marker: b
    text: Os nomes hebraicos são tradicionalmente transliterados Lo-Ruamá e Lo-Ami. Aqui são traduzidos como “Não-Recebeu-Compaixão” e “Não-Meu-Povo” para preservar o jogo de palavras que transforma juízo em restauração. “Não-Recebeu-Compaixão” reflete o sentido passivo do primeiro nome.
    reason: alternative_reading
  - marker: c
    text: O hebraico diz literalmente “e ele dirá”. O masculino singular provavelmente personifica o povo restaurado como um único respondente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְרַעְתִּיהָ
  choice: Eu a semearei
  rationale: Mantém a metáfora agrícola de זרע e sua ligação verbal com Jezreel, além de conservar o sufixo feminino singular.
- source_word: לִּי
  choice: para mim
  rationale: Expressa de modo direto o dativo de benefício ou posse, apresentando o povo como semeado para o próprio Deus.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: Terra é natural em português e preserva a amplitude de אֶרֶץ, que pode indicar tanto a terra territorial quanto a terra em sentido mais amplo.
- source_word: וְרִחַמְתִּי
  choice: terei compaixão
  rationale: Reflete o campo semântico de רחם e permite preservar o contraste verbal com o nome simbólico Não-Compadecida.
- source_word: לֹא רֻחָמָה
  choice: Não-Compadecida
  rationale: Traduz o nome simbólico em vez de apenas transliterá-lo, tornando perceptível a reversão entre a ausência anterior de compaixão e a restauração anunciada.
- source_word: לְלֹא עַמִּי
  choice: a Não-Meu-Povo
  rationale: Traduz o segundo nome simbólico e mantém transparente a reversão da sentença de rejeição na fórmula de aliança.
- source_word: עַמִּי אַתָּה
  choice: Você é meu povo
  rationale: Conserva a segunda pessoa masculina singular do hebraico com uma forma atual e amplamente compreensível em português.
- source_word: וְהוּא יֹאמַר
  choice: E ele dirá
  rationale: Mantém explicitamente o pronome e o verbo masculinos singulares, pelos quais o povo restaurado é personificado como um único respondente.
- source_word: אֱלֹהָי
  choice: Meu Deus
  rationale: Reproduz de forma concisa a confissão de aliança do hebraico, sem acrescentar verbo ausente no texto-fonte.
theological_decisions:
- issue: Tradução dos nomes proféticos de reversão da aliança
  choice: Não-Compadecida e Não-Meu-Povo no texto principal
  alternative: Lo-Ruamá e Lo-Ami
  rationale: O efeito teológico e retórico do versículo depende de o leitor perceber que os nomes de juízo são revertidos em compaixão e pertença. A nota preserva também as transliterações tradicionais.
- issue: Resposta singular masculina do povo restaurado
  choice: E ele dirá
  alternative: E eles dirão
  rationale: O hebraico emprega pronome e verbo no masculino singular. A tradução conserva essa personificação coletiva, sem convertê-la silenciosamente em plural.
- issue: Sentido territorial ou mais amplo de אֶרֶץ
  choice: na terra
  alternative: no país; na terra de Israel
  rationale: A formulação portuguesa permanece naturalmente aberta, como o hebraico, embora o contexto de restauração da aliança favoreça uma referência territorial.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Você” evita arcaísmo e mantém o singular do hebraico; os nomes compostos com hífen sinalizam que se trata de nomes proféticos. A ordem das notas segue sua primeira ocorrência no texto.
