  source_fidelity: 'A estrutura e as relações gramaticais do hebraico são em geral bem preservadas: Deus semeia «ela» para si, demonstra compaixão, reafirma a fórmula de pertença e recebe a resposta singular masculina. Contudo, «Não-Compadecida» em português tende a descrever alguém que não se compadeceu, e não alguém que não recebeu compaixão; portanto, não comunica com segurança o particípio passivo hebraico רֻחָמָה.'
  naturalness: O português é claro e de registro apropriado. A pontuação pode manter as cláusulas coordenadas do oráculo numa única frase. A ordem dos marcadores deve corresponder à ordem de primeira ocorrência, como informa a própria nota de tradução.
  terminology: «Compaixão» traduz adequadamente רחם. «Não-Recebeu-Compaixão» torna explícito, embora em forma deliberadamente nominalizada, o valor passivo do nome profético e preserva o contraste com «terei compaixão». «Não-Meu-Povo» e «Meu Deus» são adequados.
