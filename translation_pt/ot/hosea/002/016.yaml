id: HOS.2.16
reference: Hosea 2:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵ֗ן הִנֵּ֤ה אָֽנֹכִי֙ מְפַתֶּ֔י/הָ וְ/הֹֽלַכְתִּ֖י/הָ הַ/מִּדְבָּ֑ר וְ/דִבַּרְתִּ֖י עַל לִבָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/016.yaml
  text: Therefore[a], behold, I am going to allure her, and I will lead her into the wilderness and speak to her heart.
translation:
  language: pt
  text: Por isso, eis que vou atraí-la, conduzi-la ao deserto e falar ao seu coração.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “falar-lhe com ternura”. Literalmente: “falar ao seu coração”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Marca a transição consequencial e mantém o efeito surpreendente pelo qual o anúncio de juízo se volta para a restauração.
- source_word: הִנֵּה
  choice: eis que
  rationale: Conserva a função de chamar a atenção, em registro profético elevado, mas ainda compreensível.
- source_word: אָנֹכִי
  choice: '[sujeito expresso na forma verbal e no contexto]'
  rationale: O pronome hebraico dá ênfase ao agente divino. Em português, “eis que vou” mantém o destaque sem acrescentar o potencialmente excessivo “eu mesmo”.
- source_word: מְפַתֶּיהָ
  choice: vou atraí-la
  rationale: No contexto da metáfora conjugal de restauração, פתה indica atrair ou persuadir. “Atrair” preserva a dimensão afetiva e persuasiva sem a carga negativa de “seduzir” ou “enganar”; “vou” comunica bem a ação iminente sugerida pelo particípio.
- source_word: וְהֹלַכְתִּיהָ
  choice: conduzi-la
  rationale: A forma causativa de הלך significa fazê-la ir. “Conduzir” expressa orientação intencional e soa natural na sequência coordenada em português.
- source_word: הַמִּדְבָּר
  choice: ao deserto
  rationale: “Deserto” é a forma bíblica corrente e inteligível em português para מִדְבָּר, incluindo a região erma associada ao encontro formativo de Israel com Deus.
- source_word: וְדִבַּרְתִּי עַל לִבָּהּ
  choice: e falar ao seu coração
  rationale: Mantém a imagem hebraica quase literalmente. A expressão pode comunicar fala íntima, consoladora e persuasiva, sem reduzir o sentido a apenas “falar com ternura”.
theological_decisions:
- issue: Tom relacional da ação divina expressa por פתה na metáfora conjugal de restauração
  choice: atraí-la
  alternative: persuadi-la; seduzi-la; cortejá-la
  rationale: O contexto descreve a iniciativa divina de restabelecer a relação depois do juízo, não tentação moral nem coerção. “Atrair” conserva a tensão afetiva e persuasiva do verbo sem sexualizar excessivamente a imagem ou eliminar sua amplitude.
- issue: Sentido de עַל לִבָּהּ
  choice: falar ao seu coração
  alternative: falar-lhe com ternura
  rationale: A formulação preserva a metáfora e sua possível abrangência — consolo, persuasão e intimidade — em vez de resolver a expressão apenas como ternura.
translation_notes:
  register: Português moderno, digno e acessível, com leve elevação profética em “eis que”. A coordenação sem repetição do auxiliar evita rigidez. O marcador [a] foi colocado junto à expressão que a nota esclarece.
