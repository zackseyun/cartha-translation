source:
  edition: WLC
  text: וְֽ֠/הָיָה מִסְפַּ֤ר בְּנֵֽי יִשְׂרָאֵל֙ כְּ/ח֣וֹל הַ/יָּ֔ם אֲשֶׁ֥ר לֹֽא יִמַּ֖ד וְ/לֹ֣א יִסָּפֵ֑ר וְֽ֠/הָיָה בִּ/מְק֞וֹם אֲשֶׁר יֵאָמֵ֤ר לָ/הֶם֙ לֹֽא עַמִּ֣/י אַתֶּ֔ם יֵאָמֵ֥ר לָ/הֶ֖ם בְּנֵ֥י אֵֽל חָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/001.yaml
  text: Yet the number of the sons of Israel will be like the sand of the sea[a], which cannot be measured or counted; and in the place where it is said to them, “You are not my people,” it will be said to them, “Sons of the living God.”
translation:
  language: pt
  text: 'Contudo, o número dos filhos de Israel será como a areia do mar[a], que não pode ser medida nem contada. E, no lugar em que se lhes disser: “Vocês não são meu povo”, se lhes dirá: “Filhos do Deus vivo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “descendentes de Israel” e “descendentes do Deus vivo”. O hebraico usa literalmente “filhos” nas duas expressões.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Contudo, ... será
  rationale: O waw com qatal introduz aqui uma forte mudança do juízo anterior para a restauração. “Contudo” expressa naturalmente esse contraste e “será” preserva o sentido futuro.
- source_word: מִסְפַּר
  choice: o número
  rationale: Mantém o sentido direto do substantivo e sua relação com a impossibilidade de medir ou contar.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva o masculino plural do hebraico e o paralelismo com “Filhos do Deus vivo” no fim do versículo.
- source_word: כְּחוֹל הַיָּם
  choice: como a areia do mar
  rationale: É uma tradução natural e próxima da imagem hebraica tradicional de uma multidão incontável.
- source_word: אֲשֶׁר לֹא יִמַּד וְלֹא יִסָּפֵר
  choice: que não pode ser medida nem contada
  rationale: Os imperfeitos passivos exprimem, no contexto, impossibilidade prática; a formulação distingue os dois verbos com naturalidade em português.
- source_word: בִּמְקוֹם
  choice: no lugar
  rationale: Conserva a expressão locativa concreta do hebraico antes da oração relativa.
- source_word: יֵאָמֵר ... יֵאָמֵר
  choice: se dizia ... se dirá
  rationale: A construção impessoal com “se” preserva a ausência de um agente expresso. O primeiro imperfeito é vertido no pretérito imperfeito por referência à declaração anterior no contexto, enquanto o segundo aponta para a futura reversão.
- source_word: לֹא עַמִּי אַתֶּם
  choice: Vocês não são meu povo
  rationale: Reproduz em português corrente a fórmula pactual, sem transformar “povo” em “nação” nem tratar a expressão como nome próprio.
- source_word: בְּנֵי אֵל חָי
  choice: Filhos do Deus vivo
  rationale: “Filhos” preserva בני e o paralelo com “filhos de Israel”; “Deus vivo” é a tradução normal e reconhecível de אֵל חָי.
theological_decisions:
- issue: Linguagem filial marcada por gênero na fórmula de restauração
  choice: Manter “filhos” tanto em “filhos de Israel” como em “Filhos do Deus vivo”.
  alternative: Usar “descendentes de Israel” ou “filhos e filhas”, e “filhos do Deus vivo” em sentido inclusivo.
  rationale: O hebraico emprega בני nas duas expressões. Manter “filhos” preserva a forma da fonte e o paralelismo literário, sem negar que a promessa alcance o povo coletivamente.
- issue: Força discursiva do waw inicial
  choice: Traduzir com o adversativo “Contudo”.
  alternative: Traduzir simplesmente por “E” ou “Então”.
  rationale: O contexto passa do juízo associado a “Não Meu Povo” para uma promessa de multiplicação e reversão. “Contudo” comunica essa virada retórica sem resolver ou suavizar sua tensão teológica.
- issue: Temporalidade da primeira declaração passiva
  choice: “no lugar em que se dizia a eles”
  alternative: “no lugar em que se disser a eles” ou “onde lhes foi dito”
  rationale: O contexto literário remete à declaração de juízo já pronunciada, enquanto a segunda declaração anuncia sua reversão futura. O pretérito imperfeito é natural em português e mantém o agente indefinido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso brasileiro natural de “vocês”. A redação preserva a estrutura de promessa, o paralelismo entre as duas ocorrências de “filhos” e a voz impessoal das declarações.
