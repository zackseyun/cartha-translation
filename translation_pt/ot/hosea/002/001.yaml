  naturalness: O texto é claro, digno e adequado ao português moderno. «Onde se lhes disser ... se lhes dirá» é natural, mais conciso que «a eles» e preserva a construção impessoal.
  terminology: «Filhos de Israel», «meu povo» e «filhos do Deus vivo» são escolhas adequadas e mantêm o paralelismo do hebraico. A nota deve apresentar uma alternativa efetiva para ambas as ocorrências, em vez de repetir sem alteração «filhos do Deus vivo».
