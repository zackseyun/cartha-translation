  source_fidelity: 'O sentido central está correto: a fórmula temporal futura, a declaração de Yahweh, o contraste entre ‘meu marido’ (’îšî) e ba‘alî, bem como o jogo de palavras e a provável alusão a Baal, foram preservados. Contudo, o hebraico não emprega literalmente a construção portuguesa ‘chamar alguém de’; a formulação direta ‘me chamará “Meu marido”’ reflete mais de perto o paralelismo e evita uma pequena expansão sintática desnecessária.'
