  text: וְ/הָיָ֤ה בַ/יּוֹם הַ/הוּא֙ נְאֻם יְהוָ֔ה תִּקְרְאִ֖י אִישִׁ֑/י וְ/לֹֽא תִקְרְאִי לִ֥/י ע֖וֹד בַּעְלִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/018.yaml
  text: And in that day[a], declares Yahweh, you will call me ‘My husband,’ and you will no longer call me ‘My Baal.’
translation:
  language: pt
  text: Naquele dia — declara Yahweh — você me chamará “Meu marido” e não me chamará mais “Meu Baal”[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico ba‘li pode significar “meu senhor”, “meu dono” ou até “meu marido”. Aqui foi traduzido por “Meu Baal” para preservar o jogo de palavras e a provável alusão ao culto de Baal no contexto de Oseias.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: Naquele dia
  rationale: A expressão introduz uma circunstância futura. Em português, a fórmula temporal transmite naturalmente a força do hebraico sem exigir a tradução rígida de וְהָיָה por “acontecerá”.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Mantém o tom solene da fórmula profética e verte o tetragrama como o nome pessoal Yahweh, não como um título.
- source_word: תִּקְרְאִי
  choice: você me chamará de
  rationale: Neste contexto, קרא significa dirigir-se a alguém por uma designação. A construção com “chamar de” é clara e natural em português; o contexto preserva a figura de Israel como esposa, embora “você” não marque gênero.
- source_word: אִישִׁי
  choice: Meu marido
  rationale: Embora אִישׁ também possa significar “homem”, o contexto matrimonial indica “marido” e ressalta a restauração da relação de aliança.
- source_word: וְלֹא תִקְרְאִי לִי עוֹד
  choice: e não me chamará mais de
  rationale: “Não... mais” expressa de modo natural a interrupção futura e decisiva indicada por לֹא... עוֹד.
- source_word: בַּעְלִי
  choice: Meu Baal
  rationale: בעל pode significar “senhor”, “dono” ou “marido”, mas aqui há um provável jogo de palavras com Baal. “Meu Baal” conserva tanto o sufixo possessivo quanto a alusão à idolatria.
theological_decisions:
- issue: Traduzir בַּעְלִי por um sentido comum ou preservar a provável alusão ao culto de Baal
  choice: Meu Baal
  alternative: meu senhor; meu dono; meu marido
  rationale: A formulação preserva a tensão entre a intimidade da aliança matrimonial e uma designação comprometida pela associação com Baal, sem ocultar em nota a amplitude lexical do termo hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação por travessões destaca a fórmula profética sem tornar a frase pesada. O marcador da nota foi colocado junto de “Meu Baal”, expressão à qual a nota se refere.
