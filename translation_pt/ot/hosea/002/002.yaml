reference: Hosea 2:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ֠/נִקְבְּצוּ בְּנֵֽי יְהוּדָ֤ה וּ/בְנֵֽי יִשְׂרָאֵל֙ יַחְדָּ֔ו וְ/שָׂמ֥וּ לָ/הֶ֛ם רֹ֥אשׁ אֶחָ֖ד וְ/עָל֣וּ מִן הָ/אָ֑רֶץ כִּ֥י גָד֖וֹל י֥וֹם יִזְרְעֶֽאל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/002.yaml
  text: Then the sons of Judah and the sons of Israel will be gathered together[a], and they will appoint for themselves one head, and they will go up from the land[c][b], for great will be the day of Jezreel.
translation:
  language: pt
  text: Então os filhos de Judá e os filhos de Israel se reunirão, designarão para si uma só cabeça[a] e subirão da terra[b], pois grande será o dia de Jezreel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um só líder”. O hebraico diz literalmente “uma só cabeça”.
    reason: lexical_alternative
  - marker: b
    text: “Da terra” pode sugerir a saída do exílio ou uma subida ligada à restauração na terra; o hebraico não define com precisão a imagem.
    reason: alternative_reading
  - marker: c
    text: Jezreel é tanto um nome de lugar quanto um nome carregado de significado em Oseias, evocando os temas de espalhar e semear.
    reason: cultural_note
lexical_decisions:
- source_word: וְנִקְבְּצוּ
  choice: se reunirão
  rationale: O nifal de קבץ pode expressar tanto a ideia passiva de serem reunidos quanto a de ajuntarem-se. A forma pronominal é natural em português e conserva essa amplitude.
- source_word: בְּנֵי יְהוּדָה וּבְנֵי יִשְׂרָאֵל
  choice: os filhos de Judá e os filhos de Israel
  rationale: Mantém o idiomatismo hebraico e o paralelismo entre os dois grupos, sem ocultar a linguagem familiar do original.
- source_word: יַחְדָּו
  choice: '[expresso pela reunião conjunta dos dois grupos]'
  rationale: Em português, a coordenação dos dois grupos com o verbo pronominal plural já comunica que se reunirão juntos; acrescentar “juntos” seria possível, mas redundante.
- source_word: וְשָׂמוּ לָהֶם רֹאשׁ אֶחָד
  choice: designarão para si uma só cabeça
  rationale: “Designar” representa o sentido de שׂים neste contexto, enquanto “cabeça” preserva a metáfora de רֹאשׁ. “Uma só” ressalta a liderança unificada.
- source_word: וְעָלוּ מִן־הָאָרֶץ
  choice: subirão da terra
  rationale: Conserva a imagem espacial e a ambiguidade de אֶרֶץ, que pode designar terra, território ou país, sem determinar o ponto de partida ou destino.
- source_word: כִּי גָדוֹל יוֹם יִזְרְעֶאל
  choice: pois grande será o dia de Jezreel
  rationale: “Pois” introduz o fundamento da afirmação anterior; a ordem “grande será” preserva a ênfase profética do predicado antecipado.
- source_word: יִזְרְעֶאל
  choice: Jezreel
  rationale: O nome próprio é transliterado de modo tradicional e mantém, sem explicá-lo no corpo do texto, seu papel temático em Oseias.
theological_decisions:
- issue: Identidade da “uma só cabeça”
  choice: Preservar a metáfora sem identificar a figura.
  alternative: Traduzir como “um só líder”, “um só rei” ou explicitar uma figura messiânica.
  rationale: O hebraico afirma uma liderança unificada, mas não identifica essa pessoa no versículo. A tradução evita impor uma interpretação política ou messiânica específica.
- issue: Sentido de “subirão da terra”
  choice: Manter a expressão espacial aberta.
  alternative: Explicitar uma saída do exílio, um novo êxodo, uma marcha militar ou uma subida para a terra prometida.
  rationale: O texto permite mais de uma associação e não fornece aqui elementos suficientes para escolher exclusivamente uma delas.
- issue: Valor temático de Jezreel
  choice: Manter o nome próprio no texto e explicar sua ressonância em nota.
  alternative: Traduzir ou parafrasear o nome como “Deus semeia”.
  rationale: A transliteração preserva o referente geográfico e pessoal, enquanto a nota sinaliza o jogo temático sem substituir o nome.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva as metáforas centrais e a cadência profética, evitando resolver ambiguidades geográficas ou teológicas do hebraico.
