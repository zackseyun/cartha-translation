  text: וְ/הִיא֙ לֹ֣א יָֽדְעָ֔ה כִּ֤י אָֽנֹכִי֙ נָתַ֣תִּי לָ֔/הּ הַ/דָּגָ֖ן וְ/הַ/תִּיר֣וֹשׁ וְ/הַ/יִּצְהָ֑ר וְ/כֶ֨סֶף הִרְבֵּ֥יתִי לָ֛/הּ וְ/זָהָ֖ב עָשׂ֥וּ לַ/בָּֽעַל׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/010.yaml
  text: But she did not know that it was I who gave her the grain[a], the new wine, and the oil, and who multiplied silver for her and gold[b], which they made into Baal.
translation:
  language: pt
  text: Mas ela não sabia que era eu quem lhe dei o cereal, o vinho novo e o azeite, e quem lhe multipliquei a prata e o ouro, que eles usaram para Baal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que eles transformaram numa imagem de Baal”. O hebraico é conciso e pode se referir à fabricação de uma imagem de Baal com a prata e o ouro ou, de modo mais geral, ao uso desses bens no culto a Baal.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִיא
  choice: Mas ela
  rationale: A conjunção introduz contraste com o contexto anterior, e o pronome feminino explícito é preservado.
- source_word: לֹא יָדְעָה
  choice: não sabia
  rationale: Traduz diretamente o qal de ידע, deixando que o contexto comunique também a falta de reconhecimento.
- source_word: כִּי אָנֹכִי
  choice: que era eu
  rationale: Preserva a ênfase do pronome independente אָנֹכִי de modo natural em português.
- source_word: נָתַתִּי לָהּ
  choice: lhe dava
  rationale: O imperfeito em português expressa naturalmente a provisão continuada descrita no contexto, sem alterar a referência passada.
- source_word: הַדָּגָן
  choice: o cereal
  rationale: דגן designa genericamente a produção de grãos; 'cereal' evita a possível leitura brasileira de 'milho' para termos cognatos.
- source_word: הַתִּירוֹשׁ
  choice: o vinho novo
  rationale: תירוש se refere ao vinho como produto novo ou fresco da colheita, preservando a tríade agrícola profética.
- source_word: הַיִּצְהָר
  choice: o azeite
  rationale: יצהר denota sobretudo azeite de oliva como produto agrícola; 'azeite' é claro e natural em português.
- source_word: וְכֶסֶף הִרְבֵּיתִי לָהּ וְזָהָב
  choice: e quem lhe multiplicava a prata e o ouro
  rationale: Mantém o sentido causativo de רבה e entende 'ouro' como objeto coordenado do mesmo verbo elíptico.
- source_word: עָשׂוּ לַבָּעַל
  choice: que eles usaram para Baal
  rationale: A frase hebraica é concisa e ambígua; esta formulação ampla preserva a destinação idolátrica sem afirmar como certeza que os metais foram transformados numa imagem.
theological_decisions:
- issue: Sentido de לַבָּעַל no contexto de idolatria
  choice: para Baal
  alternative: numa imagem de Baal
  rationale: בעל é aqui o nome da divindade cananeia. A preposição ל pode indicar que os metais foram empregados no culto ou na produção de uma imagem; o texto principal mantém a formulação mais abrangente e a nota registra a leitura específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção 'era eu quem' conserva a ênfase do hebraico; 'azeite' explicita naturalmente o produto agrícola sem necessidade de nota lexical.
