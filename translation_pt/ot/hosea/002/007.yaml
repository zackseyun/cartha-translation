  text: כִּ֤י זָֽנְתָה֙ אִמָּ֔/ם הֹבִ֖ישָׁה הֽוֹרָתָ֑/ם כִּ֣י אָמְרָ֗ה אֵלְכָ֞ה אַחֲרֵ֤י מְאַהֲבַ/י֙ נֹתְנֵ֤י לַחְמִ/י֙ וּ/מֵימַ֔/י צַמְרִ֣/י וּ/פִשְׁתִּ֔/י שַׁמְנִ֖/י וְ/שִׁקּוּיָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/007.yaml
  text: For their mother has prostituted herself[a]; she who conceived them has acted shamefully. For she said, ‘I will go after my lovers, those who give me my bread and my water, my wool and my flax[d][c][b], my oil and my drink.’
translation:
  language: pt
  text: 'Pois a mãe deles se prostituiu[a]; aquela que os concebeu agiu vergonhosamente[b], pois disse: “Irei atrás dos meus amantes, que me dão o meu pão e a minha água, a minha lã e o meu linho, o meu azeite e as minhas bebidas[c]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cometeu prostituição”. O hebraico emprega uma imagem sexual explícita para a infidelidade à aliança.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “causou vergonha”; o verbo hebraico pode descrever tanto um comportamento vergonhoso quanto o ato de envergonhar outros.'
    reason: lexical_ambiguity
  - marker: c
    text: 'Ou: “tudo o que tenho para beber”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָנְתָה
  choice: se prostituiu
  rationale: Preserva a força sexual explícita do verbo e a metáfora profética da infidelidade da aliança, sem a suavizar para uma formulação genérica.
- source_word: אִמָּם
  choice: a mãe deles
  rationale: Reproduz diretamente o substantivo com sufixo de terceira pessoa masculina plural e mantém a figura corporativa da mãe.
- source_word: הֹבִישָׁה
  choice: agiu vergonhosamente
  rationale: O hifil de בוש pode indicar causar vergonha ou comportar-se vergonhosamente; aqui, o paralelismo e os verbos femininos singulares favorecem uma descrição da conduta da mãe.
- source_word: הוֹרָתָם
  choice: aquela que os concebeu
  rationale: Conserva a referência verbal à concepção e o paralelismo poético com “a mãe deles”, sem achatar ambas as expressões em “mãe”.
- source_word: אֵלְכָה אַחֲרֵי
  choice: Irei atrás de
  rationale: Expressão portuguesa natural que mantém tanto o movimento figurado quanto a busca deliberada dos amantes.
- source_word: מְאַהֲבַי
  choice: meus amantes
  rationale: No contexto da metáfora matrimonial, designa parceiros ilícitos; “amantes” mantém essa conotação com clareza.
- source_word: נֹתְנֵי
  choice: que me dão
  rationale: Explicita naturalmente em português a função substantivada do particípio, apresentando os amantes como supostos provedores.
- source_word: לַחְמִי וּמֵימַי
  choice: o meu pão e a minha água
  rationale: Mantém as imagens concretas das provisões básicas em vez de generalizar “pão” como “alimento”.
- source_word: צַמְרִי וּפִשְׁתִּי
  choice: a minha lã e o meu linho
  rationale: “Lã” e “linho” são equivalentes naturais em português para os materiais têxteis mencionados; “linho” pode designar a planta ou sua fibra.
- source_word: שַׁמְנִי
  choice: o meu azeite
  rationale: No contexto agrícola do antigo Israel, שֶׁמֶן normalmente se refere ao azeite; esta é também a designação portuguesa mais natural para a provisão enumerada.
- source_word: שִׁקּוּיָי
  choice: as minhas bebidas
  rationale: Mantém a forma plural hebraica e comunica os líquidos fornecidos para beber, sem especificar um tipo não indicado no texto.
theological_decisions:
- issue: Metáfora matrimonial e infidelidade à aliança
  choice: Manter explicitamente a imagem sexual em “se prostituiu” e “meus amantes”.
  alternative: Atenuar para “foi infiel” e “aqueles que me amam”.
  rationale: Oseias emprega deliberadamente linguagem matrimonial e sexual para retratar a ruptura da aliança e a busca de outros provedores. Preservar a metáfora comunica a força teológica do texto sem inserir uma explicação denominacional.
- issue: Identidade dos supostos provedores
  choice: Deixar “meus amantes” sem identificá-los no corpo do versículo.
  alternative: Explicitar que representam os baalins, ídolos ou nações aliadas.
  rationale: O contexto de Oseias orienta a interpretação, mas este versículo mantém a referência dentro da metáfora. A tradução não deve resolver no texto aquilo que o hebraico deixa figurado.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição dos possessivos conserva a cadência enfática da lista hebraica. A metáfora sexual foi mantida sem eufemismo, e as ambiguidades relevantes foram registradas em notas.
