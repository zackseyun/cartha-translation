  text: וְ/עַתָּ֛ה אֲגַלֶּ֥ה אֶת נַבְלֻתָ֖/הּ לְ/עֵינֵ֣י מְאַהֲבֶ֑י/הָ וְ/אִ֖ישׁ לֹֽא יַצִּילֶ֥/נָּה מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/012.yaml
  text: And now I will uncover her nakedness before the eyes of her lovers, and no man will rescue her from my hand.
translation:
  language: pt
  text: E agora exporei a nudez dela diante dos olhos de seus amantes, e ninguém a livrará da minha mão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲגַלֶּה אֶת־נַבְלֻתָהּ
  choice: exporei a nudez dela
  rationale: 'Mantém a imagem concreta e vergonhosa do hebraico: o verbo significa descobrir, revelar ou expor, e o substantivo designa nudez.'
- source_word: מְאַהֲבֶיהָ
  choice: seus amantes
  rationale: Preserva a metáfora conjugal de Oseias e o sentido de parceiros amorosos, aqui ligado aos aliados ou ídolos buscados por Israel.
- source_word: וְאִישׁ לֹא יַצִּילֶנָּה
  choice: e ninguém a livrará
  rationale: 'Embora אִישׁ possa significar literalmente “homem”, nesta construção negativa tem força generalizante: nenhuma pessoa poderá livrá-la.'
- source_word: מִיָּדִי
  choice: da minha mão
  rationale: Conserva o idioma hebraico que expressa poder, domínio e ação executora.
theological_decisions:
- issue: Identidade figurada da mulher e de seus amantes
  choice: Preservar a personificação feminina e a metáfora dos amantes sem explicá-las no corpo do versículo.
  alternative: Explicitar Israel e seus aliados ou deuses.
  rationale: O hebraico mantém a linguagem metafórica, cuja interpretação emerge do contexto; explicitá-la eliminaria deliberadamente sua amplitude poética e teológica.
- issue: Agente do juízo e impossibilidade de resgate
  choice: Manter a primeira pessoa divina e a expressão “da minha mão”.
  alternative: Parafrasear como castigo inevitável de Deus.
  rationale: A formulação concreta do original ressalta diretamente o domínio do locutor divino sem acrescentar uma interpretação abstrata.
translation_notes:
  register: Português moderno, claro e digno, com a força imagética do hebraico preservada. “Exporei” comunica revelação pública e humilhação; “ninguém” é natural em português e reproduz a função generalizante de אִישׁ na oração negativa.
