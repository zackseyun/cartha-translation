source:
  edition: WLC
  text: וְ/הָ/אָ֣רֶץ תַּעֲנֶ֔ה אֶת הַ/דָּגָ֖ן וְ/אֶת הַ/תִּיר֣וֹשׁ וְ/אֶת הַ/יִּצְהָ֑ר וְ/הֵ֖ם יַעֲנ֥וּ אֶֽת יִזְרְעֶֽאל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/024.yaml
  text: and the earth will answer the grain[a], the new wine, and the oil, and they will answer Jezreel.
translation:
  language: pt
  text: e a terra responderá ao cereal, ao vinho novo e ao azeite; e eles responderão a Jezreel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome Jezreel significa “Deus semeia” e, em Oseias, tem função simbólica, além de designar uma pessoa e um lugar.
    reason: Explicar o significado e o jogo de palavras associado ao nome יִזְרְעֶאל.
lexical_decisions:
- source_word: וְהָאָרֶץ
  choice: e a terra
  rationale: אֶרֶץ pode significar “terra” tanto em sentido amplo quanto territorial. Aqui, a sequência poética dos céus para a terra e desta para os produtos agrícolas favorece “terra”.
- source_word: תַּעֲנֶה / יַעֲנוּ
  choice: responderá / responderão
  rationale: A repetição de ענה forma uma cadeia personificada de respostas. Manter “responder” preserva essa estrutura literária sem convertê-la em mera provisão agrícola.
- source_word: הַדָּגָן
  choice: o cereal
  rationale: דָּגָן designa genericamente cereais ou grãos. “Cereal” é natural em português e evita a possível leitura de grãos individuais.
- source_word: הַתִּירוֹשׁ
  choice: o vinho novo
  rationale: תִּירוֹשׁ se refere ao vinho novo, produto da colheita, e esta expressão conserva a nuance agrícola.
- source_word: הַיִּצְהָר
  choice: o azeite
  rationale: יִצְהָר designa o óleo agrícola, normalmente de oliva. “Azeite” é a equivalência portuguesa natural e suficientemente precisa; “azeite fresco” acrescentaria uma nuance incerta.
- source_word: וְהֵם
  choice: e eles
  rationale: O pronome retoma coletivamente os três produtos agrícolas e mantém sua personificação. O masculino plural concorda com “cereal”, “vinho” e “azeite” em português.
- source_word: יִזְרְעֶאל
  choice: Jezreel
  rationale: O nome próprio é transliterado, enquanto seu sentido simbólico, ligado a “Deus semeia”, é explicado em nota.
theological_decisions:
- issue: Preservar a imagem personificada e repetida de “responder” ou explicá-la como provisão
  choice: Preservar “responder” nas duas ocorrências
  alternative: a terra produzirá cereal, vinho novo e azeite, e eles sustentarão Jezreel
  rationale: O contexto constrói deliberadamente uma cadeia de resposta entre Deus, os céus, a terra, seus produtos e Jezreel. A formulação literal conserva a imagem teológica da restauração da ordem criada.
- issue: Traduzir ou transliterar o nome simbólico יִזְרְעֶאל
  choice: Manter “Jezreel” no texto e explicar o jogo de palavras em nota
  alternative: Deus semeia
  rationale: A transliteração preserva o nome próprio e sua função narrativa em Oseias, sem eliminar sua dimensão simbólica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a repetição do hebraico foram preservadas por sua importância poética. O ponto e vírgula torna mais clara a passagem da resposta da terra à resposta dos produtos.
