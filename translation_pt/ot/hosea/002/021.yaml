  text: וְ/אֵרַשְׂתִּ֥י/ךְ לִ֖/י לְ/עוֹלָ֑ם וְ/אֵרַשְׂתִּ֥י/ךְ לִ/י֙ בְּ/צֶ֣דֶק וּ/בְ/מִשְׁפָּ֔ט וּ/בְ/חֶ֖סֶד וּֽ/בְ/רַחֲמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/021.yaml
  text: And I will betroth you to myself forever; yes[a], I will betroth you to myself in righteousness and in justice, and in steadfast love and in compassion.
translation:
  language: pt
  text: Eu me comprometerei com você em casamento para sempre; eu me comprometerei com você em casamento com justiça e direito, com amor leal[a] e compaixão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «amor constante». O hebraico חֶסֶד inclui as ideias de amor, lealdade e misericórdia no âmbito de uma relação de compromisso.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵרַשְׂתִּיךְ
  choice: farei de você minha noiva
  rationale: O verbo ארשׂ designa especificamente o noivado ou compromisso matrimonial. Esta formulação conserva a imagem nupcial de modo natural e compreensível em português, sem antecipar a consumação do casamento.
- source_word: לִי
  choice: minha
  rationale: O hebraico diz literalmente «para mim». Integrado à expressão «minha noiva», o possessivo comunica de forma idiomática a relação pessoal e pactual.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Expressa com naturalidade a permanência duradoura indicada por לעולם.
- source_word: בְּצֶדֶק
  choice: com justiça
  rationale: צדק denota aquilo que é justo ou reto. «Com justiça» é natural em português e mantém a qualidade moral e relacional do compromisso.
- source_word: וּבְמִשְׁפָּט
  choice: e retidão
  rationale: משפט pode indicar juízo, direito ou justiça. Neste paralelismo de qualidades pactuais, «retidão» evita a repetição pouco informativa de «justiça e justiça» e ressalta a ordem justa, sem sugerir uma sentença judicial.
- source_word: וּבְחֶסֶד
  choice: com amor leal
  rationale: חֶסֶד reúne amor, misericórdia e fidelidade relacional. «Amor leal» preserva sua dimensão de compromisso sem inserir no texto a palavra explicativa «aliança».
- source_word: וּבְרַחֲמִים
  choice: e compaixão
  rationale: Embora a forma hebraica seja plural, רחמים funciona aqui como substantivo abstrato; «compaixão» é corrente e comunica misericórdia afetuosa.
theological_decisions:
- issue: Imagem matrimonial da restauração
  choice: 'Manter a linguagem específica de noivado: «farei de você minha noiva».'
  alternative: «Eu me casarei com você» ou «farei você pertencer a mim».
  rationale: A metáfora profética é central ao versículo. A tradução retém o compromisso matrimonial expresso por ארשׂ sem reduzi-lo a uma relação genérica nem transformá-lo prematuramente no casamento consumado.
- issue: Sentido pactual de חֶסֶד
  choice: «amor leal» no texto principal.
  alternative: «amor constante», «misericórdia» ou «amor de aliança».
  rationale: «Amor leal» conserva tanto o afeto quanto a fidelidade relacional de חֶסֶד. A nota registra a amplitude sem tornar explícita uma palavra, «aliança», que não aparece lexicalmente no versículo.
- issue: Relação entre צֶדֶק e מִשְׁפָּט
  choice: «justiça e retidão».
  alternative: «retidão e justiça» ou «justiça e juízo».
  rationale: Os termos se sobrepõem, mas não são idênticos. A formulação mantém dois aspectos correlatos da ordem justa e evita interpretar מִשְׁפָּט como condenação judicial neste contexto restaurador.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A repetição «farei de você minha noiva» reproduz a ênfase do hebraico; «sim» articula naturalmente a repetição, embora não corresponda a uma partícula independente no texto-fonte.
