  text: וַ/הֲסִרֹתִ֛י אֶת שְׁמ֥וֹת הַ/בְּעָלִ֖ים מִ/פִּ֑י/הָ וְ/לֹֽא יִזָּכְר֥וּ ע֖וֹד בִּ/שְׁמָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/019.yaml
  text: And I will remove the names of the Baals from her mouth[a], and they will no longer be remembered by name.
translation:
  language: pt
  text: E retirarei da boca dela os nomes dos baalins[a], e eles nunca mais serão lembrados pelo nome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e nunca mais serão mencionados pelo nome”. O verbo hebraico pode significar tanto ser lembrado como ser mencionado; neste contexto, ambos os sentidos apontam para o fim do culto a Baal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲסִרֹתִי
  choice: E retirarei
  rationale: O hifil de סור tem aqui sentido causativo, “fazer desaparecer, retirar”. “Retirarei” é claro e combina naturalmente com “os nomes”.
- source_word: שְׁמוֹת הַבְּעָלִים
  choice: os nomes dos baalins
  rationale: שְׁמוֹת é o plural construto de “nome”, e הַבְּעָלִים designa aqui as divindades cananeias ligadas à idolatria de Israel. “Baalins”, plural tradicional e inteligível em português, preserva a referência cultual.
- source_word: מִפִּיהָ
  choice: da boca dela
  rationale: A tradução direta conserva a imagem hebraica da boca como lugar da fala e da invocação, sem explicitar além do texto.
- source_word: וְלֹא יִזָּכְרוּ עוֹד
  choice: e eles nunca mais serão lembrados
  rationale: O nifal de זכר pode significar “ser lembrado” ou “ser mencionado”. O texto principal mantém o sentido lexical mais direto, enquanto a nota registra a alternativa contextual.
- source_word: בִּשְׁמָם
  choice: pelo nome
  rationale: Embora o hebraico tenha literalmente “pelo nome deles”, o singular שֵׁם com sufixo plural funciona idiomaticamente. “Pelo nome” preserva a ideia sem produzir uma construção pouco natural em português.
theological_decisions:
- issue: Referente de הַבְּעָלִים
  choice: As divindades pagãs chamadas Baal, no plural (“os baalins”)
  alternative: “Os senhores” ou “os ídolos de Baal”
  rationale: No contexto da polêmica de Oseias contra a infidelidade cultual de Israel, o termo se refere às manifestações ou divindades de Baal, não simplesmente a senhores humanos. A tradução evita tanto diluir a referência quanto acrescentar “ídolos”, palavra não expressa no texto.
- issue: Sentido de זכר no nifal
  choice: “ser lembrados” no texto principal
  alternative: “ser mencionados”
  rationale: O verbo admite os dois sentidos, e o contexto da eliminação dos nomes da boca favorece especialmente a ideia de menção. A tradução preserva a ambiguidade por meio de nota, sem reduzir o enunciado apenas à fala ou apenas à memória.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. Mantém-se a imagem concreta “da boca dela” e usa-se “baalins” para a forma plural cultual. O marcador [a] aparece no texto imediatamente após a expressão pertinente.
