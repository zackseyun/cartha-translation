base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/008.yaml
  text: Therefore[a], behold, I am hedging up your way with thorns[c][b], and I will wall in her wall so that she will not find her paths.
translation:
  language: pt
  text: Por isso, eis que vou obstruir o teu caminho com espinhos[a] e cercá-la com um muro[b], de modo que ela não encontrará as suas veredas.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com sarças” ou “com arbustos espinhosos”.
    reason: lexical_alternative
  - marker: b
    text: Hebraico conciso; literalmente, algo como “murarei o muro dela”. Também pode ser entendido como “levantarei uma barreira ao redor dela”.
    reason: lexical_alternative
  - marker: c
    text: O hebraico passa da segunda pessoa, “teu caminho”, para a terceira pessoa, “ela” e “suas veredas”. A tradução preserva essa mudança retórica.
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Marca a consequência da acusação anterior e expressa naturalmente o valor inferencial do hebraico.
- source_word: הִנְנִי
  choice: eis que vou
  rationale: Conserva a força enfática e apresentativa da expressão hebraica e, com o infinitivo, comunica a ação divina iminente.
- source_word: שָׂךְ
  choice: obstruir
  rationale: O verbo descreve fechar ou impedir a passagem. “Obstruir” é natural em português e mantém o foco no bloqueio do caminho, enquanto “com espinhos” preserva a imagem concreta.
- source_word: דַּרְכֵּךְ
  choice: o teu caminho
  rationale: Mantém o singular e a segunda pessoa feminina do hebraico. “Caminho” conserva tanto o sentido espacial quanto o figurado.
- source_word: בַּסִּירִים
  choice: com espinhos
  rationale: Designa vegetação espinhosa empregada como obstáculo; “espinhos” é claro, vívido e não especifica além do que o termo permite.
- source_word: וְגָדַרְתִּי אֶת־גְּדֵרָהּ
  choice: e cercá-la com um muro
  rationale: A construção cognata é concisa e idiomática no hebraico. A formulação portuguesa comunica a criação de uma barreira ao redor dela sem reproduzir literalmente a expressão pouco natural “murar o muro dela”.
- source_word: וּנְתִיבוֹתֶיהָ
  choice: as suas veredas
  rationale: Mantém o plural e a imagem de rotas ou trilhas. O pronome de terceira pessoa acompanha a mudança retórica do hebraico, esclarecida no texto por “ela”.
- source_word: לֹא תִמְצָא
  choice: de modo que ela não encontrará
  rationale: Expressa o resultado do bloqueio em português natural, sem decidir rigidamente entre propósito e consequência.
theological_decisions:
- issue: Mudança de pessoa gramatical
  choice: Preservar a passagem da segunda pessoa (“teu caminho”) para a terceira pessoa (“ela”, “suas veredas”).
  alternative: Uniformizar toda a frase na segunda pessoa ou toda na terceira pessoa.
  rationale: A alternância está no texto hebraico e faz parte da retórica profética; uniformizá-la eliminaria uma tensão genuína do texto.
- issue: Finalidade ou resultado da barreira
  choice: Usar “de modo que”, formulação compatível sobretudo com resultado, sem excluir intenção.
  alternative: Traduzir explicitamente como “para que”, fixando a leitura de finalidade, ou apenas coordenar com “e”.
  rationale: A relação entre as orações admite nuance resultativa ou intencional; a tradução evita impor uma distinção mais rígida do que o hebraico.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com “teu” para tornar inequívoca a segunda pessoa do original. “Veredas” conserva a imagem poética sem soar arcaico demais; “obstruir” evita a impressão espacial inadequada de cercar apenas as laterais do caminho.
