  text: גַּם אוֹת/וֹ֙ לְ/אַשּׁ֣וּר יוּבָ֔ל מִנְחָ֖ה לְ/מֶ֣לֶךְ יָרֵ֑ב בָּשְׁנָה֙ אֶפְרַ֣יִם יִקָּ֔ח וְ/יֵב֥וֹשׁ יִשְׂרָאֵ֖ל מֵ/עֲצָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/006.yaml
  text: Even it will be carried to Assyria as tribute for King Yareb[a]; Ephraim will receive shame[b], and Israel will be ashamed of its counsel.
translation:
  language: pt
  text: Até ele será levado para a Assíria como tributo ao rei Jarebe[a]. Efraim receberá desonra, e Israel se envergonhará por causa do seu plano[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “rei Jarebe”. A expressão também pode ser entendida como um título, como “o rei vingador” ou “o rei contendente”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “por causa do seu conselho”. O hebraico pode referir-se ao plano ou à política do próprio Israel; o referente do pronome não é inteiramente explícito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Até
  rationale: 'A partícula anteposta é enfática: não apenas o povo, mas até o bezerro mencionado no contexto será levado. “Até” expressa essa força com naturalidade em português.'
- source_word: אוֹתוֹ
  choice: ele
  rationale: O pronome retoma o bezerro/ídolo do contexto anterior. O masculino concorda naturalmente com “bezerro” em português.
- source_word: לְאַשּׁוּר יוּבָל
  choice: será levado para a Assíria
  rationale: O hofal de יבל preserva a voz passiva, e a preposição indica destino. “Levado” é apropriado ao transporte do ídolo.
- source_word: מִנְחָה
  choice: como tributo
  rationale: No contexto político da relação com a Assíria, designa uma dádiva entregue a um soberano, isto é, tributo, e não uma oferta cultual.
- source_word: לְמֶלֶךְ יָרֵב
  choice: ao rei Jarebe
  rationale: Mantém יָרֵב como designação régia transliterada, sem decidir no texto principal se é nome próprio ou epíteto.
- source_word: בָּשְׁנָה יִקָּח
  choice: Efraim receberá desonra
  rationale: Reproduz o sentido idiomático de “tomar/receber vergonha”. “Desonra” funciona como aquilo que Efraim recebe e evita uma formulação excessivamente literal.
- source_word: וְיֵבוֹשׁ
  choice: se envergonhará
  rationale: Preserva o sentido direto do qal de בוש sem especificar indevidamente um agente que imponha a vergonha.
- source_word: מֵעֲצָתוֹ
  choice: por causa do seu plano
  rationale: A preposição מן pode indicar causa, e עֵצָה pode significar conselho, projeto ou plano. “Seu” conserva no texto a referência pronominal sem a tornar mais explícita do que o hebraico.
theological_decisions:
- issue: Identidade e sentido de יָרֵב
  choice: rei Jarebe
  alternative: rei vingador ou rei contendendor
  rationale: A forma hebraica admite leitura como designação semelhante a nome próprio ou como epíteto descritivo. A transliteração no texto principal evita impor uma interpretação incerta, e a nota registra as alternativas.
- issue: Referente do sufixo em מֵעֲצָתוֹ
  choice: seu plano
  alternative: o conselho ou a política do próprio Israel; possivelmente um plano associado ao ídolo
  rationale: O sufixo masculino singular não identifica de modo inequívoco seu referente. A formulação conserva a ambiguidade e evita transformar uma política humana específica em interpretação obrigatória.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A ordem e o paralelismo do hebraico são mantidos sem rigidez; “rei Jarebe” e “seu plano” preservam ambiguidades reais do texto-fonte.
