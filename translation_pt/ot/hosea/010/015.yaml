base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/015.yaml
  text: Thus Bethel has done to you because of your great evil[b][a]. At dawn the king of Israel will be utterly cut off.
translation:
  language: pt
  text: Foi assim que Betel agiu contra vocês, por causa da grande maldade de vocês.[a] Ao amanhecer, o rei de Israel será completamente eliminado.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico repete “maldade” — literalmente, “a maldade da maldade de vocês” — para dar ênfase; daí “a grande maldade de vocês”.
    reason: lexical_alternative
  - marker: b
    text: Ou “será certamente destruído” ou “será completamente silenciado”. O hebraico emprega um infinitivo absoluto junto com o verbo finito para dar ênfase.
    reason: alternative_reading
lexical_decisions:
- source_word: כָּכָה
  choice: Foi isso que
  rationale: Expressa de modo natural o advérbio demonstrativo que retoma o juízo descrito no contexto, preservando a ideia de “assim” ou “deste modo”.
- source_word: עָשָׂה לָכֶם
  choice: fez a vocês
  rationale: Mantém o verbo no perfeito e o sentido de ação dirigida contra os destinatários, sem acrescentar uma explicação ausente no hebraico.
- source_word: בֵּית אֵל
  choice: Betel
  rationale: Trata-se do nome do lugar; a transliteração preserva a referência histórica e sua possível função metonímica no contexto.
- source_word: מִפְּנֵי
  choice: por causa de
  rationale: A preposição introduz a causa do juízo.
- source_word: רָעַת רָעַתְכֶם
  choice: sua grande maldade
  rationale: A repetição hebraica intensifica o substantivo. “Grande maldade” comunica essa ênfase em português corrente sem reproduzir literalmente a construção pouco natural “a maldade da maldade de vocês”.
- source_word: בַּשַּׁחַר
  choice: Ao amanhecer
  rationale: Indica o momento do acontecimento e conserva a imagem vívida do romper do dia.
- source_word: נִדְמֹה נִדְמָה
  choice: será completamente eliminado
  rationale: A combinação do infinitivo absoluto com o verbo finito intensifica a certeza e a totalidade da ação. “Eliminado” preserva o sentido contextual de remoção ou destruição, enquanto a nota registra a amplitude lexical.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: o rei de Israel
  rationale: Tradução direta da cadeia construta, com artigo definido exigido pela fluência do português.
theological_decisions:
- issue: Referente de “Betel”
  choice: Manter Betel como nome do lugar, que pode representar metonimicamente o centro de culto e o regime idólatra associado a ele.
  alternative: Entender Betel especificamente como referência ao ídolo do bezerro.
  rationale: O texto hebraico nomeia diretamente o lugar. A tradução não restringe a referência a uma interpretação mais específica do que o original exige.
- issue: Força da repetição רָעַת רָעַתְכֶם
  choice: 'Entender a repetição como intensificação: “sua grande maldade”.'
  alternative: Traduzir de modo mais literal como “a maldade da maldade de vocês” ou mais forte como “sua extrema perversidade”.
  rationale: A escolha transmite a gravidade enfática do hebraico em linguagem clara, sem impor uma distinção entre dois males.
- issue: Sentido de נִדְמֹה נִדְמָה
  choice: 'Predição enfática da remoção ou destruição total do rei: “será completamente eliminado”.'
  alternative: “Será certamente destruído” ou “será completamente silenciado”.
  rationale: A raiz admite nuances de destruição, eliminação ou silêncio, e a construção intensiva reforça a certeza. A tradução principal se ajusta ao contexto da queda do rei, enquanto a nota conserva a ambiguidade lexical legítima.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente compreensível. A formulação evita arcaísmos e conserva a concisão e a força do anúncio profético.
