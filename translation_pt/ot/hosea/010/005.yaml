base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/005.yaml
  text: The inhabitants of Samaria tremble for the calves of Beth-aven, because its people mourn over it, and its idolatrous priests wail over it, over its glory, because it has departed from it.
translation:
  language: pt
  text: Os habitantes de Samaria tremem pelas bezerras de Bete-Áven[a], pois o seu povo lamenta por ele, e os seus sacerdotes idólatras se alegram por ele, por sua glória, pois ela se foi dele[c].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bete-Áven significa “casa da maldade” ou “casa da idolatria” e é um nome pejorativo usado por Oseias para se referir a Betel, centro do culto ao bezerro.
    reason: Explica o jogo polêmico do topônimo hebraico.
  - marker: b
    text: O hebraico diz literalmente “se alegram” ou “exultam”, expressão surpreendente neste contexto de temor e lamento. Alguns propõem que o verbo aqui descreva agitação ou lamento.
    reason: Preserva o sentido lexical usual do texto massorético e informa a dificuldade contextual sem harmonizá-la.
  - marker: c
    text: O verbo hebraico pode indicar partir ou ir para o exílio. Embora “bezerras” esteja no plural no início do versículo, os pronomes e as referências seguintes aparecem no singular; seus antecedentes são incertos e podem tratar o objeto de culto coletivamente como um só.
    reason: Registra a nuance possível de exílio e preserva a oscilação de número e a ambiguidade referencial do hebraico.
lexical_decisions:
- source_word: עֶגְלוֹת
  choice: bezerras
  rationale: O texto massorético traz o plural feminino de עֶגְלָה, literalmente “bezerras”. Mantém-se o número e o gênero da forma hebraica, embora as referências posteriores estejam no singular.
- source_word: בֵּית אָוֶן
  choice: Bete-Áven
  rationale: Transliteração corrente do nome hebraico; uma nota explica seu valor pejorativo no contexto de Oseias.
- source_word: יָג֖וּרוּ
  choice: tremem
  rationale: Expressa o temor intenso indicado pelo verbo גור neste contexto.
- source_word: כְמָרָיו
  choice: sacerdotes idólatras
  rationale: כמרים designa sacerdotes de culto idolátrico, e não o sacerdócio israelita legítimo.
- source_word: יָגִילוּ
  choice: exultam
  rationale: Representa o sentido normal do verbo גיל, apesar da tensão com o pranto e a perda mencionados no contexto.
- source_word: גָלָה מִמֶּנּוּ
  choice: foi levada para longe dele
  rationale: Comunica a ideia de partida ou remoção, possivelmente para o exílio, sem forçar no corpo do texto uma personificação excessivamente literal.
theological_decisions:
- issue: Sentido paradoxal de יָגִילוּ em um contexto de lamento
  choice: exultam
  alternative: lamentam / se contorcem de dor
  rationale: O sentido lexical normal do texto consonantal é “exultam”. A tradução preserva essa tensão em vez de harmonizá-la silenciosamente com o contexto; a nota registra a dificuldade.
- issue: Identidade das referências pronominais singulares após עֶגְלוֹת
  choice: explicitar “o seu ídolo” e entender “glória” como a realidade removida
  alternative: reproduzir pronomes ambíguos sem explicitação
  rationale: O hebraico passa do plural “bezerras” a sufixos singulares. A formulação portuguesa torna a frase inteligível, mas a nota conserva a irregularidade e a possível referência coletiva ao ídolo.
translation_notes:
  register: Português moderno, claro e digno, com formas acessíveis no Brasil e compreensíveis internacionalmente. “Bete-Áven” segue transliteração bíblica portuguesa; “pranteia” conserva solenidade sem ser obscuro. A explicitação “dessa cidade” e “seu ídolo” reduz a confusão dos pronomes, enquanto as notas preservam as ambiguidades formais do hebraico.
