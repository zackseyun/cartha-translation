id: HOS.10.8
reference: Hosea 10:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/נִשְׁמְד֞וּ בָּמ֣וֹת אָ֗וֶן חַטַּאת֙ יִשְׂרָאֵ֔ל ק֣וֹץ וְ/דַרְדַּ֔ר יַעֲלֶ֖ה עַל מִזְבְּחוֹתָ֑/ם וְ/אָמְר֤וּ לֶֽ/הָרִים֙ כַּסּ֔וּ/נוּ וְ/לַ/גְּבָע֖וֹת נִפְל֥וּ עָלֵֽי/נוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/008.yaml
  text: The high places of Aven[a], the sin of Israel, will be destroyed. Thorn and thistle will grow up on their altars, and they will say to the mountains, “Cover us!” and to the hills, “Fall on us!”
translation:
  language: pt
  text: 'Os lugares altos de Áven[a], o pecado de Israel, serão destruídos. Espinhos e abrolhos crescerão sobre os seus altares. Então dirão aos montes: “Cubram-nos!”, e às colinas: “Caiam sobre nós!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os lugares altos da maldade”. O hebraico Áven pode funcionar como nome de lugar e também significar “maldade” ou “iniquidade”; provavelmente há aqui um jogo de palavras intencional.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּמוֹת
  choice: lugares altos
  rationale: Expressão tradicional e inteligível para os locais elevados de culto no contexto bíblico, preservando o sentido cultual.
- source_word: אָוֶן
  choice: Áven
  rationale: Mantém no texto principal a provável referência geográfica e preserva em nota o possível jogo de palavras com o sentido de maldade ou iniquidade.
- source_word: חַטַּאת יִשְׂרָאֵל
  choice: o pecado de Israel
  rationale: A expressão funciona como aposto, identificando os lugares altos como o pecado de Israel; o sentido de oferta pelo pecado não se ajusta ao contexto.
- source_word: נִשְׁמְדוּ
  choice: serão destruídos
  rationale: Reproduz com clareza a ideia do nifal de שׁמד, isto é, serem eliminados ou destruídos no juízo anunciado.
- source_word: קוֹץ וְדַרְדַּר
  choice: espinhos e abrolhos
  rationale: Mantém o par vegetal associado à desolação e à maldição, em formulação bíblica conhecida e compreensível em português.
- source_word: יַעֲלֶה עַל מִזְבְּחוֹתָם
  choice: crescerão sobre os seus altares
  rationale: No contexto de vegetação, עלה indica brotar ou crescer; a forma plural em português concorda naturalmente com o par coletivo anterior.
- source_word: כַּסּוּנוּ
  choice: Cubram-nos
  rationale: Traduz diretamente o imperativo e conserva a imagem vívida do desejo de ser encoberto diante do juízo.
- source_word: נִפְלוּ עָלֵינוּ
  choice: Caiam sobre nós
  rationale: Preserva o imperativo direto e a súplica desesperada para que as colinas os soterrem ou escondam.
theological_decisions:
- issue: Se אָוֶן deve ser entendido como nome de lugar ou como substantivo comum
  choice: Áven no texto principal
  alternative: “maldade” ou “iniquidade”, formando “os lugares altos da maldade”
  rationale: A sintaxe admite tanto uma referência toponímica quanto uma designação depreciativa. O nome no texto e a alternativa em nota preservam a provável referência ao local e o jogo de palavras característico de Oseias.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Lugares altos” conserva a terminologia cultual bíblica; “abrolhos” preserva o par tradicional com “espinhos” sem obscurecer o sentido geral. A pontuação divide com naturalidade a descrição da desolação e o clamor subsequente.
