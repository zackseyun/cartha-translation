base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/001.yaml
  text: Israel is a luxuriant vine that yields fruit for himself[a]. The more his fruit increased, the more he multiplied altars; the better his land became[c][b], the better they made the sacred pillars.
translation:
  language: pt
  text: Israel é uma videira viçosa, que produz fruto para si mesma.[a] Quanto mais aumentava o seu fruto, mais Israel multiplicava os altares; quanto mais prosperava a sua terra, mais adornavam as pedras erguidas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Israel é uma videira que se esvazia” ou “uma videira que se espalha”. O termo hebraico é difícil; o texto principal segue o sentido sugerido pelo contexto de fruto abundante e terra próspera. A expressão “para si mesma” também pode ser entendida simplesmente como “produz seu fruto”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pedras de culto”. Eram monumentos de pedra erguidos para fins religiosos; neste contexto, estão ligados a um culto condenado.'
    reason: cultural_note
lexical_decisions:
- source_word: גֶּפֶן בּוֹקֵק
  choice: videira viçosa
  rationale: O adjetivo é difícil e pode estar ligado à ideia de esvaziar-se ou espalhar-se. No contexto de fruto abundante e terra próspera, “viçosa” comunica uma videira vigorosa e produtiva, preservando a ironia do uso idólatra da prosperidade.
- source_word: פְּרִי יְשַׁוֶּה לּוֹ
  choice: que produz fruto para si mesma
  rationale: “Produz fruto” expressa naturalmente o sentido contextual do verbo difícil שוה, enquanto “para si mesma” mantém a possível força reflexiva ou de interesse próprio de לּוֹ e concorda com a metáfora feminina de “videira” em português.
- source_word: כְּרֹב לְפִרְיוֹ
  choice: Quanto mais aumentava o seu fruto
  rationale: A formulação proporcional “quanto mais... mais...” reproduz com clareza a relação entre a crescente produtividade e a multiplicação dos altares.
- source_word: הִרְבָּה לַמִּזְבְּחוֹת
  choice: mais Israel multiplicava os altares
  rationale: O hifil de רבה indica fazer aumentar ou tornar numerosos. A repetição explícita de “Israel” evita oscilação confusa de gênero entre a videira e o povo.
- source_word: כְּטוֹב לְאַרְצוֹ
  choice: quanto mais prosperava a sua terra
  rationale: Aqui “boa” descreve a condição produtiva ou próspera da terra, não sua qualidade moral. “Prosperava” é natural e mantém o paralelismo proporcional.
- source_word: הֵיטִיבוּ מַצֵּבוֹת
  choice: mais adornavam as colunas sagradas
  rationale: O hifil de יטב pode significar tornar boas, belas ou aprimoradas. “Adornavam” comunica o investimento no aperfeiçoamento desses objetos cultuais sem sugerir aprovação.
theological_decisions:
- issue: A prosperidade de Israel e sua relação com a idolatria
  choice: O versículo apresenta Israel como frutífero e próspero, mas usando essa prosperidade para ampliar o culto condenado.
  alternative: A abertura pode ser entendida negativamente como “uma videira que se esvazia” ou espacialmente como “uma videira que se espalha”.
  rationale: As referências ao aumento do fruto, à prosperidade da terra, à multiplicação dos altares e ao aprimoramento das colunas favorecem uma leitura ironicamente positiva da produtividade, seguida de sua aplicação à idolatria.
- issue: Valor de לּוֹ na produção do fruto
  choice: Preservar a nuance reflexiva com “para si mesma”.
  alternative: Traduzir apenas “produz seu fruto”, tratando לּוֹ de modo idiomático e sem destacar interesse próprio.
  rationale: A expressão hebraica permite uma nuance reflexiva ou de benefício próprio. Mantê-la no texto conserva a ambiguidade e reforça, sem a resolver dogmaticamente, a crítica ao uso autocentrado da prosperidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Videira viçosa” preserva a imagem poética; a estrutura “quanto mais... mais...” torna claro o paralelismo hebraico. A alternância entre “videira” e “Israel” evita pronomes de gênero potencialmente confusos. Os marcadores [a] e [b] aparecem no texto principal.
