  text: וְ/קָ֣אם שָׁאוֹן֮ בְּ/עַמֶּ/ךָ֒ וְ/כָל מִבְצָרֶ֣י/ךָ יוּשַּׁ֔ד כְּ/שֹׁ֧ד שַֽׁלְמַ֛ן בֵּ֥ית אַֽרְבֵ֖אל בְּ/י֣וֹם מִלְחָמָ֑ה אֵ֥ם עַל בָּנִ֖ים רֻטָּֽשָׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/014.yaml
  text: The tumult will arise among your people[a], and all your fortresses will be devastated, as Shalman devastated Beth-arbel on the day of battle[b]; mothers were dashed to pieces with their children.
translation:
  language: pt
  text: Haverá tumulto entre o seu povo, e todas as suas fortalezas serão devastadas, como Salmã[a] devastou Bete-Arbel no dia da batalha; mães foram despedaçadas junto com seus filhos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Salmã talvez se refira a Salmaneser, mas sua identificação histórica exata é incerta.
    reason: alternative_reading
  - marker: b
    text: 'Mais literalmente: “uma mãe foi despedaçada sobre os filhos”. A expressão hebraica é concisa e gráfica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָאם
  choice: se levantará
  rationale: O perfeito qal com conjunção, no discurso profético, anuncia um acontecimento futuro; a expressão preserva a imagem de algo que irrompe.
- source_word: שָׁאוֹן
  choice: estrondo
  rationale: O substantivo indica forte ruído e comoção, especialmente em contexto de guerra e destruição; “estrondo” é corrente e mantém a dimensão sonora.
- source_word: בְּעַמֶּךָ
  choice: entre o seu povo
  rationale: Traduz idiomaticamente a esfera em que a comoção surgirá.
- source_word: מִבְצָרֶיךָ
  choice: suas fortalezas
  rationale: Designa lugares fortificados de defesa; “fortalezas” é claro e conciso.
- source_word: יוּשַּׁד
  choice: serão devastadas
  rationale: A forma passiva de שׁדד comunica saque violento e ruína; “devastadas” abrange ambos.
- source_word: כְּשֹׁד
  choice: como ... devastou
  rationale: A formulação verbal expressa com naturalidade a comparação histórica.
- source_word: שַׁלְמַן
  choice: Salmã
  rationale: Translitera a forma hebraica sem identificar de modo incerto o personagem com algum rei chamado Salmaneser.
- source_word: בֵּית אַרְבֵאל
  choice: Bete-Arbel
  rationale: Transliteração do topônimo em forma familiar e legível em português bíblico moderno.
- source_word: בְּיוֹם מִלְחָמָה
  choice: no dia da batalha
  rationale: Expressa diretamente a referência a um confronto militar específico.
- source_word: אֵם
  choice: mães
  rationale: Embora singular na forma, pode ter força genérica ou coletiva na descrição da atrocidade; o plural comunica isso naturalmente.
- source_word: עַל בָּנִים
  choice: junto com seus filhos
  rationale: Mantém a associação violenta entre mães e filhos sem definir além do texto a mecânica exata do ato.
- source_word: רֻטָּשָׁה
  choice: foram despedaçadas
  rationale: A forma passiva descreve brutal esmagamento em guerra; a escolha transmite a gravidade do verbo.
theological_decisions:
- issue: Identificação de שַׁלְמַן
  choice: Manter o nome Salmã sem identificação histórica específica.
  alternative: Identificá-lo como Salmaneser III, Salmaneser V ou outro governante desconhecido.
  rationale: O hebraico apresenta Salmã, mas não permite estabelecer com segurança sua identidade histórica.
- issue: Sentido da cláusula final
  choice: “mães foram despedaçadas junto com seus filhos”
  alternative: “uma mãe foi despedaçada sobre os filhos”
  rationale: A versão principal comunica a provável força genérica e coletiva, mas a nota conserva a construção hebraica concisa e graficamente ambígua.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Estrondo” preserva o aspecto sonoro de שָׁאוֹן; a pontuação mantém direta a cláusula final sem acrescentar um conector temporal ausente no hebraico.
