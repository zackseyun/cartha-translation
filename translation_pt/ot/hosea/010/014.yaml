revisions:
- from: Um estrondo se levantará entre o seu povo, e todas as suas fortalezas serão devastadas, como Salmã devastou Bete-Arbel no dia da batalha; mães foram despedaçadas junto com seus filhos.[a][b]
  to: Haverá tumulto entre o seu povo, e todas as suas fortalezas serão devastadas, como Salmã[a] devastou Bete-Arbel no dia da batalha; mães foram despedaçadas junto com seus filhos.[b]
  rationale: A revisão substitui uma expressão pouco idiomática por «Haverá tumulto», mais adequada ao contexto bélico, e reposiciona a âncora da nota histórica imediatamente após «Salmã». A cláusula final e sua nota preservam a força coletiva adotada no texto principal e a ambiguidade concisa do hebraico na nota.
