source:
  edition: WLC
  text: דִּבְּר֣וּ דְבָרִ֔ים אָל֥וֹת שָׁ֖וְא כָּרֹ֣ת בְּרִ֑ית וּ/פָרַ֤ח כָּ/רֹאשׁ֙ מִשְׁפָּ֔ט עַ֖ל תַּלְמֵ֥י שָׂדָֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/004.yaml
  text: They speak mere words[a], swearing false oaths, making covenants[d][c][b]; so judgment springs up like poison weed on the furrows of the field.
translation:
  language: pt
  text: Proferem palavras, fazem juramentos falsos e firmam alianças[a]; por isso, o juízo brota como erva venenosa[b] nos sulcos do campo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “cortar uma aliança”.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico indica uma planta venenosa ou amarga cuja identificação exata é incerta; também tem sido traduzido por “cicuta” ou “fel”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “a justiça brota como erva venenosa”, se a expressão for entendida com amarga ironia.'
    reason: alternative_reading
lexical_decisions:
- source_word: דִּבְּרוּ דְבָרִים
  choice: Falam palavras vazias
  rationale: A construção cognata enfatiza um falar sem substância no contexto de juramentos falsos. O presente exprime bem a conduta característica denunciada pelo profeta.
- source_word: אָלוֹת שָׁוְא
  choice: juram falsamente
  rationale: אָלָה pode indicar juramento com implicação de maldição, e שָׁוְא comunica falsidade ou vacuidade. A formulação portuguesa é clara e mantém a acusação de perjúrio.
- source_word: כָּרֹת בְּרִית
  choice: fazem alianças
  rationale: Equivalente natural do idioma hebraico literalmente expresso como 'cortar uma aliança'; o plural traduz adequadamente o valor não definido e reiterado da expressão.
- source_word: וּפָרַח
  choice: brota
  rationale: Preserva a imagem vegetal de germinar ou florescer sem a conotação positiva que 'floresce' poderia sugerir.
- source_word: כָּרֹאשׁ
  choice: como erva venenosa
  rationale: רֹאשׁ designa aqui uma planta amarga ou venenosa de identificação incerta. A tradução transmite a toxicidade sem impor uma espécie botânica.
- source_word: מִשְׁפָּט
  choice: o juízo
  rationale: No contexto, o resultado judicial ou social das práticas falsas aparece como crescimento nocivo. 'Juízo' preserva o termo jurídico e permite a possível ironia.
- source_word: עַל תַּלְמֵי שָׂדָי
  choice: nos sulcos do campo
  rationale: תֶּלֶם é o sulco ou a leira produzida pelo arado. 'Nos sulcos do campo' é natural em português e conserva a imagem agrícola.
theological_decisions:
- issue: Sentido de מִשְׁפָּט na denúncia profética
  choice: o juízo brota
  alternative: a justiça brota
  rationale: O substantivo pode significar 'juízo' ou 'justiça'. A imagem da planta venenosa favorece um resultado judicial nocivo, mas a alternativa pode exprimir ironia amarga; a nota preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação direta preserva o ritmo da acusação profética; as notas registram o idioma da aliança, a incerteza botânica e a ambiguidade teológica de מִשְׁפָּט.
