base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/007.yaml
  text: Samaria is cut off[b][a], her king like foam on the surface of the waters.
translation:
  language: pt
  text: Samaria será destruída[a]; seu rei será como espuma[b] sobre a superfície das águas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Samaria chegará ao fim” ou “Samaria será silenciada”; o verbo hebraico pode indicar chegar ao fim, ser destruído ou ser silenciado.
    reason: lexical_alternative
  - marker: b
    text: Ou “como uma lasca sobre a superfície das águas”; alguns entendem a imagem como um pequeno pedaço de madeira ou detrito flutuando sem controle.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדְמֶה
  choice: foi destruída
  rationale: O nifal de דמה aqui indica que Samaria chegou ao fim ou foi aniquilada. “Foi destruída” é claro e natural em português, sem restringir o verbo ao sentido menos provável de silêncio.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Forma tradicional em português para o nome da capital, que também pode representar o reino do norte.
- source_word: מַלְכָּהּ
  choice: seu rei
  rationale: O sufixo feminino singular retoma Samaria. Em português, “seu rei” expressa naturalmente essa relação sem exigir personificação explícita.
- source_word: כְּקֶצֶף
  choice: como espuma
  rationale: קֶצֶף designa mais naturalmente espuma ou escuma, imagem que comunica fragilidade, instabilidade e rápido desaparecimento; a possibilidade de “lasca” fica registrada em nota.
- source_word: עַל פְּנֵי מָיִם
  choice: sobre a superfície das águas
  rationale: Reproduz de modo natural a expressão hebraica “sobre a face das águas” e preserva a imagem de algo levado pela água.
