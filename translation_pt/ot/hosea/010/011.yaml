  text: וְ/אֶפְרַ֜יִם עֶגְלָ֤ה מְלֻמָּדָה֙ אֹהַ֣בְתִּי לָ/ד֔וּשׁ וַ/אֲנִ֣י עָבַ֔רְתִּי עַל ט֖וּב צַוָּארָ֑/הּ אַרְכִּ֤יב אֶפְרַ֨יִם֙ יַחֲר֣וֹשׁ יְהוּדָ֔ה יְשַׂדֶּד ל֖/וֹ יַעֲקֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/011.yaml
  text: Ephraim was a trained heifer that loved to thresh[a], but I spared her fair neck. I will put Ephraim to the yoke; Judah will plow[c][b]; Jacob will harrow for him.
translation:
  language: pt
  text: Efraim era uma novilha treinada, que gostava de debulhar; mas eu poupei seu belo pescoço.[a] Porei Efraim sob o jugo;[b] Judá lavrará, e Jacó gradeará para ele.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “passei sobre seu belo pescoço”. O hebraico desta oração é difícil; o texto principal expressa a ideia de que Efraim antes havia sido poupado do fardo mais pesado.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “Atrelarei Efraim”. Literalmente, “farei Efraim montar/andar”, provavelmente uma expressão para pôr o animal sob arreios ou sob o jugo.'
    reason: lexical_alternative
  - marker: c
    text: “Gradear” é desfazer os torrões e nivelar a terra depois de ará-la; também se pode traduzir por “desfará os torrões”.
    reason: cultural_note
lexical_decisions:
- source_word: עֶגְלָה מְלֻמָּדָה
  choice: uma novilha treinada
  rationale: Mantém a imagem agrícola de uma jovem vaca acostumada ao trabalho. “Treinada” é claro e natural, sem acrescentar a ideia mais específica de plena domesticação.
- source_word: אֹהַבְתִּי לָדוּשׁ
  choice: que gostava de debulhar
  rationale: Expressa a disposição habitual e prazerosa de Efraim para a debulha, tarefa relativamente mais leve para o animal, preservando tanto a atividade quanto o matiz afetivo.
- source_word: וַאֲנִי עָבַרְתִּי עַל טוּב צַוָּארָהּ
  choice: mas eu poupei seu belo pescoço
  rationale: O hebraico é difícil e idiomático. No contexto, a formulação comunica que o pescoço de Efraim havia sido preservado de um fardo mais pesado, sem ocultar em nota a possibilidade de uma tradução mais literal.
- source_word: אַרְכִּיב אֶפְרַיִם
  choice: Porei Efraim sob o jugo
  rationale: O hifil de רכב significa literalmente “farei montar/andar”, mas, nesta cena agrícola, parece indicar submeter o animal aos arreios ou ao jugo. A escolha explicita a imagem implícita com linguagem portuguesa clara.
- source_word: יַחֲרֹשׁ
  choice: lavrará
  rationale: Verbo agrícola corrente para trabalhar a terra com arado; o futuro convém ao anúncio contextual.
- source_word: יְשַׂדֵּד
  choice: gradeará
  rationale: Designa o trabalho secundário de desfazer torrões e nivelar a terra depois de ará-la. “Gradear” é conciso e tecnicamente preciso, com explicação em nota.
- source_word: לּוֹ יַעֲקֹב
  choice: Jacó gradeará para ele
  rationale: Conserva o pronome masculino singular do hebraico, provavelmente referente a Judá, sem resolver além do que o texto permite.
theological_decisions:
- issue: A metáfora agrícola aplicada a Efraim, Judá e Jacó
  choice: Apresentar Deus impondo a Efraim o jugo de um trabalho mais pesado e atribuindo trabalho agrícola também a Judá e Jacó.
  alternative: Ler a passagem apenas como descrição neutra de tarefas agrícolas, sem força disciplinar ou judicial.
  rationale: O contexto de Oseias 10 favorece uma dimensão de juízo e disciplina. A tradução preserva essa força sem introduzir categorias doutrinárias posteriores.
- issue: Sentido da ação divina sobre o pescoço de Efraim
  choice: “poupei seu belo pescoço”
  alternative: “passei sobre seu belo pescoço” ou “passei junto ao seu belo pescoço”
  rationale: A construção hebraica é incerta. O texto principal apresenta a leitura contextual de preservação anterior, enquanto a nota mantém aberta uma tradução mais literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Preservam-se a metáfora rural, a dificuldade do hebraico e o referente não totalmente explícito de “para ele”. O termo técnico “gradear” recebe explicação em nota.
