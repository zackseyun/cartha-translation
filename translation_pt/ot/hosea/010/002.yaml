  text: חָלַ֥ק לִבָּ֖/ם עַתָּ֣ה יֶאְשָׁ֑מוּ ה֚וּא יַעֲרֹ֣ף מִזְבְּחוֹתָ֔/ם יְשֹׁדֵ֖ד מַצֵּבוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/002.yaml
  text: Their heart is divided[a]; now they will bear guilt. He himself will tear down their altars[c][b]; he will devastate their sacred pillars.
translation:
  language: pt
  text: O coração deles está dividido[a]; agora levarão sobre si a culpa[b]. Ele mesmo derrubará os altares deles e devastará as colunas sagradas deles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O coração deles é falso/insincero”. O verbo hebraico pode transmitir a ideia de lisura ou falsidade; “dividido” destaca, neste contexto, uma lealdade partida.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “serão considerados culpados” ou “sofrerão por sua culpa”.'
    reason: lexical_alternative
  - marker: c
    text: “Colunas sagradas” eram pedras erguidas usadas no culto.
    reason: cultural_note
lexical_decisions:
- source_word: חָלַק
  choice: está dividido
  rationale: Com “coração” como sujeito, expressa metaforicamente uma lealdade partida. A tradução preserva a leitura mais provável no contexto, enquanto a nota registra a possível ideia de falsidade ou insinceridade.
- source_word: לִבָּם
  choice: o coração deles
  rationale: Mantém a imagem bíblica do coração como centro da vontade, do pensamento e da lealdade.
- source_word: עַתָּה
  choice: agora
  rationale: Marca de modo direto a passagem da acusação para o anúncio do juízo.
- source_word: יֶאְשָׁמוּ
  choice: levarão sobre si a culpa
  rationale: Preserva tanto a culpabilidade quanto a sujeição às consequências dela, sem reduzir o verbo apenas a punição.
- source_word: הוּא
  choice: Ele mesmo
  rationale: O pronome hebraico explícito é enfático. A formulação conserva essa ênfase sem acrescentar ao texto um nome divino.
- source_word: יַעֲרֹף
  choice: derrubará
  rationale: Transmite em português natural a destruição violenta e decisiva dos altares, evitando uma reprodução pouco idiomática da imagem literal de quebrar ou cortar o pescoço.
- source_word: מִזְבְּחוֹתָם
  choice: os altares deles
  rationale: Equivalente comum e preciso para os lugares de sacrifício mencionados no contexto de culto ilegítimo.
- source_word: יְשֹׁדֵד
  choice: devastará
  rationale: Expressa a ação destrutiva em paralelo com a derrubada dos altares, sem restringir o sentido a saque econômico.
- source_word: מַצֵּבוֹתָם
  choice: suas colunas sagradas
  rationale: Indica a função cultual das pedras erguidas, tornando a referência compreensível ao leitor moderno.
theological_decisions:
- issue: Referente do pronome enfático הוּא
  choice: “Ele mesmo” refere-se provavelmente a Deus como agente do juízo.
  alternative: O sujeito pode ser um inimigo ou outro agente não identificado do juízo.
  rationale: O contexto de Oseias favorece Deus como agente último da destruição, mas a tradução não insere “o SENHOR”, pois o hebraico traz apenas o pronome e deixa o referente implícito.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. Conserva o singular coletivo “coração”, a ênfase de “Ele mesmo” e a ambiguidade semântica relevante por meio de notas.
