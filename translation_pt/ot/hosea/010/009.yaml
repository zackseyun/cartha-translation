source:
  edition: WLC
  text: מִ/ימֵי֙ הַ/גִּבְעָ֔ה חָטָ֖אתָ יִשְׂרָאֵ֑ל שָׁ֣ם עָמָ֔דוּ לֹֽא תַשִּׂיגֵ֧/ם בַּ/גִּבְעָ֛ה מִלְחָמָ֖ה עַל בְּנֵ֥י עַֽלְוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/009.yaml
  text: From the days of Gibeah you have sinned[a], O Israel; there they have remained[b]. Will not war against the children of iniquity overtake them in Gibeah?
translation:
  language: pt
  text: Desde os dias de Gibeá[b], você tem pecado, ó Israel; ali eles permaneceram. Será que a guerra contra os filhos da perversidade não os alcançará em Gibeá?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A guerra contra os filhos da perversidade em Gibeá não os alcançou”; ou: “não os alcançará”. O hebraico desta oração é difícil.'
    reason: alternative_reading
  - marker: b
    text: Gibeá recorda o ultraje e a guerra civil narrados em Juízes 19–21, episódio que Oseias usa como paradigma da corrupção profundamente arraigada de Israel.
    reason: cross_reference
lexical_decisions:
- source_word: מִימֵי
  choice: Desde os dias de
  rationale: A preposição מִן com יָמִים indica um ponto inicial no tempo. “Desde os dias de” conserva a ligação histórica e soa natural em português.
- source_word: הַגִּבְעָה
  choice: Gibeá
  rationale: Nome próprio do lugar, transliterado de forma tradicional em português; o artigo hebraico não precisa ser reproduzido.
- source_word: חָטָאתָ
  choice: você tem pecado
  rationale: O qal perfeito na segunda pessoa masculina singular dirige-se a Israel como entidade coletiva. O perfeito composto mantém a acusação direta e sua continuidade até o presente.
- source_word: יִשְׂרָאֵל
  choice: ó Israel
  rationale: O vocativo é explícito pelo contexto; “ó Israel” preserva o tom profético e solene sem perder clareza.
- source_word: שָׁם
  choice: ali
  rationale: Advérbio locativo que remete a Gibeá e, possivelmente, à postura moral ligada àquele episódio.
- source_word: עָמָדוּ
  choice: eles permaneceram
  rationale: Embora עמד signifique literalmente “ficar de pé”, aqui pode exprimir persistência numa condição ou postura. “Permaneceram” conserva esse valor durativo sem explicitar demais.
- source_word: לֹא תַשִּׂיגֵם
  choice: Será que ... não os alcançará?
  rationale: O hifil de נשׂג significa “alcançar” ou “apanhar”. A pergunta retórica comunica a expectativa de que a guerra finalmente os alcance, sem ocultar a dificuldade sintática.
- source_word: בַּגִּבְעָה
  choice: em Gibeá
  rationale: A preposição בְּ com nome de lugar tem sentido locativo; “em Gibeá” é a formulação mais direta em português.
- source_word: מִלְחָמָה
  choice: guerra
  rationale: O termo pode designar guerra ou batalha. “Guerra” corresponde melhor à amplitude do conflito evocado em Juízes 19–21.
- source_word: עַל
  choice: contra
  rationale: Com מִלְחָמָה, עַל indica naturalmente o alvo da ação hostil.
- source_word: בְּנֵי עַלְוָה
  choice: os filhos da perversidade
  rationale: A expressão construta designa pessoas caracterizadas por corrupção moral. “Filhos da perversidade” mantém o idioma hebraico e o tom profético; “perversidade” abrange injustiça e desvio moral.
theological_decisions:
- issue: Sentido da cláusula difícil לֹא תַשִּׂיגֵם בַּגִּבְעָה מִלְחָמָה עַל בְּנֵי עַלְוָה
  choice: 'Pergunta retórica: “Será que a guerra contra os filhos da perversidade não os alcançará em Gibeá?”'
  alternative: “A guerra contra os filhos da perversidade em Gibeá não os alcançou” ou “não os alcançará”.
  rationale: A sintaxe hebraica admite mais de uma leitura. A pergunta retórica se ajusta ao fluxo da advertência profética, mas as alternativas são registradas em nota para preservar a ambiguidade real do texto.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” para representar a segunda pessoa singular dirigida ao Israel coletivo e mantém o plural “eles/os” onde o hebraico passa a tratar seus integrantes no plural. Os marcadores foram colocados junto aos elementos que explicam: [b] em Gibeá e [a] na cláusula sintaticamente difícil.'
