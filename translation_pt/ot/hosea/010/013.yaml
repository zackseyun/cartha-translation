base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/013.yaml
  text: You have plowed wickedness[a]; you have reaped injustice; you have eaten the fruit of deceit, because you trusted in your way[c][b], in the multitude of your warriors.
translation:
  language: pt
  text: Vocês araram a maldade e colheram a injustiça; comeram o fruto do engano[a], porque você confiou no seu caminho[b] e na multidão dos seus guerreiros[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da falsidade” ou “da mentira”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico passa de formas plurais (“vocês araram... colheram... comeram”) para formas singulares (“você confiou... seu caminho... seus guerreiros”), provavelmente tratando Israel como uma unidade coletiva.
    reason: cultural_note
  - marker: c
    text: Ou “seus homens valentes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲרַשְׁתֶּם
  choice: vocês cultivaram
  rationale: O verbo denota literalmente lavrar ou arar. “Cultivaram” mantém a imagem agrícola e permite que “a maldade” seja entendida naturalmente como aquilo que foi produzido intencionalmente.
- source_word: רֶשַׁע
  choice: a maldade
  rationale: Expressa o mal moral de maneira clara e corrente, preservando a força acusatória.
- source_word: עַוְלָתָה
  choice: a injustiça
  rationale: O substantivo pode indicar injustiça, perversidade ou transgressão; “injustiça” preserva sua dimensão moral e social e o distingue de רֶשַׁע.
- source_word: קְצַרְתֶּם
  choice: colheram
  rationale: Mantém literalmente a sequência agrícola entre cultivar, colher e comer.
- source_word: אֲכַלְתֶּם
  choice: comeram
  rationale: Tradução direta que preserva a progressão metafórica até o consumo do resultado.
- source_word: פְּרִי כָחַשׁ
  choice: o fruto da falsidade
  rationale: “Fruto” conserva a metáfora agrícola, e “falsidade” abrange mentira, engano e falta de fidelidade sem restringir indevidamente o sentido.
- source_word: כִּי
  choice: porque
  rationale: Introduz naturalmente a razão da acusação precedente.
- source_word: בָטַחְתָּ
  choice: você confiou
  rationale: A forma hebraica é singular e dirige-se a Israel como unidade coletiva; o singular foi preservado para tornar perceptível a mudança de número.
- source_word: בְדַרְכְּךָ
  choice: no seu próprio caminho
  rationale: “Caminho” conserva a metáfora hebraica para conduta, curso ou política adotada. “Próprio” explicita de modo natural o contraste implícito entre autoconfiança e confiança em Deus.
- source_word: בְּרֹב גִּבּוֹרֶיךָ
  choice: na multidão dos seus guerreiros
  rationale: O contexto é militar; “guerreiros” comunica claramente o sentido contextual de homens valentes, enquanto “multidão” preserva a ênfase na superioridade numérica.
theological_decisions:
- issue: Mudança da segunda pessoa do plural para a segunda pessoa do singular
  choice: Preservar a mudança como “vocês ... você”, entendendo o singular como referência corporativa a Israel.
  alternative: Uniformizar tudo no plural para maior fluência em português.
  rationale: A alternância está no texto hebraico e pode refletir a passagem da população plural para Israel como entidade coletiva. Preservá-la evita apagar uma característica genuína do discurso profético; uma nota esclarece a construção.
- issue: Sentido de בְדַרְכְּךָ
  choice: “no seu próprio caminho”, mantendo a referência aberta ao curso, conduta ou estratégia de Israel.
  alternative: Interpretar especificamente como “no seu poder” ou “na sua estratégia militar”.
  rationale: O paralelismo com os guerreiros sugere autoconfiança política ou militar, mas “caminho” possui alcance moral mais amplo e não deve ser reduzido sem necessidade.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A metáfora agrícola foi preservada, assim como a mudança significativa de número no hebraico. Os marcadores foram posicionados junto às expressões a que suas notas correspondem.
