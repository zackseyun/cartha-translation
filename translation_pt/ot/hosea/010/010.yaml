base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/010.yaml
  text: When I desire[a], I will discipline them[b], and peoples will be gathered against them when they are bound for their two transgressions.
translation:
  language: pt
  text: Quando eu quiser, eu os disciplinarei[a]; povos serão reunidos contra eles quando forem amarrados por suas duas iniquidades[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eu os castigarei”. O verbo também pode indicar correção ou disciplina.'
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “por suas duas iniquidades”; também pode significar “por sua dupla culpa”. A forma consonantal também deu origem à leitura “por seus dois olhos”, menos adequada ao contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּאַוָּתִי
  choice: Quando eu quiser
  rationale: A preposição ב com o substantivo verbal e o sufixo de primeira pessoa expressa a vontade de Deus como circunstância da ação. “Quando eu quiser” é natural em português e mantém o sentido temporal e volitivo.
- source_word: וְאֶסֳּרֵם
  choice: eu os disciplinarei
  rationale: A forma deriva de יסר, “disciplinar, corrigir, castigar”, e não de אסר, “amarrar”. “Disciplinarei” preserva a possibilidade de correção, embora o contexto seja de juízo.
- source_word: וְאֻסְּפוּ עֲלֵיהֶם עַמִּים
  choice: povos se reunirão contra eles
  rationale: O plural עַמִּים designa povos ou nações, e עֲלֵיהֶם assume sentido hostil neste contexto. A construção portuguesa conserva o valor passivo/reflexivo da forma hebraica sem soar artificial.
- source_word: בְּאָסְרָם
  choice: quando forem amarrados
  rationale: O infinitivo de אסר, “amarrar, prender”, com ב pode ser entendido temporalmente. A formulação mantém implícito o agente, como no hebraico compacto.
- source_word: לִשְׁתֵּי עינתם
  choice: por suas duas iniquidades
  rationale: No contexto de juízo, a forma é tradicionalmente entendida em relação a עון, “iniquidade, culpa”. “Duas iniquidades” conserva o elemento numérico e evita especificar quais seriam elas.
theological_decisions:
- issue: Sentido da expressão final לִשְׁתֵּי עינתם
  choice: por suas duas iniquidades
  alternative: por sua dupla culpa; por seus dois olhos
  rationale: O contexto favorece uma referência à culpa ou iniquidade, mas a forma consonantal é difícil e também suscitou a leitura literal “olhos”. A tradução conserva “duas” e não identifica as duas faltas, preservando a tensão do texto.
- issue: Nuance de וְאֶסֳּרֵם
  choice: eu os disciplinarei
  alternative: eu os castigarei; eu os corrigirei
  rationale: “Disciplinarei” permite tanto correção quanto ação punitiva e não restringe indevidamente a natureza do juízo divino.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Quando eu quiser” expressa de modo corrente a vontade soberana indicada no início do verso; “povos” preserva o plural coletivo sem limitar a referência a Estados nacionais. A pontuação com ponto e vírgula separa as duas ações principais sem desfazer sua ligação.
