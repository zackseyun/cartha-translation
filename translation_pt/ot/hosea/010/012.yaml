source:
  edition: WLC
  text: זִרְע֨וּ לָ/כֶ֤ם לִ/צְדָקָה֙ קִצְר֣וּ לְ/פִי חֶ֔סֶד נִ֥ירוּ לָ/כֶ֖ם נִ֑יר וְ/עֵת֙ לִ/דְר֣וֹשׁ אֶת יְהוָ֔ה עַד יָב֕וֹא וְ/יֹרֶ֥ה צֶ֖דֶק לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/012.yaml
  text: Sow for yourselves for righteousness[a]; reap according to steadfast love. Break up for yourselves unplowed ground, for it is time to seek Yahweh[b], until he comes and rains righteousness on you.
translation:
  language: pt
  text: Semeiem para vocês mesmos visando à justiça; colham segundo o amor leal. Lavrem para vocês mesmos a terra não cultivada[a], pois é tempo de buscar o SENHOR, até que ele venha e faça chover justiça sobre vocês[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a terra em pousio”.'
    reason: Alternativa lexical para נִיר, que pode designar solo não cultivado ou deixado em pousio.
  - marker: b
    text: 'Ou: “e ensine a vocês a justiça”. O verbo hebraico também pode significar “ensinar”, embora as imagens agrícolas do versículo favoreçam “faça chover”.'
    reason: Preserva a alternativa semântica de וְיֹרֶה e a tensão interpretativa do texto.
lexical_decisions:
- source_word: זִרְעוּ לָכֶם לִצְדָקָה
  choice: Semeiem para vocês mesmos visando à justiça
  rationale: Mantém a metáfora agrícola e expressa o provável valor de finalidade ou resultado da preposição לְ, sem reduzir צְדָקָה apenas à justiça social.
- source_word: קִצְרוּ לְפִי חֶסֶד
  choice: colham segundo o amor leal
  rationale: “Colham” corresponde diretamente ao ato de ceifar, enquanto “amor leal” comunica de modo acessível a bondade constante e a lealdade relacional de חֶסֶד.
- source_word: נִירוּ לָכֶם נִיר
  choice: Lavrem para vocês mesmos a terra não cultivada
  rationale: Reproduz a exortação agrícola e torna claro ao leitor moderno que se trata de preparar solo ainda não trabalhado; a alternativa tradicional “terra em pousio” é preservada em nota.
- source_word: וְעֵת לִדְרוֹשׁ אֶת־יְהוָה
  choice: pois é tempo de buscar o SENHOR
  rationale: A conjunção é entendida como explicativa no contexto, e “buscar” preserva o idioma de voltar-se ativamente para Deus. O nome divino é representado pela forma portuguesa tradicional “SENHOR”.
- source_word: עַד־יָבוֹא וְיֹרֶה צֶדֶק לָכֶם
  choice: até que ele venha e faça chover justiça sobre vocês
  rationale: A leitura ligada à chuva prolonga de forma coerente as imagens de semear, colher e lavrar. “Justiça” mantém a ligação lexical com צְדָקָה no início do versículo.
theological_decisions:
- issue: Sentido de וְיֹרֶה צֶדֶק
  choice: ele faça chover justiça
  alternative: ele ensine a vocês a justiça
  rationale: O contexto agrícola favorece o sentido de fazer chover ou derramar, mas o verbo ירה também pode significar ensinar. A alternativa legítima é mantida em nota, sem eliminar a ambiguidade do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Os imperativos plurais usam “vocês”; a metáfora agrícola é preservada, e termos excessivamente técnicos são evitados no texto principal.
