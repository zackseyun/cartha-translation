source:
  edition: WLC
  text: כִּ֤י עַתָּה֙ יֹֽאמְר֔וּ אֵ֥ין מֶ֖לֶךְ לָ֑/נוּ כִּ֣י לֹ֤א יָרֵ֨אנוּ֙ אֶת יְהֹוָ֔ה וְ/הַ/מֶּ֖לֶךְ מַה יַּֽעֲשֶׂה לָּֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/003.yaml
  text: For now they will say[a], “We have no king, because we did not fear Yahweh[b]; and the king—what can he do for us?”
translation:
  language: pt
  text: 'Pois agora eles dirão: “Não temos rei, porque não tememos Yahweh[a]. E o rei — o que poderá fazer por nós?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porque não temíamos Yahweh” ou “porque não temos temido Yahweh”. O perfeito hebraico pode descrever tanto a falha culpável do passado quanto uma condição consolidada.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “E o rei — o que fará por nós?” A forma hebraica é formalmente futura; o texto principal expressa a ideia retórica de capacidade ou eficácia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: No início do versículo, a conjunção introduz a explicação da situação anunciada; “Pois” preserva essa ligação discursiva. A segunda ocorrência é vertida por “porque”, com valor causal explícito.
- source_word: עַתָּה
  choice: agora
  rationale: O advérbio temporal aponta para a situação presente ou iminente e é expresso naturalmente por “agora”.
- source_word: יֹאמְרוּ
  choice: eles dirão
  rationale: O imperfeito na terceira pessoa do plural é entendido como futuro ou preditivo no discurso profético.
- source_word: אֵין מֶלֶךְ לָנוּ
  choice: Não temos rei
  rationale: Formulação idiomática em português que conserva a força existencial da expressão hebraica.
- source_word: כִּי לֹא יָרֵאנוּ אֶת יְהוָה
  choice: porque não tememos Yahweh
  rationale: O perfeito hebraico pode exprimir uma falha passada ou uma condição consolidada. “Não tememos” mantém em português uma ambiguidade temporal razoável e conserva “temer” como expressão de temor, reverência e submissão pactual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: וְהַמֶּלֶךְ
  choice: E o rei
  rationale: Mantém a coordenação hebraica; o travessão reproduz a mudança abrupta para a pergunta retórica.
- source_word: מַה יַּעֲשֶׂה לָּנוּ
  choice: o que poderá fazer por nós?
  rationale: O futuro “poderá fazer” preserva a forma prospectiva e, no contexto retórico, comunica a incapacidade prática do rei.
theological_decisions:
- issue: Sentido de temer Yahweh
  choice: Manter “tememos Yahweh” no texto principal
  alternative: “reverenciamos Yahweh”
  rationale: O verbo ירא abrange temor, reverência e submissão obediente. “Temer” é a correspondência mais direta e preserva o peso da acusação profética.
- issue: Valor temporal de יָרֵאנוּ
  choice: “não tememos”
  alternative: “não temíamos” ou “não temos temido”
  rationale: O perfeito pode apresentar tanto a falha culpável passada quanto uma condição estabelecida. A forma portuguesa escolhida deixa o contexto determinar a extensão temporal sem a fixar excessivamente.
- issue: Força da pergunta sobre o rei
  choice: 'Pergunta retórica de capacidade: “o que poderá fazer por nós?”'
  alternative: 'Pergunta estritamente futura: “o que fará por nós?”'
  rationale: A forma hebraica é futura, mas a pergunta sugere a impotência do rei; “poderá” conserva a orientação futura e explicita com moderação a força retórica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. Mantém o nome divino “Yahweh”, o termo teologicamente carregado “temer” e a brusquidão da pergunta retórica por meio do travessão.
