  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: זִבְחֵ֣י הַבְהָבַ֗/י יִזְבְּח֤וּ בָשָׂר֙ וַ/יֹּאכֵ֔לוּ יְהוָ֖ה לֹ֣א רָצָ֑/ם עַתָּ֞ה יִזְכֹּ֤ר עֲוֺנָ/ם֙ וְ/יִפְקֹ֣ד חַטֹּאותָ֔/ם הֵ֖מָּה מִצְרַ֥יִם יָשֽׁוּבוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/013.yaml
  text: As for the sacrifices of my offerings[a], they sacrifice flesh and eat it, but Yahweh does not accept them. Now he will remember their iniquity and punish their sins[c][b]; they will return to Egypt.
translation:
  language: pt
  text: Quanto aos sacrifícios das minhas ofertas[a], eles sacrificam carne e a comem, mas Yahweh não os aceita[b]. Agora ele se lembrará da iniquidade deles e castigará os seus pecados; eles voltarão ao Egito[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz uma expressão incomum, literalmente algo como “os sacrifícios das minhas ofertas”. Também pode ser entendida como “minhas dádivas sacrificiais” ou, com menor probabilidade, “meus sacrifícios amados”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não se agrada deles”.'
    reason: lexical_alternative
  - marker: c
    text: “Voltar ao Egito” pode indicar um retorno efetivo ou, de modo mais amplo, a volta à escravidão e ao exílio sob a imagem do Egito.
    reason: alternative_reading
lexical_decisions:
- source_word: זִבְחֵי הַבְהָבַי
  choice: os sacrifícios das minhas ofertas
  rationale: Preserva de modo transparente a construção incomum do hebraico, em que זִבְחֵי é o plural construto de “sacrifícios” e הַבְהָבַי provavelmente se refere a ofertas ou dádivas apresentadas a Deus. A nota registra alternativas sem emendar o texto.
- source_word: יִזְבְּחוּ בָשָׂר וַיֹּאכֵלוּ
  choice: eles sacrificam carne e a comem
  rationale: Mantém o verbo זבח e a linguagem concreta de בָּשָׂר no contexto sacrificial; o pronome “a” explicita naturalmente em português que a carne é o objeto de “comem”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: לֹא רָצָם
  choice: não os aceita
  rationale: No contexto de sacrifícios, רצה com sufixo objetivo indica aceitação favorável. O pronome masculino plural retoma “sacrifícios”.
- source_word: יִזְכֹּר עֲוֺנָם
  choice: ele se lembrará da iniquidade deles
  rationale: Conserva o verbo “lembrar”, que aqui possui força judicial e pactual, e traduz עָוֹן por “iniquidade” sem reduzir seu alcance apenas à culpa.
- source_word: וְיִפְקֹד חַטֹּאותָם
  choice: e castigará os seus pecados
  rationale: פקד, neste contexto punitivo, comunica a ação de levar os pecados a juízo e puni-los; “castigará” expressa esse sentido de modo corrente e digno em português.
- source_word: הֵמָּה מִצְרַיִם יָשׁוּבוּ
  choice: eles voltarão ao Egito
  rationale: Mantém a referência geográfica explícita e não decide se o retorno é literal, simbólico ou ambos. O pronome expresso “eles” também reflete a presença enfática de הֵמָּה.
theological_decisions:
- issue: Sentido de “voltar ao Egito”
  choice: eles voltarão ao Egito
  alternative: eles voltarão à escravidão semelhante à do Egito
  rationale: O hebraico nomeia diretamente o Egito. A tradução conserva essa formulação e deixa aberta a tensão entre retorno geográfico, reversão simbólica do êxodo e novo estado de opressão ou exílio.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura incomum da primeira expressão foi preservada no texto e explicada em nota; a linguagem sacrificial e judicial permanece concreta, e a ambiguidade profética do retorno ao Egito não foi resolvida no corpo do versículo.
