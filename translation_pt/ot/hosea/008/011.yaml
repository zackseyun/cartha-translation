  text: כִּֽי הִרְבָּ֥ה אֶפְרַ֛יִם מִזְבְּחֹ֖ת לַ/חֲטֹ֑א הָיוּ ל֥/וֹ מִזְבְּח֖וֹת לַ/חֲטֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/011.yaml
  text: Because Ephraim has multiplied altars for sinning[a], they have become altars for sinning to him.
translation:
  language: pt
  text: Pois Efraim multiplicou altares para pecar[a]; eles se tornaram, para ele, altares para pecar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para ofertas pelo pecado”, nas duas ocorrências de “para pecar”. A forma hebraica pode ser entendida em sentido cultual, mas o contexto favorece a ideia de que esses altares se tornaram ocasiões para pecar.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou fundamento no contexto de juízo e mantém uma ligação natural com o versículo anterior.
- source_word: הִרְבָּה
  choice: multiplicou
  rationale: O hifil de רבה expressa aumento causado; “multiplicou” preserva a força verbal e o tom da acusação profética.
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Mantém o nome próprio; em Oseias, ele frequentemente representa o reino do norte, mas o texto nomeia Efraim diretamente.
- source_word: מִזְבְּחֹת
  choice: altares
  rationale: Equivalente corrente de מזבח; o plural destaca a proliferação de locais de culto.
- source_word: לַחֲטֹא
  choice: para pecar
  rationale: Preserva o sentido verbal mais natural do infinitivo de חטא neste contexto e também sua possível nuance de finalidade ou resultado.
- source_word: הָיוּ לוֹ
  choice: eles se tornaram, para ele
  rationale: Expressa o estado resultante dos altares e conserva explicitamente a nuance dativa de לוֹ.
- source_word: מִזְבְּחוֹת לַחֲטֹא
  choice: altares para pecar
  rationale: 'Retém a repetição retórica hebraica e a ironia profética: os altares multiplicados tornaram-se ocasiões de pecado.'
theological_decisions:
- issue: Sentido de לַחֲטֹא nas duas ocorrências
  choice: 'sentido verbal: “para pecar”'
  alternative: 'sentido cultual: “para ofertas pelo pecado”'
  rationale: Embora a raiz חטא possa ter emprego cultual em certos contextos, a denúncia imediata em Oseias favorece a ideia de que os altares eram ocasiões de transgressão. A nota preserva a alternativa lexical legítima sem neutralizar a ironia profética.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A repetição deliberada de “altares para pecar” reproduz a retórica do hebraico; “para ele” é mantido para não apagar o dativo do texto-fonte.
