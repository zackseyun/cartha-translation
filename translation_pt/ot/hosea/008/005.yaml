source:
  edition: WLC
  text: זָנַח֙ עֶגְלֵ֣/ךְ שֹֽׁמְר֔וֹן חָרָ֥ה אַפִּ֖/י בָּ֑/ם עַד מָתַ֕י לֹ֥א יוּכְל֖וּ נִקָּיֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/005.yaml
  text: He has rejected your calf[a], O Samaria; my anger burns against them[b]. How long will they be incapable of innocence?
translation:
  language: pt
  text: Ele rejeitou o seu bezerro[a], ó Samaria; minha ira arde contra eles. Até quando não conseguirão ser inocentes[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O seu bezerro te rejeitou, ó Samaria”. A sintaxe hebraica permite entender o bezerro como sujeito do verbo inicial, embora o texto principal tome Deus como sujeito implícito.'
    reason: alternative_reading
  - marker: b
    text: “Inocência” também pode ser traduzida por “pureza” ou “limpeza”. O termo hebraico pode ter conotações tanto morais quanto cultuais.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָנַח
  choice: rejeitou
  rationale: O verbo expressa rejeitar, repudiar ou lançar fora. “Rejeitou” é claro e natural, e mantém a força da denúncia profética.
- source_word: עֶגְלֵךְ
  choice: o seu bezerro
  rationale: A expressão significa literalmente “seu bezerro”. Embora se refira à imagem idolátrica ligada a Samaria, a tradução preserva o substantivo concreto sem acrescentar “ídolo” ao texto principal.
- source_word: שֹׁמְרוֹן
  choice: ó Samaria
  rationale: Samaria é diretamente interpelada; “ó” torna explícito o vocativo e conserva o tom solene da profecia.
- source_word: חָרָה אַפִּי
  choice: minha ira arde
  rationale: O idioma hebraico descreve literalmente a ira como algo que queima. A formulação portuguesa preserva essa metáfora de modo natural.
- source_word: בָּם
  choice: contra eles
  rationale: Com o idioma da ira ardente, a preposição tem sentido direcional. O plural provavelmente abrange as pessoas ligadas à idolatria, e não apenas a cidade singular.
- source_word: עַד מָתַי
  choice: Até quando
  rationale: Equivalente português idiomático da pergunta temporal hebraica.
- source_word: לֹא יוּכְלוּ
  choice: serão incapazes de
  rationale: A pergunta retórica apresenta uma incapacidade persistente. Esta formulação comunica essa duração sem transformar a frase numa simples proibição.
- source_word: נִקָּיוֹן
  choice: inocência
  rationale: O substantivo pode denotar inocência, pureza ou limpeza. “Inocência” conserva em primeiro plano a dimensão moral, enquanto a nota registra a amplitude moral e cultual do termo.
theological_decisions:
- issue: Sujeito do verbo inicial זָנַח
  choice: 'Deus como sujeito implícito: “Ele rejeitou o seu bezerro”'
  alternative: 'O bezerro como sujeito: “O seu bezerro rejeitou você, ó Samaria”'
  rationale: A sintaxe hebraica admite que “seu bezerro” seja entendido como sujeito posposto, embora essa leitura requeira que o objeto “você” seja inferido. O contexto de fala divina e a oração seguinte, “minha ira arde contra eles”, favorecem Deus como sujeito implícito. A alternativa legítima é preservada em nota.
- issue: Amplitude de נִקָּיוֹן
  choice: inocência
  alternative: pureza ou limpeza
  rationale: No contexto de idolatria, o termo pode envolver simultaneamente culpa moral e impureza cultual. A tradução não limita a palavra a uma categoria estritamente ritual, e a nota mantém sua amplitude sem resolver indevidamente a tensão.
translation_notes:
  register: Português atual, claro e solene, com ampla legibilidade brasileira. A metáfora “minha ira arde” e a formulação deliberadamente incisiva “incapazes de inocência” preservam a força e a tensão do hebraico. Os marcadores foram colocados junto aos termos a que suas notas se referem.
