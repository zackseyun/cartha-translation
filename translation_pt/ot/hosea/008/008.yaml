  text: נִבְלַ֖ע יִשְׂרָאֵ֑ל עַתָּה֙ הָי֣וּ בַ/גּוֹיִ֔ם כִּ/כְלִ֖י אֵֽין חֵ֥פֶץ בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/008.yaml
  text: Israel is swallowed up[a]; now they are among the nations like a vessel in which there is no delight.
translation:
  language: pt
  text: Israel foi engolido; agora eles estão entre as nações como um recipiente que ninguém deseja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um recipiente no qual não há prazer”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְלַע
  choice: foi engolido
  rationale: O nifal de בלע expressa ser engolido ou tragado. O pretérito perfeito reproduz naturalmente em português a forma hebraica e apresenta o juízo como consumado, sem perder a imagem concreta.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nome próprio que designa coletivamente o reino do norte e seu povo.
- source_word: עַתָּה
  choice: agora
  rationale: Advérbio temporal que introduz a situação resultante do juízo anunciado.
- source_word: הָיוּ בַגּוֹיִם
  choice: está entre as nações
  rationale: Embora o verbo hebraico esteja no plural, Israel é um nome coletivo. O singular é natural em português, e 'está' comunica o estado resultante no contexto de עַתָּה.
- source_word: כִּכְלִי
  choice: como um recipiente
  rationale: כְּלִי pode indicar vaso, utensílio ou objeto. 'Recipiente' conserva a imagem de algo que pode ser engolido ou rejeitado e é claro no português atual.
- source_word: אֵין חֵפֶץ בּוֹ
  choice: que ninguém deseja
  rationale: A expressão indica que não há agrado, prazer ou interesse nele. A formulação pessoal e idiomática transmite com clareza que o recipiente é indesejado.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora concreta e o sentido coletivo de Israel foram preservados; a nota registra a formulação mais literal da expressão final.
