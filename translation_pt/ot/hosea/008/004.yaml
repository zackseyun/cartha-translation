source:
  edition: WLC
  text: הֵ֤ם הִמְלִיכוּ֙ וְ/לֹ֣א מִמֶּ֔/נִּי הֵשִׂ֖ירוּ וְ/לֹ֣א יָדָ֑עְתִּי כַּסְפָּ֣/ם וּ/זְהָבָ֗/ם עָשׂ֤וּ לָ/הֶם֙ עֲצַבִּ֔ים לְמַ֖עַן יִכָּרֵֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/004.yaml
  text: They made kings, but not from me; they appointed princes, but I did not know it. With their silver and their gold they made idols for themselves, so that they might be cut off.
translation:
  language: pt
  text: Constituíram reis, mas não da minha parte; nomearam governantes, mas sem o meu conhecimento. Com sua prata e seu ouro fizeram ídolos para si, para que seja eliminado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «para que seja destruído». O verbo hebraico está no singular e não explicita seu referente; pode referir-se ao povo ou à idolatria e aos ídolos.'
    reason: Preserva o singular passivo de יִכָּרֵת e informa a ambiguidade do referente sem a resolver no texto principal.
lexical_decisions:
- source_word: הִמְלִיכוּ
  choice: estabeleceram reis
  rationale: Expressa a ação de constituir alguém rei sem sugerir necessariamente uma cerimônia específica.
- source_word: הֵשִׂירוּ
  choice: nomearam autoridades
  rationale: O verbo indica constituir chefes ou governantes; 'autoridades' comunica a função sem restringi-la ao título moderno de príncipe.
- source_word: וְלֹא יָדָעְתִּי
  choice: mas sem o meu conhecimento
  rationale: Reproduz de modo natural a afirmação divina de que tais nomeações não contaram com seu conhecimento ou reconhecimento, sem resolver toda a sua força teológica.
- source_word: עֲצַבִּים
  choice: ídolos
  rationale: Equivalente português claro e corrente para imagens de culto idólatra.
- source_word: יִכָּרֵת
  choice: fossem eliminados
  rationale: Preserva o passivo e a ideia forte de ser cortado, destruído ou removido; a nota registra a possível referência ambígua.
theological_decisions:
- issue: A relação de Deus com a instituição dos reis
  choice: mas não da minha parte
  alternative: mas não por mim
  rationale: A expressão hebraica מִמֶּנִּי indica que a realeza não procedeu de Deus ou não teve sua autorização; 'da minha parte' mantém essa nuance sem afirmar mais do que o texto.
- issue: Sentido do desconhecimento divino
  choice: mas sem o meu conhecimento
  alternative: mas eu não os reconheci
  rationale: Mantém a linguagem antropomórfica e a tensão do original, sem transformá-la explicitamente em falta de onisciência nem reduzi-la apenas a desaprovação.
- issue: Referente do sujeito implícito em יִכָּרֵת
  choice: para que fossem eliminados
  alternative: para que isso fosse destruído
  rationale: A forma singular hebraica não identifica de modo inequívoco o referente; o texto principal segue a leitura contextual que aponta para o povo, enquanto a nota preserva a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita arcaísmos e conserva a acusação profética direta e a ambiguidade do encerramento.
