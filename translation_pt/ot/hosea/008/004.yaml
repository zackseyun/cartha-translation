    issue: Discordância de número e explicitação indevida no verbo final
    rationale: יִכָּרֵת é singular passivo, enquanto «fossem eliminados» é plural e orienta o leitor para um sujeito humano plural. Como o referente hebraico é disputado/não expresso, a tradução deve manter o singular e a elipse, com nota explicativa.
  revised_text: Constituíram reis, mas não da minha parte; nomearam governantes, mas sem o meu conhecimento. Com sua prata e seu ouro fizeram ídolos para si, para que seja eliminado.[a]
