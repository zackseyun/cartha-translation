revisions:
- from: Eles estabeleceram reis, mas não da minha parte; nomearam autoridades, mas sem o meu conhecimento. Com sua prata e seu ouro fizeram ídolos para si, para que fossem eliminados.[a]
  to: Constituíram reis, mas não da minha parte; nomearam governantes, mas sem o meu conhecimento. Com sua prata e seu ouro fizeram ídolos para si, para que seja eliminado.[a]
  rationale: A revisão corrige o plural indevidamente introduzido no desfecho e preserva a ambiguidade referencial por meio de uma formulação singular impessoal e de nota. Também ajusta «estabeleceram» para «constituíram» e «autoridades» para «governantes», escolhas naturais que refletem com maior precisão a constituição de reis e chefes no hebraico.
