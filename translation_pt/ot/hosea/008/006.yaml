base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/006.yaml
  text: For it is from Israel[a]; a craftsman made it, and it is not God. Indeed[b], the calf of Samaria will become splinters.
translation:
  language: pt
  text: Pois ele vem de Israel; um artesão o fez, e ele não é Deus.[a] De fato, o bezerro de Samaria será reduzido a estilhaços.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ele não é um deus”. O hebraico diz literalmente: “e ele não é Deus”, negando que o ídolo tenha verdadeira divindade.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “se tornará fragmentos” ou “será quebrado em pedaços”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: No início do versículo, introduz a razão que sustenta a denúncia anterior.
- source_word: מִיִּשְׂרָאֵל
  choice: vem de Israel
  rationale: Expressa com naturalidade a origem do ídolo no próprio Israel; o verbo implícito é suprido em português.
- source_word: חָרָשׁ עָשָׂהוּ
  choice: um artesão o fez
  rationale: Mantém o contraste entre fabricação humana e verdadeira divindade sem especificar indevidamente o material ou ofício.
- source_word: וְלֹא אֱלֹהִים הוּא
  choice: e ele não é Deus
  rationale: Preserva a negação direta do hebraico e a força polêmica contra a alegada divindade do ídolo.
- source_word: כִּי
  choice: Sim
  rationale: Marca aqui confirmação enfática e introduz o destino destrutivo do ídolo.
- source_word: שְׁבָבִים יִהְיֶה
  choice: será reduzido a estilhaços
  rationale: 'Comunica idiomaticamente o resultado: o objeto será quebrado em pequenos fragmentos.'
- source_word: עֵגֶל שֹׁמְרוֹן
  choice: o bezerro de Samaria
  rationale: Reproduz com clareza a relação construta, identificando o ídolo associado a Samaria.
theological_decisions:
- issue: Natureza da negação em וְלֹא אֱלֹהִים הוּא
  choice: ele não é Deus
  alternative: ele não é um deus
  rationale: A opção principal conserva a formulação direta e a ambiguidade gramatical do predicado אֱלֹהִים, negando ao bezerro a verdadeira divindade sem acrescentar uma categoria teológica alheia ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A retomada pronominal masculina (“ele”, “o”) concorda com “bezerro”, referente contextual do ídolo. A pontuação torna explícita a estrutura sem alterar o sentido.
