  text: וַ/יִּשְׁכַּ֨ח יִשְׂרָאֵ֜ל אֶת עֹשֵׂ֗/הוּ וַ/יִּ֨בֶן֙ הֵֽיכָל֔וֹת וִֽ/יהוּדָ֕ה הִרְבָּ֖ה עָרִ֣ים בְּצֻר֑וֹת וְ/שִׁלַּחְתִּי אֵ֣שׁ בְּ/עָרָ֔י/ו וְ/אָכְלָ֖ה אַרְמְנֹתֶֽי/הָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/014.yaml
  text: For Israel has forgotten his Maker and built palaces[a], and Judah has multiplied fortified cities; so I will send fire into his cities, and it will consume her citadels.
translation:
  language: pt
  text: Pois Israel se esqueceu daquele que o fez e construiu palácios[a]; Judá multiplicou cidades fortificadas. Por isso, enviarei fogo contra as cidades dele, e o fogo consumirá as cidadelas dessas cidades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “templos”. A palavra hebraica pode se referir a palácios ou a templos.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֵׂהוּ
  choice: daquele que o fez
  rationale: Expressa com naturalidade o particípio com sufixo e conserva a referência pessoal ao Deus que fez Israel, sem tornar o termo abstrato.
- source_word: הֵיכָלוֹת
  choice: palácios
  rationale: O termo pode indicar palácios ou templos. No paralelismo com as cidades fortificadas e as cidadelas, “palácios” realça as estruturas de poder e segurança; a alternativa cultual é mantida em nota.
- source_word: הִרְבָּה
  choice: multiplicou
  rationale: Reproduz o sentido causativo de tornar numerosas e mantém a concisão do hebraico.
- source_word: עָרִים בְּצֻרוֹת
  choice: cidades fortificadas
  rationale: É a formulação portuguesa corrente para cidades dotadas de defesas militares.
- source_word: וְשִׁלַּחְתִּי אֵשׁ
  choice: Por isso, enviarei fogo
  rationale: Torna clara a relação entre a confiança nas construções defensivas e o juízo anunciado, sem ampliar indevidamente o texto.
- source_word: בְּעָרָיו
  choice: às cidades dele
  rationale: A preposição é vertida de modo idiomático com o verbo “enviar”; “dele” preserva o sufixo masculino singular, cujo antecedente mais próximo é Judá.
- source_word: אַרְמְנֹתֶיהָ
  choice: as cidadelas delas
  rationale: No contexto militar, “cidadelas” comunica melhor estruturas fortificadas. “Delas” retém o sufixo feminino e o relaciona naturalmente às cidades.
theological_decisions:
- issue: Mudança dos referentes pronominais entre Israel e Judá
  choice: 'A cláusula de juízo se dirige a Judá: “dele” se refere a Judá, e “delas” às cidades.'
  alternative: Entender toda a cláusula final como novo retorno a Israel ou eliminar a diferença dos sufixos na tradução.
  rationale: Judá é o antecedente masculino singular mais próximo de “suas cidades”, enquanto o sufixo feminino de “suas cidadelas” pode retomar coletivamente as cidades. A tradução conserva essa mudança em vez de uniformizá-la.
- issue: Sentido de הֵיכָלוֹת
  choice: “palácios” no texto principal, com “templos” em nota.
  alternative: “templos” no texto principal.
  rationale: O hebraico admite os dois sentidos. O contexto de cidades fortificadas e cidadelas favorece estruturas políticas e defensivas, mas a possibilidade cultual permanece relevante e é preservada.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe clara para leitores brasileiros e compreensão internacional. A repetição de “o fogo” evita uma referência pronominal ambígua; “dele/delas” preserva deliberadamente a alternância de gênero presente no hebraico.
