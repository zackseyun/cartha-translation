language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֛י ר֥וּחַ יִזְרָ֖עוּ וְ/סוּפָ֣תָ/ה יִקְצֹ֑רוּ קָמָ֣ה אֵֽין ל֗/וֹ צֶ֚מַח בְּלִ֣י יַֽעֲשֶׂה קֶּ֔מַח אוּלַ֣י יַֽעֲשֶׂ֔ה זָרִ֖ים יִבְלָעֻֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/007.yaml
  text: For they sow the wind[a], and they will reap the whirlwind. The standing grain has no head; it will yield no flour. Even if it should yield[c][b], strangers will swallow it up.
translation:
  language: pt
  text: Pois eles semeiam vento e colherão tempestade[a]. O cereal em pé não tem espiga[b] e não produzirá farinha. Ainda que produza[c], estrangeiros a devorarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “turbilhão”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “O cereal em pé não tem צֶמַח”; o termo pode significar “broto” ou “crescimento”, mas aqui provavelmente se refere à espiga necessária para produzir farinha.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “Talvez produza, mas estrangeiros a devorarão”.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou razão do juízo anunciado no contexto anterior e mantém o fluxo argumentativo profético.
- source_word: רוּחַ
  choice: vento
  rationale: O sentido concreto se ajusta à imagem agrícola de semear e colher e forma o contraste intensificado com a tempestade; 'espírito' não é indicado pelo contexto.
- source_word: וְסוּפָתָה
  choice: e ... tempestade
  rationale: סוּפָה designa uma tempestade violenta ou turbilhão. 'Tempestade' é natural em português e preserva a intensificação entre o vento semeado e o resultado destrutivo colhido.
- source_word: יִקְצֹרוּ
  choice: colherão
  rationale: O imperfeito expressa naturalmente a consequência futura, com força proverbial de juízo.
- source_word: קָמָה
  choice: o cereal em pé
  rationale: Refere-se ao cereal ainda de pé no campo; esta formulação conserva a imagem agrícola com clareza em português moderno.
- source_word: צֶמַח
  choice: espiga
  rationale: Embora o substantivo possa significar broto ou crescimento, neste contexto indica o desenvolvimento do cereal necessário para produzir farinha; 'espiga' comunica de modo claro esse resultado agrícola.
- source_word: בְּלִי יַעֲשֶׂה קֶּמַח
  choice: não produzirá farinha
  rationale: Expressa de maneira idiomática a inutilidade da lavoura fracassada, sem perder a ligação entre cereal e farinha.
- source_word: אוּלַי
  choice: Ainda que
  rationale: 'Aqui introduz uma possibilidade concessiva: mesmo supondo que haja produção, Israel não se beneficiará dela.'
- source_word: זָרִים
  choice: estrangeiros
  rationale: Designa pessoas de fora, provavelmente povos estrangeiros, que consumirão a produção em lugar de Israel.
- source_word: יִבְלָעֻהוּ
  choice: a devorarão
  rationale: Preserva a imagem vívida de consumo completo. O pronome feminino retoma naturalmente 'farinha' em português, embora o sufixo hebraico possa remeter ao produto ou à colheita de modo mais amplo.
theological_decisions:
- issue: Interpretação da metáfora agrícola
  choice: Manter diretamente a imagem proverbial de semeadura e colheita como anúncio de juízo.
  alternative: Explicitar em paráfrase o vento como vaidade e a tempestade como desastre.
  rationale: O próprio versículo apresenta ações e consequências por meio de imagens agrícolas concretas. A tradução permite que o sentido teológico do juízo surja da metáfora sem impor uma explicação denominacional ou alegórica.
- issue: Força de אוּלַי na última oração
  choice: Traduzir concessivamente por 'Ainda que produza'.
  alternative: 'Traduzir de modo mais literal e dubitativo: ''Talvez produza, mas estrangeiros a devorarão''.'
  rationale: 'A leitura concessiva se encaixa bem na progressão retórica: mesmo no caso improvável de alguma produção, ela será perdida. A alternativa genuína é preservada em nota.'
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem e o paralelismo profético foram mantidos. 'Cereal em pé' evita regionalismos e explicita o referente agrícola; 'tempestade' soa mais natural que 'redemoinho' ou 'turbilhão' no texto principal, enquanto uma alternativa lexical é registrada em nota.
