  yaml_path: translation/ot/hosea/008/003.yaml
  text: Israel has rejected the good[a]; an enemy will pursue him.
translation:
  language: pt
  text: Israel rejeitou o bem[a]; um inimigo o perseguirá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Israel rejeitou o que é bom”. Também se pode traduzir o verbo por “lançou fora”.'
    reason: Registra tanto a alternativa idiomática para o adjetivo substantivado טוֹב quanto a nuance lexical possível de זָנַח.
lexical_decisions:
- source_word: זָנַח
  choice: rejeitou
  rationale: O verbo expressa rejeitar, repudiar ou lançar fora. “Rejeitou” é claro, atual e preserva a ideia de repúdio deliberado.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nome próprio que aqui personifica a nação como uma entidade singular.
- source_word: טוֹב
  choice: o bem
  rationale: O adjetivo substantivado admite a tradução direta “o bem”, preservando seu sentido amplo sem especificar indevidamente um objeto concreto.
- source_word: אוֹיֵב
  choice: um inimigo
  rationale: O substantivo singular sem artigo pode ser entendido genericamente; “um inimigo” evita identificar além do que o hebraico afirma.
- source_word: יִרְדְּפוֹ
  choice: o perseguirá
  rationale: O imperfeito exprime naturalmente a consequência futura no contexto profético, e o sufixo masculino singular retoma Israel personificado.
theological_decisions:
- issue: Referente e número do sufixo pronominal em יִרְדְּפוֹ
  choice: “o perseguirá”, mantendo Israel como nação personificada no singular masculino
  alternative: “os perseguirá”, tratando Israel coletivamente como o povo
  rationale: O hebraico traz um sufixo de terceira pessoa masculina singular. A tradução conserva essa forma e a personificação profética, sem suavizá-la para o plural coletivo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação concisa acompanha a estrutura enfática do hebraico e mantém a personificação singular de Israel.
