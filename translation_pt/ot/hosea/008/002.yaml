source:
  edition: WLC
  text: לִ֖/י יִזְעָ֑קוּ אֱלֹהַ֥/י יְֽדַעֲנ֖וּ/ךָ יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/002.yaml
  text: To me they cry[a], ‘My God[b], we—Israel—know you!’
translation:
  language: pt
  text: 'A mim clamam[a]: “Meu Deus, nós, Israel, te conhecemos[b]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “gritam por socorro”. O verbo hebraico pode indicar um clamor urgente em busca de ajuda.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “conhecer” pode ter o sentido relacional de reconhecer uma ligação de aliança, e não apenas possuir conhecimento intelectual.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִי
  choice: A mim
  rationale: 'A preposição לְ com o sufixo da primeira pessoa singular indica aqui a direção do clamor: ele é dirigido a Deus. “A mim” preserva a ênfase inicial do hebraico.'
- source_word: יִזְעָקוּ
  choice: clamam
  rationale: O verbo זעק costuma designar um grito intenso, muitas vezes motivado por aflição ou pedido de socorro. “Clamam” é natural, digno e mantém essa possível urgência.
- source_word: אֱלֹהַי
  choice: Meu Deus
  rationale: O substantivo com sufixo da primeira pessoa singular funciona como apelo direto. “Meu Deus” reproduz essa invocação sem acrescentar uma interjeição ausente no hebraico.
- source_word: יְדַעֲנוּךָ
  choice: te conhecemos
  rationale: ידע significa “conhecer” e, neste contexto, pode incluir conhecimento relacional e pactual. A tradução direta preserva tanto o sentido básico quanto essa ressonância, sem explicá-la em excesso.
- source_word: יִשְׂרָאֵל
  choice: nós, Israel,
  rationale: “Israel” identifica enfaticamente os falantes depois do verbo na primeira pessoa do plural. A aposição “nós, Israel,” conserva a autodeclaração abrupta do hebraico e evita tratar Israel como destinatário.
theological_decisions:
- issue: Sentido de “conhecer” no contexto da aliança
  choice: Manter “te conhecemos” no texto principal.
  alternative: “Nós te reconhecemos” ou “temos aliança contigo”.
  rationale: Em Oseias, “conhecer” pode ter peso relacional, pactual e ético, mas o verbo continua significando “conhecer”. Tornar essas implicações explícitas resolveria em excesso a tensão entre a afirmação de Israel e sua conduta denunciada no contexto.
- issue: Representação da fala de Israel
  choice: Apresentar a sequência como discurso direto dirigido a Deus, com “Israel” em aposição a “nós”.
  alternative: Entender “Israel” como vocativo separado ou reformular a frase como discurso indireto.
  rationale: A ordem hebraica favorece um clamor dirigido a Deus no qual os falantes se identificam enfaticamente como Israel. A pontuação proposta preserva essa força retórica sem eliminar a construção abrupta.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem inicial “A mim” conserva a ênfase do hebraico; “clamam” mantém o tom solene sem soar arcaico. A aposição entre vírgulas preserva a autodefinição enfática de Israel.
