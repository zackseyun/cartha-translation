  text: כִּֽי הֵ֨מָּה֙ עָל֣וּ אַשּׁ֔וּר פֶּ֖רֶא בּוֹדֵ֣ד ל֑/וֹ אֶפְרַ֖יִם הִתְנ֥וּ אֲהָבִֽים־
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/009.yaml
  text: For they have gone up to Assyria[a], like a wild donkey wandering alone[b]; Ephraim has hired lovers.
translation:
  language: pt
  text: Pois eles subiram à Assíria, como um jumento selvagem que vive sozinho.[a] Efraim contratou amantes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico também pode ser traduzido: “um jumento selvagem solitário” ou “um jumento selvagem por si só”.'
    reason: lexical_alternative
  - marker: b
    text: “Amantes” preserva a metáfora de Oseias para a infidelidade à aliança; no plano político, refere-se a aliados estrangeiros obtidos mediante pagamento.
    reason: metaphor_clarification
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento da acusação anterior e mantém a ligação causal em português natural.
- source_word: הֵמָּה
  choice: eles
  rationale: Conserva o pronome explícito do hebraico sem acrescentar uma ênfase artificial como “eles mesmos”.
- source_word: עָלוּ
  choice: subiram
  rationale: Preserva o sentido concreto de “subir”, expressão hebraica empregada aqui para a viagem à Assíria.
- source_word: אַשּׁוּר
  choice: Assíria
  rationale: Usa a forma portuguesa consagrada do nome da nação.
- source_word: פֶּרֶא
  choice: jumento selvagem
  rationale: Designa o equídeo selvagem e mantém a imagem animal em linguagem atual e clara.
- source_word: בּוֹדֵד לוֹ
  choice: que vive sozinho
  rationale: Expressa de modo idiomático o isolamento enfatizado pela combinação do particípio com o pronome; evita inserir no texto a ideia mais específica de vaguear, que não está lexicalmente explícita.
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Emprega a forma portuguesa tradicional do nome tribal e nacional.
- source_word: הִתְנוּ
  choice: contratou
  rationale: O verbo indica obter mediante pagamento. O singular português concorda naturalmente com o nome coletivo “Efraim”, embora o hebraico apresente verbo plural.
- source_word: אֲהָבִים
  choice: amantes
  rationale: Mantém a metáfora conjugal e sexual recorrente em Oseias, sem substituí-la interpretativamente por “aliados”.
theological_decisions:
- issue: Descrição metafórica das alianças estrangeiras
  choice: Efraim contratou amantes
  alternative: Efraim pagou por aliados
  rationale: A formulação conserva a imagem profética da infidelidade à aliança, ao mesmo tempo que a nota esclarece seu referente político sem apagá-la.
- issue: Relação sintática da imagem do jumento selvagem com a ida à Assíria
  choice: como um jumento selvagem que vive sozinho
  alternative: um jumento selvagem solitário
  rationale: O hebraico apresenta a imagem por justaposição e permite mais de uma forma de relacioná-la à oração anterior. “Como” torna a comparação inteligível em português, enquanto a nota preserva a construção mais direta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe é direta; as notas preservam a ambiguidade da comparação e explicam, sem substituir, a metáfora profética.
