  text: Though I wrote for him the many things of my law[a], they were regarded as something foreign.
translation:
  language: pt
  text: Embora eu tenha escrito para ele as muitas coisas da minha lei[a], elas foram consideradas como algo alheio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Ainda que eu escrevesse para ele miríades da minha instrução/Torá, elas seriam consideradas como algo alheio». O verbo hebraico inicial pode ser entendido como imperfectivo, e «minha lei» também pode ser traduzido por «minha instrução» ou «minha Torá».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אכתוב
  choice: Embora eu tenha escrito
  rationale: O imperfeito qal na primeira pessoa do singular pode, neste contexto, referir-se retoricamente à instrução já concedida. A construção concessiva explicita o contraste com a rejeição descrita na segunda oração, sem eliminar as alternativas aspectuais registradas na nota.
- source_word: לוֹ
  choice: para ele
  rationale: Preserva o pronome masculino singular hebraico e o valor benefactivo da preposição, tendo Israel/Efraim como referente coletivo no contexto.
- source_word: רבו
  choice: as muitas coisas
  rationale: Expressa a ideia de grande quantidade sem impor a leitura numérica mais específica «miríades», cuja possibilidade é preservada na nota.
- source_word: תּוֹרָתִי
  choice: minha lei
  rationale: Mantém a força pactual reconhecível de torá em contexto profético; «minha instrução» e «minha Torá» continuam sendo alternativas lexicais legítimas e aparecem na nota.
- source_word: כְּמוֹ זָר
  choice: algo estranho
  rationale: Transmite a comparação e a ideia de algo tratado como alheio, não pertencente ao povo. «Estranho» é natural em português e conserva certa amplitude entre o que é estrangeiro e o que é percebido como não familiar.
- source_word: נֶחְשָׁבוּ
  choice: foram consideradas
  rationale: Reproduz o valor passivo do nifal e a noção de avaliação ou atribuição de condição.
theological_decisions:
- issue: Referente do pronome singular לוֹ
  choice: Israel/Efraim entendido coletivamente, com o singular preservado em «ele»
  alternative: Referência individual sem explicitação da dimensão coletiva
  rationale: Oseias frequentemente trata a nação como uma pessoa no singular. A tradução conserva a gramática hebraica sem inserir o nome do referente no versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação preserva o singular coletivo e registra em nota as ambiguidades de aspecto verbal, quantidade e sentido de תּוֹרָה.
