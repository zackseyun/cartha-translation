base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/010.yaml
  text: Even though they hire among the nations[a], now I will gather them[c][b]; and they will begin to diminish under the burden of the king of princes.
translation:
  language: pt
  text: Ainda que contratem entre as nações[a], agora eu os reunirei; e começarão a diminuir[b] sob o peso do rei dos príncipes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ainda que deem entre as nações”. No contexto, o hebraico provavelmente se refere a pagar ou contratar aliados estrangeiros.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico de “começarão a diminuir” é difícil. Outras possibilidades incluem: “se contorcerão um pouco” ou “tornar-se-ão poucos por causa do peso, ou tributo”.'
    reason: alternative_reading
  - marker: c
    text: “O peso do rei dos príncipes” pode se referir ao tributo opressivo imposto por um soberano imperial.
    reason: cultural_note
lexical_decisions:
- source_word: יִתְנוּ בַגּוֹיִם
  choice: contratem entre as nações
  rationale: Embora נתן normalmente signifique “dar”, o contexto de Oseias 8:9–10 sugere pagamentos para obter apoio estrangeiro. “Contratem” expressa essa provável ideia sem especificar em excesso o objeto da contratação; a alternativa literal é preservada em nota.
- source_word: עַתָּה
  choice: agora
  rationale: Advérbio temporal direto, que assinala a resposta divina iminente.
- source_word: אֲקַבְּצֵם
  choice: eu os reunirei
  rationale: קבץ significa reunir ou ajuntar. A formulação permanece semanticamente neutra, embora o contexto indique reunião para juízo, não necessariamente restauração.
- source_word: וַיָּחֵלּוּ מְּעָט
  choice: começarão a diminuir
  rationale: A expressão hebraica é difícil. Esta leitura entende o verbo no sentido de “começar” e מעט como redução ou diminuição, produzindo português natural sem ocultar as alternativas, registradas em nota.
- source_word: מִמַּשָּׂא
  choice: sob o peso
  rationale: מַשָּׂא pode indicar carga, peso ou tributo imposto. “Sob o peso” conserva a imagem ampla de opressão e permite que o tributo seja entendido como sua possível forma concreta.
- source_word: מֶלֶךְ שָׂרִים
  choice: rei dos príncipes
  rationale: Mantém a cadeia construta hebraica e sua concisão, provavelmente designando um soberano imperial acima de governantes ou oficiais subordinados.
theological_decisions:
- issue: Se אֲקַבְּצֵם indica restauração ou reunião para juízo
  choice: Manter “eu os reunirei”, deixando que o contexto sugira juízo
  alternative: Explicitar “eu os reunirei para o juízo” ou entender como reunião restauradora
  rationale: O contexto imediato favorece uma reunião ligada ao juízo decorrente das alianças estrangeiras, mas o verbo em si não explicita a finalidade. A tradução preserva essa tensão sem acrescentar uma interpretação à linha principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem dos marcadores foi normalizada para que cada nota acompanhe diretamente a expressão que explica.
