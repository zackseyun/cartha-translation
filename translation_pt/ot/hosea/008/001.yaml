reference: Hosea 8:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֶל חִכְּ/ךָ֣ שֹׁפָ֔ר כַּ/נֶּ֖שֶׁר עַל בֵּ֣ית יְהוָ֑ה יַ֚עַן עָבְר֣וּ בְרִיתִ֔/י וְ/עַל תּוֹרָתִ֖/י פָּשָֽׁעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/001.yaml
  text: Put the trumpet to your mouth! Like an eagle over the house of Yahweh[c][b][a], because they have transgressed my covenant and rebelled against my law.
translation:
  language: pt
  text: Ponha a trombeta à boca! Como uma águia[a] sobre a casa de Yahweh, pois eles violaram a minha aliança[b] e se rebelaram contra a minha lei.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como um abutre”. O hebraico נֶשֶׁר pode designar de modo mais amplo uma grande ave de rapina.
    reason: lexical_alternative
  - marker: b
    text: Também se pode traduzir “quebraram a minha aliança” ou “transgrediram a minha aliança”. Literalmente, o hebraico diz “passaram pela minha aliança”.
    reason: lexical_alternative
  - marker: c
    text: Ou “minha instrução” ou “meu ensino”. O hebraico תּוֹרָה pode ter esses sentidos, além de “lei”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל חִכְּךָ שֹׁפָר
  choice: Leve a trombeta à boca!
  rationale: 'A expressão hebraica é abrupta e não contém verbo expresso: literalmente, “à tua boca, trombeta”. A formulação portuguesa conserva a imagem concreta e comunica naturalmente a ordem de soar o alarme.'
- source_word: כַּנֶּשֶׁר
  choice: como uma águia
  rationale: נֶשֶׁר designa uma grande ave de rapina e pode ser entendido como águia ou abutre. “Águia” preserva a imagem tradicional de rapidez e ameaça; a alternativa zoológica fica registrada em nota.
- source_word: עַל בֵּית יְהוָה
  choice: sobre a casa de Yahweh
  rationale: “Sobre” mantém o valor espacial de עַל e a imagem ameaçadora da ave pairando ou investindo, sem substituir a metáfora por uma explicação.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: A tradução literal preserva a possível referência ao santuário, à terra ou ao povo da aliança, evitando restringir indevidamente o sentido.
- source_word: יַעַן
  choice: pois
  rationale: Introduz com naturalidade, em português, a razão do juízo anunciado.
- source_word: עָבְרוּ בְרִיתִי
  choice: violaram a minha aliança
  rationale: Embora עָבְרוּ signifique literalmente “atravessaram/passaram”, com בְּרִית expressa idiomaticamente a transgressão da aliança. “Violaram” é claro e natural, sem enfraquecer a gravidade do ato.
- source_word: תּוֹרָתִי
  choice: a minha lei
  rationale: תּוֹרָה pode significar lei, instrução ou ensino. No paralelismo de acusação pactual, “lei” expressa bem a força normativa, enquanto a alternativa é preservada em nota.
- source_word: פָּשָׁעוּ
  choice: se rebelaram contra
  rationale: פָּשַׁע indica rebelião ou transgressão deliberada, não simples erro. A expressão portuguesa mantém sua força relacional e pactual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico, preservando-o como nome pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Referente de “a casa de Yahweh”
  choice: Manter a expressão literal sem definir o referente
  alternative: “o templo de Yahweh” ou “o povo de Yahweh”
  rationale: O contexto profético pode evocar o santuário, a terra ou a comunidade da aliança. A expressão literal conserva essa tensão interpretativa.
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: A transliteração preserva no texto o nome pactual presente no hebraico.
- issue: Relação entre aliança e lei
  choice: Conservar as duas acusações paralelas
  alternative: Fundir ambas numa acusação geral de desobediência
  rationale: O hebraico distingue a violação da aliança da rebelião contra a Torá; manter ambas preserva a estrutura e a força teológica do verso.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A abertura abrupta e urgente do hebraico foi preservada por uma exclamação. Mantiveram-se “casa de Yahweh” e a metáfora da ave para não resolver ambiguidades do original.
