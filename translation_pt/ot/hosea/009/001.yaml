  text: אַל תִּשְׂמַ֨ח יִשְׂרָאֵ֤ל אֶל גִּיל֙ כָּֽ/עַמִּ֔ים כִּ֥י זָנִ֖יתָ מֵ/עַ֣ל אֱלֹהֶ֑י/ךָ אָהַ֣בְתָּ אֶתְנָ֔ן עַ֖ל כָּל גָּרְנ֥וֹת דָּגָֽן־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/001.yaml
  text: Do not rejoice[a], Israel, with exultation like the peoples, for you have played the prostitute away from your God[b]; you have loved a prostitute’s payment on every threshing floor of grain.
translation:
  language: pt
  text: Não se alegre[a], Israel, exultando como os povos, pois você se prostituiu, afastando-se do seu Deus; você amou o pagamento de uma prostituta[b] em todas as eiras de cereal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não exulte como as nações”. A frase hebraica é compacta e admite mais de uma formulação natural em português.'
    reason: lexical_alternative
  - marker: b
    text: “Pagamento de uma prostituta” é a remuneração associada à prostituição; aqui, a expressão representa metaforicamente os ganhos idólatras de Israel.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּשְׂמַח
  choice: Não se alegre
  rationale: אַל com o imperfeito expressa proibição. “Alegrar-se” comunica naturalmente שׂמח e mantém o tom profético.
- source_word: אֶל גִּיל כָּעַמִּים
  choice: exultando como os povos
  rationale: A expressão hebraica é compacta e sintaticamente difícil. A forma adverbial liga a exultação à proibição sem apagar a comparação com os demais povos.
- source_word: זָנִיתָ מֵעַל אֱלֹהֶיךָ
  choice: você se prostituiu, afastando-se do seu Deus
  rationale: “Se prostituiu” preserva a metáfora sexual deliberada de Oseias, enquanto “afastando-se do seu Deus” expressa o movimento de abandono indicado por מֵעַל sem reduzir a frase à ideia abstrata de infidelidade.
- source_word: אֶתְנָן
  choice: pagamento de prostituta
  rationale: O termo designa concretamente a remuneração dada a uma prostituta. A formulação é atual, clara e conserva a imagem profética.
- source_word: עַל כָּל גָּרְנוֹת דָּגָן
  choice: em toda eira onde se debulha o cereal
  rationale: A expressão torna natural em português a referência às eiras de cereal, preservando tanto o local agrícola quanto דָּגָן, sem restringi-lo indevidamente a trigo.
theological_decisions:
- issue: Metáfora sexual profética para idolatria e apostasia
  choice: Manter “você se prostituiu” no texto principal
  alternative: Traduzir de modo abstrato como “você foi infiel”
  rationale: A imagem da prostituição é constitutiva da acusação teológica de Oseias e relaciona apostasia e infidelidade de aliança. A tradução não deve suavizá-la.
- issue: Sentido do pagamento recebido nas eiras
  choice: Conservar a imagem concreta de “pagamento de prostituta”
  alternative: Explicitar no texto principal como ganhos provenientes da idolatria ou dos cultos de fertilidade
  rationale: O hebraico emprega a metáfora sem explicá-la por completo. A tradução preserva essa tensão e deixa a contextualização para a nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” para refletir o singular dirigido a Israel, preserva a metáfora contundente de Oseias e evita vocabulário arcaico. A formulação da eira foi levemente descompactada para soar natural sem perder os elementos do hebraico.
