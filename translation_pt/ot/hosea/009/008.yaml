id: HOS.9.8
reference: Hosea 9:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: צֹפֶ֥ה אֶפְרַ֖יִם עִם אֱלֹהָ֑/י נָבִ֞יא פַּ֤ח יָקוֹשׁ֙ עַל כָּל דְּרָכָ֔י/ו מַשְׂטֵמָ֖ה בְּ/בֵ֥ית אֱלֹהָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/008.yaml
  text: Ephraim’s watchman is with my God[a]; the prophet is a fowler’s snare on all his ways[b], and hostility is in the house of his God.
translation:
  language: pt
  text: O vigia de Efraim está com o meu Deus[a]; o profeta é um laço de caçador de aves em todos os seus caminhos, e há hostilidade[b] na casa do seu Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Efraim é um vigia junto ao meu Deus; o profeta é um laço de caçador de aves em todos os seus caminhos”. A sintaxe hebraica é difícil, e alguns entendem a primeira oração de maneira mais positiva antes de o versículo passar à acusação.'
    reason: alternative_reading
  - marker: b
    text: O termo hebraico também pode ser traduzido como “ódio” ou “inimizade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹפֶה
  choice: vigia
  rationale: O particípio de צפה designa alguém que observa ou mantém vigilância. “Vigia” é natural em português e preserva a imagem profética do sentinela.
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Forma tradicional e amplamente reconhecida do nome tribal e nacional.
- source_word: עִם אֱלֹהָי
  choice: com o meu Deus
  rationale: עִם normalmente significa “com”, e o sufixo de primeira pessoa em אֱלֹהָי é preservado por “meu Deus”, sem harmonizar a mudança posterior de pronome.
- source_word: נָבִיא
  choice: o profeta
  rationale: O singular é entendido representativamente e identifica a figura profética ligada a Efraim no contexto da acusação.
- source_word: פַּח יָקוֹשׁ
  choice: um laço de caçador de aves
  rationale: A expressão reúne termos ligados à captura de aves. Esta formulação conserva a imagem concreta e é compreensível em português atual.
- source_word: עַל כָּל דְּרָכָיו
  choice: em todos os seus caminhos
  rationale: Preserva a amplitude metafórica de “caminhos”, que pode abranger percurso, conduta e modo de vida, bem como o sufixo masculino singular.
- source_word: מַשְׂטֵמָה
  choice: hostilidade
  rationale: O substantivo expressa inimizade, ódio ou oposição ativa. “Hostilidade” mantém essa amplitude sem restringir o sentido a um sentimento interior.
- source_word: בְּבֵית אֱלֹהָיו
  choice: na casa do seu Deus
  rationale: Mantém literalmente “casa”, sem explicitar “templo”, e conserva o sufixo de terceira pessoa, importante para a tensão pronominal do texto.
theological_decisions:
- issue: Perspectiva do locutor em “meu Deus” e “seu Deus”
  choice: 'Preservar o contraste pronominal: “com o meu Deus” e “na casa do seu Deus”.'
  alternative: Uniformizar as duas expressões como referências a Deus sem mudança de perspectiva.
  rationale: O texto massorético apresenta uma mudança marcante de pronomes. Mantê-la respeita a forma hebraica e não elimina uma possível indicação de alienação entre o profeta e o sistema religioso de Efraim.
- issue: Identidade e avaliação do “profeta”
  choice: Entender o profeta associado a Efraim de modo negativo no contexto imediato.
  alternative: Entender a primeira oração positivamente, como referência a Efraim ou a um profeta que exerce a função de vigia junto a Deus, antes de a acusação começar.
  rationale: O contexto próximo é de denúncia, o que favorece a leitura negativa; contudo, a sintaxe hebraica é difícil, por isso a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construções naturais para leitores brasileiros. A imagem hebraica do vigia, do laço e dos caminhos foi mantida, assim como a difícil mudança entre “meu Deus” e “seu Deus”.
