  text: הֶעְמִֽיקוּ שִׁחֵ֖תוּ כִּ/ימֵ֣י הַ/גִּבְעָ֑ה יִזְכּ֣וֹר עֲוֺנָ֔/ם יִפְק֖וֹד חַטֹּאותָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/009.yaml
  text: They have gone deep into corruption[a], as in the days of Gibeah; he will remember their iniquity[b]; he will punish their sins.
translation:
  language: pt
  text: Eles se aprofundaram na corrupção[b], como nos dias de Gibeá[a]; ele se lembrará da iniquidade deles e os castigará por seus pecados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gibeá remete ao infame ultraje ocorrido ali, narrado em Juízes 19–21, que aqui serve de comparação para a corrupção de Israel.
    reason: cross_reference
  - marker: b
    text: 'Ou, mais literalmente: “Eles foram fundo; corromperam-se”. O hebraico é conciso e idiomático.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעְמִיקוּ שִׁחֵתוּ
  choice: se aprofundaram na corrupção
  rationale: A combinação verbal é concisa e idiomática. A tradução conserva a imagem de profundidade de עמק e o sentido de corrupção ou ruína de שׁחת, sem reduzir os dois verbos a um simples advérbio intensificador.
- source_word: כִּימֵי הַגִּבְעָה
  choice: como nos dias de Gibeá
  rationale: A preposição כ marca comparação, e a expressão remete naturalmente ao episódio histórico de Gibeá.
- source_word: יִזְכּוֹר עֲוֺנָם
  choice: ele se lembrará da iniquidade deles
  rationale: O imperfeito hebraico foi traduzido no futuro, em paralelo com o verbo seguinte. 'Iniquidade' preserva o sentido moral de עָוֹן, sem confundi-lo com a punição.
- source_word: יִפְקֹד חַטֹּאותָם
  choice: castigará os seus pecados
  rationale: Em contexto de juízo, פקד indica cobrar contas ou visitar com punição; 'castigará' comunica esse sentido com clareza. חַטֹּאות refere-se aqui a pecados, não a ofertas pelo pecado.
theological_decisions:
- issue: Sujeito implícito dos verbos de juízo
  choice: manter o pronome 'ele' sem nomear nem capitalizar o sujeito
  alternative: explicitar 'Deus' como sujeito
  rationale: Os verbos hebraicos estão na terceira pessoa masculina singular, sem sujeito expresso. O contexto aponta para Deus, mas manter 'ele' preserva a forma e a discreta implicitude do original.
- issue: Relação entre lembrar a iniquidade e castigar os pecados
  choice: preservar as duas afirmações paralelas
  alternative: fundir ambas em uma única declaração de punição
  rationale: O paralelismo hebraico distingue o ato de lembrar a iniquidade do ato de castigar os pecados; a tradução mantém essa tensão e progressão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. 'Aprofundaram-se na corrupção' mantém a metáfora do hebraico em formulação natural; a minúscula em 'ele' evita acrescentar ao texto uma identificação gráfica que o original não explicita.
