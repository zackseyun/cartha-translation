  text: אֶפְרַ֛יִם כַּ/אֲשֶׁר רָאִ֥יתִי לְ/צ֖וֹר שְׁתוּלָ֣ה בְ/נָוֶ֑ה וְ/אֶפְרַ֕יִם לְ/הוֹצִ֥יא אֶל הֹרֵ֖ג בָּנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/013.yaml
  text: Ephraim[a], as I have seen, is planted in a pleasant pasture like Tyre[c][b]; but Ephraim must bring out his children to the killer.
translation:
  language: pt
  text: Efraim, tal como o vi, está plantado como Tiro numa pastagem agradável[a]; mas Efraim terá de levar seus filhos[b] ao que mata[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Como vi, Efraim estava plantado como Tiro num lugar agradável”. A sintaxe hebraica da comparação é condensada, e “pastagem” também pode significar “morada” ou “lugar agradável”.'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “seus filhos”; o termo também pode referir-se coletivamente à descendência.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “ao que mata”; também se pode traduzir “ao matador” ou, em sentido contextual, “ao massacre”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Mantém a forma tradicional e amplamente reconhecida em português para o nome da tribo e do reino do norte.
- source_word: כַּאֲשֶׁר רָאִיתִי
  choice: pelo que vi
  rationale: Preserva explicitamente a observação em primeira pessoa e soa natural no contexto de uma avaliação profética.
- source_word: לְצוֹר
  choice: como Tiro
  rationale: Entende o לְ em sentido comparativo, leitura que produz uma comparação coerente, sem ocultar na nota a sintaxe hebraica condensada.
- source_word: שְׁתוּלָה
  choice: está plantado
  rationale: Conserva a metáfora hortícola do particípio passivo. A concordância portuguesa segue 'Efraim'; a forma hebraica é feminina e integra a dificuldade sintática registrada na nota.
- source_word: בְנָוֶה
  choice: numa pastagem agradável
  rationale: נָוֶה pode indicar pastagem, morada ou lugar aprazível. 'Pastagem agradável' conserva tanto o cenário favorável quanto a imagem rural associada a 'plantado'.
- source_word: וְאֶפְרַיִם
  choice: mas Efraim
  rationale: Embora וְ seja formalmente aditivo, aqui introduz um contraste abrupto entre a situação favorável e o destino trágico.
- source_word: לְהוֹצִיא
  choice: terá de levar
  rationale: Expressa a ação destinada ou inevitável indicada pelo infinitivo com לְ, sem transformá-la numa ordem explícita.
- source_word: אֶל הֹרֵג
  choice: àquele que mata
  rationale: Reproduz o agente pessoal expresso pelo particípio ativo הֹרֵג e evita que 'matador' seja entendido no sentido taurino corrente em parte do mundo lusófono.
- source_word: בָּנָיו
  choice: seus filhos
  rationale: Mantém de perto o sentido formal de 'seus filhos/seus descendentes'; no contexto, o termo pode abranger coletivamente os filhos de Efraim.
theological_decisions:
- issue: Preservar a imagem de plantio ou substituí-la por uma afirmação geral de prosperidade
  choice: Manter Efraim como plantado numa pastagem agradável
  alternative: Efraim florescia como Tiro
  rationale: A metáfora concreta sustenta o contraste entre estabilidade aparente e perda dos filhos; traduzi-la por uma explicação abstrata reduziria a tensão do texto.
- issue: Definir de modo inequívoco a sintaxe da comparação com Tiro
  choice: Adotar 'plantado como Tiro' no texto e registrar a construção alternativa em nota
  alternative: Como vi, Efraim estava plantado para Tiro num lugar agradável
  rationale: A sintaxe hebraica é genuinamente condensada. A leitura comparativa é contextual e legível, mas a nota evita apresentar como indiscutível uma construção que permanece difícil.
- issue: Interpretar בָּנָיו como filhos do sexo masculino ou descendência coletiva
  choice: seus filhos
  alternative: suas crianças / seus descendentes
  rationale: '''Filhos'' corresponde formalmente ao hebraico e pode funcionar coletivamente em português, sem excluir que o termo hebraico designe especificamente filhos homens.'
translation_notes:
  register: Português moderno, digno e de ampla compreensão internacional, com leitura natural no Brasil. A formulação conserva a metáfora agrícola, o contraste abrupto e a agência pessoal do particípio hebraico, enquanto as notas registram a ambiguidade sintática e lexical sem resolvê-la silenciosamente.
