  to: Efraim, tal como o vi, está plantado como Tiro numa pastagem agradável[a]; mas Efraim terá de levar seus filhos[b] ao que mata[c].
  rationale: A revisão substitui a locução inferencial «pelo que vi» por «tal como o vi», que comunica melhor a observação comparativa condensada do hebraico. Também simplifica «àquele que mata» para «ao que mata», preservando a referência a um agente pessoal. As notas mantêm a ambiguidade sintática e lexical pertinente, e todos os marcadores permanecem ancorados no texto.
