  text: תֵּן לָ/הֶ֥ם יְהוָ֖ה מַה תִּתֵּ֑ן תֵּן לָ/הֶם֙ רֶ֣חֶם מַשְׁכִּ֔יל וְ/שָׁדַ֖יִם צֹמְקִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/014.yaml
  text: Give them[a], O Yahweh—what will you give? Give them a miscarrying womb and dry breasts.
translation:
  language: pt
  text: Dá-lhes, ó Yahweh — que lhes darás? Dá-lhes um ventre que prive de filhos[a] e seios ressequidos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um ventre que cause abortos espontâneos”. O particípio hebraico pode indicar causar a perda de filhos ou privar de filhos; no contexto, pode incluir a perda da gestação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּן
  choice: Dá
  rationale: O imperativo de נתן dirige-se diretamente a Deus. “Dá” é simples e enfático e preserva o tom de súplica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מַה תִּתֵּן
  choice: que lhes darás?
  rationale: O interrogativo com o imperfeito forma uma pergunta retórica e expressa a hesitação angustiada do profeta antes de formular o pedido.
- source_word: רֶחֶם
  choice: ventre
  rationale: “Ventre” é uma forma natural e digna de expressar o órgão materno e preserva a imagem concreta de fecundidade.
- source_word: מַשְׁכִּיל
  choice: que aborte
  rationale: O particípio causativo de שכל, ligado a “ventre”, indica perda dos filhos; no contexto reprodutivo, “que aborte” comunica de modo claro a ideia de uma gestação que não chega ao nascimento.
- source_word: שָׁדַיִם
  choice: seios
  rationale: Reproduz diretamente o termo corporal e conserva a força concreta da imagem.
- source_word: צֹמְקִים
  choice: ressequidos
  rationale: Expressa seios mirrados e sem leite, preservando tanto a privação de alimento quanto a intensidade da imagem hebraica.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: O texto traz o nome pessoal divino. “Yahweh” o preserva como nome, sem substituí-lo pelo título “SENHOR”.
- issue: Sentido de מַשְׁכִּיל aplicado ao ventre
  choice: um ventre que aborte
  alternative: um ventre que prive de filhos
  rationale: O contexto imediato de fecundidade e amamentação favorece a referência ao aborto, mas a nota conserva o sentido lexical mais amplo de causar a perda de filhos.
translation_notes:
  register: Português atual, digno e direto, com sintaxe natural tanto no Brasil quanto em outros contextos lusófonos. A repetição de “Dá-lhes” e a pergunta abrupta foram mantidas para preservar a intensidade retórica do hebraico.
