source:
  edition: WLC
  text: אֶפְרַ֕יִם כָּ/ע֖וֹף יִתְעוֹפֵ֣ף כְּבוֹדָ֑/ם מִ/לֵּדָ֥ה וּ/מִ/בֶּ֖טֶן וּ/מֵ/הֵרָיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/011.yaml
  text: Ephraim—their glory will fly away like a bird—from birth[a], from the womb[b], and from conception.
translation:
  language: pt
  text: Efraim — sua glória voará para longe como uma ave — não haverá nascimento, nem gestação, nem concepção.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «do nascimento, do ventre e da concepção/gravidez» — expressão tríplice que descreve a perda de filhos em todas as etapas. «Glória» também pode significar «honra» ou «esplendor»; neste contexto, provavelmente se refere sobretudo aos descendentes e à fecundidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Forma tradicional portuguesa do nome próprio, que aqui personifica a tribo e o reino do norte.
- source_word: כָּעוֹף
  choice: como uma ave
  rationale: O prefixo כ marca comparação; «ave» expressa de modo natural o sentido contextual de עוֹף.
- source_word: יִתְעוֹפֵף
  choice: voará para longe
  rationale: O verbo descreve algo que parte voando e desaparece; a formulação comunica tanto o movimento quanto a perda.
- source_word: כְּבוֹדָם
  choice: sua glória
  rationale: Preserva a metáfora hebraica e sua possível amplitude — glória, honra ou esplendor — enquanto o contexto a associa especialmente aos filhos e à fecundidade.
- source_word: מִלֵּדָה
  choice: não haverá nascimento
  rationale: 'O מן tem força privativa no contexto: a glória desaparece de modo que não reste nascimento. Esta formulação evita o português pouco natural «desde o nascimento» ou «para longe do nascimento».'
- source_word: וּמִבֶּטֶן
  choice: nem gestação
  rationale: בֶּטֶן designa literalmente o ventre; na sequência reprodutiva, «gestação» explicita com naturalidade a etapa representada pelo ventre sem sugerir filhos já nascidos.
- source_word: וּמֵהֵרָיוֹן
  choice: nem concepção
  rationale: הֵרָיוֹן pode indicar concepção ou gravidez; «concepção» preserva o movimento retrospectivo da sequência, do nascimento até seu início.
theological_decisions:
- issue: Referente de «sua glória»
  choice: Manter «glória» como metáfora no texto principal, deixando o contexto associá-la aos descendentes, à fecundidade e à vitalidade nacional.
  alternative: Traduzir diretamente como «seus filhos», «sua fecundidade» ou entender de modo mais amplo como riqueza e honra nacional.
  rationale: O contexto favorece fortemente filhos e fecundidade, mas o versículo não define expressamente a metáfora; mantê-la evita restringir indevidamente seu alcance.
- issue: Força das três expressões introduzidas por מִן
  choice: Expressar privação em todas as etapas — nascimento, gestação e concepção — mantendo a ordem retrospectiva do hebraico.
  alternative: Reproduzir literalmente «do nascimento, do ventre e da concepção», deixando implícita a relação privativa.
  rationale: Em português, a reprodução puramente formal seria obscura. «Não haverá... nem...» comunica a perda total pretendida, sem transformar a tríade em uma cronologia direta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção privativa torna explícito em português o sentido contextual das preposições hebraicas, enquanto o travessão preserva o impacto poético da imagem inicial.
