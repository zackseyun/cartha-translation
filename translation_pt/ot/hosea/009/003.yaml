id: HOS.9.3
reference: Hosea 9:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לֹ֥א יֵשְׁב֖וּ בְּ/אֶ֣רֶץ יְהוָ֑ה וְ/שָׁ֤ב אֶפְרַ֨יִם֙ מִצְרַ֔יִם וּ/בְ/אַשּׁ֖וּר טָמֵ֥א יֹאכֵֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/003.yaml
  text: They will not remain in the land of Yahweh[a]; Ephraim will return to Egypt[c][b], and in Assyria they will eat unclean food.
translation:
  language: pt
  text: Não permanecerão na terra de Yahweh[a]; Efraim voltará ao Egito[b] e, na Assíria, comerão alimento impuro[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não habitarão na terra de Yahweh”.'
    reason: lexical_alternative
  - marker: b
    text: “Egito” pode ser entendido literalmente ou como imagem tipológica de nova escravidão e exílio; o hebraico mantém essa tensão ao mencionar também a Assíria.
    reason: alternative_reading
  - marker: c
    text: 'Ou: “comerão o que é impuro”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשְׁבוּ
  choice: permanecerão
  rationale: Embora יָשַׁב frequentemente signifique “habitar” ou “viver”, a negação neste contexto de juízo ressalta que eles não continuarão na terra; “permanecerão” comunica naturalmente a expulsão iminente.
- source_word: בְּאֶרֶץ יְהוָה
  choice: na terra de Yahweh
  rationale: Preserva a ideia de que a terra pertence a Yahweh e mantém a força pactual da expressão hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Representa diretamente o nome divino no texto hebraico, em linguagem clara e reconhecível.
- source_word: וְשָׁב
  choice: voltará
  rationale: O verbo שׁוּב indica retorno; no discurso profético, a forma descreve aqui uma ação futura.
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Mantém o nome empregado no hebraico, que neste contexto representa o reino do norte, sem substituí-lo pela interpretação “Israel”.
- source_word: מִצְרַיִם
  choice: Egito
  rationale: Conserva o topônimo explícito e permite que permaneça aberta sua possível ressonância histórica e tipológica.
- source_word: וּבְאַשּׁוּר
  choice: e, na Assíria
  rationale: O waw foi traduzido pela coordenação simples “e”, sem impor contraste não explicitado; as vírgulas tornam natural a locução intercalada em português.
- source_word: טָמֵא
  choice: alimento impuro
  rationale: O adjetivo funciona substantivamente como objeto de “comer”. A explicitação de “alimento” produz português natural e conserva o sentido ritual e pactual de impureza.
- source_word: יֹאכֵלוּ
  choice: comerão
  rationale: Tradução futura direta, preservando a mudança do singular coletivo “Efraim voltará” para o plural referente ao povo.
theological_decisions:
- issue: Se “Egito” deve ser entendido literalmente ou como imagem de nova escravidão e exílio
  choice: Manter “Egito” no texto principal sem decidir entre referência literal, tipológica ou retórica.
  alternative: Interpretar “Egito” apenas como símbolo do exílio em geral, ou tratar a Assíria como o único destino literal.
  rationale: O hebraico menciona explicitamente tanto o Egito quanto a Assíria. A tradução preserva essa tensão em vez de harmonizar os dois lugares.
- issue: Força cultual de טָמֵא
  choice: Traduzir por “alimento impuro”.
  alternative: “o que é impuro” ou “alimento contaminado”.
  rationale: “Impuro” conserva a dimensão ritual e pactual do termo, sem reduzi-lo a falta de higiene ou contaminação física.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. O ponto e vírgula conserva a estreita ligação entre a perda da terra e o exílio. Mantém-se a alternância do plural para o singular coletivo e novamente para o plural presente no hebraico.
