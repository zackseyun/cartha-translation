id: HOS.9.16
reference: Hosea 9:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֻכָּ֣ה אֶפְרַ֔יִם שָׁרְשָׁ֥/ם יָבֵ֖שׁ פְּרִ֣י בלי יַעֲשׂ֑וּ/ן גַּ֚ם כִּ֣י יֵֽלֵד֔וּ/ן וְ/הֵמַתִּ֖י מַחֲמַדֵּ֥י בִטְנָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/016.yaml
  text: Ephraim is stricken[a]; their root is dried up; they will bear no fruit. Even if they give birth[b], I will put to death the cherished ones of their womb.
translation:
  language: pt
  text: Efraim foi ferido; a raiz deles[a] secou; não darão fruto. Mesmo que deem à luz, matarei os filhos queridos[b] do ventre deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sua raiz”. O hebraico traz um sufixo plural (“a raiz deles”), embora “Efraim” seja um nome coletivo de forma singular.
    reason: lexical_alternative
  - marker: b
    text: Ou “aqueles que lhes são preciosos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֻכָּה
  choice: foi ferido
  rationale: O passivo de נכה descreve Efraim atingido pelo juízo. “Foi ferido” preserva a força e a gravidade do hebraico em português atual.
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Mantém o nome próprio, que aqui funciona coletivamente como designação do reino do norte.
- source_word: שָׁרְשָׁם
  choice: a raiz deles
  rationale: Conserva o sufixo plural do hebraico, apesar de “Efraim” ter forma singular e sentido coletivo.
- source_word: יָבֵשׁ
  choice: secou
  rationale: Expressa o estado resultante da raiz ressequida e se encaixa naturalmente na metáfora vegetal.
- source_word: פְּרִי בלי יַעֲשׂוּן
  choice: não darão fruto
  rationale: Formulação idiomática que preserva a imagem agrícola e sua progressão para a perda dos filhos.
- source_word: גַּם כִּי
  choice: Mesmo que
  rationale: 'Comunica a concessão enfática: nem o eventual nascimento de filhos impedirá o juízo.'
- source_word: יֵלֵדוּן
  choice: deem à luz
  rationale: Marca claramente a passagem da imagem vegetal para o nascimento humano.
- source_word: וְהֵמַתִּי
  choice: matarei
  rationale: Reproduz de modo direto o hifil de מות e mantém explícita a ação divina em primeira pessoa.
- source_word: מַחֲמַדֵּי
  choice: os filhos queridos
  rationale: O termo designa pessoas ou coisas preciosas e desejadas; no contexto do ventre e do parto, “filhos queridos” explicita naturalmente o referente sem atenuar o afeto expresso.
- source_word: בִטְנָם
  choice: do ventre deles
  rationale: No contexto de parto, בטן se refere ao ventre materno; a formulação também conserva o sufixo plural.
theological_decisions:
- issue: Ação divina no juízo
  choice: 'Manter a primeira pessoa direta: “matarei”'
  alternative: Empregar uma formulação impessoal, como “eles morrerão”
  rationale: O hebraico atribui explicitamente a Deus, em primeira pessoa, a ação de fazer morrer; a tradução não deve ocultar nem suavizar essa agência.
translation_notes:
  register: Português moderno, digno e direto, com legibilidade brasileira e vocabulário amplamente internacional. A imagem agrícola foi mantida até a transição explícita para o parto, e os plurais hebraicos ligados ao Efraim coletivo foram preservados.
