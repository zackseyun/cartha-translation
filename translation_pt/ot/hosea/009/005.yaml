  text: מַֽה תַּעֲשׂ֖וּ לְ/י֣וֹם מוֹעֵ֑ד וּ/לְ/י֖וֹם חַג יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/005.yaml
  text: What will you do on the day of appointed assembly[a], and on the day of the feast of Yahweh?
translation:
  language: pt
  text: O que vocês farão no dia da reunião sagrada[a] e no dia da festa de Yahweh?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tempo determinado” ou “festa”. O termo hebraico מוֹעֵד pode se referir de modo amplo a um tempo marcado ou, mais especificamente, a uma reunião sagrada.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: O que
  rationale: Introduz uma pergunta retórica direta; “O que” reproduz naturalmente o interrogativo hebraico.
- source_word: תַּעֲשׂוּ
  choice: vocês farão
  rationale: O imperfeito qal na segunda pessoa do plural aponta, neste contexto, para o que o povo fará na situação futura; a forma com “vocês” é clara e amplamente compreensível.
- source_word: לְיוֹם
  choice: no dia da
  rationale: A preposição לְ tem aqui valor temporal; “no dia da” é a expressão idiomática em português.
- source_word: מוֹעֵד
  choice: reunião marcada
  rationale: O termo pode indicar um tempo determinado, uma reunião ou uma celebração sagrada. “Reunião marcada” conserva tanto a ideia de ocasião estabelecida quanto a dimensão coletiva, sem igualá-lo a חַג.
- source_word: וּלְיוֹם
  choice: e no dia da
  rationale: Repete o valor temporal da construção anterior e mantém o paralelismo hebraico com clareza.
- source_word: חַג
  choice: festa
  rationale: Designa uma festa religiosa, muitas vezes ligada à peregrinação. “Festa” é conciso, natural e distinto de “reunião marcada”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto contém diretamente o Tetragrama; “Yahweh” preserva o nome pessoal divino em transliteração.
- issue: Relação entre מוֹעֵד e חַג
  choice: Distinguir os termos como “reunião marcada” e “festa”
  alternative: Empregar “festa” ou “festival” para ambos
  rationale: O hebraico usa termos relacionados, mas não idênticos. A distinção preserva o paralelismo e evita eliminar a amplitude semântica de מוֹעֵד.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “vocês” para explicitar a segunda pessoa do plural. A formulação mantém a pergunta retórica e o paralelismo conciso do hebraico.
