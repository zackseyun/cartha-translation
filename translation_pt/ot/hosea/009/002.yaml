base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/002.yaml
  text: Threshing floor and winepress will not feed them[a], and new wine will fail her.
translation:
  language: pt
  text: A eira e o lagar não os alimentarão, e o vinho novo a decepcionará.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o vinho novo lhe faltará” ou “se mostrará falso para ela”. O verbo hebraico pode indicar que algo deixa de cumprir o que se esperava.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּרֶן
  choice: eira
  rationale: Designa o local onde os cereais eram debulhados e pode representar, por metonímia, a produção de grãos. “Eira” preserva a imagem agrícola concreta.
- source_word: יֶקֶב
  choice: lagar
  rationale: Refere-se ao local ou equipamento em que as uvas eram prensadas. “Lagar” é o equivalente português claro e tradicional, formando um par natural com “eira”.
- source_word: יִרְעֵם
  choice: não os alimentarão
  rationale: O verbo רעה significa pastorear ou alimentar. Com “eira” e “lagar” como sujeitos, expressa a incapacidade da produção agrícola de lhes dar sustento; “alimentar” mantém a metáfora de provisão sem soar artificial.
- source_word: תִירוֹשׁ
  choice: vinho novo
  rationale: O termo costuma designar vinho novo ou recém-produzido, ligado diretamente à colheita. A expressão preserva a imagem da produção agrícola esperada.
- source_word: יְכַחֶשׁ
  choice: faltará
  rationale: כחש pode significar mentir, mostrar-se falso, frustrar ou falhar. Neste contexto, indica que o vinho novo não corresponderá ao que se esperava dele. “Faltará” é natural em português e comunica a privação, enquanto a nota preserva outras nuances possíveis.
- source_word: בָּהּ
  choice: a ela
  rationale: O sufixo é feminino singular e provavelmente retoma Israel/Efraim personificado como mulher. “A ela” conserva o número, o gênero e a personificação do hebraico.
theological_decisions:
- issue: Referente do sufixo feminino singular em בָּהּ
  choice: 'Israel/Efraim personificado como entidade feminina singular: “a ela”'
  alternative: Entendê-lo coletivamente como “a eles” ou fazê-lo referir-se à terra
  rationale: A decisão é sobretudo gramatical e literária. Oseias personifica repetidamente a nação no feminino; conservar “a ela” evita apagar essa imagem, embora o antecedente não esteja expresso neste versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Eira” e “lagar” mantêm o paralelismo agrícola concreto; embora sejam termos rurais, são precisos e correntes no registro bíblico. A construção “a ela” preserva deliberadamente a personificação feminina de Israel/Efraim.
