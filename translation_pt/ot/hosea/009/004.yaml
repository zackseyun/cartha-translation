  text: לֹא יִסְּכ֨וּ לַ/יהוָ֥ה יַיִן֮ וְ/לֹ֣א יֶֽעֶרְבוּ ל/וֹ֒ זִבְחֵי/הֶ֗ם כְּ/לֶ֤חֶם אוֹנִים֙ לָ/הֶ֔ם כָּל אֹכְלָ֖י/ו יִטַמָּ֑אוּ כִּֽי לַחְמָ֣/ם לְ/נַפְשָׁ֔/ם לֹ֥א יָב֖וֹא בֵּ֥ית יְהוָֽה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/004.yaml
  text: They will not pour out wine offerings to Yahweh[a], and their sacrifices will not please him. They will be like mourners’ bread to them; all who eat it will become unclean. For their bread will be for themselves alone[b]; it will not enter the house of Yahweh.
translation:
  language: pt
  text: Eles não derramarão vinho como oferta a Yahweh, e seus sacrifícios não lhe agradarão. Serão para eles como pão de enlutados[a]; todos os que o comerem ficarão impuros. Pois o pão deles será apenas para si mesmos[b]; não entrará na casa de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, pão associado ao luto e, portanto, à impureza ritual ligada à morte.
    reason: esclarecimento_lexical_e_cultural
  - marker: b
    text: 'Ou: “para o apetite deles”. A expressão hebraica indica que o pão se destinaria somente ao consumo deles, não podendo ser levado à casa de Yahweh.'
    reason: alternativa_lexical
lexical_decisions:
- source_word: יִסְּכוּ ... יַיִן
  choice: derramarão ofertas de vinho
  rationale: O verbo נסך, seguido de יין em contexto sacrificial, descreve o derramamento ritual de vinho. A expressão explicita naturalmente em português que se trata de uma oferta líquida.
- source_word: יֶעֶרְבוּ לוֹ
  choice: não lhe serão agradáveis
  rationale: O verbo ערב expressa aqui aceitação ou agrado diante de Deus; a formulação conserva o sentido cultual sem sugerir apenas uma sensação subjetiva.
- source_word: זִבְחֵיהֶם
  choice: seus sacrifícios
  rationale: זבח é o termo comum para sacrifício, e esta é a forma clara e digna em português atual.
- source_word: כְּלֶחֶם אוֹנִים
  choice: como pão de enlutados
  rationale: A expressão associa o pão ao luto e, no contexto, à impureza ritual ligada à morte. A tradução preserva a imagem hebraica.
- source_word: יִטַמָּאוּ
  choice: ficarão impuros
  rationale: טמא possui sentido ritual e cultual neste contexto; “impuros” evita reduzir a afirmação a corrupção moral.
- source_word: לְנַפְשָׁם
  choice: apenas para si mesmos
  rationale: נפש pode indicar a própria pessoa ou o apetite. No contexto, o pão serve somente ao consumo pessoal e não pode ser levado ao santuário; “apenas” torna explícito esse contraste.
- source_word: לֹא יָבוֹא בֵּית יְהוָה
  choice: não entrará na casa de Yahweh
  rationale: O verbo singular retoma “pão” e indica que ele não será admitido no santuário.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o nome da aliança. A transliteração “Yahweh” preserva sua função como nome próprio.
- issue: Natureza da impureza associada ao pão de enlutados
  choice: impureza ritual ligada ao luto e à morte
  alternative: tristeza em sentido geral; contaminação moral
  rationale: A linguagem de sacrifícios, impureza e entrada na casa de Yahweh situa a afirmação no âmbito cultual, embora a tradução principal não acrescente uma explicação além do texto.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. Mantém-se a imagem concreta do pão, o vocabulário cultual de pureza e o nome divino Yahweh. O plural implícito “Serão” retoma “seus sacrifícios”, conforme a sequência sintática hebraica.
