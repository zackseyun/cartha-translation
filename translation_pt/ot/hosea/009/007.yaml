source:
  edition: WLC
  text: בָּ֣אוּ יְמֵ֣י הַ/פְּקֻדָּ֗ה בָּ֚אוּ יְמֵ֣י הַ/שִׁלֻּ֔ם יֵדְע֖וּ יִשְׂרָאֵ֑ל אֱוִ֣יל הַ/נָּבִ֗יא מְשֻׁגָּע֙ אִ֣ישׁ הָ/ר֔וּחַ עַ֚ל רֹ֣ב עֲוֺנְ/ךָ֔ וְ/רַבָּ֖ה מַשְׂטֵמָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/007.yaml
  text: The days of punishment have come[a]; the days of repayment have come; Israel will know it. The prophet is a fool; the man of the spirit is mad[c][b], because of the greatness of your iniquity and your great hostility.
translation:
  language: pt
  text: Chegaram os dias do castigo; chegaram os dias da retribuição. Israel ficará sabendo. O profeta é insensato; o homem do espírito está louco[a][b], por causa da grandeza da sua culpa e da grande hostilidade[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o homem inspirado está louco”. A expressão hebraica “homem do espírito” pode designar alguém que alega inspiração espiritual.'
    reason: lexical_alternative
  - marker: b
    text: 'Alguns entendem estas palavras como a descrição desdenhosa que o povo faz do verdadeiro profeta: “O profeta é insensato; o homem do espírito está louco”. O hebraico não as marca explicitamente como citação.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “por causa da abundância da sua iniquidade e da grande hostilidade”. O último substantivo pode significar hostilidade, inimizade ou ódio, e seu objeto não é declarado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדָּה
  choice: castigo
  rationale: No contexto profético de juízo, designa uma visitação punitiva ou prestação de contas; “castigo” expressa isso com clareza e força judicial.
- source_word: שִׁלֻּם
  choice: retribuição
  rationale: Comunica a ideia de paga ou consequência correspondente e mantém o paralelismo com “castigo”.
- source_word: יֵדְעוּ יִשְׂרָאֵל
  choice: Israel ficará sabendo
  rationale: 'Entende o imperfeito como preditivo: Israel virá a reconhecer a realidade do juízo anunciado.'
- source_word: אֱוִיל
  choice: insensato
  rationale: Preserva o tom forte de censura sem recorrer a formulação coloquial; funciona naturalmente como predicativo de “o profeta”.
- source_word: מְשֻׁגָּע
  choice: está louco
  rationale: Expressa o estado de desvario indicado pelo hebraico em linguagem portuguesa direta e atual.
- source_word: אִישׁ הָרוּחַ
  choice: o homem do espírito
  rationale: Mantém de propósito a expressão próxima ao hebraico e “espírito” em minúscula, sem decidir se se trata de inspiração divina genuína ou alegada.
- source_word: עַל
  choice: por causa de
  rationale: Introduz naturalmente a causa ou fundamento do juízo e da denúncia.
- source_word: רֹב עֲוֺנְךָ
  choice: a grandeza da sua culpa
  rationale: רֹב indica grandeza ou abundância, e עָוֹן pode envolver tanto a perversidade como a culpa dela decorrente; “culpa” preserva esse peso moral.
- source_word: מַשְׂטֵמָה
  choice: sua grande hostilidade
  rationale: O substantivo denota hostilidade, inimizade ou ódio. A formulação preserva a indefinição do objeto dessa hostilidade e lê a coordenação como dirigida a Israel.
theological_decisions:
- issue: Referente da denúncia “O profeta é insensato; o homem do espírito está louco”
  choice: Afirmação não marcada sobre figuras proféticas ou porta-vozes que alegam inspiração, expostos no juízo
  alternative: Citação da maneira desdenhosa como o povo descreve o profeta verdadeiro; ou caracterização sarcástica apenas dos falsos profetas
  rationale: O hebraico não marca a frase como citação. Por isso, o texto principal não usa aspas, enquanto a nota conserva a leitura alternativa sem resolver indevidamente a tensão.
- issue: Sentido de “espírito” em אִישׁ הָרוּחַ
  choice: Referência ambígua a inspiração espiritual, sem identificar explicitamente o Espírito Santo
  alternative: Homem inspirado pelo Espírito de Deus
  rationale: A minúscula evita importar uma especificidade teológica não exigida pelo hebraico, sem excluir que a expressão envolva uma reivindicação de inspiração divina.
- issue: Objeto de מַשְׂטֵמָה
  choice: Deixado sem explicitação
  alternative: Hostilidade contra Deus, contra o profeta verdadeiro ou animosidade associada ao juízo
  rationale: O texto não declara o objeto da hostilidade; explicitá-lo estreitaria indevidamente o sentido.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A repetição “chegaram os dias” reproduz a ênfase profética. A expressão deliberadamente incomum “homem do espírito” conserva a ambiguidade do original e é esclarecida em nota.
