base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/012.yaml
  text: Even if they raise their children[a], I will bereave them so that not a man remains; for indeed[b], woe to them when I depart from them.
translation:
  language: pt
  text: Mesmo que criem seus filhos[a], eu os deixarei sem filhos, a ponto de não restar ninguém. Pois, de fato, ai deles quando eu me afastar deles![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seus filhos do sexo masculino”. O termo hebraico pode indicar especificamente os filhos do sexo masculino, mas muitas vezes designa os descendentes de modo mais amplo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “quando eu me retirar deles”. A expressão pode enfatizar a retirada da presença e do favor de Deus em juízo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Mesmo que
  rationale: A combinação tem valor concessivo neste contexto; “mesmo que” expressa com naturalidade a condição que não impedirá o juízo anunciado.
- source_word: יְגַדְּלוּ
  choice: criem
  rationale: No piel, גדל pode significar criar ou educar filhos. “Criem” é corrente e claro em português.
- source_word: בְּנֵיהֶם
  choice: seus filhos
  rationale: בנים pode designar especificamente filhos homens, mas também a descendência de modo mais amplo. “Filhos” preserva essa amplitude normal em português.
- source_word: וְשִׁכַּלְתִּים
  choice: eu os deixarei sem filhos
  rationale: שׁכל descreve a perda dos filhos e o consequente estado de desfilhamento. A formulação comunica claramente a força trágica do verbo.
- source_word: מֵאָדָם
  choice: até não restar ninguém
  rationale: A expressão difícil intensifica a privação, apontando para a ausência de qualquer sobrevivente humano. Esta formulação conserva o sentido contextual sem reproduzir um idiomatismo obscuro.
- source_word: כִּי גַם
  choice: Sim
  rationale: Aqui a combinação reforça solenemente a declaração seguinte. “Sim” transmite a ênfase sem tornar a frase pesada.
- source_word: אוֹי לָהֶם
  choice: ai deles
  rationale: Mantém a conhecida fórmula profética de lamento e anúncio de juízo.
- source_word: בְּשׂוּרִי מֵהֶם
  choice: quando eu me afastar deles
  rationale: O infinitivo de סור com sufixo de primeira pessoa indica o afastamento do próprio Deus; a preposição בְּ introduz a circunstância temporal.
theological_decisions:
- issue: Sentido do afastamento divino na oração final
  choice: Deus se afasta do povo em juízo
  alternative: Deus se retira deles ou volta as costas para eles
  rationale: O sufixo de primeira pessoa favorece claramente o movimento atribuído a Deus, não ao povo. A tradução mantém a tensão do juízo decorrente de sua retirada sem explicitar além do texto em que consiste essa retirada.
translation_notes:
  register: Português moderno, solene e acessível, com leitura natural no Brasil e ampla inteligibilidade internacional. A repetição de “filhos” preserva o foco do hebraico, enquanto “até não restar ninguém” torna inteligível a expressão hebraica concisa e difícil.
