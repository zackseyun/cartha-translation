reference: Hosea 9:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי הִנֵּ֤ה הָֽלְכוּ֙ מִ/שֹּׁ֔ד מִצְרַ֥יִם תְּקַבְּצֵ֖/ם מֹ֣ף תְּקַבְּרֵ֑/ם מַחְמַ֣ד לְ/כַסְפָּ֗/ם קִמּוֹשׂ֙ יִֽירָשֵׁ֔/ם ח֖וֹחַ בְּ/אָהֳלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/006.yaml
  text: For behold[a], they have gone away from destruction; Egypt will gather them, Memphis will bury them. Nettles will possess the precious things of their silver; thorns will be in their tents.
translation:
  language: pt
  text: Pois eis que eles se foram, fugindo da devastação; o Egito os reunirá, Mênfis os sepultará. Urtigas[a] possuirão seus tesouros de prata; espinhos crescerão em suas tendas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A identificação exata da planta hebraica é incerta; também se pode traduzir por “ervas daninhas” ou por outra vegetação invasora semelhante.
    reason: Incerteza lexical e botânica em קִמּוֹשׂ.
lexical_decisions:
- source_word: מִשֹּׁד
  choice: fugindo da devastação
  rationale: שֹׁד indica ruína violenta ou devastação. A formulação explicita de modo natural que partiram para fugir dela, sem sugerir que tenham escapado com sucesso.
- source_word: מִצְרַיִם
  choice: o Egito
  rationale: Forma portuguesa corrente do nome geográfico; o artigo é natural em português.
- source_word: תְּקַבְּצֵם
  choice: os ajuntará
  rationale: קבץ no piel significa reunir ou ajuntar. A escolha preserva a personificação do Egito e a ironia de um verbo que pode ter sentido positivo em outros contextos.
- source_word: מֹף
  choice: Mênfis
  rationale: מֹף designa a cidade egípcia conhecida em português como Mênfis.
- source_word: תְּקַבְּרֵם
  choice: os sepultará
  rationale: קבר significa sepultar ou enterrar; aqui o paralelismo mostra que o exílio no Egito culminará em morte.
- source_word: מַחְמַד לְכַסְפָּם
  choice: seus preciosos objetos de prata
  rationale: מַחְמַד indica algo desejável ou precioso, e a expressão aponta para bens valiosos de prata. Esta redação é clara sem reduzir a expressão à prata em sentido abstrato.
- source_word: קִמּוֹשׂ
  choice: urtigas
  rationale: O termo designa uma planta invasora associada a lugares abandonados, embora sua identificação botânica exata seja incerta. A nota preserva essa incerteza.
- source_word: יִירָשֵׁם
  choice: tomarão posse de
  rationale: 'ירשׁ pode significar herdar, possuir ou tomar posse. A formulação conserva a inversão irônica: a vegetação passa a ocupar os bens abandonados.'
- source_word: חוֹחַ
  choice: espinhos
  rationale: Equivalente genérico e claro para a planta espinhosa indicada pelo hebraico.
- source_word: בְּאָהֳלֵיהֶם
  choice: em suas tendas
  rationale: Mantém a imagem literal de אֹהֶל e o quadro poético das moradias abandonadas.
theological_decisions:
- issue: Sentido de הָלְכוּ מִשֹּׁד
  choice: eles se foram, fugindo da devastação
  alternative: eles se foram por causa da devastação; eles escaparam da devastação
  rationale: O contexto apresenta fuga inútil, exílio e morte, não libertação bem-sucedida. A tradução comunica movimento para longe da devastação sem afirmar que tenham escapado do juízo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Pois eis que” preserva a força introdutória de כִּי הִנֵּה; “ajuntará” mantém o paralelismo e a ironia do hebraico, enquanto “crescerão” torna natural em português a cláusula nominal final sem alterar sua imagem de desolação.
