id: HOS.9.10
reference: Hosea 9:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כַּ/עֲנָבִ֣ים בַּ/מִּדְבָּ֗ר מָצָ֨אתִי֙ יִשְׂרָאֵ֔ל כְּ/בִכּוּרָ֤ה בִ/תְאֵנָה֙ בְּ/רֵ֣אשִׁיתָ֔/הּ רָאִ֖יתִי אֲבֽוֹתֵי/כֶ֑ם הֵ֜מָּה בָּ֣אוּ בַֽעַל פְּע֗וֹר וַ/יִּנָּֽזְרוּ֙ לַ/בֹּ֔שֶׁת וַ/יִּהְי֥וּ שִׁקּוּצִ֖ים כְּ/אָהֳבָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/010.yaml
  text: Like grapes in the wilderness I found Israel[a]; like the first-ripe fruit on the fig tree in its first season I saw your fathers. They came to Baal-peor and consecrated themselves to shame[d][c][b], and they became detestable like the thing they loved.
translation:
  language: pt
  text: Como uvas no deserto, encontrei Israel; como o primeiro figo maduro da figueira, no começo de sua estação[a], vi os seus pais[b]. Eles foram a Baal-Peor[c] e consagraram-se à vergonha[d]; tornaram-se abomináveis como aquilo que amaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no início de sua estação”. A imagem é a do figo mais precoce, especialmente apreciado.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os seus antepassados”. Hebraico: “os seus pais”.'
    reason: lexical_alternative
  - marker: c
    text: Compare Números 25:1–5, onde Israel se uniu a Baal-Peor.
    reason: cross_reference
  - marker: d
    text: “Vergonha” provavelmente é uma forma depreciativa de se referir ao ídolo associado a Baal-Peor.
    reason: alternative_reading
lexical_decisions:
- source_word: כַּעֲנָבִים בַּמִּדְבָּר
  choice: Como uvas no deserto
  rationale: Preserva a comparação e a imagem de uma descoberta preciosa e inesperada em lugar árido. “Deserto” é claro e natural em português, sem exigir que o local seja um deserto de areia.
- source_word: מָצָאתִי יִשְׂרָאֵל
  choice: encontrei Israel
  rationale: Representa diretamente o qal perfeito na primeira pessoa e mantém a vivacidade da metáfora.
- source_word: כְּבִכּוּרָה בִתְאֵנָה
  choice: como o primeiro figo maduro da figueira
  rationale: בִּכּוּרָה indica o fruto que amadurece primeiro, especialmente apreciado. “Primeiro figo maduro” comunica com clareza tanto a precedência quanto o valor desse fruto.
- source_word: בְּרֵאשִׁיתָהּ
  choice: no começo de sua estação
  rationale: A expressão significa literalmente “no seu começo” e, no contexto agrícola, aponta para o início da estação de frutificação; a nota preserva uma formulação alternativa.
- source_word: רָאִיתִי אֲבוֹתֵיכֶם
  choice: vi os seus pais
  rationale: “Vi” mantém o paralelismo com “encontrei”. “Seus pais” preserva o masculino plural do hebraico e seu sentido ancestral, esclarecido em nota.
- source_word: הֵמָּה בָּאוּ בַעַל פְּעוֹר
  choice: Eles foram a Baal-Peor
  rationale: O pronome explícito é mantido. “Foram a” expressa naturalmente em português o movimento até Baal-Peor, sem acrescentar uma conjunção adversativa que não aparece no hebraico.
- source_word: וַיִּנָּזְרוּ לַבֹּשֶׁת
  choice: e consagraram-se à vergonha
  rationale: O nifal de נזר pode indicar separar-se ou dedicar-se com sentido cultual. “Consagraram-se” preserva a ironia religiosa, enquanto “vergonha” mantém a designação polêmica e sua ambiguidade.
- source_word: וַיִּהְיוּ שִׁקּוּצִים
  choice: tornaram-se abomináveis
  rationale: שִׁקּוּצִים pertence ao campo do que é repulsivo e especialmente abominável no contexto idólatra. A forma adjetival é natural em português porque o sujeito são pessoas.
- source_word: כְּאָהֳבָם
  choice: como aquilo que amaram
  rationale: A frase hebraica é condensada e pode apontar para o objeto de amor ou devoção. Esta tradução preserva a comparação e deixa o objeto implícito, como no original.
theological_decisions:
- issue: Sentido de לַבֹּשֶׁת no contexto de idolatria
  choice: à vergonha
  alternative: à coisa vergonhosa; à Vergonha, como nome depreciativo do ídolo
  rationale: A tradução conserva a retórica profética sem identificar explicitamente “vergonha” com um ídolo no texto principal. A nota explica a provável referência sem eliminar a ambiguidade.
- issue: Referência ancestral de אֲבוֹתֵיכֶם
  choice: os seus pais
  alternative: os seus antepassados
  rationale: O texto principal preserva o substantivo masculino plural do hebraico; a nota informa o sentido ancestral para evitar que a expressão seja entendida apenas como referência à geração imediatamente anterior.
- issue: Relação entre os antepassados e Baal-Peor
  choice: Eles foram a Baal-Peor
  alternative: Mas eles foram a Baal-Peor
  rationale: Embora exista forte contraste no contexto, o hebraico não traz aqui uma conjunção adversativa explícita. A tradução deixa que a sequência produza o contraste sem acrescentar “mas”.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. A ordem poética e o paralelismo das duas comparações foram preservados, ao mesmo tempo que a pontuação torna o contraste narrativo claro. As ambiguidades cultuais de “vergonha” e da frase final permanecem abertas no texto principal.
