source:
  edition: WLC
  text: כָּל רָעָתָ֤/ם בַּ/גִּלְגָּל֙ כִּֽי שָׁ֣ם שְׂנֵאתִ֔י/ם עַ֚ל רֹ֣עַ מַֽעַלְלֵי/הֶ֔ם מִ/בֵּיתִ֖/י אֲגָרְשֵׁ֑/ם לֹ֤א אוֹסֵף֙ אַהֲבָתָ֔/ם כָּל שָׂרֵי/הֶ֖ם סֹרְרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/015.yaml
  text: All their evil is at Gilgal[a]; indeed, there I hated them because of the evil of their deeds. I will drive them out of my house; I will no longer love them[c][b]. All their princes are rebels.
translation:
  language: pt
  text: Toda a maldade deles está em Gilgal;[a] pois foi ali que os odiei, por causa da maldade de suas ações. Eu os expulsarei da minha casa;[b] não os amarei mais. Todos os seus líderes são rebeldes.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de fato, foi ali que os odiei”. A conjunção hebraica pode ter sentido causal (“pois/porque”) ou enfático (“de fato”).'
    reason: lexical_alternative
  - marker: b
    text: “Minha casa” pode referir-se mais especificamente à terra do SENHOR, ao seu santuário ou à comunidade da aliança; o hebraico mantém a imagem condensada.
    reason: cultural_note
  - marker: c
    text: 'Ou: “Todos os seus governantes são obstinados”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל רָעָתָם
  choice: Toda a maldade deles
  rationale: O singular abstrato רָעָה com כָּל tem sentido coletivo, abrangendo a totalidade da maldade deles. “Toda a maldade deles” é natural e preserva esse valor.
- source_word: בַּגִּלְגָּל
  choice: em Gilgal
  rationale: A preposição בְּ é locativa; “em Gilgal” é a forma idiomática em português para indicar o lugar.
- source_word: כִּי שָׁם
  choice: pois foi ali
  rationale: כִּי pode ter valor causal ou enfático. No texto principal, “pois” apresenta a explicação e “foi ali” conserva a ênfase sobre o lugar; a alternativa enfática é registrada em nota.
- source_word: שְׂנֵאתִים
  choice: os odiei
  rationale: O verbo שׂנא expressa diretamente ódio ou rejeição. A formulação não suaviza a linguagem severa do juízo divino.
- source_word: עַל רֹעַ מַעַלְלֵיהֶם
  choice: por causa da maldade de suas ações
  rationale: עַל indica a causa, רֹעַ denota maldade, e מַעַלְלִים se refere a ações ou feitos. A tradução conserva a estrutura e a força moral da expressão.
- source_word: מִבֵּיתִי
  choice: da minha casa
  rationale: Com גָּרַשׁ, a expressão indica o lugar do qual eles serão expulsos. “Minha casa” mantém a imagem hebraica sem decidir se ela se refere especificamente à terra, ao santuário ou à comunidade da aliança.
- source_word: אֲגָרְשֵׁם
  choice: Eu os expulsarei
  rationale: גָּרַשׁ significa expulsar ou pôr para fora. “Expulsarei” é claro, vigoroso e combina naturalmente com “da minha casa”.
- source_word: לֹא אוֹסֵף אַהֲבָתָם
  choice: não os amarei mais
  rationale: 'אָסַף nesta construção idiomática indica continuação ou repetição; com a negação, comunica a cessação: “não... mais”.'
- source_word: כָּל שָׂרֵיהֶם
  choice: Todos os seus líderes
  rationale: שָׂרִים pode designar príncipes, governantes ou autoridades. “Líderes” é amplamente compreensível e não restringe indevidamente o termo a filhos de um rei.
- source_word: סֹרְרִים
  choice: são rebeldes
  rationale: O particípio de סרר caracteriza uma postura persistente de rebeldia. “São rebeldes” reproduz essa caracterização forte e direta.
theological_decisions:
- issue: Linguagem de ódio divino
  choice: Manter a formulação direta “os odiei”.
  alternative: “Eu os rejeitei” ou “voltei-me contra eles”.
  rationale: שׂנא expressa de modo explícito ódio ou rejeição. Preservar “odiei” mantém a severidade e a tensão teológica do texto, sem harmonização doutrinária.
- issue: Sentido de “minha casa”
  choice: Preservar a metáfora como “minha casa”.
  alternative: “Minha terra”, “meu santuário” ou “minha família”.
  rationale: O referente exato permanece compacto e pode abranger a terra, o santuário ou a comunidade da aliança. Especificá-lo no texto principal eliminaria uma ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o paralelismo profético, a linguagem severa do juízo e as ambiguidades relevantes. “Ações” evita arcaísmo; “líderes” comunica o alcance político de שָׂרִים sem sugerir necessariamente descendência real.
