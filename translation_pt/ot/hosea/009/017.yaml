id: HOS.9.17
reference: Hosea 9:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יִמְאָסֵ֣/ם אֱלֹהַ֔/י כִּ֛י לֹ֥א שָׁמְע֖וּ ל֑/וֹ וְ/יִהְי֥וּ נֹדְדִ֖ים בַּ/גּוֹיִֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/017.yaml
  text: My God will reject them because they have not listened to him[a], and they will be wanderers among the nations.
translation:
  language: pt
  text: Meu Deus os rejeitará, porque não lhe deram ouvidos[a], e andarão errantes entre as nações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não lhe obedeceram”. A expressão hebraica fala literalmente de não dar ouvidos a ele, com a ideia de obediência implícita no contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמְאָסֵם
  choice: os rejeitará
  rationale: O verbo מָאַס expressa rejeição ou recusa. “Os rejeitará” é claro e preserva a força judicial e pactual sem sugerir necessariamente desprezo emocional.
- source_word: אֱלֹהַי
  choice: Meu Deus
  rationale: O sufixo de primeira pessoa do singular deve ser mantido, pois preserva a voz pessoal e profética de Oseias.
- source_word: כִּי
  choice: porque
  rationale: A conjunção introduz a causa da rejeição divina; “porque” é a ligação causal mais natural em português.
- source_word: לֹא שָׁמְעוּ לוֹ
  choice: não lhe deram ouvidos
  rationale: A expressão portuguesa preserva a imagem auditiva do hebraico e, ao mesmo tempo, permite que a desobediência implícita seja percebida no contexto.
- source_word: וְיִהְיוּ נֹדְדִים
  choice: e andarão errantes
  rationale: A formulação natural em português comunica o estado futuro de deslocamento contínuo expresso pelo verbo היה e pelo particípio נֹדְדִים, sem acrescentar a ideia mais estreita de fuga.
- source_word: בַּגּוֹיִם
  choice: entre as nações
  rationale: A expressão indica os povos estrangeiros entre os quais Israel será disperso; “nações” evita associações neotestamentárias que “gentios” poderia introduzir.
theological_decisions:
- issue: Uso profético de “Meu Deus”
  choice: Manter a expressão em primeira pessoa “Meu Deus”.
  alternative: Traduzir simplesmente por “Deus”.
  rationale: O possessivo está explícito no hebraico e integra a voz do profeta, preservando sua dimensão pessoal e pactual sem impor interpretação doutrinária adicional.
- issue: Sentido de שׁמע com ל
  choice: Usar “não lhe deram ouvidos” no texto principal.
  alternative: “não lhe obedeceram”
  rationale: O idioma hebraico implica obediência, mas a tradução escolhida conserva a metáfora de ouvir e não resolve de modo excessivamente explícito a relação entre escuta e obediência.
- issue: Estado ou transição em וְיִהְיוּ נֹדְדִים
  choice: Traduzir naturalmente como “andarão errantes”.
  alternative: “serão errantes” ou “se tornarão errantes”
  rationale: A construção escolhida expressa a condição futura e contínua sem decidir rigidamente entre estado e ingresso no estado, nuances possíveis de היה neste contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Dar ouvidos” é idiomático e preserva a imagem do original; “andarão errantes” soa mais natural do que “serão errantes” e mantém a noção de dispersão entre povos estrangeiros.
