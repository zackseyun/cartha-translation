source:
  edition: WLC
  text: תֶּאְשַׁם֙ שֹֽׁמְר֔וֹן כִּ֥י מָרְתָ֖ה בֵּֽ/אלֹהֶ֑י/הָ בַּ/חֶ֣רֶב יִפֹּ֔לוּ עֹלְלֵי/הֶ֣ם יְרֻטָּ֔שׁוּ וְ/הָרִיּוֹתָ֖י/ו יְבֻקָּֽעוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/001.yaml
  text: Samaria shall bear her guilt[a], because she has rebelled against her God. They shall fall by the sword; their little children shall be dashed to pieces[b], and their pregnant women ripped open.
translation:
  language: pt
  text: Samaria carregará sua culpa[a], porque se rebelou contra o seu Deus. Cairão à espada; suas criancinhas serão despedaçadas[b], e suas mulheres grávidas terão o ventre rasgado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “será considerada culpada” ou “sofrerá por sua culpa”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “seus bebês serão despedaçados”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּאְשַׁם
  choice: carregará sua culpa
  rationale: O verbo אשם pode expressar tanto a condição de culpa quanto a responsabilidade por suas consequências. A formulação preserva essa amplitude sem reduzir o sentido a uma declaração abstrata de culpabilidade ou apenas ao castigo.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Forma tradicional e amplamente reconhecida do nome da cidade e região; a construção portuguesa permite manter sua personificação feminina.
- source_word: כִּי
  choice: porque
  rationale: A conjunção introduz claramente a causa do juízo anunciado.
- source_word: מָרְתָה
  choice: se rebelou
  rationale: מרה indica rebelião ou desafio contra uma autoridade; a expressão é direta, atual e adequada à acusação de infidelidade contra Deus.
- source_word: בֵּאלֹהֶיהָ
  choice: contra o seu Deus
  rationale: A preposição com מרה assinala aquele contra quem ocorre a rebelião, e o substantivo com sufixo feminino singular significa aqui o Deus de Samaria/Israel.
- source_word: בַּחֶרֶב יִפֹּלוּ
  choice: Cairão à espada
  rationale: Mantém o verbo simples 'cair' e a expressão idiomática de morte violenta em guerra, sem acrescentar um sujeito que o hebraico deixa implícito.
- source_word: עֹלְלֵיהֶם
  choice: suas criancinhas
  rationale: עולל designa crianças muito novas. 'Criancinhas' comunica idade reduzida de modo natural, sem restringir necessariamente o termo a recém-nascidos.
- source_word: יְרֻטָּשׁוּ
  choice: serão despedaçadas
  rationale: Reproduz o sentido passivo e brutal do verbo sem suavizar a imagem do oráculo de juízo.
- source_word: וְהָרִיּוֹתָיו
  choice: e suas mulheres grávidas
  rationale: Embora o sufixo massorético seja formalmente singular, a referência coletiva é às grávidas da população de Samaria; 'suas' preserva essa ligação naturalmente em português.
- source_word: יְבֻקָּעוּ
  choice: terão o ventre aberto
  rationale: בקע descreve aqui o ato de abrir violentamente o corpo de mulheres grávidas. A expressão explicita em português o sentido contextual sem ocultar a violência.
theological_decisions:
- issue: Personificação de Samaria e mudança para vítimas no plural
  choice: Manter Samaria como entidade feminina personificada e conservar o plural implícito em 'Cairão', seguido dos grupos atingidos.
  alternative: Uniformizar todas as referências no singular ou inserir explicitamente 'seus habitantes'.
  rationale: O hebraico apresenta Samaria no feminino singular na acusação inicial, mas passa a verbos plurais e às vítimas de sua população. A tradução conserva essa progressão sem acrescentar ao texto um sujeito expresso.
- issue: Violência explícita no oráculo de juízo
  choice: Preservar no texto principal as imagens de crianças despedaçadas e mulheres grávidas com o ventre aberto.
  alternative: Empregar eufemismos ou generalizar como morte e sofrimento em guerra.
  rationale: A linguagem hebraica é deliberadamente gráfica. Suavizá-la diminuiria a gravidade histórica e retórica do juízo anunciado.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A sintaxe mantém a concisão profética e a mudança do singular personificado para o plural coletivo. A violência não foi eufemizada; 'terão o ventre aberto' comunica o ato com clareza sem recorrer a vocabulário excessivamente coloquial.
