source:
  edition: WLC
  text: יָשֻׁ֨בוּ֙ יֹשְׁבֵ֣י בְ/צִלּ֔/וֹ יְחַיּ֥וּ דָגָ֖ן וְ/יִפְרְח֣וּ כַ/גָּ֑פֶן זִכְר֖/וֹ כְּ/יֵ֥ין לְבָנֽוֹן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/008.yaml
  text: Those who dwell in his shade will return[a]; they will revive like grain and blossom like the vine[b]; his renown will be like the wine of Lebanon.
translation:
  language: pt
  text: Os que habitam à sua sombra voltarão; reviverão como o cereal[a] e florescerão como a videira. Seu renome[b] será como o vinho do Líbano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica é condensada. Também pode ser entendida como “farão o cereal reviver”, “produzirão cereal” ou “serão reanimados pelo cereal”. O contexto pode evocar tanto o cereal brotando novamente como uma produção abundante.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sua lembrança” ou “sua memória”. O sufixo hebraico é masculino singular; no contexto, seu referente pode ser entendido como o povo restaurado personificado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֻׁבוּ
  choice: voltarão
  rationale: O qal imperfeito de שׁוב expressa normalmente voltar ou retornar. Aqui indica a restauração dos que vivem sob proteção, sem especificar de onde ou para onde voltam.
- source_word: יֹשְׁבֵי בְצִלּוֹ
  choice: Os que habitam à sua sombra
  rationale: O particípio substantivado designa os que habitam, e a sombra funciona poeticamente como imagem de proteção e bênção. A expressão portuguesa preserva a metáfora e o sufixo masculino singular.
- source_word: יְחַיּוּ דָגָן
  choice: reviverão como o cereal
  rationale: O piel de חיה significa dar vida ou reanimar. A construção com דָגָן é condensada; o valor comparativo, indicado pelo paralelismo com a videira, comunica naturalmente a imagem do cereal que volta a brotar, sem ocultar outras análises possíveis.
- source_word: וְיִפְרְחוּ כַגָּפֶן
  choice: e florescerão como a videira
  rationale: פרח descreve florescer ou vicejar, e כַגָּפֶן apresenta explicitamente a videira como comparação. A tradução mantém a imagem agrícola e o paralelismo poético.
- source_word: זִכְרוֹ
  choice: Seu renome
  rationale: זֵכֶר pode indicar memória, lembrança ou renome. A comparação com o célebre vinho do Líbano favorece renome, enquanto a nota registra a ambiguidade lexical e referencial.
- source_word: כְּיֵין לְבָנוֹן
  choice: como o vinho do Líbano
  rationale: Trata-se de uma comparação direta, preservada em português com a associação regional à qualidade e fama do vinho.
theological_decisions:
- issue: Referente dos sufixos masculinos singulares em בְצִלּוֹ e זִכְרוֹ
  choice: Manter formas singulares — “sua sombra” e “seu renome” — sem identificar expressamente o referente.
  alternative: Explicitar Israel, Efraim ou o povo restaurado como referente.
  rationale: O hebraico emprega sufixos masculinos singulares em um contexto que personifica coletivamente o povo. A tradução conserva a forma gramatical e a tensão poético-teológica, em vez de impor uma identificação.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “À sua sombra” conserva a metáfora protetora; “cereal” mantém o termo agrícola coletivo sem restringi-lo especificamente ao trigo. A pontuação divide os dois movimentos poéticos do versículo.
