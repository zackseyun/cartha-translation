base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/005.yaml
  text: I will heal their apostasy; I will love them freely[a], for my anger has turned away from them.
translation:
  language: pt
  text: Curarei a apostasia deles; eu os amarei de livre vontade, pois a minha ira se afastou dele[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “dele”; algumas traduções regularizam a mudança de número como “deles”.'
    reason: A nota registra a mudança do plural para o singular no texto hebraico e a alternativa adotada por algumas traduções.
lexical_decisions:
- source_word: אֶרְפָּא
  choice: Curarei
  rationale: O verbo רפא significa literalmente “curar”. A forma preserva a metáfora de restauração espiritual e moral.
- source_word: מְשׁוּבָתָם
  choice: a sua apostasia
  rationale: מְשׁוּבָה denota afastamento, deserção ou apostasia no âmbito da aliança. “Apostasia” preserva a gravidade do termo, e “sua” retoma naturalmente o referente plural em português.
- source_word: אֹהֲבֵם
  choice: eu os amarei
  rationale: אהב significa “amar”, e o sufixo pronominal é masculino plural.
- source_word: נְדָבָה
  choice: de livre vontade
  rationale: O substantivo, usado adverbialmente, expressa voluntariedade e disposição espontânea; “de livre vontade” comunica isso de modo claro sem acrescentar a ideia específica de mérito.
- source_word: כִּי
  choice: pois
  rationale: Aqui כִּי introduz a razão ou fundamento das promessas anteriores.
- source_word: שָׁב
  choice: se afastou
  rationale: שׁוב descreve o recuo ou a retirada da ira divina. “Se afastou” reproduz a imagem direcional sem tornar a frase artificial.
- source_word: אַפִּי
  choice: a minha ira
  rationale: אַף significa literalmente “nariz”, mas neste uso idiomático designa ira. “Ira” mantém o tom solene e intenso do contexto.
- source_word: מִמֶּנּוּ
  choice: dele
  rationale: A forma massorética contém sufixo masculino singular. “Dele” preserva a mudança de número do hebraico, em vez de harmonizá-la com os pronomes plurais anteriores.
theological_decisions:
- issue: Mudança de número no pronome final
  choice: Preservar o singular hebraico em “dele”
  alternative: Traduzir “deles”, harmonizando o pronome com os referentes plurais anteriores
  rationale: O texto hebraico passa de sufixos plurais em “sua apostasia” e “os amarei” para o singular מִמֶּנּוּ. Manter “dele” conserva uma tensão real do texto e permite que o singular se refira coletivamente a Israel, sem decidir isso de maneira explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das orações e a metáfora de cura foram preservadas. A repetição explícita de “eu” na segunda oração dá clareza e mantém a solenidade sem soar excessivamente arcaica.
