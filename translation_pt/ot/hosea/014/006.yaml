  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֶהְיֶ֤ה כַ/טַּל֙ לְ/יִשְׂרָאֵ֔ל יִפְרַ֖ח כַּ/שּֽׁוֹשַׁנָּ֑ה וְ/יַ֥ךְ שָׁרָשָׁ֖י/ו כַּ/לְּבָנֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/006.yaml
  text: I will be like the dew to Israel[a]; he will blossom like the lily[b], and he will strike his roots like Lebanon.
translation:
  language: pt
  text: Serei como o orvalho para Israel[a]; ele florescerá como o lírio e lançará suas raízes como o Líbano.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico apresenta Israel como um coletivo singular masculino; por isso, a continuação diz “ele” e “suas”.
    reason: lexical_alternative
  - marker: b
    text: O Líbano evoca firmeza e grandeza, provavelmente por meio de suas célebres árvores de raízes profundas; o hebraico não diz explicitamente “cedros”.
    reason: cultural_note
lexical_decisions:
- source_word: אֶהְיֶה
  choice: Serei
  rationale: 'O imperfeito qal de היה, na promessa deste contexto, tem sentido naturalmente futuro: o SENHOR declara o que será para Israel.'
- source_word: כַטַּל
  choice: como o orvalho
  rationale: Preserva a comparação marcada por כ e a imagem agrícola da umidade que sustenta a vida.
- source_word: לְיִשְׂרָאֵל
  choice: para Israel
  rationale: A preposição ל indica aqui a relação benéfica; “para Israel” é natural em português.
- source_word: יִפְרַח
  choice: ele florescerá
  rationale: O verbo está na terceira pessoa masculina do singular e retoma Israel como coletivo singular. “Florescerá” mantém a imagem floral.
- source_word: כַשּׁוֹשַׁנָּה
  choice: como o lírio
  rationale: שׁוֹשַׁנָּה designa convencionalmente o lírio ou uma flor semelhante; o artigo hebraico é refletido em “o lírio”.
- source_word: וְיַךְ שָׁרָשָׁיו
  choice: e lançará suas raízes
  rationale: O hifil de נכה, nesta expressão, descreve o ato de fazer as raízes descerem ou se firmarem. “Lançará suas raízes” preserva a ação e o sufixo masculino singular de modo poético e compreensível.
- source_word: כַלְּבָנוֹן
  choice: como o Líbano
  rationale: Mantém o topônimo expresso no hebraico sem acrescentar “cedros”, que não aparece no texto.
theological_decisions:
- issue: Referente e gênero das formas singulares aplicadas a Israel
  choice: 'Manter Israel como coletivo singular masculino: “ele florescerá ... suas raízes”.'
  alternative: Empregar o plural pelo sentido coletivo ou reformular para evitar o pronome.
  rationale: O hebraico apresenta Israel mediante verbo e sufixo na terceira pessoa masculina do singular. A tradução conserva essa personificação coletiva sem convertê-la silenciosamente em plural.
- issue: Sentido da imagem do Líbano
  choice: Conservar “como o Líbano” sem explicitar uma espécie de árvore.
  alternative: Traduzir interpretativamente como “como os cedros do Líbano”.
  rationale: O hebraico menciona o próprio Líbano. Embora suas árvores célebres provavelmente fundamentem a imagem de firmeza e grandeza, especificar cedros excederia o texto.
translation_notes:
  register: Português atual, digno e de leitura ampla, com cadência poética. “Lançará suas raízes” retém a força causativa e o sufixo do hebraico sem recorrer à expressão menos natural “golpeará suas raízes”.
