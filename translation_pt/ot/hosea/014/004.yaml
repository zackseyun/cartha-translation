source:
  edition: WLC
  text: אַשּׁ֣וּר לֹ֣א יוֹשִׁיעֵ֗/נוּ עַל סוּס֙ לֹ֣א נִרְכָּ֔ב וְ/לֹא נֹ֥אמַר ע֛וֹד אֱלֹהֵ֖י/נוּ לְ/מַעֲשֵׂ֣ה יָדֵ֑י/נוּ אֲשֶׁר בְּ/ךָ֖ יְרֻחַ֥ם יָתֽוֹם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/004.yaml
  text: Assyria will not save us[a]; we will not ride on horses, and we will no longer say, ‘Our God,’ to the work of our hands[b]. In you the fatherless finds mercy.
translation:
  language: pt
  text: 'A Assíria não nos salvará; não montaremos a cavalo e nunca mais diremos: “Nosso Deus”, à obra das nossas mãos. Em ti, o órfão[a] encontra misericórdia.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico designa literalmente quem não tem pai e também pode se referir, de modo mais amplo, a uma pessoa vulnerável e sem proteção.
    reason: lexical_alternative
  - marker: b
    text: 'A última frase também pode ser entendida como causal: “Pois em ti o órfão encontra misericórdia.”'
    reason: alternative_reading
lexical_decisions:
- source_word: אַשּׁוּר
  choice: Assíria
  rationale: Nome convencional em português para a potência imperial da qual Israel renuncia esperar livramento.
- source_word: יוֹשִׁיעֵנוּ
  choice: não nos salvará
  rationale: O hifil de ישׁע significa salvar ou livrar. “Salvar” é natural em português e conserva a ressonância teológica da confiança indevida no poder político.
- source_word: עַל סוּס לֹא נִרְכָּב
  choice: não montaremos em cavalos
  rationale: A expressão rejeita a confiança em cavalaria e força militar. O plural explicita naturalmente o sentido coletivo de סוּס no contexto.
- source_word: וְלֹא נֹאמַר עוֹד
  choice: e nunca mais diremos
  rationale: עוֹד com negação indica cessação definitiva; “nunca mais” transmite isso de maneira clara e idiomática.
- source_word: אֱלֹהֵינוּ
  choice: “Nosso Deus”
  rationale: Aqui אֱלֹהִים, com sufixo de primeira pessoa do plural, funciona como título dirigido ao ídolo, embora a forma possa ser plural em outros contextos.
- source_word: לְמַעֲשֵׂה יָדֵינוּ
  choice: à obra das nossas mãos
  rationale: Mantém a expressão hebraica tradicional para ídolos, com “obra” em sentido coletivo, sem explicitar além do texto que se trata de imagens.
- source_word: אֲשֶׁר בְּךָ
  choice: Em ti
  rationale: A construção relativa pode ser explicativa ou causal. Uma nova frase sem conjunção preserva a força poética e evita decidir em excesso a relação sintática.
- source_word: יְרֻחַם
  choice: encontra misericórdia
  rationale: O pual de רחם indica receber compaixão ou misericórdia. A formulação portuguesa é natural e conserva o sentido receptivo.
- source_word: יָתוֹם
  choice: o órfão
  rationale: É a forma portuguesa mais corrente para a pessoa sem proteção parental. Uma nota esclarece que o hebraico denota literalmente quem não tem pai e pode abranger o vulnerável.
theological_decisions:
- issue: Se a oração final deve ser explicitamente causal
  choice: 'Frase independente: “Em ti, o órfão encontra misericórdia.”'
  alternative: “Pois em ti o órfão encontra misericórdia.”
  rationale: אֲשֶׁר pode introduzir uma explicação ou fundamento, mas a justaposição conserva a ambiguidade da ligação e o destaque poético da misericórdia divina.
- issue: Se “o órfão” designa somente órfãos literais ou também Israel em sua impotência
  choice: Manter o termo concreto “o órfão” sem expansão interpretativa.
  alternative: “nós, que somos órfãos” ou “o desamparado”
  rationale: O texto pode evocar tanto a pessoa literalmente privada de proteção paterna quanto a condição vulnerável de Israel; a tradução não restringe essa abertura teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A estrutura paralela da confissão foi preservada, assim como a expressão concreta “obra das nossas mãos” e a ambiguidade sintática da oração final.
