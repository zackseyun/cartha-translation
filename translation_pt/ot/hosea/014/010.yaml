  text: מִ֤י חָכָם֙ וְ/יָ֣בֵֽן אֵ֔לֶּה נָב֖וֹן וְ/יֵֽדָעֵ֑/ם כִּֽי יְשָׁרִ֞ים דַּרְכֵ֣י יְהוָ֗ה וְ/צַדִּקִים֙ יֵ֣לְכוּ בָ֔/ם וּ/פֹשְׁעִ֖ים יִכָּ֥שְׁלוּ בָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/010.yaml
  text: Who is wise? Let him understand these things[a]. Who is discerning? Let him know them. For the ways of Yahweh are straight, and the righteous walk in them[b], but transgressors stumble in them.
translation:
  language: pt
  text: Quem é sábio? Que entenda estas coisas. Quem tem discernimento? Que as conheça. Pois os caminhos de Yahweh são retos[a]; os justos andarão neles, mas os transgressores[b] neles tropeçarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “corretos” ou “íntegros”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “rebeldes”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי חָכָם
  choice: Quem é sábio?
  rationale: Mantém a abertura interrogativa e retórica do hebraico, sem transformá-la numa afirmação indefinida.
- source_word: וְיָבֵן אֵלֶּה
  choice: Que entenda estas coisas
  rationale: O imperfeito em contexto sapiencial admite força exortativa; a formulação portuguesa é natural e mantém como objeto o conjunto da mensagem precedente.
- source_word: נָבוֹן
  choice: Quem tem discernimento?
  rationale: Expressa percepção e entendimento sem repetir diretamente o adjetivo “sábio”; a repetição de “quem” torna explícito em português o paralelismo elíptico do hebraico.
- source_word: וְיֵדָעֵם
  choice: Que as conheça
  rationale: Preserva o sentido amplo de ידע e retoma “estas coisas” mediante pronome feminino plural, conforme a gramática portuguesa.
- source_word: יְשָׁרִים
  choice: retos
  rationale: Conserva tanto o valor moral quanto a imagem de caminhos direitos, que estrutura o contraste entre andar e tropeçar.
- source_word: דַּרְכֵי יְהוָה
  choice: os caminhos de Yahweh
  rationale: Traduz diretamente a construção hebraica e preserva o nome divino como nome próprio.
- source_word: וְצַדִּקִים
  choice: os justos
  rationale: Representa o adjetivo substantivado que designa pessoas caracterizadas pela justiça.
- source_word: יֵלְכוּ בָם
  choice: andarão por eles
  rationale: Mantém a metáfora de conduta como caminhada e usa uma regência corrente em português para percorrer caminhos.
- source_word: וּפֹשְׁעִים
  choice: os transgressores
  rationale: Comunica aqueles que rompem limites e se insurgem; “rebeldes” permanece como alternativa lexical relevante.
- source_word: יִכָּשְׁלוּ בָם
  choice: neles tropeçarão
  rationale: Preserva a imagem concreta do tropeço nos mesmos caminhos pelos quais os justos andam, sem explicar além do texto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama como nome próprio; “Yahweh” o representa diretamente, em vez de substituí-lo por um título.
- issue: Força dos verbos וְיָבֵן e וְיֵדָעֵם
  choice: 'Exortativa: “Que entenda... Que as conheça”'
  alternative: 'Indicativa: “entenderá... conhecerá”'
  rationale: A forma verbal permite nuance volitiva/exortativa no encerramento sapiencial. A tradução mantém essa leitura sem transformar sabedoria e discernimento numa garantia automática.
- issue: Imagem moral dos caminhos retos
  choice: “os caminhos de Yahweh são retos”
  alternative: “são corretos” ou “são íntegros”
  rationale: “Retos” conserva simultaneamente a afirmação moral e a metáfora espacial que liga caminhos, caminhada e tropeço.
- issue: Contraste entre justos e transgressores
  choice: Manter ambos como grupos caracterizados por sua resposta aos mesmos caminhos
  alternative: Explicitar destinos finais ou identidades confessionais
  rationale: O versículo afirma que os justos andam nos caminhos e os transgressores tropeçam neles; não se acrescenta uma definição doutrinária dos grupos nem se resolve além do texto a natureza do tropeço.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação evita pronomes masculinos desnecessários sem apagar a estrutura singular e retórica do hebraico. “Andarão por eles” e “neles tropeçarão” mantêm com clareza a imagem unificadora dos caminhos.
