  text: קְח֤וּ עִמָּ/כֶם֙ דְּבָרִ֔ים וְ/שׁ֖וּבוּ אֶל יְהוָ֑ה אִמְר֣וּ אֵלָ֗י/ו כָּל תִּשָּׂ֤א עָוֺן֙ וְ/קַח ט֔וֹב וּֽ/נְשַׁלְּמָ֥ה פָרִ֖ים שְׂפָתֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/003.yaml
  text: Take words with you and return to Yahweh[a]. Say to him, “Take away all iniquity and receive what is good[b], and we will repay with the fruit of our lips.”
translation:
  language: pt
  text: 'Levem palavras com vocês e voltem para Yahweh. Digam-lhe: “Perdoa toda a iniquidade[a] e recebe o que é bom; ofereceremos os touros dos nossos lábios[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Retira toda a culpa”. A expressão hebraica fala literalmente de carregar ou levar embora a iniquidade.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “os touros dos nossos lábios”, metáfora que apresenta louvor, confissão ou votos falados como oferta sacrificial. Alguns testemunhos antigos e intérpretes entendem: “o fruto dos nossos lábios”.'
    reason: alternative_reading
lexical_decisions:
- source_word: קְחוּ עִמָּכֶם דְּבָרִים
  choice: Levem palavras com vocês
  rationale: Mantém o sentido concreto de levar consigo e preserva “palavras” sem explicá-las antecipadamente como confissão, súplica ou oração.
- source_word: וְשׁוּבוּ אֶל־יְהוָה
  choice: e voltem para Yahweh
  rationale: “Voltem” conserva tanto a imagem de movimento quanto o chamado ao arrependimento; o nome divino é transliterado como Yahweh.
- source_word: כָּל־תִּשָּׂא עָוֹן
  choice: Perdoa toda a iniquidade
  rationale: A expressão idiomática נשא עון fala literalmente de carregar ou retirar a iniquidade, mas neste pedido comunica claramente o perdão. A alternativa mais imagética é registrada em nota.
- source_word: וְקַח־טוֹב
  choice: e recebe o que é bom
  rationale: A frase hebraica é elíptica e discutida. Esta formulação mantém indefinido o objeto bom que se pede a Deus que receba, sem acrescentar “nossa oração” ou “nosso arrependimento”.
- source_word: וּנְשַׁלְּמָה פָרִים שְׂפָתֵינוּ
  choice: então ofereceremos os touros dos nossos lábios
  rationale: “Ofereceremos” expressa a ideia de entregar ou pagar uma oferta votiva, enquanto “touros dos nossos lábios” preserva a metáfora sacrificial do texto massorético.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva no texto o nome pessoal da aliança, sem substituí-lo por um título.
- issue: Sentido de שׁוב no chamado profético
  choice: voltem
  alternative: convertam-se; retornem
  rationale: “Voltem” preserva simultaneamente a metáfora espacial e o sentido de arrependimento, sem restringir o termo a uma formulação teológica posterior.
- issue: Metáfora sacrificial em פָרִים שְׂפָתֵינוּ
  choice: os touros dos nossos lábios
  alternative: o fruto dos nossos lábios
  rationale: O texto massorético diz “touros”, evocando ofertas sacrificiais substituídas por palavras. A leitura “fruto” tem apoio em testemunhos antigos e na tradição interpretativa, por isso consta em nota, mas não substitui silenciosamente a forma hebraica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com imperativos no plural natural no português brasileiro (“levem”, “voltem”, “digam”). A oração dirigida a Deus emprega formas de segunda pessoa singular (“perdoa”, “recebe”), preservando a mudança de interlocução do hebraico. A metáfora incomum dos “touros dos nossos lábios” foi mantida no texto e esclarecida em nota.
