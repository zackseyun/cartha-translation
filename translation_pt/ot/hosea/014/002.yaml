  text: שׁ֚וּבָ/ה יִשְׂרָאֵ֔ל עַ֖ד יְהוָ֣ה אֱלֹהֶ֑י/ךָ כִּ֥י כָשַׁ֖לְתָּ בַּ/עֲוֺנֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/002.yaml
  text: Return[a], O Israel, to Yahweh your God, for you have stumbled in your iniquity.
translation:
  language: pt
  text: Volte, Israel, para Yahweh, seu Deus, pois você tropeçou na sua iniquidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por causa da sua iniquidade”. A preposição hebraica pode indicar tanto a causa do tropeço quanto a esfera em que Israel tropeçou.'
    reason: alternativa lexical
lexical_decisions:
- source_word: שׁוּבָה
  choice: Volte
  rationale: O imperativo de שׁוב expressa retorno ou mudança de direção. “Volte” conserva a imagem de movimento em direção a Deus sem restringi-la ao termo mais interpretativo “arrependa-se”.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nome próprio tradicionalmente transliterado em português.
- source_word: עַד
  choice: para
  rationale: Com um verbo de retorno, עַד indica o alvo do movimento. “Para” é natural em português e evita a redundância de “de volta para”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Representa diretamente o nome divino יהוה, conforme a orientação do projeto.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: A forma com sufixo masculino singular expressa a relação pactual de Israel com Deus. O possessivo “seu” concorda com o tratamento moderno usado no versículo.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão para a convocação ao retorno; “pois” é claro, conciso e digno em português.
- source_word: כָשַׁלְתָּ
  choice: você tropeçou
  rationale: כשל descreve tropeçar ou vacilar. A tradução mantém a metáfora do hebraico sem intensificá-la para uma queda completa.
- source_word: בַּעֲוֺנֶךָ
  choice: na sua iniquidade
  rationale: A preposição ב pode indicar a esfera em que Israel tropeçou ou a causa do tropeço. A redação principal mantém de perto a construção compacta do hebraico, enquanto a leitura causal aparece em nota.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto contém explicitamente o Tetragrama. “Yahweh” preserva o nome pactual e segue a orientação terminológica do projeto.
- issue: Sentido pactual de שׁוב
  choice: Volte
  alternative: Arrependa-se
  rationale: O verbo denota fundamentalmente voltar ou retornar. O arrependimento está implícito no contexto profético, mas “volte” preserva tanto a imagem espacial quanto sua força relacional e pactual.
- issue: Relação expressa por ב em בַּעֲוֺנֶךָ
  choice: na sua iniquidade
  alternative: por causa da sua iniquidade
  rationale: A construção admite tanto uma nuance de esfera quanto uma nuance causal. O texto principal conserva a formulação mais próxima do hebraico, e a nota registra a leitura causal sem eliminar a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para ampla legibilidade brasileira. O vocativo dispensa “ó”, evitando solenidade artificial. A repetição de “seu/sua” mantém explícitos os sufixos hebraicos no singular.
