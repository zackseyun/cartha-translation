  text: אֶפְרַ֕יִם מַה לִּ֥/י ע֖וֹד לָֽ/עֲצַבִּ֑ים אֲנִ֧י עָנִ֣יתִי וַ/אֲשׁוּרֶ֗/נּוּ אֲנִי֙ כִּ/בְר֣וֹשׁ רַֽעֲנָ֔ן מִמֶּ֖/נִּי פֶּרְיְ/ךָ֥ נִמְצָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/009.yaml
  text: Ephraim—what have I to do anymore with idols? I have answered him and will look after him[a]. I am like a flourishing cypress[c][b]; from me your fruit is found.
translation:
  language: pt
  text: Efraim, que tenho eu ainda a ver com os ídolos? Eu lhe respondi e cuidarei dele[a]. Sou como um cipreste viçoso[b]; de mim procede o seu fruto[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “olharei para ele” ou “atentarei para ele”. Também é possível entender o início assim: “Efraim diz: ‘Que tenho eu ainda a ver com os ídolos?’”'
    reason: Alternativa lexical e identificação ambígua do falante.
  - marker: b
    text: 'Ou: “uma conífera verdejante”; a identificação exata da árvore é incerta.'
    reason: Incerteza botânica e alternativa lexical.
  - marker: c
    text: 'Mais literalmente: “de mim é encontrado o seu fruto”.'
    reason: Alternativa formal que preserva a voz passiva do hebraico.
lexical_decisions:
- source_word: מַה לִּי עוֹד לָעֲצַבִּים
  choice: que tenho eu ainda a ver com os ídolos?
  rationale: 'A expressão idiomática מַה לִּי comunica afastamento ou renúncia, e עוֹד acrescenta a ideia de continuidade: “ainda”. A formulação é natural em português e mantém a dificuldade quanto ao falante.'
- source_word: עָנִיתִי
  choice: Eu lhe respondi
  rationale: O verbo ענה tem aqui o sentido de responder. O perfeito é vertido pelo pretérito perfeito, sem acrescentar aspecto não expresso no hebraico.
- source_word: וַאֲשׁוּרֶנּוּ
  choice: e cuidarei dele
  rationale: O verbo raro שׁור/אשׁור pode significar olhar, observar ou atentar para alguém. “Cuidarei dele” expressa atenção favorável no contexto, enquanto a nota preserva alternativas mais formais.
- source_word: כִּבְרוֹשׁ רַעֲנָן
  choice: como um cipreste viçoso
  rationale: בְּרוֹשׁ é tradicionalmente identificado como cipreste ou conífera semelhante, e רַעֲנָן denota vigor verdejante. “Viçoso” é corrente, conciso e preserva a imagem.
- source_word: מִמֶּנִּי פֶּרְיְךָ נִמְצָא
  choice: de mim procede o seu fruto
  rationale: A formulação comunica claramente que Deus é a fonte do fruto de Efraim. A nota registra a forma mais literal do nifal נִמְצָא, “é encontrado”.
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Transliteração portuguesa tradicional do nome, que aqui personifica o reino do norte.
- source_word: עֲצַבִּים
  choice: ídolos
  rationale: No uso profético, o termo designa imagens cultuais tratadas como deuses; “ídolos” é o equivalente moderno mais claro.
theological_decisions:
- issue: Identificação do falante na oração inicial
  choice: A oração é apresentada como parte da fala do SENHOR dirigida a respeito de Efraim.
  alternative: 'Entender a oração como confissão de Efraim: “Efraim diz: ‘Que tenho eu ainda a ver com os ídolos?’”'
  rationale: O hebraico não contém marcador explícito de fala. Os verbos subsequentes na primeira pessoa favorecem a continuidade da fala divina, mas a alternativa é genuína e, por isso, fica registrada em nota.
- issue: Fonte do fruto de Efraim
  choice: “de mim procede o seu fruto” identifica Deus como fonte do fruto sem especificar uma doutrina adicional.
  alternative: “em mim se encontra o seu fruto” ou “de mim é encontrado o seu fruto”.
  rationale: A preposição מִן indica origem, enquanto o nifal de מצא admite expressão mais literal. A tradução mantém a afirmação teológica central sem definir além do texto a natureza do fruto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O pronome possessivo “seu” retoma Efraim. As notas preservam a ambiguidade do falante, a amplitude do verbo וַאֲשׁוּרֶנּוּ e a incerteza botânica de בְּרוֹשׁ.
