source:
  edition: WLC
  text: יֵֽלְכוּ֙ יֹֽנְקוֹתָ֔י/ו וִ/יהִ֥י כַ/זַּ֖יִת הוֹד֑/וֹ וְ/רֵ֥יחַֽ ל֖/וֹ כַּ/לְּבָנֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/007.yaml
  text: Its shoots will spread out[a], and its splendor will be like the olive tree[b], and its fragrance like Lebanon.
translation:
  language: pt
  text: 'Seus brotos se espalharão[a]; seu esplendor será como o da oliveira[b], e sua fragrância, como a do Líbano.


    [a] Ou “Seus ramos se estenderão” ou “Seus brotos tenros se espalharão”. O verbo hebraico significa literalmente “ir”, empregado aqui no sentido de estender-se para fora.


    [b] Ou “sua beleza” ou “sua majestade”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Seus ramos se estenderão” ou “Seus brotos tenros se espalharão”. O verbo hebraico significa literalmente “ir”, empregado aqui no sentido de estender-se para fora.
    reason: lexical_alternative
  - marker: b
    text: Ou “sua beleza” ou “sua majestade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵלְכוּ
  choice: se espalharão
  rationale: Embora o verbo signifique literalmente “ir/andar”, tendo “brotos” como sujeito na imagem vegetal ele descreve sua expansão para fora. “Se espalharão” comunica essa ideia em português natural sem desfazer a metáfora.
- source_word: יֹנְקוֹתָיו
  choice: seus brotos
  rationale: O substantivo designa brotos ou rebentos que retiram alimento da planta. “Brotos” é claro, atual e adequado à imagem agrícola.
- source_word: וִיהִי
  choice: será
  rationale: A forma dá continuidade à descrição futura da restauração. O futuro simples reproduz naturalmente essa sequência profética em português.
- source_word: כַזַּיִת
  choice: como o da oliveira
  rationale: A comparação é com o esplendor da oliveira. A construção “como o da oliveira” explicita de modo natural em português que o elemento comparado é o esplendor, sem acrescentar conteúdo à imagem.
- source_word: הוֹדוֹ
  choice: seu esplendor
  rationale: O termo pode indicar esplendor, beleza ou majestade. “Esplendor” preserva o tom elevado e se ajusta à aparência florescente da oliveira, sem adquirir aqui um sentido teológico indevido.
- source_word: וְרֵיחַ לוֹ
  choice: e sua fragrância
  rationale: A expressão é literalmente “e fragrância para ele”. No contexto, o sufixo retoma o povo restaurado sob a metáfora vegetal; a relação possessiva é a forma idiomática em português. “Fragrância” preserva o valor poético e positivo.
- source_word: כַלְּבָנוֹן
  choice: como a do Líbano
  rationale: O Líbano evoca o aroma célebre de suas florestas e vegetação. “Como a do Líbano” torna explícita a comparação com a fragrância e conserva diretamente o nome geográfico.
theological_decisions:
- issue: Referente dos sufixos da terceira pessoa do singular
  choice: Traduzir os sufixos como “seus/sua”, remetendo ao Israel/Efraim restaurado sob a metáfora de uma planta.
  alternative: Empregar formas que sugerissem mais diretamente um indivíduo masculino, acompanhando mecanicamente o gênero gramatical hebraico.
  rationale: Os sufixos hebraicos são masculinos singulares, mas retomam o povo restaurado retratado como planta ou árvore florescente. As formas possessivas portuguesas preservam naturalmente tanto o referente coletivo quanto a metáfora, sem sugerir um homem específico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição dos possessivos mantém a unidade da imagem vegetal; as elipses em “como o da oliveira” e “como a do Líbano” são idiomáticas e deixam claro que se comparam, respectivamente, o esplendor e a fragrância.
