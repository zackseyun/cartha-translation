  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָ/אָ֥רֶץ חָנְפָ֖ה תַּ֣חַת יֹשְׁבֶ֑י/הָ כִּֽי עָבְר֤וּ תוֹרֹת֙ חָ֣לְפוּ חֹ֔ק הֵפֵ֖רוּ בְּרִ֥ית עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/005.yaml
  text: The earth is defiled under its inhabitants[a], because they have transgressed laws, violated a statute[b], and broken the everlasting covenant.
translation:
  language: pt
  text: A terra está contaminada por causa de seus habitantes[a], pois eles transgrediram as leis, violaram uma norma estabelecida[b] e romperam a aliança eterna[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “sob seus habitantes”. A preposição hebraica pode exprimir aqui a causa.'
    reason: Preserva a imagem literal e esclarece o uso causal contextual de תַּחַת.
  - marker: b
    text: 'Ou: “alteraram uma norma estabelecida”.'
    reason: O verbo hebraico pode indicar violar ou ultrapassar uma ordenança, mas também pode ter o sentido de mudá-la.
  - marker: c
    text: A expressão “aliança eterna” não é identificada explicitamente aqui. Ela tem sido relacionada à aliança com Noé ou à ordem moral permanente estabelecida por Deus para a humanidade.
    reason: Preserva possibilidades interpretativas relevantes sem identificar a aliança no texto.
lexical_decisions:
- source_word: חָנְפָה
  choice: está profanada
  rationale: O verbo descreve a contaminação moral e religiosa da terra. “Está profanada” expressa o estado resultante sem restringir o sentido à impureza ritual.
- source_word: תַּחַת
  choice: sob
  rationale: Preserva a imagem espacial do hebraico, embora a preposição também possa indicar que a profanação ocorre por causa dos habitantes.
- source_word: יֹשְׁבֶיהָ
  choice: os seus habitantes
  rationale: Forma coletiva, clara e corrente para os que habitam a terra.
- source_word: עָבְרוּ
  choice: transgrediram
  rationale: No contexto jurídico e pactual, o verbo indica ultrapassar ou infringir normas, não simplesmente atravessar.
- source_word: תוֹרֹת
  choice: as leis
  rationale: O plural de תּוֹרָה designa aqui normas obrigatórias; “leis” comunica esse caráter com clareza.
- source_word: חָלְפוּ
  choice: violaram
  rationale: No paralelismo com transgredir leis e romper uma aliança, “violaram” expressa adequadamente a infração, enquanto a possível ideia de alteração é preservada em nota.
- source_word: חֹק
  choice: o estatuto
  rationale: Representa uma ordenança estabelecida. O artigo produz uma formulação natural em português sem identificar um estatuto específico.
- source_word: הֵפֵרוּ
  choice: romperam
  rationale: “Romper uma aliança” é linguagem pactual natural e traduz com clareza a ideia de quebrá-la ou invalidá-la.
- source_word: בְּרִית עוֹלָם
  choice: a aliança eterna
  rationale: Mantém a noção de uma aliança de duração permanente sem determinar no texto qual aliança está em vista.
theological_decisions:
- issue: Referente de “a aliança eterna”
  choice: Manter a expressão genérica “a aliança eterna”
  alternative: Identificá-la como a aliança com Noé, a ordem moral da criação ou uma aliança geral entre Deus e a humanidade
  rationale: O hebraico não identifica explicitamente a aliança neste versículo. A formulação ampla conserva a tensão interpretativa e evita introduzir uma conclusão doutrinária no texto.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A estrutura tríplice do hebraico foi preservada, assim como a imagem incomum de a terra estar profanada “sob” os seus habitantes; as ambiguidades relevantes aparecem em notas.
