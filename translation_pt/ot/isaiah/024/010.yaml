  - severity: medium
    issue: A nota b apresenta como literal uma paráfrase de finalidade.
    rationale: מִבּוֹא significa literalmente “de entrar” ou “quanto a entrar”; “para que não se entrasse” interpreta bem o efeito, mas não é uma tradução literal da construção.
  revised_text: A cidade do caos foi destruída[a]; toda casa foi fechada, de modo que ninguém pode entrar.[b]
