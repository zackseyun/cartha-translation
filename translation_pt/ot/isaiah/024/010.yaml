  text: נִשְׁבְּרָ֖ה קִרְיַת תֹּ֑הוּ סֻגַּ֥ר כָּל בַּ֖יִת מִ/בּֽוֹא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/010.yaml
  text: The city of chaos is broken down[b][a]; every house is shut up so that none may enter.
translation:
  language: pt
  text: A cidade do caos foi destruída[a]; toda casa foi fechada, de modo que ninguém pode entrar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A cidade do vazio” ou “A cidade da desolação”. O termo hebraico תֹּהוּ pode indicar caos, vazio ou desolação.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “toda casa foi fechada de entrar”. A construção hebraica indica que a entrada é impedida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁבְּרָה
  choice: foi arrasada
  rationale: O nifal perfeito de שׁבר expressa o estado resultante de ter sido quebrada ou destruída. No contexto urbano, “foi arrasada” comunica naturalmente ruína e colapso, sem sugerir apenas uma rachadura.
- source_word: קִרְיַת
  choice: A cidade do
  rationale: O construto de קִרְיָה significa “cidade de”; “a cidade do” reproduz de modo natural a relação de construto em português.
- source_word: תֹּהוּ
  choice: caos
  rationale: תֹּהוּ pode indicar caos, vazio, desolação ou ausência de forma. “Caos” preserva aqui a imagem abstrata e a tensão poética, enquanto a nota registra alternativas legítimas.
- source_word: סֻגַּר כָּל בַּיִת
  choice: todas as casas foram fechadas
  rationale: O pual perfeito de סגר tem sentido passivo, “foi fechado”. Embora o hebraico use o singular distributivo, o plural “todas as casas” é a forma mais corrente em português e mantém o sentido.
- source_word: מִבּוֹא
  choice: impedindo a entrada
  rationale: A construção מן com o infinitivo de בוא é literalmente “de entrar”. “Impedindo a entrada” explicita de forma concisa o resultado de as casas estarem fechadas, sem especificar um sujeito ausente do hebraico.
