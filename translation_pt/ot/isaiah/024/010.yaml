revisions:
- from: A cidade do caos foi arrasada[a]; todas as casas foram fechadas, impedindo a entrada.[b]
  to: A cidade do caos foi destruída[a]; toda casa foi fechada, de modo que ninguém pode entrar.[b]
  rationale: A revisão substitui “arrasada” por “destruída”, opção natural que evita intensificar indevidamente o sentido de שׁבר. Também ajusta a nota b para distinguir a construção literalmente concisa do hebraico de sua expressão idiomática em português. O singular distributivo “toda casa” acompanha mais de perto o hebraico, sem alterar o sentido coletivo.
