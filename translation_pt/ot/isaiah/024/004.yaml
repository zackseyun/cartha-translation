  source_fidelity: 'A tradução mantém adequadamente o paralelismo e a progressão do hebraico: אָבְלָה como lamento personificado, נָבְלָה como definhamento, as formas de אמל como enfraquecimento, e a sequência abrangente «terra / mundo / povo da terra». «Os elevados entre o povo da terra» reproduz de modo cauteloso a expressão incomum מְרוֹם עַם הָאָרֶץ, sem impor a interpretação mais específica «nobres».'
