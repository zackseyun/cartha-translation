  text: אָבְלָ֤ה נָֽבְלָה֙ הָ/אָ֔רֶץ אֻמְלְלָ֥ה נָבְלָ֖ה תֵּבֵ֑ל אֻמְלָ֖לוּ מְר֥וֹם עַם הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/004.yaml
  text: The earth mourns and withers[a]; the world wastes away and withers; the exalted people of the earth waste away.
translation:
  language: pt
  text: A terra pranteia e definha; o mundo enfraquece e definha; os elevados entre o povo da terra enfraquecem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a exaltação do povo da terra enfraquece”; também pode ser entendido como “os nobres da terra enfraquecem”. O hebraico fala literalmente da “altura” ou “elevação” do povo da terra.'
    reason: alternativa lexical e ambiguidade sintática
lexical_decisions:
- source_word: אָבְלָה
  choice: pranteia
  rationale: Preserva a personificação e a dimensão de luto do verbo אבל, distinguindo-o dos termos de declínio físico que seguem.
- source_word: נָבְלָה
  choice: definha
  rationale: Expressa o desvanecimento ou murchamento indicado por נבל e mantém a repetição poética nas duas ocorrências.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: A associação com תֵּבֵל e o horizonte universal do contexto favorecem o sentido de terra inteira, não apenas uma região.
- source_word: אֻמְלְלָה / אֻמְלָלוּ
  choice: enfraquece / enfraquecem
  rationale: O verbo אמל indica tornar-se fraco, abatido ou exaurido. A escolha diferencia esse verbo de נבל e concorda com os sujeitos singular e plural.
- source_word: תֵּבֵל
  choice: o mundo
  rationale: Designa o mundo habitado ou ordenado e forma um paralelo natural com 'a terra'.
- source_word: מְרוֹם עַם הָאָרֶץ
  choice: os elevados entre o povo da terra
  rationale: Conserva a metáfora hebraica de altura ou elevação e comunica que se trata das pessoas de posição elevada, sem restringi-las especificamente à nobreza.
theological_decisions:
- issue: Alcance da linguagem de juízo em הָאָרֶץ / תֵּבֵל
  choice: 'alcance universal: ''a terra'' / ''o mundo'''
  alternative: 'alcance local: ''a terra'' no sentido de ''a região'' ou ''o país'''
  rationale: O paralelismo entre הָאָרֶץ e תֵּבֵל e o horizonte amplo de Isaías 24 favorecem uma referência universal, sem acrescentar uma formulação teológica posterior.
- issue: Identidade de מְרוֹם עַם הָאָרֶץ
  choice: pessoas elevadas em posição entre o povo da terra
  alternative: a exaltação do povo da terra; os nobres da terra
  rationale: A construção hebraica é incomum e admite mais de uma análise. O texto principal preserva a imagem de elevação, enquanto a nota registra alternativas legítimas sem fixar indevidamente uma classe social específica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo poético preservado. 'Pranteia' mantém o tom solene sem ser arcaico; 'definha' e 'enfraquece' distinguem os dois verbos hebraicos de declínio.
