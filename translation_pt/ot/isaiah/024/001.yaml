  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הִנֵּ֧ה יְהוָ֛ה בּוֹקֵ֥ק הָ/אָ֖רֶץ וּ/בֽוֹלְקָ֑/הּ וְ/עִוָּ֣ה פָנֶ֔י/הָ וְ/הֵפִ֖יץ יֹשְׁבֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/001.yaml
  text: Behold[a], Yahweh is emptying the earth and laying it waste[b]; he will distort its surface and scatter its inhabitants.
translation:
  language: pt
  text: Eis que Yahweh está esvaziando a terra[a] e devastando-a; ele deformará sua superfície[b] e dispersará seus habitantes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a terra” no sentido de território ou país. O hebraico אֶרֶץ pode ter sentido regional ou universal; o contexto mais amplo favorece aqui “a terra” em sentido universal.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “sua face”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Introduz o anúncio profético com solenidade e chama enfaticamente a atenção para a ação iminente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בּוֹקֵק
  choice: está esvaziando
  rationale: O particípio retrata uma ação em curso ou prestes a ocorrer e conserva a imagem lexical de tornar a terra vazia.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: אֶרֶץ pode designar tanto uma terra ou país quanto a terra em sentido amplo; o contexto abrangente de Isaías 24 favorece aqui o sentido universal.
- source_word: וּבֹלְקָהּ
  choice: e devastando-a
  rationale: O verbo raro intensifica, em paralelo com בּוֹקֵק, a desolação da terra. 'Devastando-a' comunica naturalmente o resultado destrutivo, embora não reproduza o jogo sonoro hebraico.
- source_word: וְעִוָּה פָנֶיהָ
  choice: ele deformará sua superfície
  rationale: O verbo expressa torcer ou deformar, e 'superfície' transmite de modo claro o uso figurado de 'face' aplicado à terra, sem reduzir a imagem a uma simples mudança de aparência.
- source_word: וְהֵפִיץ יֹשְׁבֶיהָ
  choice: e dispersará seus habitantes
  rationale: '''Dispersará'' expressa o espalhamento das pessoas, e ''habitantes'' preserva naturalmente o sentido coletivo do particípio substantivado.'
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. A transliteração 'Yahweh' preserva o nome pessoal em vez de substituí-lo por um título, sem acrescentar interpretação denominacional.
- issue: Alcance de הָאָרֶץ
  choice: a terra, em sentido universal
  alternative: a terra ou o país, em sentido regional
  rationale: O substantivo admite ambos os sentidos. O horizonte abrangente do capítulo favorece o sentido universal, mas a nota conserva a ambiguidade lexical genuína.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. 'Eis que' mantém a força profética sem soar casual. Os futuros após os particípios representam a ação anunciada como iminente, e as notas preservam a ambiguidade de אֶרֶץ e a imagem literal de פָנֶיהָ.
