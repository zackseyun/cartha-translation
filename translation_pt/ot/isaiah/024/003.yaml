  text: הִבּ֧וֹק תִּבּ֛וֹק הָ/אָ֖רֶץ וְ/הִבּ֣וֹז תִּבּ֑וֹז כִּ֣י יְהוָ֔ה דִּבֶּ֖ר אֶת הַ/דָּבָ֥ר הַ/זֶּֽה׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/003.yaml
  text: The earth will be utterly emptied and utterly plundered[a], for Yahweh has spoken this word.
translation:
  language: pt
  text: A terra será completamente esvaziada e totalmente saqueada[a], pois Yahweh pronunciou esta palavra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O país será completamente esvaziado e totalmente saqueado.” O hebraico אֶרֶץ pode significar “país”, “terra” ou “mundo”; neste contexto mais amplo, “terra” em sentido mundial parece mais provável.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִבּוֹק תִּבּוֹק
  choice: será completamente esvaziada
  rationale: A construção com infinitivo absoluto e verbo finito intensifica a ação. A forma passiva de בקק comunica que a terra ficará vazia ou devastada; “completamente esvaziada” preserva tanto a voz passiva quanto a ênfase.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: אֶרֶץ pode designar “terra” em sentido local ou mundial. O horizonte amplo e cósmico de Isaías 24 favorece aqui o sentido mundial, embora a alternativa lexical permaneça possível.
- source_word: וְהִבּוֹז תִּבּוֹז
  choice: e totalmente saqueada
  rationale: A segunda construção com infinitivo absoluto e verbo finito também expressa forte intensificação. בזז significa saquear ou despojar; a formulação mantém o sentido passivo e o paralelismo enfático.
- source_word: כִּי
  choice: pois
  rationale: כִּי introduz a razão e a garantia do juízo anunciado. “Pois” é conciso e adequado ao registro profético.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O tetragrama é transliterado como nome próprio, em vez de ser substituído por um título.
- source_word: דִּבֶּר
  choice: pronunciou
  rationale: O perfeito apresenta a declaração divina como feita e estabelecida. “Pronunciou” transmite solenidade profética em português atual.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: esta palavra
  rationale: דָּבָר pode significar palavra, assunto ou coisa. Nesta fórmula profética, “palavra” comunica adequadamente um pronunciamento divino.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o tetragrama. A transliteração “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Alcance de הָאָרֶץ
  choice: a terra, em sentido mundial
  alternative: a terra, em sentido de país ou território
  rationale: O contexto abrangente de Isaías 24 favorece o alcance mundial, mas a nota registra a ambiguidade lexical genuína.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. Os advérbios “completamente” e “totalmente” reproduzem a dupla intensificação hebraica sem criar uma repetição artificial em português.
