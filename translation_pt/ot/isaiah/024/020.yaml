  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: נ֣וֹעַ תָּנ֤וּעַ אֶ֨רֶץ֙ כַּ/שִּׁכּ֔וֹר וְ/הִֽתְנוֹדְדָ֖ה כַּ/מְּלוּנָ֑ה וְ/כָבַ֤ד עָלֶ֨י/הָ֙ פִּשְׁעָ֔/הּ וְ/נָפְלָ֖ה וְ/לֹא תֹסִ֥יף קֽוּם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/020.yaml
  text: The earth will stagger like a drunkard[a], and sway back and forth like a hut; its transgression lies heavy upon it, and it will fall and not rise again.
translation:
  language: pt
  text: A terra cambaleará de um lado para outro como um bêbado e balançará como uma cabana[a]. Sua transgressão pesará sobre ela; ela cairá e não voltará a se levantar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como uma cabana de vigia” ou “como um abrigo temporário”; o termo hebraico indica um alojamento provisório e frágil.
    reason: lexical_alternative
lexical_decisions:
- source_word: נ֣וֹעַ תָּנ֤וּעַ
  choice: cambaleará de um lado para outro
  rationale: A construção com infinitivo absoluto e verbo finito intensifica a ideia de movimento instável. A expressão natural em português comunica tanto a ênfase quanto o movimento repetido, em harmonia com a comparação seguinte.
- source_word: אֶ֨רֶץ֙
  choice: a terra
  rationale: O contexto abrangente de Isaías 24 favorece a referência à terra como um todo, embora o termo também possa significar uma região ou país em outros contextos.
- source_word: כַשִּׁכּ֔וֹר
  choice: como um bêbado
  rationale: O substantivo designa uma pessoa embriagada. Esta formulação é concisa, corrente e não acrescenta uma especificação de gênero ausente do sentido lexical.
- source_word: וְהִֽתְנוֹדְדָ֖ה
  choice: e balançará
  rationale: A forma verbal descreve movimento instável ou oscilante. “Balançará” é natural e mantém a imagem de uma estrutura frágil sacudida de um lado para outro.
- source_word: כַמְּלוּנָ֑ה
  choice: como uma cabana
  rationale: O termo se refere a um abrigo ou alojamento temporário, geralmente frágil. “Cabana” preserva a imagem concreta; possibilidades mais específicas são registradas em nota.
- source_word: וְכָבַ֤ד עָלֶ֨יהָ֙ פִּשְׁעָ֔הּ
  choice: Sua transgressão pesará sobre ela
  rationale: A formulação conserva a metáfora da transgressão como um peso opressivo sobre a própria terra.
- source_word: וְנָפְלָ֖ה וְלֹא תֹסִ֥יף קֽוּם
  choice: ela cairá e não voltará a se levantar
  rationale: A sequência profética é expressa naturalmente no futuro. A construção יסף seguida de infinitivo indica que a ação não se repetirá; “não voltará a se levantar” comunica isso com clareza.
theological_decisions:
- issue: Alcance de אֶרֶץ no contexto do juízo de Isaías 24
  choice: a terra
  alternative: o país; a região
  rationale: O contexto do capítulo apresenta uma devastação de alcance universal, favorecendo “a terra”, sem acrescentar uma elaboração doutrinária além do discurso profético.
- issue: Sentido moral de פֶּשַׁע
  choice: transgressão
  alternative: rebelião
  rationale: “Transgressão” mantém a gravidade moral e a amplitude do termo hebraico. “Rebelião” é possível, mas explicitaria mais fortemente uma nuance que não precisa ser resolvida no texto principal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O paralelismo e as imagens concretas do hebraico foram preservados sem reproduzir de modo artificial a construção enfática. O marcador da nota foi colocado junto a “cabana”, termo ao qual a nota lexical se refere.
