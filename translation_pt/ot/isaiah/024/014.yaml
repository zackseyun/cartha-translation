  text: הֵ֛מָּה יִשְׂא֥וּ קוֹלָ֖/ם יָרֹ֑נּוּ בִּ/גְא֣וֹן יְהוָ֔ה צָהֲל֖וּ מִ/יָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/014.yaml
  text: They lift up their voice; they shout for joy. At the majesty of Yahweh[a], they cry aloud from the sea.
translation:
  language: pt
  text: Eles levantam a voz e gritam de alegria; pela majestade de Yahweh, bradam desde o mar[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desde o oeste” ou “desde as regiões costeiras”; em poesia profética, o hebraico “desde o mar” pode ter sentido geográfico.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: Eles
  rationale: O pronome masculino plural, que tem valor enfático no hebraico, é expresso naturalmente pelo sujeito explícito em português.
- source_word: יִשְׂאוּ קוֹלָם
  choice: levantam a voz
  rationale: Reproduz de modo natural a expressão idiomática hebraica para erguer ou elevar a voz; o singular coletivo do original é preservado.
- source_word: יָרֹנּוּ
  choice: gritam de alegria
  rationale: O verbo indica uma manifestação vocal jubilosa, que pode incluir canto, sem exigir que a ação seja especificamente musical.
- source_word: בִּגְאוֹן
  choice: diante da majestade de
  rationale: “Majestade” expressa a exaltação indicada por גָּאוֹן; “diante de” mantém aberta a relação poética da preposição בְּ, sem impor de modo categórico uma leitura causal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico em vez de substituí-lo por um título.
- source_word: צָהֲלוּ
  choice: bradam
  rationale: Comunica o som forte e retumbante de exultação e evita repetir a formulação verbal anterior.
- source_word: מִיָּם
  choice: desde o mar
  rationale: Mantém o sentido lexical direto de יָם e a força direcional de מִן; as possíveis referências ao oeste ou às regiões costeiras ficam registradas em nota.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o tetragrama; a transliteração “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título.
- issue: Relação expressa por בְּ em בִּגְאוֹן יְהוָה
  choice: diante da majestade de Yahweh
  alternative: por causa da majestade de Yahweh
  rationale: A preposição admite mais de uma relação no contexto poético. A redação escolhida evita tornar necessariamente causal uma construção que também pode descrever a reação perante a majestade divina.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo poético e vocabulário acessível. O marcador da nota foi colocado junto à expressão que ela esclarece.
