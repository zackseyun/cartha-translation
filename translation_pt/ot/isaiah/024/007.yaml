  text: The new wine mourns[a], the vine withers; all the glad of heart groan.
translation:
  language: pt
  text: O vinho novo pranteia, a videira murcha; gemem todos os alegres de coração.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָבַל
  choice: pranteia
  rationale: Preserva a personificação poética do vinho novo e o sentido predominante de lamento, em paralelo com o gemido humano no fim do verso.
- source_word: תִּירוֹשׁ
  choice: vinho novo
  rationale: Expressa o vinho fresco ou novo e mantém a distinção lexical do hebraico.
- source_word: אֻמְלְלָה
  choice: murcha
  rationale: Comunica o definhar da videira com uma imagem agrícola natural em português.
- source_word: גָפֶן
  choice: a videira
  rationale: É o equivalente português preciso e corrente para a planta que produz uvas.
- source_word: נֶאֶנְחוּ
  choice: gemem
  rationale: Transmite uma manifestação audível de aflição e corresponde ao tom de devastação do verso.
- source_word: כָּל
  choice: todos
  rationale: Representa naturalmente o sentido coletivo diante da expressão plural seguinte.
- source_word: שִׂמְחֵי לֵב
  choice: os alegres de coração
  rationale: Mantém de modo conciso e digno a imagem hebraica literalmente ligada à alegria do coração, sem substituir a expressão por uma interpretação psicológica mais específica.
