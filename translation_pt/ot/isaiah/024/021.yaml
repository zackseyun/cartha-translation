  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא יִפְקֹ֧ד יְהוָ֛ה עַל צְבָ֥א הַ/מָּר֖וֹם בַּ/מָּר֑וֹם וְ/עַל מַלְכֵ֥י הָ/אֲדָמָ֖ה עַל הָ/אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/021.yaml
  text: And on that day the LORD will punish the host of the height in the height, and the kings of the earth on the earth.
translation:
  language: pt
  text: Naquele dia, o SENHOR castigará o exército das alturas, nas alturas, e os reis da terra, sobre a terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִפְקֹד
  choice: castigará
  rationale: Neste contexto de juízo, o verbo פקד tem sentido punitivo; “castigará” comunica isso com clareza sem especificar além do hebraico a forma do castigo.
- source_word: צְבָא הַמָּרוֹם
  choice: o exército das alturas
  rationale: Preserva a expressão espacial e coletiva do hebraico, bem como sua possível referência a poderes celestes, sem resolver explicitamente a identidade do grupo.
- source_word: בַּמָּרוֹם
  choice: nas alturas
  rationale: Mantém a repetição deliberada de מרום e evita identificar de modo mais específico o lugar como “céu”.
- source_word: מַלְכֵי הָאֲדָמָה
  choice: os reis da terra
  rationale: Equivalente natural e direto, preservando o contraste entre os poderes das alturas e os governantes terrestres.
- source_word: עַל הָאֲדָמָה
  choice: sobre a terra
  rationale: Reproduz a preposição עַל e a repetição de אֲדָמָה; embora “na terra” seja mais idiomático, “sobre a terra” conserva melhor o paralelismo formal.
theological_decisions:
- issue: Identidade do “exército das alturas”
  choice: Manter a designação figurativa e espacial sem explicação no corpo do texto.
  alternative: Traduzir como “exército celestial”, “seres celestiais” ou “poderes do céu”.
  rationale: O hebraico não identifica expressamente esses seres; a formulação escolhida preserva a ambiguidade e a tensão entre a esfera superior e os reis terrenos.
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: Segue a convenção bíblica portuguesa amplamente reconhecida de representar o Tetragrama por “SENHOR” em versaletes, sem introduzir uma vocalização no texto principal.
translation_notes:
  register: 'Português moderno, digno e de ampla compreensão. A sintaxe conserva o paralelismo do hebraico: “das alturas, nas alturas” em contraste com “da terra, sobre a terra”. “Naquele dia” é a forma idiomática natural para וְהָיָה בַּיּוֹם הַהוּא, sem necessidade de reproduzir mecanicamente o verbo introdutório.'
