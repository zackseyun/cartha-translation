  yaml_path: translation/ot/isaiah/024/017.yaml
  text: Terror and the pit and the snare are upon you[a], inhabitant of the earth.
translation:
  language: pt
  text: Terror, cova e laço estão sobre você, habitante da terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pavor, cova e laço estão sobre você, você que habita na terra.”'
    reason: Registra a alternativa lexical “pavor” para פַּחַד e uma forma verbal natural para o vocativo participial, sem alterar o sentido essencial.
lexical_decisions:
- source_word: פַּחַד
  choice: Terror
  rationale: Expressa medo ou pavor; no trio de juízo com cova e laço, “terror” comunica com força a ameaça iminente, embora a aliteração hebraica não possa ser reproduzida naturalmente.
- source_word: פַחַת
  choice: cova
  rationale: Designa uma cova usada como armadilha. “Cova” é direta, concisa e mantém a distinção em relação ao laço.
- source_word: פָח
  choice: laço
  rationale: Designa uma armadilha, especialmente para capturar animais. “Laço” preserva a imagem poética e se distingue de “cova”.
- source_word: עָלֶיךָ
  choice: estão sobre você
  rationale: Conserva literalmente a preposição “sobre” e supre o verbo exigido pelo português, mantendo a imediatez da oração nominal hebraica.
- source_word: יוֹשֵׁב הָאָרֶץ
  choice: habitante da terra
  rationale: Mantém o particípio singular em função vocativa e o alcance amplo de אֶרֶץ no contexto de Isaías 24.
theological_decisions:
- issue: Alcance de הָאָרֶץ
  choice: terra
  alternative: país
  rationale: O contexto de Isaías 24 apresenta um juízo de alcance amplo. “Terra” preserva essa dimensão sem tornar a tradução mais específica do que o hebraico.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. A sequência nominal breve preserva o tom oracular e a tríade enfática do hebraico; não se tentou imitar artificialmente a aliteração פַּחַד–פַחַת–פָח.
