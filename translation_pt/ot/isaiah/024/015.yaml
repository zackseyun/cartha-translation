base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/015.yaml
  text: Therefore in the east give glory to Yahweh; in the coastlands of the sea[a], to the name of Yahweh, the God of Israel.
translation:
  language: pt
  text: Por isso, no oriente[a], deem glória a Yahweh; nas terras costeiras do mar, deem glória ao nome de Yahweh, o Deus de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «nas regiões da luz»; o termo hebraico é difícil e também tem sido entendido como «nos fogos».
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Expressa de modo natural a inferência que liga esta exortação ao contexto anterior.
- source_word: בָּאֻרִים
  choice: nas regiões da luz
  rationale: A forma hebraica é difícil. Esta tradução mantém a imagem lexical de luzes e admite um possível sentido geográfico, sem reduzi-la silenciosamente a “oriente”; outras leituras são registradas em nota.
- source_word: כַּבְּדוּ
  choice: deem glória
  rationale: O imperativo plural de כבד pede que os destinatários atribuam honra e glória a Deus; “deem glória” é corrente e preserva a força verbal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: בְּאִיֵּי הַיָּם
  choice: nas terras costeiras do mar
  rationale: אִיִּים pode designar ilhas ou regiões costeiras, especialmente terras marítimas distantes. A formulação conserva a amplitude geográfica e a imagem do hebraico.
- source_word: שֵׁם יְהוָה
  choice: ao nome de Yahweh
  rationale: Mantém a expressão hebraica que destaca o nome revelado de Deus.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reproduz diretamente a construção que identifica Yahweh como o Deus de Israel.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz explicitamente o Tetragrama; “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Interpretação de בָּאֻרִים
  choice: nas regiões da luz
  alternative: no oriente; entre os fogos
  rationale: A palavra é lexicalmente difícil. A escolha conserva sua associação mais transparente com “luz” e pode comportar uma referência geográfica, enquanto a nota preserva as principais alternativas sem eliminar a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com imperativo plural inclusivo e legível no Brasil. A ordem poética e o paralelismo geográfico do hebraico foram preservados.
