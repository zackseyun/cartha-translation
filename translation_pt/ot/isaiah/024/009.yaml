  yaml_path: translation/ot/isaiah/024/009.yaml
  text: They do not drink wine with a song[a]; strong drink is bitter to those who drink it.
translation:
  language: pt
  text: Não bebem vinho com canto[a]; a bebida forte é amarga para os que a bebem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não beberão vinho com canto”. O imperfeito hebraico também pode ser entendido como futuro, e בַּשִּׁיר pode significar “em canto” ou “enquanto cantam”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשִּׁיר
  choice: ao som de canções
  rationale: 'A preposição בְּ com שִׁיר indica naturalmente acompanhamento ou circunstância: já não se bebe vinho acompanhado de canto. A formulação é idiomática em português e preserva a imagem poética.'
- source_word: לֹא יִשְׁתּוּ
  choice: não bebem
  rationale: O imperfeito hebraico pode descrever vividamente a situação presente ou apontar para o futuro. O presente preserva a descrição vívida sem fixar em excesso a temporalidade; a alternativa futura é registrada em nota.
- source_word: יַיִן
  choice: vinho
  rationale: Equivalente português comum e direto para יַיִן.
- source_word: יֵמַר
  choice: é amarga
  rationale: O verbo מרר expressa ser ou tornar-se amargo. Aqui, o valor predicativo conciso comunica que a bebida antes prazerosa agora é amarga.
- source_word: שֵׁכָר
  choice: bebida forte
  rationale: Designa bebida alcoólica distinta do vinho comum. 'Bebida forte' mantém a distinção lexical de יַיִן e é compreensível em português amplo.
- source_word: לְשֹׁתָיו
  choice: para os que a bebem
  rationale: A forma se refere aos seus bebedores. A expressão explicita naturalmente em português o objeto retomado pelo pronome.
