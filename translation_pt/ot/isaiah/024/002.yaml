base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/002.yaml
  text: 'And it shall be: as with the people[a], so with the priest; as with the slave, so with his master; as with the female slave, so with her mistress; as with the buyer, so with the seller; as with the lender, so with the borrower; as with the creditor, so with the one indebted to him.'
translation:
  language: pt
  text: E acontecerá o mesmo com o povo e com o sacerdote, com o escravo e com o seu senhor, com a escrava e com a sua senhora, com o comprador e com o vendedor, com quem empresta e com quem toma emprestado, com o credor e com quem lhe deve[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “como o credor, assim como aquele de quem ele cobra”.
    reason: A formulação hebraica da segunda parte do par é incomum; a tradução comunica o sentido contextual de devedor, enquanto a nota preserva mais precisamente a imagem de cobrança expressa no hebraico.
lexical_decisions:
- source_word: וְהָיָה
  choice: E acontecerá
  rationale: A fórmula introduz o estado de coisas futuro anunciado pelo profeta; esta forma é natural em português e mantém o tom profético.
- source_word: כָעָם כַּכֹּהֵן
  choice: o mesmo com o povo e com o sacerdote
  rationale: As preposições comparativas repetidas indicam que ambos receberão o mesmo tratamento; a formulação portuguesa reproduz com clareza essa igualdade de destino.
- source_word: כַּעֶבֶד כַּאדֹנָיו
  choice: com o escravo e com o seu senhor
  rationale: עֶבֶד designa aqui uma condição social subordinada, enquanto אֲדֹנָיו é o superior humano correspondente.
- source_word: כַּשִּׁפְחָה כַּגְבִרְתָּהּ
  choice: com a escrava e com a sua senhora
  rationale: Os termos formam o par feminino paralelo de pessoa escravizada e superiora doméstica; “senhora” é mais natural e menos ambíguo que “mestra” neste contexto.
- source_word: כַּקּוֹנֶה כַּמּוֹכֵר
  choice: com o comprador e com o vendedor
  rationale: Os particípios substantivados exprimem os papéis econômicos contrapostos de comprar e vender.
- source_word: כַּמַּלְוֶה כַּלֹּוֶה
  choice: com quem empresta e com quem toma emprestado
  rationale: A expressão verbal evita a possível ambiguidade de “emprestador” e apresenta naturalmente em português os dois lados do empréstimo.
- source_word: כַּנֹּשֶׁה כַּאֲשֶׁר נֹשֶׁא בוֹ
  choice: com o credor e com quem lhe deve
  rationale: “Credor” comunica a função de quem cobra uma dívida; “quem lhe deve” oferece o contraponto econômico exigido pelo paralelismo, sem apagar em nota a expressão incomum do hebraico.
