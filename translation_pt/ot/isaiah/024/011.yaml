  text: צְוָחָ֥ה עַל הַ/יַּ֖יִן בַּֽ/חוּצ֑וֹת עָֽרְבָה֙ כָּל שִׂמְחָ֔ה גָּלָ֖ה מְשׂ֥וֹשׂ הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/011.yaml
  text: There is an outcry over the wine in the streets[a]; all joy has grown dark[b]; the gladness of the earth has gone away.
translation:
  language: pt
  text: Há um clamor pelo vinho nas ruas; toda a alegria escureceu[a]; o júbilo da terra foi-se[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “toda a alegria anoiteceu”, preservando de modo mais literal a imagem hebraica da alegria que escurece como ao cair da noite.'
    reason: alternativa lexical
  - marker: b
    text: 'Ou: “o júbilo do país foi-se”.'
    reason: leitura alternativa
lexical_decisions:
- source_word: צְוָחָה
  choice: Há um clamor
  rationale: O substantivo indica um grito coletivo de aflição. A construção existencial é natural em português e preserva sua força nominal.
- source_word: עַל הַיַּיִן
  choice: pelo vinho
  rationale: A preposição pode indicar o objeto ou a causa do lamento. “Pelo vinho” mantém aberta a relação exata, sem explicitar que o clamor ocorre necessariamente por sua falta.
- source_word: בַּחוּצוֹת
  choice: nas ruas
  rationale: O termo designa espaços públicos abertos, como ruas e praças; “nas ruas” é claro, natural e adequado à cena de lamento público.
- source_word: עָרְבָה כָּל שִׂמְחָה
  choice: toda a alegria escureceu
  rationale: O verbo evoca o escurecer ou o cair da noite. A tradução conserva a imagem poética aplicada à alegria, em vez de reduzi-la a “desapareceu”.
- source_word: גָּלָה
  choice: foi-se
  rationale: O verbo pode indicar afastamento, remoção ou exílio. Com “júbilo” como sujeito, “foi-se” comunica partida sem tornar explícita demais a possível metáfora de exílio.
- source_word: מְשׂוֹשׂ
  choice: o júbilo
  rationale: O substantivo expressa alegria intensa ou festiva. “Júbilo” distingue levemente o termo de שִׂמְחָה, traduzido como “alegria” na oração anterior.
- source_word: הָאָרֶץ
  choice: da terra
  rationale: No contexto abrangente de Isaías 24, “terra” comunica melhor o alcance universal do que uma referência restrita a determinada região.
theological_decisions:
- issue: Alcance de הָאָרֶץ
  choice: terra
  alternative: país ou região
  rationale: A linguagem de juízo ao longo do capítulo tem alcance amplo e universal. “Terra” respeita esse contexto sem restringir o oráculo a um território específico.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. “Escureceu” preserva a imagem incomum do hebraico; “foi-se” mantém a metáfora de partida de forma concisa. Todos os marcadores de nota aparecem no texto principal junto às expressões pertinentes.
