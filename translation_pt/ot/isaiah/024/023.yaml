  text: וְ/חָֽפְרָה֙ הַ/לְּבָנָ֔ה וּ/בוֹשָׁ֖ה הַֽ/חַמָּ֑ה כִּֽי מָלַ֞ךְ יְהוָ֣ה צְבָא֗וֹת בְּ/הַ֤ר צִיּוֹן֙ וּ/בִ/יר֣וּשָׁלִַ֔ם וְ/נֶ֥גֶד זְקֵנָ֖י/ו כָּבֽוֹד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/023.yaml
  text: Then the moon will be ashamed[a], and the sun disgraced, for Yahweh of hosts reigns on Mount Zion and in Jerusalem[b], and before his elders there is glory.
translation:
  language: pt
  text: Então a lua ficará envergonhada, e o sol será desonrado, pois Yahweh dos Exércitos reina no monte Sião e em Jerusalém; diante dos seus anciãos[a], há glória[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O possessivo pode referir-se a Yahweh (“os anciãos dele”) ou a Sião/Jerusalém (“os anciãos dela”).
    reason: alternative_reading
  - marker: b
    text: O hebraico termina de modo conciso apenas com “glória”. Também pode ser entendido como “diante dos seus anciãos está a sua glória” ou, simplesmente, “diante dos seus anciãos, glória”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָפְרָה
  choice: ficará envergonhada
  rationale: Neste contexto, חפר expressa vergonha ou humilhação, não o sentido literal de cavar. O futuro se ajusta ao horizonte profético e à personificação da lua.
- source_word: וּבוֹשָׁה
  choice: será desonrado
  rationale: בוש também pertence ao campo semântico da vergonha. “Será desonrado” preserva o paralelismo sem repetir exatamente a expressão anterior.
- source_word: הַלְּבָנָה ... הַחַמָּה
  choice: a lua ... o sol
  rationale: No paralelismo poético, os substantivos designam inequivocamente a lua e o sol.
- source_word: כִּי
  choice: pois
  rationale: 'Introduz naturalmente a razão da humilhação dos astros: o reinado e a glória de Yahweh.'
- source_word: מָלַךְ
  choice: reina
  rationale: O qatal, em contexto profético, pode apresentar o reinado como realidade certa e vívida. O presente português conserva essa força sem determinar de modo excessivo se o sentido é presente, futuro ou ingressivo.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino e traduz צְבָאוֹת por uma expressão ampla, capaz de evocar as hostes ou forças sob seu comando sem reduzi-la ao título interpretativo “Todo-Poderoso”.
- source_word: בְּהַר צִיּוֹן וּבִירוּשָׁלִַם
  choice: no monte Sião e em Jerusalém
  rationale: Emprega as preposições idiomáticas em português para um monte e uma cidade.
- source_word: וְנֶגֶד זְקֵנָיו
  choice: diante dos seus anciãos
  rationale: נֶגֶד indica presença ou posição diante de alguém. O possessivo traduz o sufixo masculino singular sem explicitar no corpo do texto seu referente discutível.
- source_word: כָּבוֹד
  choice: há glória
  rationale: O substantivo final isolado forma uma oração nominal concisa. A inserção de “há” produz português natural sem acrescentar um possessivo ausente do hebraico.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou a substituição por “SENHOR”
  rationale: A transliteração preserva no texto o nome pessoal presente no hebraico, em vez de substituí-lo por um título.
- issue: Referente do sufixo em זְקֵנָיו
  choice: “seus anciãos”, provavelmente os de Yahweh
  alternative: “seus anciãos”, referindo-se a Sião/Jerusalém
  rationale: O sujeito divino é o antecedente mais natural, mas a construção hebraica admite que o possessivo seja relacionado a Sião/Jerusalém; a nota preserva essa ambiguidade.
- issue: Relação de כָּבוֹד com a oração final
  choice: “há glória”, sem possessivo explícito
  alternative: “está a sua glória” ou simplesmente “glória”
  rationale: O hebraico termina de forma terse com o substantivo “glória” e não traz sufixo possessivo. A tradução principal é idiomática, enquanto a nota registra as outras construções possíveis.
translation_notes:
  register: Português atual, solene e amplamente compreensível, com boa legibilidade brasileira. O paralelismo poético foi mantido, e o ponto e vírgula destaca a oração nominal final sem alterar sua relação com o restante do versículo.
