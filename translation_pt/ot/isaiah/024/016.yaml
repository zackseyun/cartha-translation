source:
  edition: WLC
  text: מִ/כְּנַ֨ף הָ/אָ֜רֶץ זְמִרֹ֤ת שָׁמַ֨עְנוּ֙ צְבִ֣י לַ/צַּדִּ֔יק וָ/אֹמַ֛ר רָזִי לִ֥/י רָֽזִי לִ֖/י א֣וֹי לִ֑/י בֹּגְדִ֣ים בָּגָ֔דוּ וּ/בֶ֥גֶד בּוֹגְדִ֖ים בָּגָֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/016.yaml
  text: 'From the edge of the earth we hear songs: “Glory to the righteous one.” But I say[a], “I waste away, I waste away. Woe is me!” The treacherous deal treacherously[c][b]; with treachery the treacherous deal treacherously.'
translation:
  language: pt
  text: 'Da extremidade da terra[a], ouvimos cânticos: “Glória ao justo[b]!” Mas eu digo: “Definho, definho[c]! Ai de mim!” Os desleais agem deslealmente; com deslealdade, os desleais agem deslealmente.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “da asa da terra”; também pode ser entendido como “dos confins da terra”.
    reason: lexical_alternative
  - marker: b
    text: Ou “Glória aos justos”, caso a expressão singular seja entendida coletivamente.
    reason: alternative_reading
  - marker: c
    text: O hebraico é difícil. Tradicionalmente, a expressão é entendida como um grito de definhamento ou emagrecimento; outra possibilidade é “Meu segredo é meu” ou “Há um mistério para mim”.
    reason: alternative_reading
lexical_decisions:
- source_word: מִכְּנַף הָאָרֶץ
  choice: Da extremidade da terra
  rationale: כָּנָף significa literalmente “asa”, mas, neste uso geográfico, indica uma borda ou extremidade. “Extremidade da terra” preserva o singular hebraico e comunica o sentido idiomático sem eliminar a metáfora original, registrada em nota.
- source_word: זְמִרֹת
  choice: cânticos
  rationale: O termo designa canções ou música. “Cânticos” é natural no registro poético e não acrescenta explicitamente a ideia de louvor.
- source_word: שָׁמַעְנוּ
  choice: ouvimos
  rationale: A forma portuguesa pode funcionar como presente ou passado perfeito, preservando adequadamente a vivacidade e certa abertura temporal do perfeito hebraico neste discurso profético.
- source_word: צְבִי לַצַּדִּיק
  choice: Glória ao justo
  rationale: צְבִי pode denotar beleza, esplendor, glória ou honra. “Glória” expressa bem a aclamação, enquanto “ao justo” conserva a forma singular sem definir sua identidade.
- source_word: וָאֹמַר
  choice: Mas eu digo
  rationale: “Mas” explicita o forte contraste contextual entre os cânticos ouvidos e o lamento seguinte. O presente mantém a imediação do discurso profético.
- source_word: רָזִי לִי רָזִי לִי
  choice: Definho, definho
  rationale: A expressão hebraica é difícil. A interpretação tradicional a relaciona à magreza ou ao definhamento; “definho” transmite o lamento com naturalidade, enquanto a alternativa “meu segredo” é preservada em nota.
- source_word: אוֹי לִי
  choice: Ai de mim!
  rationale: Equivalente português corrente e expressivo para a exclamação hebraica de aflição.
- source_word: בֹּגְדִים בָּגָדוּ
  choice: Os desleais agem deslealmente
  rationale: A tradução mantém a repetição enfática da raiz בגד e seu sentido de conduta desleal ou traiçoeira.
- source_word: וּבֶגֶד בּוֹגְדִים בָּגָדוּ
  choice: com deslealdade, os desleais agem deslealmente
  rationale: A repetição deliberadamente pesada reproduz o acúmulo retórico do substantivo, do particípio e do verbo derivados da mesma raiz hebraica.
theological_decisions:
- issue: Referente de לַצַּדִּיק
  choice: ao justo
  alternative: aos justos / ao povo justo
  rationale: O hebraico apresenta a expressão no singular definido, mas não identifica o referente. A tradução conserva o singular e evita impor uma identificação messiânica, individual ou coletiva; a possibilidade coletiva é indicada em nota.
- issue: Sentido de רָזִי לִי
  choice: Definho
  alternative: Meu segredo é meu / Há um mistério para mim
  rationale: O contexto de aflição favorece a interpretação tradicional ligada ao definhamento, mas a dificuldade lexical e a leitura alternativa são reconhecidas explicitamente, sem apagar a ambiguidade.
translation_notes:
  register: Português atual, digno e poético, com ampla legibilidade brasileira. A repetição incomum no final foi mantida de propósito para refletir a forte figura etimológica do hebraico. As exclamações comunicam a mudança abrupta da aclamação para o lamento.
