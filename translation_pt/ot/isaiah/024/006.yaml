source:
  edition: WLC
  text: עַל כֵּ֗ן אָלָה֙ אָ֣כְלָה אֶ֔רֶץ וַֽ/יֶּאְשְׁמ֖וּ יֹ֣שְׁבֵי בָ֑/הּ עַל כֵּ֗ן חָרוּ֙ יֹ֣שְׁבֵי אֶ֔רֶץ וְ/נִשְׁאַ֥ר אֱנ֖וֹשׁ מִזְעָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/006.yaml
  text: Therefore a curse has devoured the earth[a], and those who dwell in it bear their guilt; therefore the inhabitants of the earth are scorched[c][b], and few men are left.
translation:
  language: pt
  text: Por isso, uma maldição devorou a terra[a], e os que nela habitam carregam sua culpa. Por isso, os habitantes da terra[b] foram abrasados, e restaram poucos seres humanos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um juramento devorou a terra”. A palavra hebraica pode significar “juramento” ou “maldição”; neste contexto de aliança violada e juízo, “maldição” parece mais provável.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a terra” e “os habitantes da terra” em sentido mais localizado, isto é, “a região” e “os habitantes da região”. Aqui, o contexto mais amplo do capítulo favorece “terra” em sentido abrangente.'
    reason: alternative_reading
  - marker: c
    text: 'Hebraico: “mortal” ou “homem”, no singular coletivo; isto é, seres humanos. O termo pode enfatizar a condição humana mortal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Expressa com naturalidade a consequência da acusação apresentada no versículo anterior e preserva a força causal da locução hebraica.
- source_word: אָלָה
  choice: uma maldição
  rationale: Embora o termo também possa significar “juramento”, o contexto de aliança violada e juízo favorece “maldição”.
- source_word: אָכְלָה
  choice: devorou
  rationale: Preserva a metáfora vívida do verbo אכל, literalmente “comer”, aqui com o sentido destrutivo de devorar.
- source_word: אֶרֶץ
  choice: a terra
  rationale: O horizonte amplo de Isaías 24 favorece a referência ao mundo habitado, e não apenas a uma região; em português, “terra” mantém essa amplitude conforme o contexto.
- source_word: וַיֶּאְשְׁמוּ
  choice: carregam sua culpa
  rationale: Conserva tanto a culpabilidade dos habitantes quanto a ideia de suportarem suas consequências, sem reduzir o verbo apenas à punição.
- source_word: יֹשְׁבֵי בָהּ
  choice: os que nela habitam
  rationale: Reproduz com clareza a construção participial e seu sentido contínuo.
- source_word: חָרוּ
  choice: foram consumidos
  rationale: O verbo pode indicar queimar, abrasar ou ressecar. “Foram consumidos” comunica o juízo destrutivo sem especificar indevidamente o mecanismo.
- source_word: יֹשְׁבֵי אֶרֶץ
  choice: os habitantes da terra
  rationale: Equivalente português natural para a expressão construta hebraica e coerente com a ocorrência anterior.
- source_word: וְנִשְׁאַר
  choice: restaram
  rationale: Expressa o sentido do nifal de שׁאר, isto é, ser deixado ou permanecer como remanescente.
- source_word: אֱנוֹשׁ
  choice: seres humanos
  rationale: O substantivo singular coletivo designa a humanidade mortal; “seres humanos” preserva a abrangência sem sugerir apenas pessoas do sexo masculino.
- source_word: מִזְעָר
  choice: pouquíssimos
  rationale: Comunica de modo conciso que o número dos sobreviventes é extremamente reduzido.
theological_decisions:
- issue: Sentido de אָלָה no contexto de juízo
  choice: maldição de caráter judicial e pactual
  alternative: juramento
  rationale: O versículo anterior menciona leis transgredidas e aliança violada; portanto, “maldição” apresenta a consequência judicial, sem eliminar a alternativa lexical em nota.
- issue: Alcance de אֶרֶץ
  choice: terra em sentido amplo
  alternative: terra ou país em sentido localizado
  rationale: A retórica do capítulo apresenta alcance universal, embora o substantivo hebraico possa, em outros contextos, referir-se a uma região ou país.
- issue: Referência coletiva de אֱנוֹשׁ
  choice: seres humanos
  alternative: homens; humanidade
  rationale: O singular coletivo refere-se a seres humanos mortais em geral. A formulação escolhida transmite essa abrangência sem acrescentar uma restrição de sexo.
- issue: Natureza do juízo expresso por חָרוּ
  choice: foram consumidos
  alternative: foram abrasados; ficaram ressequidos
  rationale: O hebraico admite nuances de calor, queima ou ressecamento. A escolha conserva a imagem de devastação e uma nota registra a incerteza lexical.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “Por isso” e “terra” foi mantida por corresponder à estrutura enfática do hebraico. “Pouquíssimos seres humanos” torna natural em português a combinação do coletivo singular אֱנוֹשׁ com a ideia de número diminuto.
