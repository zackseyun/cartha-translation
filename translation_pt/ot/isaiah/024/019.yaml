  text: רֹ֥עָה הִֽתְרֹעֲעָ֖ה הָ/אָ֑רֶץ פּ֤וֹר הִֽתְפּוֹרְרָה֙ אֶ֔רֶץ מ֥וֹט הִֽתְמוֹטְטָ֖ה אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/019.yaml
  text: The earth is utterly shattered[a]; the earth is completely broken apart; the earth is violently shaken.
translation:
  language: pt
  text: A Terra será totalmente despedaçada[a]; a Terra se partirá por completo; a Terra será sacudida com violência.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, em todas as três ocorrências, “a terra”, no sentido de uma região ou território.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעָה הִתְרֹעֲעָה
  choice: será totalmente despedaçada
  rationale: O infinitivo absoluto seguido do verbo conjugado intensifica a ação. “Totalmente despedaçada” comunica com clareza a força destrutiva de רעע e reproduz a ênfase hebraica em português natural.
- source_word: הָאָרֶץ / אֶרֶץ / אָרֶץ
  choice: a Terra
  rationale: אֶרֶץ pode designar tanto a terra habitada em sentido amplo quanto uma terra ou território. O contexto de juízo abrangente em Isaías 24 favorece “a Terra”; a repetição nas três orações preserva o ritmo enfático do hebraico.
- source_word: פּוֹר הִתְפּוֹרְרָה
  choice: se partirá por completo
  rationale: A construção intensiva descreve desagregação ou ruptura. Esta formulação distingue a segunda oração da primeira e expressa de modo corrente a ideia de a terra se romper inteiramente.
- source_word: מוֹט הִתְמוֹטְטָה
  choice: será sacudida com violência
  rationale: מוט indica cambalear, vacilar ou ser abalado. No quadro de convulsão catastrófica, “será sacudida com violência” preserva a intensidade da construção e soa natural em português.
theological_decisions: []
translation_notes:
  register: Linguagem poética, solene e atual. Mantém-se a estrutura tríplice e a repetição de “a Terra”, bem como a intensificação de cada oração. O futuro apresenta naturalmente em português o juízo anunciado no contexto profético, sem eliminar a força assertiva das formas hebraicas.
