  text: נִשְׁאַ֥ר בָּ/עִ֖יר שַׁמָּ֑ה וּ/שְׁאִיָּ֖ה יֻכַּת שָֽׁעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/012.yaml
  text: Desolation is left in the city[a], and the gate is battered into ruins.
translation:
  language: pt
  text: Resta desolação na cidade[a], e o portão é reduzido a ruínas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A devastação permanece na cidade, e o portão é esmagado até ficar em ruínas.”'
    reason: Alternativa lexical que torna explícitos tanto o sentido de permanência de נִשְׁאַר quanto a força destrutiva passiva de יֻכַּת.
lexical_decisions:
- source_word: נִשְׁאַר
  choice: Resta
  rationale: O nifal de שׁאר indica aquilo que permanece ou é deixado após a devastação. “Resta” reproduz com concisão e naturalidade a construção hebraica.
- source_word: בָּעִיר
  choice: na cidade
  rationale: עִיר significa normalmente “cidade”; a preposição e o artigo prefixados são vertidos diretamente por “na cidade”.
- source_word: שַׁמָּה
  choice: desolação
  rationale: O substantivo denota devastação ou estado de abandono. “Desolação” preserva o sentido e funciona naturalmente como sujeito posposto em português.
- source_word: וּשְׁאִיָּה
  choice: a ruínas
  rationale: שְׁאִיָּה designa ruína ou devastação. A expressão portuguesa “reduzido a ruínas” comunica de modo idiomático o resultado destrutivo.
- source_word: יֻכַּת
  choice: é reduzido
  rationale: O hofal de כתת exprime ser golpeado, esmagado ou triturado. Com “a ruínas”, “é reduzido” transmite a força passiva e o resultado sem produzir uma formulação artificial.
- source_word: שָׁעַר
  choice: o portão
  rationale: שַׁעַר é o portão, aqui evidentemente o da cidade. “Portão” é claro e corrente em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com equivalência ótima. A ordem inicial “Resta desolação” mantém a ênfase do hebraico sem soar arcaica; “é reduzido a ruínas” expressa naturalmente a combinação de ação passiva e resultado.
