revisions:
- from: E acontecerá que quem fugir do som do terror cairá na cova, e quem sair do meio da cova será apanhado na armadilha; pois as janelas do alto se abriram[a], e os fundamentos da terra tremem.
  to: E acontecerá que quem fugir do som do terror cairá na cova, e quem subir de dentro da cova será apanhado na armadilha; pois as janelas do alto se abriram[a], e os fundamentos da terra tremem.
  rationale: A única alteração substitui “sair do meio da cova” por “subir de dentro da cova”, a fim de refletir explicitamente o sentido de עולה (“subir”) e a expressão espacial “de dentro”, sem alterar o sentido ou o registro. A nota permanece corretamente ancorada em “janelas do alto”.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:30:20Z'
review_pass:
