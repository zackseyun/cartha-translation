    issue: O movimento de subida é atenuado em “quem sair do meio da cova”.
    rationale: וְהָעוֹלֶה significa literalmente “o que sobe”; “sair” comunica a saída, mas não o movimento ascendente. “Subir de dentro da cova” mantém ambos os elementos de modo idiomático.
  revised_text: E acontecerá que quem fugir do som do terror cairá na cova, e quem subir de dentro da cova será apanhado na armadilha; pois as janelas do alto se abriram[a], e os fundamentos da terra tremem.
  revised_footnotes:
