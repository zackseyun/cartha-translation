  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְֽ֠/הָיָה הַ/נָּ֞ס מִ/קּ֤וֹל הַ/פַּ֨חַד֙ יִפֹּ֣ל אֶל הַ/פַּ֔חַת וְ/הָֽ/עוֹלֶה֙ מִ/תּ֣וֹךְ הַ/פַּ֔חַת יִלָּכֵ֖ד בַּ/פָּ֑ח כִּֽי אֲרֻבּ֤וֹת מִ/מָּרוֹם֙ נִפְתָּ֔חוּ וַֽ/יִּרְעֲשׁ֖וּ מ֥וֹסְדֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/018.yaml
  text: 'And it will happen: the one who flees from the sound of terror will fall into the pit[a], and the one who comes up from the midst of the pit will be caught in the trap; for the windows from on high are opened, and the foundations of the earth shake.'
translation:
  language: pt
  text: E acontecerá que quem fugir do som do terror cairá na cova, e quem subir de dentro da cova será apanhado na armadilha; pois as janelas do alto se abriram[a], e os fundamentos da terra tremem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as comportas do céu se abriram”. Mais literalmente, o hebraico diz: “as janelas do alto se abriram”.'
    reason: Alternativa lexical e esclarecimento da imagem hebraica.
lexical_decisions:
- source_word: וְהָיָה
  choice: E acontecerá que
  rationale: Reproduz a fórmula que introduz a consequência seguinte em português atual e solene.
- source_word: הַנָּס
  choice: quem fugir
  rationale: Expressa de modo natural o particípio substantivado e mantém seu sentido genérico.
- source_word: מִקּוֹל הַפַּחַד
  choice: do som do terror
  rationale: קוֹל designa aqui um som audível, e פַּחַד comunica terror ou pavor no contexto do juízo.
- source_word: יִפֹּל אֶל הַפַּחַת
  choice: cairá na cova
  rationale: פַּחַת é uma cova ou fosso que funciona como perigo; “cova” é clara e concreta.
- source_word: וְהָעוֹלֶה מִתּוֹךְ הַפַּחַת
  choice: e quem sair do meio da cova
  rationale: Traduz naturalmente a subida para fora da cova, preservando a expressão espacial מִתּוֹךְ, “do meio de”.
- source_word: יִלָּכֵד בַּפָּח
  choice: será apanhado na armadilha
  rationale: Mantém a imagem concreta de captura e distingue פַּח, armadilha, de פַּחַת, cova.
- source_word: אֲרֻבּוֹת מִמָּרוֹם
  choice: as janelas do alto
  rationale: Segue de perto a imagem hebraica de aberturas provenientes das alturas, sem acrescentar explicitamente “céu” ao texto principal.
- source_word: נִפְתָּחוּ
  choice: se abriram
  rationale: O perfeito passivo hebraico apresenta a abertura como fato consumado; em português, a forma pronominal é natural e vívida.
- source_word: וַיִּרְעֲשׁוּ
  choice: tremem
  rationale: O presente dá vivacidade ao quadro profético e comunica diretamente o abalo.
- source_word: מוֹסְדֵי אָרֶץ
  choice: os fundamentos da terra
  rationale: Preserva a imagem dos suportes fundamentais e, no contexto cósmico de Isaías 24, “terra” é preferível a “território”.
theological_decisions:
- issue: Alcance de אָרֶץ
  choice: terra
  alternative: território; país
  rationale: O contexto de Isaías 24 descreve um juízo de alcance cósmico; “terra” preserva melhor essa amplitude sem impor uma leitura denominacional.
- issue: Sentido de אֲרֻבּוֹת מִמָּרוֹם
  choice: as janelas do alto
  alternative: as comportas do céu
  rationale: A tradução principal conserva a formulação e a imagem do hebraico; a alternativa tradicional, que explicita a possível imagem de comportas, fica registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência “terror — cova — armadilha” preserva as imagens sucessivas, embora o jogo sonoro hebraico entre פַּחַד, פַּחַת e פַּח não possa ser reproduzido naturalmente. O marcador da nota foi colocado após a expressão a que a nota efetivamente se refere.
