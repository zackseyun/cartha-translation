  text: וְ/אֻסְּפ֨וּ אֲסֵפָ֤ה אַסִּיר֙ עַל בּ֔וֹר וְ/סֻגְּר֖וּ עַל מַסְגֵּ֑ר וּ/מֵ/רֹ֥ב יָמִ֖ים יִפָּקֵֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/022.yaml
  text: And they will be gathered together like prisoners into a pit[a], and they will be shut up in a prison; and after many days they will be punished.
translation:
  language: pt
  text: Eles serão reunidos como prisioneiros numa cova e ficarão encerrados numa prisão; depois de muitos dias, serão visitados[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «serão punidos». O verbo hebraico pode significar «ser visitado» ou «ser chamado a prestar contas»; neste contexto de juízo e confinamento, também pode indicar punição.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֻסְּפוּ אֲסֵפָה
  choice: serão reunidos
  rationale: O passivo plural de אסף, reforçado pelo substantivo cognato אֲסֵפָה, expressa uma reunião coletiva enfática. Em português, «serão reunidos» transmite isso naturalmente sem reproduzir uma construção cognata artificial.
- source_word: אַסִּיר
  choice: como prisioneiros
  rationale: Embora esteja morfologicamente no singular, o substantivo tem valor coletivo após o verbo plural. «Como prisioneiros» conserva a imagem comparativa sem impor uma identificação além do texto.
- source_word: עַל בּוֹר
  choice: numa cova
  rationale: Neste contexto de reunião e confinamento, עַל pode indicar o lugar em que são postos. «Numa cova» preserva a imagem e soa mais natural em português do que «sobre uma cova».
- source_word: וְסֻגְּרוּ עַל מַסְגֵּר
  choice: ficarão encerrados numa prisão
  rationale: O passivo de סגר indica confinamento imposto, e מַסְגֵּר designa um local de reclusão. A formulação escolhida é clara, atual e mantém a repetição temática de aprisionamento.
- source_word: וּמֵרֹב יָמִים
  choice: depois de muitos dias
  rationale: A expressão indica a passagem de um período prolongado; a tradução mantém de perto a forma temporal hebraica.
- source_word: יִפָּקֵדוּ
  choice: serão chamados a prestar contas
  rationale: O nifal de פקד pode indicar que alguém é objeto de atenção, inspeção ou acerto de contas. No contexto judicial, «chamados a prestar contas» comunica uma visitação com responsabilidade sem estreitar o verbo simplesmente a «punidos».
theological_decisions:
- issue: Sentido de יִפָּקֵדוּ no contexto de juízo
  choice: serão chamados a prestar contas
  alternative: serão visitados; serão punidos
  rationale: O contexto favorece uma visitação judicial, mas o verbo hebraico é semanticamente mais amplo que «punir». A tradução principal explicita a prestação de contas sem declarar antecipadamente o resultado; a nota preserva tanto a formulação mais literal quanto a interpretação punitiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação conserva a progressão entre reunião, confinamento e posterior prestação de contas.
