    issue: «varejo da oliveira» é termo agrícola pouco transparente e ambiguamente associado a comércio no português brasileiro contemporâneo.
    rationale: O hebraico נֹקֶף designa o ato de golpear/sacudir a oliveira para fazer cair os frutos. Explicitar a ação por «quando se sacode uma oliveira» mantém a imagem e melhora substancialmente a legibilidade internacional.
