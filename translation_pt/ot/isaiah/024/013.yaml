  text: כִּ֣י כֹ֥ה יִהְיֶ֛ה בְּ/קֶ֥רֶב הָ/אָ֖רֶץ בְּ/ת֣וֹךְ הָֽ/עַמִּ֑ים כְּ/נֹ֣קֶף זַ֔יִת כְּ/עוֹלֵלֹ֖ת אִם כָּלָ֥ה בָצִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/013.yaml
  text: 'For so it will be in the midst of the earth[a], among the peoples: like the beating of an olive tree[b], like gleanings when the grape harvest is finished.'
translation:
  language: pt
  text: 'Pois assim será no meio da terra, entre os povos: como quando se sacode uma oliveira, como na respiga depois de terminada a colheita das uvas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי כֹה יִהְיֶה
  choice: Pois assim será
  rationale: כִּי introduz a explicação do contexto anterior, כֹה indica modo e יִהְיֶה expressa o futuro de forma direta.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: no meio da terra
  rationale: קֶרֶב significa interior ou meio; הָאָרֶץ é entendido aqui em sentido amplo, em harmonia com a referência internacional aos povos.
- source_word: בְּתוֹךְ הָעַמִּים
  choice: entre os povos
  rationale: Expressa naturalmente a presença em meio a diversos grupos humanos, preservando o plural de עַמִּים sem sugerir apenas Estados políticos.
- source_word: כְּנֹקֶף זַיִת
  choice: como no varejo da oliveira
  rationale: נֹקֶף evoca a ação de bater na oliveira para derrubar as azeitonas; «varejo» é o termo agrícola português para essa operação.
- source_word: כְּעוֹלֵלֹת
  choice: como na respiga
  rationale: עוֹלֵלֹת designa o que resta para ser recolhido depois da colheita principal; «respiga» comunica essa prática de modo conciso.
- source_word: אִם כָּלָה בָצִיר
  choice: quando termina a colheita das uvas
  rationale: Neste contexto, אִם tem valor temporal; בָצִיר se refere especificamente à vindima ou colheita de uvas.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla. «Varejo da oliveira» preserva com precisão a imagem agrícola hebraica, embora seja menos cotidiano; o contexto paralelo da respiga ajuda a torná-la inteligível. A estrutura poética e a abrangência de «terra» e «povos» foram mantidas.
