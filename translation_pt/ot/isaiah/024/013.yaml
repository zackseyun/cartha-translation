- from: 'Pois assim será no meio da terra, entre os povos: como no varejo da oliveira, como na respiga quando termina a colheita das uvas.'
  to: 'Pois assim será no meio da terra, entre os povos: como quando se sacode uma oliveira, como na respiga depois de terminada a colheita das uvas.'
  rationale: A revisão substitui apenas o tecnicismo potencialmente equívoco «varejo da oliveira» por uma expressão verbal clara que conserva a comparação hebraica. Também ajusta a relação temporal final para «depois de terminada», que exprime naturalmente a colheita já concluída e o caráter residual da respiga.
