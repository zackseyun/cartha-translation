review_pass:
  verdict: revise
  source_fidelity: 'A estrutura e os principais sentidos do hebraico são bem preservados: «Pois assim será», «no meio da terra», «entre os povos» e a comparação com o que resta após a colheita correspondem adequadamente ao texto. «Varejo da oliveira», porém, embora tenha uso agrícola especializado, é pouco transparente para o público visado e pode ser entendido no uso comercial corrente, sobretudo no Brasil.'
  naturalness: A redação é fluente no conjunto, mas «como no varejo da oliveira» soa técnica e potencialmente ambígua em português moderno amplo. Uma formulação verbal torna a imagem agrícola imediatamente inteligível sem reduzir a fidelidade.
  terminology: «Terra», «povos», «respiga» e «colheita das uvas» são escolhas adequadas. «Sacode uma oliveira» representa de modo natural o processo de derrubar os frutos, sem impor uma interpretação além da imagem hebraica.
  issues:
