  text: שָׁבַת֙ מְשׂ֣וֹשׂ תֻּפִּ֔ים חָדַ֖ל שְׁא֣וֹן עַלִּיזִ֑ים שָׁבַ֖ת מְשׂ֥וֹשׂ כִּנּֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/024/008.yaml
  text: The mirth of tambourines has ceased[a]; the noise of the jubilant has stopped[b]; the mirth of the lyre has ceased.
translation:
  language: pt
  text: Cessou a alegria dos tamborins; parou o alvoroço dos que festejavam; cessou a alegria da lira.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁבַת
  choice: cessou
  rationale: O qal perfeito indica que algo cessou ou chegou ao fim. A repetição de “cessou” nas duas extremidades preserva a moldura poética hebraica.
- source_word: מְשׂוֹשׂ
  choice: alegria
  rationale: O substantivo expressa alegria festiva ou exultação. “Alegria” é claro e natural em português, enquanto o contexto musical comunica seu caráter festivo.
- source_word: תֻּפִּים
  choice: tamborins
  rationale: O termo designa instrumentos de percussão portáteis, provavelmente tambores de mão ou tamborins. “Tamborins” é uma designação corrente e concisa.
- source_word: חָדַל
  choice: parou
  rationale: O verbo significa parar ou cessar. “Parou” combina naturalmente com “alvoroço” e mantém uma leve variação em relação ao שָׁבַת repetido.
- source_word: שְׁאוֹן
  choice: alvoroço
  rationale: O substantivo pode indicar ruído, estrondo ou tumulto. No paralelismo da celebração musical, “alvoroço” transmite uma agitação sonora festiva sem necessariamente sugerir desordem violenta.
- source_word: עַלִּיזִים
  choice: os que festejavam
  rationale: A forma substantivada se refere aos alegres ou exultantes. “Os que festejavam” comunica de modo natural as pessoas envolvidas na celebração, sem acrescentar a ideia de embriaguez.
- source_word: כִּנּוֹר
  choice: lira
  rationale: O instrumento antigo é mais precisamente identificado como uma lira; “harpa”, embora tradicional, é menos exato.
