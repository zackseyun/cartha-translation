  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה אֵ֣י זֶ֠ה סֵ֣פֶר כְּרִית֤וּת אִמְּ/כֶם֙ אֲשֶׁ֣ר שִׁלַּחְתִּ֔י/הָ א֚וֹ מִ֣י מִ/נּוֹשַׁ֔/י אֲשֶׁר מָכַ֥רְתִּי אֶתְ/כֶ֖ם ל֑/וֹ הֵ֤ן בַּ/עֲוֺנֹֽתֵי/כֶם֙ נִמְכַּרְתֶּ֔ם וּ/בְ/פִשְׁעֵי/כֶ֖ם שֻׁלְּחָ֥ה אִמְּ/כֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/001.yaml
  text: 'Thus says the LORD: Where is your mother''s certificate of divorce, with which I sent her away? Or which of my creditors is it to whom I sold you? Look, you were sold because of your iniquities, and your mother was sent away because of your transgressions.'
translation:
  language: pt
  text: 'Assim diz o SENHOR: “Onde está a certidão de divórcio de sua mãe, com a qual eu a mandei embora? Ou a qual dos meus credores eu vendi vocês? Vejam! Foi por causa das suas iniquidades que vocês foram vendidos, e foi por causa das suas transgressões que sua mãe foi mandada embora.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סֵפֶר כְּרִיתוּת
  choice: certidão de divórcio
  rationale: Expressa de modo natural e juridicamente reconhecível o documento formal de separação, preservando a imagem legal do hebraico.
- source_word: נֹשַׁי
  choice: meus credores
  rationale: O particípio substantivado designa aqueles a quem se deve dinheiro; “credores” é exato e corrente.
- source_word: הֵן
  choice: Vejam!
  rationale: Mantém a partícula enfática que chama a atenção para a verdadeira causa do ocorrido.
- source_word: עֲוֹנֹתֵיכֶם
  choice: suas iniquidades
  rationale: Preserva o vocabulário moral forte e a distinção aproximada em relação a “transgressões” na linha paralela.
- source_word: פִשְׁעֵיכֶם
  choice: suas transgressões
  rationale: Comunica atos de rebelião ou violação deliberada e conserva o paralelismo com “iniquidades”.
theological_decisions:
- issue: A imagem de divórcio e venda poderia sugerir que o SENHOR rompeu arbitrariamente a aliança ou perdeu o povo para credores.
  choice: Manter as perguntas retóricas e a explicação causal explícita do texto.
  alternative: Explicitar interpretativamente que não houve divórcio definitivo nem venda literal.
  rationale: O hebraico nega essas possíveis causas por meio das perguntas e atribui o exílio aos pecados do povo; a tradução preserva a tensão figurativa sem acrescentar uma conclusão doutrinária.
- issue: Identidade da “mãe”.
  choice: Preservar simplesmente “sua mãe”.
  alternative: Substituir por “Sião”, “Jerusalém” ou “a nação”.
  rationale: O referente metafórico não é nomeado neste versículo; explicitá-lo eliminaria uma ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O discurso direto foi pontuado com aspas; “SENHOR” representa o nome divino יהוה segundo a convenção editorial. A alternância singular (“sua mãe”) e plural (“vocês”) reproduz a imagem coletiva do original.
