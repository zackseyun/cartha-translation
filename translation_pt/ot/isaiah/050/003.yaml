base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/003.yaml
  text: I clothe the heavens with darkness[b][a], and I make sackcloth their covering.
translation:
  language: pt
  text: Visto os céus de escuridão[a] e faço do pano de saco[b] a cobertura deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «negrume» ou «obscuridade».
    reason: lexical_alternative
  - marker: b
    text: O pano de saco era um tecido grosseiro associado ao luto e à lamentação.
    reason: cultural_note
lexical_decisions:
- source_word: אַלְבִּישׁ
  choice: Visto
  rationale: O hifil de לבשׁ exprime fazer vestir ou revestir. «Visto» preserva o sentido causativo e soa natural no paralelismo poético.
- source_word: שָׁמַיִם
  choice: os céus
  rationale: O plural hebraico pode designar os céus ou o céu visível. «Os céus» conserva a forma plural e o registro elevado de Isaías.
- source_word: קַדְרוּת
  choice: escuridão
  rationale: O substantivo denota negrume, obscuridade ou aspecto sombrio. «Escuridão» é claro e mantém aberta a imagem tanto de perturbação cósmica como de luto.
- source_word: וְשַׂק
  choice: e pano de saco
  rationale: שַׂק designa um tecido grosseiro ligado ao luto e à lamentação. «Pano de saco» é a expressão bíblica corrente e compreensível em português.
- source_word: אָשִׂים
  choice: faço de
  rationale: שׂים significa pôr, colocar ou fazer. Na construção «faço do pano de saco ... a sua cobertura», a formulação comunica naturalmente que ele passa a servir de cobertura.
- source_word: כְּסוּתָם
  choice: a sua cobertura
  rationale: O termo significa cobertura ou veste. «Cobertura» preserva o paralelismo com «Visto» sem especificar demais a metáfora; o singular «sua» retoma coletivamente «os céus» de modo natural em português.
theological_decisions:
- issue: Imagem cósmica de juízo e luto
  choice: Preservar a declaração divina de poder que reveste os céus de escuridão e lhes dá pano de saco como cobertura, sem decidir se a cena é exclusivamente literal ou metafórica.
  alternative: Entender a linguagem principalmente como escurecimento cósmico literal ou principalmente como símbolo de luto e juízo.
  rationale: O hebraico combina perturbação cósmica e simbolismo de luto numa imagem poética. A tradução mantém essa tensão sem restringi-la a uma só interpretação.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem das notas foi ajustada para que a alternativa lexical acompanhe «escuridão» e a nota cultural acompanhe «pano de saco».
