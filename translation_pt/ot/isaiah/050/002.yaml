  naturalness: O português é moderno, claro e de registro apropriado. «Vejam» funciona naturalmente como chamamento discursivo, e a sintaxe das perguntas é fluente. «Seus peixes fedem» é igualmente natural e mais próximo da imagem original.
  terminology: «Mão», «resgatar», «força», «livrar» e «repreensão» são escolhas adequadas, sem impor interpretação confessional. «Ninguém» é uma boa equivalência idiomática para a construção existencial com איש neste contexto.
