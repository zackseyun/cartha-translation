source:
  edition: WLC
  text: מַדּ֨וּעַ בָּ֜אתִי וְ/אֵ֣ין אִ֗ישׁ קָרָֽאתִי֮ וְ/אֵ֣ין עוֹנֶה֒ הֲ/קָצ֨וֹר קָצְרָ֤ה יָדִ/י֙ מִ/פְּד֔וּת וְ/אִם אֵֽין בִּ֥/י כֹ֖חַ לְ/הַצִּ֑יל הֵ֣ן בְּ/גַעֲרָתִ֞/י אַחֲרִ֣יב יָ֗ם אָשִׂ֤ים נְהָרוֹת֙ מִדְבָּ֔ר תִּבְאַ֤שׁ דְּגָתָ/ם֙ מֵ/אֵ֣ין מַ֔יִם וְ/תָמֹ֖ת בַּ/צָּמָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/002.yaml
  text: Why[a], when I came, was there no man? When I called, was there no one to answer? Is my hand really too short to redeem, or is there no power in me to deliver? Behold[b], by my rebuke I dry up the sea; I make rivers a wilderness[c]; their fish stink for lack of water and die of thirst.
translation:
  language: pt
  text: 'Por que, quando vim, não havia ninguém? Quando chamei, não houve quem respondesse? Será que a minha mão ficou curta demais para resgatar, ou não há em mim força para livrar? Vejam: com a minha repreensão, faço o mar secar; transformo rios em deserto. Seus peixes fedem por falta de água e morrem de sede.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Por que
  rationale: Introduz diretamente a pergunta retórica de queixa, sem ampliar o hebraico.
- source_word: וְאֵין אִישׁ
  choice: não havia ninguém
  rationale: אִישׁ está no singular masculino, mas nesta construção existencial tem sentido representativo; em português, “ninguém” comunica isso com naturalidade e sem restringir indevidamente o referente a um homem.
- source_word: קָרָאתִי וְאֵין עוֹנֶה
  choice: Quando chamei, não houve quem respondesse?
  rationale: “Chamei” preserva a amplitude entre chamar e convocar; “quem respondesse” expressa naturalmente o particípio עוֹנֶה.
- source_word: הֲקָצוֹר קָצְרָה יָדִי
  choice: Será que a minha mão ficou curta demais
  rationale: Mantém a metáfora hebraica da mão encurtada como imagem de incapacidade, e a construção “será que” conserva a força retórica.
- source_word: מִפְּדוּת
  choice: para resgatar
  rationale: פְּדוּת denota resgate ou redenção; “resgatar” funciona naturalmente após “curta demais” e evita restringir a expressão a uma formulação teológica técnica.
- source_word: כֹחַ לְהַצִּיל
  choice: força para livrar
  rationale: “Força” corresponde a כֹחַ, e “livrar” preserva o sentido amplo de salvar ou resgatar de perigo.
- source_word: הֵן
  choice: Vejam
  rationale: Partícula que chama a atenção para a demonstração seguinte do poder divino; “Vejam” é atual, digno e adequado ao discurso dirigido a uma coletividade.
- source_word: בְּגַעֲרָתִי אַחֲרִיב יָם
  choice: com a minha repreensão, faço o mar secar
  rationale: “Repreensão” mantém a fala autoritativa, e “faço ... secar” é favorecido pelo contexto de ausência de água.
- source_word: אָשִׂים נְהָרוֹת מִדְבָּר
  choice: transformo rios em deserto
  rationale: Expressa com naturalidade a transformação indicada por שׂים e preserva a imagem forte do hebraico.
- source_word: תִּבְאַשׁ דְּגָתָם
  choice: Seus peixes apodrecem
  rationale: O verbo באש indica tornar-se malcheiroso ou apodrecer; “apodrecem” transmite tanto a decomposição quanto o mau cheiro implícito.
theological_decisions:
- issue: Imagem antropomórfica da mão divina
  choice: Mantida em “a minha mão ficou curta demais”.
  alternative: “Será que o meu poder é limitado demais?”
  rationale: O hebraico usa a mão como imagem concreta da capacidade eficaz de Deus; mantê-la preserva a força retórica, enquanto a oração seguinte explicita a ideia de força.
- issue: Relação entre פדות e הציל
  choice: “resgatar” e “livrar”.
  alternative: “redimir” e “salvar”.
  rationale: A escolha conserva a distinção lexical sem impor uma leitura exclusivamente espiritual; ambos os termos permanecem abertos à ação histórica e salvífica de Deus.
- issue: Alcance de אִישׁ
  choice: “ninguém”.
  alternative: “nenhum homem”.
  rationale: Na construção existencial, o substantivo singular é representativo. “Ninguém” preserva o alcance contextual e soa mais natural em português, sem alterar a substância da pergunta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora central da “mão curta” foi preservada; evitou-se linguagem arcaica como “eis que” e também terminologia confessional excessivamente técnica.
