source:
  edition: WLC
  text: הֵ֧ן כֻּלְּ/כֶ֛ם קֹ֥דְחֵי אֵ֖שׁ מְאַזְּרֵ֣י זִיק֑וֹת לְכ֣וּ בְּ/א֣וּר אֶשְׁ/כֶ֗ם וּ/בְ/זִיקוֹת֙ בִּֽעַרְתֶּ֔ם מִ/יָּדִ/י֙ הָיְתָה זֹּ֣את לָ/כֶ֔ם לְ/מַעֲצֵבָ֖ה תִּשְׁכָּבֽוּ/ן׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/011.yaml
  text: 'Look[a], all of you who kindle a fire, who gird yourselves with burning arrows: walk in the light of your fire and among the arrows you have set ablaze[b]. This has come to you from my hand: you will lie down in torment.'
translation:
  language: pt
  text: 'Vejam: todos vocês que acendem um fogo, que se cingem de faíscas[a], andem à luz do seu fogo e entre as faíscas que vocês acenderam. Isto lhes veio da minha mão: vocês se deitarão em tormento[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tições acesos”; também é possível “dardos inflamados” ou “flechas incendiárias”.
    reason: lexical_alternative
  - marker: b
    text: Ou “em sofrimento”, “em tristeza” ou “em angústia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Vejam
  rationale: Interjeição dêitica que introduz uma declaração incisiva. “Vejam” mantém a força do hebraico em português atual.
- source_word: קֹדְחֵי אֵשׁ
  choice: que acendem um fogo
  rationale: O particípio de קדח tem aqui sentido ativo, “acender/atear”, e o singular “um fogo” corresponde ao hebraico.
- source_word: מְאַזְּרֵי
  choice: que se cingem de
  rationale: Conserva a imagem de אזר, “cingir-se”, sem decidir se o que segue é proteção, equipamento ou armamento.
- source_word: זִיקוֹת
  choice: faíscas
  rationale: “Faíscas” é um sentido lexical direto e mantém coerente a imagem do fogo. Como “tições”, “dardos inflamados” ou “flechas incendiárias” também são possíveis no contexto de “cingir-se”, a ambiguidade é registrada em nota.
- source_word: לְכוּ
  choice: andem
  rationale: Imperativo de הלך. “Andem” combina naturalmente com “à luz” e conserva o tom irônico e judicial do contexto.
- source_word: בְּאוּר אֶשְׁכֶם
  choice: à luz do seu fogo
  rationale: Expressa de modo natural אוּר como “luz” e preserva a ironia da iluminação produzida pelos próprios destinatários.
- source_word: וּבְזִיקוֹת בִּעַרְתֶּם
  choice: e entre as faíscas que vocês acenderam
  rationale: Mantém o paralelismo com a primeira ocorrência de זיקות e traduz בִּעַרְתֶּם pelo sentido causativo de acender ou atear.
- source_word: מִיָּדִי
  choice: da minha mão
  rationale: Preserva a expressão concreta do hebraico e a agência direta do falante.
- source_word: לְמַעֲצֵבָה
  choice: em tormento
  rationale: Transmite a dor ou aflição severa indicada pelo substantivo no contexto de juízo, sem especificar a natureza do sofrimento.
- source_word: תִּשְׁכָּבוּן
  choice: vocês se deitarão
  rationale: Tradução direta que preserva a imagem final de repousar ou terminar numa condição de sofrimento.
theological_decisions:
- issue: Tom do imperativo “andem à luz do seu fogo”
  choice: Desafio irônico e judicial dirigido aos que confiam no fogo que eles mesmos acenderam
  alternative: Convite neutro para continuarem no caminho escolhido
  rationale: A afirmação de que o resultado vem da mão do falante e a ameaça final mostram que o imperativo não expressa aprovação.
- issue: Identidade do agente em “da minha mão”
  choice: O próprio Deus traz a consequência anunciada
  alternative: Uma consequência meramente impessoal das ações dos destinatários
  rationale: No discurso profético, a primeira pessoa e a imagem da mão apresentam o juízo como ação divina; a tradução conserva a formulação sem acrescentar uma identificação explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa plural por “vocês”. A construção “cingem-se de” preserva a metáfora do hebraico, enquanto a nota mantém aberta a incerteza sobre זִיקוֹת.
