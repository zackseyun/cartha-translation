id: ISA.50.9
reference: Isaiah 50:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֵ֣ן אֲדֹנָ֤/י יְהוִה֙ יַֽעֲזָר לִ֔/י מִי ה֖וּא יַרְשִׁיעֵ֑/נִי הֵ֤ן כֻּלָּ/ם֙ כַּ/בֶּ֣גֶד יִבְל֔וּ עָ֖שׁ יֹאכְלֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/009.yaml
  text: Behold[a], the Lord GOD helps me; who is he who will declare me guilty? Behold, all of them will wear out like a garment; a moth will eat them.
translation:
  language: pt
  text: Eis que o Senhor Yahweh me ajuda; quem é que me declarará culpado?[a] Eis que todos eles se desgastarão como uma roupa; a traça os comerá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “me condenará?”. O verbo hebraico é forense e significa declarar alguém culpado ou condená-lo em juízo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Eis que
  rationale: Partícula que chama enfaticamente a atenção. “Eis que” conserva a força solene e profética e continua compreensível em português moderno.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: 'Mantém os dois elementos do título composto: אֲדֹנָי como “Senhor” e o nome divino יהוה como “Yahweh”, evitando reduzir o nome próprio a um título.'
- source_word: יַעֲזָר לִי
  choice: me ajuda
  rationale: O imperfeito de עזר admite valor presente ou futuro. O presente expressa aqui a confiança do servo no auxílio efetivo e contínuo de Deus, sem excluir sua continuação futura.
- source_word: מִי הוּא
  choice: quem é que
  rationale: A construção idiomática preserva em português a ênfase retórica do pronome hebraico explícito.
- source_word: יַרְשִׁיעֵנִי
  choice: me declarará culpado
  rationale: 'O hifil de רשע tem sentido forense: declarar alguém culpado em juízo. A formulação explicita essa nuance sem acrescentar uma interpretação teológica.'
- source_word: כֻּלָּם
  choice: todos eles
  rationale: Preserva tanto a abrangência total quanto a referência enfática aos adversários.
- source_word: כַּבֶּגֶד
  choice: como uma roupa
  rationale: Reproduz de modo concreto e natural a comparação com uma peça de vestuário.
- source_word: יִבְלוּ
  choice: se desgastarão
  rationale: Expressa a deterioração gradual própria de uma roupa, mantendo a imagem do hebraico.
- source_word: עָשׁ
  choice: a traça
  rationale: O singular é genérico; o artigo definido é uma forma natural de apresentar essa classe em português.
- source_word: יֹאכְלֵם
  choice: os comerá
  rationale: Conserva o verbo concreto e vívido “comer”, em vez de substituir a imagem por “destruir” ou “consumir”.
theological_decisions:
- issue: Forma do nome divino no título אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A tradução conserva distintamente o título אֲדֹנָי e o nome próprio יהוה. “O Senhor DEUS” segue uma convenção tradicional, mas obscurece que o segundo elemento é o nome divino.
- issue: Valor temporal de יַעֲזָר
  choice: me ajuda
  alternative: me ajudará
  rationale: O presente combina com a declaração de confiança vigente do servo; o imperfeito hebraico também permite que essa ajuda seja entendida como continuada, por isso não se impõe uma oposição rígida entre presente e futuro.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Eis que” mantém o tom profético; “quem é que” dá naturalidade à ênfase retórica. O marcador da nota foi colocado após “culpado”, termo ao qual a alternativa lexical efetivamente se refere.
