id: ISA.50.10
reference: Isaiah 50:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מִ֤י בָ/כֶם֙ יְרֵ֣א יְהוָ֔ה שֹׁמֵ֖עַ בְּ/ק֣וֹל עַבְדּ֑/וֹ אֲשֶׁ֣ר הָלַ֣ךְ חֲשֵׁכִ֗ים וְ/אֵ֥ין נֹ֨גַהּ֙ ל֔/וֹ יִבְטַח֙ בְּ/שֵׁ֣ם יְהוָ֔ה וְ/יִשָּׁעֵ֖ן בֵּ/אלֹהָֽי/ו׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/010.yaml
  text: Who among you fears Yahweh[a], listening to the voice of his servant? Let the one who walks in darkness and has no light trust in the name of Yahweh and lean on his God.
translation:
  language: pt
  text: Quem entre vocês teme Javé e escuta a voz do seu servo[a]? Aquele que anda nas trevas e não tem luz confie no nome de Javé e apoie-se em seu Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “obedece à voz do seu servo” ou “dá ouvidos à voz do seu servo”.
    reason: Alternativas lexicais para שׁמע, que pode indicar escutar com atenção, atender ou obedecer.
lexical_decisions:
- source_word: מִי בָכֶם
  choice: Quem entre vocês
  rationale: Forma interrogativa direta, natural no português moderno e fiel ao apelo dirigido aos ouvintes.
- source_word: יְרֵא יְהוָה
  choice: teme Javé
  rationale: “Teme” conserva o peso da reverência e da fidelidade a Deus; “Javé” representa explicitamente o nome divino יהוה.
- source_word: שֹׁמֵעַ בְּקוֹל עַבְדּוֹ
  choice: escuta a voz do seu servo
  rationale: Mantém o sentido básico de ouvir com atenção sem excluir a implicação contextual de atender ou obedecer.
- source_word: עַבְדּוֹ
  choice: seu servo
  rationale: “Servo” é adequado para o agente comissionado de Javé e não determina além do texto a identidade do referente.
- source_word: אֲשֶׁר הָלַךְ חֲשֵׁכִים
  choice: Aquele que anda nas trevas
  rationale: Expressa naturalmente o caso particular ao qual se dirige a exortação; “trevas” preserva o caráter intensivo e figurado da expressão hebraica.
- source_word: וְאֵין נֹגַהּ לוֹ
  choice: e não tem luz
  rationale: Tradução idiomática de נֹגַהּ como luz ou claridade, preservando a experiência de ausência de iluminação.
- source_word: יִבְטַח בְּשֵׁם יְהוָה
  choice: confie no nome de Javé
  rationale: Preserva tanto o verbo de confiança quanto a referência teologicamente significativa ao nome revelado de Deus.
- source_word: וְיִשָּׁעֵן בֵּאלֹהָיו
  choice: e apoie-se em seu Deus
  rationale: Conserva a metáfora concreta de apoiar-se em alguém, com formulação natural em português.
theological_decisions:
- issue: Identidade de “seu servo”
  choice: Manter “seu servo” sem identificar o referente
  alternative: O profeta, Israel ou a figura do Servo com significado messiânico
  rationale: O contexto de Isaías contém o tema do Servo, mas este versículo não identifica explicitamente o referente; a tradução preserva essa abertura.
- issue: Força de שֹׁמֵעַ
  choice: escuta
  alternative: obedece; dá ouvidos
  rationale: O verbo pode abranger atenção e obediência. O texto principal conserva o sentido auditivo básico, enquanto a nota registra as possibilidades mais fortes.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A sintaxe exortativa foi preservada, assim como a metáfora de apoiar-se em Deus.
