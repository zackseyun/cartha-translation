  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֲדֹנָ֣/י יְהֹוִ֗ה נָ֤תַן לִ/י֙ לְשׁ֣וֹן לִמּוּדִ֔ים לָ/דַ֛עַת לָ/ע֥וּת אֶת יָעֵ֖ף דָּבָ֑ר יָעִ֣יר בַּ/בֹּ֣קֶר בַּ/בֹּ֗קֶר יָעִ֥יר לִ/י֙ אֹ֔זֶן לִ/שְׁמֹ֖עַ כַּ/לִּמּוּדִֽים־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/004.yaml
  text: The Lord GOD has given me the tongue of those who are taught[a], that I may know how to sustain the weary with a word. Morning by morning he awakens[c][b]; he awakens my ear to hear like those who are taught.
translation:
  language: pt
  text: O Senhor Yahweh[a] me deu a língua dos que são instruídos[b], para que eu saiba amparar o cansado com uma palavra.[c] Manhã após manhã, ele desperta, desperta-me o ouvido para que eu ouça como os que são instruídos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico reúne o título אֲדֹנָי, «Senhor», e o nome divino YHWH, aqui representado por «Yahweh».
    reason: cultural_note
  - marker: b
    text: 'Ou: «a língua dos discípulos» ou «a língua dos ensinados».'
    reason: lexical_alternative
  - marker: c
    text: O verbo hebraico é difícil; também pode ser entendido como «ajudar» ou, com menor probabilidade, «responder ao cansado com uma palavra».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: O Senhor Yahweh
  rationale: 'Mantém os dois elementos do título hebraico: אֲדֹנָי como «Senhor» e o nome divino YHWH como «Yahweh».'
- source_word: לְשׁוֹן
  choice: língua
  rationale: Preserva a metáfora hebraica do órgão da fala, que também é natural e compreensível em português.
- source_word: לִמּוּדִים
  choice: os que são instruídos
  rationale: Expressa o sentido de pessoas ensinadas ou instruídas sem restringi-lo necessariamente ao conceito técnico de discípulos; a mesma formulação é retomada no fim do versículo.
- source_word: לָעוּת
  choice: amparar
  rationale: O verbo é lexicalmente difícil. «Amparar» comunica apoio eficaz ao cansado, ajusta-se ao contexto e evita uma paráfrase excessiva.
- source_word: יָעֵף
  choice: o cansado
  rationale: Traduz o adjetivo substantivado de modo simples, abrangendo cansaço, abatimento ou exaustão.
- source_word: דָּבָר
  choice: com uma palavra
  rationale: Conserva o sentido comum de «palavra» e explicita naturalmente o valor instrumental da expressão.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: Manhã após manhã
  rationale: Reproduz a repetição enfática e a ideia de regularidade contínua.
- source_word: יָעִיר
  choice: desperta
  rationale: Traduz diretamente o causativo de עור e funciona com naturalidade tanto na oração absoluta quanto com «o meu ouvido».
- source_word: לִשְׁמֹעַ
  choice: para que eu ouça
  rationale: Mantém o sentido básico de ouvir e expressa em português a finalidade da ação de despertar o ouvido.
- source_word: כַּלִּמּוּדִים
  choice: como os que são instruídos
  rationale: Retoma de modo consistente o termo anterior e preserva o paralelo entre falar e ouvir como alguém ensinado.
theological_decisions:
- issue: Representação do nome divino no título אֲדֹנָי יְהוִה
  choice: O Senhor Yahweh
  alternative: O Soberano SENHOR / o Senhor Deus
  rationale: A tradução conserva explicitamente tanto o título אֲדֹנָי quanto o nome próprio YHWH, sem substituir o nome divino por outro título.
- issue: Identidade dos לִמּוּדִים
  choice: os que são instruídos
  alternative: os discípulos
  rationale: O hebraico permite a ideia de discípulos, mas a formulação escolhida preserva o sentido mais amplo de pessoas ensinadas e não impõe uma categoria religiosa mais específica.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A metáfora «língua» e a repetição temática de «os que são instruídos» foram mantidas para preservar a forma e o paralelismo hebraicos. A pontuação divide com clareza as duas metades do versículo sem eliminar sua cadência poética.
