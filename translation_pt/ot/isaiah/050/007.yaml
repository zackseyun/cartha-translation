base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/007.yaml
  text: But the Lord GOD helps me[a]; therefore I have not been disgraced. Therefore I have set my face like flint[d][c][b], and I know that I will not be put to shame.
translation:
  language: pt
  text: Mas o Senhor Yahweh me ajuda[a]; por isso, não fui humilhado. Por isso, tornei o meu rosto duro como pedra de pederneira[b] e sei que não serei envergonhado[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o Senhor Yahweh”, título que combina אֲדֹנָי (“Senhor”) com o nome divino יהוה (“Yahweh”).'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “pus o meu rosto como pederneira”; a imagem expressa determinação firme diante da oposição.
    reason: cultural_note
  - marker: c
    text: Também pode ser traduzido por “não passarei vergonha” ou “não ficarei decepcionado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: O título composto une אֲדֹנָי, “Senhor”, ao nome divino יהוה. “O Senhor Yahweh” preserva tanto o título quanto o nome da aliança sem produzir a repetição pouco natural “Senhor SENHOR”.
- source_word: יַעֲזָר לִי
  choice: me ajuda
  rationale: O imperfeito expressa confiança presente e futura. O presente português comunica auxílio contínuo sem restringir excessivamente o valor temporal.
- source_word: עַל כֵּן
  choice: por isso
  rationale: A expressão introduz uma consequência e é repetida no hebraico. A tradução mantém essa repetição e o encadeamento retórico.
- source_word: נִכְלָמְתִּי
  choice: não fui humilhado
  rationale: O Nifal de כלם indica sofrer vergonha, humilhação ou desonra. “Não fui humilhado” preserva o caráter passivo e resultativo em português atual.
- source_word: שַׂמְתִּי פָנַי
  choice: firmei o rosto
  rationale: A expressão literal é “pus/coloquei o meu rosto”. “Firmei o rosto” conserva a imagem corporal e comunica de modo natural a decisão resoluta.
- source_word: כַּחַלָּמִישׁ
  choice: como pederneira
  rationale: חַלָּמִישׁ designa uma pedra extremamente dura, normalmente identificada como pederneira. A tradução mantém a metáfora de dureza e determinação.
- source_word: וָאֵדַע
  choice: e sei
  rationale: O presente transmite a certeza estabelecida do falante com naturalidade, enquanto a conjunção mantém a progressão do enunciado.
- source_word: לֹא אֵבוֹשׁ
  choice: não serei envergonhado
  rationale: בוש pode indicar ser exposto à vergonha ou ver a própria confiança frustrada. A forma passiva preserva essa dimensão e mantém uma distinção discreta em relação a “humilhado” na oração anterior.
theological_decisions:
- issue: Representação do nome divino no título אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR
  rationale: A forma escolhida preserva explicitamente o nome יהוה e o distingue do título אֲדֹנָי, sem acrescentar uma interpretação denominacional.
- issue: Relação entre a ajuda divina e a determinação do servo
  choice: manter duas ocorrências de “por isso”
  alternative: variar a segunda ligação como “assim”
  rationale: A repetição atribui tanto a ausência de humilhação quanto a firme resolução à ajuda de Yahweh, preservando a estrutura argumentativa e a tensão teológica do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “por isso” reproduz a ênfase hebraica. “Firmei o rosto” evita uma construção excessivamente literal e pouco natural, mas a nota preserva a forma da imagem original.
