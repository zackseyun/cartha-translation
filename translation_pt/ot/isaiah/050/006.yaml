  text: גֵּוִ/י֙ נָתַ֣תִּי לְ/מַכִּ֔ים וּ/לְחָיַ֖/י לְ/מֹֽרְטִ֑ים פָּנַ/י֙ לֹ֣א הִסְתַּ֔רְתִּי מִ/כְּלִמּ֖וֹת וָ/רֹֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/006.yaml
  text: I gave my back to those who strike[a], and my cheeks to those who pull out the beard; I did not hide my face from disgrace and spitting.
translation:
  language: pt
  text: Entreguei as costas aos que me golpeavam e as bochechas aos que me arrancavam a barba[a]; não escondi o rosto de humilhações e de cusparadas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos que me arrancavam os pelos”. O hebraico não menciona explicitamente a barba, embora ela seja o objeto implícito mais provável neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵּוִי
  choice: as costas
  rationale: גֵּו pode designar as costas ou o corpo; no contexto de golpes, “as costas” é a opção mais natural e específica em português.
- source_word: נָתַתִּי
  choice: Entreguei
  rationale: נתן significa literalmente “dar”. “Entreguei” conserva a ação voluntária sugerida pelo contexto e soa natural com “as costas”, sem acrescentar submissão além do que o hebraico permite.
- source_word: לְמַכִּים
  choice: aos que me batiam
  rationale: O particípio de נכה identifica os que desferem golpes. “Aos que me batiam” expressa claramente uma agressão física continuada ou característica.
- source_word: וּלְחָיַי
  choice: e as faces
  rationale: לְחִי designa a face, especialmente a região da bochecha ou mandíbula. O plural “as faces” preserva a forma hebraica e mantém a ligação com a barba arrancada.
- source_word: לְמֹרְטִים
  choice: aos que me arrancavam a barba
  rationale: מרט significa arrancar ou depilar pelos. O objeto não está expresso no hebraico, mas “a barba” é a inferência contextual mais provável depois de “as faces”; a nota preserva a indeterminação do original.
- source_word: פָּנַי
  choice: o rosto
  rationale: Tradução direta de פָּנִים com sufixo de primeira pessoa; o possessivo fica naturalmente subentendido após “não escondi”.
- source_word: לֹא הִסְתַּרְתִּי
  choice: não escondi
  rationale: O hifil de סתר significa esconder ou ocultar. A formulação direta preserva a imagem concreta do hebraico.
- source_word: מִכְּלִמּוֹת
  choice: da humilhação
  rationale: כְּלִמָּה abrange vergonha, desonra e humilhação. “Humilhação” comunica de modo claro tanto a afronta social quanto o tratamento degradante.
- source_word: וָרֹק
  choice: e das cusparadas
  rationale: רֹק significa saliva ou ato de cuspir. “Cusparadas” torna explícita e concreta a agressão em português corrente, em paralelo com “humilhação”.
theological_decisions:
- issue: Explicitar uma aplicação messiânica ou cristológica do servo
  choice: Manter a fala na primeira pessoa sem identificar explicitamente o locutor com o Messias ou com Jesus.
  alternative: Redigir o versículo de modo a destacar antecipadamente os sofrimentos de Jesus.
  rationale: Embora o texto tenha sido tradicionalmente aplicado a Jesus, o versículo hebraico apresenta apenas a fala do servo. A tradução preserva esse nível textual e deixa a identificação teológica para o contexto e a interpretação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Entreguei as costas” evita uma formulação artificial como “dei minhas costas”, enquanto “as faces” conserva a precisão corporal do hebraico. A repetição do possessivo foi reduzida onde o português o dispensa naturalmente.
