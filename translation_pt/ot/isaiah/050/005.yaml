  text: אֲדֹנָ֤/י יְהוִה֙ פָּתַֽח לִ֣/י אֹ֔זֶן וְ/אָנֹכִ֖י לֹ֣א מָרִ֑יתִי אָח֖וֹר לֹ֥א נְסוּגֹֽתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/005.yaml
  text: The Lord GOD has opened my ear[a], and I was not rebellious; I did not turn back.
translation:
  language: pt
  text: O Senhor Yahweh abriu meu ouvido, e eu não me rebelei; não recuei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não voltei atrás”.'
    reason: Alternativa lexical para אָחוֹר לֹא נְסוּגֹתִי, que pode descrever tanto recuar quanto voltar atrás.
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: O Senhor Yahweh
  rationale: Preserva os dois elementos do título hebraico e representa diretamente o nome divino יהוה como “Yahweh”, sem produzir a repetição artificial “Senhor SENHOR”.
- source_word: פָּתַח לִי אֹזֶן
  choice: abriu meu ouvido
  rationale: Mantém a imagem concreta do hebraico, literalmente “abriu para mim um ouvido”, em uma construção portuguesa natural, sem a reduzir à explicação abstrata “fez-me ouvir”.
- source_word: מָרִיתִי
  choice: não me rebelei
  rationale: O verbo מרה expressa rebeldia ou resistência. A forma verbal portuguesa reproduz de modo direto e natural o testemunho do servo.
- source_word: אָחוֹר לֹא נְסוּגֹתִי
  choice: não recuei
  rationale: Expressa de modo conciso o movimento para trás indicado por אָחוֹר e סוג, preservando a ideia de não fugir nem desistir da missão.
theological_decisions:
- issue: Representação do nome divino no título אֲדֹנָי יְהוִה
  choice: O Senhor Yahweh
  alternative: O Soberano Senhor; o Senhor DEUS
  rationale: A tradução mantém o nome da aliança como “Yahweh” e conserva אֲדֹנָי como “Senhor”, sem substituir o nome próprio por um título. Não se acrescenta uma interpretação cristológica explícita que não esteja formulada no versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação simples e a imagem singular de “meu ouvido” preservam o caráter poético e concreto do hebraico.
