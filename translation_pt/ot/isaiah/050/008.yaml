  text: קָרוֹב֙ מַצְדִּיקִ֔/י מִֽי יָרִ֥יב אִתִּ֖/י נַ֣עַמְדָה יָּ֑חַד מִֽי בַ֥עַל מִשְׁפָּטִ֖/י יִגַּ֥שׁ אֵלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/008.yaml
  text: Near is the one who vindicates me[a]; who will contend with me? Let us stand together[b]. Who is the master of my case? Let him come near to me.
translation:
  language: pt
  text: Perto está aquele que me declara justo[a]. Quem contenderá comigo? Compareçamos juntos. Quem tem uma causa contra mim[b]? Que ele se aproxime de mim!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aquele que me justifica” ou “aquele que prova que tenho razão”. Neste contexto, o verbo hebraico tem sentido forense.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “o senhor” ou “o dono da minha causa”; isto é, aquele que apresenta uma demanda judicial contra mim.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרוֹב
  choice: Perto está
  rationale: Mantém a posição enfática do predicativo no início do verso e também permite conservar a correspondência com o desafio final para que o adversário se aproxime.
- source_word: מַצְדִּיקִי
  choice: aquele que me declara justo
  rationale: O hifil de צדק tem aqui sentido forense. A formulação comunica um pronunciamento favorável no tribunal sem sugerir necessariamente transformação moral nem depender do uso teológico técnico de “justificar”.
- source_word: יָרִיב אִתִּי
  choice: contenderá comigo
  rationale: ריב pode designar disputa ou litígio. “Contender” preserva tanto o confronto quanto a dimensão judicial, sem especificar um procedimento além do que diz o hebraico.
- source_word: נַעַמְדָה יָּחַד
  choice: Compareçamos juntos
  rationale: O coortativo convida o oponente a se apresentar lado a lado para o confronto judicial. “Compareçamos” torna natural em português a imagem de tomar posição perante o tribunal.
- source_word: בַעַל מִשְׁפָּטִי
  choice: o senhor da minha causa
  rationale: Preserva de modo transparente a metáfora hebraica de “senhor/dono” da causa, isto é, a parte que detém ou promove uma demanda judicial contra o servo.
- source_word: יִגַּשׁ אֵלַי
  choice: Que ele se aproxime de mim
  rationale: Expressa a força volitiva e desafiadora da forma verbal e retoma lexicalmente a ideia de proximidade que abre o verso.
theological_decisions:
- issue: Sentido forense ou moral de מַצְדִּיקִי
  choice: aquele que me declara justo
  alternative: aquele que me torna justo; aquele que me justifica
  rationale: 'O campo semântico imediato é judicial: contenda, comparecimento conjunto e causa legal. Por isso, a tradução apresenta uma declaração favorável, sem converter o verbo em transformação moral interior nem impor formulação doutrinária posterior.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A inversão inicial conserva a ênfase do hebraico; “compareçamos” e “causa” sustentam o cenário de tribunal. A repetição conceitual entre “Perto” e “se aproxime” foi mantida.
