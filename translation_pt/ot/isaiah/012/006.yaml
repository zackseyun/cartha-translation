  text: צַהֲלִ֥י וָ/רֹ֖נִּי יוֹשֶׁ֣בֶת צִיּ֑וֹן כִּֽי גָד֥וֹל בְּ/קִרְבֵּ֖/ךְ קְד֥וֹשׁ יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/006.yaml
  text: Cry aloud and shout for joy[a], inhabitant of Zion[b], for great in your midst is the Holy One of Israel.
translation:
  language: pt
  text: Grite bem alto e cante de alegria[a], moradora de Sião[b], pois grande é, em seu meio, o Santo de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dê gritos de alegria”. O segundo imperativo pode indicar tanto canto jubiloso quanto gritos de alegria.
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, “moradora de Sião” está no feminino singular, personificando Sião como uma mulher a quem se fala diretamente.
    reason: cultural_note
lexical_decisions:
- source_word: צַהֲלִי
  choice: Grite bem alto
  rationale: O imperativo feminino singular de צהל expressa um brado forte ou exultante. A formulação preserva a intensidade vocal e se distingue do segundo imperativo.
- source_word: וָרֹנִּי
  choice: e cante de alegria
  rationale: O imperativo feminino singular de רנן pode indicar tanto canto jubiloso quanto gritos de alegria. “Cante de alegria” é natural em português e preserva o caráter sonoro e festivo, enquanto a nota registra a alternativa legítima.
- source_word: יוֹשֶׁבֶת צִיּוֹן
  choice: moradora de Sião
  rationale: O particípio feminino singular apresenta Sião personificada como mulher e diretamente interpelada. “Moradora” torna explícito o gênero gramatical e evita substituir a expressão hebraica por “filha de Sião”.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão dos imperativos anteriores com uma conjunção clara e digna em português.
- source_word: גָדוֹל
  choice: grande
  rationale: Reproduz o sentido básico do adjetivo predicativo sem restringi-lo apenas à ideia de poder.
- source_word: בְּקִרְבֵּךְ
  choice: no meio de você
  rationale: Mantém o sentido locativo e a referência feminina singular à Sião personificada, em linguagem amplamente compreensível.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: o Santo de Israel
  rationale: Preserva o título divino característico de Isaías de maneira tradicional, transparente e teologicamente não expansiva.
theological_decisions:
- issue: Personificação de Sião como destinatária feminina singular
  choice: Manter o discurso direto no singular com “moradora de Sião” e “no meio de você”
  alternative: 'Transformar a destinatária em coletividade: “povo de Sião”, “moradores de Sião” ou “entre vocês”'
  rationale: As formas hebraicas são consistentemente femininas e singulares. Preservá-las conserva a personificação poética de Sião em vez de achatá-la em uma referência coletiva genérica.
- issue: Título divino característico da teologia de Isaías
  choice: Traduzir קְדוֹשׁ יִשְׂרָאֵל como “o Santo de Israel”
  alternative: “o Santo, o Deus de Israel” ou “o Santo que pertence a Israel”
  rationale: “O Santo de Israel” conserva a concisão e o peso do título hebraico sem acrescentar uma identificação ou interpretação ausente no texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A ordem “grande é” preserva a ênfase poética do predicado hebraico; “no meio de você” mantém o singular da personificação sem recorrer ao mais regional ou formal “em teu meio”.
