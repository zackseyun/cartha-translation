  rationale: Substitui-se “Vejam” por “Eis” para evitar a introdução de um imperativo plural ausente no original e para representar de forma mais direta a partícula hebraica הִנֵּה. A nota [a] preserva “Vejam” como alternativa. Não se alteram o sentido, os nomes divinos, a referência cruzada nem os demais elementos poéticos do versículo.
