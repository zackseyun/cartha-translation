id: ISA.12.2
reference: Isaiah 12:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הִנֵּ֨ה אֵ֧ל יְשׁוּעָתִ֛/י אֶבְטַ֖ח וְ/לֹ֣א אֶפְחָ֑ד כִּֽי עָזִּ֤/י וְ/זִמְרָת֙ יָ֣הּ יְהוָ֔ה וַֽ/יְהִי לִ֖/י לִֽ/ישׁוּעָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/002.yaml
  text: Behold[a], God is my salvation; I will trust and not be afraid, for Yah, Yahweh, is my strength and song[b], and he has become my salvation.
translation:
  language: pt
  text: 'Eis[a]: Deus é a minha salvação; confiarei e não terei medo, pois Yah, Yahweh, é a minha força e o meu cântico[b], e ele se tornou a minha salvação.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vejam”. O hebraico usa uma expressão enfática para chamar a atenção.'
    reason: alternative_reading
  - marker: b
    text: Esta linha retoma quase literalmente Êxodo 15:2.
    reason: cross_reference
lexical_decisions:
- source_word: הִנֵּה
  choice: Vejam
  rationale: Interjeição dêitica que chama enfaticamente a atenção. “Vejam” é atual, inteligível e preserva a força exclamativa do hebraico.
- source_word: אֵל
  choice: Deus
  rationale: Equivalente natural da designação divina poética, sem acrescentar uma qualificação ausente no texto.
- source_word: יְשׁוּעָתִי / לִישׁוּעָה
  choice: a minha salvação
  rationale: Mantém o sentido de salvação ou livramento e reproduz a repetição deliberada que enquadra o versículo.
- source_word: אֶבְטַח
  choice: confiarei
  rationale: O imperfeito na confissão poética expressa resolução e confiança voltada para o futuro.
- source_word: וְלֹא אֶפְחָד
  choice: e não terei medo
  rationale: Expressão idiomática em português moderno que traduz diretamente a forma verbal negada.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da confiança declarada anteriormente.
- source_word: עָזִּי
  choice: a minha força
  rationale: Reproduz o sentido lexical direto e conserva a ligação verbal com Êxodo 15:2.
- source_word: וְזִמְרָת
  choice: o meu cântico
  rationale: A leitura tradicional “cântico” se ajusta à fórmula poética retomada de Êxodo 15:2; o possessivo é suprido naturalmente a partir do sufixo ligado ao primeiro substantivo.
- source_word: יָהּ יְהוָה
  choice: Yah, Yahweh
  rationale: Preserva os dois nomes divinos presentes no hebraico, incluindo a forma abreviada poética e o Tetragrama, sem reduzir sua combinação a mera repetição.
- source_word: וַיְהִי לִי לִישׁוּעָה
  choice: e ele se tornou a minha salvação
  rationale: Expressa naturalmente o resultado experiencial da forma verbal hebraica e mantém a retomada de “minha salvação”.
theological_decisions:
- issue: Representação de יָהּ יְהוָה
  choice: Yah, Yahweh
  alternative: o SENHOR; Yah, o SENHOR; o SENHOR, o próprio SENHOR
  rationale: O texto traz a forma abreviada יָהּ seguida do nome יהוה. A transliteração de ambos preserva a forma incomum e enfática do original sem ocultar a distinção lexical.
- issue: Ressonância de Êxodo 15:2
  choice: manter “minha força”, “meu cântico” e a repetição de “minha salvação”
  alternative: empregar formulações interpretativas como “meu louvor” ou “meu libertador”
  rationale: A proximidade verbal com o cântico do êxodo é literariamente significativa e deve permanecer perceptível sem explicação doutrinária acrescentada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vejam” evita o arcaísmo de “Eis” no texto principal, preservado em nota; “cântico” mantém o registro poético. Os marcadores [a] e [b] aparecem no texto principal.
