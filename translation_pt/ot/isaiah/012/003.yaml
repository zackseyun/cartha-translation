  text: וּ/שְׁאַבְתֶּם מַ֖יִם בְּ/שָׂשׂ֑וֹן מִ/מַּעַיְנֵ֖י הַ/יְשׁוּעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/003.yaml
  text: With joy you will draw water from the springs of salvation[a][b].
translation:
  language: pt
  text: Com alegria, vocês tirarão água das fontes da salvação[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «dos mananciais da salvação» ou «das nascentes da salvação».
    reason: lexical_alternative
  - marker: b
    text: Neste contexto, «salvação» também pode ser traduzida por «livramento».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁאַבְתֶּם
  choice: vocês tirarão
  rationale: O qatal qal na segunda pessoa masculina plural, ligado pela conjunção, tem valor futuro neste discurso profético. Em português corrente, «vocês tirarão» expressa claramente tanto o plural quanto o futuro; a conjunção inicial não precisa ser vertida separadamente neste versículo.
- source_word: מַיִם
  choice: água
  rationale: Embora a forma hebraica seja morfologicamente plural, funciona como substantivo de massa e corresponde naturalmente ao singular «água» em português.
- source_word: בְּ/שָׂשׂוֹן
  choice: com alegria
  rationale: A preposição בְּ com o substantivo שָׂשׂוֹן indica a circunstância ou maneira da ação. «Com alegria» preserva a expressão nominal concreta e soa natural em português.
- source_word: מִ/מַּעַיְנֵי
  choice: das fontes
  rationale: מַעְיָן designa uma nascente, fonte ou manancial. «Fontes» comunica de modo claro uma origem de água e mantém a imagem poética sem sugerir necessariamente poços construídos.
- source_word: הַ/יְשׁוּעָה
  choice: da salvação
  rationale: יְשׁוּעָה pode indicar salvação ou livramento. «Salvação» conserva tanto o sentido imediato de resgate quanto a ressonância teológica mais ampla do contexto de Isaías.
theological_decisions:
- issue: Se יְשׁוּעָה deve ser traduzida em sentido temporal mais estreito («livramento») ou com alcance teológico mais amplo («salvação»)
  choice: salvação
  alternative: livramento
  rationale: Isaías 12 celebra a ação salvadora de Deus com profundidade histórica e teológica. «Salvação» preserva essa amplitude sem introduzir no texto especificações doutrinárias posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome «vocês» explicita a segunda pessoa do plural do hebraico. A formulação mantém a concisão e o paralelismo poético do versículo.
