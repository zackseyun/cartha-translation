  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֞ם בַּ/יּ֣וֹם הַ/ה֗וּא הוֹד֤וּ לַֽ/יהוָה֙ קִרְא֣וּ בִ/שְׁמ֔/וֹ הוֹדִ֥יעוּ בָֽ/עַמִּ֖ים עֲלִֽילֹתָ֑י/ו הַזְכִּ֕ירוּ כִּ֥י נִשְׂגָּ֖ב שְׁמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/004.yaml
  text: 'And you will say on that day: “Give thanks to Yahweh[a]; call on his name. Make his deeds known among the peoples[b]; proclaim that his name is exalted.”'
translation:
  language: pt
  text: 'E naquele dia vocês dirão: “Deem graças a Yahweh[a]; invoquem o seu nome. Tornem conhecidos entre os povos os seus feitos; proclamem que o seu nome é exaltado.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH, o nome divino; tradicionalmente traduzido por “SENHOR”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “proclamem, pois o seu nome é exaltado”. A conjunção hebraica pode indicar a razão da proclamação, em vez de introduzir o seu conteúdo.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: E naquele dia vocês dirão
  rationale: O wayyiqtol na segunda pessoa do plural tem sentido futuro no discurso profético; “vocês dirão” é natural e preserva o plural explícito.
- source_word: הוֹדוּ לַיהוָה
  choice: Deem graças a Yahweh
  rationale: O imperativo de ידה com ל expressa ação de graças ou louvor dirigido a Deus; “deem graças” conserva o sentido cultual sem arcaísmo.
- source_word: יהוה
  choice: Yahweh
  rationale: Translitera o nome divino presente no hebraico, em vez de substituí-lo por um título; uma alternativa tradicional é indicada em nota.
- source_word: קִרְאוּ בִשְׁמוֹ
  choice: invoquem o seu nome
  rationale: קרא com בְּשֵׁם frequentemente denota invocar alguém pelo nome, sobretudo em contexto de culto. “Invoquem” preserva esse sentido melhor que uma mera declaração pública.
- source_word: הוֹדִיעוּ בָעַמִּים עֲלִילֹתָיו
  choice: Tornem conhecidos entre os povos os seus feitos
  rationale: O hifil de ידע significa fazer conhecer; בָעַמִּים indica o âmbito “entre os povos”, e עֲלִילוֹת designa feitos ou ações sem exigir o acréscimo interpretativo “poderosos”.
- source_word: הַזְכִּירוּ
  choice: proclamem
  rationale: Embora o hifil de זכר possa significar “façam lembrar” ou “mencionem”, no paralelismo poético a ideia é uma declaração pública; “proclamem” comunica essa força em português corrente.
- source_word: כִּי נִשְׂגָּב שְׁמוֹ
  choice: que o seu nome é exaltado
  rationale: נשגב expressa altura ou exaltação majestosa. כִּי pode introduzir o conteúdo da proclamação (“que”) ou sua causa (“pois”); a leitura alternativa é preservada em nota.
theological_decisions:
- issue: Forma de representar o nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” o representa diretamente, enquanto “SENHOR” é a substituição tradicional e permanece indicada como alternativa.
- issue: Função de כִּי depois de הַזְכִּירוּ
  choice: 'Conteúdo da proclamação: “proclamem que o seu nome é exaltado”'
  alternative: 'Valor causal: “proclamem, pois o seu nome é exaltado”'
  rationale: As duas construções são gramaticalmente possíveis. A leitura completiva flui naturalmente após “proclamem”, sem eliminar a leitura causal, registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas verbais no plural brasileiro (“vocês”) e paralelismo imperativo preservado. O ponto da nota [b] foi colocado após a oração a que se refere.
