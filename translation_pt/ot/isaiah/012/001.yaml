  text: וְ/אָֽמַרְתָּ֙ בַּ/יּ֣וֹם הַ/ה֔וּא אוֹדְ/ךָ֣ יְהוָ֔ה כִּ֥י אָנַ֖פְתָּ בִּ֑/י יָשֹׁ֥ב אַפְּ/ךָ֖ וּֽ/תְנַחֲמֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/001.yaml
  text: And you will say in that day[a], “I will praise you, O Yahweh, for though you were angry with me, your anger has turned away[b], and you comfort me.”
translation:
  language: pt
  text: 'Naquele dia, você dirá: “Eu te louvarei[a], ó Yahweh, pois, embora tenhas ficado irado comigo, tua ira se afastará[b], e tu me consolarás.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu te agradecerei” ou “Eu te darei graças”. O verbo hebraico pode expressar tanto agradecimento como louvor prestado em adoração.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente, “tua ira voltará”. “Ira” traduz um idioma hebraico que literalmente se refere ao “nariz”. As formas verbais também podem ser entendidas como desejo: “que tua ira se afaste, e que tu me consoles”.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: você dirá
  rationale: O perfeito qal de segunda pessoa masculina singular, ligado por וְ no discurso profético, tem sentido prospectivo. “Você dirá” é claro e natural em português moderno.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Preserva a fórmula temporal profética usual sem explicitar além do texto seu possível alcance escatológico.
- source_word: אוֹדְךָ
  choice: eu te louvarei
  rationale: O hifil de ידה pode indicar louvor, agradecimento ou ação de graças. Neste cântico de livramento, “louvarei” comunica bem a dimensão de culto, enquanto a alternativa é registrada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כִּי אָנַפְתָּ בִּי
  choice: pois, embora tenhas ficado irado comigo
  rationale: 'כִּי introduz a base da declaração, mas a sequência completa tem força concessiva: a ira existiu, porém cessou e deu lugar ao consolo. “Embora” torna essa relação natural em português sem negar a conexão causal ampla.'
- source_word: יָשֹׁב אַפְּךָ
  choice: tua ira se afastou
  rationale: אַף, literalmente associado ao “nariz”, é um idioma hebraico para ira. “Afastou-se” transmite naturalmente a imagem de a ira voltar para trás ou retirar-se.
- source_word: וּתְנַחֲמֵנִי
  choice: e tu me consolaste
  rationale: O piel de נחם significa consolar. O passado acompanha a leitura contextual da retirada da ira como livramento já experimentado dentro do cântico profético.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino. “Yahweh” preserva sua presença explícita sem substituí-lo por um título.
- issue: Relação entre a ira divina e o louvor
  choice: força concessiva expressa por “embora”
  alternative: “porque ficaste irado comigo”
  rationale: A razão do louvor emerge da sequência inteira — a ira se afasta e vem o consolo —, não da ira isoladamente. A formulação conserva tanto a realidade da ira quanto a mudança subsequente.
- issue: Valor temporal ou modal de יָשֹׁב e וּתְנַחֲמֵנִי
  choice: 'passado narrado a partir do horizonte do cântico: “se afastou... me consolaste”'
  alternative: 'desejo ou expectativa: “que tua ira se afaste... e me consoles”'
  rationale: No contexto, os imperfeitos podem apresentar ações vistas como realizadas no dia futuro do louvor; contudo, sua forma também permite leitura volitiva ou prospectiva. A alternativa é preservada em nota para não eliminar a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Você dirá” evita o futuro excessivamente solene de “tu dirás”; dentro da oração, “te”, “tenhas” e “tua” mantêm uma interpelação direta, fluente e reverente a Yahweh. A ordem poética e a tensão entre ira e consolo foram preservadas.
