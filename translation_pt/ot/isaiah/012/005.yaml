  source_fidelity: 'A tradução representa bem os elementos do hebraico: o imperativo plural de זמר é adequadamente expresso por “Cantem louvores”; Yahweh preserva o Tetragrama; “pois” introduz a justificativa; “ele agiu com majestade” comunica de modo natural o valor de גֵאוּת עָשָׂה; e “que isso seja conhecido em toda a terra” reproduz corretamente a força passiva-volitiva de מוּדַעַת זֹאת e o alcance universal de בְּכָל הָאָרֶץ.'
