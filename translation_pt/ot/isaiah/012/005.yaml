id: ISA.12.5
reference: Isaiah 12:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: זַמְּר֣וּ יְהוָ֔ה כִּ֥י גֵא֖וּת עָשָׂ֑ה מידעת זֹ֖את בְּ/כָל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/005.yaml
  text: Sing praise to Yahweh[a], for he has done gloriously; let this be made known in all the earth.
translation:
  language: pt
  text: Cantem louvores a Yahweh, pois ele agiu com majestade[a]; que isso seja conhecido em toda a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ele realizou coisas gloriosas” ou “ele agiu de modo excelente”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זַמְּרוּ
  choice: Cantem louvores
  rationale: O imperativo plural intensivo de זמר convoca ao louvor musical; a expressão é natural em português e preserva tanto o canto quanto seu caráter de adoração.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כִּי
  choice: pois
  rationale: Introduz de modo conciso a razão para a convocação ao louvor.
- source_word: גֵאוּת עָשָׂה
  choice: ele agiu com majestade
  rationale: A combinação do substantivo abstrato גֵאוּת com עשה descreve uma ação que manifesta exaltação, excelência ou majestade. Esta formulação preserva o caráter abstrato da expressão e soa natural em português.
- source_word: מידעת זֹאת
  choice: que isso seja conhecido
  rationale: 'No contexto das exortações do cântico, a forma é entendida com valor passivo volitivo: aquilo que Yahweh fez deve ser divulgado.'
- source_word: בְּכָל הָאָרֶץ
  choice: em toda a terra
  rationale: O contexto de proclamação universal favorece o sentido global de אֶרֶץ, e não apenas o de uma região ou país.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o nome divino; a transliteração Yahweh preserva sua condição de nome próprio sem o substituir por um título.
- issue: Sentido de גֵאוּת עָשָׂה
  choice: ele agiu com majestade
  alternative: ele fez coisas gloriosas
  rationale: A expressão hebraica usa um substantivo abstrato singular e admite mais de uma formulação. A opção escolhida mantém esse caráter sem definir as ações como vários feitos distintos.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com imperativo plural natural e paralelismo preservado. O ponto e vírgula mantém unidas a convocação ao louvor e a convocação à proclamação.
