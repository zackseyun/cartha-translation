  naturalness: O registro é atual e claro. “Os que você reuniu” soa mais natural que “a sua coleção” neste contexto e permite a concordância plural exigida pela sequência. “Um sopro os levará” preserva o paralelismo conciso e evita a intensidade adicional de “arrebatará”.
  terminology: “Refugia”, “herdará a terra” e “possuirá o meu santo monte” são escolhas adequadas. A nota sobre o referente reunido preserva corretamente as possibilidades de ídolos, aliados ou outros objetos de falsa confiança; a nota sobre “terra” mantém a alternativa sem impor uma leitura.
