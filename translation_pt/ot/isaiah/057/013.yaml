base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/013.yaml
  text: When you cry out[a], let your gathered idols rescue you! But the wind will carry all of them off; a breath will take them away[c][b]. But whoever takes refuge in me will inherit the land and possess my holy mountain.
translation:
  language: pt
  text: Quando você clamar, que os que você reuniu[a] a livrem! Mas o vento levará todos eles; um sopro os levará.[b] Porém, quem se refugia em mim herdará a terra[c] e possuirá o meu santo monte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. “os seus reunidos” ou “aquilo que você reuniu”. No contexto, pode referir-se a ídolos, aliados ou outros objetos de falsa confiança.
    reason: lexical_alternative
  - marker: b
    text: “Vento” e “sopro” formam um paralelo poético que destaca como esses falsos apoios desaparecem facilmente.
    reason: cultural_note
  - marker: c
    text: Ou “o país”; o termo hebraico também pode significar “mundo”. A referência seguinte ao santo monte favorece aqui o sentido da terra ligada a Sião.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּזַעֲקֵךְ
  choice: Quando você clamar
  rationale: A construção com בְּ tem sentido temporal; “clamar” conserva a intensidade do pedido em situação de aflição.
- source_word: יַצִּילֻךְ
  choice: que ... a livre!
  rationale: O imperfeito assume no contexto a força irônica de um desafio, e o pronome feminino corresponde à pessoa interpelada no hebraico.
- source_word: קִבּוּצַיִךְ
  choice: a sua coleção
  rationale: O substantivo designa aquilo que foi reunido. A tradução mantém a relativa abertura lexical do hebraico, enquanto a nota esclarece os referentes contextualmente possíveis.
- source_word: יִשָּׂא רוּחַ
  choice: o vento levará
  rationale: רוּחַ significa aqui “vento”, em paralelo poético com הָבֶל; “levará” comunica naturalmente a remoção completa.
- source_word: יִקַּח הָבֶל
  choice: um sopro os arrebatará
  rationale: הָבֶל conserva a imagem concreta de sopro ou vapor. “Arrebatará” expressa que até um sopro basta para remover os falsos apoios.
- source_word: וְהַחוֹסֶה בִי
  choice: Porém, quem se refugia em mim
  rationale: O particípio expressa uma postura contínua de confiança; a formulação é inclusiva e natural em português moderno.
- source_word: יִנְחַל אֶרֶץ
  choice: herdará a terra
  rationale: נחל indica receber como herança. אֶרֶץ pode ser “terra” no sentido territorial ou mais amplo, ambiguidade preservada no texto e explicitada em nota.
- source_word: וְיִירַשׁ הַר קָדְשִׁי
  choice: e possuirá o meu santo monte
  rationale: “Possuirá” traduz ירשׁ sem repetir “herdará” e mantém a referência concreta ao monte santo, isto é, Sião.
theological_decisions:
- issue: Referente de קִבּוּצַיִךְ (“sua coleção”)
  choice: Manter no texto a expressão aberta “a sua coleção”
  alternative: Explicitar “os ídolos que você reuniu” ou entender como aliados reunidos
  rationale: Embora o contexto favoreça ídolos e outros falsos apoios, o substantivo hebraico não nomeia diretamente os ídolos. A nota preserva as possibilidades sem enfraquecer a ironia profética.
- issue: Sentido de אֶרֶץ
  choice: terra
  alternative: país/terra de Israel ou mundo
  rationale: A proximidade de “meu santo monte” favorece o sentido territorial ligado a Sião, mas o termo também pode ter alcance mais amplo. “Terra” preserva essa tensão em português.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por “você” acompanha o singular feminino do discurso; “a livre” preserva essa concordância. A formulação evita explicitar “ídolos” no corpo do versículo para conservar a ambiguidade genuína de קִבּוּצַיִךְ, esclarecida em nota.
