  text: יָב֣וֹא שָׁל֔וֹם יָנ֖וּחוּ עַל מִשְׁכְּבוֹתָ֑/ם הֹלֵ֖ךְ נְכֹחֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/002.yaml
  text: He enters into peace[a]; they rest on their beds[c][b], each one who walks in his uprightness.
translation:
  language: pt
  text: Ele entra na paz[a]; eles descansam em seus leitos[b], cada um que anda em sua retidão[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele vem para a paz”. O verbo hebraico permite ambas as traduções neste contexto.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico alterna entre singular e plural: “ele entra… eles descansam… cada um que anda…”.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “cada um que anda reto diante dele” ou “cada um que anda de maneira reta”. A expressão hebraica é condensada e admite essas possibilidades.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָבוֹא
  choice: entra
  rationale: O qal imperfeito, na sequência poética do versículo anterior, apresenta a chegada do justo à condição de paz. “Entra” é natural em português e mantém a forma singular sem explicitar além do texto.
- source_word: שָׁלוֹם
  choice: paz
  rationale: O termo abrange paz, bem-estar e plenitude. “Paz” é a equivalência mais direta e conserva a amplitude poética do hebraico.
- source_word: יָנוּחוּ
  choice: eles descansam
  rationale: O qal imperfeito está no plural. “Descansam” preserva tanto a ideia de repouso quanto a imagem discreta da morte, sem transformá-la numa afirmação metafísica explícita.
- source_word: עַל מִשְׁכְּבוֹתָם
  choice: em seus leitos
  rationale: A expressão significa literalmente os lugares onde eles se deitam. “Leitos” conserva a metáfora, soa digna em português e se ajusta ao contexto de repouso na morte.
- source_word: הֹלֵךְ
  choice: que anda
  rationale: O particípio masculino singular descreve conduta característica. O presente “anda” reproduz melhor o valor participial sem obrigar a leitura a uma ação apenas passada.
- source_word: נְכֹחוֹ
  choice: em sua retidão
  rationale: A expressão condensada comunica a ideia de andar de modo reto, embora o sufixo e a construção permitam outras análises. A tradução mantém o sentido ético no texto e registra as alternativas em nota.
theological_decisions:
- issue: Alternância entre singular e plural no versículo
  choice: Manter “Ele entra” no singular e “eles descansam” no plural, retomando distributivamente o singular em “cada um”.
  alternative: Uniformizar todo o versículo no singular ou todo no plural.
  rationale: O hebraico alterna deliberadamente entre formas singulares e plurais. Preservar essa tensão evita regularizar silenciosamente o texto; “cada um” torna a construção compreensível em português.
- issue: Imagem da morte e do repouso
  choice: Conservar a imagem de descansar em leitos.
  alternative: Explicitar que se trata da sepultura ou interpretar o repouso diretamente como estado celestial.
  rationale: O contexto associa a paz e o repouso à morte do justo, mas não define aqui todos os detalhes do estado posterior à morte. A metáfora deve permanecer aberta.
- issue: Sentido da expressão נְכֹחוֹ
  choice: Traduzir eticamente como “em sua retidão”.
  alternative: “reto diante dele” ou “de maneira reta”.
  rationale: A construção hebraica é concisa e admite mais de uma relação para o sufixo. A opção principal se encaixa no justo do contexto, enquanto a nota preserva a ambiguidade legítima.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Leitos” preserva o tom poético sem ser arcaico; a alternância de número e a ambiguidade da frase final foram mantidas e explicadas em notas.
