id: ISA.57.1
reference: Isaiah 57:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַ/צַּדִּ֣יק אָבָ֔ד וְ/אֵ֥ין אִ֖ישׁ שָׂ֣ם עַל לֵ֑ב וְ/אַנְשֵׁי חֶ֤סֶד נֶֽאֱסָפִים֙ בְּ/אֵ֣ין מֵבִ֔ין כִּֽי מִ/פְּנֵ֥י הָ/רָעָ֖ה נֶאֱסַ֥ף הַ/צַּדִּֽיק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/001.yaml
  text: The righteous man perishes[a], and no one takes it to heart; men of faithful love are gathered away, with no one understanding that the righteous man is gathered away because of evil.
translation:
  language: pt
  text: O justo perece, e ninguém leva isso a sério; homens de amor leal são recolhidos, sem que ninguém entenda que o justo é recolhido para longe do mal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da calamidade” ou “do desastre que está por vir”.'
    reason: A palavra hebraica traduzida por “mal” também pode designar calamidade ou desastre, e a expressão pode indicar que o justo é retirado antes que isso aconteça.
lexical_decisions:
- source_word: הַצַּדִּיק
  choice: o justo
  rationale: O adjetivo masculino singular com artigo é usado como substantivo. “O justo” é natural em português, mantém o singular representativo e comunica o sentido moral e pactual sem acrescentar um substantivo ausente no hebraico.
- source_word: אָבָד
  choice: perece
  rationale: O qal perfeito de אבד pode indicar perecer, desaparecer ou estar perdido. O presente profético “perece” preserva a força do lamento e não especifica além do texto a maneira da morte ou remoção.
- source_word: שָׂם עַל לֵב
  choice: leva isso a sério
  rationale: O idioma expressa prestar séria atenção interior. “Leva isso a sério” é corrente e claro em português, preservando o peso moral da expressão.
- source_word: אַנְשֵׁי חֶסֶד
  choice: homens de amor leal
  rationale: חֶסֶד reúne as ideias de lealdade, bondade constante e amor fiel. “Amor leal” preserva essa riqueza pactual, enquanto “homens” reflete o plural masculino explícito.
- source_word: נֶאֱסָפִים / נֶאֱסַף
  choice: são recolhidos / é recolhido
  rationale: O nifal de אסף pode funcionar como eufemismo de morte. “Recolhido” conserva a metáfora hebraica e a repetição entre as formas plural e singular.
- source_word: בְּאֵין מֵבִין
  choice: sem que ninguém entenda
  rationale: A construção com בְּ e אֵין descreve a circunstância concomitante. Esta formulação é natural e mantém a falta de discernimento destacada no hebraico.
- source_word: כִּי
  choice: que
  rationale: Introduz aqui o conteúdo daquilo que ninguém entende.
- source_word: מִפְּנֵי הָרָעָה
  choice: para longe do mal
  rationale: A preposição מִן com פְּנֵי pode indicar afastamento de diante ou da presença de algo. A formulação mantém a nuance espacial e deixa aberta a referência tanto ao mal moral quanto à calamidade iminente.
theological_decisions:
- issue: Se הָרָעָה designa mal moral ou calamidade/desastre
  choice: mal
  alternative: calamidade ou desastre vindouro
  rationale: רָעָה admite ambos os sentidos. “Mal” preserva a amplitude semântica no texto principal; a nota registra a leitura circunstancial, provavelmente relevante no contexto de juízo.
- issue: Se מִפְּנֵי indica causa ou afastamento/proteção
  choice: para longe do
  alternative: por causa do
  rationale: A expressão pode ser entendida como remoção da presença do mal ou como relação causal. A opção principal preserva melhor a imagem espacial do hebraico sem excluir a leitura de livramento diante da calamidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva o paralelismo, a repetição de “justo” e “recolhido” e a ambiguidade de מִפְּנֵי הָרָעָה.
