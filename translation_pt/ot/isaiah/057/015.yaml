  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֜ר רָ֣ם וְ/נִשָּׂ֗א שֹׁכֵ֥ן עַד֙ וְ/קָד֣וֹשׁ שְׁמ֔/וֹ מָר֥וֹם וְ/קָד֖וֹשׁ אֶשְׁכּ֑וֹן וְ/אֶת דַּכָּא֙ וּ/שְׁפַל ר֔וּחַ לְ/הַחֲיוֹת֙ ר֣וּחַ שְׁפָלִ֔ים וּֽ/לְ/הַחֲי֖וֹת לֵ֥ב נִדְכָּאִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/015.yaml
  text: 'For thus says the One who is high and lifted up[a], who inhabits eternity, whose name is Holy: “I dwell in the high and holy place, and also with the crushed and lowly in spirit[b], to revive the spirit of the lowly and to revive the heart of the crushed.”'
translation:
  language: pt
  text: 'Pois assim diz Aquele que é alto e exaltado, que habita a eternidade[a] e cujo nome é Santo: “Habito no lugar alto e santo, e também com o esmagado e o humilde de espírito[b], para reavivar o espírito dos humildes e reavivar o coração dos esmagados.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que habita para sempre”. A expressão hebraica pode destacar tanto a duração eterna quanto a habitação na eternidade.'
    reason: lexical_alternative
  - marker: b
    text: 'Tradicionalmente: “com o contrito e humilde de espírito” e, no fim do versículo, “o coração dos contritos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָם וְנִשָּׂא
  choice: alto e exaltado
  rationale: Preserva a dupla descrição da transcendência e exaltação divina, mantendo a imagem vertical do hebraico em português natural e solene.
- source_word: שֹׁכֵן עַד
  choice: que habita a eternidade
  rationale: Conserva a expressão compacta e elevada e o vínculo verbal com אֶשְׁכּוֹן, sem eliminar a possível nuance de duração perpétua.
- source_word: קָדוֹשׁ שְׁמוֹ
  choice: cujo nome é Santo
  rationale: Expressa naturalmente a oração nominal hebraica e mantém “Santo” como predicativo de “nome”.
- source_word: מָרוֹם וְקָדוֹשׁ אֶשְׁכּוֹן
  choice: Habito no lugar alto e santo
  rationale: “Lugar” é suprido para tornar idiomática a referência locativa de מָרוֹם; “habito” preserva a repetição conceitual de שֹׁכֵן.
- source_word: דַּכָּא / נִדְכָּאִים
  choice: esmagado / esmagados
  rationale: Reproduz diretamente a imagem lexical de alguém esmagado ou quebrado e evita restringi-la à ideia interpretativa de arrependimento.
- source_word: שְׁפַל רוּחַ
  choice: humilde de espírito
  rationale: Comunica a condição interior de baixeza ou humildade em linguagem portuguesa corrente, preservando “espírito”.
- source_word: לְהַחֲיוֹת
  choice: reavivar
  rationale: Traduz o causativo de חיה como restauração da vida e das forças, sem impor aqui uma referência específica à ressurreição.
- source_word: רוּחַ שְׁפָלִים
  choice: o espírito dos humildes
  rationale: Mantém o termo antropológico “espírito” e traduz o adjetivo plural substantivado de modo natural.
- source_word: לֵב נִדְכָּאִים
  choice: o coração dos esmagados
  rationale: Preserva “coração” e mantém a coerência lexical entre נִדְכָּאִים e דַּכָּא.
theological_decisions:
- issue: Transcendência e imanência divinas no mesmo versículo
  choice: Manter lado a lado a habitação elevada e santa de Deus e sua presença com os esmagados e humildes.
  alternative: Atenuar um dos polos ou interpretar a presença com os esmagados como meramente figurada.
  rationale: O hebraico justapõe explicitamente as duas afirmações; a tradução conserva essa tensão sem explicá-la ou resolvê-la.
- issue: Sentido de דַּכָּא / נִדְכָּאִים
  choice: Usar “esmagado(s)” no texto principal.
  alternative: “Contrito(s)” ou “quebrantado(s)”.
  rationale: “Esmagado” representa mais diretamente a imagem lexical. “Contrito” pode sugerir especificamente arrependimento, nuance possível no contexto religioso, mas não exigida pelos termos hebraicos.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. A repetição de “habita/Habito” e “reavivar” foi mantida por refletir a estrutura hebraica. “E também” preserva a surpreendente justaposição entre a transcendência divina e sua presença junto aos abatidos, sem transformá-la em contraste adversativo.
