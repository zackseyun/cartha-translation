  text: וְ/אַתֶּ֥ם קִרְבוּ הֵ֖נָּה בְּנֵ֣י עֹנְנָ֑ה זֶ֥רַע מְנָאֵ֖ף וַ/תִּזְנֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/003.yaml
  text: But you—come here[a], sons of a sorceress[b], offspring of an adulterer and a prostitute.
translation:
  language: pt
  text: Mas vocês, venham para cá, filhos de uma adivinha[a], descendência de um adúltero e de uma prostituta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “feiticeira” ou “mulher que pratica adivinhação”. O termo hebraico se refere a uma prática ilícita de adivinhação.
    reason: lexical_alternative
  - marker: b
    text: Essa linguagem pode ser uma metáfora profética para a idolatria e a infidelidade espiritual, e não necessariamente uma afirmação literal sobre a ascendência dos ouvintes.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: Mas vocês
  rationale: A conjunção e o pronome explícito introduzem um contraste forte com o contexto anterior; “Mas vocês” expressa naturalmente essa força adversativa.
- source_word: קִרְבוּ הֵנָּה
  choice: aproximem-se daqui
  rationale: O imperativo plural de קרב, seguido do advérbio dêitico הֵנָּה, constitui uma convocação direta. A formulação conserva tanto a ideia de aproximação quanto a referência a “aqui”.
- source_word: בְּנֵי
  choice: filhos de
  rationale: Mantém o masculino plural explícito do hebraico e sua função idiomática de indicar origem, pertencimento ou caráter.
- source_word: עֹנְנָה
  choice: uma adivinha
  rationale: A forma feminina se refere a uma mulher que pratica adivinhação ilícita. “Adivinha” é mais específica que “feiticeira” e é compreensível em português atual.
- source_word: זֶרַע
  choice: descendência de
  rationale: Reproduz a imagem genealógica de “semente/prole” em português natural, sem obrigar uma leitura estritamente biológica.
- source_word: מְנָאֵף
  choice: um adúltero
  rationale: O particípio masculino singular designa diretamente um homem que comete adultério.
- source_word: וַ/תִּזְנֶה
  choice: e de uma mulher que se prostitui
  rationale: A forma verbal é feminina singular, literalmente referente a uma mulher que pratica prostituição. A oração verbal preserva melhor a forma hebraica do que o simples substantivo “prostituta”; a repetição de “de uma mulher” torna explícita em português a relação com “descendência”.
theological_decisions:
- issue: Natureza das imagens de denúncia
  choice: Conservar a linguagem de filiação, adultério e prostituição sem decidir no texto principal se ela é literal ou metafórica.
  alternative: Entender a frase exclusivamente como acusação de ascendência imoral literal, ou exclusivamente como metáfora de idolatria e infidelidade à aliança.
  rationale: O contexto profético favorece uma dimensão metafórica ligada à apostasia, mas a formulação hebraica mantém a forma de uma acusação genealógica. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. “Aproximem-se daqui” mantém o tom solene de convocação e confronto; “mulher que se prostitui” evita tanto um eufemismo quanto um termo desnecessariamente depreciativo.
