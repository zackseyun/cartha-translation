  text: וְ/אָמַ֥ר סֹֽלּוּ סֹ֖לּוּ פַּנּוּ דָ֑רֶךְ הָרִ֥ימוּ מִכְשׁ֖וֹל מִ/דֶּ֥רֶךְ עַמִּֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/014.yaml
  text: And it will be said[a], “Build up, build up; clear the way; remove the stumbling block from the way of my people.”
translation:
  language: pt
  text: 'E será dito[a]: “Aterrem, aterrem! Desobstruam o caminho; removam do caminho do meu povo aquilo que o faz tropeçar.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E alguém dirá”. O sujeito não é identificado no hebraico.'
    reason: ambiguidade gramatical
lexical_decisions:
- source_word: וְאָמַר
  choice: E será dito
  rationale: Mantém a fórmula de anúncio impessoal, sem identificar um sujeito que o hebraico não explicita.
- source_word: סֹלּוּ סֹלּוּ
  choice: Aterrem, aterrem
  rationale: O verbo evoca a construção de uma estrada mediante o levantamento ou nivelamento de um aterro; a repetição enfática foi preservada.
- source_word: פַּנּוּ דָרֶךְ
  choice: Desobstruam o caminho
  rationale: Expressa de modo natural a ordem de abrir espaço ou deixar livre uma via.
- source_word: הָרִימוּ
  choice: removam
  rationale: Embora signifique literalmente levantar, neste contexto descreve retirar do caminho aquilo que impede a passagem.
- source_word: מִכְשׁוֹל
  choice: aquilo que o faz tropeçar
  rationale: Preserva a imagem concreta de algo que causa tropeço e explicita de modo natural em português sua relação com o povo.
- source_word: מִדֶּרֶךְ עַמִּי
  choice: do caminho do meu povo
  rationale: Conserva tanto a noção espacial de remoção quanto a relação possessiva do caminho com o povo.
theological_decisions:
- issue: Identificação de quem fala na fórmula inicial
  choice: 'Anúncio impessoal: “será dito”'
  alternative: “ele dirá” ou “alguém dirá”
  rationale: O hebraico não identifica expressamente o sujeito; a forma impessoal conserva essa ambiguidade sem atribuir a fala especificamente a Deus ou a uma pessoa.
translation_notes:
  register: Português moderno, claro e digno, com forte imagética de construção viária. “Aterrem” é empregado no sentido de formar ou elevar uma estrada com aterro; “desobstruam” evita redundância com a ordem final de remover o causador de tropeço.
