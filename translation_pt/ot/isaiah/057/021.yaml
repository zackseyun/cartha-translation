  yaml_path: translation/ot/isaiah/057/021.yaml
  text: There is no peace," says my God[b][a], "for the wicked.
translation:
  language: pt
  text: “Não há paz[a]”, diz o meu Deus[b], “para os ímpios.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bem-estar” ou “plenitude”. O termo hebraico shalom tem sentido mais amplo que a simples ausência de conflito.
    reason: lexical_alternative
  - marker: b
    text: 'Isaías 48:22 traz uma formulação muito semelhante: “Não há paz”, diz o SENHOR, “para os ímpios”. Aqui, o hebraico diz “o meu Deus”.'
    reason: cross_reference
lexical_decisions:
- source_word: אֵין
  choice: Não há
  rationale: Expressa de modo natural e direto em português a negação existencial absoluta do hebraico.
- source_word: שָׁלוֹם
  choice: paz
  rationale: É o equivalente consagrado e adequado ao contexto, embora o hebraico também abranja bem-estar e integridade, sentidos registrados em nota.
- source_word: אָמַר
  choice: diz
  rationale: Embora a forma hebraica seja perfeita, funciona aqui como fórmula de citação profética; o presente é natural em português.
- source_word: אֱלֹהַי
  choice: o meu Deus
  rationale: Preserva explicitamente o sufixo possessivo de primeira pessoa do Texto Massorético, sem harmonização com Isaías 48:22.
- source_word: לָרְשָׁעִים
  choice: para os ímpios
  rationale: A preposição indica referência ou destinatários em relação aos quais não há paz; 'ímpios' preserva a categoria moral de רְשָׁעִים sem acrescentar explicação.
theological_decisions:
- issue: Atribuição do pronunciamento divino
  choice: “o meu Deus”, preservando o possessivo de primeira pessoa do Texto Massorético
  alternative: “o SENHOR”, por harmonização com Isaías 48:22, ou simplesmente “Deus”
  rationale: O hebraico recebido traz אֱלֹהַי, literalmente “meu Deus”. A tradução mantém essa forma, preservando a voz do profeta e evitando harmonização interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com estrutura breve e enfática correspondente à sentença profética. O artigo em “o meu Deus” é natural no português brasileiro e amplamente compreensível em outras variantes. Os marcadores seguem a ordem em que aparecem no texto.
