revisions:
- from: De quem você teve receio e medo, a ponto de mentir, não se lembrar de mim e não levar isso a sério[a]? Não foi por eu ter permanecido calado, e isso desde há muito tempo[b], que você não me teme?
  to: De quem você se preocupou e teve medo, a ponto de mentir, não se lembrar de mim e não levar isso a sério[a]? Não foi por eu ter permanecido calado desde muito tempo[b] que você não me teme?
  rationale: A revisão substitui o par redundante 'receio e medo' por uma formulação que preserva a possível preocupação ansiosa de דאג ao lado do temor de ירא. Também torna a ligação temporal com o silêncio divino mais direta e melhora a fluência da nota sem alterar o sentido ou resolver ambiguidades interpretativas.
