  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אֶת מִ֞י דָּאַ֤גְתְּ וַ/תִּֽירְאִי֙ כִּ֣י תְכַזֵּ֔בִי וְ/אוֹתִ/י֙ לֹ֣א זָכַ֔רְתְּ לֹא שַׂ֖מְתְּ עַל לִבֵּ֑/ךְ הֲ/לֹ֨א אֲנִ֤י מַחְשֶׁה֙ וּ/מֵ֣/עֹלָ֔ם וְ/אוֹתִ֖/י לֹ֥א תִירָֽאִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/011.yaml
  text: And whom did you dread and fear[a], so that you lied and did not remember me, did not lay it to your heart? Was it not because I have kept silent, and that from long ago[b], that you do not fear me?
translation:
  language: pt
  text: De quem você se preocupou e teve medo, a ponto de mentir, não se lembrar de mim e não levar isso a sério[a]? Não foi por eu ter permanecido calado desde muito tempo[b] que você não me teme?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não colocou [isso] em seu coração”. A expressão hebraica diz literalmente “não colocou [isso] sobre o seu coração”.
    reason: lexical_alternative
  - marker: b
    text: Ou “eu permaneci calado por muito tempo” / “eu me calava desde tempos antigos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּאַגְתְּ וַתִּירְאִי
  choice: teve receio e medo
  rationale: Mantém o par hebraico de ansiedade ou temor apreensivo e medo, preservando a força retórica sem reduzir os dois verbos a uma única ideia.
- source_word: כִּי תְכַזֵּבִי
  choice: a ponto de mentir
  rationale: 'Expressa em português corrente o sentido consecutivo de כִּי neste contexto: o temor de outros resultou em falsidade, sem sugerir finalidade deliberada.'
- source_word: וְאוֹתִי לֹא זָכַרְתְּ
  choice: não se lembrar de mim
  rationale: Conserva o sentido cognitivo e relacional de זכר de maneira direta e natural.
- source_word: לֹא שַׂמְתְּ עַל לִבֵּךְ
  choice: não levar isso a sério
  rationale: Traduz o valor idiomático de pôr algo sobre o coração; a nota preserva a imagem literal e a ambiguidade do objeto implícito.
- source_word: הֲלוֹא אֲנִי מַחְשֶׁה
  choice: Não foi por eu ter permanecido calado
  rationale: Apresenta a pergunta negativa como explicação causal e verte חשה como silêncio continuado de Deus.
- source_word: וּמֵעוֹלָם
  choice: e isso desde há muito tempo
  rationale: Entende עוֹלָם como longa duração passada, não como eternidade abstrata, e mantém sua ligação com o silêncio divino.
- source_word: וְאוֹתִי לֹא תִירָאִי
  choice: que você não me teme
  rationale: Preserva o resultado expresso no fechamento da pergunta e o aspecto atual ou habitual do imperfeito hebraico.
theological_decisions:
- issue: Sentido do silêncio divino
  choice: O silêncio prolongado de Deus é apresentado como ocasião para a falta de temor da destinatária.
  alternative: Entender o silêncio como mera não intervenção ou como ocultamento divino absoluto.
  rationale: 'A formulação conserva a tensão do texto: Deus relaciona seu longo silêncio à ausência de temor, sem fazer desse silêncio indiferença, aprovação ou uma afirmação doutrinária mais ampla.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição “receio e medo” preserva o paralelismo hebraico; “a ponto de” torna clara a consequência sem convertê-la em propósito. Os pronomes e verbos não explicitam desnecessariamente o gênero feminino marcado no hebraico.
