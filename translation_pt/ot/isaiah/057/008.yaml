  text: וְ/אַחַ֤ר הַ/דֶּ֨לֶת֙ וְ/הַ/מְּזוּזָ֔ה שַׂ֖מְתְּ זִכְרוֹנֵ֑/ךְ כִּ֣י מֵ/אִתִּ֞/י גִּלִּ֣ית וַֽ/תַּעֲלִ֗י הִרְחַ֤בְתְּ מִשְׁכָּבֵ/ךְ֙ וַ/תִּכְרָת לָ֣/ךְ מֵ/הֶ֔ם אָהַ֥בְתְּ מִשְׁכָּבָ֖/ם יָ֥ד חָזִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/008.yaml
  text: Behind the door and the doorpost you set up your memorial[a]; for away from me you uncovered yourself and went up; you made your bed wide, and you made a covenant for yourself with them; you loved their bed[c][b]; you looked on a hand.
translation:
  language: pt
  text: Atrás da porta e do batente, você colocou o seu memorial[a]; pois, longe de mim, você se desnudou e subiu. Alargou a sua cama e fez para si uma aliança com eles[b]; você amou a cama deles e contemplou uma mão[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “você colocou o seu símbolo” ou “a sua lembrança”. O hebraico pode se referir a um objeto memorial idólatra colocado às escondidas.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “cortou para si com eles”. O hebraico emprega linguagem própria da celebração de uma aliança, embora a palavra “aliança” não apareça expressamente.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “contemplou uma mão”. A expressão é obscura; entre os sentidos propostos estão um monumento ou marco e um eufemismo sexual.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַחַר הַדֶּלֶת וְהַמְּזוּזָה
  choice: Atrás da porta e do batente
  rationale: אַחַר tem sentido espacial, e מְזוּזָה designa o batente ou umbral lateral da porta, não a soleira. A formulação conserva a imagem de algo colocado às escondidas.
- source_word: שַׂמְתְּ זִכְרוֹנֵךְ
  choice: você colocou o seu memorial
  rationale: זִכָּרוֹן pode designar uma lembrança ou objeto memorial. “Memorial” mantém a concretude e a ambiguidade sem identificar explicitamente o objeto como ídolo.
- source_word: כִּי מֵאִתִּי גִּלִּית
  choice: pois, longe de mim, você se desnudou
  rationale: מֵאִתִּי expressa separação em relação a YHWH, enquanto גלה preserva a imagem de exposição corporal, com conotações de vergonha, sexualidade e apostasia.
- source_word: וַתַּעֲלִי
  choice: e subiu
  rationale: עלה significa “subir”. A tradução não explicita se a subida é para a cama ou para um lugar alto, preservando a abertura da imagem hebraica.
- source_word: הִרְחַבְתְּ מִשְׁכָּבֵךְ
  choice: Alargou a sua cama
  rationale: A forma causativa de רחב significa tornar largo ou ampliar. A expressão mantém a metáfora sexual sem convertê-la em explicação abstrata.
- source_word: וַתִּכְרָת לָךְ מֵהֶם
  choice: fez para si uma aliança com eles
  rationale: כרת é empregado na fórmula idiomática de firmar ou “cortar” uma aliança. Embora בְּרִית não esteja expresso, a formulação de aliança é reconhecível; a nota registra a forma literal.
- source_word: אָהַבְתְּ מִשְׁכָּבָם
  choice: você amou a cama deles
  rationale: A tradução conserva a imagem sexualmente carregada do hebraico e sua possível referência simultânea à idolatria e a alianças ilícitas.
- source_word: יָד חָזִית
  choice: contemplou uma mão
  rationale: יָד significa literalmente “mão”, mas a expressão é obscura e pode designar um marco, monumento ou eufemismo sexual. “Contemplou” reflete o valor visual de חזה sem resolver a dificuldade.
theological_decisions:
- issue: Metáfora sexual e idólatra da apostasia de Judá
  choice: Manter no texto principal as imagens de desnudar-se, subir e alargar a cama.
  alternative: Explicitar toda a passagem somente como idolatria ou somente como alianças políticas.
  rationale: A linguagem profética retrata a infidelidade da comunidade por meio de imagens sexuais que podem abranger idolatria e alianças ilícitas. Preservar essas imagens mantém a tensão teológica do texto.
- issue: Sentido de יָד חָזִית
  choice: Conservar a expressão literal e obscura “contemplou uma mão”, acompanhada de nota.
  alternative: Traduzir diretamente como “viu um monumento”, “contemplou um falo” ou “viu poder”.
  rationale: Nenhuma interpretação proposta é suficientemente segura para substituir a ambiguidade do hebraico no texto principal.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. O tratamento por “você” torna a interpelação direta e natural; a pontuação separa as imagens sem eliminar sua continuidade. A tradução evita explicar no corpo do versículo aquilo que o hebraico deixa ambíguo.
