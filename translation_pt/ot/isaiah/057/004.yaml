source:
  edition: WLC
  text: עַל מִי֙ תִּתְעַנָּ֔גוּ עַל מִ֛י תַּרְחִ֥יבוּ פֶ֖ה תַּאֲרִ֣יכוּ לָשׁ֑וֹן הֲ/לֽוֹא אַתֶּ֥ם יִלְדֵי פֶ֖שַׁע זֶ֥רַע שָֽׁקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/004.yaml
  text: At whom do you sport yourselves? Against whom do you open your mouth wide and stick out your tongue? Are you not children of transgression[c][b][a], offspring of deceit?
translation:
  language: pt
  text: De quem vocês zombam?[a] Contra quem escancaram a boca e põem a língua para fora?[b] Não são vocês filhos da transgressão, descendência da mentira?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico pode ser entendido mais literalmente como “Em relação a quem vocês se deleitam?”. No contexto, esse deleite é malicioso, com sentido de zombaria ou escárnio.
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “alongam a língua”; isto é, põem a língua para fora como gesto de deboche.
    reason: lexical_alternative
  - marker: c
    text: “Filhos da transgressão” e “descendência da mentira” empregam linguagem familiar para caracterizar pessoas marcadas pela rebeldia e pela falsidade.
    reason: cultural_note
lexical_decisions:
- source_word: תִּתְעַנָּגוּ
  choice: zombam
  rationale: Embora o verbo possa significar literalmente “deleitar-se”, o paralelismo com a boca escancarada e a língua estendida indica aqui uma atitude de escárnio. “Zombam” comunica esse sentido contextual sem apagar a alternativa literal, registrada em nota.
- source_word: תַּרְחִיבוּ פֶה
  choice: escancaram a boca
  rationale: Preserva a imagem concreta de alargar ou abrir muito a boca e, em português corrente, sugere adequadamente a expressão insolente ou zombeteira do contexto.
- source_word: תַּאֲרִיכוּ לָשׁוֹן
  choice: põem a língua para fora
  rationale: Traduz de modo idiomático o hebraico literal “alongam a língua”, mantendo o gesto visível de deboche.
- source_word: הֲלוֹא
  choice: Não são vocês
  rationale: Reproduz a pergunta retórica hebraica, que espera resposta afirmativa, em construção natural no português moderno.
- source_word: יִלְדֵי פֶשַׁע
  choice: filhos da transgressão
  rationale: Mantém a metáfora familiar e a caracterização moral do hebraico. “Filhos” designa aqui pessoas marcadas pela transgressão, não apenas descendentes masculinos.
- source_word: זֶרַע שָׁקֶר
  choice: descendência da mentira
  rationale: “Descendência” preserva a imagem de linhagem expressa por זֶרַע, enquanto “mentira” comunica de forma direta o campo semântico de falsidade e engano de שֶׁקֶר.
theological_decisions:
- issue: Linguagem de filiação e descendência na acusação profética
  choice: Manter as metáforas “filhos da transgressão” e “descendência da mentira”, explicando que caracterizam moralmente os acusados.
  alternative: Interpretar as expressões como afirmação de ascendência biológica ou como identificação metafísica determinista.
  rationale: No hebraico bíblico, fórmulas como “filhos de X” podem indicar caráter, pertencimento ou conduta. A tradução conserva a força e a tensão da imagem sem transformá-la em alegação étnica, biológica ou determinista.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para leitura ampla e boa naturalidade brasileira. As imagens corporais do hebraico foram mantidas em formulações idiomáticas, e as metáforas de parentesco foram preservadas sem explicação interpretativa dentro do versículo.
