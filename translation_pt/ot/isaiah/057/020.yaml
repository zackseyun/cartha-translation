source:
  edition: WLC
  text: וְ/הָ/רְשָׁעִ֖ים כַּ/יָּ֣ם נִגְרָ֑שׁ כִּ֤י הַשְׁקֵט֙ לֹ֣א יוּכָ֔ל וַ/יִּגְרְשׁ֥וּ מֵימָ֖י/ו רֶ֥פֶשׁ וָ/טִֽיט׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/020.yaml
  text: But the wicked are like the tossing sea[a], for it cannot be quiet[b], and its waters toss up mire and mud.
translation:
  language: pt
  text: Mas os ímpios são como o mar revolto[a], que não consegue se aquietar, e suas águas lançam para cima lama e lodo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o mar impelido». O termo hebraico retrata o mar sendo movido ou revolvido; também pode ser traduzido como «mar agitado».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָרְשָׁעִים
  choice: Mas os ímpios
  rationale: O substantivo designa pessoas ímpias. Em continuidade com a paz mencionada no contexto anterior, a conjunção recebe naturalmente valor adversativo em português.
- source_word: כַּיָּם נִגְרָשׁ
  choice: como o mar revolto
  rationale: A comparação é explícita, e נִגְרָשׁ, de uma raiz ligada a impelir ou expulsar, retrata o mar agitado por forças que o movem. «Revolto» comunica a imagem de modo natural sem reduzir o termo à mera inquietação interior.
- source_word: כִּי הַשְׁקֵט לֹא יוּכָל
  choice: que não consegue se aquietar
  rationale: A construção expressa incapacidade de ficar quieto ou calmo. A oração relativa explicativa é fluente em português e conserva a relação lógica do hebraico.
- source_word: וַיִּגְרְשׁוּ מֵימָיו
  choice: e suas águas lançam para cima
  rationale: A mesma raiz גרשׁ agora descreve as águas expelindo material. «Lançam para cima» preserva o movimento sem recorrer a uma formulação arcaica.
- source_word: רֶפֶשׁ וָטִיט
  choice: lama e lodo
  rationale: Os dois termos próximos descrevem matéria suja e lamacenta revolvida pelas águas. O par português mantém a duplicação imagética e é amplamente compreensível.
theological_decisions:
- issue: Valor discursivo da conjunção inicial
  choice: Mas os ímpios
  alternative: E os ímpios
  rationale: O contexto contrasta a condição dos ímpios com a paz do justo; «mas» explicita essa relação discursiva sem acrescentar uma afirmação doutrinária.
- issue: Descrição do estado do mar
  choice: mar revolto
  alternative: mar impelido; mar agitado
  rationale: «Revolto» conserva a figura de um mar violentamente movido e soa natural em português. A nota registra uma alternativa mais próxima da forma verbal hebraica.
- issue: Relação introduzida por כִּי
  choice: oração explicativa com «que»
  alternative: pois ele não consegue se aquietar
  rationale: Aqui כִּי explica a comparação. A forma relativa mantém essa explicação com fluidez, sem determinar uma nuance teológica ausente do texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural tanto no Brasil quanto em outros contextos lusófonos. «Aquietar» preserva a ideia de cessar a agitação; «lama e lodo» mantém o paralelismo concreto do hebraico.
