  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בַּ/עֲוֺ֥ן בִּצְע֛/וֹ קָצַ֥פְתִּי וְ/אַכֵּ֖/הוּ הַסְתֵּ֣ר וְ/אֶקְצֹ֑ף וַ/יֵּ֥לֶךְ שׁוֹבָ֖ב בְּ/דֶ֥רֶךְ לִבּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/017.yaml
  text: Because of the iniquity of his unjust gain I was angry[a], and I struck him; I hid myself and was angry[b], and he went on backsliding in the way of his heart.
translation:
  language: pt
  text: Por causa da iniquidade do seu ganho injusto[a], fiquei irado e o feri; escondi-me[b] e fiquei irado, e ele continuou se desviando pelo caminho do seu coração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da sua cobiça”. O termo hebraico pode indicar tanto o desejo ganancioso quanto o lucro obtido por ganância.
    reason: lexical_alternative
  - marker: b
    text: Ou “escondi o meu rosto”. “Esconder o rosto” corresponde a uma expressão bíblica comum, embora “rosto” não esteja explícito no hebraico deste versículo.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּעֲוֺן
  choice: Por causa da iniquidade
  rationale: A preposição בְּ tem valor causal neste contexto e introduz o motivo da ira divina; a formulação mantém o substantivo moral עָוֺן.
- source_word: בִּצְעוֹ
  choice: do seu ganho injusto
  rationale: בֶּצַע pode designar tanto a cobiça quanto o lucro obtido de modo ganancioso ou injusto. “Ganho injusto” preserva o aspecto econômico concreto e sua conotação moral.
- source_word: קָצַפְתִּי / וְאֶקְצֹף
  choice: fiquei irado / fiquei irado
  rationale: קצף expressa ira. A repetição foi mantida, como no hebraico, em linguagem atual e dignificada.
- source_word: וְאַכֵּהוּ
  choice: e o feri
  rationale: O hifil de נכה indica golpear ou ferir. “Feri” conserva a ação punitiva concreta sem recorrer a vocabulário arcaico.
- source_word: הַסְתֵּר
  choice: escondi-me
  rationale: O infinitivo absoluto de סתר funciona aqui de modo elíptico ou adverbial. “Escondi-me” forma uma oração natural sem acrescentar “rosto”, palavra não explícita no hebraico.
- source_word: וַיֵּלֶךְ שׁוֹבָב
  choice: continuou se desviando
  rationale: A combinação comunica conduta persistente e transviada, não simples deslocamento. A tradução conserva a ideia de continuidade e afastamento.
- source_word: בְּדֶרֶךְ לִבּוֹ
  choice: pelo caminho do seu coração
  rationale: A expressão metafórica descreve uma conduta dirigida pela disposição ou vontade interior. A imagem hebraica foi preservada sem explicação interpretativa no corpo do texto.
theological_decisions:
- issue: Expressão da ocultação divina em הַסְתֵּר
  choice: escondi-me
  alternative: escondi o meu rosto
  rationale: Embora “esconder o rosto” seja um idioma bíblico frequente, “rosto” não aparece explicitamente neste versículo. O texto principal mantém a formulação mais estrita, e a alternativa tradicional fica na nota.
- issue: Objeto moral do juízo em בִּצְעוֹ
  choice: seu ganho injusto
  alternative: sua cobiça
  rationale: O termo admite tanto o desejo ganancioso quanto o lucro decorrente dele. A opção principal conserva a concretude econômica, enquanto a nota registra a ambiguidade lexical genuína.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. Evitaram-se formas arcaicas. A repetição de “fiquei irado” e a sequência coordenada com “e” preservam a estrutura e a tensão do hebraico.
