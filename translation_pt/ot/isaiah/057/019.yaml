  text: בּוֹרֵ֖א נוב שְׂפָתָ֑יִם שָׁל֨וֹם שָׁל֜וֹם לָ/רָח֧וֹק וְ/לַ/קָּר֛וֹב אָמַ֥ר יְהוָ֖ה וּ/רְפָאתִֽי/ו׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/019.yaml
  text: 'Creating the fruit of the lips: Peace[a], peace to the one far off and to the one near, says Yahweh[c][b], and I will heal him.'
translation:
  language: pt
  text: 'Eu crio o fruto dos lábios[a]: “Paz, paz[b] para o que está longe e para o que está perto[c]”, diz Yahweh, “e eu o curarei.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o produto dos lábios”; a expressão se refere ao que os lábios produzem, provavelmente palavras de louvor ou confissão.
    reason: lexical_alternative
  - marker: b
    text: A repetição “Paz, paz” preserva a ênfase do hebraico.
    reason: lexical_alternative
  - marker: c
    text: A expressão “longe” e “perto” pode referir-se, de modo imediato, aos membros dispersos e aos que estavam próximos entre o povo de Deus; textos posteriores a retomam de maneira mais ampla.
    reason: cross_reference
lexical_decisions:
- source_word: בּוֹרֵא
  choice: Criando
  rationale: Preserva a forma participial e o estilo condensado do hebraico, entendendo Yahweh como sujeito da ação.
- source_word: נוב שְׂפָתָיִם
  choice: o fruto dos lábios
  rationale: Mantém a imagem hebraica daquilo que os lábios produzem, sem restringi-la interpretativamente a louvor ou confissão.
- source_word: שָׁלוֹם שָׁלוֹם
  choice: Paz, paz
  rationale: Conserva a repetição enfática e a amplitude de sentido de shalom, que inclui paz, integridade e bem-estar.
- source_word: לָרָחוֹק וְלַקָּרוֹב
  choice: para o que está longe e para o que está perto
  rationale: Expressa naturalmente em português os adjetivos substantivados e mantém indefinida a identidade dos dois destinatários.
- source_word: אָמַר יְהוָה
  choice: diz Yahweh
  rationale: O presente é natural na fórmula profética de declaração, e Yahweh preserva o nome divino em vez de substituí-lo por um título.
- source_word: וּרְפָאתִיו
  choice: e eu o curarei
  rationale: Mantém o sentido básico de רפא e seu alcance restaurador; o futuro se ajusta à promessa no contexto.
theological_decisions:
- issue: Identidade do que está longe e do que está perto
  choice: A tradução mantém uma descrição geral, sem identificar explicitamente os grupos.
  alternative: Exilados e residentes de Israel; ou, numa aplicação posterior mais ampla, gentios e judeus.
  rationale: O contexto imediato trata da restauração do povo de Deus, mas o hebraico não define expressamente os grupos. A formulação preserva essa abertura.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura deliberadamente próxima da concisão poética hebraica. As aspas esclarecem o conteúdo produzido pelos lábios e a continuação da fala divina sem alterar a ambiguidade referencial.
