base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/006.yaml
  text: Among the smooth stones of the valley is your portion[a]; they, they are your lot. Even to them you have poured out a drink offering; you have offered up a grain offering[b]. Shall I relent because of these things?
translation:
  language: pt
  text: Entre as pedras lisas do vale está a tua porção[a]; elas, sim, são a tua sorte. Até a elas derramaste uma oferta de bebida e apresentaste uma oferta de cereais. Acaso voltarei atrás por causa dessas coisas?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Entre as porções do vale”. O hebraico provavelmente se refere às pedras lisas do leito de um vale ou curso d’água, em harmonia com o contexto de idolatria.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Acaso serei consolado por essas coisas?” O verbo hebraico também pode ter o sentido de ser consolado ou aplacado.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּחַלְּקֵי נַחַל
  choice: Entre as pedras lisas do vale
  rationale: חַלְּקֵי pode evocar lisura e, neste contexto idolátrico, provavelmente se refere às pedras lisas do leito de um vale ou curso d’água; a nota preserva a alternativa lexical.
- source_word: חֶלְקֵךְ
  choice: a tua porção
  rationale: Mantém a linguagem de quinhão atribuído e a relação verbal com גּוֹרָלֵךְ.
- source_word: הֵם הֵם
  choice: elas, sim
  rationale: Reproduz de modo natural em português a ênfase da repetição hebraica.
- source_word: גּוֹרָלֵךְ
  choice: a tua sorte
  rationale: Preserva a imagem concreta daquilo que cabe a alguém por sorteio e o paralelismo com “porção”.
- source_word: נֶסֶךְ
  choice: uma oferta de bebida
  rationale: Expressa em linguagem acessível a oferta sacrificial derramada, também chamada libação.
- source_word: הֶעֱלִית מִנְחָה
  choice: apresentaste uma oferta de cereal
  rationale: O Hifil de עלה tem sentido sacrificial neste contexto, e מִנְחָה designa aqui uma oferta de cereal; “apresentaste” soa natural sem perder o caráter cultual.
- source_word: הַעַל אֵלֶּה אֶנָּחֵם
  choice: Acaso voltarei atrás por causa dessas coisas?
  rationale: A pergunta retórica comunica o sentido possível de נחם como reconsiderar ou desistir de uma ação, sem explicitar no corpo do texto qual ação divina está em vista; a nota registra o sentido alternativo.
theological_decisions:
- issue: Sentido da pergunta retórica final
  choice: Pergunta sobre Deus voltar atrás ou desistir de agir
  alternative: Pergunta sobre Deus ser consolado ou aplacado por essas coisas
  rationale: O contexto é de denúncia da idolatria, mas o verbo נחם admite mais de um sentido. A tradução principal conserva a força retórica sem acrescentar explicitamente “do castigo”, enquanto a nota mantém aberta a alternativa de consolo ou apaziguamento.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade no Brasil e compreensão internacional. Emprega “tu” em concordância com o feminino singular do discurso hebraico e usa “elas, sim” para transmitir naturalmente a ênfase de הֵם הֵם.
