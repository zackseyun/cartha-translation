  text: דְּרָכָ֥י/ו רָאִ֖יתִי וְ/אֶרְפָּאֵ֑/הוּ וְ/אַנְחֵ֕/הוּ וַ/אֲשַׁלֵּ֧ם נִֽחֻמִ֛ים ל֖/וֹ וְ/לַ/אֲבֵלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/018.yaml
  text: I have seen his ways[a], and I will heal him; I will lead him and restore comforts to him and to his mourners.
translation:
  language: pt
  text: Vi os seus caminhos e vou curá-lo; vou guiá-lo e restituir-lhe consolações, a ele e aos que choram por ele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְּרָכָיו
  choice: os seus caminhos
  rationale: O plural de דֶּרֶךְ pode indicar a conduta ou maneira de viver de uma pessoa. “Os seus caminhos” preserva a expressão hebraica e sua possível conotação moral sem torná-la explícita demais.
- source_word: רָאִיתִי
  choice: Vi
  rationale: O perfeito hebraico declara que Deus viu plenamente os caminhos da pessoa. O pretérito perfeito é natural em português e dá base às promessas seguintes.
- source_word: וְאֶרְפָּאֵהוּ
  choice: mas vou curá-lo
  rationale: רפא significa normalmente “curar” e conserva aqui tanto a imagem de cura quanto a ideia de restauração. A conjunção foi vertida como “mas” para expressar o contraste contextual entre a conduta vista por Deus e sua ação misericordiosa; o hebraico usa a conjunção ו, que também pode ser traduzida simplesmente por “e”.
- source_word: וְאַנְחֵהוּ
  choice: vou guiá-lo
  rationale: O hifil de נחה significa conduzir ou guiar. “Guiá-lo” soa natural em português e mantém a ação pessoal de Deus.
- source_word: וַאֲשַׁלֵּם
  choice: restituir
  rationale: No piel, שׁלם pode significar retribuir, completar ou restaurar. Com “consolo” como objeto, “restituir” comunica a restauração do bem-estar sem sugerir pagamento de dívida.
- source_word: נִחֻמִים
  choice: consolo
  rationale: Embora o substantivo esteja no plural, o singular coletivo “consolo” é mais idiomático em português e preserva adequadamente o sentido.
- source_word: לּוֹ וְלַאֲבֵלָיו
  choice: a ele e aos que choram por ele
  rationale: ל marca os destinatários, e אֲבֵלָיו designa os que estão de luto ou choram por ele. A forma expandida evita a possível estranheza de “seus enlutados” e explicita naturalmente a relação indicada pelo sufixo.
theological_decisions:
- issue: Força moral de “os seus caminhos” no contexto da restauração
  choice: Deus viu a conduta da pessoa e, ainda assim, promete curá-la e guiá-la.
  alternative: Entender “caminhos” de modo neutro como simples trajetória, ou inserir explicitamente o arrependimento da pessoa.
  rationale: O hebraico menciona os caminhos da pessoa, mas não declara arrependimento neste versículo. A tradução mantém a tensão entre o pleno conhecimento divino e a misericórdia prometida, sem acrescentar uma conclusão doutrinária.
- issue: Relação lógica da conjunção antes de “vou curá-lo”
  choice: “mas vou curá-lo”
  alternative: “e vou curá-lo”
  rationale: A conjunção hebraica ו é ampla e pode ser aditiva ou adversativa conforme o contexto. “Mas” torna natural em português o contraste com os caminhos pecaminosos descritos no contexto imediato, sem negar a possibilidade formal de “e”.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. Preferiu-se “aos que choram por ele” a “aos seus enlutados” por clareza corrente, e o futuro perifrástico “vou” por naturalidade sem perda da força promissória.
