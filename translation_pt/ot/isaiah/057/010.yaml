base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/010.yaml
  text: In the multitude of your ways you grew weary[a], yet you did not say, ‘It is hopeless.’ You found renewed strength in your hand[c][b]; therefore you did not grow weak.
translation:
  language: pt
  text: 'Na extensão do seu caminho, você se cansou, mas não disse: “Não há esperança”.[a] Você encontrou vigor renovado em sua mão;[b] por isso, não enfraqueceu.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “É inútil continuar”. A expressão hebraica comunica desespero ou a conclusão de que todo esforço adicional seria inútil.'
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “a vida” ou “a vitalidade da sua mão”. A expressão provavelmente indica novas forças ou capacidade renovada para continuar.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “não desfaleceu” ou “não adoeceu”. O verbo hebraico pode indicar fraqueza, desfalecimento ou enfermidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֹב דַּרְכֵּךְ
  choice: Na multidão dos seus caminhos
  rationale: רֹב indica grande quantidade ou abundância, e o plural דַּרְכֵּךְ significa literalmente “seus caminhos”. A formulação preserva a amplitude da imagem e pode abranger tanto jornadas quanto cursos de ação.
- source_word: יָגַעַתְּ
  choice: você se cansou
  rationale: יגע expressa cansaço resultante de esforço. “Você se cansou” é natural em português e mantém a forma verbal dirigida à interlocutora singular sem precisar explicitar seu gênero.
- source_word: נוֹאָשׁ
  choice: Não há esperança
  rationale: A forma derivada de יאשׁ comunica desespero ou a conclusão de que insistir é inútil. A frase escolhida funciona naturalmente após “não disse” e conserva a ideia de recusa em desistir.
- source_word: חַיַּת יָדֵךְ
  choice: vigor renovado em sua mão
  rationale: A expressão hebraica condensada é literalmente próxima de “vida/vitalidade da sua mão”. Como “mão” pode representar capacidade ou poder, a tradução comunica a recuperação de forças para prosseguir, preservando ao mesmo tempo a imagem da mão.
- source_word: מָצָאת
  choice: você encontrou
  rationale: מצא significa de modo direto “encontrar” e apresenta a razão pela qual a interlocutora continuou em seu curso.
- source_word: עַל־כֵּן
  choice: por isso
  rationale: A locução introduz uma consequência. “Por isso” é clara, atual e natural em português.
- source_word: לֹא חָלִית
  choice: não enfraqueceu
  rationale: חלה pode significar ficar fraco, adoecer ou desfalecer. Neste contexto, “não enfraqueceu” mantém a ambiguidade entre perda de força e perda de ânimo sem introduzir doença física como sentido obrigatório.
theological_decisions:
- issue: Sentido da perseverança no contexto da idolatria e infidelidade de Isaías 57
  choice: Apresentar a persistência sem qualificá-la como virtude
  alternative: Explicitar no versículo que se trata de obstinação em uma busca pecaminosa
  rationale: O contexto mais amplo dá à persistência uma força negativa, mas o versículo não acrescenta essa avaliação de forma explícita. A tradução deixa que o contexto produza esse efeito e evita inserir comentário teológico no texto.
- issue: Interpretação de חַיַּת יָדֵךְ
  choice: vigor renovado em sua mão
  alternative: a vida da sua mão
  rationale: A tradução estritamente literal seria obscura e pouco natural em português. A opção adotada mantém a metáfora da mão e sinaliza a vitalidade ou capacidade recuperada, sem definir de maneira excessiva sua natureza.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O tratamento por “você” evita formas regionais e preserva a referência singular; a morfologia hebraica indica uma interlocutora feminina, embora isso não precise ser explicitado em português. A pontuação mantém o contraste e a consequência do original.
