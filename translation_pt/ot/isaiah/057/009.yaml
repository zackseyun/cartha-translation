reference: Isaiah 57:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/תָּשֻׁ֤רִי לַ/מֶּ֨לֶךְ֙ בַּ/שֶּׁ֔מֶן וַ/תַּרְבִּ֖י רִקֻּחָ֑יִ/ךְ וַ/תְּשַׁלְּחִ֤י צִרַ֨יִ/ךְ֙ עַד מֵ֣/רָחֹ֔ק וַ/תַּשְׁפִּ֖ילִי עַד שְׁאֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/009.yaml
  text: You journeyed to the king with oil[a], and multiplied your perfumes; you sent your envoys far away[b], and debased yourself even to Sheol.
translation:
  language: pt
  text: Você viajou até o rei[a] levando óleo e multiplicou seus perfumes; enviou seus emissários para muito longe e se rebaixou até o Sheol[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “Moloque”, caso “o rei” seja entendido como um título alusivo a essa divindade.
    reason: alternative_reading
  - marker: b
    text: Sheol é o domínio dos mortos.
    reason: cultural_note
lexical_decisions:
- source_word: וַתָּשֻׁרִי
  choice: você viajou
  rationale: O verbo é difícil, mas, neste contexto de aproximação ao rei com óleo e perfumes, provavelmente descreve deslocamento ou viagem. “Viajou” preserva essa ideia sem adotar a acepção literal menos provável de “viu”.
- source_word: לַמֶּלֶךְ
  choice: até o rei
  rationale: O texto consonantal e a vocalização massorética indicam “o rei”. A possível alusão a Moloque é mantida em nota, sem substituir o sentido direto no texto principal.
- source_word: בַּשֶּׁמֶן
  choice: levando óleo
  rationale: שֶׁמֶן significa normalmente “óleo”, possivelmente óleo perfumado neste contexto. “Levando” explicita de modo natural em português a circunstância expressa pela preposição hebraica.
- source_word: וַתַּרְבִּי רִקֻּחָיִךְ
  choice: multiplicou seus perfumes
  rationale: A expressão descreve o aumento abundante de preparados aromáticos. “Perfumes” é corrente e comunica bem a natureza dessas misturas.
- source_word: וַתְּשַׁלְּחִי צִרַיִךְ
  choice: enviou seus emissários
  rationale: “Emissários” conserva o possível cenário diplomático e traduz com naturalidade os mensageiros enviados a outro governante.
- source_word: עַד מֵרָחֹק
  choice: para muito longe
  rationale: A formulação portuguesa comunica claramente a grande distância enfatizada pelo hebraico.
- source_word: וַתַּשְׁפִּילִי
  choice: se rebaixou
  rationale: Neste contexto acusatório, o verbo não expressa humildade virtuosa, mas auto-humilhação ou degradação. “Se rebaixou” preserva o valor negativo sem exagerá-lo.
- source_word: עַד שְׁאוֹל
  choice: até o Sheol
  rationale: Mantém-se o termo hebraico para o domínio dos mortos, preservando a imagem e evitando reduzi-lo a uma sepultura individual.
theological_decisions:
- issue: Possível identificação de “o rei” com Moloque
  choice: Manter “o rei” no texto principal
  alternative: Traduzir como “Moloque” ou entender “o rei” como título alusivo dessa divindade
  rationale: A leitura direta do texto massorético é “o rei”, e o contexto pode envolver tanto alianças políticas quanto infidelidade idolátrica. A alternativa tradicional é relevante, mas não suficientemente certa para substituir o texto principal.
translation_notes:
  register: Português moderno, claro e digno, com construção natural para leitores brasileiros e compreensão internacional. O tratamento por “você” evita formas verbais arcaizantes; o feminino singular do destinatário, marcado no hebraico, não fica morfologicamente explícito nessa construção portuguesa.
