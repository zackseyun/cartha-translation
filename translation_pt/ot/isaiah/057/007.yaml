  text: עַ֤ל הַר גָּבֹ֨הַּ֙ וְ/נִשָּׂ֔א שַׂ֖מְתְּ מִשְׁכָּבֵ֑/ךְ גַּם שָׁ֥ם עָלִ֖ית לִ/זְבֹּ֥חַ זָֽבַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/007.yaml
  text: On a high and lofty mountain you set your bed[b][a]; there too you went up to sacrifice a sacrifice.
translation:
  language: pt
  text: Sobre um monte alto e elevado, você pôs a sua cama[a]; também ali subiu para oferecer um sacrifício.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “A sua cama” provavelmente contém alusões à sexualidade ilícita, usada neste contexto como imagem do culto idólatra.
    reason: cultural_note
lexical_decisions:
- source_word: עַל הַר
  choice: Sobre um monte
  rationale: Preserva a localização expressa pela preposição עַל e o sentido comum de הַר, em português natural.
- source_word: גָּבֹהַּ וְנִשָּׂא
  choice: alto e elevado
  rationale: Mantém os dois qualificativos hebraicos e sua força cumulativa, sem introduzir uma interpretação teológica.
- source_word: שַׂמְתְּ מִשְׁכָּבֵךְ
  choice: você pôs a sua cama
  rationale: Reproduz diretamente a ação e conserva a imagem concreta de מִשְׁכָּב, deixando que o contexto comunique suas conotações sexuais e idolátricas.
- source_word: גַּם שָׁם
  choice: também ali
  rationale: Expressa a força aditiva e enfática de גַּם, ligada ao lugar mencionado.
- source_word: עָלִית
  choice: subiu
  rationale: Preserva o sentido literal de ascender, especialmente apropriado por se tratar de um monte.
- source_word: לִזְבֹּחַ זָבַח
  choice: para oferecer um sacrifício
  rationale: Comunica naturalmente em português a construção cognata hebraica e mantém seu sentido cultual explícito.
theological_decisions:
- issue: Força metafórica de “cama” no contexto de idolatria e adultério espiritual
  choice: Conservar “a sua cama” no texto principal.
  alternative: Explicitar como “seu lugar de culto ilícito”.
  rationale: O hebraico mantém a imagem concreta, cuja acusação metafórica emerge do contexto; explicitá-la no texto resolveria interpretativamente a metáfora.
- issue: Linguagem cultual de זבח
  choice: “oferecer um sacrifício”
  alternative: “sacrificar um sacrifício”
  rationale: Mantém tanto a ação cultual quanto o objeto expresso, evitando em português uma repetição cognata pouco natural.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A flexão feminina do hebraico é perceptível pelo contexto mais amplo, mas não é marcada artificialmente no pronome português. A ordem dos marcadores ingleses foi normalizada, pois apenas uma nota é necessária nesta redação.
