  text: כִּ֣י לֹ֤א לְ/עוֹלָם֙ אָרִ֔יב וְ/לֹ֥א לָ/נֶ֖צַח אֶקְּצ֑וֹף כִּי ר֨וּחַ֙ מִ/לְּ/פָנַ֣/י יַֽעֲט֔וֹף וּ/נְשָׁמ֖וֹת אֲנִ֥י עָשִֽׂיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/016.yaml
  text: For I will not contend forever[a], nor will I be angry without end, for the spirit would grow faint before me[b], and the breaths that I have made.
translation:
  language: pt
  text: Pois não contenderei para sempre, nem permanecerei irado sem fim, porque o espírito[a] desfaleceria diante de mim, e os sopros[b] que eu fiz também desfaleceriam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o sopro”. O hebraico רוּחַ pode significar “espírito” ou “sopro”.
    reason: lexical_alternative
  - marker: b
    text: Ou “as almas” ou “as vidas”. O hebraico נְשָׁמוֹת significa literalmente “sopros”, mas também pode designar, de modo mais interpretativo, as pessoas vivas.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Em paralelo com לָנֶצַח e sob negação, indica duração indefinida ou sem fim; “para sempre” é a expressão portuguesa mais natural.
- source_word: אָרִיב
  choice: contenderei
  rationale: O verbo ריב pode envolver disputa, oposição ou pleito judicial. “Contenderei” conserva essa amplitude e o tom solene do contexto.
- source_word: לָנֶצַח
  choice: sem fim
  rationale: Forma paralelismo sinônimo com לְעוֹלָם; a variação evita repetição mecânica e mantém a ideia de duração ilimitada.
- source_word: אֶקְּצֹף
  choice: ficarei irado
  rationale: קצף expressa ira intensa. “Ficarei irado” é atual, claro e digno, sem enfraquecer o sentido.
- source_word: רוּחַ
  choice: o espírito
  rationale: Aqui designa o princípio vital da criatura humana, em paralelo com נְשָׁמוֹת. “Espírito” preserva a dimensão antropológica sem identificar o termo com o Espírito de Deus.
- source_word: מִלְּפָנַי
  choice: diante de mim
  rationale: Equivalente idiomático natural de “de diante de mim”, indicando o efeito da ira divina sobre a criatura em sua presença.
- source_word: יַעֲטוֹף
  choice: desfaleceria
  rationale: עטף pode indicar fraquejar, desfalecer ou ficar abatido. O condicional explicita em português a consequência hipotética de uma contenda e ira sem fim.
- source_word: נְשָׁמוֹת
  choice: os sopros
  rationale: Plural de נשמה, com a imagem concreta do sopro vital. “Sopros” preserva essa imagem e evita a carga antropológica mais técnica que “almas” pode adquirir.
- source_word: אֲנִי עָשִׂיתִי
  choice: que eu fiz
  rationale: Mantém o pronome explícito e traduz עשה diretamente por “fiz”, sem acrescentar uma ênfase reflexiva maior do que a exigida pelo hebraico.
theological_decisions:
- issue: Linguagem antropológica de רוּחַ e נְשָׁמוֹת
  choice: Entender os termos como “espírito” e “sopros” da vida humana criada por Deus.
  alternative: Traduzir ambos de modo mais interpretativo como “vida”, “vidas” ou “almas”, ou entender רוּחַ como referência ao Espírito Santo.
  rationale: O contexto fundamenta a contenção da ira divina na fragilidade das criaturas às quais Deus deu vida. O paralelismo favorece o espírito ou sopro vital humano, não uma referência ao Espírito de Deus.
- issue: Relação sintática entre רוּחַ, יַעֲטוֹף e נְשָׁמוֹת
  choice: Tratar “os sopros que eu fiz” como segundo elemento sujeito do desfalecimento, marcando a coordenação elíptica com “e também”.
  alternative: Ler “os sopros que eu fiz” como aposição explicativa de “o espírito”.
  rationale: A conjunção ו favorece a coordenação, embora a concisão poética hebraica permita proximidade com uma leitura apositiva. A formulação escolhida conserva a conjunção sem impor identidade total entre os termos.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Contenderei” mantém a nuance jurídico-relacional; “ficarei irado” evita arcaísmo. A expressão “e também” torna natural em português a coordenação poética do hebraico sem eliminar sua tensão.
