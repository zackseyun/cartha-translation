  yaml_path: translation/ot/isaiah/057/012.yaml
  text: I myself will declare your righteousness and your works[b][a], but they will not profit you.
translation:
  language: pt
  text: Eu mesmo declararei a sua retidão[a] e as suas obras, mas elas não lhe trarão proveito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a sua justiça”. O termo hebraico pode expressar retidão ou justiça, conforme o contexto.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e elas não a ajudarão”. O verbo hebraico pode significar trazer proveito, beneficiar ou ajudar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Eu mesmo
  rationale: O pronome independente é expresso e enfático diante do verbo; “Eu mesmo” preserva essa ênfase de modo natural em português.
- source_word: אַגִּיד
  choice: declararei
  rationale: O hifil de נגד significa normalmente “declarar, dar a conhecer, anunciar”. “Declararei” mantém o valor lexical sem explicitar no verbo a possível ironia do contexto.
- source_word: צִדְקָתֵךְ
  choice: a sua retidão
  rationale: צדקה pode indicar retidão ou justiça. Neste contexto acusatório, “retidão” expressa naturalmente a alegada qualidade moral da destinatária, enquanto “justiça” permanece como alternativa legítima em nota.
- source_word: וְאֶת מַעֲשַׂיִךְ
  choice: e as suas obras
  rationale: מעשים designa obras ou feitos. “Obras” é conciso, preserva a conexão lexical tradicional e não acrescenta uma avaliação que o substantivo, por si só, não explicita.
- source_word: וְלֹא יוֹעִילוּךְ
  choice: mas elas não lhe trarão proveito
  rationale: O verbo יעל no hifil significa trazer proveito, beneficiar ou ajudar. A formulação é idiomática em português, e “mas” comunica o contraste implícito entre as obras alegadas e sua inutilidade.
theological_decisions:
- issue: Tom de “a sua retidão” no contexto
  choice: Manter “a sua retidão” sem aspas nem qualificadores interpretativos.
  alternative: a sua suposta retidão; os seus atos justos
  rationale: O contexto provavelmente confere tom irônico ou desmascarador à expressão, mas o hebraico não inclui um equivalente de “suposta”. A tradução deixa que o contexto transmita a repreensão e preserva a tensão do texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A destinatária é feminina no hebraico; isso aparece na alternativa da nota b (“não a ajudarão”), enquanto “lhe” no texto principal permanece natural e não marcado quanto ao gênero.
