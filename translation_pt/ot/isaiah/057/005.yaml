id: ISA.57.5
reference: Isaiah 57:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַ/נֵּֽחָמִים֙ בָּֽ/אֵלִ֔ים תַּ֖חַת כָּל עֵ֣ץ רַעֲנָ֑ן שֹׁחֲטֵ֤י הַ/יְלָדִים֙ בַּ/נְּחָלִ֔ים תַּ֖חַת סְעִפֵ֥י הַ/סְּלָעִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/057/005.yaml
  text: you who burn with lust among the terebinths[a], under every green tree, who slaughter the children in the wadis[b], under the clefts of the rocks.
translation:
  language: pt
  text: vocês que ardem de desejo entre os terebintos[a], debaixo de toda árvore verde, que degolam as crianças nas ravinas[b], debaixo das fendas das rochas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “entre os carvalhos”. O hebraico pode referir-se de modo mais amplo a grandes árvores associadas ao culto; “terebintos” representa aqui o sentido específico mais provável.
    reason: lexical_alternative
  - marker: b
    text: Ou “nos vales” ou “nos leitos dos riachos”. O termo hebraico indica vales estreitos, ravinas ou leitos de cursos d’água, muitas vezes sazonais.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֵּחָמִים
  choice: vocês que ardem de desejo
  rationale: O particípio, neste contexto de práticas idólatras ligadas a árvores cultuais, comunica a ideia de estar inflamado ou excitado. A formulação explicita a conotação sexual provável sem acrescentar uma interpretação doutrinária.
- source_word: בָּאֵלִים
  choice: entre os terebintos
  rationale: O paralelismo com “debaixo de toda árvore verde” favorece a referência a árvores grandes ou cultuais, não a “deuses”. “Terebintos” preserva o sentido específico mais provável; “carvalhos” continua possível e aparece em nota.
- source_word: תַּחַת כָּל עֵץ רַעֲנָן
  choice: debaixo de toda árvore verde
  rationale: Mantém a imagem hebraica e a expressão profética associada a locais de culto ilícito, em linguagem portuguesa clara.
- source_word: שֹׁחֲטֵי
  choice: que degolam
  rationale: O verbo designa matar mediante corte, muitas vezes em contexto sacrificial. “Degolam” conserva tanto a violência quanto a possível dimensão ritual, sem inserir explicitamente “sacrificam” no texto.
- source_word: הַיְלָדִים
  choice: as crianças
  rationale: O substantivo designa crianças ou descendentes, sem exigir que o sexo ou a idade exata sejam especificados.
- source_word: בַּנְּחָלִים
  choice: nas ravinas
  rationale: O termo pode indicar vales estreitos ou leitos de cursos d’água, muitas vezes sazonais. “Ravinas” é compreensível e conserva melhor a configuração geográfica do que o termo técnico “uádis”.
- source_word: תַּחַת סְעִפֵי הַסְּלָעִים
  choice: debaixo das fendas das rochas
  rationale: Embora סְעִפִים denote literalmente ramificações ou divisões, em associação com rochas aponta para reentrâncias, fendas ou formações rochosas salientes. A tradução mantém a imagem de lugares rochosos ocultos.
theological_decisions:
- issue: Explicitar ou não a força sexual e cultual do particípio inicial
  choice: vocês que ardem de desejo
  alternative: vocês que se inflamam; vocês que ficam ardentes
  rationale: O contexto imediato combina culto junto a árvores e matança de crianças. A referência ao desejo sexual é lexical e contextualmente provável, mas a redação não identifica um rito específico nem acrescenta uma explicação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” evita a artificialidade regional de “vós”; “degolam” preserva a força concreta do hebraico; “ravinas” evita o tecnicismo pouco conhecido “uádis”.
