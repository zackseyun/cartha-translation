source:
  edition: WLC
  text: וְ/אָמַר֙ בַּ/יּ֣וֹם הַ/ה֔וּא הִנֵּ֨ה אֱלֹהֵ֥י/נוּ זֶ֛ה קִוִּ֥ינוּ ל֖/וֹ וְ/יֽוֹשִׁיעֵ֑/נוּ זֶ֤ה יְהוָה֙ קִוִּ֣ינוּ ל֔/וֹ נָגִ֥ילָה וְ/נִשְׂמְחָ֖ה בִּ/ישׁוּעָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/009.yaml
  text: And it will be said on that day[a], “Behold, this is our God; we have waited for him, that he might save us. This is Yahweh; we have waited for him. Let us rejoice and be glad in his salvation.”
translation:
  language: pt
  text: 'E naquele dia se dirá: “Vejam! Este é o nosso Deus; temos esperado por ele, e ele nos salvará. Este é Yahweh; temos esperado por ele. Exultemos e alegremo-nos em sua salvação.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמַר
  choice: E naquele dia se dirá
  rationale: A forma verbal masculina singular não traz sujeito expresso e, neste contexto profético, admite sentido impessoal e futuro; a construção portuguesa com «se dirá» evita acrescentar um sujeito.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Expressão profética temporal corrente, vertida de modo natural e com sua força contextual preservada.
- source_word: הִנֵּה
  choice: Vejam!
  rationale: Mantém a função dêitica e enfática da partícula em linguagem atual e digna; o plural ajusta-se naturalmente à voz coletiva expressa no restante da declaração.
- source_word: אֱלֹהֵינוּ זֶה
  choice: Este é o nosso Deus
  rationale: Preserva a identificação enfática indicada pelo demonstrativo זֶה.
- source_word: קִוִּינוּ לוֹ
  choice: esperamos nele
  rationale: קוה comunica espera confiante ou esperançosa. «Esperamos nele» preserva tanto a espera quanto a confiança dirigida pessoalmente a Deus.
- source_word: וְיוֹשִׁיעֵנוּ
  choice: e ele nos salvará
  rationale: O hifil de ישׁע com sufixo de primeira pessoa plural significa naturalmente «ele nos salvará»; a conjunção foi mantida coordenativamente, sem transformar a oração em finalidade.
- source_word: זֶה יְהוָה
  choice: Este é Yahweh
  rationale: O demonstrativo marca reconhecimento enfático, e o nome divino é transliterado como «Yahweh».
- source_word: נָגִילָה וְנִשְׂמְחָה
  choice: Exultemos e alegremo-nos
  rationale: As formas coortativas expressam convite ou exortação coletiva; os dois verbos portugueses preservam a duplicação poética sem parecer redundância meramente acidental.
- source_word: בִּישׁוּעָתוֹ
  choice: em sua salvação
  rationale: Preserva a preposição e o sentido de livramento ou salvação efetuado por Deus.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. «Yahweh» preserva sua função de nome próprio sem substituí-lo por um título.
- issue: Relação sintática de וְיוֹשִׁיעֵנוּ com קִוִּינוּ לוֹ
  choice: «esperamos nele, e ele nos salvará»
  alternative: «esperamos nele para que nos salvasse»
  rationale: A conjunção hebraica permite leitura coordenada e o verbo pode apresentar a salvação esperada como ação futura. A versão evita impor uma oração final ou modal que não está explicitamente marcada.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom é elevado sem arcaísmo. «Vejam!» comunica a ênfase de הִנֵּה de modo corrente; «Exultemos e alegremo-nos» conserva o paralelismo poético e a força exortativa.
