review_pass:
  verdict: revise
  source_fidelity: O primeiro membro traduz adequadamente a comparação, o destinatário implícito no contexto e o sentido de תַּכְנִיעַ. No segundo, a imagem hebraica põe o calor em relação à sombra de uma nuvem como figura de mitigação; “como o calor à sombra de uma nuvem” é compreensível, mas deixa a relação poética pouco explícita em português. A tradução de יַעֲנֶה permanece discutida; uma formulação passiva que indique silenciamento/abatimento, acompanhada de nota, preserva adequadamente essa incerteza.
  naturalness: “É rebaixado” não é uma colocação natural para “cântico” em português moderno e soa excessivamente literal. “É silenciada” é idiomático para uma canção e comunica o efeito contextual sem identificar os violentos nem acrescentar um agente explícito. “Canção” é mais corrente e menos marcada religiosamente que “cântico”, mantendo o tom poético.
  terminology: “Estrangeiros”, “tumulto” e “violentos” são escolhas adequadas e amplamente compreensíveis. A nota sobre “estranhos” é pertinente. A nota final deve apresentar “silenciada” como a opção contextual e manter “responde” como possibilidade lexical, sem tratar a questão como resolvida de modo absoluto.
  issues:
  - severity: medium
    issue: “É rebaixado” aplicado ao cântico dos violentos é pouco natural em português.
    rationale: Embora reflita uma possível compreensão de יַעֲנֶה como abatimento, a expressão não produz um sentido poético fluente. “É silenciada” transmite naturalmente a supressão da canção e permanece sustentada pelo paralelismo.
  - severity: low
    issue: A relação entre o calor e a sombra da nuvem fica excessivamente elíptica.
    rationale: “À sombra de uma nuvem” pode qualificar apenas o cenário. “É amenizado pela sombra de uma nuvem” explicita somente o efeito já sugerido pela imagem e pelo paralelismo, sem introduzir nova interpretação.
  revised_text: Como o calor em terra árida, tu subjugas o tumulto dos estrangeiros[a]; como o calor é amenizado pela sombra de uma nuvem, a canção dos violentos é silenciada[b].
