  text: כְּ/חֹ֣רֶב בְּ/צָי֔וֹן שְׁא֥וֹן זָרִ֖ים תַּכְנִ֑יעַ חֹ֚רֶב בְּ/צֵ֣ל עָ֔ב זְמִ֥יר עָֽרִיצִ֖ים יַעֲנֶֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/005.yaml
  text: Like heat in a dry land[a], you subdue the uproar of strangers; like heat by the shadow of a cloud[b], the song of the ruthless is brought low.
translation:
  language: pt
  text: Como o calor em terra árida, tu subjugas o tumulto dos estrangeiros[a]; como o calor é amenizado pela sombra de uma nuvem, a canção dos violentos é silenciada[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estranhos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “é humilhada” ou “é subjugada”. O verbo hebraico também pode significar “responde”, mas, neste contexto, pode indicar que a canção é abatida ou silenciada.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּחֹרֶב
  choice: Como o calor
  rationale: חֹרֶב pode indicar calor ou seca. “Calor” estabelece com naturalidade a imagem poética retomada diante da sombra de uma nuvem.
- source_word: בְּצָיוֹן
  choice: em terra árida
  rationale: צָיוֹן denota aridez ou lugar ressequido; “terra árida” é claro e preserva a imagem ambiental.
- source_word: שְׁאוֹן
  choice: tumulto
  rationale: O termo descreve ruído intenso e agitação; “tumulto” comunica tanto o som quanto a hostilidade do contexto.
- source_word: זָרִים
  choice: estrangeiros
  rationale: זָרִים pode designar estranhos ou estrangeiros. Neste contexto de povos hostis, “estrangeiros” é natural sem acrescentar uma identificação específica.
- source_word: תַּכְנִיעַ
  choice: tu subjugas
  rationale: O hifil de כנע significa humilhar, abater ou submeter. A segunda pessoa mantém a invocação direta a Deus no contexto.
- source_word: בְּצֵל עָב
  choice: à sombra de uma nuvem
  rationale: A expressão combina “sombra” com uma nuvem espessa. A formulação portuguesa conserva a imagem de alívio do calor sem explicá-la em excesso.
- source_word: זְמִיר
  choice: cântico
  rationale: זְמִיר denota um canto, provavelmente aqui o canto triunfal ou jactancioso dos opressores. “Cântico” preserva o caráter poético.
- source_word: עָרִיצִים
  choice: violentos
  rationale: עָרִיץ caracteriza pessoas cruéis, violentas ou tirânicas. “Violentos” é claro e evita restringir o sentido a governantes formais.
- source_word: יַעֲנֶה
  choice: é rebaixado
  rationale: A forma admite dificuldade lexical e pode ser associada a “responder”; no paralelismo, porém, o sentido de humilhação ou sujeição é o mais coerente. A construção passiva evita impor um sujeito explícito ao último membro.
theological_decisions:
- issue: Mudança de pessoa e sujeito implícito
  choice: Manter “tu subjugas” no primeiro membro e usar a voz passiva, “é rebaixado”, no último.
  alternative: 'Explicitar Deus nos dois membros: “tu subjugas... tu rebaixas”; ou traduzir o verbo final por “responde”.'
  rationale: O contexto sustenta a interpelação direta a Deus, mas o último verbo hebraico não explicita da mesma forma o agente. A voz passiva preserva o paralelismo e evita resolver além do necessário uma construção discutida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O paralelismo e a concisão poética foram preservados; evitou-se explicitar além do hebraico como a sombra da nuvem afeta o calor.
