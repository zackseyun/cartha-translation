revisions:
- from: Como o calor em terra árida, tu subjugas o tumulto dos estrangeiros[a]; como o calor à sombra de uma nuvem, o cântico dos violentos é rebaixado[b].
  to: Como o calor em terra árida, tu subjugas o tumulto dos estrangeiros[a]; como o calor é amenizado pela sombra de uma nuvem, a canção dos violentos é silenciada[b].
  rationale: A revisão substitui a expressão pouco idiomática “é rebaixado” por “é silenciada” e torna clara a função da sombra na segunda comparação. A nota conserva as alternativas relevantes para o verbo hebraico e não fixa de modo dogmático a sua nuance debatida.
