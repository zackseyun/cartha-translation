    issue: Ambiguidade de pessoa em “das suas muralhas”.
    rationale: O hebraico traz sufixo de segunda pessoa masculina singular (“tuas muralhas”). Como “ele” é o sujeito imediatamente expresso em português, “suas” pode remeter ao sujeito de terceira pessoa, em vez do destinatário do oráculo. “Tuas” preserva explicitamente a pessoa do texto-fonte.
