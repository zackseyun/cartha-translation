  yaml_path: translation/ot/isaiah/025/012.yaml
  text: And the fortified height of your walls he has brought down[a], laid low, and cast to the ground, to the dust.
translation:
  language: pt
  text: E ele derrubou a fortaleza elevada das tuas muralhas[a]; rebaixou-a e lançou-a por terra, até o pó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E ele derrubou a fortificação, o lugar elevado das tuas muralhas”. A sequência de substantivos em hebraico é compacta e admite esta tradução mais formal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְצַר מִשְׂגַּב חוֹמֹתֶיךָ
  choice: E ele derrubou a fortaleza elevada das suas muralhas
  rationale: A cadeia construta hebraica é compacta. “Fortaleza elevada das suas muralhas” preserva tanto o caráter defensivo de מִבְצָר quanto a ideia de altura e segurança de מִשְׂגָּב, sem eliminar a relação com חוֹמֹתֶיךָ.
- source_word: הֵשַׁח
  choice: derrubou
  rationale: O hifil indica fazer descer ou abater aquilo que é elevado. “Derrubou” é natural em português no contexto da destruição de fortificações.
- source_word: הִשְׁפִּיל
  choice: rebaixou-a
  rationale: Mantém o sentido de tornar baixo e a sequência enfática de movimentos descendentes. O pronome retoma a fortaleza elevada.
- source_word: הִגִּיעַ לָאָרֶץ
  choice: lançou-a por terra
  rationale: Literalmente, “fez chegar à terra”. A formulação escolhida comunica de modo idiomático a demolição completa, conservando a imagem do texto.
- source_word: עַד עָפָר
  choice: até o pó
  rationale: Reproduz a intensificação final, levando a queda da altura até o nível mais baixo e evocando ruína total.
