id: ISA.25.4
reference: Isaiah 25:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי הָיִ֨יתָ מָע֥וֹז לַ/דָּ֛ל מָע֥וֹז לָ/אֶבְי֖וֹן בַּ/צַּר ל֑/וֹ מַחְסֶ֤ה מִ/זֶּ֨רֶם֙ צֵ֣ל מֵ/חֹ֔רֶב כִּ֛י ר֥וּחַ עָרִיצִ֖ים כְּ/זֶ֥רֶם קִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/004.yaml
  text: For you have been a stronghold to the poor[a], a stronghold to the needy in his distress, a refuge from the storm, a shade from the heat[b]; for the breath of the ruthless is like a storm against a wall.
translation:
  language: pt
  text: Pois foste uma fortaleza para o pobre, uma fortaleza para o necessitado em sua aflição, um abrigo contra a tempestade, sombra contra o calor; pois o sopro dos opressores[a] é como uma tempestade contra um muro.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a rajada dos opressores”; o termo hebraico também pode significar “vento” ou “rajada” neste contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “como uma chuva torrencial contra um muro” ou “como uma tempestade que açoita um muro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָעוֹז
  choice: fortaleza
  rationale: Expressa proteção firme e defensiva e preserva a repetição enfática do hebraico.
- source_word: דָּל
  choice: pobre
  rationale: No paralelismo com אֶבְיוֹן, designa alguém socialmente vulnerável; “pobre” é natural e claro.
- source_word: אֶבְיוֹן
  choice: necessitado
  rationale: Mantém distinção vocabular em relação a דָּל sem apagar a sobreposição semântica.
- source_word: בַּצַּר לוֹ
  choice: em sua aflição
  rationale: Reproduz de modo idiomático a condição angustiosa do necessitado e preserva o sufixo de terceira pessoa masculina singular.
- source_word: מַחְסֶה
  choice: abrigo
  rationale: Comunica proteção contra a intempérie e evita confundi-lo com a repetição de מָעוֹז.
- source_word: זֶרֶם
  choice: tempestade
  rationale: É um termo abrangente e natural para a imagem meteorológica violenta nas duas ocorrências.
- source_word: צֵל
  choice: sombra
  rationale: Em português, “sombra” expressa naturalmente o alívio e a proteção contra o calor.
- source_word: חֹרֶב
  choice: calor
  rationale: O paralelismo com “sombra” favorece o sentido de calor abrasador, não o de seca.
- source_word: רוּחַ
  choice: sopro
  rationale: Preserva a amplitude imagética de “sopro/vento/rajada” e a força hostil atribuída aos opressores.
- source_word: עָרִיצִים
  choice: opressores
  rationale: Transmite a ideia de pessoas violentas e dominadoras sem restringi-la necessariamente a governantes políticos.
- source_word: קִיר
  choice: muro
  rationale: É o sentido concreto e direto, adequado à imagem da tempestade que investe contra uma estrutura.
theological_decisions:
- issue: Representação metafórica da proteção de Deus
  choice: Manter as imagens concretas de “fortaleza”, “abrigo” e “sombra”, sem ampliação alegórica.
  alternative: Parafrasear as imagens como conforto espiritual ou salvação.
  rationale: O verso descreve poeticamente o cuidado de Deus pelos vulneráveis mediante imagens físicas de proteção; uma expansão doutrinária iria além do texto hebraico.
- issue: Ambiguidade da imagem final
  choice: Preservar a construção “tempestade contra um muro” no texto e registrar alternativas na nota.
  alternative: Resolver a imagem como chuva que bate no muro ou como tempestade derrubada por um muro.
  rationale: A sintaxe hebraica é breve e a relação exata entre זֶרֶם e קִיר admite mais de uma compreensão; a tradução não deve eliminar essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo e a repetição poética foram preservados. Os marcadores [a] e [b] aparecem no texto junto às expressões a que se referem.
