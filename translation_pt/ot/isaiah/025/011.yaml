  yaml_path: translation/ot/isaiah/025/011.yaml
  text: And he will spread out his hands in its midst as a swimmer spreads them out to swim[a], and he will bring down his pride along with the skill of his hands.
translation:
  language: pt
  text: E ele estenderá as mãos no meio dele, como o nadador estende as mãos para nadar; ele rebaixará o orgulho de Moabe, juntamente com a habilidade de suas mãos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a astúcia de suas mãos”, “as artimanhas de suas mãos” ou “os estratagemas de suas mãos”. A expressão hebraica é difícil e talvez se refira a recursos ardilosos, não a uma habilidade neutra.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפֵרַשׂ
  choice: estenderá
  rationale: O verbo פרשׂ significa estender ou abrir. “Estenderá” transmite com naturalidade o movimento dos braços e mãos na comparação com o nadador.
- source_word: יָדָיו
  choice: as mãos
  rationale: Mantém o sentido literal do hebraico; no contexto da natação, as mãos representam naturalmente o movimento dos membros superiores.
- source_word: בְּקִרְבּוֹ
  choice: no meio dela
  rationale: O sufixo masculino singular retoma Moabe no contexto anterior. Em português, a concordância segue o gênero do nome “Moabe” entendido como nação personificada, aqui representada por “dela”.
- source_word: כַּאֲשֶׁר יְפָרֵשׂ הַשֹּׂחֶה לִשְׂחוֹת
  choice: como o nadador as estende para nadar
  rationale: Preserva a comparação vívida e o valor de finalidade do infinitivo לִשְׂחוֹת, em português corrente.
- source_word: וְהִשְׁפִּיל
  choice: rebaixará
  rationale: O hifil de שׁפל significa fazer baixar, rebaixar ou humilhar. “Rebaixará” conserva a imagem concreta de derrubada sem limitar o sentido a uma disposição interior.
- source_word: גַּאֲוָתוֹ
  choice: o orgulho dela
  rationale: No contexto de juízo, גַּאֲוָה indica orgulho ou arrogância. “Orgulho” é claro e mantém o paralelismo com Moabe personificada.
- source_word: עִם
  choice: juntamente com
  rationale: Expressa de maneira explícita que aquilo que as mãos produzem ou realizam também será rebaixado.
- source_word: אָרְבוֹת יָדָיו
  choice: a habilidade das suas mãos
  rationale: A expressão é lexicalmente difícil e pode indicar habilidade, artimanhas, estratagemas ou emboscadas. A formulação principal é legível sem eliminar as possibilidades mais negativas, registradas em nota.
theological_decisions:
- issue: Referente dos pronomes singulares
  choice: Moabe é personificada como uma figura singular, com pronomes femininos em português por ser entendida como nação.
  alternative: Os singulares podem representar coletivamente o povo de Moabe.
  rationale: O hebraico emprega formas singulares, e a poesia profética personifica com frequência uma nação. A tradução preserva essa imagem sem substituir o singular por uma explicação coletiva.
- issue: Sentido de אָרְבוֹת יָדָיו
  choice: “a habilidade das suas mãos” no texto principal, com alternativas de sentido negativo em nota.
  alternative: “a astúcia das suas mãos”, “as artimanhas das suas mãos” ou “os estratagemas das suas mãos”.
  rationale: O termo é raro e incerto. Uma tradução legível ocupa o texto principal, enquanto a nota conserva a tensão lexical e evita apresentar como certa uma interpretação discutida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva a imagem poética e a personificação de Moabe. O marcador de nota foi colocado imediatamente após a expressão lexicalmente incerta.
