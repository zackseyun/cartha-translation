  - severity: medium
    issue: “a habilidade das suas mãos” pode ser lida como referente ao sujeito da oração, em vez de a Moabe.
    rationale: O hebraico distingue contextualmente o sujeito que age de Moabe, cujas mãos e orgulho são abatidos. Nomear Moabe na expressão possessiva esclarece essa relação sem alterar o sentido.
