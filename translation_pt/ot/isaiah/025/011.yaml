  naturalness: “No meio dele” é natural para Moabe, e “o orgulho de Moabe ... a habilidade de suas mãos” torna as relações referenciais claras em português moderno. A repetição de “as mãos” na comparação é idiomática e evita uma elipse menos transparente.
  terminology: “Orgulho” traduz adequadamente גַּאֲוָה no contexto de juízo. “Habilidade” permanece uma opção principal prudente para a expressão difícil אָרְבוֹת יָדָיו, com alternativas mais negativas mantidas em nota. “Rebaixará” conserva a imagem de fazer descer/abaixar sem restringi-la a uma disposição interior.
