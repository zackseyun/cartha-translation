  text: עַל כֵּ֖ן יְכַבְּד֣וּ/ךָ עַם עָ֑ז קִרְיַ֛ת גּוֹיִ֥ם עָרִיצִ֖ים יִירָאֽוּ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/003.yaml
  text: Therefore a strong people will honor you[c][b][a]; a city of ruthless nations will fear you.
translation:
  language: pt
  text: Por isso, um povo forte te honrará[a]; uma cidade de nações cruéis[b] te temerá[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «um povo poderoso». O adjetivo hebraico pode indicar força, poder ou ferocidade.
    reason: lexical_alternative
  - marker: b
    text: Ou «uma cidade de povos cruéis». A construção hebraica é condensada e pode descrever uma cidade pertencente a nações cruéis ou caracterizada por elas.
    reason: lexical_alternative
  - marker: c
    text: Ou «terá reverência por ti». O verbo pode expressar medo, reverência ou temor reverente, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Expressa de modo natural e conciso a conclusão resultante dos atos de Deus descritos anteriormente.
- source_word: יְכַבְּדוּךָ
  choice: te honrará
  rationale: O piel de כבד significa honrar ou glorificar; «honrar» preserva a amplitude do termo e combina com o paralelo «temerá».
- source_word: עַם עָז
  choice: um povo forte
  rationale: עָז pode indicar força, poder ou ferocidade. «Forte» é amplo e evita acentuar violência além do que o texto exige.
- source_word: קִרְיַת גּוֹיִם עָרִיצִים
  choice: uma cidade de nações cruéis
  rationale: Mantém a cadeia construta hebraica e sua formulação condensada. «Cruéis» comunica o caráter opressor e violento de עָרִיצִים em linguagem corrente.
- source_word: יִירָאוּךָ
  choice: te temerá
  rationale: Preserva o sentido direto de ירא, que pode abranger medo, reverência e assombro diante de Deus.
theological_decisions:
- issue: Natureza da resposta dos poderes hostis a Deus
  choice: O texto declara que povos poderosos e uma cidade ligada a nações cruéis honrarão e temerão a Deus, sem definir sua disposição interior.
  alternative: Interpretar a reação especificamente como conversão e adoração genuínas, ou apenas como submissão coagida pelo pavor.
  rationale: Os verbos hebraicos admitem reconhecimento reverente ou temor diante do poder divino; o versículo não determina se a resposta é voluntária, coagida ou uma combinação de ambas.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem e o paralelismo poético do hebraico foram preservados sem tornar a frase artificial.
