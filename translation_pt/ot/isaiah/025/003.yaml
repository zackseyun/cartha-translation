  source_fidelity: A tradução transmite adequadamente a inferência de עַל־כֵּן, o reconhecimento expresso por כבד no piel e o temor/reverência de ירא. «Povo forte» e «nações cruéis» são opções defensáveis para עַם עָז e גּוֹיִם עָרִיצִים, sem resolver em excesso a imagem condensada da cidade. Contudo, as âncoras das notas b e c estão invertidas em relação aos termos que explicam.
  naturalness: O português é moderno, claro e mantém um registro bíblico sóbrio. «Por isso» e «te honrará ... te temerá» soam naturais. A alternativa «ficará assombrada diante de ti» é menos precisa, pois «assombrada» em português tende a indicar espanto, não necessariamente temor ou reverência.
  terminology: «Honrará» preserva bem o sentido de יְכַבְּדוּךָ; «temerá» conserva a força sem decidir entre temor reverente e pavor. «Cruéis» é aceitável para עָרִיצִים, embora o contexto também admita a nuance de poderes opressores/ruthless.
