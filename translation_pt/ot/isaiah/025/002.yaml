    rationale: O substantivo hebraico designa ruína, colapso ou devastação; «uma ruína» mantém o singular e o paralelismo com «um monte de ruínas».
  - severity: low
    issue: A nota a chama de alternativa uma formulação que reproduz, de modo mais explicativo, a mesma leitura e inclui «algo que».
    rationale: É preferível explicar a elipse hebraica e registrar que a expressão pode significar que o palácio dos estrangeiros já não conta como cidade.
