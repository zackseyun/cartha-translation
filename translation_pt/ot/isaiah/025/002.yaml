source:
  edition: WLC
  text: כִּ֣י שַׂ֤מְתָּ מֵ/עִיר֙ לַ/גָּ֔ל קִרְיָ֥ה בְצוּרָ֖ה לְ/מַפֵּלָ֑ה אַרְמ֤וֹן זָרִים֙ מֵ/עִ֔יר לְ/עוֹלָ֖ם לֹ֥א יִבָּנֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/002.yaml
  text: For you have made the city a heap[a], the fortified town a ruin; the palace of foreigners is no city[b], it will never be rebuilt.
translation:
  language: pt
  text: 'Pois fizeste da cidade um monte de ruínas,

    da cidade fortificada, uma ruína;

    o palácio dos estrangeiros já não é cidade[a]

    e nunca será reconstruído.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico é condensado; literalmente, «o palácio dos estrangeiros, de cidade». A expressão pode indicar que ele já não é cidade ou já não conta como cidade.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «para sempre não será construído»; no contexto, o sentido é que nunca será reconstruído.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂמְתָּ (שׂוּם)
  choice: fizeste ... um
  rationale: Embora o verbo tenha o sentido básico de “pôr” ou “colocar”, com os complementos resultativos desta frase significa transformar algo em outra coisa. A construção “fazer de... um” expressa isso naturalmente em português.
- source_word: מֵעִיר
  choice: da cidade
  rationale: O מִן participa aqui da construção resultativa “fazer de X, Y”, e não indica simplesmente procedência espacial.
- source_word: לַגָּל
  choice: um monte de ruínas
  rationale: גַּל designa um monte ou amontoado, muitas vezes de pedras. “Monte de ruínas” torna explícita a imagem de devastação sem perder a metáfora concreta.
- source_word: קִרְיָה בְצוּרָה
  choice: cidade fortificada
  rationale: קִרְיָה é sinônimo poético de עִיר, e בְצוּרָה significa “fortificada”. Repetir “cidade” preserva com clareza o paralelismo hebraico.
- source_word: לְמַפֵּלָה
  choice: escombros
  rationale: מַפֵּלָה pode indicar queda, desmoronamento ou ruína. “Escombros” é corrente e comunica o resultado concreto da destruição em paralelo com “monte de ruínas”.
- source_word: אַרְמוֹן זָרִים
  choice: o palácio de estrangeiros
  rationale: אַרְמוֹן pode denotar palácio, residência fortificada ou cidadela, e זָרִים, estrangeiros. A tradução mantém o sentido lexical mais direto sem identificar quem seriam esses estrangeiros.
- source_word: אַרְמוֹן זָרִים מֵעִיר
  choice: o palácio de estrangeiros deixou de ser cidade
  rationale: 'A formulação hebraica é condensada. Esta leitura entende מִן como remoção de condição ou transformação: o reduto dos estrangeiros já não tem caráter de cidade.'
- source_word: לְעוֹלָם לֹא יִבָּנֶה
  choice: nunca será reconstruído
  rationale: Com a negação, לְעוֹלָם tem sentido idiomático de “nunca”. O nifal de בנה é passivo; no contexto de uma cidade já destruída, “reconstruído” explicita naturalmente a referência.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe poética. “Monte de ruínas” e “escombros” comunicam concretamente a devastação; a nota preserva a ambiguidade da frase hebraica comprimida sobre o palácio dos estrangeiros.
