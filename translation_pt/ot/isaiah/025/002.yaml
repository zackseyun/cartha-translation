  source_fidelity: A tradução conserva a estrutura resultativa de שַׂמְתָּ, o paralelismo entre cidade/cidade fortificada e a negação durativa de לְעוֹלָם לֹא יִבָּנֶה. Contudo, «deixou de ser cidade» acrescenta uma ideia temporal de estado anterior que o hebraico não afirma de modo explícito; «já não é cidade» transmite melhor a formulação elíptica. «Ruína» corresponde mais diretamente ao singular מַפֵּלָה do que «escombros».
  naturalness: O registro é moderno, poético e claro. A elipse verbal nos dois primeiros membros funciona bem em português. «O palácio dos estrangeiros» é mais fluente que «o palácio de estrangeiros» sem alteração de sentido.
  terminology: «Cidade», «fortificada», «palácio», «estrangeiros» e «reconstruído» são escolhas adequadas. A nota a deve apresentar a ambiguidade sintática/semântica sem introduzir uma paráfrase que sugira mais do que o texto diz.
  issues:
