base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/001.yaml
  text: O Yahweh[a], you are my God; I will exalt you; I will praise your name, for you have done wonderful things, plans formed long ago, faithful and sure.
translation:
  language: pt
  text: Ó Yahweh, tu és o meu Deus; eu te exaltarei e louvarei o teu nome, porque fizeste maravilhas — planos desde tempos antigos, fiéis e seguros.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porque fizeste uma maravilha; planos de tempos antigos, fidelidade e firmeza”. O hebraico é compacto e poético, e a expressão final também pode enfatizar a plena confiabilidade dos antigos planos de Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em conformidade com a orientação do projeto e sem substituí-lo por um título.
- source_word: אֱלֹהַי
  choice: o meu Deus
  rationale: Reproduz diretamente o substantivo com o sufixo possessivo de primeira pessoa do singular.
- source_word: אֲרוֹמִמְךָ
  choice: eu te exaltarei
  rationale: O verbo רום nesta forma comunica elevar ou exaltar em louvor; a formulação é natural e digna em português.
- source_word: אוֹדֶה שִׁמְךָ
  choice: louvarei o teu nome
  rationale: ידה no hifil pode indicar agradecer ou louvar; em paralelo com 'exaltarei', 'louvarei' expressa bem o contexto de adoração, preservando a referência explícita ao nome.
- source_word: כִּי עָשִׂיתָ פֶּלֶא
  choice: porque fizeste maravilhas
  rationale: Embora פֶּלֶא esteja no singular, pode ter valor coletivo ou qualitativo; o plural idiomático comunica os feitos extraordinários de Deus.
- source_word: עֵצוֹת
  choice: planos
  rationale: No contexto dos feitos divinos realizados segundo intenção anterior, 'planos' é mais claro no português atual do que 'conselhos'.
- source_word: מֵרָחוֹק
  choice: desde tempos antigos
  rationale: A expressão literalmente ligada à distância pode indicar distância temporal; aqui qualifica naturalmente os planos como antigos, sem acrescentar explicitamente o verbo 'formar'.
- source_word: אֱמוּנָה אֹמֶן
  choice: fiéis e seguros
  rationale: A formulação faz os dois termos próximos descreverem os planos como confiáveis e firmes, preservando a duplicidade poética sem repetição pouco natural.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama; 'Yahweh' preserva o nome próprio em vez de substituí-lo por um título.
- issue: Sentido de מֵרָחוֹק em relação a עֵצוֹת
  choice: 'sentido temporal: ''planos desde tempos antigos'''
  alternative: 'sentido espacial: ''planos de longe'''
  rationale: O contexto celebra feitos que concretizam o propósito divino anterior; o sentido temporal é o mais coerente, embora a expressão hebraica seja literalmente compacta.
- issue: Relação sintática e sentido de אֱמוּנָה אֹמֶן
  choice: 'duas qualidades dos planos: ''fiéis e seguros'''
  alternative: 'substantivos em aposição: ''fidelidade e firmeza''; expressão intensiva: ''com perfeita fidelidade'''
  rationale: A justaposição hebraica permite mais de uma análise. Fazer os termos qualificarem os planos mantém o vínculo contextual e a tensão poética sem os reduzir a uma só qualidade.
translation_notes:
  register: Português moderno, reverente e acessível, com uso de 'tu' coerente ao longo do versículo. O travessão ajuda a representar a sequência nominal compacta do hebraico. O marcador da nota foi colocado ao fim da cláusula ambígua.
