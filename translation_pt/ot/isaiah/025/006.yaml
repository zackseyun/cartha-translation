  source_fidelity: 'A tradução preserva os elementos centrais do hebraico: a ação de Javé, o título «dos Exércitos», o local demonstrativo, o alcance «para todos os povos» e a estrutura reiterada do banquete. «Comidas suculentas» comunica adequadamente שְׁמָנִים no seu sentido positivo de iguarias ricas; «vinhos envelhecidos» interpreta de modo contextual e justificável שְׁמָרִים, cuja imagem literal é devidamente registrada em nota. «Cheias de tutano» e «bem filtrados» refletem os particípios finais e mantêm a intensificação poética.'
