  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עָשָׂה֩ יְהוָ֨ה צְבָא֜וֹת לְ/כָל הָֽ/עַמִּים֙ בָּ/הָ֣ר הַ/זֶּ֔ה מִשְׁתֵּ֥ה שְׁמָנִ֖ים מִשְׁתֵּ֣ה שְׁמָרִ֑ים שְׁמָנִים֙ מְמֻ֣חָיִ֔ם שְׁמָרִ֖ים מְזֻקָּקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/006.yaml
  text: And Yahweh of Armies will make on this mountain for all the peoples a feast of rich food[a], a feast of aged wine—rich food full of marrow, aged wine well refined.
translation:
  language: pt
  text: Javé dos Exércitos preparará, neste monte, para todos os povos, um banquete de comidas suculentas[a], um banquete de vinhos envelhecidos — comidas suculentas, cheias de tutano, e vinhos envelhecidos, bem filtrados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um banquete de coisas gordurosas [...] um banquete de vinho sobre as borras”. A imagem hebraica ressalta fartura, riqueza e qualidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: preparará
  rationale: Embora עשה signifique literalmente “fazer”, em português “preparar um banquete” é a combinação natural e preserva a ação concreta do verbo no contexto.
- source_word: יְהוָה
  choice: Javé
  rationale: Translitera o nome divino יהוה em uma forma consolidada e facilmente legível em português, em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Traduz o título צבאות de modo transparente, evitando o arcaísmo pouco claro “dos Exércitos/hosts”; a expressão portuguesa estabelecida é “Javé dos Exércitos”.
- source_word: לְכָל הָעַמִּים
  choice: para todos os povos
  rationale: Mantém o plural de עמים e a abrangência coletiva, sem reduzi-lo a uma humanidade abstrata nem especificá-lo exclusivamente como nações políticas.
- source_word: בָּהָר הַזֶּה
  choice: neste monte
  rationale: Expressão portuguesa natural que conserva tanto a localização quanto o demonstrativo hebraico.
- source_word: מִשְׁתֵּה
  choice: um banquete
  rationale: מִשְׁתֶּה designa uma festa ou banquete, frequentemente associado à bebida; “banquete” abrange adequadamente os alimentos e os vinhos mencionados.
- source_word: שְׁמָנִים
  choice: comidas suculentas
  rationale: O sentido literal é “coisas gordurosas”, imagem hebraica de alimento farto, seleto e luxuoso. “Comidas suculentas” comunica esse valor positivo em português atual, enquanto a nota preserva a imagem literal.
- source_word: שְׁמָרִים
  choice: vinhos envelhecidos
  rationale: Literalmente, o termo indica borras ou sedimentos; neste contexto positivo, refere-se ao vinho deixado sobre as borras para amadurecer. “Vinhos envelhecidos” expressa a qualidade resultante sem obscurecer a leitura.
- source_word: מְמֻחָיִם
  choice: cheias de tutano
  rationale: Preserva a imagem vívida das porções mais ricas, providas de tutano, e concorda naturalmente com “comidas”.
- source_word: מְזֻקָּקִים
  choice: bem filtrados
  rationale: O particípio indica vinho depurado ou clarificado. “Bem filtrados” descreve de modo concreto a remoção dos sedimentos após o envelhecimento.
theological_decisions:
- issue: Alcance universal do banquete
  choice: para todos os povos
  alternative: para todas as nações
  rationale: A tradução conserva o plural עמים e a visão abrangente do texto, segundo a qual o banquete de Javé alcança povos para além de Israel, sem impor ao versículo um sistema teológico mais desenvolvido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Monte” preserva o registro bíblico sem soar excessivamente arcaico. A repetição de “um banquete” e de “comidas/vinhos envelhecidos” reproduz a estrutura enfática do hebraico. O travessão apresenta a expansão poética, e a conjunção antes do último elemento favorece a fluidez em português.
