  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי תָנ֥וּחַ יַד יְהוָ֖ה בָּ/הָ֣ר הַ/זֶּ֑ה וְ/נָ֤דוֹשׁ מוֹאָב֙ תַּחְתָּ֔י/ו כְּ/הִדּ֥וּשׁ מַתְבֵּ֖ן ב/מי מַדְמֵנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/010.yaml
  text: For the hand of Yahweh will rest on this mountain[a], and Moab will be trampled down in its place[b], as straw is trampled down in the water of a dung pit.
translation:
  language: pt
  text: Pois a mão de Yahweh repousará sobre este monte, e Moabe será pisoteado sob ele[a], como a palha é pisoteada nas águas de uma esterqueira[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O referente do pronome hebraico é incerto; também se pode entender “debaixo dele” ou “debaixo disso”.
    reason: alternative_reading
  - marker: b
    text: “Esterqueira” também pode ser traduzido por “monte de esterco” ou “fossa de estrume”; o termo hebraico provavelmente indica um lugar imundo associado a esterco.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da promessa e do juízo no contexto anterior, preservando de modo natural o valor explicativo da conjunção.
- source_word: תָנוּחַ
  choice: repousará
  rationale: Mantém a imagem concreta da mão de Yahweh pousando e permanecendo sobre o monte, sem explicitar além do texto se isso indica favor, proteção ou poder.
- source_word: יַד יְהוָה
  choice: a mão de Yahweh
  rationale: Preserva a metáfora hebraica da mão como expressão da ação e do poder divinos, além de verter diretamente o nome próprio divino.
- source_word: בָּהָר הַזֶּה
  choice: sobre este monte
  rationale: É uma formulação portuguesa natural para a referência contextual ao monte de Sião.
- source_word: וְנָדוֹשׁ
  choice: será pisoteado
  rationale: O verbo דושׁ pode significar trilhar ou debulhar mediante pisoteio. Aqui, 'pisoteado' comunica com clareza a humilhação e permite repetir a mesma imagem na comparação seguinte.
- source_word: מוֹאָב
  choice: Moabe
  rationale: Forma tradicional e amplamente reconhecida do nome da nação em português.
- source_word: תַּחְתָּיו
  choice: no lugar onde está
  rationale: Evita atribuir com excessiva certeza um antecedente ao sufixo hebraico ambíguo, ao mesmo tempo que transmite a provável ideia de Moabe ser esmagado no próprio lugar. A forma mais literal é registrada em nota.
- source_word: כְּהִדּוּשׁ
  choice: como ... é pisoteada
  rationale: Repete o verbo escolhido na oração anterior, preservando a ligação lexical e a imagem física do hebraico.
- source_word: מַתְבֵּן
  choice: palha
  rationale: É o equivalente claro e conciso para a palha ou forragem de palha mencionada na comparação.
- source_word: בְּמֵי
  choice: nas águas de
  rationale: Conserva o plural formal do hebraico e descreve o meio em que ocorre o pisoteio.
- source_word: מַדְמֵנָה
  choice: uma esterqueira
  rationale: Designa de forma digna, mas vívida, um lugar ligado a esterco e dejetos; a incerteza sobre a configuração exata do local é preservada em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. 'Yahweh' preserva o nome divino em vez de substituí-lo por um título.
- issue: Referente do sufixo em תַּחְתָּיו
  choice: no lugar onde está
  alternative: debaixo dele
  rationale: O antecedente do pronome hebraico é incerto. O texto principal evita resolver a ambiguidade de forma indevida, e a alternativa formal é apresentada em nota.
translation_notes:
  register: Português moderno, digno e de compreensão ampla, com formas de boa legibilidade no Brasil. A repetição de “pisoteado/pisoteada” é intencional e reproduz a repetição da raiz hebraica. As notas estão posicionadas junto aos termos a que efetivamente se referem.
