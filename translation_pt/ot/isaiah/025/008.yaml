id: ISA.25.8
reference: Isaiah 25:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בִּלַּ֤ע הַ/מָּ֨וֶת֙ לָ/נֶ֔צַח וּ/מָחָ֨ה אֲדֹנָ֧/י יְהוִ֛ה דִּמְעָ֖ה מֵ/עַ֣ל כָּל פָּנִ֑ים וְ/חֶרְפַּ֣ת עַמּ֗/וֹ יָסִיר֙ מֵ/עַ֣ל כָּל הָ/אָ֔רֶץ כִּ֥י יְהוָ֖ה דִּבֵּֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/008.yaml
  text: He will swallow up death forever[a], and the Lord GOD will wipe away tears from every face, and he will remove the reproach of his people from all the earth[c][b], for Yahweh has spoken.
translation:
  language: pt
  text: Ele tragará a morte para sempre[a]. O Senhor Yahweh enxugará as lágrimas de todos os rostos e removerá de toda a terra a desonra do seu povo[b], pois Yahweh falou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tragou a morte para sempre”. O perfeito hebraico pode apresentar uma ação futura como já realizada, ressaltando sua certeza.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o opróbrio do seu povo” ou “a vergonha do seu povo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּלַּע
  choice: Ele tragará
  rationale: Preserva a metáfora concreta de engolir ou tragar. Embora a forma hebraica seja perfeita, o contexto profético favorece em português o futuro como expressão de uma ação anunciada como certa.
- source_word: הַמָּוֶת לָנֶצַח
  choice: a morte para sempre
  rationale: Traduz diretamente o objeto definido e o valor duradouro de לָנֶצַח, mantendo a afirmação enfática de que a morte será eliminada definitivamente.
- source_word: וּמָחָה ... דִּמְעָה מֵעַל כָּל פָּנִים
  choice: enxugará as lágrimas de todos os rostos
  rationale: Com lágrimas, 'enxugar' é a colocação natural em português. O plural 'lágrimas' expressa idiomaticamente o singular coletivo hebraico, e 'de todos os rostos' conserva a abrangência distributiva.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: 'Representa os dois elementos do título hebraico: אֲדֹנָי, ''Senhor'', e o nome divino יהוה, ''Yahweh'', sem produzir a combinação ambígua ''Senhor SENHOR''.'
- source_word: וְחֶרְפַּת עַמּוֹ
  choice: a desonra do seu povo
  rationale: חרפה abrange vergonha pública, afronta e opróbrio. 'Desonra' é atual e digna, preservando o aspecto social sem restringir o termo a um sentimento interior.
- source_word: יָסִיר מֵעַל כָּל הָאָרֶץ
  choice: removerá de toda a terra
  rationale: O hifil de סור indica retirar ou remover. 'Terra' preserva a amplitude possível de הָאָרֶץ neste contexto universal.
- source_word: כִּי יְהוָה דִּבֵּר
  choice: pois Yahweh falou
  rationale: A conjunção fundamenta a certeza da promessa na palavra divina; o perfeito 'falou' mantém a solenidade e a força conclusiva da fórmula profética.
theological_decisions:
- issue: Valor temporal de בִּלַּע e וּמָחָה
  choice: 'futuro profético: ''tragará'' e ''enxugará'''
  alternative: 'perfeito: ''tragou'' e ''enxugou'''
  rationale: As formas perfeitas apresentam a ação prometida como certa, enquanto יָסִיר já está no imperfeito. O futuro produz uma sequência natural em português sem apagar a certeza retórica do hebraico; a alternativa formal é registrada em nota.
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: A transliteração distingue o nome pessoal divino do título אֲדֹנָי e permite traduzir אֲדֹנָי יְהוִה de modo transparente como 'Senhor Yahweh'.
- issue: Sentido de חֶרְפָּה
  choice: desonra
  alternative: opróbrio; vergonha; afronta
  rationale: O termo comunica vergonha pública e desprezo sofrido pelo povo. 'Desonra' conserva essa dimensão sem impor uma interpretação denominacional.
translation_notes:
  register: Português moderno, corrente e digno, com legibilidade brasileira e compreensão internacional. Mantiveram-se a metáfora vigorosa de tragar a morte, a fórmula divina 'Senhor Yahweh' e a cadência profética. Os marcadores [a] e [b] aparecem no texto junto às expressões a que se referem.
