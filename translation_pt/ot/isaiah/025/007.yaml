  text: וּ/בִלַּע֙ בָּ/הָ֣ר הַ/זֶּ֔ה פְּנֵֽי הַ/לּ֥וֹט הַ/לּ֖וֹט עַל כָּל הָֽ/עַמִּ֑ים וְ/הַ/מַּסֵּכָ֥ה הַ/נְּסוּכָ֖ה עַל כָּל הַ/גּוֹיִֽם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/025/007.yaml
  text: And on this mountain he will swallow up the covering that covers all peoples[b][a], and the veil that is spread over all nations.
translation:
  language: pt
  text: E, neste monte, ele engolirá a cobertura que cobre todos os povos[a][b], e o véu estendido sobre todas as nações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o sudário que envolve todos os povos”. O hebraico repete termos da mesma raiz para descrever algo que envolve a humanidade.'
    reason: lexical_alternative
  - marker: b
    text: A “cobertura” ou o “véu” provavelmente prepara a declaração do versículo seguinte de que a morte será engolida, embora a imagem também possa indicar, de maneira mais ampla, a remoção daquilo que paira sobre as nações.
    reason: cross_reference
lexical_decisions:
- source_word: וּבִלַּע
  choice: ele engolirá
  rationale: Preserva a metáfora vívida de בלע e a ligação verbal com o versículo seguinte, no qual a morte é engolida. “Destruirá” explicaria a imagem em vez de traduzi-la.
- source_word: בָּהָר הַזֶּה
  choice: neste monte
  rationale: בְּ tem sentido locativo neste contexto, e “neste monte” é a formulação portuguesa natural que retoma o monte de Sião no contexto.
- source_word: פְּנֵי הַלּוֹט הַלּוֹט
  choice: a cobertura que cobre
  rationale: A expressão designa a superfície ou presença daquilo que envolve os povos. A formulação preserva de modo natural a repetição de termos cognatos ligados à ideia de cobrir, sem o pouco idiomático “a face da cobertura”.
- source_word: עַל כָּל הָעַמִּים
  choice: todos os povos
  rationale: “Povos” traduz עַמִּים e mantém a distinção poética em relação a גּוֹיִם, traduzido depois por “nações”. A noção de “sobre” está incorporada na construção “cobre todos os povos”.
- source_word: וְהַמַּסֵּכָה
  choice: e o véu
  rationale: Embora מַסֵּכָה possa ter outros sentidos em outros contextos, o paralelismo com a cobertura e o particípio seguinte favorecem aqui algo semelhante a um tecido posto sobre as nações.
- source_word: הַנְּסוּכָה
  choice: estendido
  rationale: O particípio passivo descreve naturalmente o véu como disposto ou estendido sobre as nações. A escolha conserva a imagem sem recorrer à acepção literal de derramar, inadequada em português neste contexto.
- source_word: עַל כָּל הַגּוֹיִם
  choice: sobre todas as nações
  rationale: “Nações” é a correspondência natural de גּוֹיִם, e “sobre” expressa diretamente a relação espacial da imagem.
theological_decisions:
- issue: Natureza daquilo que é removido
  choice: Uma cobertura ou um véu metafórico sobre os povos e as nações
  alternative: Um sudário funerário especificamente, ou um símbolo de cegueira espiritual ou desonra
  rationale: O contexto imediato, sobretudo o versículo 8, associa fortemente a imagem à morte, mas o versículo 7 não identifica de modo explícito a cobertura apenas como sudário nem define uma única aplicação teológica. O texto principal conserva a amplitude da metáfora.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Ele engolirá” mantém a força concreta e incomum da metáfora hebraica; “cobertura que cobre” reproduz deliberadamente a repetição do original sem soar arcaico. A ordem “povos/nações” conserva o paralelismo lexical.
