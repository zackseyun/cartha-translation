source:
  edition: WLC
  text: הִנֵּ֣ה יְהוָ֗ה הִשְׁמִ֨יעַ֙ אֶל קְצֵ֣ה הָ/אָ֔רֶץ אִמְרוּ֙ לְ/בַת צִיּ֔וֹן הִנֵּ֥ה יִשְׁעֵ֖/ךְ בָּ֑א הִנֵּ֤ה שְׂכָר/וֹ֙ אִתּ֔/וֹ וּ/פְעֻלָּת֖/וֹ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/011.yaml
  text: 'Behold[a], Yahweh has proclaimed to the end of the earth: Say to Daughter Zion, “Behold, your salvation comes; behold, his reward is with him, and his recompense before him.”'
translation:
  language: pt
  text: 'Eis[a], Yahweh proclamou até os confins da terra: «Digam à Filha de Sião: Eis que a sua salvação vem; eis que a recompensa dele está com ele, e a retribuição dele está diante dele.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o seu Salvador vem». O hebraico diz «a sua salvação», mas as expressões seguintes usam sufixos masculinos («a recompensa dele... a retribuição dele»), o que pode personificar a salvação como uma figura pessoal que vem.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הִשְׁמִיעַ
  choice: fez ouvir
  rationale: Preserva de modo natural a forma causativa do hifil, com o sentido de tornar pública uma proclamação.
- source_word: אֶל קְצֵה הָאָרֶץ
  choice: até os confins da terra
  rationale: Expressa em português corrente a extensão da proclamação até o limite mais distante da terra; o plural idiomático não altera o sentido coletivo da expressão hebraica singular.
- source_word: אִמְרוּ
  choice: Digam
  rationale: Imperativo plural direto e natural, que introduz a mensagem citada.
- source_word: לְבַת צִיּוֹן
  choice: à Filha de Sião
  rationale: Conserva a personificação poética de Sião e explicita a relação genitiva exigida pelo português.
- source_word: יִשְׁעֵךְ
  choice: a sua salvação
  rationale: Traduz o substantivo hebraico sem resolver a tensão criada pelos sufixos masculinos seguintes; a possível leitura pessoal é preservada em nota.
- source_word: בָּא
  choice: vem
  rationale: Reproduz a vivacidade da proclamação profética e admite valor presente com alcance iminente ou futuro.
- source_word: שְׂכָרוֹ
  choice: a recompensa dele
  rationale: Representa o sentido de recompensa ou pagamento e mantém explícito o referente masculino do sufixo hebraico.
- source_word: אִתּוֹ
  choice: está com ele
  rationale: Expressa acompanhamento ou posse presente em português natural.
- source_word: וּפְעֻלָּתוֹ
  choice: e a retribuição dele
  rationale: No contexto, indica o retorno ou pagamento devido, distinguindo-se lexicalmente de שׂכר sem perder o paralelismo.
- source_word: לְפָנָיו
  choice: vai à sua frente
  rationale: Comunica com clareza a imagem espacial de algo que precede a figura que vem.
- source_word: הִנֵּה
  choice: Vejam
  rationale: A forma chama enfaticamente a atenção e ocorre três vezes. “Vejam” é atual, digno e conserva a repetição retórica.
theological_decisions:
- issue: Se יִשְׁעֵךְ deve ser traduzido de modo impessoal (“a sua salvação”) ou pessoal (“o seu Salvador”), devido aos sufixos masculinos posteriores.
  choice: a sua salvação
  alternative: o seu Salvador
  rationale: A forma hebraica significa lexicalmente “a sua salvação”. Os sufixos masculinos em “recompensa dele” e “retribuição dele” podem personificar essa salvação no libertador que vem. O texto principal mantém a forma nominal, enquanto a nota conserva a leitura pessoal possível e a ressonância messiânica sem impô-la.
translation_notes:
  register: Português moderno, poético e acessível, com legibilidade brasileira. A repetição de “Vejam” conserva a ênfase de הִנֵּה; “Filha de Sião” mantém a personificação. Os pronomes foram formulados para deixar perceptível a mudança do referente feminino (“sua”, dirigido a Sião) para o masculino (“dele”, “ele”), central à ambiguidade do texto.
