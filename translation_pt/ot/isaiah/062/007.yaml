source:
  edition: WLC
  text: וְ/אַֽל תִּתְּנ֥וּ דֳמִ֖י ל֑/וֹ עַד יְכוֹנֵ֞ן וְ/עַד יָשִׂ֧ים אֶת יְרֽוּשָׁלִַ֛ם תְּהִלָּ֖ה בָּ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/007.yaml
  text: and give him no rest until he establishes and until he makes Jerusalem a praise in the earth[a][b].
translation:
  language: pt
  text: e não lhe deem descanso[a] até que estabeleça Jerusalém e até que faça dela motivo de louvor na terra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não lhe deem silêncio”; o substantivo hebraico pode indicar “silêncio” ou “quietude”, e a expressão retrata uma súplica incessante ao SENHOR.
    reason: lexical_alternative
  - marker: b
    text: Ou “no país”; o hebraico אֶרֶץ pode significar tanto “terra” quanto “país”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַל תִּתְּנוּ
  choice: e não lhe deem
  rationale: A conjunção dá continuidade à exortação do versículo anterior, e a forma verbal plural dirige-se aos que invocam o SENHOR. Em português, a construção negativa introduz naturalmente o objeto “descanso”.
- source_word: דֳמִי
  choice: descanso
  rationale: O substantivo pode significar “silêncio”, “quietude” ou, nesta expressão, “descanso”. “Não lhe deem descanso” comunica de modo idiomático a persistência incessante da súplica, enquanto a alternativa lexical é preservada em nota.
- source_word: לוֹ
  choice: lhe
  rationale: O pronome masculino singular retoma o SENHOR no contexto imediato. O pronome oblíquo “lhe” é a forma portuguesa natural com o verbo “dar”.
- source_word: עַד יְכוֹנֵן
  choice: até que ele estabeleça Jerusalém
  rationale: כון expressa tornar firme ou estabelecer. O objeto Jerusalém, explicitado na cláusula paralela hebraica, é repetido em português para evitar uma elipse pouco natural e deixar claro o referente sem alterar o sentido.
- source_word: וְעַד יָשִׂים
  choice: e faça dela
  rationale: שׂים significa pôr, colocar ou fazer. Com Jerusalém e o predicativo “louvor”, “faça dela” reproduz com clareza a construção resultativa. A conjunção preserva o paralelismo dos dois objetivos introduzidos por עַד.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalém
  rationale: Forma tradicional e amplamente reconhecida do nome da cidade em português.
- source_word: תְּהִלָּה
  choice: motivo de louvor
  rationale: O substantivo denota louvor ou renome. “Motivo de louvor” torna natural em português a metáfora segundo a qual Jerusalém se torna algo elogiado, sem reduzi-la apenas a “fama”.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: אֶרֶץ pode designar tanto a terra em sentido amplo quanto uma região ou país. “Na terra” conserva essa formulação compacta, e a alternativa “no país” é registrada em nota.
theological_decisions:
- issue: Referente do pronome “lhe”
  choice: O pronome refere-se ao SENHOR, a quem se deve suplicar sem cessar.
  alternative: Um referente divino ou celestial não especificado.
  rationale: Isaías 62:6 menciona os que fazem o SENHOR lembrar-se e ordena que não se calem; o versículo 7 prossegue naturalmente a mesma exortação, pedindo que não lhe deem descanso até que aja em favor de Jerusalém.
- issue: Alcance de אֶרֶץ
  choice: “terra”, permitindo a leitura de alcance amplo.
  alternative: “país” ou “terra” no sentido da região de Israel.
  rationale: O termo hebraico admite os dois sentidos, e o contexto profético pode apontar para o reconhecimento de Jerusalém entre os povos. A tradução não fecha a questão, e a alternativa é mantida em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento verbal no plural (“deem”) e formulação idiomática. A repetição literal de “até que” foi suavizada porque em português a coordenação de dois verbos sob a mesma expressão temporal comunica com naturalidade o paralelismo hebraico. Os marcadores de nota aparecem imediatamente após os termos pertinentes.
