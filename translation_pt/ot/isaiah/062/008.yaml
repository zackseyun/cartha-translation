  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: נִשְׁבַּ֧ע יְהוָ֛ה בִּֽ/ימִינ֖/וֹ וּ/בִ/זְר֣וֹעַ עֻזּ֑/וֹ אִם אֶתֵּן֩ אֶת דְּגָנֵ֨/ךְ ע֤וֹד מַֽאֲכָל֙ לְ/אֹ֣יְבַ֔יִ/ךְ וְ/אִם יִשְׁתּ֤וּ בְנֵֽי נֵכָר֙ תִּֽירוֹשֵׁ֔/ךְ אֲשֶׁ֥ר יָגַ֖עַתְּ בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/008.yaml
  text: 'Yahweh has sworn by his right hand and by his strong arm: I will never again give your grain as food for your enemies[c][b][a], nor will foreigners drink your new wine for which you have labored.'
translation:
  language: pt
  text: 'Yahweh jurou pela sua mão direita e pelo seu braço poderoso: “Nunca mais darei o seu cereal como alimento aos seus inimigos,[a] nem estrangeiros[b] beberão o seu vinho novo, pelo qual você trabalhou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente: “Se eu der o seu cereal novamente... e se os filhos do estrangeiro beberem...”. Trata-se de uma fórmula de juramento em que “se” expressa forte negação: “certamente não”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “filhos do estrangeiro”, isto é, estrangeiros.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal e preserva sua função pactual no texto.
- source_word: נִשְׁבַּע
  choice: jurou
  rationale: O nifal perfeito indica um juramento já proferido; o pretérito perfeito é natural e solene em português.
- source_word: בִּימִינוֹ
  choice: pela sua mão direita
  rationale: Preserva a fórmula de juramento e a imagem concreta do hebraico.
- source_word: וּבִזְרֹעַ עֻזּוֹ
  choice: e pelo seu braço poderoso
  rationale: Expressa de modo idiomático a ideia literal de 'braço de sua força'.
- source_word: אִם אֶתֵּן ... וְאִם יִשְׁתּוּ
  choice: Nunca mais darei ... nem ... beberão
  rationale: Depois do verbo 'jurou', אִם introduz uma fórmula elíptica de juramento com forte valor negativo; explicitá-lo comunica seu sentido real em português.
- source_word: דְּגָנֵךְ
  choice: o seu cereal
  rationale: Designa a produção de grãos; 'cereal' é claro no português internacional e evita a possível ambiguidade regional de 'grão'.
- source_word: מַאֲכָל לְאֹיְבַיִךְ
  choice: como alimento aos seus inimigos
  rationale: Mantém a função predicativa de מַאֲכָל e o destinatário marcado por לְ.
- source_word: בְנֵי נֵכָר
  choice: estrangeiros
  rationale: Equivalente natural da expressão idiomática literal 'filhos do estrangeiro'.
- source_word: תִּירוֹשֵׁךְ
  choice: o seu vinho novo
  rationale: Preserva a referência específica a vinho novo ou recém-produzido, em vez de vinho genericamente.
- source_word: אֲשֶׁר יָגַעַתְּ בּוֹ
  choice: pelo qual você trabalhou
  rationale: Reproduz a relativa e o sentido de esforço ou trabalho empregado na produção.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio; 'Yahweh' o representa diretamente sem substituí-lo por um título.
- issue: Negação implícita na fórmula de juramento com אִם
  choice: 'Tornar explícita a forte negação: ''Nunca mais... nem...'''
  alternative: 'Traduzir formalmente: ''Se eu der... e se estrangeiros beberem...'''
  rationale: Em hebraico, a consequência omitida do juramento faz de אִם uma negação enfática. A tradução literal com 'se' seria opaca ou enganosa para o leitor moderno.
- issue: Referente feminino dos sufixos de segunda pessoa
  choice: Usar formas portuguesas sem marcação de gênero ('seu', 'você')
  alternative: Explicitar que a destinatária personificada é Sião/Jerusalém
  rationale: O hebraico se dirige a uma entidade feminina personificada no contexto; o português não precisa acrescentar seu nome neste versículo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Emprega 'você' por naturalidade contemporânea e mantém a imagem solene do juramento. A pontuação integra os marcadores imediatamente aos termos ou orações que explicam.
