- from: As nações verão a sua justiça[a], e todos os reis, a sua glória; você será chamada por um novo nome, que a boca de Yahweh determinará[b].
  to: As nações verão a sua justiça[a], e todos os reis, a sua glória; você receberá um novo nome, que a boca de Yahweh designará[b].
  rationale: A revisão substitui a passiva portuguesa com «por», sintaticamente ambígua, por «receberá um novo nome», que transmite de forma idiomática a concessão divina implicada pela fórmula hebraica de nomeação. Mantém-se a oração relativa com «a boca de Yahweh» para conservar a imagem antropomórfica e o sufixo que retoma «nome». A nota b é corrigida para não tratar como implícito o sufixo objeto expresso no hebraico.
