base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/002.yaml
  text: Nations will see your righteousness[a], and all kings your glory[b]; and you will be called by a new name that the mouth of Yahweh will designate.
translation:
  language: pt
  text: As nações verão a sua justiça[a], e todos os reis, a sua glória; você receberá um novo nome, que a boca de Yahweh designará[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a sua vindicação” ou “a sua retidão”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “que a boca de Yahweh designará”, com o sufixo pronominal retomando “nome”.'
    reason: lexical_clarification
lexical_decisions:
- source_word: וְרָאוּ
  choice: verão
  rationale: O perfeito qal com conjunção, no discurso profético, tem sentido naturalmente futuro; “verão” preserva a força preditiva.
- source_word: גוֹיִם
  choice: as nações
  rationale: Designa amplamente os povos estrangeiros; “nações” mantém o alcance internacional e evita restringir o sentido a “gentios”.
- source_word: צִדְקֵךְ
  choice: a sua justiça
  rationale: צֶדֶק pode expressar justiça, retidão ou vindicação. “Justiça” conserva boa amplitude lexical em português, enquanto a nota registra alternativas relevantes ao contexto da restauração pública de Sião.
- source_word: וְכָל מְלָכִים
  choice: e todos os reis
  rationale: Tradução direta e idiomática do coletivo distributivo, em paralelo com “as nações”.
- source_word: כְּבוֹדֵךְ
  choice: a sua glória
  rationale: “Glória” preserva a linguagem característica de Isaías e comunica a manifestação pública da condição restaurada de Sião.
- source_word: וְקֹרָא לָךְ
  choice: você será chamada
  rationale: Embora o verbo seja formalmente ativo na terceira pessoa masculina singular, a construção passiva é natural em português e evita determinar silenciosamente a identidade do sujeito; o feminino concorda com Sião, destinatária do contexto.
- source_word: שֵׁם חָדָשׁ
  choice: um novo nome
  rationale: Expressa uma identidade ou condição nova, conferida a Sião, em linguagem corrente e digna.
- source_word: אֲשֶׁר פִּי יְהוָה
  choice: que a boca de Yahweh
  rationale: Mantém a imagem antropomórfica explícita do hebraico e destaca a fala divina como fonte do novo nome.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em conformidade com a camada inglesa fornecida.
- source_word: יִקֳּבֶנּוּ
  choice: determinará
  rationale: O verbo נקב aqui significa especificar ou designar, e o sufixo masculino singular retoma “nome”. “Determinará” comunica a atribuição divina sem a redundância de “nomeará o nome”.
theological_decisions:
- issue: Sentido de צִדְקֵךְ na restauração pública de Sião
  choice: a sua justiça
  alternative: a sua vindicação; a sua retidão
  rationale: “Justiça” preserva a abrangência ética, relacional e pública do termo, sem reduzi-lo apenas à absolvição forense; as alternativas são registradas em nota.
- issue: Fórmula da concessão divina do novo nome
  choice: você será chamada por um novo nome, que a boca de Yahweh determinará
  alternative: ele a chamará por um novo nome, que a boca de Yahweh designará
  rationale: A voz passiva mantém aberta a identidade do sujeito gramatical de וְקֹרָא, enquanto a oração relativa deixa claro que o nome procede da declaração de Yahweh.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome “você” explicita naturalmente o destinatário feminino, Sião; “chamada” preserva essa concordância. A imagem “a boca de Yahweh” foi mantida por sua força poética e teológica.
