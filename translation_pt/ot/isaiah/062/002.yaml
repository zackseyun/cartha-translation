review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente o paralelismo profético, o alcance universal de «nações» e «todos os reis», e a referência feminina a Sião. Contudo, «será chamada por um novo nome» usa «por» de modo ambíguo em português, onde normalmente introduz o agente da passiva, não o nome recebido. Além disso, a nota b chama de implícito um pronome que está expresso no sufixo verbal hebraico.
  naturalness: «Você receberá um novo nome» é moderno, claro e natural para o português internacional com boa legibilidade brasileira. «A boca de Yahweh designará» mantém deliberadamente a imagem hebraica e o ato de especificar/conferir o nome, sem a ambiguidade sintática da redação anterior.
  terminology: «Justiça», «glória» e «Yahweh» são escolhas defensáveis e coerentes com o hebraico e com a camada de auditoria inglesa. A nota de «justiça» registra de modo útil as alternativas contextuais «vindicação» e «retidão».
  issues:
  - severity: medium
    issue: Uso ambíguo de «por» em «será chamada por um novo nome».
    rationale: Em português, «por» após uma passiva tende a marcar o agente («chamada por alguém»), não o conteúdo ou o nome atribuído. A construção prejudica a naturalidade e pode obscurecer a relação entre Sião e o novo nome.
  - severity: low
    issue: A nota b descreve o pronome objeto como implícito.
    rationale: Em יִקֳּבֶנּוּ, o sufixo masculino singular é expresso e retoma «nome». A nota deve descrevê-lo como sufixo/pronome expresso.
