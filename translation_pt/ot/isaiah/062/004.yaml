source:
  edition: WLC
  text: לֹֽא יֵאָמֵר֩ לָ֨/ךְ ע֜וֹד עֲזוּבָ֗ה וּ/לְ/אַרְצֵ/ךְ֙ לֹא יֵאָמֵ֥ר עוֹד֙ שְׁמָמָ֔ה כִּ֣י לָ֗/ךְ יִקָּרֵא֙ חֶפְצִי בָ֔הּ וּ/לְ/אַרְצֵ֖/ךְ בְּעוּלָ֑ה כִּֽי חָפֵ֤ץ יְהוָה֙ בָּ֔/ךְ וְ/אַרְצֵ֖/ךְ תִּבָּעֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/004.yaml
  text: No longer will you be called Forsaken[a], and your land will no longer be called Desolate; but you will be called My Delight Is in Her, and your land Married; for Yahweh delights in you[b], and your land will be married.
translation:
  language: pt
  text: Você não será mais chamada Abandonada, nem a sua terra será mais chamada Desolada. Você, porém, será chamada Meu Prazer Está Nela[a], e a sua terra, Casada[b], pois Yahweh se agrada de você, e a sua terra será desposada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: Hefzibá, que significa “Meu Prazer Está Nela”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: Beulá, que significa “Casada”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲזוּבָה
  choice: Abandonada
  rationale: Preserva o sentido passivo de ter sido deixada e funciona naturalmente como nome simbólico feminino dado a Sião.
- source_word: שְׁמָמָה
  choice: Desolada
  rationale: Expressa a condição de devastação da terra e mantém o paralelismo com o nome simbólico anterior.
- source_word: חֶפְצִי בָהּ
  choice: Meu Prazer Está Nela
  rationale: Traduz o conteúdo semântico do nome hebraico, essencial ao contraste retórico entre a antiga condição e a restauração.
- source_word: בְּעוּלָה
  choice: Casada
  rationale: Comunica em português atual o estado matrimonial indicado pelo termo e preserva seu uso como novo nome da terra.
- source_word: חָפֵץ
  choice: se agrada de
  rationale: Mantém a ligação lexical e conceitual com o nome “Meu Prazer Está Nela” de maneira natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Representa diretamente o nome divino presente no texto hebraico.
- source_word: תִּבָּעֵל
  choice: será desposada
  rationale: Conserva a forma passiva e a metáfora matrimonial, além de distingui-la do nome simbólico “Casada” sem reduzir a imagem a uma restauração genérica.
- source_word: לָךְ / אַרְצֵךְ
  choice: você / a sua terra
  rationale: Mantém a distinção poética entre Sião personificada como mulher e a terra que lhe pertence.
theological_decisions:
- issue: Tradução dos nomes simbólicos ou uso de transliterações tradicionais
  choice: Traduzir no texto principal os nomes como “Abandonada”, “Desolada”, “Meu Prazer Está Nela” e “Casada”
  alternative: Usar transliterações como Hefzibá e Beulá
  rationale: Os nomes são semanticamente transparentes em hebraico e sua significação produz o contraste teológico do versículo. As formas tradicionais são preservadas em notas.
- issue: Metáfora matrimonial aplicada à terra
  choice: Manter explicitamente a linguagem de casamento em “Casada” e “será desposada”
  alternative: Generalizar como restauração, habitação ou posse
  rationale: O hebraico emprega linguagem matrimonial tanto no novo nome quanto no verbo final; preservar essa imagem mantém a tensão e a força da promessa de restauração.
translation_notes:
  register: Português moderno, claro e digno, com concordância feminina para Sião personificada. Os nomes simbólicos recebem iniciais maiúsculas para evidenciar sua função de renomeação. “Desposada” é ligeiramente mais solene que a linguagem cotidiana, mas preserva com precisão a voz passiva e a metáfora matrimonial do hebraico.
