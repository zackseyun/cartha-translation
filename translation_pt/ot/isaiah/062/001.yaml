revisions:
- from: Por amor a Sião, não me calarei; por amor a Jerusalém, não descansarei[a], até que a justiça dela resplandeça como o clarão[b], e a salvação dela arda como uma tocha.
  to: Por amor a Sião, não me calarei; por amor a Jerusalém, não descansarei[a], até que a justiça[b] dela se manifeste como o resplendor, e a salvação dela arda como uma tocha.
  rationale: A revisão conserva «não descansarei», que é uma opção legítima para o segundo verbo e mantém o paralelismo sem repetição mecânica. Ajusta-se a oração seguinte para refletir a saída ou manifestação pública da justiça, distinta do «resplendor» comparativo, e corrige-se a posição e o escopo da nota sobre «vindicação».
