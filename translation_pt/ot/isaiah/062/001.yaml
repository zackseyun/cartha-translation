review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente o paralelismo, a voz em primeira pessoa não identificada e os termos centrais. Contudo, «resplandeça como o clarão» substitui o verbo hebraico «sair/irromper» por «resplandecer» e torna a imagem algo redundante; uma formulação que expresse manifestação pública é mais fiel ao conjunto da metáfora.
  naturalness: O texto é claro e de registro bíblico moderno. «Não descansarei» é idiomático e comunica bem a perseverança. «A justiça dela se manifeste como o resplendor» é natural, solene e evita a redundância de «resplandeça como o clarão».
  terminology: «Justiça», «salvação», «Sião», «Jerusalém» e «tocha» são escolhas adequadas. A nota sobre «vindicação» deve estar ancorada em «justiça», não em «clarão», pois trata de צדקהּ.
  issues:
  - severity: medium
    issue: O verbo «resplandeça» não representa diretamente o hebraico יֵצֵא («saia», com o sentido contextual de manifestar-se/irromper).
    rationale: Embora a imagem envolva brilho, o texto hebraico distingue o sair da justiça do brilho ao qual ela é comparada. «Se manifeste como o resplendor» preserva melhor essa distinção.
  - severity: medium
    issue: A nota b está ancorada em «clarão», mas explica uma alternativa para «justiça».
    rationale: A âncora deve aparecer junto ao termo ao qual a nota lexical se refere; do modo atual, a nota parece explicar a imagem de clarão e ainda reformula indevidamente toda a oração.
