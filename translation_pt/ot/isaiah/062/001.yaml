base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/001.yaml
  text: For Zion’s sake I will not keep silent[a], and for Jerusalem’s sake I will not be quiet[c][b], until her righteousness goes out like brightness and her salvation burns like a torch.
translation:
  language: pt
  text: Por amor a Sião, não me calarei; por amor a Jerusalém, não descansarei[a], até que a justiça[b] dela se manifeste como o resplendor, e a salvação dela arda como uma tocha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «não ficarei quieto». O verbo hebraico pode significar ficar quieto, permanecer imóvel ou descansar.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «vindicação dela». A palavra hebraica traduzida por «justiça» também pode indicar vindicação pública.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: por amor a
  rationale: Expressa motivação ou propósito e forma um paralelismo natural em português entre Sião e Jerusalém.
- source_word: אֶחֱשֶׁה
  choice: não me calarei
  rationale: Traduz diretamente o sentido de permanecer em silêncio, preservando a determinação expressa pela primeira pessoa.
- source_word: אֶשְׁקֹט
  choice: não descansarei
  rationale: O verbo pode significar ficar quieto, permanecer imóvel ou descansar. Aqui, «não descansarei» comunica perseverança sem repetir de modo artificial «não me calarei».
- source_word: יֵצֵא כַנֹּגַהּ
  choice: resplandeça como o clarão
  rationale: A combinação idiomática em português comunica que a justiça se manifesta publicamente como brilho intenso, sem restringir נֹגַהּ à aurora.
- source_word: צִדְקָהּ
  choice: a justiça dela
  rationale: Preserva o campo moral e pactual de צדקה; neste contexto, também pode indicar sua vindicação pública.
- source_word: וִישׁוּעָתָהּ
  choice: a salvação dela
  rationale: Mantém a amplitude de ישועה, que abrange livramento, restauração e salvação.
- source_word: כְלַפִּיד יִבְעָר
  choice: arda como uma tocha
  rationale: Conserva diretamente a imagem visível e vigorosa de uma tocha acesa.
theological_decisions:
- issue: Identidade de quem fala na primeira pessoa
  choice: Mantida implícita, como no hebraico
  alternative: Identificar a voz como o profeta, o SENHOR ou uma voz representativa
  rationale: O versículo não identifica explicitamente quem fala; nomear o falante resolveria uma ambiguidade interpretativa genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo poético foi preservado; evitou-se identificar o falante e também restringir «clarão» especificamente à aurora.
