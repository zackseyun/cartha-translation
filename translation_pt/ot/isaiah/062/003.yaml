  text: וְ/הָיִ֛יתְ עֲטֶ֥רֶת תִּפְאֶ֖רֶת בְּ/יַד יְהוָ֑ה ו/צנוף מְלוּכָ֖ה בְּ/כַף אֱלֹהָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/003.yaml
  text: You will be a crown of beauty in the hand of Yahweh[a], and a royal turban in the palm of your God.
translation:
  language: pt
  text: Você será uma coroa de beleza na mão de Yahweh e um turbante real[a] na palma da mão do seu Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um diadema de realeza” ou “uma cobertura real para a cabeça”. O substantivo hebraico se refere a uma peça enrolada na cabeça, isto é, um turbante.
    reason: alternativa lexical
lexical_decisions:
- source_word: וְהָיִיתְ
  choice: Você será
  rationale: O perfeito qal na segunda pessoa feminina singular, com conjunção e em discurso profético, tem sentido futuro. A formulação mantém a referência direta a Sião/Jerusalém.
- source_word: עֲטֶרֶת תִּפְאֶרֶת
  choice: uma coroa de beleza
  rationale: Preserva a cadeia construta hebraica e a imagem poética, sem reduzi-la a um simples adjetivo.
- source_word: בְּיַד
  choice: na mão de
  rationale: Mantém a imagem concreta de algo precioso sustentado por Yahweh, em vez de substituí-la por uma ideia abstrata de poder.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: וְצָנִיף
  choice: e um turbante real
  rationale: צָנִיף designa uma peça de tecido enrolada na cabeça; “turbante” preserva essa imagem concreta e a distingue da coroa mencionada antes. “Real” expressa מְלוּכָה de modo natural.
- source_word: בְּכַף
  choice: na palma da mão de
  rationale: כַּף indica especificamente a palma ou concavidade da mão; a tradução conserva a variação poética em relação a יָד.
- source_word: אֱלֹהָיִךְ
  choice: seu Deus
  rationale: Embora a forma nominal seja morfologicamente plural, neste contexto designa no singular o Deus de Israel e leva sufixo feminino singular referente a Sião.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama. “Yahweh” preserva o nome pessoal do Deus de Israel, sem o substituir por um título.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla inteligibilidade internacional. A repetição de “mão” em “palma da mão” preserva a precisão da imagem hebraica e a variação poética entre יָד e כַּף.
