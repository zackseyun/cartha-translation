  text: כִּ֤י מְאַסְפָי/ו֙ יֹאכְלֻ֔/הוּ וְ/הִֽלְל֖וּ אֶת יְהוָ֑ה וּֽ/מְקַבְּצָ֥י/ו יִשְׁתֻּ֖/הוּ בְּ/חַצְר֥וֹת קָדְשִֽׁ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/009.yaml
  text: But those who gather it will eat it and praise Yahweh[b][a], and those who collect it will drink it in the courts of my sanctuary.
translation:
  language: pt
  text: Mas[a] os que o recolherem o comerão e louvarão Yahweh, e os que o ajuntarem o beberão nos pátios do meu santuário[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois os que o recolherem o comerão”; כִּי também pode significar “pois” ou “de fato”. Aqui, “mas” explicita o contraste com o versículo anterior.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “nos pátios do meu lugar santo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Mas
  rationale: No contexto, introduz contraste com a declaração do versículo anterior de que estrangeiros não consumiriam a colheita; a conjunção também pode ter valor causal ou enfático.
- source_word: מְאַסְפָיו
  choice: os que o recolherem
  rationale: O particípio designa aqueles que recolhem o produto da terra; o sufixo masculino singular retoma contextualmente o cereal do versículo anterior.
- source_word: יֹאכְלֻהוּ
  choice: o comerão
  rationale: Reproduz diretamente o verbo 'comer' e o pronome objetivo referente ao produto recolhido.
- source_word: וְהִלְלוּ אֶת־יְהוָה
  choice: e louvarão a Yahweh
  rationale: O piel de הלל significa 'louvar'. O futuro em português acompanha a projeção dos verbos hebraicos e o nome divino é transliterado como Yahweh.
- source_word: וּמְקַבְּצָיו
  choice: os que o ajuntarem
  rationale: Mantém o paralelismo com אסף, usando um verbo português distinto para קבץ; o referente contextual é o vinho mencionado no versículo anterior.
- source_word: יִשְׁתֻּהוּ
  choice: o beberão
  rationale: Expressa o sentido comum de שתה e conserva o sufixo objetivo, que no contexto remete ao vinho.
- source_word: בְּחַצְרוֹת
  choice: nos pátios
  rationale: חצרות designa pátios ou átrios delimitados; 'pátios' é claro e natural em português atual.
- source_word: קָדְשִׁי
  choice: do meu santuário
  rationale: Em combinação com 'pátios', o substantivo é entendido concretamente como o lugar santo pertencente a Deus, sem eliminar em nota a alternativa mais literal.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz explicitamente o Tetragrama; 'Yahweh' preserva o nome próprio sem substituí-lo por um título.
- issue: Sentido cultual de קָדְשִׁי
  choice: meu santuário
  alternative: meu lugar santo; minha santidade
  rationale: A menção dos pátios favorece o sentido concreto de espaço sagrado, embora a forma hebraica seja literalmente 'minha santidade' e permita 'meu lugar santo'.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Preserva o paralelismo por meio de “recolherem/ajuntarem” e “comerão/beberão”, bem como a primeira pessoa divina em “meu santuário”.
