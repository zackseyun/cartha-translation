source:
  edition: WLC
  text: עִבְר֤וּ עִבְרוּ֙ בַּ/שְּׁעָרִ֔ים פַּנּ֖וּ דֶּ֣רֶךְ הָ/עָ֑ם סֹ֣לּוּ סֹ֤לּוּ הַֽ/מְסִלָּה֙ סַקְּל֣וּ מֵ/אֶ֔בֶן הָרִ֥ימוּ נֵ֖ס עַל הָ/עַמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/010.yaml
  text: Pass through[a], pass through the gates; clear the way for the people. Build up, build up the highway; clear it of stones[c][b]. Raise up a banner over the peoples.
translation:
  language: pt
  text: Passem, passem pelos portões; desobstruam o caminho para o povo. Construam, construam a estrada; retirem dela as pedras. Ergam um estandarte[a] sobre os povos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: um sinal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרוּ עִבְרוּ
  choice: Passem, passem
  rationale: O imperativo repetido expressa movimento pelos portões; a repetição retórica do hebraico foi preservada.
- source_word: בַּשְּׁעָרִים
  choice: pelos portões
  rationale: A preposição e o substantivo, em ligação com o verbo anterior, indicam passagem pelos portões. Não se acrescenta “da cidade”, pois isso não está explícito.
- source_word: פַּנּוּ דֶּרֶךְ
  choice: desobstruam o caminho
  rationale: No piel, פנה pode indicar a remoção de obstáculos e a preparação de uma passagem. “Desobstruam” integra-se à imagem viária e distingue esta ordem das seguintes.
- source_word: הָעָם
  choice: o povo
  rationale: Mantém o coletivo singular, provavelmente referente ao povo de Sião no contexto.
- source_word: סֹלּוּ סֹלּוּ
  choice: Construam, construam
  rationale: Em contexto de estrada, סלל descreve a formação ou elevação de uma via. “Construam” é claro em português atual e preserva a repetição enfática.
- source_word: הַמְסִלָּה
  choice: a estrada
  rationale: מסלה designa uma via preparada, muitas vezes elevada. “Estrada” é natural e suficientemente abrangente; a ideia de construção já aparece no verbo.
- source_word: סַקְּלוּ מֵאֶבֶן
  choice: retirem dela as pedras
  rationale: O piel de סקל aqui significa limpar a via de pedras. “Dela” retoma explicitamente a estrada, como exige a fluência em português.
- source_word: הָרִימוּ נֵס
  choice: Ergam um estandarte
  rationale: נס pode ser um estandarte, sinal ou bandeira levantada em lugar visível. “Estandarte” preserva sua função pública e convocatória.
- source_word: עַל הָעַמִּים
  choice: sobre os povos
  rationale: Mantém o sentido espacial mais direto de על e o plural de עמים, sem reduzir os muitos povos a uma única nação.
theological_decisions:
- issue: Referência de “o povo” e “os povos”
  choice: Preservar a mudança do singular “o povo” para o plural “os povos”
  alternative: Entender as duas expressões como referência a Israel, ou ambas como referência geral às nações
  rationale: O hebraico distingue deliberadamente עָם, coletivo singular, de עַמִּים, plural. A tradução conserva a distinção e não determina além do texto como o estandarte se relaciona com as nações.
translation_notes:
  register: Português moderno, digno e acessível, com imperativos no plural e preservação das repetições enfáticas do hebraico. A formulação evita arcaísmos como “aterrai” ou “alteai” e não acrescenta referentes ausentes do texto.
