  text: עַל חוֹמֹתַ֣יִ/ךְ יְרוּשָׁלִַ֗ם הִפְקַ֨דְתִּי֙ שֹֽׁמְרִ֔ים כָּל הַ/יּ֧וֹם וְ/כָל הַ/לַּ֛יְלָה תָּמִ֖יד לֹ֣א יֶחֱשׁ֑וּ הַ/מַּזְכִּרִים֙ אֶת יְהוָ֔ה אַל דֳּמִ֖י לָ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/006.yaml
  text: On your walls[a], Jerusalem, I have appointed watchmen; all day and all night, continually, they will never be silent. You who remind Yahweh, take no rest for yourselves,
translation:
  language: pt
  text: Sobre as tuas muralhas, Jerusalém, designei sentinelas; todo o dia e toda a noite, continuamente, elas jamais se calarão. Vocês que fazem Yahweh lembrar-se[a], não deem descanso a si mesmos,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vocês que invocam Yahweh” ou “vocês que fazem menção de Yahweh”. A expressão hebraica é especialmente vívida e retrata um apelo persistente a Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹמֹתַיִךְ
  choice: suas muralhas
  rationale: חוֹמָה designa a muralha defensiva de uma cidade. “Muralhas” conserva com naturalidade a imagem urbana e militar no português.
- source_word: הִפְקַדְתִּי
  choice: coloquei
  rationale: O hifil de פקד pode significar nomear, encarregar ou posicionar. “Coloquei” expressa aqui o ato de pôr sentinelas em seus postos sem definir além do texto a natureza do encargo.
- source_word: שֹׁמְרִים
  choice: sentinelas
  rationale: O particípio de שמר descreve pessoas que vigiam. “Sentinelas” é atual, digno e adequado a pessoas posicionadas sobre muralhas.
- source_word: כָּל הַיּוֹם וְכָל הַלַּיְלָה תָּמִיד
  choice: o dia inteiro e a noite inteira, continuamente
  rationale: A formulação mantém os três elementos hebraicos e sua ênfase na vigilância ininterrupta.
- source_word: לֹא יֶחֱשׁוּ
  choice: jamais se calarão
  rationale: חשה significa ficar calado ou quieto. O imperfeito negado, reforçado pelo contexto de continuidade, indica que não cessarão de falar.
- source_word: הַמַּזְכִּרִים אֶת־יְהוָה
  choice: Vocês que fazem Yahweh lembrar-se
  rationale: O particípio hifil de זכר apresenta a imagem vívida de levar alguém a lembrar ou trazer algo à memória. A tradução conserva essa expressão incomum em vez de reduzi-la simplesmente a “invocar” ou “mencionar”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino é transliterado como “Yahweh”, preservando o nome pessoal presente no hebraico em vez de substituí-lo por um título.
- source_word: אַל דֳּמִי לָכֶם
  choice: não deem descanso a si mesmos
  rationale: דֳּמִי abrange silêncio, quietude ou repouso. Com לָכֶם, a frase exorta os destinatários a não concederem repouso a si mesmos, em paralelo com a fala incessante das sentinelas.
theological_decisions:
- issue: Identidade das sentinelas e daqueles que fazem Yahweh lembrar-se
  choice: Manter as figuras sem identificar os participantes de forma mais específica.
  alternative: Entendê-los como guardiões angelicais, profetas, sacerdotes ou intercessores humanos.
  rationale: O hebraico não especifica sua identidade. A tradução preserva a imagem e a exortação à persistência sem impor uma interpretação teológica particular.
- issue: Linguagem de fazer Yahweh lembrar-se
  choice: Preservar a linguagem ousada de fazer Yahweh lembrar-se.
  alternative: Suavizar como “vocês que invocam Yahweh” ou “vocês que mencionam Yahweh”.
  rationale: A construção hebraica admite usos relacionados a fazer menção, mas neste contexto retrata uma súplica persistente dirigida a Deus. Preservar a imagem mantém sua tensão retórica sem sugerir dogmaticamente que Deus seja esquecido.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. “Muralhas” e “sentinelas” mantêm o cenário poético. O feminino em “elas” retoma naturalmente “sentinelas”. A vírgula final foi preservada porque o versículo continua sintaticamente no seguinte.
