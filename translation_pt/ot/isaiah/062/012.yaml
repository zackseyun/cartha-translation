  yaml_path: translation/ot/isaiah/062/012.yaml
  text: And they will call them[a], “The holy people, the redeemed of Yahweh”; and you will be called, “Sought Out[c][b], a city not forsaken.”
translation:
  language: pt
  text: E os chamarão de “Povo Santo, Redimidos de Yahweh”; e você será chamada de “Procurada, Cidade Não Abandonada”.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְקָרְאוּ לָהֶם
  choice: E lhes chamarão
  rationale: Mantém o sujeito plural indefinido e reproduz de modo natural em português a fórmula hebraica de nomeação com ל.
- source_word: עַם הַקֹּדֶשׁ
  choice: O povo santo
  rationale: עם designa aqui um povo, e a construção definida favorece o título “O povo santo”.
- source_word: גְּאוּלֵי יְהוָה
  choice: os resgatados de Yahweh
  rationale: O particípio passivo em estado construto descreve os que foram resgatados e preserva sem resolver a relação genitiva com Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: וְלָךְ יִקָּרֵא
  choice: e você será chamada
  rationale: A forma passiva e o feminino singular referem-se à cidade personificada; “você” oferece legibilidade brasileira ampla.
- source_word: דְרוּשָׁה
  choice: Procurada
  rationale: Conserva a ideia central de דרשׁ, buscar ou procurar, e funciona como nome honorífico feminino da cidade.
- source_word: עִיר לֹא נֶעֱזָבָה
  choice: cidade não abandonada
  rationale: Expressa de maneira atual e digna a descrição apositiva, mantendo o contraste com a condição anterior de abandono.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico apresenta o nome próprio divino; a transliteração preserva essa distinção textual.
- issue: Relação expressa por גְּאוּלֵי יְהוָה
  choice: os resgatados de Yahweh
  alternative: os resgatados por Yahweh
  rationale: A formulação genitiva mantém a concisão e a possível amplitude do construto hebraico, sem explicitar exclusivamente agência ou posse.
translation_notes:
  register: Português moderno, digno e acessível, com preferência por formas naturais no Brasil sem regionalismos marcados. A repetição de “chamar” preserva o paralelismo lexical; as iniciais maiúsculas indicam títulos dados ao povo e à cidade.
