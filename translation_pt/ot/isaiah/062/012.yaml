revisions:
- from: 'E lhes chamarão: “O povo santo, os resgatados de Yahweh”; e você será chamada: “Procurada[a], cidade não abandonada”.'
  to: E os chamarão de “Povo Santo, Redimidos de Yahweh”; e você será chamada de “Procurada, Cidade Não Abandonada”.
  rationale: A correção resolve a regência portuguesa da fórmula de nomeação, substitui “resgatados” por “redimidos” para maior proximidade lexical com גְּאוּלֵי e ajusta a nota para alternativas que não ampliam o sentido do hebraico. A capitalização trata as expressões como nomes honoríficos no oráculo.
