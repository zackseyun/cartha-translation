review_pass:
  verdict: revise
  source_fidelity: A estrutura de nomeação, a referência plural ao povo e a referência feminina singular a Sião/Jerusalém estão corretamente reconhecidas. No entanto, “lhes chamarão” não reproduz adequadamente em português a regência de chamar no sentido de dar um nome; o objeto nomeado deve ser direto (“os chamarão de”). “Redimidos” é também o equivalente mais direto e estabelecido para גְּאוּלֵי, em vez de “resgatados”.
  naturalness: A revisão usa a construção idiomática portuguesa “chamar alguém de” e mantém um registro moderno, solene e claro para leitores internacionais, com boa legibilidade brasileira. A ligação por vírgula dentro do segundo nome reflete melhor a aposição hebraica do que dois segmentos separados por dois-pontos.
  terminology: “Yahweh” preserva o tetragrama. “Povo Santo” e “Redimidos de Yahweh” representam adequadamente os títulos e o construto hebraico. “Procurada” mantém a ambiguidade lexical de דְרוּשָׁה; a nota apresenta “Buscada” como alternativa sem introduzir a intensificação não expressa em “Muito procurada”.
  issues:
  - severity: medium
    issue: Regência inadequada em “lhes chamarão”.
    rationale: 'Em português moderno, quando chamar significa atribuir um nome, a pessoa ou grupo nomeado funciona normalmente como objeto direto: “os chamarão de...”, não “lhes chamarão”.'
  - severity: low
    issue: “Resgatados” é menos preciso que “Redimidos” para גְּאוּלֵי.
    rationale: Embora “resgatados” seja semanticamente próximo, “redimidos” traduz mais diretamente o particípio de גאל e preserva a terminologia bíblica de redenção sem acrescentar explicação.
  - severity: low
    issue: A nota inclui “Muito procurada”, que acrescenta intensidade ausente no hebraico.
    rationale: דרשׁ exprime buscar/procurar, mas o texto não contém modificador que justifique “muito”.
  revised_text: E os chamarão de “Povo Santo, Redimidos de Yahweh”; e você será chamada de “Procurada, Cidade Não Abandonada”.
  revised_footnotes:
  - marker: a
    text: Também pode ser traduzido por “Buscada” ou “Sought After”.
    reason: lexical_alternative
  revision_rationale: A correção resolve a regência portuguesa da fórmula de nomeação, substitui “resgatados” por “redimidos” para maior proximidade lexical com גְּאוּלֵי e ajusta a nota para alternativas que não ampliam o sentido do hebraico. A capitalização trata as expressões como nomes honoríficos no oráculo.
