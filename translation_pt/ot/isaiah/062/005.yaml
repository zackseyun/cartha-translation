  text: כִּֽי יִבְעַ֤ל בָּחוּר֙ בְּתוּלָ֔ה יִבְעָל֖וּ/ךְ בָּנָ֑יִ/ךְ וּ/מְשׂ֤וֹשׂ חָתָן֙ עַל כַּלָּ֔ה יָשִׂ֥ישׂ עָלַ֖יִ/ךְ אֱלֹהָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/062/005.yaml
  text: For as a young man marries a virgin[a], so your sons will marry you; and as a bridegroom rejoices over a bride, so your God will rejoice over you.
translation:
  language: pt
  text: Pois, assim como um jovem se casa com uma virgem, seus filhos[a] se casarão com você; e, assim como o noivo se alegra com a noiva, seu Deus se alegrará com você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conforme uma leitura alternativa refletida em algumas versões antigas e adotada por muitos intérpretes: “seu construtor se casará com você” ou “seus construtores se casarão com você”. O Texto Massorético traz “seus filhos”.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִבְעַל
  choice: se casa com
  rationale: Neste contexto matrimonial, o verbo בעל indica tomar alguém em casamento. “Casar-se com” comunica o sentido de modo natural, sem introduzir conotações indevidas de posse ou domínio.
- source_word: בָּחוּר
  choice: jovem
  rationale: O termo designa aqui um homem jovem em idade de se casar; “jovem” é claro e natural em português.
- source_word: בְּתוּלָה
  choice: virgem
  rationale: Preserva a especificidade lexical do hebraico no contexto da comparação matrimonial.
- source_word: יִבְעָלוּךְ
  choice: se casarão com você
  rationale: Mantém a linguagem matrimonial do mesmo verbo usado na primeira comparação e conserva a personificação feminina de Sião/Jerusalém.
- source_word: בָּנָיִךְ
  choice: seus filhos
  rationale: Segue a vocalização do Texto Massorético. Embora a imagem seja incomum, ela é inteligível dentro da personificação profética; a leitura alternativa é registrada em nota.
- source_word: מְשׂוֹשׂ חָתָן
  choice: assim como o noivo se alegra
  rationale: A construção nominal hebraica exprime a alegria do noivo; a formulação verbal produz português claro e preserva o paralelismo.
- source_word: כַּלָּה
  choice: noiva
  rationale: É o equivalente corrente e exato no contexto matrimonial.
- source_word: יָשִׂישׂ
  choice: se alegrará
  rationale: Expressa alegria intensa de modo natural e digno, além de manter a correspondência verbal com a comparação anterior.
- source_word: אֱלֹהָיִךְ
  choice: seu Deus
  rationale: Embora אֱלֹהִים tenha forma plural, aqui designa inequivocamente o Deus de Israel e rege sentido singular.
- source_word: כִּי
  choice: Pois, assim como...
  rationale: Introduz a explicação comparativa e liga o versículo ao contexto anterior.
theological_decisions:
- issue: Leitura de בָּנָיִךְ como “seus filhos” ou como “seu construtor/seus construtores”
  choice: seus filhos
  alternative: seu construtor ou seus construtores
  rationale: A tradução principal segue a vocalização massorética, sem corrigir silenciosamente a imagem profética incomum. A leitura alternativa, apoiada por algumas versões antigas e por muitos intérpretes, é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. A repetição de “assim como” e “se alegrar” preserva o paralelismo hebraico. O tratamento por “você” torna explícita e acessível a personificação feminina de Sião/Jerusalém.
