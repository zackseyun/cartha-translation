id: ISA.42.18
reference: Isaiah 42:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַ/חֵרְשִׁ֖ים שְׁמָ֑עוּ וְ/הַ/עִוְרִ֖ים הַבִּ֥יטוּ לִ/רְאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/018.yaml
  text: Hear[a], you deaf; and look, you blind[b], that you may see.
translation:
  language: pt
  text: Surdos, escutem[a]; cegos, olhem, para que vejam[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Os surdos escutem, e os cegos olhem”. Os adjetivos hebraicos com artigo podem ser entendidos como chamados diretos (“Surdos... cegos...”) ou como substantivos (“os surdos... os cegos”).'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para ver”. A expressão final indica a finalidade: “olhem, para que vejam”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֵרְשִׁים
  choice: Surdos
  rationale: O adjetivo com artigo é entendido como vocativo no contexto. Em português, o substantivo adjetival sem artigo funciona naturalmente como chamado direto e preserva a força profética.
- source_word: שְׁמָעוּ
  choice: escutem
  rationale: O imperativo plural de שׁמע exige uma convocação direta. “Escutem” expressa atenção intencional de modo mais natural em português atual, sem perder o sentido auditivo concreto.
- source_word: וְהַעִוְרִים
  choice: cegos
  rationale: O segundo adjetivo articulado é igualmente lido como vocativo, em paralelo com “Surdos”. O sentido nominal alternativo é registrado em nota.
- source_word: הַבִּיטוּ
  choice: olhem
  rationale: O imperativo hifil de נבט indica dirigir o olhar. “Olhem” é claro, atual e mantém o paralelismo com “escutem”.
- source_word: לִרְאוֹת
  choice: para que vejam
  rationale: O infinitivo com ל após o imperativo expressa finalidade ou resultado pretendido. “Para que vejam” comunica essa relação com naturalidade.
theological_decisions:
- issue: Se “surdos” e “cegos” devem ser traduzidos literalmente ou explicados como insensibilidade espiritual
  choice: Manter os termos sensoriais concretos “surdos” e “cegos” no texto principal
  alternative: Traduzir como “insensíveis” ou explicitar “espiritualmente surdos e cegos”
  rationale: Embora o contexto lhes confira força metafórica, o hebraico preserva imagens sensoriais concretas. A tradução não deve antecipar nem limitar a interpretação contextual.
- issue: Vocativo ou descrição substantivada dos adjetivos articulados
  choice: 'Ler como vocativos: “Surdos... cegos...”'
  alternative: 'Ler como sujeitos substantivados: “Os surdos... os cegos...”'
  rationale: Os imperativos favorecem o chamado direto, mas a forma hebraica admite formalmente a leitura substantivada; por isso, a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção concisa conserva os imperativos paralelos e o paradoxo deliberado de ordenar aos surdos que escutem e aos cegos que olhem.
