  text: יְהוָ֥ה חָפֵ֖ץ לְמַ֣עַן צִדְק֑/וֹ יַגְדִּ֥יל תּוֹרָ֖ה וְ/יַאְדִּֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/021.yaml
  text: Yahweh was pleased[a], for the sake of his righteousness[c][b], to make the law great and glorious.
translation:
  language: pt
  text: Yahweh se agradou, por causa da sua justiça, de tornar grande e gloriosa a lei.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por causa da sua retidão”.'
    reason: alternative_reading
  - marker: b
    text: Hebraico torá; também pode significar “instrução” ou “ensino”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: חָפֵץ
  choice: se agradou
  rationale: Expressa de modo natural tanto a disposição favorável quanto a vontade de Yahweh, sem intensificar o verbo para “deleitou-se”.
- source_word: לְמַעַן
  choice: por causa de
  rationale: Introduz o motivo da ação divina e mantém uma formulação clara em português; a locução também pode assumir nuance de finalidade ou interesse conforme o contexto.
- source_word: צִדְקוֹ
  choice: sua justiça
  rationale: “Justiça” comunica de modo natural o campo moral e judicial de צדק neste contexto, sem limitar a expressão a uma decisão jurídica específica.
- source_word: יַגְדִּיל
  choice: tornar grande
  rationale: Reproduz o valor causativo do hifil de גדל.
- source_word: תּוֹרָה
  choice: a lei
  rationale: Mantém a força pactual e jurídica reconhecível do termo, enquanto a amplitude lexical “instrução” ou “ensino” é registrada em nota.
- source_word: וְיַאְדִּיר
  choice: e gloriosa
  rationale: Em coordenação com “tornar”, comunica de forma natural o sentido causativo de fazer a lei gloriosa ou majestosa, sem repetição desnecessária.
theological_decisions:
- issue: Sentido de צִדְקוֹ em relação à ação de Yahweh
  choice: sua justiça
  alternative: sua retidão
  rationale: “Justiça” preserva a dimensão moral e judicial do termo; “retidão” continua sendo uma leitura legítima e mais ampla, por isso é indicada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A coordenação “tornar grande e gloriosa” preserva os dois verbos causativos hebraicos de maneira idiomática.
