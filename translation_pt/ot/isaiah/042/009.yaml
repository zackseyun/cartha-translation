  text: הָ/רִֽאשֹׁנ֖וֹת הִנֵּה בָ֑אוּ וַֽ/חֲדָשׁוֹת֙ אֲנִ֣י מַגִּ֔יד בְּ/טֶ֥רֶם תִּצְמַ֖חְנָה אַשְׁמִ֥יע אֶתְ/כֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/009.yaml
  text: Behold[a], the former things have come to pass, and I declare new things; before they spring up[c][b], I announce them to you.
translation:
  language: pt
  text: 'Vejam: as coisas anteriores aconteceram, e anuncio coisas novas. Antes que brotem[a], eu as farei saber a vocês.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “surjam”. O verbo hebraico significa literalmente “brotar” e retrata acontecimentos ainda não visíveis por meio da imagem do crescimento de uma planta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִאשֹׁנוֹת
  choice: as coisas anteriores
  rationale: O adjetivo plural substantivado contrasta com “coisas novas”. “Anteriores” é natural em português e não sugere necessariamente que sejam as primeiras em sentido absoluto.
- source_word: הִנֵּה
  choice: Vejam
  rationale: A interjeição chama a atenção dos ouvintes. O plural é adequado porque o versículo se dirige a um grupo, como mostra אֶתְכֶם.
- source_word: בָאוּ
  choice: aconteceram
  rationale: Embora o verbo signifique literalmente “vieram”, neste contexto refere-se a fatos que ocorreram, provavelmente em cumprimento do que fora anunciado.
- source_word: חֲדָשׁוֹת
  choice: coisas novas
  rationale: Mantém o paralelismo conciso com “coisas anteriores” sem especificar indevidamente se são acontecimentos, atos ou assuntos.
- source_word: מַגִּיד
  choice: anuncio
  rationale: O particípio hifil expressa o ato de tornar conhecido ou declarar. “Anuncio” é claro e apropriado à fala profética.
- source_word: בְּטֶרֶם
  choice: Antes que
  rationale: Expressa de maneira natural em português a relação temporal anterior ao surgimento das coisas novas.
- source_word: תִּצְמַחְנָה
  choice: brotem
  rationale: Preserva a imagem vegetal do verbo hebraico, que apresenta os acontecimentos como algo que começa a surgir e se tornar visível.
- source_word: אַשְׁמִיעַ אֶתְכֶם
  choice: eu as farei ouvir a vocês
  rationale: Conserva a força causativa do hifil de שמע (“fazer ouvir”) e explicita pelo pronome “as” o objeto contextual, as coisas novas. “A vocês” evita regionalismo excessivo e mantém ampla inteligibilidade.
theological_decisions:
- issue: Relação entre profecia e cumprimento
  choice: Traduzir בָאוּ como “aconteceram”, deixando o contexto indicar que as coisas anteriores se realizaram após terem sido anunciadas.
  alternative: “vieram” ou “se cumpriram”
  rationale: “Aconteceram” comunica o sentido contextual sem inserir explicitamente “se cumpriram”, enquanto a sequência entre coisas anteriores e novos anúncios preserva a ênfase na capacidade divina de anunciar antecipadamente.
translation_notes:
  register: Português moderno, digno e de leitura ampla. “Vejam” reproduz o chamado de atenção dirigido ao grupo; “brotem” mantém a metáfora hebraica. A formulação preserva a tensão entre linguagem idiomática (“aconteceram”) e expressão causativa mais formal (“farei ouvir”).
