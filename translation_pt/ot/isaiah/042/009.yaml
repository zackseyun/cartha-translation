    rationale: O hebraico coordena “as coisas anteriores” e “coisas novas”, mas não contém um advérbio equivalente a “agora”. A omissão preserva melhor a concisão e a abertura temporal do original.
  - severity: medium
    issue: “Eu as farei ouvir a vocês” é pouco natural em português
    rationale: Embora reflita literalmente o causativo de שמע, no contexto o verbo significa fazer saber ou anunciar. “Eu as farei saber a vocês” é idiomático e conserva o sentido de comunicação antecipada.
