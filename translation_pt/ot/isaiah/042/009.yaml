  source_fidelity: A tradução transmite adequadamente o contraste entre as coisas anteriores que ocorreram e as coisas novas que Deus dá a conhecer antes de surgirem. Contudo, “agora” não está expresso no hebraico e introduz uma delimitação temporal desnecessária. A expressão final “eu as farei ouvir a vocês” é excessivamente literal e pouco idiomática em português; o hifil de שמע aqui tem sentido comunicativo, de fazer saber/anunciar.
  naturalness: “Vejam” e “coisas anteriores/coisas novas” são claros e adequados ao registro profético moderno. “Eu as farei saber a vocês” preserva de modo natural o valor causativo-comunicativo do hebraico, ao contrário de “farei ouvir”, que soa artificial.
  terminology: “Coisas anteriores”, “coisas novas”, “anuncio” e “brotarem” mantêm bem o paralelismo e a imagem vegetal do texto hebraico. Não é necessário explicitar cumprimento profético nem especificar a natureza das “coisas”.
  issues:
