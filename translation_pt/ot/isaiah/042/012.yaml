reference: Isaiah 42:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יָשִׂ֥ימוּ לַֽ/יהוָ֖ה כָּב֑וֹד וּ/תְהִלָּת֖/וֹ בָּ/אִיִּ֥ים יַגִּֽידוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/012.yaml
  text: Let them give glory to Yahweh[c][b][a], and let them declare his praise in the coastlands.
translation:
  language: pt
  text: Que deem glória a Yahweh[a] e anunciem o seu louvor nas terras costeiras.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido por “o SENHOR”.'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “nas ilhas”. Em Isaías, o termo pode designar de modo mais amplo ilhas, litorais e terras marítimas distantes.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׂימוּ
  choice: deem
  rationale: O verbo שׂים significa literalmente “pôr/colocar”, mas, construído com כָּבוֹד e לַיהוָה, forma a expressão idiomática “dar/atribuir glória”. “Deem” é natural em português e conserva a força volitiva do hebraico.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição לְ marca o destinatário, e o nome divino יהוה é transliterado como “Yahweh”, preservando o nome pactual presente no texto hebraico.
- source_word: כָּבוֹד
  choice: glória
  rationale: כָּבוֹד pode significar “glória” ou “honra”; no contexto de louvor dirigido a Deus, “glória” é a escolha mais adequada e mantém o paralelismo poético.
- source_word: וּתְהִלָּתוֹ
  choice: e ... o seu louvor
  rationale: תְּהִלָּה significa “louvor”, e o sufixo masculino singular indica “seu/dele”. A formulação preserva o paralelismo com “glória” sem explicitar além do hebraico se é louvor dado a ele ou renome que lhe pertence.
- source_word: בָּאִיִּים
  choice: nas terras costeiras
  rationale: אִיִּים significa literalmente “ilhas”, mas em Isaías designa com frequência regiões marítimas distantes, incluindo ilhas e litorais. “Terras costeiras” comunica esse alcance geográfico mais amplo.
- source_word: יַגִּידוּ
  choice: anunciem
  rationale: O hifil de נגד significa “declarar, anunciar, tornar conhecido”. “Anunciem” é claro, público e poeticamente adequado, preservando a forma volitiva coordenada com o primeiro verbo.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” o apresenta como nome próprio, sem substituí-lo por um título; a nota registra a tradução tradicional.
- issue: Sentido de “seu louvor”
  choice: preservar a formulação possessiva
  alternative: “o louvor devido a ele” ou “a sua fama”
  rationale: O sufixo hebraico permite entender o louvor como pertencente a Yahweh, devido a ele ou como seu renome. “O seu louvor” conserva essa tensão sem impor uma explicação teológica.
translation_notes:
  register: Português moderno, digno e de leitura natural, com cadência poética. A construção “Que deem... e anunciem...” reproduz a força exortativa dos verbos hebraicos. “Terras costeiras” evita limitar o referente a ilhas literais, e as notas mantêm visíveis as principais alternativas lexicais e a forma tradicional do nome divino.
