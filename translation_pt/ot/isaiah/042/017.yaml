  text: נָסֹ֤גוּ אָחוֹר֙ יֵבֹ֣שׁוּ בֹ֔שֶׁת הַ/בֹּטְחִ֖ים בַּ/פָּ֑סֶל הָ/אֹמְרִ֥ים לְ/מַסֵּכָ֖ה אַתֶּ֥ם אֱלֹהֵֽי/נוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/017.yaml
  text: They will be turned back[a]; they will be utterly put to shame—those who trust in an idol, who say to a cast image[d][c][b], “You are our gods.”
translation:
  language: pt
  text: 'Retrocederão[a] e ficarão totalmente envergonhados[b] os que confiam num ídolo[c] e dizem a uma imagem fundida: “Vocês são os nossos deuses.”[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “voltarão para trás” ou “serão repelidos”; o verbo hebraico pode indicar voltar, recuar ou ser forçado a retroceder.
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “ficarão envergonhados de vergonha”, uma construção enfática que expressa vergonha completa.
    reason: lexical_alternative
  - marker: c
    text: 'Ou “imagem esculpida”. O hebraico emprega dois termos distintos para objetos de culto fabricados: um ídolo, geralmente uma imagem esculpida, e uma imagem fundida.'
    reason: lexical_alternative
  - marker: d
    text: O hebraico diz “Vocês são os nossos deuses”, com pronome e substantivo no plural; algumas traduções ajustam a frase para o singular, “Tu és o nosso deus”.
    reason: alternative_reading
lexical_decisions:
- source_word: נָסֹגוּ אָחוֹר
  choice: Voltarão para trás
  rationale: A forma verbal נָסֹגוּ pode indicar recuar, voltar ou ser repelido. No contexto de anúncio de juízo, o futuro em português é adequado; a formulação preserva a direção expressa por אָחוֹר sem decidir de modo rígido entre recuo voluntário e derrota imposta.
- source_word: יֵבֹשׁוּ בֹשֶׁת
  choice: ficarão totalmente envergonhados
  rationale: A combinação do verbo בוש com o substantivo cognato בֹשֶׁת intensifica a vergonha. “Totalmente” comunica essa ênfase em português natural, sem reproduzir literalmente a construção redundante.
- source_word: הַבֹּטְחִים
  choice: os que confiam
  rationale: O particípio substantivado descreve uma classe de pessoas caracterizada por depositar confiança no objeto de culto.
- source_word: בַּפָּסֶל
  choice: num ídolo
  rationale: פֶּסֶל designa uma imagem fabricada para culto, muitas vezes esculpida. “Ídolo” comunica com clareza sua função religiosa, enquanto a nota preserva a nuance material.
- source_word: הָאֹמְרִים לְמַסֵּכָה
  choice: os que dizem a uma imagem fundida
  rationale: מַסֵּכָה refere-se normalmente a uma imagem produzida por fundição. “Imagem fundida” distingue este termo de פֶּסֶל e mantém a referência ao modo de fabricação.
- source_word: אַתֶּם אֱלֹהֵינוּ
  choice: Vocês são os nossos deuses
  rationale: Tanto o pronome אַתֶּם como o substantivo אֱלֹהֵינוּ têm forma plural. O plural explícito deve ser preservado, ainda que algumas traduções o ajustem ao singular por fluência.
theological_decisions:
- issue: Distinção entre פֶּסֶל e מַסֵּכָה
  choice: “ídolo” e “imagem fundida”
  alternative: “imagem esculpida” e “imagem fundida”, ou “ídolo” para ambos
  rationale: O texto emprega dois termos diferentes para objetos manufaturados de culto. A tradução mantém a distinção sem obscurecer a função idolátrica de פֶּסֶל.
- issue: Número gramatical em אֱלֹהֵינוּ
  choice: 'Manter o plural: “nossos deuses”'
  alternative: 'Regularizar para o singular: “nosso deus”'
  rationale: O hebraico apresenta pronome e substantivo no plural. Preservar esse dado evita resolver uma possível tensão retórica ou referencial que o texto não explica.
- issue: Voz e nuance de נָסֹגוּ
  choice: 'Formulação relativamente aberta: “Voltarão para trás”'
  alternative: “Serão repelidos” ou “recuarão”
  rationale: O verbo pode descrever tanto recuo como ser forçado a voltar. A opção principal conserva a ambiguidade básica, explicitada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. O travessão destaca a identificação dos que sofrem a vergonha. “Num” é natural no registro corrente; “imagem fundida” preserva a precisão técnica sem soar excessivamente especializada.
