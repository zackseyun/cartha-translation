  text: ראית רַבּ֖וֹת וְ/לֹ֣א תִשְׁמֹ֑ר פָּק֥וֹחַ אָזְנַ֖יִם וְ/לֹ֥א יִשְׁמָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/020.yaml
  text: You have seen many things[a], but you do not observe; his ears are open, but he does not hear.
translation:
  language: pt
  text: Você viu muitas coisas[a], mas não presta atenção; os ouvidos dele estão abertos, mas ele não ouve.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico passa de “você”, na primeira metade do versículo, para “ele”, no verbo final. A expressão “ouvidos abertos” não traz pronome possessivo explícito; “dele” é uma explicitação idiomática em português. Algumas traduções uniformizam tudo como “seus/você”.
    reason: alternative_reading
lexical_decisions:
- source_word: ראית
  choice: Você viu
  rationale: O qal perfeito na segunda pessoa masculina singular indica uma ação contemplada como realizada. “Você viu” preserva o aspecto e mantém a repreensão dirigida ao servo/povo no singular.
- source_word: רַבּוֹת
  choice: muitas coisas
  rationale: O adjetivo feminino plural é empregado substantivamente; “muitas coisas” é a formulação mais natural em português.
- source_word: וְלֹא תִשְׁמֹר
  choice: mas não presta atenção
  rationale: שׁמר pode significar guardar, observar ou atentar. Neste paralelo sobre ver sem responder, “não presta atenção” comunica de modo natural a falta de consideração vigilante, sem repetir simplesmente o verbo “ver”.
- source_word: פָּקוֹחַ אָזְנַיִם
  choice: os ouvidos dele estão abertos
  rationale: פָּקוֹחַ descreve o estado resultante de estar aberto, e אָזְנַיִם é o dual “ouvidos”. O pronome “dele” torna a frase idiomática em português e acompanha o verbo posterior na terceira pessoa.
- source_word: וְלֹא יִשְׁמָע
  choice: mas ele não ouve
  rationale: O qal imperfeito na terceira pessoa masculina singular sustenta a descrição habitual ou presente. “Ouve” preserva a imagem sensorial e a mudança de pessoa gramatical do hebraico.
theological_decisions:
- issue: Mudança de pessoa gramatical dentro do versículo
  choice: Manter a passagem da segunda pessoa (“Você viu... não presta”) para a terceira (“dele... ele não ouve”).
  alternative: 'Uniformizar o versículo na segunda pessoa: “seus ouvidos estão abertos, mas você não ouve”.'
  rationale: O Texto Massorético apresenta uma mudança real da segunda para a terceira pessoa. Mantê-la preserva a forma retórica e a tensão do texto, sem harmonização interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Presta atenção” é corrente e natural, enquanto a mudança deliberada de pessoa gramatical preserva a peculiaridade do hebraico.
