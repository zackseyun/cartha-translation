id: ISA.42.4
reference: Isaiah 42:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לֹ֤א יִכְהֶה֙ וְ/לֹ֣א יָר֔וּץ עַד יָשִׂ֥ים בָּ/אָ֖רֶץ מִשְׁפָּ֑ט וּ/לְ/תוֹרָת֖/וֹ אִיִּ֥ים יְיַחֵֽילוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/004.yaml
  text: He will not grow dim or be crushed until he establishes justice in the earth[a], and the coastlands will wait for his instruction.
translation:
  language: pt
  text: Ele não perderá o brilho nem será esmagado até estabelecer a justiça na terra; e as terras costeiras esperarão[a] por sua instrução.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “terão esperança em sua instrução”. O verbo hebraico expressa uma espera marcada por expectativa confiante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִכְהֶה
  choice: perderá o brilho
  rationale: O verbo כהה indica tornar-se opaco, perder o brilho ou enfraquecer. A formulação preserva a imagem da luz que perde a intensidade e sua ligação com o pavio do versículo anterior, sem reduzi-la simplesmente a desânimo.
- source_word: יָרוּץ
  choice: será esmagado
  rationale: O verbo רצץ significa esmagar ou quebrar. “Será esmagado” conserva a ligação lexical com a cana esmagada do versículo anterior.
- source_word: עַד יָשִׂים
  choice: até estabelecer
  rationale: Embora שׂים signifique literalmente pôr ou colocar, com מִשְׁפָּט comunica naturalmente a ideia de implantar ou estabelecer a justiça.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: אֶרֶץ pode designar tanto uma terra específica como toda a terra. A referência subsequente às terras costeiras favorece aqui o horizonte mais amplo, sem eliminar a ambiguidade lexical do substantivo.
- source_word: מִשְׁפָּט
  choice: a justiça
  rationale: Neste contexto profético, מִשְׁפָּט designa a ordem justa ou a prática da justiça, e não apenas uma sentença judicial.
- source_word: לְתוֹרָתוֹ
  choice: por sua instrução
  rationale: תּוֹרָה abrange instrução e ensino, não somente legislação. “Instrução” mantém essa amplitude e também o peso normativo do termo.
- source_word: אִיִּים
  choice: as terras costeiras
  rationale: Na literatura profética, אִיִּים frequentemente se refere a ilhas, litorais e terras marítimas distantes. “Terras costeiras” expressa essa abrangência melhor do que o sentido estrito de “ilhas”.
- source_word: יְיַחֵילוּ
  choice: esperarão
  rationale: O verbo יחל no piel comunica espera acompanhada de expectativa ou esperança. “Esperarão” mantém a ação verbal, enquanto a nota registra explicitamente a nuance de esperança.
theological_decisions:
- issue: Alcance da missão do servo
  choice: alcance universal sugerido por “terra” e “terras costeiras”
  alternative: referência primária à terra de Israel, com implicações mais amplas
  rationale: A combinação de אֶרֶץ com אִיִּים aponta para um horizonte que ultrapassa Israel. A tradução reflete esse alcance sem acrescentar conclusões teológicas posteriores ao texto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva as imagens ligadas ao versículo anterior, mantém “instrução” para a amplitude de torá e posiciona a nota junto ao verbo a que ela se refere.
