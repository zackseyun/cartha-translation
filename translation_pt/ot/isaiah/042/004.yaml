  terminology: “Justiça” para משפט e “instrução” para תורה são escolhas terminologicamente sólidas e não impõem uma leitura doutrinária posterior. A nota explica de modo fiel a nuance expectante de ייחלו e está corretamente ancorada no verbo relevante.
