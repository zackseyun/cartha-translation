  source_fidelity: 'A tradução representa com precisão os principais elementos do hebraico: preserva a imagem de não se tornar apagado/perder o brilho (יכהה), mantém a ligação com רצץ em “será esmagado”, traduz משפט adequadamente por “justiça” e conserva o horizonte amplo de הארץ e איים. “Sua instrução” comunica bem o alcance de תורה neste contexto.'
