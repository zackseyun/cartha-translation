base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/002.yaml
  text: He will not cry out or raise his voice[a], or make his voice heard in the street.
translation:
  language: pt
  text: Não gritará, nem levantará a voz[a], nem fará ouvir a sua voz na rua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Não grita nem levanta a voz, nem faz ouvir a sua voz fora».'
    reason: 'Alternativa aspectual: os imperfeitos hebraicos também podem descrever uma ação habitual no presente; «fora» traduz o sentido mais amplo de espaço exterior ou público em בַּחוּץ.'
lexical_decisions:
- source_word: יִצְעַק
  choice: gritará
  rationale: צעק indica clamar ou gritar em voz alta; no paralelismo, «gritará» comunica de modo natural a conduta pública contida do servo, sem acrescentar necessariamente a ideia de angústia.
- source_word: יִשָּׂא
  choice: levantará a voz
  rationale: נשׂא significa literalmente «levantar»; aqui, a menção subsequente da voz permite suprir o objeto elíptico e entender a expressão como «levantar a voz».
- source_word: יַשְׁמִיעַ
  choice: fará sua voz ser ouvida
  rationale: O hifil de שׁמע tem valor causativo, «fazer ouvir» ou «fazer ser ouvido». A formulação preserva esse valor sem transformar a ação em simples proclamação.
- source_word: בַּחוּץ
  choice: na rua
  rationale: חוּץ designa o espaço exterior ou público e, neste contexto de manifestação audível, «na rua» expressa com naturalidade a cena.
- source_word: קוֹלוֹ
  choice: sua voz
  rationale: קוֹל significa «voz» neste contexto. A repetição mantém o foco do hebraico e esclarece a relação com os dois últimos verbos.
- source_word: לֹא ... וְלֹא ... וְלֹא
  choice: não ... nem ... nem
  rationale: A sequência reproduz as três negações coordenadas com ritmo natural em português.
theological_decisions:
- issue: Valor temporal e aspectual dos verbos no imperfeito na descrição do servo
  choice: futuro descritivo («Não gritará...» )
  alternative: presente habitual («Não grita...» )
  rationale: No retrato profético e programático de Isaías 42, o futuro descreve adequadamente a atuação característica do servo, embora o hebraico também permita uma leitura habitual.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e inteligibilidade internacional. Mantém-se o paralelismo poético e a ambiguidade aspectual é registrada em nota.
