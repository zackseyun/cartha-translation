  text: אֲנִ֧י יְהוָ֛ה קְרָאתִ֥י/ךָֽ בְ/צֶ֖דֶק וְ/אַחְזֵ֣ק בְּ/יָדֶ֑/ךָ וְ/אֶצָּרְ/ךָ֗ וְ/אֶתֶּנְ/ךָ֛ לִ/בְרִ֥ית עָ֖ם לְ/א֥וֹר גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/006.yaml
  text: I am Yahweh[a]; I have called you in righteousness, and I will take hold of your hand; I will keep you and give you as a covenant for the people[c][b], as a light for the nations.
translation:
  language: pt
  text: Eu sou Yahweh; eu o chamei em justiça[a], segurarei a sua mão, guardarei você e farei de você uma aliança para o povo[b], uma luz para as nações[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em retidão”. O hebraico צֶדֶק pode expressar justiça ou retidão.
    reason: lexical_alternative
  - marker: b
    text: Ou “uma aliança para um povo”. O hebraico não traz artigo antes de “povo”; no contexto, a expressão provavelmente se refere a Israel.
    reason: textual_ambiguity
  - marker: c
    text: Ou “uma luz para os gentios”. O termo hebraico גּוֹיִם significa “nações” e, em certos contextos, designa os povos não israelitas.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: קְרָאתִיךָ
  choice: eu o chamei
  rationale: O perfeito hebraico apresenta o chamado como ato realizado; o pretérito perfeito é natural em português e adequado ao contexto de comissão.
- source_word: בְצֶדֶק
  choice: em justiça
  rationale: Mantém a forma nominal e uma amplitude semântica que inclui retidão e justiça, sem limitar indevidamente o sentido.
- source_word: וְאַחְזֵק בְּיָדֶךָ
  choice: segurarei a sua mão
  rationale: Conserva a imagem concreta de apoio divino expressa pelo verbo חזק com 'mão', em português atual e natural.
- source_word: וְאֶצָּרְךָ
  choice: guardarei você
  rationale: נצר comunica guardar, proteger ou preservar; 'guardarei você' é direto, claro e lexicalmente próximo.
- source_word: וְאֶתֶּנְךָ
  choice: farei de você
  rationale: Neste contexto, נתן designa a destinação do servo a uma função. A construção portuguesa evita a estranheza de 'darei você' sem reduzir a expressão a 'mediador'.
- source_word: לִבְרִית עָם
  choice: uma aliança para o povo
  rationale: Preserva a identificação marcante do servo com a aliança e mantém עָם como coletivo provavelmente referente a Israel.
- source_word: לְאוֹר גּוֹיִם
  choice: uma luz para as nações
  rationale: Mantém a metáfora de luz e traduz גּוֹיִם de forma ampla, sem impor o sentido mais técnico de 'gentios'.
theological_decisions:
- issue: A função do servo como לִבְרִית עָם
  choice: farei de você uma aliança para o povo
  alternative: farei de você o mediador de uma aliança para o povo
  rationale: O hebraico apresenta a própria pessoa interpelada como aliança em sentido funcional ou representativo. A tradução mantém essa tensão teológica, sem explicá-la por meio de uma função mais estreita.
- issue: Contraste entre עָם e גּוֹיִם
  choice: o povo ... as nações
  alternative: um povo ... os gentios
  rationale: A formulação preserva o provável contraste entre Israel e as demais nações, sem transformar גּוֹיִם em um termo técnico posterior.
- issue: Referência pronominal do masculino singular
  choice: o ... sua ... você
  alternative: te ... tua ... ti
  rationale: A tradução conserva o destinatário masculino singular, mas usa formas correntes e amplamente inteligíveis em português, sem identificar interpretativamente o servo.
translation_notes:
  register: Português moderno, digno e de leitura natural, com preferência por construções compreensíveis tanto no Brasil quanto internacionalmente. Emprega 'você' para evitar mistura de paradigmas pronominais e conserva 'Yahweh' como nome próprio. A pontuação acompanha o paralelismo poético e a sequência das ações divinas.
