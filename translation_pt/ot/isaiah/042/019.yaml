  text: מִ֤י עִוֵּר֙ כִּ֣י אִם עַבְדִּ֔/י וְ/חֵרֵ֖שׁ כְּ/מַלְאָכִ֣/י אֶשְׁלָ֑ח מִ֤י עִוֵּר֙ כִּ/מְשֻׁלָּ֔ם וְ/עִוֵּ֖ר כְּ/עֶ֥בֶד יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/019.yaml
  text: Who is blind but my servant[a], and deaf like my messenger whom I send? Who is blind like the one who is at peace, and blind like the servant of Yahweh?
translation:
  language: pt
  text: Quem é cego, senão o meu servo, e surdo como o meu mensageiro a quem envio? Quem é cego como aquele que está em paz[a], e cego como o servo de Yahweh?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aquele que é perfeito/íntegro”. O termo hebraico מְשֻׁלָּם é difícil e pode transmitir a ideia de completude, integridade ou uma condição de paz.
    reason: alternative_reading
lexical_decisions:
- source_word: עִוֵּר
  choice: cego
  rationale: É o sentido comum do adjetivo hebraico; a repetição foi mantida nas três ocorrências para preservar a força retórica.
- source_word: חֵרֵשׁ
  choice: surdo
  rationale: Tradução direta, em paralelo enfático com “cego”.
- source_word: עַבְדִּי
  choice: meu servo
  rationale: Preserva a linguagem característica do servo em Isaías sem enfatizar indevidamente a acepção social de escravo.
- source_word: מַלְאָכִי
  choice: meu mensageiro
  rationale: Embora o termo possa designar um anjo, o paralelo com “meu servo” e a referência ao envio favorecem aqui o sentido de agente comissionado.
- source_word: אֶשְׁלָח
  choice: a quem envio
  rationale: Expressa naturalmente em português a ação verbal ligada ao mensageiro, sem impor uma anterioridade que o imperfeito hebraico não exige.
- source_word: מְשֻׁלָּם
  choice: aquele que está em paz
  rationale: O termo é difícil e pertence ao campo semântico de completude, integridade e paz. A formulação não acrescenta um complemento ausente no hebraico; alternativas relevantes são registradas em nota.
- source_word: עֶבֶד יְהוָה
  choice: servo de Yahweh
  rationale: Tradução direta da construção nominal, coerente com a linguagem do servo no livro.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, distinguindo-o do título “Senhor”.
- source_word: כִּי אִם
  choice: senão
  rationale: 'Reproduz de modo idiomático a força exclusiva da pergunta retórica: “quem... senão...?”'
theological_decisions:
- issue: Identidade do “meu servo” e do “meu mensageiro” na repreensão profética
  choice: Não especificar o referente além das designações presentes no versículo.
  alternative: Identificá-lo explicitamente como Israel, o profeta ou uma figura ideal do servo.
  rationale: O próprio versículo não resolve de modo expresso a identidade; a tradução preserva essa tensão interpretativa.
- issue: Sentido de מְשֻׁלָּם
  choice: “aquele que está em paz” no texto principal.
  alternative: “aquele que é perfeito/íntegro”, “aquele que foi completado” ou “aquele que foi recompensado”.
  rationale: A forma hebraica é lexicalmente difícil. A opção principal preserva uma possibilidade do campo semântico de שלם sem inserir “comigo”, que não está explícito; a nota mantém abertas as principais alternativas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura interrogativa e as repetições do hebraico foram preservadas; “senão” comunica naturalmente a exclusividade de כִּי אִם.
