  source_fidelity: A tradução preserva adequadamente os dois infinitivos finais, as imagens de cegueira, reclusão e trevas, e não explicita uma interpretação espiritual. Contudo, «os que estão sentados nas trevas» é excessivamente calcado no hebraico e pouco natural em português; יֹשְׁבֵי, neste contexto, pode ser traduzido idiomaticamente por «os que habitam nas trevas».
  naturalness: «Para tirar do confinamento o prisioneiro e, da prisão, os que habitam nas trevas» mantém o paralelismo e a elipse poética de modo claro e natural. A anteposição dos complementos aproxima a ordem hebraica e evita a construção um tanto pesada «tirar o prisioneiro do confinamento».
  terminology: «Confinamento» representa bem מַסְגֵּר sem restringi-lo indevidamente a uma edificação. «Prisão» traduz naturalmente בֵּית כֶּלֶא. «Olhos cegos» é uma imagem portuguesa compreensível e mantém a modificação direta do hebraico; a alternativa «os olhos dos cegos» deve permanecer em nota.
