translation:
  language: pt
  text: para abrir os olhos cegos[a], para tirar do confinamento o prisioneiro e, da prisão, os que habitam nas trevas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os olhos dos cegos”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “os que estão sentados nas trevas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְקֹחַ
  choice: para abrir
  rationale: O infinitivo construto com ל expressa propósito. “Abrir” reproduz de modo natural a imagem hebraica aplicada aos olhos.
- source_word: עֵינַיִם עִוְרוֹת
  choice: os olhos cegos
  rationale: Mantém a relação direta entre o substantivo e o adjetivo no hebraico e preserva a imagem concisa, sem explicá-la.
- source_word: לְהוֹצִיא
  choice: para tirar
  rationale: Expressa a ação causativa de fazer sair e é idiomático em português no contexto de libertar alguém de confinamento.
- source_word: מִמַּסְגֵּר
  choice: do confinamento
  rationale: O termo pode indicar um lugar ou estado de reclusão. “Confinamento” conserva essa amplitude sem impor uma estrutura física específica.
- source_word: אַסִּיר
  choice: o prisioneiro
  rationale: O singular hebraico é mantido como singular representativo; “prisioneiro” se ajusta ao campo semântico imediato de reclusão e libertação.
- source_word: מִבֵּית כֶּלֶא
  choice: da prisão
  rationale: Traduz naturalmente em português a construção “casa de aprisionamento”, preservando o sentido sem o pouco idiomático “casa da prisão”.
- source_word: יֹשְׁבֵי חֹשֶׁךְ
  choice: os que estão sentados nas trevas
  rationale: Preserva a imagem verbal concreta de ישב, “sentar-se/estar sentado”, e a metáfora poética de permanecer nas trevas.
theological_decisions:
- issue: Alcance literal e metafórico da cegueira, do aprisionamento e das trevas
  choice: Conservar as imagens concretas sem explicitar seu possível sentido espiritual no texto principal.
  alternative: Interpretar diretamente como iluminação espiritual e libertação espiritual.
  rationale: O hebraico apresenta imagens capazes de ressoar literal e metaforicamente. A tradução preserva essa tensão em vez de determinar uma única aplicação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação explicita em português o paralelismo hebraico, e as imagens poéticas permanecem sem expansão interpretativa.
