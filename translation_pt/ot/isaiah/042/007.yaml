    rationale: Embora ישב possa significar «sentar-se», o particípio plural, em paralelo com uma condição de encarceramento, tem naturalmente o sentido de habitar, permanecer ou viver. «Habitar nas trevas» conserva a imagem e soa poético sem ser artificial.
  - severity: low
    issue: A nota c deixa de corresponder à melhor formulação proposta para o texto principal.
    rationale: Se «os que habitam nas trevas» for adotado no texto, «os que estão sentados nas trevas» pode ser mantido como alternativa mais literal, preservando a possibilidade sem prejudicar a fluência do texto.
