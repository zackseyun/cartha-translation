id: ISA.42.24
reference: Isaiah 42:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מִֽי נָתַ֨ן ל/משוסה יַעֲקֹ֛ב וְ/יִשְׂרָאֵ֥ל לְ/בֹזְזִ֖ים הֲ/ל֣וֹא יְהוָ֑ה ז֚וּ חָטָ֣אנוּ ל֔/וֹ וְ/לֹֽא אָב֤וּ בִ/דְרָכָי/ו֙ הָל֔וֹךְ וְ/לֹ֥א שָׁמְע֖וּ בְּ/תוֹרָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/024.yaml
  text: Who gave Jacob over to plunder[a], and Israel to looters? Was it not Yahweh, he against whom we have sinned? They were not willing to walk in his ways[b], and they did not listen to his law.
translation:
  language: pt
  text: Quem entregou Jacó ao saque[a] e Israel aos saqueadores? Não foi Yahweh, aquele contra quem pecamos? Eles não quiseram andar nos caminhos dele e não deram ouvidos à sua lei[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «ao despojo/saque» e «aos que saqueiam»; a linha retrata Jacó e Israel entregues para serem despojados.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «à sua instrução». A palavra hebraica torá pode significar tanto lei como instrução.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ל/משוסה
  choice: ao saque
  rationale: O substantivo descreve a condição ou finalidade de ser entregue para despojo; «entregou ... ao saque» é natural em português e preserva a imagem.
- source_word: לְ/בֹזְזִים
  choice: aos saqueadores
  rationale: O particípio de בזז designa os agentes que tomam despojos; «saqueadores» mantém a correspondência lexical com «saque» sem perder clareza.
- source_word: הֲ/לֹא יְהוָה
  choice: Não foi Yahweh
  rationale: A pergunta hebraica espera resposta afirmativa, e o nome divino é transliterado como Yahweh.
- source_word: זוּ
  choice: aquele contra quem
  rationale: זוּ introduz aqui uma oração relativa; «aquele» conserva a ênfase explícita do elemento hebraico, enquanto «contra quem» expressa naturalmente חטא ל em português.
- source_word: חָטָאנוּ ל֔/וֹ
  choice: pecamos contra
  rationale: O perfeito hebraico apresenta o pecado cometido; o presente perfeito não tem equivalente direto necessário em português, e «pecamos contra» é idiomático e preciso.
- source_word: וְ/לֹֽא אָב֤וּ
  choice: Eles não quiseram
  rationale: אבה exprime disposição ou falta dela. «Não quiseram» preserva o sentido sem intensificá-lo para «recusaram-se».
- source_word: בִ/דְרָכָי/ו֙ הָל֔וֹךְ
  choice: andar nos caminhos dele
  rationale: Mantém a metáfora hebraica tradicional de conduta e soa natural em português; «dele» evita uma possível leitura momentânea de «seus» como referente aos sujeitos plurais.
- source_word: שָׁמְע֖וּ
  choice: deram ouvidos
  rationale: A expressão portuguesa comunica escuta atenta com implicação de obediência, sem traduzir diretamente por «obedecer» e eliminar a imagem auditiva.
- source_word: בְּ/תוֹרָתֽ/וֹ
  choice: à sua lei
  rationale: תורה pode significar lei ou instrução. «Lei» é adequado ao contexto da aliança, enquanto a alternativa semântica é registrada em nota.
- source_word: יַעֲקֹב / יִשְׂרָאֵל
  choice: Jacó ... Israel
  rationale: Os dois nomes são preservados para manter o paralelismo poético e a identidade coletiva da aliança.
theological_decisions:
- issue: Forma portuguesa do nome divino יהוה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto traz o nome da aliança diretamente; «Yahweh» o representa por transliteração, em vez de substituí-lo por um título.
- issue: Mudança de pessoa entre חָטָאנוּ e os verbos plurais seguintes
  choice: Preservar «pecamos» e depois «eles não quiseram... não deram ouvidos»
  alternative: Harmonizar toda a passagem na primeira pessoa do plural
  rationale: A mudança da confissão comunitária em primeira pessoa para a descrição em terceira pessoa está no hebraico e deve permanecer como tensão genuína do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Preserva o paralelismo, a metáfora de andar, a pergunta retórica e a mudança de primeira para terceira pessoa. A colocação «aquele contra quem» conserva a ênfase de זוּ sem tornar a frase artificial.
