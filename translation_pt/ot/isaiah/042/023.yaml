base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/023.yaml
  text: Who among you will listen to this[a], will pay attention and hear hereafter?
translation:
  language: pt
  text: Quem entre vocês dará ouvidos a isto, prestará atenção e ouvirá daqui em diante[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para o futuro” ou “depois”. O hebraico traz literalmente “para trás”, expressão usada aqui em sentido temporal para aquilo que vem mais tarde.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי בָכֶם
  choice: Quem entre vocês
  rationale: Expressa de modo natural a pergunta retórica dirigida ao grupo, preservando o sentido idiomático de בָכֶם.
- source_word: יַאֲזִין
  choice: dará ouvidos
  rationale: O hifil de אזן indica escutar atentamente; a expressão é corrente, digna e permite distingui-la dos outros verbos de audição no versículo.
- source_word: זֹאת
  choice: a isto
  rationale: Mantém o demonstrativo feminino singular, que aponta para a mensagem ou advertência presente.
- source_word: יַקְשִׁב
  choice: prestará atenção
  rationale: Representa a ideia de atenção deliberada e preserva a variação lexical da sequência hebraica.
- source_word: וְיִשְׁמַע
  choice: e ouvirá
  rationale: Traduz diretamente שמע no contexto de uma convocação a escutar, sem introduzir explicitamente o sentido possível de obedecer.
- source_word: לְאָחוֹר
  choice: para o futuro
  rationale: A expressão significa literalmente algo como 'para trás/depois' e, neste contexto, tem valor temporal prospectivo; a tradução mantém essa orientação sem explicar além do texto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sequência de três verbos relacionados à audição foi preservada por meio de expressões distintas. A formulação incomum “ouvirá para o futuro” conserva a ambiguidade e a tensão do hebraico, esclarecidas na nota.
