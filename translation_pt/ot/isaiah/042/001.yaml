  text: הֵ֤ן עַבְדִּ/י֙ אֶתְמָךְ בּ֔/וֹ בְּחִירִ֖/י רָצְתָ֣ה נַפְשִׁ֑/י נָתַ֤תִּי רוּחִ/י֙ עָלָ֔י/ו מִשְׁפָּ֖ט לַ/גּוֹיִ֥ם יוֹצִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/001.yaml
  text: Behold my servant[a], whom I uphold, my chosen one, in whom my soul delights. I have put my Spirit upon him[c][b]; he will bring forth justice to the nations.
translation:
  language: pt
  text: Eis o meu servo, a quem sustento; o meu escolhido, em quem a minha alma se deleita.[a] Pus sobre ele o meu Espírito; ele trará justiça às nações.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de quem me agrado”.'
    reason: lexical_alternative
  - marker: b
    text: “Justiça” também pode ser traduzido por “julgamento” ou “direito”; o hebraico mishpat pode indicar uma decisão judicial, a justiça ou uma ordem justa.
    reason: lexical_alternative
  - marker: c
    text: No Novo Testamento, este versículo é aplicado a Jesus, o Messias (ver Mateus 12:18).
    reason: cross_reference
lexical_decisions:
- source_word: הֵן
  choice: Eis
  rationale: Partícula dêitica que chama a atenção para a apresentação do servo. “Eis” preserva o tom profético elevado sem deixar de ser compreensível.
- source_word: עַבְדִּי
  choice: o meu servo
  rationale: Embora עבד também possa designar um escravo, neste contexto profético e régio “servo” expressa naturalmente a função sem enfatizar indevidamente uma condição de servidão compulsória.
- source_word: אֶתְמָךְ בּוֹ
  choice: a quem sustento
  rationale: O verbo תמך com ב comunica apoio e sustentação. A oração relativa é natural em português e mantém Deus como aquele que sustenta o servo.
- source_word: בְּחִירִי
  choice: o meu escolhido
  rationale: O adjetivo substantivado indica alguém especialmente escolhido; “o meu escolhido” preserva sua força pessoal.
- source_word: רָצְתָה נַפְשִׁי
  choice: em quem a minha alma se agrada
  rationale: Mantém a referência explícita à “minha alma” e a intensidade antropomórfica do prazer divino, sem reduzi-la à paráfrase mais comum “de quem me agrado”.
- source_word: נָתַתִּי רוּחִי עָלָיו
  choice: Pus sobre ele o meu Espírito
  rationale: נתן com רוח e על é expresso naturalmente por “pôr sobre”. A inicial maiúscula em “Espírito” sinaliza que se trata do Espírito de Deus, conforme o possessivo “meu” no discurso divino.
- source_word: מִשְׁפָּט
  choice: justiça
  rationale: Neste contexto, משפט vai além de uma sentença judicial e abrange a manifestação ou o estabelecimento da justiça. A nota conserva outras possibilidades lexicais.
- source_word: לַגּוֹיִם
  choice: às nações
  rationale: גוים refere-se amplamente aos povos ou nações. “Nações” evita restringir o termo ao sentido religioso posterior de “gentios”.
- source_word: יוֹצִיא
  choice: levará
  rationale: O hifil de יצא significa fazer sair ou trazer para fora. Com “justiça” e o destinatário introduzido por ל, “levará” comunica de modo natural sua apresentação e extensão pública às nações.
theological_decisions:
- issue: Identidade e função do servo
  choice: Manter a designação neutra “o meu servo” no texto principal.
  alternative: Entender o servo como Israel coletivamente, como um indivíduo profético ou como figura messiânica cumprida em Jesus.
  rationale: O hebraico deste versículo identifica a figura apenas como servo de Deus. A tradução não decide entre as leituras possíveis no próprio contexto de Isaías; a nota de referência registra a aplicação neotestamentária a Jesus.
- issue: רוּחִי como o Espírito divino
  choice: Usar “o meu Espírito”, com inicial maiúscula.
  alternative: Traduzir “o meu espírito”, com inicial minúscula.
  rationale: Como Deus é o falante e concede seu próprio רוח ao servo para capacitá-lo, “Espírito” torna claro o referente divino sem acrescentar conteúdo ao possessivo hebraico.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Eis” e “minha alma se agrada” preservam o caráter elevado e a intensidade poética do hebraico; a sintaxe permanece natural. Os marcadores aparecem junto aos termos pertinentes, e a referência cristológica fica na nota, não inserida no texto.
