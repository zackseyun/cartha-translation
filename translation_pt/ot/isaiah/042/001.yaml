  source_fidelity: 'A tradução preserva adequadamente a estrutura e os elementos principais do hebraico: a apresentação do servo, o sustento divino, a eleição, a concessão do Espírito e a missão relativa a mishpat entre as nações. «Levará a justiça às nações» é possível, embora «trará» represente mais diretamente o efeito do hifil de יצא neste contexto.'
  naturalness: '«Em quem a minha alma se agrada» não é idiomático no português moderno: agradar-se normalmente rege «de». Para conservar a imagem hebraica sem uma regência inadequada, «em quem a minha alma se deleita» é natural, solene e fiel. «Trará justiça às nações» também é mais corrente do que «levará ... às nações».'
  terminology: «Servo», «escolhido», «Espírito», «justiça» e «nações» são escolhas adequadas e não impõem identificação confessional do servo no texto. A nota sobre a aplicação em Mateus deve permanecer explicitamente como aplicação neotestamentária, não como identificação inserida na tradução.
