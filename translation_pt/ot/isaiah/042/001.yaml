  to: Eis o meu servo, a quem sustento; o meu escolhido, em quem a minha alma se deleita.[a] Pus sobre ele o meu Espírito; ele trará justiça às nações.[b][c]
  rationale: A revisão corrige uma regência não idiomática, preservando a referência explícita à «alma» de Deus e o tom poético do hebraico. Também substitui «levará» por «trará», opção portuguesa mais natural para a manifestação ou comunicação de mishpat às nações. Os marcadores permanecem ancorados nos pontos pertinentes, e a nota cristológica continua fora do texto principal.
