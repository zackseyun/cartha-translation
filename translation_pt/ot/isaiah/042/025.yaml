  text: וַ/יִּשְׁפֹּ֤ךְ עָלָי/ו֙ חֵמָ֣ה אַפּ֔/וֹ וֶ/עֱז֖וּז מִלְחָמָ֑ה וַ/תְּלַהֲטֵ֤/הוּ מִ/סָּבִיב֙ וְ/לֹ֣א יָדָ֔ע וַ/תִּבְעַר בּ֖/וֹ וְ/לֹא יָשִׂ֥ים עַל לֵֽב־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/025.yaml
  text: So he poured out on him the heat of his anger and the might of battle[a]; it set him ablaze all around, but he did not know; it burned in him[d][c][b], but he did not take it to heart.
translation:
  language: pt
  text: Assim, ele derramou sobre ele[a] o calor da sua ira e a força da batalha[b]. Isso o incendiou por todos os lados, mas ele não percebeu; ardeu nele[c], mas ele não levou isso a sério[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O primeiro “ele” se refere a Deus; o segundo, a Israel/Jacó, personificado como um só homem.
    reason: cultural_note
  - marker: b
    text: 'Ou: “a violência da guerra” ou “a fúria da guerra”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “queimou-o”.'
    reason: lexical_alternative
  - marker: d
    text: 'Literalmente: “não pôs isso sobre o coração”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפֹּךְ עָלָיו
  choice: derramou sobre ele
  rationale: Preserva a metáfora concreta de derramar e mantém o pronome masculino singular do hebraico.
- source_word: חֵמָה אַפּוֹ
  choice: o calor da sua ira
  rationale: חֵמָה pode denotar calor ou furor, enquanto אַף expressa ira; a formulação conserva tanto a intensificação quanto a imagem de fogo desenvolvida no restante do versículo.
- source_word: וֶעֱזוּז מִלְחָמָה
  choice: e a violência da guerra
  rationale: עֱזוּז comunica força intensa, poder ou ferocidade. 'Violência da guerra' é natural em português e não reduz a expressão apenas a uma emoção.
- source_word: וַתְּלַהֲטֵהוּ מִסָּבִיב
  choice: Isso o envolveu em chamas por todos os lados
  rationale: Reproduz a imagem vívida de flamejar ou incendiar e expressa claramente a ideia de algo que cerca a pessoa julgada.
- source_word: וְלֹא יָדָע
  choice: mas ele não percebeu
  rationale: ידע significa saber, conhecer ou perceber. No contexto, trata-se da incapacidade de reconhecer o significado do juízo, e 'não percebeu' mantém essa amplitude sem explicar em excesso.
- source_word: וַתִּבְעַר בּוֹ
  choice: ardeu nele
  rationale: Mantém de perto o verbo de queimar/arder e a preposição בּוֹ, deixando visível a possível nuance de que o fogo atuava nele.
- source_word: וְלֹא יָשִׂים עַל לֵב
  choice: mas ele não levou isso a sério
  rationale: Equivalente português natural do idioma hebraico 'pôr sobre o coração', que significa considerar, dar atenção ou acolher seriamente.
theological_decisions:
- issue: Referência dos pronomes masculinos singulares
  choice: Manter 'ele', entendendo Israel/Jacó como povo personificado no singular.
  alternative: Pluralizar como 'eles' para explicitar a referência coletiva.
  rationale: O hebraico emprega coerentemente o singular e, assim, apresenta o povo como uma pessoa coletiva. Preservar o singular mantém a forma literária e evita apagar essa personificação.
- issue: Sujeito das ações de juízo
  choice: Entender o primeiro 'ele' como Deus e usar 'isso' para o efeito conjunto da ira e da guerra nas orações seguintes.
  alternative: Tornar Deus sujeito explícito de todas as ações ou reproduzir o gênero feminino hebraico com 'ela'.
  rationale: O hebraico passa da ação divina para a atuação do juízo derramado. 'Isso' conserva a progressão sem criar uma referência feminina artificialmente restrita em português.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação conserva as imagens hebraicas de derramamento, calor e fogo, mantém a personificação singular de Israel e registra em notas as ambiguidades lexicais relevantes.
