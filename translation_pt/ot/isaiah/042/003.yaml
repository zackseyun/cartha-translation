  text: קָנֶ֤ה רָצוּץ֙ לֹ֣א יִשְׁבּ֔וֹר וּ/פִשְׁתָּ֥ה כֵהָ֖ה לֹ֣א יְכַבֶּ֑/נָּה לֶ/אֱמֶ֖ת יוֹצִ֥יא מִשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/003.yaml
  text: A bruised reed he will not break[a], and a dimly burning wick he will not extinguish[b]; he will faithfully bring forth justice.
translation:
  language: pt
  text: Não quebrará a cana esmagada, nem apagará o pavio que arde fracamente; com fidelidade fará surgir a justiça.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em verdade fará surgir a justiça”.'
    reason: alternative_reading
lexical_decisions:
- source_word: קָנֶה רָצוּץ
  choice: a cana esmagada
  rationale: Mantém a metáfora concreta. “Cana” é corrente e compreensível em português; “esmagada” expressa o particípio passivo sem dizer que ela já foi completamente quebrada.
- source_word: לֹא יִשְׁבּוֹר
  choice: não quebrará
  rationale: O futuro preserva a forma profética e descreve a conduta característica do servo.
- source_word: פִשְׁתָּה כֵהָה
  choice: o pavio que ainda queima fracamente
  rationale: פִשְׁתָּה significa literalmente “linho”, mas, em associação com apagar, refere-se provavelmente a um pavio de linho. A formulação portuguesa comunica seu fogo débil sem restringir a imagem à fumaça.
- source_word: לֹא יְכַבֶּנָּה
  choice: nem apagará
  rationale: “Apagar” é a expressão natural em português para extinguir a chama de um pavio.
- source_word: לֶאֱמֶת
  choice: com fidelidade
  rationale: Conserva o valor adverbial de אֱמֶת como verdade, firmeza ou confiabilidade, sem reduzir a expressão somente à sinceridade intelectual.
- source_word: יוֹצִיא מִשְׁפָּט
  choice: fará prevalecer a justiça
  rationale: יוֹצִיא significa literalmente “fará sair/trará para fora”. No contexto, a expressão aponta para tornar efetiva a justiça; “fará prevalecer” comunica isso em português natural, sem limitar מִשְׁפָּט a um veredito judicial.
theological_decisions:
- issue: Retrato metafórico do modo como o servo trata os frágeis
  choice: Preservar as imagens concretas da cana esmagada e do pavio que queima fracamente.
  alternative: Explicitar as imagens como referências a pessoas fracas ou desanimadas.
  rationale: O hebraico não interpreta diretamente as metáforas. Mantê-las preserva sua força poética e evita introduzir no texto principal uma aplicação teológica específica.
- issue: Sentido de לֶאֱמֶת
  choice: com fidelidade
  alternative: em verdade
  rationale: A expressão pode indicar verdade ou confiabilidade. “Com fidelidade” se ajusta naturalmente ao modo como o servo promove a justiça, enquanto a alternativa mais literal é registrada em nota.
- issue: Força de יוֹצִיא מִשְׁפָּט
  choice: fará prevalecer a justiça
  alternative: trará à luz a justiça
  rationale: A construção pode ser vertida mais literalmente como fazer sair ou trazer para fora. A opção principal expressa a efetivação pública da justiça, e a nota mantém transparente a imagem verbal hebraica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva o paralelismo poético e as metáforas hebraicas. O marcador [a] aparece após a oração a que se refere.
