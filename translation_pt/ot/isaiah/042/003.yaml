review_pass:
  verdict: revise
  source_fidelity: A primeira metade preserva adequadamente as duas metáforas e as negações. Contudo, “ainda” em “o pavio que ainda queima fracamente” introduz uma noção temporal não expressa no hebraico. “Fará prevalecer” interpreta יוֹצִיא (“fará sair/trará para fora”) como vitória ou domínio da justiça; uma formulação mais próxima evita esse reforço.
  naturalness: O texto é claro, moderno e de registro apropriado. “Cana esmagada” e “pavio que arde fracamente” soam naturais e preservam a imagem poética sem explicá-la.
  terminology: “Justiça” representa bem מִשְׁפָּט neste contexto. “Com fidelidade” é uma opção legítima para לֶאֱמֶת, e a nota mantém de modo adequado a alternativa “em verdade”.
  issues:
  - severity: low
    issue: A palavra “ainda” não está explicitada na expressão hebraica פִשְׁתָּה כֵהָה.
    rationale: Embora torne a imagem idiomática, acrescenta uma nuance temporal. “Pavio que arde fracamente” comunica a debilidade da chama sem esse acréscimo.
  - severity: medium
    issue: “Fará prevalecer a justiça” é mais interpretativo que יוֹצִיא מִשְׁפָּט.
    rationale: O verbo significa literalmente fazer sair ou trazer para fora. “Fará surgir a justiça” preserva a imagem e a efetivação pública sem sugerir necessariamente a supremacia da justiça sobre um oponente.
  revised_text: Não quebrará a cana esmagada, nem apagará o pavio que arde fracamente; com fidelidade fará surgir a justiça.[a]
