  text: וְ/הוֹלַכְתִּ֣י עִוְרִ֗ים בְּ/דֶ֨רֶךְ֙ לֹ֣א יָדָ֔עוּ בִּ/נְתִיב֥וֹת לֹֽא יָדְע֖וּ אַדְרִיכֵ֑/ם אָשִׂים֩ מַחְשָׁ֨ךְ לִ/פְנֵי/הֶ֜ם לָ/א֗וֹר וּ/מַֽעֲקַשִּׁים֙ לְ/מִישׁ֔וֹר אֵ֚לֶּה הַ/דְּבָרִ֔ים עֲשִׂיתִ֖/ם וְ/לֹ֥א עֲזַבְתִּֽי/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/016.yaml
  text: And I will lead the blind by a way they have not known; on paths they have not known I will guide them. I will make the darkness before them into light[a], and the crooked places into level ground. These are the things I have done, and I have not forsaken them.
translation:
  language: pt
  text: E conduzirei os cegos por um caminho que não conhecem; por veredas que não conhecem, eu os guiarei. Transformarei em luz as trevas diante deles e em terreno plano os lugares tortuosos. Essas são as coisas que fiz[a], e não os abandonei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Essas são as coisas que farei, e não os abandonarei». Os verbos hebraicos estão no perfeito, que pode indicar uma ação concluída ou expressar como certa a realização futura daquilo que Deus promete.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהוֹלַכְתִּי
  choice: E conduzirei
  rationale: O hifil de הלך tem sentido causativo, mas, neste contexto, o português idiomático pede «conduzirei», preservando a ideia de direção divina.
- source_word: עִוְרִים
  choice: os cegos
  rationale: O adjetivo masculino plural é substantivado; «os cegos» conserva de modo conciso a imagem do texto.
- source_word: בְּדֶרֶךְ לֹא יָדָעוּ
  choice: por um caminho que não conhecem
  rationale: דרך designa caminho ou rota, e בְּ admite aqui uma expressão natural de percurso. O presente «não conhecem» comunica a falta atual de familiaridade resultante de nunca terem percorrido o caminho.
- source_word: בִּנְתִיבוֹת
  choice: por veredas
  rationale: נתיבות é um plural poético de caminhos ou trilhas. «Veredas» mantém o paralelismo sem repetição vocabular pesada.
- source_word: אַדְרִיכֵם
  choice: eu os guiarei
  rationale: O hifil de דרך significa fazer seguir, dirigir ou guiar. «Guiarei» distingue esta ação de «conduzirei» e preserva o campo semântico.
- source_word: אָשִׂים מַחְשָׁךְ לִפְנֵיהֶם לָאוֹר
  choice: Transformarei em luz as trevas diante deles
  rationale: Embora שים seja literalmente amplo («pôr, fazer»), «transformarei em» expressa com naturalidade a relação resultativa entre trevas e luz.
- source_word: וּמַעֲקַשִּׁים לְמִישׁוֹר
  choice: e em terreno plano os lugares tortuosos
  rationale: מַעֲקַשִּׁים indica o que é tortuoso, e מִישׁוֹר pode designar terreno plano. A formulação conserva a metáfora de uma rota tornada transitável.
- source_word: אֵלֶּה הַדְּבָרִים עֲשִׂיתִם
  choice: Essas são as coisas que fiz
  rationale: Mantém o perfeito hebraico em vez de uniformizá-lo silenciosamente com os verbos futuros anteriores.
- source_word: וְלֹא עֲזַבְתִּים
  choice: e não os abandonei
  rationale: Preserva o perfeito hebraico e o objeto plural que retoma os cegos.
theological_decisions:
- issue: Valor temporal dos perfeitos finais em um contexto de promessa futura
  choice: «fiz ... não os abandonei»
  alternative: «farei ... não os abandonarei»
  rationale: O versículo começa com formas inequivocamente futuras, mas termina com perfeitos. A tradução conserva essa mudança aspectual, que pode apresentar a promessa divina como já realizada em sua certeza, sem eliminar a alternativa temporal.
translation_notes:
  register: Português atual, digno e de leitura ampla, com cadência poética moderada. «Veredas» é literário, mas ainda corrente no registro bíblico; «lugares tortuosos» mantém a imagem concreta da viagem. O marcador [a] aparece no texto e esclarece a ambiguidade aspectual genuína.
