base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/008.yaml
  text: I am Yahweh; that is my name. I will not give my glory to another[a], nor my praise to idols.
translation:
  language: pt
  text: Eu sou Yahweh; esse é o meu nome. Não darei a outro a minha glória, nem o meu louvor a imagens esculpidas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ídolos”. O termo hebraico se refere especificamente a imagens esculpidas ou fabricadas, frequentemente usadas como objetos de culto.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, em vez de substituí-lo por um título.
- source_word: הוּא שְׁמִי
  choice: esse é o meu nome
  rationale: Expressa de modo natural em português a identificação enfática feita pelo pronome hebraico.
- source_word: כְבוֹדִי
  choice: a minha glória
  rationale: Preserva o sentido estabelecido de honra, majestade e glória divina neste contexto.
- source_word: לְאַחֵר
  choice: a outro
  rationale: Mantém a formulação concisa e a afirmação de exclusividade sem especificar além do texto.
- source_word: אֶתֵּן
  choice: não darei
  rationale: O imperfeito expressa aqui a resolução categórica de Yahweh.
- source_word: תְהִלָּתִי
  choice: o louvor que me pertence
  rationale: Em português, explicita naturalmente que o sufixo possessivo indica o louvor dirigido ou devido a Yahweh, sem alterar a ideia central.
- source_word: לַפְּסִילִים
  choice: às imagens esculpidas
  rationale: Preserva o aspecto concreto do termo hebraico, que designa imagens talhadas ou fabricadas para culto; 'ídolos' é a implicação contextual.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; Jeová; SENHOR
  rationale: A transliteração preserva o nome pessoal presente no hebraico. 'Yahweh' também mantém coerência com a orientação editorial fornecida.
- issue: Sentido possessivo de תְהִלָּתִי
  choice: o louvor que me pertence
  alternative: o meu louvor
  rationale: A formulação escolhida evita a possível leitura de que Deus seja quem profere o louvor e comunica que se trata do louvor dirigido a ele, sem acrescentar um agente.
- issue: Referente de פְּסִילִים
  choice: imagens esculpidas
  alternative: ídolos
  rationale: A opção principal conserva a especificidade material do hebraico; o contexto deixa claro seu caráter cultual, registrado na nota.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe poética concisa. Usa-se “Yahweh” conforme a orientação editorial; “esse” retoma naturalmente o nome recém-declarado. A nota conserva a alternativa funcional “ídolos” sem apagar a imagem concreta do hebraico.
