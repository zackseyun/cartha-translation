  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַחֲרִ֤יב הָרִים֙ וּ/גְבָע֔וֹת וְ/כָל עֶשְׂבָּ֖/ם אוֹבִ֑ישׁ וְ/שַׂמְתִּ֤י נְהָרוֹת֙ לָֽ/אִיִּ֔ים וַ/אֲגַמִּ֖ים אוֹבִֽישׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/015.yaml
  text: I will lay waste mountains and hills[a], and I will dry up all their vegetation; I will turn rivers into islands, and I will dry up pools.
translation:
  language: pt
  text: Devastarei montes e colinas e farei secar toda a sua vegetação; transformarei rios em ilhas[a] e farei secar as lagoas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “terras costeiras”; o termo hebraico pode designar ilhas ou regiões litorâneas.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרִיב
  choice: Devastarei
  rationale: O hifil de חרב expressa causar desolação ou ruína. “Devastarei” conserva a força causativa e o tom de juízo sem implicar necessariamente aniquilação total.
- source_word: הָרִים וּגְבָעוֹת
  choice: montes e colinas
  rationale: Equivalentes correntes e naturais para os dois tipos de elevação; “lugares altos” introduziria uma conotação cultual ausente do contexto.
- source_word: וְכָל עֶשְׂבָּם
  choice: toda a sua vegetação
  rationale: עֵשֶׂב pode abranger capim, ervas e vegetação em geral; o sufixo remete coletivamente aos montes e às colinas.
- source_word: אוֹבִישׁ
  choice: farei secar
  rationale: O hifil de יבש é causativo. A mesma formulação é mantida nas duas ocorrências para preservar a repetição retórica hebraica.
- source_word: וְשַׂמְתִּי
  choice: transformarei
  rationale: No padrão objeto mais resultado, שׂים indica fazer com que algo assuma outra condição; “transformarei” exprime isso com naturalidade em português.
- source_word: נְהָרוֹת
  choice: rios
  rationale: Equivalente normal de נְהָרוֹת, sem razão contextual para atenuá-lo como “riachos”.
- source_word: לָאִיִּים
  choice: em ilhas
  rationale: אִיִּים pode designar ilhas ou terras costeiras. “Ilhas” é a correspondência lexical direta e, no paralelismo, retrata as águas reduzidas a porções de terra.
- source_word: וַאֲגַמִּים
  choice: as lagoas
  rationale: אֲגַמִּים designa águas represadas, lagoas ou áreas pantanosas. “Lagoas” é claro, natural e adequado ao paralelismo com os rios.
theological_decisions:
- issue: Imagens do juízo divino sobre a criação
  choice: Manter a declaração concreta de que o Senhor devasta o relevo e seca a vegetação e as águas.
  alternative: Interpretar explicitamente tudo como metáfora da remoção de obstáculos.
  rationale: O hebraico emprega imagens ambientais concretas. A tradução preserva sua força literal sem decidir se, no contexto mais amplo, elas também têm alcance figurado, histórico ou cósmico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os quatro verbos na primeira pessoa preservam a ênfase sucessiva das formas verbais hebraicas; “farei secar” é repetido deliberadamente.
