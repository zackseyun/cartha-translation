source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר הָ/אֵ֣ל יְהוָ֗ה בּוֹרֵ֤א הַ/שָּׁמַ֨יִם֙ וְ/נ֣וֹטֵי/הֶ֔ם רֹקַ֥ע הָ/אָ֖רֶץ וְ/צֶאֱצָאֶ֑י/הָ נֹתֵ֤ן נְשָׁמָה֙ לָ/עָ֣ם עָלֶ֔י/הָ וְ/ר֖וּחַ לַ/הֹלְכִ֥ים בָּֽ/הּ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/005.yaml
  text: 'Thus says God[a], Yahweh, who created the heavens and stretched them out, who spread out the earth and its offspring[c][b], who gives breath to the people on it and spirit to those who walk in it:'
translation:
  language: pt
  text: 'Assim diz Deus, Yahweh, aquele que criou os céus e os estendeu, que espalhou a terra[a] e tudo o que dela brota[b], que dá fôlego ao povo que nela está e espírito[c] aos que nela andam:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que bateu” ou “que martelou a terra até espalhá-la”. O verbo hebraico pode evocar a ação de bater ou martelar algo para espalhá-lo.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “seus descendentes”; também pode significar “seus produtos” ou “aquilo que dela procede”.
    reason: lexical_alternative
  - marker: c
    text: Ou “sopro”. A palavra hebraica pode significar “espírito”, “sopro” ou “vento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל יְהוָה
  choice: Deus, Yahweh
  rationale: Mantém em aposição o título divino e o nome próprio da aliança, sem fundi-los nem substituir o nome por um título.
- source_word: בּוֹרֵא הַשָּׁמַיִם
  choice: aquele que criou os céus
  rationale: O particípio hebraico caracteriza Yahweh como Criador; a oração relativa finita é clara e natural em português.
- source_word: וְנוֹטֵיהֶם
  choice: e os estendeu
  rationale: Preserva a imagem tradicional do ato criador pelo qual os céus são estendidos.
- source_word: רֹקַע הָאָרֶץ
  choice: que estendeu a terra
  rationale: Comunica o resultado espacial do verbo רָקַע em português corrente; a imagem mais concreta de bater ou martelar é registrada em nota.
- source_word: וְצֶאֱצָאֶיהָ
  choice: e tudo o que dela brota
  rationale: Abrange o que procede da terra — vegetação, produtos e seres vivos — sem restringir indevidamente o sentido.
- source_word: נֹתֵן נְשָׁמָה
  choice: que dá fôlego
  rationale: נְשָׁמָה denota o fôlego vital; “fôlego” é natural e evita a leitura inadequada de “alma”.
- source_word: לָעָם עָלֶיהָ
  choice: ao povo que está sobre ela
  rationale: Conserva o coletivo עָם e a referência explícita à humanidade situada sobre a terra.
- source_word: וְרוּחַ
  choice: e espírito
  rationale: Mantém a distinção lexical entre נְשָׁמָה, “fôlego”, e רוּחַ, cujo campo semântico também inclui “sopro” e “vento”.
- source_word: לַהֹלְכִים בָּהּ
  choice: aos que andam por ela
  rationale: Preserva a imagem concreta do particípio “os que andam”, com formulação idiomática em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome divino em vez de substituí-lo por um título.
- issue: Distinção entre נְשָׁמָה e רוּחַ
  choice: fôlego ... espírito
  alternative: fôlego ... sopro
  rationale: Os dois termos têm campos semânticos relacionados, mas não idênticos. Traduzi-los de modo distinto conserva a tensão lexical e antropológica do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “que” sustenta a estrutura solene da declaração profética. “Está sobre ela” conserva a relação espacial do hebraico, enquanto “andam por ela” soa mais natural em português sem apagar a imagem original.
