  text: וְ/הוּא֮ עַם בָּז֣וּז וְ/שָׁסוּי֒ הָפֵ֤חַ בַּֽ/חוּרִים֙ כֻּלָּ֔/ם וּ/בְ/בָתֵּ֥י כְלָאִ֖ים הָחְבָּ֑אוּ הָי֤וּ לָ/בַז֙ וְ/אֵ֣ין מַצִּ֔יל מְשִׁסָּ֖ה וְ/אֵין אֹמֵ֥ר הָשַֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/022.yaml
  text: But this is a people plundered and pillaged[a], all of them trapped in holes and hidden away in prison houses. They have become spoil, with no one to rescue them; plunder, with no one saying, “Restore!”
translation:
  language: pt
  text: 'Mas este é um povo saqueado e espoliado; todos estão presos em covas[a] e escondidos em casas de prisão. Tornaram-se despojo, e não há quem os livre; objeto de saque, e não há quem diga: “Devolvam!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “todos estão presos entre jovens”, se בַּחוּרִים for entendido em seu sentido mais comum, “jovens”; o contexto, porém, favorece um sentido como “covas” ou “buracos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא עַם
  choice: Mas este é um povo
  rationale: O pronome retoma coletivamente o povo mencionado no contexto. “Mas” expressa o contraste discursivo, e a construção demonstrativa soa natural em português.
- source_word: בָּזוּז וְשָׁסוּי
  choice: saqueado e espoliado
  rationale: A dupla mantém os dois termos hebraicos ligados à pilhagem violenta, sem reduzi-los a uma única ideia.
- source_word: הָפֵחַ
  choice: presos
  rationale: Neste contexto difícil, o termo indica que todos foram apanhados ou encurralados. “Presos” também forma uma ligação natural com as covas e prisões mencionadas em seguida.
- source_word: בַּחוּרִים
  choice: em covas
  rationale: Embora a forma possa ser entendida de modo mais comum como “entre jovens”, o paralelismo com lugares de confinamento favorece “covas” ou “buracos”; a alternativa é preservada em nota.
- source_word: כֻּלָּם
  choice: todos
  rationale: Transmite de maneira clara a abrangência enfática do termo com sufixo.
- source_word: וּבְבָתֵּי כְלָאִים
  choice: em prisões
  rationale: A expressão significa literalmente “em casas de confinamento”. “Prisões” é natural e suficientemente concreta em português moderno.
- source_word: הָחְבָּאוּ
  choice: escondidos
  rationale: Preserva o sentido passivo de terem sido ocultados ou postos fora de vista.
- source_word: הָיוּ לָבַז
  choice: Tornaram-se despojo
  rationale: A construção היה ל indica mudança ou chegada a uma condição; “despojo” conserva o campo semântico militar da pilhagem.
- source_word: וְאֵין מַצִּיל
  choice: e não há quem os livre
  rationale: Reproduz a construção existencial e o sentido do particípio como alguém que resgata ou livra.
- source_word: מְשִׁסָּה
  choice: foram saqueados
  rationale: O substantivo volta a apresentar o povo como objeto de pilhagem. A formulação verbal é idiomática em português e mantém o paralelismo com a ausência de quem ordene a restituição.
- source_word: הָשַׁב
  choice: Devolvam!
  rationale: O imperativo pode pedir que aquilo que foi tomado seja restituído. “Devolvam!” preserva a concisão e a força da ordem, sem explicitar um objeto ausente no hebraico.
theological_decisions:
- issue: Referente do pronome singular em וְהוּא
  choice: 'Referência coletiva ao povo sob juízo: “este é um povo”.'
  alternative: Manter mais literalmente um referente masculino singular, como “ele é um povo”.
  rationale: 'A decisão é gramatical e discursiva: עַם explica imediatamente o referente coletivo, enquanto “ele é um povo” seria artificial e potencialmente enganoso em português.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva o paralelismo e o vocabulário de saque e despojo, além de registrar em nota a incerteza lexical de בַּחוּרִים.
