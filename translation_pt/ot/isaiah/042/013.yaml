  text: יְהוָה֙ כַּ/גִּבּ֣וֹר יֵצֵ֔א כְּ/אִ֥ישׁ מִלְחָמ֖וֹת יָעִ֣יר קִנְאָ֑ה יָרִ֨יעַ֙ אַף יַצְרִ֔יחַ עַל אֹיְבָ֖י/ו יִתְגַּבָּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/013.yaml
  text: Yahweh goes out like a mighty warrior[a]; like a man of war he stirs up zeal. He shouts, yes, he raises a battle cry[c][b]; over his enemies he shows himself mighty.
translation:
  language: pt
  text: Yahweh sai como um guerreiro poderoso; como um homem de guerra[c], desperta o seu zelo[a]. Ele solta um grito, sim, lança um grito de guerra; contra os seus inimigos, mostra-se poderoso[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desperta o seu ciúme”. O termo hebraico קִנְאָה pode indicar tanto zelo quanto ciúme, especialmente em contextos de aliança.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “prevalece contra os seus inimigos”. A oração final também pode ser traduzida de modo a enfatizar diretamente a vitória.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “como um homem de guerras”; isto é, um guerreiro experiente em combate.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: כַּגִּבּוֹר
  choice: como um guerreiro poderoso
  rationale: No contexto militar, גִּבּוֹר designa um homem forte, herói ou guerreiro; esta formulação preserva tanto a força quanto a imagem bélica.
- source_word: יֵצֵא
  choice: sai
  rationale: Reproduz o sentido básico do verbo sem acrescentar a ideia específica de marchar.
- source_word: כְּאִישׁ מִלְחָמוֹת
  choice: como um homem de guerra
  rationale: Mantém אִישׁ e a imagem militar, mas usa uma expressão natural em português; o plural hebraico é explicado em nota.
- source_word: יָעִיר קִנְאָה
  choice: desperta o seu zelo
  rationale: קִנְאָה pode significar zelo ou ciúme. Neste cenário de ação divina e combate, “zelo” comunica melhor o ardor intenso, sem eliminar a alternativa lexical, registrada em nota.
- source_word: יָרִיעַ
  choice: solta um grito
  rationale: Expressa naturalmente o ato de erguer a voz; o verbo seguinte explicita o caráter bélico do clamor.
- source_word: אַף יַצְרִיחַ
  choice: sim, lança um grito de guerra
  rationale: “Sim” preserva a intensificação de אַף, e “grito de guerra” comunica a força militar contextual de יַצְרִיחַ.
- source_word: עַל אֹיְבָיו יִתְגַּבָּר
  choice: contra os seus inimigos, mostra-se poderoso
  rationale: Preserva a oposição expressa por עַל e a nuance reflexiva do hitpael de גבר, além de ecoar “poderoso” no início do versículo.
theological_decisions:
- issue: A imagem de Yahweh como guerreiro
  choice: Conservar explicitamente a linguagem de guerra
  alternative: Suavizar a passagem como uma descrição geral de força
  rationale: O hebraico acumula imagens militares — guerreiro, homem de guerras, gritos e triunfo sobre inimigos — que não devem ser diluídas.
- issue: O sentido de קִנְאָה aplicado a Deus
  choice: zelo
  alternative: ciúme
  rationale: “Zelo” comunica de modo mais claro o ardor ativo e pactual neste contexto, enquanto a nota conserva a ambiguidade lexical genuína.
- issue: A expressão masculina אִישׁ מִלְחָמוֹת
  choice: homem de guerra
  alternative: guerreiro
  rationale: A escolha preserva o substantivo masculino אִישׁ e o paralelismo poético, sem recorrer à construção pouco natural “homem de guerras” no texto principal.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das notas foi posicionada junto às expressões que elas efetivamente explicam. A repetição de “poderoso” preserva a ligação lexical entre גִּבּוֹר e יִתְגַּבָּר.
