  text: יִשְׂא֤וּ מִדְבָּר֙ וְ/עָרָ֔י/ו חֲצֵרִ֖ים תֵּשֵׁ֣ב קֵדָ֑ר יָרֹ֨נּוּ֙ יֹ֣שְׁבֵי סֶ֔לַע מֵ/רֹ֥אשׁ הָרִ֖ים יִצְוָֽחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/011.yaml
  text: Let the wilderness and its cities lift up their voice[a], the settlements where Kedar dwells; let the inhabitants of Sela sing for joy; let them shout from the tops of the mountains.
translation:
  language: pt
  text: Que o deserto e as suas cidades ergam a voz; que os povoados onde Quedar habita ergam a voz; que os habitantes de Sela cantem de alegria e gritem do alto das montanhas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os habitantes da rocha”, caso סֶלַע seja entendido como substantivo comum, e não como o nome do lugar Sela.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂאוּ
  choice: ergam a voz
  rationale: O verbo נשׂא, nesta sequência volitiva, significa literalmente “erguer”. Como o objeto está implícito no contexto de aclamação, “a voz” é explicitado para produzir uma expressão portuguesa natural e preservar a metáfora.
- source_word: מִדְבָּר
  choice: o deserto
  rationale: “Deserto” é uma tradução corrente e clara para מִדְבָּר e se ajusta à personificação poética da região remota que se une ao louvor.
- source_word: וְעָרָיו
  choice: e suas cidades
  rationale: O sufixo masculino singular retoma naturalmente מִדְבָּר. Em português, o possessivo concorda com “cidades”, resultando em “suas cidades”.
- source_word: חֲצֵרִים
  choice: os povoados
  rationale: O termo designa aldeias ou assentamentos sem muralhas. “Povoados” é compreensível e suficientemente amplo para o contexto de Quedar.
- source_word: תֵּשֵׁב קֵדָר
  choice: onde Quedar habita
  rationale: A construção relativa comunica naturalmente em português a ideia dos povoados habitados por Quedar, preservando Quedar como nome próprio de povo ou região.
- source_word: יָרֹנּוּ
  choice: cantem de alegria
  rationale: רנן indica canto ou clamor jubiloso; “cantem de alegria” preserva tanto o caráter vocal quanto o tom celebrativo.
- source_word: יֹשְׁבֵי
  choice: os habitantes de
  rationale: O particípio substantivado designa aqueles que moram num lugar; “habitantes de” é conciso e idiomático.
- source_word: סֶלַע
  choice: Selá
  rationale: No paralelismo com Quedar, o termo é provavelmente o nome de um lugar. A leitura como substantivo comum, “rocha”, permanece possível e é registrada em nota.
- source_word: מֵרֹאשׁ הָרִים
  choice: do alto das montanhas
  rationale: A expressão espacial refere-se aos cumes. “Do alto das montanhas” é natural em português e conserva a imagem plural.
- source_word: יִצְוָחוּ
  choice: gritem
  rationale: צוח denota um clamor forte. Neste contexto de louvor, “gritem” transmite aclamação intensa, não lamento.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo poético preservado. “Ergam a voz” mantém a imagem hebraica sem soar artificial; “povoados” e “do alto das montanhas” favorecem clareza internacional e boa legibilidade brasileira. O marcador da nota foi colocado junto a “Selá”, termo ao qual a alternativa lexical se refere.
