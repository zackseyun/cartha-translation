id: ISA.42.14
reference: Isaiah 42:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֶחֱשֵׁ֨יתִי֙ מֵֽ/עוֹלָ֔ם אַחֲרִ֖ישׁ אֶתְאַפָּ֑ק כַּ/יּוֹלֵדָ֣ה אֶפְעֶ֔ה אֶשֹּׁ֥ם וְ/אֶשְׁאַ֖ף יָֽחַד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/014.yaml
  text: I have kept silent from long ago[a]; I have been quiet and restrained myself. Like a woman in labor I will cry out[b]; I will gasp and pant together.
translation:
  language: pt
  text: Por muito tempo fiquei em silêncio[a]; permaneci calado e me contive. Como uma mulher em trabalho de parto, gritarei; ofegarei e arquejarei ao mesmo tempo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Desde tempos antigos fiquei em silêncio»; também pode significar «há muito tempo».'
    reason: lexical_alternative
  - marker: b
    text: 'A frase final também pode ser traduzida: «ofegarei e arquejarei de uma só vez».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱשֵׁיתִי
  choice: fiquei em silêncio
  rationale: O hifil na primeira pessoa expressa manter-se em silêncio; o pretérito perfeito, em combinação com מֵעוֹלָם, apresenta esse silêncio prolongado como anterior à ação iminente.
- source_word: מֵעוֹלָם
  choice: por muito tempo
  rationale: No contexto, indica longa duração passada, não eternidade absoluta. A construção portuguesa é natural e mantém a extensão temporal; a alternativa «desde tempos antigos» consta em nota.
- source_word: אַחֲרִישׁ
  choice: permaneci calado
  rationale: O verbo continua o campo semântico do silêncio. «Permaneci calado» conserva o paralelismo sem repetir exatamente a formulação anterior.
- source_word: אֶתְאַפָּק
  choice: me contive
  rationale: O hitpael de אפק comunica autocontenção, isto é, refrear a própria ação.
- source_word: כַּיּוֹלֵדָה
  choice: Como uma mulher em trabalho de parto
  rationale: Reproduz de modo claro e atual a comparação explícita do hebraico com uma parturiente.
- source_word: אֶפְעֶה
  choice: gritarei
  rationale: פעה denota emitir um grito ou som intenso; «gritarei» introduz com vigor a imagem do parto.
- source_word: אֶשֹּׁם
  choice: ofegarei
  rationale: No contexto do parto e em paralelo com שׁאף, a leitura ligada à respiração forte é preferível ao sentido raro associado à desolação.
- source_word: וְאֶשְׁאַף
  choice: e arquejarei
  rationale: שׁאף pode descrever respiração intensa. «Arquejarei» complementa «ofegarei» e preserva os dois verbos hebraicos.
- source_word: יָחַד
  choice: ao mesmo tempo
  rationale: O advérbio apresenta as duas ações como simultâneas; também pode ter a nuance de súbita ocorrência conjunta, «de uma só vez».
theological_decisions:
- issue: Autodescrição divina por meio da imagem do parto
  choice: Manter literalmente a comparação «Como uma mulher em trabalho de parto»
  alternative: Substituir por uma referência genérica a um grito intenso ou explicar a imagem no próprio texto
  rationale: O hebraico emprega expressamente essa comparação para retratar intensidade represada e ação iminente. Preservá-la mantém a força e a tensão teológica do texto sem impor uma explicação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição semântica dos verbos de silêncio e a progressão para grito e respiração intensa foram preservadas; evitou-se suavizar a imagem feminina aplicada ao orador divino.
source_grounding:
  english_pob_role: consult_only
