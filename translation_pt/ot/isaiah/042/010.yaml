  text: שִׁ֤ירוּ לַֽ/יהוָה֙ שִׁ֣יר חָדָ֔שׁ תְּהִלָּת֖/וֹ מִ/קְצֵ֣ה הָ/אָ֑רֶץ יוֹרְדֵ֤י הַ/יָּם֙ וּ/מְלֹא֔/וֹ אִיִּ֖ים וְ/יֹשְׁבֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/010.yaml
  text: Sing to Yahweh a new song[a], his praise from the end of the earth, you who go down to the sea, and all that fills it[b], the coastlands and those who dwell in them.
translation:
  language: pt
  text: 'Cantem a Yahweh um cântico novo,

    cantem o seu louvor desde a extremidade da terra[a],

    vocês que descem ao mar, e tudo o que nele há,

    as terras costeiras[b] e os seus habitantes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “desde a extremidade da terra”; a expressão também pode ser traduzida de forma idiomática por “desde os confins da terra”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “as ilhas”; o termo hebraico pode designar tanto ilhas como, de modo mais amplo, terras costeiras distantes.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: Cantem
  rationale: O imperativo plural de שׁיר convoca diretamente os ouvintes a cantar; “Cantem” é claro, natural e preserva o número verbal.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: O texto traz o nome divino יהוה; “Yahweh” o representa diretamente, sem substituí-lo por um título.
- source_word: שִׁיר חָדָשׁ
  choice: um cântico novo
  rationale: Preserva a conhecida expressão hebraica e mantém um registro poético e digno em português.
- source_word: תְּהִלָּתוֹ
  choice: o seu louvor
  rationale: Mantém a formulação nominal compacta do hebraico e sua ligação em aposição com “um cântico novo”, sem acrescentar outro verbo ausente no original.
- source_word: מִקְצֵה הָאָרֶץ
  choice: desde a extremidade da terra
  rationale: Reflete o singular hebraico קְצֵה e expressa o ponto mais distante de onde o louvor deve soar.
- source_word: יוֹרְדֵי הַיָּם
  choice: vocês que descem ao mar
  rationale: Conserva a imagem concreta do particípio hebraico e torna explícito em português que o grupo é diretamente convocado.
- source_word: וּמְלֹאוֹ
  choice: e tudo o que o enche
  rationale: O substantivo מְלֹא designa a plenitude ou tudo aquilo que ocupa o mar; a formulação é fiel e corrente.
- source_word: אִיִּים
  choice: as terras costeiras
  rationale: Em Isaías, אִיִּים pode abranger ilhas e regiões marítimas distantes; “terras costeiras” preserva essa amplitude.
- source_word: וְיֹשְׁבֵיהֶם
  choice: e os seus habitantes
  rationale: Traduz de modo conciso o particípio substantivado com sufixo plural, cujo antecedente são as terras costeiras.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O versículo emprega diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e evita substituí-lo por um título, sem introduzir interpretação denominacional.
- issue: Relação sintática de תְּהִלָּתוֹ com שִׁיר חָדָשׁ
  choice: “o seu louvor” em aposição, sem repetir “cantem”
  alternative: “cantem o seu louvor”
  rationale: O hebraico não repete o verbo. A aposição mantém a compactação poética e permite que o louvor seja entendido como caracterização do cântico novo, preservando a tensão sintática.
translation_notes:
  register: Português moderno, poético e amplamente compreensível, com boa legibilidade brasileira. O paralelismo e a sequência de grupos convocados foram preservados; “vocês” explicita naturalmente o valor vocativo de יוֹרְדֵי sem alterar o sentido.
