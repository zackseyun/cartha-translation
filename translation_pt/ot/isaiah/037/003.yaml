  text: וַ/יֹּאמְר֣וּ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר חִזְקִיָּ֔הוּ יוֹם צָרָ֧ה וְ/תוֹכֵחָ֛ה וּ/נְאָצָ֖ה הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י בָ֤אוּ בָנִים֙ עַד מַשְׁבֵּ֔ר וְ/כֹ֥חַ אַ֖יִן לְ/לֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/003.yaml
  text: 'And they said to him[a], “Thus says Hezekiah: This day is a day of distress, rebuke, and disgrace, for children have come to the point of birth[b], and there is no strength to give birth.”'
translation:
  language: pt
  text: 'Eles lhe disseram: “Assim diz Ezequias: Este dia é dia de angústia, repreensão e desonra[a], pois os filhos chegaram ao momento de nascer[b], mas não há força para dar à luz.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido: “um dia de angústia, censura e desprezo”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, a expressão hebraica retrata filhos que chegaram ao ponto ou lugar do parto. É a imagem de um trabalho de parto que alcançou o momento do nascimento, mas sem força para completá-lo.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: Eles lhe disseram
  rationale: Reproduz de modo natural a sequência narrativa e o objeto indireto, sem acrescentar redundância.
- source_word: כֹּה אָמַר חִזְקִיָּהוּ
  choice: Assim diz Ezequias
  rationale: Conserva a fórmula solene de transmissão de uma mensagem; o perfeito hebraico funciona aqui como introdução convencional de fala.
- source_word: יוֹם צָרָה
  choice: dia de angústia
  rationale: צָרָה indica aflição, adversidade ou aperto; “angústia” comunica com clareza a gravidade da crise nacional.
- source_word: וְתוֹכֵחָה
  choice: repreensão
  rationale: Mantém o sentido comum de correção ou censura, em linguagem atual e digna.
- source_word: וּנְאָצָה
  choice: desonra
  rationale: O termo pode exprimir desprezo, afronta ou ultraje. “Desonra” se ajusta à humilhação pública do contexto sem especificar indevidamente “blasfêmia”.
- source_word: הַיּוֹם הַזֶּה
  choice: Este dia
  rationale: Preserva a expressão demonstrativa enfática e o tom solene do hebraico.
- source_word: כִּי בָאוּ בָנִים עַד מַשְׁבֵּר
  choice: pois os filhos chegaram ao momento de nascer
  rationale: Mantém explicitamente a metáfora do parto. בָנִים refere-se aqui às crianças prestes a nascer, e מַשְׁבֵּר ao ponto ou momento decisivo do parto.
- source_word: וְכֹחַ אַיִן לְלֵדָה
  choice: mas não há força para dar à luz
  rationale: Completa a imagem do trabalho de parto e conserva o singular “força”; “mas” torna explícito em português o contraste expresso pelo contexto.
theological_decisions:
- issue: Metáfora do parto aplicada à crise nacional
  choice: Manter de forma explícita a imagem de filhos que chegaram ao momento de nascer, sem força para o parto.
  alternative: 'Explicitar a interpretação: “chegamos ao momento decisivo, mas não temos forças para superar a crise”.'
  rationale: A formulação hebraica descreve vividamente a impotência de Judá por meio de um parto que chegou ao instante decisivo. Preservar a metáfora evita substituir a imagem pela interpretação.
- issue: Sentido de וּנְאָצָה
  choice: desonra
  alternative: blasfêmia
  rationale: Embora o substantivo possa referir-se a ultraje ou desprezo dirigido a Deus, o verso não explicita o alvo. “Desonra” preserva a amplitude sem impor uma leitura teológica mais específica.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. A ordem da tríade e a metáfora hebraica foram preservadas; evitou-se linguagem denominacional ou interpretação excessivamente explícita.
