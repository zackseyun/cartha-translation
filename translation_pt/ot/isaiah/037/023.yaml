source:
  edition: WLC
  text: אֶת מִ֤י חֵרַ֨פְתָּ֙ וְ/גִדַּ֔פְתָּ וְ/עַל מִ֖י הֲרִימ֣וֹתָה קּ֑וֹל וַ/תִּשָּׂ֥א מָר֛וֹם עֵינֶ֖י/ךָ אֶל קְד֥וֹשׁ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/023.yaml
  text: Whom have you mocked and blasphemed? Against whom have you raised your voice and lifted your eyes on high? Against the Holy One of Israel.
translation:
  language: pt
  text: A quem você insultou e blasfemou? Contra quem levantou a voz e ergueu os olhos para o alto? Contra o Santo de Israel!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֵרַפְתָּ
  choice: insultou
  rationale: O verbo חרף expressa afronta, ultraje ou insulto. “Insultou” comunica naturalmente a hostilidade verbal sem reduzir o sentido a simples zombaria.
- source_word: גִדַּפְתָּ
  choice: blasfemou
  rationale: גדף, neste contexto dirigido contra o Santo de Israel, denota injúria blasfema e é adequadamente traduzido por “blasfemou”.
- source_word: הֲרִימוֹתָה קּוֹל
  choice: levantou a voz
  rationale: Preserva de modo natural a expressão hebraica de falar desafiadora ou insolentemente.
- source_word: וַתִּשָּׂא מָרוֹם עֵינֶיךָ
  choice: ergueu os olhos com arrogância
  rationale: מָרוֹם pode ligar-se ao ato de erguer os olhos ou indicar sua elevação altiva. A formulação explicita a arrogância implícita na imagem e evita o pouco natural “ergueu ao alto os olhos”.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: o Santo de Israel
  rationale: Mantém o título divino tradicional e a ligação teológica característica de Isaías entre a santidade de Deus e Israel.
theological_decisions:
- issue: Referente da afronta assíria
  choice: “Contra o Santo de Israel!” como resposta enfática
  alternative: Tratar a frase apenas como continuação sintática da segunda pergunta
  rationale: O hebraico culmina identificando Deus como o verdadeiro alvo da afronta. A pontuação enfática preserva a força retórica sem acrescentar conteúdo doutrinário.
- issue: Sentido da imagem dos olhos elevados
  choice: Expressar a altivez como “com arrogância”
  alternative: 'Tradução estritamente espacial: “ergueu bem alto os olhos”'
  rationale: No contexto de desafio a Deus, a elevação dos olhos representa orgulho insolente. A escolha comunica essa força idiomática sem atribuir uma doutrina adicional.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento por “você”. As perguntas retóricas mantêm o confronto direto e a frase final recebe ênfase culminante.
