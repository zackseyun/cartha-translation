id: ISA.37.16
reference: Isaiah 37:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֤י יִשְׂרָאֵל֙ יֹשֵׁ֣ב הַ/כְּרֻבִ֔ים אַתָּה ה֤וּא הָֽ/אֱלֹהִים֙ לְ/בַדְּ/ךָ֔ לְ/כֹ֖ל מַמְלְכ֣וֹת הָ/אָ֑רֶץ אַתָּ֣ה עָשִׂ֔יתָ אֶת הַ/שָּׁמַ֖יִם וְ/אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/016.yaml
  text: O Yahweh of hosts[a], God of Israel, enthroned above the cherubim, you alone are God over all the kingdoms of the earth. You made the heavens and the earth.
translation:
  language: pt
  text: Ó Yahweh dos Exércitos, Deus de Israel, entronizado sobre os querubins[a], somente tu és Deus sobre todos os reinos da terra. Tu fizeste os céus e a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que habitas entre os querubins”; ou: “sentado sobre os querubins”.'
    reason: A expressão hebraica pode descrever a presença de Yahweh entre os querubins ou sua posição régia acima deles.
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Translitera o nome divino e conserva a amplitude do título צְבָאוֹת, que pode evocar exércitos ou hostes celestiais sem restringir seu referente.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Deus de Israel
  rationale: Tradução direta e natural da construção hebraica, cujo sentido é singular neste contexto.
- source_word: יֹשֵׁב הַכְּרֻבִים
  choice: entronizado sobre os querubins
  rationale: No contexto cultual e régio, o particípio יֹשֵׁב sugere que Yahweh está sentado como rei. “Sobre” comunica sua presença soberana associada aos querubins sem introduzir no texto a preposição explícita “entre”.
- source_word: אַתָּה הוּא הָאֱלֹהִים לְבַדְּךָ
  choice: somente tu és Deus
  rationale: Reproduz com naturalidade a ênfase dos pronomes e a exclusividade expressa por לְבַדְּךָ.
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: sobre todos os reinos da terra
  rationale: Interpreta o לְ relacional como expressão do domínio de Deus em relação a todos os reinos, de modo idiomático em português.
- source_word: עָשִׂיתָ
  choice: fizeste
  rationale: Mantém o sentido comum de עשה, “fazer”, sem substituí-lo pelo verbo mais específico “criar”.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: os céus e a terra
  rationale: Preserva o plural hebraico de “céus” e a fórmula abrangente da criação.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pactual em vez de substituí-lo por um título.
- issue: Exclusividade divina em אַתָּה הוּא הָאֱלֹהִים לְבַדְּךָ
  choice: somente tu és Deus
  alternative: tu és o único Deus; tu és Deus, tu somente
  rationale: Conserva a forte confissão de exclusividade do hebraico sem ampliá-la com formulação filosófica alheia ao verso.
- issue: Imagem de יֹשֵׁב הַכְּרֻבִים
  choice: entronizado sobre os querubins
  alternative: habitando entre os querubins; sentado sobre os querubins
  rationale: Expressa a imagem régia ligada à presença de Yahweh, enquanto a nota registra as possibilidades espacial e mais literal.
translation_notes:
  register: Português moderno, claro e solene, com formas verbais dirigidas a Deus na segunda pessoa do singular. A construção vocativa e a repetição de “tu” preservam o tom enfático da oração.
