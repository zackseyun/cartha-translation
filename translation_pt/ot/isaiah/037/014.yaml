  text: וַ/יִּקַּ֨ח חִזְקִיָּ֧הוּ אֶת הַ/סְּפָרִ֛ים מִ/יַּ֥ד הַ/מַּלְאָכִ֖ים וַ/יִּקְרָאֵ֑/הוּ וַ/יַּ֨עַל֙ בֵּ֣ית יְהוָ֔ה וַ/יִּפְרְשֵׂ֥/הוּ חִזְקִיָּ֖הוּ לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/014.yaml
  text: Then Hezekiah took the letters from the hand of the messengers and read them[b][a], and he went up to the house of Yahweh and spread them before Yahweh.
translation:
  language: pt
  text: Então Ezequias recebeu as cartas das mãos dos mensageiros e as leu.[a] Depois, subiu à casa de Yahweh e as estendeu diante de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “leu a mensagem” e, depois, “a estendeu”. O hebraico usa pronomes no singular, provavelmente referindo-se coletivamente à mensagem contida nas cartas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסְּפָרִים
  choice: as cartas
  rationale: סֵפֶר designa de modo amplo um escrito ou documento. Neste contexto, o plural se refere às comunicações escritas entregues pelos mensageiros assírios; “cartas” é natural e historicamente adequado.
- source_word: מִיַּד הַמַּלְאָכִים
  choice: das mãos dos mensageiros
  rationale: A expressão hebraica significa literalmente “da mão dos mensageiros”. O plural idiomático em português concorda naturalmente com “mensageiros” e comunica que Ezequias recebeu deles as cartas.
- source_word: וַיִּקְרָאֵהוּ
  choice: e as leu
  rationale: קרא significa aqui “ler”, pois tem por objeto uma comunicação escrita. Embora o sufixo hebraico seja singular, ele provavelmente trata coletivamente o conteúdo escrito; o plural em português concorda com “cartas”.
- source_word: וַיַּעַל בֵּית יְהוָה
  choice: subiu à casa de Yahweh
  rationale: עלה preserva o sentido direcional de subir, apropriado para a ida ao templo. “Casa de Yahweh” mantém a formulação concreta do hebraico sem substituir “casa” pela interpretação “templo”.
- source_word: וַיִּפְרְשֵׂהוּ
  choice: e as estendeu
  rationale: פרשׂ significa “estender, abrir diante de alguém”. O plural português retoma naturalmente “cartas”, enquanto o sufixo singular hebraico pode se referir coletivamente à mensagem escrita.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: A expressão significa literalmente “diante da face/presença de Yahweh”. “Diante de” é conciso, natural e preserva a ideia de apresentar a mensagem a Deus.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto traz o nome divino, não um título. “Yahweh” o representa por transliteração e evita substituí-lo silenciosamente por “Senhor”; “Javé” é uma adaptação portuguesa possível, mas menos próxima da forma transliterada adotada.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Recebeu ... das mãos” comunica naturalmente o idioma hebraico sem perder a imagem de transferência. A única nota preserva a discordância deliberada entre o plural “cartas” e os sufixos hebraicos no singular.
