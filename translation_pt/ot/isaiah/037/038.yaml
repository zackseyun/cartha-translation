  text: וַ/יְהִי֩ ה֨וּא מִֽשְׁתַּחֲוֶ֜ה בֵּ֣ית נִסְרֹ֣ךְ אֱלֹהָ֗י/ו וְֽ/אַדְרַמֶּ֨לֶךְ וְ/שַׂרְאֶ֤צֶר בָּנָי/ו֙ הִכֻּ֣/הוּ בַ/חֶ֔רֶב וְ/הֵ֥מָּה נִמְלְט֖וּ אֶ֣רֶץ אֲרָרָ֑ט וַ/יִּמְלֹ֛ךְ אֵֽסַר חַדֹּ֥ן בְּנ֖/וֹ תַּחְתָּֽי/ו׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/038.yaml
  text: And it happened that[a], as he was worshiping in the house of Nisroch his god, Adrammelech and Sharezer his sons struck him down with the sword, and they escaped to the land of Ararat[c][b]. And Esar-haddon his son reigned in his place.
translation:
  language: pt
  text: E aconteceu que, enquanto ele adorava[a] no templo[b] de Nisroque, seu deus, seus filhos Adrameleque e Sarezer o abateram à espada e escaparam para a terra de Ararate. E seu filho Esar-Hadom reinou em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «se prostrava»; o verbo hebraico pode destacar o gesto corporal de curvar-se em adoração.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «casa»; neste contexto, a casa de Nisroque é seu templo ou santuário.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Reproduz a função narrativa da forma hebraica sem recorrer ao arcaísmo «e sucedeu que».
- source_word: מִשְׁתַּחֲוֶה
  choice: adorava
  rationale: No contexto do santuário de seu deus, o verbo denota prostração como ato de culto; «adorava» comunica naturalmente o sentido religioso, enquanto a nota preserva o aspecto corporal.
- source_word: בֵּית נִסְרֹךְ
  choice: no templo de Nisroque
  rationale: Embora בֵּית signifique literalmente «casa», neste contexto designa o santuário da divindade; «templo» é claro e natural em português.
- source_word: נִסְרֹךְ אֱלֹהָיו
  choice: Nisroque, seu deus
  rationale: Translitera o nome próprio em forma adequada ao português e mantém a aposição que identifica Nisroque como o deus de Senaqueribe.
- source_word: אַדְרַמֶּלֶךְ וְשַׂרְאֶצֶר בָּנָיו
  choice: seus filhos Adrameleque e Sarezer
  rationale: Mantém explicitamente a filiação e apresenta os nomes em transliteração corrente e legível em português.
- source_word: הִכֻּהוּ בַחֶרֶב
  choice: o abateram à espada
  rationale: נכה significa golpear ou ferir; no contexto da sucessão real, o golpe é fatal. «Abateram» preserva a imagem do ato violento sem substituir o verbo diretamente por «mataram».
- source_word: נִמְלְטוּ
  choice: fugiram
  rationale: A forma nifal indica que conseguiram escapar; «fugiram» expressa com naturalidade o movimento para Ararate, embora «escaparam» também seja possível.
- source_word: אֶרֶץ אֲרָרָט
  choice: a terra de Ararate
  rationale: Mantém a construção geográfica hebraica e a forma tradicional portuguesa do nome da região.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  choice: reinou em seu lugar
  rationale: Expressa de modo conciso a sucessão ao trono narrada pelo hebraico.
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e solene, com nomes próprios adaptados à leitura lusófona. A tradução prioriza equivalência ótima: usa «templo» para tornar explícito o referente contextual de «casa», preservando o sentido literal em nota, e mantém a progressão narrativa concisa do hebraico.'
