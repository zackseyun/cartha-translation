base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/029.yaml
  text: Because your raging against me and your complacency have come up into my ears[a], I will put my hook in your nose and my bit in your lips[b], and I will turn you back by the way that you came.
translation:
  language: pt
  text: Porque a tua fúria contra mim e a tua segurança arrogante chegaram aos meus ouvidos,[a] porei o meu gancho no teu nariz e o meu freio nos teus lábios; farei que voltes pelo caminho por onde vieste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a tua complacência”. O termo hebraico pode indicar tranquilidade, despreocupação ou segurança e, neste contexto, provavelmente sugere autoconfiança arrogante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן
  choice: Porque
  rationale: Introduz diretamente a causa do juízo anunciado e soa natural em português atual.
- source_word: הִתְרַגֶּזְךָ אֵלַי
  choice: a tua fúria contra mim
  rationale: Expressa a agitação hostil ou o furor dirigido contra Deus; a construção nominal preserva o paralelismo com a expressão seguinte.
- source_word: שַׁאֲנַנְךָ
  choice: a tua segurança arrogante
  rationale: O termo pode indicar tranquilidade, despreocupação ou segurança; neste contexto de desafio, essa segurança tem caráter presunçoso. A formulação preserva tanto o núcleo lexical quanto a força contextual.
- source_word: עָלָה בְאָזְנָי
  choice: chegaram aos meus ouvidos
  rationale: Reproduz de modo natural a imagem hebraica de algo que sobe ou chega aos ouvidos, com concordância plural referente à fúria e à segurança.
- source_word: חַחִי בְּאַפֶּךָ
  choice: o meu gancho no teu nariz
  rationale: Mantém a imagem concreta de um gancho usado para dominar um animal ou conduzir um prisioneiro.
- source_word: מִתְגִּי בִּשְׂפָתֶיךָ
  choice: o meu freio nos teus lábios
  rationale: מתג designa o freio ou a embocadura usada para controlar um animal; “freio” é claro em português e conserva a localização incomum e vívida nos lábios.
- source_word: וַהֲשִׁיבֹתִיךָ
  choice: farei que voltes
  rationale: 'Torna explícito o valor causativo da forma verbal: Deus obrigará o rei inimigo a retornar.'
- source_word: בַּדֶּרֶךְ אֲשֶׁר בָּאתָ בָּהּ
  choice: pelo caminho por onde vieste
  rationale: Preserva a ideia de retorno pela mesma rota, evitando uma repetição artificial em português.
theological_decisions:
- issue: Linguagem antropomórfica e imagens de domínio divino
  choice: Manter “chegaram aos meus ouvidos”, “meu gancho” e “meu freio” como imagens concretas.
  alternative: Parafrasear como “eu ouvi a tua arrogância, vou dominar-te e mandar-te de volta”.
  rationale: As imagens fazem parte da força retórica do hebraico e apresentam o poder de Deus sobre o rei assírio sem transformar a linguagem figurada em uma abstração teológica.
- issue: Sentido contextual de שַׁאֲנַן
  choice: Traduzir como “segurança arrogante”, sinalizando em nota a amplitude do termo.
  alternative: “tranquilidade”, “despreocupação” ou “autoconfiança”.
  rationale: O contexto favorece uma segurança presunçosa, mas o substantivo não significa simplesmente “arrogância”; a tradução conserva essa tensão lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construções naturais tanto no Brasil quanto em outros contextos lusófonos. O uso de “tu” acompanha o tratamento singular direto do hebraico; as imagens concretas e severas do texto-fonte foram preservadas.
