  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ יְשַֽׁעְיָ֔הוּ כֹּ֥ה תֹאמְר֖וּ/ן אֶל אֲדֹנֵי/כֶ֑ם כֹּ֣ה אָמַ֣ר יְהוָ֗ה אַל תִּירָא֙ מִ/פְּנֵ֤י הַ/דְּבָרִים֙ אֲשֶׁ֣ר שָׁמַ֔עְתָּ אֲשֶׁ֧ר גִּדְּפ֛וּ נַעֲרֵ֥י מֶלֶךְ אַשּׁ֖וּר אוֹתִֽ/י־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/006.yaml
  text: 'And Isaiah said to them[a], “Thus you shall say to your master: Thus says Yahweh, ‘Do not be afraid because of the words that you have heard, with which the servants of the king of Assyria have blasphemed me.’”'
translation:
  language: pt
  text: 'Isaías lhes disse: “Assim vocês dirão ao seu senhor: Assim diz Yahweh: ‘Não tenha medo por causa das palavras que você ouviu, com as quais os servos do rei da Assíria blasfemaram contra mim[a].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “me insultaram” ou “me desafiaram”. O verbo hebraico pode indicar linguagem ofensiva ou desdenhosa dirigida contra Deus.
    reason: Alternativas lexicais que preservam a amplitude semântica de גִּדְּפוּ.
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם יְשַׁעְיָהוּ
  choice: Isaías lhes disse
  rationale: Reproduz com naturalidade o avanço narrativo e identifica explicitamente os destinatários da fala.
- source_word: כֹּה תֹאמְרוּן אֶל אֲדֹנֵיכֶם
  choice: Assim vocês dirão ao seu senhor
  rationale: Mantém a fórmula solene de mensageiro e o plural dirigido aos enviados; “senhor” designa aqui Ezequias, superior humano deles.
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Preserva a fórmula profética e representa diretamente o nome divino יְהוָה.
- source_word: אַל תִּירָא מִפְּנֵי הַדְּבָרִים
  choice: Não tenha medo por causa das palavras
  rationale: Expressa de modo claro a proibição no singular dirigida a Ezequias e o valor causal de מִפְּנֵי.
- source_word: נַעֲרֵי מֶלֶךְ אַשּׁוּר
  choice: os servos do rei da Assíria
  rationale: No contexto, נַעֲרֵי se refere aos subordinados ou oficiais do rei; “servos” é direto sem especificar indevidamente sua função.
- source_word: גִּדְּפוּ אֹתִי
  choice: blasfemaram contra mim
  rationale: Como Deus é o alvo explícito da fala abusiva, “blasfemaram” comunica sua gravidade teológica; a nota preserva o alcance mais amplo do verbo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama; “Yahweh” preserva o nome próprio divino sem substituí-lo por um título.
- issue: Sentido de גִּדְּפוּ quando Deus é o objeto
  choice: blasfemaram contra mim
  alternative: me insultaram; me desafiaram
  rationale: “Blasfemaram” preserva a gravidade da afronta verbal contra Deus, enquanto a nota registra que o verbo hebraico também comporta os matizes de insulto e desafio.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fórmula profética foi mantida em forma solene, sem arcaísmos pronominais; o marcador da nota aparece imediatamente após a expressão a que se refere.
