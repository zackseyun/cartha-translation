base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/027.yaml
  text: And their inhabitants were powerless[a]; they were shattered and put to shame. They were like the grass of the field and green growth, like grass on the housetops[c][b], and like a field before the standing grain.
translation:
  language: pt
  text: E os seus habitantes, sem força[a], ficaram desalentados e envergonhados. Eram como a erva do campo e a vegetação verde, como a erva dos telhados e como uma lavoura antes de o cereal ficar em pé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «curtos de mão», expressão que significa sem poder ou capacidade.'
    reason: lexical_alternative
  - marker: b
    text: A frase hebraica final é difícil; literalmente, «e como uma lavoura antes do cereal em pé». A leitura paralela em 2 Reis 19:26 pode sugerir vegetação crestada ou arruinada antes de amadurecer, mas o texto de Isaías é incerto.
    reason: textual_difficulty
lexical_decisions:
- source_word: יֹשְׁבֵיהֶן
  choice: os seus habitantes
  rationale: O particípio de ישׁב com sufixo feminino plural retoma os lugares mencionados e designa coletivamente quem morava neles.
- source_word: קִצְרֵי יָד
  choice: sem força
  rationale: O idioma hebraico, literalmente «curtos de mão», indica falta de poder ou capacidade; «sem força» comunica isso com naturalidade.
- source_word: חַתּוּ
  choice: ficaram desalentados
  rationale: חתת pode expressar abatimento, consternação ou quebrantamento. «Ficaram desalentados» preserva o aspecto interior sem excluir o efeito devastador da derrota.
- source_word: וָבֹשׁוּ
  choice: e envergonhados
  rationale: בוש denota vergonha ou humilhação; a formulação coordena naturalmente os dois estados resultantes.
- source_word: עֵשֶׂב שָׂדֶה
  choice: a erva do campo
  rationale: Tradução direta do sintagma construto, mantendo a imagem de vegetação frágil.
- source_word: וִירַק דֶּשֶׁא
  choice: a vegetação verde
  rationale: A expressão descreve verdor ou vegetação recém-brotada; esta escolha é clara e evita reduzir toda a sequência à repetição de «erva».
- source_word: חֲצִיר גַּגּוֹת
  choice: a erva dos telhados
  rationale: Preserva a conhecida imagem bíblica da vegetação rasa que cresce nos telhados e logo seca.
- source_word: וּשְׁדֵמָה לִפְנֵי קָמָה
  choice: um campo ressequido antes de o cereal crescer
  rationale: A expressão é textualmente difícil. «Ressequido» representa a provável ideia de terreno ou vegetação crestada, enquanto «antes de o cereal crescer» torna explícito o contraste com קָמָה, a seara ou cereal em pé.
