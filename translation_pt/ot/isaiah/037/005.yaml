lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Assim, ... foram
  rationale: O wayyiqtol de בוא dá continuidade à narrativa. Em português, “foram até” expressa naturalmente o deslocamento até Isaías; “assim” liga o acontecimento à ordem dada no contexto anterior.
- source_word: עַבְדֵי
  choice: servos
  rationale: O plural construto de עבד, em contexto régio, pode designar servos, auxiliares ou oficiais do rei. “Servos” preserva a amplitude lexical sem especificar um cargo.
- source_word: הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: do rei Ezequias
  rationale: A construção hebraica identifica Ezequias como rei. A formulação é natural e digna em português.
- source_word: אֶל
  choice: até
  rationale: A preposição marca o destino do movimento. Com o verbo “ir”, “até” torna explícita e natural a chegada ao destinatário.
- source_word: יְשַׁעְיָהוּ
  choice: Isaías
  rationale: Forma tradicional e amplamente reconhecida do nome do profeta em português.
