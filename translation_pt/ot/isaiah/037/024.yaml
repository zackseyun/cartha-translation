  text: בְּ/יַ֣ד עֲבָדֶי/ךָ֮ חֵרַ֣פְתָּ אֲדֹנָ/י֒ וַ/תֹּ֗אמֶר בְּ/רֹ֥ב רִכְבִּ֛/י אֲנִ֥י עָלִ֛יתִי מְר֥וֹם הָרִ֖ים יַרְכְּתֵ֣י לְבָנ֑וֹן וְ/אֶכְרֹ֞ת קוֹמַ֤ת אֲרָזָי/ו֙ מִבְחַ֣ר בְּרֹשָׁ֔י/ו וְ/אָבוֹא֙ מְר֣וֹם קִצּ֔/וֹ יַ֖עַר כַּרְמִלּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/024.yaml
  text: By your servants you have mocked the Lord[a], and you have said, ‘With my many chariots I myself have gone up to the heights of the mountains, to the remotest parts of Lebanon; I will cut down its tall cedars, its choicest cypresses, and I will enter its farthest height[c][b], its fruitful forest.’
translation:
  language: pt
  text: 'Por meio dos teus servos, insultaste o Senhor[a] e disseste: “Com os meus numerosos carros de guerra, eu mesmo subi ao alto dos montes, às partes mais remotas do Líbano. Cortarei seus cedros altos e seus melhores ciprestes[b]; entrarei em sua extremidade mais elevada, em sua floresta exuberante[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “afrontaste”, “zombaste do” ou “desafiaste”; o verbo hebraico transmite a ideia de insultar ou provocar com desprezo.
    reason: lexical_alternative
  - marker: b
    text: A identificação da árvore chamada em hebraico berosh é incerta; pode ser o cipreste, o abeto ou outra conífera.
    reason: lexical_alternative
  - marker: c
    text: Ou “em sua floresta fértil” ou “em sua floresta semelhante a um pomar”; a expressão hebraica reúne as ideias de floresta e de terra fértil e viçosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד עֲבָדֶיךָ
  choice: Por meio dos teus servos
  rationale: A expressão idiomática בְּיַד indica o meio ou agente. “Por meio dos teus servos” comunica isso naturalmente sem reproduzir literalmente “pela mão de”.
- source_word: חֵרַפְתָּ
  choice: insultaste
  rationale: O verbo חרף exprime afronta, escárnio ou provocação marcada por desprezo. “Insultaste” conserva a força ampla do termo; alternativas são registradas em nota.
- source_word: אֲדֹנָי
  choice: o Senhor
  rationale: O texto traz o título divino אֲדֹנָי, não o nome יהוה. “O Senhor” é a forma portuguesa natural para esse título.
- source_word: בְּרֹב רִכְבִּי
  choice: Com os meus numerosos carros
  rationale: רֹב denota grande quantidade, e רֶכֶב designa aqui os carros ou a força de carros. A formulação mantém a ostentação do poder militar.
- source_word: אֲנִי עָלִיתִי
  choice: eu mesmo subi
  rationale: O pronome explícito אֲנִי dá ênfase ao sujeito no discurso arrogante. “Eu mesmo” preserva essa autoafirmação.
- source_word: מְרוֹם הָרִים
  choice: ao alto dos montes
  rationale: מְרוֹם indica altura ou lugar elevado. A expressão é natural em português e mantém a imagem topográfica.
- source_word: יַרְכְּתֵי לְבָנוֹן
  choice: às partes mais remotas do Líbano
  rationale: יַרְכְּתֵי pode indicar recessos, extremidades ou regiões longínquas. “Partes mais remotas” expressa seu sentido idiomático neste contexto.
- source_word: קוֹמַת אֲרָזָיו
  choice: seus cedros imponentes
  rationale: קוֹמָה denota altura ou porte. “Cedros imponentes” transmite tanto a estatura quanto a majestade das árvores sem a rigidez de “a altura dos seus cedros”.
- source_word: מִבְחַר בְּרֹשָׁיו
  choice: seus ciprestes mais escolhidos
  rationale: מִבְחַר significa o que há de melhor ou mais seleto. בְּרוֹשׁ designa uma conífera cuja identificação botânica exata é incerta; “ciprestes” é uma opção tradicional e plausível, com a incerteza indicada em nota.
- source_word: מְרוֹם קִצּוֹ
  choice: seu cume mais distante
  rationale: A combinação reúne a ideia de altura com a de extremidade ou limite. A tradução conserva ambas sem decidir de modo excessivo se se trata do ponto mais alto ou mais remoto.
- source_word: יַעַר כַּרְמִלּוֹ
  choice: sua floresta exuberante
  rationale: יַעַר é “floresta”, enquanto כַּרְמֶל pode sugerir terra fértil, pomar ou vegetação viçosa. “Floresta exuberante” preserva a imagem florestal e a ideia de fertilidade, e a alternativa é explicada em nota.
theological_decisions:
- issue: Tradução do título divino אֲדֹנָי
  choice: o Senhor
  alternative: Senhor
  rationale: A tradução mantém o título presente no hebraico e não o substitui pelo nome pactual יהוה. O artigo é natural em português como objeto direto de “insultaste”.
translation_notes:
  register: Português atual, digno e acessível, com ampla legibilidade brasileira. O discurso direto mantém o tom arrogante do rei por meio de “eu mesmo” e dos verbos de conquista. Empregam-se formas de segunda pessoa coerentes (“teus”, “insultaste”), sem regionalismos marcados. As notas preservam as incertezas lexical e botânica do hebraico.
