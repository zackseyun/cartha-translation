  naturalness: O português é claro e de registro apropriado. “Carros de guerra” evita a ambiguidade moderna de “carros”; “os melhores ciprestes” e “cedros altos” são mais diretos e naturais sem reduzir o sentido do hebraico.
  terminology: “O Senhor” reproduz adequadamente אֲדֹנָי. “Ciprestes” é uma identificação possível de berosh, com a incerteza corretamente indicada em nota. “Floresta exuberante” é uma solução adequada para יַעַר כַּרְמִלּוֹ, desde que a nota mantenha as alternativas semânticas.
