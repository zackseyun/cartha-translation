revisions:
- from: 'Por meio dos teus servos, insultaste o Senhor[a] e disseste: “Com os meus numerosos carros, eu mesmo subi ao alto dos montes, às partes mais remotas do Líbano. Cortarei seus cedros imponentes e seus ciprestes mais escolhidos[b]; chegarei ao seu cume mais distante, à sua floresta exuberante[c].”'
  to: 'Por meio dos teus servos, insultaste o Senhor[a] e disseste: “Com os meus numerosos carros de guerra, eu mesmo subi ao alto dos montes, às partes mais remotas do Líbano. Cortarei seus cedros altos e seus melhores ciprestes[b]; entrarei em sua extremidade mais elevada, em sua floresta exuberante[c].”'
