  source_fidelity: 'A tradução reproduz com precisão a estrutura e o sentido do hebraico: o sinal é dirigido no singular ao destinatário imediato, enquanto a sequência agrícola emprega adequadamente o plural coletivo. «O que crescer por si mesmo» transmite סָפִיחַ, e «o que brotar disso» preserva, sem falsa precisão, a provável relação de שָׁחִיס com o crescimento anterior. A sequência «semeiem e colham, plantem vinhedos e comam o seu fruto» corresponde fielmente aos imperativos plurais e ao sufixo possessivo de «seu fruto».'
