  text: וְ/זֶה לְּ/ךָ֣ הָ/א֔וֹת אָכ֤וֹל הַ/שָּׁנָה֙ סָפִ֔יחַ וּ/בַ/שָּׁנָ֥ה הַ/שֵּׁנִ֖ית שָׁחִ֑יס וּ/בַ/שָּׁנָ֣ה הַ/שְּׁלִישִׁ֗ית זִרְע֧וּ וְ/קִצְר֛וּ וְ/נִטְע֥וּ כְרָמִ֖ים ו/אכול פִרְיָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/030.yaml
  text: 'And this will be the sign for you: this year eat what grows by itself[a], and in the second year what springs from that; but in the third year sow and reap, and plant vineyards and eat their fruit.'
translation:
  language: pt
  text: 'E este será o sinal para você: neste ano, comam o que crescer por si mesmo; no segundo ano, o que brotar disso[a]. Mas, no terceiro ano, semeiem e colham, plantem vinhedos e comam o seu fruto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a segunda brotação» ou «o rebrote». O termo hebraico é raro e se refere à produção que surge sem a semeadura normal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה לְךָ הָאוֹת
  choice: E este será o sinal para você
  rationale: A construção nominal hebraica admite sentido futuro no contexto; o artigo definido em הָאוֹת favorece «o sinal». O singular «você» preserva a mudança de número e a referência imediata a Ezequias.
- source_word: אָכוֹל
  choice: comam
  rationale: O infinitivo absoluto tem força imperativa ou preditiva. O plural em português explicita que a instrução seguinte se dirige coletivamente ao povo, como indicam os verbos plurais posteriores.
- source_word: סָפִיחַ
  choice: o que crescer por si mesmo
  rationale: Designa a produção espontânea, sem semeadura normal; a expressão é clara e conserva a imagem agrícola.
- source_word: שָׁחִיס
  choice: o que brotar disso
  rationale: Termo agrícola raro, provavelmente relativo ao crescimento espontâneo do segundo ano. A formulação mantém a provável ligação com a produção anterior sem impor precisão inexistente.
- source_word: זִרְעוּ וְקִצְרוּ
  choice: semeiem e colham
  rationale: Preserva a sequência agrícola e os imperativos masculinos plurais, em linguagem portuguesa corrente.
- source_word: וְנִטְעוּ כְרָמִים
  choice: plantem vinhedos
  rationale: Tradução natural e direta da expressão hebraica.
- source_word: וְאִכְלוּ פִרְיָם
  choice: comam o seu fruto
  rationale: O pronome retoma os vinhedos; a construção conserva o singular coletivo פִרְיָם de modo natural em português.
theological_decisions:
- issue: Natureza do sinal dado a Ezequias
  choice: Manter «o sinal» sem explicar seu mecanismo ou momento de cumprimento
  alternative: Explicitar que se trata de uma garantia milagrosa ou de uma cronologia específica do cerco
  rationale: O versículo apresenta a sequência agrícola como sinal, mas não define aqui exatamente como ela confirma a promessa; a tradução não deve resolver essa tensão interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega «você» no singular para o destinatário imediato e imperativos plurais para a orientação ao povo. «Vinhedos» é corrente e natural; a nota preserva a incerteza do raro termo agrícola.
