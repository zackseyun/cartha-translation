source:
  edition: WLC
  text: אָמְנָ֖ם יְהוָ֑ה הֶחֱרִ֜יבוּ מַלְכֵ֥י אַשּׁ֛וּר אֶת כָּל הָ/אֲרָצ֖וֹת וְ/אֶת אַרְצָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/018.yaml
  text: Truly[a], O Yahweh, the kings of Assyria have laid waste all the lands and their own land[b],
translation:
  language: pt
  text: 'É verdade, ó Yahweh: os reis da Assíria devastaram todas as terras[a] e a terra deles[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os países”. A palavra hebraica pode designar terras, territórios ou países, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “a terra deles”. Alguns entendem o singular em sentido coletivo; uma passagem paralela é muitas vezes traduzida como “as terras deles”.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָמְנָם
  choice: É verdade
  rationale: Introduz uma confirmação enfática, com possível força concessiva no contexto da oração de Ezequias. A expressão é clara e natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הֶחֱרִיבוּ
  choice: devastaram
  rationale: O hifil de חרב indica causar ruína ou desolação; “devastaram” comunica com naturalidade a destruição militar.
- source_word: מַלְכֵי אַשּׁוּר
  choice: os reis da Assíria
  rationale: Reproduz de modo direto e idiomático a construção hebraica.
- source_word: אֶת כָּל הָאֲרָצוֹת
  choice: todas as terras
  rationale: Mantém a amplitude do plural de אֶרֶץ, que no contexto pode designar terras, territórios ou países, sem trocar território por povo.
- source_word: וְאֶת אַרְצָם
  choice: e a terra deles
  rationale: Segue o texto hebraico massorético fornecido, que apresenta o substantivo no singular com sufixo de terceira pessoa masculina plural, sem normalizá-lo silenciosamente para o plural.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino e evita substituí-lo por um título.
- issue: A aparente tensão entre “todas as terras” e “a terra deles”
  choice: Preservar o singular “a terra deles”
  alternative: “as terras deles”
  rationale: A forma apontada no texto-fonte é singular. A tradução conserva essa leitura e registra em nota a possível compreensão coletiva, em vez de resolver a dificuldade no corpo do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “É verdade” soa natural na oração; os dois-pontos marcam a afirmação que se segue. A vírgula final preserva a continuidade sintática com o versículo seguinte.
