  yaml_path: translation/ot/isaiah/037/037.yaml
  text: So Sennacherib king of Assyria departed and went and returned[a], and dwelt in Nineveh.
translation:
  language: pt
  text: Então Senaqueribe, rei da Assíria, partiu, foi e voltou, e habitou em Nínive.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “morou em Nínive”.'
    reason: O verbo hebraico pode indicar habitar, morar ou residir.
lexical_decisions:
- source_word: וַיִּסַּע
  choice: partiu
  rationale: O verbo נסע descreve o início de uma viagem ou retirada. “Partiu” é natural em português e não acrescenta a imagem específica de levantar acampamento.
- source_word: וַיֵּלֶךְ
  choice: seguiu seu caminho
  rationale: O verbo הלך significa “ir”. Esta formulação conserva o segundo verbo de movimento da sequência hebraica sem produzir a repetição pouco natural “partiu e foi”.
- source_word: וַיָּשָׁב
  choice: voltou
  rationale: שׁוב indica retorno. “Voltou” preserva o sentido sem explicitar um destino que o texto só informa na oração seguinte.
- source_word: סַנְחֵרִיב
  choice: Senaqueribe
  rationale: Forma tradicional e amplamente reconhecida do nome do rei assírio em português.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: rei da Assíria
  rationale: Reproduz naturalmente a cadeia construta que identifica o cargo e o reino de Senaqueribe.
- source_word: וַיֵּשֶׁב
  choice: ficou morando
  rationale: ישׁב pode significar sentar-se, permanecer, habitar ou morar. No contexto, a expressão indica residência em Nínive e soa natural no português atual.
- source_word: בְּנִינְוֵה
  choice: em Nínive
  rationale: Tradução direta da expressão locativa, usando a forma tradicional do nome da cidade em português.
