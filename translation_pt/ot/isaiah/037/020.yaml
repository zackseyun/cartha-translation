source:
  edition: WLC
  text: וְ/עַתָּה֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ הוֹשִׁיעֵ֖/נוּ מִ/יָד֑/וֹ וְ/יֵֽדְעוּ֙ כָּל מַמְלְכ֣וֹת הָ/אָ֔רֶץ כִּֽי אַתָּ֥ה יְהוָ֖ה לְ/בַדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/020.yaml
  text: And now[a], Yahweh our God, save us from his hand[b], so that all the kingdoms of the earth may know that you alone are Yahweh.
translation:
  language: pt
  text: E agora, Yahweh, nosso Deus, salva-nos da mão dele, para que todos os reinos da terra saibam que somente tu és Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a conjunção quanto o marcador temporal que introduz o pedido culminante, com formulação natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Reproduz diretamente o substantivo com o sufixo da primeira pessoa do plural e conserva o caráter comunitário da oração.
- source_word: הוֹשִׁיעֵנוּ
  choice: salva-nos
  rationale: O imperativo hifil de ישׁע pede resgate ou livramento; “salva-nos” é direto, natural e adequado à linguagem de oração.
- source_word: מִיָדוֹ
  choice: da mão dele
  rationale: Mantém a imagem hebraica da mão como poder ou domínio. O pronome retoma o rei da Assíria no contexto.
- source_word: וְיֵדְעוּ
  choice: para que ... saibam
  rationale: No contexto, a forma verbal após o imperativo comunica a finalidade ou o resultado pretendido da salvação pedida.
- source_word: כָּל מַמְלְכוֹת הָאָרֶץ
  choice: todos os reinos da terra
  rationale: A expressão tem alcance internacional no contexto; “terra” preserva a formulação ampla e tradicional sem restringi-la à terra de Israel.
- source_word: כִּי
  choice: que
  rationale: Introduz naturalmente, em português, o conteúdo daquilo que os reinos devem reconhecer.
- source_word: אַתָּה יְהוָה לְבַדֶּךָ
  choice: somente tu és Yahweh
  rationale: Coloca a ênfase de לְבַדֶּךָ sobre o sujeito e preserva a afirmação exclusiva sem acrescentar explicitamente “Deus”, palavra que não aparece nesta oração final.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. A transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido exclusivo de לְבַדֶּךָ na oração final
  choice: somente tu és Yahweh
  alternative: tu, Yahweh, és o único; somente tu és Deus
  rationale: A escolha conserva a exclusividade afirmada pelo hebraico e evita inserir “Deus” na oração, embora essa seja uma explicitação contextual plausível de seu sentido teológico.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. A colocação pronominal em “salva-nos” mantém o tom de oração sem soar arcaica; “da mão dele” conserva a metáfora hebraica de modo inteligível.
