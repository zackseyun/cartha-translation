  text: הַטֵּ֨ה יְהוָ֤ה אָזְנְ/ךָ֙ וּֽ/שְׁמָ֔ע פְּקַ֧ח יְהוָ֛ה עֵינֶ֖/ךָ וּ/רְאֵ֑ה וּ/שְׁמַ֗ע אֵ֚ת כָּל דִּבְרֵ֣י סַנְחֵרִ֔יב אֲשֶׁ֣ר שָׁלַ֔ח לְ/חָרֵ֖ף אֱלֹהִ֥ים חָֽי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/017.yaml
  text: Incline your ear, O LORD, and hear; open your eyes, O LORD, and see; and hear all the words of Sennacherib, which he has sent to mock the living God.
translation:
  language: pt
  text: Inclina o teu ouvido, SENHOR, e ouve; abre os teus olhos, SENHOR, e vê. Ouve todas as palavras de Senaqueribe, que ele enviou para insultar o Deus vivo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַטֵּה ... אָזְנְךָ
  choice: Inclina ... o teu ouvido
  rationale: Preserva a imagem hebraica de voltar atentamente o ouvido, em formulação natural e digna em português.
- source_word: דִּבְרֵי סַנְחֵרִיב
  choice: as palavras de Senaqueribe
  rationale: Tradução direta de דִּבְרֵי; o contexto esclarece que são palavras transmitidas por mensageiros.
- source_word: אֲשֶׁר שָׁלַח
  choice: que ele mandou dizer
  rationale: Expressa de modo natural que Senaqueribe enviou a mensagem, sem sugerir que as próprias palavras sejam literalmente o objeto enviado.
- source_word: לְחָרֵף
  choice: para insultar
  rationale: O verbo חרף denota afrontar, ultrajar ou insultar; 'insultar' comunica claramente a hostilidade dirigida contra Deus.
- source_word: אֱלֹהִים חָי
  choice: o Deus vivo
  rationale: Equivalência direta da expressão hebraica, preservando seu contraste implícito com deuses sem vida.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o Tetragrama por SENHOR em versaletes, sem acrescentar uma vocalização ao texto corrido.
- issue: Pedido para Deus ouvir palavras dirigidas contra ele
  choice: para insultar o Deus vivo
  alternative: para zombar do Deus vivo
  rationale: '''Insultar'' preserva o sentido amplo de afronta e ultraje de חרף sem limitar a ação especificamente ao escárnio.'
translation_notes:
  register: Português moderno, claro e solene, com tratamento por 'tu' coerente com a oração bíblica. A repetição de 'SENHOR' e dos imperativos foi mantida para conservar o paralelismo e a intensidade do hebraico.
