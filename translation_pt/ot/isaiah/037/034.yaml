  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בַּ/דֶּ֥רֶךְ אֲשֶׁר בָּ֖א בָּ֣/הּ יָשׁ֑וּב וְ/אֶל הָ/עִ֥יר הַ/זֹּ֛את לֹ֥א יָב֖וֹא נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/034.yaml
  text: By the way that he came, by it he will return, and he will not come into this city, declares Yahweh.
translation:
  language: pt
  text: Pelo mesmo caminho por onde veio, ele voltará; não entrará nesta cidade — declaração de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּדֶּרֶךְ אֲשֶׁר בָּא בָּהּ
  choice: Pelo mesmo caminho por onde veio
  rationale: דֶּרֶךְ designa caminho, estrada ou rota. A construção portuguesa “pelo mesmo caminho por onde veio” explicita naturalmente que בָּהּ retoma o caminho e preserva a ênfase na mesma rota, sem a formulação pouco idiomática “por ele”.
- source_word: יָשׁוּב
  choice: ele voltará
  rationale: שׁוּב indica voltar ou retornar; “voltará” é claro, corrente e adequado ao contexto de regressar pela rota de chegada.
- source_word: וְאֶל הָעִיר הַזֹּאת לֹא יָבוֹא
  choice: não entrará nesta cidade
  rationale: Com אֶל e o destino expresso, בוא comunica movimento para dentro da cidade. “Entrará” é a forma portuguesa mais natural e inequívoca, embora não repita lexicalmente o anterior “veio”.
- source_word: נְאֻם יְהוָה
  choice: declaração de Yahweh
  rationale: נְאֻם é uma fórmula profética de pronunciamento divino; “declaração de Yahweh” preserva sua forma nominal e apresenta diretamente o nome divino יְהוָה.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama. “Yahweh” representa o nome próprio diretamente, em vez de substituí-lo por um título, e evita impor uma tradição denominacional específica.
- issue: Força da fórmula נְאֻם יְהוָה
  choice: declaração de Yahweh
  alternative: diz Yahweh; oráculo de Yahweh
  rationale: A opção mantém o caráter solene e profético da fórmula nominal hebraica sem acrescentar conteúdo interpretativo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Pelo mesmo caminho por onde veio” reproduz de modo idiomático a retomada enfática do caminho. O ponto e vírgula conserva a estreita relação entre o retorno do invasor e sua não entrada na cidade; o travessão destaca a fórmula profética final.
