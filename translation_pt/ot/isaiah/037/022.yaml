base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/022.yaml
  text: 'This is the word that the LORD has spoken concerning him: ‘Virgin Daughter Zion despises you and mocks you; Daughter Jerusalem shakes her head behind you.’'
translation:
  language: pt
  text: 'Esta é a palavra que o SENHOR falou a respeito dele: “A virgem, filha de Sião, despreza e zomba de você; a filha de Jerusalém balança a cabeça atrás de você.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida para o nome divino, preservando sua distinção por versaletes.
- source_word: בְּתוּלַת בַּת־צִיּוֹן
  choice: a virgem, filha de Sião
  rationale: Mantém os dois elementos da personificação hebraica sem produzir a formulação pouco natural “Virgem Filha Sião” em português.
- source_word: בָּזָה לְךָ לָעֲגָה לְךָ
  choice: despreza e zomba de você
  rationale: Reproduz de modo direto os dois verbos paralelos e o objeto de escárnio.
- source_word: אַחֲרֶיךָ רֹאשׁ הֵנִיעָה
  choice: balança a cabeça pelas suas costas
  rationale: Preserva tanto o gesto de desprezo quanto a ideia de ele ocorrer depois que o destinatário se afasta, sem explicitar além do hebraico.
theological_decisions:
- issue: Personificação de Sião e Jerusalém
  choice: Manter “a virgem, filha de Sião” e “a filha de Jerusalém” como designações poéticas paralelas.
  alternative: Interpretar diretamente como “o povo de Sião/Jerusalém”.
  rationale: O texto personifica a cidade e não identifica explicitamente a figura com uma categoria interpretativa adicional.
- issue: Referente pronominal
  choice: Preservar “a respeito dele” na introdução e a segunda pessoa dentro da fala citada.
  alternative: Nomear explicitamente o rei da Assíria.
  rationale: O hebraico usa pronome na introdução e passa à interpelação direta; manter essa alternância preserva a forma retórica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A ordem poética e o paralelismo foram preservados sem sacrificar a naturalidade.
