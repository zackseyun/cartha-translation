base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/009.yaml
  text: And he heard concerning Tirhakah king of Cush[a], saying, “He has come out to fight against you.” And when he heard, he sent messengers to Hezekiah, saying[b],
translation:
  language: pt
  text: 'E ele ouviu a respeito de Tiraca, rei de Cuxe[a]: “Ele saiu para lutar contra você[b].” Quando ouviu isso, enviou mensageiros a Ezequias, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “rei da Etiópia”. O nome hebraico é Cuxe, que pode abranger geograficamente regiões ao sul do Egito, frequentemente associadas à antiga Núbia e à Etiópia.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “com você”; neste contexto militar, a expressão significa “contra você”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע עַל ... לֵאמֹר
  choice: Então ele ouviu dizer a respeito de...
  rationale: Mantém o verbo שׁמע e a introdução da notícia por לֵאמֹר, ao mesmo tempo que expressa em português natural a progressão narrativa marcada por וַ.
- source_word: תִּרְהָקָה
  choice: Tiraca
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio.
- source_word: מֶלֶךְ כּוּשׁ
  choice: rei de Cuxe
  rationale: Preserva o topônimo hebraico כּוּשׁ, sem identificá-lo de modo simplista com um país moderno; a alternativa tradicional é esclarecida em nota.
- source_word: יָצָא לְהִלָּחֵם
  choice: saiu para lutar
  rationale: Reproduz diretamente o movimento indicado por יצא e o sentido militar de לחם, com linguagem portuguesa corrente.
- source_word: אִתָּךְ
  choice: contra você
  rationale: Embora אֵת possa ter o sentido básico de 'com', no contexto do verbo 'lutar' a relação é hostil, e 'contra você' comunica isso naturalmente.
- source_word: וַיִּשְׁמַע
  choice: Quando soube disso
  rationale: O segundo uso de שׁמע retoma a notícia recém-mencionada. 'Soube disso' evita repetição pesada e explicita apenas a referência já presente no contexto.
- source_word: וַיִּשְׁלַח מַלְאָכִים
  choice: enviou mensageiros
  rationale: מַלְאָכִים designa aqui emissários humanos em um contexto político-militar; 'mensageiros' é amplo e exato.
- source_word: אֶל חִזְקִיָּהוּ לֵאמֹר
  choice: 'a Ezequias, dizendo:'
  rationale: Usa a forma portuguesa convencional do nome e conserva a fórmula hebraica que introduz o discurso do versículo seguinte.
