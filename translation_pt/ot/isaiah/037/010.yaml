  text: כֹּ֣ה תֹאמְר֗וּ/ן אֶל חִזְקִיָּ֤הוּ מֶֽלֶךְ יְהוּדָה֙ לֵ/אמֹ֔ר אַל יַשִּֽׁאֲ/ךָ֣ אֱלֹהֶ֔י/ךָ אֲשֶׁ֥ר אַתָּ֛ה בּוֹטֵ֥חַ בּ֖/וֹ לֵ/אמֹ֑ר לֹ֤א תִנָּתֵן֙ יְר֣וּשָׁלִַ֔ם בְּ/יַ֖ד מֶ֥לֶךְ אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/010.yaml
  text: 'Thus you shall say to Hezekiah king of Judah: ‘Do not let your God[a], in whom you trust, deceive you, saying[b], “Jerusalem will not be given into the hand of the king of Assyria.”’'
translation:
  language: pt
  text: 'Assim vocês dirão a Ezequias, rei de Judá: “Não deixe que o seu Deus, em quem você confia, o engane[a], dizendo: ‘Jerusalém não será entregue nas mãos do rei da Assíria’[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o desvie”. O verbo hebraico pode significar “enganar” ou “levar ao erro”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “na mão do rei da Assíria”, expressão que significa “sob o poder do rei da Assíria”.
    reason: idiom_explanation
lexical_decisions:
- source_word: כֹּה תֹאמְרוּן
  choice: Assim vocês dirão
  rationale: Preserva a fórmula de instrução ao mensageiro e o valor diretivo do imperfeito, em português natural e digno.
- source_word: חִזְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: Ezequias, rei de Judá
  rationale: Emprega as formas portuguesas tradicionais dos nomes e mantém o título real em aposição.
- source_word: אַל יַשִּׁאֲךָ
  choice: Não deixe que ... o engane
  rationale: O hifil de נשׁא exprime enganar ou desviar; esta formulação conserva a força da acusação hostil e o valor proibitivo.
- source_word: אֲשֶׁר אַתָּה בּוֹטֵחַ בּוֹ
  choice: em quem você confia
  rationale: Traduz diretamente בטח e mantém a referência pessoal singular a Ezequias.
- source_word: לֹא תִנָּתֵן
  choice: não será entregue
  rationale: Mantém a voz passiva do nifal de נתן sem explicitar além do texto a ideia implícita de conquista.
- source_word: בְּיַד מֶלֶךְ אַשּׁוּר
  choice: nas mãos do rei da Assíria
  rationale: Conserva a imagem idiomática hebraica, que também é compreensível em português como submissão ao poder de alguém.
theological_decisions:
- issue: A provocação assíria apresenta Deus como possível enganador
  choice: Não deixe que o seu Deus ... o engane
  alternative: Não deixe que o seu Deus ... o desvie
  rationale: A fala hostil deve conservar sua força blasfema sem ser suavizada nem endossada pelo narrador; o contexto distingue a acusação assíria da verdade teológica.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. “Vocês” reflete o destinatário plural da instrução, enquanto “você/o/seu” preserva a referência singular a Ezequias. As aspas distinguem a mensagem, a ordem citada e a afirmação atribuída a Deus.
