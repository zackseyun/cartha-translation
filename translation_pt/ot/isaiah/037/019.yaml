  text: וְ/נָתֹ֥ן אֶת אֱלֹהֵי/הֶ֖ם בָּ/אֵ֑שׁ כִּי֩ לֹ֨א אֱלֹהִ֜ים הֵ֗מָּה כִּ֣י אִם מַעֲשֵׂ֧ה יְדֵֽי אָדָ֛ם עֵ֥ץ וָ/אֶ֖בֶן וַֽ/יְאַבְּדֽוּ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/019.yaml
  text: and have put their gods into the fire[a], for they were not gods but the work of human hands, wood and stone; so they destroyed them.
translation:
  language: pt
  text: e lançaram no fogo os deuses deles[a], pois não eram deuses, mas obra de mãos humanas, madeira e pedra; por isso os destruíram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os ídolos deles”. O hebraico diz “os deuses deles” e logo explica que não eram deuses de verdade, mas objetos feitos por seres humanos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתֹן
  choice: e lançaram
  rationale: Embora נתן signifique literalmente “dar/pôr”, na construção com “no fogo” expressa a ação de lançar ou colocar algo no fogo para destruí-lo.
- source_word: אֱלֹהֵיהֶם
  choice: os deuses deles
  rationale: Preserva a designação direta do hebraico, enquanto a oração seguinte nega que fossem realmente deuses.
- source_word: בָּאֵשׁ
  choice: no fogo
  rationale: Em português, com “lançar”, “no fogo” expressa naturalmente o movimento para dentro do fogo.
- source_word: כִּי לֹא אֱלֹהִים הֵמָּה
  choice: pois não eram deuses
  rationale: Apresenta a razão da destruição e mantém o enquadramento passado da oração de Ezequias.
- source_word: כִּי אִם
  choice: mas
  rationale: Conjunção adversativa natural que introduz o contraste entre deuses verdadeiros e objetos fabricados.
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  choice: obra de mãos humanas
  rationale: Reproduz de modo conciso o hebraico e conserva o contraste entre divindade e fabricação humana.
- source_word: עֵץ וָאֶבֶן
  choice: madeira e pedra
  rationale: Mantém a especificação apositiva dos materiais de que os objetos eram feitos.
- source_word: וַיְאַבְּדוּם
  choice: por isso os destruíram
  rationale: O verbo tem sentido causativo de destruir; “por isso” explicita a consequência lógica já presente no contexto.
theological_decisions:
- issue: Status das divindades das nações
  choice: “os deuses deles”, seguido de “não eram deuses”
  alternative: “os ídolos deles”
  rationale: O hebraico primeiro emprega a designação dada a esses objetos por seus adoradores e logo nega sua verdadeira divindade. A tradução preserva essa força polêmica sem antecipar a explicação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Os deuses deles” evita a possível ambiguidade possessiva de “seus deuses”.
