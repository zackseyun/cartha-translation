base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/026.yaml
  text: Have you not heard? Long ago I made it; from days of old I formed it. Now I have brought it to pass[a], that you should lay waste fortified cities into heaps of ruins.
translation:
  language: pt
  text: Você não ouviu? Há muito tempo eu o fiz; desde a antiguidade o formei. Agora o realizei[a], para que você reduzisse cidades fortificadas a montões de ruínas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “agora eu a trouxe”. A expressão indica que Deus levou à realização aquilo que havia feito e formado desde a antiguidade.
    reason: esclarecimento idiomático e lexical
lexical_decisions:
- source_word: הֲלוֹא שָׁמַעְתָּ
  choice: Você não ouviu?
  rationale: Preserva a pergunta retórica, dirigida ao rei assírio, e sua força de repreensão.
- source_word: לְמֵרָחוֹק
  choice: Há muito tempo
  rationale: 'A expressão literalmente espacial, ''de longe'', tem aqui sentido temporal: um passado remoto.'
- source_word: אֹתָהּ עָשִׂיתִי
  choice: eu determinei isso
  rationale: No contexto, o objeto feminino singular remete ao acontecimento ou propósito divino. 'Determinei isso' comunica a ação intencional de Deus com mais naturalidade em português do que 'fiz isso', sem reduzi-la a mera presciência.
- source_word: מִימֵי קֶדֶם וִיצַרְתִּיהָ
  choice: desde os dias antigos eu o formei
  rationale: Mantém a imagem de formar ou modelar expressa por יצר e o tom elevado da locução temporal.
- source_word: עַתָּה הֲבֵאתִיהָ
  choice: Agora fiz com que acontecesse
  rationale: 'Expressa o valor causativo de בוא no hifil: Deus levou à realização histórica aquilo que havia estabelecido anteriormente.'
- source_word: וּתְהִי
  choice: se tornaram
  rationale: Entende a forma como introdução do resultado produzido pela ação divina, sem inserir desnecessariamente um agente de segunda pessoa no verbo final.
- source_word: לְהַשְׁאוֹת
  choice: ruínas
  rationale: O infinitivo ligado à desolação é representado idiomaticamente no predicativo 'montões de ruínas'; a construção hebraica do trecho final é compacta e difícil.
- source_word: גַּלִּים נִצִּים עָרִים בְּצֻרוֹת
  choice: cidades fortificadas se tornaram montões de ruínas
  rationale: Reproduz o sentido contextual de cidades fortificadas reduzidas a montes de escombros, em uma ordem natural em português.
theological_decisions:
- issue: Soberania divina sobre as conquistas assírias
  choice: A ação histórica é apresentada como determinada e efetivada por Deus desde a antiguidade.
  alternative: Entender a passagem apenas como afirmação da presciência divina.
  rationale: A sequência de ações divinas — fazer ou determinar, formar e agora fazer acontecer — atribui a realização do evento ao propósito ativo de Deus, preservando a tensão do texto sem explicação doutrinária adicional.
- issue: Agente no resultado final
  choice: Não explicitar 'você' como sujeito de 'devastar'; apresentar as cidades como tornando-se ruínas.
  alternative: “para que você reduzisse cidades fortificadas a montões de ruínas”
  rationale: Embora o rei assírio seja o interlocutor e agente histórico no contexto, o hebraico desta oração não traz explicitamente um pronome de segunda pessoa. A formulação escolhida preserva essa ambiguidade sintática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A redação conserva o paralelismo temporal e evita tanto arcaísmos quanto uma explicitação indevida do agente na oração final.
