  text: וַ/יִּתְפַּלֵּל֙ חִזְקִיָּ֔הוּ אֶל יְהוָ֖ה לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/015.yaml
  text: 'And Hezekiah prayed to Yahweh[a], saying:'
translation:
  language: pt
  text: 'E Ezequias orou a Yahweh[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido por “SENHOR”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: orou
  rationale: O hitpael de פלל indica aqui o ato de orar; “orou” é a forma narrativa mais natural e direta em português.
- source_word: חִזְקִיָּהוּ
  choice: Ezequias
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֶל
  choice: a
  rationale: A preposição marca o destinatário da oração; “orar a” expressa isso de modo claro e idiomático.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo introduz o conteúdo da oração; “dizendo” conserva de maneira concisa a ligação formal com a fala seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo silenciosamente por um título; a nota registra a tradução tradicional.
translation_notes:
  register: Português moderno, claro e digno, com estrutura narrativa próxima do hebraico. O nome Ezequias segue o uso bíblico consagrado em português; “dizendo” mantém a fórmula introdutória sem expansão.
