  text: וְ/יָ֨סְפָ֜ה פְּלֵיטַ֧ת בֵּית יְהוּדָ֛ה הַ/נִּשְׁאָרָ֖ה שֹׁ֣רֶשׁ לְ/מָ֑טָּה וְ/עָשָׂ֥ה פְרִ֖י לְ/מָֽעְלָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/031.yaml
  text: And the surviving remnant of the house of Judah will again take root downward and bear fruit upward[a].
translation:
  language: pt
  text: E o remanescente sobrevivente da casa de Judá[a] voltará a lançar raízes para baixo e a dar fruto para cima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os sobreviventes da casa de Judá que restarem”.'
    reason: Alternativa lexical que explicita separadamente os termos hebraicos para os que escaparam e os que permaneceram.
lexical_decisions:
- source_word: וְיָסְפָה
  choice: voltará a
  rationale: O verbo יסף indica aqui que o remanescente fará isso novamente ou de modo renovado; “voltará a” expressa naturalmente essa continuidade futura.
- source_word: פְּלֵיטַת ... הַנִּשְׁאָרָה
  choice: o remanescente sobrevivente
  rationale: A expressão reúne a ideia de um grupo que escapou da calamidade e permaneceu depois dela, sem eliminar o sentido coletivo de “remanescente”.
- source_word: בֵּית יְהוּדָה
  choice: a casa de Judá
  rationale: Preserva a expressão nacional e dinástica do hebraico, em vez de reduzi-la simplesmente a “Judá”.
- source_word: שֹׁרֶשׁ לְמָטָּה
  choice: lançar raízes para baixo
  rationale: Transforma o substantivo hebraico “raiz” em uma locução verbal idiomática em português, mantendo a direção e a imagem agrícola.
- source_word: וְעָשָׂה פְרִי לְמָעְלָה
  choice: e a dar fruto para cima
  rationale: “Dar fruto” é a combinação natural em português e conserva o paralelismo vertical entre raízes embaixo e fruto em cima.
theological_decisions:
- issue: Imagem metafórica da restauração
  choice: Manter a imagem agrícola de lançar raízes para baixo e dar fruto para cima.
  alternative: Explicitar o sentido como “será firmemente estabelecido e prosperará”.
  rationale: O texto hebraico apresenta uma imagem concreta da renovada estabilidade e prosperidade de Judá; explicá-la de forma abstrata reduziria sua força poética e preservaria menos da ambiguidade metafórica.
translation_notes:
  register: Português moderno, claro e digno, com a expressão bíblica tradicional “casa de Judá”. A construção mantém o paralelismo poético “para baixo/para cima” e evita linguagem excessivamente técnica.
