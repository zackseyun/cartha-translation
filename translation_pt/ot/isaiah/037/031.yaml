  source_fidelity: 'A tradução preserva adequadamente a sequência e a imagem do hebraico: o remanescente de Judá, caracterizado como sobrevivente, voltará a enraizar-se abaixo e a produzir fruto acima. “Voltará a” representa bem o valor continuativo/renovado de וְיָסְפָה, sem introduzir interpretação adicional.'
  naturalness: O português é claro, moderno e de registro bíblico apropriado. “Remanescente sobrevivente” reproduz uma ênfase dupla presente no hebraico; embora levemente redundante em prosa comum, é aceitável e expressivo neste contexto poético-profético. “Lançar raízes para baixo” e “dar fruto para cima” conservam o paralelismo vertical de modo natural.
  terminology: “Casa de Judá” mantém a expressão coletiva e histórico-dinástica do texto. “Remanescente”, “raízes” e “fruto” são escolhas terminologicamente fiéis e não explicam indevidamente a metáfora como restauração política ou prosperidade material.
