base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/002.yaml
  text: Then he sent Eliakim[a], who was over the household, and Shebna the scribe, and the elders of the priests, covered with sackcloth, to Isaiah son of Amoz[b], the prophet.
translation:
  language: pt
  text: Então ele enviou Eliaquim, encarregado da casa real[a], Sebna, o escriba, e os anciãos dos sacerdotes, todos vestidos de pano de saco[b], a Isaías, filho de Amoz, o profeta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica significa literalmente “que estava sobre a casa” e era um título oficial do responsável pela casa ou administração real.
    reason: cultural_note
  - marker: b
    text: Também pode ser traduzido como “cobertos de pano de saco” ou “usando pano de saco”. Era um sinal de luto ou humilhação.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Então ele enviou
  rationale: O wayyiqtol dá continuidade à narrativa; “Então” expressa naturalmente a sequência sem acrescentar uma relação causal.
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: encarregado da casa real
  rationale: A expressão designa um alto funcionário responsável pela casa ou administração real. “Casa real” conserva a imagem hebraica e esclarece o contexto institucional sem reduzi-la apenas ao edifício do palácio.
- source_word: הַסּוֹפֵר
  choice: o escriba
  rationale: Equivalente direto que preserva a amplitude do cargo, o qual podia incluir funções de secretário real.
- source_word: זִקְנֵי הַכֹּהֲנִים
  choice: os anciãos dos sacerdotes
  rationale: Mantém a construção hebraica e não decide se eram sacerdotes idosos ou líderes reconhecidos do grupo sacerdotal.
- source_word: מִתְכַּסִּים בַּשַּׂקִּים
  choice: vestidos de pano de saco
  rationale: Expressa de modo natural o estado descrito pelo particípio e comunica o sinal público de luto ou humilhação.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: Isaías, filho de Amoz, o profeta
  rationale: Reproduz o nome, o patronímico e o título definido, sem alterar a identificação de Isaías.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. Mantiveram-se “escriba” e “anciãos dos sacerdotes” para não especificar além do hebraico as funções desses grupos; as notas esclarecem o título cortesão e a imagem do pano de saco.
