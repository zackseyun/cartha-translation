  text: וְ/שִׁבְתְּ/ךָ֛ וְ/צֵאתְ/ךָ֥ וּ/בוֹאֲ/ךָ֖ יָדָ֑עְתִּי וְ/אֵ֖ת הִֽתְרַגֶּזְ/ךָ֥ אֵלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/028.yaml
  text: But I know your sitting down[a], your going out, your coming in, and your raging against me.
translation:
  language: pt
  text: Mas eu conheço o seu sentar-se[a], o seu sair, o seu entrar e o seu furor contra mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a sua permanência”. O hebraico emprega uma sequência convencional que abrange a vida estabelecida e os movimentos de uma pessoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁבְתְּךָ
  choice: o seu sentar-se
  rationale: Preserva a imagem concreta de ישׁב e, na sequência com sair e entrar, pode abranger tanto a permanência quanto os movimentos cotidianos da pessoa.
- source_word: וְצֵאתְךָ
  choice: o seu sair
  rationale: Tradução direta de יצא, em par idiomático com 'entrar', mantendo a imagem de movimento.
- source_word: וּבוֹאֲךָ
  choice: o seu entrar
  rationale: Tradução direta de בוא e contraparte natural de 'sair' em português.
- source_word: יָדָעְתִּי
  choice: eu conheço
  rationale: O perfeito qal expressa aqui conhecimento completo e vigente; o presente comunica isso naturalmente em português.
- source_word: הִתְרַגֶּזְךָ
  choice: o seu furor
  rationale: O hitpael de רגז denota agitação intensa ou fúria; 'furor' exprime a hostilidade do termo sem reduzi-lo a simples inquietação.
- source_word: אֵלַי
  choice: contra mim
  rationale: Embora אֶל normalmente indique direção, o contexto hostil de 'furor' pede em português a relação adversativa 'contra mim'.
- source_word: וְאֵת
  choice: e
  rationale: O marcador de objeto direto não recebe tradução própria; sua função coordenadora é representada por 'e' antes do último elemento.
theological_decisions:
- issue: O conhecimento divino expresso pelo verbo no perfeito
  choice: eu conheço
  alternative: eu conheci; tenho conhecido
  rationale: O presente expressa de modo natural o conhecimento certo e vigente do SENHOR acerca dos atos e da hostilidade do rei, sem acrescentar uma formulação teológica que vá além do texto.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A formulação preserva as imagens concretas e a sequência do hebraico, evitando explicitar além do necessário o alcance idiomático.
