  text: וְ/גַנּוֹתִ֛י עַל הָ/עִ֥יר הַ/זֹּ֖את לְ/הֽוֹשִׁיעָ֑/הּ לְמַֽעֲנִ֔/י וּ/לְמַ֖עַן דָּוִ֥ד עַבְדִּֽ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/035.yaml
  text: For I will defend this city to save it[b][a], for my own sake and for the sake of David my servant.
translation:
  language: pt
  text: E defenderei esta cidade para salvá-la[a], por minha causa e por causa de Davi, meu servo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Salvar” também pode ser traduzido como “livrar” ou “resgatar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַנּוֹתִי
  choice: defenderei
  rationale: O verbo גנן expressa a ideia de cobrir ou proteger. No contexto da ameaça militar contra Jerusalém, “defenderei” comunica essa proteção de modo natural e preciso. A conjunção inicial é representada por “Pois”, que liga a declaração ao fundamento apresentado no contexto.
- source_word: עַל הָעִיר הַזֹּאת
  choice: esta cidade
  rationale: Com גנן, a preposição עַל indica a cidade como alvo da ação protetora; em português, “defender esta cidade” dispensa preposição e soa idiomático.
- source_word: לְהוֹשִׁיעָהּ
  choice: para salvá-la
  rationale: O verbo ישׁע pode significar salvar, livrar ou resgatar. “Salvá-la” preserva sua força lexical e teológica, e o pronome feminino retoma corretamente “cidade”.
- source_word: לְמַעֲנִי
  choice: por minha própria causa
  rationale: A expressão apresenta o próprio Deus — sua honra e seus propósitos — como motivo da ação. “Própria” torna claro o valor reflexivo sem acrescentar uma explicação doutrinária.
- source_word: וּלְמַעַן דָּוִד עַבְדִּי
  choice: e por causa de Davi, meu servo
  rationale: A formulação conserva o paralelismo dos dois motivos e traduz עבד segundo seu uso régio e pactual aplicado a Davi.
theological_decisions:
- issue: Motivo divino para a salvação de Jerusalém
  choice: por minha própria causa e por causa de Davi, meu servo
  alternative: por minha causa e por amor de Davi, meu servo
  rationale: O texto atribui a ação tanto ao próprio interesse de Deus quanto à sua relação pactual com Davi. A tradução mantém os dois fundamentos lado a lado, sem explicar nem resolver sua tensão teológica.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Defenderei” preserva o cenário militar; “por minha própria causa” mantém a ênfase do hebraico sem recorrer a formulação denominacional.
