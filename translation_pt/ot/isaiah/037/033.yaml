  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֶל מֶ֣לֶךְ אַשּׁ֔וּר לֹ֤א יָבוֹא֙ אֶל הָ/עִ֣יר הַ/זֹּ֔את וְ/לֹֽא יוֹרֶ֥ה שָׁ֖ם חֵ֑ץ וְ/לֹֽא יְקַדְּמֶ֣/נָּה מָגֵ֔ן וְ/לֹֽא יִשְׁפֹּ֥ךְ עֳלֶ֖י/הָ סֹלְלָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/033.yaml
  text: 'Therefore thus says Yahweh concerning the king of Assyria: He will not come into this city[a], or shoot an arrow there, or come before it with a shield[b], or heap up a siege ramp against it.'
translation:
  language: pt
  text: 'Portanto, assim diz Yahweh a respeito do rei da Assíria: “Ele não virá a esta cidade, nem atirará ali uma flecha, nem avançará contra ela com um escudo[a], nem levantará contra ela uma rampa de cerco[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não se apresentará diante dela com um escudo”. A expressão hebraica retrata a aproximação para o ataque, protegido por um escudo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não erguerá contra ela um aterro”. O hebraico diz literalmente “não derramará contra ela uma rampa de cerco”, referindo-se ao acúmulo de terra e outros materiais.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Mantém a ligação conclusiva com a declaração divina anterior e reproduz com clareza a força inferencial do hebraico.
- source_word: כֹּה אָמַר יְהוָה
  choice: assim diz Yahweh
  rationale: Preserva a fórmula profética concisa e o nome divino expresso pelo Tetragrama.
- source_word: אֶל מֶלֶךְ אַשּׁוּר
  choice: a respeito do rei da Assíria
  rationale: Neste contexto, אֶל introduz naturalmente o assunto do pronunciamento; a mensagem não é dirigida ao rei em segunda pessoa.
- source_word: לֹא יָבוֹא אֶל הָעִיר הַזֹּאת
  choice: Ele não virá a esta cidade
  rationale: Conserva o movimento indicado por בוא e אֶל sem especificar além do hebraico se a ênfase recai em chegar à cidade ou entrar nela.
- source_word: וְלֹא יוֹרֶה שָׁם חֵץ
  choice: nem atirará ali uma flecha
  rationale: Verte diretamente a construção militar e mantém שָׁם, que retoma a cidade.
- source_word: וְלֹא יְקַדְּמֶנָּה מָגֵן
  choice: nem avançará contra ela com escudo
  rationale: Expressa em português natural a aproximação hostil retratada por קדם no contexto de um cerco, preservando a imagem do escudo.
- source_word: וְלֹא יִשְׁפֹּךְ עֳלֶיהָ סֹלְלָה
  choice: nem levantará contra ela uma rampa de cerco
  rationale: Traduz idiomaticamente a construção de uma obra de terra para o ataque; שׁפך significa literalmente derramar, mas aqui descreve o acúmulo de material para formar a rampa.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz o Tetragrama como nome próprio. A transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Alcance da promessa sobre a aproximação assíria
  choice: não virá a esta cidade
  alternative: não entrará nesta cidade
  rationale: A formulação escolhida evita restringir a afirmação apenas à entrada dentro dos muros e mantém a amplitude possível da preposição אֶל.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A coordenação repetida por “nem” reproduz a sequência enfática das negações hebraicas. As notas preservam as imagens militares e as alternativas lexicais sem tornar o corpo do versículo excessivamente literal.
