reference: Isaiah 37:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יָּ֨שָׁב֙ רַב שָׁקֵ֔ה וַ/יִּמְצָא֙ אֶת מֶ֣לֶךְ אַשּׁ֔וּר נִלְחָ֖ם עַל לִבְנָ֑ה כִּ֣י שָׁמַ֔ע כִּ֥י נָסַ֖ע מִ/לָּכִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/008.yaml
  text: Then the Rabshakeh returned and found the king of Assyria fighting against Libnah[b][a], for he had heard that he had departed from Lachish.
translation:
  language: pt
  text: Então o rabsaqué[a] voltou e encontrou o rei da Assíria lutando contra Libna[b], pois tinha ouvido que ele havia partido de Laquis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o copeiro-mor”. O título hebraico/assírio rabsaqué foi transliterado porque funciona como título da corte e como designação desse oficial na narrativa.
    reason: lexical_alternative
  - marker: b
    text: Ou “combatendo em Libna”. A expressão hebraica pode ser traduzida de maneira mais locativa, mas o sentido é que o rei da Assíria estava em combate contra a cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: voltou
  rationale: O wayyiqtol de שׁוב dá continuidade à narrativa; “voltou” é natural e conciso em português.
- source_word: רַב שָׁקֵה
  choice: o rabsaqué
  rationale: O título assírio identifica o oficial já conhecido na narrativa. A transliteração tradicional evita definir com precisão excessiva uma função cujo equivalente é incerto.
- source_word: וַיִּמְצָא אֶת
  choice: encontrou
  rationale: מצא com o marcador de objeto direto significa aqui, de modo direto, “encontrou”.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: o rei da Assíria
  rationale: Tradução idiomática e direta da construção hebraica.
- source_word: נִלְחָם עַל
  choice: lutando contra
  rationale: O particípio nifal de לחם com עַל indica que o rei estava em combate contra a cidade, embora a expressão também admita uma formulação mais locativa.
- source_word: לִבְנָה
  choice: Libna
  rationale: Forma portuguesa tradicional e amplamente reconhecível do topônimo bíblico.
- source_word: כִּי שָׁמַע
  choice: pois tinha ouvido
  rationale: כִּי introduz a razão, e o mais-que-perfeito situa o ato de ouvir antes do encontro narrado.
- source_word: כִּי נָסַע
  choice: que ele havia partido
  rationale: נסע pode indicar levantar acampamento e partir; “havia partido” comunica o deslocamento sem acrescentar detalhes não explícitos.
- source_word: מִלָּכִישׁ
  choice: de Laquis
  rationale: O topônimo com a preposição מִן indica o ponto de partida.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário de alcance internacional. Mantém-se o título tradicional “rabsaqué”, explicado em nota, e preserva-se em nota a ambiguidade entre o valor hostil e o locativo de נִלְחָם עַל.
