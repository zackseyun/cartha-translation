  text: וַ/יֵּצֵ֣א מַלְאַ֣ךְ יְהוָ֗ה וַ/יַּכֶּה֙ בְּ/מַחֲנֵ֣ה אַשּׁ֔וּר מֵאָ֛ה וּ/שְׁמֹנִ֥ים וַ/חֲמִשָּׁ֖ה אָ֑לֶף וַ/יַּשְׁכִּ֣ימוּ בַ/בֹּ֔קֶר וְ/הִנֵּ֥ה כֻלָּ֖/ם פְּגָרִ֥ים מֵתִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/036.yaml
  text: Then the angel of Yahweh went out and struck down 185,000 in the camp of Assyria. When they arose early in the morning[a], behold, all of them were dead bodies.
translation:
  language: pt
  text: Então o anjo[a] de Yahweh saiu e abateu 185 mil no acampamento da Assíria. Quando se levantaram de madrugada[b], eis que todos eles eram cadáveres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mensageiro de Yahweh”. A palavra hebraica pode significar tanto “mensageiro” como “anjo”; neste contexto, “anjo” provavelmente indica um agente celestial do juízo divino.'
    reason: Alternativa lexical de מַלְאָךְ.
  - marker: b
    text: O hebraico não identifica expressamente quem se levantou de madrugada.
    reason: Preservação da ambiguidade do sujeito verbal.
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  rationale: מַלְאָךְ pode designar um mensageiro humano ou celestial; neste relato de juízo divino, “anjo” comunica de modo natural o agente celestial, sem eliminar a alternativa lexical, registrada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: Equivalente direto e natural de יצא na sequência narrativa.
- source_word: וַיַּכֶּה
  choice: abateu
  rationale: Expressa o golpe com resultado fatal indicado pelo contexto, sem recorrer a formulação arcaica.
- source_word: בְּמַחֲנֵה אַשּׁוּר
  choice: no acampamento da Assíria
  rationale: Reproduz de perto a construção hebraica e permanece idiomático em português.
- source_word: מֵאָה וּשְׁמֹנִים וַחֲמִשָּׁה אָלֶף
  choice: 185 mil
  rationale: Preserva a quantidade exata em formato moderno e legível; não se acrescenta “homens”, ausente do hebraico.
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: Quando se levantaram de madrugada
  rationale: Conserva o verbo na terceira pessoa do plural sem identificar seu sujeito, que não é explicitado no hebraico, e comunica a ideia de levantar-se cedo.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Mantém a função enfática do marcador, chamando atenção para a cena surpreendente.
- source_word: כֻלָּם פְּגָרִים מֵתִים
  choice: todos eles eram corpos mortos
  rationale: Preserva a ênfase de “todos eles” e representa tanto o substantivo “corpos” quanto sua qualificação como mortos.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” preserva esse nome em transliteração reconhecível, sem substituí-lo por um título.
- issue: Identidade de מַלְאַךְ יְהוָה
  choice: anjo de Yahweh
  alternative: mensageiro de Yahweh
  rationale: O contexto de uma ação sobrenatural de juízo favorece “anjo”, mas a amplitude lexical de מַלְאָךְ é preservada em nota, sem definir além do que o texto afirma.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Eis que” conserva a força dramática do hebraico sem tornar o restante do versículo arcaico. A construção com sujeito indeterminado em “se levantaram” evita inserir no texto uma identificação não expressa no original.
