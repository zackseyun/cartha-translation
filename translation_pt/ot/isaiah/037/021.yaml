  text: וַ/יִּשְׁלַח֙ יְשַֽׁעְיָ֣הוּ בֶן אָמ֔וֹץ אֶל חִזְקִיָּ֖הוּ לֵ/אמֹ֑ר כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר֙ הִתְפַּלַּ֣לְתָּ אֵלַ֔/י אֶל סַנְחֵרִ֖יב מֶ֥לֶךְ אַשּֽׁוּר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/021.yaml
  text: 'Then Isaiah son of Amoz sent to Hezekiah[a], saying, “Thus says Yahweh[b], the God of Israel: Because you have prayed to me concerning Sennacherib king of Assyria,”'
translation:
  language: pt
  text: 'Então Isaías, filho de Amoz, mandou dizer a Ezequias: “Assim diz Yahweh[a], o Deus de Israel: Quanto ao que você orou a mim a respeito de Senaqueribe, rei da Assíria—[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh representa o nome divino YHWH, tradicionalmente traduzido por “SENHOR”.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “Porque você orou a mim a respeito de Senaqueribe, rei da Assíria...”. A frase hebraica é elíptica e continua na declaração seguinte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mandou dizer
  rationale: O verbo significa literalmente “enviou”, mas seu objeto está implícito. Em português, “mandou dizer” expressa naturalmente o envio de uma mensagem sem sugerir que Isaías foi pessoalmente.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ
  choice: Isaías, filho de Amoz
  rationale: Usa as formas tradicionais dos nomes em português e apresenta o patronímico com pontuação natural.
- source_word: לֵאמֹר
  choice: dizer
  rationale: Integrado à expressão idiomática “mandou dizer”, comunica de forma concisa a fórmula hebraica de introdução da mensagem.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula profética convencional e sua força declarativa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reproduz com clareza e naturalidade a cadeia construta hebraica.
- source_word: אֲשֶׁר
  choice: Quanto ao que
  rationale: Mantém a construção hebraica elíptica e evita impor uma relação causal que o texto de Isaías não explicita.
- source_word: הִתְפַּלַּלְתָּ אֵלַי
  choice: você orou a mim
  rationale: Traduz diretamente o hitpael de פלל e mantém explícito o destinatário da oração.
- source_word: אֶל סַנְחֵרִיב
  choice: a respeito de Senaqueribe
  rationale: No contexto da oração, a preposição indica o assunto; “a respeito de” evita tanto a leitura de oração dirigida a Senaqueribe quanto a interpretação mais forte “contra” ele.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: rei da Assíria
  rationale: Tradução natural da cadeia construta em aposição ao nome próprio.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título; uma nota informa sua relação com YHWH.
- issue: Tratamento da oração elíptica iniciada por אֲשֶׁר
  choice: Quanto ao que você orou a mim...—
  alternative: Porque você orou a mim...
  rationale: אֲשֶׁר admite aqui uma relação ampla, e a formulação hebraica só se completa no oráculo seguinte. A opção escolhida preserva a elipse e a tensão sintática, enquanto “porque” adotaria explicitamente a relação causal encontrada no paralelo de 2 Reis 19:20.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Mandou dizer” evita a rigidez de “enviou a Ezequias, dizendo”. O travessão final sinaliza que a construção não termina neste versículo. Todos os marcadores de nota aparecem no texto principal.
