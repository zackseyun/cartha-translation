  source_fidelity: 'A tradução representa fielmente a estrutura do hebraico: Isaías envia uma mensagem a Ezequias, introduz a fórmula profética “Assim diz”, preserva Yahweh como nome divino e mantém a oração relativa elíptica introduzida por אֲשֶׁר. “Quanto ao que” é uma solução legítima e prudente, pois não impõe a relação causal explícita do texto paralelo de 2 Reis 19:20.'
