  terminology: Os nomes Isaías, Amoz, Ezequias, Senaqueribe e Assíria seguem formas portuguesas estabelecidas. “Yahweh”, “o Deus de Israel” e “rei da Assíria” são terminologicamente consistentes e fiéis. As notas esclarecem adequadamente tanto o nome divino quanto a elipse sintática.
