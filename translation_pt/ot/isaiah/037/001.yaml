id: ISA.37.1
reference: Isaiah 37:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ/שְׁמֹ֨עַ֙ הַ/מֶּ֣לֶךְ חִזְקִיָּ֔הוּ וַ/יִּקְרַ֖ע אֶת בְּגָדָ֑י/ו וַ/יִּתְכַּ֣ס בַּ/שָּׂ֔ק וַ/יָּבֹ֖א בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/001.yaml
  text: And it happened[a], when King Hezekiah heard it, that he tore his clothes, covered himself with sackcloth, and went into the house of Yahweh.
translation:
  language: pt
  text: E aconteceu que, quando o rei Ezequias ouviu isso[a], rasgou as suas roupas, cobriu-se de pano de saco e entrou na casa de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz apenas «quando o rei Ezequias ouviu»; o objeto está implícito e foi expresso como «isso» com base no contexto anterior.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Preserva a função narrativa de וַיְהִי em português atual, sem recorrer ao arcaísmo «e sucedeu».
- source_word: כִּשְׁמֹעַ
  choice: quando ... ouviu isso
  rationale: A preposição כְּ com o infinitivo construto de שׁמע expressa circunstância temporal. O pronome «isso» retoma naturalmente a mensagem do contexto anterior, embora o objeto esteja implícito no hebraico.
- source_word: הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: o rei Ezequias
  rationale: Reproduz de modo idiomático a construção hebraica formada pelo título seguido do nome próprio.
- source_word: וַיִּקְרַע אֶת בְּגָדָיו
  choice: rasgou as suas roupas
  rationale: Mantém a ação literal, que no contexto expressa profunda aflição e luto, com vocabulário moderno e claro.
- source_word: וַיִּתְכַּס בַּשָּׂק
  choice: cobriu-se de pano de saco
  rationale: Conserva o sentido reflexivo do verbo e a referência ao tecido áspero usado como sinal de luto, humilhação ou angústia.
- source_word: וַיָּבֹא בֵּית יְהוָה
  choice: entrou na casa de Yahweh
  rationale: בוא seguido de בֵּית indica entrada no templo; «entrou» comunica de maneira direta tanto o movimento quanto o destino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. «Yahweh» preserva o caráter de nome próprio e corresponde à transliteração adotada nesta tradução, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sequência verbal é concisa e mantém o ritmo narrativo do hebraico. «Pano de saco» conserva uma expressão bíblica reconhecível sem linguagem excessivamente arcaica.
