base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/012.yaml
  text: Did the gods of the nations that my fathers destroyed deliver them—Gozan[a], Haran, Rezeph, and the people of Eden who were in Telassar?
translation:
  language: pt
  text: Será que os deuses das nações livraram Gozã, Harã, Rezefe e os filhos de Éden[a], que estavam em Telassar, da destruição causada por meus antepassados?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «filhos de Éden», isto é, o povo ou os habitantes de Éden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהִצִּילוּ
  choice: Será que ... livraram
  rationale: O hifil perfeito de נצל integra uma pergunta retórica. «Será que» transmite naturalmente em português a força do desafio, e «livrar» é corrente no contexto de deuses que supostamente salvariam povos da destruição.
- source_word: אוֹתָם
  choice: as
  rationale: O pronome objeto retoma as nações ou localidades mencionadas; o feminino plural concorda naturalmente com «nações», sem substituir o pronome hebraico por uma explicação.
- source_word: אֱלֹהֵי הַגּוֹיִם
  choice: os deuses das nações
  rationale: Mantém o plural explícito e o sentido geopolítico de גּוֹיִם, sem reinterpretar as divindades como simples símbolos nacionais.
- source_word: אֲשֶׁר הִשְׁחִיתוּ אֲבוֹתַי
  choice: que meus antepassados destruíram
  rationale: שׁחת no hifil exprime destruição militar. «Antepassados» comunica com clareza o sentido dinástico de אֲבוֹתַי e evita que «pais» seja entendido como progenitores imediatos.
- source_word: אֶת גּוֹזָן וְאֶת חָרָן וְרֶצֶף
  choice: Gozã, Harã, Rezefe
  rationale: Translitera os topônimos hebraicos em formas naturais e legíveis em português.
- source_word: וּבְנֵי עֶדֶן
  choice: os filhos de Éden
  rationale: Preserva a expressão hebraica literal «filhos de», cujo sentido coletivo é esclarecido em nota, sem eliminar a forma própria do texto.
- source_word: אֲשֶׁר בִּתְלַשָּׂר
  choice: que estavam em Telassar
  rationale: A oração relativa é mantida ligada aos «filhos de Éden», e a preposição ב é vertida naturalmente por «em».
