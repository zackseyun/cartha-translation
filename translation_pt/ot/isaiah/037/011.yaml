id: ISA.37.11
reference: Isaiah 37:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הִנֵּ֣ה אַתָּ֣ה שָׁמַ֗עְתָּ אֲשֶׁ֨ר עָשׂ֜וּ מַלְכֵ֥י אַשּׁ֛וּר לְ/כָל הָ/אֲרָצ֖וֹת לְ/הַחֲרִימָ֑/ם וְ/אַתָּ֖ה תִּנָּצֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/011.yaml
  text: Look[a], you have heard what the kings of Assyria have done to all the lands[b], destroying them utterly—and will you be delivered?
translation:
  language: pt
  text: 'Veja: você ouviu o que os reis da Assíria fizeram a todas as terras, destruindo-as por completo[a]. E você será livrado?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «consagrando-as à destruição» ou «submetendo-as ao extermínio». O verbo hebraico traz a ideia de destinar algo à destruição total.
    reason: lexical_alternative
  - marker: b
    text: Ou «E você escapará?». No contexto, trata-se de uma pergunta retórica de provocação.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Veja
  rationale: Interjeição enfática que chama a atenção do interlocutor; «Veja» é atual e preserva a força dêitica.
- source_word: שָׁמַעְתָּ
  choice: você ouviu
  rationale: O perfeito na segunda pessoa masculina singular aponta para informação já conhecida; o pretérito perfeito é natural em português.
- source_word: אֲשֶׁר עָשׂוּ
  choice: o que ... fizeram
  rationale: Tradução idiomática da partícula relativa seguida do verbo, introduzindo o conteúdo ouvido.
- source_word: מַלְכֵי אַשּׁוּר
  choice: os reis da Assíria
  rationale: Reproduz com clareza e naturalidade a construção hebraica.
- source_word: לְכָל הָאֲרָצוֹת
  choice: a todas as terras
  rationale: O plural se refere aos diversos territórios ou países conquistados pela Assíria, e não ao planeta inteiro.
- source_word: לְהַחֲרִימָם
  choice: destruindo-as por completo
  rationale: O hifil infinitivo de חרם com sufixo pronominal expressa a entrega à destruição total; a formulação comunica esse peso em português corrente sem recorrer a jargão técnico.
- source_word: וְאַתָּה תִּנָּצֵל
  choice: E você será livrado?
  rationale: O pronome independente realça o contraste, e o nifal de נצל admite sentido passivo. A pergunta retórica transmite a provocação do contexto.
theological_decisions:
- issue: Linguagem de חרם em contexto de conquista militar
  choice: destruindo-as por completo
  alternative: consagrando-as à destruição; submetendo-as ao extermínio
  rationale: A opção preserva a ideia de destruição total própria do verbo sem impor terminologia religiosa técnica ou pouco transparente ao leitor comum.
- issue: תִּנָּצֵל como pergunta retórica
  choice: E você será livrado?
  alternative: E você escapará?; e você será livrado.
  rationale: No contexto, o rei assírio zomba da esperança de Ezequias. A pontuação interrogativa explicita essa força discursiva, embora o hebraico não use sinal gráfico de pergunta.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Veja» conserva a abertura enfática; «terras» mantém o plural geopolítico; a pergunta final preserva a provocação e a tensão do hebraico.
