source:
  edition: WLC
  text: אוּלַ֡י יִשְׁמַע֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֵ֣ת דִּבְרֵ֣י רַב שָׁקֵ֗ה אֲשֶׁר֩ שְׁלָח֨/וֹ מֶֽלֶךְ אַשּׁ֤וּר אֲדֹנָי/ו֙ לְ/חָרֵף֙ אֱלֹהִ֣ים חַ֔י וְ/הוֹכִ֨יחַ֙ בַּ/דְּבָרִ֔ים אֲשֶׁ֥ר שָׁמַ֖ע יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/נָשָׂ֣אתָ תְפִלָּ֔ה בְּעַ֥ד הַ/שְּׁאֵרִ֖ית הַ/נִּמְצָאָֽה׀־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/004.yaml
  text: Perhaps Yahweh your God will hear the words of the Rabshakeh[a], whom the king of Assyria his master has sent to reproach the living God, and will rebuke the words that Yahweh your God has heard[c][b]. Therefore lift up a prayer for the remnant that is found.
translation:
  language: pt
  text: Talvez Yahweh, seu Deus, ouça as palavras do Rabsaqué[a], a quem o rei da Assíria, seu senhor, enviou para insultar o Deus vivo, e repreenda por causa das palavras que Yahweh, seu Deus, ouviu.[b] Portanto, eleve uma oração em favor do remanescente que ainda resta.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o copeiro-mor”. “Rabsaqué” é um título oficial assírio empregado aqui como designação semelhante a um nome.
    reason: cultural_note
  - marker: b
    text: Ou “e peça contas por causa das palavras”. O hebraico pode indicar que Deus responderá ou julgará as palavras blasfemas que ouviu.
    reason: lexical_alternative
  - marker: c
    text: Ou “o remanescente que se encontra” ou “os sobreviventes que ficaram”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי יִשְׁמַע
  choice: Talvez ... ouça
  rationale: Expressa a possibilidade esperançosa do hebraico de modo natural, sem converter a expectativa em certeza.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera diretamente o nome divino presente no texto hebraico.
- source_word: רַב שָׁקֵה
  choice: Rabsaqué
  rationale: Mantém como designação semelhante a nome o título do alto oficial assírio; a nota registra seu sentido funcional possível.
- source_word: לְחָרֵף
  choice: para insultar
  rationale: Comunica em português atual a afronta verbal e irreverente dirigida contra Deus, sem restringi-la apenas a zombaria ou desafio militar.
- source_word: וְהוֹכִיחַ בַּדְּבָרִים
  choice: e repreenda as palavras
  rationale: Preserva a construção do texto e a expectativa de uma resposta judicial de Deus, deixando em nota a amplitude semântica de chamar à prestação de contas.
- source_word: הַשְּׁאֵרִית הַנִּמְצָאָה
  choice: o remanescente que ainda se encontra
  rationale: Conserva o termo teologicamente significativo 'remanescente' e representa נִמְצָאָה sem reduzir a expressão simplesmente a 'sobreviventes'.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico emprega explicitamente o tetragrama; a transliteração preserva o nome pactual sem substituí-lo por um título.
- issue: Sentido da possível resposta divina em וְהוֹכִיחַ
  choice: repreenda as palavras
  alternative: chame à prestação de contas por causa das palavras
  rationale: A formulação mantém a tensão entre censura verbal e ação judicial, sem especificar além do que o verbo permite.
- issue: Sentido de שְׁאֵרִית
  choice: remanescente
  alternative: sobreviventes; os que restam
  rationale: Preserva a ressonância característica do termo em Isaías sem afirmar que toda a sua teologia do remanescente esteja explicitamente desenvolvida neste versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem de “o rei da Assíria, seu senhor” esclarece a aposição sem afastamento substancial do hebraico. “Eleve uma oração” conserva o movimento figurado de נָשָׂא, enquanto “em favor de” expressa naturalmente בְּעַד.
