  text: אֲנִ֥י קַ֖רְתִּי וְ/שָׁתִ֣יתִי מָ֑יִם וְ/אַחְרִב֙ בְּ/כַף פְּעָמַ֔/י כֹּ֖ל יְאֹרֵ֥י מָצֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/025.yaml
  text: I dug and drank water[b][a], and with the sole of my feet I dried up all the streams of Egypt.
translation:
  language: pt
  text: Eu mesmo cavei e bebi água; com a planta dos meus pés sequei todos os canais[a] do Egito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os braços do Nilo” ou “todos os cursos de água”. O termo hebraico pode designar especificamente os canais e braços do Nilo.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: Mazor, provavelmente um nome poético ou alternativo do Egito neste contexto; a palavra também pode significar “cerco” ou “fortificação” em outros contextos.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנִי
  choice: Eu mesmo
  rationale: O pronome independente, somado às formas verbais que já indicam a primeira pessoa, tem valor enfático e reforça a autoconfiança da declaração.
- source_word: קַרְתִּי
  choice: cavei
  rationale: Neste contexto de obtenção de água, o verbo descreve o ato de cavar para alcançá-la; a tradução mantém a concisão e não acrescenta um objeto ausente no hebraico.
- source_word: וְשָׁתִיתִי מָיִם
  choice: e bebi água
  rationale: Expressa de modo natural em português a ação simples indicada pelo hebraico; embora מַיִם tenha forma plural, 'água' é o equivalente idiomático.
- source_word: וְאַחְרִב
  choice: sequei
  rationale: O hifil de חרב, tendo cursos de água como objeto, significa fazê-los ficar secos.
- source_word: בְּכַף פְּעָמַי
  choice: com a planta dos meus pés
  rationale: כַּף aplicado aos pés designa a planta; a expressão conserva a hipérbole vívida do conquistador.
- source_word: כֹּל יְאֹרֵי
  choice: todos os canais
  rationale: יְאֹרִים pode designar os canais ou braços do Nilo em contexto egípcio. 'Canais' comunica melhor essa referência específica, sem excluir outras vias fluviais, registradas em nota.
- source_word: מָצוֹר
  choice: Egito
  rationale: Aqui מָצוֹר é provavelmente um nome poético ou alternativo do Egito, especialmente na expressão referente às suas vias de água; a transliteração e a ambiguidade lexical são preservadas em nota.
