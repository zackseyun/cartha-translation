id: ISA.37.7
reference: Isaiah 37:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הִנְ/נִ֨י נוֹתֵ֥ן בּ/וֹ֙ ר֔וּחַ וְ/שָׁמַ֥ע שְׁמוּעָ֖ה וְ/שָׁ֣ב אֶל אַרְצ֑/וֹ וְ/הִפַּלְתִּ֥י/ו בַּ/חֶ֖רֶב בְּ/אַרְצֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/007.yaml
  text: Behold[a], I am putting a spirit in him, so that he will hear a report and return to his own land[b], and I will cause him to fall by the sword in his own land.
translation:
  language: pt
  text: Eis que ponho nele um espírito[a]; ele ouvirá uma notícia[b] e voltará para a sua terra. Farei com que caia à espada em sua própria terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um impulso” ou “uma disposição”. O hebraico רוּחַ pode designar espírito, impulso ou disposição interior.
    reason: lexical_alternative
  - marker: b
    text: Ou “um relato”, “uma informação” ou “um rumor”. O hebraico שְׁמוּעָה não especifica se a informação recebida foi confirmada.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי נוֹתֵן
  choice: Eis que ponho
  rationale: Preserva tanto a força de chamada de atenção de הִנְנִי quanto o aspecto iminente do particípio נוֹתֵן, sem reduzi-lo a um futuro simples.
- source_word: בּוֹ רוּחַ
  choice: nele um espírito
  rationale: Mantém o sentido locativo ou interior de בּוֹ e a amplitude semântica de רוּחַ, que aqui pode indicar espírito, disposição ou impulso interior.
- source_word: וְשָׁמַע שְׁמוּעָה
  choice: ele ouvirá uma notícia
  rationale: Expressa naturalmente a sequência resultante. “Notícia” conserva a neutralidade de שְׁמוּעָה quanto à confirmação da informação.
- source_word: וְשָׁב אֶל אַרְצוֹ
  choice: e voltará para a sua terra
  rationale: Traduz diretamente o sentido comum de שׁוּב e explicita com naturalidade o sufixo possessivo.
- source_word: וְהִפַּלְתִּיו
  choice: Farei com que caia
  rationale: Preserva a força causativa da forma hifil de נפל e a agência divina expressa no texto.
- source_word: בַּחֶרֶב
  choice: à espada
  rationale: Emprega a expressão portuguesa corrente e digna para morte violenta por meio da espada.
- source_word: בְּאַרְצוֹ
  choice: em sua própria terra
  rationale: A repetição de “terra”, reforçada por “própria”, preserva a ênfase hebraica de que sua queda acontecerá no país ao qual retornará.
theological_decisions:
- issue: Sentido de רוּחַ na promessa divina a respeito do rei assírio
  choice: um espírito, colocado nele por Deus
  alternative: um impulso ou uma disposição interior; um vento
  rationale: '“Um espírito” conserva a formulação e a amplitude teológica do hebraico: Deus dirige a reação do rei sem que a tradução defina além do texto a natureza ou o mecanismo dessa influência.'
translation_notes:
  register: Português moderno, claro e digno, com leve elevação profética em “Eis que”. A pontuação explicita a progressão dos acontecimentos sem acrescentar uma relação causal mais específica do que a permitida pelo hebraico.
