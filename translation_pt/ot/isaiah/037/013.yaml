  text: אַיֵּ֤ה מֶֽלֶךְ חֲמָת֙ וּ/מֶ֣לֶךְ אַרְפָּ֔ד וּ/מֶ֖לֶךְ לָעִ֣יר סְפַרְוָ֑יִם הֵנַ֖ע וְ/עִוָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/013.yaml
  text: Where is the king of Hamath[a], and the king of Arpad, and the king of the city of Sepharvaim, of Hena[b], and of Ivvah?
translation:
  language: pt
  text: Onde estão o rei de Hamate, o rei de Arpade e o rei da cidade de Sefarvaim, de Hena[a] e de Iva[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hena também pode ser transliterado como “Hená”.
    reason: lexical_alternative
  - marker: b
    text: Iva também aparece como “Ava” em algumas traduções.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה
  choice: Onde estão
  rationale: O advérbio interrogativo significa “onde?”. Como a pergunta abrange vários reis, o plural “estão” é a forma mais natural em português, sem alterar o sentido do hebraico.
- source_word: מֶלֶךְ
  choice: rei
  rationale: Tradução usual do termo hebraico. A repetição presente no original foi mantida para conservar a força retórica.
- source_word: חֲמָת
  choice: Hamate
  rationale: Forma tradicional e amplamente reconhecível do topônimo em português.
- source_word: אַרְפָּד
  choice: Arpade
  rationale: Forma portuguesa tradicional do topônimo.
- source_word: לָעִיר
  choice: da cidade de
  rationale: Expressa de modo natural em português a relação entre “rei”, “cidade” e “Sefarvaim” nesta fórmula de provocação.
- source_word: סְפַרְוָיִם
  choice: Sefarvaim
  rationale: Transliteração tradicional e reconhecível em português.
- source_word: הֵנַע
  choice: Hena
  rationale: Transliteração direta do nome próprio; a variante “Hená” é registrada em nota.
- source_word: עִוָּה
  choice: Iva
  rationale: Forma tradicional em traduções portuguesas; “Ava” é preservada em nota como variante de transliteração.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas tradicionais dos topônimos para facilitar o reconhecimento. A repetição de “o rei” acompanha a retórica hebraica; “Onde estão” ajusta naturalmente a concordância ao conjunto de reis mencionado.
