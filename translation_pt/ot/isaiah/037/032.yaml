base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/032.yaml
  text: For from Jerusalem a remnant will go out[a], and survivors from Mount Zion. The zeal of Yahweh of hosts will do this.
translation:
  language: pt
  text: Pois de Jerusalém sairá um remanescente, e sobreviventes do monte Sião. O zelo[a] de Yahweh dos Exércitos fará isso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O ciúme de Yahweh dos Exércitos fará isso”. O substantivo hebraico pode significar tanto “zelo” como “ciúme”; aqui se refere ao intenso compromisso de Yahweh com sua aliança para cumprir sua promessa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento da promessa anterior e soa natural em português.
- source_word: מִירוּשָׁלִַם
  choice: de Jerusalém
  rationale: A preposição מִן indica origem ou procedência.
- source_word: תֵּצֵא
  choice: sairá
  rationale: O imperfeito qal de יצא tem aqui valor futuro e indica movimento para fora de um lugar.
- source_word: שְׁאֵרִית
  choice: um remanescente
  rationale: Preserva o conhecido motivo profético dos que permanecem depois do juízo, sem definir além do que o hebraico exige.
- source_word: וּפְלֵיטָה
  choice: e ... os sobreviventes
  rationale: No paralelismo com שְׁאֵרִית, o termo designa pessoas que escaparam ou sobreviveram, não a ideia abstrata de livramento.
- source_word: מֵהַר צִיּוֹן
  choice: do monte Sião
  rationale: Mantém a indicação de procedência e a referência geográfica e teológica tradicional.
- source_word: קִנְאַת
  choice: O zelo
  rationale: קנאה pode significar zelo ou ciúme. Neste contexto, 'zelo' comunica melhor o empenho intenso de Deus em cumprir sua promessa, enquanto a alternativa legítima é registrada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Na designação divina fixa, esta forma é clara e corrente em português e conserva a imagem das hostes sob o comando de Yahweh.
- source_word: תַּעֲשֶׂה זֹּאת
  choice: fará isso
  rationale: Reproduz de forma direta a afirmação hebraica da ação divina.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama; 'Yahweh' preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Sentido de קִנְאַת aplicado a Deus
  choice: zelo
  alternative: ciúme
  rationale: O contexto destaca o empenho ardente de Yahweh em realizar a promessa. Como o substantivo hebraico também pode significar 'ciúme', essa ambiguidade lexical é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A inversão em “e do monte Sião, os sobreviventes” conserva o paralelismo e a elipse verbal do hebraico sem produzir ambiguidade. “Exércitos” recebe inicial maiúscula por integrar o título divino tradicional.
