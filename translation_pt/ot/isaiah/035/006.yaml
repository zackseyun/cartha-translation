  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אָ֣ז יְדַלֵּ֤ג כָּֽ/אַיָּל֙ פִּסֵּ֔חַ וְ/תָרֹ֖ן לְשׁ֣וֹן אִלֵּ֑ם כִּֽי נִבְקְע֤וּ בַ/מִּדְבָּר֙ מַ֔יִם וּ/נְחָלִ֖ים בָּ/עֲרָבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/006.yaml
  text: Then the lame will leap like a deer[a], and the tongue of the mute will sing for joy; for waters have burst forth in the wilderness[b], and streams in the desert plain.
translation:
  language: pt
  text: Então o coxo saltará como o cervo, e a língua do mudo cantará de alegria[a], pois águas irromperão no deserto, e riachos, na planície árida[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “gritará de alegria”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “na Arabá”, entendendo o termo como nome geográfico, e não como o substantivo comum “planície árida”.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְדַלֵּג
  choice: saltará
  rationale: O piel imperfeito expressa um salto vivo e vigoroso; “saltará” é natural em português e preserva a força da imagem de cura.
- source_word: כָּאַיָּל
  choice: como o cervo
  rationale: אַיָּל designa cervo ou veado, possivelmente o macho. “Cervo” é claro, digno e adequado à comparação poética.
- source_word: פִּסֵּחַ
  choice: o coxo
  rationale: O adjetivo substantivado refere-se, no singular genérico, a uma pessoa com dificuldade para andar. “O coxo” mantém a concisão e o paralelismo do hebraico.
- source_word: וְתָרֹן
  choice: cantará de alegria
  rationale: רנן indica um brado jubiloso, muitas vezes associado ao canto. “Cantará de alegria” combina naturalmente com “língua” e preserva o tom celebrativo; “gritará de alegria” também é possível.
- source_word: לְשׁוֹן אִלֵּם
  choice: a língua do mudo
  rationale: A formulação conserva a imagem concreta do hebraico, na qual a língua antes incapaz de falar passa a celebrar.
- source_word: נִבְקְעוּ
  choice: irromperão
  rationale: O nifal de בקע comunica abertura ou rompimento. Com águas como sujeito, “irromperão” expressa de modo natural seu surgimento súbito. O imperfeito profético é vertido pelo futuro, em harmonia com o restante do anúncio.
- source_word: בַמִּדְבָּר
  choice: no deserto
  rationale: מִדְבָּר designa região desértica ou erma. “Deserto” é corrente em português e contrasta claramente com as águas que surgem.
- source_word: מַיִם
  choice: águas
  rationale: Mantém o plural hebraico e o tom poético sem deixar de ser natural em português.
- source_word: וּנְחָלִים
  choice: riachos
  rationale: נְחָלִים pode designar cursos de água ou uádis. “Riachos” comunica com clareza a presença de água corrente no cenário árido.
- source_word: בָּעֲרָבָה
  choice: na planície árida
  rationale: עֲרָבָה pode ser um substantivo comum referente à estepe ou planície desértica, ou o nome geográfico Arabá. A tradução no texto preserva o paralelismo poético; a alternativa geográfica consta em nota.
theological_decisions:
- issue: Natureza das imagens de restauração
  choice: Apresentar cura corporal e renovação ambiental concretas sem restringir seu cumprimento a uma leitura exclusivamente literal ou exclusivamente metafórica.
  alternative: Entender tudo como restauração apenas espiritual, ou como cura literal exclusivamente escatológica.
  rationale: O hebraico descreve a reversão de limitações físicas e a transformação da terra árida. A tradução preserva toda a força profética sem impor um esquema teológico que o versículo não explicita.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A estrutura poética e o paralelismo hebraico foram preservados sem arcaísmos desnecessários. Todos os marcadores de nota aparecem no texto principal.
