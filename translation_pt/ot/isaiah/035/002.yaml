id: ISA.35.2
reference: Isaiah 35:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: פָּרֹ֨חַ תִּפְרַ֜ח וְ/תָגֵ֗ל אַ֚ף גִּילַ֣ת וְ/רַנֵּ֔ן כְּב֤וֹד הַ/לְּבָנוֹן֙ נִתַּן לָ֔/הּ הֲדַ֥ר הַ/כַּרְמֶ֖ל וְ/הַ/שָּׁר֑וֹן הֵ֛מָּה יִרְא֥וּ כְבוֹד יְהוָ֖ה הֲדַ֥ר אֱלֹהֵֽי/נוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/002.yaml
  text: It will blossom abundantly and rejoice—yes[a], with rejoicing and a shout of joy. The glory of Lebanon will be given to it, the majesty of Carmel and Sharon. They will see the glory of Yahweh[c][b], the majesty of our God.
translation:
  language: pt
  text: Ela florescerá abundantemente e se alegrará — sim[a], com alegria e gritos de júbilo. A glória do Líbano lhe será dada, bem como o esplendor do Carmelo e de Sarom[b]. Eles verão a glória de Yahweh[c], o esplendor do nosso Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “certamente florescerá”; o hebraico combina um infinitivo absoluto com o verbo finito para dar ênfase.'
    reason: lexical_alternative
  - marker: b
    text: Líbano, Carmelo e Sarom eram regiões famosas por sua beleza natural e fertilidade; a imagem mostra o deserto recebendo seu esplendor.
    reason: cultural_note
  - marker: c
    text: 'Hebraico: YHWH, tradicionalmente traduzido por “o SENHOR”.'
    reason: alternative_reading
lexical_decisions:
- source_word: פָּרֹחַ תִּפְרַח
  choice: florescerá abundantemente
  rationale: A combinação do infinitivo absoluto com o verbo finito intensifica a ação; esta formulação comunica a ênfase com naturalidade em português.
- source_word: וְתָגֵל ... גִּילַת
  choice: se alegrará — sim, com alegria
  rationale: Preserva a repetição enfática da raiz גיל e o tom exuberante da poesia sem recorrer a uma construção artificial.
- source_word: וְרַנֵּן
  choice: e gritos de júbilo
  rationale: O verbo pode indicar canto jubiloso ou aclamações sonoras; a expressão mantém essa celebração audível e intensa.
- source_word: כְּבוֹד הַלְּבָנוֹן
  choice: a glória do Líbano
  rationale: Mantém o elo lexical de כבוד com a posterior expressão 'glória de Yahweh'.
- source_word: נִתַּן לָהּ
  choice: lhe será dada
  rationale: Embora a forma hebraica seja perfeita passiva, o contexto profético de restauração favorece o valor futuro.
- source_word: הֲדַר
  choice: esplendor
  rationale: Comunica beleza imponente tanto nas regiões férteis quanto em Deus, distinguindo-se naturalmente de כבוד, traduzido como 'glória'.
- source_word: הַכַּרְמֶל וְהַשָּׁרוֹן
  choice: o Carmelo e Sarom
  rationale: Conserva os topônimos; o artigo diante de Carmelo é natural no uso geográfico português, enquanto Sarom normalmente ocorre sem artigo.
- source_word: הֵמָּה יִרְאוּ
  choice: Eles verão
  rationale: Preserva o pronome e o verbo no plural, sem eliminar a possível mudança poética da terra restaurada para aqueles ligados a ela.
- source_word: כְבוֹד יְהוָה
  choice: a glória de Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama e preserva a repetição de 'glória'.
- source_word: הֲדַר אֱלֹהֵינוּ
  choice: o esplendor do nosso Deus
  rationale: Mantém o paralelismo poético e traduz הדר de modo coerente.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz explicitamente o Tetragrama; 'Yahweh' conserva o nome próprio, enquanto a nota registra a tradição de representá-lo por 'SENHOR'.
- issue: Referente de הֵמָּה ('eles')
  choice: 'Manter o plural explícito: ''Eles verão'''
  alternative: 'Reformular impessoalmente: ''ali se verá'' ou tratar poeticamente as regiões como sujeito'
  rationale: O hebraico apresenta pronome enfático e verbo masculinos plurais. Mantê-los preserva a gramática e a ambiguidade quanto ao referente, sem impor uma identificação.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e alcance internacional. A repetição poética foi parcialmente preservada, os topônimos foram mantidos e a ambiguidade do pronome plural não foi resolvida no corpo do texto.
