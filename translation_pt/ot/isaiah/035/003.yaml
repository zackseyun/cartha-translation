  yaml_path: translation/ot/isaiah/035/003.yaml
  text: Strengthen weak hands[a], and make firm feeble knees.
translation:
  language: pt
  text: Fortaleçam as mãos fracas e tornem firmes os joelhos vacilantes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “joelhos que cedem”. O particípio hebraico retrata joelhos que cambaleiam ou perdem a firmeza.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַזְּקוּ
  choice: Fortaleçam
  rationale: O piel imperativo plural é causativo e rege “mãos”; “fortaleçam” comunica com naturalidade a exortação dirigida a várias pessoas.
- source_word: יָדַיִם רָפוֹת
  choice: as mãos enfraquecidas
  rationale: Mantém a imagem concreta das mãos e expressa רָפוֹת como falta de força; “enfraquecidas” é corrente e digno em português.
- source_word: וּבִרְכַּיִם
  choice: e ... os joelhos
  rationale: Preserva a conjunção e o paralelismo poético entre mãos e joelhos.
- source_word: כֹּשְׁלוֹת
  choice: vacilantes
  rationale: O particípio de כשל retrata joelhos que cambaleiam ou cedem. “Vacilantes” conserva o movimento e a instabilidade da imagem sem soar artificial.
- source_word: אַמֵּצוּ
  choice: firmem
  rationale: O piel imperativo pede que os joelhos sejam tornados fortes ou firmes. “Firmem” preserva a variação poética em relação a “fortaleçam”.
