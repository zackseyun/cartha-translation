base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/007.yaml
  text: The burning sand will become a pool[a], and the thirsty ground springs of water; in the haunt of jackals, where they lie down, there will be grass, reeds[c][b], and rushes.
translation:
  language: pt
  text: A areia escaldante se transformará num lago[a], e a terra sedenta, em fontes de água; no lugar onde vivem os chacais, onde eles se deitam[b], haverá capim, juncos e papiros[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a miragem se transformará num lago”. O hebraico שָׁרָב pode indicar o calor abrasador ou a aparência trêmula do deserto sob o calor.
    reason: lexical_alternative
  - marker: b
    text: Ou “na morada dos chacais, no seu lugar de repouso”. A sintaxe hebraica desta frase é condensada e permite maneiras ligeiramente diferentes de relacionar os chacais, o lugar onde repousam e a nova vegetação.
    reason: lexical_alternative
  - marker: c
    text: O hebraico גֹמֶא também pode ser traduzido por “junco”; refere-se a uma planta de áreas alagadas, frequentemente identificada como papiro.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁרָב
  choice: a areia escaldante
  rationale: O termo pode indicar o calor abrasador ou o aspecto trêmulo do deserto sob o calor. “Areia escaldante” concretiza a paisagem árida e preserva a imagem de transformação.
- source_word: לַאֲגַם
  choice: num lago
  rationale: אֲגַם designa uma extensão de água, como lago, poça ou área pantanosa. “Lago” é claro e natural sem detalhar excessivamente o ambiente.
- source_word: צִמָּאוֹן
  choice: a terra sedenta
  rationale: Embora possa significar “sede” ou “lugar ressequido”, o paralelismo favorece o sentido topográfico; a formulação mantém a personificação poética.
- source_word: לְמַבּוּעֵי מָיִם
  choice: em fontes de água
  rationale: מַבּוּעַ é uma nascente ou fonte. O plural “fontes de água” comunica a abundância do texto hebraico.
- source_word: בִּנְוֵה תַנִּים
  choice: no lugar onde vivem os chacais
  rationale: נָוֶה indica morada ou habitat, e תַנִּים, neste cenário profético de desolação, refere-se provavelmente a chacais. A expressão é corrente e inteligível.
- source_word: רִבְצָהּ
  choice: onde eles se deitam
  rationale: A palavra deriva de רבץ, “deitar-se, agachar-se”. A forma verbal portuguesa explicita naturalmente sua relação contextual com os chacais, sem ocultar a sintaxe hebraica comprimida.
- source_word: חָצִיר
  choice: capim
  rationale: חָצִיר significa normalmente erva ou capim. “Capim” é concreto, natural e amplamente compreensível, sobretudo para leitores brasileiros.
- source_word: לְקָנֶה וָגֹמֶא
  choice: juncos e papiros
  rationale: קָנֶה designa cana ou junco; גֹמֶא pode designar papiro ou outra planta aquática semelhante. A dupla “juncos e papiros” expressa claramente a nova vegetação de área úmida.
