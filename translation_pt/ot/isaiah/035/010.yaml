  text: וּ/פְדוּיֵ֨י יְהוָ֜ה יְשֻׁב֗וּ/ן וּ/בָ֤אוּ צִיּוֹן֙ בְּ/רִנָּ֔ה וְ/שִׂמְחַ֥ת עוֹלָ֖ם עַל רֹאשָׁ֑/ם שָׂשׂ֤וֹן וְ/שִׂמְחָה֙ יַשִּׂ֔יגוּ וְ/נָ֖סוּ יָג֥וֹן וַ/אֲנָחָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/010.yaml
  text: And the redeemed of Yahweh will return and come to Zion with singing; everlasting joy will be upon their heads. Gladness and joy will overtake them[a], and sorrow and sighing will flee away.
translation:
  language: pt
  text: E os redimidos[a] de Yahweh voltarão e chegarão a Sião com cânticos de alegria; alegria eterna estará sobre a cabeça deles. Júbilo e alegria os alcançarão, e a tristeza e o gemido fugirão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «os resgatados».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְדוּיֵי יְהוָה
  choice: os redimidos de Yahweh
  rationale: פְדוּיֵי é um particípio passivo substantivado de פדה e designa aqueles que foram resgatados ou redimidos. “Redimidos” preserva o sentido amplo de libertação sem restringi-lo necessariamente ao pagamento de um resgate. O nome divino יְהוָה é transliterado como “Yahweh”.
- source_word: יְשֻׁבוּן
  choice: voltarão
  rationale: A forma de שוב expressa o retorno dos redimidos; o futuro simples é natural e direto em português.
- source_word: וּבָאוּ צִיּוֹן
  choice: e chegarão a Sião
  rationale: בוא pode significar vir, chegar ou entrar. “Chegarão a Sião” comunica naturalmente o movimento até o destino, sem acrescentar uma preposição ausente no hebraico.
- source_word: בְּרִנָּה
  choice: com cânticos de alegria
  rationale: רִנָּה denota um clamor jubiloso, que pode ser canto ou grito de alegria. A expressão escolhida mantém tanto a dimensão vocal quanto o tom festivo.
- source_word: וְשִׂמְחַת עוֹלָם
  choice: alegria eterna
  rationale: A construção significa literalmente alegria de duração indefinida ou perpétua. “Alegria eterna” é conciso, poético e claro.
- source_word: עַל רֹאשָׁם
  choice: sobre a cabeça deles
  rationale: A tradução conserva a imagem concreta da alegria repousando sobre eles, talvez como coroa ou adorno, sem explicá-la no corpo do texto.
- source_word: שָׂשׂוֹן וְשִׂמְחָה
  choice: Júbilo e alegria
  rationale: Os dois substantivos hebraicos têm sentidos próximos, mas a combinação deve ser preservada. “Júbilo” destaca a expressão festiva, enquanto “alegria” comunica o estado interior.
- source_word: יַשִּׂיגוּ
  choice: os alcançarão
  rationale: נשׂג pode significar alcançar, atingir ou apanhar. Com júbilo e alegria como sujeitos, “os alcançarão” preserva a personificação e a imagem de bênçãos que chegam até os redimidos.
- source_word: וְנָסוּ
  choice: fugirão
  rationale: נוס significa fugir. A escolha mantém a personificação da tristeza e do gemido e evita acrescentar uma ideia de mero desaparecimento.
- source_word: יָגוֹן וַאֲנָחָה
  choice: a tristeza e o gemido
  rationale: יָגוֹן é tristeza ou pesar, e אֲנָחָה é suspiro, gemido ou lamento. “Tristeza e gemido” preserva as dimensões emocional e audível do sofrimento.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome próprio divino e evita substituí-lo por um título.
- issue: Sentido de פְדוּיֵי
  choice: redimidos
  alternative: resgatados
  rationale: Ambos os sentidos são lexicalmente possíveis. “Redimidos” mantém a amplitude da imagem de libertação; “resgatados” poderia realçar mais especificamente a noção de resgate. A alternativa é registrada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A cadência poética e as personificações do hebraico foram preservadas. Empregou-se “cabeça” no singular distributivo, natural em português, embora o hebraico use literalmente “cabeças” com sufixo plural.
