  text: וְ/הָיָה שָׁ֞ם מַסְל֣וּל וָ/דֶ֗רֶךְ וְ/דֶ֤רֶךְ הַ/קֹּ֨דֶשׁ֙ יִקָּ֣רֵא לָ֔/הּ לֹֽא יַעַבְרֶ֥/נּוּ טָמֵ֖א וְ/הוּא לָ֑/מוֹ הֹלֵ֥ךְ דֶּ֛רֶךְ וֶ/אֱוִילִ֖ים לֹ֥א יִתְעֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/008.yaml
  text: And there shall be a highway there[a], and a road, and it shall be called the Holy Way. The unclean shall not pass over it, but it shall be for them[b]; whoever walks on the way—even fools—shall not go astray.
translation:
  language: pt
  text: Haverá ali uma estrada e um caminho, que será chamado Caminho Santo. O impuro não passará por ele, mas esse caminho será para eles[a]. Os que andarem por esse caminho, mesmo os insensatos, não se desviarão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase hebraica é difícil. Também pode ser entendida como “e ele estará com eles” ou “ele pertencerá a eles”.
    reason: alternative_reading
  - marker: b
    text: Ou “não vaguearão” ou “não errarão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַסְלוּל
  choice: estrada
  rationale: Designa uma via preparada ou elevada. “Estrada” comunica com naturalidade a imagem de uma rota construída, sem acrescentar uma característica não explicitada no contexto imediato.
- source_word: דֶּרֶךְ
  choice: caminho
  rationale: O termo se repete no versículo. “Caminho” funciona tanto para a via concreta como para sua dimensão temática e permite a designação natural “Caminho Santo”.
- source_word: הַקֹּדֶשׁ
  choice: Santo
  rationale: Na construção com דֶּרֶךְ, indica um caminho consagrado a Deus. “Caminho Santo” preserva o sentido sacro e a forma de nomeação.
- source_word: יִקָּרֵא לָהּ
  choice: será chamado
  rationale: O nifal de קרא expressa aqui uma fórmula passiva de nomeação; o referente é o caminho.
- source_word: טָמֵא
  choice: o impuro
  rationale: O adjetivo é substantivado e pode abranger impureza ritual e moral. A formulação não restringe o sentido a apenas uma dessas dimensões.
- source_word: יַעַבְרֶנּוּ
  choice: não passará por ele
  rationale: Mantém a imagem de deslocamento de עבר e explicita de modo natural que o sufixo remete ao caminho.
- source_word: וְהוּא לָמוֹ
  choice: mas ele será para eles
  rationale: A construção é sintaticamente difícil. A leitura adotada entende o pronome como referência ao caminho e לָמוֹ como “para eles”, em contraste com a exclusão do impuro. Outras leituras são registradas em nota.
- source_word: הֹלֵךְ דֶּרֶךְ
  choice: os que percorrerem o caminho
  rationale: Expressa em português corrente o valor genérico do particípio, referindo-se aos viajantes dessa rota.
- source_word: אֱוִילִים
  choice: insensatos
  rationale: Denota pessoas caracterizadas por insensatez, não por mera limitação intelectual. “Insensatos” é digno, claro e menos coloquial que “tolos” neste contexto.
- source_word: לֹא יִתְעוּ
  choice: não se desviarão
  rationale: תעה pode indicar vaguear, errar ou sair do caminho. “Não se desviarão” preserva simultaneamente o sentido espacial e o possível alcance figurado.
theological_decisions:
- issue: Natureza da impureza em “o impuro não passará por ele”
  choice: Manter a categoria ampla “o impuro”.
  alternative: “o ritualmente impuro” ou “o moralmente impuro”
  rationale: O termo hebraico pode ter ressonâncias cultuais e éticas na literatura profética. Restringi-lo a uma só dimensão eliminaria uma tensão presente no texto.
- issue: Interpretação da construção difícil וְהוּא לָמוֹ
  choice: 'Entender o pronome como referência ao caminho: “mas ele será para eles”.'
  alternative: “e ele estará com eles” ou “ele pertencerá a eles”
  rationale: A sintaxe é comprimida e admite mais de uma análise. A leitura escolhida estabelece uma sequência contextual coerente entre a exclusão do impuro e o caminho destinado aos que o percorrem, sem ocultar as alternativas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução conserva a metáfora da peregrinação, mantém “Caminho Santo” como nome e evita definir a impureza exclusivamente em termos rituais ou morais. O plural em “os que percorrerem” produz uma construção idiomática em português e concorda com o desfecho plural hebraico.
