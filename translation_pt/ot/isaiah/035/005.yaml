  text: אָ֥ז תִּפָּקַ֖חְנָה עֵינֵ֣י עִוְרִ֑ים וְ/אָזְנֵ֥י חֵרְשִׁ֖ים תִּפָּתַֽחְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/005.yaml
  text: Then the eyes of the blind will be opened[a], and the ears of the deaf will be opened.
translation:
  language: pt
  text: Então os olhos dos cegos se abrirão, e os ouvidos dos surdos se abrirão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Advérbio temporal que assinala o momento futuro decorrente na sequência profética; “Então” é natural e conciso em português.
- source_word: תִּפָּקַחְנָה
  choice: se abrirão
  rationale: Nifal imperfeito, terceira pessoa do feminino plural, de פקח, tendo “olhos” como sujeito. A construção pronominal é natural em português e preserva o sentido passivo de abertura.
- source_word: עֵינֵי עִוְרִים
  choice: os olhos dos cegos
  rationale: Mantém a construção hebraica concisa e o paralelismo corporal, usando o adjetivo substantivado de modo corrente em português.
- source_word: וְאָזְנֵי חֵרְשִׁים
  choice: e os ouvidos dos surdos
  rationale: Reproduz diretamente a construção coordenada e o paralelismo com a primeira oração.
- source_word: תִּפָּתַחְנָה
  choice: serão desobstruídos
  rationale: O verbo פתח significa literalmente “ser abertos”; com “ouvidos”, “serão desobstruídos” comunica de modo natural a restauração da audição, sem perder a imagem de algo antes impedido.
theological_decisions:
- issue: Natureza da imagem de restauração
  choice: Linguagem direta de restauração corporal, sem limitar seu alcance a uma cura somente física nem a uma percepção somente espiritual.
  alternative: Interpretar exclusivamente como cura milagrosa literal ou exclusivamente como renovação espiritual metafórica.
  rationale: O versículo emprega imagens corporais concretas — olhos e ouvidos —, mas não define sozinho todo o alcance de seu cumprimento. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva o paralelismo poético e distingue naturalmente os dois verbos hebraicos. O marcador [a] aparece no texto principal junto à expressão anotada.
