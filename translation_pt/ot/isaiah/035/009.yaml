id: ISA.35.9
reference: Isaiah 35:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לֹא יִהְיֶ֨ה שָׁ֜ם אַרְיֵ֗ה וּ/פְרִ֤יץ חַיּוֹת֙ בַּֽל יַעֲלֶ֔/נָּה לֹ֥א תִמָּצֵ֖א שָׁ֑ם וְ/הָלְכ֖וּ גְּאוּלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/009.yaml
  text: No lion will be there[a], and no ravenous beast will go up on it; it will not be found there[c][b], but the redeemed will walk there.
translation:
  language: pt
  text: Ali não haverá leão, e nenhuma fera voraz[a] subirá por ela[b]; não será encontrada ali. Mas os redimidos[c] andarão por ali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fera violenta”, “fera feroz” ou “animal predador”.
    reason: lexical_alternative
  - marker: b
    text: O pronome em “por ela” provavelmente se refere à estrada mencionada no versículo anterior.
    reason: cross_reference
  - marker: c
    text: Ou “os resgatados”. Aqui o hebraico emprega o termo traduzido por “redimidos”, distinto do termo usado no versículo seguinte.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְיֵה
  choice: leão
  rationale: Termo direto para o animal; o singular tem sentido genérico, como no hebraico.
- source_word: פְרִיץ חַיּוֹת
  choice: fera voraz
  rationale: פְרִיץ comunica violência, ferocidade ou ação predatória; com חַיּוֹת, designa um animal selvagem perigoso. “Fera voraz” preserva tanto a ameaça quanto a imagem animal em português natural.
- source_word: בַּל
  choice: nenhuma / não
  rationale: A partícula poética reforça a negação; em português, sua força é expressa naturalmente pela combinação de “nenhuma” e “não”.
- source_word: יַעֲלֶנָּה
  choice: subirá por ela
  rationale: עלה significa “subir”. O sufixo feminino provavelmente retoma a estrada elevada do versículo anterior; “por ela” conserva essa referência sem repetir explicitamente “estrada”.
- source_word: תִמָּצֵא
  choice: não será encontrada
  rationale: O nifal de מצא significa normalmente “ser encontrado”. A forma feminina concorda naturalmente, em português, com “fera”.
- source_word: גְּאוּלִים
  choice: os redimidos
  rationale: O particípio passivo de גאל designa aqueles que foram redimidos ou recuperados. “Os redimidos” é conciso e mantém a ressonância teológica do termo.
- source_word: וְהָלְכוּ
  choice: andarão por ali
  rationale: הלך é o verbo comum para “andar/ir”. “Andarão por ali” explicita de modo natural o percurso implícito pela estrada mencionada no contexto.
- source_word: שָׁם
  choice: ali
  rationale: O advérbio aponta para o lugar seguro em foco; “ali” é natural e claro em português.
theological_decisions:
- issue: Terminologia de redenção em גְּאוּלִים
  choice: os redimidos
  alternative: os resgatados
  rationale: Este versículo usa גאל, enquanto o versículo seguinte usa פדה. “Os redimidos” permite preservar a distinção lexical entre os dois termos, sem apagar sua proximidade semântica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura poética mantém a repetição de “ali” e o contraste entre a ausência de animais perigosos e a passagem segura dos redimidos.
