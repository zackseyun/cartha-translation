source:
  edition: WLC
  text: יְשֻׂשׂ֥וּ/ם מִדְבָּ֖ר וְ/צִיָּ֑ה וְ/תָגֵ֧ל עֲרָבָ֛ה וְ/תִפְרַ֖ח כַּ/חֲבַצָּֽלֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/001.yaml
  text: The wilderness and the dry land will rejoice[a]; the desert plain will be glad and blossom like the crocus.
translation:
  language: pt
  text: O deserto e a terra ressequida se alegrarão; a planície árida exultará e florescerá como a flor de açafrão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lírio”, “asfódelo” ou outra flor bulbosa; não se sabe ao certo qual planta é indicada pelo termo hebraico חֲבַצָּלֶת.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשֻׂשׂוּם
  choice: se alegrarão
  rationale: O verbo שׂושׂ expressa alegria intensa. O plural concorda naturalmente com “o deserto e a terra ressequida”; a forma poética terminada em ם não foi reproduzida de modo artificial.
- source_word: מִדְבָּר
  choice: deserto
  rationale: Designa uma região erma e não cultivada. “Deserto” é claro e natural em português, sem exigir a imagem específica de dunas arenosas.
- source_word: צִיָּה
  choice: terra ressequida
  rationale: Preserva a ideia de extrema aridez e forma um par poético natural com “deserto”.
- source_word: תָגֵל
  choice: exultará
  rationale: O verbo גיל indica alegria jubilosa. “Exultará” preserva sua intensidade e evita repetição imediata de “se alegrarão”.
- source_word: עֲרָבָה
  choice: planície árida
  rationale: Neste contexto poético, o termo é entendido como nome comum para uma estepe ou planície desértica, não necessariamente como o topônimo Arabá.
- source_word: תִפְרַח
  choice: florescerá
  rationale: O verbo פרח descreve o brotar ou florescer da vegetação e sustenta a imagem da transformação da terra árida.
- source_word: חֲבַצָּלֶת
  choice: flor de açafrão
  rationale: A identificação botânica é incerta. “Flor de açafrão” oferece uma imagem compreensível de uma flor bulbosa, enquanto a incerteza é explicitamente preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, poético e acessível, com paralelismo preservado. Empregou-se “terra ressequida” e “planície árida” para distinguir os termos hebraicos relacionados à aridez. O marcador da nota foi colocado junto ao nome da flor, ao qual a incerteza lexical se refere.
