id: ISA.35.4
reference: Isaiah 35:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אִמְרוּ֙ לְ/נִמְהֲרֵי לֵ֔ב חִזְק֖וּ אַל תִּירָ֑אוּ הִנֵּ֤ה אֱלֹֽהֵי/כֶם֙ נָקָ֣ם יָב֔וֹא גְּמ֣וּל אֱלֹהִ֔ים ה֥וּא יָב֖וֹא וְ/יֹשַׁעֲ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/004.yaml
  text: Say to those with an anxious heart[a], “Be strong; do not fear. Look, your God will come with vengeance, with the recompense of God[b]; he himself will come and save you.”
translation:
  language: pt
  text: 'Digam aos de coração aflito[a]: “Sejam fortes; não tenham medo. Vejam! O Deus de vocês virá com vingança, com a retribuição de Deus[b]. Ele mesmo virá e os salvará.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos de coração precipitado”, isto é, aos que estão interiormente agitados ou tomados de pânico.
    reason: lexical_alternative
  - marker: b
    text: Também se pode entender como “com retribuição divina”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִמְהֲרֵי לֵב
  choice: aos de coração aflito
  rationale: A expressão é literalmente “apressados de coração”, mas, no contexto, descreve pessoas interiormente agitadas ou tomadas de pânico. “De coração aflito” comunica isso em português natural sem reduzi-la apenas ao medo.
- source_word: חִזְקוּ
  choice: Sejam fortes
  rationale: Reproduz diretamente o imperativo plural e conserva a força exortativa.
- source_word: אַל תִּירָאוּ
  choice: não tenham medo
  rationale: Forma corrente e clara em português para a proibição, mantendo o plural.
- source_word: הִנֵּה
  choice: Vejam!
  rationale: Mantém a função de chamar enfaticamente a atenção para a ação divina anunciada.
- source_word: אֱלֹהֵיכֶם
  choice: O Deus de vocês
  rationale: Preserva o sufixo de segunda pessoa do plural e é amplamente compreensível no português moderno.
- source_word: נָקָם
  choice: vingança
  rationale: Equivalente direto do substantivo hebraico, sem suavizar sua relação tensa com a salvação que vem em seguida.
- source_word: גְּמוּל אֱלֹהִים
  choice: a retribuição de Deus
  rationale: Mantém explicitamente אֱלֹהִים e a relação construta, evitando decidir além do texto se o genitivo enfatiza origem, posse ou caráter.
- source_word: הוּא
  choice: Ele mesmo
  rationale: 'Expressa a ênfase do pronome independente junto ao verbo: é o próprio Deus quem vem.'
- source_word: וְיֹשַׁעֲכֶם
  choice: e os salvará
  rationale: Traduz o hifil de ישׁע de modo amplo e direto, adequado tanto ao livramento imediato quanto à ressonância teológica do termo.
theological_decisions:
- issue: Relação entre a vingança divina e a salvação
  choice: Manter lado a lado a vingança/retribuição de Deus e sua ação salvadora.
  alternative: Abrandar “vingança” para “justiça” ou restringir a salvação a um sentido exclusivamente espiritual.
  rationale: O hebraico apresenta diretamente os dois motivos. A tradução conserva essa tensão teológica sem explicar contra quem recai a vingança nem limitar a natureza da salvação.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas plurais naturais no Brasil. “O Deus de vocês” explicita com clareza o possessivo plural; “Vejam!” conserva o chamado de atenção de הִנֵּה. A pontuação separa os anúncios da vinda divina sem alterar sua relação sintática.
source_grounding:
  english_pob_role: consult_only
