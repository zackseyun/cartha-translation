base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/005.yaml
  text: 'Is this the fast that I choose: a day for a man to humble himself? Is it to bow down his head like a reed, and to spread out sackcloth and ashes? Will you call this a fast, and a day acceptable to the LORD?'
translation:
  language: pt
  text: 'É este o jejum que escolho: um dia para uma pessoa se humilhar? É para curvar a cabeça como um junco e estender pano de saco e cinzas? É isso que você chama de jejum e de um dia aceitável ao SENHOR?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַנּוֹת ... נַפְשׁוֹ
  choice: humilhar a si mesma
  rationale: A expressão idiomática significa afligir ou humilhar a própria pessoa. Esta formulação conserva a força reflexiva sem sugerir necessariamente autoflagelação.
- source_word: אָדָם
  choice: a pessoa
  rationale: Aqui o substantivo tem sentido humano genérico; “a pessoa” comunica isso naturalmente em português atual.
- source_word: כְאַגְמֹן
  choice: como um junco
  rationale: 'Mantém a imagem vegetal do original: a cabeça inclinada como uma haste flexível.'
- source_word: יַצִּיעַ
  choice: deitar-se sobre
  rationale: O verbo pode indicar estender ou fazer uma cama. No contexto ritual, a formulação transmite o ato de usar pano de saco e cinzas como leito sem sobrecarregar a frase.
- source_word: יוֹם רָצוֹן
  choice: dia aceitável
  rationale: Expressa um dia que recebe o favor ou a aprovação do SENHOR, preservando a linguagem avaliativa do hebraico.
- source_word: יהוה
  choice: SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o nome divino por SENHOR em versaletes.
theological_decisions:
- issue: Natureza da crítica ao jejum
  choice: Preservar as perguntas retóricas que rejeitam a mera encenação exterior
  alternative: Declarar diretamente que todo jejum ritual é inválido
  rationale: O versículo critica um modo de jejuar caracterizado por humilhação externa, e o contexto define o jejum desejado; não autoriza uma rejeição geral do jejum.
- issue: Sentido de ענה נפש
  choice: “humilhar a si mesma”
  alternative: “afligir a sua alma”
  rationale: “Alma” poderia ser lida como uma parte imaterial separada, enquanto נֶפֶשׁ aqui se refere à própria pessoa; ainda assim, “humilhar” conserva a linguagem religiosa e a tensão do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. As perguntas retóricas foram mantidas. “Será apenas” torna natural a elipse hebraica e destaca que os gestos externos descritos não bastam, sem acrescentar uma conclusão doutrinária alheia ao contexto.
