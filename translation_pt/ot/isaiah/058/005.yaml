review_pass:
  verdict: revise
  source_fidelity: A tradução preserva a estrutura interrogativa e a crítica à exterioridade do jejum. Contudo, «deitar-se sobre pano de saco e cinzas» desloca o sentido de יַצִּיעַ, que descreve estender/dispor pano de saco e cinzas, não necessariamente deitar-se sobre eles. «Apenas» também não está expresso no hebraico, embora a pergunta retórica já comunique a crítica.
  naturalness: O texto é claro e de registro apropriado. A revisão torna a segunda pergunta mais próxima da sintaxe e das ações descritas no hebraico, sem perder fluência em português contemporâneo.
  terminology: «Jejum», «humilhar-se», «pano de saco», «cinzas» e «SENHOR» são escolhas adequadas. «Uma pessoa» comunica apropriadamente o uso genérico de אָדָם.
  issues:
  - severity: medium
    issue: «deitar-se sobre pano de saco e cinzas» para וְשַׂק וָאֵפֶר יַצִּיעַ
    rationale: O verbo יַצִּיעַ significa estender, espalhar ou dispor; o hebraico não afirma que a pessoa se deite sobre esses elementos. «Estender pano de saco e cinzas» conserva a ação sem acrescentar esse detalhe.
  - severity: low
    issue: «Será apenas» acrescenta uma restrição não lexicalizada
    rationale: A formulação pode ser inferida pela força retórica do contexto, mas não é necessária. A pergunta direta já preserva a reprovação implícita no original.
  revised_text: 'É este o jejum que escolho: um dia para uma pessoa se humilhar? É para curvar a cabeça como um junco e estender pano de saco e cinzas? É isso que você chama de jejum e de um dia aceitável ao SENHOR?'
