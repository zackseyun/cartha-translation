  to: 'É este o jejum que escolho: um dia para uma pessoa se humilhar? É para curvar a cabeça como um junco e estender pano de saco e cinzas? É isso que você chama de jejum e de um dia aceitável ao SENHOR?'
  rationale: A revisão substitui a imagem de alguém deitando-se sobre pano de saco e cinzas pela ação explicitamente indicada no hebraico, isto é, estendê-los ou dispô-los. Também remove «apenas», preservando a pergunta retórica sem explicitar além do texto a insuficiência dos atos externos.
  reviewer_model: gpt-5.6-terra
