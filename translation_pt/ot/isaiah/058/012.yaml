  text: וּ/בָנ֤וּ מִמְּ/ךָ֙ חָרְב֣וֹת עוֹלָ֔ם מוֹסְדֵ֥י דוֹר וָ/ד֖וֹר תְּקוֹמֵ֑ם וְ/קֹרָ֤א לְ/ךָ֙ גֹּדֵ֣ר פֶּ֔רֶץ מְשֹׁבֵ֥ב נְתִיב֖וֹת לָ/שָֽׁבֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/012.yaml
  text: Those from among you will rebuild the ancient ruins[a]; you will raise up the foundations of generation after generation, and you will be called the repairer of the breach[b], the restorer of paths for dwelling.
translation:
  language: pt
  text: Os que vierem de você reconstruirão as ruínas antigas; você reerguerá os alicerces de geração após geração[a]. E será chamado reparador de brechas, restaurador de caminhos para habitar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “os alicerces de geração e geração”; também pode ser entendido como “os alicerces de muitas gerações”.
    reason: lexical_alternative
  - marker: b
    text: Ou “restaurador de caminhos nos quais se possa habitar” ou “restaurador de ruas para moradia”. A expressão final provavelmente descreve a restauração da comunidade para que volte a ser habitável.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנוּ מִמְּךָ
  choice: Os que vierem de você reconstruirão
  rationale: A construção com מִמְּךָ indica pessoas provenientes do destinatário, não a fonte do material. “Os que vierem de você” mantém essa ideia sem especificar indevidamente se são descendentes ou membros da comunidade; “reconstruirão” corresponde ao contexto de restauração.
- source_word: חָרְבוֹת עוֹלָם
  choice: as ruínas antigas
  rationale: חָרְבוֹת designa ruínas ou lugares devastados, e עוֹלָם, neste contexto, aponta para grande antiguidade ou longa duração.
- source_word: מוֹסְדֵי דוֹר וָדוֹר
  choice: os alicerces de geração em geração
  rationale: Preserva tanto a imagem concreta dos alicerces quanto a expressão distributiva hebraica “geração e geração”.
- source_word: תְּקוֹמֵם
  choice: você reerguerá
  rationale: O causativo de קום comunica fazer levantar novamente. “Reerguerá” conserva a imagem de restauração de estruturas arruinadas.
- source_word: וְקֹרָא לְךָ
  choice: E será chamado
  rationale: A forma ativa impessoal hebraica é expressa naturalmente em português pela voz passiva, sem identificar quem confere os títulos.
- source_word: גֹּדֵר פֶּרֶץ
  choice: Reparador de Brechas
  rationale: גֹּדֵר descreve quem fecha, cerca ou conserta uma abertura; פֶּרֶץ é brecha ou ruptura. A formulação mantém a força metafórica e funciona como título.
- source_word: מְשֹׁבֵב נְתִיבוֹת
  choice: Restaurador de Caminhos
  rationale: O particípio causativo de שוב tem sentido restaurador, e נְתִיבוֹת designa caminhos ou vias. A tradução preserva o paralelismo com o título anterior.
- source_word: לָשָׁבֶת
  choice: para Habitação
  rationale: 'O infinitivo de ישב pode exprimir propósito ou resultado: os caminhos são restaurados com vistas à habitação. A formulação concisa preserva a abertura da construção hebraica.'
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A alternância do plural (“reconstruirão”) para o singular (“você reerguerá”) foi mantida, assim como no hebraico. As iniciais maiúsculas nos dois títulos destacam a designação pública recebida pelo destinatário, sem tratá-los como nomes divinos.
