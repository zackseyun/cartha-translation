  text: הֲ/ל֣וֹא זֶה֮ צ֣וֹם אֶבְחָרֵ/הוּ֒ פַּתֵּ֨חַ֙ חַרְצֻבּ֣וֹת רֶ֔שַׁע הַתֵּ֖ר אֲגֻדּ֣וֹת מוֹטָ֑ה וְ/שַׁלַּ֤ח רְצוּצִים֙ חָפְשִׁ֔ים וְ/כָל מוֹטָ֖ה תְּנַתֵּֽקוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/006.yaml
  text: 'Is not this the fast that I choose: to loosen the chains of wickedness[a], to untie the cords of the yoke, to send the oppressed out free[c][b], and to tear off every yoke?'
translation:
  language: pt
  text: 'Não é este o jejum que escolho: soltar as amarras da maldade[a], desatar as correias do jugo, pôr em liberdade os oprimidos[b] e romper todo jugo[c]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os vínculos da maldade”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os esmagados”.'
    reason: lexical_alternative
  - marker: c
    text: O hebraico repete “jugo” duas vezes, enfatizando a opressão como uma restrição física que deve ser removida.
    reason: cultural_note
lexical_decisions:
- source_word: צ֣וֹם
  choice: jejum
  rationale: Designa a prática religiosa do jejum; o substantivo português é direto e natural nesta construção.
- source_word: אֶבְחָרֵהוּ
  choice: que escolho
  rationale: Mantém o sentido básico de בחר, “escolher”, e a avaliação divina expressa no contexto, sem acrescentar a ideia interpretativa de deleite.
- source_word: פַּתֵּחַ
  choice: soltar
  rationale: Com amarras como objeto, “soltar” comunica naturalmente a abertura ou afrouxamento dos laços e preserva a imagem concreta.
- source_word: חַרְצֻבּוֹת רֶשַׁע
  choice: as amarras da maldade
  rationale: “Amarras” representa restrições ou vínculos sem especificar indevidamente correntes metálicas; “maldade” conserva a dimensão moral ampla de רֶשַׁע no contexto de opressão.
- source_word: הַתֵּר אֲגֻדּוֹת מוֹטָה
  choice: desatar as correias do jugo
  rationale: “Desatar” expressa a remoção das ataduras, enquanto “correias do jugo” mantém de modo compreensível a figura física de sujeição.
- source_word: וְשַׁלַּח רְצוּצִים חָפְשִׁים
  choice: pôr em liberdade os oprimidos
  rationale: Formulação portuguesa natural que conserva o movimento de libertação de שלח e o estado livre indicado por חָפְשִׁים; “oprimidos” comunica o valor contextual do particípio רְצוּצִים, literalmente associado a ser esmagado.
- source_word: וְכָל מוֹטָה תְּנַתֵּקוּ
  choice: e romper todo jugo
  rationale: “Romper” retém a força de נתק, que indica separar ou arrancar com violência, e preserva a segunda ocorrência da imagem do jugo.
theological_decisions:
- issue: Natureza do jejum escolhido por Deus
  choice: Apresentar o jejum mediante atos concretos de libertação e desmantelamento da opressão.
  alternative: Entender o texto principalmente como descrição de piedade interior ou bondade genérica.
  rationale: Os infinitivos hebraicos definem o jejum por ações tangíveis. A tradução mantém essa concretude ética e social sem negar o contexto religioso nem importar categorias doutrinárias posteriores.
- issue: Imagem repetida do jugo
  choice: Conservar “jugo” nas duas ocorrências.
  alternative: Substituir uma ou ambas as ocorrências por termos abstratos como “peso” ou “opressão”.
  rationale: A repetição de מוֹטָה apresenta a opressão como restrição física que deve ser desatada e rompida; manter a imagem preserva a força profética e a ênfase do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A construção interrogativa e a sequência de infinitivos reproduzem a forma retórica do hebraico. Evitaram-se tanto abstrações que apagariam as imagens físicas quanto literalismos pouco naturais, como “mandar os esmagados livres”.
