base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/014.yaml
  text: then you will delight yourself in Yahweh[a], and I will make you ride on the heights of the earth; I will feed you with the inheritance of Jacob your father[b], for the mouth of Yahweh has spoken.
translation:
  language: pt
  text: Então você se deleitará em Yahweh, e eu farei você cavalgar sobre as alturas da terra[a]; eu o alimentarei com a herança de Jacó, seu pai[b], pois a boca de Yahweh falou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os lugares altos da terra”. O hebraico também pode referir-se às “alturas do país/da terra”.
    reason: lexical_alternative
  - marker: b
    text: “Jacó, seu pai” emprega linguagem de família da aliança; Jacó é o antepassado do povo.
    reason: cultural_note
lexical_decisions:
- source_word: תִּתְעַנַּג עַל
  choice: encontrará sua alegria em
  rationale: Expressa de modo natural o hitpael de ענג, que indica deleitar-se ou desfrutar intensamente, e preserva em português a orientação pessoal marcada por עַל + Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: וְהִרְכַּבְתִּיךָ
  choice: farei você cavalgar
  rationale: Preserva a força causativa do hifil de רכב em linguagem atual e clara.
- source_word: בָּמֳותֵי אָרֶץ
  choice: as alturas da terra
  rationale: Mantém a imagem poética de elevação, segurança ou bênção sem restringi-la a conquista militar, relevo geográfico ou lugares de culto.
- source_word: וְהַאֲכַלְתִּיךָ
  choice: eu o alimentarei com
  rationale: O hifil de אכל pode significar fazer comer ou alimentar; esta formulação é idiomática e comunica o desfrute concedido da herança.
- source_word: נַחֲלַת יַעֲקֹב אָבִיךָ
  choice: a herança de Jacó, seu pai
  rationale: Conserva tanto a ressonância pactual de נחלה quanto a linguagem familiar do hebraico, esclarecida em nota.
- source_word: כִּי פִּי יְהוָה דִּבֵּר
  choice: pois a boca de Yahweh falou
  rationale: Retém a expressão hebraica explícita e sua solenidade como fórmula profética de autoridade divina.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o tetragrama; a transliteração preserva o nome pessoal e pactual em vez de substituí-lo por um título.
- issue: Sentido de “as alturas da terra”
  choice: Manter a metáfora aberta de exaltação, segurança e bênção
  alternative: Interpretar especificamente como domínio vitorioso, prosperidade territorial ou lugares altos
  rationale: O contexto não obriga a escolher apenas uma dessas nuances; preservar a imagem mantém sua amplitude poética e teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento singular foi mantido com “você”; após o primeiro uso, emprega-se o pronome oblíquo “o” para evitar repetição. A sintaxe conserva o paralelismo profético e as imagens concretas do hebraico.
