  source_fidelity: 'A primeira oração representa bem a denúncia: הֵן é adequadamente introduzido por “Vejam”, e os termos para disputa, violência e jejum foram mantidos. Na cláusula final, porém, “Não é jejuando como hoje que vocês farão...” é gramaticalmente possível, mas “como hoje” fica elíptico e pouco natural. A revisão explicita o referente comparativo implícito (“o jejum que fazem hoje”) e conserva o sentido de que tal jejum não fará a voz deles ser ouvida no alto.'
