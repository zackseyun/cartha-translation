base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/004.yaml
  text: Look[a], you fast for strife and contention, and to strike with a wicked fist[b]. You are not fasting today to make your voice heard on high.
translation:
  language: pt
  text: 'Vejam: vocês jejuam para brigas e conflitos e para golpear com um punho perverso[a]. O jejum que vocês fazem hoje não fará sua voz ser ouvida no alto[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “com um punho de maldade”.
    reason: lexical_alternative
  - marker: b
    text: “No alto” pode referir-se à esfera celestial, isto é, a fazer sua voz ser ouvida diante de Deus.
    reason: alternative_reading
lexical_decisions:
- source_word: הֵן
  choice: Vejam
  rationale: Mantém a interjeição enfática que chama a atenção e introduz a denúncia, em linguagem portuguesa atual.
- source_word: לְרִיב וּמַצָּה
  choice: para brigas e conflitos
  rationale: Reproduz os dois termos paralelos de disputa sem recorrer a vocabulário excessivamente erudito; a preposição preserva a orientação ou o resultado condenável do jejum.
- source_word: תָּצוּמוּ
  choice: vocês jejuam
  rationale: Traduz diretamente a forma verbal na segunda pessoa do plural como ação presente ou habitual no contexto da repreensão.
- source_word: וּלְהַכּוֹת
  choice: e para golpear
  rationale: Conserva a construção de finalidade ou resultado e a força física do verbo hebraico.
- source_word: בְּאֶגְרֹף רֶשַׁע
  choice: com punho perverso
  rationale: Expressa de modo natural a violência moralmente condenável; a construção mais literal é registrada em nota.
- source_word: לֹא תָצוּמוּ כַיּוֹם
  choice: Não é jejuando como hoje
  rationale: Preserva a força comparativa de כַיּוֹם e apresenta a negação como condenação da maneira atual de jejuar, não necessariamente de todo jejum realizado naquele dia.
- source_word: לְהַשְׁמִיעַ ... קוֹלְכֶם
  choice: que vocês farão sua voz ser ouvida
  rationale: Representa o sentido causativo do hifil de שמע e mantém 'voz' como correspondente direto de קוֹל.
- source_word: בַּמָּרוֹם
  choice: no alto
  rationale: Conserva a expressão espacial do hebraico sem explicitar 'Deus' ou 'céu', embora esse sentido esteja provavelmente implícito.
theological_decisions:
- issue: Referente de בַּמָּרוֹם, 'no alto'
  choice: Manter a expressão espacial 'no alto'.
  alternative: Traduzir explicitamente como 'no céu' ou 'diante de Deus'.
  rationale: O texto sugere a esfera divina, mas não nomeia Deus nem o céu neste versículo; a formulação preserva essa implicação sem torná-la mais explícita que o hebraico.
- issue: Alcance da negação na cláusula final
  choice: Entender que a forma de jejuar praticada 'como hoje' não fará a voz ser ouvida.
  alternative: Entender apenas que eles não estão jejuando naquele dia com a finalidade de serem ouvidos.
  rationale: A tradução conserva a possível força comparativa de כַּיּוֹם e a ligação entre a maneira corrompida do jejum e seu fracasso, sem afirmar que todo jejum naquele dia é rejeitado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa do plural em “vocês”. A construção “Não é jejuando como hoje que...” preserva a ênfase profética e a possível comparação do hebraico, sem soar arcaica.
