  source_fidelity: 'O texto reproduz fielmente a progressão do hebraico: a promessa temporal (“Então”), os dois verbos de apelo e resposta, a resposta divina imediata, e a condição introduzida por “Se”. “Yahweh”, “clamará por socorro”, “do seu meio”, “jugo”, “o apontar do dedo” e “o falar perverso” refletem adequadamente os termos e as imagens do texto-fonte. A vírgula final preserva corretamente a continuação sintática do versículo.'
