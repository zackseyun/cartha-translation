  terminology: A transliteração “Yahweh” é consistente com a decisão fornecida para o Tetragrama. “Jugo” preserva a metáfora hebraica sem a reduzir no texto principal a uma abstração. As notas explicam com sobriedade o sentido figurado do jugo e o gesto expresso por שְׁלַח אֶצְבַּע.
