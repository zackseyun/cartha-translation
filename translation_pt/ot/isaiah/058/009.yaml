id: ISA.58.9
reference: Isaiah 58:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אָ֤ז תִּקְרָא֙ וַ/יהוָ֣ה יַעֲנֶ֔ה תְּשַׁוַּ֖ע וְ/יֹאמַ֣ר הִנֵּ֑/נִי אִם תָּסִ֤יר מִ/תּֽוֹכְ/ךָ֙ מוֹטָ֔ה שְׁלַ֥ח אֶצְבַּ֖ע וְ/דַבֶּר אָֽוֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/009.yaml
  text: Then you will call[a], and Yahweh will answer; you will cry for help, and he will say, ‘Here I am.’ If you remove from your midst the yoke, the pointing of the finger, and speaking wickedness[c][b],
translation:
  language: pt
  text: 'Então você chamará, e Yahweh responderá; você clamará por socorro, e ele dirá: “Aqui estou”. Se você tirar do seu meio o jugo[a], o apontar do dedo[b] e o falar perverso[c],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O jugo” é uma metáfora para o tratamento opressor ou para cargas impostas a outras pessoas.
    reason: cultural_note
  - marker: b
    text: Literalmente, “o estender do dedo”; provavelmente se refere a um gesto acusatório ou desdenhoso.
    reason: lexical_alternative
  - marker: c
    text: Ou “o falar mal” ou “a fala maliciosa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Marca o resultado das condições anteriores de modo natural e conciso.
- source_word: תִּקְרָא
  choice: você chamará
  rationale: Preserva o sentido amplo de invocar a Deus e o paralelismo com o clamor por socorro.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso diretamente no texto hebraico.
- source_word: יַעֲנֶה
  choice: responderá
  rationale: Expressa a correspondência direta entre chamar e receber resposta.
- source_word: תְּשַׁוַּע
  choice: você clamará por socorro
  rationale: O verbo denota um clamor urgente por ajuda; a formulação torna explícita essa nuance.
- source_word: הִנֵּנִי
  choice: Aqui estou
  rationale: Forma idiomática, imediata e digna para a resposta que indica presença e prontidão.
- source_word: אִם תָּסִיר מִתּוֹכְךָ
  choice: Se você tirar do seu meio
  rationale: Mantém a força condicional e a dimensão comunitária da expressão hebraica.
- source_word: מוֹטָה
  choice: o jugo
  rationale: Conserva a metáfora concreta do hebraico para cargas e práticas opressoras.
- source_word: שְׁלַח אֶצְבַּע
  choice: o apontar do dedo
  rationale: Reproduz de forma natural a imagem hebraica de estender o dedo em gesto acusatório ou desdenhoso.
- source_word: דַבֶּר אָוֶן
  choice: o falar perverso
  rationale: Preserva a amplitude de אָוֶן, que neste contexto pode denotar fala má, maliciosa, nociva ou injusta.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz o Tetragrama; “Yahweh” preserva sua função como nome próprio sem substituir o nome por um título.
- issue: Referente de מוֹטָה
  choice: jugo como metáfora de opressão
  alternative: opressão; barra de jugo
  rationale: A tradução conserva a figura concreta, enquanto a nota esclarece sua aplicação social sem reduzir a metáfora a uma única interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém o paralelismo poético, a metáfora do jugo e a sequência condicional do hebraico. O singular “você” reflete as formas hebraicas singulares, que podem dirigir-se à comunidade como um todo.
