source:
  edition: WLC
  text: אִם תָּשִׁ֤יב מִ/שַּׁבָּת֙ רַגְלֶ֔/ךָ עֲשׂ֥וֹת חֲפָצֶ֖י/ךָ בְּ/י֣וֹם קָדְשִׁ֑/י וְ/קָרָ֨אתָ לַ/שַּׁבָּ֜ת עֹ֗נֶג לִ/קְד֤וֹשׁ יְהוָה֙ מְכֻבָּ֔ד וְ/כִבַּדְתּ/וֹ֙ מֵ/עֲשׂ֣וֹת דְּרָכֶ֔י/ךָ מִ/מְּצ֥וֹא חֶפְצְ/ךָ֖ וְ/דַבֵּ֥ר דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/013.yaml
  text: If you turn back your foot from the Sabbath[a], from doing your own pleasure on my holy day, and call the Sabbath a delight, the holy thing of Yahweh honorable, and honor it by not going your own ways, nor seeking your own pleasure, nor speaking a word[c][b],
translation:
  language: pt
  text: Se você deixar de profanar o sábado com seus passos, de buscar seus próprios interesses no meu santo dia, e chamar o sábado de deleite, e o santo dia de Yahweh de digno de honra, e se o honrar[a], não seguindo os seus próprios caminhos, não buscando os seus próprios interesses[b], nem falando palavra[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e se honrar a ele”, entendendo o pronome como referência a Yahweh, e não ao sábado.'
    reason: alternative_reading
  - marker: b
    text: “Seus próprios interesses” também pode ser traduzido por “seu próprio prazer”, “seu desejo” ou, neste contexto, “seus próprios negócios”.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “nem falando palavra”. A expressão é elíptica e pode se referir a conversas comuns, ociosas ou voltadas aos próprios interesses.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשִׁיב מִשַּׁבָּת רַגְלֶךָ
  choice: deixar de profanar o sábado com os seus passos
  rationale: A expressão concreta sobre fazer o pé recuar do sábado comunica a ideia de não o pisotear ou violar. A formulação preserva a imagem dos passos sem produzir em português a impressão equivocada de simplesmente afastar-se do sábado.
- source_word: עֲשׂוֹת חֲפָצֶיךָ
  choice: fazer o que bem entende
  rationale: חֵפֶץ pode indicar prazer, desejo, interesse ou ocupação. Aqui denota atividades escolhidas segundo a própria vontade, em contraste com a santidade do dia.
- source_word: בְּיוֹם קָדְשִׁי
  choice: no meu santo dia
  rationale: Reproduz de modo direto e natural a construção possessiva e a reivindicação divina sobre o dia.
- source_word: וְקָרָאתָ לַשַּׁבָּת עֹנֶג
  choice: chamar o sábado de deleite
  rationale: Mantém a estrutura predicativa do hebraico e traduz עֹנֶג por um substantivo português corrente e digno.
- source_word: לִקְדוֹשׁ יְהוָה מְכֻבָּד
  choice: o santo dia de Yahweh de digno de honra
  rationale: A expressão hebraica é condensada. No contexto, קְדוֹשׁ refere-se ao sábado como aquilo que é santo para Yahweh; explicitar 'dia' produz português inteligível sem alterar o referente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: וְכִבַּדְתּוֹ
  choice: e se o honrar
  rationale: O pronome masculino singular retoma mais naturalmente o sábado ou o santo dia no fluxo imediato. A possibilidade de referência a Yahweh é registrada em nota.
- source_word: מֵעֲשׂוֹת דְּרָכֶיךָ
  choice: não seguindo os seus próprios caminhos
  rationale: Expressa naturalmente o idioma hebraico de agir ou conduzir-se segundo os próprios caminhos e conserva a metáfora.
- source_word: מִמְּצוֹא חֶפְצְךָ
  choice: não buscando os seus próprios interesses
  rationale: Neste contexto, חֵפֶץ pode abranger desejo, prazer, assunto ou negócio. 'Interesses' conserva essa amplitude melhor que uma referência exclusiva a diversão.
- source_word: וְדַבֵּר דָּבָר
  choice: nem falando palavras vãs
  rationale: A expressão hebraica é literalmente 'falar palavra/coisa' e é semanticamente elíptica. A formulação indica fala comum, ociosa ou voltada aos próprios assuntos, sem restringi-la a uma categoria doutrinária específica.
theological_decisions:
- issue: Referente do sufixo em וְכִבַּדְתּוֹ
  choice: 'O pronome refere-se ao sábado ou ao santo dia: ''o honrar''.'
  alternative: 'O pronome pode referir-se a Yahweh: ''honrá-lo''.'
  rationale: O sábado é o foco e o antecedente contextual mais imediato, mas a forma masculina singular também permite que o ouvinte associe o pronome a Yahweh. A nota conserva a ambiguidade.
- issue: Natureza das atividades proibidas no sábado
  choice: Traduzir חֵפֶץ por expressões amplas como 'o que bem entende' e 'próprios interesses'.
  alternative: Traduzir especificamente por 'prazer', 'desejo' ou 'negócios'.
  rationale: O campo semântico inclui prazer, vontade, interesse e ocupação. O contexto não justifica limitar a ordem apenas ao lazer ou apenas ao comércio.
- issue: Sentido de וְדַבֵּר דָּבָר
  choice: Usar 'palavras vãs' no texto e explicar a concisão hebraica em nota.
  alternative: Manter literalmente 'nem falando palavra alguma'.
  rationale: A leitura absolutamente literal poderia sugerir proibição de toda fala, o que o hebraico elíptico não afirma de modo inequívoco. A nota preserva a incerteza interpretativa.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e inteligibilidade internacional. A sintaxe condicional foi repetida para organizar o longo período hebraico. Emprega-se “sábado” em minúscula conforme o uso corrente em português e “Yahweh” para o Tetragrama.
