id: ISA.58.1
reference: Isaiah 58:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: קְרָ֤א בְ/גָרוֹן֙ אַל תַּחְשֹׂ֔ךְ כַּ/שּׁוֹפָ֖ר הָרֵ֣ם קוֹלֶ֑/ךָ וְ/הַגֵּ֤ד לְ/עַמִּ/י֙ פִּשְׁעָ֔/ם וּ/לְ/בֵ֥ית יַעֲקֹ֖ב חַטֹּאתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/001.yaml
  text: Cry out with your throat[a]; do not hold back. Raise your voice like a trumpet, and declare to my people their rebellion[b], and to the house of Jacob their sins.
translation:
  language: pt
  text: Clame a plenos pulmões; não se contenha. Erga a voz como uma trombeta[a] e declare ao meu povo a sua rebeldia[b], e à casa de Jacó os seus pecados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como um chifre de carneiro”. O hebraico shofar designa um instrumento de chifre usado para dar sinais e fazer proclamações.
    reason: cultural_note
  - marker: b
    text: Ou “a sua transgressão”. O termo hebraico pode destacar uma violação deliberada, entendida como rebeldia contra Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרָא בְגָרוֹן
  choice: Clame a plenos pulmões
  rationale: A expressão hebraica é literalmente “clame com a garganta”. A formulação portuguesa preserva a imagem corporal e comunica uma proclamação forte e pública de modo natural.
- source_word: אַל תַּחְשֹׂךְ
  choice: não se contenha
  rationale: Transmite a proibição de restringir ou refrear a proclamação, com força imperativa e linguagem corrente.
- source_word: כַּשּׁוֹפָר
  choice: como uma trombeta
  rationale: Comunica com clareza moderna a função sonora e convocatória do shofar; a identificação cultural mais específica é preservada em nota.
- source_word: הָרֵם קוֹלֶךָ
  choice: Erga a voz
  rationale: Equivalente idiomático direto, digno e natural da expressão hebraica.
- source_word: וְהַגֵּד
  choice: e declare
  rationale: Expressa a comunicação direta e autorizada própria da denúncia profética.
- source_word: לְעַמִּי
  choice: ao meu povo
  rationale: Preserva de forma direta a relação possessiva e pactual expressa no hebraico.
- source_word: פִּשְׁעָם
  choice: a sua rebeldia
  rationale: O substantivo פֶּשַׁע pode denotar transgressão deliberada ou revolta; “rebeldia” mantém esse caráter intencional.
- source_word: וּלְבֵית יַעֲקֹב
  choice: e à casa de Jacó
  rationale: Mantém a designação nacional e pactual em paralelo com “meu povo”.
- source_word: חַטֹּאתָם
  choice: os seus pecados
  rationale: Preserva o plural hebraico e distingue os atos pecaminosos da rebeldia mencionada no membro paralelo.
theological_decisions:
- issue: Relação entre “meu povo” e “casa de Jacó”
  choice: Manter as duas expressões como objetos paralelos e distintos na redação.
  alternative: Tratar “casa de Jacó” apenas como uma aposição explicativa de “meu povo”.
  rationale: A estrutura hebraica apresenta duas formulações paralelas, intensificando a acusação profética sem definir além do texto a relação exata entre elas.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “A plenos pulmões” reproduz naturalmente a intensidade concreta de “com a garganta”; “não se contenha” evita uma formulação rígida. A repetição de “ao meu povo” e “à casa de Jacó” conserva o paralelismo profético.
