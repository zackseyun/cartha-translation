  text: וְ/תָפֵ֤ק לָֽ/רָעֵב֙ נַפְשֶׁ֔/ךָ וְ/נֶ֥פֶשׁ נַעֲנָ֖ה תַּשְׂבִּ֑יעַ וְ/זָרַ֤ח בַּ/חֹ֨שֶׁךְ֙ אוֹרֶ֔/ךָ וַ/אֲפֵלָתְ/ךָ֖ כַּֽ/צָּהֳרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/010.yaml
  text: and if you pour yourself out for the hungry and satisfy the afflicted soul[a], then your light will rise in the darkness[b], and your gloom will be like noonday.
translation:
  language: pt
  text: e se você se entregar em favor do faminto e satisfizer a pessoa aflita[a], então a sua luz nascerá nas trevas, e a sua escuridão será como o meio-dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a alma aflita”. Aqui, “alma” pode indicar a pessoa inteira, especialmente alguém abatido ou necessitado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָפֵק ... נַפְשֶׁךָ
  choice: se você se entregar
  rationale: A construção idiomática com נֶפֶשׁ exprime dedicar ou empenhar a si mesmo em favor de alguém. “Entregar-se” comunica essa doação pessoal em português natural, sem reduzir o sentido a dar apenas algum bem material.
- source_word: לָרָעֵב
  choice: em favor do faminto
  rationale: O adjetivo substantivado designa quem tem fome, e ל marca o beneficiário. “Faminto” mantém a força da necessidade e combina naturalmente com “em favor de”.
- source_word: וְנֶפֶשׁ נַעֲנָה
  choice: a pessoa aflita
  rationale: נֶפֶשׁ pode designar a pessoa inteira, enquanto נַעֲנָה descreve quem foi afligido ou humilhado. A formulação evita sugerir que apenas uma parte imaterial esteja em sofrimento.
- source_word: תַּשְׂבִּיעַ
  choice: satisfizer
  rationale: O hifil de שׂבע significa levar à saciedade ou satisfazer plenamente; “satisfizer” preserva tanto o provável pano de fundo da fome quanto a aplicação à necessidade da pessoa aflita.
- source_word: וְזָרַח
  choice: nascerá
  rationale: No contexto condicional, a forma apresenta o resultado futuro. Em português, a luz “nascer” expressa naturalmente seu aparecimento, preservando a imagem.
- source_word: בַּחֹשֶׁךְ
  choice: nas trevas
  rationale: Tradução locativa e imagética da expressão hebraica; “trevas” oferece registro bíblico digno sem ser obscuro.
- source_word: אוֹרֶךָ
  choice: a sua luz
  rationale: Mantém diretamente a metáfora hebraica de restauração e bênção, sem explicá-la no corpo do texto.
- source_word: וַאֲפֵלָתְךָ
  choice: a sua escuridão
  rationale: אֲפֵלָה indica escuridão densa ou obscuridade. “Escuridão” conserva a imagem e distingue lexicalmente este termo das “trevas” da oração anterior.
- source_word: כַּצָּהֳרָיִם
  choice: como o meio-dia
  rationale: צָהֳרַיִם designa o meio-dia, imagem da luminosidade mais intensa; a comparação é direta e natural em português.
theological_decisions:
- issue: Sentido antropológico das duas ocorrências de נֶפֶשׁ
  choice: Expressar a primeira pela forma reflexiva “se entregar” e a segunda como “pessoa aflita”.
  alternative: Traduzir literalmente ambas as ocorrências como “alma”.
  rationale: Neste contexto, נֶפֶשׁ se refere ao próprio ser ou à pessoa inteira. A tradução contextual preserva a ideia de dedicação pessoal e de cuidado integral, sem introduzir uma separação técnica entre corpo e alma que o hebraico não exige.
- issue: Natureza da promessa de luz
  choice: Preservar as metáforas “luz”, “trevas”, “escuridão” e “meio-dia” sem identificar explicitamente seu referente.
  alternative: Explicitar a luz como prosperidade, orientação divina ou restauração.
  rationale: A imagem pode abranger bênção, restauração e clareza, mas o texto não restringe seu alcance a uma única interpretação; manter a metáfora conserva essa amplitude teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura condicional foi explicitada por “se... então”, conforme a função contextual. “Faminto” preserva intensidade sem soar arcaico; “pessoa aflita” comunica com clareza o valor integral de נֶפֶשׁ.
