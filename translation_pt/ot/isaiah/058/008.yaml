  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אָ֣ז יִבָּקַ֤ע כַּ/שַּׁ֨חַר֙ אוֹרֶ֔/ךָ וַ/אֲרֻכָתְ/ךָ֖ מְהֵרָ֣ה תִצְמָ֑ח וְ/הָלַ֤ךְ לְ/פָנֶ֨י/ךָ֙ צִדְקֶ֔/ךָ כְּב֥וֹד יְהוָ֖ה יַאַסְפֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/008.yaml
  text: Then your light will break forth like the dawn[a], and your healing will spring up quickly; your righteousness will go before you[c][b], and the glory of Yahweh will be your rear guard.
translation:
  language: pt
  text: Então a sua luz irromperá como a alvorada, e a sua cura[a] brotará depressa; a sua retidão[b] irá à sua frente, e a glória de Yahweh será a sua retaguarda.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a sua recuperação” ou “a sua restauração”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a sua justiça”; também pode ter o sentido de “a sua vindicação”.
    reason: lexical_alternative
  - marker: c
    text: Mais literalmente, “recolherá você” ou “reunirá você”; no contexto, a expressão descreve a glória de Yahweh fechando e protegendo a marcha por trás.
    reason: alternative_reading
lexical_decisions:
- source_word: יִבָּקַע
  choice: irromperá
  rationale: O nifal de בקע descreve algo que se abre ou rompe com força. Com a luz como sujeito, “irromperá” conserva a imagem vívida e é natural em português.
- source_word: כַּשַּׁחַר
  choice: como a alvorada
  rationale: שַׁחַר designa a alvorada ou o romper do dia. “Como a alvorada” preserva de modo claro a comparação poética.
- source_word: אוֹרֶךָ
  choice: a sua luz
  rationale: אוֹר significa diretamente “luz”; o sufixo possessivo de segunda pessoa foi mantido.
- source_word: אֲרֻכָתְךָ
  choice: a sua cura
  rationale: אֲרֻכָה pode indicar cura, recuperação ou restauração. “Cura” mantém a metáfora de uma ferida sendo reparada sem restringir sua aplicação coletiva e espiritual.
- source_word: מְהֵרָה
  choice: depressa
  rationale: O advérbio expressa rapidez. “Depressa” é corrente, claro e adequado ao registro poético.
- source_word: תִצְמָח
  choice: brotará
  rationale: צמח significa brotar ou crescer. “Brotará” conserva a metáfora orgânica aplicada à cura.
- source_word: וְהָלַךְ לְפָנֶיךָ
  choice: irá à sua frente
  rationale: הלך + לפני indica ir ou caminhar diante de alguém. A formulação portuguesa é natural e preserva a ideia de precedência.
- source_word: צִדְקֶךָ
  choice: a sua retidão
  rationale: צֶדֶק abrange retidão, justiça e, em certos contextos, vindicação. “Retidão” preserva aqui o sentido moral e pactual amplo, enquanto “justiça” permanece como alternativa legítima em nota.
- source_word: כְּבוֹד יְהוָה
  choice: a glória de Yahweh
  rationale: כָּבוֹד é “glória”, e a relação construta foi expressa naturalmente. O nome divino foi transliterado, em vez de substituído por um título.
- source_word: יַאַסְפֶךָ
  choice: será a sua retaguarda
  rationale: אסף significa basicamente reunir ou recolher, mas neste paralelismo — a retidão à frente e a glória divina atrás — assume a função contextual de fechar e proteger a marcha pela retaguarda. A nota conserva o sentido lexical mais literal.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Amplitude semântica de צִדְקֶךָ
  choice: a sua retidão
  alternative: a sua justiça; a sua vindicação
  rationale: O contexto de Isaías 58 envolve fortemente a justiça social, mas o termo também possui alcance moral e pactual mais amplo. “Retidão” evita limitar o sentido à esfera jurídica ou social, e a nota registra “justiça” como leitura possível.
- issue: Valor contextual de יַאַסְפֶךָ
  choice: será a sua retaguarda
  alternative: recolherá você; reunirá você
  rationale: A disposição da retidão à frente e da glória de Yahweh atrás evoca proteção durante uma marcha. A tradução principal comunica essa função contextual, enquanto a nota mantém visível a imagem verbal hebraica de reunir ou recolher.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva o paralelismo poético hebraico; “alvorada”, “brotará” e “retaguarda” mantêm as imagens do original sem arcaísmo excessivo.
