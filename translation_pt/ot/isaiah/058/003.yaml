id: ISA.58.3
reference: Isaiah 58:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ֤/מָּה צַּ֨מְנוּ֙ וְ/לֹ֣א רָאִ֔יתָ עִנִּ֥ינוּ נַפְשֵׁ֖/נוּ וְ/לֹ֣א תֵדָ֑ע הֵ֣ן בְּ/י֤וֹם צֹֽמְ/כֶם֙ תִּמְצְאוּ חֵ֔פֶץ וְ/כָל עַצְּבֵי/כֶ֖ם תִּנְגֹּֽשׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/003.yaml
  text: Why have we fasted[a], and you have not seen? Why have we humbled ourselves, and you do not notice? Look, on the day of your fast you pursue your own pleasure[c][b], and you drive all your laborers hard.
translation:
  language: pt
  text: '“Por que jejuamos, e tu não viste? Por que nos humilhamos[a], e não percebes?” Vejam: no dia do seu jejum, vocês buscam o próprio interesse[b] e oprimem todos os seus trabalhadores[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “afligimos nossa alma” ou “afligimos a nós mesmos”; também pode ser entendido como “nos privamos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “encontram prazer”, “buscam o que desejam” ou, possivelmente, “cuidam dos próprios negócios”.
    reason: lexical_alternative
  - marker: c
    text: Ou “pressionam todos os seus trabalhadores”. O hebraico também pode ser entendido como uma referência a exigir todo o trabalho ou todas as tarefas.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Por que
  rationale: Introduz diretamente a queixa do povo.
- source_word: צַּמְנוּ
  choice: jejuamos
  rationale: O perfeito hebraico descreve o jejum já praticado; o pretérito perfeito é natural em português neste questionamento.
- source_word: רָאִיתָ
  choice: não viste
  rationale: Preserva o verbo concreto ראה e expressa a queixa de que Deus não deu atenção ao jejum.
- source_word: עִנִּינוּ נַפְשֵׁנוּ
  choice: nos humilhamos
  rationale: Comunica em português corrente a autonegação ritual ligada ao jejum; a expressão hebraica mais literal e suas alternativas ficam registradas em nota.
- source_word: תֵדָע
  choice: não percebeste
  rationale: Em paralelo com 'não viste', ידע indica não tomar conhecimento ou não dar atenção, e não simples falta de informação.
- source_word: הֵן
  choice: Vejam
  rationale: Marca enfaticamente a resposta divina em linguagem moderna e digna.
- source_word: בְּיוֹם צֹמְכֶם
  choice: no dia do seu jejum
  rationale: Mantém explícita a expressão temporal do hebraico.
- source_word: תִּמְצְאוּ חֵפֶץ
  choice: buscam o próprio interesse
  rationale: No contexto da repreensão, a expressão aponta para a busca do desejo, prazer ou proveito pessoal; a nota preserva a amplitude lexical.
- source_word: עַצְּבֵיכֶם
  choice: seus trabalhadores
  rationale: A leitura concreta se ajusta ao verbo de coerção e à denúncia social, sem ocultar em nota a possibilidade de referência ao trabalho ou às tarefas.
- source_word: תִּנְגֹּשׂוּ
  choice: oprimem
  rationale: Expressa diretamente a pressão coerciva de נגשׂ sobre trabalhadores, podendo incluir exigir deles trabalho pesado.
theological_decisions:
- issue: Sentido da acusação social na segunda metade do versículo
  choice: O jejum é denunciado por coexistir com interesse próprio e opressão dos trabalhadores.
  alternative: A acusação pode referir-se à busca dos próprios negócios e à exigência de todo o trabalho ou de todas as tarefas.
  rationale: A combinação de חֵפֶץ com נגשׂ favorece uma denúncia de conduta interesseira e exploração econômica, mas a ambiguidade dos substantivos hebraicos é preservada nas notas.
- issue: Mudança de voz entre a queixa e a resposta
  choice: A queixa do povo aparece entre aspas, seguida da resposta divina introduzida por 'Vejam'.
  alternative: Manter o versículo sem indicação tipográfica da mudança de voz.
  rationale: A pontuação torna inteligível o diálogo já presente no contexto, sem acrescentar identificação interpretativa ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com 'tu' na fala dirigida a Deus e 'vocês' na resposta ao povo. Evitou-se 'eis' por seu tom menos corrente; 'Vejam' conserva a força deítica de הֵן. As notas mantêm as ambiguidades relevantes sem enfraquecer a denúncia social do texto.
