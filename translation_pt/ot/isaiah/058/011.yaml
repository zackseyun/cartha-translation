source:
  edition: WLC
  text: וְ/נָחֲ/ךָ֣ יְהוָה֮ תָּמִיד֒ וְ/הִשְׂבִּ֤יעַ בְּ/צַחְצָחוֹת֙ נַפְשֶׁ֔/ךָ וְ/עַצְמֹתֶ֖י/ךָ יַחֲלִ֑יץ וְ/הָיִ֨יתָ֙ כְּ/גַ֣ן רָוֶ֔ה וּ/כְ/מוֹצָ֣א מַ֔יִם אֲשֶׁ֥ר לֹא יְכַזְּב֖וּ מֵימָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/011.yaml
  text: And Yahweh will guide you continually[a], and satisfy your soul in parched places, and strengthen your bones; and you will be like a well-watered garden[c][b], and like a spring of water whose waters do not fail.
translation:
  language: pt
  text: Yahweh o guiará continuamente e satisfará a sua alma em lugares ressequidos[a]; fortalecerá os seus ossos[b]. Você será como um jardim bem regado e como uma fonte de água cujas águas não falham[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em regiões áridas” ou “em lugares secos”. O hebraico descreve condições abrasadas e ressequidas.
    reason: lexical_alternative
  - marker: b
    text: Ou “revigorará os seus ossos”. O verbo hebraico é incomum neste contexto e pode indicar fortalecimento ou renovação do vigor.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “cujas águas não mentem”, isto é, águas que não falham nem decepcionam.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָחֲךָ
  choice: o guiará
  rationale: O verbo נחה normalmente significa conduzir ou guiar. “Guiará” comunica com naturalidade a direção contínua dada por Deus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: תָּמִיד
  choice: continuamente
  rationale: Expressa ação constante e duradoura, preservando o valor temporal do hebraico.
- source_word: וְהִשְׂבִּיעַ
  choice: satisfará
  rationale: O hifil de שבע indica suprir plenamente uma necessidade; “satisfará” combina naturalmente com “alma”.
- source_word: בְּצַחְצָחוֹת
  choice: em lugares ressequidos
  rationale: O plural descreve condições áridas, abrasadas ou ressequidas. A formulação conserva a imagem ambiental sem restringi-la a uma seca meteorológica específica.
- source_word: נַפְשֶׁךָ
  choice: a sua alma
  rationale: נפש pode indicar a pessoa, a vida, o apetite ou o ser interior. “Alma” preserva a imagem antropológica e poética sem reduzir indevidamente sua amplitude.
- source_word: וְעַצְמֹתֶיךָ יַחֲלִיץ
  choice: fortalecerá os seus ossos
  rationale: O verbo חלץ é incomum neste contexto e pode comunicar fortalecimento ou revigoramento. A escolha preserva a imagem corporal concreta e mantém a alternativa em nota.
- source_word: כְּגַן רָוֶה
  choice: como um jardim bem regado
  rationale: רוה descreve algo abundantemente regado ou saturado; “bem regado” é claro e natural em português.
- source_word: וּכְמוֹצָא מַיִם
  choice: como uma fonte de água
  rationale: מוֹצָא designa uma saída ou origem de água. “Fonte de água” transmite naturalmente a imagem de água que brota.
- source_word: אֲשֶׁר לֹא יְכַזְּבוּ מֵימָיו
  choice: cujas águas nunca faltam
  rationale: כזב significa literalmente mentir ou mostrar-se falso; aplicado às águas, descreve uma fonte que não decepciona nem deixa de fornecer água. “Nunca faltam” expressa esse sentido idiomático sem eliminar a metáfora, registrada em nota.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: “Yahweh” preserva o nome pessoal apresentado pelo texto hebraico, em vez de substituí-lo por um título.
- issue: Amplitude antropológica de נֶפֶשׁ
  choice: a sua alma
  alternative: a sua vida ou você
  rationale: A escolha conserva a linguagem poética sobre a satisfação interior, sem negar que o termo hebraico também possa abranger a pessoa inteira, a vida ou o apetite.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém o paralelismo poético, as imagens concretas de alma, ossos, jardim e fonte, e assinala em notas as ambiguidades lexicais reais.
