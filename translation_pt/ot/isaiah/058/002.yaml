source:
  edition: WLC
  text: וְ/אוֹתִ֗/י י֥וֹם יוֹם֙ יִדְרֹשׁ֔וּ/ן וְ/דַ֥עַת דְּרָכַ֖/י יֶחְפָּצ֑וּ/ן כְּ/ג֞וֹי אֲשֶׁר צְדָקָ֣ה עָשָׂ֗ה וּ/מִשְׁפַּ֤ט אֱלֹהָי/ו֙ לֹ֣א עָזָ֔ב יִשְׁאָל֨וּ/נִי֙ מִשְׁפְּטֵי צֶ֔דֶק קִרְבַ֥ת אֱלֹהִ֖ים יֶחְפָּצֽוּ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/002.yaml
  text: Yet day after day they seek me[a], and they delight to know my ways, as if they were a nation that practiced righteousness and had not forsaken the justice of its God. They ask me for righteous judgments; they delight in the nearness of God.
translation:
  language: pt
  text: Ainda assim, dia após dia eles me buscam e têm prazer em conhecer os meus caminhos, como se fossem uma nação que pratica a justiça e não abandona o direito do seu Deus. Pedem-me decisões justas; têm prazer na proximidade de Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “têm prazer em aproximar-se de Deus” ou “têm prazer na aproximação a Deus”. A expressão hebraica pode referir-se tanto à proximidade de Deus quanto ao ato de aproximar-se dele.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאוֹתִי
  choice: Ainda assim, ... me
  rationale: A conjunção introduz um contraste com a denúncia do versículo anterior; “Ainda assim” comunica naturalmente essa força adversativa, mantendo Deus como objeto da busca.
- source_word: יוֹם יוֹם
  choice: dia após dia
  rationale: A repetição hebraica tem sentido distributivo e habitual; a expressão portuguesa preserva sua ênfase.
- source_word: יִדְרֹשׁוּן
  choice: buscam
  rationale: Neste contexto, דרשׁ descreve buscar a Deus em culto ou consulta; “buscam” é claro e conserva a ressonância religiosa sem restringir o sentido.
- source_word: וְדַעַת דְּרָכַי יֶחְפָּצוּן
  choice: têm prazer em conhecer os meus caminhos
  rationale: A formulação preserva tanto o desejo expresso por חפץ quanto o elemento cognitivo de דעת, em português natural.
- source_word: כְּגוֹי אֲשֶׁר
  choice: como se fossem uma nação que
  rationale: O contexto mostra que a comparação é irônica. “Como se fossem” torna perceptível essa força sem acrescentar uma acusação que não esteja no contexto.
- source_word: צְדָקָה עָשָׂה
  choice: pratica a justiça
  rationale: A expressão idiomática “fazer justiça/retidão” indica conduta habitual; “pratica a justiça” é atual, ética e natural.
- source_word: וּמִשְׁפַּט אֱלֹהָיו לֹא עָזָב
  choice: não abandona o juízo do seu Deus
  rationale: מִשְׁפָּט pode significar juízo, justiça ou ordenança. “Juízo” conserva melhor a amplitude lexical e a ligação com מִשְׁפְּטֵי na frase seguinte.
- source_word: יִשְׁאָלוּנִי מִשְׁפְּטֵי צֶדֶק
  choice: Pedem-me decisões justas
  rationale: O verbo pode significar perguntar, consultar ou pedir, enquanto o plural מִשְׁפְּטֵי pode designar decisões judiciais. A tradução comunica a ideia com clareza e evita o português pouco natural “juízos de justiça”.
- source_word: קִרְבַת אֱלֹהִים
  choice: a proximidade de Deus
  rationale: O substantivo קִרְבָה pode indicar proximidade ou aproximação. A tradução principal mantém sua forma nominal e deixa a alternativa genuína em nota.
- source_word: יֶחְפָּצוּן
  choice: têm prazer
  rationale: חפץ abrange prazer e desejo. Repetir “têm prazer” nas duas ocorrências preserva a coesão retórica do hebraico.
theological_decisions:
- issue: Se a ironia da comparação deve ficar explícita
  choice: “como se fossem uma nação que”
  alternative: “como uma nação que”
  rationale: A denúncia ao redor revela uma religiosidade incoerente. A construção escolhida permite ao leitor moderno perceber a ironia contextual sem impor uma doutrina adicional.
- issue: Sentido de קִרְבַת אֱלֹהִים
  choice: “a proximidade de Deus” no texto principal
  alternative: “aproximar-se de Deus” ou “a aproximação a Deus”
  rationale: A construção hebraica admite tanto a proximidade divina quanto o ato humano de aproximar-se de Deus. A nota preserva essa ambiguidade teologicamente relevante.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A formulação preserva o paralelismo, a ironia profética e a repetição de “têm prazer”. O singular coletivo “nação” rege “pratica” e “não abandona”.
