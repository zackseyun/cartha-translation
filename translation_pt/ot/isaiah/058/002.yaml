    rationale: Embora possível, a expressão é relativamente pouco idiomática neste contexto e pode ser entendida como uma sentença ou punição divina. O hebraico מִשְׁפָּט abrange o direito/ordem normativa de Deus; «o direito do seu Deus» é mais natural e conserva essa abrangência.
