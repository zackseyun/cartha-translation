revisions:
- from: Ainda assim, dia após dia eles me buscam e têm prazer em conhecer os meus caminhos, como se fossem uma nação que pratica a justiça e não abandona o juízo do seu Deus. Pedem-me decisões justas; têm prazer na proximidade de Deus.[a]
  to: Ainda assim, dia após dia eles me buscam e têm prazer em conhecer os meus caminhos, como se fossem uma nação que pratica a justiça e não abandona o direito do seu Deus. Pedem-me decisões justas; têm prazer na proximidade de Deus.[a]
  rationale: A revisão limita-se a «direito» para מִשְׁפָּט na primeira ocorrência. Isso melhora a naturalidade e evita uma leitura excessivamente restrita de «juízo», sem eliminar a relação lexical e conceitual com as «decisões justas» solicitadas na frase seguinte. A nota continua preservando a ambiguidade genuína de קִרְבַת אֱלֹהִים.
