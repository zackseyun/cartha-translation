  text: הֲ/ל֨וֹא פָרֹ֤ס לָֽ/רָעֵב֙ לַחְמֶ֔/ךָ וַ/עֲנִיִּ֥ים מְרוּדִ֖ים תָּ֣בִיא בָ֑יִת כִּֽי תִרְאֶ֤ה עָרֹם֙ וְ/כִסִּית֔/וֹ וּ/מִ/בְּשָׂרְ/ךָ֖ לֹ֥א תִתְעַלָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/007.yaml
  text: Is it not to share your bread with the hungry[a], and bring the poor who are cast out into your house? When you see the naked, to cover him[b], and not hide yourself from your own flesh?
translation:
  language: pt
  text: Não é repartir o seu pão com quem tem fome, acolher em sua casa os pobres sem abrigo[a], cobrir quem você vir nu e não se esconder de sua própria carne[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os pobres expulsos” ou “os pobres errantes”. O termo hebraico é raro e provavelmente se refere a pessoas pobres que foram desalojadas ou ficaram sem abrigo.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica “sua própria carne” pode referir-se aos próprios parentes ou à família e, por extensão, àqueles unidos a você pela humanidade comum.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָרֹס לָרָעֵב לַחְמֶךָ
  choice: repartir o seu pão com quem tem fome
  rationale: “Repartir” conserva a ideia concreta de dividir o pão e, com “com”, expressa naturalmente em português o ato de partilhá-lo com a pessoa faminta.
- source_word: וַעֲנִיִּים מְרוּדִים
  choice: os pobres sem abrigo
  rationale: עֲנִיִּים designa pobres ou necessitados; מְרוּדִים é raro e pode sugerir pessoas expulsas, errantes ou privadas de moradia. “Sem abrigo” comunica a provável condição no contexto do convite para entrar em casa, sem impor uma categoria social moderna específica.
- source_word: תָּבִיא בָיִת
  choice: acolher em sua casa
  rationale: A formulação hebraica significa literalmente fazer entrar em casa. “Acolher em sua casa” explicita de modo natural a hospitalidade requerida.
- source_word: כִּי תִרְאֶה עָרֹם וְכִסִּיתוֹ
  choice: cobrir quem você vir nu
  rationale: Mantém o verbo concreto “cobrir” e reproduz a circunstância expressa por כִּי sem tornar a situação meramente hipotética.
- source_word: וּמִבְּשָׂרְךָ לֹא תִתְעַלָּם
  choice: não se esconder de sua própria carne
  rationale: Preserva tanto a imagem hebraica de “carne” quanto o sentido reflexivo e vívido de ocultar-se ou esquivar-se de alguém ligado a si.
theological_decisions:
- issue: Alcance de “sua própria carne”
  choice: Manter a expressão hebraica aberta
  alternative: “seus parentes”, “sua própria família” ou “seu semelhante”
  rationale: A imagem pode indicar parentesco, mas também admite uma ressonância ética mais ampla de humanidade compartilhada. Traduzir literalmente evita limitar o alcance do chamado profético.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas naturais para leitores brasileiros. A pergunta retórica foi mantida como uma única sequência de ações, e as metáforas concretas “pão”, “cobrir” e “própria carne” foram preservadas.
