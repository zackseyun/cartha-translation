source:
  edition: WLC
  text: כִּ֣י בִ֠/רְאֹת/וֹ יְלָדָ֞י/ו מַעֲשֵׂ֥ה יָדַ֛/י בְּ/קִרְבּ֖/וֹ יַקְדִּ֣ישֽׁוּ שְׁמִ֑/י וְ/הִקְדִּ֨ישׁוּ֙ אֶת קְד֣וֹשׁ יַֽעֲקֹ֔ב וְ/אֶת אֱלֹהֵ֥י יִשְׂרָאֵ֖ל יַעֲרִֽיצוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/023.yaml
  text: For when he sees his children[a], the work of my hands, in his midst, they will sanctify my name; they will sanctify the Holy One of Jacob[b], and they will stand in awe of the God of Israel.
translation:
  language: pt
  text: Pois, quando ele vir seus filhos[a], obra das minhas mãos, em seu meio, eles santificarão o meu nome; santificarão o Santo de Jacó e temerão[b] o Deus de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando Abraão vir seus filhos, obra das minhas mãos, em seu meio”. Os pronomes no singular podem retomar os patriarcas mencionados no versículo anterior, especialmente Abraão ou Jacó.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “reverenciarão” ou “ficarão em assombro diante de”. O verbo hebraico inclui a ideia de temor reverente ou assombro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי בִרְאֹתוֹ
  choice: Pois, quando ele vir
  rationale: כִּי introduz a explicação da promessa anterior, enquanto ב com o infinitivo construto tem valor temporal. A formulação conserva ambas as relações de modo natural em português.
- source_word: יְלָדָיו
  choice: seus filhos
  rationale: O termo pode abranger os descendentes coletivamente; «filhos» é natural no contexto genealógico e mantém o vínculo com o referente singular.
- source_word: מַעֲשֵׂה יָדַי
  choice: obra das minhas mãos
  rationale: Preserva a imagem concreta hebraica da ação formadora de Deus.
- source_word: בְּקִרְבּוֹ
  choice: no meio dele
  rationale: Mantém deliberadamente o sufixo masculino singular e, assim, a ambiguidade entre o patriarca e Jacó/Israel personificado.
- source_word: יַקְדִּישׁוּ שְׁמִי
  choice: eles santificarão o meu nome
  rationale: O hifil de קדש significa reconhecer ou tratar como santo. «Santificarão» conserva a terminologia teológica e a repetição retórica.
- source_word: וְהִקְדִּישׁוּ אֶת קְדוֹשׁ יַעֲקֹב
  choice: santificarão o Santo de Jacó
  rationale: Repete «santificarão» como no hebraico e preserva literalmente o título divino característico de Isaías.
- source_word: יַעֲרִיצוּ
  choice: ficarão admirados diante de
  rationale: O verbo exprime temor reverente ou assombro diante de Deus. A formulação comunica reverência intensa sem reduzi-la a simples terror; a nota registra alternativas mais literais.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta e corrente do título divino.
theological_decisions:
- issue: Referente dos pronomes singulares («ele vir... no meio dele»)
  choice: Manter o referente singular sem identificá-lo explicitamente, permitindo a leitura de Jacó/Israel personificado.
  alternative: Entender especificamente Abraão, ou Jacó como patriarca, vendo seus descendentes.
  rationale: O contexto anterior menciona Jacó e Abraão. O hebraico não explicita aqui o antecedente, por isso a tradução preserva a tensão e a nota apresenta as principais possibilidades.
- issue: Repetição da linguagem de santificação
  choice: Usar «santificarão» nas duas ocorrências de קדש.
  alternative: Traduzir por «reconhecerão como santo» ou «honrarão como santo».
  rationale: A repetição é retoricamente importante e ressalta que o nome de Deus e o próprio Santo de Jacó são reconhecidos como santos.
- issue: Força reverencial de יעריצו
  choice: Traduzir no texto como «ficarão admirados diante de» e explicar na nota o componente de temor reverente.
  alternative: «temerão» ou «reverenciarão».
  rationale: A escolha busca linguagem corrente sem eliminar o sentido de assombro e temor que pertence ao verbo hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe preserva os singulares ambíguos do hebraico e a repetição de «santificarão». Todos os marcadores de nota aparecem no texto.
