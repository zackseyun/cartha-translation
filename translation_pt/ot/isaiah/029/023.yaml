revisions:
- from: Pois, quando ele vir seus filhos[a], obra das minhas mãos, no meio dele, eles santificarão o meu nome; santificarão o Santo de Jacó e ficarão admirados diante do Deus de Israel.[b]
  to: Pois, quando ele vir seus filhos[a], obra das minhas mãos, em seu meio, eles santificarão o meu nome; santificarão o Santo de Jacó e temerão[b] o Deus de Israel.
  rationale: A revisão substitui uma expressão que comunica apenas admiração por «temerão», correspondente mais fiel ao sentido de temor reverente do verbo hebraico. Também ajusta «no meio dele» para a formulação portuguesa natural «em seu meio», sem identificar o antecedente singular disputado. O marcador da nota lexical foi deslocado para a palavra que ela esclarece.
