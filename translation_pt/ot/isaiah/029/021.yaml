  yaml_path: translation/ot/isaiah/029/021.yaml
  text: those who make a man an offender by a word[a], and lay a snare for the one who reproves in the gate[c][b], and turn aside the righteous with emptiness.
translation:
  language: pt
  text: os que declaram alguém culpado por uma palavra[a], armam uma cilada para quem repreende no portão[b] e desviam o justo com o que é vazio[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “levam alguém a pecar por uma palavra” ou “condenam alguém por causa de uma palavra”. O hebraico admite tanto uma nuance causativa quanto uma judicial, embora o contexto jurídico favoreça esta última.
    reason: lexical_alternative
  - marker: b
    text: O “portão” da cidade era o lugar onde se realizavam julgamentos e outros atos públicos.
    reason: cultural_note
  - marker: c
    text: Ou “desviam o justo por nada”. A expressão hebraica também pode se referir a desviar ou negar justiça ao justo por meio de alegações sem fundamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲטִיאֵי
  choice: declaram ... culpado
  rationale: O particípio hifil de חטא pode indicar tanto levar alguém a pecar quanto fazê-lo passar por culpado. O cenário judicial favorece aqui o sentido de imputar culpa, sem eliminar a alternativa na nota.
- source_word: אָדָם
  choice: alguém
  rationale: O substantivo singular tem referência humana genérica e individual. “Alguém” comunica isso de modo natural em português, sem transformar o termo no coletivo “humanidade”.
- source_word: בְּדָבָר
  choice: por uma palavra
  rationale: דבר pode significar palavra, declaração, assunto ou causa. A formulação concisa preserva a possibilidade de uma palavra, acusação ou questão ser usada como fundamento da culpa.
- source_word: לַמּוֹכִיחַ
  choice: para quem repreende
  rationale: O particípio de יכח pode descrever quem repreende, contesta ou defende uma causa. “Quem repreende” mantém a amplitude moral e admite a dimensão forense indicada pelo portão.
- source_word: בַּשַּׁעַר
  choice: junto ao portão
  rationale: O portão da cidade era local de julgamento e de outros atos públicos. “Junto ao portão” conserva a imagem cultural hebraica em português natural.
- source_word: יְקֹשׁוּן
  choice: armam uma cilada
  rationale: O verbo יקשׁ apresenta a imagem de preparar uma armadilha para capturar alguém; “armam uma cilada” é idiomático e mantém a intenção maliciosa.
- source_word: וַיַּטּוּ
  choice: negam justiça
  rationale: נטה, em contexto jurídico, pode significar desviar ou perverter o julgamento ou a causa de alguém. Como o objeto expresso é “o justo”, a formulação explicita o resultado jurídico sem apagar a imagem alternativa, registrada em nota.
- source_word: בַתֹּהוּ
  choice: com argumentos vazios
  rationale: תֹהוּ denota vazio, inutilidade ou irrealidade. No contexto judicial, a expressão aponta para fundamentos sem substância; “argumentos” é uma explicitação contextual, e a tradução mais formal consta da nota.
- source_word: צַדִּיק
  choice: ao justo
  rationale: צדיק pode designar quem é justo ou inocente/vindicado em juízo. “O justo” conserva juntas as dimensões ética e judicial.
