  text: וַ/תְּהִ֨י לָ/כֶ֜ם חָז֣וּת הַ/כֹּ֗ל כְּ/דִבְרֵי֮ הַ/סֵּ֣פֶר הֶֽ/חָתוּם֒ אֲשֶֽׁר יִתְּנ֣וּ אֹת֗/וֹ אֶל יוֹדֵ֥עַ ה/ספר לֵ/אמֹ֖ר קְרָ֣א נָא זֶ֑ה וְ/אָמַר֙ לֹ֣א אוּכַ֔ל כִּ֥י חָת֖וּם הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/011.yaml
  text: And the vision of all this has become to you like the words of a sealed scroll[a], which they give to one who knows writing, saying, “Please read this,” and he says, “I cannot, because it is sealed.”
translation:
  language: pt
  text: 'E a visão de tudo isso tornou-se para vocês como as palavras de um rolo selado, que entregam a alguém que sabe ler[a], dizendo: “Por favor, leia isto.” Ele responde: “Não posso, porque está selado.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “alguém que conhece o rolo [ou livro]”.
    reason: Registra a formulação literal da expressão hebraica por trás do sentido idiomático “alguém que sabe ler”.
lexical_decisions:
- source_word: חָזוּת הַכֹּל
  choice: a visão de tudo isso
  rationale: “Visão” preserva o sentido profético de חָזוּת, e “tudo isso” retoma naturalmente a totalidade da mensagem anterior indicada por הַכֹּל.
- source_word: כְּדִבְרֵי הַסֵּפֶר הֶחָתוּם
  choice: como as palavras de um rolo selado
  rationale: Mantém a comparação e a imagem concreta do documento inacessível. “Rolo” é historicamente mais adequado ao contexto do que o moderno “livro”.
- source_word: יוֹדֵעַ הַסֵּפֶר
  choice: alguém que sabe ler
  rationale: A expressão hebraica significa literalmente alguém que “conhece o rolo/livro”, mas, neste contexto, designa uma pessoa alfabetizada. “Sabe ler” comunica o sentido com clareza, enquanto a forma literal é preservada em nota.
- source_word: קְרָא נָא זֶה
  choice: Por favor, leia isto
  rationale: O imperativo com נָא expressa um pedido cortês; esta formulação é natural em português moderno.
- source_word: לֹא אוּכַל
  choice: Não posso
  rationale: Reproduz diretamente a afirmação hebraica sem acrescentar “lê-lo”, que está apenas implícito.
- source_word: וַתְּהִי לָכֶם
  choice: se tornou para vocês
  rationale: Expressa o estado resultante dirigido aos ouvintes e mantém a proximidade com a construção hebraica.
theological_decisions:
- issue: Metáfora da revelação inacessível
  choice: Manter a imagem do rolo selado sem explicação interpretativa
  alternative: Parafrasear a visão como incompreensível ou declarar diretamente que o povo não consegue entender a palavra de Deus
  rationale: O próprio texto comunica sua força teológica por meio da comparação. Preservar a metáfora evita resolver ou ampliar implicitamente o sentido.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A divisão em duas frases evita uma construção relativa pesada sem alterar a progressão da imagem.
