source:
  edition: WLC
  text: וְ/הָיָ֡ה כַּ/אֲשֶׁר֩ יַחֲלֹ֨ם הָ/רָעֵ֜ב וְ/הִנֵּ֣ה אוֹכֵ֗ל וְ/הֵקִיץ֮ וְ/רֵיקָ֣ה נַפְשׁ/וֹ֒ וְ/כַ/אֲשֶׁ֨ר יַחֲלֹ֤ם הַ/צָּמֵא֙ וְ/הִנֵּ֣ה שֹׁתֶ֔ה וְ/הֵקִיץ֙ וְ/הִנֵּ֣ה עָיֵ֔ף וְ/נַפְשׁ֖/וֹ שׁוֹקֵקָ֑ה כֵּ֣ן יִֽהְיֶ֗ה הֲמוֹן֙ כָּל הַ/גּוֹיִ֔ם הַ/צֹּבְאִ֖ים עַל הַ֥ר צִיּֽוֹן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/008.yaml
  text: And it will be as when a hungry man dreams[a], and behold, he is eating, but he wakes and his appetite is empty; and as when a thirsty man dreams, and behold, he is drinking, but he wakes, and behold, he is faint and his appetite craves[b]. So will be the multitude of all the nations that wage war against Mount Zion.
translation:
  language: pt
  text: 'Será como quando um homem faminto sonha: eis que está comendo; mas acorda com o apetite vazio. Ou como quando um homem sedento sonha: eis que está bebendo; mas acorda e eis que está fraco, e seu apetite anseia. Assim será a multidão de todas as nações que guerreiam contra o monte Sião.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  choice: Será
  rationale: Introduz o resultado futuro da comparação profética de modo natural e conciso em português.
- source_word: כַּאֲשֶׁר
  choice: como quando
  rationale: Preserva a estrutura comparativa e proverbial repetida nas duas cenas.
- source_word: יַחֲלֹם
  choice: sonha
  rationale: O presente generalizante comunica naturalmente a cena representativa expressa pelo imperfeito hebraico.
- source_word: הָרָעֵב / הַצָּמֵא
  choice: um homem faminto / um homem sedento
  rationale: Os adjetivos substantivados estão no masculino singular e descrevem figuras humanas representativas.
- source_word: וְהִנֵּה אוֹכֵל / וְהִנֵּה שֹׁתֶה
  choice: que está comendo / que está bebendo
  rationale: A construção portuguesa integra com naturalidade o הִנֵּה e conserva o aspecto vívido e progressivo dos particípios, sem recorrer ao pouco idiomático 'eis que' dentro do sonho.
- source_word: וְהֵקִיץ
  choice: mas acorda
  rationale: A adversativa explicita a reversão contextual entre a satisfação sonhada e a carência constatada ao despertar.
- source_word: וְרֵיקָה נַפְשׁוֹ
  choice: continua de estômago vazio
  rationale: Expressa idiomaticamente a fome não saciada. 'Continua' torna clara a persistência indicada pelo contraste, sem transformar נֶפֶשׁ em termo antropológico técnico.
- source_word: עָיֵף
  choice: exausto
  rationale: Comunica a debilidade física causada pela sede em português corrente e digno.
- source_word: וְנַפְשׁוֹ שׁוֹקֵקָה
  choice: ainda ardendo de sede
  rationale: Reproduz a intensa carência ou ânsia corporal que permanece após o sonho; a formulação é idiomática no contexto de sede.
- source_word: הֲמוֹן כָּל הַגּוֹיִם
  choice: a multidão de todas as nações
  rationale: Mantém tanto o sentido coletivo de הֲמוֹן quanto a abrangência de כָּל.
- source_word: הַצֹּבְאִים עַל
  choice: que guerreiam contra
  rationale: O particípio deriva da linguagem de hostes e, com עַל, descreve as nações que fazem guerra contra Sião.
theological_decisions:
- issue: Sentido de נֶפֶשׁ nas imagens de fome e sede
  choice: de estômago vazio / ardendo de sede
  alternative: sua alma está vazia / sua alma anseia
  rationale: Neste contexto, נֶפֶשׁ designa a pessoa viva como sede da necessidade e do desejo corporal, não necessariamente uma entidade imaterial. A tradução concreta evita impor uma antropologia posterior, enquanto as notas preservam a forma mais literal.
- issue: Masculino singular representativo
  choice: um homem faminto / um homem sedento
  alternative: uma pessoa faminta / uma pessoa sedenta
  rationale: Conserva o masculino singular gramatical das figuras representativas sem fazer delas uma afirmação teológica limitada aos homens.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição hebraica foi preservada em estrutura paralela, mas הִנֵּה foi incorporado às orações com “que está” para evitar um “eis que” pouco natural. As notas registram a ambiguidade de נֶפֶשׁ.
