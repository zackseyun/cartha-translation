revisions:
- from: Será como quando um homem faminto sonha[a] que está comendo, mas acorda e continua de estômago vazio; ou como quando um homem sedento sonha que está bebendo, mas acorda exausto, ainda ardendo de sede[b]. Assim será a multidão de todas as nações que guerreiam contra o monte Sião.
  to: 'Será como quando um homem faminto sonha: eis que está comendo; mas acorda com o apetite vazio. Ou como quando um homem sedento sonha: eis que está bebendo; mas acorda e eis que está fraco, e seu apetite anseia. Assim será a multidão de todas as nações que guerreiam contra o monte Sião.'
  rationale: A revisão conserva a estrutura paralela, recupera o efeito de “eis que” e torna a tradução de נֶפֶשׁ coerente nos dois membros. Ela evita especificações corporais e intensificações não exigidas pelo hebraico, sem impor uma leitura teológica de “alma”.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:30:27Z'
review_pass:
  verdict: revise
  source_fidelity: A comparação e o desfecho contra as nações que atacam o monte Sião são bem preservados. Contudo, “continua de estômago vazio” especifica demais נַפְשׁוֹ (“seu apetite/seu ser”) como estômago e introduz “continua” onde o hebraico diz literalmente que sua נפש está vazia. “Exausto” pode ser mais intenso que עָיֵף (“fraco, debilitado”), e “ainda” é uma explicitação interpretativa dispensável.
  naturalness: O português é claro e fluente. A revisão mantém a legibilidade, mas usa “apetite” como referente natural e suficientemente amplo para נֶפֶשׁ no contexto de fome e sede. “Eis que” preserva o efeito vívido de וְהִנֵּה sem soar excessivamente arcaico neste registro bíblico.
  terminology: “Monte Sião” e “nações” são adequados. Para נֶפֶשׁ, “apetite” evita tanto uma leitura técnica de “alma” quanto a restrição anatômica de “estômago”. A nota mantém “alma” como alternativa formal, esclarecendo o sentido contextual.
  issues:
  - severity: medium
    issue: “de estômago vazio” restringe indevidamente נַפְשׁוֹ.
    rationale: נֶפֶשׁ pode referir-se à pessoa vivente, ao desejo ou ao apetite; “estômago” introduz uma parte corporal que o hebraico não especifica.
  - severity: low
    issue: “continua” e “ainda” tornam explícita uma continuidade apenas inferida da cena.
    rationale: A persistência da carência é clara pelo contraste entre sonho e despertar e pelo verbo “anseia”, mas não precisa ser adicionada em ambos os membros.
  - severity: low
    issue: “exausto” intensifica עָיֵף.
    rationale: No contexto, o termo descreve alguém fraco ou debilitado pela sede; “fraco” conserva melhor a amplitude do hebraico.
  revised_text: 'Será como quando um homem faminto sonha: eis que está comendo; mas acorda com o apetite vazio. Ou como quando um homem sedento sonha: eis que está bebendo; mas acorda e eis que está fraco, e seu apetite anseia. Assim será a multidão de todas as nações que guerreiam contra o monte Sião.'
  revised_footnotes:
  - marker: a
    text: Ou “sua alma está vazia”. O hebraico nefesh, muitas vezes traduzido por “alma”, neste contexto pode referir-se ao apetite ou desejo da pessoa.
    reason: lexical_alternative
  - marker: b
    text: Ou “sua alma anseia” ou “sua garganta está sedenta”. A expressão descreve o desejo intenso que permanece depois de acordar.
    reason: lexical_alternative
  revision_rationale: A revisão conserva a estrutura paralela, recupera o efeito de “eis que” e torna a tradução de נֶפֶשׁ coerente nos dois membros. Ela evita especificações corporais e intensificações não exigidas pelo hebraico, sem impor uma leitura teológica de “alma”.
