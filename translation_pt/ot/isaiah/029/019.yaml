  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/יָסְפ֧וּ עֲנָוִ֛ים בַּֽ/יהוָ֖ה שִׂמְחָ֑ה וְ/אֶבְיוֹנֵ֣י אָדָ֔ם בִּ/קְד֥וֹשׁ יִשְׂרָאֵ֖ל יָגִֽילוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/019.yaml
  text: The humble will again increase their joy in Yahweh[b][a], and the poor among mankind will rejoice in the Holy One of Israel.
translation:
  language: pt
  text: Os humildes terão ainda mais alegria em Yahweh, e os pobres entre os seres humanos se alegrarão no Santo de Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָסְפוּ ... שִׂמְחָה
  choice: voltarão a aumentar sua alegria
  rationale: Preserva o sentido básico de יסף, “acrescentar/aumentar”, bem como שִׂמְחָה como substantivo distinto; “voltarão a” expressa naturalmente a ideia de renovação.
- source_word: עֲנָוִים
  choice: os humildes
  rationale: O termo pode designar humildes, mansos ou socialmente oprimidos. “Os humildes” mantém a dimensão moral e espiritual sem excluir a condição de inferioridade social.
- source_word: בַּיהוָה
  choice: em Yahweh
  rationale: A preposição marca aquele em quem se encontra a alegria, e o nome divino é transliterado como Yahweh.
- source_word: וְאֶבְיוֹנֵי אָדָם
  choice: os pobres entre os seres humanos
  rationale: אֶבְיוֹן indica o pobre ou necessitado, enquanto אָדָם tem aqui sentido humano genérico. A formulação evita uma leitura exclusivamente masculina e comunica a relação do construto hebraico.
- source_word: בִּקְדוֹשׁ יִשְׂרָאֵל
  choice: no Santo de Israel
  rationale: Mantém o título divino característico de Isaías e entende ב como indicação da pessoa em quem se fundamenta a alegria.
- source_word: יָגִילוּ
  choice: se alegrarão
  rationale: גיל descreve alegria intensa ou exultação; “se alegrarão” é claro, digno e natural em português.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Sentido genérico de אָדָם
  choice: seres humanos
  alternative: homem; humanidade
  rationale: Neste contexto, אָדָם se refere à humanidade em geral, não apenas a indivíduos do sexo masculino.
- issue: Relação expressa por ב com a alegria
  choice: em Yahweh / no Santo de Israel
  alternative: por causa de Yahweh / por causa do Santo de Israel
  rationale: A leitura locativa ou objetiva preserva o paralelismo e a formulação teológica do hebraico, sem reduzir a preposição a uma causalidade explícita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura poética paralela foi preservada; a formulação mantém o substantivo “alegria” e distingue os dois verbos hebraicos sem recorrer a vocabulário excessivamente erudito.
