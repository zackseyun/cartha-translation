  - severity: low
    issue: “Em seu íntimo” interpreta רוּחַ de modo mais específico do que o necessário.
    rationale: Embora a leitura antropológica seja provável, “em espírito” reproduz melhor a expressão hebraica e preserva sua amplitude, sem sugerir necessariamente uma referência ao Espírito Santo.
  revised_text: E os que erram em espírito chegarão ao entendimento, e os que murmuram aprenderão a instrução.
