base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/024.yaml
  text: And those who go astray in spirit will come to understanding[b][a], and those who grumble will learn instruction.
translation:
  language: pt
  text: E os que erram em espírito chegarão ao entendimento, e os que murmuram aprenderão a instrução.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: chegarão ao
  rationale: Embora ידע signifique literalmente “conhecer”, com בִּינָה expressa aqui a ideia de alcançar ou adquirir entendimento; “chegarão ao entendimento” preserva o sentido resultativo e soa natural em português.
- source_word: תֹעֵי רוּחַ
  choice: os que se desviam em seu íntimo
  rationale: תעה indica desviar-se, vaguear ou errar, enquanto רוּחַ provavelmente se refere à disposição ou dimensão interior da pessoa. A formulação mantém a imagem do desvio sem identificar o termo especificamente com o Espírito Santo.
- source_word: בִּינָה
  choice: entendimento
  rationale: בִּינָה denota entendimento, discernimento ou compreensão; “entendimento” é claro, amplo e adequado ao paralelismo sapiencial.
- source_word: וְרוֹגְנִים
  choice: os que murmuram
  rationale: O particípio de רגן descreve pessoas que resmungam, murmuram ou se queixam. “Os que murmuram” preserva a postura de resistência e mantém um registro digno e acessível.
- source_word: יִלְמְדוּ
  choice: aprenderão
  rationale: Tradução direta do imperfeito de למד, com valor futuro no contexto da restauração anunciada.
- source_word: לֶקַח
  choice: instrução
  rationale: לֶקַח pode indicar instrução, ensino ou lição recebida. “Instrução” se ajusta ao contexto sapiencial; “ensino” é registrado como alternativa possível.
theological_decisions:
- issue: Sentido de רוּחַ em תֹעֵי רוּחַ
  choice: a dimensão ou disposição interior humana (“em seu íntimo”)
  alternative: “no espírito”, possivelmente entendido de modo mais literal ou associado ao Espírito
  rationale: O contexto aponta para a restauração moral e intelectual de pessoas antes confusas ou resistentes. “Em seu íntimo” conserva a referência antropológica provável sem introduzir uma afirmação pneumatológica mais específica do que o hebraico exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Em seu íntimo” comunica o valor antropológico de רוּחַ de modo mais natural que o literal “em espírito”; a nota preserva a amplitude de לֶקַח.
