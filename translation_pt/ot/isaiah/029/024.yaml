- from: E os que se desviam em seu íntimo chegarão ao entendimento, e os que murmuram aprenderão a instrução.[a]
  to: E os que erram em espírito chegarão ao entendimento, e os que murmuram aprenderão a instrução.
  rationale: A revisão substitui a paráfrase interpretativa de רוּחַ por “em espírito”, preservando a expressão e sua ambiguidade controlada no texto-alvo. Remove-se a nota porque sua suposta alternativa muda indevidamente “aprenderão” para “acolherão”; “instrução” é uma tradução adequada de לֶקַח sem necessidade de nota.
