base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/004.yaml
  text: Then you will be brought low; from the earth you will speak[a], and from the dust your speech will be low. Your voice will be like that of a medium from the earth, and from the dust your speech will chirp.
translation:
  language: pt
  text: Então você será rebaixada; falará da terra, e do pó sua fala será baixa. Sua voz, vinda da terra, será como a de um médium[a]; do pó sua fala piará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como a de um espírito” ou “como a de um necromante”. O hebraico אוֹב pode designar um médium, um espírito associado à consulta dos mortos ou, por extensão, a voz ligada à necromancia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפַלְתְּ
  choice: Então você será rebaixada
  rationale: O verbo שׁפל expressa ser posta em condição baixa ou humilhante. A forma feminina singular acompanha a cidade personificada, e “rebaixada” preserva tanto o juízo quanto a imagem espacial.
- source_word: מֵאֶרֶץ תְּדַבֵּרִי
  choice: falará de dentro da terra
  rationale: אֶרֶץ pode significar terra ou chão. “De dentro da terra” torna clara a imagem de uma voz subterrânea e prepara a comparação posterior com אוֹב.
- source_word: וּמֵעָפָר תִּשַּׁח אִמְרָתֵךְ
  choice: e do pó sua fala sairá abafada
  rationale: עָפָר é “pó”. O difícil תִּשַּׁח comunica rebaixamento ou debilidade da fala; “sairá abafada” conserva o vínculo com a posição baixa e produz português natural sem reduzir a expressão simplesmente a um sussurro.
- source_word: כְּאוֹב
  choice: como a de um médium
  rationale: אוֹב pode designar o médium ligado à consulta dos mortos e, por extensão, a entidade ou voz evocada. “Médium” preserva a referência lexical à necromancia sem afirmar que a própria cidade se torna um espírito.
- source_word: קוֹלֵךְ
  choice: Sua voz
  rationale: קוֹל significa voz ou som; “voz” é preciso no contexto da fala personificada.
- source_word: תְּצַפְצֵף
  choice: piará
  rationale: O verbo descreve um som agudo e débil, como o piar de uma ave. “Piará” mantém a imagem vívida e estranha do hebraico.
theological_decisions:
- issue: Sentido de אוֹב em contexto de necromancia proibida
  choice: médium
  alternative: espírito dos mortos; necromante
  rationale: O texto emprega uma comparação para caracterizar a voz fraca e subterrânea da cidade, sem aprovar a prática nem identificar literalmente a cidade com um morto. A nota preserva a amplitude semântica.
translation_notes:
  register: Português contemporâneo, digno e poético, com concordância feminina para a cidade personificada. Mantêm-se o paralelismo entre terra e pó e a estranheza da imagem necromântica.
