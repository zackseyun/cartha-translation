  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֶל בֵּ֣ית יַֽעֲקֹ֔ב אֲשֶׁ֥ר פָּדָ֖ה אֶת אַבְרָהָ֑ם לֹֽא עַתָּ֤ה יֵבוֹשׁ֙ יַֽעֲקֹ֔ב וְ/לֹ֥א עַתָּ֖ה פָּנָ֥י/ו יֶחֱוָֽרוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/022.yaml
  text: 'Therefore thus says Yahweh to the house of Jacob[a], he who redeemed Abraham: Jacob will no longer be ashamed[b], and his face will no longer grow pale.'
translation:
  language: pt
  text: 'Portanto, assim diz Yahweh à casa de Jacó — ele, que resgatou Abraão: “Jacó já não se envergonhará[a], e seu rosto já não empalidecerá[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “já não ficará envergonhado”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “já não ficará pálido”. O verbo hebraico descreve literalmente o ato de tornar-se pálido ou esbranquiçado, imagem de vergonha ou consternação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Expressa a relação inferencial com o contexto anterior e conserva a força lógica do conectivo hebraico.
- source_word: כֹּה אָמַר
  choice: assim diz
  rationale: Mantém a fórmula profética tradicional de mensageiro em linguagem clara e digna.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל בֵּית יַעֲקֹב
  choice: à casa de Jacó
  rationale: Preserva o sentido coletivo e pactual de “casa”, referente aos descendentes de Jacó.
- source_word: אֲשֶׁר פָּדָה אֶת אַבְרָהָם
  choice: aquele que resgatou Abraão
  rationale: “Resgatou” comunica a ação libertadora de פדה e preserva sua ressonância teológica sem restringi-la a um resgate monetário.
- source_word: לֹא עַתָּה
  choice: já não
  rationale: No contexto, a expressão repetida anuncia a cessação da vergonha e do abatimento; “já não” transmite essa inversão de modo natural em português.
- source_word: יֵבוֹשׁ
  choice: será envergonhado
  rationale: Abrange a ideia de sofrer vergonha ou desonra e deixa aberta a possibilidade de vergonha imposta externamente.
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: Conserva o nome próprio singular usado corporativamente para o povo.
- source_word: פָּנָיו
  choice: seu rosto
  rationale: Mantém a imagem corporal concreta do hebraico em português corrente.
- source_word: יֶחֱוָרוּ
  choice: empalidecerá
  rationale: Reproduz de modo idiomático a imagem de o rosto tornar-se pálido por vergonha, temor ou consternação.
theological_decisions:
- issue: Referente da oração “aquele que resgatou Abraão”
  choice: A oração descreve Yahweh.
  alternative: A oração pode ser ligada, de forma mais distante, à “casa de Jacó”.
  rationale: 'A sintaxe e o fluxo do enunciado favorecem Yahweh como antecedente: a ação redentora passada fundamenta a promessa dirigida a Jacó. A ordem da frase em português torna essa leitura natural, sem acrescentar conteúdo doutrinário.'
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A fórmula profética e a expressão coletiva “casa de Jacó” foram preservadas; “já não” evita o pouco natural “não agora” e comunica a reversão prometida. Os marcadores de nota aparecem junto aos termos a que se referem.
