  text: ה֚וֹי אֲרִיאֵ֣ל אֲרִיאֵ֔ל קִרְיַ֖ת חָנָ֣ה דָוִ֑ד סְפ֥וּ שָׁנָ֛ה עַל שָׁנָ֖ה חַגִּ֥ים יִנְקֹֽפוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/001.yaml
  text: Ah[a], Ariel, Ariel, the city where David encamped! Add year to year; let the feasts run their round.
translation:
  language: pt
  text: Ah[a], Ariel, Ariel, cidade onde Davi acampou! Acrescentem ano a ano; que as festas completem seu ciclo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, Ariel é um nome de Jerusalém; o hebraico também pode evocar “lareira do altar” ou “leão de Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Ah
  rationale: A interjeição pode introduzir lamento, ameaça ou chamado enfático. “Ah” conserva a força exclamativa sem restringir prematuramente o tom a uma declaração de condenação.
- source_word: אֲרִיאֵל
  choice: Ariel
  rationale: Aqui funciona como designação de Jerusalém, esclarecida pela expressão seguinte. A transliteração preserva o nome e seu possível jogo de palavras.
- source_word: קִרְיַת חָנָה דָוִד
  choice: cidade onde Davi acampou
  rationale: A construção identifica Ariel como a cidade em que Davi acampou; a formulação é natural em português e mantém a nuance histórica e militar de חנה.
- source_word: סְפוּ שָׁנָה עַל שָׁנָה
  choice: Acrescentem ano a ano
  rationale: Mantém o imperativo plural e a expressão iterativa concisa do hebraico, indicando a sucessão continuada dos anos.
- source_word: חַגִּים
  choice: as festas
  rationale: Designa as celebrações religiosas recorrentes de Israel. “Festas” é claro, tradicional e acessível, sem especificar além do texto.
- source_word: יִנְקֹפוּ
  choice: completem seu ciclo
  rationale: Expressa o movimento circular ou a conclusão de um circuito, aplicado aqui à repetição anual das festas.
theological_decisions:
- issue: Se אֲרִיאֵל deve ser traduzido semanticamente ou mantido como nome
  choice: Manter “Ariel” no texto principal como nome de Jerusalém e registrar as possibilidades semânticas em nota.
  alternative: Traduzir como “lareira do altar” ou “leão de Deus”.
  rationale: A aposição imediata identifica Ariel com a cidade ligada a Davi, e a repetição funciona como vocativo retórico. Manter o nome evita eliminar o jogo de palavras e a ambiguidade profética.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem e a concisão retórica do hebraico foram preservadas sempre que naturais; “completem seu ciclo” comunica com clareza a recorrência anual das festas.
