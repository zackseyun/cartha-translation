  - severity: low
    issue: Formulação da nota c
    rationale: A expressão «pode designar, de modo mais específico» sugere indevidamente que os referentes enumerados são uma especificação lexical segura. O referente militar exato é debatido; a nota deve indicá-los simplesmente como possibilidades.
