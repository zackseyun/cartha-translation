review_pass:
  verdict: revise
  source_fidelity: A sequência dos três atos militares e a agência divina em primeira pessoa são preservadas. Contudo, וְצַרְתִּי é mais precisamente «sitiarei» neste contexto; «cercarei» é possível, mas enfraquece a distinção do hebraico entre acampar ao redor e pôr a cidade sob cerco. Os dois termos finais pertencem a vocabulário militar de referente exato discutido; as formulações amplas e as notas preservam adequadamente essa incerteza.
  naturalness: «Sitiarei você com obras de cerco» é claro, idiomático e evita que «cercarei» pareça mera repetição de «por todos os lados». «Você» mantém boa legibilidade brasileira e internacional, e corresponde à cidade feminina personificada sem introduzir marcação de gênero artificial.
  terminology: «Obras de cerco» e «fortificações de cerco» conservam a amplitude dos termos hebraicos. A nota de c deve apresentar torres, rampas e baluartes como possibilidades, não como sentido necessariamente mais específico do termo.
