base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/003.yaml
  text: And I will encamp against you all around[a], and I will besiege you with siegeworks[c][b], and I will raise up siege towers against you.
translation:
  language: pt
  text: E acamparei contra você por todos os lados[a]; sitiarei você com obras de cerco[b] e levantarei contra você fortificações de cerco[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como um círculo” ou “como um anel”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “um posto de cerco”, “uma posição fortificada” ou “uma guarnição”.'
    reason: lexical_alternative
  - marker: c
    text: O termo hebraico pode referir-se a torres, rampas ou baluartes de cerco.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָנִיתִי
  choice: E acamparei
  rationale: O verbo חנה significa acampar; no contexto, mantém o sentido militar e a primeira pessoa da ameaça divina.
- source_word: כַדּוּר
  choice: por todos os lados
  rationale: Expressa naturalmente a ideia contextual de cerco circular, sem excluir o sentido mais literal, registrado em nota.
- source_word: עָלָיִךְ / עָלַיִךְ
  choice: contra você
  rationale: A preposição com sufixo feminino singular tem força hostil neste contexto militar e se refere à cidade personificada.
- source_word: וְצַרְתִּי
  choice: cercarei
  rationale: O verbo צור, em uso militar, significa sitiar ou cercar; 'cercarei' evita a repetição menos natural de 'sitiarei... com obras de sítio'.
- source_word: מֻצָּב
  choice: obras de cerco
  rationale: O termo designa algo colocado ou estacionado; no contexto de um sítio, pode indicar uma posição, posto ou estrutura de cerco. A opção ampla preserva a incerteza do referente.
- source_word: וַהֲקִימֹתִי
  choice: e levantarei
  rationale: A forma causativa de קום significa fazer ficar de pé, erguer ou estabelecer, sendo adequada para instalações militares.
- source_word: מְצֻרוֹת
  choice: fortificações de cerco
  rationale: O plural pertence ao vocabulário de sítio e fortificação. A tradução ampla evita identificar com certeza estruturas específicas, como torres ou rampas.
theological_decisions:
- issue: Falante e agência no juízo
  choice: Os verbos na primeira pessoa apresentam Deus como agente direto do cerco.
  alternative: Deus apenas permite ou ordena indiretamente que exércitos humanos realizem o cerco.
  rationale: O hebraico emprega explicitamente verbos na primeira pessoa do singular. A tradução mantém essa agência direta sem especificar aqui o instrumento humano nem resolver a tensão teológica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A cidade é tratada por “você”, correspondente ao sufixo hebraico feminino singular. A terminologia militar permanece ampla onde o referente hebraico é incerto.
