base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/018.yaml
  text: And on that day the deaf will hear the words of a book[a], and out of gloom and out of darkness the eyes of the blind will see.
translation:
  language: pt
  text: Naquele dia, os surdos ouvirão as palavras de um livro[a], e, dentre a escuridão e as trevas, os olhos dos cegos verão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as palavras de um rolo” ou “as palavras de um documento”; o termo hebraico sêfer pode designar de modo amplo um texto escrito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְעוּ
  choice: ouvirão
  rationale: O perfeito qal com conjunção, neste contexto profético, tem sentido futuro; o futuro do indicativo comunica naturalmente a promessa em português.
- source_word: בַיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Expressão temporal profética corrente, preservada em formulação natural e digna em português.
- source_word: הַחֵרְשִׁים
  choice: os surdos
  rationale: O adjetivo substantivado designa pessoas surdas; esta é a forma concisa e idiomática em português.
- source_word: דִּבְרֵי סֵפֶר
  choice: as palavras de um livro
  rationale: A construção significa literalmente 'palavras de'; סֵפֶר pode designar livro, rolo ou documento escrito. 'Livro' oferece uma leitura ampla e natural, com a diversidade lexical registrada em nota.
- source_word: וּמֵאֹפֶל וּמֵחֹשֶׁךְ
  choice: e, saindo da escuridão e das trevas
  rationale: A preposição מִן indica origem ou emergência. 'Saindo de' torna explícita a relação de ambas as expressões com o ato de ver, sem eliminar o paralelismo intensificador entre אֹפֶל e חֹשֶׁךְ.
- source_word: עֵינֵי עִוְרִים
  choice: os olhos dos cegos
  rationale: Preserva de modo transparente a construção hebraica e sua imagem concreta.
- source_word: תִּרְאֶינָה
  choice: verão
  rationale: O imperfeito qal feminino plural concorda com 'olhos' e, no contexto, anuncia a visão restaurada.
theological_decisions:
- issue: Se o texto descreve somente cura física literal ou também funciona como imagem de restauração espiritual
  choice: Manter a linguagem sensorial concreta — 'surdos', 'ouvirão', 'olhos dos cegos' e 'verão' — sem qualificadores interpretativos.
  alternative: Explicitar a passagem como entendimento e percepção espirituais.
  rationale: O hebraico emprega termos sensoriais concretos, mas essa linguagem pode ter força metafórica no contexto de Isaías. A tradução preserva essa tensão e não restringe o sentido ao físico nem o converte explicitamente em metáfora.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação conserva a dignidade profética, o paralelismo entre escuridão e trevas e a imagem concreta do hebraico.
