base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/009.yaml
  text: Be stunned and be astonished[a]; blind yourselves and be blind. They are drunk, but not with wine; they stagger[b], but not from strong drink.
translation:
  language: pt
  text: Fiquem atônitos e espantados[a]; ceguem-se e fiquem cegos[b]. Estão embriagados, mas não de vinho; cambaleiam, mas não por causa de bebida forte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Demorem-se e fiquem espantados”. O primeiro imperativo pode indicar tanto hesitação perplexa como estupefação.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Fiquem cegos e ceguem-se”. Os verbos hebraicos desse par são raros e difíceis; também podem transmitir a ideia de ficar atordoado ou ofuscado.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִתְמַהְמְהוּ
  choice: Fiquem atônitos
  rationale: O imperativo hitpael exprime demora perplexa ou estado de estupefação. No paralelismo poético, “fiquem atônitos” comunica naturalmente a ideia de perplexidade paralisante, enquanto a alternativa temporal é preservada em nota.
- source_word: וּתְמָהוּ
  choice: e espantados
  rationale: O imperativo de תמהה denota espanto, assombro ou perplexidade. “Espantados” mantém a força do paralelismo sem tornar os dois verbos idênticos.
- source_word: הִשְׁתַּעַשְׁעוּ
  choice: ceguem-se
  rationale: Neste contexto, a forma rara é tradicionalmente associada à cegueira ou ao entorpecimento, e não ao deleite. A forma reflexiva preserva a construção do hebraico e sua expressão deliberadamente incisiva.
- source_word: וָשֹׁעוּ
  choice: e fiquem cegos
  rationale: O verbo raro continua o campo semântico de cegueira ou atordoamento. A tradução conserva o paralelismo conciso e não resolve além do necessário a dificuldade lexical.
- source_word: שָׁכְרוּ
  choice: Estão embriagados
  rationale: O perfeito qal de terceira pessoa plural descreve vividamente o estado resultante após os imperativos. O presente português comunica bem essa condição atual.
- source_word: וְלֹא יַיִן
  choice: mas não de vinho
  rationale: A frase nega que o vinho seja a causa da embriaguez, sinalizando que a imagem não descreve intoxicação literal comum.
- source_word: נָעוּ
  choice: cambaleiam
  rationale: נוע indica oscilar, vacilar ou cambalear. “Cambaleiam” é corrente em português e sustenta com clareza a imagem de embriaguez.
- source_word: וְלֹא שֵׁכָר
  choice: mas não por causa de bebida forte
  rationale: שֵׁכָר designa bebida intoxicante distinta do vinho. “Bebida forte” mantém essa distinção de modo breve e reconhecível, sem restringir indevidamente o termo a uma bebida específica.
theological_decisions:
- issue: Natureza das imagens de embriaguez e cegueira
  choice: Preservar no texto a embriaguez e a cegueira como imagens de um estado não provocado por bebidas alcoólicas, sem explicitar sua interpretação teológica.
  alternative: Acrescentar no texto uma explicação como “entorpecimento espiritual” ou “endurecimento judicial”.
  rationale: O próprio versículo exclui vinho e bebida forte como causas, mas não nomeia diretamente a realidade representada. A tradução mantém a tensão metafórica para que o contexto determine seu significado teológico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os imperativos na terceira pessoa do plural evitam formas arcaizantes; o paralelismo hebraico e sua aspereza intencional foram preservados. Os marcadores [a] e [b] aparecem junto às respectivas expressões no texto principal.
