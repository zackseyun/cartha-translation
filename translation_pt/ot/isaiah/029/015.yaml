base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/015.yaml
  text: Woe to those who go deep to hide counsel from Yahweh[a], whose deeds are in darkness, and who say, “Who sees us[b], and who knows us?”
translation:
  language: pt
  text: 'Ai dos que vão fundo[a] para esconder de Yahweh um plano! Suas obras estão na escuridão, e dizem: “Quem nos vê? Quem sabe de nós?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cavam fundo”.'
    reason: A forma hebraica conserva uma imagem de profundidade que pode sugerir cavar para ocultar algo; no contexto, refere-se a planejar em grande segredo.
lexical_decisions:
- source_word: הוֹי
  choice: Ai
  rationale: Introduz uma denúncia profética e anuncia juízo; “Ai” preserva essa força em português natural.
- source_word: הַמַּעֲמִיקִים
  choice: os que vão fundo
  rationale: Conserva a imagem de ir ou tornar profundo, usada aqui para a tentativa de agir com extremo segredo, sem reduzi-la apenas a “agir às escondidas”.
- source_word: מֵיהוָה לַסְתִּר עֵצָה
  choice: para esconder de Yahweh um plano
  rationale: A preposição indica que o plano é ocultado de Yahweh, e o infinitivo expressa finalidade. “Plano” comunica aqui com clareza o sentido contextual de עֵצָה.
- source_word: בְמַחְשָׁךְ מַעֲשֵׂיהֶם
  choice: Eles agem na escuridão
  rationale: Expressa naturalmente em português que suas ações ocorrem na escuridão, preservando a metáfora concreta e sua conotação de segredo.
- source_word: מִי רֹאֵנוּ וּמִי יוֹדְעֵנוּ
  choice: Quem nos vê? Quem sabe de nós?
  rationale: Mantém a formulação breve e incisiva do hebraico, sem explicitar além do texto que o conhecimento em questão envolve seus atos secretos.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega diretamente o nome da aliança, יהוה. “Yahweh” o representa como nome próprio, em vez de substituí-lo por um título.
- issue: Alcance de “Quem sabe de nós?”
  choice: preservar a formulação concisa
  alternative: “Quem sabe o que estamos fazendo?”
  rationale: O contexto sugere conhecimento dos atos secretos, mas o hebraico diz literalmente “quem nos conhece/sabe de nós”; a tradução não resolve de modo explícito o que o original deixa implícito.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem e o paralelismo profético foram preservados, enquanto “Eles agem na escuridão” evita uma construção nominal pouco natural sem perder a metáfora hebraica.
