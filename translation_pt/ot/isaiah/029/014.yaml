id: ISA.29.14
reference: Isaiah 29:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵ֗ן הִנְ/נִ֥י יוֹסִ֛ף לְ/הַפְלִ֥יא אֶת הָֽ/עָם הַ/זֶּ֖ה הַפְלֵ֣א וָ/פֶ֑לֶא וְ/אָֽבְדָה֙ חָכְמַ֣ת חֲכָמָ֔י/ו וּ/בִינַ֥ת נְבֹנָ֖י/ו תִּסְתַּתָּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/014.yaml
  text: Therefore[a], behold, I will again do something astonishing with this people—something astonishing and marvelous; and the wisdom of its wise men will perish, and the understanding of its discerning men will hide itself.
translation:
  language: pt
  text: Por isso, eis que farei novamente algo espantoso com este povo — algo espantoso e maravilhoso[a]. A sabedoria de seus sábios perecerá, e o entendimento dos que têm discernimento se esconderá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “continuarei a agir maravilhosamente com este povo, maravilha após maravilha”.'
    reason: A construção hebraica permite entender יוֹסִף como continuidade, e a repetição de פלא pode ser reproduzida mais literalmente como “maravilha após maravilha”.
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Introduz naturalmente, em português atual, a consequência da acusação anterior.
- source_word: הִנְנִי
  choice: eis que
  rationale: Preserva a fórmula profética solene que chama a atenção para a ação divina iminente.
- source_word: יוֹסִף לְהַפְלִיא
  choice: farei novamente algo espantoso
  rationale: Expressa a ação divina renovada e o caráter extraordinário do ato, sem sugerir necessariamente que seja agradável.
- source_word: הָעָם הַזֶּה
  choice: este povo
  rationale: Mantém o demonstrativo e o coletivo singular da expressão profética hebraica.
- source_word: הַפְלֵא וָפֶלֶא
  choice: algo espantoso e maravilhoso
  rationale: Reproduz a intensificação do campo lexical de פלא em linguagem portuguesa clara e solene.
- source_word: וְאָבְדָה
  choice: perecerá
  rationale: Conserva o sentido forte de desaparecimento ou ruína futura no discurso profético.
- source_word: חָכְמַת חֲכָמָיו
  choice: a sabedoria de seus sábios
  rationale: Mantém a repetição retórica entre 'sabedoria' e 'sábios', com o sufixo remetendo ao povo.
- source_word: וּבִינַת נְבֹנָיו
  choice: o entendimento de seus homens de discernimento
  rationale: Preserva a relação lexical entre entendimento e pessoas caracterizadas pelo discernimento, bem como a forma masculina plural do hebraico.
- source_word: תִּסְתַּתָּר
  choice: se esconderá
  rationale: Representa diretamente a nuance reflexiva do verbo e concorda com 'entendimento' em português.
theological_decisions:
- issue: Descrição marcada por gênero do grupo sábio e entendido
  choice: seus sábios / seus homens de discernimento
  alternative: os sábios / os entendidos
  rationale: A tradução conserva as formas masculinas plurais do hebraico e sua referência provável a sábios ou líderes representativos, sem ampliar nem restringir além do texto.
- issue: Caráter da ação extraordinária de Deus
  choice: algo espantoso e maravilhoso
  alternative: maravilha após maravilha
  rationale: 'A formulação mantém a intensidade e a tensão do termo פלא: a ação é extraordinária, mas o contexto mostra que ela pode constituir juízo, sem que a tradução resolva essa tensão de modo indevido.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das duas declarações finais conserva o paralelismo hebraico; a linguagem mantém a solenidade profética sem arcaísmos desnecessários.
