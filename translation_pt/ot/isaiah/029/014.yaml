  terminology: “Por isso”, “eis que”, “este povo”, “sabedoria”, “perecerá” e “se esconderá” são escolhas adequadas. “Algo espantoso e maravilhoso” conserva a repetição intensificadora de פלא sem determinar antecipadamente se o caráter extraordinário é favorável ou adverso. A formulação revisada evita transformar נְבֹנָיו em uma expressão portuguesa artificial.
