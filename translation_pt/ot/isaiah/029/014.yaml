  source_fidelity: 'O sentido central está bem preservado: לָכֵן introduz a consequência; הִנְנִי mantém a chamada profética de atenção; יוֹסִף לְהַפְלִיא comunica uma nova ação extraordinária de Deus; e os dois membros finais conservam tanto o paralelismo quanto o futuro profético. A nota oferece de modo apropriado a alternativa que entende יוֹסִף como continuidade e reproduz a intensificação de פלא.'
