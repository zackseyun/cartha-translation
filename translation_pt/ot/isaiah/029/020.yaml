id: ISA.29.20
reference: Isaiah 29:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי אָפֵ֥ס עָרִ֖יץ וְ/כָ֣לָה לֵ֑ץ וְ/נִכְרְת֖וּ כָּל שֹׁ֥קְדֵי אָֽוֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/020.yaml
  text: For the ruthless one will come to nothing[a], the scoffer will be finished[b], and all who watch for wrongdoing will be cut off.
translation:
  language: pt
  text: Pois o opressor chegará ao fim[a], o zombador desaparecerá, e serão eliminados todos os que ficam atentos para fazer o mal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o tirano”. O termo hebraico pode designar uma pessoa cruel, violenta ou opressora.
    reason: lexical_alternative
  - marker: b
    text: Ou “todos os que estão empenhados no mal” ou “todos os que ficam à espreita para praticar a iniquidade”. O particípio hebraico indica atenção vigilante e deliberada voltada para o mal.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da promessa anterior e mantém a ligação discursiva natural em português.
- source_word: אָפֵס
  choice: chegará ao fim
  rationale: Expressa cessação ou desaparecimento sem especificar além do hebraico como isso ocorrerá.
- source_word: עָרִיץ
  choice: o opressor
  rationale: Comunica a ideia de uma pessoa violenta, cruel ou tirânica, preservando a forma singular.
- source_word: וְכָלָה
  choice: desaparecerá
  rationale: Representa a ideia de chegar ao fim ou deixar de existir, com formulação natural e distinta da primeira oração.
- source_word: לֵץ
  choice: o zombador
  rationale: Designa quem ridiculariza com desprezo arrogante; é corrente e compreensível em português moderno.
- source_word: וְנִכְרְתוּ
  choice: serão eliminados
  rationale: Transmite o sentido passivo de serem cortados ou removidos por julgamento, evitando a expressão pouco natural 'serão cortados' sem complemento.
- source_word: כָּל
  choice: todos
  rationale: Preserva o alcance coletivo e abrangente do hebraico.
- source_word: שֹׁקְדֵי
  choice: os que ficam atentos para
  rationale: Mantém a noção participial de atenção vigilante, contínua e deliberada.
- source_word: אָוֶן
  choice: fazer o mal
  rationale: Neste contexto moral, comunica com clareza a maldade ou iniquidade à qual essas pessoas dedicam atenção; o verbo 'fazer' explicita naturalmente em português a intenção implícita da construção.
