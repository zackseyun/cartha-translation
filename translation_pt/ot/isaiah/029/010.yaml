  text: כִּֽי נָסַ֨ךְ עֲלֵי/כֶ֤ם יְהוָה֙ ר֣וּחַ תַּרְדֵּמָ֔ה וַ/יְעַצֵּ֖ם אֶת עֵֽינֵי/כֶ֑ם אֶת הַ/נְּבִיאִ֛ים וְ/אֶת רָאשֵׁי/כֶ֥ם הַ/חֹזִ֖ים כִּסָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/010.yaml
  text: For Yahweh has poured out on you a spirit of deep sleep[b][a], and has shut your eyes—the prophets—and covered your heads—the seers.
translation:
  language: pt
  text: Pois Yahweh derramou sobre vocês um espírito de sono profundo[a]; fechou os olhos de vocês — os profetas — e cobriu as cabeças de vocês — os videntes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um espírito de torpor”. O termo hebraico pode indicar sono profundo ou um estado de entorpecimento.'
    reason: lexical_alternative
  - marker: b
    text: A sintaxe hebraica provavelmente identifica “os profetas” com “os olhos de vocês” e “os videntes” com “as cabeças de vocês”. Outra leitura entende “os profetas” como objeto de “fechou” e liga “os videntes” a “as cabeças de vocês”.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou causa da condição descrita no contexto anterior.
- source_word: נָסַךְ
  choice: derramou
  rationale: Preserva a imagem concreta de verter algo sobre o povo e a ação direta atribuída a Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, distinguindo-o do título “Senhor”.
- source_word: רוּחַ תַּרְדֵּמָה
  choice: um espírito de sono profundo
  rationale: “Espírito” expressa aqui uma condição imposta; “sono profundo” traduz diretamente תַּרְדֵּמָה sem eliminar sua possível nuance de torpor.
- source_word: וַיְעַצֵּם
  choice: fechou
  rationale: Mantém a imagem corporal dos olhos sem explicitá-la interpretativamente como cegueira.
- source_word: עֵינֵיכֶם
  choice: os olhos de vocês
  rationale: Tradução direta e natural em português internacional com boa legibilidade brasileira.
- source_word: אֶת הַנְּבִיאִים
  choice: os profetas
  rationale: Tratado como aposto de “os olhos de vocês”, conforme o paralelismo provável da sintaxe hebraica.
- source_word: רָאשֵׁיכֶם
  choice: a cabeça de vocês
  rationale: O hebraico usa o plural distributivo; o singular distributivo é mais natural em português e conserva a imagem, sem interpretá-la como “líderes”.
- source_word: הַחֹזִים
  choice: os videntes
  rationale: Termo profético tradicional e compreensível, distinto de “profetas”.
- source_word: כִּסָּה
  choice: cobriu
  rationale: Preserva a ação e o paralelismo imagético do hebraico.
theological_decisions:
- issue: Ação divina no endurecimento judicial
  choice: Yahweh derramou, fechou e cobriu
  alternative: Yahweh permitiu que viesse sobre vocês
  rationale: Os verbos hebraicos atribuem diretamente a ação a Yahweh; a tradução mantém essa tensão teológica sem convertê-la em mera permissão.
- issue: Relação sintática entre “olhos/profetas” e “cabeça/videntes”
  choice: Ler “os profetas” e “os videntes” como apostos
  alternative: Entendê-los como objetos separados dos verbos
  rationale: 'A leitura apositiva oferece o paralelismo mais coerente: os profetas funcionam como os olhos do povo, e os videntes como sua cabeça. A possibilidade alternativa é registrada em nota.'
translation_notes:
  register: Português moderno, digno e acessível, com uso de “vocês” para o plural. Os travessões sinalizam a aposição interpretativa sem apagar a dificuldade sintática; as duas notas estão marcadas no texto principal.
