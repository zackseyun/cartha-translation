base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/013.yaml
  text: 'And the Lord said: Because this people draws near with its mouth and honors me with its lips[a], while its heart is far from me, and their fear of me has become a commandment of men that is taught[b],'
translation:
  language: pt
  text: 'E o Senhor disse: “Visto que este povo se aproxima de mim com a boca e me honra com os lábios, mas seu coração está longe de mim, e seu temor de mim[a] se tornou um mandamento humano que é ensinado[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «sua reverência por mim» ou «seu culto a mim». Hebraico: «seu temor de mim».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «um mandamento humano aprendido». A expressão pode sugerir um preceito ensinado mecanicamente, mas essa nuance não é explícita.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: o Senhor
  rationale: Traduz o título divino אֲדֹנָי de modo natural na fórmula profética portuguesa, sem confundi-lo explicitamente com o nome YHWH.
- source_word: יַעַן כִּי
  choice: Visto que
  rationale: Expressa com clareza a relação causal introduzida pela locução hebraica e se ajusta ao período que continua no versículo seguinte.
- source_word: נִגַּשׁ
  choice: se aproxima de mim
  rationale: Preserva o sentido de chegar perto, possivelmente em contexto cultual; o complemento 'de mim' é explicitado pelo contexto e pelo paralelismo com a distância do coração.
- source_word: הָעָם הַזֶּה
  choice: este povo
  rationale: Mantém o coletivo singular e o tom profético do hebraico.
- source_word: בְּפִיו וּבִשְׂפָתָיו
  choice: com a boca ... com os lábios
  rationale: Conserva o paralelismo concreto entre boca e lábios, marcas da devoção exterior.
- source_word: כִּבְּדוּנִי
  choice: me honra
  rationale: Verte כבד no sentido relacional de atribuir honra, a opção portuguesa mais clara no contexto.
- source_word: לִבּוֹ רִחַק מִמֶּנִּי
  choice: mantém o coração longe de mim
  rationale: O verbo hebraico sugere afastamento; esta formulação natural preserva a responsabilidade ativa do povo e o contraste entre proximidade exterior e distância interior.
- source_word: וַתְּהִי
  choice: se tornou
  rationale: Comunica o estado resultante indicado pelo verbo, sem reduzi-lo a uma simples cópula.
- source_word: יִרְאָתָם אֹתִי
  choice: o seu temor de mim
  rationale: Mantém o núcleo lexical de יִרְאָה e a tensão entre medo, reverência e devoção, sem escolher silenciosamente uma interpretação mais estreita.
- source_word: מִצְוַת אֲנָשִׁים
  choice: um mandamento humano
  rationale: Comunica que o mandamento tem origem meramente humana. Em português atual, 'humano' preserva o sentido genérico de אֲנָשִׁים com maior clareza do que 'de homens'.
- source_word: מְלֻמָּדָה
  choice: que lhes foi ensinado
  rationale: Representa o particípio passivo de למד e torna explícitos, de maneira contextual, os destinatários do ensino; a possibilidade de 'aprendido' é registrada em nota.
theological_decisions:
- issue: Sentido de יִרְאָתָם אֹתִי
  choice: o seu temor de mim
  alternative: a sua reverência por mim; o seu culto a mim
  rationale: A tradução principal conserva 'temor', o núcleo semântico do hebraico, e não dissolve a tensão teológica entre genuína disposição diante de Deus e religiosidade baseada em instrução humana.
- issue: Origem humana do mandamento
  choice: um mandamento humano
  alternative: um mandamento de homens
  rationale: A forma adjetival é idiomática e inclusiva em português, sem alterar a crítica profética à devoção reduzida a preceito de origem humana.
- issue: Valor passivo de מְלֻמָּדָה
  choice: que lhes foi ensinado
  alternative: aprendido; ensinado mecanicamente
  rationale: A tradução mantém o valor passivo básico sem acrescentar à linha principal a ideia interpretativa de repetição mecânica ou memorização ritual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O coletivo 'este povo' é retomado por formas no singular, naturais em português. A abertura e a vírgula final refletem que a declaração causal prossegue no versículo seguinte. O marcador [a] aparece no texto principal.
