  naturalness: O registro é claro, moderno e adequado. «Seu coração está longe de mim» é natural e conserva melhor o paralelismo. «Um mandamento humano que é ensinado» é compreensível e evita a explicitação não textual de «lhes».
  terminology: «O Senhor», «temor», «mandamento humano» e «ensinado» são escolhas adequadas. Convém registrar em nota as alternativas semânticas de «temor», bem como «aprendido» para o particípio passivo.
