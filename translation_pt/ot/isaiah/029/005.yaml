base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/005.yaml
  text: But the multitude of your strangers shall become like fine dust[a], and the multitude of the ruthless like passing chaff; and it shall happen suddenly[b], in an instant.
translation:
  language: pt
  text: Mas a multidão dos seus estrangeiros[a] será como pó fino, e a multidão dos violentos, como palha miúda que se vai[b]. E isso acontecerá de repente, num instante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos que lhe são estranhos”. No contexto, trata-se de estrangeiros hostis.
    reason: lexical_alternative
  - marker: b
    text: Ou “como palha miúda que passa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: será / isso acontecerá
  rationale: 'As duas ocorrências têm funções ligeiramente distintas: a primeira introduz as comparações e é bem expressa por “será”; a segunda anuncia a ocorrência repentina do acontecimento, daí “isso acontecerá”.'
- source_word: כְּאָבָק דַּק
  choice: como pó fino
  rationale: אָבָק significa “pó”, e דַּק acrescenta a ideia de finura ou pequenez; a expressão conserva a imagem de algo facilmente disperso.
- source_word: הֲמוֹן
  choice: multidão
  rationale: O termo designa uma grande massa de pessoas. “Multidão” preserva o paralelismo das duas ocorrências e combina com o registro profético.
- source_word: זָרָיִךְ
  choice: seus estrangeiros
  rationale: O termo se refere fundamentalmente a estrangeiros ou pessoas de fora. O contexto indica invasores hostis, mas “estrangeiros” evita substituir a designação hebraica pela interpretação mais específica “inimigos”.
- source_word: וּכְמֹץ עֹבֵר
  choice: como palha que passa
  rationale: מֹץ é a palha miúda separada do cereal, e עֹבֵר descreve aquilo que passa. A formulação mantém a imagem concisa de algo levado adiante e rapidamente desaparecido.
- source_word: עָרִיצִים
  choice: os violentos
  rationale: עָרִיץ designa pessoas violentas, cruéis ou opressoras. “Os violentos” expressa diretamente sua força moral sem restringir o termo a governantes tirânicos.
- source_word: לְפֶתַע פִּתְאֹם
  choice: de repente, num instante
  rationale: Os dois termos próximos intensificam a ideia de súbita ocorrência. A tradução conserva ambos sem produzir uma repetição pouco natural em português.
