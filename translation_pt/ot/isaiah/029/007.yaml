id: ISA.29.7
reference: Isaiah 29:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָ֗ה כַּֽ/חֲלוֹם֙ חֲז֣וֹן לַ֔יְלָה הֲמוֹן֙ כָּל הַ/גּוֹיִ֔ם הַ/צֹּבְאִ֖ים עַל אֲרִיאֵ֑ל וְ/כָל צֹבֶ֨י/הָ֙ וּ/מְצֹ֣דָתָ֔/הּ וְ/הַ/מְּצִיקִ֖ים לָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/007.yaml
  text: And the multitude of all the nations that wage war against Ariel[a], even all who wage war against her and her stronghold, and who distress her, will be like a dream[c][b], a vision of the night.
translation:
  language: pt
  text: E a multidão de todas as nações que guerreiam contra Ariel[a] — todos os que guerreiam contra ela e contra sua fortaleza[c], e os que a afligem — será como um sonho, uma visão da noite.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neste contexto, Ariel é o nome poético que Isaías dá a Jerusalém.
    reason: cross_reference
  - marker: b
    text: 'Ou: “uma visão noturna”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “seu baluarte”; alguns entendem a expressão como “as obras de cerco levantadas contra ela”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: E ... será
  rationale: O perfeito com waw introduz, no discurso profético, a comparação que se segue. O futuro em português expressa naturalmente o sentido contextual.
- source_word: כַּחֲלוֹם
  choice: como um sonho
  rationale: A preposição כ marca comparação; esta formulação preserva a imagem poética com clareza.
- source_word: חֲזוֹן לַיְלָה
  choice: uma visão da noite
  rationale: Reproduz de perto a relação construta do hebraico e mantém o paralelismo poético com “sonho”.
- source_word: הֲמוֹן כָּל הַגּוֹיִם
  choice: a multidão de todas as nações
  rationale: הֲמוֹן indica uma massa numerosa ou tumultuosa, e גּוֹיִם se refere aqui às nações estrangeiras reunidas para a guerra.
- source_word: הַצֹּבְאִים עַל
  choice: que guerreiam contra
  rationale: O particípio de צבא, com עַל neste contexto militar, descreve ação de guerra hostil contra alguém.
- source_word: אֲרִיאֵל
  choice: Ariel
  rationale: Mantém o nome poético usado no texto hebraico, sem substituí-lo interpretativamente por “Jerusalém” no corpo do versículo.
- source_word: וְכָל צֹבֶיהָ
  choice: todos os que guerreiam contra ela
  rationale: O sufixo feminino retoma Ariel; a repetição de “guerreiam” preserva a ligação lexical com a expressão anterior.
- source_word: וּמְצֹדָתָהּ
  choice: e contra sua fortaleza
  rationale: מְצוֹדָה normalmente designa fortaleza ou baluarte. A preposição “contra”, retomada do contexto, torna clara a relação sintática em português, enquanto a nota registra outra interpretação possível.
- source_word: וְהַמְּצִיקִים לָהּ
  choice: e os que a afligem
  rationale: O particípio causativo expressa a ideia de causar aperto, aflição ou opressão, sem exigir que se especifique uma única tática militar.
theological_decisions:
- issue: Referente de “Ariel”
  choice: Conservar “Ariel” como nome poético transliterado.
  alternative: Substituir o nome por “Jerusalém”.
  rationale: O hebraico traz אֲרִיאֵל. Manter o nome preserva a forma e a força poética do texto, enquanto a identificação contextual com Jerusalém fica explicitada em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com estrutura poética preservada por meio de travessões. “Guerreiam” comunica o contexto militar sem soar técnico; “afligem” mantém a amplitude semântica do hebraico.
