  naturalness: O texto é claro, mas “deve ser considerado como o barro” é menos direto em uma pergunta retórica. “Será o oleiro considerado barro?” é mais natural e conserva a formulação passiva. A abertura nominal pode ser mantida como exclamação sem perder a força.
  terminology: “Oleiro” e “barro” são escolhas corretas e mantêm a imagem profética. “Aquilo que foi feito/formado” preserva adequadamente o paralelismo entre מַעֲשֶׂה e יֵצֶר.
