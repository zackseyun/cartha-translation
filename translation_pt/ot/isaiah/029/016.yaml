  text: הַ֨פְכְּ/כֶ֔ם אִם כְּ/חֹ֥מֶר הַ/יֹּצֵ֖ר יֵֽחָשֵׁ֑ב כִּֽי יֹאמַ֨ר מַעֲשֶׂ֤ה לְ/עֹשֵׂ֨/הוּ֙ לֹ֣א עָשָׂ֔/נִי וְ/יֵ֛צֶר אָמַ֥ר לְ/יוֹצְר֖/וֹ לֹ֥א הֵבִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/016.yaml
  text: You turn things upside down! Shall the potter be regarded as clay[a], that what is made should say of its maker, “He did not make me,” and what is formed say of the one who formed it, “He has no understanding”?
translation:
  language: pt
  text: 'Que inversão a de vocês! Será o oleiro considerado barro[a], para que aquilo que foi feito diga a respeito de quem o fez: “Ele não me fez”, e aquilo que foi formado diga a respeito de quem o formou: “Ele não tem entendimento”?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente, “A inversão de vocês!”. Alguns entendem a abertura como “A perversidade de vocês!” ou a traduzem verbalmente: “Vocês viram tudo de cabeça para baixo!”. A relação sintática da exclamação com a pergunta seguinte é discutida; também se pode entender: “Como se o oleiro fosse considerado barro”.'
    reason: A abertura hebraica é elíptica e admite diferentes análises; a nota registra alternativas relevantes sem resolver além do que o texto permite.
lexical_decisions:
- source_word: הַפְכְּכֶם
  choice: Vocês viram tudo de cabeça para baixo!
  rationale: A expressão nominal com sufixo de segunda pessoa plural é elíptica e exclamativa. A formulação verbal comunica em português corrente a forte repreensão pela inversão da realidade.
- source_word: אִם
  choice: Será que
  rationale: Neste contexto, אִם introduz uma pergunta retórica, não uma condição simples.
- source_word: כְּחֹמֶר
  choice: como o barro
  rationale: חֹמֶר designa o barro usado pelo oleiro; a escolha preserva o material concreto da metáfora.
- source_word: הַיֹּצֵר
  choice: o oleiro
  rationale: Embora derive do verbo 'formar', em associação direta com o barro o termo evoca concretamente o oleiro.
- source_word: יֵחָשֵׁב
  choice: deve ser considerado
  rationale: O nifal de חשׁב significa ser considerado ou tido como; a construção integra naturalmente a pergunta retórica.
- source_word: מַעֲשֶׂה
  choice: aquilo que foi feito
  rationale: No contraste entre quem faz e o objeto feito, o termo indica o produto da ação, não uma obra abstrata.
- source_word: לְעֹשֵׂהוּ
  choice: a quem o fez
  rationale: O ל após אמר pode marcar a pessoa a quem se dirige a fala; esta opção natural em português preserva a possibilidade de discurso dirigido ao autor da obra.
- source_word: עָשָׂנִי
  choice: não me fez
  rationale: O perfeito hebraico expressa aqui a negação de que o autor tenha produzido o objeto.
- source_word: יֵצֶר
  choice: aquilo que foi formado
  rationale: O termo designa o produto formado e mantém o paralelismo com 'aquilo que foi feito'.
- source_word: לְיוֹצְרוֹ
  choice: a quem o formou
  rationale: A formulação mantém o paralelismo e conserva a relação entre o objeto formado e aquele que lhe deu forma.
- source_word: הֵבִין
  choice: não entende nada
  rationale: O hifil de בין pode significar entender ou ter discernimento. A expressão corrente comunica enfaticamente a acusação de falta de entendimento.
theological_decisions:
- issue: Metáfora do oleiro e do barro
  choice: Manter explicitamente 'oleiro' e 'barro'.
  alternative: Substituir a imagem por termos abstratos como 'criador' e 'criação'.
  rationale: A força do texto está na inversão absurda entre o artífice e o material. A imagem concreta é preservada sem acrescentar uma formulação doutrinária ao texto.
- issue: Exclamação inicial
  choice: Vocês viram tudo de cabeça para baixo!
  alternative: Que perversidade a de vocês! / Ó inversão de vocês!
  rationale: O hebraico é comprimido e admite mais de uma análise. A tradução principal expressa a repreensão contextual, enquanto a nota registra a forma mais literal e a alternativa lexical.
- issue: Direção da fala marcada por ל
  choice: Traduzir como fala dirigida a quem fez ou formou o objeto.
  alternative: Entender como 'diga a respeito de quem o fez/formou'.
  rationale: A preposição permite variação contextual. A tradução escolhida é natural em português e não altera o conteúdo da acusação; a ambiguidade é registrada em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com 'vocês' para a segunda pessoa plural. A imagem artesanal e o paralelismo foram mantidos. 'Não entende nada' é corrente e enfático, sem cair em linguagem coloquial excessiva.
