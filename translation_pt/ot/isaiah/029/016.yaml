  to: 'Que inversão a de vocês! Será o oleiro considerado barro[a], para que aquilo que foi feito diga a respeito de quem o fez: “Ele não me fez”, e aquilo que foi formado diga a respeito de quem o formou: “Ele não tem entendimento”?'
  rationale: A revisão conserva a repreensão inicial, a pergunta retórica e a imagem do oleiro e do barro. Ajusta as duas ocorrências de ל para a referência em terceira pessoa exigida pelas citações, evita uma intensificação não expressa no hebraico e torna a pergunta mais natural em português moderno.
