  yaml_path: translation/ot/isaiah/029/002.yaml
  text: And I will distress Ariel[a], and there will be mourning and lamentation, and she will be to me like an altar hearth.
translation:
  language: pt
  text: Eu afligirei Ariel[a]; haverá pranto e lamentação, e ela será para mim como um braseiro do altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico אֲרִיאֵל (“Ariel”) provavelmente contém um jogo de palavras: a cidade chamada Ariel se tornará como um “braseiro do altar”. Outra tradução possível para a frase final é, mais literalmente, “e ela será para mim como Ariel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲצִיקוֹתִי
  choice: Eu afligirei
  rationale: O hifil de צוק/ציק expressa causar aperto, aflição ou angústia. “Afligirei” mantém o sentido amplo sem especificar indevidamente um cerco militar, embora esse contexto apareça no versículo seguinte.
- source_word: לַאֲרִיאֵל
  choice: Ariel
  rationale: No contexto, אֲרִיאֵל funciona como nome ou designação de Jerusalém (cf. v. 1); por isso, é transliterado. Sua possível associação lexical com a lareira do altar é retomada no fim do versículo.
- source_word: וְהָיְתָה תַאֲנִיָּה וַאֲנִיָּה
  choice: haverá pranto e lamentação
  rationale: A formulação portuguesa é natural e conserva o par de substantivos quase sinônimos, que intensifica poeticamente a expressão de dor.
- source_word: תַאֲנִיָּה
  choice: pranto
  rationale: O termo indica lamento, gemido ou manifestação de luto. “Pranto” comunica de modo claro e concreto a dor expressa.
- source_word: וַאֲנִיָּה
  choice: e lamentação
  rationale: O substantivo próximo em sentido reforça a aflição. “Lamentação” preserva a duplicação poética sem reduzir ambos os termos à mesma palavra.
- source_word: וְהָיְתָה לִּי
  choice: e ela será para mim
  rationale: O feminino singular provavelmente retoma Ariel como cidade, isto é, Jerusalém. O pronome “ela” preserva essa personificação feminina.
- source_word: כַּאֲרִיאֵל
  choice: como uma lareira de altar
  rationale: 'A repetição de אֲרִיאֵל provavelmente constitui um jogo de palavras: Ariel, a cidade, se tornará como um אֲרִיאֵל, entendido como lareira do altar. A tradução pelo sentido comunica a ironia e a imagem sacrificial, enquanto a alternativa formal é registrada em nota.'
theological_decisions:
- issue: Tradução do אֲרִיאֵל repetido e preservação do jogo de palavras
  choice: Traduzir a primeira ocorrência como “Ariel”, nome da cidade, e a segunda como “lareira de altar”, seu provável sentido lexical.
  alternative: 'Manter “Ariel” nas duas ocorrências: “e ela será para mim como Ariel”.'
  rationale: O contexto identifica Ariel com Jerusalém, mas a frase final parece explorar outro sentido do mesmo termo. Esta solução transmite a força profética e a provável imagem sacrificial sem eliminar a ambiguidade, que permanece indicada na nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi levemente ajustada para soar natural, preservando o paralelismo, a personificação da cidade e o jogo lexical central.
