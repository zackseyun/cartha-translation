source:
  edition: WLC
  text: מֵ/עִ֨ם יְהוָ֤ה צְבָאוֹת֙ תִּפָּקֵ֔ד בְּ/רַ֥עַם וּ/בְ/רַ֖עַשׁ וְ/ק֣וֹל גָּד֑וֹל סוּפָה֙ וּ/סְעָרָ֔ה וְ/לַ֖הַב אֵ֥שׁ אוֹכֵלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/006.yaml
  text: From Yahweh of hosts you will be visited with thunder and with earthquake and a great noise[a], with whirlwind and storm[c][b], and with the flame of a consuming fire.
translation:
  language: pt
  text: Você será visitado por Yahweh dos Exércitos[a], com trovão, terremoto[b] e grande estrondo[c], com redemoinho e tempestade e com a chama de um fogo devorador.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «será castigado». O verbo hebraico significa literalmente «ser visitado» e pode indicar uma intervenção divina para bênção ou para juízo; aqui, o contexto indica juízo.
    reason: lexical_alternative
  - marker: b
    text: Ou «abalo».
    reason: lexical_alternative
  - marker: c
    text: Ou «som muito forte».
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעִם
  choice: por
  rationale: Com o nifal de פקד, a preposição introduz a origem ou o agente da visitação. Em português, «por» acompanha naturalmente a construção passiva sem ampliar o texto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Preserva o título divino tradicional e a imagem de forças ou exércitos sob o comando de Yahweh.
- source_word: תִּפָּקֵד
  choice: você será visitado
  rationale: Mantém a voz passiva e o sentido amplo do idioma hebraico, que pode indicar uma intervenção divina para bênção ou juízo; neste contexto, as imagens seguintes deixam claro o caráter judicial.
- source_word: בְּרַעַם
  choice: com trovão
  rationale: Representa o fenômeno associado à visitação divina de modo direto e idiomático.
- source_word: וּבְרַעַשׁ
  choice: terremoto
  rationale: רַעַשׁ pode designar tremor, abalo ou terremoto; neste cenário teofânico, «terremoto» comunica com clareza sua força concreta.
- source_word: וְקוֹל גָּדוֹל
  choice: e grande estrondo
  rationale: קוֹל é som, ruído ou voz; como não há falante expresso e o contexto reúne fenômenos violentos, «estrondo» é natural e vívido.
- source_word: סוּפָה
  choice: com vendaval
  rationale: Comunica um vento tempestuoso e mantém este elemento distinto da tempestade mencionada em seguida.
- source_word: וּסְעָרָה
  choice: e tempestade
  rationale: Preserva a acumulação poética de fenômenos meteorológicos sem fundir os dois termos hebraicos.
- source_word: וְלַהַב אֵשׁ אוֹכֵלָה
  choice: e com a chama de um fogo devorador
  rationale: Conserva a relação entre «chama» e «fogo» e reproduz a imagem vívida de um fogo que consome.
theological_decisions:
- issue: Natureza da visitação divina expressa por פקד
  choice: Manter «você será visitado»
  alternative: «você será castigado»
  rationale: Embora o contexto indique inequivocamente juízo, o verbo hebraico é mais amplo. A formulação escolhida preserva a tensão do idioma bíblico, enquanto os fenômenos destrutivos esclarecem o sentido neste caso.
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe acessível. «Visitado» conserva o idioma hebraico e sua amplitude sem ocultar o juízo indicado pelo contexto. «Vendaval» e «tempestade» mantêm distintos os termos poéticos paralelos.
