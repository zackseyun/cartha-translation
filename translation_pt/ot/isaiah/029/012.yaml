  text: וְ/נִתַּ֣ן הַ/סֵּ֗פֶר עַל֩ אֲשֶׁ֨ר לֹֽא יָדַ֥ע סֵ֛פֶר לֵ/אמֹ֖ר קְרָ֣א נָא זֶ֑ה וְ/אָמַ֕ר לֹ֥א יָדַ֖עְתִּי סֵֽפֶר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/012.yaml
  text: And the book is given to one who does not know writing, saying, “Please read this,” and he says, “I do not know writing.”
translation:
  language: pt
  text: 'E o livro é entregue a quem não sabe ler[a], e lhe dizem: “Por favor, leia isto”. Ele responde: “Não sei ler”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “não conhece livro” ou “não conhece a escrita”; isto é, não sabe ler.
    reason: Preserva a formulação idiomática do hebraico e sua amplitude lexical, enquanto o texto principal expressa o sentido contextual em português natural.
lexical_decisions:
- source_word: סֵפֶר (sēfer)
  choice: livro / ler
  rationale: O substantivo significa “livro”, “documento” ou “escrita”. Na expressão לֹא יָדַע סֵפֶר, literalmente “não conhece livro/escrita”, o contexto contrasta a pessoa capaz de ler com a incapaz; em português corrente, “não sabe ler” comunica naturalmente o sentido.
- source_word: קְרָא־נָא זֶה (qĕrāʾ-nāʾ zeh)
  choice: Por favor, leia isto
  rationale: קרא é “ler” neste contexto, נא marca um pedido, e זה designa o livro/documento apresentado.
- source_word: וְנִתַּן (wĕnittan)
  choice: é entregue
  rationale: Mantém a forma passiva do hebraico e a ligação sequencial com o versículo anterior.
theological_decisions:
- issue: Sentido da expressão “não conhecer livro/escrita”
  choice: não sabe ler
  alternative: não conhece a escrita / não sabe escrever
  rationale: O pedido imediato é que a pessoa leia o documento, de modo que a incapacidade relevante é a leitura. A nota preserva a forma concreta e a amplitude lexical do hebraico sem impor uma interpretação teológica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Lhe dizem” torna explícito o destinatário já indicado pelo contexto, sem acrescentar conteúdo substantivo; a resposta direta mantém a repetição enfática do original.
