id: ISA.29.17
reference: Isaiah 29:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֲ/לוֹא עוֹד֙ מְעַ֣ט מִזְעָ֔ר וְ/שָׁ֥ב לְבָנ֖וֹן לַ/כַּרְמֶ֑ל וְ/הַ/כַּרְמֶ֖ל לַ/יַּ֥עַר יֵחָשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/017.yaml
  text: Is it not yet a very little while[a], and Lebanon will turn into an orchard, and the orchard will be regarded as a forest?
translation:
  language: pt
  text: Não é verdade que, daqui a bem pouco tempo, o Líbano se transformará em campo fértil[a], e o campo fértil será considerado uma floresta?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “terra cultivada”. O hebraico כַּרְמֶל indica terra fértil e cultivada; neste contexto, não se trata do nome próprio Carmelo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: Não é verdade que
  rationale: Introduz uma pergunta retórica que espera resposta afirmativa, preservando de modo natural em português tanto a forma interrogativa quanto sua força de certeza.
- source_word: עוֹד מְעַט מִזְעָר
  choice: daqui a bem pouco tempo
  rationale: A combinação intensifica a brevidade do intervalo. A expressão escolhida comunica com naturalidade que a mudança está muito próxima.
- source_word: וְשָׁב
  choice: se transformará em
  rationale: Embora שוב frequentemente expresse retorno, aqui indica mudança de estado; esta formulação evita sugerir indevidamente um retorno histórico explícito.
- source_word: לְבָנוֹן
  choice: o Líbano
  rationale: Mantém o nome geográfico, que no contexto também evoca sua conhecida região florestal.
- source_word: כַּרְמֶל
  choice: campo fértil
  rationale: Aqui o termo comum designa terra fértil e cultivada, não o nome próprio Carmelo. 'Campo fértil' é preciso e amplamente compreensível em português.
- source_word: לַיַּעַר
  choice: uma floresta
  rationale: יַעַר designa floresta ou região de mata; o artigo indefinido é natural em português após 'considerado'.
- source_word: יֵחָשֵׁב
  choice: será considerado
  rationale: Preserva o valor passivo do nifal de חשב, que expressa ser tido, contado ou considerado como algo.
theological_decisions:
- issue: Natureza da imagem de transformação
  choice: Manter a imagem como anúncio retórico de uma reversão extraordinária na condição da terra, sem definir se é literal, metafórica ou ambas.
  alternative: Interpretar explicitamente a mudança como transformação agrícola literal ou como reversão exclusivamente social e espiritual.
  rationale: O hebraico anuncia reversão e renovação, mas este versículo isoladamente não determina um único nível de referência. A tradução conserva essa abertura profética.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção retórica foi preservada sem rigidez sintática, e a repetição de 'campo fértil' reproduz a ligação verbal do hebraico.
