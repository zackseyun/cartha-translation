  text: וּ/תְקַעְתִּ֥י/ו יָתֵ֖ד בְּ/מָק֣וֹם נֶאֱמָ֑ן וְ/הָיָ֛ה לְ/כִסֵּ֥א כָב֖וֹד לְ/בֵ֥ית אָבִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/023.yaml
  text: And I will drive him like a peg into a secure place[b][a], and he will become a throne of honor to his father's house.
translation:
  language: pt
  text: Eu o fincarei como uma estaca em lugar firme[a], e ele se tornará um trono de honra[b] para a casa de seu pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu o fixarei como um pino em lugar seguro”.'
    reason: lexical_alternative
  - marker: b
    text: “Trono de honra” também pode ser traduzido por “trono glorioso” ou “assento de honra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְקַעְתִּיו
  choice: Eu o fincarei
  rationale: O verbo תקע, usado com יָתֵד, descreve o ato concreto de cravar ou fixar algo. “Fincarei” preserva com naturalidade e vigor a imagem em português.
- source_word: יָתֵד
  choice: estaca
  rationale: יָתֵד pode indicar estaca, pino ou prego. “Estaca” mantém claramente a imagem de um suporte cravado com firmeza e permite a comparação natural “como uma estaca”.
- source_word: בְּמָקוֹם נֶאֱמָן
  choice: em lugar firme
  rationale: נֶאֱמָן indica aqui estabilidade, segurança e confiabilidade. “Lugar firme” expressa diretamente a solidez física evocada pela metáfora.
- source_word: וְהָיָה
  choice: ele se tornará
  rationale: Embora היה possa ser traduzido por “ser”, o contexto apresenta o estado resultante da ação divina; “se tornará” comunica essa progressão sem eliminar a possibilidade semântica básica.
- source_word: לְכִסֵּא כָבוֹד
  choice: um trono de honra
  rationale: A formulação conserva tanto כִּסֵּא, “trono”, quanto כָבוֹד, “honra/glória”, sem reduzir a metáfora a uma explicação política.
- source_word: לְבֵית אָבִיו
  choice: para a casa de seu pai
  rationale: A preposição לְ pode indicar relação ou benefício. “Para” é natural em português e deixa perceptível que a honra alcança a família ancestral dele.
theological_decisions:
- issue: Retrato metafórico do papel de Eliaquim
  choice: Preservar as imagens concretas da estaca e do trono.
  alternative: Explicar o sentido como um líder firmemente estabelecido que honra sua família.
  rationale: O hebraico combina duas metáforas sem explicá-las. Mantê-las conserva a riqueza literária e a tensão teológica do oráculo, evitando impor uma interpretação política ou doutrinária mais estreita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem das notas foi ajustada para que cada marcador apareça junto ao trecho ao qual se refere.
