  text: וְ/תָל֨וּ עָלָ֜י/ו כֹּ֣ל כְּב֣וֹד בֵּית אָבִ֗י/ו הַ/צֶּֽאֱצָאִים֙ וְ/הַ/צְּפִע֔וֹת כֹּ֖ל כְּלֵ֣י הַ/קָּטָ֑ן מִ/כְּלֵי֙ הָֽ/אַגָּנ֔וֹת וְ/עַ֖ד כָּל כְּלֵ֥י הַ/נְּבָלִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/024.yaml
  text: 'And they will hang on him all the honor of his father’s house: the offspring and the offshoots, every small vessel, from the bowls to all the jars.'
translation:
  language: pt
  text: 'E pendurarão nele toda a honra da casa de seu pai: os descendentes e os rebentos[a], todos os recipientes pequenos, desde as bacias até todas as jarras.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo traduzido por “rebentos” é raro e de sentido incerto; provavelmente dá continuidade à imagem de descendência.
    reason: Registra incerteza lexical genuína sem sobrecarregar o texto principal.
lexical_decisions:
- source_word: כְּבוֹד
  choice: honra
  rationale: No contexto da casa paterna, o termo indica o prestígio ou a importância da família que passará a depender dele; “honra” conserva esse sentido sem excluir a ideia mais ampla de peso ou glória.
- source_word: הַצֶּאֱצָאִים וְהַצְּפִעוֹת
  choice: os descendentes e os rebentos
  rationale: “Descendentes” traduz o primeiro termo com clareza; “rebentos” preserva a imagem vegetal provável e o paralelismo, sem identificar com precisão indevida diferentes graus de parentesco.
- source_word: כְּלֵי הַקָּטָן
  choice: todos os recipientes pequenos
  rationale: Mantém a metáfora dos objetos pendurados no suporte e expressa o valor coletivo ou classificatório de “pequeno” no hebraico.
- source_word: אַגָּנוֹת ... נְּבָלִים
  choice: bacias ... jarras
  rationale: São nomes de recipientes; estas equivalências são naturais em português e preservam a progressão concreta da metáfora doméstica.
theological_decisions:
- issue: Referência dos descendentes e recipientes
  choice: Manter a linguagem metafórica do texto, sem explicá-la no corpo do versículo.
  alternative: Parafrasear todos os termos como membros importantes e humildes da família.
  rationale: O hebraico sobrepõe a dependência da casa paterna à imagem de recipientes pendurados; explicitar uma interpretação social específica apagaria essa tensão poética.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição e a metáfora dos recipientes foram preservadas, evitando uma paráfrase interpretativa da estrutura familiar.
