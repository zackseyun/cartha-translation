source:
  edition: WLC
  text: הִנֵּ֤ה יְהוָה֙ מְטַלְטֶלְ/ךָ֔ טַלְטֵלָ֖ה גָּ֑בֶר וְ/עֹטְ/ךָ֖ עָטֹֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/017.yaml
  text: Look[a], Yahweh is about to hurl you away violently, O man, and wrap you up tightly.
translation:
  language: pt
  text: 'Veja[a]: Yahweh está prestes a lançar você para longe com violência, ó homem, e a enrolá-lo completamente.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “certamente o lançará com um arremesso violento, homem forte”. O hebraico é compacto e difícil, e גָּבֶר pode significar “homem” ou “homem forte”, sem necessariamente funcionar como vocativo.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Veja
  rationale: Introduz um anúncio enfático e preserva a força dêitica em português atual, sem o tom arcaico de “Eis”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: מְטַלְטֶלְךָ טַלְטֵלָה
  choice: está prestes a lançar você para longe com violência
  rationale: O pilpel de טלטל exprime sacudir ou arremessar com força, e o acusativo cognato intensifica a ação. A formulação também comunica a iminência do anúncio profético introduzido por הִנֵּה.
- source_word: גָּבֶר
  choice: ó homem
  rationale: Toma o substantivo como vocativo ou exclamação dirigida a Sebna, preservando o masculino singular sem enfatizar indevidamente a ideia de força.
- source_word: וְעֹטְךָ עָטֹה
  choice: e a envolver você bem apertado
  rationale: O verbo עטה indica envolver ou enrolar; a construção com infinitivo absoluto intensifica a ação, expressa naturalmente por “bem apertado”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: Preserva o nome pessoal no texto por transliteração, em vez de substituí-lo pelo título “SENHOR”.
- issue: Função sintática de גָּבֶר
  choice: 'vocativo: “ó homem”'
  alternative: 'predicativo ou caracterização: “homem forte”'
  rationale: O hebraico é compacto e difícil. O vocativo produz uma leitura coerente, mas a alternativa permanece indicada em nota para não eliminar a ambiguidade.
translation_notes:
  register: Português moderno, digno e de compreensão ampla, com boa legibilidade brasileira. “Veja” comunica ênfase de modo natural; “ó homem” mantém a solenidade do confronto profético. A repetição cognata hebraica foi vertida por um verbo forte e uma expressão adverbial intensificadora.
