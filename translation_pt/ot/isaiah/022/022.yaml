source:
  edition: WLC
  text: וְ/נָתַתִּ֛י מַפְתֵּ֥חַ בֵּית דָּוִ֖ד עַל שִׁכְמ֑/וֹ וּ/פָתַח֙ וְ/אֵ֣ין סֹגֵ֔ר וְ/סָגַ֖ר וְ/אֵ֥ין פֹּתֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/022.yaml
  text: And I will place the key of the house of David on his shoulder; he will open[a], and no one will shut; he will shut, and no one will open.
translation:
  language: pt
  text: Porei sobre o ombro dele a chave da casa de Davi; ele abrirá[a], e ninguém fechará; ele fechará, e ninguém abrirá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Essa imagem de abrir e fechar como expressão de autoridade incontestável é retomada em Apocalipse 3:7.
    reason: cross_reference
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Porei
  rationale: O verbo נָתַן pode significar “dar”, “pôr” ou “colocar”. Com “sobre o ombro”, “porei” expressa naturalmente o ato concreto de conferir a autoridade simbolizada pela chave.
- source_word: מַפְתֵּחַ
  choice: a chave
  rationale: O substantivo significa “chave”; o artigo definido é natural porque a expressão seguinte identifica essa chave específica como a da casa de Davi.
- source_word: בֵּית דָּוִד
  choice: da casa de Davi
  rationale: Mantém de perto a expressão hebraica e preserva suas dimensões dinástica e administrativa sem acrescentar interpretação ao texto.
- source_word: עַל שִׁכְמוֹ
  choice: sobre o ombro dele
  rationale: Reproduz o sentido concreto do hebraico em português claro. A possível alusão a uma insígnia de autoridade não é explicitada no texto.
- source_word: וּפָתַח
  choice: ele abrirá
  rationale: O verbo prossegue a sequência resultante da promessa divina e descreve a autoridade efetiva do homem mencionado no contexto.
- source_word: וְאֵין סֹגֵר
  choice: e ninguém fechará
  rationale: A construção hebraica indica que não haverá quem possa reverter sua ação; a formulação é idiomática e conserva a força da declaração.
- source_word: וְסָגַר
  choice: ele fechará
  rationale: Mantém o paralelismo equilibrado com “ele abrirá” e a força retórica do hebraico.
- source_word: וְאֵין פֹּתֵחַ
  choice: e ninguém abrirá
  rationale: Espelha a oração anterior e comunica que ninguém poderá desfazer o que ele fechar.
theological_decisions:
- issue: Tornar explícita no texto principal uma interpretação messiânica ou a alusão do Novo Testamento
  choice: Manter o versículo em seu nível histórico-literário imediato, sem inserir uma interpretação messiânica explícita.
  alternative: Empregar uma formulação que destaque sua aplicação posterior em Apocalipse 3:7 ou ampliar “casa de Davi” para “casa real de Davi”.
  rationale: Em Isaías, o versículo fala diretamente de autoridade delegada ligada à casa de Davi. Apocalipse retoma essa linguagem, mas essa ressonância canônica deve ser indicada em nota, não incorporada à tradução do texto hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura paralela e solene do hebraico foi preservada sem arcaísmos. O pronome “dele” evita a possível leitura reflexiva de “seu ombro” e mantém clara a referência ao homem mencionado no contexto.
