  text: וַ/הֲדַפְתִּ֖י/ךָ מִ/מַּצָּבֶ֑/ךָ וּ/מִ/מַּעֲמָֽדְ/ךָ֖ יֶהֶרְסֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/019.yaml
  text: And I will thrust you from your office[a], and he will pull you down from your station.
translation:
  language: pt
  text: Eu o expulsarei do seu cargo, e ele o derrubará da sua posição.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico muda de “Eu o expulsarei” para “ele o derrubará”. Algumas traduções uniformizam a segunda oração como “eu o derrubarei”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַהֲדַפְתִּיךָ
  choice: Eu o expulsarei
  rationale: O verbo הדף expressa a ideia de empurrar ou afastar com força. “Expulsarei” comunica com naturalidade a remoção forçada e mantém o sentido futuro do discurso profético.
- source_word: מִמַּצָּבֶךָ
  choice: do seu cargo
  rationale: מַצָּב pode indicar lugar, posto ou posição oficial. No contexto da destituição de Sebna, “cargo” expressa claramente sua função de autoridade.
- source_word: וּמִמַּעֲמָדְךָ
  choice: da sua posição
  rationale: מַעֲמָד designa lugar, posição ou condição de alguém. “Posição” preserva o paralelismo com “cargo” sem sugerir apenas um local físico.
- source_word: יֶהֶרְסֶךָ
  choice: ele o derrubará
  rationale: הרס significa derrubar, demolir ou destruir. Aplicado a uma pessoa em posição de autoridade, “derrubará” conserva a imagem de queda e comunica sua destituição. O sujeito masculino singular da forma hebraica é preservado como “ele”.
theological_decisions:
- issue: Mudança de sujeito na segunda oração
  choice: Preservar a passagem da primeira pessoa (“Eu o expulsarei”) para a terceira pessoa masculina singular (“ele o derrubará”).
  alternative: 'Uniformizar as duas orações na primeira pessoa: “Eu o expulsarei... e o derrubarei”; ou empregar a voz passiva: “você será derrubado”.'
  rationale: O Texto Massorético apresenta uma mudança real de pessoa verbal. Mantê-la torna a tradução transparente e não decide se “ele” se refere a Deus com uma mudança de pessoa ou a outro agente não identificado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção natural para leitores brasileiros. O tratamento pronominal usa “o/seu”, e a mudança incomum de sujeito do hebraico é mantida e explicada em nota.
