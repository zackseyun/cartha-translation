translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O vocativo poético e o paralelismo foram preservados; a repetição de “cidade” evita introduzir uma distinção de tamanho ausente entre os sinônimos hebraicos.
