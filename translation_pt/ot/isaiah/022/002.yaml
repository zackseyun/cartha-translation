base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/002.yaml
  text: O city full of shouting[a], tumultuous city, exultant town—your slain are not slain by the sword, nor dead in battle.
translation:
  language: pt
  text: Ó cidade cheia de clamores[a], cidade agitada, cidade exultante! Os teus mortos não foram mortos pela espada, nem pereceram em batalha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cheia de alarido”; as expressões hebraicas se acumulam para retratar uma cidade marcada por uma agitação ruidosa e festiva.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשֻׁאוֹת
  choice: clamores
  rationale: O substantivo indica ruído forte, alarido ou tumulto. “Clamores” preserva a ideia de vozes altas e permite que a nota registre outras nuances possíveis.
- source_word: מְלֵאָה
  choice: cheia de
  rationale: Expressão predicativa natural em português, mantendo a imagem da cidade caracterizada pelo barulho.
- source_word: עִיר
  choice: cidade
  rationale: Equivalente comum de עִיר e adequado ao tratamento direto dirigido a Jerusalém.
- source_word: הוֹמִיָּה
  choice: agitada
  rationale: O termo descreve uma cidade ruidosa e em alvoroço. “Agitada” é corrente e digna, sem restringir o sentido apenas ao volume sonoro.
- source_word: קִרְיָה
  choice: cidade
  rationale: Sinônimo poético de עִיר. A repetição de “cidade” soa natural em português e conserva o paralelismo urbano sem sugerir uma localidade menor.
- source_word: עַלִּיזָה
  choice: exultante
  rationale: Transmite alegria exuberante e mantém o tom elevado da poesia profética.
- source_word: חֲלָלַיִךְ
  choice: os seus mortos
  rationale: No contexto, refere-se aos que foram abatidos e morreram. “Mortos” é claro e permite reproduzir a negação das causas militares que segue.
- source_word: חַלְלֵי חֶרֶב
  choice: mortos à espada
  rationale: Expressão concisa e tradicionalmente inteligível para os mortos por violência armada, próxima da construção hebraica.
- source_word: מֵתֵי מִלְחָמָה
  choice: morreram na batalha
  rationale: Formulação verbal natural em português que comunica que essas mortes não ocorreram em combate.
