  text: כֹּ֥ה אָמַ֛ר אֲדֹנָ֥/י יְהוִ֖ה צְבָא֑וֹת לֶךְ בֹּא֙ אֶל הַ/סֹּכֵ֣ן הַ/זֶּ֔ה עַל שֶׁבְנָ֖א אֲשֶׁ֥ר עַל הַ/בָּֽיִת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/015.yaml
  text: 'Thus says the Lord Yahweh of hosts: Go[a], come to this steward, to Shebna[b], who is over the house:'
translation:
  language: pt
  text: 'Assim diz o Senhor Yahweh dos Exércitos: “Vá, apresente-se[a] a esse administrador, a Sebna, que está encarregado do palácio[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Vá, venha”. Os dois imperativos podem funcionar juntos com o sentido de ir até alguém ou apresentar-se a essa pessoa.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “que está sobre a casa”, título de um alto funcionário encarregado da administração do palácio real.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula profética de mensageiro e sua cadência solene.
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: o Senhor Yahweh dos Exércitos
  rationale: Mantém tanto o título אֲדֹנָי quanto o nome divino YHWH; “dos Exércitos” é a forma portuguesa tradicional e suficientemente ampla para צְבָאוֹת.
- source_word: לֶךְ בֹּא
  choice: Vá, apresente-se
  rationale: Representa os dois imperativos sem produzir o pouco natural “vá, venha”; no contexto, בּוֹא אֶל indica dirigir-se ao oficial e comparecer diante dele.
- source_word: הַסֹּכֵן הַזֶּה
  choice: esse administrador
  rationale: “Administrador” comunica de modo atual a função oficial de סֹכֵן; “esse” conserva a referência demonstrativa e pode carregar o tom depreciativo do contexto.
- source_word: עַל שֶׁבְנָא
  choice: a Sebna
  rationale: Identifica em aposição o administrador mencionado, em vez de atribuir necessariamente sentido hostil à preposição עַל.
- source_word: אֲשֶׁר עַל הַבָּיִת
  choice: que está encarregado do palácio
  rationale: 'Traduz o idiomatismo literal “que está sobre a casa” pela função histórica pretendida: a chefia da administração palaciana.'
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A forma escolhida distingue o título אֲדֹנָי do nome próprio YHWH e torna explícito o nome divino presente no hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A fórmula profética permanece solene; a sequência imperativa foi naturalizada sem ocultar a forma literal, registrada em nota.
