base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/001.yaml
  text: 'An oracle concerning the Valley of Vision: What is the matter with you now[a], that all of you have gone up to the rooftops?'
translation:
  language: pt
  text: 'Oráculo sobre o Vale da Visão[a]: O que houve com você, então, que todos subiram aos terraços?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Vale da Visão” é provavelmente uma designação poética de Jerusalém, embora o próprio versículo não a identifique explicitamente.
    reason: cross_reference
lexical_decisions:
- source_word: מַשָּׂא
  choice: Pronunciamento
  rationale: Em títulos proféticos, o termo introduz uma declaração profética. “Pronunciamento” é atual e digno, sem impor o sentido literal e potencialmente enganoso de “peso”.
- source_word: גֵּיא חִזָּיוֹן
  choice: Vale da Visão
  rationale: Reproduz diretamente a cadeia construta “vale de visão” e mantém a expressão como designação poética, sem identificar seu referente no texto principal.
- source_word: מַה לָּךְ אֵפוֹא
  choice: O que está acontecendo com você agora
  rationale: Expressa naturalmente a pergunta idiomática sobre o que se passa com a cidade personificada; “agora” preserva a ênfase retórica de אֵפוֹא.
- source_word: כִּי
  choice: para que
  rationale: Introduz a situação que motiva a pergunta. Em português, “para que” comunica aqui o resultado ou circunstância observada, sem afirmar uma causa não explicitada.
- source_word: עָלִית כֻּלָּךְ
  choice: todos tenham subido
  rationale: A forma verbal e o sufixo femininos singulares dirigem-se à cidade personificada, enquanto כֻּלָּךְ abrange coletivamente seus habitantes. A construção portuguesa torna esse sentido coletivo natural.
- source_word: לַגַּגּוֹת
  choice: aos terraços
  rationale: As coberturas planas das casas eram espaços acessíveis; “terraços” comunica essa realidade com naturalidade em português amplo.
theological_decisions:
- issue: Referente de “Vale da Visão”
  choice: Manter a designação literal no texto e indicar apenas em nota sua provável referência a Jerusalém
  alternative: Identificar diretamente o lugar como Jerusalém ou como um vale específico ligado à cidade
  rationale: O hebraico não identifica explicitamente o referente neste versículo. A tradução preserva essa abertura e evita transformar uma conclusão interpretativa provável em afirmação textual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A cidade é tratada no singular por personificação, mas “todos” explicita que a pergunta abrange seus habitantes. “Terraços” foi preferido a “telhados” para representar coberturas planas acessíveis.
