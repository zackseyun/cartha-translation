revisions:
- from: 'Pronunciamento acerca do Vale da Visão: O que está acontecendo com você agora, para que todos tenham subido aos terraços?[a]'
  to: 'Oráculo sobre o Vale da Visão[a]: O que houve com você, então, que todos subiram aos terraços?'
  rationale: A revisão substitui a construção final “para que ... tenham subido” por uma oração explicativa compatível com כִּי e com o perfeito hebraico. Também adota “Oráculo”, termo mais adequado ao uso de מַשָּׂא em títulos proféticos, e reposiciona a chamada da nota junto à expressão que ela esclarece. A identificação de Jerusalém permanece apenas como possibilidade em nota.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:30:09Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a designação não identificada “Vale da Visão”, a interpelação à cidade personificada, o coletivo de seus habitantes e o movimento para os telhados. Contudo, “para que” atribui com facilidade uma noção de finalidade ao כִּי, que aqui introduz a situação que explica a pergunta.
  naturalness: “O que está acontecendo com você agora” é compreensível, mas “O que houve com você, então” reproduz de modo mais idiomático e conciso a pergunta hebraica. “Oráculo” é o equivalente mais estabelecido e claro para מַשָּׂא em um cabeçalho profético.
  terminology: “Oráculo” para מַשָּׂא e “Vale da Visão” para גֵּיא חִזָּיוֹן mantêm o registro profético e a ambiguidade do referente. “Terraços” comunica bem os tetos planos e acessíveis no contexto antigo.
  issues:
  - severity: medium
    issue: “para que todos tenham subido” para כִּי
    rationale: Em português, “para que” normalmente exprime finalidade e exige uma leitura final que o hebraico não requer. A conjunção aqui introduz o fato/situação que motiva a pergunta; “que todos subiram” preserva isso sem acréscimo semântico.
  - severity: low
    issue: “Pronunciamento” para מַשָּׂא
    rationale: É possível, mas “oráculo” é mais preciso e reconhecível como fórmula de cabeçalho profético, sem recuperar o sentido literal inadequado de “peso”.
  - severity: low
    issue: Posição da chamada de nota
    rationale: A nota explica especificamente “Vale da Visão”; colocar a chamada logo após a expressão torna seu escopo imediato e inequívoco.
