base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/020.yaml
  text: And it shall happen on that day that I will call my servant Eliakim son of Hilkiah,[a]
translation:
  language: pt
  text: Naquele dia, acontecerá que chamarei o meu servo Eliaquim, filho de Hilquias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «convocarei». O verbo hebraico pode indicar chamar alguém para uma nomeação ou missão.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: A fórmula hebraica introduz um acontecimento futuro no contexto profético. Em português, «Naquele dia» expressa naturalmente a referência temporal; o futuro de «chamarei» deixa claro que o acontecimento ainda ocorrerá, sem exigir uma construção mais pesada como «E acontecerá naquele dia».
- source_word: וְקָרָאתִי
  choice: chamarei
  rationale: O verbo קרא com ל pode significar chamar ou convocar alguém. «Chamarei» é direto e conserva a amplitude do hebraico, enquanto a nota registra a alternativa contextual «convocarei».
- source_word: לְעַבְדִּי
  choice: o meu servo
  rationale: Embora עבד também possa designar um escravo, neste contexto de designação e comissão divina «servo» comunica melhor a função de Eliaquim sem acentuar indevidamente a condição social de escravidão.
- source_word: אֶלְיָקִים
  choice: Eliaquim
  rationale: Forma tradicional e amplamente reconhecível do nome hebraico em português.
- source_word: בֶּן חִלְקִיָּהוּ
  choice: filho de Hilquias
  rationale: Tradução natural do patronímico hebraico, usando a forma tradicional portuguesa do nome.
theological_decisions:
- issue: Designação divina de Eliaquim
  choice: o meu servo
  alternative: o meu escravo
  rationale: A expressão apresenta Eliaquim como pertencente ao serviço de Deus e por ele comissionado. A tradução não introduz leituras messiânicas ou tipológicas posteriores, nem enfatiza uma condição social que não está em primeiro plano no contexto.
translation_notes:
  register: Português moderno, claro e digno, de leitura natural no Brasil e compreensível internacionalmente. A formulação concisa reproduz o fluxo profético sem arcaísmos; os nomes seguem formas bíblicas portuguesas consolidadas.
