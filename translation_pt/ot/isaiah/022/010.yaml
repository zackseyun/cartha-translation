  text: וְ/אֶת בָּתֵּ֥י יְרוּשָׁלִַ֖ם סְפַרְתֶּ֑ם וַ/תִּתְֿצוּ֙ הַ/בָּ֣תִּ֔ים לְ/בַצֵּ֖ר הַ/חוֹמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/010.yaml
  text: And you counted the houses of Jerusalem[b][a], and you tore down the houses to fortify the wall.
translation:
  language: pt
  text: Vocês contaram as casas de Jerusalém e derrubaram as casas para fortificar a muralha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֶת בָּתֵּי יְרוּשָׁלִַם
  choice: Vocês contaram as casas de Jerusalém
  rationale: O objeto aparece antecipado no hebraico, mas a ordem direta é mais natural em português. אֵת não recebe tradução própria, e וְ é adequadamente representado pela ligação com o contexto e pelo segundo «e» da sequência.
- source_word: סְפַרְתֶּם
  choice: contaram
  rationale: O Qal de ספר significa contar ou numerar. «Contaram» é direto, corrente e preserva a ideia de fazer o levantamento das casas.
- source_word: וַ/תִּתְֿצוּ
  choice: e derrubaram
  rationale: נתץ indica pôr abaixo ou demolir uma construção. «Derrubaram» é natural, vívido e apropriado ao contexto de obras defensivas.
- source_word: הַ/בָּתִּים
  choice: algumas delas
  rationale: O hebraico repete «as casas», mas, após a referência ao conjunto das casas de Jerusalém, o contexto indica as casas selecionadas para demolição. «Algumas delas» evita sugerir que todas foram derrubadas e mantém referência clara ao conjunto contado.
- source_word: לְ/בַצֵּר הַ/חוֹמָה
  choice: para fortificar a muralha
  rationale: בצר expressa tornar forte ou fortificado; «fortificar» preserva a finalidade militar. «Muralha» é o termo português mais natural para a parede defensiva de uma cidade.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com plural explícito «vocês» para a segunda pessoa masculina plural. A formulação mantém a sequência das ações e o contexto de preparação defensiva, sem acrescentar uma avaliação teológica.
