translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “foram capturados” e “juntos” acompanha deliberadamente a repetição hebraica. As notas preservam a ambiguidade de מִקֶּשֶׁת e da oração final.
