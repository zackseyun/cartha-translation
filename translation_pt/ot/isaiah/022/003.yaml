base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/003.yaml
  text: All your rulers have fled together[a]; they were captured without the bow. All of your fugitives who were found were captured together[b]; they had fled far away.
translation:
  language: pt
  text: Todos os seus líderes fugiram juntos; sem o uso do arco, foram capturados.[a] Todos os seus que foram encontrados foram capturados juntos; eles haviam fugido para longe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “foram amarrados do arco”. A preposição também pode ter sentido privativo, “sem o arco”. O sentido pode ser que foram capturados sem que fosse necessário usar o arco ou enquanto estavam sem um arco nas mãos.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Todos os seus que foram encontrados foram amarrados juntos; fugiram de longe”. A sintaxe hebraica da oração final é condensada e permite mais de uma interpretação.'
    reason: alternative_reading
lexical_decisions:
- source_word: קְצִינַיִךְ
  choice: seus líderes
  rationale: קָצִין pode designar governante, oficial ou comandante. “Líderes” mantém a amplitude cívico-militar do termo sem especificar indevidamente a função.
- source_word: נָדְדוּ
  choice: fugiram
  rationale: Embora נדד também possa significar vaguear ou afastar-se, o contexto de fuga e captura favorece “fugiram”.
- source_word: יַחַד / יַחְדָּו
  choice: juntos
  rationale: Ambas as formas exprimem ação coletiva e são vertidas naturalmente por “juntos”.
- source_word: מִקֶּשֶׁת
  choice: sem o uso do arco
  rationale: A preposição מִן pode ter aqui sentido privativo ou de separação. A formulação indica captura sem recurso à luta com arco, preservando em nota a ambiguidade do hebraico.
- source_word: אֻסָּרוּ / אֻסְּרוּ
  choice: foram capturados
  rationale: אָסַר significa literalmente amarrar; no contexto militar, o passivo descreve pessoas presas ou feitas prisioneiras. “Foram capturados” comunica esse sentido com clareza.
- source_word: נִמְצָאַיִךְ
  choice: os seus que foram encontrados
  rationale: A forma significa literalmente “os teus que foram encontrados”. A tradução conserva o referente indeterminado, sem acrescentar “homens” ou “fugitivos”, termos não expressos neste sintagma.
- source_word: מֵרָחוֹק בָּרָחוּ
  choice: haviam fugido para longe
  rationale: בָּרַח significa fugir, e מֵרָחוֹק exprime distância. O mais-que-perfeito esclarece que a fuga precedeu a captura, enquanto “para longe” oferece uma leitura contextual natural.
