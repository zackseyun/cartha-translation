lexical_decisions:
- source_word: עֵילָם
  choice: Elão
  rationale: Forma portuguesa tradicional e reconhecível do nome do povo ou território.
- source_word: נָשָׂא
  choice: levou
  rationale: Expressa naturalmente, em contexto militar, o ato de portar ou levar equipamento para a batalha.
- source_word: אַשְׁפָּה
  choice: a aljava
  rationale: Designa o estojo em que se carregam flechas.
- source_word: בְּרֶכֶב אָדָם פָּרָשִׁים
  choice: com carros de guerra, homens e cavaleiros
  rationale: Mantém a enumeração militar compacta e a presença de אָדָם, sem fixar excessivamente a relação sintática entre os termos.
- source_word: אָדָם
  choice: homens
  rationale: No contexto da enumeração de forças militares, refere-se naturalmente a combatentes humanos.
- source_word: פָּרָשִׁים
  choice: cavaleiros
  rationale: Corresponde aos guerreiros montados; é mais formalmente próximo do hebraico que o coletivo 'cavalaria'.
- source_word: קִיר
  choice: Quir
  rationale: Forma portuguesa convencional do nome próprio.
- source_word: עֵרָה
  choice: deixou descoberto
  rationale: Preserva a imagem lexical de descobrir ou desnudar, provavelmente em referência à preparação para o combate.
- source_word: מָגֵן
  choice: o escudo
  rationale: Mantém o singular representativo ou coletivo da descrição militar hebraica.
