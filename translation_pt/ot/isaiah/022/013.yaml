base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/013.yaml
  text: 'And behold[a], joy and gladness, killing cattle and slaughtering sheep, eating meat and drinking wine: “Let us eat and drink, for tomorrow we die.”'
translation:
  language: pt
  text: 'E eis: alegria e contentamento, matando bois e abatendo ovelhas, comendo carne e bebendo vinho: “Vamos comer e beber, pois amanhã morreremos.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais literal, “Comer e beber”, preservando a forma breve, semelhante a um lema, do hebraico.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 'Mas vejam:'
  rationale: A conjunção pode assumir valor adversativo no contexto, em contraste com o chamado ao lamento no versículo anterior; “vejam” conserva a função vívida de chamar a atenção em português atual.
- source_word: שָׂשׂוֹן וְשִׂמְחָה
  choice: alegria e contentamento
  rationale: Mantém os dois termos semanticamente próximos e o caráter festivo da expressão, sem acrescentar condenação explícita.
- source_word: הָרֹג בָּקָר
  choice: matando bois
  rationale: Reproduz a atividade descrita pelo infinitivo absoluto e usa “bois” como equivalente concreto e natural de בָּקָר neste contexto de abate para alimento.
- source_word: וְשָׁחֹט צֹאן
  choice: abatendo ovelhas
  rationale: “Abatendo” expressa o abate de animais sem impor a ideia específica de sacrifício ritual; “ovelhas” é uma representação contextualmente adequada do coletivo צֹאן.
- source_word: אָכֹל בָּשָׂר וְשָׁתוֹת יָיִן
  choice: comendo carne e bebendo vinho
  rationale: Preserva a sequência paralela de ações e emprega equivalentes correntes no contexto alimentar.
- source_word: אָכוֹל וְשָׁתוֹ
  choice: Vamos comer e beber
  rationale: Os infinitivos absolutos têm aqui força exortativa e proverbial; esta formulação portuguesa se harmoniza com a primeira pessoa do plural em “morreremos”.
- source_word: כִּי מָחָר נָמוּת
  choice: pois amanhã morreremos
  rationale: Mantém a relação causal e o futuro implícito na forma hebraica, preservando a concisão fatalista do lema.
theological_decisions:
- issue: Se a tradução deve qualificar moralmente a celebração
  choice: Descrever as ações sem adjetivos condenatórios
  alternative: Acrescentar expressões como “festa pecaminosa” ou “celebração desenfreada”
  rationale: O texto descreve a reação do povo, enquanto a condenação profética decorre do contexto. Acrescentar qualificações resolveria interpretativamente algo que o versículo não explicita.
- issue: Valor da conjunção inicial וְ
  choice: “Mas”, refletindo o contraste contextual
  alternative: “E”, preservando apenas a coordenação formal
  rationale: Depois do chamado divino ao pranto em Isaías 22:12, o quadro de festa constitui contraste direto. “Mas” torna essa relação discursiva natural em português sem alterar o conteúdo da cena.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A enumeração mantém o ritmo da cena hebraica, e a fala final conserva seu tom breve e proverbial.
