base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/025.yaml
  text: On that day[a], declares Yahweh of hosts, the peg fastened in a secure place will give way, and it will be cut down and fall, and the load that was on it will be cut off[b], for Yahweh has spoken.
translation:
  language: pt
  text: Naquele dia, declara Yahweh dos Exércitos, a estaca[a] cravada em lugar firme cederá; será cortada e cairá, e a carga que estava sobre ela será cortada[b], pois Yahweh falou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o prego”.
    reason: lexical_alternative
  - marker: b
    text: “Carga” também pode ser traduzido por “peso” ou “fardo”; o hebraico se refere àquilo que a estaca sustentava.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: declara Yahweh dos Exércitos
  rationale: A fórmula profética נְאֻם é expressa naturalmente por “declara”. O nome divino é mantido como Yahweh, e צְבָאוֹת recebe a forma tradicional e semanticamente ampla “dos Exércitos”.
- source_word: תָּמוּשׁ
  choice: cederá
  rationale: O verbo מוּשׁ indica deslocar-se ou sair de sua posição. Aplicado a uma estaca que sustenta peso, “cederá” comunica de modo natural sua perda de firmeza.
- source_word: הַיָּתֵד
  choice: a estaca
  rationale: יָתֵד pode designar estaca, pino ou prego. “Estaca” preserva a imagem de algo cravado que suporta uma carga, sem limitar a referência a uma estaca de tenda.
- source_word: הַתְּקוּעָה
  choice: cravada
  rationale: O particípio passivo descreve a estaca como introduzida e fixada no lugar. “Cravada” reproduz com clareza essa imagem concreta.
- source_word: בְּמָקוֹם נֶאֱמָן
  choice: em lugar firme
  rationale: Neste contexto, נֶאֱמָן indica estabilidade e segurança, não fidelidade moral. “Lugar firme” combina naturalmente com a imagem da estaca.
- source_word: וְנִגְדְּעָה וְנָפְלָה
  choice: será cortada e cairá
  rationale: גדע descreve cortar ou decepar, e נפל, cair. A sequência direta conserva as etapas da imagem de juízo.
- source_word: וְנִכְרַת הַמַּשָּׂא אֲשֶׁר עָלֶיהָ
  choice: e a carga que estava sobre ela será eliminada
  rationale: מַשָּׂא é a carga ou peso sustentado pela estaca. נִכְרַת indica que ela será cortada, suprimida ou destruída; “será eliminada” comunica o resultado sem sugerir de modo estranho que uma carga material seja literalmente cortada.
- source_word: כִּי יְהוָה דִּבֵּר
  choice: pois Yahweh falou
  rationale: A frase encerra o oráculo afirmando a certeza da declaração divina. “Pois Yahweh falou” é direta, solene e fiel ao aspecto do hebraico.
theological_decisions:
- issue: Referente da imagem da estaca
  choice: Manter a metáfora sem identificar explicitamente seu referente.
  alternative: Identificar a estaca como Eliaquim, como a casa ou dinastia sustentada por ele, ou como uma reversão da imagem de estabilidade dos versículos anteriores.
  rationale: O próprio versículo não nomeia o referente. Preservar a imagem evita resolver na tradução uma tensão interpretativa que o hebraico deixa em aberto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A sintaxe mantém a progressão enfática do hebraico, enquanto o ponto e vírgula evita uma cadeia pesada de coordenações. Os marcadores foram colocados junto aos termos aos quais as notas realmente se referem.
