revisions:
- from: O que você tem aqui, e quem você tem aqui, para ter escavado aqui um túmulo para si, escavando no alto o túmulo dele, entalhando na rocha uma morada para ele mesmo?[a]
  to: O que você tem aqui, e quem você tem aqui, que você escavou aqui um túmulo para si, escavando no alto o túmulo dele, entalhando na rocha uma morada para si?[a]
  rationale: 'A revisão substitui uma construção portuguesa pouco natural por uma formulação acusatória idiomática para כי, sem decidir entre os possíveis matizes de fundamento, consequência ou explicação. Conserva-se a repetição de «aqui» e a mudança pronominal do hebraico: «o túmulo dele» e «para si» nas cláusulas participiais. A nota mantém uma alternativa alisada na segunda pessoa e explica o dado textual relevante.'
