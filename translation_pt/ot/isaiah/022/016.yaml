base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/016.yaml
  text: What do you have here[a], and whom do you have here, that you have cut out a tomb for yourself here, cutting out his tomb on the height, carving a dwelling for himself in the rock?
translation:
  language: pt
  text: O que você tem aqui, e quem você tem aqui, que você escavou aqui um túmulo para si, escavando no alto o túmulo dele, entalhando na rocha uma morada para si?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais fluido: “escavando no alto seu túmulo, entalhando na rocha uma morada para você mesmo”. O hebraico passa da segunda para a terceira pessoa nessas orações.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַה לְּךָ פֹה
  choice: O que você tem aqui
  rationale: Preserva a pergunta confrontadora e concisa sobre a ligação ou pretensão do destinatário nesse lugar, sem explicitar além do hebraico a ideia de direito.
- source_word: וּמִי לְךָ פֹה
  choice: e quem você tem aqui
  rationale: Mantém o paralelismo e a provável referência a vínculos familiares ou sociais, sem os especificar.
- source_word: כִּי
  choice: para ter
  rationale: Em português, introduz naturalmente a ação censurada como consequência ou fundamento das perguntas retóricas, sem fixar rigidamente uma única relação lógica.
- source_word: חָצַבְתָּ לְּךָ פֹּה קָבֶר
  choice: ter escavado aqui um túmulo para si
  rationale: Escavar comunica de modo corrente a abertura de um túmulo na pedra; “para si” conserva o valor reflexivo e o registro digno.
- source_word: חֹצְבִי מָרוֹם קִבְרוֹ
  choice: escavando no alto o túmulo dele
  rationale: O particípio retoma vividamente a ação; “no alto” expressa o local elevado, e “dele” conserva a mudança do hebraico para a terceira pessoa.
- source_word: חֹקְקִי בַסֶּלַע מִשְׁכָּן לוֹ
  choice: entalhando na rocha uma morada para ele mesmo
  rationale: “Entalhando” preserva a imagem de abrir ou talhar na rocha; “morada” mantém o sentido lexical e a ironia funerária de מִשְׁכָּן.
theological_decisions:
- issue: Mudança pronominal nas orações participiais
  choice: 'Conservar a passagem da segunda pessoa para a terceira pessoa: “o túmulo dele ... para ele mesmo”.'
  alternative: 'Harmonizar na segunda pessoa: “seu túmulo ... para você mesmo”.'
  rationale: O Texto Massorético muda da interpelação direta para sufixos de terceira pessoa. Preservar essa tensão dá prioridade à forma hebraica; a leitura portuguesa mais fluida é indicada em nota.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com formas de tratamento naturais à leitura brasileira. A repetição de “aqui” e a mudança pronominal foram mantidas por serem traços marcantes do hebraico.
