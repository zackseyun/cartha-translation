review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a repetição de «aqui», as perguntas confrontadoras, a imagem de um túmulo escavado na rocha e a mudança deliberada da segunda para a terceira pessoa nas orações participiais. Contudo, «para ter escavado» não exprime com naturalidade nem precisão a relação introduzida por כי neste contexto.
  naturalness: «Para ter escavado» é pouco idiomático após as perguntas retóricas e pode sugerir finalidade. A construção «que você escavou» é natural em português moderno e permite que a sequência funcione como acusação/fundamento, sem especificar excessivamente a relação semântica. «Para si» na última oração é mais sóbrio e natural que «para ele mesmo», mantendo a terceira pessoa.
  terminology: «Túmulo», «escavando», «entalhando», «rocha» e «morada» são escolhas adequadas. «Morada» conserva o valor de מִשְׁכָּן e sua provável ironia funerária, sem interpretá-la como termo técnico religioso.
  issues:
  - severity: medium
    issue: «para ter escavado» para כִּי
    rationale: A locução com infinitivo perfeito é sintaticamente possível, mas soa artificial e tende a comunicar finalidade ou uma justificação formulada de maneira imprecisa. O hebraico introduz a acusação que sustenta as perguntas; «que você escavou» reproduz isso com maior naturalidade e sem estreitar indevidamente a ambiguidade.
  - severity: low
    issue: «para ele mesmo»
    rationale: Embora compreensível, a forma é mais pesada do que o necessário. «Para si» mantém o referente de terceira pessoa, o valor reflexivo e um registro mais fluente.
  revised_text: O que você tem aqui, e quem você tem aqui, que você escavou aqui um túmulo para si, escavando no alto o túmulo dele, entalhando na rocha uma morada para si?[a]
  revised_footnotes:
