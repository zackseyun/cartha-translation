  text: צָנ֤וֹף יִצְנָפְ/ךָ֙ צְנֵפָ֔ה כַּדּ֕וּר אֶל אֶ֖רֶץ רַחֲבַ֣ת יָדָ֑יִם שָׁ֣מָּ/ה תָמ֗וּת וְ/שָׁ֨מָּ/ה֙ מַרְכְּב֣וֹת כְּבוֹדֶ֔/ךָ קְל֖וֹן בֵּ֥ית אֲדֹנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/018.yaml
  text: He will surely wrap you up tightly[a], like a ball, into a broad land. There you will die, and there will be the chariots of your glory[c][b], O shame of your master's house.
translation:
  language: pt
  text: Ele o enrolará firmemente[a], como uma bola, para uma terra espaçosa[b]. Ali você morrerá, e ali estarão os carros de guerra da sua glória[c], ó vergonha da casa do seu senhor!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “enrolará você bem apertado” ou “envolverá você firmemente”. O hebraico enfatiza a ação mediante uma forma intensificadora do verbo e um substantivo da mesma raiz.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “uma terra larga de mãos”, expressão idiomática que significa uma terra ampla ou espaçosa.
    reason: cultural_note
  - marker: c
    text: Ou “os seus gloriosos carros de guerra” ou “os carros de guerra que eram a sua glória”. A expressão hebraica pode se referir aos carros de guerra dos quais ele se orgulhava.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָנוֹף יִצְנָפְךָ צְנֵפָה
  choice: Ele certamente enrolará você bem apertado
  rationale: O infinitivo absoluto seguido do imperfeito da mesma raiz intensifica a ação, enquanto o substantivo cognato reforça a imagem de algo enrolado ou envolvido firmemente. “Certamente” e “bem apertado” comunicam essa ênfase sem especificar indevidamente um turbante ou uma peça de roupa.
- source_word: כַּדּוּר
  choice: como uma bola
  rationale: A comparação apresenta o destinatário como um objeto arredondado, firmemente enrolado. “Bola” é a expressão portuguesa mais clara e natural.
- source_word: אֶל אֶרֶץ רַחֲבַת יָדָיִם
  choice: para uma terra espaçosa
  rationale: A expressão literalmente diz “para uma terra larga de mãos”, um idiomatismo que indica grande extensão. “Terra espaçosa” transmite o sentido sem reproduzir uma formulação opaca em português.
- source_word: שָׁמָּה ... וְשָׁמָּה
  choice: Ali ... e ali
  rationale: A repetição do advérbio no hebraico dá ênfase ao lugar do exílio, da morte e dos carros; por isso, foi preservada.
- source_word: תָמוּת
  choice: você morrerá
  rationale: O futuro direto conserva a força pessoal da denúncia profética dirigida ao oficial.
- source_word: מַרְכְּבוֹת כְּבוֹדֶךָ
  choice: os carros da sua glória
  rationale: A cadeia construta é condensada e pode indicar carros gloriosos ou carros nos quais o destinatário se gloriava. A formulação mais próxima do hebraico conserva essa abertura, esclarecida em nota.
- source_word: קְלוֹן בֵּית אֲדֹנֶיךָ
  choice: ó vergonha da casa do seu senhor
  rationale: A expressão funciona como aposto vocativo de denúncia. “Senhor” designa aqui o superior humano do oficial, e a inicial minúscula evita confundi-lo com um título divino.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com legibilidade brasileira. A repetição “Ali... e ali” e a denúncia vocativa foram mantidas por sua força retórica. Evitou-se acrescentar um verbo explícito como “lançar”, ausente no hebraico, embora a direção para a terra distante esteja clara.
