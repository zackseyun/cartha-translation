  - severity: medium
    issue: “expiada por vocês” é ambíguo em português
    rationale: Embora reflita literalmente o dativo לָכֶם, “por vocês” pode ser entendido como agente da expiação. “Em favor de vocês” preserva a relação de benefício/destinação sem alterar a ambiguidade temporal da sentença.
