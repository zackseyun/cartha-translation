base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/014.yaml
  text: 'And the LORD of Armies has revealed in my ears: “Surely this iniquity will not be atoned for you until you die,” says the Lord GOD of Armies.'
translation:
  language: pt
  text: 'E o SENHOR dos Exércitos revelou aos meus ouvidos: “Esta culpa certamente não será expiada em favor de vocês até que morram”, diz o Senhor, o SENHOR dos Exércitos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִגְלָה בְאָזְנָי
  choice: E isto foi revelado aos meus ouvidos
  rationale: Preserva a imagem hebraica de uma revelação recebida auditivamente, em formulação clara e digna.
- source_word: יְהוָה צְבָאוֹת
  choice: SENHOR dos Exércitos
  rationale: Segue a convenção portuguesa de representar o nome divino por SENHOR e traduz צְבָאוֹת de modo tradicional e reconhecível.
- source_word: אִם יְכֻפַּר
  choice: certamente não será expiada
  rationale: A partícula אִם integra aqui uma fórmula enfática de juramento com sentido negativo; a voz passiva do hebraico é mantida.
- source_word: הֶעָוֹן הַזֶּה
  choice: esta culpa
  rationale: עָוֹן pode indicar tanto a iniquidade quanto a culpa dela resultante; 'culpa' se ajusta naturalmente ao verbo 'expiar' sem eliminar a dimensão moral.
- source_word: לָכֶם
  choice: por vocês
  rationale: Torna explícita a relação expressa pelo dativo hebraico plural no contexto da expiação.
- source_word: עַד תְּמֻתוּן
  choice: até que morram
  rationale: Reproduz o limite temporal e conserva o destinatário plural.
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: o Senhor, o SENHOR dos Exércitos
  rationale: Distingue אֲדֹנָי ('Senhor') do tetragrama representado por SENHOR, preservando ambos os títulos do texto hebraico.
theological_decisions:
- issue: Possibilidade de expiação e força da sentença
  choice: “certamente não será expiada por vocês até que morram”
  alternative: “jamais será expiada” ou “não será expiada antes que vocês morram”
  rationale: Mantém a fórmula enfática de juramento e o limite temporal literal sem decidir além do hebraico se a morte é apenas o termo da sentença ou se implica alguma possibilidade posterior.
- issue: Sentido de עָוֹן
  choice: culpa
  alternative: iniquidade
  rationale: A escolha destaca a responsabilidade passível de expiação, mas não transforma o termo em uma formulação doutrinária técnica.
translation_notes:
  register: Português moderno, solene e acessível, com boa legibilidade brasileira. Mantiveram-se a metáfora auditiva, os destinatários no plural e a distinção gráfica entre Senhor e SENHOR.
