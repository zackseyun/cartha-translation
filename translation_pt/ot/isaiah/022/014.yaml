  source_fidelity: A sentença de não expiação, o plural dos destinatários e o limite temporal foram corretamente compreendidos. Contudo, “isto” não possui correspondente explícito no hebraico, e “por vocês” pode sugerir em português que os destinatários realizam a expiação, enquanto לָכֶם indica mais precisamente benefício/destinação.
  naturalness: A construção passiva com “isto foi revelado aos meus ouvidos pelo...” é compreensível, mas é menos direta e introduz um demonstrativo sem antecedente. A formulação revista é mais fluente em português moderno e conserva a imagem auditiva.
  terminology: “SENHOR dos Exércitos”, “culpa”, “expiada” e a distinção entre “Senhor” e “SENHOR” representam adequadamente os termos hebraicos e preservam o registro solene.
