  text: וַ/יְהִ֥י מִבְחַר עֲמָקַ֖יִ/ךְ מָ֣לְאוּ רָ֑כֶב וְ/הַ/פָּ֣רָשִׁ֔ים שֹׁ֖ת שָׁ֥תוּ הַ/שָּֽׁעְרָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/007.yaml
  text: And your choicest valleys were filled with chariots[a], and the horsemen took their positions at the gate.
translation:
  language: pt
  text: E os seus melhores vales ficaram cheios de carros de guerra, e os cavaleiros tomaram posição[a] junto ao portão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se posicionaram em direção ao portão”. O hebraico emprega um infinitivo absoluto com um verbo finito para dar ênfase; a terminação direcional também pode indicar movimento rumo ao portão.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְחַר
  choice: melhores
  rationale: O substantivo em construção com “vales” indica aquilo que é seleto ou de melhor qualidade; “melhores” comunica naturalmente esse valor superlativo.
- source_word: עֲמָקַיִךְ
  choice: seus vales
  rationale: Mantém o plural e o sufixo de segunda pessoa feminina singular, dirigido à cidade personificada.
- source_word: מָלְאוּ רָכֶב
  choice: ficaram cheios de carros de guerra
  rationale: רֶכֶב é coletivo e designa as forças de carros; o plural explícito em português é claro, e “de guerra” evita a possível leitura de veículos comuns modernos.
- source_word: הַפָּרָשִׁים
  choice: os cavaleiros
  rationale: Designa tropas montadas; “cavaleiros” é claro, digno e adequado ao cenário militar.
- source_word: שֹׁת שָׁתוּ
  choice: tomaram posição
  rationale: A combinação do infinitivo absoluto com o verbo finito de שׁית dá ênfase ao posicionamento deliberado; a expressão portuguesa preserva o sentido militar de modo idiomático.
- source_word: הַשָּׁעְרָה
  choice: junto à porta
  rationale: O ה direcional pode sugerir movimento rumo à porta, mas, com o verbo enfático de posicionamento, o contexto favorece a ideia de implantação junto à porta; a nota conserva a alternativa.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. “Carros de guerra” explicita o referente militar antigo; “vales” preserva a forma poética sem soar arcaica.
