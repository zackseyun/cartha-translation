base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/021.yaml
  text: I will clothe him with your tunic[a], and I will fasten your sash on him; I will place your authority into his hand, and he will become a father to the inhabitants of Jerusalem and to the house of Judah.
translation:
  language: pt
  text: Eu o vestirei com a sua túnica e prenderei em volta dele a sua faixa. Entregarei a sua autoridade nas mãos dele, e ele se tornará um pai[a] para os habitantes de Jerusalém e para a casa de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “será um pai”. A metáfora hebraica indica liderança protetora e responsável, não paternidade biológica.
    reason: Alternativa de tradução e esclarecimento da metáfora.
lexical_decisions:
- source_word: וְהִלְבַּשְׁתִּיו
  choice: Eu o vestirei
  rationale: O hifil de לבש com sufixo masculino singular indica fazer alguém vestir-se. A formulação é natural em português e mantém o tom de investidura.
- source_word: כֻּתָּנְתֶּךָ
  choice: com a sua túnica
  rationale: כֻּתֹּנֶת designa uma peça de roupa semelhante a uma túnica; “túnica” é preciso, acessível e apropriado ao contexto de vestes oficiais.
- source_word: וְאַבְנֵטְךָ אֲחַזְּקֶנּוּ
  choice: e prenderei nele a sua faixa
  rationale: אַבְנֵט é uma faixa ou cinturão ligado ao traje oficial. Neste contexto, o piel de חזק comunica a ideia de firmá-la ou prendê-la no novo ocupante do cargo.
- source_word: וּמֶמְשֶׁלְתְּךָ אֶתֵּן בְּיָדוֹ
  choice: Entregarei a sua autoridade nas mãos dele
  rationale: מֶמְשָׁלָה é autoridade governante. “Entregarei ... nas mãos dele” conserva a imagem hebraica de confiar poder e responsabilidade, com expressão corrente em português.
- source_word: וְהָיָה לְאָב
  choice: ele se tornará um pai
  rationale: A construção descreve o novo status resultante da nomeação e preserva diretamente a metáfora hebraica de liderança protetora e responsável.
- source_word: לְיוֹשֵׁב יְרוּשָׁלִַם
  choice: para os habitantes de Jerusalém
  rationale: O particípio singular tem sentido coletivo; o plural em português transmite esse valor de modo claro e idiomático.
- source_word: וּלְבֵית יְהוּדָה
  choice: e para a casa de Judá
  rationale: “Casa de Judá” preserva a expressão nacional e familiar do hebraico, sem reduzi-la apenas ao território.
theological_decisions:
- issue: Uso metafórico de “pai” para uma autoridade política
  choice: ele se tornará um pai
  alternative: ele será como um pai; ele será um protetor
  rationale: O hebraico apresenta uma metáfora direta, não uma comparação explícita. Mantê-la preserva a imagem de cuidado e liderança responsável sem lhe impor sentidos doutrinários posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A segunda pessoa referida por “sua” é determinada pelo contexto imediato; a repetição evita formas excessivamente arcaicas. O marcador da nota foi colocado após “pai”, termo ao qual a nota efetivamente se refere.
