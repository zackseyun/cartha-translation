id: ISA.22.8
reference: Isaiah 22:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְגַ֕ל אֵ֖ת מָסַ֣ךְ יְהוּדָ֑ה וַ/תַּבֵּט֙ בַּ/יּ֣וֹם הַ/ה֔וּא אֶל נֶ֖שֶׁק בֵּ֥ית הַ/יָּֽעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/008.yaml
  text: And he removed the covering of Judah[b][a], and on that day you looked to the weapons of the House of the Forest.
translation:
  language: pt
  text: Ele retirou a cobertura de Judá[a], e, naquele dia, você olhou para as armas da Casa da Floresta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a defesa de Judá” ou “a proteção de Judá”. O hebraico diz literalmente “a cobertura de Judá”, empregando uma metáfora para aquilo que a abrigava ou protegia.
    reason: lexical_alternative
  - marker: b
    text: A “Casa da Floresta” provavelmente era o arsenal real ou o palácio chamado em outros textos de “Casa da Floresta do Líbano”.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְגַל
  choice: Ele retirou
  rationale: O hifil de גלה expressa aqui a ação causativa de retirar ou descobrir algo. “Retirou” combina naturalmente com “cobertura” e mantém o sujeito masculino singular expresso pelo hebraico, sem identificá-lo além do que o versículo diz.
- source_word: מָסַךְ
  choice: cobertura
  rationale: O substantivo pode designar cobertura, cortina ou anteparo. “Cobertura” conserva a metáfora concreta do hebraico; o possível sentido de defesa ou proteção é indicado em nota.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma portuguesa consagrada do nome do território e do povo.
- source_word: וַתַּבֵּט ... אֶל
  choice: você olhou para
  rationale: A construção indica dirigir o olhar para algo. O singular é preservado por “você”, adequado à leitura de Judá ou Jerusalém como interlocutor personificado e amplamente compreensível no português moderno.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Expressão temporal idiomática e natural em português, que mantém a referência profética.
- source_word: נֶשֶׁק
  choice: armas
  rationale: O termo se refere a armamentos ou armas; “armas” é claro e corrente, sem restringir o sentido a armadura.
- source_word: בֵּית הַיָּעַר
  choice: Casa da Floresta
  rationale: Mantém literalmente o nome hebraico, sem inserir “do Líbano”, que não aparece neste versículo. A provável identificação do edifício é explicada em nota.
theological_decisions:
- issue: Força metafórica de מָסַךְ יְהוּדָה
  choice: “a cobertura de Judá” no texto principal
  alternative: “a defesa de Judá” ou “a proteção de Judá”
  rationale: A formulação conserva a imagem concreta e a tensão interpretativa do hebraico, em vez de decidir no texto que se trata exclusivamente de defesa militar.
- issue: Identidade do sujeito de וַיְגַל
  choice: “Ele”, sem explicitar sua identidade
  alternative: “o Senhor” ou uma construção impessoal
  rationale: O verbo hebraico tem sujeito masculino singular, mas o nome do sujeito não aparece neste versículo. A tradução evita acrescentar uma identificação teológica ausente do texto imediato.
- issue: Destinatário de וַתַּבֵּט
  choice: segunda pessoa singular, “você”
  alternative: forma impessoal ou segunda pessoa plural
  rationale: A segunda pessoa singular preserva o discurso profético dirigido a Judá ou Jerusalém como pessoa coletiva, sem transformá-lo em afirmação genérica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Você” evita uma forma verbal regional ou arcaizante e mantém inequívoca a segunda pessoa singular. As imagens “cobertura” e “Casa da Floresta” foram preservadas no texto, com esclarecimentos em notas.
