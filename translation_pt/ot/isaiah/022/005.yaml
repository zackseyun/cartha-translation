  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י יוֹם֩ מְהוּמָ֨ה וּ/מְבוּסָ֜ה וּ/מְבוּכָ֗ה לַֽ/אדֹנָ֧/י יְהוִ֛ה צְבָא֖וֹת בְּ/גֵ֣יא חִזָּי֑וֹן מְקַרְקַ֥ר קִ֖ר וְ/שׁ֥וֹעַ אֶל הָ/הָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/005.yaml
  text: For it is a day of tumult and trampling and confusion from the Lord GOD of Armies in the Valley of Vision[c][b][a], a battering down of the wall and a cry to the mountain.
translation:
  language: pt
  text: Pois é dia de tumulto, de pisoteio e de confusão, da parte do Senhor Yahweh dos Exércitos[a], no Vale da Visão — derrubada da muralha[b] e clamor em direção ao monte[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para o Senhor Yahweh dos Exércitos” ou “pertencente ao Senhor Yahweh dos Exércitos”; a preposição hebraica também pode indicar relação ou posse, não apenas origem.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “derrubada da muralha”. A forma verbal é difícil e também pode ser entendida como “rompimento” ou “demolição”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “e gritos em direção ao monte”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da lamentação e do oráculo precedentes, preservando a ligação discursiva.
- source_word: יוֹם מְהוּמָה וּמְבוּסָה וּמְבוּכָה
  choice: dia de tumulto, de pisoteio e de confusão
  rationale: Mantém a tríade nominal e suas imagens de desordem, violência e desorientação; “pisoteio” conserva a força física da raiz de מְבוּסָה.
- source_word: לַאדֹנָי יְהוִה צְבָאוֹת
  choice: da parte do Senhor Yahweh dos Exércitos
  rationale: “Da parte de” expressa a provável ideia de origem ou agência sem esconder que a preposição ל também admite relação ou posse. אֲדֹנָי é vertido por “Senhor”, יהוה pelo nome “Yahweh”, e צְבָאוֹת por “dos Exércitos”.
- source_word: בְּגֵיא חִזָּיוֹן
  choice: no Vale da Visão
  rationale: Conserva literalmente a designação do lugar e sua forma titular.
- source_word: מְקַרְקַר קִיר
  choice: derrubada da muralha
  rationale: A forma verbal é difícil, mas o contexto aponta para ação destrutiva contra a fortificação; a construção nominal combina com a sequência de calamidades.
- source_word: וְשׁוֹעַ אֶל הָהָר
  choice: e clamor em direção ao monte
  rationale: Preserva tanto a ideia de grito ou clamor quanto a direção expressa por אֶל, sem identificar de modo indevido quem clama ou a função do monte.
theological_decisions:
- issue: Tradução do nome divino יהוה na expressão אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Soberano SENHOR; Senhor DEUS
  rationale: Distingue o título אֲדֹנָי do nome da aliança יהוה e preserva explicitamente o nome divino, sem fundir os dois elementos.
- issue: Relação do dia de juízo com o Senhor em לַאדֹנָי
  choice: da parte do Senhor Yahweh dos Exércitos
  alternative: para o Senhor Yahweh dos Exércitos; pertencente ao Senhor Yahweh dos Exércitos
  rationale: A leitura principal comunica origem ou agência no contexto do juízo, enquanto a nota mantém abertas as possibilidades relacionais e possessivas da preposição hebraica.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A frase nominal e o travessão preservam o ritmo concentrado do hebraico. Evitou-se “atropelamento”, que no uso atual pode sugerir veículos, preferindo-se “pisoteio” para conservar a imagem de ser calcado aos pés.
