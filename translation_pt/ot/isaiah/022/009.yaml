  text: וְ/אֵ֨ת בְּקִיעֵ֧י עִיר דָּוִ֛ד רְאִיתֶ֖ם כִּי רָ֑בּוּ וַֽ/תְּקַבְּצ֔וּ אֶת מֵ֥י הַ/בְּרֵכָ֖ה הַ/תַּחְתּוֹנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/009.yaml
  text: You saw that the breaches of the city of David were many[a], and you collected the waters of the lower pool.
translation:
  language: pt
  text: Vocês viram que eram muitas as brechas na Cidade de Davi e ajuntaram as águas do reservatório inferior.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ajuntaram a água do tanque inferior”. O termo hebraico também pode designar um tanque ou reservatório.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּקִיעֵי
  choice: brechas
  rationale: O substantivo indica rupturas ou aberturas numa estrutura; no contexto das defesas urbanas, “brechas” é o termo português mais preciso e natural.
- source_word: עִיר דָּוִד
  choice: Cidade de Davi
  rationale: Preserva a designação histórica expressa pela cadeia construta hebraica e segue o uso bíblico corrente em português.
- source_word: רְאִיתֶם
  choice: vocês viram
  rationale: Traduz diretamente o qal perfeito de ראה e mantém a referência explícita ao sujeito plural.
- source_word: כִּי רָבּוּ
  choice: que eram muitas
  rationale: Entende כִּי como introdutor do conteúdo percebido e רָבּוּ como indicação da grande quantidade das brechas.
- source_word: וַתְּקַבְּצוּ
  choice: ajuntaram
  rationale: Expressa o ato deliberado de reunir ou concentrar água, permanecendo próximo do sentido de קבץ.
- source_word: מֵי הַבְּרֵכָה הַתַּחְתּוֹנָה
  choice: as águas do reservatório inferior
  rationale: Mantém o plural hebraico מֵי e traduz בְּרֵכָה por “reservatório”, termo adequado a uma instalação urbana destinada ao armazenamento de água; הַתַּחְתּוֹנָה indica sua posição inferior.
