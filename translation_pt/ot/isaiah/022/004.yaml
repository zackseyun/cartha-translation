  text: עַל כֵּ֥ן אָמַ֛רְתִּי שְׁע֥וּ מִ/נִּ֖י אֲמָרֵ֣ר בַּ/בֶּ֑כִי אַל תָּאִ֣יצוּ לְ/נַֽחֲמֵ֔/נִי עַל שֹׁ֖ד בַּת עַמִּֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/004.yaml
  text: Therefore I said[a], “Look away from me; let me weep bitterly[b]. Do not labor to comfort me over the destruction of the daughter of my people.”
translation:
  language: pt
  text: 'Por isso eu disse: “Desviem de mim o olhar[a]; deixem-me chorar amargamente. Não insistam em me consolar por causa da devastação da filha do meu povo[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Afastem-se de mim”. O verbo hebraico pode indicar afastar a atenção ou o olhar.'
    reason: lexical_alternative
  - marker: b
    text: “A filha do meu povo” é uma expressão poética profética que personifica o povo como uma filha.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁעוּ מִנִּי
  choice: Desviem de mim o olhar
  rationale: O imperativo plural de שעה, com מִנִּי, pede que os presentes afastem do falante a atenção ou o olhar. A formulação conserva a provável nuance visual e soa natural em português.
- source_word: אֲמָרֵר בַּבֶּכִי
  choice: deixem-me chorar amargamente
  rationale: A construção expressa intensa amargura no choro. A forma com “deixem-me” se liga naturalmente ao pedido anterior e comunica o valor volitivo possível sem produzir uma expressão portuguesa rígida como “serei amargo no choro”.
- source_word: אַל תָּאִיצוּ לְנַחֲמֵנִי
  choice: Não insistam em me consolar
  rationale: O hifil de אוץ pode transmitir a ideia de apressar, pressionar ou empenhar-se com urgência. Neste contexto, “não insistam” comunica de modo idiomático a tentativa indesejada e persistente de consolar.
- source_word: שֹׁד
  choice: devastação
  rationale: O substantivo designa ruína ou destruição violenta. “Devastação” preserva tanto a gravidade quanto a amplitude da calamidade.
- source_word: בַּת עַמִּי
  choice: a filha do meu povo
  rationale: A tradução mantém a personificação poética profética presente no hebraico, sem reduzi-la diretamente a Jerusalém, Judá ou ao povo em geral.
theological_decisions:
- issue: Preservar ou interpretar a expressão profética בַּת עַמִּי
  choice: Manter “a filha do meu povo” no texto principal
  alternative: Traduzir como “meu povo”, “filha de Sião” ou “Jerusalém”
  rationale: O hebraico diz literalmente “filha do meu povo”. Preservar a imagem mantém sua força literária e emocional, além de evitar uma identificação mais estreita que este versículo não explicita.
- issue: Valor volitivo de אֲמָרֵר no contexto
  choice: “deixem-me chorar amargamente”
  alternative: “chorarei amargamente”
  rationale: A forma verbal admite uma leitura volitiva/coortativa no fluxo do pedido. A tradução escolhida preserva essa nuance sem excluir a declaração da intensidade do lamento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se a metáfora profética e usa-se linguagem natural no pedido de isolamento e no lamento.
