  text: וַ/יִּקְרָ֗א אֲדֹנָ֧/י יְהוִ֛ה צְבָא֖וֹת בַּ/יּ֣וֹם הַ/ה֑וּא לִ/בְכִי֙ וּ/לְ/מִסְפֵּ֔ד וּ/לְ/קָרְחָ֖ה וְ/לַ/חֲגֹ֥ר שָֽׂק׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/012.yaml
  text: In that day the Lord GOD of hosts called for weeping[a], for mourning, for baldness, and for putting on sackcloth.
translation:
  language: pt
  text: Naquele dia, o Senhor Yahweh dos Exércitos chamou ao choro, ao lamento, a raspar a cabeça[a] e a vestir pano de saco.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à calvície”; refere-se a fazer-se calvo como sinal de luto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: chamou
  rationale: Neste contexto, קרא expressa um chamado ou convocação a atos específicos de luto. “Chamou ao” preserva a construção concisa do hebraico e é compreensível em português.
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: o Senhor Yahweh dos Exércitos
  rationale: Mantém os dois elementos do título divino, אֲדֹנָי e o nome pessoal יהוה, e traduz צְבָאוֹת pelo título bíblico corrente “dos Exércitos”.
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Reproduz de modo natural a fórmula temporal profética.
- source_word: לִבְכִי
  choice: ao choro
  rationale: O substantivo בְּכִי indica choro ou pranto; “ao choro” conserva o paralelismo nominal da sequência.
- source_word: וּלְמִסְפֵּד
  choice: ao lamento
  rationale: מִסְפֵּד designa lamentação de luto, muitas vezes pública. “Lamento” é atual, claro e distinto de “choro”.
- source_word: וּלְקָרְחָה
  choice: a raspar a cabeça
  rationale: O substantivo significa literalmente “calvície”, aqui como sinal ritual de luto. A formulação explicita naturalmente em português a ação que produzia esse sinal, sem ocultar o sentido literal, registrado em nota.
- source_word: וְלַחֲגֹר שָׂק
  choice: a vestir pano de saco
  rationale: חגר descreve cingir ou prender uma veste ao corpo. “Vestir pano de saco” comunica com clareza a prática de luto, preservando o elemento concreto שָׂק.
theological_decisions:
- issue: Tradução do nome divino יהוה no título composto אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: “Yahweh” representa explicitamente o nome divino presente no texto hebraico e evita reduzir os dois elementos do título a uma fórmula em que o nome próprio fica oculto.
- issue: Referência à calvície como prática de luto
  choice: raspar a cabeça
  alternative: calvície
  rationale: O contexto indica um sinal deliberado de luto. A tradução explicita a prática sem transformar o texto em uma condenação ou aprovação teológica dela; a forma nominal literal permanece indicada na nota.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A série “ao choro, ao lamento, a raspar... e a vestir...” preserva o ritmo cumulativo do hebraico, enquanto as duas expressões verbais tornam naturais as práticas concretas de luto.
