  text: וּ/מִקְוָ֣ה עֲשִׂיתֶ֗ם בֵּ֚ין הַ/חֹ֣מֹתַ֔יִם לְ/מֵ֖י הַ/בְּרֵכָ֣ה הַ/יְשָׁנָ֑ה וְ/לֹ֤א הִבַּטְתֶּם֙ אֶל עֹשֶׂ֔י/הָ וְ/יֹצְרָ֥/הּ מֵֽ/רָח֖וֹק לֹ֥א רְאִיתֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/011.yaml
  text: You made a reservoir between the two walls for the waters of the old pool[a], but you did not look to the one who made it, nor did you see the one who formed it long ago.
translation:
  language: pt
  text: Vocês fizeram um reservatório entre os dois muros para as águas da antiga piscina, mas não olharam para aquele que a fez, nem viram aquele que a formou há muito tempo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de longe”. A expressão hebraica pode indicar distância espacial, mas aqui provavelmente se refere a um passado remoto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְוָה
  choice: reservatório
  rationale: No contexto de obras hidráulicas e fortificações, designa um local construído para reunir água; “reservatório” comunica essa função com clareza.
- source_word: בֵּין הַחֹמֹתַיִם
  choice: entre os dois muros
  rationale: O dual hebraico indica explicitamente dois muros, nuance preservada na tradução.
- source_word: לְמֵי הַבְּרֵכָה הַיְשָׁנָה
  choice: para as águas da antiga piscina
  rationale: “Águas” acompanha o plural construto מֵי, e “piscina” distingue a fonte já existente do novo reservatório.
- source_word: הִבַּטְתֶּם אֶל
  choice: não olharam para
  rationale: Preserva tanto a imagem visual quanto o sentido de dirigir atenção e confiança a alguém.
- source_word: עֹשֶׂיהָ
  choice: aquele que a fez
  rationale: Mantém a forma participial e o sufixo feminino sem identificar de modo mais específico o objeto referido.
- source_word: יֹצְרָהּ
  choice: aquele que a formou
  rationale: Conserva a imagem de formar intencionalmente e o paralelismo com “aquele que a fez”.
- source_word: מֵרָחוֹק
  choice: há muito tempo
  rationale: Aqui a distância provavelmente é temporal e aponta para uma ação ou propósito estabelecido no passado remoto; a possibilidade espacial é registrada em nota.
- source_word: לֹא רְאִיתֶם
  choice: nem viram
  rationale: Preserva o verbo concreto e o paralelismo com “não olharam”, deixando o contexto comunicar a falta de percepção espiritual.
theological_decisions:
- issue: Referente de “aquele que a fez” e “aquele que a formou”
  choice: Manter Deus como referente pessoal implícito, sem explicitar o objeto do sufixo feminino além do pronome “a”.
  alternative: Identificar expressamente a piscina, o reservatório, Jerusalém ou o conjunto das obras defensivas como o objeto feito e formado.
  rationale: O contexto censura a confiança de Judá em preparativos defensivos sem consideração pelo agir soberano de Deus. Como o hebraico não elimina toda ambiguidade quanto ao antecedente do sufixo, a tradução evita resolvê-la por acréscimo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “vocês”. A formulação conserva o paralelismo entre olhar/ver e fazer/formar, bem como a ambiguidade compacta do pronome feminino.
