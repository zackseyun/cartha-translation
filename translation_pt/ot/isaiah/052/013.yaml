  text: הִנֵּ֥ה יַשְׂכִּ֖יל עַבְדִּ֑/י יָר֧וּם וְ/נִשָּׂ֛א וְ/גָבַ֖הּ מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/013.yaml
  text: Behold[a], my servant will act wisely; he will be raised and lifted up and highly exalted.
translation:
  language: pt
  text: 'Vejam: o meu servo agirá com sabedoria[a]; será elevado, levantado e muito exaltado.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “será bem-sucedido”. O verbo hebraico pode indicar agir com sabedoria e, por isso, alcançar êxito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Vejam
  rationale: Expressa a força enfática que chama a atenção, em português atual e digno, sem o tom arcaico de “Eis”.
- source_word: יַשְׂכִּיל
  choice: agirá com sabedoria
  rationale: Preserva o núcleo lexical de agir com discernimento, sem eliminar a possível extensão de sentido ligada ao êxito.
- source_word: עַבְדִּי
  choice: o meu servo
  rationale: “Servo” é a designação natural neste contexto de Isaías e não introduz uma identificação messiânica explícita ausente da expressão hebraica.
- source_word: יָרוּם
  choice: será elevado
  rationale: Comunica a ideia de elevação e inicia naturalmente a sequência enfática dos três verbos.
- source_word: וְנִשָּׂא
  choice: levantado
  rationale: Mantém a imagem vertical e o sentido passivo de exaltação no paralelismo.
- source_word: וְגָבַהּ מְאֹד
  choice: muito exaltado
  rationale: Reproduz o clímax intensificado por מְאֹד em português claro e solene.
theological_decisions:
- issue: Possível leitura messiânica do Servo
  choice: Traduzir de modo neutro como “o meu servo”, sem explicitar sua identidade.
  alternative: Inserir “Messias” ou “Cristo” na tradução.
  rationale: O hebraico diz apenas “meu servo”. A tradução conserva essa formulação e deixa a identificação cristológica para a interpretação e as referências bíblicas.
- issue: Possíveis ecos teológicos da linguagem de elevação
  choice: Conservar a tríplice linguagem de elevação sem especificar o tipo de exaltação.
  alternative: Interpretar os verbos diretamente como ressurreição, ascensão ou glorificação.
  rationale: O verso enfatiza intensamente a elevação do servo, mas não define aqui seu mecanismo ou momento; explicitar um evento teológico resolveria uma abertura do texto.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Vejam” funciona como chamada enfática dirigida aos ouvintes; a sequência “elevado, levantado e muito exaltado” preserva a acumulação retórica do hebraico.
