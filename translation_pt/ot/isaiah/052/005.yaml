source:
  edition: WLC
  text: וְ/עַתָּ֤ה מי ל/י פֹה֙ נְאֻם יְהוָ֔ה כִּֽי לֻקַּ֥ח עַמִּ֖/י חִנָּ֑ם משל/ו יְהֵילִ֨ילוּ֙ נְאֻם יְהוָ֔ה וְ/תָמִ֥יד כָּל הַ/יּ֖וֹם שְׁמִ֥/י מִנֹּאָֽץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/005.yaml
  text: And now[a], what do I have here? declares Yahweh. For my people have been taken away for nothing; those who rule over them wail, declares Yahweh, and continually, all day long[b], my name is despised.
translation:
  language: pt
  text: E agora, o que tenho eu aqui? — declara Yahweh. Pois o meu povo foi levado por nada; os que o dominam uivam[a] — declara Yahweh —, e continuamente, o dia todo, o meu nome é desprezado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seus opressores uivam”. O termo hebraico pode designar os que governam o povo; neste contexto, seu domínio é opressivo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o meu nome é blasfemado continuamente, o dia todo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a conjunção quanto o advérbio temporal, funcionando naturalmente como transição discursiva em português.
- source_word: מַה־לִּי פֹה
  choice: o que tenho eu aqui?
  rationale: Expressa de modo idiomático a pergunta retórica e o protesto divino, sem eliminar sua concisão.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Mantém a fórmula profética de autoridade e verte diretamente o nome divino.
- source_word: לֻקַּח עַמִּי
  choice: o meu povo foi levado
  rationale: O passivo comunica que o povo sofreu a ação; o perfeito hebraico apresenta a tomada como fato consumado.
- source_word: חִנָּם
  choice: por nada
  rationale: Conserva a amplitude do hebraico, que pode sugerir ausência de pagamento, de ganho ou de justa causa, sem restringir o sentido a apenas uma dessas possibilidades.
- source_word: מֹשְׁלָיו
  choice: os que dominam sobre ele
  rationale: Torna explícito que se trata dos que exercem domínio sobre o povo, evitando transformar no texto principal a descrição funcional em 'opressores'.
- source_word: יְהֵילִילוּ
  choice: soltam lamentos
  rationale: Representa o lamento alto indicado pelo verbo sem impor em português uma imagem animal que 'uivam' poderia sugerir; a alternativa mais áspera fica registrada em nota.
- source_word: וְתָמִיד כָּל־הַיּוֹם
  choice: e continuamente, o dia todo
  rationale: Mantém os dois elementos temporais e, assim, a ênfase cumulativa do hebraico.
- source_word: שְׁמִי מִנֹּאָץ
  choice: o meu nome é desprezado
  rationale: Preserva 'meu nome' e usa o sentido amplo de tratar com desprezo, sem excluir o sentido mais específico de blasfemar.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o Tetragrama; 'Yahweh' preserva o nome pessoal da aliança em vez de substituí-lo por um título.
- issue: Natureza da desonra expressa por מִנֹּאָץ
  choice: o meu nome é desprezado
  alternative: o meu nome é blasfemado
  rationale: O verbo admite tanto a ideia ampla de desprezo quanto a formulação mais específica de blasfêmia. O texto principal retém a amplitude lexical, e a nota preserva a alternativa teologicamente relevante.
- issue: Identidade e caracterização de מֹשְׁלָיו
  choice: os que dominam sobre ele
  alternative: seus opressores
  rationale: A expressão designa os que governam ou dominam o povo; o contexto permite vê-los como opressores, mas essa caracterização não é inserida silenciosamente no texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A pontuação com travessões integra a fórmula profética sem obscurecer o encadeamento da pergunta, da causa e da denúncia. A tradução mantém as ambiguidades de חִנָּם, מֹשְׁלָיו e מִנֹּאָץ.
