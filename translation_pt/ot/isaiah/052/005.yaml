revisions:
- from: E agora, o que tenho eu aqui? — declara Yahweh. Pois o meu povo foi levado por nada; os que dominam sobre ele soltam lamentos[a] — declara Yahweh —, e continuamente, o dia todo, o meu nome é desprezado[b].
  to: E agora, o que tenho eu aqui? — declara Yahweh. Pois o meu povo foi levado por nada; os que o dominam uivam[a] — declara Yahweh —, e continuamente, o dia todo, o meu nome é desprezado[b].
  rationale: A revisão substitui uma perífrase menos natural por «uivam», que conserva melhor a força sonora do verbo hebraico, e torna mais idiomática a relação entre os dominadores e o povo. Mantêm-se a ambiguidade contextual sobre os governantes, o sentido amplo de «por nada» e a alternativa mais específica para o desprezo do nome divino.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:30:57Z'
