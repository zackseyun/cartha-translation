  source_fidelity: 'A tradução reproduz bem a progressão do hebraico: a pergunta retórica, a tomada do povo «por nada», a referência aos que exercem domínio sobre ele, o clamor intenso e o desprezo contínuo pelo nome de Yahweh. «Por nada» preserva adequadamente a amplitude de חִנָּם. A formulação «os que dominam sobre ele» é fiel em sentido, mas pode ser ajustada para uma construção portuguesa mais direta sem alterar a ambiguidade do referente.'
  naturalness: «Soltam lamentos» é compreensível, mas soa perifrástico e enfraquece o verbo intensivo יְהֵילִילוּ. «Uivam» comunica de modo mais imediato o clamor alto e áspero; a nota pode registrar «opressores» como alternativa contextual. «Os que o dominam» é mais natural e claro do que «os que dominam sobre ele».
  terminology: «Yahweh», «meu povo», «meu nome» e «é desprezado» são escolhas consistentes e adequadas. A alternativa «blasfemado» permanece corretamente limitada à nota, pois é possível, mas mais específica que o sentido lexical básico.
