id: ISA.52.6
reference: Isaiah 52:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵ֛ן יֵדַ֥ע עַמִּ֖/י שְׁמִ֑/י לָ/כֵן֙ בַּ/יּ֣וֹם הַ/ה֔וּא כִּֽי אֲנִי ה֥וּא הַֽ/מְדַבֵּ֖ר הִנֵּֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/006.yaml
  text: 'Therefore my people will know my name[a]; therefore on that day they will know that I am he who speaks: Here I am.'
translation:
  language: pt
  text: 'Por isso, o meu povo conhecerá o meu nome; por isso, naquele dia, saberá que sou eu quem fala[a]: “Aqui estou!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eu sou aquele que fala”.'
    reason: Alternativa de tradução para a construção enfática אֲנִי הוּא הַמְדַבֵּר.
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Expressa a consequência do contexto anterior em português natural e preserva, nas duas ocorrências, a repetição enfática do hebraico.
- source_word: יֵדַע
  choice: conhecerá / saberá
  rationale: O imperfeito tem sentido futuro neste contexto. Em português, “conhecer o nome” é idiomático na primeira ocorrência, enquanto “saber que” introduz naturalmente o conteúdo conhecido na segunda.
- source_word: עַמִּי
  choice: o meu povo
  rationale: Preserva a expressão coletiva e pactual do hebraico sem explicitação interpretativa.
- source_word: שְׁמִי
  choice: o meu nome
  rationale: Mantém a formulação concreta do hebraico, que pode abranger identidade, caráter e reputação, sem reduzir sua amplitude.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Equivalente temporal natural em português e consagrado no discurso profético.
- source_word: כִּי
  choice: que
  rationale: É entendido como introdutor do conteúdo do que o povo saberá, embora a partícula também possa ter valor explicativo em outros contextos.
- source_word: אֲנִי הוּא הַמְדַבֵּר
  choice: sou eu quem fala
  rationale: Reproduz com naturalidade a identificação enfática e mantém o particípio como caracterização daquele que fala.
- source_word: הִנֵּנִי
  choice: Aqui estou!
  rationale: Comunica a apresentação imediata e enfática do falante em linguagem atual, clara e digna.
theological_decisions:
- issue: Identificação divina enfática em אֲנִי הוּא
  choice: sou eu quem fala
  alternative: eu sou aquele que fala
  rationale: A construção escolhida conserva a ênfase na identidade do próprio Deus como aquele que fala, sem expandir a expressão numa afirmação doutrinária além do que o versículo declara.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A repetição de “por isso” conserva a retórica hebraica; “Aqui estou!” mantém a vivacidade da autodeclaração final.
