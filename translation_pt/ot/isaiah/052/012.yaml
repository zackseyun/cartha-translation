  text: כִּ֣י לֹ֤א בְ/חִפָּזוֹן֙ תֵּצֵ֔אוּ וּ/בִ/מְנוּסָ֖ה לֹ֣א תֵלֵכ֑וּ/ן כִּֽי הֹלֵ֤ךְ לִ/פְנֵי/כֶם֙ יְהוָ֔ה וּ/מְאַסִּפְ/כֶ֖ם אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/012.yaml
  text: For you will not go out in haste[a], and you will not go in flight; for Yahweh is going before you[b], and the God of Israel is your rear guard.
translation:
  language: pt
  text: Pois vocês não sairão às pressas, nem partirão em fuga[a], porque Yahweh vai à frente de vocês, e o Deus de Israel os guarda pela retaguarda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nem irão fugindo” ou “nem partirão como fugitivos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “o Deus de Israel os recolhe por trás”; isto é, ele protege a retaguarda de vocês.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְחִפָּזוֹן
  choice: às pressas
  rationale: Expressa movimento apressado de modo natural em português, sem acrescentar necessariamente a ideia emocional de pânico.
- source_word: תֵּצֵאוּ
  choice: sairão
  rationale: Mantém o sentido concreto de יצא e a evocação da saída do Egito presente no contexto.
- source_word: וּבִמְנוּסָה
  choice: em fuga
  rationale: מְנוּסָה indica fuga ou retirada; a expressão preserva o contraste entre fugir e partir sob proteção divina.
- source_word: תֵלֵכוּן
  choice: partirão
  rationale: Neste paralelismo de movimento, 'partirão' soa natural e evita a formulação pouco idiomática 'andarão em fuga', sem alterar o sentido básico de הלך.
- source_word: הֹלֵךְ לִפְנֵיכֶם
  choice: vai adiante de vocês
  rationale: 'Conserva a imagem dinâmica do particípio: Yahweh conduz o povo, seguindo à sua frente.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וּמְאַסִּפְכֶם
  choice: os guarda pela retaguarda
  rationale: אסף tem aqui o sentido processional ou militar de reunir e proteger quem vem por último. A formulação comunica claramente essa função, enquanto a nota preserva a imagem verbal hebraica.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta da construção hebraica, preservando a identidade pactual e o paralelo com Yahweh.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. 'Yahweh' preserva o nome pessoal e pactual sem substituí-lo por um título.
- issue: Sentido de וּמְאַסִּפְכֶם
  choice: proteção divina pela retaguarda
  alternative: Deus os reúne por trás
  rationale: O verbo conserva uma imagem de reunião, mas no contexto da marcha indica que Deus acompanha e protege a parte traseira do grupo. A tradução principal explicita a função, e a nota mantém a forma mais literal.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis e boa legibilidade brasileira. O plural 'vocês' torna explícito o destinatário coletivo. A estrutura paralela do hebraico e a imagem de uma partida semelhante ao êxodo foram preservadas.
