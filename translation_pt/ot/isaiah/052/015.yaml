  text: כֵּ֤ן יַזֶּה֙ גּוֹיִ֣ם רַבִּ֔ים עָלָ֛י/ו יִקְפְּצ֥וּ מְלָכִ֖ים פִּי/הֶ֑ם כִּ֠י אֲשֶׁ֨ר לֹֽא סֻפַּ֤ר לָ/הֶם֙ רָא֔וּ וַ/אֲשֶׁ֥ר לֹֽא שָׁמְע֖וּ הִתְבּוֹנָֽנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/015.yaml
  text: So he will sprinkle many nations; kings will shut their mouths because of him. For they will see what had not been told to them[a], and they will understand what they had not heard.
translation:
  language: pt
  text: Assim ele aspergirá muitas nações; por causa dele, reis fecharão a boca. Pois verão aquilo que não lhes havia sido contado[a] e compreenderão aquilo que não tinham ouvido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Assim ele causará espanto a muitas nações”. O verbo hebraico geralmente significa “aspergir”, mas alguns entendem que, aqui, ele descreve o ato de causar assombro.'
    reason: alternative_reading
lexical_decisions:
- source_word: כֵּן
  choice: Assim
  rationale: Retoma a comparação do versículo anterior e introduz o resultado correspondente de forma concisa e natural.
- source_word: יַזֶּה
  choice: aspergirá
  rationale: O hifil de נזה normalmente significa aspergir, sobretudo em contextos rituais e de purificação. A alternativa contextual 'causará espanto' é preservada em nota.
- source_word: גּוֹיִם רַבִּים
  choice: muitas nações
  rationale: Expressa o alcance internacional do termo sem introduzir a distinção posterior sugerida por 'gentios'.
- source_word: עָלָיו
  choice: por causa dele
  rationale: Apresenta o servo como a causa da reação silenciosa dos reis, em português claro e idiomático.
- source_word: יִקְפְּצוּ מְלָכִים פִּיהֶם
  choice: reis fecharão a boca
  rationale: Preserva a imagem concreta do hebraico e comunica o silêncio causado por assombro.
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação para o silêncio dos reis.
- source_word: אֲשֶׁר לֹא סֻפַּר לָהֶם רָאוּ
  choice: verão aquilo que não lhes havia sido contado
  rationale: Mantém o contraste entre a ausência anterior de relato e a percepção futura; o mais-que-perfeito composto indica adequadamente a anterioridade.
- source_word: וַאֲשֶׁר לֹא שָׁמְעוּ הִתְבּוֹנָנוּ
  choice: compreenderão aquilo que não tinham ouvido
  rationale: Traduz o valor cognitivo e discernente de התבונן, indo além do simples ato de ouvir.
theological_decisions:
- issue: Sentido de יַזֶּה no contexto do Servo
  choice: aspergirá muitas nações
  alternative: causará espanto a muitas nações
  rationale: O sentido lexical habitual do verbo é 'aspergir' e pode evocar purificação, sem explicitar além do texto a natureza desse ato. Como a leitura 'causar espanto' é contextual e amplamente reconhecida, ela é registrada em nota para preservar a ambiguidade interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Aspergirá' conserva o termo ritual sem recorrer ao menos preciso 'borrifará'; a sintaxe foi levemente reorganizada para fluência, preservando o paralelismo.
