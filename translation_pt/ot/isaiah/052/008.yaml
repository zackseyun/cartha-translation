id: ISA.52.8
reference: Isaiah 52:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ק֥וֹל צֹפַ֛יִ/ךְ נָ֥שְׂאוּ ק֖וֹל יַחְדָּ֣ו יְרַנֵּ֑נוּ כִּ֣י עַ֤יִן בְּ/עַ֨יִן֙ יִרְא֔וּ בְּ/שׁ֥וּב יְהוָ֖ה צִיּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/008.yaml
  text: The voice of your watchmen—they lift up their voice[a]; together they shout for joy[b], for they will see eye to eye when Yahweh returns to Zion.
translation:
  language: pt
  text: A voz dos seus vigias! Eles erguem a voz; juntos gritam de alegria, pois verão com os próprios olhos[a] quando Yahweh voltar a Sião.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “olho com olho”; isto é, diretamente, com os próprios olhos.
    reason: lexical_alternative
  - marker: b
    text: Ou “quando Yahweh restaurar Sião”.
    reason: alternative_reading
lexical_decisions:
- source_word: ק֥וֹל
  choice: A voz de
  rationale: Preserva a abertura nominal e enfática do hebraico, sem acrescentar um imperativo como “Ouçam!”, que não está expresso no texto.
- source_word: צֹפַיִךְ
  choice: seus vigias
  rationale: Designa os que mantêm vigilância; o possessivo feminino singular se refere a Sião/Jerusalém.
- source_word: נָשְׂאוּ קוֹל
  choice: erguem a voz
  rationale: Expressão idiomática portuguesa natural para o hebraico “levantar a voz”, mantendo a repetição retórica de קוֹל.
- source_word: יַחְדָּו
  choice: juntos
  rationale: Mantém de modo direto a ideia de júbilo coletivo e unânime.
- source_word: יְרַנֵּנוּ
  choice: gritam de alegria
  rationale: O piel de רנן indica clamor ou canto jubiloso; esta formulação comunica a exultação pública sem restringi-la necessariamente ao canto.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente, em português, o motivo da alegria dos vigias.
- source_word: עַיִן בְּעַיִן
  choice: olho no olho
  rationale: Preserva a imagem concreta e a forma incomum do hebraico, enquanto a nota esclarece o provável sentido de visão direta e pessoal.
- source_word: יִרְאוּ
  choice: verão
  rationale: O imperfeito é entendido como futuro no contexto, indicando aquilo que os vigias testemunharão.
- source_word: בְּשׁוּב
  choice: quando ... voltar
  rationale: O infinitivo construto com בְּ expressa circunstância temporal; a sintaxe permite ler Yahweh como sujeito daquele que volta.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: צִיּוֹן
  choice: Sião
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do topônimo bíblico.
theological_decisions:
- issue: Sentido de עַיִן בְּעַיִן
  choice: olho no olho
  alternative: com os próprios olhos; diretamente
  rationale: A tradução principal conserva a imagem hebraica sem transformar a expressão em ideia de concordância; a nota registra seu provável valor idiomático de visão direta.
- issue: Sujeito e sentido de בְּשׁוּב יְהוָה צִיּוֹן
  choice: quando Yahweh voltar a Sião
  alternative: quando Yahweh restaurar Sião
  rationale: A leitura de Yahweh como sujeito de “voltar” segue de modo direto a sintaxe e o contexto, enquanto a leitura causativa ou restaurativa permanece possível e é preservada em nota.
translation_notes:
  register: Português atual, digno e acessível, com boa legibilidade brasileira e compreensão internacional. A abertura exclamativa mantém a ênfase poética e a repetição de “voz”; “gritam de alegria” comunica o júbilo público de modo natural.
