reference: Isaiah 52:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֨ר שָׁמְמ֤וּ עָלֶ֨י/ךָ֙ רַבִּ֔ים כֵּן מִשְׁחַ֥ת מֵ/אִ֖ישׁ מַרְאֵ֑/הוּ וְ/תֹאֲר֖/וֹ מִ/בְּנֵ֥י אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/014.yaml
  text: Just as many were appalled at you—so disfigured was his appearance[a], beyond that of a man[c][b], and his form beyond the sons of man—
translation:
  language: pt
  text: Assim como muitos ficaram horrorizados diante de você — tão desfigurada[a][b] estava a aparência dele, mais do que a de um homem, e a forma dele, mais do que a dos filhos dos homens[c] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico passa de “você” para “dele” dentro do versículo: “diante de você [...] a aparência dele [...] a forma dele”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “arruinada” ou “deformada”.'
    reason: lexical_alternative
  - marker: c
    text: “Filhos dos homens” é uma expressão hebraica que se refere aos seres humanos em geral.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: Assim como ... tão
  rationale: Preserva a estrutura correlativa que começa neste versículo e continua no seguinte, com formulação natural em português.
- source_word: שָׁמְמוּ
  choice: ficaram horrorizados
  rationale: Expressa o choque profundo e consternado provocado pela aparência do servo, não simples surpresa.
- source_word: עָלֶיךָ
  choice: diante de você
  rationale: Mantém a segunda pessoa masculina singular do texto massorético e se ajusta ao contexto de uma reação visual.
- source_word: מִשְׁחַת
  choice: desfigurada
  rationale: Comunica de maneira clara e atual a ideia de uma aparência arruinada ou deformada.
- source_word: מַרְאֵהוּ
  choice: a aparência dele
  rationale: Torna explícita em português a terceira pessoa do sufixo hebraico, preservando a mudança abrupta em relação a “você”.
- source_word: מֵאִישׁ
  choice: mais que a de um homem
  rationale: Conserva a comparação elíptica do hebraico sem explicá-la como se significasse inequivocamente que ele já não parecia humano.
- source_word: וְתֹאֲרוֹ
  choice: e a forma dele
  rationale: Distingue תֹאַר, a forma ou figura, de מַרְאֶה, a aparência visível.
- source_word: מִבְּנֵי אָדָם
  choice: mais que a dos filhos dos homens
  rationale: Preserva a expressão representativa do hebraico e seu paralelismo com “um homem”; uma nota esclarece seu sentido genérico.
theological_decisions:
- issue: Mudança de pessoa gramatical dentro do versículo
  choice: Manter “você” e depois “dele”.
  alternative: Harmonizar toda a frase na segunda ou na terceira pessoa.
  rationale: O texto massorético passa deliberadamente da segunda pessoa singular para sufixos de terceira pessoa singular. A tradução não elimina essa tensão textual.
- issue: Alcance de בְּנֵי אָדָם
  choice: Traduzir por “filhos dos homens”, com esclarecimento em nota.
  alternative: Traduzir diretamente por “seres humanos” ou “humanidade”.
  rationale: A formulação escolhida mantém a imagem e o paralelismo hebraicos, enquanto a nota impede que seja entendida como referência apenas a pessoas do sexo masculino.
- issue: Força comparativa de מִן
  choice: Usar a expressão elíptica “mais que”.
  alternative: Explicitar “a ponto de já não parecer humano”.
  rationale: A explicitação alternativa é possível no contexto, mas resolve a construção hebraica mais do que o próprio texto exige.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com preferência por clareza brasileira sem regionalismos. A construção permanece incompleta no fim porque a comparação prossegue no versículo seguinte; os travessões preservam essa continuidade.
