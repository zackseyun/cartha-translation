source:
  edition: WLC
  text: הִתְנַעֲרִ֧י מֵ/עָפָ֛ר ק֥וּמִי שְּׁבִ֖י יְרֽוּשָׁלִָ֑ם התפתחו מוֹסְרֵ֣י צַוָּארֵ֔/ךְ שְׁבִיָּ֖ה בַּת צִיּֽוֹן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/002.yaml
  text: Shake yourself from the dust[a]; rise up, sit down, Jerusalem. Loosen the bonds of your neck[c][b], captive daughter Zion.
translation:
  language: pt
  text: Sacuda de si o pó; levante-se e sente-se, Jerusalém. Solte[a] as amarras do seu pescoço, ó cativa, filha de Sião.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A forma hebraica é difícil e irregular. Também pode ser entendida como “desamarre-se” ou “seja libertada” das amarras do pescoço.
    reason: textual_variant
lexical_decisions:
- source_word: הִתְנַעֲרִי מֵעָפָר
  choice: Sacuda de si o pó
  rationale: O imperativo hitpael feminino singular expressa ação reflexiva, isto é, sacudir de si aquilo que adere. A formulação conserva a imagem concreta do pó como condição de humilhação.
- source_word: קוּמִי שְּׁבִי
  choice: levante-se e sente-se
  rationale: Os dois imperativos femininos singulares são vertidos diretamente. “Sente-se” preserva a simplicidade e a possível abertura contextual de ישׁב, sem acrescentar explicitamente a ideia de entronização.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalém
  rationale: Forma portuguesa consagrada do nome da cidade personificada como mulher.
- source_word: התפתחו
  choice: Solte
  rationale: A forma hebraica é irregular e difícil, mas o sentido provável é uma ordem para que as amarras sejam desfeitas. “Solte” comunica esse sentido sem introduzir uma emenda textual específica; a dificuldade é indicada em nota.
- source_word: מוֹסְרֵי צַוָּארֵךְ
  choice: as amarras do seu pescoço
  rationale: מוֹסְרֵי designa laços ou restrições. “Amarras” mantém a imagem concreta sem especificar indevidamente cordas ou correntes, e “do seu pescoço” acompanha a construção hebraica.
- source_word: שְׁבִיָּה בַּת צִיּוֹן
  choice: ó cativa, filha de Sião
  rationale: שְׁבִיָּה caracteriza a figura feminina como cativa, e בַּת צִיּוֹן é a personificação profética tradicional. O vocativo torna natural em português a sequência de títulos dirigida a Sião.
theological_decisions:
- issue: Força contextual de שְּׁבִי no oráculo de restauração
  choice: sente-se
  alternative: tome assento em lugar de honra / sente-se entronizada
  rationale: Embora o contraste com o pó possa sugerir dignidade restaurada, o verbo hebraico diz simplesmente “sentar-se”. A tradução mantém essa abertura e não transforma uma implicação contextual possível em afirmação explícita.
- issue: Forma irregular התפתחו
  choice: Solte, com nota sobre a dificuldade da forma
  alternative: desamarre-se / sejam soltas
  rationale: A forma consonantal é inesperada em relação à destinatária feminina singular e pode ser entendida em sentido reflexivo ou passivo. A tradução apresenta o sentido provável sem decidir silenciosamente entre todas as explicações gramaticais ou textuais.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Os imperativos reflexivos mantêm a personificação feminina de Jerusalém/Sião; “amarras” evita arcaísmo e preserva a imagem de cativeiro.
