  text: מַה נָּאו֨וּ עַל הֶ/הָרִ֜ים רַגְלֵ֣י מְבַשֵּׂ֗ר מַשְׁמִ֧יעַ שָׁל֛וֹם מְבַשֵּׂ֥ר ט֖וֹב מַשְׁמִ֣יעַ יְשׁוּעָ֑ה אֹמֵ֥ר לְ/צִיּ֖וֹן מָלַ֥ךְ אֱלֹהָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/007.yaml
  text: How beautiful on the mountains are the feet of the one who brings good news[a], who announces peace, who brings good news of good things, who announces salvation, who says to Zion, “Your God reigns.”
translation:
  language: pt
  text: 'Como são belos, sobre os montes, os pés daquele que traz boas notícias, que anuncia a paz, que traz boas notícias de coisas boas, que anuncia a salvação, que diz a Sião: “Seu Deus reina”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Seu Deus se tornou rei” ou “Seu Deus é rei”. O hebraico pode enfatizar a entronização ou o exercício do reinado.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַה נָּאווּ
  choice: Como são belos
  rationale: מַה introduz uma exclamação de admiração, e נָאווּ expressa beleza ou encanto. A formulação é natural e digna em português.
- source_word: עַל הֶהָרִים
  choice: sobre os montes
  rationale: Preserva a imagem geográfica concreta do mensageiro que chega pelas elevações; “montes” traduz הָרִים de modo tradicional e corrente.
- source_word: רַגְלֵי מְבַשֵּׂר
  choice: os pés daquele que traz boas notícias
  rationale: Mantém a vívida metonímia dos “pés” e o valor verbal do particípio substantivado מְבַשֵּׂר, sem transformá-lo em um cargo técnico.
- source_word: מַשְׁמִיעַ שָׁלוֹם
  choice: que anuncia a paz
  rationale: O particípio hifil de שמע tem o sentido de fazer ouvir ou anunciar; “anuncia a paz” é claro e preserva o tom de proclamação.
- source_word: מְבַשֵּׂר טוֹב
  choice: que traz boas notícias de coisas boas
  rationale: Preserva a repetição de “boas” presente na raiz e no complemento hebraicos, sem restringir טוֹב a prosperidade material.
- source_word: מַשְׁמִיעַ יְשׁוּעָה
  choice: que anuncia a salvação
  rationale: “Salvação” conserva tanto o sentido de livramento quanto a ressonância teológica e canônica de יְשׁוּעָה.
- source_word: אֹמֵר לְצִיּוֹן
  choice: que diz a Sião
  rationale: Reproduz com simplicidade a introdução do discurso direto e mantém o nome tradicional “Sião”.
- source_word: מָלַךְ אֱלֹהָיִךְ
  choice: Seu Deus reina
  rationale: “Reina” constitui uma proclamação régia idiomática em português e não limita o qatal hebraico exclusivamente ao começo do reinado.
theological_decisions:
- issue: Sentido da proclamação régia מָלַךְ אֱלֹהָיִךְ
  choice: Seu Deus reina
  alternative: Seu Deus se tornou rei; Seu Deus é rei
  rationale: O perfeito hebraico pode destacar a entronização ou o exercício presente do domínio régio. O texto principal usa a formulação portuguesa mais natural, e a nota preserva as demais nuances legítimas.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A estrutura poética e a repetição do hebraico foram preservadas sem recorrer a linguagem arcaica.
