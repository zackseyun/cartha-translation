  source_fidelity: O texto reproduz com precisão a exclamação inicial, a imagem dos pés sobre os montes, a sequência de particípios do mensageiro e a proclamação final. “Seu Deus reina” é uma representação idiomática e defensável do perfeito מָלַךְ, enquanto a nota preserva adequadamente as alternativas de entronização e de estado régio.
  naturalness: O português é moderno, claro e adequadamente solene. “Como são belos, sobre os montes, os pés...” preserva bem a ordem poética marcada, mas permanece inteligível. A repetição em “boas notícias de coisas boas” soa um pouco enfática, como no hebraico, sem se tornar artificial.
  terminology: “Sião”, “paz”, “salvação” e “reina” são termos estabelecidos, compreensíveis e apropriados ao registro profético. “Aquele que traz boas notícias” evita atribuir ao mensageiro um título técnico que o hebraico não exige.
