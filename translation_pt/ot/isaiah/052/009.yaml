  text: פִּצְח֤וּ רַנְּנוּ֙ יַחְדָּ֔ו חָרְב֖וֹת יְרוּשָׁלִָ֑ם כִּֽי נִחַ֤ם יְהוָה֙ עַמּ֔/וֹ גָּאַ֖ל יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/009.yaml
  text: Break forth[a], sing together, you ruins of Jerusalem, for Yahweh has comforted his people; he has redeemed Jerusalem.
translation:
  language: pt
  text: Irrompam em júbilo, cantem juntas, ó ruínas de Jerusalém, pois Yahweh consolou seu povo; redimiu Jerusalém.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פִּצְחוּ
  choice: Irrompam em cânticos
  rationale: O imperativo plural de פצח descreve o irromper súbito em expressão sonora; a locução preserva a imagem poética e se liga naturalmente ao verbo seguinte.
- source_word: רַנְּנוּ
  choice: cantem
  rationale: O imperativo plural de רנן indica expressão jubilosa, frequentemente por meio do canto. “Cantem” é claro e natural, embora a ideia de alegria também possa ser expressa por “gritem de alegria”.
- source_word: יַחְדָּו
  choice: juntas
  rationale: O advérbio significa “juntas” ou “em conjunto”; o feminino concorda naturalmente com “ruínas”, o vocativo personificado.
- source_word: חָרְבוֹת
  choice: ruínas
  rationale: O plural designa lugares devastados ou desolados. “Ruínas” transmite de modo conciso a devastação personificada de Jerusalém.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão dos imperativos de júbilo e mantém um tom poético digno.
- source_word: נִחַם
  choice: consolou
  rationale: O perfeito de נחם, neste contexto, comunica que Yahweh trouxe consolo e alívio ao seu povo. O pretérito perfeito português apresenta o ato como realizado.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no hebraico, em vez de substituí-lo por um título.
- source_word: עַמּוֹ
  choice: o seu povo
  rationale: Reproduz diretamente o substantivo com sufixo de terceira pessoa masculina singular.
- source_word: גָּאַל
  choice: redimiu
  rationale: Preserva o sentido de resgate e restauração, incluindo sua ressonância de redenção, sem especificar um mecanismo não declarado no verso.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalém
  rationale: Mantém o nome da cidade como objeto explícito na conclusão, preservando a repetição enfática do hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” o representa diretamente e evita substituí-lo por um título.
- issue: Sentido de גָּאַל
  choice: redimiu Jerusalém
  alternative: resgatou Jerusalém; recuperou Jerusalém
  rationale: “Redimiu” conserva a amplitude restauradora e a ressonância pactual do verbo, sem impor uma teoria específica de redenção.
translation_notes:
  register: Português moderno, poético e amplamente compreensível, com boa legibilidade brasileira. A personificação das ruínas foi preservada, assim como os imperativos plurais, a relação causal e a repetição final de “Jerusalém”.
