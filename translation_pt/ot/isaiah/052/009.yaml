review_pass:
  verdict: revise
  source_fidelity: O texto preserva corretamente os dois imperativos plurais, a personificação das ruínas de Jerusalém, a relação causal, o nome divino Yahweh, o perfeito de consolo e a redenção final de Jerusalém. Contudo, «Irrompam em cânticos, cantem juntas» faz «em cânticos» antecipar e duplicar de modo algo pesado o conteúdo específico de «cantem».
  naturalness: «Juntas» concordando com «ruínas» é gramatical e estilisticamente apropriado. A revisão torna a sucessão dos imperativos mais idiomática e mantém o paralelismo poético sem repetição lexical desnecessária.
  terminology: «Yahweh», «consolou», «seu povo» e «redimiu Jerusalém» são escolhas fiéis, naturais e teologicamente não tendenciosas. «Redimiu» conserva adequadamente a amplitude de גָּאַל.
  issues:
  - severity: low
    issue: Sobreposição pouco natural entre «em cânticos» e «cantem».
    rationale: O hebraico distingue פִּצְחוּ, o irromper em expressão jubilosa, de רַנְּנוּ, cantar ou gritar de alegria. A formulação atual é compreensível, mas «em cânticos» já exprime o ato que o segundo imperativo explicita. «Em júbilo» preserva o primeiro movimento e permite que «cantem» traduza claramente o segundo.
  revised_text: Irrompam em júbilo, cantem juntas, ó ruínas de Jerusalém, pois Yahweh consolou seu povo; redimiu Jerusalém.
  revised_footnotes:
