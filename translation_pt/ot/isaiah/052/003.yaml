  text: כִּֽי כֹה֙ אָמַ֣ר יְהוָ֔ה חִנָּ֖ם נִמְכַּרְתֶּ֑ם וְ/לֹ֥א בְ/כֶ֖סֶף תִּגָּאֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/003.yaml
  text: 'For thus says Yahweh: “You were sold for nothing[a], and you will be redeemed without money.”'
translation:
  language: pt
  text: 'Pois assim diz Yahweh: “Vocês foram vendidos por nada e serão resgatados sem dinheiro[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sem prata”. A palavra hebraica pode designar especificamente a prata, mas aqui provavelmente se refere a dinheiro ou pagamento em geral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a declaração divina com força explicativa ou confirmatória e se encaixa naturalmente no fluxo do discurso.
- source_word: כֹה אָמַר
  choice: assim diz
  rationale: Preserva a fórmula profética tradicional e seu tom solene, sem deixar de ser clara em português moderno.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, preservando sua referência pactual.
- source_word: חִנָּם
  choice: por nada
  rationale: Expressa que nenhum pagamento foi recebido e mantém o contraste retórico com “sem dinheiro”.
- source_word: נִמְכַּרְתֶּם
  choice: vocês foram vendidos
  rationale: Entende o nifal como passivo, sem acrescentar uma nuance reflexiva que a forma não exige.
- source_word: בְכֶסֶף
  choice: sem dinheiro
  rationale: Embora כֶּסֶף possa significar especificamente “prata”, neste contexto econômico designa naturalmente dinheiro ou pagamento.
- source_word: תִּגָּאֵלוּ
  choice: serão resgatados
  rationale: Conserva a linguagem de גאל, que envolve libertação ou recuperação por um resgatador, e mantém sua ressonância teológica sem explicar além do texto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé ou SENHOR
  rationale: O texto hebraico traz diretamente o tetragrama; a transliteração preserva o nome pactual sem substituí-lo por um título.
- issue: Sentido da declaração de resgate
  choice: Manter a metáfora econômica sem especificar o mecanismo
  alternative: Entender como transação financeira literal ou explicitar uma restauração puramente figurada
  rationale: O versículo contrapõe a venda sem pagamento ao resgate sem dinheiro; a tradução conserva essa tensão sem acrescentar uma explicação doutrinária.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com “vocês” como plural não regionalmente marcado na maior parte do uso brasileiro. A formulação “assim diz” mantém o registro profético solene.
