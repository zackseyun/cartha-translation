review_pass:
  verdict: revise
  source_fidelity: A tradução preserva bem a repetição imperativa, a personificação feminina de Sião/Jerusalém, a metáfora de vestir-se de força e a linguagem de aliança e pureza. Contudo, a construção final mistura sujeito singular coletivo («o incircunciso e o impuro») com verbo no plural («entrarão»).
  naturalness: «Em você» é possível, mas destoa do registro poético e solene do versículo; «em ti» é natural no português bíblico contemporâneo e mantém a personificação da cidade. A reformulação final também resolve a concordância.
  terminology: «Sião», «Jerusalém», «incircunciso» e «impuro» são escolhas adequadas e preservam os termos e a ambiguidade do hebraico. «Cidade santa» reproduz corretamente a aposição.
  issues:
  - severity: medium
    issue: Concordância no membro final
    rationale: «Entrarão ... o incircunciso e o impuro» apresenta desacordo entre o verbo plural e os dois predicativos substantivados no singular. «Não entrará mais em ti o incircunciso nem o impuro» é gramatical, mantém o valor genérico/coletivo e exprime a negação enfática do hebraico.
  - severity: low
    issue: Registro de «em você»
    rationale: Para a cidade personificada, «em ti» se ajusta melhor ao tom elevado e poético, sem perder clareza para leitores brasileiros.
