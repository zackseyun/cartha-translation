- from: Desperte, desperte! Vista-se de sua força, Sião! Vista suas belas roupas, Jerusalém, cidade santa. Pois nunca mais entrarão em você o incircunciso e o impuro.[a]
  to: Desperte, desperte! Vista-se de sua força, Sião! Vista suas belas roupas, Jerusalém, cidade santa. Pois nunca mais entrará em ti o incircunciso nem o impuro.[a]
  rationale: A revisão limita-se a corrigir a concordância do enunciado final e a elevar levemente o registro de tratamento da cidade personificada. A coordenação negativa com «nem» conserva a força inclusiva da proibição, sem especificar se as categorias são étnicas, rituais, morais ou escatológicas. A nota foi ajustada para corresponder à formulação coordenada na tradução.
