  text: עוּרִ֥י עוּרִ֛י לִבְשִׁ֥י עֻזֵּ֖/ךְ צִיּ֑וֹן לִבְשִׁ֣י בִּגְדֵ֣י תִפְאַרְתֵּ֗/ךְ יְרוּשָׁלִַ֨ם֙ עִ֣יר הַ/קֹּ֔דֶשׁ כִּ֣י לֹ֥א יוֹסִ֛יף יָבֹא בָ֥/ךְ ע֖וֹד עָרֵ֥ל וְ/טָמֵֽא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/001.yaml
  text: Awake[a], awake; put on your strength, Zion; put on your beautiful garments, Jerusalem, the holy city[b]. For no longer shall the uncircumcised and the unclean enter you again.
translation:
  language: pt
  text: Desperte, desperte! Vista-se de sua força, Sião! Vista suas belas roupas, Jerusalém, cidade santa. Pois nunca mais entrará em ti o incircunciso nem o impuro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O incircunciso” e “o impuro” preservam a linguagem hebraica da aliança e da pureza; a expressão pode referir-se, de modo amplo, aos excluídos da santidade de Jerusalém.
    reason: cultural_note
lexical_decisions:
- source_word: עוּרִי עוּרִי
  choice: Desperte, desperte
  rationale: Os imperativos femininos singulares se dirigem à cidade personificada. A repetição preserva a urgência e a ênfase poética do hebraico.
- source_word: לִבְשִׁי עֻזֵּךְ
  choice: Vista-se de sua força
  rationale: Mantém a metáfora hebraica de revestir-se de força em português natural e elevado.
- source_word: צִיּוֹן
  choice: Sião
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: לִבְשִׁי בִּגְדֵי תִפְאַרְתֵּךְ
  choice: Vista suas belas roupas
  rationale: בִּגְדֵי designa roupas ou vestes, e תִפְאַרְתֵּךְ comunica beleza, esplendor ou magnificência. A formulação é clara e preserva a imagem de restauração.
- source_word: יְרוּשָׁלִַם עִיר הַקֹּדֶשׁ
  choice: Jerusalém, cidade santa
  rationale: Reproduz a aposição vocativa de modo natural; a ausência do artigo em português não elimina o sentido definido da expressão hebraica.
- source_word: כִּי לֹא יוֹסִיף יָבֹא בָךְ עוֹד
  choice: Pois nunca mais entrarão em você
  rationale: A construção יוֹסִיף com עוֹד expressa cessação futura enfática. “Nunca mais” comunica essa força sem redundância artificial em português.
- source_word: עָרֵל וְטָמֵא
  choice: o incircunciso e o impuro
  rationale: Preserva, no singular coletivo do hebraico, tanto a linguagem da aliança quanto a da pureza, sem restringir seu alcance a uma interpretação específica.
theological_decisions:
- issue: Sentido de “o incircunciso e o impuro” em relação a Jerusalém
  choice: Manter a linguagem de aliança e pureza sem definir se a referência é étnica, ritual, moral ou escatológica.
  alternative: Explicitar que se trata de invasores estrangeiros, pessoas ritualmente impuras ou uma imagem escatológica de santidade perfeita.
  rationale: O versículo emprega categorias bíblicas reconhecíveis, mas não delimita sozinho seu alcance. A tradução conserva essa abertura e tensão teológica.
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo e personificação poética preservados. Preferiu-se “roupas” a “vestes” por sua legibilidade ampla, sem perder o tom solene do contexto.
