    issue: «No início» é temporalmente mais amplo que בָּרִאשֹׁנָה neste contexto.
    rationale: A expressão pode ser entendida como o começo absoluto da história. «Inicialmente» mantém a referência à primeira situação evocada, em contraste com a opressão assíria.
  - severity: low
    issue: «Depois» torna explícita uma sequência que não é lexicalmente marcada no hebraico.
    rationale: A conjunção וְ introduz a afirmação sobre a Assíria; a sucessão histórica é compreensível sem acrescentar o advérbio.
  revised_text: 'Pois assim diz o Senhor Yahweh: “Inicialmente, meu povo desceu ao Egito para morar ali como estrangeiro; e a Assíria o oprimiu sem motivo[a].”'
