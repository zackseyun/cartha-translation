source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה מִצְרַ֛יִם יָֽרַד עַמִּ֥/י בָ/רִֽאשֹׁנָ֖ה לָ/ג֣וּר שָׁ֑ם וְ/אַשּׁ֖וּר בְּ/אֶ֥פֶס עֲשָׁקֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/004.yaml
  text: 'For thus says the Lord GOD: My people went down at first to Egypt to sojourn there[b][a], and Assyria oppressed them without cause.'
translation:
  language: pt
  text: 'Pois assim diz o Senhor Yahweh: “Inicialmente, meu povo desceu ao Egito para morar ali como estrangeiro; e a Assíria o oprimiu sem motivo[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por nada”, “gratuitamente” ou “sem pagamento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Reproduz o título אֲדֹנָי e mantém explicitamente o nome divino יהוה, evitando substituir o nome da aliança por um título.
- source_word: מִצְרַיִם
  choice: Egito
  rationale: Forma portuguesa consagrada do topônimo.
- source_word: יָרַד
  choice: desceu
  rationale: Preserva o modo hebraico habitual de descrever a ida ao Egito e soa natural em português.
- source_word: עַמִּי
  choice: meu povo
  rationale: Tradução direta da designação coletiva e pactual.
- source_word: בָרִאשֹׁנָה
  choice: no início
  rationale: Marca esse episódio como a primeira situação histórica mencionada, em contraste com a opressão assíria posterior.
- source_word: לָגוּר
  choice: para morar ali como estrangeiro
  rationale: Expressa a ideia de residir fora da própria terra, como estrangeiro, nuance central de גור, sem recorrer ao pouco corrente 'peregrinar'.
- source_word: אַשּׁוּר
  choice: a Assíria
  rationale: O contexto aponta para a nação ou potência assíria.
- source_word: בְּאֶפֶס
  choice: sem motivo
  rationale: Comunica a ideia provável de opressão gratuita ou injustificada; a possível nuance econômica é preservada em nota.
- source_word: עֲשָׁקוֹ
  choice: o oprimiu
  rationale: Mantém o sufixo masculino singular do hebraico e remete naturalmente ao substantivo coletivo singular 'meu povo'.
theological_decisions:
- issue: Representação do nome divino no título אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR
  rationale: A tradução distingue o título אֲדֹנָי do nome pessoal יהוה e deixa visível o nome divino presente no texto hebraico.
- issue: Número do pronome em עֲשָׁקוֹ
  choice: o oprimiu
  alternative: oprimiu-os
  rationale: O hebraico emprega sufixo singular e apresenta Israel corporativamente como 'meu povo'; o português permite conservar essa personificação coletiva com clareza.
- issue: Sentido de בְּאֶפֶס
  choice: sem motivo
  alternative: sem pagamento
  rationale: O contexto favorece a ideia de opressão sem causa ou gratuita, mas a formulação hebraica admite uma leitura ligada à ausência de pagamento, registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A expressão 'morar ali como estrangeiro' explicita de modo natural a condição indicada por גור. O pronome singular 'o' conserva a referência corporativa a 'meu povo'. O conector 'depois' torna perceptível o contraste histórico implícito entre o episódio egípcio inicial e a opressão assíria.
