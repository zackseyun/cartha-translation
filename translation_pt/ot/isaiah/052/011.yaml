id: ISA.52.11
reference: Isaiah 52:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ס֤וּרוּ ס֨וּרוּ֙ צְא֣וּ מִ/שָּׁ֔ם טָמֵ֖א אַל תִּגָּ֑עוּ צְא֣וּ מִ/תּוֹכָ֔/הּ הִבָּ֕רוּ נֹשְׂאֵ֖י כְּלֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/011.yaml
  text: Turn away[a], turn away; go out from there. Touch no unclean thing. Go out from her midst; purify yourselves[c][b], you who carry the vessels of Yahweh.
translation:
  language: pt
  text: Afastem-se[a], afastem-se; saiam de lá. Não toquem em nada impuro. Saiam do meio dela[b]; purifiquem-se[c], vocês que carregam os utensílios de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Partam, partam”. A repetição do imperativo intensifica o chamado à separação.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “do meio dela”, provavelmente em referência à cidade personificada no feminino.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “estejam limpos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּרוּ
  choice: Afastem-se
  rationale: O imperativo plural, repetido para dar urgência, pede separação ou afastamento. “Afastem-se” distingue este verbo do צְאוּ seguinte, que expressa diretamente a saída.
- source_word: צְאוּ
  choice: saiam
  rationale: Imperativo plural de יצא; “saiam” transmite de modo direto e natural o movimento para fora.
- source_word: מִשָּׁם
  choice: de lá
  rationale: Expressão adverbial simples que indica o lugar a ser deixado.
- source_word: טָמֵא
  choice: nada impuro
  rationale: O adjetivo funciona como substantivo no contexto da proibição. A formulação preserva a linguagem de impureza sem determinar se ela é exclusivamente ritual ou moral.
- source_word: אַל תִּגָּעוּ
  choice: Não toquem
  rationale: Reproduz com clareza a construção proibitiva hebraica dirigida a um grupo.
- source_word: מִתּוֹכָהּ
  choice: do meio dela
  rationale: Mantém o sufixo feminino singular do hebraico, provavelmente uma referência à cidade personificada, sem substituí-lo por uma forma neutra.
- source_word: הִבָּרוּ
  choice: purifiquem-se
  rationale: O imperativo, no contexto dos utensílios sagrados, tem sentido de limpeza ou purificação. “Purifiquem-se” conserva a dimensão cultual sem excluir a moral.
- source_word: נֹשְׂאֵי
  choice: vocês que carregam
  rationale: O particípio é empregado como vocativo; esta construção é clara e corrente em português.
- source_word: כְּלֵי יְהוָה
  choice: os utensílios de Yahweh
  rationale: כְּלֵי designa aqui objetos ou utensílios ligados ao culto. “Utensílios” é compreensível e adequado ao contexto do templo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva no texto o nome divino pessoal representado pelo Tetragrama.
theological_decisions:
- issue: Natureza da linguagem de impureza
  choice: Manter “impuro” e “purifiquem-se” como linguagem simultaneamente cultual e moral.
  alternative: Interpretar a passagem apenas como pureza ritual ou apenas como separação ética do pecado babilônico.
  rationale: O transporte dos utensílios de Yahweh evoca santidade cultual, enquanto o chamado para sair da cidade também possui força moral. A tradução conserva essa amplitude.
- issue: Referente feminino em מִתּוֹכָהּ
  choice: Preservar “dela”.
  alternative: Neutralizar como “desse lugar” ou identificar explicitamente a cidade pelo nome.
  rationale: O hebraico apresenta um referente feminino singular, provavelmente a cidade personificada, mas o versículo não a nomeia expressamente; a tradução mantém essa ambiguidade contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas verbais no plural brasileiro. A repetição e os imperativos breves preservam a urgência do hebraico. “Utensílios” comunica o contexto sagrado com mais naturalidade contemporânea do que “vasos”, sem especificar indevidamente o tipo de objeto.
