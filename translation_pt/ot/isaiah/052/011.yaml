  source_fidelity: O texto reproduz com precisão a sequência imperativa e a repetição enfática de סוּרוּ, distingue adequadamente “Afastem-se” de “saiam”, preserva a proibição de tocar no que é impuro e mantém o referente feminino não explicitado em “dela”. “Purifiquem-se” é uma tradução segura de הִבָּרוּ no contexto cultual, sem reduzir a linguagem à pureza meramente ritual ou meramente moral. “Utensílios de Yahweh” comunica adequadamente כְּלֵי יְהוָה no contexto dos objetos do culto.
  naturalness: O português é moderno, claro e digno. Os imperativos plurais são naturais e a cadência breve — “Afastem-se, afastem-se; saiam de lá” — conserva a urgência do hebraico. “Vocês que carregam” é uma solução fluente para o particípio vocativo.
  terminology: “Impuro”, “purifiquem-se” e “Yahweh” mantêm termos importantes sem interpretação confessional indevida. “Utensílios” é uma designação compreensível para os objetos associados ao culto e não restringe indevidamente a natureza dos כֵּלִים.
