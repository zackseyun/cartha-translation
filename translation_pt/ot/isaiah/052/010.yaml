source:
  edition: WLC
  text: חָשַׂ֤ף יְהוָה֙ אֶת זְר֣וֹעַ קָדְשׁ֔/וֹ לְ/עֵינֵ֖י כָּל הַ/גּוֹיִ֑ם וְ/רָאוּ֙ כָּל אַפְסֵי אָ֔רֶץ אֵ֖ת יְשׁוּעַ֥ת אֱלֹהֵֽי/נוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/052/010.yaml
  text: Yahweh has bared his holy arm before the eyes of all the nations[c][b][a], and all the ends of the earth will see the salvation of our God.
translation:
  language: pt
  text: Yahweh pôs[a] o seu santo braço a descoberto diante dos olhos de todas as nações[b], e todos os confins da terra verão a salvação[c] do nosso Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «expôs» ou «desnudou». O verbo hebraico evoca a imagem de descobrir o braço para uma ação decisiva.
    reason: lexical_alternative
  - marker: b
    text: Ou «à vista de todas as nações».
    reason: lexical_alternative
  - marker: c
    text: Ou «o livramento».
    reason: lexical_alternative
lexical_decisions:
- source_word: חָשַׂף
  choice: desnudou
  rationale: O verbo significa descobrir, expor ou pôr a descoberto. “Desnudou” preserva a imagem concreta de expor o braço para agir de modo decisivo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: זְרוֹעַ קָדְשׁוֹ
  choice: o seu santo braço
  rationale: Mantém a imagem antropomórfica hebraica do poder divino em ação salvadora e conserva o qualificativo “santo”.
- source_word: לְעֵינֵי
  choice: diante dos olhos de
  rationale: Preserva a força visual e pública da expressão hebraica, embora “à vista de” também seja idiomático.
- source_word: כָּל הַגּוֹיִם
  choice: todas as nações
  rationale: Neste contexto, גּוֹיִם designa amplamente os povos do mundo, e não apenas os gentios em contraste com Israel.
- source_word: וְרָאוּ
  choice: verão
  rationale: Embora a forma verbal seja qatal, no discurso profético ela apresenta o resultado futuro da ação já anunciada como realizada.
- source_word: כָּל אַפְסֵי אָרֶץ
  choice: todos os confins da terra
  rationale: Reproduz a expressão hebraica que abrange as regiões mais distantes e, por extensão, o mundo inteiro.
- source_word: יְשׁוּעַת
  choice: a salvação
  rationale: O substantivo pode indicar salvação ou livramento; “salvação” preserva sua amplitude teológica e suas ressonâncias bíblicas.
- source_word: אֱלֹהֵינוּ
  choice: do nosso Deus
  rationale: Mantém a perspectiva pactual na primeira pessoa do plural presente no hebraico.
theological_decisions:
- issue: Linguagem antropomórfica sobre a ação divina
  choice: Manter a metáfora concreta “o seu santo braço”.
  alternative: Interpretar como “o seu santo poder”.
  rationale: O hebraico emprega explicitamente uma imagem corporal. Preservá-la mantém a força poética e evita reduzir a imagem a uma explicação abstrata.
- issue: Forma de verter o nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto traz o nome divino, não um título. “Yahweh” procura representar diretamente o tetragrama e preservar seu caráter de nome pessoal.
- issue: Valor temporal de וְרָאוּ
  choice: 'Futuro: “verão”.'
  alternative: 'Perfeito: “viram” ou “têm visto”.'
  rationale: A forma hebraica permite tensão entre aspecto perfeito e referência profética; no contexto, o futuro em português expressa com naturalidade o resultado universal que seguirá à ação declarada de Yahweh.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e as imagens poéticas do hebraico foram preservadas sempre que soam naturais; “desnudou” mantém a vivacidade da metáfora sem convertê-la em uma afirmação abstrata sobre poder.
