  text: shall I not do to Jerusalem and her idols just as I did to Samaria and her idols?[a]
translation:
  language: pt
  text: Não farei eu a Jerusalém e aos seus ídolos o mesmo que fiz a Samaria e aos seus ídolos?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico emprega duas palavras diferentes: para Samaria, “ídolos” (אֱלִילִים); para Jerusalém, “imagens/ídolos” (עֲצַבִּים).'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Não farei eu...?
  rationale: Introduz uma pergunta retórica que espera resposta afirmativa. A construção portuguesa mantém a força retórica e o sentido futuro do verbo.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: o mesmo que
  rationale: Expressa com naturalidade em português a correlação comparativa hebraica, estabelecendo o paralelo entre o que ocorreu com Samaria e o que ocorrerá com Jerusalém.
- source_word: עָשִׂיתִי
  choice: fiz
  rationale: O perfeito indica a ação já realizada contra Samaria; o pretérito perfeito é claro e direto.
- source_word: לְשֹׁמְרוֹן
  choice: a Samaria
  rationale: Com עשה, a preposição marca a entidade afetada. A formulação conserva a construção sem explicitar além do necessário o sentido hostil dado pelo contexto.
- source_word: אֱלִילֶיהָ
  choice: seus ídolos
  rationale: אֱלִילִים designa ídolos e pode trazer uma conotação depreciativa de inutilidade; “ídolos” é a tradução corrente e inteligível.
- source_word: אֶעֱשֶׂה
  choice: farei
  rationale: O imperfeito na primeira pessoa aponta para ação futura ou pretendida dentro da pergunta retórica.
- source_word: לִירוּשָׁלַ͏ִם
  choice: a Jerusalém
  rationale: Mantém o paralelismo com “a Samaria”; o caráter adverso da ação é inferido do contexto.
- source_word: עֲצַבֶּיהָ
  choice: seus ídolos
  rationale: O termo se refere a imagens cultuais ou ídolos. A mesma tradução no corpo do texto reforça o paralelo retórico, enquanto a nota registra a diferença lexical.
theological_decisions:
- issue: Tradução dos dois termos hebraicos distintos para ídolos (אֱלִילִים e עֲצַבִּים)
  choice: Traduzir ambos por “ídolos” no texto principal
  alternative: Traduzir o segundo por “imagens” ou “imagens esculpidas”
  rationale: A repetição de “ídolos” preserva de modo claro e vigoroso a equivalência retórica entre Samaria e Jerusalém. A nota mantém disponível a distinção lexical hebraica sem sobrecarregar o versículo.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. A ordem “Não farei eu...?” conserva o tom retórico e solene sem recorrer a linguagem arcaica.
