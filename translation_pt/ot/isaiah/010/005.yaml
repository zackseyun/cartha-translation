  yaml_path: translation/ot/isaiah/010/005.yaml
  text: Woe to Assyria[a], the rod of my anger[b]; the staff in their hand is my wrath.
translation:
  language: pt
  text: Ai da Assíria, vara da minha ira! O bastão na mão deles[a] é o meu furor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “na mão deles”. O texto traz “mão” no singular com um pronome plural, provavelmente referindo-se coletivamente aos assírios. Algumas traduções regularizam a expressão como “na mão dela” ou “em sua mão”.'
    reason: textual_grammar
lexical_decisions:
- source_word: הוֹי
  choice: Ai de
  rationale: Interjeição profética que introduz ameaça e juízo; “Ai de” conserva a força solene e é natural em português.
- source_word: אַשּׁוּר
  choice: Assíria
  rationale: Forma portuguesa consagrada do nome da nação.
- source_word: שֵׁבֶט
  choice: vara
  rationale: Designa aqui um instrumento de golpe, em paralelo com “bastão”, e mantém a metáfora da Assíria como instrumento da ira divina.
- source_word: אַפִּי
  choice: minha ira
  rationale: Traduz o sentido idiomático de אַף, literalmente associado ao nariz, mas usado para ira; a formulação é clara e preserva o paralelismo.
- source_word: וּמַטֶּה
  choice: o bastão
  rationale: “Bastão” distingue o segundo termo de “vara” sem desfazer o paralelismo entre os instrumentos.
- source_word: בְיָדָם
  choice: na mão deles
  rationale: Preserva tanto o substantivo singular “mão” quanto o sufixo masculino plural “deles” do Texto Massorético; a nota esclarece a aparente mudança de número.
- source_word: זַעְמִי
  choice: o meu furor
  rationale: Expressa a intensidade da indignação divina e evita repetir “ira”, mantendo a intensificação poética do segundo membro.
theological_decisions:
- issue: A Assíria como instrumento do juízo divino
  choice: A metáfora apresenta diretamente a Assíria como vara da ira de Deus e seu bastão como expressão do furor divino.
  alternative: Tratar a Assíria apenas como agente independente ou tornar explícita uma doutrina mais ampla sobre causalidade divina.
  rationale: O hebraico afirma a instrumentalidade da Assíria sem explicar ou eliminar a tensão entre a ação divina e a responsabilidade do império; a tradução conserva essa tensão.
- issue: Referente do plural em בְיָדָם
  choice: Manter “deles”, entendendo a Assíria coletivamente como seus integrantes ou agentes.
  alternative: Regularizar para “na mão dela” ou “em sua mão”, concordando gramaticalmente com “Assíria”.
  rationale: A forma hebraica traz inequivocamente um sufixo de terceira pessoa masculina plural, embora o antecedente imediato seja o nome coletivo Assíria.
translation_notes:
  register: Português moderno, solene e acessível. Mantém-se a concisão poética do oráculo, com “vara” e “bastão” como termos paralelos e “ira”/“furor” como intensificação. A pontuação em duas exclamações implícitas pela frase conserva a força profética sem acrescentar explicação ao corpo do versículo.
