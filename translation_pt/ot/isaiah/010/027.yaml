base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/027.yaml
  text: And in that day his burden will depart from your shoulder[a], and his yoke from your neck; and the yoke will be broken because of fatness.
translation:
  language: pt
  text: Naquele dia, a carga dele será tirada do seu ombro, e o jugo dele, do seu pescoço; o jugo será quebrado por causa da gordura.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por causa do óleo”; tradicionalmente, também traduzido como “por causa da unção”.
    reason: Leitura alternativa da difícil expressão hebraica מִפְּנֵי שָׁמֶן.
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Expressa de modo natural em português a fórmula temporal profética, sem recorrer a uma construção arcaica.
- source_word: יָסוּר סֻבֳּלוֹ
  choice: a carga dele será tirada
  rationale: O verbo pode significar afastar-se ou ser removido; a forma passiva idiomática comunica claramente a retirada da carga opressora.
- source_word: מֵעַל שִׁכְמֶךָ
  choice: do seu ombro
  rationale: Preserva a imagem corporal e o singular hebraico em português natural.
- source_word: וְעֻלּוֹ מֵעַל צַוָּארֶךָ
  choice: e o jugo dele, do seu pescoço
  rationale: Mantém a metáfora agrícola da dominação e o paralelismo com a carga retirada do ombro; a elipse verbal é clara em português.
- source_word: וְחֻבַּל עֹל
  choice: o jugo será quebrado
  rationale: A tradução concreta se harmoniza com a imagem do jugo danificado e tornado inútil.
- source_word: מִפְּנֵי שָׁמֶן
  choice: por causa da gordura
  rationale: Preserva a formulação causal e o sentido lexical básico de שָׁמֶן, sem impor a interpretação tradicional de 'unção'.
theological_decisions:
- issue: Interpretação de מִפְּנֵי שָׁמֶן
  choice: por causa da gordura
  alternative: por causa do óleo; tradicionalmente, por causa da unção
  rationale: A expressão hebraica é difícil. שָׁמֶן pode designar gordura ou óleo, mas o contexto imediato não menciona explicitamente uma unção. A tradução principal conserva a imagem literal e a nota registra as alternativas sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “dele” esclarece que a carga e o jugo pertencem ao opressor, enquanto “seu” se dirige ao povo. A nota foi posicionada após a expressão ambígua a que se refere.
