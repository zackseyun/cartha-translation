  yaml_path: translation/ot/isaiah/010/009.yaml
  text: Is not Calno like Carchemish? Is not Hamath like Arpad? Is not Samaria like Damascus?[a]
translation:
  language: pt
  text: Calno não é como Carquemis? Hamate não é como Arpade? Samaria não é como Damasco?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em algumas traduções, Calno aparece como “Calné”, uma forma tradicional variante do topônimo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא / אִם לֹא
  choice: Não é
  rationale: As formas introduzem perguntas retóricas que esperam concordância; “Não é” preserva a concisão, a força do desafio e o paralelismo.
- source_word: כְּ/כַרְכְּמִישׁ כַּלְנוֹ
  choice: Calno como Carquemis
  rationale: O prefixo כְּ marca comparação. A ordem natural em português apresenta primeiro Calno, a cidade avaliada, e depois Carquemis, o termo de comparação.
- source_word: כַּלְנוֹ
  choice: Calno
  rationale: Transliteração direta da forma do nome próprio no texto hebraico deste versículo.
- source_word: כַּרְכְּמִישׁ
  choice: Carquemis
  rationale: Forma portuguesa corrente e legível do topônimo antigo.
- source_word: כְ/אַרְפַּד חֲמָת
  choice: Hamate como Arpade
  rationale: Mantém a comparação marcada por כְ e reorganiza os elementos segundo a sintaxe natural do português.
- source_word: חֲמָת
  choice: Hamate
  rationale: Forma tradicional e amplamente reconhecível em português.
- source_word: אַרְפַּד
  choice: Arpade
  rationale: Transliteração adaptada à ortografia e à pronúncia portuguesas.
- source_word: כְ/דַמֶּשֶׂק שֹׁמְרוֹן
  choice: Samaria como Damasco
  rationale: Expressa com clareza a comparação final e preserva a estrutura retórica paralela.
- source_word: דַּמֶּשֶׂק
  choice: Damasco
  rationale: Forma portuguesa estabelecida do topônimo.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Forma portuguesa estabelecida; no contexto, designa a capital e pode representar por extensão o reino do norte.
