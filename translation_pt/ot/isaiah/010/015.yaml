  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֲ/יִתְפָּאֵר֙ הַ/גַּרְזֶ֔ן עַ֖ל הַ/חֹצֵ֣ב בּ֑/וֹ אִם יִתְגַּדֵּ֤ל הַ/מַּשּׂוֹר֙ עַל מְנִיפ֔/וֹ כְּ/הָנִ֥יף שֵׁ֨בֶט֙ וְ/אֶת מְרִימָ֔י/ו כְּ/הָרִ֥ים מַטֶּ֖ה לֹא עֵֽץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/015.yaml
  text: Does the axe boast over the one who chops with it? Or does the saw magnify itself over the one who wields it? As if a rod were to wield the one who lifts it up[a], or as if a staff were to lift up one who is not wood!
translation:
  language: pt
  text: Será que o machado se vangloria acima de quem corta com ele? Ou a serra se engrandece acima de quem a maneja? É como se uma vara manejasse quem a levanta, ou como se um bastão levantasse quem não é madeira![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “ou como se um bastão levantasse não madeira”. A frase final é elíptica e também pode ser entendida como “o que não é madeira”.'
    reason: Leitura alternativa de uma expressão hebraica elíptica.
lexical_decisions:
- source_word: יִתְפָּאֵר
  choice: se vangloria
  rationale: O hitpael expressa autoexaltação; «se vangloria» é natural, atual e mantém a força da pergunta retórica.
- source_word: הַגַּרְזֶן
  choice: o machado
  rationale: Equivalente corrente para a ferramenta cortante.
- source_word: הַחֹצֵב בּוֹ
  choice: quem corta com ele
  rationale: Conserva tanto o agente expresso pelo particípio quanto o valor instrumental de בּוֹ, em português natural.
- source_word: יִתְגַּדֵּל
  choice: se engrandece
  rationale: Preserva a ideia reflexiva de fazer-se grande e o paralelismo com «se vangloria».
- source_word: הַמַּשּׂוֹר
  choice: a serra
  rationale: Equivalente lexical direto da ferramenta mencionada em paralelo com o machado.
- source_word: מְנִיפוֹ
  choice: quem a maneja
  rationale: O termo deriva da ideia de mover ou brandir; «maneja» comunica com naturalidade o uso da ferramenta sem especificar demais o movimento.
- source_word: כְּהָנִיף שֵׁבֶט
  choice: Seria como se uma vara manejasse
  rationale: A construção é elíptica e difícil, mas apresenta a inversão absurda entre instrumento e agente; a oração finita torna essa inversão inteligível.
- source_word: שֵׁבֶט
  choice: uma vara
  rationale: Mantém um implement rígido e permite distingui-lo de מַטֶּה, traduzido como «bastão».
- source_word: מְרִימָיו
  choice: quem a levanta
  rationale: Apesar da forma morfológica plural, o contexto apresenta um agente genérico singular; a formulação conserva a ação de erguer.
- source_word: כְּהָרִים מַטֶּה
  choice: ou como se um bastão levantasse
  rationale: Mantém a segunda comparação de agência invertida e o paralelismo com a vara.
- source_word: מַטֶּה
  choice: um bastão
  rationale: Equivalente natural, semanticamente próximo de שֵׁבֶט, mas lexicalmente distinto de «vara».
- source_word: לֹא עֵץ
  choice: quem não é madeira
  rationale: Reproduz de perto a expressão hebraica deliberadamente concisa, deixando a referência humana implícita sem eliminar sua estranheza poética.
theological_decisions:
- issue: Interpretação da expressão final elíptica לֹא עֵץ
  choice: «quem não é madeira», entendendo o objeto como o agente humano contrastado com o instrumento de madeira
  alternative: «o que não é madeira»; ou «um bastão que não é de madeira»
  rationale: O contexto contrapõe o instrumento ao seu usuário, ilustrando o absurdo da autoexaltação da Assíria diante de Deus. A tradução mantém a formulação incomum do hebraico, enquanto a nota registra a ambiguidade sem impor uma solução denominacional.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. As perguntas retóricas e a personificação dos instrumentos foram preservadas; «vara» e «bastão» distinguem os dois substantivos hebraicos próximos. O marcador [a] aparece no texto principal.
