  text: וּ/מַֽה תַּעֲשׂוּ֙ לְ/י֣וֹם פְּקֻדָּ֔ה וּ/לְ/שׁוֹאָ֖ה מִ/מֶּרְחָ֣ק תָּב֑וֹא עַל מִי֙ תָּנ֣וּסוּ לְ/עֶזְרָ֔ה וְ/אָ֥נָה תַעַזְב֖וּ כְּבוֹדְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/003.yaml
  text: What will you do on the day of punishment[a], and in the devastation that comes from far away? To whom will you flee for help, and where will you leave your wealth?
translation:
  language: pt
  text: O que vocês farão no dia do castigo e na devastação que virá de longe? A quem fugirão em busca de ajuda, e onde deixarão a sua riqueza[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a sua glória” ou “a sua honra”. O termo hebraico pode se referir à honra ou glória e, neste contexto, também a bens valiosos ou riqueza.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדָּה
  choice: castigo
  rationale: Neste oráculo de juízo, o termo indica uma intervenção para pedir contas e punir. “Castigo” expressa esse sentido com clareza em português atual.
- source_word: שׁוֹאָה
  choice: devastação
  rationale: O substantivo denota calamidade destrutiva, ruína ou destruição; “devastação” preserva sua força e se encaixa naturalmente no contexto.
- source_word: מִמֶּרְחָק
  choice: de longe
  rationale: Preserva de modo idiomático a noção espacial de uma calamidade que se origina a grande distância.
- source_word: תָּבוֹא
  choice: virá
  rationale: O imperfeito hebraico tem sentido futuro no contexto das perguntas sobre o juízo vindouro.
- source_word: תָּנוּסוּ
  choice: fugirão
  rationale: O verbo descreve fuga ou tentativa de escapar; “fugirão” mantém a intensidade do cenário de juízo.
- source_word: לְעֶזְרָה
  choice: em busca de ajuda
  rationale: A formulação é natural em português e explicita a finalidade da fuga sem acrescentar conteúdo ao hebraico.
- source_word: אָנָה
  choice: onde
  rationale: Equivalente português direto e atual para o interrogativo de lugar.
- source_word: תַעַזְבוּ
  choice: deixarão
  rationale: Mantém o sentido amplo de deixar ou abandonar, sem determinar além do texto o destino dado ao que valorizam.
- source_word: כְּבוֹדְכֶם
  choice: a sua riqueza
  rationale: Embora o sentido básico seja “glória” ou “honra”, no contexto a palavra pode designar concretamente bens valiosos. “Riqueza” torna provável esse referente, enquanto a nota preserva a ambiguidade lexical genuína.
theological_decisions:
- issue: Sentido concreto ou abstrato de כְּבוֹדְכֶם no oráculo de juízo
  choice: a sua riqueza
  alternative: a sua glória; a sua honra
  rationale: A pergunta parece tratar daquilo que os poderosos valorizam e tentariam preservar diante da calamidade. O sentido concreto se ajusta bem ao contexto, mas os sentidos mais literais continuam possíveis e, por isso, são registrados na nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas verbais na terceira pessoa do plural e uso de “vocês” para explicitar o destinatário plural. A sequência de perguntas retóricas e o tom urgente do juízo profético foram preservados. O marcador da nota foi colocado junto de “riqueza”, termo ao qual a alternativa lexical realmente se refere.
