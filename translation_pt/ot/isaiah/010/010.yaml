base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/010.yaml
  text: As my hand has reached the kingdoms of the idols[a], whose carved images were greater than those of Jerusalem and Samaria,
translation:
  language: pt
  text: Assim como a minha mão alcançou os reinos dos ídolos, cujas imagens esculpidas eram maiores do que as de Jerusalém e de Samaria,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Assim como a minha mão encontrou os reinos dos ídolos, e suas imagens esculpidas [eram maiores] do que as de Jerusalém e de Samaria”. O hebraico é elíptico; o sentido é provavelmente comparativo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Assim como
  rationale: Introduz a comparação que prossegue no versículo seguinte e reproduz de modo natural a força comparativa do hebraico.
- source_word: מָצְאָה יָדִי
  choice: a minha mão alcançou
  rationale: A expressão diz literalmente que a mão 'encontrou', mas, no contexto da expansão imperial, indica chegar até esses reinos e obter poder sobre eles. 'Alcançou' conserva a metáfora sem explicitar além do necessário a ideia de conquista.
- source_word: לְמַמְלְכֹת הָאֱלִיל
  choice: os reinos dos ídolos
  rationale: A preposição é regida idiomaticamente pelo verbo, e em português o sintagma funciona naturalmente como objeto de 'alcançou'. 'Ídolos' traduz com clareza o termo hebraico pejorativo אֱלִיל.
- source_word: וּפְסִילֵיהֶם
  choice: cujas imagens esculpidas
  rationale: Explicita de maneira natural a relação possessiva com os reinos. 'Imagens esculpidas' é uma equivalência moderna e transparente para פְסִילִים.
- source_word: מִירוּשָׁלִַם וּמִשֹּׁמְרוֹן
  choice: do que as de Jerusalém e de Samaria
  rationale: O מִן tem sentido comparativo na construção elíptica. A expressão 'as de' fornece em português o elemento subentendido — as imagens — sem acrescentar conteúdo novo.
theological_decisions:
- issue: Se a comparação implícita na frase final deve ser explicitada
  choice: 'Traduzir a elipse comparativamente: ''cujas imagens esculpidas eram maiores do que as de Jerusalém e de Samaria'''
  alternative: 'Traduzir de forma mais literal: ''e suas imagens esculpidas, de Jerusalém e de Samaria'''
  rationale: O hebraico é elíptico, mas o contexto apresenta a jactância do rei assírio e favorece claramente uma comparação entre as imagens dos reinos conquistados e as de Jerusalém e Samaria. A nota preserva a forma mais literal e a ambiguidade estrutural.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A vírgula final foi mantida porque o pensamento continua no versículo seguinte. A formulação principal explicita a comparação exigida pelo contexto, enquanto a nota registra a construção hebraica mais literal.
