  text: כִּי ע֖וֹד מְעַ֣ט מִזְעָ֑ר וְ/כָ֣לָה זַ֔עַם וְ/אַפִּ֖/י עַל תַּבְלִיתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/025.yaml
  text: For in just a very little while[a], indignation will come to an end, and my anger will be for their destruction.
translation:
  language: pt
  text: Pois, dentro de muito pouco tempo, a indignação chegará ao fim, e a minha ira terá por alvo a destruição deles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para o fim deles”, “para a aniquilação deles” ou “para o extermínio deles”. O substantivo hebraico é raro, e seu sentido exato é discutido; no contexto, aponta para a queda do opressor ou dos opressores.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou garantia da promessa anterior e mantém de modo natural a ligação discursiva.
- source_word: עוֹד מְעַט מִזְעָר
  choice: dentro de muito pouco tempo
  rationale: Expressa a curtíssima duração ainda restante e preserva a ênfase produzida pelos termos próximos מְעַט e מִזְעָר.
- source_word: וְכָלָה
  choice: chegará ao fim
  rationale: O perfeito em contexto profético tem sentido futuro; a formulação comunica naturalmente a cessação da indignação.
- source_word: זַעַם
  choice: a indignação
  rationale: Mantém o tom elevado e distingue este termo de אַפִּי, traduzido como 'minha ira'.
- source_word: וְאַפִּי
  choice: e a minha ira
  rationale: Traduz claramente o sentido idiomático de אַף e conserva a primeira pessoa do sufixo.
- source_word: עַל תַּבְלִיתָם
  choice: se voltará para a destruição deles
  rationale: Comunica que a ira passa a ter como alvo o fim dos opressores, preservando o sufixo pronominal. A rara palavra תַּבְלִית admite alguma incerteza, registrada em nota.
theological_decisions:
- issue: Referente de 'deles'
  choice: Os inimigos ou opressores, sobretudo a Assíria no contexto imediato
  alternative: Entender a expressão de modo mais abstrato, como 'para a destruição', sem referente pessoal fortemente definido
  rationale: O contexto contrasta o término da indignação contra o povo de Deus com a ira dirigida ao opressor; a tradução conserva, porém, o pronome hebraico sem inserir 'Assíria' no texto.
- issue: Relação sintática de עַל com תַּבְלִיתָם
  choice: A ira se volta para a destruição deles
  alternative: A ira chega ao fim quando eles forem destruídos, ou é despendida contra aquilo que fizeram
  rationale: A construção hebraica é concisa e difícil. A opção escolhida se ajusta ao contexto da queda do opressor, sem apresentar a rara palavra final como semanticamente inequívoca.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. 'Pois' preserva a conexão argumentativa; 'dentro de muito pouco tempo' soa natural e retém a ênfase temporal. A nota foi colocada após a expressão ambígua a que se refere.
