  - severity: medium
    issue: A alternativa de nota “para consumi-los” não corresponde formalmente às demais alternativas do substantivo hebraico.
    rationale: O original traz um substantivo com sufixo possessivo, não um infinitivo com objeto. A nota revisada conserva alternativas nominais e explicita o sufixo.
