  source_fidelity: 'A primeira oração traduz bem כִּי עוֹד מְעַט מִזְעָר e וְכָלָה זַעַם. Na segunda, “se voltará” é uma explicitação interpretativa: o hebraico elíptico diz literalmente que a ira de Deus será/estará “sobre/para” תַּבְלִיתָם. “Terá por alvo” comunica a relação indicada por עַל sem introduzir tão fortemente a ideia de uma mudança de direção.'
  naturalness: O português é claro, moderno e de registro adequado. “Dentro de muito pouco tempo” é natural; “terá por alvo a destruição deles” é igualmente natural e mais próximo da construção concisa do original.
  terminology: “Indignação” e “ira” preservam adequadamente a distinção estilística entre זַעַם e אַפִּי. A nota deve manter alternativas nominais para o substantivo raro תַּבְלִיתָם; “para consumi-los” muda indevidamente a forma e a relação sintática da alternativa.
