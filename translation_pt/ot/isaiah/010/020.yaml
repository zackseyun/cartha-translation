  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא לֹֽא יוֹסִ֨יף ע֜וֹד שְׁאָ֤ר יִשְׂרָאֵל֙ וּ/פְלֵיטַ֣ת בֵּֽית יַעֲקֹ֔ב לְ/הִשָּׁעֵ֖ן עַל מַכֵּ֑/הוּ וְ/נִשְׁעַ֗ן עַל יְהוָ֛ה קְד֥וֹשׁ יִשְׂרָאֵ֖ל בֶּ/אֱמֶֽת׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/020.yaml
  text: And in that day the remnant of Israel and the survivors of the house of Jacob will no longer continue to lean on the one who struck them, but will lean on the LORD, the Holy One of Israel, in truth.
translation:
  language: pt
  text: E, naquele dia, o remanescente de Israel e os sobreviventes da casa de Jacó não continuarão a se apoiar naquele que os feriu, mas se apoiarão no SENHOR, o Santo de Israel, com fidelidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “verdadeiramente”, “de fato” ou “em verdade”.'
    reason: בֶּאֱמֶת possui amplitude semântica entre verdade, genuinidade, firmeza e fidelidade; a nota preserva essa ambiguidade legítima.
lexical_decisions:
- source_word: שְׁאָר יִשְׂרָאֵל
  choice: o remanescente de Israel
  rationale: Preserva a expressão profética e coletiva do hebraico em linguagem bíblica corrente e compreensível.
- source_word: פְלֵיטַת בֵּית יַעֲקֹב
  choice: os sobreviventes da casa de Jacó
  rationale: פְלֵיטָה designa os que escaparam ou sobreviveram; o plural natural em português expressa adequadamente o coletivo hebraico.
- source_word: לְהִשָּׁעֵן / וְנִשְׁעַן
  choice: se apoiar / se apoiarão
  rationale: Mantém a repetição deliberada da mesma raiz hebraica e o contraste entre uma confiança opressora e a confiança no SENHOR.
- source_word: מַכֵּהוּ
  choice: aquele que os feriu
  rationale: O particípio de נכה indica quem golpeava ou feria o remanescente; o pronome coletivo foi vertido naturalmente no plural.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida para o tetragrama, em versaletes representados aqui por maiúsculas.
- source_word: בֶּאֱמֶת
  choice: com fidelidade
  rationale: Neste contexto de deixar de depender do agressor e passar a apoiar-se em YHWH, a expressão pode indicar confiança genuína ou fiel, sem excluir a nuance de verdade.
theological_decisions:
- issue: Sentido de בֶּאֱמֶת no modo de apoiar-se no SENHOR
  choice: com fidelidade
  alternative: verdadeiramente / de fato / em verdade
  rationale: A forma hebraica admite as ideias relacionadas de verdade, firmeza e fidelidade. A tradução principal destaca a lealdade genuína do remanescente, enquanto a nota preserva as demais nuances possíveis.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção natural no Brasil. A repetição de “se apoiar” foi mantida para reproduzir o contraste retórico do hebraico. “Naquele dia”, “remanescente”, “casa de Jacó” e “o Santo de Israel” preservam a linguagem profética sem arcaísmo desnecessário.
