  source_fidelity: A tradução preserva adequadamente o paralelismo de שְׁאָר יִשְׂרָאֵל e פְלֵיטַת בֵּית־יַעֲקֹב, a cessação expressa por לֹא יוֹסִיף עוֹד, a repetição de apoiar-se (לְהִשָּׁעֵן / וְנִשְׁעַן) e o contraste entre o agressor e o SENHOR. “Naquele que os feriu” comunica naturalmente o particípio com sufixo pronominal aplicado ao coletivo Israel/Jacó. “Com fidelidade” é uma opção contextual defensável para בֶּאֱמֶת, e a nota registra alternativas importantes sem alegar uma certeza indevida.
