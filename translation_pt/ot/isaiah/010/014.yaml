base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/014.yaml
  text: My hand found the wealth of the peoples as one finds a nest[a]; and as one gathers abandoned eggs, I gathered all the earth, and there was none that fluttered a wing, or opened a mouth[b], or chirped.
translation:
  language: pt
  text: Minha mão encontrou os bens dos povos[a] como se encontra um ninho; como quem recolhe ovos abandonados, recolhi toda a terra[b]. Ninguém bateu a asa, abriu o bico ou piou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a riqueza dos povos”. O termo hebraico pode significar riqueza, recursos, força ou exército; aqui, a imagem do ninho e dos ovos favorece o sentido de bens tomados como despojo.
    reason: lexical_alternative
  - marker: b
    text: Ou “toda a região”. A palavra hebraica pode significar “terra”, “país” ou “região”; “toda a terra” preserva o alcance universal da vanglória do conquistador.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּמְצָא כַקֵּן יָדִי
  choice: Minha mão encontrou, como num ninho
  rationale: Mantém o verbo literal “encontrou”, a imagem do ninho e a mão como expressão da ação e do poder pessoal do soberano. A formulação portuguesa evita acrescentar um segundo verbo inexistente no hebraico.
- source_word: לְחֵיל הָעַמִּים
  choice: os bens dos povos
  rationale: חַיִל pode indicar força, exército, recursos ou riqueza. No contexto de despojo facilmente recolhido como ovos, “bens” expressa de modo natural as posses e os recursos tomados, sem limitar o sentido a dinheiro.
- source_word: וְכֶאֱסֹף בֵּיצִים עֲזֻבוֹת
  choice: como quem recolhe ovos abandonados
  rationale: Conserva a comparação e a imagem de ovos deixados sem defesa; “como quem” torna a construção idiomática em português.
- source_word: כָּל הָאָרֶץ אֲנִי אָסָפְתִּי
  choice: recolhi toda a terra
  rationale: O verbo “recolhi” retoma naturalmente os ovos e preserva a metáfora. “Toda a terra” mantém a hipérbole universal do orgulho imperial.
- source_word: וְלֹא הָיָה נֹדֵד כָּנָף
  choice: Ninguém bateu a asa
  rationale: Expressa em português natural a ausência até do menor movimento de resistência, preservando a figura da ave.
- source_word: וּפֹצֶה פֶה
  choice: abriu o bico
  rationale: Embora פֶה signifique literalmente “boca”, “bico” mantém coerente a metáfora aviária do ninho, dos ovos, da asa e do piar; não transforma implicitamente a expressão em protesto verbal humano.
- source_word: וּמְצַפְצֵף
  choice: piou
  rationale: O verbo hebraico designa o som agudo de uma ave. “Piou” é claro, conciso e adequado à sequência de imagens.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A tradução conserva a voz arrogante do conquistador e desenvolve de modo coeso a imagem aviária. “Povos” reproduz o plural hebraico sem restringi-lo a Estados nacionais; “bens” evita a ambiguidade moderna de “riqueza” como mera abundância monetária.
