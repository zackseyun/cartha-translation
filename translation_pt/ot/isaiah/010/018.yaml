  text: וּ/כְב֤וֹד יַעְר/וֹ֙ וְ/כַרְמִלּ֔/וֹ מִ/נֶּ֥פֶשׁ וְ/עַד בָּשָׂ֖ר יְכַלֶּ֑ה וְ/הָיָ֖ה כִּ/מְסֹ֥ס נֹסֵֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/018.yaml
  text: And the glory of his forest and of his fruitful land he will consume[a], from soul to flesh, and it will be like the wasting away of a sick man.
translation:
  language: pt
  text: E ele consumirá a glória da sua floresta e da sua terra fértil, da alma à carne; e será como um doente que definha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e será como alguém que definha”. A expressão hebraica final é difícil, e alguns entendem a última palavra de outra maneira.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְבוֹד
  choice: a glória
  rationale: Preserva o peso metafórico de כָּבוֹד, aqui aplicado à imponência e abundância dos recursos da Assíria.
- source_word: יַעְרוֹ
  choice: da sua floresta
  rationale: Tradução direta de יַעַר, mantendo a imagem contextual da força e multidão assírias.
- source_word: וְכַרְמִלּוֹ
  choice: e da sua terra fértil
  rationale: כַּרְמֶל pode designar terreno fértil ou cultivado, sem exigir aqui o topônimo Carmelo; a escolha forma um paralelo natural com “floresta”.
- source_word: מִנֶּפֶשׁ וְעַד בָּשָׂר
  choice: da alma até a carne
  rationale: Mantém os termos concretos e a tensão antropológica do hebraico, ao mesmo tempo que expressa uma destruição abrangente.
- source_word: יְכַלֶּה
  choice: consumirá
  rationale: O piel de כלה pode significar acabar, consumir ou destruir; “consumirá” combina com a imagem de fogo e juízo no contexto imediato.
- source_word: וְהָיָה
  choice: e será
  rationale: Introduz o estado resultante da devastação; o sujeito permanece deliberadamente aberto, como permite o hebraico.
- source_word: כִּמְסֹס
  choice: como ... que definha
  rationale: Expressa a ideia provável de definhar, dissolver-se ou consumir-se progressivamente, em português natural.
- source_word: נֹסֵס
  choice: um doente
  rationale: Adota a interpretação contextual tradicional ligada à enfermidade, reconhecendo em nota que a expressão hebraica final é obscura.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com estrutura relativamente formal. A formulação “da alma até a carne” conserva a imagem incomum do hebraico, e a nota registra sem resolver indevidamente a dificuldade da frase final.
