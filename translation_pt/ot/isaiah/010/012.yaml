id: ISA.10.12
reference: Isaiah 10:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּֽי יְבַצַּ֤ע אֲדֹנָ/י֙ אֶת כָּל מַֽעֲשֵׂ֔/הוּ בְּ/הַ֥ר צִיּ֖וֹן וּ/בִ/ירוּשָׁלִָ֑ם אֶפְקֹ֗ד עַל פְּרִי גֹ֨דֶל֙ לְבַ֣ב מֶֽלֶךְ אַשּׁ֔וּר וְ/עַל תִּפְאֶ֖רֶת ר֥וּם עֵינָֽי/ו־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/012.yaml
  text: And it will happen that when the Lord has finished all his work on Mount Zion and in Jerusalem[a], I will punish the fruit of the greatness of the heart of the king of Assyria[c][b], and the splendor of his haughty eyes.
translation:
  language: pt
  text: E acontecerá que, quando o Senhor tiver concluído toda a sua obra no monte Sião e em Jerusalém, eu castigarei[a] o fruto da grandeza do coração do rei da Assíria[b] e o esplendor de seus olhos altivos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pedirei contas”. O verbo hebraico pode indicar uma visitação divina para juízo.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “o fruto da grandeza do coração do rei da Assíria”. A expressão descreve aquilo que sua arrogância produz.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “o esplendor da elevação de seus olhos”, isto é, o orgulho expresso em seu olhar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: E acontecerá que, quando
  rationale: Preserva a transição discursiva e introduz com naturalidade a circunstância futura expressa pela construção hebraica.
- source_word: יְבַצַּע
  choice: tiver concluído
  rationale: O piel de בצע indica levar uma ação até o fim; o futuro composto se ajusta à oração temporal em português.
- source_word: אֲדֹנָי
  choice: o Senhor
  rationale: Traduz o título divino אֲדֹנָי de modo tradicional, claro e distinto do nome divino YHWH.
- source_word: כָּל מַעֲשֵׂהוּ
  choice: toda a sua obra
  rationale: Representa o singular coletivo e a totalidade da ação do Senhor sem especificar além do que o texto diz.
- source_word: בְּהַר צִיּוֹן וּבִירוּשָׁלָם
  choice: no monte Sião e em Jerusalém
  rationale: Mantém o sentido locativo da preposição e a distinção geográfica, sem impor o sentido adversativo de 'contra'.
- source_word: אֶפְקֹד עַל
  choice: eu castigarei
  rationale: No contexto de juízo, פקד על denota visitação punitiva ou prestação de contas; 'castigarei' expressa isso com clareza.
- source_word: פְּרִי
  choice: o fruto
  rationale: Conserva a metáfora hebraica transparente para aquilo que a disposição interior do rei produz.
- source_word: גֹדֶל לְבַב
  choice: a grandeza do coração
  rationale: Mantém de perto a expressão hebraica e deixa que o contexto de orgulho e juízo comunique sua conotação negativa.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: o rei da Assíria
  rationale: É a forma portuguesa corrente e direta para a cadeia construta hebraica.
- source_word: תִּפְאֶרֶת
  choice: o esplendor
  rationale: Preserva o campo semântico de beleza, glória ou magnificência, inclusive sua força irônica no contexto.
- source_word: רוּם עֵינָיו
  choice: seus olhos altivos
  rationale: Comunica naturalmente o idioma hebraico, literalmente relacionado à elevação dos olhos, preservando a imagem dos olhos.
theological_decisions:
- issue: Se a obra do Senhor em Sião e Jerusalém deve ser apresentada explicitamente como ação contra esses lugares
  choice: 'Tradução locativa: ''no monte Sião e em Jerusalém'''
  alternative: '''contra o monte Sião e Jerusalém'''
  rationale: A preposição hebraica permite e favorece aqui a localização da obra. A formulação não decide se essa obra consiste apenas em juízo, em restauração ou em ambos, preservando a tensão do contexto.
- issue: Mudança gramatical de 'o Senhor' para a fala divina em primeira pessoa
  choice: Manter 'o Senhor... eu castigarei'
  alternative: Harmonizar como 'o Senhor... castigará' ou acrescentar 'diz ele'
  rationale: O hebraico apresenta a mudança de terceira para primeira pessoa sem explicação. Mantê-la preserva a forma e a tensão retórica do texto, sem inserir palavras ausentes.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tradução mantém a metáfora do fruto, a expressão semítica relativa ao coração e a mudança não sinalizada para a primeira pessoa divina.
