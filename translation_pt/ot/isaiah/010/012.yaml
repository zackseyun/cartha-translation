  source_fidelity: 'A tradução reproduz com fidelidade a construção temporal וְהָיָה כִּי, a conclusão da obra do Senhor em Sião e Jerusalém, a mudança hebraica não marcada para a primeira pessoa em “eu castigarei” e os dois objetos do juízo: o “fruto” da grandeza do coração do rei da Assíria e o esplendor de seus olhos elevados. O valor locativo de בְּ foi corretamente preservado.'
