source:
  edition: WLC
  text: וְ/הוּא֙ לֹא כֵ֣ן יְדַמֶּ֔ה וּ/לְבָב֖/וֹ לֹא כֵ֣ן יַחְשֹׁ֑ב כִּ֚י לְ/הַשְׁמִ֣יד בִּ/לְבָב֔/וֹ וּ/לְ/הַכְרִ֥ית גּוֹיִ֖ם לֹ֥א מְעָֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/007.yaml
  text: But he does not think so[a], and his heart does not reckon so; for it is in his heart to destroy[b], and to cut off not a few nations.
translation:
  language: pt
  text: Mas ele não pensa assim[a], e seu coração não pensa assim; pois tem no coração destruir e eliminar não poucas nações[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não pretende agir assim”. O verbo hebraico pode expressar tanto conceber como ter a intenção de fazer algo.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “não poucas nações”, uma forma enfática de dizer “muitas nações”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Mas ele
  rationale: A conjunção tem valor adversativo no contexto, contrastando a intenção do rei da Assíria com o propósito expresso no versículo anterior.
- source_word: יְדַמֶּה
  choice: pensa
  rationale: O piel de דמה pode indicar conceber, imaginar ou pretender. “Pensa” é natural e mantém aberta a nuance entre entendimento e intenção.
- source_word: לְבָבוֹ
  choice: seu coração
  rationale: Preserva a imagem antropológica hebraica do coração como centro do pensamento e da vontade, sem reduzi-lo apenas à emoção.
- source_word: יַחְשֹׁב
  choice: faz esse cálculo
  rationale: חשב pode significar pensar, calcular ou planejar. A expressão diferencia este verbo de יְדַמֶּה e preserva o paralelismo cognitivo em português corrente.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação da verdadeira intenção interior do rei.
- source_word: לְהַשְׁמִיד
  choice: destruir
  rationale: Tradução ampla e direta do infinitivo hifil de שׁמד, sem impor a ideia mais absoluta de aniquilação total.
- source_word: בִּלְבָבוֹ
  choice: o que está em seu coração
  rationale: Mantém a repetição hebraica do coração e comunica de modo natural a intenção interior.
- source_word: לְהַכְרִית
  choice: eliminar
  rationale: O hifil de כרת indica cortar, remover ou eliminar. “Eliminar” é idiomático neste contexto geopolítico e deixa aberto o modo concreto da remoção.
- source_word: גּוֹיִם
  choice: nações
  rationale: No contexto de conquista imperial, refere-se adequadamente a povos entendidos como entidades políticas.
- source_word: לֹא מְעָט
  choice: muitas
  rationale: A expressão literalmente negativa “não poucas” funciona como litotes. “Muitas” transmite com clareza seu sentido pragmático, enquanto a forma hebraica é registrada em nota.
theological_decisions:
- issue: Relação entre o propósito divino e a intenção da Assíria
  choice: Preservar o contraste implícito com “não pensa assim”, sem explicar no próprio versículo a que “assim” se refere.
  alternative: 'Explicitar: “ele não entende o propósito de Deus” ou “não pretende cumprir esse propósito”.'
  rationale: O contexto anterior estabelece o propósito divino, mas este versículo apenas contrasta esse propósito com a intenção destrutiva do rei. Explicitar mais resolveria uma tensão e uma referência que o hebraico deixa contextuais.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantém “coração” como imagem hebraica, mas usa formulações naturais como “faz esse cálculo” e “o que está em seu coração”. A litotes é vertida pelo sentido no texto e preservada em nota.
