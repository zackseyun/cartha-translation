revisions:
- from: Mas ele não pensa assim[a], e seu coração não faz esse cálculo; pois o que está em seu coração é destruir e eliminar muitas nações[b].
  to: Mas ele não pensa assim[a], e seu coração não pensa assim; pois tem no coração destruir e eliminar não poucas nações[b].
  rationale: A revisão elimina uma metáfora de cálculo pouco idiomática, preservando o paralelismo de dois verbos cognitivos e a repetição de “coração”. Também restaura no texto a litotes hebraica “não poucas”, sem alterar seu sentido, que a nota explica.
