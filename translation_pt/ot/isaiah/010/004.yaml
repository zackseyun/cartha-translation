base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/004.yaml
  text: Nothing remains but to crouch among the prisoners or to fall among the slain. For all this his anger has not turned away[a], and his hand is still stretched out.
translation:
  language: pt
  text: Nada resta senão curvar-se entre os prisioneiros ou cair entre os que foram mortos. Apesar de tudo isso, sua ira não se afastou[a], e sua mão continua estendida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “senão curvar-se debaixo dos prisioneiros, e eles cairão debaixo dos que foram mortos”. O hebraico é muito condensado, e a relação exata entre os verbos e as preposições é discutida.'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּלְתִּי
  choice: Nada resta senão
  rationale: A cláusula é elíptica e apresenta as únicas alternativas que ainda restam. Esta formulação explicita naturalmente em português o valor contextual sem acrescentar um novo conteúdo.
- source_word: כָרַע
  choice: se curvar
  rationale: O verbo indica abaixar-se, dobrar-se ou prostrar-se. Aqui comunica humilhação forçada, sem a conotação necessariamente cultual de “adorar”.
- source_word: תַּחַת
  choice: entre
  rationale: Embora o sentido básico seja “debaixo de”, neste contexto pode indicar ser colocado ou contado entre determinado grupo. “Entre” produz sentido claro no texto principal, enquanto a leitura mais literal é preservada em nota.
- source_word: אַסִּיר
  choice: os prisioneiros
  rationale: O substantivo designa quem está preso ou cativo; o plural em português expressa naturalmente o valor coletivo da construção.
- source_word: הֲרוּגִים
  choice: os mortos
  rationale: O particípio se refere aos que foram mortos violentamente. “Os mortos” é atual e natural, embora menos marcado que “os que foram mortos”; o contexto de queda e juízo mantém a ideia.
- source_word: יִפֹּלוּ
  choice: cair
  rationale: Apesar da forma finita plural, a sequência hebraica é muito condensada. O infinitivo mantém em português o paralelismo com “se curvar” e representa a alternativa de destino sem impor uma mudança brusca de sujeito.
- source_word: בְּכָל זֹאת
  choice: Apesar de tudo isso
  rationale: A expressão introduz o refrão segundo o qual o juízo precedente não esgotou a ira divina. “Apesar de tudo isso” comunica claramente essa relação concessiva.
- source_word: לֹא שָׁב אַפּוֹ
  choice: a ira dele não se desviou
  rationale: אַף é uma metáfora corporal que idiomaticamente significa ira; שׁוּב indica voltar ou afastar-se. A tradução preserva a imagem de uma ira que ainda não se retirou.
- source_word: יָדוֹ נְטוּיָה
  choice: sua mão continua estendida
  rationale: Mantém a imagem antropomórfica recorrente em Isaías e exprime que a ação de juízo prossegue.
theological_decisions:
- issue: Linguagem antropomórfica sobre o juízo divino
  choice: Manter “a ira dele” e “sua mão continua estendida”.
  alternative: Parafrasear como “seu juízo continua”.
  rationale: O hebraico comunica a persistência do juízo por imagens corporais. Preservá-las mantém a força poética e a tensão teológica do texto, sem reduzi-las a uma abstração.
- issue: Relação sintática na cláusula inicial comprimida
  choice: 'Apresentar dois destinos paralelos: curvar-se entre os prisioneiros ou cair entre os mortos.'
  alternative: “Senão curvar-se debaixo do prisioneiro, e cairão debaixo dos mortos.”
  rationale: A construção hebraica admite mais de uma análise. O texto principal adota a leitura contextual mais clara, mas a alternativa formalmente mais próxima é registrada em nota para não ocultar a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi tornada natural sem eliminar a ambiguidade textual, preservada na nota. O refrão mantém as imagens concretas de ira e mão estendida.
