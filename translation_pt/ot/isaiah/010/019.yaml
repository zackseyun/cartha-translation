  yaml_path: translation/ot/isaiah/010/019.yaml
  text: And the remaining trees of his forest will be few in number[b][a], and a boy can write them down.
translation:
  language: pt
  text: E as árvores que restarem em sua floresta serão tão poucas que um menino poderá anotá-las.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “O restante das árvores de sua floresta será um número, e um menino as escreverá”. Em hebraico, “número” indica aqui uma quantidade pequena o bastante para ser contada. O termo traduzido por “menino” também pode significar “jovem” ou “rapaz”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר עֵץ יַעְרוֹ
  choice: E as árvores que restarem em sua floresta
  rationale: שְׁאָר indica aquilo que resta, e עֵץ tem sentido coletivo neste contexto. A formulação mantém a imagem concreta das árvores sobreviventes sem introduzir o sentido teológico técnico de “remanescente”.
- source_word: מִסְפָּר יִהְיוּ
  choice: serão tão poucas
  rationale: Embora מִסְפָּר signifique literalmente “número”, a construção é idiomática e indica que as árvores serão poucas, em quantidade fácil de contar.
- source_word: וְנַעַר
  choice: que até um menino
  rationale: 'נַעַר pode designar menino, jovem ou rapaz. “Menino” preserva a força da imagem: restarão tão poucas árvores que até alguém muito jovem conseguirá registrá-las.'
- source_word: יִכְתְּבֵם
  choice: poderá anotá-las
  rationale: Literalmente, “as escreverá”. No contexto, expressa a facilidade ou possibilidade de registrar individualmente o pequeno número de árvores; “anotá-las” soa natural em português e conserva a imagem da escrita.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção consecutiva “tão poucas que” comunica naturalmente o valor idiomático do hebraico, enquanto a nota preserva sua forma mais literal e a amplitude lexical de נַעַר.
