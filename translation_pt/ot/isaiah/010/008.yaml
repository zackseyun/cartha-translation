source:
  edition: WLC
  text: כִּ֖י יֹאמַ֑ר הֲ/לֹ֥א שָׂרַ֛/י יַחְדָּ֖ו מְלָכִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/008.yaml
  text: For he says[b][a], “Are not my commanders all kings?”
translation:
  language: pt
  text: 'Pois ele diz: “Não são todos os meus comandantes[a] reis?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meus príncipes”; o termo hebraico pode designar príncipes, governantes, autoridades ou comandantes.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da afirmação anterior e preserva a força discursiva do hebraico.
- source_word: יֹאמַר
  choice: ele diz
  rationale: O imperfeito funciona naturalmente como presente em discurso profético, introduzindo a vanglória do rei assírio.
- source_word: הֲלֹא
  choice: Não são
  rationale: Mantém a pergunta retórica que espera resposta afirmativa.
- source_word: שָׂרַי
  choice: meus comandantes
  rationale: No contexto imperial assírio, designa altos subordinados com autoridade militar e política; evita que “príncipes” sugira necessariamente filhos do rei ou nobreza hereditária.
- source_word: יַחְדָּו
  choice: todos
  rationale: Embora o sentido básico seja “juntos”, aqui o termo enfatiza coletivamente que os subordinados, sem exceção, equivalem a reis.
- source_word: מְלָכִים
  choice: reis
  rationale: Reproduz diretamente o substantivo hebraico e a vanglória de que os subordinados do rei assírio têm posição comparável à de reis.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem da pergunta retórica foi preservada. O valor coletivo de יַחְדָּו foi expresso por “todos”, sem nota separada por ser idiomático e transparente em português.
