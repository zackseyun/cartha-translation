  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י אָמַ֗ר בְּ/כֹ֤חַ יָדִ/י֙ עָשִׂ֔יתִי וּ/בְ/חָכְמָתִ֖/י כִּ֣י נְבֻנ֑וֹתִי וְ/אָסִ֣יר גְּבוּלֹ֣ת עַמִּ֗ים ו/עתידתי/הם שׁוֹשֵׂ֔תִי וְ/אוֹרִ֥יד כַּ/אבִּ֖יר יוֹשְׁבִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/013.yaml
  text: For he says[a], “By the strength of my hand I have done it, and by my wisdom, for I have understanding. I remove the boundaries of peoples, and I plunder their treasures[c][b]; like a mighty man I bring down those who sit enthroned.”
translation:
  language: pt
  text: 'Pois ele diz: “Com a força da minha mão fiz isso; foi com a minha sabedoria, pois tenho entendimento. Removi as fronteiras dos povos, saqueei seus tesouros[a] e, como um poderoso[b], derrubei os que estavam assentados[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus depósitos”, “suas posses” ou “suas riquezas acumuladas”. O termo hebraico é raro e provavelmente se refere a bens guardados.
    reason: lexical_alternative
  - marker: b
    text: Ou “como um valente”.
    reason: lexical_alternative
  - marker: c
    text: Ou “os habitantes”. O particípio hebraico pode designar os moradores, mas, neste contexto, talvez se refira mais especificamente aos que estavam assentados no poder.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אָמַר
  choice: Pois ele diz
  rationale: כִּי introduz a razão para a avaliação anterior da arrogância da Assíria, e o presente “diz” apresenta a declaração como uma jactância característica e vívida.
- source_word: בְּכֹחַ יָדִי
  choice: Com a força da minha mão
  rationale: Preserva a imagem concreta da mão como expressão do poder militar que o rei atribui a si mesmo.
- source_word: עָשִׂיתִי
  choice: fiz tudo isso
  rationale: O verbo é amplo, “fazer”; “tudo isso” explicita de modo natural em português o objeto subentendido pelo contexto das conquistas.
- source_word: וּבְחָכְמָתִי כִּי נְבֻנוֹתִי
  choice: e, com a minha sabedoria, porque tenho entendimento
  rationale: Mantém tanto חָכְמָה, “sabedoria”, quanto a ideia de discernimento de נְבֻנוֹתִי, sem reduzir a afirmação a mera habilidade técnica.
- source_word: וְאָסִיר גְּבוּלֹת עַמִּים
  choice: Removi as fronteiras dos povos
  rationale: סור no causativo significa remover ou deslocar; “povos” reproduz עַמִּים sem sugerir necessariamente Estados-nação modernos. O passado harmoniza a série de feitos de conquista apresentados como realizados.
- source_word: וַעֲתִידֹתֵיהֶם
  choice: seus tesouros
  rationale: O substantivo raro parece designar bens preparados, armazenados ou acumulados; “tesouros” se ajusta ao contexto de saque, enquanto a nota preserva outras possibilidades.
- source_word: שׁוֹשֵׂתִי
  choice: saqueei
  rationale: Expressa diretamente a tomada de bens em contexto de conquista militar, em registro claro e digno.
- source_word: וְאוֹרִיד
  choice: derrubei
  rationale: O causativo de ירד significa fazer descer; “derrubei” comunica tanto derrota quanto humilhação dos que ocupavam posição elevada.
- source_word: כַּאַבִּיר
  choice: como um poderoso
  rationale: אַבִּיר denota alguém forte ou poderoso. A forma substantivada evita especificar “homem” onde o hebraico não o traz e conserva a comparação introduzida por כְּ.
- source_word: יוֹשְׁבִים
  choice: os que estavam assentados
  rationale: A formulação conserva a imagem de pessoas sentadas e permite tanto a leitura geral de habitantes quanto, no contexto, a de pessoas assentadas em posição de poder.
theological_decisions:
- issue: Referente da jactância
  choice: Preservar o falante no singular como o rei da Assíria, sem excluir sua função representativa da Assíria como potência.
  alternative: Entender a Assíria personificada como um todo falando coletivamente.
  rationale: O contexto imediato menciona o coração arrogante do rei da Assíria, enquanto a unidade também trata a nação de modo corporativo; o singular do hebraico não exige eliminar essa tensão.
- issue: Identidade dos que são derrubados
  choice: Traduzir literalmente como “os que estavam assentados”, deixando aberta uma referência a governantes ou pessoas em posição elevada.
  alternative: Traduzir simplesmente como “os habitantes”.
  rationale: ישׁב pode significar morar ou estar sentado. A proximidade de “derrubei” favorece uma possível alusão aos assentados no poder, mas essa nuance não deve apagar o sentido lexical mais amplo.
translation_notes:
  register: Português contemporâneo, claro e solene, com boa legibilidade brasileira. A sequência verbal foi vertida predominantemente no passado para apresentar os atos de conquista dos quais o falante se gaba. As notas mantêm a incerteza do substantivo raro para riquezas acumuladas e a ambiguidade de יוֹשְׁבִים.
