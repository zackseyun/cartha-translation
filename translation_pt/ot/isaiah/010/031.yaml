  text: נָדְדָ֖ה מַדְמֵנָ֑ה יֹשְׁבֵ֥י הַ/גֵּבִ֖ים הֵעִֽיזוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/031.yaml
  text: Madmenah has fled[a]; the inhabitants of Gebim have sought refuge.
translation:
  language: pt
  text: Madmena fugiu; os habitantes de Gebim apressaram-se a buscar abrigo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “procuraram abrigo” ou “fugiram para um lugar seguro”. O verbo hebraico é difícil neste contexto e pode indicar uma ação apressada em busca de proteção.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָדְדָה
  choice: fugiu
  rationale: O qal perfeito na 3ª pessoa do feminino singular pode indicar fugir ou partir errante. No contexto da invasão e tendo Madmena como sujeito personificado, “fugiu” comunica com naturalidade a retirada causada pelo perigo.
- source_word: מַדְמֵנָה
  choice: Madmena
  rationale: Nome próprio de lugar, transliterado segundo uma forma natural em português.
- source_word: יֹשְׁבֵי
  choice: os habitantes de
  rationale: O particípio em estado construto funciona como substantivo coletivo; “os habitantes de” é claro, corrente e preserva esse sentido.
- source_word: הַגֵּבִים
  choice: Gebim
  rationale: Nome próprio de lugar. O artigo hebraico faz parte da forma ou do uso local do topônimo e não precisa ser representado separadamente em português.
- source_word: הֵעִיזוּ
  choice: puseram-se a salvo
  rationale: O hifil perfeito plural é lexicalmente difícil neste contexto. A tradução expressa a ação urgente de buscar proteção diante do avanço militar, sem recorrer ao sentido literal potencialmente enganoso de “mostrar força”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Os dois perfeitos hebraicos foram vertidos no pretérito perfeito. A nota foi colocada junto à expressão correspondente ao verbo hebraico difícil, preservando sua ambiguidade lexical.
