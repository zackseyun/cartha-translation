base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/029.yaml
  text: They have crossed over the pass[a]; Geba is our lodging place. Ramah trembles[b]; Gibeah of Saul has fled.
translation:
  language: pt
  text: Atravessaram a passagem[a]; Geba é o nosso lugar de pernoite. Ramá treme; Gibeá de Saul fugiu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o lugar de travessia” ou “o vau”. O hebraico מַעְבָּרָה pode designar de modo geral um ponto de passagem; neste contexto de avanço militar, também pode referir-se a um desfiladeiro.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָבְרוּ
  choice: Atravessaram
  rationale: O qal perfeito, terceira pessoa do plural, relata de modo vívido o avanço já realizado; o pretérito perfeito é natural em português.
- source_word: מַעְבָּרָה
  choice: a passagem
  rationale: O substantivo designa um lugar de travessia e, neste itinerário militar, pode indicar uma passagem ou desfiladeiro; “passagem” preserva a amplitude do termo.
- source_word: גֶּבַע
  choice: Geba
  rationale: Nome geográfico transliterado segundo a forma consagrada em português.
- source_word: מָלוֹן לָנוּ
  choice: é o nosso lugar de pouso
  rationale: A oração nominal hebraica significa literalmente “lugar de pouso para nós”; a formulação portuguesa explicita a cópula e mantém a ideia de parada para pernoite.
- source_word: חָרְדָה
  choice: treme
  rationale: Embora seja uma forma perfeita, o presente transmite o caráter vívido da descrição poética e conserva tanto o tremor quanto o medo implícito no verbo.
- source_word: הָרָמָה
  choice: Ramá
  rationale: Nome geográfico transliterado com acento para orientar a pronúncia em português.
- source_word: גִּבְעַת שָׁאוּל
  choice: Gibeá de Saul
  rationale: Mantém a relação construta do hebraico e identifica a cidade associada a Saul.
- source_word: נָסָה
  choice: fugiu
  rationale: O qal perfeito, terceira pessoa do feminino singular, descreve a fuga da cidade personificada diante do avanço inimigo.
