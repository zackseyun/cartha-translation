id: ISA.10.33
reference: Isaiah 10:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הִנֵּ֤ה הָ/אָדוֹן֙ יְהוָ֣ה צְבָא֔וֹת מְסָעֵ֥ף פֻּארָ֖ה בְּ/מַעֲרָצָ֑ה וְ/רָמֵ֤י הַ/קּוֹמָה֙ גְּדוּעִ֔ים וְ/הַ/גְּבֹהִ֖ים יִשְׁפָּֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/033.yaml
  text: Behold[a], the Lord, Yahweh of Armies, is lopping off the boughs with terrifying power; the tall in stature are cut down[b], and the lofty are brought low.
translation:
  language: pt
  text: Eis que o Senhor, Yahweh dos Exércitos, está decepando a ramagem com força aterradora[a]; os de grande estatura são cortados[b], e os elevados serão rebaixados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “com estrondo”, “com violência” ou “em meio ao terror”; o termo hebraico comunica uma força violenta e temível.
    reason: lexical_alternative
  - marker: b
    text: A imagem é a de ramos e árvores altas sendo cortados, simbolizando a queda dos elevados.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Partícula dêitica que chama vividamente a atenção; “Eis que” conserva o tom profético e elevado sem perder clareza.
- source_word: הָאָדוֹן יְהוָה צְבָאוֹת
  choice: o Senhor, Yahweh dos Exércitos
  rationale: O artigo em אָדוֹן indica o título “o Senhor”; יְהוָה é representado pelo nome “Yahweh”, e צְבָאוֹת é traduzido de modo transparente como “dos Exércitos”.
- source_word: מְסָעֵף
  choice: está decepando
  rationale: O particípio apresenta a ação como vívida e em curso ou iminente; “decepar” expressa o corte vigoroso de ramos.
- source_word: פֻּארָה
  choice: a ramagem
  rationale: O substantivo designa o crescimento abundante de ramos ou folhagem; “ramagem” preserva a imagem arbórea e o valor coletivo.
- source_word: בְמַעֲרָצָה
  choice: com força aterradora
  rationale: A expressão comunica força violenta e causadora de terror; esta formulação preserva tanto a potência quanto o efeito amedrontador.
- source_word: רָמֵי הַקּוֹמָה
  choice: os de grande estatura
  rationale: Mantém a referência à altura ou ao porte sem decidir se se trata apenas de árvores ou, figuradamente, de pessoas exaltadas.
- source_word: גְּדוּעִים
  choice: são cortados
  rationale: O particípio passivo/resultativo denota algo cortado ou derrubado; “são cortados” conserva a imagem vegetal e evita explicitação interpretativa.
- source_word: הַגְּבֹהִים
  choice: os elevados
  rationale: O adjetivo pode indicar altura literal ou posição figuradamente elevada; “os elevados” preserva essa ambiguidade.
- source_word: יִשְׁפָּלוּ
  choice: serão rebaixados
  rationale: O verbo indica tornar-se baixo ou ser abatido; o futuro reproduz o yiqtol e permite tanto a leitura espacial quanto a humilhação figurada.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama após o título הָאָדוֹן; “Yahweh” distingue o nome divino do título “o Senhor” e mantém a transparência da fonte.
- issue: Imagem arbórea e juízo contra os exaltados
  choice: Conservar a linguagem de corte, altura e rebaixamento
  alternative: Explicitar no texto principal que Deus julga os orgulhosos
  rationale: A linguagem hebraica permite simultaneamente a cena de árvores altas sendo cortadas e sua aplicação metafórica aos exaltados. A tradução não resolve essa tensão por paráfrase.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Eis que” sustenta o tom profético; “ramagem”, “grande estatura” e “elevados” preservam a metáfora e sua ambiguidade. Os marcadores de nota foram colocados junto às expressões que explicam.
