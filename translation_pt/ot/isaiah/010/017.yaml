base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/017.yaml
  text: And the light of Israel will become a fire[a], and his Holy One a flame[c][b]; it will burn and consume his thorns and his briers in a single day.
translation:
  language: pt
  text: E a luz de Israel se tornará fogo[a], e o seu Santo, chama[b]; ela arderá e consumirá os espinhos[c] e os espinheiros dele em um só dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “será fogo... chama”; a construção hebraica admite uma tradução mais formal, embora aqui provavelmente expresse a ideia de tornar-se.
    reason: lexical_alternative
  - marker: b
    text: “O seu Santo” é provavelmente um título divino que se refere ao SENHOR, tema frequente em Isaías.
    reason: cross_reference
  - marker: c
    text: Os termos traduzidos por “espinhos” e “espinheiros” designam vegetação espinhosa; o primeiro é relativamente raro e também pode ter sentido mais amplo, como “vegetação rasteira”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: se tornará
  rationale: Com לְ indicando o estado resultante, היה expressa naturalmente a ideia de tornar-se, e não apenas de ser.
- source_word: אוֹר יִשְׂרָאֵל
  choice: a luz de Israel
  rationale: Preserva de forma natural a metáfora e a relação construta do hebraico sem explicitar seu referente.
- source_word: לְאֵשׁ
  choice: fogo
  rationale: Expressa o estado resultante após 'se tornará'; em português, o artigo indefinido é dispensável nessa construção predicativa.
- source_word: וּקְדוֹשׁוֹ
  choice: o seu Santo
  rationale: Mantém o provável título divino e o sufixo possessivo masculino, sem identificar expressamente o referente no texto.
- source_word: לְלֶהָבָה
  choice: chama
  rationale: Preserva o paralelismo poético com 'fogo' em formulação idiomática portuguesa.
- source_word: וּבָעֲרָה
  choice: ela arderá
  rationale: O qatal tem valor futuro na sequência profética; o pronome feminino retoma naturalmente 'chama', núcleo imagético imediatamente anterior.
- source_word: וְאָכְלָה
  choice: e consumirá
  rationale: Traduz o emprego metafórico comum de אכל para a ação destrutiva do fogo.
- source_word: שִׁיתוֹ
  choice: os espinhos dele
  rationale: O substantivo raro parece designar vegetação espinhosa; 'espinhos' mantém a imagem e o sufixo possessivo.
- source_word: וּשְׁמִירוֹ
  choice: os espinheiros dele
  rationale: Mantém um termo paralelo distinto para a segunda espécie de vegetação espinhosa e reproduz o sufixo possessivo.
- source_word: בְּיוֹם אֶחָד
  choice: em um só dia
  rationale: Formulação natural que ressalta a rapidez e a totalidade do juízo.
theological_decisions:
- issue: Referente de 'a luz de Israel' e 'o seu Santo'
  choice: Preservar no texto a metáfora e o título sem identificar explicitamente o referente.
  alternative: Explicitar que ambos se referem ao SENHOR, ou entender 'a luz de Israel' mais genericamente como personificação da proteção divina.
  rationale: O contexto de Isaías aponta fortemente para Deus, sobretudo em 'o seu Santo', mas o próprio versículo apresenta linguagem poética cuja tensão deve ser mantida.
- issue: Referente dos sufixos em שִׁיתוֹ e שְׁמִירוֹ
  choice: Traduzir literalmente como 'dele'.
  alternative: Explicitar 'da Assíria' ou omitir os possessivos por fluidez.
  rationale: O hebraico traz sufixos masculinos singulares cujo referente vem do contexto; mantê-los evita inserir uma identificação interpretativa no versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e o paralelismo poético foram preservados. 'O seu Santo' mantém a força titular; 'ela' retoma 'chama' e torna explícita em português a concordância feminina do hebraico. Todos os marcadores de nota aparecem no texto.
