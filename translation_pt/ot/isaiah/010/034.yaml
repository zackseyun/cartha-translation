    rationale: A expressão não é natural neste contexto e enfraquece a imagem de vegetação espessa e entrelaçada. «Matagais» expressa melhor «thickets/tangled growth».
  - severity: low
    issue: «por obra de um poderoso» para בְּאַדִּיר
    rationale: A locução é mais perifrástica do que o hebraico e tem tom algo burocrático. «Por um poderoso» é mais direto, poético e preserva a ambiguidade do agente.
  revised_text: E os matagais da floresta serão cortados com ferro, e o Líbano cairá por um poderoso.[a]
