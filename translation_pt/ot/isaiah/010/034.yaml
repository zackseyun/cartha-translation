  text: וְ/נִקַּ֛ף סִֽבְכֵ֥י הַ/יַּ֖עַר בַּ/בַּרְזֶ֑ל וְ/הַ/לְּבָנ֖וֹן בְּ/אַדִּ֥יר יִפּֽוֹל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/034.yaml
  text: And the thickets of the forest will be cut down with iron[a], and Lebanon will fall by a mighty one.
translation:
  language: pt
  text: E os matagais da floresta serão cortados com ferro, e o Líbano cairá por um poderoso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Líbano cairá pelo Poderoso”, entendendo “Poderoso” como um título que se refere a Deus.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִקַּף
  choice: serão cortadas
  rationale: O nifal de נקף descreve aqui a derrubada ou o corte da vegetação. A forma passiva em português é natural e preserva a imagem do abate das árvores.
- source_word: סִבְכֵי
  choice: as partes cerradas
  rationale: סבך pode indicar matagal, emaranhado ou ramagem entrelaçada. “Partes cerradas” comunica a vegetação densa da floresta sem limitar a referência apenas a galhos ou copas.
- source_word: הַיַּעַר
  choice: da floresta
  rationale: יער significa diretamente “floresta” ou “mata”; “floresta” é claro e amplamente compreensível.
- source_word: בַּבַּרְזֶל
  choice: com ferro
  rationale: A expressão significa literalmente “com o ferro”, provavelmente uma metonímia para um instrumento de ferro. A tradução preserva a formulação hebraica sem acrescentar “machado”, que não está explícito.
- source_word: וְהַלְּבָנוֹן
  choice: e o Líbano
  rationale: Mantém o nome geográfico e sua possível força simbólica, ligada às célebres florestas e à grandeza do Líbano.
- source_word: בְּאַדִּיר
  choice: por obra de um poderoso
  rationale: 'אַדִּיר pode funcionar como substantivo: “um poderoso”. A locução “por obra de” expressa naturalmente o valor agente ou instrumental de ב e evita sugerir que o Líbano cairá acompanhado por essa figura.'
- source_word: יִפּוֹל
  choice: cairá
  rationale: נפל significa “cair”. A escolha conserva o sentido lexical direto e o paralelismo poético, embora o contexto evoque árvores sendo derrubadas.
theological_decisions:
- issue: Se אַדִּיר deve ser apresentado explicitamente como título divino
  choice: um poderoso
  alternative: o Poderoso
  rationale: O contexto aponta para o juízo do SENHOR, mas a expressão hebraica não traz o nome divino nem exige de modo inequívoco que אַדִּיר seja um título. O texto principal conserva essa ambiguidade, e a nota registra a possível referência direta a Deus.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe poética clara. “Partes cerradas” evita o regionalismo potencial de “matagais” e procura representar a vegetação emaranhada; “por obra de” torna clara a agência sem resolver a identidade do agente.
