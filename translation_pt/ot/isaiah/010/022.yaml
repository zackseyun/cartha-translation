  text: כִּ֣י אִם יִהְיֶ֞ה עַמְּ/ךָ֤ יִשְׂרָאֵל֙ כְּ/ח֣וֹל הַ/יָּ֔ם שְׁאָ֖ר יָשׁ֣וּב בּ֑/וֹ כִּלָּי֥וֹן חָר֖וּץ שׁוֹטֵ֥ף צְדָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/022.yaml
  text: For though your people[a], Israel, are like the sand of the sea, only a remnant of them will return. A destruction is decreed[b], overflowing with righteousness.
translation:
  language: pt
  text: Pois, ainda que o seu povo, Israel, seja como a areia do mar, apenas um remanescente dentre eles[a] voltará. Uma destruição está decretada, transbordante de justiça[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “apenas um remanescente nele voltará”; o pronome hebraico está no singular e se refere a “povo” como substantivo coletivo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “retidão”.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אִם
  choice: Pois, ainda que
  rationale: 'No contexto, a expressão tem força concessiva: apesar da multidão de Israel, somente um remanescente voltará. “Pois” mantém a ligação explicativa com o contexto, e “ainda que” expressa o contraste.'
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: o seu povo, Israel
  rationale: Reproduz o sufixo de segunda pessoa masculina singular e trata “Israel” como aposição, com pontuação natural em português.
- source_word: כְּחוֹל הַיָּם
  choice: como a areia do mar
  rationale: Preserva a comparação tradicional que comunica uma multidão incontável em linguagem corrente.
- source_word: שְׁאָר
  choice: um remanescente
  rationale: Mantém o substantivo indefinido e o tema profético do grupo sobrevivente; “apenas” explicita no nível da oração o contraste com a totalidade do povo.
- source_word: יָשׁוּב
  choice: voltará
  rationale: Preserva a amplitude de שׁוב, que pode evocar retorno concreto e ressonâncias espirituais, sem restringi-lo a arrependimento ou ao retorno de um exílio específico.
- source_word: בּוֹ
  choice: dele
  rationale: O pronome hebraico é singular e retoma o substantivo coletivo “povo”. “Dele” conserva esse número e expressa naturalmente a relação partitiva em português.
- source_word: כִּלָּיוֹן
  choice: destruição
  rationale: Comunica consumo ou ruína sem sugerir necessariamente aniquilação absoluta, o que seria inadequado diante da sobrevivência de um remanescente.
- source_word: חָרוּץ
  choice: está decretada
  rationale: Expressa uma decisão firme e estabelecida, preservando o caráter judicial do anúncio.
- source_word: שׁוֹטֵף
  choice: transbordando
  rationale: Mantém a imagem participial de uma inundação ou corrente que transborda.
- source_word: צְדָקָה
  choice: retidão
  rationale: Preserva o sentido moral de conformidade com o que é reto no juízo decretado; “justiça” continua sendo uma alternativa contextual forte.
theological_decisions:
- issue: Sentido do retorno do remanescente
  choice: “voltará”, sem especificar a natureza do retorno
  alternative: “se arrependerá” ou “voltará do exílio”
  rationale: O hebraico permite que o retorno tenha dimensões nacionais, concretas e espirituais. A formulação ampla preserva a tensão profética e a ressonância do tema do remanescente.
- issue: Sentido de צְדָקָה na oração final
  choice: retidão
  alternative: justiça
  rationale: Ambos os sentidos são lexicalmente possíveis. “Retidão” destaca o caráter moralmente reto do juízo, enquanto a nota preserva “justiça” como leitura contextual legítima.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva a solenidade profética sem arcaísmos. As notas registram a forma singular do pronome coletivo e a polissemia teologicamente relevante de צְדָקָה.
