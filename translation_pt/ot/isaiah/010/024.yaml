  text: לָ/כֵ֗ן כֹּֽה אָמַ֞ר אֲדֹנָ֤/י יְהוִה֙ צְבָא֔וֹת אַל תִּירָ֥א עַמִּ֛/י יֹשֵׁ֥ב צִיּ֖וֹן מֵֽ/אַשּׁ֑וּר בַּ/שֵּׁ֣בֶט יַכֶּ֔/כָּה וּ/מַטֵּ֥/הוּ יִשָּֽׂא עָלֶ֖י/ךָ בְּ/דֶ֥רֶךְ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/024.yaml
  text: 'Therefore thus says the Lord GOD of hosts: Do not fear[a], my people who dwell in Zion, because of Assyria. He will strike you with the rod, and he will lift up his staff against you in the manner of Egypt.'
translation:
  language: pt
  text: 'Portanto, assim diz o Senhor Yahweh dos Exércitos: “Não tenha medo, meu povo que habita em Sião, por causa da Assíria. A Assíria ferirá você com a vara e levantará seu cajado contra você, à maneira do Egito[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pelo caminho do Egito”. A expressão provavelmente alude à antiga opressão de Israel pelo Egito.'
    reason: Registra uma alternativa lexical genuína para דֶּרֶךְ e esclarece, sem impor no texto, a provável alusão histórica.
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Marca naturalmente a conclusão ou inferência ligada ao contexto anterior.
- source_word: כֹּה אָמַר
  choice: assim diz
  rationale: Preserva a fórmula profética de mensageiro em linguagem portuguesa corrente e solene.
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: o Senhor Yahweh dos Exércitos
  rationale: Distingue אֲדֹנָי do nome divino יהוה e conserva צְבָאוֹת como título ligado aos exércitos ou hostes.
- source_word: אַל תִּירָא
  choice: Não tenha medo
  rationale: Expressa de modo direto e natural a proibição hebraica no singular.
- source_word: עַמִּי יֹשֵׁב צִיּוֹן
  choice: meu povo que habita em Sião
  rationale: Mantém a forma coletiva singular do hebraico e a relação possessiva da aliança.
- source_word: מֵאַשּׁוּר
  choice: por causa da Assíria
  rationale: Com o verbo temer, a preposição indica a fonte ou o motivo do medo.
- source_word: בַּשֵּׁבֶט יַכֶּכָּה
  choice: Ela o ferirá com a vara
  rationale: O feminino retoma naturalmente 'a Assíria' em português; 'ferirá' preserva a amplitude de יַכֶּכָּה, e 'com a vara' mantém o valor instrumental.
- source_word: וּמַטֵּהוּ יִשָּׂא עָלֶיךָ
  choice: e levantará contra você o seu cajado
  rationale: Reproduz a imagem de erguer ou brandir o instrumento contra alguém, distinguindo 'cajado' da 'vara' da oração anterior.
- source_word: בְּדֶרֶךְ מִצְרָיִם
  choice: à maneira do Egito
  rationale: Comunica a provável comparação com a antiga opressão egípcia sem eliminar a possibilidade de uma leitura mais literal de דֶּרֶךְ.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: Mantém separadamente o título אֲדֹנָי e o nome da aliança יהוה, evitando fundi-los ou ocultar a ocorrência explícita do nome.
- issue: Sentido histórico de בְּדֶרֶךְ מִצְרָיִם
  choice: à maneira do Egito
  alternative: pelo caminho do Egito
  rationale: A leitura principal preserva a provável alusão à opressão de Israel pelo Egito, enquanto a nota registra a ambiguidade lexical e possível orientação geográfica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O povo é tratado coletivamente no singular, acompanhando o hebraico; por isso se usam “tenha”, “o” e “você”. O marcador [a] foi colocado junto à expressão que a nota explica.
