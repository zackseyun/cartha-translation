  to: 'Portanto, assim diz o Senhor Yahweh dos Exércitos: “Não tenha medo, meu povo que habita em Sião, por causa da Assíria. A Assíria ferirá você com a vara e levantará seu cajado contra você, à maneira do Egito[a].”'
