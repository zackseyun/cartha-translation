  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שְׁאָ֥ר יָשׁ֖וּב שְׁאָ֣ר יַעֲקֹ֑ב אֶל אֵ֖ל גִּבּֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/021.yaml
  text: A remnant will return[a], the remnant of Jacob[b], to the Mighty God.
translation:
  language: pt
  text: Um remanescente voltará[a], o remanescente de Jacó, para o Deus Poderoso.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão corresponde ao nome Sear-Jasube (“um remanescente voltará”), em Isaías 7:3.
    reason: cross_reference
  - marker: b
    text: Ou “para Deus, o Poderoso”; menos provavelmente, “para um deus poderoso” ou “para um herói poderoso”. O título hebraico אֵל גִּבּוֹר também aparece em Isaías 9:6.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאָר
  choice: remanescente
  rationale: O substantivo designa aquilo que resta após juízo ou catástrofe. “Remanescente” é claro, tradicional no contexto profético e conserva tanto o sentido numérico quanto a relevância teológica.
- source_word: יָשׁוּב
  choice: voltará
  rationale: O imperfeito qal de שׁוב expressa aqui retorno futuro. “Voltará” é natural em português e mantém a correspondência verbal com o nome Sear-Jasube em Isaías 7:3.
- source_word: שְׁאָר יַעֲקֹב
  choice: o remanescente de Jacó
  rationale: A construção hebraica é reproduzida com clareza e conserva “Jacó” como nome pessoal e coletivo, sem substituí-lo interpretativamente por “Israel”.
- source_word: אֶל
  choice: para
  rationale: A preposição indica movimento ou retorno em direção a alguém. “Para” comunica isso de modo idiomático em português.
- source_word: אֵל גִּבּוֹר
  choice: o Deus Poderoso
  rationale: No contexto, a expressão funciona naturalmente como título divino. “Deus Poderoso” preserva seu peso e sua ligação lexical com Isaías 9:6; o artigo torna a frase idiomática depois de “para”.
theological_decisions:
- issue: Sentido e referente de אֵל גִּבּוֹר
  choice: o Deus Poderoso
  alternative: Deus, o Poderoso; um deus poderoso; um herói poderoso
  rationale: O remanescente retorna a essa figura, o que favorece fortemente um referente divino. O mesmo título ocorre em Isaías 9:6. A tradução principal conserva esse valor sem eliminar em nota possibilidades lexicais menos prováveis.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “remanescente” reproduz a ênfase do hebraico; “Deus Poderoso” mantém o caráter titular e a conexão interna de Isaías.
