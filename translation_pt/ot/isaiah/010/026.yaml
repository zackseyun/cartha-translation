revisions:
- from: E Yahweh dos Exércitos levantará contra ele um açoite[a], como quando feriu Midiã junto à rocha de Orebe[b]. Seu bordão estará sobre o mar, e ele o erguerá como no tempo do Egito[c].
  to: E Yahweh dos Exércitos levantará contra ele um açoite[a], como no golpe contra Midiã, na rocha de Orebe[b]. Seu bastão estará sobre o mar, e ele o erguerá à maneira do Egito[c].
  rationale: A revisão substitui a paráfrase temporal “no tempo do Egito” por “à maneira do Egito”, que preserva melhor o valor idiomático de בְּדֶרֶךְ. “Como no golpe contra Midiã” reproduz a comparação nominal de כְּמַכַּת sem impor “massacre” ou tornar o verbo mais específico do que o hebraico. “Bastão” melhora a legibilidade mantendo a ambiguidade contextual dos pronomes.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:30:16Z'
review_pass:
