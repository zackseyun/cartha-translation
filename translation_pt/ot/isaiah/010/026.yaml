source:
  edition: WLC
  text: וְ/עוֹרֵ֨ר עָלָ֜י/ו יְהוָ֤ה צְבָאוֹת֙ שׁ֔וֹט כְּ/מַכַּ֥ת מִדְיָ֖ן בְּ/צ֣וּר עוֹרֵ֑ב וּ/מַטֵּ֨/הוּ֙ עַל הַ/יָּ֔ם וּ/נְשָׂא֖/וֹ בְּ/דֶ֥רֶךְ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/026.yaml
  text: And Yahweh of hosts will stir up a whip against him[a], as at the striking down of Midian at the rock of Oreb; and his staff will be over the sea[c][b], and he will lift it as in the way of Egypt.
translation:
  language: pt
  text: E Yahweh dos Exércitos levantará contra ele um açoite[a], como no golpe contra Midiã, na rocha de Orebe[b]. Seu bastão estará sobre o mar, e ele o erguerá à maneira do Egito[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “despertará contra ele um açoite”. O hebraico retrata Yahweh pondo em ação um instrumento de juízo.'
    reason: lexical_alternative
  - marker: b
    text: A “rocha de Orebe” remete a Juízes 7:25, onde Orebe, líder midianita, foi morto.
    reason: cross_reference
  - marker: c
    text: 'Ou: “no caminho do Egito”. A expressão hebraica provavelmente se refere à maneira da ação de Yahweh no êxodo, quando o bastão foi erguido sobre o mar.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעוֹרֵר
  choice: levantará
  rationale: O hifil de עור indica fazer surgir ou pôr em ação; em português, “levantará ... um açoite” expressa naturalmente a mobilização do instrumento de juízo.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Preserva o nome divino e traduz צְבָאוֹת por uma expressão atual e abrangente para as forças sob seu comando.
- source_word: שׁוֹט
  choice: um açoite
  rationale: Designa concretamente um instrumento de castigo e mantém a metáfora do juízo.
- source_word: כְּמַכַּת מִדְיָן
  choice: como quando feriu Midiã
  rationale: Reproduz o valor comparativo e a força verbal de מַכָּה sem introduzir a ideia mais específica de massacre.
- source_word: בְּצוּר עוֹרֵב
  choice: junto à rocha de Orebe
  rationale: Tradução natural da localização e preservação da referência histórica de Juízes 7:25.
- source_word: וּמַטֵּהוּ
  choice: Seu bordão
  rationale: “Bordão” distingue מַטֶּה do açoite anterior e se ajusta à evocação do instrumento erguido sobre o mar; o pronome permanece formalmente aberto ao referente contextual.
- source_word: עַל הַיָּם
  choice: estará sobre o mar
  rationale: Mantém a imagem espacial do hebraico e a evocação do êxodo sem explicitar além do texto.
- source_word: וּנְשָׂאוֹ
  choice: e ele o erguerá
  rationale: Traduz diretamente o ato de levantar o bordão e conserva os pronomes do original.
- source_word: בְּדֶרֶךְ מִצְרָיִם
  choice: como no tempo do Egito
  rationale: Comunica de modo natural a maneira ou precedente associado ao Egito, sem entender דֶּרֶךְ como uma estrada literal.
theological_decisions:
- issue: Referente dos pronomes na segunda parte do versículo
  choice: Mantêm-se “seu bordão” e “ele o erguerá”, favorecendo no contexto a ação de Yahweh.
  alternative: O bordão pode ser entendido como o do assírio, voltado contra ele.
  rationale: A menção ao mar e ao Egito evoca fortemente a ação divina no êxodo, mas a tradução não acrescenta um nome ao texto e assim conserva a tensão referencial.
- issue: Alusões históricas
  choice: Preservar as alusões à derrota de Midiã na rocha de Orebe e à ação divina no mar no tempo do Egito.
  alternative: Explicitar no corpo do texto Gideão, o mar Vermelho ou o êxodo.
  rationale: As alusões estruturam o versículo, mas sua explicitação interpretativa cabe às notas, não ao texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Yahweh” preserva o nome divino; “dos Exércitos” mantém o título tradicional em forma transparente. A sintaxe foi levemente naturalizada sem apagar as alusões nem a ambiguidade dos pronomes.
