  naturalness: O texto é claro e de registro apropriado. “Bastão” é mais neutro e internacionalmente transparente que “bordão” neste contexto, sem perder a imagem do instrumento levantado sobre o mar.
  terminology: “Yahweh dos Exércitos”, “açoite”, “Midiã” e “Orebe” são adequados. A nota c deve evitar chamar “à maneira do Egito” de tradução literal, pois a expressão hebraica usa literalmente “caminho”, aqui em sentido idiomático de maneira/modo.
  issues:
