  yaml_path: translation/ot/isaiah/010/030.yaml
  text: Cry aloud[a], daughter of Gallim! Listen[c][b], Laishah! O poor Anathoth!
translation:
  language: pt
  text: Solte um grito bem alto[a], filha de Galim[b]! Escute, Laísa! Pobre Anatote[c]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Solte um grito estridente”. O verbo hebraico pode indicar um grito penetrante ou retumbante.'
    reason: lexical_alternative
  - marker: b
    text: “Filha de Galim” personifica a cidade ou seus habitantes como uma filha.
    reason: cultural_note
  - marker: c
    text: 'Ou: “Anatote aflita” ou “Anatote desventurada”. O adjetivo hebraico pode expressar pobreza, sofrimento ou opressão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַהֲלִי
  choice: Solte um grito bem alto
  rationale: O imperativo feminino singular indica um grito forte, penetrante ou retumbante. A formulação comunica a urgência do contexto de invasão sem definir indevidamente o grito como alegre ou aterrorizado.
- source_word: קוֹלֵךְ
  choice: bem alto
  rationale: Literalmente, “tua voz”. Em português, a intensidade vocal já se expressa naturalmente em “solte um grito bem alto”, evitando a construção pouco idiomática “grite com a sua voz”.
- source_word: בַּת גַּלִּים
  choice: filha de Galim
  rationale: Mantém a personificação profética da cidade ou de seus habitantes como filha, em vez de reduzir a imagem a “habitantes de Galim”.
- source_word: הַקְשִׁיבִי
  choice: Escute
  rationale: O imperativo feminino pede atenção auditiva. “Escute” é direto, atual e condiz com a cidade personificada.
- source_word: לַיְשָׁה
  choice: Laísa
  rationale: Nome de lugar transliterado em forma corrente e legível em português, preservando a forma Laishah do texto hebraico.
- source_word: עֲנִיָּה
  choice: Pobre
  rationale: O adjetivo pode indicar pobreza, aflição ou condição miserável. “Pobre” funciona como exclamação compassiva e deixa as demais nuances registradas em nota.
- source_word: עֲנָתוֹת
  choice: Anatote
  rationale: Transliteração portuguesa tradicional do nome do lugar, aqui diretamente qualificado por “Pobre”.
