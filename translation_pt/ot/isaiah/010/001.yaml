base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/001.yaml
  text: Woe to those who decree decrees of wickedness[a], and the writers who keep writing oppression[b],
translation:
  language: pt
  text: Ai dos que decretam decretos de maldade[a] e dos que registram por escrito a opressão[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “decretam decretos de maldade”; o hebraico emprega palavras da mesma raiz para produzir uma repetição enfática.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico também pode significar “sofrimento”, “aflição” ou “injustiça penosa”. “Opressão” se ajusta ao contexto de determinações legais que prejudicam os vulneráveis.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Ai
  rationale: Interjeição profética que anuncia condenação e juízo; “Ai” é a forma portuguesa tradicional, clara e vigorosa.
- source_word: הַחֹקְקִים
  choice: os que decretam
  rationale: O particípio de חקק tem aqui sentido jurídico e se refere aos que estabelecem determinações obrigatórias.
- source_word: חִקְקֵי
  choice: decretos
  rationale: Mantém a relação etimológica e a repetição enfática com o verbo “decretam”, sem restringir o texto a uma instituição legislativa moderna.
- source_word: אָוֶן
  choice: perversos
  rationale: Caracteriza os decretos como moralmente maus e injustos. O adjetivo produz em português uma formulação natural sem enfraquecer a censura profética.
- source_word: וּמְכַתְּבִים
  choice: e dos que, ao redigir
  rationale: Expressa a atividade contínua dos responsáveis por formular por escrito as determinações, sem pressupor o cargo técnico de escriba.
- source_word: עָמָל
  choice: a opressão
  rationale: Embora possa significar aflição, sofrimento ou injustiça penosa, no contexto jurídico-social aponta para o dano opressivo produzido por decisões escritas.
- source_word: כִּתֵּבוּ
  choice: põem por escrito
  rationale: Completa e intensifica o particípio anterior, comunicando com naturalidade o ato de registrar formalmente a injustiça.
