id: ISA.10.16
reference: Isaiah 10:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ֠/כֵן יְשַׁלַּ֨ח הָ/אָד֜וֹן יְהוָ֧ה צְבָא֛וֹת בְּ/מִשְׁמַנָּ֖י/ו רָז֑וֹן וְ/תַ֧חַת כְּבֹד֛/וֹ יֵקַ֥ד יְקֹ֖ד כִּ/יק֥וֹד אֵֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/016.yaml
  text: Therefore the Lord[a], Yahweh of Armies, will send wasting sickness among his stout warriors[c][b], and under his glory a burning will be kindled like the burning of fire.
translation:
  language: pt
  text: Por isso, o Senhor, Yahweh dos Exércitos, enviará definhamento entre os seus homens robustos[a]; e, sob a sua glória[b][c], uma chama se acenderá, como fogo abrasador.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contra os seus bem nutridos” ou “entre os seus gordos”. O hebraico usa a imagem da gordura para indicar força, prosperidade ou pessoas de posição elevada.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “em lugar da sua glória”, entendendo “sob” no sentido de substituição: o fogo passa a ocupar o lugar do seu esplendor.'
    reason: alternative_reading
  - marker: c
    text: “Sua glória” também pode significar “seu esplendor” ou “sua pompa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Expressa de modo natural a conclusão ou consequência introduzida pela partícula hebraica.
- source_word: יְשַׁלַּח
  choice: enviará
  rationale: Mantém a ação causativa de Deus ao mandar o juízo.
- source_word: הָאָדוֹן יְהוָה צְבָאוֹת
  choice: o Senhor, Yahweh dos Exércitos
  rationale: Distingue o título אָדוֹן do nome divino יהוה e traduz צְבָאוֹת de modo transparente.
- source_word: בְּמִשְׁמַנָּיו
  choice: entre os seus homens robustos
  rationale: Comunica a imagem hebraica de pessoas bem nutridas, fortes ou prósperas sem acrescentar explicitamente a identificação militar; a imagem literal é preservada em nota.
- source_word: רָזוֹן
  choice: definhamento
  rationale: Preserva a ideia nominal de magreza ou emaciação como juízo, em português natural, sem especificar necessariamente uma doença.
- source_word: וְתַחַת כְּבֹדוֹ
  choice: e, sob a sua glória
  rationale: Conserva a leitura espacial e metafórica mais direta de תַחַת, deixando em nota a possibilidade substitutiva.
- source_word: כְּבֹדוֹ
  choice: a sua glória
  rationale: Mantém a amplitude de כבוד, que neste contexto pode denotar esplendor, magnificência ou pompa.
- source_word: יֵקַד יְקֹד
  choice: uma chama se acenderá
  rationale: Reproduz em português corrente a imagem intensificada do verbo e substantivo cognatos, embora sem imitar de modo artificial a repetição hebraica.
- source_word: כִּיקוֹד אֵשׁ
  choice: como fogo abrasador
  rationale: Transmite naturalmente a comparação com a queima intensa do fogo.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o nome divino, distinguindo-o do título precedente 'o Senhor'; a transliteração preserva essa distinção.
- issue: Identidade dos מִשְׁמַנִּים
  choice: homens robustos
  alternative: gordos; bem nutridos; elite militar
  rationale: O contexto favorece os fortes ou membros prósperos da potência assíria, mas o substantivo não diz explicitamente 'guerreiros'; por isso, a tradução evita resolver totalmente a referência.
- issue: Sentido de תַחַת diante de 'glória'
  choice: sob
  alternative: em lugar de
  rationale: A leitura espacial sustenta a imagem de fogo oculto sob o esplendor, enquanto a possibilidade de substituição permanece registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a metáfora corporal e a ambiguidade de תַחַת, evitando acrescentar 'guerreiros' ao texto principal. A pontuação separa com clareza as duas imagens paralelas de definhamento e fogo.
