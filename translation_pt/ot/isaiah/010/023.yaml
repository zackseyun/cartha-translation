reference: Isaiah 10:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֥י כָלָ֖ה וְ/נֶחֱרָצָ֑ה אֲדֹנָ֤/י יְהוִה֙ צְבָא֔וֹת עֹשֶׂ֖ה בְּ/קֶ֥רֶב כָּל הָ/אָֽרֶץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/023.yaml
  text: For the Lord Yahweh of hosts is carrying out a complete destruction[a], one that has been decreed, in the midst of all the earth.
translation:
  language: pt
  text: Pois o Senhor Yahweh dos Exércitos está realizando uma destruição completa e decretada em toda a terra[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todo o país”. O termo hebraico אֶרֶץ pode significar “terra” ou “país”, conforme o contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento da afirmação anterior e preserva de modo natural a força conectiva do hebraico.
- source_word: כָלָה
  choice: uma destruição completa
  rationale: No contexto de juízo, o substantivo indica um fim consumador ou destruição; a formulação comunica tanto a ideia de término quanto a de juízo.
- source_word: וְנֶחֱרָצָה
  choice: e decretada
  rationale: O particípio nifal feminino concorda com כָלָה e indica algo decidido ou determinado. A coordenação adjetival é clara e natural em português.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Mantém o título אֲדֹנָי e representa explicitamente o nome divino יהוה, evitando a combinação pouco natural 'Senhor SENHOR'.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: É a forma tradicional e inteligível do título divino, preservando sua associação com as hostes sob o comando de Deus.
- source_word: עֹשֶׂה
  choice: está realizando
  rationale: O particípio apresenta a ação como em curso ou iminente; 'está realizando' expressa naturalmente a execução do juízo determinado.
- source_word: בְּקֶרֶב
  choice: no meio de
  rationale: Preserva a força espacial da expressão hebraica, indicando que a ação ocorre dentro de toda a terra ou país.
- source_word: כָּל הָאָרֶץ
  choice: toda a terra
  rationale: אֶרֶץ pode designar tanto a terra em sentido amplo quanto um território específico. A leitura ampla se ajusta à formulação, enquanto a alternativa contextual é preservada em nota.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A escolha preserva tanto o título אֲדֹנָי quanto o nome pessoal יהוה, sem ocultar o nome divino nem produzir a sequência 'Senhor SENHOR'.
- issue: Alcance de הָאָרֶץ
  choice: toda a terra
  alternative: todo o país
  rationale: O termo hebraico admite alcance universal ou territorial. O texto principal conserva a leitura mais ampla, e a nota mantém a possibilidade mais restrita exigida pelo contexto histórico.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem foi ajustada para soar natural em português sem perder os componentes do hebraico; a ambiguidade de אֶרֶץ foi mantida por meio de nota.
