id: ISA.10.2
reference: Isaiah 10:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לְ/הַטּ֤וֹת מִ/דִּין֙ דַּלִּ֔ים וְ/לִ/גְזֹ֕ל מִשְׁפַּ֖ט עֲנִיֵּ֣י עַמִּ֑/י לִ/הְי֤וֹת אַלְמָנוֹת֙ שְׁלָלָ֔/ם וְ/אֶת יְתוֹמִ֖ים יָבֹֽזּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/002.yaml
  text: to turn aside the poor from justice[a], and to rob the afflicted of my people of their right, so that widows may become their spoil[b], and they may plunder the fatherless.
translation:
  language: pt
  text: para afastar os pobres da justiça e roubar dos aflitos do meu povo o seu direito[a], fazendo das viúvas o seu despojo e saqueando os órfãos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a justiça”. O termo hebraico pode indicar a justiça, uma decisão judicial ou aquilo que é legalmente devido a alguém.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “os que não têm pai”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַטּוֹת מִדִּין דַּלִּים
  choice: para afastar os pobres da justiça
  rationale: O infinitivo causativo de נטה descreve a ação de desviar ou excluir alguém da justiça. A formulação preserva a metáfora e o sentido jurídico sem explicitar além do hebraico.
- source_word: וְלִגְזֹל מִשְׁפַּט
  choice: e roubar ... o seu direito
  rationale: גזל indica tomar de modo violento ou injusto, e מִשְׁפָּט aqui aponta para o direito ou amparo legal devido às pessoas oprimidas.
- source_word: עֲנִיֵּי עַמִּי
  choice: dos aflitos do meu povo
  rationale: עָנִי pode designar pobres, aflitos ou oprimidos. “Aflitos” mantém a dimensão de sofrimento e opressão, enquanto “meu povo” preserva o sufixo divino de primeira pessoa.
- source_word: לִהְיוֹת אַלְמָנוֹת שְׁלָלָם
  choice: fazendo das viúvas o seu despojo
  rationale: O infinitivo pode exprimir propósito ou resultado. “Fazendo” mantém essa relação sem decidir rigidamente entre ambos, e “despojo” conserva a imagem predatória de שָׁלָל.
- source_word: וְאֶת יְתוֹמִים יָבֹזּוּ
  choice: e saqueando os órfãos
  rationale: בזז significa saquear ou despojar. יָתוֹם refere-se especificamente a quem perdeu o pai, mas “órfãos” é a forma natural e amplamente compreensível em português, com a precisão registrada em nota.
theological_decisions:
- issue: Categorias sociais vulneráveis na denúncia profética
  choice: Preservar as categorias concretas “viúvas” e “órfãos”.
  alternative: Generalizar como “os vulneráveis”.
  rationale: O hebraico identifica grupos sociais específicos; mantê-los conserva a força ética e jurídica da denúncia.
- issue: Sufixo de primeira pessoa em עַמִּי
  choice: “meu povo”
  alternative: “seu povo” ou omissão do possessivo
  rationale: O texto hebraico traz primeira pessoa singular e mantém a perspectiva do locutor divino no contexto.
- issue: Relação expressa por לִהְיוֹת
  choice: “fazendo das viúvas...”
  alternative: “para que as viúvas se tornem...”
  rationale: A construção pode indicar propósito ou resultado. O gerúndio português preserva essa abertura sem eliminar a responsabilidade dos agentes.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário jurídico acessível. A repetição temática entre justiça e direito foi mantida com termos distintos para refletir דִּין e מִשְׁפָּט. Todos os marcadores de nota aparecem no texto.
