source:
  edition: WLC
  text: בְּ/ג֤וֹי חָנֵף֙ אֲשַׁלְּחֶ֔/נּוּ וְ/עַל עַ֥ם עֶבְרָתִ֖/י אֲצַוֶּ֑/נּוּ לִ/שְׁלֹ֤ל שָׁלָל֙ וְ/לָ/בֹ֣ז בַּ֔ז ו/ל/שימ/ו מִרְמָ֖ס כְּ/חֹ֥מֶר חוּצֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/006.yaml
  text: Against a godless nation I send him[a], and against the people of my wrath I command him, to seize spoil and to carry off plunder[c][b], and to make it a trampling place like the mud of the streets.
translation:
  language: pt
  text: Eu o envio contra uma nação ímpia[a] e lhe dou ordens contra o povo que é alvo da minha ira, para tomar despojos e levar embora o saque[b], e para fazer dele algo pisado aos pés[c], como a lama das ruas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma nação profana”. O termo hebraico pode indicar impiedade, profanação ou falta de temor a Deus.'
    reason: lexical_alternative
  - marker: b
    text: 'Em hebraico, literalmente: “despojar despojos e saquear saque”, expressão que intensifica os atos de pilhagem.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “fazer dele um lugar de pisoteio”. O sufixo hebraico está no masculino singular e retoma a nação ou o povo como coletividade.'
    reason: alternative_reading
lexical_decisions:
- source_word: גּוֹי חָנֵף
  choice: uma nação ímpia
  rationale: גּוֹי indica uma nação ou povo como coletividade, e חָנֵף, no uso profético, expressa impiedade ou profanação religiosa, não apenas hipocrisia.
- source_word: אֲשַׁלְּחֶנּוּ
  choice: Eu o envio
  rationale: Preserva o pronome masculino singular e a vivacidade do imperfeito no discurso profético; o contexto identifica o agente como a Assíria personificada ou seu rei.
- source_word: עַם עֶבְרָתִי
  choice: o povo que é alvo da minha ira
  rationale: Mantém עַם como 'povo' em paralelo com 'nação' e conserva explicitamente a linguagem da ira divina, tornando clara em português a relação genitiva condensada.
- source_word: אֲצַוֶּנּוּ
  choice: lhe dou ordens
  rationale: Expressa naturalmente em português a ação de צוה e mantém Deus como aquele que comissiona o agente.
- source_word: לִשְׁלֹל שָׁלָל וְלָבֹז בַּז
  choice: para tomar despojos e levar embora o saque
  rationale: As duas construções com verbo e substantivo cognatos intensificam a pilhagem; a formulação preserva o paralelismo sem produzir repetição artificial em português.
- source_word: וּלְשִׂימוֹ מִרְמָס
  choice: e para fazer dele algo pisado aos pés
  rationale: O sufixo masculino singular retoma coletivamente a nação ou o povo. מִרְמָס pode designar aquilo que é calcado; a tradução evita impor exclusivamente o sentido locativo de 'lugar de pisoteio'.
- source_word: כְּחֹמֶר חוּצוֹת
  choice: como a lama das ruas
  rationale: חֹמֶר, neste contexto, é lama ou lodo, e חוּצוֹת são as ruas ou espaços públicos; a imagem fica concreta e natural.
theological_decisions:
- issue: Referente dos sufixos masculinos singulares aplicados ao agente
  choice: Traduzir o agente por 'o/lhe', entendido no contexto como o rei assírio ou a Assíria personificada.
  alternative: Explicitar 'o rei da Assíria' ou empregar uma referência corporativa à Assíria.
  rationale: O hebraico usa o masculino singular, enquanto Isaías 10:5 fornece a identificação contextual. Não se acrescenta ao versículo uma especificação ausente nele.
- issue: Linguagem da ira divina
  choice: Conservar diretamente 'minha ira'.
  alternative: Abrandar para 'o povo com quem estou irado'.
  rationale: עֶבְרָתִי atribui explicitamente a ira a Deus no contexto de juízo; a força teológica não deve ser diluída.
- issue: Referente do sufixo em וּלְשִׂימוֹ
  choice: Usar 'dele' para a nação/o povo como coletividade.
  alternative: 'Entender o sufixo como referência ao território ou traduzir de modo locativo: ''fazer dele um lugar de pisoteio''.'
  rationale: O masculino singular pode retomar o alvo coletivo. A tradução principal conserva essa referência, e a nota registra a possibilidade locativa sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem foi ajustada para fluência, sem ocultar o paralelismo, a violência do juízo nem as ambiguidades do hebraico.
