  text: ע֥וֹד הַ/יּ֖וֹם בְּ/נֹ֣ב לַֽ/עֲמֹ֑ד יְנֹפֵ֤ף יָד/וֹ֙ הַ֣ר בית צִיּ֔וֹן גִּבְעַ֖ת יְרוּשָׁלִָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/032.yaml
  text: Still this very day he will halt at Nob[a]; he will shake his hand at the mountain of the daughter of Zion[b], the hill of Jerusalem.
translation:
  language: pt
  text: Ainda hoje ele parará em Nobe; agitará a mão[a] contra o monte da casa de Sião[b], a colina de Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “acenará com a mão” ou “brandirá a mão”. O verbo hebraico pode descrever um gesto de ameaça.
    reason: lexical_alternative
  - marker: b
    text: O texto hebraico fornecido diz literalmente “o monte da casa de Sião”. Outros testemunhos e edições trazem “o monte da filha de Sião”.
    reason: alternative_reading
lexical_decisions:
- source_word: ע֥וֹד הַיּ֖וֹם
  choice: Ainda hoje
  rationale: A combinação expressa continuação e imediatismo na cena profética. “Ainda hoje” é natural em português e mantém a ideia de que o avanço prossegue nesse mesmo dia.
- source_word: בְּנֹ֣ב לַֽעֲמֹ֑ד
  choice: parará em Nobe
  rationale: No contexto do avanço militar, עמד indica parar ou deter-se num lugar. “Parará em Nobe” comunica isso com clareza, sem acrescentar duração à parada.
- source_word: יְנֹפֵ֤ף יָד/וֹ֙
  choice: agitará a mão ameaçadoramente
  rationale: O verbo נוף descreve o gesto de agitar ou brandir. O contexto mostra seu caráter hostil; o advérbio torna inteligível em português a força do gesto sem substituir “mão” por “punho”.
- source_word: הַ֣ר בית צִיּ֔וֹן
  choice: o monte da casa de Sião
  rationale: O texto hebraico fornecido contém בית, “casa”, por isso a tradução conserva a expressão incomum em vez de corrigi-la silenciosamente para “filha” ou reduzi-la a “monte Sião”.
- source_word: גִּבְעַ֖ת יְרוּשָׁלִָֽם
  choice: a colina de Jerusalém
  rationale: Tradução direta da cadeia construta, preservando o paralelismo topográfico com o monte mencionado antes.
theological_decisions:
- issue: Referente do sujeito singular implícito
  choice: Manter “ele” sem identificar o referente
  alternative: “o rei da Assíria” ou “o exército assírio”
  rationale: O contexto aponta para o invasor assírio, mas o versículo usa uma forma singular sem nomeá-lo. A tradução preserva essa indeterminação.
- issue: Sentido da expressão incomum הַר בית ציון no texto fornecido
  choice: “o monte da casa de Sião”
  alternative: “o monte da filha de Sião” ou “o monte Sião”
  rationale: A escolha segue os caracteres do testemunho hebraico apresentado e não resolve por conjectura a tensão textual.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com futuro narrativo para a cena profética. “Nobe” segue a forma tradicional do topônimo em português. A expressão textual incomum “casa de Sião” foi preservada e esclarecida em nota.
