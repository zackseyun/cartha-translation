  text: He has come against Aiath; he has passed through Migron. At Michmash he stores his baggage.
translation:
  language: pt
  text: Ele avançou contra Aiate; passou por Migrom. Em Micmás, deixa sua bagagem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּא עַל
  choice: chegou contra
  rationale: Preserva o valor hostil de עַל no contexto do avanço militar, sem explicitar além do hebraico uma ação como atacar.
- source_word: עָבַר בְּמִגְרוֹן
  choice: passou por Migrom
  rationale: Expressa naturalmente em português o deslocamento através da localidade indicado por בְּ.
- source_word: יַפְקִיד כֵּלָיו
  choice: deixou sua bagagem
  rationale: No contexto militar, יַפְקִיד indica confiar, depositar ou deixar os apetrechos sob guarda; 'bagagem' comunica o sentido contextual de כֵּלָיו sem sobrecarregar o verso. O passado acompanha a sequência profética apresentada como já em curso.
