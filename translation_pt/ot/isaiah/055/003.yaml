base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/003.yaml
  text: Incline your ear and come to me; hear[a], and your soul shall live; and I will make with you an everlasting covenant—the faithful covenant love promised to David.
translation:
  language: pt
  text: Inclinem os ouvidos e venham a mim; escutem, e vocês viverão. Farei com vocês uma aliança eterna — as fiéis demonstrações de amor leal prometidas a Davi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as misericórdias garantidas a Davi” ou “o amor leal prometido a Davi”. O termo hebraico חֶסֶד pode expressar amor leal, bondade ou misericórdia, especialmente no contexto de uma aliança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַטּוּ אָזְנְכֶם
  choice: Inclinem os ouvidos
  rationale: Preserva a metáfora hebraica de voltar ou inclinar os ouvidos para ouvir atentamente; o plural é mais natural em português diante do destinatário coletivo.
- source_word: וּלְכוּ אֵלַי
  choice: e venham a mim
  rationale: No contexto de um convite feito pelo próprio falante, הלך com אֶל corresponde naturalmente a “vir a mim”.
- source_word: שִׁמְעוּ
  choice: escutem
  rationale: Expressa a audição atenta e receptiva sugerida por שמע sem explicitar “obedeçam”, sentido possível, mas não obrigatório aqui.
- source_word: וּתְחִי נַפְשְׁכֶם
  choice: e vocês viverão
  rationale: נפש pode designar a pessoa ou a vida inteira. A formulação natural em português comunica o sentido integral e preserva a sequência de convite e resultado, sem impor a noção moderna de uma alma separada.
- source_word: וְאֶכְרְתָה לָכֶם בְּרִית
  choice: Farei com vocês uma aliança
  rationale: כרת ברית é a expressão idiomática para fazer ou firmar uma aliança; “farei com vocês” mantém a relação entre Deus e os destinatários.
- source_word: בְּרִית עוֹלָם
  choice: uma aliança eterna
  rationale: Em contexto de aliança, עוֹלָם indica duração permanente; “eterna” é corrente, clara e digna em português.
- source_word: חַסְדֵי דָוִד
  choice: o amor da aliança prometido a Davi
  rationale: חסד, neste contexto, denota amor leal e gracioso no âmbito da aliança. A expressão associa esse amor às promessas dadas a Davi, sem atribuir a Davi os atos de misericórdia.
- source_word: הַנֶּאֱמָנִים
  choice: fiel
  rationale: O termo derivado de אמן qualifica esse amor como seguro, confiável e digno de fé; “fiel” preserva tanto a confiabilidade quanto o tom da aliança.
theological_decisions:
- issue: Sentido de חַסְדֵי דָוִד הַנֶּאֱמָנִים em relação à aliança eterna
  choice: O fiel amor da aliança prometido a Davi
  alternative: As misericórdias fiéis de Davi; os atos fiéis de bondade praticados por Davi
  rationale: Deus é quem promete fazer a aliança com os ouvintes; por isso, a frase aponta mais provavelmente para o amor leal e as bênçãos confiáveis da aliança concedidas ou prometidas a Davi e agora oferecidas aos destinatários. A nota conserva as alternativas lexicais sem impor desenvolvimentos doutrinários posteriores.
translation_notes:
  register: Português moderno, solene e acessível, com boa legibilidade brasileira. “Vocês” torna explícito o destinatário plural; a construção evita tanto arcaísmos como uma paráfrase excessivamente interpretativa.
