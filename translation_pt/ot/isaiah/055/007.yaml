  terminology: “Yahweh” representa adequadamente o Tetragrama; “volte” preserva a imagem de שוב sem impor “arrependa-se”; “compaixão” e “perdoará abundantemente” comunicam bem רחם e a intensificação de רבה com o infinitivo לסלוח.
