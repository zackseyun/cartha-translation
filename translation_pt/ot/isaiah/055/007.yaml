source:
  edition: WLC
  text: יַעֲזֹ֤ב רָשָׁע֙ דַּרְכּ֔/וֹ וְ/אִ֥ישׁ אָ֖וֶן מַחְשְׁבֹתָ֑י/ו וְ/יָשֹׁ֤ב אֶל יְהוָה֙ וִֽ/ירַחֲמֵ֔/הוּ וְ/אֶל אֱלֹהֵ֖י/נוּ כִּֽי יַרְבֶּ֥ה לִ/סְלֽוֹחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/007.yaml
  text: Let the wicked man forsake his way[a], and the man of iniquity his thoughts; let him return to Yahweh, and he will have compassion on him, and to our God[e][d][c][b], for he will abundantly pardon.
translation:
  language: pt
  text: Que o perverso abandone o seu caminho, e o homem iníquo, os seus pensamentos; que volte para Yahweh, e ele terá compaixão dele; que volte para o nosso Deus, pois ele perdoará abundantemente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “pois multiplicará o perdoar”; isto é, perdoará amplamente ou com generosidade.'
    reason: A nota preserva a forma intensiva incomum de כִּי יַרְבֶּה לִסְלוֹחַ por trás da tradução idiomática.
lexical_decisions:
- source_word: יַעֲזֹב
  choice: abandone
  rationale: O qal imperfeito tem força exortativa neste contexto; “abandone” expressa uma renúncia deliberada, sem a tonalidade arcaica de alternativas mais formais.
- source_word: רָשָׁע
  choice: o perverso
  rationale: O substantivo masculino singular designa uma pessoa caracterizada pela maldade. A forma substantivada é natural em português e mantém seu valor representativo.
- source_word: דַּרְכּוֹ
  choice: o seu caminho
  rationale: Preserva a metáfora hebraica do caminho como modo ou curso de vida, sem reduzi-la apenas à conduta externa.
- source_word: אִישׁ אָוֶן
  choice: o homem iníquo
  rationale: Mantém o substantivo אִישׁ e expressa אָוֶן em seu sentido moral neste contexto, além de conservar o paralelismo nominal com “o perverso”.
- source_word: מַחְשְׁבֹתָיו
  choice: os seus pensamentos
  rationale: O termo pode incluir pensamentos, intenções e planos. “Pensamentos” preserva a amplitude e ressalta a dimensão interior em paralelo com o caminho.
- source_word: וְיָשֹׁב
  choice: que volte
  rationale: שׁוּב indica voltar ou retornar. “Que volte” conserva o movimento relacional em direção a Deus, sem substituir a imagem pelo termo teológico mais específico “arrependa-se”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: וִירַחֲמֵהוּ
  choice: que terá compaixão dele
  rationale: רחם comunica compaixão e misericórdia pessoal. O imperfeito é entendido como a resposta prometida de Yahweh ao retorno da pessoa.
- source_word: אֱלֹהֵינוּ
  choice: o nosso Deus
  rationale: Reproduz diretamente a forma possessiva e preserva a voz comunitária do profeta.
- source_word: כִּי יַרְבֶּה לִסְלוֹחַ
  choice: pois ele perdoará abundantemente
  rationale: A construção intensifica o ato de perdoar. A formulação é idiomática em português e retém a ideia de perdão em grande medida.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O hebraico apresenta diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em transliteração, sem trocá-lo por um título.
- issue: Sentido teológico de שׁוּב
  choice: que volte
  alternative: que se arrependa; que retorne
  rationale: “Volte” mantém a metáfora relacional do hebraico e sua amplitude, enquanto “arrependa-se” explicitaria uma interpretação teológica legítima, mas mais estreita.
- issue: Relação entre o retorno e a compaixão divina
  choice: que volte para Yahweh, que terá compaixão dele
  alternative: que volte para Yahweh, para que ele tenha compaixão dele
  rationale: A forma verbal pode ser entendida como consequência ou propósito. A tradução apresenta a compaixão como resposta prometida sem transformar a frase numa condição mecânica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. A elipse verbal em “e o homem iníquo, os seus pensamentos” conserva o paralelismo poético sem soar excessivamente arcaica. O nome “Yahweh” segue a política de representar o Tetragrama pelo nome divino.
