  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: תַּ֤חַת הַֽ/נַּעֲצוּץ֙ יַעֲלֶ֣ה בְר֔וֹשׁ תחת הַ/סִּרְפַּ֖ד יַעֲלֶ֣ה הֲדַ֑ס וְ/הָיָ֤ה לַֽ/יהוָה֙ לְ/שֵׁ֔ם לְ/א֥וֹת עוֹלָ֖ם לֹ֥א יִכָּרֵֽת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/013.yaml
  text: Instead of the thornbush[a], the cypress will come up; instead of the brier, the myrtle will come up. And it will be for Yahweh a name[c][b], an everlasting sign that will not be cut off.
translation:
  language: pt
  text: Em vez do espinheiro, crescerá o cipreste[a]; em vez da planta espinhosa[b], crescerá a murta. Isso trará renome[c] a Yahweh e será um sinal eterno, que não será cortado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “abeto”; a espécie exata indicada pelo hebraico berosh é incerta.
    reason: lexical_alternative
  - marker: b
    text: Ou “urtiga” ou “sarça”; a planta exata indicada pelo hebraico sirpad é incerta.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “será para Yahweh um nome”, expressão que indica renome ou memorial.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: em vez de
  rationale: No paralelismo poético, a preposição indica substituição, não posição espacial.
- source_word: נַּעֲצוּץ
  choice: espinheiro
  rationale: Designa uma planta espinhosa de espécie incerta; a escolha preserva a imagem sem impor uma identificação botânica precisa.
- source_word: בְרוֹשׁ
  choice: cipreste
  rationale: É uma identificação tradicional e plausível de uma árvore perene e majestosa, embora a espécie exata seja incerta.
- source_word: סִּרְפַּד
  choice: planta espinhosa
  rationale: A identificação botânica é incerta; a expressão ampla mantém o contraste entre vegetação nociva e benéfica sem falsa precisão.
- source_word: הֲדַס
  choice: murta
  rationale: É a identificação botânica convencional e bem estabelecida.
- source_word: וְהָיָה
  choice: Isso trará ... e será
  rationale: O singular resume a transformação descrita nas duas linhas anteriores; “isso” torna o referente coletivo claro em português.
- source_word: לַיהוָה לְשֵׁם
  choice: trará renome a Yahweh
  rationale: Comunica naturalmente o sentido idiomático de “ser para Yahweh um nome”, isto é, resultar em reputação ou memorial para ele.
- source_word: לְאוֹת עוֹלָם
  choice: um sinal eterno
  rationale: Preserva tanto o caráter público e simbólico de אוֹת como a duração expressa por עוֹלָם.
- source_word: לֹא יִכָּרֵת
  choice: jamais será eliminado
  rationale: Expressa em português natural a permanência do sinal; a nota registra a imagem literal de ser “cortado”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” representa o nome próprio sem substituí-lo por um título.
- issue: Referente do singular וְהָיָה
  choice: a transformação inteira descrita anteriormente
  alternative: uma das árvores mencionadas
  rationale: O singular provavelmente recapitula o resultado global da restauração, que se torna renome e sinal, sem exigir que apenas uma árvore seja o sinal.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético preservado. “Crescerá” comunica naturalmente a imagem vegetal de יַעֲלֶה. As incertezas botânicas são mantidas em notas, e o idioma hebraico לְשֵׁם é traduzido pelo sentido no texto e documentado literalmente em nota.
