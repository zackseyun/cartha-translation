  text: For my thoughts are not your thoughts[a], and your ways are not my ways, declares Yahweh.
translation:
  language: pt
  text: Pois os meus pensamentos não são os pensamentos de vocês[a], e os caminhos de vocês não são os meus caminhos — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois os meus planos não são os planos de vocês, e os caminhos de vocês não são os meus caminhos.” A palavra hebraica traduzida como “pensamentos” também pode ter o sentido de “planos” ou “intenções”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento da exortação anterior, com força natural e clara em português.
- source_word: מַחְשְׁבוֹתַי / מַחְשְׁבוֹתֵיכֶם
  choice: meus pensamentos / pensamentos de vocês
  rationale: Preserva a repetição hebraica e a amplitude semântica do substantivo, que também pode indicar planos ou intenções.
- source_word: דַרְכֵיכֶם / דְּרָכָי
  choice: caminhos de vocês / meus caminhos
  rationale: Mantém a metáfora hebraica e sua possível referência ampla ao modo de agir, viver ou proceder.
- source_word: לֹא ... וְלֹא
  choice: não são ... e ... não são
  rationale: Supre naturalmente a cópula ausente no hebraico e conserva o paralelismo negativo equilibrado.
- source_word: נְאֻם יְהוָה
  choice: declaração de Yahweh
  rationale: Representa a fórmula profética solene como uma declaração divina, sem reduzi-la ao verbo coloquial 'diz'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama; 'Yahweh' preserva o nome pessoal e evita sua substituição interpretativa por um título.
- issue: Amplitude de מַחֲשָׁבוֹת
  choice: pensamentos, com alternativa em nota
  alternative: planos; intenções
  rationale: O termo pode abranger pensamentos, planos e propósitos. O texto principal preserva a formulação mais ampla, enquanto a nota registra a alternativa contextual sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem paralela do hebraico foi preservada sem produzir uma construção artificial; o travessão destaca naturalmente a fórmula profética final.
