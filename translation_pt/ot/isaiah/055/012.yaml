  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי בְ/שִׂמְחָ֣ה תֵצֵ֔אוּ וּ/בְ/שָׁל֖וֹם תּֽוּבָל֑וּ/ן הֶ/הָרִ֣ים וְ/הַ/גְּבָע֗וֹת יִפְצְח֤וּ לִ/פְנֵי/כֶם֙ רִנָּ֔ה וְ/כָל עֲצֵ֥י הַ/שָּׂדֶ֖ה יִמְחֲאוּ כָֽף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/012.yaml
  text: For you will go out with joy and be led in peace[a]; the mountains and the hills will break out in singing before you[b], and all the trees of the field will clap their hands.
translation:
  language: pt
  text: Pois vocês sairão com alegria e serão conduzidos em paz; os montes e as colinas irromperão em cânticos diante de vocês,[a] e todas as árvores do campo baterão palmas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “romperão em canto diante de vocês”.'
    reason: Alternativa lexical para o idioma hebraico פצח ... רנה, que descreve uma súbita manifestação de canto ou júbilo.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Mantém a ligação explicativa ou resultativa com a promessa anterior de modo natural em português.
- source_word: בְשִׂמְחָה תֵצֵאוּ
  choice: vocês sairão com alegria
  rationale: Preserva o futuro na segunda pessoa do plural, o movimento de saída e o substantivo 'alegria'.
- source_word: וּבְשָׁלוֹם תּוּבָלוּן
  choice: e serão conduzidos em paz
  rationale: O hofal de יבל indica que o povo será conduzido. Não se acrescenta 'para fora', ausente neste verbo, enquanto 'em paz' conserva a amplitude de שָׁלוֹם.
- source_word: הֶהָרִים וְהַגְּבָעוֹת
  choice: os montes e as colinas
  rationale: Reproduz de forma clara e poética os dois elementos da paisagem.
- source_word: יִפְצְחוּ ... רִנָּה
  choice: irromperão em cânticos
  rationale: Expressa o começo súbito e exuberante de um canto jubiloso, preservando a energia do idioma hebraico.
- source_word: לִפְנֵיכֶם
  choice: diante de vocês
  rationale: É uma tradução direta e natural, sem decidir entre a nuance espacial de 'à frente' e a de presença.
- source_word: וְכָל עֲצֵי הַשָּׂדֶה
  choice: e todas as árvores do campo
  rationale: Conserva a imagem coletiva e a formulação poética do hebraico.
- source_word: יִמְחֲאוּ כָף
  choice: baterão palmas
  rationale: Traduz o idioma hebraico corrente para a ação de aplaudir e mantém intacta a personificação das árvores.
theological_decisions:
- issue: Personificação poética da criação no cenário de restauração
  choice: Manter montes, colinas e árvores como participantes personificados da alegria
  alternative: Reduzir a linguagem a uma descrição não personificada da beleza da natureza
  rationale: A personificação pertence à imagem poética hebraica e associa a criação à alegria da restauração, sem exigir uma elaboração doutrinária adicional.
- issue: Amplitude semântica de שָׁלוֹם
  choice: em paz
  alternative: em segurança / em pleno bem-estar
  rationale: '''Paz'' preserva a formulação concisa e permite as conotações de segurança, integridade e bem-estar sem restringi-las a uma única dimensão.'
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Emprega 'vocês' para explicitar a segunda pessoa do plural e mantém o paralelismo e a personificação poética. O único marcador de nota, [a], aparece no texto principal.
