id: ISA.55.9
reference: Isaiah 55:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי גָבְה֥וּ שָׁמַ֖יִם מֵ/אָ֑רֶץ כֵּ֣ן גָּבְה֤וּ דְרָכַ/י֙ מִ/דַּרְכֵי/כֶ֔ם וּ/מַחְשְׁבֹתַ֖/י מִ/מַּחְשְׁבֹתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/009.yaml
  text: For as the heavens are higher than the earth[a], so my ways are higher than your ways[b], and my thoughts than your thoughts.
translation:
  language: pt
  text: Pois, assim como os céus são mais altos do que a terra[a], assim os meus caminhos são mais altos do que os caminhos de vocês, e os meus pensamentos, mais altos do que os pensamentos de vocês[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os céus estão acima da terra”. O hebraico também permite exprimir a imagem espacial, embora o contexto estabeleça uma comparação.
    reason: lexical_alternative
  - marker: b
    text: “Pensamentos” também pode significar “planos” ou “intenções” neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento da declaração anterior, preservando de modo natural a força explicativa do hebraico.
- source_word: גָבְהוּ
  choice: são mais altos
  rationale: O perfeito tem aqui sentido estativo, e as construções com מִן estabelecem uma comparação.
- source_word: שָׁמַיִם
  choice: os céus
  rationale: Preserva a forma plural hebraica e o registro poético elevado; “os céus” é corrente e inteligível em português.
- source_word: מֵאָרֶץ
  choice: do que a terra
  rationale: מִן marca comparação neste contexto; a locução “mais altos do que” a expressa com clareza.
- source_word: כֵּן
  choice: assim
  rationale: Assinala a correspondência entre a altura dos céus e a superioridade dos caminhos e pensamentos divinos.
- source_word: דְרָכַי
  choice: os meus caminhos
  rationale: Mantém a metáfora de דֶּרֶךְ para o modo de agir, sem restringi-la mediante paráfrase.
- source_word: מִדַּרְכֵיכֶם
  choice: do que os caminhos de vocês
  rationale: Reproduz a comparação e o paralelismo lexical com “os meus caminhos” em português amplamente compreensível.
- source_word: וּמַחְשְׁבֹתַי
  choice: e os meus pensamentos
  rationale: מַחֲשָׁבוֹת pode designar pensamentos, planos ou intenções; “pensamentos” conserva a amplitude e a ligação lexical com o versículo anterior.
- source_word: מִמַּחְשְׁבֹתֵיכֶם
  choice: do que os pensamentos de vocês
  rationale: Mantém tanto a construção comparativa quanto o paralelismo poético entre o divino e o humano.
theological_decisions:
- issue: Comparação antropomórfica entre a cognição/ação divina e a humana
  choice: Conservar diretamente “os meus caminhos” e “os meus pensamentos”.
  alternative: “meu modo de agir” e “meus planos”
  rationale: A formulação metafórica contrasta a transcendência de Deus com a limitação humana. Uma paráfrase interpretativa estreitaria o sentido e reduziria a força poética.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A repetição de “mais altos” no segundo membro final explicita a elipse hebraica e preserva o paralelismo. “Vocês” comunica naturalmente a segunda pessoa do plural sem regionalismo excessivo.
