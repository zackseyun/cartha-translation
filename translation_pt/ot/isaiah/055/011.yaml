source:
  edition: WLC
  text: כֵּ֣ן יִֽהְיֶ֤ה דְבָרִ/י֙ אֲשֶׁ֣ר יֵצֵ֣א מִ/פִּ֔/י לֹֽא יָשׁ֥וּב אֵלַ֖/י רֵיקָ֑ם כִּ֤י אִם עָשָׂה֙ אֶת אֲשֶׁ֣ר חָפַ֔צְתִּי וְ/הִצְלִ֖יחַ אֲשֶׁ֥ר שְׁלַחְתִּֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/011.yaml
  text: 'so will my word be that goes out from my mouth: it will not return to me empty[c][b][a], but it will accomplish what I desire and succeed in the purpose for which I sent it.'
translation:
  language: pt
  text: 'assim será a minha palavra que sai da minha boca: ela não voltará para mim sem resultado[a], mas realizará o que desejo e terá êxito naquilo para o qual a enviei.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vazia”. O hebraico tem o sentido de “vazia, sem produzir resultado”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e fará prosperar aquilo para o qual a enviei”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן יִהְיֶה
  choice: assim será
  rationale: Retoma diretamente a comparação com a chuva e a neve nos versículos anteriores e preserva o valor futuro da expressão.
- source_word: דְבָרִי
  choice: a minha palavra
  rationale: Mantém a amplitude semântica de דָּבָר e a imagem da fala divina, sem transformar a expressão em título pessoal.
- source_word: אֲשֶׁר יֵצֵא מִפִּי
  choice: que sai da minha boca
  rationale: Reproduz de maneira concreta, natural e atual a imagem hebraica da palavra que parte da boca de Deus.
- source_word: לֹא יָשׁוּב אֵלַי רֵיקָם
  choice: não voltará para mim sem resultado
  rationale: No contexto, רֵיקָם indica que a palavra não retorna vazia ou sem produzir efeito; 'sem resultado' comunica esse sentido claramente sem recorrer ao menos usual 'vazia'.
- source_word: כִּי אִם עָשָׂה אֵת אֲשֶׁר חָפַצְתִּי
  choice: mas realizará o que desejo
  rationale: כִּי אִם estabelece contraste após a negação, e o perfeito עָשָׂה exprime aqui o resultado certo da missão da palavra. 'Desejo' preserva a vontade ou o agrado expresso por חפץ sem inserir linguagem técnica.
- source_word: וְהִצְלִיחַ אֲשֶׁר שְׁלַחְתִּיו
  choice: e terá êxito naquilo para que a enviei
  rationale: הִצְלִיחַ comunica sucesso ou prosperidade. A construção portuguesa explicita com naturalidade a finalidade implícita na oração relativa hebraica.
theological_decisions:
- issue: Possível personificação de 'minha palavra'
  choice: Traduzir como a palavra falada e eficaz de Deus, sem torná-la explicitamente um título pessoal.
  alternative: Ler a expressão cristologicamente como referência direta ao Filho preexistente.
  rationale: O contexto imediato de Isaías 55 compara a eficácia da declaração divina à ação da chuva e da neve. Uma leitura cristológica pode surgir da teologia canônica, mas não deve ser inserida na tradução deste texto.
- issue: Eficácia divina e resposta humana
  choice: Afirmar a certeza de que a palavra cumpre o desejo e a missão de Deus, sem acrescentar formulações deterministas.
  alternative: Parafrasear o texto como decreto irresistível ou, no sentido oposto, como fala meramente persuasiva.
  rationale: O hebraico declara a eficácia da palavra enviada por Deus, mas não desenvolve neste versículo um sistema sobre os mecanismos dessa eficácia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura conserva a comparação iniciada no contexto anterior e a imagem concreta da palavra que sai da boca de Deus. Evitou-se tanto o arcaísmo 'não voltará vazia' no texto principal quanto uma paráfrase teologicamente carregada.
