source:
  edition: WLC
  text: לָ֤/מָּה תִשְׁקְלוּ כֶ֨סֶף֙ בְּֽ/לוֹא לֶ֔חֶם וִ/יגִיעֲ/כֶ֖ם בְּ/ל֣וֹא לְ/שָׂבְעָ֑ה שִׁמְע֨וּ שָׁמ֤וֹעַ אֵלַ/י֙ וְ/אִכְלוּ ט֔וֹב וְ/תִתְעַנַּ֥ג בַּ/דֶּ֖שֶׁן נַפְשְׁ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/002.yaml
  text: Why do you weigh out silver for what is not bread[a], and your labor for what does not satisfy? Listen carefully to me, and eat what is good[c][b], and let your soul delight itself in richness.
translation:
  language: pt
  text: Por que vocês pesam prata pelo que não é pão[a] e despendem seu esforço no que não satisfaz? Escutem-me com atenção[b] e comam o que é bom; que a alma de vocês se deleite com a fartura[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “gastam dinheiro”; literalmente, “pesam prata”, numa referência ao pagamento feito por peso.
    reason: lexical_alternative
  - marker: b
    text: Ou “Escutem, escutem-me”; o hebraico intensifica a ordem mediante a combinação de um imperativo com um infinitivo absoluto.
    reason: lexical_alternative
  - marker: c
    text: Ou “com a riqueza”, “com a abundância” ou, literalmente, “com a gordura”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁקְלוּ כֶסֶף
  choice: pesam prata
  rationale: Preserva a imagem concreta do pagamento antigo, em que a prata era pesada, sem reduzir כֶסֶף simplesmente a “dinheiro”.
- source_word: בְּלוֹא לֶחֶם
  choice: pelo que não é pão
  rationale: Mantém de perto a expressão hebraica e a imagem poética do alimento que não nutre.
- source_word: וִיגִיעֲכֶם
  choice: e empregam o fruto do seu trabalho
  rationale: יְגִיעַ pode indicar tanto o esforço quanto aquilo que ele produz. “Fruto do seu trabalho” torna natural o paralelismo econômico em português, sem eliminar totalmente essa amplitude.
- source_word: בְּלוֹא לְשָׂבְעָה
  choice: no que não satisfaz
  rationale: Expressa em português corrente a ideia de ausência de saciedade ou plenitude.
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: Escutem-me com atenção
  rationale: A construção com imperativo e infinitivo absoluto intensifica a ordem; “com atenção” comunica essa ênfase de modo natural.
- source_word: וְאִכְלוּ טוֹב
  choice: e comam o que é bom
  rationale: O adjetivo טוֹב tem função substantiva; “o que é bom” preserva sua amplitude sem especificar indevidamente o referente.
- source_word: וְתִתְעַנַּג
  choice: que ... se deleite
  rationale: A forma hitpael tem nuance reflexiva, e seu sujeito feminino singular é נֶפֶשׁ, apresentado logo depois.
- source_word: בַּדֶּשֶׁן
  choice: com a fartura
  rationale: דֶּשֶׁן denota literalmente gordura e, por extensão, riqueza, alimento rico ou abundância. “Fartura” preserva a imagem de provisão abundante sem as conotações modernas potencialmente enganosas de “gordura”.
- source_word: נַפְשְׁכֶם
  choice: a alma de vocês
  rationale: נֶפֶשׁ pode significar alma, vida ou a própria pessoa. “Alma” mantém o registro poético e a referência à pessoa interior, conservando a construção gramatical hebraica.
theological_decisions:
- issue: Linguagem metafórica de alimento e satisfação
  choice: Manter as imagens concretas de pão, comer, satisfação e fartura.
  alternative: Explicitar no texto que se trata de nutrição ou satisfação espiritual.
  rationale: O hebraico apresenta um convite por meio de imagens alimentares concretas. Torná-las explicitamente “espirituais” resolveria no texto uma dimensão interpretativa que a formulação poética deixa aberta.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas de terceira pessoa do plural (“vocês”). A tradução preserva o paralelismo poético e as imagens econômicas e alimentares do hebraico, recorrendo a equivalência ótima onde uma reprodução estritamente formal seria pouco natural.
