  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ה֤וֹי כָּל צָמֵא֙ לְכ֣וּ לַ/מַּ֔יִם וַ/אֲשֶׁ֥ר אֵֽין ל֖/וֹ כָּ֑סֶף לְכ֤וּ שִׁבְרוּ֙ וֶֽ/אֱכֹ֔לוּ וּ/לְכ֣וּ שִׁבְר֗וּ בְּ/לוֹא כֶ֛סֶף וּ/בְ/ל֥וֹא מְחִ֖יר יַ֥יִן וְ/חָלָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/001.yaml
  text: Come[a], everyone who is thirsty, come to the waters; and he who has no money, come, buy and eat! Yes[b], come, buy wine and milk without money and without price.
translation:
  language: pt
  text: Ó[a], todos os que têm sede, venham às águas! E os que não têm dinheiro, venham, comprem e comam! Venham, comprem vinho e leite sem dinheiro e sem custo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ei!”; a interjeição hebraica introduz aqui um chamado urgente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Ó
  rationale: A interjeição introduz uma convocação pública e urgente. “Ó” conserva sua presença explícita e o tom elevado, enquanto a nota oferece uma alternativa mais coloquial.
- source_word: כָּל צָמֵא
  choice: todos vocês que têm sede
  rationale: O singular coletivo hebraico abrange todos os sedentos; a formulação plural é natural em português e se harmoniza com os imperativos plurais seguintes.
- source_word: לְכוּ
  choice: venham
  rationale: Embora o verbo básico seja “ir”, neste chamado direto o imperativo idiomático em português é “venham”. A repetição preserva a insistência do hebraico.
- source_word: לַמַּיִם
  choice: às águas
  rationale: Mantém o plural hebraico e sua imagem poética de provisão abundante.
- source_word: וַאֲשֶׁר אֵין לוֹ כָּסֶף
  choice: E vocês que não têm dinheiro
  rationale: A construção singular masculina tem força genérica. O plural inclusivo comunica naturalmente essa referência em português e concorda com os imperativos plurais, sem limitar o convite a homens.
- source_word: שִׁבְרוּ
  choice: comprem
  rationale: No contexto de aquisição de alimentos, o verbo significa “comprar”. A aparente contradição de comprar sem dinheiro é preservada.
- source_word: וֶאֱכֹלוּ
  choice: e comam
  rationale: Mantém de modo direto a sequência coordenada de imperativos.
- source_word: בְּלוֹא כֶסֶף
  choice: sem dinheiro
  rationale: Tradução direta que conserva o paradoxo econômico da oferta gratuita.
- source_word: וּבְלוֹא מְחִיר
  choice: sem pagar
  rationale: Expressa em português corrente a ausência de preço ou pagamento, evitando a possível leitura de “sem valor” associada a “sem preço”.
- source_word: יַיִן וְחָלָב
  choice: vinho e leite
  rationale: Preserva literalmente as imagens concretas de alimento rico e provisão abundante, sem espiritualizá-las na tradução.
theological_decisions:
- issue: Forma masculina singular de alcance genérico
  choice: 'Traduzida no plural inclusivo: “vocês que não têm dinheiro”.'
  alternative: “aquele que não tem dinheiro”
  rationale: O masculino singular hebraico é representativo, não uma restrição do convite aos homens. O plural português torna explícito seu alcance genérico e acompanha os imperativos plurais.
- issue: Imagem econômica e alimentar versus paráfrase espiritual
  choice: Mantidas as imagens concretas de comprar, comer, vinho e leite.
  alternative: Explicitar no texto ideias como salvação gratuita ou bênçãos espirituais.
  rationale: A dimensão teológica deve emergir das imagens do próprio texto; explicitá-la por paráfrase resolveria indevidamente sua riqueza e abertura poética.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A interjeição “Ó” conserva o tom poético; “sem pagar” evita a ambiguidade moderna de “sem preço”. A repetição de “venham, comprem” reproduz a convocação insistente do hebraico.
