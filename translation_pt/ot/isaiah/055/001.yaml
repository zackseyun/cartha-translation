    issue: A expressão “Ó, todos vocês que têm sede” combina uma interjeição poética com “vocês”, produzindo uma formulação algo pesada.
    rationale: O hebraico chama coletivamente “todos os sedentos”. “Ó, todos os que têm sede” é mais natural e mantém o registro solene do chamado.
  - severity: medium
    issue: “Sem pagar” não corresponde de modo tão direto a וּבְלוֹא מְחִיר (“e sem preço/custo”).
    rationale: A expressão hebraica afirma a inexistência de preço ou custo; “sem pagar” focaliza o ato de pagamento. “Sem custo” conserva melhor o paralelismo e o sentido econômico.
  revised_text: Ó[a], todos os que têm sede, venham às águas! E os que não têm dinheiro, venham, comprem e comam! Venham, comprem vinho e leite sem dinheiro e sem custo.
