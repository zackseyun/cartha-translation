base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/010.yaml
  text: For just as the rain and the snow come down from heaven and do not return there unless they have watered the earth[a], made it bear fruit, and made it sprout, and have given seed to the sower and bread to the eater[b],
translation:
  language: pt
  text: Pois, assim como a chuva e a neve descem do céu[a] e não voltam para lá sem antes regar a terra, fazê-la dar fruto e brotar[b], e dar semente ao semeador e pão a quem come,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos céus”. A palavra hebraica שָׁמַיִם tem forma plural e, conforme o contexto, pode significar “céu”, “céus” ou “firmamento”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “fazê-la produzir e crescer”. Os dois verbos ressaltam a resposta fértil da terra à chuva e à neve.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כַּאֲשֶׁר
  choice: Pois, assim como
  rationale: Preserva tanto a função explicativa de כִּי quanto a comparação introduzida por כַּאֲשֶׁר, que se completa no versículo seguinte.
- source_word: יֵרֵד הַגֶּשֶׁם וְהַשֶּׁלֶג
  choice: a chuva e a neve descem
  rationale: “Descem” conserva o sentido direcional de ירד e concorda naturalmente em português com o sujeito composto.
- source_word: מִן הַשָּׁמַיִם
  choice: do céu
  rationale: “Céu” é a forma coletiva mais natural neste contexto; a alternativa formal plural é registrada em nota.
- source_word: וְשָׁמָּה לֹא יָשׁוּב כִּי אִם
  choice: e não voltam para lá sem antes
  rationale: Expressa a negação, o advérbio direcional שָׁמָּה e a ideia de que o retorno não ocorre antes de se cumprirem os efeitos descritos.
- source_word: הִרְוָה אֶת הָאָרֶץ
  choice: regar a terra
  rationale: O hifil de רוה indica fazer receber água, regar ou saturar; “regar a terra” é claro e mantém a imagem agrícola.
- source_word: וְהוֹלִידָהּ וְהִצְמִיחָהּ
  choice: fazê-la dar fruto e brotar
  rationale: Mantém o valor causativo dos dois verbos e distingue a produção da terra do surgimento do crescimento vegetal.
- source_word: וְנָתַן זֶרַע לַזֹּרֵעַ
  choice: e dar semente ao semeador
  rationale: Conserva a imagem concreta e o paralelismo agrícola do hebraico.
- source_word: וְלֶחֶם לָאֹכֵל
  choice: e pão a quem come
  rationale: Traduz לֶחֶם especificamente como “pão” e verte o particípio de modo corrente, sem perder o paralelismo com “semeador”.
