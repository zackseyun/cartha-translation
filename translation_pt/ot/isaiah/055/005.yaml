source:
  edition: WLC
  text: הֵ֣ן גּ֤וֹי לֹֽא תֵדַע֙ תִּקְרָ֔א וְ/ג֥וֹי לֹֽא יְדָע֖וּ/ךָ אֵלֶ֣י/ךָ יָר֑וּצוּ לְמַ֨עַן֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/לִ/קְד֥וֹשׁ יִשְׂרָאֵ֖ל כִּ֥י פֵאֲרָֽ/ךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/005.yaml
  text: Behold[a], you will call a nation that you do not know, and a nation that did not know you will run to you, because of Yahweh your God, and the Holy One of Israel[c][b], for he has glorified you.
translation:
  language: pt
  text: Eis que você convocará uma nação que não conhece, e uma nação que não conhecia você correrá para você[a], por causa de Yahweh, seu Deus,[b] e do Santo de Israel, pois ele glorificou você.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se apressará para chegar até você”.'
    reason: Alternativa lexical para יָרוּצוּ, que pode destacar rapidez sem exigir uma corrida literal.
  - marker: b
    text: 'Ou: “por amor de Yahweh, seu Deus”.'
    reason: לְמַעַן também pode ser expresso como “por amor de” ou “por causa de”, conforme a nuance contextual atribuída à locução.
  - marker: c
    text: 'Ou: “honrou você”, “adornou você” ou “embelezou você”.'
    reason: פאר no piel abrange honra, adorno, beleza e glória.
lexical_decisions:
- source_word: הֵן
  choice: Eis que
  rationale: Introduz um anúncio enfático e preserva a força profética em português digno e compreensível.
- source_word: גּוֹי
  choice: nação
  rationale: Designa um povo ou grupo nacional; “nação” mantém o sentido amplo sem acrescentar a ideia específica de gentios.
- source_word: לֹא תֵדַע
  choice: que não conhece
  rationale: O imperfeito na oração relativa expressa a falta de conhecimento no horizonte da ação futura; o presente é natural em português.
- source_word: תִּקְרָא
  choice: convocará
  rationale: קרא pode significar chamar ou convocar; “convocará” comunica aqui o chamado dirigido a uma nação sem perder o valor futuro.
- source_word: לֹא יְדָעוּךָ
  choice: que não conhecia você
  rationale: O perfeito descreve a ausência prévia de relação ou conhecimento. A repetição de “você” evita atribuir gênero ao referente, que o versículo não identifica explicitamente.
- source_word: אֵלֶיךָ יָרוּצוּ
  choice: correrá para você
  rationale: רוּץ indica movimento rápido e concreto. O verbo fica no singular em português por concordar com “uma nação”, embora a forma hebraica seja plural por referência coletiva aos seus integrantes.
- source_word: לְמַעַן
  choice: por causa de
  rationale: No contexto, introduz a razão pela qual a nação acorre; esta formulação transmite claramente a relação causal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Tradução direta e idiomática da construção com sufixo de segunda pessoa do singular.
- source_word: וְלִקְדוֹשׁ יִשְׂרָאֵל
  choice: e do Santo de Israel
  rationale: Mantém a coordenação com “Yahweh, seu Deus” dentro da expressão causal, sem decidir além do texto se a segunda designação é estritamente apositiva.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação para a resposta da nação e conserva o encadeamento elevado da declaração profética.
- source_word: פֵאֲרָךְ
  choice: ele glorificou você
  rationale: O piel de פאר pode exprimir adornar, honrar, embelezar ou glorificar. “Glorificou” reúne a ideia de honra e esplendor público apropriada ao contexto.
theological_decisions:
- issue: Referente dos pronomes de segunda pessoa do singular
  choice: Manter “você” sem identificar expressamente o destinatário.
  alternative: Especificar o destinatário como Sião/Jerusalém, Israel ou uma figura davídica.
  rationale: O hebraico se dirige a um destinatário singular, mas o versículo não exige que a tradução resolva sua identidade. O pronome preserva a ambiguidade e a tensão interpretativa.
- issue: Relação entre “Yahweh, seu Deus” e “o Santo de Israel”
  choice: Preservar a coordenação por meio de “e do”.
  alternative: Traduzir de modo explicitamente apositivo, como “isto é, o Santo de Israel”.
  rationale: As duas designações referem-se ao mesmo Deus, mas a sintaxe hebraica emprega a conjunção; a tradução mantém sua forma sem explicitação desnecessária.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. “Eis que” conserva o tom profético; “você” mantém a segunda pessoa singular de modo claro e evita resolver a identidade do destinatário. A repetição de “você” é intencional para não introduzir gênero gramatical no referente.
