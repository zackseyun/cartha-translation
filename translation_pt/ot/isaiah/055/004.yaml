revisions:
- from: 'Vejam: eu o constituí[a] testemunha dos povos[b], líder e comandante dos povos.[c]'
  to: 'Eis: eu o[a] constituí[b] como testemunha para os povos[c], líder e comandante para os povos.'
  rationale: A revisão substitui o imperativo “Vejam” por “Eis”, esclarece a relação expressa por לְ com “para os povos” nas duas ocorrências e reposiciona a nota interpretativa junto ao pronome que ela explica. Mantém-se a ambiguidade do referente e a repetição retórica de “povos”, sem impor leitura messiânica ou outra identificação doutrinária.
