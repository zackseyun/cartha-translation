  - severity: medium
    issue: “Testemunha dos povos” é relacionalmente ambíguo para לְאֻמִּים.
    rationale: Neste sintagma, לְ indica que ele é dado como testemunha para/aos povos. “Para os povos” evita a possível leitura de posse, origem ou assunto do testemunho.
  - severity: low
    issue: A nota sobre o referente de “o” está ancorada após “povos”, no final do versículo.
    rationale: A nota explica especificamente o pronome masculino; sua âncora deve aparecer junto de “o”. A renumeração das notas torna as âncoras claras e sequenciais.
