base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/004.yaml
  text: Behold[a], I have made him a witness to the peoples[c][b], a leader and commander for the peoples.
translation:
  language: pt
  text: 'Eis: eu o[a] constituí[b] como testemunha para os povos[c], líder e comandante para os povos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O pronome “o” provavelmente se refere a Davi ou a um representante davídico no contexto; alguns entendem aqui uma referência messiânica.
    reason: alternative_reading
  - marker: b
    text: Literalmente, “eu o dei como testemunha”.
    reason: lexical_alternative
  - marker: c
    text: Ou “nações”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Vejam
  rationale: Partícula discursiva que chama a atenção e dá ênfase. “Vejam” comunica essa força profética em português atual sem transformar הֵן em parte do conteúdo proposicional.
- source_word: עֵד
  choice: testemunha
  rationale: O substantivo designa aqui uma pessoa que dá testemunho, não o conceito abstrato de “testemunho”.
- source_word: לְאוּמִּים
  choice: dos povos
  rationale: Expressa a relação da testemunha, do líder e do comandante com coletividades humanas. “Povos” preserva o plural e a dimensão étnica do hebraico; “nações” continua possível.
- source_word: נְתַתִּיו
  choice: eu o constituí
  rationale: Literalmente, “eu o dei”. Com predicativos pessoais, “constituí” expressa com naturalidade a ideia de designação ou estabelecimento, mantendo o pronome masculino sem identificar seu referente.
- source_word: נָגִיד
  choice: líder
  rationale: Termo amplo para alguém colocado à frente de outros. Evita a conotação dinástica mais estreita de “príncipe” e a possível ênfase coercitiva de “governante”.
- source_word: וּמְצַוֵּה
  choice: e comandante
  rationale: O particípio de צוה descreve alguém que dá ordens. “Comandante” é conciso e forma um par natural com “líder”, sem a especificidade indevida de “legislador”.
theological_decisions:
- issue: Referente do sufixo masculino em נְתַתִּיו
  choice: Manter o pronome “o” sem identificar o referente no corpo do versículo.
  alternative: Explicitar Davi, o representante davídico/Messias ou Israel personificado.
  rationale: O contexto imediato menciona as promessas da aliança feitas a Davi, mas o hebraico deste versículo emprega apenas o pronome masculino. A tradução preserva essa abertura interpretativa e registra as principais possibilidades em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Vejam” conserva a chamada enfática do discurso profético; “constituí” torna idiomática a construção predicativa. A repetição de “povos” reproduz o equilíbrio retórico do hebraico.
