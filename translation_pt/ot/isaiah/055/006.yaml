  text: דִּרְשׁ֥וּ יְהוָ֖ה בְּ/הִמָּצְא֑/וֹ קְרָאֻ֖/הוּ בִּֽ/הְיוֹת֥/וֹ קָרֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/055/006.yaml
  text: Seek Yahweh while he may be found[a]; call on him while he is near.
translation:
  language: pt
  text: Busquem a Yahweh enquanto ele pode ser encontrado[a]; invoquem-no enquanto está perto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “enquanto ele se deixa encontrar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּרְשׁוּ
  choice: Busquem
  rationale: O imperativo plural de דרש expressa a exortação a buscar Deus, especialmente em contexto de retorno, oração ou adoração. “Busquem” é direto, natural e preserva a força do chamado.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O tetragrama é vertido como nome próprio, “Yahweh”, em vez de ser substituído por um título.
- source_word: בְּהִמָּצְאוֹ
  choice: enquanto ele pode ser encontrado
  rationale: A preposição בְּ com o infinitivo construto de מצא e sufixo pronominal tem valor temporal. A formulação comunica a oportunidade presente e a urgência, sem eliminar a alternativa mais formal “enquanto ele se deixa encontrar”.
- source_word: קְרָאֻהוּ
  choice: invoquem-no
  rationale: Neste contexto religioso, קרא com objeto pessoal significa chamar por alguém ou invocá-lo. “Invoquem-no” expressa de modo conciso o apelo dirigido a Deus.
- source_word: בִּהְיוֹתוֹ
  choice: enquanto está
  rationale: A construção בְּ mais infinitivo construto de היה é temporal e forma um paralelismo claro com a primeira oração.
- source_word: קָרוֹב
  choice: perto
  rationale: קרוב denota proximidade e disponibilidade. “Perto” conserva tanto a imagem espacial quanto sua ressonância relacional.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido de בְּהִמָּצְאוֹ
  choice: enquanto ele pode ser encontrado
  alternative: enquanto ele se deixa encontrar
  rationale: A tradução principal mantém a urgência temporal e a possibilidade expressa idiomaticamente, sem definir de modo exclusivo se a ênfase recai na disponibilidade divina ou na capacidade humana de encontrá-lo; a nota registra a alternativa legítima.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com imperativos no plural. “Invoquem-no” preserva o tom religioso e poético; o paralelismo temporal das duas orações foi mantido.
