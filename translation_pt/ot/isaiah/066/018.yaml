base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/018.yaml
  text: For I know their works and their thoughts[a]. The time is coming to gather all the nations and tongues[b], and they will come and see my glory.
translation:
  language: pt
  text: Pois eu conheço as obras e os pensamentos deles.[a] Está chegando o tempo de reunir todas as nações e línguas[b]; todos virão e verão a minha glória.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico é abrupto e difícil. Literalmente, algo como: “E eu, as obras deles e os pensamentos deles, vem para reunir todas as nações e línguas”. A forma traduzida por “está chegando” é feminina singular e não tem sujeito expresso. Muitos entendem o sentido como: “Pois eu conheço as obras e os pensamentos deles. Está chegando o tempo de reunir todas as nações e línguas”; outra possibilidade é: “Por causa das obras e dos pensamentos deles, venho reunir todas as nações e línguas”.'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “línguas”; isto é, povos de diferentes línguas.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: Pois eu
  rationale: Mantém o pronome enfático da primeira pessoa; “pois” expressa de modo natural a ligação contextual, sem tornar o versículo excessivamente abrupto.
- source_word: מַעֲשֵׂיהֶם
  choice: as obras deles
  rationale: Preserva o sentido concreto e moral de מַעֲשֶׂה e forma um par natural com “pensamentos”.
- source_word: וּמַחְשְׁבֹתֵיהֶם
  choice: e os pensamentos deles
  rationale: “Pensamentos” é a opção mais ampla para מַחֲשָׁבוֹת, que também pode significar planos ou intenções.
- source_word: בָּאָה
  choice: Está chegando o tempo
  rationale: A forma feminina singular é sintaticamente difícil e não tem sujeito expresso. A formulação portuguesa fornece o sujeito implícito mais comum e conserva a orientação futura do contexto; a dificuldade textual é registrada em nota.
- source_word: לְקַבֵּץ
  choice: de reunir
  rationale: Traduz diretamente a ideia de juntar ou congregar diferentes grupos.
- source_word: כָּל־הַגּוֹיִם
  choice: todas as nações
  rationale: Expressa o alcance internacional de גּוֹיִם sem introduzir o contraste neotestamentário mais específico sugerido por “gentios”.
- source_word: וְהַלְּשֹׁנוֹת
  choice: e línguas
  rationale: Neste contexto, לְשֹׁנוֹת designa línguas e, por extensão, grupos linguísticos. “Línguas” conserva a imagem hebraica e é natural em português.
- source_word: וּבָאוּ וְרָאוּ
  choice: elas virão e verão
  rationale: Os verbos são entendidos como uma sequência profética futura; o pronome feminino retoma naturalmente “nações e línguas” em português.
- source_word: כְּבוֹדִי
  choice: a minha glória
  rationale: “Glória” preserva o peso teológico de כָּבוֹד e sua recorrência em Isaías.
theological_decisions:
- issue: Como representar a abertura hebraica elíptica e sintaticamente difícil
  choice: “Pois eu conheço as obras e os pensamentos deles. Está chegando o tempo...”
  alternative: “E eu — as obras deles e os pensamentos deles — venho reunir...” ou “Por causa das obras e dos pensamentos deles, venho reunir...”
  rationale: O texto massorético não traz explicitamente “conheço” nem “o tempo”, e sua sintaxe é abrupta. A tradução principal oferece uma leitura inteligível e amplamente reconhecida, enquanto a nota torna explícita a dificuldade e preserva as principais possibilidades sem transformar uma delas em certeza textual.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. Evita construções arcaicas e conserva “glória”, “nações” e “línguas” por seu valor bíblico e intertextual. A sintaxe difícil do hebraico é esclarecida na nota, em vez de ser ocultada.
