  text: הַ/מִּתְקַדְּשִׁ֨ים וְ/הַ/מִּֽטַּהֲרִ֜ים אֶל הַ/גַּנּ֗וֹת אַחַ֤ר אחד בַּ/תָּ֔וֶךְ אֹֽכְלֵי֙ בְּשַׂ֣ר הַ/חֲזִ֔יר וְ/הַ/שֶּׁ֖קֶץ וְ/הָ/עַכְבָּ֑ר יַחְדָּ֥ו יָסֻ֖פוּ נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/017.yaml
  text: Those who sanctify themselves and purify themselves to go into the gardens[a], following one in the midst, eating the flesh of pigs and detestable things and mice, shall come to an end together, declares Yahweh.
translation:
  language: pt
  text: “Os que se santificam e se purificam para entrar nos jardins, seguindo alguém no meio[a], os que comem carne de porco, coisas detestáveis e camundongos, todos juntos chegarão ao fim”, declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “seguindo alguém no meio”. A expressão é difícil; pode se referir a seguir um líder ritual, acompanhar alguém até o centro ou avançar um após outro em um rito cultual.'
    reason: Leitura alternativa de uma expressão hebraica obscura.
lexical_decisions:
- source_word: הַמִּתְקַדְּשִׁים
  choice: os que se santificam
  rationale: O particípio hitpael de קדשׁ tem sentido reflexivo. A formulação preserva tanto a preparação ritual feita por eles mesmos quanto a possível ironia do contexto.
- source_word: וְהַמִּטַּהֲרִים
  choice: e se purificam
  rationale: O particípio hitpael de טהר também é reflexivo; “se purificam” é claro, atual e apropriado ao contexto ritual.
- source_word: אֶל הַגַּנּוֹת
  choice: para entrar nos jardins
  rationale: אֶל indica movimento em direção aos jardins. “Entrar” explicita de modo natural em português o movimento implícito, sem identificar indevidamente a prática realizada ali.
- source_word: אַחַר אחד בַּתָּוֶךְ
  choice: seguindo alguém no meio
  rationale: A expressão é textualmente e sintaticamente difícil. “Alguém” mantém o referente indefinido, e “no meio” conserva a formulação espacial sem decidir se se trata de um líder ritual, do centro do grupo ou de uma procissão.
- source_word: אֹכְלֵי
  choice: os que comem
  rationale: O particípio descreve o mesmo grupo. A oração relativa retoma o sujeito com clareza em português depois da expressão cultual obscura.
- source_word: בְּשַׂר הַחֲזִיר
  choice: carne de porco
  rationale: É a expressão corrente e concreta em português para a carne do animal mencionado.
- source_word: הַשֶּׁקֶץ
  choice: coisas detestáveis
  rationale: שׁקץ designa aquilo que é repugnante ou ritualmente detestável. A escolha preserva o sentido sem ampliar necessariamente a referência para toda espécie de “abominação” moral.
- source_word: וְהָעַכְבָּר
  choice: e ratos
  rationale: עכבר normalmente designa camundongo ou rato. “Ratos” é uma designação ampla, natural e facilmente compreensível no contexto alimentar.
- source_word: יַחְדָּו יָסֻפוּ
  choice: todos juntos chegarão ao fim
  rationale: A formulação preserva a ênfase coletiva de יַחְדָּו e o sentido de cessar ou ser levado ao fim em סוף, sem especificar além do texto o modo do juízo.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: נְאֻם é uma fórmula profética solene, e o nome divino explícito יהוה é transliterado como “Yahweh”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino, não um título. “Yahweh” o representa diretamente e evita substituí-lo por “Senhor”.
- issue: Interpretação da expressão cultual obscura אַחַר אחד בַּתָּוֶךְ
  choice: seguindo alguém no meio
  alternative: seguindo alguém até o centro; atrás daquele que está no meio; seguindo uns aos outros
  rationale: A construção hebraica é genuinamente difícil. O texto principal mantém sua indeterminação, e a nota registra possibilidades sem definir dogmaticamente a pessoa, a posição ou a forma do rito.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A cadeia de particípios foi reorganizada com uma retomada (“os que comem”) para evitar ambiguidade sintática, sem alterar a identidade do grupo descrito. A expressão cultual difícil permanece relativamente literal e recebe nota explicativa.
