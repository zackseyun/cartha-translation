  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הַ/שָּׁמַ֣יִם כִּסְאִ֔/י וְ/הָ/אָ֖רֶץ הֲדֹ֣ם רַגְלָ֑/י אֵי זֶ֥ה בַ֨יִת֙ אֲשֶׁ֣ר תִּבְנוּ לִ֔/י וְ/אֵי זֶ֥ה מָק֖וֹם מְנוּחָתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/001.yaml
  text: 'Thus says Yahweh: Heaven is my throne[a], and the earth is my footstool. What kind of house would you build for me[c][b], and what place would be my resting place?'
translation:
  language: pt
  text: 'Assim diz Yahweh:


    “Os céus são meu trono,

    e a terra é estrado para meus pés.

    Que tipo de casa vocês construiriam para mim[a]?

    E qual seria o lugar do meu descanso[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Casa” provavelmente alude ao templo, embora a palavra hebraica signifique literalmente “casa”.
    reason: Preserva no texto principal o termo hebraico sem explicitar uma alusão contextual.
  - marker: b
    text: 'A expressão hebraica também pode ser entendida em sentido locativo: “E onde estaria o lugar do meu descanso?”'
    reason: Registra a possível leitura locativa da expressão interrogativa, preservando a ambiguidade sem tratá-la como inequívoca.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Mantém a fórmula profética de mensageiro de modo solene, claro e corrente em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título, preservando sua função como nome próprio no texto hebraico.
- source_word: הַשָּׁמַיִם
  choice: os céus
  rationale: Reproduz a forma hebraica morfologicamente plural e designa o domínio celeste em contraste cósmico com a terra.
- source_word: כִּסְאִי
  choice: o meu trono
  rationale: Tradução direta da metáfora régia.
- source_word: וְהָאָרֶץ
  choice: e a terra
  rationale: Preserva o contraste coordenado entre os céus e a terra.
- source_word: הֲדֹם רַגְלָי
  choice: o apoio para os meus pés
  rationale: Expressa com naturalidade a imagem de um estrado sob os pés, sem obscurecê-la com vocabulário pouco corrente.
- source_word: אֵי זֶה
  choice: que / qual seria
  rationale: No contexto, as perguntas são retóricas e põem em dúvida a adequação de qualquer casa ou lugar oferecido a Deus. A nota preserva a possibilidade de uma formulação mais literalmente locativa.
- source_word: בַיִת
  choice: casa
  rationale: Mantém o termo hebraico sem explicitar 'templo' no texto principal, embora essa alusão esteja presente no contexto.
- source_word: אֲשֶׁר תִּבְנוּ לִי
  choice: vocês poderiam construir para mim
  rationale: O modal 'poderiam' comunica em português a força do desafio retórico expresso pela forma verbal hebraica no contexto.
- source_word: מָקוֹם מְנוּחָתִי
  choice: o lugar do meu descanso
  rationale: Preserva tanto o substantivo 'lugar' como a ideia de repouso, mantendo o paralelismo com 'casa'.
theological_decisions:
- issue: Se בַיִת deve ser explicitado como 'templo'
  choice: casa
  alternative: templo
  rationale: O templo está provavelmente em vista, mas o hebraico diz literalmente 'casa'. A opção adotada preserva o alcance da crítica à tentativa humana de abrigar ou conter Deus sem inserir no texto uma especificação apenas implícita.
- issue: Força das perguntas sobre a casa e o lugar de descanso
  choice: Perguntas retóricas que ressaltam a insuficiência de qualquer construção humana
  alternative: Perguntas meramente informativas sobre a identidade ou localização de uma casa
  rationale: A declaração de que os céus são o trono de Yahweh e a terra o apoio de seus pés torna a leitura retórica contextualmente mais provável, sem negar a forma interrogativa do hebraico.
translation_notes:
  register: Português moderno, digno e acessível, com construção natural tanto no Brasil como em outros contextos lusófonos. O plural “os céus” conserva a forma hebraica; “apoio para os meus pés” evita um termo menos comum como “escabelo”. O pronome “vocês” torna explícito o sujeito plural do verbo hebraico.
