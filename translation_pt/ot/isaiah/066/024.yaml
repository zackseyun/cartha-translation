  text: וְ/יָצְא֣וּ וְ/רָא֔וּ בְּ/פִגְרֵי֙ הָ/אֲנָשִׁ֔ים הַ/פֹּשְׁעִ֖ים בִּ֑/י כִּ֣י תוֹלַעְתָּ֞/ם לֹ֣א תָמ֗וּת וְ/אִשָּׁ/ם֙ לֹ֣א תִכְבֶּ֔ה וְ/הָי֥וּ דֵרָא֖וֹן לְ/כָל בָּשָֽׂר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/024.yaml
  text: And they will go out and look on the corpses of the men who rebelled against me[a]. For their worm will not die, and their fire will not be quenched[c][b], and they will be an abhorrence to all flesh.
translation:
  language: pt
  text: Eles sairão e olharão para os cadáveres dos homens que se rebelaram contra mim, pois o verme deles[a] não morrerá, e o fogo deles não se apagará; eles serão objeto de repulsa[b] para toda a humanidade[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a larva deles”; o termo hebraico pode designar verme ou larva.
    reason: lexical_alternative
  - marker: b
    text: Ou “motivo de horror” ou “algo repugnante”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “toda carne”, expressão hebraica que significa todas as pessoas ou toda a humanidade.
    reason: cultural_note
lexical_decisions:
- source_word: וְיָצְאוּ
  choice: Eles sairão
  rationale: O qal consecutivo de יצא dá continuidade à perspectiva futura do contexto. “Sairão” expressa o movimento de modo natural e direto.
- source_word: וְרָאוּ
  choice: e contemplarão
  rationale: 'ראה seguido de בְּ aqui indica mais do que percepção casual: trata-se de olhar para algo. “Contemplarão” preserva esse olhar deliberado sem acrescentar uma interpretação emocional.'
- source_word: בְּפִגְרֵי
  choice: os cadáveres de
  rationale: פגר designa cadáver ou corpo morto. “Cadáveres” é claro, digno e mantém a força sombria da imagem.
- source_word: הָאֲנָשִׁים
  choice: os homens
  rationale: אֲנָשִׁים é o plural masculino de אישׁ e, neste contexto, refere-se a um grupo concreto, não a uma abstração genérica.
- source_word: הַפֹּשְׁעִים בִּי
  choice: que se rebelaram contra mim
  rationale: פשׁע exprime transgressão como rebelião ou desafio, e בִּי identifica aquele contra quem a rebelião foi dirigida.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação da cena anterior e mantém de forma concisa a ligação lógica do hebraico.
- source_word: תוֹלַעְתָּם
  choice: o verme deles
  rationale: תּוֹלַעַת pode designar verme, larva ou bicho que consome matéria em decomposição. “Verme” é lexicalmente válido e preserva a formulação tradicional e sua relevância intertextual.
- source_word: לֹא תָמוּת
  choice: não morrerá
  rationale: O imperfeito feminino singular concorda com “verme”; o futuro se ajusta à sequência profética do contexto.
- source_word: וְאִשָּׁם
  choice: e o fogo deles
  rationale: אֵשׁ com sufixo de terceira pessoa masculina plural indica o fogo associado a eles, sem necessariamente sugerir posse.
- source_word: לֹא תִכְבֶּה
  choice: não se apagará
  rationale: כבה, aplicado ao fogo, significa apagar-se ou ser extinto. A forma pronominal é idiomática e natural em português.
- source_word: וְהָיוּ דֵרָאוֹן
  choice: eles serão objeto de repulsa
  rationale: דֵרָאוֹן é um substantivo raro que denota repulsa, horror ou algo detestável. “Objeto de repulsa” mantém o valor nominal e comunica claramente o resultado.
- source_word: לְכָל בָּשָׂר
  choice: para toda a humanidade
  rationale: A expressão hebraica literal “toda carne” funciona aqui como designação coletiva de todos os seres humanos. A tradução comunica o sentido corrente, enquanto a nota preserva a forma da expressão.
theological_decisions:
- issue: Natureza das imagens de julgamento
  choice: Manter a descrição concreta dos cadáveres, do verme que não morre e do fogo que não se apaga, sem definir além do versículo a natureza completa do castigo final.
  alternative: Tratar a linguagem como puramente metafórica ou fazê-la definir diretamente os mecanismos do castigo eterno consciente.
  rationale: O hebraico apresenta imagens concretas do resultado visível do julgamento, mas este versículo, isoladamente, não sistematiza toda uma doutrina do castigo final. A tradução preserva a tensão sem reduzir nem ampliar a afirmação.
- issue: Gênero de הָאֲנָשִׁים
  choice: os homens
  alternative: as pessoas; os seres humanos
  rationale: O texto usa um substantivo masculino plural para um grupo concreto de rebeldes. A tradução mantém essa especificidade sem neutralização desnecessária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva a força profética e sombria do original, emprega futuro verbal coerente e evita tanto arcaísmos desnecessários quanto explicitação doutrinária além do hebraico.
