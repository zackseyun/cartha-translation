source:
  edition: WLC
  text: כִּֽי הִנֵּ֤ה יְהוָה֙ בָּ/אֵ֣שׁ יָב֔וֹא וְ/כַ/סּוּפָ֖ה מַרְכְּבֹתָ֑י/ו לְ/הָשִׁ֤יב בְּ/חֵמָה֙ אַפּ֔/וֹ וְ/גַעֲרָת֖/וֹ בְּ/לַהֲבֵי אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/015.yaml
  text: For look[a], Yahweh will come in fire, and his chariots like the whirlwind[c][b], to repay his anger in fury and his rebuke with flames of fire.
translation:
  language: pt
  text: 'Pois vejam: Yahweh virá em fogo[a], e os seus carros virão como o vendaval[b], para fazer recair com furor a sua ira[c] e a sua repreensão com chamas de fogo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com fogo”; a preposição hebraica pode indicar tanto esfera quanto acompanhamento ou meio.
    reason: lexical_alternative
  - marker: b
    text: Ou “como o turbilhão” ou “como a tempestade”.
    reason: lexical_alternative
  - marker: c
    text: Ou “para retribuir com furor a sua ira”; o verbo hebraico pode significar “fazer voltar”, “devolver” ou, em contexto judicial, “retribuir”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: 'Pois vejam:'
  rationale: כִּי liga o anúncio ao contexto anterior, enquanto הִנֵּה chama vividamente a atenção. A formulação é atual e clara, sem recorrer ao mais solene e tradicional “eis que”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בָּאֵשׁ
  choice: em fogo
  rationale: Mantém de perto a preposição hebraica e deixa em aberto se o fogo descreve esfera, manifestação ou acompanhamento.
- source_word: וְכַסּוּפָה מַרְכְּבֹתָיו
  choice: e os seus carros, como o vendaval
  rationale: סוּפָה designa uma tempestade violenta ou um turbilhão; “vendaval” comunica de modo natural a velocidade e a força da imagem, sem acrescentar ao texto a ideia explícita de guerra.
- source_word: לְהָשִׁיב בְּחֵמָה אַפּוֹ
  choice: para fazer recair com furor a sua ira
  rationale: O hifil de שׁוב pode expressar fazer voltar, devolver ou retribuir. “Fazer recair” oferece em português uma formulação natural para a execução judicial da ira, sem apagar a imagem verbal de retorno.
- source_word: וְגַעֲרָתוֹ בְּלַהֲבֵי אֵשׁ
  choice: e a sua repreensão com chamas de fogo
  rationale: “Repreensão” preserva a força verbal e judicial de גְּעָרָה; “com chamas de fogo” mantém a imagem concreta e o valor instrumental ou acompanhante da preposição.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O hebraico traz diretamente o nome da aliança. Mantê-lo como “Yahweh” distingue o nome próprio do título אֲדֹנָי e evita substituí-lo silenciosamente por “Senhor”.
- issue: Sentido judicial de לְהָשִׁיב aplicado à ira divina
  choice: fazer recair com furor a sua ira
  alternative: retribuir com furor a sua ira; fazer voltar a sua ira em furor
  rationale: A tradução conserva a linguagem de juízo e a ideia de fazer retornar ou recair, mas evita decidir além do necessário exatamente como a retribuição se relaciona com a ira.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Pois vejam” reproduz a chamada de atenção de הִנֵּה sem o tom arcaizante de “eis”. A ordem poética e o paralelismo entre ira/repreensão e furor/chamas foram preservados.
