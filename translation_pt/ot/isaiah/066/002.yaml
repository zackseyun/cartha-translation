  terminology: “Yahweh” corresponde de maneira consistente ao Tetragrama conforme a decisão editorial fornecida. Os termos “pobre”, “abatido de espírito” e “palavra” são apropriados, compreensíveis e não introduzem leitura doutrinária indevida. A nota oferece uma alternativa lexical legítima para o par hebraico.
