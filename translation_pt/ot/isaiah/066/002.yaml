  source_fidelity: 'A tradução acompanha de perto o hebraico: preserva a imagem antropomórfica em “Minha mão fez”, o plural enfático de “todas estas coisas”, o sentido resultativo de “vieram a existir”, a fórmula profética com o nome divino Yahweh e o contraste introduzido por “Mas”. “Pobre e abatido de espírito” comunica adequadamente עָנִי וּנְכֵה רוּחַ sem reduzir indevidamente a primeira expressão a uma qualidade exclusivamente interior. “Que treme diante da minha palavra” transmite de modo natural o temor reverente de חָרֵד עַל־דְּבָרִי.'
