id: ISA.66.2
reference: Isaiah 66:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אֶת כָּל אֵ֨לֶּה֙ יָדִ֣/י עָשָׂ֔תָה וַ/יִּהְי֥וּ כָל אֵ֖לֶּה נְאֻם יְהוָ֑ה וְ/אֶל זֶ֣ה אַבִּ֔יט אֶל עָנִי֙ וּ/נְכֵה ר֔וּחַ וְ/חָרֵ֖ד עַל דְּבָרִֽ/י־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/002.yaml
  text: 'My hand made all these things[a], and so all these things came to be, declares Yahweh. But to this one I will look: to the poor and contrite in spirit, and the one who trembles at my word.'
translation:
  language: pt
  text: 'Minha mão fez todas estas coisas, e assim todas elas vieram a existir — declara Yahweh. Mas é para este que olharei: para o pobre e abatido de espírito[a], que treme diante da minha palavra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o aflito e de espírito quebrantado”.'
    reason: Alternativa lexical que preserva outras nuances possíveis de עָנִי וּנְכֵה רוּחַ.
lexical_decisions:
- source_word: יָדִי עָשָׂתָה
  choice: Minha mão fez
  rationale: Preserva a expressão antropomórfica hebraica e apresenta a ação criadora como realizada.
- source_word: כָּל אֵלֶּה
  choice: todas estas coisas / todas elas
  rationale: O plural retoma os céus e a terra do versículo anterior; “coisas” explicita o referente, e “elas” evita repetição pesada na oração seguinte.
- source_word: וַיִּהְיוּ
  choice: vieram a existir
  rationale: Expressa a existência resultante da ação criadora de Yahweh, em vez do sentido mais estático de “existiram”.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Mantém a solenidade da fórmula profética e translitera diretamente o nome divino.
- source_word: וְאֶל זֶה אַבִּיט
  choice: Mas é para este que olharei
  rationale: Preserva a imagem hebraica de olhar para alguém e torna perceptível o contraste com a grandeza universal do Criador.
- source_word: עָנִי
  choice: pobre
  rationale: Conserva o núcleo lexical, que pode incluir pobreza, aflição e humildade, sem reduzir a expressão a apenas uma dessas nuances.
- source_word: נְכֵה רוּחַ
  choice: abatido de espírito
  rationale: Comunica um espírito ferido ou quebrantado em português atual e digno, mantendo em nota a alternativa mais literal.
- source_word: חָרֵד עַל דְּבָרִי
  choice: que treme diante da minha palavra
  rationale: Expressa temor reverente em resposta à palavra divina e mantém o singular do hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico traz o Tetragrama; “Yahweh” preserva o nome próprio da aliança sem substituí-lo por um título.
- issue: Natureza do olhar divino em וְאֶל זֶה אַבִּיט
  choice: olharei
  alternative: darei atenção
  rationale: A tradução conserva a metáfora e não explicita além do texto se o olhar indica favor, atenção ou consideração.
- issue: Sentido de עָנִי וּנְכֵה רוּחַ
  choice: pobre e abatido de espírito
  alternative: aflito e de espírito quebrantado
  rationale: O hebraico admite dimensões materiais, sociais e interiores; a redação principal e a nota preservam essa amplitude sem transformar “pobre” simplesmente em “humilde”.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A formulação conserva o paralelismo e as imagens do hebraico, evitando arcaísmos desnecessários.
