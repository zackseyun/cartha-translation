source:
  edition: WLC
  text: שׁוֹחֵ֨ט הַ/שּׁ֜וֹר מַכֵּה אִ֗ישׁ זוֹבֵ֤חַ הַ/שֶּׂה֙ עֹ֣רֵֽף כֶּ֔לֶב מַעֲלֵ֤ה מִנְחָה֙ דַּם חֲזִ֔יר מַזְכִּ֥יר לְבֹנָ֖ה מְבָ֣רֵֽךְ אָ֑וֶן גַּם הֵ֗מָּה בָּֽחֲרוּ֙ בְּ/דַרְכֵי/הֶ֔ם וּ/בְ/שִׁקּוּצֵי/הֶ֖ם נַפְשָׁ֥/ם חָפֵֽצָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/003.yaml
  text: The one who slaughters an ox is like one who strikes down a man[a]; the one who sacrifices a lamb, like one who breaks a dog’s neck; the one who offers a grain offering, like one who offers pig’s blood; the one who makes a memorial offering of frankincense, like one who blesses wickedness. They too have chosen their own ways[b], and their soul delights in their abominations.
translation:
  language: pt
  text: Aquele que abate um boi é como quem fere um homem; aquele que sacrifica um cordeiro, como quem quebra o pescoço de um cão; aquele que apresenta uma oferta de cereal, como quem oferece sangue de porco; aquele que apresenta uma oferta memorial de incenso, como quem bendiz a maldade[a]. Eles também escolheram seus próprios caminhos, e a alma deles tem prazer nas suas abominações[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bendiz um ídolo”. A palavra hebraica pode indicar maldade, iniquidade ou perversidade idólatra.
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente “a alma deles tem prazer”, usando o substantivo e o verbo no singular com sentido coletivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹחֵט הַשּׁוֹר
  choice: aquele que abate um boi
  rationale: A construção com “aquele que” preserva a força genérica do particípio hebraico. “Abate” é natural no contexto sacrificial, e “boi” evita especificar além do necessário.
- source_word: מַכֵּה אִישׁ
  choice: é como quem fere mortalmente um homem
  rationale: A comparação, implícita na sequência hebraica, é explicitada para clareza em português. “Fere mortalmente” conserva tanto a ideia de golpe violento quanto a provável consequência letal, sem reduzir o verbo simplesmente a “mata”.
- source_word: זוֹבֵחַ הַשֶּׂה
  choice: aquele que sacrifica um cordeiro
  rationale: שֶׂה designa um animal menor do rebanho e, no contexto sacrificial, “cordeiro” é uma equivalência clara e idiomática.
- source_word: עֹרֵף כֶּלֶב
  choice: como quem quebra o pescoço de um cão
  rationale: O verbo descreve a quebra ritual do pescoço, não necessariamente decapitação; a formulação mantém a imagem violenta e concreta.
- source_word: מַעֲלֵה מִנְחָה
  choice: aquele que apresenta uma oferta de cereal
  rationale: No uso cultual, מִנְחָה é uma oferta feita de cereal. “Apresenta” exprime naturalmente o ato sacrificial sem confundi-lo com uma simples dádiva.
- source_word: דַּם חֲזִיר
  choice: como quem oferece sangue de porco
  rationale: A formulação explicita a comparação elíptica e mantém o caráter impuro e chocante da imagem.
- source_word: מַזְכִּיר לְבֹנָה
  choice: aquele que apresenta uma oferta memorial de incenso
  rationale: O Hifil de זכר possui sentido cultual de fazer lembrar ou apresentar a porção memorial. “Oferta memorial de incenso” conserva essa nuance sem sugerir apenas o ato genérico de queimar incenso.
- source_word: מְבָרֵךְ אָוֶן
  choice: como quem bendiz a maldade
  rationale: אָוֶן pode indicar maldade, iniquidade ou perversidade associada à idolatria. “Maldade” conserva a amplitude moral do termo; a alternativa idólatra é registrada em nota.
- source_word: גַּם הֵמָּה בָּחֲרוּ בְּדַרְכֵיהֶם
  choice: Eles também escolheram seus próprios caminhos
  rationale: “Também” preserva a ênfase de גַּם הֵמָּה, enquanto “seus próprios caminhos” comunica a orientação deliberadamente autônoma sugerida pelo contexto.
- source_word: וּבְשִׁקּוּצֵיהֶם נַפְשָׁם חָפֵצָה
  choice: e a alma deles tem prazer nas suas abominações
  rationale: A formulação mantém a construção coletiva singular do hebraico e o registro profético de שִׁקּוּצִים, explicando em nota seu emprego coletivo.
theological_decisions:
- issue: Natureza das comparações entre sacrifícios e atos abomináveis
  choice: Explicitar “é como” na primeira oração e deixá-lo subentendido nas paralelas seguintes.
  alternative: Traduzir as expressões como equações diretas, sem elemento comparativo.
  rationale: O hebraico justapõe particípios e complementos sem partícula comparativa expressa. A estrutura comunica equivalência retórica chocante; “é como” torna a relação inteligível em português sem explicar por que ou em que sentido Deus rejeita tais atos.
- issue: Sentido de אָוֶן
  choice: maldade
  alternative: ídolo; iniquidade; perversidade
  rationale: O termo pode assumir conotação idólatra, mas não exige aqui um objeto idolátrico específico. “Maldade” preserva a condenação moral e a ambiguidade referencial, enquanto a leitura “ídolo” é apresentada em nota.
- issue: Construção coletiva com נַפְשָׁם
  choice: Manter “a alma deles” no singular coletivo.
  alternative: Traduzir idiomaticamente como “eles têm prazer”.
  rationale: A forma mais próxima conserva a imagem hebraica da pessoa interior coletiva sem impor uma interpretação antropológica específica; a nota esclarece a concordância coletiva.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. Mantém-se a cadência profética por meio de orações paralelas separadas por ponto e vírgula. Termos cultuais como “oferta de cereal” e “oferta memorial” são preservados por sua precisão, e as imagens deliberadamente violentas não são suavizadas.
