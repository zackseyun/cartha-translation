source:
  edition: WLC
  text: כְּ/אִ֕ישׁ אֲשֶׁ֥ר אִמּ֖/וֹ תְּנַחֲמֶ֑/נּוּ כֵּ֤ן אָֽנֹכִי֙ אֲנַ֣חֶמְ/כֶ֔ם וּ/בִ/ירֽוּשָׁלִַ֖ם תְּנֻחָֽמוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/013.yaml
  text: As one whom his mother comforts[a], so I will comfort you; and in Jerusalem you will be comforted.
translation:
  language: pt
  text: Como um homem a quem sua mãe consola, assim eu consolarei vocês; e em Jerusalém vocês serão consolados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּאִישׁ
  choice: Como um homem
  rationale: אִישׁ é masculino singular e introduz a comparação; a tradução mantém essa forma representativa explícita do hebraico.
- source_word: אִמּוֹ
  choice: sua mãe
  rationale: O substantivo com sufixo de terceira pessoa masculina singular expressa posse e preserva a imagem familiar e pessoal.
- source_word: תְּנַחֲמֶנּוּ
  choice: consola
  rationale: O piel de נחם indica o ato de consolar; esta escolha permite repetir o mesmo campo lexical nas três ocorrências do versículo.
- source_word: כֵּן אָנֹכִי אֲנַחֶמְכֶם
  choice: assim eu consolarei vocês
  rationale: כֵּן introduz a correspondência da comparação; אָנֹכִי identifica enfaticamente o próprio Deus como agente, e o plural de segunda pessoa é expresso por “vocês”.
- source_word: וּבִירוּשָׁלִַם
  choice: e em Jerusalém
  rationale: A preposição ב marca o local em que o consolo será experimentado.
- source_word: תְּנֻחָמוּ
  choice: vocês serão consolados
  rationale: A forma pual preserva a voz passiva e repete em português a raiz verbal usada nas duas orações anteriores.
theological_decisions:
- issue: Linguagem masculina representativa na comparação
  choice: Manter “um homem” no texto principal
  alternative: “alguém” ou “uma pessoa”
  rationale: O hebraico emprega explicitamente אִישׁ, “homem”, no singular masculino. A formulação portuguesa é natural e conserva a forma da imagem sem limitar a promessa de consolo aos homens.
- issue: Agente e âmbito do consolo final
  choice: Preservar a construção passiva “serão consolados” e a localização “em Jerusalém”
  alternative: “encontrarão consolo em Jerusalém”
  rationale: A alternativa explicitaria uma experiência, mas apagaria a voz passiva de תְּנֻחָמוּ e enfraqueceria a repetição de נחם. O texto não identifica separadamente o agente da última forma passiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Consolar” foi preferido a “confortar” por soar mais natural neste contexto afetivo e por permitir preservar com clareza a repetição tripla do hebraico. O plural “vocês” representa o destinatário coletivo.
