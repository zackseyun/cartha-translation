base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/014.yaml
  text: You will see[a], and your heart will rejoice; your bones will flourish like the grass. The hand of Yahweh will be made known to his servants, and he will be indignant against his enemies.
translation:
  language: pt
  text: Vocês verão, e o coração de vocês se alegrará; seus ossos florescerão como a relva. A mão de Yahweh se tornará conhecida a seus servos, e ele se indignará contra seus inimigos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: Vocês verão
  rationale: O perfeito qal com a conjunção prefixada, neste discurso profético, expressa naturalmente um acontecimento futuro. O pronome plural explícito torna o destinatário claro em português.
- source_word: וְשָׂשׂ לִבְּכֶם
  choice: o coração de vocês se alegrará
  rationale: Conserva a imagem hebraica do coração como centro da alegria e reproduz o sujeito coletivo singular sem recorrer a uma paráfrase.
- source_word: וְעַצְמוֹתֵיכֶם
  choice: seus ossos
  rationale: Mantém a imagem concreta de renovação profunda e corporal presente no hebraico.
- source_word: כַּדֶּשֶׁא תִפְרַחְנָה
  choice: florescerão como a relva
  rationale: דֶּשֶׁא designa vegetação tenra ou relva, e פרח comunica brotar ou florescer. A formulação preserva a comparação e o vigor poético.
- source_word: וְנוֹדְעָה יַד יְהוָה
  choice: A mão de Yahweh se tornará conhecida
  rationale: Preserva tanto o valor passivo-resultativo do nifal de ידע quanto a imagem bíblica da mão como atuação e poder. O nome divino é transliterado como Yahweh.
- source_word: אֶת עֲבָדָיו
  choice: a seus servos
  rationale: Expressa a direção da manifestação sem definir além do texto se ela ocorre diante deles, entre eles ou em favor deles. “Servos” é natural neste contexto de relação com Deus.
- source_word: וְזָעַם
  choice: e ele se indignará
  rationale: O verbo comunica indignação ou ira. “Se indignará” mantém essa força sem acrescentar uma ação punitiva específica não declarada no texto.
- source_word: אֶת אֹיְבָיו
  choice: contra seus inimigos
  rationale: “Contra” expressa naturalmente em português os inimigos como alvo da indignação divina.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio da designação da aliança.
- issue: Relação da mão de Yahweh com seus servos
  choice: se tornará conhecida a seus servos
  alternative: se manifestará em favor dos seus servos
  rationale: A alternativa explicita uma atuação favorável, provável no contraste contextual, mas a redação escolhida conserva a formulação menos determinada do hebraico.
- issue: Força da conjunção antes da indignação contra os inimigos
  choice: e
  alternative: mas
  rationale: A conjunção hebraica é aditiva. Embora o contexto estabeleça contraste entre servos e inimigos, “e” evita inserir uma força adversativa que não está explicitamente marcada.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. Mantêm-se as imagens concretas “coração”, “ossos”, “relva” e “mão de Yahweh”, evitando paráfrases teológicas desnecessárias.
