source:
  edition: WLC
  text: וְ/שַׂמְתִּ֨י בָ/הֶ֜ם א֗וֹת וְ/שִׁלַּחְתִּ֣י מֵ/הֶ֣ם פְּ֠לֵיטִים אֶֽל הַ/גּוֹיִ֞ם תַּרְשִׁ֨ישׁ פּ֥וּל וְ/ל֛וּד מֹ֥שְׁכֵי קֶ֖שֶׁת תֻּבַ֣ל וְ/יָוָ֑ן הָ/אִיִּ֣ים הָ/רְחֹקִ֗ים אֲשֶׁ֨ר לֹא שָׁמְע֤וּ אֶת שִׁמְעִ/י֙ וְ/לֹא רָא֣וּ אֶת כְּבוֹדִ֔/י וְ/הִגִּ֥ידוּ אֶת כְּבוֹדִ֖/י בַּ/גּוֹיִֽם׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/019.yaml
  text: And I will set a sign among them[a], and from them I will send survivors to the nations—to Tarshish, Pul, and Lud, who draw the bow; to Tubal and Javan[d][c][b]; to the distant coastlands that have not heard my report and have not seen my glory—and they will declare my glory among the nations.
translation:
  language: pt
  text: 'Colocarei entre eles um sinal[a] e, dentre eles, enviarei sobreviventes às nações: a Társis, Pul e Lude, os que retesam o arco[b]; a Tubal e Javã; e às terras costeiras distantes[c], que não ouviram a notícia a meu respeito[d] nem viram a minha glória. Eles anunciarão a minha glória entre as nações.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “neles” ou “sobre eles”; a preposição hebraica admite mais de uma nuance.
    reason: lexical_alternative
  - marker: b
    text: A expressão “os que retesam o arco” pode descrever especificamente Lude; também pode ser traduzida de modo mais geral por “arqueiros”.
    reason: lexical_alternative
  - marker: c
    text: Ou “ilhas distantes”; o termo hebraico pode indicar ilhas ou regiões costeiras, especialmente terras marítimas longínquas.
    reason: lexical_alternative
  - marker: d
    text: Ou “não ouviram falar da minha fama” ou “do meu renome”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Colocarei
  rationale: שׂים significa colocar, pôr ou estabelecer. “Colocarei” expressa com naturalidade a ação divina deliberada sem definir a natureza do sinal.
- source_word: בָהֶם
  choice: entre eles
  rationale: A preposição ב pode significar “em”, “sobre” ou “entre”. No referente coletivo, “entre eles” é natural e evita afirmar que o sinal estaria dentro ou sobre cada pessoa.
- source_word: אוֹת
  choice: um sinal
  rationale: אוֹת pode designar sinal, marca ou indício. “Sinal” mantém a amplitude do termo e não especifica sua forma.
- source_word: מֵהֶם פְּלֵיטִים
  choice: dentre eles ... sobreviventes
  rationale: מֵהֶם indica procedência do grupo já mencionado, e פְּלֵיטִים são pessoas que escaparam ou sobreviveram. “Dentre eles” e “sobreviventes” comunicam isso claramente.
- source_word: אֶל הַגּוֹיִם
  choice: às nações
  rationale: גּוֹיִם designa aqui povos ou nações estrangeiras; “nações” preserva o sentido geográfico e coletivo sem introduzir uma distinção teológica adicional.
- source_word: תַּרְשִׁישׁ פּוּל וְלוּד ... תֻּבַל וְיָוָן
  choice: Társis, Pul e Lude ... Tubal e Javã
  rationale: Os nomes são transliterados em formas reconhecíveis e tradicionais em português, sem tentar identificar ou modernizar os lugares e povos.
- source_word: מֹשְׁכֵי קֶשֶׁת
  choice: os que retesam o arco
  rationale: A expressão significa literalmente os que puxam ou retesam o arco. A formulação conserva a imagem hebraica e pode ser entendida como descrição de Lude.
- source_word: הָאִיִּים הָרְחֹקִים
  choice: as terras costeiras distantes
  rationale: אִיִּים pode referir-se a ilhas ou regiões costeiras, sobretudo marítimas. “Terras costeiras” mantém o alcance amplo do hebraico.
- source_word: אֲשֶׁר לֹא שָׁמְעוּ אֶת שִׁמְעִי
  choice: que não ouviram a notícia a meu respeito
  rationale: שֵׁמַע pode indicar aquilo que se ouve acerca de alguém — notícia, fama ou renome. A tradução principal conserva a ideia de um relato ouvido sem reduzi-la apenas à reputação.
- source_word: וְלֹא רָאוּ אֶת כְּבוֹדִי
  choice: nem viram a minha glória
  rationale: כָּבוֹד, em referência a Deus, é adequadamente vertido por “glória”; a coordenação com “nem” é natural em português após a negação anterior.
- source_word: וְהִגִּידוּ אֶת כְּבוֹדִי בַּגּוֹיִם
  choice: Eles anunciarão a minha glória entre as nações
  rationale: נגד no hifil significa declarar ou anunciar. A frase mantém “minha glória” como objeto e “entre as nações” como esfera da proclamação.
theological_decisions:
- issue: Natureza do sinal colocado entre eles
  choice: Manter a expressão genérica “um sinal” e a localização “entre eles”.
  alternative: “uma marca sobre eles” ou “um estandarte entre eles”
  rationale: O hebraico não define se o sinal é marca pessoal, ato miraculoso, estandarte ou outro tipo de manifestação. Especificá-lo resolveria indevidamente uma ambiguidade real.
- issue: Referente de “eles” e “dentre eles”
  choice: Preservar os pronomes sem identificar explicitamente o grupo.
  alternative: Explicitar “israelitas”, “adoradores” ou outro grupo sugerido pelo contexto.
  rationale: O versículo emprega formas pronominais e não repete o referente. A tradução não deve restringi-lo além do texto.
- issue: Relação de “os que retesam o arco” com a lista
  choice: Apresentar a expressão imediatamente após Lude, permitindo que descreva esse nome em particular.
  alternative: Entender a expressão de modo geral como “arqueiros” ou aplicá-la a mais de um povo.
  rationale: A posição no hebraico favorece sua associação com Lude, mas a nota registra que a função exata da expressão pode ser entendida de forma mais ampla.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas reconhecíveis no Brasil e compreensão internacional. A pontuação organiza a longa enumeração sem alterar suas relações. Evitaram-se arcaísmos e explicitações interpretativas; as ambiguidades lexicais relevantes foram mantidas no texto ou registradas em notas.
