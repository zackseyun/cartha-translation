  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַ/אֲנִ֥י אַשְׁבִּ֛יר וְ/לֹ֥א אוֹלִ֖יד יֹאמַ֣ר יְהוָ֑ה אִם אֲנִ֧י הַ/מּוֹלִ֛יד וְ/עָצַ֖רְתִּי אָמַ֥ר אֱלֹהָֽיִ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/009.yaml
  text: Shall I bring to the point of birth and not cause to give birth? says Yahweh[a]. Shall I, who cause to give birth[c][b], shut the womb? says your God.
translation:
  language: pt
  text: “Acaso eu levaria até o momento do parto e não faria nascer?”, diz Yahweh.[a] “Acaso eu, que faço nascer, fecharia o ventre?”, diz o seu Deus.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser entendido como “levaria ao ponto crítico”; o hebraico emprega a imagem do parto para indicar a chegada do momento do nascimento.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “reteria” ou “fecharia”. “O ventre” está implícito na imagem do parto.
    reason: lexical_alternative
  - marker: c
    text: Em “seu Deus”, o hebraico usa a forma feminina singular de “seu”, dirigindo-se a Sião/Jerusalém como mulher no contexto.
    reason: cultural_note
lexical_decisions:
- source_word: אַשְׁבִּיר
  choice: levaria até o momento do parto
  rationale: O hifil de שׁבר, neste contexto, pertence à imagem do parto e indica levar a gestação ao momento crítico do nascimento, não simplesmente “quebrar”. A formulação preserva a metáfora e é clara em português atual.
- source_word: אוֹלִיד
  choice: faria nascer
  rationale: O hifil de ילד tem força causativa. “Faria nascer” conserva essa força de modo mais natural em português do que uma formulação rígida como “faria dar à luz”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אִם
  choice: Acaso
  rationale: No paralelismo, אִם introduz a segunda pergunta retórica. Repetir “Acaso” transmite diretamente a estrutura interrogativa sem impor uma relação alternativa mais forte do que o hebraico exige.
- source_word: הַמּוֹלִיד
  choice: eu, que faço nascer
  rationale: O artigo com o particípio identifica Deus como aquele que causa o nascimento; a oração relativa reproduz essa função com naturalidade.
- source_word: וְעָצַרְתִּי
  choice: fecharia o ventre
  rationale: עצר significa deter, reter ou fechar. “O ventre” explicita o objeto subentendido pela imagem do parto, evitando uma frase obscura em português.
- source_word: אֱלֹהָיִךְ
  choice: o seu Deus
  rationale: Mantém o tratamento direto e a relação expressa pelo sufixo de segunda pessoa do feminino singular; a nota esclarece o gênero, que “seu” não marca em português.
theological_decisions:
- issue: Preservação da metáfora do parto
  choice: Manter a imagem de Deus levando a gestação ao momento do parto e fazendo nascer.
  alternative: Parafrasear como “começaria eu algo sem levá-lo até o fim?”
  rationale: A metáfora é central à promessa dirigida a Sião e deve permanecer visível, sem ser reduzida a uma afirmação abstrata sobre completar o que foi iniciado.
- issue: Explicitação do objeto de וְעָצַרְתִּי
  choice: Traduzir como “fecharia o ventre”.
  alternative: Traduzir apenas como “reteria” ou “impediria”.
  rationale: O objeto não está expresso no hebraico, mas é controlado pelo contexto imediato do parto. Explicitá-lo torna a pergunta compreensível sem acrescentar uma conclusão doutrinária.
- issue: Relação entre as duas perguntas retóricas
  choice: Introduzir ambas com “Acaso”, sem acrescentar “ou”.
  alternative: Começar a segunda com “Ou acaso”.
  rationale: O hebraico permite entender אִם como introdutor da pergunta paralela. A repetição preserva o paralelismo e evita decidir além do necessário se a relação é estritamente alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. As perguntas retóricas e a metáfora obstétrica foram mantidas; “Yahweh” preserva o nome divino.
