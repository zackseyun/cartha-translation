source:
  edition: WLC
  text: גַּם אֲנִ֞י אֶבְחַ֣ר בְּ/תַעֲלֻלֵי/הֶ֗ם וּ/מְגֽוּרֹתָ/ם֙ אָבִ֣יא לָ/הֶ֔ם יַ֤עַן קָרָ֨אתִי֙ וְ/אֵ֣ין עוֹנֶ֔ה דִּבַּ֖רְתִּי וְ/לֹ֣א שָׁמֵ֑עוּ וַ/יַּעֲשׂ֤וּ הָ/רַע֙ בְּ/עֵינַ֔/י וּ/בַ/אֲשֶׁ֥ר לֹֽא חָפַ֖צְתִּי בָּחָֽרוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/004.yaml
  text: So I also will choose harsh treatment for them[a], and I will bring their fears upon them, because I called and no one answered, I spoke and they did not listen; they did what was evil in my eyes[b], and chose what I did not delight in.
translation:
  language: pt
  text: Assim, eu também escolherei um tratamento severo para eles[a] e farei vir sobre eles aquilo que temem[b], porque chamei, e ninguém respondeu; falei, e eles não escutaram. Fizeram o que era mau aos meus olhos e escolheram aquilo que não me agradava.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “zombarias”, “ilusões” ou “maus-tratos”. O termo hebraico é difícil e pode indicar um tratamento severo, abusivo ou humilhante como juízo.
    reason: lexical_alternative
  - marker: b
    text: Ou “os seus temores”.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֲנִי
  choice: Assim, eu também
  rationale: 'Expressa a correspondência enfática com a escolha mencionada no fim do versículo: eles escolheram o que Deus não quis, e assim ele também escolhe a retribuição.'
- source_word: אֶבְחַר ... בָּחָרוּ
  choice: escolherei ... escolheram
  rationale: Mantém o mesmo verbo nas duas ocorrências e preserva a ironia deliberada do hebraico.
- source_word: בְּתַעֲלֻלֵיהֶם
  choice: um tratamento severo para eles
  rationale: O termo hebraico é raro e semanticamente difícil, podendo indicar ações caprichosas, abusivas ou humilhantes. No contexto de juízo, esta formulação comunica uma medida punitiva sem definir em excesso sua natureza.
- source_word: וּמְגוּרֹתָם
  choice: aquilo que temem
  rationale: O substantivo pode designar tanto o temor quanto seu objeto. Esta opção é natural em português e combina claramente com 'farei vir sobre eles'.
- source_word: אָבִיא לָהֶם
  choice: farei vir sobre eles
  rationale: Reproduz com naturalidade o sentido adverso da expressão no contexto de juízo.
- source_word: יַעַן
  choice: porque
  rationale: Introduz de modo claro a causa do juízo anunciado.
- source_word: קָרָאתִי וְאֵין עוֹנֶה
  choice: chamei, mas ninguém respondeu
  rationale: A construção com אֵין e particípio indica que não houve quem respondesse; 'mas' torna natural em português a oposição implícita entre o chamado e a ausência de resposta.
- source_word: דִּבַּרְתִּי וְלֹא שָׁמֵעוּ
  choice: falei, mas eles não escutaram
  rationale: Neste contexto profético, שׁמע indica escutar com atenção ou dar ouvidos, não mera percepção auditiva.
- source_word: וַיַּעֲשׂוּ הָרַע בְּעֵינַי
  choice: Fizeram o que era mau aos meus olhos
  rationale: Preserva a fórmula avaliativa e a imagem hebraica dos 'olhos' em linguagem compreensível.
- source_word: וּבַאֲשֶׁר לֹא חָפַצְתִּי בָּחָרוּ
  choice: e escolheram aquilo em que não me agradei
  rationale: חפץ abrange prazer, agrado e desejo. A formulação conserva sua nuance afetivo-volitiva e o contraste com 'escolheram'.
theological_decisions:
- issue: Natureza da resposta divina no juízo
  choice: Deus escolhe judicialmente um tratamento punitivo correspondente às escolhas anteriores do povo.
  alternative: Deus escolhe as próprias ilusões ou ações depravadas deles, entregando-os a elas.
  rationale: O paralelismo com 'farei vir sobre eles aquilo que temem' favorece o sentido de juízo ou retribuição. A nota preserva a dificuldade lexical sem atribuir explicitamente a Deus a escolha do mal moral.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de 'escolherei/escolheram' foi mantida para preservar a estrutura retórica do original; as notas registram as ambiguidades lexicais reais.
