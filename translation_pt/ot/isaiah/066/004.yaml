  terminology: «Tratamento severo» é uma solução prudente para o difícil תַּעֲלֻלֵיהֶם no contexto de juízo. «Aquilo que temem» representa bem a possibilidade de o substantivo indicar o objeto do temor. «Aquilo que não me agradava» comunica, sem excessiva especificação doutrinária, o que Deus não quis/não teve prazer em.
