  text: מִֽי שָׁמַ֣ע כָּ/זֹ֗את מִ֤י רָאָה֙ כָּ/אֵ֔לֶּה הֲ/י֤וּחַל אֶ֨רֶץ֙ בְּ/י֣וֹם אֶחָ֔ד אִם יִוָּ֥לֵֽד גּ֖וֹי פַּ֣עַם אֶחָ֑ת כִּֽי חָ֛לָה גַּם יָלְדָ֥ה צִיּ֖וֹן אֶת בָּנֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/008.yaml
  text: Who has heard such a thing? Who has seen things like these? Can a land be brought forth in one day? Can a nation be born all at once? For Zion was in labor and also gave birth to her children[a].
translation:
  language: pt
  text: Quem já ouviu algo assim? Quem já viu coisas como estas? Pode uma terra ser dada à luz num só dia? Pode uma nação nascer de uma só vez? Pois Sião entrou em trabalho de parto e também deu à luz seus filhos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Filhos” pode referir-se coletivamente à descendência de Sião.
    reason: Esclarece a possível referência coletiva do masculino plural hebraico sem acrescentar “filhas” como se fosse uma alternativa textual explícita.
lexical_decisions:
- source_word: כָּזֹאת
  choice: algo assim
  rationale: Expressa naturalmente em português o demonstrativo singular no contexto de algo extraordinário que se ouve.
- source_word: כָּאֵלֶּה
  choice: coisas como estas
  rationale: Mantém o plural e a força demonstrativa do hebraico, em paralelo com a primeira pergunta.
- source_word: הֲיוּחַל אֶרֶץ
  choice: Pode uma terra ser dada à luz
  rationale: Preserva a forma passiva e a imagem de parto de חול; 'terra' se ajusta ao paralelismo com 'nação' sem restringir o sentido ao planeta.
- source_word: בְּיוֹם אֶחָד
  choice: num só dia
  rationale: Formulação portuguesa natural que ressalta a singularidade e rapidez do acontecimento.
- source_word: אִם יִוָּלֵד גּוֹי
  choice: Pode uma nação nascer
  rationale: O contexto retórico permite traduzir אִם como introdução de pergunta; 'nascer' representa diretamente o passivo de ילד.
- source_word: פַּעַם אֶחָת
  choice: de uma só vez
  rationale: Comunica de modo idiomático a simultaneidade ou ocorrência única da expressão hebraica.
- source_word: כִּי
  choice: Pois
  rationale: Mantém a relação explicativa entre as perguntas retóricas e o caso surpreendente de Sião.
- source_word: חָלָה
  choice: entrou em trabalho de parto
  rationale: Reproduz claramente a imagem obstétrica em linguagem moderna e digna.
- source_word: גַּם יָלְדָה
  choice: também deu à luz
  rationale: Conserva o valor aditivo de גַּם sem acrescentar uma relação temporal não explicitada.
- source_word: צִיּוֹן
  choice: Sião
  rationale: Forma tradicional e amplamente reconhecida em português, preservando a personificação da cidade.
- source_word: בָּנֶיהָ
  choice: seus filhos
  rationale: Em português, 'filhos' pode designar coletivamente a descendência; conserva ainda a forma masculina plural do hebraico, com alternativa inclusiva registrada em nota.
theological_decisions:
- issue: Personificação materna de Sião
  choice: Manter Sião como mãe personificada que entra em trabalho de parto e dá à luz
  alternative: Explicitar abstratamente a restauração nacional
  rationale: A figura materna está expressa no hebraico e deve permanecer sem ser reduzida a uma interpretação abstrata.
- issue: Referência de בָּנֶיהָ
  choice: Traduzir por 'seus filhos'
  alternative: seus filhos e filhas; suas crianças
  rationale: '''Filhos'' preserva a forma masculina plural e funciona em português como coletivo de descendentes, sem afirmar que o grupo seja exclusivamente masculino.'
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. As perguntas retóricas e o paralelismo poético foram mantidos; evitou-se introduzir a ideia temporal de 'assim que', ausente do texto.
