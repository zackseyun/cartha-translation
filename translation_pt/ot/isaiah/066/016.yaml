source:
  edition: WLC
  text: כִּ֤י בָ/אֵשׁ֙ יְהוָ֣ה נִשְׁפָּ֔ט וּ/בְ/חַרְבּ֖/וֹ אֶת כָּל בָּשָׂ֑ר וְ/רַבּ֖וּ חַֽלְלֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/016.yaml
  text: For by fire Yahweh will execute judgment[a], and by his sword, against all flesh[b]; and many will be those slain by Yahweh.
translation:
  language: pt
  text: Pois Yahweh executará juízo contra toda carne[b], por meio do fogo e de sua espada[a]; e muitos serão os mortos por Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Yahweh julgará toda carne pelo fogo e pela sua espada”. O verbo hebraico pode ser traduzido de forma mais compacta como “julgará” ou, mais explicitamente, como “entrará em juízo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “toda carne”, expressão profética que se refere a toda a humanidade em sua condição de criaturas mortais.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou razão ligada ao contexto anterior, preservando de modo natural a força conectiva.
- source_word: בָאֵשׁ
  choice: pelo fogo
  rationale: A preposição ב tem valor instrumental no contexto, indicando o meio do juízo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: נִשְׁפָּט
  choice: executará juízo
  rationale: O nifal de שׁפט descreve aqui a atuação judicial de Yahweh. A formulação é clara em português e conserva a nuance forense.
- source_word: וּבְחַרְבּוֹ
  choice: e, pela sua espada
  rationale: Mantém o valor instrumental da preposição e preserva a imagem da espada sem decidir se é literal ou figurada.
- source_word: אֶת כָּל בָּשָׂר
  choice: contra toda carne
  rationale: Com o verbo judicial, אֶת introduz aqueles contra quem se exerce o juízo. 'Toda carne' conserva o idioma profético e seu alcance amplo.
- source_word: וְרַבּוּ
  choice: e serão muitos
  rationale: Expressa naturalmente a multiplicidade indicada pelo verbo e mantém a ênfase na grande quantidade.
- source_word: חַלְלֵי יְהוָה
  choice: os mortos por Yahweh
  rationale: 'Explicita em português a relação do construto: são os que foram mortos pela ação de Yahweh.'
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico apresenta o nome próprio divino; a transliteração preserva essa identificação sem substituí-la por um título.
- issue: Alcance de כָּל בָּשָׂר
  choice: toda carne
  alternative: toda a humanidade; todas as pessoas
  rationale: A expressão hebraica é abrangente e ressalta a condição corpórea e mortal humana; sua forma idiomática é preservada sem restringir o alcance.
- issue: Sentido judicial de נִשְׁפָּט
  choice: executará juízo
  alternative: julgará; entrará em juízo
  rationale: A opção comunica a ação judicial divina com naturalidade, enquanto a nota registra a formulação mais compacta e a alternativa processual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem mantém a solenidade profética; as vírgulas destacam os dois instrumentos do juízo. Todos os marcadores de nota aparecem no texto principal.
