base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/021.yaml
  text: And even from them I will take some for priests and for Levites[b][a], says Yahweh.
translation:
  language: pt
  text: E também, dentre eles[a], tomarei alguns para serem sacerdotes e levitas[b], diz o SENHOR.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O antecedente de “eles” fica implícito no hebraico e deve ser entendido com base no contexto anterior.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “como sacerdotes e como levitas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: E também
  rationale: Preserva tanto a ligação com o contexto anterior quanto a ênfase aditiva do hebraico, de modo natural em português.
- source_word: מֵהֶם
  choice: dentre eles
  rationale: Expressa o sentido partitivo da preposição מן sem identificar além do texto o antecedente implícito de “eles”.
- source_word: אֶקַּח
  choice: tomarei alguns
  rationale: Mantém a imagem literal de לקח, “tomar”, enquanto “alguns” torna claro em português o sentido de seleção a partir de um grupo.
- source_word: לַכֹּהֲנִים לַלְוִיִּם
  choice: para serem sacerdotes e levitas
  rationale: Comunica de maneira natural a designação para essas funções, refletindo o uso do prefixo ל diante de ambos os substantivos.
- source_word: אָמַר יְהוָה
  choice: diz o SENHOR
  rationale: O perfeito hebraico integra uma fórmula profética com valor performativo presente; “diz o SENHOR” é corrente, digno e preserva a forma tradicional de representar o nome divino.
theological_decisions:
- issue: Identidade de “eles” e alcance da inclusão sacerdotal e levítica
  choice: Manter o pronome sem explicitar seu referente e traduzir as designações sem restringir quem pode ser incluído.
  alternative: Entender “eles” especificamente como israelitas que retornam dentre as nações, ou interpretar sacerdotes e levitas apenas de maneira figurada.
  rationale: O hebraico deixa o antecedente implícito, dependente do contexto anterior. A tradução, portanto, preserva a afirmação surpreendente e sua tensão teológica sem impor uma identificação mais estreita nem decidir se as funções devem ser entendidas literal ou figuradamente.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Dentre eles” conserva a referência contextual; “para serem” torna idiomática a ideia hebraica de nomeação ou designação. A ordem dos marcadores segue a sequência das questões no texto.
