base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/010.yaml
  text: Rejoice with Jerusalem and be glad in her[a], all you who love her; rejoice with her in joy[b], all you who mourn over her.
translation:
  language: pt
  text: Alegrem-se com Jerusalém[a] e exultem nela, todos vocês que a amam; exultem com ela de alegria[b], todos vocês que choram por ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Alegrem-se por causa de Jerusalém”. A construção hebraica com אֶת depois de “alegrar-se” pode apresentar Jerusalém como o motivo da alegria, embora as expressões paralelas “nela” e “com ela” favoreçam a ideia de alegria compartilhada.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “exultem com ela com grande alegria”. No hebraico, o verbo é seguido de um substantivo da mesma raiz para dar ênfase.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחוּ
  choice: Alegrem-se
  rationale: Imperativo plural de שׂמח. “Alegrem-se” comunica de modo natural o chamado à alegria e permite distinguir o verbo seguinte.
- source_word: אֶת יְרוּשָׁלִַם
  choice: com Jerusalém
  rationale: Embora אֶת costume marcar o objeto direto, com verbos de alegria pode indicar aquele com quem ou por quem se celebra. “Com Jerusalém” se harmoniza com בָהּ e אִתָּהּ e ressalta a alegria compartilhada, sem ocultar a alternativa indicada em nota.
- source_word: וְגִילוּ
  choice: e exultem
  rationale: גיל expressa alegria jubilosa. “Exultem” preserva a intensidade e diferencia este verbo de שׂמח.
- source_word: בָהּ
  choice: nela
  rationale: Mantém de perto a preposição ב e a personificação feminina de Jerusalém.
- source_word: כָּל אֹהֲבֶיהָ
  choice: todos vocês que a amam
  rationale: A forma participial descreve os que amam Jerusalém; a formulação com “vocês” conserva o apelo direto dos imperativos.
- source_word: שִׂישׂוּ
  choice: exultem
  rationale: O imperativo transmite alegria intensa. “Exultem” é corrente em registro bíblico digno e combina naturalmente com o substantivo cognato seguinte.
- source_word: אִתָּהּ
  choice: com ela
  rationale: A preposição indica companhia inequívoca e reforça tanto a personificação de Jerusalém quanto a participação coletiva em sua alegria.
- source_word: מָשׂוֹשׂ
  choice: de alegria
  rationale: O substantivo cognato intensifica o verbo שׂישׂוּ. “Exultem com ela de alegria” conserva a repetição sem produzir uma construção excessivamente rígida em português.
- source_word: כָּל הַמִּתְאַבְּלִים
  choice: todos vocês que choram
  rationale: O particípio hitpael de אבל designa os que estão de luto. “Choram” é claro e natural, mantendo o sentido de lamentação no contexto.
- source_word: עָלֶיהָ
  choice: por ela
  rationale: Com o verbo de luto, עַל assinala a pessoa ou realidade pela qual se lamenta. “Por ela” é a expressão idiomática em português.
