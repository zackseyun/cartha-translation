  text: וְ/הָיָ֗ה מִֽ/דֵּי חֹ֨דֶשׁ֙ בְּ/חָדְשׁ֔/וֹ וּ/מִ/דֵּ֥י שַׁבָּ֖ת בְּ/שַׁבַּתּ֑/וֹ יָב֧וֹא כָל בָּשָׂ֛ר לְ/הִשְׁתַּחֲוֺ֥ת לְ/פָנַ֖/י אָמַ֥ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/023.yaml
  text: And it shall be[a], from new moon to its new moon and from Sabbath to its Sabbath, all flesh shall come to bow down before me[b], says Yahweh.
translation:
  language: pt
  text: E acontecerá que, de lua nova em lua nova e de sábado em sábado, toda carne virá prostrar-se diante de mim, diz Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mês após mês e sábado após sábado”. “Toda carne” é uma expressão hebraica que, aqui, se refere naturalmente a toda a humanidade, conservando também a ideia de vida corporal e criada.'
    reason: Registra alternativas lexicais relevantes para a expressão de recorrência e esclarece, sem eliminar, a amplitude do idioma hebraico.
lexical_decisions:
- source_word: וְהָיָה
  choice: E acontecerá que
  rationale: Reproduz a fórmula profética de introdução a uma situação futura em português atual e solene.
- source_word: מִדֵּי חֹדֶשׁ בְּחָדְשׁוֹ
  choice: de lua nova em lua nova
  rationale: A construção indica recorrência regular; no paralelismo com o sábado, חֹדֶשׁ designa naturalmente a lua nova como ocasião de culto. O português idiomático não explicita os sufixos hebraicos sem soar artificial.
- source_word: וּמִדֵּי שַׁבָּת בְּשַׁבַּתּוֹ
  choice: e de sábado em sábado
  rationale: Preserva o termo litúrgico e expressa a recorrência semanal com naturalidade.
- source_word: יָבוֹא כָל בָּשָׂר
  choice: toda carne virá
  rationale: Mantém a expressão hebraica de alcance universal e sua ênfase na condição corporal das criaturas, sem reduzi-la silenciosamente a 'todas as pessoas'.
- source_word: לְהִשְׁתַּחֲוֺת
  choice: prostrar-se
  rationale: Expressa o gesto físico de inclinação profunda em adoração, preservando mais concretamente o verbo hebraico do que o simples 'adorar'.
- source_word: לְפָנַי
  choice: diante de mim
  rationale: Equivalente português corrente que indica comparecimento à presença divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, em conformidade com a política do projeto.
theological_decisions:
- issue: Se חֹדֶשׁ deve ser traduzido como 'mês' ou 'lua nova'
  choice: lua nova
  alternative: mês
  rationale: O paralelo com o sábado e o cenário de culto favorecem a ocasião litúrgica da lua nova, sem tirar conclusões sobre a continuidade futura de calendários religiosos.
- issue: O alcance de כָל בָּשָׂר
  choice: toda carne
  alternative: toda a humanidade
  rationale: A formulação mantém a amplitude e a concretude do hebraico. No contexto, refere-se mais naturalmente à humanidade universal, mas não convém estreitar a expressão na tradução.
- issue: Se לְהִשְׁתַּחֲוֺת deve explicitar adoração ou o gesto corporal
  choice: prostrar-se
  alternative: adorar
  rationale: O gesto ocorre claramente em contexto de culto; manter o ato concreto evita substituir a imagem do original por uma interpretação abstrata.
translation_notes:
  register: Português moderno, solene e amplamente inteligível, com boa legibilidade brasileira. A ordem foi ajustada à sintaxe natural do português; as expressões bíblicas significativas “toda carne” e “Yahweh” foram preservadas.
