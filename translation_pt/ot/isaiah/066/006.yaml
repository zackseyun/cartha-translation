source:
  edition: WLC
  text: ק֤וֹל שָׁאוֹן֙ מֵ/עִ֔יר ק֖וֹל מֵֽ/הֵיכָ֑ל ק֣וֹל יְהוָ֔ה מְשַׁלֵּ֥ם גְּמ֖וּל לְ/אֹיְבָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/006.yaml
  text: A sound of uproar from the city[a], a sound from the temple[c][b], the sound of Yahweh repaying recompense to his enemies.
translation:
  language: pt
  text: Som de tumulto vem da cidade[a], som vem do templo[b], som de Yahweh, que retribui aos seus inimigos o que lhes é devido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “voz” ou “ruído” para cada ocorrência de “som”; para “tumulto”, também se pode traduzir “alvoroço”, “estrondo” ou “agitação”. O hebraico repete a mesma palavra três vezes, produzindo efeito retórico.
    reason: lexical_alternative
  - marker: b
    text: A palavra hebraica traduzida por “templo” também pode significar “palácio” em outros contextos.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: som
  rationale: O substantivo pode significar “som”, “voz” ou “ruído”. Como não há conteúdo falado e a cena é auditiva, “som” é a opção mais ampla e permite preservar sua repetição tríplice.
- source_word: שָׁאוֹן
  choice: tumulto
  rationale: Denota forte estrondo, agitação ou alvoroço. “Tumulto” comunica a comoção ruidosa ligada ao juízo e combina naturalmente com “som”.
- source_word: מֵעִיר
  choice: vem da cidade
  rationale: A preposição מִן indica origem. A inserção natural de “vem” em português explicita a frase nominal hebraica sem alterar a imagem do som procedente da cidade.
- source_word: מֵהֵיכָל
  choice: vem do templo
  rationale: הֵיכָל também pode designar um palácio, mas neste contexto de Sião e em paralelo com a cidade refere-se mais provavelmente ao templo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino do texto hebraico em vez de substituí-lo por um título.
- source_word: מְשַׁלֵּם
  choice: dá
  rationale: O particípio de שׁלם expressa retribuição ou pagamento. Em conjunto com גְּמוּל, “dá ... o que lhes é devido” transmite a ação retributiva com naturalidade e dignidade em português.
- source_word: גְּמוּל
  choice: o que lhes é devido
  rationale: O substantivo designa aquilo que se dá em retorno, aqui em sentido punitivo por ter como destinatários os inimigos. A formulação evita a redundância pouco natural de “retribui retribuição” sem eliminar a noção judicial.
- source_word: לְאֹיְבָיו
  choice: aos seus inimigos
  rationale: O לְ marca os destinatários da retribuição; “aos seus inimigos” mantém diretamente essa relação gramatical.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta o Tetragrama como nome próprio. “Yahweh” o preserva de forma transparente, em vez de substituí-lo pelo título “SENHOR”.
- issue: Natureza da retribuição expressa por מְשַׁלֵּם גְּמוּל
  choice: dá aos seus inimigos o que lhes é devido
  alternative: retribui aos seus inimigos; paga a recompensa aos seus inimigos
  rationale: A expressão é judicial e punitiva no contexto, mas o texto formula a ação em termos gerais de retorno devido. A tradução mantém isso sem acrescentar uma descrição específica da pena.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “som” reproduz a estrutura enfática do hebraico; a inclusão de “vem” torna naturais em português as orações nominais. A expressão final prioriza equivalência ótima e evita uma construção cognata artificial.
