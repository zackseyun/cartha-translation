- from: 'Pois assim diz Yahweh: “Eis que estendo até ela a paz como um rio e a glória das nações[a] como uma torrente transbordante. Vocês mamarão, serão carregados junto ao quadril e embalados sobre os joelhos[b].”'
  to: 'Pois assim diz Yahweh: “Eis que estendo para ela a paz como um rio e a glória das nações[a] como uma torrente transbordante. Vocês mamarão, serão carregados no quadril e acarinhados nos joelhos[b].”'
  rationale: A revisão torna idiomáticas as imagens de transportar uma criança no quadril e de tratá-la afetuosamente nos joelhos, sem alterar as pessoas verbais, a voz passiva das duas ações finais, nem o referente feminino implícito. Também substitui construções menos naturais por equivalentes portugueses diretos.
