base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/012.yaml
  text: 'For thus says Yahweh: Behold[a], I am extending peace to her like a river, and the glory of the nations like an overflowing stream; and you will nurse, you will be carried on the hip[b], and bounced on the knees.'
translation:
  language: pt
  text: 'Pois assim diz Yahweh: “Eis que estendo para ela a paz como um rio e a glória das nações[a] como uma torrente transbordante. Vocês mamarão, serão carregados no quadril e acarinhados nos joelhos[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a riqueza” ou “a abundância das nações”. A palavra hebraica traduzida por “glória” pode incluir o esplendor e as riquezas das nações.
    reason: lexical_alternative
  - marker: b
    text: Ou “embalados nos joelhos”. O hebraico retrata o cuidado afetuoso e brincalhão dado a uma criança.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título, preservando sua identificação no texto hebraico.
- source_word: הִנְנִי נֹטֶה אֵלֶיהָ
  choice: Eis que estendo até ela
  rationale: “Eis que” conserva a ênfase dêitica; “estendo até ela” mantém a imagem e o aspecto da ação expressos pelo particípio.
- source_word: שָׁלוֹם
  choice: paz
  rationale: É a correspondência mais reconhecível e preserva a amplitude contextual de bem-estar, integridade e prosperidade.
- source_word: כְּנָהָר
  choice: como um rio
  rationale: Mantém diretamente a comparação com um fluxo abundante e contínuo.
- source_word: וּכְנַחַל שׁוֹטֵף
  choice: como uma torrente transbordante
  rationale: Expressa tanto o curso de água quanto sua força inundante, sem exigir o termo técnico “uádi”.
- source_word: כְּבוֹד גּוֹיִם
  choice: a glória das nações
  rationale: Preserva a polissemia de כָּבוֹד, que pode abranger esplendor, honra e riqueza; a possível nuance material é registrada em nota.
- source_word: וִינַקְתֶּם
  choice: Vocês mamarão
  rationale: Reproduz o Qal ativo na segunda pessoa do plural e torna clara a imagem dos destinatários como crianças alimentadas pela cidade-mãe.
- source_word: עַל צַד תִּנָּשֵׂאוּ
  choice: serão carregados junto ao quadril
  rationale: Mantém a forma passiva e a imagem materna de uma criança carregada ao lado do corpo, evitando reduzir צַד simplesmente a “colo”.
- source_word: וְעַל בִּרְכַּיִם תְּשָׁעֳשָׁעוּ
  choice: embalados sobre os joelhos
  rationale: Comunica em português atual o cuidado afetuoso e brincalhão dispensado a uma criança nos joelhos, sem impor uma única ação física excessivamente específica.
theological_decisions:
- issue: Referente do pronome feminino singular אֵלֶיהָ (“até ela”)
  choice: Manter “ela”
  alternative: Explicitar “Jerusalém” ou “Sião”
  rationale: O contexto imediato identifica a cidade materna, mas o versículo usa um pronome; conservá-lo preserva a coesão literária e evita explicitação interpretativa desnecessária.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas naturais para leitores brasileiros. O paralelismo poético e a imagem de Jerusalém como mãe foram preservados; a pontuação divide a promessa de abundância de suas imagens de cuidado materno.
