revisions:
- from: 'Ouçam a palavra de Yahweh, vocês que tremem diante da palavra dele: “Os próprios irmãos de vocês, que os odeiam e os expulsam por causa do meu nome, disseram: ‘Que Yahweh seja glorificado, para que vejamos a alegria de vocês!’”[a] Mas eles serão envergonhados.'
  to: 'Ouçam a palavra de Yahweh, vocês que tremem diante da palavra dele: os irmãos de vocês, que os odeiam e os expulsam por causa do meu nome, disseram: “Que Yahweh seja glorificado, e vejamos a alegria de vocês!”[a] Mas eles ficarão envergonhados.'
  rationale: A revisão corrige a estrutura das aspas para que a fala citada corresponda exatamente ao conteúdo introduzido por «disseram». Também elimina uma ênfase interpretativa dispensável, preserva a coordenação da frase hebraica e ajusta a expressão final para refletir mais naturalmente o valor de בוש. A nota mantém, sem impor, a provável ironia e as leituras alternativas discutidas.
