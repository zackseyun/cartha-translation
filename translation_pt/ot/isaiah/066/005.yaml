review_pass:
  verdict: revise
  source_fidelity: 'A tradução transmite adequadamente a convocação profética, o temor diante da palavra de Yahweh, a hostilidade dos «irmãos», a exclusão por causa do nome divino e a reversão final. Contudo, as aspas externas em torno de «Os próprios irmãos...» deslocam desnecessariamente a delimitação da citação no hebraico: somente a fala introduzida por «disseram» deve ficar entre aspas. «Ficarão envergonhados» representa melhor o sentido resultativo de יֵבֹשׁוּ do que um passivo que poderia sugerir um agente explícito.'
  naturalness: A redação é clara e atual. A retirada de «próprios» evita uma intensificação não expressa no hebraico, e «e vejamos a alegria de vocês» preserva com mais transparência a coordenação volitiva da fala citada. A pontuação revista torna a estrutura mais fluida.
  terminology: «Yahweh», «palavra», «tremem», «irmãos», «expulsam» e «por causa do meu nome» são escolhas apropriadas e consistentes. «Glorificado» preserva o tom religioso da fórmula hebraica, sem determinar no texto se ela é sincera ou zombeteira.
  issues:
  - severity: medium
    issue: Delimitação imprópria das aspas da citação
    rationale: No hebraico, אָמְרוּ introduz diretamente as palavras «יִכְבַּד יְהוָה וְנִרְאֶה...». Os irmãos hostis são o sujeito de «disseram», não o conteúdo de uma citação externa.
  - severity: low
    issue: Intensificação em «Os próprios irmãos»
    rationale: «Próprios» pode ser inferido pelo contraste contextual, mas não está lexicalmente expresso em אֲחֵיכֶם; removê-lo conserva melhor a sobriedade do original.
  - severity: low
    issue: «Serão envergonhados» pode soar passivo demais
    rationale: יֵבֹשׁוּ é forma ativa com o sentido de ficar/ser tomado de vergonha. «Ficarão envergonhados» é idiomático e não introduz um agente.
