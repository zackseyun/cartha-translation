  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שִׁמְעוּ֙ דְּבַר יְהוָ֔ה הַ/חֲרֵדִ֖ים אֶל דְּבָר֑/וֹ אָמְרוּ֩ אֲחֵי/כֶ֨ם שֹׂנְאֵי/כֶ֜ם מְנַדֵּי/כֶ֗ם לְמַ֤עַן שְׁמִ/י֙ יִכְבַּ֣ד יְהוָ֔ה וְ/נִרְאֶ֥ה בְ/שִׂמְחַתְ/כֶ֖ם וְ/הֵ֥ם יֵבֹֽשׁוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/005.yaml
  text: 'Hear the word of Yahweh[a], you who tremble at his word: Your brothers who hate you, who cast you out for my name’s sake, have said, “Let Yahweh be glorified, that we may see your joy”[b]; but they will be put to shame.'
translation:
  language: pt
  text: 'Ouçam a palavra de Yahweh, vocês que tremem diante da palavra dele: os irmãos de vocês, que os odeiam e os expulsam por causa do meu nome, disseram: “Que Yahweh seja glorificado, e vejamos a alegria de vocês!”[a] Mas eles ficarão envergonhados.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A fala provavelmente é uma provocação dos perseguidores. Também pode ser entendida sem ironia: “Que Yahweh seja honrado, e vejamos a alegria de vocês.” Alguns interpretam a frase como referência à manifestação de Yahweh, mas o hebraico massorético favorece “vejamos”.'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Ouçam
  rationale: O imperativo plural convoca os destinatários a escutar com atenção; “Ouçam” é direto, natural e preserva o tom profético.
- source_word: דְּבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Mantém a fórmula profética e verte diretamente o nome divino יְהוָה como “Yahweh”.
- source_word: הַחֲרֵדִים אֶל דְּבָרוֹ
  choice: vocês que tremem diante da palavra dele
  rationale: Preserva a imagem concreta de חרד, que pode expressar temor reverente, sem reduzi-la simplesmente a “reverenciam”.
- source_word: אֲחֵיכֶם
  choice: Os próprios irmãos de vocês
  rationale: “Irmãos” conserva o vínculo expresso no hebraico, provavelmente entre membros do mesmo povo; “próprios” realça naturalmente o contraste doloroso sem alterar seu conteúdo.
- source_word: שֹׂנְאֵיכֶם
  choice: que os odeiam
  rationale: Traduz o particípio atributivo por uma oração relativa clara em português.
- source_word: מְנַדֵּיכֶם
  choice: que os expulsam
  rationale: O particípio pode indicar afastar, banir ou excluir. “Expulsam” comunica sua força, enquanto a nota registra alternativas possíveis.
- source_word: לְמַעַן שְׁמִי
  choice: por causa do meu nome
  rationale: Expressa de modo corrente que o nome divino é o motivo alegado ou o pretexto da hostilidade, sem decidir além do texto.
- source_word: יִכְבַּד יְהוָה
  choice: Que Yahweh seja glorificado
  rationale: O imperfeito tem força volitiva; a forma passiva preserva a formulação religiosa, possivelmente irônica, dos perseguidores.
- source_word: וְנִרְאֶה בְשִׂמְחַתְכֶם
  choice: para que vejamos a alegria de vocês
  rationale: Toma נִרְאֶה segundo a morfologia massorética como primeira pessoa do plural, “vejamos”, e verte בְשִׂמְחַתְכֶם idiomaticamente como objeto do ver.
- source_word: יֵבֹשׁוּ
  choice: serão envergonhados
  rationale: Comunica a futura inversão de sorte e a desonra pública indicada por בוש.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; “Yahweh” representa diretamente o nome próprio e segue a orientação lexical fornecida.
- issue: Tom da fala dos irmãos hostis
  choice: Mantê-la como citação possivelmente zombeteira, sem inserir explicitamente “zombando” no texto
  alternative: Entendê-la como declaração religiosa sincera ou acrescentar no corpo do texto que é uma zombaria
  rationale: O ódio, a expulsão e a vergonha final tornam provável a ironia, mas o hebraico não a marca lexicalmente; a pontuação e a nota preservam essa tensão.
- issue: Sujeito de נִרְאֶה
  choice: “vejamos”, primeira pessoa do plural, referindo-se aos irmãos que falam
  alternative: “que ele apareça”, entendendo a frase como referência a uma manifestação divina
  rationale: A vocalização e a morfologia do Texto Massorético favorecem a primeira pessoa plural. A leitura alternativa é registrada por ser conhecida, mas não deve substituir silenciosamente a evidência textual principal.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. Conserva a repetição de “palavra”, a imagem de tremer e o vínculo de “irmãos”. Emprega “vocês/os” para clareza internacional com boa legibilidade brasileira. A alternativa lexical de מְנַדֵּיכֶם (“excluem” ou “banem”) foi considerada, mas “expulsam” foi escolhida no corpo do texto por sua força e naturalidade.
