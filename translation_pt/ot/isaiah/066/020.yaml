  text: וְ/הֵבִ֣יאוּ אֶת כָּל אֲחֵי/כֶ֣ם מִ/כָּל הַ/גּוֹיִ֣ם מִנְחָ֣ה לַֽ/יהוָ֡ה בַּ/סּוּסִ֡ים וּ֠/בָ/רֶכֶב וּ/בַ/צַּבִּ֨ים וּ/בַ/פְּרָדִ֜ים וּ/בַ/כִּרְכָּר֗וֹת עַ֣ל הַ֥ר קָדְשִׁ֛/י יְרוּשָׁלִַ֖ם אָמַ֣ר יְהוָ֑ה כַּ/אֲשֶׁ֣ר יָבִיאוּ֩ בְנֵ֨י יִשְׂרָאֵ֧ל אֶת הַ/מִּנְחָ֛ה בִּ/כְלִ֥י טָה֖וֹר בֵּ֥ית יְהוָֽה־־־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/020.yaml
  text: And they will bring all your brothers from all the nations as an offering to Yahweh[a], on horses and in chariots and in litters and on mules and on camels, to my holy mountain Jerusalem, says Yahweh[c][b], just as the sons of Israel bring the offering in a clean vessel to the house of Yahweh.
translation:
  language: pt
  text: E eles trarão todos os irmãos de vocês, de todas as nações, como oferta a Yahweh, a cavalo, em carros, em liteiras[a], montados em mulas e camelos[b], para Jerusalém, meu santo monte, diz Yahweh, assim como os filhos de Israel trazem a oferta em recipiente puro à casa de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “carros cobertos”; o termo hebraico é raro e seu sentido exato é incerto.
    reason: lexical_alternative
  - marker: b
    text: Possivelmente “dromedários velozes”; o termo hebraico é raro.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיאוּ
  choice: E eles trarão
  rationale: O hifil perfeito com waw em discurso profético tem valor futuro; esta formulação conserva naturalmente a ação de trazer.
- source_word: כָּל אֲחֵיכֶם
  choice: todos os irmãos de vocês
  rationale: Mantém o termo familiar masculino do hebraico, que no contexto pode designar parentes ou membros do mesmo povo, sem neutralizar sua forma.
- source_word: מִכָּל הַגּוֹיִם
  choice: de todas as nações
  rationale: Expressa de modo direto a procedência dentre os povos onde se encontram os dispersos.
- source_word: מִנְחָה
  choice: como oferta
  rationale: O termo pode significar dádiva, tributo ou oferta cultual; o paralelo com a oferta levada à casa de Yahweh favorece 'oferta' sem restringi-la necessariamente a uma oferta de cereais.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição indica direção ou dedicação no contexto da oferta; o nome divino é transliterado de acordo com a camada inglesa fornecida.
- source_word: בַּסּוּסִים וּבָרֶכֶב
  choice: em cavalos, carros
  rationale: Reproduz de forma idiomática os meios de transporte; רֶכֶב pode designar carros ou carruagens, e 'carros' evita especificidade excessiva.
- source_word: וּבַצַּבִּים
  choice: liteiras
  rationale: O vocábulo raro parece indicar algum tipo de veículo de transporte; 'liteiras' é plausível, mas a incerteza é registrada em nota.
- source_word: וּבַפְּרָדִים
  choice: mulas
  rationale: פֶּרֶד significa claramente 'mula'.
- source_word: וּבַכִּרְכָּרוֹת
  choice: camelos
  rationale: O termo é raro e incerto, frequentemente entendido como animais velozes de montaria, possivelmente dromedários; 'camelos' é natural e não excessivamente específico.
- source_word: עַל הַר קָדְשִׁי יְרוּשָׁלִַם
  choice: a Jerusalém, meu santo monte
  rationale: Torna explícita em português a aposição entre Jerusalém e 'meu santo monte', preservando a ideia de destino.
- source_word: בִּכְלִי טָהוֹר
  choice: em recipiente puro
  rationale: כְּלִי é amplo, podendo indicar utensílio, vaso ou recipiente; 'recipiente' preserva essa abrangência, e 'puro' mantém a possível dimensão ritual de טָהוֹר.
theological_decisions:
- issue: Referente de “irmãos de vocês”
  choice: Preservar a referência familiar, que aponta primariamente para os israelitas dispersos trazidos dentre as nações.
  alternative: Entender os gentios convertidos, ou todos os adoradores das nações, como a própria oferta.
  rationale: A expressão hebraica e a comparação subsequente com os filhos de Israel favorecem o ajuntamento dos parentes israelitas, mas a tradução não exclui ressonâncias escatológicas mais amplas.
- issue: Natureza da oferta
  choice: Manter “como oferta”, apresentando as pessoas trazidas em analogia com uma oferta cultual.
  alternative: Especificar “oferta de cereais” ou reduzir o sentido a “presente/tributo”.
  rationale: מִנְחָה tem amplitude semântica, e o contexto cultual é claro, mas o versículo não exige a acepção técnica mais estreita.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe ajustada para deixar claro que as pessoas serão trazidas pelos meios de transporte enumerados. “Irmãos de vocês” preserva a forma do hebraico e sua possível amplitude de parentesco. Os marcadores [a] e [b] aparecem imediatamente após os termos pertinentes.
