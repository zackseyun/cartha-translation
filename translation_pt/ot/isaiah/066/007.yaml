base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/007.yaml
  text: Before she was in labor[a], she gave birth; before pain came upon her[b], she delivered a son.
translation:
  language: pt
  text: Antes que entrasse em trabalho de parto[a], ela[b] deu à luz; antes que lhe viessem as dores, deu à luz um filho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “antes que sentisse as dores do parto”.'
    reason: lexical_alternative
  - marker: b
    text: A mulher é Sião/Jerusalém no contexto ao redor.
    reason: cross_reference
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: Antes que
  rationale: Expressa de modo natural a relação temporal do hebraico e preserva sua repetição enfática nas duas orações.
- source_word: תָּחִיל
  choice: entrasse em trabalho de parto
  rationale: No contexto de nascimento, o verbo descreve o início das contrações ou o contorcer-se do parto; esta formulação é clara e atual.
- source_word: יָלָדָה
  choice: deu à luz
  rationale: Equivalente português corrente e preciso para o ato de dar à luz.
- source_word: יָבֹא חֵבֶל לָהּ
  choice: lhe viessem as dores
  rationale: Reproduz o movimento da expressão hebraica, na qual as dores chegam a ela, e o plural idiomático em português indica as dores do parto.
- source_word: וְהִמְלִיטָה
  choice: deu à luz
  rationale: O hifil de מלט tem aqui o sentido de fazer sair ou trazer ao nascimento. A repetição é mais natural e inequívoca em português do que alternativas como “deu à luz a salvo”.
- source_word: זָכָר
  choice: um filho
  rationale: Embora o termo signifique literalmente “macho” ou “do sexo masculino”, no contexto imediato de um parto, “um filho” é a expressão portuguesa natural e mantém a especificidade masculina.
theological_decisions:
- issue: Referente da mulher
  choice: Mantido implícito nas formas verbais femininas, sem inserir Sião ou Jerusalém no texto principal.
  alternative: Explicitar “Sião” ou “Jerusalém”.
  rationale: O contexto identifica a figura feminina com Sião/Jerusalém, mas o versículo em si não repete seu nome. Preservar o sujeito implícito mantém a imagem e evita transformar interpretação contextual em texto explícito.
- issue: Caráter extraordinário do nascimento
  choice: 'Preservada a sequência paradoxal: o nascimento ocorre antes do trabalho de parto e das dores.'
  alternative: Explicar o enunciado como metáfora ou profecia específica no corpo do texto.
  rationale: A tradução deve conservar a tensão retórica e teológica do hebraico sem definir no próprio versículo seu cumprimento ou alcance.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O sujeito feminino pode ficar naturalmente implícito em português; as marcas de gênero em “entrasse” não o indicam, mas o contexto e a nota esclarecem o referente. A repetição de “deu à luz” prioriza clareza e correspondência semântica.
