  yaml_path: translation/ot/isaiah/066/011.yaml
  text: so that you may nurse and be satisfied from her comforting breast[c][b][a], so that you may drink deeply and delight yourselves from the abundance of her glory.
translation:
  language: pt
  text: para que vocês mamem e se saciem do seio dos seus consolos[a]; para que suguem profundamente[b] e se deleitem com a abundância[c] da sua glória.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “do seio dos seus consolos”. A expressão hebraica também pode ser entendida como “do seio que traz os seus consolos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “extraiam” ou “suguem até o fim”; o verbo hebraico é vívido e prolonga a imagem da amamentação.'
    reason: lexical_alternative
  - marker: c
    text: O substantivo hebraico é raro e também pode ser entendido como “plenitude” ou “transbordamento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: para que
  rationale: Preserva naturalmente a força de propósito ou resultado nas duas orações.
- source_word: תִּינְקוּ
  choice: vocês mamem
  rationale: O verbo ינק descreve mamar; a escolha mantém de modo claro e corrente a imagem materna de Jerusalém.
- source_word: וּשְׂבַעְתֶּם
  choice: e fiquem satisfeitos
  rationale: Expressa a ideia de saciedade resultante da amamentação sem recorrer a linguagem arcaica.
- source_word: מִשֹּׁד תַּנְחֻמֶיהָ
  choice: no seio que a consola
  rationale: Formulação portuguesa natural que conserva o seio materno e relaciona os consolos de Jerusalém a essa fonte, sem eliminar a construção hebraica difícil; a alternativa mais literal é registrada em nota.
- source_word: תָּמֹצּוּ
  choice: suguem profundamente
  rationale: Mantém o verbo vívido que prolonga a imagem da amamentação e comunica extração plena.
- source_word: וְהִתְעַנַּגְתֶּם
  choice: e se deleitem
  rationale: Preserva o sentido reflexivo do hitpael e a ideia de prazer intenso em português atual e digno.
- source_word: מִזִּיז
  choice: com a abundância
  rationale: זִיז é raro e de sentido discutido; 'abundância' se ajusta ao paralelismo, enquanto a nota conserva outras possibilidades.
- source_word: כְּבוֹדָהּ
  choice: da sua glória
  rationale: '''Glória'' conserva o valor amplo de כבוד e sua ressonância característica em Isaías.'
theological_decisions:
- issue: Imagem materna de Jerusalém/Sião
  choice: Manter diretamente Jerusalém personificada como mãe que amamenta, consola e nutre.
  alternative: Generalizar a figura como simples consolo divino ou eliminar a corporeidade da imagem.
  rationale: O contexto apresenta Jerusalém como mãe; preservar a metáfora evita impor uma alegorização não explicitada pelo texto.
- issue: Referência do sufixo feminino em תַּנְחֻמֶיהָ e כְּבוֹדָהּ
  choice: Entendê-lo como referência a Jerusalém personificada.
  alternative: Tomá-lo de modo abstrato, sem explicitar a personagem feminina contextual.
  rationale: A concordância feminina e o contexto imediato sustentam a referência a Jerusalém, sem negar que o consolo procede, em última instância, da ação divina no capítulo.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. O plural de segunda pessoa é vertido por “vocês”. A repetição de “para que” mantém o paralelismo hebraico. A preposição hebraica מן é traduzida idiomaticamente por “no” na primeira oração e “com” na segunda, pois “do seio” e “da abundância” poderiam soar menos naturais ou sugerir relações sintáticas indevidas em português.
