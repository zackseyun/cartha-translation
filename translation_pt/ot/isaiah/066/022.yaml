source:
  edition: WLC
  text: כִּ֣י כַ/אֲשֶׁ֣ר הַ/שָּׁמַ֣יִם הַ֠/חֳדָשִׁים וְ/הָ/אָ֨רֶץ הַ/חֲדָשָׁ֜ה אֲשֶׁ֨ר אֲנִ֥י עֹשֶׂ֛ה עֹמְדִ֥ים לְ/פָנַ֖/י נְאֻם יְהוָ֑ה כֵּ֛ן יַעֲמֹ֥ד זַרְעֲ/כֶ֖ם וְ/שִׁמְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/022.yaml
  text: For just as the new heavens and the new earth that I am making shall remain before me[a], declares Yahweh, so your offspring and your name shall remain.
translation:
  language: pt
  text: Pois, assim como os novos céus e a nova terra que estou fazendo permanecerão diante de mim[a], diz Yahweh, assim também permanecerão a descendência de vocês e o seu nome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ficarão firmes” ou “subsistirão”; o mesmo verbo hebraico é usado depois para a descendência e o nome.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento da afirmação precedente e mantém uma ligação discursiva natural em português.
- source_word: כַאֲשֶׁר ... כֵּן
  choice: assim como ... assim também
  rationale: Preserva claramente a estrutura comparativa correlativa do hebraico.
- source_word: הַשָּׁמַיִם הַחֳדָשִׁים וְהָאָרֶץ הַחֲדָשָׁה
  choice: os novos céus e a nova terra
  rationale: Mantém a determinação presente em ambos os elementos e a formulação cósmica do original.
- source_word: עֹשֶׂה
  choice: estou fazendo
  rationale: Reproduz o valor participial de uma ação divina em curso ou iminente sem convertê-la silenciosamente em futuro simples.
- source_word: עֹמְדִים / יַעֲמֹד
  choice: permanecerão / permanecerão
  rationale: No contexto, o verbo עמד comunica continuidade ou duração. A repetição do mesmo verbo em português conserva a força da comparação.
- source_word: לְפָנַי
  choice: diante de mim
  rationale: Equivalente formal e natural que preserva o sentido relacional e espacial sem o explicar em excesso.
- source_word: נְאֻם יְהוָה
  choice: declaração de Yahweh
  rationale: Conserva a solenidade da fórmula profética e apresenta יהוה como nome próprio, não como título substitutivo.
- source_word: זַרְעֲכֶם
  choice: a descendência de vocês
  rationale: Expressa naturalmente o coletivo זרע em português moderno; evita o sentido predominantemente biológico que 'semente' teria neste contexto.
- source_word: וְשִׁמְכֶם
  choice: e o nome de vocês
  rationale: Mantém a imagem concreta do hebraico sem reduzi-la a fama, reputação ou identidade.
theological_decisions:
- issue: A expressão escatológica “novos céus e nova terra”
  choice: Mantida como expressão direta de renovação cósmica, sem determinar se deve ser entendida de modo estritamente literal ou figurado.
  alternative: Interpretá-la explicitamente como nova criação material ou apenas como restauração da ordem da aliança.
  rationale: O texto admite amplitude escatológica e não resolve aqui a natureza precisa dessa renovação.
- issue: O alcance da promessa acerca da descendência e do nome
  choice: Mantida como promessa de continuidade duradoura, sem identificar explicitamente seus destinatários com uma única construção teológica.
  alternative: Restringi-la a Israel étnico, ao remanescente fiel ou ampliá-la expressamente ao povo escatológico de Deus.
  rationale: O versículo não especifica por si só todo o alcance teológico dos destinatários; a tradução preserva essa tensão.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” explicita naturalmente a segunda pessoa do plural. Os travessões destacam a fórmula profética sem alterar sua função.
