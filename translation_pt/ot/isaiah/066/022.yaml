revisions:
- from: Pois, assim como os novos céus e a nova terra que estou fazendo permanecerão diante de mim[a] — declaração de Yahweh —, assim também permanecerão a descendência e o nome de vocês.
  to: Pois, assim como os novos céus e a nova terra que estou fazendo permanecerão diante de mim[a], diz Yahweh, assim também permanecerão a descendência de vocês e o seu nome.
  rationale: A revisão substitui uma fórmula nominal menos idiomática por «diz Yahweh» e explicita que tanto a descendência quanto o nome pertencem aos destinatários. Mantêm-se o aspecto participial de «estou fazendo», a estrutura «assim como ... assim também», a repetição de «permanecerão» e a ambiguidade teológica do texto.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:30:58Z'
review_pass:
  verdict: revise
  source_fidelity: 'A estrutura comparativa e os principais elementos hebraicos são bem preservados: a ação participial de Deus, a permanência diante dele, e a continuidade da descendência e do nome. A repetição de «permanecerão» transmite adequadamente o paralelismo de עֹמְדִים / יַעֲמֹד.'
  naturalness: «Declaração de Yahweh» é compreensível, mas soa menos idiomático em português atual do que a fórmula profética «diz Yahweh». Além disso, em «a descendência e o nome de vocês», o complemento final pode, embora o contexto favoreça a leitura correta, ligar-se mais imediatamente apenas a «nome».
  terminology: «Yahweh» conserva de modo consistente o nome divino. «Descendência» é uma boa solução moderna para זַרְעֲכֶם, e «nome» mantém o termo concreto do hebraico.
  issues:
  - severity: low
    issue: Fórmula profética pouco natural
    rationale: «Declaração de Yahweh» é uma construção nominal possível, mas «diz Yahweh» reproduz naturalmente a fórmula נְאֻם יְהוָה em português e preserva seu registro profético.
  - severity: low
    issue: Escopo possessivo potencialmente ambíguo
    rationale: Em português, «a descendência e o nome de vocês» pode deixar o possessivo sintaticamente mais próximo apenas de «nome». Repetir o possessivo em «a descendência de vocês e o seu nome» torna explícito o paralelismo possessivo do hebraico.
