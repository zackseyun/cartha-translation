id: ISA.2.10
reference: Isaiah 2:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בּ֣וֹא בַ/צּ֔וּר וְ/הִטָּמֵ֖ן בֶּֽ/עָפָ֑ר מִ/פְּנֵי֙ פַּ֣חַד יְהוָ֔ה וּ/מֵ/הֲדַ֖ר גְּאֹנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/010.yaml
  text: Enter into the rock and hide yourself in the dust from before the terror of Yahweh and from the splendor of his majesty[a][b][c].
translation:
  language: pt
  text: Entre na rocha e esconda-se no pó, por causa do terror de Yahweh[a][b] e do esplendor da sua majestade[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do pavor de Yahweh”.
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “de diante de”, indicando fuga da presença de Yahweh.
    reason: lexical_alternative
  - marker: c
    text: Ou “da majestade do seu esplendor”. O hebraico reúne dois termos de sentido próximo para descrever uma glória régia avassaladora.
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹא בַצּוּר
  choice: Entre na rocha
  rationale: O imperativo de בוא com a preposição ב indica entrar no rochedo ou abrigo rochoso. A formulação é direta e natural em português.
- source_word: וְהִטָּמֵן
  choice: e esconda-se
  rationale: O imperativo nifal de טמן tem aqui valor reflexivo; “esconda-se” comunica esse sentido com clareza.
- source_word: בֶּעָפָר
  choice: no pó
  rationale: עָפָר designa pó ou terra solta. “Pó” preserva a imagem bíblica de humilhação e fragilidade.
- source_word: מִפְּנֵי
  choice: por causa de
  rationale: No contexto, a expressão introduz aquilo de que a pessoa procura escapar. A nota preserva sua forma espacial mais literal, “de diante de”.
- source_word: פַּחַד יְהוָה
  choice: o terror de Yahweh
  rationale: פַּחַד expressa pavor intenso neste contexto de juízo, não o temor reverente característico de outros textos. O nome divino é transliterado como Yahweh.
- source_word: וּמֵהֲדַר גְּאֹנוֹ
  choice: e do esplendor da sua majestade
  rationale: הָדָר e גָּאוֹן formam uma combinação de termos próximos que descreve a glória régia avassaladora de Yahweh. “Esplendor” e “majestade” mantêm a distinção lexical.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o nome próprio divino. “Yahweh” preserva sua condição de nome, sem substituí-lo por um título.
- issue: Sentido de פַּחַד aplicado a Yahweh
  choice: terror de Yahweh
  alternative: pavor de Yahweh; temor de Yahweh
  rationale: O cenário é de fuga diante da manifestação judicial de Deus. “Terror” preserva a severidade e evita sugerir apenas reverência religiosa.
- issue: Relação entre הָדָר e גָּאוֹן
  choice: esplendor da sua majestade
  alternative: majestade do seu esplendor
  rationale: Os substantivos hebraicos são semanticamente próximos e admitem mais de uma distribuição em português. A opção escolhida é natural e mantém ambos, enquanto a nota registra a alternativa.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção imperativa direta. “Rocha” mantém a imagem concreta do abrigo rochoso; “pó”, “terror”, “esplendor” e “majestade” preservam o tom poético e solene sem recorrer a linguagem arcaica.
