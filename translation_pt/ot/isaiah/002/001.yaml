id: ISA.2.1
reference: Isaiah 2:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַ/דָּבָר֙ אֲשֶׁ֣ר חָזָ֔ה יְשַֽׁעְיָ֖הוּ בֶּן אָמ֑וֹץ עַל יְהוּדָ֖ה וִ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/001.yaml
  text: The word that Isaiah son of Amoz saw concerning Judah and Jerusalem[a][b].
translation:
  language: pt
  text: A palavra que Isaías, filho de Amoz, viu a respeito de Judá e de Jerusalém.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “A mensagem” ou “O assunto”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “viu”; expressão profética comum para o recebimento de revelação em visão.'
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּבָר
  choice: A palavra
  rationale: דָּבָר pode significar “palavra”, “mensagem” ou “assunto”. “A palavra” conserva a expressão concreta e tradicional da fórmula profética, enquanto a nota registra alternativas naturais.
- source_word: אֲשֶׁר
  choice: que
  rationale: O pronome relativo português “que” reproduz de modo natural a ligação entre “a palavra” e o que Isaías viu.
- source_word: חָזָה
  choice: viu
  rationale: O verbo significa literalmente “viu” e funciona como termo profético para percepção visionária. A tradução preserva a metáfora da fonte hebraica sem explicá-la dentro do texto.
- source_word: יְשַׁעְיָהוּ
  choice: Isaías
  rationale: Forma consagrada do nome em português.
- source_word: בֶּן
  choice: filho de
  rationale: Representa naturalmente a relação de filiação usada para identificar o profeta.
- source_word: אָמוֹץ
  choice: Amoz
  rationale: Forma tradicional e clara do nome próprio em português.
- source_word: עַל
  choice: a respeito de
  rationale: Na introdução profética, a preposição apresenta o tema ou âmbito da revelação. “A respeito de” é neutro e natural, sem restringir antecipadamente a mensagem a juízo contra esses lugares.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma consagrada do nome geográfico em português.
- source_word: וִירוּשָׁלִָם
  choice: e de Jerusalém
  rationale: 'A repetição de “de” produz uma coordenação clara e idiomática em português: “a respeito de Judá e de Jerusalém”.'
theological_decisions:
- issue: Natureza da revelação profética em חָזָה
  choice: Manter a linguagem visionária “viu”.
  alternative: “recebeu em visão” ou “profetizou”
  rationale: O hebraico emprega explicitamente o verbo “ver”. Preservá-lo mantém o modo visionário da revelação e evita reduzi-lo a uma referência genérica ao ato de profetizar.
- issue: Sentido de עַל na introdução
  choice: “a respeito de Judá e de Jerusalém”
  alternative: “contra Judá e Jerusalém” ou “sobre Judá e Jerusalém”
  rationale: A expressão introduz amplamente o assunto da visão. A formulação neutra preserva a tensão entre juízo e esperança no conteúdo subsequente, sem impor aqui um sentido exclusivamente adversativo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi mantida próxima do hebraico, mas com vírgulas em torno de “filho de Amoz” para fluência. As notas preservam a amplitude lexical de דָּבָר e esclarecem, sem substituir, a imagem profética de חָזָה.
