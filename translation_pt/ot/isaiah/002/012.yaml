id: ISA.2.12
reference: Isaiah 2:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י י֞וֹם לַ/יהוָ֧ה צְבָא֛וֹת עַ֥ל כָּל גֵּאֶ֖ה וָ/רָ֑ם וְ/עַ֖ל כָּל נִשָּׂ֥א וְ/שָׁפֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/012.yaml
  text: For Yahweh of Armies has a day against all that is proud and lofty[a], and against all that is lifted up—and it shall be brought low.
translation:
  language: pt
  text: Pois Yahweh dos Exércitos tem um dia contra tudo o que é orgulhoso e altivo, contra tudo o que é elevado — e será rebaixado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e será humilhado”.'
    reason: Alternativa lexical para וְשָׁפֵל; “rebaixado” conserva mais diretamente a imagem de abaixamento presente no hebraico.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou fundamento da afirmação anterior, preservando a conexão argumentativa.
- source_word: יוֹם לַיהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos tem um dia
  rationale: Expressa em português natural a oração nominal hebraica, na qual um dia de intervenção e juízo pertence a Yahweh.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino e traduz צְבָאוֹת de modo transparente, preservando a ideia de forças sob o comando de Yahweh.
- source_word: עַל
  choice: contra
  rationale: No contexto de juízo, a preposição tem força adversativa.
- source_word: כָּל גֵּאֶה וָרָם
  choice: tudo o que é orgulhoso e altivo
  rationale: Preserva tanto a soberba quanto a imagem de elevação presente no par hebraico.
- source_word: כָּל נִשָּׂא
  choice: tudo o que se exalta
  rationale: Conserva a metáfora de elevação e permite referência abrangente, sem restringi-la indevidamente apenas a pessoas.
- source_word: וְשָׁפֵל
  choice: e será humilhado
  rationale: 'Trata a forma como resultado verbal do juízo: aquilo que está elevado será rebaixado.'
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome divino sem substituí-lo por um título.
- issue: Tradução do título יהוה צבאות
  choice: Yahweh dos Exércitos
  alternative: Yahweh dos Exércitos celestiais; SENHOR dos Exércitos
  rationale: “Exércitos” comunica de modo claro o sentido de forças numerosas sob comando divino, sem limitar explicitamente a expressão aos seres celestiais.
- issue: Alcance de כָּל com adjetivos de elevação
  choice: tudo o que
  alternative: todo aquele que
  rationale: A formulação neutra preserva a amplitude do hebraico, que pode abranger pessoas e realidades elevadas no desenvolvimento do oráculo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “tudo o que” reproduz o paralelismo hebraico; o travessão destaca o resultado do juízo sem eliminar a tensão poética.
