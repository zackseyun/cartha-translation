  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַל֙ כָּל אַרְזֵ֣י הַ/לְּבָנ֔וֹן הָ/רָמִ֖ים וְ/הַ/נִּשָּׂאִ֑ים וְ/עַ֖ל כָּל אַלּוֹנֵ֥י הַ/בָּשָֽׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/013.yaml
  text: and against all the cedars of Lebanon[a], lofty and lifted up, and against all the oaks of Bashan.
translation:
  language: pt
  text: e contra todos os cedros do Líbano, altos e elevados, e contra todos os carvalhos de Basã.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “terebintos de Basã”. O termo hebraico pode designar uma árvore de grande porte identificada como carvalho ou terebinto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: e contra
  rationale: No contexto da lista de juízo, עַל indica ação hostil dirigida contra os objetos enumerados; a conjunção preserva a estrutura cumulativa do poema.
- source_word: כָּל
  choice: todos
  rationale: O plural coletivo é expresso naturalmente em português por “todos” diante dos nomes de árvores no plural.
- source_word: אַרְזֵי הַלְּבָנוֹן
  choice: os cedros do Líbano
  rationale: A construção hebraica associa os célebres cedros à região do Líbano; “do Líbano” é a formulação portuguesa consagrada e natural.
- source_word: הָרָמִים
  choice: altos
  rationale: Expressa diretamente a altura física das árvores e, no contexto, permite que a ressonância simbólica de grandeza e orgulho permaneça implícita.
- source_word: וְהַנִּשָּׂאִים
  choice: elevados
  rationale: Preserva a imagem de algo erguido ou alçado e mantém a correspondência poética com o tema contextual da altivez, sem converter a metáfora em explicação.
- source_word: אַלּוֹנֵי הַבָּשָׁן
  choice: os carvalhos de Basã
  rationale: “Carvalhos” é uma identificação tradicional e contextualmente apropriada para árvores majestosas em paralelo com os cedros, embora o termo hebraico também possa designar terebintos; a incerteza é registrada em nota.
theological_decisions:
- issue: Força simbólica das árvores no oráculo de juízo
  choice: Manter literalmente as imagens dos cedros e carvalhos, deixando a associação com os orgulhosos surgir do contexto.
  alternative: Explicitar no texto que as árvores simbolizam governantes, povos ou pessoas orgulhosas.
  rationale: O contexto reúne realidades naturais e humanas elevadas que o SENHOR humilhará. Preservar as árvores como árvores mantém a poesia e evita inserir no texto uma interpretação não explicitada neste versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem cumulativa e o paralelismo hebraico foram preservados; “altos e elevados” mantém a dupla descrição poética sem explicitar indevidamente seu simbolismo.
