id: ISA.2.11
reference: Isaiah 2:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עֵינֵ֞י גַּבְה֤וּת אָדָם֙ שָׁפֵ֔ל וְ/שַׁ֖ח ר֣וּם אֲנָשִׁ֑ים וְ/נִשְׂגַּ֧ב יְהוָ֛ה לְ/בַדּ֖/וֹ בַּ/יּ֥וֹם הַ/הֽוּא׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/011.yaml
  text: The lofty eyes of man will be brought low[a], and the haughtiness of men will be humbled; and Yahweh alone will be exalted in that day.
translation:
  language: pt
  text: Os olhos altivos do ser humano serão abatidos,[a] e a arrogância das pessoas será humilhada; somente Yahweh será exaltado naquele dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O olhar orgulhoso do ser humano será rebaixado, e a altivez das pessoas será abatida”. O hebraico descreve o orgulho humano por meio da imagem de uma postura elevada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי גַּבְהוּת אָדָם
  choice: Os olhos altivos do ser humano
  rationale: Preserva a imagem hebraica dos olhos elevados como expressão visível do orgulho. “Ser humano” comunica o valor genérico de אָדָם sem restringir a referência aos homens.
- source_word: שָׁפֵל
  choice: serão abatidos
  rationale: Mantém a imagem espacial de fazer baixar e expressa adequadamente o sentido profético passivo/futuro no contexto.
- source_word: וְשַׁח
  choice: será humilhada
  rationale: Comunica o rebaixamento da altivez e evita repetição mecânica de “abatidos”, preservando o paralelismo semântico.
- source_word: רוּם אֲנָשִׁים
  choice: a arrogância das pessoas
  rationale: רוּם denota elevação ou altivez; no contexto, a elevação figurada é arrogância. “Pessoas” representa naturalmente o plural אֲנָשִׁים e inclui toda a humanidade visada pelo oráculo.
- source_word: וְנִשְׂגַּב
  choice: será exaltado
  rationale: Expressa o estado elevado de Yahweh e conserva o contraste deliberado entre o rebaixamento humano e a exaltação divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: לְבַדּוֹ
  choice: somente
  rationale: 'Marca com clareza a exclusividade: naquele dia, Yahweh, e nenhum outro, será exaltado.'
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: É a forma natural em português para a fórmula temporal profética, preservando sua referência contextual.
theological_decisions:
- issue: Representação de אָדָם e אֲנָשִׁים no oráculo de juízo
  choice: ser humano ... pessoas
  alternative: homem ... homens
  rationale: O contraste abrange a humanidade orgulhosa, não apenas indivíduos do sexo masculino. A tradução preserva a alternância singular genérica/plural de modo natural no português atual.
- issue: Representação de יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico traz diretamente o Tetragrama; a transliteração conserva o nome pessoal e evita substituí-lo silenciosamente por um título.
- issue: Sentido figurado de רוּם אֲנָשִׁים
  choice: a arrogância das pessoas
  alternative: a elevação das pessoas
  rationale: No paralelismo, a altura humana é uma imagem de orgulho. “Arrogância” torna o sentido inteligível, enquanto a nota preserva a metáfora de elevação presente no hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo poético, a imagem dos olhos altivos e o contraste entre o rebaixamento humano e a exaltação exclusiva de Yahweh.
