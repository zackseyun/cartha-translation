lexical_decisions:
- source_word: וְהָאֱלִילִים
  choice: E os ídolos
  rationale: A conjunção וְ é vertida naturalmente por “E”; o artigo הָ indica definição, e אֱלִילִים designa ídolos, com uma conotação depreciativa de inutilidade que o contexto preserva sem precisar ser explicitada.
- source_word: כָּלִיל
  choice: por completo
  rationale: O termo funciona adverbialmente e enfatiza a totalidade do desaparecimento; “por completo” é claro, atual e enfático em português.
- source_word: יַחֲלֹף
  choice: desaparecerão
  rationale: A forma verbal de חלף pode significar passar, passar para longe ou desaparecer. Neste contexto profético, intensificada por כָּלִיל, “desaparecerão” comunica de modo natural a remoção total dos ídolos.
