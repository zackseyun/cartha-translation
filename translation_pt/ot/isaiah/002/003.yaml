reference: Isaiah 2:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְֽ/הָלְכ֞וּ עַמִּ֣ים רַבִּ֗ים וְ/אָמְרוּ֙ לְכ֣וּ וְ/נַעֲלֶ֣ה אֶל הַר יְהוָ֗ה אֶל בֵּית֙ אֱלֹהֵ֣י יַעֲקֹ֔ב וְ/יֹרֵ֨/נוּ֙ מִ/דְּרָכָ֔י/ו וְ/נֵלְכָ֖ה בְּ/אֹרְחֹתָ֑י/ו כִּ֤י מִ/צִּיּוֹן֙ תֵּצֵ֣א תוֹרָ֔ה וּ/דְבַר יְהוָ֖ה מִ/ירוּשָׁלִָֽם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/003.yaml
  text: And many peoples will come and say[a], “Come, let us go up to the mountain of Yahweh, to the house of the God of Jacob, that he may teach us his ways and that we may walk in his paths.” For instruction will go out from Zion[b], and the word of Yahweh from Jerusalem.
translation:
  language: pt
  text: 'Muitos povos virão e dirão[a]: “Venham, subamos ao monte de Yahweh, à casa do Deus de Jacó, para que ele nos ensine os seus caminhos e andemos pelas suas veredas”. Pois de Sião sairá a instrução[b], e de Jerusalém, a palavra de Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irão” ou “andarão”; o verbo hebraico significa literalmente “ir/andar”, mas aqui descreve os povos dirigindo-se a Sião.
    reason: lexical_alternative
  - marker: b
    text: “Instrução” traduz o hebraico torá, que também pode ser traduzido por “lei” ou “ensino”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלְכוּ
  choice: virão
  rationale: Embora הלך signifique literalmente “ir/andar”, o contexto descreve os povos dirigindo-se a Sião; “virão” expressa naturalmente esse movimento rumo ao ponto focal da cena. A alternativa literal é preservada em nota.
- source_word: עַמִּים רַבִּים
  choice: muitos povos
  rationale: Mantém o plural coletivo e o sentido étnico-nacional de עמים sem restringi-lo a Estados políticos.
- source_word: לְכוּ וְנַעֲלֶה
  choice: Venham, subamos
  rationale: Reproduz a exortação coletiva e preserva a imagem tradicional da subida a Jerusalém em português corrente.
- source_word: הַר יְהוָה
  choice: monte de Yahweh
  rationale: הַר é vertido por “monte”, termo natural no contexto de Sião, e o nome divino é transliterado.
- source_word: בֵּית אֱלֹהֵי יַעֲקֹב
  choice: casa do Deus de Jacó
  rationale: “Casa” conserva a expressão hebraica e sua ressonância teológica, embora o referente seja o templo.
- source_word: וְיֹרֵנוּ מִדְּרָכָיו
  choice: para que ele nos ensine os seus caminhos
  rationale: O hifil de ירה significa “ensinar/instruir”. A construção portuguesa traduz naturalmente o propósito e o idioma hebraico; representar מִן de modo rígido como “a partir dos seus caminhos” produziria uma formulação obscura.
- source_word: וְנֵלְכָה בְּאֹרְחֹתָיו
  choice: e andemos pelas suas veredas
  rationale: “Andar pelas veredas” preserva a metáfora hebraica de conduta e acompanha o valor volitivo da sequência.
- source_word: תּוֹרָה
  choice: instrução
  rationale: Neste contexto profético, תּוֹרָה abrange ensino e orientação divina, não apenas legislação; a nota registra alternativas tradicionais.
- source_word: תֵּצֵא
  choice: sairá
  rationale: Traduz diretamente o movimento de יצא, apresentando a instrução como procedente de Sião.
- source_word: וּדְבַר יְהוָה
  choice: e de Jerusalém, a palavra de Yahweh
  rationale: “Palavra de Yahweh” preserva a fórmula profética; a elipse de “sairá” na segunda oração reproduz o paralelismo com naturalidade em português.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” conserva o nome pactual por transliteração, sem substituí-lo por um título.
- issue: Amplitude semântica de תּוֹרָה
  choice: instrução
  alternative: lei; ensino
  rationale: “Instrução” mantém o sentido amplo de orientação divina no contexto em que os povos buscam aprender os caminhos de Deus, sem reduzir o termo a um código jurídico.
- issue: Relação entre ensino divino e caminhada humana
  choice: para que ele nos ensine os seus caminhos e andemos pelas suas veredas
  alternative: ele nos ensinará os seus caminhos, e caminharemos pelas suas veredas
  rationale: A formulação com valor de propósito acompanha a sequência exortativa sem transformar em certeza declarativa aquilo que pode funcionar como finalidade desejada.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. Conservam-se o paralelismo poético, a imagem da subida a Sião, “casa” em vez de explicitar “templo” e a metáfora de andar pelas veredas.
