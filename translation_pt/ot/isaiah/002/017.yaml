id: ISA.2.17
reference: Isaiah 2:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/שַׁח֙ גַּבְה֣וּת הָ/אָדָ֔ם וְ/שָׁפֵ֖ל ר֣וּם אֲנָשִׁ֑ים וְ/נִשְׂגַּ֧ב יְהוָ֛ה לְ/בַדּ֖/וֹ בַּ/יּ֥וֹם הַ/הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/017.yaml
  text: The loftiness of man will be brought low[a], and the exaltation of men will be humbled; and Yahweh alone will be exalted in that day.
translation:
  language: pt
  text: 'A arrogância humana será abatida,

    e o orgulho das pessoas será humilhado;

    naquele dia, somente Yahweh será exaltado.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A altivez do ser humano se curvará, e a elevação das pessoas será rebaixada.” O hebraico emprega imagens de altura para falar da arrogância humana.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁח גַּבְהוּת הָאָדָם
  choice: A arrogância humana será abatida
  rationale: O substantivo גַּבְהוּת denota altura e, neste contexto, arrogância. A formulação natural em português comunica a metáfora de rebaixamento expressa por שׁח, cujo perfeito tem força futura no discurso profético.
- source_word: וְשָׁפֵל רוּם אֲנָשִׁים
  choice: e o orgulho das pessoas será humilhado
  rationale: רוּם expressa elevação ou altivez e, no paralelismo, refere-se ao orgulho humano. 'Das pessoas' representa naturalmente o plural אֲנָשִׁים sem restringir o referente apenas aos homens do sexo masculino.
- source_word: וְנִשְׂגַּב
  choice: será exaltado
  rationale: O nifal de שׂגב comunica estar elevado ou exaltado e mantém o contraste entre a altivez humana rebaixada e a exaltação exclusiva de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: לְבַדּוֹ
  choice: somente
  rationale: 'Expressa com clareza a exclusividade enfática: naquele dia, Yahweh, e nenhum outro, será exaltado.'
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Equivalente português natural da fórmula temporal profética.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome divino, não o título אֲדֹנָי. 'Yahweh' preserva essa distinção e representa uma vocalização acadêmica amplamente aceita.
- issue: Referência humana em הָאָדָם / אֲנָשִׁים
  choice: humana ... das pessoas
  alternative: do homem ... dos homens
  rationale: Ambos os termos são genéricos neste paralelismo e abrangem a humanidade. A redação escolhida é clara no português atual e não introduz uma limitação masculina ausente do contexto.
- issue: Metáfora vertical da soberba e do rebaixamento
  choice: arrogância ... abatida; orgulho ... humilhado
  alternative: altivez do ser humano se curvará; elevação das pessoas será rebaixada
  rationale: A opção principal comunica naturalmente o sentido contextual, enquanto a nota registra a imagem hebraica de altura e rebaixamento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo poético foi preservado em três linhas; a metáfora hebraica mais literal foi mantida em nota.
