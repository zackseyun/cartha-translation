source:
  edition: WLC
  text: כִּ֣י נָטַ֗שְׁתָּה עַמְּ/ךָ֙ בֵּ֣ית יַעֲקֹ֔ב כִּ֤י מָלְאוּ֙ מִ/קֶּ֔דֶם וְ/עֹֽנְנִ֖ים כַּ/פְּלִשְׁתִּ֑ים וּ/בְ/יַלְדֵ֥י נָכְרִ֖ים יַשְׂפִּֽיקוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/006.yaml
  text: For you have forsaken your people[a], the house of Jacob, because they are full of eastern ways, and they practice divination like the Philistines[c][b], and they strike hands with the children of foreigners.
translation:
  language: pt
  text: Pois abandonaste o teu povo, a casa de Jacó, porque eles estão cheios de práticas do Oriente[a], praticam adivinhação como os filisteus[b] e dão-se as mãos com os filhos de estrangeiros[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “do Oriente” ou “desde o Oriente”. A expressão provavelmente se refere a influências ou práticas orientais, embora também possa designar pessoas vindas do leste.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “são adivinhos como os filisteus”.'
    reason: lexical_alternative
  - marker: c
    text: O verbo hebraico é raro e de sentido incerto. Pode significar “dão-se as mãos com”, “firmam acordos com” ou, de modo mais geral, “associam-se aos” filhos de estrangeiros.
    reason: alternative_reading
lexical_decisions:
- source_word: נָטַשְׁתָּה
  choice: abandonaste
  rationale: O verbo significa deixar, abandonar ou desamparar. “Abandonaste” é natural em português e conserva a força grave da declaração dirigida a Deus.
- source_word: עַמְּךָ בֵּית יַעֲקֹב
  choice: o teu povo, a casa de Jacó
  rationale: Mantém a construção apositiva, na qual “a casa de Jacó” identifica “o teu povo”, e preserva Jacó, conforme o hebraico.
- source_word: מָלְאוּ מִקֶּדֶם
  choice: estão cheios de práticas do Oriente
  rationale: O perfeito tem sentido resultativo ou descritivo. A expressão seguinte é elíptica, literalmente “do Oriente”; “práticas do Oriente” explicita com moderação o elemento implícito no contexto.
- source_word: עֹנְנִים
  choice: praticam adivinhação
  rationale: O particípio designa adivinhos ou a prática de adivinhação. A formulação verbal é clara e corrente, sem especificar indevidamente um método ocultista particular.
- source_word: כַּפְּלִשְׁתִּים
  choice: como os filisteus
  rationale: Reproduz diretamente a comparação introduzida pela preposição כ.
- source_word: וּבְיַלְדֵי נָכְרִים
  choice: aos filhos de estrangeiros
  rationale: Preserva de perto a expressão “filhos/crianças de estrangeiros”, sem substituir o referente por uma condenação étnica mais ampla.
- source_word: יַשְׂפִּיקוּ
  choice: dão as mãos
  rationale: O verbo raro e incerto parece indicar associação, concordância ou um gesto de firmar acordo. “Dão as mãos” conserva a imagem provável e permite registrar outras possibilidades em nota.
theological_decisions:
- issue: Adoção de práticas estrangeiras e associação com estrangeiros
  choice: O texto denuncia a incorporação de práticas divinatórias orientais e uma associação comprometedora com estrangeiros.
  alternative: A frase final pode referir-se mais especificamente a firmar pactos ou acordos; “do Oriente” também pode designar pessoas vindas do leste.
  rationale: A linguagem profética censura práticas e alianças incompatíveis com a fidelidade do povo, não a origem étnica em si. As expressões incertas permanecem abertas por meio das notas.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “O teu povo” mantém a segunda pessoa singular dirigida a Deus; “práticas do Oriente” evita uma formulação truncada, e as notas preservam a incerteza lexical genuína.
