  text: וְ/שָׁפַט֙ בֵּ֣ין הַ/גּוֹיִ֔ם וְ/הוֹכִ֖יחַ לְ/עַמִּ֣ים רַבִּ֑ים וְ/כִתְּת֨וּ חַרְבוֹתָ֜/ם לְ/אִתִּ֗ים וַ/חֲנִיתֽוֹתֵי/הֶם֙ לְ/מַזְמֵר֔וֹת לֹא יִשָּׂ֨א ג֤וֹי אֶל גּוֹי֙ חֶ֔רֶב וְ/לֹא יִלְמְד֥וּ ע֖וֹד מִלְחָמָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/004.yaml
  text: And he will judge between the nations and arbitrate for many peoples[a]; and they will beat their swords into plowshares and their spears into pruning hooks. Nation will not lift up sword against nation[b], and they will not learn war anymore.
translation:
  language: pt
  text: Ele julgará entre as nações e decidirá sobre muitos povos[a]. Eles transformarão suas espadas em lâminas de arado e suas lanças em podadeiras. Nenhuma nação levantará a espada contra outra nação, nem aprenderão mais a guerrear[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “repreenderá muitos povos” ou “arbitrará em favor de muitos povos”. O verbo hebraico pode ter força judicial ou corretiva.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “nem aprenderão mais a guerra”; a expressão também pode comunicar que não voltarão a treinar para a guerra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפַט
  choice: julgará
  rationale: שׁפט tem sentido judicial ou governante; com בֵּין e em paralelo com וְהוֹכִיחַ, o sentido de julgar entre partes é predominante.
- source_word: בֵּין הַגּוֹיִם
  choice: entre as nações
  rationale: Preserva a construção adjudicatória e o paralelismo do hebraico.
- source_word: וְהוֹכִיחַ
  choice: arbitrará
  rationale: No hifil, יכח pode indicar decidir, arbitrar, demonstrar ou repreender. O paralelismo judicial e o resultado de paz favorecem aqui 'arbitrará', sem apagar a possível força corretiva.
- source_word: לְעַמִּים רַבִּים
  choice: em favor de muitos povos
  rationale: Mantém a distinção entre עַמִּים, 'povos', e גּוֹיִם, 'nações'; a expressão representa לְ em seu valor relacional ou benefactivo neste contexto.
- source_word: וְכִתְּתוּ
  choice: transformarão
  rationale: כתת significa bater ou esmagar; no contexto, descreve a remodelagem das armas. 'Transformarão' comunica naturalmente o resultado em português, embora torne menos explícito o processo de martelar.
- source_word: חַרְבוֹתָם
  choice: suas espadas
  rationale: Equivalente direto de חֶרֶב, preservando a imagem concreta.
- source_word: לְאִתִּים
  choice: em lâminas de arado
  rationale: אִתִּים designa implementos agrícolas ligados ao arado; 'lâminas de arado' é claro e concreto no português moderno.
- source_word: וַחֲנִיתוֹתֵיהֶם
  choice: e suas lanças
  rationale: חֲנִיתוֹת significa lanças; a tradução direta preserva o paralelismo com espadas.
- source_word: לְמַזְמֵרוֹת
  choice: em podadeiras
  rationale: מַזְמֵרוֹת são instrumentos de poda; 'podadeiras' é uma forma atual e compreensível.
- source_word: לֹא יִשָּׂא גוֹי אֶל גוֹי חֶרֶב
  choice: Nenhuma nação levantará a espada contra outra nação
  rationale: Preserva a imagem idiomática de erguer a espada em hostilidade, com sintaxe natural em português.
- source_word: וְלֹא יִלְמְדוּ עוֹד מִלְחָמָה
  choice: nem aprenderão mais a guerrear
  rationale: Mantém o verbo 'aprender', importante na formulação hebraica, enquanto 'a guerrear' soa mais idiomático do que 'a guerra' em português; a ideia pode incluir treinamento militar.
theological_decisions:
- issue: Identidade do sujeito de וְשָׁפַט e וְהוֹכִיחַ
  choice: Manter o pronome 'Ele' sem identificar expressamente o referente neste versículo.
  alternative: Explicitar 'o SENHOR'.
  rationale: O contexto aponta para o SENHOR como agente último, mas as formas verbais hebraicas trazem apenas um sujeito masculino singular implícito. A tradução não resolve no próprio versículo aquilo que o hebraico deixa dependente do contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo poético e as imagens concretas, sem identificar explicitamente o sujeito masculino singular. Todos os marcadores de nota constam no texto principal.
