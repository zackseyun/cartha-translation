  text: Stop trusting in man, whose breath is in his nostrils; for what is he really worth?
translation:
  language: pt
  text: Parem de confiar no ser humano, cujo fôlego está em suas narinas; pois que valor ele tem?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חִדְלוּ לָכֶם מִן־הָאָדָם
  choice: Parem de confiar no ser humano
  rationale: O imperativo plural חִדְלוּ pede que os ouvintes cessem sua atitude para com a humanidade; no contexto, “confiar” expressa naturalmente a advertência contra depositar segurança no poder humano. “Ser humano” representa הָאָדָם sem restringir a referência aos homens do sexo masculino.
- source_word: נְשָׁמָה בְּאַפּוֹ
  choice: tem apenas o sopro em suas narinas
  rationale: Preserva a imagem concreta do hebraico, na qual a vida humana depende do sopro nas narinas. “Apenas” explicita a fragilidade implicada pela imagem e pelo argumento, sem identificar נְשָׁמָה tecnicamente como alma.
- source_word: כִּי בַמֶּה נֶחְשָׁב הוּא
  choice: pois que valor ele realmente tem?
  rationale: Reproduz a pergunta retórica sobre a importância, estima ou valor do ser humano como fundamento de confiança. “Realmente” comunica em português a força depreciativa da formulação interrogativa.
theological_decisions:
- issue: Natureza da advertência sobre o ser humano
  choice: Traduzir a ordem como cessar de confiar no ser humano
  alternative: Parem de dar importância ao ser humano
  rationale: O hebraico permite uma formulação mais ampla, como afastar-se ou deixar de considerar o ser humano; o contexto de Isaías 2 contrapõe a autoconfiança humana à exaltação exclusiva do SENHOR, favorecendo “confiar”, sem afirmar que toda consideração ou valorização de pessoas seja indevida.
- issue: Fragilidade da vida humana
  choice: Manter a metáfora do sopro nas narinas
  alternative: cuja vida é passageira
  rationale: A imagem hebraica fundamenta a advertência na dependência e mortalidade humanas. Mantê-la conserva a força poética sem desenvolver uma doutrina específica sobre corpo, alma ou espírito.
translation_notes:
  register: Português moderno, claro e digno, com imperativo plural natural ao leitor brasileiro. A construção conserva a imagem poética hebraica e evita o uso genérico potencialmente ambíguo de “homem”.
