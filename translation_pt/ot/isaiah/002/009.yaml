  text: וַ/יִּשַּׁ֥ח אָדָ֖ם וַ/יִּשְׁפַּל אִ֑ישׁ וְ/אַל תִּשָּׂ֖א לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/009.yaml
  text: So man is bowed down[a], and each person is brought low; do not forgive them.
translation:
  language: pt
  text: 'Assim, o ser humano se curva,

    e cada pessoa é rebaixada;

    não os perdoes.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não os levantes”. O verbo hebraico pode significar “levantar, carregar, suportar” e, em certos contextos, “perdoar”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשַּׁח
  choice: se curva
  rationale: O verbo שׁחח/שׁח descreve curvar-se ou ficar abatido. A forma reflexiva natural em português mantém a imagem de alguém que se abaixa e o paralelismo com a linha seguinte, sem decidir se o ato é voluntário ou imposto.
- source_word: אָדָם
  choice: o ser humano
  rationale: Aqui אָדָם tem sentido humano genérico e forma um paralelo com אִישׁ. “O ser humano” comunica esse alcance em português atual sem restringir o referente ao sexo masculino.
- source_word: וַיִּשְׁפַּל
  choice: é rebaixada
  rationale: שׁפל expressa tornar-se baixo, ser humilhado ou rebaixado. A formulação passiva conserva o resultado de humilhação e acompanha poeticamente “se curva”.
- source_word: אִישׁ
  choice: cada pessoa
  rationale: No paralelismo com אָדָם, אִישׁ focaliza o indivíduo. “Cada pessoa” preserva o valor distributivo e soa natural em português.
- source_word: וְאַל תִּשָּׂא לָהֶם
  choice: não os perdoes
  rationale: נשא pode significar levantar, carregar ou suportar e, em construções apropriadas, perdoar. No contexto de juízo contra idolatria e orgulho, “não os perdoes” é uma leitura contextual forte, enquanto a alternativa lexical permanece registrada em nota.
theological_decisions:
- issue: Sentido de נשא na cláusula final
  choice: Um apelo para que Deus não perdoe o povo
  alternative: Um apelo para que Deus não os levante ou exalte
  rationale: O contexto de juízo favorece a acepção de não perdoar, mas o verbo também admite a ideia de levantar. A tradução principal conserva a severidade do apelo, e a nota mantém aberta a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O paralelismo poético foi mantido em três linhas; “ser humano” e “cada pessoa” expressam, respectivamente, a humanidade em geral e o indivíduo.
