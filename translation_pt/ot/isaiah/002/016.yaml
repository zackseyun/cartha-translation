  text: וְ/עַ֖ל כָּל אֳנִיּ֣וֹת תַּרְשִׁ֑ישׁ וְ/עַ֖ל כָּל שְׂכִיּ֥וֹת הַ/חֶמְדָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/016.yaml
  text: and against all the ships of Tarshish[a], and against all the beautiful craft.
translation:
  language: pt
  text: e contra todos os navios de Társis, e contra todas as belas embarcações.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “todas as belas imagens” ou “todas as obras desejáveis”. O termo hebraico traduzido como “embarcações” é raro, e seu sentido exato é incerto; o contexto marítimo favorece uma tradução relacionada a navios ou embarcações finamente trabalhadas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: e contra
  rationale: No contexto de Isaías 2:12–16, עַל introduz os alvos do juízo do SENHOR. “Contra” comunica essa direção hostil, enquanto “e” preserva a repetição poética.
- source_word: כָּל
  choice: todos / todas
  rationale: Mantém o alcance abrangente e a repetição do hebraico, com a concordância de gênero exigida pelo português.
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: navios de Társis
  rationale: Reproduz de modo tradicional e formal a construção hebraica, sem decidir se são navios ligados ao lugar chamado Társis ou, por extensão, grandes navios mercantes de longa distância.
- source_word: שְׂכִיּוֹת
  choice: embarcações
  rationale: O substantivo é raro e seu sentido exato é incerto. O paralelismo marítimo com “navios de Társis” favorece uma referência a embarcações, mas a nota preserva outras possibilidades lexicais.
- source_word: הַחֶמְדָּה
  choice: belas
  rationale: Expressa a ideia de algo desejável, precioso ou atraente e forma, em português natural, uma descrição das embarcações.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com repetição de “e contra” para preservar a estrutura poética. “Társis” mantém a forma bíblica amplamente reconhecida; a ambiguidade do substantivo raro é explicitada em nota.
