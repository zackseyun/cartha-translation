  yaml_path: translation/ot/isaiah/002/008.yaml
  text: And his land is filled with idols; they bow down to the work of their hands[a], to what their fingers have made.
translation:
  language: pt
  text: E sua terra[a] está cheia de ídolos; eles se curvam diante da obra de suas mãos, diante do que seus dedos fizeram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «sua terra», com sufixo masculino singular, que retoma Jacó/Israel coletivamente, isto é, o povo ou a nação. Os sufixos em «suas mãos» e «seus dedos» também estão no singular no hebraico, embora «eles se curvam» esteja no plural.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּמָּלֵא
  choice: está cheia
  rationale: O nifal de מלא descreve um estado resultante ou passivo. O presente comunica naturalmente a descrição vívida da condição da terra no oráculo.
- source_word: אַרְצוֹ
  choice: a terra dele
  rationale: Mantém o sufixo masculino singular do hebraico, que retoma coletivamente Jacó/Israel. A formulação evita converter silenciosamente o referente em plural.
- source_word: אֱלִילִים
  choice: ídolos
  rationale: Equivalente corrente e claro; o termo hebraico pode carregar conotação depreciativa de inutilidade, mas não exige expansão no texto principal.
- source_word: לְמַעֲשֵׂה יָדָיו
  choice: diante da obra de suas mãos
  rationale: Com השתחוה, a preposição assinala aquilo perante o qual a pessoa se prostra. A expressão concreta preserva a ironia de prestar reverência ao que mãos humanas produziram.
- source_word: יִשְׁתַּחֲווּ
  choice: eles se curvam
  rationale: Preserva o gesto corporal de inclinação ou prostração sem substituir o verbo pelo conceito mais abstrato de adoração.
- source_word: לַאֲשֶׁר עָשׂוּ אֶצְבְּעֹתָיו
  choice: diante do que seus dedos fizeram
  rationale: Reproduz o paralelismo e a ênfase na fabricação humana. O possessivo português pode remeter coletivamente às pessoas expressas pelo verbo plural, sem acrescentar a ideia de 'próprios', ausente do hebraico.
theological_decisions:
- issue: Sentido do ato idólatra em השתחוה
  choice: eles se curvam
  alternative: eles adoram; eles se prostram
  rationale: A escolha conserva a imagem física do hebraico e permite que o sentido cultual e a condenação da idolatria surjam do contexto.
- issue: Alternância entre referente coletivo singular e ação plural
  choice: a terra dele ... eles se curvam ... suas mãos ... seus dedos
  alternative: a terra deles ... eles se curvam ... suas mãos ... seus dedos; a terra dele ... suas mãos ... seus dedos com referência estritamente singular
  rationale: O hebraico combina sufixos singulares, referentes ao povo como unidade coletiva, com verbo plural para a ação das pessoas. A tradução mantém essa tensão na referência à terra e usa construções portuguesas naturais nas expressões corporais.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “A terra dele” preserva deliberadamente o singular coletivo, embora seja menos fluido que “a terra deles”. A repetição de “diante de” explicita em português o objeto do ato de curvar-se e mantém o paralelismo.
