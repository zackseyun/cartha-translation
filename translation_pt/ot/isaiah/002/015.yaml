  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַ֖ל כָּל מִגְדָּ֣ל גָּבֹ֑הַ וְ/עַ֖ל כָּל חוֹמָ֥ה בְצוּרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/015.yaml
  text: and against every high tower[a], and against every fortified wall—
translation:
  language: pt
  text: e contra toda torre alta[a] e contra toda muralha fortificada —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sobre toda torre alta e sobre toda muralha fortificada”. A preposição hebraica pode ser traduzida mais literalmente como “sobre”, mas aqui tem o sentido de juízo dirigido contra esses objetos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: e contra
  rationale: A preposição עַל, repetida nesta lista, introduz os alvos do juízo divino implícito no contexto. “Contra” comunica naturalmente essa direção hostil em português; a alternativa mais literal “sobre” é registrada em nota.
- source_word: כָּל
  choice: toda
  rationale: Com substantivos singulares, כָּל tem sentido distributivo e é naturalmente traduzido por “toda”.
- source_word: מִגְדָּל
  choice: torre
  rationale: O substantivo designa genericamente uma torre ou estrutura elevada; “torre” evita especificar sem necessidade que se trate de uma torre de vigia.
- source_word: גָּבֹהַ
  choice: alta
  rationale: O adjetivo preserva o sentido físico de altura e também se ajusta ao tema maior da exaltação humana sem explicitar uma interpretação metafórica.
- source_word: חוֹמָה
  choice: muralha
  rationale: Neste paralelismo com torres e com o qualificativo defensivo בְצוּרָה, “muralha” expressa em português corrente uma parede defensiva melhor do que o termo genérico “parede”.
- source_word: בְצוּרָה
  choice: fortificada
  rationale: O adjetivo descreve algo tornado seguro ou protegido defensivamente; “fortificada” comunica com clareza o sentido militar.
theological_decisions:
- issue: Continuação implícita do juízo divino no contexto
  choice: 'Traduzir as expressões repetidas com עַל como alvos do juízo: “contra”.'
  alternative: Empregar o mais formal “sobre” e deixar que o contexto indique o sentido hostil.
  rationale: Isaías 2:12–16 enumera aquilo contra o qual vem o dia do SENHOR. “Contra” torna explícita em português a força contextual da preposição sem acrescentar um novo alvo ou agente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Muralha” conserva a imagem defensiva natural do contexto. O travessão final mantém a continuidade poética da enumeração.
