  text: בַּ/יּ֤וֹם הַ/הוּא֙ יַשְׁלִ֣יךְ הָ/אָדָ֔ם אֵ֚ת אֱלִילֵ֣י כַסְפּ֔/וֹ וְ/אֵ֖ת אֱלִילֵ֣י זְהָב֑/וֹ אֲשֶׁ֤ר עָֽשׂוּ ל/וֹ֙ לְ/הִֽשְׁתַּחֲוֺ֔ת לַ/חְפֹּ֥ר פֵּר֖וֹת וְ/לָ/עֲטַלֵּפִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/020.yaml
  text: In that day man will throw away his idols of silver and his idols of gold[a], which they made for him to bow down to[c][b], to the moles and to the bats.
translation:
  language: pt
  text: Naquele dia, o ser humano lançará fora seus ídolos de prata e seus ídolos de ouro, que fizeram para ele se prostrar diante deles, entregando-os às criaturas que escavam[a] e aos morcegos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica é incerta; talvez se refira a toupeiras ou a outras criaturas que vivem em buracos.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Fórmula temporal profética natural em português, preservando o tom solene do hebraico.
- source_word: יַשְׁלִיךְ
  choice: lançará fora
  rationale: Expressa tanto o ato de lançar quanto o sentido contextual de rejeitar e abandonar os ídolos.
- source_word: הָאָדָם
  choice: o ser humano
  rationale: Mantém o singular genérico e comunica claramente a referência representativa à humanidade em português atual.
- source_word: אֱלִילֵי כַסְפּוֹ וְאֵת אֱלִילֵי זְהָבוֹ
  choice: seus ídolos de prata e seus ídolos de ouro
  rationale: Preserva a repetição enfática do hebraico e a relação possessiva.
- source_word: אֲשֶׁר עָשׂוּ לוֹ
  choice: que fizeram para ele
  rationale: Conserva o verbo no plural, provavelmente referente aos artesãos, sem convertê-lo silenciosamente em passiva.
- source_word: לְהִשְׁתַּחֲוֺת
  choice: adorar
  rationale: No contexto dos ídolos, comunica naturalmente a finalidade religiosa da prostração; o objeto é recuperável pelo contexto.
- source_word: לַחְפֹּר פֵּרוֹת
  choice: aos animais que escavam
  rationale: A expressão hebraica é lexicalmente incerta; esta tradução conserva a ideia provável de criaturas escavadoras sem identificar uma espécie além da evidência.
- source_word: וְלָעֲטַלֵּפִים
  choice: e aos morcegos
  rationale: Equivalente lexical direto e seguro.
theological_decisions:
- issue: Força representativa de הָאָדָם
  choice: o ser humano, no singular genérico
  alternative: o homem; a humanidade; as pessoas
  rationale: A opção mantém a forma singular representativa do hebraico sem sugerir que apenas pessoas do sexo masculino estejam em vista.
- issue: Sentido cultual de לְהִשְׁתַּחֲוֺת
  choice: adorar
  alternative: prostrar-se diante deles
  rationale: O contexto idolátrico deixa claro que a prostração é um ato de culto. A tradução natural explicita esse valor sem acrescentar uma interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com cadência profética. A repetição de “seus ídolos” foi mantida por sua força retórica. A construção final foi levemente explicitada com “entregando-os” para deixar claro, em português, que os ídolos são lançados às criaturas mencionadas.
