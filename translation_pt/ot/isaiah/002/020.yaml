review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a fórmula temporal, o singular genérico de אָדָם, a repetição de «ídolos», o plural de «fizeram» e a incerteza quanto às criaturas escavadoras. Contudo, «para ele adorar» deixa implícito de modo pouco definido o objeto da adoração e substitui a imagem concreta de prostrar-se do hebraico.
  naturalness: O texto é em geral claro e de registro profético adequado. A revisão explicita, de modo natural, que os ídolos são o objeto da prostração e evita uma leitura sintaticamente solta de «que fizeram para ele adorar».
  terminology: «Ser humano» mantém bem o singular genérico em português contemporâneo. «Prostrar-se diante deles» conserva o sentido cultual e físico de לְהִשְׁתַּחֲוֺת sem impor interpretação adicional. «Criaturas que escavam», com nota, preserva prudentemente a incerteza de לַחְפֹּר פֵּרוֹת.
  issues:
  - severity: medium
    issue: «que fizeram para ele adorar» não explicita o objeto de «adorar» e atenua a imagem de prostração.
    rationale: O infinitivo hebraico significa literalmente prostrar-se/curvar-se em ato de culto, tendo os ídolos como objeto no contexto. A formulação revista torna essa relação explícita e conserva melhor a imagem verbal sem alterar o sentido.
  revised_text: Naquele dia, o ser humano lançará fora seus ídolos de prata e seus ídolos de ouro, que fizeram para ele se prostrar diante deles, entregando-os às criaturas que escavam[a] e aos morcegos.
  revised_footnotes:
