revisions:
- from: Naquele dia, o ser humano lançará fora seus ídolos de prata e seus ídolos de ouro, que fizeram para ele adorar, entregando-os aos animais que escavam[a] e aos morcegos.
  to: Naquele dia, o ser humano lançará fora seus ídolos de prata e seus ídolos de ouro, que fizeram para ele se prostrar diante deles, entregando-os às criaturas que escavam[a] e aos morcegos.
  rationale: Apenas a expressão da finalidade cultual foi ajustada. «Se prostrar diante deles» representa de forma mais próxima o hebraico e esclarece que os ídolos são o objeto do gesto. A nota sobre as criaturas escavadoras é mantida, pois a identificação exata do termo hebraico é incerta.
