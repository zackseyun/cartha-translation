  text: House of Jacob[a], come[b], and let us walk in the light of Yahweh.
translation:
  language: pt
  text: Casa de Jacó[a], venham[b], e caminhemos na luz de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ó casa de Jacó”. A expressão hebraica é uma forma de tratamento direto aos descendentes de Jacó.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “vão e caminhemos”. O hebraico emprega um imperativo seguido de um coortativo para exortar à ação conjunta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית יַעֲקֹב
  choice: Casa de Jacó
  rationale: A expressão construta funciona como vocativo dirigido aos descendentes de Jacó. “Casa de Jacó” preserva o idioma hebraico e o registro profético; a vírgula indica o valor vocativo sem acrescentar uma interjeição.
- source_word: לְכוּ
  choice: venham
  rationale: O imperativo plural de הלך integra uma fórmula de exortação seguida pelo coortativo וְנֵלְכָה. Nesse contexto, “venham” comunica naturalmente o convite à ação conjunta, embora o sentido mais literal “vão” também seja possível.
- source_word: וְנֵלְכָה
  choice: e caminhemos
  rationale: O coortativo na primeira pessoa do plural expressa exortação compartilhada. “Caminhemos” mantém tanto essa força quanto a metáfora bíblica, sem interpretá-la de modo redutor como simplesmente “vivamos”.
- source_word: בְּאוֹר
  choice: na luz
  rationale: A preposição ב pode indicar esfera ou meio. “Na luz” conserva essa abertura semântica e reproduz de modo natural a imagem de viver sob a iluminação e orientação divinas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O tetragrama é apresentado como nome pessoal, em vez de ser substituído por um título. “Yahweh” é uma transliteração portuguesa amplamente reconhecível.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz diretamente o tetragrama. A forma “Yahweh” preserva o nome pessoal e evita substituí-lo por um título, sem introduzir uma interpretação denominacional.
- issue: Sentido metafórico de caminhar na luz
  choice: caminhemos na luz
  alternative: vivamos segundo a orientação
  rationale: A formulação mantém a metáfora hebraica e sua amplitude teológica, sem restringi-la antecipadamente a uma única paráfrase ética ou doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O plural “venham” explicita que a convocação se dirige coletivamente à casa de Jacó; “caminhemos” preserva o tom inclusivo e solene da exortação profética.
