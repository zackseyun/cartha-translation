reference: Isaiah 2:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/תִּמָּלֵ֤א אַרְצ/וֹ֙ כֶּ֣סֶף וְ/זָהָ֔ב וְ/אֵ֥ין קֵ֖צֶה לְ/אֹצְרֹתָ֑י/ו וַ/תִּמָּלֵ֤א אַרְצ/וֹ֙ סוּסִ֔ים וְ/אֵ֥ין קֵ֖צֶה לְ/מַרְכְּבֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/007.yaml
  text: His land is filled with silver and gold[a], and there is no end to his treasures; his land is filled with horses[b], and there is no end to his chariots.
translation:
  language: pt
  text: Sua terra está cheia de prata e ouro[a], e não há fim para os seus tesouros; sua terra está cheia de cavalos, e não há fim para os seus carros de guerra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico emprega o singular em todo o versículo: “sua terra [...] seus tesouros [...] seus carros de guerra”. Esse singular provavelmente se refere coletivamente ao povo ou à nação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּמָּלֵא
  choice: está cheia
  rationale: Embora a forma narrativa possa ser vertida no passado, o contexto profético descreve a condição presente da terra; esta formulação preserva o sentido resultativo e soa natural em português.
- source_word: אַרְצוֹ
  choice: sua terra
  rationale: Mantém o sufixo hebraico masculino singular, provavelmente coletivo, sem o substituir interpretativamente pelo plural.
- source_word: כֶּסֶף וְזָהָב
  choice: prata e ouro
  rationale: Reproduz diretamente o par poético de metais preciosos e evita restringir כֶּסֶף ao sentido de dinheiro.
- source_word: וְאֵין קֵצֶה
  choice: e não há fim
  rationale: Expressão portuguesa natural e próxima da construção hebraica que indica ausência de limite.
- source_word: לְאֹצְרֹתָיו
  choice: para os seus tesouros
  rationale: אֹצָר pode designar tesouro, tesouraria ou depósito; junto de prata e ouro, o contexto favorece riquezas acumuladas.
- source_word: סוּסִים
  choice: cavalos
  rationale: Equivalente direto do substantivo plural hebraico.
- source_word: לְמַרְכְּבֹתָיו
  choice: para os seus carros de guerra
  rationale: No par cavalos-carros, מֶרְכָּבָה designa carros ligados ao poder militar; a explicitação evita que o leitor moderno entenda automóveis.
theological_decisions:
- issue: Manutenção dos possessivos singulares numa denúncia coletiva
  choice: sua terra ... seus tesouros ... seus carros de guerra
  alternative: a terra deles ... os tesouros deles ... os carros de guerra deles
  rationale: O hebraico repete sufixos masculinos singulares, provavelmente usando o singular coletivo para Jacó, o povo ou a nação. Preservar o singular mantém a ambiguidade referencial e evita uma harmonização interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com estrutura paralela próxima do hebraico. “Carros de guerra” comunica ao leitor atual o sentido antigo e militar de מַרְכָּבוֹת. A nota foi colocada após “ouro”, seguindo a primeira ocorrência relevante do possessivo singular.
