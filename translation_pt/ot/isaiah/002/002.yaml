id: ISA.2.2
reference: Isaiah 2:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָ֣ה בְּ/אַחֲרִ֣ית הַ/יָּמִ֗ים נָכ֨וֹן יִֽהְיֶ֜ה הַ֤ר בֵּית יְהוָה֙ בְּ/רֹ֣אשׁ הֶ/הָרִ֔ים וְ/נִשָּׂ֖א מִ/גְּבָע֑וֹת וְ/נָהֲר֥וּ אֵלָ֖י/ו כָּל הַ/גּוֹיִֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/002.yaml
  text: And in the latter days the mountain of the house of Yahweh shall be established as the highest of the mountains[a], and shall be lifted up above the hills[c][b]; and all the nations shall stream to it.
translation:
  language: pt
  text: E acontecerá, nos dias vindouros,[a] que o monte da casa de Yahweh será estabelecido como o mais elevado dos montes[b] e será elevado acima das colinas; e todas as nações afluirão a ele.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nos últimos dias” ou “nos dias que virão”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “será estabelecido no cume dos montes”.'
    reason: alternative_reading
  - marker: c
    text: O verbo hebraico retrata as nações fluindo para o monte como uma corrente de água.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: E acontecerá
  rationale: Introduz de modo natural uma cena profética futura, preservando a força prospectiva do hebraico.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: nos dias vindouros
  rationale: Expressa o horizonte futuro da fórmula profética sem impor necessariamente um esquema específico sobre os últimos dias.
- source_word: נָכוֹן יִהְיֶה
  choice: será estabelecido
  rationale: Comunica firmeza, estabilidade e estabelecimento seguro.
- source_word: הַר בֵּית יְהוָה
  choice: o monte da casa de Yahweh
  rationale: Reproduz com transparência a cadeia construta e mantém explícitos tanto o monte quanto a casa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: בְּרֹאשׁ הֶהָרִים
  choice: como o mais elevado dos montes
  rationale: No paralelismo com a elevação acima das colinas, comunica a proeminência do monte, embora a expressão também admita uma leitura espacial.
- source_word: וְנִשָּׂא מִגְּבָעוֹת
  choice: e se erguerá acima das colinas
  rationale: Preserva a imagem de elevação e a força comparativa da preposição hebraica em português natural.
- source_word: וְנָהֲרוּ
  choice: afluirão
  rationale: Mantém a metáfora incomum de povos fluindo como uma corrente em direção ao monte.
- source_word: אֵלָיו
  choice: a ele
  rationale: Retoma naturalmente o substantivo masculino 'monte' em português.
- source_word: כָּל הַגּוֹיִם
  choice: todas as nações
  rationale: Expressa o sentido amplo de povos nacionais sem a carga interpretativa mais específica de 'gentios'.
theological_decisions:
- issue: Alcance temporal de בְּאַחֲרִית הַיָּמִים
  choice: nos dias vindouros
  alternative: nos últimos dias; no fim dos dias
  rationale: A escolha preserva o caráter profético futuro e evita restringir a expressão, por si só, a um sistema escatológico determinado; as formulações mais literais são registradas em nota.
- issue: Sentido da exaltação do monte
  choice: será estabelecido como o mais elevado dos montes
  alternative: será estabelecido no cume dos montes
  rationale: O paralelismo favorece a ideia de proeminência, mas a possível leitura espacial do hebraico permanece explícita em nota.
- issue: Representação de יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto contém o nome divino pessoal; a transliteração o preserva sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a imagem poética e conserva em notas as ambiguidades temporal e espacial do hebraico.
