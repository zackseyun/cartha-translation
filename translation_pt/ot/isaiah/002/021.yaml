    issue: «diante do terror de Yahweh» para מִפְּנֵי פַּחַד יְהוָה
    rationale: A expressão hebraica descreve a retirada motivada pelo terror e pela majestade de Yahweh («de diante de» / «por causa de»). «Diante de» em português não exprime suficientemente esse movimento ou causa.
  - severity: low
    issue: Escopo incompleto da nota b
    rationale: A alternativa deve incluir «quando ele se levantar», que traduz בְּקוּמוֹ e faz parte da construção alternativa registrada no audit trail.
