  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/בוֹא֙ בְּ/נִקְר֣וֹת הַ/צֻּרִ֔ים וּ/בִ/סְעִפֵ֖י הַ/סְּלָעִ֑ים מִ/פְּנֵ֞י פַּ֤חַד יְהוָה֙ וּ/מֵ/הֲדַ֣ר גְּאוֹנ֔/וֹ בְּ/קוּמ֖/וֹ לַ/עֲרֹ֥ץ הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/021.yaml
  text: to enter the caverns of the rocks and the clefts of the crags[a], from before the terror of Yahweh and from the splendor of his majesty[b], when he rises to terrify the earth.
translation:
  language: pt
  text: para entrar nas cavernas das rochas e nas fendas dos penhascos[a], por causa do terror de Yahweh e do esplendor da sua majestade, quando ele se levantar para aterrorizar a terra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «nas cavidades das rochas e nas fissuras dos rochedos».
    reason: lexical_alternative
  - marker: b
    text: Ou «quando ele se levantar para fazer a terra tremer».
    reason: lexical_alternative
lexical_decisions:
- source_word: לָבוֹא
  choice: para entrar
  rationale: O infinitivo com ל continua a ação do contexto anterior e expressa o ingresso nos esconderijos rochosos; «entrar» é natural e direto.
- source_word: נִקְרוֹת הַצֻּרִים
  choice: cavernas das rochas
  rationale: נִקְרוֹת designa cavidades naturais em formações rochosas; «cavernas» comunica com clareza lugares adequados para refúgio.
- source_word: סְעִפֵי הַסְּלָעִים
  choice: fendas dos penhascos
  rationale: No contexto geológico, סְעִפֵי indica divisões ou fissuras, enquanto סְלָעִים evoca formações rochosas escarpadas; a tradução mantém o paralelismo sem repetir simplesmente «rochas».
- source_word: מִפְּנֵי
  choice: diante de
  rationale: Preserva a ideia espacial de estar perante a presença ameaçadora de Yahweh, ao mesmo tempo que o contexto comunica afastamento e fuga.
- source_word: פַּחַד
  choice: terror
  rationale: O substantivo indica pavor intenso provocado pela manifestação do juízo divino, mais forte que simples «medo».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הֲדַר גְּאוֹנוֹ
  choice: esplendor da sua majestade
  rationale: 'Mantém os dois elementos da expressão: הֲדַר como esplendor ou magnificência e גָּאוֹן, em referência a Deus, como majestade exaltada.'
- source_word: בְּקוּמוֹ
  choice: quando ele se levantar
  rationale: O infinitivo construto com בְּ tem valor temporal; a formulação portuguesa é natural e conserva a imagem de Yahweh levantando-se para agir.
- source_word: לַעֲרֹץ
  choice: para aterrorizar
  rationale: O verbo pode indicar causar terror e, por extensão, fazer tremer; a tradução principal retém a ligação lexical com פַּחַד, e a alternativa é registrada em nota.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: «Terra» mantém em português a possível amplitude entre o mundo habitado e uma região ou país, embora o contexto amplo de Isaías 2 favoreça o alcance universal.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico apresenta o nome próprio divino; «Yahweh» o preserva de modo transparente, sem substituí-lo pelo título tradicional.
- issue: Sentido de לַעֲרֹץ
  choice: aterrorizar a terra
  alternative: fazer a terra tremer
  rationale: As duas leituras refletem sentidos lexicais possíveis. A principal destaca o terror provocado pela intervenção divina, sem excluir em nota a imagem do tremor.
- issue: Alcance de הָאָרֶץ
  choice: a terra
  alternative: o país / a terra de Israel
  rationale: O contexto da humilhação universal da humanidade favorece o sentido mais amplo, mas o substantivo hebraico permite também referência territorial; a palavra portuguesa «terra» conserva parte dessa abertura.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe que preserva a continuidade do infinitivo hebraico em relação ao versículo anterior. «Penhascos» distingue סְלָעִים de צֻרִים sem tornar a imagem técnica demais; «diante de» conserva a dimensão da presença divina em מִפְּנֵי.
