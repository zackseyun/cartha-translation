  source_fidelity: 'A tradução preserva com precisão a estrutura paralela do hebraico: וְעַל é adequadamente entendido como “e contra” no catálogo de juízo; כָּל recebe “todos/todas”; הָרִים e גְּבָעוֹת permanecem distintamente “montes” e “colinas”; e os qualificadores “altos” e “elevadas” refletem, respectivamente, רָמִים e נִשָּׂאוֹת. Não força uma leitura metafórica de orgulho, embora conserve a ressonância contextual da elevação.'
