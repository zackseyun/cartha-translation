source:
  edition: WLC
  text: וְ/עַ֖ל כָּל הֶ/הָרִ֣ים הָ/רָמִ֑ים וְ/עַ֖ל כָּל הַ/גְּבָע֥וֹת הַ/נִּשָּׂאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/014.yaml
  text: and against all the high mountains[a], and against all the lofty hills.
translation:
  language: pt
  text: e contra todos os montes altos[a], e contra todas as colinas elevadas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos os montes elevados” e “todas as colinas altaneiras”.'
    reason: Alternativa lexical que reproduz com maior variedade a linguagem de elevação nos dois membros poéticos.
lexical_decisions:
- source_word: וְעַל
  choice: e contra
  rationale: No contexto da lista de alvos do juízo, עַל indica oposição ou ação dirigida contra algo, não mera posição espacial.
- source_word: כָּל
  choice: todos/todas
  rationale: O plural com artigo é vertido naturalmente pelo distributivo português, com concordância de gênero em cada membro paralelo.
- source_word: הֶהָרִים
  choice: montes
  rationale: Preserva a distinção topográfica em relação a גְּבָעוֹת e soa natural em linguagem bíblica portuguesa.
- source_word: הָרָמִים
  choice: altos
  rationale: Expressa diretamente a altura física indicada por רום, sem tornar explícita uma interpretação metafórica de orgulho.
- source_word: הַגְּבָעוֹת
  choice: colinas
  rationale: Distingue claramente as elevações menores dos montes mencionados no primeiro membro.
- source_word: הַנִּשָּׂאוֹת
  choice: elevadas
  rationale: Comunica o sentido passivo de algo erguido ou alçado e mantém, em português natural, o tema contextual do que está elevado.
theological_decisions:
- issue: Se os acidentes geográficos devem ser traduzidos de modo a destacar metaforicamente o orgulho humano
  choice: 'Manter a linguagem topográfica concreta: “montes altos” e “colinas elevadas”.'
  alternative: Empregar “montes altivos” e “colinas exaltadas” para acentuar a imagem do orgulho.
  rationale: O contexto mais amplo associa o que é elevado ao que será abatido, mas este versículo nomeia elementos concretos da paisagem. A tradução literal preserva a possível ressonância simbólica sem impô-la.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo preservado. “Montes” favorece ampla legibilidade brasileira e mantém a distinção de “colinas”; “elevadas” é natural sem eliminar a ressonância temática do hebraico.
