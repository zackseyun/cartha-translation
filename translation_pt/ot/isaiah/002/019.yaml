  text: וּ/בָ֨אוּ֙ בִּ/מְעָר֣וֹת צֻרִ֔ים וּ/בִ/מְחִלּ֖וֹת עָפָ֑ר מִ/פְּנֵ֞י פַּ֤חַד יְהוָה֙ וּ/מֵ/הֲדַ֣ר גְּאוֹנ֔/וֹ בְּ/קוּמ֖/וֹ לַ/עֲרֹ֥ץ הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/002/019.yaml
  text: And they will enter the caves of the rocks and the holes of the dust from before the terror of Yahweh and from the splendor of his majesty[a], when he rises to terrify the earth.
translation:
  language: pt
  text: E entrarão nas cavernas das rochas e nas cavidades do pó[a], diante do terror de Yahweh e do esplendor da sua majestade, quando ele se levantar para aterrorizar a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nos buracos do chão” ou “nas tocas no pó”.
    reason: Alternativas lexicais para מְחִלּוֹת עָפָר, expressão que pode indicar buracos, cavidades ou tocas subterrâneas no pó ou no solo.
lexical_decisions:
- source_word: וּבָאוּ
  choice: E entrarão
  rationale: O perfeito com waw tem valor sequencial e futuro no contexto profético; “entrarão” explicita naturalmente o movimento para dentro dos esconderijos regidos por בְּ.
- source_word: בִּמְעָרוֹת צֻרִים
  choice: nas cavernas das rochas
  rationale: Preserva מְעָרוֹת como “cavernas” e צֻרִים como “rochas”, mantendo a imagem concreta e o vínculo construtivo.
- source_word: וּבִמְחִלּוֹת עָפָר
  choice: e nas cavidades do pó
  rationale: מְחִלּוֹת indica cavidades, buracos ou esconderijos subterrâneos, e עָפָר significa literalmente “pó”. A formulação conserva a imagem incomum; alternativas naturais são registradas em nota.
- source_word: מִפְּנֵי
  choice: fugindo de
  rationale: A expressão significa literalmente “de diante da presença de”; no contexto, indica afastamento aterrorizado. “Fugindo de” comunica essa força direcional em português natural sem reduzi-la a mera causa.
- source_word: פַּחַד יְהוָה
  choice: do terror de Yahweh
  rationale: פַּחַד é o terror provocado pelo juízo divino, não temor reverencial; o nome יְהוָה é transliterado como “Yahweh”.
- source_word: וּמֵהֲדַר גְּאוֹנוֹ
  choice: e do esplendor da sua majestade
  rationale: 'Mantém os dois elementos de grandeza: הָדָר como “esplendor” e גָּאוֹן, neste referente divino, como “majestade”.'
- source_word: בְּקוּמוֹ
  choice: quando ele se levantar
  rationale: O infinitivo construto com בְּ exprime circunstância temporal; “quando ele se levantar” é claro e preserva a imagem de Yahweh erguendo-se para agir.
- source_word: לַעֲרֹץ
  choice: para aterrorizar
  rationale: O verbo expressa causar pavor ou tremor; “aterrorizar” se harmoniza com פַּחַד e mantém a intensidade do juízo.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: “A terra” conserva a possível amplitude global da expressão, sem restringi-la à terra de Israel.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança e segue a orientação fornecida, sem substituí-lo por um título.
- issue: Alcance de הָאָרֶץ
  choice: a terra
  alternative: o país; a terra de Israel
  rationale: O contexto permite uma cena ampla de juízo divino. “A terra” preserva essa amplitude, embora o substantivo hebraico também possa designar um território específico em outros contextos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva as imagens concretas e a repetição solene do hebraico, mas verte מִפְּנֵי de modo idiomático como “fugindo de”. O pronome “ele” permanece em minúscula conforme o uso corrente, com referente inequívoco em Yahweh.
