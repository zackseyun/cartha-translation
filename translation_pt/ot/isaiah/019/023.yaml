base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/023.yaml
  text: In that day there will be a highway from Egypt to Assyria[a], and Assyria will come into Egypt, and Egypt into Assyria[b]; and Egypt will serve with Assyria.
translation:
  language: pt
  text: Naquele dia, haverá uma estrada do Egito à Assíria. A Assíria entrará no Egito, e o Egito, na Assíria[a]; e o Egito prestará culto junto com a Assíria[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico omite o verbo na segunda cláusula: literalmente, «e o Egito na Assíria», isto é, «e o Egito entrará na Assíria».'
    reason: lexical_alternative
  - marker: b
    text: Ou, mais literalmente, «e o Egito servirá à Assíria». A sintaxe hebraica permite essa leitura, embora o contexto mais amplo favoreça a ideia de que o Egito se une à Assíria no culto a Deus.
    reason: alternative_reading
lexical_decisions:
- source_word: מְסִלָּה
  choice: estrada
  rationale: O termo designa uma via preparada, muitas vezes elevada. “Estrada” preserva a imagem de uma ligação aberta entre as nações e é mais natural e amplamente compreensível em português do que “via elevada”.
- source_word: מִמִּצְרַיִם אַשּׁוּרָה
  choice: do Egito até a Assíria
  rationale: As formas preposicionais indicam origem no Egito e direção à Assíria. “Até” exprime com naturalidade o percurso entre os dois países.
- source_word: וּבָא אַשּׁוּר בְּמִצְרַיִם
  choice: Os assírios entrarão no Egito
  rationale: בוא com ב indica movimento para dentro de um lugar. O plural gentílico torna natural em português a referência metonímica à população da Assíria.
- source_word: וּמִצְרַיִם בְּאַשּׁוּר
  choice: e os egípcios, na Assíria
  rationale: 'O verbo da oração anterior está elíptico e deve ser subentendido: os egípcios entrarão na Assíria. A elipse foi mantida para preservar o paralelismo conciso do hebraico.'
- source_word: וְעָבְדוּ
  choice: servirão
  rationale: עבד pode indicar serviço em sentido geral ou serviço religioso. “Servirão” conserva essa amplitude, sem restringir indevidamente o sentido a “adorarão”.
- source_word: מִצְרַיִם אֶת אַשּׁוּר
  choice: os egípcios servirão junto com os assírios
  rationale: Embora אֶת normalmente introduza o objeto direto, o contexto imediato de reconciliação e bênção conjunta favorece a compreensão de serviço compartilhado. A leitura sintaticamente mais direta foi preservada em nota.
theological_decisions:
- issue: Sentido de וְעָבְדוּ מִצְרַיִם אֶת אַשּׁוּר
  choice: os egípcios servirão junto com os assírios
  alternative: os egípcios servirão à Assíria
  rationale: A sintaxe superficial permite tomar a Assíria como objeto direto do serviço, mas os versículos seguintes apresentam Egito e Assíria lado a lado sob a bênção do SENHOR. O texto principal expressa o provável serviço conjunto sem especificar se é exclusivamente culto; a nota conserva a leitura formal alternativa e a tensão do hebraico.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Os gentílicos no plural evitam a personificação pouco natural dos países, enquanto a elipse e o paralelismo do hebraico são preservados. “Servirão” mantém aberta a dimensão geral ou cultual do verbo.
