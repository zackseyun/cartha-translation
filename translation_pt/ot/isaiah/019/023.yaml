revisions:
- from: Naquele dia, haverá uma estrada do Egito até a Assíria. Os assírios entrarão no Egito, e os egípcios, na Assíria[a]; e os egípcios servirão junto com os assírios[b].
  to: Naquele dia, haverá uma estrada do Egito à Assíria. A Assíria entrará no Egito, e o Egito, na Assíria[a]; e o Egito prestará culto junto com a Assíria[b].
  rationale: A revisão restaura os topônimos do hebraico e substitui a formulação vaga «servirão junto com» por «prestará culto junto com», que comunica com naturalidade o sentido contextual de serviço cultual compartilhado. Como a construção hebraica admite também uma leitura em que a Assíria é objeto direto, essa possibilidade é preservada em nota, sem ser apagada nem apresentada como sentido inequívoco.
