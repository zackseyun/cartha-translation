  text: אַךְ אֱוִלִים֙ שָׂ֣רֵי צֹ֔עַן חַכְמֵי֙ יֹעֲצֵ֣י פַרְעֹ֔ה עֵצָ֖ה נִבְעָרָ֑ה אֵ֚יךְ תֹּאמְר֣וּ אֶל פַּרְעֹ֔ה בֶּן חֲכָמִ֥ים אֲנִ֖י בֶּן מַלְכֵי קֶֽדֶם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/011.yaml
  text: Surely the princes of Zoan are fools[a]; the wise counselors of Pharaoh give foolish counsel. How can you say to Pharaoh, “I am a son of wise men[b], a son of ancient kings”?
translation:
  language: pt
  text: 'Na verdade, os líderes de Zoã são tolos; os sábios conselheiros do faraó dão conselhos insensatos[a]. Como vocês podem dizer ao faraó: “Sou filho de sábios,[b] filho de reis da antiguidade”?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o conselho é estúpido” ou “insensato”.
    reason: lexical_alternative
  - marker: b
    text: “Filho de sábios” e “filho de reis da antiguidade” são expressões de linhagem ou origem, não necessariamente de filiação imediata.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Na verdade
  rationale: A partícula tem aqui força enfática, não restritiva; “Na verdade” introduz com naturalidade a afirmação contundente.
- source_word: אֱוִלִים
  choice: tolos
  rationale: Mantém a avaliação direta e severa aplicada aos líderes de Zoã.
- source_word: שָׂרֵי צֹעַן
  choice: os líderes de Zoã
  rationale: שָׂרִים pode indicar príncipes, governantes ou altos oficiais; “líderes” comunica amplamente a função governante sem pressupor parentesco real.
- source_word: חַכְמֵי יֹעֲצֵי פַרְעֹה
  choice: os sábios conselheiros do faraó
  rationale: Preserva a caracterização dos conselheiros como reputadamente sábios, em contraste irônico com o conselho que dão.
- source_word: עֵצָה נִבְעָרָה
  choice: dão conselhos insensatos
  rationale: A expressão hebraica é condensada, literalmente algo como “conselho embrutecido/estúpido”; a formulação verbal é natural em português e conserva o sentido pejorativo.
- source_word: אֵיךְ תֹּאמְרוּ אֶל־פַּרְעֹה
  choice: Como vocês podem dizer ao faraó
  rationale: A pergunta expressa incredulidade e censura; “podem dizer” reproduz bem essa força retórica.
- source_word: בֶּן חֲכָמִים אֲנִי
  choice: Sou filho de sábios
  rationale: Mantém o idiomatismo hebraico e sua reivindicação de linhagem ou pertencimento, sem reduzi-lo silenciosamente a filiação imediata.
- source_word: בֶּן מַלְכֵי קֶדֶם
  choice: filho de reis da antiguidade
  rationale: קֶדֶם refere-se aqui aos tempos antigos; a tradução preserva a alegação de pedigree dinástico.
theological_decisions: []
translation_notes:
  register: Português atual, digno e de leitura ampla, com formas correntes no Brasil. “Líderes” evita o tom potencialmente arcaico de “príncipes”, enquanto “filho de” conserva deliberadamente o idioma de linhagem do hebraico. A repetição de “conselheiros” e “conselhos” reflete o jogo lexical do texto-fonte.
