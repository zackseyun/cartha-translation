  text: וְ/סִכְסַכְתִּ֤י מִצְרַ֨יִם֙ בְּ/מִצְרַ֔יִם וְ/נִלְחֲמ֥וּ אִישׁ בְּ/אָחִ֖י/ו וְ/אִ֣ישׁ בְּ/רֵעֵ֑/הוּ עִ֣יר בְּ/עִ֔יר מַמְלָכָ֖ה בְּ/מַמְלָכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/002.yaml
  text: I will stir up Egyptians against Egyptians[a], and each will fight against his brother, and each against his neighbor, city against city[b], kingdom against kingdom.
translation:
  language: pt
  text: Incitarei egípcios contra egípcios[a]. Eles lutarão, cada um contra seu irmão e cada um contra o seu próximo, cidade contra cidade, reino contra reino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “Egito contra Egito”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סִכְסַכְתִּי
  choice: Incitarei
  rationale: O verbo causativo expressa provocar hostilidade ou lançar uns contra os outros. “Incitarei” conserva essa ação divina de modo conciso e natural.
- source_word: מִצְרַיִם בְּמִצְרַיִם
  choice: egípcios contra egípcios
  rationale: Embora o hebraico repita literalmente o nome “Egito”, o verbo plural seguinte e a sequência do versículo mostram conflito interno entre os habitantes do país. A forma escolhida torna claro esse sentido coletivo.
- source_word: וְנִלְחֲמוּ
  choice: Eles lutarão
  rationale: Reproduz diretamente o verbo hebraico no plural; as expressões distributivas seguintes especificam os participantes.
- source_word: אִישׁ בְּאָחִיו וְאִישׁ בְּרֵעֵהוּ
  choice: cada um contra seu irmão e cada um contra o seu próximo
  rationale: “Cada um” comunica o uso distributivo de אִישׁ. “Irmão” preserva a imagem familiar, enquanto “próximo” amplia o conflito para as relações sociais.
- source_word: עִיר בְּעִיר
  choice: cidade contra cidade
  rationale: A formulação concisa preserva o paralelismo e a progressão do conflito individual para o âmbito urbano.
- source_word: מַמְלָכָה בְּמַמְלָכָה
  choice: reino contra reino
  rationale: “Reino” é o equivalente transparente de מַמְלָכָה e mantém a culminação política da sequência.
theological_decisions:
- issue: Sentido coletivo de מִצְרַיִם no contexto de conflito civil
  choice: egípcios contra egípcios
  alternative: Egito contra Egito
  rationale: O texto hebraico emprega o nome do país coletivamente, e a continuação descreve pessoas lutando entre si. A tradução explicita o referente humano sem alterar a afirmação de que Deus provoca o conflito.
- issue: Força distributiva de אִישׁ
  choice: cada um ... cada um
  alternative: um homem ... e um homem
  rationale: Neste paralelismo, אִישׁ distribui a ação entre indivíduos, sem destacar especificamente o sexo masculino. “Cada um” comunica essa função com naturalidade.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O paralelismo crescente — família, vizinhança, cidade e reino — foi mantido.
