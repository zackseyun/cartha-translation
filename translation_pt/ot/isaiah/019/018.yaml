  naturalness: O texto é claro, solene e natural em português contemporâneo. «Jurarão pelo SENHOR dos Exércitos» é igualmente natural e mais próximo do hebraico.
  terminology: «SENHOR dos Exércitos» é uma representação estabelecida e adequada de יהוה צבאות. A nota textual é útil e está corretamente ancorada no nome da cidade.
