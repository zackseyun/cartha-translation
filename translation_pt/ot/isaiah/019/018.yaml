  text: בַּ/יּ֣וֹם הַ/ה֡וּא יִהְיוּ֩ חָמֵ֨שׁ עָרִ֜ים בְּ/אֶ֣רֶץ מִצְרַ֗יִם מְדַבְּרוֹת֙ שְׂפַ֣ת כְּנַ֔עַן וְ/נִשְׁבָּע֖וֹת לַ/יהוָ֣ה צְבָא֑וֹת עִ֣יר הַ/הֶ֔רֶס יֵאָמֵ֖ר לְ/אֶחָֽת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/018.yaml
  text: In that day there will be five cities in the land of Egypt speaking the language of Canaan and swearing allegiance to the LORD of Armies. One of them will be called the City of Destruction.
translation:
  language: pt
  text: Naquele dia, haverá cinco cidades na terra do Egito que falarão a língua de Canaã e jurarão pelo SENHOR dos Exércitos. Uma será chamada Cidade da Destruição.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Outra leitura hebraica: Cidade do Sol. A Septuaginta traz Cidade da Justiça.'
    reason: 'Há uma variante textual antiga no nome da cidade: הֶרֶס, «destruição», em contraste com חֶרֶס, «sol»; a tradução grega antiga preserva ainda outra leitura.'
lexical_decisions:
- source_word: שְׂפַת כְּנַעַן
  choice: a língua de Canaã
  rationale: A expressão significa literalmente “lábio de Canaã”, um idioma para a língua falada; “língua” comunica isso com naturalidade em português.
- source_word: וְנִשְׁבָּעוֹת לַיהוָה
  choice: e jurarão fidelidade ao SENHOR
  rationale: O verbo denota prestar juramento, e a construção com לַיהוָה, neste contexto de adesão ao culto do SENHOR, permite expressar o compromisso como fidelidade. A alternativa mais estritamente formular, “jurarão pelo SENHOR”, permanece semanticamente possível.
- source_word: יְהוָה צְבָאוֹת
  choice: SENHOR dos Exércitos
  rationale: Mantém a convenção portuguesa de representar o nome divino por SENHOR e preserva o título צְבָאוֹת de modo reconhecível e digno.
- source_word: עִיר הַהֶרֶס
  choice: Cidade da Destruição
  rationale: Traduz o texto consonantal vocalizado da tradição massorética apresentada no WLC. A importante variante “Cidade do Sol” é registrada em nota.
theological_decisions:
- issue: Natureza do juramento prestado ao SENHOR
  choice: jurarão fidelidade ao SENHOR
  alternative: jurarão pelo SENHOR
  rationale: O contexto profético descreve cidades egípcias voltando-se ao SENHOR, o que favorece a ideia de compromisso de lealdade, sem excluir que a expressão também possa indicar juramentos feitos invocando o nome do SENHOR.
- issue: Nome da cidade
  choice: Cidade da Destruição
  alternative: Cidade do Sol
  rationale: A tradução principal segue a vocalização massorética do WLC, sem eliminar a variante textual antiga, que é teologicamente e exegeticamente relevante e por isso aparece em nota.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e vocabulário amplamente internacional. A ordem foi levemente naturalizada sem perder as relações do hebraico; o futuro mantém o caráter profético do enunciado.
