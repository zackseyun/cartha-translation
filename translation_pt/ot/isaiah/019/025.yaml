source:
  edition: WLC
  text: אֲשֶׁ֧ר בֵּרֲכ֛/וֹ יְהוָ֥ה צְבָא֖וֹת לֵ/אמֹ֑ר בָּר֨וּךְ עַמִּ֜/י מִצְרַ֗יִם וּ/מַעֲשֵׂ֤ה יָדַ/י֙ אַשּׁ֔וּר וְ/נַחֲלָתִ֖/י יִשְׂרָאֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/025.yaml
  text: whom Yahweh of Armies has blessed[a], saying, “Blessed be Egypt my people, and Assyria the work of my hands[b], and Israel my inheritance.”
translation:
  language: pt
  text: 'a quem Yahweh dos Exércitos[a] abençoou, dizendo: “Bendito seja o Egito, meu povo; a Assíria, obra das minhas mãos[b]; e Israel, minha herança.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “SENHOR dos Exércitos”.
    reason: lexical_alternative
  - marker: b
    text: As expressões “meu povo” e “obra das minhas mãos”, frequentemente associadas a Israel, são aqui aplicadas também ao Egito e à Assíria.
    reason: cross_reference
lexical_decisions:
- source_word: אֲשֶׁר
  choice: a quem
  rationale: Introduz uma oração relativa que retoma o conjunto de povos do versículo anterior; “a quem” preserva a referência pessoal e coletiva.
- source_word: בֵּרֲכוֹ
  choice: abençoou
  rationale: O perfeito hebraico expressa a ação divina de abençoar; o pretérito perfeito liga-se naturalmente ao contexto em português sem acrescentar aspecto não explícito.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino e traduz צְבָאוֹת de modo transparente e corrente, preservando a forma do título.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Forma portuguesa natural para introduzir discurso direto e correspondente ao infinitivo hebraico.
- source_word: בָּרוּךְ
  choice: Bendito seja
  rationale: Preserva a força formular e beneditória do predicativo hebraico.
- source_word: עַמִּי מִצְרַיִם
  choice: o Egito, meu povo
  rationale: Conserva a aposição direta e surpreendente que aplica ao Egito a designação “meu povo”.
- source_word: וּמַעֲשֵׂה יָדַי אַשּׁוּר
  choice: a Assíria, obra das minhas mãos
  rationale: Reproduz a relação apositiva com ordem natural em português e mantém a designação divina aplicada à Assíria.
- source_word: וְנַחֲלָתִי יִשְׂרָאֵל
  choice: e Israel, minha herança
  rationale: “Herança” traduz diretamente נַחֲלָה e conserva sua ressonância de posse atribuída por Deus.
theological_decisions:
- issue: Título divino יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  alternative: SENHOR dos Exércitos; SENHOR dos exércitos celestiais
  rationale: O texto hebraico emprega o nome próprio divino, que é preservado como “Yahweh”; “dos Exércitos” mantém o sentido do título sem restringir interpretativamente quais exércitos estão em vista.
- issue: Designações associadas à aliança aplicadas ao Egito e à Assíria
  choice: Preservar literalmente “Egito, meu povo” e “Assíria, obra das minhas mãos”
  alternative: Paráfrases como “o Egito, que se tornou meu povo”
  rationale: O hebraico faz afirmações apositivas diretas. A tradução mantém a surpresa e a tensão teológica sem introduzir explicações temporais ou doutrinárias.
- issue: Alcance do sufixo singular em בֵּרֲכוֹ
  choice: “a quem ... abençoou”, retomando coletivamente a tríade anterior
  alternative: “que ... abençoou” ou explicitar “aos quais ... abençoou”
  rationale: O singular hebraico pode retomar coletivamente a unidade formada por Egito, Assíria e Israel. “A quem” conserva a forma sem forçar uma concordância plural explicativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com pontuação que evidencia as três aposições paralelas. O artigo definido diante dos nomes dos países segue o uso brasileiro corrente; o nome divino “Yahweh” é mantido por fidelidade ao hebraico.
