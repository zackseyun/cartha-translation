base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/014.yaml
  text: Yahweh has mixed within her a spirit of confusion[a], and they have led Egypt astray in all its work[b], as a drunkard staggers in his vomit.
translation:
  language: pt
  text: Yahweh misturou, no meio dela, um espírito de confusão[a], e eles fizeram o Egito se desviar em tudo o que faz[b], como um bêbado cambaleia no próprio vômito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um espírito de distorção”, “um espírito de perversidade” ou “um espírito de vertigem”. A expressão hebraica indica uma influência enviada em juízo, que desorienta e distorce.
    reason: lexical_alternative
  - marker: b
    text: 'O verbo hebraico está no plural: “eles fizeram o Egito se desviar”. O sujeito não é identificado de modo explícito; pode referir-se às influências de confusão ou aos líderes do Egito sob essa influência.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino pessoal representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: מָסַךְ
  choice: misturou
  rationale: Preserva a imagem concreta de misturar ou mesclar, empregada aqui metaforicamente para a ação de Yahweh no meio do Egito.
- source_word: בְּקִרְבָּהּ
  choice: no meio dela
  rationale: Conserva o sufixo feminino hebraico, que trata o Egito como terra ou nação personificada.
- source_word: רוּחַ עִוְעִים
  choice: um espírito de confusão
  rationale: Expressa uma influência desorientadora e retorcedora sem limitar o termo a uma única nuance moral ou física.
- source_word: וְהִתְעוּ
  choice: e eles fizeram ... se desviar
  rationale: Preserva tanto o sentido causativo do verbo quanto sua forma plural, embora o sujeito não esteja explicitamente identificado.
- source_word: בְּכָל מַעֲשֵׂהוּ
  choice: em tudo o que faz
  rationale: Comunica de modo natural a totalidade das atividades e iniciativas do Egito, entendido coletivamente.
- source_word: כְּהִתָּעוֹת שִׁכּוֹר
  choice: como um bêbado cambaleia
  rationale: Torna idiomaticamente a comparação com o movimento errático de uma pessoa embriagada.
- source_word: בְּקִיאוֹ
  choice: no próprio vômito
  rationale: Mantém sem suavização a imagem gráfica de humilhação e desorientação presente no hebraico.
theological_decisions:
- issue: A ação divina no juízo por meio do “espírito de confusão”
  choice: A tradução atribui diretamente a Yahweh a ação de misturar esse espírito no meio do Egito.
  alternative: Yahweh apenas permitiu que surgisse confusão no Egito.
  rationale: O hebraico apresenta Yahweh como sujeito ativo de מָסַךְ; a tradução conserva essa agência sem definir além do texto a relação entre causalidade e permissão.
- issue: O referente do verbo plural וְהִתְעוּ
  choice: A forma plural é preservada em “eles fizeram o Egito se desviar”.
  alternative: “Esse espírito fez o Egito se desviar” ou “o Egito foi desviado”.
  rationale: O texto massorético emprega um verbo na terceira pessoa do plural, mas não identifica de modo inequívoco o sujeito. A formulação mantém essa tensão, que pode apontar para influências de confusão ou para os líderes do Egito sob tal influência.
translation_notes:
  register: Português atual, digno e de leitura ampla, com construção direta. A personificação feminina do Egito foi mantida em “dela”; o plural ambíguo do verbo seguinte também foi preservado. A imagem forte do vômito não foi atenuada.
