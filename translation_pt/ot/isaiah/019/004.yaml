source:
  edition: WLC
  text: וְ/סִכַּרְתִּי֙ אֶת מִצְרַ֔יִם בְּ/יַ֖ד אֲדֹנִ֣ים קָשֶׁ֑ה וּ/מֶ֤לֶךְ עַז֙ יִמְשָׁל בָּ֔/ם נְאֻ֥ם הָ/אָד֖וֹן יְהוָ֥ה צְבָאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/004.yaml
  text: I will give Egypt into the hand of a harsh master[a], and a fierce king will rule over them, declares the Lord[c][b], Yahweh of Armies.
translation:
  language: pt
  text: Entregarei o Egito nas mãos de um senhor severo[a][b], e um rei feroz governará sobre eles — declaração do Senhor[c], Yahweh dos Exércitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Entregarei o Egito ao poder de um senhor severo”.'
    reason: lexical_alternative
  - marker: b
    text: O substantivo hebraico traduzido por “senhor” tem forma morfologicamente plural (“senhores”), mas provavelmente funciona aqui como singular de intensidade ou majestade, conforme indicam o adjetivo singular e a referência seguinte a um único rei.
    reason: lexical_alternative
  - marker: c
    text: 'Tradução tradicional: “o Senhor DEUS dos Exércitos”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְסִכַּרְתִּי
  choice: Entregarei
  rationale: O verbo expressa a entrega do Egito ao domínio de outro. “Entregarei” comunica esse sentido causativo de modo natural e direto.
- source_word: בְּיַד
  choice: nas mãos de
  rationale: A expressão hebraica, literalmente “na mão de”, é um modo corrente de indicar submissão ao poder ou controle de alguém. O plural idiomático em português mantém a imagem com naturalidade.
- source_word: אֲדֹנִים קָשֶׁה
  choice: um senhor cruel
  rationale: Embora אֲדֹנִים tenha forma plural, o adjetivo singular e a referência subsequente a “um rei” favorecem sentido singular intensivo ou majestático. “Senhor” indica aqui um governante humano, e “cruel” expressa a severidade opressora de קָשֶׁה no contexto de juízo.
- source_word: וּמֶלֶךְ עַז
  choice: e um rei feroz
  rationale: עַז pode significar forte, poderoso ou feroz. Em paralelo com o governante cruel, “feroz” comunica melhor a dureza opressora prevista no contexto.
- source_word: יִמְשָׁל בָּם
  choice: governará sobre eles
  rationale: A tradução reproduz diretamente o sentido político de משל com ב. O pronome plural do hebraico é preservado, entendendo-se os egípcios representados pelo nome coletivo “Egito”.
- source_word: נְאֻם
  choice: declaração
  rationale: Na fórmula profética, “declaração do” transmite com dignidade a ideia de pronunciamento solene e autorizado.
- source_word: הָאָדוֹן
  choice: o Senhor
  rationale: O título divino com artigo é traduzido naturalmente como “o Senhor” e permanece distinto do nome próprio Yahweh que vem em seguida.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino do texto hebraico em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: “Exércitos” torna transparente o sentido militar básico do termo e integra a forma tradicionalmente reconhecível do título divino.
theological_decisions:
- issue: Tradução da sequência divina הָאָדוֹן יְהוָה צְבָאוֹת
  choice: o Senhor, Yahweh dos Exércitos
  alternative: o Senhor DEUS dos Exércitos; o Soberano SENHOR dos Exércitos
  rationale: A formulação distingue o título הָאָדוֹן do nome pessoal יְהוָה, sem ocultar o Tetragrama sob outro título.
- issue: Número de אֲדֹנִים na referência ao governante humano
  choice: um senhor cruel
  alternative: senhores cruéis
  rationale: A forma nominal é morfologicamente plural, mas o adjetivo קָשֶׁה está no singular, e a oração paralela menciona um “rei” com verbo singular. O singular contextual é preferível, mantendo-se a forma hebraica em nota.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. “Nas mãos de” preserva a imagem hebraica em forma idiomática; “declaração do Senhor” mantém o tom profético formal. O plural “eles” foi conservado para refletir o hebraico e aponta aos habitantes do Egito.
