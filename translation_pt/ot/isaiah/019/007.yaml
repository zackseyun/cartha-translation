  source_fidelity: 'A tradução preserva adequadamente a estrutura e o sentido do hebraico: os elementos ribeirinhos e agrícolas ligados ao Nilo secam, são dispersos/levados e desaparecem. “Juncos” é uma escolha plausível para o termo incerto עָרוֹת, devidamente qualificada em nota. A repetição de “Nilo” reproduz a ênfase do texto. “Serão levados pelo vento” explicita de modo natural a imagem passiva de נִדַּף (“ser levado/soprado para longe”) sem alterar substancialmente o sentido.'
