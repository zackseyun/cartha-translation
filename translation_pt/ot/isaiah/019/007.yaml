id: ISA.19.7
reference: Isaiah 19:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עָר֥וֹת עַל יְא֖וֹר עַל פִּ֣י יְא֑וֹר וְ/כֹל֙ מִזְרַ֣ע יְא֔וֹר יִיבַ֥שׁ נִדַּ֖ף וְ/אֵינֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/007.yaml
  text: The reeds along the Nile[a], along the bank of the Nile, and every sown field of the Nile will dry up, be driven away[c][b], and be no more.
translation:
  language: pt
  text: Os juncos[a] junto ao Nilo[b], ao longo da margem do Nilo, e tudo o que é semeado junto ao Nilo[c] secarão, serão levados pelo vento e deixarão de existir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os campos descobertos”, “os prados” ou “as plantas”. O sentido do termo hebraico עָרוֹת neste contexto é incerto.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico יְאֹר pode significar “rio” ou “canal”; neste contexto egípcio, refere-se ao Nilo e ao seu sistema de canais.
    reason: cultural_note
  - marker: c
    text: Ou “todos os campos semeados junto ao Nilo” ou “toda semente do Nilo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוֹת
  choice: os juncos
  rationale: O termo é raro e incerto neste contexto. A referência à vegetação ribeirinha se ajusta ao paralelismo e ao cenário da seca do Nilo; “juncos” comunica essa imagem de forma clara, enquanto a nota preserva as alternativas.
- source_word: יְאֹר
  choice: o Nilo
  rationale: No oráculo a respeito do Egito, o termo designa o Nilo ou seu sistema de canais. “Nilo” explicita naturalmente o referente geográfico.
- source_word: עַל פִּי יְאֹר
  choice: ao longo da margem do Nilo
  rationale: Embora פֶּה signifique literalmente “boca”, nesta expressão espacial indica a borda ou margem de um curso de água.
- source_word: מִזְרַע יְאֹר
  choice: tudo o que é semeado junto ao Nilo
  rationale: A expressão pode designar a semente, a semeadura ou o produto cultivado associado ao Nilo. Esta formulação mantém a amplitude do coletivo sem restringi-lo indevidamente a campos ou colheitas.
- source_word: יִיבַשׁ
  choice: secarão
  rationale: O verbo exprime tornar-se seco e se encaixa tanto na vegetação ribeirinha quanto no que foi semeado.
- source_word: נִדַּף
  choice: serão levados pelo vento
  rationale: A forma passiva descreve algo impelido, disperso ou soprado para longe. A menção do vento torna natural em português a imagem de vegetação ressequida sendo carregada.
- source_word: וְאֵינֶנּוּ
  choice: deixarão de existir
  rationale: O idioma hebraico expressa desaparecimento ou inexistência, com forte sentido de finalidade.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição de “Nilo” conserva a ênfase e a estrutura do hebraico. O plural verbal trata os elementos coordenados como um conjunto, e as notas preservam as principais incertezas lexicais.
