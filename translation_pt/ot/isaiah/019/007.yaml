  terminology: “Nilo”, “margem”, “juncos” e “tudo o que é semeado” são escolhas compreensíveis e contextualmente adequadas. As notas explicam com prudência as incertezas de עָרוֹת e מִזְרַע, bem como o uso egípcio de יְאֹר. Não há imposição teológica ou interpretativa indevida.
