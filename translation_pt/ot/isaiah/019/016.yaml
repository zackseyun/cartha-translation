  text: בַּ/יּ֣וֹם הַ/ה֔וּא יִֽהְיֶ֥ה מִצְרַ֖יִם כַּ/נָּשִׁ֑ים וְ/חָרַ֣ד וּ/פָחַ֗ד מִ/פְּנֵי֙ תְּנוּפַת֙ יַד יְהוָ֣ה צְבָא֔וֹת אֲשֶׁר ה֖וּא מֵנִ֥יף עָלָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/016.yaml
  text: In that day Egypt will be like women[a], trembling and afraid because of the waving of the hand of Yahweh of Armies[c][b], which he waves against it.
translation:
  language: pt
  text: 'Naquele dia, o Egito será como as mulheres[a]: tremerá e terá medo por causa do brandir da mão de Yahweh dos Exércitos[b], a qual ele brande contra o Egito[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A comparação «como as mulheres» reflete uma imagem bélica do mundo antigo, que associava as mulheres à vulnerabilidade e ao medo; o hebraico diz explicitamente «mulheres».
    reason: cultural_note
  - marker: b
    text: 'Ou: «o SENHOR dos Exércitos».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «o agitar da mão».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Preserva a fórmula temporal profética em português natural e solene.
- source_word: מִצְרַיִם
  choice: o Egito
  rationale: Refere-se à nação como uma unidade coletiva; a repetição do nome no fim evita ambiguidade pronominal.
- source_word: כַּנָּשִׁים
  choice: como as mulheres
  rationale: O hebraico diz explicitamente «mulheres». A tradução preserva a comparação culturalmente marcada, explicando seu contexto em nota.
- source_word: וְחָרַד וּפָחַד
  choice: tremerá e ficará apavorado
  rationale: Mantém os dois verbos que intensificam a reação de medo, com formulação corrente em português.
- source_word: מִפְּנֵי
  choice: por causa de
  rationale: Expressa com clareza o valor causal da preposição neste contexto.
- source_word: תְּנוּפַת יַד
  choice: o agitar da mão
  rationale: Conserva a imagem concreta e a repetição da raiz נוף no verbo seguinte; a nota registra uma alternativa mais interpretativa.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Preserva o nome divino e traduz צְבָאוֹת de modo transparente, adequado ao contexto de juízo.
- source_word: אֲשֶׁר הוּא מֵנִיף עָלָיו
  choice: que ele agita contra o Egito
  rationale: Retoma a imagem do gesto da mão e entende עָלָיו em sentido hostil. A repetição de «Egito» esclarece o referente.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o Tetragrama; a forma «Yahweh» preserva o nome da aliança em vez de substituí-lo por um título.
- issue: Tradução de צְבָאוֹת
  choice: dos Exércitos
  alternative: dos Exércitos celestiais
  rationale: «Dos Exércitos» mantém a amplitude do título hebraico e sua força marcial sem especificar indevidamente quais exércitos estão em vista.
- issue: Comparação כַּנָּשִׁים
  choice: como as mulheres
  alternative: como pessoas indefesas
  rationale: A formulação de gênero pertence ao próprio texto e à sua imagem bélica antiga; não deve ser neutralizada no corpo da tradução.
translation_notes:
  register: Português contemporâneo, claro e digno, com ampla legibilidade brasileira. A cadência profética foi preservada; a comparação antiga foi mantida sem suavização e acompanhada de esclarecimento cultural. A repetição de «agitar» reproduz deliberadamente a repetição da raiz hebraica.
