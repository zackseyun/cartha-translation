  text: And the waters of the sea will dry up[b][a], and the river will be parched and dry.
translation:
  language: pt
  text: As águas do mar secarão[a], e o rio[b] ficará ressequido e seco.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «as águas serão esgotadas do mar». O verbo hebraico pode indicar que as águas são exauridas ou secam.'
    reason: lexical_alternative
  - marker: b
    text: Neste contexto, «o rio» provavelmente se refere ao Nilo, embora o texto hebraico use o substantivo comum, e não o nome próprio.
    reason: cultural_note
lexical_decisions:
- source_word: נִשְּׁתוּ
  choice: secarão
  rationale: O nifal, neste contexto, descreve as águas sendo exauridas ou secando. «Secarão» comunica o resultado de modo natural e preserva a imagem do juízo sobre as águas do Egito.
- source_word: מַיִם
  choice: as águas
  rationale: Mantém o plural hebraico e é uma expressão natural em português para as águas de uma massa ou fonte hídrica.
- source_word: מֵהַיָּם
  choice: do mar
  rationale: Embora a preposição hebraica seja literalmente «de/desde», «as águas do mar» expressa com naturalidade a relação de origem sem substituir o substantivo comum «mar» por uma identificação interpretativa.
- source_word: נָהָר
  choice: o rio
  rationale: O contexto egípcio aponta para o Nilo, mas o hebraico emprega o substantivo comum «rio», não o nome próprio. O artigo em português torna a referência contextual definida e natural.
- source_word: יֶחֱרַב
  choice: ficará ressequido
  rationale: O verbo indica tornar-se árido ou seco. «Ressequido» preserva uma nuance distinta antes de «seco» e reproduz a força do par verbal hebraico.
- source_word: יָבֵשׁ
  choice: seco
  rationale: Em combinação com o verbo anterior, intensifica o estado de completa secura; a formulação compacta mantém o paralelismo do hebraico.
