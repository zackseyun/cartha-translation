source:
  edition: WLC
  text: וְ/הֶאֶזְנִ֣יחוּ נְהָר֔וֹת דָּלֲל֥וּ וְ/חָרְב֖וּ יְאֹרֵ֣י מָצ֑וֹר קָנֶ֥ה וָ/ס֖וּף קָמֵֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/006.yaml
  text: The rivers will stink[a]; the canals of Egypt will dwindle and dry up[c][b]; reed and rush will wither.
translation:
  language: pt
  text: Os rios ficarão fétidos[a]; os canais do Egito[b] diminuirão e secarão; o caniço e o junco[c] murcharão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se tornarão pútridos”. O verbo hebraico é raro e indica que as águas ficam malcheirosas ou corrompidas.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “os canais de Matzor”; aqui, “Matzor” é mais bem entendido como um nome poético do Egito.'
    reason: lexical_alternative
  - marker: c
    text: O termo hebraico também pode ser traduzido por “papiro” e designa vegetação palustre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶאֶזְנִיחוּ
  choice: ficarão fétidos
  rationale: O verbo hebraico raro, neste contexto aplicado às águas, indica que elas se tornam malcheirosas ou pútridas. “Ficarão fétidos” preserva a imagem forte em português natural e digno.
- source_word: נְהָרוֹת
  choice: os rios
  rationale: Equivalente direto do plural hebraico para rios ou cursos de água, distinguindo-o dos canais mencionados em seguida.
- source_word: דָּלֲלוּ
  choice: diminuirão
  rationale: O verbo comunica redução ou queda do volume das águas. “Diminuirão” é claro e evita especificar indevidamente se a redução é de nível, vazão ou extensão.
- source_word: וְחָרְבוּ
  choice: e secarão
  rationale: Com cursos de água como sujeito, o verbo denota tornar-se seco ou secar; a forma ativa é idiomática em português.
- source_word: יְאֹרֵי
  choice: os canais
  rationale: Em contexto egípcio, o termo se refere especialmente a braços ou canais ligados ao Nilo. “Canais” transmite essa especificidade sem inserir “Nilo”, que não aparece explicitamente.
- source_word: מָצוֹר
  choice: do Egito
  rationale: Aqui o termo é mais bem entendido como designação poética ou rara do Egito. A nota preserva a forma hebraica como alternativa.
- source_word: קָנֶה
  choice: o junco
  rationale: Designa uma planta semelhante a cana que cresce junto às águas; “junco” é corrente e apropriado ao cenário ribeirinho.
- source_word: וָסוּף
  choice: a vegetação dos pântanos
  rationale: O termo designa vegetação aquática ou palustre, podendo referir-se a juncos, caniços ou papiro. A expressão abrangente preserva a incerteza botânica e distingue o vocábulo do anterior.
- source_word: קָמֵלוּ
  choice: murcharão
  rationale: O verbo descreve plantas que murcham ou definham, oferecendo uma correspondência natural e evitando repetir “secarão”.
