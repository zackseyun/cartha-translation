translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação mantém o paralelismo entre a deterioração das águas e o murchamento da vegetação, sem determinar além do hebraico a espécie indicada por סוּף.
