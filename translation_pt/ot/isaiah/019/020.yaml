id: ISA.19.20
reference: Isaiah 19:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָ֨ה לְ/א֥וֹת וּ/לְ/עֵ֛ד לַֽ/יהוָ֥ה צְבָא֖וֹת בְּ/אֶ֣רֶץ מִצְרָ֑יִם כִּֽי יִצְעֲק֤וּ אֶל יְהוָה֙ מִ/פְּנֵ֣י לֹֽחֲצִ֔ים וְ/יִשְׁלַ֥ח לָ/הֶ֛ם מוֹשִׁ֥יעַ וָ/רָ֖ב וְ/הִצִּילָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/020.yaml
  text: It will be for a sign and for a witness to Yahweh of Armies in the land of Egypt. For they will cry out to Yahweh because of oppressors[a], and he will send them a savior and champion, and he will deliver them.
translation:
  language: pt
  text: Isso servirá de sinal e de testemunho para Yahweh dos Exércitos na terra do Egito. Pois eles clamarão a Yahweh por causa dos opressores, e ele lhes enviará um salvador e defensor[a] e os livrará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “um salvador e um grande [homem]”. O termo hebraico traduzido por “defensor” é difícil; também pode ser entendido como “campeão”.'
    reason: Preserva a incerteza lexical de וָרָב, indicando a alternativa mais literal de maneira compreensível em português e a leitura funcional possível.
lexical_decisions:
- source_word: וְהָיָה
  choice: Isso servirá
  rationale: O verbo introduz o resultado futuro do altar e do monumento mencionados no contexto anterior. O pronome demonstrativo retoma naturalmente esse conjunto em português.
- source_word: לְאוֹת וּלְעֵד
  choice: de sinal e de testemunho
  rationale: Preserva os dois substantivos hebraicos e expressa com naturalidade a função indicada pela preposição לְ após “servirá”.
- source_word: לַיהוָה צְבָאוֹת
  choice: para Yahweh dos Exércitos
  rationale: Mantém o nome divino e traduz צְבָאוֹת de modo transparente, conservando a ideia de forças organizadas sob o comando de Yahweh.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: na terra do Egito
  rationale: Reproduz a expressão geográfica plena do hebraico.
- source_word: כִּי יִצְעֲקוּ אֶל יְהוָה
  choice: Pois eles clamarão a Yahweh
  rationale: כִּי introduz a explicação, e צעק comunica um clamor urgente em situação de aflição.
- source_word: מִפְּנֵי לֹחֲצִים
  choice: por causa dos opressores
  rationale: A expressão preposicional indica a causa do clamor, e o particípio substantivado designa aqueles que os oprimem.
- source_word: מוֹשִׁיעַ
  choice: um salvador
  rationale: O particípio causativo de ישׁע designa aquele que salva ou liberta; “salvador” mantém a ligação lexical e temática com o livramento subsequente.
- source_word: וָרָב
  choice: e defensor
  rationale: O termo é difícil neste contexto. “Defensor” expressa a provável função de alguém que toma a causa dos oprimidos, sem ocultar na nota a alternativa mais literal ligada à grandeza.
- source_word: וְהִצִּילָם
  choice: e os livrará
  rationale: O hifil de נצל indica resgatar ou livrar. A coordenação mantém a sequência verbal explícita do hebraico.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o tetragrama. “Yahweh” representa o nome próprio, em vez de substituí-lo por um título.
- issue: Sentido de צְבָאוֹת no título divino
  choice: dos Exércitos
  alternative: dos exércitos; dos Poderes; dos Hóspedes
  rationale: “Exércitos” comunica em português atual o sentido básico do substantivo e evita a opacidade de uma fórmula tradicional pouco compreensível.
- issue: Identidade do salvador e defensor
  choice: não especificada além do agente enviado por Yahweh
  alternative: identificá-lo com uma figura histórica ou messiânica determinada
  rationale: O versículo afirma que Yahweh enviará essa pessoa, mas não a identifica; a tradução preserva essa abertura interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Isso servirá” retoma o altar e o monumento do contexto, enquanto “clamarão”, “salvador” e “livrará” preservam um registro bíblico corrente sem arcaísmo excessivo.
