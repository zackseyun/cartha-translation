  text: וּ/בֹ֛שׁוּ עֹבְדֵ֥י פִשְׁתִּ֖ים שְׂרִיק֑וֹת וְ/אֹרְגִ֖ים חוֹרָֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/009.yaml
  text: Those who work with combed flax will be ashamed[b][a], and those who weave white cloth.
translation:
  language: pt
  text: Os que trabalham com linho penteado[a] ficarão envergonhados, e também os que tecem tecido branco[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “linho fino”. O termo hebraico provavelmente se refere a linho de alta qualidade especialmente preparado.
    reason: lexical_alternative
  - marker: b
    text: Ou “linho branco” ou “tecido branqueado”. O termo hebraico é raro e seu sentido exato é incerto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֹשׁוּ
  choice: ficarão envergonhados
  rationale: Preserva o sentido direto de בוש, que neste contexto de ruína econômica indica vergonha ou humilhação decorrente do fracasso.
- source_word: עֹבְדֵי
  choice: os que trabalham com
  rationale: Expressa naturalmente o particípio ocupacional de עבד e sua relação com o material mencionado em seguida.
- source_word: פִשְׁתִּים
  choice: linho
  rationale: Em português, “linho” pode designar tanto a planta/fibra quanto o material têxtil e é o equivalente corrente mais direto neste contexto.
- source_word: שְׂרִיקוֹת
  choice: penteado
  rationale: O termo raro provavelmente qualifica o linho especialmente preparado, penteado ou de qualidade fina; “penteado” mantém o contexto do processamento sem reduzir a palavra apenas a uma indicação de qualidade.
- source_word: וְאֹרְגִים
  choice: e também os que tecem
  rationale: Traduz o particípio de ארג e explicita com naturalidade a coordenação paralela entre os dois grupos profissionais.
- source_word: חוֹרָי
  choice: tecido branco
  rationale: O termo difícil parece referir-se a material têxtil branco ou branqueado. “Tecido branco” preserva essa referência sem especificar com certeza que seja linho.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura paralela acessível. A formulação mantém a incerteza lexical dos termos raros שְׂרִיקוֹת e חוֹרָי por meio de notas, sem sobrecarregar o texto principal.
