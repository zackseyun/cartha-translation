id: ISA.19.12
reference: Isaiah 19:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַיָּ/ם֙ אֵפ֣וֹא חֲכָמֶ֔י/ךָ וְ/יַגִּ֥ידוּ נָ֖א לָ֑/ךְ וְ/יֵ֣דְע֔וּ מַה יָּעַ֛ץ יְהוָ֥ה צְבָא֖וֹת עַל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/012.yaml
  text: Where[a], then, are your wise men? Let them tell you, please; let them know what Yahweh of Armies has purposed against Egypt.
translation:
  language: pt
  text: Onde estão, então, os seus sábios? Que eles lhe digam, por favor, e saibam o que Yahweh dos Exércitos[a] planejou contra o Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais tradicionalmente, “SENHOR dos Exércitos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיָּם אֵפוֹא
  choice: Onde estão, então
  rationale: Reproduz a pergunta retórica de localização e o valor enfático/inferencial de אֵפוֹא em ordem natural no português.
- source_word: חֲכָמֶיךָ
  choice: os seus sábios
  rationale: Designa os conselheiros e integrantes da elite intelectual egípcia sem especificar indevidamente uma função mais estreita.
- source_word: וְיַגִּידוּ נָא לָךְ
  choice: Que eles lhe digam, por favor
  rationale: A construção exortativa conserva o desafio retórico; “por favor” representa נָא e, no contexto, reforça a ironia da provocação.
- source_word: וְיֵדְעוּ
  choice: e saibam
  rationale: Mantém o sentido direto de ידע e o paralelismo com a exigência anterior, sem transformar conhecimento em mera adivinhação.
- source_word: מַה יָּעַץ
  choice: o que ... planejou
  rationale: יעץ aqui denota formular um plano ou propósito; o pretérito perfeito expressa de modo natural a ação verbal concluída apresentada pelo hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Expressa de forma transparente o sentido militar e celestial do título, com formulação idiomática em português.
- source_word: עַל מִצְרָיִם
  choice: contra o Egito
  rationale: Embora עַל possa significar “a respeito de”, o contexto de juízo favorece a força adversativa “contra”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título tradicional.
- issue: Tradução do título יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  alternative: Yahweh dos exércitos; SENHOR dos Exércitos; SENHOR dos exércitos
  rationale: “Exércitos” comunica melhor ao leitor moderno o sentido de צְבָאוֹת do que o tradicional “hostes”. A inicial maiúscula trata a expressão como título divino sem resolver se a referência primária é a forças celestiais ou militares.
- issue: Força de עַל após יָעַץ
  choice: contra o Egito
  alternative: a respeito do Egito
  rationale: O contexto de anúncio de juízo sustenta a leitura adversativa, embora a preposição por si só também admita uma relação mais neutra.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O pronome de tratamento foi vertido por “seus/lhe”, evitando regionalismos marcados. A colocação de “por favor” preserva a provocação retórica sem tornar a frase arcaica.
