id: ISA.19.1
reference: Isaiah 19:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מַשָּׂ֖א מִצְרָ֑יִם הִנֵּ֨ה יְהוָ֜ה רֹכֵ֨ב עַל עָ֥ב קַל֙ וּ/בָ֣א מִצְרַ֔יִם וְ/נָע֞וּ אֱלִילֵ֤י מִצְרַ֨יִם֙ מִ/פָּנָ֔י/ו וּ/לְבַ֥ב מִצְרַ֖יִם יִמַּ֥ס בְּ/קִרְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/001.yaml
  text: 'An oracle concerning Egypt: Behold[a], Yahweh is riding on a swift cloud and is coming to Egypt; the idols of Egypt will tremble before him[c][b], and the heart of Egypt will melt within it.'
translation:
  language: pt
  text: "Pronunciamento acerca do Egito[a]:\n\nEis que Yahweh cavalga sobre uma nuvem veloz\n e vem ao Egito.\nOs ídolos do Egito estremecerão diante dele[b],\n e o coração do Egito se derreterá dentro dele[c]."
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Oráculo acerca do Egito”, “Sentença acerca do Egito” ou, mais literalmente, “Peso acerca do Egito”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “de diante da sua face”, isto é, diante da presença de Yahweh.'
    reason: lexical_alternative
  - marker: c
    text: Isto é, dentro do próprio Egito; o hebraico trata o Egito como uma entidade singular masculina.
    reason: referent_clarification
lexical_decisions:
- source_word: מַשָּׂא
  choice: Pronunciamento
  rationale: Em títulos proféticos, o termo introduz uma declaração solene, muitas vezes de juízo. “Pronunciamento” é atual e digno, sem impor como sentido principal a metáfora possível de “peso”.
- source_word: מִצְרַיִם / מִצְרָיִם
  choice: Egito
  rationale: Forma portuguesa consagrada do nome geográfico.
- source_word: הִנֵּה
  choice: Eis que
  rationale: Mantém a função de chamar a atenção e a vivacidade da visão profética em registro elevado, mas compreensível.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: רֹכֵב עַל עָב קַל
  choice: cavalga sobre uma nuvem veloz
  rationale: Preserva a ação participial vívida, a imagem teofânica e o sentido contextual de קַל como rapidez.
- source_word: וּבָא
  choice: e vem ao Egito
  rationale: O presente dá vivacidade e iminência à cena profética, em sequência com o particípio anterior.
- source_word: וְנָעוּ
  choice: estremecerão
  rationale: Expressa o abalo ou tremor dos ídolos perante a presença divina sem reduzir a imagem a uma explicação abstrata.
- source_word: אֱלִילֵי
  choice: os ídolos
  rationale: Transmite diretamente o referente; o possível tom depreciativo do vocábulo não precisa ser explicitado por um adjetivo acrescentado.
- source_word: מִפָּנָיו
  choice: diante dele
  rationale: É uma formulação portuguesa natural para a expressão literalmente ligada à face ou presença de Yahweh.
- source_word: וּלְבַב מִצְרַיִם
  choice: e o coração do Egito
  rationale: Conserva a metáfora hebraica para o ânimo, a coragem ou o ser interior da nação personificada.
- source_word: יִמַּס
  choice: se derreterá
  rationale: Preserva a imagem concreta hebraica de colapso interior causado pelo medo.
- source_word: בְּקִרְבּוֹ
  choice: dentro dele
  rationale: Mantém a referência gramatical ao Egito como entidade singular masculina e conserva a personificação, esclarecida em nota.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto contém o nome próprio divino; a transliteração “Yahweh” preserva essa distinção sem substituí-lo por um título.
- issue: Imagem teofânica de Yahweh cavalgando sobre uma nuvem
  choice: Preservar literalmente a imagem
  alternative: Parafrasear como “Yahweh se aproxima rapidamente”
  rationale: A formulação hebraica retrata diretamente Yahweh como cavaleiro das nuvens. Preservá-la mantém a força poética e teológica sem desmitologizar o texto.
- issue: Personificação do Egito e referente do sufixo em בְּקִרְבּוֹ
  choice: “dentro dele”, referindo-se ao Egito personificado
  alternative: “em seu interior” ou “dentro do Egito”
  rationale: A forma escolhida reproduz a referência masculina singular e a personificação nacional, enquanto a nota evita que o leitor a tome necessariamente como referência a Yahweh.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Mantiveram-se o paralelismo poético, a metáfora do coração que se derrete, a personificação nacional e a imagem teofânica. “Eis que” conserva deliberadamente a elevação profética sem recorrer a sintaxe arcaica.
