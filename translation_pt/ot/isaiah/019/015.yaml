  yaml_path: translation/ot/isaiah/019/015.yaml
  text: And there will be no work for Egypt that head or tail[a], palm branch or reed[b], can do.
translation:
  language: pt
  text: E não haverá para o Egito obra alguma que possa ser realizada pela cabeça ou pela cauda[a], pelo ramo de palmeira ou pelo junco[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “cabeça ou cauda, ramo de palmeira ou junco” é uma expressão figurada que abrange todos os níveis da sociedade, do mais alto ao mais baixo; compare Isaías 9:14.
    reason: cross_reference
  - marker: b
    text: 'Ou: “a cabeça e a cauda, o ramo de palmeira e o junco”. Os pares hebraicos também podem ser traduzidos com “e”; o sentido é que nenhuma parte do Egito, alta ou baixa, conseguirá agir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֶׂה
  choice: obra alguma
  rationale: O substantivo designa obra, ação ou empreendimento. Com a negação, «obra alguma» expressa de modo natural que não haverá nada realizável pelo Egito.
- source_word: אֲשֶׁר יַעֲשֶׂה
  choice: que ... possam realizar
  rationale: A oração relativa delimita qualquer obra passível de execução; «possam realizar» comunica a força modal de incapacidade no contexto.
- source_word: רֹאשׁ וְזָנָב
  choice: a cabeça ou a cauda
  rationale: 'O par representa figuradamente os extremos sociais. «Ou» torna clara em português a aplicação distributiva: nem o mais alto nem o mais baixo.'
- source_word: כִּפָּה
  choice: ramo de palmeira
  rationale: Preserva a provável imagem botânica e seu contraste vertical com o junco, em harmonia com Isaías 9:14.
- source_word: אַגְמוֹן
  choice: junco
  rationale: Refere-se a uma planta de brejo, como junco ou caniço. «Junco» é claro e conserva o contraste com o ramo de palmeira.
- source_word: לְמִצְרַיִם
  choice: para o Egito
  rationale: 'A preposição indica relação ou posse: nenhuma obra estará à disposição do Egito ou será realizável por ele.'
- source_word: וְלֹא יִהְיֶה
  choice: E não haverá
  rationale: Tradução direta e natural da construção existencial futura.
