  text: וְ/אָנוּ֙ הַ/דַּיָּגִ֔ים וְ/אָ֣בְל֔וּ כָּל מַשְׁלִיכֵ֥י בַ/יְא֖וֹר חַכָּ֑ה וּ/פֹרְשֵׂ֥י מִכְמֹ֛רֶת עַל פְּנֵי מַ֖יִם אֻמְלָֽלוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/008.yaml
  text: And the fishermen will lament[a], and all who cast a hook into the Nile will mourn[b]; those who spread a net over the waters will waste away.
translation:
  language: pt
  text: Os pescadores se lamentarão, e todos os que lançam anzol no Nilo[a] ficarão de luto; os que estendem redes sobre as águas definharão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no rio”; neste contexto egípcio, o termo hebraico costuma referir-se especificamente ao Nilo.
    reason: lexical_alternative
  - marker: b
    text: Ou “enfraquecerão” ou “ficarão abatidos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנוּ
  choice: se lamentarão
  rationale: O verbo expressa gemido ou lamentação causada pela aflição; o futuro se ajusta ao anúncio profético.
- source_word: הַדַּיָּגִים
  choice: os pescadores
  rationale: Designa os que exercem a pesca como atividade; esta é a forma corrente e clara em português.
- source_word: וְאָבְלוּ
  choice: ficarão de luto
  rationale: אבל indica luto ou pesar. A expressão preserva a distinção em relação ao verbo anterior e soa natural em português.
- source_word: כָּל מַשְׁלִיכֵי
  choice: todos os que lançam
  rationale: O particípio caracteriza um grupo por sua atividade habitual.
- source_word: בַיְאֹר
  choice: no Nilo
  rationale: No contexto egípcio, יְאֹר normalmente se refere ao Nilo ou a seus canais; 'no Nilo' explicita o referente sem tornar a frase pesada.
- source_word: חַכָּה
  choice: anzol
  rationale: O substantivo denota um anzol de pesca; 'anzol' é preciso e idiomático.
- source_word: וּפֹרְשֵׂי
  choice: os que estendem
  rationale: O particípio descreve o ato de abrir ou estender o equipamento de pesca.
- source_word: מִכְמֹרֶת
  choice: redes
  rationale: O termo designa uma rede usada na pesca. O plural genérico é natural em português para a atividade habitual, embora o hebraico tenha forma singular coletiva.
- source_word: עַל פְּנֵי מַיִם
  choice: sobre as águas
  rationale: Mantém de forma clara a imagem hebraica de estender a rede sobre a superfície das águas.
- source_word: אֻמְלָלוּ
  choice: definharão
  rationale: O verbo transmite a ideia de enfraquecer, murchar ou perder o vigor; 'definharão' conserva a imagem forte e a concisão do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo poético foi preservado, distinguindo lamentação, luto e perda de vigor.
