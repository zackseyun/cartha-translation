  text: וְ/נוֹדַ֤ע יְהוָה֙ לְ/מִצְרַ֔יִם וְ/יָדְע֥וּ מִצְרַ֛יִם אֶת יְהוָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא וְ/עָֽבְדוּ֙ זֶ֣בַח וּ/מִנְחָ֔ה וְ/נָדְרוּ נֵ֥דֶר לַֽ/יהוָ֖ה וְ/שִׁלֵּֽמוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/021.yaml
  text: And Yahweh will make himself known to Egypt[a], and Egypt will know Yahweh in that day, and they will serve with sacrifice and offering[c][b], and they will vow vows to Yahweh and fulfill them.
translation:
  language: pt
  text: E Yahweh se dará a conhecer ao Egito[a], e os egípcios conhecerão Yahweh naquele dia. Eles o adorarão com sacrifício e oferta[b], farão votos a Yahweh e os cumprirão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Yahweh será conhecido pelos egípcios”. O verbo hebraico também admite uma tradução mais passiva.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “eles o servirão com sacrifício e oferta”. Nesse contexto, o verbo “servir” se refere ao culto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנוֹדַע
  choice: se dará a conhecer
  rationale: O nifal de ידע pode ser entendido como “ser conhecido” ou, com nuance reflexiva, “dar-se a conhecer”. A formulação escolhida é natural em português e expressa a manifestação divina sem eliminar a alternativa passiva, registrada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera diretamente o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְמִצְרַיִם
  choice: ao Egito
  rationale: A preposição ל indica aqui aquele a quem Yahweh se torna conhecido; “ao Egito” conserva também a personificação coletiva da nação.
- source_word: וְיָדְעוּ מִצְרַיִם אֶת־יְהוָה
  choice: e os egípcios conhecerão Yahweh
  rationale: Embora מִצְרַיִם seja literalmente “Egito”, o verbo plural mostra que a referência é ao povo egípcio. “Os egípcios” torna a concordância natural em português.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Equivalente idiomático e consagrado da fórmula temporal profética.
- source_word: וְעָבְדוּ
  choice: eles o adorarão
  rationale: עבד pode significar “servir” ou “adorar”. A menção imediata a sacrifícios, ofertas e votos indica serviço cultual; “adorarão” comunica esse sentido em português. O objeto “o” explicita naturalmente que Yahweh é o destinatário.
- source_word: זֶבַח וּמִנְחָה
  choice: com sacrifícios e ofertas
  rationale: זֶבַח designa sacrifício, enquanto מִנְחָה pode ser oferta, presente ou, em contexto cultual, oferta de cereal. A forma plural genérica é idiomática em português e evita especificar “cereal” além do que o contexto exige.
- source_word: וְנָדְרוּ נֵדֶר
  choice: farão votos
  rationale: O hebraico emprega um acusativo cognato, literalmente “votarão um voto”. “Farão votos” preserva o sentido e soa natural, embora não reproduza mecanicamente a repetição.
- source_word: וְשִׁלֵּמוּ
  choice: e os cumprirão
  rationale: Com votos, שׁלם significa pagá-los ou cumpri-los. O pronome retoma claramente “votos”.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” o preserva por transliteração, sem substituí-lo por um título nem adotar uma forma tradicional portuguesa específica.
- issue: Sentido cultual de עבד
  choice: adorarão
  alternative: servirão
  rationale: “Servir” é lexicalmente possível, mas os sacrifícios, as ofertas e os votos tornam explícito que se trata de culto. “Adorarão” comunica essa função sem acrescentar uma prática ausente do texto.
- issue: Conhecimento de Yahweh pelos egípcios
  choice: conhecerão Yahweh
  alternative: reconhecerão Yahweh
  rationale: “Conhecerão” mantém a amplitude de ידע e não reduz o enunciado a mero reconhecimento intelectual ou político.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara. Emprega “Yahweh” para o Tetragrama, “os egípcios” para refletir a concordância plural hebraica e plurais idiomáticos em “sacrifícios e ofertas”. As ambiguidades relevantes de וְנוֹדַע e וְעָבְדוּ são preservadas em notas.
