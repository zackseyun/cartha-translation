  terminology: “Yahweh” preserva corretamente o Tetragrama. “Adorarão” é defensável para o sentido cultual de עבד neste contexto; a nota registra de modo útil a alternativa “servirão”. “Votos” e “cumprirão” exprimem bem o idiomatismo hebraico relativo a fazer e cumprir/pagar votos.
