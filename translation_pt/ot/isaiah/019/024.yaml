  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִהְיֶ֤ה יִשְׂרָאֵל֙ שְׁלִ֣ישִׁיָּ֔ה לְ/מִצְרַ֖יִם וּ/לְ/אַשּׁ֑וּר בְּרָכָ֖ה בְּ/קֶ֥רֶב הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/024.yaml
  text: In that day Israel will be the third with Egypt and Assyria[a], a blessing in the midst of the earth,
translation:
  language: pt
  text: Naquele dia, Israel será o terceiro, junto com o Egito e a Assíria, uma bênção no meio da terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no meio do país”. A palavra hebraica אֶרֶץ pode significar tanto “terra” quanto “país”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Fórmula temporal profética corrente, natural em português e fiel ao registro do hebraico.
- source_word: יִהְיֶה
  choice: será
  rationale: Futuro simples de היה, expresso de modo direto e contemporâneo.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém a forma tradicional do nome próprio em português.
- source_word: שְׁלִישִׁיָּה
  choice: o terceiro
  rationale: O ordinal feminino funciona substantivamente e apresenta Israel como o terceiro integrante do grupo formado com Egito e Assíria.
- source_word: לְמִצְרַיִם וּלְאַשּׁוּר
  choice: junto com o Egito e a Assíria
  rationale: Neste contexto, a preposição לְ indica associação entre os três integrantes; 'junto com' torna essa relação clara sem alterar o sentido.
- source_word: בְּרָכָה
  choice: uma bênção
  rationale: Tradução direta do substantivo predicativo, preservando sua ressonância teológica sem explicitação adicional.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: no meio da terra
  rationale: Reproduz de perto a expressão hebraica; 'terra' preserva em português a possível referência tanto ao mundo quanto a uma região ou país.
theological_decisions:
- issue: Alcance de הָאָרֶץ
  choice: terra
  alternative: país / mundo
  rationale: O horizonte internacional do contexto favorece uma referência ampla à terra como mundo habitado. Contudo, o substantivo hebraico também pode designar uma terra ou país; a nota conserva essa ambiguidade lexical.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A vírgula após 'o terceiro' ajuda a apresentar 'junto com o Egito e a Assíria' como expressão associativa, sem resolver além do necessário a relação sintática de 'uma bênção'.
