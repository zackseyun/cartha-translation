base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/003.yaml
  text: And the spirit of Egypt will be emptied out within it[a], and I will swallow up its counsel; and they will seek the idols, the mutterers, the mediums, and the spiritists.
translation:
  language: pt
  text: O espírito do Egito se esvaziará em seu interior, e eu engolirei o seu conselho; e eles recorrerão aos ídolos, aos que murmuram encantamentos[a], aos médiuns e aos adivinhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico é raro e de sentido incerto; também pode se referir a encantadores ou, possivelmente, a espíritos ou fantasmas.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבְקָה
  choice: se esvaziará
  rationale: Preserva a imagem hebraica de esvaziamento ou drenagem interior, sem reduzi-la à interpretação mais estreita de perda de coragem.
- source_word: רוּחַ
  choice: espírito
  rationale: Mantém a amplitude metafórica do hebraico, que aqui pode abranger a disposição interior, o ânimo e a força vital coletiva do Egito.
- source_word: בְּקִרְבּוֹ
  choice: em seu interior
  rationale: Refere-se ao Egito como entidade coletiva e expressa de modo natural a desintegração que ocorre dentro da nação.
- source_word: עֲצָתוֹ
  choice: o seu conselho
  rationale: Conserva a ideia de deliberação, orientação ou plano político sem especificar além do texto.
- source_word: אֲבַלֵּעַ
  choice: eu engolirei
  rationale: Retém a metáfora concreta de engolir ou consumir, em vez de substituí-la pelo efeito interpretativo de confundir ou frustrar.
- source_word: וְדָרְשׁוּ אֶל
  choice: recorrerão a
  rationale: No contexto divinatório, comunica naturalmente a busca de orientação ou auxílio junto às entidades e aos praticantes mencionados.
- source_word: הָאֱלִילִים
  choice: os ídolos
  rationale: É a designação portuguesa direta e corrente para o termo hebraico pejorativo, sem acrescentar qualificadores não explícitos.
- source_word: הָאִטִּים
  choice: os que murmuram encantamentos
  rationale: O termo é raro e incerto; esta tradução acompanha a provável ligação com fala baixa ou encantamentos e evita apresentar como certa a interpretação de que sejam espíritos dos mortos.
- source_word: הָאֹבוֹת
  choice: os médiuns
  rationale: O termo pode designar o espírito invocado ou, por metonímia, quem o consulta; no contexto da lista, 'médiuns' é claro, atual e idiomático.
- source_word: הַיִּדְּעֹנִים
  choice: os espíritas
  rationale: Designa praticantes associados ao conhecimento oculto e à consulta de espíritos; a escolha é moderna e forma um par inteligível com 'médiuns'.
theological_decisions:
- issue: Como traduzir a lista de recursos ocultistas procurados pelo Egito
  choice: Empregar termos modernos e diretos — “ídolos”, “os que murmuram encantamentos”, “médiuns” e “espíritas” — mantendo a incerteza do termo raro em nota.
  alternative: Usar termos tradicionais ou mais interpretativos, como “fantasmas”, “necromantes”, “feiticeiros” ou “espíritos familiares”.
  rationale: A tradução deve conservar a força profética da busca egípcia por orientação religiosa ilícita, mas sem impor uma identificação excessivamente precisa aos termos hebraicos ambíguos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora de esvaziar o espírito e engolir o conselho foi preservada. A repetição hebraica da preposição foi refletida por “aos” em cada item da lista, e o ponto antes de “Então” evita um período excessivamente longo sem alterar a relação sequencial.
