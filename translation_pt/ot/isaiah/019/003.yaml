revisions:
- from: O espírito do Egito se esvaziará em seu interior, e eu engolirei o seu conselho. Então eles recorrerão aos ídolos, aos que murmuram encantamentos[a], aos médiuns e aos espíritas.
  to: O espírito do Egito se esvaziará em seu interior, e eu engolirei o seu conselho; e eles recorrerão aos ídolos, aos que murmuram encantamentos[a], aos médiuns e aos adivinhos.
  rationale: A revisão substitui “Então” por “e” para não tornar explícita uma sequência temporal que o hebraico não especifica. Também substitui “espíritas” por “adivinhos”, evitando a associação, especialmente forte no português brasileiro, com uma tradição religiosa moderna determinada. As demais escolhas são preservadas por refletirem com clareza e sobriedade as metáforas e as ambiguidades do texto-fonte.
