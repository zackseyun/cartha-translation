    issue: “Então” introduz uma relação temporal mais definida do que a conjunção hebraica.
    rationale: O וְ pode indicar simples coordenação; “e” preserva melhor a ligação sem especificar que a consulta ocorre em uma etapa temporal posterior.
  - severity: medium
    issue: “Espíritas” para הַיִּדְּעֹנִים traz uma associação moderna específica.
    rationale: No português brasileiro corrente, o termo costuma identificar membros do Espiritismo. O vocábulo hebraico se refere a praticantes de conhecimento/divinação ocultos, sem justificar essa identificação contemporânea.
