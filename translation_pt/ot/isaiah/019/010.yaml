id: ISA.19.10
reference: Isaiah 19:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָי֥וּ שָׁתֹתֶ֖י/הָ מְדֻכָּאִ֑ים כָּל עֹ֥שֵׂי שֶׂ֖כֶר אַגְמֵי נָֽפֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/010.yaml
  text: And her foundations will be crushed[b][a]; all who work for wages will be grieved in soul.
translation:
  language: pt
  text: E os seus fundamentos serão esmagados[a]; todos os que trabalham por salário ficarão abatidos por dentro.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico é difícil. “Seus fundamentos” também pode ser entendido como “seus pilares” ou “seus sustentáculos”; alguns propõem “seus tecelões”.
    reason: alternative_reading
  - marker: b
    text: A frase final é obscura em hebraico. Literalmente, seria algo como “charcos da alma” ou “pântanos do desejo/da vida”; muitos a entendem como referência a aflição interior ou abatimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁתֹתֶיהָ
  choice: os seus fundamentos
  rationale: O termo raro e discutido parece derivar de uma ideia de pôr, estabelecer ou fundar. No contexto, “fundamentos” comunica de modo natural o colapso da estrutura socioeconômica do Egito, sem ocultar em nota as alternativas relevantes.
- source_word: מְדֻכָּאִים
  choice: serão esmagados
  rationale: O particípio passivo de דכא expressa algo esmagado ou quebrantado. A construção futura em português acompanha וְהָיוּ e preserva a força da devastação anunciada.
- source_word: כָּל
  choice: todos
  rationale: Mantém o sentido distributivo direto, abrangendo toda a classe mencionada em seguida.
- source_word: עֹשֵׂי שֶׂכֶר
  choice: os que trabalham por salário
  rationale: Expressa de maneira idiomática o hebraico literal “fazedores de salário”, isto é, pessoas que trabalham em troca de pagamento.
- source_word: אַגְמֵי נָפֶשׁ
  choice: ficarão abatidos por dentro
  rationale: A expressão hebraica é obscura. Pelo contexto, provavelmente descreve profunda aflição ou desalento interior. “Por dentro” é corrente e inteligível, mas a dificuldade e a forma mais literal são preservadas em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O ponto e vírgula preserva as duas afirmações paralelas. As notas mantêm visíveis as duas dificuldades textuais e lexicais sem sobrecarregar o corpo do versículo.
