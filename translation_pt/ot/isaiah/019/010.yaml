  verdict: approve
  source_fidelity: O texto traduz adequadamente וְהָיוּ ... מְדֻכָּאִים como futuro passivo (“serão esmagados”) e preserva a extensão de כָּל (“todos”). “Os que trabalham por salário” comunica com precisão o sentido de עֹשֵׂי שֶׂכֶר. Para a expressão extremamente difícil אַגְמֵי נָפֶשׁ, “ficarão abatidos por dentro” é uma interpretação contextual plausível e não apresenta a solução como certeza, pois a nota explicita a obscuridade.
  naturalness: O português é moderno, claro e de registro bíblico sóbrio. “Fundamentos”, “serão esmagados” e “abatidos por dentro” são compreensíveis em uso brasileiro e internacional. O ponto e vírgula separa bem as duas afirmações do versículo.
  terminology: “Fundamentos” é uma opção apropriada para שָׁתֹתֶיהָ, cuja identificação é disputada; a nota preserva de modo suficiente as alternativas relevantes, incluindo “tecelões”. A nota de אַגְמֵי נָפֶשׁ também mantém visível tanto a formulação literal aproximada quanto a interpretação adotada. Não há termos teológicos ou nomes próprios que exijam padronização adicional.
