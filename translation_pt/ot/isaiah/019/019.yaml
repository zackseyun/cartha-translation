source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִֽהְיֶ֤ה מִזְבֵּ֨חַ֙ לַֽ/יהוָ֔ה בְּ/ת֖וֹךְ אֶ֣רֶץ מִצְרָ֑יִם וּ/מַצֵּבָ֥ה אֵֽצֶל גְּבוּלָ֖/הּ לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/019.yaml
  text: In that day there will be an altar to Yahweh in the midst of the land of Egypt[a], and a pillar to Yahweh beside its border.
translation:
  language: pt
  text: Naquele dia, haverá um altar para Yahweh no meio da terra do Egito e uma coluna[a] para Yahweh junto à sua fronteira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma pedra erguida”. O hebraico מַצֵּבָה pode designar uma pedra levantada ou uma coluna.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Fórmula temporal profética corrente, natural em português e fiel ao valor do hebraico.
- source_word: יִהְיֶה
  choice: haverá
  rationale: Expressa naturalmente em português o uso existencial de היה, que introduz a existência do altar e da coluna.
- source_word: מִזְבֵּחַ
  choice: altar
  rationale: É o sentido normal do termo hebraico, sem indicação de uso metafórico neste contexto.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: A preposição ל indica dedicação ou destinação; a repetição foi mantida para refletir a ênfase do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּתוֹךְ אֶרֶץ מִצְרָיִם
  choice: no meio da terra do Egito
  rationale: Preserva tanto a localização no interior do território quanto a expressão explícita 'terra do Egito'.
- source_word: וּמַצֵּבָה
  choice: e uma coluna
  rationale: מַצֵּבָה designa uma pedra erguida ou coluna. 'Coluna' é conciso e natural, enquanto a nota registra a alternativa lexical mais concreta.
- source_word: אֵצֶל גְּבוּלָהּ
  choice: junto à sua fronteira
  rationale: Comunica proximidade espacial e conserva o sufixo feminino que retoma a terra do Egito.
theological_decisions:
- issue: Tradução de יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. A transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Sentido de מַצֵּבָה em contexto profético positivo
  choice: coluna
  alternative: pedra erguida; monumento
  rationale: A tradução mantém o sentido concreto do termo sem apagar a possível conotação cultual nem importar para o versículo uma condenação presente em outros contextos.
translation_notes:
  register: Português atual, claro e digno, com cadência profética. Conserva a repetição de “para Yahweh” e a distinção espacial entre o altar no interior do Egito e a coluna junto à fronteira.
