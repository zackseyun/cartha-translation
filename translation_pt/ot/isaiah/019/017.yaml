source:
  edition: WLC
  text: וְ֠/הָיְתָה אַדְמַ֨ת יְהוּדָ֤ה לְ/מִצְרַ֨יִם֙ לְ/חָגָּ֔א כֹּל֩ אֲשֶׁ֨ר יַזְכִּ֥יר אֹתָ֛/הּ אֵלָ֖י/ו יִפְחָ֑ד מִ/פְּנֵ֗י עֲצַת֙ יְהוָ֣ה צְבָא֔וֹת אֲשֶׁר ה֖וּא יוֹעֵ֥ץ עָלָֽי/ו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/017.yaml
  text: And the land of Judah will become a terror to Egypt[c][b][a]; everyone to whom it is mentioned will fear because of the plan of Yahweh of Armies that he is planning against it.
translation:
  language: pt
  text: E a terra de Judá se tornará motivo de terror para o Egito.[a] Todo aquele a quem se mencionar essa terra[b] terá medo por causa do plano de Yahweh dos Exércitos[c], que ele está traçando contra o Egito.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «causa de pavor», «motivo de horror» ou, segundo outra tradição interpretativa, «vertigem». O termo hebraico é raro e de sentido incerto.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «todo aquele a quem ela for mencionada». A construção indica que a menção da terra de Judá fará qualquer egípcio ter medo.'
    reason: lexical_alternative
  - marker: c
    text: 'Tradução tradicional: «SENHOR dos Exércitos».'
    reason: lexical_alternative
  - marker: d
    text: 'Hebraico: «contra ele». O pronome se refere ao Egito.'
    reason: referent_clarification
lexical_decisions:
- source_word: אַדְמַת יְהוּדָה
  choice: a terra de Judá
  rationale: אַדְמָה pode significar solo ou terra; no contexto geopolítico, «a terra de Judá» é a expressão portuguesa mais natural.
- source_word: לְמִצְרַיִם לְחָגָּא
  choice: motivo de terror para o Egito
  rationale: O substantivo חָגָּא é raro e difícil. O contexto imediato destaca o medo dos egípcios; «motivo de terror» expressa naturalmente em português o efeito produzido por Judá sem ocultar a incerteza lexical, registrada em nota.
- source_word: כֹּל אֲשֶׁר יַזְכִּיר אֹתָהּ אֵלָיו
  choice: Todo aquele a quem ela for mencionada
  rationale: 'A construção hebraica é condensada e distributiva: qualquer pessoa que ouça falar da terra de Judá sentirá medo. A formulação conserva de perto a estrutura e a ambiguidade referencial do original.'
- source_word: יִפְחָד
  choice: ficará com medo
  rationale: Tradução clara e corrente de פחד neste contexto; o futuro corresponde à forma verbal e ao anúncio profético.
- source_word: מִפְּנֵי עֲצַת
  choice: por causa do plano
  rationale: מִפְּנֵי tem valor causal, e עֵצָה designa aqui a intenção deliberada de Deus; «plano» é mais transparente do que «conselho» no português atual.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino como Yahweh e traduz צְבָאוֹת de modo compreensível, preservando a força marcial e cósmica do título.
- source_word: אֲשֶׁר הוּא יוֹעֵץ עָלָיו
  choice: que ele está traçando contra o Egito
  rationale: O particípio יוֹעֵץ sugere ação deliberativa em curso. A explicitação de «Egito» evita a ambiguidade artificial do pronome português, pois o sufixo hebraico retoma o Egito.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A forma «Yahweh» representa diretamente o nome próprio hebraico, sem substituí-lo por um título, e segue a orientação lexical fornecida.
- issue: Tradução do título צְבָאוֹת
  choice: dos Exércitos
  alternative: dos Exércitos celestiais; dos Exércitos do céu; dos Senhores dos Exércitos
  rationale: «Dos Exércitos» é conciso, inteligível e preserva a amplitude do título sem restringi-lo explicitamente a exércitos humanos ou celestiais.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das notas segue a posição dos marcadores no texto. A construção «a quem ela for mencionada» mantém a formulação distributiva e ligeiramente incomum do hebraico; «contra o Egito» explicita apenas o referente gramatical do pronome final.
