id: ISA.19.13
reference: Isaiah 19:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: נֽוֹאֲלוּ֙ שָׂ֣רֵי צֹ֔עַן נִשְּׁא֖וּ שָׂ֣רֵי נֹ֑ף הִתְע֥וּ אֶת מִצְרַ֖יִם פִּנַּ֥ת שְׁבָטֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/013.yaml
  text: The princes of Zoan have become foolish; the princes of Noph are deceived. They have led Egypt astray[a], they who are the cornerstone of her tribes.
translation:
  language: pt
  text: Os príncipes de Zoã tornaram-se insensatos; os príncipes de Nof[a] foram enganados. Eles desencaminharam o Egito, eles que são a pedra angular de suas tribos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nof é o nome hebraico de Mênfis.
    reason: Identifica para o leitor moderno o topônimo preservado na forma hebraica.
lexical_decisions:
- source_word: נֽוֹאֲלוּ
  choice: tornaram-se insensatos
  rationale: O nifal de יאל expressa o estado resultante de tornar-se ou mostrar-se insensato; esta formulação preserva essa nuance.
- source_word: שָׂרֵי
  choice: príncipes
  rationale: שַׂר designa governantes ou altos dirigentes; “príncipes” mantém o tom político e profético do contexto.
- source_word: צֹעַן
  choice: Zoã
  rationale: Transliteração portuguesa tradicional do topônimo hebraico.
- source_word: נִשְּׁאוּ
  choice: foram enganados
  rationale: O nifal de נשׁא é entendido aqui como ser enganado ou iludido, em paralelo com a insensatez e com o ato de desencaminhar o Egito.
- source_word: נֹף
  choice: Nof
  rationale: Mantém a forma hebraica do topônimo; sua identificação convencional com Mênfis é informada em nota.
- source_word: הִתְעוּ
  choice: desencaminharam
  rationale: 'O hifil de תעה tem força causativa: fazer errar ou desviar-se. “Desencaminharam” expressa isso de modo natural e conciso.'
- source_word: מִצְרַיִם
  choice: Egito
  rationale: Forma portuguesa consagrada do nome da nação.
- source_word: פִּנַּת
  choice: pedra angular
  rationale: O substantivo significa literalmente “canto” e, metaforicamente, o principal elemento de sustentação; “pedra angular” preserva a imagem.
- source_word: שְׁבָטֶיהָ
  choice: suas tribos
  rationale: שֵׁבֶט pode designar tribo ou agrupamento constituinte; o sufixo feminino singular retoma o Egito.
