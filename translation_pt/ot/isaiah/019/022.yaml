source:
  edition: WLC
  text: וְ/נָגַ֧ף יְהוָ֛ה אֶת מִצְרַ֖יִם נָגֹ֣ף וְ/רָפ֑וֹא וְ/שָׁ֨בוּ֙ עַד יְהוָ֔ה וְ/נֶעְתַּ֥ר לָ/הֶ֖ם וּ/רְפָאָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/019/022.yaml
  text: And Yahweh will strike Egypt[a], striking and healing; and they will return to Yahweh[b], and he will respond to their pleas and heal them.
translation:
  language: pt
  text: Yahweh ferirá o Egito, ferindo e curando-o. Eles voltarão para Yahweh[a], e ele atenderá às suas súplicas[b] e os curará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se voltarão para Yahweh”. O verbo hebraico pode indicar voltar ou retornar, frequentemente com uma nuance de arrependimento em contextos proféticos.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ele se deixará suplicar por eles” ou “ouvirá a súplica deles”. A expressão hebraica indica que Yahweh responderá favoravelmente ao apelo deles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָגַף
  choice: ferirá
  rationale: O verbo expressa um golpe ou uma aflição, inclusive por praga. “Ferirá” é claro, vigoroso e não arcaico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: מִצְרַיִם
  choice: Egito
  rationale: Forma portuguesa consagrada do nome do país e povo.
- source_word: נָגֹף וְרָפוֹא
  choice: ferirá e curará
  rationale: Reproduz o paralelismo enfático dos infinitivos absolutos e mantém lado a lado juízo e restauração, sem impor uma explicação sobre a relação temporal entre eles.
- source_word: וְשָׁבוּ עַד יְהוָה
  choice: Eles voltarão para Yahweh
  rationale: שׁוב com עַד indica voltar-se ou retornar para Yahweh e pode trazer uma nuance de arrependimento. “Voltarão” preserva essa ressonância profética sem a tornar explícita demais.
- source_word: וְנֶעְתַּר לָהֶם
  choice: ele atenderá às suas súplicas
  rationale: O nifal de עתר comunica que Deus se deixa suplicar e responde favoravelmente. Esta formulação é natural em português e conserva o sentido relacional.
- source_word: וּרְפָאָם
  choice: e os curará
  rationale: Mantém o sentido normal de רפא e a repetição lexical de “curará”, deixando aberta a amplitude física, nacional e espiritual da imagem.
theological_decisions:
- issue: Relação entre juízo divino e restauração
  choice: Yahweh é apresentado tanto como aquele que fere o Egito quanto como aquele que o cura.
  alternative: Entender a cura apenas como recuperação política ou separar a restauração da ação divina.
  rationale: O hebraico atribui expressamente as duas ações a Yahweh. A tradução preserva essa tensão sem reduzir o juízo nem a restauração.
- issue: Nuance de arrependimento em שׁוב
  choice: voltarão para Yahweh
  alternative: se voltarão para Yahweh
  rationale: “Voltarão” conserva melhor a possível nuance profética de retorno e arrependimento, sem transformar o verbo numa fórmula doutrinária mais específica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A repetição “ferirá e curará” preserva deliberadamente o paralelismo e a tensão do hebraico; os pronomes plurais tratam “Egito” coletivamente, isto é, seus habitantes.
