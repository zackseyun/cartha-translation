source:
  edition: WLC
  text: אַשְׁרֵ֤י אֱנוֹשׁ֙ יַעֲשֶׂה זֹּ֔את וּ/בֶן אָדָ֖ם יַחֲזִ֣יק בָּ֑/הּ שֹׁמֵ֤ר שַׁבָּת֙ מֵֽ/חַלְּל֔/וֹ וְ/שֹׁמֵ֥ר יָד֖/וֹ מֵ/עֲשׂ֥וֹת כָּל רָֽע־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/002.yaml
  text: 'Blessed is the man who does this, and the son of man who holds fast to it: keeping the Sabbath from profaning it, and keeping his hand from doing any evil.'
translation:
  language: pt
  text: 'Feliz quem faz isso, e o ser humano que se apega a isso: guarda o sábado de profaná-lo e guarda sua mão de fazer qualquer mal.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Feliz
  rationale: Expressa a condição digna de congratulação indicada pela fórmula hebraica, em linguagem natural e direta.
- source_word: אֱנוֹשׁ ... בֶן־אָדָם
  choice: quem ... o ser humano
  rationale: Os dois termos destacam a humanidade mortal em paralelismo. A primeira expressão foi formulada inclusivamente como “quem”, e a segunda como “o ser humano”, evitando que “Filho do Homem” seja entendido aqui como título.
- source_word: יַחֲזִיק בָּהּ
  choice: se apega a isso
  rationale: Conserva a ideia de agarrar-se firmemente e perseverar na conduta mencionada.
- source_word: שֹׁמֵר שַׁבָּת מֵחַלְּלוֹ
  choice: guarda o sábado sem profaná-lo
  rationale: “Guardar o sábado” é uma expressão portuguesa clara e preserva a linguagem pactual do hebraico; “sem profaná-lo” comunica a ideia de não tratá-lo como comum ou violá-lo.
- source_word: שֹׁמֵר יָדוֹ מֵעֲשׂוֹת כָּל־רָע
  choice: impede sua mão de fazer qualquer mal
  rationale: Mantém a imagem corporal do hebraico e expressa autocontrole ativo.
theological_decisions:
- issue: Referente de זֹּאת / בָּהּ (“isso”)
  choice: Preservar “isso” sem explicitar um referente único
  alternative: Identificar “isso” especificamente com justiça, retidão ou observância do sábado
  rationale: O contexto anterior menciona justiça e retidão, enquanto as cláusulas seguintes descrevem o sábado e a rejeição do mal. O hebraico permite essa amplitude, que não deve ser resolvida silenciosamente.
- issue: Relação das cláusulas sobre o sábado e o mal com a frase anterior
  choice: Usar dois-pontos e verbos coordenados como explicação prática de apegar-se a “isso”
  alternative: 'Traduzir com particípios nominais: “aquele que guarda...”'
  rationale: A construção hebraica apresenta particípios que caracterizam a pessoa feliz. Esta formulação conserva a função explicativa sem criar uma exigência teológica além do texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O paralelismo hebraico foi mantido sem recorrer ao masculino genérico na primeira metade nem transformar “filho do homem” em título cristológico.
