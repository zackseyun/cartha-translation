    issue: “impede sua mão de fazer qualquer mal”
    rationale: O hebraico diz literalmente que a pessoa “guarda sua mão de fazer todo mal”. “Impedir” torna a mão um agente separado e produz uma expressão menos idiomática; “guardar” retém tanto a imagem corporal quanto a noção de autocontenção.
