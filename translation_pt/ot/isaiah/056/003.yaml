  text: וְ/אַל יֹאמַ֣ר בֶּן הַ/נֵּכָ֗ר הַ/נִּלְוָ֤ה אֶל יְהוָה֙ לֵ/אמֹ֔ר הַבְדֵּ֧ל יַבְדִּילַ֛/נִי יְהוָ֖ה מֵ/עַ֣ל עַמּ֑/וֹ וְ/אַל יֹאמַר֙ הַ/סָּרִ֔יס הֵ֥ן אֲנִ֖י עֵ֥ץ יָבֵֽשׁ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/003.yaml
  text: Let not the foreigner who has joined himself to the LORD say, “The LORD will surely separate me from his people”; and let not the eunuch say, “Look, I am a dry tree.”
translation:
  language: pt
  text: 'Que o estrangeiro que se uniu ao SENHOR não diga: “O SENHOR certamente me separará do seu povo”. E que o eunuco não diga: “Eis que sou uma árvore seca”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן־הַנֵּכָר
  choice: o estrangeiro
  rationale: A expressão hebraica literalmente significa “filho do estrangeiro”, mas funciona idiomaticamente como designação de uma pessoa estrangeira.
- source_word: הַנִּלְוָה אֶל־יְהוָה
  choice: que se uniu ao SENHOR
  rationale: Preserva a ideia reflexiva de associar-se ou vincular-se ao SENHOR, sem especificar além do que o texto afirma.
- source_word: הַבְדֵּל יַבְדִּילַנִי
  choice: certamente me separará
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a afirmação; “certamente” comunica essa ênfase em português natural.
- source_word: הַסָּרִיס
  choice: o eunuco
  rationale: Equivalente direto e historicamente adequado para a condição mencionada no texto.
- source_word: הֵן
  choice: Vejam
  rationale: Interjeição que chama a atenção para a autodescrição seguinte; “Vejam” conserva essa força de modo corrente.
- source_word: עֵץ יָבֵשׁ
  choice: uma árvore seca
  rationale: Mantém literalmente a metáfora hebraica de esterilidade e ausência de posteridade, sem explicá-la dentro do texto.
theological_decisions:
- issue: Pertencimento do estrangeiro ao povo do SENHOR
  choice: Manter a fala temerosa como “O SENHOR certamente me separará do seu povo”
  alternative: Explicitar que se trata de exclusão da comunidade da aliança
  rationale: O versículo enuncia o receio sem definir em termos técnicos a natureza exata da separação; a tradução preserva essa abertura.
- issue: Metáfora do eunuco
  choice: Preservar “sou uma árvore seca”
  alternative: Parafrasear como “não terei descendentes”
  rationale: A imagem poética tem alcance retórico e teológico próprio, e não deve ser reduzida silenciosamente a uma única explicação.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. O nome divino é representado por SENHOR, em conformidade com a convenção tradicional indicada pela camada de consulta. A coordenação repetida “E que... não diga” conserva o paralelismo hebraico.
