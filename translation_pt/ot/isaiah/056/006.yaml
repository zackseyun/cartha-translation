id: ISA.56.6
reference: Isaiah 56:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/בְנֵ֣י הַ/נֵּכָ֗ר הַ/נִּלְוִ֤ים עַל יְהוָה֙ לְ/שָׁ֣רְת֔/וֹ וּֽ/לְ/אַהֲבָה֙ אֶת שֵׁ֣ם יְהוָ֔ה לִ/הְי֥וֹת ל֖/וֹ לַ/עֲבָדִ֑ים כָּל שֹׁמֵ֤ר שַׁבָּת֙ מֵֽ/חַלְּל֔/וֹ וּ/מַחֲזִיקִ֖ים בִּ/בְרִיתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/006.yaml
  text: And the sons of the foreigner who join themselves to Yahweh[a], to minister to him, and to love the name of Yahweh[d][c][b], to be his servants—everyone who keeps the Sabbath from profaning it and holds fast my covenant—
translation:
  language: pt
  text: E os filhos do estrangeiro[a] que se unem a Yahweh para servi-lo, para amar o nome de Yahweh e para ser seus servos[b] — todo aquele que guarda o sábado sem profaná-lo e se apega à minha aliança —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os estrangeiros”. Hebraico, literalmente: “os filhos do estrangeiro”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “seus escravos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי הַנֵּכָר
  choice: E os filhos do estrangeiro
  rationale: Mantém a expressão concreta do hebraico, embora ela designe coletivamente pessoas estrangeiras; a alternativa idiomática é “os estrangeiros”.
- source_word: הַנִּלְוִים עַל יְהוָה
  choice: que se unem a Yahweh
  rationale: O particípio nifal de לוה comunica adesão ou vinculação voluntária; “se unem a” conserva o sentido reflexivo e relacional.
- source_word: לְשָׁרְתוֹ
  choice: para servi-lo
  rationale: שרת pode indicar serviço ministerial ou sagrado. “Servi-lo” é natural em português e preserva aqui a ideia de serviço prestado a Deus.
- source_word: וּלְאַהֲבָה אֶת שֵׁם יְהוָה
  choice: para amar o nome de Yahweh
  rationale: Conserva a referência explícita ao nome divino e seu valor reverencial e pactual.
- source_word: לִהְיוֹת לוֹ לַעֲבָדִים
  choice: para ser seus servos
  rationale: עֲבָדִים pode significar servos ou escravos. Neste contexto, “servos” exprime com naturalidade a dedicação e o serviço a Yahweh sem impor ao texto a ênfase jurídica de escravidão.
- source_word: כָּל שֹׁמֵר שַׁבָּת מֵחַלְּלוֹ
  choice: todo aquele que guarda o sábado sem profaná-lo
  rationale: כָּל com o particípio singular tem força distributiva. “Sem profaná-lo” expressa de modo claro a construção com מִן e mantém o vocabulário de santidade.
- source_word: וּמַחֲזִיקִים בִּבְרִיתִי
  choice: e se apega à minha aliança
  rationale: A expressão comunica agarrar-se firmemente ou manter-se ligado à aliança. A concordância singular em português acompanha o distributivo “todo aquele”, embora o particípio hebraico seja plural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
theological_decisions:
- issue: Inclusão pactual dos estrangeiros
  choice: Preservar “filhos do estrangeiro” e os verbos de adesão, amor e serviço.
  alternative: Generalizar como “os estrangeiros”.
  rationale: A formulação conserva a imagem hebraica e apresenta a plena adesão dessas pessoas a Yahweh e à sua aliança sem acrescentar conclusões teológicas posteriores.
- issue: Sentido de עֲבָדִים
  choice: servos
  alternative: escravos
  rationale: O contexto enfatiza serviço religioso e pertencimento pactual; “servos” preserva essa ênfase, enquanto “escravos” poderia destacar indevidamente a condição jurídica.
- issue: Mudança de número gramatical na última cláusula
  choice: Usar o distributivo singular “todo aquele ... se apega”.
  alternative: Usar o plural “todos os que guardam ... e se apegam”.
  rationale: O singular reflete כָּל שֹׁמֵר. O particípio final é formalmente plural, mas se refere ao grupo já descrito; a formulação portuguesa conserva o valor distributivo sem produzir uma quebra sintática artificial.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Mantém “Yahweh”, o vocabulário pactual e a suspensão sintática marcada pelo travessão, pois a frase prossegue no versículo seguinte.
