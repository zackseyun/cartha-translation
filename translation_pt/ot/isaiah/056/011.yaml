id: ISA.56.11
reference: Isaiah 56:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הַ/כְּלָבִ֣ים עַזֵּי נֶ֗פֶשׁ לֹ֤א יָֽדְעוּ֙ שָׂבְעָ֔ה וְ/הֵ֣מָּה רֹעִ֔ים לֹ֥א יָדְע֖וּ הָבִ֑ין כֻּלָּ/ם֙ לְ/דַרְכָּ֣/ם פָּנ֔וּ אִ֥ישׁ לְ/בִצְע֖/וֹ מִ/קָּצֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/011.yaml
  text: And the dogs are greedy in appetite[a]; they do not know satisfaction. And they are shepherds who do not know understanding; all of them have turned to their own way, each one to his own gain[c][b], every one without exception.
translation:
  language: pt
  text: E os cães têm apetite voraz[a]; nunca se satisfazem. E eles são pastores que não sabem compreender[b]; todos se voltaram para o seu próprio caminho, cada um para o seu próprio ganho, todos sem exceção[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “são insaciáveis”; literalmente, “fortes/ferozes de apetite”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não entendem” ou “nada sabem de discernimento”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “de todos os lados”. A expressão hebraica é difícil e pode enfatizar a extensão total da corrupção.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַכְּלָבִים
  choice: os cães
  rationale: Mantém a metáfora concreta do hebraico, sem substituí-la por uma identificação interpretativa como “líderes” ou “sentinelas”.
- source_word: עַזֵּי נֶפֶשׁ
  choice: têm apetite voraz
  rationale: Expressa de modo natural o idioma literalmente associado a ser “forte/feroz de apetite”, conservando a ideia de desejo voraz.
- source_word: לֹא יָדְעוּ שָׂבְעָה
  choice: nunca se satisfazem
  rationale: Traduz idiomaticamente a ausência de saciedade; a forma mais literal seria “não conhecem satisfação”.
- source_word: רֹעִים
  choice: pastores
  rationale: Preserva a segunda metáfora do texto e evita restringi-la a um cargo eclesiástico moderno.
- source_word: לֹא יָדְעוּ הָבִין
  choice: não sabem compreender
  rationale: Conserva a repetição do verbo “saber/conhecer” e a construção incomum do hebraico, sem eliminar sua força retórica.
- source_word: כֻּלָּם לְדַרְכָּם פָּנוּ
  choice: todos se voltaram para o seu próprio caminho
  rationale: Mantém tanto a acusação coletiva quanto a metáfora moral do caminho.
- source_word: אִישׁ לְבִצְעוֹ
  choice: cada um para o seu próprio ganho
  rationale: Reproduz a força distributiva de אִישׁ e deixa “ganho” sem qualificação adicional, embora o contexto lhe dê sentido condenatório.
- source_word: מִקָּצֵהוּ
  choice: todos sem exceção
  rationale: A expressão hebraica é difícil; no contexto, esta formulação comunica naturalmente a extensão total da corrupção, sem ocultar em nota a alternativa espacial.
theological_decisions:
- issue: Identificação metafórica dos “cães” e dos “pastores”
  choice: Manter as duas metáforas no texto principal.
  alternative: Explicitar “líderes”, “sentinelas” ou outra função institucional.
  rationale: O hebraico sobrepõe imagens para condenar os responsáveis; preservá-las evita impor uma aplicação institucional ou denominacional mais estreita.
- issue: Valor moral de בֶּצַע
  choice: “ganho” no texto principal
  alternative: “ganho injusto” ou “lucro desonesto”
  rationale: O termo frequentemente tem conotação negativa, e o contexto é claramente condenatório, mas “ganho” preserva a abertura lexical sem acrescentar no corpo do texto uma qualificação não expressa de modo inequívoco.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A redação preserva as metáforas, o paralelismo e a dificuldade da cláusula final, usando formulações naturais sem eliminar a ambiguidade genuína.
