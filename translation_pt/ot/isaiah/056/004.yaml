  text: כִּי כֹ֣ה אָמַ֣ר יְהוָ֗ה לַ/סָּֽרִיסִים֙ אֲשֶׁ֤ר יִשְׁמְרוּ֙ אֶת שַׁבְּתוֹתַ֔/י וּ/בָֽחֲר֖וּ בַּ/אֲשֶׁ֣ר חָפָ֑צְתִּי וּ/מַחֲזִיקִ֖ים בִּ/בְרִיתִֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/004.yaml
  text: 'For thus says the LORD to the eunuchs who keep my Sabbaths, and choose what I delight in, and hold fast to my covenant:'
translation:
  language: pt
  text: 'Pois assim diz o SENHOR aos eunucos que guardam os meus sábados, escolhem o que me agrada e se apegam à minha aliança:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: SENHOR
  rationale: Representa o nome divino segundo a convenção tradicional em português, mantendo-o em versaletes.
- source_word: לַסָּרִיסִים
  choice: aos eunucos
  rationale: Tradução direta e historicamente adequada do substantivo hebraico no plural.
- source_word: יִשְׁמְרוּ אֶת־שַׁבְּתוֹתַי
  choice: guardam os meus sábados
  rationale: Preserva o sentido de observar fielmente e mantém o plural do texto hebraico.
- source_word: וּבָחֲרוּ בַּאֲשֶׁר חָפָצְתִּי
  choice: escolhem aquilo em que me agrado
  rationale: Mantém o objeto relativamente aberto e o sentido volitivo de escolher o que agrada a Deus.
- source_word: וּמַחֲזִיקִים בִּבְרִיתִי
  choice: e se apegam à minha aliança
  rationale: Expressa a ideia de agarrar-se firmemente ou permanecer fiel à aliança em português natural.
theological_decisions:
- issue: Relação entre as três descrições dos eunucos
  choice: 'Coordenação: “guardam..., escolhem... e se apegam...”'
  alternative: Repetir “que” antes de cada verbo
  rationale: O hebraico coordena as ações; a formulação portuguesa preserva essa relação sem criar hierarquia interpretativa entre elas.
- issue: Conteúdo de אֲשֶׁר חָפָצְתִּי
  choice: “aquilo em que me agrado”
  alternative: “o que me agrada”
  rationale: A escolha conserva a perspectiva da primeira pessoa divina e não especifica além do que o hebraico declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A frase mantém os dois-pontos finais porque introduz a promessa do versículo seguinte.
