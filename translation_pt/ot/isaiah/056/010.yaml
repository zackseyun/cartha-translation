  text: צפו עִוְרִ֤ים כֻּלָּ/ם֙ לֹ֣א יָדָ֔עוּ כֻּלָּ/ם֙ כְּלָבִ֣ים אִלְּמִ֔ים לֹ֥א יוּכְל֖וּ לִ/נְבֹּ֑חַ הֹזִים֙ שֹֽׁכְבִ֔ים אֹהֲבֵ֖י לָ/נֽוּם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/010.yaml
  text: His watchmen are blind[a], all of them; they know nothing. All of them are mute dogs, unable to bark, dreamers, lying down, loving to slumber.
translation:
  language: pt
  text: Seus vigias são todos cegos; nada sabem. Todos eles são cães mudos, incapazes de latir; sonham, ficam deitados e gostam de dormir[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “murmuram”. O termo hebraico é raro e seu sentido neste contexto é incerto. A tradução no texto segue a imagem de sono presente nas expressões seguintes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צפו
  choice: Seus vigias
  rationale: Entendido no sentido nominal/participial de pessoas encarregadas de vigiar. “Vigias” é natural em português e conserva a imagem profética; “seus” segue a leitura contextual tradicional da forma defectiva.
- source_word: עִוְרִים
  choice: cegos
  rationale: Mantém o adjetivo concreto, usado aqui metaforicamente para denunciar a falta de percepção dos responsáveis.
- source_word: לֹא יָדָעוּ
  choice: nada sabem
  rationale: Expressa de modo idiomático e enfático a ausência de conhecimento ou discernimento.
- source_word: כְּלָבִים אִלְּמִים
  choice: cães mudos
  rationale: Preserva a metáfora contundente e a incapacidade desses vigias de dar o alarme.
- source_word: לֹא יוּכְלוּ לִנְבֹּחַ
  choice: incapazes de latir
  rationale: Comunica claramente a incapacidade expressa pelo hebraico e mantém a imagem canina.
- source_word: הֹזִים
  choice: vivem sonhando
  rationale: O termo raro e difícil é interpretado à luz das imagens subsequentes de estar deitado e cochilar. A formulação verbal soa natural em português e mantém a ação contínua do particípio.
- source_word: שֹׁכְבִים
  choice: ficam deitados
  rationale: Conserva a postura física e, no contexto, a denúncia de inércia.
- source_word: אֹהֲבֵי לָנוּם
  choice: gostam de cochilar
  rationale: Reproduz a ideia de ter prazer no sono leve ou na sonolência, em linguagem atual e compreensível.
