  source_fidelity: O texto traduz com fidelidade os imperativos plurais de שִׁמְרוּ e עֲשׂוּ, mantém a distinção semântica entre מִשְׁפָּט (“o direito”) e צְדָקָה (“a justiça”), e preserva o paralelismo entre a salvação próxima e a justiça divina prestes a ser revelada. “Yahweh” representa diretamente יהוה. A elipse em “e a minha justiça, de ser revelada” corresponde adequadamente à construção hebraica subordinada a “está perto”.
  naturalness: O português é moderno, claro e de registro profético digno. “Preservem o direito e pratiquem a justiça” é natural e inteligível de modo amplo; “está perto de chegar” também comunica bem a iminência. A vírgula que marca a elipse no segundo membro é correta e facilita a leitura.
  terminology: A terminologia está bem calibrada. “Direito” para מִשְׁפָּט e “justiça” para צְדָקָה evita fundir os termos. “Salvação” conserva a amplitude de יְשׁוּעָה, e as notas oferecem alternativas legítimas sem restringir o sentido de modo doutrinário. Para a justiça de Yahweh, “retidão” e “vindicação” são alternativas pertinentes.
