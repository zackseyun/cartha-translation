id: ISA.56.1
reference: Isaiah 56:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה שִׁמְר֥וּ מִשְׁפָּ֖ט וַ/עֲשׂ֣וּ צְדָקָ֑ה כִּֽי קְרוֹבָ֤ה יְשֽׁוּעָתִ/י֙ לָ/ב֔וֹא וְ/צִדְקָתִ֖/י לְ/הִגָּלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/001.yaml
  text: 'Thus says Yahweh: Keep justice[a], and do righteousness, for my salvation is near to come[b], and my righteousness to be revealed.'
translation:
  language: pt
  text: 'Assim diz Yahweh: “Preservem o direito e pratiquem a justiça, pois a minha salvação[a] está perto de chegar, e a minha justiça[b], de ser revelada.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “libertação”.
    reason: lexical_alternative
  - marker: b
    text: Ou “retidão” ou “vindicação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה
  choice: Assim
  rationale: Introduz de modo natural e solene a fórmula profética de declaração.
- source_word: אָמַר יְהוָה
  choice: diz Yahweh
  rationale: O presente comunica a proclamação profética vigente, e Yahweh representa diretamente o nome divino יהוה.
- source_word: שִׁמְרוּ מִשְׁפָּט
  choice: Preservem o direito
  rationale: O imperativo plural שִׁמְרוּ pede observância cuidadosa; “o direito” expressa מִשְׁפָּט como ordem e conduta justas, mantendo-o distinto de צְדָקָה.
- source_word: וַעֲשׂוּ צְדָקָה
  choice: e pratiquem a justiça
  rationale: “Pratiquem” é natural em português para uma qualidade ética posta em ação; “justiça” conserva o peso moral e teológico de צְדָקָה.
- source_word: כִּי קְרוֹבָה יְשׁוּעָתִי לָבוֹא
  choice: pois a minha salvação está perto de chegar
  rationale: Mantém a relação causal de כִּי e expressa de maneira clara a iminência indicada por קְרוֹבָה ... לָבוֹא.
- source_word: וְצִדְקָתִי לְהִגָּלוֹת
  choice: e a minha justiça, de ser revelada
  rationale: Preserva o paralelismo elíptico com “está perto” e a voz passiva de לְהִגָּלוֹת, sem restringir צִדְקָתִי a apenas um aspecto.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Translitera o nome da aliança presente no texto hebraico, em vez de substituí-lo por um título.
- issue: Relação entre מִשְׁפָּט e צְדָקָה
  choice: o direito ... a justiça
  alternative: a justiça ... a retidão
  rationale: 'Mantém distintos os dois termos éticos relacionados: מִשְׁפָּט como direito ou ordem justa, e צְדָקָה como justiça praticada.'
- issue: Sentido de צִדְקָתִי aplicado a Deus
  choice: a minha justiça
  alternative: a minha retidão; a minha vindicação
  rationale: “Justiça” preserva a amplitude entre o caráter justo de Deus, sua ação salvadora e sua vindicação, sem decidir indevidamente entre esses sentidos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com imperativos no plural. A pontuação explicita a elipse hebraica de “está perto” no segundo membro. Os marcadores foram colocados junto aos termos a que suas alternativas lexicais efetivamente se referem.
