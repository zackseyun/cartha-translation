  text: וַ/הֲבִיאוֹתִ֞י/ם אֶל הַ֣ר קָדְשִׁ֗/י וְ/שִׂמַּחְתִּי/ם֙ בְּ/בֵ֣ית תְּפִלָּתִ֔/י עוֹלֹתֵי/הֶ֧ם וְ/זִבְחֵי/הֶ֛ם לְ/רָצ֖וֹן עַֽל מִזְבְּחִ֑/י כִּ֣י בֵיתִ֔/י בֵּית תְּפִלָּ֥ה יִקָּרֵ֖א לְ/כָל הָ/עַמִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/007.yaml
  text: I will bring them to my holy mountain[a], and I will make them glad in my house of prayer; their burnt offerings and their sacrifices will be accepted on my altar, for my house will be called a house of prayer for all peoples.
translation:
  language: pt
  text: Eu os levarei ao meu santo monte e os encherei de alegria em minha casa de oração. Seus holocaustos e seus sacrifícios serão aceitos sobre o meu altar, pois a minha casa será chamada casa de oração para todos os povos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para todas as nações”. O termo hebraico עַמִּים pode significar “povos” ou “nações”; “povos” foi escolhido para preservar o alcance étnico inclusivo no contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲבִיאוֹתִים
  choice: Eu os levarei
  rationale: O hifil de בוא, com Deus como sujeito e objeto masculino plural, expressa movimento causado por ele. “Eu os levarei” é natural em português e preserva claramente a iniciativa divina.
- source_word: אֶל הַר קָדְשִׁי
  choice: ao meu santo monte
  rationale: Tradução direta da construção possessiva, preservando a imagem de Sião e do monte do templo. “Santo monte” mantém o registro bíblico sem soar obscuro.
- source_word: וְשִׂמַּחְתִּים
  choice: e os encherei de alegria
  rationale: O piel de שׂמח indica que Deus lhes proporciona alegria. A formulação portuguesa comunica a força causativa de modo natural e digno.
- source_word: בְּבֵית תְּפִלָּתִי
  choice: em minha casa de oração
  rationale: Preserva a caracterização específica do templo como lugar de oração, sem ampliar o sentido para o conceito mais geral de culto.
- source_word: עוֹלֹתֵיהֶם
  choice: Seus holocaustos
  rationale: “Holocausto” é o termo sacrificial convencional em português para עוֹלָה, uma oferta inteiramente queimada, e distingue essa categoria dos sacrifícios mencionados em seguida.
- source_word: וְזִבְחֵיהֶם
  choice: e seus sacrifícios
  rationale: זֶבַח é um termo sacrificial mais amplo; “sacrifícios” fornece o equivalente geral adequado ao lado de “holocaustos”.
- source_word: לְרָצוֹן
  choice: serão aceitos
  rationale: No contexto sacrificial, רָצוֹן denota aceitação ou favor. A construção verbal é idiomática em português e conserva o sentido de aceitação diante de Deus.
- source_word: עַל מִזְבְּחִי
  choice: sobre o meu altar
  rationale: Equivalente direto e natural da expressão preposicional hebraica, mantendo a localização sacrificial.
- source_word: כִּי
  choice: pois
  rationale: Introduz a fundamentação da declaração anterior. “Pois” mantém o nexo explicativo e o registro elevado.
- source_word: בֵיתִי בֵית תְּפִלָּה
  choice: a minha casa será chamada casa de oração
  rationale: Mantém a repetição enfática de “casa” presente no hebraico e formula de maneira natural a declaração nominal.
- source_word: יִקָּרֵא
  choice: será chamada
  rationale: O nifal de קרא tem aqui sentido passivo de ser chamado ou designado; o futuro português corresponde diretamente à forma e ao contexto profético.
- source_word: לְכָל הָעַמִּים
  choice: para todos os povos
  rationale: “Povos” preserva o alcance étnico e coletivo de עַמִּים sem sugerir apenas Estados nacionais modernos. A preposição é entendida como benefativa ou final, não como marca do agente.
theological_decisions:
- issue: Alcance de לְכָל הָעַמִּים
  choice: para todos os povos
  alternative: para todas as nações
  rationale: O contexto trata da inclusão de estrangeiros na adoração ao SENHOR. “Povos” conserva o horizonte universal da expressão sem apagar seu cenário pactual nem restringi-la ao conceito político moderno de nações.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantiveram-se termos bíblico-sacrificiais reconhecíveis, como “holocaustos” e “altar”, e a repetição enfática de “casa”. O marcador da nota foi colocado após a expressão a que se refere.
