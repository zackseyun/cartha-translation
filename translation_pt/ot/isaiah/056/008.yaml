id: ISA.56.8
reference: Isaiah 56:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה מְקַבֵּ֖ץ נִדְחֵ֣י יִשְׂרָאֵ֑ל ע֛וֹד אֲקַבֵּ֥ץ עָלָ֖י/ו לְ/נִקְבָּצָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/008.yaml
  text: 'The declaration of the Lord GOD[b][a], who gathers the outcasts of Israel: I will gather still more to him besides those already gathered to him.'
translation:
  language: pt
  text: 'Oráculo do Senhor Yahweh[a], que reúne os dispersos de Israel: “Ainda reunirei outros a ele, além dos que já foram reunidos a ele.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, אֲדֹנָי יְהוָה (Adonai YHWH), literalmente “Senhor Yahweh”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Ainda reunirei outros a eles, além dos que já foram reunidos.” Os sufixos hebraicos estão no singular, mas podem ser entendidos em sentido coletivo e expressos no plural.'
    reason: alternative_reading
lexical_decisions:
- source_word: נְאֻם
  choice: Oráculo de
  rationale: Introduz um pronunciamento divino solene. “Oráculo de” conserva a forma nominal e é uma expressão corrente e digna no contexto profético.
- source_word: אֲדֹנָי יְהוָה
  choice: Senhor Yahweh
  rationale: 'Representa os dois elementos do título hebraico: אֲדֹנָי, “Senhor”, e o nome divino יְהוָה, “Yahweh”, sem substituir o nome da aliança por um título.'
- source_word: מְקַבֵּץ
  choice: que reúne
  rationale: O particípio caracteriza Yahweh como aquele que reúne; a oração relativa é clara e natural em português.
- source_word: נִדְחֵי יִשְׂרָאֵל
  choice: os dispersos de Israel
  rationale: Designa os israelitas afastados, expulsos ou espalhados. “Dispersos” preserva a amplitude do termo sem restringi-lo apenas ao exílio formal.
- source_word: עוֹד אֲקַבֵּץ
  choice: Ainda reunirei outros
  rationale: עוֹד tem força aditiva neste contexto, e “outros” torna natural em português a promessa de uma reunião adicional, implícita na construção hebraica.
- source_word: עָלָיו
  choice: a ele
  rationale: Mantém o sufixo masculino singular do hebraico e permite que Israel seja entendido coletivamente, sem convertê-lo silenciosamente em plural.
- source_word: לְנִקְבָּצָיו
  choice: além dos que já foram reunidos a ele
  rationale: Expressa a ideia aditiva da preposição e o resultado indicado pelo particípio passivo, preservando também a referência singular do sufixo.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוָה
  choice: Senhor Yahweh
  alternative: Senhor DEUS; Soberano Senhor
  rationale: A tradução mantém tanto o título אֲדֹנָי quanto o nome pessoal יְהוָה, evitando substituir o nome da aliança por outro título ou acrescentar a noção interpretativa de soberania.
- issue: Referente dos sufixos singulares em עָלָיו e לְנִקְבָּצָיו
  choice: 'Referência coletiva singular a Israel: “a ele”'
  alternative: 'Sentido coletivo vertido no plural: “a eles”'
  rationale: Os sufixos hebraicos são masculinos singulares. O texto principal conserva essa forma e sua possível personificação coletiva de Israel; a leitura plural, igualmente possível quanto ao sentido, é registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com formulação profética natural. “Oráculo” mantém a solenidade sem arcaísmo excessivo. A sintaxe singular deliberadamente incomum em “a ele” preserva a ambiguidade do hebraico, esclarecida em nota.
