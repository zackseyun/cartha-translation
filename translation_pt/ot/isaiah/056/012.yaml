base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/012.yaml
  text: Come[a], let me get wine, and let us fill ourselves with strong drink; and tomorrow will be like this day[b], great beyond measure.
translation:
  language: pt
  text: “Venham! Vou buscar vinho, e vamos nos fartar de bebida forte; amanhã será como hoje[a], e muito maior ainda!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “amanhã será como este dia — grande, e muito maior ainda”. A frase hebraica final intensifica a expectativa presunçosa de que o dia seguinte será ainda maior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵתָיוּ
  choice: Venham!
  rationale: Interjeição que convida um grupo; o imperativo plural explícita naturalmente o destinatário coletivo e preserva o tom festivo e insolente.
- source_word: אֶקְחָה
  choice: Vou buscar
  rationale: A forma volitiva de לקח expressa a disposição do falante; em português, “vou buscar” soa mais natural neste convite do que o literal “que eu pegue”.
- source_word: יַיִן
  choice: vinho
  rationale: Equivalente comum e direto do termo hebraico.
- source_word: וְנִסְבְּאָה
  choice: e vamos nos fartar
  rationale: O verbo סבא comunica saciedade ou consumo até se encher, especialmente de bebida; “nos fartar” preserva a ideia de excesso sem reduzir o sentido simplesmente a embriagar-se.
- source_word: שֵׁכָר
  choice: bebida forte
  rationale: Designa bebida alcoólica distinta do vinho; a expressão é ampla, compreensível e evita restringir anacronicamente o referente a cerveja ou destilado.
- source_word: וְהָיָה כָזֶה יוֹם מָחָר
  choice: amanhã será como hoje
  rationale: Reformula em português natural a expressão hebraica “o dia de amanhã será como este”, mantendo a comparação temporal.
- source_word: גָּדוֹל יֶתֶר מְאֹד
  choice: e ainda muito melhor
  rationale: A sequência intensifica a expectativa de que amanhã não apenas repetirá hoje, mas o superará amplamente. “Melhor” comunica naturalmente a avaliação dos festeiros, enquanto a nota registra uma alternativa mais formal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com discurso direto vivo. “Venham” e “vamos nos fartar” preservam o convite coletivo e o excesso implícito no contexto. A pontuação realça o tom presunçoso dos falantes sem acrescentar explicação ao texto.
