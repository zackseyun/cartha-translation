base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/005.yaml
  text: And I will give them[a], in my house and within my walls, a monument and a name better than sons and daughters[b]; I will give them an everlasting name that will not be cut off.
translation:
  language: pt
  text: Eu lhes darei, em minha casa e dentro dos meus muros, um memorial[a] e um nome melhores do que filhos e filhas; darei a cada um deles[b] um nome eterno, que não será cortado[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico literalmente: “uma mão e um nome”. Nesta expressão, “mão” pode designar um memorial ou monumento.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico passa de “lhes”, no plural, para “a ele”, no singular, individualizando a promessa feita ao grupo.
    reason: alternative_reading
  - marker: c
    text: 'Hebraico: “não será cortado”. A expressão pode evocar tanto a eliminação do nome como a interrupção da descendência.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Eu lhes darei
  rationale: נתן significa normalmente “dar”. A formulação mantém o futuro da promessa e o objeto plural לָהֶם.
- source_word: בְּבֵיתִי וּבְחֹמֹתַי
  choice: em minha casa e dentro dos meus muros
  rationale: Mantém “casa” sem restringi-la interpretativamente ao templo, enquanto “dentro dos meus muros” expressa com naturalidade a localização no recinto.
- source_word: יָד וָשֵׁם
  choice: um memorial e um nome
  rationale: יָד significa literalmente “mão”, mas nesta expressão designa algo que perpetua a memória. “Memorial” comunica o sentido sem eliminar a imagem literal, registrada em nota.
- source_word: טוֹב מִבָּנִים וּמִבָּנוֹת
  choice: melhores do que filhos e filhas
  rationale: O adjetivo hebraico qualifica o par “memorial e nome”; o plural “melhores” concorda naturalmente com os dois elementos em português e preserva “filhos e filhas”.
- source_word: אֶתֶּן לוֹ
  choice: darei a cada um deles
  rationale: O hebraico passa do plural לָהֶם ao singular לוֹ. A formulação individualiza a promessa sem empregar o masculino “a ele” de modo potencialmente ambíguo em português; a mudança de número é explicitada em nota.
- source_word: שֵׁם עוֹלָם
  choice: um nome eterno
  rationale: עוֹלָם indica duração permanente; “eterno” é corrente, digno e conciso.
- source_word: אֲשֶׁר לֹא יִכָּרֵת
  choice: que não será apagado
  rationale: כרת significa literalmente “ser cortado/eliminado”. Neste contexto, “apagado” exprime naturalmente em português a não extinção do nome; a imagem literal e sua possível ressonância são preservadas em nota.
theological_decisions:
- issue: Sentido idiomático de יָד וָשֵׁם
  choice: um memorial e um nome
  alternative: uma mão e um nome; um monumento e um nome
  rationale: A tradução comunica a promessa de memória e honra duradouras sem tornar a expressão opaca. A literalidade de “mão” permanece disponível na nota.
- issue: Mudança do plural לָהֶם para o singular לוֹ
  choice: darei a cada um deles
  alternative: darei a ele; darei a eles
  rationale: A opção preserva a individualização presente no Texto Massorético sem harmonizá-la simplesmente ao plural nem criar em português um referente masculino pouco claro.
- issue: Metáfora de כרת
  choice: não será apagado
  alternative: não será cortado; jamais será eliminado
  rationale: “Apagado” é uma expressão portuguesa natural para a extinção de um nome. A nota conserva o sentido literal e a tensão com a ideia de descendência interrompida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Evita linguagem denominacional e conserva por nota as imagens hebraicas e a mudança significativa de número.
