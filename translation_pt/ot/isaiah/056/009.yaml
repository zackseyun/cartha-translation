    issue: «todos os animais da floresta» não reflete a preposição ב em בַּיָּעַר.
    rationale: O hebraico identifica o segundo grupo como animais «na floresta», não simplesmente «da floresta». «Que estão na floresta» conserva o dado espacial e torna explícita, em português, a continuação elíptica da convocação.
  - severity: low
    issue: «animais» é menos específico que o referente selvagem de חַיְתוֹ neste contexto.
    rationale: «Animais selvagens» conserva a imagem concreta de feras convocadas, sem impor uma interpretação metafórica.
