  yaml_path: translation/ot/isaiah/056/009.yaml
  text: All you beasts of the field[b][a], come to devour— all you beasts of the forest.
translation:
  language: pt
  text: Todos vocês, animais selvagens do campo[b], venham devorar[a] — todos vocês, animais selvagens que estão na floresta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “comer” ou “consumir”. O verbo hebraico é o verbo comum para comer; “devorar” ressalta a força predatória do contexto.
    reason: lexical_alternative
  - marker: b
    text: A convocação dos animais provavelmente retrata a chegada do juízo; alguns intérpretes entendem esses animais como imagem de inimigos invasores.
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּל
  choice: todos
  rationale: O quantificador abrange coletivamente a totalidade dos animais convocados e soa natural em português.
- source_word: חַיְתוֹ
  choice: animais
  rationale: No paralelismo com campo e floresta, חיה designa animais selvagens. “Animais” é claro e atual; o contexto predatório fornece o sentido de feras sem exigir vocabulário arcaizante.
- source_word: שָׂדָי
  choice: do campo
  rationale: Tradução direta e corrente, em contraste poético com a floresta.
- source_word: אֵתָיוּ
  choice: venham
  rationale: O imperativo plural convoca diretamente os animais; “venham” reproduz essa força em português natural.
- source_word: לֶאֱכֹל
  choice: devorar
  rationale: O verbo comum significa “comer”, mas, na convocação de animais selvagens em contexto de juízo, “devorar” comunica adequadamente sua força predatória.
- source_word: בַּיָּעַר
  choice: da floresta
  rationale: Embora a forma hebraica contenha a preposição ב, a expressão identifica os animais por seu habitat; “animais da floresta” preserva o paralelismo natural com “animais do campo”.
theological_decisions:
- issue: Imagem profética dos animais convocados
  choice: Manter no texto a convocação literal de animais como imagem de juízo iminente
  alternative: Interpretar os animais diretamente como nações hostis ou invasores
  rationale: O hebraico se dirige explicitamente aos animais e os chama para devorar. A possível referência implícita a invasores deve ser registrada sem substituir a imagem concreta nem eliminar sua tensão interpretativa.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A ordem dos marcadores foi ajustada para que [b] acompanhe “animais do campo” e [a] acompanhe “devorar”. O travessão conserva a pausa enfática do paralelismo.
