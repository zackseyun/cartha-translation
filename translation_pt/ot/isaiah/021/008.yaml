base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/008.yaml
  text: Then he cried[a], “A lion! On the watchtower, my lord, I stand continually by day[b], and at my post I am stationed all the nights.”
translation:
  language: pt
  text: 'Então ele gritou[a]: “Um leão! Meu senhor, fico continuamente de pé na torre de vigia durante o dia e permaneço estacionado no meu posto todas as noites.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “Um leão!” ou “Leão!” A expressão é difícil; alguns a entendem no sentido de “como um leão”, descrevendo a maneira de gritar.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: Então ele gritou
  rationale: O wayyiqtol de קרא dá continuidade à narrativa e, neste contexto urgente, significa chamar ou gritar em voz alta.
- source_word: אַרְיֵה
  choice: Um leão!
  rationale: Reproduz diretamente o substantivo massorético e preserva a dificuldade sintática, sem acrescentar silenciosamente uma comparação ausente no texto consonantal.
- source_word: עַל מִצְפֶּה
  choice: na torre de vigia
  rationale: מִצְפֶּה designa um ponto elevado de observação ou posto de vigia; a expressão é clara e natural em português.
- source_word: אֲדֹנָי
  choice: meu senhor
  rationale: A forma com sufixo de primeira pessoa é um tratamento dirigido ao superior que recebe o relatório, não o nome divino.
- source_word: אָנֹכִי עֹמֵד תָּמִיד יוֹמָם
  choice: permaneço continuamente ... durante o dia
  rationale: O pronome explícito e o particípio exprimem presença enfática e duradoura; תָּמִיד reforça a continuidade, e יוֹמָם indica o período diurno.
- source_word: וְעַל מִשְׁמַרְתִּי
  choice: e ... no meu posto
  rationale: מִשְׁמֶרֶת pode indicar a guarda, o turno ou o lugar designado; “meu posto” comunica naturalmente o cenário de sentinela.
- source_word: אָנֹכִי נִצָּב
  choice: fico de prontidão
  rationale: O particípio nifal descreve alguém colocado e mantido em posição; a formulação evita repetição mecânica e conserva a ideia de estar estacionado.
- source_word: כָּל הַלֵּילוֹת
  choice: todas as noites
  rationale: Mantém o plural explícito e expressa de modo idiomático a vigilância noturna repetida.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para que o discurso soe natural, sem eliminar a dificuldade do hebraico em אַרְיֵה. O contraste entre o dia e as noites foi mantido.
