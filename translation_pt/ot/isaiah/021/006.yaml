  text: כִּ֣י כֹ֥ה אָמַ֛ר אֵלַ֖/י אֲדֹנָ֑/י לֵ֚ךְ הַעֲמֵ֣ד הַֽ/מְצַפֶּ֔ה אֲשֶׁ֥ר יִרְאֶ֖ה יַגִּֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/006.yaml
  text: 'For thus the Lord said to me: “Go[a], station the watchman; let him report what he sees.”'
translation:
  language: pt
  text: 'Pois assim me disse o Senhor: “Vá, ponha o vigia em seu posto; que ele anuncie o que vir.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a fundamentação do que precede e preserva com naturalidade a conexão discursiva.
- source_word: כֹה אָמַר
  choice: assim me disse
  rationale: Reproduz a fórmula de fala em uma moldura narrativa, mantendo o perfeito אָמַר como passado simples.
- source_word: אֲדֹנָי
  choice: o Senhor
  rationale: Traduz o título divino אֲדֹנָי, sem tratá-lo como o nome YHWH nem forçar a forma possessiva 'meu Senhor'.
- source_word: לֵךְ
  choice: Vá
  rationale: Imperativo direto e natural no português moderno.
- source_word: הַעֲמֵד הַמְצַפֶּה
  choice: ponha o vigia em seu posto
  rationale: Expressa a força causativa do hifil de עמד e o contexto de alguém colocado em posição para observar.
- source_word: אֲשֶׁר יִרְאֶה
  choice: o que vir
  rationale: A oração relativa indica o conteúdo que deverá ser anunciado; o futuro do subjuntivo é idiomático após 'o que' com referência prospectiva.
- source_word: יַגִּיד
  choice: que ele anuncie
  rationale: Representa a força jussiva do imperfeito hifil e o sentido de tornar conhecido aquilo que for visto.
theological_decisions:
- issue: Tradução do título divino אֲדֹנָי
  choice: o Senhor
  alternative: meu Senhor
  rationale: O termo é um título divino, não o tetragrama. 'O Senhor' comunica o título em português corrente sem introduzir uma distinção possessiva excessiva.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase foi levemente ajustada à sintaxe natural do português, sem apagar a sequência da comissão: ir, posicionar o vigia e ordenar que relate o que vir.'
