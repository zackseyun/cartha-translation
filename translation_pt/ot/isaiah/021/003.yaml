  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עַל כֵּ֗ן מָלְא֤וּ מָתְנַ/י֙ חַלְחָלָ֔ה צִירִ֣ים אֲחָז֔וּ/נִי כְּ/צִירֵ֖י יֽוֹלֵדָ֑ה נַעֲוֵ֣יתִי מִ/שְּׁמֹ֔עַ נִבְהַ֖לְתִּי מֵ/רְאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/003.yaml
  text: Therefore my loins are filled with anguish[a]; pains have seized me like the pains of a woman giving birth. I am bent over from hearing[b]; I am dismayed from seeing.
translation:
  language: pt
  text: Por isso, meus lombos estão tomados de angústia[a]; dores se apoderaram de mim, como as dores de uma mulher que dá à luz. Fiquei encurvado pelo que ouvi[b]; fiquei apavorado com o que vi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «tremor». O termo hebraico descreve intenso abalo corporal ou aflição que faz alguém se contorcer.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «Fiquei retorcido» ou «fiquei dobrado» pelo que ouvi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָלְאוּ מָתְנַי
  choice: meus lombos estão tomados
  rationale: Preserva a imagem corporal concreta de מָתְנַיִם, enquanto «estão tomados» comunica em português natural o estado de estar cheio ou dominado pela aflição.
- source_word: חַלְחָלָה
  choice: angústia
  rationale: O substantivo descreve tremor intenso, contorção ou aflição física; «angústia» se ajusta ao contexto de sofrimento visceral, com a alternativa concreta indicada em nota.
- source_word: צִירִים
  choice: dores
  rationale: O termo pode designar dores ou convulsões, particularmente dores de parto; a escolha mantém clara a comparação subsequente.
- source_word: אֲחָזוּנִי
  choice: se apoderaram de mim
  rationale: Expressa a força de algo que agarra e domina o falante, de modo corrente e digno em português.
- source_word: כְּצִירֵי יוֹלֵדָה
  choice: como as dores de uma mulher que dá à luz
  rationale: Reproduz explicitamente a imagem hebraica do parto sem reduzi-la a uma expressão abstrata.
- source_word: נַעֲוֵיתִי
  choice: fiquei encurvado
  rationale: O Nifal pode indicar ficar torcido, dobrado ou encurvado; esta formulação comunica claramente o efeito corporal da aflição.
- source_word: מִשְּׁמֹעַ
  choice: pelo que ouvi
  rationale: Interpreta מן com o infinitivo em sentido causal e produz uma formulação natural, mantendo o paralelismo com «com o que vi».
- source_word: נִבְהַלְתִּי
  choice: fiquei apavorado
  rationale: O verbo denota perturbação súbita, alarme ou terror; o contexto intenso favorece «apavorado», sem eliminar a possibilidade de «consternado».
- source_word: מֵרְאוֹת
  choice: com o que vi
  rationale: Expressa naturalmente a relação causal e preserva o paralelo entre ouvir e ver.
theological_decisions: []
