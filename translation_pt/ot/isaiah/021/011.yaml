  text: מַשָּׂ֖א דּוּמָ֑ה אֵלַ/י֙ קֹרֵ֣א מִ/שֵּׂעִ֔יר שֹׁמֵר֙ מַה מִ/לַּ֔יְלָה שֹׁמֵ֖ר מַה מִ/לֵּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/011.yaml
  text: 'An oracle concerning Dumah: One calls to me from Seir[a], “Watchman, what of the night? Watchman[b], what of the night?”'
translation:
  language: pt
  text: 'Oráculo a respeito de Dumá:


    Alguém me chama de Seir[a]:


    “Sentinela, quanto resta da noite?[b]


    Sentinela, quanto resta da noite?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dumá também pode evocar a palavra hebraica para “silêncio”; alguns intérpretes a relacionam a Edom porque a linha seguinte menciona Seir.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Como vai a noite?” A expressão hebraica pergunta pelo estado ou avanço da noite.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַשָּׂא
  choice: oráculo
  rationale: Em títulos proféticos, introduz uma declaração divina. “Oráculo” é corrente, digno e evita o sentido concreto potencialmente enganoso de “peso”.
- source_word: דּוּמָה
  choice: Dumá
  rationale: O contexto favorece um nome próprio no cabeçalho. A transliteração preserva a identificação sem decidir se é referência direta ou indireta a Edom.
- source_word: אֵלַי קֹרֵא
  choice: Alguém me chama
  rationale: O particípio masculino singular não traz sujeito expresso; “alguém” mantém essa indefinição de modo natural em português.
- source_word: מִשֵּׂעִיר
  choice: de Seir
  rationale: A preposição indica a origem do chamado, e Seir é mantido como nome geográfico.
- source_word: שֹׁמֵר
  choice: Sentinela
  rationale: É um vocativo dirigido a quem monta guarda. “Sentinela” comunica naturalmente a imagem da vigília noturna e permite conservar a repetição.
- source_word: מַה מִלַּיְלָה / מַה מִלֵּיל
  choice: quanto falta para acabar a noite?
  rationale: A expressão pergunta pelo estado ou avanço da noite, não simplesmente qual noite é. A formulação idiomática comunica esse sentido em português, mantendo idênticas as duas perguntas apesar da variação poética hebraica.
theological_decisions:
- issue: Identidade de דּוּמָה
  choice: Nome próprio “Dumá” no texto principal
  alternative: “silêncio” como substantivo comum ou referência indireta a Edom
  rationale: A forma de cabeçalho favorece um lugar ou povo, enquanto a menção de Seir sugere ambiente edomita. A transliteração não resolve indevidamente a identificação; o possível jogo lexical é registrado em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O paralelismo e a repetição poética foram preservados; a expressão temporal foi vertida de forma idiomática, sem perder a pergunta sobre o avanço da noite.
