  source_fidelity: 'A estrutura e os elementos centrais do hebraico estão bem representados: «oráculo», Dumá, o chamado indefinido dirigido ao vigia, Seir e a repetição da pergunta. Contudo, «quanto falta para acabar a noite?» explicita de modo excessivo o término da noite; o hebraico pergunta idiomaticamente por sua condição/progresso, sem declarar de forma tão definida que se trata do tempo até seu fim.'
