source:
  edition: WLC
  text: כִּי כֹ֛ה אָמַ֥ר אֲדֹנָ֖/י אֵלָ֑/י בְּ/ע֤וֹד שָׁנָה֙ כִּ/שְׁנֵ֣י שָׂכִ֔יר וְ/כָלָ֖ה כָּל כְּב֥וֹד קֵדָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/016.yaml
  text: 'For thus the Lord said to me: Within a year[a], like the years of a hired worker, all the glory of Kedar will come to an end.'
translation:
  language: pt
  text: 'Pois assim me disse o Senhor: “Dentro de um ano, como os anos de um assalariado, toda a glória[a] de Quedar chegará ao fim.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esplendor”, “honra” ou “riqueza”. A palavra hebraica pode indicar glória, honra, esplendor ou abundância material.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כֹה אָמַר
  choice: Pois assim me disse
  rationale: Preserva tanto a ligação explicativa de כִּי com o contexto anterior quanto a fórmula declarativa כֹה אָמַר, em português natural e digno.
- source_word: אֲדֹנָי
  choice: o Senhor
  rationale: Traduz o título divino אֲדֹנָי sem empregar a convenção gráfica normalmente reservada ao nome YHWH.
- source_word: בְּעוֹד שָׁנָה
  choice: Dentro de um ano
  rationale: Expressa de modo corrente o período restante até o cumprimento da declaração.
- source_word: כִּשְׁנֵי שָׂכִיר
  choice: contado como o ano de um trabalhador contratado
  rationale: Mantém a comparação com o período rigorosamente contado por quem trabalha mediante contrato, tornando clara sua relação com o prazo de um ano sem eliminar a imagem hebraica.
- source_word: וְכָלָה
  choice: chegará ao fim
  rationale: Comunica naturalmente a ideia de cessação ou esgotamento expressa pelo verbo כלה neste contexto.
- source_word: כָּל כְּבוֹד
  choice: toda a glória
  rationale: Mantém a abrangência de כָּל e usa o equivalente mais amplo de כָּבוֹד, deixando em nota suas possíveis nuances de esplendor e riqueza.
- source_word: קֵדָר
  choice: Quedar
  rationale: Emprega a forma portuguesa tradicional e reconhecível do nome do povo ou região árabe.
theological_decisions:
- issue: Tradução do título divino אֲדֹנָי
  choice: o Senhor
  alternative: SENHOR
  rationale: O texto hebraico traz o título אֲדֹנָי, não o nome divino YHWH; por isso, usa-se a forma titular comum, sem versaletes.
- issue: Sentido de כְּבוֹד no anúncio de juízo
  choice: glória
  alternative: esplendor ou riqueza
  rationale: O termo pode abranger honra, esplendor e abundância material. A tradução principal conserva essa amplitude, e a nota registra as nuances possíveis sem restringir indevidamente o sentido.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. O marcador da nota foi colocado após “glória”, termo ao qual a alternativa lexical efetivamente se refere.
