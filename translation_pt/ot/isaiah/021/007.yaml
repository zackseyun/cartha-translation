revisions:
- from: Então ele viu uma coluna de cavaleiros, dois a dois, uma coluna de homens montados em jumentos e uma coluna de homens montados em camelos;[a] e escutou com muita atenção.[b]
  to: E viu uma tropa de cavaleiros em pares, uma tropa de jumentos e uma tropa de camelos;[a] e escutou com muita atenção.[b]
  rationale: A revisão elimina especificações não exigidas pelo hebraico — a formação em “coluna” e a identificação certa de homens montados em jumentos e camelos — e mantém o sentido coletivo favorecido pelo contexto e pelo histórico de auditoria em inglês. Também troca “Então” por “E”, preservando a coordenação do texto-fonte. As notas mantêm explicitamente as alternativas relevantes, sem impor uma reconstrução histórica única.
