  text: וְ/רָ֣אָה רֶ֗כֶב צֶ֚מֶד פָּֽרָשִׁ֔ים רֶ֥כֶב חֲמ֖וֹר רֶ֣כֶב גָּמָ֑ל וְ/הִקְשִׁ֥יב קֶ֖שֶׁב רַב קָֽשֶׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/007.yaml
  text: And he saw riders, pairs of horsemen[a], riders on donkeys, riders on camels; and he listened intently, with great attentiveness.
translation:
  language: pt
  text: E viu uma tropa de cavaleiros em pares, uma tropa de jumentos e uma tropa de camelos;[a] e escutou com muita atenção.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra hebraica traduzida por “tropa” também pode referir-se a carro(s), cavalaria ou a um contingente. Assim, as expressões relativas a jumentos e camelos podem ser entendidas de mais de uma maneira.
    reason: Preserva a amplitude lexical de רֶכֶב e a ambiguidade das três expressões paralelas.
  - marker: b
    text: Hebraico, literalmente, “atenção, muita atenção” ou “escutou, escutando muito”; a repetição ressalta a intensidade de sua escuta.
    reason: Explica a construção enfática do hebraico.
lexical_decisions:
- source_word: וְרָאָה
  choice: Então ele viu
  rationale: O qal perfeito com waw dá continuidade à cena profética. “Então” expressa essa progressão narrativa em português natural sem impor uma relação causal.
- source_word: רֶכֶב
  choice: uma coluna de cavaleiros / uma coluna de homens montados
  rationale: רֶכֶב pode designar carro, cavalaria ou um contingente montado. Os termos paralelos referentes a jumentos e camelos favorecem aqui o sentido coletivo de grupos montados; “coluna” conserva a ideia de uma formação observada à distância.
- source_word: צֶמֶד פָּרָשִׁים
  choice: cavaleiros, dois a dois
  rationale: צֶמֶד indica um par, enquanto פָּרָשִׁים designa cavaleiros. A formulação comunica claramente que avançavam em pares e se ajusta ao sentido coletivo de רֶכֶב.
- source_word: רֶכֶב חֲמוֹר
  choice: uma coluna de homens montados em jumentos
  rationale: No paralelismo da passagem, a expressão é entendida como um contingente que usava jumentos como montaria, evitando a imagem improvável de jumentos puxando carros.
- source_word: רֶכֶב גָּמָל
  choice: uma coluna de homens montados em camelos
  rationale: Mantém o paralelismo com a expressão anterior e explicita em português natural o provável sentido de um grupo montado.
- source_word: וְהִקְשִׁיב קֶשֶׁב רַב קָשֶׁב
  choice: e escutou com muita atenção
  rationale: O hifil de קשׁב expressa escuta concentrada, e a repetição enfática do substantivo é comunicada de modo natural por “com muita atenção”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “uma coluna” mantém a estrutura paralela da visão, enquanto “homens montados” evita usar “cavaleiros” para quem monta jumentos ou camelos.
