  text: וְ/הִנֵּה זֶ֥ה בָא֙ רֶ֣כֶב אִ֔ישׁ צֶ֖מֶד פָּֽרָשִׁ֑ים וַ/יַּ֣עַן וַ/יֹּ֗אמֶר נָפְלָ֤ה נָֽפְלָה֙ בָּבֶ֔ל וְ/כָל פְּסִילֵ֥י אֱלֹהֶ֖י/הָ שִׁבַּ֥ר לָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/009.yaml
  text: And look[a], here comes a chariot, a man with a pair of horsemen. And he answered and said, “Fallen, fallen is Babylon[c][b], and all the carved images of her gods he has shattered to the ground.”
translation:
  language: pt
  text: 'E eis que aí vem um carro, um homem com uma dupla de cavaleiros.[a] Então ele respondeu e disse: “Caiu, caiu Babilônia! E despedaçou[c] por terra todas as imagens esculpidas[b] dos deuses dela.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica é muito condensada e também pode ser entendida como “um carro com homens, uma dupla de cavaleiros”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os ídolos”.'
    reason: lexical_alternative
  - marker: c
    text: O hebraico diz “despedaçou”, mas não declara quem praticou a ação; o agente deve ser entendido pelo contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E vejam
  rationale: Reproduz a introdução dêitica e vívida em português atual, sem recorrer ao mais solene e menos corrente “e eis que”.
- source_word: זֶה בָא
  choice: aí vem
  rationale: Expressa com naturalidade a imediatez do hebraico, como se o observador apontasse o que se aproxima.
- source_word: רֶכֶב אִישׁ צֶמֶד פָּרָשִׁים
  choice: um carro, um homem com uma dupla de cavaleiros
  rationale: Mantém a formulação nominal comprimida e sua dificuldade sintática, sem transformar com certeza a cena em uma tropa, tripulação ou formação específica.
- source_word: וַיַּעַן וַיֹּאמֶר
  choice: Então ele respondeu e disse
  rationale: Conserva os dois verbos da fórmula hebraica de introdução da fala, embora a expressão seja mais marcada em português.
- source_word: נָפְלָה נָפְלָה
  choice: Caiu, caiu
  rationale: Preserva a repetição enfática, a concisão e a força da proclamação profética.
- source_word: בָּבֶל
  choice: Babilônia
  rationale: Forma portuguesa consagrada do topônimo.
- source_word: פְּסִילֵי אֱלֹהֶיהָ
  choice: as imagens esculpidas dos deuses dela
  rationale: “Imagens esculpidas” traduz concretamente o substantivo, enquanto “dos deuses dela” deixa claro que o sufixo feminino remete a Babilônia.
- source_word: שִׁבַּר
  choice: despedaçou
  rationale: Comunica a destruição vigorosa indicada pelo verbo e conserva a flexão ativa masculina singular sem nomear o agente.
- source_word: לָאָרֶץ
  choice: no chão
  rationale: É a expressão portuguesa natural para o resultado ou direção da derrubada completa.
theological_decisions:
- issue: Agente do ato de despedaçar na oração final
  choice: 'Manter o verbo ativo na terceira pessoa do singular, com sujeito oculto: “despedaçou”.'
  alternative: Explicitar “ele”, usar o plural impessoal “despedaçaram” ou empregar a passiva “foram despedaçadas”.
  rationale: O hebraico traz um verbo masculino singular sem sujeito expresso. O sujeito oculto em português preserva essa forma e evita decidir se o agente é divino, humano ou retomado do contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “E vejam” e “aí vem” dão vivacidade à visão; a construção incomum da força que se aproxima e a identidade não declarada do agente final foram deliberadamente preservadas.
