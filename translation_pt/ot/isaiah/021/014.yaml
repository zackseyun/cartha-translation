id: ISA.21.14
reference: Isaiah 21:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לִ/קְרַ֥את צָמֵ֖א הֵתָ֣יוּ מָ֑יִם יֹשְׁבֵי֙ אֶ֣רֶץ תֵּימָ֔א בְּ/לַחְמ֖/וֹ קִדְּמ֥וּ נֹדֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/014.yaml
  text: Bring water to meet the thirsty[a]; O inhabitants of the land of Tema[b], meet the fugitive with bread.
translation:
  language: pt
  text: Levem água ao encontro de quem tem sede; habitantes da terra de Temá[b], vão ao encontro do fugitivo com pão[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz literalmente “com o pão dele”. A expressão pode indicar o pão ou as provisões levados ao fugitivo, ou o ato de ir ao encontro dele acompanhado de pão.
    reason: lexical_alternative
  - marker: b
    text: Temá era um oásis e uma região da Arábia associados a rotas de caravanas.
    reason: cultural_note
lexical_decisions:
- source_word: לִקְרַאת
  choice: ao encontro de
  rationale: A locução expressa movimento em direção a alguém para encontrá-lo e funciona naturalmente nos dois segmentos do versículo.
- source_word: צָמֵא
  choice: quem tem sede
  rationale: O adjetivo singular substantivado pode representar uma pessoa ou uma categoria; esta formulação é natural em português sem fixar indevidamente o número.
- source_word: הֵתָיוּ
  choice: levem
  rationale: O imperativo plural, com “água” como objeto, é entendido no contexto como ordem para levar ou apresentar algo.
- source_word: מָיִם
  choice: água
  rationale: Correspondência lexical direta e idiomática em português.
- source_word: יֹשְׁבֵי אֶרֶץ תֵּימָא
  choice: habitantes da terra de Temá
  rationale: A expressão funciona como vocativo dirigido à população da região; o topônimo é transliterado.
- source_word: בְּלַחְמוֹ
  choice: com pão
  rationale: A formulação concisa comunica o fornecimento de alimento sem decidir no texto principal como deve ser entendido o sufixo masculino singular; a nota preserva a forma e a ambiguidade do hebraico.
- source_word: קִדְּמוּ
  choice: vão ao encontro de
  rationale: O piel indica sair ou ir ao encontro de alguém; a forma verbal explicita naturalmente em português a ação solicitada.
- source_word: נֹדֵד
  choice: o fugitivo
  rationale: Neste contexto de fuga e deslocamento, o particípio designa mais provavelmente alguém que foge, não apenas um viajante ou andarilho.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com imperativos no plural. “Temá” segue a acentuação natural portuguesa. A ordem das notas acompanha as palavras a que se referem no texto, embora os marcadores mantenham as letras fornecidas.
