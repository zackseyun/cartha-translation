  text: כִּֽי מִ/פְּנֵ֥י חֲרָב֖וֹת נָדָ֑דוּ מִ/פְּנֵ֣י חֶ֣רֶב נְטוּשָׁ֗ה וּ/מִ/פְּנֵי֙ קֶ֣שֶׁת דְּרוּכָ֔ה וּ/מִ/פְּנֵ֖י כֹּ֥בֶד מִלְחָמָֽה־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/015.yaml
  text: For they have fled from swords[a], from the drawn sword, and from the bent bow[c][b], and from the weight of battle.
translation:
  language: pt
  text: Pois eles fugiram das espadas, da espada desembainhada[a], do arco retesado[b] e do peso da batalha[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da espada brandida”. O termo hebraico descreve uma espada estendida ou preparada para uso.
    reason: lexical_alternative
  - marker: b
    text: Ou “do arco armado”. O hebraico descreve um arco tensionado e pronto para disparar.
    reason: lexical_alternative
  - marker: c
    text: Ou “da violência da guerra”. Em termos literais, o hebraico diz “o peso da batalha/guerra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da declaração anterior e preserva de modo natural o valor explicativo da conjunção.
- source_word: מִפְּנֵי
  choice: de / diante de
  rationale: A preposição, repetida quatro vezes no hebraico, indica afastamento diante de uma ameaça. Em português, a primeira ocorrência é integrada a “fugiram das”, e as seguintes ficam naturalmente subentendidas na enumeração.
- source_word: חֲרָבוֹת
  choice: espadas
  rationale: Tradução direta do plural, que apresenta de forma geral a ameaça de armas brancas.
- source_word: נָדָדוּ
  choice: fugiram
  rationale: No contexto de perigo militar, o verbo descreve fuga, não deslocamento sem rumo.
- source_word: חֶרֶב נְטוּשָׁה
  choice: espada desembainhada
  rationale: Expressa uma espada estendida ou preparada para uso. “Desembainhada” é claro e idiomático em português, embora “brandida” também seja possível.
- source_word: קֶשֶׁת דְּרוּכָה
  choice: arco retesado
  rationale: Retrata o arco tensionado e pronto para disparar; “retesado” conserva a imagem física e é uma expressão corrente para essa arma.
- source_word: כֹּבֶד מִלְחָמָה
  choice: peso da batalha
  rationale: Mantém a metáfora hebraica de peso ou gravidade e a aplica ao combate imediato sem reduzi-la silenciosamente a “violência” ou “intensidade”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A repetição integral de מִפְּנֵי foi suavizada na enumeração portuguesa sem perder a ideia de fuga diante de cada ameaça; preservou-se a metáfora “peso da batalha”.
