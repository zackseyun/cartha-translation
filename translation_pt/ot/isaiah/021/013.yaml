  yaml_path: translation/ot/isaiah/021/013.yaml
  text: 'An oracle concerning Arabia: In the forest in Arabia you will spend the night[c][b][a], O caravans of Dedanites.'
translation:
  language: pt
  text: 'Oráculo[a] a respeito da Arábia:


    Na mata[b], na Arábia,

    vocês passarão a noite,

    ó caravanas[c] de dedanitas!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Pronunciamento a respeito da Arábia” ou “Peso a respeito da Arábia”. Em títulos proféticos, o hebraico מַשָּׂא pode designar uma mensagem solene.
    reason: lexical_alternative
  - marker: b
    text: Ou “no bosque” ou “no matagal”. O hebraico יַעַר normalmente significa “mata” ou “floresta”, mas neste cenário pode indicar uma região de vegetação arbustiva.
    reason: cultural_note
  - marker: c
    text: O hebraico אֹרְחוֹת pode significar literalmente “caminhos” ou “rotas”, mas aqui provavelmente se refere a grupos de viajantes, isto é, caravanas.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  choice: Oráculo
  rationale: Em títulos proféticos, o termo introduz uma mensagem ou pronunciamento profético. “Oráculo” preserva essa função e mantém a dignidade do registro; a alternativa mais literal “peso” não comunica naturalmente o sentido em português moderno.
- source_word: בַּעְרָב
  choice: a respeito da Arábia
  rationale: Depois de מַשָּׂא, a preposição indica naturalmente o assunto do oráculo. “A respeito de” preserva a amplitude da construção hebraica sem pressupor que a mensagem seja necessariamente contra a Arábia.
- source_word: בַּיַּעַר
  choice: Na mata
  rationale: יַעַר normalmente designa mata, bosque ou floresta. “Mata” é natural em português, mantém a imagem do hebraico e também pode abranger a vegetação menos densa provável no ambiente árabe.
- source_word: בַּעְרַב
  choice: da Arábia
  rationale: A vocalização massorética e a repetição do topônimo do título favorecem a referência geográfica. A formulação “mata da Arábia” é natural e preserva a relação entre os dois termos.
- source_word: תָּלִינוּ
  choice: vocês passarão a noite
  rationale: O verbo לין significa alojar-se ou permanecer durante a noite. “Passarão a noite” expressa com clareza tanto o valor temporal como a forma verbal de segunda pessoa do plural.
- source_word: אֹרְחוֹת
  choice: caravanas
  rationale: Embora o substantivo possa significar literalmente “caminhos” ou “rotas”, aqui ele designa metonimicamente grupos de viajantes. “Caravanas” corresponde ao contexto de viagem e comércio na Arábia.
- source_word: דְּדָנִים
  choice: de dedanitas
  rationale: A forma identifica pessoas ligadas a Dedã. Com אֹרְחוֹת, forma a expressão “caravanas de dedanitas”, usada aqui como chamamento direto.
