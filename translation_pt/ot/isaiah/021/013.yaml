translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A disposição em linhas conserva o caráter poético. “Ó” marca explicitamente o vocativo presente no contexto, sem tornar a frase arcaica; “dedanitas” é mantido em minúscula como gentílico.
