  text: וּ/שְׁאָ֧ר מִסְפַּר קֶ֛שֶׁת גִּבּוֹרֵ֥י בְנֵֽי קֵדָ֖ר יִמְעָ֑טוּ כִּ֛י יְהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל דִּבֵּֽר־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/017.yaml
  text: And the remainder of the number of the bowmen[a], the mighty men of the sons of Kedar, will be few, for Yahweh, the God of Israel[b], has spoken.
translation:
  language: pt
  text: E os que restarem dentre os arqueiros[a], os guerreiros dos filhos de Quedar, serão poucos, pois Yahweh, o Deus de Israel, falou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, «o restante do número do arco, os guerreiros dos filhos de Quedar». «Arco» é usado por metonímia para os arqueiros. Também se pode traduzir: «O restante do número de arqueiros, os guerreiros dos filhos de Quedar, será pequeno».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר מִסְפַּר
  choice: E os [...] que restarem
  rationale: Expressa em português natural a ideia quantitativa de ‘o restante do número’, sem atribuir ao termo um sentido teológico de remanescente.
- source_word: קֶשֶׁת
  choice: os arqueiros
  rationale: O hebraico diz literalmente ‘arco’, empregado aqui por metonímia para os homens armados com arco.
- source_word: גִּבּוֹרֵי
  choice: os guerreiros
  rationale: Neste contexto militar, גִּבּוֹרֵי designa homens valentes ou poderosos em combate; ‘guerreiros’ comunica diretamente esse sentido.
- source_word: בְנֵי קֵדָר
  choice: filhos de Quedar
  rationale: Preserva a expressão hebraica de parentesco usada como designação étnica, em linguagem bíblica ainda compreensível em português.
- source_word: יִמְעָטוּ
  choice: serão poucos
  rationale: 'Traduz o resultado expresso pelo verbo: os sobreviventes se reduzirão a um pequeno número.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta e corrente da construção hebraica.
- source_word: דִּבֵּר
  choice: falou
  rationale: O perfeito hebraico encerra o oráculo afirmando a certeza da palavra já pronunciada; o pretérito perfeito é natural em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o nome divino. ‘Yahweh’ representa o Tetragrama sem substituí-lo por ‘SENHOR’ e evita impor ao versículo uma leitura denominacional.
- issue: Relação sintática entre ‘arco’, ‘guerreiros’ e ‘filhos de Quedar’
  choice: os arqueiros que restarem entre os guerreiros dos filhos de Quedar
  alternative: o restante do número dos valentes arqueiros dos filhos de Quedar
  rationale: A sequência nominal hebraica é compacta e admite mais de uma análise. O texto principal oferece uma formulação clara sem eliminar a alternativa, registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. ‘Quedar’ segue a forma tradicional portuguesa do nome. A frase foi descompactada para soar natural, enquanto a nota preserva a forma literal e a ambiguidade sintática do hebraico.
