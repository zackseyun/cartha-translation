  text: חָז֥וּת קָשָׁ֖ה הֻגַּד לִ֑/י הַ/בּוֹגֵ֤ד בּוֹגֵד֙ וְ/הַ/שּׁוֹדֵ֣ד שׁוֹדֵ֔ד עֲלִ֤י עֵילָם֙ צוּרִ֣י מָדַ֔י כָּל אַנְחָתָ֖/ה הִשְׁבַּֽתִּי־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/002.yaml
  text: 'A harsh vision has been declared to me: the betrayer betrays[a], and the destroyer destroys. Go up, Elam; lay siege, Media[b]. I have put an end to all her groaning.'
translation:
  language: pt
  text: 'Uma visão severa me foi anunciada: o traidor trai[a], e o devastador devasta. Avance, Elão; sitie, Média. Fiz cessar todo o gemido dela[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o desleal age com deslealdade, e o saqueador saqueia”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente “todo o gemido dela”; o referente feminino não é identificado explicitamente neste versículo.
    reason: alternative_reading
lexical_decisions:
- source_word: חָזוּת קָשָׁה
  choice: uma visão severa
  rationale: חָזוּת designa uma visão profética, e קָשָׁה comunica dureza ou gravidade. “Visão severa” mantém o tom solene e ameaçador sem transformar a visão em mero oráculo falado.
- source_word: הֻגַּד לִי
  choice: me foi anunciada
  rationale: O passivo de נגד indica que a mensagem foi dada a conhecer ao profeta. A formulação é natural em português e conserva o registro profético.
- source_word: הַבּוֹגֵד בּוֹגֵד
  choice: o traidor trai
  rationale: A repetição da mesma raiz caracteriza o agente por sua ação e lhe dá força retórica. A repetição correspondente em português preserva esse efeito.
- source_word: וְהַשֹּׁדֵד שֹׁדֵד
  choice: e o devastador devasta
  rationale: שׁדד pode indicar devastação violenta ou saque. “Devastador devasta” conserva a repetição e abrange o cenário militar sem eliminar a possibilidade de saque.
- source_word: עֲלִי עֵילָם
  choice: Avance, Elão
  rationale: O imperativo de עלה convoca Elão a subir ou avançar para o ataque. “Avance” comunica naturalmente o sentido militar em português.
- source_word: צוּרִי מָדַי
  choice: ponha cerco, Média
  rationale: צור é usado aqui no sentido de cercar militarmente. “Ponha cerco” é uma ordem clara, enquanto “Média” mantém o nome convencional da região ou povo.
- source_word: כָּל אַנְחָתָהּ
  choice: todo o gemido dela
  rationale: אַנְחָה expressa gemido ou suspiro de aflição. “Dela” preserva o sufixo feminino singular e não identifica seu referente.
- source_word: הִשְׁבַּתִּי
  choice: Fiz cessar
  rationale: 'O hifil de שבת tem sentido causativo: fazer parar ou cessar. A tradução mantém diretamente essa força.'
theological_decisions:
- issue: Referente do sufixo feminino em כָּל אַנְחָתָהּ
  choice: Mantido implicitamente como “dela”.
  alternative: Identificá-lo como Babilônia, a terra ou os oprimidos.
  rationale: O verso não nomeia de modo explícito o referente do sufixo feminino singular. A tradução conserva essa ambiguidade em vez de resolvê-la interpretativamente.
translation_notes:
  register: Português moderno, solene e acessível. As repetições “o traidor trai” e “o devastador devasta” reproduzem o paralelismo enfático do hebraico. Os imperativos foram formulados de maneira natural para um contexto militar, e a ambiguidade do pronome feminino final foi preservada.
