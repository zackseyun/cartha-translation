  text: עָרֹ֧ךְ הַ/שֻּׁלְחָ֛ן צָפֹ֥ה הַ/צָּפִ֖ית אָכ֣וֹל שָׁתֹ֑ה ק֥וּמוּ הַ/שָּׂרִ֖ים מִשְׁח֥וּ מָגֵֽן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/005.yaml
  text: They set the table[a], they spread the rugs, they eat, they drink. Rise up, princes[b]; oil the shield.
translation:
  language: pt
  text: Preparam a mesa[a], estendem os tapetes, comem, bebem. Levantem-se, príncipes; untem o escudo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “observam a torre de vigia” / “põem uma sentinela”. O hebraico desta oração é difícil; o texto principal segue o sentido de preparação do banquete, que combina com a sequência ao redor.'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “untem o escudo”, isto é, preparem o escudo para a batalha aplicando-lhe óleo.
    reason: cultural_note
lexical_decisions:
- source_word: עָרֹךְ הַשֻּׁלְחָן
  choice: Põem a mesa
  rationale: A expressão preserva a imagem concreta de arrumar a mesa e soa natural em português, dentro da rápida sequência de ações.
- source_word: צָפֹה הַצָּפִית
  choice: estendem os tapetes
  rationale: Adota a leitura ligada à preparação do banquete, entendendo o substantivo raro como cobertura ou tapete, sem ocultar em nota a leitura alternativa ligada à vigilância.
- source_word: אָכוֹל שָׁתֹה
  choice: comem, bebem
  rationale: Os infinitivos absolutos produzem uma cena vívida; formas verbais finitas comunicam essa sequência com naturalidade em português.
- source_word: קוּמוּ
  choice: Levantem-se
  rationale: Imperativo plural que marca uma mudança brusca da cena de banquete para uma ordem urgente.
- source_word: הַשָּׂרִים
  choice: príncipes
  rationale: Preserva o provável nível social e o ambiente cortesão, embora o termo também possa designar autoridades ou líderes.
- source_word: מִשְׁחוּ מָגֵן
  choice: untem o escudo
  rationale: O verbo significa aplicar óleo ou untar. Esta formulação mantém a ação concreta de preparar o equipamento para a batalha, evitando a conotação predominantemente ritual de 'ungir' no português corrente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção breve e assindética conserva a rapidez dramática do hebraico e a mudança repentina do banquete para a preparação militar.
