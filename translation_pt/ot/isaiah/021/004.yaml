  text: תָּעָ֣ה לְבָבִ֔/י פַּלָּצ֖וּת בִּֽעֲתָ֑תְ/נִי אֵ֚ת נֶ֣שֶׁף חִשְׁקִ֔/י שָׂ֥ם לִ֖/י לַ/חֲרָדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/004.yaml
  text: My heart reels; shuddering terrifies me[a]. The twilight I longed for he has turned into terror for me.
translation:
  language: pt
  text: Meu coração cambaleia; um tremor me apavora. Ele transformou em terror para mim o crepúsculo que eu desejava.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תָּעָה
  choice: cambaleia
  rationale: O verbo denota andar errante ou desviar-se; aplicado ao coração, comunica desorientação e instabilidade interior. “Cambaleia” preserva a imagem física e funciona naturalmente em português poético.
- source_word: לְבָבִי
  choice: meu coração
  rationale: Mantém a imagem hebraica do coração como centro da vida interior, sem restringi-la apenas à mente ou às emoções.
- source_word: פַּלָּצוּת
  choice: um tremor
  rationale: O substantivo expressa tremor intenso ou estremecimento. “Um tremor” conserva tanto a dimensão física quanto a emocional.
- source_word: בִּעֲתַתְנִי
  choice: me apavora
  rationale: O verbo בעת significa aterrorizar ou assustar intensamente. O presente transmite em português o efeito vívido da visão expresso pelo perfeito hebraico.
- source_word: נֶשֶׁף
  choice: o crepúsculo
  rationale: Designa a luz tênue do crepúsculo, provavelmente o vespertino neste contexto. A escolha preserva a atmosfera poética sem explicitar além do texto.
- source_word: חִשְׁקִי
  choice: que eu tanto desejava
  rationale: O substantivo com sufixo significa literalmente “meu desejo”. A formulação verbal é natural em português, e “tanto” comunica a intensidade afetiva sem alterar o sentido básico.
- source_word: שָׂם לִי
  choice: ele transformou ... para mim
  rationale: שׂים significa pôr ou fazer algo resultar em determinada condição. “Transformou em” expressa com naturalidade a reversão descrita; o pronome “ele” preserva o sujeito implícito do hebraico sem identificá-lo.
- source_word: לַחֲרָדָה
  choice: em terror
  rationale: חֲרָדָה pode indicar tremor, pavor ou terror. Aqui nomeia o resultado assustador da reversão do crepúsculo desejado, e “terror” evita a repetição exata de “tremor”.
theological_decisions:
- issue: Identidade do sujeito implícito de שָׂם
  choice: Manter apenas “ele”, sem identificar o agente
  alternative: Explicitar “Deus” ou usar uma construção impessoal
  rationale: O verbo hebraico está na terceira pessoa masculina singular, mas este versículo não nomeia o sujeito. Identificá-lo acrescentaria uma interpretação; a tradução conserva a ambiguidade contextual.
translation_notes:
  register: Português moderno, digno e poético, com leitura natural sobretudo no Brasil e compreensão internacional. O paralelismo e a progressão de desorientação, tremor e terror foram preservados.
