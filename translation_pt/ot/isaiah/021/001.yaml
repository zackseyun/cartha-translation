base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/001.yaml
  text: 'An oracle concerning the wilderness of the sea: like whirlwinds in the Negev sweeping through[a], it comes from the wilderness[c][b], from a fearful land.'
translation:
  language: pt
  text: 'Oráculo sobre o deserto do mar: Como vendavais no Neguebe que passam impetuosamente, vem do deserto, de uma terra temível.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Neguebe” também pode significar “sul”. O hebraico não declara o sujeito de “vem”; pode referir-se à força comparada aos vendavais ou a outra figura implícita. A expressão “deserto do mar” é uma designação poética incomum e também pode ser entendida como “deserto junto ao mar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  choice: Sentença
  rationale: Em títulos proféticos, o termo introduz uma declaração solene, muitas vezes de juízo. “Sentença” é natural em português, mantém esse peso e evita o sentido físico que “fardo” sugeriria.
- source_word: מִדְבַּר יָם
  choice: o deserto do mar
  rationale: Preserva a construção hebraica incomum e sua ambiguidade poética ou geográfica, sem identificá-la explicitamente com uma nação.
- source_word: כְּסוּפוֹת
  choice: como vendavais
  rationale: O plural designa ventos violentos de tempestade. “Vendavais” comunica força e movimento de modo idiomático.
- source_word: בַּנֶּגֶב
  choice: no Neguebe
  rationale: Mantém a possível referência à região desértica meridional, sem reduzir o termo apenas ao ponto cardeal “sul”.
- source_word: לַחֲלֹף
  choice: que passam impetuosamente
  rationale: Expressa o movimento de atravessar próprio da imagem dos vendavais e torna explícita sua violência sem alterar o referente.
- source_word: מִמִּדְבָּר בָּא
  choice: ela vem do deserto
  rationale: O verbo hebraico é masculino singular e não traz sujeito expresso. Em português, o pronome feminino retoma naturalmente “sentença”, mas a nota registra que o referente permanece incerto no original.
- source_word: מֵאֶרֶץ נוֹרָאָה
  choice: de uma terra temível
  rationale: “Temível” conserva o sentido de algo que causa medo ou assombro, sem especificar indevidamente a natureza do perigo.
theological_decisions:
- issue: Interpretação da designação geográfica no título
  choice: Manter “o deserto do mar” como expressão poética enigmática.
  alternative: Traduzir “o deserto junto ao mar” ou identificar o lugar como Babilônia.
  rationale: O hebraico não resolve a designação no próprio versículo. Preservá-la evita inserir uma identificação histórica ou geográfica além do texto.
- issue: Sujeito implícito do verbo בָּא
  choice: Empregar “ela”, com retomada gramatical de “sentença”, e registrar a incerteza em nota.
  alternative: Entender que o sujeito é a força comparada aos vendavais, uma ameaça ou um invasor implícito.
  rationale: O sujeito não é declarado em hebraico. A formulação portuguesa precisa de um referente natural, mas a nota evita apresentar essa solução gramatical como interpretação certa.
translation_notes:
  register: Português moderno, solene e acessível. A inversão e a imagem profética são preservadas sem arcaísmos excessivos. A única nota reúne as ambiguidades lexicais e sintáticas essenciais, e seu marcador aparece no texto.
