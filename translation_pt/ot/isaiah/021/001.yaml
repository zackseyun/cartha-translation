    rationale: O hebraico traz apenas o verbo masculino singular בָּא, sem sujeito expresso. Retomar «sentença» com pronome feminino não corresponde à concordância hebraica e apresenta como leitura principal uma identificação que permanece incerta.
  - severity: low
    issue: «Sentença» é mais restrito que o valor de מַשָּׂא no cabeçalho.
    rationale: Embora possa introduzir juízo, מַשָּׂא funciona como título de pronunciamento/oráculo profético. «Oráculo» preserva essa função sem antecipar que se trata formalmente de uma sentença.
