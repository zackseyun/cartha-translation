  text: מְדֻשָׁתִ֖/י וּ/בֶן גָּרְנִ֑/י אֲשֶׁ֣ר שָׁמַ֗עְתִּי מֵ/אֵ֨ת יְהוָ֧ה צְבָא֛וֹת אֱלֹהֵ֥י יִשְׂרָאֵ֖ל הִגַּ֥דְתִּי לָ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/010.yaml
  text: O my threshed one[a], and son of my threshing floor, what I have heard from Yahweh of hosts, the God of Israel[b], I have declared to you.
translation:
  language: pt
  text: Ó minha debulhada[a], filho da minha eira[b]! O que ouvi de Yahweh dos Exércitos, o Deus de Israel, anunciei a vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser entendido como «minha esmagada» ou «minha pisada». O hebraico conserva a imagem da debulha como metáfora de sofrimento severo.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «filho da minha eira». A expressão prolonga a imagem da debulha e provavelmente evoca um povo severamente afligido, sem explicar por completo a metáfora.
    reason: cultural_note
lexical_decisions:
- source_word: מְדֻשָׁתִי
  choice: meu debulhado
  rationale: Mantém a forma passiva e a imagem agrícola da raiz דושׁ, apresentando o destinatário como alguém submetido à debulha, metáfora de aflição severa, sem substituí-la por uma interpretação abstrata.
- source_word: וּבֶן גָּרְנִי
  choice: filho da minha eira
  rationale: Reproduz os elementos concretos בֵּן, «filho», e גֹּרֶן, «eira», preservando o paralelismo e a metáfora incomum do hebraico.
- source_word: אֲשֶׁר שָׁמַעְתִּי
  choice: O que ouvi
  rationale: Expressa de modo natural em português o conteúdo introduzido pelo pronome relativo e o perfeito de שׁמע.
- source_word: מֵאֵת יְהוָה צְבָאוֹת
  choice: de Yahweh dos Exércitos
  rationale: Indica a origem da mensagem e translitera o nome divino; «dos Exércitos» conserva a amplitude do título צְבָאוֹת.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta da construção que identifica Yahweh como o Deus de Israel.
- source_word: הִגַּדְתִּי לָכֶם
  choice: anunciei a vocês
  rationale: O hifil de נגד comunica tornar conhecido ou anunciar. «A vocês» deixa claro o plural de לָכֶם em português de ampla legibilidade.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o Tetragrama como nome próprio. A transliteração preserva essa função e evita substituí-lo por um título.
- issue: Preservação da metáfora da debulha
  choice: Manter «meu debulhado» e «filho da minha eira» no texto principal
  alternative: Explicitar como «meu povo oprimido» ou «meu povo esmagado»
  rationale: O hebraico usa deliberadamente uma imagem agrícola intensa. Mantê-la evita determinar de maneira exclusiva a identidade do destinatário ou reduzir a metáfora à ideia abstrata de opressão.
translation_notes:
  register: Português moderno, digno e de leitura ampla. A formulação intencionalmente incomum «meu debulhado» conserva a estranheza poética do hebraico; a exclamação delimita a invocação antes do anúncio profético.
