base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/012.yaml
  text: The watchman says[a], “Morning comes, and also night. If you would inquire, inquire; return[b], come.”
translation:
  language: pt
  text: 'O vigia diz[a]: “A manhã vem, e também a noite. Se quiserem perguntar, perguntem; voltem, venham[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A manhã chegou, e também a noite”. O hebraico pode ser entendido como uma afirmação geral de chegada ou como um anúncio mais imediato.'
    reason: lexical_alternative
  - marker: b
    text: Os imperativos finais também podem ser entendidos como “voltem atrás, venham de novo”, sugerindo arrependimento ou simplesmente que retornem mais tarde para perguntar novamente; o hebraico deixa a nuance em aberto.
    reason: alternative_reading
lexical_decisions:
- source_word: שֹׁמֵר
  choice: o vigia
  rationale: O particípio substantivado designa quem mantém vigilância. “Vigia” é natural em português e corresponde à função estabelecida no contexto do oráculo.
- source_word: אָמַר
  choice: diz
  rationale: Embora a forma hebraica seja perfectiva, ela introduz aqui a resposta direta do vigia; o presente torna a formulação natural em português.
- source_word: אָתָה בֹקֶר
  choice: a manhã vem
  rationale: O verbo indica chegada, tendo “manhã” como sujeito. A formulação preserva tanto o valor lexical quanto a concisão do hebraico.
- source_word: וְגַם לָיְלָה
  choice: e também a noite
  rationale: Mantém a coordenação simples do hebraico e não explicita indevidamente se a relação é adversativa.
- source_word: אִם תִּבְעָיוּן בְּעָיוּ
  choice: se vocês querem perguntar, perguntem
  rationale: Conserva a repetição enfática da mesma raiz, com uma construção corrente e compreensível em português.
- source_word: שֻׁבוּ אֵתָיוּ
  choice: voltem, venham
  rationale: Reproduz a sequência breve de dois imperativos e deixa em aberto se se trata de voltar, arrepender-se ou retornar depois para nova consulta.
theological_decisions:
- issue: Possível sentido de שֻׁבוּ como chamado ao arrependimento
  choice: Não explicitar arrependimento no texto principal
  alternative: “Convertam-se e venham”
  rationale: O verbo pode indicar mudança de rumo ou simples retorno; o contexto e a sequência dos imperativos não exigem uma interpretação teológica específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O plural “vocês” explicita o destinatário plural indicado pelos verbos hebraicos. A cadência sucinta e a ambiguidade profética foram preservadas.
