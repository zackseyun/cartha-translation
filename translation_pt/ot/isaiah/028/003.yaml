base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/003.yaml
  text: The proud crown of the drunkards of Ephraim will be trampled underfoot[a].
translation:
  language: pt
  text: A coroa do orgulho dos bêbados de Efraim será pisoteada[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “A coroa do orgulho dos bêbados de Efraim será pisada com os pés.”'
    reason: Registra a estrutura nominal e a expressão instrumental mais literal do hebraico.
lexical_decisions:
- source_word: בְּרַגְלַיִם
  choice: aos pés
  rationale: A preposição בְּ com o dual רַגְלַיִם forma uma expressão instrumental ligada ao ato de pisar. “Aos pés” preserva a imagem e soa natural em português.
- source_word: תֵּרָמַסְנָה
  choice: será pisada
  rationale: O nifal imperfeito de רמס expressa a ação passiva de pisar ou calcar. O singular em português concorda naturalmente com “coroa”, sujeito da oração.
- source_word: עֲטֶרֶת
  choice: coroa
  rationale: O substantivo pode designar coroa, grinalda ou diadema. “Coroa” preserva melhor a metáfora da posição proeminente de Efraim no contexto.
- source_word: גֵּאוּת
  choice: orgulhosa
  rationale: Embora seja literalmente o substantivo “orgulho”, o adjetivo “orgulhosa” comunica em português corrente a relação genitiva “coroa de orgulho” e mantém sua força negativa.
- source_word: שִׁכּוֹרֵי
  choice: dos bêbados
  rationale: A forma plural caracteriza pessoas entregues à embriaguez. “Bêbados” é direto, compreensível e adequado ao tom de censura do contexto.
- source_word: אֶפְרָיִם
  choice: Efraim
  rationale: Mantém-se o nome próprio hebraico em sua forma portuguesa tradicional. Embora represente contextualmente o reino do norte, o texto nomeia Efraim de modo explícito.
theological_decisions:
- issue: Relação metafórica em עֲטֶרֶת גֵּאוּת
  choice: “coroa orgulhosa”
  alternative: “coroa de orgulho”
  rationale: A opção adjetival é mais natural no português moderno e preserva tanto a metáfora quanto a censura moral, sem definir além do que o hebraico afirma.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva a imagem concreta dos pés e evita explicar no corpo do versículo que Efraim representa o reino do norte.
