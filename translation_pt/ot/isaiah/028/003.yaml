- from: A coroa orgulhosa dos bêbados de Efraim será pisada aos pés[a].
  to: A coroa do orgulho dos bêbados de Efraim será pisoteada[a].
  rationale: A revisão substitui uma expressão portuguesa pouco natural e semanticamente imprecisa por «será pisoteada», mantendo a metáfora de humilhação. Também verte o genitivo hebraico de forma explícita como «coroa do orgulho». A nota conserva a alternativa mais formal, incluindo «com os pés».
  reviewer_model: gpt-5.6-terra
