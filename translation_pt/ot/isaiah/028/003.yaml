review_pass:
  verdict: revise
  source_fidelity: O hebraico diz literalmente que a «coroa de orgulho dos bêbados de Efraim» será calcada/pisoteada «com/pelos pés». A tradução proposta comunica o sentido geral, mas «aos pés» não reproduz bem a expressão instrumental hebraica e, em português, pode sugerir posição («junto aos pés») em vez de ação de pisotear.
  naturalness: «Será pisada aos pés» é pouco idiomático no português moderno. «Será pisoteada» é natural, direto e conserva a imagem. «Coroa do orgulho» também representa de modo mais transparente a relação nominal hebraica do que «coroa orgulhosa».
  terminology: «Coroa», «bêbados» e «Efraim» são adequados. «Orgulho» preserva o substantivo גֵּאוּת e sua conotação negativa contextual sem acrescentar interpretação.
  issues:
  - severity: medium
    issue: «Aos pés» é uma formulação inadequada para בְּרַגְלַיִם neste contexto.
    rationale: A expressão hebraica qualifica o ato de calcar com/pelos pés; «aos pés» em português é normalmente locativa. «Pisoteada» transmite naturalmente o resultado da ação.
  - severity: low
    issue: «Coroa orgulhosa» torna adjetival um genitivo nominal.
    rationale: Embora seja possível como estilização, «coroa do orgulho» reproduz com maior precisão a construção עֲטֶרֶת גֵּאוּת e evita sugerir que a coroa em si é o agente dotado de orgulho.
  revised_text: A coroa do orgulho dos bêbados de Efraim será pisoteada[a].
  revised_footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “A coroa do orgulho dos bêbados de Efraim será pisada com os pés.”'
    reason: Registra a estrutura nominal e a expressão instrumental mais literal do hebraico.
  revision_rationale: A revisão substitui uma expressão portuguesa pouco natural e semanticamente imprecisa por «será pisoteada», mantendo a metáfora de humilhação. Também verte o genitivo hebraico de forma explícita como «coroa do orgulho». A nota conserva a alternativa mais formal, incluindo «com os pés».
