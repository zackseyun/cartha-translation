  source_fidelity: 'A tradução acompanha bem a sequência, a repetição enfática e as imagens do hebraico: vinho e bebida forte causam o cambalear/desorientar; sacerdote e profeta são abrangidos; e as cláusulas finais conservam a concisão referente a visão e julgamento. “São tragados pelo vinho” preserva adequadamente a metáfora de נִבְלְעוּ. A nota [a], porém, formula a alternativa como “no que veem”, deslocando-a da expressão hebraica compacta ligada a visão/ver; é preferível manter “na visão”.'
