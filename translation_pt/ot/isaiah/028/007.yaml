base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/007.yaml
  text: 'And even these reel with wine and stagger from strong drink: priest and prophet reel with strong drink[a], they are swallowed up by wine, they stagger from strong drink; they reel in vision[b], they totter in judgment.'
translation:
  language: pt
  text: 'E até estes cambaleiam por causa do vinho e andam desnorteados por causa da bebida forte: sacerdote e profeta cambaleiam por causa da bebida forte; são tragados pelo vinho, andam desnorteados por causa da bebida forte; cambaleiam na visão[a] e tropeçam no julgamento[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “erram na visão”; o hebraico pode referir-se especificamente à visão profética.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “tropeçam ao julgar” ou “na decisão judicial”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אֵלֶּה
  choice: Até estes
  rationale: Expressa a ênfase inclusiva de וְגַם e aponta para o grupo agora censurado, com formulação natural em português.
- source_word: בַּיַּיִן
  choice: por causa do vinho
  rationale: Torna explícito o valor causal ou instrumental da preposição no contexto de embriaguez, sem perder a ligação direta com o vinho.
- source_word: שָׁגוּ
  choice: cambaleiam
  rationale: Embora o verbo também possa significar errar ou desviar-se, o contexto imediato favorece a imagem concreta da instabilidade causada pela bebida, mantendo ao mesmo tempo a conotação de desorientação.
- source_word: שֵׁכָר
  choice: bebida forte
  rationale: Designa bebida intoxicante distinta do vinho; a expressão é ampla, tradicional e compreensível em português moderno.
- source_word: תָּעוּ
  choice: andam desnorteados
  rationale: Conserva a ideia de vagar ou errar e, no contexto, comunica a desorientação física e mental da embriaguez sem confundir este verbo com שׁגה.
- source_word: כֹּהֵן וְנָבִיא
  choice: sacerdote e profeta
  rationale: Os substantivos singulares têm sentido representativo ou coletivo, abrangendo essas classes de líderes.
- source_word: נִבְלְעוּ מִן הַיַּיִן
  choice: são tragados pelo vinho
  rationale: Preserva a metáfora forte do hebraico, segundo a qual o vinho os engole ou domina completamente.
- source_word: בָּרֹאֶה
  choice: na visão
  rationale: No contexto do profeta, pode indicar percepção visionária, mas a forma compacta evita especificar mais do que o hebraico; a nota registra a alternativa.
- source_word: פָּקוּ
  choice: tropeçam
  rationale: Comunica a falta de firmeza e funciona tanto no plano físico quanto no exercício defeituoso de uma função.
- source_word: פְּלִילִיָּה
  choice: no julgamento
  rationale: Mantém a formulação concisa do hebraico e pode referir-se ao ato de julgar ou a uma decisão judicial.
theological_decisions:
- issue: Se as cláusulas finais devem ser explicitamente limitadas à visão profética e à decisão judicial
  choice: 'Manter a formulação compacta: “cambaleiam na visão e tropeçam no julgamento”'
  alternative: “erram na visão profética e tropeçam ao proferir decisões judiciais”
  rationale: O contexto denuncia a incapacidade de líderes religiosos em suas funções, mas o hebraico permanece conciso e admite nuances. A tradução evita resolver silenciosamente se רֹאֶה destaca o ato de ver ou a visão profética e se פְּלִילִיָּה designa julgamento em geral ou decisão legal.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A repetição deliberada de “por causa da bebida forte” acompanha a insistência retórica do hebraico; “são tragados” preserva sua metáfora incisiva. Os marcadores [a] e [b] foram posicionados junto às expressões a que suas respectivas notas se referem.
