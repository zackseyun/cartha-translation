  text: גַּם זֹ֕את מֵ/עִ֛ם יְהוָ֥ה צְבָא֖וֹת יָצָ֑אָה הִפְלִ֣יא עֵצָ֔ה הִגְדִּ֖יל תּוּשִׁיָּֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/029.yaml
  text: This also has come from Yahweh of hosts[a]; he is wonderful in counsel and great in wisdom.
translation:
  language: pt
  text: Também isto veio de Yahweh dos Exércitos; ele é maravilhoso em conselho e grande em sabedoria[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sabedoria sólida”, “sabedoria prática” ou “habilidade eficaz”.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם זֹאת
  choice: Também isto
  rationale: Mantém a força aditiva da expressão e liga a conclusão à ilustração agrícola anterior.
- source_word: מֵעִם ... יָצָאָה
  choice: veio de
  rationale: Expressa de modo natural a origem indicada pela preposição e conserva o aspecto completo do verbo hebraico perfeito.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Translitera o nome divino e preserva no título צְבָאוֹת a imagem dos exércitos ou hostes, sem reduzi-la a uma designação genérica de poder.
- source_word: הִפְלִיא עֵצָה
  choice: é maravilhoso em conselho
  rationale: Comunica a excelência extraordinária do conselho divino em português idiomático, sem limitar עֵצָה a mero conselho pessoal; o termo também pode envolver plano ou propósito.
- source_word: הִגְדִּיל תּוּשִׁיָּה
  choice: grandioso em sabedoria
  rationale: Reproduz o paralelismo com a oração anterior e comunica a grandeza da sabedoria eficaz de Deus; a nota registra nuances práticas de תּוּשִׁיָּה.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Sentido dos verbos causativos הִפְלִיא e הִגְדִּיל
  choice: 'Predicação da excelência divina: “é maravilhoso... e grandioso...”'
  alternative: 'Formulação causativa: “tornou maravilhoso o conselho e engrandeceu a sabedoria”'
  rationale: No paralelismo poético comprimido, a formulação predicativa transmite naturalmente o louvor à extraordinária capacidade de Deus, mas a alternativa causativa continua gramaticalmente possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Conselho” mantém o tom sapiencial; “dos Exércitos” conserva a imagem tradicional do título divino. O marcador [a] foi colocado junto de “sabedoria”, termo ao qual a nota se refere.
