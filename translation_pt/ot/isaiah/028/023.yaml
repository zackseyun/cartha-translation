base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/023.yaml
  text: Give ear and hear my voice[a]; pay attention and hear my word.
translation:
  language: pt
  text: Deem ouvidos à minha voz[a]; prestem atenção e escutem a minha palavra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Escutem e ouçam a minha voz; atentem e ouçam a minha fala.»'
    reason: Alternativa lexical para os imperativos de ouvir e de prestar atenção, e para «palavra»/«fala».
lexical_decisions:
- source_word: הַאֲזִינוּ
  choice: Deem ouvidos
  rationale: O imperativo hifil plural de אזן convoca os ouvintes a inclinarem atentamente o ouvido. A expressão preserva o tom elevado e enfático do chamado hebraico, sem deixar de ser compreensível em português.
- source_word: וְשִׁמְעוּ
  choice: e escutem
  rationale: O imperativo qal plural de שמע é mantido como verbo distinto, preservando a sequência retórica e sem reduzir os dois imperativos a uma única ideia.
- source_word: קוֹלִי
  choice: a minha voz
  rationale: קול significa naturalmente “voz” neste contexto de discurso direto; a formulação é clara e mantém o paralelismo poético.
- source_word: הַקְשִׁיבוּ
  choice: prestem atenção
  rationale: O imperativo hifil plural de קשב pede atenção concentrada. “Prestem atenção” comunica isso de modo natural e atual, distinguindo-se do chamado inicial.
- source_word: וְשִׁמְעוּ
  choice: e escutem
  rationale: A repetição de שמע é reproduzida para conservar a repetição deliberada e o paralelismo do hebraico.
- source_word: אִמְרָתִי
  choice: a minha palavra
  rationale: אמרה pode designar palavra, declaração ou fala. “A minha palavra” preserva o singular e corresponde de forma concisa ao paralelo “a minha voz”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com imperativos no plural. A estrutura paralela e a repetição do original foram preservadas. “Deem ouvidos” mantém o tom poético elevado, enquanto “prestem atenção” oferece clareza corrente.
