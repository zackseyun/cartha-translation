base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/002.yaml
  text: Behold[a], the Lord has one who is mighty and strong; like a storm of hail, a destroying tempest, like a storm of mighty, overflowing waters[b], he casts it down to the earth with his hand.
translation:
  language: pt
  text: Eis que o Senhor tem[a] alguém poderoso e forte; como uma tempestade de granizo, uma tormenta destruidora, como uma torrente de águas poderosas que transbordam, ele fará cair por terra, com a mão.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Pois há para o Senhor alguém poderoso e forte». A expressão hebraica pode salientar que esse agente pertence ao Senhor ou está pronto para ser usado por ele.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «ele fará [isso] repousar no chão, com a mão» ou «ele abaterá [isso] por terra, com a mão». O verbo hebraico pode ser traduzido de modo menos violento, mas as imagens de tempestade e inundação favorecem aqui um sentido enérgico. O objeto não está expresso no hebraico.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Introduz com vivacidade e solenidade o anúncio profético, preservando a função de chamar a atenção.
- source_word: חָזָק וְאַמִּץ
  choice: poderoso e forte
  rationale: Mantém os dois adjetivos intensificadores e descreve a potência do agente sem identificar quem ele é.
- source_word: לַאדֹנָי
  choice: o Senhor tem
  rationale: Expressa em português natural que o agente está à disposição do Senhor, embora a construção hebraica também possa ser entendida mais literalmente como «para o Senhor há».
- source_word: כְּזֶרֶם בָּרָד
  choice: como uma tempestade de granizo
  rationale: זֶרֶם indica uma chuva ou tempestade violenta; a expressão conserva literalmente a imagem do granizo.
- source_word: שַׂעַר קָטֶב
  choice: uma tormenta destruidora
  rationale: Reproduz a imagem de uma tempestade caracterizada por devastação, sem reduzir קָטֶב a mero vento forte.
- source_word: כְּזֶרֶם מַיִם כַּבִּירִים שֹׁטְפִים
  choice: como uma tempestade de águas impetuosas que transbordam
  rationale: Conserva tanto a grande força das águas quanto seu movimento inundante e avassalador.
- source_word: הִנִּיחַ לָאָרֶץ
  choice: ele o lançará por terra
  rationale: O perfeito hebraico é entendido no anúncio profético como ação futura certa. «Lançará por terra» se ajusta à violência das imagens, enquanto o pronome representa o objeto não expresso no hebraico.
- source_word: בְּיָד
  choice: com a mão
  rationale: Preserva a imagem antropomórfica de ação direta, seja do próprio Senhor, seja do agente que ele emprega.
theological_decisions:
- issue: Identidade daquele que é poderoso e forte
  choice: Mantida indefinida como «alguém poderoso e forte».
  alternative: Identificá-lo com a Assíria, com o rei assírio ou com o próprio Senhor.
  rationale: O hebraico não identifica explicitamente o agente neste versículo; o contexto sugere um instrumento de juízo do Senhor, mas a tradução não deve resolver essa ambiguidade.
- issue: Sujeito e objeto da oração final
  choice: «ele» retoma o agente poderoso, e «o» representa o objeto implícito.
  alternative: Tomar o Senhor como sujeito direto ou explicitar o objeto como a coroa orgulhosa de Efraim.
  rationale: A forma verbal singular permite a continuidade do agente já mencionado, mas o hebraico omite o objeto. A formulação evita inserir no texto a identificação contextual daquilo que será lançado por terra.
- issue: Valor temporal de הִנִּיחַ
  choice: 'Futuro profético: «lançará».'
  alternative: 'Passado ou presente vívido: «lançou» ou «lança».'
  rationale: No contexto oracular, o perfeito apresenta o juízo anunciado como certo; o futuro comunica isso naturalmente em português sem enfraquecer a certeza profética.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com «Eis que» preservando o tom profético elevado. A sequência de comparações foi mantida para reproduzir o acúmulo retórico do hebraico; «Senhor» traduz אֲדֹנָי.
