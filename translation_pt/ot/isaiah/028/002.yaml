revisions:
- from: Eis que o Senhor tem[a] alguém poderoso e forte; como uma tempestade de granizo, uma tormenta destruidora, como uma tempestade de águas impetuosas que transbordam, ele o lançará por terra com a mão.[b]
  to: Eis que o Senhor tem[a] alguém poderoso e forte; como uma tempestade de granizo, uma tormenta destruidora, como uma torrente de águas poderosas que transbordam, ele fará cair por terra, com a mão.[b]
  rationale: A revisão remove o pronome masculino que supria indevidamente um gênero para o objeto elíptico e ajusta a imagem final para «torrente», mais natural para águas violentamente transbordantes. Mantêm-se o futuro profético, a identidade não especificada do agente e a imagem literal da ação «com a mão».
