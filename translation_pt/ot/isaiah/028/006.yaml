  text: וּ/לְ/ר֖וּחַ מִשְׁפָּ֑ט לַ/יּוֹשֵׁב֙ עַל הַ/מִּשְׁפָּ֔ט וְ/לִ֨/גְבוּרָ֔ה מְשִׁיבֵ֥י מִלְחָמָ֖ה שָֽׁעְרָ/ה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/006.yaml
  text: and a spirit of justice to the one who sits in judgment[c][b][a], and strength to those who turn back the battle at the gate.
translation:
  language: pt
  text: e espírito de justiça para quem se assenta para julgar,[a] e força para os que repelem a batalha junto ao portão.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “espírito de julgamento para quem se assenta no tribunal”.
    reason: lexical_alternative
  - marker: b
    text: Ou “fazem a guerra recuar até o portão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְרוּחַ מִשְׁפָּט
  choice: e espírito de justiça
  rationale: A construção continua as bênçãos do versículo anterior, no qual o SENHOR é o referente. “Espírito de justiça” preserva a expressão hebraica e comunica uma disposição ou capacidade para exercer justiça.
- source_word: לַיֹּשֵׁב עַל הַמִּשְׁפָּט
  choice: para quem se assenta para julgar
  rationale: A formulação conserva o particípio singular e expressa em português natural a função judicial indicada pelo idioma hebraico, sem exigir a imagem mais específica de um assento judicial.
- source_word: וְלִגְבוּרָה
  choice: e força
  rationale: “Força” reproduz de modo claro גְּבוּרָה no contexto militar e mantém o paralelismo das dádivas.
- source_word: מְשִׁיבֵי מִלְחָמָה
  choice: para os que repelem a batalha
  rationale: 'O particípio de שׁוב tem aqui sentido causativo: fazer a batalha ou os combatentes recuarem. “Repelem” é natural e explicita adequadamente a ação defensiva.'
- source_word: שַׁעְרָה
  choice: junto ao portão
  rationale: O substantivo com terminação direcional ou locativa aponta para a área do portão, lugar em que o ataque é enfrentado. “Junto ao portão” evita sugerir necessariamente movimento em direção a ele.
theological_decisions:
- issue: Relação sintática com o sujeito do versículo anterior
  choice: O texto é apresentado como continuação do que o SENHOR será para seu povo, sem repetir aqui o sujeito.
  alternative: Explicitar “ele será” ou “o SENHOR dará”.
  rationale: As frases preposicionais hebraicas dependem do versículo anterior. Manter a continuação evita acrescentar um verbo ou especificar como dádiva aquilo que o hebraico formula como aquilo que o SENHOR será.
- issue: Sentido de רוּחַ מִשְׁפָּט
  choice: espírito de justiça
  alternative: espírito de julgamento
  rationale: “Justiça” expressa melhor a qualidade que capacita a autoridade judicial, enquanto “julgamento” pode designar o ato ou a sentença. A ambiguidade judicial é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Assenta” preserva discretamente a imagem do hebraico; “portão” comunica melhor que “porta” a entrada fortificada de uma cidade.
