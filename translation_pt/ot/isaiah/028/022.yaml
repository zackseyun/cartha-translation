source:
  edition: WLC
  text: וְ/עַתָּה֙ אַל תִּתְלוֹצָ֔צוּ פֶּֽן יֶחְזְק֖וּ מֽוֹסְרֵי/כֶ֑ם כִּֽי כָלָ֨ה וְ/נֶחֱרָצָ֜ה שָׁמַ֗עְתִּי מֵ/אֵ֨ת אֲדֹנָ֧/י יְהוִ֛ה צְבָא֖וֹת עַל כָּל הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/022.yaml
  text: So now[a], do not scoff, lest your bonds be made stronger[b]; for I have heard from the Lord GOD of Armies a complete destruction decreed against the whole land.
translation:
  language: pt
  text: Agora, portanto, não zombem, para que os seus laços não se apertem; pois ouvi do Senhor Yahweh dos Exércitos que uma destruição total foi decretada contra toda a terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contra todo o país”. A palavra hebraica pode designar tanto a terra ou o território em questão quanto a terra inteira.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora, portanto
  rationale: Expressa tanto a transição temporal quanto a conclusão urgente tirada da advertência anterior.
- source_word: תִּתְלוֹצָצוּ
  choice: não zombem
  rationale: O verbo לוץ indica zombaria desdenhosa; a formulação é corrente e mantém o tom de repreensão profética.
- source_word: יֶחְזְקוּ מוֹסְרֵיכֶם
  choice: os laços que os prendem não se apertem ainda mais
  rationale: Mantém a imagem concreta de restrições ou vínculos e comunica naturalmente o agravamento do juízo; חזק descreve aqui esses laços tornando-se mais fortes ou apertados.
- source_word: כָלָה וְנֶחֱרָצָה
  choice: uma destruição total foi decretada
  rationale: Reproduz a ideia de um fim completo e determinado, própria da combinação de כָּלָה com o particípio nifal de חרץ no contexto de juízo.
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: Senhor Yahweh dos Exércitos
  rationale: Representa os dois elementos do título divino e traduz צְבָאוֹת de modo tradicional, claro e compreensível.
- source_word: עַל כָּל הָאָרֶץ
  choice: contra toda a terra
  rationale: Preserva em português a possível referência tanto à terra ou território em foco quanto, em sentido mais amplo, à terra inteira.
theological_decisions:
- issue: Representação de אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Soberano SENHOR
  rationale: A forma escolhida distingue אֲדֹנָי do nome divino יהוה e evita fundi-los num único título; não acrescenta uma interpretação denominacional.
- issue: Alcance de הָאָרֶץ
  choice: toda a terra
  alternative: todo o país
  rationale: O termo hebraico admite alcance local ou universal. A tradução principal conserva essa ambiguidade natural, e a nota explicita a leitura local possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com imperativo plural de leitura natural no Brasil. A expansão moderada “os laços que os prendem” torna clara a metáfora sem convertê-la em castigo abstrato.
