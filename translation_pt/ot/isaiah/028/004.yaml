revisions:
- from: 'E a flor que murcha, seu belo esplendor, que está no alto do vale fértil[a], será como o figo que amadurece antes do verão: assim que alguém o vê, mal ele chega à palma da mão, já o engole.'
  to: 'E a flor murcha de seu belo esplendor, que está no alto do vale fértil[a], será como um figo temporão, antes do verão: quem o vê o engole enquanto ele ainda está na palma da sua mão.'
  rationale: A revisão corrige a relação sintática e temporal da última oração, preservando o fruto na palma da mão daquele que o vê no momento em que é engolido. Também torna natural e inteligível em português a construção que descreve a flor como pertencente ao esplendor. A nota existente permanece corretamente ancorada e suficiente.
