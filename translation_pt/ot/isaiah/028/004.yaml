source:
  edition: WLC
  text: וְֽ/הָ֨יְתָ֜ה צִיצַ֤ת נֹבֵל֙ צְבִ֣י תִפְאַרְתּ֔/וֹ אֲשֶׁ֥ר עַל רֹ֖אשׁ גֵּ֣יא שְׁמָנִ֑ים כְּ/בִכּוּרָהּ֙ בְּ/טֶ֣רֶם קַ֔יִץ אֲשֶׁ֨ר יִרְאֶ֤ה הָֽ/רֹאֶה֙ אוֹתָ֔/הּ בְּ/עוֹדָ֥/הּ בְּ/כַפּ֖/וֹ יִבְלָעֶֽ/נָּה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/004.yaml
  text: 'And the fading flower of his glorious beauty[a], which is on the head of the fertile valley, will be like an early fig before summer: whoever sees it, while it is still in his palm[b], swallows it down.'
translation:
  language: pt
  text: 'E a flor murcha de seu belo esplendor, que está no alto do vale fértil[a], será como um figo temporão, antes do verão: quem o vê o engole enquanto ele ainda está na palma da sua mão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “vale de fertilidades”, expressão que indica um vale rico e fértil.
    reason: cultural_note
lexical_decisions:
- source_word: צִיצַת נֹבֵל
  choice: a flor que murcha
  rationale: Preserva a imagem floral e o valor participial de נֹבֵל em português natural.
- source_word: צְבִי תִפְאַרְתּוֹ
  choice: seu belo esplendor
  rationale: Mantém a intensificação estética dos dois substantivos hebraicos e representa o sufixo possessivo.
- source_word: גֵּיא שְׁמָנִים
  choice: vale fértil
  rationale: Expressa de modo claro o sentido idiomático de um vale rico e produtivo; a formulação literal é registrada em nota.
- source_word: כְּבִכּוּרָהּ בְּטֶרֶם קַיִץ
  choice: como o figo que amadurece antes do verão
  rationale: בִּכּוּרָה designa um fruto temporão ou primeiro fruto maduro e, neste contexto, é normalmente entendido como figo; a tradução conserva a imagem agrícola e a precedência temporal.
- source_word: אֲשֶׁר יִרְאֶה הָרֹאֶה אוֹתָהּ
  choice: assim que alguém o vê
  rationale: Reproduz naturalmente a construção hebraica enfática e comunica a rapidez da ação subsequente.
- source_word: בְּעוֹדָהּ בְּכַפּוֹ
  choice: mal ele chega à palma da mão
  rationale: Conserva o sentido concreto de כַּף, 'palma da mão', e apresenta de forma idiomática a ideia de que o fruto é consumido imediatamente.
- source_word: יִבְלָעֶנָּה
  choice: já o engole
  rationale: Traduz diretamente o verbo 'engolir' e, com 'já', transmite a rapidez do consumo.
- source_word: וְהָיְתָה
  choice: será
  rationale: Introduz de maneira direta a comparação futura no contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e as imagens do hebraico foram preservadas sem sacrificar a naturalidade. O referente feminino em hebraico passa a masculino na segunda comparação por causa de “figo” em português.
