base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/010.yaml
  text: For it is[a], “Command on command, command on command, line on line, line on line, a little here, a little there.”
translation:
  language: pt
  text: 'Pois: “Mandamento sobre mandamento, mandamento sobre mandamento; linha sobre linha, linha sobre linha; um pouco aqui, um pouco ali.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ligada à acusação ou zombaria precedente, sem tornar a relação causal mais explícita do que o contexto permite.
- source_word: צַו
  choice: mandamento
  rationale: Se derivado de צוה, indica ordem ou instrução. “Mandamento” é claro, conciso e mantém a cadência repetitiva; a possível função sonora ou zombeteira permanece perceptível.
- source_word: לָצָו
  choice: sobre mandamento
  rationale: A preposição ל é vertida idiomaticamente como “sobre” nesta fórmula acumulativa, preservando o paralelismo e a repetição.
- source_word: קַו
  choice: linha
  rationale: O substantivo pode designar linha ou cordel de medir. “Linha” conserva a concisão e o ritmo cortado da fala.
- source_word: לָקָו
  choice: sobre linha
  rationale: Assim como em לָצָו, “sobre” expressa de modo natural a ideia acumulativa e mantém a estrutura paralela.
- source_word: זְעֵיר
  choice: um pouco
  rationale: Reproduz o sentido de pequenez ou pequena quantidade em linguagem corrente e ritmada.
- source_word: שָׁם
  choice: ali
  rationale: O sentido básico é “ali/lá”. Na expressão distributiva em português, “aqui... ali” comunica naturalmente a ideia contextual.
- source_word: זְעֵיר שָׁם ... זְעֵיר שָׁם
  choice: um pouco aqui, um pouco ali
  rationale: Embora o hebraico repita literalmente “ali... ali”, a formulação distributiva “aqui... ali” preserva melhor em português o efeito idiomático e a cadência; a repetição literal é registrada na nota.
theological_decisions:
- issue: Se o versículo apresenta instrução direta ou fala repetitiva em tom de zombaria
  choice: Empregar aspas e conservar a cadência repetitiva como fala citada, possivelmente zombeteira
  alternative: Ler como descrição literal de um método pedagógico, sem conotação explícita de zombaria
  rationale: Isaías 28:9–13 favorece a compreensão de uma reprodução depreciativa da instrução profética. As aspas e a repetição preservam esse efeito possível sem inserir paráfrases infantis ou afirmar a interpretação como incontestável.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição e o ritmo entrecortado do hebraico foram mantidos. “Pois é” foi usado no sentido sintático de “pois isto é”, não como a interjeição coloquial isolada; a nota registra uma forma mais literal.
