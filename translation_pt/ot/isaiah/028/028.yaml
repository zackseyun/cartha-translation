translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição da ideia de triturar foi preservada por “triturado” e “reduz a pó”, enquanto a construção intensiva hebraica foi expressa por “continua a debulhá-lo”.
