base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/028.yaml
  text: Bread grain is crushed[a], but not forever does one keep threshing it; though the wheel of his cart and his horses rumble over it[b], he does not crush it fine.
translation:
  language: pt
  text: O cereal para fazer pão é triturado[a], mas não é debulhado para sempre. Embora a roda da sua carroça e os seus cavalos passem ruidosamente sobre ele, não é reduzido a pó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O grão para pão é triturado”. O hebraico לֶחֶם, geralmente traduzido por “pão”, refere-se aqui ao cereal destinado a virar pão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: cereal para fazer pão
  rationale: Embora normalmente signifique “pão”, neste contexto agrícola o termo designa, por metonímia, o cereal destinado à produção de pão.
- source_word: יוּדָק
  choice: é triturado
  rationale: O verbo דקק indica esmagar ou tornar miúdo; “triturado” preserva a imagem do processamento do cereal e permite retomar a ideia no fim do versículo.
- source_word: כִּי
  choice: mas
  rationale: Neste contexto, a partícula introduz o contraste entre a trituração necessária e a debulha que não prossegue indefinidamente.
- source_word: לֹא לָנֶצַח
  choice: não ... para sempre
  rationale: Mantém o sentido temporal direto da expressão e comunica que o processo não continua sem limite.
- source_word: אָדוֹשׁ יְדוּשֶׁנּוּ
  choice: ninguém continua a debulhá-lo
  rationale: O infinitivo absoluto junto do imperfeito intensifica ou prolonga a ação. A formulação genérica evita especificar indevidamente o sujeito.
- source_word: וְהָמַם
  choice: Embora faça passar ruidosamente sobre ele
  rationale: O verbo pode indicar ruído, tumulto ou movimento perturbador. No cenário agrícola, descreve adequadamente a passagem ruidosa do equipamento de debulha; “embora” explicita o valor concessivo exigido pelo contraste da frase.
- source_word: גִּלְגַּל עֶגְלָתוֹ
  choice: a roda da sua carroça
  rationale: Traduz de modo direto a relação entre a roda ou objeto rolante e a carroça.
- source_word: וּפָרָשָׁיו
  choice: os seus cavalos
  rationale: O termo pode designar cavaleiros, mas, junto da carroça no contexto da debulha, é mais provável que se refira aos cavalos envolvidos na tração.
- source_word: לֹא יְדֻקֶּנּוּ
  choice: não o reduz a pó
  rationale: 'A repetição de דקק retoma a abertura e ressalta o limite do processo: o cereal é triturado, mas não pulverizado.'
