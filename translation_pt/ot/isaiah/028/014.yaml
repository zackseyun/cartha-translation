  yaml_path: translation/ot/isaiah/028/014.yaml
  text: Therefore hear the word of Yahweh[a], you scoffing men, rulers of this people who are in Jerusalem.
translation:
  language: pt
  text: Portanto, ouçam a palavra de Yahweh, homens zombadores, governantes deste povo em Jerusalém.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Marca a conclusão decorrente do contexto anterior e preserva o encadeamento argumentativo profético.
- source_word: שִׁמְעוּ
  choice: ouçam
  rationale: O imperativo plural mantém tanto o sentido auditivo quanto o chamado implícito a dar atenção, sem explicitar demais como «obedeçam».
- source_word: דְבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Preserva a fórmula profética e verte o tetragrama como nome próprio, em vez de substituí-lo por um título.
- source_word: אַנְשֵׁי לָצוֹן
  choice: homens zombadores
  rationale: Mantém a referência masculina dirigida aos governantes e expressa em português natural a ideia de homens caracterizados pela zombaria ou escárnio.
- source_word: מֹשְׁלֵי הָעָם הַזֶּה
  choice: governantes deste povo
  rationale: Representa de modo conciso o particípio de משל e conserva o demonstrativo singular da expressão hebraica.
- source_word: אֲשֶׁר בִּירוּשָׁלָם
  choice: que está em Jerusalém
  rationale: A concordância singular faz a oração relativa retomar naturalmente «este povo», como permite a sintaxe hebraica, sem acrescentar um verbo ausente do original.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto traz diretamente o tetragrama; «Yahweh» preserva o nome pessoal em transliteração, sem substituí-lo por um título.
- issue: Referente da oração אֲשֶׁר בִּירוּשָׁלָם
  choice: este povo que está em Jerusalém
  alternative: governantes que estão em Jerusalém
  rationale: A oração relativa pode ser associada ao antecedente imediato «este povo»; a formulação conserva essa ligação gramatical sem eliminar a possibilidade contextual de que os governantes também estejam em Jerusalém.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. A ordem retórica do chamado profético foi preservada; evitou-se o pouco idiomático «homens de zombaria».
