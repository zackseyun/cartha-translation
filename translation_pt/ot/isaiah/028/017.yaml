id: ISA.28.17
reference: Isaiah 28:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/שַׂמְתִּ֤י מִשְׁפָּט֙ לְ/קָ֔ו וּ/צְדָקָ֖ה לְ/מִשְׁקָ֑לֶת וְ/יָעָ֤ה בָרָד֙ מַחְסֵ֣ה כָזָ֔ב וְ/סֵ֥תֶר מַ֖יִם יִשְׁטֹֽפוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/017.yaml
  text: And I will make justice the measuring line[a], and righteousness the plumb line; hail will sweep away the refuge of lies[c][b], and waters will flood the shelter.
translation:
  language: pt
  text: Farei da justiça[a] a linha de medir e da retidão o prumo[b]; o granizo varrerá o refúgio de mentiras, e as águas inundarão o esconderijo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “juízo”.
    reason: lexical_alternative
  - marker: b
    text: Ou “fio de prumo”.
    reason: lexical_alternative
  - marker: c
    text: Ou “abrigo”; o termo hebraico indica um lugar de ocultação ou proteção.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Farei
  rationale: Neste paralelismo com complementos predicativos, “farei de” expressa naturalmente em português o sentido de estabelecer algo como padrão.
- source_word: מִשְׁפָּט
  choice: justiça
  rationale: Aqui designa a justiça ou ordem justa usada por Deus como padrão de medição; “juízo” permanece como alternativa lexical em nota.
- source_word: לְקָו
  choice: a linha de medir
  rationale: קָו é a corda ou linha usada para medir em construções. A expressão explicita a metáfora arquitetônica sem alterar seu sentido.
- source_word: וּצְדָקָה
  choice: e da retidão
  rationale: “Retidão” preserva a dimensão moral de צְדָקָה e mantém a distinção poética em relação a מִשְׁפָּט, evitando repetir “justiça”.
- source_word: לְמִשְׁקָלֶת
  choice: o prumo
  rationale: O termo indica o peso ou instrumento usado para verificar o alinhamento vertical; “prumo” é conciso e corrente em português.
- source_word: וְיָעָה
  choice: varrerá
  rationale: O verbo comunica a ideia de limpar ou remover como que varrendo; com “granizo” como sujeito, a imagem permanece vívida e natural.
- source_word: בָרָד
  choice: o granizo
  rationale: Equivalente direto e inequívoco do termo hebraico.
- source_word: מַחְסֵה כָזָב
  choice: o refúgio de mentiras
  rationale: Preserva a construção hebraica e a ligação contextual com a falsa segurança mencionada no versículo 15.
- source_word: וְסֵתֶר
  choice: e o esconderijo
  rationale: סֵתֶר denota um lugar oculto que pode servir de proteção. “Esconderijo” retém mais diretamente a noção de ocultação, enquanto “abrigo” é indicado em nota como alternativa contextual.
- source_word: מַיִם
  choice: as águas
  rationale: Mantém o plural hebraico e o tom poético da imagem de inundação.
- source_word: יִשְׁטֹפוּ
  choice: inundarão
  rationale: Expressa de forma direta e idiomática a ação de transbordar sobre ou submergir o esconderijo.
theological_decisions:
- issue: Tradução do par ético מִשְׁפָּט / צְדָקָה
  choice: justiça / retidão
  alternative: juízo / justiça
  rationale: 'A opção conserva dois termos distintos e complementares: a ordem justa de Deus e a conformidade moral ao que é reto. Assim, não reduz o paralelismo a uma repetição nem impõe uma distinção doutrinária excessivamente rígida.'
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara e imagens de construção e tempestade preservadas. “Linha de medir” favorece compreensão imediata; “prumo” mantém concisão técnica sem soar excessivamente especializado.
