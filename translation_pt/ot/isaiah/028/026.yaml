  text: For his God instructs him in justice[a]; he teaches him.
translation:
  language: pt
  text: Pois seu Deus o instrui no procedimento correto[a]; ele o ensina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o orienta segundo a regra apropriada”. O hebraico para “procedimento correto” também pode significar “regra”, “norma”, “juízo” ou “justiça”; neste contexto agrícola, refere-se provavelmente ao método apropriado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִסְּרוֹ
  choice: o instrui
  rationale: O piel de יסר, com sufixo de objeto masculino singular, aqui indica orientação ou treinamento, não castigo. No contexto agrícola, “instrui” comunica de modo natural a capacitação recebida.
- source_word: לַמִּשְׁפָּט
  choice: quanto ao modo correto
  rationale: Embora מִשְׁפָּט costume significar “juízo” ou “justiça”, neste contexto de sabedoria agrícola designa a regra, o procedimento ou a maneira apropriada de trabalhar. A formulação conserva essa aplicação prática sem excluir totalmente o sentido normativo do termo.
- source_word: אֱלֹהָיו
  choice: o seu Deus
  rationale: Mantém o sufixo possessivo do hebraico e atribui explicitamente a Deus a instrução dada ao agricultor.
- source_word: יוֹרֶנּוּ
  choice: ele o ensina
  rationale: O hifil de ירה significa “ensinar”, “instruir” ou “orientar”. “Ele o ensina” preserva o paralelismo pedagógico e soa natural em português.
theological_decisions:
- issue: Fonte da sabedoria agrícola
  choice: O conhecimento prático do agricultor é atribuído a Deus, que o instrui e ensina.
  alternative: A frase pode ser entendida mais amplamente como uma referência à providência divina que orienta a capacidade humana.
  rationale: O sujeito explícito “o seu Deus” e os dois verbos de ensino apresentam Deus como fonte do saber prático, sem desenvolver uma doutrina além do que o versículo afirma.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Quanto ao modo correto” explicita o sentido prático de לַמִּשְׁפָּט no contexto agrícola, enquanto a nota preserva os sentidos mais formais de justiça, disciplina e instrução adequada.
