  text: אֲשֶׁ֣ר אָמַ֣ר אֲלֵי/הֶ֗ם זֹ֤את הַ/מְּנוּחָה֙ הָנִ֣יחוּ לֶֽ/עָיֵ֔ף וְ/זֹ֖את הַ/מַּרְגֵּעָ֑ה וְ/לֹ֥א אָב֖וּא שְׁמֽוֹעַ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/012.yaml
  text: to whom he said, “This is rest; give rest to the weary, and this is repose,” yet they were not willing to hear.
translation:
  language: pt
  text: 'a quem ele disse: “Isto é o descanso: deem descanso ao cansado; e isto é o alívio”, mas eles não quiseram ouvir.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְּנוּחָה
  choice: o descanso
  rationale: Mantém o sentido direto de repouso e descanso, em linguagem natural e digna.
- source_word: הָנִיחוּ לֶעָיֵף
  choice: deem descanso ao cansado
  rationale: Reproduz o imperativo plural e o destinatário da ação sem transformar a frase numa simples permissão para descansar.
- source_word: הַמַּרְגֵּעָה
  choice: o alívio
  rationale: Distingue o termo de מְנוּחָה e comunica a ideia de refrigério ou repouso restaurador em português corrente.
- source_word: וְלֹא אָבוּא שְׁמוֹעַ
  choice: Mas eles não quiseram ouvir
  rationale: Expressa a recusa voluntária indicada por אָבוּ e verte o infinitivo שְׁמוֹעַ de modo idiomático.
theological_decisions:
- issue: Identidade do sujeito de אָמַר
  choice: manter “ele disse” sem explicitar o referente
  alternative: explicitar “o SENHOR disse”
  rationale: O hebraico apresenta apenas o verbo na terceira pessoa; preservar o pronome evita inserir no versículo uma identificação fornecida pelo contexto.
- issue: Força de הָנִיחוּ
  choice: 'imperativo: “deem descanso”'
  alternative: 'permissivo: “deixem o cansado descansar”'
  rationale: A forma verbal é imperativa e pode exprimir a ordem de proporcionar descanso; a tradução mantém essa força sem resolver além do necessário quem deve concretamente oferecê-lo.
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. A formulação conserva o paralelismo entre “descanso” e “alívio”, bem como o contraste final introduzido por “Mas”.
