review_pass:
  verdict: revise
  source_fidelity: A tradução preserva a recorrência do avanço, a abrangência temporal e a cláusula final difícil. Contudo, «ela» não corresponde ao masculino singular dos verbos hebraicos, cujo antecedente contextual é o «flagelo» de 28:18; além disso, «levará» atenua o caráter de captura de יִקַּח.
  naturalness: «Cada vez que ele passar» e «os apanhará» são claros e naturais em português bíblico moderno. A inversão final, «entender a notícia será puro terror», torna a construção portuguesa mais fluente sem desfazer a concisão abrupta do hebraico.
  terminology: «Notícia» para שְׁמוּעָה mantém o sentido amplo de notícia, informe ou mensagem ouvida. «Puro terror» comunica bem רַק זְוָעָה.
  issues:
  - severity: medium
    issue: Pronome feminino «ela»
    rationale: Os verbos no hebraico são masculinos singulares e retomam o agente masculino apresentado no contexto imediato, o flagelo transbordante. O feminino introduz uma retomada gramaticalmente distinta, baseada numa paráfrase contextual («calamidade»).
  - severity: medium
    issue: «os levará» para יִקַּח אֶתְכֶם
    rationale: Embora לקח possa significar «levar», neste contexto de juízo o verbo descreve apreensão hostil. «Os apanhará» conserva melhor essa força sem expandir a imagem.
  - severity: low
    issue: Nota b não corresponde bem ao texto principal
    rationale: A nota apresenta como alternativa uma formulação quase idêntica e muda entre «notícia» e «mensagem» sem esclarecer a dificuldade sintática. Deve registrar a alternativa de vincular o infinitivo a «ouvir».
  revised_text: Cada vez que ele passar[a], os apanhará; pois passará manhã após manhã, de dia e de noite. E entender a notícia será puro terror[b].
  revised_footnotes:
  - marker: a
    text: 'Ou: “Sempre que ele passar, os apanhará”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “será puro terror ouvir a notícia”. Alguns ligam estreitamente “entender” ao que é ouvido.'
    reason: alternative_reading
  revision_rationale: A revisão restitui o masculino do referente contextual e torna mais forte a ideia de captura expressa por יִקַּח. Também ajusta a nota final para documentar de modo útil a sintaxe comprimida e discutida da cláusula hebraica, preservando sua ambiguidade.
