revisions:
- from: Sempre que passar[a], ela os levará; pois passará manhã após manhã, de dia e de noite. E será puro terror entender a mensagem[b].
  to: Cada vez que ele passar[a], os apanhará; pois passará manhã após manhã, de dia e de noite. E entender a notícia será puro terror[b].
  rationale: A revisão restitui o masculino do referente contextual e torna mais forte a ideia de captura expressa por יִקַּח. Também ajusta a nota final para documentar de modo útil a sintaxe comprimida e discutida da cláusula hebraica, preservando sua ambiguidade.
