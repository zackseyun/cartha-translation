  text: מִ/דֵּ֤י עָבְר/וֹ֙ יִקַּ֣ח אֶתְ/כֶ֔ם כִּֽי בַ/בֹּ֧קֶר בַּ/בֹּ֛קֶר יַעֲבֹ֖ר בַּ/יּ֣וֹם וּ/בַ/לָּ֑יְלָה וְ/הָיָ֥ה רַק זְוָעָ֖ה הָבִ֥ין שְׁמוּעָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/019.yaml
  text: As often as it passes through[a], it will seize you; for morning by morning it will pass through, by day and by night[b]; and it will be sheer terror to understand the message.
translation:
  language: pt
  text: Cada vez que ele passar[a], os apanhará; pois passará manhã após manhã, de dia e de noite. E entender a notícia será puro terror[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Sempre que ele passar, os apanhará”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “será puro terror ouvir a notícia”. Alguns ligam estreitamente “entender” ao que é ouvido.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִדֵּי עָבְרוֹ
  choice: Sempre que passar
  rationale: A expressão idiomática indica ocorrência repetida. “Sempre que” comunica naturalmente a força iterativa, e “passar” mantém a imagem do flagelo que atravessa a terra.
- source_word: יִקַּח אֶתְכֶם
  choice: ela os levará
  rationale: לקח significa basicamente “tomar/levar”. No contexto hostil do juízo, “os levará” preserva a concisão e pode sugerir que serão arrebatados, sem explicitar além do hebraico.
- source_word: בַבֹּקֶר בַּבֹּקֶר
  choice: manhã após manhã
  rationale: A repetição hebraica tem sentido distributivo. “Manhã após manhã” preserva tanto a recorrência quanto a cadência.
- source_word: בַיּוֹם וּבַלָּיְלָה
  choice: de dia e de noite
  rationale: Expressão portuguesa corrente que preserva o merismo e a ideia de recorrência contínua.
- source_word: רַק זְוָעָה
  choice: puro terror
  rationale: רַק tem aqui força exclusiva ou intensificadora, e זְוָעָה denota terror ou pavor. “Puro terror” é forte, claro e natural.
- source_word: הָבִין שְׁמוּעָה
  choice: entender a mensagem
  rationale: Mantém o sentido direto de בין, “entender”, e traduz שְׁמוּעָה de modo amplo como aquilo que é ouvido ou comunicado, sem reduzir a expressão a mera audição.
theological_decisions:
- issue: Referente dos verbos masculinos singulares
  choice: Usar o pronome feminino “ela”, retomando “a calamidade avassaladora” do versículo anterior sem repetir o substantivo.
  alternative: Explicitar “a calamidade avassaladora” ou usar uma construção sem pronome.
  rationale: O antecedente vem de Isaías 28:18. O pronome mantém a coesão contextual e não acrescenta uma identificação teológica ausente do texto.
- issue: Sintaxe da cláusula final
  choice: “será puro terror entender a mensagem”
  alternative: “será puro terror apenas ouvir a mensagem” ou “a mensagem por si só causará terror”
  rationale: O hebraico é comprimido e abrupto. A formulação escolhida conserva a ligação explícita entre “entender” e “mensagem”, sem resolver interpretativamente a dificuldade.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A repetição e a aspereza da cláusula final foram preservadas na medida possível.
