  text: כִּֽי קָצַ֥ר הַ/מַּצָּ֖ע מֵֽ/הִשְׂתָּרֵ֑עַ וְ/הַ/מַּסֵּכָ֥ה צָ֖רָה כְּ/הִתְכַּנֵּֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/020.yaml
  text: For the bed is too short to stretch oneself out on[a], and the covering too narrow to wrap oneself in.
translation:
  language: pt
  text: Pois a cama é curta demais para alguém se estender nela, e a coberta[a] é estreita demais para alguém se enrolar nela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “manta”. Aqui, o substantivo hebraico se refere a uma cobertura de cama; em outros contextos, a mesma forma pode significar uma imagem fundida. O contexto determina o sentido neste versículo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da afirmação anterior e preserva de modo natural a força causal ou explicativa.
- source_word: קָצַר הַמַּצָּע
  choice: a cama é curta demais
  rationale: מַצָּע designa o que se estende para deitar, e קָצַר comunica aqui insuficiência; a formulação é clara e mantém a imagem proverbial.
- source_word: מֵהִשְׂתָּרֵעַ
  choice: para alguém se estender nela
  rationale: Preserva o sentido reflexivo de estender-se e explicita naturalmente a relação com a cama sem identificar o sujeito de maneira indevida.
- source_word: וְהַמַּסֵּכָה
  choice: e a coberta
  rationale: No paralelismo com a cama, o substantivo indica uma cobertura de leito. “Coberta” é corrente, concreta e menos específica que “cobertor”.
- source_word: צָרָה
  choice: é estreita demais
  rationale: Expressa tanto a estreiteza quanto a insuficiência para o uso pretendido, em paralelo com “curta demais”.
- source_word: כְּהִתְכַּנֵּס
  choice: para alguém se enrolar nela
  rationale: Retrata a ação reflexiva de puxar ou juntar a coberta em torno de si, numa formulação idiomática em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura proverbial equilibrada. A repetição de “demais” torna explícita a insuficiência implícita no hebraico, e “alguém” evita formas marcadamente regionais ou uma especificação indevida do sujeito.
