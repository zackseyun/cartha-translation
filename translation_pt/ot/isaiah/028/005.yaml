  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִֽהְיֶה֙ יְהוָ֣ה צְבָא֔וֹת לַ/עֲטֶ֣רֶת צְבִ֔י וְ/לִ/צְפִירַ֖ת תִּפְאָרָ֑ה לִ/שְׁאָ֖ר עַמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/005.yaml
  text: In that day Yahweh of Armies will be a crown of beauty and a diadem of splendor for the remnant of his people[a].
translation:
  language: pt
  text: Naquele dia, Yahweh dos Exércitos será uma coroa de beleza e um diadema de esplendor para o remanescente do seu povo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o SENHOR dos Exércitos”. O título hebraico יְהוָה צְבָאוֹת é tradicionalmente traduzido dessa forma; “Yahweh dos Exércitos” preserva o nome divino e torna mais transparente o sentido do título.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Preserva a fórmula temporal profética em português natural e solene.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino e traduz צְבָאוֹת de modo transparente e corrente em português bíblico.
- source_word: יִהְיֶה
  choice: será
  rationale: Expressa de modo direto o estado futuro indicado pelo imperfeito hebraico.
- source_word: לַעֲטֶרֶת צְבִי
  choice: uma coroa de beleza
  rationale: Conserva a imagem da coroa e o valor estético de צְבִי, sem o confundir com o termo paralelo seguinte.
- source_word: וְלִצְפִירַת תִּפְאָרָה
  choice: e um diadema de esplendor
  rationale: Distingue poeticamente צְפִירָה de עֲטֶרֶת e verte תִּפְאָרָה por um termo elevado, porém compreensível.
- source_word: לִשְׁאָר עַמּוֹ
  choice: para o remanescente do seu povo
  rationale: Remanescente preserva o sentido profético de שְׁאָר; para comunica adequadamente a relação de benefício.
theological_decisions:
- issue: Tradução do título divino יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  alternative: SENHOR dos Exércitos
  rationale: O texto hebraico emprega o nome próprio יְהוָה; mantê-lo como Yahweh preserva essa forma, enquanto dos Exércitos torna transparente o sentido de צְבָאוֹת.
- issue: Sentido de שְׁאָר
  choice: remanescente
  alternative: restante
  rationale: No contexto profético de Isaías, o termo designa não apenas uma sobra numérica, mas o grupo sobrevivente do povo, sem precisar definir aqui todas as implicações teológicas do motivo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência profética. A dupla imagem poética é preservada por “coroa de beleza” e “diadema de esplendor”, evitando repetição lexical desnecessária.
