id: ISA.28.16
reference: Isaiah 28:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֛י יִסַּ֥ד בְּ/צִיּ֖וֹן אָ֑בֶן אֶ֣בֶן בֹּ֜חַן פִּנַּ֤ת יִקְרַת֙ מוּסָ֣ד מוּסָּ֔ד הַֽ/מַּאֲמִ֖ין לֹ֥א יָחִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/016.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am laying in Zion a stone, a tested stone, a precious cornerstone, a sure foundation[c][b]; the one who believes will not be in haste.'
translation:
  language: pt
  text: 'Por isso, assim diz o Senhor DEUS: “Eis que assento em Sião uma pedra, uma pedra provada, uma preciosa pedra angular, um alicerce bem firmado[a]. Quem crê[b] não se apressará[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Esta “pedra” é posteriormente aplicada ao Messias em Romanos 9:33 e 1 Pedro 2:6.
    reason: cross_reference
  - marker: b
    text: Ou “quem confia”. O particípio hebraico pode expressar confiança e dependência, além de crença.
    reason: lexical_alternative
  - marker: c
    text: Ou “não terá pressa”; alguns entendem o sentido, de modo mais interpretativo, como “não entrará em pânico”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor DEUS
  rationale: Mantém a combinação do título אֲדֹנָי com o nome divino, usando DEUS em versaletes para evitar a repetição pouco natural “Senhor SENHOR”.
- source_word: הִנְנִי
  choice: Eis que
  rationale: Conserva a força enfática e solene da fórmula profética, em linguagem ainda compreensível no português atual.
- source_word: יִסַּד
  choice: assento
  rationale: Expressa o ato divino de colocar e firmar a pedra como fundamento; “assentar” é natural no contexto de construção e preserva a dimensão fundacional do verbo.
- source_word: בְּצִיּוֹן
  choice: em Sião
  rationale: Traduz diretamente a localização indicada pela preposição בְּ e segue o uso português consolidado do topônimo.
- source_word: אֶבֶן אֶבֶן בֹּחַן
  choice: uma pedra, uma pedra provada
  rationale: Retém a repetição enfática de אֶבֶן e traduz בֹּחַן como uma qualidade comprovada por teste, sem explicitar além do hebraico quem a provou.
- source_word: פִּנַּת יִקְרַת
  choice: uma preciosa pedra angular
  rationale: Preserva tanto a função arquitetônica da pedra de esquina quanto sua preciosidade ou elevado valor.
- source_word: מוּסָד מוּסָּד
  choice: um alicerce bem firmado
  rationale: Comunica de modo natural a intensificação produzida pelas formas relacionadas, mantendo a imagem arquitetônica e a ideia de estabilidade.
- source_word: הַמַּאֲמִין
  choice: quem crê
  rationale: Representa o particípio substantivado sem marcar gênero e preserva o campo semântico de fé, deixando em nota a nuance igualmente possível de confiança.
- source_word: לֹא יָחִישׁ
  choice: não se apressará
  rationale: Mantém o sentido verbal básico de não agir com pressa e evita elevar a interpretação contextual “não entrará em pânico” ao texto principal.
theological_decisions:
- issue: Identidade da pedra fundamental
  choice: Manter a imagem arquitetônica sem identificar explicitamente a pedra no texto principal.
  alternative: Inserir “Messias” ou “Cristo” como referente explícito.
  rationale: O texto hebraico anuncia a pedra que Deus estabelece em Sião, mas não nomeia diretamente o Messias. A aplicação cristológica posterior é registrada em nota, sem substituir a formulação de Isaías.
- issue: Sentido de הַמַּאֲמִין
  choice: quem crê
  alternative: quem confia
  rationale: A raiz אמן pode abranger crença e confiança perseverante. “Crê” é apropriado ao enunciado e à sua recepção bíblica posterior, enquanto “confia” permanece como alternativa lexical legítima.
- issue: Força de לֹא יָחִישׁ
  choice: não se apressará
  alternative: não entrará em pânico
  rationale: A tradução principal preserva o sentido mais direto do verbo. A leitura relacionada a pânico pode exprimir uma implicação contextual, mas é interpretativa demais para substituir o hebraico no corpo do texto.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a repetição retórica de “pedra”, a metáfora arquitetônica e as ambiguidades de “crer/confiar” e “apressar-se/entrar em pânico”, sem inserir uma identificação messiânica no texto principal.
