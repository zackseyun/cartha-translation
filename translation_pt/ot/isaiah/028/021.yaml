id: ISA.28.21
reference: Isaiah 28:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֤י כְ/הַר פְּרָצִים֙ יָק֣וּם יְהוָ֔ה כְּ/עֵ֖מֶק בְּ/גִבְע֣וֹן יִרְגָּ֑ז לַ/עֲשׂ֤וֹת מַעֲשֵׂ֨/הוּ֙ זָ֣ר מַעֲשֵׂ֔/הוּ וְ/לַֽ/עֲבֹד֙ עֲבֹ֣דָת֔/וֹ נָכְרִיָּ֖ה עֲבֹדָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/021.yaml
  text: For Yahweh will rise up as at Mount Perazim[a]; he will be stirred up as in the Valley of Gibeon[c][b], to do his work—his strange work—and to perform his task—his foreign task.
translation:
  language: pt
  text: Pois Yahweh se levantará como no monte Perazim[a]; ficará agitado como no vale de Gibeão[b], para realizar a sua obra — obra que lhe é estranha — e executar a sua tarefa — tarefa que lhe é alheia.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O monte Perazim recorda a ocasião em que Yahweh irrompeu contra os inimigos de Davi (2 Samuel 5:20; 1 Crônicas 14:11).
    reason: cross_reference
  - marker: b
    text: O vale de Gibeão provavelmente recorda a intervenção de Yahweh na batalha de Gibeão (Josué 10:10–14).
    reason: cross_reference
  - marker: c
    text: 'Ou: “sua obra incomum [...] sua tarefa estranha”. Os dois adjetivos apresentam esse ato de juízo como estranho, alheio ou fora do habitual.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação causal da advertência precedente e mantém a ligação discursiva natural em português.
- source_word: כְהַר פְּרָצִים
  choice: como no monte Perazim
  rationale: A preposição comparativa remete ao acontecimento ocorrido nesse lugar, não apenas a uma comparação com o monte como objeto físico.
- source_word: יָקוּם
  choice: se levantará
  rationale: Expressa a intervenção decidida de Yahweh em linguagem profética clara e corrente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כְעֵמֶק בְּגִבְעוֹן
  choice: como no vale de Gibeão
  rationale: Conserva a referência topográfica e histórica em formulação natural em português, sem explicitar no corpo do versículo um evento que permanece alusivo.
- source_word: יִרְגָּז
  choice: ficará agitado
  rationale: רגז pode indicar tremor, agitação ou comoção. Aqui descreve Yahweh movendo-se para agir, sem sugerir perda de controle.
- source_word: לַעֲשׂוֹת מַעֲשֵׂהוּ
  choice: para realizar a sua obra
  rationale: Reproduz o sentido de fazer ou levar a efeito a obra, com fluidez em português.
- source_word: זָר מַעֲשֵׂהוּ
  choice: obra que lhe é estranha
  rationale: Mantém a força de זָר como algo estranho ou alheio e conserva a tensão teológica, sem explicar no texto por que a obra é assim caracterizada.
- source_word: וְלַעֲבֹד עֲבֹדָתוֹ
  choice: e executar a sua tarefa
  rationale: Representa a construção cognata hebraica em português natural e distingue este membro do paralelo anterior.
- source_word: נָכְרִיָּה עֲבֹדָתוֹ
  choice: tarefa que lhe é alheia
  rationale: Alheia comunica aquilo que é estranho ou não habitual em relação ao agente e preserva a variação lexical entre זָר e נָכְרִיָּה.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O hebraico traz diretamente o Tetragrama. A transliteração Yahweh preserva o nome pessoal, sem substituí-lo por um título.
- issue: Caracterização da obra divina como זָר e נָכְרִיָּה
  choice: obra que lhe é estranha; tarefa que lhe é alheia
  alternative: obra incomum; castigo inesperado
  rationale: A tradução mantém a linguagem desconcertante do hebraico e não resolve por paráfrase a tensão entre Yahweh e o ato de juízo aqui anunciado.
- issue: Referentes históricos de Perazim e Gibeão
  choice: Manter as alusões no texto e esclarecê-las em notas
  alternative: Inserir explicitamente as batalhas no corpo do versículo
  rationale: Os topônimos evocam intervenções divinas anteriores, mas o versículo não narra nem identifica expressamente esses episódios.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das notas segue a ocorrência dos marcadores no texto. A construção paralela e a repetição retórica do hebraico foram preservadas sem produzir uma formulação excessivamente literal.
