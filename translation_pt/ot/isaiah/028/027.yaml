revisions:
- from: Pois o cominho-preto[a] não é debulhado com a trilha, nem se faz passar sobre o cominho[b] a roda de uma carroça; ao contrário, o cominho-preto é batido com uma vara, e o cominho, com um bastão.
  to: Pois o cominho-preto[a] não é debulhado com um trilho de debulhar, nem se passa a roda de uma carroça sobre o cominho[b]; ao contrário, o cominho-preto é batido com uma vara, e o cominho, com um bastão.
  rationale: A revisão substitui «trilha» por «trilho de debulhar», que em português designa claramente o implemento agrícola pressuposto por חָרוּץ. Também simplifica a ordem da oração referente à roda da carroça e amplia prudentemente a nota sobre a identificação incerta de קֶצַח, sem alterar o sentido do versículo.
