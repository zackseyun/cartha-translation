  text: כִּ֣י לֹ֤א בֶֽ/חָרוּץ֙ י֣וּדַשׁ קֶ֔צַח וְ/אוֹפַ֣ן עֲגָלָ֔ה עַל כַּמֹּ֖ן יוּסָּ֑ב כִּ֧י בַ/מַּטֶּ֛ה יֵחָ֥בֶט קֶ֖צַח וְ/כַמֹּ֥ן בַּ/שָּֽׁבֶט־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/027.yaml
  text: For black cumin is not threshed with a sledge[a], nor is a cart wheel rolled over cumin; rather, black cumin is beaten out with a staff[b], and cumin with a rod.
translation:
  language: pt
  text: Pois o cominho-preto[a] não é debulhado com um trilho de debulhar, nem se passa a roda de uma carroça sobre o cominho[b]; ao contrário, o cominho-preto é batido com uma vara, e o cominho, com um bastão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, «endro» ou «nigela»; a identificação do hebraico qetsaḥ não é inteiramente certa.
    reason: lexical_alternative
  - marker: b
    text: Ou, possivelmente, «alcaravia» para o hebraico kammon.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָרוּץ
  choice: trilha
  rationale: No contexto agrícola, designa um instrumento cortante usado para debulhar. «Trilha» é o termo português para esse implement, embora seja menos conhecido fora do meio rural.
- source_word: יוּדַשׁ
  choice: é debulhado
  rationale: O Hophal de דוש descreve o produto sendo debulhado ou trilhado; «é debulhado» preserva a imagem agrícola e o contraste com a batida mais suave.
- source_word: קֶצַח
  choice: cominho-preto
  rationale: A planta é geralmente identificada como Nigella sativa. A identificação não é absolutamente certa, por isso a alternativa «nigela» é registrada em nota.
- source_word: אוֹפַן עֲגָלָה
  choice: a roda de uma carroça
  rationale: Reproduz naturalmente a expressão construta, literalmente «roda de carroça», e mantém a imagem concreta.
- source_word: יוּסָּב
  choice: se faz passar sobre
  rationale: O causativo passivo de סבב indica que a roda é levada a mover-se sobre o grão; esta formulação é idiomática e não exige que o movimento seja estritamente circular.
- source_word: כַּמֹּן
  choice: cominho
  rationale: É a identificação botânica usual; «alcaravia» é uma alternativa menos provável e consta em nota.
- source_word: מַטֶּה
  choice: vara
  rationale: Aqui indica um instrumento de madeira usado para bater o produto. «Vara» é natural e permite distingui-lo de שֵׁבֶט.
- source_word: יֵחָבֶט
  choice: é batido
  rationale: חבט descreve o ato de bater o produto para separar as sementes. O contexto torna o resultado suficientemente claro sem acrescentar uma expressão explicativa.
- source_word: שֵׁבֶט
  choice: bastão
  rationale: Neste contexto, designa outro instrumento de bater. «Bastão» mantém alguma distinção lexical em relação a מַטֶּה, sem atribuir com certeza uma diferença de peso que o texto não explicita.
- source_word: כִּי ... כִּי
  choice: Pois ... ao contrário
  rationale: O primeiro כִּי introduz a explicação; o segundo apresenta, em contraste, o método apropriado. A tradução explicita essa relação lógica em português corrente.
