reference: Isaiah 28:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֚י בְּ/לַעֲגֵ֣י שָׂפָ֔ה וּ/בְ/לָשׁ֖וֹן אַחֶ֑רֶת יְדַבֵּ֖ר אֶל הָ/עָ֥ם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/011.yaml
  text: For with mocking lips and with another tongue he will speak to this people[b][a],
translation:
  language: pt
  text: Pois, por meio de lábios zombeteiros[a] e de outra língua[b], ele falará a este povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lábios gaguejantes”; algumas traduções entendem que a expressão destaca uma fala incompreensível, não zombeteira.
    reason: lexical_alternative
  - marker: b
    text: “Outra língua” significa um idioma estrangeiro; a expressão provavelmente indica que Deus falaria em juízo por meio de invasores estrangeiros.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou razão ligada ao contexto anterior e preserva a conexão lógica.
- source_word: בְּלַעֲגֵי שָׂפָה
  choice: por meio de lábios zombeteiros
  rationale: לַעַג expressa zombaria, escárnio ou desprezo. A formulação mantém a imagem dos lábios e soa natural em português.
- source_word: וּבְלָשׁוֹן אַחֶרֶת
  choice: e de outra língua
  rationale: Preserva a metáfora hebraica de לָשׁוֹן, que pode designar tanto o órgão quanto uma língua ou idioma, sem explicitar no texto mais do que o original.
- source_word: יְדַבֵּר
  choice: ele falará
  rationale: O imperfeito é entendido como futuro no discurso profético. O sujeito singular permanece implícito no hebraico e não é identificado além do necessário.
- source_word: אֶל הָעָם הַזֶּה
  choice: a este povo
  rationale: Mantém o sentido comum de עָם e a força do demonstrativo, além do tom profético.
theological_decisions:
- issue: Sentido da fala estrangeira ou zombeteira
  choice: O texto principal conserva “lábios zombeteiros” e “outra língua”, sugerindo que Deus falará em juízo por meio de fala estrangeira.
  alternative: Entender a expressão principalmente como “lábios gaguejantes”, enfatizando uma fala incompreensível.
  rationale: לַעַג favorece lexicalmente a ideia de zombaria ou escárnio, enquanto “outra língua” mantém a referência à fala estrangeira. A nota registra a alternativa legítima sem importar para o texto principal usos teológicos posteriores.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Por meio de” esclarece o valor instrumental da preposição hebraica; a ordem das notas segue sua ocorrência no texto.
