  yaml_path: translation/ot/isaiah/028/024.yaml
  text: Does the plowman plow all day to sow? Does he keep opening and harrowing his ground?[a]
translation:
  language: pt
  text: Será que o lavrador passa o dia inteiro arando para semear? Será que continua abrindo e gradeando a sua terra?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Será que continua revolvendo e nivelando a sua terra?” Os verbos agrícolas hebraicos também podem ser traduzidos de modo mais geral; o texto principal preserva a provável sequência do preparo do campo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכֹל הַיּוֹם
  choice: Será que ... passa o dia inteiro
  rationale: A partícula interrogativa com כֹל הַיּוֹם introduz uma pergunta retórica. A formulação é natural em português e preserva a ideia temporal de passar todo o dia nessa atividade.
- source_word: יַחֲרֹשׁ / הַחֹרֵשׁ
  choice: o lavrador ... arando
  rationale: חרש significa “arar”, e o particípio designa quem ara. “Lavrador” é corrente e digno; “arando” mantém a imagem agrícola e a ligação lexical, ainda que não reproduza integralmente a repetição hebraica.
- source_word: לִזְרֹעַ
  choice: para semear
  rationale: O infinitivo indica a finalidade da aração. “Para semear” é conciso, preciso e natural.
- source_word: יְפַתַּח
  choice: abrir sulcos
  rationale: פתח significa literalmente “abrir”; no contexto agrícola, refere-se a abrir ou revolver o solo. A explicitação “sulcos” comunica naturalmente essa imagem em português sem perder o sentido contextual.
- source_word: וִישַׂדֵּד
  choice: gradear
  rationale: Neste contexto, שדד é um termo agrícola referente a trabalhar o solo após a aração, provavelmente destorroando, nivelando ou passando a grade. “Gradear” preserva a provável sequência do preparo do campo.
- source_word: אַדְמָתוֹ
  choice: o seu solo
  rationale: אדמה designa aqui a terra cultivável. “Solo” é claro e adequado ao contexto agrícola; o possessivo preserva o sufixo hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A dupla pergunta retórica foi mantida. “Será que” torna explícito o valor interrogativo sem resolver a resposta implícita. O termo agrícola “gradear” é específico, por isso a nota oferece uma formulação mais geral.
