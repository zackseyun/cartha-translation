  text: הֲ/לוֹא֙ אִם שִׁוָּ֣ה פָנֶ֔י/הָ וְ/הֵפִ֥יץ קֶ֖צַח וְ/כַמֹּ֣ן יִזְרֹ֑ק וְ/שָׂ֨ם חִטָּ֤ה שׂוֹרָה֙ וּ/שְׂעֹרָ֣ה נִסְמָ֔ן וְ/כֻסֶּ֖מֶת גְּבֻלָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/025.yaml
  text: Does he not[a], when he has leveled its surface, scatter black cumin and sow cumin, and put wheat in rows, and barley in its appointed place[c][b], and spelt at its border?
translation:
  language: pt
  text: Depois de nivelar a superfície do solo, acaso não espalha o cominho-preto[a], semeia o cominho e põe o trigo em fileiras[b], a cevada no lugar designado e a espelta[c] na borda do campo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «cominho-negro» ou «nigela»; a identificação exata de קֶצַח é incerta.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico שׂוֹרָה é difícil; também pode significar «como cultura principal» ou «no melhor lugar».
    reason: lexical_alternative
  - marker: c
    text: Ou «trigo-emmer»; não se sabe ao certo qual cereal é designado por כֻסֶּמֶת.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא אִם
  choice: Quando... acaso não
  rationale: Reproduz em português natural a pergunta retórica com nuance temporal-condicional, sem recorrer à construção rígida «não é que, se».
- source_word: שִׁוָּה פָנֶיהָ
  choice: deixa plana a superfície do solo
  rationale: O verbo indica tornar plano ou nivelar, e «sua face» designa idiomaticamente a superfície do terreno.
- source_word: הֵפִיץ
  choice: espalha
  rationale: Expressa a dispersão ampla das sementes no contexto agrícola.
- source_word: קֶצַח
  choice: cominho-preto
  rationale: É uma identificação moderna comum da planta, embora não seja botanicamente certa; a incerteza é registrada em nota.
- source_word: כַמֹּן
  choice: cominho
  rationale: Identificação bem estabelecida e corrente em português.
- source_word: יִזְרֹק
  choice: semeia
  rationale: Embora o verbo possa significar lançar ou espalhar, aqui descreve claramente a semeadura.
- source_word: חִטָּה שׂוֹרָה
  choice: trigo em fileiras
  rationale: «Trigo» é seguro; שׂוֹרָה é difícil, mas «em fileiras» se ajusta ao plantio ordenado descrito no contexto. Outras possibilidades são mantidas em nota.
- source_word: שְׂעֹרָה נִסְמָן
  choice: a cevada no lugar designado
  rationale: נִסְמָן provavelmente se relaciona com marcar ou designar e comunica a distribuição intencional das culturas.
- source_word: כֻסֶּמֶת
  choice: espelta
  rationale: É a equivalência tradicional e inteligível, mas a identificação exata do cereal é incerta e pode ser trigo-emmer.
- source_word: גְּבֻלָתוֹ
  choice: nas bordas do campo
  rationale: Torna explícito o referente agrícola implícito do sufixo e usa o plural idiomático português para as margens do terreno.
