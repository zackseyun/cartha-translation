  text: אֶת מִי֙ יוֹרֶ֣ה דֵעָ֔ה וְ/אֶת מִ֖י יָבִ֣ין שְׁמוּעָ֑ה גְּמוּלֵי֙ מֵֽ/חָלָ֔ב עַתִּיקֵ֖י מִ/שָּׁדָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/009.yaml
  text: Whom will he teach knowledge[a], and to whom will he explain the message? Those weaned from milk[b], those taken from the breasts?
translation:
  language: pt
  text: A quem ensinará[a] o conhecimento, e a quem fará entender a mensagem[b]? Aos desmamados do leite, aos que foram afastados dos seios?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico não declara o sujeito de “ensinará” e “fará entender”; no contexto, estas palavras podem referir-se zombeteiramente a Isaías.
    reason: alternative_reading
  - marker: b
    text: Ou “o relato”, “a notícia” ou “aquilo que se ouve”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹרֶה
  choice: ensinará
  rationale: O hifil de ירה significa comumente “ensinar, instruir”. O futuro em português se ajusta à pergunta retórica, sem identificar o sujeito implícito.
- source_word: דֵעָה
  choice: o conhecimento
  rationale: O substantivo denota conhecimento ou entendimento; “conhecimento” é a correspondência mais direta e mantém o paralelismo com a mensagem a ser compreendida.
- source_word: יָבִין
  choice: fará entender
  rationale: O hifil de בין tem sentido causativo, “levar alguém a entender”. “Fará entender” preserva esse valor de modo claro e mantém a tensão retórica.
- source_word: שְׁמוּעָה
  choice: a mensagem
  rationale: O termo pode designar mensagem, notícia, relato ou aquilo que se ouve. “Mensagem” é natural no contexto de instrução e não restringe excessivamente o sentido.
- source_word: גְּמוּלֵי מֵחָלָב
  choice: aos desmamados do leite
  rationale: A expressão descreve os que foram desmamados, com מן indicando afastamento. A formulação conserva de perto a imagem e o paralelismo hebraicos.
- source_word: עַתִּיקֵי מִשָּׁדָיִם
  choice: aos que foram afastados dos seios
  rationale: עתק expressa remoção ou afastamento. A oração relativa é mais natural em português do que um particípio substantivado e preserva o plural literal “seios”.
- source_word: אֶת מִי ... וְאֶת מִי
  choice: A quem ... e a quem
  rationale: A repetição mantém as duas perguntas paralelas e retóricas do hebraico.
theological_decisions:
- issue: Referente dos verbos na terceira pessoa do singular
  choice: 'Manter o sujeito não expresso em português: “ensinará” e “fará entender”.'
  alternative: Explicitar “ele”, identificando-o genericamente, ou interpretar o referente como Isaías, o SENHOR ou outra pessoa no contexto.
  rationale: O hebraico não declara o sujeito. Como o português permite sujeito oculto, a tradução preserva ainda melhor a ambiguidade textual sem impor uma identificação.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe retórica próxima do hebraico. O sujeito permanece oculto para conservar a ambiguidade do original; a imagem de crianças recém-desmamadas é mantida sem explicação interpretativa no corpo do versículo.
