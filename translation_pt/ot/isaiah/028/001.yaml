revisions:
- from: Ai da coroa orgulhosa dos bêbados de Efraim[a] e da flor murcha de seu esplendor glorioso, que fica no alto do vale fértil[b] — os que estão prostrados pelo vinho![c]
  to: Ai da coroa orgulhosa dos bêbados de Efraim[a] e da flor murcha de seu glorioso esplendor, que está no alto do vale fértil[b], dos vencidos pelo vinho[c].
  rationale: A revisão remove a pontuação que separava indevidamente a última expressão e melhora a colocação portuguesa de “glorioso”. Mantêm-se as metáforas, a ambiguidade poética e todas as âncoras de nota.
