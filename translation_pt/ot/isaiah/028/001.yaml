  text: ה֗וֹי עֲטֶ֤רֶת גֵּאוּת֙ שִׁכֹּרֵ֣י אֶפְרַ֔יִם וְ/צִ֥יץ נֹבֵ֖ל צְבִ֣י תִפְאַרְתּ֑/וֹ אֲשֶׁ֛ר עַל רֹ֥אשׁ גֵּֽיא שְׁמָנִ֖ים הֲל֥וּמֵי יָֽיִן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/001.yaml
  text: Woe to the proud crown of the drunkards of Ephraim[a], and to the fading flower of his glorious beauty, which is on the head of the fertile valley[c][b], those overcome by wine.
translation:
  language: pt
  text: Ai da coroa orgulhosa dos bêbados de Efraim[a] e da flor murcha de seu glorioso esplendor, que está no alto do vale fértil[b], dos vencidos pelo vinho[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido: “a coroa de orgulho dos bêbados de Efraim”. A poesia hebraica permite mais de uma formulação da mesma metáfora.'
    reason: lexical_alternative
  - marker: b
    text: “Vale fértil” traduz literalmente “vale de gorduras”, expressão que indica uma terra rica e exuberante.
    reason: cultural_note
  - marker: c
    text: Ou “os que foram vencidos pelo vinho”. A expressão hebraica é vívida e retrata pessoas como golpeadas ou derrubadas pelo vinho.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Ai
  rationale: Introduz um oráculo profético de lamento e juízo; “Ai” conserva essa força em português atual e solene.
- source_word: עֲטֶרֶת גֵּאוּת
  choice: coroa orgulhosa
  rationale: A construção significa literalmente “coroa de orgulho”. A forma adjetival é natural em português e mantém tanto a imagem da coroa quanto a ideia de arrogância.
- source_word: שִׁכֹּרֵי אֶפְרַיִם
  choice: bêbados de Efraim
  rationale: O genitivo identifica os embriagados como pertencentes a Efraim. “Bêbados” é direto, corrente e adequado à denúncia profética.
- source_word: וְצִיץ נֹבֵל
  choice: e da flor murcha
  rationale: צִיץ designa flor ou botão, e נֹבֵל indica algo que murcha ou definha. “Flor murcha” preserva de modo conciso a imagem poética.
- source_word: צְבִי תִפְאַרְתּוֹ
  choice: de seu esplendor glorioso
  rationale: Os dois substantivos sobrepõem as ideias de beleza, esplendor e glória. A tradução mantém a linguagem elevada sem tentar eliminar a densidade poética do hebraico; o possessivo conserva a referência coletiva provável a Efraim ou à sua coroa.
- source_word: אֲשֶׁר עַל רֹאשׁ גֵּיא שְׁמָנִים
  choice: que fica no alto do vale fértil
  rationale: רֹאשׁ tem sentido espacial, “cabeça, topo, alto”, enquanto “vale de gorduras” é uma expressão concreta para terra rica e fértil. “No alto do vale fértil” comunica ambas as ideias com naturalidade.
- source_word: הֲלוּמֵי יָיִן
  choice: os que estão prostrados pelo vinho
  rationale: O particípio passivo de הלם sugere pessoas golpeadas, derrubadas ou vencidas. “Prostrados pelo vinho” conserva a imagem forte e permanece idiomático em português.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil, com tom profético digno. A estrutura paralela das duas imagens — coroa e flor — foi preservada, assim como a transição abrupta para a expressão final sobre os vencidos pelo vinho.
