  text: וְ/כֻפַּ֤ר בְּרִֽיתְ/כֶם֙ אֶת מָ֔וֶת וְ/חָזוּתְ/כֶ֥ם אֶת שְׁא֖וֹל לֹ֣א תָק֑וּם שׁ֤וֹט שׁוֹטֵף֙ כִּ֣י יַֽעֲבֹ֔ר וִ/הְיִ֥יתֶם ל֖/וֹ לְ/מִרְמָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/018.yaml
  text: And your covenant with death will be annulled[a], and your agreement with Sheol will not stand; when the overwhelming scourge passes through[b], you will become a trampling place for it.
translation:
  language: pt
  text: A aliança de vocês com a morte será anulada[a], e o acordo de vocês com o Seol[b] não subsistirá. Quando o açoite avassalador[c] passar, vocês serão pisoteados por ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico também pode evocar a ideia de ser coberta, purgada ou expiada; neste contexto, o sentido mais provável é que a aliança será invalidada.
    reason: lexical_alternative
  - marker: b
    text: Seol é o termo hebraico para o domínio dos mortos; também pode ser traduzido, de modo mais restrito, por “sepultura”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “o açoite transbordante”. A imagem hebraica combina um açoite com uma força arrebatadora, semelhante à de uma inundação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻפַּר
  choice: será anulada
  rationale: Embora a raiz כפר costume estar ligada a cobrir ou fazer expiação, com “aliança” neste contexto jurídico e irônico indica que o pacto será cancelado ou perderá a validade. “Será anulada” comunica esse sentido sem introduzir linguagem sacrificial indevida.
- source_word: בְּרִיתְכֶם
  choice: a aliança de vocês
  rationale: “Aliança” preserva o termo formal do hebraico e a ironia de uma suposta aliança com a morte; “de vocês” é claro e amplamente natural em português.
- source_word: אֶת־מָוֶת
  choice: com a morte
  rationale: A construção designa a outra parte da aliança. “Morte” mantém a personificação retórica do texto.
- source_word: חָזוּתְכֶם
  choice: o acordo de vocês
  rationale: No paralelismo com “aliança” e diante de “Seol”, o substantivo denota um acordo ou pacto, não uma visão.
- source_word: שְׁאוֹל
  choice: Seol
  rationale: A transliteração portuguesa preserva o conceito hebraico do domínio dos mortos e evita reduzi-lo simplesmente à sepultura.
- source_word: לֹא תָקוּם
  choice: não subsistirá
  rationale: No contexto de um acordo, o verbo indica que ele não permanecerá válido nem se sustentará. “Não subsistirá” é conciso, digno e idiomático.
- source_word: שׁוֹט שׁוֹטֵף
  choice: o açoite avassalador
  rationale: A expressão reúne a violência de um açoite e o movimento irresistível de uma inundação. “Avassalador” transmite essa força dupla em português natural.
- source_word: יַעֲבֹר
  choice: passar
  rationale: O verbo descreve o juízo atravessando o povo ou a terra; “passar” mantém o movimento sem sugerir que alguém será poupado.
- source_word: וִהְיִיתֶם לוֹ לְמִרְמָס
  choice: vocês serão pisoteados por ele
  rationale: A formulação hebraica diz literalmente que eles se tornarão, para o açoite, objeto ou lugar de pisoteio. A forma passiva comunica o resultado com clareza e naturalidade, mantendo a imagem de humilhação sob os pés.
theological_decisions:
- issue: Personificação da morte e do Seol
  choice: Manter “morte” e “Seol” como poderes personificados na imagem poética.
  alternative: Traduzir de modo mais explicativo como “morte” e “sepultura” ou “domínio dos mortos”.
  rationale: O versículo ridiculariza a falsa segurança de Judá como se ela tivesse feito uma aliança com a Morte e um acordo com o Seol. A imagem é preservada sem afirmar além do que o texto diz sobre a natureza dessas realidades.
- issue: Tradução de שְׁאוֹל
  choice: Usar a transliteração “Seol” no texto principal.
  alternative: “a sepultura” ou “o mundo dos mortos”.
  rationale: “Sepultura” estreitaria o sentido, enquanto “mundo dos mortos” explicaria demais. “Seol”, acompanhado de nota, conserva a tensão e o universo conceitual hebraico.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Emprega “vocês” para o plural e “Seol” como forma transliterada corrente em português. A sintaxe foi levemente descompactada em duas frases para preservar clareza e impacto retórico.
