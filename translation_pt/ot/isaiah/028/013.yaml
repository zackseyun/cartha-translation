base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/013.yaml
  text: So the word of Yahweh will be to them[a], “Order on order, order on order, line on line, line on line, a little here, a little there,” so that they may go, and stumble backward, and be broken, and snared, and captured.
translation:
  language: pt
  text: 'Assim, a palavra de Yahweh será para eles[a]:


    “Ordem sobre ordem, ordem sobre ordem,

    linha sobre linha, linha sobre linha,

    um pouco aqui, um pouco ali”,


    para que andem, tropecem para trás, sejam quebrados, enredados e capturados.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mandamento sobre mandamento, mandamento sobre mandamento”; tradicionalmente: “preceito sobre preceito, preceito sobre preceito”. O hebraico é conciso e provavelmente imita uma repetição zombeteira ou infantil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Assim, ... será
  rationale: No contexto, a construção introduz a consequência do que foi dito antes. “Assim” expressa essa ligação de modo natural sem tornar explícito mais do que o hebraico.
- source_word: דְּבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: “Palavra” preserva o conhecido idioma profético de דָּבָר, enquanto “Yahweh” representa o nome divino יהוה em vez de substituí-lo por um título.
- source_word: צַו לָצָו צַו לָצָו
  choice: Ordem sobre ordem, ordem sobre ordem
  rationale: A expressão é difícil e deliberadamente entrecortada, talvez imitando fala zombeteira ou infantil. “Ordem” é lexicalmente plausível e conserva a repetição, sem recorrer ao tradicional e menos corrente “preceito”.
- source_word: קַו לָקָו קַו לָקָו
  choice: linha sobre linha, linha sobre linha
  rationale: קַו designa normalmente uma linha, inclusive uma linha de medir. A formulação conserva a concisão, o paralelismo e a cadência repetitiva do hebraico.
- source_word: זְעֵיר שָׁם זְעֵיר שָׁם
  choice: um pouco aqui, um pouco ali
  rationale: A expressão repetida tem sentido distributivo. Esta formulação é idiomática em português e mantém o efeito de pequenas porções dispersas.
- source_word: לְמַעַן
  choice: para que
  rationale: לְמַעַן pode introduzir propósito ou resultado. “Para que” preserva a força judicial e também a tensão entre essas nuances.
- source_word: יֵלְכוּ
  choice: sigam
  rationale: הלך significa “ir, andar, seguir”. “Sigam” funciona naturalmente na sequência e evita sugerir que se trata apenas do ato físico de caminhar.
- source_word: וְכָשְׁלוּ אָחוֹר
  choice: tropecem para trás
  rationale: כשל expressa tropeçar ou cambalear, e אָחוֹר indica movimento para trás. A tradução mantém a imagem concreta.
- source_word: וְנִשְׁבָּרוּ
  choice: sejam quebrados
  rationale: O nifal de שבר tem aqui sentido passivo. “Sejam quebrados” conserva a metáfora e a força judicial sem intensificação indevida.
- source_word: וְנוֹקְשׁוּ
  choice: enredados
  rationale: O verbo יקשׁ indica cair numa armadilha ou ficar preso. “Enredados” é conciso e mantém a imagem de uma cilada.
- source_word: וְנִלְכָּדוּ
  choice: capturados
  rationale: לכד significa capturar ou tomar. “Capturados” distingue o desfecho do ato anterior de serem enredados e preserva a progressão.
theological_decisions:
- issue: Propósito ou resultado judicial na oração final
  choice: Manter “para que”, permitindo que a palavra de Yahweh seja entendida como instrumento de juízo que conduz à queda deles.
  alternative: Ler a oração apenas como descrição da percepção zombeteira que eles têm da fala profética.
  rationale: O contexto imediato e לְמַעַן seguido pelos verbos de queda apontam para uma dimensão judicial, mas a tradução não explica além do texto nem elimina a tensão entre propósito e resultado.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A disposição em linhas realça a cadência repetitiva do hebraico. A repetição foi preservada, e a expressão difícil não foi suavizada nem interpretada de modo denominacional.
