id: ISA.28.15
reference: Isaiah 28:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י אֲמַרְתֶּ֗ם כָּרַ֤תְנֽוּ בְרִית֙ אֶת מָ֔וֶת וְ/עִם שְׁא֖וֹל עָשִׂ֣ינוּ חֹזֶ֑ה שיט שׁוֹטֵ֤ף כִּֽי עבר לֹ֣א יְבוֹאֵ֔/נוּ כִּ֣י שַׂ֧מְנוּ כָזָ֛ב מַחְסֵ֖/נוּ וּ/בַ/שֶּׁ֥קֶר נִסְתָּֽרְנוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/015.yaml
  text: Because you have said[a], “We have made a covenant with death, and with Sheol we have made an agreement. When the overwhelming scourge passes through, it will not come to us[c][b], because we have made falsehood our refuge and have hidden ourselves in deceit.”
translation:
  language: pt
  text: 'Porque vocês disseram: “Fizemos uma aliança com a morte e, com o Sheol[a], firmamos um acordo[b]. Quando o flagelo avassalador[c] passar, não chegará até nós, porque fizemos da falsidade o nosso refúgio e nos escondemos na mentira.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sheol é o termo hebraico para o domínio dos mortos; não equivale necessariamente às noções posteriores de inferno.
    reason: cultural_note
  - marker: b
    text: Ou “firmamos um pacto” ou “um tratado”. O termo hebraico é difícil e também pode significar “visão”, mas, neste contexto, provavelmente indica um acordo paralelo a “aliança”.
    reason: lexical_alternative
  - marker: c
    text: Ou “o flagelo transbordante” ou “o açoite inundador”. A expressão hebraica é difícil e parece combinar a imagem de uma inundação arrasadora com a de um golpe ou flagelo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אֲמַרְתֶּם
  choice: Porque vocês disseram
  rationale: Mantém a força causal de כִּי no contexto e verte o perfeito por um passado natural em português, introduzindo diretamente a declaração citada.
- source_word: כָּרַתְנוּ בְרִית
  choice: Fizemos uma aliança
  rationale: Traduz naturalmente o idioma hebraico literal “cortar uma aliança”, preservando sua força pactual.
- source_word: מָוֶת
  choice: a morte
  rationale: Conserva a personificação retórica da morte como parte da aliança, sem acrescentar explicação interpretativa ao texto.
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: A transliteração preserva o conceito hebraico do domínio dos mortos e evita identificá-lo indevidamente com noções posteriores de inferno.
- source_word: עָשִׂינוּ חֹזֶה
  choice: firmamos um acordo
  rationale: No paralelismo com “aliança”, חֹזֶה provavelmente designa um acordo ou pacto; “firmamos” é idiomático em português e expressa a celebração deliberada do acordo.
- source_word: שיט שׁוֹטֵף
  choice: o flagelo avassalador
  rationale: A expressão é difícil e combina, ao que parece, a imagem de um golpe ou flagelo com a força de uma inundação que tudo arrasta. “Avassalador” comunica essa força sem produzir uma formulação portuguesa artificial.
- source_word: כִּי עבר
  choice: Quando ... passar
  rationale: Nesse contexto, כִּי introduz a circunstância temporal imaginada pelos falantes, enquanto עבר descreve a força destrutiva atravessando a região.
- source_word: לֹא יְבוֹאֵנוּ
  choice: não chegará até nós
  rationale: Expressa de modo natural a confiança alegada de que o agente destrutivo não os alcançará.
- source_word: כָזָב מַחְסֵנוּ
  choice: da falsidade o nosso refúgio
  rationale: Preserva o substantivo abstrato e a metáfora de proteção, bem como o tom solene da acusação profética.
- source_word: וּבַשֶּׁקֶר נִסְתָּרְנוּ
  choice: e nos escondemos na mentira
  rationale: Mantém o sentido reflexivo do verbo e o paralelismo entre falsidade e mentira, em linguagem clara e corrente.
theological_decisions:
- issue: Sentido de שְׁאוֹל
  choice: Sheol
  alternative: a sepultura; o mundo dos mortos
  rationale: O termo hebraico não corresponde necessariamente a concepções teológicas posteriores de inferno. A transliteração conserva sua amplitude conceitual, acompanhada de nota explicativa.
- issue: Personificação da morte e do Sheol
  choice: Mantida como parceiros da aliança e do acordo
  alternative: Explicitar tudo como mera figura de linguagem
  rationale: A fala citada apresenta retoricamente a morte e o Sheol como partes de um pacto. A tradução conserva essa imagem e sua tensão sem explicá-la ou reduzi-la.
- issue: Natureza da segurança alegada
  choice: Preservada como confiança na falsidade e na mentira
  alternative: Identificar explicitamente uma potência política, prática religiosa ou aliança histórica específica
  rationale: O versículo acusa os falantes de buscarem proteção enganosa, mas não identifica expressamente neste ponto o referente histórico exato; a tradução evita importar uma interpretação específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” torna explícita a segunda pessoa plural do hebraico sem regionalismo excessivo. “Sheol” é mantido no corpo do texto e explicado em nota; as imagens proféticas e a ambiguidade lexical relevante são preservadas.
