  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/שְׁאֵ֣רִית֔/וֹ לְ/אֵ֥ל עָשָׂ֖ה לְ/פִסְל֑/וֹ יסגוד ל֤/וֹ וְ/יִשְׁתַּ֨חוּ֙ וְ/יִתְפַּלֵּ֣ל אֵלָ֔י/ו וְ/יֹאמַר֙ הַצִּילֵ֔/נִי כִּ֥י אֵלִ֖/י אָֽתָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/017.yaml
  text: And with the rest of it he makes a god—his carved image[a]; he bows down to it and worships, and prays to it and says, “Deliver me[b], for you are my god.”
translation:
  language: pt
  text: 'E com o restante dela faz um deus, sua imagem esculpida[a]; prostra-se diante dela, adora-a e ora a ela, dizendo: “Livra-me, pois tu és o meu deus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seu ídolo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאֵרִיתוֹ
  choice: E com o restante dela
  rationale: שְׁאֵרִית designa o restante ou sobra; o sufixo retoma a madeira do contexto anterior. A formulação explicita de modo natural o uso desse restante como material.
- source_word: לְאֵל עָשָׂה
  choice: faz um deus
  rationale: Com עשה, a preposição לְ indica resultado ou finalidade. “Faz um deus” conserva a ironia de fabricar aquilo que será tratado como divindade.
- source_word: לְפִסְלוֹ
  choice: sua imagem esculpida
  rationale: פֶסֶל é uma imagem produzida por entalhe e usada como objeto de culto. “Imagem esculpida” preserva o aspecto concreto sem substituir o termo pela interpretação “ídolo”.
- source_word: יִסְגּוֹד לוֹ
  choice: prostra-se diante dela
  rationale: סגד expressa prostração em homenagem ou culto. A expressão portuguesa é corrente, clara e mantém o gesto físico.
- source_word: וְיִשְׁתַּחוּ
  choice: adora-a
  rationale: שׁחה também pode descrever prostração, mas em contexto cultual comunica adoração. A escolha evita repetição mecânica e preserva a acumulação retórica de atos de culto.
- source_word: וְיִתְפַּלֵּל אֵלָיו
  choice: e ora a ela
  rationale: התפלל אל significa dirigir oração a alguém ou algo. O feminino concorda naturalmente em português com “imagem”, referente imediato.
- source_word: הַצִּילֵנִי
  choice: Livra-me
  rationale: O imperativo de נצל pede libertação ou resgate. “Livra-me” mantém a concisão e a ironia de solicitar salvação a uma imagem fabricada.
- source_word: כִּי אֵלִי אָתָּה
  choice: pois tu és o meu deus
  rationale: כִּי apresenta a razão do pedido, e אֵלִי significa “meu deus”. A tradução preserva diretamente a declaração idólatra.
theological_decisions:
- issue: Gênero dos pronomes referentes à imagem
  choice: Usar formas femininas em concordância com “imagem” até a fala dirigida ao objeto
  alternative: Empregar formas masculinas para espelhar o gênero gramatical hebraico de פֶסֶל e אֵל
  rationale: O masculino hebraico decorre dos substantivos empregados e não afirma por si só personalidade real. Em português, a concordância com “imagem” é natural; dentro da fala, “tu” preserva a personificação irônica feita pelo adorador.
- issue: Designação do objeto fabricado
  choice: Traduzir אֵל por “deus” e פֶסֶל por “imagem esculpida”
  alternative: Traduzir ambos de maneira interpretativa como “ídolo”
  rationale: 'A distinção lexical mantém a tensão satírica do texto: a pessoa fabrica uma imagem e passa a chamá-la de seu deus, sem a tradução resolver antecipadamente essa ironia.'
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. O presente narrativo acompanha a descrição vívida do contexto. A sequência “prostra-se, adora e ora” preserva a acumulação dos atos cultuais.
