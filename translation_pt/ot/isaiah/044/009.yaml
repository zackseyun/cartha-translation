revisions:
- from: Todos os que fazem uma imagem esculpida são nada[a], e as coisas que eles tanto estimam[b] não servem para nada. Suas testemunhas[c] não veem nem sabem, de modo que serão envergonhadas[d].
  to: Todos os que fazem uma imagem esculpida não valem nada[a], e as coisas que estimam[b] não trazem proveito. Suas testemunhas[c] não veem nem sabem, para que se envergonhem[d].
  rationale: A revisão restitui o valor intransitivo de יֵבֹשׁוּ com «se envergonhem», evitando tanto a voz passiva quanto uma marca de gênero que limite o referente ambíguo de «suas testemunhas». «Não valem nada» melhora a idiomaticidade de תֹּהוּ no português atual, conservando a denúncia de completa falta de valor; «não trazem proveito» representa de perto a ideia de benefício de יוֹעִילוּ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:31:01Z'
review_pass:
  verdict: revise
  source_fidelity: A estrutura e os referentes ambíguos do hebraico foram em geral bem preservados. Contudo, יֵבֹשׁוּ é forma qal plural, com o sentido de «envergonhar-se/ficar envergonhado», não um passivo explícito («ser envergonhado»). Além disso, o feminino em «envergonhadas» decorre da concordância portuguesa com «testemunhas», mas introduz uma especificação gramatical que não corresponde ao masculino plural hebraico nem acomoda igualmente a leitura irônica em que as imagens são as “testemunhas”.
  naturalness: O texto é claro e adequado ao português moderno. «São nada» é possível em registro profético, mas «não valem nada» é mais idiomático e transmite no contexto a vacuidade/inutilidade polemicamente afirmada por תֹּהוּ.
  terminology: «Imagem esculpida» representa bem פֶּסֶל; «testemunhas» mantém corretamente a ambiguidade de עֵדֵיהֶם; e «as coisas que eles estimam» preserva o sentido afetivo de חֲמוּדֵיהֶם sem identificar indevidamente o referente.
  issues:
  - severity: medium
    issue: «serão envergonhadas» traduz יֵבֹשׁוּ como passivo e impõe concordância feminina.
    rationale: O verbo hebraico é qal e significa que os próprios referentes se envergonham ou ficam envergonhados. A formulação atual pode sugerir que uma ação externa os envergonhará e restringe desnecessariamente a ambiguidade retórica do antecedente.
  - severity: low
    issue: «são nada» é menos natural em português contemporâneo amplo.
    rationale: Embora compreensível e contundente, «não valem nada» é uma formulação idiomática que exprime a falta de valor e utilidade em foco no contexto, sem alegar inexistência metafísica.
