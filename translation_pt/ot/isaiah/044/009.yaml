  text: יֹֽצְרֵי פֶ֤סֶל כֻּלָּ/ם֙ תֹּ֔הוּ וַ/חֲמוּדֵי/הֶ֖ם בַּל יוֹעִ֑ילוּ וְ/עֵדֵי/הֶ֣ם הֵׄ֗מָּׄהׄ בַּל יִרְא֛וּ וּ/בַל יֵדְע֖וּ לְמַ֥עַן יֵבֹֽשׁוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/009.yaml
  text: All who fashion an idol are nothing[a], and the things they delight in do not profit. Their witnesses neither see nor know[d][c][b], so that they will be put to shame.
translation:
  language: pt
  text: Todos os que fazem uma imagem esculpida não valem nada[a], e as coisas que estimam[b] não trazem proveito. Suas testemunhas[c] não veem nem sabem, para que se envergonhem[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “são vazios”, “são inúteis” ou “não têm valor”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “suas coisas preciosas” ou “suas coisas desejáveis”.'
    reason: lexical_alternative
  - marker: c
    text: “Suas testemunhas” pode se referir aos adoradores que testemunham a favor das imagens ou, ironicamente, às próprias imagens.
    reason: alternative_reading
  - marker: d
    text: 'Ou: “de modo que se envergonhem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹצְרֵי פֶסֶל
  choice: os que fazem uma imagem esculpida
  rationale: O particípio de יצר indica formar ou fabricar, e פֶסֶל designa uma imagem, em geral esculpida, usada como ídolo. A formulação conserva o caráter concreto do hebraico sem perder naturalidade.
- source_word: כֻּלָּם
  choice: Todos os que
  rationale: Anteposto à expressão participial, reproduz de modo idiomático a abrangência de 'todos eles'.
- source_word: תֹּהוּ
  choice: são nada
  rationale: Neste contexto, תֹּהוּ exprime vacuidade, inutilidade ou falta de valor, e não o caos primordial. 'São nada' mantém a força polêmica sem afirmar necessariamente inexistência metafísica.
- source_word: וַחֲמוּדֵיהֶם
  choice: as coisas que eles tanto estimam
  rationale: O termo derivado de חמד denota coisas desejáveis, preciosas ou estimadas. A escolha preserva o componente afetivo e evita identificar de modo excessivamente explícito o referente com os próprios ídolos.
- source_word: בַּל יוֹעִילוּ
  choice: não servem para nada
  rationale: O verbo expressa proveito ou benefício. Esta expressão corrente em português comunica claramente a completa inutilidade indicada pelo hebraico.
- source_word: וְעֵדֵיהֶם הֵמָּה
  choice: Suas testemunhas
  rationale: A tradução mantém a relação possessiva e a ambiguidade quanto a as testemunhas serem os adoradores que depõem a favor das imagens ou, ironicamente, as próprias imagens. O pronome enfático הֵמָּה fica implícito na estrutura natural do português.
- source_word: בַּל יִרְאוּ וּבַל יֵדְעוּ
  choice: não veem nem sabem
  rationale: A construção reproduz os dois verbos e as negativas paralelas em português idiomático.
- source_word: לְמַעַן יֵבֹשׁוּ
  choice: de modo que serão envergonhadas
  rationale: לְמַעַן pode indicar propósito ou resultado. A formulação principal expressa resultado e conserva a relação entre cegueira, ignorância e vergonha, enquanto a nota registra a leitura de finalidade.
theological_decisions:
- issue: Referente de 'suas testemunhas'
  choice: Manter o referente sem especificação, permitindo que sejam os que testemunham a favor das imagens.
  alternative: As próprias imagens são chamadas ironicamente de testemunhas.
  rationale: Os verbos plurais 'não veem nem sabem' podem censurar tanto os idólatras quanto, ironicamente, os ídolos. A tradução não resolve uma ambiguidade retórica genuína do hebraico.
- issue: Força de תֹּהוּ
  choice: Declaração de vacuidade e completa falta de valor.
  alternative: Caos, desolação ou inexistência metafísica.
  rationale: O contexto denuncia como inúteis os fabricantes e os objetos de idolatria. 'São nada' preserva a contundência, e a nota esclarece o campo semântico.
- issue: Valor de לְמַעַן
  choice: 'Resultado: ''de modo que serão envergonhadas''.'
  alternative: 'Finalidade: ''para que sejam envergonhadas''.'
  rationale: A partícula comporta ambos os valores. O texto principal adota uma relação de resultado contextualmente natural, sem ocultar na nota a possibilidade de finalidade.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. 'Imagem esculpida' conserva a concretude de פֶסֶל; 'são nada' retém a linguagem profética contundente. O feminino em 'envergonhadas' concorda com 'testemunhas' e não elimina a ambiguidade de seu referente.
