  text: חָרַ֤שׁ בַּרְזֶל֙ מַֽעֲצָ֔ד וּ/פָעַל֙ בַּ/פֶּחָ֔ם וּ/בַ/מַּקָּב֖וֹת יִצְּרֵ֑/הוּ וַ/יִּפְעָלֵ֨/הוּ֙ בִּ/זְר֣וֹעַ כֹּח֔/וֹ גַּם רָעֵב֙ וְ/אֵ֣ין כֹּ֔חַ לֹא שָׁ֥תָה מַ֖יִם וַ/יִּיעָֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/012.yaml
  text: The ironsmith works with a cutting tool and works over the coals; with hammers he shapes it and works it with his strong arm. He also becomes hungry[a], and there is no strength; he has not drunk water, and he grows faint.
translation:
  language: pt
  text: O ferreiro trabalha com uma ferramenta de corte[a] e trabalha sobre as brasas; com os martelos, dá forma ao objeto e o trabalha com seu braço forte. Ele também fica com fome e perde as forças; não bebeu água e desfalece.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma enxó”, “um buril” ou “um cinzel”; não é certo qual instrumento específico é mencionado aqui.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָרַשׁ בַּרְזֶל
  choice: O ferreiro
  rationale: A expressão designa o artesão que trabalha o ferro. “Ferreiro” é a forma corrente e específica em português.
- source_word: מַעֲצָד
  choice: uma ferramenta de corte
  rationale: O instrumento exato é incerto; a expressão genérica preserva sua função sem identificar além da evidência disponível. As possibilidades mais específicas aparecem em nota.
- source_word: וּפָעַל
  choice: e trabalha
  rationale: Mantém o sentido geral de exercer trabalho e prepara a repetição da mesma raiz mais adiante.
- source_word: בַּפֶּחָם
  choice: sobre as brasas
  rationale: O termo se refere ao carvão ou às brasas empregados no trabalho do metal; esta formulação apresenta naturalmente a cena da forja.
- source_word: וּבַמַּקָּבוֹת
  choice: com os martelos
  rationale: Reproduz o plural explícito e identifica de modo direto os instrumentos usados para modelar o metal.
- source_word: יִצְּרֵהוּ
  choice: dá forma ao objeto
  rationale: O verbo significa formar ou modelar. “Ao objeto” explicita apenas o referente pronominal sem identificar prematuramente a peça como ídolo.
- source_word: וַיִּפְעָלֵהוּ
  choice: e o trabalha
  rationale: Conserva a repetição de פעל e destaca o esforço continuado do artesão.
- source_word: בִּזְרוֹעַ כֹּחוֹ
  choice: com seu braço forte
  rationale: Expressa em português natural o hebraico literalmente próximo de “com o braço de sua força”, preservando a ênfase no vigor físico.
- source_word: גַּם רָעֵב
  choice: Ele também fica com fome
  rationale: Apresenta a progressiva debilitação física do artesão e mantém o valor de גַּם.
- source_word: וְאֵין כֹּחַ
  choice: e perde as forças
  rationale: Comunica de modo natural a ausência de força no contexto de exaustão, embora a formulação hebraica seja literalmente “e não há força”.
- source_word: לֹא שָׁתָה מַיִם
  choice: não bebeu água
  rationale: Mantém o aspecto perfeito da forma hebraica e sua relação causal implícita com o desfalecimento.
- source_word: וַיִּיעָף
  choice: e desfalece
  rationale: Traduz a culminação da fome, da sede e do cansaço com um verbo claro e digno.
theological_decisions:
- issue: Representação da fabricação de ídolos na sátira profética
  choice: Descrever concretamente o trabalho exaustivo e a fraqueza do ferreiro, sem acrescentar avaliação interpretativa ao versículo.
  alternative: Explicitar no texto principal a inutilidade ou ironia da idolatria.
  rationale: O contexto mais amplo é satírico, mas este versículo apresenta diretamente o trabalho e o esgotamento do artesão. A força teológica deve surgir do contexto, sem acréscimos.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “trabalha” preserva deliberadamente a repetição hebraica. O marcador da nota foi colocado junto a “ferramenta de corte”, termo ao qual a nota lexical se refere.
