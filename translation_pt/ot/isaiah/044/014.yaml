base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/014.yaml
  text: He cuts down cedars for himself[a], or he takes a cypress tree or an oak and chooses it from among the trees of the forest. He plants a pine[c][b], and the rain makes it grow.
translation:
  language: pt
  text: Ele corta cedros para si; toma um cipreste[a] ou um carvalho e deixa que ele cresça vigoroso entre as árvores da floresta.[b] Planta um pinheiro[c], e a chuva o faz crescer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico תִּרְזָה designa uma espécie de árvore cuja identificação é incerta; também pode ser traduzido por “azinheira”, “terebinto” ou “olmo”.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico desta oração é difícil. Outra tradução possível é: “escolhe para si uma árvore forte entre as árvores da floresta”.'
    reason: alternative_reading
  - marker: c
    text: O termo hebraico אֹרֶ designa uma espécie de árvore cuja identificação é incerta; outras possibilidades incluem “abeto”, “freixo” e “loureiro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִכְרָת ל֣וֹ אֲרָזִ֔ים
  choice: Ele corta cedros para si
  rationale: O infinitivo com לְ prossegue a descrição da atividade do artesão; uma oração finita no presente é natural em português. לּוֹ indica benefício ou uso próprio.
- source_word: וַיִּקַּ֤ח
  choice: toma
  rationale: O verbo descreve a obtenção da madeira. O ponto e vírgula mantém a sequência sem obrigar a interpretar o waw como alternativa explícita.
- source_word: תִּרְזָה֙
  choice: um cipreste
  rationale: A identificação botânica é incerta; “cipreste” é uma opção corrente e plausível, com a incerteza preservada em nota.
- source_word: וְאַלּ֔וֹן
  choice: ou um carvalho
  rationale: אַלּוֹן corresponde bem a “carvalho”; “ou” expressa naturalmente a enumeração de espécies alternativas no contexto.
- source_word: וַיְאַמֶּץ ל֖וֹ בַּעֲצֵי יָ֑עַר
  choice: e o deixa crescer vigoroso entre as árvores da floresta
  rationale: אמץ tem o sentido básico de fortalecer ou tornar forte. A formulação comunica esse crescimento vigoroso em português natural, enquanto uma nota registra a possibilidade de o texto falar da escolha de uma árvore forte.
- source_word: נָטַ֥ע אֹ֖רֶ
  choice: Planta um pinheiro
  rationale: O presente mantém o caráter descritivo da passagem. A espécie designada por אֹרֶ é incerta; “pinheiro” é uma identificação possível e conhecida.
- source_word: וְגֶ֥שֶׁם יְגַדֵּֽל
  choice: e a chuva o faz crescer
  rationale: A expressão reproduz com naturalidade o valor causativo do verbo e destaca que o crescimento da árvore depende da chuva comum.
theological_decisions:
- issue: Descrição comprimida da obtenção e do crescimento da madeira no contexto da sátira contra a idolatria
  choice: 'Apresentar uma sequência de ações comuns: cortar ou tomar madeira, deixar a árvore tornar-se vigorosa e plantar outra que a chuva faz crescer.'
  alternative: Entender וַיְאַמֶּץ לּוֹ como “escolhe para si uma árvore forte entre as árvores da floresta”.
  rationale: 'A tradução principal conserva o sentido lexical de אמץ e a imagem do crescimento, sem apagar a dificuldade sintática. A leitura de seleção, adequada ao contexto, é mantida em nota. Assim, a tradução não amplia nem reduz a tensão satírica do texto: o material do ídolo provém de árvores comuns e dependentes da chuva.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. O presente verbal preserva o caráter descritivo da sátira. As incertezas botânicas e sintáticas são indicadas sem sobrecarregar o texto principal.
