base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/019.yaml
  text: And he does not take it to heart[a], and there is no knowledge or understanding to say, “I burned half of it in the fire; I also baked bread on its coals; I roasted meat and ate. Shall I make the rest of it into an abomination? Shall I bow down to a block of wood?”
translation:
  language: pt
  text: 'Ele não reflete sobre isso, nem tem conhecimento ou entendimento para dizer: “Queimei metade da madeira no fogo; também assei pão sobre suas brasas, assei carne e comi. Farei do que restou uma abominação? Vou me prostrar diante de um bloco de madeira[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um pedaço de madeira” ou “uma tora de madeira”. A expressão hebraica é depreciativa e ressalta que o ídolo não passa de madeira.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׁיב אֶל לִבּוֹ
  choice: reflete sobre isso
  rationale: A expressão idiomática descreve trazer algo à mente e considerá-lo interiormente. “Reflete sobre isso” comunica esse sentido em português atual sem reproduzir de modo artificial a imagem hebraica do coração.
- source_word: דַעַת וְלֹא תְבוּנָה
  choice: conhecimento ou entendimento
  rationale: Mantém distintos os dois substantivos hebraicos, que formam aqui um par de termos relacionados.
- source_word: חֶצְיוֹ
  choice: metade da madeira
  rationale: O sufixo retoma a madeira mencionada no contexto. A explicitação evita um pronome pouco claro em português e preserva o contraste entre a parte consumida e o restante.
- source_word: שָׂרַפְתִּי בְמוֹ אֵשׁ
  choice: Queimei ... no fogo
  rationale: É uma formulação natural em português para a madeira consumida como combustível.
- source_word: וְאַף אָפִיתִי עַל גֶּחָלָיו לֶחֶם
  choice: também assei pão sobre suas brasas
  rationale: “Também” conserva a força aditiva de אַף; “suas brasas” mantém a referência às brasas produzidas pela própria madeira.
- source_word: אֶצְלֶה בָשָׂר וְאֹכֵל
  choice: assei carne e comi
  rationale: צלה indica assar sobre o fogo, e os verbos em português expressam com clareza a sequência da preparação e do consumo.
- source_word: וְיִתְרוֹ
  choice: do que restou
  rationale: Expressa de maneira idiomática o restante da mesma madeira, em contraste com a metade já queimada.
- source_word: לְתוֹעֵבָה
  choice: uma abominação
  rationale: Preserva a intensidade e as conotações religiosas de תוֹעֵבָה, sem suavizá-lo para uma expressão apenas genérica.
- source_word: לְבוּל עֵץ
  choice: um bloco de madeira
  rationale: A expressão reduz depreciativamente o ídolo à matéria de que foi feito. “Bloco de madeira” conserva essa força de desprezo sem sugerir necessariamente uma árvore ainda em pé.
theological_decisions:
- issue: Preservação da ironia profética ao descrever o objeto de culto
  choice: bloco de madeira
  alternative: pedaço de madeira; tora de madeira
  rationale: O argumento do versículo contrasta o uso comum da madeira como combustível com a adoração do restante. A formulação escolhida mantém o tom de ridículo dirigido à idolatria sem acrescentar uma interpretação denominacional.
- issue: Forma das declarações finais
  choice: duas perguntas retóricas
  alternative: declarações deliberativas sem sinais de pergunta
  rationale: O contexto apresenta o raciocínio absurdo que o fabricante não chega a formular. As perguntas retóricas comunicam naturalmente em português a força deliberativa dos verbos hebraicos, embora a antiga escrita consonantal não forneça pontuação interrogativa.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível ao leitor brasileiro e compreensível internacionalmente. A repetição das ações de queimar, assar e comer foi mantida para preservar o desenvolvimento irônico do argumento.
