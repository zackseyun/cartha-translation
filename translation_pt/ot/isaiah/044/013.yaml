  text: חָרַ֣שׁ עֵצִים֮ נָ֣טָה קָו֒ יְתָאֲרֵ֣/הוּ בַ/שֶּׂ֔רֶד יַעֲשֵׂ֨/הוּ֙ בַּ/מַּקְצֻע֔וֹת וּ/בַ/מְּחוּגָ֖ה יְתָאֳרֵ֑/הוּ וַֽ/יַּעֲשֵׂ֨/הוּ֙ כְּ/תַבְנִ֣ית אִ֔ישׁ כְּ/תִפְאֶ֥רֶת אָדָ֖ם לָ/שֶׁ֥בֶת בָּֽיִת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/013.yaml
  text: The woodworker stretches out a line; he marks it out with a stylus; he shapes it with planes[a], and marks it out with a compass. He makes it like the form of a man, like the beauty of a human, to dwell in a house.
translation:
  language: pt
  text: O artesão da madeira estende a linha de medir; traça o contorno com um estilete[a], modela a peça com plainas e a delineia com o compasso. Ele a faz como a figura de um homem, como a beleza de um ser humano, para habitar numa casa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com um instrumento de marcar”; talvez “com giz vermelho”. O termo hebraico é raro e designa algum instrumento ou material usado para traçar a figura.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָרַשׁ עֵצִים
  choice: o artesão da madeira
  rationale: A expressão designa literalmente um trabalhador especializado em madeira. “Artesão da madeira” mantém explícito o material e não restringe o ofício à carpintaria de construção.
- source_word: נָטָה קָו
  choice: estende a linha de medir
  rationale: A expressão descreve o ato de dispor ou esticar uma linha para definir medidas; o complemento explicativo torna clara a função do objeto.
- source_word: יְתָאֲרֵהוּ
  choice: traça o contorno
  rationale: O verbo indica delinear ou esboçar a peça. A formulação se encaixa naturalmente na sequência de trabalho e conserva a referência pronominal ao objeto.
- source_word: בַשֶּׂרֶד
  choice: com um estilete
  rationale: O termo raro parece indicar um instrumento de riscar ou marcar. “Estilete” comunica um instrumento pontiagudo sem afirmar de que material era feita a marca; a incerteza lexical é registrada em nota.
- source_word: יַעֲשֵׂהוּ בַּמַּקְצֻעוֹת
  choice: modela a peça com plainas
  rationale: O substantivo provavelmente designa ferramentas cortantes de marcenaria, tradicionalmente entendidas como plainas. “Modela a peça” expressa o efeito do trabalho sem reduzir o verbo עשה a simples fabricação.
- source_word: וּבַמְּחוּגָה יְתָאֳרֵהוּ
  choice: e torna a traçá-la com o compasso
  rationale: מְחוּגָה é um instrumento usado para traçar círculos ou arcos. “Torna a traçá-la” reproduz a repetição do verbo de delinear sem soar pesada em português.
- source_word: כְּתַבְנִית אִישׁ
  choice: a figura de um homem
  rationale: תַּבְנִית denota forma, figura ou modelo, e אִישׁ aqui aponta para uma figura masculina. A redação mantém esse sentido concreto.
- source_word: כְּתִפְאֶרֶת אָדָם
  choice: com a beleza humana
  rationale: תִּפְאֶרֶת pode indicar beleza, esplendor ou magnificência; no contexto, descreve o aspecto estético dado ao ídolo. “Humana” traduz o valor genérico de אָדָם e preserva a distinção em relação a אִישׁ na frase anterior.
- source_word: לָשֶׁבֶת בָּיִת
  choice: para que fique numa casa
  rationale: ישב pode significar sentar-se, habitar ou permanecer. Como se trata da colocação da imagem acabada em ambiente fechado, “fique” preserva a amplitude entre permanecer e habitar sem identificar indevidamente a casa como santuário.
theological_decisions:
- issue: Relação entre אִישׁ e אָדָם
  choice: “um homem” para אִישׁ e “humana” para אָדָם
  alternative: “um ser humano” nas duas expressões
  rationale: 'O paralelismo aproxima os termos, mas não exige apagar a diferença lexical: אִישׁ apresenta concretamente a figura masculina, enquanto אָדָם caracteriza de modo mais geral sua beleza como humana, em contraste implícito com a divindade.'
- issue: Sentido de לָשֶׁבֶת בָּיִת
  choice: “para que fique numa casa”
  alternative: “para habitar numa casa”
  rationale: “Fique” conserva a ironia da imagem fabricada e instalada dentro de uma casa sem decidir se o hebraico personifica o ídolo como habitante ou apenas descreve sua permanência no local.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. A sequência de ações foi mantida com vocabulário concreto de marcenaria. Evitou-se chamar a casa de “santuário”, pois o hebraico usa apenas בַּיִת, e preservou-se a discreta ironia da imagem humana feita para permanecer dentro de uma casa.
