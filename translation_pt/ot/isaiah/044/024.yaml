base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/024.yaml
  text: 'Thus says Yahweh[a], your Redeemer, who formed you from the womb: I am Yahweh, who makes all things, who alone stretched out the heavens, who spread out the earth by myself.'
translation:
  language: pt
  text: 'Assim diz Yahweh, seu Redentor, aquele que o formou desde o ventre materno: “Eu sou Yahweh, que faço todas as coisas, que sozinho estendi os céus e que estendi a terra por mim mesmo.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conforme outra análise das difíceis palavras hebraicas finais: “quem estava comigo?”. Em qualquer das leituras, o sentido é que Yahweh criou sozinho, sem ajudante algum.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: גֹּאֲלֶךָ
  choice: seu Redentor
  rationale: Preserva o sentido de resgate e libertação, inclusive suas ressonâncias relacionais e pactuais, sem especificar em excesso a figura do parente-resgatador.
- source_word: וְיֹצֶרְךָ מִבָּטֶן
  choice: aquele que o formou desde o ventre materno
  rationale: Mantém a imagem de formar ou modelar e expressa em português natural a formação desde o ventre.
- source_word: עֹשֶׂה כֹּל
  choice: que faço todas as coisas
  rationale: Expressa a abrangência da ação criadora e concorda naturalmente com a declaração direta “Eu sou Yahweh”.
- source_word: נֹטֶה שָׁמַיִם לְבַדִּי
  choice: que sozinho estendi os céus
  rationale: Conserva a imagem de estender os céus e a ênfase na atuação exclusiva de Yahweh.
- source_word: רֹקַע הָאָרֶץ
  choice: que expandi a terra
  rationale: רקע descreve a ação de estender ou alargar uma superfície; “expandi” comunica a imagem sem impor linguagem técnica de metalurgia.
- source_word: מי אתי
  choice: por mim mesmo
  rationale: Adota no texto principal uma interpretação tradicional e contextualmente coerente, que enfatiza a criação sem ajudante, mas registra em nota a dificuldade das palavras hebraicas finais.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Agência exclusiva de Deus na criação e a difícil expressão final
  choice: por mim mesmo
  alternative: quem estava comigo?
  rationale: A formulação principal comunica a inequívoca ênfase contextual na ação criadora exclusiva de Yahweh, enquanto a nota conserva a ambiguidade textual e sintática.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A primeira pessoa em “faço”, “estendi” e “expandi” mantém a voz direta da declaração divina; “ventre materno” torna a imagem inequívoca sem alterar seu sentido.
