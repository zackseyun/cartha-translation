  text: רֹעֶ֣ה אֵ֔פֶר לֵ֥ב הוּתַ֖ל הִטָּ֑/הוּ וְ/לֹֽא יַצִּ֤יל אֶת נַפְשׁ/וֹ֙ וְ/לֹ֣א יֹאמַ֔ר הֲ/ל֥וֹא שֶׁ֖קֶר בִּ/ימִינִֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/020.yaml
  text: He feeds on ashes[a]; a deceived heart has led him astray, and he cannot deliver himself or say[b], “Is there not a lie in my right hand?”
translation:
  language: pt
  text: 'Ele se alimenta de cinzas[a]; um coração enganado o desviou, e ele não consegue salvar a si mesmo[b] nem dizer: “Não há uma mentira em minha mão direita?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pasta cinzas”. O hebraico mantém viva a metáfora de pastorear ou alimentar-se.'
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, literalmente, “salvar sua נֶפֶשׁ”, expressão que pode significar salvar a si mesmo, sua vida ou sua alma, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעֶה אֵפֶר
  choice: se alimenta de cinzas
  rationale: Mantém a metáfora concreta de pastar/alimentar-se e expressa de modo natural em português a busca de sustento naquilo que nada pode nutrir.
- source_word: לֵב הוּתַל
  choice: um coração enganado
  rationale: Preserva לֵב como “coração”, abrangendo entendimento, vontade e disposição moral, e mantém o sentido passivo de הוּתַל.
- source_word: הִטָּהוּ
  choice: o desviou
  rationale: 'Traduz de forma concisa o causativo de נטה: o coração enganado o fez afastar-se do caminho verdadeiro.'
- source_word: וְלֹא יַצִּיל אֶת נַפְשׁוֹ
  choice: e ele não consegue salvar a si mesmo
  rationale: Neste contexto, נֶפֶשׁ designa a própria pessoa ou vida. A formulação reflexiva é idiomática e evita restringir o termo à alma imaterial.
- source_word: וְלֹא יֹאמַר
  choice: nem dizer
  rationale: Liga naturalmente, em português, a segunda incapacidade à primeira sob a mesma negação contextual.
- source_word: הֲלוֹא שֶׁקֶר בִּימִינִי
  choice: Não é uma mentira o que tenho na mão direita?
  rationale: Conserva a pergunta retórica e a imagem da mão direita, enquanto explicita de modo idiomático que a falsidade é aquilo que a pessoa segura.
theological_decisions:
- issue: Sentido antropológico de נֶפֶשׁ
  choice: a si mesmo
  alternative: sua alma; sua vida
  rationale: O foco é a incapacidade do idólatra de livrar a própria pessoa de seu engano, não uma definição técnica da alma.
- issue: Agência do coração enganado
  choice: um coração enganado o desviou
  alternative: seu coração iludido o desencaminhou
  rationale: Mantém a tensão do hebraico, no qual o coração aparece simultaneamente enganado e como agente que desvia, sem resolver em excesso a relação entre autoengano e engano sofrido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem das orações e a metáfora das cinzas foram preservadas; “o que tenho” torna idiomática a frase nominal hebraica sem eliminar a imagem concreta da mão direita.
