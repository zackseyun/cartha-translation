base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/002.yaml
  text: 'Thus says Yahweh[a], your Maker and the one who formed you from the womb, who will help you: Do not fear, my servant Jacob, Jeshurun, whom I have chosen.'
translation:
  language: pt
  text: 'Assim diz Yahweh, aquele que te fez e te formou desde o ventre, que te ajudará: “Não tenha medo, meu servo Jacó, Jesurum[a], a quem escolhi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jeshurum é um nome poético de Israel, provavelmente com o sentido de “o reto” ou “o íntegro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, preservando sua identidade pactual em vez de substituí-lo por um título.
- source_word: עֹשֶׂךָ וְיֹצֶרְךָ
  choice: aquele que fez você e o formou
  rationale: Mantém a distinção entre o ato amplo de fazer e o ato intencional de formar, com formulação natural em português.
- source_word: מִבֶּטֶן
  choice: desde o ventre
  rationale: Preserva a imagem hebraica e indica a ação formadora de Deus desde a origem de Israel.
- source_word: יַעְזְרֶךָּ
  choice: aquele que o ajudará
  rationale: O imperfeito admite valor futuro no contexto de promessa e encorajamento.
- source_word: אַל תִּירָא
  choice: Não tenha medo
  rationale: Expressão corrente e clara em português para a proibição hebraica.
- source_word: עַבְדִּי
  choice: meu servo
  rationale: No contexto da designação pactual de Israel, 'servo' comunica melhor pertencimento e serviço do que 'escravo'.
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome.
- source_word: וִישֻׁרוּן
  choice: Jesurum
  rationale: Forma tradicional em português para o nome poético de Israel; seu provável sentido lexical é indicado em nota.
- source_word: בָּחַרְתִּי בוֹ
  choice: a quem escolhi
  rationale: Expressa naturalmente a oração relativa e preserva a linguagem de escolha divina.
theological_decisions:
- issue: Referência dos pronomes singulares em uma fala dirigida corporativamente a Israel
  choice: Manter formas singulares em português e os vocativos Jacó e Jesurum em aposição.
  alternative: Pluralizar a referência ou explicitar 'Israel'.
  rationale: O hebraico personifica Israel como um único interlocutor; preservar o singular mantém o estilo profético sem acrescentar uma interpretação explicativa.
- issue: Tradução de יְשֻׁרוּן
  choice: Manter Jesurum no texto e explicar seu provável sentido em nota.
  alternative: Traduzir diretamente como 'o reto' ou 'o íntegro'.
  rationale: O termo funciona como nome poético de Israel, embora sua associação lexical com retidão seja relevante.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário de alcance internacional. A repetição de 'aquele que' conserva a sequência descritiva do hebraico sem tornar a frase excessivamente literal.
