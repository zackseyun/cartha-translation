source:
  edition: WLC
  text: כֹּֽה אָמַ֨ר יְהוָ֧ה מֶֽלֶךְ יִשְׂרָאֵ֛ל וְ/גֹאֲל֖/וֹ יְהוָ֣ה צְבָא֑וֹת אֲנִ֤י רִאשׁוֹן֙ וַ/אֲנִ֣י אַחֲר֔וֹן וּ/מִ/בַּלְעָדַ֖/י אֵ֥ין אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/006.yaml
  text: 'Thus says Yahweh[a], the King of Israel and his Redeemer, Yahweh of Armies: I am the first, and I am the last[b]; apart from me there is no God.'
translation:
  language: pt
  text: 'Assim diz Yahweh, o Rei de Israel e seu Redentor, Yahweh dos Exércitos[a]: “Eu sou o primeiro e eu sou o último; além de mim não há Deus.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, «SENHOR dos Exércitos».
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «não há deus».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo pelo título tradicional «SENHOR», preservando a distinção entre nome próprio e título.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: o Rei de Israel
  rationale: Reproduz de modo direto e natural o título em construção com «Israel».
- source_word: גֹאֲלוֹ
  choice: seu Redentor
  rationale: Expressa aquele que resgata ou liberta Israel. «Resgatador da família» explicitaria em excesso uma possível conotação de parentesco que não está desenvolvida nesta frase.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Traduz צְבָאוֹת de forma transparente como «Exércitos» e mantém o nome divino; evita tanto o tradicional, porém menos claro, «Senhor dos Exércitos» quanto o interpretativo «Senhor Todo-Poderoso».
- source_word: אֲנִי רִאשׁוֹן
  choice: Eu sou o primeiro
  rationale: Conserva o pronome enfático e a solenidade da autodeclaração.
- source_word: וַאֲנִי אַחֲרוֹן
  choice: e eu sou o último
  rationale: Mantém o pronome e o verbo na segunda oração, refletindo o paralelismo equilibrado do hebraico.
- source_word: וּמִבַּלְעָדַי
  choice: além de mim
  rationale: 'Forma idiomática e digna em português para indicar exclusividade: «fora de mim» ou «à parte de mim» também seriam possíveis.'
- source_word: אֵין אֱלֹהִים
  choice: não há Deus
  rationale: No contexto da declaração de exclusividade divina, «Deus» comunica a afirmação absoluta, embora אֱלֹהִים também admita lexicalmente «deus».
theological_decisions:
- issue: Forma do título יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  alternative: SENHOR dos Exércitos; Senhor Todo-Poderoso
  rationale: A opção escolhida representa mais diretamente o nome divino e o sentido lexical de צְבָאוֹת, sem trocar o nome por um título nem interpretar a expressão como um atributo abstrato.
- issue: Força de אֵין אֱלֹהִים
  choice: não há Deus
  alternative: não há deus
  rationale: A inicial maiúscula comunica naturalmente em português a afirmação de que Yahweh é o único Deus. A nota preserva a possibilidade formal de entender אֱלֹהִים como substantivo comum, sem enfraquecer a força monoteísta do contexto.
translation_notes:
  register: Português moderno, solene e amplamente inteligível, com boa legibilidade brasileira. A repetição de «eu sou» foi mantida para preservar a ênfase e o paralelismo hebraicos; «Redentor» conserva o vocabulário bíblico corrente sem impor uma explicação denominacional.
