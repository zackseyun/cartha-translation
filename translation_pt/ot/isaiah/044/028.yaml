    rationale: 'תִּוָּסֵד é segunda pessoa masculina singular passiva: literalmente, "serás fundado". Embora a imagem de lançar fundamentos seja interpretativamente próxima, a forma direta preserva melhor a sintaxe e a personificação do texto.'
