  source_fidelity: 'A primeira declaração, a respeito de Ciro, é bem traduzida: "meu pastor" preserva a metáfora, e "realizará tudo o que desejo" comunica adequadamente כָּל־חֶפְצִי יַשְׁלִים. Porém, nas duas declarações seguintes, o hebraico emprega לְ, dirigindo a fala a Jerusalém e ao templo, e o verbo final está na segunda pessoa masculina singular. A redação deve preservar esse endereçamento.'
