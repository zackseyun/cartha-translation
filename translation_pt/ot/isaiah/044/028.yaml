  terminology: '"Ciro", "meu pastor", "Jerusalém" e "templo" são escolhas estabelecidas e apropriadas. "Serás fundado" corresponde diretamente ao passivo hebraico dirigido ao templo; evita transformar a imagem em uma descrição indireta de alicerces.'
