base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/028.yaml
  text: who says of Cyrus, ‘He is my shepherd, and he will fulfill all my purpose,’ saying of Jerusalem, ‘She will be rebuilt,’ and of the temple, ‘Its foundation will be laid.’
translation:
  language: pt
  text: 'aquele que diz a respeito de Ciro: “Ele é o meu pastor e realizará tudo o que desejo”; dizendo a Jerusalém: “Serás reconstruída”, e ao templo: “Serás fundado”.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כּוֹרֶשׁ
  choice: Ciro
  rationale: Forma portuguesa consagrada do nome persa Ciro.
- source_word: רֹעִי
  choice: meu pastor
  rationale: Preserva a metáfora régia e pastoral direta do hebraico.
- source_word: כָל־חֶפְצִי יַשְׁלִם
  choice: realizará tudo o que desejo
  rationale: Expressa naturalmente a ideia de levar plenamente a efeito todo o querer ou propósito de Deus, sem restringi-la a um plano específico.
- source_word: תִּבָּנֶה
  choice: será reconstruída
  rationale: No contexto de Jerusalém após sua destruição, o passivo hebraico indica sua edificação restauradora; 'reconstruída' torna explícita essa referência contextual.
- source_word: תִּוָּסֵד
  choice: seus alicerces serão lançados
  rationale: Reproduz de modo idiomático o passivo do verbo 'fundar' aplicado ao templo.
theological_decisions:
- issue: Ciro chamado de pastor de Deus
  choice: Ele é o meu pastor
  alternative: Ciro é meu pastor
  rationale: Mantém sem atenuação o título dado por Deus ao governante estrangeiro e conserva a forma predicativa do hebraico.
- issue: Relação sintática de וְלֵאמֹר
  choice: que diz a respeito de Jerusalém
  alternative: dizendo a respeito de Jerusalém
  rationale: A forma infinitiva pode prosseguir a caracterização daquele que fala; a oração relativa paralela oferece clareza em português sem resolver além do necessário a conexão sintática.
- issue: Sentido de חֵפֶץ
  choice: o que desejo
  alternative: meu propósito
  rationale: O termo pode designar desejo, agrado ou propósito. 'O que desejo' preserva a dimensão volitiva sem impor uma formulação teológica mais técnica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. O paralelismo profético e as metáforas do hebraico foram preservados; empregou-se pontuação contemporânea para distinguir as declarações divinas.
