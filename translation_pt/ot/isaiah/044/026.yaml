  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מֵקִים֙ דְּבַ֣ר עַבְדּ֔/וֹ וַ/עֲצַ֥ת מַלְאָכָ֖י/ו יַשְׁלִ֑ים הָ/אֹמֵ֨ר לִ/ירוּשָׁלִַ֜ם תּוּשָׁ֗ב וּ/לְ/עָרֵ֤י יְהוּדָה֙ תִּבָּנֶ֔ינָה וְ/חָרְבוֹתֶ֖י/הָ אֲקוֹמֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/026.yaml
  text: who confirms the word of his servant and fulfills the counsel of his messengers[a], who says of Jerusalem, ‘She will be inhabited,’ and of the cities of Judah, ‘They will be rebuilt,’ and ‘I will raise up her ruins.’
translation:
  language: pt
  text: 'que confirma a palavra do seu servo e cumpre o propósito dos seus mensageiros[a]; que diz a respeito de Jerusalém: “Ela será habitada”; e a respeito das cidades de Judá: “Elas serão reconstruídas”; e: “Eu reerguerei as suas ruínas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos seus anjos”. A palavra hebraica pode designar mensageiros humanos ou celestiais; aqui, provavelmente se refere a mensageiros proféticos.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵקִים
  choice: confirma
  rationale: O particípio hifil de קום, tendo “palavra” como objeto, expressa fazer com que ela permaneça ou se cumpra; “confirma” é natural em português e preserva essa ideia.
- source_word: דְּבַר עַבְדּוֹ
  choice: a palavra do seu servo
  rationale: Mantém o singular do hebraico e a ligação formal de דָּבָר com a proclamação profética, sem identificar o servo.
- source_word: וַעֲצַת
  choice: e o propósito
  rationale: עֵצָה pode significar conselho, plano ou propósito. Neste paralelismo, “propósito” comunica naturalmente aquilo que Deus leva à realização.
- source_word: מַלְאָכָיו
  choice: dos seus mensageiros
  rationale: מַלְאָךְ pode designar mensageiros humanos ou celestiais. O paralelo com “servo” e o contexto profético favorecem mensageiros proféticos, sem eliminar a alternativa lexical, registrada em nota.
- source_word: יַשְׁלִים
  choice: cumpre
  rationale: O hifil de שׁלם significa completar ou levar a cabo; “cumpre” expressa a realização efetiva do propósito.
- source_word: הָאֹמֵר
  choice: que diz
  rationale: O particípio com artigo descreve Deus e dá continuidade natural à construção relativa do contexto.
- source_word: לִירוּשָׁלִַם
  choice: a respeito de Jerusalém
  rationale: Embora לְ seja literalmente “a/para”, a expressão introduz uma declaração acerca da cidade; esta formulação é clara e idiomática em português.
- source_word: תּוּשָׁב
  choice: Ela será habitada
  rationale: A forma passiva feminina singular concorda com Jerusalém e anuncia sua repovoação, preservando a personificação gramatical da cidade.
- source_word: וּלְעָרֵי יְהוּדָה
  choice: e a respeito das cidades de Judá
  rationale: Mantém o paralelismo com a declaração acerca de Jerusalém em português natural.
- source_word: תִּבָּנֶינָה
  choice: Elas serão reconstruídas
  rationale: O nifal significa “ser construídas”; no contexto de cidades devastadas, “reconstruídas” explicita adequadamente o caráter restaurador.
- source_word: וְחָרְבוֹתֶיהָ
  choice: as suas ruínas
  rationale: חָרְבוֹת designa ruínas ou lugares devastados. “Ruínas” é conciso, corrente e preserva a referência pronominal feminina sem determinar além do texto se ela retoma Jerusalém ou o conjunto territorial em vista.
- source_word: אֲקוֹמֵם
  choice: Eu reerguerei
  rationale: O polel de קום exprime levantar ou restaurar. “Reerguerei” combina naturalmente com “ruínas” e conserva a imagem concreta de restauração.
theological_decisions:
- issue: Identidade de “seu servo” e “seus mensageiros”
  choice: Preservar as designações genéricas e as formas singular e plural do hebraico
  alternative: Identificá-los explicitamente como Isaías e outros profetas, ou entender “mensageiros” como anjos
  rationale: O versículo não identifica o servo pelo nome. O contexto favorece agentes proféticos, mas a tradução não impõe uma identificação específica nem elimina a amplitude lexical de מַלְאָךְ.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Mantiveram-se a estrutura participial do contexto, o paralelismo das declarações e a personificação feminina de Jerusalém. “Propósito” evita a possível rigidez de “conselho”, enquanto “reerguerei” conserva a imagem concreta de levantar as ruínas.
