    issue: «faz os adivinhos enlouquecerem»
    rationale: A formulação pode comunicar causar loucura mental. O verbo hebraico, neste contexto de desmascaramento, é melhor expresso como fazer agir ou parecer louco/tolo.
  - severity: low
    issue: «transforma o conhecimento deles em insensatez»
    rationale: A construção desloca o foco para uma transformação abstrata; uma formulação que mantém «o conhecimento deles» como objeto torna mais transparente a relação sintática e semântica do hebraico.
  revised_text: que frustra os sinais dos mentirosos e faz os adivinhos agirem como loucos; que faz os sábios recuarem e torna insensato o conhecimento deles;
