  text: מֵפֵר֙ אֹת֣וֹת בַּדִּ֔ים וְ/קֹסְמִ֖ים יְהוֹלֵ֑ל מֵשִׁ֧יב חֲכָמִ֛ים אָח֖וֹר וְ/דַעְתָּ֥/ם יְשַׂכֵּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/025.yaml
  text: who frustrates the signs of liars and makes diviners act like fools, who turns wise men back and makes their knowledge foolish,
translation:
  language: pt
  text: que frustra os sinais dos mentirosos e faz os adivinhos agirem como loucos; que faz os sábios recuarem e torna insensato o conhecimento deles;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵפֵר
  choice: desfaz
  rationale: Expressa a ideia de frustrar, invalidar ou tornar sem efeito, mantendo uma formulação natural em português.
- source_word: בַּדִּים
  choice: mentirosos
  rationale: No contexto, designa os que proferem falsidades; a escolha concorda com o sentido contextual e evita a leitura menos provável de 'jactanciosos'.
- source_word: קֹסְמִים
  choice: adivinhos
  rationale: Termo corrente e preciso para praticantes de adivinhação.
- source_word: יְהוֹלֵל
  choice: faz ... enlouquecerem
  rationale: Preserva o valor causativo do verbo, que pode indicar fazer agir como loucos ou levar à loucura.
- source_word: מֵשִׁיב ... אָחוֹר
  choice: faz ... recuarem
  rationale: Reproduz a imagem de fazer voltar para trás, possivelmente com a ideia de derrota ou frustração, sem explicitar além do hebraico.
- source_word: יְשַׂכֵּל
  choice: transforma ... em insensatez
  rationale: Comunica o sentido causativo de tornar tolo ou demonstrar como insensato, aplicado ao conhecimento dos sábios.
theological_decisions:
- issue: Natureza dos sinais e do conhecimento humano
  choice: Manter o paralelismo como declaração da ação divina contra alegações falsas, adivinhação e sabedoria frustrada
  alternative: Explicitar que toda sabedoria humana é falsa ou condenada
  rationale: O verso visa agentes e pretensões específicas no contexto; não justifica uma condenação universal de todo conhecimento humano.
translation_notes:
  register: Português moderno, digno e amplamente compreensível. O paralelismo hebraico foi preservado, com pontuação que mantém o versículo como continuação sintática do contexto anterior.
