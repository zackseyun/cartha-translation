base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/022.yaml
  text: I have wiped away your transgressions like a cloud[a], and your sins like a mist. Return to me[c][b], for I have redeemed you.
translation:
  language: pt
  text: Apaguei suas transgressões como uma nuvem[a] e seus pecados como uma nuvem. Volte para mim[b], pois eu o redimi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Apaguei suas transgressões como uma nuvem espessa, e seus pecados como uma nuvem”. O hebraico emprega dois termos relacionados para “nuvem” em paralelismo poético.'
    reason: lexical_alternative
  - marker: b
    text: “Volte para mim” também pode ser traduzido por “Retorne para mim”, com conotações de restauração da aliança e arrependimento.
    reason: lexical_alternative
  - marker: c
    text: 'No uso profético do perfeito hebraico, também é possível entender: “Apagarei... eu o redimirei”.'
    reason: alternative_reading
lexical_decisions:
- source_word: מָחִיתִי
  choice: Apaguei
  rationale: O verbo מחה expressa apagar, eliminar ou remover por completo. “Apaguei” é natural em português e mantém a imagem do desaparecimento das nuvens.
- source_word: כָעָב
  choice: como uma nuvem
  rationale: A preposição כ marca comparação, e עָב designa uma nuvem, muitas vezes espessa.
- source_word: פְּשָׁעֶיךָ
  choice: suas transgressões
  rationale: פשע denota transgressão ou rebelião. “Transgressões” preserva a força moral e relacional sem restringir o sentido a uma revolta explícita.
- source_word: וְכֶעָנָן
  choice: e ... como a neblina
  rationale: עָנָן normalmente significa “nuvem”, mas “neblina” diferencia os termos paralelos e comunica a imagem de vapor que se desfaz, sem ocultar em nota a alternativa lexical.
- source_word: חַטֹּאותֶיךָ
  choice: seus pecados
  rationale: “Pecados” é a equivalência comum e adequada de חטאות, em paralelismo com “transgressões”.
- source_word: שׁוּבָה אֵלַי
  choice: Volte para mim
  rationale: O imperativo de שוב significa voltar ou retornar e pode carregar conotações relacionais, pactuais e de arrependimento. “Volte para mim” é direto e natural.
- source_word: כִּי
  choice: pois
  rationale: 'כִּי apresenta a razão do chamado: o povo deve voltar porque Deus agiu em sua redenção.'
- source_word: גְאַלְתִּיךָ
  choice: eu o redimi
  rationale: גאל é um termo central de resgate e redenção. “Redimi” preserva seu peso teológico e sua ampla ressonância bíblica.
theological_decisions:
- issue: Aspecto e sequência dos verbos no perfeito
  choice: 'Passado com resultado vigente: “Apaguei ... eu o redimi”'
  alternative: 'Futuro profético: “Apagarei ... eu o redimirei”'
  rationale: Os perfeitos hebraicos podem apresentar atos realizados ou profeticamente certos. No contexto, o chamado para voltar é fundamentado na ação redentora declarada por Deus. O passado português exprime naturalmente a ação consumada; a possível leitura futura é preservada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. O pronome objeto “o” retoma o destinatário masculino singular do hebraico, Israel. A ordem dos marcadores foi regularizada para acompanhar sua ocorrência no texto.
