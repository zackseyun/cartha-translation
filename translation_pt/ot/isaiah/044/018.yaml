base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/018.yaml
  text: They do not know[a], nor do they understand, because he has shut their eyes from seeing[c][b], and their hearts from understanding.
translation:
  language: pt
  text: Eles não sabem nem entendem, porque ele cobriu os olhos deles, de modo que não veem,[a] e o coração deles, de modo que não compreendem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico retrata concretamente o ato de passar uma camada ou rebocar algo, de modo que a visão fica obstruída. Também pode ser traduzido de forma mais interpretativa como «cegou». O agente não é nomeado explicitamente no hebraico.
    reason: lexical_alternative_and_ambiguity
  - marker: b
    text: No hebraico, o «coração» é também a sede do pensamento, da compreensão e da vontade, não apenas das emoções.
    reason: cultural_note
lexical_decisions:
- source_word: יָדְעוּ
  choice: não sabem
  rationale: O perfeito qal negado expressa aqui uma condição presente e geral; «não sabem» é claro e natural.
- source_word: יָבִינוּ
  choice: nem entendem
  rationale: בין indica entender ou discernir; «entendem» preserva a relação paralela com «sabem».
- source_word: כִּי
  choice: porque
  rationale: Introduz a razão da falta de conhecimento e entendimento.
- source_word: טַח
  choice: cobriu
  rationale: O verbo traz a imagem concreta de passar uma camada ou rebocar. «Cobriu» conserva a metáfora de obstrução de modo natural em português, sem reduzi-la simplesmente a «cegou».
- source_word: מֵרְאוֹת עֵינֵיהֶם
  choice: os olhos deles, impedindo-os de ver
  rationale: A preposição מִן com o infinitivo comunica impedimento. A formulação portuguesa explicita esse valor sem perder a referência aos olhos.
- source_word: מֵהַשְׂכִּיל לִבֹּתָם
  choice: o coração deles, impedindo-os de compreender
  rationale: השׂכיל tem sentido cognitivo de compreender ou agir com discernimento. Mantém-se «coração» como sede hebraica do pensamento e da percepção.
- source_word: לִבֹּתָם
  choice: o coração deles
  rationale: O hebraico usa o plural ligado ao sufixo coletivo, mas em português a construção distributiva no singular é idiomática e preserva o sentido de que cada um tem o coração afetado.
theological_decisions:
- issue: Sujeito implícito de טַח
  choice: ele cobriu
  alternative: os olhos deles foram cobertos
  rationale: O verbo hebraico está na terceira pessoa masculina singular, mas o agente não é nomeado. «Ele» preserva essa forma gramatical sem identificar explicitamente o agente como Deus, o artesão ou outro referente.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A repetição «impedindo-os» torna explícito o valor preventivo da construção hebraica. Os marcadores aparecem no texto principal, e a ambiguidade quanto ao agente foi preservada em nota.
