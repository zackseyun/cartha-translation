source:
  edition: WLC
  text: חֶצְי/וֹ֙ שָׂרַ֣ף בְּמוֹ אֵ֔שׁ עַל חֶצְי/וֹ֙ בָּשָׂ֣ר יֹאכֵ֔ל יִצְלֶ֥ה צָלִ֖י וְ/יִשְׂבָּ֑ע אַף יָחֹם֙ וְ/יֹאמַ֣ר הֶאָ֔ח חַמּוֹתִ֖י רָאִ֥יתִי אֽוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/016.yaml
  text: 'Half of it he burns in the fire[a]; over the other half he eats meat: he roasts a roast and is satisfied. He also warms himself and says, “Aha! I am warm[c][b]; I have seen the fire.”'
translation:
  language: pt
  text: 'Metade dela ele queima no fogo; com a outra metade, come carne: assa um assado[a] e fica satisfeito. Também se aquece e diz: “Ah! Estou aquecido; vejo o fogo[b]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “assa carne”. O hebraico emprega literalmente uma expressão cognata: “assa um assado”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “vejo a chama”. O termo hebraico pode designar fogo, chama ou luz ardente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶצְיוֹ
  choice: metade dela
  rationale: O sufixo masculino singular retoma a madeira mencionada no contexto; em português, o pronome concorda naturalmente com “madeira”, sem acrescentá-la ao versículo.
- source_word: שָׂרַף בְּמוֹ אֵשׁ
  choice: ele queima no fogo
  rationale: O perfeito integra uma descrição vívida das ações habituais do artesão; o presente harmoniza-se com os imperfeitos seguintes. “No fogo” expressa naturalmente o meio da queima.
- source_word: עַל חֶצְיוֹ
  choice: sobre a outra metade
  rationale: “Sobre” conserva o valor espacial de עַל, e “outra” explicita o contraste entre as duas metades já implícito no hebraico.
- source_word: בָּשָׂר יֹאכֵל
  choice: come carne
  rationale: בָּשָׂר designa aqui carne animal usada como alimento; “carne” é o equivalente corrente e direto.
- source_word: יִצְלֶה צָלִי
  choice: assa um assado
  rationale: A formulação conserva a expressão cognata hebraica entre o verbo e o substantivo, mesmo com uma leve repetição intencional em português.
- source_word: וְיִשְׂבָּע
  choice: e fica satisfeito
  rationale: O verbo indica que ele come até atingir a saciedade; a expressão é clara e natural sem restringir o sentido ao mero estado físico de estar cheio.
- source_word: אַף יָחֹם
  choice: Também se aquece
  rationale: אַף acrescenta outro uso da madeira, enquanto יָחֹם descreve o homem obtendo calor para si.
- source_word: הֶאָח חַמּוֹתִי
  choice: Ah! Estou aquecido
  rationale: A interjeição comunica satisfação, e o perfeito apresenta o estado alcançado depois de se aquecer.
- source_word: רָאִיתִי אוּר
  choice: vejo o fogo
  rationale: No discurso direto, o perfeito hebraico pode expressar a experiência presente e vívida do homem diante do fogo. אוּר admite “fogo”, “chama” ou luz ardente; “fogo” mantém a ligação imediata com a queima descrita.
theological_decisions:
- issue: Preservação da sátira contra a idolatria sem explicitação interpretativa
  choice: Descrever diretamente os usos da madeira para cozinhar e aquecer, sem mencionar o ídolo neste versículo
  alternative: Acrescentar uma referência explícita à fabricação ou adoração do ídolo
  rationale: O contexto torna a ironia evidente, mas o versículo em si se limita às ações e à fala satisfeita do artesão. Não se acrescenta uma conclusão teológica ausente desta frase.
- issue: Relação entre comer a carne e assar o assado
  choice: Usar dois-pontos para apresentar o assar como explicação concreta do consumo da carne
  alternative: Tratar as duas expressões como ações independentes ou inverter explicitamente sua ordem
  rationale: A pontuação esclarece a relação lógica sem reordenar os membros hebraicos nem eliminar sua repetição enfática.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com presente descritivo para manter a vivacidade da sátira. A repetição incomum em “assa um assado” é deliberada e reproduz a expressão cognata do hebraico; a nota oferece a alternativa mais idiomática.
