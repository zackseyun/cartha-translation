  text: הֵ֤ן כָּל חֲבֵרָי/ו֙ יֵבֹ֔שׁוּ וְ/חָרָשִׁ֥ים הֵ֖מָּה מֵֽ/אָדָ֑ם יִֽתְקַבְּצ֤וּ כֻלָּ/ם֙ יַֽעֲמֹ֔דוּ יִפְחֲד֖וּ יֵבֹ֥שׁוּ יָֽחַד־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/011.yaml
  text: Look[a], all his companions will be put to shame, and the craftsmen are only men. Let them all gather and stand up; they will be terrified[b], they will be put to shame together.
translation:
  language: pt
  text: 'Eis: todos os seus companheiros serão envergonhados, e os artesãos são apenas seres humanos.[a] Que todos eles se reúnam e tomem posição; ficarão apavorados e serão envergonhados juntos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “são apenas humanos”. Hebraico: “são de homem/humanidade”, expressão que ressalta que os artesãos são meramente humanos, não divinos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Vejam
  rationale: Interjeição enfática que chama a atenção; o plural é natural em português moderno e preserva a força dêitica.
- source_word: חֲבֵרָיו
  choice: seus companheiros
  rationale: Expressa os associados do ídolo ou de quem o fabrica sem restringir o sentido a uma corporação profissional.
- source_word: יֵבֹשׁוּ
  choice: serão envergonhados
  rationale: Mantém o tom profético de humilhação pública e reproduz a repetição do verbo no fim do versículo.
- source_word: וְחָרָשִׁים
  choice: e os artesãos
  rationale: חָרָשִׁים designa de modo amplo trabalhadores habilidosos; 'artesãos' convém ao contexto da fabricação de ídolos sem limitá-los a ferreiros.
- source_word: הֵמָּה מֵאָדָם
  choice: são apenas seres humanos
  rationale: Comunica que os fabricantes têm origem e condição humanas, em contraste implícito com qualquer pretensão divina.
- source_word: יִתְקַבְּצוּ כֻלָּם
  choice: Que todos eles se reúnam
  rationale: Entende o imperfeito com força volitiva ou desafiadora e usa uma formulação idiomática em português.
- source_word: יַעֲמֹדוּ
  choice: se apresentem
  rationale: No cenário de desafio, indica comparecer e tomar posição, sentido mais explícito em português do que o simples 'ficar de pé'.
- source_word: יִפְחֲדוּ
  choice: ficarão apavorados
  rationale: Preserva a intensidade do medo como resultado do confronto ou juízo.
- source_word: יָחַד
  choice: todos juntos
  rationale: Resume o destino coletivo dos associados e artesãos.
theological_decisions:
- issue: Sentido representativo de אָדָם
  choice: seres humanos
  alternative: homens
  rationale: O contraste é entre a condição meramente humana dos artesãos e a divindade atribuída aos ídolos. 'Seres humanos' preserva esse contraste de maneira clara, abrangente e natural, sem sugerir que o sexo dos fabricantes seja o ponto do texto.
- issue: Força modal de יִתְקַבְּצוּ e יַעֲמֹדוּ
  choice: 'exortação desafiadora: ''Que... se reúnam e se apresentem'''
  alternative: 'futuro declarativo: ''Eles se reunirão e ficarão de pé'''
  rationale: O contexto favorece uma convocação irônica para que todos compareçam, seguida pelo anúncio do medo e da vergonha; contudo, a forma hebraica também pode ser lida declarativamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a repetição do hebraico são preservadas quando naturais; 'se apresentem' explicita o valor contextual de tomar posição diante do desafio.
