  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֤י אֶצָּק מַ֨יִם֙ עַל צָמֵ֔א וְ/נֹזְלִ֖ים עַל יַבָּשָׁ֑ה אֶצֹּ֤ק רוּחִ/י֙ עַל זַרְעֶ֔/ךָ וּ/בִרְכָתִ֖/י עַל צֶאֱצָאֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/003.yaml
  text: For I will pour water on the thirsty land[a], and streams on the dry ground; I will pour out my Spirit on your offspring[c][b], and my blessing on your descendants.
translation:
  language: pt
  text: Pois derramarei água sobre a terra sedenta[a] e águas correntes[b] sobre o solo seco; derramarei o meu Espírito[c] sobre a sua descendência e a minha bênção sobre os seus descendentes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sobre o sedento”. O hebraico traz um adjetivo que pode funcionar como substantivo, mas o paralelo com “solo seco” favorece a referência à terra sedenta.
    reason: alternative_reading
  - marker: b
    text: Literalmente, “coisas que fluem”; também pode ser traduzido por “riachos”.
    reason: lexical_alternative
  - marker: c
    text: A palavra hebraica também pode significar “meu sopro” ou “meu vento”; neste contexto de bênção divina sobre as gerações futuras, “meu Espírito” é o sentido mais provável.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Mantém a força explicativa ou causal que liga esta promessa ao contexto anterior.
- source_word: אֶצָּק / אֶצֹּק (יצק)
  choice: derramarei
  rationale: Expressa naturalmente tanto o ato de verter água como a extensão metafórica aplicada ao Espírito.
- source_word: צָמֵא
  choice: a terra sedenta
  rationale: Embora seja formalmente o adjetivo 'sedento', o paralelismo com 'solo seco' favorece a referência à terra; o substantivo é explicitado para clareza em português.
- source_word: וְנֹזְלִים
  choice: e águas correntes
  rationale: O particípio significa literalmente aquilo que flui; 'águas correntes' preserva essa imagem sem sugerir necessariamente cursos de água definidos.
- source_word: יַבָּשָׁה
  choice: o solo seco
  rationale: Reproduz a imagem física de terra ressequida e forma um paralelismo natural com 'terra sedenta'.
- source_word: רוּחִי
  choice: o meu Espírito
  rationale: Neste contexto de dádiva divina e bênção às gerações futuras, 'Espírito' é o sentido contextual mais adequado, sem apagar as possibilidades lexicais de 'sopro' e 'vento'.
- source_word: זַרְעֶךָ
  choice: a sua descendência
  rationale: Transmite o valor coletivo de 'semente' em português moderno e evita uma leitura estritamente biológica ou agrícola.
- source_word: וּבִרְכָתִי
  choice: e a minha bênção
  rationale: Equivalente direto que conserva o sentido amplo de benefício e favor concedidos por Deus.
- source_word: צֶאֱצָאֶיךָ
  choice: os seus descendentes
  rationale: Designa aqueles que procedem da pessoa interpelada e mantém o paralelismo sinonímico com 'descendência'.
theological_decisions:
- issue: Sentido de רוּחִי na promessa
  choice: o meu Espírito
  alternative: o meu sopro / o meu vento
  rationale: A correspondência com 'minha bênção' e a promessa dirigida à descendência favorecem a presença e ação vivificadora de Deus; uma nota preserva a amplitude lexical do hebraico.
- issue: Referente de צָמֵא
  choice: a terra sedenta
  alternative: o sedento / aquele que tem sede
  rationale: O paralelo imediato, 'sobre o solo seco', favorece uma imagem da terra, embora a forma hebraica também possa ser entendida substantivamente como referência a alguém sedento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A segunda pessoa singular do hebraico foi vertida pelas formas de tratamento “sua/seus”, naturais no português brasileiro e suficientemente amplas no português internacional. O paralelismo poético e a repetição de “derramarei” foram preservados.
