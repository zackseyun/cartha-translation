  source_fidelity: A tradução capta a oração relativa, a ordem dirigida à profundidade e a declaração futura de secar os rios. Contudo, o hebraico emprega singular feminino tanto em לַצּוּלָה quanto no imperativo חֳרָבִי e no sufixo de ‘teus rios’; o plural no texto principal e o possessivo de terceira pessoa não preservam essas formas.
  naturalness: ‘À profundeza’ e ‘Fica seca’ são compreensíveis em registro bíblico moderno e mantêm uma imagem coerente. ‘Teus rios’ deixa clara a interpelação direta, de modo mais natural e preciso do que ‘seus rios’ neste contexto.
  terminology: ‘Profundeza’ traduz adequadamente צּוּלָה, a profundidade aquática. A alternativa plural cabe melhor na nota. ‘Secarei’ transmite de modo conciso o hifil de primeira pessoa.
