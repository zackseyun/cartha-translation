  text: הָ/אֹמֵ֥ר לַ/צּוּלָ֖ה חֳרָ֑בִי וְ/נַהֲרֹתַ֖יִ/ךְ אוֹבִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/027.yaml
  text: who says to the deep[a], ‘Be dry, and I will dry up your rivers,’
translation:
  language: pt
  text: 'que diz à profundeza[a]: “Fica seca, e secarei os teus rios”;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “às profundezas”. O termo hebraico se refere à profundeza aquática.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹמֵר
  choice: que diz
  rationale: O particípio com artigo tem função substantivada e dá continuidade à descrição do contexto anterior. “Que diz” preserva essa ligação sem acrescentar um sujeito explícito.
- source_word: לַצּוּלָה
  choice: às profundezas
  rationale: O substantivo designa a profundeza ou as profundezas das águas. O plural natural em português conserva a imagem aquática e a ambiguidade lexical.
- source_word: חֳרָבִי
  choice: Sequem-se!
  rationale: O imperativo feminino singular dirige-se às profundezas, tratadas coletivamente. A forma pronominal é idiomática em português e expressa a ordem para que fiquem secas.
- source_word: וְנַהֲרֹתַיִךְ
  choice: e os seus rios
  rationale: נְהָרוֹת significa “rios”; o sufixo de segunda pessoa feminina retoma as profundezas. “Seus” mantém essa relação de modo natural.
- source_word: אוֹבִישׁ
  choice: eu secarei
  rationale: O hifil imperfeito na primeira pessoa singular tem sentido causativo e prospectivo no contexto. “Secarei” comunica de forma concisa a ação declarada.
theological_decisions:
- issue: Identidade de quem fala e relação com o contexto anterior
  choice: Manter a oração relativa “que diz” sem inserir “o SENHOR” neste versículo.
  alternative: Explicitar o sujeito como “o SENHOR, que diz”.
  rationale: O hebraico depende sintaticamente da descrição de Deus nos versículos anteriores. Não explicitar o sujeito preserva o fluxo literário e evita acrescentar palavras ausentes deste segmento.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O plural “profundezas” soa natural e permite a concordância idiomática de “Sequem-se”, enquanto a nota preserva o singular possível do hebraico.
