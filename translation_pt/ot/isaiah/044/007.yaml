base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/007.yaml
  text: And who is like me? Let him call and declare it[a], and set it in order for me, since I appointed an ancient people. Let them declare to them the things to come[b], and the things that will come.
translation:
  language: pt
  text: E quem é como eu? Que ele proclame, declare isso e o exponha em ordem diante de mim, desde o tempo em que estabeleci um povo antigo.[a] Que eles lhes anunciem as coisas que estão por vir[b] e as coisas que virão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desde o tempo em que estabeleci o povo de antigamente”. A expressão hebraica pode ser entendida temporalmente, e “povo antigo” também pode ser traduzido por “povo de antigamente”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os sinais e as coisas que virão”. A palavra hebraica também pode ser entendida como “sinais” ou “indícios”, embora o contexto aqui favoreça acontecimentos futuros.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִי כָמוֹנִי
  choice: E quem é como eu?
  rationale: Preserva a continuidade marcada pela conjunção e a força do desafio retórico.
- source_word: יִקְרָא וְיַגִּידֶהָ
  choice: Que ele proclame, declare isso
  rationale: O imperfeito tem força de desafio ou convite; “proclame” e “declare” comunicam os sentidos de קרא e do hifil de נגד, enquanto “isso” representa com discrição o sufixo feminino hebraico.
- source_word: וְיַעְרְכֶהָ לִי
  choice: e o exponha em ordem diante de mim
  rationale: ערך indica dispor ou apresentar ordenadamente. “Diante de mim” expressa de modo natural o valor relacional de לִי neste desafio.
- source_word: מִשּׂוּמִי עַם עוֹלָם
  choice: desde que estabeleci um povo antigo
  rationale: מן com o infinitivo é entendido temporalmente, e עוֹלָם indica antiguidade no contexto. “Estabeleci” é uma tradução ampla e natural de שׂום sem acrescentar uma ideia doutrinária de perpetuidade.
- source_word: וְאֹתִיּוֹת
  choice: as coisas que estão por vir
  rationale: O paralelismo com a oração seguinte favorece a referência a acontecimentos futuros; a possibilidade lexical de “sinais” é preservada em nota.
- source_word: וַאֲשֶׁר תָּבֹאנָה
  choice: e as coisas que virão
  rationale: Mantém a referência explícita ao futuro e a repetição enfática do hebraico.
- source_word: יַגִּידוּ לָמוֹ
  choice: Que eles lhes anunciem
  rationale: Conserva as formas de terceira pessoa do plural e a construção pronominal comprimida do hebraico, sem identificar além do texto quem são os referentes.
theological_decisions:
- issue: Sentido de עַם עוֹלָם
  choice: um povo antigo
  alternative: um povo eterno; o povo de antigamente
  rationale: No desafio sobre o governo da história e o anúncio do futuro, עוֹלָם provavelmente aponta para a antiguidade. A tradução evita transformar a expressão em uma afirmação não exigida sobre a perpetuidade do povo.
- issue: Sentido de וְאֹתִיּוֹת
  choice: as coisas que estão por vir
  alternative: os sinais; os indícios
  rationale: O paralelismo imediato com “as coisas que virão” favorece acontecimentos futuros em geral, mas a leitura “sinais” permanece possível e é registrada em nota.
- issue: Referentes plurais em יַגִּידוּ לָמוֹ
  choice: Que eles lhes anunciem
  alternative: Que anunciem essas coisas; que as anunciem ao povo
  rationale: A formulação mantém a ambiguidade dos pronomes hebraicos em vez de fixar os referentes por interpretação.
translation_notes:
  register: Português atual, digno e de leitura ampla, com construção retórica direta. A repetição final foi mantida para refletir o paralelismo e a ênfase do hebraico, ainda que soe deliberadamente reiterativa em português.
