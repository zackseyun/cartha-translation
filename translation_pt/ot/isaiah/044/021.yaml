  text: זְכָר אֵ֣לֶּה יַעֲקֹ֔ב וְ/יִשְׂרָאֵ֖ל כִּ֣י עַבְדִּ/י אָ֑תָּה יְצַרְתִּ֤י/ךָ עֶֽבֶד לִ/י֙ אַ֔תָּה יִשְׂרָאֵ֖ל לֹ֥א תִנָּשֵֽׁ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/021.yaml
  text: Remember these things[a], Jacob, and Israel, for you are my servant; I formed you; you are a servant to me. Israel, you will not be forgotten by me.
translation:
  language: pt
  text: Lembre-se destas coisas, Jacó e Israel, pois você é meu servo. Eu o formei; você é meu servo. Israel, eu não me esquecerei de você[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Israel, não se esqueça de mim”. A forma hebraica pode ser entendida assim, e alguns intérpretes a tomam como exortação, em vez de promessa.'
    reason: alternative_reading
lexical_decisions:
- source_word: זְכָר
  choice: Lembre-se
  rationale: Imperativo qal masculino singular de זכר; a forma pronominal é a expressão mais natural em português para uma ordem direta.
- source_word: אֵלֶּה
  choice: destas coisas
  rationale: O demonstrativo plural retoma o conteúdo precedente; explicitar “coisas” produz português idiomático sem acrescentar conteúdo.
- source_word: יַעֲקֹב וְיִשְׂרָאֵל
  choice: Jacó, e você, Israel
  rationale: Os dois nomes estão em apelo direto e designam o mesmo povo. “Você” antes de Israel deixa clara a continuação do vocativo e evita que os nomes pareçam formar um sujeito composto.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da ordem e mantém a relação explicativa em registro digno e corrente.
- source_word: עַבְדִּי
  choice: meu servo
  rationale: No contexto, עבד expressa sobretudo a relação de serviço e pertencimento de Israel a Deus; “servo” preserva essa dimensão sem impor a conotação social mais estreita de “escravo”.
- source_word: יְצַרְתִּיךָ
  choice: Eu o formei
  rationale: יצר denota formar ou modelar e conserva a imagem do Criador/artífice. O pronome “o” retoma Israel em português formal acessível.
- source_word: עֶבֶד לִי אַתָּה
  choice: você é servo para mim
  rationale: Mantém a oração nominal independente e a ordem enfática do sentido hebraico, sem comprimi-la numa finalidade ligada ao verbo anterior.
- source_word: לֹא תִנָּשֵׁנִי
  choice: eu não me esquecerei de você
  rationale: 'Expressa em voz ativa idiomática a leitura massorética mais provável do nifal com sufixo de primeira pessoa: Israel não será esquecido por Deus. A leitura alternativa possível é preservada em nota.'
theological_decisions:
- issue: Relação entre sujeito e objeto em לֹא תִנָּשֵׁנִי
  choice: 'Promessa divina: “eu não me esquecerei de você”'
  alternative: 'Exortação a Israel: “você não deve se esquecer de mim”'
  rationale: A forma pode ser entendida como passiva, “você não será esquecido por mim”, leitura que se harmoniza com a ênfase imediata na formação e pertença de Israel. A voz ativa escolhida é mais natural em português e mantém a mesma relação semântica. Como a vocalização/construção admite discussão e há quem entenda uma exortação a Israel, a alternativa não é eliminada, mas registrada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A repetição de “servo” e a separação entre “Eu o formei” e “você é servo para mim” preservam a estrutura enfática do hebraico. O marcador [a] foi colocado após a primeira ordem, seguindo a camada de consulta, embora a nota esclareça a ambiguidade da oração final.
