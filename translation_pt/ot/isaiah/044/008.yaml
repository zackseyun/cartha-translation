  text: אַֽל תִּפְחֲדוּ֙ וְ/אַל תִּרְה֔וּ הֲ/לֹ֥א מֵ/אָ֛ז הִשְׁמַעְתִּ֥י/ךָ וְ/הִגַּ֖דְתִּי וְ/אַתֶּ֣ם עֵדָ֑/י הֲ/יֵ֤שׁ אֱל֨וֹהַּ֙ מִ/בַּלְעָדַ֔/י וְ/אֵ֥ין צ֖וּר בַּל יָדָֽעְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/008.yaml
  text: Do not fear[a], and do not tremble. Have I not long ago made you hear and declared it? And you are my witnesses. Is there a God besides me? There is no Rock[c][b]; I know of none.
translation:
  language: pt
  text: Não tenham medo e não tremam.[a] Não fiz você ouvir isso, desde tempos antigos, e não o declarei?[b] Vocês são minhas testemunhas. Existe algum Deus além de mim? Não há Rocha;[c] não conheço nenhuma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Não tenham medo e não fiquem aterrorizados». O segundo verbo é raro e pode intensificar a primeira proibição.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico passa das formas plurais («tenham», «tremam») para um sufixo singular em «você»; em seguida, volta ao plural em «vocês são minhas testemunhas». A expressão temporal também pode ser traduzida por «há muito tempo».
    reason: textual_ambiguity
  - marker: c
    text: «Rocha» é uma metáfora e título para Deus, ressaltando sua firmeza e confiabilidade; também se pode escrever «rocha».
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְחֲדוּ
  choice: tenham medo
  rationale: O verbo פחד expressa medo ou pavor. A formulação com «ter medo» é direta, natural e adequada à proibição no plural.
- source_word: תִּרְהוּ
  choice: tremam
  rationale: O verbo é raro e, neste paralelismo, provavelmente intensifica a primeira proibição. «Tremam» preserva a imagem e a força poética sem definir em excesso seu sentido.
- source_word: מֵאָז
  choice: há muito tempo
  rationale: A expressão temporal remete a uma revelação anterior. «Há muito tempo» comunica isso com clareza em português moderno, embora «desde tempos antigos» também seja possível.
- source_word: הִשְׁמַעְתִּיךָ
  choice: fiz você ouvir isso
  rationale: A forma causativa de שמע e o sufixo masculino singular são preservados. «Isso» torna explícito em português o conteúdo implícito no hebraico.
- source_word: וְהִגַּדְתִּי
  choice: e não o declarei
  rationale: נגד significa declarar ou dar a conhecer. A negação da pergunta retórica abrange os dois verbos; «declarei» conserva o tom público e solene.
- source_word: עֵדָי
  choice: minhas testemunhas
  rationale: O substantivo é plural e retoma a comunidade interpelada, mantendo o motivo jurídico-testemunhal de Isaías.
- source_word: אֱלוֹהַּ
  choice: Deus
  rationale: Na pergunta retórica sobre a existência de qualquer divindade além de YHWH, «Deus» expressa naturalmente o referente e a afirmação de exclusividade.
- source_word: מִבַּלְעָדַי
  choice: além de mim
  rationale: A expressão indica exclusão. «Além de mim» é idiomático e preserva a reivindicação absoluta do texto.
- source_word: צוּר
  choice: Rocha
  rationale: A metáfora funciona aqui como título divino, evocando firmeza, segurança e confiabilidade. A inicial maiúscula sinaliza esse uso titular.
- source_word: בַּל יָדָעְתִּי
  choice: não conheço nenhuma
  rationale: A negação enfática é vertida de modo natural, com «nenhuma» retomando «Rocha» no feminino e preservando a negação total.
theological_decisions:
- issue: Exclusividade divina na pergunta retórica
  choice: «Existe algum Deus além de mim? Não há outra Rocha; não conheço nenhuma.»
  alternative: Empregar «deus» em minúscula para destacar a categoria genérica de divindade.
  rationale: O contexto polemiza contra os ídolos e declara a singularidade de YHWH. A tradução mantém a afirmação absoluta sem acrescentar uma formulação doutrinária externa.
- issue: צוּר como título divino
  choice: Traduzir por «Rocha», com inicial maiúscula.
  alternative: Traduzir por «rocha», com inicial minúscula.
  rationale: No contexto, a palavra é uma metáfora aplicada a Deus e funciona como título. A maiúscula ajuda o leitor a reconhecer esse uso sem eliminar a imagem hebraica.
- issue: Alternância entre destinatário plural e singular
  choice: Preservar «vocês» nas formas plurais e «você» no sufixo singular de הִשְׁמַעְתִּיךָ.
  alternative: Uniformizar toda a interpelação no plural para maior fluidez.
  rationale: A alternância está presente no texto massorético e pode refletir Israel como coletividade e como entidade singular. Preservá-la evita resolver silenciosamente essa tensão textual.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Conservou-se o paralelismo poético e a pergunta retórica. A alternância hebraica entre plural e singular foi mantida deliberadamente e explicada em nota; «outra» foi acrescentado antes de «Rocha» para produzir uma negação idiomática em português sem alterar a exclusividade expressa pelo original.
