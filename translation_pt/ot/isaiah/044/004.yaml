base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/004.yaml
  text: And they will spring up among the grass like willows by streams of water[a].
translation:
  language: pt
  text: E eles brotarão entre a relva, como salgueiros junto a cursos de água[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como álamos junto a correntes de água”. O hebraico עֲרָבִים é geralmente traduzido por “salgueiros”, embora alguns o entendam de modo mais amplo como árvores ribeirinhas semelhantes a álamos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצָמְחוּ
  choice: E eles brotarão
  rationale: O qal de צמח descreve o ato de brotar ou crescer, sobretudo na linguagem vegetal. “Brotarão” preserva a vivacidade da imagem e o valor futuro.
- source_word: בְּבֵין
  choice: entre
  rationale: Embora a expressão tenha literalmente a ideia de “no espaço entre”, “entre” é natural em português e mantém sua dimensão espacial.
- source_word: חָצִיר
  choice: a relva
  rationale: חָצִיר designa coletivamente capim, erva ou vegetação rasteira. “Relva” oferece uma imagem clara e digna em português, sem acrescentar uma qualidade ausente no hebraico.
- source_word: כַּעֲרָבִים
  choice: como salgueiros
  rationale: עֲרָבִים é tradicionalmente identificado como “salgueiros”, sobretudo em ambientes ligados à água. Como a identificação botânica não é totalmente segura, a alternativa “álamos” é indicada em nota.
- source_word: עַל
  choice: junto a
  rationale: No quadro locativo de árvores próximas da água, עַל é expresso naturalmente por “junto a”.
- source_word: יִבְלֵי מָיִם
  choice: cursos de água
  rationale: A expressão construta indica canais ou correntes por onde a água flui. “Cursos de água” mantém o plural e evita restringir a imagem a um tipo específico, como riachos.
