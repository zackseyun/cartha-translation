  text: מִֽי יָצַ֥ר אֵ֖ל וּ/פֶ֣סֶל נָסָ֑ךְ לְ/בִלְתִּ֖י הוֹעִֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/010.yaml
  text: Who fashions a god or casts an idol that is profitable for nothing?[a]
translation:
  language: pt
  text: Quem forma um deus ou funde um ídolo que não serve para nada?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quem forma um deus e funde um ídolo, sem proveito algum?”'
    reason: Preserva uma tradução mais formal da conjunção ו e da construção לְבִלְתִּי הוֹעִיל.
lexical_decisions:
- source_word: מִי
  choice: Quem
  rationale: O pronome interrogativo introduz uma pergunta retórica incisiva; “Quem” preserva sua concisão e força.
- source_word: יָצַר
  choice: forma
  rationale: O verbo descreve formar ou modelar, especialmente o trabalho de um artesão; “forma” é natural e mantém o sentido básico.
- source_word: אֵל
  choice: um deus
  rationale: Neste contexto, o substantivo é indefinido e designa uma divindade fabricada, não o Deus de Israel; por isso se emprega minúscula.
- source_word: וּפֶסֶל
  choice: ou ... um ídolo
  rationale: A conjunção liga expressões paralelas. “Ou” comunica naturalmente em português a alternativa retórica entre duas descrições da fabricação de uma imagem, sem alterar o sentido global.
- source_word: נָסָךְ
  choice: funde
  rationale: No contexto da fabricação de ídolos, o verbo se refere a produzir uma imagem pela fundição, provavelmente de metal; “funde” é preciso e idiomático.
- source_word: לְבִלְתִּי הוֹעִיל
  choice: que não serve para nada
  rationale: A construção negativa expressa ausência total de proveito ou utilidade. Esta formulação é clara, corrente e conserva a força zombeteira da pergunta.
theological_decisions:
- issue: Sentido de אֵל na polêmica contra os ídolos
  choice: um deus
  alternative: Deus; uma divindade
  rationale: O versículo ridiculariza a fabricação de falsos deuses. A minúscula evita sugerir que o Deus verdadeiro possa ser fabricado e preserva o contraste teológico do contexto.
- issue: Relação entre as duas ações artesanais
  choice: ou
  alternative: e
  rationale: A conjunção hebraica pode ser representada literalmente por “e”, mas, nesta pergunta retórica, “ou” apresenta de modo natural as formulações paralelas sem afirmar que sejam necessariamente dois objetos distintos.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Não serve para nada” torna explícita a inutilidade total do ídolo e mantém o tom mordaz da pergunta profética.
