source:
  edition: WLC
  text: וְ/עַתָּ֥ה שְׁמַ֖ע יַעֲקֹ֣ב עַבְדִּ֑/י וְ/יִשְׂרָאֵ֖ל בָּחַ֥רְתִּי בֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/001.yaml
  text: But now hear[a], Jacob my servant, and Israel, whom I have chosen.
translation:
  language: pt
  text: Mas agora escute, Jacó, meu servo, e Israel, a quem escolhi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E agora escute, Jacó, meu servo, e Israel, a quem escolhi.”'
    reason: Alternativa lexical para a força da conjunção inicial.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Mas agora
  rationale: A conjunção com o advérbio temporal introduz uma transição contrastiva em relação ao contexto anterior; “Mas agora” expressa essa mudança com naturalidade.
- source_word: שְׁמַע
  choice: escute
  rationale: O imperativo significa “ouça/escute”. “Escute” comunica de modo claro e direto a convocação profética à atenção, sem acrescentar objeto ausente no hebraico.
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: Forma tradicional e corrente do nome próprio em português.
- source_word: עַבְדִּי
  choice: meu servo
  rationale: No endereço pactual e profético a Israel, “servo” transmite adequadamente a relação e a vocação, sem enfatizar indevidamente a ideia de escravidão.
- source_word: וְיִשְׂרָאֵל
  choice: e Israel
  rationale: Mantém o paralelismo coordenado entre os dois nomes do povo personificado.
- source_word: בָּחַרְתִּי בוֹ
  choice: a quem escolhi
  rationale: A preposição ב com בחר integra uma construção hebraica idiomática cujo sentido natural em português é escolher alguém. O perfeito é vertido pelo pretérito perfeito, forma idiomática que preserva o ato concluído sem negar sua relevância presente.
theological_decisions:
- issue: Designação de Israel como עַבְדִּי
  choice: meu servo
  alternative: meu escravo
  rationale: Neste contexto, a função relacional e vocacional do povo escolhido está em primeiro plano. “Escravo” poderia acentuar uma condição de cativeiro além do que o versículo pretende.
- issue: Força da conjunção inicial וְ em וְעַתָּה
  choice: Mas agora
  alternative: E agora
  rationale: O contexto marca uma passagem da repreensão para uma nova palavra dirigida a Israel. A forma adversativa explicita em português uma função discursiva legítima da conjunção, sem alterar o conteúdo.
- issue: Relação entre Jacó e Israel
  choice: e Israel
  alternative: isto é, Israel
  rationale: O hebraico conserva a coordenação poética dos nomes, embora ambos designem o mesmo povo personificado. A tradução mantém essa tensão formal sem convertê-la em explicação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Escute” foi preferido a “ouve” para evitar uma forma que pode soar arcaizante, preservando a solenidade e a força do imperativo profético.
