base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/015.yaml
  text: Then it becomes fuel for a man[a], and he takes some of them and warms himself; he also kindles a fire and bakes bread. He also makes a god and bows down; he makes it a carved image and prostrates himself before it.
translation:
  language: pt
  text: 'Então ela serve de lenha para um homem: ele pega uma parte dela e se aquece; também acende o fogo e assa pão. Além disso, faz um deus e se curva diante dele; faz uma imagem esculpida e se prostra diante dela.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “diante deles” ou “diante delas”. A forma pronominal é plural, embora o antecedente imediato, “imagem esculpida”, seja singular; o plural pode refletir uso poético ou uma referência coletiva à madeira ou às suas partes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה לְאָדָם לְבָעֵר
  choice: Então ela serve de lenha para um homem
  rationale: O infinitivo com ל indica finalidade ou uso. “Serve de lenha” expressa em português corrente que a madeira passa a ser usada como combustível, enquanto “um homem” preserva o singular genérico de אָדָם.
- source_word: וַיִּקַּח מֵהֶם
  choice: ele pega uma parte dela
  rationale: מֵהֶם tem sentido partitivo. Como o referente contextual é a madeira, o singular coletivo natural em português evita a impressão de referentes humanos ou de objetos já enumerados.
- source_word: וַיָּחָם
  choice: e se aquece
  rationale: O verbo descreve ficar aquecido; a construção reflexiva comunica naturalmente que o homem usa a madeira para aquecer a si mesmo.
- source_word: אַף יַשִּׂיק וְאָפָה לָחֶם
  choice: também acende o fogo e assa pão
  rationale: אַף acrescenta outra utilização; “acende o fogo” explicita de modo idiomático a ação de atear fogo, e “assa pão” traduz diretamente a sequência verbal.
- source_word: אַף יִפְעַל אֵל
  choice: Além disso, faz um deus
  rationale: Mantém אֵל como “deus” e a ironia profética de alguém fabricar aquilo que depois trata como divino.
- source_word: וַיִּשְׁתָּחוּ
  choice: e se curva diante dele
  rationale: Preserva o gesto físico de inclinar-se, sem substituir automaticamente o verbo pelo conceito mais interpretativo de adorar.
- source_word: עָשָׂהוּ פֶסֶל
  choice: faz uma imagem esculpida
  rationale: פֶסֶל designa uma imagem produzida, especialmente por entalhe ou escultura. A formulação é atual e conserva o aspecto artesanal.
- source_word: וַיִּסְגָּד לָמוֹ
  choice: e se prostra diante dela
  rationale: סגד indica prostração ou homenagem corporal. O português usa o singular feminino para concordar com “imagem”; a forma pronominal plural hebraica é registrada em nota para preservar a particularidade textual sem produzir concordância obscura no texto principal.
theological_decisions:
- issue: Linguagem da fabricação do objeto cultual
  choice: faz um deus ... faz uma imagem esculpida
  alternative: faz um ídolo ... faz um ídolo esculpido
  rationale: 'O hebraico alterna אֵל, “deus”, e פֶסֶל, “imagem esculpida”. Preservar os dois termos mantém a tensão e a ironia: o artesão fabrica algo que trata como deus, embora seja obra de suas mãos.'
- issue: Referente do pronome em לָמוֹ
  choice: diante dela, com nota sobre a forma plural hebraica
  alternative: diante delas
  rationale: A forma hebraica é morfologicamente plural, mas o antecedente imediato פֶסֶל é singular. A concordância singular é natural em português e não decide dogmaticamente a razão do plural; a nota preserva a ambiguidade textual.
- issue: Singular genérico de אָדָם
  choice: um homem
  alternative: uma pessoa; o ser humano
  rationale: “Um homem” conserva o número singular e o valor representativo do substantivo no contexto, sem transformar a referência em plural.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Lenha”, “se aquece”, “acende o fogo” e “se prostra” mantêm concretude e fluidez. O marcador [a] aparece no texto principal junto à expressão explicada.
