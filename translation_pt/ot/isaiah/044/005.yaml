base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/005.yaml
  text: This one will say[a], ‘I am Yahweh’s’; another will call himself by the name of Jacob; and another will write on his hand[c][b], ‘Belonging to Yahweh,’ and will name himself by the name of Israel.
translation:
  language: pt
  text: 'Um dirá[a]: “Pertenço a Yahweh”; outro se chamará pelo nome de Jacó; e outro escreverá em sua mão[b]: “Pertenço a Yahweh”, e tomará para si o nome de Israel[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Um dirá: ‘A Yahweh, eu’”. O hebraico é elíptico e idiomático.'
    reason: lexical_alternative
  - marker: b
    text: “Escreverá em sua mão” provavelmente se refere a inscrever ou marcar a mão como sinal de pertença a Yahweh.
    reason: cultural_note
  - marker: c
    text: 'Ou: “e se dará o nome de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה ... וְזֶה ... וְזֶה
  choice: Este ... outro ... e outro
  rationale: A sequência distributiva apresenta pessoas distintas; a variação soa natural em português sem perder a estrutura repetida.
- source_word: יֹאמַר
  choice: dirá
  rationale: O imperfeito, no contexto profético, é naturalmente expresso pelo futuro.
- source_word: לַיהוָה אָ֔נִי
  choice: Eu pertenço a Yahweh
  rationale: A expressão hebraica é elíptica, literalmente algo como “Para Yahweh, eu”; a formulação portuguesa explicita de modo natural a ideia de pertença.
- source_word: יִקְרָא בְשֵׁם יַעֲקֹב
  choice: se chamará pelo nome de Jacó
  rationale: No paralelismo de confissão, inscrição e adoção de nome, a expressão indica identificação pessoal com Jacó, isto é, com o povo da aliança.
- source_word: יִכְתֹּב יָדוֹ לַיהוָה
  choice: 'escreverá na mão: “De Yahweh”'
  rationale: Embora a construção seja literalmente incomum, ela é bem entendida como uma inscrição na mão que declara pertença a Yahweh; “De Yahweh” preserva a concisão provável da inscrição.
- source_word: וּבְשֵׁם יִשְׂרָאֵל יְכַנֶּה
  choice: adotará o nome de Israel
  rationale: O piel de כנה aqui indica designar-se ou assumir uma designação; esta forma é clara e natural em português, sem excluir a ideia de cognome.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Natureza da linguagem confessional do versículo
  choice: O texto retrata pessoas que declaram pertencer a Yahweh e se identificam com Jacó/Israel.
  alternative: As referências a Jacó e Israel poderiam ser entendidas apenas como afiliação social ou étnica.
  rationale: As cláusulas paralelas — declaração, adoção de nome e inscrição — apontam para uma identificação deliberada, mas a tradução não acrescenta categorias religiosas posteriores.
- issue: Sentido de לַיהוָה na inscrição
  choice: “De Yahweh”, como declaração de pertença.
  alternative: “Para Yahweh” ou “dedicado a Yahweh”.
  rationale: A relação pode envolver pertença e dedicação; a formulação concisa preserva essa tensão melhor que uma explicação excessivamente específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe mantém o paralelismo do hebraico, enquanto explicita apenas o necessário para comunicar suas expressões elípticas.
