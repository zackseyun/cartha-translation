  naturalness: “Um ... outro ... e outro” reproduz de modo mais natural e transparente a série distributiva do hebraico. “Em sua mão” é mais idiomático do que “na mão”, e “Pertenço a Yahweh” funciona como inscrição portuguesa inteligível sem alterar o sentido elíptico.
  terminology: “Yahweh” corresponde ao Tetragrama no texto hebraico e é mantido de forma consistente. “Tomará para si o nome de Israel” comunica a auto-designação indicada por יְכַנֶּה sem a conotação moderna e potencialmente estreita de “adotará”.
