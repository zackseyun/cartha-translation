source:
  edition: WLC
  text: רָנּ֨וּ שָׁמַ֜יִם כִּֽי עָשָׂ֣ה יְהוָ֗ה הָרִ֨יעוּ֙ תַּחְתִּיּ֣וֹת אָ֔רֶץ פִּצְח֤וּ הָרִים֙ רִנָּ֔ה יַ֖עַר וְ/כָל עֵ֣ץ בּ֑/וֹ כִּֽי גָאַ֤ל יְהוָה֙ יַֽעֲקֹ֔ב וּ/בְ/יִשְׂרָאֵ֖ל יִתְפָּאָֽר־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/044/023.yaml
  text: Sing for joy[a], O heavens, for Yahweh has done it; shout aloud, depths of the earth. Break forth into singing, O mountains, O forest, and every tree in it; for Yahweh has redeemed Jacob[c][b], and in Israel he displays his glory.
translation:
  language: pt
  text: Cantem de alegria, ó céus, pois Yahweh agiu[a]; gritem bem alto, profundezas da terra[b]. Irrompam em canto jubiloso, ó montes, ó floresta e todas as árvores que nela há, pois Yahweh redimiu Jacó e, em Israel, manifesta a sua glória[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois Yahweh fez isso” ou “pois Yahweh o fez”. No hebraico, o objeto de “fez” não é expresso.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “regiões mais baixas da terra”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “glorifica a si mesmo” ou “mostra-se glorioso”.'
    reason: alternative_reading
lexical_decisions:
- source_word: רָנּוּ
  choice: Cantem de alegria
  rationale: O imperativo plural de רנן expressa louvor vocal jubiloso; a formulação conserva tanto a ideia de canto quanto a de alegria.
- source_word: כִּי עָשָׂה יְהוָה
  choice: pois Yahweh agiu
  rationale: עשה tem sentido amplo de fazer ou agir, e o hebraico não explicita objeto. “Agiu” preserva essa construção sem acrescentar o que foi feito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em conformidade com a prática do projeto.
- source_word: הָרִיעוּ
  choice: gritem bem alto
  rationale: O hifil imperativo de רוע indica uma aclamação sonora; a expressão é clara e natural em português.
- source_word: תַּחְתִּיּוֹת אָרֶץ
  choice: profundezas da terra
  rationale: A expressão poética designa as regiões inferiores da terra e amplia o chamado a uma escala cósmica.
- source_word: פִּצְחוּ ... רִנָּה
  choice: Irrompam em canto jubiloso
  rationale: A combinação transmite o início súbito e exuberante de uma expressão cantada ou brado de alegria.
- source_word: יַעַר וְכָל עֵץ בּוֹ
  choice: ó floresta e todas as árvores que nela há
  rationale: Mantém a floresta personificada como destinatária direta e explicita naturalmente em português a totalidade de suas árvores.
- source_word: גָאַל
  choice: redimiu
  rationale: גאל denota resgatar ou reivindicar como redentor; “redimiu” conserva seu peso relacional e teológico sem ampliação interpretativa.
- source_word: יִתְפָּאָר
  choice: manifesta a sua glória
  rationale: O hitpael pode indicar que Yahweh se mostra glorioso ou se glorifica; a formulação comunica a manifestação de sua glória em Israel.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pactual em vez de substituí-lo por um título.
- issue: Sentido de יִתְפָּאָר na oração final
  choice: manifesta a sua glória
  alternative: se glorifica; mostra-se glorioso
  rationale: A forma verbal tem Yahweh como sujeito e admite uma nuance reflexiva ou de autoexibição. A tradução escolhida mantém a manifestação da glória divina sem fazer de Israel o sujeito, enquanto a nota registra as alternativas legítimas.
translation_notes:
  register: Português moderno, claro e solene, com vocativos poéticos marcados por “ó”. O paralelismo e a personificação cósmica foram preservados, evitando sintaxe excessivamente arcaica.
