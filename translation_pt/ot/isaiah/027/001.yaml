  terminology: “Yahweh” preserva o nome divino conforme a política informada; “Leviatã” é a forma portuguesa estabelecida. “Serpente fugitiva”, “serpente sinuosa” e “monstro marinho” são escolhas naturais e semanticamente sustentáveis. As notas oferecem alternativas lexicais reais e estão corretamente ancoradas.
