source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֡וּא יִפְקֹ֣ד יְהוָה֩ בְּ/חַרְב֨/וֹ הַ/קָּשָׁ֜ה וְ/הַ/גְּדוֹלָ֣ה וְ/הַֽ/חֲזָקָ֗ה עַ֤ל לִוְיָתָן֙ נָחָ֣שׁ בָּרִ֔חַ וְ/עַל֙ לִוְיָתָ֔ן נָחָ֖שׁ עֲקַלָּת֑וֹן וְ/הָרַ֥ג אֶת הַ/תַּנִּ֖ין אֲשֶׁ֥ר בַּ/יָּֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/001.yaml
  text: In that day Yahweh will punish Leviathan the fleeing serpent[a], Leviathan the twisting serpent, with his fierce and great and strong sword[c][b]; and he will kill the dragon that is in the sea.
translation:
  language: pt
  text: Naquele dia, Yahweh castigará, com sua espada cruel, grande e forte, o Leviatã, a serpente fugitiva[a], o Leviatã, a serpente sinuosa[b]; e matará o monstro marinho[c] que está no mar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a serpente veloz”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a serpente retorcida”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “o dragão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Preserva a fórmula temporal profética de modo natural e corrente em português.
- source_word: יִפְקֹד
  choice: castigará
  rationale: Com עַל e alvos hostis num contexto de juízo, פקד expressa punição ou intervenção judicial; “castigará” comunica isso com clareza.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: בְּחַרְבוֹ
  choice: com sua espada
  rationale: O בְּ é instrumental, e a formulação mantém a imagem marcial concreta.
- source_word: הַקָּשָׁה וְהַגְּדוֹלָה וְהַחֲזָקָה
  choice: cruel, grande e forte
  rationale: “Cruel” expressa a dureza ou severidade da espada neste contexto de juízo; os três adjetivos e sua acumulação enfática são preservados.
- source_word: לִוְיָתָן
  choice: Leviatã
  rationale: Emprega a forma tradicional e reconhecível do nome em português.
- source_word: נָחָשׁ בָּרִחַ
  choice: a serpente fugitiva
  rationale: “Serpente” convém ao registro poético, e “fugitiva” representa diretamente o sentido provável de בָּרִחַ, mantendo em nota a alternativa “veloz”.
- source_word: נָחָשׁ עֲקַלָּתוֹן
  choice: a serpente sinuosa
  rationale: “Sinuosa” transmite a ideia de algo retorcido, curvo ou serpenteante em português natural e poético.
- source_word: וְהָרַג
  choice: e matará
  rationale: O perfeito com waw prossegue a sequência profética futura; “matará” é direto e atual.
- source_word: הַתַּנִּין
  choice: o monstro marinho
  rationale: תנין pode designar dragão ou criatura monstruosa aquática. “Monstro marinho” é claro no contexto, evita sugerir sem necessidade o dragão alado da imaginação moderna e conserva “dragão” em nota.
- source_word: אֲשֶׁר בַּיָּם
  choice: que está no mar
  rationale: Reproduz de modo simples a oração relativa e mantém “mar” como designação comum, não como nome próprio.
theological_decisions:
- issue: Imagens mítico-poéticas do Leviatã e do monstro marinho
  choice: Manter as criaturas como figuras literárias nomeadas no texto profético, sem identificar explicitamente seu referente.
  alternative: Explicá-las como Satanás, o caos, ou determinados reinos e impérios.
  rationale: O hebraico utiliza imagens bíblicas e do antigo Oriente Próximo ligadas às forças do caos, mas neste versículo não identifica de forma explícita as criaturas com Satanás ou com um poder histórico específico. A tradução preserva essa abertura interpretativa.
translation_notes:
  register: Português moderno, digno e poético, com ampla legibilidade brasileira. A ordem sintática deixa claro que a espada é o instrumento com que Yahweh castiga as duas descrições paralelas do Leviatã. As notas preservam alternativas lexicais genuínas sem resolver a imagem teológica.
