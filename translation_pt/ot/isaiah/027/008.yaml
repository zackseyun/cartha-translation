base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/008.yaml
  text: By measure[a], when you sent her away, you contended with her[c][b]; he drove her out with his fierce wind on the day of the east wind.
translation:
  language: pt
  text: Com medida[a], quando a mandaste embora, contendeste com ela[b]; ele a expulsou com seu vento violento, no dia do vento do leste[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Com moderação» ou «Na medida exata». O termo hebraico é raro e provavelmente indica que o juízo foi limitado, não aniquilador.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico mantém o pronome feminino «ela», provavelmente personificando Sião, Israel ou o povo como uma mulher.
    reason: alternative_reading
  - marker: c
    text: O vento do leste é uma imagem recorrente de um vento quente e destrutivo vindo do deserto.
    reason: cultural_note
lexical_decisions:
- source_word: בְּסַּאסְּאָה
  choice: Com medida
  rationale: O termo raro parece indicar uma ação medida ou limitada, não uma destruição total. A formulação preserva tanto a concisão quanto a metáfora do hebraico.
- source_word: בְּשַׁלְחָהּ
  choice: quando a mandaste embora
  rationale: A forma de שלח com sufixo feminino descreve o afastamento da figura feminina, com possível nuance de exílio, sem especificar divórcio nem aniquilação.
- source_word: תְּרִיבֶנָּה
  choice: contendeste com ela
  rationale: ריב pode designar contenda, disputa ou ação judicial. «Contendeste» conserva esse alcance e o possível tom de demanda judicial da aliança.
- source_word: הָגָה
  choice: ele a expulsou
  rationale: No contexto de juízo e sob a imagem do vento, o verbo comunica remoção enérgica e decisiva.
- source_word: בְּרוּחוֹ
  choice: com seu vento
  rationale: Embora רוּחַ possa significar vento, sopro ou espírito, a menção subsequente ao vento leste favorece aqui o sentido literal de «vento».
- source_word: הַקָּשָׁה
  choice: impetuoso
  rationale: O adjetivo expressa dureza ou severidade; aplicado ao vento, «impetuoso» transmite força destrutiva em português corrente e digno.
- source_word: בְּיוֹם קָדִים
  choice: no dia do vento leste
  rationale: Mantém de perto a imagem hebraica do קדים, vento oriental quente e destrutivo, deixando sua conotação cultural para a nota.
theological_decisions:
- issue: Referente dos sufixos femininos
  choice: Manter os pronomes femininos sem identificar o referente no texto principal.
  alternative: Explicitar Israel, Sião ou o povo de Deus personificado.
  rationale: O contexto sugere a personificação feminina do povo da aliança, mas o versículo não identifica expressamente o referente.
- issue: Mudança de sujeito entre a segunda e a terceira pessoa
  choice: Preservar «contendeste» e depois «ele a expulsou».
  alternative: Uniformizar ambos os verbos na segunda pessoa.
  rationale: A mudança abrupta está no hebraico e pode pertencer à textura poética; harmonizá-la eliminaria uma ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A sintaxe conserva a concisão poética, os pronomes femininos e a mudança de pessoa verbal do hebraico. «Vento leste» é mais transparente internacionalmente que «vento oriental».
