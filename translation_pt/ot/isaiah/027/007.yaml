base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/007.yaml
  text: Has he struck him as he struck the one who struck him? Or has he been killed as his slain were killed?[a][b]
translation:
  language: pt
  text: Será que ele o feriu como aquele que o feria o feriu? Ou foi ele morto como foram mortos os seus mortos?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Será que ele o feriu de acordo com o golpe de quem o feria?”'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, de modo mais compacto: “Ou foi ele morto conforme a matança dos seus mortos?” O hebraico mantém comprimidos e implícitos os referentes dos pronomes. No contexto, o contraste provavelmente é entre o modo como o SENHOR trata Jacó e o modo como julga os que o atacaram.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַכְּמַכַּת
  choice: Será que... como
  rationale: Preserva a força interrogativa retórica do ה e a comparação introduzida por כְּ, em português natural.
- source_word: מַכֵּהוּ
  choice: aquele que o feria
  rationale: O particípio hifil com sufixo indica o agente que o golpeava; o imperfeito em português comunica a ação característica ou continuada sem recorrer ao pouco natural «seu feridor».
- source_word: הִכָּהוּ
  choice: ele o feriu
  rationale: Traduz o perfeito de נכה como ação concluída e mantém os referentes pronominais implícitos, como no hebraico.
- source_word: אִם
  choice: Ou
  rationale: Neste paralelismo interrogativo, introduz a segunda alternativa, e não uma condição.
- source_word: כְּהֶרֶג
  choice: como foram mortos
  rationale: Expressa idiomaticamente a comparação ligada ao substantivo הֶרֶג, preservando a ideia de morte violenta sem tornar a frase excessivamente nominal.
- source_word: הֲרֻגָיו
  choice: os que ele matou
  rationale: Explicita em português a relação normalmente indicada pelo particípio passivo com sufixo, mas a nota registra a forma mais compacta e ambígua «seus mortos».
- source_word: הֹרָג
  choice: ele foi morto
  rationale: Mantém o sentido passivo do hofal e o contraste entre ferir e matar.
theological_decisions:
- issue: Referentes dos pronomes na comparação retórica
  choice: Manter os referentes na forma pronominal no texto principal.
  alternative: Identificar explicitamente Jacó/Israel e seu agressor ou os inimigos de Israel.
  rationale: O hebraico não nomeia os referentes neste versículo. A formulação preserva a compressão e a tensão do original, sem inserir a interpretação contextual no texto.
- issue: Agente implícito em הֲרֻגָיו
  choice: Traduzir «os que ele matou», conservando o pronome sem identificar seu referente.
  alternative: «seus mortos», que pode soar como simples posse e preservar ainda mais a ambiguidade formal.
  rationale: A leitura agentiva é sintaticamente natural, mas a nota mantém disponível a formulação compacta, pois a cadeia pronominal hebraica admite incerteza contextual.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. «Feriu» distingue נכה da linguagem de morte na segunda pergunta. As perguntas retóricas e a referência pronominal comprimida foram preservadas; as duas notas estão marcadas no texto.
