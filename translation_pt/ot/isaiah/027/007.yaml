  naturalness: A redação revista conserva o paralelismo retórico e os pronomes implícitos em português claro. «Os seus mortos» é deliberadamente compacto e um pouco solene, mas é compreensível no registro bíblico e evita resolver a ambiguidade do original.
  terminology: «Feriu» representa adequadamente נכה e distingue a primeira pergunta da linguagem de morte na segunda. «Morto/mortos» reproduz de modo natural o campo semântico de הֶרֶג e הֹרָג sem impor uma leitura doutrinária ou identificar os referentes.
