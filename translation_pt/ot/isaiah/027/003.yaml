id: ISA.27.3
reference: Isaiah 27:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֲנִ֤י יְהוָה֙ נֹֽצְרָ֔/הּ לִ/רְגָעִ֖ים אַשְׁקֶ֑/נָּה פֶּ֚ן יִפְקֹ֣ד עָלֶ֔י/הָ לַ֥יְלָה וָ/י֖וֹם אֶצֳּרֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/003.yaml
  text: I[a], Yahweh, am its keeper[b]; I water it continually. Lest anyone punish it, I guard it night and day.
translation:
  language: pt
  text: Eu, Yahweh, sou seu guardião; a cada momento[a] eu a rego. Para que ninguém a ataque[b], eu a guardo noite e dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “continuamente” ou “de momento em momento”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a puna” ou “traga castigo sobre ela”. O verbo hebraico pode indicar uma intervenção hostil ou uma visitação punitiva.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: נֹצְרָהּ
  choice: sou seu guardião
  rationale: O particípio de נצר comunica proteção vigilante e contínua; a forma nominal é natural em português e permite conservar, no fim do versículo, a forma verbal da mesma raiz.
- source_word: לִרְגָעִים
  choice: a cada momento
  rationale: A expressão, literalmente relacionada a “momentos”, indica uma ação repetida e constante. A formulação mantém a imagem temporal do hebraico.
- source_word: אַשְׁקֶנָּה
  choice: eu a rego
  rationale: O hifil de שקה significa dar de beber ou regar; tendo a vinha como referente, “regar” é a opção mais natural e precisa.
- source_word: פֶּן
  choice: para que ninguém
  rationale: Em conjunto com a oração seguinte, expressa prevenção. Esta construção é mais corrente no português moderno do que “para que não”, quando se explicita o sujeito indefinido.
- source_word: יִפְקֹד עָלֶיהָ
  choice: a ataque
  rationale: פקד com על pode descrever uma intervenção contra alguém, inclusive visitação punitiva. No contexto da proteção da vinha, “atacar” comunica com clareza a ação hostil, enquanto a possível nuance judicial é preservada em nota.
- source_word: לַיְלָה וָיוֹם
  choice: noite e dia
  rationale: Expressão idiomática que preserva o merismo hebraico e comunica vigilância ininterrupta.
- source_word: אֶצֳּרֶנָּה
  choice: eu a guardo
  rationale: A forma finita de נצר é vertida ativamente, conservando a repetição lexical com “guardião” e a ênfase na proteção divina.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto traz o nome pessoal divino. “Yahweh” o representa diretamente, sem substituí-lo por um título.
- issue: Sujeito não expresso de יִפְקֹד
  choice: ninguém
  alternative: ele; um inimigo
  rationale: A forma verbal está na terceira pessoa masculina do singular, mas não traz sujeito explícito. O indefinido “ninguém”, sob o alcance da oração preventiva, conserva a referência aberta a qualquer agente hostil.
- issue: Sentido de פקד com על
  choice: atacar
  alternative: punir; trazer castigo sobre
  rationale: O contexto favorece uma intervenção hostil contra a vinha, mas o verbo também pode ter sentido de visitação punitiva. A tradução principal segue o contexto sem apagar a alternativa judicial, registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A repetição entre “guardião” e “guardo” conserva a recorrência da raiz hebraica נצר. Os pronomes femininos retomam a vinha do contexto.
