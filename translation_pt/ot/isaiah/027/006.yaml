id: ISA.27.6
reference: Isaiah 27:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַ/בָּאִים֙ יַשְׁרֵ֣שׁ יַֽעֲקֹ֔ב יָצִ֥יץ וּ/פָרַ֖ח יִשְׂרָאֵ֑ל וּ/מָלְא֥וּ פְנֵי תֵבֵ֖ל תְּנוּבָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/006.yaml
  text: In days to come Jacob will take root[a]; Israel will blossom and flower[b], and they will fill the face of the world with fruit.
translation:
  language: pt
  text: Nos dias que virão, Jacó criará raízes[a]; Israel brotará e florescerá, e eles encherão a face do mundo de frutos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Os que vêm: Jacó criará raízes.” A expressão hebraica inicial significa mais literalmente “os que vêm”, mas, neste contexto, provavelmente indica um tempo futuro.'
    reason: alternative_reading
  - marker: b
    text: “Frutos” também pode ser traduzido por “produção” ou “rendimento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּאִים
  choice: Nos dias que virão
  rationale: O particípio com artigo parece funcionar aqui de modo elíptico como expressão temporal voltada para o futuro. A tradução é natural em português e preserva o tom profético.
- source_word: יַשְׁרֵשׁ
  choice: criará raízes
  rationale: Embora a forma Hifil possa ter sentido causativo, no paralelismo da metáfora vegetal ela admite valor efetivamente intransitivo. 'Criará raízes' é idiomático e mantém a imagem concreta.
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: Mantém-se o nome próprio, usado poeticamente de modo coletivo e em paralelo com Israel.
- source_word: יָצִיץ וּפָרַח
  choice: brotará e florescerá
  rationale: '''Brotará'' representa o surgimento do broto, enquanto ''florescerá'' conserva a progressão botânica do segundo verbo sem reduzir os dois a sinônimos indistintos.'
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém-se o nome próprio, paralelo a Jacó e empregado para o povo como unidade coletiva.
- source_word: וּמָלְאוּ
  choice: e eles encherão
  rationale: O pronome explícito reproduz a passagem dos sujeitos coletivos no singular para o verbo hebraico no plural.
- source_word: פְנֵי תֵבֵל
  choice: a face do mundo
  rationale: Preserva a imagem hebraica de 'face/superfície' e traduz תבל de maneira ampla e inteligível.
- source_word: תְּנוּבָה
  choice: frutos
  rationale: O substantivo designa produto, produção ou rendimento. 'Frutos' harmoniza naturalmente com a metáfora de raízes, brotos e flores, sem restringir a imagem a uma colheita específica.
theological_decisions:
- issue: Identidade coletiva de Jacó e Israel na metáfora agrícola
  choice: Conservar os nomes Jacó e Israel sem explicitar 'povo' ou 'descendentes'
  alternative: Traduzir de forma explicativa como 'os descendentes de Jacó' ou 'o povo de Israel'
  rationale: O paralelismo hebraico personifica o povo mediante os próprios nomes. Preservá-los mantém a força literária e teológica sem acrescentar uma interpretação ao texto.
- issue: Mudança do singular coletivo para o plural em וּמָלְאוּ
  choice: Tornar o plural visível com 'eles encherão'
  alternative: Manter concordância portuguesa estritamente singular, como 'Israel encherá'
  rationale: O hebraico passa dos nomes coletivos acompanhados por verbos no singular para um verbo no plural, apresentando o povo simultaneamente como unidade e pluralidade. A tradução conserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação conserva o paralelismo poético, a metáfora vegetal e a mudança do singular coletivo para o plural.
