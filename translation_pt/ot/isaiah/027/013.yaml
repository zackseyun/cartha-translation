  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא יִתָּקַע֮ בְּ/שׁוֹפָ֣ר גָּדוֹל֒ וּ/בָ֗אוּ הָ/אֹֽבְדִים֙ בְּ/אֶ֣רֶץ אַשּׁ֔וּר וְ/הַ/נִּדָּחִ֖ים בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/הִשְׁתַּחֲו֧וּ לַ/יהוָ֛ה בְּ/הַ֥ר הַ/קֹּ֖דֶשׁ בִּ/ירוּשָׁלִָֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/013.yaml
  text: And in that day a great trumpet will be blown[c][b][a], and those perishing in the land of Assyria and those driven away in the land of Egypt will come and worship Yahweh on the holy mountain in Jerusalem.
translation:
  language: pt
  text: Naquele dia, uma grande trombeta será tocada. Virão os que estão perecendo[a] na terra da Assíria e os desterrados[b] na terra do Egito, e adorarão[c] o SENHOR no monte santo, em Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que estão perdidos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “os banidos” ou “os expulsos”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “se prostrarão diante do SENHOR”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Expressa de modo natural a fórmula profética que introduz um acontecimento futuro, sem recorrer à construção mais pesada “acontecerá naquele dia”.
- source_word: יִתָּקַע בְּשׁוֹפָר גָּדוֹל
  choice: uma grande trombeta será tocada
  rationale: O nifal indica que o instrumento será tocado. “Trombeta” comunica claramente sua função, enquanto “grande” preserva tanto a dimensão quanto a importância sugeridas pelo adjetivo.
- source_word: הָאֹבְדִים
  choice: os que perecem
  rationale: Mantém a força verbal do particípio e a possibilidade de ruína em curso, sem eliminar o sentido alternativo de pessoas perdidas.
- source_word: בְּאֶרֶץ אַשּׁוּר
  choice: na terra da Assíria
  rationale: Conserva o substantivo explícito “terra” e a concretude geográfica do hebraico.
- source_word: וְהַנִּדָּחִים
  choice: os desterrados
  rationale: Preserva a condição passiva de pessoas afastadas à força de sua terra, em português natural e conciso, sem restringir o termo a uma categoria jurídica específica.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: na terra do Egito
  rationale: Mantém o substantivo explícito “terra” e o paralelismo com a Assíria.
- source_word: וְהִשְׁתַּחֲווּ
  choice: adorarão
  rationale: No contexto, o ato físico de prostrar-se tem o SENHOR como destinatário e expressa adoração; a nota preserva a imagem corporal literal.
- source_word: לַיהוָה
  choice: o SENHOR
  rationale: Segue a convenção bíblica reverencial amplamente reconhecida em português para o nome divino YHWH.
- source_word: בְּהַר הַקֹּדֶשׁ
  choice: no monte santo
  rationale: Reproduz de forma direta e idiomática a referência ao monte consagrado.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: Tradução natural da preposição com o nome da cidade.
theological_decisions:
- issue: Horizonte da reunião profética
  choice: Manter a imagem de uma reunião futura procedente da Assíria e do Egito sem definir exclusivamente seu horizonte.
  alternative: Limitá-la apenas ao retorno histórico dos exilados ou apenas à reunião escatológica final.
  rationale: A fórmula “naquele dia” e a linguagem de restauração permitem mais de um horizonte profético; a tradução não resolve essa tensão além do que o texto declara.
- issue: Representação de יהוה
  choice: o SENHOR
  alternative: Yahweh
  rationale: A forma em versaletes segue a convenção portuguesa tradicional para o tetragrama e preserva sua referência ao nome divino da aliança.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe direta. A construção evita arcaísmos, conserva o paralelismo geográfico e mantém em notas as ambiguidades lexicais relevantes.
