  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא יַחְבֹּ֧ט יְהוָ֛ה מִ/שִּׁבֹּ֥לֶת הַ/נָּהָ֖ר עַד נַ֣חַל מִצְרָ֑יִם וְ/אַתֶּ֧ם תְּלֻקְּט֛וּ לְ/אַחַ֥ד אֶחָ֖ד בְּנֵ֥י יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/012.yaml
  text: And in that day Yahweh will thresh from the channel of the River to the Wadi of Egypt[a], and you will be gathered one by one[d][c][b], O sons of Israel.
translation:
  language: pt
  text: Naquele dia, Yahweh fará a debulha desde a corrente do Rio[a] até o ribeiro do Egito[b]; e vocês serão recolhidos, um a um[c], filhos de Israel[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O Rio” é uma designação comum do rio Eufrates.
    reason: cross_reference
  - marker: b
    text: 'Ou: “uádi do Egito”. O hebraico indica um curso de água ou vale de torrente, possivelmente sazonal, e não necessariamente o Nilo.'
    reason: lexical_alternative
  - marker: c
    text: O verbo hebraico evoca o ato de respigar ou recolher individualmente, depois da debulha.
    reason: cultural_note
  - marker: d
    text: 'Ou: “descendentes de Israel”. O hebraico diz literalmente “filhos de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Expressão profética temporal vertida de modo natural e solene em português, sem reproduzir desnecessariamente a cópula hebraica.
- source_word: יַחְבֹּט
  choice: debulhará
  rationale: Preserva a metáfora agrícola de bater ou malhar a produção para separá-la e recolhê-la, em ligação com o recolhimento individual mencionado depois.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מִשִּׁבֹּלֶת הַנָּהָר
  choice: desde a corrente do Rio
  rationale: שִׁבֹּלֶת pode indicar corrente ou fluxo; no contexto geográfico, refere-se naturalmente à corrente do grande Rio, provavelmente o Eufrates.
- source_word: עַד נַחַל מִצְרָיִם
  choice: até o ribeiro do Egito
  rationale: נַחַל designa um curso de água ou vale de torrente, muitas vezes sazonal. 'Ribeiro do Egito' é compreensível e evita identificá-lo indevidamente com o Nilo.
- source_word: תְּלֻקְּטוּ
  choice: serão recolhidos
  rationale: O passivo de לקט evoca apanhar ou respigar; 'recolhidos' comunica claramente o resultado, enquanto 'um a um' mantém a nuance individual.
- source_word: לְאַחַד אֶחָד
  choice: um a um
  rationale: Reproduz de forma idiomática e concisa a distribuição individual expressa pelo hebraico.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Mantém a forma masculina plural e a designação étnico-pactual do hebraico, com leitura natural como vocativo em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. A transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido da metáfora יַחְבֹּט
  choice: debulhará
  alternative: baterá; sacudirá
  rationale: A imagem agrícola pode sugerir tanto separação quanto recolhimento. A tradução mantém a metáfora e não explicita no texto principal se o ato enfatiza juízo, restauração ou ambos.
- issue: Forma de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: descendentes de Israel; povo de Israel
  rationale: A formulação conserva o masculino gramatical e a expressão tradicional de pertencimento coletivo sem neutralizá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada à sintaxe portuguesa. Mantiveram-se a metáfora agrícola, a referência geográfica não explicitada no corpo do texto e o tratamento coletivo na segunda pessoa do plural.
