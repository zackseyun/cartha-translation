source:
  edition: WLC
  text: בִּ/יבֹ֤שׁ קְצִירָ/הּ֙ תִּשָּׁבַ֔רְנָה נָשִׁ֕ים בָּא֖וֹת מְאִיר֣וֹת אוֹתָ֑/הּ כִּ֣י לֹ֤א עַם בִּינוֹת֙ ה֔וּא עַל כֵּן֙ לֹֽא יְרַחֲמֶ֣/נּוּ עֹשֵׂ֔/הוּ וְ/יֹצְר֖/וֹ לֹ֥א יְחֻנֶּֽ/נּוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/011.yaml
  text: When its harvest dries up[a], it is broken; women come and make a fire with it. For this is not a people of understanding; therefore its Maker will not have compassion on it[b], and the one who formed it will show it no favor.
translation:
  language: pt
  text: Quando seus ramos secam[a], são quebrados; as mulheres vêm e fazem fogo com eles. Pois este é um povo sem entendimento; por isso, aquele que o fez não terá compaixão dele, e aquele que o formou não lhe mostrará favor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Quando a sua colheita seca” ou “Quando aquilo que foi cortado dela seca”. A palavra hebraica normalmente significa “colheita”, mas aqui provavelmente se refere aos ramos cortados que secam e são usados como combustível.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּיבֹשׁ
  choice: Quando ... secam
  rationale: A preposição ב com a forma verbal tem valor temporal; “secam” preserva a imagem de vegetação ressequida que pode ser quebrada e usada como combustível.
- source_word: קְצִירָהּ
  choice: os seus ramos
  rationale: Embora קָצִיר normalmente signifique “colheita”, neste contexto designa provavelmente, por metonímia, o que é cortado da planta, isto é, seus ramos ou galhos. A forma plural também permite refletir com naturalidade o verbo feminino plural seguinte.
- source_word: תִּשָּׁבַרְנָה
  choice: são quebrados
  rationale: O verbo está no feminino plural e descreve os ramos secos sendo quebrados. O masculino plural em português concorda naturalmente com “ramos”.
- source_word: נָשִׁים בָּאוֹת
  choice: as mulheres vêm
  rationale: Tradução direta e natural da ação subsequente; a cena mostra os ramos secos sendo recolhidos para uma tarefa doméstica comum.
- source_word: מְאִירוֹת אוֹתָהּ
  choice: fazem fogo com eles
  rationale: O hifil de אור aqui indica fazer arder ou usar como combustível. A expressão portuguesa comunica a função concreta dos ramos sem sugerir apenas iluminação.
- source_word: לֹא עַם בִּינוֹת הוּא
  choice: este é um povo sem entendimento
  rationale: Expressa de modo corrente a acusação coletiva de falta de compreensão ou discernimento, sem acrescentar uma interpretação específica.
- source_word: עַל כֵּן
  choice: por isso
  rationale: Conector inferencial natural que relaciona a falta de entendimento com a consequente ausência de compaixão e favor.
- source_word: לֹא יְרַחֲמֶנּוּ
  choice: não terá compaixão dele
  rationale: רחם denota compaixão ou misericórdia. “Dele” retoma “povo” como coletivo masculino em português.
- source_word: עֹשֵׂהוּ
  choice: aquele que o fez
  rationale: Preserva a designação participial de Deus como quem fez o povo e mantém a relação verbal com o objeto pronominal.
- source_word: וְיֹצְרוֹ
  choice: aquele que o formou
  rationale: Mantém a imagem distinta de יצר, formar ou modelar, e o paralelismo com “aquele que o fez”.
- source_word: לֹא יְחֻנֶּנּוּ
  choice: não lhe concederá favor
  rationale: חנן significa mostrar ou conceder favor. A formulação é digna e clara, sem impor terminologia teológica posterior.
theological_decisions:
- issue: Referente e número na imagem da vegetação
  choice: 'Traduzir קְצִירָהּ contextualmente por “os seus ramos” e conservar o plural do verbo: “são quebrados”.'
  alternative: “Quando a sua colheita seca, ela é quebrada” ou “quando o que foi cortado dela seca, é quebrado”.
  rationale: O hebraico combina um sufixo feminino singular com um verbo feminino plural, sinal de uma imagem coletiva. O contexto de material vegetal seco, quebrado e queimado favorece “ramos”, mas a nota conserva a possibilidade lexical de “colheita” ou “o que foi cortado”.
- issue: Linguagem do juízo divino
  choice: Manter separadamente “aquele que o fez” e “aquele que o formou”, bem como a retenção de compaixão e favor.
  alternative: Resumir como “Deus não terá misericórdia deles”.
  rationale: Os dois particípios hebraicos, עשה e יצר, são deliberadamente paralelos, mas não idênticos. Preservá-los mantém a tensão entre Deus como criador/formador do povo e seu juízo, sem acrescentar uma conclusão denominacional.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Preferiu-se “ramos” a “galhos” pelo registro literário moderado; “povo sem entendimento” evita uma formulação excessivamente arcaica. O texto conserva o paralelismo entre fazer e formar e usa pronomes masculinos para retomar “povo”.
