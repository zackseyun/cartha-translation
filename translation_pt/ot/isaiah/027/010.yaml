base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/010.yaml
  text: For the fortified city is solitary[a], a habitation deserted and abandoned like the wilderness; there a calf grazes[b], and there it lies down and strips its branches bare.
translation:
  language: pt
  text: 'Pois a cidade fortificada está isolada: uma morada[a] deserta e abandonada como o deserto. Ali um bezerro pasta, ali se deita e consome por completo os seus ramos.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pastagem” ou “lugar de habitação”. O hebraico נָוֶה pode ter sentido residencial ou pastoril.
    reason: lexical_alternative
  - marker: b
    text: Ou “deixa completamente despidos os seus ramos”. O verbo hebraico indica consumo completo; o pronome se refere à cidade ou morada personificada, isto é, aos ramos associados a esse lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento do que foi dito antes, preservando a força causal do hebraico.
- source_word: עִיר בְּצוּרָה
  choice: a cidade fortificada
  rationale: Expressa naturalmente uma cidade protegida por fortificações; o artigo definido se ajusta à provável referência contextual.
- source_word: בָּדָד
  choice: está isolada
  rationale: Comunica o estado solitário e desolado da cidade em português atual, sem sugerir apenas ausência momentânea de companhia.
- source_word: נָוֶה
  choice: morada
  rationale: Preserva o sentido de lugar habitado e mantém aberta, em nota, a nuance pastoril possível do termo.
- source_word: מְשֻׁלָּח וְנֶעֱזָב
  choice: deserta e abandonada
  rationale: Reproduz o par intensificador que descreve o lugar como deixado para trás e sem habitantes.
- source_word: כַּמִּדְבָּר
  choice: como o deserto
  rationale: Representa o espaço ermo e inculto indicado por מִדְבָּר, em formulação clara e reconhecível.
- source_word: שָׁם יִרְעֶה עֵגֶל
  choice: Ali o bezerro pasta
  rationale: Mantém o singular e traduz רעה pela ação pastoril mais natural em português.
- source_word: וְשָׁם יִרְבָּץ
  choice: ali se deita
  rationale: Descreve de modo simples o animal que se acomoda no local; o presente dá vivacidade à cena poética.
- source_word: וְכִלָּה סְעִפֶיהָ
  choice: e consome por completo os seus ramos
  rationale: Torna explícita a ideia de consumo completo de כלה e conserva o sufixo feminino de סְעִפֶיהָ sem identificar além do texto o referente dos ramos.
