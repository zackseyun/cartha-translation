lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Preserva a fórmula temporal profética em português natural e solene.
- source_word: כֶּרֶם
  choice: vinha
  rationale: O substantivo designa uma plantação de videiras, não uma videira isolada; “vinha” é a forma bíblica corrente e adequada ao contexto.
- source_word: חֶמֶד
  choice: agradável
  rationale: Expressa a ideia de algo desejável, deleitoso ou aprazível. “Vinha agradável” é clara e natural, enquanto a construção mais literal fica registrada em nota.
- source_word: עַנּוּ
  choice: cantem
  rationale: O imperativo plural de ענה pode ter sentido musical ou litúrgico de responder cantando. “Cantem” comunica esse valor com clareza, sem excluir as nuances alternativas preservadas em nota.
- source_word: לָהּ
  choice: a respeito dela
  rationale: A preposição com o pronome feminino singular remete à vinha. “A respeito dela” exprime naturalmente o provável tema do canto, enquanto outras relações possíveis são mantidas em nota.
