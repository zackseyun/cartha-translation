  text: א֚וֹ יַחֲזֵ֣ק בְּ/מָעוּזִּ֔/י יַעֲשֶׂ֥ה שָׁל֖וֹם לִ֑/י שָׁל֖וֹם יַֽעֲשֶׂה לִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/005.yaml
  text: Or let him take hold of my strength[a]; let him make peace with me; let him make peace with me.
translation:
  language: pt
  text: Ou que ele se agarre à minha fortaleza[a]; que faça as pazes comigo; que faça as pazes comigo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meu refúgio”, “minha proteção” ou “minha força”.
    reason: lexical_alternative
lexical_decisions:
- source_word: א֚וֹ
  choice: Ou
  rationale: Introduz de modo conciso a alternativa ao juízo descrito no contexto anterior.
- source_word: יַחֲזֵ֣ק בְּ/מָעוּזִּ֔/י
  choice: que ele se agarre à minha fortaleza
  rationale: Mantém a imagem concreta de buscar proteção, bem como o valor jussivo do verbo. מָעוֹז pode designar fortaleza, refúgio ou força; “fortaleza” preserva melhor a metáfora espacial sem excluir a ideia de proteção.
- source_word: יַעֲשֶׂ֥ה שָׁל֖וֹם לִ֑/י
  choice: que faça as pazes comigo
  rationale: A expressão idiomática portuguesa comunica reconciliação relacional, sentido natural de עשה שלום com לְ neste contexto.
- source_word: שָׁל֖וֹם יַֽעֲשֶׂה לִּֽ/י
  choice: que faça as pazes comigo
  rationale: Conserva integralmente a repetição enfática do hebraico, sem suavizá-la.
theological_decisions:
- issue: Referente dos pronomes de primeira pessoa
  choice: A fala é apresentada diretamente como fala de Deus, oferecendo proteção e reconciliação consigo.
  alternative: Uma formulação impessoal que reduza a autorreferência divina.
  rationale: O contexto imediato identifica como divina a voz em primeira pessoa; a tradução mantém essa relação direta sem acrescentar conclusões doutrinárias.
- issue: Sentido de מָעוּזִּי
  choice: “minha fortaleza”, entendida como a proteção oferecida pelo próprio Deus.
  alternative: “minha força” ou “meu refúgio”.
  rationale: O termo admite tanto a noção de força quanto a de lugar ou fonte de proteção. “Fortaleza” retém a imagem e deixa a amplitude lexical indicada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Agarrar-se a” conserva a imagem concreta e expressa busca decidida de proteção; “fazer as pazes” é idiomático e deixa claro o sentido de reconciliação. A repetição final foi preservada por sua ênfase retórica.
