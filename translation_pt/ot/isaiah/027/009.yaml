  text: לָ/כֵ֗ן בְּ/זֹאת֙ יְכֻפַּ֣ר עֲוֺֽן יַעֲקֹ֔ב וְ/זֶ֕ה כָּל פְּרִ֖י הָסִ֣ר חַטָּאת֑/וֹ בְּ/שׂוּמ֣/וֹ כָּל אַבְנֵ֣י מִזְבֵּ֗חַ כְּ/אַבְנֵי גִר֙ מְנֻפָּצ֔וֹת לֹֽא יָקֻ֥מוּ אֲשֵׁרִ֖ים וְ/חַמָּנִֽים־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/009.yaml
  text: 'Therefore by this the guilt of Jacob will be atoned for, and this will be the full fruit of the removal of his sin: when he makes all the stones of the altar like crushed chalkstones, the Asherah poles and incense altars will not stand.'
translation:
  language: pt
  text: 'Por isso, por meio disto será expiada a culpa de Jacó; e este será todo o fruto da remoção de seu pecado: quando todas as pedras de altar forem postas como pedras de cal despedaçadas, os postes de Aserá e as colunas dedicadas ao sol não ficarão de pé.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְכֻפַּר עֲוֺן
  choice: será expiada a culpa
  rationale: O verbo כפר no passivo expressa expiação, enquanto עון pode designar tanto a iniquidade quanto a culpa decorrente dela. “Culpa” preserva aqui o enfoque no que é expiado.
- source_word: כָּל פְּרִי
  choice: todo o fruto
  rationale: Mantém a metáfora hebraica e a ideia do resultado completo ou pleno do tratamento do pecado.
- source_word: אַבְנֵי גִר מְנֻפָּצוֹת
  choice: pedras de cal reduzidas a pedaços
  rationale: גיר indica material calcário ou cal; מנפצות descreve pedras despedaçadas. A formulação conserva a imagem concreta sem especificar indevidamente giz.
- source_word: אֲשֵׁרִים
  choice: postes de Aserá
  rationale: Refere-se aos objetos cultuais associados à deusa Aserá; “postes” comunica ao leitor moderno que se trata de elementos de culto, não simplesmente de árvores.
- source_word: חַמָּנִים
  choice: altares de incenso
  rationale: O termo designa objetos cultuais solares ou altares de incenso; esta opção segue uma compreensão tradicional plausível e natural em português.
theological_decisions:
- issue: Relação entre expiação e destruição dos objetos idólatras
  choice: Manter a sequência textual sem explicar se a destruição é meio, evidência ou resultado da expiação
  alternative: Interpretar explicitamente a remoção da idolatria como condição para o perdão ou apenas como prova de arrependimento
  rationale: O hebraico associa “por isto” e “fruto” à remoção do pecado, mas deixa alguma tensão quanto à relação exata. A tradução não deve impor uma sistematização doutrinária.
- issue: Sujeito de בְּשׂוּמוֹ
  choice: “ele fará” sem identificar expressamente o agente
  alternative: “quando Jacó fizer” ou “quando Deus fizer”
  rationale: A forma pronominal permite que o referente seja entendido pelo contexto, mas a identificação não é inteiramente inequívoca. Evita-se resolver silenciosamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva as metáforas de expiação, fruto e pedras despedaçadas, evitando linguagem excessivamente técnica ou confessional.
