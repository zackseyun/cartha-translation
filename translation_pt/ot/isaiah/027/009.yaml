  source_fidelity: A tradução preserva adequadamente a expiação da culpa de Jacó, a metáfora do fruto e a imagem da pulverização das pedras do altar. Contudo, חַמָּנִים designa monumentos, imagens ou colunas associados ao culto solar, não altares de incenso. A redação também pode representar melhor o particípio passivo de מְנֻפָּצוֹת e evitar atribuir um agente definido ao sufixo de בְּשׂוּמוֹ.
  naturalness: O registro é claro e moderno. “Por meio disto” e a construção passiva proposta soam naturais em português e preservam melhor a relação e a ambiguidade do hebraico.
  terminology: “Culpa”, “expiada”, “postes de Aserá” e “fruto” são escolhas adequadas. “Colunas dedicadas ao sol” substitui incorretamente “altares de incenso” para חַמָּנִים, sem alegar uma identificação material excessivamente precisa.
