  text: חֵמָ֖ה אֵ֣ין לִ֑/י מִֽי יִתְּנֵ֜/נִי שָׁמִ֥יר שַׁ֨יִת֙ בַּ/מִּלְחָמָ֔ה אֶפְשְׂעָ֥ה בָ֖/הּ אֲצִיתֶ֥/נָּה יָּֽחַד־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/004.yaml
  text: I have no wrath[a]. Who would set briers and thorns against me in battle? I would march against them[b]; I would burn them up together.
translation:
  language: pt
  text: Não tenho ira. Quem me dera enfrentar espinheiros e abrolhos na batalha![a] Eu avançaria contra eles[b] e os incendiaria de uma só vez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “Quem me daria espinheiros e abrolhos na batalha?” A expressão pode comunicar um desafio ou o desejo de que tais adversários sejam postos diante dele.'
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, os sufixos de “avançaria contra” e “incendiaria” estão no singular feminino e retomam coletivamente “espinheiros e abrolhos”; em português, o plural torna essa referência mais natural.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵמָה
  choice: ira
  rationale: O substantivo indica ira intensa ou ardente. “Ira” preserva essa força e mantém o tom digno e conciso do hebraico.
- source_word: אֵין לִי
  choice: não tenho
  rationale: A construção existencial hebraica com לִי expressa posse; “não tenho” é a forma natural e fiel em português.
- source_word: מִי יִתְּנֵנִי
  choice: Quem me dera enfrentar
  rationale: Literalmente, “quem me daria”, mas aqui a expressão comunica um desafio ou desejo de que adversários sejam postos diante do falante. “Quem me dera enfrentar” transmite essa força sem exigir uma construção pouco natural.
- source_word: שָׁמִיר שַׁיִת
  choice: espinheiros e abrolhos
  rationale: O par designa vegetação espinhosa, coletivamente apresentada como oposição hostil e própria para ser queimada. A combinação conserva a imagem concreta e o registro poético.
- source_word: בַּמִּלְחָמָה
  choice: na batalha
  rationale: A expressão situa o confronto em contexto bélico. “Na batalha” é conciso e idiomático.
- source_word: אֶפְשְׂעָה בָהּ
  choice: Eu avançaria contra eles
  rationale: O verbo pode significar dar passos largos, avançar ou atravessar. No contexto de batalha, “avançaria contra” comunica o movimento ofensivo; o plural em português retoma naturalmente o par coletivo.
- source_word: אֲצִיתֶנָּה
  choice: os incendiaria
  rationale: A forma causativa de יצת significa pôr fogo ou incendiar. “Os incendiaria” preserva a ação deliberada e a imagem de destruição pelo fogo.
- source_word: יַחַד
  choice: de uma só vez
  rationale: O advérbio ressalta que a destruição ocorreria conjuntamente, num único ato. “De uma só vez” expressa essa concentração com naturalidade.
theological_decisions:
- issue: A disposição do falante para com a vinha
  choice: A declaração “Não tenho ira” permanece sem objeto explícito, como no hebraico, e é entendida no contexto imediato da vinha protegida por YHWH.
  alternative: Explicitar “não estou irado com a vinha” ou interpretar a frase como negação absoluta de qualquer ira divina.
  rationale: Manter a formulação não qualificada preserva tanto o vínculo contextual com a vinha quanto a tensão teológica do texto, sem acrescentar uma limitação ou uma afirmação universal ausente no original.
- issue: A força de מִי יִתְּנֵנִי
  choice: 'Expressar a frase como desejo desafiador: “Quem me dera enfrentar...!”'
  alternative: 'Traduzir literalmente: “Quem me daria espinheiros e abrolhos na batalha?”'
  rationale: A leitura escolhida comunica a função retórica da expressão no contexto bélico, enquanto a nota preserva a forma literal e sua ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A exclamação marca a força desafiadora da pergunta-desejo; o vocabulário mantém a imagem poética e bélica sem recorrer a formulações excessivamente arcaicas.
