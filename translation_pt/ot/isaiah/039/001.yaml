    text: Mais literalmente, “havia se tornado forte”. Depois de uma doença, a expressão hebraica indica recuperação.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִוא
  choice: Naquele tempo
  rationale: Expressão temporal natural em português, adequada para introduzir o contexto narrativo.
- source_word: שָׁלַח
  choice: enviou
  rationale: Equivalente direto e corrente no contexto de uma missão diplomática.
- source_word: מְרֹדַךְ בַּלְאֲדָן
  choice: Merodaque-Baladã
  rationale: Transliteração portuguesa reconhecível, próxima da forma hebraica e do uso bíblico tradicional em português.
- source_word: בֶּן בַּלְאֲדָן
  choice: filho de Baladã
  rationale: Preserva diretamente a relação filial expressa no hebraico.
- source_word: מֶלֶךְ בָּבֶל
  choice: rei da Babilônia
  rationale: Tradução direta e idiomática do título real.
- source_word: סְפָרִים
  choice: cartas
  rationale: No contexto diplomático, refere-se mais naturalmente a correspondência escrita do que a livros ou documentos genéricos.
- source_word: וּמִנְחָה
  choice: e um presente
  rationale: Aqui מִנְחָה designa um presente diplomático, não uma oferta cultual.
- source_word: אֶל חִזְקִיָּהוּ
  choice: a Ezequias
  rationale: A preposição indica o destinatário das cartas e do presente.
- source_word: וַיִּשְׁמַע
  choice: pois soube
  rationale: Torna explícita, de modo natural, a relação explicativa entre a notícia recebida e o envio da missão.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo daquilo que o rei soube.
- source_word: חָלָה
  choice: tinha estado doente
  rationale: Expressa uma enfermidade anterior ao envio das cartas.
- source_word: וַיֶּחֱזָק
  choice: havia se recuperado
  rationale: Embora o verbo signifique literalmente tornar-se forte, após uma doença seu sentido contextual é recuperar-se.
