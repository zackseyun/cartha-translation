  text: וַ/יִּשְׂמַ֣ח עֲלֵי/הֶם֮ חִזְקִיָּהוּ֒ וַ/יַּרְאֵ֣/ם אֶת בֵּ֣ית נכת/ה אֶת הַ/כֶּסֶף֩ וְ/אֶת הַ/זָּהָ֨ב וְ/אֶת הַ/בְּשָׂמִ֜ים וְ/אֵ֣ת הַ/שֶּׁ֣מֶן הַ/טּ֗וֹב וְ/אֵת֙ כָּל בֵּ֣ית כֵּלָ֔י/ו וְ/אֵ֛ת כָּל אֲשֶׁ֥ר נִמְצָ֖א בְּ/אֹֽצְרֹתָ֑י/ו לֹֽא הָיָ֣ה דָבָ֗ר אֲ֠שֶׁר לֹֽא הֶרְאָ֧/ם חִזְקִיָּ֛הוּ בְּ/בֵית֖/וֹ וּ/בְ/כָל מֶמְשַׁלְתּֽ/וֹ־־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/002.yaml
  text: And Hezekiah was glad because of them[a], and he showed them his treasure house—the silver, the gold, the spices, the fine oil, all his armory, and all that was found in his storehouses[e][d][c][b]. There was nothing in his house or in all his dominion that Hezekiah did not show them.
translation:
  language: pt
  text: 'Ezequias se alegrou por causa deles[a] e lhes mostrou a casa de seus tesouros[b]: a prata, o ouro, as especiarias, o óleo precioso, todo o seu arsenal[c] e tudo o que havia em seus depósitos[d]. Não houve nada em sua casa nem em todos os seus domínios[e] que Ezequias não lhes mostrasse.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se alegrou com eles” ou “ficou satisfeito com eles”. A expressão hebraica pode indicar alegria por causa dos enviados e presentes ou satisfação dirigida a eles.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “a casa de suas coisas preciosas”; tradicionalmente entendida como sua tesouraria ou casa do tesouro.'
    reason: lexical_alternative
  - marker: c
    text: Ou “toda a casa de seus utensílios” ou “todo o seu depósito de equipamentos”. Muitos entendem a expressão como “todo o seu arsenal”, com base no contexto e no paralelo de 2 Reis 20:13.
    reason: alternative_reading
  - marker: d
    text: Ou “tesourarias”.
    reason: lexical_alternative
  - marker: e
    text: Ou “em todo o seu território” ou “em todo o seu reino”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמַח עֲלֵיהֶם
  choice: se alegrou por causa deles
  rationale: A construção שׂמח + עַל pode indicar alegria por causa de alguém ou algo, ou satisfação dirigida a alguém. A formulação preserva o provável valor causal sem excluir totalmente a nuance relacional.
- source_word: וַיַּרְאֵם
  choice: lhes mostrou
  rationale: O hifil de ראה significa normalmente 'fazer ver', isto é, 'mostrar'; esta é a forma portuguesa mais natural no contexto.
- source_word: בֵּית נכתה
  choice: a casa de seus tesouros
  rationale: A expressão designa o lugar onde se guardavam objetos valiosos. A tradução mantém a imagem hebraica de 'casa' e comunica claramente sua função.
- source_word: הַכֶּסֶף
  choice: a prata
  rationale: No inventário dos bens reais, trata-se diretamente do metal precioso, não de dinheiro em sentido genérico.
- source_word: הַזָּהָב
  choice: o ouro
  rationale: Refere-se literalmente ao metal precioso listado entre os bens reais.
- source_word: הַבְּשָׂמִים
  choice: as especiarias
  rationale: O termo abrange substâncias aromáticas; 'especiarias' é corrente e adequado a uma lista de bens valiosos.
- source_word: הַשֶּׁמֶן הַטּוֹב
  choice: o óleo precioso
  rationale: Literalmente 'o óleo bom'; no contexto, o adjetivo indica qualidade e valor. 'Precioso' comunica isso naturalmente sem especificar que fosse necessariamente perfumado.
- source_word: כָּל בֵּית כֵּלָיו
  choice: todo o seu arsenal
  rationale: A expressão é literalmente algo como 'toda a casa de seus utensílios/equipamentos'. No contexto régio e à luz do paralelo de 2 Reis 20:13, 'arsenal' é uma interpretação provável, mas a incerteza é registrada em nota.
- source_word: כָּל אֲשֶׁר נִמְצָא בְּאֹצְרֹתָיו
  choice: tudo o que havia em seus depósitos
  rationale: אֹצָר pode significar depósito ou tesouraria. 'Depósitos' evita repetição com 'casa de seus tesouros' e inclui bens armazenados de várias espécies.
- source_word: לֹא הָיָה דָבָר אֲשֶׁר לֹא הֶרְאָם
  choice: Não houve nada ... que Ezequias não lhes mostrasse
  rationale: A dupla negação hebraica é mantida em uma construção portuguesa natural que enfatiza a totalidade do que foi exibido.
- source_word: בְּבֵיתוֹ
  choice: em sua casa
  rationale: Mantém o sentido literal de בַּיִת. Embora o contexto real permita 'palácio', não é necessário estreitar o termo.
- source_word: וּבְכָל מֶמְשַׁלְתּוֹ
  choice: nem em todos os seus domínios
  rationale: מֶמְשָׁלָה designa a esfera de governo ou autoridade. 'Domínios' preserva essa amplitude e concorda naturalmente com 'todos' em português.
