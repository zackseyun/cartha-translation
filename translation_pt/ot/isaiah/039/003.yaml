base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/003.yaml
  text: Then Isaiah the prophet came to King Hezekiah and said to him, “What did these men say, and where did they come to you from?” And Hezekiah said, “They came to me from a distant land, from Babylon.”
translation:
  language: pt
  text: 'Então o profeta Isaías foi até o rei Ezequias e lhe disse: “O que disseram estes homens, e de onde vieram até você?” E Ezequias disse: “Vieram até mim de uma terra distante, da Babilônia.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא ... אֶל
  choice: foi até
  rationale: Expressa naturalmente em português o movimento de Isaías em direção ao rei, sem tornar explícito se ele entrou em algum recinto.
- source_word: מָה אָמְרוּ
  choice: O que disseram
  rationale: Tradução direta da pergunta hebraica.
- source_word: וּמֵאַיִן יָבֹאוּ אֵלֶיךָ
  choice: e de onde vieram para falar com você?
  rationale: O hebraico diz literalmente que vieram 'a você'. A formulação portuguesa explicita apenas a finalidade contextual do encontro e evita a construção pouco natural 'vieram a você de onde?'.
- source_word: אֶרֶץ רְחוֹקָה
  choice: uma terra distante
  rationale: Mantém a imagem geográfica e a caracterização indefinida do hebraico.
- source_word: בָּבֶל
  choice: Babilônia
  rationale: Forma portuguesa tradicional e amplamente reconhecida do topônimo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O diálogo foi mantido direto e conciso; 'lhe perguntou' evita a repetição menos natural de 'disse-lhe', já que a fala é interrogativa.
