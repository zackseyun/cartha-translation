base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/008.yaml
  text: Then Hezekiah said to Isaiah, “The word of the LORD that you have spoken is good.” For he thought, “There will be peace and stability in my days.”
translation:
  language: pt
  text: 'Então Ezequias disse a Isaías: “É boa a palavra do SENHOR que você falou.” E acrescentou: “Pois haverá paz e estabilidade durante os meus dias.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טוֹב
  choice: boa
  rationale: Mantém o sentido avaliativo direto do hebraico e a formulação digna e natural em português.
- source_word: דְּבַר יְהוָה
  choice: a palavra do SENHOR
  rationale: Reproduz a expressão profética tradicional; SENHOR representa o nome divino יהוה segundo convenção editorial amplamente reconhecida.
- source_word: שָׁלוֹם
  choice: paz
  rationale: É o equivalente contextual mais direto, abrangendo ausência de calamidade e bem-estar.
- source_word: אֱמֶת
  choice: estabilidade
  rationale: Neste par com שָׁלוֹם e no contexto do reinado de Ezequias, o termo aponta para firmeza, segurança ou estabilidade, não apenas verdade proposicional.
- source_word: בְּיָמָי
  choice: durante os meus dias
  rationale: Expressa naturalmente a referência temporal à vida ou ao período de Ezequias.
theological_decisions:
- issue: Natureza da segunda fala de Ezequias
  choice: E acrescentou
  alternative: Pois pensou
  rationale: O texto massorético repete וַיֹּאמֶר, isto é, “e disse”; a tradução mantém a segunda declaração como fala explícita, sem convertê-la em pensamento implícito.
- issue: Avaliação de Ezequias sobre a palavra divina
  choice: É boa a palavra do SENHOR
  alternative: A palavra do SENHOR é justa
  rationale: 'Preserva a ambiguidade e a tensão do simples טוֹב: pode indicar aceitação da justiça da sentença, alívio pessoal ou ambas as coisas, sem explicar sua motivação.'
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem foi levemente naturalizada, mas a repetição hebraica de “disse” foi representada por “acrescentou”, evitando atribuir ao rei um pensamento interior que o texto fonte não explicita.
