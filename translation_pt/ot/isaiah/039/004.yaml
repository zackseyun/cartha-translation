    issue: “Não houve nada que eu não lhes mostrasse”
    rationale: O imperfeito do subjuntivo pode sugerir uma ação habitual, hipotética ou não especificamente anterior. O hebraico הִרְאִיתִים é perfeito e se refere ao que Ezequias efetivamente já mostrou aos visitantes. “Que eu não lhes tivesse mostrado” conserva essa anterioridade e a ação completada.
