  yaml_path: translation/ot/isaiah/039/004.yaml
  text: And he said[a], “What have they seen in your house?” And Hezekiah said, “They have seen everything that is in my house. There was nothing that I did not show them in my treasuries.”
translation:
  language: pt
  text: 'Então ele perguntou: “O que eles viram em sua casa[a]?” E Ezequias respondeu: “Eles viram tudo o que há em minha casa. Não houve nada que eu não lhes tivesse mostrado em meus tesouros.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em seu palácio”. O hebraico diz literalmente “em sua casa”, expressão que, em um contexto real, pode se referir ao palácio.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ele perguntou
  rationale: Embora o verbo seja literalmente “disse”, a fala introduzida é uma pergunta; “perguntou” é natural em português, e “então” representa a progressão narrativa do וַ.
- source_word: מָה רָאוּ
  choice: O que eles viram
  rationale: Traduz diretamente o pronome interrogativo e o verbo no perfeito; o pretérito perfeito é a forma natural em português para a ação concluída nesse diálogo.
- source_word: בְּבֵיתֶךָ
  choice: em sua casa
  rationale: Preserva o sentido básico de בַּיִת, sem excluir a possibilidade contextual de “palácio”, indicada em nota.
- source_word: חִזְקִיָּהוּ
  choice: Ezequias
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: אֵת כָּל אֲשֶׁר בְּבֵיתִי
  choice: tudo o que há em minha casa
  rationale: Expressa a totalidade do hebraico em português idiomático; “há” comunica naturalmente o estado presente do conteúdo da casa.
- source_word: לֹא הָיָה דָבָר
  choice: Não houve nada
  rationale: Equivalente português natural da negação existencial hebraica, mantendo sua ênfase abrangente.
- source_word: הִרְאִיתִים
  choice: eu não lhes mostrasse
  rationale: O hifil de ראה significa “fazer ver”, isto é, “mostrar”; “lhes” representa o sufixo masculino plural referente aos visitantes.
- source_word: בְּאוֹצְרֹתָי
  choice: em meus tesouros
  rationale: אוֹצָר pode designar tanto tesouro quanto depósito ou tesouraria. “Meus tesouros” preserva a ambiguidade entre os bens valiosos e os lugares onde eram guardados, adequada ao contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário internacional. A estrutura dialogal e a repetição de “casa” foram preservadas; a nota mantém a alternativa contextual “palácio” sem inseri-la no texto principal.
