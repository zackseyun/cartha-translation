source:
  edition: WLC
  text: וּ/מִ/בָּנֶ֜י/ךָ אֲשֶׁ֨ר יֵצְא֧וּ מִמְּ/ךָ֛ אֲשֶׁ֥ר תּוֹלִ֖יד יִקָּ֑חוּ וְ/הָיוּ֙ סָרִיסִ֔ים בְּ/הֵיכַ֖ל מֶ֥לֶךְ בָּבֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/007.yaml
  text: And some of your sons who will come from you[a], whom you will father, will be taken, and they will become eunuchs in the palace of the king of Babylon.
translation:
  language: pt
  text: E alguns dos seus filhos, que virão de você, os quais você gerará, serão levados e se tornarão eunucos[a] no palácio do rei da Babilônia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “funcionários da corte”; o termo hebraico pode se referir tanto a eunucos em sentido literal como, em certos contextos, a oficiais reais.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבָּנֶיךָ
  choice: E alguns dos seus filhos
  rationale: A preposição מִן tem sentido partitivo neste contexto; “alguns dos seus filhos” expressa isso naturalmente e preserva o termo específico “filhos”.
- source_word: אֲשֶׁר יֵצְאוּ מִמְּךָ
  choice: que virão de você
  rationale: A expressão indica origem genealógica em Ezequias. “Virão de você” mantém a imagem hebraica de proceder dele sem recorrer ao pouco corrente “procederão”.
- source_word: אֲשֶׁר תּוֹלִיד
  choice: os quais você gerará
  rationale: O Hifil de ילד, com sujeito masculino, significa gerar filhos. “Gerará” é preciso, digno e compreensível em português atual.
- source_word: יִקָּחוּ
  choice: serão levados
  rationale: Embora o verbo hebraico esteja na voz ativa com sujeito indefinido, a passiva é a forma natural em português e comunica o sentido de captura ou deportação.
- source_word: וְהָיוּ
  choice: e se tornarão
  rationale: Com o predicativo seguinte, היה pode indicar mudança de condição; “se tornarão” preserva essa transição contextual.
- source_word: סָרִיסִים
  choice: eunucos
  rationale: “Eunucos” é o sentido primário e historicamente reconhecido neste contexto, embora o termo também possa designar funcionários da corte; essa alternativa é preservada em nota.
- source_word: בְּהֵיכַל
  choice: no palácio
  rationale: Com “rei da Babilônia”, הֵיכָל designa claramente o palácio real, e não um templo.
- source_word: מֶלֶךְ בָּבֶל
  choice: rei da Babilônia
  rationale: Expressa diretamente e de modo idiomático a relação construta hebraica.
theological_decisions:
- issue: Sentido de סָרִיסִים na profecia sobre a corte real
  choice: eunucos no texto principal
  alternative: funcionários da corte
  rationale: O termo hebraico pode indicar eunucos em sentido literal ou, por extensão, funcionários reais. O sentido literal é mantido no texto por ser o mais direto neste contexto, enquanto a nota conserva a alternativa lexical e evita eliminar a ambiguidade legítima.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva a repetição genealógica do hebraico sem usar linguagem arcaica; o marcador de nota foi colocado imediatamente após “eunucos”, termo ao qual a alternativa lexical se refere.
