id: ISA.39.5
reference: Isaiah 39:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְשַׁעְיָ֖הוּ אֶל חִזְקִיָּ֑הוּ שְׁמַ֖ע דְּבַר יְהוָ֥ה צְבָאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/005.yaml
  text: Then Isaiah said to Hezekiah[b][a], “Hear the word of Yahweh of Hosts.”
translation:
  language: pt
  text: 'Então Isaías disse a Ezequias: “Ouça a palavra de Yahweh[a] dos Exércitos[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido por “o SENHOR”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “das Hostes”. O título hebraico apresenta Yahweh como soberano sobre os exércitos ou forças celestiais e terrenas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa com naturalidade a sequência dos acontecimentos.
- source_word: יְשַׁעְיָהוּ
  choice: Isaías
  rationale: Forma tradicional e amplamente reconhecida do nome do profeta em português.
- source_word: אֶל חִזְקִיָּהוּ
  choice: a Ezequias
  rationale: A preposição marca o destinatário da fala; “Ezequias” é a forma tradicional do nome em português.
- source_word: שְׁמַע
  choice: Ouça
  rationale: Imperativo masculino singular. “Ouça” conserva a força direta da ordem profética em português atual.
- source_word: דְּבַר
  choice: a palavra
  rationale: Na fórmula profética, דָּבָר designa a mensagem pronunciada por Deus; “a palavra” preserva esse uso bíblico estabelecido.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo silenciosamente por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: No título divino, o plural indica os exércitos ou hostes sob o governo de Yahweh, podendo abranger forças celestiais e terrenas.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome próprio divino. A transliteração o preserva, enquanto a nota registra a substituição tradicional sem confundir nome e título.
- issue: Tradução do título יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  alternative: Yahweh das Hostes
  rationale: “Dos Exércitos” é claro e corrente em português, enquanto “hostes” é uma alternativa tradicional; a nota preserva a amplitude da expressão hebraica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A construção é direta e mantém a fórmula profética e o imperativo singular do hebraico.
