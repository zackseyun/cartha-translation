source:
  edition: WLC
  text: הִנֵּה֮ יָמִ֣ים בָּאִים֒ וְ/נִשָּׂ֣א כָּל אֲשֶׁ֣ר בְּ/בֵיתֶ֗/ךָ וַ/אֲשֶׁ֨ר אָצְר֧וּ אֲבֹתֶ֛י/ךָ עַד הַ/יּ֥וֹם הַ/זֶּ֖ה בָּבֶ֑ל לֹֽא יִוָּתֵ֥ר דָּבָ֖ר אָמַ֥ר יְהוָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/006.yaml
  text: Look[a], days are coming when all that is in your house, and what your fathers have stored up until this day, will be carried to Babylon; not a thing will be left, says Yahweh.
translation:
  language: pt
  text: Eis que vêm dias em que tudo o que há em sua casa, e o que seus antepassados[a] armazenaram até o dia de hoje, será levado para a Babilônia. Não restará coisa alguma, diz Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, "seus pais".
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Vejam
  rationale: Introduz com solenidade o anúncio profético e preserva a força de chamar a atenção em português atual.
- source_word: יָמִים בָּאִים
  choice: vêm dias
  rationale: Reproduz de modo natural a expressão profética e a construção participial hebraica.
- source_word: וְנִשָּׂא
  choice: será levado
  rationale: O nifal é passivo e, no contexto, indica a remoção dos bens para a Babilônia.
- source_word: כָּל אֲשֶׁר בְּבֵיתֶךָ
  choice: tudo o que há em seu palácio
  rationale: Embora בַּיִת signifique literalmente 'casa', aqui se dirige ao rei e designa sua residência e seus depósitos; 'palácio' torna claro o referente contextual sem reduzir a totalidade.
- source_word: וַאֲשֶׁר אָצְרוּ אֲבֹתֶיךָ
  choice: e tudo o que seus antepassados acumularam
  rationale: אָצַר indica armazenar ou entesourar; 'acumularam' comunica naturalmente a formação histórica das reservas. אֲבוֹת, neste contexto dinástico, abrange os predecessores ancestrais.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até hoje
  rationale: Forma corrente em português para a acumulação que se estende até o momento presente.
- source_word: בָּבֶל
  choice: a Babilônia
  rationale: Forma consagrada do topônimo em português, com artigo conforme o uso natural.
- source_word: לֹא יִוָּתֵר דָּבָר
  choice: Não restará coisa alguma
  rationale: Preserva a negação absoluta e a ênfase na perda total.
- source_word: אָמַר יְהוָה
  choice: diz Yahweh
  rationale: O presente mantém a vivacidade da fórmula profética; o nome divino é transliterado como Yahweh.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: o SENHOR
  rationale: O texto traz diretamente o Tetragrama; 'Yahweh' preserva o caráter de nome próprio sem substituir por um título.
- issue: Alcance de אֲבֹתֶיךָ
  choice: seus antepassados
  alternative: seus pais
  rationale: No contexto da riqueza régia acumulada ao longo de gerações, o termo se refere aos predecessores ancestrais. 'Antepassados' evita que o leitor moderno o restrinja ao pai imediato, embora o hebraico seja literalmente 'pais'.
- issue: Sentido contextual de בְּבֵיתֶךָ
  choice: em seu palácio
  alternative: em sua casa
  rationale: A fala é dirigida ao rei Ezequias, e o contexto imediato trata da casa real e de seus tesouros. 'Palácio' explicita esse referente provável; 'casa' permanece uma tradução formal possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A abertura no plural ('Vejam') funciona como fórmula pública de atenção, enquanto os possessivos mantêm o tratamento respeitoso dirigido ao rei.
