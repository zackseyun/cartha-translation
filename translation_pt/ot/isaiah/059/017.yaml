id: ISA.59.17
reference: Isaiah 59:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּלְבַּ֤שׁ צְדָקָה֙ כַּ/שִּׁרְיָ֔ן וְ/כ֥וֹבַע יְשׁוּעָ֖ה בְּ/רֹאשׁ֑/וֹ וַ/יִּלְבַּ֞שׁ בִּגְדֵ֤י נָקָם֙ תִּלְבֹּ֔שֶׁת וַ/יַּ֥עַט כַּ/מְעִ֖יל קִנְאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/017.yaml
  text: He put on righteousness like a breastplate[a], and a helmet of salvation on his head; he put on garments of vengeance for clothing[c][b], and wrapped himself in zeal as in a cloak.
translation:
  language: pt
  text: Vestiu a justiça como uma couraça[a] e pôs na cabeça o capacete da salvação[b]; vestiu roupas de vingança como traje e envolveu-se em zelo como em um manto[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “armadura para o torso”. O termo hebraico designa uma proteção usada sobre o tronco.
    reason: lexical_alternative
  - marker: b
    text: Ou “livramento” ou “vitória”.
    reason: lexical_alternative
  - marker: c
    text: Ou “ciúme”, no sentido de ardor intenso e comprometido.
    reason: lexical_alternative
lexical_decisions:
- source_word: צְדָקָה
  choice: justiça
  rationale: Neste contexto, a qualidade moral de Deus se manifesta em sua intervenção reta e judicial. “Justiça” é natural em português e preserva tanto a retidão quanto sua expressão ativa.
- source_word: שִׁרְיָן
  choice: couraça
  rationale: Designa uma armadura para o torso. “Couraça” conserva com precisão a imagem militar e o registro elevado do texto.
- source_word: כּוֹבַע
  choice: capacete
  rationale: Equivalente corrente para a proteção da cabeça no contexto bélico.
- source_word: יְשׁוּעָה
  choice: salvação
  rationale: O substantivo pode indicar salvação, livramento ou vitória. “Salvação” preserva sua amplitude e se ajusta ao contexto da intervenção salvadora de Deus, sem excluir a nuance militar de vitória.
- source_word: בִּגְדֵי נָקָם
  choice: roupas de vingança
  rationale: Mantém a metáfora concreta do vestuário e a força da retribuição divina, sem atenuar a imagem.
- source_word: תִּלְבֹּשֶׁת
  choice: como traje
  rationale: O substantivo designa vestimenta ou traje e reforça, de modo quase apositivo, a imagem de vestir roupas de vingança.
- source_word: וַיַּעַט
  choice: envolveu-se em
  rationale: Expressa a ação de cobrir ou envolver a si mesmo e combina naturalmente com a imagem do manto.
- source_word: מְעִיל
  choice: manto
  rationale: Designa uma veste exterior. “Manto” é claro, digno e adequado à comparação.
- source_word: קִנְאָה
  choice: zelo
  rationale: Aqui indica ardor intenso e comprometido na ação divina. “Zelo” comunica melhor essa força positiva, enquanto “ciúme” permanece uma possibilidade lexical.
theological_decisions:
- issue: Imagem do Senhor como guerreiro divino
  choice: Manter literalmente as imagens de armadura e vestes, apresentando-o revestido de justiça, salvação, vingança e zelo.
  alternative: Converter as imagens concretas em uma descrição abstrata das qualidades ou ações divinas.
  rationale: O hebraico retrata a intervenção ativa de Deus por meio de linguagem militar. Preservar essa linguagem mantém sua força teológica e a tensão entre salvação e vingança, sem alegorizar nem suavizar o texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição ligada ao ato de vestir foi preservada, assim como a imagem marcial concreta e o paralelismo do hebraico.
