  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עַל כֵּ֗ן רָחַ֤ק מִשְׁפָּט֙ מִמֶּ֔/נּוּ וְ/לֹ֥א תַשִּׂיגֵ֖/נוּ צְדָקָ֑ה נְקַוֶּ֤ה לָ/אוֹר֙ וְ/הִנֵּה חֹ֔שֶׁךְ לִ/נְגֹה֖וֹת בָּ/אֲפֵל֥וֹת נְהַלֵּֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/009.yaml
  text: Therefore justice is far from us[a], and righteousness does not overtake us; we hope for light, but look—darkness; for brightness[c][b], but we walk in deep gloom.
translation:
  language: pt
  text: Por isso, a justiça está longe de nós[a], e a retidão não nos alcança[b]. Esperamos pela luz, mas eis que há trevas; esperamos claridade, mas caminhamos em profunda escuridão[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o juízo está longe de nós”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a justiça não chega até nós”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “em densas trevas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפָּט
  choice: justiça
  rationale: Neste lamento profético, o termo designa a ordem justa e a aplicação do direito que estão ausentes da comunidade; “justiça” é natural em português, enquanto “juízo” permanece como alternativa legítima.
- source_word: רָחַק
  choice: está longe de
  rationale: O perfeito hebraico descreve um estado presente; esta formulação comunica a distância de modo claro e idiomático.
- source_word: צְדָקָה
  choice: retidão
  rationale: “Retidão” distingue צְדָקָה de מִשְׁפָּט, já traduzido por “justiça”, e preserva a dimensão moral do termo sem apagar a sobreposição semântica entre ambos.
- source_word: תַשִּׂיגֵנוּ
  choice: não nos alcança
  rationale: O verbo pode indicar alcançar ou apanhar alguém. Em português, “alcançar” conserva a imagem de algo que não chega até o povo e soa mais natural do que uma formulação excessivamente mecânica.
- source_word: נְקַוֶּה
  choice: esperamos
  rationale: קוה reúne as ideias de esperar e ter esperança. No contexto, “esperamos” permite que ambas permaneçam presentes.
- source_word: אוֹר
  choice: luz
  rationale: Equivalente direto que preserva tanto a imagem concreta quanto sua força metafórica de livramento e bem-estar.
- source_word: וְהִנֵּה
  choice: mas eis que há
  rationale: “Eis que” preserva a força apresentativa da partícula hebraica; “mas” explicita o contraste poético entre a expectativa e a realidade.
- source_word: חֹשֶׁךְ
  choice: trevas
  rationale: Termo corrente e digno que mantém a imagem física e a conotação de aflição.
- source_word: נְגֹהוֹת
  choice: claridade
  rationale: Expressa naturalmente o brilho luminoso em contraste com a escuridão; o plural hebraico tem valor intensivo e não precisa ser reproduzido como plural em português.
- source_word: אֲפֵלוֹת
  choice: profunda escuridão
  rationale: A expressão comunica uma escuridão intensa, mais forte que a simples ausência de luz, e preserva o peso metafórico do original.
- source_word: נְהַלֵּךְ
  choice: caminhamos
  rationale: Mantém a metáfora hebraica do caminhar como condição vivida ou curso de vida.
theological_decisions:
- issue: Relação entre מִשְׁפָּט e צְדָקָה
  choice: Traduzir respectivamente por “justiça” e “retidão”
  alternative: “juízo” e “justiça”, ou “justiça” para ambos
  rationale: A distinção lexical preserva o paralelismo e a tensão entre a ordem jurídico-social e a conduta moralmente reta, sem reduzir os dois conceitos a um único termo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Eis que” foi mantido por sua força apresentativa e por ainda ser reconhecível no registro bíblico, enquanto o restante da sintaxe permanece atual e natural.
