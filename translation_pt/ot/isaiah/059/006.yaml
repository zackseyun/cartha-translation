  text: קֽוּרֵי/הֶם֙ לֹא יִהְי֣וּ לְ/בֶ֔גֶד וְ/לֹ֥א יִתְכַּסּ֖וּ בְּ/מַֽעֲשֵׂי/הֶ֑ם מַֽעֲשֵׂי/הֶם֙ מַֽעֲשֵׂי אָ֔וֶן וּ/פֹ֥עַל חָמָ֖ס בְּ/כַפֵּי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/006.yaml
  text: Their webs will not become clothing[a], nor will they cover themselves with their deeds; their deeds are deeds of wickedness[b], and the work of violence is in their hands.
translation:
  language: pt
  text: Suas teias não servirão de roupa[a], nem eles se cobrirão com suas obras; suas obras são obras de perversidade[b], e a obra de violência está em suas mãos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “suas teias de aranha”. O termo hebraico se refere ao que é tecido ou fiado; “teias” preserva a metáfora sem especificá-la além do necessário.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “obras de iniquidade”. O hebraico também pode ser entendido como “obras de maldade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּרֵיהֶם
  choice: suas teias
  rationale: O substantivo designa algo tecido ou fiado. No contexto imediato da teia de aranha em Isaías 59:5, “teias” preserva a metáfora e se liga naturalmente à imagem da roupa, sem explicitar mais do que este termo hebraico.
- source_word: לְבֶגֶד
  choice: de roupa
  rationale: בֶּגֶד significa roupa ou veste. Com o verbo היה e a preposição ל, “servirão de roupa” expressa naturalmente a ideia de função ou resultado.
- source_word: יִתְכַּסּוּ
  choice: eles se cobrirão
  rationale: A forma hitpael é reflexiva. “Se cobrirão” conserva tanto a gramática quanto a imagem concreta do texto.
- source_word: בְּמַעֲשֵׂיהֶם / מַעֲשֵׂיהֶם
  choice: com suas obras / suas obras
  rationale: “Obras” traduz de modo claro מַעֲשֶׂה e permite conservar sua repetição enfática no hebraico.
- source_word: מַעֲשֵׂי אָוֶן
  choice: obras de perversidade
  rationale: אָוֶן pode indicar perversidade, iniquidade, maldade ou dano. “Perversidade” comunica a força moral do contexto sem restringir indevidamente a amplitude do termo.
- source_word: וּפֹעַל חָמָס
  choice: e atos de violência
  rationale: פֹעַל pode designar ação, obra ou resultado, enquanto חָמָס denota violência ou injustiça. O plural idiomático “atos de violência” torna a acusação natural em português, embora o hebraico apresente uma construção singular; isso é registrado em nota.
- source_word: בְּכַפֵּיהֶם
  choice: estão em suas mãos
  rationale: כַּף refere-se literalmente à palma da mão. “Em suas mãos” é a expressão portuguesa natural e preserva a ideia de ação e culpabilidade.
theological_decisions:
- issue: Força metafórica da cobertura inadequada
  choice: Manter as imagens concretas de teias, roupa e cobertura, deixando que a implicação moral surja do contexto.
  alternative: Parafrasear como incapacidade de ocultar a culpa por meio de obras más.
  rationale: O hebraico apresenta uma metáfora material vívida, sem explicá-la diretamente. Preservá-la evita introduzir uma interpretação teológica além do que o verso afirma.
- issue: Sentido de אָוֶן
  choice: perversidade
  alternative: iniquidade
  rationale: Ambas são possíveis. “Perversidade” é corrente e inteligível, mantendo a condenação moral sem recorrer a vocabulário excessivamente eclesiástico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “obras” reproduz a ênfase hebraica. “Servirão de roupa” é mais idiomático do que “se tornarão roupa”. A oração final usa “atos de violência” por naturalidade, mantendo em nota editorial implícita a atenção ao singular hebraico.
