source:
  edition: WLC
  text: פָּשֹׁ֤עַ וְ/כַחֵשׁ֙ בַּֽ/יהוָ֔ה וְ/נָס֖וֹג מֵ/אַחַ֣ר אֱלֹהֵ֑י/נוּ דַּבֶּר עֹ֣שֶׁק וְ/סָרָ֔ה הֹר֧וֹ וְ/הֹג֛וֹ מִ/לֵּ֖ב דִּבְרֵי שָֽׁקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/013.yaml
  text: transgressing and denying Yahweh[a], and turning back from following our God, speaking oppression and revolt[b], conceiving and uttering from the heart words of falsehood.
translation:
  language: pt
  text: transgredindo e negando Yahweh, deixando de seguir o nosso Deus, proferindo opressão e rebelião[a], concebendo e proferindo palavras de falsidade que vêm do coração[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “opressão e apostasia” ou “opressão e revolta”; o termo hebraico pode indicar desvio, rebelião ou abandono da fidelidade.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “do coração”, indicando que as palavras falsas procedem da intenção interior, e não apenas dos lábios.'
    reason: cultural_note
lexical_decisions:
- source_word: פָּשֹׁעַ
  choice: transgredindo
  rationale: Preserva a força verbal do infinitivo hebraico e expressa violação moral e rebeldia sem restringir o sentido a uma revolta política.
- source_word: וְכַחֵשׁ בַּיהוָה
  choice: e negando Yahweh
  rationale: כחש com ב pode indicar negar, agir falsamente ou ser desleal para com alguém; “negando” comunica com clareza a repudiação de Yahweh, sem eliminar totalmente a ideia de falsidade.
- source_word: בַּיהוָה
  choice: Yahweh
  rationale: Translitera o nome divino יהוה, preservando sua função como nome próprio da aliança.
- source_word: וְנָסוֹג מֵאַחַר אֱלֹהֵינוּ
  choice: deixando de seguir o nosso Deus
  rationale: Expressa naturalmente o idioma hebraico de recuar “de trás de” alguém, isto é, abandonar seu seguimento.
- source_word: דַּבֶּר עֹשֶׁק וְסָרָה
  choice: falando de opressão e rebelião
  rationale: “Opressão” mantém o campo de injustiça e exploração de עֹשֶׁק; “rebelião” traduz a insubordinação ou desvio de סָרָה sem impor o sentido religioso mais estreito de “apostasia”.
- source_word: הֹרוֹ וְהֹגוֹ
  choice: concebendo e proferindo
  rationale: Reproduz o movimento da formação interior para a expressão exterior sugerido pelos dois verbos.
- source_word: מִלֵּב
  choice: de coração
  rationale: Mantém o coração como fonte interior e intencional da fala falsa, em formulação idiomática portuguesa.
- source_word: דִּבְרֵי שָׁקֶר
  choice: palavras de falsidade
  rationale: Conserva a estrutura do sintagma hebraico e seu sentido de palavras caracterizadas por mentira e engano.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” o apresenta como nome próprio e evita substituir o nome por um título.
- issue: Grau de especificidade religiosa de וְסָרָה
  choice: rebelião
  alternative: apostasia; revolta
  rationale: O contexto é de infidelidade a Deus, mas o substantivo também admite um sentido mais amplo de desvio ou insubordinação. “Rebelião” preserva a gravidade teológica sem estreitar o termo a uma categoria eclesiástica.
- issue: Relação de מִלֵּב com os verbos finais
  choice: de coração, ligado à concepção e à expressão das palavras
  alternative: ligado apenas ao ato de proferir
  rationale: A posição hebraica permite perceber o coração como origem de todo o processo, desde a formação interior até a fala; a tradução conserva essa abrangência sem acrescentar uma explicação ao corpo do versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os gerúndios preservam a forma enumerativa do contexto. “Deixando de seguir” torna natural o idioma hebraico sem perder a imagem de abandono, e “palavras de falsidade” mantém uma leve solenidade bíblica.
