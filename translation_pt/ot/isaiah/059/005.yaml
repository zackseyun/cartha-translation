base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/005.yaml
  text: They hatch viper's eggs and weave spider's webs[a]; whoever eats from their eggs dies[b], and what is crushed breaks open into a viper.
translation:
  language: pt
  text: Chocam ovos de víbora e tecem teias de aranha[a]; quem come dos ovos deles morre, e o que é esmagado se rompe, e dele sai uma víbora[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ovos de uma cobra venenosa”; o termo hebraico designa uma serpente peçonhenta, sem permitir identificação zoológica segura.
    reason: lexical_alternative
  - marker: b
    text: O hebraico é difícil. Mais literalmente, “o que é esmagado se rompe, [uma] víbora”; a imagem provavelmente é a de um ovo que, ao ser esmagado, se abre e deixa sair uma serpente venenosa.
    reason: textual_or_lexical_difficulty
lexical_decisions:
- source_word: בֵּיצֵי צִפְעוֹנִי
  choice: ovos de víbora
  rationale: A expressão em construto designa ovos de uma serpente venenosa. “Víbora” é corrente, clara e preserva a imagem concreta de perigo.
- source_word: בִּקֵּעוּ
  choice: chocam
  rationale: O verbo significa literalmente partir ou abrir; aplicado a ovos, “chocar” expressa de modo natural a ação de fazê-los eclodir.
- source_word: קוּרֵי עַכָּבִישׁ
  choice: teias de aranha
  rationale: A expressão refere-se aos fios ou à trama produzida pela aranha; “teias de aranha” é a formulação portuguesa mais natural.
- source_word: יֶאֱרֹגוּ
  choice: tecem
  rationale: Mantém o sentido comum do verbo e o paralelismo poético, além de combinar naturalmente com “teias”.
- source_word: הָאֹכֵל מִבֵּיצֵיהֶם
  choice: quem come dos ovos deles
  rationale: O particípio com artigo tem valor genérico. “Quem” comunica isso com naturalidade, e “dos” representa a preposição מִן sem eliminar a referência pronominal ambígua.
- source_word: יָמוּת
  choice: morre
  rationale: O presente exprime a certeza proverbial da consequência e preserva a vivacidade poética.
- source_word: וְהַזּוּרֶה
  choice: e o ovo esmagado
  rationale: A forma é lexicalmente difícil, mas no contexto imediato parece indicar aquilo que é esmagado ou pressionado. A explicitação de “ovo” torna a imagem inteligível sem alterar o referente contextual.
- source_word: תִּבָּקַע
  choice: se rompe, deixando sair
  rationale: O verbo descreve algo que se abre ou rompe. A formulação preserva essa ação e torna explícito em português o resultado elíptico expresso pela serpente que surge.
- source_word: אֶפְעֶה
  choice: uma víbora
  rationale: Designa uma serpente venenosa. “Víbora” é uma equivalência moderna clara; a repetição reforça a coerência da imagem, sem alegar certeza quanto à espécie zoológica.
