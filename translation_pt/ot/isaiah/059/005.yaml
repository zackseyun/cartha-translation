translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o paralelismo poético e a imagem concreta. “Deles” preserva a referência gramatical aos malfeitores implícitos no contexto, enquanto “o ovo” é explicitado apenas onde o português exige maior clareza.
