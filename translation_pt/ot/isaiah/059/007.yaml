base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/007.yaml
  text: Their feet run to evil[a], and they hurry to shed innocent blood; their thoughts are thoughts of iniquity[b]; devastation and destruction are in their highways.
translation:
  language: pt
  text: Os pés deles correm para o mal, e eles se apressam a derramar sangue inocente; seus pensamentos[a] são pensamentos de perversidade; devastação e destruição estão em suas estradas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus planos são planos de iniquidade”; a palavra hebraica pode indicar pensamentos, planos ou maquinações.
    reason: lexical_alternative
  - marker: b
    text: Ou “em seus caminhos”; o termo hebraico se refere literalmente a estradas ou vias e, aqui, também pode sugerir o rumo da conduta deles.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלֵיהֶם
  choice: os pés deles
  rationale: Preserva a imagem corporal concreta e a metonímia hebraica para a conduta.
- source_word: לָרַע יָרֻצוּ
  choice: correm para o mal
  rationale: Mantém tanto o movimento vívido de יָרֻצוּ quanto a direção moral expressa por לָרַע, sem acrescentar explicitamente 'fazer'.
- source_word: וִימַהֲרוּ לִשְׁפֹּךְ דָּם נָקִי
  choice: e eles se apressam a derramar sangue inocente
  rationale: Reproduz o segundo verbo de rapidez e emprega a expressão portuguesa consagrada para violência contra inocentes.
- source_word: מַחְשְׁבוֹתֵיהֶם מַחְשְׁבוֹת אָוֶן
  choice: seus pensamentos são pensamentos de perversidade
  rationale: Conserva a repetição retórica de מַחְשְׁבוֹת e traduz אָוֶן por um termo moral amplo, sem eliminar a possibilidade de planos ou maquinações.
- source_word: שֹׁד וָשֶׁבֶר
  choice: devastação e destruição
  rationale: Mantém o par poético de termos próximos que descrevem os efeitos arrasadores da conduta.
- source_word: בִּמְסִלּוֹתָם
  choice: em suas estradas
  rationale: Preserva a imagem concreta de vias ou estradas, que também pode sugerir metaforicamente o curso da conduta.
theological_decisions:
- issue: Caracterização moral de אָוֶן
  choice: perversidade
  alternative: iniquidade; maldade; desgraça
  rationale: O contexto de violência culpável favorece o sentido moral, mas 'perversidade' evita impor uma formulação doutrinária específica.
- issue: Sentido metafórico de מְסִלּוֹת
  choice: estradas
  alternative: caminhos; conduta
  rationale: A tradução mantém a metáfora concreta do hebraico em vez de explicá-la diretamente como comportamento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A sintaxe paralela e as imagens concretas do hebraico foram preservadas sempre que soam naturais.
