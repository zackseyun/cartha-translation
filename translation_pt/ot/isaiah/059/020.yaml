  text: וּ/בָ֤א לְ/צִיּוֹן֙ גּוֹאֵ֔ל וּ/לְ/שָׁבֵ֥י פֶ֖שַׁע בְּ/יַֽעֲקֹ֑ב נְאֻ֖ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/020.yaml
  text: And a Redeemer will come to Zion[a], and to those in Jacob who turn from transgression[d][c][b], declares Yahweh.
translation:
  language: pt
  text: E um Redentor virá a Sião[a], aos que, em Jacó, se afastam da transgressão[c][d], declara o SENHOR.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «para Sião»; a preposição hebraica pode ter esse sentido, embora «a Sião» se ajuste mais naturalmente ao verbo «vir» neste contexto.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: YHWH, tradicionalmente traduzido por «o SENHOR».'
    reason: divine_name
  - marker: c
    text: Ou «aos arrependidos em Jacó» ou «aos que, em Jacó, abandonam a rebelião».
    reason: alternative_reading
  - marker: d
    text: Paulo cita este versículo em Romanos 11:26, com redação parcialmente diferente sob influência da tradição grega.
    reason: cross_reference
lexical_decisions:
- source_word: וּבָא
  choice: E ... virá
  rationale: O perfeito qal com a conjunção, em discurso profético, tem sentido futuro; «virá» expressa isso naturalmente em português.
- source_word: לְצִיּוֹן
  choice: a Sião
  rationale: Com o verbo «vir», a preposição ל é mais naturalmente direcional, indicando o destino.
- source_word: גּוֹאֵל
  choice: um Redentor
  rationale: גֹּאֵל designa quem resgata ou reivindica, por vezes com conotações de parentesco e aliança. «Redentor» conserva o peso do termo sem explicitar uma identidade que o versículo não declara.
- source_word: וּלְשָׁבֵי פֶשַׁע
  choice: aos que ... se afastam da transgressão
  rationale: O particípio de שוב, construído com פשע, descreve pessoas que mudam de direção moral, afastando-se da transgressão; a formulação verbal preserva essa força sem impor terminologia teológica mais técnica.
- source_word: פֶשַׁע
  choice: transgressão
  rationale: פשע pode indicar transgressão ou rebelião contra a autoridade legítima; «transgressão» é claro e mantém a gravidade moral do termo.
- source_word: בְּיַעֲקֹב
  choice: em Jacó
  rationale: A preposição ב indica esfera ou localização entre o povo da aliança. A expressão hebraica é preservada sem substituir «Jacó» por «Israel».
- source_word: נְאֻם יְהוָה
  choice: declara o SENHOR
  rationale: É uma fórmula profética de declaração solene. «SENHOR» segue a convenção portuguesa para o nome divino יהוה.
theological_decisions:
- issue: Identidade e alcance do Redentor
  choice: «um Redentor», sem identificar explicitamente a figura no texto principal
  alternative: Entendê-lo expressamente como figura messiânica ou como o próprio SENHOR agindo como Redentor
  rationale: O texto hebraico chama a figura apenas de גֹּאֵל. A tradução preserva essa abertura, embora o versículo receba aplicação posterior no Novo Testamento.
- issue: Sentido de שָׁבֵי פֶשַׁע
  choice: «os que ... se afastam da transgressão»
  alternative: «os arrependidos em Jacó» ou «os que voltam da rebelião»
  rationale: A expressão indica uma mudança moral em relação à transgressão. A tradução verbal conserva a nuance do particípio e evita sistematizar além do que o texto diz.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A ordem foi levemente ajustada para evitar ambiguidade sintática, mantendo «Jacó» e «Redentor» como termos fortes do original. Todos os marcadores remetem a notas presentes.
