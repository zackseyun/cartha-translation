base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/010.yaml
  text: We grope for the wall like the blind; like those without eyes we grope[a]. We stumble at noon as in the twilight; among the vigorous we are like the dead.
translation:
  language: pt
  text: Tateamos a parede como cegos; como quem não tem olhos, tateamos. Tropeçamos ao meio-dia como no crepúsculo; entre os vigorosos[a], somos como mortos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “em lugares férteis” ou “entre os robustos”; o termo hebraico é raro e de sentido incerto.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְגַשְׁשָׁה / נְגַשֵּׁשָׁה
  choice: tateamos
  rationale: O piel de גשש descreve procurar ou orientar-se pelo tato, especialmente na imagem de uma pessoa cega. “Tateamos” é conciso, natural e permite conservar a repetição do hebraico.
- source_word: כַעִוְרִים
  choice: como cegos
  rationale: Reproduz diretamente o adjetivo plural substantivado e mantém a comparação coletiva sem acrescentar um substantivo marcado por gênero.
- source_word: קִיר
  choice: a parede
  rationale: No contexto, trata-se da parede que é apalpada como guia; o artigo definido torna a imagem natural em português.
- source_word: וּכְאֵין עֵינַיִם
  choice: como quem não tem olhos
  rationale: Mantém a força comparativa e intensifica a imagem da cegueira em português corrente, sem transformá-la numa explicação.
- source_word: כָּשַׁלְנוּ
  choice: tropeçamos
  rationale: כשל expressa tropeçar ou vacilar. “Tropeçamos” preserva o movimento corporal ligado à imagem anterior.
- source_word: בַצָּהֳרַיִם
  choice: ao meio-dia
  rationale: Designa a parte mais clara do dia e conserva o contraste incisivo com o crepúsculo.
- source_word: כַּנֶּשֶׁף
  choice: como no crepúsculo
  rationale: נשף pode indicar o período de luz fraca, sobretudo ao entardecer. “Crepúsculo” preserva essa relativa amplitude sem especificar mais do que o contexto permite.
- source_word: בָּאַשְׁמַנִּים
  choice: entre os vigorosos
  rationale: O termo é raro e incerto. A leitura referente a pessoas robustas ou vigorosas produz um contraste coerente entre os vivos cheios de vigor e os que são “como mortos”; a incerteza lexical é indicada em nota.
- source_word: כַּמֵּתִים
  choice: como mortos
  rationale: Mantém de forma concisa a comparação coletiva, forte e sem atenuação.
