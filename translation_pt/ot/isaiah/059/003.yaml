  terminology: “Contaminadas”, “iniquidade”, “falsidade” e “injustiça” distinguem adequadamente os termos morais hebraicos e conservam o registro profético sem impor formulações doutrinárias posteriores. As notas são pertinentes, fiéis ao valor lexical e estão ancoradas nos elementos corretos.
