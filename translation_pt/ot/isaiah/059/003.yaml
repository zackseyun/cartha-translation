  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֤י כַפֵּי/כֶם֙ נְגֹאֲל֣וּ בַ/דָּ֔ם וְ/אֶצְבְּעוֹתֵי/כֶ֖ם בֶּֽ/עָוֺ֑ן שִׂפְתֽוֹתֵי/כֶם֙ דִּבְּרוּ שֶׁ֔קֶר לְשׁוֹנְ/כֶ֖ם עַוְלָ֥ה תֶהְגֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/003.yaml
  text: For your hands are defiled with blood[a], and your fingers with iniquity; your lips have spoken falsehood[c][b], your tongue mutters injustice.
translation:
  language: pt
  text: Pois as mãos de vocês[a] foram contaminadas de sangue[b], e os seus dedos, de iniquidade; os seus lábios falaram falsidade, e a sua língua murmura injustiça.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “as palmas das mãos de vocês”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “foram manchadas de sangue”. O verbo hebraico indica contaminação ou profanação, não apenas mudança de cor.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “profere injustiça”. O verbo hebraico pode significar murmurar, falar em voz baixa ou, de modo mais geral, proferir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da acusação precedente e preserva de modo natural a força causal no fluxo do discurso.
- source_word: כַפֵּיכֶם
  choice: as mãos de vocês
  rationale: Embora o substantivo designe mais especificamente as palmas, “mãos” é a expressão natural em português para a imagem de culpa de sangue; a precisão lexical é registrada em nota.
- source_word: נְגֹאֲלוּ
  choice: foram contaminadas
  rationale: Expressa profanação ou poluição moral, não apenas uma mancha física, e mantém o aspecto verbal da forma hebraica.
- source_word: בַדָּם
  choice: de sangue
  rationale: Construção idiomática em português que identifica o sangue como aquilo que contamina as mãos e evoca culpa por derramamento de sangue.
- source_word: וְאֶצְבְּעוֹתֵיכֶם
  choice: e os seus dedos
  rationale: Preserva a imagem corporal concreta e o paralelismo poético com as mãos.
- source_word: בֶּעָוֹן
  choice: de iniquidade
  rationale: Mantém o peso ético de עָוֹן e seu paralelo com o sangue, sem reduzi-lo apenas à consequência jurídica de culpa.
- source_word: שִׂפְתוֹתֵיכֶם דִּבְּרוּ שֶׁקֶר
  choice: os seus lábios falaram falsidade
  rationale: Conserva a imagem dos lábios como agentes da fala, o aspecto da forma verbal e a amplitude de שֶׁקֶר como falsidade ou mentira.
- source_word: לְשׁוֹנְכֶם
  choice: a sua língua
  rationale: Mantém a personificação poética do órgão da fala.
- source_word: עַוְלָה תֶהְגֶּה
  choice: murmura injustiça
  rationale: “Murmura” conserva a imagem de fala baixa ou contínua associada a הגה, enquanto “injustiça” comunica com clareza a dimensão social e ética de עַוְלָה.
theological_decisions:
- issue: Terminologia moral na denúncia profética
  choice: Preservar os campos distintos de sangue, iniquidade, falsidade e injustiça
  alternative: Uniformizar os termos como “maldade” ou “erro”
  rationale: O versículo acumula acusações relacionadas, mas não idênticas. A tradução conserva a força moral e forense de cada termo sem introduzir categorias doutrinárias posteriores.
- issue: Contaminação pelo sangue
  choice: Traduzir נְגֹאֲלוּ como “foram contaminadas”
  alternative: Traduzir como “foram manchadas”
  rationale: “Contaminadas” retém a ideia de poluição moral presente no verbo, ao passo que “manchadas” poderia ser entendido apenas como descrição física.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente compreensível. “De vocês” evita formas regionais ou arcaizantes; “iniquidade” é mantida por sua precisão e peso no registro profético. A pontuação conserva o paralelismo entre mãos e dedos, lábios e língua.
