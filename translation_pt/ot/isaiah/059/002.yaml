  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֤י אִם עֲוֺנֹֽתֵי/כֶם֙ הָי֣וּ מַבְדִּלִ֔ים בֵּינֵ/כֶ֕ם לְ/בֵ֖ין אֱלֹֽהֵי/כֶ֑ם וְ/חַטֹּֽאותֵי/כֶ֗ם הִסְתִּ֧ירוּ פָנִ֛ים מִ/כֶּ֖ם מִ/שְּׁמֽוֹעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/002.yaml
  text: But your iniquities have become those dividing between you and your God[a], and your sins have hidden his face from you, from hearing.
translation:
  language: pt
  text: Mas as suas iniquidades têm sido uma separação entre vocês e seu Deus, e os seus pecados esconderam de vocês o rosto dele, de modo que ele não ouve.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי אִם
  choice: Mas
  rationale: No contexto, a expressão introduz o contraste com a negação de qualquer incapacidade divina no versículo anterior; “Mas” comunica essa relação de modo natural.
- source_word: עֲוֺנֹתֵיכֶם
  choice: as suas iniquidades
  rationale: “Iniquidades” preserva a distinção lexical em relação a חַטֹּאותֵיכֶם (“os seus pecados”) e expressa a ideia de culpa ou perversidade moral.
- source_word: הָיוּ מַבְדִּלִים
  choice: têm feito separação
  rationale: A formulação portuguesa reflete a construção com היה e particípio, apresentando uma condição estabelecida e contínua, sem recorrer à expressão pouco natural “têm-se tornado aquelas que separam”.
- source_word: בֵּינֵיכֶם לְבֵין אֱלֹהֵיכֶם
  choice: entre vocês e o seu Deus
  rationale: Reproduz com clareza o idioma hebraico de separação entre duas partes e mantém a dimensão relacional da expressão “seu Deus”.
- source_word: וְחַטֹּאותֵיכֶם
  choice: e os seus pecados
  rationale: “Pecados” é a correspondência natural de חַטָּאוֹת e mantém o paralelismo sem apagar sua distinção em relação a “iniquidades”.
- source_word: הִסְתִּירוּ פָנִים מִכֶּם
  choice: têm escondido de vocês o rosto dele
  rationale: Mantém a imagem hebraica do rosto divino oculto e explicita o possuidor exigido pela naturalidade do português.
- source_word: מִשְּׁמוֹעַ
  choice: para que não ouça
  rationale: Traduz idiomaticamente o resultado expresso por מִן com o infinitivo construto; o sujeito continua sendo Deus, retomado por “o rosto dele”.
theological_decisions:
- issue: Linguagem antropomórfica sobre o afastamento divino
  choice: Manter a referência ao “rosto dele”
  alternative: “afastou-se de vocês” ou “retirou de vocês o seu favor”
  rationale: O hebraico emprega explicitamente a imagem do rosto. Preservá-la conserva a força literária e relacional do texto sem reduzi-la a uma abstração interpretativa.
- issue: Causalidade moral da separação
  choice: Apresentar as iniquidades e os pecados do povo como aquilo que produz a separação e impede a escuta
  alternative: Reformular como incapacidade ou indisposição inerente de Deus
  rationale: Em contraste com o versículo anterior, o texto atribui a ruptura ao pecado humano, não a uma limitação do poder ou da natureza de Deus.
- issue: Sentido de מִשְּׁמוֹעַ
  choice: “para que não ouça” como consequência
  alternative: “sem ouvir” ou a forma mais literal “de ouvir”
  rationale: A construção admite uma expressão de resultado. A redação escolhida é natural em português e não acrescenta uma razão além da relação causal presente no verso.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural de segunda pessoa e “seu Deus” em concordância corrente. A ordem “escondido de vocês o rosto dele” evita a possível leitura de que os pecados esconderam o rosto pertencente ao povo, embora mantenha de perto a imagem hebraica.
