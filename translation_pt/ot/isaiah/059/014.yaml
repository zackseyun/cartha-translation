base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/014.yaml
  text: Justice is turned back[a], and righteousness stands far off; for truth has stumbled in the street[b], and uprightness cannot enter.
translation:
  language: pt
  text: A justiça foi feita recuar[a], e a retidão permanece longe; pois a verdade tropeçou na praça pública[b], e a honestidade não pode entrar[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foi repelida”.
    reason: lexical_alternative
  - marker: b
    text: Ou “na rua”.
    reason: lexical_alternative
  - marker: c
    text: Ou “o que é reto”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֻסַּג אָחוֹר
  choice: foi repelida
  rationale: O hofal de סוג, reforçado por אָחוֹר, descreve algo forçado a recuar. “Foi repelida” conserva a voz passiva e a personificação, com fluência em português.
- source_word: מִשְׁפָּט
  choice: justiça
  rationale: Neste contexto profético e social, refere-se à justiça exercida na vida pública, não apenas a uma sentença judicial.
- source_word: צְדָקָה
  choice: retidão
  rationale: Distingue o termo de מִשְׁפָּט e expressa a qualidade moral e social complementar presente no paralelismo.
- source_word: מֵרָחוֹק תַּעֲמֹד
  choice: permanece longe
  rationale: Reproduz naturalmente a imagem de algo que fica de pé à distância, excluído da esfera pública.
- source_word: כָשְׁלָה
  choice: tropeçou
  rationale: Mantém a metáfora do verbo כשל sem intensificá-la indevidamente como queda definitiva.
- source_word: בָרְחוֹב
  choice: na praça pública
  rationale: רְחוֹב pode designar uma rua larga ou um espaço público aberto. “Praça pública” explicita o cenário cívico sugerido pelo contexto.
- source_word: אֱמֶת
  choice: verdade
  rationale: Preserva o sentido central do termo e sua personificação, embora o hebraico também possa envolver fidelidade e confiabilidade.
- source_word: נְכֹחָה
  choice: o que é correto
  rationale: Expressa a ideia de correção ou retidão sem repetir “retidão”, já empregada para צְדָקָה, e continua funcionando como sujeito personificado.
- source_word: לֹא תוּכַל לָבוֹא
  choice: não consegue entrar
  rationale: 'Conserva a imagem de exclusão: aquilo que é correto está impedido de ingressar no espaço público.'
theological_decisions:
- issue: Tradução do par מִשְׁפָּט / צְדָקָה
  choice: justiça ... retidão
  alternative: juízo ... justiça
  rationale: Os termos são próximos, mas não idênticos. A tradução escolhida preserva a distinção lexical e apresenta duas virtudes sociais e morais personificadas, sem restringir מִשְׁפָּט a um veredito nem fundir ambos os conceitos.
- issue: Personificação das virtudes públicas
  choice: manter justiça, retidão e verdade como agentes na cena
  alternative: explicitar como ausência de práticas justas, retas e verdadeiras
  rationale: O hebraico constrói uma imagem poética em que essas realidades recuam, permanecem longe e tropeçam. Preservar a personificação mantém a força profética sem acrescentar interpretação explicativa ao texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A estrutura paralela e as personificações do hebraico foram preservadas, evitando tanto arcaísmos como explicações doutrinárias.
