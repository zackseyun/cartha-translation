  verdict: revise
  source_fidelity: A tradução preserva adequadamente a sequência e a personificação do hebraico. Contudo, «foi repelida» pode sugerir sobretudo rejeição, enquanto הֻסַּג אָחוֹר descreve de modo mais específico a justiça sendo forçada a recuar. «Não pode entrar» reproduz melhor a incapacidade expressa por לֹא תוּכַל do que «não consegue entrar».
  naturalness: O texto é claro e de registro profético apropriado. «Foi feita recuar» é natural e torna explícito o movimento retrógrado. «Honestidade» oferece uma formulação idiomática para נְכֹחָה sem repetir «retidão» usada para צְדָקָה.
  terminology: «Justiça», «retidão» e «verdade» são escolhas sólidas. Para נְכֹחָה, «honestidade» mantém a ideia de retidão/franqueza moral e preserva a diferenciação em relação a צְדָקָה; a nota registra «o que é reto» como alternativa mais formal.
  issues:
  - severity: medium
    issue: «Foi repelida» não expressa de modo suficientemente preciso o elemento «para trás» em הֻסַּג אָחוֹר.
    rationale: O hofal com אָחוֹר retrata a justiça como obrigada a retroceder, não apenas como rejeitada. «Foi feita recuar» preserva a passividade e a direção da imagem.
  - severity: low
    issue: «Não consegue entrar» é um pouco mais coloquial e menos direto que a construção hebraica de incapacidade.
    rationale: «Não pode entrar» reflete com maior precisão לֹא תוּכַל לָבוֹא e conserva a imagem poética de exclusão.
  - severity: low
    issue: «O que é correto» enfraquece levemente a personificação abstrata feminina de נְכֹחָה.
    rationale: «A honestidade» mantém um substantivo abstrato personificado, em paralelo com justiça, retidão e verdade.
