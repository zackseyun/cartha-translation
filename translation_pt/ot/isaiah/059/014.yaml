  to: A justiça foi feita recuar[a], e a retidão permanece longe; pois a verdade tropeçou na praça pública[b], e a honestidade não pode entrar[c].
  rationale: A revisão torna mais explícito o movimento de recuo indicado por הֻסַּג אָחוֹר, emprega uma forma mais direta para a incapacidade de entrar e conserva a personificação de נְכֹחָה com um substantivo distinto de «retidão». As notas continuam ancoradas nos respectivos termos e registram alternativas lexicalmente defensáveis.
