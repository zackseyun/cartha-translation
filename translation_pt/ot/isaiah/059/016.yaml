  text: וַ/יַּרְא֙ כִּֽי אֵ֣ין אִ֔ישׁ וַ/יִּשְׁתּוֹמֵ֖ם כִּ֣י אֵ֣ין מַפְגִּ֑יעַ וַ/תּ֤וֹשַֽׁע ל/וֹ֙ זְרֹע֔/וֹ וְ/צִדְקָת֖/וֹ הִ֥יא סְמָכָֽתְ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/016.yaml
  text: He saw that there was no man[a], and he was appalled that there was no one to intercede; so his own arm brought him salvation[c][b], and his righteousness upheld him.
translation:
  language: pt
  text: Ele viu que não havia homem algum[a] e ficou perplexo por não haver quem intercedesse[b]; então, seu próprio braço lhe trouxe salvação, e sua justiça[c] o sustentou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Homem” traduz um termo hebraico masculino singular. Neste contexto, indica que não havia nenhum agente humano capaz de agir.
    reason: cultural_note
  - marker: b
    text: Ou “quem interviesse” ou “quem pleiteasse”. O particípio hebraico pode indicar alguém que entra em ação em favor de outra pessoa.
    reason: lexical_alternative
  - marker: c
    text: Ou “sua retidão”. O termo hebraico pode expressar tanto a qualidade de ser justo como a justiça posta em ação.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: homem algum
  rationale: Preserva o substantivo hebraico masculino singular, enquanto a construção portuguesa expressa naturalmente a ausência completa de um agente humano.
- source_word: וַיִּשְׁתּוֹמֵם
  choice: ficou perplexo
  rationale: Comunica espanto profundo diante da situação anormal e moralmente grave, sem sugerir que Deus tenha perdido o controle.
- source_word: מַפְגִּיעַ
  choice: quem intercedesse
  rationale: O particípio causativo pode designar alguém que intervém ou pleiteia em favor de outros; “intercedesse” expressa bem essa atuação mediadora no contexto.
- source_word: וַתּוֹשַׁע ... זְרֹעוֹ
  choice: seu próprio braço lhe trouxe salvação
  rationale: Mantém a metáfora hebraica do braço como poder atuante e explicita, por “próprio”, que o SENHOR age sem auxílio de qualquer agente humano.
- source_word: צִדְקָתוֹ
  choice: sua justiça
  rationale: Em português, “justiça” abrange aqui tanto a retidão divina quanto sua ação justa e salvadora; “retidão” permanece uma alternativa legítima.
- source_word: סְמָכָתְהוּ
  choice: o sustentou
  rationale: Reproduz naturalmente a ideia de apoiar ou dar firmeza, conservando a personificação da justiça divina.
theological_decisions:
- issue: Referência dos pronomes e sufixos
  choice: Os pronomes se referem ao SENHOR, que realiza por si mesmo a salvação na ausência de um agente humano.
  alternative: Ler as últimas orações de modo mais abstrato, apenas como a atuação do poder e da justiça divinos.
  rationale: O contexto imediato e a sequência dos sufixos hebraicos apontam para o mesmo sujeito divino, sem exigir categorias doutrinárias posteriores.
- issue: Sentido de צְדָקָה
  choice: justiça
  alternative: retidão
  rationale: O termo reúne a qualidade de ser justo e a ação que põe as coisas em ordem. A tradução principal preserva a dimensão forense e social do contexto, e a nota mantém a amplitude lexical.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e compreensão internacional. A metáfora do “braço” foi mantida por ser central à imagem profética; “próprio” torna explícito o contraste contextual sem acrescentar um novo referente.
