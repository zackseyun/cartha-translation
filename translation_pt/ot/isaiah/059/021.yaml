  text: וַ/אֲנִ֗י זֹ֣את בְּרִיתִ֤/י אוֹתָ/ם֙ אָמַ֣ר יְהוָ֔ה רוּחִ/י֙ אֲשֶׁ֣ר עָלֶ֔י/ךָ וּ/דְבָרַ֖/י אֲשֶׁר שַׂ֣מְתִּי בְּ/פִ֑י/ךָ לֹֽא יָמ֡וּשׁוּ מִ/פִּי/ךָ֩ וּ/מִ/פִּ֨י זַרְעֲ/ךָ֜ וּ/מִ/פִּ֨י זֶ֤רַע זַרְעֲ/ךָ֙ אָמַ֣ר יְהוָ֔ה מֵ/עַתָּ֖ה וְ/עַד עוֹלָֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/021.yaml
  text: 'And as for me[a], this is my covenant with them, says Yahweh: my Spirit that is upon you, and my words that I have put in your mouth, shall not depart from your mouth, or from the mouth of your offspring, or from the mouth of your offspring’s offspring, says Yahweh[b], from now and forever.'
translation:
  language: pt
  text: '“Quanto a mim, esta é a minha aliança com eles”, diz Yahweh: “Meu Espírito, que está sobre você, e minhas palavras, que pus na sua boca, não se afastarão da sua boca, nem da boca da sua descendência[a], nem da boca da descendência da sua descendência” — diz Yahweh — “desde agora e para sempre[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. “semente” e “semente da sua semente”. O hebraico usa «semente» como substantivo coletivo para descendência ou posteridade.
    reason: lexical_alternative
  - marker: b
    text: Ou “de agora em diante e para sempre”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Quanto a mim
  rationale: Preserva a ênfase do pronome anteposto e a mudança marcada no discurso, com naturalidade em português.
- source_word: זֹאת בְּרִיתִי אוֹתָם
  choice: esta é a minha aliança com eles
  rationale: Expressa de modo idiomático a relação indicada pela construção hebraica sem acrescentar interpretação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, distinguindo-o do título “Senhor”.
- source_word: רוּחִי אֲשֶׁר עָלֶיךָ
  choice: O meu Espírito, que está sobre você
  rationale: “Espírito” é o sentido mais adequado no contexto profético e pactual; “sobre” preserva a preposição hebraica, e “você” mantém o singular.
- source_word: וּדְבָרַי אֲשֶׁר שַׂמְתִּי בְּפִיךָ
  choice: e as minhas palavras, que pus na sua boca
  rationale: Mantém o plural “palavras” e traduz o perfeito hebraico de modo conciso, com resultado ainda relevante.
- source_word: לֹא יָמוּשׁוּ
  choice: não se afastarão
  rationale: Comunica a ideia idiomática de não sair ou apartar-se, preservando a força futura da promessa.
- source_word: זַרְעֲךָ
  choice: sua descendência
  rationale: Traduz o coletivo hebraico זֶרַע como posteridade, em linguagem portuguesa natural e inclusiva das gerações.
- source_word: זֶרַע זַרְעֲךָ
  choice: os descendentes da sua descendência
  rationale: Preserva a progressão geracional da cadeia construta hebraica sem recorrer ao pouco natural “semente da sua semente” no texto principal.
- source_word: מֵעַתָּה וְעַד עוֹלָם
  choice: desde agora e para sempre
  rationale: Reproduz a duração contínua iniciada no presente em português atual e solene.
theological_decisions:
- issue: Referente do pronome de segunda pessoa do singular
  choice: Manter “você” no singular sem identificar o destinatário
  alternative: Explicitar o profeta, Sião/Israel personificado, o servo ou a comunidade redimida
  rationale: O hebraico não identifica expressamente o referente imediato; manter o pronome preserva a ambiguidade e evita impor uma leitura teológica específica.
- issue: Sentido de רוּחִי
  choice: meu Espírito
  alternative: meu sopro ou meu vento
  rationale: No contexto de promessa pactual e palavra divina, “Espírito” é a leitura contextual mais provável, sem eliminar a amplitude lexical inerente ao termo hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O discurso direto foi pontuado para deixar clara a estrutura da declaração divina. Mantiveram-se o singular “você”, o paralelismo das três ocorrências de “boca” e a repetição de “diz Yahweh”.
