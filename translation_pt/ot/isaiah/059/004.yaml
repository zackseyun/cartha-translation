base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/004.yaml
  text: No one calls for righteousness[a], and no one pleads with faithfulness; trusting in emptiness and speaking falsehood[d][c][b], they conceive trouble and give birth to wickedness.
translation:
  language: pt
  text: Ninguém clama por justiça[a], e ninguém pleiteia com fidelidade[b]; confiando no vazio[c] e falando falsidade, concebem maldade e dão à luz iniquidade[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ninguém clama com justiça” ou “Ninguém clama pelo que é justo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ninguém entra em juízo com verdade” ou “ninguém pleiteia honestamente”.'
    reason: lexical_alternative
  - marker: c
    text: “Vazio” também pode ser traduzido por “futilidade” ou “vacuidade”.
    reason: lexical_alternative
  - marker: d
    text: 'Ou: “maldade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹרֵא בְצֶדֶק
  choice: clama pelo que é justo
  rationale: No contexto de corrupção pública e judicial, a expressão comunica um apelo pelo que é correto sem restringir צֶדֶק apenas ao âmbito forense; a nota preserva as alternativas mais formais.
- source_word: נִשְׁפָּט בֶּאֱמוּנָה
  choice: pleiteia com fidelidade
  rationale: O Nifal de שפט tem aqui sentido forense, e אֱמוּנָה abrange fidelidade, confiabilidade e integridade. A formulação conserva essa amplitude, embora a nota ofereça opções portuguesas mais idiomáticas.
- source_word: בָּטוֹחַ עַל תֹּהוּ
  choice: confiando no vazio
  rationale: בטח significa confiar ou apoiar-se, enquanto תֹהוּ pode designar vazio, irrealidade ou futilidade. A construção participial mantém a relação descritiva com os verbos seguintes.
- source_word: וְדַבֶּר שָׁוְא
  choice: e falando falsidade
  rationale: שָׁוְא pode indicar falsidade, engano ou algo sem valor. “Falsidade” preserva a dimensão moral sem limitar o termo a mentiras verbalmente explícitas.
- source_word: הָרוֹ עָמָל
  choice: concebem desgraça
  rationale: A imagem hebraica é a da concepção ou gravidez. עָמָל inclui sofrimento, dano, aflição e maldade; “desgraça” expressa aqui o resultado nocivo sem duplicar “iniquidade”.
- source_word: וְהוֹלֵיד אָוֶן
  choice: e dão à luz iniquidade
  rationale: A tradução mantém a metáfora de conceber e dar à luz. אָוֶן pode denotar iniquidade, maldade ou dano; “iniquidade” destaca sua força moral neste oráculo de denúncia.
theological_decisions:
- issue: Amplitude moral e judicial de צֶדֶק e אֱמוּנָה
  choice: Traduzir por “o que é justo” e “fidelidade”, preservando tanto a dimensão judicial quanto a moral.
  alternative: Usar exclusivamente “justiça” e “verdade”, enfatizando o cenário de tribunal.
  rationale: O contexto denuncia corrupção social e judicial, mas os termos hebraicos não se limitam ao vocabulário técnico do tribunal. A tradução evita reduzir sua tensão moral e relacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura participial “confiando... e falando...” conserva a forma e o encadeamento retórico do hebraico. “Pleiteia” mantém o cenário forense, e as notas esclarecem alternativas sem resolver indevidamente a ambiguidade.
