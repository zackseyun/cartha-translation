  to: E a verdade estava ausente, e quem se afasta do mal torna-se presa[a]. Yahweh viu, e foi mau aos seus olhos[b] não haver justiça.
  rationale: A revisão troca “desapareceu” por “estava ausente”, que representa com mais precisão o particípio hebraico sem determinar como ocorreu a ausência. Também remove “isso”, não expresso no original, e formula a avaliação divina de modo próximo ao hebraico e compreensível em português. A imagem ambígua de alguém que se torna presa é mantida, com alternativas na nota.
