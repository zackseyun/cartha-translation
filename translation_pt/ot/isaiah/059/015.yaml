  naturalness: A redação proposta é clara e digna. “Estava ausente” e “foi mau aos seus olhos não haver justiça” são naturais em português moderno de registro bíblico sem perder a proximidade com o hebraico.
  terminology: “Verdade”, “mal”, “presa”, “Yahweh” e “justiça” são escolhas adequadas. “Torna-se presa” mantém prudentemente a imagem e a incerteza lexical da forma rara מִשְׁתּוֹלֵל.
