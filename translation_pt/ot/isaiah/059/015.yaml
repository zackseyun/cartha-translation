source:
  edition: WLC
  text: וַ/תְּהִ֤י הָֽ/אֱמֶת֙ נֶעְדֶּ֔רֶת וְ/סָ֥ר מֵ/רָ֖ע מִשְׁתּוֹלֵ֑ל וַ/יַּ֧רְא יְהוָ֛ה וַ/יֵּ֥רַע בְּ/עֵינָ֖י/ו כִּֽי אֵ֥ין מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/015.yaml
  text: So truth was missing[a], and whoever turned away from evil was plundered. Yahweh saw[b], and it was evil in his eyes that there was no justice.
translation:
  language: pt
  text: E a verdade estava ausente, e quem se afasta do mal torna-se presa[a]. Yahweh viu, e foi mau aos seus olhos[b] não haver justiça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “é tratado como presa” ou “é espoliado”. O termo hebraico é raro e indica que quem abandona o mal acaba se tornando vítima.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “foi mau aos seus olhos”. Esta é uma expressão hebraica de avaliação moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֱמֶת
  choice: a verdade
  rationale: אֱמֶת pode significar verdade ou fidelidade; no contexto do colapso público, moral e judicial, “a verdade” expressa melhor o sentido predominante sem excluir a nuance de confiabilidade.
- source_word: נֶעְדֶּרֶת
  choice: desapareceu
  rationale: O particípio nifal indica que a verdade está ausente ou em falta. “Desapareceu” é natural em português e comunica claramente sua ausência no cenário descrito.
- source_word: וְסָר מֵרָע
  choice: quem se afasta do mal
  rationale: O particípio masculino singular tem valor genérico. Esta formulação preserva esse caráter representativo e a ação de abandonar o mal.
- source_word: מִשְׁתּוֹלֵל
  choice: torna-se presa
  rationale: A forma rara sugere fazer-se presa, ser tratado como presa ou ser espoliado. “Torna-se presa” conserva a imagem de vitimização e a ambiguidade da construção melhor que uma especificação como “é saqueado”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: וַיֵּרַע בְּעֵינָיו
  choice: pareceu-lhe mau
  rationale: Mantém a avaliação moral do idioma hebraico, literalmente relacionado a ser mau aos seus olhos, numa expressão portuguesa natural.
- source_word: מִשְׁפָּט
  choice: justiça
  rationale: No contexto social e judicial de Isaías, designa a justiça e a ordem moral e jurídica correta.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em transliteração.
- issue: Valor genérico do particípio masculino וְסָר
  choice: quem se afasta do mal
  alternative: o homem que se afasta do mal; aquele que se afasta do mal
  rationale: A forma hebraica é masculina singular, mas funciona genericamente; “quem” comunica esse valor sem introduzir uma referência exclusivamente masculina.
- issue: Sentido da forma rara מִשְׁתּוֹלֵל
  choice: torna-se presa
  alternative: é saqueado; é espoliado; faz de si mesmo uma presa
  rationale: A escolha preserva a imagem de alguém vitimado por rejeitar o mal, sem decidir de modo excessivo entre uma leitura reflexiva e uma passiva.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A ordem das frases acompanha o movimento do hebraico; “torna-se presa” conserva sua imagem rara, e a nota explica as alternativas. O marcador [b] foi colocado após a oração completa à qual esclarece o idioma hebraico.
