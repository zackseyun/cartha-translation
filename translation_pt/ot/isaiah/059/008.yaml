id: ISA.59.8
reference: Isaiah 59:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: דֶּ֤רֶךְ שָׁלוֹם֙ לֹ֣א יָדָ֔עוּ וְ/אֵ֥ין מִשְׁפָּ֖ט בְּ/מַעְגְּלוֹתָ֑/ם נְתִיבֽוֹתֵי/הֶם֙ עִקְּשׁ֣וּ לָ/הֶ֔ם כֹּ֚ל דֹּרֵ֣ךְ בָּ֔/הּ לֹ֥א יָדַ֖ע שָׁלֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/008.yaml
  text: They do not know the way of peace[a], and there is no justice in their paths; they have made their roads crooked for themselves[b]; everyone who walks in them does not know peace.
translation:
  language: pt
  text: Eles não conhecem o caminho da paz, e não há justiça em suas veredas; tornaram tortuosas as suas trilhas para si; todo aquele que anda por elas não conhece a paz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֶּרֶךְ
  choice: caminho
  rationale: Preserva a metáfora hebraica do modo ou curso de vida e forma naturalmente a expressão “caminho da paz”.
- source_word: שָׁלוֹם
  choice: paz
  rationale: É a correspondência contextual mais direta e preserva a repetição das duas ocorrências, embora o termo também possa abranger bem-estar e integridade.
- source_word: יָדָעוּ / יָדַע
  choice: conhecem / conhece
  rationale: Mantém a repetição hebraica e permite o sentido experiencial e moral de conhecer, sem reduzi-lo a mera compreensão intelectual.
- source_word: מִשְׁפָּט
  choice: justiça
  rationale: No contexto de denúncia ética e social, comunica melhor a ausência do que é justo, sem limitar o termo a uma decisão judicial.
- source_word: מַעְגְּלוֹתָם
  choice: suas veredas
  rationale: Designa caminhos ou cursos; “veredas” é natural em registro poético e ajuda a distingui-lo do substantivo seguinte.
- source_word: נְתִיבוֹתֵיהֶם
  choice: suas trilhas
  rationale: Preserva a imagem viária e a variedade lexical do paralelismo hebraico sem perder clareza.
- source_word: עִקְּשׁוּ
  choice: fizeram tortuosas
  rationale: Expressa diretamente a ação de entortar ou tornar sinuoso, conservando também sua ressonância moral.
- source_word: לָהֶם
  choice: suas
  rationale: O dativo reflexivo indica que eles fizeram esses caminhos para si mesmos; em português, o possessivo transmite esse vínculo com naturalidade e sem explicitação excessiva.
- source_word: כֹּל דֹּרֵךְ בָּהּ
  choice: todo aquele que anda por elas
  rationale: O singular hebraico בָּהּ provavelmente retoma coletivamente o conjunto de caminhos; o plural em português torna a referência clara e idiomática.
theological_decisions:
- issue: Sentido ético-jurídico de מִשְׁפָּט
  choice: justiça
  alternative: julgamento
  rationale: A denúncia profética trata da falta de retidão na conduta e na ordem social; “justiça” preserva essa amplitude sem impor um sentido exclusivamente forense.
- issue: Número do pronome em בָּהּ após antecedentes plurais
  choice: por elas
  alternative: por ela
  rationale: O singular hebraico pode ter referência coletiva ao caminho ou curso descrito. O plural português retoma naturalmente “trilhas” e evita ambiguidade artificial.
- issue: Amplitude de שָׁלוֹם
  choice: paz
  alternative: bem-estar / plenitude
  rationale: “Paz” conserva a formulação profética reconhecível e o contraste do versículo, sem negar que o hebraico possa incluir uma condição mais ampla de integridade e bem-estar.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação conserva o paralelismo e a sequência de imagens do hebraico, variando “caminho”, “veredas” e “trilhas” para refletir os três substantivos, sem tornar o verso arcaico.
