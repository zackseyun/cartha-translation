  source_fidelity: 'A redação preserva adequadamente a sequência e as imagens do hebraico: desconhecimento do caminho da paz, ausência de justiça nos seus percursos, perversão dos caminhos e a consequência para quem neles anda. Contudo, o dativo reflexivo לָהֶם em «עִקְּשׁוּ לָהֶם» fica omitido na tradução atual. O possessivo em «suas trilhas» apenas traduz o sufixo de «trilhas» (נתיבותיהם) e não expressa de modo seguro o «para si» adicional.'
  naturalness: O português é claro, moderno e de registro bíblico-poético acessível. «Fizeram tortuosas as suas trilhas» é compreensível, mas «tornaram tortuosas as suas trilhas para si» soa mais natural e torna explícito o elemento reflexivo do original.
  terminology: «Caminho da paz», «justiça», «veredas», «trilhas» e «paz» são escolhas apropriadas. A variedade entre os termos de percurso é legítima e conserva o paralelismo sem criar dificuldade indevida.
