id: ISA.59.11
reference: Isaiah 59:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: נֶהֱמֶ֤ה כַ/דֻּבִּים֙ כֻּלָּ֔/נוּ וְ/כַ/יּוֹנִ֖ים הָגֹ֣ה נֶהְגֶּ֑ה נְקַוֶּ֤ה לַ/מִּשְׁפָּט֙ וָ/אַ֔יִן לִֽ/ישׁוּעָ֖ה רָחֲקָ֥ה מִמֶּֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/011.yaml
  text: We all growl like bears[a], and like doves we moan continually; we hope for justice, but there is none; for salvation[b], but it is far from us.
translation:
  language: pt
  text: 'Todos nós rosnamos como ursos

    e gememos sem cessar como pombas.

    Esperamos[a] pela justiça, mas ela não vem;

    pela salvação[b], mas ela está longe de nós.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aguardamos” ou “temos esperança de encontrar”; o verbo hebraico pode expressar tanto espera quanto esperança.
    reason: lexical_alternative
  - marker: b
    text: Ou “livramento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶהֱמֶה
  choice: rosnamos
  rationale: O verbo descreve um som forte e grave; na comparação com ursos, “rosnamos” conserva de modo natural a imagem animal e a distingue do gemido das pombas.
- source_word: כַדֻּבִּים כֻּלָּנוּ
  choice: Todos nós ... como ursos
  rationale: Mantém a totalidade do lamento coletivo e a comparação explícita do hebraico.
- source_word: וְכַיּוֹנִים הָגֹה נֶהְגֶּה
  choice: e gememos sem cessar como pombas
  rationale: “Gememos” comunica o som lamentoso associado às pombas no contexto; “sem cessar” expressa naturalmente a intensificação produzida pelo infinitivo absoluto seguido do verbo finito.
- source_word: נְקַוֶּה
  choice: Esperamos
  rationale: O verbo pode indicar tanto esperar no sentido de aguardar quanto nutrir esperança. “Esperamos” preserva em português essa sobreposição sem resolver indevidamente a ambiguidade.
- source_word: לַמִּשְׁפָּט
  choice: pela justiça
  rationale: Neste contexto, מִשְׁפָּט designa a justiça ou ordem justa esperada, e não apenas uma sentença judicial.
- source_word: וָאַיִן
  choice: mas ela não vem
  rationale: Expressa de forma idiomática a frustração da expectativa indicada por “esperamos”. O hebraico afirma literalmente sua ausência; a tradução evita o pouco natural “mas ela não existe” sem mudar o sentido contextual.
- source_word: לִישׁוּעָה
  choice: pela salvação
  rationale: “Salvação” preserva a amplitude do termo, que pode referir-se à libertação concreta e também carregar ressonância teológica mais ampla.
- source_word: רָחֲקָה מִמֶּנּוּ
  choice: mas ela está longe de nós
  rationale: Reproduz diretamente a afirmação de que a salvação permanece distante dos que lamentam.
theological_decisions:
- issue: Sentido de יְשׁוּעָה no lamento profético
  choice: salvação
  alternative: livramento
  rationale: O contexto inclui a ideia de resgate concreto, mas “salvação” mantém a amplitude sem impor especificações doutrinárias posteriores; a alternativa lexical é registrada em nota.
- issue: Ambiguidade de קוה
  choice: esperamos
  alternative: aguardamos / temos esperança
  rationale: “Esperamos” permite em português os sentidos próximos de aguardar e ter esperança, preservando a tensão lexical do hebraico.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A disposição em linhas ressalta o paralelismo poético: dois sons de lamento seguidos de duas expectativas frustradas.'
