base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/019.yaml
  text: So they will fear the name of Yahweh from the west[a], and his glory from the rising of the sun; for he will come like a rushing river[c][b], driven by the breath of Yahweh.
translation:
  language: pt
  text: Assim, temerão o nome de Yahweh do ocidente e a sua glória do nascer do sol[a], pois ele virá como um rio impetuoso[b], impelido pelo sopro de Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «do oriente». Literalmente, «do nascer do sol».'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico desta cláusula é difícil. Outra tradução possível: «pois isso virá como um rio impetuoso, impelido pelo Espírito de Yahweh».'
    reason: alternative_reading
  - marker: c
    text: 'Tradução tradicional baseada em outra análise do hebraico: «Quando o inimigo vier como uma inundação, o Espírito de Yahweh levantará um estandarte contra ele».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִירְאוּ
  choice: Assim, temerão
  rationale: O qal imperfeito de ירא pode expressar temor e reverência. “Temerão” preserva sua força, enquanto “Assim” comunica naturalmente a ligação com o contexto.
- source_word: מִמַּעֲרָב
  choice: desde o ocidente
  rationale: מַעֲרָב designa o oeste, associado ao pôr do sol. “Desde o ocidente” é geograficamente claro e forma paralelo com a expressão seguinte.
- source_word: אֶת שֵׁם יְהוָה
  choice: o nome de Yahweh
  rationale: A expressão se refere à identidade revelada e à reputação de Deus; o nome divino é transliterado como “Yahweh”.
- source_word: וּמִמִּזְרַח שֶׁמֶשׁ
  choice: desde o nascer do sol
  rationale: A tradução mantém a imagem poética literal do hebraico e, por extensão, indica o oriente.
- source_word: אֶת כְּבוֹדוֹ
  choice: a sua glória
  rationale: כָּבוֹד pode indicar peso, honra ou esplendor; “glória” se ajusta ao contexto de manifestação e reverência universais.
- source_word: כִּי יָבֹא
  choice: pois ele virá
  rationale: כִּי introduz a razão, e o verbo masculino singular permite entender Yahweh como sujeito implícito. A dificuldade sintática é registrada em nota.
- source_word: כַנָּהָר צָר
  choice: como um rio impetuoso
  rationale: נָהָר é “rio” ou “corrente”; צָר é difícil neste contexto, mas parece caracterizar seu movimento comprimido ou vigoroso. “Impetuoso” transmite a força da imagem sem introduzir explicitamente um inimigo ausente do texto.
- source_word: רוּחַ יְהוָה
  choice: o sopro de Yahweh
  rationale: רוּחַ pode significar sopro, vento ou Espírito. “Sopro” conserva a imagem concreta da força que impele o rio, sem eliminar as outras possibilidades.
- source_word: נֹסְסָה בוֹ
  choice: impelido por
  rationale: A forma verbal e sua relação com בּוֹ são difíceis. Entendê-la como ação que põe a corrente em movimento produz uma leitura coerente, enquanto as principais alternativas são preservadas nas notas.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- issue: Sentido de רוּחַ יְהוָה
  choice: o sopro de Yahweh
  alternative: o Espírito de Yahweh; o vento de Yahweh
  rationale: O sentido concreto combina com a imagem de um rio impelido, mas a polissemia hebraica e sua possível ressonância teológica são mantidas em nota.
- issue: Interpretação da cláusula final difícil
  choice: A vinda divina é comparada a um rio impetuoso, impelido pelo sopro de Yahweh.
  alternative: O inimigo vem como uma inundação, e o Espírito de Yahweh levanta um estandarte contra ele.
  rationale: O hebraico não traz uma palavra explícita para “inimigo”, e a leitura tradicional depende de outra análise de צָר, da sintaxe e do verbo raro. A tradução principal segue uma leitura diretamente fundamentada no texto, sem ocultar a alternativa tradicional.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo poético preservado em “desde o ocidente” e “desde o nascer do sol”. Emprega “Yahweh” para o tetragrama e evita linguagem denominacional. As notas expõem a polissemia de רוּחַ e a dificuldade real da cláusula final sem resolvê-las silenciosamente.
