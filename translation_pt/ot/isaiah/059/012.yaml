source:
  edition: WLC
  text: כִּֽי רַבּ֤וּ פְשָׁעֵ֨י/נוּ֙ נֶגְדֶּ֔/ךָ וְ/חַטֹּאותֵ֖י/נוּ עָ֣נְתָה בָּ֑/נוּ כִּֽי פְשָׁעֵ֣י/נוּ אִתָּ֔/נוּ וַ/עֲוֺנֹתֵ֖י/נוּ יְדַֽעֲנֽוּ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/012.yaml
  text: For our transgressions are many before you[a], and our sins testify against us; for our transgressions are with us, and we know our iniquities.
translation:
  language: pt
  text: Pois as nossas transgressões são muitas diante de ti, e os nossos pecados testemunham contra nós; pois as nossas transgressões estão conosco, e conhecemos as nossas iniquidades.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ligada à confissão anterior e mantém de modo natural a força causal-explicativa.
- source_word: רַבּוּ
  choice: são muitas
  rationale: Expressa o resultado do aumento ou multiplicação das transgressões em português claro e conciso.
- source_word: פְשָׁעֵינוּ
  choice: as nossas transgressões
  rationale: Preserva a ideia de violação ou rebelião e mantém um termo distinto dos demais vocábulos de pecado no versículo.
- source_word: נֶגְדֶּךָ
  choice: diante de ti
  rationale: Conserva a nuance espacial e judicial de estarem expostas perante Deus, sem reduzi-la simplesmente a 'contra ti'.
- source_word: וְחַטֹּאותֵינוּ
  choice: e os nossos pecados
  rationale: É o equivalente corrente e preciso para o termo hebraico comum referente a pecados.
- source_word: עָנְתָה בָּנוּ
  choice: testemunham contra nós
  rationale: Torna claro o sentido forense de responder ou depor contra alguém. O plural natural em português concorda com 'pecados', sem tentar reproduzir a concordância singular incomum do hebraico.
- source_word: פְשָׁעֵינוּ אִתָּנוּ
  choice: as nossas transgressões estão conosco
  rationale: Mantém de perto a formulação hebraica e comunica a presença contínua e inegável das transgressões.
- source_word: וַעֲוֺנֹתֵינוּ
  choice: e conhecemos as nossas iniquidades
  rationale: O substantivo é traduzido por 'iniquidades', preservando sua gravidade moral e distinguindo-o de 'transgressões' e 'pecados'; a ordem foi ajustada ao português natural.
- source_word: יְדַעֲנוּם
  choice: conhecemos
  rationale: Preserva o sentido direto de saber ou conhecer e inclui como objeto explícito 'as nossas iniquidades'.
theological_decisions:
- issue: Distinção entre os três termos hebraicos relacionados ao pecado
  choice: transgressões, pecados e iniquidades
  alternative: traduzir todos por 'pecados'
  rationale: A acumulação de פשע, חטא e עון é retoricamente significativa. Manter termos distintos preserva a textura da confissão sem impor diferenças técnicas rígidas entre conceitos sobrepostos.
- issue: Sentido forense de עָנְתָה בָּנוּ
  choice: testemunham contra nós
  alternative: respondem contra nós; testemunham em nós
  rationale: O contexto de culpa favorece a imagem judicial de os pecados deporem contra o povo, embora o idioma hebraico tenha literalmente a noção de 'responder'.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com pronomes de segunda pessoa no singular para conservar o discurso direto a Deus. A tradução mantém a repetição de 'transgressões' e os três vocábulos distintos de culpa presentes no hebraico.
