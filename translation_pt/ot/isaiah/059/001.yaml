revisions:
- from: Vejam[a], a mão de Yahweh não é curta demais para salvar[b], nem o seu ouvido pesado demais para ouvir.
  to: Eis que[a] a mão de Yahweh não é curta demais para salvar[b], nem o seu ouvido é pesado demais para ouvir.
  rationale: A revisão substitui o imperativo plural “Vejam” por “Eis que”, que comunica a força enfática de הֵן sem acrescentar um destinatário, e explicita “é” na segunda oração para obter português moderno e paralelismo claro. A nota literal foi ajustada para refletir ambas as imagens verbais sem alterar o sentido do versículo.
