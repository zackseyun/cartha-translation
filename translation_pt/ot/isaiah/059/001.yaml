lexical_decisions:
- source_word: הֵן
  choice: Vejam
  rationale: A partícula introduz uma afirmação enfática e chama a atenção para o que segue. “Vejam” comunica essa função discursiva em português atual; a nota registra alternativas possíveis.
- source_word: קָצְרָה
  choice: não é curta demais
  rationale: Com “mão” como sujeito, o verbo expressa insuficiência ou incapacidade. A tradução conserva a metáfora concreta e comunica naturalmente o sentido idiomático.
- source_word: יַד
  choice: mão
  rationale: Mantém a imagem antropomórfica hebraica da mão como expressão de poder ou capacidade, sem substituí-la pela interpretação abstrata “poder”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: מֵהוֹשִׁיעַ
  choice: para salvar
  rationale: A preposição com o infinitivo indica aqui a ação para a qual a mão não é insuficiente. “Salvar” traduz diretamente o verbo e se encaixa no paralelismo.
- source_word: כָבְדָה
  choice: pesado demais
  rationale: Preserva o sentido concreto de “ser pesado” e o paralelismo com “curta demais”; no contexto do ouvido, a imagem comunica incapacidade de ouvir.
- source_word: אָזְנוֹ
  choice: o seu ouvido
  rationale: Conserva a imagem corporal concreta do hebraico, em vez de abstraí-la como “sua audição”.
- source_word: מִשְּׁמוֹעַ
  choice: para ouvir
  rationale: Traduz diretamente o verbo hebraico e completa de modo natural a construção de incapacidade expressa pela preposição.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome próprio e evita substituí-lo por um título, sem introduzir uma interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação conserva as duas metáforas corporais e o paralelismo poético do hebraico; as notas registram a força ambígua da partícula inicial e a construção mais literal.
