  text: כְּ/עַ֤ל גְּמֻלוֹת֙ כְּ/עַ֣ל יְשַׁלֵּ֔ם חֵמָ֣ה לְ/צָרָ֔י/ו גְּמ֖וּל לְ/אֹֽיְבָ֑י/ו לָ/אִיִּ֖ים גְּמ֥וּל יְשַׁלֵּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/059/018.yaml
  text: 'According to their deeds[a], so he will repay: wrath to his adversaries, repayment to his enemies; to the coastlands he will repay what is due.'
translation:
  language: pt
  text: 'Conforme os atos deles, assim ele retribuirá: ira aos seus adversários, retribuição aos seus inimigos; às terras costeiras[a], ele dará a retribuição devida.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “às ilhas”. O termo hebraico pode indicar ilhas ou terras costeiras marítimas distantes; em Isaías, muitas vezes se refere de modo amplo a nações costeiras longínquas.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעַל גְּמֻלוֹת כְּעַל
  choice: Conforme os atos deles, assim
  rationale: A construção repetida apresenta a medida correspondente da retribuição. A formulação portuguesa comunica proporcionalidade sem reproduzir de modo artificial a repetição hebraica.
- source_word: יְשַׁלֵּם
  choice: ele retribuirá
  rationale: O piel de שלם indica pagar de volta ou dar a devida retribuição. “Retribuirá” é claro, solene e adequado ao contexto judicial.
- source_word: חֵמָה
  choice: ira
  rationale: Expressa intensa indignação judicial em linguagem bíblica corrente, sem acrescentar a ideia de descontrole emocional.
- source_word: לְצָרָיו
  choice: aos seus adversários
  rationale: Preserva o sentido de pessoas hostis a ele sem especificar indevidamente opressão ou um cenário exclusivamente militar.
- source_word: גְּמוּל
  choice: retribuição
  rationale: Mantém a ligação lexical com o verbo “retribuir” e comunica a paga correspondente aos atos praticados.
- source_word: לְאֹיְבָיו
  choice: aos seus inimigos
  rationale: Equivalente português direto e natural para אויב no contexto de hostilidade e juízo.
- source_word: לָאִיִּים
  choice: às terras costeiras
  rationale: Em Isaías, o termo frequentemente abrange regiões marítimas e povos costeiros distantes; “terras costeiras” evita restringi-lo apenas a ilhas.
- source_word: גְּמוּל יְשַׁלֵּם
  choice: ele dará a retribuição devida
  rationale: A expressão evita a redundância pouco natural de “retribuirá retribuição”, mas conserva a ênfase hebraica numa paga plenamente devida.
theological_decisions:
- issue: Referente dos verbos na terceira pessoa do singular
  choice: Manter “ele”, sem inserir “o SENHOR” no versículo
  alternative: Explicitar “o SENHOR” como sujeito
  rationale: O contexto imediato identifica o guerreiro divino como sujeito, mas o hebraico deste versículo não repete o nome. “Ele” preserva o fluxo discursivo e evita acrescentar um título ausente.
- issue: Sentido do grupo lexical גמל na abertura
  choice: 'Entendê-lo como a base proporcional do juízo: “Conforme os atos deles”'
  alternative: 'Traduzir de forma mais abstrata: “Conforme as retribuições”'
  rationale: O versículo ressalta que a paga corresponde ao que foi praticado. A tradução escolhida torna essa relação clara, enquanto as ocorrências seguintes preservam explicitamente o tema da retribuição.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e vocabulário amplamente compreensível no espaço lusófono. A repetição do tema da retribuição foi preservada sem calques pouco naturais.
