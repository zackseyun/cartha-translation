  source_fidelity: A tradução preserva adequadamente a estrutura de retribuição proporcional expressa pelo grupo גמל e mantém o sujeito pronominal implícito do hebraico como “ele”. “Ira aos seus adversários” e “retribuição aos seus inimigos” refletem com precisão o paralelismo judicial do versículo. “Terras costeiras” é uma opção contextual sólida para אִיִּים, sem excluir a alternativa “ilhas” na nota.
  naturalness: O português é moderno, solene e claro para leitores brasileiros e internacionais. A construção “Conforme os atos deles, assim ele retribuirá” é levemente elevada, mas natural e apropriada ao registro profético. A repetição de “retribuição” preserva a coesão lexical sem resultar excessivamente pesada.
  terminology: “Ira”, “adversários”, “inimigos” e “retribuição” são escolhas semanticamente adequadas e consistentes com o contexto de juízo. A nota de rodapé explica de maneira equilibrada a amplitude semântica de אִיִּים e não impõe uma identificação geográfica indevida.
