base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/016.yaml
  text: O Yahweh[a], in distress they sought you[c][b]; they poured out a whispered prayer when your discipline was upon them.
translation:
  language: pt
  text: Ó Yahweh, na angústia eles te buscaram[a]; derramaram uma oração sussurrada[b] quando a tua disciplina[c] estava sobre eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se voltaram para ti” ou “atentaram para ti”; o verbo hebraico pode expressar a ideia de dar atenção a alguém, visitá-lo ou buscá-lo.
    reason: lexical_alternative
  - marker: b
    text: Ou “derramaram um sussurro” ou “proferiram um murmúrio”; o hebraico é conciso e pode descrever uma súplica em voz baixa durante a aflição.
    reason: lexical_alternative
  - marker: c
    text: “Disciplina” também pode ser traduzida por “correção”, “instrução” ou “castigo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Ó Yahweh
  rationale: Preserva o nome divino revelado no texto hebraico, em vez de substituí-lo por um título, e mantém o tom de invocação.
- source_word: בַּצַּר
  choice: na angústia
  rationale: O termo descreve aflição ou adversidade, não um lugar literalmente estreito; “na angústia” é natural e adequado ao contexto.
- source_word: פְּקָדוּךָ
  choice: eles te buscaram
  rationale: פקד possui amplo campo semântico, incluindo visitar, voltar a atenção para e buscar. No contexto de súplica em meio à aflição, “buscaram” comunica bem a ideia sem eliminar alternativas legítimas.
- source_word: צָקוּן
  choice: derramaram
  rationale: O verbo transmite a ideia de verter ou fazer fluir, formando em português a expressão natural “derramaram uma oração”.
- source_word: לַחַשׁ
  choice: uma oração sussurrada
  rationale: לחש pode designar sussurro, murmúrio ou fala em voz baixa. O contexto de busca por Deus favorece uma súplica discreta, sem exigir o sentido de encantamento.
- source_word: מוּסָרְךָ
  choice: a tua disciplina
  rationale: מוּסָר pode significar disciplina, correção ou instrução. “Disciplina” conserva aqui tanto a dimensão corretiva quanto a formativa.
- source_word: לָמוֹ
  choice: sobre eles
  rationale: A preposição com sufixo é entendida em relação à disciplina divina, apresentada como algo que veio sobre o povo.
theological_decisions:
- issue: Natureza de מוּסָר em relação a Deus
  choice: a tua disciplina
  alternative: a tua correção; a tua instrução; o teu castigo
  rationale: “Disciplina” preserva a dimensão corretiva do sofrimento sem reduzi-lo a mera instrução nem defini-lo exclusivamente como punição.
- issue: Sentido de לַחַשׁ
  choice: uma oração sussurrada
  alternative: um sussurro; um murmúrio; um encantamento
  rationale: O contexto é de apelo a Yahweh na angústia. A tradução explicita com cautela a função de súplica e mantém o tom baixo da fala, sem introduzir uma conotação mágica não exigida pelo contexto.
- issue: Relação sintática de מוּסָרְךָ לָמוֹ
  choice: quando a tua disciplina estava sobre eles
  alternative: a tua disciplina para eles; ao receberem a tua disciplina
  rationale: A formulação liga a busca e a oração à disciplina divina, como favorece o contexto, embora a construção hebraica seja compacta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção natural para leitores brasileiros. O paralelismo e o tom de súplica foram preservados; as ambiguidades lexicais relevantes aparecem nas notas.
