  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֹ֥רַח לַ/צַּדִּ֖יק מֵֽישָׁרִ֑ים יָשָׁ֕ר מַעְגַּ֥ל צַדִּ֖יק תְּפַלֵּֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/007.yaml
  text: The path of the righteous is level; O Upright One[a], you make the way of the righteous smooth.
translation:
  language: pt
  text: 'A vereda do justo é plana;

    tu, ó Justo[a], aplanas o caminho do justo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A vereda do justo é reta; reto é o caminho do justo que tu aplanas.” O hebraico permite entender יָשָׁר como adjetivo, em vez de vocativo, embora o verbo na segunda pessoa favoreça a leitura “ó Justo”.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֹרַח
  choice: vereda
  rationale: Expressa uma via ou modo de vida e preserva a imagem poética, em paralelo com מַעְגַּל.
- source_word: לַצַּדִּיק
  choice: do justo
  rationale: O ל pode indicar relação ou pertencimento; “do justo” é natural em português e mantém o singular genérico do hebraico.
- source_word: מֵישָׁרִים
  choice: plana
  rationale: Embora formalmente seja um substantivo plural, aqui caracteriza a vereda como nivelada ou sem irregularidades.
- source_word: יָשָׁר
  choice: ó Justo
  rationale: É entendido como vocativo dirigido a Deus, leitura favorecida pelo verbo seguinte na segunda pessoa do singular; a ambiguidade adjetival é preservada em nota.
- source_word: מַעְגַּל
  choice: caminho
  rationale: Designa uma trilha ou curso; “caminho” mantém a metáfora de deslocamento e evita repetir “vereda”.
- source_word: צַדִּיק
  choice: o justo
  rationale: Conserva o singular genérico e a ideia de quem vive com justiça, sem explicitação de gênero além da forma gramatical corrente.
- source_word: תְּפַלֵּס
  choice: aplanas
  rationale: O piel de פלס pode significar nivelar ou tornar plano; “aplanas” reproduz de modo conciso a imagem concreta do caminho.
theological_decisions:
- issue: Se יָשָׁר qualifica o caminho ou funciona como vocativo dirigido a Deus
  choice: 'Vocativo: “ó Justo”'
  alternative: 'Leitura adjetival: “reta é a vereda do justo que tu aplanas”'
  rationale: A segunda pessoa masculina singular em תְּפַלֵּס favorece uma passagem ao discurso direto. A nota registra a leitura adjetival genuinamente possível, sem eliminar a tensão sintática e teológica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Vereda” preserva o tom poético sem ser arcaica; “aplanas” mantém a correspondência lexical e a imagem viária.
