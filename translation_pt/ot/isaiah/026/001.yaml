  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֔וּא יוּשַׁ֥ר הַ/שִּׁיר הַ/זֶּ֖ה בְּ/אֶ֣רֶץ יְהוּדָ֑ה עִ֣יר עָז לָ֔/נוּ יְשׁוּעָ֥ה יָשִׁ֖ית חוֹמ֥וֹת וָ/חֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/001.yaml
  text: 'In that day this song will be sung in the land of Judah: “We have a strong city[c][b][a]; he sets salvation as walls and rampart.”'
translation:
  language: pt
  text: 'Naquele dia, este cântico será entoado na terra de Judá: “Temos uma cidade forte[a]; ele estabelece a salvação como muralhas e fortificação externa[b][c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Temos uma cidade fortificada”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ele designa a salvação como muralhas e fortificação externa”. O hebraico não explicita o sujeito de “estabelece/designa”, embora no contexto seja geralmente entendido como Deus.'
    reason: alternative_reading
  - marker: c
    text: “Fortificação externa” traduz um termo hebraico que designa uma defesa exterior da cidade; tradicionalmente também se traduz por “baluarte”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Expressão temporal natural em português, preservando a força profética da fórmula hebraica.
- source_word: יוּשַׁר
  choice: será entoado
  rationale: 'O hophal de שׁיר tem sentido passivo: o cântico será cantado. “Entoado” é corrente e digno no contexto de um cântico público.'
- source_word: הַשִּׁיר הַזֶּה
  choice: este cântico
  rationale: Reproduz o substantivo sem acrescentar “de louvor”, que não aparece no hebraico.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: na terra de Judá
  rationale: Mantém אֶרֶץ de modo explícito e conserva o sentido geográfico e nacional.
- source_word: עִיר עָז לָנוּ
  choice: Temos uma cidade forte
  rationale: Expressa naturalmente em português a construção nominal com dativo de posse; “forte” preserva a imagem de segurança sem especificar além do texto.
- source_word: יְשׁוּעָה
  choice: a salvação
  rationale: É o equivalente direto e mantém a amplitude teológica e concreta do termo em Isaías; “livramento” também seria possível.
- source_word: יָשִׁית
  choice: ele estabelece
  rationale: Traduz o sentido de pôr, dispor ou estabelecer, mantendo o sujeito singular implícito sem identificá-lo expressamente.
- source_word: חוֹמוֹת
  choice: muralhas
  rationale: Preserva o plural hebraico e a imagem das defesas urbanas.
- source_word: וָחֵל
  choice: e fortificação externa
  rationale: Comunica em linguagem atual a ideia de uma obra defensiva exterior; “baluarte” é uma alternativa tradicional, porém menos transparente para muitos leitores.
theological_decisions:
- issue: Sujeito de יָשִׁית (“estabelece”)
  choice: Manter o sujeito singular implícito como “ele”, sem nomeá-lo.
  alternative: Explicitar “o SENHOR” ou usar uma construção impessoal.
  rationale: O contexto favorece Deus como agente, mas o hebraico não o nomeia nesta oração. A tradução conserva essa discrição e a tensão do texto.
- issue: Relação entre salvação e as defesas da cidade
  choice: “estabelece a salvação como muralhas e fortificação externa”
  alternative: “faz da salvação suas muralhas e seu baluarte” ou “designa a salvação para muralhas e baluarte”
  rationale: A formulação preserva a metáfora em que a salvação funciona como defesa da cidade, sem introduzir possessivos ausentes nem reduzir “salvação” a mera vitória militar.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. “Cântico” e “entoado” preservam o registro poético sem arcaísmo excessivo; “fortificação externa” prioriza transparência, enquanto a nota registra o tradicional “baluarte”.
