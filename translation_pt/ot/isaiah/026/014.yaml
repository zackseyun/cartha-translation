source:
  edition: WLC
  text: מֵתִים֙ בַּל יִחְי֔וּ רְפָאִ֖ים בַּל יָקֻ֑מוּ לָ/כֵ֤ן פָּקַ֨דְתָּ֙ וַ/תַּשְׁמִידֵ֔/ם וַ/תְּאַבֵּ֥ד כָּל זֵ֖כֶר לָֽ/מוֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/014.yaml
  text: The dead do not live[a]; the shades do not rise. Therefore you have punished them and destroyed them[c][b], and you have made all memory of them perish.
translation:
  language: pt
  text: Os mortos não tornarão a viver; as sombras[a] não se levantarão. Por isso, tu os castigaste[b] e os destruíste; apagaste toda lembrança deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os espíritos dos mortos”. O termo hebraico se refere aqui aos mortos no mundo dos mortos, não ao antigo povo chamado Refains.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “tu os chamaste a prestar contas”. O verbo hebraico pode significar “visitar”, tanto para favorecer como para julgar; neste contexto, a destruição mencionada em seguida indica castigo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵתִים
  choice: os mortos
  rationale: O termo é usado substantivamente e designa coletivamente os que morreram; “os mortos” é natural e direto em português.
- source_word: בַּל יִחְיוּ
  choice: não tornarão a viver
  rationale: A negação poética com o imperfeito admite valor presente ou futuro. No paralelismo, “não tornarão a viver” comunica de modo natural a impossibilidade de voltarem à vida, sem transformar a frase numa afirmação universal sobre todos os mortos.
- source_word: רְפָאִים
  choice: as sombras
  rationale: Aqui o termo designa os mortos no mundo dos mortos, como mostra o paralelismo com מֵתִים, e não o antigo povo dos refains. “Sombras” conserva a imagem poética e evita confusão étnica.
- source_word: בַּל יָקֻמוּ
  choice: não se levantarão
  rationale: Preserva o sentido amplo de קום — levantar-se, pôr-se de pé ou ressurgir — e seu paralelismo com “não tornarão a viver”.
- source_word: לָכֵן
  choice: Por isso
  rationale: Marca de modo claro e natural a relação de consequência expressa no hebraico.
- source_word: פָּקַדְתָּ
  choice: tu os castigaste
  rationale: Embora פקד tenha amplo campo semântico, as ações destrutivas que se seguem favorecem aqui o sentido de visitar para julgar ou punir.
- source_word: וַתַּשְׁמִידֵם
  choice: e os destruíste
  rationale: Expressa com força o verbo שׁמד, sem introduzir uma tese filosófica sobre aniquilação absoluta.
- source_word: וַתְּאַבֵּד כָּל זֵכֶר לָמוֹ
  choice: apagaste toda lembrança deles
  rationale: Reproduz idiomaticamente a eliminação completa de sua memória, mantendo a força do verbo אבד.
theological_decisions:
- issue: Sentido de רְפָאִים neste versículo
  choice: os mortos no mundo dos mortos (“as sombras”)
  alternative: os refains como antigo povo
  rationale: O paralelismo imediato com “os mortos” e com os verbos “viver” e “levantar-se” aponta para seres falecidos, não para um grupo étnico.
- issue: Alcance de “não se levantarão”
  choice: declaração poética da queda irreversível dos opressores julgados no contexto
  alternative: negação universal de qualquer ressurreição
  rationale: A tradução mantém a formulação do texto e sua tensão teológica, sem convertê-la numa declaração doutrinária universal que ultrapasse o contexto do poema.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. “Sombras” preserva a imagem do hebraico, esclarecida em nota; “apagaste toda lembrança deles” é idiomático e mantém a força do original.
