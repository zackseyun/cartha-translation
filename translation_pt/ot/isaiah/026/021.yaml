  terminology: «SENHOR» segue a convenção estabelecida para o tetragrama. «Castigar», «iniquidade», «sangue derramado» e «mortos» são escolhas compreensíveis e contextualizadas; em particular, «sangue derramado nela» explicita de forma moderada o idiomatismo hebraico sem impor uma interpretação doutrinária.
