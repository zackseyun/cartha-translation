  text: כִּֽי הִנֵּ֤ה יְהוָה֙ יֹצֵ֣א מִ/מְּקוֹמ֔/וֹ לִ/פְקֹ֛ד עֲוֺ֥ן יֹֽשֵׁב הָ/אָ֖רֶץ עָלָ֑י/ו וְ/גִלְּתָ֤ה הָ/אָ֨רֶץ֙ אֶת דָּמֶ֔י/הָ וְ/לֹֽא תְכַסֶּ֥ה ע֖וֹד עַל הֲרוּגֶֽי/הָ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/021.yaml
  text: For look, the LORD is coming out from his place to punish the iniquity of the inhabitant of the earth upon him, and the earth will uncover her blood and will no longer cover her slain.
translation:
  language: pt
  text: 'Pois vejam: o SENHOR está saindo do seu lugar para castigar os habitantes da terra por sua iniquidade. A terra revelará o sangue derramado nela e não mais encobrirá os seus mortos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: vejam
  rationale: Partícula de apresentação e ênfase que chama a atenção para a ação iminente; “vejam” é natural e mantém sua força discursiva.
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Segue a convenção portuguesa consolidada de representar o tetragrama por SENHOR em versaletes.
- source_word: לִפְקֹד
  choice: para castigar
  rationale: Neste contexto judicial, o verbo significa visitar para exigir contas ou punir; “castigar” comunica claramente essa função.
- source_word: עֲוֺן
  choice: iniquidade
  rationale: Preserva o teor moral e judicial do termo, que pode abranger tanto culpa quanto conduta perversa.
- source_word: דָּמֶיהָ
  choice: o sangue derramado nela
  rationale: O plural hebraico de “sangue” frequentemente designa sangue violentamente derramado e culpa de sangue; a formulação explicita o sentido idiomático sem apagar a imagem.
- source_word: הֲרוּגֶיהָ
  choice: os seus mortos
  rationale: Refere-se aos que foram mortos ou assassinados; “mortos” mantém concisão e combina naturalmente com a imagem de a terra não os encobrir.
theological_decisions:
- issue: Objeto e alcance do juízo divino
  choice: “castigar os habitantes da terra por sua iniquidade”
  alternative: “castigar sobre ele a iniquidade do habitante da terra”
  rationale: O hebraico singular coletivo יֹשֵׁב הָאָרֶץ e o sufixo עָלָיו apresentam a humanidade habitante da terra como objeto do acerto de contas. O plural coletivo produz português natural sem restringir nem ampliar o alcance teológico.
- issue: Personificação da terra como testemunha da violência
  choice: “A terra revelará o sangue derramado nela e não mais encobrirá os seus mortos”
  alternative: “a terra descobrirá seus sangues e não mais cobrirá seus mortos”
  rationale: Mantém a personificação e a ideia de que a violência oculta será exposta, sem determinar além do texto o mecanismo ou o momento desse juízo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução preserva a imagem profética da saída do SENHOR de seu lugar e da terra que expõe as vítimas, ao mesmo tempo que evita construções excessivamente literais e pouco naturais.
