  yaml_path: translation/ot/isaiah/026/004.yaml
  text: Trust in the LORD forever, for in Yah, the LORD, is an everlasting rock.
translation:
  language: pt
  text: Confiem no SENHOR para sempre, pois em Yah, o SENHOR, há uma Rocha eterna.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois Yah, o SENHOR, é uma Rocha eterna”. O hebraico diz literalmente: “pois em Yah, o SENHOR, [há/é] rocha das eternidades”.'
    reason: Registra a construção hebraica incomum, a cópula elíptica e a alternativa sintática possível, sem decidir a ambiguidade no corpo do texto.
lexical_decisions:
- source_word: בִּטְחוּ
  choice: Confiem
  rationale: Imperativo masculino plural de בטח; a forma plural inclusiva é natural em português moderno.
- source_word: בַיהוָה
  choice: no SENHOR
  rationale: Representa o nome divino יהוה segundo a convenção portuguesa de versaletes, sem inserir uma vocalização incerta no primeiro membro.
- source_word: עֲדֵי עַד
  choice: para sempre
  rationale: Expressão idiomática de duração ilimitada, vertida de modo claro e corrente.
- source_word: בְּיָהּ יְהוָה
  choice: em Yah, o SENHOR
  rationale: Preserva tanto a preposição בְּ quanto a forma abreviada do nome divino יָהּ, seguida pelo tetragrama, sem fundir os dois elementos.
- source_word: צוּר עוֹלָמִים
  choice: a Rocha eterna
  rationale: צוּר é metáfora de estabilidade e proteção; עוֹלָמִים expressa duração perpétua. A capitalização sinaliza o uso metafórico como designação divina.
theological_decisions:
- issue: Relação sintática e teológica de בְּיָהּ יְהוָה com צוּר עוֹלָמִים
  choice: pois em Yah, o SENHOR, está a Rocha eterna
  alternative: pois Yah, o SENHOR, é a Rocha eterna
  rationale: A tradução mantém explicitamente a preposição hebraica בְּ ('em') e evita convertê-la silenciosamente em uma cópula, preservando a formulação incomum e sua tensão interpretativa.
- issue: Representação dos nomes divinos יָהּ e יהוה
  choice: Yah, o SENHOR
  alternative: Javé, o SENHOR / o SENHOR Deus
  rationale: Distingue a forma abreviada יָהּ do tetragrama יהוה e acompanha a tradição editorial indicada, sem introduzir 'Deus', que não aparece no hebraico.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com imperativo plural brasileiro legível. Mantêm-se SENHOR em versaletes para יהוה e a forma Yah para יָהּ. A metáfora 'Rocha' é preservada em vez de explicada no texto.
