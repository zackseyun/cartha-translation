  naturalness: “Em Yah, o SENHOR, está a Rocha eterna” é compreensível, mas soa artificial em português e deixa pouco nítido o valor existencial/elíptico da oração. “Em Yah, o SENHOR, há uma Rocha eterna” conserva a preposição e dá uma frase portuguesa natural.
