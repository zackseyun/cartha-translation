  text: כִּ֤י הֵשַׁח֙ יֹשְׁבֵ֣י מָר֔וֹם קִרְיָ֖ה נִשְׂגָּבָ֑ה יַשְׁפִּילֶ֤/נָּה יַשְׁפִּילָ/הּ֙ עַד אֶ֔רֶץ יַגִּיעֶ֖/נָּה עַד עָפָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/005.yaml
  text: For he has brought down those who dwell on high[a], the lofty city; he lays it low, he lays it low to the earth; he brings it down to the dust.
translation:
  language: pt
  text: Pois ele rebaixou os que habitam nas alturas[a], a cidade elevada; ele a rebaixa, rebaixa-a até o chão; faz com que ela chegue até o pó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a cidade elevada” ou “a cidade situada no alto”. O hebraico não identifica a cidade pelo nome.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da confiança e do louvor no contexto, com valor explicativo natural em português.
- source_word: הֵשַׁח
  choice: rebaixou
  rationale: O hifil de שׁחח indica fazer baixar ou humilhar; “rebaixou” preserva tanto a imagem vertical quanto a ideia de humilhação.
- source_word: יֹשְׁבֵי מָרוֹם
  choice: os que habitam nas alturas
  rationale: Mantém a dimensão espacial e a possível conotação figurada de posição elevada ou segurança, sem especificar além do hebraico.
- source_word: קִרְיָה נִשְׂגָּבָה
  choice: a cidade elevada
  rationale: Traduz diretamente a cidade situada ou considerada em posição alta; a referência permanece genérica, como no texto hebraico.
- source_word: יַשְׁפִּילֶנָּה יַשְׁפִּילָהּ
  choice: ele a rebaixa, rebaixa-a
  rationale: Conserva a repetição enfática do verbo שׁפל e varia apenas a colocação pronominal para produzir poesia natural em português.
- source_word: עַד אֶרֶץ
  choice: até o chão
  rationale: No paralelismo com “pó”, אֶרֶץ designa concretamente o solo; “chão” comunica a imagem com naturalidade.
- source_word: יַגִּיעֶנָּה עַד עָפָר
  choice: faz com que chegue até o pó
  rationale: Preserva de modo transparente o sentido causativo de נגע, “fazer chegar/tocar”, e a imagem final de completa humilhação.
theological_decisions:
- issue: Identidade da cidade elevada
  choice: Não identificar a cidade pelo nome
  alternative: Identificá-la como Babilônia, como uma potência hostil específica ou como símbolo geral do orgulho humano
  rationale: O hebraico não nomeia a cidade; manter a referência genérica preserva a abertura poética e evita transformar interpretação em tradução.
- issue: Relação entre “os que habitam nas alturas” e “a cidade elevada”
  choice: Preservar a aposição ambígua do hebraico
  alternative: Entender apenas a cidade como estando nas alturas ou separar os habitantes da cidade
  rationale: A sintaxe permite associar estreitamente os habitantes elevados e a cidade elevada, sem esclarecer de forma definitiva se são duas descrições ou uma aposição explicativa.
translation_notes:
  register: Português moderno, digno e acessível, com cadência poética. A repetição verbal e o movimento descendente — alturas, chão, pó — foram mantidos.
