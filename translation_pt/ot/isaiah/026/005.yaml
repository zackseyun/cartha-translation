    rationale: A nota ligada a «os que habitam nas alturas» apresenta «os habitantes da cidade elevada», o que transforma a aposição ambígua em uma relação definida. É preferível registrar as alternativas lexicais para «cidade elevada/situada no alto» e manter a observação de que a cidade não é nomeada.
