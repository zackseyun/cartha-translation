  text: יֵ֣צֶר סָמ֔וּךְ תִּצֹּ֖ר שָׁל֣וֹם שָׁל֑וֹם כִּ֥י בְ/ךָ֖ בָּטֽוּחַ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/003.yaml
  text: You keep in perfect peace the mind that is stayed on you[c][b][a], because it trusts in you.
translation:
  language: pt
  text: Tu guardarás em perfeita paz[a] a mente firme[b], porque ela confia em ti.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “paz, paz”; a repetição intensifica a ideia de paz plena ou completa.'
    reason: lexical_alternative
  - marker: b
    text: Ou “a disposição firme”, “a inclinação firme” ou “a mente sustentada”.
    reason: lexical_alternative
  - marker: c
    text: 'Uma formulação tradicional é: “Tu guardarás em perfeita paz aquele cuja mente está firme em ti”. O hebraico menciona mais diretamente “a mente” ou “a disposição”, sem um pronome equivalente a “aquele”.'
    reason: alternative_reading
lexical_decisions:
- source_word: יֵצֶר
  choice: a mente
  rationale: O termo pode designar formação, inclinação, propósito ou disposição interior. Neste contexto, “mente” comunica de modo natural a orientação interior da pessoa, sem introduzir no texto um pronome pessoal inexistente no hebraico.
- source_word: סָמוּךְ
  choice: firme
  rationale: 'O particípio passivo de סמך exprime aquilo que está sustentado, apoiado ou firmemente estabelecido. “Firme” preserva o estado de estabilidade; a base dessa firmeza aparece na oração seguinte: a confiança em Deus.'
- source_word: תִּצֹּר
  choice: Tu guardarás
  rationale: נצר significa guardar, proteger ou preservar. “Guardarás” conserva a forma verbal da segunda pessoa masculina singular e se combina naturalmente com a ideia de manter alguém em paz.
- source_word: שָׁלוֹם שָׁלוֹם
  choice: em paz perfeita
  rationale: A repetição hebraica intensifica שָׁלוֹם e comunica paz plena ou completa. “Paz perfeita” reproduz essa força em português natural, enquanto a forma literal é registrada em nota.
- source_word: כִּי
  choice: porque
  rationale: 'Aqui a conjunção introduz a razão da preservação em paz: a confiança depositada em Deus.'
- source_word: בְךָ
  choice: em ti
  rationale: A preposição marca o objeto da confiança. “Confiar em ti” é a construção idiomática e semanticamente adequada em português.
- source_word: בָּטוּחַ
  choice: ela confia
  rationale: A forma de בטח pode descrever quem está confiante, seguro ou confiando. O pronome feminino retoma “a mente” em português e mantém a relação gramatical direta do hebraico, sem acrescentar um sujeito masculino pessoal.
theological_decisions:
- issue: Referência do objeto e linguagem antropológica
  choice: “a mente firme”, retomada por “ela”
  alternative: “aquele cuja mente está firme”
  rationale: O hebraico apresenta יֵצֶר, “mente/disposição”, diretamente, sem um pronome equivalente a “aquele”. A tradução conserva essa formulação incomum, mas inteligível, evitando harmonizá-la silenciosamente com a redação tradicional.
- issue: Sentido de סָמוּךְ
  choice: “firme”
  alternative: “apoiada em ti” ou “sustentada”
  rationale: “Firme” preserva o valor resultante do particípio sem deslocar בְךָ da oração “confia em ti” para a expressão anterior. A noção de apoio ou sustentação continua disponível em nota.
- issue: Intensificação de שָׁלוֹם
  choice: “paz perfeita”
  alternative: “paz, paz” ou “paz completa”
  rationale: A duplicação é enfática. “Paz perfeita” comunica em português a plenitude expressa pela repetição, e a forma hebraica literal é mantida em nota para preservar a textura poética.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. O futuro “guardarás” preserva a forma verbal hebraica; “tu” e “ti” mantêm a segunda pessoa singular de modo bíblico, mas ainda corrente. A ordem foi ajustada à sintaxe portuguesa sem eliminar a formulação antropológica incomum do original.
