  text: פִּתְח֖וּ שְׁעָרִ֑ים וְ/יָבֹ֥א גוֹי צַדִּ֖יק שֹׁמֵ֥ר אֱמֻנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/002.yaml
  text: Open the gates[a], that the righteous nation may enter, the one that keeps faithfulness.
translation:
  language: pt
  text: Abram os portões, para que entre a nação justa, que permanece fiel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que guarda a fidelidade”, “que guarda a verdade” ou “que mantém a fé”. O termo hebraico pode indicar fidelidade, confiabilidade, verdade ou fé, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּתְחוּ
  choice: Abram
  rationale: Imperativo qal plural de פתח; “Abram” é a ordem direta e natural em português.
- source_word: שְׁעָרִים
  choice: os portões
  rationale: O substantivo plural indica os portões da cidade no contexto; o artigo definido é natural em português.
- source_word: וְיָבֹא
  choice: para que entre
  rationale: A conjunção seguida do imperfeito, após o imperativo, pode expressar propósito ou resultado; esta formulação preserva essa relação e a imagem de entrada pelos portões.
- source_word: גוֹי צַדִּיק
  choice: a nação justa
  rationale: “Nação” preserva o sentido coletivo de גוֹי, e “justa” comunica o valor moral e pactual de צַדִּיק.
- source_word: שֹׁמֵר
  choice: que se mantém
  rationale: O particípio descreve continuamente a nação. Com “fiel”, a construção idiomática “se mantém fiel” transmite constância sem produzir o português pouco natural “guarda fidelidades”.
- source_word: אֱמֻנִים
  choice: fiel
  rationale: O plural abstrato/intensivo de אמן denota fidelidade, firmeza ou confiabilidade. Na expressão “se mantém fiel”, conserva-se a ideia de fidelidade perseverante em português corrente.
theological_decisions:
- issue: Sentido de אֱמֻנִים como característica da nação justa
  choice: que se mantém fiel
  alternative: que guarda a fidelidade; que preserva a verdade; que mantém a fé
  rationale: A opção principal comunica fidelidade constante sem reduzir o termo à crença subjetiva nem impor uma leitura doutrinária posterior. A nota preserva a amplitude lexical entre fidelidade, verdade e fé.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Portões” mantém a imagem urbana; “para que entre” expressa com clareza a finalidade. O marcador [a] aparece imediatamente após a expressão a que se refere.
