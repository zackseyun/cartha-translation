base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/009.yaml
  text: My soul has desired you in the night[a]; indeed, my spirit within me seeks you early. For when your judgments are in the earth[c][b], the inhabitants of the world learn righteousness.
translation:
  language: pt
  text: Minha alma ansiou por ti durante a noite; sim, meu espírito dentro de mim te busca ao amanhecer.[a] Pois, quando os teus juízos estão na terra,[b] os habitantes do mundo aprendem a justiça.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “te busca desde cedo” ou “te busca com empenho”. O verbo hebraico evoca a busca ao amanhecer e, por extensão, uma busca diligente.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “quando os teus juízos estão sobre a terra”. A expressão hebraica é concisa e pode indicar a presença ou a atuação dos juízos na terra.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “aprendem a retidão” ou “aprendem o que é justo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשִׁי
  choice: Minha alma
  rationale: Preserva a imagem poética do ser interior e o paralelismo com “meu espírito”, sem reduzir o termo simplesmente a “eu”.
- source_word: אִוִּיתִיךָ
  choice: anseia por ti
  rationale: O verbo expressa desejo intenso ou anelo; “anseia por ti” é natural em português e mantém a força afetiva do hebraico.
- source_word: בַּלַּיְלָה
  choice: durante a noite
  rationale: Expressa diretamente a circunstância temporal, em linguagem poética natural.
- source_word: אַף
  choice: sim
  rationale: Marca a progressão enfática e aditiva entre os dois membros do paralelismo sem tornar a frase pesada.
- source_word: רוּחִי בְקִרְבִּי
  choice: meu espírito dentro de mim
  rationale: Mantém tanto o termo antropológico “espírito” quanto a ênfase hebraica na interioridade do falante.
- source_word: אֲשַׁחֲרֶךָּ
  choice: te busca ao amanhecer
  rationale: Conserva a imagem lexical de buscar cedo ou ao romper do dia; a possível extensão idiomática de busca diligente é registrada em nota.
- source_word: כִּי כַּאֲשֶׁר
  choice: Pois, quando
  rationale: Representa a relação explicativa de כִּי e a circunstância temporal introduzida por כַּאֲשֶׁר.
- source_word: מִשְׁפָּטֶיךָ
  choice: os teus juízos
  rationale: Preserva a dimensão judicial do termo e permite entendê-lo como decisões ou atos de julgamento divinos.
- source_word: לָאָרֶץ
  choice: se manifestam na terra
  rationale: A oração hebraica é nominal e muito condensada. Esta formulação produz português claro sem limitar os juízos a uma modalidade específica; a forma mais literal é preservada em nota.
- source_word: צֶדֶק
  choice: a justiça
  rationale: “Justiça” é uma correspondência natural e abrangente em português, podendo incluir conduta reta e ordem justa; “retidão” permanece como alternativa em nota.
- source_word: לָמְדוּ
  choice: aprendem
  rationale: O presente comunica naturalmente o valor geral ou habitual da afirmação no contexto.
- source_word: יֹשְׁבֵי תֵבֵל
  choice: os habitantes do mundo
  rationale: Expressa com clareza o alcance universal da construção hebraica e mantém seu tom elevado.
theological_decisions:
- issue: Sentido de צֶדֶק no contexto dos juízos divinos
  choice: justiça
  alternative: retidão; o que é justo
  rationale: O termo hebraico reúne dimensões jurídicas, éticas e relacionais. “Justiça” preserva essa amplitude em português, enquanto a nota impede que se perca o sentido de retidão moral.
- issue: Natureza dos מִשְׁפָּטִים divinos
  choice: juízos
  alternative: atos de justiça; decisões judiciais
  rationale: “Juízos” mantém aberta a referência a decisões, normas ou intervenções judiciais de Deus, sem impor uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Mantiveram-se “alma”, “espírito” e “juízos” para conservar o paralelismo poético e a densidade conceitual do hebraico; as alternativas relevantes aparecem em notas.
