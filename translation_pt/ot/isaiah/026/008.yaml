source:
  edition: WLC
  text: אַ֣ף אֹ֧רַח מִשְׁפָּטֶ֛י/ךָ יְהוָ֖ה קִוִּינ֑וּ/ךָ לְ/שִׁמְ/ךָ֥ וּֽ/לְ/זִכְרְ/ךָ֖ תַּאֲוַת נָֽפֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/008.yaml
  text: Indeed[a], in the path of your judgments, O Yahweh, we have waited for you[b]; for your name and your remembrance are the desire of the soul.
translation:
  language: pt
  text: Sim, no caminho dos teus juízos, ó Yahweh, temos esperado por ti; por teu nome e por tua lembrança[a] anseia a alma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pela lembrança de ti”; o termo também pode significar “teu memorial” ou “teu renome”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Sim
  rationale: A partícula tem aqui força enfática ou asseverativa; “Sim” preserva essa ênfase com naturalidade poética em português.
- source_word: אֹרַח
  choice: caminho
  rationale: Mantém a imagem metafórica do hebraico e forma uma expressão natural com “dos teus juízos”.
- source_word: מִשְׁפָּטֶיךָ
  choice: teus juízos
  rationale: O termo pode abranger juízos, justiça ou ordenanças. “Juízos” conserva a tensão entre a ordem justa de Deus e seus atos judiciais no contexto de Isaías 26.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: קִוִּינוּךָ
  choice: esperamos por ti
  rationale: קוה expressa espera acompanhada de expectativa ou esperança. O perfeito hebraico pode ser vertido naturalmente pelo pretérito perfeito português, sem perder sua relevância presente.
- source_word: לְשִׁמְךָ
  choice: pelo teu nome
  rationale: Preserva literalmente “teu nome”, que pode envolver tanto o nome revelado de Deus como sua reputação.
- source_word: וּלְזִכְרְךָ
  choice: e pela tua memória
  rationale: זֵכֶר pode significar memória, lembrança, memorial ou renome. “Tua memória” mantém a concisão e o paralelismo com “teu nome”, embora admita outra formulação indicada em nota.
- source_word: תַּאֲוַת נָפֶשׁ
  choice: anseia a alma
  rationale: A construção nominal “desejo da alma” é expressa verbalmente para produzir português natural e poético, preservando o singular coletivo e a intensidade do anseio.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O original emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Sentido de מִשְׁפָּטֶיךָ
  choice: teus juízos
  alternative: tua justiça; tuas ordenanças
  rationale: “Juízos” mantém aberta a referência tanto aos atos judiciais de Deus como à sua justa ordem, sem limitar o termo à justiça abstrata ou a estatutos legais.
- issue: Pessoa implícita em תַּאֲוַת נָפֶשׁ
  choice: anseia a alma
  alternative: nossa alma anseia
  rationale: O hebraico diz literalmente “desejo de alma”, sem pronome possessivo. A tradução conserva essa formulação poética geral, evitando explicitar “nossa” além do texto.
translation_notes:
  register: Português moderno, digno e poético, com ampla legibilidade brasileira. A ordem foi levemente ajustada em “pelo teu nome e pela tua memória anseia a alma” para tornar clara a relação sintática. Conservam-se o paralelismo, o singular poético “a alma” e a ambiguidade semântica de “juízos”.
