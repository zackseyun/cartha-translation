id: ISA.26.10
reference: Isaiah 26:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יֻחַ֤ן רָשָׁע֙ בַּל לָמַ֣ד צֶ֔דֶק בְּ/אֶ֥רֶץ נְכֹח֖וֹת יְעַוֵּ֑ל וּ/בַל יִרְאֶ֖ה גֵּא֥וּת יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/010.yaml
  text: Though favor is shown to the wicked[a], he does not learn righteousness; in a land of uprightness he acts unjustly[e][d][c][b], and he does not see the majesty of Yahweh.
translation:
  language: pt
  text: Ainda que se mostre favor ao perverso[a], ele não aprende a justiça[b]; numa terra de retidão[c], age injustamente e não vê[d] a majestade[e] de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Se for mostrado favor ao perverso». A abertura hebraica pode ser entendida como condicional, em vez de concessiva.'
    reason: alternative_reading
  - marker: b
    text: «Justiça» também pode ser traduzida como «retidão».
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «numa terra justa» ou «numa terra de equidade».'
    reason: lexical_alternative
  - marker: d
    text: Aqui, «ver» tem o sentido de perceber ou reconhecer.
    reason: lexical_alternative
  - marker: e
    text: 'Ou: «a elevação» ou «a exaltação» de Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֻחַן
  choice: Ainda que se mostre favor
  rationale: O hofal de חנן expressa receber favor ou graça. A construção impessoal preserva a voz passiva, e «ainda que» comunica a força concessiva mais provável no contexto.
- source_word: רָשָׁע
  choice: ao perverso
  rationale: O adjetivo substantivado singular tem sentido representativo e genérico. «Perverso» é natural em português e mantém a caracterização moral sem acrescentar marca de gênero ao substantivo.
- source_word: בַּל לָמַד
  choice: não aprende
  rationale: בַּל nega diretamente a ação, e o qal de למד significa normalmente «aprender». O presente expressa bem a afirmação geral do versículo.
- source_word: צֶדֶק
  choice: a justiça
  rationale: צֶדֶק abrange justiça, retidão e aquilo que é correto. Neste contexto, «justiça» é clara e idiomática, sem limitar necessariamente o sentido ao âmbito judicial.
- source_word: בְּאֶרֶץ נְכֹחוֹת
  choice: numa terra de retidão
  rationale: נְכֹחוֹת evoca correção, retidão e ordem moral. «Terra de retidão» preserva a formulação figurada e a atmosfera ética do hebraico.
- source_word: יְעַוֵּל
  choice: age injustamente
  rationale: O piel de עול indica agir de maneira injusta ou errada. A tradução mantém o contraste ético com «justiça».
- source_word: וּבַל יִרְאֶה
  choice: e não vê
  rationale: ראה significa literalmente «ver», mas aqui pode envolver perceber ou reconhecer. O texto principal conserva a imagem hebraica, e a nota esclarece sua extensão sem a resolver em excesso.
- source_word: גֵּאוּת
  choice: a majestade
  rationale: גֵּאוּת pode indicar majestade, elevação ou exaltação. «Majestade» é natural para o referente divino e evita substituí-lo por «glória», termo associado a outros vocábulos hebraicos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino é transliterado como «Yahweh», preservando o nome pessoal presente no texto hebraico em vez de substituí-lo por um título.
theological_decisions:
- issue: Força concessiva ou condicional da oração inicial
  choice: 'Concessiva: «Ainda que se mostre favor ao perverso»'
  alternative: 'Condicional: «Se for mostrado favor ao perverso»'
  rationale: O contexto contrasta o favor recebido com a persistente recusa do perverso em aprender a justiça. A leitura concessiva comunica melhor essa força retórica, embora a construção hebraica também admita leitura condicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva o paralelismo e os contrastes do hebraico, enquanto as notas registram ambiguidades reais e alternativas lexicais relevantes.
