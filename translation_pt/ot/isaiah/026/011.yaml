review_pass:
  verdict: revise
  source_fidelity: A primeira oração é fiel. Contudo, «destinado aos teus inimigos» introduz uma finalidade que não está expressa no hebraico. A relação em אֵשׁ צָרֶיךָ é sintaticamente condensada e deve permanecer sem essa explicitação. Em קִנְאַת עָם, «teu» é uma resolução interpretativa possível, mas o hebraico não o explicita; uma formulação menos resolvida preserva melhor a ambiguidade.
  naturalness: O português do rascunho é claro e de registro apropriado. «Eles verão o zelo pelo povo e ficarão envergonhados» é natural, mantém a progressão do hebraico e evita que «diante de» imponha uma relação causal ou circunstancial mais específica.
  terminology: «Yahweh», «mão», «zelo», «povo», «fogo» e «inimigos» são adequados. «Consumirá» reproduz bem a imagem de fogo que devora. Mantém-se «Ó Yahweh» e a segunda pessoa singular coerente.
  issues:
  - severity: medium
    issue: «o fogo destinado aos teus inimigos» acrescenta a noção de destinação/finalidade.
    rationale: O hebraico diz literalmente «fogo, teus inimigos, ele os consumirá» e admite mais de uma análise da relação entre «fogo» e «teus inimigos». «Destinado a» seleciona uma interpretação que não é lexicalmente expressa.
  - severity: low
    issue: «teu zelo pelo povo» resolve como explícita uma posse/relação divina não marcada na expressão hebraica compacta.
    rationale: A leitura é contextualmente plausível, mas קִנְאַת עָם também pode ser entendida como «zelo do povo». A tradução principal pode conservar a abertura, com a alternativa registrada em nota.
  revised_text: Ó Yahweh, tua mão está erguida, mas eles não a veem. Eles verão o zelo pelo povo e ficarão envergonhados[a]; sim, o fogo consumirá os teus inimigos[b].
  revised_footnotes:
