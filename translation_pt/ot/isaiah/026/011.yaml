  text: יְהוָ֛ה רָ֥מָה יָדְ/ךָ֖ בַּל יֶחֱזָי֑וּ/ן יֶחֱז֤וּ וְ/יֵבֹ֨שׁוּ֙ קִנְאַת עָ֔ם אַף אֵ֖שׁ צָרֶ֥י/ךָ תֹאכְלֵֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/011.yaml
  text: O Yahweh[a], your hand is lifted up, but they do not see. They will see and be put to shame by the zeal for your people; indeed[b], the fire for your enemies will consume them.
translation:
  language: pt
  text: Ó Yahweh, tua mão está erguida, mas eles não a veem. Eles verão o zelo pelo povo e ficarão envergonhados[a]; sim, o fogo consumirá os teus inimigos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o zelo do povo”. A expressão hebraica é compacta e pode ser entendida de mais de uma maneira.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “o fogo dos teus inimigos os consumirá”. A construção hebraica permite uma relação genitiva diferente entre “fogo” e “teus inimigos”.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Ó Yahweh
  rationale: Translitera o nome divino e expressa naturalmente o vocativo marcado pelo contexto.
- source_word: רָמָה יָדְךָ
  choice: tua mão está erguida
  rationale: Preserva a imagem hebraica da mão elevada, sinal de ação ou poder divino, sem explicá-la além do texto.
- source_word: בַּל יֶחֱזָיוּן
  choice: mas eles não a veem
  rationale: O pronome retoma naturalmente 'mão' em português; 'veem' mantém a simplicidade do verbo hebraico.
- source_word: יֶחֱזוּ וְיֵבֹשׁוּ
  choice: Eles verão e ficarão envergonhados
  rationale: Mantém a reversão retórica entre a cegueira presente e o reconhecimento futuro, com a consequente vergonha.
- source_word: קִנְאַת עָם
  choice: diante do teu zelo pelo povo
  rationale: A expressão hebraica é compacta. 'Zelo pelo povo' comunica a leitura contextual provável, enquanto a nota preserva a alternativa genitiva.
- source_word: אַף
  choice: sim
  rationale: Reproduz de modo natural a força enfática e progressiva da partícula.
- source_word: אֵשׁ צָרֶיךָ תֹאכְלֵם
  choice: o fogo destinado aos teus inimigos os consumirá
  rationale: Preserva a construção em que 'fogo' é o sujeito e o sufixo de 'consumirá' remete aos inimigos, sem transformar a imagem em explicação abstrata de juízo.
theological_decisions:
- issue: Sentido de קִנְאַת עָם
  choice: o zelo de Yahweh pelo povo
  alternative: o zelo do povo
  rationale: O contexto de vindicação e a referência subsequente aos inimigos de Yahweh favorecem o zelo divino em favor do povo, mas a forma genitiva hebraica admite a outra leitura, registrada em nota.
- issue: Relação sintática de אֵשׁ צָרֶיךָ
  choice: fogo destinado aos teus inimigos
  alternative: o fogo dos teus inimigos
  rationale: A leitura escolhida se ajusta ao juízo divino no contexto e ao pronome objeto plural em 'os consumirá'; a construção hebraica, porém, também pode ser entendida como genitivo, por isso a alternativa é preservada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa singular coerentes com a invocação direta a Yahweh. As ambiguidades sintáticas relevantes são mantidas em notas.
