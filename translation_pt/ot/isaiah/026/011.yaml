    text: 'Ou: “o zelo do povo”. A expressão hebraica é compacta e pode ser entendida de mais de uma maneira.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “o fogo dos teus inimigos os consumirá”. A construção hebraica permite uma relação genitiva diferente entre “fogo” e “teus inimigos”.'
    reason: alternative_reading
  revision_rationale: A revisão retira a finalidade acrescentada em «destinado aos teus inimigos» e preserva, tanto no texto como nas notas, as construções compactas e discutidas do hebraico. A redação resultante continua moderna, clara e apropriada para leitura em português.
