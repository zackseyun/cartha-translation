source:
  edition: WLC
  text: יְהוָ֕ה תִּשְׁפֹּ֥ת שָׁל֖וֹם לָ֑/נוּ כִּ֛י גַּ֥ם כָּֽל מַעֲשֵׂ֖י/נוּ פָּעַ֥לְתָּ לָּֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/012.yaml
  text: O Yahweh[a], you will establish peace for us[b], for indeed you have accomplished all our works for us.
translation:
  language: pt
  text: Ó SENHOR[a], tu estabelecerás a paz[b] para nós, pois, de fato, realizaste para nós todas as nossas obras.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH, o nome pessoal de Deus; tradicionalmente traduzido por “SENHOR”.'
    reason: divine_name
  - marker: b
    text: “Paz” também pode incluir o sentido de bem-estar, plenitude e integridade.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “realizaste em nós todas as nossas obras”. O hebraico também permite que a ação de Deus no seu povo seja enfatizada, embora “para nós” reflita mais diretamente a preposição empregada aqui.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Ó SENHOR
  rationale: Emprega a forma tradicional portuguesa para o nome da aliança; “Ó” expressa com naturalidade o vocativo da oração.
- source_word: תִּשְׁפֹּת
  choice: tu estabelecerás
  rationale: Comunica o sentido de dispor ou firmar, preservando a forma verbal futura e evitando o tom mais carregado de “ordenarás”.
- source_word: שָׁלוֹם
  choice: a paz
  rationale: É a correspondência principal e natural, embora o hebraico também inclua bem-estar e integridade, nuance registrada em nota.
- source_word: לָנוּ
  choice: para nós
  rationale: Com “estabelecer a paz”, a preposição ל indica naturalmente benefício.
- source_word: כִּי גַּם
  choice: pois, de fato
  rationale: Preserva tanto a relação explicativa/causal quanto a ênfase de גַּם em português corrente.
- source_word: כָּל מַעֲשֵׂינוּ
  choice: todas as nossas obras
  rationale: Mantém de modo transparente a referência aos feitos ou realizações do povo sem especificar demais sua natureza.
- source_word: פָּעַלְתָּ
  choice: realizaste
  rationale: Expressa a ação eficaz de produzir ou levar a cabo e combina naturalmente com “obras”.
- source_word: לָּנוּ
  choice: para nós
  rationale: Reflete mais diretamente o valor benefactivo de ל, sem excluir em nota a interpretação tradicional “em nós”.
theological_decisions:
- issue: Agência em “todas as nossas obras realizaste para nós”
  choice: Atribuir a Deus a realização das obras do povo em favor dele, sem explicar de que modo a agência humana se relaciona com a divina.
  alternative: “Realizaste em nós todas as nossas obras” ou “fizeste por nós tudo o que foi feito”.
  rationale: O hebraico mantém em tensão “nossas obras” e a ação eficaz de Deus. “Para nós” representa mais diretamente a preposição ל, enquanto a nota conserva a possibilidade de entendê-la como ação divina “em nós”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O paralelismo e a tensão entre as obras humanas e a ação divina foram preservados; as notas esclarecem o nome divino, a amplitude de shalom e a ambiguidade da preposição final.
