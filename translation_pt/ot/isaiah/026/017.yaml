id: ISA.26.17
reference: Isaiah 26:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כְּמ֤וֹ הָרָה֙ תַּקְרִ֣יב לָ/לֶ֔דֶת תָּחִ֥יל תִּזְעַ֖ק בַּ/חֲבָלֶ֑י/הָ כֵּ֛ן הָיִ֥ינוּ מִ/פָּנֶ֖י/ךָ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/017.yaml
  text: Like a pregnant woman who is about to give birth writhes and cries out in her labor pains[a], so were we before you, O Yahweh.
translation:
  language: pt
  text: Como a mulher grávida, prestes a dar à luz, se contorce e grita nas dores do parto, assim estávamos nós diante de ti[a], ó Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na tua presença”; a expressão hebraica se refere literalmente a estar diante da face ou presença de Yahweh. Alguns a entendem como “por tua causa”.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּמוֹ
  choice: Como
  rationale: Introduz naturalmente a comparação e preserva a força do símile.
- source_word: הָרָה
  choice: a mulher grávida
  rationale: Expressão clara e corrente para a mulher que está gestando.
- source_word: תַּקְרִיב לָלֶדֶת
  choice: prestes a dar à luz
  rationale: Comunica de modo idiomático a proximidade do parto expressa pelo hifil de קרב com o infinitivo de ילד.
- source_word: תָּחִיל
  choice: se contorce
  rationale: No contexto do parto, preserva a imagem corporal vívida das contrações e do sofrimento.
- source_word: תִּזְעַק
  choice: grita
  rationale: Representa um clamor forte sem recorrer a uma formulação excessivamente rebuscada.
- source_word: בַּחֲבָלֶיהָ
  choice: nas dores do parto
  rationale: חבל designa aqui as dores ou contrações do parto; a formulação é natural e inequívoca em português.
- source_word: כֵּן
  choice: assim
  rationale: Marca de modo conciso a conclusão da comparação.
- source_word: הָיִינוּ
  choice: estávamos nós
  rationale: Traduz o perfeito qal na descrição da condição coletiva e mantém uma ordem enfática e digna depois de “assim”.
- source_word: מִפָּנֶיךָ
  choice: diante de ti
  rationale: Preserva a imagem hebraica de estar perante a face ou presença de Deus, sem decidir que a expressão seja explicitamente causal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: ó Yahweh
  alternative: ó SENHOR; ó Javé
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e acompanha a política indicada, sem substituí-lo por um título.
- issue: Sentido de מִפָּנֶיךָ na comparação
  choice: diante de ti
  alternative: por tua causa; na tua presença
  rationale: A expressão literalmente se relaciona à face ou presença de Yahweh e pode admitir nuance causal. “Diante de ti” conserva a ambiguidade e a tensão entre presença divina e aflição.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe conserva o paralelismo poético e a intensidade da imagem do parto; o pronome “ti” mantém o tratamento singular presente no hebraico.
