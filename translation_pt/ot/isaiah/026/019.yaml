source:
  edition: WLC
  text: יִֽחְי֣וּ מֵתֶ֔י/ךָ נְבֵלָתִ֖/י יְקוּמ֑וּ/ן הָקִ֨יצוּ וְ/רַנְּנ֜וּ שֹׁכְנֵ֣י עָפָ֗ר כִּ֣י טַ֤ל אוֹרֹת֙ טַלֶּ֔/ךָ וָ/אָ֖רֶץ רְפָאִ֥ים תַּפִּֽיל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/019.yaml
  text: Your dead will live[a]; my dead bodies will rise. Awake and shout for joy, you who dwell in the dust! For your dew is a dew of lights[c][b], and the earth will cast out the dead.
translation:
  language: pt
  text: Os teus mortos viverão; os meus cadáveres se levantarão.[a] Despertem e gritem de alegria, vocês que habitam no pó! Pois o teu orvalho é orvalho de luzes[b], e a terra expulsará os mortos.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “meu cadáver se levantará”. O hebraico traz literalmente “meu cadáver”, com sufixo de primeira pessoa, mas o verbo está no plural, o que favorece aqui um sentido coletivo: “meus cadáveres”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “orvalho de luz” ou “orvalho radiante”. A expressão hebraica é difícil e pode sugerir um orvalho luminoso que dá vida.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “as sombras dos mortos”. O termo hebraico רְפָאִים pode designar os falecidos, imaginados como habitantes sombrios do mundo dos mortos.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵתֶיךָ
  choice: os teus mortos
  rationale: O plural construto com sufixo de segunda pessoa masculina singular é vertido de modo direto e idiomático, sem definir se o destinatário é Deus ou Sião.
- source_word: נְבֵלָתִי
  choice: os meus cadáveres
  rationale: נְבֵלָה designa cadáver ou corpo morto. Embora a forma hebraica seja singular com sufixo de primeira pessoa, o verbo seguinte está no plural; a tradução emprega o plural coletivo e conserva o possessivo.
- source_word: יְקוּמוּן
  choice: se levantarão
  rationale: O qal de קום, neste contexto de retorno dos mortos à vida, indica levantar-se; a forma reflexiva é natural em português e mantém a imagem corporal.
- source_word: הָקִיצוּ
  choice: Despertem
  rationale: O imperativo plural convoca os que habitam no pó a acordar, preservando a imagem da morte como sono.
- source_word: וְרַנְּנוּ
  choice: gritem de alegria
  rationale: רנן expressa júbilo audível e intenso. A formulação é clara e vigorosa em português sem restringir necessariamente a ação ao canto.
- source_word: שֹׁכְנֵי עָפָר
  choice: vocês que habitam no pó
  rationale: Mantém o endereço direto e a metáfora do pó como morada dos mortos.
- source_word: טַל אוֹרֹת
  choice: orvalho de luzes
  rationale: A tradução formal conserva o plural incomum אוֹרֹת e sua imagem ambígua, sem decidir entre luz, brilho ou poder vivificante.
- source_word: רְפָאִים
  choice: os mortos
  rationale: Neste contexto, o termo se refere aos falecidos associados ao mundo dos mortos, não ao povo chamado refains. A alternativa mais imagética é registrada em nota.
- source_word: תַּפִּיל
  choice: expulsará
  rationale: O hifil de נפל apresenta a terra fazendo os mortos sair dela. “Expulsará” preserva a força da imagem, sem introduzir explicitamente a metáfora de parto.
theological_decisions:
- issue: Linguagem de ressurreição em contexto poético-profético
  choice: Traduzir diretamente como retorno corporal dos mortos à vida, preservando ao mesmo tempo a função poética e coletiva da esperança.
  alternative: Entender tudo exclusivamente como metáfora da restauração nacional.
  rationale: A sequência de viver, levantar-se, despertar do pó e ser expulso pela terra sustenta linguagem real de ressurreição, mas a tradução não exclui sua dimensão corporativa no contexto profético.
- issue: Referência do falante em “meus cadáveres”
  choice: Conservar o possessivo de primeira pessoa do texto massorético.
  alternative: Harmonizar como “teus cadáveres” ou “seus cadáveres”.
  rationale: A identificação precisa do falante é discutida; manter a primeira pessoa preserva a evidência textual e a ambiguidade em vez de resolvê-la por emenda.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de tratamento de leitura natural no Brasil. A colocação pronominal e o vocabulário evitam arcaísmo excessivo. A expressão deliberadamente incomum “orvalho de luzes” conserva a dificuldade poética do hebraico, esclarecida em nota.
