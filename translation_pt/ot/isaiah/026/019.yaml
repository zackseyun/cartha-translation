  source_fidelity: 'A tradução acompanha com precisão o texto massorético: mantém o contraste entre “os teus mortos” (מֵתֶיךָ) e “os meus cadáveres” (נְבֵלָתִי), preserva o plural de יְקוּמוּן, o imperativo dirigido aos habitantes do pó e a imagem forte de a terra expelir os mortos. “Orvalho de luzes” conserva adequadamente a formulação hebraica incomum e debatida, sem a resolver de modo excessivo.'
