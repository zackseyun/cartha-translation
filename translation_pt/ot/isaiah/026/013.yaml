  text: יְהוָ֣ה אֱלֹהֵ֔י/נוּ בְּעָל֥וּ/נוּ אֲדֹנִ֖ים זֽוּלָתֶ֑/ךָ לְ/בַד בְּ/ךָ֖ נַזְכִּ֥יר שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/013.yaml
  text: O Yahweh our God[a], other lords besides you have ruled over us, but through you alone we make mention of your name.
translation:
  language: pt
  text: Ó Yahweh, nosso Deus, outros senhores além de ti nos dominaram; mas somente por meio de ti mencionamos o teu nome.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «somente em ti mencionamos o teu nome». A preposição hebraica traduzida por «por meio de/em» pode ser entendida de mais de uma maneira.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Ó Yahweh
  rationale: Translitera o nome divino e acrescenta «Ó» para expressar o vocativo da oração.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Neste vocativo dirigido a Yahweh, אֱלֹהִים tem sentido singular, e o sufixo indica a primeira pessoa do plural.
- source_word: בְּעָלוּנוּ
  choice: nos dominaram
  rationale: O verbo בעל comunica domínio ou senhorio. A formulação direta é natural em português e mantém a ideia de sujeição.
- source_word: אֲדֹנִים
  choice: senhores
  rationale: Preserva a designação ampla do hebraico, que pode abranger governantes humanos ou poderes rivais sem decidir a referência.
- source_word: זוּלָתֶךָ
  choice: além de ti
  rationale: Expressa exclusão ou contraste de maneira corrente e digna em português.
- source_word: לְבַד
  choice: somente
  rationale: Marca a exclusividade enfatizada pela expressão hebraica.
- source_word: בְּךָ
  choice: por meio de ti
  rationale: Entende a preposição בְּ em sentido instrumental, mas a alternativa locativa «em ti» é preservada em nota.
- source_word: נַזְכִּיר
  choice: mencionamos
  rationale: O hifil de זכר pode significar fazer lembrar ou mencionar. «Mencionamos» conserva de perto a expressão hebraica sem explicitar indevidamente proclamação, confissão ou culto.
- source_word: שְׁמֶךָ
  choice: o teu nome
  rationale: Tradução direta que preserva a importância do nome divino no contexto sem acrescentar uma interpretação ao texto.
theological_decisions:
- issue: Identidade dos «outros senhores»
  choice: Manter a designação aberta «outros senhores».
  alternative: Especificá-los como governantes estrangeiros, opressores humanos, ídolos ou falsos deuses.
  rationale: O verbo favorece a noção de domínio efetivo, mas o hebraico não obriga a restringir os senhores a uma única categoria; a tradução conserva essa tensão.
- issue: Sentido de בְּךָ לְבַד
  choice: «somente por meio de ti» no texto principal.
  alternative: «somente em ti» ou «somente por ti».
  rationale: A preposição hebraica pode indicar instrumento ou esfera. A leitura instrumental oferece uma frase clara em português, enquanto a nota preserva a alternativa locativa genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome «ti» mantém a concordância natural com o vocativo singular e o tom de oração. A ordem e a concisão do hebraico foram preservadas sem tornar a frase artificial.
