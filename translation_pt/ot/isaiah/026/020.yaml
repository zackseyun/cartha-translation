  text: לֵ֤ךְ עַמִּ/י֙ בֹּ֣א בַ/חֲדָרֶ֔י/ךָ וּֽ/סְגֹ֥ר דלתי/ך בַּעֲדֶ֑/ךָ חֲבִ֥י כִ/מְעַט רֶ֖גַע עַד יעבור זָֽעַם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/020.yaml
  text: Go[a], my people, enter your rooms, and shut your doors behind you[c][b]; hide yourselves for a little moment until the wrath has passed by.
translation:
  language: pt
  text: Vá, meu povo, entre nos seus aposentos[a] e feche as portas atrás de si. Esconda-se por um breve momento, até que passe a ira[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “quartos interiores” ou “câmaras”. O termo hebraico pode indicar aposentos privados no interior de uma casa.
    reason: lexical_alternative
  - marker: b
    text: Ou “a indignação”. O texto hebraico não declara explicitamente de quem é essa ira.
    reason: alternative_reading
lexical_decisions:
- source_word: לֵךְ
  choice: Vá
  rationale: Imperativo qal masculino singular de הלך. “Vá” expressa de modo direto e natural a convocação dirigida ao povo como unidade coletiva.
- source_word: עַמִּי
  choice: meu povo
  rationale: עם com sufixo de primeira pessoa singular constitui a forma profética e relacional de tratamento “meu povo”.
- source_word: בֹּא
  choice: entre
  rationale: O imperativo de בוא indica movimento para dentro; “entre” combina naturalmente com “aposentos”.
- source_word: בַחֲדָרֶיךָ
  choice: nos seus aposentos
  rationale: חדר pode designar quarto, câmara ou compartimento interior. “Aposentos” conserva a ideia de espaços privados e fechados sem soar excessivamente técnico.
- source_word: וּסְגֹר דלתיך בַּעֲדֶךָ
  choice: e feche atrás de si as suas portas
  rationale: A expressão descreve o fechamento das portas depois que a pessoa entra. “Atrás de si” preserva o valor idiomático de בעדך e mantém a referência coletiva singular ao povo.
- source_word: חֲבִי
  choice: Esconda-se
  rationale: O imperativo ordena que o povo se oculte. O singular reflexivo é natural em português porque “povo” é tratado como uma unidade coletiva; evita-se transformar explicitamente o destinatário em plural.
- source_word: כִמְעַט רֶגַע
  choice: por um breve momento
  rationale: A combinação de מעט e רגע indica duração curta. “Por um breve momento” é corrente, conciso e mantém o tom solene.
- source_word: עַד יַעֲבוֹר
  choice: até que passe
  rationale: עד com o imperfeito de עבר marca o término do período de ocultação. “Até que passe” preserva a imagem de algo que passa, sem reduzi-la simplesmente a “acabar”.
- source_word: זָעַם
  choice: a ira
  rationale: זעם designa ira ou indignação, frequentemente no contexto de juízo profético. “Ira” preserva seu peso teológico sem explicitar um agente que o hebraico deixa implícito.
theological_decisions:
- issue: Referente e força de זָעַם
  choice: a ira
  alternative: a indignação
  rationale: O texto não identifica expressamente de quem é a ira. A tradução mantém o agente implícito, permitindo que o contexto profético indique juízo divino sem acrescentar “do SENHOR” ao versículo.
- issue: Número gramatical no tratamento do povo
  choice: 'Imperativos e reflexivo no singular: “Vá”, “entre”, “feche”, “Esconda-se”'
  alternative: 'Formas plurais dirigidas aos membros do povo: “Vão”, “entrem”, “fechem”, “escondam-se”'
  rationale: O hebraico se dirige a “meu povo” como entidade coletiva, predominantemente por formas singulares. O português permite conservar essa personificação coletiva com concordância singular natural.
translation_notes:
  register: Português moderno, claro e solene, com tratamento coletivo no singular. “Aposentos” evita tanto a banalidade potencial de “quartos” quanto o tom arcaico de “câmaras”; as alternativas são registradas em nota. A ordem “feche atrás de si as suas portas” explicita naturalmente a relação espacial da expressão hebraica sem acrescentar conteúdo interpretativo.
