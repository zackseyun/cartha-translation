  text: יָסַ֤פְתָּ לַ/גּוֹי֙ יְהוָ֔ה יָסַ֥פְתָּ לַ/גּ֖וֹי נִכְבָּ֑דְתָּ רִחַ֖קְתָּ כָּל קַצְוֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/015.yaml
  text: You have increased the nation[a], O Yahweh; you have increased the nation; you have gained glory[b]; you have extended all the borders of the land.
translation:
  language: pt
  text: Aumentaste a nação, ó Yahweh; aumentaste a nação; foste glorificado[a]; estendeste todos os limites do território[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foste honrado” ou “tornaste-te glorioso”.
    reason: lexical_alternative
  - marker: b
    text: Ou “todos os confins da terra”. A expressão também pode referir-se aos extremos da terra, mas, no contexto, provavelmente se refere aos limites do território.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסַפְתָּ
  choice: aumentaste
  rationale: O verbo יסף com ל e um substantivo coletivo expressa aumento ou ampliação. “Aumentaste” é natural em português e preserva a repetição enfática.
- source_word: לַגּוֹי
  choice: a nação
  rationale: גּוֹי designa normalmente uma nação ou povo; o singular definido do hebraico é mantido.
- source_word: יְהוָה
  choice: ó Yahweh
  rationale: Preserva o nome divino expresso pelo Tetragrama, com a partícula vocativa exigida pelo contexto.
- source_word: נִכְבָּדְתָּ
  choice: foste glorificado
  rationale: O nifal de כבד pode indicar que Yahweh foi honrado ou se mostrou glorioso. A forma passiva reproduz de modo conciso a voz hebraica sem definir quem lhe atribuiu glória.
- source_word: רִחַקְתָּ
  choice: estendeste
  rationale: Neste contexto, o hifil de רחק indica tornar distantes os limites, isto é, estendê-los ou ampliá-los.
- source_word: כָּל קַצְוֵי אָרֶץ
  choice: todos os limites da terra
  rationale: קצה pode significar extremidade, borda ou limite. A referência ao aumento da nação favorece limites territoriais; “terra” preserva a ambiguidade de אָרֶץ entre território e mundo.
theological_decisions:
- issue: Sentido e agência em נִכְבָּדְתָּ
  choice: foste glorificado
  alternative: mostraste a tua glória / foste honrado
  rationale: A forma nifal permite nuances passiva, resultativa ou reflexiva. O texto principal conserva a voz passiva, enquanto a nota registra alternativas sem resolver indevidamente a agência.
- issue: Alcance de אָרֶץ
  choice: terra entendida contextualmente como território
  alternative: mundo inteiro
  rationale: O paralelismo entre o aumento da nação e o afastamento de seus limites favorece o sentido territorial, mas a expressão hebraica também pode ser entendida como “confins da terra” em alcance global.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. A repetição hebraica foi preservada; “Yahweh” mantém o nome divino, e as ambiguidades relevantes são registradas em notas.
