  rationale: A revisão é limitada à primeira imagem e à construção comparativa. «Concebemos» é uma equivalência lexical direta e mais inclusiva para a voz coletiva; a nota preserva «Ficamos grávidos». O mais-que-perfeito em «tivéssemos dado à luz» harmoniza a sintaxe portuguesa com a sequência de perfeitos hebraicos. Não se altera a ambiguidade interpretativa da última oração, que continua refletida na nota.
