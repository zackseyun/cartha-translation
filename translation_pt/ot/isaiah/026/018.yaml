  text: הָרִ֣ינוּ חַ֔לְנוּ כְּמ֖וֹ יָלַ֣דְנוּ ר֑וּחַ יְשׁוּעֹת֙ בַּל נַ֣עֲשֶׂה אֶ֔רֶץ וּ/בַֽל יִפְּל֖וּ יֹשְׁבֵ֥י תֵבֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/018.yaml
  text: We were pregnant[a], we writhed in labor; as it were, we gave birth to wind. We accomplished no deliverance in the earth[c][b], and the inhabitants of the world were not born.
translation:
  language: pt
  text: Concebemos[a], tivemos dores de parto; foi como se tivéssemos dado à luz vento[b]. Não realizamos nenhum livramento na terra, e os habitantes do mundo não caíram[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ficamos grávidos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o sopro” ou “o espírito”; a palavra hebraica pode significar “vento”, “sopro” ou “espírito”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “não vieram ao mundo” ou “não nasceram”. O verbo normalmente significa “cair”, mas alguns entendem que aqui ele dá continuidade à imagem do parto.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָרִינוּ
  choice: Ficamos grávidos
  rationale: O qal perfeito de הרה expressa conceber ou ficar grávida. A formulação mantém o início da metáfora e conduz naturalmente às dores de parto.
- source_word: חַ֔לְנוּ
  choice: tivemos dores de parto
  rationale: No contexto de parto, חול/חיל designa as dores ou contorções do trabalho de parto. A expressão é atual, clara e conserva a intensidade da imagem.
- source_word: כְּמוֹ
  choice: foi como se
  rationale: Introduz uma comparação qualificada e preserva o caráter figurado, quase irônico, do resultado do parto.
- source_word: יָלַדְנוּ
  choice: déssemos à luz
  rationale: ילד é o verbo usual para dar à luz. A locução portuguesa é natural e preserva explicitamente a imagem do parto.
- source_word: רוּחַ
  choice: vento
  rationale: Embora possa significar também “sopro” ou “espírito”, neste lamento “vento” comunica melhor o resultado vazio e inútil das dores de parto.
- source_word: יְשׁוּעֹת
  choice: livramento
  rationale: O plural de ישׁע pode indicar atos de salvação, livramentos ou vitórias. O singular coletivo “livramento” produz português natural sem impor um sentido estritamente espiritual.
- source_word: בַּל
  choice: nenhum / não
  rationale: A negação poética foi expressa de modo idiomático em cada oração.
- source_word: נַעֲשֶׂה אֶרֶץ
  choice: não realizamos nenhum livramento na terra
  rationale: עשה com um substantivo abstrato pode significar realizar ou produzir algo. “Na terra” mantém a possibilidade de אֶרֶץ se referir tanto à terra habitada em sentido amplo quanto à terra do povo.
- source_word: יִפְּלוּ
  choice: não caíram
  rationale: O sentido lexical normal de נפל é “cair”. A possível continuação da metáfora do parto é relevante, mas permanece uma interpretação contextual e por isso é indicada em nota.
- source_word: יֹשְׁבֵי תֵבֵל
  choice: os habitantes do mundo
  rationale: Expressão corrente para os que habitam o mundo; “mundo” distingue תבל de אֶרֶץ e conserva o paralelismo poético.
theological_decisions:
- issue: Sentido de רוּחַ na metáfora do parto
  choice: vento
  alternative: sopro; espírito
  rationale: O contexto lamenta esforços que não produziram livramento. “Vento” preserva a imagem de vazio ou inutilidade; “espírito” poderia introduzir uma conotação pneumatológica não exigida pelo texto.
- issue: Interpretação de יִפְּלוּ na oração final
  choice: não caíram
  alternative: não vieram ao mundo; não nasceram
  rationale: A tradução principal mantém o sentido comum do verbo sem resolver silenciosamente a tensão do texto. A leitura ligada ao nascimento continua plausível por causa da metáfora dominante e é preservada em nota.
- issue: Alcance de אֶרֶץ
  choice: na terra
  alternative: na nossa terra; à terra
  rationale: O hebraico não determina por si só se a referência é local ou mundial. A redação escolhida conserva essa abertura e se relaciona naturalmente com “mundo” na oração seguinte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A imagem corporal do parto foi mantida sem arcaísmos. “Livramento” evita restringir יְשׁוּעֹת à salvação espiritual, e as ambiguidades de רוּחַ, יִפְּלוּ e אֶרֶץ não foram eliminadas.
