  text: תִּרְמְסֶ֖/נָּה רָ֑גֶל רַגְלֵ֥י עָנִ֖י פַּעֲמֵ֥י דַלִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/006.yaml
  text: The foot tramples it— the feet of the poor[b][a], the steps of the needy.
translation:
  language: pt
  text: O pé a pisoteia — os pés do pobre, os passos dos necessitados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O pé a pisoteará”. A forma verbal hebraica também pode ter sentido futuro neste contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּרְמְסֶנָּה
  choice: a pisoteia
  rationale: O verbo רמס significa “pisotear, calcar”. A forma verbal tem sujeito feminino singular (“o pé”, רָגֶל, palavra feminina em hebraico) e sufixo de objeto feminino singular, que retoma naturalmente a cidade elevada do versículo anterior. O presente comunica a vivacidade poética; o futuro também é possível no contexto.
- source_word: רָגֶל
  choice: O pé
  rationale: O substantivo singular é usado poeticamente e depois desenvolvido pela expressão paralela “os pés do pobre”. Manter o singular preserva a imagem hebraica.
- source_word: רַגְלֵי עָנִי
  choice: os pés do pobre
  rationale: O construto plural רַגְלֵי significa “os pés de”, e עָנִי pode designar alguém pobre, aflito ou oprimido. “O pobre” é claro, natural e adequado ao contexto de inversão social.
- source_word: פַּעֲמֵי
  choice: os passos dos
  rationale: פַּעֲמֵי significa “passos” ou “passadas” e forma um paralelismo poético natural com “os pés do”.
- source_word: דַלִּים
  choice: necessitados
  rationale: דַלִּים pode indicar pessoas fracas, humildes, pobres ou necessitadas. “Necessitados” preserva alguma distinção em relação a עָנִי (“pobre”) e expressa sua condição vulnerável sem inserir uma interpretação denominacional.
theological_decisions:
- issue: Referente do sufixo feminino em תִּרְמְסֶנָּה
  choice: O pronome “a” retoma a cidade elevada, humilhada no versículo 5.
  alternative: Deixar o objeto feminino sem referente explícito ou entendê-lo genericamente.
  rationale: A cidade é o antecedente feminino imediato no contexto. O pronome português conserva essa ligação sem repetir nem ampliar o referente.
- issue: Valor temporal de תִּרְמְסֶנָּה
  choice: 'Presente poético: “pisoteia”.'
  alternative: 'Futuro: “pisoteará”.'
  rationale: A forma imperfeita pode receber força presente vívida ou futura no contexto profético. O presente mantém a cena poética diante do leitor, enquanto a nota registra a alternativa legítima.
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo compacto. “Pisoteia” comunica com clareza a força de רמס; “necessitados” evita repetir “pobre” e conserva a vulnerabilidade expressa por דַלִּים. O marcador da nota foi colocado após o versículo, junto à alternativa temporal a que se refere.
