source:
  edition: WLC
  text: כִּֽי לִ֣/י אִיִּ֣ים יְקַוּ֗וּ וָ/אֳנִיּ֤וֹת תַּרְשִׁישׁ֙ בָּ/רִ֣אשֹׁנָ֔ה לְ/הָבִ֤יא בָנַ֨יִ/ךְ֙ מֵֽ/רָח֔וֹק כַּסְפָּ֥/ם וּ/זְהָבָ֖/ם אִתָּ֑/ם לְ/שֵׁם֙ יְהוָ֣ה אֱלֹהַ֔יִ/ךְ וְ/לִ/קְד֥וֹשׁ יִשְׂרָאֵ֖ל כִּ֥י פֵאֲרָֽ/ךְ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/009.yaml
  text: Surely the coastlands wait for me[a], and the ships of Tarshish first, to bring your sons from far away, with their silver and their gold with them, for the name of Yahweh your God, and for the Holy One of Israel[b], because he has glorified you.
translation:
  language: pt
  text: De fato, as terras costeiras esperam por mim[a], e os navios de Társis vêm primeiro, para trazer de longe os seus filhos, com a prata e o ouro deles, em honra ao nome de Yahweh, seu Deus, e do Santo de Israel, pois ele glorificou você.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as ilhas” ou “os litorais distantes”; o termo hebraico pode designar amplamente regiões marítimas e costeiras.
    reason: lexical_alternative
  - marker: b
    text: Ou “embelezou você” ou “honrou você”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: De fato
  rationale: Introduz uma explicação enfática ligada ao contexto anterior; “De fato” conserva a força asseverativa sem tornar a afirmação absoluta demais.
- source_word: אִיִּים
  choice: terras costeiras
  rationale: Em Isaías, o termo pode abranger ilhas, litorais e regiões marítimas distantes; “terras costeiras” comunica bem essa amplitude geográfica.
- source_word: יְקַוּוּ
  choice: esperam
  rationale: O verbo expressa espera carregada de expectativa; “esperam por mim” é natural em português e mantém o sentido básico.
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: navios de Társis
  rationale: Preserva a expressão hebraica tradicional sem decidir se Társis indica destino, origem ou uma classe de grandes embarcações comerciais.
- source_word: בָּרִאשֹׁנָה
  choice: vêm à frente
  rationale: O advérbio indica prioridade ou posição dianteira. No contexto de navios que chegam, “vêm à frente” é mais claro e natural do que o isolado “primeiro”.
- source_word: בָנַיִךְ
  choice: seus filhos
  rationale: Mantém o masculino plural explícito, especialmente pertinente porque o contexto próximo distingue filhos e filhas.
- source_word: כַּסְפָּם וּזְהָבָם אִתָּם
  choice: com a prata e o ouro deles
  rationale: Conserva a posse e a ideia de que os bens vêm junto com os filhos, evitando uma redundância pouco natural em português.
- source_word: לְשֵׁם יְהוָה אֱלֹהַיִךְ
  choice: por causa do nome de Yahweh, seu Deus
  rationale: Expressa a motivação ligada ao nome, isto é, à identidade e reputação reveladas de Yahweh, sem reduzir a frase a mero destino espacial.
- source_word: כִּי פֵאֲרָךְ
  choice: pois ele glorificou você
  rationale: O verbo pode indicar glorificar, embelezar ou honrar. “Glorificou” preserva a linguagem elevada e a ação divina sobre Sião.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome divino diretamente; “Yahweh” preserva sua função como nome pessoal da aliança sem substituí-lo por um título.
- issue: Referência masculina em בָנַיִךְ
  choice: seus filhos
  alternative: seus filhos e filhas; suas crianças
  rationale: O hebraico usa o plural masculino, e o contexto circundante menciona as filhas separadamente. A tradução evita neutralizar essa distinção.
- issue: Sentido de פֵאֲרָךְ
  choice: glorificou você
  alternative: embelezou você; honrou você
  rationale: A escolha conserva a dimensão teológica da honra concedida por Deus a Sião, enquanto a nota mantém abertas as nuances estética e honorífica do verbo.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. O tratamento de Sião foi mantido com “você”, coerente com o feminino singular do hebraico e natural no português brasileiro. A ordem foi levemente ajustada para fluidez, preservando as relações sintáticas e as ambiguidades relevantes.
