source:
  edition: WLC
  text: ק֥וּמִי א֖וֹרִי כִּ֣י בָ֣א אוֹרֵ֑/ךְ וּ/כְב֥וֹד יְהוָ֖ה עָלַ֥יִ/ךְ זָרָֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/001.yaml
  text: Arise[a], shine, for your light has come[b], and the glory of Yahweh has risen upon you.
translation:
  language: pt
  text: Levante-se[a], resplandeça, pois chegou a sua luz, e a glória de Yahweh[b] raiou sobre você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Erga-se, seja radiante”; o segundo imperativo hebraico pode indicar tornar-se luminosa ou emitir luz.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: YHWH, o nome divino também tradicionalmente representado por “SENHOR”.'
    reason: alternative_reading
lexical_decisions:
- source_word: קוּמִי
  choice: Levante-se
  rationale: Imperativo qal feminino singular de קום, dirigido a Sião/Jerusalém. “Levante-se” é claro, digno e preserva a convocação direta.
- source_word: אוֹרִי
  choice: resplandeça
  rationale: Imperativo qal feminino singular de אור. “Resplandeça” expressa a manifestação visível de luz e mantém o tom poético sem limitar a imagem a uma leitura meramente literal.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão dos imperativos; “pois” transmite de modo conciso sua força causal.
- source_word: בָא אוֹרֵךְ
  choice: chegou a sua luz
  rationale: Preserva o perfeito hebraico e a ordem poética natural em português, mantendo abertas as dimensões de iluminação, salvação e restauração.
- source_word: כְבוֹד יְהוָה
  choice: a glória de Yahweh
  rationale: “Glória” comunica honra, esplendor e presença divina manifesta. “Yahweh” representa diretamente o nome pactual יְהוָה.
- source_word: עָלַיִךְ זָרָח
  choice: raiou sobre você
  rationale: זרח descreve o nascer ou irromper da luz, especialmente como no nascer do sol. “Raiou” conserva essa imagem e forma uma expressão poética natural com “sobre você”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome próprio e evita substituí-lo por um título.
- issue: Valor temporal dos perfeitos בָא e זָרָח no discurso profético
  choice: 'pretérito perfeito em português: “chegou” e “raiou”'
  alternative: 'presente ou futuro: “chega/raia” ou “chegará/raiará”'
  rationale: Os perfeitos apresentam a realidade prometida como já realizada de maneira vívida e certa. O pretérito perfeito preserva essa forma sem converter explicitamente a declaração em previsão futura.
- issue: Referente feminino singular da segunda pessoa
  choice: formas naturais de tratamento com “você”
  alternative: formas marcadamente femininas ou “tu”
  rationale: O hebraico se dirige no feminino singular a Sião/Jerusalém personificada. Em português, os imperativos escolhidos não marcam gênero, e “você” oferece ampla legibilidade brasileira sem apagar a personificação fornecida pelo contexto.
translation_notes:
  register: Português moderno, digno e poético, com ampla legibilidade brasileira. “Resplandeça” e “raiou” preservam a imagem luminosa e o tom profético sem recorrer a linguagem excessivamente arcaica.
