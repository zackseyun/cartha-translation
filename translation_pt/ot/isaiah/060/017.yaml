source:
  edition: WLC
  text: תַּ֣חַת הַ/נְּחֹ֜שֶׁת אָבִ֣יא זָהָ֗ב וְ/תַ֤חַת הַ/בַּרְזֶל֙ אָ֣בִיא כֶ֔סֶף וְ/תַ֤חַת הָֽ/עֵצִים֙ נְחֹ֔שֶׁת וְ/תַ֥חַת הָ/אֲבָנִ֖ים בַּרְזֶ֑ל וְ/שַׂמְתִּ֤י פְקֻדָּתֵ/ךְ֙ שָׁל֔וֹם וְ/נֹגְשַׂ֖יִ/ךְ צְדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/017.yaml
  text: Instead of bronze I will bring gold[a], and instead of iron I will bring silver; instead of wood, bronze, and instead of stones, iron. And I will make peace your overseers[c][b], and righteousness your taskmasters.
translation:
  language: pt
  text: Em vez de bronze, trarei ouro; em vez de ferro, trarei prata; em vez de madeira, bronze; e em vez de pedras, ferro. Farei da paz a sua administração[a] e da justiça[b] os seus capatazes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sua supervisão”, “seus administradores” ou “seus oficiais”. O termo hebraico pode indicar supervisão, cargo administrativo ou as pessoas que o exercem.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico também pode ser traduzido por “retidão”; pode indicar tanto retidão moral quanto justiça na ordem pública.
    reason: lexical_alternative
  - marker: c
    text: Ou “os seus governantes”, “os que oprimem você” ou “os que cobram tributo de você”. O termo hebraico costuma designar quem exige trabalho ou pagamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: em vez de
  rationale: No contexto da substituição de materiais, expressa troca, não posição espacial.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: O termo pode abranger cobre e bronze; “bronze” é natural nesta lista de materiais e evita o anacronismo de “latão”.
- source_word: אָבִיא
  choice: trarei
  rationale: O hifil de בוא descreve o ato de Deus de fornecer materiais superiores; “trarei” é direto e idiomático.
- source_word: עֵצִים
  choice: madeira
  rationale: Emprega-se o coletivo natural em português para material de construção.
- source_word: פְקֻדָּתֵךְ
  choice: sua supervisora
  rationale: O substantivo pode designar supervisão, administração, cargo ou quem o exerce. A formulação pessoal preserva a personificação poética, enquanto a nota registra a amplitude lexical.
- source_word: שָׁלוֹם
  choice: paz
  rationale: Embora inclua bem-estar e plenitude, “paz” é a equivalência central e reconhecível na visão de restauração.
- source_word: נֹגְשַׂיִךְ
  choice: seus capatazes
  rationale: O termo designa quem pressiona, exige trabalho ou cobra tributo. “Capatazes” conserva a força coerciva e a ironia de eles serem substituídos pela justiça.
- source_word: צְדָקָה
  choice: justiça
  rationale: Neste quadro de ordem pública restaurada, “justiça” comunica melhor a dimensão social do termo, sem excluir sua dimensão moral.
theological_decisions:
- issue: Caracterização das autoridades na restauração futura
  choice: Personificar a paz como supervisora e a justiça como capatazes
  alternative: Farei da paz a sua administração e da justiça os seus governantes
  rationale: A redação mantém a imagem poética de qualidades divinas ocupando o lugar das autoridades, sem transformar o verso em descrição técnica de uma estrutura política. As notas preservam a ambiguidade entre função, administração e agentes.
translation_notes:
  register: Português moderno, digno e acessível, com construções paralelas e ritmo poético. “Capatazes” é concreto e forte, mas ainda corrente; as notas evitam que a escolha elimine a amplitude administrativa e coerciva dos termos hebraicos.
