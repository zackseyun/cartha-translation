id: ISA.60.18
reference: Isaiah 60:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לֹא יִשָּׁמַ֨ע ע֤וֹד חָמָס֙ בְּ/אַרְצֵ֔/ךְ שֹׁ֥ד וָ/שֶׁ֖בֶר בִּ/גְבוּלָ֑יִ/ךְ וְ/קָרָ֤את יְשׁוּעָה֙ חוֹמֹתַ֔יִ/ךְ וּ/שְׁעָרַ֖יִ/ךְ תְּהִלָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/018.yaml
  text: Violence will no longer be heard in your land[a], devastation or destruction within your borders; and you will call your walls Salvation, and your gates Praise.
translation:
  language: pt
  text: Nunca mais se ouvirá falar de violência em sua terra, nem de saque ou destruição dentro de suas fronteiras; você chamará suas muralhas de Salvação e seus portões de Louvor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשָּׁמַע
  choice: se ouvirá falar
  rationale: O nifal de שׁמע indica que a violência já não será ouvida nem noticiada; a expressão é natural em português e preserva esse alcance.
- source_word: חָמָס
  choice: violência
  rationale: O termo denota violência, brutalidade ou injustiça violenta; “violência” se ajusta ao paralelismo e ao contexto.
- source_word: בְּאַרְצֵךְ
  choice: em sua terra
  rationale: Mantém o sentido geográfico amplo de אֶרֶץ e a linguagem profética tradicional sem soar arcaico.
- source_word: שֹׁד
  choice: saque
  rationale: שֹׁד pode designar espoliação violenta, saque ou devastação; “saque” preserva a ação concreta e evita fundi-lo semanticamente com שֶׁבֶר.
- source_word: שֶׁבֶר
  choice: destruição
  rationale: No paralelismo profético, o termo expressa quebra, ruína ou destruição; “destruição” comunica claramente o resultado.
- source_word: בִּגְבוּלָיִךְ
  choice: dentro de suas fronteiras
  rationale: Expressa de modo idiomático tanto os limites quanto o território abrangido por גְּבוּל.
- source_word: וְקָרָאת
  choice: você chamará
  rationale: A forma continua a sequência profética futura. O português pode ligar a oração por ponto e vírgula sem acrescentar um contraste não explícito no וְ hebraico.
- source_word: יְשׁוּעָה
  choice: Salvação
  rationale: Como nome atribuído às muralhas, conserva o sentido de livramento e o peso do motivo salvífico do texto.
- source_word: חוֹמֹתַיִךְ
  choice: suas muralhas
  rationale: “Muralhas” comunica especificamente as fortificações urbanas, em contraste com paredes comuns.
- source_word: שְׁעָרַיִךְ
  choice: seus portões
  rationale: Tradução direta e corrente para as entradas monumentais da cidade.
- source_word: תְּהִלָּה
  choice: Louvor
  rationale: Preserva o sentido usual de elogio ou louvor e funciona naturalmente como nome atribuído aos portões.
theological_decisions:
- issue: Se יְשׁוּעָה e תְּהִלָּה devem aparecer como nomes ou apenas como substantivos descritivos
  choice: Salvação e Louvor, com maiúsculas
  alternative: salvação e louvor, em minúsculas
  rationale: A construção “chamará suas muralhas... e seus portões...” apresenta os substantivos como nomes conferidos. As maiúsculas sinalizam essa função sem transformá-los em personagens nem impor uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Nunca mais se ouvirá falar” soa natural; “muralhas” preserva a imagem da cidade fortificada. O paralelismo foi mantido com concisão, sem inserir um “mas” ausente do hebraico.
