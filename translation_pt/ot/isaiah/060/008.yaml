  text: Who are these that fly like a cloud[a], and like doves to their windows?
translation:
  language: pt
  text: Quem são estes que voam como uma nuvem e como pombas para as suas janelas?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «para as aberturas dos seus pombais».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי אֵלֶּה
  choice: Quem são estes
  rationale: O pronome interrogativo seguido do demonstrativo plural forma uma pergunta admirativa; o português explicita naturalmente a cópula subentendida no hebraico.
- source_word: כָּעָב
  choice: como uma nuvem
  rationale: Mantém o comparativo e o singular do hebraico, que sugere um grupo visto como uma massa semelhante a uma nuvem.
- source_word: תְּעוּפֶינָה
  choice: voam
  rationale: O imperfeito qal feminino plural de עוּף descreve aqui, com vivacidade profética, a ação presente de voar.
- source_word: וְכַיּוֹנִים
  choice: e como pombas
  rationale: Preserva o paralelismo da segunda comparação e o plural do substantivo.
- source_word: אֶל
  choice: para
  rationale: Expressa de modo natural a direção e o movimento das pombas de volta ao lugar onde se abrigam.
- source_word: אֲרֻבֹּתֵיהֶם
  choice: as suas janelas
  rationale: אֲרֻבָּה designa uma janela ou abertura. O contexto pode apontar especificamente para as aberturas de um pombal, alternativa preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e preservação das duas imagens poéticas. O demonstrativo masculino plural «estes» concorda com o referente humano implícito, enquanto as formas verbais femininas do hebraico provavelmente refletem a visão de embarcações ou outro coletivo feminino no contexto; essa tensão não exige explicitação artificial no português.
