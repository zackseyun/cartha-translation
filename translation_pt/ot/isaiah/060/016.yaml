  text: וְ/יָנַקְתְּ֙ חֲלֵ֣ב גּוֹיִ֔ם וְ/שֹׁ֥ד מְלָכִ֖ים תִּינָ֑קִי וְ/יָדַ֗עַתְּ כִּ֣י אֲנִ֤י יְהוָה֙ מֽוֹשִׁיעֵ֔/ךְ וְ/גֹאֲלֵ֖/ךְ אֲבִ֥יר יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/016.yaml
  text: You will nurse on the milk of nations[a], and you will suck the breast of kings; and you will know that I, Yahweh, am your Savior and your Redeemer, the Mighty One of Jacob.
translation:
  language: pt
  text: Você sugará o leite das nações[a] e mamará no peito de reis; e você saberá que eu, Yahweh, sou o seu Salvador e o seu Redentor, o Poderoso de Jacó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Você sugará o leite das nações e sugará o peito de reis”. O hebraico repete o verbo “sugar/mamar” e preserva uma imagem vívida de amamentação para retratar Sião recebendo sustento e honra das nações.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָנַקְתְּ
  choice: Você se alimentará
  rationale: O verbo ינק descreve sugar ou mamar. Com “do leite”, a formulação preserva a imagem de nutrição e soa natural em português; a nota registra a expressão mais literal.
- source_word: חֲלֵב גּוֹיִם
  choice: do leite das nações
  rationale: Mantém o sentido concreto de חֲלֵב, “leite”, e traduz גּוֹיִם por “nações”, sem reduzir a metáfora a riquezas ou recursos.
- source_word: וְשֹׁד מְלָכִים תִּינָקִי
  choice: e mamará no peito de reis
  rationale: Preserva de modo claro e vívido a segunda imagem de amamentação. “Reis” traduz diretamente מְלָכִים.
- source_word: וְיָדַעַתְּ
  choice: Então saberá
  rationale: 'A coordenação hebraica admite valor consequencial no contexto: ao receber esse sustento, Sião reconhecerá quem a salva. “Então” explicita levemente essa sequência sem alterar o sentido.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: מוֹשִׁיעֵךְ
  choice: o seu Salvador
  rationale: Expressa de maneira concisa e corrente o particípio com sufixo feminino singular, dirigido a Sião.
- source_word: וְגֹאֲלֵךְ
  choice: o seu Redentor
  rationale: Preserva a linguagem estabelecida de resgate associada a גאל, sem especificar além do texto a função de resgatador familiar.
- source_word: אֲבִיר יַעֲקֹב
  choice: o Poderoso de Jacó
  rationale: Mantém o epíteto divino e o nome “Jacó” exatamente como no hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto contém o nome pessoal divino; a transliteração o preserva em vez de trocá-lo por um título.
- issue: Imagem de Sião sendo amamentada pelas nações e pelos reis
  choice: Manter a metáfora corporal no texto principal
  alternative: Interpretar como receber a riqueza ou os recursos das nações
  rationale: O hebraico repete explicitamente o verbo ינק e usa “leite” e “peito”. A imagem comunica sustento e honra, mas o texto não deve ser achatado em uma explicação abstrata.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A destinatária é Sião/Jerusalém, tratada no hebraico como singular feminino; em português, as formas verbais não marcam esse gênero. A repetição literal de “mamar” foi suavizada apenas na primeira oração para maior naturalidade, sem eliminar a metáfora.
