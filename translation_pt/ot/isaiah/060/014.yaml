id: ISA.60.14
reference: Isaiah 60:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָלְכ֨וּ אֵלַ֤יִ/ךְ שְׁח֨וֹחַ֙ בְּנֵ֣י מְעַנַּ֔יִ/ךְ וְ/הִֽשְׁתַּחֲו֛וּ עַל כַּפּ֥וֹת רַגְלַ֖יִ/ךְ כָּל מְנַֽאֲצָ֑יִ/ךְ וְ/קָ֤רְאוּ לָ/ךְ֙ עִ֣יר יְהוָ֔ה צִיּ֖וֹן קְד֥וֹשׁ יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/014.yaml
  text: The sons of those who afflicted you will come to you bowed down[a], and all who despised you will bow down at the soles of your feet; and they will call you The City of Yahweh[c][b], Zion of the Holy One of Israel.
translation:
  language: pt
  text: Os filhos dos que a afligiram virão até você[a], curvados, e todos os que a desprezaram se prostrarão junto às plantas dos seus pés[b]. Eles a chamarão Cidade de Yahweh, Sião do Santo de Israel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “os filhos dos que a afligiram”. A expressão também pode ser entendida como “os descendentes dos seus opressores”.
    reason: lexical_alternative
  - marker: b
    text: “Prostrar-se” aqui expressa submissão ou homenagem diante de Sião, não adoração divina à cidade.
    reason: cultural_note
  - marker: c
    text: A expressão hebraica “Sião do Santo de Israel” identifica Sião como pertencente ao Santo de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁחֹחַ
  choice: curvados
  rationale: Expressa a postura fisicamente abaixada e a submissão implícita, de modo natural em português.
- source_word: בְּנֵי מְעַנַּיִךְ
  choice: Os filhos dos que a afligiram
  rationale: Preserva o masculino explícito de בְּנֵי e o sentido verbal de ענה, sem substituir a formulação concreta por uma generalização.
- source_word: וְהִשְׁתַּחֲווּ
  choice: se prostrarão
  rationale: Conserva a forte imagem corporal de prostração e, neste contexto, comunica submissão ou homenagem, não adoração divina.
- source_word: עַל כַּפּוֹת רַגְלַיִךְ
  choice: junto às plantas dos seus pés
  rationale: Mantém a referência específica de כַּפּוֹת às plantas dos pés e a vívida imagem de humilhação.
- source_word: מְנַאֲצָיִךְ
  choice: os que a desprezaram
  rationale: Traduz de maneira concisa e natural o desprezo ou desdém expresso por נאץ.
- source_word: עִיר יְהוָה
  choice: Cidade de Yahweh
  rationale: Trata a expressão como título e translitera o nome divino יְהוָה como Yahweh.
- source_word: צִיּוֹן קְדוֹשׁ יִשְׂרָאֵל
  choice: Sião do Santo de Israel
  rationale: Preserva a construção titular comprimida, identificando Sião como pertencente ao Santo de Israel, sem sugerir que Sião seja o próprio Santo.
- source_word: וְקָרְאוּ לָךְ
  choice: Eles a chamarão
  rationale: Reproduz naturalmente o idioma hebraico de atribuição de um nome ou título.
theological_decisions:
- issue: A homenagem prestada a Sião/Jerusalém
  choice: Os antigos inimigos se prostram em submissão diante de Sião restaurada.
  alternative: Entender o verbo como adoração religiosa prestada à cidade.
  rationale: Embora השתחוה possa indicar adoração em contextos divinos, aqui seu objeto é Sião; por isso, a formulação preserva a prostração sem implicar culto à cidade.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: A transliteração preserva o nome próprio da aliança presente no texto hebraico.
- issue: Referente feminino dos sufixos de segunda pessoa
  choice: a/você/seus, referindo-se a Sião
  alternative: te/teus ou uma formulação masculina
  rationale: O hebraico se dirige a Sião com formas femininas singulares; a tradução portuguesa torna esse referente compreensível e mantém o tratamento consistente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O tratamento por “você” explicita a segunda pessoa feminina dirigida a Sião; a ordem “virão até você, curvados” evita a leitura de que o complemento “curvados” descreva Sião.
