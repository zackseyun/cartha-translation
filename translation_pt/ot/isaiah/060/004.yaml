  text: שְׂאִֽי סָבִ֤יב עֵינַ֨יִ/ךְ֙ וּ/רְאִ֔י כֻּלָּ֖/ם נִקְבְּצ֣וּ בָֽאוּ לָ֑/ךְ בָּנַ֨יִ/ךְ֙ מֵ/רָח֣וֹק יָבֹ֔אוּ וּ/בְנֹתַ֖יִ/ךְ עַל צַ֥ד תֵּאָמַֽנָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/004.yaml
  text: Lift up your eyes all around and see[a]; all of them gather together; they come to you. Your sons will come from far away[b], and your daughters will be carried on the hip.
translation:
  language: pt
  text: 'Erga os olhos, olhe ao redor e veja: todos eles se reúnem; vêm até você. Seus filhos virão de longe, e suas filhas serão carregadas[a] no quadril[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “serão sustentadas” ou “receberão cuidados”; o verbo também pode ter a nuance de serem amamentadas.
    reason: lexical_alternative
  - marker: b
    text: Ou “ao lado”; a expressão hebraica descreve alguém carregado junto à lateral do corpo, comumente entendida como no quadril.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאִי סָבִיב עֵינַיִךְ וּרְאִי
  choice: Erga os olhos ao redor e veja
  rationale: Mantém os dois imperativos dirigidos a Sião, personificada no feminino singular, e expressa de modo claro o olhar em todas as direções.
- source_word: כֻּלָּם נִקְבְּצוּ בָאוּ לָךְ
  choice: todos eles se reúnem e vêm até você
  rationale: Preserva a ênfase de כֻּלָּם e apresenta os perfeitos hebraicos como uma cena profética vívida no presente.
- source_word: בָּנַיִךְ מֵרָחוֹק יָבֹאוּ
  choice: Seus filhos virão de longe
  rationale: Conserva o termo masculino específico, em paralelo com “filhas”, e comunica o sentido futuro do imperfeito.
- source_word: וּבְנֹתַיִךְ עַל צַד תֵּאָמַנָה
  choice: e suas filhas serão carregadas junto ao quadril
  rationale: Reproduz a imagem concreta de crianças sustentadas junto ao lado ou quadril, sem eliminar a possível nuance de cuidado presente no verbo.
theological_decisions:
- issue: Imagem de restauração marcada por gênero
  choice: Manter “filhos” e “filhas”
  alternative: Generalizar como “crianças” ou “filhos” em sentido inclusivo
  rationale: O hebraico apresenta deliberadamente o par masculino e feminino para retratar o retorno completo dos descendentes de Sião.
- issue: Aspecto verbal profético
  choice: Usar presente vívido em “se reúnem e vêm” e futuro em “virão” e “serão carregadas”
  alternative: Uniformizar todos os verbos no passado, presente ou futuro
  rationale: A solução preserva tanto a vivacidade da cena inicialmente contemplada quanto a orientação futura dos imperfeitos na segunda metade.
- issue: Sentido de תֵּאָמַנָה
  choice: serão carregadas
  alternative: serão amamentadas; serão sustentadas; receberão cuidados
  rationale: “Serão carregadas” se ajusta melhor à imagem imediata de עַל צַד, embora a amplitude semântica do verbo seja registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Erga” e “veja” preservam o tratamento singular dirigido à Sião personificada; “até você” torna explícita a direção do movimento sem excessiva solenidade.
