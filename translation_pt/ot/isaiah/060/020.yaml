id: ISA.60.20
reference: Isaiah 60:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לֹא יָב֥וֹא עוֹד֙ שִׁמְשֵׁ֔/ךְ וִ/ירֵחֵ֖/ךְ לֹ֣א יֵאָסֵ֑ף כִּ֣י יְהוָ֗ה יִֽהְיֶה לָּ/ךְ֙ לְ/א֣וֹר עוֹלָ֔ם וְ/שָׁלְמ֖וּ יְמֵ֥י אֶבְלֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/020.yaml
  text: Your sun will no longer go down[a], and your moon will not withdraw; for Yahweh will be your everlasting light[b], and the days of your mourning will be ended.
translation:
  language: pt
  text: O seu sol já não se porá[a], e a sua lua não se retirará[b], pois Yahweh será a sua luz para sempre, e os dias do seu luto chegarão ao fim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “já não descerá”. O hebraico diz literalmente “já não virá”, expressão que, neste contexto, se refere ao pôr do sol.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “não será recolhida”, isto é, não será retirada nem deixará de brilhar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יָבוֹא עוֹד שִׁמְשֵׁךְ
  choice: O seu sol já não se porá
  rationale: Embora בוא signifique normalmente “vir” ou “entrar”, tendo o sol como sujeito a expressão descreve idiomaticamente o pôr do sol. “Já não se porá” é natural em português e preserva a imagem.
- source_word: וִירֵחֵךְ לֹא יֵאָסֵף
  choice: e a sua lua não se retirará
  rationale: O nifal de אסף significa literalmente “ser recolhido” e, neste paralelismo, indica que a lua não será retirada nem deixará de iluminar. “Não se retirará” mantém a personificação sem soar excessivamente obscuro.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da promessa anterior de modo claro e natural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יִהְיֶה לָךְ לְאוֹר עוֹלָם
  choice: será a sua luz para sempre
  rationale: Expressa naturalmente em português a construção predicativa e a duração contínua indicada por עוֹלָם.
- source_word: וְשָׁלְמוּ יְמֵי אֶבְלֵךְ
  choice: e os dias do seu luto chegarão ao fim
  rationale: שלם comunica aqui que o período de luto será completado ou terminado. “Chegarão ao fim” é corrente e mantém o foco no encerramento desses dias.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto hebraico emprega o nome pessoal divino. A transliteração “Yahweh” preserva esse nome sem substituí-lo por um título.
- issue: Imagem escatológica do sol e da lua
  choice: Manter literalmente as imagens cósmicas
  alternative: Parafraseá-las apenas como símbolos de consolo ou prosperidade
  rationale: O versículo contrapõe os luminares criados à luz permanente de Yahweh. A tradução conserva essa imagem e não limita sua interpretação teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém o paralelismo poético e a imagem profética, usando formulações naturais sem eliminar as nuances dos verbos hebraicos.
