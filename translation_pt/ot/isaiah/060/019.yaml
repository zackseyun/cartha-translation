  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לֹא יִֽהְיֶה לָּ֨/ךְ ע֤וֹד הַ/שֶּׁ֨מֶשׁ֙ לְ/א֣וֹר יוֹמָ֔ם וּ/לְ/נֹ֕גַהּ הַ/יָּרֵ֖חַ לֹא יָאִ֣יר לָ֑/ךְ וְ/הָיָה לָ֤/ךְ יְהוָה֙ לְ/א֣וֹר עוֹלָ֔ם וֵ/אלֹהַ֖יִ/ךְ לְ/תִפְאַרְתֵּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/019.yaml
  text: The sun will no longer be for you the light by day[a], nor will the moon shine for you for brightness; but Yahweh will be for you an everlasting light[c][b], and your God your glory.
translation:
  language: pt
  text: O sol já não será para você luz durante o dia, nem a lua lhe dará claridade[a]; mas Yahweh[b] será para você uma luz eterna, e o seu Deus será a sua glória[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “brilho” ou “resplendor”.
    reason: lexical_alternative
  - marker: b
    text: Hebraico YHWH; tradicionalmente traduzido por “o SENHOR”.
    reason: alternative_reading
  - marker: c
    text: Ou “o seu esplendor” ou “a sua beleza”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִהְיֶה לָּךְ עוֹד
  choice: já não será para você
  rationale: Expressa de modo natural a cessação indicada pela negação com עוֹד, preservando a relação dativa de לָךְ.
- source_word: לְאוֹר יוֹמָם
  choice: a luz do dia
  rationale: Traduz a função do sol como iluminação diurna em português claro e poético, sem tornar a imagem mais literal ou técnica do que o hebraico.
- source_word: וּלְנֹגַהּ
  choice: com seu brilho
  rationale: נֹגַהּ denota brilho, claridade ou resplendor. A formulação liga naturalmente o brilho à lua e mantém o paralelismo poético.
- source_word: לֹא יָאִיר לָךְ
  choice: nem a lua iluminará você
  rationale: O hifil de אור significa dar luz ou iluminar; esta construção preserva o sentido causativo e a relação com a destinatária.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְאוֹר עוֹלָם
  choice: uma luz eterna
  rationale: Comunica a duração permanente de עוֹלָם em linguagem portuguesa natural e elevada.
- source_word: לְתִפְאַרְתֵּךְ
  choice: a sua glória
  rationale: תִפְאֶרֶת pode significar glória, esplendor ou beleza; “glória” preserva a amplitude teológica e o tom elevado do contexto.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto hebraico emprega diretamente o nome divino; a transliteração preserva o nome sem substituí-lo por um título.
- issue: Natureza da luz de Yahweh em contraste com o sol e a lua
  choice: Manter a imagem profético-poética sem definir o modo de seu cumprimento
  alternative: Explicá-la como transformação cósmica estritamente literal ou como iluminação exclusivamente metafórica
  rationale: O hebraico afirma que Yahweh substituirá as luzes criadas para a cidade, mas não determina aqui como a imagem deve ser sistematizada.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O tratamento por “você” torna natural a segunda pessoa feminina singular dirigida a Sião/Jerusalém, sem acrescentar uma identificação ausente do versículo. O paralelismo e a tensão da imagem profética foram preservados.
