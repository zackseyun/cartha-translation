  text: כִּֽי הִנֵּ֤ה הַ/חֹ֨שֶׁךְ֙ יְכַסֶּה אֶ֔רֶץ וַ/עֲרָפֶ֖ל לְאֻמִּ֑ים וְ/עָלַ֨יִ/ךְ֙ יִזְרַ֣ח יְהוָ֔ה וּ/כְבוֹד֖/וֹ עָלַ֥יִ/ךְ יֵרָאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/002.yaml
  text: For look, darkness will cover the earth, and thick darkness the peoples; but the LORD will rise upon you, and his glory will appear over you.
translation:
  language: pt
  text: Pois eis que as trevas cobrirão a terra, e a escuridão profunda cobrirá os povos; mas sobre você o SENHOR se levantará, e sobre você aparecerá a sua glória.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Pois eis que
  rationale: Preserva tanto a relação explicativa de כִּי quanto a chamada enfática à atenção expressa por הִנֵּה, em registro bíblico ainda compreensível.
- source_word: הַחֹשֶׁךְ
  choice: as trevas
  rationale: Equivalente natural e solene para a escuridão em sentido figurado, mantendo o contraste com a glória luminosa do SENHOR.
- source_word: עֲרָפֶל
  choice: escuridão profunda
  rationale: Comunica uma obscuridade especialmente densa e intensa, distinguindo o termo das trevas da oração anterior.
- source_word: יִזְרַח
  choice: se levantará
  rationale: O verbo descreve o despontar ou levantar-se da luz, como o sol. Com o SENHOR como sujeito, 'se levantará sobre você' conserva a metáfora luminosa sem acrescentar palavras ausentes do hebraico.
- source_word: יֵרָאֶה
  choice: aparecerá
  rationale: Representa o nifal de ראה como manifestação visível, sem determinar além do texto como essa glória será percebida.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o Tetragrama por SENHOR em versaletes, sem inserir no corpo do versículo uma vocalização reconstruída.
- issue: Referente feminino singular de עָלַיִךְ
  choice: sobre você
  alternative: sobre ti
  rationale: Mantém o singular dirigido a Sião/Jerusalém no contexto, sem explicitar o referente dentro do versículo. 'Você' oferece ampla legibilidade brasileira e a forma não marcada pelo gênero preserva o referente contextual.
- issue: Metáfora solar aplicada ao SENHOR
  choice: o SENHOR se levantará
  alternative: o SENHOR brilhará
  rationale: Preserva a imagem verbal do despontar sobre Sião e evita reduzir a formulação a uma declaração abstrata de luminosidade.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo poético preservado. A ordem repetida 'sobre você' reproduz a ênfase do hebraico. O ponto e vírgula marca a virada entre a escuridão das nações e a manifestação do SENHOR sobre a destinatária singular.
