id: ISA.60.3
reference: Isaiah 60:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָלְכ֥וּ גוֹיִ֖ם לְ/אוֹרֵ֑/ךְ וּ/מְלָכִ֖ים לְ/נֹ֥גַהּ זַרְחֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/003.yaml
  text: Nations will come to your light[c][b][a], and kings to the brightness of your rising.
translation:
  language: pt
  text: Nações virão à sua luz[a][b], e reis, ao esplendor do seu alvorecer.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “andarão” ou “irão à sua luz”.
    reason: lexical_alternative
  - marker: b
    text: “Nações” também pode, em alguns contextos, ser traduzido por “gentios”.
    reason: lexical_alternative
  - marker: c
    text: Ou “ao brilho do seu nascer” ou “à radiância da sua aurora”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלְכוּ
  choice: virão
  rationale: Embora הלך signifique literalmente “andar/ir”, com povos dirigindo-se a um destino marcado por לְ, “virão” expressa com naturalidade o movimento em direção à Sião; o futuro corresponde ao contexto profético.
- source_word: גוֹיִם
  choice: nações
  rationale: גוֹיִם designa povos ou nações; “nações” é amplo e adequado ao contexto, enquanto “gentios” seria mais interpretativo.
- source_word: לְאוֹרֵךְ
  choice: à sua luz
  rationale: Preserva o substantivo אוֹר, “luz”, e a direção indicada por לְ. O sufixo feminino singular se refere à Sião/Jerusalém personificada.
- source_word: וּמְלָכִים
  choice: e reis
  rationale: מְלָכִים significa diretamente “reis”; “governantes” ampliaria indevidamente o sentido.
- source_word: לְנֹגַהּ
  choice: ao esplendor
  rationale: נֹגַהּ pode indicar brilho, fulgor ou esplendor. “Esplendor” comunica uma luminosidade intensa em português corrente e digno.
- source_word: זַרְחֵךְ
  choice: do seu alvorecer
  rationale: Derivado de זרח, “surgir/brilhar”, especialmente como a aurora. “Alvorecer” conserva a imagem do surgimento da luz sem reduzi-la apenas ao ato abstrato de levantar-se.
theological_decisions:
- issue: Referente dos sufixos femininos da segunda pessoa do singular
  choice: Sião/Jerusalém personificada como mulher
  alternative: O povo de Deus em sentido mais geral
  rationale: O contexto imediato de Isaías 60 dirige-se a Sião em linguagem feminina singular. A tradução mantém o tratamento direto sem inserir no texto uma identificação eclesiológica mais ampla.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A elipse verbal no segundo membro (“e reis, ao...”) conserva o paralelismo poético hebraico. Os marcadores foram posicionados junto aos termos a que se referem.
