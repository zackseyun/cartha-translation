  text: כָּל צֹ֤אן קֵדָר֙ יִקָּ֣בְצוּ לָ֔/ךְ אֵילֵ֥י נְבָי֖וֹת יְשָׁרְת֑וּ/נֶךְ יַעֲל֤וּ עַל רָצוֹן֙ מִזְבְּחִ֔/י וּ/בֵ֥ית תִּפְאַרְתִּ֖/י אֲפָאֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/007.yaml
  text: All the flocks of Kedar will be gathered to you[a]; the rams of Nebaioth will minister to you. They will go up with acceptance on my altar[b], and I will beautify my glorious house.
translation:
  language: pt
  text: Todos os rebanhos de Quedar serão reunidos para você; os carneiros de Nebaiote estarão a seu serviço. Subirão ao meu altar e serão aceitos[a], e eu darei esplendor à casa da minha glória[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Subirão de modo aceitável ao meu altar”. A expressão hebraica combina a ideia de subir com a de receber aceitação favorável.'
    reason: lexical_alternative
  - marker: b
    text: A “casa da minha glória” refere-se ao templo; literalmente, “a casa da minha beleza/glória”.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹאן
  choice: rebanhos
  rationale: Termo coletivo para animais de pequeno porte, sobretudo ovelhas e cabras; “rebanhos” preserva a abrangência sem restringi-lo apenas a ovelhas.
- source_word: קֵדָר
  choice: Quedar
  rationale: Nome próprio de um povo ou região árabe, vertido na forma tradicional e reconhecível em português.
- source_word: יִקָּבְצוּ לָךְ
  choice: se reunirão junto de você
  rationale: O nifal admite nuance passiva ou reflexiva. Esta formulação natural preserva o movimento em direção à destinatária personificada sem explicitar quem reúne os rebanhos.
- source_word: אֵילֵי נְבָיוֹת
  choice: os carneiros de Nebaiote
  rationale: O contexto de rebanhos e altar exige o sentido animal de אֵילֵי; Nebaiote é mantido como nome próprio.
- source_word: יְשָׁרְתוּנֶךְ
  choice: estarão a seu serviço
  rationale: שרת denota serviço e pode ter conotação cúltica. A expressão conserva essa possibilidade e soa natural em português.
- source_word: יַעֲלוּ עַל רָצוֹן מִזְבְּחִי
  choice: Subirão ao meu altar e serão aceitos
  rationale: Mantém a imagem concreta de “subir” e comunica o valor de aceitação favorável de רָצוֹן. A nota registra a construção hebraica compacta e sua alternativa mais literal.
- source_word: בֵית תִּפְאַרְתִּי
  choice: a casa da minha glória
  rationale: Preserva a construção nominal hebraica e a ligação lexical com o verbo seguinte, sem identificar explicitamente a casa no corpo do texto.
- source_word: אֲפָאֵר
  choice: darei esplendor
  rationale: O piel de פאר pode significar embelezar, adornar ou glorificar. “Darei esplendor” comunica restauração e magnificência, além de ecoar תִּפְאַרְתִּי.
theological_decisions:
- issue: Referente dos sufixos femininos da segunda pessoa
  choice: Manter a fala direta com “você”, entendendo a destinatária imediata como Sião/Jerusalém personificada
  alternative: Explicitar “Sião”, “Jerusalém” ou aplicar a expressão de modo mais amplo ao povo de Deus
  rationale: O contexto personifica Sião/Jerusalém como mulher, mas o versículo usa apenas pronomes. Preservar a fala direta evita inserir no texto uma identificação ou aplicação mais estreita.
- issue: Sentido cúltico da subida dos animais ao altar
  choice: Expressar que os animais sobem ao altar e recebem aceitação favorável
  alternative: Tratar a cena apenas como tributo econômico ou traduzir diretamente “serão oferecidos em sacrifício”
  rationale: Rebanhos, carneiros, altar e aceitação apontam fortemente para ofertas sacrificiais, mas a tradução conserva a imagem verbal hebraica em vez de substituir “subirão” por uma explicação completa.
- issue: Referente de “casa da minha glória”
  choice: Conservar a expressão metafórica no texto
  alternative: Traduzir diretamente como “meu templo glorioso”
  rationale: O templo é o referente contextual provável, porém o hebraico diz literalmente “casa da minha glória”. A nota esclarece a referência sem eliminar a imagem original.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. “Você” conserva a referência feminina apenas pelo contexto, como ocorre de modo menos explícito em português; evita-se linguagem excessivamente técnica. A repetição semântica entre “esplendor” e “glória” procura refletir o jogo hebraico com a raiz פאר.
