  text: וּ/בָנ֤וּ בְנֵֽי נֵכָר֙ חֹמֹתַ֔יִ/ךְ וּ/מַלְכֵי/הֶ֖ם יְשָׁרְת֑וּ/נֶךְ כִּ֤י בְ/קִצְפִּ/י֙ הִכִּיתִ֔י/ךְ וּ/בִ/רְצוֹנִ֖/י רִֽחַמְתִּֽי/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/010.yaml
  text: The sons of foreigners will rebuild your walls[a], and their kings will minister to you; for in my wrath I struck you[d][c][b], but in my favor I have had compassion on you.
translation:
  language: pt
  text: Os filhos de estrangeiros reconstruirão suas muralhas,[a] e os reis deles a servirão; pois, na minha ira, eu a feri, mas, no meu favor,[b] tive compaixão de você.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica significa literalmente “filhos de estrangeiros”, mas também pode referir-se a estrangeiros em geral.
    reason: lexical_alternative
  - marker: b
    text: Ou “na minha boa vontade” ou “no meu agrado”.
    reason: lexical_alternative
  - marker: c
    text: Ou “mostrei misericórdia a você”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָנוּ
  choice: reconstruirão
  rationale: Embora o verbo signifique literalmente “construir”, o contexto de restauração das muralhas torna “reconstruirão” natural e fiel.
- source_word: בְנֵי נֵכָר
  choice: os filhos de estrangeiros
  rationale: Preserva a forma da expressão hebraica, que também pode designar estrangeiros de modo mais amplo.
- source_word: חֹמֹתַיִךְ
  choice: as suas muralhas
  rationale: O plural com sufixo feminino singular se refere à cidade personificada.
- source_word: וּמַלְכֵיהֶם
  choice: e os reis deles
  rationale: Mantém explicitamente a referência pronominal do hebraico aos estrangeiros.
- source_word: יְשָׁרְתוּנֶךְ
  choice: servirão você
  rationale: O piel de שׁרת denota serviço pessoal ou oficial; “servirão” é claro e não impõe uma conotação cultual.
- source_word: בְקִצְפִּי
  choice: na minha ira
  rationale: Preserva o registro solene e a força de קצף.
- source_word: הִכִּיתִיךְ
  choice: eu a feri
  rationale: נכה significa golpear ou ferir; o pronome “a” sinaliza em português que a cidade personificada é a destinatária.
- source_word: וּבִרְצוֹנִי
  choice: mas, no meu favor
  rationale: רָצוֹן expressa favor, boa vontade ou agrado; “favor” sustenta o contraste com a ira.
- source_word: רִחַמְתִּיךְ
  choice: tive compaixão de você
  rationale: רחם comunica compaixão misericordiosa, preservada diretamente nesta formulação.
theological_decisions:
- issue: Identidade da destinatária feminina
  choice: Manter a referência pronominal sem acrescentar “Jerusalém” ou “Sião”.
  alternative: Explicitar “Jerusalém” ou “Sião” no texto principal.
  rationale: A forma hebraica se dirige à cidade personificada no feminino, mas o nome próprio não aparece no versículo.
- issue: Contraste entre juízo e compaixão
  choice: “na minha ira, eu a feri, mas, no meu favor, tive compaixão de você”
  alternative: “na minha ira, castiguei você, mas, na minha boa vontade, mostrei-lhe misericórdia”
  rationale: A redação mantém lado a lado a ação divina de juízo e a restauração compassiva, sem explicar nem suavizar a tensão.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você” para evitar a ambiguidade regional de “tu” e mantém o pronome feminino “a” em “eu a feri” para refletir a cidade personificada.
