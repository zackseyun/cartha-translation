id: ISA.60.22
reference: Isaiah 60:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַ/קָּטֹן֙ יִֽהְיֶ֣ה לָ/אֶ֔לֶף וְ/הַ/צָּעִ֖יר לְ/ג֣וֹי עָצ֑וּם אֲנִ֥י יְהוָ֖ה בְּ/עִתָּ֥/הּ אֲחִישֶֽׁ/נָּה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/022.yaml
  text: The smallest will become a thousand[a], and the least a mighty nation. I am Yahweh[c][b]; in its time I will hasten it.
translation:
  language: pt
  text: O menor[a] se tornará mil[b], e o mais insignificante, uma nação poderosa. Eu sou Yahweh; a seu tempo[c], apressarei isso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o pequeno”.'
    reason: lexical_alternative
  - marker: b
    text: “Mil” também pode ser entendido como “um clã”, embora o sentido numérico combine melhor aqui com o paralelismo de crescimento.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “no tempo determinado para isso”. O hebraico mantém a tensão entre um tempo fixado e um cumprimento apressado.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַקָּטֹן
  choice: o menor
  rationale: O adjetivo indica pequenez ou insignificância e funciona aqui como substantivo. “O menor” conserva o paralelismo comparativo e soa natural em português.
- source_word: יִהְיֶה
  choice: se tornará
  rationale: Embora o verbo possa significar “ser”, a construção resultativa com ל e o contraste entre pequenez e crescimento favorecem “se tornará”.
- source_word: לָאֶלֶף
  choice: mil
  rationale: אֶלֶף normalmente significa “mil”. O paralelismo com “uma nação poderosa” e o tema de multiplicação favorecem o sentido numérico, sem excluir em nota o possível sentido social de “clã”.
- source_word: הַצָּעִיר
  choice: o mais insignificante
  rationale: צָעִיר pode indicar alguém pequeno, jovem ou de pouca importância. Neste paralelismo, a ideia de pouca importância é mais provável que a de idade.
- source_word: לְגוֹי עָצוּם
  choice: uma nação poderosa
  rationale: A expressão combina גּוֹי, “nação”, com עָצוּם, “poderosa” ou “forte”, descrevendo a grandeza do crescimento prometido.
- source_word: אֲנִי יְהוָה
  choice: Eu sou Yahweh
  rationale: A fórmula de autoidentificação é mantida diretamente, e o nome divino יהוה é transliterado como “Yahweh”.
- source_word: בְּעִתָּהּ
  choice: a seu tempo
  rationale: A expressão significa “no tempo dela” ou “no tempo apropriado”. “A seu tempo” é idiomático em português e deixa implícito, como no hebraico, o cumprimento prometido.
- source_word: אֲחִישֶׁנָּה
  choice: apressarei isso
  rationale: O hifil de חושׁ expressa fazer algo ocorrer depressa. “Apressarei isso” preserva a ação divina e a tensão com o tempo previamente determinado.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pactual sem substituí-lo por um título.
- issue: Tensão entre o tempo determinado e a aceleração divina
  choice: a seu tempo, apressarei isso
  alternative: quando chegar a hora, farei isso rapidamente
  rationale: A tradução mantém lado a lado o momento próprio do cumprimento e a declaração de que Yahweh o apressará, sem explicar ou eliminar essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com construção poética concisa. “O menor” e “o mais insignificante” distinguem os dois termos hebraicos paralelos; “a seu tempo, apressarei isso” conserva deliberadamente a tensão do original.
