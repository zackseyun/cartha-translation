  text: אָ֤ז תִּרְאִי֙ וְ/נָהַ֔רְתְּ וּ/פָחַ֥ד וְ/רָחַ֖ב לְבָבֵ֑/ךְ כִּֽי יֵהָפֵ֤ךְ עָלַ֨יִ/ךְ֙ הֲמ֣וֹן יָ֔ם חֵ֥יל גּוֹיִ֖ם יָבֹ֥אוּ לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/005.yaml
  text: Then you will see and be radiant[a], and your heart will tremble and swell, because the abundance of the sea will be turned to you[b]; the wealth of the nations will come to you.
translation:
  language: pt
  text: Então você verá e ficará radiante[a]; seu coração estremecerá e se dilatará, pois a abundância do mar se voltará para você[b], e as riquezas das nações virão até você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “resplandecerá”. O verbo hebraico pode transmitir a ideia de brilhar ou iluminar-se em reação ao que se vê.
    reason: lexical_alternative
  - marker: b
    text: Ou “as riquezas do mar”. A expressão pode referir-se especificamente às riquezas trazidas por rotas marítimas até Sião.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּרְאִי
  choice: você verá
  rationale: O qal imperfeito na segunda pessoa feminina singular dirige-se a Sião/Jerusalém e, no contexto profético, tem sentido futuro.
- source_word: וְנָהַרְתְּ
  choice: e ficará radiante
  rationale: Neste contexto, o verbo descreve Sião iluminando-se ou resplandecendo em reação ao que vê, e não um fluxo literal.
- source_word: וּפָחַד
  choice: estremecerá
  rationale: Preserva a intensa reação física e emocional sem reduzi-la exclusivamente a medo negativo.
- source_word: וְרָחַב לְבָבֵךְ
  choice: seu coração se dilatará
  rationale: Mantém a metáfora hebraica de um coração que se torna amplo, sugerindo alegria, assombro e expansão interior.
- source_word: יֵהָפֵךְ עָלַיִךְ
  choice: se voltará para você
  rationale: Conserva tanto a ideia de mudança de direção em favor de Sião quanto a forma passiva do hebraico.
- source_word: הֲמוֹן יָם
  choice: a abundância do mar
  rationale: הֲמוֹן pode indicar abundância, multidão ou tumulto; o paralelismo favorece os recursos e bens provenientes do mar, sem exigir que essa nuance seja explicitada no texto principal.
- source_word: חֵיל גּוֹיִם
  choice: as riquezas das nações
  rationale: Embora חֵיל também possa significar força ou exército, o contexto de bens que chegam a Sião favorece riquezas ou recursos.
- source_word: יָבֹאוּ לָךְ
  choice: virão até você
  rationale: Expressa de modo direto o movimento das riquezas das nações em direção a Sião.
theological_decisions:
- issue: A força emocional da reação de Sião
  choice: Uma reação combinada de alegria radiante, tremor e assombro
  alternative: Medo puro ou alegria sem qualquer tremor
  rationale: A sequência verbal reúne brilho, tremor e dilatação do coração. A tradução preserva essa tensão, sem transformar a reação em terror nem em contentamento simples.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O tratamento por “você” torna natural a interpelação direta a Sião; o gênero feminino do hebraico decorre da personificação de Sião/Jerusalém. “Seu coração se dilatará” preserva deliberadamente a metáfora hebraica, embora seja mais elevada que a fala cotidiana.
