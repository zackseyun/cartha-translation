  text: וּ/פִתְּח֨וּ שְׁעָרַ֧יִ/ךְ תָּמִ֛יד יוֹמָ֥ם וָ/לַ֖יְלָה לֹ֣א יִסָּגֵ֑רוּ לְ/הָבִ֤יא אֵלַ֨יִ/ךְ֙ חֵ֣יל גּוֹיִ֔ם וּ/מַלְכֵי/הֶ֖ם נְהוּגִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/011.yaml
  text: Your gates will be open continually[a]; day and night they will not be shut, so that the wealth of the nations may be brought to you[b], with their kings led in procession.
translation:
  language: pt
  text: Seus portões estarão sempre abertos; nem de dia nem de noite se fecharão, para que lhe tragam a riqueza das nações[a] e seus reis sejam conduzidos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico também pode significar “os recursos”, “a força” ou “o exército das nações”; neste contexto, provavelmente se refere à riqueza trazida como tributo.
    reason: lexical_alternative
  - marker: b
    text: Ou “sejam levados”. O hebraico pode retratar os reis sendo escoltados, conduzidos em procissão ou levados em submissão.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפִתְּחוּ שְׁעָרַיִךְ תָּמִיד
  choice: Seus portões permanecerão sempre abertos
  rationale: Expressa em português natural o estado contínuo dos portões de Sião, mantendo o valor contextual futuro e a ideia de duração ininterrupta.
- source_word: יוֹמָם וָלַיְלָה לֹא יִסָּגֵרוּ
  choice: não serão fechados nem de dia nem de noite
  rationale: Conserva o merismo temporal e a forma passiva do hebraico, reforçando que os portões jamais serão fechados.
- source_word: לְהָבִיא אֵלַיִךְ
  choice: para que tragam a você
  rationale: O infinitivo com לְ indica finalidade. A construção ativa é natural em português e permite conservar a forma passiva distinta aplicada aos reis no fim do versículo.
- source_word: חֵיל גּוֹיִם
  choice: a riqueza das nações
  rationale: חֵיל pode significar força, exército, recursos ou riqueza; no contexto de Isaías 60, que descreve bens trazidos a Sião, 'riqueza' é a leitura mais provável.
- source_word: וּמַלְכֵיהֶם נְהוּגִים
  choice: e os reis delas sejam conduzidos
  rationale: Mantém o particípio passivo de נהג sem determinar se os reis são escoltados cerimonialmente ou levados como subjugados.
theological_decisions:
- issue: Sentido de חֵיל גּוֹיִם na imagem das nações que vêm a Sião
  choice: riqueza ou recursos das nações
  alternative: força ou exército das nações
  rationale: O contexto imediato destaca ouro, rebanhos, navios e outros bens entregues a Sião. A nota preserva a amplitude lexical sem introduzir no texto principal uma leitura militar menos provável.
- issue: Condição dos reis em נְהוּגִים
  choice: os reis são conduzidos, sem especificar a maneira
  alternative: os reis são conduzidos em procissão ou levados como cativos
  rationale: O hebraico afirma a condução passiva, mas não resolve por si só se a cena é de escolta cerimonial ou submissão. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. 'Portões' é corrente para acessos urbanos; 'permanecerão sempre abertos' transmite a continuidade de modo idiomático. Evitou-se 'em procissão' no corpo do texto para não eliminar a ambiguidade real do particípio hebraico.
