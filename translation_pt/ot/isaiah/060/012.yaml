id: ISA.60.12
reference: Isaiah 60:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי הַ/גּ֧וֹי וְ/הַ/מַּמְלָכָ֛ה אֲשֶׁ֥ר לֹא יַעַבְד֖וּ/ךְ יֹאבֵ֑דוּ וְ/הַ/גּוֹיִ֖ם חָרֹ֥ב יֶחֱרָֽבוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/012.yaml
  text: For the nation and the kingdom that will not serve you will perish[b][a], and those nations will be utterly laid waste.
translation:
  language: pt
  text: Pois a nação e o reino que não servirem a você perecerão, e as nações[a] serão totalmente devastadas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico passa do singular — “a nação e o reino” — para o plural — “as nações” —, produzindo um efeito retórico.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “serão certamente arruinadas”. O hebraico combina um infinitivo absoluto com um verbo da mesma raiz para dar ênfase.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que fundamenta as promessas e advertências anteriores, preservando de modo natural a força explicativa do conectivo.
- source_word: הַגּוֹי וְהַמַּמְלָכָה
  choice: a nação e o reino
  rationale: Mantém os dois substantivos no singular, como no hebraico, e conserva a linguagem política e coletiva da profecia.
- source_word: אֲשֶׁר לֹא יַעַבְדוּךְ
  choice: que não servirem a você
  rationale: O verbo עבד significa aqui servir. A construção com o futuro do subjuntivo é natural em português depois de uma relativa com referência futura, sem acrescentar a ideia não expressa de recusa deliberada.
- source_word: יֹאבֵדוּ
  choice: perecerão
  rationale: Expressa o sentido amplo de אבד, isto é, perecer ou chegar à ruína, sem especificar indevidamente o meio da destruição.
- source_word: וְהַגּוֹיִם
  choice: e as nações
  rationale: Preserva a coordenação simples e a passagem retórica do singular representativo para o plural no texto hebraico.
- source_word: חָרֹב יֶחֱרָבוּ
  choice: serão totalmente devastadas
  rationale: A combinação do infinitivo absoluto com uma forma finita da mesma raiz intensifica a afirmação; “totalmente” comunica essa ênfase em português corrente e digno.
theological_decisions:
- issue: Referente do sufixo feminino singular em “servirem a você”
  choice: Manter a interpelação direta como “a você”, sem explicitar o referente
  alternative: “servirem a Sião”, “servirem a Jerusalém” ou “servirem ao povo restaurado de Deus”
  rationale: O contexto imediato se dirige a Sião/Jerusalém no feminino singular. A tradução conserva a fala direta e não transforma a imagem profética em uma explicação teológica.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e ampla inteligibilidade internacional. “A você” mantém a interpelação direta sem identificar no próprio texto a cidade personificada; “totalmente devastadas” transmite de forma idiomática a construção enfática hebraica.
