    rationale: Embora «majestade» possa refletir parte do campo semântico de גאון, «glória» comunica de modo mais natural a honra e a elevação prometidas a Sião.
  - severity: low
    issue: A construção «sem ninguém passar por você» é menos explícita quanto ao caráter descritivo da condição anterior.
    rationale: «Sem que ninguém passasse por você» preserva a imagem de desolação e integra-se mais naturalmente ao contraste introduzido por «Em vez de».
