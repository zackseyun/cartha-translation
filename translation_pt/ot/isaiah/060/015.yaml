  text: תַּ֧חַת הֱיוֹתֵ֛/ךְ עֲזוּבָ֥ה וּ/שְׂנוּאָ֖ה וְ/אֵ֣ין עוֹבֵ֑ר וְ/שַׂמְתִּי/ךְ֙ לִ/גְא֣וֹן עוֹלָ֔ם מְשׂ֖וֹשׂ דּ֥וֹר וָ/דֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/015.yaml
  text: Instead of your being forsaken and hated[a], with no one passing through, I will make you an everlasting majesty, a joy from generation to generation.
translation:
  language: pt
  text: Em vez de ser abandonada e odiada, sem que ninguém passasse por você, farei de você uma glória eterna[a], uma alegria de geração em geração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma majestade eterna” ou “um orgulho eterno”. O termo hebraico pode indicar exaltação, majestade ou orgulho no sentido de uma condição honrosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת הֱיוֹתֵךְ
  choice: Em vez de você ser
  rationale: Expressa de modo natural a substituição da antiga condição de Sião pela condição futura prometida, preservando a força do infinitivo com sufixo feminino.
- source_word: עֲזוּבָה וּשְׂנוּאָה
  choice: abandonada e odiada
  rationale: Mantém os dois particípios passivos e sua referência feminina a Sião/Jerusalém; “abandonada” é claro e atual, e “odiada” conserva o sentido direto de שׂנא.
- source_word: וְאֵין עוֹבֵר
  choice: sem ninguém passar por você
  rationale: Preserva a imagem concreta de uma cidade desolada pela qual ninguém passa, em formulação idiomática em português.
- source_word: וְשַׂמְתִּיךְ
  choice: farei de você
  rationale: Neste contexto, שׂים com ל indica fazer com que alguém passe a ter determinada condição ou posição.
- source_word: לִגְאוֹן עוֹלָם
  choice: uma majestade eterna
  rationale: גאון pode indicar exaltação, majestade, glória ou orgulho. “Majestade” comunica aqui a condição elevada e honrosa concedida por Deus sem sugerir arrogância moral.
- source_word: מְשׂוֹשׂ
  choice: uma alegria
  rationale: O substantivo designa alegria ou motivo de alegria e se encaixa naturalmente na construção predicativa iniciada por “farei de você”.
- source_word: דּוֹר וָדוֹר
  choice: de geração em geração
  rationale: Equivalente português consagrado e natural para a continuidade através de gerações sucessivas.
theological_decisions:
- issue: Sentido de גאון no oráculo de restauração
  choice: majestade, como condição elevada e honrosa
  alternative: orgulho, glória ou exaltação
  rationale: O contexto apresenta a restauração de Sião realizada por Deus. A escolha evita atribuir arrogância pecaminosa à cidade, mas a nota conserva a amplitude lexical do termo hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. As formas femininas deixam clara a personificação de Sião/Jerusalém. O paralelismo entre “uma majestade eterna” e “uma alegria de geração em geração” foi preservado.
