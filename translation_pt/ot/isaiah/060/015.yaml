review_pass:
  verdict: revise
  source_fidelity: 'O versículo é fiel à estrutura e ao sentido do hebraico: a condição anterior de Sião, abandonada, odiada e sem trânsito, é contrastada com sua condição futura de honra duradoura e alegria contínua. Para גאון, «glória» é uma opção lexical plenamente defensável no contexto restaurador e resulta mais idiomática em português do que «majestade» nesta construção.'
  naturalness: «Uma majestade eterna» soa pouco natural em português contemporâneo, pois «majestade» normalmente designa uma pessoa real ou uma qualidade abstrata e raramente é predicado desta forma para uma cidade. «Uma glória eterna» preserva o registro elevado e é mais fluente. «Sem que ninguém passasse por você» exprime com mais clareza a situação passada do que a construção reduzida «sem ninguém passar por você».
  terminology: «Abandonada», «odiada», «glória eterna» e «alegria de geração em geração» mantêm um registro profético digno e acessível. A nota conserva as alternativas sem impor uma leitura moral negativa para «orgulho».
