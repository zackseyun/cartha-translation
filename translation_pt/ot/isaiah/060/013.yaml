  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כְּב֤וֹד הַ/לְּבָנוֹן֙ אֵלַ֣יִ/ךְ יָב֔וֹא בְּר֛וֹשׁ תִּדְהָ֥ר וּ/תְאַשּׁ֖וּר יַחְדָּ֑ו לְ/פָאֵר֙ מְק֣וֹם מִקְדָּשִׁ֔/י וּ/מְק֥וֹם רַגְלַ֖/י אֲכַבֵּֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/013.yaml
  text: The glory of Lebanon will come to you—cypress[a], plane tree, and pine together—to beautify the place of my sanctuary[b], and I will honor the place of my feet.
translation:
  language: pt
  text: A glória do Líbano virá a você — o cipreste, o plátano e o pinheiro, todos juntos[a] — para embelezar o lugar do meu santuário; e tornarei glorioso o lugar dos meus pés.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico menciona três tipos de árvore: cipreste, plátano e pinheiro. A identificação exata da segunda e da terceira espécie é incerta; entre as alternativas estão “olmo” e “buxo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o meu estrado para os pés”. O hebraico diz mais literalmente: “o lugar dos meus pés”.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּבוֹד
  choice: glória
  rationale: Preserva a ideia de esplendor e magnificência, aqui associada à riqueza florestal pela qual o Líbano era famoso.
- source_word: הַלְּבָנוֹן
  choice: Líbano
  rationale: Emprega a forma portuguesa consagrada do nome geográfico.
- source_word: אֵלַיִךְ
  choice: a você
  rationale: Reproduz a segunda pessoa feminina singular dirigida implicitamente a Sião/Jerusalém, sem explicitar no texto um referente que o versículo não nomeia.
- source_word: יָבוֹא
  choice: virá
  rationale: Traduz diretamente o imperfeito qal de בוא como verbo ativo, sem introduzir a ideia contextual, porém não expressa gramaticalmente, de que algo será trazido.
- source_word: בְּרוֹשׁ
  choice: cipreste
  rationale: É uma identificação tradicional e corrente para uma madeira valiosa nesse contexto, embora a espécie botânica exata não seja plenamente segura.
- source_word: תִּדְהָר
  choice: plátano
  rationale: É uma equivalência moderna amplamente adotada; a identificação da espécie permanece incerta e isso é indicado em nota.
- source_word: תְאַשּׁוּר
  choice: pinheiro
  rationale: Comunica naturalmente a ideia de uma árvore de madeira apreciada, sem esconder em nota a incerteza quanto à espécie exata.
- source_word: יַחְדָּו
  choice: todos juntos
  rationale: Expressa com naturalidade que as três espécies vêm em conjunto.
- source_word: לְפָאֵר
  choice: para embelezar
  rationale: O infinitivo piel de פאר indica tornar belo ou esplêndido; “embelezar” é claro e adequado ao contexto do santuário.
- source_word: מְקוֹם מִקְדָּשִׁי
  choice: o lugar do meu santuário
  rationale: Mantém a relação construta do hebraico e a referência ao espaço sagrado sem reduzi-la simplesmente a “meu santuário”.
- source_word: וּמְקוֹם רַגְלַי
  choice: o lugar dos meus pés
  rationale: Conserva a imagem antropomórfica literal do hebraico, que não emprega aqui o substantivo habitual para “estrado”.
- source_word: אֲכַבֵּד
  choice: tornarei glorioso
  rationale: O piel de כבד pode significar glorificar ou conferir esplendor. Esta formulação soa natural aplicada a um lugar e retoma adequadamente o tema da glória que abre o versículo.
theological_decisions:
- issue: Expressão antropomórfica da relação de Deus com o santuário
  choice: manter “o lugar dos meus pés” no texto principal
  alternative: “o meu estrado para os pés”
  rationale: A formulação literal preserva a força poética e a associação da presença divina com o santuário, sem substituir a expressão por um termo interpretativo que não ocorre neste versículo.
- issue: Referente da destinatária feminina singular
  choice: deixar o referente implícito
  alternative: explicitar “Sião” ou “Jerusalém”
  rationale: O contexto identifica a destinatária como Sião/Jerusalém, mas o próprio versículo não a nomeia; a tradução preserva esse fluxo discursivo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção poética com travessões destaca a enumeração das árvores; o ponto e vírgula mantém distintas, mas ligadas, as ações de embelezar o santuário e conferir glória ao lugar dos pés de Deus.
