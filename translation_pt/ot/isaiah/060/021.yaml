base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/021.yaml
  text: And all your people will be righteous[a]; forever they will possess the land, the shoot of my planting, the work of my hands[c][b], that I may be glorified.
translation:
  language: pt
  text: 'E todo o seu povo será justo; possuirá[a] a terra[b] para sempre: o renovo da plantação dele[c], obra das minhas mãos, para que eu seja glorificado.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “herdará”. O verbo hebraico pode significar tanto herdar como tomar posse de algo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a Terra”. A palavra hebraica pode designar uma terra ou território e também a Terra; o contexto de restauração favorece aqui “a terra”.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “da plantação dele”. Algumas interpretações ou tradições textuais harmonizam a expressão como “da minha plantação”, de acordo com a frase seguinte, “obra das minhas mãos”; o texto principal preserva a mudança de pessoa no texto hebraico fornecido.'
    reason: textual_variant
lexical_decisions:
- source_word: וְעַמֵּךְ כֻּלָּם
  choice: E todos os do seu povo
  rationale: Mantém a totalidade expressa por כֻּלָּם e a referência ao povo de Sião, com sintaxe natural em português. O sufixo hebraico dirige-se a Sião/Jerusalém no feminino singular, distinção que o possessivo português não marca.
- source_word: צַדִּיקִים
  choice: serão justos
  rationale: Preserva o sentido moral e pactual do adjetivo hebraico, sem acrescentar uma explicação doutrinária.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Expressa de modo corrente e solene a permanência duradoura da promessa.
- source_word: יִירְשׁוּ
  choice: possuirão
  rationale: No contexto de restauração, comunica posse estável; a alternativa lexical 'herdarão' é preservada em nota.
- source_word: אָרֶץ
  choice: a terra
  rationale: O contexto imediato favorece a terra restaurada do povo; o hebraico também pode designar a Terra ou o mundo, possibilidade registrada em nota.
- source_word: נֵצֶר
  choice: o renovo
  rationale: Representa um broto ou rebento vegetal e conserva o tom poético e bíblico da imagem.
- source_word: מטעו
  choice: da plantação dele
  rationale: Segue o sufixo de terceira pessoa masculina singular conforme o texto hebraico fornecido, sem harmonizá-lo silenciosamente com a primeira pessoa da expressão seguinte.
- source_word: מַעֲשֵׂה יָדַי
  choice: obra das minhas mãos
  rationale: Conserva a imagem concreta e a mudança para a primeira pessoa no texto hebraico.
- source_word: לְהִתְפָּאֵר
  choice: para que eu seja glorificado
  rationale: Exprime a finalidade ou resultado da ação divina e mantém a formulação teológica solene sem recorrer a um reflexivo pouco natural em português.
theological_decisions:
- issue: Mudança de pessoa em 'o renovo da plantação dele, obra das minhas mãos'
  choice: Manter a terceira pessoa em 'dele' e depois a primeira pessoa em 'minhas mãos'.
  alternative: Harmonizar como 'o renovo da minha plantação, obra das minhas mãos'.
  rationale: O texto hebraico fornecido apresenta sufixo de terceira pessoa em מטעו e de primeira pessoa em יָדַי. A tradução não emenda nem resolve silenciosamente essa tensão textual; a nota informa a leitura harmonizada encontrada em algumas tradições ou interpretações.
- issue: Alcance de אָרֶץ
  choice: Traduzir por 'a terra' no sentido contextual da terra restaurada.
  alternative: Traduzir por 'a Terra' ou 'o mundo'.
  rationale: A restauração de Sião favorece o referente territorial, mas a amplitude lexical permanece explicitada em nota.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e vocabulário amplamente compreensível. “Renovo” preserva a força poética da metáfora vegetal. A divisão em duas frases torna explícito que a imagem seguinte descreve o povo, sem alterar seu conteúdo.
