source:
  edition: WLC
  text: שִֽׁפְעַ֨ת גְּמַלִּ֜ים תְּכַסֵּ֗/ךְ בִּכְרֵ֤י מִדְיָן֙ וְ/עֵיפָ֔ה כֻּלָּ֖/ם מִ/שְּׁבָ֣א יָבֹ֑אוּ זָהָ֤ב וּ/לְבוֹנָה֙ יִשָּׂ֔אוּ וּ/תְהִלֹּ֥ת יְהוָ֖ה יְבַשֵּֽׂרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/006.yaml
  text: A multitude of camels will cover you[a], the young camels of Midian and Ephah; all of them will come from Sheba. They will carry gold and frankincense[b], and they will proclaim the praises of Yahweh.
translation:
  language: pt
  text: Uma multidão de camelos te cobrirá, camelos jovens[a] de Midiã e Efá; todos eles virão de Sabá. Carregarão ouro e olíbano e proclamarão[b] os louvores de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Algumas traduções tradicionais trazem “dromedários”; o termo hebraico se refere a camelos jovens.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “anunciarão boas-novas sobre os louvores de Yahweh”. O verbo pode transmitir a ideia de anunciar boas-novas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁפְעַת
  choice: Uma multidão de
  rationale: O substantivo expressa abundância ou profusão. “Uma multidão de” comunica naturalmente a grande quantidade de camelos sem transformar a imagem em uma “inundação” explícita.
- source_word: גְּמַלִּים
  choice: camelos
  rationale: Correspondência direta e corrente para o substantivo plural.
- source_word: תְּכַסֵּךְ
  choice: te cobrirá
  rationale: O piel de כסה significa normalmente “cobrir”. A forma verbal está no singular, de acordo com o sujeito coletivo שִׁפְעַת, e o sufixo de segunda pessoa feminina singular se dirige a Sião/Jerusalém. “Te cobrirá” preserva a imagem vívida.
- source_word: בִּכְרֵי
  choice: camelos jovens
  rationale: O termo designa camelos novos ou jovens. Esta formulação é mais clara no português atual do que o tradicional “dromedários”, que também pode sugerir uma classificação zoológica diferente.
- source_word: מִדְיָן וְעֵיפָה
  choice: Midiã e Efá
  rationale: Nomes próprios vertidos segundo suas formas portuguesas bíblicas correntes.
- source_word: כֻּלָּם
  choice: todos eles
  rationale: Mantém o pronome explícito do hebraico e sua ênfase inclusiva.
- source_word: מִשְּׁבָא
  choice: de Sabá
  rationale: Preserva tanto o nome próprio em sua forma portuguesa corrente quanto a indicação de procedência.
- source_word: יָבֹאוּ
  choice: virão
  rationale: Futuro simples adequado ao contexto da visão profética.
- source_word: זָהָב וּלְבוֹנָה
  choice: ouro e olíbano
  rationale: לְבוֹנָה designa especificamente olíbano, isto é, incenso de origem resinosa, e não incenso em sentido genérico.
- source_word: יִשָּׂאוּ
  choice: Carregarão
  rationale: O verbo significa levantar, levar ou carregar. “Carregarão” conserva o sentido concreto do transporte desses bens e evita explicitar como destino algo apenas implícito.
- source_word: וּתְהִלֹּת יְהוָה
  choice: os louvores de Yahweh
  rationale: Mantém o plural hebraico e preserva a compactação da expressão, que pode apontar para o louvor dirigido a Yahweh ou para aquilo que nele é digno de louvor.
- source_word: יְבַשֵּׂרוּ
  choice: proclamarão
  rationale: O verbo descreve o anúncio público e pode incluir a ideia de trazer boas-novas. “Proclamarão” funciona naturalmente com “louvores”, enquanto a nuance de boas-novas é registrada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico apresenta o nome próprio divino. “Yahweh” o representa por transliteração, sem trocá-lo por um título.
- issue: Sentido de וּתְהִלֹּת יְהוָה יְבַשֵּׂרוּ
  choice: proclamarão os louvores de Yahweh
  alternative: anunciarão as boas-novas dos louvores de Yahweh; proclamarão os feitos dignos de louvor de Yahweh
  rationale: A tradução mantém o plural “louvores” e não decide silenciosamente se a expressão indica louvores dirigidos a Yahweh ou seus atos dignos de louvor. A possível nuance de boas-novas no verbo é preservada em nota.
translation_notes:
  register: Português atual, digno e acessível, com boa legibilidade brasileira e vocabulário amplamente compreensível. Emprega “te” para conservar com concisão o discurso direto a Sião/Jerusalém e evita construções excessivamente arcaicas.
