base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/015.yaml
  text: And do not let Hezekiah make you trust in Yahweh[a], saying, ‘Yahweh will surely deliver us[b]; this city will not be given into the hand of the king of Assyria.’
translation:
  language: pt
  text: 'E não deixem que Ezequias os leve a confiar em Yahweh, dizendo: “Yahweh certamente nos livrará; esta cidade não será entregue na mão do rei da Assíria.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַל
  choice: E não deixem
  rationale: Preserva a continuidade do discurso e expressa naturalmente a proibição em português.
- source_word: יַבְטַח אֶתְכֶם
  choice: os leve a confiar
  rationale: Comunica a força causativa do hifil de בטח sem acrescentar a ideia interpretativa de engano.
- source_word: אֶל יְהוָה
  choice: em Yahweh
  rationale: A preposição exigida idiomaticamente por “confiar” em português é “em”, e o nome divino é mantido como Yahweh.
- source_word: הַצֵּל יַצִּילֵנוּ
  choice: certamente nos livrará
  rationale: Reproduz de modo idiomático a ênfase da construção hebraica com infinitivo absoluto e verbo finito; “livrar” se ajusta ao contexto de ameaça militar.
- source_word: לֹא תִנָּתֵן
  choice: não será entregue
  rationale: Representa com clareza a forma passiva nifal de נתן.
- source_word: בְּיַד מֶלֶךְ אַשּׁוּר
  choice: nas mãos do rei da Assíria
  rationale: Conserva a imagem hebraica de poder ou domínio, usando uma expressão natural e compreensível em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Mantém explicitamente o nome divino presente no texto hebraico, sem substituí-lo por um título.
- issue: Grau de ênfase em הַצֵּל יַצִּילֵנוּ
  choice: certamente nos livrará
  alternative: nos livrará; com certeza nos salvará
  rationale: A construção hebraica é enfática; “certamente” preserva essa força sem exagerá-la.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A fala mantém tom retórico direto; “os leve a confiar” evita tanto o formalismo rígido de “faça confiar” quanto a interpretação excessiva de “engane”.
