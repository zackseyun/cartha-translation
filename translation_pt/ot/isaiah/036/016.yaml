revisions:
- from: 'Não deem ouvidos a Ezequias, pois assim diz o rei da Assíria: Façam as pazes comigo[a] e venham para fora, até mim. Então cada homem comerá da sua própria videira e da sua própria figueira e beberá a água da sua própria cisterna[b],'
  to: 'Não deem ouvidos a Ezequias, pois assim diz o rei da Assíria: Façam as pazes comigo[a], saiam e venham a mim; e cada homem coma da sua própria videira e da sua própria figueira e beba da água da sua própria cisterna[b],'
  rationale: A revisão restaura a força imperativa da sequência hebraica, elimina a inferência temporal não expressa e substitui uma construção pouco idiomática por português natural. Mantêm-se o sentido diplomático de «façam as pazes», os possessivos e as âncoras das notas.
