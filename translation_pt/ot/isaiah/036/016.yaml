  text: אַֽל תִּשְׁמְע֖וּ אֶל חִזְקִיָּ֑הוּ כִּי֩ כֹ֨ה אָמַ֜ר הַ/מֶּ֣לֶךְ אַשּׁ֗וּר עֲשֽׂוּ אִתִּ֤/י בְרָכָה֙ וּ/צְא֣וּ אֵלַ֔/י וְ/אִכְל֤וּ אִישׁ גַּפְנ/וֹ֙ וְ/אִ֣ישׁ תְּאֵנָת֔/וֹ וּ/שְׁת֖וּ אִ֥ישׁ מֵי בוֹרֽ/וֹ־־ס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/016.yaml
  text: 'Do not listen to Hezekiah[a], for this is what the king of Assyria says: Make peace with me and come out to me, and let each man eat from his own vine and each from his own fig tree, and let each man drink the water of his own cistern[b],'
translation:
  language: pt
  text: 'Não deem ouvidos a Ezequias, pois assim diz o rei da Assíria: Façam as pazes comigo[a], saiam e venham a mim; e cada homem coma da sua própria videira e da sua própria figueira e beba da água da sua própria cisterna[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Façam comigo uma bênção”. Neste contexto, a expressão significa fazer as pazes ou chegar a termos favoráveis.
    reason: lexical_alternative
  - marker: b
    text: O hebraico repete “cada homem”, uma expressão distributiva masculina singular que se refere a cada indivíduo do grupo.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמְעוּ אֶל
  choice: deem ouvidos a
  rationale: A expressão significa escutar ou dar atenção ao conselho de alguém; “dar ouvidos a” é natural em português e preserva essa força sem explicitar obediência plena.
- source_word: חִזְקִיָּהוּ
  choice: Ezequias
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: כִּי כֹה אָמַר
  choice: pois assim diz
  rationale: Preserva de modo conciso a fórmula hebraica de introdução do discurso, com registro digno e corrente.
- source_word: הַמֶּלֶךְ אַשּׁוּר
  choice: o rei da Assíria
  rationale: Reproduz diretamente a relação genitiva e mantém o título político.
- source_word: עֲשׂוּ אִתִּי בְרָכָה
  choice: Façam as pazes comigo
  rationale: A formulação literal com “bênção” funciona aqui como expressão diplomática para estabelecer termos favoráveis ou paz; a tradução comunica o sentido contextual, e a forma literal é registrada em nota.
- source_word: וּצְאוּ אֵלַי
  choice: e venham para fora, até mim
  rationale: Mantém o sentido concreto de sair e dirigir-se ao emissário; “rendam-se” seria uma explicitação contextual não presente no verbo.
- source_word: וְאִכְלוּ ... וּשְׁתוּ
  choice: Então ... comerá ... e beberá
  rationale: Os imperativos integram a oferta persuasiva do emissário. O futuro em português comunica naturalmente o resultado prometido após a saída, sem alterar a substância do convite.
- source_word: אִישׁ
  choice: cada homem
  rationale: Preserva a expressão distributiva masculina singular repetida no hebraico.
- source_word: גַּפְנוֹ ... תְּאֵנָתוֹ
  choice: da sua própria videira e da sua própria figueira
  rationale: Os possessivos refletem os sufixos hebraicos, e “própria” salienta a posse e a imagem de segurança doméstica.
- source_word: מֵי בוֹרוֹ
  choice: a água da sua própria cisterna
  rationale: בּוֹר designa aqui uma cisterna ou reservatório escavado, não necessariamente um poço alimentado por nascente.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A fórmula “assim diz” preserva o tom oficial da proclamação; “deem ouvidos” e “façam as pazes” evitam literalismos obscuros. A pontuação mantém o versículo aberto para sua continuação no versículo seguinte.
