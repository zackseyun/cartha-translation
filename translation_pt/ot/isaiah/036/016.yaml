    issue: Mudança dos imperativos para futuro e acréscimo de «Então».
    rationale: וְאִכְלוּ e וּשְׁתוּ são imperativos coordenados com «façam» e «saiam». O futuro «comerá ... beberá» transforma a exortação do discurso em promessa declarativa, e «Então» não está expresso no hebraico.
  - severity: medium
    issue: «Venham para fora, até mim» é pouco natural.
    rationale: A construção soa calcada no inglês e torna imprecisa a sequência וּצְאוּ אֵלַי. «Saiam e venham a mim» exprime naturalmente o movimento de sair e dirigir-se ao interlocutor.
