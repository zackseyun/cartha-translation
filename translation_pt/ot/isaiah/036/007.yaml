  terminology: «SENHOR» é uma convenção apropriada para יהוה; «altares» e «prostrar-se» refletem bem os termos hebraicos. «Lugares altos» preserva o termo cultual sem especificar indevidamente a natureza ou a legitimidade dos locais.
