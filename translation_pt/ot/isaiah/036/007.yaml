  text: וְ/כִי תֹאמַ֣ר אֵלַ֔/י אֶל יְהוָ֥ה אֱלֹהֵ֖י/נוּ בָּטָ֑חְנוּ הֲ/לוֹא ה֗וּא אֲשֶׁ֨ר הֵסִ֤יר חִזְקִיָּ֨הוּ֙ אֶת בָּמֹתָ֣י/ו וְ/אֶת מִזְבְּחֹתָ֔י/ו וַ/יֹּ֤אמֶר לִֽ/יהוּדָה֙ וְ/לִ/יר֣וּשָׁלִַ֔ם לִ/פְנֵ֛י הַ/מִּזְבֵּ֥חַ הַ/זֶּ֖ה תִּֽשְׁתַּחֲוֽוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/007.yaml
  text: But if you say to me, ‘We trust in the LORD our God,’ is it not he whose high places and whose altars Hezekiah has removed, saying to Judah and to Jerusalem, ‘You shall bow down before this altar’?”
translation:
  language: pt
  text: 'Mas, se você me disser: “Confiamos no SENHOR, nosso Deus”, não foi ele quem Ezequias removeu os lugares altos e os altares, dizendo a Judá e a Jerusalém: “Vocês devem se prostrar diante deste altar”?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּמוֹתָיו
  choice: seus santuários nos lugares altos
  rationale: במות designa locais elevados de culto, não apenas elevações; a formulação explicita a função cultual sem decidir se eram legítimos.
- source_word: מִזְבְּחֹתָיו
  choice: seus altares
  rationale: Equivalente direto e natural de מזבחות, preservando o possessivo que, no argumento do porta-voz assírio, se refere ao SENHOR.
- source_word: תִּשְׁתַּחֲווּ
  choice: vocês devem se prostrar
  rationale: O verbo hitpael expressa inclinar-se ou prostrar-se em adoração; a construção portuguesa comunica a ordem sem reduzir o gesto a uma noção puramente interior.
theological_decisions:
- issue: A afirmação assíria de que os lugares altos e altares pertenciam ao SENHOR
  choice: preservar “seus” sem corrigir a alegação do orador
  alternative: explicar no texto que Ezequias removeu locais de culto considerados ilegítimos
  rationale: O versículo apresenta a argumentação do porta-voz assírio, possivelmente baseada em incompreensão ou manipulação da reforma de Ezequias; a tradução não deve validar nem corrigir silenciosamente essa alegação.
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: YHWH ou Javé
  rationale: Segue a convenção portuguesa amplamente reconhecida para o Tetragrama e mantém continuidade com a camada de consulta auditada.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “você/vocês”. A pergunta retórica e a fala dentro da fala foram preservadas. “É diante deste altar que” reproduz a focalização hebraica sobre o altar específico.
