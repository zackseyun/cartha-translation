  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מִ֗י בְּ/כָל אֱלֹהֵ֤י הָֽ/אֲרָצוֹת֙ הָ/אֵ֔לֶּה אֲשֶׁר הִצִּ֥ילוּ אֶת אַרְצָ֖/ם מִ/יָּדִ֑/י כִּֽי יַצִּ֧יל יְהוָ֛ה אֶת יְרוּשָׁלִַ֖ם מִ/יָּדִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/020.yaml
  text: Who among all the gods of these lands has delivered their land from my hand, that Yahweh should deliver Jerusalem from my hand?
translation:
  language: pt
  text: Quem, entre todos os deuses destas terras, livrou a sua terra da minha mão, para que Yahweh livre Jerusalém da minha mão?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי בְּכָל אֱלֹהֵי הָאֲרָצוֹת הָאֵלֶּה
  choice: Quem, entre todos os deuses destas terras
  rationale: A construção interrogativa introduz uma provocação retórica. “Quem, entre...” é natural em português e preserva tanto o valor de מִי quanto a relação expressa por בְּכָל. “Terras” mantém o sentido concreto dos territórios conquistados.
- source_word: הִצִּילוּ
  choice: livrou
  rationale: O hifil de נצל significa livrar ou resgatar. “Livrou” é corrente, digno e adequado ao contexto militar, além de permitir a repetição lexical com יַצִּיל.
- source_word: אֶת אַרְצָם
  choice: a sua terra
  rationale: O sufixo hebraico é plural e remete coletivamente aos deuses mencionados; no contexto distributivo da pergunta, “a sua terra” expressa naturalmente em português a terra associada a qualquer um deles, sem introduzir uma explicação ausente do texto.
- source_word: מִיָּדִי
  choice: da minha mão
  rationale: Preserva a metáfora hebraica transparente de mão como poder ou domínio e mantém sua repetição enfática nas duas orações.
- source_word: כִּי יַצִּיל
  choice: para que ... livre
  rationale: Neste desafio retórico, כִּי introduz a consequência ou possibilidade ironicamente negada pelo orador. “Para que ... livre” reproduz em português a lógica da provocação sem reduzir o imperfeito a mera previsão futura.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do Tetragrama em vez de substituí-lo por um título, conforme a evidência direta do texto hebraico.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalém
  rationale: Forma portuguesa consagrada do topônimo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém explicitamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e evita substituí-lo por um título; “Jeová” reflete uma vocalização tradicional posterior.
- issue: Força da pergunta final
  choice: para que Yahweh livre Jerusalém
  alternative: que Yahweh livrará Jerusalém; a ponto de Yahweh poder livrar Jerusalém
  rationale: 'A formulação escolhida conserva a zombaria e a inferência arrogante do emissário assírio: nenhum deus teria livrado sua terra e, portanto, Yahweh tampouco livraria Jerusalém. Não afirma como fato teológico a incapacidade de Yahweh, mas mantém a fala provocadora do personagem.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A repetição de “livrou/livre” e “da minha mão” foi mantida por ser retoricamente importante no hebraico. Não há marcadores de nota, pois nenhuma nota é necessária para esta unidade.
