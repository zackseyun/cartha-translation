  text: אַיֵּ֞ה אֱלֹהֵ֤י חֲמָת֙ וְ/אַרְפָּ֔ד אַיֵּ֖ה אֱלֹהֵ֣י סְפַרְוָ֑יִם וְ/כִֽי הִצִּ֥ילוּ אֶת שֹׁמְר֖וֹן מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/019.yaml
  text: Where are the gods of Hamath and Arpad? Where are the gods of Sepharvaim? And have they delivered Samaria from my hand?[a]
translation:
  language: pt
  text: Onde estão os deuses de Hamate e Arpade? Onde estão os deuses de Sefarvaim? Por acaso eles livraram Samaria da minha mão?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “resgataram” ou “salvaram”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה
  choice: Onde estão
  rationale: Interrogativo de lugar; o plural em português concorda naturalmente com “os deuses”.
- source_word: אֱלֹהֵי
  choice: os deuses de
  rationale: Forma construta plural de אֱלֹהִים; o artigo definido produz uma formulação natural em português.
- source_word: חֲמָת וְאַרְפָּד
  choice: Hamate e Arpade
  rationale: Empregam-se formas portuguesas tradicionais e reconhecíveis para os topônimos.
- source_word: סְפַרְוָיִם
  choice: Sefarvaim
  rationale: Transliteração portuguesa corrente do topônimo hebraico.
- source_word: וְכִי
  choice: Por acaso
  rationale: Expressa com naturalidade a força da pergunta retórica e desafiadora, sem transformar a partícula em mera conjunção.
- source_word: הִצִּילוּ
  choice: livraram
  rationale: O hifil de נצל significa livrar ou resgatar; “livraram” se ajusta ao contexto militar e preserva o vocabulário bíblico inteligível.
- source_word: אֶת שֹׁמְרוֹן
  choice: Samaria
  rationale: A partícula de objeto direto não é traduzida; mantém-se a forma portuguesa convencional do nome da cidade.
- source_word: מִיָּדִי
  choice: da minha mão
  rationale: Conserva a imagem hebraica de domínio e poder, clara também em português, bem como a jactância na primeira pessoa.
theological_decisions:
- issue: Referência de “minha mão” na fala do comandante assírio
  choice: Manter a jactância na primeira pessoa sem explicação interpretativa
  alternative: Explicitar “da mão do rei da Assíria” ou traduzir dinamicamente como “do meu poder”
  rationale: O hebraico apresenta a provocação em primeira pessoa. A tradução preserva a retórica e sua tensão sem inserir no texto uma identificação explicativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição retórica do hebraico foi preservada, e “Por acaso” comunica a provocação implícita na pergunta final.
