base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/022.yaml
  text: Then Eliakim son of Hilkiah[a], who was over the household, and Shebna the scribe, and Joah son of Asaph, the recorder, came to Hezekiah with their clothes torn and told him the words of the Rabshakeh.
translation:
  language: pt
  text: Então Eliaquim, filho de Hilquias, encarregado do palácio, Sebna, o escriba, e Joá, filho de Asafe, o cronista, foram até Ezequias com as roupas rasgadas e lhe contaram as palavras do rabsaqué.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rabsaqué é um título de um alto oficial assírio, muitas vezes entendido como algo semelhante a “chefe dos copeiros” ou como outra função elevada da corte.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Então ... foram
  rationale: O wayyiqtol dá sequência à narrativa. Embora o verbo hebraico esteja formalmente no singular, ele precede uma série de três pessoas coordenadas; o plural é natural e gramatical em português.
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: encarregado do palácio
  rationale: A expressão designa o alto funcionário responsável pela casa real. “Palácio” torna claro o contexto régio sem limitar a função à administração doméstica comum.
- source_word: הַסּוֹפֵר
  choice: o escriba
  rationale: É o equivalente lexical direto de סֹפֵר e pode designar aqui um escriba ou secretário da corte.
- source_word: הַמַּזְכִּיר
  choice: o cronista
  rationale: O título indica o oficial régio responsável pelos registros ou memoriais. “Cronista” é uma designação portuguesa concisa e tradicional para essa função.
- source_word: קְרוּעֵי בְגָדִים
  choice: com as roupas rasgadas
  rationale: Reproduz naturalmente o estado descrito pelo particípio passivo e conserva o gesto visível de aflição.
- source_word: וַיַּגִּידוּ לוֹ
  choice: lhe contaram
  rationale: O hifil de נגד significa contar, comunicar ou relatar; a formulação é corrente em português e introduz com clareza o conteúdo comunicado.
- source_word: דִּבְרֵי
  choice: as palavras de
  rationale: Mantém o sentido direto do construto de דָּבָר e ressalta que os oficiais transmitiram o discurso ouvido.
- source_word: רַב שָׁקֵה
  choice: rabsaqué
  rationale: Mantém a designação histórica assíria como título transliterado, sem impor no texto principal uma tradução funcional cuja precisão é incerta.
theological_decisions: []
