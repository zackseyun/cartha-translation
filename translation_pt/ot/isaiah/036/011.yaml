revisions:
- from: 'Então Eliaquim, Sebna e Joá disseram ao rabsaqué[a]: “Por favor, fale com os seus servos em aramaico, pois nós entendemos. Não fale conosco na língua de Judá[b], aos ouvidos do povo que está sobre a muralha.”'
