    reason: lexical_alternative
  revision_rationale: 'A revisão substitui um calque pouco idiomático por uma construção portuguesa natural que mantém a relação semântica do hebraico: o pedido é que o Rabsaqué não use a língua de Judá de modo que o povo na muralha a ouça. Também torna explícita a referência de «a entendemos» e torna a nota lexical historicamente mais precisa.'
