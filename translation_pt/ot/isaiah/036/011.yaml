translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A fala conserva o tom diplomático e deferente. Os marcadores foram posicionados junto aos termos a que suas notas efetivamente se referem.
