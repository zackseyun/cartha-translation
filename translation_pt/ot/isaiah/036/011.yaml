base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/011.yaml
  text: Then Eliakim[a], Shebna, and Joah said to the Rabshakeh, “Please speak to your servants in Aramaic, for we understand it[b]. And do not speak to us in Judean in the hearing of the people who are on the wall.”
translation:
  language: pt
  text: 'Então Eliaquim, Sebna e Joá disseram ao Rabsaqué[a]: “Por favor, fale com os seus servos em aramaico, pois nós a entendemos. Não fale conosco na língua de Judá[b], para que o povo que está sobre a muralha não ouça.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Rabsaqué” provavelmente é um título de um alto oficial assírio, não um nome pessoal.
    reason: cultural_note
  - marker: b
    text: Ou “em hebraico”. O termo hebraico יְהוּדִית refere-se mais especificamente à língua de Judá, isto é, dos habitantes de Judá.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: o rabsaqué
  rationale: Translitera o título assírio sem especificar com excesso de confiança qual era a função exata; o artigo preserva seu uso titular no hebraico.
- source_word: דַּבֶּר נָא
  choice: Por favor, fale
  rationale: O imperativo com נָא expressa um pedido cortês e deferente.
- source_word: עֲבָדֶיךָ
  choice: os seus servos
  rationale: Mantém a autodesignação humilde e diplomática dos oficiais, sem sugerir necessariamente escravidão literal.
- source_word: אֲרָמִית
  choice: em aramaico
  rationale: Designa a língua aramaica e corresponde ao uso natural em português.
- source_word: כִּי שֹׁמְעִים אֲנָחְנוּ
  choice: pois nós entendemos
  rationale: Neste contexto linguístico, שׁמע tem o sentido de compreender uma língua, não apenas ouvir sons.
- source_word: יְהוּדִית
  choice: na língua de Judá
  rationale: Preserva a referência específica à língua dos habitantes de Judá e evita substituir o termo antigo pelo rótulo linguístico mais amplo e tradicional 'hebraico'.
- source_word: בְּאָזְנֵי
  choice: aos ouvidos de
  rationale: Reproduz de modo natural e digno o idioma hebraico, indicando que o povo podia ouvir o discurso.
- source_word: הָעָם אֲשֶׁר עַל הַחוֹמָה
  choice: o povo que está sobre a muralha
  rationale: Mantém o sentido amplo de הָעָם e a localização explícita sobre a muralha, sem restringir o grupo a soldados.
