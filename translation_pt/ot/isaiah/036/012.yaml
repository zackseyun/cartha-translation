base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/012.yaml
  text: But the Rabshakeh said[a], “Has my master sent me to your master and to you to speak these words? Has he not sent me to the men sitting on the wall, to eat their own dung and drink their own urine with you?”
translation:
  language: pt
  text: 'Mas o rabsaqué disse[a]: “Foi ao seu senhor e a você que o meu senhor me enviou para dizer estas palavras? Não foi aos homens sentados sobre a muralha, para comerem os próprios excrementos e beberem a própria urina com vocês?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico usa linguagem de cerco deliberadamente grosseira: literalmente, “comer os excrementos deles e beber a urina deles”. A forma escrita para “urina” reflete um eufemismo dos escribas para uma expressão mais vulgar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: o rabsaqué
  rationale: Mantém o título assírio tradicionalmente transliterado em português, preservando sua designação histórica no contexto.
- source_word: אֲדֹנֶיךָ / אֲדֹנִי
  choice: seu senhor / meu senhor
  rationale: Os termos designam, respectivamente, Ezequias e o rei assírio como superiores políticos; “senhor” comunica hierarquia sem tratar nenhum deles como referência divina.
- source_word: לְדַבֵּר אֶת הַדְּבָרִים הָאֵלֶּה
  choice: para dizer estas palavras
  rationale: Preserva o substantivo concreto “palavras” e soa natural em português atual.
- source_word: הָאֲנָשִׁים הַיֹּשְׁבִים עַל הַחוֹמָה
  choice: os homens sentados sobre a muralha
  rationale: Reproduz o masculino plural e a construção participial de modo claro e conciso.
- source_word: לֶאֱכֹל ... וְלִשְׁתּוֹת
  choice: para comerem ... e beberem ...
  rationale: Mantém os infinitivos e evita explicitar como destino inevitável aquilo que o hebraico deixa apenas como consequência ameaçada do cerco.
- source_word: חראיהם
  choice: os próprios excrementos
  rationale: Transmite a imagem deliberadamente repulsiva, enquanto “próprios” explicita naturalmente em português a referência reflexiva dos sufixos no contexto.
- source_word: שיניהם
  choice: a própria urina
  rationale: Expressa o sentido pretendido pela tradição textual; a particularidade eufemística da forma escrita é registrada em nota.
- source_word: עִמָּכֶם
  choice: com vocês
  rationale: Preserva a mudança do destinatário singular anterior para a referência plural aos ouvintes que sofreriam juntos.
