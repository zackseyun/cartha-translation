    reason: lexical_alternative
  - marker: b
    text: 'O hebraico emprega uma construção distributiva, literalmente: “cada um, sua terra”.'
    reason: lexical_alternative
  revision_rationale: A revisão preserva a advertência e a pergunta retórica do texto hebraico, corrige o singular de «mão» e reformula o distributivo para um português moderno e natural. A nota b passa a documentar diretamente a construção hebraica que motivou «sua própria terra».
