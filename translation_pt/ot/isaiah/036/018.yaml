revisions:
- from: 'Não deixem que Ezequias os engane[a], dizendo: “Yahweh nos livrará”. Por acaso algum dos deuses das nações, cada um deles[b], livrou sua terra das mãos do rei da Assíria?'
  to: 'Não deixem que Ezequias os induza ao erro[a], dizendo: “Yahweh nos livrará.” Acaso algum dos deuses das nações livrou sua própria terra[b] da mão do rei da Assíria?'
  rationale: A revisão preserva a advertência e a pergunta retórica do texto hebraico, corrige o singular de «mão» e reformula o distributivo para um português moderno e natural. A nota b passa a documentar diretamente a construção hebraica que motivou «sua própria terra».
