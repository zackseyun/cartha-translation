  text: פֶּן יַסִּ֨ית אֶתְ/כֶ֤ם חִזְקִיָּ֨הוּ֙ לֵ/אמֹ֔ר יְהוָ֖ה יַצִּילֵ֑/נוּ הַ/הִצִּ֜ילוּ אֱלֹהֵ֤י הַ/גּוֹיִם֙ אִ֣ישׁ אֶת אַרְצ֔/וֹ מִ/יַּ֖ד מֶ֥לֶךְ אַשּֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/018.yaml
  text: Do not let Hezekiah mislead you[a], saying, ‘Yahweh will deliver us.’ Have any of the gods of the nations, each one[b], delivered his land from the hand of the king of Assyria?
translation:
  language: pt
  text: 'Não deixem que Ezequias os induza ao erro[a], dizendo: “Yahweh nos livrará.” Acaso algum dos deuses das nações livrou sua própria terra[b] da mão do rei da Assíria?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico também pode ser traduzido por “os incite”, “os persuada” ou “os desencaminhe”.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico emprega uma construção distributiva, literalmente: “cada um, sua terra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: Não deixem que
  rationale: Neste aviso, introduz uma precaução negativa; a formulação é natural em português e preserva a força exortativa.
- source_word: יַסִּית
  choice: engane
  rationale: O hifil de סות pode expressar incitar, persuadir ao erro ou desencaminhar. “Engane” comunica com clareza, neste contexto, a acusação do porta-voz assírio, enquanto a nota preserva a amplitude lexical.
- source_word: חִזְקִיָּהוּ
  choice: Ezequias
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יַצִּילֵנוּ
  choice: nos livrará
  rationale: O hifil de נצל indica livrar ou resgatar; “livrar” se ajusta ao contexto de ameaça militar.
- source_word: הַהִצִּילוּ
  choice: Por acaso ... livrou
  rationale: A partícula interrogativa e o perfeito formam uma pergunta retórica; o singular em português acompanha a leitura distributiva de אִישׁ.
- source_word: אֱלֹהֵי הַגּוֹיִם
  choice: os deuses das nações
  rationale: Tradução direta que mantém o sentido político-étnico de גּוֹיִם.
- source_word: אִישׁ
  choice: cada um deles
  rationale: אִישׁ tem aqui valor distributivo, referindo-se individualmente aos deuses mencionados.
- source_word: אַרְצוֹ
  choice: sua terra
  rationale: O sufixo singular concorda semanticamente com o distributivo “cada um”; “sua terra” é natural e preserva a relação possessiva sem marcar gênero desnecessariamente.
- source_word: מִיַּד מֶלֶךְ אַשּׁוּר
  choice: das mãos do rei da Assíria
  rationale: Preserva a imagem hebraica da mão como poder ou domínio; o plural idiomático “das mãos” é corrente em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal mediante transliteração, sem substituí-lo por um título.
- issue: Status dos deuses das nações na fala assíria
  choice: Manter literalmente “deuses das nações”
  alternative: Explicitar que seriam falsos deuses ou ídolos
  rationale: A frase faz parte do argumento do porta-voz assírio. A tradução não acrescenta uma avaliação teológica ausente nesta oração e preserva a tensão retórica do contexto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. O plural “vocês” está implícito nas formas “deixem” e “os”. A pergunta retórica foi mantida, assim como a metáfora hebraica da mão, em forma idiomática portuguesa.
