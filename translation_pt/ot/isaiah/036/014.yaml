  text: כֹּ֚ה אָמַ֣ר הַ/מֶּ֔לֶךְ אַל יַשִּׁ֥א לָ/כֶ֖ם חִזְקִיָּ֑הוּ כִּ֥י לֹֽא יוּכַ֖ל לְ/הַצִּ֥יל אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/014.yaml
  text: 'Thus says the king: Do not let Hezekiah deceive you[b][a], for he will not be able to deliver you.'
translation:
  language: pt
  text: 'Assim diz o rei: “Não deixem que Ezequias os engane[a], pois ele não será capaz de livrá-los[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os desencaminhe”. O verbo hebraico pode significar levar alguém ao erro ou enganar.
    reason: lexical_alternative
  - marker: b
    text: Ou “resgatá-los” ou “salvá-los”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: Assim diz o rei
  rationale: Preserva a fórmula solene de proclamação e mantém a referência genérica a “o rei”, como no hebraico.
- source_word: אַל יַשִּׁא לָכֶם חִזְקִיָּהוּ
  choice: Não deixem que Ezequias os engane
  rationale: Expressa naturalmente em português a proibição hebraica; “engane” comunica o sentido causativo de levar ao erro, enquanto o pronome plural corresponde aos destinatários.
- source_word: כִּי לֹא יוּכַל
  choice: pois ele não será capaz
  rationale: “Pois” introduz a justificativa da proibição, e “não será capaz” conserva a ideia explícita de incapacidade com orientação futura no contexto.
- source_word: לְהַצִּיל אֶתְכֶם
  choice: de livrá-los
  rationale: “Livrar” é natural, digno e adequado ao contexto de ameaça militar, sem restringir o verbo ao sentido estritamente espiritual.
theological_decisions:
- issue: Referente de “o rei”
  choice: Manter “o rei” sem explicitar o nome
  alternative: “Senaqueribe” ou “o grande rei”
  rationale: O hebraico deste versículo diz apenas “o rei”; nomeá-lo acrescentaria informação contextual não expressa no texto.
- issue: Sentido de הַצִּיל
  choice: “livrar”
  alternative: “salvar” ou “resgatar”
  rationale: “Livrar” preserva a amplitude do verbo e se ajusta à libertação de uma ameaça militar, sem impor uma leitura teológica mais específica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A fórmula “Assim diz” conserva o tom oficial da mensagem; “não deixem” evita uma construção excessivamente literal ou arcaica. Os marcadores foram posicionados junto aos termos a que se referem.
