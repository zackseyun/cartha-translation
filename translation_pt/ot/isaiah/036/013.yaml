  terminology: “Rabsaqué” é a forma portuguesa tradicional do título רַב־שָׁקֵה e evita apresentar como certo que ele fosse um “comandante de campo”. A nota identifica-o prudentemente como título assírio, sem impor uma equivalência funcional disputada. “Judaico” é apropriado neste contexto como designação da língua de Judá.
