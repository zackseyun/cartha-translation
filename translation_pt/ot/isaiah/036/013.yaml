  source_fidelity: 'A tradução preserva a sequência e o conteúdo do versículo: o oficial se põe de pé, fala em voz alta, em judaico, e transmite a proclamação do rei assírio. Contudo, “comandante de campo” atribui a רַב־שָׁקֵה uma função militar específica que o título não afirma diretamente. O título assírio deve ser preservado ou explicado sem essa redução funcional.'
