  yaml_path: translation/ot/isaiah/036/013.yaml
  text: Then the Rabshakeh stood and called out loudly in Judean, and said, “Hear the words of the great king, the king of Assyria.”
translation:
  language: pt
  text: 'Então o Rabsaqué[a] pôs-se de pé e gritou em alta voz, em judaico: “Ouçam as palavras do grande rei, o rei da Assíria!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Rabsaqué: título assírio, provavelmente “chefe dos copeiros”; aqui designa um alto oficial enviado pelo rei da Assíria.'
    reason: Preserva o título do texto hebraico sem atribuir ao oficial uma função militar específica que o termo, por si só, não define.
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: comandante de campo
  rationale: O termo é um título assírio de alto oficial, não um nome próprio; uma tradução funcional comunica isso ao leitor moderno sem conservar uma transliteração obscura.
- source_word: בְקוֹל גָּדוֹל
  choice: bem alto
  rationale: Expressa naturalmente em português o sentido idiomático de falar com voz forte e audível.
- source_word: יְהוּדִית
  choice: em judaico
  rationale: Designa a língua do reino de Judá, isto é, a fala dos judeus naquele contexto; 'judaico' preserva a formulação histórica sem identificá-la de modo excessivamente técnico com uma etapa linguística específica.
- source_word: הַמֶּלֶךְ הַגָּדוֹל
  choice: o grande rei
  rationale: Mantém literalmente o título imperial enfático usado pelo emissário assírio.
