  text: וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ רַב שָׁקֵ֔ה אִמְרוּ נָ֖א אֶל חִזְקִיָּ֑הוּ כֹּֽה אָמַ֞ר הַ/מֶּ֤לֶךְ הַ/גָּדוֹל֙ מֶ֣לֶךְ אַשּׁ֔וּר מָ֧ה הַ/בִּטָּח֛וֹן הַ/זֶּ֖ה אֲשֶׁ֥ר בָּטָֽחְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/004.yaml
  text: 'Then the Rabshakeh said to them[a], “Please say to Hezekiah, ‘Thus says the great king[b], the king of Assyria: What is this confidence that you have trusted in?’”'
translation:
  language: pt
  text: 'Então o rabsaqué[a] lhes disse: “Digam, por favor, a Ezequias: ‘Assim diz o grande rei, o rei da Assíria: Que confiança é essa em que você confia?[b]’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Rabsaqué” provavelmente era um título de um oficial assírio; entre as traduções possíveis estão “chefe dos copeiros” e outras designações de um alto oficial da corte ou do exército.
    reason: cultural_note
  - marker: b
    text: O hebraico emprega um substantivo e um verbo da mesma raiz, literalmente algo como “Que confiança é essa em que você confia?”, criando ênfase retórica.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: o rabsaqué
  rationale: Mantém a designação histórica como título transliterado, sem impor uma equivalência funcional debatida; o artigo definido corresponde à referência determinada no hebraico.
- source_word: אִמְרוּ נָא
  choice: Digam, por favor
  rationale: O imperativo plural é preservado, e נָא é expresso por uma fórmula cortês e natural em português moderno.
- source_word: חִזְקִיָּהוּ
  choice: Ezequias
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome pessoal.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva de maneira concisa o tom formal da fórmula de mensageiro ou arauto.
- source_word: הַמֶּלֶךְ הַגָּדוֹל
  choice: o grande rei
  rationale: Reproduz diretamente o título real assírio e sua pretensão política.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: o rei da Assíria
  rationale: Mantém a aposição e a repetição de “rei” presentes no hebraico.
- source_word: הַבִּטָּחוֹן הַזֶּה אֲשֶׁר בָּטָחְתָּ
  choice: Que confiança é essa em que você confia?
  rationale: Preserva a pergunta retórica e a repetição enfática do substantivo e do verbo derivados da mesma raiz, sem sacrificar a compreensão em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fórmula régia conserva solenidade, enquanto a ordem aos enviados permanece cortês e natural. O pronome singular “você” na pergunta corresponde a Ezequias.
