base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/005.yaml
  text: You say—but they are only words of the lips—‘There is counsel and strength for war.’ Now in whom have you trusted, that you have rebelled against me?
translation:
  language: pt
  text: 'Eu digo[a]: mero falar é conselho e força para a guerra? Agora, em quem você confiou para se rebelar contra mim?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico de Isaías diz literalmente «Eu disse»; no discurso direto, «Eu digo» é uma tradução possível. O relato paralelo em 2 Reis 18:20 diz «Você diz», leitura seguida por algumas traduções.
    reason: Registra a diferença relevante entre o texto massorético de Isaías e o relato paralelo, sem substituir silenciosamente a primeira pessoa do WLC.
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Eu digo
  rationale: O texto massorético de Isaías traz a primeira pessoa do singular, literalmente “eu disse”; no discurso direto em português, o presente “eu digo” expressa com naturalidade a afirmação que o emissário acaba de fazer, sem adotar no corpo do texto a leitura variante “você diz”.
- source_word: דְּבַר שְׂפָתַיִם
  choice: palavras dos lábios
  rationale: Mantém a imagem hebraica e seu sentido depreciativo de fala sem substância, em vez de reduzi-la simplesmente a “palavras vazias”.
- source_word: עֵצָה וּגְבוּרָה לַמִּלְחָמָה
  choice: o conselho e a força para a guerra
  rationale: 'Preserva os dois elementos coordenados: planejamento estratégico e capacidade militar.'
- source_word: בָטַחְתָּ
  choice: você confiou
  rationale: Traduz o perfeito hebraico de modo direto e natural, apontando para a confiança na qual a rebelião se apoiou.
- source_word: מָרַדְתָּ בִּי
  choice: se rebelar contra mim
  rationale: Expressa diretamente a acusação política do emissário assírio, sem acrescentar uma interpretação teológica.
theological_decisions:
- issue: Pessoa verbal na abertura do versículo
  choice: 'Seguir o texto massorético: “Eu digo”'
  alternative: “Você diz”, conforme o paralelo em 2 Reis 18:20 e algumas reconstruções textuais
  rationale: A edição-fonte WLC traz inequivocamente אָמַרְתִּי, primeira pessoa singular. A variante contextual é relevante, mas não deve substituir silenciosamente o texto-fonte; por isso, aparece em nota.
translation_notes:
  register: 'Português moderno, claro e digno, com “você” para a segunda pessoa singular. A ordem da primeira frase foi ajustada para tornar explícita em português a relação predicativa do hebraico: conselho e força militar são caracterizados como meras palavras.'
