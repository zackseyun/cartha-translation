source:
  edition: WLC
  text: וְ/אֵ֣יךְ תָּשִׁ֗יב אֵ֠ת פְּנֵ֨י פַחַ֥ת אַחַ֛ד עַבְדֵ֥י אֲדֹנִ֖/י הַ/קְטַנִּ֑ים וַ/תִּבְטַ֤ח לְ/ךָ֙ עַל מִצְרַ֔יִם לְ/רֶ֖כֶב וּ/לְ/פָרָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/009.yaml
  text: How then can you repulse a single captain of the least of my master's servants[b][a], when you trust in Egypt for chariots and horsemen?
translation:
  language: pt
  text: Como, então, você poderia repelir um só oficial dentre os servos mais insignificantes do meu senhor[a], se confia no Egito para obter carros de guerra e cavaleiros?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “governador”. O termo hebraico pode designar um governador ou outro funcionário subordinado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵיךְ
  choice: Como, então
  rationale: Preserva tanto a conexão com o argumento anterior quanto a força da pergunta retórica.
- source_word: תָּשִׁיב אֵת פְּנֵי
  choice: poderia repelir
  rationale: Traduz naturalmente o idioma hebraico, literalmente 'fazer voltar o rosto de', com seu sentido contextual de resistir e rechaçar militarmente.
- source_word: פַחַת
  choice: governador
  rationale: O termo designa um governante ou alto funcionário subordinado; 'governador' preserva melhor sua amplitude administrativa, mesmo dentro do contexto militar.
- source_word: אַחַד
  choice: um só
  rationale: 'Realça a provocação: Judá não conseguiria resistir nem sequer a um oficial de baixa patente.'
- source_word: עַבְדֵי אֲדֹנִי הַקְטַנִּים
  choice: até mesmo dos menores servos do meu senhor
  rationale: Expressa a relação de pertencimento do construto e entende 'menores' como posição inferior, não tamanho físico; 'até mesmo' torna clara em português a força depreciativa da formulação.
- source_word: וַתִּבְטַח לְךָ עַל מִצְרַיִם
  choice: se confia no Egito
  rationale: Reproduz o vínculo argumentativo e a ideia central de dependência militar; o dativo לְךָ é idiomático e não exige uma tradução pesada como 'para si mesmo'.
- source_word: לְרֶכֶב
  choice: para obter carros de guerra
  rationale: O singular coletivo רֶכֶב indica carros ou força de carros; 'carros de guerra' evita a ambiguidade moderna de 'carros', e 'obter' explicita de modo moderado a dependência de recursos egípcios.
- source_word: וּלְפָרָשִׁים
  choice: e cavaleiros
  rationale: Tradução direta e clara para tropas montadas.
theological_decisions: []
