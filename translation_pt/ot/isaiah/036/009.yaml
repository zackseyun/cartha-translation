revisions:
- from: Como, então, você poderia repelir um só governador, até mesmo dos menores servos do meu senhor[a], se confia no Egito para obter carros de guerra e cavaleiros?
  to: Como, então, você poderia repelir um só oficial dentre os servos mais insignificantes do meu senhor[a], se confia no Egito para obter carros de guerra e cavaleiros?
  rationale: A revisão corrige a relação sintática e hierárquica de «um só oficial ... dos menores servos», preserva a ênfase depreciativa de «um só» e emprega um equivalente português mais adequado ao papel militar-administrativo de פַּחַת. A formulação sobre o Egito mantém a dependência de recursos militares implicada pelo hebraico, sem tornar explícito além do necessário o dativo reflexivo.
