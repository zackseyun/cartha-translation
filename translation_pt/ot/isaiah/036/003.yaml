  naturalness: A redação revista conserva português moderno e claro. "Acompanhado de" torna natural em português a coordenação posterior ao verbo singular, sem alterar o sentido narrativo.
  terminology: Eliaquim, Hilquias, Sebna, Joá e Asafe são formas portuguesas estabelecidas. "Administrador do palácio" comunica o cargo de quem estava sobre a casa real; "secretário" é uma opção moderna plausível para סֹפֵר, com "escriba" anotado. Para מַזְכִּיר, "responsável pelos registros" evita a conotação excessivamente literária de "cronista".
