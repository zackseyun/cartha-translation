base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/003.yaml
  text: Then Eliakim son of Hilkiah[a], who was over the household, came out to him, along with Shebna the scribe and Joah son of Asaph[d][c][b], the recorder.
translation:
  language: pt
  text: Então Eliaquim, filho de Hilquias, administrador do palácio,[a] saiu ao encontro dele, acompanhado de Sebna, o secretário,[b] e de Joá, filho de Asafe, responsável pelos registros.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o que estava sobre a casa”; isto é, um alto oficial encarregado da administração do palácio.'
    reason: cultural_note
  - marker: b
    text: Ou “escriba”.
    reason: lexical_alternative
  - marker: c
    text: Ou “cronista”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא ... אֵלָיו
  choice: saíram ao encontro dele
  rationale: Embora o verbo esteja no singular, ele introduz uma sequência de três oficiais como sujeito composto; o plural é natural em português. A expressão preserva o movimento em direção ao representante assírio sem fixar artificialmente a perspectiva entre “foi” e “veio”.
- source_word: אֶלְיָקִים בֶּן חִלְקִיָּהוּ
  choice: Eliaquim, filho de Hilquias
  rationale: Emprega as formas portuguesas tradicionais e claras dos nomes e mantém a relação filial do hebraico.
- source_word: אֲשֶׁר עַל הַבָּיִת
  choice: o administrador do palácio
  rationale: O idiomatismo designa o alto oficial encarregado da casa real ou da administração palaciana; a tradução funcional comunica o cargo com clareza.
- source_word: הַסֹּפֵר
  choice: o secretário
  rationale: Neste contexto cortesão, סֹפֵר indica um oficial administrativo ligado à escrita; “secretário” é mais natural no português atual do que “escriba”, sem excluir a função documental.
- source_word: יוֹאָח בֶּן אָסָף
  choice: Joá, filho de Asafe
  rationale: Adota formas portuguesas reconhecíveis e conserva a construção filial.
- source_word: הַמַּזְכִּיר
  choice: o cronista
  rationale: O título pode indicar o oficial responsável por registros e memoriais; “cronista” preserva a ligação com o registro oficial, embora a função exata não seja totalmente certa.
