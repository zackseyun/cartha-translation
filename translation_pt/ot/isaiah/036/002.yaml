base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/002.yaml
  text: Then the king of Assyria sent the Rabshakeh from Lachish to Jerusalem, to King Hezekiah, with a heavy force. And he stood by the conduit of the upper pool, on the highway to the launderer’s field.
translation:
  language: pt
  text: Então o rei da Assíria enviou o Rabsaqué[a] de Laquis a Jerusalém, ao rei Ezequias, com uma grande força militar. Ele ficou junto ao canal do reservatório superior, na estrada que leva ao campo do lavadeiro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: Rabsaqué, título de um alto oficial assírio.'
    reason: Preserva o título original e esclarece que não deve ser entendido necessariamente como nome próprio nem identificado com uma função moderna específica.
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: o comandante-chefe
  rationale: O termo é um título oficial assírio, não um nome próprio; uma tradução funcional comunica melhor ao leitor moderno a alta patente do enviado, sem adotar a associação etimológica possivelmente enganosa com a função de copeiro.
- source_word: בְּחֵיל כָּבֵד
  choice: com um poderoso exército
  rationale: חַיִל pode designar força militar ou exército, e כָּבֵד expressa grande peso, poder ou magnitude; a formulação natural em português preserva a ideia de uma força militar considerável.
- source_word: בִּתְעָלַת הַבְּרֵכָה הָעֶלְיוֹנָה
  choice: junto ao canal do açude superior
  rationale: תְּעָלָה é canal ou aqueduto, e בְּרֵכָה é um reservatório ou açude; 'açude' oferece uma designação concreta e acessível em português.
- source_word: בִּמְסִלַּת שְׂדֵה כוֹבֵס
  choice: na estrada do campo dos lavadeiros
  rationale: מְסִלָּה indica estrada elevada ou principal; כוֹבֵס é quem lava ou alveja tecidos. O plural genérico 'lavadeiros' produz uma expressão locativa natural sem obscurecer a atividade exercida no lugar.
