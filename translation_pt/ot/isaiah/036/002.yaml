translation_notes:
  register: Português atual, digno e narrativo, com ordem sintática natural e vocabulário acessível. A tradução mantém os topônimos tradicionais Laquis, Jerusalém e Ezequias e evita arcaísmos como 'aqueduto' quando 'canal' comunica o referente com maior clareza.
