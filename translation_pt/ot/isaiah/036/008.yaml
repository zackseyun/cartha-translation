  text: וְ/עַתָּה֙ הִתְעָ֣רֶב נָ֔א אֶת אֲדֹנִ֖/י הַ/מֶּ֣לֶךְ אַשּׁ֑וּר וְ/אֶתְּנָ֤ה לְ/ךָ֙ אַלְפַּ֣יִם סוּסִ֔ים אִם תּוּכַ֕ל לָ֥/תֶת לְ/ךָ֖ רֹכְבִ֥ים עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/008.yaml
  text: Now then[a], please make a wager with my master, the king of Assyria, and I will give you two thousand horses, if you are able to provide riders for them.
translation:
  language: pt
  text: Agora, por favor, faça uma aposta[a] com o meu senhor, o rei da Assíria, e eu lhe darei dois mil cavalos, se você for capaz de fornecer cavaleiros para montá-los.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “assuma um compromisso com” ou “faça um acordo com”. O verbo hebraico pode indicar a entrada em um compromisso ou aposta; neste contexto, predomina o sentido provocador de uma aposta ou desafio.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעָרֶב
  choice: faça uma aposta
  rationale: No hitpael com אֶת e neste contexto de provocação diplomática, o verbo sugere assumir um compromisso em forma de aposta ou desafio, e não simplesmente fazer um acordo neutro. “Faça uma aposta” comunica de modo natural o tom de escárnio.
- source_word: נָא
  choice: por favor
  rationale: A partícula suaviza formalmente o imperativo. “Por favor” preserva a cortesia retórica e irônica da provocação.
- source_word: אֶת אֲדֹנִי הַמֶּלֶךְ אַשּׁוּר
  choice: com o meu senhor, o rei da Assíria
  rationale: A expressão identifica a outra parte da aposta. “Meu senhor” traduz naturalmente a referência ao superior humano do porta-voz, esclarecida pelo aposto “o rei da Assíria”.
- source_word: וְאֶתְּנָה לְךָ
  choice: e eu lhe darei
  rationale: Expressa a oferta ou promessa do porta-voz como consequência do desafio.
- source_word: אַלְפַּיִם סוּסִים
  choice: dois mil cavalos
  rationale: Tradução direta e clara da expressão numérica.
- source_word: אִם תּוּכַל
  choice: se você for capaz
  rationale: Mantém a condição de capacidade e reforça naturalmente a provocação implícita.
- source_word: לָתֵת לְךָ רֹכְבִים עֲלֵיהֶם
  choice: fornecer cavaleiros para montá-los
  rationale: Comunica tanto a ideia de disponibilizar cavaleiros quanto a relação explícita deles com os cavalos, sem reduzir a frase ao ato físico de colocá-los sobre os animais.
