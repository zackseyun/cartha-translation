  text: וַ/יְהִ֡י בְּ/אַרְבַּע֩ עֶשְׂרֵ֨ה שָׁנָ֜ה לַ/מֶּ֣לֶךְ חִזְקִיָּ֗הוּ עָלָ֞ה סַנְחֵרִ֤יב מֶֽלֶךְ אַשּׁוּר֙ עַ֣ל כָּל עָרֵ֧י יְהוּדָ֛ה הַ/בְּצֻר֖וֹת וַֽ/יִּתְפְּשֵֽׂ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/001.yaml
  text: In the fourteenth year of King Hezekiah, Sennacherib king of Assyria came up against all the fortified cities of Judah and captured them.
translation:
  language: pt
  text: No décimo quarto ano do rei Ezequias, Senaqueribe, rei da Assíria, avançou contra todas as cidades fortificadas de Judá e as conquistou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: No décimo quarto ano...
  rationale: A forma narrativa introduz um novo episódio. Em português atual, sua função discursiva é naturalmente absorvida pela oração temporal, sem acrescentar um marcador como “ora” que poderia sugerir uma palavra temporal explícita inexistente no hebraico.
- source_word: בְּאַרְבַּע עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ חִזְקִיָּהוּ
  choice: No décimo quarto ano do rei Ezequias
  rationale: A expressão é uma fórmula de datação pelo ano de reinado; esta construção é natural e precisa em português.
- source_word: עָלָה ... עַל
  choice: avançou contra
  rationale: No contexto militar, o verbo com a preposição indica movimento hostil contra um alvo. “Avançou contra” preserva essa nuance sem explicitar além do texto como ocorreu a campanha.
- source_word: סַנְחֵרִיב
  choice: Senaqueribe
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: rei da Assíria
  rationale: Reproduz naturalmente a cadeia construta que identifica o cargo e o reino de Senaqueribe.
- source_word: כָּל עָרֵי יְהוּדָה הַבְּצֻרוֹת
  choice: todas as cidades fortificadas de Judá
  rationale: “Fortificadas” expressa com precisão cidades protegidas por obras defensivas.
- source_word: וַיִּתְפְּשֵׂם
  choice: e as conquistou
  rationale: No contexto de cidades atacadas militarmente, “conquistou” comunica melhor a tomada das cidades do que o genérico “pegou”; o pronome feminino plural retoma “cidades”.
