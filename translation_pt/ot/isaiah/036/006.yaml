  text: הִנֵּ֣ה בָטַ֡חְתָּ עַל מִשְׁעֶנֶת֩ הַ/קָּנֶ֨ה הָ/רָצ֤וּץ הַ/זֶּה֙ עַל מִצְרַ֔יִם אֲשֶׁ֨ר יִסָּמֵ֥ךְ אִישׁ֙ עָלָ֔י/ו וּ/בָ֥א בְ/כַפּ֖/וֹ וּ/נְקָבָ֑/הּ כֵּ֚ן פַּרְעֹ֣ה מֶֽלֶךְ מִצְרַ֔יִם לְ/כָֽל הַ/בֹּטְחִ֖ים עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/006.yaml
  text: Look[a], you are trusting in Egypt, that broken reed of a staff, which, if a man leans on it, goes into his hand and pierces it. So is Pharaoh king of Egypt to all who trust in him.
translation:
  language: pt
  text: 'Veja, você está confiando no Egito, esse bastão de cana quebrada: se alguém[a] se apoiar nele, ele lhe entrará na mão e a perfurará. Assim é Faraó, rei do Egito, para todos os que confiam nele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “um homem”; o singular masculino é usado aqui de maneira representativa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Veja
  rationale: Mantém a força de chamar a atenção, em português atual e digno, sem o tom arcaico de “Eis”.
- source_word: בָטַחְתָּ
  choice: você está confiando
  rationale: O perfeito descreve, no contexto, a postura presente e contínua de dependência política; a forma progressiva comunica isso naturalmente.
- source_word: מִשְׁעֶנֶת הַקָּנֶה הָרָצוּץ
  choice: esse cajado de cana quebrada
  rationale: Preserva a imagem concreta de um apoio usado como cajado e a condição frágil da cana esmagada ou quebrada.
- source_word: אֲשֶׁר יִסָּמֵךְ אִישׁ עָלָיו
  choice: quando um homem se apoia nele
  rationale: Expressa a situação representativa ou habitual descrita pela oração relativa, sem tornar o acontecimento meramente hipotético.
- source_word: וּבָא בְכַפּוֹ וּנְקָבָהּ
  choice: ele lhe entra na palma da mão e a perfura
  rationale: Mantém a sequência vívida e concreta do hebraico; “palma da mão” representa com precisão כַּף, e “perfura” conserva a força física de נָקַב.
- source_word: כֵּן פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: Assim é o faraó, rei do Egito
  rationale: Reproduz de modo conciso a comparação e deixa clara a aposição.
- source_word: לְכָל הַבֹּטְחִים עָלָיו
  choice: para todos os que confiam nele
  rationale: Expressa a relação de Faraó com todos os que nele depositam sua confiança e mantém a repetição lexical de בטח.
