  yaml_path: translation/ot/isaiah/036/021.yaml
  text: But they kept silent and did not answer him a word[a], for the king’s command was, saying, “Do not answer him.”
translation:
  language: pt
  text: 'Mas eles ficaram calados e não lhe responderam palavra alguma, pois a ordem do rei era: “Não lhe respondam.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּחֲרִישׁוּ
  choice: eles ficaram calados
  rationale: Expressa o silêncio deliberado do grupo no contexto, em português natural e digno.
- source_word: וְלֹא עָנוּ אֹתוֹ דָּבָר
  choice: e não lhe responderam palavra alguma
  rationale: Preserva a formulação enfática do hebraico e comunica que não deram resposta nenhuma.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente, em registro narrativo, a razão do silêncio.
- source_word: מִצְוַת הַמֶּלֶךְ
  choice: a ordem do rei
  rationale: Neste contexto, מִצְוָה designa uma determinação autoritativa; “ordem” é corrente e preciso.
- source_word: הִיא לֵאמֹר
  choice: 'era:'
  rationale: Os dois-pontos introduzem de modo natural em português o conteúdo explícito da ordem, sem reproduzir o hebraísmo pouco idiomático “era, dizendo”.
- source_word: לֹא תַעֲנֻהוּ
  choice: Não lhe respondam
  rationale: Reproduz a proibição dirigida ao grupo, mantendo o referente masculino singular de “lhe”.
