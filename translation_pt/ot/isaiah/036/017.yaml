reference: Isaiah 36:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עַד בֹּאִ֕/י וְ/לָקַחְתִּ֥י אֶתְ/כֶ֖ם אֶל אֶ֣רֶץ כְּ/אַרְצְ/כֶ֑ם אֶ֤רֶץ דָּגָן֙ וְ/תִיר֔וֹשׁ אֶ֥רֶץ לֶ֖חֶם וּ/כְרָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/017.yaml
  text: until I come and take you away to a land like your own land—a land of grain and new wine[b][a], a land of bread and vineyards.
translation:
  language: pt
  text: até que eu venha e leve vocês para uma terra semelhante à de vocês — terra de cereal e vinho novo[a], terra de pão e vinhedos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vinho”. O termo hebraico תירוש costuma ser distinguido da palavra mais geral para vinho e frequentemente é traduzido como “vinho novo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: até que
  rationale: Marca o limite temporal da espera ordenada no contexto mais amplo e corresponde naturalmente ao hebraico.
- source_word: בֹּאִי
  choice: eu venha
  rationale: O qal na primeira pessoa do singular de בוא significa “vir”; o subjuntivo é exigido em português depois de “até que” para uma ação futura.
- source_word: וְלָקַחְתִּי אֶתְכֶם
  choice: e leve vocês
  rationale: לקח significa literalmente “tomar, levar”. “Leve vocês” expressa com naturalidade o deslocamento para outro lugar sem acrescentar ao texto, de modo explícito, a ideia de força.
- source_word: אֶל אֶרֶץ כְּאַרְצְכֶם
  choice: para uma terra semelhante à de vocês
  rationale: אל indica direção, e כְ estabelece comparação. “Semelhante à de vocês” é claro, natural e preserva a promessa propagandística de uma terra comparável à deles.
- source_word: אֶרֶץ דָּגָן וְתִירוֹשׁ
  choice: terra de cereal e vinho novo
  rationale: דגן designa cereais ou grãos como produção agrícola; “cereal” evita restringir o sentido a uma espécie. תירוש costuma designar vinho novo e se distingue do termo mais geral para vinho.
- source_word: אֶרֶץ לֶחֶם וּכְרָמִים
  choice: terra de pão e vinhedos
  rationale: Mantém as imagens agrícolas concretas de לחם, “pão”, e כרמים, “vinhedos”, sem generalizar pão como alimento.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Vocês” comunica naturalmente a segunda pessoa do plural. A formulação preserva a comparação entre as terras e a cadência retórica das duas expressões iniciadas por “terra de”.
