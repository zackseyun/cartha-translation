  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַתָּה֙ הֲ/מִ/בַּלְעֲדֵ֣י יְהוָ֔ה עָלִ֛יתִי עַל הָ/אָ֥רֶץ הַ/זֹּ֖את לְ/הַשְׁחִיתָ֑/הּ יְהוָה֙ אָמַ֣ר אֵלַ֔/י עֲלֵ֛ה אֶל הָ/אָ֥רֶץ הַ/זֹּ֖את וְ/הַשְׁחִיתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/010.yaml
  text: And now[a], was it apart from Yahweh that I came up against this land to destroy it? Yahweh said to me, ‘Go up against this land and destroy it.’
translation:
  language: pt
  text: 'E agora, será que foi sem Yahweh[a] que subi contra esta terra para destruí-la? Yahweh me disse: “Suba contra esta terra e destrua-a.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à parte de Yahweh” ou “independentemente de Yahweh”.
    reason: Registra as nuances possíveis de מִבַּלְעֲדֵי sem sobrecarregar o texto principal.
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Mantém a conexão discursiva e a transição enfática do hebraico.
- source_word: הֲמִבַּלְעֲדֵי
  choice: será que foi sem
  rationale: A partícula interrogativa introduz uma pergunta retórica; “sem” expressa de modo natural a ideia de não agir à parte ou independentemente de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: עָלִיתִי עַל הָאָרֶץ הַזֹּאת
  choice: subi contra esta terra
  rationale: Preserva o verbo direcional עלה e traduz עַל com sentido hostil no contexto militar.
- source_word: לְהַשְׁחִיתָהּ
  choice: para destruí-la
  rationale: O infinitivo Hifil de שׁחת indica o propósito de causar destruição; a forma pronominal retoma “terra”.
- source_word: אָמַר אֵלַי
  choice: me disse
  rationale: Equivalente português corrente e direto para o relato de fala.
- source_word: עֲלֵה אֶל הָאָרֶץ הַזֹּאת
  choice: Suba contra esta terra
  rationale: Mantém o imperativo de עלה; “contra” torna explícito o movimento militar hostil indicado pelo contexto.
- source_word: וְהַשְׁחִיתָהּ
  choice: e destrua-a
  rationale: Preserva a segunda ordem explícita e a repetição enfática do verbo de destruição.
theological_decisions:
- issue: Afirmação de autorização divina feita pelo porta-voz assírio
  choice: 'Preservar a declaração como alegação direta: “Yahweh me disse”'
  alternative: Qualificar no texto como alegação falsa ou duvidosa
  rationale: O hebraico registra a afirmação sem avaliá-la neste versículo; a tradução não deve endossá-la nem refutá-la por acréscimo interpretativo.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico e evita substituí-lo silenciosamente por um título.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A pergunta retórica foi formulada naturalmente, mantendo a ambiguidade quanto à veracidade da alegação assíria.
