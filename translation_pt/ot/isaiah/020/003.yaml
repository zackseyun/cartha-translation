id: ISA.20.3
reference: Isaiah 20:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה כַּ/אֲשֶׁ֥ר הָלַ֛ךְ עַבְדִּ֥/י יְשַׁעְיָ֖הוּ עָר֣וֹם וְ/יָחֵ֑ף שָׁלֹ֤שׁ שָׁנִים֙ א֣וֹת וּ/מוֹפֵ֔ת עַל מִצְרַ֖יִם וְ/עַל כּֽוּשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/020/003.yaml
  text: Then Yahweh said[b][a], “Just as my servant Isaiah has walked naked and barefoot for three years as a sign and a portent against Egypt and Cush,”
translation:
  language: pt
  text: 'Então Yahweh disse: “Assim como meu servo Isaías andou nu[a] e descalço durante três anos, como sinal e presságio contra o Egito e Cuxe[b],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “despido”, isto é, sem a roupa exterior e usando apenas uma peça íntima ou tanga, e não necessariamente completamente nu.
    reason: lexical_alternative
  - marker: b
    text: Cuxe era a região ao sul do Egito, geralmente associada à Núbia; algumas traduções a chamam de “Etiópia”.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כַּאֲשֶׁר
  choice: Assim como
  rationale: Mantém a força comparativa que introduz a explicação do ato simbólico.
- source_word: הָלַךְ
  choice: andou
  rationale: Reproduz o sentido básico de andar ou circular e soa naturalmente com a indicação de duração.
- source_word: עַבְדִּי
  choice: meu servo
  rationale: Expressa adequadamente a condição de Isaías como agente comissionado por Deus, sem enfatizar indevidamente a escravidão.
- source_word: יְשַׁעְיָהוּ
  choice: Isaías
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome do profeta.
- source_word: עָרוֹם
  choice: nu
  rationale: Conserva o sentido lexical direto, deixando em nota a possibilidade contextual de que Isaías estivesse apenas sem a roupa exterior.
- source_word: וְיָחֵף
  choice: e descalço
  rationale: Equivalente português direto e corrente para a condição de estar com os pés nus.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: durante três anos
  rationale: Indica com clareza e naturalidade a duração do ato simbólico.
- source_word: אוֹת
  choice: sinal
  rationale: Termo corrente para um ato simbólico que aponta para uma realidade futura.
- source_word: וּמוֹפֵת
  choice: e presságio
  rationale: Distingue o segundo termo de “sinal” e comunica sua função de antecipar o juízo.
- source_word: עַל
  choice: contra
  rationale: No contexto de anúncio de juízo, transmite melhor a orientação adversativa do sinal.
- source_word: מִצְרַיִם
  choice: Egito
  rationale: Nome português convencional do país.
- source_word: כּוּשׁ
  choice: Cuxe
  rationale: Transliteração tradicional em português que evita identificar sem ressalvas a região antiga com a Etiópia moderna.
theological_decisions:
- issue: Grau de nudez no ato simbólico de Isaías
  choice: Traduzir עָרוֹם por “nu” no texto principal.
  alternative: “despido” ou “sem a roupa exterior”, possivelmente usando apenas uma peça íntima ou tanga.
  rationale: O sentido lexical mais direto é “nu”, mas o uso antigo pode descrever alguém sem as vestes exteriores. A tradução mantém a expressão forte do hebraico e registra a ambiguidade histórica em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura comparativa e a continuação sintática do versículo seguinte foram preservadas; por isso, o trecho termina com vírgula dentro da fala ainda aberta.
