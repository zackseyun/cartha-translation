  text: בָּ/עֵ֣ת הַ/הִ֗יא דִּבֶּ֣ר יְהוָה֮ בְּ/יַ֣ד יְשַׁעְיָ֣הוּ בֶן אָמוֹץ֮ לֵ/אמֹר֒ לֵ֗ךְ וּ/פִתַּחְתָּ֤ הַ/שַּׂק֙ מֵ/עַ֣ל מָתְנֶ֔י/ךָ וְ/נַעַלְ/ךָ֥ תַחֲלֹ֖ץ מֵ/עַ֣ל רַגְלֶ֑י/ךָ וַ/יַּ֣עַשׂ כֵּ֔ן הָלֹ֖ךְ עָר֥וֹם וְ/יָחֵֽף־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/020/002.yaml
  text: At that time Yahweh spoke by the hand of Isaiah son of Amoz[a], saying, “Go, loosen the sackcloth from your waist, and remove your sandals from your feet.” And he did so, walking naked and barefoot.
translation:
  language: pt
  text: 'Naquele tempo, Yahweh falou por meio de Isaías, filho de Amoz: “Vá, tire o pano de saco da cintura e tire as sandálias dos seus pés.” Ele fez assim, andando nu[a] e descalço.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “despido” ou “com pouca roupa”; em alguns contextos, o termo hebraico pode indicar alguém sem a roupa exterior ou insuficientemente vestido, e não necessariamente totalmente nu.
    reason: Alternativa lexical que preserva a ambiguidade contextual de עָרוֹם.
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Naquele tempo
  rationale: Expressão temporal natural em português, preservando a força demonstrativa do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: דִּבֶּר ... בְּיַד
  choice: falou por meio de
  rationale: O hebraísmo literal 'falou pela mão de' indica mediação profética; 'por meio de' comunica esse sentido com clareza em português atual.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ
  choice: Isaías, filho de Amoz
  rationale: Emprega as formas portuguesas convencionais dos nomes e explicita naturalmente a relação filial.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Em português, os dois-pontos introduzem naturalmente o discurso direto sem exigir o hebraísmo redundante 'dizendo'.
- source_word: לֵךְ
  choice: Vá
  rationale: Equivalente idiomático do imperativo que introduz a ação ordenada.
- source_word: וּפִתַּחְתָּ הַשַּׂק מֵעַל מָתְנֶיךָ
  choice: tire o pano de saco da cintura
  rationale: No contexto, פתח descreve soltar ou desfazer a veste para removê-la; 'tire' expressa com naturalidade a ação completa exigida, enquanto 'pano de saco' preserva a natureza da vestimenta.
- source_word: וְנַעַלְךָ תַחֲלֹץ מֵעַל רַגְלֶיךָ
  choice: descalce as sandálias dos pés
  rationale: חלץ significa retirar; 'descalce' é conciso e natural, e o plural 'sandálias' traduz idiomaticamente o singular coletivo hebraico.
- source_word: וַיַּעַשׂ כֵּן
  choice: Ele fez assim
  rationale: Preserva de modo direto a fórmula narrativa de cumprimento, sem acrescentar explicitamente a ideia de obediência.
- source_word: הָלֹךְ
  choice: passou a andar
  rationale: Representa a construção adverbial com infinitivo absoluto e sugere a conduta continuada do sinal profético sem exagerar sua duração.
- source_word: עָרוֹם וְיָחֵף
  choice: nu e descalço
  rationale: Mantém os equivalentes diretos dos dois adjetivos hebraicos, deixando a possível extensão de עָרוֹם para a nota.
theological_decisions:
- issue: Grau de exposição indicado por עָרוֹם no ato simbólico de Isaías
  choice: nu
  alternative: despido, sem a roupa exterior ou com pouca roupa
  rationale: O sentido normal do adjetivo é 'nu', e suavizá-lo no texto principal resolveria indevidamente a tensão. Contudo, em certos contextos ele pode indicar nudez parcial ou vestimenta insuficiente; essa possibilidade é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe evita decalques desnecessários, mas conserva o nome divino e a força incisiva do ato profético.
