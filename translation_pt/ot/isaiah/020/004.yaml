  text: כֵּ֣ן יִנְהַ֣ג מֶֽלֶךְ אַ֠שּׁוּר אֶת שְׁבִ֨י מִצְרַ֜יִם וְ/אֶת גָּל֥וּת כּ֛וּשׁ נְעָרִ֥ים וּ/זְקֵנִ֖ים עָר֣וֹם וְ/יָחֵ֑ף וַ/חֲשׂוּפַ֥י שֵׁ֖ת עֶרְוַ֥ת מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/020/004.yaml
  text: so the king of Assyria will lead away the captives of Egypt and the exiles of Cush[a], young and old, naked and barefoot[b], with buttocks uncovered—the nakedness of Egypt.
translation:
  language: pt
  text: assim o rei da Assíria levará os cativos do Egito e os exilados de Cuxe, jovens e idosos, nus e descalços, com as nádegas descobertas — a nudez do Egito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a vergonha do Egito”. O hebraico diz literalmente “a nudez do Egito”, imagem de exposição pública e humilhação.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: assim
  rationale: Liga o sinal profético descrito anteriormente ao seu cumprimento e soa natural em português.
- source_word: יִנְהַג
  choice: levará
  rationale: No contexto da deportação, expressa condução forçada sem acrescentar ao verbo uma violência mais específica do que a explicitada.
- source_word: שְׁבִי
  choice: cativos
  rationale: O substantivo, marcado como objeto e paralelo a גָּלוּת, designa aqui as pessoas capturadas.
- source_word: גָּלוּת
  choice: exilados
  rationale: O paralelismo indica a comunidade deportada, não apenas o estado abstrato de exílio.
- source_word: כּוּשׁ
  choice: Cuxe
  rationale: Preserva o nome antigo em sua forma portuguesa, evitando identificá-lo sem ressalvas com um Estado moderno.
- source_word: נְעָרִים וּזְקֵנִים
  choice: jovens e idosos
  rationale: Reproduz de modo claro e inclusivo o merismo etário do hebraico.
- source_word: עָרוֹם וְיָחֵף
  choice: nus e descalços
  rationale: Mantém o sentido direto e a ligação verbal com o sinal profético do contexto.
- source_word: חֲשׂוּפַי שֵׁת
  choice: com as nádegas descobertas
  rationale: Conserva a imagem deliberadamente gráfica de exposição e humilhação pública.
- source_word: עֶרְוַת מִצְרָיִם
  choice: a nudez do Egito
  rationale: Preserva a metáfora concreta e sua ligação com a exposição corporal precedente, sem reduzir o sentido apenas a 'vergonha'.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação mantém o caráter gráfico do hebraico e a sequência de grupos e condições do texto-fonte. O travessão destaca a frase final como explicação culminante. O marcador [a] aparece no texto principal.
