  text: בִּ/שְׁנַ֨ת בֹּ֤א תַרְתָּן֙ אַשְׁדּ֔וֹדָ/ה בִּ/שְׁלֹ֣ח אֹת֔/וֹ סַֽרְג֖וֹן מֶ֣לֶךְ אַשּׁ֑וּר וַ/יִּלָּ֥חֶם בְּ/אַשְׁדּ֖וֹד וַֽ/יִּלְכְּדָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/020/001.yaml
  text: In the year that the Tartan came to Ashdod[a], when Sargon king of Assyria sent him, and he fought against Ashdod and captured it,
translation:
  language: pt
  text: No ano em que o tartã foi a Asdode[a], quando Sargão, rei da Assíria, o enviou, ele lutou contra Asdode e a conquistou,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tartã” provavelmente era um título de oficial assírio, talvez equivalente a “comandante-em-chefe”, e não um nome pessoal.
    reason: cultural_note
lexical_decisions:
- source_word: בִּ/שְׁנַת
  choice: No ano em que
  rationale: A preposição ב com שְׁנַת introduz uma oração temporal; esta formulação é natural em português e preserva o enquadramento cronológico.
- source_word: תַרְתָּן
  choice: o tartã
  rationale: Provavelmente é um título oficial assírio, não um nome pessoal. A transliteração conserva o termo histórico, enquanto o artigo assinala seu caráter de função.
- source_word: אַשְׁדּוֹדָ/ה
  choice: a Asdode
  rationale: O ה direcional indica movimento em direção à cidade; em português, chegar a expressa isso naturalmente.
- source_word: בִּ/שְׁלֹח אֹת/וֹ
  choice: enviado por Sargão, rei da Assíria
  rationale: O infinitivo construto com ב exprime circunstância contemporânea. A construção participial portuguesa comunica que Sargão enviou o tartã sem tornar o período pesado.
- source_word: סַרְג֖וֹן
  choice: Sargão
  rationale: Forma portuguesa tradicional e reconhecível do nome real assírio.
- source_word: מֶ֣לֶךְ אַשּׁ֑וּר
  choice: rei da Assíria
  rationale: A cadeia construta identifica Sargão por seu título régio; a aposição é idiomática em português.
- source_word: וַ/יִּלָּחֶם בְּ/אַשְׁדּוֹד
  choice: ele guerreou contra Asdode
  rationale: לחם com ב significa combater ou guerrear contra. O pronome explicita que o agente continua sendo o oficial enviado, evitando que Sargão seja tomado como sujeito imediato.
- source_word: וַֽ/יִּלְכְּדָֽ/הּ
  choice: e a conquistou
  rationale: Em contexto militar, לכד indica tomar ou capturar uma cidade; o pronome feminino retoma Asdode.
