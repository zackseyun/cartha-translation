base_translation:
  language: en
  yaml_path: translation/ot/isaiah/020/005.yaml
  text: And they will be dismayed and ashamed because of Cush[a], their hope, and because of Egypt[c][b], their boast.
translation:
  language: pt
  text: E ficarão consternados e envergonhados por causa de Cuxe[a], sua esperança[b], e por causa do Egito, sua glória[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cuxe era a antiga região ao sul do Egito, frequentemente associada à Núbia; versões mais antigas às vezes usam “Etiópia”.
    reason: cultural_note
  - marker: b
    text: Ou “sua expectativa” ou “aquilo em que confiavam”.
    reason: lexical_alternative
  - marker: c
    text: Ou “seu motivo de orgulho”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחַתּוּ
  choice: E ficarão consternados
  rationale: O verbo חתת descreve abatimento ou colapso diante do ocorrido; no encadeamento profético, o perfeito tem referência futura. “Ficarão consternados” comunica a reação emocional sem recorrer ao literal menos natural “serão despedaçados”.
- source_word: וָבֹשׁוּ
  choice: e envergonhados
  rationale: בושׁ denota vergonha, humilhação ou frustração. “Envergonhados” forma um par natural com “consternados” e conserva a formulação não explicitamente causativa do hebraico.
- source_word: מִכּוּשׁ
  choice: por causa de Cuxe
  rationale: A preposição מִן tem aqui valor causal, confirmado pelo paralelismo com a expressão seguinte. “Cuxe” preserva o nome histórico e evita a identificação potencialmente enganosa com a Etiópia moderna.
- source_word: מַבָּטָם
  choice: sua esperança
  rationale: מַבָּט significa literalmente aquilo para o qual se olha e, no contexto, o objeto de expectativa ou confiança. “Esperança” é clara e idiomática, embora “expectativa” também seja possível.
- source_word: וּמִן מִצְרַיִם
  choice: e por causa do Egito
  rationale: 'Como na primeira expressão com מִן, o sentido é causal: a queda do Egito ocasionará vergonha e consternação.'
- source_word: תִּפְאַרְתָּם
  choice: sua glória
  rationale: תִּפְאֶרֶת pode indicar glória, esplendor, orgulho ou motivo de vanglória. “Sua glória” mantém a amplitude lexical do termo e a tensão entre prestígio e orgulho; “seu motivo de orgulho” é uma alternativa contextual.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e compreensão internacional. O topônimo histórico “Cuxe” é mantido e explicado em nota. Os paralelos do hebraico são preservados, bem como a amplitude semântica de מַבָּט e תִּפְאֶרֶת.
