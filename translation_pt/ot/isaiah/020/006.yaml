base_translation:
  language: en
  yaml_path: translation/ot/isaiah/020/006.yaml
  text: And the inhabitant of this coastland will say in that day[a], ‘Look, this is our hope, where we fled for help to be delivered from the king of Assyria[b]. And how shall we escape?’
translation:
  language: pt
  text: 'E naquele dia os habitantes desta região costeira[a] dirão: “Vejam! Esta é a nossa esperança[b], para onde fugimos em busca de ajuda, a fim de sermos livrados do rei da Assíria. Como, então, escaparemos?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Região costeira” também pode ser traduzido como “ilha”. Em Isaías, o termo hebraico muitas vezes se refere, de modo mais amplo, a terras marítimas ou regiões litorâneas.
    reason: lexical_alternative
  - marker: b
    text: “Nossa esperança” também pode significar “nossa expectativa” ou “aquilo para que olhávamos”, isto é, o objeto no qual depositavam a esperança.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשֵׁב הָאִי הַזֶּה
  choice: os habitantes desta região costeira
  rationale: O particípio singular יֹשֵׁב tem sentido coletivo, referente à população. Em Isaías, אִי pode designar ilha, litoral ou território marítimo; “região costeira” comunica essa amplitude com naturalidade em português.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Preserva a fórmula temporal profética de maneira corrente e digna.
- source_word: הִנֵּה
  choice: Vejam!
  rationale: Mantém a função enfática de chamar a atenção, sem recorrer ao arcaizante “eis”.
- source_word: כֹּה מַבָּטֵנוּ
  choice: Esta é a nossa esperança
  rationale: מַבָּט denota aquilo para o qual se olha, figuradamente o objeto de expectativa ou confiança. A formulação preserva a concisão e a ambiguidade da expressão hebraica sem acrescentar “o que aconteceu com”.
- source_word: אֲשֶׁר נַסְנוּ שָׁם
  choice: para onde fugimos
  rationale: נוּס indica fugir, e שָׁם aponta para o destino buscado como refúgio. “Para onde” expressa em português o movimento em direção ao lugar.
- source_word: לְעֶזְרָה
  choice: em busca de ajuda
  rationale: Expressa de modo natural a finalidade indicada pela preposição לְ e pelo substantivo עֶזְרָה.
- source_word: לְהִנָּצֵל
  choice: a fim de sermos livrados
  rationale: Preserva o valor passivo do nifal de נצל e evita antecipar o verbo “escapar” da pergunta final.
- source_word: מִפְּנֵי מֶלֶךְ אַשּׁוּר
  choice: do rei da Assíria
  rationale: מִפְּנֵי tem aqui o sentido idiomático de livramento da ameaça representada pelo rei assírio.
- source_word: וְאֵיךְ נִמָּלֵט אֲנָחְנוּ
  choice: Como, então, escaparemos?
  rationale: A pergunta retórica exprime desespero. “Escaparemos” mantém a orientação futura; “então” torna natural em português a ligação conclusiva sugerida pelo contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. O coletivo singular hebraico foi vertido pelo plural natural em português. A fala direta conserva a força retórica e a desilusão do contexto.
