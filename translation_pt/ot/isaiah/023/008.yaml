base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/008.yaml
  text: Who has planned this against Tyre[a], the bestower of crowns, whose merchants are princes[b], whose traders are the honored ones of the earth?
translation:
  language: pt
  text: Quem planejou isso contra Tiro, aquela que concede coroas[a], cujos mercadores são príncipes e cujos negociantes[b] são os honrados da terra?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “a que coroa”. O hebraico retrata Tiro como quem confere coroas, isto é, posição régia ou riqueza.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “seus cananeus”. Neste contexto, o termo provavelmente significa “negociantes” ou “mercadores”.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי
  choice: Quem
  rationale: Pronome interrogativo que introduz a pergunta retórica.
- source_word: יָעַץ זֹאת
  choice: planejou isso
  rationale: Expressa a ideia de conceber ou determinar um plano; a formulação é natural e mantém a intencionalidade do hebraico.
- source_word: עַל צֹר
  choice: contra Tiro
  rationale: No contexto de juízo, a preposição tem sentido adversativo; Tiro é a forma portuguesa consagrada do topônimo.
- source_word: הַמַּעֲטִירָה
  choice: aquela que concede coroas
  rationale: O particípio feminino de עטר descreve Tiro como quem confere coroas; a tradução preserva a metáfora e evita sugerir apenas que a própria cidade foi coroada.
- source_word: סֹחֲרֶיהָ שָׂרִים
  choice: cujos mercadores são príncipes
  rationale: Mantém o paralelismo poético e a elevada posição social indicada por שָׂרִים.
- source_word: כִּנְעָנֶיהָ
  choice: negociantes
  rationale: Embora a forma signifique literalmente “cananeus”, aqui o contexto comercial e o paralelismo favorecem o sentido metonímico de negociantes; a leitura literal é preservada em nota.
- source_word: נִכְבַּדֵּי אָרֶץ
  choice: os honrados da terra
  rationale: Conserva a noção de pessoas estimadas e influentes, bem como o alcance amplo de אֶרֶץ neste retrato da importância internacional de Tiro.
