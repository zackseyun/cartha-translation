base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/013.yaml
  text: Look at the land of the Chaldeans—this is the people that was not[a]; Assyria appointed it for desert creatures. They set up their siege towers, they stripped her palaces bare[d][c][b], they made her a ruin.
translation:
  language: pt
  text: 'Vejam a terra dos caldeus: este é o povo que não existia[a]. A Assíria a fundou para as criaturas do deserto[b]. Eles ergueram suas torres de cerco[c], deixaram expostos os palácios dela[d] e fizeram dela uma ruína[e].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “este povo não existia”, “este povo não era” ou “este povo não tinha importância”. A oração hebraica é concisa e de interpretação difícil.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “Assur a fundou para os habitantes do deserto”. A expressão pode se referir tanto a criaturas selvagens quanto a pessoas que vivem no deserto.'
    reason: lexical_alternative
  - marker: c
    text: O termo hebraico por trás de “torres de cerco” é incerto; também pode ser traduzido por “torres de vigia” ou “fortificações”.
    reason: textual_variant
  - marker: d
    text: 'Ou: “desnudaram os palácios dela”.'
    reason: lexical_alternative
  - marker: e
    text: 'Ou: “ele fez dela uma ruína”. A forma hebraica pode indicar um sujeito singular, possivelmente a Assíria, em vez de dar continuidade ao sujeito plural das orações anteriores.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: הֵן
  choice: Vejam
  rationale: Interjeição deítica que chama a atenção. “Vejam” é corrente e preserva a força do imperativo implícito.
- source_word: אֶרֶץ כַּשְׂדִּים
  choice: a terra dos caldeus
  rationale: Mantém tanto o sentido geográfico quanto a associação étnica da construção hebraica.
- source_word: זֶה הָעָם לֹא הָיָה
  choice: este é o povo que não existia
  rationale: Reproduz a formulação abrupta da oração hebraica sem adotar como certa a interpretação de que o povo não tinha importância; a dificuldade é explicitada em nota.
- source_word: אַשּׁוּר
  choice: a Assíria
  rationale: É a designação geopolítica convencional e mais provável no contexto, embora a forma também possa ser entendida como Assur.
- source_word: יְסָדָהּ
  choice: a estabeleceu
  rationale: O verbo יסד expressa fundar ou estabelecer. “Estabeleceu” funciona com o referente feminino “terra” e evita sugerir necessariamente a fundação inicial de uma nação.
- source_word: לְצִיִּים
  choice: para as criaturas do deserto
  rationale: Preserva a referência provável a seres ou animais de regiões áridas, sem ocultar a possibilidade de habitantes humanos do deserto, registrada em nota.
- source_word: הֵקִימוּ בחיניו
  choice: ergueram suas torres de cerco
  rationale: A expressão textual é incerta; no encadeamento militar, “torres de cerco” oferece sentido contextual plausível, com alternativas documentadas em nota.
- source_word: עֹרְרוּ אַרְמְנוֹתֶיהָ
  choice: deixaram expostos os palácios dela
  rationale: No contexto de destruição, o verbo provavelmente indica desnudar ou deixar a descoberto. A construção com “dela” mantém clara a referência à terra ou cidade personificada.
- source_word: שָׂמָהּ לְמַפֵּלָה
  choice: fizeram dela uma ruína
  rationale: Expressa de modo natural o resultado de queda e devastação indicado por מַפֵּלָה. O plural dá continuidade aos verbos anteriores, mas a possível leitura singular é indicada em nota.
