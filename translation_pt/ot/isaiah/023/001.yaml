  source_fidelity: A tradução preserva corretamente a estrutura geral, os nomes e o imperativo plural. Contudo, “não há casa nem porto” transforma a construção hebraica privativa em uma afirmação existencial e fixa “entrada” como “porto” no texto principal. Uma formulação com “sem” e “entrada” preserva melhor a concisão e a abertura semântica do hebraico.
  naturalness: O português do rascunho é claro e de registro apropriado. “Sem casa nem entrada” é deliberadamente elíptico, como o original, mas permanece compreensível no contexto poético-profético; a nota pode esclarecer a possível referência marítima.
  terminology: “Oráculo”, “Tiro”, “Társis” e “Quitim” são escolhas adequadas e consistentes. “Devastada” comunica bem o passivo de שֻׁדַּד.
