base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/001.yaml
  text: 'An oracle concerning Tyre: Wail[a], ships of Tarshish, for it is destroyed, without house or harbor[b]. From the land of Kittim it is revealed to them.'
translation:
  language: pt
  text: 'Oráculo a respeito de Tiro: Lamentem, navios de Társis, pois ela foi devastada, sem casa nem entrada.[a] Da terra de Quitim, isso lhes foi revelado.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sem casa nem porto”. No contexto marítimo, “entrada” pode referir-se ao acesso ou ao porto.'
    reason: lexical_alternative
  - marker: b
    text: Quitim provavelmente se refere a Chipre ou às regiões costeiras ocidentais próximas.
    reason: cultural_note
lexical_decisions:
- source_word: מַשָּׂא
  choice: Oráculo
  rationale: Em títulos proféticos, o termo introduz uma mensagem solene, frequentemente de juízo. “Oráculo” expressa essa função de modo conciso e digno.
- source_word: צֹר
  choice: Tiro
  rationale: Forma portuguesa consagrada do nome geográfico.
- source_word: הֵילִילוּ
  choice: Lamentem
  rationale: O imperativo plural pede uma manifestação audível de luto. “Lamentem” é natural em português atual e mantém o tom profético sem a possível estranheza de “uivem”.
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: navios de Társis
  rationale: Preserva a construção hebraica e sua possível referência a navios ligados a Társis por origem, destino ou tipo, sem especificar além do texto.
- source_word: שֻׁדַּד
  choice: ela foi devastada
  rationale: O passivo comunica destruição decorrente de saque ou devastação. O pronome retoma naturalmente Tiro em português.
- source_word: מִבַּיִת מִבּוֹא
  choice: não há casa nem porto
  rationale: Entende as duas ocorrências de מִן em sentido privativo. No contexto marítimo, בּוֹא provavelmente indica entrada, acesso ou porto; a nota preserva a alternativa mais literal.
- source_word: מֵאֶרֶץ כִּתִּים
  choice: Da terra de Quitim
  rationale: Mantém o termo etnogeográfico hebraico sem reduzi-lo exclusivamente a Chipre.
- source_word: נִגְלָה לָמוֹ
  choice: isso lhes foi revelado
  rationale: Reproduz a construção passiva e mantém relativamente aberta a identidade precisa dos destinatários, provavelmente os navegantes ou mercadores.
