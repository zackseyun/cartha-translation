id: ISA.23.16
reference: Isaiah 23:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: קְחִ֥י כִנּ֛וֹר סֹ֥בִּי עִ֖יר זוֹנָ֣ה נִשְׁכָּחָ֑ה הֵיטִ֤יבִי נַגֵּן֙ הַרְבִּי שִׁ֔יר לְמַ֖עַן תִּזָּכֵֽרִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/016.yaml
  text: Take a lyre[a], go about the city, forgotten prostitute; play skillfully, sing many songs, so that you may be remembered.
translation:
  language: pt
  text: Pegue uma lira[a], percorra a cidade, prostituta esquecida; toque com habilidade, cante muitas canções, para que você seja lembrada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “harpa”. O hebraico menciona um antigo instrumento de cordas (kinnor).
    reason: lexical_alternative
lexical_decisions:
- source_word: קְחִי
  choice: Pegue
  rationale: Imperativo qal feminino singular de לקח. “Pegue” é uma ordem direta, natural em português, para tomar o instrumento.
- source_word: כִנּוֹר
  choice: uma lira
  rationale: כִּנּוֹר designa um antigo instrumento de cordas; “lira” é mais preciso historicamente que o tradicional “harpa”, mantido como alternativa em nota.
- source_word: סֹבִּי עִיר
  choice: percorra a cidade
  rationale: O imperativo de סבב indica mover-se pela cidade ou ao redor dela. “Percorra a cidade” soa natural sem definir de modo excessivo a trajetória.
- source_word: זוֹנָה נִשְׁכָּחָה
  choice: prostituta esquecida
  rationale: Mantém a metáfora explícita pela qual Tiro é personificada, usando vocabulário moderno e digno, sem o arcaísmo de “meretriz”.
- source_word: הֵיטִיבִי נַגֵּן
  choice: toque com habilidade
  rationale: הֵיטִיבִי modifica a ação de tocar e pede boa execução musical. “Com habilidade” preserva a intensidade melhor que apenas “bem”.
- source_word: הַרְבִּי שִׁיר
  choice: cante muitas canções
  rationale: A construção significa multiplicar o canto. O plural idiomático comunica em português o valor coletivo do singular hebraico שִׁיר.
- source_word: לְמַעַן תִּזָּכֵרִי
  choice: para que você seja lembrada
  rationale: Preserva tanto a finalidade expressa por לְמַעַן quanto a voz passiva do nifal תִּזָּכֵרִי.
theological_decisions:
- issue: Designação metafórica de Tiro como prostituta
  choice: Manter “prostituta esquecida” explicitamente no texto
  alternative: “meretriz esquecida”
  rationale: O versículo personifica Tiro como uma prostituta que procura voltar a ser notada. A tradução conserva a força profética da metáfora sem suavizá-la nem acrescentar interpretação doutrinária.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A formulação mantém tom profético digno, ordens no feminino singular e a metáfora incisiva do hebraico, evitando tanto arcaísmos quanto linguagem excessivamente coloquial.
