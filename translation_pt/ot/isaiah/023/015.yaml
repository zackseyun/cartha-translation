  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא וְ/נִשְׁכַּ֤חַת צֹר֙ שִׁבְעִ֣ים שָׁנָ֔ה כִּ/ימֵ֖י מֶ֣לֶךְ אֶחָ֑ד מִ/קֵּ֞ץ שִׁבְעִ֤ים שָׁנָה֙ יִהְיֶ֣ה לְ/צֹ֔ר כְּ/שִׁירַ֖ת הַ/זּוֹנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/015.yaml
  text: 'And in that day Tyre will be forgotten for seventy years[a], like the days of one king. At the end of seventy years[b], it will happen to Tyre as in the song of the prostitute:'
translation:
  language: pt
  text: Naquele dia, Tiro será esquecida por setenta anos, como os dias de um só rei.[a] Ao fim de setenta anos, acontecerá com Tiro como na canção da prostituta:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pelo tempo de vida de um rei”. O hebraico diz literalmente “como os dias de um só rei”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “será para Tiro como a canção da prostituta”.'
    reason: source_form
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: A fórmula profética temporal é expressa de modo natural e solene em português; o valor futuro é comunicado pelos verbos seguintes.
- source_word: וְנִשְׁכַּחַת צֹר
  choice: Tiro será esquecida
  rationale: O nifal de שׁכח tem sentido passivo; a formulação conserva a imagem de a cidade desaparecer da memória e da proeminência.
- source_word: שִׁבְעִים שָׁנָה
  choice: por setenta anos
  rationale: A preposição explicita naturalmente em português a duração indicada pelo hebraico.
- source_word: כִּימֵי מֶלֶךְ אֶחָד
  choice: como os dias de um só rei
  rationale: Preserva a comparação e o plural 'dias' do hebraico sem decidir se a expressão indica reinado ou tempo de vida.
- source_word: מִקֵּץ
  choice: Ao fim de
  rationale: Equivalente temporal claro para o encerramento do período mencionado.
- source_word: יִהְיֶה לְצֹר
  choice: acontecerá com Tiro
  rationale: Transmite de modo idiomático a construção היה ל, que aqui introduz o que sucederá à cidade.
- source_word: כְּשִׁירַת הַזּוֹנָה
  choice: como na canção da prostituta
  rationale: Conserva a comparação e prepara naturalmente a citação poética do versículo seguinte.
theological_decisions:
- issue: Retrato metafórico de Tiro como prostituta
  choice: prostituta
  alternative: meretriz
  rationale: Mantém sem suavização a metáfora comercial e sexual do texto profético, usando um termo moderno, preciso e digno.
- issue: Sentido de 'os dias de um só rei'
  choice: Preservar a expressão comparativa do hebraico
  alternative: pelo tempo de vida de um rei
  rationale: O texto não especifica inequivocamente se se refere à vida ou ao reinado do rei; a tradução principal conserva essa tensão e a nota apresenta a interpretação temporal comum.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. Emprega “Tiro”, forma tradicional do topônimo, e mantém a metáfora direta “prostituta”. A sintaxe foi levemente naturalizada, enquanto as ambiguidades relevantes são preservadas no texto ou registradas em nota.
