  text: בּ֣וֹשִׁי צִיד֔וֹן כִּֽי אָמַ֣ר יָ֔ם מָע֥וֹז הַ/יָּ֖ם לֵ/אמֹ֑ר לֹֽא חַ֣לְתִּי וְ/לֹֽא יָלַ֗דְתִּי וְ/לֹ֥א גִדַּ֛לְתִּי בַּחוּרִ֖ים רוֹמַ֥מְתִּי בְתוּלֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/004.yaml
  text: Be ashamed[a], Sidon, for the sea has spoken, the stronghold of the sea, saying, “I have not been in labor, and I have not given birth[c][b], and I have not raised young men or exalted virgins.”
translation:
  language: pt
  text: 'Envergonhe-se, Sidom, pois o mar falou, a fortaleza do mar[a], dizendo: “Não estive em trabalho de parto[b], nem dei à luz; não criei rapazes, nem fiz crescer virgens[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o baluarte do mar” ou “a fortaleza marítima”. A expressão pode personificar o mar em sua força ou aludir a Tiro como fortaleza no mar.
    reason: lexical_alternative
  - marker: b
    text: Ou “não sofri dores de parto”.
    reason: lexical_alternative
  - marker: c
    text: Ou “moças”. O termo hebraico geralmente designa especificamente virgens.
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹשִׁי
  choice: Envergonhe-se
  rationale: Preserva o imperativo feminino singular dirigido à cidade personificada de Sidom e o motivo profético da vergonha.
- source_word: צִידוֹן
  choice: Sidom
  rationale: Forma tradicional e amplamente reconhecida do nome da cidade em português bíblico.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente, em português, a razão da ordem anterior.
- source_word: יָם
  choice: o mar
  rationale: Mantém a imagem literal e a personificação do mar como aquele que fala.
- source_word: מָעוֹז הַיָּם
  choice: a fortaleza do mar
  rationale: מָעוֹז designa fortaleza ou lugar fortificado; a formulação conserva a relação ambígua com o mar sem identificar explicitamente a expressão com Tiro.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Introduz de modo direto a fala citada.
- source_word: לֹא חַלְתִּי
  choice: Não estive em trabalho de parto
  rationale: Expressa em linguagem atual o sentido de sofrer as dores ou contrações do parto e mantém a sequência figurativa.
- source_word: וְלֹא יָלַדְתִּי
  choice: nem dei à luz
  rationale: Tradução natural e direta do verbo de dar à luz.
- source_word: וְלֹא גִדַּלְתִּי
  choice: não criei
  rationale: No contexto de descendentes, comunica o ato de criar alguém até a maturidade.
- source_word: בַּחוּרִים
  choice: rapazes
  rationale: Designa jovens do sexo masculino, sem transformá-los interpretativamente em filhos.
- source_word: רוֹמַמְתִּי
  choice: eduquei
  rationale: No paralelismo familiar, traduz o sentido contextual de fazer crescer ou criar, evitando o português pouco natural de 'exaltar virgens'.
- source_word: בְתוּלוֹת
  choice: virgens
  rationale: Preserva o termo hebraico específico, normalmente referente a moças virgens, e o contraste com os rapazes.
theological_decisions:
- issue: Identidade de quem fala como “o mar, a fortaleza do mar”
  choice: Manter a formulação imagética e ambígua do hebraico
  alternative: Explicitar Tiro como a fortaleza marítima que fala
  rationale: O texto permite uma personificação do mar em sua força e possivelmente alude a Tiro, mas a tradução não deve resolver uma identificação que o hebraico deixa implícita.
- issue: Sentido de רוֹמַמְתִּי no paralelismo
  choice: eduquei
  alternative: exaltei
  rationale: Embora a raiz possa significar elevar ou exaltar, o objeto humano e o paralelismo com criar jovens favorecem aqui o sentido contextual de criar ou educar, sem eliminar a possibilidade lexical registrada em nota.
translation_notes:
  register: Português moderno, digno e de leitura natural, com formas reconhecíveis no uso bíblico. A pontuação evidencia a aposição “a fortaleza do mar”, e as notas preservam as principais ambiguidades lexicais e referenciais.
