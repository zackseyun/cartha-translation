  text: Is this your exultant city[a], whose origin is from days of old, whose feet carried her far away to sojourn?
translation:
  language: pt
  text: É esta a cidade jubilante de vocês, cuja origem remonta a tempos antigos e cujos pés a levaram para longe, para viver como estrangeira?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «cuja antiguidade vem de tempos antigos; seus pés a levaram para uma região distante, para residir como estrangeira».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲזֹאת
  choice: É esta
  rationale: A partícula interrogativa seguida do demonstrativo feminino introduz uma pergunta retórica a respeito de Tiro.
- source_word: לָכֶם
  choice: de vocês
  rationale: 'Embora a forma seja literalmente «para vocês», o valor possessivo é natural neste contexto: «a cidade ... de vocês».'
- source_word: עַלִּיזָה
  choice: cidade jubilante
  rationale: O adjetivo feminino descreve quem se alegra de modo exuberante; «cidade» explicita o referente feminino, Tiro, já estabelecido pelo contexto.
- source_word: מִימֵי קֶדֶם קַדְמָתָהּ
  choice: cuja origem remonta aos dias antigos
  rationale: A expressão ressalta a grande antiguidade de Tiro. «Origem remonta» comunica em português corrente que seus primórdios pertencem a um passado remoto.
- source_word: יֹבִלוּהָ רַגְלֶיהָ
  choice: cujos pés a levaram
  rationale: Mantém a personificação da cidade e traduz o hifil de יבל de maneira idiomática, com «seus pés» como sujeito.
- source_word: מֵרָחוֹק
  choice: para longe
  rationale: No contexto de movimento, expressa a distância percorrida sem impor um destino específico; a preposição hebraica também pode ser entendida como «de longe».
- source_word: לָגוּר
  choice: para viver como estrangeira
  rationale: גור indica residir fora do lugar de origem, muitas vezes na condição de estrangeiro ou residente temporário; a formulação evita o arcaísmo «peregrinar».
theological_decisions: []
