id: ISA.23.11
reference: Isaiah 23:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יָד/וֹ֙ נָטָ֣ה עַל הַ/יָּ֔ם הִרְגִּ֖יז מַמְלָכ֑וֹת יְהוָה֙ צִוָּ֣ה אֶל כְּנַ֔עַן לַ/שְׁמִ֖ד מָעֻזְנֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/011.yaml
  text: He has stretched out his hand over the sea[a]; he has made kingdoms tremble. Yahweh has commanded concerning Canaan[c][b], to destroy her strongholds.
translation:
  language: pt
  text: Ele estendeu a mão sobre o mar[a] e fez reinos tremerem. Yahweh deu ordem a respeito de Canaã[b], para destruir as fortalezas dela[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contra o mar”. A preposição hebraica pode ter aqui o sentido de domínio sobre o mar ou de ação dirigida contra ele.
    reason: alternative_reading
  - marker: b
    text: “Canaã” provavelmente se refere aqui à região fenícia associada a Tiro.
    reason: cultural_note
  - marker: c
    text: Ou “suas fortalezas”. O hebraico usa um sufixo feminino singular, de acordo com a personificação da terra ou da cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדוֹ
  choice: a mão
  rationale: Mantém a imagem antropomórfica concreta da atuação poderosa de Deus, sem reduzi-la à ideia abstrata de “poder”.
- source_word: נָטָה
  choice: estendeu
  rationale: Expressa de modo natural o gesto deliberado de estender a mão.
- source_word: עַל הַיָּם
  choice: sobre o mar
  rationale: “Sobre” preserva a imagem do alcance soberano de Deus; a possível nuance hostil de עַל é registrada em nota.
- source_word: הִרְגִּיז
  choice: fez reinos tremerem
  rationale: O hifil de רגז indica causar agitação ou tremor; esta formulação comunica claramente seu efeito sobre os reinos.
- source_word: מַמְלָכוֹת
  choice: reinos
  rationale: Equivalente direto e corrente para as entidades políticas mencionadas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: צִוָּה
  choice: deu ordem
  rationale: Representa diretamente o ato de emitir uma ordem e soa natural em português.
- source_word: אֶל כְּנַעַן
  choice: a respeito de Canaã
  rationale: A preposição após צוה é incomum; “a respeito de” preserva a referência ao alvo da ordem sem decidir de forma excessiva entre “a” e “contra”.
- source_word: כְּנַעַן
  choice: Canaã
  rationale: Mantém o nome geográfico do hebraico; sua referência contextual à região fenícia é explicada em nota.
- source_word: לַשְׁמִיד
  choice: para destruir
  rationale: Expressa a finalidade da ordem e a força do verbo שׁמד sem acrescentar uma ideia mais absoluta do que o texto exige.
- source_word: מָעֻזְנֶיהָ
  choice: as fortalezas dela
  rationale: “Fortalezas” corresponde aos lugares fortificados ou redutos, enquanto “dela” torna perceptível o sufixo feminino singular do hebraico.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto emprega o nome divino; a transliteração preserva-o como nome próprio sem substituí-lo por um título.
- issue: Identificação de כנען
  choice: Canaã no texto principal
  alternative: Fenícia
  rationale: Mantém-se o nome efetivamente presente no hebraico, enquanto a provável referência contextual à região fenícia ligada a Tiro fica em nota.
- issue: Relação da ordem com Canaã em אֶל כְּנַעַן
  choice: a respeito de Canaã
  alternative: contra Canaã
  rationale: A construção admite discussão quanto ao alvo ou conteúdo da ordem; a tradução principal evita resolver indevidamente a ambiguidade, e a leitura hostil é indicada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os pretéritos simples dão fluidez à sequência profética. A ordem direta e o paralelismo foram preservados, e as ambiguidades relevantes do hebraico foram mantidas no texto ou explicitadas nas notas.
