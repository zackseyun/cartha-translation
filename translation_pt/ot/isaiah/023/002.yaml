  text: Be silent[a], inhabitants of the coastland; the merchant of Sidon, crossing the sea[b], has filled you.
translation:
  language: pt
  text: Fiquem em silêncio, habitantes da região costeira[a]; os mercadores de Sidom, que atravessam o mar, encheram você[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ilha”. A palavra hebraica אִי pode indicar uma ilha ou uma região costeira.
    reason: lexical_alternative
  - marker: b
    text: 'A construção hebraica também pode ser entendida em sentido comercial: “os mercadores de Sidom, que atravessam o mar, abasteceram você” ou “eram a sua fonte de renda”.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: דֹּמּוּ
  choice: Fiquem em silêncio
  rationale: O imperativo plural de דמם pede silêncio ou imobilidade diante do juízo. “Fiquem em silêncio” conserva a força imperativa sem explicitar luto, embora o contexto sugira choque e lamentação.
- source_word: יֹשְׁבֵי אִי
  choice: habitantes da região costeira
  rationale: יֹשְׁבֵי é um particípio em construção com sentido substantivo coletivo. אִי pode designar ilha ou região litorânea; no contexto marítimo fenício, “região costeira” é natural, mantendo-se “ilha” em nota como alternativa real.
- source_word: סֹחֵר צִידוֹן
  choice: o mercador de Sidom
  rationale: סֹחֵר está no singular e pode funcionar coletiva ou representativamente. O singular foi preservado para não apagar a forma hebraica, embora a referência possa abranger a classe mercantil de Sidom.
- source_word: עֹבֵר יָם
  choice: atravessando o mar
  rationale: O particípio singular seguido de יָם preserva a imagem de atividade marítima contínua e se liga naturalmente a “mercador”.
- source_word: מִלְאוּךְ
  choice: encheu você
  rationale: A expressão é vertida segundo o sentido verbal de מלא, “encher”, com o sufixo feminino singular referindo-se à região costeira interpelada. A construção hebraica admite dificuldades de número e uma leitura econômica, registradas em nota.
