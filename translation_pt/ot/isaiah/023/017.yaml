  naturalness: O português é moderno, claro e de registro adequado. “Voltará ao seu pagamento de prostituta” é uma formulação incomum, mas compreensível e próxima da imagem hebraica. “Sobre a face do solo” conserva deliberadamente a distinção lexical e funciona em registro bíblico-poético.
  terminology: “Yahweh”, “Tiro”, “pagamento de prostituta” e “se prostituirá” são escolhas apropriadas. A nota b deve limitar-se à função metafórica do pagamento, sem afirmar como sentido textual que ele “representa os lucros de seu comércio”, pois isso é uma explicação interpretativa além do que o versículo diz.
