revisions:
- from: Ao fim de setenta anos, Yahweh intervirá em favor de Tiro[a]. Então ela voltará ao seu pagamento de prostituta[b] e se prostituirá com todos os reinos da terra, sobre a face do solo[c].
  to: Ao fim de setenta anos, Yahweh visitará Tiro[a]. Então ela voltará ao seu pagamento de prostituta[b] e se prostituirá com todos os reinos da terra, sobre a face do solo[c].
  rationale: A revisão substitui a formulação que favorecia explicitamente uma leitura benéfica de יִפְקֹד por “visitará”, termo tradicionalmente inteligível no registro bíblico e semanticamente aberto. Também torna a nota sobre o pagamento mais descritiva e menos interpretativa. Mantêm-se a personificação, a metáfora sexual-comercial, a distinção entre “terra” e “solo” e os marcadores de nota junto aos seus referentes.
