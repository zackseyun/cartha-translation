  text: וְ/הָיָ֞ה מִ/קֵּ֣ץ שִׁבְעִ֣ים שָׁנָ֗ה יִפְקֹ֤ד יְהוָה֙ אֶת צֹ֔ר וְ/שָׁבָ֖ה לְ/אֶתְנַנָּ֑/ה וְ/זָֽנְתָ֛ה אֶת כָּל מַמְלְכ֥וֹת הָ/אָ֖רֶץ עַל פְּנֵ֥י הָ/אֲדָמָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/017.yaml
  text: And it will happen at the end of seventy years that Yahweh will attend to Tyre[c][b][a], and she will return to her wages and prostitute herself with all the kingdoms of the earth on the face of the earth.
translation:
  language: pt
  text: Ao fim de setenta anos, Yahweh visitará Tiro[a]. Então ela voltará ao seu pagamento de prostituta[b] e se prostituirá com todos os reinos da terra, sobre a face do solo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Yahweh voltará sua atenção para Tiro” ou “Yahweh intervirá a respeito de Tiro”. O verbo hebraico pode indicar uma intervenção punitiva ou restauradora, conforme o contexto.'
    reason: lexical_alternative
  - marker: b
    text: O “pagamento de prostituta” é a remuneração de uma prostituta e dá continuidade à figura de Tiro como prostituta entre as nações.
    reason: cultural_note
  - marker: c
    text: 'Ou: “sobre a face da terra”. O hebraico emprega aqui um termo diferente daquele traduzido como “terra” pouco antes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה מִקֵּץ שִׁבְעִים שָׁנָה
  choice: Ao fim de setenta anos
  rationale: Expressa de modo natural a conclusão do período determinado; o valor futuro da fórmula é comunicado pelo verbo seguinte.
- source_word: יִפְקֹד
  choice: intervirá em favor de
  rationale: פקד indica que Yahweh voltará sua atenção para Tiro e agirá a seu respeito. O contexto imediato, no qual a cidade retoma sua atividade, favorece uma intervenção benéfica, sem especificar plenamente sua natureza.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: צֹר
  choice: Tiro
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: וְשָׁבָה לְאֶתְנַנָּה
  choice: Então ela voltará ao seu pagamento de prostituta
  rationale: O feminino preserva a personificação da cidade. אֶתְנַן designa especificamente o pagamento recebido por uma prostituta, sentido que convém explicitar no texto.
- source_word: וְזָנְתָה
  choice: e se prostituirá
  rationale: Mantém de forma direta e atual a metáfora comercial e sexual aplicada a Tiro.
- source_word: אֶת כָּל מַמְלְכוֹת הָאָרֶץ
  choice: com todos os reinos da terra
  rationale: Comunica o alcance amplo das relações mercantis figuradas como prostituição.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: sobre a face do solo
  rationale: Preserva a expressão hebraica e distingue אֲדָמָה, 'solo', de אֶרֶץ, 'terra', usado imediatamente antes.
theological_decisions:
- issue: Sentido da intervenção divina em יִפְקֹד
  choice: Yahweh intervirá em favor de Tiro
  alternative: Yahweh visitará Tiro / cuidará de Tiro / intervirá contra Tiro
  rationale: O verbo tem sentido amplo e pode indicar visitação, atenção ou intervenção punitiva ou benéfica. A retomada posterior da atividade de Tiro aponta aqui para uma intervenção favorável, embora a nota preserve a amplitude lexical.
- issue: Personificação e prostituição de Tiro
  choice: Manter Tiro como mulher que volta ao pagamento de prostituta e se prostitui
  alternative: Explicitar diretamente que Tiro retomará seu comércio internacional
  rationale: A metáfora profética é teologicamente e poeticamente significativa e não deve ser reduzida a uma paráfrase econômica.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A formulação conserva a personificação feminina de Tiro e a força explícita da metáfora profética. Os marcadores aparecem junto aos termos a que se referem.
