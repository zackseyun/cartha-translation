base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/014.yaml
  text: Wail[a], ships of Tarshish[b], for your stronghold has been destroyed.
translation:
  language: pt
  text: Lamentem[a], navios de Társis, pois a fortaleza de vocês[b] foi destruída.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Soltem gritos de dor”. O verbo hebraico indica um clamor intenso de pesar ou aflição.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o refúgio de vocês” ou “o baluarte de vocês”. É provável que o hebraico se refira a Tiro como lugar de segurança dos navios.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵילִילוּ
  choice: Lamentem
  rationale: O imperativo plural de ילל expressa um grito intenso de dor ou aflição. “Lamentem” é natural, digno e compreensível em português; a nota preserva a intensidade sonora do verbo.
- source_word: אֳנִיּוֹת
  choice: navios
  rationale: O substantivo plural significa simplesmente “navios”. O contexto comercial não exige acrescentar “mercantes”.
- source_word: תַּרְשִׁישׁ
  choice: Társis
  rationale: Mantém a forma tradicional portuguesa do nome próprio e a construção hebraica “navios de Társis”.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da lamentação e conserva o tom profético sem deixar de ser claro em português atual.
- source_word: שֻׁדַּד
  choice: foi destruída
  rationale: O perfeito passivo de שדד comunica devastação violenta. “Foi destruída” transmite com clareza o resultado da ruína.
- source_word: מָעֻזְּכֶן
  choice: a fortaleza de vocês
  rationale: מָעוֹז pode designar fortaleza, baluarte ou refúgio. A expressão explicita o sufixo de segunda pessoa feminina plural, dirigido aos navios, sem restringir o referente a um porto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação preserva o apelo direto aos navios e explicita no possessivo o plural presente no hebraico.
