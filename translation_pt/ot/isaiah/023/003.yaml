- from: Pelas muitas águas, o cereal de Sior[a], a colheita do Nilo, era a sua renda; e ela se tornou o centro comercial das nações[b].
  to: Sobre muitas águas, o cereal de Sior[a], a colheita do Nilo, era a sua renda; e ela se tornou o comércio das nações[b].
  rationale: A revisão elimina a interpretação adicional em “centro comercial” e usa “comércio”, que representa diretamente o alcance semântico de סְחַר sem decidir entre comércio e mercadoria. “Sobre muitas águas” preserva com maior proximidade a imagem marítima do hebraico. As notas mantêm a alternativa toponímica e a alternativa lexical relevante.
