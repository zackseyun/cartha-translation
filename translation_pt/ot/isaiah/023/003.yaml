  text: וּ/בְ/מַ֤יִם רַבִּים֙ זֶ֣רַע שִׁחֹ֔ר קְצִ֥יר יְא֖וֹר תְּבֽוּאָתָ֑/הּ וַ/תְּהִ֖י סְחַ֥ר גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/003.yaml
  text: On many waters was the grain of Shihor[a], the harvest of the Nile, her revenue[b]; and she became the merchant of nations.
translation:
  language: pt
  text: Sobre muitas águas, o cereal de Sior[a], a colheita do Nilo, era a sua renda; e ela se tornou o comércio das nações[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sior provavelmente se refere ao Nilo ou a um de seus braços; outra tradução possível é “o cereal do Nilo”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a mercadoria das nações”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְמַיִם רַבִּים
  choice: Pelas muitas águas
  rationale: A preposição בְּ, no contexto marítimo e comercial, permite o sentido de percurso ou meio. “Pelas muitas águas” conserva a imagem do transporte por extensas rotas aquáticas.
- source_word: זֶרַע
  choice: o cereal
  rationale: Junto de “colheita” e “renda”, o termo designa a produção agrícola, especialmente grãos, e não a semente destinada ao plantio.
- source_word: שִׁחֹר
  choice: Sior
  rationale: Mantém o topônimo hebraico em transliteração portuguesa, sem identificá-lo de modo definitivo no texto principal.
- source_word: קְצִיר יְאֹר
  choice: a colheita do Nilo
  rationale: יְאֹר, em contexto egípcio, refere-se ao Nilo ou a um de seus canais; a construção expressa a produção agrícola possibilitada pelo rio.
- source_word: תְּבוּאָתָהּ
  choice: era a sua renda
  rationale: Embora o substantivo possa significar “produção” ou “rendimento”, aqui os produtos agrícolas importados constituem a receita comercial da cidade. O sufixo feminino se refere a Tiro.
- source_word: וַתְּהִי סְחַר גּוֹיִם
  choice: e ela se tornou o centro comercial das nações
  rationale: סְחַר pode indicar comércio, mercadoria ou atividade mercantil. “Centro comercial” expressa em português natural o papel internacional de Tiro, enquanto a nota preserva alternativas mais formais.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção nominal do hebraico foi mantida tanto quanto possível; “centro comercial” oferece naturalidade sem eliminar as alternativas lexicais registradas em nota.
