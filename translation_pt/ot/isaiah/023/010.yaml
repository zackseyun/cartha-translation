  text: עִבְרִ֥י אַרְצֵ֖/ךְ כַּ/יְאֹ֑ר בַּת תַּרְשִׁ֕ישׁ אֵ֖ין מֵ֥זַח עֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/010.yaml
  text: Pass through your land like the Nile[a], daughter of Tarshish[c][b]; there is no restraint anymore.
translation:
  language: pt
  text: Atravesse a sua terra como o Nilo[a], ó filha de Társis; já não há mais contenção[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido: “Passe pela sua terra como o Nilo” ou “Espalhe-se pela sua terra como o Nilo”. O verbo hebraico significa passar ou atravessar, mas a comparação pode evocar o Nilo transbordando e se espalhando.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico traduzido como “contenção” é raro e incerto. Também pode significar “barreira”, “amarra” ou, possivelmente, “porto”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרִי
  choice: Atravesse
  rationale: O imperativo feminino singular de עבר significa basicamente passar ou atravessar. A tradução preserva a ação verbal distinta da comparação seguinte, enquanto a imagem do Nilo sugere um avanço que se espalha pela terra.
- source_word: אַרְצֵךְ
  choice: a sua terra
  rationale: ארץ com sufixo feminino singular significa naturalmente “sua terra”; a forma portuguesa mantém a referência territorial e a concordância com a destinatária personificada.
- source_word: כיאור
  choice: como o Nilo
  rationale: יאר frequentemente designa o Nilo ou seus canais. “O Nilo” preserva a imagem geográfica e a possível alusão às suas inundações.
- source_word: בת תרשיש
  choice: ó filha de Társis
  rationale: A expressão profética personifica Társis como uma filha. O vocativo com “ó” torna a interpelação clara e conserva a força poética.
- source_word: אין
  choice: não há
  rationale: Equivalente natural da negação existencial hebraica.
- source_word: מזח
  choice: contenção
  rationale: O substantivo é raro e de sentido incerto, podendo indicar algo que prende, restringe ou mantém seguro. “Contenção” combina com a imagem fluvial sem impor uma identificação concreta incerta.
- source_word: עוד
  choice: mais
  rationale: Com a negação, עוד expressa que uma condição anterior já não continua; “já não há mais” reproduz esse valor idiomático.
