base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/018.yaml
  text: And her merchandise and her wages will be holy to Yahweh[a]; they will not be stored up or hoarded, for her merchandise will be for those who dwell before Yahweh[b], for eating to satisfaction and for durable clothing.
translation:
  language: pt
  text: Seu comércio e sua paga[a] serão consagrados a Yahweh. Não serão acumulados nem entesourados, pois seu comércio será para os que habitam diante de Yahweh, para que comam até se saciar e tenham roupas duráveis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus ganhos” ou “sua remuneração”. O termo pode indicar pagamento, paga ou remuneração e talvez retome a imagem de Tiro como prostituta neste capítulo.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica final é difícil. Também pode ser entendida como “roupas excelentes”, “vestes majestosas” ou “ampla cobertura”.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַחְרָהּ
  choice: seu comércio / os ganhos do seu comércio
  rationale: O substantivo pode designar tanto a atividade comercial quanto aquilo que ela produz. A primeira ocorrência preserva o sentido amplo de comércio; na segunda, o contexto de provisão favorece explicitar os ganhos provenientes dele.
- source_word: אֶתְנַנָּהּ
  choice: seus ganhos
  rationale: O termo designa pagamento ou remuneração e pode evocar o pagamento de uma prostituta, em continuidade com a imagem de Tiro no contexto. “Ganhos” é natural em português, enquanto a nota preserva a conotação possível.
- source_word: קֹדֶשׁ לַיהוָה
  choice: consagrados a Yahweh
  rationale: Expressa dedicação sagrada a Yahweh. “Consagrados” comunica com clareza a força cultual de קֹדֶשׁ no português atual.
- source_word: יֵאָצֵר וְלֹא יֵחָסֵן
  choice: não serão acumulados nem guardados
  rationale: Os dois verbos paralelos descrevem ajuntar e manter riquezas em reserva. A formulação portuguesa conserva o paralelismo sem redundância artificial.
- source_word: לַיֹּשְׁבִים לִפְנֵי יְהוָה
  choice: aos que habitam diante de Yahweh
  rationale: Mantém a expressão espacial e cultual do hebraico sem definir além do texto quem são essas pessoas.
- source_word: לֶאֱכֹל לְשָׂבְעָה
  choice: para que comam até se saciar
  rationale: Tradução idiomática do propósito de comer até atingir plena satisfação.
- source_word: לִמְכַסֶּה עָתִיק
  choice: tenham roupas duráveis
  rationale: מכסה indica cobertura ou vestimenta, enquanto o raro עתיק admite sentidos como duradouro, excelente ou abundante. “Roupas duráveis” oferece um sentido prático plausível, e a nota registra a incerteza.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Jeová / SENHOR
  rationale: O texto traz diretamente o tetragrama; “Yahweh” preserva o nome pactual e segue a orientação doutrinária fornecida.
- issue: Natureza sagrada da receita comercial de Tiro
  choice: consagrados a Yahweh
  alternative: separados para Yahweh / santos para Yahweh
  rationale: קֹדֶשׁ indica dedicação sagrada, não apenas tributação ou redistribuição econômica. “Consagrados” preserva essa força sem especificar o mecanismo.
- issue: Identidade dos que habitam diante de Yahweh
  choice: não especificada
  alternative: sacerdotes ou adoradores
  rationale: A expressão pode sugerir pessoas ligadas à presença ou ao serviço de Yahweh, mas o versículo não identifica explicitamente um grupo; a tradução conserva essa abertura.
translation_notes:
  register: Português moderno, digno e de leitura natural, com ampla inteligibilidade brasileira. A sintaxe foi levemente dinamizada em “para que comam até se saciar e tenham”, preservando o propósito e o paralelismo do hebraico. Todos os marcadores de nota aparecem no texto.
