id: ISA.23.12
reference: Isaiah 23:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לֹֽא תוֹסִ֥יפִי ע֖וֹד לַ/עְל֑וֹז הַֽ/מְעֻשָּׁקָ֞ה בְּתוּלַ֣ת בַּת צִיד֗וֹן כתיים ק֣וּמִי עֲבֹ֔רִי גַּם שָׁ֖ם לֹא יָנ֥וּחַֽ לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/012.yaml
  text: He said[a], “You will exult no more, oppressed virgin daughter of Sidon. Arise, cross over to Kittim[b]; even there you will find no rest.”
translation:
  language: pt
  text: 'Ele disse: “Você não exultará mais[a], ó oprimida, virgem filha de Sidom. Levante-se, atravesse para Quitim[b]; nem mesmo ali você terá descanso.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Você não voltará a se alegrar.”'
    reason: lexical_alternative
  - marker: b
    text: Quitim provavelmente se refere a Chipre e, por extensão, pode evocar territórios marítimos do oeste.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ele disse
  rationale: O wayyiqtol de אמר introduz a fala. Em português, a conjunção inicial pode ser omitida com naturalidade, enquanto o sujeito masculino singular permanece explícito.
- source_word: לֹא תוֹסִיפִי עוֹד לַעְלֹז
  choice: Você não exultará mais
  rationale: A construção negativa com יסף e עוֹד indica cessação, e עלז expressa alegria intensa. A formulação é direta, atual e conserva o tom profético elevado.
- source_word: הַמְעֻשָּׁקָה
  choice: ó oprimida
  rationale: O particípio passivo de עשׁק descreve alguém submetido à opressão. A partícula vocativa torna claro que o termo se dirige à personificação feminina de Sidom.
- source_word: בְּתוּלַת בַּת צִידוֹן
  choice: virgem filha de Sidom
  rationale: Preserva a personificação profética e a relação construta do hebraico sem substituir a imagem por uma explicação.
- source_word: כתיים / כִּתִּים
  choice: Quitim
  rationale: Mantém o nome próprio em transliteração portuguesa, sem restringir no texto principal sua referência geográfica potencialmente mais ampla.
- source_word: קוּמִי עֲבֹרִי
  choice: Levante-se, atravesse
  rationale: Reproduz os dois imperativos femininos singulares dirigidos à Sidom personificada, com urgência e naturalidade em português.
- source_word: גַּם שָׁם
  choice: nem mesmo ali
  rationale: No contexto da negação seguinte, esta formulação comunica com clareza a ênfase de que nem o destino da fuga oferecerá alívio.
- source_word: לֹא יָנוּחַ לָךְ
  choice: você terá descanso
  rationale: Com a negação já incorporada em “nem mesmo ali”, a expressão traduz idiomaticamente a ideia de que nenhum descanso estará disponível para a destinatária.
theological_decisions:
- issue: Identidade do sujeito de וַיֹּאמֶר
  choice: Ele disse
  alternative: E ele disse / O SENHOR disse
  rationale: O verbo traz sujeito masculino singular implícito, mas o versículo isolado não o nomeia. “Ele” preserva a referência contextual sem inserir explicitamente uma identificação teológica ausente desta oração.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você”. Conserva-se a metáfora profética “virgem filha de Sidom” e o nome geográfico tradicional “Quitim”; a sintaxe foi levemente ajustada para soar natural sem eliminar a ênfase ou a personificação feminina do hebraico.
