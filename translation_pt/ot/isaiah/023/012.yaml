  terminology: “Sidom” e “Quitim” são formas portuguesas apropriadas dos nomes. “Virgem filha de Sidom” preserva a metáfora profética sem explicá-la indevidamente. A nota sobre Quitim oferece a identificação geográfica de modo cauteloso, e a alternativa lexical da nota a é legítima.
