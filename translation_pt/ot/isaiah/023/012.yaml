  source_fidelity: 'O texto traduz com fidelidade os elementos principais do hebraico: a cessação de exultar, a designação feminina e personificada de Sidom como “oprimida, virgem filha”, os imperativos para fugir a Quitim e a afirmação de que não haverá descanso nem ali. “Nem mesmo ali você terá descanso” comunica adequadamente a força de גַּם שָׁם com a negação final.'
