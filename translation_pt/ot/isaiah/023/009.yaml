base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/009.yaml
  text: 'Yahweh of hosts has purposed it: to defile the pride of all beauty[c][b][a], to humble all the honored ones of the earth.'
translation:
  language: pt
  text: 'Yahweh dos Exércitos determinou isto[a]: profanar o orgulho de todo esplendor[b] e rebaixar[c] todos os honrados da terra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “planejou isto contra ela”, referindo-se especificamente a Tiro.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “toda beleza” ou “toda glória”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “humilhar”, “desonrar” ou “tratar com desprezo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Preserva o nome divino e traduz o título צְבָאוֹת de modo natural e reconhecível em português, sem limitar sua abrangência a exércitos humanos.
- source_word: יְעָצָהּ
  choice: determinou isso
  rationale: O verbo expressa propósito ou plano decidido; «isso» retoma o juízo anunciado e evita fixar no texto principal o referente ambíguo do sufixo feminino.
- source_word: לְחַלֵּל
  choice: profanar
  rationale: Mantém a força de retirar honra ou santidade, adequada ao rebaixamento deliberado do que era exaltado.
- source_word: גְּאוֹן כָּל צְבִי
  choice: o orgulho de todo esplendor
  rationale: Conserva a construção compacta e a relação entre exaltação e esplendor; צְבִי admite também «beleza» ou «glória».
- source_word: לְהָקֵל
  choice: rebaixar
  rationale: No hifil, comunica tornar insignificante, aviltar ou trazer para baixo, em paralelo com «profanar».
- source_word: כָּל נִכְבַּדֵּי אָרֶץ
  choice: todos os honrados da terra
  rationale: Reproduz a amplitude do particípio substantivado, sem restringi-lo apenas a nobres ou governantes; «terra» preserva o possível alcance amplo.
theological_decisions:
- issue: Referente do sufixo feminino em יְעָצָהּ
  choice: «determinou isso», referindo-se ao juízo ou propósito anunciado
  alternative: «planejou isso contra ela», com referência específica a Tiro
  rationale: O texto principal mantém fluidez e não resolve indevidamente a ambiguidade; a leitura específica referente a Tiro é registrada em nota.
- issue: Sentido de כָּל צְבִי
  choice: «todo esplendor»
  alternative: «toda beleza» ou «toda glória»
  rationale: «Esplendor» preserva tanto a dimensão de beleza quanto a de magnificência, sem estreitar desnecessariamente o termo.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A ordem poética e o paralelismo do hebraico foram preservados sem tornar a frase artificial.
