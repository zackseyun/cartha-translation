  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עִבְר֖וּ תַּרְשִׁ֑ישָׁ/ה הֵילִ֖ילוּ יֹ֥שְׁבֵי אִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/006.yaml
  text: Cross over to Tarshish; wail[a], inhabitants of the coastland.
translation:
  language: pt
  text: Atravessem para Társis; lamentem, habitantes da região costeira.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ilha”; o termo hebraico pode indicar uma ilha ou uma região marítima costeira.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרוּ
  choice: Atravessem
  rationale: Imperativo plural de עבר. Expressa a ordem de passar para outro lugar sem especificar além do hebraico o meio da travessia.
- source_word: תַּרְשִׁישָׁה
  choice: para Társis
  rationale: O nome próprio com ה direcional indica movimento em direção a Társis; a construção portuguesa natural é “para Társis”.
- source_word: הֵילִילוּ
  choice: lamentem
  rationale: Imperativo plural de ילל, que denota um clamor intenso de dor ou aflição. “Lamentem” é atual e digno, embora menos gráfico que “uivem”.
- source_word: יֹשְׁבֵי
  choice: habitantes da
  rationale: O particípio construto de ישב é usado substantivamente; “habitantes da” comunica isso de modo claro e idiomático.
- source_word: אִי
  choice: região costeira
  rationale: O termo pode designar uma ilha ou uma terra/região marítima costeira. No contexto do oráculo contra Tiro, “região costeira” mantém o sentido geográfico amplo sem exigir que se trate de uma ilha.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com imperativos no plural. “Társis” segue a forma tradicional amplamente reconhecida em português. A nota preserva a ambiguidade geográfica de אִי.
