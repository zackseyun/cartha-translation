base_translation:
  language: en
  yaml_path: translation/ot/isaiah/023/005.yaml
  text: When the report comes to Egypt[a], they will writhe at the report of Tyre.
translation:
  language: pt
  text: Quando a notícia chegar ao Egito, eles se contorcerão de angústia[a] com a notícia de Tiro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tremerão”, “sentirão angústia” ou “sofrerão dores”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Quando
  rationale: Introduz aqui uma oração temporal; “quando” expressa de modo natural a chegada da notícia.
- source_word: שֵׁמַע
  choice: a notícia chegar
  rationale: O substantivo pode significar “notícia” ou “relato”. Em português, “a notícia chegar” comunica naturalmente o movimento implícito até o Egito.
- source_word: לְמִצְרָיִם
  choice: ao Egito
  rationale: A preposição é entendida em sentido direcional, indicando o destino da notícia.
- source_word: יָחִילוּ
  choice: eles se contorcerão de angústia
  rationale: O verbo descreve forte aflição, com a imagem vívida de contorcer-se ou tremer, possivelmente como em dores de parto.
- source_word: כְּשֵׁמַע
  choice: com a notícia
  rationale: A preposição apresenta a notícia como ocasião ou causa da angústia; a repetição de “notícia” preserva o paralelismo hebraico.
- source_word: צֹר
  choice: Tiro
  rationale: Forma portuguesa tradicional do nome geográfico צֹר.
