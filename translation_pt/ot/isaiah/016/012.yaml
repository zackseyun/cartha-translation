  naturalness: “Quando se vir que” é uma construção compreensível e apropriada ao registro profético. “Não poderá” pode ficar sem complemento em português nesse contexto solene e preserva a concisão do original.
  terminology: “Moabe”, “lugar alto” e “santuário” são escolhas adequadas. A nota sobre “lugar alto” é útil e corretamente ancorada.
  issues:
