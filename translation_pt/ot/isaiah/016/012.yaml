id: ISA.16.12
reference: Isaiah 16:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָ֧ה כִֽי נִרְאָ֛ה כִּֽי נִלְאָ֥ה מוֹאָ֖ב עַל הַ/בָּמָ֑ה וּ/בָ֧א אֶל מִקְדָּשׁ֛/וֹ לְ/הִתְפַּלֵּ֖ל וְ/לֹ֥א יוּכָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/012.yaml
  text: And when it is seen that Moab is worn out on the high place[a], and he comes to his sanctuary to pray[c][b], he will not be able.
translation:
  language: pt
  text: E acontecerá que, quando se vir que Moabe se cansou no lugar alto[a] e for ao seu santuário para orar, não poderá.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lugar alto” refere-se a um local elevado usado para culto.
    reason: cultural_note
  - marker: b
    text: Também pode ser entendido como “não prevalecerá”, isto é, sua oração não terá êxito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: E acontecerá que, quando
  rationale: Preserva a fórmula prospectiva e seu valor temporal em português natural.
- source_word: נִרְאָה
  choice: se vir
  rationale: Mantém a construção passiva e relativamente impessoal do nifal, sem decidir se o sentido é estritamente 'ser visto' ou 'tornar-se evidente'.
- source_word: נִלְאָה
  choice: se cansou
  rationale: Expressa o esgotamento decorrente de esforço inútil; a alternativa 'se exauriu' é possível, mas menos corrente.
- source_word: מוֹאָב
  choice: Moabe
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: עַל הַבָּמָה
  choice: no lugar alto
  rationale: במה designa aqui um local elevado de culto; 'lugar alto' conserva o singular e a terminologia bíblica inteligível.
- source_word: וּבָא
  choice: e for
  rationale: O perfeito consecutivo tem referência futura nesta sequência; 'for' é natural diante do destino indicado e evita uma mudança temporal indevida.
- source_word: אֶל מִקְדָּשׁוֹ
  choice: ao seu santuário
  rationale: Conserva o sufixo masculino singular ligado ao Moabe personificado; 'santuário' é suficientemente amplo para um local de culto moabita.
- source_word: לְהִתְפַּלֵּל
  choice: para orar
  rationale: Verte diretamente o sentido usual do hitpael de פלל neste contexto.
- source_word: וְלֹא יוּכָל
  choice: nada conseguirá
  rationale: Comunica em português idiomático que Moabe não obterá resultado, preservando o sentido básico de incapacidade sem especificar além do contexto exatamente o que não conseguirá.
theological_decisions:
- issue: Referência das formas verbais singulares ligadas a Moabe
  choice: Manter Moabe como nação personificada no singular, com formas verbais sem pronome explícito
  alternative: Empregar referência plural ao povo de Moabe
  rationale: O hebraico trata o nome nacional com formas masculinas singulares. O português permite conservar essa personificação sem repetir 'ele'.
- issue: Resultado da oração no santuário
  choice: Traduzir וְלֹא יוּכָל por 'nada conseguirá'
  alternative: '''não poderá'' ou ''não prevalecerá'''
  rationale: '''Não poderá'' deixa em português uma oração incompleta sem complemento explícito, enquanto ''não prevalecerá'' interpreta mais diretamente o fracasso da súplica. ''Nada conseguirá'' mantém a ideia contextual de ineficácia sem introduzir uma conclusão teológica adicional.'
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por sintaxe natural. A abertura preserva a tonalidade profética; 'lugar alto' mantém um termo cultural bíblico explicado em nota. Os marcadores aparecem no texto em ordem alfabética.
