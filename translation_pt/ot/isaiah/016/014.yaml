  text: וְ/עַתָּ֗ה דִּבֶּ֣ר יְהוָה֮ לֵ/אמֹר֒ בְּ/שָׁלֹ֤שׁ שָׁנִים֙ כִּ/שְׁנֵ֣י שָׂכִ֔יר וְ/נִקְלָה֙ כְּב֣וֹד מוֹאָ֔ב בְּ/כֹ֖ל הֶ/הָמ֣וֹן הָ/רָ֑ב וּ/שְׁאָ֥ר מְעַ֛ט מִזְעָ֖ר ל֥וֹא כַבִּֽיר׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/014.yaml
  text: But now Yahweh has spoken[a], saying, “Within three years, like the years of a hired worker, the glory of Moab will be brought low, with all its great multitude; and the remnant will be few, very small[c][b], not mighty.”
translation:
  language: pt
  text: 'Mas agora Yahweh falou: “Dentro de três anos, como os anos de um trabalhador contratado,[a] a glória de Moabe será humilhada, juntamente com toda a sua grande multidão;[b] e o remanescente será pouco numeroso, muito pequeno e sem poder”.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Em três anos, contados como os anos de um trabalhador contratado”, ressaltando um prazo fixo e rigorosamente contado.'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica também pode se referir a toda a grande abundância ou ao grande tumulto de Moabe.
    reason: lexical_ambiguity
  - marker: c
    text: 'Ou: “e o remanescente será pouco, muito pequeno, não grande”; o último termo também pode significar “não poderoso”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Mas agora
  rationale: Marca a transição e o contraste entre o oráculo anterior e a declaração divina presente.
- source_word: דִּבֶּר יְהוָה לֵאמֹר
  choice: Yahweh falou
  rationale: Expressa de modo natural em português a declaração profética solene e introduz diretamente a fala citada.
- source_word: בְּשָׁלֹשׁ שָׁנִים כִּשְׁנֵי שָׂכִיר
  choice: Dentro de três anos, como os anos de um trabalhador contratado
  rationale: Comunica o prazo de três anos e a comparação com um período de trabalho contado rigorosamente.
- source_word: וְנִקְלָה כְּבוֹד מוֹאָב
  choice: a glória de Moabe será humilhada
  rationale: O nifal de קלה indica perda de honra ou posição; “humilhada” preserva a tensão intencional entre a glória de Moabe e seu rebaixamento.
- source_word: בְּכֹל הֶהָמוֹן הָרָב
  choice: juntamente com toda a sua grande multidão
  rationale: Mantém o sentido amplo de המון como multidão, massa ou abundância, sem restringi-lo apenas a população ou riqueza.
- source_word: וּשְׁאָר
  choice: e o remanescente
  rationale: Designa aquilo que restar depois do juízo; o contexto imediato ressalta sua pequenez e fraqueza, sem lhe atribuir automaticamente um sentido positivo.
- source_word: מְעַט מִזְעָר לֹא כַבִּיר
  choice: será pequeno, muito reduzido e sem força
  rationale: Reproduz a intensificação dos dois termos de pequenez e entende כביר, neste contexto nacional, como força ou poder.
theological_decisions:
- issue: Forma do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- issue: Sentido de שאר
  choice: remanescente
  alternative: o que restar; os sobreviventes
  rationale: Preserva o equivalente lexical tradicional, enquanto os qualificadores seguintes deixam claro que aqui o foco é a severa redução de Moabe, não uma doutrina positiva do remanescente.
- issue: Força de כביר
  choice: sem força
  alternative: não será grande; não será poderoso
  rationale: O termo pode indicar grandeza, força ou poder. “Sem força” se ajusta ao juízo sobre a capacidade nacional de Moabe sem excluir totalmente a noção de insignificância.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção conserva a solenidade profética, o contraste entre “glória” e “humilhada” e a repetição enfática que descreve a extrema redução do remanescente.
