base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/004.yaml
  text: Let the outcasts of Moab stay with you; be a shelter for them from the destroyer. For the oppressor has come to an end[a], destruction has ceased, those who trample have vanished from the land.
translation:
  language: pt
  text: Que os desterrados de Moabe morem com você; seja para eles um abrigo contra o devastador. Pois o opressor chegou ao fim,[a] a destruição cessou, e os que pisoteiam desapareceram da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conforme outra interpretação comum: “Que os meus desterrados morem com você, ó Moabe; seja abrigo para ele contra o devastador.” Essa leitura reflete outra vocalização ou divisão das palavras iniciais.'
    reason: alternative_reading
lexical_decisions:
- source_word: יָגוּרוּ בָךְ
  choice: morem com você
  rationale: גור indica residir como forasteiro ou permanecer sob acolhimento. “Morem com você” é natural em português e mantém a ideia de residência protegida sem explicitar além do texto.
- source_word: נִדָּחַי מוֹאָב
  choice: os desterrados de Moabe
  rationale: נדח designa pessoas expulsas, dispersas ou banidas. “Desterrados” preserva o caráter passivo e se ajusta ao contexto de deslocamento e busca de abrigo.
- source_word: הֱוִי סֵתֶר
  choice: seja para eles um abrigo
  rationale: סתר designa esconderijo, cobertura ou abrigo. “Abrigo” comunica de modo claro a proteção solicitada, sem acrescentar conotação teológica não exigida pelo termo.
- source_word: מִפְּנֵי שׁוֹדֵד
  choice: contra o devastador
  rationale: שׁודד é quem saqueia ou devasta. “Devastador” abrange a violência destrutiva do contexto melhor que uma referência restrita ao saque.
- source_word: אָפֵס
  choice: chegou ao fim
  rationale: אפס expressa cessar ou deixar de existir. A formulação portuguesa reproduz naturalmente o aspecto concluído.
- source_word: הַמֵּץ
  choice: o opressor
  rationale: O substantivo é difícil e pode indicar opressor, extorsionário ou esmagador. “Opressor” se harmoniza com o paralelismo de devastação e pisoteio sem estreitar indevidamente o sentido.
- source_word: כָּלָה שֹׁד
  choice: a destruição cessou
  rationale: שֹׁד pode denotar destruição, devastação, violência ou saque. “A destruição cessou” mantém o paralelismo e o alcance amplo do contexto.
- source_word: תַּמּוּ רֹמֵס
  choice: os que pisoteavam desapareceram
  rationale: O verbo está no plural, enquanto רֹמֵס pode ter força coletiva. A expressão plural respeita a concordância hebraica; o imperfeito descritivo “pisoteavam” apresenta a atividade habitual desses agentes.
- source_word: מִן הָאָרֶץ
  choice: da terra
  rationale: ארץ pode significar terra ou país. “Da terra” preserva a amplitude lexical e continua natural no contexto regional.
theological_decisions:
- issue: Destinatário e sintaxe do apelo inicial
  choice: 'O texto principal segue a vocalização massorética: uma figura ou localidade no feminino singular é exortada a acolher os desterrados de Moabe.'
  alternative: “Que os meus desterrados morem com você, ó Moabe; seja um abrigo para eles contra o devastador.”
  rationale: A leitura principal reflete diretamente בָךְ no feminino singular e נִדָּחַי מוֹאָב entendido como “os desterrados de Moabe”. A alternativa conhecida depende de outra vocalização ou divisão das palavras e, por isso, é registrada em nota sem eliminar a ambiguidade textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo poético foi mantido em três declarações de cessação, e a ambiguidade da abertura foi preservada em nota.
