  text: עַל כֵּן֙ מֵעַ֣/י לְ/מוֹאָ֔ב כַּ/כִּנּ֖וֹר יֶֽהֱמ֑וּ וְ/קִרְבִּ֖/י לְ/קִ֥יר חָֽרֶשׂ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/011.yaml
  text: Therefore my inward parts moan like a harp for Moab[b][a], and my inner being for Kir-heres.
translation:
  language: pt
  text: Por isso, minhas entranhas gemem como a lira[a] por Moabe, e meu íntimo geme por Quir-Heres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «harpa»; o hebraico kinnor designa um instrumento de cordas.
    reason: lexical_alternative
  - marker: b
    text: 'Quir-Heres era uma cidade moabita; forma tradicional: «Quir-Haresete».'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעַי
  choice: minhas entranhas
  rationale: Preserva a imagem corporal concreta do hebraico para a sede de emoção profunda, com linguagem ainda compreensível em português moderno.
- source_word: לְמוֹאָב
  choice: por Moabe
  rationale: A preposição indica aquele em favor de quem ou por causa de quem se lamenta; «por Moabe» expressa isso naturalmente sem eliminar a nuance.
- source_word: כַּכִּנּוֹר
  choice: como a lira
  rationale: כִּנּוֹר designa um instrumento de cordas antigo. «Lira» evita identificá-lo precisamente com a harpa moderna; a alternativa tradicional fica registrada em nota.
- source_word: יֶהֱמוּ
  choice: gemem
  rationale: O verbo descreve um som profundo e ressonante; no contexto de lamento, «gemem» comunica tanto o som quanto a dor.
- source_word: וְקִרְבִּי
  choice: e o meu íntimo
  rationale: קֶרֶב refere-se ao interior da pessoa. «Meu íntimo» mantém o paralelismo com «minhas entranhas» sem repetição artificial.
- source_word: לְקִיר חָרֶשׂ
  choice: por Quir-Heres
  rationale: Trata-se do nome de uma cidade moabita. A transliteração «Quir-Heres» segue uma forma próxima do texto hebraico e de leitura natural em português.
theological_decisions:
- issue: Identidade do eu lírico
  choice: Manter a primeira pessoa sem identificar explicitamente o falante
  alternative: Explicitar que é o profeta ou o próprio SENHOR
  rationale: O versículo isolado não exige resolver a identidade do falante; a tradução preserva a ambiguidade literária e teológica do contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção elíptica «e o meu íntimo, por...» reproduz o paralelismo poético hebraico; «entranhas» conserva sua imagem visceral sem substituí-la interpretativamente por «coração».
