translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A mudança dos imperativos plurais (“apresentem”, “tomem”) para os singulares (“faça”, “esconda”, “não exponha”) reproduz a mudança gramatical do hebraico. Evitou-se marcar no texto o gênero feminino da pessoa interpelada, pois as formas de tratamento escolhidas em português não o explicitam e a identificação contextual permanece aberta.
