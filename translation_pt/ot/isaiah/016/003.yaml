base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/003.yaml
  text: Bring counsel[a]; make a decision. Make your shadow like the night in the middle of noon; hide the outcasts[c][b]; do not betray the fugitive.
translation:
  language: pt
  text: Apresentem conselho; tomem uma decisão[a]. Faça com que a sua sombra[b] seja como a noite em pleno meio-dia; esconda os desterrados; não exponha o fugitivo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “façam justiça”, “profiram julgamento” ou “ofereçam arbitragem”. O substantivo hebraico tem sentido jurídico.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a sua sombra protetora”. A palavra hebraica também pode transmitir a ideia de sombra que dá proteção.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “não revele” ou “não descubra” o fugitivo; no contexto, isto é, não revele onde ele está.
    reason: lexical_alternative
lexical_decisions:
- source_word: הביאו עֵצָה
  choice: Apresentem conselho
  rationale: O hifil imperativo plural de בוא tem o sentido de trazer ou apresentar, e עֵצָה denota conselho. “Apresentem conselho” conserva o tom de deliberação política e o número plural.
- source_word: עֲשׂוּ פְלִילָה
  choice: tomem uma decisão
  rationale: פְלִילָה traz uma nuance jurídica de decisão, juízo ou arbitragem. A formulação escolhida é clara em português moderno, enquanto a nota preserva as alternativas mais especificamente judiciais.
- source_word: שִׁיתִי כַלַּיִל צִלֵּךְ
  choice: Faça a sua sombra ser como a noite
  rationale: שִׁיתִי é um imperativo feminino singular, em contraste com os imperativos plurais anteriores. A construção com “faça” comunica naturalmente a ideia de tornar a sombra tão escura quanto a noite; o português não marca aqui o gênero da pessoa interpelada.
- source_word: בְּתוֹךְ צָהֳרָיִם
  choice: em pleno meio-dia
  rationale: Expressa de modo natural o sentido literal de “no meio do meio-dia”, conservando o contraste forte entre a escuridão noturna e a luz máxima do dia.
- source_word: סַתְּרִי נִדָּחִים
  choice: esconda os desterrados
  rationale: סתר significa esconder ou ocultar, e נִדָּחִים designa pessoas expulsas, dispersas ou banidas. “Desterrados” preserva a ideia de terem sido forçados para fora de sua terra.
- source_word: נֹדֵד אַל תְּגַלִּי
  choice: não exponha o fugitivo
  rationale: גלה significa literalmente descobrir, revelar ou expor. No contexto de proteger alguém em fuga, “não exponha” é natural e mantém a imagem de não retirar sua ocultação, sem ampliar o verbo para a ideia mais interpretativa de trair ou entregar.
