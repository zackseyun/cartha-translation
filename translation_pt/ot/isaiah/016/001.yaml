  text: שִׁלְחוּ כַ֥ר מֹשֵֽׁל אֶ֖רֶץ מִ/סֶּ֣לַע מִדְבָּ֑רָ/ה אֶל הַ֖ר בַּת צִיּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/001.yaml
  text: Send a lamb to the ruler of the land[b][a], from Sela in the wilderness to the mountain of daughter Zion.
translation:
  language: pt
  text: Enviem um cordeiro ao governante da terra[b], de Selá[a], pelo deserto, ao monte da filha de Sião.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da rocha” ou “do penhasco”; o hebraico סלע pode ser entendido como substantivo comum, embora provavelmente seja aqui o nome do lugar Selá.
    reason: lexical_alternative
  - marker: b
    text: O cordeiro provavelmente representa um tributo enviado ao governante.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁלְחוּ
  choice: Enviem
  rationale: Imperativo qal masculino plural de שלח. “Enviem” comunica de forma direta e natural a ordem dirigida a um grupo.
- source_word: כַר
  choice: um cordeiro
  rationale: O substantivo designa um animal jovem do rebanho, provavelmente enviado aqui como tributo. O texto principal mantém o sentido concreto, sem explicitar uma inferência contextual.
- source_word: מֹשֵׁל אֶרֶץ
  choice: ao governante da terra
  rationale: מֹשֵׁל designa aquele que governa, e אֶרֶץ, neste contexto regional, é mais naturalmente “terra” do que “mundo”.
- source_word: מִסֶּלַע
  choice: de Selá
  rationale: Embora סלע também possa ser o substantivo comum “rocha” ou “penhasco”, neste contexto é plausivelmente o topônimo Selá. A alternativa lexical é preservada em nota.
- source_word: מִדְבָּרָה
  choice: pelo deserto
  rationale: A forma direcional é sintaticamente difícil. “Pelo deserto” expressa naturalmente o percurso associado ao envio sem impor uma reconstrução excessivamente específica.
- source_word: אֶל הַר בַּת צִיּוֹן
  choice: ao monte da filha de Sião
  rationale: Mantém tanto הַר, “monte”, quanto a personificação poética בַּת צִיּוֹן, “filha de Sião”, sem reduzi-la simplesmente a Jerusalém.
theological_decisions:
- issue: Se o cordeiro deve ser explicitamente interpretado como tributo no texto principal
  choice: Manter a formulação concreta “um cordeiro” e explicar em nota o provável sentido tributário.
  alternative: “Enviem um cordeiro como tributo” ou “Enviem tributo em cordeiros”.
  rationale: O contexto político favorece a interpretação de tributo, mas o hebraico nomeia concretamente um cordeiro. Preservar a imagem evita incorporar ao texto uma explicação contextual.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O plural “Enviem” reproduz o destinatário coletivo; “filha de Sião” conserva a personificação poética. A ordem dos marcadores foi ajustada para que cada nota apareça junto à expressão que explica.
