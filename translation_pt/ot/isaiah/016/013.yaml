  source_fidelity: 'A tradução reproduz corretamente a estrutura e os principais sentidos do hebraico: זֶה é mantido no presente resumitivo («Esta é»), הַדָּבָר como «a palavra», o nome divino como «Yahweh», e אֶל מוֹאָב em sentido referencial («a respeito de Moabe»). O perfeito דִּבֵּר é adequadamente vertido por «falou».'
  naturalness: «No passado» é compreensível, mas soa menos idiomático e menos diretamente temporal neste contexto. «Antigamente», colocado junto de «falou», expressa com maior naturalidade o מֵאָז sem especificar uma duração ou data.
  terminology: «Yahweh» segue de modo consistente o tratamento do Tetragrama no material de referência. «Moabe» é a forma portuguesa bíblica corrente. «Palavra» preserva apropriadamente o registro profético.
