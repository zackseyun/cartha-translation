  text: זֶ֣ה הַ/דָּבָ֗ר אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֶל מוֹאָ֖ב מֵ/אָֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/013.yaml
  text: This is the word that Yahweh spoke concerning Moab in time past[a].
translation:
  language: pt
  text: Esta é a palavra que Yahweh falou antigamente a respeito de Moabe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Esta é a mensagem que Yahweh falou anteriormente a respeito de Moabe”.'
    reason: Alternativas lexicais para הַדָּבָר, אֶל e מֵאָז.
lexical_decisions:
- source_word: זֶה
  choice: Esta é
  rationale: O demonstrativo introduz uma síntese ou conclusão. O presente preserva a força dêitica do hebraico, embora o verbo seguinte se refira a uma fala anterior.
- source_word: הַדָּבָר
  choice: a palavra
  rationale: דבר pode significar “palavra”, “assunto” ou “mensagem”. Aqui designa um pronunciamento profético; “palavra” preserva a formulação profética tradicional sem ser obscura.
- source_word: אֲשֶׁר דִּבֶּר
  choice: que ... falou
  rationale: A construção relativa é vertida naturalmente em português, e “falou” representa o sentido comum de דבר sem acrescentar a ênfase de “declarou”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֶל מוֹאָב
  choice: a respeito de Moabe
  rationale: No contexto de um oráculo sobre uma nação, אֶל tem valor referencial. A tradução evita tanto sugerir discurso direto (“a Moabe”) quanto acrescentar hostilidade não marcada pela preposição (“contra Moabe”).
- source_word: מֵאָז
  choice: no passado
  rationale: Expressa tempo anterior em relação à afirmação presente. É uma formulação natural e suficientemente ampla, sem impor a intensidade temporal de “há muito tempo”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O hebraico apresenta diretamente o Tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Valor de אֶל diante de Moabe no contexto do oráculo
  choice: a respeito de Moabe
  alternative: a Moabe; contra Moabe
  rationale: A construção identifica o referente do pronunciamento. Esta opção não transforma indevidamente o texto em fala dirigida a Moabe nem intensifica seu sentido como oposição explícita.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “Moabe” na forma bíblica corrente. A sintaxe conserva a concisão e o caráter resumitivo do hebraico.
