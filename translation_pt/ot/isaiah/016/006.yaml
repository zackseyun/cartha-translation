base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/006.yaml
  text: We have heard of the pride of Moab—how very proud he is—of his arrogance[a], his pride, and his fury; his boasts are not so.
translation:
  language: pt
  text: Ouvimos falar do orgulho de Moabe, de como ele é extremamente orgulhoso, de sua arrogância, de seu orgulho e de sua fúria; suas bravatas[a] não correspondem à realidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sua conversa vazia não corresponde à realidade” ou “suas falsidades não correspondem à realidade”. O termo hebraico pode se referir a afirmações presunçosas, conversa vazia ou falsidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְנוּ
  choice: Ouvimos falar
  rationale: O qal perfeito na primeira pessoa do plural indica conhecimento recebido por relato. A expressão portuguesa é natural e mantém esse valor reportativo.
- source_word: גְאוֹן מוֹאָב
  choice: orgulho de Moabe
  rationale: Neste contexto de juízo, גְאוֹן expressa soberba ou orgulho altivo, não majestade neutra.
- source_word: גֵּא מְאֹד
  choice: como ele é extremamente orgulhoso
  rationale: A construção intensifica a caracterização de Moabe. A forma exclamativa preserva a ênfase e soa natural em português.
- source_word: גַּאֲוָתוֹ
  choice: sua arrogância
  rationale: Distingue este sinônimo dentro do acúmulo retórico de termos ligados à soberba, sem perder seu sentido central.
- source_word: וּגְאוֹנוֹ
  choice: seu orgulho
  rationale: Mantém o sentido contextual do substantivo cognato de גְאוֹן e preserva a repetição deliberada.
- source_word: וְעֶבְרָתוֹ
  choice: sua fúria
  rationale: עֶבְרָה designa ira intensa ou transbordante; “fúria” é claro, vigoroso e adequado ao tom.
- source_word: לֹא כֵן
  choice: não correspondem à realidade
  rationale: Expressa a negação da veracidade ou correspondência das alegações de Moabe de modo idiomático em português.
- source_word: בַּדָּיו
  choice: suas vanglórias
  rationale: O termo pode indicar afirmações presunçosas, conversa vazia ou falsidade. No contexto da soberba de Moabe, “vanglórias” conserva melhor o foco retórico, enquanto a nota registra as outras nuances.
theological_decisions: []
