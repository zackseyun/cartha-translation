id: ISA.16.10
reference: Isaiah 16:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/נֶאֱסַ֨ף שִׂמְחָ֤ה וָ/גִיל֙ מִן הַ/כַּרְמֶ֔ל וּ/בַ/כְּרָמִ֥ים לֹֽא יְרֻנָּ֖ן לֹ֣א יְרֹעָ֑ע יַ֗יִן בַּ/יְקָבִ֛ים לֹֽא יִדְרֹ֥ךְ הַ/דֹּרֵ֖ךְ הֵידָ֥ד הִשְׁבַּֽתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/010.yaml
  text: Joy and gladness are taken away from the fruitful field[a], and in the vineyards no one sings for joy, no one shouts; no treader treads out wine in the presses[b]; I have put an end to the vintage shout.
translation:
  language: pt
  text: A alegria e o júbilo foram tirados do campo fértil[a]. Nas vinhas, ninguém canta de alegria nem solta gritos; nos lagares, nenhum pisador pisa as uvas para produzir vinho. Fiz cessar o grito da vindima[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do Carmelo”, entendendo כַּרְמֶל como nome de lugar, e não como “campo fértil”.
    reason: alternative_reading
  - marker: b
    text: Ou “grito da colheita”; trata-se do brado associado à vindima e à pisa das uvas.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֱסַף
  choice: foram tirados
  rationale: O nifal de אסף tem aqui o sentido idiomático de remoção ou supressão. O plural concorda naturalmente em português com o sujeito composto “a alegria e o júbilo”.
- source_word: שִׂמְחָה וָגִיל
  choice: a alegria e o júbilo
  rationale: A dupla mantém a sobreposição poética entre os termos, mas os distingue com vocábulos correntes e dignos.
- source_word: כַּרְמֶל
  choice: campo fértil
  rationale: O sentido comum de terra produtiva se ajusta ao paralelismo agrícola com vinhas, lagares e vindima; a possível leitura como topônimo é preservada em nota.
- source_word: יְרֻנָּן לֹא יְרֹעָע
  choice: ninguém canta de alegria nem solta gritos
  rationale: A formulação conserva as duas expressões paralelas de celebração sonora, distinguindo o canto jubiloso do grito festivo.
- source_word: יְקָבִים
  choice: lagares
  rationale: “Lagares” designa com precisão as instalações em que as uvas eram pisadas e é compreensível no contexto.
- source_word: יִדְרֹךְ הַדֹּרֵךְ
  choice: nenhum pisador pisa as uvas
  rationale: A repetição “pisador pisa” reproduz a ênfase do verbo finito seguido do particípio. “As uvas” explicita naturalmente em português o objeto envolvido na produção do vinho.
- source_word: הֵידָד
  choice: grito da vindima
  rationale: Designa o brado associado à colheita e à pisa das uvas. “Vindima” identifica de modo conciso esse contexto específico.
- source_word: הִשְׁבַּתִּי
  choice: Fiz cessar
  rationale: Preserva a força causativa do hifil de שבת e a primeira pessoa explícita, sem acrescentar no versículo a identidade do locutor.
theological_decisions:
- issue: Identidade implícita do locutor na primeira pessoa
  choice: Manter apenas “Fiz cessar”
  alternative: “Eu, o SENHOR, fiz cessar”
  rationale: O contexto mais amplo identifica o locutor divino, mas este versículo não repete o sujeito nominal; a tradução não acrescenta essa identificação ao texto.
- issue: Sentido de כַּרְמֶל
  choice: campo fértil
  alternative: Carmelo
  rationale: O paralelismo imediato favorece o substantivo comum de sentido agrícola, mas a leitura como nome geográfico continua possível e é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição deliberada em “nenhum pisador pisa” conserva a ênfase poética hebraica sem tornar a frase obscura. “Vindima” é um termo agrícola preciso, esclarecido pela nota.
