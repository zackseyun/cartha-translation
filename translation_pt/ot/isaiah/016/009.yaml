  text: עַל כֵּ֡ן אֶבְכֶּ֞ה בִּ/בְכִ֤י יַעְזֵר֙ גֶּ֣פֶן שִׂבְמָ֔ה אֲרַיָּ֨וֶ/ךְ֙ דִּמְעָתִ֔/י חֶשְׁבּ֖וֹן וְ/אֶלְעָלֵ֑ה כִּ֧י עַל קֵיצֵ֛/ךְ וְ/עַל קְצִירֵ֖/ךְ הֵידָ֥ד נָפָֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/009.yaml
  text: Therefore I weep with the weeping of Jazer for the vine of Sibmah[a]; I drench you with my tears, Heshbon and Elealeh[b], because over your summer fruit and over your harvest the battle shout has fallen.
translation:
  language: pt
  text: Por isso, choro com o pranto de Jazer pela videira de Sibma; encharco vocês[a] com minhas lágrimas, Hesbom e Eleale, pois o grito[b] caiu sobre os seus frutos de verão e sobre a sua colheita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu rego vocês com minhas lágrimas”. O verbo transmite a ideia de molhar abundantemente ou encharcar.'
    reason: lexical_alternative
  - marker: b
    text: A expressão também pode se referir ao grito de guerra de invasores que cai sobre a colheita ou, por implicação, ao grito alegre da colheita que cessou.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶבְכֶּה
  choice: choro
  rationale: O imperfeito qal na linguagem de lamento pode expressar ação presente ou continuada; o presente é natural em português sem excluir a continuidade do pesar.
- source_word: בִּבְכִי יַעְזֵר
  choice: com o pranto de Jazer
  rationale: Preserva o valor instrumental ou associativo da preposição ב e a construção poética, sem decidir se Jazer é objeto, fonte ou companheiro do pranto.
- source_word: גֶּפֶן שִׂבְמָה
  choice: a videira de Sibma
  rationale: Mantém a imagem singular de גֶּפֶן, que pode ter sentido coletivo, em vez de explicitar 'vinhedo'.
- source_word: אֲרַיָּוֶךְ דִּמְעָתִי
  choice: encharco vocês com minhas lágrimas
  rationale: O piel de רוה comunica saturar ou molhar abundantemente. O plural 'vocês' acomoda as duas cidades nomeadas em seguida.
- source_word: חֶשְׁבּוֹן וְאֶלְעָלֵה
  choice: Hesbom e Eleale
  rationale: Translitera os topônimos em formas correntes e os trata como vocativo, sem acrescentar uma interjeição ausente do hebraico.
- source_word: קֵיצֵךְ
  choice: seus frutos de verão
  rationale: קֵיץ designa os frutos ou produtos da estação quente; o plural soa natural em português neste contexto agrícola.
- source_word: קְצִירֵךְ
  choice: sua colheita
  rationale: Equivalente direto e corrente para o termo agrícola קָצִיר.
- source_word: הֵידָד נָפָל
  choice: caiu o grito
  rationale: Conserva a imagem literal e a amplitude de הֵידָד, que pode indicar um brado hostil ou um grito ligado à colheita, sem resolver a ambiguidade no texto principal.
theological_decisions:
- issue: Sentido da expressão final הֵידָד נָפָל
  choice: caiu o grito
  alternative: caiu o grito de guerra; cessou o grito alegre da colheita
  rationale: A formulação literal preserva a tensão poética entre um brado invasor que sobrevém à colheita e o possível desaparecimento do grito festivo dos trabalhadores.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Mantêm-se o paralelismo poético, a metáfora agrícola e a ambiguidade do último hemistíquio. Os marcadores de nota aparecem no texto principal junto aos trechos pertinentes.
