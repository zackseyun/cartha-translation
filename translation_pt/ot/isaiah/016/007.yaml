  text: לָ/כֵ֗ן יְיֵלִ֥יל מוֹאָ֛ב לְ/מוֹאָ֖ב כֻּלֹּ֣/ה יְיֵלִ֑יל לַ/אֲשִׁישֵׁ֧י קִיר חֲרֶ֛שֶׂת תֶּהְגּ֖וּ אַךְ נְכָאִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/007.yaml
  text: Therefore Moab will wail for Moab; all of it will wail. You will moan[a] for the raisin-cakes of Kir-hareseth, utterly stricken.
translation:
  language: pt
  text: Por isso, Moabe lamentará por Moabe; Moabe inteiro lamentará. Vocês gemerão[a] pelos bolos de passas de Quir-Haresete, completamente abatidos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “pelos alicerces de Quir-Haresete”. O hebraico אֲשִׁישֵׁי é difícil, mas o Texto Massorético é mais naturalmente entendido como “bolos de passas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Introduz naturalmente, em português atual, a consequência do anúncio de juízo precedente.
- source_word: יְיֵלִיל
  choice: lamentará
  rationale: Expressa o lamento intenso próprio deste contexto de juízo sem recorrer ao tom animal que “uivará” pode sugerir em português.
- source_word: מוֹאָב לְמוֹאָב
  choice: Moabe por Moabe
  rationale: Mantém a repetição enfática e entende a preposição como indicação daquele por quem ou por cuja causa se lamenta.
- source_word: כֻּלֹּה
  choice: Moabe inteiro
  rationale: Retoma coletivamente a nação e soa mais natural do que a reprodução pronominal “todo ele”.
- source_word: לַאֲשִׁישֵׁי
  choice: pelos bolos de passas
  rationale: Segue a leitura mais natural do Texto Massorético, na qual אֲשִׁישָׁה designa um bolo prensado, provavelmente de passas, associado à fartura perdida.
- source_word: קִיר חֲרֶשֶׂת
  choice: Quir-Haresete
  rationale: Translitera o topônimo moabita segundo uma forma clara e adequada à ortografia portuguesa.
- source_word: תֶּהְגּוּ
  choice: Vocês gemerão
  rationale: O verbo הגה pode indicar uma emissão baixa de voz; no contexto de lamento, “gemerão” transmite a dor audível e preserva a mudança para a segunda pessoa do plural.
- source_word: אַךְ נְכָאִים
  choice: completamente abatidos
  rationale: Entende אַךְ como intensificador e נְכָאִים como estado de aflição ou esmagamento, com concordância plural com os destinatários.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “Moabe” preserva a ênfase poética; “vocês” torna explícita a segunda pessoa do plural sem alterar o referente.
