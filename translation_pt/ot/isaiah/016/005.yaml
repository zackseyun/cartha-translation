  text: וְ/הוּכַ֤ן בַּ/חֶ֨סֶד֙ כִּסֵּ֔א וְ/יָשַׁ֥ב עָלָ֛י/ו בֶּ/אֱמֶ֖ת בְּ/אֹ֣הֶל דָּוִ֑ד שֹׁפֵ֛ט וְ/דֹרֵ֥שׁ מִשְׁפָּ֖ט וּ/מְהִ֥ר צֶֽדֶק׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/005.yaml
  text: A throne will be established in steadfast love[a], and one will sit on it in faithfulness in the tent of David[c][b], judging and seeking justice and swift to do righteousness.
translation:
  language: pt
  text: Um trono será firmado no amor leal[a], e alguém se assentará nele[b] com fidelidade[c], na tenda de Davi, julgando, buscando a justiça e pronto para agir com retidão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico ḥésed também pode ser traduzido como “misericórdia” ou “lealdade à aliança”.
    reason: lexical_alternative
  - marker: b
    text: Ou “ele se assentará nele”; o hebraico deixa o sujeito implícito.
    reason: alternative_reading
  - marker: c
    text: Ou “em verdade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּכַן
  choice: será firmado
  rationale: O hofal de כון indica que algo é estabelecido ou tornado firme. “Será firmado” conserva a voz passiva e combina naturalmente com a imagem do trono.
- source_word: בַּחֶסֶד
  choice: no amor leal
  rationale: חֶסֶד reúne as ideias de amor, misericórdia e lealdade pactual. “Amor leal” preserva essa riqueza sem restringir o termo a uma única nuance; “no” mantém de modo compacto a possível ideia de fundamento ou esfera.
- source_word: כִּסֵּא
  choice: um trono
  rationale: O substantivo hebraico não tem artigo, e o indefinido é natural no anúncio profético.
- source_word: וְיָשַׁב עָלָיו
  choice: e alguém se assentará nele
  rationale: O verbo está na terceira pessoa masculina singular, mas o sujeito não é expresso. “Alguém” evita identificar além do que o texto declara, sem apagar a referência contextual ao governante davídico.
- source_word: בֶּאֱמֶת
  choice: com fidelidade
  rationale: אֱמֶת pode significar verdade, firmeza ou fidelidade. No contexto do governo e do juízo, “com fidelidade” expressa uma atuação confiável, mantendo “em verdade” como alternativa legítima.
- source_word: בְּאֹהֶל דָּוִד
  choice: na tenda de Davi
  rationale: A imagem concreta da “tenda de Davi” é preservada, sem substituí-la interpretativamente por “casa” ou “dinastia”.
- source_word: שֹׁפֵט
  choice: julgando
  rationale: O particípio descreve a atividade contínua daquele que ocupa o trono e mantém o fluxo poético da sequência.
- source_word: וְדֹרֵשׁ מִשְׁפָּט
  choice: buscando a justiça
  rationale: דרשׁ com מִשְׁפָּט comunica procura ativa e compromisso com decisões justas. A formulação é clara e idiomática em português.
- source_word: וּמְהִר צֶדֶק
  choice: e pronto para agir com retidão
  rationale: A expressão hebraica é compacta e associa rapidez ou prontidão a צֶדֶק. A tradução explicita minimamente a ação para soar natural em português, sem transformar a retidão em mera qualidade abstrata.
theological_decisions:
- issue: Referente messiânico/davídico
  choice: Manter a descrição profética de um governante davídico ideal sem identificá-lo explicitamente na tradução.
  alternative: Identificá-lo como um rei davídico histórico específico ou diretamente como o Messias.
  rationale: O texto hebraico menciona o trono e a tenda de Davi, mas não nomeia o ocupante. A redação preserva essa reserva textual e permite a leitura messiânica sem inseri-la diretamente no versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva o movimento poético dos particípios hebraicos, enquanto pequenas explicitações evitam construções artificiais. Todos os marcadores de nota aparecem junto ao termo ou oração pertinente.
