id: ISA.16.2
reference: Isaiah 16:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָ֥ה כְ/עוֹף נוֹדֵ֖ד קֵ֣ן מְשֻׁלָּ֑ח תִּֽהְיֶ֨ינָה֙ בְּנ֣וֹת מוֹאָ֔ב מַעְבָּרֹ֖ת לְ/אַרְנֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/002.yaml
  text: And like a wandering bird[a], like a scattered nest[b], so the daughters of Moab will be at the fords of the Arnon.
translation:
  language: pt
  text: E, como ave errante, como ninho disperso[a], assim estarão as filhas de Moabe[b] nos vaus do Arnom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ninho expulso” ou “ninho desalojado”. A imagem hebraica é condensada e pode sugerir um ninho perturbado, desfeito ou abandonado.
    reason: lexical_alternative
  - marker: b
    text: “As filhas de Moabe” pode referir-se literalmente às mulheres moabitas ou, em linguagem figurada, às cidades e povoações de Moabe personificadas como filhas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: E ... assim estarão
  rationale: A construção introduz a comparação e seu resultado. Em português, “E ... assim estarão” integra naturalmente o verbo à oração principal e mantém a referência futura.
- source_word: כְעוֹף נוֹדֵד
  choice: como ave errante
  rationale: עוֹף designa uma ave ou criatura voadora, e נוֹדֵד expressa movimento errante ou fuga. “Ave errante” preserva a imagem poética sem especificar além do hebraico.
- source_word: קֵן מְשֻׁלָּח
  choice: como ninho disperso
  rationale: A expressão compacta combina “ninho” com um particípio passivo que significa literalmente “mandado embora”, “expulso” ou “afastado”. “Ninho disperso” comunica perturbação e vulnerabilidade, enquanto a nota registra a dificuldade da imagem.
- source_word: תִּהְיֶינָה
  choice: estarão
  rationale: Forma feminina plural de היה, concordando com בְּנוֹת מוֹאָב. “Estarão” é natural diante da indicação de lugar e conserva o valor futuro.
- source_word: בְּנוֹת מוֹאָב
  choice: as filhas de Moabe
  rationale: Tradução literal que preserva a possível referência tanto às mulheres moabitas quanto, figuradamente, às povoações de Moabe.
- source_word: מַעְבָּרוֹת
  choice: nos vaus
  rationale: O substantivo plural indica lugares de travessia, especialmente pontos rasos pelos quais se atravessa um rio.
- source_word: לְאַרְנוֹן
  choice: do Arnom
  rationale: O nome próprio é tradicionalmente transliterado em português como “Arnom”; no contexto, refere-se ao rio ou desfiladeiro associado aos vaus.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e ampla compreensão internacional. A repetição de “como” torna explícito o paralelismo poético subentendido, e “filhas de Moabe” mantém a ambiguidade do original.
