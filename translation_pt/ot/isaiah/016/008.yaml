source:
  edition: WLC
  text: כִּ֣י שַׁדְמוֹת֩ חֶשְׁבּ֨וֹן אֻמְלָ֜ל גֶּ֣פֶן שִׂבְמָ֗ה בַּעֲלֵ֤י גוֹיִם֙ הָלְמ֣וּ שְׂרוּקֶּ֔י/הָ עַד יַעְזֵ֥ר נָגָ֖עוּ תָּ֣עוּ מִדְבָּ֑ר שְׁלֻ֣חוֹתֶ֔י/הָ נִטְּשׁ֖וּ עָ֥בְרוּ יָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/016/008.yaml
  text: For the fields of Heshbon languish[a], the vine of Sibmah as well. The lords of the nations have struck down its choice vines; they reached as far as Jazer, they wandered into the wilderness[c][b]; its shoots spread out and crossed the sea.
translation:
  language: pt
  text: 'Pois os campos de Hesbom definham,

    e também a videira de Sibma.

    Os senhores das nações golpearam suas videiras seletas[a];

    elas chegavam até Jazer

    e vagueavam pelo deserto.

    Seus rebentos se espalharam[b]

    e atravessaram o mar[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus ramos” ou “suas gavinhas”. O termo hebraico pode destacar tanto cepas selecionadas quanto as ramificações da videira.
    reason: lexical_alternative
  - marker: b
    text: Ou “foram deixados”. O verbo hebraico é difícil neste contexto e admite mais de uma interpretação.
    reason: lexical_alternative
  - marker: c
    text: Aqui, “o mar” pode se referir especificamente ao mar Morto, conforme a geografia da região.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁדְמוֹת
  choice: campos
  rationale: Designa terras cultivadas. “Campos” é natural em português e mantém o paralelismo com a videira de Sibma sem restringir indevidamente o termo a vinhedos.
- source_word: אֻמְלָל
  choice: definham
  rationale: Expressa enfraquecimento, ressecamento ou decadência. “Definham” preserva a imagem agrícola e o tom poético.
- source_word: גֶּפֶן שִׂבְמָה
  choice: a videira de Sibma
  rationale: Mantém o singular coletivo e poético do hebraico, que provavelmente representa a região vinícola de Sibma.
- source_word: בַּעֲלֵי גוֹיִם
  choice: os senhores das nações
  rationale: Conserva o registro elevado e a ideia de governantes ou dominadores estrangeiros, sem reduzi-los a proprietários de vinhedos.
- source_word: הָלְמוּ
  choice: golpearam
  rationale: Traduz diretamente a ação de ferir ou bater, comunicando a devastação sem acrescentar explicitamente a ideia de destruição total.
- source_word: שְׂרוּקֶיהָ
  choice: suas videiras seletas
  rationale: O termo provavelmente se refere a cepas de qualidade escolhida, embora possa ser entendido como ramos ou gavinhas; a alternativa é preservada em nota.
- source_word: עַד יַעְזֵר נָגָעוּ
  choice: elas chegavam até Jazer
  rationale: Expressa naturalmente a extensão geográfica das videiras, tomadas como sujeito, em vez de atribuir a ação aos governantes.
- source_word: תָּעוּ מִדְבָּר
  choice: vagueavam pelo deserto
  rationale: Preserva a personificação poética do verbo “vagar” ou “andar errante” aplicada ao crescimento extenso da videira.
- source_word: שְׁלֻחוֹתֶיהָ
  choice: seus rebentos
  rationale: O substantivo indica aquilo que a planta lança para fora, isto é, brotos, ramificações ou rebentos; “rebentos” é claro e apropriado à imagem da videira.
- source_word: נִטְּשׁוּ
  choice: se espalharam
  rationale: No contexto, descreve provavelmente os rebentos estendendo-se para fora. Como a forma também pode sugerir que foram deixados ou abandonados, a dificuldade é registrada em nota.
- source_word: עָבְרוּ יָם
  choice: atravessaram o mar
  rationale: Segue de perto a formulação hebraica e evita identificar no texto principal qual mar está em vista.
