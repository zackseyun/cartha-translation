base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/009.yaml
  text: His rock will pass away because of terror[a], and his princes will be terrified at the signal, declares Yahweh[c][b], whose fire is in Zion and whose furnace is in Jerusalem.
translation:
  language: pt
  text: Sua rocha desaparecerá por causa do terror[a], e seus príncipes ficarão apavorados diante do estandarte[b] — declaração de Yahweh, que tem fogo em Sião e uma fornalha em Jerusalém[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Sua fortaleza desaparecerá em meio ao terror”. A “rocha” pode representar metaforicamente o refúgio fortificado ou o governante da Assíria.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ficarão consternados por causa do sinal”. O termo hebraico pode indicar um estandarte, uma bandeira ou um sinal elevado.'
    reason: alternative_reading
  - marker: c
    text: As imagens do “fogo” e da “fornalha” de Yahweh em Sião e Jerusalém provavelmente evocam sua presença consumidora em juízo, mas o texto não especifica a imagem de modo mais restrito.
    reason: cultural_note
lexical_decisions:
- source_word: וְסַלְעוֹ
  choice: sua rocha
  rationale: Mantém a imagem concreta de סֶלַע (“rocha”, “penhasco”) sem decidir no texto principal se ela representa a fortaleza, o refúgio ou o governante da Assíria.
- source_word: מִמָּגוֹר יַעֲבוֹר
  choice: desaparecerá por causa do terror
  rationale: מִן pode indicar causa, e יַעֲבוֹר comunica aqui a remoção ou o desaparecimento diante do juízo. A formulação é natural em português e preserva a relação causal provável.
- source_word: וְחַתּוּ
  choice: ficarão apavorados
  rationale: O Qal de חתת pode indicar ficar aterrorizado ou consternado; com os príncipes como sujeito e em paralelo com מָגוֹר, a reação de pavor é adequada.
- source_word: מִנֵּס
  choice: diante do estandarte
  rationale: נֵס designa um estandarte, sinal elevado ou bandeira militar. “Estandarte” preserva a imagem hebraica, enquanto “diante de” expressa de modo idiomático a reação provocada por ele.
- source_word: שָׂרָיו
  choice: seus príncipes
  rationale: שַׂר pode designar príncipes, chefes, oficiais ou comandantes. “Príncipes” conserva a amplitude do termo sem restringi-lo ao sentido militar.
- source_word: נְאֻם יְהוָה
  choice: declaração de Yahweh
  rationale: Reproduz a fórmula profética solene e verte diretamente o nome divino יהוה como “Yahweh”.
- source_word: אֲשֶׁר אוּר לוֹ בְצִיּוֹן
  choice: que tem fogo em Sião
  rationale: אוּר significa aqui “fogo”, especialmente pelo paralelismo com “fornalha”. A construção com “tem” representa naturalmente o hebraico לוֹ.
- source_word: וְתַנּוּר לוֹ בִּירוּשָׁלִָם
  choice: e uma fornalha em Jerusalém
  rationale: תַּנּוּר pode ser forno ou fornalha; “fornalha” comunica a intensidade da imagem em paralelo com o fogo, sem explicar além do texto.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama; “Yahweh” preserva o nome pactual sem substituí-lo por um título.
- issue: Identidade da “rocha” assíria
  choice: Manter a metáfora sem identificar seu referente
  alternative: Explicitar “fortaleza”, “refúgio” ou “rei”
  rationale: O hebraico permite mais de um referente metafórico. A tradução conserva essa ambiguidade e a nota apresenta as possibilidades.
- issue: Sentido do fogo e da fornalha em Sião e Jerusalém
  choice: Conservar as imagens sem especificar sua aplicação
  alternative: Identificá-las expressamente com o fogo do altar ou com um juízo escatológico
  rationale: A linguagem sugere a presença consumidora de Yahweh em juízo, mas o versículo não define a imagem de maneira mais estreita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva as imagens hebraicas de “rocha”, “estandarte”, “fogo” e “fornalha”, recorrendo às notas para alternativas legítimas e evitando resolver ambiguidades teológicas não decididas pelo texto.
