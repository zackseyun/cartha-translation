source:
  edition: WLC
  text: ה֣וֹי הַ/יֹּרְדִ֤ים מִצְרַ֨יִם֙ לְ/עֶזְרָ֔ה עַל סוּסִ֖ים יִשָּׁעֵ֑נוּ וַ/יִּבְטְח֨וּ עַל רֶ֜כֶב כִּ֣י רָ֗ב וְ/עַ֤ל פָּֽרָשִׁים֙ כִּֽי עָצְמ֣וּ מְאֹ֔ד וְ/לֹ֤א שָׁעוּ֙ עַל קְד֣וֹשׁ יִשְׂרָאֵ֔ל וְ/אֶת יְהוָ֖ה לֹ֥א דָרָֽשׁוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/001.yaml
  text: Woe to those who go down to Egypt for help[a], who rely on horses and trust in chariots because they are many, and in horsemen because they are very strong[c][b], but do not look to the Holy One of Israel and do not seek Yahweh.
translation:
  language: pt
  text: Ai dos que descem ao Egito em busca de ajuda, que se apoiam em cavalos[a] e confiam em carros de guerra porque são muitos, e em cavaleiros[b] porque são muito poderosos, mas não olham para o Santo de Israel nem buscam Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «dependem de cavalos». O verbo hebraico retrata o ato de buscar apoio naquilo sobre o qual alguém se inclina.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «cavalaria».'
    reason: lexical_alternative
  - marker: c
    text: «Yahweh» representa o nome divino יהוה (YHWH), tradicionalmente vertido como «SENHOR».
    reason: divine_name
lexical_decisions:
- source_word: הוֹי
  choice: Ai dos
  rationale: Preserva a força da interjeição profética de denúncia e juízo em português natural.
- source_word: הַיֹּרְדִים מִצְרַיִם לְעֶזְרָה
  choice: os que descem ao Egito em busca de ajuda
  rationale: O particípio designa uma classe de pessoas; «descem» conserva a orientação geográfica idiomática, e «em busca de ajuda» expressa claramente a finalidade.
- source_word: עַל סוּסִים יִשָּׁעֵנוּ
  choice: que se apoiam em cavalos
  rationale: Mantém a imagem concreta do verbo שׁען, a de procurar sustentação em algo, e comunica dependência.
- source_word: וַיִּבְטְחוּ עַל רֶכֶב כִּי רָב
  choice: e confiam em carros de guerra porque são muitos
  rationale: רֶכֶב é coletivo; o plural português torna explícita a força militar em vista. «Carros de guerra» evita a possível leitura moderna de automóveis.
- source_word: וְעַל פָּרָשִׁים
  choice: e em cavaleiros
  rationale: Preserva a imagem concreta dos guerreiros montados sem restringir o termo à abstração «cavalaria».
- source_word: כִּי עָצְמוּ מְאֹד
  choice: porque são muito poderosos
  rationale: Expressa a potência militar indicada por עָצַם, sem decidir que a frase se refere apenas a força física ou apenas a número.
- source_word: וְלֹא שָׁעוּ עַל קְדוֹשׁ יִשְׂרָאֵל
  choice: mas não olham para o Santo de Israel
  rationale: «Olham para» conserva tanto a direção do olhar quanto a ideia contextual de consideração e dependência.
- source_word: וְאֶת יְהוָה לֹא דָרָשׁוּ
  choice: nem buscam Yahweh
  rationale: «Buscam» traduz diretamente דרשׁ neste contexto de recorrer a Deus e procurar sua orientação.
theological_decisions:
- issue: Forma verbal e referência temporal da denúncia
  choice: 'presente genérico: «descem», «se apoiam», «confiam», «não olham», «nem buscam»'
  alternative: 'sequência passada: «desceram... apoiaram-se... confiaram... não olharam... não buscaram»'
  rationale: O particípio substantivado abre uma denúncia contra pessoas caracterizadas por essas ações; o presente português preserva melhor essa força geral, embora as formas hebraicas seguintes possam ser vertidas de modo mais retrospectivo.
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: Emprega uma representação do nome próprio do texto hebraico, sem substituí-lo por um título.
- issue: Sentido de עָצְמוּ
  choice: «são muito poderosos»
  alternative: «são muito numerosos»
  rationale: O verbo admite a ideia de potência e, em certos contextos, de grande número. O paralelismo já atribui quantidade aos carros; «poderosos» preserva a distinção provável sem eliminar a amplitude semântica, registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Carros de guerra» explicita o referente antigo; «Ai dos» mantém o tom oracular. A ordem das notas foi regularizada para que os marcadores apareçam sequencialmente no texto.
