source:
  edition: WLC
  text: שׁ֗וּבוּ לַ/אֲשֶׁ֛ר הֶעְמִ֥יקוּ סָרָ֖ה בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/006.yaml
  text: Return to him from whom the sons of Israel have deeply revolted[a][b].
translation:
  language: pt
  text: Voltem para aquele contra quem vocês, filhos de Israel, se rebelaram profundamente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Voltem para aquele de quem vocês, filhos de Israel, se afastaram profundamente.” A expressão relativa hebraica é condensada e admite mais de uma formulação.'
    reason: alternative_reading
lexical_decisions:
- source_word: שׁוּבוּ
  choice: Voltem
  rationale: O imperativo plural de שוב convoca ao retorno e ao arrependimento. “Voltem” é direto, natural e conserva o sentido de movimento de volta.
- source_word: לַאֲשֶׁר
  choice: para aquele contra quem
  rationale: A expressão relativa comprimida liga o chamado a voltar à pessoa contra quem ocorreu a rebelião. Esta formulação é clara em português sem explicitar “SENHOR”, ausente no texto do versículo.
- source_word: הֶעְמִיקוּ
  choice: tão profundamente
  rationale: O hifil de עמק intensifica a ideia de rebelião, literalmente associada a ir ou tornar profundo. A expressão adverbial comunica essa força em português corrente.
- source_word: סָרָה
  choice: se rebelaram
  rationale: O termo denota desvio, defecção ou rebelião. “Rebelaram-se” preserva o caráter ativo e pactual sem recorrer ao termo técnico “apostataram”.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Reproduz de perto o masculino plural construto hebraico e funciona aqui como vocativo que identifica os destinatários.
theological_decisions:
- issue: Explicitar Deus ou YHWH como aquele para quem Israel deve voltar
  choice: Manter “aquele”, sem inserir um título divino
  alternative: Voltem para o SENHOR, contra quem vocês se rebelaram tão profundamente.
  rationale: Embora o contexto identifique claramente o referente como o Deus de Israel, o hebraico deste versículo emprega uma expressão relativa e não traz explicitamente o nome divino.
- issue: Relação semântica de לַאֲשֶׁר com a rebelião
  choice: “para aquele contra quem”
  alternative: “para aquele de quem”
  rationale: A preposição ל marca naturalmente o destino de “voltem”, enquanto “contra quem” expressa a relação exigida pela ideia de rebelião. A construção hebraica é comprimida, por isso a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O pronome “vocês” torna explícito o plural já indicado pelo imperativo e permite que “filhos de Israel” funcione naturalmente como vocativo. A única nota preserva a ambiguidade da construção relativa hebraica.
