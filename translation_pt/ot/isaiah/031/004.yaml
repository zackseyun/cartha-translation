base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/004.yaml
  text: 'For thus Yahweh said to me: As the lion or the young lion growls over its prey[a], and though a band of shepherds is called out against it, it is not terrified by their voice or cowed by their noise[b], so Yahweh of hosts will come down to wage war on Mount Zion and on its hill.'
translation:
  language: pt
  text: 'Pois assim me disse Yahweh: “Como o leão, ou o leão jovem, rosna sobre a sua presa[a], e, embora todo um grupo de pastores seja convocado contra ele, não se apavora com a voz deles nem se deixa intimidar pelo tumulto deles[b], assim Yahweh dos Exércitos descerá para guerrear no monte Sião e na sua colina.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o leão e o leão jovem”. A expressão hebraica pode ser entendida como uma dupla poética, e não necessariamente como uma alternativa estrita.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, mais literalmente: “nem responde ao tumulto deles”. O verbo hebraico também pode ter aqui o sentido de ser humilhado ou subjugado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, distinguindo-o de títulos e preservando sua ocorrência explícita no hebraico.
- source_word: יֶהְגֶּה
  choice: rosna
  rationale: Expressa o som baixo e ameaçador do leão sobre a presa, mais precisamente que um rugido pleno.
- source_word: הָאַרְיֵה וְהַכְּפִיר
  choice: o leão, ou o leão jovem
  rationale: Apresenta a dupla poética como comparação representativa sem obrigar a imagem de dois animais atuando juntos; a alternativa literal é preservada em nota.
- source_word: מְלֹא רֹעִים
  choice: um grupo inteiro de pastores
  rationale: Comunica tanto a ideia coletiva quanto a noção de número completo ou numeroso contida em מְלֹא, em português natural.
- source_word: יִקָּרֵא עָלָיו
  choice: se convoque contra ele
  rationale: Preserva a forma passiva e o sentido adversativo de pastores serem chamados para enfrentar o leão.
- source_word: לֹא יֵחָת
  choice: não se apavora
  rationale: Transmite o sentido de não ficar aterrorizado ou consternado e mantém viva a imagem concreta do leão.
- source_word: לֹא יַעֲנֶה
  choice: nem se deixa intimidar
  rationale: No paralelismo, o verbo provavelmente descreve não ser subjugado ou intimidado; a leitura mais literal é registrada em nota.
- source_word: הֲמוֹנָם
  choice: seu tumulto
  rationale: Representa a agitação ruidosa do grupo de pastores com mais força que o termo genérico 'barulho'.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Preserva o nome divino e a força militar do título צְבָאוֹת, especialmente pertinente ao verbo 'guerrear'.
- source_word: לִצְבֹּא
  choice: para guerrear
  rationale: Mantém o sentido militar do infinitivo e sua relação sonora e semântica com o título 'dos Exércitos'.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; a transliteração preserva o nome em vez de substituí-lo por um título.
- issue: Sentido de לֹא יַעֲנֶה na comparação do leão
  choice: nem se deixa intimidar pelo seu tumulto
  alternative: nem responde ao seu tumulto; nem é humilhado pelo seu tumulto
  rationale: O paralelismo com 'não se apavora' favorece a ideia de não ser dominado ou intimidado, mas a ambiguidade lexical é preservada em nota.
- issue: Ação de Yahweh em relação a Sião
  choice: guerrear no monte Sião e na sua colina
  alternative: guerrear contra o monte Sião e contra a sua colina
  rationale: A preposição עַל pode indicar local, interesse ou oposição. No contexto, Yahweh desce para combater em favor de Sião, mas a formulação evita explicitar um objeto não declarado e preserva a tensão do hebraico.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluente para leitores brasileiros e compreensão internacional. Mantiveram-se a imagem concreta do leão, o nome Yahweh e a força militar de “Yahweh dos Exércitos”. Os marcadores [a] e [b] aparecem no texto nos pontos correspondentes.
