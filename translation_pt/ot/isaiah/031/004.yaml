  naturalness: Há uma pequena construção pouco natural e menos fiel à passiva hebraica em «embora se convoque contra ele um grupo inteiro de pastores». Em português, é mais claro dizer que o grupo «seja convocado». «Todo um grupo de pastores» também comunica melhor a força coletiva de מְלֹא.
  terminology: «Yahweh», «Yahweh dos Exércitos», «rosna», «presa», «tumulto» e «guerrear» são escolhas adequadas ao registro e ao hebraico. A nota [b] deve esclarecer que «deles» se refere aos pastores, evitando a ambiguidade possessiva de «seu tumulto».
