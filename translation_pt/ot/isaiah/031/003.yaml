  source_fidelity: 'A tradução preserva com precisão os contrastes centrais do hebraico: Egito, embora poderoso, é humano e não Deus; seus cavalos são carne e não espírito; a ação de Yahweh faz ruir tanto o auxiliador quanto o auxiliado. «Quem ajuda» e «quem recebe ajuda» refletem adequadamente os particípios correlatos עוֹזֵר e עָזוּר, sem antecipar identificações contextuais não expressas no versículo.'
