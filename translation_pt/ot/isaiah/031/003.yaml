id: ISA.31.3
reference: Isaiah 31:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/מִצְרַ֤יִם אָדָם֙ וְֽ/לֹא אֵ֔ל וְ/סוּסֵי/הֶ֥ם בָּשָׂ֖ר וְ/לֹא ר֑וּחַ וַֽ/יהוָ֞ה יַטֶּ֣ה יָד֗/וֹ וְ/כָשַׁ֤ל עוֹזֵר֙ וְ/נָפַ֣ל עָזֻ֔ר וְ/יַחְדָּ֖ו כֻּלָּ֥/ם יִכְלָיֽוּ/ן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/003.yaml
  text: Egypt is man and not God[a], and their horses are flesh and not spirit. When Yahweh stretches out his hand, the helper will stumble and the one helped will fall[c][b], and together all of them will come to an end.
translation:
  language: pt
  text: O Egito é humano, e não Deus; seus cavalos são carne, e não espírito.[a] Quando Yahweh estender a mão, quem ajuda tropeçará, e quem recebe ajuda cairá; todos juntos chegarão ao fim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Espírito” também pode ser entendido aqui, de modo mais amplo, como sopro, força vital ou poder imaterial; o termo não precisa ser uma referência direta ao Espírito Santo.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “todos juntos perecerão” ou “serão consumidos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְרַיִם
  choice: o Egito
  rationale: Nome convencional da nação em português; embora coletivo, funciona como sujeito singular.
- source_word: אָדָם
  choice: humano
  rationale: Expressa de modo natural que o Egito pertence à esfera humana e criatural, em contraste direto com Deus, sem fazer do sexo masculino o foco.
- source_word: אֵל
  choice: Deus
  rationale: No contraste com a condição humana do Egito, refere-se à divindade verdadeira.
- source_word: סוּסֵיהֶם
  choice: seus cavalos
  rationale: Tradução direta do substantivo com sufixo possessivo, referindo-se aos cavalos dos egípcios.
- source_word: בָּשָׂר
  choice: carne
  rationale: Preserva a imagem concreta e o contraste hebraico com רוּחַ, sugerindo fragilidade criatural sem explicitá-la além do texto.
- source_word: רוּחַ
  choice: espírito
  rationale: Mantém a amplitude semântica e o contraste com 'carne'; a minúscula evita impor uma referência específica ao Espírito Santo.
- source_word: יהוה
  choice: Yahweh
  rationale: Representa o nome divino pessoal no texto hebraico, em consonância com a camada inglesa fornecida.
- source_word: יַטֶּה יָדוֹ
  choice: estender a mão
  rationale: Expressão portuguesa natural para o gesto de intervenção decisiva; o futuro acompanha a sequência verbal profética.
- source_word: עוֹזֵר
  choice: quem ajuda
  rationale: Traduz naturalmente o particípio substantivado ativo e mantém o contraste de papéis.
- source_word: עָזֻר
  choice: quem recebe ajuda
  rationale: Torna clara a força passiva do particípio e evita a construção pouco natural 'o ajudado'.
- source_word: כָשַׁל
  choice: tropeçará
  rationale: Preserva a metáfora concreta do início do colapso.
- source_word: נָפַל
  choice: cairá
  rationale: Tradução direta que forma um paralelo natural com 'tropeçará'.
- source_word: יִכְלָיוּן
  choice: chegarão ao fim
  rationale: Comunica a extinção conjunta sem escolher de modo excessivamente específico entre perecer, acabar e ser consumido.
theological_decisions:
- issue: Se רוּחַ designa especificamente o Espírito Santo ou, de modo mais amplo, espírito, sopro ou poder imaterial
  choice: espírito
  alternative: Espírito; sopro
  rationale: O contraste imediato é entre a materialidade criatural dos cavalos e um poder não carnal. A minúscula preserva essa amplitude e não introduz uma identificação pneumatológica que o hebraico não exige.
- issue: Como expressar אָדָם no contraste entre o Egito e Deus
  choice: humano
  alternative: homem; humanidade
  rationale: '''Humano'' funciona como predicativo singular em português e focaliza a condição criatural do Egito, sem perder o contraste retórico com Deus.'
- issue: Relação entre quem ajuda e quem recebe ajuda
  choice: manter os dois papéis sem identificar seus referentes no corpo do versículo
  alternative: explicitar Egito e Judá
  rationale: O texto hebraico emprega particípios correlatos e deixa a identificação contextual implícita; a tradução conserva essa forma e evita acrescentar uma interpretação histórica ao versículo.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A formulação mantém o paralelismo conciso do hebraico, usa 'humano' de forma predicativa natural e conserva 'carne/espírito' para não enfraquecer a tensão poética e teológica.
