language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/גַם ה֤וּא חָכָם֙ וַ/יָּ֣בֵא רָ֔ע וְ/אֶת דְּבָרָ֖י/ו לֹ֣א הֵסִ֑יר וְ/קָם֙ עַל בֵּ֣ית מְרֵעִ֔ים וְ/עַל עֶזְרַ֖ת פֹּ֥עֲלֵי אָֽוֶן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/002.yaml
  text: Yet he too is wise and brings disaster[a]; he does not take back his words[c][b], but rises against the house of evildoers and against the help of workers of iniquity.
translation:
  language: pt
  text: Contudo, ele também é sábio e traz calamidade[a]; não retira suas palavras[b], mas se levanta contra a casa dos malfeitores e contra o auxílio dos que praticam a iniquidade[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desastre”. O hebraico também pode ser traduzido literalmente por “mal”, mas aqui se refere à calamidade trazida como juízo, não ao mal moral.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não revoga o que disse”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “contra a assistência dos que praticam a iniquidade”. O hebraico usa um substantivo abstrato, “auxílio”, e não o substantivo pessoal “auxiliadores”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם הוּא
  choice: Contudo, ele também
  rationale: Preserva a combinação aditiva e contrastiva, bem como a ênfase do pronome explícito, contrapondo a verdadeira sabedoria do SENHOR aos cálculos humanos do contexto.
- source_word: חָכָם
  choice: sábio
  rationale: Equivalente direto e natural; mantém a força irônica e judicial do contexto.
- source_word: וַיָּבֵא רָע
  choice: traz calamidade
  rationale: Neste contexto profético, רָע designa desgraça ou calamidade judicial, não mal moral; o presente também reproduz bem a sequência verbal do discurso.
- source_word: דְּבָרָיו לֹא הֵסִיר
  choice: não retira suas palavras
  rationale: Mantém o plural hebraico e a imagem de não remover ou revogar aquilo que foi declarado.
- source_word: וְקָם עַל
  choice: mas se levanta contra
  rationale: A construção expressa ação hostil contra alguém; 'mas' explicita naturalmente a progressão adversativa no português.
- source_word: בֵּית מְרֵעִים
  choice: a casa dos malfeitores
  rationale: Conserva o substantivo coletivo e a construção hebraica, sem decidir indevidamente entre casa, grupo, dinastia ou comunidade política.
- source_word: עֶזְרַת
  choice: o auxílio
  rationale: Preserva o substantivo abstrato hebraico, evitando transformá-lo no substantivo pessoal 'auxiliadores'.
- source_word: פֹּעֲלֵי אָוֶן
  choice: os que praticam a iniquidade
  rationale: Expressão corrente e digna em português que conserva a ideia habitual de pessoas que produzem ou praticam perversidade.
theological_decisions:
- issue: Sentido de רָע quando atribuído à ação divina
  choice: calamidade
  alternative: mal; desastre
  rationale: O contexto trata do juízo que Deus traz, não da prática de mal moral. 'Calamidade' preserva a causalidade divina e o caráter judicial sem criar uma ambiguidade moral estranha ao contexto.
- issue: Referente de הוּא ('ele')
  choice: manter o pronome 'ele'
  alternative: explicitar 'o SENHOR'
  rationale: O contexto identifica o SENHOR como referente, mas o hebraico emprega um pronome enfático. Mantê-lo preserva a forma e a comparação implícita sem acrescentar o nome divino ao versículo.
- issue: Identidade da 'casa dos malfeitores' e do 'auxílio'
  choice: preservar as expressões coletivas e abstratas
  alternative: identificá-las explicitamente com Judá e o apoio egípcio
  rationale: O contexto favorece essas identificações, mas o versículo emprega formulações retóricas mais amplas; a tradução não deve restringi-las além do texto.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. 'Contudo' comunica o contraste irônico sem coloquialismo; 'calamidade', 'auxílio' e 'iniquidade' mantêm dignidade profética, enquanto 'os que praticam' evita a rigidez de 'obreiros da iniquidade'. Todos os marcadores de nota aparecem no texto.
