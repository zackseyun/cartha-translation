source:
  edition: WLC
  text: כְּ/צִפֳּרִ֣ים עָפ֔וֹת כֵּ֗ן יָגֵ֛ן יְהוָ֥ה צְבָא֖וֹת עַל יְרֽוּשָׁלִָ֑ם גָּנ֥וֹן וְ/הִצִּ֖יל פָּסֹ֥חַ וְ/הִמְלִֽיט־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/005.yaml
  text: Like birds hovering[a], so Yahweh of Armies will shield Jerusalem—shielding and delivering, passing over and rescuing.
translation:
  language: pt
  text: Como aves que pairam, assim Javé dos Exércitos defenderá Jerusalém — defendendo-a e livrando-a, passando por cima dela[a] e pondo-a a salvo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “poupando-a” ou “protegendo-a”. O verbo hebraico também evoca a linguagem da Páscoa em Êxodo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/צִפֳּרִים עָפוֹת
  choice: Como aves que pairam
  rationale: O substantivo indica aves em geral, e o particípio de עוּף significa literalmente que voam. “Pairam” conserva a imagem espacial de aves sobre algo e comunica, no contexto, sua ação protetora sem explicitar ninho ou filhotes, elementos não declarados no hebraico.
- source_word: יָגֵן ... גָּנוֹן
  choice: defenderá ... defendendo-a
  rationale: As duas formas da raiz גנן reiteram a ação de cobrir, proteger ou defender. “Defender” é natural em português, mantém a força concreta da proteção contra uma ameaça e permite preservar a repetição retórica do hebraico.
- source_word: יְהוָה
  choice: Javé
  rationale: “Javé” é a forma portuguesa corrente do nome divino representado pelo Tetragrama, em vez de sua substituição por um título como “SENHOR”.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: O termo designa exércitos ou hostes. “Dos Exércitos” é transparente em português moderno e conserva suas associações militares e celestes.
- source_word: וְ/הִצִּיל
  choice: e livrando-a
  rationale: A forma de נצל expressa livramento ou resgate. O gerúndio acompanha a estrutura compacta e enfática da sequência hebraica.
- source_word: פָּסֹחַ
  choice: passando por cima dela
  rationale: A tradução mantém o sentido espacial mais transparente e preserva a possível evocação da Páscoa. Como o verbo também pode comunicar a ideia de poupar ou proteger, essa ambiguidade é registrada em nota.
- source_word: וְ/הִמְלִיט
  choice: e pondo-a a salvo
  rationale: A raiz מלט comunica fazer escapar, resgatar ou levar à segurança. “Pondo-a a salvo” é natural e mantém alguma distinção lexical em relação ao verbo anterior, traduzido por “livrando”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Javé
  alternative: SENHOR; Yahweh; Jeová
  rationale: O texto emprega diretamente o nome divino. “Javé” preserva-o como nome próprio numa forma corrente e legível em português, sem substituí-lo por um título.
- issue: Sentido de פָּסֹחַ e sua possível associação com a Páscoa
  choice: passando por cima dela
  alternative: poupando-a; protegendo-a
  rationale: A formulação principal conserva a imagem verbal e a possível alusão à Páscoa, enquanto a nota registra os sentidos protetores plausíveis sem eliminar a ambiguidade do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O travessão preserva a sequência enfática dos verbos hebraicos; os pronomes retomam Jerusalém com clareza. A repetição “defenderá — defendendo-a” é deliberada e reproduz a ênfase da raiz גנן.
