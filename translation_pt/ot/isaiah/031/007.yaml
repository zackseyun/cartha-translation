base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/007.yaml
  text: For on that day each man will reject his idols of silver and his idols of gold, which your hands have made for you as sin.
translation:
  language: pt
  text: Pois, naquele dia, cada um rejeitará seus ídolos de prata e seus ídolos de ouro, que as mãos de vocês fizeram para vocês como pecado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “que as mãos de vocês fizeram para vocês — pecado”. A expressão final é condensada; também pode ser entendida como “fizeram para o pecado” ou, conforme outra relação sintática, “fizeram em pecado”.'
    reason: Restitui “para vocês” e sinaliza a construção abrupta de חֵטְא, sem impor uma única análise sintática.
lexical_decisions:
- source_word: יִמְאָסוּן
  choice: rejeitará
  rationale: O verbo מָאַס comunica rejeição ou repúdio; o singular distributivo “cada um” reproduz אִישׁ com naturalidade em português.
- source_word: אֱלִילֵי כַסְפּוֹ וֶאֱלִילֵי זְהָבוֹ
  choice: seus ídolos de prata e seus ídolos de ouro
  rationale: Mantém a repetição enfática do hebraico e a referência distributiva aos ídolos pertencentes a cada pessoa.
- source_word: אֲשֶׁר עָשׂוּ לָכֶם יְדֵיכֶם
  choice: que as próprias mãos de vocês fizeram
  rationale: Conserva a imagem concreta das mãos como agentes da fabricação e traduz לָכֶם de modo natural, sem a redundância pouco idiomática “fizeram para vocês”.
- source_word: חֵטְא
  choice: pecando
  rationale: O substantivo final é sintaticamente abrupto e pode indicar que a fabricação foi pecado; a forma adverbial expressa essa relação sem transformar “pecado” em objeto fabricado.
theological_decisions:
- issue: Relação de חֵטְא com a fabricação dos ídolos
  choice: “fizeram, pecando”
  alternative: “fizeram para o pecado” / “fizeram como pecado”
  rationale: A construção hebraica é condensada e ambígua. A tradução principal comunica que fabricar os ídolos constituiu pecado, enquanto a nota registra a formulação literal e outras relações sintáticas possíveis.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para o plural לָכֶם/יְדֵיכֶם. A repetição “seus ídolos” foi mantida por sua força retórica.
