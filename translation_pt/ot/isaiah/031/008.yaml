base_translation:
  language: en
  yaml_path: translation/ot/isaiah/031/008.yaml
  text: And Assyria will fall by a sword not of man[a], and a sword not of humankind will devour him; and he will flee from before the sword[d][c][b], and his young men will become forced labor.
translation:
  language: pt
  text: A Assíria cairá por uma espada, não de homem; uma espada, não de ser humano, a devorará[a][b]. Ela fugirá da espada, e seus jovens[c] serão submetidos a trabalhos forçados[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico emprega em paralelo duas palavras diferentes: אִישׁ (“homem”) e אָדָם (“ser humano; humanidade”).'
    reason: lexical_alternative
  - marker: b
    text: Isto é, uma espada não manejada por poder humano; o texto não especifica o meio exato do juízo do SENHOR.
    reason: alternative_reading
  - marker: c
    text: Ou “seus homens escolhidos”. O termo hebraico pode indicar jovens no vigor da idade, muitas vezes em contexto militar.
    reason: lexical_alternative
  - marker: d
    text: Ou “serão sujeitos a trabalho compulsório como tributo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָפַל
  choice: cairá
  rationale: O perfeito hebraico com conjunção, em discurso profético, tem aqui sentido preditivo; o futuro simples comunica isso naturalmente em português.
- source_word: אַשּׁוּר
  choice: a Assíria
  rationale: O nome designa coletivamente a potência assíria; esta é a forma consagrada em português.
- source_word: בְּחֶרֶב
  choice: por uma espada
  rationale: A preposição בְּ indica o instrumento da queda. “Por” preserva esse valor instrumental.
- source_word: לֹא אִישׁ
  choice: que não é de homem
  rationale: A formulação conserva a concisão e a estranheza expressiva do hebraico, que nega a natureza ou agência humana da espada.
- source_word: וְחֶרֶב לֹא אָדָם
  choice: e uma espada que não é humana
  rationale: A variação entre “de homem” e “humana” procura refletir o paralelismo com os dois termos hebraicos distintos, אִישׁ e אָדָם, sem tornar a frase obscura.
- source_word: תֹּאכֲלֶנּוּ
  choice: a devorará
  rationale: O verbo feminino concorda com “espada”, e o sufixo retoma a Assíria. “Devorar” mantém a imagem vívida do hebraico; o pronome feminino segue o gênero de “Assíria” em português.
- source_word: וְנָס לוֹ מִפְּנֵי חֶרֶב
  choice: Ela fugirá diante da espada
  rationale: A Assíria continua como sujeito coletivo. “Diante da espada” reproduz de modo natural o idioma hebraico מִפְּנֵי חֶרֶב.
- source_word: בַחוּרָיו
  choice: seus jovens
  rationale: בָּחוּר designa normalmente jovens no vigor da idade, com possível conotação militar no contexto, mas “jovens” evita explicitar além do texto.
- source_word: לָמַס
  choice: a trabalhos forçados
  rationale: מַס pode indicar trabalho compulsório ou prestação laboral imposta por um conquistador. “Trabalhos forçados” é claro e conserva a coerção.
- source_word: יִהְיוּ
  choice: serão submetidos
  rationale: A expressão comunica o estado resultante de sujeição e se combina naturalmente, em português, com “trabalhos forçados”.
theological_decisions:
- issue: Natureza da espada que derrota a Assíria
  choice: uma espada cuja natureza ou agência não é humana
  alternative: uma espada literal sem guerreiro humano, ou uma metáfora de intervenção divina, como praga ou juízo angelical
  rationale: O hebraico nega duas vezes a participação humana, mas não identifica o meio exato do juízo. A tradução mantém essa indeterminação em vez de escolher um mecanismo específico.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A repetição de “espada” e o paralelismo foram preservados por sua força retórica. Os pronomes femininos decorrem do gênero de “Assíria” em português, embora o referente hebraico prossiga em construção coletiva singular.
