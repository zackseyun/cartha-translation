base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/011.yaml
  text: 'Ask for yourself a sign from Yahweh your God: make it as deep as Sheol or as high as heaven[a].'
translation:
  language: pt
  text: Peça para você um sinal da parte de Javé, seu Deus; peça-o tão profundo quanto quiser ou tão alto quanto quiser.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, aproximadamente: «faça-o profundo; peça [ou faça-o] alto, para cima». A construção é elíptica e incomum. Ela contrasta a profundidade extrema com a altura extrema; «Sheol» e «céu» são interpretações tradicionais, não termos explicitamente presentes nesta formulação.'
    reason: A nota preserva a dificuldade sintática e o contraste de extremos, sem introduzir como texto explícito referentes que o hebraico não nomeia de modo inequívoco.
lexical_decisions:
- source_word: שְׁאַל לְךָ
  choice: Peça para você
  rationale: O imperativo masculino singular dirige a ordem a Acaz, e o dativo לְךָ acrescenta ênfase pessoal. A formulação conserva essa nuance sem recorrer ao pouco natural «pede para ti mesmo».
- source_word: אוֹת
  choice: um sinal
  rationale: No contexto profético, אוֹת designa um sinal confirmatório concedido por Deus; «sinal» é claro e corrente.
- source_word: מֵעִם יְהוָה אֱלֹהֶיךָ
  choice: da parte de Javé, seu Deus
  rationale: מֵעִם marca a origem do sinal junto a Deus. «Da parte de» comunica essa relação naturalmente. «Javé» é a forma portuguesa corrente do nome divino יהוה, preservando-o como nome próprio em vez de substituí-lo por um título.
- source_word: הַעְמֵק שְׁאָלָה
  choice: peça-o nas maiores profundezas
  rationale: A construção combina a ideia de pedir com a de aprofundar. Em vez de introduzir «Sheol», que não está explicitamente escrito segundo a vocalização massorética, a tradução expressa idiomaticamente a liberdade de pedir um sinal nas profundezas extremas.
- source_word: הַגְבֵּהַּ לְמָעְלָה
  choice: ou nas maiores alturas
  rationale: O imperativo causativo de גבה e o advérbio למעלה formam o paralelo elevado de «profundezas». «Nas maiores alturas» transmite o extremo superior sem acrescentar o substantivo «céu», ausente do hebraico.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Javé
  alternative: SENHOR
  rationale: O texto emprega diretamente o nome da aliança. A forma «Javé» o preserva como nome próprio e é reconhecível para leitores de português.
- issue: Interpretação do contraste entre profundidade e altura
  choice: nas maiores profundezas ou nas maiores alturas
  alternative: tão profundo quanto o Sheol ou tão alto quanto o céu
  rationale: A vocalização massorética favorece relacionar שְׁאָלָה ao verbo «pedir», não ao substantivo שְׁאוֹל («Sheol»). O par profundezas–alturas mantém o merismo e a amplitude ilimitada da oferta divina sem tornar explícitos referentes que o hebraico deixa implícitos.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A repetição de «peça» mantém a força do imperativo hebraico. Evitou-se «tu» para maior abrangência, usando «você/seu» de modo coerente.
