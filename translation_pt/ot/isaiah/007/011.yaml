  terminology: «Javé» é uma forma portuguesa reconhecível para o tetragrama e «sinal» traduz adequadamente אוֹת. A nota deve evitar apresentar como literal uma paráfrase que inclui «o pedido» e deve indicar que o hebraico fala de aprofundar ou elevar, sem nomear explicitamente céu.
