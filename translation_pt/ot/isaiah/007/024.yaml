base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/024.yaml
  text: One will come there with arrows and with a bow[b][a], because all the land will become briers and thorns.
translation:
  language: pt
  text: Ali se irá com flechas e arco, pois toda a terra se tornará sarças e espinheiros.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «pois toda a terra será sarças e espinheiros».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחִצִּים וּבַקֶּשֶׁת
  choice: com flechas e arco
  rationale: O ב instrumental indica que a pessoa vai equipada com essas armas. Em português, a formulação sem artigos é natural e preserva a imagem de caça ou proteção numa terra tomada por vegetação espinhosa.
- source_word: יָבוֹא
  choice: se chegará
  rationale: A construção impessoal com «se» representa naturalmente o singular hebraico usado em sentido genérico, sem introduzir um referente masculino específico nem transformar explicitamente o verbo em plural.
- source_word: שָׁמָּה
  choice: Ali
  rationale: Traduz de modo conciso o advérbio de lugar e, em posição inicial, produz uma frase natural em português.
- source_word: כִּי
  choice: porque
  rationale: Introduz a razão de se ir armado ao lugar descrito.
- source_word: שָׁמִיר וָשַׁיִת
  choice: espinheiros e espinhos
  rationale: Mantém a ordem e o paralelismo do par hebraico, que evoca vegetação espinhosa, abandono e desolação.
- source_word: תִּהְיֶה
  choice: se tornará
  rationale: Embora o verbo possa significar simplesmente «será», «se tornará» comunica no contexto a passagem da terra cultivada ao estado de abandono.
- source_word: כָל הָאָרֶץ
  choice: toda a terra
  rationale: Preserva a abrangência da expressão dentro da região em foco, sem sugerir necessariamente o planeta inteiro.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção impessoal «se chegará» preserva o singular genérico do hebraico; «terra» mantém o alcance contextual da região sob juízo.
