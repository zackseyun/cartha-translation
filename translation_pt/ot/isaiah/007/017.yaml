source:
  edition: WLC
  text: יָבִ֨יא יְהוָ֜ה עָלֶ֗י/ךָ וְ/עַֽל עַמְּ/ךָ֮ וְ/עַל בֵּ֣ית אָבִי/ךָ֒ יָמִים֙ אֲשֶׁ֣ר לֹא בָ֔אוּ לְ/מִ/יּ֥וֹם סוּר אֶפְרַ֖יִם מֵ/עַ֣ל יְהוּדָ֑ה אֵ֖ת מֶ֥לֶךְ אַשּֽׁוּר־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/017.yaml
  text: Yahweh will bring upon you[a], upon your people[b], and upon your father's house days unlike any that have not come since the day Ephraim turned away from Judah—namely, the king of Assyria.
translation:
  language: pt
  text: Yahweh fará vir sobre você, sobre o seu povo e sobre a casa de seu pai[a] dias como nunca houve desde o dia em que Efraim se separou de Judá[b] — a saber, o rei da Assíria.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Casa de seu pai” pode indicar mais especificamente sua linhagem ancestral ou sua casa real.
    reason: cultural_note
  - marker: b
    text: 'Ou: “Efraim se afastou de Judá”. A referência é à separação do reino do norte.'
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico termina de modo abrupto com “o rei da Assíria”; também pode ser entendido: “fará vir [...] o rei da Assíria”.'
    reason: textual_or_syntactic_note
lexical_decisions:
- source_word: יָבִיא
  choice: fará vir
  rationale: O hifil de בוא tem sentido causativo, “fazer vir” ou “trazer”. “Fará vir” conserva essa força e permite que o objeto final, “o rei da Assíria”, permaneça ligado ao mesmo verbo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do hebraico, em vez de substituí-lo por um título.
- source_word: עָלֶיךָ ... וְעַל עַמְּךָ ... וְעַל בֵּית אָבִיךָ
  choice: sobre você, sobre o seu povo e sobre a casa de seu pai
  rationale: A repetição de “sobre” reproduz a cadência solene e o alcance tríplice do anúncio. “Casa de seu pai” mantém o idioma familiar e dinástico sem restringi-lo no texto principal.
- source_word: יָמִים אֲשֶׁר לֹא בָאוּ
  choice: dias como nunca houve
  rationale: Expressa em português natural que esses dias não tinham precedente. Evita a formulação pouco idiomática “dias que não vieram”, sem eliminar a negação hebraica.
- source_word: לְמִיּוֹם סוּר אֶפְרַיִם מֵעַל יְהוּדָה
  choice: desde o dia em que Efraim se separou de Judá
  rationale: סור pode significar afastar-se, retirar-se ou desviar-se. No contexto histórico, “se separou” comunica a ruptura política sem acrescentar pormenores não expressos no versículo.
- source_word: אֵת מֶלֶךְ אַשּׁוּר
  choice: a saber, o rei da Assíria
  rationale: O sintagma final especifica de forma abrupta o agente ou conteúdo concreto da calamidade anunciada. “A saber” torna a relação inteligível em português, enquanto uma nota registra a construção hebraica e sua possível tradução mais direta.
theological_decisions:
- issue: Alcance do juízo anunciado a Acaz
  choice: A calamidade atingirá pessoalmente Acaz, seu povo e sua casa ancestral ou real.
  alternative: Entender “casa de seu pai” apenas como referência genérica à família de Acaz.
  rationale: O contexto real permite uma dimensão dinástica, mas o texto não obriga a reduzir a expressão somente à dinastia; por isso, o idioma hebraico é preservado.
- issue: Relação entre “os dias” e “o rei da Assíria”
  choice: “O rei da Assíria” especifica a forma concreta pela qual chegarão os dias sem precedente.
  alternative: 'Ler “o rei da Assíria” como um segundo objeto abrupto do verbo: “fará vir [...] o rei da Assíria”.'
  rationale: A construção hebraica é condensada e abrupta. O texto principal adota a leitura apositiva mais coerente no contexto, enquanto a nota conserva a alternativa sintática sem impor uma interpretação teológica adicional.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. Emprega “você” para o singular dirigido a Acaz e preserva a repetição retórica de “sobre”. A formulação “dias como nunca houve” comunica o hebraico idiomaticamente sem reproduzir uma construção artificial.
