  text: וַ/יּ֣וֹסֶף יְהוָ֔ה דַּבֵּ֥ר אֶל אָחָ֖ז לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/010.yaml
  text: And Yahweh continued to speak to Ahaz[a], saying,
translation:
  language: pt
  text: 'Yahweh voltou[a] a falar a Acaz, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «Yahweh acrescentou falar a Acaz»; expressão idiomática que pode significar que Yahweh tornou a falar ou continuou falando com ele.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסֶף
  choice: voltou a
  rationale: A construção idiomática יָסַף + infinitivo indica repetição ou continuação. No contexto, «voltou a falar» expressa naturalmente que Yahweh falou novamente a Acaz, sem reproduzir de modo artificial o hebraísmo «acrescentou falar».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, preservando seu caráter de nome próprio em vez de substituí-lo por um título.
- source_word: דַּבֵּר
  choice: falar
  rationale: O infinitivo ligado a וַיּוֹסֶף integra a expressão idiomática «voltou a falar».
- source_word: אֶל
  choice: a
  rationale: Marca a pessoa a quem a fala é dirigida; «falar a Acaz» é claro e adequado ao registro narrativo.
- source_word: אָחָז
  choice: Acaz
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém o marcador narrativo hebraico que introduz o conteúdo da fala, o qual aparece no versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o tetragrama. «Yahweh» preserva o nome próprio e evita substituí-lo silenciosamente por um título.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Voltou a falar» favorece aqui a ideia contextual de fala renovada; a nota preserva a possibilidade semântica de continuação. O dois-pontos após «dizendo» sinaliza que o conteúdo da fala vem no versículo seguinte.
