  yaml_path: translation/ot/isaiah/007/022.yaml
  text: And it will happen that because of the abundance of milk he gives[a], he will eat curds; for everyone left in the midst of the land will eat curds and honey.
translation:
  language: pt
  text: E acontecerá que, por causa da grande produção de leite, ele comerá coalhada[a]; pois todo aquele que restar no meio da terra comerá coalhada e mel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “manteiga”. Nas duas ocorrências, o hebraico חֶמְאָה pode designar mais amplamente produtos de leite coalhado ou espessado, e não necessariamente a manteiga moderna.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: E acontecerá
  rationale: Traduz naturalmente a fórmula hebraica prospectiva, preservando seu sentido futuro.
- source_word: מֵרֹב
  choice: por causa da abundância
  rationale: Expressa com clareza o valor causal ou de origem da preposição ligada a “abundância”.
- source_word: עֲשׂוֹת חָלָב
  choice: do leite que ela produzir
  rationale: O infinitivo de עשה com “leite” indica produção. O feminino “ela” recupera o antecedente “novilha” do versículo 21, evitando atribuir a produção de leite ao homem que a cria.
- source_word: יֹאכַל חֶמְאָה
  choice: ele comerá coalhada
  rationale: חֶמְאָה designa um produto de leite coalhado ou espessado; “coalhada” é natural em português e evita a associação exclusiva com a manteiga moderna.
- source_word: כִּי
  choice: pois
  rationale: Mantém a força explicativa da oração que amplia a situação para todos os sobreviventes.
- source_word: חֶמְאָה וּדְבַשׁ
  choice: coalhada e mel
  rationale: Preserva a expressão paralela e traduz חֶמְאָה de modo coerente em suas duas ocorrências.
- source_word: כָּל הַנּוֹתָר
  choice: todo aquele que restar
  rationale: Representa o particípio substantivado como referência coletiva aos sobreviventes, em linguagem atual e digna.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: no meio da terra
  rationale: Preserva a nuance espacial de בקרב, em vez de reduzi-la ao simples “na terra”.
