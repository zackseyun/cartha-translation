  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֠י בְּ/טֶ֨רֶם יֵדַ֥ע הַ/נַּ֛עַר מָאֹ֥ס בָּ/רָ֖ע וּ/בָחֹ֣ר בַּ/טּ֑וֹב תֵּעָזֵ֤ב הָ/אֲדָמָה֙ אֲשֶׁ֣ר אַתָּ֣ה קָ֔ץ מִ/פְּנֵ֖י שְׁנֵ֥י מְלָכֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/016.yaml
  text: For before the boy knows to refuse the evil and choose the good[b][a], the land before whose two kings you dread will be forsaken.
translation:
  language: pt
  text: Pois, antes que o menino saiba rejeitar o mal e escolher o bem, a terra diante de cujos dois reis você sente pavor[b] será abandonada[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “será deixada” ou “ficará deserta”. A forma passiva hebraica pode indicar que a terra será deixada vazia ou abandonada.
    reason: lexical_alternative
  - marker: b
    text: Ou “você abomina por causa do medo” / “diante de cujos dois reis você está tomado de pavor”. O verbo hebraico pode expressar repulsa; neste contexto, provavelmente se trata de repulsa associada ao medo dos dois reis.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: antes que
  rationale: Introduz naturalmente, em português, o limite temporal anterior ao desenvolvimento do discernimento do menino.
- source_word: הַנַּעַר
  choice: o menino
  rationale: O substantivo pode designar uma criança ou um jovem; o contexto de discernimento ainda não adquirido favorece “menino”, preservando também o masculino singular.
- source_word: יֵדַע ... מָאֹס ... וּבָחֹר
  choice: saiba rejeitar ... e escolher
  rationale: Expressa a capacidade ou o discernimento ainda não alcançado, mantendo de modo natural a sequência verbal hebraica.
- source_word: מָאֹס
  choice: rejeitar
  rationale: No paralelismo moral com “escolher”, comunica melhor a recusa do mal do que uma tradução emocional como “desprezar”.
- source_word: בָּרָע ... בַּטּוֹב
  choice: o mal ... o bem
  rationale: Preserva os artigos e o contraste moral definido e idiomático em português.
- source_word: תֵּעָזֵב
  choice: será abandonada
  rationale: Mantém a voz passiva do nifal e permite tanto a ideia de abandono quanto a de desolação, sem especificar um agente.
- source_word: הָאֲדָמָה
  choice: a terra
  rationale: O contexto político e territorial favorece “terra”, e não “solo” ou “chão”.
- source_word: אֲשֶׁר אַתָּה קָץ מִפְּנֵי
  choice: diante de cujos ... você sente pavor
  rationale: Conserva a força relacional de מִפְּנֵי e traduz קוץ, neste contexto de ameaça, como uma reação de pavor ou repulsa temerosa.
- source_word: שְׁנֵי מְלָכֶיהָ
  choice: cujos dois reis
  rationale: O sufixo feminino retoma “a terra”; a construção com “cujos” transmite essa relação de modo claro em português.
theological_decisions:
- issue: Identidade e função de “o menino” no contexto
  choice: Manter a referência neutra como “o menino”, sem identificar quem ele é.
  alternative: Identificá-lo explicitamente como um filho-sinal histórico, como Emanuel em sentido messiânico, ou como outra figura específica.
  rationale: O versículo usa apenas o substantivo comum הַנַּעַר e não resolve por si só as interpretações históricas, tipológicas ou messiânicas. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da oração principal foi mantida próxima ao hebraico, e “diante de cujos dois reis” conserva a relação expressa por מִפְּנֵי sem tornar a frase excessivamente literal.
