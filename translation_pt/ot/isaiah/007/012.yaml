  text: וַ/יֹּ֖אמֶר אָחָ֑ז לֹא אֶשְׁאַ֥ל וְ/לֹֽא אֲנַסֶּ֖ה אֶת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/012.yaml
  text: But Ahaz said[a], “I will not ask[b], and I will not test Yahweh.”
translation:
  language: pt
  text: 'Mas Acaz disse: “Não pedirei e não porei Yahweh à prova.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mas ... disse
  rationale: 'O wayyiqtol dá continuidade à narrativa, enquanto “mas” expressa naturalmente o contraste contextual: Acaz recusa o convite feito no versículo anterior.'
- source_word: אָחָז
  choice: Acaz
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: לֹא אֶשְׁאַל
  choice: Não pedirei
  rationale: שׁאל significa pedir ou solicitar; no contexto, refere-se ao sinal que Acaz foi convidado a pedir.
- source_word: וְלֹא אֲנַסֶּה
  choice: e não porei ... à prova
  rationale: O piel de נסה significa testar ou pôr à prova. A locução é clara e idiomática em português e evita a ideia de induzir alguém ao mal que “tentar” poderia comunicar.
- source_word: אֶת יְהוָה
  choice: Yahweh
  rationale: O marcador de objeto direto אֶת não é traduzido; o nome divino יהוה é transliterado como Yahweh, preservando seu caráter de nome próprio.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome próprio sem substituí-lo por um título.
- issue: Sentido de אֲנַסֶּה em relação a Deus
  choice: porei ... à prova
  alternative: testarei; tentarei
  rationale: A expressão preserva o sentido de submeter Deus a uma prova, sem sugerir a acepção moderna comum de “tentar” como induzir ao mal.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A ordem e a coordenação do hebraico foram preservadas de modo natural; não foram necessárias notas de rodapé.
