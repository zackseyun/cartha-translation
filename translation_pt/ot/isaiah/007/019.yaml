base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/019.yaml
  text: And they will all come and settle in the steep ravines[a], in the clefts of the rocks, in all the thornbushes[c][b], and in all the watering places.
translation:
  language: pt
  text: Todos eles virão e pousarão[a] nas ravinas íngremes[b], nas fendas das rochas, em todos os espinheiros e em todos os lugares de água[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “repousarão”; o verbo pode indicar repousar ou pousar.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica é difícil; também tem sido entendida como “vales desolados” ou “ravinas dos precipícios”.
    reason: lexical_alternative
  - marker: c
    text: O termo hebraico é raro e incerto; também pode significar “pastagens” ou “prados”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ
  choice: virão
  rationale: O perfeito com conjunção integra a sequência profética e tem sentido futuro neste contexto; בוא significa simplesmente “vir”.
- source_word: וְנָחוּ
  choice: pousarão
  rationale: נוח indica chegar ao repouso ou pousar. Como o contexto anterior fala de moscas e abelhas convocadas, “pousarão” conserva de modo natural a imagem dos enxames.
- source_word: כֻלָּם
  choice: Todos eles
  rationale: Preserva explicitamente a totalidade expressa pelo hebraico, referindo-se ao conjunto dos enxames ou invasores mencionados antes.
- source_word: בְּנַחֲלֵי הַבַּתּוֹת
  choice: nas ravinas íngremes
  rationale: נַחֲלֵי designa vales, leitos de torrentes ou ravinas; הַבַּתּוֹת é uma expressão difícil. “Ravinas íngremes” comunica terreno recortado e escarpado sem recorrer à tradução literal improvável.
- source_word: וּבִנְקִיקֵי הַסְּלָעִים
  choice: nas fendas das rochas
  rationale: נְקִיקִים são fendas ou fissuras, e סְלָעִים são rochas ou penhascos. A formulação é concreta, clara e fiel.
- source_word: וּבְכֹל הַנַּעֲצוּצִים
  choice: em todos os espinheiros
  rationale: O substantivo indica vegetação espinhosa. “Espinheiros” é corrente em português e se ajusta aos locais onde os enxames pousam.
- source_word: וּבְכֹל הַנַּהֲלֹלִים
  choice: em todos os bebedouros
  rationale: O termo é raro e de sentido incerto. “Bebedouros” expressa a interpretação de lugares onde os animais encontram água, enquanto a nota preserva outras possibilidades.
