reference: Isaiah 7:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י רֹ֤אשׁ אֲרָם֙ דַּמֶּ֔שֶׂק וְ/רֹ֥אשׁ דַּמֶּ֖שֶׂק רְצִ֑ין וּ/בְ/ע֗וֹד שִׁשִּׁ֤ים וְ/חָמֵשׁ֙ שָׁנָ֔ה יֵחַ֥ת אֶפְרַ֖יִם מֵ/עָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/008.yaml
  text: For the head of Aram is Damascus[a], and the head of Damascus is Rezin; and within sixty-five years Ephraim will be shattered from being a people.
translation:
  language: pt
  text: Pois a cabeça de Arã é Damasco, e a cabeça de Damasco é Rezim. Dentro de sessenta e cinco anos, Efraim será destroçado e deixará de ser um povo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Efraim será destroçado, de modo que já não será um povo.”'
    reason: A construção hebraica מֵעָם pode destacar tanto a perda da condição nacional quanto o resultado do ato de destroçar.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da advertência anterior e preserva a ligação lógica com o contexto.
- source_word: רֹאשׁ
  choice: cabeça
  rationale: Mantém a metáfora e o paralelismo entre a cidade principal de Arã e o governante de Damasco, sem reduzir o termo a “capital”.
- source_word: אֲרָם
  choice: Arã
  rationale: Emprega a forma portuguesa tradicional do nome hebraico e evita a identificação anacrônica direta com a Síria moderna.
- source_word: דַּמֶּשֶׂק
  choice: Damasco
  rationale: Forma portuguesa corrente do topônimo.
- source_word: רְצִין
  choice: Rezim
  rationale: Forma portuguesa corrente do nome pessoal hebraico.
- source_word: וּבְעוֹד
  choice: Dentro de
  rationale: Expressa de maneira natural o período ainda restante até o acontecimento anunciado.
- source_word: שִׁשִּׁים וְחָמֵשׁ שָׁנָה
  choice: sessenta e cinco anos
  rationale: Forma numérica natural no português contemporâneo.
- source_word: יֵחַת
  choice: será destroçado
  rationale: Comunica a ruína decisiva de Efraim como entidade nacional, preservando a força do nifal de חתת.
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Conserva o nome empregado pelo texto profético, sem substituí-lo por uma identificação interpretativa como “Israel” ou “reino do norte”.
- source_word: מֵעָם
  choice: e deixará de ser um povo
  rationale: Torna inteligível em português a ideia de separação da condição de povo, embora a construção hebraica também possa ser entendida como expressão de resultado.
theological_decisions:
- issue: Natureza da queda anunciada a Efraim
  choice: Perda da condição de povo, sem especificar além do texto como isso se realizaria
  alternative: Destruição completa da população ou apenas queda política do reino
  rationale: A expressão מֵעָם aponta para o fim de Efraim como povo reconhecível, mas o versículo não define com precisão o alcance demográfico ou político; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, claro e solene, com formas onomásticas de ampla legibilidade brasileira. A repetição de “cabeça” foi mantida deliberadamente para preservar a metáfora e o paralelismo do hebraico.
