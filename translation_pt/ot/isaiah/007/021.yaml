  text: And in that day a man will keep alive a young cow and two sheep[a][b].
translation:
  language: pt
  text: Naquele dia, um homem manterá vivos uma novilha[a] e dois animais do rebanho miúdo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma bezerra”. A expressão hebraica se refere a uma fêmea jovem do gado bovino.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico צֹאן é coletivo e designa o rebanho de pequenos ruminantes, sobretudo ovelhas e cabras.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: manterá
  rationale: A fórmula profética וְהָיָה introduz o que ocorrerá; em português, a referência futura é expressa naturalmente pelo futuro do verbo principal junto de “naquele dia”, sem a repetição mais pesada “e acontecerá que”.
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Expressão temporal profética consagrada, natural e fiel ao hebraico.
- source_word: יְחַיֶּה
  choice: manterá viva
  rationale: O piel de חיה indica conservar ou sustentar com vida. “Manterá viva” preserva o sentido concreto e concorda com o substantivo feminino “novilha”.
- source_word: אִישׁ
  choice: um homem
  rationale: Mantém o singular masculino explícito do hebraico e apresenta um indivíduo representativo.
- source_word: עֶגְלַת בָּקָר
  choice: uma novilha
  rationale: A expressão designa uma fêmea jovem do gado bovino. “Novilha” é precisa, corrente no português e mais concisa que “uma vaca jovem”.
- source_word: וּשְׁתֵּי צֹאן
  choice: e duas cabeças de gado miúdo
  rationale: צֹאן é coletivo e pode abranger ovelhas e cabras. “Duas cabeças de gado miúdo” preserva essa amplitude sem escolher indevidamente uma das espécies.
