base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/020.yaml
  text: In that day the Lord will shave with a hired razor from beyond the River—with the king of Assyria—the head and the hair of the feet[a], and it will also sweep away the beard.
translation:
  language: pt
  text: Naquele dia, o Senhor rapará, com uma navalha alugada de além do Rio — o rei da Assíria —, a cabeça e os pelos dos pés[a]; ela também removerá a barba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “os pelos das pernas”. “Pés” também pode funcionar como eufemismo para os órgãos genitais, reforçando a ideia de humilhação completa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְגַלַּח
  choice: rapará
  rationale: O piel de גלח indica raspar ou cortar pelos. “Rapará” preserva de modo natural e vívido a imagem da navalha.
- source_word: אֲדֹנָי
  choice: o Senhor
  rationale: É o título divino אֲדֹנָי, não o tetragrama; “o Senhor” é a forma portuguesa corrente e digna.
- source_word: בְּתַעַר הַשְּׂכִירָה
  choice: com uma navalha alugada
  rationale: תער significa “navalha”, e שׂכירה, “alugada” ou “contratada”. A formulação mantém a metáfora de uma potência estrangeira empregada como instrumento.
- source_word: בְּעֶבְרֵי נָהָר
  choice: vinda de além do Rio
  rationale: A expressão aponta para as regiões do outro lado do Rio, isto é, do Eufrates. “Vinda de” explicita naturalmente a procedência da navalha sem substituir a designação geográfica do texto.
- source_word: בְּמֶלֶךְ אַשּׁוּר
  choice: isto é, com o rei da Assíria
  rationale: O rei da Assíria identifica a navalha metafórica. “Isto é” torna clara a aposição, enquanto “com” conserva sua função instrumental nas mãos do Senhor.
- source_word: הָרֹאשׁ
  choice: a cabeça
  rationale: Equivalente anatômico direto, adequado à imagem de rapar.
- source_word: שַׂעַר הָרַגְלָיִם
  choice: os pelos dos pés
  rationale: Reproduz formalmente a expressão hebraica. Como “pés” pode ser eufemismo para os órgãos genitais, a possível referência é registrada em nota sem ser imposta ao texto principal.
- source_word: וְגַם אֶת הַזָּקָן
  choice: também ... a barba
  rationale: גם acrescenta ênfase e amplia a imagem de remoção completa e humilhante dos pelos.
- source_word: תִּסְפֶּה
  choice: ela também removerá
  rationale: O verbo feminino singular concorda com “navalha”. ספה pode significar remover, varrer ou dar fim; “removerá” é claro em português e mantém a navalha como sujeito.
theological_decisions:
- issue: Sentido da metáfora de rapar
  choice: O Senhor usa o rei da Assíria como instrumento de um juízo que humilha e despoja.
  alternative: Uma descrição puramente militar, sem ênfase na humilhação.
  rationale: A raspagem da cabeça, da parte inferior do corpo e da barba comunica desonra e remoção abrangente; a sintaxe identifica o rei assírio como a navalha empregada pelo Senhor.
- issue: Referente de “pés”
  choice: Manter no texto a expressão literal “pés” e indicar em nota sua possível função eufemística.
  alternative: Traduzir diretamente como “órgãos genitais” ou “pelos pubianos”.
  rationale: O eufemismo é plausível, mas não inequívoco. A tradução preserva a ambiguidade do hebraico e não resolve silenciosamente a tensão lexical.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A pontuação destaca a identificação metafórica do rei da Assíria com a navalha. O pronome “ela” retoma “navalha” e preserva a concordância feminina do verbo hebraico.
