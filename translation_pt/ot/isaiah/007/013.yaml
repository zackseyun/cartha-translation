  text: וַ/יֹּ֕אמֶר שִׁמְעוּ נָ֖א בֵּ֣ית דָּוִ֑ד הַ/מְעַ֤ט מִ/כֶּם֙ הַלְא֣וֹת אֲנָשִׁ֔ים כִּ֥י תַלְא֖וּ גַּ֥ם אֶת אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/013.yaml
  text: And he said[a], “Listen, please, house of David! Is it too little for you to weary men[b], that you also weary my God?”
translation:
  language: pt
  text: 'E ele disse: “Ouçam, por favor, ó casa de Davi! Não basta a vocês cansar os homens[a], a ponto de também cansarem o meu Deus?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as pessoas” ou “os seres humanos”. O hebraico emprega aqui o plural masculino.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Não basta a vocês cansar os homens, para também cansarem o meu Deus?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ele disse
  rationale: Preserva a forma narrativa hebraica que introduz a fala de Isaías sem explicitar além do texto a identidade do falante.
- source_word: שִׁמְעוּ נָא
  choice: Ouçam, por favor
  rationale: O imperativo está no plural, e נָא acrescenta tom de apelo ou insistência cortês; a formulação é atual e natural em português.
- source_word: בֵּית דָּוִד
  choice: ó casa de Davi
  rationale: Trata-se de uma interpelação à dinastia ou comunidade davídica, não a um edifício; “ó” marca claramente o vocativo em registro digno.
- source_word: הַמְעַט מִכֶּם
  choice: Será pouco para vocês
  rationale: Mantém a forma da pergunta retórica e o sentido de considerar algo insuficiente ou trivial, com linguagem compreensível no português moderno.
- source_word: הַלְאוֹת / תַלְאוּ
  choice: cansarem / cansarem
  rationale: A repetição de “cansar” reproduz a repetição da raiz hebraica לאה e conserva a progressão retórica dos seres humanos para Deus.
- source_word: אֲנָשִׁים
  choice: os homens
  rationale: Conserva o plural masculino do hebraico e o contraste imediato entre seres humanos e Deus; uma alternativa inclusiva é indicada em nota.
- source_word: כִּי
  choice: para
  rationale: Liga as duas partes da pergunta como progressão até o ato de cansar também Deus, sem impor uma explicação causal mais específica do que o contexto exige.
- source_word: גַּם אֶת אֱלֹהָי
  choice: também o meu Deus
  rationale: Preserva tanto a força aditiva de גַּם quanto o sufixo possessivo de primeira pessoa em אֱלֹהָי.
theological_decisions:
- issue: Gênero e alcance de אֲנָשִׁים
  choice: os homens
  alternative: as pessoas; os seres humanos
  rationale: O texto hebraico usa um plural masculino, mas pode referir-se genericamente a seres humanos. A tradução principal mantém a forma, enquanto a nota registra o alcance possível sem eliminar o contraste entre humanidade e Deus.
- issue: Sufixo possessivo em אֱלֹהָי
  choice: o meu Deus
  alternative: Deus
  rationale: O possessivo pertence expressamente ao texto e preserva a posição pessoal e profética de Isaías diante da casa de Davi.
- issue: Relação sintática introduzida por כִּי
  choice: para cansarem também
  alternative: a ponto de cansarem também; que cansem também
  rationale: A construção hebraica admite mais de uma maneira de expressar a progressão da pergunta. A opção principal conserva a tensão retórica sem transformá-la explicitamente em causa ou mera consequência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O vocativo “ó casa de Davi” preserva a solenidade sem recorrer a formas verbais arcaicas; “vocês” torna explícito o plural do hebraico.
