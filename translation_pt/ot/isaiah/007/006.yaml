source:
  edition: WLC
  text: נַעֲלֶ֤ה בִֽ/יהוּדָה֙ וּ/נְקִיצֶ֔/נָּה וְ/נַבְקִעֶ֖/נָּה אֵלֵ֑י/נוּ וְ/נַמְלִ֥יךְ מֶ֨לֶךְ֙ בְּ/תוֹכָ֔/הּ אֵ֖ת בֶּן טָֽבְאַֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/006.yaml
  text: Let us go up against Judah[a], and terrify her, and break her open for ourselves[b], and make the son of Tabeel king in her midst.
translation:
  language: pt
  text: “Subamos contra Judá e a aterrorizemos[a]; abramos nela uma brecha para nós[b] e façamos do filho de Tabeal rei no meio dela.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “façamos que ela tenha pavor”, “a aflijamos” ou “a acosemos”. O verbo hebraico é difícil; o texto principal o entende no sentido de causar medo ou pânico.
    reason: lexical_alternative
  - marker: b
    text: Ou “rompamo-la para nós” ou “dividamo-la para nós”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲלֶה בִיהוּדָה
  choice: Subamos contra Judá
  rationale: Em contexto militar, עלה com a preposição ב indica avançar contra um território. “Subamos contra” conserva a imagem hebraica e expressa naturalmente a invasão planejada.
- source_word: וּנְקִיצֶנָּה
  choice: e a aterrorizemos
  rationale: A forma causativa de קוץ é lexicalmente difícil neste verso. No contexto de intimidação militar, “aterrorizemos” comunica de modo claro a ideia provável de causar pavor ou pânico, sem ocultar em nota as demais possibilidades.
- source_word: וְנַבְקִעֶנָּה אֵלֵינוּ
  choice: abramos nela uma brecha para nós
  rationale: בקע denota partir, romper ou abrir. A formulação conserva a imagem de romper as defesas de Judá, enquanto “para nós” representa אֵלֵינוּ e o propósito de tomá-la em benefício dos invasores.
- source_word: וְנַמְלִיךְ מֶלֶךְ
  choice: e façamos ... rei
  rationale: O hifil de מלך é causativo e significa fazer alguém rei ou instalá-lo como rei. A construção escolhida é direta e corrente em português.
- source_word: בְּתוֹכָהּ
  choice: no meio dela
  rationale: O sufixo feminino retoma Judá. “No meio dela” preserva essa personificação e traduz com transparência a expressão hebraica.
- source_word: בֶּן טָבְאַל
  choice: o filho de Tabeal
  rationale: בֶּן é traduzido como o substantivo comum “filho”, e טָבְאַל é transliterado como o nome próprio “Tabeal”.
theological_decisions:
- issue: Personificação de Judá e sufixos femininos
  choice: 'Retomar Judá com formas femininas: “a”, “nela” e “dela”'
  alternative: Empregar formas impessoais ou masculinas, como “isso”, “nele” ou “dele”
  rationale: O hebraico usa repetidamente sufixos femininos referentes a Judá. Preservar o feminino reproduz a gramática e a personificação do texto sem acrescentar interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A fala deliberativa dos invasores foi mantida por meio do subjuntivo exortativo na primeira pessoa do plural. A pontuação organiza as etapas do plano sem apagar o encadeamento do hebraico.
