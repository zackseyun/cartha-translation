id: ISA.7.14
reference: Isaiah 7:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ֠/כֵן יִתֵּ֨ן אֲדֹנָ֥/י ה֛וּא לָ/כֶ֖ם א֑וֹת הִנֵּ֣ה הָ/עַלְמָ֗ה הָרָה֙ וְ/יֹלֶ֣דֶת בֵּ֔ן וְ/קָרָ֥את שְׁמ֖/וֹ עִמָּ֥נוּ אֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/014.yaml
  text: 'Therefore the Lord himself will give you a sign: behold[a], the young woman is pregnant and is bearing a son[d][c][b], and she will call his name Immanuel.'
translation:
  language: pt
  text: 'Por isso, o próprio Senhor dará a vocês um sinal: eis que[a] a jovem está grávida e está para dar à luz um filho[b], e ela dará ao filho o nome de Emanuel[c][d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a virgem”. A palavra hebraica עַלְמָה significa “jovem”; a Septuaginta grega a traduz por uma palavra muitas vezes entendida como “virgem”, e Mateus 1:23 cita o versículo nessa forma.'
    reason: alternative_reading
  - marker: b
    text: 'Tradução tradicional: “conceberá e dará à luz um filho”. Mais literalmente, o hebraico descreve a jovem como grávida e prestes a dar à luz.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “você lhe dará o nome”; algumas tradições textuais antigas refletem essa leitura. Em Mateus 1:23, lê-se: “lhe darão o nome”.'
    reason: textual_variant
  - marker: d
    text: Emanuel significa “Deus conosco”.
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Introduz a consequência da recusa de Acaz com uma expressão discursiva natural em português.
- source_word: אֲדֹנָי הוּא
  choice: o próprio Senhor
  rationale: Distingue אֲדֹנָי do Tetragrama e preserva a ênfase do pronome independente הוּא.
- source_word: לָכֶם
  choice: a vocês
  rationale: Torna explícito o plural hebraico, adequado ao contexto em que a palavra se dirige à casa de Davi.
- source_word: אוֹת
  choice: um sinal
  rationale: Equivalente corrente para um sinal confirmador ou portentoso dado por Deus.
- source_word: הִנֵּה
  choice: eis que
  rationale: Preserva a força dêitica e solene da expressão hebraica em português bíblico ainda compreensível.
- source_word: הָעַלְמָה
  choice: a jovem
  rationale: עַלְמָה designa uma jovem em idade de casar e, por si só, não afirma lexicalmente a virgindade; a tradução tradicional é registrada em nota.
- source_word: הָרָה
  choice: está grávida
  rationale: Reflete o adjetivo predicativo e seu sentido de estado presente com linguagem moderna e direta.
- source_word: וְיֹלֶדֶת
  choice: e dá à luz
  rationale: O particípio apresenta a ação em curso ou iminente. A formulação portuguesa mantém essa vivacidade sem convertê-la silenciosamente em futuro simples.
- source_word: בֵּן
  choice: um filho
  rationale: Equivalência natural e direta do substantivo hebraico no contexto.
- source_word: וְקָרָאת שְׁמוֹ
  choice: e ela lhe dará o nome
  rationale: Representa naturalmente em português a forma feminina singular do Texto Massorético e o idioma hebraico de chamar o nome de alguém.
- source_word: עִמָּנוּ אֵל
  choice: Emanuel
  rationale: Mantém a forma tradicional do nome em português; seu significado é explicado em nota.
theological_decisions:
- issue: Tradução de הָעַלְמָה em uma profecia de importância cristológica
  choice: a jovem
  alternative: a virgem
  rationale: O texto principal segue o alcance lexical do hebraico sem inserir nele uma especificação que a palavra isoladamente não exige. A tradução grega antiga e sua citação em Mateus 1:23 são informadas em nota, preservando a conexão canônica e a história da interpretação.
- issue: Força temporal e aspectual de הָרָה וְיֹלֶדֶת
  choice: está grávida e dá à luz
  alternative: conceberá e dará à luz
  rationale: O hebraico combina um adjetivo predicativo com um particípio, apresentando gravidez e parto como estado e ação presentes ou iminentes. A opção tradicional futura é mantida em nota.
- issue: Quem dá nome à criança em וְקָרָאת
  choice: ela lhe dará o nome
  alternative: você lhe dará o nome / lhe darão o nome
  rationale: A leitura massorética fornecida é representada mais diretamente como feminino singular. Tradições textuais antigas e Mateus 1:23 refletem outra formulação, registrada em nota sem alterar o texto-base.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Eis que” conserva a solenidade profética; “a vocês” explicita o plural; e “lhe dará o nome” naturaliza moderadamente o idioma hebraico sem perder o agente feminino.
