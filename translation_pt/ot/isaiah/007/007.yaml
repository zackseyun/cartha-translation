base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/007.yaml
  text: 'Thus says the Lord GOD: It shall not stand[a], and it shall not come to pass.'
translation:
  language: pt
  text: 'Assim diz o Senhor Yahweh: “Isso não se firmará nem acontecerá.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula profética de mensageiro em linguagem digna, corrente e facilmente reconhecível em português.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: 'Representa os dois elementos do título composto: אֲדֹנָי como «Senhor» e o nome divino יהוה como «Yahweh», sem produzir a expressão artificial «Senhor SENHOR».'
- source_word: לֹא תָקוּם
  choice: não se confirmará
  rationale: No contexto, קום descreve o plano hostil como algo que não ficará estabelecido nem terá êxito. «Não se confirmará» comunica esse sentido naturalmente em português.
- source_word: וְלֹא תִהְיֶה
  choice: e não acontecerá
  rationale: Embora literalmente possa ser «e não será», aqui היה indica que o plano não chegará a ocorrer; «não acontecerá» torna explícito esse valor contextual sem acrescentar uma interpretação teológica.
theological_decisions:
- issue: Representação do nome divino no título אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A opção conserva tanto o título אֲדֹנָי quanto o nome próprio יהוה e evita ocultar o nome divino sob um título substitutivo.
- issue: Referente implícito dos verbos femininos תָקוּם e תִהְיֶה
  choice: Isso não se confirmará e não acontecerá
  alternative: O plano não se confirmará e não acontecerá
  rationale: O contexto aponta para o plano mencionado anteriormente, mas o hebraico não repete aqui o substantivo. «Isso» preserva a ligação contextual sem inserir «plano» diretamente no texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A formulação mantém o paralelismo enfático das duas negações hebraicas sem recorrer a construções arcaizantes.
