  text: וַ/יֻּגַּ֗ד לְ/בֵ֤ית דָּוִד֙ לֵ/אמֹ֔ר נָ֥חָֽה אֲרָ֖ם עַל אֶפְרָ֑יִם וַ/יָּ֤נַע לְבָב/וֹ֙ וּ/לְבַ֣ב עַמּ֔/וֹ כְּ/נ֥וֹעַ עֲצֵי יַ֖עַר מִ/פְּנֵי רֽוּחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/002.yaml
  text: And it was reported to the house of David, saying, “Aram has settled on Ephraim.” And his heart and the heart of his people shook, as the trees of the forest shake before the wind.
translation:
  language: pt
  text: 'Então foi anunciado à casa de Davi: “Arã se estabeleceu junto a Efraim”. E o coração dele e o coração do seu povo estremeceram, como estremecem as árvores da floresta diante do vento.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְבֵית דָּוִד
  choice: à casa de Davi
  rationale: Mantém a expressão dinástica do hebraico, que neste contexto designa o rei pertencente à linhagem de Davi e sua corte.
- source_word: נָחָה אֲרָם עַל אֶפְרָיִם
  choice: Arã se estabeleceu junto a Efraim
  rationale: נָחָה expressa pousar, assentar-se ou estabelecer-se; עַל pode indicar posição junto a/sobre. A formulação preserva a imagem incomum do texto sem explicitar uma aliança que o hebraico não nomeia diretamente.
- source_word: וַיָּנַע
  choice: estremeceram
  rationale: O verbo descreve oscilação ou agitação; 'estremeceram' comunica tanto o movimento causado pelo medo quanto a comparação seguinte com as árvores.
- source_word: מִפְּנֵי־רוּחַ
  choice: diante do vento
  rationale: Reproduz de modo natural a locução hebraica que apresenta o vento como a força perante a qual as árvores se agitam.
theological_decisions:
- issue: Sentido político de נָחָה ... עַל
  choice: se estabeleceu junto a
  alternative: se aliou a / repousou sobre
  rationale: O contexto histórico sugere uma coalizão, mas o verso usa linguagem espacial e não o verbo explícito para fazer aliança. A tradução conserva essa tensão em vez de inserir a interpretação política no texto.
- issue: Referente do pronome em לְבָבוֹ
  choice: o coração dele
  alternative: o coração de Acaz
  rationale: O hebraico emprega pronome masculino singular cujo referente contextual é o rei, mas não o nomeia neste versículo. Preservar o pronome evita explicitação desnecessária.
translation_notes:
  register: Português moderno, claro e digno, com construção narrativa natural. Conservou-se 'casa de Davi' como expressão bíblica inteligível e a repetição enfática de 'coração', evitando substituir a imagem hebraica por uma paráfrase psicológica.
