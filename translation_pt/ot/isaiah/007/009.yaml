source:
  edition: WLC
  text: וְ/רֹ֤אשׁ אֶפְרַ֨יִם֙ שֹׁמְר֔וֹן וְ/רֹ֥אשׁ שֹׁמְר֖וֹן בֶּן רְמַלְיָ֑הוּ אִ֚ם לֹ֣א תַאֲמִ֔ינוּ כִּ֖י לֹ֥א תֵאָמֵֽנוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/009.yaml
  text: And the head of Ephraim is Samaria[a], and the head of Samaria is the son of Remaliah. If you do not believe[b], surely you will not be established.
translation:
  language: pt
  text: E a cabeça de Efraim é Samaria, e a cabeça de Samaria é o filho de Remalias. Se vocês não confiarem, certamente não permanecerão firmes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'No hebraico, “confiarem” e “permanecerão firmes” vêm da mesma raiz (אמן), ligando a ideia de confiar à de manter-se firme. Também se pode traduzir: “Se vocês não crerem, certamente não serão estabelecidos.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: cabeça
  rationale: 'Mantém a metáfora política e o paralelismo hebraico: Samaria ocupa a posição principal em Efraim, e o filho de Remalias, em Samaria.'
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Preserva o nome regional usado pelo hebraico, que neste contexto designa o reino do Norte, sem explicitar essa interpretação no texto.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Forma portuguesa consagrada do nome da cidade, aqui apresentada como cabeça de Efraim.
- source_word: בֶּן רְמַלְיָהוּ
  choice: o filho de Remalias
  rationale: Reproduz o patronímico deliberado em vez de inserir o nome pessoal de Peca.
- source_word: אִם לֹא תַאֲמִינוּ
  choice: Se vocês não confiarem
  rationale: Entende אִם לֹא como prótase condicional e traduz o Hifil de אמן pelo sentido contextual de confiar.
- source_word: כִּי לֹא תֵאָמֵנוּ
  choice: certamente não permanecerão firmes
  rationale: Expressa a força enfática da apódose e o sentido do Nifal de אמן como manter-se firme ou estável.
theological_decisions:
- issue: Jogo de palavras entre as duas formas da raiz אמן
  choice: Se vocês não confiarem, certamente não permanecerão firmes.
  alternative: Se vocês não crerem, certamente não serão estabelecidos.
  rationale: A formulação escolhida distingue confiança de estabilidade e comunica com naturalidade a advertência profética. Como o português não permite conservar plenamente o vínculo sonoro e lexical do hebraico, uma nota registra o jogo de palavras sem introduzir categorias doutrinárias posteriores.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e tratamento plural por “vocês”. A metáfora repetida “cabeça” foi preservada por seu valor retórico. A ordem das notas fornecida na consulta inglesa parece deslocada; nesta versão, o único marcador foi colocado junto à frase a que de fato se refere.
