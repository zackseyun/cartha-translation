source:
  edition: WLC
  text: וְ/כֹ֣ל הֶ/הָרִ֗ים אֲשֶׁ֤ר בַּ/מַּעְדֵּר֙ יֵעָ֣דֵר֔וּ/ן לֹֽא תָב֣וֹא שָׁ֔מָּ/ה יִרְאַ֖ת שָׁמִ֣יר וָ/שָׁ֑יִת וְ/הָיָה֙ לְ/מִשְׁלַ֣ח שׁ֔וֹר וּ/לְ/מִרְמַ֖ס שֶֽׂה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/025.yaml
  text: And as for all the hills that used to be hoed with a hoe[a], you will not go there for fear of briers and thorns[d][c][b]; they will become a place for the sending out of oxen and for the trampling of sheep.
translation:
  language: pt
  text: Quanto a todas as colinas que eram cultivadas com a enxada[a], você não irá até lá por medo de espinheiros e espinhos[b]; elas se tornarão lugar onde se soltam bois[c] e onde o gado miúdo pisa[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que eram cavadas com a enxada”. O hebraico emprega um substantivo e um verbo da mesma raiz, ambos ligados ao trabalho com a enxada.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico “você não irá até lá” também pode ter sentido genérico: “ninguém irá até lá”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “lugar para onde se levam os bois”; mais interpretativamente, “pastagem para bois”.'
    reason: lexical_alternative
  - marker: d
    text: O termo hebraico שֶׂה pode designar ovelha ou cabra e também, de modo mais amplo, o gado miúdo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל הֶהָרִים
  choice: Quanto a todas as colinas
  rationale: A construção introduz um novo elemento da descrição; “quanto a” marca essa mudança de tópico. No contexto agrícola, “colinas” é mais adequado que “montanhas”.
- source_word: אֲשֶׁר בַּמַּעְדֵּר יֵעָדֵרוּן
  choice: que eram cultivadas com a enxada
  rationale: O substantivo מַעְדֵּר designa uma enxada ou instrumento semelhante, e o verbo cognato indica trabalhar o solo. A formulação natural em português comunica o cultivo anterior, em contraste com a futura desolação.
- source_word: לֹא תָבוֹא שָׁמָּה
  choice: você não irá até lá
  rationale: A forma verbal de segunda pessoa masculina singular pode ter sentido genérico. “Irá até lá” expressa naturalmente a ideia de aproximação evitada.
- source_word: יִרְאַת שָׁמִיר וָשַׁיִת
  choice: por medo de espinheiros e espinhos
  rationale: A construção indica o motivo da ausência, e o par hebraico descreve vegetação espinhosa invasora associada à desolação.
- source_word: וְהָיָה לְמִשְׁלַח שׁוֹר
  choice: elas se tornarão lugar onde se soltam bois
  rationale: Embora o verbo hebraico esteja no singular coletivo, o plural português concorda naturalmente com “todas as colinas”. מִשְׁלַח conserva a imagem concreta de bois soltos no terreno.
- source_word: וּלְמִרְמַס שֶׂה
  choice: e onde o gado miúdo pisa
  rationale: מִרְמַס denota pisar ou calcar. שֶׂה pode designar uma ovelha ou cabra e, coletivamente, animais pequenos do rebanho; “gado miúdo” preserva essa abrangência.
