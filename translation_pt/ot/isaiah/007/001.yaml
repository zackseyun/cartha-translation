id: ISA.7.1
reference: Isaiah 7:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִ֡י בִּ/ימֵ֣י אָ֠חָז בֶּן יוֹתָ֨ם בֶּן עֻזִּיָּ֜הוּ מֶ֣לֶךְ יְהוּדָ֗ה עָלָ֣ה רְצִ֣ין מֶֽלֶךְ אֲ֠רָם וּ/פֶ֨קַח בֶּן רְמַלְיָ֤הוּ מֶֽלֶךְ יִשְׂרָאֵל֙ יְר֣וּשָׁלִַ֔ם לַ/מִּלְחָמָ֖ה עָלֶ֑י/הָ וְ/לֹ֥א יָכֹ֖ל לְ/הִלָּחֵ֥ם עָלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/001.yaml
  text: And it happened in the days of Ahaz son of Jotham[a], son of Uzziah, king of Judah, that Rezin king of Aram and Pekah son of Remaliah, king of Israel, went up to Jerusalem to wage war against it[b], but they were not able to fight against it.
translation:
  language: pt
  text: E aconteceu, nos dias de Acaz, filho de Jotão, filho de Uzias, rei de Judá, que Rezim, rei de Arã[a], e Peca, filho de Remalias, rei de Israel, subiram a Jerusalém para guerrear contra ela; mas ele não conseguiu lutar contra ela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «Arã»; tradicionalmente, «Síria».'
    reason: alternative_reading
  - marker: b
    text: O verbo hebraico está no singular («ele não conseguiu»), embora antes sejam mencionados Rezim e Peca juntos; algumas traduções regularizam a frase como «eles não conseguiram».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu
  rationale: Mantém a abertura narrativa hebraica em português atual e digno, sem recorrer à fórmula mais arcaica «E sucedeu».
- source_word: בִּימֵי
  choice: nos dias de
  rationale: Preserva a expressão temporal hebraica, que é clara e natural em registro bíblico moderno.
- source_word: אָחָז ... יוֹתָם ... עֻזִּיָּהוּ
  choice: Acaz, filho de Jotão, filho de Uzias
  rationale: Emprega as formas portuguesas consagradas dos nomes e conserva integralmente a sequência genealógica.
- source_word: מֶלֶךְ יְהוּדָה
  choice: rei de Judá
  rationale: Reprodução direta do título real e da designação territorial.
- source_word: עָלָה
  choice: subiram
  rationale: Expressa o movimento até Jerusalém e sua finalidade militar. O hebraico traz o verbo no singular apesar do sujeito composto; aqui o plural oferece português natural, enquanto a singularidade mais interpretativamente relevante de יָכֹל é preservada e explicada em nota.
- source_word: רְצִין מֶלֶךְ אֲרָם
  choice: Rezim, rei de Arã
  rationale: Usa a forma portuguesa do nome próprio e verte אֲרָם diretamente como «Arã», em vez do nome tradicional posterior «Síria».
- source_word: וּפֶקַח בֶּן רְמַלְיָהוּ מֶלֶךְ יִשְׂרָאֵל
  choice: e Peca, filho de Remalias, rei de Israel
  rationale: Conserva a filiação e o título em aposição, com as formas portuguesas usuais dos nomes.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalém
  rationale: Forma portuguesa padrão do topônimo.
- source_word: לַמִּלְחָמָה עָלֶיהָ
  choice: para guerrear contra ela
  rationale: Comunica naturalmente a finalidade militar da subida e conserva a referência feminina à cidade, plenamente idiomática em português.
- source_word: וְלֹא יָכֹל
  choice: mas ele não conseguiu
  rationale: Preserva deliberadamente o singular do texto massorético, sem harmonizá-lo silenciosamente com os dois reis mencionados.
- source_word: לְהִלָּחֵם עָלֶיהָ
  choice: lutar contra ela
  rationale: Traduz de modo direto o infinitivo militar e mantém Jerusalém como referente do pronome.
theological_decisions:
- issue: Tradução de אֲרָם
  choice: Arã
  alternative: Síria
  rationale: «Arã» representa mais diretamente o termo etnogeográfico hebraico e evita substituir a designação antiga pelo nome tradicional posterior.
- issue: Verbo singular יָכֹל depois de sujeitos coordenados
  choice: mas ele não conseguiu
  alternative: mas eles não conseguiram
  rationale: O hebraico massorético emprega o singular. A tradução conserva essa tensão e sua possível referência ao rei principal ou mais próximo, sem impor uma solução plural.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. Mantêm-se as fórmulas narrativas e genealógicas do hebraico sem arcaísmo excessivo; a irregularidade do singular em יָכֹל é preservada no texto e esclarecida em nota.
