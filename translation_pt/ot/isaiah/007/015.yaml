  yaml_path: translation/ot/isaiah/007/015.yaml
  text: He will eat curds and honey by the time he knows to refuse the evil and choose the good[a][b].
translation:
  language: pt
  text: Ele comerá coalhada e mel quando souber rejeitar o mal e escolher o bem.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «até que saiba rejeitar o mal e escolher o bem». A expressão hebraica pode indicar o limite de tempo durante o qual isso se aplica.'
    reason: alternative_reading
  - marker: b
    text: A palavra traduzida por «coalhada» também pode designar manteiga ou nata, referindo-se de modo geral a um produto do leite.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶמְאָה
  choice: coalhada
  rationale: Designa um produto do leite, provavelmente leite coalhado; «coalhada» é natural em português e combina bem com «mel» neste contexto.
- source_word: וּדְבַשׁ
  choice: e mel
  rationale: Tradução direta de דְבַשׁ, com preservação da conjunção.
- source_word: יֹאכֵל
  choice: ele comerá
  rationale: O yiqtol tem valor futuro adequado ao contexto profético referente à criança.
- source_word: לְדַעְתּוֹ
  choice: quando souber
  rationale: A preposição לְ com infinitivo construto e sufixo admite sentido temporal; esta formulação é natural e não afirma que a alimentação cause discernimento moral.
- source_word: מָאוֹס
  choice: rejeitar
  rationale: No contraste com escolher o bem, indica recusa prática do mal; «rejeitar» exprime esse sentido com dignidade e clareza.
- source_word: בָּרָע
  choice: o mal
  rationale: Preserva o artigo hebraico e o paralelismo com «o bem».
- source_word: וּבָחוֹר
  choice: e escolher
  rationale: Equivalente natural, em paralelo com «rejeitar».
- source_word: בַּטּוֹב
  choice: o bem
  rationale: Preserva o artigo e a oposição moral equilibrada com «o mal».
theological_decisions:
- issue: Força temporal de לְדַעְתּוֹ em relação à alimentação da criança e ao discernimento moral
  choice: «quando souber rejeitar o mal e escolher o bem»
  alternative: '«até que saiba» ou «quando chegar a saber»; também é gramaticalmente possível entender finalidade: «para que saiba»'
  rationale: O sentido temporal é natural no contexto e preserva a relação cronológica sem declarar que a coalhada e o mel produzem discernimento moral. Uma nota mantém visível a possível nuance de limite temporal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. «Coalhada» é corrente e concreta; «rejeitar o mal e escolher o bem» conserva o paralelismo moral do hebraico.
