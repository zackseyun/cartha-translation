  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא יִשְׁרֹ֤ק יְהוָה֙ לַ/זְּב֔וּב אֲשֶׁ֥ר בִּ/קְצֵ֖ה יְאֹרֵ֣י מִצְרָ֑יִם וְ/לַ֨/דְּבוֹרָ֔ה אֲשֶׁ֖ר בְּ/אֶ֥רֶץ אַשּֽׁוּר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/018.yaml
  text: And in that day Yahweh will whistle for the fly that is at the far end of the streams of Egypt[b][a], and for the bee that is in the land of Assyria.
translation:
  language: pt
  text: Naquele dia, Yahweh assobiará[b] para chamar a mosca que está nos confins dos canais do Egito[a] e a abelha que está na terra da Assíria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os “canais do Egito” podem designar os braços do Nilo e outros cursos ou canais ligados a ele.
    reason: cultural_note
  - marker: b
    text: 'Ou: “Yahweh silvará para convocar”. O verbo hebraico indica um assobio ou silvo usado como sinal de chamada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Expressa de modo natural a fórmula temporal profética; o valor introdutório de וְהָיָה é incorporado à frase sem o arcaísmo de uma tradução literal como “e acontecerá”.
- source_word: יִשְׁרֹק
  choice: assobiará para chamar
  rationale: O verbo descreve um som agudo usado para convocar ou sinalizar. A explicitação “para chamar” preserva a função do assobio e evita que o leitor entenda apenas um assobio casual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: לַזְּבוּב
  choice: a mosca
  rationale: Mantém o singular figurativo do hebraico e seu paralelismo com “a abelha”.
- source_word: אֲשֶׁר בִּקְצֵה יְאֹרֵי מִצְרָיִם
  choice: que está nos confins dos canais do Egito
  rationale: “Nos confins” comunica a ideia de extremidade ou região remota; no contexto egípcio, יְאֹרִים designa canais, braços ou cursos ligados ao Nilo, sendo “canais” claro e apropriado no texto principal.
- source_word: וְלַדְּבוֹרָה
  choice: e a abelha
  rationale: Preserva o singular emblemático e o paralelismo da imagem hebraica.
- source_word: אֲשֶׁר בְּאֶרֶץ אַשּׁוּר
  choice: que está na terra da Assíria
  rationale: Conserva a expressão territorial concreta do hebraico em português natural.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor ou Jeová
  rationale: Preserva o nome pessoal presente no texto hebraico, sem o substituir por um título.
- issue: Identidade da mosca e da abelha
  choice: Manter as imagens sem identificar diretamente seus referentes políticos ou militares
  alternative: Explicitar a mosca como Egito e a abelha como Assíria
  rationale: Embora o contexto sugira potências estrangeiras, o versículo apresenta imagens figuradas; torná-las explicações eliminaria uma tensão genuína do texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Assobiará para chamar” é mais idiomático que “silvará” e torna explícita apenas a finalidade já contida no verbo hebraico. Os marcadores foram colocados junto aos elementos a que se referem.
