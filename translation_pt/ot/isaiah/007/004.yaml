  text: וְ/אָמַרְתָּ֣ אֵ֠לָי/ו הִשָּׁמֵ֨ר וְ/הַשְׁקֵ֜ט אַל תִּירָ֗א וּ/לְבָבְ/ךָ֙ אַל יֵרַ֔ךְ מִ/שְּׁנֵ֨י זַנְב֧וֹת הָ/אוּדִ֛ים הָ/עֲשֵׁנִ֖ים הָ/אֵ֑לֶּה בָּ/חֳרִי אַ֛ף רְצִ֥ין וַ/אֲרָ֖ם וּ/בֶן רְמַלְיָֽהוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/004.yaml
  text: and say to him[a], ‘Be careful and stay calm. Do not fear, and do not let your heart be faint because of these two smoldering stubs of firebrands—because of the burning anger of Rezin and Aram, and the son of Remaliah.’
translation:
  language: pt
  text: 'e diga-lhe: “Tenha cuidado e mantenha a calma. Não tenha medo, nem deixe seu coração desfalecer por causa dessas duas pontas de tições fumegantes[a] — por causa da ira ardente de Rezim e da Síria, e do filho de Remalias.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “dois rabos desses tições fumegantes”. A imagem apresenta Rezim e o filho de Remalias como as pontas queimadas de pedaços de madeira que ainda soltam fumaça, mas estão perto de se apagar.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֵר
  choice: Tenha cuidado
  rationale: O imperativo nifal exorta Acaz a manter-se atento e cauteloso; a formulação é natural em português e conserva a força imperativa.
- source_word: וְהַשְׁקֵט
  choice: mantenha a calma
  rationale: No contexto de ameaça política e medo, שׁקט indica permanecer tranquilo ou imperturbável, não apenas ficar em silêncio.
- source_word: אַל תִּירָא
  choice: Não tenha medo
  rationale: Tradução direta e corrente da proibição, com clareza para o leitor moderno.
- source_word: וּלְבָבְךָ אַל יֵרַךְ
  choice: nem deixe seu coração desfalecer
  rationale: Preserva a imagem hebraica do coração que se enfraquece, comunicando perda de coragem sem eliminar a metáfora corporal.
- source_word: מִשְּׁנֵי זַנְבוֹת הָאוּדִים הָעֲשֵׁנִים
  choice: por causa dessas duas pontas de tições fumegantes
  rationale: “Pontas” representa de modo inteligível os “rabos” ou extremos restantes dos tições; “fumegantes” conserva a imagem de ameaças que ainda soltam fumaça, mas estão perto de se apagar.
- source_word: בָּחֳרִי אַף
  choice: por causa da ira ardente
  rationale: Mantém tanto o sentido idiomático de ira intensa quanto a imagem de calor e fogo ligada aos tições.
- source_word: רְצִין וַאֲרָם וּבֶן רְמַלְיָהוּ
  choice: de Rezim e da Síria, e do filho de Remalias
  rationale: Conserva a referência coletiva ao rei Rezim e à Síria e mantém a designação depreciativa indireta de Peca como “filho de Remalias”, sem inserir seu nome.
theological_decisions:
- issue: Preservação da metáfora dos inimigos como tições quase apagados
  choice: A imagem dos “tições fumegantes” foi mantida no texto principal.
  alternative: Parafrasear como “duas ameaças prestes a desaparecer”.
  rationale: 'A metáfora comunica a avaliação divina e a ironia profética: os inimigos parecem ameaçadores, mas são restos de um fogo em extinção. A tradução não deve eliminar essa força retórica.'
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Empregou-se “Síria” como o nome corrente de Arã neste contexto histórico. A construção “de Rezim e da Síria, e do filho de Remalias” conserva a coordenação do hebraico sem identificar explicitamente o último personagem como Peca.
