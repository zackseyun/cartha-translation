  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא יִֽהְיֶ֣ה כָל מָק֗וֹם אֲשֶׁ֧ר יִֽהְיֶה שָּׁ֛ם אֶ֥לֶף גֶּ֖פֶן בְּ/אֶ֣לֶף כָּ֑סֶף לַ/שָּׁמִ֥יר וְ/לַ/שַּׁ֖יִת יִֽהְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/023.yaml
  text: And in that day[b][a], every place where there were a thousand vines worth a thousand pieces of silver will become briars and thorns.
translation:
  language: pt
  text: Naquele dia, todo lugar onde havia mil videiras avaliadas em mil peças de prata[a] será tomado por sarças e espinhos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “mil videiras por mil de prata”. O versículo não especifica a unidade monetária.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “onde houver mil videiras avaliadas em mil peças de prata”. O imperfeito hebraico permite essa tradução mais literal, mas o contexto favorece o contraste entre vinhedos antes valiosos e sua futura devastação.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: Naquele dia ... ficará
  rationale: A fórmula temporal profética é expressa naturalmente em português, enquanto o valor futuro de וְהָיָה é integrado ao predicado final para evitar uma construção artificial.
- source_word: כָל מָקוֹם
  choice: todo lugar
  rationale: Equivalente direto, distributivo e idiomático em português corrente.
- source_word: אֲשֶׁר יִהְיֶה שָׁם
  choice: onde havia
  rationale: Embora יִהְיֶה seja formalmente imperfeito, o contexto contrapõe o antigo valor das vinhas à futura devastação. A nota preserva a leitura formal alternativa.
- source_word: אֶלֶף גֶּפֶן
  choice: mil videiras
  rationale: Videira designa com precisão e naturalidade a planta que produz uvas.
- source_word: בְּאֶלֶף כָּסֶף
  choice: avaliadas em mil peças de prata
  rationale: A preposição indica valor ou preço; 'peças de prata' evita inserir uma unidade monetária não expressa no hebraico.
- source_word: לַשָּׁמִיר וְלַשַּׁיִת
  choice: coberto de espinheiros e ervas daninhas
  rationale: O par hebraico descreve vegetação espinhosa e inculta; a formulação ampla comunica a devastação sem alegar identificação botânica exata.
- source_word: יִהְיֶה
  choice: ficará coberto
  rationale: Expressa de modo natural o estado futuro e, pelo contexto, a transformação da terra cultivada em terreno tomado por vegetação inculta.
