  text: Because Aram has planned evil against you, along with Ephraim and the son of Remaliah, saying,
translation:
  language: pt
  text: 'Pois a Síria planejou o mal contra você, junto com Efraim e o filho de Remalias, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַעַן כִּי
  choice: Pois
  rationale: Introduz naturalmente em português a causa apresentada pelo hebraico, mantendo a ligação sintática com o contexto anterior.
- source_word: אֲרָם
  choice: a Síria
  rationale: No contexto, designa o reino arameu sediado em Damasco; “Síria” é a forma bíblica tradicional e mais reconhecível em português moderno.
- source_word: יָעַץ עָלֶיךָ ... רָעָה
  choice: planejou o mal contra você
  rationale: Reproduz diretamente a ideia de deliberar ou traçar um plano prejudicial contra alguém.
- source_word: אֶפְרַיִם וּבֶן רְמַלְיָהוּ
  choice: junto com Efraim e o filho de Remalias
  rationale: A sintaxe apresenta Efraim e o filho de Remalias como participantes do plano liderado pela Síria; “junto com” preserva essa relação sem transformar todos em sujeitos gramaticais equivalentes.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Mantém a fórmula introdutória da fala seguinte; os dois-pontos são naturais em português.
theological_decisions:
- issue: Relação sintática entre Síria, Efraim e o filho de Remalias
  choice: A Síria é o sujeito singular de “planejou”, e Efraim e o filho de Remalias são associados por “junto com”.
  alternative: “A Síria, Efraim e o filho de Remalias planejaram...”
  rationale: O verbo hebraico está no singular e concorda diretamente com Aram; a construção escolhida conserva essa forma e evita nivelar silenciosamente a sintaxe.
translation_notes:
  register: Português atual, claro e digno, com legibilidade brasileira. Emprega “você” para o singular dirigido a Acaz e “Remalias” segundo a forma consagrada em português. Não são necessárias notas de rodapé neste versículo.
