base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/003.yaml
  text: Then Yahweh said to Isaiah[a], “Go out now to meet Ahaz, you and Shear-jashub your son, at the end of the conduit of the upper pool[b], on the road to the launderer’s field.”
translation:
  language: pt
  text: 'Então Yahweh disse a Isaías: “Saia agora ao encontro de Acaz, você e seu filho Sear-Jasube[a], até a extremidade do canal do reservatório superior, na estrada que leva ao campo do lavadeiro[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sear-Jasube significa “Um remanescente voltará”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “campo do pisoeiro”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: צֵא נָא
  choice: Saia agora
  rationale: O imperativo צֵא ordena sair, e נָא acrescenta urgência ou cortesia; “agora” comunica naturalmente essa força no contexto.
- source_word: לִקְרַאת
  choice: ao encontro de
  rationale: 'O infinitivo com ל expressa a finalidade da saída de Isaías: encontrar Acaz.'
- source_word: שְׁאָר יָשׁוּב
  choice: Sear-Jasube
  rationale: Por ser nome pessoal, é transliterado no texto; seu significado temático é preservado em nota.
- source_word: תְּעָלַת
  choice: canal
  rationale: Designa um canal artificial de água; “canal” é claro e corrente em português.
- source_word: הַבְּרֵכָה הָעֶלְיוֹנָה
  choice: o açude superior
  rationale: בְּרֵכָה indica uma piscina ou reservatório; “açude” mantém a ideia de depósito de água e é tradicionalmente inteligível no contexto, enquanto “superior” preserva a indicação topográfica.
- source_word: מְסִלַּת
  choice: na estrada
  rationale: O substantivo pode indicar estrada elevada ou via; “estrada” é natural e suficiente nesta descrição de localização.
- source_word: שְׂדֵה כוֹבֵס
  choice: campo do lavadeiro
  rationale: כּוֹבֵס designa quem lava ou limpa tecidos; “lavadeiro” conserva a ocupação sem recorrer ao menos conhecido “pisoeiro”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O hebraico traz diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural para leitores brasileiros e compreensão internacional. O nome próprio Sear-Jasube é transliterado e explicado; a descrição topográfica permanece concisa.
