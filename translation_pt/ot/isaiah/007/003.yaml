    issue: “Açude” para הַבְּרֵכָה
    rationale: Embora possa referir-se a uma reserva de água em certos usos, “açude” é regionalmente associado a represa/barragem. “Reservatório” comunica de modo mais amplo e preciso a piscina ou reserva artificial de água do hebraico.
  - severity: low
    issue: “na estrada do campo do lavadeiro”
    rationale: A construção é compreensível, mas pode soar como uma estrada localizada dentro do campo. “na estrada que leva ao campo do lavadeiro” expressa com maior clareza a relação da estrada com o campo.
