base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/006.yaml
  text: All of us[a], like sheep, have gone astray; each of us has turned to his own way[c][b]; and Yahweh has laid on him the iniquity of us all.
translation:
  language: pt
  text: Todos nós, como ovelhas, nos desviamos; cada um de nós se voltou para o seu próprio caminho[a]; e Yahweh fez recair sobre ele[b] a iniquidade[c] de todos nós.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “cada homem, para o seu caminho, nos voltamos”. O hebraico usa “cada homem” no singular masculino com sentido distributivo; no contexto, refere-se a todos.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “fez com que a iniquidade de todos nós o atingisse” ou “viesse ao encontro dele”. O verbo hebraico pode indicar que algo é levado a encontrar, atingir ou recair sobre alguém.'
    reason: alternative_reading
  - marker: c
    text: “Iniquidade” também pode significar “culpa” e, por extensão, a responsabilidade ou a punição decorrente da culpa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּנוּ
  choice: Todos nós / de todos nós
  rationale: Preserva a totalidade enfática que abre e encerra o versículo, formando uma inclusão verbal natural em português.
- source_word: כַּצֹּאן
  choice: como ovelhas
  rationale: Mantém de modo idiomático a comparação com o rebanho.
- source_word: תָּעִינוּ
  choice: nos desviamos
  rationale: Expressa tanto o afastamento do caminho correto quanto a imagem de ovelhas desgarradas, sem acrescentar detalhes ausentes do hebraico.
- source_word: אִישׁ לְדַרְכּוֹ פָּנִינוּ
  choice: cada um de nós se voltou para o seu próprio caminho
  rationale: Reproduz a força distributiva de אִישׁ no contexto de כֻּלָּנוּ e conserva a imagem moral de דֶּרֶךְ. A formulação portuguesa explicita naturalmente que cada integrante do grupo está em vista.
- source_word: וַיהוָה
  choice: e Yahweh
  rationale: Mantém a conjunção hebraica e representa o nome divino como nome próprio, sem substituí-lo por um título.
- source_word: הִפְגִּיעַ בּוֹ
  choice: fez recair sobre ele
  rationale: 'Comunica de forma clara o hifil causativo: Yahweh faz com que a iniquidade chegue, recaia ou converja sobre o servo, preservando alternativas em nota.'
- source_word: עֲוֺן
  choice: iniquidade
  rationale: Conserva a gravidade moral e a amplitude semântica do termo, que pode abranger o ato perverso, a culpa e suas consequências.
theological_decisions:
- issue: A relação entre a iniquidade coletiva e o servo
  choice: Yahweh fez recair sobre ele a iniquidade de todos nós
  alternative: Yahweh fez a culpa ou a punição de todos nós atingir/convergir sobre ele
  rationale: A tradução mantém a clara dimensão vicária do enunciado, mas não define além do hebraico se עָוֹן enfatiza o pecado, a culpa ou a consequência penal.
- issue: O singular distributivo אִישׁ
  choice: cada um de nós
  alternative: cada homem / cada pessoa
  rationale: No contexto delimitado por “todos nós”, a expressão portuguesa preserva a referência individual e universal do singular distributivo sem sugerir indevidamente apenas pessoas do sexo masculino.
translation_notes:
  register: Português atual, digno e amplamente inteligível, com fluidez brasileira sem regionalismos marcados. A estrutura paralela e a repetição de “todos nós” preservam a ênfase e o enquadramento do hebraico; as notas mantêm as ambiguidades lexicais relevantes.
