  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מֵ/עֹ֤צֶר וּ/מִ/מִּשְׁפָּט֙ לֻקָּ֔ח וְ/אֶת דּוֹר֖/וֹ מִ֣י יְשׂוֹחֵ֑חַ כִּ֤י נִגְזַר֙ מֵ/אֶ֣רֶץ חַיִּ֔ים מִ/פֶּ֥שַׁע עַמִּ֖/י נֶ֥גַע לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/008.yaml
  text: By oppression and judgment he was taken away[a]; and as for his generation, who considered that he was cut off from the land of the living[c][b], stricken for the transgression of my people?
translation:
  language: pt
  text: Por opressão e julgamento ele foi levado; e, quanto à sua geração, quem considerou[a] que ele foi cortado da terra dos vivos, atingido por causa da transgressão do meu povo?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “quem falou de”, “quem declarou” ou “quem ponderou sobre” sua geração; o verbo hebraico é raro e difícil. “Sua geração” pode indicar seus contemporâneos, seus descendentes ou, de modo mais amplo, seu destino ou tempo de vida.
    reason: lexical_alternative
  - marker: b
    text: Ou “por causa da transgressão do meu povo, o golpe caiu sobre ele”. O hebraico לָמוֹ tem forma plural, mas pode funcionar poeticamente como singular; alguns o entendem como “sobre eles”.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעֹצֶר
  choice: Por opressão
  rationale: עֹצֶר pode indicar restrição, detenção ou confinamento opressivo. No contexto, em paralelo com מִשְׁפָּט e seguido por “foi levado”, “opressão” comunica melhor o tratamento coercitivo, enquanto “por” preserva o possível valor instrumental de מִן.
- source_word: וּמִמִּשְׁפָּט
  choice: e julgamento
  rationale: מִשְׁפָּט pode significar julgamento, justiça, decisão ou processo judicial. “Julgamento” mantém o sentido jurídico sem determinar se o processo foi justo ou injusto.
- source_word: לֻקָּח
  choice: ele foi levado
  rationale: O passivo de לקח indica que ele foi tomado ou removido. “Foi levado” é natural em português e não explicita além do texto a natureza exata dessa remoção.
- source_word: וְאֶת־דּוֹרוֹ
  choice: e, quanto à sua geração
  rationale: A construção hebraica é difícil e põe דּוֹרוֹ em destaque. A formulação tópica “quanto à sua geração” reproduz essa ênfase e mantém “geração” sem restringi-la a contemporâneos, descendentes ou tempo de vida.
- source_word: מִי יְשׂוֹחֵחַ
  choice: quem considerou
  rationale: O verbo é raro e seu sentido é discutido. “Considerou” se ajusta à pergunta retórica e permite entender a oração seguinte como aquilo que não foi ponderado; outras possibilidades lexicais são registradas em nota.
- source_word: כִּי
  choice: que
  rationale: 'Aqui כִּי pode introduzir o conteúdo da consideração: “quem considerou que...?”. Essa leitura produz uma sintaxe clara em português sem eliminar a dificuldade do verbo anterior.'
- source_word: נִגְזַר
  choice: ele foi cortado
  rationale: O nifal de גזר comunica ser cortado ou separado. “Cortado” preserva a imagem e, em ligação com “a terra dos vivos”, sugere a morte sem substituí-la por uma explicação.
- source_word: מֵאֶרֶץ חַיִּים
  choice: da terra dos vivos
  rationale: A expressão hebraica designa o âmbito dos que vivem. A tradução conserva sua imagem tradicional e é compreensível em português atual.
- source_word: מִפֶּשַׁע עַמִּי
  choice: por causa da transgressão do meu povo
  rationale: פֶּשַׁע expressa transgressão ou rebelião. “Por causa de” torna explícito o provável valor causal de מִן, sem definir em termos dogmáticos a natureza dessa relação.
- source_word: נֶגַע לָמוֹ
  choice: atingido
  rationale: נֶגַע é substantivo e pode significar golpe, ferida, praga ou aflição; לָמוֹ é formalmente plural, embora possa ter uso poético singular. “Atingido” fornece uma oração portuguesa concisa referida ao servo, enquanto a forma nominal e a ambiguidade de número são preservadas em nota.
theological_decisions:
- issue: Referente e número de לָמוֹ na oração final
  choice: 'Sentido singular, referido ao servo: “atingido por causa da transgressão do meu povo”'
  alternative: “o golpe caiu sobre ele” ou “o golpe caiu sobre eles”
  rationale: Embora לָמוֹ tenha forma plural, pode funcionar poeticamente com referência singular, e o servo permanece singular no contexto imediato. Como a construção admite outra análise, a nota conserva tanto a tradução nominal quanto a possibilidade plural.
- issue: Sentido de דּוֹר em “sua geração”
  choice: Manter o termo amplo “geração”
  alternative: Seus contemporâneos, seus descendentes ou seu destino/tempo de vida
  rationale: O hebraico permite mais de uma delimitação. A tradução principal não seleciona uma delas, evitando impor uma interpretação histórica ou teológica mais estreita.
- issue: Sentido do verbo יְשׂוֹחֵחַ
  choice: “considerou”
  alternative: “falou de”, “declarou” ou “ponderou”
  rationale: O verbo é raro e lexicalmente incerto. “Considerou” oferece uma leitura coerente da pergunta, mas a nota mantém as alternativas genuínas.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com leitura natural no Brasil. Mantiveram-se a concisão e as imagens hebraicas, evitando linguagem excessivamente arcaica. As ambiguidades de יְשׂוֹחֵחַ, דּוֹר e לָמוֹ foram preservadas por meio de notas, sem impor uma leitura denominacional.
