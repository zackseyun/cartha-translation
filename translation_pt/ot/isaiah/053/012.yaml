id: ISA.53.12
reference: Isaiah 53:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵ֞ן אֲחַלֶּק ל֣/וֹ בָ/רַבִּ֗ים וְ/אֶת עֲצוּמִים֮ יְחַלֵּ֣ק שָׁלָל֒ תַּ֗חַת אֲשֶׁ֨ר הֶעֱרָ֤ה לַ/מָּ֨וֶת֙ נַפְשׁ֔/וֹ וְ/אֶת פֹּשְׁעִ֖ים נִמְנָ֑ה וְ/הוּא֙ חֵטְא רַבִּ֣ים נָשָׂ֔א וְ/לַ/פֹּשְׁעִ֖ים יַפְגִּֽיעַ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/012.yaml
  text: Therefore I will allot him a portion among the many[a], and he will divide plunder with the strong, because he poured out his life to death and was numbered with transgressors[c][b]; yet he bore the sin of many and intercedes for transgressors.
translation:
  language: pt
  text: Por isso, darei a ele uma porção entre os muitos[a], e ele repartirá o despojo com os fortes, porque derramou sua vida até a morte e foi contado entre os transgressores[b]; contudo, levou sobre si o pecado de muitos e intercede pelos transgressores[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “darei a ele uma parte com os muitos”. A primeira oração é compacta no hebraico e admite mais de uma interpretação próxima.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “foi incluído entre os transgressores”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “roga pelos transgressores”. O verbo hebraico pode indicar interceder ou fazer uma súplica em favor de alguém.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Marca a conclusão decorrente do sofrimento e da vindicação do servo, em português natural.
- source_word: אֲחַלֶּק לוֹ בָרַבִּים
  choice: darei a ele uma porção entre os muitos
  rationale: Expressa a ideia de atribuir uma parte, preservando a construção compacta e ambígua do hebraico sem fazer dos muitos, de modo inequívoco, a própria porção.
- source_word: עֲצוּמִים
  choice: os fortes
  rationale: Conserva o sentido mais comum de pessoas fortes ou poderosas e corresponde à imagem de repartição do despojo.
- source_word: יְחַלֵּק שָׁלָל
  choice: repartirá o despojo
  rationale: Formulação corrente em português para a imagem militar de dividir os bens tomados na vitória.
- source_word: תַּחַת אֲשֶׁר
  choice: porque
  rationale: Comunica com naturalidade a relação causal entre a entrega do servo e sua exaltação.
- source_word: הֶעֱרָה לַמָּוֶת נַפְשׁוֹ
  choice: derramou sua vida até a morte
  rationale: Mantém a metáfora de derramar e traduz נפשׁ como vida, adequada ao ato de entregar a própria existência à morte.
- source_word: וְאֶת פֹּשְׁעִים נִמְנָה
  choice: foi contado entre os transgressores
  rationale: Preserva o sentido passivo de ser considerado parte desse grupo e a força moral e jurídica de פשׁע.
- source_word: חֵטְא רַבִּים נָשָׂא
  choice: levou sobre si o pecado de muitos
  rationale: Retém a imagem de carregar o pecado e sua possível força representativa ou sacrificial sem a reduzir a uma formulação doutrinária posterior.
- source_word: וְלַפֹּשְׁעִים יַפְגִּיעַ
  choice: intercede pelos transgressores
  rationale: O Hiphil de פגע, com לְ, admite o sentido de interceder ou rogar; o presente preserva o aspecto não estritamente delimitado do imperfeito hebraico.
theological_decisions:
- issue: Alcance de רַבִּים
  choice: Traduzir como “muitos” sem definir se equivale retoricamente a todos ou indica um grupo limitado.
  alternative: todos; a multidão
  rationale: O hebraico diz “muitos”; conservar essa forma evita impor uma conclusão teológica sobre seu alcance.
- issue: Linguagem de expiação em נָשָׂא חֵטְא
  choice: “levou sobre si o pecado de muitos”
  alternative: tirou o pecado de muitos; sofreu o castigo por muitos
  rationale: A tradução mantém a imagem representativa e possivelmente sacrificial, mas não a expande em uma teoria específica da expiação.
- issue: Valor temporal e sentido de יַפְגִּיעַ
  choice: “intercede pelos transgressores”
  alternative: intercedeu pelos transgressores; roga pelos transgressores
  rationale: O imperfeito hebraico permite uma apresentação não limitada ao passado; o presente conserva essa abertura sem definir a duração ou o modo da intercessão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem das notas foi normalizada segundo sua ocorrência no texto. “Despojo”, “transgressores” e “intercede” preservam o registro bíblico sem recorrer a formulações arcaicas.
