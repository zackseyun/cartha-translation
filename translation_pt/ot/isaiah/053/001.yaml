  text: מִ֥י הֶאֱמִ֖ין לִ/שְׁמֻעָתֵ֑/נוּ וּ/זְר֥וֹעַ יְהוָ֖ה עַל מִ֥י נִגְלָֽתָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/001.yaml
  text: Who has believed our report[a], and to whom has the arm of Yahweh been revealed?
translation:
  language: pt
  text: Quem creu em nosso relato[a]? E a quem foi revelado o braço de Yahweh?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nossa mensagem” ou “o que ouvimos”. O termo hebraico pode se referir ao que foi ouvido, relatado ou proclamado.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי הֶאֱמִין
  choice: Quem creu
  rationale: A pergunta retórica hebraica é reproduzida diretamente. O pretérito perfeito é natural em português e expressa a pergunta sobre quem efetivamente deu crédito.
- source_word: לִשְׁמֻעָתֵנוּ
  choice: no que ouvimos
  rationale: שְׁמוּעָה pode designar aquilo que se ouviu, uma notícia, um relato ou uma mensagem. A formulação preserva a relação lexical com ouvir e a participação do sufixo de primeira pessoa plural, sem restringir indevidamente o sentido.
- source_word: וּזְרוֹעַ
  choice: E ... o braço
  rationale: Mantém a metáfora concreta do hebraico, que evoca a força de Yahweh manifestada em seus atos, em vez de substituí-la pela interpretação 'poder'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: עַל מִי נִגְלָתָה
  choice: a quem foi revelado
  rationale: Expressa em português corrente o destinatário da revelação e conserva a voz passiva do nifal de גלה.
theological_decisions:
- issue: Metáfora do braço de Yahweh
  choice: Conservar 'o braço de Yahweh' no texto principal
  alternative: o poder de Yahweh
  rationale: A imagem bíblica reúne força, ação e poder salvador. Traduzir apenas por 'poder' eliminaria a metáfora e enfraqueceria suas ligações com outros textos.
- issue: Amplitude semântica de שְׁמוּעָה
  choice: no que ouvimos
  alternative: em nosso relato; em nossa mensagem; na notícia que anunciamos
  rationale: O hebraico admite tanto o que é ouvido quanto o relato ou mensagem transmitida. A escolha conserva essa tensão sem definir explicitamente se o 'nós' ouviu, relatou ou proclamou, e a nota registra alternativas naturais.
translation_notes:
  register: Português moderno, claro e digno, com estrutura retórica em duas perguntas. 'Yahweh' preserva o nome próprio; 'braço' mantém a imagem profética. A divisão em duas perguntas favorece a leitura natural sem alterar o paralelismo.
