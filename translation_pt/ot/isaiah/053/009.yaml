  text: וַ/יִּתֵּ֤ן אֶת רְשָׁעִים֙ קִבְר֔/וֹ וְ/אֶת עָשִׁ֖יר בְּ/מֹתָ֑י/ו עַ֚ל לֹא חָמָ֣ס עָשָׂ֔ה וְ/לֹ֥א מִרְמָ֖ה בְּ/פִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/009.yaml
  text: And they assigned his grave with the wicked[a], and with a rich man in his deaths, although he had done no violence[b], and no deceit was in his mouth.
translation:
  language: pt
  text: Designaram sua sepultura junto dos perversos[a] e, em suas mortes[b], junto de um rico, embora ele não tivesse cometido violência, nem houvesse engano em sua boca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Sua sepultura foi designada junto dos perversos”. O verbo hebraico significa literalmente “deu”, “pôs” ou “estabeleceu”, e o sujeito não é explicitado.'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “em suas mortes”. Muitos entendem a expressão idiomaticamente como “em sua morte” ou “quando morreu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Designaram
  rationale: O verbo significa literalmente “deu”, “pôs” ou “estabeleceu”, mas aqui comunica a destinação da sepultura. A terceira pessoa do plural com sentido impessoal evita identificar um sujeito que o hebraico não explicita.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: Expressa de modo claro e atual o substantivo plural referente a pessoas moralmente culpadas, preservando a categoria moral do hebraico.
- source_word: קִבְרוֹ
  choice: sua sepultura
  rationale: Equivalente direto de קֶבֶר, que pode designar a sepultura ou o lugar de sepultamento.
- source_word: עָשִׁיר
  choice: um rico
  rationale: Preserva o singular substantivado e a referência pessoal sem acrescentar identificação não presente no texto.
- source_word: בְּמֹתָיו
  choice: em suas mortes
  rationale: Mantém o plural morfológico incomum do texto hebraico; a leitura idiomática no singular é indicada em nota.
- source_word: עַל
  choice: embora
  rationale: 'No contexto, introduz uma circunstância concessiva: ele recebeu tal destinação de sepultura apesar de não ter praticado violência nem engano.'
- source_word: חָמָס
  choice: violência
  rationale: É o equivalente direto e consagrado para violência ou maldade violenta.
- source_word: מִרְמָה
  choice: engano
  rationale: Termo moderno e abrangente para falsidade ou fraude, adequado ao paralelismo moral do verso.
- source_word: בְּפִיו
  choice: em sua boca
  rationale: Preserva a imagem hebraica aplicada à fala sem acrescentar o verbo “achar”, ausente do texto.
theological_decisions:
- issue: O plural incomum בְּמֹתָיו na passagem sobre o servo
  choice: Manter “em suas mortes” no texto principal.
  alternative: “em sua morte” ou “quando morreu”
  rationale: A forma hebraica é plural. Mantê-la preserva uma particularidade textual potencialmente significativa sem a harmonizar por interpretação; a alternativa idiomática fica registrada em nota.
- issue: O sujeito não expresso de וַיִּתֵּן
  choice: Empregar o plural impessoal “Designaram”.
  alternative: “Ele designou” ou “sua sepultura foi designada”
  rationale: O hebraico usa uma forma verbal de terceira pessoa masculina singular, mas não identifica claramente o sujeito. A construção portuguesa impessoal preserva essa indeterminação sem atribuir a ação a Deus, ao servo ou a outro agente específico.
- issue: A relação lógica introduzida por עַל
  choice: 'Traduzir com valor concessivo: “embora”.'
  alternative: “porque”, “por causa de” ou “apesar de”
  rationale: O contexto contrasta o tratamento dado ao servo com sua inocência. A opção concessiva torna essa relação natural em português sem alterar as afirmações do verso.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a concisão poética e duas dificuldades reais do hebraico — o sujeito verbal não expresso e o plural “mortes” — sem lhes impor uma solução doutrinária.
