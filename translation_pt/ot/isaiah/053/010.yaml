id: ISA.53.10
reference: Isaiah 53:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יהוָ֞ה חָפֵ֤ץ דַּכְּא/וֹ֙ הֶֽחֱלִ֔י אִם תָּשִׂ֤ים אָשָׁם֙ נַפְשׁ֔/וֹ יִרְאֶ֥ה זֶ֖רַע יַאֲרִ֣יךְ יָמִ֑ים וְ/חֵ֥פֶץ יְהוָ֖ה בְּ/יָד֥/וֹ יִצְלָֽח־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/010.yaml
  text: Yet it pleased Yahweh to crush him[a]; he made him sick. If his life makes a guilt offering, he will see offspring, he will prolong his days[e][d][c][b], and the pleasure of Yahweh will prosper in his hand.
translation:
  language: pt
  text: Contudo, agradou a Yahweh esmagá-lo[a]; ele o fez adoecer[b]. Se fizeres da vida dele uma oferta pela culpa[c][d], ele verá descendência, prolongará os seus dias, e o propósito de Yahweh prosperará por meio dele[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E Yahweh” ou “Mas Yahweh”. A conjunção hebraica admite diferentes traduções conforme o fluxo do discurso.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ele o afligiu” ou “ele lhe causou sofrimento”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “Quando a vida dele for feita uma oferta pela culpa” ou “Se a vida dele se tornar uma oferta pela culpa”. O hebraico desta oração é difícil, sobretudo quanto ao sujeito de “fazer”; a forma verbal também pode ser entendida de outras maneiras.'
    reason: alternative_reading
  - marker: d
    text: A “oferta pela culpa” era o sacrifício de reparação por culpa prescrito na Torá.
    reason: cultural_note
  - marker: e
    text: 'Hebraico: “prosperará em sua mão”. Também se pode traduzir: “a vontade” ou “o agrado de Yahweh terá êxito por meio dele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: Contudo, ... Yahweh
  rationale: A conjunção pode ser simples ('e'), mas aqui admite valor contrastivo em relação ao sofrimento descrito antes. 'Contudo' expressa esse fluxo sem eliminar as alternativas.
- source_word: חָפֵץ
  choice: agradou
  rationale: Preserva a força difícil do verbo, que pode envolver agrado, vontade ou propósito, sem suavizar a agência divina.
- source_word: דַּכְּאוֹ
  choice: esmagá-lo
  rationale: Expressa melhor a intensidade do verbo do que 'feri-lo' ou 'machucá-lo'.
- source_word: הֶחֱלִי
  choice: ele o fez adoecer
  rationale: O causativo de חלה indica fazer adoecer ou afligir. A formulação concreta permanece próxima do hebraico.
- source_word: אִם תָּשִׂים אָשָׁם נַפְשׁוֹ
  choice: Se a vida dele se oferecer como oferta pela culpa
  rationale: A oração é sintaticamente difícil. A construção reflexiva em português mantém 'a vida dele' como sujeito gramatical e comunica o sentido sacrificial sem decidir silenciosamente entre todas as análises possíveis.
- source_word: יִרְאֶה זֶרַע
  choice: ele verá descendência
  rationale: '''Descendência'' comunica o sentido coletivo de זֶרַע sem impor que se trate necessariamente de filhos biológicos imediatos.'
- source_word: יַאֲרִיךְ יָמִים
  choice: prolongará os seus dias
  rationale: Mantém visível o idioma hebraico de vida prolongada e continua natural em português.
- source_word: וְחֵפֶץ יְהוָה
  choice: e o propósito de Yahweh
  rationale: Neste segundo uso, 'propósito' comunica com clareza vontade ou desígnio eficaz. A nota registra 'agrado/vontade' para preservar o vínculo lexical com חָפֵץ no início.
- source_word: בְּיָדוֹ יִצְלָח
  choice: prosperará por meio dele
  rationale: Traduz idiomaticamente a imagem hebraica 'em/por sua mão' como expressão de agência, registrando a forma literal em nota.
theological_decisions:
- issue: Agência divina no sofrimento do servo
  choice: 'Atribuição direta: ''agradou a Yahweh esmagá-lo; ele o fez adoecer''.'
  alternative: Yahweh permitiu que ele fosse esmagado ou afligido.
  rationale: Os verbos hebraicos apresentam agência divina direta. Reduzi-la a mera permissão introduziria uma mitigação teológica não expressa no texto; ao mesmo tempo, 'agradou' pode incluir vontade e propósito, não necessariamente prazer cruel.
- issue: Sujeito e sentido da oração sobre a oferta pela culpa
  choice: Se a vida dele se oferecer como oferta pela culpa.
  alternative: Se tu fizeres da vida dele uma oferta pela culpa; quando a vida dele for feita oferta pela culpa.
  rationale: A forma תָּשִׂים e sua relação com נַפְשׁוֹ permitem análises diferentes. O texto principal adota uma leitura defensável, enquanto a nota conserva explicitamente as principais alternativas.
- issue: Continuidade entre חָפֵץ verbal e nominal
  choice: '''agradou'' no primeiro membro e ''propósito'' no último.'
  alternative: '''quis'' e ''vontade'', ou ''agradou'' e ''agrado''.'
  rationale: A escolha busca naturalidade e clareza contextual em português, sem ocultar que os dois termos pertencem à mesma raiz; essa ligação é indicada na nota.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. Mantém 'Yahweh' conforme a camada inglesa fornecida e conserva a dureza da agência divina. As notas preservam as ambiguidades sintáticas e lexicais reais sem impor uma leitura denominacional.
