  text: וְ/הוּא֙ מְחֹלָ֣ל מִ/פְּשָׁעֵ֔/נוּ מְדֻכָּ֖א מֵ/עֲוֺנֹתֵ֑י/נוּ מוּסַ֤ר שְׁלוֹמֵ֨/נוּ֙ עָלָ֔י/ו וּ/בַ/חֲבֻרָת֖/וֹ נִרְפָּא לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/005.yaml
  text: But he was pierced because of our transgressions[a]; he was crushed because of our iniquities; the chastisement for our peace was upon him[c][b], and by his wound we are healed.
translation:
  language: pt
  text: Mas ele foi traspassado por causa das nossas transgressões[a] e esmagado por causa das nossas iniquidades; o castigo que nos trouxe paz estava sobre ele[b], e por sua ferida fomos curados[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ferido”. O termo hebraico pode indicar alguém ferido ou traspassado; “traspassado” preserva a violência concreta da imagem.
    reason: lexical_alternative
  - marker: b
    text: “Paz” também pode incluir bem-estar e integridade.
    reason: lexical_alternative
  - marker: c
    text: Ou “por seu vergão” ou “por sua contusão”. O substantivo hebraico está no singular.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Mas ele
  rationale: 'O contexto favorece valor adversativo: contrasta a avaliação equivocada anterior com a verdadeira causa do sofrimento do servo.'
- source_word: מְחֹלָל
  choice: traspassado
  rationale: No contexto de sofrimento corporal e em paralelo com מְדֻכָּא, indica ferimento violento; “traspassado” conserva a concretude da imagem, enquanto “ferido” permanece alternativa legítima.
- source_word: מִפְּשָׁעֵנוּ
  choice: por causa das nossas transgressões
  rationale: A preposição מִן expressa aqui a causa do sofrimento, e “transgressões” preserva a ideia de rebelião ou violação deliberada.
- source_word: מְדֻכָּא
  choice: esmagado
  rationale: Transmite a intensidade de דכא melhor que opções mais brandas como “machucado” ou “ferido”.
- source_word: מֵעֲוֺנֹתֵינוּ
  choice: por causa das nossas iniquidades
  rationale: Mantém o sentido causal e distingue עָוֹן de פֶּשַׁע, preservando seu peso moral.
- source_word: מוּסַר
  choice: castigo
  rationale: No contexto do sofrimento suportado pelo servo, denota aflição punitiva. “Castigo” é corrente e digno em português, sem desenvolver uma teoria expiatória além do texto.
- source_word: שְׁלוֹמֵנוּ
  choice: que nos trouxe paz
  rationale: Expressa naturalmente a relação entre o castigo sobre ele e a paz destinada a nós. “Paz” mantém a formulação direta, com a amplitude de bem-estar e integridade indicada em nota.
- source_word: עָלָיו
  choice: estava sobre ele
  rationale: Preserva a imagem hebraica do castigo colocado ou recaindo sobre o servo.
- source_word: וּבַחֲבֻרָתוֹ
  choice: por sua ferida
  rationale: Mantém o substantivo no singular e usa uma expressão natural no português moderno; o termo pode também referir-se à marca ou contusão produzida por um golpe.
- source_word: נִרְפָּא לָנוּ
  choice: fomos curados
  rationale: Embora a construção hebraica seja incomum, seu sentido idiomático no contexto é que a cura chegou a nós. O passado harmoniza naturalmente a afirmação com os verbos anteriores sem restringir a natureza da cura.
theological_decisions:
- issue: Relação entre o sofrimento do servo e os pecados dos demais
  choice: 'Empregar linguagem causal e vicária: ele sofre por causa das transgressões e iniquidades alheias.'
  alternative: Reduzir o sofrimento a mero exemplo moral ou explicitar uma teoria penal da expiação além da formulação do versículo.
  rationale: O hebraico vincula diretamente o sofrimento do servo aos pecados do povo e à paz e cura recebidas por este, mas não detalha neste versículo todo o mecanismo teológico dessa relação.
- issue: Amplitude de “paz” e “cura”
  choice: Conservar “paz” e “curados” como termos amplos de restauração.
  alternative: Limitar o sentido exclusivamente à cura física, ao perdão espiritual ou à prosperidade material.
  rationale: שָׁלוֹם abrange paz, integridade e bem-estar, e רפא pode funcionar metaforicamente; o contexto não exige redução a uma única dimensão.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural para leitores brasileiros. Evitaram-se tanto arcaísmos como “chaga” e “açoite” quanto explicitações doutrinárias não exigidas pelo hebraico. Todos os marcadores de nota aparecem no texto principal.
