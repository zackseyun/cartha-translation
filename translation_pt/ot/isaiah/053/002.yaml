source:
  edition: WLC
  text: וַ/יַּ֨עַל כַּ/יּוֹנֵ֜ק לְ/פָנָ֗י/ו וְ/כַ/שֹּׁ֨רֶשׁ֙ מֵ/אֶ֣רֶץ צִיָּ֔ה לֹא תֹ֥אַר ל֖/וֹ וְ/לֹ֣א הָדָ֑ר וְ/נִרְאֵ֥/הוּ וְ/לֹֽא מַרְאֶ֖ה וְ/נֶחְמְדֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/002.yaml
  text: For he grew up before him like a young plant[a], and like a root out of dry ground. He had no form or majesty that we should look at him[c][b], and no appearance that we should desire him.
translation:
  language: pt
  text: Pois ele cresceu diante dele[a] como um broto novo[b] e como uma raiz que brota de terra seca. Não tinha forma nem majestade para que o olhássemos[c], nem aparência para que o desejássemos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “diante dele”. O referente pode ser entendido como o SENHOR, mas não é repetido explicitamente neste versículo.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “como um rebento tenro”. O hebraico יוֹנֵק pode designar um broto ou rebento jovem e tenro.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou, mais literalmente: “e nós o vimos, e não havia aparência para que o desejássemos”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַל
  choice: cresceu
  rationale: Embora עלה signifique literalmente “subir” ou “surgir”, na imagem vegetal descreve naturalmente o crescimento ou despontar da planta. “Cresceu” também se ajusta ao desenvolvimento do servo no contexto.
- source_word: כַּיּוֹנֵק
  choice: como um broto novo
  rationale: יוֹנֵק pode designar um rebento tenro ou jovem. Em paralelo com a raiz que sai de terra seca, o sentido botânico é claro; “broto novo” é concreto e compreensível em português atual.
- source_word: לְפָנָיו
  choice: diante dele
  rationale: Mantém o sentido literal da expressão hebraica e preserva a ambiguidade do pronome masculino singular, sem identificar explicitamente seu referente.
- source_word: וְכַשֹּׁרֶשׁ
  choice: e como uma raiz
  rationale: שֹׁרֶשׁ é o termo comum para “raiz”. A tradução mantém a imagem vegetal concreta, ainda que incomum.
- source_word: מֵאֶרֶץ צִיָּה
  choice: que sai de terra seca
  rationale: No contexto agrícola, אֶרֶץ é naturalmente “terra”, enquanto צִיָּה indica aridez. A formulação comunica o surgimento improvável em solo sem umidade.
- source_word: לֹא תֹאַר לוֹ
  choice: Não tinha forma
  rationale: תֹאַר indica forma, contorno ou aspecto. O hebraico não traz verbo expresso; “tinha” produz português natural sem acrescentar a ideia mais restrita de beleza.
- source_word: וְלֹא הָדָר
  choice: nem majestade
  rationale: הָדָר pode significar majestade, esplendor ou imponência. “Majestade” preserva a ideia de grandeza visível sem transformá-la explicitamente em beleza física.
- source_word: וְנִרְאֵהוּ
  choice: para que olhássemos para ele
  rationale: No encadeamento da frase, a forma pode ser entendida como parte de uma construção que nega haver algo visualmente impressionante que atraísse o olhar. A leitura mais formal, “e nós o vimos”, é registrada em nota.
- source_word: וְלֹא מַרְאֶה
  choice: nem aparência
  rationale: מַרְאֶה designa aparência, aspecto ou aquilo que é visto. “Aparência” mantém a ênfase visual sem restringir o sentido a “beleza”.
- source_word: וְנֶחְמְדֵהוּ
  choice: para que o desejássemos
  rationale: חמד expressa desejar, considerar desejável ou ter prazer em algo. “Desejássemos” é direto e mantém a amplitude do termo.
theological_decisions:
- issue: Referente de לְפָנָיו (“diante dele”)
  choice: Manter “diante dele” sem identificar o referente no texto principal.
  alternative: “diante do SENHOR” ou, segundo outra reconstrução interpretativa, “diante de nós”
  rationale: O sufixo hebraico é masculino singular, mas o versículo não repete explicitamente seu antecedente. A formulação evita resolver uma ambiguidade que o texto preserva.
- issue: Alcance da falta de forma, majestade e aparência
  choice: Empregar termos ligados ao aspecto visível, sem expandir a descrição para condição social ou posição política.
  alternative: Explicitar falta de beleza, porte régio ou prestígio social.
  rationale: O vocabulário hebraico se concentra no que é visto. Implicações sociais ou régias podem ser consideradas na interpretação, mas não devem ser inseridas no texto traduzido.
- issue: Relação sintática de וְנִרְאֵהוּ com as cláusulas negativas
  choice: Traduzir contextualmente como “para que olhássemos para ele”.
  alternative: “e nós o vimos; não havia aparência para que o desejássemos”
  rationale: A opção principal produz uma frase portuguesa coerente e expressa a ausência de aspecto capaz de atrair o olhar; a alternativa mais estritamente formal permanece em nota para preservar a tensão sintática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação mantém a imagem vegetal concreta, o pronome ambíguo em “diante dele” e a linguagem visual do hebraico, evitando explicar no corpo do versículo quem é o referente ou que tipo específico de atratividade estaria ausente.
