base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/003.yaml
  text: He was despised and rejected by men[a], a man of pains and acquainted with sickness; and like one from whom people hide their faces, he was despised[d][c][b], and we did not esteem him.
translation:
  language: pt
  text: Desprezado e abandonado pelos homens[a], homem de dores[b] e familiarizado com a enfermidade[c]; como alguém de quem as pessoas escondem o rosto[d], foi desprezado, e não lhe demos valor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “rejeitado pelos homens”. A expressão hebraica é difícil e também pode sugerir alguém privado da companhia humana ou afastado das pessoas.
    reason: alternative_reading
  - marker: b
    text: Ou “homem de sofrimentos”.
    reason: lexical_alternative
  - marker: c
    text: Ou “conhecedor da doença”. A expressão indica familiaridade adquirida pela experiência, sem necessariamente afirmar que ele próprio fosse permanentemente doente.
    reason: lexical_alternative
  - marker: d
    text: 'O hebraico é elíptico: literalmente, algo como “como uma ocultação de rostos de diante dele”. O sentido provável é que as pessoas escondiam ou desviavam o próprio rosto de diante dele.'
    reason: cultural_note
lexical_decisions:
- source_word: נִבְזֶה
  choice: desprezado
  rationale: O particípio nifal de בזה expressa ser desprezado ou tratado com desdém; “desprezado” preserva com naturalidade o sentido passivo e resultativo.
- source_word: חֲדַל אִישִׁים
  choice: abandonado pelos homens
  rationale: A expressão hebraica é difícil. חדל sugere falta, afastamento ou abandono em relação às pessoas; “abandonado pelos homens” comunica a exclusão social sem reduzir a frase apenas a um ato pontual de rejeição.
- source_word: אִישׁ מַכְאֹבוֹת
  choice: homem de dores
  rationale: מַכְאֹב pode indicar dores, padecimentos ou sofrimentos. “Homem de dores” mantém a concretude e também a conhecida cadência bíblica, sem limitar as dores ao âmbito físico ou emocional.
- source_word: וִידוּעַ חֹלִי
  choice: familiarizado com a enfermidade
  rationale: A construção com ידע e חֹלִי descreve alguém intimamente conhecedor da enfermidade. “Familiarizado” é corrente e preserva a ideia de experiência próxima; “enfermidade” conserva o sentido concreto do substantivo.
- source_word: וּכְמַסְתֵּר פָּנִים מִמֶּנּוּ
  choice: era como alguém de quem as pessoas escondem o rosto
  rationale: O hebraico é elíptico, literalmente próximo de “como ocultação de rostos dele”. A formulação explicita apenas o sujeito humano implícito e preserva מִן como “de quem”, sem decidir pela alternativa textual ou sintática “de nós”.
- source_word: וְלֹא חֲשַׁבְנֻהוּ
  choice: não lhe demos valor
  rationale: חשב significa aqui considerar, avaliar ou estimar. A expressão portuguesa é natural e mantém o sentido confessional de que os falantes não reconheceram seu valor.
theological_decisions:
- issue: Interpretação messiânica/do servo
  choice: Manter o retrato do personagem nos termos próprios do poema, sem acrescentar identificação cristológica explícita.
  alternative: Inserir uma identificação ou expansão cristológica na tradução.
  rationale: A tradução não deve introduzir no versículo elementos ausentes do hebraico, embora sua redação permaneça aberta à leitura messiânica no contexto canônico.
- issue: Natureza dos sofrimentos
  choice: Empregar termos concretos, “dores” e “enfermidade”, preservando a amplitude do sofrimento descrito.
  alternative: Usar apenas abstrações como “tristezas” e “aflição”.
  rationale: Os termos hebraicos admitem dimensões corporais e emocionais. A redação evita restringir o sofrimento a doença física ou a pesar interior.
- issue: Sentido de חֲדַל אִישִׁים
  choice: Traduzir como “abandonado pelos homens”.
  alternative: “Rejeitado pelos homens”.
  rationale: A expressão é lexical e sintaticamente difícil. A escolha ressalta isolamento e abandono social, enquanto a alternativa tradicional é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A redação conserva o paralelismo poético, evita arcaísmos como “varão” e “não o estimamos”, e usa notas para preservar as ambiguidades reais do hebraico.
