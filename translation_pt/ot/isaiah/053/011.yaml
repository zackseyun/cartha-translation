  text: מֵ/עֲמַ֤ל נַפְשׁ/וֹ֙ יִרְאֶ֣ה יִשְׂבָּ֔ע בְּ/דַעְתּ֗/וֹ יַצְדִּ֥יק צַדִּ֛יק עַבְדִּ֖/י לָֽ/רַבִּ֑ים וַ/עֲוֺנֹתָ֖/ם ה֥וּא יִסְבֹּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/011.yaml
  text: From the anguish of his soul he will see and be satisfied[a]; by his knowledge my righteous servant will justify many[b], and he will bear their iniquities.
translation:
  language: pt
  text: Da angústia de sua alma, ele verá[a] e ficará satisfeito. Por seu conhecimento[b], meu servo justo justificará muitos, e ele levará as iniquidades deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns testemunhos antigos trazem: “verá a luz e ficará satisfeito”. O Texto Massorético diz apenas: “verá e ficará satisfeito”.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “pelo conhecimento dele”, entendendo a frase como referência a outros virem a conhecer o servo, e não ao conhecimento que o próprio servo possui.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעֲמַל נַפְשׁוֹ
  choice: Depois da angústia de sua alma
  rationale: עָמָל designa sofrimento, aflição ou penoso labor; “angústia” comunica aqui a aflição profunda do servo. “Depois de” expressa de modo natural em português a saída ou o resultado dessa experiência indicada por מִן, sem acrescentar ao verbo um objeto ausente no texto massorético.
- source_word: יִרְאֶה יִשְׂבָּע
  choice: ele verá e ficará satisfeito
  rationale: Mantém os dois verbos e deixa sem objeto o verbo “ver”, como no Texto Massorético. “Ficará satisfeito” transmite o valor resultativo de שׂבע.
- source_word: בְּדַעְתּוֹ
  choice: Por seu conhecimento
  rationale: Preserva a leitura instrumental mais direta, referente ao conhecimento do próprio servo, sem eliminar a possibilidade de entender a expressão como conhecimento acerca dele, registrada em nota.
- source_word: יַצְדִּיק
  choice: justificará
  rationale: O hifil de צדק pode significar declarar ou considerar justo. “Justificará” é conciso, corrente no vocabulário bíblico e não define além do hebraico o modo dessa ação.
- source_word: צַדִּיק עַבְדִּי
  choice: meu servo justo
  rationale: Toma צַדִּיק como qualificação atributiva do servo e conserva a ordem mais natural em português.
- source_word: לָרַבִּים
  choice: muitos
  rationale: Mantém o alcance expresso por רַבִּים, sem ampliá-lo para “todos” nem exigir o sentido coletivo de “os muitos”.
- source_word: וַעֲוֺנֹתָם הוּא יִסְבֹּל
  choice: e ele levará as iniquidades deles
  rationale: “Levará” comunica o ato de carregar ou suportar a culpa. O pronome explícito “ele” representa הוּא sem intensificá-lo artificialmente com “ele mesmo”; “iniquidades” preserva o peso moral de עָוֺן.
theological_decisions:
- issue: Sentido de בְּדַעְתּוֹ
  choice: “Por seu conhecimento”, referindo-se primariamente ao conhecimento do servo
  alternative: “Pelo conhecimento dele”, isto é, por outros conhecerem o servo
  rationale: A forma com sufixo admite discussão sobre quem conhece quem. A tradução principal segue a leitura subjetiva/instrumental mais imediata, enquanto a nota conserva a leitura objetiva sem decidir a tensão teológica.
- issue: Objeto de יִרְאֶה
  choice: “ele verá”, sem objeto expresso
  alternative: “ele verá a luz”, conforme alguns testemunhos antigos
  rationale: O texto hebraico fornecido, o Texto Massorético, não contém “luz”. A variante relevante é registrada em nota, mas não inserida no texto principal.
- issue: Alcance de לָרַבִּים
  choice: “muitos”
  alternative: “os muitos”
  rationale: A tradução mantém o termo hebraico sem harmonizá-lo teologicamente com “todos” e sem impor uma leitura coletiva definida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o vocabulário bíblico reconhecível (“servo justo”, “justificará”, “iniquidades”) sem arcaísmos desnecessários. As notas foram colocadas junto às expressões a que realmente se referem.
