  text: אָכֵ֤ן חֳלָיֵ֨/נוּ֙ ה֣וּא נָשָׂ֔א וּ/מַכְאֹבֵ֖י/נוּ סְבָלָ֑/ם וַ/אֲנַ֣חְנוּ חֲשַׁבְנֻ֔/הוּ נָג֛וּעַ מֻכֵּ֥ה אֱלֹהִ֖ים וּ/מְעֻנֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/004.yaml
  text: Surely he has borne our sicknesses and carried our pains[a]; yet we considered him stricken, struck by God[b], and afflicted.
translation:
  language: pt
  text: Certamente, ele levou sobre si as nossas enfermidades e carregou as nossas dores[a]; nós, porém, o considerávamos atingido, ferido por Deus[b] e afligido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os nossos sofrimentos” e “as nossas tristezas”. Em sentido mais literal, o hebraico se refere a enfermidades e dores.'
    reason: lexical_alternative
  - marker: b
    text: 'Tradução tradicional: “ferido de Deus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָכֵן
  choice: Certamente
  rationale: Expressa a afirmação enfática e introduz a correção da percepção humana apresentada na segunda metade do versículo.
- source_word: חֳלָיֵנוּ
  choice: as nossas enfermidades
  rationale: O substantivo denota primariamente doença ou enfermidade; a escolha mantém o sentido concreto do hebraico.
- source_word: נָשָׂא
  choice: levou sobre si
  rationale: Comunica tanto o ato de tomar quanto o de suportar um peso, em linguagem portuguesa natural e solene.
- source_word: וּמַכְאֹבֵינוּ
  choice: as nossas dores
  rationale: O termo designa dores, frequentemente físicas, sem excluir uma aplicação mais ampla ao sofrimento.
- source_word: סְבָלָם
  choice: carregou
  rationale: Preserva a imagem de transportar um peso e distingue este verbo do anterior.
- source_word: וַאֲנַחְנוּ
  choice: nós, porém
  rationale: Torna explícito o contraste contextual entre o que ele de fato carregava e a avaliação feita por nós.
- source_word: חֲשַׁבְנֻהוּ
  choice: o considerávamos
  rationale: Reproduz o sentido de reputar ou julgar e o aspecto da forma verbal hebraica, descrevendo a percepção mantida pelos observadores.
- source_word: נָגוּעַ
  choice: atingido
  rationale: Mantém a ideia de alguém alcançado por um golpe ou praga sem especificar indevidamente a natureza da aflição.
- source_word: מֻכֵּה אֱלֹהִים
  choice: ferido por Deus
  rationale: Expressa de modo direto e atual tanto o golpe quanto a agência divina, sem acrescentar a noção de ser derrubado.
- source_word: וּמְעֻנֶּה
  choice: e afligido
  rationale: Adequa-se ao contexto de sofrimento e conserva a amplitude do particípio, que também pode envolver humilhação ou opressão.
theological_decisions:
- issue: Se as cargas do servo devem ser traduzidas como enfermidades físicas ou como sofrimento emocional generalizado
  choice: Linguagem concreta de enfermidade e dor no texto principal
  alternative: “nossos sofrimentos” e “nossas tristezas”
  rationale: חֳלִי e מַכְאוֹב denotam mais diretamente enfermidade e dor. A tradução preserva essa concretude sem limitar as possíveis implicações mais amplas do texto.
- issue: Como representar a agência divina em מֻכֵּה אֱלֹהִים
  choice: “ferido por Deus”
  alternative: “castigado por Deus” ou “ferido da parte de Deus”
  rationale: A construção atribui claramente o golpe a Deus, mas não contém por si só um termo específico para castigo. Assim, a versão mantém a agência divina sem interpretar além do hebraico.
- issue: Relação entre a realidade do sofrimento do servo e a avaliação dos observadores
  choice: Manter o contraste por meio de “nós, porém” sem explicar se a avaliação era inteiramente correta ou equivocada
  alternative: Explicitar que os observadores estavam enganados quanto à causa do sofrimento
  rationale: O versículo contrasta aquilo que o servo carregava com aquilo que “nós” pensávamos, mas a tradução não deve resolver antecipadamente toda a tensão teológica dessa percepção.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Levou sobre si” conserva a imagem de suportar uma carga; “ferido por Deus” evita tanto o arcaísmo excessivo quanto a ampliação interpretativa de “castigado”.
