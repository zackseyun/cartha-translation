source:
  edition: WLC
  text: נִגַּ֨שׂ וְ/ה֣וּא נַעֲנֶה֮ וְ/לֹ֣א יִפְתַּח פִּי/ו֒ כַּ/שֶּׂה֙ לַ/טֶּ֣בַח יוּבָ֔ל וּ/כְ/רָחֵ֕ל לִ/פְנֵ֥י גֹזְזֶ֖י/הָ נֶאֱלָ֑מָה וְ/לֹ֥א יִפְתַּ֖ח פִּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/007.yaml
  text: He was oppressed[a], and he was afflicted, yet he did not open his mouth; like a lamb led to the slaughter, and like a ewe silent before her shearers, so he did not open his mouth.
translation:
  language: pt
  text: Ele foi oprimido[a] e afligido, mas não abriu a boca; como um cordeiro levado ao matadouro e como uma ovelha silenciosa diante dos que a tosquiam, assim ele não abriu a boca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele foi oprimido, mas humilhou-se”. O hebraico da frase inicial é difícil; algumas traduções entendem o segundo verbo no sentido reflexivo de humilhar-se ou submeter-se, em vez de ser afligido.'
    reason: alternative_reading
lexical_decisions:
- source_word: נִגַּשׂ
  choice: foi oprimido
  rationale: O nifal de נגשׂ expressa aqui submissão a tratamento duro ou opressão. “Foi oprimido” é claro, natural e adequado ao sofrimento injusto do servo.
- source_word: נַעֲנֶה
  choice: afligido
  rationale: No contexto, o verbo tem sentido passivo ou reflexivo ligado a aflição e humilhação, não a uma resposta verbal. A formulação mantém a dificuldade do hebraico indicada em nota.
- source_word: וְלֹא יִפְתַּח פִּיו
  choice: mas não abriu a boca
  rationale: “Mas” comunica a força concessiva da primeira ocorrência após a opressão e a aflição. A imagem literal de abrir a boca é clara em português e retém a repetição retórica.
- source_word: כַּשֶּׂה
  choice: como um cordeiro
  rationale: Embora שֶׂה possa designar genericamente um animal do rebanho miúdo, “cordeiro” comunica de modo natural a vulnerabilidade da figura conduzida ao abate.
- source_word: לַטֶּבַח יוּבָל
  choice: levado ao matadouro
  rationale: O hofal indica movimento sob o controle de outro. “Levado ao matadouro” é idiomático e preserva tanto a passividade quanto a direção da imagem.
- source_word: וּכְרָחֵל
  choice: e como uma ovelha
  rationale: רָחֵל designa especificamente a fêmea ovina. Em português corrente, “ovelha” preserva essa especificidade sem soar técnico.
- source_word: לִפְנֵי גֹזְזֶיהָ
  choice: diante dos que a tosquiam
  rationale: A expressão explicita naturalmente em português o particípio substantivado e conserva o sufixo feminino referente à ovelha.
- source_word: נֶאֱלָמָה
  choice: silenciosa
  rationale: O predicado descreve a quietude da ovelha. “Silenciosa” é atual e digna, evitando a possível conotação clínica de “muda”.
- source_word: וְלֹא יִפְתַּח פִּיו
  choice: assim ele não abriu a boca
  rationale: Na repetição conclusiva, “assim” torna explícita apenas a relação comparativa já presente no paralelismo hebraico e mantém integralmente o refrão.
theological_decisions:
- issue: Grau de especificidade messiânica na tradução
  choice: Traduzir segundo o sentido imediato do hebraico, sem inserir identificação cristológica explícita.
  alternative: Empregar linguagem tradicional mais diretamente moldada pelas citações do Novo Testamento.
  rationale: A imagem apresenta o sofrimento silencioso do servo por meio de comparação e repetição. A tradução preserva essa forma e deixa sua identificação teológica ao contexto e às referências canônicas, sem acrescentá-la ao texto.
- issue: Sentido de נַעֲנֶה na linha inicial
  choice: 'Entender como passivo: “afligido”.'
  alternative: 'Entender reflexivamente: “humilhou-se” ou “submeteu-se”.'
  rationale: O paralelismo com “foi oprimido” favorece o sofrimento passivo, mas a forma hebraica permite uma leitura reflexiva relevante; por isso, a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno e acessível; conserva a repetição enfática de “não abriu a boca” e evita vocabulário técnico ou confessional.
