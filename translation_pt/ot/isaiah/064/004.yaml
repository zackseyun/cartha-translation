base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/004.yaml
  text: You meet the one who gladly does righteousness[a], those who remember you in your ways. Behold, you were angry, and we sinned; in them we have been a long time[b], and shall we be saved?
translation:
  language: pt
  text: Tu vens ao encontro dos que se alegram e praticam a justiça[a], que se lembram de ti em teus caminhos. Eis que te iraste, e nós pecamos; neles estamos há muito tempo[b] — e seremos salvos?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tu vens ao encontro de quem se alegra e pratica a justiça”. Os particípios hebraicos podem ser entendidos conjuntamente como descrição da pessoa a quem Deus vem ao encontro.'
    reason: lexical_alternative
  - marker: b
    text: 'A frase “neles estamos há muito tempo — e seremos salvos?” é textual e sintaticamente difícil. Outras possibilidades são: “neles há permanência, e seremos salvos” ou “neles temos estado há muito tempo, e seremos salvos?”.'
    reason: alternative_reading
lexical_decisions:
- source_word: פָּגַעְתָּ
  choice: vens ao encontro
  rationale: Expressa o sentido comum de encontrar ou vir ao encontro, preservando aqui a relação favorável sem introduzir a ideia de intercessão.
- source_word: שָׂשׂ וְעֹשֵׂה צֶדֶק
  choice: quem pratica a justiça com alegria
  rationale: Toma os particípios em conjunto e verte de modo natural a pessoa caracterizada tanto pela alegria quanto pela prática do que é justo; a nota preserva a outra coordenação possível.
- source_word: צֶדֶק
  choice: justiça
  rationale: Mantém a amplitude ética e teológica do termo hebraico, que pode envolver retidão e justiça.
- source_word: בִּדְרָכֶיךָ יִזְכְּרוּךָ
  choice: daqueles que se lembram de ti em teus caminhos
  rationale: Conserva a formulação relacional e ético-pactual do hebraico sem explicitar indevidamente como os caminhos se ligam ao ato de lembrar.
- source_word: הֵן
  choice: Eis que
  rationale: Partícula de destaque vertida em registro digno e ainda compreensível no português moderno.
- source_word: קָצַפְתָּ
  choice: te iraste
  rationale: Comunica de maneira concisa e solene a ira divina, sem recorrer a terminologia teológica mais técnica.
- source_word: וַנֶּחֱטָא
  choice: e nós pecamos
  rationale: Preserva a confissão direta e a ligação simples da oração hebraica, sem impor uma relação temporal ou causal mais específica.
- source_word: בָּהֶם
  choice: neles
  rationale: Mantém a referência pronominal ambígua do hebraico em vez de identificar explicitamente o antecedente.
- source_word: עוֹלָם
  choice: por muito tempo
  rationale: Expressa duração prolongada sem impor aqui o sentido absoluto de eternidade.
- source_word: וְנִוָּשֵׁעַ
  choice: e seremos salvos?
  rationale: A forma passiva significa ser salvo; a leitura interrogativa se ajusta ao lamento, embora a ausência de marca interrogativa no hebraico permita também uma declaração.
theological_decisions:
- issue: Sentido do difícil encerramento וְנִוָּשֵׁעַ
  choice: 'Pergunta retórica: “e seremos salvos?”'
  alternative: 'Declaração: “e seremos salvos”; ou a construção “neles há permanência, e seremos salvos”.'
  rationale: A pergunta conserva a tensão penitencial e a dificuldade sintática do texto sem transformar a frase em garantia explícita; a nota registra as principais leituras declarativas.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas de segunda pessoa singular coerentes para a oração dirigida a Deus. A tradução mantém a concisão poética, a ambiguidade de “neles” e a tensão do encerramento.
