  naturalness: “Tu vens ao encontro dos que se alegram e praticam a justiça, que se lembram de ti em teus caminhos” é natural, claro e mantém registro bíblico moderno. “Neles estamos há muito tempo” explicita apenas o mínimo necessário para que a elipse hebraica soe idiomática em português.
  terminology: “Justiça”, “pecamos” e “salvos” são escolhas adequadas e amplas. “Eis que te iraste” conserva um registro solene compreensível e a segunda pessoa singular é coerente.
