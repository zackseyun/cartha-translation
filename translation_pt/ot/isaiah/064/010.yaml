base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/010.yaml
  text: Our holy and beautiful house[a], where our fathers praised you, has become a burning with fire[b], and all our precious things have become a ruin.
translation:
  language: pt
  text: Nossa casa santa e gloriosa, onde nossos pais te louvaram, foi consumida pelo fogo, e tudo o que nos era precioso ficou em ruínas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית קָדְשֵׁנוּ וְתִפְאַרְתֵּנוּ
  choice: nossa casa santa e gloriosa
  rationale: A construção hebraica é literalmente “casa da nossa santidade e da nossa glória/beleza”. Em português, a formulação adjetival é natural; “gloriosa” preserva bem a ideia de esplendor e honra associada ao templo.
- source_word: אֲשֶׁר הִלְלוּךָ אֲבֹתֵינוּ
  choice: onde nossos pais te louvavam
  rationale: “Onde” expressa naturalmente o valor locativo da oração relativa, e “nossos pais” mantém a forma masculina explícita e a força histórico-pactual de אֲבֹתֵינוּ.
- source_word: הִלְלוּךָ
  choice: te louvavam
  rationale: O piel de הלל tem aqui o sentido normal de louvar. O imperfeito português descreve de modo natural a prática passada de culto naquele lugar.
- source_word: הָיָה לִשְׂרֵפַת אֵשׁ
  choice: foi consumida pelo fogo
  rationale: A expressão nominal hebraica, literalmente algo como “tornou-se queima de fogo”, descreve a destruição incendiária. “Foi consumida pelo fogo” comunica seu sentido em português claro e digno sem introduzir uma causa não presente no texto.
- source_word: מַחֲמַדֵּינוּ
  choice: tudo o que nos era precioso
  rationale: O substantivo abrange coisas desejáveis, estimadas ou preciosas. A formulação evita restringir a referência a objetos específicos e preserva tanto valor quanto afeição.
- source_word: לְחָרְבָּה
  choice: ficou em ruínas
  rationale: O termo indica devastação ou desolação. “Ficou em ruínas” é idiomático em português e se ajusta ao sujeito coletivo sem perder a imagem concreta.
theological_decisions:
- issue: Referência de “nossa casa santa e gloriosa”
  choice: Referência primária ao templo de Jerusalém
  alternative: Referência mais ampla que inclua Jerusalém ou os lugares sagrados da terra
  rationale: A descrição de uma casa onde os pais louvavam a Deus aponta diretamente para o templo, embora o contexto mais amplo também lamente Sião e Jerusalém.
- issue: Tradução de אֲבֹתֵינוּ
  choice: nossos pais
  alternative: nossos antepassados
  rationale: O hebraico emprega explicitamente o plural masculino “pais”, com ressonância histórico-pactual. A tradução conserva essa forma sem negar que, contextualmente, possa abranger os antepassados em sentido amplo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem e o paralelismo do hebraico foram preservados, enquanto as expressões predicativas foram vertidas idiomaticamente.
