  text: עָרֵ֥י קָדְשְׁ/ךָ֖ הָי֣וּ מִדְבָּ֑ר צִיּוֹן֙ מִדְבָּ֣ר הָיָ֔תָה יְרוּשָׁלִַ֖ם שְׁמָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/009.yaml
  text: Your holy cities have become a wilderness; Zion has become a wilderness[a], Jerusalem a desolation.
translation:
  language: pt
  text: As tuas cidades santas se tornaram um deserto; Sião se tornou um deserto[a], Jerusalém, uma desolação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma região erma”, nas duas ocorrências de מִדְבָּר.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי קָדְשְׁךָ
  choice: as tuas cidades santas
  rationale: A construção significa literalmente “as cidades da tua santidade”; a formulação escolhida expressa de modo natural tanto a pertença quanto o caráter sagrado.
- source_word: הָיוּ / הָיָתָה
  choice: se tornaram / se tornou
  rationale: Os perfeitos de היה permitem destacar a passagem ao estado de ruína; em português, o pretérito perfeito comunica essa mudança e seu resultado no contexto do lamento.
- source_word: מִדְבָּר
  choice: um deserto
  rationale: O termo pode designar deserto ou região erma. “Deserto” é claro e corrente em português e retrata a devastação sem acrescentar a ideia mais específica de ruínas urbanas.
- source_word: צִיּוֹן
  choice: Sião
  rationale: Forma tradicional e amplamente reconhecida em português para o nome próprio.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalém
  rationale: Forma consagrada do nome próprio em português.
- source_word: שְׁמָמָה
  choice: uma desolação
  rationale: Preserva a força nominal do hebraico e mantém o paralelismo com “um deserto”.
theological_decisions: []
