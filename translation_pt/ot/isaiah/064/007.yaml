  text: וְ/עַתָּ֥ה יְהוָ֖ה אָבִ֣י/נוּ אָ֑תָּה אֲנַ֤חְנוּ הַ/חֹ֨מֶר֙ וְ/אַתָּ֣ה יֹצְרֵ֔/נוּ וּ/מַעֲשֵׂ֥ה יָדְ/ךָ֖ כֻּלָּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/007.yaml
  text: But now, O Yahweh, you are our Father; we are the clay, and you are our potter; we all are the work of your hand.
translation:
  language: pt
  text: Mas agora, ó Yahweh, tu és nosso Pai. Nós somos o barro, e tu és o nosso oleiro; todos nós somos obra da tua mão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Mas agora
  rationale: Expressa a transição temporal e a força contrastiva do apelo no contexto anterior.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אָבִינוּ אָתָּה
  choice: tu és nosso Pai
  rationale: Preserva a afirmação relacional direta e a ênfase do pronome hebraico; 'tu' mantém a forma de tratamento singular e reverente, com ampla inteligibilidade em português.
- source_word: אֲנַחְנוּ הַחֹמֶר
  choice: Nós somos o barro
  rationale: Mantém a imagem do material moldado e o artigo definido do hebraico; a explicitação de 'somos' é natural na oração nominal portuguesa.
- source_word: וְאַתָּה יֹצְרֵנוּ
  choice: e tu és o nosso oleiro
  rationale: No paralelo com 'barro', 'oleiro' comunica precisamente o agente que forma e preserva a metáfora artesanal.
- source_word: וּמַעֲשֵׂה יָדְךָ
  choice: obra das tuas mãos
  rationale: Reproduz a imagem antropomórfica com linguagem poética natural; o plural idiomático 'mãos' em português não altera o sentido instrumental do singular hebraico.
- source_word: כֻּלָּנוּ
  choice: todos nós
  rationale: Conserva a ênfase coletiva da palavra posicionada ao fim da oração hebraica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz o Tetragrama como nome próprio. 'Yahweh' preserva o nome pactual sem substituí-lo por um título.
- issue: Linguagem paterna aplicada a Deus
  choice: nosso Pai
  alternative: nosso progenitor
  rationale: O hebraico diz explicitamente 'Pai'; a tradução conserva a linguagem familiar masculina e a relação afirmada no texto.
- issue: Metáfora do oleiro e do barro
  choice: barro... oleiro
  alternative: argila... aquele que nos forma
  rationale: A tradução mantém a metáfora concreta e sua tensão teológica entre a paternidade de Deus e sua ação soberana de formar o povo.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. Emprega 'tu' de modo coerente na invocação direta e evita arcaísmos além do vocativo poético 'ó'. A pontuação em duas frases torna claro o movimento do apelo sem desfazer o paralelismo.
