id: ISA.64.11
reference: Isaiah 64:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַ/עַל אֵ֥לֶּה תִתְאַפַּ֖ק יְהוָ֑ה תֶּחֱשֶׁ֥ה וּ/תְעַנֵּ֖/נוּ עַד מְאֹֽד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/011.yaml
  text: Will you restrain yourself over these things[b][a], O Yahweh? Will you keep silent and afflict us so very severely?
translation:
  language: pt
  text: Diante destas coisas[a], tu te conterás, ó Yahweh? Ficarás calado e nos afligirás[b] tanto assim?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por causa destas coisas”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “nos humilharás”. O verbo hebraico pode significar afligir ou humilhar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעַל אֵלֶּה
  choice: Diante destas coisas
  rationale: A partícula interrogativa הַ introduz a pergunta retórica, e עַל pode indicar aquilo diante do qual ou a respeito do qual Yahweh se contém. “Diante destas coisas” retoma naturalmente a devastação descrita no contexto sem reduzir a expressão a uma causalidade inequívoca.
- source_word: תִתְאַפַּק
  choice: tu te conterás
  rationale: O hitpael de אפק expressa conter-se ou refrear-se. A forma reflexiva portuguesa preserva esse valor e a pergunta no futuro.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração comunica que o hebraico emprega o nome divino, e não um título.
- source_word: תֶּחֱשֶׁה
  choice: Ficarás calado
  rationale: O verbo denota estar ou permanecer em silêncio. “Ficarás calado” é claro, natural e mantém a força da pergunta retórica.
- source_word: וּתְעַנֵּנוּ
  choice: e nos afligirás
  rationale: Neste lamento, o piel de ענה tem o sentido contextual de afligir ou humilhar. “Afligir” se ajusta à descrição do sofrimento extremo e ao paralelismo com o silêncio divino.
- source_word: עַד מְאֹד
  choice: tanto assim
  rationale: A expressão intensifica em alto grau a aflição. “Tanto assim” transmite de modo corrente e enfático a intensidade da pergunta, sem acrescentar uma medida específica.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz explicitamente o tetragrama, nome pessoal do Deus de Israel. A transliteração o distingue do título אֲדֹנָי, sem inserir uma interpretação denominacional.
- issue: Sentido de וּתְעַנֵּנוּ
  choice: nos afligirás
  alternative: nos humilharás
  rationale: O contexto de ruína e a intensidade expressa por עַד מְאֹד favorecem “afligir”, mas o campo semântico do verbo também admite “humilhar”; a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com formas de segunda pessoa singular adequadas à invocação direta. A formulação conserva as duas perguntas retóricas, a reflexividade de תִתְאַפַּק e a ambiguidade relevante de עַל e ענה.
