    issue: O “e” inicial não foi traduzido.
    rationale: A conjunção וְ liga este verso ao lamento precedente. Embora português por vezes a omita, aqui “E não há...” preserva de modo simples o encadeamento do original.
  - severity: medium
    issue: “Nas mãos da nossa iniquidade” pluraliza “mão”.
    rationale: 'O texto hebraico tem בְּיַד, singular: “na mão da nossa iniquidade”. Manter o singular conserva tanto a forma quanto a imagem do original.'
  - severity: low
    issue: A nota lexical usa “nos fizeste derreter” como alternativa mais literal.
    rationale: A forma verbal admite a imagem de derreter, dissolver ou definhar; “nos fizeste derreter” torna explícita uma causação que a tradução alternativa pode expressar mais sobriamente como “nos derreteste”/“nos fizeste definhar”, devendo a nota indicar a incerteza sem fixar uma única nuance.
  revised_text: E não há quem invoque o teu nome, quem se disponha a apegar-se a ti; pois escondeste de nós o teu rosto e nos entregaste na mão da nossa iniquidade.[a]
