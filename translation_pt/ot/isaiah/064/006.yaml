revisions:
- from: Não há quem invoque o teu nome, quem se desperte para se apegar a ti, pois escondeste de nós o teu rosto e nos entregaste nas mãos da nossa iniquidade.[a]
  to: E não há quem invoque o teu nome, quem se disponha a apegar-se a ti; pois escondeste de nós o teu rosto e nos entregaste na mão da nossa iniquidade.[a]
  rationale: A revisão restaura a conjunção inicial, corrige “mãos” para o singular exigido pelo hebraico e ajusta a nota para expor a imagem lexical sem ultrapassar a ambiguidade do verbo. “Dispor-se a apegar-se” oferece português mais fluente e conserva a noção de alguém que toma a iniciativa de se voltar para Deus.
