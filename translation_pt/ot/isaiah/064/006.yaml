  text: וְ/אֵין קוֹרֵ֣א בְ/שִׁמְ/ךָ֔ מִתְעוֹרֵ֖ר לְ/הַחֲזִ֣יק בָּ֑/ךְ כִּֽי הִסְתַּ֤רְתָּ פָנֶ֨י/ךָ֙ מִמֶּ֔/נּוּ וַ/תְּמוּגֵ֖/נוּ בְּ/יַד עֲוֺנֵֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/006.yaml
  text: And there is no one who calls on your name[a], who stirs himself up to take hold of you; for you have hidden your face from us and have given us over into the hand of our iniquity.
translation:
  language: pt
  text: E não há quem invoque o teu nome, quem se disponha a apegar-se a ti; pois escondeste de nós o teu rosto e nos entregaste na mão da nossa iniquidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “e nos derreteste na mão da nossa iniquidade”. O verbo hebraico evoca a ideia de derreter, dissolver ou definhar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵין
  choice: Não há
  rationale: Expressa de maneira direta e natural a negação existencial absoluta; a conjunção inicial não precisa ser reproduzida mecanicamente em português neste início de versículo.
- source_word: קוֹרֵא בְשִׁמְךָ
  choice: quem invoque o teu nome
  rationale: “Invocar o nome” preserva o idioma bíblico de apelar a Deus em oração e soa natural em português.
- source_word: מִתְעוֹרֵר
  choice: quem se desperte
  rationale: Mantém tanto a imagem de despertar quanto a nuance reflexiva da forma hebraica.
- source_word: לְהַחֲזִיק בָּךְ
  choice: para se apegar a ti
  rationale: Comunica a ação figurada de agarrar-se firmemente a Deus sem tornar a expressão excessivamente física ou artificial.
- source_word: כִּי
  choice: pois
  rationale: Introduz com clareza a razão da ausência de quem invoque e busque a Deus.
- source_word: הִסְתַּרְתָּ פָנֶיךָ
  choice: escondeste de nós o teu rosto
  rationale: Preserva a imagem hebraica do rosto divino oculto, associada à retirada do favor ou da presença manifesta de Deus.
- source_word: וַתְּמוּגֵנוּ
  choice: nos entregaste
  rationale: Expressa, no contexto, a ideia de abandono judicial ao poder da própria iniquidade; a imagem mais literal de derreter ou consumir-se é mantida em nota.
- source_word: בְּיַד
  choice: nas mãos
  rationale: Conserva a metáfora hebraica de domínio ou poder de maneira idiomática em português.
- source_word: עֲוֺנֵנוּ
  choice: da nossa iniquidade
  rationale: Mantém o peso moral do termo e seu sentido coletivo singular, sem excluir suas associações com culpa e consequências do pecado.
theological_decisions:
- issue: Agência divina e responsabilidade humana na oração final
  choice: Deus entrega o povo ao poder da própria iniquidade.
  alternative: Deus faz o povo derreter ou definhar pela mão da sua iniquidade.
  rationale: A formulação conserva simultaneamente o juízo divino e a culpabilidade humana, sem definir um mecanismo metafísico de causalidade. A nota registra a imagem verbal hebraica mais concreta.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se as imagens bíblicas de invocar o nome, ocultar o rosto e estar nas mãos de um poder; a construção “se desperte para se apegar” preserva a ação reflexiva do hebraico.
