  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/נְּהִ֤י כַ/טָּמֵא֙ כֻּלָּ֔/נוּ וּ/כְ/בֶ֥גֶד עִדִּ֖ים כָּל צִדְקֹתֵ֑י/נוּ וַ/נָּ֤בֶל כֶּֽ/עָלֶה֙ כֻּלָּ֔/נוּ וַ/עֲוֺנֵ֖/נוּ כָּ/ר֥וּחַ יִשָּׂאֻֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/005.yaml
  text: We all became like one who is unclean[a], and all our righteous deeds are like a filthy garment; we all wither like a leaf, and our iniquities carry us away like the wind.
translation:
  language: pt
  text: Todos nós nos tornamos como alguém impuro, e todos os nossos atos de justiça são como uma roupa imunda[a]. Todos nós murchamos como uma folha, e as nossas iniquidades nos levam embora como o vento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais especificamente, “como uma roupa associada à impureza menstrual”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנְּהִי כַטָּמֵא כֻּלָּנוּ
  choice: Todos nós nos tornamos como alguém impuro
  rationale: O wayyiqtol de היה indica a entrada ou chegada a um estado; a formulação mantém o valor pessoal possível de טָמֵא e não restringe a impureza ao âmbito exclusivamente ritual ou moral.
- source_word: וּכְבֶגֶד עִדִּים
  choice: como uma roupa de impureza menstrual
  rationale: עִדִּים, neste sintagma, aponta especificamente para a impureza associada à menstruação. A tradução explícita preserva essa imagem concreta sem substituí-la por um termo genérico como 'suja'.
- source_word: כָּל צִדְקֹתֵינוּ
  choice: todos os nossos atos de justiça
  rationale: O plural צִדְקוֹת designa aqui manifestações ou atos concretos de justiça, não apenas uma qualidade abstrata.
- source_word: וַנָּבֶל כֶּעָלֶה כֻּלָּנוּ
  choice: Todos nós murchamos como uma folha
  rationale: נבל descreve o murchar ou definhar da vegetação; 'murchamos' combina naturalmente com a imagem da folha e mantém a repetição enfática de כֻּלָּנוּ.
- source_word: וַעֲוֺנֵינוּ
  choice: as nossas iniquidades
  rationale: עָוֹן pode abranger perversidade, culpa ou suas consequências. 'Iniquidades' conserva o peso moral e a ambiguidade contextual melhor do que uma paráfrase explicativa.
- source_word: כָרוּחַ יִשָּׂאֻנוּ
  choice: nos levam embora como o vento
  rationale: נשא significa levantar ou carregar; no contexto da folha que murcha, 'levar embora' expressa o deslocamento provocado pelo vento sem intensificar indevidamente a imagem.
theological_decisions:
- issue: Natureza da impureza na confissão
  choice: Manter a linguagem de impureza e sua imagem menstrual concreta, sem defini-la como exclusivamente ritual ou moral.
  alternative: Generalizar como 'roupa suja' ou converter a imagem diretamente em uma formulação doutrinária sistemática.
  rationale: A confissão emprega uma imagem de impureza cultual com força moral no contexto. A tradução deve preservar essa interação e não resolver a tensão em favor de uma categoria posterior.
- issue: Sentido de עָוֹן
  choice: Traduzir por 'iniquidades', deixando que o contexto comporte tanto os delitos quanto sua culpa ou efeito.
  alternative: Traduzir especificamente por 'culpa' ou 'castigo'.
  rationale: O campo semântico do termo permite mais de uma nuance, e o verso não exige que a tradução escolha apenas uma delas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe acompanha o paralelismo hebraico, e a repetição de “Todos nós” preserva a ênfase do original. O marcador [a] aparece no texto principal junto à expressão explicada.
