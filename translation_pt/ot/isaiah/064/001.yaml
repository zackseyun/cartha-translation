id: ISA.64.1
reference: Isaiah 64:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ/קְדֹ֧חַ אֵ֣שׁ הֲמָסִ֗ים מַ֚יִם תִּבְעֶה אֵ֔שׁ לְ/הוֹדִ֥יעַ שִׁמְ/ךָ֖ לְ/צָרֶ֑י/ךָ מִ/פָּנֶ֖י/ךָ גּוֹיִ֥ם יִרְגָּֽזוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/001.yaml
  text: As when fire kindles brushwood[a], and fire causes water to boil, to make your name known to your adversaries[c][b], so that nations tremble at your presence—
translation:
  language: pt
  text: 'Como quando o fogo incendeia gravetos secos[a]

    e faz a água ferver[b],

    assim torna conhecido o teu nome aos teus adversários,

    para que as nações tremam diante de ti! [c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “palha” ou “matéria seca”. O termo hebraico é raro e indica material que se inflama facilmente.
    reason: lexical_alternative
  - marker: b
    text: Ou “faz a água borbulhar”.
    reason: lexical_alternative
  - marker: c
    text: Em algumas tradições de numeração em inglês, esta linha é numerada como Isaías 63:19b.
    reason: versification
lexical_decisions:
- source_word: כִּקְדֹחַ
  choice: Como ... incendeia
  rationale: A preposição כ introduz uma comparação, e o infinitivo de קדח expressa o ato de atear ou fazer arder. A formulação conserva tanto o símile quanto a força verbal.
- source_word: אֵשׁ
  choice: fogo
  rationale: Correspondência lexical direta e natural em português.
- source_word: הֲמָסִים
  choice: gravetos secos
  rationale: O termo hebraico é raro e de sentido incerto, mas o contexto aponta para material combustível que pega fogo com facilidade. “Gravetos secos” comunica a imagem com clareza sem fingir precisão absoluta; as alternativas constam em nota.
- source_word: מַיִם תִּבְעֶה אֵשׁ
  choice: '[o fogo] faz a água ferver'
  rationale: Neste contexto, תבעה descreve a ação do fogo que leva a água à fervura ou a faz borbulhar. O sujeito “fogo”, expresso novamente no hebraico, fica naturalmente subentendido na coordenação em português.
- source_word: לְהוֹדִיעַ
  choice: torna conhecido
  rationale: O infinitivo hifil de ידע tem sentido causativo, “fazer conhecer”. “Torna conhecido” preserva esse valor e soa natural.
- source_word: שִׁמְךָ
  choice: o teu nome
  rationale: Mantém a expressão bíblica “nome”, que abrange identidade, caráter e reputação, sem a reduzir a uma paráfrase interpretativa.
- source_word: לְצָרֶיךָ
  choice: aos teus adversários
  rationale: צר designa quem se opõe ou hostiliza. “Adversários” preserva essa relação sem restringi-la necessariamente a inimigos militares.
- source_word: מִפָּנֶיךָ
  choice: diante da tua presença
  rationale: A expressão literalmente relacionada à face pode indicar estar diante de alguém ou reagir à sua presença. A tradução conserva a força da manifestação divina.
- source_word: גּוֹיִם
  choice: as nações
  rationale: Neste contexto, o termo se refere amplamente às nações; a escolha evita a conotação religiosa mais restrita que “gentios” pode adquirir.
- source_word: יִרְגָּזוּ
  choice: tremam
  rationale: O verbo pode significar tremer, estremecer ou agitar-se. “Tremam” se ajusta à reação das nações diante da manifestação divina.
theological_decisions:
- issue: Relação sintática com a súplica precedente
  choice: Expressar a comparação com “Como... assim...”, deixando perceptível que a imagem continua a súplica do contexto anterior.
  alternative: Traduzir o trecho como uma oração independente ou repetir no texto palavras da petição anterior sobre Deus descer.
  rationale: O hebraico começa com uma comparação e depende contextualmente da petição anterior, mas este versículo não repete os termos daquela petição. “Assim” explicita em português a correlação já pressuposta sem importar palavras ausentes.
- issue: Imagem da manifestação divina
  choice: Conservar as imagens do fogo, da água fervente e do tremor das nações sem limitá-las a uma única categoria doutrinária.
  alternative: Interpretar a imagem exclusivamente como juízo ou exclusivamente como purificação.
  rationale: A linguagem poética comunica a força da manifestação de Deus e seu efeito sobre adversários e nações, mas não exige que a imagem seja reduzida apenas a juízo ou apenas a purificação.
- issue: Valor volitivo de לְהוֹדִיעַ e יִרְגָּזוּ no contexto
  choice: Traduzir “assim torna conhecido... para que... tremam”, preservando a continuação da súplica dirigida a Deus.
  alternative: 'Usar uma descrição impessoal ou meramente temporal: “quando tornaste conhecido... as nações tremeram”.'
  rationale: As formas e o encadeamento do texto favorecem a finalidade dentro da petição em curso, sem transformar a passagem em relato de um evento passado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O paralelismo poético foi disposto em linhas. Empregou-se “tu” para manter a interpelação direta e solene a Deus, sem arcaísmos verbais desnecessários. O ponto de exclamação transmite a intensidade da súplica continuada; o versículo permanece sintaticamente ligado ao contexto anterior.
