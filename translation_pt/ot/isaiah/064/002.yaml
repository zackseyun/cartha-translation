source:
  edition: WLC
  text: בַּ/עֲשׂוֹתְ/ךָ֥ נוֹרָא֖וֹת לֹ֣א נְקַוֶּ֑ה יָרַ֕דְתָּ מִ/פָּנֶ֖י/ךָ הָרִ֥ים נָזֹֽלּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/002.yaml
  text: When you did awesome things that we did not expect[a], you came down[b]; the mountains quaked before you.
translation:
  language: pt
  text: Quando fizeste coisas assombrosas que não esperávamos, desceste; os montes se dissolveram diante de ti.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “escorreram”, “derreteram” ou “estremeceram”. O verbo hebraico evoca a imagem dos montes fluindo ou se desfazendo diante da presença de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲשׂוֹתְךָ
  choice: Quando fizeste
  rationale: A preposição בְּ com o infinitivo construto e o sufixo de segunda pessoa tem aqui valor temporal. “Quando fizeste” expressa essa ligação de modo natural em português.
- source_word: נוֹרָאוֹת
  choice: coisas assombrosas
  rationale: O termo designa atos que despertam temor e admiração. “Assombrosas” conserva essa força sem sugerir apenas algo moralmente ruim, como poderia ocorrer com “terríveis”.
- source_word: לֹא נְקַוֶּה
  choice: que não esperávamos
  rationale: קוה pode indicar esperar com expectativa ou esperança. Neste contexto, a ideia é que os atos divinos estavam além do que o povo esperava; a formulação preserva o sentido sem acrescentar uma avaliação negativa.
- source_word: יָרַדְתָּ
  choice: desceste
  rationale: ירד significa descer. “Desceste” é conciso, digno e adequado à descrição teofânica.
- source_word: מִפָּנֶיךָ
  choice: diante de ti
  rationale: A expressão significa literalmente “de diante da tua face/presença” e descreve a reação dos montes à manifestação de Deus. “Diante de ti” é natural e mantém a referência à presença divina.
- source_word: הָרִים
  choice: os montes
  rationale: Equivalente direto e tradicional de הָרִים, apropriado ao registro poético.
- source_word: נָזֹלּוּ
  choice: se dissolveram
  rationale: O verbo evoca algo que flui, escorre ou perde sua consistência. “Se dissolveram” mantém a imagem poética de desintegração dos montes diante de Deus e é mais inteligível em português do que a tradução estritamente literal “escorreram”.
theological_decisions:
- issue: A reação dos montes à descida e à presença de Deus
  choice: os montes se dissolveram diante de ti
  alternative: os montes estremeceram diante de ti; os montes derreteram diante de ti
  rationale: A tradução conserva a imagem concreta de a criação perder sua solidez diante da manifestação divina, sem reduzi-la apenas a um tremor nem determinar de forma excessiva o fenômeno físico retratado.
translation_notes:
  register: Português atual, claro e solene, com legibilidade brasileira e compreensão internacional. A ordem das orações acompanha o movimento poético hebraico; “coisas assombrosas” preserva conjuntamente temor e admiração.
