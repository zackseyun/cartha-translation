source:
  edition: WLC
  text: וּ/מֵ/עוֹלָ֥ם לֹא שָׁמְע֖וּ לֹ֣א הֶאֱזִ֑ינוּ עַ֣יִן לֹֽא רָאָ֗תָה אֱלֹהִים֙ זוּלָ֣תְ/ךָ֔ יַעֲשֶׂ֖ה לִ/מְחַכֵּה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/003.yaml
  text: From of old no one has heard, no ear has listened, no eye has seen a God besides you, who acts for the one who waits for him.
translation:
  language: pt
  text: Desde os tempos antigos, ninguém ouviu, nenhum ouvido prestou atenção, nenhum olho viu outro Deus além de ti, que age em favor daquele que espera por ele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: por ele. A frase passa da referência direta a Deus (“ti”) para a terceira pessoa. Algumas traduções harmonizam: por ti.'
    reason: A mudança pronominal é perceptível e teologicamente relevante; a nota conserva a leitura do WLC e informa a alternativa contextual.
lexical_decisions:
- source_word: וּמֵעוֹלָם
  choice: Desde os tempos antigos
  rationale: Expressa a ideia temporal de מֵעוֹלָם em português natural, sem impor a noção mais forte de eternidade.
- source_word: לֹא שָׁמְעוּ לֹא הֶאֱזִינוּ
  choice: ninguém ouviu, nenhum ouvido prestou atenção
  rationale: O primeiro plural impessoal é vertido naturalmente como “ninguém”; הֶאֱזִינוּ acrescenta a ideia de ouvir com atenção, aqui ligada a “ouvido” por elipse poética.
- source_word: אֱלֹהִים זוּלָתְךָ
  choice: outro Deus além de ti
  rationale: Mantém a comparação exclusiva do hebraico e a referência direta a Deus na segunda pessoa.
- source_word: יַעֲשֶׂה לִמְחַכֵּה לוֹ
  choice: que age em favor daquele que espera por ele
  rationale: יַעֲשֶׂה é deliberadamente amplo (“age/faz”), e לְ é entendido como ação em benefício de quem aguarda confiantemente.
theological_decisions:
- issue: Referente do pronome em לִמְחַכֵּה לוֹ
  choice: “espera por ele”, com nota sobre a mudança de pessoa
  alternative: “espera por ti”
  rationale: O texto consonantal vocalizado traz pronome de terceira pessoa (“por ele”), embora a frase anterior se dirija a Deus como “ti”. A tradução preserva essa tensão textual em vez de harmonizá-la silenciosamente.
- issue: Natureza da afirmação sobre “outro Deus”
  choice: Preservar a formulação comparativa “outro Deus além de ti”
  alternative: Reformular como declaração abstrata de que não existe nenhum outro Deus
  rationale: A redação mantém de perto a expressão poética e devocional do hebraico, sem ampliar sua forma retórica para uma formulação dogmática mais explícita.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. “Prestou atenção” comunica o ouvir atento de הֶאֱזִינוּ sem arcaísmo; “age em favor” mantém aberto o conteúdo da ação divina.
