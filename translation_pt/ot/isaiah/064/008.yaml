id: ISA.64.8
reference: Isaiah 64:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַל תִּקְצֹ֤ף יְהוָה֙ עַד מְאֹ֔ד וְ/אַל לָ/עַ֖ד תִּזְכֹּ֣ר עָוֺ֑ן הֵ֥ן הַבֶּט נָ֖א עַמְּ/ךָ֥ כֻלָּֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/008.yaml
  text: 'Do not be exceedingly angry[a], O Yahweh, and do not remember iniquity forever. Look, please: we are all your people.'
translation:
  language: pt
  text: 'Não fiques tão irado, ó Yahweh, nem te lembres para sempre da iniquidade.[a] Olha, por favor: todos nós somos o teu povo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da culpa”. O termo hebraico pode indicar tanto a iniquidade cometida como a culpa que dela resulta.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּקְצֹף ... עַד מְאֹד
  choice: Não fiques tão irado
  rationale: A construção expressa uma súplica para que Yahweh não permaneça irado em grau extremo. “Tão irado” é natural em português e conserva a intensificação de עַד מְאֹד.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: וְאַל לָעַד תִּזְכֹּר עָוֹן
  choice: nem te lembres para sempre da iniquidade
  rationale: Preserva a linguagem hebraica de recordar a iniquidade, que no contexto implica mantê-la em conta para juízo, sem explicitar além do texto.
- source_word: עָוֹן
  choice: iniquidade
  rationale: “Iniquidade” mantém o peso moral do termo e permite sua amplitude entre o ato perverso e a culpa decorrente.
- source_word: הֵן הַבֶּט נָא
  choice: Olha, por favor
  rationale: הֵן chama a atenção, הַבֶּט ordena olhar e נָא dá à fala o tom de súplica. A formulação é atual e conserva a urgência respeitosa.
- source_word: עַמְּךָ כֻלָּנוּ
  choice: todos nós somos o teu povo
  rationale: Supre naturalmente a cópula ausente na oração nominal hebraica e mantém a ênfase coletiva da súplica.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto traz o nome pessoal divino; a transliteração “Yahweh” o preserva sem substituí-lo por um título.
- issue: Amplitude semântica de עָוֹן na oração penitencial
  choice: iniquidade, com nota sobre culpa
  alternative: culpa; pecado
  rationale: “Iniquidade” preserva a referência à transgressão, enquanto a nota registra que o hebraico também pode indicar a culpa resultante, evitando resolver silenciosamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O vocativo e a segunda pessoa singular preservam o caráter direto e solene da oração; evita-se linguagem excessivamente arcaica.
