source:
  edition: WLC
  text: לֹא תֹאמְר֣וּ/ן קֶ֔שֶׁר לְ/כֹ֧ל אֲשֶׁר יֹאמַ֛ר הָ/עָ֥ם הַ/זֶּ֖ה קָ֑שֶׁר וְ/אֶת מוֹרָא֥/וֹ לֹֽא תִֽירְא֖וּ וְ/לֹ֥א תַעֲרִֽיצוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/012.yaml
  text: Do not call conspiracy everything that this people calls conspiracy[a], and do not fear what they fear[b], nor be in dread.
translation:
  language: pt
  text: Não chamem de conspiração tudo o que este povo chama de conspiração[a]; não tenham medo do que ele teme[b], nem se apavorem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não digam: ‘É conspiração’, a respeito de tudo o que este povo diz ser conspiração.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o seu temor”. O pronome singular retoma coletivamente “este povo”; a expressão pode significar aquilo que o povo teme ou o medo que ele sente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶשֶׁר / קָשֶׁר
  choice: conspiração
  rationale: O termo pode indicar uma aliança conspiratória ou trama política. “Conspiração” preserva o sentido sociopolítico e a repetição enfática do hebraico.
- source_word: תֹאמְרוּן
  choice: chamem de
  rationale: Embora o verbo signifique literalmente “digam”, nesta construção ele atribui uma designação; “chamem de” é natural em português e conserva essa função.
- source_word: לְכֹל אֲשֶׁר יֹאמַר הָעָם הַזֶּה
  choice: tudo o que este povo chama de
  rationale: A formulação explicita de modo idiomático a relação predicativa implícita, sem restringir o referente histórico.
- source_word: הָעָם הַזֶּה
  choice: este povo
  rationale: Mantém a expressão coletiva e seu possível tom de distanciamento ou repreensão.
- source_word: מוֹרָאוֹ
  choice: do que ele teme
  rationale: O sufixo hebraico é singular e retoma coletivamente “este povo”. A expressão pode apontar para o medo ou para aquilo que é temido; esta tradução preserva o sentido prático sem trocar o singular pelo plural.
- source_word: תִּירְאוּ
  choice: tenham medo
  rationale: Equivalente corrente de ירא, preservando a ligação semântica com מוֹרָא.
- source_word: תַעֲרִיצוּ
  choice: fiquem apavorados
  rationale: Expressa a intensificação poética do paralelismo e o sentido de ser tomado de pavor, sem repetir simplesmente “tenham medo”.
theological_decisions:
- issue: Referente e força da proibição relativa ao medo
  choice: A ordem proíbe os destinatários de adotar a avaliação alarmista e o pânico deste povo.
  alternative: A ordem proíbe especificamente a participação numa conspiração política real, ou principalmente o medo do próprio povo.
  rationale: A repetição de “conspiração” e as cláusulas paralelas sobre medo favorecem uma advertência contra reproduzir a interpretação e o temor coletivos. A redação não define além do texto o referente histórico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural verbal segue os destinatários no hebraico; “este povo” conserva a forma coletiva singular. A pontuação destaca o paralelismo entre não adotar o rótulo popular e não compartilhar seu pavor.
