  text: רֹ֤עוּ עַמִּים֙ וָ/חֹ֔תּוּ וְ/הַֽאֲזִ֔ינוּ כֹּ֖ל מֶרְחַקֵּי אָ֑רֶץ הִתְאַזְּר֣וּ וָ/חֹ֔תּוּ הִֽתְאַזְּר֖וּ וָ/חֹֽתּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/009.yaml
  text: Be shattered[a], O peoples, and be broken; listen, all distant parts of the earth. Strap yourselves on for battle, and be broken; strap yourselves on for battle[b], and be broken.
translation:
  language: pt
  text: Sejam despedaçados[a], ó povos, e sejam quebrados! Escutem, todos vocês das regiões distantes da terra. Preparem-se para a batalha e sejam quebrados; preparem-se para a batalha[b] e sejam quebrados!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O imperativo hebraico inicial é difícil. Também pode ser traduzido por “Deem um grito de guerra, ó povos” ou “Ajuntem-se, ó povos”.
    reason: alternative_reading
  - marker: b
    text: Ou “cinjam-se”; o hebraico se refere a preparar-se ou equipar-se, provavelmente para o combate.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעוּ
  choice: Sejam despedaçados
  rationale: O imperativo hebraico é difícil e admite mais de uma análise. No contexto imediato, o paralelismo com a repetição de וָחֹתּוּ e o tom de desafio dirigido a povos hostis favorecem uma proclamação irônica de sua ruína. A ambiguidade é preservada em nota.
- source_word: עַמִּים
  choice: povos
  rationale: Mantém o plural e a referência direta a diversos grupos estrangeiros, além de reproduzir de perto o sentido do hebraico.
- source_word: וָחֹתּוּ
  choice: e sejam quebrados
  rationale: חתת pode indicar ser quebrado, arruinado ou aterrorizado. Aqui, a repetição descreve o colapso dos povos apesar de seus preparativos; a tradução uniforme conserva a insistência poética.
- source_word: וְהַאֲזִינוּ
  choice: Escutem
  rationale: Tradução moderna e direta do imperativo causativo com o sentido de prestar atenção ou dar ouvidos.
- source_word: כֹּל מֶרְחַקֵּי אָרֶץ
  choice: todos os confins distantes da terra
  rationale: Expressa a abrangência geográfica do chamado e conserva a imagem poética dos lugares remotos da terra.
- source_word: הִתְאַזְּרוּ
  choice: Preparem-se para a batalha
  rationale: O Hitpael de אזר significa cingir-se ou equipar-se, frequentemente para ação ou combate. A formulação comunica naturalmente em português o sentido militar provável sem recorrer ao arcaísmo 'cingi-vos'.
theological_decisions:
- issue: Interpretação do imperativo inicial רֹעוּ
  choice: 'Uma convocação irônica de juízo contra os povos: “Sejam despedaçados”'
  alternative: “Deem um grito de guerra” ou “Ajuntem-se”
  rationale: A repetição de “sejam quebrados” e o contexto de oposição das nações favorecem uma proclamação de derrota. Como a forma hebraica é discutida, as leituras alternativas são explicitadas em nota, sem eliminar a tensão textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição e o paralelismo do verso foram mantidos para preservar seu tom poético e desafiador.
