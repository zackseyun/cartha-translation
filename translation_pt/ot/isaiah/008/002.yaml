base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/002.yaml
  text: 'And I will take for myself faithful witnesses: Uriah the priest and Zechariah son of Jeberekiah[a][b].'
translation:
  language: pt
  text: 'E convocarei[b] para mim testemunhas fiéis[a]: Urias, o sacerdote, e Zacarias, filho de Jeberequias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “testemunhas confiáveis”. O adjetivo hebraico expressa confiabilidade, bem como fidelidade.
    reason: lexical_alternative
  - marker: b
    text: O verbo também pode ser entendido como “tomarei” ou “designarei” testemunhas, destacando a atestação formal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָעִידָה
  choice: E convocarei ... testemunhas
  rationale: O hifil de עוד, neste contexto, indica chamar ou assegurar formalmente testemunhas para atestação. “Convocarei” expressa de modo natural em português esse ato deliberado e sua dimensão formal; a conjunção וְ é traduzida por “E”.
- source_word: לִּי
  choice: para mim
  rationale: A preposição com sufixo de primeira pessoa marca o interesse e o envolvimento pessoal de quem fala.
- source_word: עֵדִים
  choice: testemunhas
  rationale: É o termo corrente e preciso em português para pessoas que atestam formalmente um ato, fato ou documento.
- source_word: נֶאֱמָנִים
  choice: fiéis
  rationale: O adjetivo descreve pessoas dignas de confiança e seguras em seu testemunho. “Fiéis” preserva a forma tradicional e a amplitude semântica, enquanto a nota registra a alternativa “confiáveis”.
- source_word: אֵת
  choice: ':'
  rationale: O marcador de objeto introduz os nomes das testemunhas e não recebe tradução lexical; os dois-pontos apresentam naturalmente sua identificação.
- source_word: אוּרִיָּה
  choice: Urias
  rationale: Forma portuguesa consagrada do nome próprio hebraico.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Tradução direta do título definido que identifica a função de Urias.
- source_word: וְאֶת
  choice: e
  rationale: A conjunção liga a segunda testemunha à primeira; o marcador de objeto não é expresso separadamente em português.
- source_word: זְכַרְיָהוּ
  choice: Zacarias
  rationale: Forma portuguesa consagrada do nome próprio hebraico.
- source_word: בֶּן
  choice: filho de
  rationale: Tradução natural da construção patronímica hebraica.
- source_word: יְבֶרֶכְיָהוּ
  choice: Jeberequias
  rationale: Transliteração adaptada à grafia e à morfologia usuais dos nomes bíblicos em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas de nomes bíblicos familiares a leitores brasileiros e amplamente reconhecíveis no mundo lusófono. A formulação mantém o tom jurídico de uma atestação formal sem tornar a frase excessivamente técnica.
