id: ISA.8.7
reference: Isaiah 8:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/לָ/כֵ֡ן הִנֵּ֣ה אֲדֹנָ/י֩ מַעֲלֶ֨ה עֲלֵי/הֶ֜ם אֶת מֵ֣י הַ/נָּהָ֗ר הָ/עֲצוּמִים֙ וְ/הָ֣/רַבִּ֔ים אֶת מֶ֥לֶךְ אַשּׁ֖וּר וְ/אֶת כָּל כְּבוֹד֑/וֹ וְ/עָלָה֙ עַל כָּל אֲפִיקָ֔י/ו וְ/הָלַ֖ךְ עַל כָּל גְּדוֹתָֽי/ו־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/007.yaml
  text: Therefore[a], behold, the Lord is bringing up against them the waters of the River, mighty and many—the king of Assyria and all his glory[b]. And it will rise over all its channels and go over all its banks.
translation:
  language: pt
  text: Por isso, eis que o Senhor faz subir contra eles as águas do Rio[a], poderosas e abundantes[b] — o rei da Assíria e toda a sua glória. O Rio subirá acima de todos os seus canais e passará por cima de todas as suas margens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O Rio” provavelmente se refere ao Eufrates, o grande rio associado à Assíria.
    reason: cultural_note
  - marker: b
    text: Ou “fortes e caudalosas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָכֵן
  choice: Por isso
  rationale: Expressa de modo natural a consequência da rejeição das águas tranquilas de Siloé mencionada no contexto anterior.
- source_word: הִנֵּה
  choice: eis que
  rationale: Preserva a função de chamar a atenção e a vivacidade profética, em registro digno e ainda corrente no português bíblico.
- source_word: אֲדֹנָי
  choice: o Senhor
  rationale: Traduz o título אֲדֹנָי sem tratá-lo como o nome divino YHWH.
- source_word: מַעֲלֶה עֲלֵיהֶם
  choice: faz subir contra eles
  rationale: Mantém tanto a ação causativa do Senhor quanto a imagem das águas que sobem, com valor iminente e vívido do particípio.
- source_word: מֵי הַנָּהָר
  choice: as águas do Rio
  rationale: Conserva a designação hebraica sem inserir no texto principal a identificação provável com o Eufrates.
- source_word: הָעֲצוּמִים וְהָרַבִּים
  choice: poderosas e abundantes
  rationale: 'Mantém os dois aspectos da descrição: a força das águas e sua grande quantidade.'
- source_word: אֶת מֶלֶךְ אַשּׁוּר וְאֶת כָּל כְּבוֹדוֹ
  choice: o rei da Assíria e toda a sua glória
  rationale: Preserva a aposição que identifica a força invasora figurada pelas águas, sem reduzir כבוד apenas a pompa, exército ou poder.
- source_word: וְעָלָה
  choice: O Rio subirá
  rationale: Explicita o referente exigido pela clareza em português e conserva o verbo singular e a continuidade da imagem fluvial.
- source_word: אֲפִיקָיו
  choice: seus canais
  rationale: Representa os cursos ou leitos pelos quais normalmente correm as águas.
- source_word: וְהָלַךְ עַל כָּל גְּדוֹתָיו
  choice: passará por cima de todas as suas margens
  rationale: Comunica a imagem de uma cheia que ultrapassa seus limites normais sem substituir toda a expressão pelo verbo interpretativo 'transbordar'.
theological_decisions:
- issue: Identidade das águas invasoras
  choice: Manter a imagem das águas do Rio e sua aposição ao rei da Assíria com toda a sua glória.
  alternative: Traduzir diretamente as águas como o exército ou o poder imperial assírio.
  rationale: O hebraico apresenta simultaneamente a metáfora fluvial e sua identificação histórica. A redação preserva ambas, mostrando o rei da Assíria como instrumento do juízo trazido pelo Senhor sem acrescentar uma formulação doutrinária externa.
- issue: Sentido de כְּבוֹדוֹ no contexto assírio
  choice: glória
  alternative: esplendor, pompa ou poderio
  rationale: “Glória” mantém a amplitude do termo hebraico, que pode abranger majestade, recursos, séquito e poder, sem restringir a referência a apenas um desses aspectos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Eis que” conserva a solenidade e a força de atenção do hebraico; a repetição de “O Rio” evita em português a ambiguidade indevida que um pronome masculino criaria entre o rio e o rei da Assíria.
source_grounding:
  english_pob_role: consult_only
