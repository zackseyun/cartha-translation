id: ISA.8.10
reference: Isaiah 8:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עֻ֥צוּ עֵצָ֖ה וְ/תֻפָ֑ר דַּבְּר֤וּ דָבָר֙ וְ/לֹ֣א יָק֔וּם כִּ֥י עִמָּ֖/נוּ אֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/010.yaml
  text: Make a plan[a], and it will be thwarted; speak a word, and it will not stand, for God is with us.
translation:
  language: pt
  text: Façam um plano, e ele será frustrado; digam uma palavra, e ela não ficará de pé, pois Deus está conosco.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “pois conosco está Deus”, ecoando o nome Emanuel (“Deus conosco”) em Isaías 7:14; 8:8.'
    reason: cross_reference
lexical_decisions:
- source_word: עֻצוּ עֵצָה
  choice: Façam um plano
  rationale: O imperativo plural seguido do substantivo cognato descreve a formulação de um plano ou conselho. A expressão escolhida é natural em português e mantém o tom de desafio dirigido aos adversários.
- source_word: וְתֻפָר
  choice: e ele será frustrado
  rationale: O nifal de פרר indica que o plano será desfeito, anulado ou impedido. “Será frustrado” comunica com clareza o fracasso da conspiração.
- source_word: דַּבְּרוּ דָבָר
  choice: digam uma palavra
  rationale: A tradução preserva a repetição semântica do hebraico e a ambiguidade de דָבָר, que pode designar uma palavra, declaração ou assunto, sem especificá-la indevidamente como ordem ou decreto.
- source_word: וְלֹא יָקוּם
  choice: e ela não ficará de pé
  rationale: קום significa aqui permanecer, sustentar-se ou ser estabelecido. A formulação conserva a imagem hebraica e evita restringir o sentido a “não acontecerá” ou “não se cumprirá”.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão pela qual os planos e pronunciamentos dos adversários fracassarão.
- source_word: עִמָּנוּ אֵל
  choice: Deus está conosco
  rationale: Transforma a oração nominal hebraica em uma frase portuguesa clara, preservando seu sentido e seu peso teológico.
theological_decisions:
- issue: Relação de עִמָּנוּ אֵל com o tema de Emanuel em Isaías 7–8
  choice: Traduzir no texto principal como “Deus está conosco” e registrar em nota a alusão a Emanuel.
  alternative: Traduzir como “Emanuel” ou manter a ordem marcada “conosco está Deus”.
  rationale: Embora a expressão ecoe claramente o nome עִמָּנוּאֵל, em Isaías 8:10 ela aparece como duas palavras e funciona como oração. Traduzir a oração evita converter implicitamente a expressão em nome próprio, enquanto a nota preserva a conexão literária e teológica.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais no plural de ampla legibilidade brasileira. A expressão “não ficará de pé” mantém a imagem concreta do hebraico e o paralelismo poético sem soar arcaica.
