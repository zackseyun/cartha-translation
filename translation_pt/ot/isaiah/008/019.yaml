  terminology: “Médiuns e adivinhos” comunica com clareza duas categorias de especialistas em práticas de consulta sobrenatural, sem recorrer a termos arcaicos. “Chilreiam e murmuram” preserva o contraste entre os sons agudos/aviários e a fala baixa. “Deus”, “mortos” e “vivos” mantêm a terminologia central sem acréscimos interpretativos.
