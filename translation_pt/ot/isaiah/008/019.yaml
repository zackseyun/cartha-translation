  source_fidelity: 'A tradução preserva adequadamente a sequência e a função retórica do hebraico: a ordem de consultar praticantes divinatórios, a caracterização sonora deles, o apelo a buscar o próprio Deus e o contraste final com os mortos em favor dos vivos. “Médiuns” para אֹבוֹת é uma escolha moderna defensável, e a nota conserva a alternativa referente aos espíritos. “Adivinhos” para יִּדְּעֹנִים é um equivalente funcional suficientemente amplo sem importar categorias doutrinárias modernas.'
