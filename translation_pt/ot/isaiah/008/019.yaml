  text: וְ/כִֽי יֹאמְר֣וּ אֲלֵי/כֶ֗ם דִּרְשׁ֤וּ אֶל הָ/אֹבוֹת֙ וְ/אֶל הַ/יִּדְּעֹנִ֔ים הַֽ/מְצַפְצְפִ֖ים וְ/הַ/מַּהְגִּ֑ים הֲ/לוֹא עַם֙ אֶל אֱלֹהָ֣י/ו יִדְרֹ֔שׁ בְּעַ֥ד הַ/חַיִּ֖ים אֶל הַ/מֵּתִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/019.yaml
  text: And when they say to you[b][a], “Consult the mediums and the spiritists who chirp and mutter,” should not a people consult its God? Should they consult the dead on behalf of the living?
translation:
  language: pt
  text: 'E, quando disserem a vocês: “Consultem os médiuns[a] e os adivinhos, que chilreiam e murmuram[b]”, acaso um povo não deve consultar o seu Deus? Consultará os mortos em favor dos vivos?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os espíritos” ou “os que têm espíritos familiares”. O termo hebraico pode estar associado aos espíritos dos mortos, embora aqui provavelmente designe os praticantes que os consultavam.
    reason: lexical_alternative
  - marker: b
    text: Os verbos hebraicos imitam sons agudos, semelhantes aos de aves, e sons baixos e indistintos associados à consulta de espíritos; também se pode traduzir por “que piam e resmungam”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: E, quando
  rationale: Introduz uma situação prevista ou possível no fluxo do discurso; “quando” é natural em português e mantém a expectativa contextual sem excluir por completo a nuance condicional.
- source_word: יֹאמְרוּ אֲלֵיכֶם
  choice: disserem a vocês
  rationale: Preserva o plural indefinido dos falantes e emprega uma formulação clara e amplamente compreensível em português.
- source_word: דִּרְשׁוּ
  choice: Consultem
  rationale: Neste contexto, דרש indica buscar orientação por meio de uma fonte; “consultem” expressa de modo idiomático a prática divinatória.
- source_word: הָאֹבוֹת
  choice: os médiuns
  rationale: No contexto, o termo provavelmente designa os praticantes que mediam a consulta aos mortos. “Médiuns” é atual e inteligível, enquanto a ambiguidade entre praticantes e espíritos é registrada em nota.
- source_word: הַיִּדְּעֹנִים
  choice: os adivinhos
  rationale: Designa praticantes ocultistas ligados à obtenção de conhecimento sobrenatural. “Adivinhos” evita associar o texto especificamente ao espiritismo moderno e é mais transparente que terminologia arcaica.
- source_word: הַמְצַפְצְפִים
  choice: que chilreiam
  rationale: O particípio evoca sons agudos semelhantes aos de aves. “Chilreiam” conserva essa imagem sonora incomum.
- source_word: וְהַמַּהְגִּים
  choice: e murmuram
  rationale: Expressa fala baixa e indistinta, mantendo o contraste sonoro com “chilreiam” em linguagem digna e natural.
- source_word: הֲלוֹא עַם אֶל אֱלֹהָיו יִדְרֹשׁ
  choice: acaso um povo não deve consultar o seu Deus?
  rationale: Mantém a força da pergunta retórica e repete “consultar” para refletir a recorrência de דרש, preservando o singular possessivo ligado ao coletivo “povo”.
- source_word: בְּעַד הַחַיִּים
  choice: em favor dos vivos
  rationale: Representa o sentido de בְּעַד como agir em benefício ou em favor de alguém.
- source_word: אֶל הַמֵּתִים
  choice: Consultará os mortos
  rationale: Explicita na segunda pergunta o verbo subentendido pelo paralelismo, sem acrescentar conteúdo alheio ao contraste entre Deus e os mortos.
theological_decisions:
- issue: Natureza do contraste retórico entre buscar Deus e consultar os mortos
  choice: O versículo censura a busca de orientação junto aos mortos e a seus intermediários em vez de junto a Deus.
  alternative: Ler o texto como uma afirmação abrangente sobre a condição ou a incapacidade dos mortos.
  rationale: O hebraico concentra-se na fonte apropriada de orientação. A tradução preserva essa repreensão retórica sem deduzir uma doutrina mais ampla sobre o estado dos mortos.
- issue: Referente de אֹבוֹת
  choice: Traduzir no texto principal como “médiuns”, entendendo o termo como referência provável aos praticantes.
  alternative: Traduzir como “espíritos”, “fantasmas” ou “espíritos familiares”.
  rationale: O contexto de uma ordem para consultar favorece os praticantes, mas a forma lexical admite associação com os próprios espíritos; por isso, a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “A vocês” evita regionalismo excessivo; “médiuns e adivinhos” comunica o contexto ocultista sem importar categorias confessionais específicas. As perguntas retóricas e a imagem sonora do hebraico foram mantidas.
