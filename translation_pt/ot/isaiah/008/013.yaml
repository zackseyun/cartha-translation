  text: אֶת יְהוָ֥ה צְבָא֖וֹת אֹת֣/וֹ תַקְדִּ֑ישׁוּ וְ/ה֥וּא מוֹרַאֲ/כֶ֖ם וְ/ה֥וּא מַֽעֲרִֽצְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/013.yaml
  text: Yahweh of hosts—you shall regard him as holy[a]. Let him be your fear[b], and let him be your dread.
translation:
  language: pt
  text: É a Yahweh dos Exércitos que vocês devem reconhecer como santo[a]. Que ele seja o temor de vocês e o seu pavor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “santifiquem-no”, isto é, reconheçam-no e tratem-no como santo.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico também pode ser traduzido de modo declarativo: “ele é o temor de vocês e ele é o seu pavor”; ou, quanto ao sentido: “ele é aquele a quem vocês devem temer e de quem devem ter pavor”.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título como “SENHOR”, em conformidade com o valor próprio do tetragrama no texto hebraico.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Conserva o título tradicional e abrangente, que pode aludir tanto a exércitos celestes quanto terrenos, sem restringir indevidamente o referente.
- source_word: אֹתוֹ תַקְדִּישׁוּ
  choice: vocês devem reconhecer como santo
  rationale: Expressa o sentido causativo contextual de tratar ou reconhecer Yahweh como santo, evitando sugerir que seres humanos o tornam santo.
- source_word: מוֹרַאֲכֶם
  choice: o temor de vocês
  rationale: Mantém a construção nominal e permite tanto a ideia do temor sentido quanto a daquele que deve ser temido.
- source_word: מַעֲרִצְכֶם
  choice: o seu pavor
  rationale: Preserva o paralelismo com “temor” e a intensificação do segundo substantivo, que denota medo profundo ou aquilo que causa esse medo.
- source_word: וְהוּא ... וְהוּא
  choice: Seja ele ... e seja ele ...
  rationale: Transmite em português a força exortativa do contexto, embora o hebraico empregue duas orações nominais que também podem ser entendidas de modo declarativo.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; o SENHOR
  rationale: “Yahweh” preserva o nome pessoal presente no hebraico sem o substituir pelo título “SENHOR”. “Javé” é uma adaptação portuguesa possível, mas a transliteração escolhida mantém correspondência mais direta com a forma adotada no projeto.
- issue: Sentido de santificar Yahweh
  choice: reconhecer como santo
  alternative: santificar; tratar como santo
  rationale: A tradução deixa claro que a ordem é reconhecer e honrar a santidade de Yahweh, não conferir-lhe uma santidade que ele não possuísse.
- issue: Valor das orações nominais sobre temor e pavor
  choice: 'exortativo: “Seja ele...”'
  alternative: 'declarativo: “Ele é...”'
  rationale: O contexto de ordens favorece a continuação exortativa, mas a nota preserva a possibilidade formal de ler as orações hebraicas como declarações.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com “vocês” para a segunda pessoa do plural. A formulação conserva o paralelismo poético e a intensidade crescente de “temor” para “pavor”, enquanto as notas registram a literalidade e a ambiguidade das orações nominais hebraicas.
