- from: 'Pois, antes que o menino[a] saiba chamar: “Meu pai” e “Minha mãe”, as riquezas de Damasco[b] e os despojos de Samaria serão levados para diante do rei da Assíria.'
  to: Pois, antes que o menino[a] saiba chamar “Meu pai” e “Minha mãe”, as riquezas de Damasco[b] e os despojos de Samaria serão levados à presença do rei da Assíria.
  rationale: A revisão limita-se a melhorar a idiomaticidade de duas construções sem alterar o sentido. “À presença do rei da Assíria” representa de modo natural o valor de לִפְנֵי no contexto de bens conquistados e apresentados ao monarca, e a remoção dos dois-pontos torna a oração mais fluente.
