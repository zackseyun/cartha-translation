  text: כִּ֗י בְּ/טֶ֨רֶם֙ יֵדַ֣ע הַ/נַּ֔עַר קְרֹ֖א אָבִ֣/י וְ/אִמִּ֑/י יִשָּׂ֣א אֶת חֵ֣יל דַּמֶּ֗שֶׂק וְ/אֵת֙ שְׁלַ֣ל שֹׁמְר֔וֹן לִ/פְנֵ֖י מֶ֥לֶךְ אַשּֽׁוּר׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/004.yaml
  text: For before the boy knows how to cry[c][b][a], ‘My father’ and ‘My mother,’ the wealth of Damascus and the spoil of Samaria will be carried away before the king of Assyria.
translation:
  language: pt
  text: Pois, antes que o menino[a] saiba chamar “Meu pai” e “Minha mãe”, as riquezas de Damasco[b] e os despojos de Samaria serão levados à presença do rei da Assíria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz simplesmente “o menino”. No contexto imediato, provavelmente se refere ao filho de Isaías mencionado na passagem.
    reason: cross_reference
  - marker: b
    text: A palavra hebraica também pode significar “recursos”, “força” ou “exército”; aqui, o paralelo com “despojos” favorece “riquezas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da profecia-sinal precedente, com valor causal e explicativo natural em português.
- source_word: בְּטֶרֶם
  choice: antes que
  rationale: Marca que a ação ocorrerá antes de o menino atingir a capacidade mencionada.
- source_word: יֵדַע ... קְרֹא
  choice: saiba chamar
  rationale: A construção expressa a capacidade adquirida de proferir ou chamar pelos nomes dos pais; a formulação é concisa e mantém o sentido básico de קרא.
- source_word: הַנַּעַר
  choice: o menino
  rationale: Preserva o masculino singular e não incorpora ao texto uma identificação interpretativa, embora o contexto seja o de uma criança ainda muito pequena.
- source_word: אָבִי וְאִמִּי
  choice: “Meu pai” e “Minha mãe”
  rationale: Mantém os sufixos possessivos explícitos do hebraico sem acrescentar formas afetivas como “papai” ou “mamãe”.
- source_word: חֵיל
  choice: as riquezas
  rationale: Neste paralelo com despojos de guerra, o termo provavelmente designa bens ou recursos materiais; sua amplitude semântica é registrada em nota.
- source_word: שְׁלַל
  choice: os despojos
  rationale: Designa bens tomados em guerra e é corrente em português histórico-bíblico sem ser excessivamente arcaico.
- source_word: יִשָּׂא
  choice: serão levados
  rationale: Embora a forma hebraica seja ativa e singular, seu sujeito é impessoal; a passiva portuguesa comunica naturalmente que os bens serão transportados sem inserir um agente explícito.
- source_word: לִפְנֵי מֶלֶךְ אַשּׁוּר
  choice: para diante do rei da Assíria
  rationale: Expressa movimento e apresentação dos bens perante o rei, evitando que “antes do rei” seja entendido temporalmente.
theological_decisions:
- issue: Identidade de “o menino”
  choice: Mantê-lo como “o menino” no texto e explicar o vínculo contextual em nota.
  alternative: Identificá-lo expressamente como Maer-Salal-Hás-Baz, filho de Isaías.
  rationale: O versículo não nomeia o menino. O contexto imediato aponta fortemente para o filho de Isaías, mas a tradução não deve transformar essa inferência contextual em identificação explícita.
- issue: Natureza de חֵיל de Damasco
  choice: 'Traduzir como bens materiais: “riquezas”.'
  alternative: Traduzir como “força” ou “exército”.
  rationale: O paralelismo com os despojos de Samaria e o ato de levá-los ao rei favorecem bens ou recursos, mas a nota preserva a amplitude lexical do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Para diante de” foi usado para evitar a ambiguidade temporal de “antes de”. A ordem da frase acompanha de perto o hebraico sem sacrificar a fluidez.
