base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/022.yaml
  text: And he will look to the earth[a], and behold, distress and darkness, the gloom of anguish[b]; and thick darkness will be driven away.
translation:
  language: pt
  text: E olhará para a terra[a], e eis angústia e escuridão, escuridão de angústia; será lançado para as trevas profundas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para o país”, isto é, para o território.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico é condensado: “e trevas profundas, [alguém] impelido/lançado”. O particípio é masculino, enquanto “trevas profundas” é feminino; por isso, a tradução entende um sujeito humano implícito.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: אֶרֶץ
  choice: a terra
  rationale: O substantivo pode significar tanto “terra” em sentido amplo quanto “país/território”. O contraste contextual entre olhar para cima e olhar para a terra favorece “a terra”, sem eliminar a alternativa indicada em nota.
- source_word: יַבִּיט
  choice: olhará
  rationale: O hifil de נבט significa normalmente “olhar” ou “contemplar”. “Olhará” é natural e mantém a sequência de busca descrita no contexto.
- source_word: וְהִנֵּה
  choice: e eis
  rationale: A partícula chama enfaticamente a atenção para o que se apresenta aos olhos. “E eis” conserva sua força deíctica e o tom solene.
- source_word: צָרָה
  choice: angústia
  rationale: O termo denota aflição, aperto ou angústia. “Angústia” expressa de modo conciso a adversidade opressiva da cena.
- source_word: חֲשֵׁכָה
  choice: escuridão
  rationale: É o termo básico para escuridão; mantê-lo sem intensificação permite que אֲפֵלָה, no fim, expresse um grau mais forte.
- source_word: מְעוּף
  choice: sombras de
  rationale: Este substantivo raro designa provavelmente obscuridade ou sombra e parece estar em relação construta com צוּקָה. “Sombras de” preserva a imagem e produz uma expressão poética natural em português.
- source_word: צוּקָה
  choice: aflição
  rationale: O termo transmite aperto, angústia ou aflição. “Aflição” evita repetir “angústia” e conserva a sobreposição semântica do hebraico.
- source_word: אֲפֵלָה
  choice: densas trevas
  rationale: O substantivo indica escuridão profunda e opressiva. “Densas trevas” marca a intensificação em relação a חֲשֵׁכָה.
- source_word: מְנֻדָּח
  choice: será lançado
  rationale: O particípio passivo masculino de נדח descreve alguém expulso, impelido ou lançado. Como אֲפֵלָה é feminino, a concordância favorece entender uma pessoa implícita como aquela que é lançada nas trevas; a nota preserva a forma comprimida e a alternativa possível.
theological_decisions:
- issue: Sujeito e relação sintática na frase final וַאֲפֵלָה מְנֻדָּח
  choice: “e será lançado em densas trevas”, com sujeito humano implícito
  alternative: “e densas trevas, [alguém] expulso” ou entender as próprias trevas como afastadas
  rationale: מְנֻדָּח é masculino singular, enquanto אֲפֵלָה é feminino singular, o que dificulta tomá-lo simplesmente como predicado concordante de “trevas”. A tradução explicita a leitura sintaticamente mais provável, mas registra em nota a compressão e a incerteza do hebraico, sem transformá-las em afirmação doutrinária.
translation_notes:
  register: Português moderno, solene e acessível, com cadência poética. “E eis” conserva a ênfase do hebraico; “densas trevas” diferencia a imagem final da escuridão mencionada antes. A formulação evita regionalismos marcadamente brasileiros ou europeus.
