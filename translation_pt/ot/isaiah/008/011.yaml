base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/011.yaml
  text: 'For thus Yahweh said to me with a strong hand[a], warning me not to walk in the way of this people[b], saying:'
translation:
  language: pt
  text: 'Pois assim Yahweh me disse, com mão forte[a], advertindo-me[b] a não andar no caminho deste povo, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “enquanto sua mão pesava fortemente sobre mim”. A expressão hebraica sugere forte constrangimento ou impulso divino, mas não explicita o possessivo nem a relação temporal.'
    reason: lexical_alternative
  - marker: b
    text: O verbo também pode ser traduzido por “instruindo-me”, “corrigindo-me” ou “disciplinando-me”; aqui ele introduz uma proibição.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כֹה
  choice: Pois assim
  rationale: כִּי introduz a explicação ligada ao contexto anterior, e כֹה conserva a fórmula profética que apresenta a fala divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כְּחֶזְקַת הַיָּד
  choice: enquanto sua mão pesava fortemente sobre mim
  rationale: Expressa de modo natural a força constrangedora da mão divina e preserva a imagem hebraica; a relação temporal e a referência possessiva são esclarecimentos contextuais, não uma eliminação da ambiguidade do idioma.
- source_word: וְיִסְּרֵנִי
  choice: advertindo-me
  rationale: O verbo יסר pode significar corrigir, disciplinar, instruir ou advertir. Como introduz uma proibição, “advertindo-me” comunica bem sua função aqui.
- source_word: מִלֶּכֶת בְּדֶרֶךְ
  choice: a não andar no caminho
  rationale: A construção indica impedimento ou proibição, enquanto “andar no caminho” mantém a metáfora de conduta presente no hebraico.
- source_word: הָעָם הַזֶּה
  choice: deste povo
  rationale: Mantém o substantivo coletivo singular e o demonstrativo do texto hebraico.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Introduz o conteúdo da advertência, que prossegue no versículo seguinte; os dois-pontos preservam essa continuidade.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto contém diretamente o Tetragrama. A transliteração preserva o nome pessoal, sem substituí-lo por um título.
- issue: Natureza da ação expressa por יסר
  choice: advertindo-me
  alternative: disciplinando-me; instruindo-me; corrigindo-me
  rationale: A amplitude semântica do verbo inclui disciplina, correção e instrução. A proibição que se segue favorece “advertindo”, mas a nota conserva as demais possibilidades.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. Conserva a fórmula profética, a imagem da mão e a metáfora de andar em um caminho. A oração termina com dois-pontos porque a fala continua no versículo seguinte.
