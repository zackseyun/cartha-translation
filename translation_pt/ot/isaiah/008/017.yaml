  text: וְ/חִכִּ֨יתִי֙ לַ/יהוָ֔ה הַ/מַּסְתִּ֥יר פָּנָ֖י/ו מִ/בֵּ֣ית יַעֲקֹ֑ב וְ/קִוֵּ֖יתִֽי לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/017.yaml
  text: And I will wait for Yahweh[a], who hides his face from the house of Jacob[b], and I will hope in him.
translation:
  language: pt
  text: E esperarei por Yahweh, que esconde o seu rosto[a] da casa de Jacó[b], e nele porei a minha esperança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que está escondendo o seu rosto” ou “que escondeu o seu rosto”. O particípio hebraico pode indicar uma ação em curso ou característica.
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, “a casa de Jacó”, designação coletiva dos descendentes de Jacó, isto é, Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וְחִכִּיתִי
  choice: E esperarei
  rationale: O verbo חכה expressa espera acompanhada de expectativa. “Esperarei” é natural em português e não acrescenta qualificações ausentes, como “pacientemente”.
- source_word: לַיהוָה
  choice: por Yahweh
  rationale: A preposição ל indica aquele por quem se espera. “Esperar por Yahweh” reproduz com naturalidade essa direção, e o nome divino é transliterado como “Yahweh”.
- source_word: הַמַּסְתִּיר פָּנָיו
  choice: que esconde o seu rosto
  rationale: O particípio de סתר pode indicar uma ação em curso ou característica. A formulação preserva a expressão hebraica e sua tensão teológica sem explicá-la como retirada de favor.
- source_word: מִבֵּית יַעֲקֹב
  choice: da casa de Jacó
  rationale: Mantém a designação coletiva e pactual do hebraico, em vez de reduzi-la a “família” ou substituí-la interpretativamente por “Israel”.
- source_word: וְקִוֵּיתִי
  choice: e porei a minha esperança
  rationale: קוה combina expectativa e confiança. Esta formulação distingue o segundo verbo do primeiro e conserva o paralelismo sem repetição pouco expressiva em português.
- source_word: לוֹ
  choice: nele
  rationale: Embora ל tenha sentido básico de “a/para”, com קוה a expressão indica esperança dirigida e depositada em alguém; “nele” é a construção idiomática adequada em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” preserva explicitamente o nome pactual sem substituí-lo por um título.
- issue: Deus esconder o rosto
  choice: Preservar a expressão “esconde o seu rosto”
  alternative: afasta-se; retira o seu favor
  rationale: A expressão hebraica tem peso pactual e admite implicações que não devem ser incorporadas à tradução como explicação. A imagem e sua tensão teológica são mantidas.
- issue: Valor temporal do particípio הַמַּסְתִּיר
  choice: que esconde
  alternative: que está escondendo; que escondeu
  rationale: O presente simples é natural e pode expressar ação vigente ou característica, preservando a abertura aspectual do particípio hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se a expressão bíblica “casa de Jacó” e evita-se tanto linguagem arcaica quanto expansão interpretativa. O marcador [a] foi colocado junto à expressão a que sua nota efetivamente se refere.
