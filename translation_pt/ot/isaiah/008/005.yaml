  text: Yahweh spoke to me again[a], saying,
translation:
  language: pt
  text: 'Yahweh voltou a falar comigo[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “E Yahweh acrescentou a falar-me novamente, dizendo” — expressão idiomática que significa “Yahweh voltou a falar comigo, dizendo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף ... עוֹד
  choice: voltou a falar
  rationale: A construção idiomática expressa a repetição do ato de falar. “Voltou a falar” é natural em português e preserva o valor iterativo sem reproduzir literalmente “acrescentou falar”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: דַּבֵּר אֵלַי
  choice: falar comigo
  rationale: Embora אֶל indique literalmente direção (“a mim”), “falar comigo” é a formulação idiomática corrente em português neste contexto.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém a fórmula hebraica que introduz o discurso direto apresentado no versículo seguinte.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama. A transliteração “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A formulação conserva a abertura para a fala direta do versículo seguinte.
