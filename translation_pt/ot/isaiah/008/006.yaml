base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/006.yaml
  text: Because this people has rejected the waters of Shiloah that flow gently[a], and rejoices over Rezin and the son of Remaliah[b],
translation:
  language: pt
  text: Porque este povo rejeitou as águas de Siloá[a], que correm suavemente, e se alegra com Rezim e o filho de Remalias[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Siloá reflete o nome hebraico; a tradição grega apresenta a forma Siloé.
    reason: lexical_alternative
  - marker: b
    text: 'Ou, segundo outra interpretação desta frase difícil: “e treme diante de Rezim e do filho de Remalias”. O texto hebraico diz “se alegra”, mas alguns entendem o sentido de modo diferente com base no contexto.'
    reason: alternative_reading
lexical_decisions:
- source_word: יַעַן כִּי
  choice: Porque
  rationale: Introduz de modo natural a causa do juízo anunciado no versículo seguinte, preservando a força causal da expressão hebraica.
- source_word: מָאַס
  choice: rejeitou
  rationale: Expressa uma recusa deliberada sem acrescentar a conotação emocional mais forte de “desprezou”.
- source_word: הָעָם הַזֶּה
  choice: este povo
  rationale: Conserva o singular e a linguagem profética e relacional do hebraico.
- source_word: מֵי הַשִּׁלֹחַ
  choice: as águas de Siloá
  rationale: Translitera o nome hebraico שִׁלֹחַ; a forma mais conhecida “Siloé”, proveniente da tradição grega, é registrada em nota.
- source_word: הַהֹלְכִים לְאַט
  choice: que correm suavemente
  rationale: Formulação portuguesa natural para o movimento tranquilo das águas, preservando o contraste com a torrente impetuosa do versículo seguinte.
- source_word: וּמְשׂוֹשׂ
  choice: e se alegra com
  rationale: Traduz o texto massorético conforme a raiz שׂושׂ, “alegrar-se, exultar”. A preposição “com” produz uma construção portuguesa natural sem definir excessivamente a relação política expressa pela frase difícil.
- source_word: אֶת רְצִין וּבֶן רְמַלְיָהוּ
  choice: com Rezim e o filho de Remalias
  rationale: Mantém os nomes pessoais e a expressão hebraica “o filho de Remalias”, que evita substituir o título por uma identificação interpretativa.
theological_decisions:
- issue: Sentido de וּמְשׂוֹשׂ אֶת רְצִין וּבֶן רְמַלְיָהוּ em um contexto difícil
  choice: Traduzir o texto massorético como “e se alegra com Rezim e o filho de Remalias”
  alternative: “e treme diante de Rezim e do filho de Remalias”
  rationale: A raiz preservada no texto massorético significa “alegrar-se/exultar”. Embora o contexto tenha levado alguns a propor medo ou pavor, essa interpretação não deve substituir silenciosamente o texto hebraico; por isso, aparece em nota como leitura alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva a estrutura causal e a continuação sintática indicada pela vírgula final. Emprega “Siloá” a partir do hebraico e registra em nota a forma tradicional “Siloé”.
