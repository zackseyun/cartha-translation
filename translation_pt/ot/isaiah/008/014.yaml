base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/014.yaml
  text: And he will become a sanctuary[a], but a stone to strike against and a rock to stumble over for both houses of Israel[b], a trap and a snare to the inhabitant of Jerusalem.
translation:
  language: pt
  text: E ele se tornará um santuário, mas também uma pedra em que se esbarra e uma rocha em que se tropeça para as duas casas de Israel, uma armadilha e um laço para os habitantes de Jerusalém.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “para o habitante de Jerusalém”; o singular tem sentido coletivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: E ele se tornará
  rationale: O qatal com conjunção em discurso profético admite sentido futuro; “se tornará” expressa naturalmente a passagem às funções predicadas sem explicitar o referente além do hebraico.
- source_word: לְמִקְדָּשׁ
  choice: um santuário
  rationale: Preserva o sentido de lugar santo e a possível nuance protetora, sem reduzi-lo a “refúgio”.
- source_word: אֶבֶן נֶגֶף
  choice: uma pedra contra a qual se bate
  rationale: Mantém a imagem concreta de impacto e a distingue de מִכְשׁוֹל, que na expressão seguinte indica mais explicitamente o tropeço.
- source_word: צוּר מִכְשׁוֹל
  choice: uma rocha na qual se tropeça
  rationale: Reproduz a metáfora concreta e reserva “tropeçar” para מִכְשׁוֹל.
- source_word: לִשְׁנֵי בָתֵּי יִשְׂרָאֵל
  choice: para as duas casas de Israel
  rationale: Conserva a dualidade histórica e política expressa pelo numeral hebraico.
- source_word: לְפַח וּלְמוֹקֵשׁ
  choice: uma armadilha e um laço
  rationale: Mantém os dois termos paralelos sem fundi-los numa só imagem.
- source_word: לְיוֹשֵׁב יְרוּשָׁלִָם
  choice: para os habitantes de Jerusalém
  rationale: O particípio singular tem força coletiva; o plural é a forma natural e inequívoca de expressar essa coletividade em português.
theological_decisions:
- issue: Referente de “ele”
  choice: Manter o pronome, cujo referente contextual é o SENHOR no versículo anterior.
  alternative: Substituir o pronome por “o SENHOR” ou entender a expressão impessoalmente.
  rationale: O contexto imediato favorece o SENHOR como referente, mas o hebraico não repete o nome; manter “ele” preserva a formulação e evita explicitação excessiva.
- issue: Paradoxo entre proteção e juízo
  choice: Conservar “santuário”, seguido de “mas também” e das imagens de pedra, rocha, armadilha e laço.
  alternative: Verter “santuário” como “refúgio” e suavizar a oposição.
  rationale: O texto aplica ao mesmo referente imagens de santidade/proteção e de queda/juízo; a tradução não resolve essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Mas também” torna explícito o contraste contextual sem apagar o encadeamento hebraico. O plural “habitantes” evita uma formulação pouco natural em português, com a forma singular registrada em nota.
