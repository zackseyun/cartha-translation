  timestamp: '2026-07-13T23:30:14Z'
review_pass:
  verdict: revise
  source_fidelity: 'A estrutura e as imagens do hebraico são preservadas: o referente pronominal permanece implícito, «santuário» traduz bem מִקְדָּשׁ, «as duas casas de Israel» conserva a dualidade, e «armadilha e laço» mantém o par lexical. Contudo, «uma pedra contra a qual se bate» não é uma formulação portuguesa natural para a imagem de impacto expressa por אֶבֶן נֶגֶף.'
  naturalness: «Uma pedra em que se esbarra» é idiomático em português moderno e comunica a colisão sem antecipar o verbo «tropeçar», que corresponde apropriadamente à expressão seguinte. «Habitantes de Jerusalém» é uma boa explicitação portuguesa do singular coletivo hebraico, devidamente anotada.
  terminology: «Santuário», «rocha», «armadilha» e «laço» são termos adequados e de registro bíblico moderno. A oposição contextual introduzida por «mas também» é aceitável, embora o hebraico empregue simplesmente a conjunção; ela não resolve nem altera a tensão do versículo.
  issues:
  - severity: medium
    issue: Formulação pouco natural de «uma pedra contra a qual se bate».
    rationale: Em português, «bater contra uma pedra» normalmente requer um sujeito ou objeto explícito e a construção relativa soa artificial. «Uma pedra em que se esbarra» preserva com clareza a metáfora de choque de נֶגֶף e mantém sua distinção de «uma rocha em que se tropeça» para מִכְשׁוֹל.
