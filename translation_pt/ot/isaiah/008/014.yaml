revisions:
- from: E ele se tornará um santuário, mas também uma pedra contra a qual se bate e uma rocha na qual se tropeça para as duas casas de Israel, uma armadilha e um laço para os habitantes de Jerusalém.[a]
  to: E ele se tornará um santuário, mas também uma pedra em que se esbarra e uma rocha em que se tropeça para as duas casas de Israel, uma armadilha e um laço para os habitantes de Jerusalém.[a]
  rationale: A revisão limita-se a tornar natural em português a primeira metáfora de obstáculo físico. «Esbarrar» representa o impacto associado a נֶגֶף, enquanto «tropeçar» continua reservado para מִכְשׁוֹל. O restante da redação e a nota preservam fielmente as escolhas seguras do rascunho.
