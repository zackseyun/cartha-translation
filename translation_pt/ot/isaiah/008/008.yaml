  text: וְ/חָלַ֤ף בִּֽ/יהוּדָה֙ שָׁטַ֣ף וְ/עָבַ֔ר עַד צַוָּ֖אר יַגִּ֑יעַ וְ/הָיָה֙ מֻטּ֣וֹת כְּנָפָ֔י/ו מְלֹ֥א רֹֽחַב אַרְצְ/ךָ֖ עִמָּ֥נוּ אֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/008.yaml
  text: It will sweep on into Judah; it will overflow and pass through; it will reach up to the neck. And the spread of its wings will fill the breadth of your land[a], O Immanuel.
translation:
  language: pt
  text: Ele avançará por Judá; transbordará e a atravessará; chegará até o pescoço. A extensão das suas asas encherá toda a largura da sua terra, ó Emanuel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Emanuel significa “Deus está conosco”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָלַף
  choice: avançará
  rationale: No contexto da metáfora do rio invasor, comunica movimento contínuo e ameaçador sem abandonar o sentido básico de passar adiante.
- source_word: בִּיהוּדָה
  choice: sobre Judá
  rationale: A preposição com o verbo de movimento pode indicar a entrada e o avanço sobre o território; “sobre” também se integra naturalmente à imagem da inundação.
- source_word: שָׁטַף
  choice: transbordará
  rationale: Preserva diretamente a imagem fluvial do contexto e a ideia de águas que ultrapassam seus limites.
- source_word: וְעָבַר
  choice: e passará adiante
  rationale: Expressa a travessia continuada da força invasora e evita repetir “avançará”.
- source_word: עַד צַוָּאר יַגִּיעַ
  choice: chegará até o pescoço
  rationale: Mantém a metáfora hebraica de perigo extremo e quase completa submersão.
- source_word: מֻטּוֹת כְּנָפָיו
  choice: a extensão de suas asas
  rationale: Representa aquilo que está estendido ou aberto. Mantém a mudança imagética do rio para asas sem tentar explicar ou harmonizar a figura.
- source_word: מְלֹא רֹחַב אַרְצְךָ
  choice: encherá toda a largura da sua terra
  rationale: Conserva tanto o verbo “encher” quanto o substantivo “largura”, deixando explícita em português a ideia de plena extensão territorial.
- source_word: עִמָּנוּ אֵל
  choice: ó Emanuel
  rationale: Trata a expressão como nome em vocativo, em ligação literária com Isaías 7:14, e oferece seu significado em nota.
theological_decisions:
- issue: Se עִמָּנוּ אֵל deve ser apresentado como nome próprio ou traduzido como a oração “Deus está conosco”
  choice: ó Emanuel
  alternative: Deus está conosco; ó Deus-conosco
  rationale: O contexto de Isaías já apresentou a expressão como nome em 7:14. O vocativo preserva a possível interpelação ao personagem nomeado e a associação da terra com ele, sem eliminar o significado do nome, explicado em nota.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com leitura natural no Brasil. A sequência curta de verbos conserva o ímpeto da inundação; a passagem súbita de águas para asas é mantida como no hebraico, sem explicação interpretativa no corpo do texto.
