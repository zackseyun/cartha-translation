base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/021.yaml
  text: And he will pass through it[a], hard-pressed and hungry; and when he is hungry, he will become enraged and curse his king and his God, and he will turn upward.
translation:
  language: pt
  text: E ele passará por ela, aflito e com fome; quando sentir fome, ficará furioso e amaldiçoará seu rei e seu Deus, e se voltará para o alto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “olhará para o alto”. O hebraico diz literalmente “se voltará para o alto”, provavelmente descrevendo o aflito erguendo o olhar em direção ao céu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר בָּהּ
  choice: E ele passará por ela
  rationale: Mantém o verbo no masculino singular e o sufixo feminino singular. No contexto, ב com עבר indica atravessar ou percorrer aquilo a que o pronome se refere, provavelmente a terra mencionada no contexto.
- source_word: נִקְשֶׁה וְרָעֵב
  choice: aflito e faminto
  rationale: “Aflito” comunica a condição de grave aperto expressa por נִקְשֶׁה; “faminto” representa רָעֵב com naturalidade e com a intensidade adequada ao contexto.
- source_word: וְהָיָה כִּי יִרְעַב
  choice: quando sentir fome
  rationale: Expressa de modo natural a circunstância temporal introduzida pela construção hebraica, sem reproduzir mecanicamente sua fórmula narrativa.
- source_word: וְהִתְקַצַּף
  choice: ficará furioso
  rationale: Representa a entrada em um estado de intensa ira sugerida pela forma hitpael.
- source_word: וְקִלֵּל בְּמַלְכּוֹ וּבֵאלֹהָיו
  choice: amaldiçoará seu rei e seu Deus
  rationale: O verbo piel significa diretamente “amaldiçoar”, e a preposição marca os alvos da maldição. Os possessivos e o singular de “Deus” são preservados.
- source_word: וּפָנָה לְמָעְלָה
  choice: e se voltará para cima
  rationale: Mantém o sentido literal de “voltar-se” e o advérbio “para cima”, sem acrescentar “o rosto” ou reduzir o gesto apenas a “olhar”.
theological_decisions:
- issue: Masculino singular representativo em contexto de juízo
  choice: Manter “ele” e as formas verbais no singular
  alternative: Usar uma construção impessoal ou o plural “eles”
  rationale: O hebraico emprega coerentemente formas masculinas singulares. A tradução preserva essa forma gramatical sem afirmar que somente homens estejam em vista.
- issue: Referência de “seu Deus”
  choice: Traduzir no singular como “seu Deus”
  alternative: Traduzir “seus deuses” ou identificar explicitamente o SENHOR
  rationale: Embora אֱלֹהִים possa ter forma plural, o contexto e o sufixo favorecem aqui o singular. O texto não nomeia explicitamente a divindade, por isso a tradução preserva a tensão sem especificação adicional.
- issue: Gesto final dirigido para cima
  choice: Traduzir literalmente “se voltará para cima”
  alternative: Interpretar como “olhará para cima” ou “voltará o rosto para o céu”
  rationale: A formulação mantém a ambiguidade entre movimento, orientação e olhar, evitando acrescentar “rosto” ou “céu”, palavras não expressas no hebraico.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A ordem e o encadeamento do hebraico são preservados sem sacrificar a naturalidade. “Aflito” evita uma expressão excessivamente coloquial, e “se voltará para cima” conserva a ambiguidade do original.
