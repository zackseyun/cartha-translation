  text: וְ/כָ֥שְׁלוּ בָ֖/ם רַבִּ֑ים וְ/נָפְל֣וּ וְ/נִשְׁבָּ֔רוּ וְ/נוֹקְשׁ֖וּ וְ/נִלְכָּֽדוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/015.yaml
  text: And many among them will stumble[a]; they will fall and be broken; they will be snared and captured.
translation:
  language: pt
  text: E muitos entre eles tropeçarão[a]; cairão e serão quebrados; ficarão presos na armadilha e serão capturados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “muitos tropeçarão nela” ou “por causa dela”, entendendo o pronome como referência à pedra ou à armadilha mencionada no contexto imediato.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכָשְׁלוּ
  choice: tropeçarão
  rationale: כשל expressa tropeçar ou cambalear. “Tropeçarão” mantém a imagem concreta da pedra de tropeço no contexto e comunica naturalmente o sentido futuro ou resultante.
- source_word: בָם
  choice: entre eles
  rationale: A preposição ב com sufixo admite mais de uma relação. “Entre eles” entende o referente como o grupo no qual muitos tropeçarão, sem eliminar em nota a possibilidade de referência à pedra ou à armadilha anteriores.
- source_word: רַבִּים
  choice: muitos
  rationale: Preserva a concisão do substantivo adjetival hebraico, deixando implícito que se trata de pessoas.
- source_word: וְנָפְלוּ
  choice: cairão
  rationale: נפל é o verbo comum para “cair”; a forma coordenada reproduz a progressão do hebraico.
- source_word: וְנִשְׁבָּרוּ
  choice: serão quebrados
  rationale: O nifal de שבר tem sentido passivo. “Serão quebrados” conserva a metáfora sem intensificá-la indevidamente como “despedaçados”.
- source_word: וְנוֹקְשׁוּ
  choice: ficarão presos na armadilha
  rationale: O nifal de יקשׁ indica ser apanhado por uma armadilha. A formulação é clara em português atual e preserva a imagem concreta.
- source_word: וְנִלְכָּדוּ
  choice: serão capturados
  rationale: לכד significa capturar ou tomar. “Serão capturados” distingue o resultado final do ato anterior de ficar preso na armadilha.
theological_decisions:
- issue: Linguagem metafórica de juízo no contexto da pedra de tropeço
  choice: Manter a sequência concreta de tropeçar, cair, ser quebrado, ficar preso numa armadilha e ser capturado.
  alternative: Resumir a sequência como ruína geral ou queda espiritual.
  rationale: O versículo prolonga as imagens concretas de obstáculo, armadilha e juízo do contexto imediato. Preservar a sequência evita impor uma interpretação abstrata única.
- issue: Referente de בָם
  choice: Traduzir no texto principal como “entre eles” e registrar a ambiguidade em nota.
  alternative: “nela” ou “por ela”, remetendo à pedra ou à armadilha mencionada no contexto.
  rationale: A forma hebraica permite relações diferentes, e o contexto oferece mais de um possível referente imagético. A nota preserva essa tensão sem tornar o texto principal artificial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação concisa acompanha o ritmo cumulativo do hebraico; “armadilha” explicita naturalmente a imagem verbal sem abandonar sua concretude.
