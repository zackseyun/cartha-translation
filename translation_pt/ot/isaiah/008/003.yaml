  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וָ/אֶקְרַב֙ אֶל הַ/נְּבִיאָ֔ה וַ/תַּ֖הַר וַ/תֵּ֣לֶד בֵּ֑ן וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י קְרָ֣א שְׁמ֔/וֹ מַהֵ֥ר שָׁלָ֖ל חָ֥שׁ בַּֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/003.yaml
  text: So I went near to the prophetess[a], and she conceived and bore a son. Then Yahweh said to me[b], “Call his name Maher-shalal-hash-baz.”
translation:
  language: pt
  text: 'Então me aproximei da profetisa; ela engravidou e deu à luz um filho. E Yahweh me disse: “Dê-lhe o nome de Maer-Salal-Hás-Baz[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome provavelmente significa algo como “rápido para o despojo, veloz para a presa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקְרַב
  choice: Então me aproximei
  rationale: O verbo קרב significa literalmente “aproximar-se”. No contexto, funciona como um eufemismo discreto para relações conjugais; a tradução conserva a forma contida do hebraico sem explicitar além do que o texto diz.
- source_word: הַנְּבִיאָה
  choice: a profetisa
  rationale: O substantivo hebraico é a forma feminina de “profeta”. “Profetisa” é a forma portuguesa corrente, concisa e fiel à marcação de gênero do original.
- source_word: וַתַּהַר
  choice: ela engravidou
  rationale: הרה pode significar “conceber” ou “ficar grávida”. “Engravidou” é natural e imediatamente compreensível no português moderno.
- source_word: וַתֵּלֶד בֵּן
  choice: e deu à luz um filho
  rationale: Expressa de maneira natural em português a construção hebraica com ילד e בֵּן, preservando a sequência narrativa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: קְרָא שְׁמוֹ
  choice: Dê-lhe o nome de
  rationale: A expressão hebraica significa literalmente “chame o nome dele”. A formulação escolhida preserva o sentido da ordem de nomeação em português natural.
- source_word: מַהֵר שָׁלָל חָשׁ בַּז
  choice: Maer-Salal-Hás-Baz
  rationale: A expressão funciona como nome simbólico pessoal; por isso, é transliterada no texto principal. Seu significado relevante é apresentado em nota.
theological_decisions:
- issue: Se deve ser explicitado o sentido sexual de וָאֶקְרַב אֶל הַנְּבִיאָה
  choice: 'Conservar o eufemismo hebraico: “me aproximei da profetisa”'
  alternative: “tive relações com a profetisa” ou “dormi com a profetisa”
  rationale: O contexto indica relações conjugais, mas o hebraico emprega uma expressão deliberadamente discreta. A tradução preserva o grau de explicitude do texto e não elimina sua forma eufemística.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A pontuação evita uma sequência pesada de orações coordenadas, sem alterar o fluxo narrativo do hebraico. O nome simbólico segue uma transliteração adaptada à leitura em português.
