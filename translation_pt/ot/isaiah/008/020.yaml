  text: לְ/תוֹרָ֖ה וְ/לִ/תְעוּדָ֑ה אִם לֹ֤א יֹֽאמְרוּ֙ כַּ/דָּבָ֣ר הַ/זֶּ֔ה אֲשֶׁ֥ר אֵֽין ל֖/וֹ שָֽׁחַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/020.yaml
  text: To the law and to the testimony! If they do not speak according to this word[b][a], there is no dawn for them.
translation:
  language: pt
  text: À instrução[a] e ao testemunho! Se não falarem de acordo com esta palavra, não há aurora para eles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “À lei e ao testemunho!”. O hebraico torá pode significar tanto “instrução” como “lei”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico da frase final é conciso e admite mais de uma compreensão. A cláusula “não há aurora” também pode ser entendida como ligada a “esta palavra/mensagem”, em vez de se referir aos que falam.
    reason: alternative_reading
lexical_decisions:
- source_word: לְתוֹרָה
  choice: À instrução
  rationale: תּוֹרָה pode designar instrução ou lei. Neste contexto profético, “instrução” comunica com naturalidade o ensino autorizado de Deus sem restringir o termo ao sentido jurídico; a alternativa tradicional “lei” é preservada em nota.
- source_word: וְלִתְעוּדָה
  choice: e ao testemunho
  rationale: תְּעוּדָה expressa testemunho ou atestação. “Testemunho” mantém o paralelismo e a ideia de uma declaração autorizada.
- source_word: אִם לֹא יֹאמְרוּ
  choice: Se não falarem
  rationale: Mantém o valor condicional mais direto de אִם לֹא. “Falarem” se ajusta ao contexto de pronunciamentos e orientação, embora “disserem” também seja possível.
- source_word: כַּדָּבָר הַזֶּה
  choice: de acordo com esta palavra
  rationale: Preserva דָּבָר como “palavra” e entende כ־ como indicação de conformidade com o padrão revelado.
- source_word: אֲשֶׁר אֵין לוֹ שָׁחַר
  choice: não há aurora para eles
  rationale: Mantém a imagem literal de שַׁחַר, “aurora”. O singular לוֹ pode retomar de modo distributivo ou coletivo os que falam; o plural idiomático em português acompanha o sujeito implícito de “falarem”.
theological_decisions:
- issue: Referente e sentido da oração final
  choice: A oração declara que não há aurora para os que não falam de acordo com a revelação indicada.
  alternative: 'A oração pode ser ligada mais estreitamente à “palavra”: “uma palavra para a qual não há aurora” ou “na qual não há luz”.'
  rationale: O contexto contrasta a revelação de Deus com fontes ilegítimas de orientação. A formulação escolhida expressa a advertência sem transformar “aurora” em uma conclusão doutrinária mais explícita; a compactação e a possível ligação sintática alternativa do hebraico são registradas em nota.
- issue: Força de אִם לֹא
  choice: 'Condicional: “Se não...”'
  alternative: 'Asseverativa: “Certamente...” ou “Com certeza...”'
  rationale: O sentido condicional é direto e natural no contexto, mas reconhece-se que אִם pode assumir força enfática em certas construções.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A abertura elíptica “À instrução e ao testemunho!” conserva a concisão e a força exortativa do hebraico. “Aurora” mantém a imagem poética sem explicá-la como “luz” ou “esperança” no corpo do texto.
