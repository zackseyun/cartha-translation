source:
  edition: WLC
  text: הִנֵּ֣ה אָנֹכִ֗י וְ/הַ/יְלָדִים֙ אֲשֶׁ֣ר נָֽתַן לִ֣/י יְהוָ֔ה לְ/אֹת֥וֹת וּ/לְ/מוֹפְתִ֖ים בְּ/יִשְׂרָאֵ֑ל מֵ/עִם֙ יְהוָ֣ה צְבָא֔וֹת הַ/שֹּׁכֵ֖ן בְּ/הַ֥ר צִיּֽוֹן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/018.yaml
  text: Behold[a], I and the children whom Yahweh has given me are for signs and wonders in Israel from Yahweh of Armies, who dwells on Mount Zion.
translation:
  language: pt
  text: 'Vejam: eu e os filhos que Yahweh me deu somos sinais e prodígios em Israel, da parte de Yahweh dos Exércitos,[a] que habita no monte Sião.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, segundo a forma tradicional: “o SENHOR dos Exércitos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Vejam
  rationale: Interjeição deíctica que chama a atenção para a declaração. “Vejam” conserva essa força em português atual e se dirige naturalmente aos ouvintes implícitos.
- source_word: אָנֹכִי
  choice: eu
  rationale: O pronome independente é enfático; em português, sua expressão explícita após “Vejam” preserva a ênfase sem exigir “eu mesmo”.
- source_word: וְהַיְלָדִים
  choice: e os filhos
  rationale: No contexto, יְלָדִים designa os filhos de Isaías. “Filhos” é mais específico e natural que “crianças”, sem restringir indevidamente a idade.
- source_word: אֲשֶׁר נָתַן לִי יְהוָה
  choice: que Yahweh me deu
  rationale: Reproduz com clareza a oração relativa e o perfeito hebraico, cuja ação passada mantém relevância no presente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְאֹתוֹת וּלְמוֹפְתִים
  choice: sinais e prodígios
  rationale: Os dois substantivos indicam que Isaías e seus filhos funcionam como sinais extraordinários dados por Deus. O português permite que uma única construção predicativa, “somos”, governe naturalmente ambos.
- source_word: בְּיִשְׂרָאֵל
  choice: em Israel
  rationale: Mantém a leitura locativa mais direta da preposição ב.
- source_word: מֵעִם
  choice: da parte de
  rationale: 'Expressa de modo natural a origem pessoal: os sinais procedem de Yahweh, evitando a possível leitura espacial rígida de “desde” ou “de junto de”.'
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Traduz צְבָאוֹת de modo transparente como “Exércitos” e conserva o nome pessoal Yahweh.
- source_word: הַשֹּׁכֵן
  choice: que habita
  rationale: O particípio descreve a habitação contínua e característica de Yahweh; “que habita” é natural e dignificado.
- source_word: בְּהַר צִיּוֹן
  choice: no monte Sião
  rationale: Forma idiomática em português para a localização associada ao monte Sião.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal sem o substituir por um título ou adotar uma vocalização tradicional posterior.
- issue: Sentido de יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  alternative: Yahweh dos Exércitos celestiais; SENHOR dos Exércitos
  rationale: “Exércitos” mantém a amplitude do hebraico צְבָאוֹת sem determinar se a referência é exclusivamente celestial, terrena ou cósmica; a forma tradicional com “SENHOR” é registrada em nota.
- issue: Função de Isaías e seus filhos
  choice: somos sinais e prodígios
  alternative: servimos de sinais e presságios
  rationale: A construção preserva a afirmação de que as próprias pessoas funcionam como sinais provenientes de Yahweh, sem explicar antecipadamente a natureza exata dos acontecimentos significados.
translation_notes:
  register: Português moderno, claro e dignificado, com legibilidade brasileira e alcance internacional. “Vejam” comunica o chamado enfático de הִנֵּה sem arcaísmo; “prodígios” preserva o tom profético tradicional, e “da parte de” explicita naturalmente a ideia de origem pessoal em מֵעִם.
