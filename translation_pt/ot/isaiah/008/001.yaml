source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י קַח לְ/ךָ֖ גִּלָּי֣וֹן גָּד֑וֹל וּ/כְתֹ֤ב עָלָי/ו֙ בְּ/חֶ֣רֶט אֱנ֔וֹשׁ לְ/מַהֵ֥ר שָׁלָ֖ל חָ֥שׁ בַּֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/001.yaml
  text: 'Then Yahweh said to me[b][a], “Take for yourself a large tablet and write on it with an ordinary stylus: ‘Maher-shalal-hash-baz.’”'
translation:
  language: pt
  text: 'Então Yahweh me disse: “Pegue para você uma tabuleta grande e escreva nela com um estilete comum[a]: ‘Maer-Salal-Hás-Baz’[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com um estilete de homem”, “com um estilete comum” ou “em escrita comum”.
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, Maer-Salal-Hás-Baz, provavelmente “Rápido para o despojo, veloz para a presa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: גִּלָּיוֹן גָּדוֹל
  choice: uma tabuleta grande
  rationale: גִּלָּיוֹן designa uma superfície para escrita, possivelmente uma tabuleta, folha ou painel; “tabuleta” é clara no contexto de uma mensagem escrita de modo visível.
- source_word: קַח לְךָ
  choice: Pegue para você
  rationale: Conserva a nuance pessoal ou reflexiva do dativo לְךָ sem tornar a frase obscura.
- source_word: וּכְתֹב עָלָיו
  choice: e escreva nela
  rationale: Reproduz diretamente o imperativo e faz a concordância natural com “tabuleta”.
- source_word: בְּחֶרֶט אֱנוֹשׁ
  choice: com um estilete comum
  rationale: חֶרֶט pode indicar estilete ou instrumento de escrita, enquanto אֱנוֹשׁ provavelmente assinala o caráter humano ou comum; a nota preserva outras leituras possíveis.
- source_word: לְמַהֵר שָׁלָל חָשׁ בַּז
  choice: Maer-Salal-Hás-Baz
  rationale: A expressão funciona no contexto como nome simbólico; por isso, é transliterada no texto, e seu provável sentido lexical aparece em nota.
- source_word: וַיֹּאמֶר ... אֵלַי
  choice: Então Yahweh me disse
  rationale: “Então” expressa com naturalidade o avanço da narrativa marcado pelo waw consecutivo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz explicitamente o nome divino; a transliteração o distingue de títulos como “Senhor”.
- issue: Traduzir ou transliterar לְמַהֵר שָׁלָל חָשׁ בַּז
  choice: Transliterar como nome simbólico no texto principal
  alternative: Traduzir no texto como “Rápido para o despojo, veloz para a presa”
  rationale: Nos versículos seguintes, a expressão é usada como nome. A nota comunica o sentido provável sem eliminar a função nominal nem esconder a incerteza da formulação hebraica.
- issue: Sentido de אֱנוֹשׁ em בְּחֶרֶט אֱנוֹשׁ
  choice: comum
  alternative: humano; de homem; escrita comum
  rationale: No sintagma, אֱנוֹשׁ provavelmente caracteriza o instrumento ou a escrita como ordinário e reconhecível, não como especificamente masculino; a ambiguidade é mantida em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem narrativa é natural, o nome divino é transliterado e as ambiguidades relevantes do instrumento de escrita e do nome simbólico são preservadas em notas.
