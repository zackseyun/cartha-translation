  yaml_path: translation/ot/isaiah/008/016.yaml
  text: Bind up the testimony[b][a]; seal the instruction among my disciples.
translation:
  language: pt
  text: Amarre o testemunho; sele a instrução[a] entre os meus discípulos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a lei” ou “o ensino”. O hebraico torá pode designar instrução em sentido amplo, não apenas um código legal.
    reason: lexical_alternative
  - marker: b
    text: Ou “entre os meus ensinados”. A expressão hebraica se refere aos discípulos ou aos que recebem instrução, identificados como pertencentes ao falante.
    reason: lexical_alternative
lexical_decisions:
- source_word: צ֖וֹר
  choice: Amarre
  rationale: O imperativo de צור apresenta a imagem concreta de atar ou envolver algo para guardá-lo em segurança. “Amarre” conserva essa imagem e a força da ordem em português natural.
- source_word: תְּעוּדָה
  choice: o testemunho
  rationale: O termo designa testemunho ou atestação formal e, no contexto, provavelmente se refere ao testemunho profético. “Testemunho” é claro, digno e adequado ao uso profético.
- source_word: חֲת֥וֹם
  choice: sele
  rationale: O imperativo de חתם descreve o ato de selar um documento, tanto para fechá-lo quanto para preservá-lo ou autenticá-lo. “Sele” mantém de forma concisa a imagem documental.
- source_word: תּוֹרָ֖ה
  choice: a instrução
  rationale: תורה pode significar instrução ou ensino em sentido amplo, e aqui não exige a ideia mais restrita de um código legal. “Instrução” preserva a amplitude do termo no contexto profético.
- source_word: בְּ/לִמֻּדָֽ/י
  choice: entre os meus discípulos
  rationale: A expressão deriva de למד e se refere aos que são ensinados pelo falante. “Meus discípulos” é a formulação portuguesa mais natural para aprendizes ou seguidores instruídos; “entre” expressa adequadamente o valor contextual da preposição ב.
theological_decisions:
- issue: Sentido de תּוֹרָה no contexto profético
  choice: a instrução
  alternative: a lei; o ensino
  rationale: A tradução evita restringir o termo à lei codificada quando o hebraico também permite a instrução profética. Assim, preserva-se a provável referência ao ensino confiado aos seguidores de Isaías sem excluir a ressonância mais ampla de torá.
translation_notes:
  register: Português moderno, claro e digno, com imperativos diretos e a imagem documental preservada. A colocação dos marcadores junto aos termos correspondentes esclarece que [a] comenta “instrução” e [b] comenta “discípulos”.
