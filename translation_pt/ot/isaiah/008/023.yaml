base_translation:
  language: en
  yaml_path: translation/ot/isaiah/008/023.yaml
  text: For there will be no gloom for her who was in anguish[a]. In the former time he brought contempt on the land of Zebulun and the land of Naphtali, but in the latter time he will make glorious the way of the sea, beyond the Jordan[c][b], Galilee of the nations.
translation:
  language: pt
  text: Pois não haverá escuridão para a terra que estava angustiada.[a] No passado, ele humilhou a terra de Zebulom e a terra de Naftali; mas, no futuro, honrará o caminho do mar, além do Jordão, a Galileia das nações.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico do início do versículo é difícil; “escuridão” também pode ser entendido como “trevas” ou “penumbra”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Galileia dos gentios”. O hebraico diz literalmente “Galileia das nações”.'
    reason: lexical_alternative
  - marker: c
    text: Mateus 4:15–16 cita esta região ao relatar o início do ministério público de Jesus.
    reason: cross_reference
lexical_decisions:
- source_word: מוּעָף
  choice: escuridão
  rationale: O termo é raro e difícil. “Escuridão” expressa de modo claro a ideia de obscuridade opressiva no contexto e mantém sua ligação com as trevas mencionadas nos versículos próximos.
- source_word: מוּצָק
  choice: angustiada
  rationale: O termo indica pressão ou aflição. A forma feminina preserva a personificação da terra/região sugerida pelo sufixo hebraico.
- source_word: הֵקַל
  choice: humilhou
  rationale: O hifil de קלל contrasta com הִכְבִּיד. “Humilhou” comunica que a região foi rebaixada e desonrada, sem recorrer ao pouco natural “tornou leve”.
- source_word: הִכְבִּיד
  choice: honrará
  rationale: Literalmente, “tornar pesado”. Em oposição à humilhação anterior, assume o sentido idiomático de conferir peso, importância ou honra. O futuro acompanha o movimento contextual rumo à esperança, embora a forma hebraica permita discussão temporal.
- source_word: דֶּרֶךְ הַיָּם
  choice: o caminho do mar
  rationale: Mantém a expressão geográfica hebraica sem especificar de modo indevido uma estrada costeira concreta.
- source_word: עֵבֶר הַיַּרְדֵּן
  choice: além do Jordão
  rationale: Expressão geográfica tradicional e compacta que, como o hebraico, deixa implícito o ponto de referência direcional.
- source_word: גְּלִיל הַגּוֹיִם
  choice: a Galileia das nações
  rationale: “Nações” é o sentido amplo e direto de גּוֹיִם no contexto de Isaías; a alternativa “gentios” é registrada em nota.
- source_word: כִּי לֹא
  choice: Pois não haverá
  rationale: Apresenta a reversão em relação às trevas anteriores e exprime naturalmente, em português, a orientação esperançosa do contexto.
- source_word: לַאֲשֶׁר מוּצָק לָהּ
  choice: para a terra que estava angustiada
  rationale: A explicitação de “terra” torna claro o referente feminino em português e se apoia nas terras e regiões nomeadas em seguida.
theological_decisions:
- issue: Se a cláusula final descreve exaltação futura ou continuação do juízo
  choice: 'Exaltação futura: “honrará”'
  alternative: 'Juízo continuado ou ação passada: “tornou pesada/oprimida”'
  rationale: O contraste lexical entre humilhar e dar peso, aliado ao movimento contextual das trevas para a esperança, favorece a restauração da honra. A tradução não explicita a identificação messiânica, deixando-a para a referência cruzada.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. A estrutura preserva os topônimos e o contraste hebraico entre humilhação e honra, evitando formulações excessivamente literais e pouco naturais.
