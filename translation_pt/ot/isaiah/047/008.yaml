  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַתָּ֞ה שִׁמְעִי זֹ֤את עֲדִינָה֙ הַ/יּוֹשֶׁ֣בֶת לָ/בֶ֔טַח הָ/אֹֽמְרָה֙ בִּ/לְבָ֔בָ/הּ אֲנִ֖י וְ/אַפְסִ֣/י ע֑וֹד לֹ֤א אֵשֵׁב֙ אַלְמָנָ֔ה וְ/לֹ֥א אֵדַ֖ע שְׁכֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/008.yaml
  text: Then[a], hear this, you lover of luxury, who sit securely, who say in your heart, ‘I am, and there is no one besides me. I will not sit as a widow[c][b], nor will I know the loss of children.’
translation:
  language: pt
  text: 'Agora, ouça isto, você que vive no luxo[a], que está sentada em segurança e diz em seu coração: “Eu sou, e não há ninguém além de mim.”[b] Não ficarei sentada como viúva, nem conhecerei a perda de filhos.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “ó delicada”, “ó mimada” ou “ó voluptuosa”. O hebraico descreve alguém entregue ao luxo e à autossatisfação.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Eu sou, e não existe mais nada”. A expressão é uma afirmação arrogante de condição incomparável.'
    reason: alternative_reading
  - marker: c
    text: 'Hebraico: “conhecer o luto pela perda de filhos”, isto é, experimentar a perda de filhos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: O advérbio עַתָּה é explicitamente temporal e, com וְ, introduz a transição enfática para a interpelação direta. Em português, “Agora” comunica isso naturalmente sem exigir a reprodução mecânica da conjunção.
- source_word: עֲדִינָה
  choice: você que vive no luxo
  rationale: O adjetivo feminino sugere delicadeza, mimo e vida luxuosa. A formulação explicita em português atual a autocomplacência luxuosa de Babilônia sem recorrer a “delicada”, que poderia soar elogioso.
- source_word: הַיּוֹשֶׁבֶת לָבֶטַח
  choice: que está sentada em segurança
  rationale: Conserva tanto a imagem de estar sentada quanto a ideia de segurança confiante e estabelecida.
- source_word: אֲנִי וְאַפְסִי עוֹד
  choice: Eu sou, e não há ninguém além de mim
  rationale: Expressa a pretensão de exclusividade e supremacia da Babilônia personificada, mantendo o possível eco da linguagem de exclusividade divina.
- source_word: לֹא אֵשֵׁב אַלְמָנָה
  choice: Não ficarei sentada como viúva
  rationale: Preserva o verbo “sentar-se” e sua correspondência com a descrição anterior, apresentando a viuvez como estado que a cidade julga nunca experimentar.
- source_word: שְׁכוֹל
  choice: a perda de filhos
  rationale: O termo indica privação ou luto pela morte de filhos, não simples infertilidade; esta formulação é concreta e clara.
- source_word: אֵדַע
  choice: conhecerei
  rationale: Mantém o verbo hebraico “conhecer”, empregado aqui no sentido experiencial, sem ocultar a expressão figurada do original.
theological_decisions:
- issue: A autodeclaração arrogante de Babilônia em אֲנִי וְאַפְסִי עוֹד
  choice: Eu sou, e não há ninguém além de mim
  alternative: Eu sou, e não existe mais nada
  rationale: A opção principal preserva a dimensão pessoal da fala da cidade personificada e o eco tenso de declarações de supremacia exclusiva aplicadas a Deus em outros contextos, sem explicar ou neutralizar esse eco no texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas femininas coerentes com Babilônia personificada. A fala direta conserva a altivez da personagem, e a repetição da imagem de estar sentada aproxima o texto da estrutura hebraica.
