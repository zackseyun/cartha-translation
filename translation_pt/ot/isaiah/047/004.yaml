  text: Our Redeemer—Yahweh of Armies is his name—is the Holy One of Israel[a][b].
translation:
  language: pt
  text: Nosso Redentor — Yahweh dos Exércitos é o seu nome —, o Santo de Israel.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, segundo a forma tradicional: “o SENHOR dos Exércitos”.'
    reason: lexical_alternative
  - marker: b
    text: “Redentor” também pode ser traduzido por “parente-redentor”, ressaltando a possível nuance de parentesco e jurídica do termo hebraico.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֲלֵנוּ
  choice: Nosso Redentor
  rationale: O particípio substantivado de גאל significa “aquele que nos redime”. “Redentor” preserva melhor o peso jurídico, pactual e teológico do termo do que o mais genérico “libertador”; a possível nuance de parentesco é indicada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Expressa de modo concreto e compreensível o sentido de צבאות no título divino, preservando também sua forma tradicionalmente reconhecível em português.
- source_word: שְׁמוֹ
  choice: é o seu nome
  rationale: A cópula explícita produz uma oração nominal natural em português e mantém a estrutura de identificação do hebraico.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: o Santo de Israel
  rationale: Preserva o título isaiano recorrente em formulação natural e consagrada em português.
theological_decisions:
- issue: Tradução do título יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  alternative: o SENHOR dos Exércitos / o SENHOR dos Exércitos celestiais
  rationale: O texto traz diretamente o nome divino יְהוָה; transliterá-lo preserva o nome pactual, enquanto “dos Exércitos” mantém o sentido concreto de צְבָאוֹת sem definir no corpo do texto quais exércitos estão em vista.
- issue: Valor de גֹּאֵל como título divino
  choice: Redentor
  alternative: Resgatador da família / Parente-redentor
  rationale: “Redentor” conserva a dimensão de resgate e restauração sem tornar explícita uma nuance de parentesco que o contexto imediato não especifica; a alternativa é registrada em nota.
- issue: Uso de maiúscula em “Redentor”
  choice: Redentor
  alternative: redentor
  rationale: A palavra funciona como designação titular de Deus, em paralelo com “Yahweh dos Exércitos” e “o Santo de Israel”.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Os travessões preservam a inserção enfática do nome e título divinos; os marcadores de nota aparecem no texto principal.
