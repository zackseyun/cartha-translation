source:
  edition: WLC
  text: וַ/תִּבְטְחִ֣י בְ/רָעָתֵ֗/ךְ אָמַרְתְּ֙ אֵ֣ין רֹאָ֔/נִי חָכְמָתֵ֥/ךְ וְ/דַעְתֵּ֖/ךְ הִ֣יא שׁוֹבְבָ֑תֶ/ךְ וַ/תֹּאמְרִ֣י בְ/לִבֵּ֔/ךְ אֲנִ֖י וְ/אַפְסִ֥/י עֽוֹד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/010.yaml
  text: You trusted in your wickedness; you said[a], ‘No one sees me.’ Your wisdom and your knowledge led you astray, and you said in your heart, ‘I am, and there is no one besides me.’
translation:
  language: pt
  text: 'Você confiou em sua maldade e disse: “Ninguém me vê”. Sua sabedoria e seu conhecimento a desviaram, e você disse no coração: “Eu sou, e não há ninguém além de mim”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu sou, e não há nada além de mim”. A expressão hebraica também pode ser entendida de modo mais abstrato, embora aqui provavelmente expresse a pretensão da Babilônia de não ter rival.'
    reason: Leitura alternativa da expressão hebraica אֲנִי וְאַפְסִי עוֹד.
lexical_decisions:
- source_word: וַתִּבְטְחִי
  choice: Você confiou
  rationale: O verbo בטח expressa confiança ou dependência; “confiou” mantém de modo direto a força da acusação.
- source_word: בְרָעָתֵךְ
  choice: em sua maldade
  rationale: Embora רָעָה também possa indicar calamidade, o contexto trata da conduta moral arrogante da Babilônia; “maldade” comunica esse sentido.
- source_word: אֵין רֹאָנִי
  choice: Ninguém me vê
  rationale: Tradução natural da negação existencial com o particípio e o sufixo pronominal, expressando a falsa sensação de agir em segredo.
- source_word: חָכְמָתֵךְ וְדַעְתֵּךְ
  choice: Sua sabedoria e seu conhecimento
  rationale: Mantém distintos os dois termos do paralelismo hebraico e conserva sua formulação retórica.
- source_word: הִיא שׁוֹבְבָתֶךְ
  choice: a desviaram
  rationale: O verbo comunica a ideia de fazer alguém se desviar. A concordância plural em português retoma naturalmente “sabedoria e conhecimento”, enquanto o pronome feminino representa a cidade personificada.
- source_word: בְלִבֵּךְ
  choice: no coração
  rationale: Preserva a metáfora hebraica para o pensamento íntimo, ainda clara e corrente em português.
- source_word: אֲנִי וְאַפְסִי עוֹד
  choice: Eu sou, e não há ninguém além de mim
  rationale: Conserva a forma enfática e absoluta da vanglória da Babilônia. “Ninguém” se ajusta à cidade personificada, enquanto a nota registra a leitura mais abstrata permitida pelo hebraico.
theological_decisions:
- issue: Como traduzir אֲנִי וְאַפְסִי עוֹד preservando a semelhança retórica com declarações divinas exclusivas em Isaías sem identificar a Babilônia com Deus
  choice: Eu sou, e não há ninguém além de mim
  alternative: Eu sou, e não há nada além de mim
  rationale: A formulação mantém a autoexaltação blasfema e a ironia teológica do texto. A leitura pessoal combina melhor com a Babilônia personificada, sem eliminar a possibilidade mais abstrata, registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A segunda pessoa feminina do hebraico é representada por “você” e pelo pronome “a”, em referência à Babilônia personificada. A repetição de “você disse” e a metáfora “no coração” preservam a estrutura e a retórica do original.
