source:
  edition: WLC
  text: תִּגָּל֙ עֶרְוָתֵ֔/ךְ גַּ֥ם תֵּרָאֶ֖ה חֶרְפָּתֵ֑/ךְ נָקָ֣ם אֶקָּ֔ח וְ/לֹ֥א אֶפְגַּ֖ע אָדָֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/003.yaml
  text: Your nakedness will be uncovered[a]; indeed, your disgrace will be seen. I will take vengeance[b], and I will spare no man.
translation:
  language: pt
  text: Sua nudez será exposta; também a sua desonra será vista. Tomarei vingança e não pouparei ninguém.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A última oração é difícil no hebraico. Também pode ser traduzida como “não encontrarei ninguém” ou “não deixarei ninguém intervir”. O termo traduzido por “ninguém” é literalmente “ser humano” (אָדָם).
    reason: alternative_reading
lexical_decisions:
- source_word: תִּגָּל
  choice: será descoberta
  rationale: O nifal imperfeito de גלה expressa exposição passiva. “Será descoberta” conserva a imagem concreta de algo que deixa de estar coberto.
- source_word: עֶרְוָתֵךְ
  choice: sua nudez
  rationale: עֶרְוָה denota nudez, com fortes conotações de exposição vergonhosa; a tradução mantém a metáfora concreta.
- source_word: גַּם
  choice: também
  rationale: Mantém o valor aditivo e enfático do termo sem tornar explícita uma relação além da indicada pelo hebraico.
- source_word: תֵּרָאֶה
  choice: será vista
  rationale: O nifal imperfeito de ראה indica que a desonra se tornará publicamente visível.
- source_word: חֶרְפָּתֵךְ
  choice: sua desonra
  rationale: חֶרְפָּה abrange vergonha, afronta e perda pública de honra. “Desonra” comunica bem a dimensão social no português atual.
- source_word: נָקָם אֶקָּח
  choice: Tomarei vingança
  rationale: Reproduz a construção idiomática hebraica e preserva o peso judicial do anúncio de julgamento.
- source_word: וְלֹא אֶפְגַּע אָדָם
  choice: e não pouparei ninguém
  rationale: No contexto, entende-se a expressão difícil como declaração de juízo sem clemência. “Ninguém” comunica naturalmente a força humana genérica de אָדָם, enquanto a nota preserva outras análises possíveis.
theological_decisions:
- issue: Sentido da cláusula וְלֹא אֶפְגַּע אָדָם
  choice: não pouparei ninguém
  alternative: não me encontrarei com ninguém; não deixarei ninguém intervir
  rationale: A sintaxe é comprimida e o verbo פגע possui ampla variedade de sentidos. A leitura de juízo sem clemência se ajusta ao contexto imediato, mas não elimina a ambiguidade genuína, registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação conserva o paralelismo e a imagem concreta da exposição, sem suavizar a severidade do oráculo.
