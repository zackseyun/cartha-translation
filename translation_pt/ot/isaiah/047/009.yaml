source:
  edition: WLC
  text: וְ/תָבֹאנָה֩ לָּ֨/ךְ שְׁתֵּי אֵ֥לֶּה רֶ֛גַע בְּ/י֥וֹם אֶחָ֖ד שְׁכ֣וֹל וְ/אַלְמֹ֑ן כְּ/תֻמָּ/ם֙ בָּ֣אוּ עָלַ֔יִ/ךְ בְּ/רֹ֣ב כְּשָׁפַ֔יִ/ךְ בְּ/עָצְמַ֥ת חֲבָרַ֖יִ/ךְ מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/009.yaml
  text: 'But these two things will come to you in a moment[a], in one day: bereavement and widowhood. In full measure they will come upon you[b], in spite of your many sorceries and the great power of your spells.'
translation:
  language: pt
  text: 'Mas estas duas coisas virão sobre você num instante, num só dia: perda dos filhos e viuvez. Elas virão sobre você em sua plenitude[a], apesar das suas muitas feitiçarias e do grande poder dos seus encantamentos[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por completo” ou “em toda a plenitude”.'
    reason: lexical_alternative
  - marker: b
    text: As expressões finais também podem ser entendidas como “por causa das suas muitas feitiçarias e do grande poder dos seus encantamentos” ou “com as suas muitas feitiçarias e os seus encantamentos muito poderosos”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְתָבֹאנָה
  choice: virão sobre você
  rationale: O imperfeito qal, com sujeito feminino plural, anuncia as duas calamidades futuras; a expressão portuguesa é natural e mantém a imagem de algo que sobrevém à destinatária.
- source_word: שְׁתֵּי אֵלֶּה
  choice: estas duas coisas
  rationale: O numeral feminino com o demonstrativo aponta para duas calamidades, explicitadas em seguida; “coisas” torna a frase idiomática sem antecipar a explicação.
- source_word: רֶגַע
  choice: num instante
  rationale: Expressa um intervalo extremamente breve e conserva a ideia de rapidez repentina.
- source_word: בְּיוֹם אֶחָד
  choice: num só dia
  rationale: Mantém o valor temporal e enfatiza que os dois golpes se concentrarão em um único dia.
- source_word: שְׁכוֹל
  choice: perda dos filhos
  rationale: O substantivo designa a condição de quem foi privado de filhos pela morte; a formulação explícita comunica melhor essa imagem familiar em português moderno do que o termo mais amplo “luto”.
- source_word: וְאַלְמֹן
  choice: viuvez
  rationale: Equivalente nominal direto, adequado à personificação feminina da Babilônia.
- source_word: כְּתֻמָּם
  choice: em toda a sua medida
  rationale: Transmite a ideia de totalidade ou plenitude com que as calamidades chegam, preservando a possível nuance lexical indicada em nota.
- source_word: בָּאוּ עָלַיִךְ
  choice: elas virão sobre você
  rationale: Embora o verbo esteja no perfeito, o contexto profético apresenta o acontecimento futuro como certo; o futuro é claro e natural em português.
- source_word: בְּרֹב כְּשָׁפַיִךְ
  choice: apesar das suas muitas feitiçarias
  rationale: 'A leitura concessiva se ajusta à zombaria contextual: os recursos mágicos da Babilônia não impedirão o juízo.'
- source_word: בְּעָצְמַת חֲבָרַיִךְ מְאֹד
  choice: do enorme poder dos seus encantamentos
  rationale: Conserva a construção nominal de força ou poder e entende חֲבָרִים como fórmulas mágicas ou encantamentos.
theological_decisions:
- issue: Valor da preposição ב nas duas expressões finais
  choice: 'concessivo: “apesar das suas muitas feitiçarias e do enorme poder dos seus encantamentos”'
  alternative: 'causal: “por causa das suas muitas feitiçarias...” ou associativo/instrumental: “com as suas muitas feitiçarias...”'
  rationale: O contexto ressalta a inutilidade dos meios mágicos em que Babilônia confiava. Como a preposição admite outras relações, a nota preserva as leituras possíveis sem decidir além da evidência.
- issue: Aspecto de בָּאוּ no discurso profético
  choice: 'futuro: “elas virão sobre você”'
  alternative: 'perfeito: “elas vieram sobre você”'
  rationale: O perfeito profético apresenta como consumado um juízo futuro e certo; em português, o futuro comunica com clareza sua localização temporal e mantém a certeza do anúncio.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Perda dos filhos” explicita o sentido contextual de שְׁכוֹל; “encantamentos” evita confusão com relações pessoais e mantém o campo semântico de práticas mágicas. Todos os marcadores de nota aparecem no texto.
