  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: רְדִ֣י וּ/שְׁבִ֣י עַל עָפָ֗ר בְּתוּלַת֙ בַּת בָּבֶ֔ל שְׁבִי לָ/אָ֥רֶץ אֵין כִּסֵּ֖א בַּת כַּשְׂדִּ֑ים כִּ֣י לֹ֤א תוֹסִ֨יפִי֙ יִקְרְאוּ לָ֔/ךְ רַכָּ֖ה וַ/עֲנֻגָּֽה׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/001.yaml
  text: Come down and sit in the dust[a], virgin daughter Babylon; sit on the ground without a throne, daughter of the Chaldeans[d][c][b]. For they will no longer call you tender and delicate.
translation:
  language: pt
  text: Desça e sente-se no pó, virgem filha da Babilônia; sente-se no chão, sem trono, filha dos caldeus.[a] Pois nunca mais te chamarão de terna e delicada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Virgem filha da Babilônia” e “filha dos caldeus” são formas poéticas de personificar a cidade e o império como uma jovem de posição régia.
    reason: cultural_note
lexical_decisions:
- source_word: רְדִי
  choice: Desça
  rationale: Imperativo feminino singular de ירד. “Desça” expressa naturalmente a perda da posição elevada e mantém a direção do hebraico sem precisar decidir entre “venha” e “vá”.
- source_word: וּשְׁבִי / שְׁבִי
  choice: sente-se / sente-se
  rationale: No paralelismo com a descida ao pó e ao chão, ישב indica assumir uma posição sentada, não habitar. A repetição preserva a retórica hebraica.
- source_word: עַל עָפָר
  choice: no pó
  rationale: Equivalente idiomático em português para a imagem de humilhação, embora a preposição hebraica possa ser vertida mais literalmente por “sobre”.
- source_word: בְּתוּלַת בַּת בָּבֶל
  choice: virgem filha da Babilônia
  rationale: Preserva a cadeia poética que personifica Babilônia como uma jovem mulher até então inviolada, sem achatar a figura para simples referência à cidade.
- source_word: לָאָרֶץ
  choice: no chão
  rationale: Com o imperativo “sente-se”, indica de modo natural o lugar rebaixado em que ela deve se assentar.
- source_word: אֵין כִּסֵּא
  choice: sem trono
  rationale: Expressa de forma concisa a cláusula nominal e a privação da condição régia; a construção também pode ser entendida como “não há trono”.
- source_word: בַּת כַּשְׂדִּים
  choice: filha dos caldeus
  rationale: Segue o gentílico plural do hebraico e conserva o segundo título personificador de Babilônia.
- source_word: כִּי לֹא תוֹסִיפִי
  choice: Pois nunca mais
  rationale: A construção com יסף e o verbo seguinte comunica a cessação definitiva de uma designação anterior.
- source_word: יִקְרְאוּ לָךְ
  choice: chamarão você
  rationale: O plural sem sujeito expresso tem sentido indefinido. A forma ativa preserva a estrutura do hebraico e é clara no português moderno.
- source_word: רַכָּה
  choice: meiga
  rationale: Comunica suavidade e ternura aplicadas à personagem feminina; evita a possível leitura de fragilidade física de “delicada”.
- source_word: וַעֲנֻגָּה
  choice: mimada
  rationale: Expressa a delicadeza luxuosa e favorecida sugerida pelo adjetivo, distinguindo-o de רַכָּה; “requintada” ou “delicada” também são possíveis.
theological_decisions:
- issue: Personificação feminina e régia de Babilônia
  choice: Manter “virgem filha da Babilônia” e “filha dos caldeus”.
  alternative: Simplificar para “Babilônia” ou reformular como “Babilônia, a filha virgem”.
  rationale: O oráculo apresenta a potência imperial como uma jovem aristocrática destronada e humilhada. Conservar os títulos mantém a força literária e teológica do juízo profético.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com imperativos femininos coerentes com a personificação. “Sem trono” mantém a concisão poética; “meiga e mimada” distingue os dois adjetivos finais e torna perceptível a passagem do refinamento privilegiado à humilhação.
