source:
  edition: WLC
  text: עִמְדִי נָ֤א בַ/חֲבָרַ֨יִ/ךְ֙ וּ/בְ/רֹ֣ב כְּשָׁפַ֔יִ/ךְ בַּ/אֲשֶׁ֥ר יָגַ֖עַתְּ מִ/נְּעוּרָ֑יִ/ךְ אוּלַ֛י תּוּכְלִ֥י הוֹעִ֖יל אוּלַ֥י תַּעֲרֽוֹצִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/012.yaml
  text: Stand now with your enchantments and with your many sorceries[a], in which you have labored from your youth; perhaps you may be able to profit[b], perhaps you may inspire terror.
translation:
  language: pt
  text: Persiste, então, nos teus encantamentos e nas tuas muitas feitiçarias[a], com os quais te fatigaste desde a juventude; talvez consigas tirar algum proveito[b], talvez inspires terror.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nos teus feitiços e nas tuas muitas práticas de magia”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “talvez consigas prevalecer”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִמְדִי נָא
  choice: Persiste, então
  rationale: O imperativo feminino singular de עמד, acompanhado de נָא, desafia Babilônia a continuar confiando em suas práticas. “Persiste, então” comunica em português atual a força irônica da exortação sem explicitá-la em comentário dentro do texto.
- source_word: בַחֲבָרַיִךְ
  choice: nos teus encantamentos
  rationale: חֲבָרִים designa aqui fórmulas ou práticas mágicas de ligação. “Encantamentos” mantém o campo semântico ocultista e forma um paralelo natural com “feitiçarias”.
- source_word: וּבְרֹב כְּשָׁפַיִךְ
  choice: e nas tuas muitas feitiçarias
  rationale: רֹב expressa grande quantidade, e כְּשָׁפִים se refere a práticas de magia. A formulação conserva tanto a abundância quanto o plural do hebraico.
- source_word: בַּאֲשֶׁר יָגַעַתְּ מִנְּעוּרַיִךְ
  choice: com os quais te fatigaste desde a juventude
  rationale: יגע sugere trabalho árduo que produz cansaço; “te fatigaste” preserva essa nuance. A expressão temporal indica que tais práticas eram antigas e persistentes.
- source_word: אוּלַי תּוּכְלִי הוֹעִיל
  choice: talvez consigas tirar algum proveito
  rationale: A combinação de יכל com הועיל exprime a possibilidade de obter benefício ou vantagem. “Tirar algum proveito” é natural e mantém o tom de dúvida irônica.
- source_word: אוּלַי תַּעֲרוֹצִי
  choice: talvez inspires terror
  rationale: ערץ pode expressar causar pavor ou intimidar. “Inspires terror” preserva esse sentido mais concreto, sem excluir a ideia contextual de dominar ou repelir um adversário pelo medo.
theological_decisions:
- issue: Tom da fala dirigida a Babilônia
  choice: Manter a ordem e as duas cláusulas com “talvez” de modo que a ironia surja do contexto.
  alternative: Transformar a fala em conselho neutro ou acrescentar explicitamente que Deus está zombando de Babilônia.
  rationale: O contexto do oráculo é de juízo e ridiculariza a confiança de Babilônia na magia, mas o versículo formula isso como desafio. A tradução não acrescenta uma interpretação ao texto principal.
- issue: Sentido de אוּלַי תַּעֲרוֹצִי
  choice: talvez inspires terror
  alternative: talvez prevaleças
  rationale: A opção escolhida conserva o valor de causar pavor associado a ערץ. “Prevaleças” é possível no contexto, mas torna menos visível a imagem lexical do terror.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa coerentes com a personificação feminina de Babilônia. “Persiste, então” evita uma construção excessivamente literal e pouco natural, enquanto “te fatigaste” retém a ideia de esforço cansativo.
