source:
  edition: WLC
  text: קְחִ֥י רֵחַ֖יִם וְ/טַ֣חֲנִי קָ֑מַח גַּלִּ֨י צַמָּתֵ֧/ךְ חֶשְׂפִּי שֹׁ֛בֶל גַּלִּי שׁ֖וֹק עִבְרִ֥י נְהָרֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/002.yaml
  text: Take the millstones and grind flour[a]; uncover your veil, strip off your skirt, uncover the leg[c][b], cross over the rivers.
translation:
  language: pt
  text: Pegue as pedras do moinho e moa farinha; retire o seu véu[a], levante a saia[b], descubra a perna[c] e atravesse os rios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “solte os seus cabelos”. O termo hebraico pode indicar um véu ou algo relacionado ao cabelo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “exponha a cauda da sua veste” ou “descubra a orla da sua roupa”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “a coxa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְחִי רֵחַיִם
  choice: Pegue as pedras do moinho
  rationale: O imperativo feminino singular introduz uma ordem direta, e רֵחַיִם designa o moinho ou suas pedras. A formulação concreta preserva a imagem do trabalho braçal e humilhante.
- source_word: וְטַחֲנִי קָמַח
  choice: e moa farinha
  rationale: טחן significa moer, e קמח significa farinha. A expressão é direta e natural em português.
- source_word: גַּלִּי צַמָּתֵךְ
  choice: retire o seu véu
  rationale: צַמָּה pode indicar um véu ou algo relacionado ao cabelo. No contexto de retirada progressiva das vestes, 'véu' produz uma sequência coerente, enquanto a ambiguidade lexical é preservada em nota.
- source_word: חֶשְׂפִּי שֹׁבֶל
  choice: levante a saia
  rationale: חשׂף exprime expor ou deixar descoberto, e שֹׁבֶל pode designar a parte inferior, a cauda ou a orla de uma veste. Diante da ordem subsequente de descobrir a perna para atravessar rios, 'levante a saia' comunica naturalmente a ação sem ampliar a nudez além do texto.
- source_word: גַּלִּי שׁוֹק
  choice: descubra a perna
  rationale: שׁוֹק pode designar a perna, especialmente sua parte inferior, embora 'coxa' também seja possível. 'Perna' se ajusta ao contexto de atravessar águas.
- source_word: עִבְרִי נְהָרוֹת
  choice: e atravesse os rios
  rationale: עבר significa passar ou atravessar, e נְהָרוֹת significa rios. 'Atravesse os rios' é claro e idiomático.
theological_decisions:
- issue: Natureza das imagens de humilhação
  choice: Traduzir o versículo como uma sequência de ordens que retrata a perda da dignidade régia da Babilônia e sua submissão a trabalho e deslocamento humilhantes.
  alternative: Tornar a exposição corporal mais explicitamente sexual ou traduzir a cena apenas como preparação prática para vadear rios.
  rationale: O contexto comunica vergonha e rebaixamento, mas a tradução não deve sexualizar a imagem além do que o hebraico exige. Ao mesmo tempo, a ação de levantar a veste e descobrir a perna tem sentido prático na travessia das águas, sem eliminar seu efeito humilhante no contexto.
translation_notes:
  register: Português contemporâneo, digno e acessível, com imperativos femininos dirigidos à figura personificada da Babilônia. A coordenação mantém o ritmo incisivo da série hebraica de ordens. 'Saia' é usado no sentido amplo da parte inferior da veste, e a nota preserva as alternativas mais formais.
