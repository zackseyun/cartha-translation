  text: נִלְאֵ֖ית בְּ/רֹ֣ב עֲצָתָ֑יִ/ךְ יַעַמְדוּ נָ֨א וְ/יוֹשִׁיעֻ֜/ךְ הברו שָׁמַ֗יִם הַֽ/חֹזִים֙ בַּ/כּ֣וֹכָבִ֔ים מֽוֹדִיעִם֙ לֶ/חֳדָשִׁ֔ים מֵ/אֲשֶׁ֥ר יָבֹ֖אוּ עָלָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/013.yaml
  text: You are wearied by your many counsels[a]. Let them stand now and save you—those who divide the heavens, who gaze at the stars[b], who make known month by month what will come upon you.
translation:
  language: pt
  text: Você está exausta de tantos conselhos. Que eles se apresentem agora e a salvem — os que repartem os céus[a], os que observam as estrelas, os que anunciam, mês após mês[b], o que virá sobre você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que dividem os céus em setores”. A expressão hebraica é difícil e provavelmente se refere a astrólogos que repartiam o céu em áreas para interpretá-lo.
    reason: lexical_alternative
  - marker: b
    text: Ou “os que anunciam nas luas novas”. O hebraico pode se referir especificamente a previsões ligadas ao ciclo mensal ou à lua nova.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִלְאֵית
  choice: você está exausta
  rationale: O nifal perfeito na segunda pessoa feminina singular expressa o estado resultante de cansaço ou esgotamento; o feminino retoma Babilônia, a quem o discurso se dirige.
- source_word: בְּרֹב עֲצָתָיִךְ
  choice: de tantos conselhos
  rationale: עֵצָה pode indicar conselho, orientação ou plano. A formulação portuguesa comunica naturalmente tanto a grande quantidade quanto o motivo do esgotamento.
- source_word: יַעַמְדוּ נָא
  choice: que eles se apresentem agora
  rationale: O imperfeito de valor jussivo com נָא formula um desafio irônico. “Apresentem-se” transmite a ideia de comparecer ou tomar posição para agir.
- source_word: וְיוֹשִׁיעֻךְ
  choice: e a salvem
  rationale: O hifil de ישע significa salvar, livrar ou resgatar. “Salvem” conserva a força ampla do verbo e concorda com a destinatária feminina, Babilônia.
- source_word: הברו שָׁמַיִם
  choice: os que repartem os céus
  rationale: A expressão hebraica é difícil, mas provavelmente descreve astrólogos que dividiam o céu em setores para interpretação. A tradução preserva essa imagem concreta sem substituir o termo por uma explicação.
- source_word: הַחֹזִים בַּכּוֹכָבִים
  choice: os que observam as estrelas
  rationale: Embora חזה possa designar visão ou vidência, a combinação com “estrelas” aponta para observadores astrológicos. “Observam” é claro e evita explicitar mais do que o texto afirma.
- source_word: מוֹדִיעִם לֶחֳדָשִׁים
  choice: os que anunciam, mês após mês
  rationale: A expressão pode indicar anúncios mensais ou ligados às luas novas. A escolha principal expressa a periodicidade e deixa a leitura específica das luas novas em nota.
- source_word: מֵאֲשֶׁר יָבֹאוּ עָלָיִךְ
  choice: o que virá sobre você
  rationale: A oração indica o conteúdo das previsões — os acontecimentos futuros que atingiriam Babilônia — e conserva a imagem hebraica de algo que vem sobre alguém.
theological_decisions:
- issue: Identidade e função dos especialistas babilônicos
  choice: O versículo apresenta um desafio irônico aos astrólogos, incapazes de salvar Babilônia.
  alternative: Entender a referência de modo mais genérico como conselheiros ou sábios, sem destacar a prática astrológica.
  rationale: O contexto imediato trata dos encantamentos e feitiçarias de Babilônia, enquanto as referências aos céus, às estrelas e aos meses tornam a identificação astrológica a leitura contextual mais provável. A tradução mantém a ironia e não acrescenta práticas além das sugeridas pelo hebraico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O feminino em “exausta” e “a salvem” preserva a personificação de Babilônia. O travessão introduz os grupos convocados pelo desafio irônico, e as notas mantêm visíveis as duas dificuldades lexicais do hebraico.
