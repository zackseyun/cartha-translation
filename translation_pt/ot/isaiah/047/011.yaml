  yaml_path: translation/ot/isaiah/047/011.yaml
  text: But evil will come upon you[a]; you will not know how to charm it away. And disaster will fall upon you; you will not be able to atone for it. And ruin will come upon you suddenly[b], which you do not foresee.
translation:
  language: pt
  text: Mas o mal virá sobre você, e você não saberá como afastá-lo por meio de encantamentos.[a] A desgraça cairá sobre você, e você não poderá expiá-la.[b] De repente virá sobre você uma devastação que você não prevê.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “você não conhecerá seu alvorecer” ou “você não saberá como evitá-lo”. O hebraico desta expressão é difícil. A tradução no texto principal entende a frase à luz das feitiçarias e dos encantamentos da Babilônia mencionados no contexto.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “você não poderá afastá-la” ou “aplacá-la”. O hebraico diz literalmente “fazer expiação por ela”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה
  choice: mal
  rationale: “Mal” preserva a amplitude do hebraico, que pode indicar tanto o mal em sentido amplo quanto uma calamidade; o paralelismo deixa claro que aqui se trata de um juízo destrutivo.
- source_word: שַׁחְרָהּ
  choice: como afastá-lo por meio de encantamentos
  rationale: A forma hebraica é difícil e admite mais de uma análise. À luz das feitiçarias e fórmulas mágicas mencionadas no contexto imediato, esta tradução expressa a incapacidade da Babilônia de dissipar o mal por artes ocultas, sem ocultar as alternativas na nota.
- source_word: הֹוָה
  choice: desgraça
  rationale: O substantivo indica infortúnio ou desastre destrutivo. “Desgraça” é natural em português e mantém a progressão dos termos paralelos sem repeti-los.
- source_word: כַּפְּרָהּ
  choice: expiá-la
  rationale: Mantém visível o vínculo lexical de כפר com cobrir, purgar ou fazer expiação. No contexto, a ideia é que a calamidade não poderá ser removida, aplacada ou evitada; essas possibilidades contextuais são registradas em nota.
- source_word: פִּתְאֹם
  choice: de repente
  rationale: Equivalente português corrente que comunica a irrupção abrupta do juízo.
- source_word: שׁוֹאָה
  choice: devastação
  rationale: Expressa uma ruína ampla e destrutiva, distinguindo este termo dos substantivos paralelos anteriores.
- source_word: לֹא תֵדָעִי
  choice: que você não prevê
  rationale: O hebraico diz literalmente “que você não conhece/sabe”. Como o objeto implícito é a chegada súbita da devastação, “não prevê” comunica esse sentido de modo natural em português, sem acrescentar uma causa ou agente.
theological_decisions:
- issue: Tradução de כפר em um contexto de juízo
  choice: expiá-la
  alternative: afastá-la; aplacá-la; evitá-la
  rationale: A opção principal conserva a importante conexão lexical de כפר, sem afirmar que se trate aqui de um rito sacrificial. A nota esclarece o sentido contextual de incapacidade para remover ou evitar a calamidade.
- issue: Ambiguidade de שַׁחְרָהּ
  choice: afastá-lo por meio de encantamentos
  alternative: conhecer seu alvorecer; saber como evitá-lo
  rationale: O contexto das feitiçarias da Babilônia favorece uma referência à tentativa de desfazer o mal por encantamentos, mas a dificuldade filológica real é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “sobre você” acompanha o paralelismo enfático do hebraico. Os marcadores de nota foram posicionados junto às expressões que explicam.
