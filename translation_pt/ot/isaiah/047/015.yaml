  terminology: “Comerciantes”, “juventude”, “vagueia” e “salve você” são escolhas adequadas. “Para o seu lado” conserva prudentemente a indeterminação espacial de לְעֶבְרוֹ; a nota deve evitar apresentar “região” como equivalente excessivamente definido.
