base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/015.yaml
  text: So have those with whom you labored become to you—your merchants from your youth[a]. Each one wanders to his own quarter; there is no one to save you.
translation:
  language: pt
  text: Assim se tornaram para você aqueles com quem você se afadigou — seus comerciantes desde a sua juventude. Cada um vagueia para o seu lado[a]; não há quem salve você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cada um em sua própria direção” ou “cada um para o seu próprio lado”. A expressão hebraica é concisa e pode destacar a dispersão, sem indicar um destino específico.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן הָיוּ לָךְ
  choice: Assim acabaram para você
  rationale: 'Expressa a conclusão e o estado resultante: os antigos associados de Babilônia acabaram por se mostrar inúteis para ela.'
- source_word: אֲשֶׁר יָגָעַתְּ
  choice: aqueles com quem você se fatigou
  rationale: יגע denota esforço cansativo; a formulação preserva a relação com aqueles aos quais Babilônia dedicou seu trabalho sem impor uma finalidade não explicitada.
- source_word: סֹחֲרַיִךְ מִנְּעוּרַיִךְ
  choice: os seus comerciantes desde a sua juventude
  rationale: סחר designa comerciantes ou negociantes, e a expressão temporal indica uma relação mantida desde a fase inicial figurada de Babilônia.
- source_word: אִישׁ לְעֶבְרוֹ תָּעוּ
  choice: Cada um vagueia para o seu lado
  rationale: איש tem sentido distributivo; תעה comunica vaguear ou andar perdido, enquanto לעברו é conciso e pode indicar lado ou direção. A tradução conserva essa imprecisão espacial.
- source_word: אֵין מוֹשִׁיעֵךְ
  choice: não há quem salve você
  rationale: Mantém a força direta de ישׁע e a ausência total de qualquer pessoa capaz de livrar Babilônia.
theological_decisions:
- issue: Sentido de מוֹשִׁיעֵךְ
  choice: salve você
  alternative: livre você; resgate você
  rationale: “Salvar” preserva a amplitude e o peso teológico do verbo, mas, no contexto imediato, refere-se ao livramento de Babilônia diante do juízo, sem acrescentar uma doutrina soteriológica específica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. O tratamento por “você” corresponde ao feminino singular dirigido figuradamente a Babilônia. “Vagueia” conserva a ideia de movimento desorientado, e a nota mantém a ambiguidade de לְעֶבְרוֹ.
