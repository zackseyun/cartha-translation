review_pass:
  verdict: revise
  source_fidelity: 'A tradução reproduz com precisão a sequência e o sentido do hebraico: indignação contra o povo, profanação da herança, entrega ao poder da destinatária e sua crueldade, inclusive contra os idosos. Contudo, «nas suas mãos» altera desnecessariamente a imagem hebraica no singular («na sua mão») e pode ser corrigido sem perda de naturalidade.'
  naturalness: O português é moderno, claro e de registro apropriado. «Você» é admissível para a personificação feminina de Babilônia e é legível internacionalmente. «Até sobre os idosos» é compreensível, mas «sobre os idosos» acompanha mais diretamente a construção hebraica e torna desnecessário o «até», que pode sugerir uma ênfase adicional não expressa de modo explícito.
  terminology: «Profanei», «herança», «compaixão» e «jugo» são escolhas adequadas e preservam a força lexical e teológica do texto. «Idosos» comunica bem o uso coletivo de זָקֵן.
  issues:
  - severity: low
    issue: «nas suas mãos» está no plural.
    rationale: O hebraico בְּיָדֵךְ traz «na sua mão», singular. Em português, «entreguei-os em sua mão» preserva tanto o singular quanto a imagem de poder/domínio.
  - severity: low
    issue: O acréscimo de «até» em «até sobre os idosos».
    rationale: Embora a crueldade contra os idosos seja retoricamente marcante, o hebraico diz diretamente «sobre o idoso/os idosos»; omitir «até» evita acrescentar uma nuance discursiva.
  revised_text: Fiquei indignado com o meu povo; profanei a minha herança e os entreguei em sua mão. Você não teve compaixão deles; sobre os idosos tornou muito pesado o seu jugo.
