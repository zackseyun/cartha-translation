revisions:
- from: Fiquei indignado com o meu povo; profanei a minha herança e os entreguei nas suas mãos. Você não teve compaixão deles; até sobre os idosos tornou muito pesado o seu jugo.
  to: Fiquei indignado com o meu povo; profanei a minha herança e os entreguei em sua mão. Você não teve compaixão deles; sobre os idosos tornou muito pesado o seu jugo.
  rationale: 'A revisão conserva todas as escolhas centrais do rascunho e corrige dois pormenores de fidelidade formal: o singular de «mão» e a remoção de «até», que não é necessário para traduzir a sintaxe hebraica. Não são necessárias notas, pois o texto traduzido permanece claro e não depende de alternativa textual ou ambiguidade relevante não representada.'
