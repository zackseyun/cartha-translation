  text: קָצַ֣פְתִּי עַל עַמִּ֗/י חִלַּ֨לְתִּי֙ נַחֲלָתִ֔/י וָ/אֶתְּנֵ֖/ם בְּ/יָדֵ֑/ךְ לֹא שַׂ֤מְתְּ לָ/הֶם֙ רַחֲמִ֔ים עַל זָקֵ֕ן הִכְבַּ֥דְתְּ עֻלֵּ֖/ךְ מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/006.yaml
  text: I was angry with my people[a]; I profaned my inheritance and gave them into your hand. You showed them no mercy[c][b]; on the aged you made your yoke very heavy.
translation:
  language: pt
  text: Fiquei indignado com o meu povo; profanei a minha herança e os entreguei em sua mão. Você não teve compaixão deles; sobre os idosos tornou muito pesado o seu jugo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָצַפְתִּי
  choice: Fiquei indignado
  rationale: קצף expressa ira ou indignação. “Fiquei indignado” comunica com dignidade a forte desaprovação divina sem ampliar o sentido do hebraico.
- source_word: עַמִּי
  choice: o meu povo
  rationale: Preserva diretamente a linguagem coletiva e pactual do texto.
- source_word: חִלַּלְתִּי
  choice: profanei
  rationale: O piel de חלל tem o sentido forte de profanar, dessacralizar ou tratar como comum. “Profanei” conserva a força teológica da declaração ativa em primeira pessoa.
- source_word: נַחֲלָתִי
  choice: a minha herança
  rationale: נחלה designa herança, patrimônio ou possessão; “minha herança” mantém a linguagem de pertencimento pactual.
- source_word: וָאֶתְּנֵם בְּיָדֵךְ
  choice: e os entreguei nas suas mãos
  rationale: A expressão significa entregar alguém ao poder de outro. O plural idiomático “nas suas mãos” é natural em português e preserva a imagem hebraica.
- source_word: לֹא שַׂמְתְּ לָהֶם רַחֲמִים
  choice: Você não teve compaixão deles
  rationale: A formulação literal, “não puseste compaixões para eles”, é idiomática no hebraico. “Não teve compaixão deles” transmite claramente a ausência de misericórdia.
- source_word: זָקֵן
  choice: os idosos
  rationale: O singular hebraico funciona genericamente para uma classe. “Os idosos” expressa isso de modo natural e atual.
- source_word: הִכְבַּדְתְּ עֻלֵּךְ מְאֹד
  choice: tornou muito pesado o seu jugo
  rationale: Mantém tanto o verbo “tornar pesado” quanto a metáfora do “jugo”, além do intensificador מְאֹד.
theological_decisions:
- issue: Ação divina em “profanei a minha herança”
  choice: 'Manter a afirmação ativa em primeira pessoa: “profanei a minha herança”.'
  alternative: 'Suavizar como “abandonei a minha herança” ou interpretar apenas permissivamente: “deixei que profanassem a minha herança”.'
  rationale: 'O hebraico apresenta verbo ativo em primeira pessoa. A tradução não deve aliviar a tensão teológica: Deus entrega judicialmente seu povo, enquanto Babilônia continua responsável por sua crueldade sem compaixão.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento “você” explicita o feminino singular dirigido à Babilônia no contexto, sem tornar a frase arcaica. Não foram incluídas notas porque as alternativas lexicais relevantes podem ser representadas adequadamente no texto sem perda substancial.
