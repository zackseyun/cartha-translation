base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/007.yaml
  text: You said[a], ‘I will be mistress forever,’ so that you did not take these things to heart[c][b]; you did not remember her end.
translation:
  language: pt
  text: 'Você disse[a]: “Serei senhora para sempre.” De modo que não levou essas coisas a sério[b] nem se lembrou do fim dela[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E você disse”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “não pôs essas coisas sobre o seu coração”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “do seu fim”. O hebraico traz um sufixo feminino singular, provavelmente em referência a Babilônia personificada como mulher.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּאמְרִי
  choice: Você disse
  rationale: O waw consecutivo dá continuidade ao discurso, mas não exige que se inicie a frase com “E” em português.
- source_word: לְעוֹלָם אֶהְיֶה גְבָרֶת
  choice: Serei senhora para sempre
  rationale: “Senhora” comunica posição feminina de autoridade ou domínio sem especificar indevidamente o título real “rainha”; “para sempre” expressa a pretensão de permanência.
- source_word: עַד לֹא
  choice: Por isso, não
  rationale: No contexto, a construção introduz o resultado da pretensão arrogante. Esta formulação é natural em português e evita o literalismo obscuro “até que não”.
- source_word: שַׂמְתְּ אֵלֶּה עַל לִבֵּךְ
  choice: levou essas coisas a sério
  rationale: A expressão hebraica é literalmente “pôr estas coisas sobre o coração” e significa considerá-las seriamente; a tradução preserva seu sentido idiomático.
- source_word: לֹא זָכַרְתְּ אַחֲרִיתָהּ
  choice: nem se lembrou do fim dela
  rationale: “Lembrar” conserva o valor cognitivo de זכר, e “fim dela” mantém tanto o sufixo feminino singular como a personificação de Babilônia.
theological_decisions:
- issue: Personificação feminina de Babilônia
  choice: fim dela
  alternative: seu próprio fim / o fim disso
  rationale: O oráculo se dirige a Babilônia como mulher, e o sufixo hebraico é feminino singular. “Dela” preserva essa personificação sem resolver além do texto a possível referência do pronome.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Senhora” conserva a ideia de posição dominante sem a ambiguidade moderna de “amante” associada a “mistress” em inglês. A coordenação com “nem” produz uma frase natural sem apagar a relação de consequência.
