  text: שְׁבִ֥י דוּמָ֛ם וּ/בֹ֥אִי בַ/חֹ֖שֶׁךְ בַּת כַּשְׂדִּ֑ים כִּ֣י לֹ֤א תוֹסִ֨יפִי֙ יִקְרְאוּ לָ֔/ךְ גְּבֶ֖רֶת מַמְלָכֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/005.yaml
  text: Sit in silence[a], and go into darkness, daughter of the Chaldeans; for no longer will they call you the mistress of kingdoms.
translation:
  language: pt
  text: Senta-te em silêncio e entra nas trevas, filha dos caldeus, pois já não te chamarão senhora de reinos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “soberana de reinos”.'
    reason: Alternativa lexical para גְּבֶרֶת, que pode indicar uma senhora em posição de autoridade ou domínio.
lexical_decisions:
- source_word: שְׁבִי
  choice: Senta-te
  rationale: Imperativo qal feminino singular de ישׁב, dirigido à Babilônia personificada. “Senta-te” preserva a ordem direta e a cena de humilhação.
- source_word: דוּמָם
  choice: em silêncio
  rationale: O advérbio expressa silêncio ou quietude. “Em silêncio” é natural em português e mantém a ideia de silêncio imposto.
- source_word: וּבֹאִי בַחֹשֶׁךְ
  choice: e entra nas trevas
  rationale: O imperativo feminino de בוא, seguido da preposição, indica movimento para dentro de uma condição de escuridão. “Entra nas trevas” conserva tanto o movimento quanto a imagem profética.
- source_word: בַּת כַּשְׂדִּים
  choice: filha dos caldeus
  rationale: Mantém a personificação profética feminina da cidade ou nação sem acrescentar “virgem” ou “Babilônia”, ausentes neste versículo.
- source_word: לֹא תוֹסִיפִי יִקְרְאוּ לָךְ
  choice: já não te chamarão
  rationale: A construção com יסף negado expressa cessação, enquanto a terceira pessoa do plural tem sujeito indefinido. A formulação portuguesa preserva ambos os elementos com naturalidade.
- source_word: גְּבֶרֶת מַמְלָכוֹת
  choice: senhora de reinos
  rationale: גְּבֶרֶת designa uma senhora ou mulher de posição dominante; “senhora de reinos” conserva a construção concisa e evita especificar indevidamente o título de rainha.
theological_decisions:
- issue: As trevas como imagem de juízo e perda de destaque
  choice: Manter “trevas” como imagem concreta no texto principal.
  alternative: Traduzir interpretativamente como “obscuridade” ou “esquecimento”.
  rationale: A imagem hebraica é deliberadamente evocativa e pode abranger humilhação, juízo e perda de proeminência; uma explicitação restringiria sua amplitude.
- issue: Personificação feminina da Babilônia/Caldeia
  choice: Preservar “filha dos caldeus” e o título feminino “senhora”.
  alternative: Substituir a figura diretamente por “Babilônia”.
  rationale: O hebraico dirige-se à potência como uma mulher, recurso retórico central ao anúncio de sua humilhação.
translation_notes:
  register: Português moderno, digno e legível, com colocação pronominal literária moderada em “Senta-te” e “te chamarão”. A repetição do tratamento feminino acompanha a personificação do hebraico.
