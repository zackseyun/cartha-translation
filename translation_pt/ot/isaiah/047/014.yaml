  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הִנֵּ֨ה הָי֤וּ כְ/קַשׁ֙ אֵ֣שׁ שְׂרָפָ֔תַ/ם לֹֽא יַצִּ֥ילוּ אֶת נַפְשָׁ֖/ם מִ/יַּ֣ד לֶֽהָבָ֑ה אֵין גַּחֶ֣לֶת לַ/חְמָ֔ם א֖וּר לָ/שֶׁ֥בֶת נֶגְדּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/014.yaml
  text: Look[a], they have become like stubble; fire burns them up. They cannot rescue themselves from the power of the flame. This is no coal for warming oneself, no fire to sit before.
translation:
  language: pt
  text: Eis[a], eles se tornaram como restolho; o fogo os consumiu. Não conseguem livrar a si mesmos do poder da chama. Não há brasa para aquecê-los, nem fogo diante do qual se possam sentar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vejam”. A expressão hebraica introduz enfaticamente o que segue.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Vejam
  rationale: Introduz enfaticamente a cena e chama a atenção dos ouvintes; o plural é natural no contexto do discurso dirigido à Babilônia e preserva a força dêitica em português atual.
- source_word: הָיוּ
  choice: se tornaram
  rationale: O perfeito descreve uma mudança já realizada e seu estado resultante.
- source_word: כְקַשׁ
  choice: como restolho
  rationale: קַשׁ designa palha ou restos secos deixados no campo, material facilmente consumido pelo fogo; “restolho” conserva a imagem profética.
- source_word: אֵשׁ שְׂרָפָתַם
  choice: o fogo os consome
  rationale: A formulação breve preserva a vivacidade da oração hebraica e expressa o caráter destrutivo de שׂרף.
- source_word: לֹא יַצִּילוּ אֶת נַפְשָׁם
  choice: Não conseguem livrar a si mesmos
  rationale: נצל no hiphil significa livrar ou resgatar, e נֶפֶשׁ refere-se aqui às próprias pessoas ou vidas deles, sem exigir uma conotação soteriológica.
- source_word: מִיַּד לֶהָבָה
  choice: do poder da chama
  rationale: A expressão idiomática “da mão de” indica domínio ou poder. A tradução comunica seu sentido natural em português e mantém a imagem singular da chama.
- source_word: אֵין גַּחֶלֶת לַחְמָם
  choice: Não é brasa para alguém se aquecer
  rationale: A construção difícil é entendida com חָמַם, “aquecer”, e contrasta o incêndio consumidor com uma brasa doméstica útil. A formulação impessoal evita especificar um sujeito ausente no hebraico.
- source_word: אוּר לָשֶׁבֶת נֶגְדּוֹ
  choice: nem fogo diante do qual se possa sentar
  rationale: אוּר significa aqui “fogo”; a frase evoca um fogo de lareira diante do qual alguém se senta.
theological_decisions:
- issue: Natureza da imagem de julgamento
  choice: Apresentar a destruição dos conselheiros ou praticantes ocultistas da Babilônia como julgamento no contexto histórico imediato.
  alternative: Interpretar explicitamente a imagem como referência à punição final ou como declaração geral sobre todo julgamento divino.
  rationale: O contexto é uma sátira profética contra a Babilônia. A tradução mantém a severidade da imagem sem impor um alcance escatológico que o versículo não explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Restolho” preserva a metáfora agrícola; “do poder da chama” traduz idiomaticamente מִיַּד; a oração final mantém o contraste entre fogo destruidor e fogo doméstico útil.
