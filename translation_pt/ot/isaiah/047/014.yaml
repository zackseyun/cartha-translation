revisions:
- from: Vejam[a], eles se tornaram como restolho; o fogo os consome. Não conseguem livrar a si mesmos do poder da chama. Não é brasa para alguém se aquecer, nem fogo diante do qual se possa sentar.
  to: Eis[a], eles se tornaram como restolho; o fogo os consumiu. Não conseguem livrar a si mesmos do poder da chama. Não há brasa para aquecê-los, nem fogo diante do qual se possam sentar.
  rationale: A revisão conserva o sentido e o tom do rascunho, mas representa mais exatamente a partícula inicial, o aspecto perfectivo de “o fogo os consumiu” e o sufixo plural na expressão difícil “para aquecê-los”. A tradução final não resolve além do necessário a dificuldade sintática da última imagem nem lhe atribui alcance teológico adicional.
