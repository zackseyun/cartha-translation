source:
  edition: WLC
  text: לָ/כֵ֗ן נְאֻ֤ם הָֽ/אָדוֹן֙ יְהוָ֣ה צְבָא֔וֹת אֲבִ֖יר יִשְׂרָאֵ֑ל ה֚וֹי אֶנָּחֵ֣ם מִ/צָּרַ֔/י וְ/אִנָּקְמָ֖ה מֵ/אוֹיְבָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/024.yaml
  text: 'Therefore the declaration of the Lord[a], Yahweh of Armies, the Mighty One of Israel: “Ah[c][b], I will get relief from my foes and avenge myself on my enemies.”'
translation:
  language: pt
  text: 'Portanto, assim declara o Senhor, Yahweh dos Exércitos, o Poderoso de Israel: “Ah! Eu me aliviarei dos meus adversários e me vingarei dos meus inimigos.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Marca a consequência da denúncia anterior e conserva de modo natural a força inferencial do hebraico.
- source_word: נְאֻם
  choice: esta é a declaração de
  rationale: Expressa a fórmula profética solene em linguagem portuguesa clara; a alternativa técnica “oráculo” é registrada em nota.
- source_word: הָאָדוֹן
  choice: o Senhor
  rationale: Preserva o título divino que enfatiza autoridade e soberania, sem confundi-lo com o nome próprio que vem em seguida.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, distinguindo-o do título הָאָדוֹן.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Comunica o sentido militar concreto do termo de maneira inteligível e mantém a forma consagrada do título em português.
- source_word: אֲבִיר יִשְׂרָאֵל
  choice: o Poderoso de Israel
  rationale: Reproduz o título divino que ressalta força e poder em português digno e corrente.
- source_word: הוֹי
  choice: Ah!
  rationale: Conserva a força emocional e exclamativa sem decidir indevidamente entre lamento, ameaça ou satisfação.
- source_word: אֶנָּחֵם
  choice: Eu me aliviarei
  rationale: No nifal e neste contexto, o verbo denota obter alívio ou satisfação mediante ação contra os adversários; a escolha não o funde com o verbo seguinte, que designa vingança.
- source_word: מִצָּרַי
  choice: dos meus adversários
  rationale: A preposição מן com o verbo permite a ideia de alívio em relação aos adversários; “dos” produz uma construção portuguesa natural, embora semanticamente ambígua, como o original.
- source_word: וְאִנָּקְמָה
  choice: e me vingarei
  rationale: Preserva a ação divina resoluta e a forma reflexiva, distinguindo-a do alívio mencionado antes.
- source_word: מֵאוֹיְבָי
  choice: dos meus inimigos
  rationale: Com “vingar-se”, a regência corrente em português é “de”, resultando em formulação direta e natural.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto apresenta o Tetragrama como nome divino, logo após o título “o Senhor”. A transliteração preserva essa distinção e evita substituir o nome por outro título.
- issue: Relação entre alívio divino e vingança divina
  choice: “Eu me aliviarei... e me vingarei...” como duas ações relacionadas, mas distintas
  alternative: Fundir ambas as expressões como uma única ideia de vingança ou suavizar a segunda como mero alívio
  rationale: 'Os dois verbos hebraicos têm sentidos próprios. A tradução mantém a tensão do texto: o juízo traz alívio ou satisfação e também constitui vingança contra os inimigos.'
- issue: Força da interjeição הוֹי
  choice: Ah!
  alternative: Ai!; Ha!; Ahá!
  rationale: “Ah!” mantém a intensidade afetiva sem impor exclusivamente lamento, escárnio ou triunfo, sentidos que o contexto e a interjeição podem sugerir em graus diferentes.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem solene dos títulos divinos foi preservada. “Exércitos” aparece com inicial maiúscula como parte do título, enquanto a nota esclarece a amplitude possível. Todas as alternativas relevantes são apresentadas sem resolver indevidamente a ambiguidade de אֶנָּחֵם.
