  text: חֲזוֹן֙ יְשַֽׁעְיָ֣הוּ בֶן אָמ֔וֹץ אֲשֶׁ֣ר חָזָ֔ה עַל יְהוּדָ֖ה וִ/ירוּשָׁלִָ֑ם בִּ/ימֵ֨י עֻזִּיָּ֧הוּ יוֹתָ֛ם אָחָ֥ז יְחִזְקִיָּ֖הוּ מַלְכֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/001.yaml
  text: The vision of Isaiah son of Amoz[a], which he saw concerning Judah and Jerusalem in the days of Uzziah, Jotham, Ahaz, and Hezekiah, kings of Judah.
translation:
  language: pt
  text: A visão de Isaías, filho de Amoz, que ele viu a respeito de Judá e Jerusalém[a], nos dias de Uzias, Jotão, Acaz e Ezequias, reis de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “contra Judá e Jerusalém”. A preposição hebraica pode indicar tanto o assunto da visão como, em certos contextos, uma mensagem contra alguém.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֲזוֹן
  choice: Visão
  rationale: Equivalente direto e convencional para uma visão profética; mantém a ligação semântica com חָזָה (“viu/teve uma visão”).
- source_word: יְשַׁעְיָהוּ בֶן־אָמֹוץ
  choice: Isaías, filho de Amoz
  rationale: Emprega as formas portuguesas tradicionais dos nomes e traduz literalmente a relação de filiação expressa por בֶן.
- source_word: אֲשֶׁר חָזָה
  choice: que ele teve
  rationale: Em português, “ter uma visão” é mais natural do que “ver uma visão”, embora a repetição etimológica do hebraico fique menos explícita.
- source_word: עַל
  choice: a respeito de
  rationale: Apresenta Judá e Jerusalém como assunto da visão sem excluir o possível tom adversativo do contexto profético; a alternativa é registrada em nota.
- source_word: בִּימֵי
  choice: nos dias de
  rationale: Preserva a expressão temporal hebraica em forma natural e tradicional no português, sem ampliá-la para “durante os reinados de”.
- source_word: עֻזִּיָּהוּ יוֹתָם אָחָז יְחִזְקִיָּהוּ
  choice: Uzias, Jotão, Acaz e Ezequias
  rationale: Usa as formas consagradas desses nomes na tradição bíblica em português.
- source_word: מַלְכֵי יְהוּדָה
  choice: reis de Judá
  rationale: Tradução direta do plural em construção, indicando que os quatro nomes são de reis de Judá.
theological_decisions:
- issue: Alcance de עַל no título profético
  choice: a respeito de Judá e Jerusalém
  alternative: contra Judá e Jerusalém
  rationale: A preposição pode introduzir o tema de uma profecia ou, conforme o contexto, uma mensagem adversativa. A leitura principal mais abrangente preserva tanto juízo quanto esperança, enquanto a nota mantém a ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e digno, com formas bíblicas amplamente reconhecíveis. “Que ele teve” privilegia a naturalidade idiomática brasileira e internacional; a estrutura geral permanece próxima do título hebraico.
