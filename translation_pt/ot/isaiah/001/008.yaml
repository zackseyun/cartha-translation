id: ISA.1.8
reference: Isaiah 1:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/נוֹתְרָ֥ה בַת צִיּ֖וֹן כְּ/סֻכָּ֣ה בְ/כָ֑רֶם כִּ/מְלוּנָ֥ה בְ/מִקְשָׁ֖ה כְּ/עִ֥יר נְצוּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/008.yaml
  text: And daughter Zion is left like a shelter in a vineyard[a], like a hut in a cucumber field[c][b], like a besieged city.
translation:
  language: pt
  text: E a filha de Sião ficou como uma cabana numa vinha, como um abrigo numa plantação de pepinos[a], como uma cidade sitiada[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “numa plantação de melões” ou “numa plantação de cabaças”; o termo hebraico pode abranger pepinos e outras plantas rasteiras semelhantes.
    reason: lexical_alternative
  - marker: b
    text: Ou, possivelmente, “como uma cidade guardada”; “cidade sitiada” se ajusta melhor ao contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנוֹתְרָה
  choice: E ... ficou
  rationale: O nifal de נותר expressa o que restou após a devastação. “Ficou” é natural em português e, neste contexto, comunica que Sião foi deixada isolada.
- source_word: בַת צִיּוֹן
  choice: a filha de Sião
  rationale: Preserva a personificação poética convencional de Sião/Jerusalém e reproduz naturalmente em português a relação construta do hebraico.
- source_word: כְּסֻכָּה
  choice: como uma cabana
  rationale: סֻכָּה designa uma estrutura temporária de proteção. “Cabana” conserva a imagem concreta, frágil e provisória.
- source_word: בְכָרֶם
  choice: numa vinha
  rationale: Tradução locativa direta do substantivo singular, mantendo a imagem de uma cabana isolada dentro da vinha.
- source_word: כִּמְלוּנָה
  choice: como um abrigo
  rationale: מְלוּנָה é um lugar provisório de pernoite ou abrigo no campo. “Abrigo” evita repetição mecânica e mantém a função temporária da estrutura.
- source_word: בְמִקְשָׁה
  choice: numa plantação de pepinos
  rationale: מִקְשָׁה indica uma área cultivada com pepinos ou plantas semelhantes da família das cucurbitáceas. A formulação é clara em português, e a amplitude lexical é registrada em nota.
- source_word: כְּעִיר נְצוּרָה
  choice: como uma cidade sitiada
  rationale: No contexto de devastação e isolamento, נְצוּרָה é mais naturalmente entendido como “sitiada”. A possibilidade de “guardada” é preservada em nota.
theological_decisions:
- issue: Personificação de Sião
  choice: a filha de Sião
  alternative: Jerusalém; o povo de Sião
  rationale: O texto hebraico personifica Sião como filha. Manter essa expressão preserva a forma poética e sua tensão teológica sem substituir a imagem por uma interpretação.
- issue: Sentido de נְצוּרָה
  choice: cidade sitiada
  alternative: cidade guardada ou vigiada
  rationale: “Sitiada” se ajusta melhor ao contexto imediato de juízo, desolação e isolamento, sem eliminar em nota a ambiguidade lexical possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das três comparações e a personificação poética foram preservadas. Empregou-se “numa” por naturalidade corrente, sem tornar o registro coloquial.
