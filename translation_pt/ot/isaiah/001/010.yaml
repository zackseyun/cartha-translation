id: ISA.1.10
reference: Isaiah 1:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שִׁמְע֥וּ דְבַר יְהוָ֖ה קְצִינֵ֣י סְדֹ֑ם הַאֲזִ֛ינוּ תּוֹרַ֥ת אֱלֹהֵ֖י/נוּ עַ֥ם עֲמֹרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/010.yaml
  text: Hear the word of Yahweh[a], rulers of Sodom; give ear to the instruction of our God[b], people of Gomorrah.
translation:
  language: pt
  text: Ouçam a palavra de Yahweh[a], governantes de Sodoma; deem ouvidos à instrução do nosso Deus[b], povo de Gomorra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isaías chama os líderes e o povo de Judá de «Sodoma» e «Gomorra» como comparação profética, não como identificação literal.
    reason: cultural_note
  - marker: b
    text: Ou «lei» ou «ensino»; o termo hebraico é torah.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Ouçam
  rationale: Imperativo plural que convoca não apenas a ouvir, mas também a prestar atenção; «Ouçam» é direto, natural e mantém a força profética.
- source_word: דְבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Mantém a fórmula profética tradicional e traduz o nome divino como nome próprio, em vez de substituí-lo por um título.
- source_word: קְצִינֵי
  choice: governantes
  rationale: O substantivo designa dirigentes ou autoridades; «governantes» comunica claramente a função e se ajusta à interpelação profética.
- source_word: הַאֲזִינוּ
  choice: deem ouvidos
  rationale: Preserva o paralelismo com «Ouçam» e representa um verbo distinto, com a ideia enfática de escutar atentamente.
- source_word: תּוֹרַת
  choice: instrução
  rationale: Torah pode significar lei, ensino ou instrução; neste contexto profético, «instrução» preserva a amplitude do termo sem restringi-lo a um código legal.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Conserva o sufixo de primeira pessoa do plural explícito no hebraico e a identificação do profeta com o povo da aliança.
- source_word: עַם עֲמֹרָה
  choice: povo de Gomorra
  rationale: Reproduz naturalmente em português a expressão vocativa hebraica, sem acrescentar uma comparação explícita que não aparece no texto.
theological_decisions:
- issue: Identificação profética de Judá e Jerusalém com Sodoma e Gomorra
  choice: Manter os vocativos literais «governantes de Sodoma» e «povo de Gomorra».
  alternative: 'Explicitar a comparação: «governantes semelhantes aos de Sodoma» e «povo semelhante ao de Gomorra».'
  rationale: O hebraico interpela diretamente os ouvintes com os nomes das cidades. A formulação literal preserva o impacto e a tensão da denúncia profética; a nota esclarece que não se trata de identificação geográfica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «Deem ouvidos» conserva o paralelismo poético sem soar excessivamente arcaico; a pontuação mantém as duas interpelações solenes do hebraico.
