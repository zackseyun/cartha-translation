  text: חָדְשֵׁי/כֶ֤ם וּ/מוֹעֲדֵי/כֶם֙ שָׂנְאָ֣ה נַפְשִׁ֔/י הָי֥וּ עָלַ֖/י לָ/טֹ֑רַח נִלְאֵ֖יתִי נְשֹֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/014.yaml
  text: Your new moons and your appointed feasts my soul hates[a]; they have become a burden to me; I am weary of bearing them.
translation:
  language: pt
  text: A minha alma odeia as suas luas novas e as suas festas designadas[a]; elas se tornaram um fardo para mim; estou cansado de carregá-las.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «suas ocasiões determinadas» ou «suas festas».
    reason: lexical_alternative
lexical_decisions:
- source_word: חָדְשֵׁיכֶם
  choice: as suas luas novas
  rationale: חֹדֶשׁ designa literalmente a lua nova e, por extensão, a celebração mensal associada a ela. “Luas novas” preserva a expressão cultual hebraica sem explicitação excessiva.
- source_word: וּמוֹעֲדֵיכֶם
  choice: e as suas festas marcadas
  rationale: מוֹעֵד pode indicar tempo ou encontro determinado; neste contexto cultual, refere-se às festas celebradas em ocasiões estabelecidas. “Festas marcadas” comunica tanto a ideia de celebração quanto a de tempo fixado.
- source_word: שָׂנְאָה נַפְשִׁי
  choice: A minha alma odeia
  rationale: A tradução conserva נֶפֶשׁ como sujeito e, assim, mantém a expressão enfática da profunda repulsa pessoal, em vez de reduzi-la simplesmente a “eu odeio”.
- source_word: הָיוּ עָלַי לָטֹרַח
  choice: elas se tornaram um fardo para mim
  rationale: 'A construção descreve um estado resultante: essas celebrações vieram a ser um peso para Deus. “Fardo” também sustenta a imagem de carregar presente na frase seguinte.'
- source_word: נִלְאֵיתִי נְשֹׂא
  choice: estou cansado de suportá-las
  rationale: נִלְאֵיתִי expressa cansaço ou exaustão, e נָשָׂא significa levar ou carregar. “Suportá-las” é natural em português e preserva o sentido de aguentar um fardo.
theological_decisions:
- issue: A repulsa divina pelas práticas de culto de Israel
  choice: O possessivo “suas” é mantido, apresentando essas celebrações como as práticas cultuais de Israel que Deus agora rejeita no contexto de sua corrupção.
  alternative: Traduzir de modo a sugerir explicitamente que Deus rejeita as festas em si mesmas, embora tenham sido instituídas por ele.
  rationale: O versículo enfatiza a rejeição divina da forma assumida pelo culto de Israel no contexto imediato. A tradução preserva a força da denúncia e o possessivo do hebraico sem acrescentar uma harmonização teológica nem afirmar que as festas eram intrinsecamente más.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação “A minha alma odeia” conserva deliberadamente a ênfase pessoal do hebraico; “festas marcadas” mantém a dimensão festiva e a noção de ocasiões fixadas.
