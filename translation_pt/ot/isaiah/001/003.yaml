  text: An ox knows its owner[a], and a donkey its master's feeding trough; Israel does not know[b]; my people do not understand.
translation:
  language: pt
  text: 'O boi conhece o seu dono,

    e o jumento, o cocho do seu senhor;

    Israel não conhece[a];

    o meu povo não entende.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O sentido implícito é que Israel não conhece o SENHOR, embora o hebraico deixe o objeto sem expressão.
    reason: alternative_reading
lexical_decisions:
- source_word: יָדַע
  choice: conhece
  rationale: Preserva o sentido cognitivo e relacional do verbo e sua repetição retórica na acusação dirigida a Israel.
- source_word: שׁוֹר
  choice: boi
  rationale: É a designação corrente e natural, em português, do bovino domesticado nesta comparação.
- source_word: קֹנֵהוּ
  choice: seu dono
  rationale: No contexto de um animal doméstico, traduz naturalmente a ideia daquele que o possui.
- source_word: חֲמוֹר
  choice: jumento
  rationale: Termo claro e amplamente compreensível para o animal mencionado; mantém um registro digno.
- source_word: אֵבוּס
  choice: cocho
  rationale: Designa de modo preciso e conciso o recipiente em que se põe alimento para animais.
- source_word: בְּעָלָיו
  choice: seu senhor
  rationale: Expressa posse e autoridade, além de reproduzir naturalmente a variação entre os dois membros do paralelismo.
- source_word: יִשְׂרָאֵל לֹא יָדַע
  choice: Israel não conhece
  rationale: Mantém sem objeto explícito a formulação hebraica e repete 'conhece', conservando o contraste retórico com o boi.
- source_word: עַמִּי
  choice: meu povo
  rationale: Reproduz diretamente a expressão pactual e o sufixo de primeira pessoa.
- source_word: הִתְבּוֹנָן
  choice: entende
  rationale: Comunica a falta de discernimento ou compreensão reflexiva e forma um paralelo natural com 'não conhece'.
theological_decisions:
- issue: Objeto implícito da falta de conhecimento de Israel
  choice: 'Deixar o objeto sem expressão no texto principal: ''Israel não conhece'''
  alternative: 'Explicitar: ''Israel não me conhece'' ou ''Israel não conhece o SENHOR'''
  rationale: Embora o contexto indique fortemente o SENHOR como objeto, o hebraico não o enuncia. A tradução conserva a concisão e a tensão retórica do original.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético preservado. 'Cocho' evita associações posteriores que 'manjedoura' poderia evocar. O contraste enfático foi realçado naturalmente com 'mas', sem alterar o conteúdo proposicional.
