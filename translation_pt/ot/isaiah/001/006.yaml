  text: מִ/כַּף רֶ֤גֶל וְ/עַד רֹאשׁ֙ אֵֽין בּ֣/וֹ מְתֹ֔ם פֶּ֥צַע וְ/חַבּוּרָ֖ה וּ/מַכָּ֣ה טְרִיָּ֑ה לֹא זֹ֨רוּ֙ וְ/לֹ֣א חֻבָּ֔שׁוּ וְ/לֹ֥א רֻכְּכָ֖ה בַּ/שָּֽׁמֶן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/006.yaml
  text: From the sole of the foot even to the head[a], there is no soundness in it—only wounds and bruises and fresh blows; they have not been pressed out, or bandaged[d][c][b], or softened with oil.
translation:
  language: pt
  text: 'Da planta do pé até a cabeça, não há nele nenhuma parte sadia[a]: só feridas, contusões e lesões recentes[b]. Elas não foram espremidas[c], nem enfaixadas[d], nem amolecidas com óleo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não há nele integridade alguma”. O hebraico retrata o povo como um corpo ferido.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “feridas ainda cruas”. A expressão pode indicar lesões novas, recentes e ainda não tratadas.'
    reason: lexical_alternative
  - marker: c
    text: O verbo hebraico é incomum e, neste contexto, pode se referir a espremer ou comprimir as feridas para expelir seu conteúdo antes de tratá-las.
    reason: cultural_note
  - marker: d
    text: 'Ou: “atadas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכַּף רֶגֶל וְעַד רֹאשׁ
  choice: Da planta do pé até a cabeça
  rationale: A expressão forma um merismo que abrange o corpo inteiro. “Planta do pé” traduz naturalmente כַּף רֶגֶל, e “até a cabeça” conserva a extensão de baixo a cima.
- source_word: אֵין בּוֹ מְתֹם
  choice: não há nele nenhuma parte sadia
  rationale: מְתֹם indica integridade, saúde ou condição ilesa. A formulação é clara em português e mantém a metáfora corporal; “nele” conserva a personificação coletiva sem explicitar além do hebraico se o referente imediato é o povo ou o corpo figurado.
- source_word: פֶּצַע
  choice: feridas
  rationale: Termo geral para ferimento ou lesão; o plural coletivo soa natural na enumeração portuguesa.
- source_word: חַבּוּרָה
  choice: contusões
  rationale: Designa marcas ou lesões causadas por golpes. “Contusões” comunica a ideia corporal em linguagem moderna e digna.
- source_word: מַכָּה טְרִיָּה
  choice: chagas recentes
  rationale: מַכָּה pode indicar golpe ou ferida, e טְרִיָּה significa fresca ou recente. “Chagas recentes” preserva a imagem de lesões ainda cruas, sem pressupor que estejam infeccionadas.
- source_word: לֹא זֹרוּ
  choice: não foram espremidas
  rationale: Neste contexto médico, o verbo obscuro é geralmente entendido como espremer ou comprimir feridas para expelir seu conteúdo. A tradução direta é mantida, com nota explicativa.
- source_word: וְלֹא חֻבָּשׁוּ
  choice: nem enfaixadas
  rationale: חבשׁ, no tratamento de feridas, significa atar, envolver ou aplicar uma faixa. “Enfaixadas” é preciso e corrente.
- source_word: וְלֹא רֻכְּכָה בַּשָּׁמֶן
  choice: nem amolecidas com óleo
  rationale: רכך significa tornar macio ou amolecer. A tradução conserva a imagem concreta do tratamento antigo com óleo, sem substituí-la por uma interpretação mais ampla como “aliviadas”.
theological_decisions:
- issue: Referente da metáfora corporal
  choice: Manter “nele”, preservando a personificação do povo como um corpo ferido
  alternative: Empregar “nela” com referência explícita à nação, ou “nesse corpo”
  rationale: O hebraico usa uma forma pronominal masculina singular e apresenta coletivamente Judá/Israel como um corpo enfermo. “Nele” mantém tanto a personificação quanto a referência gramatical possível ao povo, sem transformar a figura em um indivíduo específico.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O registro é digno e concreto, com terminologia médica comum. A enumeração e a metáfora corporal foram preservadas, e as ambiguidades lexicais relevantes foram registradas em notas.
