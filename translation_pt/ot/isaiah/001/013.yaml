  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לֹ֣א תוֹסִ֗יפוּ הָבִיא֙ מִנְחַת שָׁ֔וְא קְטֹ֧רֶת תּוֹעֵבָ֛ה הִ֖יא לִ֑/י חֹ֤דֶשׁ וְ/שַׁבָּת֙ קְרֹ֣א מִקְרָ֔א לֹא אוּכַ֥ל אָ֖וֶן וַ/עֲצָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/013.yaml
  text: Do not continue bringing worthless grain offerings[a]; incense is an abomination to me. New moon and Sabbath[b], the calling of an assembly—I cannot endure iniquity and solemn assembly.
translation:
  language: pt
  text: Não continuem trazendo ofertas de cereal sem valor[a]; o incenso é uma abominação para mim. Lua nova e sábado, convocar uma assembleia — não posso suportar maldade e reunião solene.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ofertas de cereal vãs” ou “ofertas de cereal vazias”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não posso suportar maldade junto com reunião solene”. O hebraico é conciso e pode indicar a incompatibilidade entre a prática do mal e a reunião para o culto.'
    reason: alternative_reading
lexical_decisions:
- source_word: תוֹסִיפוּ הָבִיא
  choice: continuem trazendo
  rationale: O hifil de יסף seguido de infinitivo expressa a continuação de uma ação; a formulação portuguesa preserva naturalmente essa força reiterativa.
- source_word: מִנְחַת שָׁוְא
  choice: ofertas de cereal sem valor
  rationale: מִנְחָה, neste contexto de culto, designa uma oferta de cereal, enquanto שָׁוְא comunica vazio, inutilidade ou falta de valor.
- source_word: קְטֹרֶת
  choice: incenso
  rationale: O substantivo refere-se diretamente ao incenso oferecido no culto; o contexto torna desnecessário acrescentar 'oferta de'.
- source_word: תּוֹעֵבָה הִיא לִי
  choice: é uma abominação para mim
  rationale: Preserva a intensidade de תּוֹעֵבָה e mantém um registro bíblico digno e compreensível.
- source_word: חֹדֶשׁ
  choice: Lua nova
  rationale: No calendário cultual, designa a observância realizada no início do mês lunar.
- source_word: שַׁבָּת
  choice: sábado
  rationale: É a forma corrente em português para o dia semanal de descanso e culto referido pelo hebraico.
- source_word: קְרֹא מִקְרָא
  choice: convocação de assembleias
  rationale: Reproduz de modo natural a combinação do verbo com o substantivo cognato e comunica o ato de reunir formalmente o povo.
- source_word: לֹא אוּכַל
  choice: não posso suportar
  rationale: Embora אוּכַל signifique literalmente 'posso', aqui a expressão comunica intolerabilidade; 'não posso suportar' transmite esse valor idiomático.
- source_word: אָוֶן
  choice: maldade
  rationale: Neste contexto, o termo aponta para o mal moral ligado a um culto rejeitado; 'maldade' é claro, atual e preserva seu peso ético.
- source_word: וַעֲצָרָה
  choice: e reunião solene
  rationale: עֲצָרָה designa uma reunião religiosa formal ou festiva; 'reunião solene' preserva esse sentido sem excesso de tecnicismo.
theological_decisions:
- issue: Relação entre a conduta pecaminosa e o culto na cláusula final
  choice: não posso suportar maldade e reunião solene
  alternative: não posso suportar maldade junto com reunião solene
  rationale: O hebraico justapõe אָוֶן e עֲצָרָה sem preposição explícita. A coordenação preserva a concisão e a tensão do original, enquanto a nota registra a leitura que explicita a incompatibilidade entre o mal e a assembleia de culto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Mantém tom profético forte e digno, com vocabulário cultual claro. Os marcadores foram colocados junto aos trechos a que efetivamente se referem, corrigindo a aparente inversão das notas na camada inglesa.
