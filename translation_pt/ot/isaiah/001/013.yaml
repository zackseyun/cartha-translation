  terminology: “Ofertas de cereal”, “incenso”, “abominação”, “lua nova”, “sábado” e “reunião solene” são escolhas adequadas. “Maldade” comunica bem אָוֶן neste contexto. A nota alternativa preserva corretamente a relação sintática disputada da cláusula final.
