  to: Não continuem trazendo ofertas de cereal sem valor[a]; o incenso é uma abominação para mim. Lua nova e sábado, convocar uma assembleia — não posso suportar maldade e reunião solene.[b]
  rationale: A revisão limita-se a substituir o plural interpretativo “convocação de assembleias” por “convocar uma assembleia”, preservando o singular de מִקְרָא e a construção intensiva do infinitivo com substantivo cognato. O restante do texto e as notas são mantidos, inclusive a ambiguidade deliberada de אָוֶן וַעֲצָרָה.
