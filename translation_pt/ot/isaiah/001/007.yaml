revisions:
- from: A terra de vocês está devastada; suas cidades foram queimadas pelo fogo. Diante dos seus próprios olhos, estrangeiros devoram o seu solo, que está devastado, como numa destruição causada por estrangeiros.[a]
  to: A terra de vocês está devastada; suas cidades estão queimadas pelo fogo. Diante dos seus próprios olhos, estrangeiros devoram o seu solo, que está devastado como após uma destruição causada por estrangeiros.[a]
  rationale: A revisão conserva o sentido do texto-base e a leitura principal do audit trail, ao mesmo tempo que melhora o aspecto da descrição das cidades e a fluência da comparação final em português. A nota mantém as alternativas interpretativas da expressão hebraica compacta כְּמַהְפֵּכַת זָרִים, sem apresentar a alusão a Sodoma como certa.
