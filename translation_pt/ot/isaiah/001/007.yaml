  text: אַרְצְ/כֶ֣ם שְׁמָמָ֔ה עָרֵי/כֶ֖ם שְׂרֻפ֣וֹת אֵ֑שׁ אַדְמַתְ/כֶ֗ם לְ/נֶגְדְּ/כֶם֙ זָרִים֙ אֹכְלִ֣ים אֹתָ֔/הּ וּ/שְׁמָמָ֖ה כְּ/מַהְפֵּכַ֥ת זָרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/007.yaml
  text: Your land is a desolation[a]; your cities are burned with fire. Your soil—before your very eyes—strangers are devouring it, and it is a desolation[b], like an overthrow by strangers.
translation:
  language: pt
  text: A terra de vocês está devastada; suas cidades estão queimadas pelo fogo. Diante dos seus próprios olhos, estrangeiros devoram o seu solo, que está devastado como após uma destruição causada por estrangeiros.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “como uma destruição de estrangeiros”. A expressão também pode significar “como na destruição de estrangeiros”; alguns entendem que há uma alusão à destruição de Sodoma.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַרְצְכֶם
  choice: a terra de vocês
  rationale: אֶרֶץ designa a terra ou o território do povo; a formulação é ampla, natural e clara em português.
- source_word: שְׁמָמָה
  choice: está devastada
  rationale: O substantivo hebraico expressa um estado de desolação. Em português, a construção adjetival comunica esse estado com maior naturalidade, sem reduzir a força do juízo.
- source_word: עָרֵיכֶם
  choice: suas cidades
  rationale: Tradução direta do plural com sufixo de segunda pessoa do plural.
- source_word: שְׂרֻפוֹת אֵשׁ
  choice: foram queimadas pelo fogo
  rationale: Mantém explicitamente אֵשׁ, “fogo”, e expressa de modo idiomático o particípio passivo hebraico.
- source_word: אַדְמַתְכֶם
  choice: o seu solo
  rationale: Distingue אֲדָמָה, o chão ou solo produtivo, de אֶרֶץ, “terra/território”, no início do versículo.
- source_word: לְנֶגְדְּכֶם
  choice: diante dos seus próprios olhos
  rationale: 'Torna explícita a força retórica da expressão: o povo presencia a devastação sem poder impedi-la.'
- source_word: זָרִים
  choice: estrangeiros
  rationale: No contexto de invasão, indica pessoas de fora do território; “estrangeiros” é atual, digno e adequado nas duas ocorrências.
- source_word: אֹכְלִים אֹתָהּ
  choice: devoram
  rationale: O verbo “devorar” preserva a imagem concreta de comer e comunica idiomaticamente a exploração destrutiva do solo e de seus produtos.
- source_word: וּשְׁמָמָה
  choice: que está devastado
  rationale: Retoma a ideia inicial de devastação; a oração relativa dá fluidez ao português e identifica naturalmente o solo como referente imediato.
- source_word: כְּמַהְפֵּכַת זָרִים
  choice: como numa destruição causada por estrangeiros
  rationale: Representa מַהְפֵּכָה como destruição catastrófica e toma זָרִים como agente, mantendo a ligação com os estrangeiros da oração anterior sem esconder a ambiguidade da construção.
theological_decisions:
- issue: Sentido de כְּמַהְפֵּכַת זָרִים
  choice: como numa destruição causada por estrangeiros
  alternative: como na destruição de estrangeiros; ou, possivelmente, como na destruição de Sodoma
  rationale: A expressão hebraica é compacta e admite mais de uma relação genitiva. O texto principal toma os estrangeiros como agentes, em paralelo com a oração anterior, mas a nota conserva as principais alternativas sem impor uma identificação específica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “vocês” apenas onde necessário para representar claramente a segunda pessoa do plural. A sintaxe foi suavemente reorganizada para fluência, mantendo as imagens de fogo, devoração e devastação. A única nota registra a ambiguidade real da frase final.
