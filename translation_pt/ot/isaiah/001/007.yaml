review_pass:
  verdict: revise
  source_fidelity: 'O texto reproduz adequadamente as imagens e a progressão do hebraico: terra desolada, cidades queimadas, solo consumido por estrangeiros à vista do povo e a comparação final, sintaticamente difícil. A construção final deve conservar mais claramente o valor comparativo de כְּ e a ambiguidade da relação de זָרִים com «destruição».'
  naturalness: O português é moderno, claro e apropriado ao registro profético. «Foram queimadas pelo fogo» é compreensível, mas «estão queimadas pelo fogo» reflete melhor o particípio hebraico como quadro presente/resultante. A formulação final «como numa destruição» pode ser ajustada para uma comparação mais fluente.
  terminology: «Terra», «solo», «estrangeiros», «devoram» e «devastado» são escolhas adequadas. A distinção entre אֶרֶץ («terra») e אֲדָמָה («solo») é bem preservada. «Estrangeiros» é consistente nas duas ocorrências e não carrega conotação denominacional.
  issues:
  - severity: low
    issue: Tempo/aspecto de שְׂרֻפוֹת אֵשׁ
    rationale: O particípio passivo descreve as cidades em seu estado de terem sido queimadas. «Estão queimadas pelo fogo» preserva melhor esse aspecto no retrato profético do que o pretérito perfeito «foram queimadas».
  - severity: low
    issue: Formulação da comparação final
    rationale: «Como numa destruição causada por estrangeiros» é defensável, mas pode sugerir sobretudo uma circunstância («numa destruição»). «Como após uma destruição causada por estrangeiros» torna a comparação de estado mais idiomática, sem resolver a ambiguidade, que permanece explicitada na nota.
  revised_text: A terra de vocês está devastada; suas cidades estão queimadas pelo fogo. Diante dos seus próprios olhos, estrangeiros devoram o seu solo, que está devastado como após uma destruição causada por estrangeiros.[a]
  revised_footnotes:
