    reason: alternative_reading
  revision_rationale: A revisão conserva o sentido do texto-base e a leitura principal do audit trail, ao mesmo tempo que melhora o aspecto da descrição das cidades e a fluência da comparação final em português. A nota mantém as alternativas interpretativas da expressão hebraica compacta כְּמַהְפֵּכַת זָרִים, sem apresentar a alusão a Sodoma como certa.
