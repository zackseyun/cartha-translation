base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/012.yaml
  text: 'When you come to appear before me[a], who has required this from your hand: trampling my courts?'
translation:
  language: pt
  text: Quando vocês vêm para comparecer diante de mim[a], quem exigiu de vocês que pisoteassem os meus pátios?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica traz a imagem de “ver a minha face” e, neste contexto, significa comparecer na presença de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Quando
  rationale: Neste contexto, introduz a circunstância em que se aplica a repreensão, e não uma causa direta.
- source_word: תָבֹאוּ
  choice: vocês vêm
  rationale: בוא significa normalmente “vir” ou “entrar”; “vêm” combina naturalmente com a ideia de comparecer na presença divina.
- source_word: לֵרָאוֹת פָּנָי
  choice: comparecer diante de mim
  rationale: A expressão cultual indica apresentar-se na presença de Deus. A tradução comunica essa função em português natural, enquanto a nota registra a imagem hebraica da face.
- source_word: מִי בִקֵּשׁ
  choice: quem exigiu
  rationale: A pergunta retórica contesta que Deus tenha requerido esse culto; “exigiu” transmite a ideia contextual de requerer como obrigação.
- source_word: זֹאת
  choice: isto
  rationale: O demonstrativo aponta para a prática censurada, explicitada depois dos dois-pontos.
- source_word: מִיֶּדְכֶם
  choice: de vocês
  rationale: O hebraico diz literalmente “da mão de vocês”, mas em português atual a expressão idiomática significa simplesmente aquilo que se exige deles. A forma natural evita sugerir uma ação física das mãos.
- source_word: רְמֹס חֲצֵרָי
  choice: pisotear os meus átrios
  rationale: O infinitivo especifica aquilo que supostamente foi exigido. “Átrios” designa com precisão os pátios do santuário, e “pisotear” preserva o tom acusatório.
theological_decisions:
- issue: Sentido cultual de לֵרָאוֹת פָּנָי
  choice: comparecer diante de mim
  alternative: ver a minha face
  rationale: O contexto trata da apresentação dos adoradores no santuário. A tradução principal comunica esse sentido sem transformar a frase numa afirmação sobre visão física de Deus; a nota conserva a imagem hebraica e sua ambiguidade lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. Os dois-pontos preservam a aposição do infinitivo hebraico, que identifica “isto” como o ato de pisotear os átrios.
