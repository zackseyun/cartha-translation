  text: אִם תֹּאב֖וּ וּ/שְׁמַעְתֶּ֑ם ט֥וּב הָ/אָ֖רֶץ תֹּאכֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/019.yaml
  text: If you are willing and obedient[a], you will eat the good of the land.
translation:
  language: pt
  text: Se vocês estiverem dispostos e obedecerem[a], comerão o que a terra tem de bom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e escutarem”, no sentido de escutar e responder com obediência.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Partícula condicional que introduz a condição da promessa.
- source_word: תֹּאבוּ
  choice: vocês estiverem dispostos
  rationale: O verbo אבה expressa disposição ou consentimento; esta formulação é natural em português e preserva o sentido volitivo.
- source_word: וּשְׁמַעְתֶּם
  choice: e obedecerem
  rationale: שׁמע pode significar ouvir, escutar ou obedecer. Neste apelo pactual, indica escuta acompanhada de resposta obediente.
- source_word: טוּב
  choice: o melhor
  rationale: O substantivo designa o que é bom e, em ligação com 'a terra', refere-se aos seus bons produtos ou à sua fartura. 'O melhor da terra' comunica essa ideia de modo idiomático.
- source_word: הָאָרֶץ
  choice: da terra
  rationale: No contexto, refere-se à terra e aos seus produtos, não ao planeta inteiro.
- source_word: תֹּאכֵלוּ
  choice: comerão
  rationale: Traduz diretamente o sentido concreto de אכל e expressa o resultado futuro da condição.
theological_decisions:
- issue: Sentido de שׁמע na exortação pactual
  choice: obedecerem
  alternative: escutarem
  rationale: O contexto imediato contrasta resposta e recusa (vv. 19–20). 'Obedecerem' explicita a escuta responsiva implícita no verbo hebraico sem acrescentar conteúdo doutrinário.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A segunda pessoa do plural foi expressa por “vocês”, forma amplamente inteligível; “o melhor da terra” transmite de maneira idiomática a fartura ou os bons produtos da terra.
