source:
  edition: WLC
  text: לִמְד֥וּ הֵיטֵ֛ב דִּרְשׁ֥וּ מִשְׁפָּ֖ט אַשְּׁר֣וּ חָמ֑וֹץ שִׁפְט֣וּ יָת֔וֹם רִ֖יבוּ אַלְמָנָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/017.yaml
  text: Learn to do good; seek justice[a], correct the oppressor; judge for the fatherless, plead for the widow.
translation:
  language: pt
  text: Aprendam a fazer o bem; busquem a justiça, corrijam o opressor[a]; façam justiça ao órfão, defendam a causa da viúva.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ajudem o oprimido” ou “ponham em ordem a situação do oprimido”. A expressão hebraica é difícil, e חָמוֹץ pode ser entendida de maneiras diferentes.
    reason: alternative_reading
lexical_decisions:
- source_word: לִמְדוּ
  choice: Aprendam
  rationale: O imperativo plural de למד convoca os ouvintes a adquirir e praticar um novo modo de agir. “Aprendam” preserva sua força direta.
- source_word: הֵיטֵב
  choice: a fazer o bem
  rationale: O advérbio derivado de יטב pode significar “bem”; no contexto ético, a expressão portuguesa natural “fazer o bem” explicita sem excessiva paráfrase o objeto implícito.
- source_word: דִּרְשׁוּ
  choice: busquem
  rationale: דרש expressa procurar ou empenhar-se por algo. “Busquem” mantém a amplitude e a força ativa do imperativo.
- source_word: מִשְׁפָּט
  choice: a justiça
  rationale: Neste contexto profético e social, משפט designa justiça, especialmente no âmbito jurídico e na proteção dos vulneráveis.
- source_word: אַשְּׁרוּ
  choice: corrijam
  rationale: A forma piel de אשר provavelmente significa “endireitar”, “pôr em ordem” ou “corrigir”. “Corrijam” é conciso e permite tomar חָמוֹץ como a pessoa que oprime.
- source_word: חָמוֹץ
  choice: o opressor
  rationale: O termo é difícil e admite entendimento ativo (“opressor”) ou passivo (“oprimido”). O texto principal segue o sentido ativo, enquanto a nota preserva a alternativa plausível.
- source_word: שִׁפְטוּ
  choice: façam justiça a
  rationale: שפט aqui pede uma decisão judicial favorável ao vulnerável. “Façam justiça a” conserva o teor jurídico e soa mais natural em português atual do que uma tradução mecânica como “julguem por”.
- source_word: יָתוֹם
  choice: o órfão
  rationale: יתום refere-se à criança privada do pai e, portanto, socialmente vulnerável. “Órfão” é a designação corrente e clara em português.
- source_word: רִיבוּ
  choice: defendam a causa de
  rationale: ריב tem aqui sentido de contenda ou advocacia jurídica. “Defendam a causa de” comunica de modo natural a ação de assumir o caso de alguém.
- source_word: אַלְמָנָה
  choice: a viúva
  rationale: Equivalente português padrão para אלמנה, categoria recorrente de pessoa socialmente vulnerável no texto bíblico.
theological_decisions:
- issue: Tradução da expressão difícil אַשְּׁרוּ חָמוֹץ
  choice: corrijam o opressor
  alternative: ajudem o oprimido; ponham em ordem a situação do oprimido
  rationale: A construção hebraica é lexicalmente contestada. O texto principal adota o sentido ativo de חָמוֹץ (“opressor”) e entende אַשְּׁרוּ como “corrijam”. Como o sentido passivo (“oprimido”) é plausível e tradicional, ele é registrado em nota, sem resolver silenciosamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência de imperativos foi preservada. Empregou-se “façam justiça ao órfão” em vez de uma formulação excessivamente literal, mantendo o campo jurídico; “defendam a causa da viúva” conserva a imagem de advocacia legal.
