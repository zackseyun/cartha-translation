source:
  edition: WLC
  text: אֵיכָה֙ הָיְתָ֣ה לְ/זוֹנָ֔ה קִרְיָ֖ה נֶאֱמָנָ֑ה מְלֵאֲתִ֣י מִשְׁפָּ֗ט צֶ֛דֶק יָלִ֥ין בָּ֖/הּ וְ/עַתָּ֥ה מְרַצְּחִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/021.yaml
  text: How the faithful city has become a prostitute! She was full of justice[a]; righteousness lodged in her[c][b], but now murderers.
translation:
  language: pt
  text: Como a cidade fiel se tornou prostituta![a] Ela estava cheia de justiça; a retidão se alojava nela,[b] mas agora, assassinos!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meretriz”. O termo hebraico designa uma prostituta; aqui é uma metáfora da infidelidade e da corrupção da cidade.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a retidão passava a noite nela”. O verbo evoca pernoitar ou alojar-se. “Retidão” também pode ser traduzido por “justiça” neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיכָה
  choice: Como
  rationale: Introduz uma exclamação de lamento diante de uma transformação chocante, não uma pergunta informativa.
- source_word: הָיְתָה לְזוֹנָה
  choice: se tornou prostituta
  rationale: Expressa a mudança consumada de condição e preserva de modo claro a forte metáfora hebraica.
- source_word: קִרְיָה נֶאֱמָנָה
  choice: a cidade fiel
  rationale: Mantém a personificação feminina de Jerusalém e o contraste moral entre sua fidelidade anterior e a corrupção presente.
- source_word: מְלֵאֲתִי מִשְׁפָּט
  choice: Ela estava cheia de justiça
  rationale: Supre naturalmente o sujeito personificado em português e traduz מִשְׁפָּט como a ordem social e judicial correta.
- source_word: צֶדֶק
  choice: a retidão
  rationale: Distingue o termo de מִשְׁפָּט sem negar sua sobreposição semântica com justiça, preservando sua dimensão ética.
- source_word: יָלִין בָּהּ
  choice: nela passava a noite
  rationale: Conserva a imagem vívida do verbo hebraico, que literalmente evoca pernoitar ou alojar-se, aplicada metaforicamente à retidão.
- source_word: וְעַתָּה מְרַצְּחִים
  choice: mas agora, assassinos
  rationale: Explicita o contraste e preserva a construção nominal elíptica e abrupta do hebraico, sem acrescentar um verbo ausente.
theological_decisions:
- issue: Linguagem sexual metafórica sobre a infidelidade de Jerusalém
  choice: se tornou prostituta
  alternative: se tornou infiel
  rationale: O texto hebraico emprega explicitamente a prostituição como imagem da corrupção moral e da infidelidade da cidade; substituí-la por uma abstração enfraqueceria a força profética.
- issue: Relação semântica entre מִשְׁפָּט e צֶדֶק
  choice: justiça; retidão
  alternative: justiça; justiça
  rationale: A tradução distingue os termos em português, mas a nota reconhece sua sobreposição, evitando impor uma separação teológica rígida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva a exclamação de lamento, a personificação feminina da cidade, a metáfora contundente e a concisão abrupta da cláusula final.
