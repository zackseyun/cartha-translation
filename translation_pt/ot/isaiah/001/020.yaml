id: ISA.1.20
reference: Isaiah 1:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אִם תְּמָאֲנ֖וּ וּ/מְרִיתֶ֑ם חֶ֣רֶב תְּאֻכְּל֔וּ כִּ֛י פִּ֥י יְהוָ֖ה דִּבֵּֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/020.yaml
  text: But if you refuse and rebel[a], you will be devoured by the sword; for the mouth of Yahweh has spoken.
translation:
  language: pt
  text: Mas, se vocês se recusarem e se rebelarem, serão devorados pela espada[a], pois a boca de Yahweh falou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “serão comidos pela espada”. A formulação cria um contraste deliberado com o versículo anterior: os obedientes “comerão o melhor da terra”, mas os rebeldes serão comidos pela espada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Expressa a condição e o contraste com a promessa do versículo anterior de maneira natural em português.
- source_word: תְּמָאֲנוּ
  choice: vocês se recusarem
  rationale: Preserva a ideia direta de recusa ou falta deliberada de disposição.
- source_word: וּמְרִיתֶם
  choice: e se rebelarem
  rationale: Comunica a resistência ativa e desafiadora indicada por מרה.
- source_word: חֶרֶב
  choice: pela espada
  rationale: Mantém a imagem profética concreta da espada como instrumento de juízo violento.
- source_word: תְּאֻכְּלוּ
  choice: serão devorados
  rationale: É uma formulação idiomática em português que conserva a voz passiva e a inversão do verbo 'comer' em relação ao versículo 19.
- source_word: כִּי
  choice: pois
  rationale: Introduz a confirmação solene que fundamenta a advertência.
- source_word: פִּי יְהוָה
  choice: a boca de Yahweh
  rationale: Preserva a imagem antropomórfica hebraica e enfatiza que a declaração procede do próprio Deus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em conformidade com a prática do projeto.
- source_word: דִּבֵּר
  choice: falou
  rationale: Reproduz de modo simples e solene a fórmula profética que afirma a autoridade e a certeza da palavra divina.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; 'Yahweh' preserva o nome pactual sem substituí-lo por um título.
- issue: Agência na expressão 'a espada os devorará'
  choice: serão devorados pela espada
  alternative: a espada os devorará
  rationale: Mantém a construção passiva do hebraico sem reduzir a espada a uma simples abstração como 'guerra'.
translation_notes:
  register: Português atual, claro e solene, com 'vocês' para o plural. A imagem concreta 'a boca de Yahweh' e o jogo verbal com 'comer' foram preservados, recorrendo-se a uma nota para explicitar a forma literal.
