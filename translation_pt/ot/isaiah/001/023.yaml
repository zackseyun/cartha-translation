  text: שָׂרַ֣יִ/ךְ סוֹרְרִ֗ים וְ/חַבְרֵי֙ גַּנָּבִ֔ים כֻּלּ/וֹ֙ אֹהֵ֣ב שֹׁ֔חַד וְ/רֹדֵ֖ף שַׁלְמֹנִ֑ים יָתוֹם֙ לֹ֣א יִשְׁפֹּ֔טוּ וְ/רִ֥יב אַלְמָנָ֖ה לֹֽא יָב֥וֹא אֲלֵי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/023.yaml
  text: Your rulers are rebels and companions of thieves[a]; every one of them loves a bribe and runs after payments. They do not defend the orphan[c][b], and the widow’s case does not come before them.
translation:
  language: pt
  text: Seus governantes são rebeldes e companheiros de ladrões[a]; cada um deles ama o suborno e corre atrás de pagamentos[b]. Não fazem justiça ao órfão[c], e a causa da viúva não chega até eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Seus príncipes são rebeldes e aliados de ladrões”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “corre atrás de recompensas” ou “de presentes”; o termo hebraico pode indicar pagamentos ou retribuições, provavelmente em um contexto de corrupção.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “Não defendem o órfão” ou “Não julgam a causa do órfão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרַיִךְ
  choice: seus governantes
  rationale: שַׂר designa um líder, governante ou alto funcionário. “Governantes” é atual, claro e adequado ao contexto cívico, sem a conotação dinástica que “príncipes” pode sugerir.
- source_word: סוֹרְרִים
  choice: rebeldes
  rationale: O termo expressa resistência obstinada e rebelião. “Rebeldes” conserva de modo conciso a força moral e política da acusação.
- source_word: וְחַבְרֵי גַּנָּבִים
  choice: e companheiros de ladrões
  rationale: A expressão indica associação ou cumplicidade com ladrões. “Companheiros de ladrões” preserva a formulação direta e acusatória do hebraico.
- source_word: כֻּלּוֹ
  choice: cada um deles
  rationale: Embora a forma hebraica seja singular, seu sentido no contexto é distributivo em relação ao grupo dos governantes. “Cada um deles” torna essa distribuição explícita e natural em português.
- source_word: אֹהֵב שֹׁחַד
  choice: ama o suborno
  rationale: שֹׁחַד é suborno. O singular genérico em “ama o suborno” expressa afeição habitual pela prática corrupta.
- source_word: וְרֹדֵף שַׁלְמֹנִים
  choice: e corre atrás de pagamentos
  rationale: רֹדֵף transmite perseguição insistente, bem representada por “corre atrás”. שַׁלְמֹנִים pode indicar pagamentos, recompensas ou presentes, aqui provavelmente ligados à corrupção; “pagamentos” preserva a relativa amplitude do termo.
- source_word: יָתוֹם לֹא יִשְׁפֹּטוּ
  choice: Não fazem justiça ao órfão
  rationale: No contexto judicial, שׁפט pode significar julgar ou assegurar justiça. A formulação escolhida comunica que os governantes negam proteção judicial ao órfão, sem sugerir que deveriam julgá-lo como acusado.
- source_word: וְרִיב אַלְמָנָה
  choice: e a causa da viúva
  rationale: רִיב pode designar disputa, queixa ou causa judicial. “A causa da viúva” é natural e mantém o cenário jurídico.
- source_word: לֹא יָבוֹא אֲלֵיהֶם
  choice: não chega até eles
  rationale: A expressão diz literalmente que a causa não vem até eles. “Não chega até eles” mantém a imagem e indica que a reivindicação da viúva não recebe consideração judicial.
