  text: רַחֲצוּ֙ הִזַּכּ֔וּ הָסִ֛ירוּ רֹ֥עַ מַעַלְלֵי/כֶ֖ם מִ/נֶּ֣גֶד עֵינָ֑/י חִדְל֖וּ הָרֵֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/016.yaml
  text: Wash yourselves[a]; make yourselves clean. Remove the evil of your deeds from before my eyes[b]. Stop doing evil.
translation:
  language: pt
  text: Lavem-se[a] e fiquem limpos. Retirem de diante dos meus olhos[b] a maldade de suas ações. Parem de fazer o mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Purifiquem-se”. O verbo hebraico pode transmitir a ideia de tornar-se limpo ou puro.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “de diante dos meus olhos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַחֲצוּ
  choice: Lavem-se
  rationale: O imperativo plural de רחץ é empregado aqui em sentido reflexivo e metafórico. “Lavem-se” conserva a imagem concreta e a força da exortação moral.
- source_word: הִזַּכּוּ
  choice: fiquem limpos
  rationale: O imperativo hitpael comunica tornar-se limpo ou puro. “Fiquem limpos” é natural em português, preserva o paralelismo com “Lavem-se” e evita tornar a expressão indevidamente ritual.
- source_word: הָסִירוּ
  choice: Retirem
  rationale: O imperativo causativo de סור pede que o mal seja removido. “Retirem” é direto e combina naturalmente com o complemento introduzido por “de diante”.
- source_word: רֹעַ מַעַלְלֵיכֶם
  choice: a maldade de suas ações
  rationale: רֹעַ designa o mal ou a maldade, e מַעַלְלֵיכֶם, os atos ou práticas dos destinatários. A formulação expressa com clareza que são suas ações que têm caráter mau.
- source_word: מִנֶּגֶד עֵינַי
  choice: de diante dos meus olhos
  rationale: Reproduz de perto a imagem hebraica “de diante dos meus olhos”, mantendo seu caráter vívido e antropomórfico.
- source_word: חִדְלוּ הָרֵעַ
  choice: Parem de fazer o mal
  rationale: חדל seguido da forma verbal de רעע significa cessar de agir mal. A tradução é clara, atual e mantém a força do imperativo.
theological_decisions:
- issue: Linguagem de lavagem e limpeza moral
  choice: Preservar a imagem de lavar-se e ficar limpo como chamado ao arrependimento ético.
  alternative: Empregar linguagem mais explicitamente ritual, como “purifiquem-se”.
  rationale: O contexto imediato denuncia a conduta pecaminosa de Judá e exige mudança de ações. A tradução conserva a metáfora sem impor um sentido sacramental ou técnico que o versículo não especifica.
translation_notes:
  register: Português moderno, claro e digno, com formas plurais amplamente compreensíveis. A sequência curta de imperativos preserva o ritmo incisivo do hebraico. A expressão literal marcada pela nota b foi mantida no texto principal por sua força imagética.
