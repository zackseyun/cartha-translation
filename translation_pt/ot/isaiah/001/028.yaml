base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/028.yaml
  text: But rebels and sinners will be broken together[b][a], and those who forsake Yahweh will come to an end.
translation:
  language: pt
  text: Mas os rebeldes e os pecadores serão destruídos juntos[a], e os que abandonam Yahweh chegarão ao fim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, com construção nominal: “a ruína dos rebeldes e dos pecadores, juntos”. O hebraico emprega o substantivo “quebra”, “ruína” ou “destruição”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “perecerão” ou “serão consumidos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁבֶר
  choice: serão destruídos
  rationale: O substantivo expressa quebra, ruína ou destruição. A formulação verbal é natural em português e comunica o destino dos dois grupos, enquanto a nota preserva a estrutura nominal do hebraico.
- source_word: פֹּשְׁעִים
  choice: os rebeldes
  rationale: O termo designa pessoas em revolta ou desafio deliberado; “rebeldes” é claro e preserva essa força.
- source_word: חַטָּאִים
  choice: os pecadores
  rationale: Designa aqueles caracterizados pelo pecado. “Pecadores” mantém a distinção em relação à rebelião deliberada expressa pelo termo anterior.
- source_word: יַחְדָּו
  choice: juntos
  rationale: Indica que os dois grupos terão um destino comum ou simultâneo.
- source_word: עֹזְבֵי יְהוָה
  choice: os que abandonam Yahweh
  rationale: O particípio de עזב descreve os que deixam ou abandonam Yahweh. “Abandonam” é corrente, direto e conserva a gravidade relacional da expressão.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יִכְלוּ
  choice: chegarão ao fim
  rationale: O verbo pode significar acabar, ser consumido ou perecer. “Chegarão ao fim” preserva a amplitude sem especificar indevidamente a forma do juízo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
- issue: Natureza do destino dos rebeldes e pecadores
  choice: serão destruídos
  alternative: a destruição dos rebeldes e dos pecadores
  rationale: A tradução verbal comunica naturalmente em português o valor predicativo da frase, sem definir além do texto o modo dessa destruição; a alternativa nominal é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Os artigos antes de “rebeldes” e “pecadores” tornam a coordenação idiomática. “Yahweh” mantém o nome divino, e as notas preservam as principais alternativas lexicais e a estrutura nominal do primeiro segmento.
