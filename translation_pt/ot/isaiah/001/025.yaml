base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/025.yaml
  text: I will turn my hand against you[a], and I will smelt away your dross as with lye[c][b], and remove all your alloy.
translation:
  language: pt
  text: Voltarei a minha mão contra você[a] e eliminarei, como com álcali[b], as suas escórias; removerei toda a sua liga metálica[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «sobre você». A expressão hebraica pode introduzir uma ação punitiva ou uma intervenção purificadora; aqui, a imagem do refino indica juízo com propósito de purificação.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico se refere a uma substância alcalina usada na limpeza ou depuração; também se pode traduzir por «potassa» ou «sabão».
    reason: lexical_alternative
  - marker: c
    text: Ou «todo o seu estanho» ou «todos os seus metais inferiores». O hebraico pode indicar especificamente estanho ou, de modo mais geral, metais inferiores misturados a uma liga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָשִׁיבָה
  choice: Voltarei
  rationale: O hifil de שוב, unido à expressão «minha mão contra/sobre você», indica voltar ou dirigir a mão para agir, não restaurar.
- source_word: יָדִי
  choice: a minha mão
  rationale: Mantém a imagem antropomórfica hebraica da ação e do poder divinos.
- source_word: עָלַיִךְ
  choice: contra você
  rationale: Embora על também possa significar «sobre», o contexto judicial favorece «contra», sem ocultar na nota a possível nuance de intervenção purificadora.
- source_word: וְאֶצְרֹף
  choice: refinarei e eliminarei
  rationale: צרף pertence ao campo metalúrgico de fundir/refinar. A formulação portuguesa explicita o resultado de remover as impurezas sem abandonar a metáfora do refino.
- source_word: כַּבֹּר
  choice: como com álcali
  rationale: בֹּר designa uma substância alcalina usada para limpar ou depurar; «como com» preserva a comparação introduzida por כ.
- source_word: סִיגָיִךְ
  choice: as suas escórias
  rationale: סיגים são escórias ou impurezas metálicas; «escórias» conserva a imagem profética do refino.
- source_word: וְאָסִירָה
  choice: e removerei
  rationale: O hifil de סור significa fazer retirar, afastar ou remover.
- source_word: כָּל
  choice: toda
  rationale: Expressa diretamente a totalidade indicada pelo hebraico.
- source_word: בְּדִילָיִךְ
  choice: a sua liga metálica
  rationale: בדיל pode designar especificamente estanho ou, no contexto, metal inferior misturado ao metal precioso; «liga metálica» comunica essa segunda possibilidade com clareza.
theological_decisions:
- issue: Natureza da ação divina
  choice: Juízo que atua como disciplina purificadora
  alternative: Juízo puramente destrutivo ou ação puramente restauradora
  rationale: O gesto adversativo da mão e as imagens de refino e remoção unem severidade e purificação. A tradução conserva essa tensão em vez de reduzir o texto a destruição ou restauração apenas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O tratamento por «você» reproduz a segunda pessoa feminina singular dirigida a Sião/Jerusalém sem recorrer ao registro regional de «tu». A terminologia metalúrgica é preservada e esclarecida por notas.
