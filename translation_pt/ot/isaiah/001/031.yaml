  text: וְ/הָיָ֤ה הֶ/חָסֹן֙ לִ/נְעֹ֔רֶת וּ/פֹעֲל֖/וֹ לְ/נִיצ֑וֹץ וּ/בָעֲר֧וּ שְׁנֵי/הֶ֛ם יַחְדָּ֖ו וְ/אֵ֥ין מְכַבֶּֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/031.yaml
  text: The strong man will become tinder[a], and his work a spark; both of them will burn together, with no one to quench them.
translation:
  language: pt
  text: O poderoso se tornará estopa[a], e sua obra será uma faísca; ambos arderão juntos, sem ninguém para apagá-los.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fibras de linho soltas”, que se inflamam facilmente.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָסֹן
  choice: o forte
  rationale: O termo substantivado designa alguém forte ou poderoso. “O forte” preserva o singular e a força pessoal do hebraico sem restringir o referente à riqueza.
- source_word: לִנְעֹרֶת
  choice: em estopa
  rationale: O substantivo indica fibras soltas ou resíduos fibrosos, especialmente de linho, que pegam fogo com facilidade. “Estopa” conserva a imagem concreta; a função de material inflamável é esclarecida em nota.
- source_word: וּפֹעֲלוֹ
  choice: e a sua obra
  rationale: פֹּעַל pode significar obra, ação ou produto. “Sua obra” mantém essa amplitude e liga naturalmente o sufixo singular ao forte.
- source_word: לְנִיצוֹץ
  choice: em faísca
  rationale: O termo designa uma faísca ou partícula incandescente. “Faísca” reproduz diretamente a imagem que inicia a combustão.
- source_word: וּבָעֲרוּ
  choice: arderão
  rationale: O verbo expressa queimar ou arder. “Arderão” é natural e vívido, sem acrescentar uma intensidade ausente do texto.
- source_word: שְׁנֵיהֶם יַחְדָּו
  choice: ambos ... juntos
  rationale: A formulação preserva a ênfase hebraica na destruição conjunta do forte e de sua obra.
- source_word: וְאֵין מְכַבֶּה
  choice: e não haverá quem os apague
  rationale: A construção com אֵין e particípio indica a inexistência de alguém que extinga o fogo. O pronome “os” retoma conjuntamente o forte e sua obra.
theological_decisions:
- issue: Referente do possessivo singular em “a sua obra”
  choice: O possessivo refere-se ao forte; tanto ele quanto sua obra ficam sujeitos ao mesmo juízo.
  alternative: Entender o possessivo coletivamente como referência às obras da classe dos fortes ou poderosos.
  rationale: O sufixo hebraico singular remete mais naturalmente ao sujeito singular הֶחָסֹן e sustenta o paralelismo entre a pessoa e aquilo que ela fez ou produziu.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem poética foi mantida, e “estopa” preserva a figura material do hebraico, acompanhada de explicação para leitores que desconheçam o termo.
