id: ISA.1.29
reference: Isaiah 1:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י יֵבֹ֔שׁוּ מֵ/אֵילִ֖ים אֲשֶׁ֣ר חֲמַדְתֶּ֑ם וְ/תַ֨חְפְּר֔וּ מֵ/הַ/גַּנּ֖וֹת אֲשֶׁ֥ר בְּחַרְתֶּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/029.yaml
  text: For you will be ashamed of the oaks that you desired[a], and you will be disgraced because of the gardens that you chose.
translation:
  language: pt
  text: Pois vocês se envergonharão[a] dos carvalhos[b] que desejaram e ficarão humilhados por causa dos jardins que escolheram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “eles se envergonharão”; o restante do versículo emprega “vocês”.'
    reason: grammatical_ambiguity
  - marker: b
    text: Ou “terebintos”; o hebraico pode se referir a grandes árvores associadas a locais de culto ilícito.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ligada ao contexto anterior e mantém de modo natural a força explicativa da conjunção hebraica.
- source_word: יֵבֹשׁוּ
  choice: vocês se envergonharão
  rationale: בוש expressa vergonha ou decepção. Embora a forma massorética seja de terceira pessoa do plural, o restante do versículo se dirige explicitamente à segunda pessoa do plural; a tradução segue essa continuidade discursiva e registra a diferença gramatical em nota.
- source_word: מֵאֵילִים
  choice: dos carvalhos
  rationale: אֵילִים designa aqui, com maior probabilidade, árvores grandes associadas a locais de culto, em paralelo com os jardins. 'Carvalhos' é claro e tradicional, enquanto a possível identificação como terebintos é preservada em nota.
- source_word: אֲשֶׁר חֲמַדְתֶּם
  choice: que desejaram
  rationale: חמד indica desejo intenso ou prazer; 'desejaram' preserva a amplitude do termo sem acrescentar a ideia mais específica de cobiça.
- source_word: וְתַחְפְּרוּ
  choice: e ficarão humilhados
  rationale: חפר pode significar ficar confundido, envergonhado ou humilhado. A escolha distingue o verbo de בוש sem apagar a proximidade semântica entre ambos.
- source_word: מֵהַגַּנּוֹת
  choice: por causa dos jardins
  rationale: Depois de um verbo de vergonha, מִן indica o motivo ou objeto dessa vergonha. 'Por causa de' explicita essa relação em português corrente.
- source_word: אֲשֶׁר בְּחַרְתֶּם
  choice: que escolheram
  rationale: בחר significa escolher e ressalta a ação deliberada dos destinatários.
theological_decisions:
- issue: Natureza dos carvalhos e dos jardins
  choice: Manter no texto principal as imagens concretas de árvores e jardins, sem acrescentar explicitamente 'sagrados' ou 'idólatras'.
  alternative: Explicitar que se trata de árvores sagradas e jardins usados em culto ilícito.
  rationale: O contexto profético sugere fortemente locais ligados ao culto ilícito, mas esses qualificativos não aparecem de forma expressa neste versículo. A tradução preserva a imagem e evita transformar a inferência contextual em afirmação textual.
- issue: Alternância entre terceira e segunda pessoa do plural
  choice: Usar a segunda pessoa do plural no texto principal, com nota sobre a forma hebraica.
  alternative: 'Traduzir literalmente: ''eles se envergonharão... que vocês desejaram''.'
  rationale: A continuação do versículo contém verbos explícitos na segunda pessoa do plural, favorecendo a leitura discursiva dirigida aos mesmos destinatários. A nota conserva a tensão gramatical do texto massorético sem impor silenciosamente uma harmonização.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais sem o pronome repetido na segunda oração. 'Carvalhos' oferece leitura acessível; a incerteza botânica e a provável associação cultual ficam registradas em nota.
