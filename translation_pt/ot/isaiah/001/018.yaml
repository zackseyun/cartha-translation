  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לְכוּ נָ֛א וְ/נִוָּֽכְחָ֖ה יֹאמַ֣ר יְהוָ֑ה אִם יִֽהְי֨וּ חֲטָאֵי/כֶ֤ם כַּ/שָּׁנִים֙ כַּ/שֶּׁ֣לֶג יַלְבִּ֔ינוּ אִם יַאְדִּ֥ימוּ כַ/תּוֹלָ֖ע כַּ/צֶּ֥מֶר יִהְיֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/018.yaml
  text: 'Come now[a], and let us reason together, says Yahweh: though your sins are like scarlet, they will become white like snow; though they are red like crimson[b], they will become like wool.'
translation:
  language: pt
  text: “Venham agora, e vamos resolver a questão[a]”, diz Yahweh. “Ainda que os pecados de vocês sejam como o escarlate, ficarão brancos como a neve; ainda que sejam vermelhos como o carmesim[b], ficarão como a lã.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “vamos argumentar”, “vamos discutir o caso” ou “vamos resolver a questão”. O verbo hebraico tem matizes jurídicos e dialogais.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “como o verme” ou “como o corante do verme”; a expressão alude ao carmesim produzido a partir de um inseto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ נָא
  choice: Venham, pois
  rationale: O imperativo plural לְכוּ funciona idiomaticamente como convite ou convocação, e נָא acrescenta insistência moderada. “Venham, pois” soa natural e mantém a força exortativa.
- source_word: וְנִוָּכְחָה
  choice: e vamos discutir a questão
  rationale: 'A forma de יכח tem matizes dialogais e forenses: apresentar razões, debater ou resolver uma causa. A tradução conserva o cenário de controvérsia judicial sem sugerir uma conversa meramente abstrata.'
- source_word: יֹאמַר יְהוָה
  choice: diz Yahweh
  rationale: O presente reproduz naturalmente a fórmula profética, e “Yahweh” representa diretamente o nome divino יהוה.
- source_word: אִם יִהְיוּ חֲטָאֵיכֶם
  choice: ainda que os pecados de vocês sejam
  rationale: Neste paralelismo, אִם tem força concessiva. “Ainda que” comunica melhor essa relação que um simples “se”.
- source_word: כַּשָּׁנִים
  choice: como o escarlate
  rationale: שָׁנִים designa a viva cor ou matéria corante escarlate. A escolha é concisa e preserva o contraste cromático com a neve.
- source_word: כַּשֶּׁלֶג יַלְבִּינוּ
  choice: ficarão brancos como a neve
  rationale: O verbo לבן expressa o resultado de tornar-se branco. “Ficarão brancos” comunica claramente a transformação.
- source_word: אִם יַאְדִּימוּ
  choice: ainda que sejam vermelhos
  rationale: A expressão descreve a intensa vermelhidão dos pecados e corresponde à construção concessiva da primeira metade.
- source_word: כַּתּוֹלָע
  choice: como a púrpura
  rationale: תּוֹלָע refere-se literalmente ao inseto associado à produção de um corante carmesim. “Púrpura” fornece em português uma imagem cromática clara, enquanto a associação literal é preservada em nota.
- source_word: כַּצֶּמֶר יִהְיוּ
  choice: ficarão como a lã
  rationale: A formulação mantém a comparação hebraica sem acrescentar “brancos”, cor já subentendida pelo paralelismo com a neve.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o tetragrama. “Yahweh” preserva o nome pessoal da aliança em vez de substituí-lo por um título.
- issue: Força da promessa nas duas orações introduzidas por אִם
  choice: 'concessiva: “ainda que... ficarão”'
  alternative: 'condicional: “se... ficarão”'
  rationale: O paralelismo e o contraste retórico favorecem uma concessão, sem fazer da purificação mera incerteza hipotética.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. A fala direta torna clara a estrutura do pronunciamento divino. A escolha “discutir a questão” evita o possível sentido excessivamente intelectual de “raciocinar juntos” e preserva a dimensão forense do hebraico.
