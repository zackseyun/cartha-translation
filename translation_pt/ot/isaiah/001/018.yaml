  terminology: “Escarlate”, “brancos como a neve”, “carmesim” e “lã” preservam adequadamente o paralelismo cromático. A nota deve identificar תּוֹלָע como inseto/corante associado ao carmesim, sem a alternativa imprecisa “púrpura”.
