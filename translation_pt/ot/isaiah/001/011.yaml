  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/מָּה לִּ֤/י רֹב זִבְחֵי/כֶם֙ יֹאמַ֣ר יְהוָ֔ה שָׂבַ֛עְתִּי עֹל֥וֹת אֵילִ֖ים וְ/חֵ֣לֶב מְרִיאִ֑ים וְ/דַ֨ם פָּרִ֧ים וּ/כְבָשִׂ֛ים וְ/עַתּוּדִ֖ים לֹ֥א חָפָֽצְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/011.yaml
  text: Why are your many sacrifices to me? says Yahweh[a]. I have had enough of burnt offerings of rams and the fat of fattened animals[b]; and in the blood of bulls and lambs and goats I do not delight.
translation:
  language: pt
  text: “Para que me serve a multidão dos seus sacrifícios?”, diz Yahweh.[a] “Estou farto dos holocaustos de carneiros e da gordura de animais cevados; não tenho prazer no sangue de touros, cordeiros e bodes.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, “Por que para mim a multidão dos seus sacrifícios?”. Também pode ser traduzido: “Por que me oferecem tantos sacrifícios?”.'
    reason: lexical_alternative
  - marker: b
    text: “Bodes” traduz um termo que se refere especificamente a caprinos machos.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה לִּי
  choice: Para que me serve...?
  rationale: A expressão combina literalmente ‘por quê?’ com ‘para mim’, formando uma pergunta retórica sobre a utilidade ou o valor dos sacrifícios para Yahweh. A formulação portuguesa é natural e preserva essa força sem transformar a pergunta em mera afirmação.
- source_word: רֹב זִבְחֵיכֶם
  choice: a multidão dos seus sacrifícios
  rationale: רֹב indica grande quantidade ou abundância, e זִבְחֵיכֶם designa os sacrifícios oferecidos pelo povo. ‘Multidão’ mantém a ênfase quantitativa e o tom solene.
- source_word: יֹאמַר יְהוָה
  choice: diz Yahweh
  rationale: יֹאמַר integra a fórmula profética, bem representada por ‘diz’; o nome divino é transliterado como ‘Yahweh’, preservando o nome próprio presente no hebraico.
- source_word: שָׂבַעְתִּי
  choice: Estou farto
  rationale: O verbo comunica estar saciado ou cheio até o excesso. ‘Estou farto’ expressa de modo conciso tanto a saturação quanto a forte rejeição contextual.
- source_word: עֹלוֹת אֵילִים
  choice: holocaustos de carneiros
  rationale: עֹלוֹת é o termo sacrificial para ofertas inteiramente queimadas, tradicionalmente e precisamente designadas em português como ‘holocaustos’; אֵילִים significa ‘carneiros’.
- source_word: חֵלֶב מְרִיאִים
  choice: a gordura de animais cevados
  rationale: חֵלֶב é ‘gordura’, enquanto מְרִיאִים se refere a animais bem alimentados ou engordados. ‘Animais cevados’ é claro, digno e adequado ao contexto sacrificial.
- source_word: דַם פָּרִים וּכְבָשִׂים וְעַתּוּדִים
  choice: o sangue de touros, cordeiros e bodes
  rationale: A enumeração conserva as três categorias de animais. כְבָשִׂים pode designar cordeiros ou ovinos, e עַתּוּדִים refere-se mais especificamente a bodes, isto é, caprinos machos.
- source_word: לֹא חָפָצְתִּי
  choice: não tenho prazer
  rationale: חפץ pode expressar prazer, agrado ou desejo. ‘Não tenho prazer’ preserva a avaliação divina sem sugerir que o problema seja apenas uma preferência emocional.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. ‘Yahweh’ preserva o nome próprio e evita substituí-lo por um título.
- issue: Alcance da rejeição dos sacrifícios
  choice: Manter a declaração contextual sem acrescentar que todo sacrifício é rejeitado em si mesmo
  alternative: Parafrasear como uma abolição universal do culto sacrificial
  rationale: O versículo denuncia os sacrifícios do público interpelado no contexto profético. A tradução não deve resolver além do texto a tensão entre o culto prescrito e o culto aqui rejeitado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. ‘Holocaustos’ é mantido como termo sacrificial estabelecido; ‘Estou farto’ comunica com naturalidade a intensidade da repreensão profética. Os marcadores [a] e [b] aparecem no texto principal.
