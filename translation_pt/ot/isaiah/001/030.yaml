  text: כִּ֣י תִֽהְי֔וּ כְּ/אֵלָ֖ה נֹבֶ֣לֶת עָלֶ֑/הָ וּֽ/כְ/גַנָּ֔ה אֲשֶׁר מַ֖יִם אֵ֥ין לָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/030.yaml
  text: For you will be like an oak whose leaf withers[a], and like a garden that has no water.
translation:
  language: pt
  text: Pois vocês serão como um carvalho cuja folha murcha[a] e como um jardim que não tem água.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como um terebinto cuja folha murcha”. O termo hebraico אֵלָה pode designar um terebinto ou um carvalho; não se sabe ao certo qual é a espécie.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou consequência ligada ao juízo do contexto anterior; “Pois” preserva essa conexão de modo natural.
- source_word: תִהְיוּ
  choice: vocês serão
  rationale: O imperfeito qal na segunda pessoa masculina plural tem aqui sentido futuro ou resultativo; a forma escolhida é clara e corrente.
- source_word: כְאֵלָה
  choice: como um carvalho
  rationale: אֵלָה pode designar carvalho ou terebinto. “Carvalho” oferece uma imagem reconhecível, enquanto a incerteza da espécie é preservada em nota.
- source_word: נֹבֶלֶת
  choice: murcha
  rationale: O particípio de נבל descreve a folha que murcha ou perde o viço; em português, a oração relativa expressa isso com naturalidade.
- source_word: עָלֶהָ
  choice: cuja folha
  rationale: Mantém o substantivo singular e o vínculo possessivo do hebraico, literalmente “sua folha”.
- source_word: וּכְגַנָּה
  choice: e como um jardim
  rationale: גַּנָּה indica um jardim ou área cultivada cercada; “jardim” é o equivalente mais direto e compreensível.
- source_word: אֲשֶׁר מַיִם אֵין לָהּ
  choice: que não tem água
  rationale: Expressa de maneira idiomática a construção hebraica, literalmente “para o qual não há água”, preservando a imagem de privação.
- source_word: מַיִם
  choice: água
  rationale: Embora tenha forma plural em hebraico, מַיִם é o termo comum para “água” e pede singular massivo em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura paralela das duas comparações e o singular “folha” foram preservados.
