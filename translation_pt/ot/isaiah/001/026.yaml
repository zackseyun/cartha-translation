id: ISA.1.26
reference: Isaiah 1:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אָשִׁ֤יבָה שֹׁפְטַ֨יִ/ךְ֙ כְּ/בָ/רִ֣אשֹׁנָ֔ה וְ/יֹעֲצַ֖יִ/ךְ כְּ/בַ/תְּחִלָּ֑ה אַחֲרֵי כֵ֗ן יִקָּ֤רֵא לָ/ךְ֙ עִ֣יר הַ/צֶּ֔דֶק קִרְיָ֖ה נֶאֱמָנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/026.yaml
  text: And I will restore your judges as at the first[a], and your counselors as at the beginning. Afterward you will be called the city of righteousness, a faithful city.
translation:
  language: pt
  text: Restaurarei os seus juízes como no princípio e os seus conselheiros como no começo. Depois disso, você será chamada cidade de retidão[a], cidade fiel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cidade de justiça”.'
    reason: Alternativa lexical para צֶדֶק, que pode destacar especialmente a justiça no âmbito cívico e judicial.
lexical_decisions:
- source_word: וְאָשִׁיבָה
  choice: Restaurarei
  rationale: O hifil de שׁוב tem sentido causativo, “fazer voltar” ou “restaurar”. “Restaurarei” comunica de modo natural o restabelecimento de uma liderança adequada.
- source_word: שֹׁפְטַיִךְ
  choice: os seus juízes
  rationale: שֹׁפֵט designa normalmente um juiz, embora no contexto também possa abranger uma função governamental. “Juízes” preserva o sentido lexical direto.
- source_word: כְּבָרִאשֹׁנָה
  choice: como no princípio
  rationale: A expressão compara a restauração com uma condição anterior ideal, sem identificar um período histórico específico.
- source_word: וְיֹעֲצַיִךְ
  choice: os seus conselheiros
  rationale: A forma derivada de יעץ refere-se aos que dão conselho. “Conselheiros” é claro e mantém o paralelismo com “juízes”.
- source_word: כְּבַתְּחִלָּה
  choice: como no começo
  rationale: A tradução conserva o paralelismo temporal com a frase anterior e a distinção vocabular presente no hebraico.
- source_word: אַחֲרֵי כֵן
  choice: Depois disso
  rationale: A expressão introduz o estado resultante que se seguirá à restauração anunciada.
- source_word: יִקָּרֵא לָךְ
  choice: você será chamada
  rationale: O nifal de קרא expressa ser chamada ou denominada. O feminino singular mantém a personificação da cidade e o discurso direto dirigido a ela.
- source_word: עִיר הַצֶּדֶק
  choice: cidade de retidão
  rationale: צֶדֶק pode denotar justiça, retidão e conformidade moral. “Retidão” preserva aqui o caráter moral amplo da cidade restaurada, sem limitar a expressão à administração judicial.
- source_word: קִרְיָה נֶאֱמָנָה
  choice: cidade fiel
  rationale: קִרְיָה é um sinônimo poético de “cidade”, e נֶאֱמָנָה indica fidelidade ou confiabilidade. “Cidade fiel” mantém a concisão e o contraste com Isaías 1:21.
theological_decisions:
- issue: Sentido de צֶדֶק no retrato da cidade restaurada
  choice: retidão
  alternative: justiça
  rationale: O termo abrange tanto justiça cívica quanto integridade moral e relacional. “Retidão” foi escolhida no texto para preservar essa amplitude; “justiça” continua sendo uma leitura lexical legítima e é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O pronome “você” torna explícito o discurso direto feminino dirigido à cidade personificada. O paralelismo poético entre “no princípio” e “no começo” foi preservado, assim como a repetição de “cidade”.
