  text: כַּסְפֵּ֖/ךְ הָיָ֣ה לְ/סִיגִ֑ים סָבְאֵ֖/ךְ מָה֥וּל בַּ/מָּֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/022.yaml
  text: Your silver has become dross[a]; your wine is diluted with water.
translation:
  language: pt
  text: Sua prata tornou-se escória; sua bebida[a] está diluída com água.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu vinho” ou “sua bebida forte”. O termo hebraico pode referir-se a uma bebida alcoólica, mas não identifica com certeza qual tipo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּסְפֵּךְ
  choice: sua prata
  rationale: כֶּסֶף designa aqui o metal, não simplesmente dinheiro; “prata” preserva a imagem metalúrgica em paralelo com “escória”. O sufixo feminino singular dirige a acusação a Sião/Jerusalém.
- source_word: הָיָה לְסִיגִים
  choice: tornou-se escória
  rationale: A construção expressa a passagem a um estado corrompido. “Tornou-se” comunica o resultado, e “escória” mantém a metáfora das impurezas ou resíduos do refino.
- source_word: סָבְאֵךְ
  choice: sua bebida
  rationale: סֹבֶא refere-se a bebida alcoólica, possivelmente vinho ou bebida forte. “Bebida” evita restringir indevidamente o termo, enquanto a nota registra as opções mais específicas.
- source_word: מָהוּל בַּמָּיִם
  choice: foi diluída com água
  rationale: מָהוּל indica algo misturado ou diluído; no contexto de adulteração e perda de qualidade, “diluída” transmite com clareza a força negativa. A preposição בְּ é adequadamente expressa por “com”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura paralela concisa. A formulação conserva as duas imagens de deterioração — prata convertida em escória e bebida adulterada com água — e mantém em nota a amplitude lexical de סֹבֶא.
