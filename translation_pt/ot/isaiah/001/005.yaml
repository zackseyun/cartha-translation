source:
  edition: WLC
  text: עַ֣ל מֶ֥ה תֻכּ֛וּ ע֖וֹד תּוֹסִ֣יפוּ סָרָ֑ה כָּל רֹ֣אשׁ לָ/חֳלִ֔י וְ/כָל לֵבָ֖ב דַּוָּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/005.yaml
  text: Why should you be struck again? You continue in rebellion. The whole head is sick[a], and the whole heart is faint.
translation:
  language: pt
  text: Por que vocês seriam golpeados outra vez?[a] Vocês persistem na rebeldia. A cabeça inteira está doente, e todo o coração está debilitado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Em que parte vocês seriam golpeados outra vez?” O hebraico também pode ser entendido como uma pergunta sobre onde ainda poderiam cair novos golpes, visto que o corpo inteiro está enfermo.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַל מֶה
  choice: Por que
  rationale: A expressão introduz naturalmente uma pergunta retórica sobre a razão ou finalidade de novos golpes; em português atual, “Por que” transmite essa força sem rigidez literal.
- source_word: תֻכּוּ עוֹד
  choice: vocês ainda seriam golpeados
  rationale: O hofal de נכה é passivo, “ser golpeado”; עוֹד indica continuação ou acréscimo. “Ainda seriam golpeados” mantém tanto a passividade quanto a ideia de novos castigos.
- source_word: תּוֹסִיפוּ סָרָה
  choice: Vocês persistem na rebeldia
  rationale: 'יסף com סרה expressa continuidade: continuar ou acrescentar rebeldia. “Persistem” comunica a ação contínua e deliberada, preservando esta oração como declaração, não como uma segunda pergunta.'
- source_word: כָּל רֹאשׁ לָחֳלִי
  choice: A cabeça inteira está enferma
  rationale: כָּל com o singular coletivo descreve a totalidade da cabeça na imagem corporal da nação; “está enferma” expressa naturalmente a condição indicada por לָחֳלִי.
- source_word: וְכָל לֵבָב דַּוָּי
  choice: e o coração inteiro, abatido
  rationale: Mantém o paralelismo da imagem corporal. דַּוָּי pode indicar enfermidade, fraqueza ou estado de languidez; “abatido” conserva essa amplitude sem simplesmente repetir “enfermo”.
theological_decisions:
- issue: Sentido da pergunta inicial
  choice: Pergunta retórica sobre a inutilidade de novos golpes enquanto o povo persiste na rebeldia
  alternative: Pergunta sobre em que parte do corpo ainda poderiam cair novos golpes
  rationale: עַל־מֶה normalmente significa “por quê/para quê” neste contexto, e a oração seguinte explica a persistência rebelde. A leitura locativa continua possível por causa da imagem do corpo inteiramente enfermo e, por isso, é registrada em nota.
- issue: Força sintática de תּוֹסִיפוּ סָרָה
  choice: 'Declaração: “Vocês persistem na rebeldia”'
  alternative: 'Segunda pergunta: “Por que persistem na rebeldia?”'
  rationale: O hebraico não apresenta um segundo elemento interrogativo. Tratar a frase como declaração preserva sua sintaxe e a tensão entre os golpes sofridos e a rebeldia contínua.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e em outras comunidades lusófonas. A metáfora corporal coletiva e o paralelismo entre cabeça e coração foram preservados; a elipse de “está” no segundo membro dá fluidez sem alterar o sentido.
