revisions:
- from: Por que vocês ainda seriam golpeados?[a] Vocês persistem na rebeldia. A cabeça inteira está enferma, e o coração inteiro, abatido.
  to: Por que vocês seriam golpeados outra vez?[a] Vocês persistem na rebeldia. A cabeça inteira está doente, e todo o coração está debilitado.
  rationale: A revisão substitui uma expressão potencialmente ambígua de recorrência por «outra vez» e emprega «debilitado» para transmitir com maior precisão o campo semântico de דַּוָּי. Mantém-se a oração declarativa «Vocês persistem na rebeldia», pois o hebraico não introduz uma segunda pergunta, bem como a nota que registra a leitura locativa possível da pergunta inicial.
