  naturalness: “Ai, nação pecadora” é a formulação portuguesa corrente para uma exclamação profética de lamento e denúncia. “Filhos que agem corruptamente” evita a locução mais pesada “de modo corrupto”. “Afastaram-se, voltando para trás” conserva os dois componentes sem a construção pouco natural “afastaram-se para trás”.
