source:
  edition: WLC
  text: ה֣וֹי גּ֣וֹי חֹטֵ֗א עַ֚ם כֶּ֣בֶד עָוֺ֔ן זֶ֣רַע מְרֵעִ֔ים בָּנִ֖ים מַשְׁחִיתִ֑ים עָזְב֣וּ אֶת יְהוָ֗ה נִֽאֲצ֛וּ אֶת קְד֥וֹשׁ יִשְׂרָאֵ֖ל נָזֹ֥רוּ אָחֽוֹר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/004.yaml
  text: Ah[a], sinful nation, a people heavy with iniquity, offspring of evildoers[b], children who act corruptly! They have forsaken Yahweh; they have despised the Holy One of Israel[e][d][c]; they have turned backward.
translation:
  language: pt
  text: Ai[a], nação pecadora, povo carregado de iniquidade, descendência de malfeitores, filhos que agem corruptamente! Abandonaram Yahweh; desprezaram o Santo de Israel; afastaram-se, voltando para trás[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ah, nação pecadora!”. A interjeição hebraica pode expressar tanto lamento como denúncia.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “voltaram as costas” ou “tornaram-se estranhos e recuaram”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Ah
  rationale: A interjeição pode exprimir tanto lamento quanto denúncia. “Ah” conserva a força exclamativa sem restringi-la apenas a pesar ou ameaça.
- source_word: גּוֹי חֹטֵא
  choice: nação pecadora
  rationale: O particípio funciona como caracterização adjetiva e corporativa; a expressão é natural e fiel em português.
- source_word: עַם כֶּבֶד עָוֺן
  choice: povo carregado de iniquidade
  rationale: Conserva a metáfora do peso de כֶּבֶד e a amplitude moral de עָוֺן, que pode envolver tanto perversidade quanto culpa.
- source_word: זֶרַע מְרֵעִים
  choice: descendência de malfeitores
  rationale: Mantém a imagem coletiva e familiar de זֶרַע sem o possível sentido botânico de uma tradução estritamente literal.
- source_word: בָּנִים מַשְׁחִיתִים
  choice: filhos que agem de modo corrupto
  rationale: O particípio causativo descreve aqui conduta corruptora ou perversa; a formulação evita reduzi-lo a destruição literal.
- source_word: עָזְבוּ אֶת יְהוָה
  choice: Abandonaram Yahweh
  rationale: עָזַב indica abandonar ou deixar, e “abandonaram” comunica claramente a ruptura relacional e pactual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: נִאֲצוּ
  choice: desprezaram
  rationale: Expressa a rejeição marcada por desdém ou afronta contida no verbo.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: o Santo de Israel
  rationale: Preserva diretamente o título divino característico de Isaías.
- source_word: נָזֹרוּ אָחוֹר
  choice: afastaram-se para trás
  rationale: Mantém tanto a noção de alienação ou afastamento do verbo quanto a direção regressiva de אָחוֹר, embora a expressão hebraica admita outras formulações.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome pessoal divino; a transliteração o preserva sem convertê-lo em título.
- issue: Acusação corporativa e familiar
  choice: Manter “nação”, “povo”, “descendência” e “filhos”
  alternative: Uniformizar tudo como linguagem exclusivamente nacional ou genealógica
  rationale: A sobreposição de imagens coletivas e familiares intensifica a acusação pactual e deve ser preservada.
- issue: Sentido de נָזֹרוּ אָחוֹר
  choice: afastaram-se para trás
  alternative: voltaram as costas / tornaram-se estranhos e recuaram
  rationale: A opção principal conserva a combinação de alienação e movimento para trás sem eliminar a ambiguidade lexical, registrada em nota.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e alcance internacional. A estrutura poética acumula designações acusatórias e depois apresenta três ações paralelas. Emprega-se “iniquidade” por seu peso moral e teológico, sem linguagem denominacional.
