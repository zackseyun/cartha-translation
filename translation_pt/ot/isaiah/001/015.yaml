  text: וּ/בְ/פָרִשְׂ/כֶ֣ם כַּפֵּי/כֶ֗ם אַעְלִ֤ים עֵינַ/י֙ מִ/כֶּ֔ם גַּ֛ם כִּֽי תַרְבּ֥וּ תְפִלָּ֖ה אֵינֶ֣/נִּי שֹׁמֵ֑עַ יְדֵי/כֶ֖ם דָּמִ֥ים מָלֵֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/015.yaml
  text: And when you spread out your palms[a], I hide my eyes from you; even though you multiply prayers, I am not listening[c][b]. Your hands are full of blood.
translation:
  language: pt
  text: E, quando vocês estendem as palmas das mãos[a], desvio de vocês os meus olhos; ainda que façam muitas orações, não estou ouvindo[b]. As mãos de vocês estão cheias de sangue[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as mãos”. O hebraico diz especificamente “as palmas”, evocando o gesto de estender ou erguer as mãos em oração.
    reason: lexical_alternative
  - marker: b
    text: Ou “não ouço” ou “não ouvirei”. A expressão hebraica pode ser traduzida mais formalmente dessas maneiras, mas indica aqui a recusa contínua de Deus em acolher as orações.
    reason: lexical_alternative
  - marker: c
    text: “Sangue” também pode ser entendido como “derramamento de sangue” ou “culpa de sangue”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְפָרִשְׂכֶם
  choice: E quando vocês estendem
  rationale: A construção com infinitivo tem sentido temporal. “Estendem” exprime de modo natural o gesto de abrir ou erguer as mãos em oração.
- source_word: כַּפֵּיכֶם
  choice: as palmas das mãos
  rationale: כַּף designa especificamente a palma ou concavidade da mão; a expressão preserva a imagem concreta do gesto de oração.
- source_word: אַעְלִים עֵינַי מִכֶּם
  choice: escondo de vocês os meus olhos
  rationale: Mantém a imagem antropomórfica e a relação sintática do hebraico, comunicando a recusa deliberada de olhar favoravelmente para eles.
- source_word: גַּם כִּי
  choice: mesmo que
  rationale: 'Introduz a concessão: por mais que aumentem suas orações, Deus se recusa a ouvi-las.'
- source_word: תַרְבּוּ תְפִלָּה
  choice: multipliquem as orações
  rationale: Conserva a ênfase do hebraico em tornar numerosas as orações, com formulação compreensível em português.
- source_word: אֵינֶנִּי שֹׁמֵעַ
  choice: não estou ouvindo
  rationale: A negativa com o particípio apresenta uma recusa contínua; a forma progressiva preserva essa força sem eliminar a possibilidade formal de “não ouço”.
- source_word: יְדֵיכֶם
  choice: As mãos de vocês
  rationale: O termo comum para “mãos” contrasta com “palmas” no início, passando do gesto religioso à culpa moral.
- source_word: דָּמִים
  choice: sangue
  rationale: O plural hebraico pode indicar sangue derramado ou culpa de sangue. “Sangue” mantém a imagem forte e sua amplitude sem decidir entre essas nuances.
- source_word: מָלֵאוּ
  choice: estão cheias de
  rationale: O perfeito descreve uma condição presente resultante de atos anteriores; esta é uma formulação natural e direta em português.
theological_decisions:
- issue: Linguagem antropomórfica sobre a recusa divina do culto
  choice: Preservar “escondo de vocês os meus olhos” e “não estou ouvindo”.
  alternative: “Ignoro vocês” ou “recuso-me a dar atenção a vocês”.
  rationale: As imagens corporais do hebraico comunicam com força a rejeição do culto hipócrita. Mantê-las evita suavizar ou explicar teologicamente o texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. A ordem “escondo de vocês os meus olhos” retém deliberadamente a imagem e a estrutura semítica, ainda inteligíveis em português. Os marcadores foram colocados junto às expressões correspondentes, e todas as alternativas relevantes foram registradas nas notas.
