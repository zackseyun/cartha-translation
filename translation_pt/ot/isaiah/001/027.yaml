review_pass:
  verdict: revise
  source_fidelity: 'A primeira cola preserva bem o sentido instrumental de בְּמִשְׁפָּט e o nifal de פדה. Porém, “os que nela voltarem” não expressa naturalmente o sufixo de וְשָׁבֶיהָ: a leitura espacial mais direta é a de pessoas que voltam a Sião, não pessoas que voltam nela. “Os que voltarem para ela” conserva essa leitura sem tornar obrigatório o sentido de arrependimento, que permanece registrado em nota.'
  naturalness: “Sião será resgatada por meio da justiça” é claro e digno. A substituição de “nela” por “para ela” resolve uma construção pouco natural e semanticamente imprecisa. “Retidão” é um equivalente moderno e adequado para צדקה neste paralelismo.
  terminology: '“Sião”, “justiça”, “resgatada” e “retidão” são escolhas adequadas. A nota deve formular a alternativa moral de modo idiomático: “os que se arrependem”, em vez de “os seus arrependidos”.'
  issues:
