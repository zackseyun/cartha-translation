    issue: “os que nela voltarem”
    rationale: Em português, a expressão sugere retorno dentro de Sião e não retorno a Sião. O sufixo em וְשָׁבֶיהָ admite a leitura de “os que voltam para ela”; essa é a forma espacial natural a preservar no texto.
  - severity: low
    issue: “os seus arrependidos” na nota
    rationale: A formulação é pouco idiomática em português atual. “Os que se arrependem” comunica a mesma alternativa interpretativa com clareza, sem aumentar sua força teológica.
  revised_text: Sião será resgatada por meio da justiça, e os que voltarem para ela[a], por meio da retidão.
  revised_footnotes:
