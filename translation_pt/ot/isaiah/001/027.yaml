  text: צִיּ֖וֹן בְּ/מִשְׁפָּ֣ט תִּפָּדֶ֑ה וְ/שָׁבֶ֖י/הָ בִּ/צְדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/027.yaml
  text: Zion will be redeemed by justice[a], and her returnees by righteousness.
translation:
  language: pt
  text: Sião será resgatada por meio da justiça, e os que voltarem para ela[a], por meio da retidão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que se arrependem”. O particípio hebraico do verbo “voltar” pode indicar tanto retorno quanto arrependimento.
    reason: alternative_reading
lexical_decisions:
- source_word: צִיּוֹן
  choice: Sião
  rationale: Forma tradicional e amplamente reconhecida em português para o nome próprio hebraico.
- source_word: בְּמִשְׁפָּט
  choice: por meio da justiça
  rationale: מִשְׁפָּט pode significar juízo ou justiça; aqui, o contexto restaurador favorece “justiça”, e בְּ indica o meio pelo qual ocorre o resgate.
- source_word: תִּפָּדֶה
  choice: será resgatada
  rationale: O nifal de פדה expressa ser resgatado ou redimido. “Resgatada” é natural em português e preserva a ideia de libertação mediante redenção.
- source_word: וְשָׁבֶיהָ
  choice: e os que nela voltarem
  rationale: O particípio de שוב com sufixo feminino admite referência aos que voltam, quer em sentido espacial, quer moral. A formulação mantém o verbo “voltar” e evita decidir silenciosamente entre retorno e arrependimento.
- source_word: בִּצְדָקָה
  choice: por meio da retidão
  rationale: צְדָקָה denota retidão ou justiça. “Retidão” conserva a distinção lexical em relação a מִשְׁפָּט e mantém o paralelismo.
theological_decisions:
- issue: Sentido de וְשָׁבֶיהָ no contexto profético
  choice: os que nela voltarem
  alternative: os seus arrependidos; os que voltarem para ela
  rationale: O hebraico pode indicar pessoas que retornam espacialmente ou que se voltam moralmente. A tradução preserva essa tensão tanto quanto possível, e a nota explicita as leituras sem impor uma interpretação doutrinária.
translation_notes:
  register: Português atual, digno e de leitura ampla. “Por meio de” explicita o valor instrumental da preposição hebraica; a elipse verbal no segundo membro preserva o paralelismo poético.
