  text: שִׁמְע֤וּ שָׁמַ֨יִם֙ וְ/הַאֲזִ֣ינִי אֶ֔רֶץ כִּ֥י יְהוָ֖ה דִּבֵּ֑ר בָּנִים֙ גִּדַּ֣לְתִּי וְ/רוֹמַ֔מְתִּי וְ/הֵ֖ם פָּ֥שְׁעוּ בִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/002.yaml
  text: 'Hear[a], O heavens, and give ear, O earth, for Yahweh has spoken: “I have reared children and brought them up[b], but they have rebelled against me.”'
translation:
  language: pt
  text: 'Ouçam, ó céus, e escute, ó terra, pois Yahweh falou: “Criei filhos e os engrandeci[a], mas eles se rebelaram contra mim.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os fiz crescer” ou “os exaltei”. O segundo verbo pode indicar elevar, engrandecer ou conferir honra; no contexto da imagem de um pai, também pode completar a ideia de criar os filhos até que cresçam.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Ouçam
  rationale: O imperativo plural convoca os céus a ouvir atentamente; “ouçam” é natural em português e conserva a solenidade profética.
- source_word: שָׁמַיִם
  choice: ó céus
  rationale: O plural designa os céus como testemunhas cósmicas; “ó” marca o vocativo e mantém o registro elevado.
- source_word: הַאֲזִינִי
  choice: escute
  rationale: O imperativo feminino singular concorda com אֶרֶץ e forma paralelismo com “ouçam”; “escute” comunica atenção sem recorrer ao pouco natural “dê ouvidos” dirigido à terra.
- source_word: אֶרֶץ
  choice: ó terra
  rationale: Em paralelo com “céus”, refere-se à terra como testemunha cósmica, e não apenas à terra de Israel.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão para a convocação dos céus e da terra.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: דִּבֵּר
  choice: falou
  rationale: O perfeito apresenta a declaração divina como proferida de modo solene e completo; o pretérito perfeito é idiomático antes da citação.
- source_word: בָּנִים
  choice: filhos
  rationale: Preserva a metáfora filial direta e o masculino plural hebraico; no contexto, designa corporativamente o povo, não apenas indivíduos do sexo masculino.
- source_word: גִּדַּלְתִּי
  choice: Criei
  rationale: No contexto parental, o verbo significa criar, fazer crescer ou educar filhos; “criei” é corrente e digno em português.
- source_word: רוֹמַמְתִּי
  choice: os engrandeci
  rationale: Conserva a contribuição semântica de elevar, honrar ou tornar grande, sem reduzir o segundo verbo a mera repetição da criação dos filhos.
- source_word: פָּשְׁעוּ
  choice: se rebelaram
  rationale: Expressa revolta contra a autoridade legítima e preserva a dimensão relacional e pactual do verbo.
- source_word: בִי
  choice: contra mim
  rationale: Com פָּשַׁע, a preposição indica o alvo da rebelião.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome próprio divino; a transliteração o preserva sem substituí-lo por um título.
- issue: Alcance de בָּנִים
  choice: filhos
  alternative: crianças
  rationale: “Filhos” mantém a relação filial entre Yahweh e seu povo. Embora a forma seja masculina plural, o referente corporativo abrange o povo; a tradução não restringe a acusação aos homens.
- issue: Relação entre גִּדַּלְתִּי e רוֹמַמְתִּי
  choice: Criei filhos e os engrandeci
  alternative: Criei filhos e os fiz crescer
  rationale: 'A opção mantém distintos os dois verbos: o primeiro evoca criação e crescimento, e o segundo elevação, honra ou grandeza. A nota registra a alternativa contextual ligada à formação dos filhos.'
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. O paralelismo dos dois imperativos e o vocativo poético foram preservados. Evitou-se apagar a diferença semântica entre os dois verbos referentes ao cuidado e à elevação dos filhos.
