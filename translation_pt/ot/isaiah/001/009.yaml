id: ISA.1.9
reference: Isaiah 1:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לוּלֵי֙ יְהוָ֣ה צְבָא֔וֹת הוֹתִ֥יר לָ֛/נוּ שָׂרִ֖יד כִּ/מְעָ֑ט כִּ/סְדֹ֣ם הָיִ֔ינוּ לַ/עֲמֹרָ֖ה דָּמִֽינוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/009.yaml
  text: If Yahweh of hosts had not left us a very small remnant[a], we would have become like Sodom; we would have resembled Gomorrah.
translation:
  language: pt
  text: Se Yahweh dos Exércitos não nos tivesse deixado um remanescente muito pequeno[a], teríamos sido como Sodoma; teríamos ficado semelhantes a Gomorra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não tivesse preservado para nós uns poucos sobreviventes”.'
    reason: Alternativa lexical que explicita o sentido coletivo de שָׂרִיד e traduz הוֹתִיר como “preservado”.
lexical_decisions:
- source_word: לוּלֵי
  choice: Se ... não tivesse
  rationale: Introduz uma condição contrária ao fato no passado; esta construção expressa isso de modo natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Preserva o título hebraico tradicional e sua referência abrangente às hostes ou forças sob o comando divino.
- source_word: הוֹתִיר
  choice: tivesse deixado
  rationale: O hifil de יתר significa deixar restar ou preservar; “deixado” mantém a formulação concisa e combina naturalmente com “remanescente”.
- source_word: שָׂרִיד
  choice: remanescente
  rationale: Embora formalmente singular, o termo tem sentido coletivo e preserva o motivo profético daqueles que restaram.
- source_word: כִּמְעָט
  choice: muito pequeno
  rationale: Com “remanescente”, indica quantidade ou extensão mínima; a expressão é clara e natural em português.
- source_word: כִּסְדֹם
  choice: como Sodoma
  rationale: A preposição כ marca uma comparação direta.
- source_word: הָיִינוּ
  choice: teríamos sido
  rationale: Mantém o sentido básico de היה e expressa corretamente o resultado contrafactual.
- source_word: לַעֲמֹרָה
  choice: a Gomorra
  rationale: Emprega a forma convencional do nome próprio em português, com a preposição exigida pela construção comparativa.
- source_word: דָּמִינוּ
  choice: teríamos ficado semelhantes
  rationale: Expressa o sentido de parecer-se ou tornar-se semelhante, distinguindo o verbo do paralelo anterior sem eliminar o paralelismo.
theological_decisions:
- issue: Tradução do título divino יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  alternative: SENHOR dos Exércitos; Yahweh das hostes
  rationale: Mantém explicitamente o nome divino presente no hebraico e conserva a amplitude tradicional de צְבָאוֹת sem restringi-lo apenas a exércitos humanos.
- issue: Linguagem do remanescente
  choice: um remanescente muito pequeno
  alternative: poucos sobreviventes
  rationale: Preserva tanto o sentido lexical quanto o motivo profético do remanescente, enquanto a nota registra a leitura coletiva mais concreta.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção contrafactual foi mantida, assim como o paralelismo entre Sodoma e Gomorra; o nome divino aparece transliterado como “Yahweh”.
