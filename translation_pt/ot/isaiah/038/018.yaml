  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י לֹ֥א שְׁא֛וֹל תּוֹדֶ֖/ךָּ מָ֣וֶת יְהַלְלֶ֑/ךָּ לֹֽא יְשַׂבְּר֥וּ יֽוֹרְדֵי ב֖וֹר אֶל אֲמִתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/018.yaml
  text: For Sheol does not thank you[a]; death does not praise you[b]; those who go down to the pit do not hope for your faithfulness.
translation:
  language: pt
  text: Pois o Sheol não te dá graças[a], nem a morte te louva; os que descem à cova não esperam por tua fidelidade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a sepultura” ou “o domínio dos mortos”, em lugar de “Sheol”.
    reason: lexical_alternative
  - marker: b
    text: Ou “não aguardam tua verdade”. O hebraico também pode ser traduzido por “não esperam por tua verdade/fidelidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: Mantém o conceito hebraico do domínio dos mortos, mais amplo que uma simples sepultura, sem o reduzir por interpretação.
- source_word: תּוֹדֶךָּ
  choice: te dá graças
  rationale: O hifil de ידה exprime dar graças ou louvar; esta escolha preserva uma distinção natural em relação a יְהַלְלֶךָּ no membro paralelo.
- source_word: מָוֶת
  choice: a morte
  rationale: Tradução lexical direta, com a personificação poética presente no paralelismo com o Sheol.
- source_word: יְהַלְלֶךָּ
  choice: te louva
  rationale: O piel de הלל significa regularmente louvar; a formulação é natural e digna em português.
- source_word: יְשַׂבְּרוּ
  choice: esperam em
  rationale: O piel de שׂבר comunica espera confiante ou esperança. Com 'fidelidade', 'esperar em' soa natural e conserva a orientação de confiança.
- source_word: יוֹרְדֵי בוֹר
  choice: os que descem à cova
  rationale: Preserva a expressão participial e a imagem concreta de descer ao domínio da morte.
- source_word: בּוֹר
  choice: cova
  rationale: Neste contexto poético, בּוֹר representa a cova ou fosso associado à morte; 'cova' é clara em português e mantém a imagem sem a achatar simplesmente para 'sepultura'.
- source_word: אֲמִתֶּךָ
  choice: tua fidelidade
  rationale: אֱמֶת pode significar verdade, fidelidade ou confiabilidade. Aqui, como objeto da espera confiante, 'fidelidade' expressa adequadamente a confiabilidade de Deus, mantendo 'verdade' como alternativa genuína.
theological_decisions:
- issue: O que o versículo afirma sobre os mortos e o louvor
  choice: Traduzir a afirmação poética sem acrescentar uma explicação doutrinária sobre o estado dos mortos.
  alternative: Entendê-la como afirmação ontológica de que os mortos são totalmente incapazes de qualquer relação consciente com Deus, ou limitá-la explicitamente ao louvor público terreno.
  rationale: O hebraico declara que o Sheol não dá graças, a morte não louva e os que descem à cova não esperam na fidelidade de Deus. A tradução deve conservar essa tensão poética e não inserir uma conclusão sistemática que o próprio verso não explicita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. 'Sheol' preserva o termo cultural hebraico e é explicado em nota; 'dá graças' e 'louva' mantêm a variação verbal do paralelismo. A ordem poética foi conservada sem rigidez artificial.
