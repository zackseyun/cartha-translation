review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva bem o paralelismo e os principais termos: Sheol, morte, louvor, a descida à cova e a fidelidade divina. Contudo, «esperam em tua fidelidade» tende, em português, a significar «depositam confiança em tua fidelidade», enquanto o hebraico יְשַׂבְּרוּ toma «tua fidelidade/verdade» como aquilo que os que descem à cova aguardam ou pelo qual esperam. «Esperam por tua fidelidade» reproduz mais precisamente essa relação sem resolver a ambiguidade lexical.'
  naturalness: «Pois o Sheol não te dá graças, nem a morte te louva; os que descem à cova não esperam por tua fidelidade» é claro, poético e natural em português moderno. «Dar graças» mantém adequadamente a distinção de «louvar».
  terminology: «Sheol» é uma retenção apropriada do termo hebraico e a nota oferece alternativas úteis. «Cova» preserva a imagem de בּוֹר. «Fidelidade» é uma opção contextual plausível para אֱמֶת, devendo-se conservar «verdade» como alternativa em nota.
  issues:
  - severity: medium
    issue: Regência e nuance de «esperam em tua fidelidade»
    rationale: «Esperar em» normalmente exprime confiar em alguém ou algo; o hebraico, com אֶל, comunica esperar por/aguardar a fidelidade ou verdade de Deus. A troca por «esperam por» evita essa leve mudança semântica.
  revised_text: Pois o Sheol não te dá graças[a], nem a morte te louva; os que descem à cova não esperam por tua fidelidade[b].
