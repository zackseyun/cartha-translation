  rationale: A única alteração é «em» para «por», para refletir com maior precisão a construção hebraica e evitar que a tradução principal transforme a espera pela fidelidade de Deus em confiança nela. O restante do texto e das notas é fiel, claro e preserva a tensão poética do versículo sem impor uma conclusão doutrinária.
