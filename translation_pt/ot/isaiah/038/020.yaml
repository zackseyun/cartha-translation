base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/020.yaml
  text: Yahweh is ready to save me[c][b][a]; and we will play my songs on stringed instruments all the days of our lives at the house of Yahweh.
translation:
  language: pt
  text: Yahweh está pronto para me salvar[a]; e tocaremos as minhas melodias em instrumentos de cordas[b] todos os dias de nossas vidas, junto à casa de Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Yahweh me salvará»; mais literalmente: «Yahweh, para me salvar». A expressão hebraica é elíptica.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «minha música» ou «minha música instrumental».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «na casa de Yahweh».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְהוֹשִׁיעֵנִי
  choice: está pronto para me salvar
  rationale: A construção hebraica é elíptica, literalmente algo como «Yahweh, para me salvar». Em contexto, a formulação escolhida exprime de modo natural sua ação ou disposição salvadora sem ocultar a elipse, registrada em nota.
- source_word: וּנְגִינוֹתַי
  choice: minhas músicas de cordas
  rationale: O substantivo designa música ou composições associadas a instrumentos de cordas; a tradução conserva tanto o possessivo quanto a nuance instrumental.
- source_word: נְנַגֵּן
  choice: tocaremos
  rationale: O piel imperfeito de נגן indica tocar um instrumento ou fazer música. «Tocaremos» combina naturalmente com «músicas de cordas».
- source_word: כָּל יְמֵי חַיֵּינוּ
  choice: todos os dias de nossa vida
  rationale: Reproduz em português corrente o idioma hebraico que indica duração por toda a vida, preservando a perspectiva coletiva da primeira pessoa do plural.
- source_word: עַל בֵּית יְהוָה
  choice: na casa de Yahweh
  rationale: Aqui עַל tem valor locativo ligado ao lugar de culto. «Na casa» é português natural, embora «junto à casa» também seja possível.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama. «Yahweh» preserva o nome pessoal e evita substituí-lo por um título.
- issue: Força da expressão elíptica לְהוֹשִׁיעֵנִי
  choice: está pronto para me salvar
  alternative: me salvará
  rationale: A forma hebraica não contém verbo finito explícito. A tradução principal comunica a disposição ou ação salvadora sugerida pelo contexto, enquanto a nota preserva a possibilidade de entendê-la como futuro simples.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. «Músicas de cordas» explicita de maneira concisa a natureza instrumental do termo; as notas preservam a elipse verbal e a amplitude locativa do hebraico.
