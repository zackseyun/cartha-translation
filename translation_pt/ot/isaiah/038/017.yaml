  source_fidelity: A abertura e a conclusão reproduzem bem o hebraico, inclusive a ênfase de מַר לִי מָר e a metáfora de lançar os pecados para trás das costas. Contudo, “preservaste” traduz apenas o resultado contextual de חָשַׁקְתָּ e deixa de representar seu sentido lexical central de apego ou amor. A formulação revista explicita esse valor sem perder o livramento implícito pela construção.
  naturalness: O português do rascunho é claro, digno e acessível. “Por amor à minha vida, tu a livraste” é natural em português moderno e mais transparente do que empregar “preservaste” como equivalente isolado do verbo hebraico.
  terminology: “Vida”, “cova da destruição” e “pecados” são escolhas adequadas ao contexto. A revisão preserva “vida” para נַפְשִׁי e torna visível o componente afetivo de חָשַׁקְתָּ, sem impor uma formulação doutrinária além do texto.
