  text: הִנֵּ֥ה לְ/שָׁל֖וֹם מַר לִ֣/י מָ֑ר וְ/אַתָּ֞ה חָשַׁ֤קְתָּ נַפְשִׁ/י֙ מִ/שַּׁ֣חַת בְּלִ֔י כִּ֥י הִשְׁלַ֛כְתָּ אַחֲרֵ֥י גֵוְ/ךָ֖ כָּל חֲטָאָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/017.yaml
  text: Behold[a], for my peace I had great bitterness; but you have held my soul back from the pit of destruction, for you have cast all my sins behind your back.
translation:
  language: pt
  text: Eis que, para a minha paz, passei por grande amargura; mas, por amor à minha vida, tu a livraste da cova da destruição, pois lançaste todos os meus pecados para trás das tuas costas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְשָׁלוֹם
  choice: para a minha paz
  rationale: Preserva a preposição לְ e a amplitude de שָׁלוֹם — paz, bem-estar e integridade — sem definir de modo excessivo a relação entre a aflição e seu resultado.
- source_word: מַר לִי מָר
  choice: passei por grande amargura
  rationale: Reproduz de modo natural a intensidade enfática da repetição hebraica da raiz ligada à amargura.
- source_word: חָשַׁקְתָּ
  choice: preservaste
  rationale: No contexto de livramento da morte, expressa o efeito protetor do apego ou amor indicado pelo verbo; a leitura mais literalmente afetiva é mantida em nota.
- source_word: נַפְשִׁי
  choice: a minha vida
  rationale: Aqui נֶפֶשׁ se refere naturalmente à vida ou à própria pessoa de Ezequias, ameaçada pela morte; “vida” comunica o sentido contextual com clareza.
- source_word: מִשַּׁחַת בְּלִי
  choice: da cova da destruição
  rationale: Mantém a imagem concreta de שַׁחַת e o sentido intensificado de ruína presente na expressão, sem reduzi-la simplesmente à sepultura.
- source_word: הִשְׁלַכְתָּ אַחֲרֵי גֵוְךָ
  choice: lançaste ... para trás das tuas costas
  rationale: Conserva a metáfora vívida do hebraico, que comunica remoção da vista e da consideração divina.
- source_word: חֲטָאַי
  choice: meus pecados
  rationale: É a tradução direta e teologicamente transparente do plural חֲטָאַי.
theological_decisions:
- issue: Se חָשַׁקְתָּ נַפְשִׁי deve destacar principalmente o amor divino ou o livramento protetor
  choice: 'O texto principal destaca o resultado protetor: “preservaste a minha vida”.'
  alternative: “amaste a minha vida, livrando-a da cova da destruição” ou “apegaste-te à minha vida”.
  rationale: O verbo pode indicar amor ou profundo apego, enquanto a construção com “da cova da destruição” aponta para o livramento da morte. A tradução principal comunica o resultado contextual, e a nota preserva a leitura afetiva lexicalmente plausível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A abertura mantém deliberadamente a formulação compacta e ambígua do hebraico; a imagem de lançar os pecados para trás das costas também foi preservada.
