- from: 'Eu disse: “Não verei Yah, Yah, na terra dos viventes[a]; não contemplarei mais nenhum ser humano entre os habitantes do mundo que cessa[b]”.'
  to: 'Eu disse: “Não verei Yah, Yah, na terra dos viventes[a]; não contemplarei mais nenhum ser humano com os habitantes do mundo da cessação[b].”'
  rationale: A revisão substitui a construção pouco natural «mundo que cessa» por «mundo da cessação», que reflete de modo mais preciso o caráter nominal e obscuro de חָדֶל, sem impor a interpretação «mundo dos mortos». Também troca «entre» por «com» para representar mais diretamente עִם. As notas, os marcadores e o sentido do versículo são preservados.
