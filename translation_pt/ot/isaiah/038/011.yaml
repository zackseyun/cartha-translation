  text: אָמַ֨רְתִּי֙ לֹא אֶרְאֶ֣ה יָ֔הּ יָ֖הּ בְּ/אֶ֣רֶץ הַ/חַיִּ֑ים לֹא אַבִּ֥יט אָדָ֛ם ע֖וֹד עִם י֥וֹשְׁבֵי חָֽדֶל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/011.yaml
  text: I said[a], “I will not see Yah, Yah in the land of the living[b]; I will no longer look on man among the inhabitants of cessation.”
translation:
  language: pt
  text: 'Eu disse: “Não verei Yah, Yah, na terra dos viventes[a]; não contemplarei mais nenhum ser humano com os habitantes do mundo da cessação[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Yah, Yah”, forma poética abreviada do nome divino; muitas traduções trazem “o SENHOR”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “não contemplarei mais nenhum ser humano com os habitantes de Hadel”. A expressão final é difícil; חָדֶל pode sugerir cessação, fragilidade ou um domínio separado da vida comum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Eu disse
  rationale: O qal perfeito na primeira pessoa introduz diretamente o lamento de Ezequias; “pensei” seria possível no contexto, mas é menos literal.
- source_word: לֹא אֶרְאֶה
  choice: Não verei
  rationale: A forma verbal negada expressa a privação futura que o falante prevê.
- source_word: יָהּ יָהּ
  choice: Yah, Yah
  rationale: Mantém a forma poética abreviada do nome divino e sua repetição enfática, sem confundi-la com o tetragrama completo.
- source_word: בְּאֶרֶץ הַחַיִּים
  choice: na terra dos viventes
  rationale: Reproduz o conhecido idioma hebraico para o domínio dos que estão vivos, em contraste com a morte.
- source_word: לֹא אַבִּיט ... עוֹד
  choice: não contemplarei mais
  rationale: Preserva o paralelismo visual com “verei”; “mais” comunica naturalmente o valor de עוֹד sob negação.
- source_word: אָדָם
  choice: nenhum ser humano
  rationale: No contexto da oração negativa, expressa naturalmente a perda de todo convívio humano sem limitar o referente ao sexo masculino.
- source_word: עִם יֹשְׁבֵי
  choice: entre os habitantes
  rationale: “Entre” comunica a localização no meio de uma comunidade, embora עִם também possa ser vertido literalmente por “com”.
- source_word: חָדֶל
  choice: mundo que cessa
  rationale: A expressão preserva a ideia lexical de cessar e a obscuridade do termo raro, evitando identificá-lo categoricamente com o mundo dos mortos.
theological_decisions:
- issue: Forma do nome divino יָהּ
  choice: Yah, Yah
  alternative: SENHOR, SENHOR; Yahweh
  rationale: O texto traz duas vezes a forma abreviada יָהּ, não o tetragrama completo; a transliteração conserva tanto a forma quanto a ênfase.
- issue: Referente do raro חָדֶל
  choice: mundo que cessa
  alternative: mundo dos mortos; lugar da cessação; mundo transitório
  rationale: A escolha mantém a tensão entre cessação, fragilidade e afastamento da vida comum, sem impor uma identificação específica que o hebraico não torna inequívoca.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. “Viventes” conserva o tom poético tradicional; “mundo que cessa” mantém deliberadamente a estranheza e a ambiguidade da expressão hebraica rara. Todos os marcadores de nota aparecem no texto.
