    issue: «mundo que cessa» para חָדֶל
    rationale: 'A formulação portuguesa é semanticamente imprecisa e pouco natural: sugere um mundo que está cessando, ao passo que o hebraico emprega um termo nominal raro associado a cessação/fraqueza. «Mundo da cessação» preserva melhor tanto a função nominal quanto a ambiguidade.'
  - severity: low
    issue: «entre os habitantes» para עִם יֹשְׁבֵי
    rationale: «Entre» é interpretativo; עִם significa primariamente «com». «Com os habitantes» mantém o vínculo social e a construção do original, sem tornar a leitura menos compreensível.
