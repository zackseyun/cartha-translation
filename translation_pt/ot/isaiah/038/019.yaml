  text: חַ֥י חַ֛י ה֥וּא יוֹדֶ֖/ךָ כָּמ֣וֹ/נִי הַ/יּ֑וֹם אָ֣ב לְ/בָנִ֔ים יוֹדִ֖יעַ אֶל אֲמִתֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/019.yaml
  text: The living[a], the living—he gives thanks to you, as I do today[b]; a father makes your faithfulness known to children.
translation:
  language: pt
  text: Quem está vivo, quem está vivo, esse te dá graças, como eu faço hoje; um pai dá a conhecer aos filhos a tua fidelidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “verdade”. O termo hebraico אֱמֶת pode indicar verdade, fidelidade ou confiabilidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי חַי
  choice: Quem está vivo, quem está vivo
  rationale: Preserva a repetição enfática do hebraico e expressa de modo natural em português o adjetivo substantivado, referindo-se à pessoa viva.
- source_word: יוֹדֶךָ
  choice: esse te dá graças
  rationale: O hifil de ידה, neste cântico de gratidão, indica dar graças ou louvar a Deus. “Dá graças” mantém o sentido específico do contexto.
- source_word: כָּמוֹנִי הַיּוֹם
  choice: como eu hoje
  rationale: Mantém a concisão e a comparação do hebraico; o sentido verbal é recuperado naturalmente da oração anterior.
- source_word: אָב לְבָנִים
  choice: o pai ... aos filhos
  rationale: Traduz diretamente a relação geracional. Em português, “filhos” pode designar coletivamente a descendência, sem exigir explicitação adicional.
- source_word: יוֹדִיעַ
  choice: dá a conhecer
  rationale: Reproduz o valor causativo do hifil de ידע sem restringi-lo ao ensino formal.
- source_word: אֲמִתֶּךָ
  choice: tua fidelidade
  rationale: No contexto da transmissão entre gerações do testemunho acerca do caráter de Deus, “fidelidade” comunica bem sua confiabilidade, sem ocultar a alternativa lexical “verdade”.
theological_decisions:
- issue: Nuance semântica de אֱמֶת aplicada a Deus
  choice: fidelidade
  alternative: verdade
  rationale: “Fidelidade” se ajusta ao testemunho sobre o caráter confiável de Deus, enquanto a nota preserva a possibilidade legítima de entender o termo como “verdade”.
- issue: Alcance de בָּנִים
  choice: filhos
  alternative: crianças; descendentes
  rationale: “Filhos” corresponde formalmente ao hebraico e, no uso coletivo do português, pode abranger a geração seguinte sem afirmar que apenas homens estejam em vista.
translation_notes:
  register: Português moderno, claro e digno, com formulação de ampla compreensão e boa legibilidade brasileira. A repetição enfática do original foi mantida; “esse” retoma e destaca o sujeito sem tornar a frase excessivamente literal.
